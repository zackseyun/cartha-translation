id: 2CO.1.21
reference: 2 Corinthians 1:21
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὁ δὲ βεβαιῶν ἡμᾶς σὺν ὑμῖν εἰς Χριστὸν καὶ χρίσας ἡμᾶς θεός,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/021.yaml
  text: But the one who establishes us with you in Messiah[a], and who anointed us, is God.
translation:
  language: ig
  text: Ma onye na-eme ka anyị na unu guzosie ike n’ime Mesaịa[a], onye tere anyị mmanụ, bụ Chineke.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “n’ime Kraịst.” Aha ọkwá ahụ n’asụsụ Grik bụ Christos; n’ebe a, a sụgharịrị ya “Mesaịa.”
    reason: alternative_reading
lexical_decisions:
- source_word: βεβαιῶν
  choice: na-eme ka anyị na unu guzosie ike
  rationale: Ọ na-egosi ime ka mmadụ guzosie ike ma ọ bụ bụrụ onye a kwadoro nke ọma. Usoro ngwaa na-aga n’ihu na-echekwa ọdịdị participle nke oge ugbu a.
- source_word: σὺν ὑμῖν
  choice: anyị na unu
  rationale: Nke a na-egosi na Pọl na ndị Kọrịnt so ọnụ nata omume Chineke ahụ.
- source_word: εἰς Χριστόν
  choice: n’ime Mesaịa
  rationale: Ọ bụ ezie na εἰς nwere ike ịpụta ‘banye n’ime,’ n’ebe a ọ na-egosi njikọ na iso Mesaịa dị n’otu. ‘N’ime’ bụ ụzọ Igbo doro anya isi chekwaa echiche ahụ n’ebughị ụzọ kọwaa ya karịa ihe odide kwuru.
- source_word: χρίσας
  choice: onye tekwara anyị mmanụ
  rationale: ‘Tee mmanụ’ na-echekwa ihe χρίω pụtara na njikọ okwu ya na aha Mesaịa, n’etinyeghị emume pụrụ iche nke ihe odide ahụ ekwughị.
- source_word: θεός
  choice: bụ Chineke
  rationale: E debere ‘Chineke’ n’azụ ahịrịokwu, dịka n’asụsụ Grik, ka ọ nata nkwusi ike.
- source_word: Χριστόν
  choice: Mesaịa
  rationale: E ji ‘Mesaịa’ gosi na Χριστός bụ aha ọkwá nke Onye E Tere Mmanụ; ndetu ala peeji na-enye ụdị ọdịnala ‘Kraịst.’
theological_decisions:
- issue: Ike εἰς n’okwu εἰς Χριστόν
  choice: njikọ na ịdị n’otu, nke a sụgharịrị ‘n’ime Mesaịa’
  alternative: ‘banye n’ime Mesaịa’ ma ọ bụ ‘n’ime Kraịst’
  rationale: ‘Banye n’ime’ ga-adị nso n’ụdị mkpụrụokwu Grik, ma n’ebe a okwu Pọl na-egosi njikọ na ịdị n’otu. ‘N’ime Mesaịa’ na-echekwa nghọta ahụ ma ghara ịkọwa kpọmkwem ụdị njikọ ahụ karịa ihe odide kwuru.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị mfe ma dị ùgwù. Usoro ahịrịokwu ahụ na-edebe ‘Chineke’ n’ikpeazụ maka nkwusi ike ma na-ejikọta Pọl na ndị Kọrịnt n’okwu ‘anyị na unu.’
