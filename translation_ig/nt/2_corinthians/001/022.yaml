source:
  edition: SBLGNT
  text: ὁ καὶ σφραγισάμενος ἡμᾶς καὶ δοὺς τὸν ἀρραβῶνα τοῦ πνεύματος ἐν ταῖς καρδίαις ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/022.yaml
  text: who also sealed us and gave the down payment of the Spirit in our hearts.
translation:
  language: ig
  text: onye kara anyị akara ma nyekwa anyị ego mbụ nke Mmụọ n’ime obi anyị.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “ego nkwụnye” ma ọ bụ “nkwa” nke Mmụọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: σφραγισάμενος
  choice: kakwaara anyị akara
  rationale: Nke a na-edobe ihe atụ nke ịka mmadụ akara dị ka ihe na-egosi onye nwe ya, nkwado, ma ọ bụ nchekwa, n’enweghị ịkọwa otu naanị n’ime ihe ndị ahụ.
- source_word: δοὺς
  choice: nyekwa
  rationale: E ji njikọ “ma ... kwa” mee participle a ka ọ soro nke bu ya ụzọ n’ụzọ Igbo na-asụkarị, ebe ihe abụọ ahụ ka na-adabere n’Onye a kpọtụrụ aha n’amaokwu bu ụzọ.
- source_word: ἀρραβῶνα
  choice: ego mbụ
  rationale: “Ego mbụ” na-edobe ihe atụ azụmahịa nke ụgwọ mbụ a na-akwụ nke na-egosi na a ga-emezu ihe fọdụrụ; ọ naghị agbanwe ya naanị ka ọ bụrụ echiche nkịtị nke nkwa.
- source_word: τοῦ πνεύματος
  choice: nke Mmụọ
  rationale: Nsụgharị a na-edobe genitive Grik n’ụzọ dị mkpirikpi ma ghara ikpebi n’ahịrị isi ma Mmụọ ahụ bụ ego mbụ ahụ n’onwe ya ma ọ bụ na ego mbụ ahụ si n’aka Mmụọ.
- source_word: ἐν ταῖς καρδίαις ἡμῶν
  choice: n’ime obi anyị
  rationale: Nke a na-egosi ebe ime mmadụ dị ka okwu Grik si kwuo, n’ụzọ doro anya ma bụrụkwa Igbo nkịtị.
- source_word: ὁ καὶ ... καὶ
  choice: onye ... kwa ... ma ... kwa
  rationale: “Onye” na-ejikọ nkebi a na Chineke a kpọtụrụ aha n’amaokwu bu ụzọ, ebe “kwa ... ma ... kwa” na-edobe njikọ omume abụọ ahụ.
theological_decisions:
- issue: Ihe ἀρραβών nke Mmụọ pụtara
  choice: E jiri “ego mbụ nke Mmụọ” debe ihe atụ nke ụgwọ mbụ na genitive ahụ n’ahịrị isi.
  alternative: “Mmụọ dị ka ihe nkwụnye ego” ma ọ bụ “Mmụọ dị ka ihe mmesi obi ike.”
  rationale: Nhọrọ ahụ na-edobe ihe atụ azụmahịa Pọl ji mee ihe ma na-ahapụ njikọ “nke Mmụọ” ka ọ nwee ịdị mkpirikpi na ntakịrị nghọta abụọ dị na Grik, kama idozi ya n’ụzọ ozizi n’ahịrị isi.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. “Ego mbụ” bụ okwu nkịtị maka ụgwọ mbụ nke na-ekwe nkwa mmezu nke ihe fọdụrụ; akara edemede [a] pụtara n’ahịrị isi dịka achọrọ.
