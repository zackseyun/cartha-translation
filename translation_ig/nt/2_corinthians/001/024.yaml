id: 2CO.1.24
reference: 2 Corinthians 1:24
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: οὐχ ὅτι κυριεύομεν ὑμῶν τῆς πίστεως, ἀλλὰ συνεργοί ἐσμεν τῆς χαρᾶς ὑμῶν, τῇ γὰρ πίστει ἑστήκατε.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/024.yaml
  text: Not that we lord it over your faith[a], but we are fellow workers for your joy[c][b], for you stand firm by faith.
translation:
  language: ig
  text: Ọ bụghị na anyị na-achị okwukwe unu dịka ndị nwe ya[a], kama anyị bụ ndị na-arụkọ ọrụ maka ọṅụ unu[b], n’ihi na ọ bụ site n’okwukwe ka unu ji guzosie ike[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ntụkwasị obi unu.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “anyị bụ ndị ọrụ ibe maka ọṅụ unu.”
    reason: lexical_alternative
  - marker: c
    text: Ma ọ bụ, “unu guzosiri ike n’okwukwe.”
    reason: alternative_reading
lexical_decisions:
- source_word: κυριεύομεν
  choice: na-achị ... dị ka ndị nwe ya
  rationale: Nke a na-egosipụta iji ikike dịka onye nwe ihe, ma na-edobe echiche ọjọọ nke ịchị mmadụ n’ike dị n’okwu Grik ahụ.
- source_word: ὑμῶν τῆς πίστεως
  choice: okwukwe unu
  rationale: Nke a bụ ụzọ Igbo doro anya ma bụrụkwa nke a na-ejikarị asụ πίστις n’ebe a; ‘ntụkwasị obi unu’ ka bụ ihe ọzọ okwu ahụ pụrụ ịpụta.
- source_word: συνεργοί
  choice: ndị na-arụkọ ọrụ
  rationale: Ọ na-egosi na Pọl na ndị ibe ya na ndị Kọrịnt na-arụkọ ọrụ, ọ bụghị na ha nọ n’elu ha dị ka ndị ọchịchị.
- source_word: τῆς χαρᾶς ὑμῶν
  choice: maka ọṅụ unu
  rationale: 'Ọ bụ ezie na okwu Grik ahụ dị n’ụdị genitive, n’ebe a ọ na-egosi nzube ma ọ bụ uru ọrụ ahụ bara: ịkwalite ọṅụ ha.'
- source_word: τῇ γὰρ πίστει
  choice: ọ bụ site n’okwukwe
  rationale: Nke a na-egosipụta okwukwe dịka ụzọ ma ọ bụ ntọala ha ji guzosie ike, ma e deberekwa ‘n’okwukwe’ n’ala ala peeji dịka ihe ọzọ nwere ike ịbụ.
- source_word: ἑστήκατε
  choice: unu ji guzosie ike
  rationale: Perfect tense nke Grik na-egosi ọnọdụ siri ike nke malitere ma ka na-adị; ‘guzosie ike’ na-ebute nke a n’Igbo nkịtị.
theological_decisions:
- issue: Ihe πίστις pụtara n’ebe abụọ ọ pụtara
  choice: okwukwe
  alternative: ntụkwasị obi; ikwesị ntụkwasị obi
  rationale: Ihe gbara amaokwu ahụ gburugburu na-ekwu banyere ọnọdụ ndị Kọrịnt nke ikwere na iguzosi ike, ọ bụghị kpọmkwem ikwesị ntụkwasị obi nke Kraịst. A hapụrụ ‘ntụkwasị obi’ dịka ihe ọzọ n’ala ala peeji.
- issue: Mmekọrịta ndị ozi na ọṅụ ndị Kọrịnt
  choice: anyị na unu bụ ndị na-arụkọ ọrụ maka ọṅụ unu
  alternative: anyị bụ ndị unu na ha na-arụkọ ọrụ maka ọṅụ unu; anyị bụ ndị na-arụkọ ọrụ nke ọṅụ unu
  rationale: συνεργοί na-egosi ọrụ e jikọrọ aka rụọ. Ntinye ‘na unu’ na-eme ka echiche nke iso ndị Kọrịnt arụkọ ọrụ pụta ìhè, n’agbanyeghị na enwere ike ịghọta okwu Grik ahụ dịka ndị ọrụ na-akwalite ọṅụ ha.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. Ahịrịokwu ahụ na-edobe ọdịiche dị n’etiti ịchị okwukwe ndị ọzọ dịka onye nwe ya na iso ha arụkọ ọrụ. Akara ala ala peeji niile [a], [b], na [c] pụtara n’ederede isi.
