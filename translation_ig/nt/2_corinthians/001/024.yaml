  to: Ọ bụghị na anyị na-achị okwukwe unu dịka ndị nwe ya[a], kama anyị bụ ndị na-arụkọ ọrụ maka ọṅụ unu[b], n’ihi na ọ bụ site n’okwukwe ka unu ji guzosie ike[c].
  rationale: The revision removes the unsupported explicit claim that Paul and his companions work together with the Corinthians, while preserving the sense that they are fellow workers whose work serves the Corinthians’ joy. Footnote b is adjusted to provide an actual lexical alternative. The remaining renderings and anchors are retained because they faithfully and naturally represent the Greek.
