    rationale: “Nna Ukwu” means a great/fatherly senior figure, not ‘master’ or ‘lord,’ and thus fails to represent the lexical alternative indicated by κυρίου.
  - severity: low
    issue: The phrase “Jizọs bụ Mezaya” is slightly abrupt in this embedded noun phrase.
    rationale: “Jizọs onye bụ Mezaya” is more natural Standard Igbo while retaining the appositional/title sense of Ἰησοῦ Χριστοῦ.
