  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Εὐλογητὸς ὁ θεὸς καὶ πατὴρ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ, ὁ πατὴρ τῶν οἰκτιρμῶν καὶ θεὸς πάσης παρακλήσεως,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/003.yaml
  text: Blessed be the God and Father of our Lord Jesus the Messiah[a], the Father of mercies and God of all comfort[d][c][b],
translation:
  language: ig
  text: Ka a gọzie Chineke, onye bụkwa Nna nke Onyenwe anyị[b] Jizọs onye bụ Mezaya[a], Nna nke ebere[c], na Chineke nke nkasi obi niile[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Jizọs Kraịst.”
    reason: alternative_reading
  - marker: b
    text: Ma ọ bụ, “Onye nwe anyị.”
    reason: lexical_alternative
  - marker: c
    text: Ma ọ bụ, “ọmịiko” ma ọ bụ “ọrụ ebere.” Okwu Grik dị n'ụdị ọtụtụ.
    reason: lexical_alternative
  - marker: d
    text: Ma ọ bụ, “agbamume” ma ọ bụ “nkasi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Εὐλογητὸς
  choice: Ka a gọzie
  rationale: Ọ bụ usoro otuto a na-eji ekwupụta na Chineke kwesịrị ngọzi na otuto; ntụgharị a na-edobe ike nke okwu Grik ma na-ada nke ọma n'Igbo.
- source_word: ὁ θεὸς καὶ πατὴρ
  choice: Chineke, onye bụkwa Nna
  rationale: Nke a na-egosi na otu onye ahụ bụ Chineke ma bụrụkwa Nna, ka a ghara ịghọta okwu abụọ ahụ dịka ndị abụọ dị iche.
- source_word: κυρίου
  choice: Onyenwe anyị
  rationale: Ọ bụ okwu Igbo a na-ejikarị akọwa κύριος n'okwu gbasara Jizọs, ma ọ na-egosikwa ikike na ọchịchị ya.
- source_word: Χριστοῦ
  choice: bụ Mezaya
  rationale: Χριστός ka nwere ọrụ dịka aha ọkwá ebe a; ‘bụ Mezaya’ na-eme ka ihe aha ọkwá ahụ pụtara doo anya n'Igbo.
- source_word: οἰκτιρμῶν
  choice: ebere
  rationale: ‘Ebere’ bụ okwu Igbo doro anya ma kwekọọ na echiche nke ọmịiko na omume ebere; Igbo anaghị adịkarị eke ịgụ ya n'ụdị ọtụtụ dịka Grik.
- source_word: παρακλήσεως
  choice: nkasi obi
  rationale: N'ọnọdụ mkpagbu nke amaokwu ndị na-esote, ‘nkasi obi’ bụ okwu kacha pụta ihe n'ụzọ ebumpụta ụwa, ma okwu Grik ahụ nwekwara ike ịpụta agbamume.
theological_decisions:
- issue: Ịsụgharị Χριστός n'ahịrịokwu Ἰησοῦ Χριστοῦ
  choice: Jizọs bụ Mezaya
  alternative: Jizọs Kraịst
  rationale: A họọrọ ịkọwa Χριστός dịka aha ọkwá, ‘Mezaya,’ kama ime ka ọ dị naanị ka akụkụ aha mmadụ; e tinyere ‘bụ’ iji mee ka okwu ahụ bụrụ Igbo ebumpụta ụwa.
- issue: Mmekọrịta dị n'etiti θεὸς na πατὴρ
  choice: Chineke, onye bụkwa Nna
  alternative: Chineke na Nna
  rationale: Nhọrọ a na-echekwa otu onye a na-ekwu maka ya ma na-egbochi nghọta na ‘Chineke’ na ‘Nna’ bụ ndị abụọ.
translation_notes:
  register: E ji Igbo Izugbe nke dị ugwu ma dị mfe nghọta. Usoro ‘Ka a gọzie’ na-enye ụda otuto; ‘onye bụkwa Nna’ na-eme ka mmekọrịta okwu ndị ahụ doo anya n'enweghị ịgbanwe onye a na-ekwu maka ya. E debere akara nkọwa ụkwụ niile n'akụkụ okwu ha na-akọwa.
