id: 2CO.1.12
reference: 2 Corinthians 1:12
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ἡ γὰρ καύχησις ἡμῶν αὕτη ἐστίν, τὸ μαρτύριον τῆς συνειδήσεως ἡμῶν, ὅτι ἐν ⸀ἁγιότητι καὶ εἰλικρινείᾳ ⸀τοῦ θεοῦ, ⸀οὐκ ἐν σοφίᾳ σαρκικῇ ἀλλ’ ἐν χάριτι θεοῦ, ἀνεστράφημεν ἐν τῷ κόσμῳ, περισσοτέρως δὲ πρὸς ὑμᾶς·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/012.yaml
  text: 'For this is our boast: the testimony of our conscience[a], that we conducted ourselves in the world in holiness and sincerity of God[c][b], not in fleshly wisdom but in the grace of God—and especially toward you.'
translation:
  language: ig
  text: 'N’ihi na ihe anyị ji anya isi bụ nke a: akaebe nke akọ na uche anyị, na anyị kpara àgwà n’ụwa n’ịdị nsọ[a] na ezi obi nke Chineke[b], ọ bụghị n’amamihe nke anụ ahụ[c], kama n’amara Chineke—karịsịa n’ebe unu nọ.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ụfọdụ ihe odide nwere “ịdị mfe n’obi” kama “ịdị nsọ.”
    reason: textual_variant
  - marker: b
    text: A pụkwara ịsụgharị ya, “ezi obi sitere n’aka Chineke” ma ọ bụ “ezi obi kwekọrọ n’ụzọ Chineke.”
    reason: lexical_alternative
  - marker: c
    text: Ma ọ bụ, “amamihe mmadụ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καύχησις
  choice: ihe anyị ji anya isi
  rationale: Nkebi okwu a bụ ụzọ Igbo si ekwu ihe mmadụ ji atụkwasị obi ma na-anya isi; ọ na-ezere ime ka okwu ahụ bụrụ naanị mpako ọjọọ.
- source_word: μαρτύριον τῆς συνειδήσεως ἡμῶν
  choice: akaebe nke akọ na uche anyị
  rationale: “Akaebe” na-egosipụta nkwupụta ime mmụọ nke akọ na uche na-agba, ebe “akọ na uche” bụ okwu Igbo doro anya maka συνείδησις.
- source_word: ἁγιότητι
  choice: n’ịdị nsọ
  rationale: Ọ na-edobe echiche omume na nke okpukpe dị na “holiness,” ma na-agbaso ọgụgụ SBLGNT.
- source_word: εἰλικρινείᾳ τοῦ θεοῦ
  choice: na ezi obi nke Chineke
  rationale: “Ezi obi” na-ekwupụta ịdị ọcha na enweghị aghụghọ; “nke Chineke” na-edobe ọdịdị genitive nke Grik n’ebughị ụzọ kpebie kpamkpam ma ọ bụ isi mmalite ka ọ bụ àgwà kwekọrọ na Chineke.
- source_word: σοφίᾳ σαρκικῇ
  choice: n’amamihe nke anụ ahụ
  rationale: Nsụgharị a na-edobe njikọ σαρκ- (“anụ ahụ”) nke Pọl ji, kama ime ka ọ bụrụ naanị “amamihe ụwa” ma ọ bụ “amamihe mmadụ.”
- source_word: χάριτι θεοῦ
  choice: n’amara Chineke
  rationale: Nke a bụ okwu Igbo dị mfe ma dịkwa arọ n’echiche okpukpe maka χάρις θεοῦ.
- source_word: ἀνεστράφημεν ἐν τῷ κόσμῳ
  choice: anyị kpara àgwà n’ụwa
  rationale: “Ịkpa àgwà” na-egosipụta ụzọ e si ebi ndụ na omume mmadụ, nke bụ ihe ngwaa ahụ pụtara n’ebe a.
- source_word: περισσοτέρως δὲ πρὸς ὑμᾶς
  choice: karịsịa n’ebe unu nọ
  rationale: Ọ na-enye ike ntụnyere nke περισσοτέρως na mmekọrịta nke πρὸς ὑμᾶς n’Igbo e ji eme ihe ugbu a.
theological_decisions:
- issue: Ike nke τοῦ θεοῦ n’okwu εἰλικρινείᾳ τοῦ θεοῦ
  choice: ezi obi nke Chineke
  alternative: ezi obi sitere n’aka Chineke; ezi obi kwekọrọ n’ụzọ Chineke
  rationale: Isi okwu ahụ na-edobe njikọ “nke Chineke” dị na Grik, ebe nkọwa ala peeji na-egosi ụzọ abụọ a pụrụ isi ghọta ya n’emeghị ka otu nkọwa ghọọ naanị nke ziri ezi.
- issue: Echiche nke σοφίᾳ σαρκικῇ
  choice: amamihe nke anụ ahụ
  alternative: amamihe mmadụ
  rationale: Isi okwu na-edobe okwu “anụ ahụ” nke dị mkpa n’akwụkwọ Pọl; nkọwa ala peeji na-enye nsụgharị dị mfe nke na-ele ya anya dị ka amamihe sitere n’ike mmadụ.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ “anyị kpara àgwà” maka omume ndụ, “ihe anyị ji anya isi” maka καύχησις, ma debe “anụ ahụ” iji mee ka okwu Pọl pụta ìhè. Ihe nrịbama ala peeji [a], [b], na [c] niile dị n’isi okwu n’ebe ha metụtara.
