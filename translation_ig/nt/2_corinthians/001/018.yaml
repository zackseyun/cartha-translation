- from: Dị nnọọ ka Chineke si kwesị ntụkwasị obi, ozi anyị ziri unu abụghị “Ee na Mba.”[a]
  to: Ma Chineke kwesịrị ntụkwasị obi, na ozi anyị gwara unu abụghị “Ee na Mba.”[a]
  rationale: The revision replaces the unnatural comparative opening with a direct assertion that closely reflects πιστὸς δὲ ὁ θεὸς while retaining the Greek ὅτι clause with “na.” It keeps the message’s reference to the Corinthians clear, preserves the present-force denial in “abụghị,” and retains the marked “Ee na Mba” expression. The single footnote anchor and complete footnote set are preserved.
