    text: 'A pụkwara ịsụgharị ya n’ụzọ dị nso n’okwu Greek, sị: “Ma Chineke kwesịrị ntụkwasị obi, na okwu anyị gwara unu abụghị ee na mba.” “Ozi” nwekwara ike ịbụ “okwu” ma ọ bụ “okwu ọnụ.”'
    reason: lexical_alternative
