base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/018.yaml
  text: As surely as God is faithful[b][a], our message to you is not “Yes and No.”
translation:
  language: ig
  text: Ma Chineke kwesịrị ntụkwasị obi, na ozi anyị gwara unu abụghị “Ee na Mba.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A pụkwara ịsụgharị ya n’ụzọ dị nso n’okwu Greek, sị: “Ma Chineke kwesịrị ntụkwasị obi, na okwu anyị gwara unu abụghị ee na mba.” “Ozi” nwekwara ike ịbụ “okwu” ma ọ bụ “okwu ọnụ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: πιστός
  choice: kwesị ntụkwasị obi
  rationale: Nkebi okwu a na-egosi na Chineke bụ onye a pụrụ ịtụkwasị obi ma na-emezu ihe o kwuru; ọ bụkwa okwu Igbo doro anya ma dị ùgwù.
- source_word: δὲ
  choice: dị nnọọ ka
  rationale: N'ebe a, δέ so n'okwu nkwesi ike πιστὸς ὁ θεός; ‘dị nnọọ ka’ na-ewepụta ike nke nkwenye ahụ n'Igbo eke karịa ‘ma.’
- source_word: ὅτι
  choice: usoro okwu nkwesi ike nke na-eduba n'ihe Pọl na-ekwusi ike
  rationale: A naghị atụgharị ya iche dịka ‘na’ ma ọ bụ ‘n'ihi na’; a tinyere ọrụ ya n'usoro ‘Dị nnọọ ka ...,’ nke jikọtara ntụkwasị obi Chineke na nkwupụta na-esochi.
- source_word: λόγος
  choice: ozi
  rationale: N'ebe a ọ na-ezo aka n'ihe Pọl na ndị ya gwara ndị Kọrịnt; ‘ozi’ bụ okwu Igbo eke ma doo anya karịa ntụgharị nkịtị ‘okwu.’
- source_word: ἡμῶν
  choice: anyị
  rationale: Ọ na-egosi na ozi ahụ bụ nke Pọl na ndị ya.
- source_word: ὁ πρὸς ὑμᾶς
  choice: anyị ziri unu
  rationale: Nke a na-egosi n'ụzọ eke na ozi ahụ bụ nke e duziri ndị Kọrịnt.
- source_word: οὐκ ἔστιν
  choice: abụghị
  rationale: Ọ na-echekwa oge dị ugbu a na nkwupụta Pọl.
- source_word: Ναὶ καὶ Οὔ
  choice: “Ee na Mba”
  rationale: Idebe okwu abụọ a dịka ahịrịokwu e hotara na-echekwa ntụnyere Pọl banyere okwu na-agbanwe agbanwe ma ọ bụ na-emegiderịta onwe ya.
theological_decisions:
- issue: Otu e si atụgharị πιστὸς δὲ ὁ θεὸς ὅτι dịka okwu nkwesi ike
  choice: Dị nnọọ ka Chineke si kwesị ntụkwasị obi
  alternative: Ma Chineke kwesị ntụkwasị obi, na ...
  rationale: Nhọrọ a na-egosi na Pọl na-akpọ ntụkwasị obi Chineke dịka ntọala siri ike nke eziokwu okwu ha, na-enweghị ịmanye ụtọasụsụ Greek ka ọ bụrụ Igbo na-adịghị eke.
translation_notes:
  register: Igbo ọkọlọtọ, nke oge a, dị ùgwù ma dị mfe nghọta. E ji ‘kwesị ntụkwasị obi’ kwupụta àgwà Chineke, ma jiri ‘ozi’ mee ka λόγος doo ndị na-agụ akwụkwọ anya. E tinyere akara ndetu [a] n'ederede dịka achọrọ.
