id: 2CO.1.11
reference: 2 Corinthians 1:11
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: συνυπουργούντων καὶ ὑμῶν ὑπὲρ ἡμῶν τῇ δεήσει, ἵνα ἐκ πολλῶν προσώπων τὸ εἰς ἡμᾶς χάρισμα διὰ πολλῶν εὐχαριστηθῇ ὑπὲρ ⸀ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/011.yaml
  text: as you also join in helping us by prayer[c][b][a], so that thanks may be given by many on our behalf for the gracious gift given to us.
translation:
  language: ig
  text: ebe unu onwe unu na-esonyekwa n’inyere anyị aka site n’ekpere, ka e wee nye ekele, site n’ọnụ ọtụtụ mmadụ,[b] sitekwa n’aka ọtụtụ mmadụ,[a] maka onyinye amara e nyere anyị maka anyị.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nhazi okwu Grik a siri ike. A pụkwara ịghọta ya dịka, “ka ọtụtụ mmadụ wee nye ekele maka anyị n’ihi onyinye amara e nyere anyị, site n’aka ọtụtụ mmadụ.”
    reason: alternative_reading
  - marker: b
    text: N’ụzọ nkịtị, “site n’ọtụtụ ihu.” N’ebe a, “ihu” na-anọchi anya mmadụ.
    reason: lexical_alternative
  - marker: c
    text: “Onyinye amara” nwekwara ike ịbụ “ngọzi” ma ọ bụ “amara e mere anyị.”
    reason: lexical_alternative
lexical_decisions:
- source_word: συνυπουργούντων
  choice: na-esonyekwa n’inyere anyị aka
  rationale: Nke a na-egosipụta ma echiche nke imekọ ihe ọnụ dị na συν- ma enyemaka dị na ὑπουργέω, n’Igbo doro anya ma dịkwa eke.
- source_word: τῇ δεήσει
  choice: site n’arịrịọ unu n’ekpere
  rationale: δέησις bụ arịrịọ siri ike a na-arịọ n’ekpere; nsụgharị a na-edebe ụdị arịrịọ ahụ ma gosipụta na ekpere bụ ụzọ enyemaka ahụ si abịa.
- source_word: ἵνα
  choice: ka ... wee
  rationale: Ụdị okwu a na-egosipụta nzube ma ọ bụ ihe ga-esi na ya pụta n’Igbo eke.
- source_word: ἐκ πολλῶν προσώπων
  choice: ọtụtụ mmadụ
  rationale: N’agbanyeghị na πρόσωπον pụtara ‘ihu’ n'ụzọ nkịtị, okwu ahụ na-anọchi anya mmadụ n’ebe a; ‘ọtụtụ mmadụ’ na-enye nghọta ahụ nke ọma.
- source_word: τὸ εἰς ἡμᾶς χάρισμα
  choice: onyinye amara ahụ e nyere anyị
  rationale: χάρισμα na-ejikọta echiche onyinye na amara onye nyere ya; okwu a na-edebe akụkụ abụọ ahụ n’Igbo.
- source_word: διὰ πολλῶν
  choice: site n’aka ọtụtụ mmadụ
  rationale: A hapụrụ nkebi okwu Grik a n’ahịrị isi kama iwepụ ya, ka mmegharị okwu ‘ọtụtụ’ abụọ na ihe nwere ike ịbụ ọrụ ọtụtụ mmadụ wee dịgide.
- source_word: εὐχαριστηθῇ
  choice: wee kelee Chineke
  rationale: Ụdị passive a pụtara na a ga-enye ekele; itinye ‘Chineke’ na-eme ka onye a na-ekele doo anya site n’ọnọdụ okwu ahụ, ọ bụ ezie na aha ahụ adịghị n’ahịrị Grik.
- source_word: ὑπὲρ ἡμῶν
  choice: n’ihi anyị
  rationale: Nke a na-egosipụta na ekele ahụ metụtara ihe Chineke meere Pọl na ndị ya, ma ghara ịmanye naanị otu nghọta nke ὑπέρ.
theological_decisions:
- issue: Onye a na-ekele na passive εὐχαριστηθῇ
  choice: Chineke
  alternative: ịsị naanị ‘ka e wee nye ekele’ n’agwaghị onye a na-ekele
  rationale: N’ọnọdụ ekpere, onyinye amara, na ekele, Chineke bụ onye a na-ekele n’ụzọ doro anya; agbakwunyere ya maka Igbo eke, ọ bụghị iji webata ozizi pụrụ iche.
- issue: Mmekọrịta διὰ πολλῶν na nkebi ndị gbara ya gburugburu
  choice: 'jikọta ya na ekele: ‘e nyere anyị site n’aka ọtụtụ mmadụ’ dị ka usoro ahịrị isi si gosi, ma kọwaa mgbagwoju anya na ndetu'
  alternative: 'jikọta ya na ụzọ e si enye ekele: ‘site n’aka ọtụtụ mmadụ ka ọtụtụ mmadụ wee nye ekele’'
  rationale: Nhazi Grik siri ike ma nwee ike ịghọta n’ụzọ dị iche iche. Ahịrị isi na-agbaso usoro okwu nso, ebe ndetu [a] na-echekwa ụzọ ọzọ.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. E debere mmegharị ‘ọtụtụ ... ọtụtụ’ nke Grik n’ahịrị isi ma jiri ndetu kọwaa mgbagwoju anya nke nhazi okwu ahụ.
