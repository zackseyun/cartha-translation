    text: N’ụzọ nkịtị, “site n’ọtụtụ ihu.” N’ebe a, “ihu” na-anọchi anya mmadụ.
    reason: lexical_alternative
  - marker: c
    text: “Onyinye amara” nwekwara ike ịbụ “ngọzi” ma ọ bụ “amara e mere anyị.”
    reason: lexical_alternative
  revision_rationale: The revision removes the unnamed recipient inserted into the passive verb, keeps διὰ πολλῶν with the thanksgiving rather than with the gift, and retains the source’s deliberate repeated “many.” The footnote records the syntactic ambiguity without deciding it beyond what the Greek permits.
