- from: unu onwe unu na-esonyekwa n’inyere anyị aka site n’arịrịọ unu n’ekpere, ka ọtụtụ mmadụ wee kelee Chineke n’ihi anyị maka onyinye amara ahụ e nyere anyị site n’aka ọtụtụ mmadụ.[a][b][c]
