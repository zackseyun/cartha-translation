id: 2CO.1.14
reference: 2 Corinthians 1:14
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καθὼς καὶ ἐπέγνωτε ἡμᾶς ἀπὸ μέρους, ὅτι καύχημα ὑμῶν ἐσμεν καθάπερ καὶ ὑμεῖς ἡμῶν ἐν τῇ ἡμέρᾳ τοῦ κυρίου ⸀ἡμῶν Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/014.yaml
  text: just as you also came to understand us in part[a], that we are your boast, just as you also are ours[b], in the day of our Lord Jesus.
translation:
  language: ig
  text: dị ka unu sikwa ghọta anyị n’akụkụ ụfọdụ[a], na anyị bụ ihe unu ji etu ọnụ, dị nnọọ ka unu bụkwa ihe anyị ji etu ọnụ n’ụbọchị Onyenwe anyị Jizọs.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ “n’ụzọ na-ezughị oke” ma ọ bụ “ruo n’ókè ụfọdụ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπέγνωτε
  choice: unu ... ghọta
  rationale: “Ghọta” na-egosi na ndị Kọrịnt bịara mata ma ghọta ndị ozi n’ezie, ma ọ naghị ekwu na nghọta ahụ zuru oke.
- source_word: ἀπὸ μέρους
  choice: n’otu akụkụ
  rationale: Nke a na-edobe echiche nke nghọta na-ezughị oke ma hapụ ogo ya ka ọ ghara ịkọwa karịa ihe Grik kwuru.
- source_word: καύχημα
  choice: ihe ... ga-eji anya isi
  rationale: Akpaalaokwu Igbo a na-enye echiche nke ihe mmadụ ji etu ọnụ ma ọ bụ jiri nwee ọṅụ na mpako ziri ezi, ma na-edobe ike okwu Pọl.
- source_word: καθάπερ
  choice: dị nnọọ ka
  rationale: Nke a na-edobe ntụnyere doro anya na mmekọrịta dị n’etiti Pọl na ndị Kọrịnt.
- source_word: ἡμέρᾳ τοῦ κυρίου ἡμῶν Ἰησοῦ
  choice: n’ụbọchị Onyenwe anyị Jizọs
  rationale: Nke a na-edobe okwu a maara nke na-ezo aka n’ụbọchị ikpeazụ ma na-asụgharị κύριος dịka “Onyenwe.”
- source_word: καθὼς καὶ
  choice: dị ka unu onwe unu sikwa
  rationale: “Sikwa” na-eburu ike mgbakwunye nke καί, ebe “unu onwe unu” na-eme ka ntụnyere ahụ pụta ìhè n’Igbo dị mma.
theological_decisions:
- issue: Okwu Pọl banyere καύχημα nke ha na ibe ha nwere
  choice: anyị bụ ihe unu ga-eji anya isi, dị nnọọ ka unu onwe unu bụkwara nke anyị
  alternative: anyị bụ ihe unu ji etu ọnụ, dị ka anyị onwe anyị sikwa etu ọnụ n’ihi unu
  rationale: Nhọrọ a na-edobe mmekọrịta abụọ ahụ na olileanya nke ụbọchị Onyenwe anyị, n’ebughị ụzọ kpebie ma okwu ahụ bụ naanị mpako, ọṅụ, ma ọ bụ ụgwọ ọrụ.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. E debere usoro ntụnyere na nkwughachi nke Grik, ma mee ka ahịrịokwu ahụ na-aga were were n’Igbo.
