revisions:
- from: Olileanya anyị nwere n'ebe unu nọ siri ike, n'ihi na anyị maara na dị nnọọ ka unu si eketa ahụhụ ndị ahụ, otu ahụkwa ka unu si eketa nkasi obi.[a]
  to: Olileanya anyị banyere unu siri ike, n'ihi na anyị maara na dịka unu na-ekere òkè n’ahụhụ, otu ahụkwa unu na-ekere òkè na nkasi obi.[a]
  rationale: The revision corrects the reference phrase for ὑπὲρ ὑμῶν, renders κοινωνοί as active participation rather than inheritance, and removes the unsupported demonstrative. It preserves the Greek correlative structure and the supplied verb in the elliptical second clause.
  reviewer_model: gpt-5.6-terra
