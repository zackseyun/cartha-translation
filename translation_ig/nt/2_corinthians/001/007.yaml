id: 2CO.1.7
reference: 2 Corinthians 1:7
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ἡ ἐλπὶς ἡμῶν βεβαία ὑπὲρ ⸀ὑμῶν· εἰδότες ὅτι ⸀ὡς κοινωνοί ἐστε τῶν παθημάτων, οὕτως καὶ τῆς παρακλήσεως.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/007.yaml
  text: And our hope for you is firm[a], because we know that just as you share in the sufferings, so also you share in the comfort.
translation:
  language: ig
  text: Olileanya anyị banyere unu siri ike, n'ihi na anyị maara na dịka unu na-ekere òkè n’ahụhụ, otu ahụkwa unu na-ekere òkè na nkasi obi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ịgba ume” n’ọnọdụ “nkasi obi” (παράκλησις).
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλπίς
  choice: olileanya
  rationale: “Olileanya” bụ okwu Igbo a na-ejikarị akọwa atụmanya nwere ntụkwasị obi, n’emeghị ka okwu Grik ahụ pụta nanị dị ka obi ike.
- source_word: βεβαία
  choice: siri ike
  rationale: Nke a na-egosi na olileanya ahụ guzosiri ike, bụrụkwa nke a pụrụ ịdabere na ya.
- source_word: ὑπὲρ ὑμῶν
  choice: n'ebe unu nọ
  rationale: N’ebe a, okwu ahụ na-ezo aka n’ihe Pọl na-atụ anya banyere ndị Kọrịnt; nsụgharị a bụ nke na-ada nke ọma n’Igbo.
- source_word: εἰδότες
  choice: n'ihi na anyị maara
  rationale: Ọnọdụ participle ahụ na-enye ihe mere olileanya ahụ ji sie ike; “n’ihi na” na-eme njikọ a doo anya.
- source_word: ὡς ... οὕτως καί
  choice: dị nnọọ ka ... otu ahụkwa
  rationale: Nke a na-edobe usoro ntụnyere na njikọ dị n’asụsụ Grik.
- source_word: κοινωνοί
  choice: unu si eketa
  rationale: “Iketa” n’ebe a na-egosi isonye ma ọ bụ ikere òkè n’ahụhụ na nkasi obi, ma na-ada nke ọma n’Igbo.
- source_word: παθημάτων
  choice: ahụhụ ndị ahụ
  rationale: “Ahụhụ” bụ okwu sara mbara ma doo anya nke dabara n’ọnọdụ a; “ndị ahụ” na-egosipụta definite article nke Grik.
- source_word: παρακλήσεως
  choice: nkasi obi
  rationale: N’isiakwụkwọ a, okwu ahụ na-ekwukarị maka nkasi obi Chineke na-enye n’ahụhụ; nsụgharị a na-echekwa njikọ isiokwu ahụ.
- source_word: '[elliptical second clause]'
  choice: unu si eketa
  rationale: Ọ bụ ezie na Grik ekwughachighị echiche isonye na nkebi nke abụọ, Igbo chọrọ ka e kwughachi ya iji mee ka ahịrịokwu ahụ zuo oke ma doo anya.
theological_decisions:
- issue: Uru okwu παράκλησις
  choice: nkasi obi
  alternative: ịgba ume
  rationale: “Nkasi obi” dabara nke ọma na ọnọdụ ahụhụ dị na 2 Kọrịnt 1 ma na-echekwa okwu isi nke a na-emegharị ugboro ugboro; ihe ọzọ kwe omume ka e debere n’ala peeji.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta. E debere usoro ntụnyere nke Grik, tinyekwa ihe e wepụrụ na nkebi nke abụọ naanị ka ahịrịokwu ahụ doo anya n’Igbo.
