review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys hope, firmness, causal knowledge, the just-as/so-also correlation, sufferings, and comfort. However, “n'ebe unu nọ” is locative and does not naturally express ὑπὲρ ὑμῶν (‘concerning/for you’). “Iketa” primarily means inherit and can distort κοινωνοί, which here denotes participation. “ndị ahụ” adds a demonstrative sense not present in παθημάτων.
  naturalness: The proposed revision uses idiomatic Standard Igbo. “Olileanya anyị banyere unu” naturally states the reference of the hope, and “na-ekere òkè n’...” clearly and naturally expresses sharing/participation in both clauses.
  terminology: “Nkasi obi” is an appropriate contextual rendering of παράκλησις and maintains the chapter’s repeated comfort/consolation theme. The lexical-alternative footnote for “ịgba ume” is retained. “Ahụhụ” appropriately renders παθήματα without an unwarranted demonstrative.
  issues:
  - severity: medium
    issue: “n'ebe unu nọ” used for ὑπὲρ ὑμῶν
    rationale: This phrase is normally locative (‘at/where you are’), whereas the Greek refers to Paul’s hope concerning or for the Corinthians.
  - severity: medium
    issue: “eketa” used for κοινωνοί
    rationale: “Eketa” normally means ‘inherit’; κοινωνοί means participants/sharers, not heirs in this verse.
  - severity: low
    issue: “ndị ahụ” added after “ahụhụ”
    rationale: The Greek has no demonstrative (‘those’). Removing it avoids adding specificity.
  revised_text: Olileanya anyị banyere unu siri ike, n'ihi na anyị maara na dịka unu na-ekere òkè n’ahụhụ, otu ahụkwa unu na-ekere òkè na nkasi obi.[a]
  revised_footnotes:
  - marker: a
    text: Ma ọ bụ, “ịgba ume” n’ọnọdụ “nkasi obi” (παράκλησις).
    reason: lexical_alternative
  revision_rationale: The revision corrects the reference phrase for ὑπὲρ ὑμῶν, renders κοινωνοί as active participation rather than inheritance, and removes the unsupported demonstrative. It preserves the Greek correlative structure and the supplied verb in the elliptical second clause.
