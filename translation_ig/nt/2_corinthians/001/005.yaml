reference: 2 Corinthians 1:5
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὅτι καθὼς περισσεύει τὰ παθήματα τοῦ Χριστοῦ εἰς ἡμᾶς, οὕτως διὰ τοῦ Χριστοῦ περισσεύει καὶ ἡ παράκλησις ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/005.yaml
  text: For just as the sufferings of Christ overflow to us[b][a], so also through Christ our comfort overflows.
translation:
  language: ig
  text: N’ihi na, dị ka ahụhụ Kraịst[b] na-ejubiga ókè n’ime anyị[a], otu ahụ ka nkasi obi anyị na-ejubigakwa ókè site na Kraịst.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịtụgharị ya, “ahụhụ ndị a na-ata n’ihi Kraịst.” Okwu Gris ahụ nwere ike ịpụta ahụhụ ndị metụtara Kraịst ma ọ bụ ndị a na-ata n’ihi ya.
    reason: alternative_reading
  - marker: b
    text: A pụkwara ịtụgharị “Kraịst” dịka “Mezaịa” mgbe e lekwasịrị anya n’echiche aha ọkwá ya.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: N’ihi na
  rationale: Ọ na-ewebata nkọwa kpatara okwu bu ya ụzọ; nhọrọ a na-edobe ike nke njikọ ihe kpatara ya n’Igbo nkịtị.
- source_word: καθὼς ... οὕτως
  choice: dị nnọọ ka ... otu ahụkwa
  rationale: Ọ na-edobe usoro ntụnyere jikọrọ akụkụ abụọ ahụ nke ọma n’Igbo doro anya.
- source_word: περισσεύει
  choice: jubiga ókè
  rationale: Ọ na-egosi ịba ụba gafere oke ma na-enyekwa ohere idobe otu oyiyi ahụ ugboro abụọ n’amaokwu ahụ.
- source_word: τὰ παθήματα
  choice: ahụhụ
  rationale: Nke a bụ okwu Igbo kpọmkwem ma dị mfe nghọta maka ahụhụ na mkpagbu ndị a na-ata.
- source_word: τοῦ Χριστοῦ
  choice: Kraịst
  rationale: E debere njikọ genitive ahụ n’ụzọ na-anaghị ekpebi kpamkpam ma ọ bụ ahụhụ nke Kraịst, ikere òkè n’ahụhụ ya, ma ọ bụ ahụhụ a na-ata n’ihi ya; ihe odide ala peeji na-egosi ụzọ ọzọ.
- source_word: εἰς ἡμᾶς
  choice: bịakwasị anyị
  rationale: Nke a bụ ụzọ Igbo e si ekwu na ahụhụ rutere mmadụ ma ha nwe ya n’ahụmahụ, kama nsụgharị nkịtị na-adịghị ada ụtọ.
- source_word: διὰ τοῦ Χριστοῦ
  choice: si n’aka Kraịst
  rationale: Ọ na-egosi na Kraịst bụ onye e si n’aka ya nweta nkasi obi ahụ, ma na-ada n’ụzọ ebumpụta ụwa n’Igbo.
- source_word: παράκλησις
  choice: nkasi obi
  rationale: N’okwu gbara amaokwu a gburugburu, nke a na-egosi nkasi na mgbam ume megidere mkpagbu; “nkasi obi” na-ebute isi pastoral ahụ n’ihu.
- source_word: ἡ παράκλησις ἡμῶν
  choice: nkasi obi anyị
  rationale: Ọ na-edobe nkwupụta onye nwe ihe dị n’asụsụ Gris n’enweghị ịgbatị ya karịa ihe odide ahụ.
theological_decisions:
- issue: Ihe “ahụhụ Kraịst” pụtara
  choice: E debere okwu ahụ ka ọ gosi ahụhụ nwere njikọ chiri anya na Kraịst, gụnyere ikere òkè n’ahụhụ ya, n’ebughị ụzọ mechie nghọta ya.
  alternative: Ahụhụ a na-ata n’ihi Kraịst; ma ọ bụ ahụhụ Kraịst n’onwe ya tara nke ndị ya na-ekerekwa òkè na ya.
  rationale: Genitive τοῦ Χριστοῦ nwere ike ibu ihe karịrị otu njikọ. Ya mere, isi ihe odide ahụ ekpebighị ihe Gris ahụ ekpebighị, ebe ihe odide ala peeji na-echekwa ụzọ ọzọ kwesịrị ekwesị.
translation_notes:
  register: Asụsụ Igbo Izugbe dị ugbu a, dị ùgwù ma dị mfe nghọta. E ji “jubiga ókè” ugboro abụọ chekwaa nkwughachi περισσεύει, e jikwa usoro “dị nnọọ ka ... otu ahụkwa” dobe ntụnyere ahụ. E tinyere akara ala peeji niile n’isi ihe odide.
