id: 2CO.1.19
reference: 2 Corinthians 1:19
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὁ ⸂τοῦ θεοῦ γὰρ⸃ υἱὸς ⸂Ἰησοῦς Χριστὸς⸃ ὁ ἐν ὑμῖν δι’ ἡμῶν κηρυχθείς, δι’ ἐμοῦ καὶ Σιλουανοῦ καὶ Τιμοθέου, οὐκ ἐγένετο Ναὶ καὶ Οὒ, ἀλλὰ Ναὶ ἐν αὐτῷ γέγονεν·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/019.yaml
  text: For the Son of God[a], Jesus the Messiah, who was proclaimed among you through us—through me and Silvanus and Timothy—did not become Yes and No; rather[d][c][b], in him it has become Yes.
translation:
  language: ig
  text: N’ihi na Ọkpara Chineke, Jizọs Kraịst[a], onye e sitere n’aka anyị kwusaa n’etiti unu[b]—site n’aka mụ onwe m na Silvanọs na Timoti—aghọghị “Ee” na “Mba”; kama, n’ime ya, ọ ghọọla “Ee.”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Jizọs, Mezaya ahụ.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “onye anyị kwusara n’etiti unu.”
    reason: lexical_alternative
  - marker: c
    text: Ma ọ bụ, “ọ bụghị ‘Ee’ na ‘Mba’ ... kama n’ime ya ọ bụwo ‘Ee.’”
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ τοῦ θεοῦ υἱός
  choice: Ọkpara Chineke
  rationale: Nke a bụ ụzọ Igbo doro anya ma dị ùgwù isi kwuo aha nsọ a, na-edobe mmekọrịta nke ‘Ọkpara’ na Chineke.
- source_word: Ἰησοῦς Χριστός
  choice: Jizọs Kraịst
  rationale: N’ebe a, okwu abụọ ahụ jikọtara ọnụ dị ka aha a na-akpọ onye ahụ; ‘Kraịst’ na-edobe ụdị aha ahụ, ebe nkọwa ala peeji na-egosi ihe Χριστός pụtara dị ka ‘Mezaya.’
- source_word: κηρυχθείς
  choice: onye anyị kwusara
  rationale: ‘Kwụsara’ na-egosi nkwupụta ozi n’ihu ọha, ma na-ada nke ọma n’Igbo ugbu a. Ọ bụ ezie na Grik ji ụdị nnara mee ya, Igbo na-eji ụdị ime ihe a eme ka ahịrịokwu doo anya.
- source_word: δι’ ἡμῶν ... δι’ ἐμοῦ καὶ Σιλουανοῦ καὶ Τιμοθέου
  choice: anyị ... mụ na Silvanọs na Timoti
  rationale: Nke a na-edobe ndị ozi ahụ na aha atọ ahụ n’enweghị usoro siri ike nke na-agaghị ada ka Igbo nkịtị.
- source_word: οὐκ ἐγένετο Ναὶ καὶ Οὔ
  choice: aghọghị “Ee” na “Mba”
  rationale: E debere okwu atụ Pọl kpọmkwem kama ịkọwa ya naanị dịka enweghị ntụkwasị obi; ‘aghọghị’ na-anọchi ἐγένετο nke ọma.
- source_word: ἀλλὰ Ναὶ ἐν αὐτῷ γέγονεν
  choice: kama, n’ime ya, ọ ghọọla “Ee”
  rationale: ‘Ọ ghọọla’ na-egosipụta omume mezuru nke ọnọdụ ya ka dị, dịka perfect γέγονεν; ‘n’ime ya’ na-edobe okwu Grik n’enweghị ịkọwa ihe ọ pụtara gabiga ókè.
theological_decisions:
- issue: Ma a ga-asụgharị Χριστός dịka aha a maara ama ka ọ bụ dịka utu aha
  choice: Jizọs Kraịst
  alternative: Jizọs bụ Mezaya
  rationale: Ἰησοῦς Χριστός na-arụ ọrụ ebe a dịka aha onye jikọtara ọnụ, ya mere ‘Jizọs Kraịst’ dabara n’ederede isi; nkọwa ala peeji na-echekwa ihe utu aha ahụ pụtara.
- issue: Ma a ga-akọwa ‘Ee na Mba’ dịka enweghị nkwụsi ike
  choice: aghọghị “Ee” na “Mba”; kama, n’ime ya, ọ ghọọla “Ee”
  alternative: ọ bụghị onye na-agbanwe agbanwe; ọ bụ onye a pụrụ ịtụkwasị obi
  rationale: A hapụrụ ihe atụ na mgbagwoju anya Pọl jiri, ka nsụgharị ghara itinye nkọwa nkà mmụta okpukpe n’ime ederede n’onwe ya.
- issue: Onye ma ọ bụ ihe nnọchiaha dị na ‘ọ ghọọla Ee’ na-ezo aka na ya
  choice: ọ ghọọla “Ee”
  alternative: azịza ahụ aghọọla “Ee” n’ime ya
  rationale: Grik ekwughị ‘azịza ahụ’ hoo haa. Nnọchiaha Igbo na-echekwa ohere ahụ kama idozi ya site n’ịgbakwunye okwu na-adịghị na isi mmalite.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E debere okwu atụ “Ee” na “Mba” na ụdị ha kpọmkwem, ma zere ịtụgharị ha ka ha bụrụ nkọwa ozizi. A họọrọ ‘Silvanọs’ iji soro aha Σιλουανός dị n’isi mmalite kama dochie ya na Saịlas.
