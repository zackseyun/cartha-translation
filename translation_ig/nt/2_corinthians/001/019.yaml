revisions:
- from: N’ihi na Ọkpara Chineke, Jizọs Kraịst[a], onye anyị kwusara n’etiti unu[b]—mụ na Silvanọs na Timoti—aghọghị “Ee” na “Mba”; kama, n’ime ya, ọ ghọọla “Ee.”[c]
  to: N’ihi na Ọkpara Chineke, Jizọs Kraịst[a], onye e sitere n’aka anyị kwusaa n’etiti unu[b]—site n’aka mụ onwe m na Silvanọs na Timoti—aghọghị “Ee” na “Mba”; kama, n’ime ya, ọ ghọọla “Ee.”[c]
  rationale: The revision restores the repeated agency construction of the Greek (“through us—through me and Silvanus and Timothy”) and aligns the main clause with κηρυχθείς through an idiomatic Igbo passive. It preserves the intentionally unexpounded “Ee”/“Mba” idiom and avoids resolving the referent of the final pronoun. Footnote a is reshaped into a true alternative rendering rather than an explanatory sentence.
