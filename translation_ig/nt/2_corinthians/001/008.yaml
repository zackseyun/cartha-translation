id: 2CO.1.8
reference: 2 Corinthians 1:8
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Οὐ γὰρ θέλομεν ὑμᾶς ἀγνοεῖν, ἀδελφοί, ⸀ὑπὲρ τῆς θλίψεως ἡμῶν τῆς ⸀γενομένης ἐν τῇ Ἀσίᾳ, ὅτι καθ’ ὑπερβολὴν ⸂ὑπὲρ δύναμιν ἐβαρήθημεν⸃, ὥστε ἐξαπορηθῆναι ἡμᾶς καὶ τοῦ ζῆν·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/008.yaml
  text: For we do not want you to be unaware[a], brothers, about our affliction that happened in Asia, that we were burdened exceedingly, beyond our strength[c][b], so that we despaired even of life.
translation:
  language: ig
  text: N’ihi na anyị achọghị ka unu ghara ịma, ụmụnna[a], banyere mkpagbu dakwasịrị anyị n’Eshia[b]. E bokwasịrị anyị ibu dị nnọọ arọ, nke karịrị ike anyị, nke mere na anyị tụfuru ọbụna olileanya ịdị ndụ.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Okwu Grik a sụgharịrị “ụmụnna” bụ ἀδελφοί, nke bụ ụdị ọtụtụ nke nwoke; n’ebe a, o yikarịrị ka Pọl ji ya kpọọ ndị niile kwere ekwe, ma ndị nwoke ma ndị nwanyị.
    reason: cultural_note
  - marker: b
    text: “Eshia” n’ebe a bụ ógbè ọchịchị Rom dị n’ebe ọdịda anyanwụ Eshia Maịnọ, ọ bụghị kọntinent Eshia nke oge a.
    reason: cultural_note
  - marker: c
    text: A pụkwara ịsụgharị ya, “nke mere na anyị nwere obi nkoropụ ọbụna banyere ịnọgide na-adị ndụ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: θέλομεν ... ἀγνοεῖν
  choice: anyị achọghị ka unu ghara ịma
  rationale: Nke a na-egosipụta okwu Pọl banyere ọchịchọ ya n’ụzọ Igbo dị mma, ma na-edobe usoro echiche nke ‘anyị achọghị ka unu ghara ịma.’
- source_word: ἀδελφοί
  choice: ụmụnna
  rationale: ‘Ụmụnna’ bụ okwu nkwanye ùgwù a na-ejikarị akpọkọta ndị otu okwukwe n’Igbo; nkọwa ala peeji na-egosi na okwu Grik ahụ bụ nke ụdị oke.
- source_word: θλίψεως
  choice: mkpagbu
  rationale: ‘Mkpagbu’ na-egosi ahụhụ na nrụgide siri ike nke θλῖψις pụtara n’ebe a.
- source_word: τῆς γενομένης ἐν τῇ Ἀσίᾳ
  choice: dakwasịrị anyị n’Eshia
  rationale: Nke a na-eme ka njikọ participle ahụ doo anya n’Igbo ma na-egosi ahụhụ ahụ dị ka ihe mere ha n’Eshia.
- source_word: καθ’ ὑπερβολὴν ὑπὲρ δύναμιν ἐβαρήθημεν
  choice: E bokwasịrị anyị ibu dị nnọọ arọ, nke karịrị ike anyị
  rationale: Ntụgharị a na-edobe oyiyi nke ibu dị arọ, ọdịdị passive nke ngwaa ahụ, na echiche nke ahụhụ karịrị ikike ha.
- source_word: ὥστε ἐξαπορηθῆναι ἡμᾶς καὶ τοῦ ζῆν
  choice: nke mere na anyị tụfuru ọbụna olileanya ịdị ndụ
  rationale: Ọ na-egosipụta nsonaazụ ahụ na oke obi nkoropụ ahụ—ọ metụtara ọbụna ịnọgide na-adị ndụ—n’asụsụ Igbo doro anya ma dị nsọpụrụ.
theological_decisions:
- issue: Otu e si sụgharị ἀδελφοί n’okwu e ji akpọ ndị natara akwụkwọ ozi
  choice: ụmụnna
  alternative: ụmụnne nwoke; ụmụnna nwoke na nwanyị
  rationale: ‘Ụmụnna’ bụ okwu Igbo sitere n’echiche mmekọrịta ezinụlọ, ọ dịkwa mma maka ịkpọ obodo ndị kwere ekwe ọnụ. A naghị etinye ‘nwoke na nwanyị’ n’ahịrịokwu ahụ, ka a ghara ịgbasa okwu karịa ụdị Grik ya; a kọwara ụdị okwu Grik ahụ n’ala peeji.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. Ahịrịokwu nke mbụ na-edobe ụda akwụkwọ ozi Pọl; nke abụọ na-edobe oyiyi nke ibu a bokwasịrị mmadụ na ike nke obi nkoropụ ya. E tinyere akara nkọwa ala peeji ozugbo n’ebe okwu nke ọ bụla metụtara dị.
