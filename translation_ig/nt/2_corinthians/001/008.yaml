  terminology: '“Ụmụnna,” “mkpagbu,” “Eshia,” “ibu ... karịrị ike anyị,” and “olileanya ịdị ndụ” are suitable, natural choices. Footnote a needs a grammatical correction: “ụdị ọtụtụ nke oke” is not an appropriate Standard Igbo description of a masculine plural Greek form.'
