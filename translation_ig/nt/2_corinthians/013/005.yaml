review_pass:
  verdict: revise
  source_fidelity: The draft conveys the verse’s sequence of self-testing, self-examination, recognition of Jesus the Messiah’s presence, and the exception of failing the test. However, “Na-anwanụ” is a progressive-form imperative and can readily suggest ongoing trying/tempting; the aoristic imperative πειράζετε is more directly and idiomatically rendered here by “Nwalenụ.”
  naturalness: “Nwalenụ onwe unu” is a more natural, direct Standard Igbo exhortation than “Na-anwanụ onwe unu.” “Nyochaanụ onwe unu” provides an appropriately distinct yet complementary rendering for δοκιμάζετε. The remaining syntax is clear and suitably formal.
  terminology: “okwukwe,” “Mesaya,” “n'ime unu,” and “ndị dara ule” preserve the intended meanings without importing theological conclusions. The footnotes appropriately retain the live alternatives for ἐν τῇ πίστει and ἐν ὑμῖν.
  issues:
  - severity: low
    issue: The opening imperative uses the progressive form “Na-anwanụ.”
    rationale: πείραζετε is an imperative calling for a direct act of self-testing. “Nwalenụ” is more idiomatic in this context and reduces the possible association of “nwaa” with tempting someone.
  revised_text: Nwalenụ onwe unu iji mara ma unu nọ n'okwukwe[a]; nyochaanụ onwe unu. Ka ọ bụ na unu amataghị na Jizọs bụ Mesaya nọ n'ime unu[b]?—ọ gwụla ma unu bụ ndị dara ule.
  revised_footnotes:
