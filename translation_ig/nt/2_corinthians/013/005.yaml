id: 2CO.13.5
reference: 2 Corinthians 13:5
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ἑαυτοὺς πειράζετε εἰ ἐστὲ ἐν τῇ πίστει, ἑαυτοὺς δοκιμάζετε· ἢ οὐκ ἐπιγινώσκετε ἑαυτοὺς ὅτι ⸂Ἰησοῦς Χριστὸς⸃ ἐν ⸀ὑμῖν; εἰ μήτι ἀδόκιμοί ἐστε.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/013/005.yaml
  text: Test yourselves to see whether you are in the faith[a]; examine yourselves[c][b]. Or do you not recognize that Jesus the Messiah is in you?—unless indeed you are disqualified.
translation:
  language: ig
  text: Nwalenụ onwe unu iji mara ma unu nọ n'okwukwe[a]; nyochaanụ onwe unu. Ka ọ bụ na unu amataghị na Jizọs bụ Mesaya nọ n'ime unu[b]?—ọ gwụla ma unu bụ ndị dara ule.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “N'okwukwe” nwere ike ịpụta ịnọgide n'ime okwukwe Ndị Kraịst ma ọ bụ inwe ezi okwukwe.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “n'etiti unu.”
    reason: alternative_reading
lexical_decisions:
- source_word: πειράζετε
  choice: Na-anwanụ
  rationale: N'ebe a, ngwaa ahụ pụtara itinye onwe onye n'ule iji chọpụta ezi ọnọdụ ya, ọ bụghị ịrafu ya ime mmehie.
- source_word: ἐν τῇ πίστει
  choice: n'okwukwe
  rationale: Nke a na-edobe okwu Grik nke nwere ike ịpụta ịnọgide n'ime okwukwe Ndị Kraịst ma ọ bụ inwe ezi okwukwe; e kọwaghị otu ihe naanị n'ime ederede.
- source_word: δοκιμάζετε
  choice: nyochaanụ
  rationale: Ọ na-egosi ile onwe unu anya nke ọma iji chọpụta ihe bụ eziokwu, ma na-enyekwa ọdịiche nta n'akụkụ 'na-anwanụ'.
- source_word: ἐπιγινώσκετε
  choice: amataghị
  rationale: Ọ dabara n'ajụjụ nkwugide ahụ ma na-egosi ịmata ma ọ bụ ịghọta nke ọma.
- source_word: Ἰησοῦς Χριστός
  choice: Jizọs bụ Mesaya
  rationale: Χριστός na-arụ ọrụ dịka aha-ọrụ ebe a; 'Mesaya' na-egosipụta ihe aha-ọrụ ahụ pụtara, ebe 'Jizọs' bụ aha onye.
- source_word: ἐν ὑμῖν
  choice: n'ime unu
  rationale: Ọnọdụ nke inyocha onwe onye na-akwado echiche nke ọnụnọ Mesaya n'ime ndị Kọrịnt, ma ihe ọ pụtara dịka 'n'etiti unu' ka edobere n'ala peeji.
- source_word: εἰ μήτι
  choice: ọ gwụla ma
  rationale: Ọ na-eweta ọnọdụ e wepụrụ n'ihe a na-ekwu, tinyere ike nkwugide dị n'okwu Grik.
- source_word: ἀδόκιμοί
  choice: ndị dara ule
  rationale: Nke a na-egosipụta njikọ ya na ngwaa abụọ gbasara ule ma na-ezere okwu nwere ibu ozizi e mesịrị.
theological_decisions:
- issue: Nsụgharị Χριστός
  choice: Mesaya
  alternative: Kraịst
  rationale: N'ebe a okwu ahụ bụ aha-ọrụ nke onye ahụ e tere mmanụ; 'Mesaya' na-eme ka ihe aha-ọrụ ahụ pụtara doo anya.
- issue: Ihe ἐν τῇ πίστει pụtara
  choice: n'okwukwe
  alternative: inwe ezi okwukwe nke onwe
  rationale: E debere nkọwa ahụ n'ụzọ na-adịghị ekpebi ma Pọl na-ekwu isi ịnọ n'ime okwukwe Ndị Kraịst ma ọ bụ inwe ezi okwukwe.
- issue: Ihe ἐν ὑμῖν pụtara
  choice: n'ime unu
  alternative: n'etiti unu
  rationale: Ihe gbara ya gburugburu banyere inyocha onwe onye na-akwado 'n'ime unu,' ma Grik ahụ nwekwara ike ibu echiche nke ọnụnọ n'etiti ọgbakọ; e tinyere nke ahụ n'ala peeji.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E jiri ụdị ọtụtụ mmadụ nke iwu, “na-anwanụ” na “nyochaanụ,” mee ka nkwugide Pọl dịrị ndụ. Akara ala peeji niile dị n'ederede n'ebe ha metụtara.
