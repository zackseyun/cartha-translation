    text: “N'okwukwe” nwere ike ịpụta ịnọgide n'ime okwukwe Ndị Kraịst ma ọ bụ inwe ezi okwukwe.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “n'etiti unu.”
    reason: alternative_reading
