id: 2CO.13.9
reference: 2 Corinthians 13:9
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: χαίρομεν γὰρ ὅταν ἡμεῖς ἀσθενῶμεν, ὑμεῖς δὲ δυνατοὶ ἦτε· ⸀τοῦτο καὶ εὐχόμεθα, τὴν ὑμῶν κατάρτισιν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/013/009.yaml
  text: 'For we rejoice when we are weak and you are strong[a]. And this also is what we pray for: your restoration.'
translation:
  language: ig
  text: 'N’ihi na anyị na-aṅụrị ọṅụ mgbe anyị na-adịghị ike, ma unu dị ike. Ihe a kwa ka anyị na-ekpe ekpere: ka e weghachite unu n’ọnọdụ kwesịrị ekwesị.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya dịka “ntozu okè unu” ma ọ bụ “ime ka unu zuo oke.” Okwu Grik ahụ pụrụ ịpụta mweghachi, ịkwadebe mmadụ nke ọma, ma ọ bụ ime ka mmadụ ruo n’ọnọdụ kwesịrị ekwesị.
    reason: lexical_alternative
lexical_decisions:
- source_word: χαίρομεν
  choice: anyị na-aṅụrị ọṅụ
  rationale: Ọ na-egosi ọṅụ Pọl nwere ugbu a ma na-echekwa ike okwu Grik ahụ karịa nanị ‘obi dị anyị ụtọ.’
- source_word: γὰρ
  choice: N’ihi na
  rationale: Ọ na-ejikọta amaokwu a dị ka nkọwa nke okwu bu ya ụzọ n’ụzọ doro anya ma bụrụkwa Igbo eke.
- source_word: ὅταν
  choice: mgbe
  rationale: Ya na ngwaa subjunctive na-enye echiche oge n’ozuzu; ‘mgbe’ bụ okwu Igbo dị mfe ma kwekọọ n’ebe a.
- source_word: ἀσθενῶμεν
  choice: anyị na-adịghị ike
  rationale: Ọ na-echekwa nghọta sara mbara nke adịghị ike—n’anụ ahụ, n’ọkwa mmadụ, ma ọ bụ n’ọdịdị Pọl pụtara—n’etinyeghị nkọwa karịrị ihe isi mmalite kwuru.
- source_word: δυνατοὶ
  choice: unu dị ike
  rationale: Ọ bụ ihe megidere ‘anyị na-adịghị ike’ n’ụzọ doro anya ma na-echekwa usoro ntụnyere Pọl.
- source_word: τοῦτο καὶ εὐχόμεθα
  choice: Ihe a kwa ka anyị na-ekpe n’ekpere
  rationale: Ọ na-echekwa nkwusi ike dị n’ihu okwu τοῦτο na echiche εὐχόμεθα dịka ikpe ekpere.
- source_word: κατάρτισιν
  choice: ka e weghachite unu n’ọnọdụ kwesịrị ekwesị
  rationale: Nhọrọ a na-egosi ime ka ndị Kọrịnt laghachi n’ọnọdụ ziri ezi, ma ọ naghị emechi ụzọ nye echiche ndị ọzọ dịka ịkwadebe ha ma ọ bụ ime ka ha zuo oke.
theological_decisions:
- issue: Ihe κατάρτισις pụtara n’ihe gbasara ebumnuche Pọl dị ka onye na-elekọta ọgbakọ
  choice: ka e weghachite unu n’ọnọdụ kwesịrị ekwesị
  alternative: ka unu tozuo etozuo; ka e mee ka unu zuo oke
  rationale: N’ọnọdụ okwu a, echiche nke idozi ma ọ bụ iweghachi ndị Kọrịnt n’ọnọdụ kwesịrị ekwesị dabara nke ọma. Ma okwu Grik ahụ sara mbara, ya mere e debere nghọta ndị ọzọ n’okpuru ala kama ịkọwa ya dịka ozizi pụrụ iche banyere izu oke.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. E debere ntụnyere ‘anyị na-adịghị ike/unu dị ike’ na nkwusi ike nke ‘ihe a kwa,’ ebe e ji nkọwa ala peeji chekwaa obosara nghọta κατάρτισις.
