  to: 'N’ihi na anyị na-aṅụrị ọṅụ mgbe anyị na-adịghị ike, ma unu dị ike. Ihe a kwa ka anyị na-ekpe ekpere: ka e weghachite unu n’ọnọdụ kwesịrị ekwesị.[a]'
  rationale: The sole required textual revision relocates the lexical footnote marker from “unu dị ike” to the translation of κατάρτισιν, which the note actually explains. The footnote is lightly recast for idiomatic Igbo and to retain the source word’s possible senses of restoration, equipping, and completion without deciding the ambiguity beyond the main contextual rendering.
