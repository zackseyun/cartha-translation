  text: For we are not able to do anything against the truth[a], but for the truth.
translation:
  language: ig
  text: N’ihi na anyị enweghị ike ime ihe ọ bụla megide eziokwu ahụ, kama anyị nwere ike ịkwado eziokwu ahụ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ma ọ bụ: “N’ihi na anyị enweghị ike ime ihe ọ bụla megide eziokwu ahụ, kama anyị nwere ike ime ihe maka eziokwu ahụ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ γὰρ
  choice: N’ihi na ... apụghị
  rationale: γάρ na-enye ihe kpatara okwu bu ụzọ; “N’ihi na” bụ njikọ nkọwa doro anya n’Igbo, ebe “apụghị” na-egosi ngọnarị.
- source_word: δυνάμεθά
  choice: anyị apụghị
  rationale: Nke a na-egosipụta enweghị ike ime ihe ahụ n’ụzọ Igbo na-asụkarị, na-enweghị ịgbanwe ya ka ọ bụrụ enweghị ikike.
- source_word: τι
  choice: ihe ọ bụla
  rationale: N’okwu a jụrụ ajụ, τι nwere nghọta sara mbara nke “ihe ọ bụla.”
- source_word: κατὰ τῆς ἀληθείας
  choice: megide eziokwu ahụ
  rationale: κατά ya na genitive pụtara ịnọgide megide; “ahụ” na-egosipụta article Grik ma na-ewere eziokwu dị ka ihe a kapịrị ọnụ n’okwu a.
- source_word: ἀλλὰ
  choice: kama
  rationale: “Kama” na-egosipụta ntụgharị siri ike dị n’etiti akụkụ abụọ ahụ.
- source_word: ὑπὲρ τῆς ἀληθείας
  choice: na-akwado eziokwu ahụ
  rationale: ὑπέρ ebe a pụtara ịnọ n’akụkụ ma ọ bụ ịkwado eziokwu. N’Igbo, “na-akwado” doro anya karịa nsụgharị nkịtị “maka,” nke nwere ike ịda mgbagwoju anya.
theological_decisions:
- issue: Ihe “eziokwu ahụ” pụtara n’okwu Pọl
  choice: E debere ya dịka “eziokwu ahụ” n’enweghị ịkọwa ya naanị dịka otu ụkpụrụ okwukwe pụrụ iche.
  alternative: ozi ọma nke bụ eziokwu; ihe bụ eziokwu
  rationale: Okwu Grik ahụ sara mbara, ọ bụ ezie na ọnọdụ ya gụnyere eziokwu nke ozi ọma. Nsụgharị a na-echekwa obosara na esemokwu nke okwu Pọl.
- issue: Ma akụkụ nke abụọ ọ na-ekwu nanị banyere ikike ma ọ bụ banyere ihe ndị ozi ahụ na-eme
  choice: E tinyere “anyị na-eme ihe” ka antithesis ahụ zuo oke n’Igbo, ma e tinyeghị “naanị.”
  alternative: kama maka eziokwu ahụ; kama anyị nwere ike ime ihe maka eziokwu ahụ
  rationale: Grik hapụrụ ngwaa n’akụkụ nke abụọ ka a ghọta ya site n’akụkụ mbụ. Igbo chọrọ ime ka njikọ ahụ pụta ìhè; “anyị na-eme ihe na-akwado” na-ezere echiche na ha enweghị ike n’akụkụ mbụ ma nwee ike n’akụkụ nke abụọ. E tinyaghị “naanị” n’ahịrị bụ isi n’ihi na ọ nọghị kpọmkwem na Grik.
translation_notes:
  register: Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E jiri “eziokwu ahụ” chekwaa article na obosara nkà mmụta okpukpe nke ἀλήθεια; e jiri “na-akwado” mee ka ὑπέρ doo anya n’Igbo.
