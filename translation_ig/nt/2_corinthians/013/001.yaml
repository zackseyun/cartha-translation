    rationale: This can be read as “by the evidence of the witnesses,” but is not idiomatic and obscures the source’s mouth/witness legal formula. The proposed alternative also shifts from the main text without expressing the alternative clearly.
  - severity: low
    issue: “Ugboro nke atọ” is less natural than “oge nke atọ” for an announced third visit.
    rationale: Both are intelligible, but “oge nke atọ” is the ordinary Standard Igbo expression for “the third time” in this context.
