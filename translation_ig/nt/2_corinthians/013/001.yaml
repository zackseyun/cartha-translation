  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Τρίτον τοῦτο ἔρχομαι πρὸς ὑμᾶς· ἐπὶ στόματος δύο μαρτύρων καὶ τριῶν σταθήσεται πᾶν ῥῆμα.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/013/001.yaml
  text: 'This is the third time I am coming to you: “Every matter will be established by the testimony of two witnesses or three.”[a][b]'
translation:
  language: ig
  text: 'Nke a bụ oge nke atọ m na-abịakwute unu: “Ọ bụ n’ọnụ ndị àmà abụọ ma ọ bụ atọ ka okwu ọ bụla ga-eguzosi ike.”[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ihe ọ bụla a na-ekpe.” Okwu Grik ahụ na-agbaso usoro okwu iwu dị na Diuterọnọmi 19:15 nke ọma; “n’ọnụ ndị àmà” bụ akpaalaokwu iwu.
    reason: lexical_alternative
  - marker: b
    text: Nke a na-ezo aka na Diuterọnọmi 19:15.
    reason: cross_reference
lexical_decisions:
- source_word: Τρίτον τοῦτο
  choice: Nke a bụ ugboro nke atọ
  rationale: Nkebiokwu a na-arụ ọrụ dị ka adverb, na-egosi na ọ bụ ọbịbịa Pọl nke ugboro atọ; ntụgharị a bụ Igbo doro anya ma kwekọọ n’usoro okwu Grik.
- source_word: ἔρχομαι πρὸς ὑμᾶς
  choice: m na-abịakwute unu
  rationale: Oge ugbu a ebe a nwere ike igosi ọbịbịa dị nso; ‘na-abịakwute’ na-echekwa mmetụta ahụ n’Igbo nkịtị.
- source_word: ἐπὶ στόματος
  choice: site n’ọnụ
  rationale: Nke a na-echekwa akpaalaokwu iwu nke sitere na Diuterọnọmi 19:15. Nkọwa ala peeji na-akọwa na ọ pụtara akaebe, ka isi okwu ghara ida ọdịdị ntụaka ahụ.
- source_word: δύο μαρτύρων καὶ τριῶν
  choice: ndị akaebe abụọ ma ọ bụ atọ
  rationale: Ọ bụ usoro okwu iwu nke pụtara mmadụ abụọ ma ọ bụ mmadụ atọ, ọ bụghị ngụkọta mmadụ ise; ‘ma ọ bụ’ na-eme ka nke ahụ doo anya n’Igbo.
- source_word: σταθήσεται
  choice: A ga-eme ka ... guzosie ike
  rationale: Future passive a nwere nghọta iwu nke ikwenye ma ọ bụ ime ka ihe bụrụ nke a kwadoro; okwu a na-echekwa ihe atụ nke ‘iguzosi ike’ ma bụrụkwa ihe a ghọtara n’Igbo.
- source_word: πᾶν ῥῆμα
  choice: okwu ọ bụla
  rationale: ῥῆμα nwere ike ịbụ ‘okwu,’ ‘nkwupụta,’ ma ọ bụ ‘okwu ikpe.’ E debere ‘okwu ọ bụla’ iji chekwaa obosara na ntakịrị mgbagwoju anya nke ntụaka ahụ, ebe nkọwa ala peeji na-enye nghọta iwu nke ‘okwu a na-ekpe.’
theological_decisions:
- issue: Ojiji Pọl ji ụkpụrụ iwu dị na Diuterọnọmi mee ihe n’ọnọdụ ịdọ aka ná ntị
  choice: E sụgharịrị πᾶν ῥῆμα dịka ‘okwu ọ bụla,’ na-enweghị ime ka ọ bụrụ naanị ebubo ma ọ bụ naanị okwu ịdọ aka ná ntị n’ọgbakọ.
  alternative: ‘ihe ọ bụla a na-ekpe’ ma ọ bụ ‘ebubo ọ bụla’
  rationale: Akwụkwọ Grik na-ahapụ okwu ahụ ka ọ saa mbara. Ịkpọ ya ‘ebubo’ ga-eme ka ihe Pọl kwuru dị warara karịa ihe e dere, ebe ‘okwu ọ bụla’ na nkọwa ala peeji na-echekwa ma ọdịdị ntụaka ahụ ma nghọta iwu ya.
translation_notes:
  register: E ji Igbo ọkọlọtọ, nke dị ugbu a ma dị ùgwù, dee ya. ‘Unu’ na-egosi na Pọl na-agwa ọtụtụ mmadụ okwu. E debere ‘site n’ọnụ’ n’isi okwu iji chekwaa akpaalaokwu Akwụkwọ Nsọ na nke iwu, ma kọwaa nghọta ya dịka akaebe n’ala peeji.
