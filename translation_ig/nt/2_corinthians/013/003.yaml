source:
  edition: SBLGNT
  text: ἐπεὶ δοκιμὴν ζητεῖτε τοῦ ἐν ἐμοὶ λαλοῦντος Χριστοῦ· ὃς εἰς ὑμᾶς οὐκ ἀσθενεῖ ἀλλὰ δυνατεῖ ἐν ὑμῖν,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/013/003.yaml
  text: since you are seeking proof that Messiah is speaking in me—he is not weak toward you[a], but is powerful in you[b],
translation:
  language: ig
  text: Ebe ọ bụ na unu na-achọ ihe akaebe na Onye ahụ e tere mmanụ na-ekwu okwu n’ime m[a]—ọ bụghị onye na-adịghị ike n’ebe unu nọ, kama ọ dị ike n’ime unu[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “Onye ahụ e tere mmanụ na-ekwu okwu site n’ọnụ m.” Grik kwuru ya kpọmkwem dịka “Onye ahụ e tere mmanụ nke na-ekwu okwu n’ime m.”
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị ya, “ọ dị ike n’etiti unu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπεὶ
  choice: Ebe ọ bụ na
  rationale: Na-egosipụta ihe kpatara okwu Pọl kwuru n’amaokwu gbara ya gburugburu, dịka ‘ebe ọ bụ na’ si eme n’Igbo dị ugbu a.
- source_word: δοκιμὴν
  choice: ihe akaebe
  rationale: N’ebe a, okwu ahụ pụtara ihe na-egosi ma na-akwado na ihe bụ eziokwu, ọ bụghị usoro ịnwale ihe.
- source_word: ζητεῖτε
  choice: unu na-achọ
  rationale: Na-echekwa omume na-aga n’ihu nke ngwaa oge ugbu a, ma kwekọọ n’otú e si ekwu ‘ịchọ ihe akaebe’ n’Igbo.
- source_word: τοῦ ἐν ἐμοὶ λαλοῦντος Χριστοῦ
  choice: na Onye ahụ e tere mmanụ na-ekwu okwu n’ime m
  rationale: E jiri nkebiokwu na-amalite na ‘na’ gosipụta ọdịnaya nke ihe akaebe ahụ. ‘N’ime m’ na-edobe ἐν ἐμοί n’ụzọ doro anya, ma nkọwa ala peeji na-echekwa nghọta ‘site n’ọnụ m.’
- source_word: Χριστοῦ
  choice: Onye ahụ e tere mmanụ
  rationale: A sụgharịrị aha-ọrụ Χριστός dịka aha onye ahụ Chineke tere mmanụ, kama iji naanị mkpụrụokwu e si n’asụsụ ọzọ binye; nke a na-eme ka ihe aha-ọrụ ahụ pụtara doo onye Igbo nkịtị anya.
- source_word: εἰς ὑμᾶς
  choice: n’ebe unu nọ
  rationale: Na-egosipụta ntụziaka ma ọ bụ mmekọrịta nke εἰς n’ebe ndị Kọrịnt nọ.
- source_word: οὐκ ἀσθενεῖ
  choice: ọ bụghị onye na-adịghị ike
  rationale: Ụdị a na-ezere mgbagwoju anya Igbo nke ‘ọ dịghị ike,’ nke pụtara na onye ahụ enweghị ike, ma na-echekwa ọdịiche dị n’etiti adịghị ike na ịdị ike.
- source_word: ἀλλὰ δυνατεῖ
  choice: kama ọ dị ike
  rationale: Na-echekwa ntụnyere doro anya megide ‘adịghị ike’ ma na-eji okwu Igbo dị mfe ma sie ike.
- source_word: ἐν ὑμῖν
  choice: n’ime unu
  rationale: Na-esochi ἐν ὑμῖν nso ma na-ahapụ ohere ma ọ bụ ọrụ dị n’ime ndị kwere ekwe n’otu n’otu ma ọ bụ n’ime ha dịka ọgbakọ.
theological_decisions:
- issue: Nsụgharị Χριστοῦ dịka aha-ọrụ
  choice: Onye ahụ e tere mmanụ
  alternative: Kraịst; Mezaịa
  rationale: N’ahịrịokwu a, Χριστός na-arụ ọrụ dịka aha-ọrụ. Nsụgharị ahụ na-eme ka ihe aha ahụ pụtara pụta ìhè n’Igbo, n’etinyeghị ozizi otu ụka.
- issue: Ike nke ἐν ἐμοί
  choice: na-ekwu okwu n’ime m
  alternative: na-ekwu okwu site n’ọnụ m
  rationale: Isi ederede na-echekwa preposishọn Grik n’ụzọ chiri anya. Nkọwa ala peeji na-egosi nghọta nke Kraịst iji Pọl kwuo okwu, n’enweghị ikpochapụ esemokwu dị n’etiti ọnụnọ n’ime ya na ọrụ site n’aka ya.
- issue: Ike nke ἐν ὑμῖν
  choice: ọ dị ike n’ime unu
  alternative: ọ dị ike n’etiti unu
  rationale: ‘N’ime unu’ na-esochi Grik nso ma nwee ike ịgụnye ọrụ n’ime ndị mmadụ ma ọ bụ n’ime ọgbakọ ahụ. E debere nghọta obodo ‘n’etiti unu’ na nkọwa ala peeji.
translation_notes:
  register: E ji Igbo Izugbe dị ugbu a, dị ùgwù ma dị mfe nghọta. A họọrọ ‘Onye ahụ e tere mmanụ’ iji mee ka aha-ọrụ ahụ pụta ìhè; e zere ‘ọ dịghị ike’ n’ihi na n’Igbo ọ ga-apụta na ọ nweghị ike, nke ga-agbanwe ihe Grik kwuru. Akara ogologo na njedebe na-egosi na echiche a jikọrọ okwu gbara ya gburugburu.
