  terminology: 'A sụgharịrị okwu ndị bụ isi n’ụzọ na-adịgide adịgide: ‘adịghị ike,’ ‘ike Chineke,’ ‘n’ime ya,’ na ‘na ya.’ Nsụgharị ahụ anaghị etinye nkwubi okwu okpukpe ma ọ bụ nkọwa denominashọn n’ihe ‘adịghị ike’ Kraịst ma ọ bụ n’ụdị ndụ a ga-adị ‘na ya.’ Anchors a–d dị, kwekọọ n’ihe odide ala ha, ma kwado nhọrọ nsụgharị ndị nwere mgbagwoju anya.'
