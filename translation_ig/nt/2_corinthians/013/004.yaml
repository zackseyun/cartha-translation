id: 2CO.13.4
reference: 2 Corinthians 13:4
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ⸀γὰρ ἐσταυρώθη ἐξ ἀσθενείας, ἀλλὰ ζῇ ἐκ δυνάμεως θεοῦ. καὶ γὰρ ἡμεῖς ἀσθενοῦμεν ἐν αὐτῷ, ἀλλὰ ⸀ζήσομεν σὺν αὐτῷ ἐκ δυνάμεως θεοῦ εἰς ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/013/004.yaml
  text: For indeed he was crucified in weakness[a], but he lives by the power of God. For indeed we are weak in him[d][c][b], but we will live with him by the power of God toward you.
translation:
  language: ig
  text: N’ihi na n’ezie, a kpọgidere ya n’obe n’adịghị ike[a], ma ọ dị ndụ site n’ike Chineke. N’ihi na n’ezie, anyị onwe anyị adịghị ike n’ime ya, ma anyị na ya ga-adị ndụ[c] site n’ike Chineke[b] n’ebe unu nọ[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, ‘site n’adịghị ike.’ Okwu Grik ἐξ nwere ike igosi isi mmalite ma ọ bụ ntọala.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị ya, ‘n’ike Chineke.’ Grik kwughachiri ἐκ iji mee ka ike Chineke guzo megide adịghị ike.
    reason: lexical_alternative
  - marker: c
    text: ‘Anyị na ya ga-adị ndụ’ nwere ike ịpụta ndụ nke ike Kraịst ga-eme ka Pọl gosipụta n’ebe ndị Kọrịnt nọ; ọ pụkwara inwe ụda nke ndụ mbilite n’ọnwụ sara mbara.
    reason: alternative_reading
  - marker: d
    text: A pụkwara ịsụgharị ya, ‘maka unu’ ma ọ bụ ‘n’etiti unu.’ Okwu Grik εἰς ὑμᾶς dị mkpirikpi ma nwee ike igosi ntụziaka, njikọ, ma ọ bụ mmetụta.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐσταυρώθη
  choice: a kpọgidere ya n’obe
  rationale: 'Nke a bụ ụzọ doro anya ma bụrụkwa nke ndị Igbo na-ejikarị akọwa passive aorist nke σταυρόω: a kpọgidere ya n’obe.'
- source_word: ἐξ ἀσθενείας
  choice: n’adịghị ike
  rationale: Ọ bụ okwu Igbo na-aga were were ma na-edobe ọdịiche Pọl mere n’etiti adịghị ike na ike Chineke. Ihe odide ala na-egosi na ἐξ nwekwara ike igosi isi mmalite ma ọ bụ ntọala.
- source_word: ζῇ
  choice: ọ dị ndụ
  rationale: Ọ na-edobe present tense na echiche nke ndụ na-aga n’ihu.
- source_word: ἐκ δυνάμεως θεοῦ
  choice: site n’ike Chineke
  rationale: ‘Site n’ike Chineke’ bụ Igbo ebumpụta ụwa nke na-egosi na ike Chineke bụ isi mmalite ma ọ bụ ụzọ ndụ ahụ si dị, ma na-edobe ntụnyere ya na adịghị ike.
- source_word: ἀσθενοῦμεν
  choice: anyị onwe anyị adịghị ike
  rationale: Ọ na-edobe njikọ okwu ahụ na ἀσθένεια nke dị na nkebi mbụ; ‘onwe anyị’ na-eme ka ἡμεῖς pụta ìhè.
- source_word: ἐν αὐτῷ
  choice: n’ime ya
  rationale: Ọ na-edobe asụsụ Pọl dị mkpirikpi banyere ịdị n’ime Kraịst n’enweghị ịkọwa ya karịa ihe odide ahụ kwuru.
- source_word: ζήσομεν
  choice: anyị ... ga-adị ndụ
  rationale: Ọ na-edobe future tense nke Grik ma ghara ikpebi ma ọ bụ naanị ndụ ozi Pọl ma ọ bụ ndụ mbilite n’ọnwụ ka e bu n’obi.
- source_word: σὺν αὐτῷ
  choice: anyị na ya
  rationale: Ọ na-egosi iso ya dịrị ndụ ma na-ada ka Igbo nkịtị.
- source_word: εἰς ὑμᾶς
  choice: n’ebe unu nọ
  rationale: Ọ na-edobe okwu ahụ dị mkpirikpi ma na-egosi njikọ ma ọ bụ mmetụta ndụ ahụ nwere n’ebe ndị Kọrịnt nọ, n’enweghị ịmanye naanị otu nkọwa.
theological_decisions:
- issue: Ihe ‘adịghị ike’ Kraịst mgbe a kpọgidere ya n’obe pụtara
  choice: 'E debere ‘n’adịghị ike’ dịka ihe mgbagwoju anya Pọl kwuru: a kpọgidere Kraịst n’obe n’adịghị ike, ma ọ dị ndụ site n’ike Chineke.'
  alternative: Ịsụgharị ya naanị dịka adịghị ike nke ndị mmadụ chere na ha hụrụ.
  rationale: Nsụgharị ahụ anaghị agọnarị ịdị nsọ ma ọ bụ ọdịdị Chineke nke Kraịst, ọ naghịkwa etinye nkọwa okpukpe nke okwu Grik ahụ ekwughị.
- issue: Ihe ‘anyị na ya ga-adị ndụ’ na-ezo aka na ya
  choice: E hapụrụ ya ka ọ nwee ike ịgụnye ndụ na ike Kraịst ga-egosipụta n’ozi Pọl n’ebe ndị Kọrịnt nọ, ma ka ọ ka nwee ụda ndụ mbilite n’ọnwụ.
  alternative: Ime ka ọ bụrụ naanị mbilite n’ọnwụ n’ọdịnihu, ma ọ bụ naanị ike Pọl ga-egosipụta ugbu a.
  rationale: Ọnọdụ okwu ahụ na-atụ aka n’ihe Pọl ga-eme n’ebe ndị Kọrịnt nọ, ebe okwu iso Kraịst dịrị ndụ nwekwara ihe jikọrọ ya na ndụ mbilite n’ọnwụ; ya mere e dozighị esemokwu ahụ n’otu ụzọ naanị.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. E debere ahịrịokwu Pọl dị mkpirikpi na ntụnyere dị n’etiti adịghị ike na ike Chineke, ma zere okwu ụka pụrụ iche ma ọ bụ nkọwa ga-emechi nghọta okwu ahụ n’otu ụzọ.
