  source_fidelity: 'Nsụgharị ahụ na-esochi SBLGNT nke ọma: ọ na-edobe passive nke ἐσταυρώθη, ntụnyere dị n’etiti ἀσθένεια na δύναμις θεοῦ, present ζῇ, future ζήσομεν, nakwa njikọ ἐν αὐτῷ/σὺν αὐτῷ. ‘N’adịghị ike’ bụ nsụgharị dabara adaba n’okwu a; ihe odide ala a na-edobe ohere ‘site n’adịghị ike’ n’enweghị ime ka arụmụka ahụ kpebie karịa ka Grik si kwuo. ‘N’ebe unu nọ’ na-arụ ọrụ dịka okwu dị mkpirikpi maka εἰς ὑμᾶς, ebe ihe odide ala na-enye ụzọ ndị ọzọ.'
