review_pass:
  verdict: revise
  source_fidelity: Usoro iwu ndị ahụ na nkwa ikpeazụ na-esochi Grik nke ọma. Otú ọ dị, “dozienụ onwe unu” na-enye echiche na ha onwe ha bụ naanị ndị na-arụzi onwe ha, ebe καταρτίζεσθε nwere olu middle/passive ma na-ahapụ ohere maka “ka e dozie unu / ka unu dịghachi n’ọnọdụ kwesịrị ekwesị.”
  naturalness: Igbo ahụ n’ozuzu ya bụ Standard Igbo doro anya ma dịkwa n’usoro kwesịrị ekwesị. Agbanyeghị, “Ka ọ dị unu mma” abụghị ụzọ doro anya, eke e si akọwa ekele mmechi “farewell”; “Nọdụnụ nke ọma” dabara adaba karịa. Kọma, ọ bụghị semikolon, na-eme ka njikọ καὶ (“ma”) na nkwa Chineke pụta ìhè karịa.
  terminology: “ụmụnna,” “agbamume,” “otu uche,” “udo,” na “Chineke nke ịhụnanya na udo” dabara nke ọma. Nkọwa banyere ụmụnna na-edobe ma ụdị nwoke nke Grik ma ojiji ya maka ọgbakọ dum.
  issues:
  - severity: medium
    issue: “dozienụ onwe unu” na καταρτίζεσθε
    rationale: Ntụgharị ahụ bụ iwu reflexive siri ike. Ụdị middle/passive Grik na-enye ohere ka a ghọta ya dị ka ịnata mmezi ma ọ bụ ịlaghachi n’ọnọdụ kwesịrị ekwesị. “Ka e dozie unu” na-echekwa enweghị nkọwa kpọmkwem a.
  - severity: low
    issue: 'Nkọwa ala peeji a: “Ka ọ dị unu mma”'
    rationale: Nke a anaghị arụ ọrụ nke ọma dị ka ekele mmechi/farewell n’Igbo. “Nọdụnụ nke ọma” bụ nhọrọ doro anya karịa.
  - severity: low
    issue: Semikolon tupu “Chineke”
    rationale: Grik ji καὶ jikọta nkwa Chineke na iwu ndị bu ụzọ. Kọma na “ma” na-egosi njikọ ahụ nke ọma karịa.
