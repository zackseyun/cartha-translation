id: 2CO.13.11
reference: 2 Corinthians 13:11
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Λοιπόν, ἀδελφοί, χαίρετε, καταρτίζεσθε, παρακαλεῖσθε, τὸ αὐτὸ φρονεῖτε, εἰρηνεύετε, καὶ ὁ θεὸς τῆς ἀγάπης καὶ εἰρήνης ἔσται μεθ’ ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/013/011.yaml
  text: Finally[a], brothers, rejoice, be restored, be encouraged, think the same thing, live in peace[e][d][c][b], and the God of love and peace will be with you.
translation:
  language: ig
  text: N'ikpeazụ[a], ụmụnna[b], ṅụrịanụ ọṅụ, ka e dozie unu[c], naraanụ agbamume[d], nweenụ otu uche[e], birinụ n'udo, ma Chineke nke ịhụnanya na udo ga-anọnyere unu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ma ọ bụ, “Nọdụnụ nke ọma.” Okwu Grik a nwere ike ịbụ ekele mmechi, ma ebe a o yiri ka ọ bụ akụkụ nke usoro agbamume: “ṅụrịanụ ọṅụ.”'
    reason: lexical_alternative
  - marker: b
    text: N'ebe a, “ụmụnna” bụ okwu a kpọrọ ọgbakọ dum, o yikwara ka ọ gụnyere ma ndị nwoke ma ndị nwanyị.
    reason: cultural_note
  - marker: c
    text: A pụkwara ịsụgharị ya, “ka e mee ka unu zuo ezu,” “ka e mee ka unu dịghachi mma,” ma ọ bụ “debenụ onwe unu n'usoro.”
    reason: lexical_alternative
  - marker: d
    text: A pụkwara ịsụgharị ya, “kwe ka a gbaa unu ume” ma ọ bụ “naraanụ ndụmọdụ.”
    reason: lexical_alternative
  - marker: e
    text: N'ụzọ nkịtị, “na-eche otu ihe”; ya bụ, “nweenụ otu uche.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Λοιπόν
  choice: N'ikpeazụ
  rationale: Ọ na-egosi na Pọl na-erute n'okwu mmechi ya; ntụgharị a bụ nke Igbo ugbu a na-aghọta nke ọma.
- source_word: ἀδελφοί
  choice: ụmụnna
  rationale: Ọ na-edobe ụdị okwu Pọl ji kpọọ ọgbakọ ahụ, ebe nkọwa ala peeji na-akọwa na ọ gụnyere ndị nwoke na ndị nwanyị.
- source_word: χαίρετε
  choice: ṅụrịanụ ọṅụ
  rationale: N'agbanyeghị na okwu Grik a nwekwara ike ịbụ ekele mmechi, ebe a ọ dabara n'usoro iwu na agbamume ndị ọzọ, ya mere ihe ọ pụtara bụ ka ha ṅụrịa ọṅụ.
- source_word: καταρτίζεσθε
  choice: dozienụ onwe unu
  rationale: Nke a na-egosi ime ka ihe laghachi n'ọnọdụ kwesịrị ekwesị ma ọ bụ idozi ihe mebiri emebi, n'ekwughị na ha ga-eru izu okè na-enweghị ntụpọ.
- source_word: παρακαλεῖσθε
  choice: naraanụ agbamume
  rationale: Ụdị okwu Grik ahụ nwere ike ịpụta ịnata agbamume ma ọ bụ ndụmọdụ siri ike; 'naraanụ agbamume' na-edobe echiche nke ịnabata ihe a na-agwa ha.
- source_word: τὸ αὐτὸ φρονεῖτε
  choice: nweenụ otu uche
  rationale: Nke a bụ ụzọ Igbo doro anya si kwuo ka ha nwee otu echiche na ịdị n'otu, ma nkọwa ala peeji na-edobe okwu Grik ahụ n'ụzọ nkịtị.
- source_word: εἰρηνεύετε
  choice: birinụ n'udo
  rationale: Ọ na-egosi omume udo nke ga-aga n'ihu n'etiti ndị nọ n'ọgbakọ.
- source_word: ὁ θεὸς τῆς ἀγάπης καὶ εἰρήνης
  choice: Chineke nke ịhụnanya na udo
  rationale: Nke a na-edobe njikọ okwu Grik ahụ n'ụzọ kwụ ọtọ ma bụrụkwa Igbo dị ùgwù na nke a na-aghọta.
- source_word: ἔσται μεθ’ ὑμῶν
  choice: ga-anọnyere unu
  rationale: Ọ bụ nkwa dị mfe banyere Chineke ịnọnyere ha; okwu a bụ Igbo eke nke oge a.
theological_decisions:
- issue: Ma ἀδελφοί ọ na-agụnye ndị nwanyị nọ n'ọgbakọ
  choice: E ji 'ụmụnna' mee ihe n'ahịrịokwu bụ isi, tinyekwa nkọwa na ọ na-agụnye ma ndị nwoke ma ndị nwanyị.
  alternative: Ụmụnna nwoke na ụmụnna nwanyị
  rationale: Ụdị Grik ahụ bụ ọtụtụ nke nwoke, ma n'okwu Pọl ọ na-akpọkarị ọgbakọ dum. Nkọwa ala peeji na-eme ka oke okwu ahụ doo anya n'ebugharịghị nkọwa ahụ banye n'ahịrịokwu bụ isi.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ ọtụtụ iwu doro anya—“ṅụrịanụ,” “naraanụ,” “nweenụ,” na “birinụ”—iji chekwaa usoro agbamume dị na Grik. A zere okwu ụka pụrụ iche nke otu nkwenkwe.
