base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/013/012.yaml
  text: Greet one another with a holy kiss[b][a]. All the saints greet you.
translation:
  language: ig
  text: Keleenụ ibe unu nsusu ọnụ dị nsọ[a]. Ndị nsọ niile[b] na-ekele unu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “nsusu ọnụ e doro nsọ.” Ọ bụ ụdị ekele ndị mmadụ maara n’oge ahụ, nke gosiri ịdị nsọ na mmekọrịta Ndị Kraịst.
    reason: lexical_alternative
  - marker: b
    text: “Ndị nsọ” n’ebe a pụtara ndị kwere ekwe, ya bụ, ndị Chineke doro nsọ; ọ bụghị naanị otu ndị pụrụ iche e kwupụtara n’oge e mesịrị na ha bụ ndị nsọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσπάσασθε
  choice: keleenụ
  rationale: Ngwaa iwu a na-agwa ọtụtụ mmadụ ka ha kelee ibe ha; “keleenụ” bụ ụzọ Igbo nkịtị, doro anya si kwuo ya.
- source_word: ἀλλήλους
  choice: ibe unu
  rationale: Nke a na-egosi omume ndị nọ n’ọgbakọ na-emere ibe ha.
- source_word: ἐν ἁγίῳ φιλήματι
  choice: jirienụ nsusu ọnụ dị nsọ
  rationale: “Jirienụ” na-enye ἐν ọrụ nke ụzọ e si ekele mmadụ n’Igbo; “nsusu ọnụ” na-edobe kpọmkwem echiche φίλημα, ebe “dị nsọ” na-edobe ἁγίῳ.
- source_word: ἀσπάζονται
  choice: na-ekele
  rationale: Oge ugbu a na-egosi na ndị ahụ na-ezigara ndị a na-agwa okwu ekele.
- source_word: ὑμᾶς
  choice: unu
  rationale: “Unu” na-egosi nke ọma na onye nke abụọ a bụ ọtụtụ mmadụ.
- source_word: οἱ ἅγιοι πάντες
  choice: Ndị nsọ niile
  rationale: “Ndị nsọ” na-edobe aha Pọl ji akpọ ndị kwere ekwe, “niile” na-edobekwa πάντες.
theological_decisions:
- issue: Ihe οἱ ἅγιοι pụtara n’ebe a
  choice: Ndị nsọ
  alternative: Ndị Chineke doro nsọ
  rationale: N’akwụkwọ Pọl, okwu a na-ezo aka n’ebe ndị kwere ekwe niile nọ, ọ bụghị naanị mmadụ ole na ole e mesịrị kpọrọ ndị nsọ n’ụzọ pụrụ iche. A hapụrụ “Ndị nsọ” n’ahụ ederede ma kọwaa ya n’okpuru.
translation_notes:
  register: Asụsụ Igbo izugbe, nke dị ugbu a ma nwee ugwu. E ji “nsusu ọnụ” kwuo omume ahụ n’enweghị ịgbanwe ya ka ọ bụrụ naanị ekele nkịtị; e jikwa “unu” doo anya na ndị a na-agwa okwu dị ọtụtụ.
