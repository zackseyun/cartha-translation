  verdict: revise
  source_fidelity: The draft preserves both imperatives/exhortations, the reciprocal sense of ἀλλήλους, the explicit ‘kiss’ (φίλημα), the qualifying ‘holy’ (ἁγίῳ), and the inclusive sense of ‘all the saints’ (οἱ ἅγιοι πάντες). ‘Ndị nsọ niile’ is an appropriate established equivalent for Paul’s communal designation and does not itself require a doctrinally narrower meaning.
  naturalness: The opening serial construction, “Jirienụ nsusu ọnụ dị nsọ kelee ibe unu,” is understandable but is less idiomatic and its imperative form of jiri is awkward in Standard Igbo. Directly placing the manner of greeting after the reciprocal object is concise and natural.
  terminology: ‘nsusu ọnụ dị nsọ’ appropriately retains the concrete gesture and its holy qualification. ‘Ndị nsọ’ is retained consistently; the explanatory note appropriately clarifies its Pauline communal reference without imposing a later ecclesiastical category.
