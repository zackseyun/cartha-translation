reference: 2 Corinthians 13:10
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: διὰ τοῦτο ταῦτα ἀπὼν γράφω, ἵνα παρὼν μὴ ἀποτόμως χρήσωμαι κατὰ τὴν ἐξουσίαν ἣν ⸂ὁ κύριος ἔδωκέν μοι⸃, εἰς οἰκοδομὴν καὶ οὐκ εἰς καθαίρεσιν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/013/010.yaml
  text: For this reason I write these things while absent[a], so that when present I may not have to act harshly[b], according to the authority that the Lord gave me for building up and not for tearing down.
translation:
  language: ig
  text: N’ihi nke a ka m na-ede ihe ndị a mgbe m na-anọghị, ka, mgbe m nọ, ghara iji ikike Onyenwe anyị nyere m mee ihe n’ụzọ siri ike[a]—ikike ahụ e nyere m maka iwulite, ọ bụghị maka ịkwatu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ghara iji ikike Onyenwe anyị nyere m emeso unu ihe n’ụzọ siri ike” ma ọ bụ “ghara iji ikike ahụ mee ihe n’ụzọ dị nkọ.”
    reason: lexical_alternative
  - marker: b
    text: 'Ma ọ bụ, “maka ịgba ume, ọ bụghị maka mbibi.” Okwu Grik ji ihe atụ ụlọ mee ihe: “maka iwulite, ọ bụghị maka ịkwatu.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: N’ihi nke a
  rationale: Ọ na-egosi nke ọma na ihe Pọl na-ekwu ugbu a sitere n’ihe ndị o kwuru tupu ya, ma bụrụkwa okwu Igbo dị mfe ma bụrụ nke e ji ede ihe n’ụzọ kwụ ọtọ.
- source_word: ταῦτα
  choice: ihe ndị a
  rationale: E chekwara ọtụtụ ihe dị n’okwu Grik ahụ, nke na-arụtụ aka n’ihe ndị Pọl dere ma ọ bụ n’ịdọ aka ná ntị ndị dị n’akwụkwọ ozi a.
- source_word: ἀπὼν ... παρὼν
  choice: mgbe m na-anọghị n’etiti unu ... mgbe m bịara nọrọ n’etiti unu
  rationale: Nsụgharị a na-eme ka ọdịiche dị n’etiti anọghị ya na ịnọ ya n’ebe ndị ọ na-edegara akwụkwọ ozi nọ doo anya n’Igbo nkịtị.
- source_word: μὴ ἀποτόμως χρήσωμαι
  choice: agaghị m eji aka ike mee ihe
  rationale: Ọ na-egosipụta echiche nke ime ihe n’ụzọ siri ike ma ọ bụ nke na-egbu mgbu. E zere okwu nwere ike ịpụta nanị ime ihe ike n’ahụ mmadụ.
- source_word: κατὰ τὴν ἐξουσίαν
  choice: dịka ikike ... si dị
  rationale: Nke a na-egosi na ihe Pọl nwere ike ime kwekọrọ n’ikike e nyere ya, dịka κατά si arụ ọrụ n’ebe a.
- source_word: ὁ κύριος
  choice: Onyenwe anyị
  rationale: Nke a bụ aha nsọpụrụ a na-ejikarị asụ κύριος n’Igbo, n’enweghị ịkọwapụta onye a na-arụtụ aka karịa ka amaokwu ahụ n’onwe ya mere.
- source_word: ἔδωκέν μοι
  choice: nyere m
  rationale: Ọ na-asụ ngwaa ahụ n’oge gara aga n’ụzọ dị mfe ma doo anya, dịka ọrụ e nyere Pọl.
- source_word: εἰς οἰκοδομὴν καὶ οὐκ εἰς καθαίρεσιν
  choice: maka iwulite unu, ọ bụghị maka ịkwatu unu
  rationale: 'A nọgidere na-eji ihe atụ ụlọ ahụ: iwulite megide ịkwatu. Ịgbakwunye ‘unu’ na-eme ka onye ikike ahụ ga-abara uru doo anya n’Igbo, dịka ọnọdụ okwu ahụ si gosi.'
theological_decisions:
- issue: Onye aha ‘Onyenwe anyị’ na-arụtụ aka n’okwu banyere ikike e nyere Pọl
  choice: A sụgharịrị ya naanị dịka ‘Onyenwe anyị.’
  alternative: Ịkọwa ya kpọmkwem dịka ‘Onyenwe anyị Jizọs,’ ma ọ bụ ịsụ ya dịka aha Chineke n’ozuzu ya.
  rationale: Ihe odide Grik kwuru naanị ὁ κύριος. Ya mere, nsụgharị ahụ chekwara aha nsọpụrụ ahụ n’ebughị nkọwa okwukwe ọzọ na-adịghị n’amaokwu ahụ bata.
- issue: Nzube nke ikike Pọl
  choice: Ikike ahụ bụ ‘maka iwulite unu, ọ bụghị maka ịkwatu unu.’
  alternative: Ịsụgharị ya n’enweghị ihe atụ dịka ‘maka ịgba unu ume, ọ bụghị maka ibibi unu.’
  rationale: Ihe odide Grik ji ihe atụ ụlọ mee ka esemokwu dị n’etiti οἰκοδομή na καθαίρεσις pụta ìhè. Idebe ihe atụ ahụ na-echekwa ma okwu ahụ ma nrụgide ime mmụọ dị na ya.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. ‘N’etiti unu’ mere anọghị Pọl na ịbịa ya doo anya; ‘iwulite/ịkwatu’ chekwara ihe atụ ụlọ Pọl ji mee ihe. E zere okwu ụka pụrụ iche ma ọ bụ nkọwa nke otu ụka.
