review_pass:
  verdict: revise
  source_fidelity: The draft preserves the causal link, the absent/present contrast, the Lord-given authority, and the construction contrast. However, “iji aka ike mee ihe” normally suggests physical force in Igbo and does not accurately represent ἀποτόμως χρήσωμαι, which concerns sharp or severe exercise of authority. The supplied object “unu” in the final building/demolishing contrast is interpretive and need not be added, since Greek leaves it implicit.
  naturalness: “Ka ọ bụrụ na mgbe…” is unnecessarily awkward for the Greek purpose clause, and the repeated explanatory use of “ikike” makes the sentence heavier than needed. The revision uses a direct, idiomatic purpose construction and clearly links severity with the exercise of authority.
  terminology: “Onyenwe anyị” appropriately renders ὁ κύριος without identifying the referent beyond the Greek. “Iwulite/ịkwatu” retains Paul’s construction metaphor. “Ime ihe n’ụzọ siri ike” is a natural non-physical rendering of severe action.
  issues:
  - severity: medium
    issue: “eji aka ike mee ihe”
    rationale: This idiom commonly conveys use of force or coercive violence, whereas ἀποτόμως means sharply/severely in Paul’s exercise of apostolic authority.
  - severity: low
    issue: Awkward purpose construction and redundant authority phrase
    rationale: “ka ọ bụrụ na mgbe…” is less natural than a direct “ka, mgbe…,” and repeating “ikike” is not required by the source or by Igbo syntax.
  - severity: low
    issue: Explicit “unu” in the final contrast
    rationale: The recipients are contextually understood, but εἰς οἰκοδομὴν καὶ οὐκ εἰς καθαίρεσιν does not explicitly state an object. Omitting it better preserves the source’s concise metaphor.
  revised_text: N’ihi nke a ka m na-ede ihe ndị a mgbe m na-anọghị, ka, mgbe m nọ, ghara iji ikike Onyenwe anyị nyere m mee ihe n’ụzọ siri ike[a]—ikike ahụ e nyere m maka iwulite, ọ bụghị maka ịkwatu.[b]
  revised_footnotes:
