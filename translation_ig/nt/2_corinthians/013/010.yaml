revisions:
- from: N’ihi nke a, ana m ede ihe ndị a mgbe m na-anọghị n’etiti unu, ka ọ bụrụ na mgbe m bịara nọrọ n’etiti unu, agaghị m eji aka ike mee ihe[a] dịka ikike Onyenwe anyị nyere m si dị—ikike e nyere maka iwulite unu, ọ bụghị maka ịkwatu unu.[b]
  to: N’ihi nke a ka m na-ede ihe ndị a mgbe m na-anọghị, ka, mgbe m nọ, ghara iji ikike Onyenwe anyị nyere m mee ihe n’ụzọ siri ike[a]—ikike ahụ e nyere m maka iwulite, ọ bụghị maka ịkwatu.[b]
  rationale: The revision avoids a physical-force implication, expresses the purpose clause naturally, and places the Lord-given authority directly as the means Paul might exercise severely. It retains the Lord title without doctrinal specification and preserves the Greek building/demolishing metaphor without adding an explicit object.
