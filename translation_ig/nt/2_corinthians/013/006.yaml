  text: ἐλπίζω δὲ ὅτι γνώσεσθε ὅτι ἡμεῖς οὐκ ἐσμὲν ἀδόκιμοι.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/013/006.yaml
  text: But I hope that you will know that we are not disqualified[a].
translation:
  language: ig
  text: Ma enwere m olileanya na unu ga-amata na anyị abụghị ndị dara n'ule ahụ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “anyị abụghị ndị a na-akwadoghị.” Okwu Grik a na-ekwu banyere ndị a nwalere ma ha egosighị na ha kwesịrị nnabata.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλπίζω
  choice: enwere m olileanya
  rationale: Ọ bụ ụzọ Igbo dị mfe ma kwekọọ n'ahịrịokwu a isi kwuo atụmanya Pọl banyere ihe ga-eme n'ihu.
- source_word: δὲ
  choice: Ma
  rationale: Ọ na-egosi obere ọdịiche dị n'etiti okwu a na nchegbu e kwuru n'amaokwu bu ya ụzọ.
- source_word: γνώσεσθε
  choice: unu ga-amata
  rationale: Ọ na-echekwa ọdịdị okwu nke ga-eme n'ọdịnihu ma na-ada nke ọma n'Igbo.
- source_word: ὅτι
  choice: na
  rationale: Ọ na-ewebata ọdịnaya nke ihe Pọl nwere olileanya na ha ga-amata.
- source_word: ἡμεῖς
  choice: anyị
  rationale: Ọ na-anọchi Pọl na ndị ya na ha na-eje ozi, ma na-echekwa nnọchiaha doro anya nke Grik.
- source_word: οὐκ ἐσμὲν
  choice: anyị abụghị
  rationale: Nke a bụ ntụgharị nkịtị nke ngwaa njikọ e tinyere ngọnarị, n'etinyeghị ike ọzọ na-adịghị na Grik.
- source_word: ἀδόκιμοι
  choice: ndị dara n'ule ahụ
  rationale: N'ọnọdụ a nke inwale na igosi onye a nabatara, okwu a pụtara ndị na-agafeghị ule ma ọ bụ ndị a na-akwadoghị. Nhọrọ a bụ Igbo doro anya ma na-echekwa ihe atụ nke ule.
theological_decisions:
- issue: Otú e si sụgharịa ἀδόκιμοι n'ọnọdụ metụtara inwale na izi ezi nke ozi ndịozi
  choice: anyị abụghị ndị dara n'ule ahụ
  alternative: anyị abụghị ndị a na-akwadoghị
  rationale: Nhọrọ ahụ na-echekwa echiche nke ịnwale mmadụ ma chọpụta ma ọ̀ kwadoro, n'ebubataghị echiche ozizi ọzọ nke okwu dịka “ndị a jụrụ ajụ” nwere ike ịkpata.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. “Dara n'ule ahụ” na-eme ka njikọ ya na okwu banyere inwale dị n'amaokwu ndị gbara ya gburugburu doo anya, ebe nkọwa ala peeji na-echekwa ụzọ ntụgharị ọzọ.
