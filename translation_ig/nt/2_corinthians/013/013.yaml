  terminology: ‘Amara,’ ‘Onyenwe anyị,’ ‘Mesaya,’ ‘ịhụnanya,’ na ‘Mmụọ Nsọ’ dabara adaba. ‘Mmekọrịta’ bụ nhọrọ sara mbara maka κοινωνία; a ga-eji ‘nnwekọrịta’ na ‘inwe òkè n’ime’ n’ala peeji gosi nhọrọ ndị ọzọ n’enweghị ime κοινωνία ka ọ bụrụ naanị ịdị n’otu.
  issues:
