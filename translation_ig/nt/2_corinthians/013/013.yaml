- from: Ka amara nke Onyenwe anyị Jizọs Mesaya[a], na ịhụnanya nke Chineke, na mmekọrịta nke Mmụọ Nsọ[b], dịnyere unu niile.
  to: Ka amara nke Onyenwe anyị Jizọs Mesaya[a], na ịhụnanya nke Chineke, na mmekọrịta nke Mmụọ Nsọ[b], dịnyere unu niile.
  rationale: 'A hapụrụ isi ederede ka ọ dị n’ihi na ọ bụ ntụgharị kwesịrị ntụkwasị obi na nke okike. A gbanwere naanị ala peeji b: ‘nnwekọrịta’ na-anọchi anya ‘communion,’ ebe ‘inwe òkè n’ime Mmụọ Nsọ’ na-anọchi anya ‘participation in the Holy Spirit.’ Nke a na-ewepụ echiche ‘ịdị n’otu’ nke na-adịghị kwekọọ kpọmkwem na κοινωνία.'
