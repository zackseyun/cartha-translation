review_pass:
  verdict: revise
  source_fidelity: 'Isi ederede na-anọchi anya usoro ngọzi Grik ahụ nke ọma: χάρις, ἀγάπη, na κοινωνία nọ n’usoro kwesịrị ekwesị, ‘Onyenwe anyị Jizọs Mesaya’ na-atụgharị κυρίου Ἰησοῦ Χριστοῦ n’enweghị mgbakwunye, ‘unu niile’ na-echekwa πάντων ὑμῶν, ‘Ka … dịnyere’ na-egosikwa ngwaa ngọzi e hapụrụ n’elu Grik. Otú ọ dị, nkọwa ala peeji b ugbu a na-enye ‘ịdị n’otu,’ nke na-akachasị pụta ‘unity’ karịa κοινωνία, ya mere ọ naghị echekwa nhọrọ okwu Grik ahụ nke ọma.'
