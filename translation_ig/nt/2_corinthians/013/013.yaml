id: 2CO.13.13
reference: 2 Corinthians 13:13
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἡ χάρις τοῦ κυρίου Ἰησοῦ Χριστοῦ καὶ ἡ ἀγάπη τοῦ θεοῦ καὶ ἡ κοινωνία τοῦ ἁγίου πνεύματος μετὰ πάντων ⸀ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/013/013.yaml
  text: The grace of the Lord Jesus Christ[a], and the love of God, and the fellowship of the Holy Spirit[b], be with all of you.
translation:
  language: ig
  text: Ka amara nke Onyenwe anyị Jizọs Mesaya[a], na ịhụnanya nke Chineke, na mmekọrịta nke Mmụọ Nsọ[b], dịnyere unu niile.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, dị ka a na-asụkarị, “Jizọs Kraịst.”
    reason: alternative_reading
  - marker: b
    text: Ma ọ bụ “nnwekọrịta nke Mmụọ Nsọ,” ma ọ bụ “inwe òkè n’ime Mmụọ Nsọ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: χάρις
  choice: amara
  rationale: “Amara” bụ okwu Igbo a na-ejikarị akọwa χάρις n’okwu ngọzi Pọl; ọ na-echekwa echiche nke ebere na ihu ọma Chineke nke ọ na-enye n’efu.
- source_word: κυρίου
  choice: Onyenwe anyị
  rationale: N’ebe a κύριος bụ aha nsọpụrụ e nyere Jizọs; “Onyenwe anyị” bụ ntụgharị Igbo doro anya ma bụrụkwa nke a maara nke ọma.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jizọs Mesaya
  rationale: Χριστός na-arụ ọrụ dị ka aha ọkwa, ọ bụghị nanị dị ka aha ezinụlọ. “Mesaya” na-echekwa echiche nke Onye E Tere Mmanụ, ebe e debere “Jizọs Kraịst” n’ala peeji dị ka okwu ọdịnala.
- source_word: ἀγάπη
  choice: ịhụnanya
  rationale: “Ịhụnanya” bụ okwu Igbo nkịtị na nke zuru oke maka ἀγάπη n’ebe a.
- source_word: θεοῦ
  choice: nke Chineke
  rationale: Nke a na-echekwa usoro genitive Grik ahụ n’enweghị ịkọwapụta ma ọ bụ ịhụnanya Chineke nwere n’ebe mmadụ nọ ka a chọrọ imesi ike.
- source_word: κοινωνία
  choice: mmekọrịta
  rationale: “Mmekọrịta” na-enye ohere maka echiche nke ịdị n’otu, inwe òkè ọnụ, na mkpakọrịta, n’ebughị ụzọ mechie ihe okwu Grik ahụ pụtara naanị n’otu ụzọ.
- source_word: ἁγίου πνεύματος
  choice: Mmụọ Nsọ
  rationale: Nke a bụ okwu Standard Igbo dị ugbu a maka aha Onye ahụ e kwuru n’amaokwu a.
- source_word: μετὰ πάντων ὑμῶν
  choice: dịnyere unu niile
  rationale: “Dịnyere” na-egosi ịdị n’ụlọ ọrụ ma ọ bụ ọnụnọ, ebe “unu niile” na-echekwa πάντων na mkpụrụokwu Grik ahụ.
theological_decisions:
- issue: Otú e si sụgharịa Χριστοῦ dị ka aha ọkwa Jizọs
  choice: Mesaya
  alternative: Kraịst
  rationale: N’ebe a Χριστός bụ aha ọkwa nke pụtara Onye E Tere Mmanụ. Isi ederede ji “Mesaya” mee ka ọrụ ya dị ka aha ọkwa pụta ìhè, ma ala peeji chekwara “Kraịst,” nke bụ okwu ọdịnala a maara nke ọma.
- issue: Ihe κοινωνία τοῦ ἁγίου πνεύματος pụtara
  choice: mmekọrịta nke Mmụọ Nsọ
  alternative: ịdị n’otu nke Mmụọ Nsọ; ikekọrịta òkè n’ime Mmụọ Nsọ
  rationale: Usoro genitive ahụ nwere ike ịgụnye mmekọrịta Mmụọ Nsọ na-eweta, mmekọrịta ya na ndị kwere ekwe, ma ọ bụ ikekọrịta òkè n’ime Mmụọ Nsọ. “Mmekọrịta nke Mmụọ Nsọ” na-edobe obosara na mgbagwoju echiche ahụ kama ịmanye naanị otu nkọwa.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ugwu ma dị mfe nghọta, dee amaokwu ahụ. Usoro “Ka … dịnyere unu niile” na-arụ ọrụ dị ka ngọzi n’Igbo ma na-eme ka ngwaa e hapụrụ n’usoro Grik pụta ìhè n’enweghị ịgbakwunye nkọwa ọhụrụ.
