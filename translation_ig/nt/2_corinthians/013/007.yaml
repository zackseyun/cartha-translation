source:
  edition: SBLGNT
  text: ⸀εὐχόμεθα δὲ πρὸς τὸν θεὸν μὴ ποιῆσαι ὑμᾶς κακὸν μηδέν, οὐχ ἵνα ἡμεῖς δόκιμοι φανῶμεν, ἀλλ’ ἵνα ὑμεῖς τὸ καλὸν ποιῆτε, ἡμεῖς δὲ ὡς ἀδόκιμοι ὦμεν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/013/007.yaml
  text: We pray to God that you may do nothing wrong—not so that we may appear approved[a], but so that you may do what is right[c][b], even if we may seem disqualified.
translation:
  language: ig
  text: Anyị na-ekpe ekpere nye Chineke ka unu ghara ime ihe ọjọọ ọ bụla—ọ bụghị ka e wee hụ anyị dị ka ndị e gosipụtara na ha ruru eru[a], kama ka unu mee ihe ziri ezi, ọ bụrụgodị na anyị dị ka ndị na-agaghị ule[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ndị a nwapụtara ma kwado.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ọ bụrụgodị na e were anyị dị ka ndị na-erughị eru.” Okwu Grik a bụ ihe megidere okwu a sụgharịrị “ndị e gosipụtara na ha ruru eru.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐχόμεθα δὲ πρὸς τὸν θεὸν
  choice: Anyị na-ekpe ekpere nye Chineke
  rationale: “Ikpe ekpere nye Chineke” bụ okwu Igbo doro anya ma bụrụkwa nke e ji eme ihe ugbu a; “na-” na-egosipụta omume dị ugbu a. A sụgharịrị δέ n'ụzọ na-adịghị arọ site n'usoro ahịrịokwu kama ịgbakwunye okwu njikọ na-adịghị mkpa.
- source_word: μὴ ποιῆσαι ὑμᾶς κακὸν μηδέν
  choice: ka unu ghara ime ihe ọjọọ ọ bụla
  rationale: 'Nke a na-edobe ọdịnaya ekpere ahụ na nkwusioru siri ike nke κακὸν μηδέν: ka ha ghara ime ọbụna otu ihe ọjọọ.'
- source_word: οὐχ ἵνα ἡμεῖς δόκιμοι φανῶμεν
  choice: ọ bụghị ka e wee hụ anyị dị ka ndị a nwapụtara
  rationale: “Ka e wee hụ” na-egosipụta nzube a jụrụ ajụ na echiche nke φανῶμεν, ebe “ndị a nwapụtara” na-edobe echiche nke ịgafe ule dị na δόκιμοι.
- source_word: ἀλλ’ ἵνα ὑμεῖς τὸ καλὸν ποιῆτε
  choice: kama ka unu mee ihe ziri ezi
  rationale: “Ihe ziri ezi” na-enye καλόν ọdịnaya omume ọma n'Igbo dị mfe ma dị ugbu a.
- source_word: ἡμεῖς δὲ ὡς ἀδόκιμοι ὦμεν
  choice: ọ bụladị ma anyị adị ka ndị a jụrụ n’ule
  rationale: “Adị ka” na-echekwa ike ntụnyere ma ọ bụ ọdịdị dị na ὡς, ebe “ndị a jụrụ n’ule” na-egosipụta ntụgharị kpọmkwem megide “ndị a nwapụtara,” n'enweghị ibubata echiche ikpe ikpeazụ.
theological_decisions:
- issue: Ihe ὡς ἀδόκιμοι pụtara n'okwu Pọl banyere onwe ya
  choice: A hapụrụ ya dị ka “anyị adị ka ndị a jụrụ n’ule,” nke nwere ike ịpụta otú e si ele ha anya ma ọ bụ ọnọdụ ha dị ka ndị na-agafeghị ule.
  alternative: “ọ bụladị ma e were anyị dị ka ndị na-erughị eru”
  rationale: Nke a na-echekwa esemokwu okwu δόκιμοι/ἀδόκιμοι na enweghị mkpebi siri ike na ọ bụ naanị ọdịdị n'anya ndị ọzọ; ọ naghịkwa akọwa ya dịka ikpe ọmụma ebighị ebi.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ugwu ma dị mfe nghọta. E ji “unu” mee ka onye na-agụ ghọta na okwu ahụ bụ ọtụtụ mmadụ. A haziri akara nkọwa [a] na [b] n'ebe okwu ndị ha na-akọwa dị kpọmkwem.
