    text: Ma ọ bụ, “ndị a nwapụtara ma kwado.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ọ bụrụgodị na e were anyị dị ka ndị na-erughị eru.” Okwu Grik a bụ ihe megidere okwu a sụgharịrị “ndị e gosipụtara na ha ruru eru.”
    reason: lexical_alternative
  revision_rationale: The revision clarifies that δόκιμοι denotes not merely persons tested but persons demonstrated to be acceptable. It correspondingly renders ἀδόκιμοι as those who fail the test, preserving Paul’s rhetorical contrast and his willingness to be viewed unfavorably if the Corinthians do what is right. No claim about final condemnation is added.
