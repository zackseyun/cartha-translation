language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: προείρηκα καὶ προλέγω ὡς παρὼν τὸ δεύτερον καὶ ἀπὼν ⸀νῦν, τοῖς προημαρτηκόσιν καὶ τοῖς λοιποῖς πᾶσιν, ὅτι ἐὰν ἔλθω εἰς τὸ πάλιν οὐ φείσομαι,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/013/002.yaml
  text: I have said before[a], and I say beforehand now while absent, as when present the second time, to those who sinned previously and to all the rest, that if I come again, I will not spare them.
translation:
  language: ig
  text: 'Ekwuolarị m ya na mbụ[a], ana m adọkwa aka ná ntị ugbu a mgbe m na-anọghị, dịka m dọrọ aka ná ntị mgbe m nọ n’etiti unu nke ugboro abụọ, nye ndị mere mmehie na mbụ na ndị niile fọdụrụ: ọ bụrụ na m abịa ọzọ, agaghị m emere ha ebere.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, n’ụzọ kọwara ihe nke ọma karị, “ọ bụrụ na m abịa nke ugboro atọ.” N’asụsụ Grik, ihe e dere kpọmkwem bụ “ọ bụrụ na m abịa ọzọ,” ma ihe gbara amaokwu a gburugburu na-atụ aro na ọ ga-abụ ọbịbịa ọzọ sochiri nke ugboro abụọ.
    reason: alternative_reading
lexical_decisions:
- source_word: προείρηκα
  choice: Ekwuola m ya na mbụ
  rationale: Oge perfect na-egosi okwu e kwuru na mbụ nke ka nwere ike ugbu a; nsụgharị a anaghị etinye ‘ịdọ aka ná ntị’ n’ime okwu ahụ n’onwe ya.
- source_word: προλέγω
  choice: m na-ekwukwa ya tupu oge eruo
  rationale: Nke a na-echekwa echiche bụ isi nke ikwu ihe tupu oge ya, tinyere njikọ okwu ya na προείρηκα, ebe ọnọdụ amaokwu ahụ na-eme ka ọ bụrụ ịdọ aka ná ntị.
- source_word: ὡς παρὼν τὸ δεύτερον καὶ ἀπὼν νῦν
  choice: ugbu a m na-anọghị unu nso, dịka m mere mgbe m nọ n’etiti unu nke ugboro abụọ
  rationale: A haziri ahịrịokwu Grik ahụ dị mkpụmkpụ ka ọ bụrụ Igbo doro anya, na-echekwa ọdịiche dị n’etiti ịnọ ya ugbu a n’ebe ọzọ na ọbịbịa ya nke ugboro abụọ.
- source_word: τοῖς προημαρτηκόσιν
  choice: nye ndị mere mmehie na mbụ
  rationale: Nke a na-egosi mmehie ha mere tupu oge a, ma anaghị ekpebi ma ha echegharịala ma ọ bụ na ha echegharịbeghị.
- source_word: τοῖς λοιποῖς πᾶσιν
  choice: na ndị niile fọdụrụ
  rationale: Ọ na-echekwa nghọta zuru ezu nke πᾶσιν ma kewapụ ndị ahụ n’òtù ndị e kwuru na ha mere mmehie na mbụ.
- source_word: ἐὰν ἔλθω εἰς τὸ πάλιν
  choice: ọ bụrụ na m abịa ọzọ
  rationale: Nke a bụ nsụgharị kpọmkwem ma bụrụkwa Igbo eke; nkọwa na ọ ga-abụ ọbịbịa nke ugboro atọ ka dị na ndetu ala peeji.
- source_word: οὐ φείσομαι
  choice: agaghị m emere ha ebere
  rationale: N’okwu a, ọ pụtara na Pọl agaghị akwụsị iji aka ike mee ihe megide ndị a na-adọ aka ná ntị; ‘ha’ na-eme ka ihe nnọchiaha a na-aghọta site n’ọnọdụ okwu pụta ìhè.
theological_decisions:
- issue: Ókè ndị ịdọ aka ná ntị Pọl metụtara
  choice: Okwu ahụ na-erute ma ndị mere mmehie na mbụ ma ndị niile ọzọ nọ n’ọgbakọ ahụ.
  alternative: Ịgụ ya dịka nke metụtara naanị ndị mere mmehie na mbụ, ma ọ bụ dịka iyi egwu izugbe nke na-akọwaghị onye ọ metụtara.
  rationale: Nhazi ahịrịokwu ahụ kpọrọ òtù abụọ ahụ aha, ma ‘agaghị m emere ha ebere’ na-ahapụ ụdị omume Pọl ga-eme n’akọwaghị ya n’ụzọ ga-etinye usoro ọchịchị ụka pụrụ iche.
translation_notes:
  register: Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ ‘ịnọ n’etiti unu’ kama nsụgharị siri ike nke ‘ịdị ugbu a,’ iji mee ka okwu banyere nleta Pọl doo anya. E ji ‘agaghị m emere ha ebere’ gosipụta ịdị njọ nke φείδομαι n’enweghị ịkọ kpọmkwem ụdị ntaramahụhụ ma ọ bụ usoro ịdọ aka ná ntị.
