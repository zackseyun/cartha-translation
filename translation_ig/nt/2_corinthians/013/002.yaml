- from: 'Ekwuola m ya na mbụ[a], m na-ekwukwa ya tupu oge eruo ugbu a m na-anọghị unu nso, dịka m mere mgbe m nọ n’etiti unu nke ugboro abụọ, nye ndị mere mmehie na mbụ na ndị niile fọdụrụ: ọ bụrụ na m abịa ọzọ, agaghị m emere ha ebere.'
