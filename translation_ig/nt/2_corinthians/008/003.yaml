id: 2CO.8.3
reference: 2 Corinthians 8:3
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὅτι κατὰ δύναμιν, μαρτυρῶ, καὶ ⸀παρὰ δύναμιν, αὐθαίρετοι
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/003.yaml
  text: For[a], I testify, they gave according to their ability, and beyond their ability, of their own accord[b],
translation:
  language: ig
  text: N’ihi na ana m agba akaebe na ha nyere dị ka ike ha si dị[a], nyekwa karịa ike ha, n’afọ ofufo[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “dị ka ihe ha nwere si ruo, nyekwa karịa ihe ha nwere.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “site n’uche nke aka ha” ma ọ bụ “n’enweghị onye manyere ha.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: N’ihi na
  rationale: N’ebe a, okwu a na-ewebata nkọwa Pọl ji akwado ihe o kwuru n’amaokwu bu ụzọ; “N’ihi na” na-egosipụta njikọ ahụ nke ọma n’Igbo.
- source_word: κατὰ δύναμιν
  choice: dị ka ike ha si dị
  rationale: κατά na δύναμις na-egosi oke ma ọ bụ ogo ihe mmadụ nwere ike ime; okwu Igbo a na-echekwa echiche nke inye dịka ikike ha hà.
- source_word: μαρτυρῶ
  choice: ana m agba akaebe
  rationale: Nke a na-echekwa nkwupụta Pọl nke onwe ya, nke e tinyere n’etiti ahịrịokwu iji mesie eziokwu ahụ ike.
- source_word: καὶ παρὰ δύναμιν
  choice: nyekwa karịa ike ha
  rationale: παρά na-egosi ịgafe oke; “karịa ike ha” na-emegide “dị ka ike ha si dị” n’ụzọ doro anya ma na-echekwa usoro okwu Grik ahụ.
- source_word: αὐθαίρετοι
  choice: n’afọ ofufo
  rationale: Okwu a na-egosi na ha ji aka ha kpebie ime ya, ọ bụghị n’ihi mmanye; “n’afọ ofufo” bụ ụzọ Igbo dị mfe ma dịkwa mma isi kwuo nke a.
theological_decisions:
- issue: Ngwaa a na-aghọtaghị ede n’akụkụ αὐθαίρετοι
  choice: E tinyere “ha nyere” site n’ihe gbara amaokwu ahụ gburugburu, ma jiri “nyekwa” gaa n’ihu n’ahịrịokwu ahụ.
  alternative: Ịsụgharị ya n’ụzọ rapara n’usoro Grik dịka “ha bụ ndị ji aka ha họrọ ime ya,” n’agbanyeghị na ọ gaghị adị ezigbo ụtọ n’Igbo.
  rationale: N’asụsụ Grik, αὐθαίρετοι bụ okwu nkọwa kwụụrụ onwe ya, ebe a hapụrụ omume ahụ n’ihi na ihe gbara ya gburugburu na-egosi ya. Igbo chọrọ ka e kwuo omume ahụ iji mee ka ahịrịokwu zuo oke; “ha nyere” anaghị etinye echiche ọzọ karịa ihe amaokwu ndị gbara ya gburugburu na-ekwu.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị mfe ma nwee ugwu. Ahịrịokwu ahụ na-echekwa ọdịiche dị n’etiti inye dịka ike ha si dị na inye karịa ike ha, ma na-egosikwa na onyinye ahụ sitere n’afọ ofufo.
