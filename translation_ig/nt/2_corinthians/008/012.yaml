revisions:
- from: N’ihi na ọ bụrụ na mmadụ nwere obi njikere[a], a na-anabata ya dịka ihe o nwere si dị[b], ọ bụghị dịka ihe ọ na-enweghị si dị.
  to: N’ihi na ọ bụrụ na obi njikere dị[a], a na-anabata ya dịka ihe mmadụ nwere si dị[b], ọ bụghị dịka ihe mmadụ na-enweghị si dị.
  rationale: 'The revision retains the draft’s meaning and register but resolves a source-level referential ambiguity: the acceptable entity is the present willing disposition, not explicitly the person. It also improves the literal footnote’s Igbo phrasing while preserving its anchor and function.'
