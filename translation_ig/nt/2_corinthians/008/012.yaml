  text: εἰ γὰρ ἡ προθυμία πρόκειται, καθὸ ἐὰν ⸀ἔχῃ εὐπρόσδεκτος, οὐ καθὸ οὐκ ἔχει.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/012.yaml
  text: For if the readiness is present[a], it is acceptable according to what one has[b], not according to what one does not have.
translation:
  language: ig
  text: N’ihi na ọ bụrụ na obi njikere dị[a], a na-anabata ya dịka ihe mmadụ nwere si dị[b], ọ bụghị dịka ihe mmadụ na-enweghị si dị.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya “ọchịchọ siri ike” ma ọ bụ “ọchịchọ ime ihe.”
    reason: lexical_alternative
  - marker: b
    text: N’ụzọ nkịtị, “dabere n’ihe ọ bụla mmadụ nwere … ọ bụghị dabere n’ihe mmadụ na-enweghị.”
    reason: lexical_alternative
lexical_decisions:
- source_word: προθυμία
  choice: obi njikere
  rationale: Nkebi okwu a na-egosi ọchịchọ sitere n’obi na ịdị njikere ime ihe; ọ dabara n’ọnọdụ onyinye a kwadebere inye, ma ghara ime ka okwu ahụ bụrụ naanị mmetụta ọkụ n’obi.
- source_word: πρόκειται
  choice: ọ bụrụ na mmadụ nwere
  rationale: N’ụdị okwu a, ngwaa ahụ na-egosi na obi njikere ahụ dị ma ọ bụ nọ ya; Igbo a na-ekwu kwa ụbọchị na-egosipụta nke a nke ọma site n’ikwu na mmadụ nwere obi njikere.
- source_word: καθὸ ἐὰν ἔχῃ
  choice: dịka ihe o nwere si dị
  rationale: Nke a na-echekwa echiche nke ịtụ onyinye n’ogo ihe mmadụ nwere n’ezie, ma na-eji nnọchiaha mmadụ n’ụzọ zuru mmadụ niile.
- source_word: εὐπρόσδεκτος
  choice: a na-anabata ya
  rationale: Nhọrọ a na-egosi na onyinye ma ọ bụ omume ahụ dị mma ịnabata, n’ebughị ụzọ kọwaa onye na-anabata ya ebe ederede Grik ekwughị ya hoo haa.
- source_word: οὐ καθὸ οὐκ ἔχει
  choice: ọ bụghị dịka ihe ọ na-enweghị si dị
  rationale: 'Nke a na-edobe ntụnyere abụọ Pọl mere n’ụdị kwekọrọ ekwekọ: ihe mmadụ nwere na ihe ọ na-enweghị.'
- source_word: εἰ γὰρ
  choice: N’ihi na ọ bụrụ na
  rationale: Nke a na-echekwa ma njikọ nkọwa nke γάρ ma ọnọdụ nke εἰ.
theological_decisions:
- issue: Onye ma ọ bụ ebe a na-anabata onyinye ahụ
  choice: A hapụrụ onye na-anabata ya n’amaghị ama, dịka ederede Grik si mee.
  alternative: Ịsị kpọmkwem na Chineke na-anabata ya, ma ọ bụ na ọgbakọ na-anabata ya.
  rationale: εὐπρόσδεκτος na-egosi nnabata, ma amaokwu ahụ akpọghị onye na-anabata ya; ịhapụ ya otu a na-echekwa nghọtahie ziri ezi na esemokwu nkà mmụta okpukpe dị n’ederede.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, dị ugbu a ma dị ùgwù. A họọrọ “obi njikere” maka προθυμία ka ọ bụrụ okwu ndị mmadụ na-aghọta ngwa ngwa n’ọnọdụ inye onyinye. Akara nkọwa [a] na [b] dị n’ederede isi dịka achọrọ.
