source:
  edition: SBLGNT
  text: μετὰ πολλῆς παρακλήσεως δεόμενοι ἡμῶν, τὴν χάριν καὶ τὴν κοινωνίαν τῆς διακονίας τῆς εἰς τοὺς ἁγίους—
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/004.yaml
  text: begging us with much urging for the grace and the fellowship of this ministry to the saints—[a]
translation:
  language: ig
  text: ha ji arịrịọ siri ike na-arịọsi anyị ike ka e nye ha amara na ikere òkè n’ozi a na-ejere ndị nsọ—[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ihe ùgwù nke ikere òkè n’ozi a na-ejere ndị nsọ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: μετὰ πολλῆς παρακλήσεως
  choice: ha ji arịrịọ siri ike
  rationale: Nkebi a na-egosi ụzọ arịrịọ ahụ si sie ike. ‘Ha ji arịrịọ siri ike’ bụ Igbo dị mfe ma na-egosipụta ịdị uchu na ike nke παράκλησις n’ebe a, ọ bụghị nkasi obi.
- source_word: δεόμενοι ἡμῶν
  choice: na-arịọsi anyị ike
  rationale: δέομαι pụtara ịrịọ, ịrịọsi ike, ma ọ bụ ịrịọ arịrịọ. Mkpụrụokwu a na-egosipụta arịrịọ dị umeala n’obi ma sie ike, ebe ‘anyị’ bụ ndị a na-arịọ.
- source_word: τὴν χάριν
  choice: amara
  rationale: χάρις nwere ike ịpụta amara, ihu ọma, ma ọ bụ ihe ùgwù. ‘Amara’ na-edobe okwu Pọl na-ejikarị na ụda okpukpe ya, ebe ihe ọ pụtara dị ka ihe ùgwù pụtara ìhè site n’ọnọdụ ahụ na nkọwa ala peeji.
- source_word: τὴν κοινωνίαν
  choice: ikere òkè
  rationale: κοινωνία n’ebe a na-elekwasị anya n’isonyere na ịkekọrịta ọrụ enyemaka ahụ. ‘Ikere òkè’ bụ Igbo doro anya ma na-ezere ime ka ọ bụrụ naanị mkpakọrịta mmadụ na ibe ya.
- source_word: τῆς διακονίας
  choice: n’ozi a
  rationale: διακονία bụ ozi ma ọ bụ ọrụ e ji enyere ndị ọzọ aka. ‘Ozi’ na-enye ọrụ enyemaka ahụ ugwu Pọl nyere ya; ‘a’ na-enyere njikọ genitive ahụ aka ịdị n’ụdị Igbo ebumpụta ụwa ma na-ezo aka n’ozi a na-ekwu maka ya n’ọnọdụ ahụ.
- source_word: τῆς εἰς τοὺς ἁγίους
  choice: a na-ejere ndị nsọ
  rationale: Nkebi ahụ na-egosi na ozi ahụ na-aga n’ebe ndị nsọ nọ ma bụrụ maka uru ha. ‘A na-ejere ndị nsọ’ na-egosipụta njikọ a nke ọma n’Igbo.
theological_decisions:
- issue: Ntughari ἅγιοι
  choice: ndị nsọ
  alternative: ndị Chineke doro nsọ
  rationale: ‘Ndị nsọ’ na-edobe okwu Pọl ji akpọ ndị kwere ekwe, n’enweghị ime ka ọ pụta naanị otu ndị pụrụ iche e mechara kwupụta dịka ndị nsọ.
- issue: Mmekọrịta χάρις na κοινωνία
  choice: ka e nye ha amara na ikere òkè
  alternative: ka e nye ha ihe ùgwù nke ikere òkè
  rationale: E debere okwu abụọ ahụ dị iche dịka ha dị na Grik, ka a ghara ikpebi n’isi na nke abụọ na-akọwa nke mbụ. N’agbanyeghị nke ahụ, nhọrọ ọzọ na nkọwa ala peeji na-egosi nghọta a pụrụ inwe na ‘amara’ bụ ihe ùgwù nke isonye.
translation_notes:
  register: Asụsụ Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E debere akara ogologo ahịrị n’ọgwụgwụ n’ihi na amaokwu ahụ na-aga n’ihu n’usoro ahịrịokwu gbara ya gburugburu.
