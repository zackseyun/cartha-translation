source:
  edition: SBLGNT
  text: τὴν οὖν ἔνδειξιν τῆς ἀγάπης ὑμῶν καὶ ἡμῶν καυχήσεως ὑπὲρ ὑμῶν εἰς αὐτοὺς ⸀ἐνδεικνύμενοι εἰς πρόσωπον τῶν ἐκκλησιῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/024.yaml
  text: Therefore[b][a], show them before the churches the proof of your love and of our boasting about you.
translation:
  language: ig
  text: Ya mere, gosi ha n’ihu ọgbakọ ndị ahụ[b] ihe akaebe[a] nke ịhụnanya unu na nke ịnya isi anyị banyere unu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ngosipụta” ma ọ bụ “ihe na-egosi” ịhụnanya unu.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “n’ọnụnọ ọgbakọ ndị ahụ”; akpaokwu a na-ekwu maka ngosipụta a na-eme n’ihu ndị nnọchiteanya ọgbakọ ndị ahụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔνδειξιν
  choice: ihe akaebe
  rationale: Okwu a na-egosi ihe e gosipụtara nke na-eme ka otu ihe pụta ìhè ma ọ bụ bụrụ ihe a pụrụ ịgba akaebe banyere ya; “ihe akaebe” dabara n’arịrịọ Pọl ka ha jiri omume gosipụta ịhụnanya ha.
- source_word: ἀγάπης
  choice: ịhụnanya
  rationale: Nke a bụ nsụgharị Igbo a na-ahụkarị maka ἀγάπη; n’ebe a ọ bụ ịhụnanya mmekọrịta nke a na-egosipụta n’omume.
- source_word: καυχήσεως
  choice: ịnya isi
  rationale: Ọ na-edobe ike okwu καύχησις na njikọ okwu Pọl ji eme ihe, kama ime ka ọ dị nro dịka naanị “inwe obi ụtọ” ma ọ bụ “ntụkwasị obi.”
- source_word: ὑπὲρ ὑμῶν
  choice: banyere unu
  rationale: Mgbe ọ so καύχησις, ọ na-ezo aka n’ịnya isi Pọl gbasara ndị Kọrịnt; “banyere unu” bụ okwu Igbo doro anya ma kwekọọ n’ebe a.
- source_word: εἰς αὐτοὺς
  choice: ha
  rationale: Ọ na-ezo aka n’ụmụnna ndị e kwuru okwu ha n’amaokwu ndị bu ụzọ; n’Igbo, “gosi ha” bụ ụzọ ebumpụta ụwa isi kwuo ya.
- source_word: ἐνδεικνύμενοι
  choice: gosi
  rationale: Partisipụl a na-arụ ọrụ dịka iwu ma ọ bụ agbamume n’ebe a; “gosi” na-edobe echiche nke ime ka ihe pụta ìhè.
- source_word: εἰς πρόσωπον τῶν ἐκκλησιῶν
  choice: n’ihu ọgbakọ niile
  rationale: Akpaokwu a na-egosi ngosipụta a na-eme n’ihu ma ọ bụ n’ọnọdu ndị ọgbakọ; “n’ihu” na-edobe ma echiche ihu ọha ma nke ọnụnọ ndị nnọchiteanya.
- source_word: τῶν ἐκκλησιῶν
  choice: ọgbakọ niile
  rationale: ἐκκλησίαι na-ezo aka n’ọgbakọ ndị kwere ekwe dị iche iche. “Ọgbakọ niile” na-egosi ụdị ọtụtụ nke Grik nke ọma n’Igbo.
- source_word: οὖν
  choice: Ya mere
  rationale: Ọ na-egosi nkwubi okwu sitere n’ihe e kwuru tupu ya; “Ya mere” bụ njikọ Igbo doro anya ma dị ugwu.
theological_decisions: []
translation_notes:
  register: E ji Standard Igbo nke oge a, dị mfe nghọta ma dị ugwu. E debere “ịnya isi” iji chekwaa ike okwu Pọl, ebe “n’ihu ọgbakọ niile” na-enye echiche ngosipụta ihu ọha n’ọnọdu ndị nnọchiteanya ọgbakọ.
