  text: εἰς τὸ παρακαλέσαι ἡμᾶς Τίτον ἵνα καθὼς προενήρξατο οὕτως καὶ ἐπιτελέσῃ εἰς ὑμᾶς καὶ τὴν χάριν ταύτην·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/006.yaml
  text: So we urged Titus that[a], just as he had previously begun, he should also complete among you this act of grace.
translation:
  language: ig
  text: N’ihi ya, anyị rịọrọ Taịtọs ka, dịka ọ malitere na mbụ, o mezukwaa n’etiti unu ọrụ amara a.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ọrụ e ji amara mee”; n’ụzọ kpọmkwem, “amara a.”
    reason: lexical_alternative
lexical_decisions:
- source_word: παρακαλέσαι
  choice: rịọrọ
  rationale: N’ebe a, okwu ahụ pụtara ịrịọ mmadụ siri ike ka o mee ihe; “rịọrọ” bụ okwu Igbo doro anya ma ghara ime ka ọ daa ka iwu.
- source_word: Τίτον
  choice: Taịtọs
  rationale: E dere aha Grik ahụ n’ụdị mkpụrụokwu kwekọrọ n’ịkpọ ya n’Igbo.
- source_word: καθὼς προενήρξατο
  choice: dị nnọọ ka ọ maliteworị ya na mbụ
  rationale: Nke a na-echekwa echiche dị na ngwaa ngwakọta ahụ, bụ́ na Taịtọs ebidolarị ọrụ ahụ tupu oge a.
- source_word: ἐπιτελέσῃ
  choice: o mezukwaa
  rationale: “Mezukwaa” na-egosi iweta ọrụ e bidoro ná ngwụcha, ma na-echekwa καί nke pụtara “kwa.”
- source_word: εἰς ὑμᾶς
  choice: n’etiti unu
  rationale: Ọrụ ahụ bụ nke Taịtọs ga-arụ n’ime obodo ndị Kọrịnt; “n’etiti unu” na-egosipụta ntụziaka ahụ nke ọma.
- source_word: χάριν
  choice: ọrụ amara
  rationale: N’ọnọdụ a χάρις na-ezo aka n’ọrụ onyinye a na-anakọta, ma okwu “amara” ka na-echekwa ụzọ Pọl si kọwaa ọrụ ahụ dị ka amara.
theological_decisions:
- issue: Ihe χάρις pụtara n’ihe gbasara onyinye a na-anakọta
  choice: ọrụ amara
  alternative: amara; onyinye; ọrụ e ji amara mee
  rationale: Ọnọdụ gbara amaokwu ahụ gburugburu na-ekwu maka onyinye a na-anakọta maka ndị nsọ. “Ọrụ amara” na-eme ka o doo anya na ọ bụ ihe a na-eme eme, ma ọ naghị ewepụ echiche ime mmụọ nke amara dị n’okwu Pọl.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke dị ugbu a ma dị ùgwù. Nhazi ahịrịokwu ahụ na-agbalị idobe njikọ ebumnobi nke εἰς τὸ ... ἵνα n’ụzọ na-agụ were were n’Igbo, ma ghara idozi ihe χάρις pụtara karịa ka ọnọdụ ya kwadoro.
