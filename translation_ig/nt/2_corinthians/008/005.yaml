id: 2CO.8.5
reference: 2 Corinthians 8:5
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ οὐ καθὼς ἠλπίσαμεν ἀλλ’ ἑαυτοὺς ἔδωκαν πρῶτον τῷ κυρίῳ καὶ ἡμῖν διὰ θελήματος θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/005.yaml
  text: And not as we expected[a], but they gave themselves first to the Lord and to us through the will of God[b],
translation:
  language: ig
  text: Ọ bụghịkwa dị ka anyị tụrụ anya ya[a]; kama, ha buru ụzọ nye Onyenwe anyị onwe ha, nyekwa anyị onwe ha, site n’uche Chineke[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “dị ka anyị nwere olileanya.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “site n’ọchịchọ Chineke,” ma ọ bụ, “dị ka uche Chineke si dị.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καθὼς ἠλπίσαμεν
  choice: dị ka anyị tụrụ anya ya
  rationale: N’ebe a, ἐλπίζω na-egosi ihe Pọl na ndị ibe ya chere na ọ ga-eme. “Tụrụ anya” bụ Igbo doro anya ma kwe ka e were ya dịka “nwere olileanya,” nke e debere na nkọwa ala peeji.
- source_word: ἑαυτοὺς ἔδωκαν
  choice: ha ... nye ... onwe ha
  rationale: E debere nnọchiaha nlaghachi azụ na ngwaa “inye” ka okwu ahụ nọgide na-egosi na ha nyere onwe ha, ọ bụghị naanị ego ma ọ bụ ihe onwunwe.
- source_word: πρῶτον
  choice: buru ụzọ
  rationale: “Buru ụzọ” na-egosi mkpa na usoro nke πρῶτον n’ụzọ Igbo na-ada nke ọma, n’enweghị ịkọwa ma ọ bụ igbochi akụkụ ọ bụla nke ihe ọ pụtara.
- source_word: τῷ κυρίῳ
  choice: nye Onyenwe anyị
  rationale: “Onyenwe anyị” bụ okwu Igbo kwesịrị ekwesị maka κύριος n’ebe a, ebe ntụaka ya bụ Kraịst.
- source_word: καὶ ἡμῖν
  choice: nyekwa anyị onwe ha
  rationale: E megharịrị “onwe ha” n’Igbo ka njikọ ya na ngwaa “nye” doo anya, ma ghara ime ka o yie na ha nyere ndị ozi naanị ihe.
- source_word: διὰ θελήματος θεοῦ
  choice: site n’uche Chineke
  rationale: “Site n’uche Chineke” na-edebe διά na genitive n’ụzọ na-ahapụ ohere maka echiche nke ụzọ, ikike Chineke, ma ọ bụ ime ihe kwekọrọ n’uche ya.
theological_decisions:
- issue: Mmekọrịta dị n’etiti inye Onyenwe anyị onwe ha na inye ndị ozi onwe ha
  choice: E debere “buru ụzọ” tupu inye Onyenwe anyị onwe ha, ma soro ya kwuo na ha nyekwara ndị ozi onwe ha.
  alternative: A pụrụ ịghọta ya dịka inyefe onwe ha ụzọ abụọ, n’enweghị ọkwa dị iche ma e wezụga ihe “buru ụzọ” na-egosi.
  rationale: Usoro okwu Grik na πρῶτον na-enye Onyenwe anyị ọnọdụ mbụ, ma ntụgharị ahụ agbakwụnyeghị nkwupụta gbasara ikike ụka nke na-adịghị n’amaokwu ahụ.
- issue: Ike okwu διὰ θελήματος θεοῦ
  choice: site n’uche Chineke
  alternative: site n’ọchịchọ Chineke; dị ka uche Chineke si dị
  rationale: Nhọrọ a na-echekwa mgbagwoju anya dị n’etiti ịbụ site n’ọrụ ma ọ bụ ikike uche Chineke na ịbụ ihe kwekọrọ n’uche ya.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E kwughachiri “onwe ha” n’ahịrị nke abụọ iji mee ka ihe e nyere doo anya n’Igbo, ebe a ka na-echekwa usoro na nrụgide nke Grik.
