  verdict: revise
  source_fidelity: The translation accurately conveys Paul’s offering of a considered opinion, the benefit to the Corinthians, and their having begun in the preceding year both to act and to be willing. However, συμφέρει is present tense ('is beneficial'), whereas ga-abara unu uru is future ('will benefit you').
