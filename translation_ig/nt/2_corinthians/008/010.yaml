id: 2CO.8.10
reference: 2 Corinthians 8:10
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ γνώμην ἐν τούτῳ δίδωμι· τοῦτο γὰρ ὑμῖν συμφέρει, οἵτινες οὐ μόνον τὸ ποιῆσαι ἀλλὰ καὶ τὸ θέλειν προενήρξασθε ἀπὸ πέρυσι·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/010.yaml
  text: 'And in this matter I give my judgment: for this is beneficial for you[b][a], who began last year not only to do it but also to will it.'
translation:
  language: ig
  text: N'okwu a, ana m enye echiche m[a], n'ihi na nke a bara unu uru—unu ndị malitere n'afọ gara aga, ọ bụghị naanị ime ya, kama ịchọkwa ime ya[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ “ndụmọdụ m” ma ọ bụ “mkpebi m.” Pọl na-enye echiche o ji nlezianya tụlee kama ikwu ya dị ka iwu.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ “ịdị njikere ime ya.” Okwu Grik ahụ na-eme ka ịdị njikere dị iche n'imezu ihe ahụ n'omume.
    reason: lexical_alternative
lexical_decisions:
- source_word: γνώμην
  choice: echiche m
  rationale: Nke a na-egosi echiche e ji nlezianya tụlee, ọ bụghị iwu Pọl nyere; ọ dabara n'okwu gbara amaokwu a gburugburu.
- source_word: ἐν τούτῳ
  choice: N'okwu a
  rationale: Ọ na-ezo aka n'okwu onyinye a na-atụle, ma na-ada nke ọma n'Igbo.
- source_word: δίδωμι
  choice: ana m enye
  rationale: Ọ na-egosipụta ngwaa dị n'oge ugbu a ma debe okwu Grik ahụ n'ụzọ doro anya.
- source_word: συμφέρει
  choice: ga-abara unu uru
  rationale: Akpaalaokwu Igbo a na-egosi ihe bara mmadụ uru ma ọ bụ dị ya mma, n'enweghị ụda okwu azụmahịa.
- source_word: οἵτινες
  choice: unu ndị
  rationale: Ọ na-ejikọta ndị Kọrịnt na nkọwa nke ndị bidoro ime ihe ahụ.
- source_word: τὸ ποιῆσαι
  choice: ime ya
  rationale: Ọ na-ezo nkenke n'imezu ọrụ onyinye ahụ, dị ka ihe gbara amaokwu a gburugburu si gosi.
- source_word: τὸ θέλειν
  choice: ịchọkwa ime ya
  rationale: Ọ na-egosipụta uche ma ọ bụ ọchịchọ ime ihe ahụ, ma na-edobe ọdịiche dị n'etiti ịdị njikere n'ime na imezu ya n'omume.
- source_word: προενήρξασθε
  choice: malitere
  rationale: ἀπὸ πέρυσι enyelarị echiche oge gara aga, ya mere 'malitere' na-ezere ikwughachi otu ihe ugboro abụọ.
- source_word: ἀπὸ πέρυσι
  choice: n'afọ gara aga
  rationale: Nke a bụ nsụgharị Igbo doro anya nke oge ihe ahụ malitere, na-amanyeghị echiche na omume ahụ gara n'ihu n'enweghị nkwụsị.
theological_decisions:
- issue: Ike okwu Pọl n'ihe gbasara ikike ya dị ka onyeozi
  choice: Pọl na-enye echiche ma ọ bụ ndụmọdụ o ji nlezianya tụlee, ọ bụghị iwu kpọmkwem.
  alternative: Pọl na-enye ntụziaka nwere ike iwu.
  rationale: Ihe gbara amaokwu a gburugburu, karịsịa 2 Kọrịnt 8:8 na 8:10, na-egosi ọdịiche dị n'etiti iwu na γνώμη. 'Echiche m' na-edobe ndụmọdụ Pọl siri ike n'emeghị ya iwu kpọmkwem.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. Ahịrịokwu ahụ na-edobe nhazi nke Grik, ma jiri akpaalaokwu Igbo eke mee ka ọdịiche dị n'etiti ime ihe na ịchọ ime ya doo anya.
