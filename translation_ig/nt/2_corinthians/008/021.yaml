source:
  edition: SBLGNT
  text: ⸂προνοοῦμεν γὰρ⸃ καλὰ οὐ μόνον ἐνώπιον κυρίου ἀλλὰ καὶ ἐνώπιον ἀνθρώπων.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/021.yaml
  text: For we take thought for what is good[a], not only before the Lord but also before people.
translation:
  language: ig
  text: N’ihi na anyị na-echebara ihe ọma[a] echiche, ọ bụghị naanị n’ihu Onyenwe anyị, kama ọ bụkwa n’ihu ndị mmadụ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ihe kwesịrị nsọpụrụ,” ma ọ bụ, “ihe ziri ezi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: προνοοῦμεν
  choice: anyị na-echebara ... echiche
  rationale: Okwu a na-egosi iche echiche nke ọma tupu oge eruo na ilezi anya ime ihe kwesịrị ekwesị. N’ọnọdụ a, ọ na-akọwa nlezianya Pọl na ndị ibe ya na-eme banyere otú e si elekọta onyinye ahụ.
- source_word: γὰρ
  choice: N’ihi na
  rationale: Ọ na-ejikọta amaokwu a na ihe bu ya ụzọ dịka nkọwa ihe mere e ji eme ihe ahụ.
- source_word: καλὰ
  choice: ihe dị mma
  rationale: Nke a na-edobe obosara okwu Grik ahụ, nke pụrụ ịpụta ihe ọma, ihe kwesịrị nsọpụrụ, ma ọ bụ ihe ziri ezi. E depụtara ụzọ ndị ọzọ n’ala ala peeji.
- source_word: οὐ μόνον ... ἀλλὰ καὶ
  choice: ọ bụghị naanị ... kama ... kwa
  rationale: Nke a bụ ụzọ Igbo dị mfe ma kwekọọ n’usoro nkwusiri ike dị n’ahịrịokwu Grik.
- source_word: ἐνώπιον
  choice: n’ihu
  rationale: Ọ na-egosi ihe a na-eme n’anya ma ọ bụ n’ihu onye na-ekiri ya, ma na-arụkwa ọrụ nke ọma n’ahịrịokwu abụọ ahụ.
- source_word: κυρίου
  choice: Onyenwe anyị
  rationale: Nke a bụ aha Igbo a na-ejikarị asụgharị κύριος mgbe ọ bụ utu aha Chineke ma ọ bụ Kraịst.
- source_word: ἀνθρώπων
  choice: ndị mmadụ
  rationale: Okwu Grik a na-ezo aka n’ebe mmadụ niile nọ, ọ bụghị naanị ụmụ nwoke.
theological_decisions:
- issue: Uche omume dị na καλὰ n’ihe gbasara ịza ajụjụ banyere ego
  choice: ihe dị mma
  alternative: ihe kwesịrị nsọpụrụ; ihe ziri ezi
  rationale: Isi okwu Grik ahụ sara mbara ma nwee ike ịgụnye omume ọma n’onwe ya nakwa omume ndị mmadụ ga-ahụ na ọ kwesịrị nsọpụrụ. Nsụgharị bụ isi adịghị amachi ya n’otu nghọta, ebe nkọwa ala ala peeji na-edobe ụzọ ndị ọzọ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta, dee ya. A họọrọ “anyị na-echebara ... echiche” iji gosi nlezianya na atụmatụ nke προνοοῦμεν, ebe “n’ihu” na-edobe oyiyi nke omume pụtara ìhè n’anya Onyenwe anyị na ndị mmadụ.
