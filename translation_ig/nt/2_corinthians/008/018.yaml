revisions:
- from: Anyị zigakwara ya nwanna ahụ, onye a na-eto n’ihe banyere oziọma n’ọgbakọ niile—[a]
  to: anyị zigakwara nwanna ahụ ka o soro ya gaa, onye a na-eto n’ihe gbasara oziọma n’ọgbakọ niile—[a]
  rationale: The revision removes the Igbo syntactic ambiguity about who accompanies whom, while preserving the Greek's specific male referent and its deliberately broad phrase “in the gospel.” The footnote is replaced with an alternative that genuinely reflects “whose commendation ... is among all the churches,” without adding a theological or ministerial interpretation.
  reviewer_model: gpt-5.6-terra
