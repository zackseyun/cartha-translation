source:
  edition: SBLGNT
  text: συνεπέμψαμεν δὲ μετ’ αὐτοῦ τὸν ἀδελφὸν οὗ ὁ ἔπαινος ἐν τῷ εὐαγγελίῳ διὰ πασῶν τῶν ἐκκλησιῶν—
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/018.yaml
  text: And we sent with him the brother whose praise in the gospel is throughout all the churches—[a]
translation:
  language: ig
  text: anyị zigakwara nwanna ahụ ka o soro ya gaa, onye a na-eto n’ihe gbasara oziọma n’ọgbakọ niile—[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “onye otuto ya n’ihe gbasara oziọma dị n’etiti ọgbakọ niile.”
    reason: lexical_alternative
lexical_decisions:
- source_word: συνεπέμψαμεν
  choice: Anyị zigakwara ya
  rationale: Oge aorist na-akọ ihe e mere; ‘zigakwara ya’ na-egosipụta na e zigara nwanna ahụ ka o soro onye a kpọtụrụ aha gaa, n’ụzọ Igbo dị mfe.
- source_word: δὲ
  choice: -kwara
  rationale: N’ebe a δέ bụ njikọ dị nro nke na-aga n’ihu n’akụkọ ahụ; mgbakwunye ‘-kwara’ na-enye echiche ‘anyị zigakwara’ n’Igbo ebumpụta ụwa.
- source_word: μετ’ αὐτοῦ
  choice: ya
  rationale: N’usoro ‘zigakwara ya nwanna ahụ,’ ‘ya’ na-egosi onye nwanna ahụ ga-eso; nke a na-ezere ikwughachi okwu n’ụzọ na-adịghị ụtọ n’Igbo.
- source_word: τὸν ἀδελφόν
  choice: nwanna ahụ
  rationale: Ọ na-ezo aka n’otu nwoke kwere ekwe nke ndị na-agụ akwụkwọ ahụ maara; ‘ahụ’ na-edobe njirimara nke isiokwu Grik ahụ na-egosi.
- source_word: οὗ ὁ ἔπαινος
  choice: onye a na-eto
  rationale: Nke a bụ ụzọ Igbo doro anya ma dị mma isi kwuo na otuto ahụ metụtara ya, n’agbanyeghị na Grik ji aha ‘otuto’ mee ya.
- source_word: ἔπαινος
  choice: a na-eto
  rationale: Ọ na-eburu echiche otuto ma ọ bụ nkwanye ùgwù; e debere ọdịiche ‘nkwanye ùgwù’ na nkọwa ala peeji.
- source_word: ἐν τῷ εὐαγγελίῳ
  choice: n’ihe banyere oziọma
  rationale: Nke a na-edobe njikọ sara mbara nke nwoke ahụ na oziọma, n’agaghị n’ihu kwuo kpọmkwem na ọ bụ nkwusa ma ọ bụ ọrụ ụka.
- source_word: διὰ πασῶν τῶν ἐκκλησιῶν
  choice: n’ọgbakọ niile
  rationale: Ọ na-egosi na otuto ma ọ bụ nkwanye ùgwù ahụ gbasara ọgbakọ Ndị Kraịst niile a na-ekwu maka ha.
- source_word: ἐκκλησιῶν
  choice: ọgbakọ
  rationale: ‘Ọgbakọ’ bụ okwu Igbo doro anya maka nzukọ Ndị Kraịst n’ebe dị iche iche ma dabara n’ọnụọgụ ọtụtụ nke okwu Grik.
theological_decisions:
- issue: Njirimara na ọnọdụ ἀδελφός
  choice: ‘nwanna ahụ,’ ya bụ otu nwoke kwere ekwe nke a maara
  alternative: ‘onye otu okwukwe ahụ’ n’enweghị igosi na ọ bụ nwoke
  rationale: Okwu Grik bụ oke nwoke, otu mkpụrụ, ma nwee isiokwu na-egosi otu onye a maara. Nsụgharị ahụ anaghị etinye ‘anyị’ nke na-adịghị n’ederede.
- issue: Ihe ἐν τῷ εὐαγγελίῳ pụtara kpọmkwem
  choice: ‘n’ihe banyere oziọma’
  alternative: ‘n’ọrụ ikwusa oziọma’ ma ọ bụ ‘n’ozi oziọma’
  rationale: Grik ekwughị kpọmkwem na ọ bụ ọrụ nkwusa ma ọ bụ ọkwa onye ozi. Okwu sara mbara na-echekwa nghọta ahụ n’enweghị itinye nkọwa ọzọ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta mee ihe. Ahịrị ogologo em dash na njedebe na-egosi na ahịrịokwu ahụ gara n’ihu n’amaokwu na-esote. Akara ala peeji [a] dị n’ederede isi.
