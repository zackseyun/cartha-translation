revisions:
- from: Ọ bụghịkwa naanị nke ahụ; ọgbakọ dị iche iche họpụtakwara ya[a] ka ọ bụrụ onye anyị na ya na-eme njem[d] n’ije ozi banyere onyinye amara a[b], nke anyị na-elekọta iji wetara Onyenwe anyị n’onwe ya otuto[c] ma gosipụta ịnụ ọkụ n’obi anyị—
  to: Ọ bụghị naanị nke ahụ, kama ọgbakọ dị iche iche họpụtakwara ya[a] ka ọ bụrụ onye anyị na ya ga-eme njem na ọrụ onyinye amara a[b][d], nke anyị na-elekọta maka otuto nke Onyenwe ahụ n’onwe ya[c] na ịnụ ọkụ n’obi anyị—
  rationale: A gbanwere njikọ nke onye na-eme njem na onyinye ahụ ka ọ gosipụta σύν n’enweghị ime ka ọ pụta naanị “ije ozi banyere” onyinye ahụ. A wepụrụ “ma gosipụta,” n’ihi na ọ na-agbakwụnye echiche nke igosi nke na-adịghị n’okwu Grik. A sụgharịkwara “the Lord himself” dịka “Onyenwe ahụ n’onwe ya,” ebe ndetu ala na-edobe nghọta ndị ọzọ nke αὐτοῦ.
