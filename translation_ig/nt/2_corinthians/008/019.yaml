id: 2CO.8.19
reference: 2 Corinthians 8:19
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: οὐ μόνον δὲ ἀλλὰ καὶ χειροτονηθεὶς ὑπὸ τῶν ἐκκλησιῶν συνέκδημος ἡμῶν ⸀σὺν τῇ χάριτι ταύτῃ τῇ διακονουμένῃ ὑφ’ ἡμῶν πρὸς τὴν ⸀αὐτοῦ τοῦ κυρίου δόξαν καὶ προθυμίαν ἡμῶν—
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/019.yaml
  text: And not only that[d][c][b][a], but he was also appointed by the churches as our traveling companion with this gracious gift that is being administered by us for the glory of the Lord himself and our eagerness—
translation:
  language: ig
  text: Ọ bụghị naanị nke ahụ, kama ọgbakọ dị iche iche họpụtakwara ya[a] ka ọ bụrụ onye anyị na ya ga-eme njem na ọrụ onyinye amara a[b][d], nke anyị na-elekọta maka otuto nke Onyenwe ahụ n’onwe ya[c] na ịnụ ọkụ n’obi anyị—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya “ahọpụtara” ma ọ bụ “tịnụ vootu họpụta.”
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị ya “amara a”; n’ebe a, “onyinye amara” na-egosi na χάρις na-ezo aka n’onyinye a na-achịkọta.
    reason: lexical_alternative
  - marker: c
    text: A pụkwara ịghọta okwu Grik ahụ dịka “otuto nke Onyenwe ya” ma ọ bụ “otuto nke Onyenwe anyị.”
    reason: alternative_reading
  - marker: d
    text: A pụkwara ịsụgharị ya “onye anyị na ya na-eme njem, ya na onyinye amara a.”
    reason: previous_rendering
lexical_decisions:
- source_word: χειροτονηθεὶς
  choice: họpụtakwara ya
  rationale: Nke a na-egosi na ọgbakọ dị iche iche họpụtara ma nyefee ya ọrụ ahụ, ma ọ naghị ekwu kpọmkwem usoro ịtụ vootu e ji mee ya.
- source_word: ἐκκλησιῶν
  choice: ọgbakọ dị iche iche
  rationale: N’okwu Pọl, ọ na-ezo aka n’ọgbakọ ndị Kraịst; ‘dị iche iche’ na-eme ka ụdị ọtụtụ nke okwu Grik pụta ìhè.
- source_word: συνέκδημος
  choice: onye anyị na ya na-eme njem
  rationale: Ọ bụ okwu Igbo doro anya ma dịkwa mfe nke na-egosi onye so ndị ọzọ eme njem.
- source_word: χάριτι
  choice: onyinye amara
  rationale: N’ebe a χάρις na-ezo aka n’onyinye a na-achịkọta, ma ‘amara’ na-edobekwa echiche nke obiọma dị n’okwu ahụ.
- source_word: διακονουμένῃ
  choice: nke anyị na-elekọta
  rationale: Nke a na-egosi ọrụ ha n’ịchịkwa na ibuga onyinye ahụ n’enweghị itinye echiche nke ikesa ya, nke okwu Grik na-ekwughị kpọmkwem.
- source_word: πρὸς
  choice: iji
  rationale: ‘Iji’ na-egosi ebumnuche ma ọ bụ ihe ọrụ ahụ na-elekwasị anya na ya.
- source_word: αὐτοῦ τοῦ κυρίου
  choice: Onyenwe anyị n’onwe ya
  rationale: Nke a na-ewere αὐτοῦ dị ka okwu nkwusi ike, na-eme ka otuto nke Onyenwe anyị pụta ìhè, ma ihe ọzọ a pụrụ ịghọta ya dị na ndetu ala.
- source_word: δόξαν
  choice: otuto
  rationale: ‘Otuto’ bụ okwu Igbo ebumpụta ụwa maka δόξα n’ebe a ma na-egosi nsọpụrụ a na-enye Onyenwe anyị.
- source_word: προθυμίαν
  choice: ịnụ ọkụ n’obi
  rationale: Nke a na-egosi ịdị njikere na ịnụ ọkụ n’obi n’enweghị ịgbakwụnye ihe onye ahụ dị njikere ime karịa ihe okwu Grik kwuru.
theological_decisions:
- issue: Ihe αὐτοῦ pụtara na πρὸς τὴν αὐτοῦ τοῦ κυρίου δόξαν
  choice: ‘Onyenwe anyị n’onwe ya,’ ebe αὐτοῦ bụ okwu nkwusi ike
  alternative: ‘otuto nke Onyenwe ya’ ma ọ bụ nanị ‘otuto nke Onyenwe anyị’
  rationale: Usoro okwu Grik dị mkpirikpi ma nwee ike ịpụta ihe karịrị otu. Nsụgharị bụ isi na-eme ka nkwusi ike dịrị n’ebe Onyenwe anyị nọ, ebe ndetu [c] na-edobe ụzọ ndị ọzọ e nwere ike isi ghọta ya.
- issue: Njikọ προθυμίαν ἡμῶν na ebumnuche nke nlekọta onyinye ahụ
  choice: ‘ma gosipụta ịnụ ọkụ n’obi anyị’
  alternative: ‘maka ... otuto na ịnụ ọkụ n’obi anyị’
  rationale: Nsụgharị a na-eme ka okwu Igbo dị mma ma na-ejikọ ịnụ ọkụ n’obi ha na ọrụ ahụ, n’agbanyeghị na usoro Grik hapụrụ njikọ ahụ n’ụdị dị mkpirikpi.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị ùgwù ma dị mfe nghọta, dee ya. E debere akara ogologo n’ọgwụgwụ iji gosi na ahịrịokwu ahụ gara n’ihu n’amaokwu na-esote. E tinyere akara ndetu [a]–[d] kpọmkwem n’ebe okwu ndị ha na-akọwa dị.
