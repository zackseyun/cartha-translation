  to: N'oge a, ihe unu nwere n'ụba bụ iji gboo ụkọ ha, ka ihe ha nwere n'ụba wee gboo ụkọ unu, ka e wee nwee nhatanha.[a]
  rationale: The revision preserves the Greek parallelism and purpose relationship while removing a reflexive emphasis not expressed in the source. The footnote continues to preserve the lexical range of ἰσότης without imposing an interpretation of identical possessions or using a primarily judicial expression.
