reference: 2 Corinthians 8:14
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἐν τῷ νῦν καιρῷ τὸ ὑμῶν περίσσευμα εἰς τὸ ἐκείνων ὑστέρημα, ἵνα καὶ τὸ ἐκείνων περίσσευμα γένηται εἰς τὸ ὑμῶν ὑστέρημα, ὅπως γένηται ἰσότης·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/014.yaml
  text: At the present time[a], your abundance is for their need, so that their abundance may also be for your need, in order that there may be equality.
translation:
  language: ig
  text: N'oge a, ihe unu nwere n'ụba bụ iji gboo ụkọ ha, ka ihe ha nwere n'ụba wee gboo ụkọ unu, ka e wee nwee nhatanha.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya “ikpe kwekọrọ n'ezi” ma ọ bụ “nhazi kwekọrọ ekwekọ.” Okwu Grik a na-ekwu ebe a maka igbo mkpa ibe ha n'ụzọ kwekọrọ n'ezi; ọ pụtaghị na mmadụ niile aghaghị inwe otu ihe kpọmkwem.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τῷ νῦν καιρῷ
  choice: N'oge a
  rationale: Nke a na-egosi ọnọdụ ma ọ bụ oge dị ugbu a n'ụzọ Igbo doro anya, n'ebughị echiche ya gaa naanị n'usoro ngụkọ oge.
- source_word: τὸ ὑμῶν περίσσευμα
  choice: ihe unu nwere n'ụba
  rationale: Okwu a na-egosi ihe karịrị mkpa mmadụ nwere, ma okwu Igbo a na-ada nke ọma ma ghara ịkọwa ya dị ka naanị ego.
- source_word: εἰς τὸ ἐκείνων ὑστέρημα
  choice: iji gboo ụkọ ha
  rationale: Ọ na-egosi na ihe dị n'ụba ga-aga n'igbo ihe na-akọrọ ha; “ụkọ” na-echekwa echiche nke enweghị ihe zuru ezu.
- source_word: ἵνα καὶ
  choice: ka ... wee
  rationale: Usoro a na-egosi nzube na mmeghachi omume dị n'etiti otu abụọ ahụ n'Igbo e ji eme ihe ugbu a.
- source_word: τὸ ἐκείνων περίσσευμα
  choice: ihe ha onwe ha nwere n'ụba
  rationale: E ji otu okwu ahụ mee ihe ọzọ iji chekwaa nhazi okwu Pọl nke na-egosi na otu akụkụ ga-enyere ibe ya aka.
- source_word: γένηται εἰς τὸ ὑμῶν ὑστέρημα
  choice: wee gboo ụkọ unu
  rationale: Nke a na-egosi ihe a tụrụ anya ya n'ahịrịokwu nzube, ma na-eme ka mmekọrịta nke igbo mkpa ibe ha doo anya.
- source_word: ὅπως γένηται ἰσότης
  choice: ka e wee nwee nhatanha
  rationale: “Nhatanha” bụ okwu Igbo kacha nso n'ἰσότης, ebe nkọwa ala peeji na-egosi na ebe a ọ bụ nhazi ziri ezi n'igbo mkpa ibe ha, ọ bụghị na onye ọ bụla ga-enwe otu ihe kpọmkwem.
theological_decisions:
- issue: Ihe ἰσότης pụtara n'arịrịọ Pọl banyere inye ihe
  choice: nhatanha n'igbo mkpa ibe ha
  alternative: ikpe ziri ezi ma ọ bụ nhazi kwekọrọ ekwekọ
  rationale: Ihe gbara amaokwu a gburugburu bụ ka ụbara otu ndị kwụọ ụkọ ndị ọzọ, ma emesịa nke ọzọ nwekwara ike ime otu ahụ; ya mere a hapụrụ okwu kpọmkwem “nhatanha” n'ederede ma kọwaa ókè echiche ya ruru n'ala peeji.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, nke dị nsọ ma dị mfe nghọta, mee ihe. A họọrọ “ihe ... nwere n'ụba” kama okwu siri ike ma ọ bụ nke ga-eme ka ihe a bụrụ naanị ego; e chekwara nhazi mmeghachi omume dị n'ahịrịokwu Grik.
