    text: Ma ọ bụ, “ịbịakwute unu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: N’ihi na
  rationale: Ọ na-egosi ihe kpatara ma ọ bụ nkọwa jikọrọ amaokwu a na ekele Pọl kwuru n’amaokwu bu ya ụzọ.
- source_word: παράκλησιν
  choice: arịrịọ ahụ
  rationale: N’ebe a, okwu ahụ na-ezo aka n’arịrịọ ma ọ bụ agbamume Pọl nyere Taịtọs ka ọ rụọ ọrụ ahụ, ọ bụghị nkasi obi.
- source_word: ἐδέξατο
  choice: ọ nabatara
  rationale: Nke a na-egosi na Taịtọs jiri obi ọma kweta arịrịọ ahụ.
- source_word: σπουδαιότερος
  choice: ịnụ ọkụ n’obi ya karịkwara
  rationale: Nke a na-echekwa ụdị ntụnyere dị n’okwu Grik ma na-egosi ịnụ ọkụ n’obi na ịdị njikere ka ukwuu.
- source_word: ὑπάρχων
  choice: ebe ... ya
  rationale: E ji usoro a mee ka nkebi participle Grik bụrụ Igbo na-aga were were, n’etinyeghị nkọwa ọzọ.
- source_word: αὐθαίρετος
  choice: o ji aka ya kpebie
  rationale: Nke a na-egosi na o mere ya n’afọ ofufo na site n’uche nke aka ya, ọ bụghị n’ihi mmanye.
- source_word: ἐξῆλθεν πρὸς ὑμᾶς
  choice: ịgakwuru unu
  rationale: Nke a na-echekwa ntụziaka mmegharị ahụ site n’ebe Pọl nọ gaa n’ebe ndị Kọrịnt nọ, ma bụrụkwa Igbo eke.
