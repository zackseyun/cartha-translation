  text: For he accepted the appeal[a], but being more earnest[d][c][b], he went to you of his own accord.
translation:
  language: ig
  text: N’ihi na ọ nabatara arịrịọ ahụ[a], ma ebe o nwerekwuru ịnụ ọkụ n’obi[b], o ji afọ ofufo[c] gawakwuru unu[d].
