    text: Ma ọ bụ, “agbamume ahụ” ma ọ bụ “arịrịọ Pọl rịọrọ ya.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ebe ọ dịkwuo uchu” ma ọ bụ “ebe ọ dịkwuo njikere.”
    reason: lexical_alternative
  - marker: c
    text: Ma ọ bụ, “site n’onwe ya” ma ọ bụ “n’uche nke aka ya.”
    reason: lexical_alternative
