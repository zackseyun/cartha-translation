id: 2CO.8.7
reference: 2 Corinthians 8:7
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἀλλ’ ὥσπερ ἐν παντὶ περισσεύετε, πίστει καὶ λόγῳ καὶ γνώσει καὶ πάσῃ σπουδῇ καὶ τῇ ἐξ ⸂ἡμῶν ἐν ὑμῖν⸃ ἀγάπῃ, ἵνα καὶ ἐν ταύτῃ τῇ χάριτι περισσεύητε.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/007.yaml
  text: But just as you abound in everything—in faith and speech and knowledge and all diligence and in our love in you—see that you also abound in this grace[a][b].
translation:
  language: ig
  text: Ma, dịka unu si baa ụba n’ihe niile—n’okwukwe, n’ikwu okwu, n’ọmụma, n’uchu niile, nakwa n’ịhụnanya sitere n’aka anyị nke dị n’ime unu—ka unu bakwa ụba n’amara a[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma eleghị anya, “ịhụnanya unu nwere n’ebe anyị nọ.” Nkebiokwu Grik a siri ike ịkọwa, ụfọdụ akwụkwọ odide aka na-agụkwa, “ịhụnanya unu nke dị n’ime anyị.”
    reason: alternative_reading
  - marker: b
    text: Ya bụ, ọrụ amara a nke inye ihe.
    reason: lexical_alternative
lexical_decisions:
- source_word: περισσεύετε / περισσεύητε
  choice: baa ụba / gaanụkwa n’ihu baa ụba
  rationale: “Ịba ụba” na-echekwa echiche nke ụbara dị na ngwaa Grik ahụ n’ebe abụọ; n’ebe nke abụọ, “gaanụkwa n’ihu” na-eme ka ume agbamume ahụ doo anya n’Igbo.
- source_word: ἐν παντί
  choice: n’ihe niile
  rationale: Nke a na-echekwa oke sara mbara nke okwu Grik ma na-eduga nke ọma n’ihe ndị e depụtara.
- source_word: πίστει
  choice: n’okwukwe
  rationale: “Okwukwe” bụ ntụgharị kwesịrị ekwesị n’usoro àgwà Ndị Kraịst a, n’agbanyeghị na okwu Grik ahụ nwekwara ike ịgụnye ntụkwasị obi ma ọ bụ ikwesị ntụkwasị obi.
- source_word: λόγῳ
  choice: n’ikwu okwu
  rationale: N’ebe a, λόγος yiri ka ọ na-ekwu maka ikike ma ọ bụ onyinye ikwu okwu; “ikwu okwu” bụ Igbo doro anya ma dị ndụ.
- source_word: γνώσει
  choice: n’ọmụma
  rationale: “Ọmụma” na-egosipụta ihe mmadụ maara ma daba n’usoro àgwà ndị a.
- source_word: πάσῃ σπουδῇ
  choice: n’ịdị uchu n’ụzọ niile
  rationale: Nke a na-egosipụta ịdị njikere, ịdị ọkụ n’obi, na itinye mgbalị nke σπουδή, ma na-echekwa πάσῃ.
- source_word: τῇ ἐξ ἡμῶν ἐν ὑμῖν ἀγάπῃ
  choice: n’ịhụnanya anyị nke dị n’ime unu
  rationale: Nke a na-enye Igbo dị mfe nghọta maka ọgụgụ SBLGNT “site n’aka anyị, n’ime unu,” n’enweghị ịgbanwe ya n’ụzọ doro anya ka ọ bụrụ ịhụnanya unu nwere n’ebe anyị nọ; ihe isi ike na ọdịiche ederede dị n’ala peeji.
- source_word: χάριτι
  choice: n’amara a
  rationale: “Amara” na-echekwa omimi okwu Pọl ji mee ihe; ihe edeturu na-akọwa na n’ebe a ọ na-ezo aka n’ọrụ mmesapụ aka nke inye ihe.
theological_decisions:
- issue: Ihe χάρις pụtara n’ihe gbasara onyinye a na-anakọta maka ndị nsọ
  choice: amara
  alternative: ọrụ amara; onyinye; omume mmesapụ aka
  rationale: Ịsụgharị ya “amara” na-echekwa njikọ okwu ahụ na amara Chineke na asụsụ Pọl, ebe ihe gbara ya gburugburu na ihe edeturu na-eme ka ọrụ inye ihe ọ na-ezo aka na ya doo anya.
- issue: Nkọwa τῇ ἐξ ἡμῶν ἐν ὑμῖν ἀγάπῃ
  choice: ịhụnanya anyị nke dị n’ime unu
  alternative: ịhụnanya unu nwere n’ebe anyị nọ
  rationale: Nkebiokwu ahụ siri ike ma nwee ọdịiche n’ihe odide aka. Isi ederede na-agbaso ọgụgụ SBLGNT n’ụzọ Igbo nwere ike ịghọta, ebe ihe edeturu na-echekwa nkọwa ọzọ na ọdịiche ederede ahụ.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. E debere usoro ndepụta nke Grik na nkwughachi “baa ụba,” ma zere idozi n’amaghị ama ihe mgbagwoju anya dị n’okwu banyere ịhụnanya.
