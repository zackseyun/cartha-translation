revisions:
- from: Ma dị ka unu si baa ụba n’ihe niile—n’okwukwe, n’ikwu okwu, n’ọmụma, n’ịdị uchu n’ụzọ niile, nakwa n’ịhụnanya anyị nke dị n’ime unu—gaanụkwa n’ihu baa ụba n’amara a[a][b].
  to: Ma, dịka unu si baa ụba n’ihe niile—n’okwukwe, n’ikwu okwu, n’ọmụma, n’uchu niile, nakwa n’ịhụnanya sitere n’aka anyị nke dị n’ime unu—ka unu bakwa ụba n’amara a[a][b].
  rationale: The revision removes the added idea of continuing, more closely represents the explicit “from us” in the difficult Greek love phrase, improves the compactness of the virtue list, and corrects the manuscript terminology in footnote a. It preserves the ambiguity of the disputed phrase and retains “amara” for χάρις, with the contextual clarification in footnote b.
