source:
  edition: SBLGNT
  text: νυνὶ δὲ καὶ τὸ ποιῆσαι ἐπιτελέσατε, ὅπως καθάπερ ἡ προθυμία τοῦ θέλειν οὕτως καὶ τὸ ἐπιτελέσαι ἐκ τοῦ ἔχειν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/011.yaml
  text: But now complete the doing of it also[a], so that just as there was the eagerness to will it[b], so also there may be the completion from what you have.
translation:
  language: ig
  text: Ma ugbu a, mechaanụ ịrụ ya, ka, dị nnọọ ka unu ji ịnụ ọkụ n’obi dị njikere ime ya, otu ahụkwa ka unu mezuo ya site n’ihe unu nwere.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “dịka ihe unu nwere.”
    reason: lexical_alternative
lexical_decisions:
- source_word: νυνὶ δὲ
  choice: Ma ugbu a
  rationale: Nke a na-egosi ntụgharị site n’ịdị njikere ha n’oge gara aga gaa n’ọrụ ha kwesịrị ịrụ ugbu a, ma na-echekwa ma echiche nke oge ma obere nghọtahie dị na δέ.
- source_word: τὸ ποιῆσαι ἐπιτελέσατε
  choice: rụchakwanụ ime ya
  rationale: Nkebiokwu a na-elekwasị anya n’imecha ọrụ ahụ a tụlerela. ‘Rụchakwanụ’ na-egosi iweta ya n’isi njedebe, ebe ‘ime ya’ na-echekwa ọdịdị infinitive ahụ n’ụzọ Igbo doro anya.
- source_word: ἡ προθυμία τοῦ θέλειν
  choice: unu si jiri ịnụ ọkụ n’obi chọọ ime ya
  rationale: ‘Ịnụ ọkụ n’obi’ na-egosi ịdị njikere na ịnụ ọkụ n’obi nke προθυμία, ebe ‘chọọ ime ya’ na-echekwa echiche mkpebi ma ọ bụ ọchịchọ dị na θέλειν.
- source_word: καθάπερ ... οὕτως καὶ
  choice: dị nnọọ ka ... otu ahụkwa
  rationale: Usoro a na-echekwa ntụnyere ziri ezi n’etiti ịdị njikere ịchọ ime ihe ahụ na imezu ya n’ezie.
- source_word: τὸ ἐπιτελέσαι
  choice: rụzuo ya
  rationale: Nhọrọ a na-egosi iburu ihe ahụ ruo n’isi njedebe, ma na-eme ka njikọ ya na ἐπιτελέσατε nke mbụ pụta ìhè.
- source_word: ἐκ τοῦ ἔχειν
  choice: si n’ihe unu nwere
  rationale: 'Nke a na-echekwa echiche nke isi ihe ma ọ bụ ókè ihe e ji emezu onyinye ahụ: ihe ha nwere n’oge ahụ, ọ bụghị ihe karịrị ike ha.'
theological_decisions:
- issue: Imezu onyinye ahụ dịka ihe mmadụ nwere hà
  choice: A tụgharịrị ἐκ τοῦ ἔχειν dịka ‘si n’ihe unu nwere,’ nke na-egosi na ha ga-emezu onyinye ahụ site n’ihe dị ha n’aka.
  alternative: Ịghọta amaokwu ahụ dịka iwu izugbe ka mmadụ mezuo ezi ebumnobi ọ bụla n’agbanyeghị ihe o nwere.
  rationale: Ihe gbara amaokwu ahụ gburugburu bụ onyinye ndị Kọrịnt kwere nkwa, nkebiokwu Grik ahụ na-egosikwa ihe dị ha n’aka dịka isi na ókè nke imezu ya. Nsụgharị ahụ anaghị eme ka a ga-asị na a chọrọ ka ha nye ihe karịrị ike ha.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. E chekwara nkwughachi dị n’amaokwu Grik n’etiti ịchọ ime ihe ahụ na ịrụzu ya, ma a haziri ya ka ọ na-ada nke ọma n’Igbo.
