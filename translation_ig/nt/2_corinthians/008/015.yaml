base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/015.yaml
  text: 'as it is written: The one who had much did not have too much[a], and the one who had little did not have too little.'
translation:
  language: ig
  text: 'Dị ka e dere ya: “Onye nwere ọtụtụ enweghị ngafe, onye nwere ntakịrị enweghịkwa ụkọ.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καθὼς γέγραπται
  choice: dị ka e dere ya, sị
  rationale: Ọ bụ usoro e ji ewebata ihe e dere n’Akwụkwọ Nsọ. Okwu a na-egosi na ihe ahụ ka dị n’akwụkwọ dịka ihe akaebe.
- source_word: Ὁ τὸ πολὺ
  choice: Onye nwere ọtụtụ
  rationale: N’asụsụ Grik, enweghị ngwaa pụtara ‘ịchịkọta’ n’ebe a; ya mere, ‘onye nwere ọtụtụ’ na-edobe okwu Pọl n’enweghị itinye ngwaa sitere n’Ọpụpụ 16:18.
- source_word: ἐπλεόνασεν
  choice: enweghị ihe karịrị ya
  rationale: N’ebe a, ngwaa ahụ na-egosi na ihe adịghị n’ụbara gafee mkpa, ya bụ, enweghị ngafe. Nsụgharị a dabara n’echiche nkesa nke amaokwu gbara ya gburugburu.
- source_word: ὁ τὸ ὀλίγον
  choice: onye nwere ntakịrị
  rationale: Ọ na-eso usoro nke ‘onye nwere ọtụtụ’ ma na-edobe ọdịiche dị n’etiti ọtụtụ na ntakịrị.
- source_word: ἠλαττόνησεν
  choice: enweghịkwa ihe kọrọ ya
  rationale: Ngwaa ahụ pụtara ịnọ n’ụkọ ma ọ bụ inwe ihe na-erughị eru. ‘Ihe kọrọ ya’ bụ ụzọ Igbo doro anya na nke eke si kwuo na onye ahụ enweghị ụkọ.
theological_decisions:
- issue: Ojiji Pọl ji Ọpụpụ 16:18 kwado izutekọta mkpa n’ụzọ nhata
  choice: E gosipụtara ọnọdụ ihe onye ọ bụla nwere n’ikpeazụ, n’etinyeghị ‘chịkọtara’ n’ahịrị bụ isi.
  alternative: “Onye chịkọtara ọtụtụ enweghị ngafe, onye chịkọtara ntakịrị enweghịkwa ụkọ.”
  rationale: Pọl na-eji amaokwu ahụ akwado ka e nwee izutekọta mkpa n’etiti ndị kwere ekwe. Grik ọ hotara ekwughị ngwaa ‘chịkọtara’ kpọmkwem, n’agbanyeghị na okwu ahụ dị n’Ọpụpụ 16:18; ya mere, nsụgharị bụ isi na-edobe obosara ojiji Pọl ji ya mee ihe, ebe ihe e dere n’ala ala na-egosi usoro nke Ọpụpụ.
translation_notes:
  register: Ejiri Standard Igbo dị ugbu a, nke dị mfe nghọta ma nwee ugwu. E debere nhata na ọdịiche dị n’etiti ‘ọtụtụ/ntakịrị’ na ‘ihe karịrị/ihe kọrọ,’ ma e tinyere akara amaokwu ala ala [a] n’ahịrị bụ isi.
