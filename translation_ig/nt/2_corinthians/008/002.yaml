source:
  edition: SBLGNT
  text: ὅτι ἐν πολλῇ δοκιμῇ θλίψεως ἡ περισσεία τῆς χαρᾶς αὐτῶν καὶ ἡ κατὰ βάθους πτωχεία αὐτῶν ἐπερίσσευσεν εἰς ⸂τὸ πλοῦτος⸃ τῆς ἁπλότητος αὐτῶν·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/002.yaml
  text: that in a severe test of affliction[b][a], the abundance of their joy and their deep poverty overflowed into the wealth of their generosity.
translation:
  language: ig
  text: N’ihi na, n’ime oké nnwale nke mkpagbu, ụbara ọṅụ ha na oké ịda ogbenye ha[a] mere ka mmesapụ aka ha[b] baa ụba nke ukwuu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ịda ogbenye ha nke ruru n’ala ala,” ma ọ bụ, “ịda ogbenye ha jọgburu onwe ya.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ịdị mfe” ma ọ bụ “ịbụ otu obi.” Okwu Grik ahụ, n’ebe a a na-ekwu maka inye ihe, yikarịrị ka ọ pụtara inye ihe n’obi sara mbara.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν πολλῇ δοκιμῇ θλίψεως
  choice: n’ime oké nnwale nke mkpagbu
  rationale: Nke a na-echekwa echiche nke nnwale siri ike nke sitere na mkpagbu, ma na-ada nke ọma n’Igbo.
- source_word: περισσεία τῆς χαρᾶς
  choice: ụbara ọṅụ ha
  rationale: “Ụbara” na-echekwa ụdị aha περισσεία ma na-ejikọta ya na ngwaa ἐπερίσσευσεν nke na-esochi.
- source_word: κατὰ βάθους πτωχεία
  choice: oke ịda ogbenye ha
  rationale: Nkebiokwu Grik a na-emesi ịdị njọ nke ịda ogbenye ike. “Oke ịda ogbenye” bụ Igbo doro anya ma bụrụkwa nke mmadụ niile ga-aghọta; nkọwa ala ala dị n’ala peeji.
- source_word: ἐπερίσσευσεν
  choice: jubigara ókè, wee rụpụta
  rationale: Nke a na-egosipụta ma ụbara ahụ ma nsonaazụ εἰς na-ebute, n’ụzọ dabara n’usoro okwu Igbo.
- source_word: εἰς τὸ πλοῦτος
  choice: wee rụpụta akụ
  rationale: “Wee rụpụta” na-egosi ike εἰς nke na-ezo aka na nsonaazụ, ebe “akụ” na-echekwa ihe atụ nke πλοῦτος.
- source_word: ἁπλότης
  choice: mmesapụ aka
  rationale: N’ebe a a na-ekwu maka inye ihe, ἁπλότης yikarịrị ka ọ na-ezo aka n’inye ihe n’obi sara mbara karịa nanị ịdị mfe.
theological_decisions:
- issue: Ihe ἁπλότης pụtara n’ebe a na-ekwu maka inye ihe
  choice: mmesapụ aka
  alternative: ịdị mfe; ezi obi; ịbụ otu obi
  rationale: Ihe gbara amaokwu a gburugburu bụ onyinye a na-enye ndị nsọ. Ya mere, “mmesapụ aka” na-egosipụta ihe Pọl na-eto, ma ala peeji na-echekwa nghọta ndị ọzọ okwu Grik ahụ nwere ike ibu.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị ùgwù ma dị mfe nghọta. A hapụrụ ihe atụ nke ụbara na akụ n’ime ederede, ebe a kọwara ụzọ ndị ọzọ e nwere isi ghọta okwu ndị ahụ n’ala peeji.
