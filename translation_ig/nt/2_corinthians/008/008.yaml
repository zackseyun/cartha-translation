source:
  edition: SBLGNT
  text: Οὐ κατ’ ἐπιταγὴν λέγω ἀλλὰ διὰ τῆς ἑτέρων σπουδῆς καὶ τὸ τῆς ὑμετέρας ἀγάπης γνήσιον δοκιμάζων·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/008.yaml
  text: I am not saying this as a command[b][a], but through the earnestness of others I am also testing the genuineness of your love.
translation:
  language: ig
  text: Anaghị m ekwu nke a dịka iwu; kama, site n'ịdị uchu nke ndị ọzọ, ana m anwale kwa ezi ịdị nke ịhụnanya unu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “ana m etinye kwa ezi ịdị nke ịhụnanya unu n'ule,” ma ọ bụ, “ana m anwale kwa ma ịhụnanya unu ọ̀ bụ ezi ịhụnanya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιταγή
  choice: iwu
  rationale: “Iwu” bụ okwu Igbo doro anya maka ntụziaka e nyere n'ike; ọ na-echekwa nkwupụta Pọl na ọ naghị ekwu okwu a dị ka iwu.
- source_word: διὰ τῆς ἑτέρων σπουδῆς
  choice: site n'ịdị uchu nke ndị ọzọ
  rationale: “Site na” na-egosipụta ụzọ ma ọ bụ ihe e ji eme ihe dịka διά na genitive si dị; “ndị ọzọ” anaghị akọwapụta ha karịa ihe odide Grik kwuru.
- source_word: σπουδή
  choice: ịdị uchu
  rationale: “Ịdị uchu” nwere ike ịgụnye ịnụ ọkụ n'obi, ịdị njikere, na itinye obi n'ihe, nke dabara n'ọnọdụ inye onyinye a.
- source_word: ἀγάπη
  choice: ịhụnanya
  rationale: “Ịhụnanya” bụ ntụgharị Igbo nkịtị na nke ziri ezi nke ἀγάπη.
- source_word: γνήσιον
  choice: nke ezigbo ya
  rationale: 'Nkebiokwu a na-egosipụta ịbụ eziokwu na enweghị aghụghọ, ma na-ada nke ọma n''okwu Igbo a: “ma ịhụnanya unu ò bụ nke ezigbo ya.”'
- source_word: δοκιμάζων
  choice: ana m anwalekwa ma ... ò bụ
  rationale: Nke a na-echekwa echiche nke inyocha ma ọ bụ itinye n'ule, ma jiri usoro ajụjụ na-adabereghị n'azịza mee ka Igbo bụrụ nke e kere eke.
- source_word: καί
  choice: -kwa
  rationale: Mgbakwunye “-kwa” na “anwalekwa” na-egosipụta ike mgbakwunye nke καί.
- source_word: ὑμετέρας
  choice: unu
  rationale: “Unu” na-egosi na Pọl na-agwa ndị Kọrịnt n'ozuzu ha okwu.
theological_decisions:
- issue: Ụzọ Pọl si kwuo okwu banyere inye onyinye
  choice: Pọl kwuru hoo haa na ya anaghị ekwu nke a dị ka iwu; kama, ọ na-eji ịdị uchu nke ndị ọzọ anwale ịdị ezigbo nke ịhụnanya ndị Kọrịnt.
  alternative: Ịghọta okwu Pọl dị ka iwu e mere ka ọ dị nro n'okwu ọnụ.
  rationale: Οὐ κατ’ ἐπιταγὴν λέγω na-agọnahụ na okwu a bụ iwu. Ntụgharị ahụ ekwesịghị ime ka ngọnarị ahụ ghọọ iwu zoro ezo, kama ọ ga-echekwa esemokwu dị n'etiti ikike onyeozi na omume ịhụnanya nke mmadụ ji aka ya mee.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke ugwu dị na ya ma dị mfe nghọta. “Ịdị uchu” na-ezere okwu dị oke nka ma chekwaa obosara echiche σπουδή. E tinyere akara ntụaka [a] ozugbo n'isiokwu ọ na-akọwa.
