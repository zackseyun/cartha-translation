  source_fidelity: Ntụgharị a na-echekwa ọdịiche dị n’etiti ikwu okwu dịka iwu na ịnwale ezi ịdị nke ịhụnanya; ọ na-asụgharịkwa σπουδή dịka “ịdị uchu.” Ma usoro “ana m anwalekwa ma ... ò bụ” gbanwere τὸ ... γνήσιον δοκιμάζων (“na-anwale ezi ịdị...”) ka ọ bụrụ ajụjụ kpọmkwem banyere ma ihe ọ̀ dị otu a. Nke a dị nso n’echiche, ma ọ bụghị usoro ma ọ bụ elekwasị anya nke Grik.
  naturalness: '“Ma ịhụnanya unu ò bụ nke ezigbo ya” anaghị ada nke ọma n’Igbo ọkọlọtọ. “Ezi ịdị nke ịhụnanya unu” na-egosi n’ụzọ doro anya ma dị eke ihe γνήσιον na-ekwu: ịdị adị/ịdị mma n’ezie nke ịhụnanya ahụ.'
