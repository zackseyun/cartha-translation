  to: Anaghị m ekwu nke a dịka iwu; kama, site n'ịdị uchu nke ndị ọzọ, ana m anwale kwa ezi ịdị nke ịhụnanya unu.[a]
  rationale: 'Emeziri nkebiokwu ikpeazụ ka ọ soro ihe owuwu Grik: Pọl na-ekwu na ọ na-anwale ezi ịdị nke ịhụnanya ndị Kọrịnt, ọ bụghị naanị na ọ na-ajụ ma ịhụnanya ha ọ̀ dị ezigbo. “Ezi ịdị” na-asụgharị γνήσιον n’ụzọ doro anya ma chekwaa echiche nke ịdị adị n’ezie/sincerity na-enweghị ịkọwa ya karịa ihe ederede kwuru. A hazikwara nkọwa ala peeji ka nhọrọ ya niile kwekọọ na “ịnwale.”'
  reviewer_model: gpt-5.6-terra
