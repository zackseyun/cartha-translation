id: 2CO.8.13
reference: 2 Corinthians 8:13
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: οὐ γὰρ ἵνα ἄλλοις ἄνεσις, ⸀ὑμῖν θλῖψις· ἀλλ’ ἐξ ἰσότητος
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/013.yaml
  text: For I do not mean that there should be relief for others and hardship for you, but equality[a]—
translation:
  language: ig
  text: N’ihi na ihe m bu n’obi abụghị ka ndị ọzọ nweta ahụ efe, unu enwee mkpagbu, kama ka e nwee nhatanha[a]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ikpe ziri ezi.” Okwu Grik a na-egosi ịhazi ihe n’ụzọ ziri ezi ka e nwee nguzozi; ọ pụtaghị na mmadụ niile ga-enwerịrị ihe ha nhata kpọmkwem.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ γὰρ ἵνα
  choice: N’ihi na ihe m bu n’obi abụghị ka
  rationale: γάρ na-enye nkọwa nke jikọtara okwu a na arịrịọ bu ya ụzọ; ἵνα, tinyere echiche ebumnuche a na-aghọta n’ahịrịokwu ahụ, ka e gosipụtara n’Igbo dị ndụ dịka “ihe m bu n’obi abụghị ka.”
- source_word: ἄλλοις
  choice: ndị ọzọ
  rationale: Dative a na-egosi ndị uru ahụ ga-erute; “ndị ọzọ” na-edobe enweghị nkọwa kpọmkwem nke okwu Grik ahụ.
- source_word: ἄνεσις
  choice: nweta ahụ efe
  rationale: N’ọnọdụ onyinye ego a, okwu ahụ pụtara ibelata ibu ma ọ bụ nrụgide, ọ bụghị naanị nkasi obi nke mmetụta uche.
- source_word: ὑμῖν θλῖψις
  choice: unu enwee mkpagbu
  rationale: Nkebi a na-egosi ọnọdụ siri ike ma ọ bụ ibu nke ga-adakwasị ndị Kọrịnt n’ụzọ na-emegide ahụ efe ndị ọzọ nwetara.
- source_word: ἀλλ’ ἐξ ἰσότητος
  choice: kama ka e nwee nhatanha
  rationale: ἰσότης nwere ike ịpụta nhatanha ma ọ bụ ikpe ziri ezi n’ịhazigharị ihe. “Nhatanha” bụ ntụgharị okwu kwụ ọtọ ma na-edobe ike okwu Pọl; a kọwara oke nghọta ya n’ala ala peeji.
theological_decisions:
- issue: Ihe ἰσότης pụtara n’okwu gbasara ịkekọrịta ihe onwunwe
  choice: nhatanha
  alternative: ikpe ziri ezi / ịhazi ihe n’ụzọ ziri ezi
  rationale: A họọrọ “nhatanha” ka e debe okwu Grik ahụ n’ụzọ doro anya na esemokwu dị n’echiche Pọl. Ihe odide ahụ anaghị achọ ka a kpebie na ọ pụtara na mmadụ niile ga-enwerịrị ihe ha nhata kpọmkwem; ya mere, ndetu ala peeji na-echekwa nghọta nke nguzozi ziri ezi.
translation_notes:
  register: Asụsụ Igbo Izugbe nke oge a, dị ugwu ma dị mfe nghọta. A họọrọ “ihe m bu n’obi” iji mee ka ebumnuche a na-aghọta n’okwu Grik pụta n’Igbo n’enweghị ịgbakwunye ozizi; “ahụ efe” na “mkpagbu” na-edobe ọdịiche dị n’etiti ibelata ibu na ịdaba n’ọnọdụ siri ike.
