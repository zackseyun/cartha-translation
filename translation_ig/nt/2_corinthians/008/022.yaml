reference: 2 Corinthians 8:22
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: συνεπέμψαμεν δὲ αὐτοῖς τὸν ἀδελφὸν ἡμῶν ὃν ἐδοκιμάσαμεν ἐν πολλοῖς πολλάκις σπουδαῖον ὄντα, νυνὶ δὲ πολὺ σπουδαιότερον πεποιθήσει πολλῇ τῇ εἰς ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/022.yaml
  text: And we have sent with them our brother[a], whom we have often tested in many matters and found to be diligent, but who is now even more diligent because of his great confidence in you.
translation:
  language: ig
  text: Anyị zigakwara nwanna anyị ka ya na ha gaa. Anyị anwalela ya ọtụtụ ugboro n'ọtụtụ ihe, hụ na ọ dị uchu. Ma ugbu a, ọ dị uchu karị nnọọ n'ihi nnukwu ntụkwasị obi o nwere n'ebe unu nọ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị akụkụ ikpeazụ ya, “ma ugbu a, ọ dị uchu karị nnọọ site n'oké ntụkwasị obi o nwere n'ebe unu nọ.” Usoro okwu Grik ahụ nwere ike ikwe ka a ghọta njikọ a n'ụzọ dịtụ iche, ma isi echiche ya bụ na ịdị uchu ya amụbawo n'ihe gbasara unu.
    reason: lexical_alternative
lexical_decisions:
- source_word: συνεπέμψαμεν
  choice: Anyị zigakwara ... ka o soro ha gaa
  rationale: Nke a na-egosipụta ma iziga onye ahụ ma σύν- nke pụtara na o so ndị ọzọ gaa. Oge gara aga dabara n'ụdị akwụkwọ ozi Pọl.
- source_word: τὸν ἀδελφὸν ἡμῶν
  choice: nwanna anyị
  rationale: Ọ na-edobe okwu ezinụlọ ndị Kraịst ji akpọ nwoke ibe ha nọ n'okwukwe, n'etinyeghị nkọwa na-adịghị na Grik.
- source_word: ἐδοκιμάσαμεν
  choice: Anyị anwalela ya ... chọpụtakwa
  rationale: ‘Anwalela’ na-egosi ule e mere, ebe ‘chọpụtakwa’ na-eme ka ihe ule ahụ gosipụtara pụta ìhè n'Igbo nkịtị.
- source_word: ἐν πολλοῖς πολλάκις
  choice: ọtụtụ ugboro n'ọtụtụ ihe
  rationale: Nhọrọ a na-edobe ma ugboro ugboro (πολλάκις) ma obosara ọnọdụ ma ọ bụ ihe ndị a nwalere ya na ha (ἐν πολλοῖς).
- source_word: σπουδαῖον ὄντα
  choice: ọ na-agbasi mbọ ike
  rationale: Nkebiokwu a na-enye echiche nke ịdị uchu, ịnụ ọkụ n'obi, na itinye obi n'ọrụ, n'ụzọ dị ndụ ma doo anya n'Igbo.
- source_word: νυνὶ δὲ πολὺ σπουδαιότερον
  choice: Ma ugbu a, ọ na-agbasi mbọ ike karịa nke ukwuu
  rationale: Ọ na-edobe ntụnyere σπουδαιότερον na ike mgbakwunye nke πολὺ, ma jikọta ya na otu okwu e ji sụgharị σπουδαῖον.
- source_word: πεποιθήσει πολλῇ τῇ εἰς ὑμᾶς
  choice: n'ihi nnukwu ntụkwasị obi o nwere n'ebe unu nọ
  rationale: Nke a na-ewere dative ahụ dị ka ihe kpatara mmụba n'ịgbasi mbọ ike, ma na-edobe ntụziaka ntụkwasị obi ahụ n'ebe ndị Kọrịnt nọ.
theological_decisions:
- issue: Onye nwere πεποίθησις na otú o si metụta σπουδαιότερον
  choice: Nnwanne ahụ na-agbasi mbọ ike karịa n'ihi nnukwu ntụkwasị obi o nwere n'ebe ndị Kọrịnt nọ.
  alternative: A pụrụ ịghọta ya dị ka nnukwu ntụkwasị obi Pọl nwere n'ebe ndị Kọrịnt nọ, ma ọ bụ dị ka obi ike n'ebe ha nọ.
  rationale: Usoro okwu Grik kacha mfe na-ejikọta nkebiokwu ahụ na nwanna ahụ a na-ekwu maka ya, ma na-akọwa ihe mere o ji na-agbasi mbọ ike karịa ugbu a. Ihe odide ahụ ekwesịghị ibu ozizi ọzọ a na-etinyeghị na ya.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta mee ihe. E kewara ahịrịokwu Grik ogologo ụzọ atọ ka ọgụgụ ya doo anya, ma e chekwara njikọ echiche niile. E tinyere akara [a] kpọmkwem n'akụkụ nkebiokwu footnote ahụ na-akọwa.
