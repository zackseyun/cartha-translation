revisions:
- from: Anyị zigakwara nwanna anyị ka o soro ha gaa. Anyị anwalela ya ọtụtụ ugboro n'ọtụtụ ihe, chọpụtakwa na ọ na-agbasi mbọ ike. Ma ugbu a, ọ na-agbasi mbọ ike karịa nke ukwuu n'ihi nnukwu ntụkwasị obi o nwere n'ebe unu nọ.[a]
  to: Anyị zigakwara nwanna anyị ka ya na ha gaa. Anyị anwalela ya ọtụtụ ugboro n'ọtụtụ ihe, hụ na ọ dị uchu. Ma ugbu a, ọ dị uchu karị nnọọ n'ihi nnukwu ntụkwasị obi o nwere n'ebe unu nọ.[a]
  rationale: The revision is limited to idiomatic Standard Igbo improvements. It preserves the source’s repeated testing in many matters, the brother’s established diligence, the strong comparative force (“much more”), and the possible causal/instrumental relation of his confidence toward the Corinthians. The footnote continues to signal the limited syntactic flexibility without claiming a different theological conclusion.
