id: 2CO.8.1
reference: 2 Corinthians 8:1
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Γνωρίζομεν δὲ ὑμῖν, ἀδελφοί, τὴν χάριν τοῦ θεοῦ τὴν δεδομένην ἐν ταῖς ἐκκλησίαις τῆς Μακεδονίας,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/001.yaml
  text: We make known to you[a], brothers, the grace of God that has been given among the churches of Macedonia[b],
translation:
  language: ig
  text: anyị na-eme ka unu mata, ụmụnna[a], amara Chineke e nyere n’ọgbakọ ndị dị na Masedonia[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ụmụnna nwoke na ụmụnna nwanyị.” Okwu Grik ahụ dị n’ụdị nwoke, ma a na-ejikarị ya akpọ ọgbakọ dum, ma ndị nwoke ma ndị nwanyị.
    reason: lexical_alternative
  - marker: b
    text: “Amara Chineke” nwere ike izo aka ma n’ihu ọma Chineke ma ná mmesapụ aka nke ihu ọma ahụ kpatara n’ọgbakọ ndị dị na Masedonia.
    reason: lexical_alternative
lexical_decisions:
- source_word: Γνωρίζομεν
  choice: anyị na-eme ka unu mara
  rationale: Nke a na-egosipụta ihe ngwaa ahụ pụtara, ya bụ ime ka mmadụ mara ihe, ma na-edobekwa ụda akwụkwọ ozi ahụ n’enweghị itinye echiche ọzọ dịka ‘anyị chọrọ ka unu mara.’
- source_word: δὲ
  choice: (egosighị ya iche n’okwu Igbo)
  rationale: δὲ bụ njikọ dị nro nke na-egosi ngafe gaa n’isiokwu ọzọ, ọ bụghị mmegide siri ike. N’ebe a, nhazi ahịrịokwu Igbo na-egosi ngafe ahụ nke ọma n’enweghị ‘ma’ nke nwere ike ime ka a ghọta na e nwere mmegide.
- source_word: ὑμῖν
  choice: unu
  rationale: Ọ bụ nnọchiaha na-ezo aka n’ọgbakọ niile Pọl na-agwa okwu.
- source_word: ἀδελφοί
  choice: Ụmụnna
  rationale: ‘Ụmụnna’ bụ ụzọ ebumpụta ụwa, dị ùgwù e si akpọ ndị otu okwukwe n’Igbo; n’ọnọdụ a ọ pụrụ ịgụnye ma ndị nwoke ma ndị nwanyị.
- source_word: χάριν
  choice: amara
  rationale: '‘Amara’ na-echekwa obosara okwu Pọl: ihu ọma Chineke na ọrụ ọma nke ihu ọma ahụ na-amịpụta, kama ime ka ọ bụrụ naanị onyinye ma ọ bụ mmesapụ aka.'
- source_word: τοῦ θεοῦ
  choice: Chineke
  rationale: Njikọ ‘amara Chineke’ na-egosipụta genitive ahụ n’ụzọ Igbo dị mkpụmkpụ ma bụrụkwa nke a na-aghọta nke ọma.
- source_word: τὴν δεδομένην
  choice: nke e nyere
  rationale: Ụdị a na-echekwa olu nnara nke participle ahụ, ma na-egosi na Chineke bụ onye nyere amara ahụ n’agbanyeghị na ekwughị onye mere ihe ahụ kpọmkwem n’ahịrịokwu Grik.
- source_word: ἐν
  choice: n’etiti
  rationale: ‘N’etiti’ na-egosi na amara ahụ rụrụ ọrụ n’ime ma n’etiti ọgbakọ ndị ahụ, n’enweghị imechi okwu ahụ ka ọ bụrụ naanị ọnọdụ ebe ihe mere.
- source_word: ἐκκλησίαις
  choice: ọgbakọ Kraịst
  rationale: N’ọnọdụ akwụkwọ ozi Pọl, okwu a na-ezo aka n’ọgbakọ ndị kwere na Kraịst. Ịgbakwunye ‘Kraịst’ na-eme ka ihe ọ pụtara doo onye Igbo nke oge a anya, ọ bụghị ụlọ nzukọ nkịtị.
- source_word: τῆς Μακεδονίας
  choice: ndị dị na Masedonia
  rationale: Nke a bụ ụzọ Igbo ebumpụta ụwa isi gosi ọgbakọ ndị nọ n’ógbè Masedonia.
theological_decisions:
- issue: Ihe ‘amara Chineke’ pụtara n’ebe a
  choice: E debere ‘amara Chineke’ ka ọ gụnye ọrụ ihu ọma Chineke n’etiti ọgbakọ ndị Masedonia na mmesapụ aka ọrụ ahụ mụtara.
  alternative: Ịsụgharị ya naanị dịka ‘onyinye ebere’ ma ọ bụ ‘mmesapụ aka.’
  rationale: Okwu Grik ahụ nwere ike ime ka ma isi iyi ahụ—amara Chineke—ma mkpụrụ ya—inye ihe n’ụba—dịrị n’uche. Nsụgharị ahụ anaghị ekpebi naanị otu n’ime ha.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. Ahịrịokwu ahụ na-edobe ụda akwụkwọ ozi Pọl na isi okwu ‘amara,’ ma na-ahapụ obosara na esemokwu nkà mmụta okpukpe dị n’okwu Grik ahụ ka ha dị.
