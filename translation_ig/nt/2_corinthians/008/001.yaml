revisions:
- from: Ụmụnna[a], anyị na-eme ka unu mara amara Chineke nke e nyere n’etiti ọgbakọ Kraịst ndị dị na Masedonia[b].
  to: anyị na-eme ka unu mata, ụmụnna[a], amara Chineke e nyere n’ọgbakọ ndị dị na Masedonia[b].
  rationale: The revision removes the unsupported addition “Kraịst,” replaces an awkward verbal repetition with idiomatic Standard Igbo, and renders the prepositional phrase as the sphere in which God’s grace was given. It retains the source’s ambiguity concerning whether χάρις emphasizes God’s favor, its practical outworking, or both.
