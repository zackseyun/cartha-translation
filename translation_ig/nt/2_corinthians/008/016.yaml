- from: Ma ekele dịrị Chineke, onye na-etinye otu ịnụ ọkụ n'obi ahụ o nwere maka unu n'obi Taịtọs,[a]
  to: Ma ekele dịrị Chineke, onye na-etinye otu ịnụ ọkụ n’obi ahụ maka unu n’obi Taịtọs,[a]
  rationale: The revision removes the unsupported and ambiguous “o nwere” while preserving the Greek’s comparative “the same,” its concern directed toward the Corinthians, and its metaphor of Titus’s heart. The footnote now offers a direct, natural alternative for “na-etinye” (“na-enye”).
