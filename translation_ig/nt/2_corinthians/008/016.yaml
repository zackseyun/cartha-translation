  text: Χάρις δὲ τῷ θεῷ τῷ ⸀διδόντι τὴν αὐτὴν σπουδὴν ὑπὲρ ὑμῶν ἐν τῇ καρδίᾳ Τίτου,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/016.yaml
  text: But thanks be to God[a], who puts the same earnestness for you into Titus's heart,
translation:
  language: ig
  text: Ma ekele dịrị Chineke, onye na-etinye otu ịnụ ọkụ n’obi ahụ maka unu n’obi Taịtọs,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A pụkwara ịsụ ya: “onye na-enye Taịtọs otu ịnụ ọkụ n’obi ahụ maka unu n’obi ya.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Χάρις δὲ τῷ θεῷ
  choice: Ma ekele dịrị Chineke
  rationale: N'usoro okwu a, χάρις ya na dative τῷ θεῷ bụ okwu e ji ekele Chineke, ọ bụghị iji webata echiche amara. “Ma” na-egosi ntughari dị nro nke δέ.
- source_word: τῷ διδόντι
  choice: onye na-etinye
  rationale: Ọ bụ ezie na δίδωμι pụtara “inye,” “na-etinye ... n'obi” bụ ụzọ Igbo si ekwu echiche nke ime ka ọchịchọ ma ọ bụ mmụọ dịrị mmadụ n'ime.
- source_word: τὴν αὐτὴν σπουδήν
  choice: otu ịnụ ọkụ n'obi ahụ
  rationale: σπουδή ebe a na-egosi ịnụ ọkụ n'obi na nchegbu siri ike, ọ bụghị naanị ịrụsi ọrụ ike. αὐτήν na-echekwa echiche “otu ... ahụ,” ya bụ, nke kwekọrọ na nke Pọl.
- source_word: ὑπὲρ ὑμῶν
  choice: o nwere maka unu
  rationale: ὑπέρ na-egosi na ịnụ ọkụ n'obi ahụ metụtara ndị Kọrịnt ma bụrụ maka ọdịmma ha.
- source_word: ἐν τῇ καρδίᾳ Τίτου
  choice: n'obi Taịtọs
  rationale: Nke a na-echekwa ihe atụ Grik nke obi dị ka ebe ọchịchọ na mkpebi mmadụ dị, ma na-asụkwa Igbo n'ụzọ nkịtị.
theological_decisions: []
translation_notes:
  register: Asụsụ Igbo Izugbe, dị ugwu ma dị mfe nghọta. E chekwara ihe atụ nke “obi” na ike nke “otu ... ahụ,” ma jiri “ịnụ ọkụ n'obi” mee ka σπουδή doo onye na-agụ akwụkwọ taa anya.
