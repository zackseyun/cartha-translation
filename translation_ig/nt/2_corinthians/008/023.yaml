reference: 2 Corinthians 8:23
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: εἴτε ὑπὲρ Τίτου, κοινωνὸς ἐμὸς καὶ εἰς ὑμᾶς συνεργός· εἴτε ἀδελφοὶ ἡμῶν, ἀπόστολοι ἐκκλησιῶν, δόξα Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/023.yaml
  text: As for Titus[a], he is my partner and fellow worker for you; as for our brothers, they are messengers of the churches[b], the glory of Messiah.
translation:
  language: ig
  text: A bịa na Taịtọs, ọ bụ onye mụ na ya na-emekọ ihe na onye mụ na ya na-arụkọ ọrụ maka unu. A bịakwa na ụmụnna anyị, ha bụ ndị nnọchiteanya ndị ọgbakọ zitere[a], ha bụkwa ebube nke Mesaịa[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ndịozi nke ọgbakọ.” Okwu Grik ahụ nwere ike ịpụta ndị ozi ma ọ bụ ndị nnọchiteanya e nyere ọrụ ma zipụ, ma ọ bụ ndịozi n’echiche sara mbara; n’ebe a, ihe gbara ya gburugburu na-akwado ndị nnọchiteanya ndị ọgbakọ zitere.
    reason: alternative_reading
  - marker: b
    text: Ma ọ bụ, “ebube nke Kraịst.” E ji “Mesaịa” mee ihe n’ebe a n’ihi na Χριστός na-arụ ọrụ dịka utu aha.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴτε ὑπὲρ Τίτου
  choice: A bịa na Taịtọs
  rationale: Nkebiokwu Grik a dị nkenke ma na-ewebata nke mbụ n’ime ihe abụọ Pọl na-atụle. ‘A bịa na’ na-arụ otu ọrụ ahụ n’Igbo dị ugbu a n’enweghị ịmanye okwu ‘ma ọ bụrụ.’
- source_word: κοινωνὸς ἐμὸς
  choice: onye mụ na ya na-emekọ ihe
  rationale: κοινωνός na-egosi onye ya na onye ọzọ na-ekere òkè n’ihe ma ọ bụ onye mmekọ. Nhọrọ a na-edobe echiche nke mmekọrịta na ọrụ ha na-emekọ.
- source_word: εἰς ὑμᾶς συνεργός
  choice: onye mụ na ya na-arụkọ ọrụ maka unu
  rationale: ‘Na-arụkọ ọrụ’ na-egosipụta συνεργός, ebe ‘maka unu’ na-egosipụta na ọrụ ahụ chere ihu n’ebe ndị Kọrịnt nọ n’etinyeghị nkọwa ọzọ dịka ‘maka ọdịmma unu.’
- source_word: ἀδελφοὶ ἡμῶν
  choice: ụmụnna anyị
  rationale: N’Igbo, ‘ụmụnna anyị’ bụ ụzọ ebumpụta ụwa na nke kwesịrị ùgwù isi kwuo ụmụ nwoke ndị so n’otu okwukwe; ihe gbara amaokwu a gburugburu na-egosi ndị nnọchiteanya nwoke.
- source_word: ἀπόστολοι ἐκκλησιῶν
  choice: ndị nnọchiteanya ọgbakọ dị iche iche zitere
  rationale: N’ebe a ἀπόστολοι na-ezo aka n’ụmụnna ndị ọgbakọ nyere ọrụ ma zipụ, ya mere okwu a na-ezere ịgụnye ọkwa pụrụ iche nke ndịozi ma na-egosipụta ma iziga ha ma ndị zitere ha.
- source_word: δόξα Χριστοῦ
  choice: ebube nke Mezaịa
  rationale: Nke a na-edobe ọdịdị nkebiokwu Grik na-enweghị ngwaa na njikọ genitive ya. ‘Mezaịa’ na-egosipụta Χριστός dịka utu aha, ọ bụghị naanị dịka aha mmadụ.
theological_decisions:
- issue: Ihe ἀπόστολοι pụtara gbasara ụmụnna ndị a na-akpọghị aha
  choice: ndị nnọchiteanya ọgbakọ dị iche iche zitere
  alternative: ndịozi nke ọgbakọ dị iche iche
  rationale: Ihe gbara amaokwu ahụ gburugburu bụ ndị na-anọchite anya ọgbakọ n’ihe gbasara onyinye, ebe ‘nke ọgbakọ dị iche iche’ na-egosi ndị nzukọ ndị ahụ nyere ọrụ ma zipụ. Nke a anaghị ebunye ha ọkwa nkà mmụta okpukpe nke ederede ahụ ekwughị hoo haa.
- issue: Otu e si asụgharị Χριστοῦ
  choice: nke Mezaịa
  alternative: nke Kraịst
  rationale: Χριστός na-arụ ọrụ dịka utu aha n’ebe a. ‘Mezaịa’ na-edobe echiche nke Onye E Tere Mmanụ, ebe ihe odide ala peeji na-enye ‘Kraịst’ dịka okwu ọzọ ndị na-agụ Baịbụl Igbo maara.
- issue: Njikọ dị na δόξα Χριστοῦ
  choice: ebube nke Mezaịa
  alternative: ndị na-ewetara Mezaịa nsọpụrụ
  rationale: Genitive ahụ nwere ike igosi ebube nke Mezaịa nke ha na-egosipụta, ma nkebiokwu Grik akọwaghị ya ọzọ. Nsụgharị a na-edobe njupụta na esemokwu ahụ kama ịkọwa ya dịka naanị nsọpụrụ ha na-ewetara ya.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, nke kwesịrị ùgwù ma dị mfe nghọta, dee ya. E kewara ahịrịokwu Grik ahụ ụzọ abụọ iji mee ka njikọ ya doo anya n’Igbo, ma e debere myirịta ‘A bịa… A bịakwa…’. E tinyere ‘ha bụkwa’ n’akụkụ ikpeazụ iji mee ka nkebiokwu na-enweghị ngwaa bụrụ Igbo ebumpụta ụwa n’agbanweghị isi ya.
