revisions:
- from: A bịa na Taịtọs, ọ bụ onye mụ na ya na-emekọ ihe na onye mụ na ya na-arụkọ ọrụ maka unu. A bịakwa na ụmụnna anyị, ha bụ ndị nnọchiteanya ọgbakọ dị iche iche zitere[a], ha bụkwa ebube nke Mezaịa[b].
  to: A bịa na Taịtọs, ọ bụ onye mụ na ya na-emekọ ihe na onye mụ na ya na-arụkọ ọrụ maka unu. A bịakwa na ụmụnna anyị, ha bụ ndị nnọchiteanya ndị ọgbakọ zitere[a], ha bụkwa ebube nke Mesaịa[b].
  rationale: The revision removes the unexpressed qualifier “dị iche iche,” uses a direct Igbo relative construction for church-appointed representatives, and regularizes the transliteration of Messiah. It retains the source’s terse appositional final clause and preserves the lexical ambiguity of ἀπόστολοι in a correctly anchored footnote.
  reviewer_model: gpt-5.6-terra
