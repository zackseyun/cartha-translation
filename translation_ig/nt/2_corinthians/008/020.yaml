  variant: Standard Igbo
source:
  edition: SBLGNT
  text: στελλόμενοι τοῦτο μή τις ἡμᾶς μωμήσηται ἐν τῇ ἁδρότητι ταύτῃ τῇ διακονουμένῃ ὑφ’ ἡμῶν,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/020.yaml
  text: taking this precaution, so that no one may blame us in regard to this generous gift being administered by us,
translation:
  language: ig
  text: anyị na-akpachara anya n'ihe a, ka onye ọ bụla ghara ịta anyị ụta banyere onyinye bara ụba[a] a anyị na-elekọta.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, ‘onyinye mmesapụ aka a’ ma ọ bụ ‘ụba a.’ Okwu Grik ahụ nwere ike ịpụta onyinye buru ibu ma ọ bụ nke e ji mmesapụ aka nye.
    reason: lexical_alternative
lexical_decisions:
- source_word: στελλόμενοι
  choice: Anyị na-akpachara anya
  rationale: Okwu a n'ụdị middle participle na-egosi ime ihe iji gbochie nsogbu ma ọ bụ izere ihe ga-eweta nkọcha; ‘na-akpachara anya’ na-enye echiche mgbochi ahụ n'Igbo nkịtị.
- source_word: τοῦτο
  choice: n'okwu a
  rationale: Ihe nrụtụ aka a na-ezo aka na usoro nchebe e mere banyere njikwa onyinye ahụ; ‘n'okwu a’ na-eme ka njikọ ahụ doo anya n'Igbo.
- source_word: μή τις ἡμᾶς μωμήσηται
  choice: ka onye ọ bụla ghara ịta anyị ụta
  rationale: μή tinyere subjunctive na-egosi ebumnuche nke igbochi nkọcha; ‘ịta anyị ụta’ na-egosipụta μωμάομαι nke ọma.
- source_word: ἐν
  choice: banyere
  rationale: N'ebe a ἐν na-egosi ihe nkọcha ahụ metụtara, ọ bụghị naanị ebe; ‘banyere’ bụ okwu Igbo doro anya maka mmekọrịta a.
- source_word: ἁδρότητι
  choice: onyinye bara ụba
  rationale: ἁδρότης nwere ike ịpụta ụba, mmesapụ aka, ma ọ bụ nnukwu onyinye. N'ọnọdụ nchịkọta ego a, ‘onyinye bara ụba’ na-egosi ma onyinye ahụ ma ịdị ukwuu ya, ma na-edebe ohere nkọwa nke okwu Grik ahụ.
- source_word: ταύτῃ
  choice: a
  rationale: Nrụtụ aka ahụ na-akọwapụta onyinye ahụ a na-ekwu maka ya.
- source_word: τῇ διακονουμένῃ ὑφ’ ἡμῶν
  choice: anyị na-elekọta
  rationale: N'ọnọdụ enyemaka ego a, διακονέω na-ezo aka n'ịrụ ọrụ na ijikwa onyinye ahụ. ‘Anyị na-elekọta’ bụ asụsụ Igbo dị ndụ nke na-egosi ọrụ nchịkwa ahụ n'enweghị ụda ụka agbakwunyere.
theological_decisions:
- issue: Ihe kpatara Pọl ji kpachara anya n'ijikwa nchịkọta onyinye ahụ
  choice: E gosipụtara amaokwu ahụ dịka ịkpachara anya bara uru iji gbochie nkọcha n'ihe banyere njikwa onyinye.
  alternative: Ịsụgharị ya naanị dịka nhazi njem, n'emeghị ka echiche nke ịza ajụjụ na izere nkọcha pụta ìhè.
  rationale: Grik ahụ lekwasịrị anya n'ihe Pọl na ndị ibe ya mere iji gbochie onye ọ bụla ịta ha ụta banyere nchịkọta ahụ. Nsụgharị a na-edebe echiche nke ezi omume na ịza ajụjụ, ma ọ naghị etinye ozizi ọzọ n'ime ya.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ugwu ma dị mfe nghọta. Ahịrịokwu ahụ ji usoro Igbo nkịtị dochie passive Grik (‘anyị na-elekọta’) ma chekwaa onye na-eme ihe na ihe a na-eme. Akara ndetu ala [a] dị n'isiokwu ahụ.
