id: 2CO.8.9
reference: 2 Corinthians 8:9
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: γινώσκετε γὰρ τὴν χάριν τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ, ὅτι δι’ ὑμᾶς ἐπτώχευσεν πλούσιος ὤν, ἵνα ὑμεῖς τῇ ἐκείνου πτωχείᾳ πλουτήσητε.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/009.yaml
  text: For you know the grace of our Lord Jesus Christ[a], that though he was rich, yet for your sake he became poor[b], so that you by his poverty might become rich.
translation:
  language: ig
  text: N’ihi na unu maara amara nke Onyenwe anyị Jizọs Kraịst[a], na ọ bụ ezie na ọ bara ọgaranya, ọ ghọrọ ogbenye n’ihi unu[b], ka unu wee site n’ogbenye ya baa ọgaranya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ “Jizọs Mesaya.” A pụrụ ide aha Grik ahụ bụ Χριστός dịka “Kraịst” ma ọ bụ sụgharịa ya “Mesaya”; “Mesaya” na-egosipụta ihe aha nsọpụrụ ahụ pụtara.
    reason: alternative_reading
  - marker: b
    text: O yikarịrị ka okwu ndị a bụ “ọgaranya” na “ogbenye” bụ ihe atụ nke na-atụnyere ihe Kraịst nwere na mbụ na iweda onwe ya ala maka ndị ọzọ; Pọl akọwaghị ihe atụ ahụ kpọmkwem n’ebe a.
    reason: lexical_alternative
lexical_decisions:
- source_word: γινώσκετε
  choice: unu maara
  rationale: Ngwaa a dị n’oge ugbu a ma na-agwa ọtụtụ mmadụ okwu; Pọl na-ezo aka n’ihe ndị Kọrịnt maaralarị.
- source_word: χάριν
  choice: amara
  rationale: “Amara” na-echekwa echiche nke ihu ọma Chineke na omume ọma Kraịst, ma kwekwa ka njikọ ya na mmesapụ aka dị n’amaokwu ndị gbara ya gburugburu pụta ìhè.
- source_word: κυρίου
  choice: Onyenwe
  rationale: Nke a bụ aha nsọpụrụ a na-ejikarị sụgharịa κύριος, na-egosikwa ikike ya.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jizọs Kraịst
  rationale: “Kraịst” bụ ụdị aha a maara nke ọma n’Igbo; ihe odide ala peeji na-egosi na aha Grik ahụ pụtara “Mesaya.”
- source_word: δι’ ὑμᾶς
  choice: n’ihi unu
  rationale: N’ebe a, διά na-egosi na ihe ahụ mere maka ọdịmma ha; okwu Igbo a dị nkenke ma bụrụkwa nke e ji eme ihe n’ụzọ nkịtị.
- source_word: πλούσιος ὤν
  choice: ọ bụ ezie na ọ bara ọgaranya
  rationale: Nkebiokwu a na-egosi ihe abụọ na-emegiderịta onwe ha; “ọ bụ ezie na” na-eme ka ọdịiche ahụ doo anya.
- source_word: ἐπτώχευσεν
  choice: ọ ghọrọ ogbenye
  rationale: Nke a na-echekwa mgbanwe e gosiri na Grik, site n’ịba ọgaranya ruo n’ịghọ ogbenye, n’ebughị ụzọ kọwaa ụdị ogbenye ahụ.
- source_word: τῇ ἐκείνου πτωχείᾳ
  choice: site n’ịbụ ogbenye ya
  rationale: “Site na” na-egosipụta ụzọ ma ọ bụ ihe e ji mee ka ihe si na ya pụta; “ya” bụ ụzọ Igbo dị mfe isi kwuo ἐκείνου.
- source_word: πλουτήσητε
  choice: unu ... baa ọgaranya
  rationale: Nke a na-echekwa ntụnyere doro anya dị n’etiti Kraịst ịghọ ogbenye na ndị kwere ekwe ịba ọgaranya, nakwa ebumnuche e gosiri site na ἵνα.
theological_decisions:
- issue: Ihe “ịba ọgaranya” nke Kraịst na nke ndị kwere ekwe pụtara
  choice: E debere okwu akụnụba ahụ dịka ihe atụ n’amaokwu ahụ, n’akọwaghị kpọmkwem ụdị akụnụba ma ọ bụ ogbenye a na-ekwu.
  alternative: A pụrụ ịkọwa ya kpọmkwem dịka ebube Kraịst nwere tupu ọ ghọọ mmadụ, ọnọdụ ya dịka Mesaya, ngọzi nzọpụta ime mmụọ, ma ọ bụ ndụ mmesapụ aka n’etiti ọgbakọ.
  rationale: Grik akọwaghị ihe atụ ahụ kpọmkwem. Ọ na-ejikọta inyefe onwe Kraịst na arịrịọ Pọl banyere mmesapụ aka; ya mere, nsụgharị ahụ kwesịrị idobe obosara na esemokwu echiche ahụ.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, nke dị nsọpụrụ ma dịkwa mfe nghọta. E debere ntụnyere “ọgaranya/ogbenye” na usoro ebumnuche nke amaokwu Grik ahụ, n’etinyeghị nkọwa otu ụka ọ bụla n’ime isiokwu ahụ.
