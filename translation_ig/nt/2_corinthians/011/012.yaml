reference: 2 Corinthians 11:12
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ὃ δὲ ποιῶ καὶ ποιήσω, ἵνα ἐκκόψω τὴν ἀφορμὴν τῶν θελόντων ἀφορμήν, ἵνα ἐν ᾧ καυχῶνται εὑρεθῶσιν καθὼς καὶ ἡμεῖς.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/012.yaml
  text: But what I am doing[a], I will continue to do, in order to cut off the opportunity from those who want an opportunity, so that in what they boast about they may be found to be just as we are.
translation:
  language: ig
  text: Ma ihe m na-eme, m ga-anọgidekwa na-eme ya, ka m wee gbupụ ohere[a] n’aka ndị na-achọ ohere, ka e wee hụ na n’ihe ha na-anya isi, ha dị nnọọ ka anyị.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A pụkwara ịsụgharị “ohere” n’ebe abụọ a dị ka “ihe ngọpụ” ma ọ bụ “ọnọdụ ha ga-eji mee ihe” (Grik: ἀφορμή).'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὃ δὲ ποιῶ καὶ ποιήσω
  choice: Ma ihe m na-eme ugbu a, m ga-anọgidekwa na-eme ya
  rationale: Oge ugbu a na oge ọdịnihu nke ποιέω na-egosi ihe Pọl na-eme ugbu a na mkpebi ya ịnọgide na-eme ya. Nsụgharị a na-eme ka echiche ahụ doo anya n’Igbo nkịtị.
- source_word: ἐκκόψω
  choice: ka m wee gbupụ
  rationale: ἐκκόπτω pụtara n’ụzọ nkịtị ‘igbupụ,’ ma n’ebe a e ji ya mee ihe atụ banyere iwepụ ohere. ‘Gbupụ’ na-echekwa ihe atụ siri ike dị n’asụsụ Grik.
- source_word: ἀφορμή
  choice: ohere
  rationale: ἀφορμή nwere ike ịpụta ohere, ọnọdụ e ji mee ihe, ma ọ bụ ihe ngọpụ. ‘Ohere’ bụ okwu na-anọpụ iche nke na-echekwa obosara ihe okwu Grik ahụ nwere ike ịpụta; e debere nkọwa ndị ọzọ n’ala peeji.
- source_word: τῶν θελόντων ἀφορμήν
  choice: n’aka ndị na-achọ ohere
  rationale: Nke a na-echekwa nkwughachi nke ἀφορμή ma na-egosikwa na ebumnuche Pọl bụ ịnapụ ndị ahụ ihe ha na-achọ iji mee ihe.
- source_word: ἐν ᾧ καυχῶνται
  choice: n’ihe ha na-anya isi banyere ya
  rationale: Nkebi a na-egosi ihe ma ọ bụ okwu ha ji anya isi. Nsụgharị a bụ Igbo doro anya ma ọ naghị akọwapụta ihe ahụ karịa ka Grik si kwuo ya.
- source_word: εὑρεθῶσιν καθὼς καὶ ἡμεῖς
  choice: ka e wee hụ na ... ha dị nnọọ ka anyị
  rationale: ‘Ka e wee hụ’ na-echekwa echiche nke ngwaa nnara εὑρεθῶσιν, ebe ‘dị nnọọ ka anyị’ na-egosi ntụnyere siri ike dị na καθὼς καὶ ἡμεῖς.
theological_decisions:
- issue: Ụdị ἀφορμή ndị na-emegide Pọl na-achọ
  choice: E ji okwu na-anọpụ iche bụ ‘ohere’ mee ihe n’ahịrịokwu bụ isi.
  alternative: ‘ihe ngọpụ’ ma ọ bụ ‘ọnọdụ ha ga-eji mee ihe’
  rationale: Ọ bụ ezie na gburugburu okwu a bụ nke esemokwu, ἀφορμή n’onwe ya anaghị amanye ka a sụgharịa ya n’ụzọ na-ebo ha ebubo dị ka ‘ihe ngọpụ.’ ‘Ohere’ na-ahapụ ka gburugburu okwu ahụ gosi echiche ọjọọ ahụ, ebe nkọwa ala peeji na-echekwa ihe ndị ọzọ okwu ahụ nwere ike ịpụta.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta mee ihe. A nọgidere na nkwughachi ‘ohere’ dị na Grik, chekwaakwa ihe atụ nke ‘igbupụ,’ n’agbanyeghị na e mere nhazi ahịrịokwu ahụ ka ọ na-ada nke ọma n’Igbo.
