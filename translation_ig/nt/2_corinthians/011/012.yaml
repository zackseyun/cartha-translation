- from: Ma ihe m na-eme ugbu a, m ga-anọgidekwa na-eme ya, ka m wee gbupụ ohere[a] n’aka ndị na-achọ ohere, ka e wee hụ na n’ihe ha na-anya isi banyere ya, ha dị nnọọ ka anyị.
