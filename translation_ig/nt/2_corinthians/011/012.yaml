  rationale: 'Two small revisions improve formal fidelity and idiomatic flow: “ugbu a” is removed because it is not explicit in the Greek, and the redundant “banyere ya” is omitted. The translation retains the source’s repeated ἀφορμή, the cutting-off imagery of ἐκκόψω, and the neutral lexical choice rather than imposing “pretext” in the main text.'
