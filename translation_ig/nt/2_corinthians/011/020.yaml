id: 2CO.11.20
reference: 2 Corinthians 11:20
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἀνέχεσθε γὰρ εἴ τις ὑμᾶς καταδουλοῖ, εἴ τις κατεσθίει, εἴ τις λαμβάνει, εἴ τις ἐπαίρεται, εἴ τις ⸂εἰς πρόσωπον ὑμᾶς⸃ δέρει.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/020.yaml
  text: For you put up with it if someone enslaves you[a], if someone devours you, if someone takes from you, if someone exalts himself[b], if someone strikes you in the face.
translation:
  language: ig
  text: N’ihi na unu na-anagide ya[a] ma ọ bụrụ na mmadụ emee unu ndị ohu, ma ọ bụrụ na mmadụ eripịa unu, ma ọ bụrụ na mmadụ anapụ unu ihe[b], ma ọ bụrụ na mmadụ ebuli onwe ya elu, ma ọ bụrụ na mmadụ etie unu n’ihu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịtụgharị ya, “unu na-ekwe ka ọ dịrị otu a” ma ọ bụ “unu na-atachi obi na ya.”
    reason: lexical_alternative
  - marker: b
    text: N’ụzọ nkịtị, okwu Grik ahụ bụ “iwere”; ebe a, o yiri ka ọ na-ekwu maka ịnara ihe n’aka unu n’ụzọ irigbu unu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνέχεσθε
  choice: unu na-anagide ya
  rationale: Okwu a na-egosi na ndị Kọrịnt nọgidere na-ekwe omume mmegbu ndị a; “na-anagide ya” bụ Igbo doro anya nke na-echekwa ụda ịbara ha mba n’ụzọ ịkwa emo.
- source_word: γὰρ
  choice: N’ihi na
  rationale: Nke a na-echekwa njikọ nkọwa okwu ahụ nwere n’ihe Pọl kwuru tupu ya.
- source_word: καταδουλοῖ
  choice: emee unu ndị ohu
  rationale: Nhọrọ a na-echekwa echiche siri ike nke ime mmadụ ohu ma ọ bụ idobe ya n’okpuru ọchịchị ohu, n’etinyeghị nro n’asụsụ ahụ.
- source_word: κατεσθίει
  choice: eripịa unu
  rationale: Ọ na-echekwa onyinyo doro anya nke iri mmadụ kpamkpam, nke e ji akọwa mmegbu na irigbu mmadụ.
- source_word: λαμβάνει
  choice: anapụ unu ihe
  rationale: Okwu Grik ahụ sara mbara, pụtara ‘were’ ma ọ bụ ‘nata’; ọnọdụ okwu a na-egosi iwere ihe n’aka ha n’ụzọ mmegbu, ma nsụgharị a anaghị ekwu kpọmkwem na ọ bụ ego.
- source_word: ἐπαίρεται
  choice: ebuli onwe ya elu
  rationale: Nke a na-echekwa echiche nke mmadụ ibuli onwe ya elu ma jiri mpako mee onwe ya onye ukwu.
- source_word: εἰς πρόσωπον ὑμᾶς δέρει
  choice: etie unu n’ihu
  rationale: Nhọrọ a na-echekwa omume iti mmadụ n’ihu na mkparị dị n’ime ya, n’emeghị ka ọ bụrụ naanị ịma aka.
- source_word: εἴ τις
  choice: ma ọ bụrụ na mmadụ
  rationale: E jigidere usoro nkwughachi ahụ ugboro ugboro ka ike okwu Pọl na usoro ndepụta ya ghara ịla n’iyi.
theological_decisions:
- issue: Ụda okwu Pọl
  choice: E gosiri ya dị ka ịbara ndị Kọrịnt mba n’ụzọ ịkwa emo maka otú ha si anagide ndị na-emegbu ha, ma a kpọghị ndị ahụ aha n’amaokwu ahụ.
  alternative: Ịgbakwunye n’amaokwu ahụ na ndị na-eme ihe ndị a bụ ndịozi ụgha ma ọ bụ ndị ozizi ụgha.
  rationale: Ọnọdụ gbara amaokwu ahụ gburugburu na-egosi ndị Pọl na-emegide, ma amaokwu Grik a n’onwe ya depụtara naanị omume ha. Ya mere, nsụgharị ahụ anaghị etinye nkọwa ọzọ n’ime isi okwu.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta, mee nsụgharị ahụ. E chekwara nkwughachi “ma ọ bụrụ na mmadụ” maka ike okwu ahụ, tinyekwa onyinyo siri ike nke ịgba ohu, iripịa, na iti mmadụ n’ihu.
