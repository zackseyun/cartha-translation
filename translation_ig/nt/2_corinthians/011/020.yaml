    text: A pụkwara ịtụgharị ya, “unu na-ekwe ka ọ dịrị otu a” ma ọ bụ “unu na-atachi obi na ya.”
    reason: lexical_alternative
  - marker: b
    text: N’ụzọ nkịtị, okwu Grik ahụ bụ “iwere”; ebe a, o yiri ka ọ na-ekwu maka ịnara ihe n’aka unu n’ụzọ irigbu unu.
    reason: lexical_alternative
  revision_rationale: The revision removes an unsupported disjunctive connector before the final repeated conditional, preserving Paul’s five-part rhetorical sequence. Minor footnote edits make the Igbo idiomatic while preserving the lexical alternatives and the source’s ambiguity.
