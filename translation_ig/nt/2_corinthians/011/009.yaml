revisions:
- from: Mgbe mụ na unu nọkwa, mgbe ihe dị m mkpa[a], ebughị m onye ọ bụla ibu arọ; n’ihi na ụmụnna ndị si Masedonia bịa nyere m ihe ndị kọrọ m. N’ihe niile, ezere m ịbụ ibu arọ nye unu, m ga-anọgidekwa na-ezere ya.
  to: Mgbe m nọnyere unu, mgbe m nọ ná mkpa[a], ebughị m onye ọ bụla ibu arọ; n’ihi na ụmụnna ndị si Masedonia bịa nyere m ihe kọrọ m. N’ihe niile, edebekwara m onwe m ka m ghara ịbụ ibu arọ nye unu, m ga-edebekwa onwe m otu a.
  rationale: The revision removes an unnatural doubled temporal phrase, renders Paul’s state of need clearly, changes the supplied object to the idiomatic singular “ihe kọrọ m,” and more closely reflects the reflexive wording in the final sentence. It retains the source’s ambiguity regarding the Macedonian “brothers” and preserves the financial-burden motif.
