reference: 2 Corinthians 11:9
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ παρὼν πρὸς ὑμᾶς καὶ ὑστερηθεὶς οὐ κατενάρκησα οὐθενός· τὸ γὰρ ὑστέρημά μου προσανεπλήρωσαν οἱ ἀδελφοὶ ἐλθόντες ἀπὸ Μακεδονίας· καὶ ἐν παντὶ ἀβαρῆ ⸂ἐμαυτὸν ὑμῖν⸃ ἐτήρησα καὶ τηρήσω.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/009.yaml
  text: And when I was present with you and was in need[a], I was not a burden to anyone; for the brothers who came from Macedonia supplied what I lacked. And in everything I kept myself from being a burden to you[b], and will keep doing so.
translation:
  language: ig
  text: Mgbe m nọnyere unu, mgbe m nọ ná mkpa[a], ebughị m onye ọ bụla ibu arọ; n’ihi na ụmụnna ndị si Masedonia bịa nyere m ihe kọrọ m. N’ihe niile, edebekwara m onwe m ka m ghara ịbụ ibu arọ nye unu, m ga-edebekwa onwe m otu a.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “mgbe ihe kọrọ m.” Okwu Grik a pụtara ịnọ ná mkpa ma ọ bụ inwe ụkọ, karịchaa ụkọ ihe onwunwe n’ebe a.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρὼν πρὸς ὑμᾶς
  choice: Mgbe mụ na unu nọkwa
  rationale: A sụgharịrị participle ahụ dị ka nkebiokwu oge n’Igbo nkịtị, nke na-egosi na Pọl nọ n’etiti ha n’onwe ya.
- source_word: ὑστερηθεὶς
  choice: mgbe ihe dị m mkpa
  rationale: N’ebe a okwu ahụ na-egosi na Pọl nwere ụkọ, karịchaa ụkọ ihe onwunwe; nsụgharị a bụ nke dị mfe ma doo anya n’Igbo.
- source_word: οὐ κατενάρκησα οὐθενός
  choice: ebughị m onye ọ bụla ibu arọ
  rationale: Okwu Grik ahụ na-egosi ịdakwasị mmadụ dị ka ibu, karịchaa n’ihe gbasara ego. Akpaalaokwu Igbo a na-echekwa echiche ahụ.
- source_word: τὸ ὑστέρημά μου
  choice: ihe ndị kọrọ m
  rationale: Nke a na-egosi ihe ndị Pọl na-enweghị ma ọ bụ ihe ndị dị ya mkpa, kama iji okwu nkịtị siri ike gbasara ‘ụkọ.’
- source_word: προσανεπλήρωσαν
  choice: nyere m
  rationale: N’usoro ahịrịokwu a, ‘nyere m ihe ndị kọrọ m’ na-ekwupụta nke ọma imeju ma ọ bụ ịkwado ihe fọdụrụ Pọl mkpa.
- source_word: οἱ ἀδελφοὶ
  choice: ụmụnna ndị
  rationale: ‘Ụmụnna’ bụ okwu Igbo Baịbụl na nke ọgbara ọhụrụ kwesịrị ekwesị maka ndị otu okwukwe. Ihe gbara ya gburugburu nwere ike izo aka n’ụmụ nwoke kpọmkwem, ma okwu Igbo ahụ anaghị amanye mkpebi karịrị ihe amaokwu ahụ kwuru.
- source_word: ἐλθόντες ἀπὸ Μακεδονίας
  choice: ndị si Masedonia bịa
  rationale: A gbanwere participle ahụ ka ọ bụrụ nkebiokwu njikọ dị ire n’Igbo, ma chekwaa ebe ha si bịa.
- source_word: ἐν παντί
  choice: N’ihe niile
  rationale: Nke a na-echekwa obosara okwu Grik ahụ n’enweghị ịkọwa ya karịa ka e dere ya.
- source_word: ἀβαρῆ ἐμαυτὸν ὑμῖν
  choice: ezere m ịbụ ibu arọ nye unu
  rationale: Okwu Grik ahụ pụtara idebe onwe ya ka ọ ghara ịbụ ibu nye ha, karịchaa n’ego; Igbo a bụ nke eke ma doo anya.
- source_word: ἐτήρησα καὶ τηρήσω
  choice: ezere m ... m ga-anọgidekwa na-ezere ya
  rationale: Nsụgharị a na-egosi ma ihe Pọl mere ruo mgbe ahụ ma mkpebi ya ịga n’ihu ime otu ihe ahụ.
theological_decisions:
- issue: Ma οἱ ἀδελφοὶ ọ̀ bụ naanị ụmụ nwoke ka ọ bụ ndị kwere ekwe n’ozuzu
  choice: ụmụnna ndị
  alternative: ụmụ nwoke ndị kwere ekwe
  rationale: Ụdị Grik ahụ bụ masculine plural, ma Pọl na-ejikwa okwu ahụ akpọ ndị otu okwukwe. N’ebe a o nwere ike ịbụ ndị ọrụ ibe kpọmkwem si Masedonia. ‘Ụmụnna’ na-echekwa okwu ezinụlọ nke okwukwe ma ghara ikpebi njirimara ha karịa ihe ederede kwuru.
translation_notes:
  register: E ji Igbo Izugbe nke dị ugbu a, dị ùgwù ma dị mfe nghọta. E jigidere akpaalaokwu ‘ibu arọ’ iji jikọta echiche abụọ Pọl kwughachiri banyere ịghara ịdakwasị ndị Kọrịnt ibu ego. Akara nkọwa ala peeji [a] dị n’ederede isi.
