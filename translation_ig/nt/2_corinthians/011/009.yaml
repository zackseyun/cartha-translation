review_pass:
  verdict: revise
  source_fidelity: 'The draft preserves the verse''s main sense: Paul''s need, refusal to burden anyone, provision from Macedonian fellow believers, and his continuing resolve. However, the opening construction repeats “mgbe” awkwardly, and “ihe dị m mkpa” means ‘things I need’ rather than clearly expressing the participial state ‘being in need.’ The second occurrence should more explicitly retain the Greek idea of maintaining himself as not burdensome to the Corinthians.'
  naturalness: “Mgbe mụ na unu nọkwa, mgbe...” is not natural Standard Igbo due to the doubled temporal connective. “Mụ na unu” is also less direct here than “m nọnyere unu.” The revised wording is smoother, contemporary, and retains a dignified biblical register.
  terminology: “Ibu arọ” is an appropriate rendering for the financial-burden sense of καταναρκάω/ἀβαρής. “Ụmụnna” suitably preserves the source term without deciding beyond the text whether the identified Macedonian believers were exclusively male. “Masedonia” is a standard Igbo form.
  issues:
  - severity: medium
    issue: Opening temporal and need clause is awkward and semantically imprecise.
    rationale: “Mgbe mụ na unu nọkwa, mgbe ihe dị m mkpa” redundantly uses “mgbe” and can mean ‘when the things I need were needed.’ Greek ὑστερηθείς describes Paul as being in want. “mgbe m nọ ná mkpa” clearly expresses this.
  - severity: low
    issue: The final clause weakens the reflexive-maintenance wording.
    rationale: “ezere m ịbụ ibu arọ nye unu” communicates the result, but “edebekwara m onwe m ka m ghara ịbụ ibu arọ nye unu” more directly represents ἀβαρῆ ἐμαυτὸν ὑμῖν ἐτήρησα while remaining natural Igbo.
  revised_text: Mgbe m nọnyere unu, mgbe m nọ ná mkpa[a], ebughị m onye ọ bụla ibu arọ; n’ihi na ụmụnna ndị si Masedonia bịa nyere m ihe kọrọ m. N’ihe niile, edebekwara m onwe m ka m ghara ịbụ ibu arọ nye unu, m ga-edebekwa onwe m otu a.
  revised_footnotes:
  - marker: a
    text: Ma ọ bụ, “mgbe ihe kọrọ m.” Okwu Grik a pụtara ịnọ ná mkpa ma ọ bụ inwe ụkọ, karịchaa ụkọ ihe onwunwe n’ebe a.
    reason: lexical_alternative
  revision_rationale: The revision removes an unnatural doubled temporal phrase, renders Paul’s state of need clearly, changes the supplied object to the idiomatic singular “ihe kọrọ m,” and more closely reflects the reflexive wording in the final sentence. It retains the source’s ambiguity regarding the Macedonian “brothers” and preserves the financial-burden motif.
