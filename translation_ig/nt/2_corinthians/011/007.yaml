id: 2CO.11.7
reference: 2 Corinthians 11:7
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ἢ ἁμαρτίαν ἐποίησα ἐμαυτὸν ταπεινῶν ἵνα ὑμεῖς ὑψωθῆτε, ὅτι δωρεὰν τὸ τοῦ θεοῦ εὐαγγέλιον εὐηγγελισάμην ὑμῖν;
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/007.yaml
  text: Or did I commit a sin by humbling myself so that you might be exalted[b][a], because I proclaimed the gospel of God to you free of charge?
translation:
  language: ig
  text: Ka ọ̀ bụ na m mere mmehie[a] site n’iweda onwe m ala ka e wee bulie unu elu, n’ihi na m kwusara unu oziọma Chineke n’efu[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “m mehiere.” Akpaokwu Grik pụtara n’ụzọ nkịtị, “m mere mmehie.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “n’anataghị ụgwọ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἢ
  choice: Ka ọ̀ bụ na
  rationale: Ọ na-ewebata ajụjụ nkwughachi jikọrọ okwu a na arụmụka bu ya ụzọ ma na-echekwa ụda ajụjụ Pọl.
- source_word: ἁμαρτίαν ἐποίησα
  choice: m mere mmehie
  rationale: Nke a na-esochi akpaalaokwu Grik nke pụtara n'ụzọ nkịtị ‘ime mmehie,’ ma ọ ka bụkwa okwu Igbo doro anya.
- source_word: ἐμαυτὸν ταπεινῶν
  choice: site n’iweda onwe m ala
  rationale: Ọ na-echekwa echiche nke Pọl ji aka ya wedata onwe ya ala, ma na-egosi njikọ omume ahụ na ajụjụ ya.
- source_word: ἵνα ὑμεῖς ὑψωθῆτε
  choice: ka e wee bulie unu elu
  rationale: Ọ na-echekwa nkebiokwu ebumnuche na ọdịdị nnara nke ngwaa ahụ, na-akọwaghị onye na-ebuli ha elu.
- source_word: ὅτι
  choice: n’ihi na
  rationale: Ọ na-egosi ihe mere omume Pọl ji bụrụ ihe a na-ajụ ma ọ̀ bụ mmehie.
- source_word: δωρεὰν
  choice: n’efu
  rationale: Ọ bụ ụzọ Igbo dị nkenke ma kwe nghọta isi kwuo na Pọl anataghị ụgwọ maka ikwusa oziọma ahụ.
- source_word: τὸ τοῦ θεοῦ εὐαγγέλιον
  choice: oziọma Chineke
  rationale: Ọ na-echekwa njikọ dị n’etiti oziọma ahụ na Chineke n’akọwaghị kpọmkwem ụdị njikọ genitiv ahụ.
- source_word: εὐηγγελισάμην ὑμῖν
  choice: m kwusara unu
  rationale: ‘Kwụsara’ na-egosi izi ozi ahụ n’ihu ọha, ma ọ naghị etinye nkọwa ụka karịrị ihe dị na Grik.
theological_decisions:
- issue: Ụdị ajụjụ Pọl banyere iweda onwe ya ala na ịghara ịnara ụgwọ
  choice: E chekwara ya dịka ajụjụ nkwughachi nwere ike ibu ihe ọchị ilu, n’etinyeghị ikpe ozizi banyere ụgwọ ndị na-eje ozi.
  alternative: Ịkọwa ya n’ụzọ ga-ekwu hoo haa na Pọl hapụrụ ikike onyeozi o nwere, ma ọ bụ ime ka ọ bụrụ naanị ịrịọ mgbaghara.
  rationale: Grik na-ajụ ma iweda onwe ya ala na ikwusa oziọma n’efu hà bụ mmehie; nsụgharị ahụ kwesịrị ịhapụ nrụgide a ka ọ dị.
- issue: Onye na-ebuli ndị Kọrịnt elu
  choice: E ji ọdịdị nnara ‘ka e wee bulie unu elu’ mee ka onye na-eme ihe ahụ ghara ịkọwapụta.
  alternative: ‘Ka Chineke wee bulie unu elu’ ma ọ bụ ‘ka m wee bulie unu elu.’
  rationale: Ngwaa Grik bụ nnara, ihe odide ahụ ekwughị kpọmkwem onye na-ebuli ha elu; ịkpọ onye ahụ aha ga-edozi ihe isi mmalite hapụrụ ghe oghe.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. ‘Oziọma’ bụ okwu a maara nke ọma; ‘n’efu’ bụ okwu nkịtị doro anya, ebe nkọwa ala peeji na-enye ụdị ‘n’anataghị ụgwọ.’
