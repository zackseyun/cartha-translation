  text: λογίζομαι γὰρ μηδὲν ὑστερηκέναι τῶν ὑπερλίαν ἀποστόλων·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/005.yaml
  text: For I consider that I am not in the least inferior to those super-apostles[a].
translation:
  language: ig
  text: N’ihi na echere m na ọ dịghị ihe m ji dị ala karịa ndịozi ndị ahụ pụrụ nnọọ iche[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ndịozi ndị kacha pụta ìhè.” A pụrụ ịghọta okwu Grik ahụ dị ka okwu ịkwa emo (“ndịozi ndị ahụ pụrụ nnọọ iche”), ma ọ bụ dị ka okwu kpọmkwem banyere ndịozi a na-akwanyere ùgwù nke ukwuu.
    reason: alternative_reading
lexical_decisions:
- source_word: λογίζομαι
  choice: echere m
  rationale: Nke a bụ ụzọ Igbo nkịtị na nke doro anya isi kwupụta echiche onye nyochara ihe ma kpebie ya; ọ na-eburu echiche nke ‘iche’ ma ọ bụ ‘ịtụle.’
- source_word: γὰρ
  choice: N’ihi na
  rationale: Ọ na-egosi na okwu a na-enye nkwado ma ọ bụ nkọwa maka okwu bu ya ụzọ n’arụmụka Pọl.
- source_word: μηδὲν
  choice: ọ dịghị ụzọ ọ bụla
  rationale: N’ebe a, okwu ahụ na-arụ ọrụ ike dị ka adverb, na-egosi ‘ọ bụghị ma ọlị’ ma ọ bụ ‘n’ụzọ ọ bụla.’ Nsụgharị a na-eme ka ike okwu ahụ pụta n’Igbo eke.
- source_word: ὑστερηκέναι
  choice: m si dị ala karịa
  rationale: N’ọnọdụ ntụnyere a, ọ pụtara ịbụ onye na-erughị ndị ọzọ ma ọ bụ onye nọ n’azụ ha. ‘Ịdị ala karịa’ na-ekwupụta nke a nke ọma n’Igbo.
- source_word: τῶν ὑπερλίαν ἀποστόλων
  choice: ndịozi ahụ karịrị akarị
  rationale: ‘Karịrị akarị’ na-edobe ịdị ukwuu gabigara ókè nke ὑπερλίαν ma na-ekwe ka onye na-agụ ya nụ okwu ahụ dị ka ịkwa emo, n’agbanyeghị na a ka pụrụ ịghọta ya dị ka okwu gbasara ndịozi a na-akwanyere ùgwù nke ukwuu.
theological_decisions:
- issue: Ma τῶν ὑπερλίαν ἀποστόλων bụ okwu ịkwa emo banyere ndị na-emegide Pọl, ka ọ bụ okwu kpọmkwem banyere ndịozi ndị a na-akwanyere ùgwù nke ukwuu.
  choice: ndịozi ahụ karịrị akarị
  alternative: ndịozi ndị kacha pụta ìhè
  rationale: Ọnọdụ okwu gbara amaokwu a gburugburu na-akwado na Pọl nwere ike ịdị na-ekwu okwu ịkwa emo banyere ndị na-asọ ya mpi. Ma n’ihi na mkpụrụokwu Grik ahụ nwekwara ike izo aka n’ezie n’ebe ndịozi a ma ama nọ, e debere nghọta ọzọ ahụ n’okpuru peeji kama idozi esemokwu ahụ n’otu ụzọ naanị.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị ùgwù ma dị mfe nghọta. Ahịrịokwu ahụ na-edobe usoro arụmụka Pọl na ike ntụnyere ya, ebe nkọwa ala peeji na-echekwa nghọta abụọ nke okwu a na-akpọ ndịozi.
