language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: εἰ δὲ καὶ ἰδιώτης τῷ λόγῳ, ἀλλ’ οὐ τῇ γνώσει, ἀλλ’ ἐν παντὶ ⸀φανερώσαντες ἐν πᾶσιν εἰς ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/006.yaml
  text: But even if I am unskilled in speech[a], I am not in knowledge; indeed[c][b], in every way we have made this plain among all to you.
translation:
  language: ig
  text: Ọ bụrụgodị na enweghị m nka n'ikwu okwu[a], enweghị m ụkọ n'ihe ọmụma. Mana anyị emewo ka nke a doo unu anya n'ụzọ niile na n'ihe niile.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ọ bụrụgodị na enweghị m ọzụzụ n'ikwu okwu,” ya bụ, enweghị m nka ikwu okwu n'ụzọ a haziri nke ọma.
    reason: lexical_alternative
  - marker: b
    text: Okwu Grik dị n'ebe a dị mkpụmkpụ, a pụkwara ịsụgharị ya, “n'ụzọ niile anyị emewo ka nke a doo unu anya n'etiti mmadụ niile,” ma ọ bụ, “n'ụzọ niile na n'ihe niile, anyị emewo ka nke a doo unu anya.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἰδιώτης τῷ λόγῳ
  choice: abụghị m ọkà n'ikwu okwu
  rationale: N'ebe a, okwu ahụ na-egosi na Pọl enweghị nka pụrụ iche n'okwu e ji nkà kwuo, ọ bụghị na ọ bụ onye na-amaghị ihe n'ozuzu. Nsụgharị a na-eme ka ọdịiche dị n'etiti otú e si ekwu okwu na ihe ọmụma pụta ìhè.
- source_word: γνώσει
  choice: ihe ọmụma
  rationale: Nke a bụ okwu Igbo kwụ ọtọ maka γνώσις, ma ọ na-echekwa ọdịiche Pọl mere n'etiti nka ikwu okwu na nghọta ya.
- source_word: φανερώσαντες
  choice: anyị emewo ka nke a doo unu anya
  rationale: Ọ na-egosi na ha emeela ka eziokwu ahụ pụta ìhè nye ndị Kọrịnt site n'omume na mmekọrịta ha.
- source_word: ἐν παντί
  choice: n'ụzọ niile
  rationale: Nkebiokwu a na-egosi oke na ụzọ dị iche iche e si mee ka ihe ahụ pụta ìhè.
- source_word: ἐν πᾶσιν
  choice: n'ihe niile
  rationale: E debere okwu sara mbara nke Grik ahụ n'enweghị ikpebi kpọmkwem ma ọ na-ekwu banyere mmadụ niile, ọnọdụ niile, ma ọ bụ ihe niile.
- source_word: εἰς ὑμᾶς
  choice: unu
  rationale: Ọ na-egosi na ndị Kọrịnt bụ ndị a na-egosi ma na-eme ka okwu a doo anya.
theological_decisions:
- issue: Ihe Pọl na-ekweta banyere otú o si ekwu okwu
  choice: Pọl na-ekweta na ọ bụghị ọkà n'okwu a na-ekwu n'ụzọ a zụrụ azụ ma maa mma; ọ naghị ekweta na ihe ọmụma kọrọ ya.
  alternative: Pọl bụ onye na-agụghị akwụkwọ n'ozuzu, ma ọ bụ na okwu ya bụ naanị akaja nke na-ekwetaghị adịghị ike ọ bụla.
  rationale: Ọdịiche doro anya dị n'etiti λόγος na γνῶσις na-egosi na okwu ahụ gbasara nka ikwu okwu, ọ bụghị eziokwu nke ozi ya, ikike ya, ma ọ bụ ihe ọmụma ya.
- issue: Nkebiokwu dị mkpụmkpụ ἐν παντὶ ... ἐν πᾶσιν εἰς ὑμᾶς
  choice: n'ụzọ niile ... n'ihe niile ... unu
  alternative: n'ụzọ niile anyị emewo ka nke a doo unu anya n'etiti mmadụ niile
  rationale: Usoro okwu Grik ahụ nwere ike ịpụta ihe niile, ọnọdụ niile, ma ọ bụ mmadụ niile. Isi nsụgharị ahụ na-echekwa obosara ya, ebe nkọwa ala peeji na-egosi ụzọ ọzọ e nwere ike isi ghọta ya.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, nke nwere ugwu ma dị mfe nghọta. “Ọkà n'ikwu okwu” na-egosi nka okwu a zụrụ azụ n'enweghị ịkpọ Pọl onye na-amaghị akwụkwọ; e chekwara ihe mgbagwoju anya dị na nkebi ikpeazụ site na nkọwa ala peeji.
