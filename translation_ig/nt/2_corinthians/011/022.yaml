  text: Ἑβραῖοί εἰσιν; κἀγώ. Ἰσραηλῖταί εἰσιν; κἀγώ. σπέρμα Ἀβραάμ εἰσιν; κἀγώ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/022.yaml
  text: Are they Hebrews? So am I[a]. Are they Israelites? So am I. Are they Abraham’s offspring? So am I.
translation:
  language: ig
  text: Ha bụ ndị Hibru? Abụ m kwa. Ha bụ ndị Izrel? Abụ m kwa. Ha bụ mkpụrụ Ebreham[a]? Abụ m kwa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ụmụ Ebreham.” Okwu Grik ahụ ji aha dị n’otu ọnụọgụ nke nwere nghọta mkpokọta, ya bụ, “mkpụrụ Ebreham.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἑβραῖοί
  choice: ndị Hibru / onye Hibru
  rationale: Okwu a bụ aha e ji akọwa ndị Hibru n'ihe gbasara agbụrụ na omenala okpukpe ha. E debere ya iche n’aha ndị ọzọ Pọl kpọrọ, ma gbanwee ọtụtụ na otu dịka usoro asụsụ Igbo chọrọ.
- source_word: κἀγώ
  choice: Mụ onwe m bụkwa
  rationale: Nke a na-egosipụta ma καί (‘kwa’) ma ἐγώ e mesiri ike (‘mụ onwe m’), na-edobekwa nzaghachi Pọl dị mkpirikpi ma sie ike ugboro atọ.
- source_word: Ἰσραηλῖται
  choice: ndị Izrel / onye Izrel
  rationale: Nhọrọ a na-egosi isonye n’Izrel ma na-edobe ọdịiche dị n’etiti ‘ndị Hibru,’ ‘ndị Izrel,’ na ‘mkpụrụ Ebreham.’
- source_word: σπέρμα Ἀβραάμ
  choice: mkpụrụ Ebreham
  rationale: ‘Mkpụrụ Ebreham’ na-edobe ihe atụ na ụdị mkpokọta nke σπέρμα n’otu ọnụọgụ. Ọ bụkwa okwu Akwụkwọ Nsọ ndị na-agụ Igbo maara, n’agbanyeghị na ‘ụmụ ụmụ Ebreham’ ga-abụ nkọwa dị mfe karị.
- source_word: εἰσιν
  choice: Ha bụ / bụkwa
  rationale: E ji ‘Ha bụ...?’ kee ajụjụ nkwupụta dịka Grik si mee ya, ebe ‘bụkwa’ na-eme ka nzaghachi ya bụrụ nke e ji atụnyere ndị ọzọ n’ụzọ Igbo dị mma.
theological_decisions:
- issue: Ọdịiche dị n’etiti aha atọ gbasara njirimara ndị Juu
  choice: 'Idobe aha atọ dị iche: ‘ndị Hibru,’ ‘ndị Izrel,’ na ‘mkpụrụ Ebreham.’'
  alternative: Ịchịkọta ha niile n’okpuru otu aha dịka ‘ndị Juu’ ma ọ bụ ‘ụmụ ụmụ Ebreham.’
  rationale: Usoro okwu Pọl dabere n’ịkpọkọta ihe atọ metụtara ibe ha ma ha abụghị otu ihe kpọmkwem. Idobe ha iche na-echekwa ike na nghọta nke arụmụka ahụ.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, dị ugbu a ma dị ùgwù. E ji ‘Mụ onwe m bụkwa’ kwughachi ugboro atọ iji gosipụta nkwusi ike nke κἀγώ; e debere akara ajụjụ nkwupụta nke amaokwu Grik.
