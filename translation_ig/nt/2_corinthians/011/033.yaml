language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ διὰ θυρίδος ἐν σαργάνῃ ἐχαλάσθην διὰ τοῦ τείχους καὶ ἐξέφυγον τὰς χεῖρας αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/033.yaml
  text: and through a window in a basket I was lowered through the wall and escaped his hands[a].
translation:
  language: ig
  text: E si kwa na windo dị ná mgbidi ahụ wedata m n’ime nkata, m wee gbanahụ aka ya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “E si kwa n’oghere dị ná mgbidi ahụ wedata m n’ime nkata e ji eriri kpaa, m wee gbanahụ aka ya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: θυρίδος
  choice: windo
  rationale: Okwu a pụtara windo ma ọ bụ obere oghere; “windo” bụ okwu doro anya ma bụrụkwa nke ndị Igbo nke oge a na-aghọta ngwa ngwa.
- source_word: σαργάνῃ
  choice: nkata
  rationale: Ọ na-ezo aka n’ihe e ji eriri ma ọ bụ ihe yiri ya kpaa; “nkata” na-enye ihe okwu ahụ pụtara n’ụzọ eke, ebe nkọwa ala peeji na-echekwa echiche nke nkata e ji eriri kpaa.
- source_word: ἐχαλάσθην
  choice: wedata m
  rationale: Ụdị ngwaa a na-egosi na ndị ọzọ ji ihe wedata Pọl; “wedata m” na-egosipụta nke a n’Igbo eke.
- source_word: διὰ τοῦ τείχους
  choice: dị ná mgbidi ahụ
  rationale: N’usoro ahịrịokwu a, windo ahụ bụ oghere dị n’ime mgbidi nke e si na ya wedata ya. Nsụgharị a na-ezere echiche na e mere ya ka ọ gafee ihe siri ike nke mgbidi n’onwe ya, ma na-echekwa njikọ ya na mgbidi ahụ.
- source_word: ἐξέφυγον τὰς χεῖρας αὐτοῦ
  choice: m wee gbanahụ aka ya
  rationale: Nke a na-echekwa ihe atụ doro anya nke Grik, bụ́ ịgbanahụ njide ma ọ bụ ike onye ahụ, ma bụrụkwa okwu Igbo a na-aghọta.
theological_decisions: []
translation_notes:
  register: 'Ejiri Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. Ahịrịokwu ahụ na-edobe usoro ihe mere n’ụzọ eke: e si na windo dị ná mgbidi wedata Pọl n’ime nkata, o wee gbanahụ onye na-achọ ijide ya.'
