    issue: εἰ δὲ μή γε ka atụgharịrị “Ma ọ bụrụ na unu agaghị eme otú ahụ.”
    rationale: Nke a na-eme ka “ọ bụghị” bụrụ ihe ndị na-agụ ga-eme, kama ọ na-ezo n’arịrịọ Pọl bu ụzọ n’ụzọ na-adịghị akọwapụta ya. “Ma ọ bụrụ na ọ bụghị otu a” na-edobe amaghị-ama nke isi Grik.
  - severity: low
    issue: Nkọwa ala peeji na-ekwu na ἄφρων nwere ike ịkọwa “omume ya.”
    rationale: N’ahịrịokwu a, ἄφρονα na-akọwa Pọl; ọdịiche kwesịrị ịbụ n’etiti iji ya dịka aha mmadụ na iji ya dịka nkọwa àgwà, ọ bụghị ịgbanwe ya ka ọ bụrụ omume “ime nzuzu.”
  - severity: low
    issue: “mụ onwe m kwa” na-agbakwunye “onwe m.”
    rationale: κἀγώ pụtara “mụ kwa / mụ onwe m kwa” n’ọnọdụ ụfọdụ, ma “onwe m” ebe a nwere ike iweta nkwusi ike karịrị nke dị n’isi okwu.
