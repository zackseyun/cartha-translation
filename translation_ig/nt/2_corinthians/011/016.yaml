  text: Πάλιν λέγω, μή τίς με δόξῃ ἄφρονα εἶναι— εἰ δὲ μή γε, κἂν ὡς ἄφρονα δέξασθέ με, ἵνα κἀγὼ μικρόν τι καυχήσωμαι·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/016.yaml
  text: Again I say[a], let no one think me to be foolish—but if not, then receive me even as foolish, so that I too may boast a little.
translation:
  language: ig
  text: 'M na-ekwu ọzọ: Ka onye ọ bụla ghara iche na abụ m onye nzuzu[a]. Ma ọ bụrụ na ọ bụghị otu a, nabatanụ m ọbụna dịka onye nzuzu, ka mụ kwa nwee ike ịnya isi ntakịrị.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “Ka onye ọ bụla ghara iche na m bụ nzuzu ... nabatanụ m ọbụna dịka onye nzuzu.” Okwu Grik ἄφρων nwere ike ịrụ ọrụ dịka aha, “onye nzuzu,” ma ọ bụ dịka nkọwa àgwà, “nzuzu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Πάλιν λέγω
  choice: Ana m ekwu ọzọ
  rationale: Nke a na-egosi na Pọl na-ekwughachi arịrịọ ya; usoro a bụ Igbo dị ugbu a ma na-edobe present tense nke λέγω.
- source_word: μή τίς με δόξῃ ἄφρονα εἶναι
  choice: Ka onye ọ bụla ghara iche na abụ m onye nzuzu
  rationale: “Ka ... ghara” na-egosipụta mmachibido ma ọ bụ arịrịọ na-adịghị mma nke μή na subjunctive; “onye nzuzu” bụ ụzọ Igbo nkịtị si akọwa ἄφρων n’ebe a.
- source_word: εἰ δὲ μή γε
  choice: Ma ọ bụrụ na unu agaghị eme otú ahụ
  rationale: 'Nkebi a na-ezo aka n’arịrịọ gara aga: ọ bụrụ na ha agaghị ekweta na Pọl abụghị onye nzuzu. Ịkọwa ihe “ọ bụghị” na-ezo aka na ya na-eme ka Igbo doo anya n’enweghị ịgbanwe ntụgharị okwu ahụ.'
- source_word: κἂν ὡς ἄφρονα δέξασθέ με
  choice: nabatanụ m, ọ bụrụgodị na ọ bụ dị ka onye nzuzu
  rationale: “Nabatanụ m” na-edobe iwu nke δέξασθέ με, ebe “ọ bụrụgodị” na-ebute echiche nkwenye megidere atụmanya dị na κἂν.
- source_word: ἵνα κἀγὼ μικρόν τι καυχήσωμαι
  choice: ka mụ onwe m kwa wee nwee ike ịnya isi ntakịrị
  rationale: “Ka ... wee” na-egosipụta nzube nke ἵνα; “mụ onwe m kwa” na-edobe nkwusi ike nke κἀγώ, “ịnya isi” na-edobekwa okwu ịnya isi nke Pọl ji n’ụzọ ịkwa emo.
theological_decisions:
- issue: Okwu Pọl ji kpọọ onwe ya onye nzuzu na okwu ịnya isi ya
  choice: E debere “onye nzuzu” na “ịnya isi” n’ụzọ doro anya
  alternative: Ịkọwa ya dị nro dịka “onye na-ekwu okwu n’echeghị echiche” ma ọ bụ “ikwu ntakịrị banyere onwe m”
  rationale: 'Akụkụ a ji ịkwa emo na esemokwu dị n’okwu Pọl arụ ọrụ: ọ chọghị ka e were ya dịka onye nzuzu, ma ọ na-anabata ọnọdụ ahụ nwa oge ka o wee “nya isi.” Ịdị nro ga-ebelata esemokwu ahụ.'
translation_notes:
  register: Asụsụ ahụ bụ Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E ji “unu” gosipụta na iwu δέξασθέ metụtara ọtụtụ ndị, ma e debere “onye ọ bụla” maka τίς nke na-ekwu banyere onye ọ bụla n’otu n’otu.
