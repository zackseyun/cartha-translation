  verdict: revise
  source_fidelity: 'Isi ntụgharị okwu ahụ na-ejide arịrịọ na ịkwa-emume Pọl nke ọma. Otú ọ dị, “Ma ọ bụrụ na unu agaghị eme otú ahụ” na-atụgharị εἰ δὲ μή γε ka omume ndị na-agụ ya ga-eme, ebe okwu Grik ahụ na-ezo n’enweghị nkọwa zuru ezu n’arịrịọ bu ụzọ: ọ bụrụ na ha agaghị ekwenye na arịrịọ ahụ. “Ma ọ bụrụ na ọ bụghị otu a” na-edobe njikọ ahụ na amaghị-ama ya nke ọma.'
  naturalness: “M na-ekwu ọzọ” na “nabatanu m ọbụna dịka onye nzuzu” bụ Standard Igbo dị nro ma doo anya. E wepụrụ “ọ bụrụgodị na ọ bụ dị ka,” nke na-adịghị aga nke ọma n’usoro ahịrịokwu a, nakwa “onwe m,” nke na-agbakwunye nkwusi ike na-adịghị n’κἀγώ.
  terminology: “Onye nzuzu” na “ịnya isi” kwesịrị ekwesị maka ἄφρων na καυχάομαι n’ebe a. A dezigharịrị nkọwa ala peeji ka ọ ghara ikwu na ἄφρων pụtara kpọmkwem omume nzuzu; okwu ahụ nwere ike ịbụ nkọwa mmadụ (“onye nzuzu”) ma ọ bụ nkọwa àgwà ya (“nzuzu”).
  issues:
