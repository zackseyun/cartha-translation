source:
  edition: SBLGNT
  text: ἐν Δαμασκῷ ὁ ἐθνάρχης Ἁρέτα τοῦ βασιλέως ἐφρούρει τὴν ⸂πόλιν Δαμασκηνῶν⸃ πιάσαι ⸀με,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/032.yaml
  text: In Damascus[a], the ethnarch of King Aretas was guarding the city of the Damascenes in order to seize me,
translation:
  language: ig
  text: Na Damaskọs,[a] onye na-achị ndị mmadụ nke Eze Aretas nọ na-eche obodo nke ndị Damaskọs nche ka o wee jide m,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “obodo Damaskọs.” N'ụzọ nkịtị, Grik sịrị, “obodo nke ndị Damaskọs.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν Δαμασκῷ
  choice: Na Damaskọs
  rationale: Nganiihu ἐν ya na dative na-egosi ebe ihe mere; “Na Damaskọs” bụ nsụgharị Igbo doro anya ma kwekọọ n'usoro okwu ahụ.
- source_word: ἐθνάρχης
  choice: onye na-achị ndị mmadụ
  rationale: Okwu ahụ pụtara onye ọchịchị na-elekọta otu ndị ma ọ bụ mpaghara. Nkọwa a bụ Igbo nkịtị ma na-echekwa echiche nke aha ọkwa ahụ karịa iji okwu mgbazinye a na-amaghị ama.
- source_word: Ἁρέτα τοῦ βασιλέως
  choice: n'okpuru Eze Aretas
  rationale: Genitive ahụ na-egosi na onye ọchịchị ahụ nọ n'okpuru ọchịchị ma ọ bụ n'ozi Eze Aretas; nsụgharị a na-eme ka njikọ ahụ doo anya n'Igbo n'enweghị ịkọwa ya gabiga ókè.
- source_word: ἐφρούρει
  choice: nọ na-eche ... nche
  rationale: Imperfect ahụ na-egosi omume na-aga n'ihu n'oge gara aga; “nọ na-eche ... nche” na-ebupụta ma akụkụ oge ahụ ma echiche nke ile obodo ahụ anya.
- source_word: τὴν πόλιν Δαμασκηνῶν
  choice: obodo ndị Damaskọs
  rationale: Nke a na-echekwa usoro Grik nke pụtara n'ụzọ nkịtị “obodo nke ndị Damaskọs,” kama imegharị ya ozugbo ka ọ bụrụ naanị “obodo Damaskọs.”
- source_word: πιάσαι με
  choice: ka o wee jide m
  rationale: Infinitive a na-egosi nzube e ji na-eche obodo ahụ nche. “Jide m” na-echekwa obosara nke πιάζω ma zere ịkọwa ya kpọmkwem dị ka njide iwu.
theological_decisions: []
translation_notes:
  register: Ejiri Standard Igbo dị ugbu a, nke dị ùgwù ma dị mfe nghọta. E ji nkọwa Igbo “onye na-achị ndị mmadụ” dochie aha ọkwa Grik a na-adịghị ahụkarị, ma e debere ọdịiche dị n'etiti “Damaskọs” na “obodo ndị Damaskọs” n'ihe odide na nkọwa ala peeji.
