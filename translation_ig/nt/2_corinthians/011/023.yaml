- from: 'Ndị na-ejere Mesaịa ozi ka ha bụ?[a] Ana m ekwu okwu dị ka onye ara: mụ onwe m karịrị ha—arụwo m ọrụ ike karịa ha, anọwo m n’ụlọ mkpọrọ ugboro karịa ha, a pịawo m ihe gabiga ókè, ezutewokwa m ọnwụ ọtụtụ mgbe.[b]'
  to: 'Ndị na-ejere Mesaịa ozi ka ha bụ?[a] Ana m ekwu okwu dị ka onye ara: mụ onwe m karịrị ha—arụwo m ọrụ ike karịa ha, anọwo m n’ụlọ mkpọrọ ugboro karịa ha, a kụwo m ihe nke ukwuu, anọwokwa m n’ọnwụ ọtụtụ mgbe.[b]'
