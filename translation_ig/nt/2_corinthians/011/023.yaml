language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: διάκονοι Χριστοῦ εἰσιν; παραφρονῶν λαλῶ, ὑπὲρ ἐγώ· ἐν κόποις περισσοτέρως, ἐν ⸂φυλακαῖς περισσοτέρως, ἐν πληγαῖς ὑπερβαλλόντως⸃, ἐν θανάτοις πολλάκις·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/023.yaml
  text: 'Are they servants of Messiah? I am speaking as if insane: I am more so—in labors more abundantly[a], in imprisonments more abundantly, in beatings beyond measure[b], in deaths often.'
translation:
  language: ig
  text: 'Ndị na-ejere Mesaịa ozi ka ha bụ?[a] Ana m ekwu okwu dị ka onye ara: mụ onwe m karịrị ha—arụwo m ọrụ ike karịa ha, anọwo m n’ụlọ mkpọrọ ugboro karịa ha, a kụwo m ihe nke ukwuu, anọwokwa m n’ọnwụ ọtụtụ mgbe.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A pụkwara ịsụ ya, “Kraịst”: “Ndị na-ejere Kraịst ozi ka ha bụ?”'
    reason: alternative_rendering
  - marker: b
    text: N’asụsụ Grik, ọ bụ “n’ọnwụ ọtụtụ mgbe”; o yikarịrị ka ọ na-ekwu banyere ọtụtụ oge ọ fọrọ obere ka ọ nwụọ ma ọ bụ mgbe ọ nọ n’ihe ize ndụ ọnwụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: διάκονοι
  choice: ndị na-ejere ... ozi
  rationale: Nkebiokwu a na-egosi ndị na-arụ ọrụ dịka ndị ohu ma ọ bụ ndị ozi, n’etinyeghị ya n’ọkwa ụka pụrụ iche.
- source_word: Χριστοῦ
  choice: Mesaịa
  rationale: N’ebe a Χριστός na-arụ ọrụ dịka utu aha; “Mesaịa” na-eme ka ihe utu aha ahụ pụtara doo onye Igbo nke oge a anya.
- source_word: παραφρονῶν λαλῶ
  choice: Ana m ekwu okwu dị ka onye ara
  rationale: Nke a na-echekwa nkwupụta Pọl na okwu ịnya isi ya na-ada ka okwu onye uche na-adịghị mma, n’enweghị ịsụgharị ya ka ọ bụrụ na ọ na-ekwu na ara gbara ya n’ezie.
- source_word: ὑπὲρ ἐγώ
  choice: mụ onwe m karịrị ha
  rationale: Ọ na-eme ka ntụnyere ahụ e kwuru nkenke n’asụsụ Grik doo anya, ma ọ naghị agbakwụnye ihe e ji atụnyere ha karịa ihe gbara amaokwu ahụ gburugburu.
- source_word: ἐν κόποις περισσοτέρως
  choice: arụwo m ọrụ ike karịa ha
  rationale: Ọ na-egosi ọrụ na-adọgbu ahụ na ntụnyere περισσοτέρως n’ụzọ Igbo na-aga nke ọma.
- source_word: ἐν φυλακαῖς περισσοτέρως
  choice: anọwo m n’ụlọ mkpọrọ ugboro karịa ha
  rationale: Ọtụtụ φυλακαῖς na-ezo aka n’ọtụtụ oge a tụrụ ya mkpọrọ, ọ bụghị naanị n’ebe mkpọrọ dị.
- source_word: ἐν πληγαῖς ὑπερβαλλόντως
  choice: a pịawo m ihe gabiga ókè
  rationale: “Pịa ... ihe” na-ekwupụta iti mmadụ ihe, ebe “gabiga ókè” na-echekwa ike ὑπερβαλλόντως n’enweghị ime ka ọ bụrụ naanị ụtarị iwu.
- source_word: ἐν θανάτοις πολλάκις
  choice: ezutewokwa m ọnwụ ọtụtụ mgbe
  rationale: Nke a na-echekwa ọtụtụ ọnwụ nke okwu Grik ahụ na ihe oyiyi ya siri ike, ma na-eme ka ahịrịokwu ahụ bụrụ Igbo a pụrụ ịghọta.
theological_decisions:
- issue: Otu e si sụgharị Χριστοῦ
  choice: Mesaịa
  alternative: Kraịst
  rationale: Okwu ahụ bụ utu aha n’ebe a, ya mere “Mesaịa” na-egosipụta ọrụ ya dịka utu aha; e debere “Kraịst” n’ala peeji dịka nsụgharị omenala.
- issue: Ihe ἐν θανάτοις πολλάκις pụtara
  choice: ezutewokwa m ọnwụ ọtụtụ mgbe
  alternative: anọwo m n’ihe ize ndụ ọnwụ ọtụtụ mgbe
  rationale: Isi ederede na-echekwa okwu dị ịtụnanya bụ “ọnwụ” n’ụdị ọtụtụ, kama idozi ya kpamkpam ka ọ bụrụ naanị ihe ize ndụ; nkọwa ala peeji na-enye nghọta o yikarịrị ka ọ bụ ya.
translation_notes:
  register: Ejiri Igbo Izugbe nke oge a, nke dị ugwu ma dị mfe nghọta. E debere ụda ajụjụ na ịnya isi Pọl nke o ji aka ya kpọọ okwu ara, tinyere usoro nhụjuanya ndị ahụ na ntụnyere ya na ndị ọzọ.
