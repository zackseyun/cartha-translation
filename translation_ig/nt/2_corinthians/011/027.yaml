source:
  edition: SBLGNT
  text: ⸀κόπῳ καὶ μόχθῳ, ἐν ἀγρυπνίαις πολλάκις, ἐν λιμῷ καὶ δίψει, ἐν νηστείαις πολλάκις, ἐν ψύχει καὶ γυμνότητι·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/027.yaml
  text: in labor and hardship[a], in many sleepless nights, in hunger and thirst, in frequent fastings[b], in cold and exposure.
translation:
  language: ig
  text: n’ọrụ ike na ahụhụ, n’ịmụrụ anya ọtụtụ ugboro, n’agụụ na akpịrị ịkpọ nkụ, n’ibu ọnụ ọtụtụ ugboro[a], n’oyi na enweghị uwe zuru ezu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ịnọ n’enweghị nri ọtụtụ ugboro.” Okwu Grik ahụ pụtara ibu ọnụ ugboro ugboro; amaokwu a ekwughị ma ọ bụ ibu ọnụ mmadụ ji aka ya kpebie ka ọ bụ nke ọnọdụ manyere ya.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ịgba ọtọ.” N’ebe a, ọ pụrụ ịpụta enweghị uwe zuru ezu, nke na-eme ka mmadụ nọrọ n’oyi na ọnọdụ ihu igwe.
    reason: lexical_alternative
lexical_decisions:
- source_word: κόπῳ
  choice: ọrụ ike
  rationale: Ọ na-egosi ọrụ na-agwụ ike; ‘ọrụ ike’ bụ okwu Igbo doro anya nke na-echekwa echiche nke ịdọgbu onwe n’ọrụ.
- source_word: μόχθῳ
  choice: ahụhụ
  rationale: Ọ na-agbakwụnye echiche nke nhụjuanya na ihe isi ike so ọrụ ahụ; nke a na-echekwa njikọ okwu abụọ ahụ n’etinyeghị ha n’otu ihe.
- source_word: ἐν ἀγρυπνίαις πολλάκις
  choice: n’ịmụ anya ọtụtụ ugboro n’abalị
  rationale: ἀγρυπνία pụtara ịnọ na-amụghị ụra ma ọ bụ ịmụ anya; nsụgharị a bụ Igbo nkịtị ma na-egosi na ọ mere ugboro ugboro.
- source_word: ἐν λιμῷ καὶ δίψει
  choice: n’agụụ na akpịrị ịkpọ nkụ
  rationale: Ọ na-echekwa ọnọdụ abụọ Pọl diri, ya bụ enweghị nri na enweghị ihe ọṅụṅụ.
- source_word: ἐν νηστείαις πολλάκις
  choice: n’ibu ọnụ ọtụtụ ugboro
  rationale: νηστεία pụtara ibu ọnụ. E debeghị ma ibu ọnụ ndị a bụ nke afọ ofufo ma ọ bụ nke ọnọdụ manyere ya, ya mere nsụgharị ahụ anaghị ekpebi nke ahụ.
- source_word: ἐν ψύχει
  choice: n’oyi
  rationale: ψῦχος bụ ọnọdụ oyi mmadụ na-ata ahụhụ na ya; ‘n’oyi’ dị mkpụmkpụ ma kwekọọ na usoro ndepụta ahụ.
- source_word: γυμνότητι
  choice: enweghị uwe zuru ezu
  rationale: N’ọnọdụ a, okwu ahụ nwere ike ịpụta ịgba ọtọ ma ọ bụ enweghị uwe ga-ezuru mmadụ ichebe onwe ya. Isi okwu a na-egosi nke ikpeazụ n’Igbo doro anya, ebe e debere nhọrọ nke mbụ n’ala peeji.
theological_decisions:
- issue: Ihe νηστείαις pụtara n’ime ndepụta ahụhụ Pọl
  choice: ibu ọnụ
  alternative: ịnọ n’enweghị nri n’ihi ọnọdụ siri ike
  rationale: Ebe λιμῷ kwuburu agụụ, ‘ibu ọnụ’ na-echekwa ọdịiche okwu Grik abụọ ahụ. Ma ebe amaokwu ahụ ekwughị ma ọ bụ afọ ofufo ka ọ bụ ọnọdụ manyere ya, e debere nghọtahie ahụ n’ala peeji.
- issue: Ihe γυμνότητι pụtara
  choice: enweghị uwe zuru ezu
  alternative: ịgba ọtọ
  rationale: N’ime ndepụta ahụhụ a, okwu ahụ nwere ike izo aka n’enweghị uwe kwesịrị ekwesị na ịnọ n’ihu ajọ ihu igwe. Nhọrọ a na-agụ nke ọma n’Igbo ma ala peeji na-echekwa ihe ọzọ okwu ahụ nwere ike ịpụta.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E chekwara usoro ndepụta Grik na ugboro ugboro nke ‘n’...’; e jighị okwu ụka pụrụ iche kọwaa ihe amaokwu ahụ hapụrụ ghe oghe.
