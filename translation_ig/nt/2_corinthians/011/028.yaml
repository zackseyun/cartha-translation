  yaml_path: translation/nt/2_corinthians/011/028.yaml
  text: 'Apart from such external things[c][b][a], there is the daily pressure on me: concern for all the churches.'
translation:
  language: ig
  text: 'Ewezuga ihe ndị ọzọ[a], nrụgide na-abịakwasị m kwa ụbọchị[b]: nchegbu maka ọgbakọ niile[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “Ewezuga ihe ndị dị n'èzí,” ma ọ bụ, “Ewezuga ihe ndị a na-ekwughị.”
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsị, “ibu m na-enwe kwa ụbọchị,” ma ọ bụ, “nrụgide m kwa ụbọchị.”
    reason: lexical_alternative
  - marker: c
    text: A pụkwara ịsị, “nlekọta maka ọgbakọ niile,” ma ọ bụ, “nchekasị maka ọgbakọ niile.”
    reason: lexical_alternative
lexical_decisions:
- source_word: χωρὶς τῶν παρεκτὸς
  choice: E wezụga ihe ndị ọzọ a
  rationale: Nkebiokwu a na-egosi ihe ndị ọzọ dị iche na ahụhụ ndị Pọl ka depụtara, ma ọ pụkwara izo aka n'ihe ndị ọ na-ekwughị. Nsụgharị a na-ejikọta ya n'ụzọ ebumpụta ụwa na ihe ndị bu ụzọ.
- source_word: ἐπίστασίς μοι
  choice: ihe na-anyịgbu m
  rationale: ἐπίστασις nwere ike ịpụta nrụgide ma ọ bụ ihe na-abịakwasị mmadụ. N'ebe a, ọ na-arụ ọrụ dịka ibu dị n'obi Pọl, ọ bụghị ìgwè mmadụ na-akwagide ya n'ụzọ nkịtị.
- source_word: ἡ καθ’ ἡμέραν
  choice: kwa ụbọchị
  rationale: Nke a na-egosi na nrụgide ahụ na-abịara ya ụbọchị niile ma ọ bụ ugboro ugboro kwa ụbọchị.
- source_word: ἡ μέριμνα
  choice: nchegbu m
  rationale: “Nchegbu” na-eburu ibu mmetụta uche na nlekọta Pọl nwere maka ọgbakọ dị iche iche, n'enweghị ikpebi na ọ bụ nchegbu mmehie.
- source_word: πασῶν τῶν ἐκκλησιῶν
  choice: maka ọgbakọ niile
  rationale: N'akwụkwọ Pọl, ἐκκλησίαι bụ ọgbakọ ndị kwere ekwe. “Ọgbakọ niile” bụ okwu Igbo doro anya ma dịkwa mfe nghọta.
theological_decisions:
- issue: Ụdị ibu Pọl na μέριμνα
  choice: nchegbu m maka ọgbakọ niile
  alternative: nlekọta m maka ọgbakọ niile
  rationale: “Nchegbu” na-echekwa ịdị arọ nke mmetụta na ọrụ nlekọta Pọl, ma ọ naghị ekpebi na mmetụta ahụ bụ mmehie; “nlekọta” naanị ya nwere ike ime ka ibu ahụ daa mba.
translation_notes:
  register: Ejiri Standard Igbo dị ugbu a, nke dị ùgwù ma dị mfe nghọta. E ji “ọgbakọ” mee ἐκκλησία, ma debe nkebiokwu ahụ dịka otu ahịrịokwu na-egosi na nrụgide Pọl kwa ụbọchị bụ nchegbu ya maka ọgbakọ niile.
