revisions:
- from: E wezụga ihe ndị ọzọ a[a], ihe na-anyịgbu m kwa ụbọchị[b] bụ nchegbu m maka ọgbakọ niile[c].
  to: 'Ewezuga ihe ndị ọzọ[a], nrụgide na-abịakwasị m kwa ụbọchị[b]: nchegbu maka ọgbakọ niile[c].'
  rationale: The revision removes an unwarranted demonstrative, uses idiomatic Standard Igbo spelling and syntax, and more directly renders ἐπίστασις as pressure coming upon Paul. The colon presents “nchegbu maka ọgbakọ niile” as the explanatory apposition to the daily pressure, as in the Greek. Footnote anchors remain in source order and each alternative corresponds to its anchored expression.
