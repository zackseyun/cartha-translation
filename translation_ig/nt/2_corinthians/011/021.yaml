id: 2CO.11.21
reference: 2 Corinthians 11:21
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: κατὰ ἀτιμίαν λέγω, ὡς ὅτι ἡμεῖς ⸀ἠσθενήκαμεν· ἐν ᾧ δ’ ἄν τις τολμᾷ, ἐν ἀφροσύνῃ λέγω, τολμῶ κἀγώ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/021.yaml
  text: I say this to our shame[a], as though we had been weak[d][c][b]. Yet in whatever anyone dares to boast—I am speaking foolishly—I also dare.
translation:
  language: ig
  text: Ọ bụ n’ihere anyị ka m na-ekwu nke a, dị ka a ga-asị na anyị adịghị ike.[a][b] Ma n’ihe ọ bụla onye ọ bụla na-enwe obi ike,[c] n’ụzọ nzuzu ka m na-ekwu,[d] mụ kwa na-enwe obi ike.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Ana m ekwu nke a n’ụzọ nleda anya,” ma ọ bụ, “Ana m ekwu nke a dị ka ihe ihere.” Akpaalaokwu Grik a nwere ike ịpụta ihe karịrị otu ụzọ.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “dị ka a ga-asị na anyị bụ ndị na-adịghị ike.” Pọl na-ekwu nke a n’ụzọ ịkwa emo n’ime okwu ‘nzuzu’ ya.
    reason: lexical_alternative
  - marker: c
    text: N’ụzọ nkịtị, “n’ihe ọ bụla onye ọ bụla na-enwe obi ike.” Ọnọdụ gbara okwu a gburugburu na-egosi na ihe e bu n’obi bụ inwe obi ike ịnya isi.
    reason: implicit_object
  - marker: d
    text: Ma ọ bụ, “ana m ekwu dị ka onye nzuzu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: κατὰ ἀτιμίαν
  choice: dị ka ihe ihere nye anyị
  rationale: Nkebiokwu Grik a siri ike ma bụrụ akpaalaokwu. Nhọrọ a na-egosi ihere ma ọ bụ nleda anya e jikọtara na Pọl na ndị ya, ma na-anọgide n’ụzọ Igbo dị mfe nghọta.
- source_word: λέγω
  choice: Ana m ekwu
  rationale: Oge ugbu a dabara n’okwu Pọl ji akwụsịtụ arụmụka ya kọwaa otú o si ekwu.
- source_word: ὡς ὅτι
  choice: dị ka a ga-asị na
  rationale: Nke a na-echekwa echiche ntụnyere na nkwenye Pọl kwetara n’ụzọ ịkwa emo, na-ekwughị na adịghị ike ahụ bụ eziokwu doro anya.
- source_word: ἠσθενήκαμεν
  choice: anyị adịghị ike
  rationale: N’ebe a, okwu ahụ na-ekwu maka enweghị ike, nkwuwa okwu, ma ọ bụ ugwu n’asọmpi okwu, ọ bụghị ọrịa ahụ. Igbo a bụ nke eke ma kwe ka ọnọdụ gbara ya gburugburu gosipụta oge na ụda ịkwa emo.
- source_word: ἐν ᾧ
  choice: n’ihe ọ bụla
  rationale: Ọ na-egosi akụkụ ma ọ bụ ihe onye ọzọ ji nwee nkwuwa okwu.
- source_word: τολμᾷ
  choice: nwere obi ike ime
  rationale: Okwu Grik pụtara inwe obi ike ma ọ bụ ịnwa anwa. E tinyeghị ‘ịnya isi’ n’ahụ amaokwu ahụ ka e wee debe ihe okwu Grik hapụrụ n’amaghị kpọmkwem, ebe ọnọdụ gbara ya gburugburu na-egosi na ọ bụ ịnya isi ka a na-ekwu maka ya.
- source_word: ἐν ἀφροσύνῃ λέγω
  choice: ana m ekwu dị ka onye nzuzu
  rationale: Nke a na-egosipụta nkọwa Pọl banyere okwu nke ya n’ụzọ Igbo doro anya, ma chekwaa njikọ ya na ‘okwu nzuzu’ dị n’akụkụ a.
- source_word: τολμῶ κἀγώ
  choice: mụ onwe m nwekwara obi ike ime ya
  rationale: Nhọrọ a na-echekwa nkwughachi nke τολμάω ma mee ka njikọ ya na ihe onye ọzọ nwere obi ike ime doo anya n’Igbo.
theological_decisions:
- issue: Ịkwa emo Pọl banyere ‘adịghị ike’ ya
  choice: 'E sụgharịrị ya dị ka nkwenye e kwuru n’ụzọ ịkwa emo: ‘dị ka a ga-asị na anyị adịghị ike.’'
  alternative: Ịsụgharị ya dị ka nkwupụta nkịtị na Pọl na ndị ya bụ ndị adịghị ike.
  rationale: Ọnọdụ ‘okwu onye nzuzu’ Pọl na ọdịiche dị n’etiti ya na ndị mmegide na-anya isi na-egosi na nke a bụ nkwenye e kwuru n’ụzọ ịkwa emo. Nsụgharị ahụ echekwaghị esemokwu ahụ n’enweghị itinye ozizi banyere izi ezi nke ịbụ onyeozi n’ime ederede.
translation_notes:
  register: Standard Igbo dị ugbu a, nke dị ùgwù ma dị mfe nghọta. E ji ‘nwere obi ike ime’ chekwaa nkwughachi na ntakịrị mgbagwoju anya nke τολμάω, ebe nkọwa ala peeji na-akọwa na ọnọdụ okwu ahụ bụ ịnya isi. Ihe nrịba ama ala peeji [a]–[d] niile dị n’ederede.
