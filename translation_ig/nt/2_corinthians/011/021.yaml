revisions:
- from: Ana m ekwu nke a dị ka ihe ihere nye anyị,[a] dị ka a ga-asị na anyị adịghị ike.[b] Ma n’ihe ọ bụla onye ọ bụla nwere obi ike ime,[c] ana m ekwu dị ka onye nzuzu,[d] mụ onwe m nwekwara obi ike ime ya.
  to: Ọ bụ n’ihere anyị ka m na-ekwu nke a, dị ka a ga-asị na anyị adịghị ike.[a][b] Ma n’ihe ọ bụla onye ọ bụla na-enwe obi ike,[c] n’ụzọ nzuzu ka m na-ekwu,[d] mụ kwa na-enwe obi ike.
  rationale: The revision retains the source’s ambiguity and ironic force. It uses idiomatic Standard Igbo for the difficult opening idiom, preserves the twofold repetition of τολμάω without forcing an object into the text, and renders Paul’s parenthetical ‘in foolishness I speak’ directly. All original footnote anchors are retained and their notes remain aligned with the revised wording.
