id: 2CO.11.25
reference: 2 Corinthians 11:25
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: τρὶς ἐραβδίσθην, ἅπαξ ἐλιθάσθην, τρὶς ἐναυάγησα, νυχθήμερον ἐν τῷ βυθῷ πεποίηκα·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/025.yaml
  text: Three times I was beaten with rods[a], once I was stoned, three times I was shipwrecked; I have spent a night and a day in the deep.
translation:
  language: ig
  text: Ugboro atọ ka e ji mkpara tie m ihe, otu ugboro ka e ji nkume tụgbuo m, ugboro atọ ka ụgbọ mmiri m nọ na ya kpuru; anọọla m otu abalị na otu ehihie n’ime mmiri miri emi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “n’oké osimiri.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τρὶς
  choice: ugboro atọ
  rationale: Nke a bụ ụzọ Igbo doro anya ma bụrụkwa nke a na-ejikarị egosi na ihe mere ugboro atọ; e jikwa ya mee ihe n’ebe abụọ okwu ahụ pụtara n’amaokwu a.
- source_word: ἐραβδίσθην
  choice: e ji mkpara tie m ihe
  rationale: Ọ na-egosi iti mmadụ ihe site n’iji mkpara; ntụgharị a kọwara ngwa e ji tie ya kama iji naanị okwu sara mbara nke pụtara iti ihe.
- source_word: ἅπαξ
  choice: otu ugboro
  rationale: Ọ bụ okwu Igbo nkịtị na nke doro anya maka ihe mere naanị otu mgbe.
- source_word: ἐλιθάσθην
  choice: e ji nkume tụgbuo m
  rationale: Ọ na-egosi mwakpo e ji nkume mee mmadụ, ma na-edobe ụdị nnara-omume dị n’isi mmalite.
- source_word: ἐναυάγησα
  choice: ụgbọ mmiri m nọ na ya kpuru
  rationale: Nke a na-egosi n’Igbo ebumpụta ụwa na Pọl hụrụ mbibi ụgbọ mmiri n’onwe ya, na-enweghị ime ka okwu ahụ bụrụ naanị nsogbu njem n’ozuzu.
- source_word: νυχθήμερον
  choice: otu abalị na otu ehihie
  rationale: Ọ na-echekwa usoro abalị na ehihie dị n’okwu Grik ma zere ime ya ka ọ bụrụ kpọmkwem awa iri abụọ na anọ.
- source_word: ἐν τῷ βυθῷ
  choice: n’ime mmiri miri emi
  rationale: βυθός na-ezo aka n’ebe mmiri dị omimi ma ọ bụ n’oké osimiri; nhọrọ a na-edobe ihe oyiyi nke omimi, ebe e nyere nhọrọ ọzọ n’okpuru peeji.
- source_word: πεποίηκα
  choice: anọọla m
  rationale: Mgbe ποιέω sochiri okwu oge, ọ pụrụ ịpụta ịnọ ma ọ bụ iwepụta oge; ụdị Igbo a dị ebumpụta ụwa ma na-egosikwa nleghachi anya nke perfect tense.
theological_decisions: []
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A haziri ahịrịokwu ahụ ka ọ debe ndepụta ahụ siri ike nke Grik, tinyere ọdịiche dị n’etiti ugboro atọ na otu ugboro. E debeghị βυθός ka ọ bụrụ naanị otu nkọwa; isiokwu ahụ kwuru ‘mmiri miri emi,’ ebe nkọwa ala peeji nyere ‘oké osimiri’ dị ka nhọrọ.
