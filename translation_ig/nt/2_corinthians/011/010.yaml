id: 2CO.11.10
reference: 2 Corinthians 11:10
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἔστιν ἀλήθεια Χριστοῦ ἐν ἐμοὶ ὅτι ἡ καύχησις αὕτη οὐ φραγήσεται εἰς ἐμὲ ἐν τοῖς κλίμασι τῆς Ἀχαΐας.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/010.yaml
  text: As the truth of Messiah is in me[c][b][a], this boasting of mine will not be silenced in the regions of Achaia.
translation:
  language: ig
  text: 'Eziokwu Mezaịa dị n’ime m[a]: a gaghị akwụsị ịnya isi a m na-anya[b] n’ógbè ndị dị n’Akaịa.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “Dị nnọọ ka eziokwu Kraịst dị n’ime m, …”
    reason: Na-egosi ma aha omenala “Kraịst” ma ụdị ọzọ e si aghọta nkwupụta ahụ yiri iyi.
  - marker: b
    text: N’ụzọ nkịtị karị, “a gaghị emechi ịnya isi a n’ebe m nọ,” ma ọ bụ “a gaghị akwụsị ịnya isi a banyere m.” Okwu Grik a bụ akpaala okwu siri ike.
    reason: Na-edobe mgbagwoju anya dị na φραγήσεται εἰς ἐμέ kama idozi ya kpamkpam n’ahịrị isi.
lexical_decisions:
- source_word: ἀλήθεια Χριστοῦ
  choice: eziokwu Mezaịa
  rationale: Ọ na-edobe njikọ genitiv ahụ n’ụzọ dị nkenke, na-egosi eziokwu nke Mezaịa nwere ma ọ bụ nke e jikọtara ya na ya. A họọrọ “Mezaịa” n’ihi na Χριστός na-arụ ọrụ dị ka aha ọkwá n’ebe a.
- source_word: ἐν ἐμοὶ
  choice: dị n’ime m
  rationale: Nke a na-esochi okwu Grik nke ọma ma na-edobe nkwupụta Pọl siri ike n’akọwaghị ya karịa ka o kwesịrị.
- source_word: καύχησις
  choice: ịnya isi
  rationale: Nke a bụ okwu Igbo nkịtị ma doo anya maka omume ma ọ bụ ọdịnaya nke ịnya isi.
- source_word: οὐ φραγήσεται εἰς ἐμὲ
  choice: a gaghị egbochi m ịnya isi otu a
  rationale: φραγήσεται nwere echiche nke imechi ma ọ bụ igbochi. N’Igbo, ịsị na a gaghị egbochi Pọl ịnya isi na-ekwupụta akpaala okwu ahụ n’ụzọ eke, ma nkọwa ala peeji na-edobe ọdịdị ọzọ nke okwu ahụ.
- source_word: ἐν τοῖς κλίμασι τῆς Ἀχαΐας
  choice: n’ógbè ndị dị n’Akaịa
  rationale: “Ógbè ndị” na-edobe ọtụtụ nke κλίμασι, ebe “Akaịa” bụ nsụgharị ụda aha ógbè Rom ahụ.
theological_decisions:
- issue: Nsụgharị Χριστοῦ
  choice: Mezaịa
  alternative: Kraịst
  rationale: N’ebe a, okwu ahụ ka na-arụ ọrụ dị ka aha ọkwá. “Mezaịa” na-eme ka nke ahụ pụta ìhè, ebe “Kraịst” ka bụ nsụgharị omenala a na-egosi na nkọwa ala peeji.
- issue: Ụdị nkwupụta ἔστιν ἀλήθεια Χριστοῦ ἐν ἐμοὶ ὅτι
  choice: 'Eziokwu Mezaịa dị n’ime m: …'
  alternative: Dị nnọọ ka eziokwu Mezaịa dị n’ime m, …
  rationale: Akara kọlọ́n na-enye okwu ahụ ike nke nkwenye ma ọ bụ iyi, n’enweghị itinye okwu nkọwa ndị na-adịghị n’ederede Grik. Nkọwa ala peeji na-egosi ụzọ ọzọ e si aghọta njikọ ahụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. Ahịrị isi na-asụ nke ọma n’Igbo, ebe nkọwa ala peeji na-echekwa mgbagwoju anya nke usoro Grik na nhọrọ “Kraịst.”
