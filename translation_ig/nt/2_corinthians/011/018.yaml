  yaml_path: translation/nt/2_corinthians/011/018.yaml
  text: Since many boast according to the flesh[a], I too will boast.
translation:
  language: ig
  text: Ebe ọ bụ na ọtụtụ ndị na-anya isi n’ụzọ anụ ahụ[a], mụ kwa ga-anya isi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “dị ka ụkpụrụ mmadụ si dị,” ma ọ bụ, “n’ụzọ mmadụ nkịtị.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπεὶ
  choice: Ebe ọ bụ na
  rationale: Na-egosi ihe kpatara mkpebi Pọl kwuru n’ahịrịokwu nke abụọ, ma bụrụkwa okwu Igbo doro anya ma dị n’okike.
- source_word: πολλοὶ
  choice: ọtụtụ ndị
  rationale: Ọ na-egosi ọnụ ọgụgụ buru ibu n’enweghị ịgbakwunye ihe ederede ahụ na-ekwughị.
- source_word: καυχῶνται
  choice: na-anya isi
  rationale: Nke a bụ ụzọ Igbo nkịtị si ekwu ịnya isi; ọ dabara n’ụda okwu Pọl nke nwere ntakịrị ịkwa emo, ma kwekọọ na καυχήσομαι nke sochirinụ.
- source_word: κατὰ σάρκα
  choice: dị ka anụ ahụ si dị
  rationale: Ọ na-edobe okwu Pọl banyere ‘anụ ahụ’ na nghọtahie ya nwere ike inwe, kama ịkọwa ya ozugbo naanị dị ka ụkpụrụ mmadụ. Ihe odide ala peeji na-enye ụzọ okwu ndị na-akọwa ihe akpaalaokwu ahụ nwere ike ịpụta.
- source_word: σάρκα
  choice: anụ ahụ
  rationale: Ọ bụ nsụgharị kpọmkwem nke σάρξ nke na-edobe ịdị arọ okwu a nwere n’echiche okpukpe Pọl; n’ebe a, ọ bụghị nanị ahụ mmadụ nkịtị ka a na-ekwu, kama ọ pụrụ ịpụta ụkpụrụ ma ọ bụ ụzọ mmadụ si eche.
- source_word: κἀγὼ
  choice: mụ onwe m ... kwa
  rationale: ‘Mụ onwe m’ na-egosi nkwusi ike dị na ἐγώ, ebe ‘kwa’ na-egosi καί, ya bụ, na Pọl ga-emekwa ihe ndị ahụ na-eme.
- source_word: καυχήσομαι
  choice: ga-anyakwa isi
  rationale: Ọ na-edobe ọdịnihu nke ngwaa ahụ nakwa nkwughachi nke otu ngwaa ahụ dị na nkebi mbụ.
theological_decisions:
- issue: Nsụgharị σάρξ n’akpaalaokwu κατὰ σάρκα
  choice: dị ka anụ ahụ si dị
  alternative: dị ka ụkpụrụ mmadụ si dị; n’ụzọ mmadụ nkịtị
  rationale: Isi ederede na-edobe ‘anụ ahụ’ ka e wee ghara iwepụ nghọtahie na esemokwu echiche dị n’okwu Pọl. N’otu oge ahụ, ihe odide ala peeji na-egosi na n’ebe a akpaalaokwu ahụ nwere ike ịpụta ịnya isi dabere n’ụkpụrụ mmadụ ma ọ bụ n’ụzọ mmadụ nkịtị.
translation_notes:
  register: E ji Standard Igbo nke oge a, doro anya ma dị ùgwù mee ihe. A họọrọ ‘ịnya isi’ maka καυχάομαι, ma debe ‘anụ ahụ’ n’isi ederede iji chekwaa okwu Pọl na nghọtahie ya, ebe a kọwara ụzọ okwu dị mfe karị n’ihe odide ala peeji.
