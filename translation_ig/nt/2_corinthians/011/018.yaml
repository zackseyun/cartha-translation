- from: Ebe ọ bụ na ọtụtụ ndị na-anya isi dị ka anụ ahụ si dị[a], mụ onwe m ga-anyakwa isi.
  to: Ebe ọ bụ na ọtụtụ ndị na-anya isi n’ụzọ anụ ahụ[a], mụ kwa ga-anya isi.
