    text: Ma ọ bụ, “dị ka ụkpụrụ mmadụ si dị,” ma ọ bụ, “n’ụzọ mmadụ nkịtị.”
    reason: lexical_alternative
  revision_rationale: The revision corrects the Igbo expression of κατὰ σάρκα while preserving 'anụ ahụ' in the main text and retaining the contextual alternatives in the footnote. It also makes the rendering of κἀγώ more proportionate to the Greek emphasis. The repeated 'ịnya isi' and the future force of καυχήσομαι remain explicit.
