id: 2CO.11.15
reference: 2 Corinthians 11:15
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: οὐ μέγα οὖν εἰ καὶ οἱ διάκονοι αὐτοῦ μετασχηματίζονται ὡς διάκονοι δικαιοσύνης, ὧν τὸ τέλος ἔσται κατὰ τὰ ἔργα αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/015.yaml
  text: So it is no great thing if his servants also disguise themselves as servants of righteousness[a], whose end will be according to their works.
translation:
  language: ig
  text: Ya mere, ọ bụghị ihe ijuanya ma ọ bụrụ na ndị na-ejere ya ozi na-emekwa onwe ha ka ha yie ndị na-ejere ezi omume ozi[a]. Ọgwụgwụ ha ga-adị ka ọrụ ha si dị.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ndị na-ejere ikpe ziri ezi ozi.” Okwu Grik a nwere ike ịpụta “ezi omume” ma ọ bụ “ikpe ziri ezi”; n'ebe a ọ na-ekwu maka ime ka mmadụ yie onye nọ n'akụkụ ihe ziri ezi.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ μέγα
  choice: ọ bụghị ihe ijuanya
  rationale: Nke a na-egosipụta akpaalaokwu Grik nke pụtara na ihe ahụ abụghị ihe ga-eju anya, kama ịsụgharị ya n'ụzọ siri ike dịka ‘ọ bụghị nnukwu ihe.’
- source_word: οὖν
  choice: Ya mere
  rationale: Ọ na-egosi nkwubi okwu sitere n'amaokwu bu ụzọ.
- source_word: διάκονοι
  choice: ndị na-ejere ya ozi
  rationale: N'ebe a okwu ahụ na-ezo aka n'ụmụ mmadụ na-arụ ọrụ Setan; nsụgharị a doro anya ma zere nghọta pụrụ iche nke ọrụ ụka.
- source_word: μετασχηματίζονται
  choice: emee onwe ha ka ha yie
  rationale: Ngwaa ahụ na-ekwu maka ịgbanwe ọdịdị ma ọ bụ ngosipụta elu iji duhie, ọ bụghị mgbanwe nke ime mmụọ n'ime mmadụ.
- source_word: ὡς
  choice: ka ha yie
  rationale: Ọ na-egosi ụdị ọrụ ma ọ bụ ọdịdị ha na-eme ka ndị mmadụ hụ.
- source_word: δικαιοσύνης
  choice: ezi omume
  rationale: ‘Ezi omume’ bụ ụzọ Igbo doro anya isi kwuo ọnọdụ nke ịbụ onye ziri ezi; n'ebe a ọ na-ezo aka n'ọdịdị nke ndị nọ n'akụkụ ihe ziri ezi.
- source_word: τὸ τέλος
  choice: Ọgwụgwụ ha
  rationale: Ọ na-ezo aka n'ihe ga-emecha dakwasị ha, karịsịa n'ọnọdụ ikpe.
- source_word: κατὰ τὰ ἔργα αὐτῶν
  choice: ga-adị ka ọrụ ha si dị
  rationale: Nke a na-edobe echiche na ihe ga-eme ha ga-adaba n'omume ha.
theological_decisions:
- issue: Otú e si asụgharị δικαιοσύνη n'okwu Pọl a
  choice: ezi omume
  alternative: ikpe ziri ezi
  rationale: N'ebe a, ndị ozi ụgha na-eme ka ha yie ndị na-akwado ihe ziri ezi na omume ọma. ‘Ezi omume’ dabara n'echiche ahụ, ebe e debere ‘ikpe ziri ezi’ n'ala ala peeji dịka ihe okwu Grik ahụ nwekwara ike ịpụta.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta, dee ya. A họọrọ ‘ndị na-ejere ... ozi’ kama okwu nwere ike iyi aha ọkwa pụrụ iche n'ụka; a sụgharịrị akpaalaokwu οὐ μέγα n'ụzọ Igbo sitere n'okike.
