id: 2CO.11.4
reference: 2 Corinthians 11:4
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: εἰ μὲν γὰρ ὁ ἐρχόμενος ἄλλον Ἰησοῦν κηρύσσει ὃν οὐκ ἐκηρύξαμεν, ἢ πνεῦμα ἕτερον λαμβάνετε ὃ οὐκ ἐλάβετε, ἢ εὐαγγέλιον ἕτερον ὃ οὐκ ἐδέξασθε, καλῶς ⸀ἀνέχεσθε.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/004.yaml
  text: For if someone comes and proclaims another Jesus[a], whom we did not proclaim, or if you receive a different spirit, which you did not receive, or a different gospel, which you did not accept[c][b], you put up with it well enough.
translation:
  language: ig
  text: N’ihi na ọ bụrụ na mmadụ abịa kwusaa Jizọs ọzọ[a], onye anyị ekwusaghị, ma ọ bụ unu anata mmụọ dị iche[b], nke unu nataghị, ma ọ bụ oziọma dị iche, nke unu anabataghị, unu na-anagide ya nke ọma[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “Jizọs dị iche.”
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị ya, “mmụọ ọzọ.” Okwu Grik ahụ na-emesi ike na mmụọ a dị iche na nke ha natara na mbụ.
    reason: lexical_alternative
  - marker: c
    text: 'O yikarịrị ka “unu na-anagide ya nke ọma” bụ okwu ịkwa emo: Pọl na-akatọ ha maka ịdị nnọọ njikere ịnagide ụdị nkwusa ahụ.'
    reason: irony_context
lexical_decisions:
- source_word: ὁ ἐρχόμενος
  choice: ọ bụrụ na mmadụ abịa
  rationale: Nkebi a na-ekwu n’ozuzu banyere onye ọ bụla pụrụ ịbịa; ‘mmadụ abịa’ bụ Igbo dị ugbu a ma na-edobe echiche ahụ na-akọwaghị otu onye kpọmkwem.
- source_word: ἄλλον Ἰησοῦν
  choice: Jizọs ọzọ
  rationale: ἄλλος pụtara ‘ọzọ’; okwu a na-egosi na ndị ahụ ji otu aha ahụ bụ Jizọs ma na-ekwusa onye e gosipụtara n’ụzọ ọzọ.
- source_word: κηρύσσει / ἐκηρύξαμεν
  choice: kwusaa / na-ekwusaghị
  rationale: ‘Ikwusa’ na-egosi ịkpọsa ozi n’ihu ọha ma dabara nke ọma n’ọrụ κηρύσσω n’akwụkwọ Pọl.
- source_word: πνεῦμα ἕτερον
  choice: mmụọ dị iche
  rationale: ἕτερος na-emesi ọdịiche ike; ‘dị iche’ anaghị ekpebi ma mmụọ ahụ bụ mmụọ ọjọọ, nghọta ụgha banyere Mmụọ Nsọ, ma ọ bụ mmetụta ime mmụọ ọzọ.
- source_word: λαμβάνετε / ἐλάβετε
  choice: anata / na-anataghị
  rationale: ‘Ịnata’ na-edobe echiche nke inweta ihe e nyere ma na-eme ka okwu a dị iche na δέχομαι n’ahịrị na-esote.
- source_word: εὐαγγέλιον ἕτερον
  choice: oziọma dị iche
  rationale: ‘Oziọma’ bụ okwu Igbo a maara nke ọma maka εὐαγγέλιον, ebe ‘dị iche’ na-egosipụta ike ntụnyere nke ἕτερον.
- source_word: ἐδέξασθε
  choice: na-anabataghị
  rationale: ‘Ịnabata’ nwere echiche nke iji obi nabata ma ọ bụ kweta ihe; ọ na-edobekwa ọdịiche dị n’etiti δέχομαι na λαμβάνω (‘ịnata’).
- source_word: καλῶς ἀνέχεσθε
  choice: unu na-anagide nke ahụ nke ọma
  rationale: ‘Ịnagide’ na-egosipụta ἀνέχομαι, ebe ‘nke ọma’ na-edobe καλῶς. A hapụrụ okwu ahụ ka ihe gbara ya gburugburu na nkọwa ala peeji gosi ụda ịkwa emo ya.
- source_word: εἰ μὲν γὰρ
  choice: N’ihi na ọ bụrụ na
  rationale: Nke a na-ejikọta amaokwu ahụ na arụmụka bu ya ụzọ ma na-ebute ọnọdụ atụnyere ahụ n’Igbo e ji eme ihe ugbu a.
theological_decisions:
- issue: Ihe ‘mmụọ dị iche’ na-ezo aka na ya
  choice: A sụgharịrị ya n’ozuzu dị ka ‘mmụọ dị iche,’ n’akọwaghị ụdị mmụọ ọ bụ.
  alternative: Mmụọ Nsọ e kọwara n’ụzọ ụgha; mmụọ ọjọọ; ma ọ bụ ọnọdụ/mmetụta ime mmụọ dị iche.
  rationale: πνεῦμα ἕτερον sara mbara n’asụsụ Grik, ọnọdụ okwu a anaghịkwa enye ikike ikpebi otu nkọwa n’ime ndị a.
- issue: Ụda okwu καλῶς ἀνέχεσθε
  choice: E debere okwu nkịtị ‘unu na-anagide nke ahụ nke ọma,’ ma kọwaa na ọ ga-abụ ịkwa emo.
  alternative: Ịgụ ya dị ka otuto kpọmkwem ma ọ bụ naanị nkwupụta na-enweghị ịkwa emo.
  rationale: N’ihe gbara amaokwu ahụ gburugburu, Pọl na-ata ndị Kọrịnt ahụhụ maka ịdị ngwa ịnagide ozizi ndị asọmpi, ọ bụghị ito ha.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E ji ‘unu’ kwupụta plural nke onye nke abụọ. E debere usoro okwu atọ—Jizọs ọzọ, mmụọ dị iche, na oziọma dị iche—na ọdịiche dị n’etiti ‘ịnata’ na ‘ịnabata.’
