revisions:
- from: N’ihi na ọ bụrụ na mmadụ abịa kwusaa Jizọs ọzọ[a], onye anyị na-ekwusaghị, ma ọ bụ ọ bụrụ na unu anata mmụọ dị iche[b], nke unu na-anataghị, ma ọ bụ oziọma dị iche, nke unu na-anabataghị, unu na-anagide nke ahụ nke ọma[c].
  to: N’ihi na ọ bụrụ na mmadụ abịa kwusaa Jizọs ọzọ[a], onye anyị ekwusaghị, ma ọ bụ unu anata mmụọ dị iche[b], nke unu nataghị, ma ọ bụ oziọma dị iche, nke unu anabataghị, unu na-anagide ya nke ọma[c].
  rationale: 'A gbanwere naanị akụkụ ndị na-adịghị egosi oge aorist nke Grik nke ọma: e wepụrụ “na-” n’ọrụ ndị na-ekwu maka ihe mere n’oge gara aga. A hazikwara njikọ nke nhọrọ atọ ahụ ka ọ bụrụ Igbo dị nfe ma kwekọọ na usoro Grik. E debeghị nkọwa pụrụ iche banyere “mmụọ dị iche,” ma ụda ịkwa emo nke njedebe ka a kọwara n’ala peeji.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T19:27:53Z'
review_pass:
  verdict: revise
  source_fidelity: The three aorist verbs (ἐκηρύξαμεν, ἐλάβετε, ἐδέξασθε) refer to what Paul and the Corinthians did not do previously. The draft renders them with progressive forms (anyị na-ekwusaghị, unu na-anataghị, unu na-anabataghị), which can suggest ongoing or habitual action rather than the completed past contrast in Greek. The revision uses non-progressive negative forms. The present verbs for the hypothetical current situation and for their tolerance are retained.
  naturalness: The revised wording is idiomatic Standard Igbo. Removing repeated “ọ bụrụ na” after “ma ọ bụ” reflects the coordinated Greek alternatives and reads more smoothly. “Ya” is more natural than the somewhat heavy “nke ahụ” with “ịnagide,” while leaving the object’s exact reference open as in Greek.
  terminology: “Jizọs ọzọ,” “mmụọ dị iche,” and “oziọma dị iche” appropriately preserve the lexical contrasts without deciding the identity of the different spirit. “Kwusaa,” “nata,” and “nabata” retain the relevant distinctions. The footnotes are accurate and their anchors are correctly placed.
  issues:
  - severity: medium
    issue: Completed past verbs are rendered as progressive forms.
    rationale: The forms “anyị na-ekwusaghị,” “unu na-anataghị,” and “unu na-anabataghị” do not adequately reflect the aorist verbs’ reference to prior, completed non-actions. Use “anyị ekwusaghị,” “unu nataghị,” and “unu anabataghị.”
  - severity: low
    issue: The repeated conditional phrase is unnecessarily heavy.
    rationale: After the initial “ọ bụrụ na,” the Greek coordinates the following possibilities with ἤ. In Igbo, “ma ọ bụ unu…” naturally continues the conditional without repeating “ọ bụrụ na.”
  revised_text: N’ihi na ọ bụrụ na mmadụ abịa kwusaa Jizọs ọzọ[a], onye anyị ekwusaghị, ma ọ bụ unu anata mmụọ dị iche[b], nke unu nataghị, ma ọ bụ oziọma dị iche, nke unu anabataghị, unu na-anagide ya nke ọma[c].
