id: 2CO.11.26
reference: 2 Corinthians 11:26
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὁδοιπορίαις πολλάκις, κινδύνοις ποταμῶν, κινδύνοις λῃστῶν, κινδύνοις ἐκ γένους, κινδύνοις ἐξ ἐθνῶν, κινδύνοις ἐν πόλει, κινδύνοις ἐν ἐρημίᾳ, κινδύνοις ἐν θαλάσσῃ, κινδύνοις ἐν ψευδαδέλφοις,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/026.yaml
  text: often on journeys[a], in dangers from rivers, in dangers from robbers, in dangers from my own people, in dangers from Gentiles, in dangers in the city, in dangers in the wilderness, in dangers at sea, in dangers among false brothers[b],
translation:
  language: ig
  text: n’ije ọtụtụ ugboro, n’ihe ize ndụ sitere n’osimiri, n’ihe ize ndụ sitere n’aka ndị ohi, n’ihe ize ndụ sitere n’aka ndị nke agbụrụ m[a], n’ihe ize ndụ sitere n’aka ndị mba ọzọ, n’ihe ize ndụ n’obodo, n’ihe ize ndụ n’ọzara, n’ihe ize ndụ n’oké osimiri, n’ihe ize ndụ n’etiti ụmụnna ụgha[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ndị agbụrụ m” ma ọ bụ “ndị mba m.” N’asụsụ Grik, ọ pụtara n’ụzọ nkịtị, “site n’aka ndị ikwu m/ndị nke agbụrụ m.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ndị na-azọrọ na ha kwere ekwe n’ụgha.” N’asụsụ Grik, ọ bụ n’ụzọ nkịtị “ụmụnna ụgha.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁδοιπορίαις πολλάκις
  choice: ọtụtụ mgbe n’ije dị iche iche
  rationale: Nke a na-egosi njem Pọl mere ugboro ugboro n’Igbo dị mfe, ma na-edobe ọdịdị mmalite nke ndepụta ahụ.
- source_word: κινδύνοις
  choice: n’ihe ize ndụ
  rationale: E kwughachiri okwu a dịka e mere na Grik iji chekwaa uda na nchịkọta ihe egwu ndị ahụ.
- source_word: ποταμῶν
  choice: sitere n’osimiri
  rationale: A hapụrụ kpọmkwem ụdị ihe egwu osimiri ahụ n’amaghị ama dịka ihe odide Grik si mee.
- source_word: λῃστῶν
  choice: sitere n’aka ndị ohi
  rationale: “Ndị ohi” bụ okwu Igbo doro anya maka ndị na-apụnara mmadụ ihe n’ụzọ.
- source_word: ἐκ γένους
  choice: sitere n’aka ndị obodo m
  rationale: Nke a na-egosi ndị Pọl na ha si n’otu agbụrụ ma ọ bụ otu mba, n’etinyeghị “ndị Juu” nke na-adịghị n’okwu Grik ahụ kpọmkwem.
- source_word: ἐξ ἐθνῶν
  choice: sitere n’aka ndị mba ọzọ
  rationale: N’ọnọdụ ebe a, ọ na-emegide ndị Pọl n’onwe ya ma na-ezo aka ná ndị na-abụghị ndị Juu; okwu a bụ nke ndị Igbo nkịtị ga-aghọta.
- source_word: ἐν πόλει
  choice: n’obodo ukwu
  rationale: E jigidere otu aha dị ka Grik; “obodo ukwu” na-egosipụta πόλις nke ọma karịa naanị “obodo,” nke nwekwara ike ịpụta obodo nta.
- source_word: ἐν ἐρημίᾳ
  choice: n’ọzara
  rationale: “Ọzara” na-ekpuchi echiche nke ebe tọgbọrọ n’efu ma ọ bụ ebe mmadụ na-ebighị.
- source_word: ἐν θαλάσσῃ
  choice: n’oké osimiri
  rationale: Nke a bụ ụzọ Igbo kwụ ọtọ ma dị mma isi gosipụta ihe egwu dị n’elu ma ọ bụ n’ime oke osimiri.
- source_word: ἐν ψευδαδέλφοις
  choice: n’etiti ụmụnna ụgha
  rationale: Nke a na-edobe okwu Grik ahụ n’ụzọ nkịtị, na-akọwa ndị na-azọrọ na ha bụ ụmụnna ma ha abụghị n’eziokwu.
theological_decisions:
- issue: Nsụgharị ψευδαδέλφοις
  choice: n’etiti ụmụnna ụgha
  alternative: n’etiti ndị kwere ekwe ụgha
  rationale: “Ụmụnna ụgha” na-edobe okwu nwoke ọtụtụ dị na Grik na njikọ ezinụlọ nke okwu ahụ, n’akọwaghị karịa ihe isi mmalite kwuru.
- issue: Nsụgharị ἐξ ἐθνῶν n’ụzọ ọ na-emegide ἐκ γένους
  choice: sitere n’aka ndị mba ọzọ
  alternative: sitere n’aka ndị na-abụghị ndị Juu
  rationale: Nhọrọ a na-echekwa ọdịiche agbụrụ dị n’amaokwu ahụ n’etinyeghị nkọwa okpukpe sara mbara karịa ederede.
translation_notes:
  register: Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E chekwara nkwughachi “n’ihe ize ndụ” iji jigide ike na uda nke ndepụta Grik. Akara ntụaka [a] na [b] dị n’ebe okwu ha na-akọwa nọ.
