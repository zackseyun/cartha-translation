    reason: lexical_alternative
  revision_rationale: The revision restores the repeated-travel sense of πολλάκις, removes the unwarranted ‘large’ qualifier from πόλει, and clarifies that ἐκ γένους concerns Paul’s ethnic kin rather than residents of his locality. Footnotes remain attached to the terms they explain and retain the lexical alternatives without importing denominational interpretation.
