source:
  edition: SBLGNT
  text: ὃ λαλῶ οὐ ⸂κατὰ κύριον λαλῶ⸃, ἀλλ’ ὡς ἐν ἀφροσύνῃ, ἐν ταύτῃ τῇ ὑποστάσει τῆς καυχήσεως.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/017.yaml
  text: What I am saying[a], I am not saying according to the Lord, but as in foolishness[c][b], in this confidence of boasting.
translation:
  language: ig
  text: Ihe m na-ekwu, anaghị m ekwu ya n’ụzọ kwekọrọ n’Onyenwe anyị,[a] kama ana m ekwu ya dịka a ga-asị na m nọ na nzuzu,[b] n’obi ike a nke ịnya isi.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “anaghị m ekwu nke a dịka ihe si n’aka Onyenwe anyị,” ma ọ bụ, “dịka ụkpụrụ Onyenwe anyị si dị.”
    reason: alternative_reading
  - marker: b
    text: A pụkwara ịsụgharị ya, “dịka a ga-asị na m nọ na nzuzu,” ma ọ bụ n’ụzọ dị mfe, “dịka onye nzuzu.”
    reason: lexical_alternative
  - marker: c
    text: Okwu Grik a sụgharịrị “obi ike” nwekwara ike ịpụta “ihe a na-ekwu banyere ya,” “ntọala,” ma ọ bụ “ọrụ a malitere,” dịka njikọ okwu si dị.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃ λαλῶ
  choice: Ihe m na-ekwu
  rationale: Nke a na-egosi ihe Pọl na-ekwu ugbu a, ma bụrụkwa okwu Igbo doro anya ma na-adị n'ọnụ.
- source_word: κατὰ κύριον
  choice: dịka Onyenwe anyị si chọọ
  rationale: κατά na accusative na-egosi ụkpụrụ ma ọ bụ ụzọ e si eme ihe. Nhọrọ a na-eme ka Igbo bụrụ ihe okike, ma ihe odide ala ala peeji na-echekwa ohere nghọta ndị ọzọ.
- source_word: κύριον
  choice: Onyenwe anyị
  rationale: Nke a bụ nsụgharị Igbo a na-ejikarị maka κύριος, nke n'ebe a yikarịrị ka ọ na-ezo aka n'Onyenwe anyị Jizọs.
- source_word: ἀλλ’ ὡς ἐν ἀφροσύνῃ
  choice: kama ana m ekwu ya dịka onye nọ n'ime nzuzu
  rationale: Nke a na-echekwa ὡς na ἐν, ya bụ, na Pọl na-ekwu dịka onye nọ n'ọnọdụ ma ọ bụ ụzọ nzuzu, kama ịkpọ onwe ya onye nzuzu n'enweghị nkọwa.
- source_word: ἐν ταύτῃ τῇ ὑποστάσει
  choice: n'obi ike a
  rationale: ὑπόστασις siri ike ịkọwa n'ebe a; 'obi ike' dabara n'ọnọdụ ịnya isi ma na-echekwa echiche nke nkwenye ma ọ bụ ọnọdụ siri ike mmadụ ji ekwu okwu.
- source_word: τῆς καυχήσεως
  choice: nke ịnya isi
  rationale: Nke a na-echekwa ike omume dị na καύχησις ma jikọta ya n'ụzọ doro anya na 'obi ike.'
theological_decisions:
- issue: Ihe κατὰ κύριον pụtara na njikọ ya na ikike Onyenwe anyị
  choice: E tinyere ya dịka 'dịka Onyenwe anyị si chọọ,' nke na-egosi ụkpụrụ ma ọ bụ ụzọ Onyenwe anyị.
  alternative: “dịka ihe si n’aka Onyenwe anyị” ma ọ bụ “dịka ụkpụrụ Onyenwe anyị si dị.”
  rationale: Nke a anaghị ekwu na okwu Pọl abụghị eziokwu ma ọ bụ na o nweghị mmụọ nsọ; ọ na-ekewapụ ụdị ịnya isi ya na ụzọ Onyenwe anyị, ebe ihe odide ala ala peeji na-echekwa nghọta nke isi mmalite ma ọ bụ ikike.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. E chekwara usoro arụmụka Pọl na mgbagwoju anya dị na κατὰ κύριον na ὑπόστασις site n'itinye nkọwa ndị ọzọ n'ala ala peeji.
