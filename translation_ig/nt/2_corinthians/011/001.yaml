  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ὄφελον ἀνείχεσθέ μου μικρόν ⸀τι ⸀ἀφροσύνης· ἀλλὰ καὶ ἀνέχεσθέ μου.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/001.yaml
  text: I wish you would bear with me in a little foolishness[a]. But indeed[b], do bear with me.
translation:
  language: ig
  text: A sị na unu ga-anagide m ntakịrị n’ime nzuzu[a]! Ma n’ezie, nagidenụ m[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “n’ime obere nzuzu.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “nweenụ ndidi n’ebe m nọ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὄφελον
  choice: Ọ dị m ka
  rationale: Nke a na-egosipụta ọchịchọ Pọl n’ụzọ dị ugbu a ma dị mfe nghọta, n’enweghị iji okwu Igbo ochie.
- source_word: ἀνείχεσθέ / ἀνέχεσθέ
  choice: unu nagide / nagidenụ
  rationale: ἀνέχομαι pụtara ịnagide mmadụ ma ọ bụ inwe ndidi n’ebe ọ nọ. E gosipụtara nkwughachi ngwaa ahụ, nke mbụ dịka ọchịchọ, nke abụọ dịka arịrịọ e mesiri ike.
- source_word: μου
  choice: m / m
  rationale: E jikọtara nnọchiaha ahụ na ‘nzuzu’ na nkebi mbụ dịka Igbo si ekwu ya nke ọma, ma mee ya ihe ngwaa ‘nagidenụ’ na nkebi nke abụọ.
- source_word: μικρόν τι
  choice: ntakịrị
  rationale: ‘Ntakịrị’ na-enye echiche nke obere ihe ma na-echekwa okwu Pọl ji wedata ihe ọ na-achọ ikwu.
- source_word: ἀφροσύνης
  choice: nzuzu
  rationale: ‘Nzuzu’ bụ okwu Igbo doro anya maka omume ma ọ bụ okwu nke onye nzuzu, ma na-echekwa njakịrị Pọl ji akọwa ịnya isi ya.
- source_word: ἀλλὰ καὶ
  choice: Ma n’ezie
  rationale: Nke a na-echekwa ma ntụgharị ‘ma’ ma ike nkwenye dị na καί, ka arịrịọ nke abụọ pụta ìhè.
theological_decisions:
- issue: Pọl kọwara okwu ya dịka ἀφροσύνη
  choice: E debere ya dịka ‘nzuzu’ nke bụ okwu Pọl ji wedata onwe ya n’ụzọ njakịrị.
  alternative: Ịkọwa ya dịka ‘okwu na-enweghị isi’ ma ọ bụ ime ka ọ dị nro.
  rationale: Amaokwu a na-ebute akụkụ Pọl ga-eji ịnya isi n’ụzọ njakịrị. Idebe ‘nzuzu’ na-echekwa esemokwu ahụ n’emeghị ka nkọwa otu okpukpe banye na ya.
translation_notes:
  register: Standard Igbo; asụsụ dị ugbu a, dị ùgwù, ma dị mfe nghọta. E ji ‘unu’ gosipụta onye nke abụọ n’ọnụọgụ karịa otu, ma jiri ụdị ngwaa dị iche mee ka ọchịchọ nke mbụ na arịrịọ e mesiri ike nke abụọ doo anya.
