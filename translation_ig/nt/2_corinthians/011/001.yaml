revisions:
- from: Ọ dị m ka unu nagide ntakịrị nzuzu m[a]. Ma n’ezie, nagidenụ m[b].
  to: A sị na unu ga-anagide m ntakịrị n’ime nzuzu[a]! Ma n’ezie, nagidenụ m[b].
  rationale: The revision renders Ὄφελον as an earnest wish, keeps μου with the verb “bear with,” preserves the modest qualifier μικρόν τι, and retains the repeated imperative appeal after ἀλλὰ καί. Footnote anchors and their lexical-alternative functions are retained and adjusted to match the corrected syntax.
