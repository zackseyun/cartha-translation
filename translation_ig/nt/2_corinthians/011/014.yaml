  text: καὶ οὐ ⸀θαῦμα, αὐτὸς γὰρ ὁ Σατανᾶς μετασχηματίζεται εἰς ἄγγελον φωτός·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/014.yaml
  text: And no wonder[a], for Satan himself disguises himself as an angel of light.
translation:
  language: ig
  text: Ọ bụghịkwa ihe ijuanya[a], n’ihi na Setan n’onwe ya na-eme onwe ya ka mmụọ ozi nke ìhè.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Ọ bụghịkwa ihe ịtụnanya, n’ihi na Setan n’onwe ya na-agbanwe onwe ya ghọọ mmụọ ozi nke ìhè.” Ngwaa Grik ahụ nwere ike ịpụta n’ụzọ nkịtị, “ịgbanwe ọdịdị,” ma n’ebe a o yiri ka ọ na-ekwu banyere ngosipụta aghụghọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Ọ bụghịkwa
  rationale: E tinyere njikọ -kwa n’ahịrịokwu a iji chekwaa njikọ ya na amaokwu bu ya ụzọ n’ụzọ Igbo na-ada nke ọma.
- source_word: οὐ θαῦμα
  choice: ọ bụghị ihe ijuanya
  rationale: Nke a bụ ụzọ Igbo doro anya ma dịkwa mma isi kwuo na ihe ahụ ekwesịghị iju mmadụ anya.
- source_word: αὐτὸς ... ὁ Σατανᾶς
  choice: Setan n’onwe ya
  rationale: “N’onwe ya” na-egosipụta ike e tinyere n’okwu αὐτός; artikụl Grik adịghị achọ ka a sụgharịa ya iche n’aha Setan.
- source_word: γὰρ
  choice: n’ihi na
  rationale: Ọ na-ewebata ihe kpatara na ọnọdụ ahụ abụghị ihe ijuanya.
- source_word: μετασχηματίζεται
  choice: na-eme onwe ya ka ọ dị ka
  rationale: Nhọrọ a na-egosipụta mgbanwe n’ọdịdị a na-ahụ anya ma ọ bụ aghụghọ, n’ebughị ụzọ kpebie na ọdịdị ya n’ezie gbanwere.
- source_word: εἰς
  choice: ka ọ dị ka
  rationale: N’usoro a, εἰς na-egosi ọdịdị ma ọ bụ ọrụ a na-eme ka a hụ, ọ bụghị naanị mmegharị ‘banye n’ime’ ihe.
- source_word: ἄγγελον
  choice: mmụọ ozi
  rationale: N’ọnọdụ a gbasara Setan, okwu ahụ pụtara ihe e kere eke nke mmụọ, ya mere “mmụọ ozi” ka “onye ozi” doo anya.
- source_word: φωτός
  choice: nke ìhè
  rationale: Ọ na-echekwa njikọ genitivu na ihe oyiyi Akwụkwọ Nsọ banyere ìhè.
theological_decisions:
- issue: Ụdị mgbanwe Setan na-eme
  choice: E ji okwu na-egosi na Setan na-eme onwe ya ka ọ dị ka mmụọ ozi nke ìhè, ya bụ ngosipụta aghụghọ.
  alternative: Setan na-agbanwe onwe ya n’ezie ghọọ mmụọ ozi nke ìhè.
  rationale: μετασχηματίζεται nwere ike ịpụta ịgbanwe ọdịdị, ma ọnọdụ okwu banyere ndịozi ụgha na aghụghọ na-akwado ngosipụta aghụghọ. Ihe odide ukwu anaghị ekwu nkwubi okwu sara mbara banyere ụdị mgbanwe ahụ; ihe e dere n’ala ala peeji na-echekwa nhọrọ ntụgharị ọzọ.
translation_notes:
  register: Standard Igbo; asụsụ dị ugbu a, dị ùgwù, ma dị mfe nghọta. E ji “na-eme onwe ya ka ọ dị ka” mee ka echiche aghụghọ pụta ìhè, ebe ihe e dere n’ala ala peeji chekwara ntụgharị nkịtị karịa.
