id: 2CO.11.3
reference: 2 Corinthians 11:3
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: φοβοῦμαι δὲ μή πως, ὡς ὁ ὄφις ⸂ἐξηπάτησεν Εὕαν⸃ ἐν τῇ πανουργίᾳ αὐτοῦ, ⸀φθαρῇ τὰ νοήματα ὑμῶν ἀπὸ τῆς ἁπλότητος ⸂καὶ τῆς ἁγνότητος⸃ τῆς εἰς τὸν Χριστόν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/003.yaml
  text: But I fear that somehow[a], just as the serpent deceived Eve by his cunning[d][c][b], your minds may be corrupted from the sincerity and purity that are toward Messiah.
translation:
  language: ig
  text: Ma ana m atụ egwu na, dị nnọọ ka agwọ ahụ ji aghụghọ ya duhie Iv, e nwere ike imebi echiche unu, mee ka ha pụọ n’obi kwụ ọtọ na ịdị ọcha dị n’ebe Mesaịa nọ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Obi kwụ ọtọ” nwekwara ike ịpụta “obi na-ekewaghị ekewa” ma ọ bụ “ịdị mfe.” Ụfọdụ akwụkwọ aka ochie enweghị okwu ndị a, “na ịdị ọcha.”
    reason: lexical_alternative_and_textual_variant
lexical_decisions:
- source_word: φοβοῦμαι δὲ μή πως
  choice: Ma ana m atụ egwu na
  rationale: Na-egosipụta nchegbu Pọl na-aga n’ihu ma webata ihe ọ na-atụ ụjọ na ọ pụrụ ime, n’Igbo dị mfe ma dị ugwu.
- source_word: ὁ ὄφις
  choice: agwọ ahụ
  rationale: “Agwọ” bụ okwu Igbo nkịtị ma na-echekwa ntụaka ahụ banyere akụkọ Iv na Jenesis.
- source_word: ἐξηπάτησεν Εὕαν
  choice: duhie Iv
  rationale: “Duhie” na-egosipụta ime ka mmadụ kwenye n’ihe ụgha ma ọ bụ pụọ n’ụzọ ziri ezi; “Iv” bụ ụdị aha ahụ a na-ejikarị n’Igbo.
- source_word: ἐν τῇ πανουργίᾳ αὐτοῦ
  choice: ji aghụghọ ya
  rationale: Na-egosipụta ụzọ agwọ ahụ si duhie Iv; πανουργία ebe a bụ amamihe aghụghọ e ji eme ihe ọjọọ.
- source_word: φθαρῇ τὰ νοήματα ὑμῶν
  choice: a pụrụ imebi echiche unu
  rationale: Na-echekwa olu nnara nke φθαρῇ na ohere ihe ọjọọ ahụ nwere ime; “echiche unu” na-anọchi plural νοήματα n’enweghị ime ka ọ bụrụ naanị ikike uche.
- source_word: ἀπὸ τῆς ἁπλότητος
  choice: mee ka unu si n’obi kwụ ọtọ ... wezuga onwe unu
  rationale: ἁπλότης n’ebe a na-egosi obi na-enweghị aghụghọ ma kewaghị ekewa. Nhazi okwu a na-eme ka njikọ ἀπό, nke na-egosi ịpụ n’ihe, doo anya n’Igbo.
- source_word: καὶ τῆς ἁγνότητος
  choice: na ịdị ọcha unu
  rationale: Na-echekwa àgwà zuru ezu nke ἁγνότης, n’agbanyeghị ma ọ bụ ịdị ọcha n’omume, n’uche, ma ọ bụ nraranye.
- source_word: τῆς εἰς τὸν Χριστόν
  choice: n’ebe Mesaịa nọ
  rationale: Na-ejikọta obi kwụ ọtọ na ịdị ọcha ahụ na nraranye a na-enye Mesaịa; “Mesaịa” na-egosipụta ọrụ Χριστός dị ka utu aha.
theological_decisions:
- issue: Nsụgharị Χριστόν
  choice: Mesaịa
  alternative: Kraịst
  rationale: Χριστός bụ utu aha pụtara Onye E Tere Mmanụ; “Mesaịa” na-eme ka ọrụ ya dị ka utu aha pụta ìhè n’ebe a.
- issue: Ihe ἁπλότης pụtara n’ihe gbasara Mesaịa
  choice: obi kwụ ọtọ
  alternative: obi na-ekewaghị ekewa; ịdị mfe
  rationale: “Obi kwụ ọtọ” na-egosipụta ezi obi na nraranye na-enweghị aghụghọ. Ihe ọzọ nwere ike ịbụ obi na-ekewaghị ekewa, ya mere e debere ya n’ala peeji.
- issue: Ịgụnye καὶ τῆς ἁγνότητος
  choice: gụnye “na ịdị ọcha” n’ahịrịokwu
  alternative: hapụ ya dịka ụfọdụ akwụkwọ aka ochie si mee
  rationale: SBLGNT gụnyere okwu ndị a, ya mere a sụgharịrị ha n’ahịrịokwu; a kọwara ọdịiche akwụkwọ aka ochie n’ala peeji.
translation_notes:
  register: Igbo Izugbe nke oge a, dị ugwu ma bụrụ nke ndị nkịtị pụrụ ịghọta. E ji “unu” mee ka ọtụtụ onye e ji okwu ahụ na-agwa doo anya. A haziri akụkụ ikpeazụ n’ụzọ dị n’Igbo iji mee ka echiche nke isi n’ezi nraranye wezuga onwe pụta ìhè, ma e chekwara olu nnara nke “a pụrụ imebi echiche unu.”
