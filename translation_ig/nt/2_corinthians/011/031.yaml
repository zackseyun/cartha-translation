  text: ὁ θεὸς καὶ πατὴρ τοῦ κυρίου ⸀Ἰησοῦ οἶδεν, ὁ ὢν εὐλογητὸς εἰς τοὺς αἰῶνας, ὅτι οὐ ψεύδομαι.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/031.yaml
  text: The God and Father of the Lord Jesus[a], he who is blessed forever, knows that I am not lying.
translation:
  language: ig
  text: Chineke na Nna nke Onyenwe Jizọs—onye a na-agọzi ruo mgbe ebighị ebi—maara na anaghị m ekwu ụgha.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ma ọ bụ, n’ụzọ nkịtị karịa: “ruo n’oge niile.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ θεὸς καὶ πατὴρ
  choice: Chineke na Nna
  rationale: Otu njirimara okwu Greek na-achị aha abụọ ahụ, ya mere e debere ha ọnụ dịka okwu a kapịrị ọnụ, “Chineke na Nna,” n’enweghị ime ka otu aha bụrụ nkọwa nke ibe ya.
- source_word: τοῦ κυρίου Ἰησοῦ
  choice: nke Onyenwe anyị Jizọs
  rationale: “Onyenwe anyị” bụ ụzọ Igbo si ekwu aha-ọkwa κύριος n’ụzọ ebumpụta ụwa; “anyị” dị n’ime aha-ọkwa Igbo a, ọ bụghị mgbakwunye nke onye-nwe na-adịghị na Greek.
- source_word: οἶδεν
  choice: maara
  rationale: E debere ihe ngwaa ahụ pụtara kpọmkwem, “maara,” kama ịgbasa ya ka ọ bụrụ “bụ onye akaebe,” ọ bụ ezie na okwu ahụ na-arụ ọrụ dịka ịkpọku Chineke n’iyi.
- source_word: ὁ ὢν εὐλογητὸς
  choice: onye a na-agọzi
  rationale: Nkebi a na-akọwa Chineke dịka onye a na-agọzi; usoro nnara “a na-agọzi” na-egosipụta εὐλογητός n’ụzọ doro anya ma dị mma n’Igbo.
- source_word: εἰς τοὺς αἰῶνας
  choice: ruo mgbe ebighị ebi
  rationale: Nke a bụ okwu Igbo ebumpụta ụwa nke na-ebuga ike otuto na-adịgide adịgide nke akpaokwu ahụ; nkọwa nkịtị karịa dị n’ala ala peeji.
- source_word: ὅτι
  choice: na
  rationale: N’ebe a, “na” na-ewebata ọdịnaya nke ihe Chineke maara, ọ bụghị ihe kpatara ya.
- source_word: οὐ ψεύδομαι
  choice: anaghị m ekwu okwu ụgha
  rationale: 'Nke a na-egosipụta nkwupụta dị ugbu a n’ụzọ Igbo doro anya ma dị ebumpụta ụwa: Pọl na-ekwusi ike na ihe ọ na-ekwu abụghị ụgha.'
theological_decisions:
- issue: Mmekọrịta “Chineke na Nna” na “Onyenwe anyị Jizọs”
  choice: E sụgharịrị ya dịka “Chineke na Nna nke Onyenwe anyị Jizọs,” na-edebe ọdịiche ndị a kpọrọ aha n’amaokwu ahụ.
  alternative: Ịkọwagharị ya iji belata ma ọ bụ zoo ọdịiche dị n’etiti Chineke Nna na Onyenwe anyị Jizọs.
  rationale: Ihe odide ahụ n’onwe ya na-akpọ Chineke “Chineke na Nna” nke Onyenwe anyị Jizọs. Nsụgharị ahụ ekwesịghị ime ka esemokwu nkà mmụta okpukpe yiri ka ọ dị mfe site n’ịgbanwe okwu ahụ.
- issue: Njikọ nkebi otuto “ὁ ὢν εὐλογητὸς εἰς τοὺς αἰῶνας”
  choice: E tinyere ya n’etiti akara ogologo dịka nkọwa otuto banyere Chineke.
  alternative: Ijikọ ya n’enweghị nkwụsị dịka nkebi na-amachi onye Chineke bụ.
  rationale: Nkebi ahụ na-arụ ọrụ dịka ntinye otuto n’etiti nkwupụta yiri ịṅụ iyi; akara ogologo na-eme ka nke a doo anya ma ghara ịgbanwe onye nkebi ahụ na-akọwa.
translation_notes:
  register: Asụsụ Igbo izugbe, nke oge a ma dị ùgwù. E ji usoro dị mfe nke ndị na-agụ akwụkwọ taa ga-aghọta, ma debe usoro nkwupụta siri ike na nkebi otuto nke Greek.
