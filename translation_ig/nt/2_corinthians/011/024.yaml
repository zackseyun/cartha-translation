  text: ὑπὸ Ἰουδαίων πεντάκις τεσσεράκοντα παρὰ μίαν ἔλαβον,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/024.yaml
  text: Five times I received from the Jews forty lashes less one[a][b].
translation:
  language: ig
  text: Ugboro ise ka m natara n’aka ndị Juu ụtarị iri anọ e wezụga otu[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N’ụzọ nkịtị, “iri anọ e wezụga otu”; ya bụ, ụtarị iri atọ na itoolu.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị ya, “ndị Juu tiri m.” Okwu Grik na-egosi na ndị Juu bụ ndị mere ma ọ bụ ndị ntaramahụhụ ahụ si n’aka ha bịa, ma ọ naghị akọwapụta otu òtù ọchịchị pụrụ iche.
    reason: alternative_reading
lexical_decisions:
- source_word: ὑπὸ Ἰουδαίων
  choice: n’aka ndị Juu
  rationale: Ὑπό na genitive na-egosi ndị mere ma ọ bụ ndị sitere n’aka ha nye ntaramahụhụ ahụ. “N’aka ndị Juu” bụ ụzọ Igbo si ekwu ya nke ọma, na-akọwapụtaghị ya karịa ihe Grik kwuru dị ka òtù ọchịchị pụrụ iche.
- source_word: πεντάκις
  choice: Ugboro ise
  rationale: Nke a na-enye kpọmkwem echiche nke ihe mere ugboro ise ma na-ada nke ọma n’Igbo.
- source_word: τεσσεράκοντα παρὰ μίαν
  choice: ụtarị iri anọ e wezụga otu
  rationale: Nkebiokwu ahụ pụtara n’ụzọ nkịtị “iri anọ e wezụga otu.” A gbakwụnyere “ụtarị” iji mee ka ụdị ntaramahụhụ a na-ekwu doo anya, ebe a ka na-edobe usoro okwu Grik kama ịsị naanị iri atọ na itoolu.
- source_word: ἔλαβον
  choice: anara m
  rationale: Λαμβάνω ebe a pụtara ịnata ma ọ bụ ịnagide ntaramahụhụ. “Anara m” na-edobe onyinyo ngwaa mbụ ahụ ma bụrụkwa okwu Igbo kwụ ọtọ.
theological_decisions:
- issue: Ndị mere ma ọ bụ nyere ntaramahụhụ ahụ
  choice: n’aka ndị Juu
  alternative: ndị Juu tara m ahụhụ
  rationale: Nhọrọ a na-edobe nghọta sara mbara nke ὑπὸ Ἰουδαίων dị ka isi mmalite ma ọ bụ ndị mere ihe ahụ, n’ebughị ụzọ kpebie na ọ bụ otu òtù ọchịchị ndị Juu kpọmkwem.
translation_notes:
  register: Asụsụ Igbo izugbe, nke dị ugbu a ma dị ùgwù. E ji “n’aka ndị Juu” zere ịgbakwụnye nkọwa na-enweghị isi banyere ndị ọchịchị, ebe “ụtarị iri anọ e wezụga otu” na-edobe ọdịdị okwu mbụ ma mee ka ihe a natara doo anya.
