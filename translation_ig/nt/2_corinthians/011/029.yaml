revisions:
- from: Ònye na-adịghị ike, mụ onwe m esoghịkwa ya ghara ịdị ike? Ònye ka a na-eme ka ọ sụọ ngọngọ, ọkụ anaghịkwa ere m n’obi?[a]
  to: Ònye na-adịghị ike, ma mụ onwe m ọ̀ bụghị onye na-adịghị ike? Ònye ka a na-eme ka ọ sụọ ngọngọ, ma ọkụ ọ̀ naghị agba m n’obi?[a]
  rationale: The revision removes the unsupported and unnatural “esoghịkwa ya” construction, makes both Greek rhetorical questions transparent in Standard Igbo, and retains the source’s ambiguity about the precise emotion conveyed by “burn.” The footnote is corrected to describe the Greek metaphor accurately.
