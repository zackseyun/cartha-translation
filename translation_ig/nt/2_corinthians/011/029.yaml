  text: τίς ἀσθενεῖ, καὶ οὐκ ἀσθενῶ; τίς σκανδαλίζεται καὶ οὐκ ἐγὼ πυροῦμαι;
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/029.yaml
  text: Who is weak[a], and I am not weak? Who is caused to stumble, and I do not burn with indignation?
translation:
  language: ig
  text: Ònye na-adịghị ike, ma mụ onwe m ọ̀ bụghị onye na-adịghị ike? Ònye ka a na-eme ka ọ sụọ ngọngọ, ma ọkụ ọ̀ naghị agba m n’obi?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N'ụzọ nkịtị, okwu Grik ahụ pụtara, “ọ na-ere m ọkụ.” Ọ bụ ihe atụ nke pụrụ igosi mwute dị ukwuu, ịnụ ọkụ n’obi, ma ọ bụ iwe.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσθενεῖ / ἀσθενῶ
  choice: na-adịghị ike / esoghịkwa ya ghara ịdị ike
  rationale: Nke a na-edobe obosara nke okwu Grik, nke pụrụ ịgụnye adịghị ike nke anụ ahụ, ọnọdụ mmadụ, ma ọ bụ nke mmụọ; n'ahịrị nke abụọ, ntụgharị ahụ na-egosipụta na Pọl na-esoro onye ahụ nwee mmetụta n'adịghị ike ya.
- source_word: σκανδαλίζεται
  choice: a na-eme ka ọ sụọ ngọngọ
  rationale: Ọ na-edobe ihe atụ nke ime ka mmadụ sụọ ngọngọ, ma hapụkwa ka okwu ahụ nwee ike ịpụta itinye mmadụ n'ihe ize ndụ nke ime mmehie ma ọ bụ ịda n'ụzọ ime mmụọ.
- source_word: πυροῦμαι
  choice: ọkụ anaghịkwa ere m n’obi
  rationale: Okwu a na-edobe ihe atụ doro anya nke ire ọkụ, ma 'n'obi' na-eme ka ọ bụrụ Igbo nkịtị nke na-egosi mkpali dị ukwuu n'ime mmadụ n'ebughị ụzọ kpebie ma ọ bụ iwe, mwute, ma ọ bụ ịnụ ọkụ n'obi.
- source_word: τίς
  choice: Ònye
  rationale: Nke a bụ ụzọ Igbo kwụ ọtọ na nke e ji ajụ ajụjụ banyere mmadụ.
- source_word: καὶ οὐκ ἐγὼ
  choice: mụ onwe m esoghịkwa ya ghara / anaghịkwa ... m
  rationale: ‘Mụ onwe m’ na-egosipụta nkwusiri ike dị na ἐγώ, ebe nhazi ajụjụ ahụ ka bụ nke a na-aghọta nke ọma n'Igbo.
theological_decisions:
- issue: Ụdị mmetụta Pọl nke πυροῦμαι na-egosi
  choice: Idobe ihe atụ nke ọkụ n'ahịrị bụ isi n'ebughị ụzọ kpọọ mmetụta ahụ iwe naanị.
  alternative: Ịsụgharị ya kpọmkwem dịka ‘iwe anaghịkwa ewe m nke ukwuu?’
  rationale: Ihe atụ Grik na-egosi mkpali siri ike n'ime Pọl, ma ọ naghị amanye naanị otu nkọwa dịka iwe; ya mere ntụgharị ahụ na-edobe ohere nke mwute, ịnụ ọkụ n'obi, ma ọ bụ iwe.
translation_notes:
  register: E ji Standard Igbo nke dị ugbu a, dị ùgwù ma dị mfe nghọta mee ya. ‘Ịsụ ngọngọ’ na-edobe ihe atụ nke isi mmalite; ‘ọkụ na-ere m n’obi’ na-eme ka ihe atụ nke πυροῦμαι daa nke ọma n'Igbo n'emeghị ka ọ bụrụ naanị iwe.
