review_pass:
  verdict: revise
  source_fidelity: 'The draft correctly retains the broad sense of ἀσθενέω, the passive causative force and stumble metaphor of σκανδαλίζεται, and the deliberately open fire metaphor of πυροῦμαι. However, the first rhetorical question is grammatically and idiomatically malformed in Igbo: “mụ onwe m esoghịkwa ya ghara ịdị ike” introduces an unsupported idea of accompanying the person and does not clearly render Paul’s “and I am not weak?” The revision preserves the source’s rhetorical negation and emphatic first person.'
  naturalness: “Mụ onwe m esoghịkwa ya ghara ịdị ike” is not natural Standard Igbo. The revised phrasing uses a clear rhetorical question. The second clause is also recast with “ọ̀ naghị agba m ọkụ n’obi?” so that its interrogative force is explicit and its inner-affect metaphor is natural in contemporary Standard Igbo.
  terminology: “na-adịghị ike” appropriately preserves the breadth of weakness. “a na-eme ka ọ sụọ ngọngọ” preserves the passive and metaphor without deciding whether the stumbling is offense or sin. “ọkụ na-agba m n’obi” retains πυροῦμαι as a metaphor and does not reduce it to indignation alone.
  issues:
  - severity: high
    issue: The first question contains an unidiomatic and semantically intrusive construction.
    rationale: “esoghịkwa ya ghara ịdị ike” is not a natural way to say “and I am not weak?” and adds the notion of accompanying the weak person, which is absent from the Greek.
  - severity: medium
    issue: The second rhetorical question lacks explicit Igbo interrogative marking, and the footnote inaccurately labels an Igbo wording as literal.
    rationale: Explicit question marking better reflects the Greek rhetorical question. The footnote should identify the Greek expression, whose literal image is burning, rather than call a shortened Igbo phrase literal.
  revised_text: Ònye na-adịghị ike, ma mụ onwe m ọ̀ bụghị onye na-adịghị ike? Ònye ka a na-eme ka ọ sụọ ngọngọ, ma ọkụ ọ̀ naghị agba m n’obi?[a]
  revised_footnotes:
  - marker: a
    text: N'ụzọ nkịtị, okwu Grik ahụ pụtara, “ọ na-ere m ọkụ.” Ọ bụ ihe atụ nke pụrụ igosi mwute dị ukwuu, ịnụ ọkụ n’obi, ma ọ bụ iwe.
    reason: lexical_alternative
  revision_rationale: The revision removes the unsupported and unnatural “esoghịkwa ya” construction, makes both Greek rhetorical questions transparent in Standard Igbo, and retains the source’s ambiguity about the precise emotion conveyed by “burn.” The footnote is corrected to describe the Greek metaphor accurately.
