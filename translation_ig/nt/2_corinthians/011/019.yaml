translation:
  language: ig
  text: N’ihi na unu ji ọṅụ na-anagide ndị nzuzu[a], ebe unu onwe unu bụ ndị maara ihe.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, ‘na-atachi obi n’ebe ndị nzuzu nọ.’
    reason: lexical_alternative
  - marker: b
    text: 'Pọl na-ekwu nke a n’ụzọ mkparị: ndị Kọrịnt na-ewere onwe ha dị ka ndị maara ihe, ma ha na-anagide ndị nzuzu.'
    reason: cultural_note
lexical_decisions:
- source_word: ἡδέως
  choice: ji ọṅụ
  rationale: Nke a na-egosi na ha ji obi ụtọ ma ọ bụ njikere anabata omume ahụ, ma na-enyekwa aka idobe olu njakịrị Pọl.
- source_word: γὰρ
  choice: N’ihi na
  rationale: Ọ na-ejikọta amaokwu a na ihe bu ya ụzọ dị ka ihe kpatara ya ma ọ bụ nkọwa ya.
- source_word: ἀνέχεσθε
  choice: na-anagide
  rationale: Ọ pụtara idi ma ọ bụ ịnagide mmadụ; ‘na-anagide’ bụ okwu Igbo doro anya, nke ugbu a, ma dịkwa mma n’usoro a.
- source_word: τῶν ἀφρόνων
  choice: ndị nzuzu
  rationale: Ọ na-ezo aka n’ebe ndị mmadụ na-enweghị ezi uche nọ, ma na-edobe ọdịiche okwu ya na ‘ndị maara ihe.’
- source_word: φρόνιμοι
  choice: ndị maara ihe
  rationale: Nke a bụ okwu Igbo sitere n’okike maka ndị nwere amamihe ma ọ bụ ezi uche, ma ọ na-edobe njakịrị Pọl n’ihi ntụnyere ya na ‘ndị nzuzu.’
- source_word: ὄντες
  choice: ebe ... bụ
  rationale: Ọ na-edobe participle ahụ n’enweghị ikpebi ma ọ bụ ihe kpatara ya (‘n’ihi na’) ka ọ bụ nkwenye megidere atụmanya (‘ọ bụ ezie na’).
theological_decisions:
- issue: Njakịrị Pọl banyere ndị Kọrịnt
  choice: E dere okwu ahụ ozugbo, ma jiri ọdịiche dị n’etiti ‘ndị nzuzu’ na ‘ndị maara ihe’ mee ka njakịrị ahụ nọgide.
  alternative: Ịgbakwunye okwu dịka ‘ebe unu chere na unu maara ihe nke ukwuu’ iji mee ka njakịrị ahụ pụta ìhè karị.
  rationale: Grik ahụ anaghị ekwu kpọmkwem na ha ‘chere’ otú ahụ; ịgbakwunye ya ga-akọwa ihe Pọl bu n’obi karịa ka ederede n’onwe ya si kwuo. Ihe odide ukwu na nkọwa ala peeji zuru ezu na-echekwa esemokwu ahụ.
translation_notes:
  register: Standard Igbo nke ugbu a, dị ùgwù ma dị mfe nghọta. A họọrọ ‘na-anagide’ kama okwu mkparịta ụka siri ike karị ka amaokwu ahụ bụrụ ihe okike n’Igbo; akara mkpu na-enyere olu njakịrị aka n’enweghị itinye nkọwa ọhụrụ n’ahịrị okwu.
