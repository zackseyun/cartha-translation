  source_fidelity: 'Isi ahịrị ahụ na-atụgharị akụkụ Grik niile n''ụzọ ziri ezi: «N’ihi na» na-egosi γάρ; «ji ọṅụ» na-egosi ἡδέως; «na-anagide» na-egosi ἀνέχεσθε; «ndị nzuzu» na «ndị maara ihe» na-edobe ọdịiche ἀφρόνων/φρόνιμοι. Otú ọ dị, akara mkpu anaghị apụta n’ederede Grik ma ọ dịghị mkpa iji chekwaa njakịrị ahụ.'
