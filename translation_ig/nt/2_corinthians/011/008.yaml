  text: ἄλλας ἐκκλησίας ἐσύλησα λαβὼν ὀψώνιον πρὸς τὴν ὑμῶν διακονίαν,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/008.yaml
  text: I robbed other churches by accepting support for serving you,[a]
translation:
  language: ig
  text: Ezuru m ihe n’aka ọgbakọ ndị ọzọ site n’ịnara ha nkwado iji jeere unu ozi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, n’ụzọ kpọmkwem, “ụgwọ ọrụ” ma ọ bụ “ụgwọ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλας ἐκκλησίας
  choice: ọgbakọ ndị ọzọ
  rationale: N’akwụkwọ Pọl, ἐκκλησία na-ezokarị aka n’ọgbakọ ndị Kraịst nọ n’otu ebe; “ọgbakọ” bụ okwu Igbo doro anya ma kwekọọ n’ebe a.
- source_word: ἐσύλησα
  choice: Ezuru m ihe n’aka
  rationale: συλάω bụ okwu siri ike nke pụtara ịpụnara ma ọ bụ izuru ihe. Nsụgharị a na-edobe ike na njakịrị miri emi dị n’okwu Pọl, n’agbanyeghị na ihe ọ na-ekwu abụghị izu ohi n’ezie.
- source_word: λαβὼν
  choice: site n’ịnara ha
  rationale: 'Partisịpụ a na-egosi ụzọ o si kwuo na ya “zuru” ha ihe: ọ bụ site n’ịnara nkwado ha.'
- source_word: ὀψώνιον
  choice: nkwado
  rationale: ὀψώνιον nwere ike ịpụta ụgwọ ọrụ ma ọ bụ ihe e ji akwado mmadụ. N’ọnọdụ ozi a, “nkwado” na-egosi enyemaka ego ma ọ bụ ihe ndị dị mkpa n’enweghị ime ka ọ dị ka nkwekọrịta ọrụ azụmahịa.
- source_word: πρὸς τὴν ὑμῶν διακονίαν
  choice: ka m wee jeere unu ozi
  rationale: πρός na akuzativ ebe a na-egosi ebumnuche, ebe διακονία pụtara ije ozi. Nsụgharị a na-eme ka o doo anya na Pọl natara nkwado ahụ iji jeere ndị Kọrịnt ozi.
theological_decisions:
- issue: Ike okwu Pọl banyere ịnara enyemaka n’aka ọgbakọ ndị ọzọ
  choice: Idowe ihe atụ siri ike, “Ezuru m ihe n’aka ọgbakọ ndị ọzọ,” dịka okwu njakịrị miri emi na ikwubiga okwu ókè.
  alternative: Ime ka okwu ahụ dị nro dịka, “Anara m nkwado n’aka ọgbakọ ndị ọzọ.”
  rationale: Okwu Grik ahụ kpachapụrụ anya sie ike. Ime ka ọ dị nro ga-ewepụ ike okwu Pọl ji agbachitere omume ya. Ihe gbara amaokwu a gburugburu na-egosi na ọ na-ekwu maka nkwado, ọ bụghị izu ohi n’ezie.
translation_notes:
  register: Ejiri Igbo Izugbe nke oge a, nke dị ùgwù ma dị mfe nghọta. E debere ike na njakịrị miri emi nke okwu mbụ ahụ, ma jiri nkọwa ala peeji gosi ihe ὀψώνιον pụtara kpọmkwem.
