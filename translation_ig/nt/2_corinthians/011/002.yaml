review_pass:
  verdict: revise
  source_fidelity: The draft retains the verse’s marital metaphor, God-related jealousy, exclusive ‘one husband,’ virginal purity, and presentation to Messiah. However, ‘ekworo m na-ekworo unu’ is awkward and repetitive, and ‘m kwere unu nkwa ịlụ otu di’ can be read as Paul promising personally to marry them rather than arranging their betrothal to one husband.
  naturalness: ‘Ana m eji ekworo Chineke ekworo unu’ is idiomatic Standard Igbo and preserves the instrumental force of θεοῦ ζήλῳ. ‘Ekwere m unu nkwa ka unu lụọ otu di’ makes the intended betrothal arrangement clear in contemporary formal Igbo.
  terminology: ‘Ekworo Chineke,’ ‘otu di,’ ‘nwa agbọghọ na-amaghị nwoke nke dị ọcha,’ and ‘Mesaịa’ suitably convey the Greek terms and preserve the metaphor without doctrinal expansion. The Messiah/Christ alternative belongs directly after ‘Mesaịa,’ not at the end of the sentence.
  issues:
  - severity: medium
    issue: Opening jealousy expression is unnatural
    rationale: ‘ekworo m na-ekworo unu’ is not a natural Standard Igbo rendering of ζηλῶ ... ὑμᾶς and introduces needless repetition. An instrumental construction naturally expresses ‘I am jealous for you with God’s jealousy.’
  - severity: medium
    issue: Betrothal wording is semantically ambiguous
    rationale: ‘m kwere unu nkwa ịlụ otu di’ can suggest that Paul himself promised to marry the Corinthians. The Greek means that Paul pledged/arranged them for marriage to one husband.
  - severity: low
    issue: Footnote b anchor is misplaced
    rationale: The note concerns τῷ Χριστῷ / ‘Mesaịa,’ so its marker should immediately follow ‘Mesaịa,’ rather than follow the final purity phrase.
  revised_text: N’ihi na ana m eji ekworo Chineke ekworo unu[a], n’ihi na ekwere m unu nkwa ka unu lụọ otu di, ka m wee chee unu n’ihu Mesaịa[b] dịka nwa agbọghọ na-amaghị nwoke nke dị ọcha.
  revised_footnotes:
