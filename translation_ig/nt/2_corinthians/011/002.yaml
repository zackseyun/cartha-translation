id: 2CO.11.2
reference: 2 Corinthians 11:2
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ζηλῶ γὰρ ὑμᾶς θεοῦ ζήλῳ, ἡρμοσάμην γὰρ ὑμᾶς ἑνὶ ἀνδρὶ παρθένον ἁγνὴν παραστῆσαι τῷ Χριστῷ·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/002.yaml
  text: For I am jealous for you with God's jealousy[a], because I betrothed you to one husband[b], to present you as a pure virgin to Messiah.
translation:
  language: ig
  text: N’ihi na ana m eji ekworo Chineke ekworo unu[a], n’ihi na ekwere m unu nkwa ka unu lụọ otu di, ka m wee chee unu n’ihu Mesaịa[b] dịka nwa agbọghọ na-amaghị nwoke nke dị ọcha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ekworo dị ka nke Chineke.” Okwu Grik ahụ nwere ike ịpụta ekworo nke Chineke ma ọ bụ ekworo e ji àgwà Chineke mara.
    reason: lexical_alternative
  - marker: b
    text: 'Ma ọ bụ, “nye Kraịst.” N’asụsụ Grik: “nye Onye E Tere Mmanụ.”'
    reason: alternative_reading
lexical_decisions:
- source_word: ζηλῶ
  choice: ekworo m na-ekworo unu
  rationale: “Ekworo” na-echekwa echiche nke nlekọta siri ike na-achọ iguzosi ike n’ihe n’ime ihe atụ alụmdi na nwunye, ọ bụghị anyaụfụ efu.
- source_word: θεοῦ ζήλῳ
  choice: bụ ekworo Chineke
  rationale: 'Nke a na-edobe genitive Grik ahụ n''ụzọ kwụ ọtọ: ekworo ahụ nwere ike ịbụ nke Chineke ma ọ bụ nke e ji àgwà Chineke mara.'
- source_word: ἡρμοσάμην
  choice: m kwere unu nkwa ịlụ
  rationale: Ọ na-egosi ime nkwa ma ọ bụ ịhazi alụmdi na nwunye; okwu a bụ nke doro ndị na-agụ Igbo nke oge a anya.
- source_word: ἑνὶ ἀνδρὶ
  choice: otu di
  rationale: Ọ bụ ezie na ἀνήρ pụkwara ịpụta nwoke, ihe atụ nke nwanyị a chọrọ ịlụ na-eme ka “di” bụrụ ihe okwu ahụ pụtara n’ebe a.
- source_word: παρθένον
  choice: nwa agbọghọ na-amaghị nwoke
  rationale: Nke a na-egosipụta kpọmkwem nwanyị na-amaghị nwoke ma na-echekwa ihe atụ nke ịdị ọcha tupu alụmdi na nwunye.
- source_word: ἁγνὴν
  choice: nke dị ọcha
  rationale: Ọ bụ okwu Igbo dị mfe ma dị ùgwù nke na-eburu echiche ịdị ọcha nke omume n’ebe a.
- source_word: παραστῆσαι
  choice: ka m wee chee unu n’ihu
  rationale: Ọ na-echekwa echiche nke iweta ma ọ bụ igosi onye n’ihu onye ọzọ, dịka n’emume.
- source_word: τῷ Χριστῷ
  choice: Mesaịa
  rationale: Χριστός na-arụ ọrụ dịka utu aha nke onye ahụ bụ di n’ihe atụ a; “Mesaịa” na-egosipụta ọrụ utu aha ahụ.
theological_decisions:
- issue: Ụdị ekworo Pọl na-ekwu maka ya
  choice: Ekworo Pọl bụ ekworo nchebe nke sitere n’aka Chineke ma ọ bụ nke kwekọrọ n’àgwà Chineke.
  alternative: Ịghọta ya nanị dịka ịnụ ọkụ n’obi Pọl nwere n’onwe ya.
  rationale: θεοῦ ζήλῳ nwere ike igosi ekworo nke Chineke ma ọ bụ ekworo e ji àgwà Chineke mara; a hapụrụ obosara a kama ime ka ọ bụrụ naanị ịnụ ọkụ n’obi.
- issue: Nsụgharị Χριστός
  choice: Mesaịa
  alternative: Kraịst
  rationale: N’ihe atụ a, okwu ahụ na-arụ ọrụ dịka utu aha nke onye a na-ekwe ndị Kọrịnt nkwa ịlụ, ya mere “Mesaịa” na-echekwa ike utu aha ahụ.
translation_notes:
  register: Ejiri Igbo ọkọlọtọ nke oge a, nke dị ùgwù ma dị mfe nghọta. A nọgidere na-eji ihe atụ alụmdi na nwunye, ekworo nke ọgbụgba ndụ, na ịdị ọcha nke nwa agbọghọ na-amaghị nwoke; e tinyere nkọwa ala peeji iji chekwaa mgbagwoju anya nke θεοῦ ζήλῳ na nhọrọ Mesaịa/Kraịst.
