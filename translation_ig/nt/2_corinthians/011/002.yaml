revisions:
- from: N’ihi na ekworo m na-ekworo unu bụ ekworo Chineke[a], n’ihi na m kwere unu nkwa ịlụ otu di, ka m wee chee unu n’ihu Mesaịa dịka nwa agbọghọ na-amaghị nwoke nke dị ọcha.[b]
  to: N’ihi na ana m eji ekworo Chineke ekworo unu[a], n’ihi na ekwere m unu nkwa ka unu lụọ otu di, ka m wee chee unu n’ihu Mesaịa[b] dịka nwa agbọghọ na-amaghị nwoke nke dị ọcha.
  rationale: The revision improves idiomatic Standard Igbo and removes ambiguity about who is being pledged in marriage, while retaining the source’s grammar, marital imagery, and theological breadth. Footnote b is moved to its proper textual anchor; neither note adds an interpretation beyond the stated alternatives.
