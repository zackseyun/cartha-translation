    text: Ma ọ bụ, “ekworo dị ka nke Chineke.” Okwu Grik ahụ nwere ike ịpụta ekworo nke Chineke ma ọ bụ ekworo e ji àgwà Chineke mara.
    reason: lexical_alternative
  - marker: b
    text: 'Ma ọ bụ, “nye Kraịst.” N’asụsụ Grik: “nye Onye E Tere Mmanụ.”'
    reason: alternative_reading
  revision_rationale: The revision improves idiomatic Standard Igbo and removes ambiguity about who is being pledged in marriage, while retaining the source’s grammar, marital imagery, and theological breadth. Footnote b is moved to its proper textual anchor; neither note adds an interpretation beyond the stated alternatives.
