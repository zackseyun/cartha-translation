id: 2CO.11.13
reference: 2 Corinthians 11:13
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: οἱ γὰρ τοιοῦτοι ψευδαπόστολοι, ἐργάται δόλιοι, μετασχηματιζόμενοι εἰς ἀποστόλους Χριστοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/013.yaml
  text: For such men are false apostles[a], deceitful workers, disguising themselves as apostles of Messiah.
translation:
  language: ig
  text: N’ihi na ndị dị otú ahụ bụ ndịozi ụgha, ndị ọrụ aghụghọ, ndị na-eme onwe ha ka ha yie ndịozi Mesaịa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ndịozi Kraịst.” A pụrụ ịsụgharị aha ọkwa Grik Χριστός dịka “Kraịst” mgbe e ji ya mee ihe dịka aha; n’ebe a, a sụgharịrị ya “Mesaịa” iji chekwaa ihe aha ọkwa ahụ pụtara.
    reason: alternative_reading
lexical_decisions:
- source_word: γὰρ
  choice: N’ihi na
  rationale: Na-egosi na okwu a na-akọwa ihe Pọl kwuru n’ihu; ọ bụ njikọ doro anya ma bụrụkwa nke a na-eji n’Igbo ugbu a.
- source_word: τοιοῦτοι
  choice: ndị dị otú ahụ
  rationale: Na-ezo aka n’ụdị ndị ahụ a kọwara ná mkparịta ụka gbara amaokwu a gburugburu, n’enweghị ịgbakwụnye nkọwa na-adịghị na Grik.
- source_word: ψευδαπόστολοι
  choice: ndịozi ụgha
  rationale: 'Na-egosipụta okwu Grik jikọtara echiche nke ndịozi na ụgha: ndị na-azọrọ ọkwa onyeozi n’ụzọ na-abụghị eziokwu.'
- source_word: ἐργάται δόλιοι
  choice: ndị ọrụ aghụghọ
  rationale: Na-echekwa ma echiche ọrụ ha na àgwà aghụghọ e ji mara ha, n’asụsụ Igbo dị mfe ma sie ike.
- source_word: μετασχηματιζόμενοι
  choice: ndị na-eme onwe ha ka ha yie
  rationale: Na-egosi mgbanwe nke ọdịdị ma ọ bụ ngosipụta ha n’èzí iji duhie mmadụ, ọ bụghị mgbanwe nke ihe ha bụ n’ime.
- source_word: εἰς ἀποστόλους Χριστοῦ
  choice: ka ha yie ndịozi Mesaịa
  rationale: N’usoro a, εἰς na-egosi ụdị ọrụ ma ọ bụ njirimara ha na-eme ka ndị ọzọ chee na ha nwere; nsụgharị a bụ nke Igbo eke ma na-echekwa echiche nke ime onwe ha ka ha bụrụ ihe ha na-abụghị.
- source_word: Χριστοῦ
  choice: Mesaịa
  rationale: A sụgharịrị aha ọkwa Grik ahụ dịka “Mesaịa” iji chekwaa ihe ọ pụtara dị ka Onye E Tere Mmanụ, ebe ọ na-egosi onye ndịozi ahụ na-ekwu na ha na-anọchite anya ya.
theological_decisions:
- issue: Nsụgharị Χριστοῦ
  choice: Mesaịa
  alternative: Kraịst
  rationale: N’ebe a, Χριστοῦ ka nwere ọrụ aha ọkwa n’okwu ahụ “ndịozi Mesaịa.” “Mesaịa” na-eme ka ihe aha ọkwa ahụ pụtara pụta ìhè; “Kraịst” bụkwa nsụgharị ọdịnala a pụrụ iji ma ọ bụrụ na ewere ya dị ka aha.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. “Ndịozi ụgha” na “ndị ọrụ aghụghọ” na-echekwa usoro okwu siri ike nke Grik; “na-eme onwe ha ka ha yie” na-akọwa ngosipụta aghụghọ n’èzí n’enweghị ikwu na ha gbanwere n’ezie.
