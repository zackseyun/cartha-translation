  text: Why? Because I do not love you? God knows I do.
translation:
  language: ig
  text: N’ihi gịnị? Ọ̀ bụ n’ihi na ahụghị m unu n’anya? Chineke maara.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ya bụ, Chineke maara na ahụrụ m unu n’anya. Grik kwuru naanị, “Chineke maara,” ma hapụ azịza ajụjụ ahụ ka a ghọta ya site n’ihe gbara ya gburugburu.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τί
  choice: N’ihi gịnị?
  rationale: Ajụjụ a dị mkpụmkpụ ma na-ajụ ihe kpatara okwu ahụ, dị ka ike ajụjụ Grik si dị.
- source_word: ὅτι
  choice: Ọ bụ n’ihi na
  rationale: N’ebe a, ὅτι na-ewebata ihe Pọl na-atụ aro dị ka ihe nwere ike ịbụ ihe kpatara ya; usoro a na-ada nke ọma n’Igbo dịka ajụjụ nkwupụta.
- source_word: οὐκ ἀγαπῶ ὑμᾶς
  choice: ahụghị m unu n’anya
  rationale: Nke a bụ ụzọ Igbo nkịtị na nke doro anya si ekwu ‘I do not love you,’ ma chekwaa ngọnarị ahụ na onye a na-agwa.
- source_word: ὁ θεὸς
  choice: Chineke
  rationale: Nke a bụ okwu Igbo a na-ejikarị asụgharị θεός n’ebe a.
- source_word: οἶδεν
  choice: maara
  rationale: A hapụrụ ngwaa ahụ dịka Grik si dị—‘Chineke maara’—n’etinyeghị ihe e chere na ọ maara n’ime isi ederede.
theological_decisions:
- issue: Ma a ga-eme ka azịza dị mma Pọl na-egosi pụta ìhè n’ahịrị ikpeazụ
  choice: Chineke maara.
  alternative: Chineke maara na ahụrụ m unu n’anya.
  rationale: Grik kwuru naanị ‘Chineke maara.’ Ọ bụ ezie na gburugburu okwu ahụ na-egosi azịza Pọl, ide ya kpọmkwem n’isi ederede ga-agbakwunye okwu na-adịghị na Grik. A chekwara mkpụmkpụ okwu ahụ na ihe ọ na-ahapụ ka onye na-agụ ghọta.
translation_notes:
  register: Standard Igbo nke oge a, dị mfe ma nwee ugwu. E ji ‘ahụghị m unu n’anya’ mee ka okwu ịhụnanya bụrụ nke mmadụ nkịtị ga-aghọta, ebe a chekwara ajụjụ nkwupụta na mkpụmkpụ ngwụcha Grik.
