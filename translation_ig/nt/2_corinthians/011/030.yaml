  yaml_path: translation/nt/2_corinthians/011/030.yaml
  text: If I must boast[a], I will boast in the things of my weakness.
translation:
  language: ig
  text: Ọ bụrụ na m aghaghị itu ọnụ, aga m etu ọnụ n’ihe ndị metụtara adịghị ike m.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụ ya n’ụzọ Igbo dị mfe karị, “aga m etu ọnụ banyere adịghị ike m.” N’ụzọ nkịtị karịa, Grik kwuru, “aga m etu ọnụ n’ihe ndị metụtara adịghị ike m.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἰ
  choice: Ọ bụrụ na
  rationale: Nke a na-edobe ụdị ọnọdụ dị n’asụsụ Grik, n’agbanyeghị na okwu Pọl na-egosi na ọ na-ekwu ya n’ụzọ arụmụka.
- source_word: καυχᾶσθαι / καυχήσομαι
  choice: ka m tuo ọnụ / aga m etu ọnụ
  rationale: ‘Itu ọnụ’ bụ okwu Igbo doro anya maka ịnya isi ma ọ bụ ikwu ihe mmadụ ji eme nganga; ikwughachi ya na-edobe nhazi na ike okwu Grik.
- source_word: δεῖ
  choice: ọ dị mkpa
  rationale: Nke a na-egosipụta mkpa ma ọ bụ mmanye dị na ngwaa Grik na-enweghị ịgbakwụnye onye nyere iwu ahụ.
- source_word: τὰ τῆς ἀσθενείας μου
  choice: ihe ndị metụtara adịghị ike m
  rationale: Nke a na-edobe ọtụtụ ihe e zoro aka na ha na njikọ ha na adịghị ike Pọl, kama ime ka okwu ahụ bụrụ naanị ‘adịghị ike m.’
- source_word: ἀσθενείας
  choice: adịghị ike
  rationale: Okwu a bụ nke nkịtị na nke sara mbara, ma nwee ike ịgụnye ọnọdụ ihere na ahụhụ Pọl kwuru banyere ha, ọ bụghị naanị ọrịa anụ ahụ.
theological_decisions:
- issue: Ụdị etu ọnụ Pọl na-ekwu banyere ya
  choice: E debere ihe mgbagwoju anya dị n’etu ọnụ n’ihe metụtara adịghị ike, na-akọwaghị ya n’ime amaokwu ahụ.
  alternative: Ịsụ ya kpọmkwem dịka ‘aga m etu ọnụ banyere adịghị ike m.’
  rationale: Okwu Grik na-ejikọta etu ọnụ na ‘ihe ndị metụtara adịghị ike m,’ nke na-edobe nghọtahie na esemokwu echiche Pọl kpachaara anya kee.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. ‘Itu ọnụ’ na-edobe ụda okwu arụmụka Pọl, ebe ‘ihe ndị metụtara adịghị ike m’ na-edobe usoro Grik na-enweghị ime ka asụsụ ahụ sie ike gabiga ókè.
