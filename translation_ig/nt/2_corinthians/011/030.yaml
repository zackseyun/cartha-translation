  rationale: The revision replaces the less natural opening with an idiomatic expression of necessity, while preserving the conditional wording and the repeated verb for boasting. It keeps the plural referential force of τὰ through “ihe ndị” and does not resolve Paul’s rhetorical paradox into interpretation.
