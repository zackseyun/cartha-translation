revisions:
- from: Ya mere, ọ bụ ezie na edere m unu akwụkwọ ozi, edeghị m ya n’ihi onye ahụ mere ihe ọjọọ, ma ọ bụkwa n’ihi onye ahụ e mere ihe ọjọọ, kama ọ bụ ka e mee ka ịnụ ọkụ n’obi unu n’ihi anyị pụta ìhè n’etiti unu n’ihu Chineke.[a][b]
  to: Ya mere, ọ bụrụgodị na edere m unu akwụkwọ ozi, edeghị m ya n’ihi onye ahụ mere ihe ọjọọ, ọ bụghịkwa n’ihi onye ahụ e mere ihe ọjọọ, kama ọ bụ ka e mee ka ịnụ ọkụ n’obi unu n’ihi anyị pụta ìhè n’etiti unu n’ihu Chineke.[a][b]
  rationale: The revision corrects the essential negative parallel required by οὐδέ and makes the initial concession explicitly emphatic. It otherwise retains the draft’s handling of the disputed/syntactically difficult final clause and retains both footnotes unchanged in meaning and anchoring.
