id: 2CO.7.12
reference: 2 Corinthians 7:12
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἄρα εἰ καὶ ἔγραψα ὑμῖν, οὐχ ⸀ἕνεκεν τοῦ ἀδικήσαντος, ⸀οὐδὲ ⸁ἕνεκεν τοῦ ἀδικηθέντος, ἀλλ’ ⸀1ἕνεκεν τοῦ φανερωθῆναι τὴν σπουδὴν ὑμῶν τὴν ὑπὲρ ἡμῶν πρὸς ὑμᾶς ἐνώπιον τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/007/012.yaml
  text: So even if I wrote to you[a], it was not because of the one who did wrong, nor because of the one who was wronged[b], but so that your earnestness for us might be made known among you before God.
translation:
  language: ig
  text: Ya mere, ọ bụrụgodị na edere m unu akwụkwọ ozi, edeghị m ya n’ihi onye ahụ mere ihe ọjọọ, ọ bụghịkwa n’ihi onye ahụ e mere ihe ọjọọ, kama ọ bụ ka e mee ka ịnụ ọkụ n’obi unu n’ihi anyị pụta ìhè n’etiti unu n’ihu Chineke.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ụfọdụ akwụkwọ aka ochie sịrị: “ka e mee ka ịnụ ọkụ n’obi anyị n’ihi unu pụta ìhè n’etiti unu n’ihu Chineke.”'
    reason: textual_variant
  - marker: b
    text: 'Ma ọ bụ: “ịdị uchu unu,” “oke ịnụ ọkụ n’obi unu,” ma ọ bụ “nchegbu miri emi unu.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄρα εἰ καὶ
  choice: Ya mere, ọ bụ ezie na
  rationale: “Ya mere” na-egosi nkwubi okwu sitere n’ihe bu ụzọ, ebe “ọ bụ ezie na” na-edobe nghọta nkwenye nke εἰ καὶ n’Igbo dị mfe.
- source_word: ἔγραψα ὑμῖν
  choice: edere m unu akwụkwọ ozi
  rationale: Oge gara aga na-ezo aka n’akwụkwọ ozi Pọl dere ha na mbụ; ịgbakwunye “akwụkwọ ozi” na-eme ka okwu ahụ doo anya n’Igbo.
- source_word: οὐχ ἕνεκεν τοῦ ἀδικήσαντος
  choice: edeghị m ya n’ihi onye ahụ mere ihe ọjọọ
  rationale: Nke a na-echekwa echiche ihe kpatara ya nke ἕνεκεν na ọdịdị onye nke participle ahụ n’enweghị ịkọwapụta ụdị mmejọ ahụ.
- source_word: οὐδὲ ἕνεκεν τοῦ ἀδικηθέντος
  choice: ma ọ bụkwa n’ihi onye ahụ e mere ihe ọjọọ
  rationale: Ọ na-edobe myirịta ya na nkebi gara aga ma na-egosipụta passive participle ahụ nke ọma.
- source_word: ἀλλ’ ἕνεκεν τοῦ φανερωθῆναι
  choice: kama ọ bụ ka e mee ka ... pụta ìhè
  rationale: Ọ na-egosipụta nzube nke articular infinitive ahụ ma na-echekwa olu nnara nke φανερωθῆναι.
- source_word: τὴν σπουδὴν ὑμῶν
  choice: ịnụ ọkụ n’obi unu
  rationale: Akpaala okwu a bụ Igbo dị ndụ maka ịdị uchu, ịnụ ọkụ n’obi, na nchegbu siri ike nke σπουδή nwere ike ịpụta.
- source_word: τὴν ὑπὲρ ἡμῶν
  choice: n’ihi anyị
  rationale: Ọ na-egosi na ịnụ ọkụ n’obi ahụ metụtara Pọl na ndị ya, n’enweghị itinye nkọwa karịrị ederede.
- source_word: πρὸς ὑμᾶς
  choice: n’etiti unu
  rationale: N’usoro ahịrịokwu a siri ike, “n’etiti unu” bụ Igbo eke nke na-egosipụta na ihe ahụ pụtara ìhè n’ime ọgbakọ ha, ma ọ naghị ekpuchi mgbagwoju anya nke Greek.
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: n’ihu Chineke
  rationale: Nke a bụ ntụgharị Igbo dị nkenke ma dị nsọ nke na-echekwa echiche ọnụnọ na ịgba akaebe Chineke.
theological_decisions:
- issue: Onye nwe ịnụ ọkụ n’obi ahụ na ntụziaka nke nkebi ahịrịokwu siri ike
  choice: “ịnụ ọkụ n’obi unu n’ihi anyị ... n’etiti unu”
  alternative: “ịnụ ọkụ n’obi anyị n’ihi unu ... n’etiti unu”
  rationale: Isi ederede SBLGNT nwere ὑμῶν (“unu”) na ὑπὲρ ἡμῶν (“n’ihi anyị”); ya mere isi ederede soro ụdị ahụ, ebe ụdị ọgụgụ akwụkwọ aka ọzọ dị mkpa nọ na nkọwa ala peeji kama idozi esemokwu ahụ n’ime ntụgharị.
translation_notes:
  register: Igbo Standard dị ugbu a, dị ugwu ma dị mfe nghọta. E ji “anyị/unu” mee ka ọtụtụ mmadụ pụta ìhè; e zere okwu ụka nke otu denomination. Akara nkọwa ala peeji [a] na [b] dị n’isi ederede.
