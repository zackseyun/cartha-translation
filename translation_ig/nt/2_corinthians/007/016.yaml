- from: Ana m aṅụrị na n'ụzọ niile enwere m obi ike n'ime unu.[a]
  to: Ana m aṅụrị na, n’ụzọ niile, enwere m ntụkwasị obi n'ebe unu nọ.[a]
  rationale: The revision preserves the present-tense joy, the broad adverbial force of ἐν παντί, and Paul’s confidence in relation to the Corinthians. It replaces an overly literal but spatial Igbo rendering of ἐν ὑμῖν with an idiomatic relational expression. The footnote remains anchored and presents the viable English-audit alternative without claiming a distinct Greek textual reading.
