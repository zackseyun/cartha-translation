  yaml_path: translation/nt/2_corinthians/007/016.yaml
  text: I rejoice that in every way I have confidence in you[a].
translation:
  language: ig
  text: Ana m aṅụrị na, n’ụzọ niile, enwere m ntụkwasị obi n'ebe unu nọ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Obi dị m ụtọ n’ihi na n’ihe niile enwere m ntụkwasị obi banyere unu.”
    reason: alternative_reading
lexical_decisions:
- source_word: χαίρω
  choice: Ana m aṅụrị
  rationale: Na-egosipụta ngwaa dị ugbu a ma na-edobe ụda nkwanye ugwu na ọṅụ Pọl.
- source_word: ὅτι
  choice: na
  rationale: N'ebe a, ọ na-ewebata ihe kpatara ọdịnaya ọṅụ Pọl—na o nwere obi ike n'ime ha—n'ụzọ Igbo dị eke.
- source_word: ἐν παντί
  choice: n'ụzọ niile
  rationale: Na-egosipụta oke zuru ezu nke okwu Grik ahụ dị ka nkebiokwu na-akọwa otú ihe si dị, ma bụrụkwa Igbo a na-aghọta ngwa ngwa.
- source_word: θαρρῶ
  choice: enwere m obi ike
  rationale: Na-egosipụta ntụkwasị obi Pọl nwere ugbu a; ọ dabara n'ọnọdụ a karịa echiche nke naanị 'ịnwe obi ike' n'ọnọdụ egwu.
- source_word: ἐν ὑμῖν
  choice: n'ime unu
  rationale: Na-edobe oyiyi na mmekọrịta nke ἐν, ya bụ ntụkwasị obi e tinyere n'ime ndị Kọrịnt, kama ime ya naanị 'banyere unu.'
theological_decisions: []
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, dị ugbu a ma nwee ugwu. A họọrọ “Ana m aṅụrị” maka χαίρω, “n'ụzọ niile” maka nkebiokwu adverbial ἐν παντί, na “n'ime unu” iji chekwaa ike mmekọrịta nke okwu Grik ahụ. Akara ntụaka [a] dị n'isiokwu.
