source:
  edition: SBLGNT
  text: Καὶ γὰρ ἐλθόντων ἡμῶν εἰς Μακεδονίαν οὐδεμίαν ⸀ἔσχηκεν ἄνεσιν ἡ σὰρξ ἡμῶν, ἀλλ’ ἐν παντὶ θλιβόμενοι— ἔξωθεν μάχαι, ἔσωθεν φόβοι—
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/007/005.yaml
  text: For even when we came into Macedonia[a], our flesh had no rest, but we were afflicted in every way—conflicts on the outside, fears on the inside—
translation:
  language: ig
  text: N’ihi na, mgbe anyị batara na Masedonia, anụ ahụ anyị enwetaghị izu ike ọ bụla[a]; kama, a kpagburu anyị n’ụzọ niile—esemokwu n’èzí, egwu n’ime—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “anyị onwe anyị enwetaghị izu ike ọ bụla.” N’asụsụ Grik, ọ bụ “anụ ahụ anyị,” okwu e ji ekwu kpọmkwem banyere adịghị ike na mkpagbu mmadụ na-enwe n’anụ ahụ ya.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ γὰρ
  choice: N’ihi na ọbụna
  rationale: Na-egosi njikọ nkọwa ya na ihe bu ụzọ ma na-echekwa ntakịrị nkwusi ike dị n’okwu Grik.
- source_word: ἐλθόντων ἡμῶν εἰς Μακεδονίαν
  choice: mgbe anyị batara na Masedonia
  rationale: Na-asụgharị genitive absolute dị ka oge, ma chekwaa echiche nke ịbanye n’ebe ahụ nke εἰς na-egosi.
- source_word: οὐδεμίαν ἔσχηκεν ἄνεσιν
  choice: enwetaghị izu ike ọ bụla
  rationale: ἄνεσις pụtara izu ike ma ọ bụ inweta ahụ efe pụọ ná nrụgide; okwu a bụ nke doro anya ma dịkwa eke n’Igbo.
- source_word: ἡ σὰρξ ἡμῶν
  choice: anụ ahụ anyị
  rationale: Na-echekwa okwu nkịtị σάρξ n’ebe a, nke na-ezo aka n’adịghị ike na mkpagbu mmadụ nwere n’ahụ, ọ bụghị ‘ọdịdị mmehie.’
- source_word: ἀλλ’ ἐν παντὶ θλιβόμενοι
  choice: kama, a kpagburu anyị n’ụzọ niile
  rationale: Na-enye echiche passive nke ịbụ ndị a na-amanye ma ọ bụ na-akpagbu, ma na-echekwa obosara nke ἐν παντί.
- source_word: ἔξωθεν μάχαι
  choice: esemokwu n’èzí
  rationale: μάχαι nwere ike ịpụta ọgụ ma ọ bụ esemokwu; ‘esemokwu’ na-ahapụ okwu ahụ ka ọ gbasaa ruo na mmegide na ọgba aghara ndị sitere n’èzí.
- source_word: ἔσωθεν φόβοι
  choice: egwu n’ime
  rationale: Na-echekwa ọdịiche dị mkpirikpi ma sie ike n’etiti nsogbu ndị dị n’èzí na egwu ndị dị n’ime.
theological_decisions:
- issue: Nsụgharị σάρξ
  choice: anụ ahụ anyị
  alternative: anyị onwe anyị; ahụ anyị
  rationale: N’ebe a, σάρξ anaghị egosi ọdịdị mmehie kama ọ na-ekwu banyere mmadụ n’adịghị ike ya nke anụ ahụ na nke mmetụta. Isi okwu ahụ ka e debere n’ahịrị, ebe nkọwa dị mfe karịa dị n’okpuru.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. E debere nhazi abuo nke ‘n’èzí ... n’ime’ na akara ogologo iji chekwaa ike na ụda nke ahịrịokwu Grik.
