    rationale: In this context Καὶ γάρ is best conveyed by an explanatory “N’ihi na” with light emphasis, rather than wording that may imply the arrival itself was exceptional.
  - severity: low
    issue: Footnote wording “okwu nkịtị” is imprecise for a literal Greek expression.
    rationale: “Okwu e ji ekwu kpọmkwem” better explains that “anụ ahụ anyị” reflects the Greek wording without implying it is merely a commonplace idiom.
