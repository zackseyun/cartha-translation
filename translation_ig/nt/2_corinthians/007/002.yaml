    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “anyị ejighị onye ọ bụla nweta uru,” ma ọ bụ, “anyị aghọgbughị onye ọ bụla iji nweta uru.”
    reason: lexical_alternative
  revision_rationale: 'The revision removes two interpretive additions from the main text: the location “in your hearts” in the opening appeal and the means “by deceit” in the final denial. The footnotes retain both the relational contextual reading and narrower lexical alternatives. The repeated “onye ọ bụla” preserves the Greek’s threefold emphatic οὐδένα.'
