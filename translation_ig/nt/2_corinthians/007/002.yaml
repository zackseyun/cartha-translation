review_pass:
  verdict: revise
  source_fidelity: The opening clause in the draft adds “n’obi unu” (“in your hearts”) to the main text. Although this is strongly suggested by 2 Corinthians 6:11–13, it is not stated in Χωρήσατε ἡμᾶς and should remain an interpretive alternative in the note. The final denial adds “n’ụzọ aghụghọ” (“by deceit”), which unnecessarily narrows πλεονεκτέω. “Erigbu” naturally expresses exploiting someone for gain without specifying the means.
  naturalness: “Meerenụ anyị ohere” is natural, respectful Standard Igbo and retains the source metaphor without inserting its relational location. The three parallel denials remain clear and rhetorically balanced.
  terminology: “Emejọghị,” “emebighị,” and “erigbughị” respectively give suitably broad renderings of ἀδικέω, φθείρω, and πλεονεκτέω. The wording avoids defining φθείρω solely as moral corruption or πλεονεκτέω solely as deception.
  issues:
  - severity: medium
    issue: The main text specifies “n’obi unu” in the imperative.
    rationale: The Greek says literally “Make room for us” and does not contain “heart.” The context supports that implication, but optimal-equivalence should preserve it as contextual interpretation rather than state it in the verse.
  - severity: medium
    issue: The final clause adds “n’ụzọ aghụghọ” (“by deceit”).
    rationale: πλεονεκτέω denotes taking advantage of or exploiting for gain, but does not explicitly specify deceit as the means. This addition narrows the source’s scope.
  revised_text: Meerenụ anyị ohere.[a] Anyị emejọghị onye ọ bụla; anyị emebighị onye ọ bụla; anyị erigbughị onye ọ bụla.[b]
  revised_footnotes:
