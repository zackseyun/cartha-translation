revisions:
- from: Nye anyị ohere n’obi unu.[a] Anyị emejọghị onye ọ bụla; anyị emebighị onye ọ bụla; anyị ejighị onye ọ bụla nweta uru n’ụzọ aghụghọ.[b]
  to: Meerenụ anyị ohere.[a] Anyị emejọghị onye ọ bụla; anyị emebighị onye ọ bụla; anyị erigbughị onye ọ bụla.[b]
  rationale: 'The revision removes two interpretive additions from the main text: the location “in your hearts” in the opening appeal and the means “by deceit” in the final denial. The footnotes retain both the relational contextual reading and narrower lexical alternatives. The repeated “onye ọ bụla” preserves the Greek’s threefold emphatic οὐδένα.'
