base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/007/002.yaml
  text: Make room for us[a]. We have wronged no one, corrupted no one[b], taken advantage of no one.
translation:
  language: ig
  text: Meerenụ anyị ohere.[a] Anyị emejọghị onye ọ bụla; anyị emebighị onye ọ bụla; anyị erigbughị onye ọ bụla.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Nabatanụ anyị,” ma ọ bụ, “Megheerenụ anyị obi unu.” Okwu Grik ahụ pụtara n’ụzọ nkịtị, “Meerenụ anyị ohere,” ma o yikarịrị ka ọ na-aga n’ihu n’ihe atụ gbasara mmekọrịta dị na 6:11–13.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “anyị ejighị onye ọ bụla nweta uru,” ma ọ bụ, “anyị aghọgbughị onye ọ bụla iji nweta uru.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Χωρήσατε
  choice: Nye anyị ohere n’obi unu
  rationale: Ọ bụ iwu e nyere ọtụtụ mmadụ. N’ọnọdụ a, ọ na-arịọ ndị Kọrịnt ka ha nabata Pọl na ndị ya n’ime mmekọrịta ha. Ịkpọ ‘obi’ aha na-eme ka ihe atụ ahụ doo ndị Igbo anya, kwekọọkwa na 6:11–13, ebe a na-ekwu banyere imeghe obi.
- source_word: ἡμᾶς
  choice: anyị
  rationale: Ọ bụ ndị Pọl na-anọchite anya ha ka e kwesịrị inye ohere; ‘anyị’ na-asụgharị ya ozugbo.
- source_word: οὐδένα
  choice: onye ọ bụla …ghị
  rationale: E debeghachiri usoro a ugboro atọ iji chekwaa nkwusi ike dị n’okwu Grik ahụ.
- source_word: ἠδικήσαμεν
  choice: anyị emejọghị
  rationale: ἀδικέω pụtara ime mmadụ ihe na-ezighị ezi ma ọ bụ imejọ ya. ‘Emejọghị’ dị mkpirikpi, bụrụkwa okwu Igbo sara mbara nke na-akọwaghị ụdị mmejọ karịa ka isi mmalite si kwuo.
- source_word: ἐφθείραμεν
  choice: anyị emebighị
  rationale: φθείρω nwere ike ịpụta imebi, merụọ, ma ọ bụ duga na mbibi. ‘Emebighị’ na-echekwa obosara na ambiguiti nke okwu ahụ karịa ịkọwa ya naanị dị ka mmebi omume ma ọ bụ ime mmụọ.
- source_word: ἐπλεονεκτήσαμεν
  choice: anyị ejighị … nweta uru n’ụzọ aghụghọ
  rationale: πλεονεκτέω na-egosi iji mmadụ nweta uru, irigbu ya, ma ọ bụ ịghọgbu ya maka uru. Nkebiokwu a bụ Igbo doro anya ma ghara ịkpachibido ya naanị n’ịghọgbu mmadụ n’ihe gbasara ego.
theological_decisions:
- issue: Ụdị arịrịọ dị na Χωρήσατε ἡμᾶς
  choice: Arịrịọ ka ndị Kọrịnt nye Pọl na ndị ibe ya ohere n’obi ha ma weghachi mmekọrịta ha
  alternative: Arịrịọ n’ozuzu ka ha nabata Pọl na ndị ibe ya
  rationale: Ihe gbara amaokwu a gburugburu na 6:11–13 na-ekwu banyere obi sara mbara na imeghere ndị ọzọ obi. Nsụgharị ahụ mere ihe atụ mmekọrịta ahụ ka ọ pụta ìhè, ebe ndetu ala na-echekwa nsụgharị ndị na-adịghị akọwa ya nke ukwuu.
- issue: Ihe ἐφθείραμεν pụtara
  choice: Emebighị onye ọ bụla, n’echiche sara mbara
  alternative: Emeghị ka onye ọ bụla bụrụ onye omume ọjọọ ma ọ bụ duhiere onye ọ bụla
  rationale: Okwu Grik ahụ nwere ike ịgụnye mmebi omume, ime mmụọ, ma ọ bụ ụdị mbibi ọzọ. Isi ederede ekwesịghị imechi ihe ọ pụtara n’otu ụdị mmebi naanị.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E chekwara usoro nkwusi ike ugboro atọ nke οὐδένα site n’ịmeghachi ‘onye ọ bụla …ghị.’ A kọwara ihe atụ nke Χωρήσατε n’ụzọ dabara n’asụsụ Igbo, ebe ndetu ala na-egosi okwu nkịtị na nhọrọ ndị ọzọ.
