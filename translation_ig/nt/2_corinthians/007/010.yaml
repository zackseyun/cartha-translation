revisions:
- from: N’ihi na iru uju nke dị ka uche Chineke si dị na-arụpụta nchegharị nke na-eduga ná nzọpụta, nke a na-agaghị akwa ụta maka ya[b][a]; ma iru uju nke ụwa na-arụpụta ọnwụ.
  to: N’ihi na iru uju kwekọrọ n’uche Chineke na-arụpụta nchegharị na-eduga ná nzọpụta, nke a na-agaghị akwa ụta maka ya[b][a]; ma iru uju nke ụwa na-arụpụta ọnwụ.
  rationale: The revision replaces the awkward main expression for κατὰ θεόν with idiomatic Standard Igbo meaning “in accordance with God’s will.” Footnote a now gives a comprehensible close alternative, while retaining a literal explanatory gloss. The alternative in footnote b is slightly regularized for natural Igbo and continues to document the possible direct connection of ἀμεταμέλητον with “nchegharị.”
