  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἡ γὰρ κατὰ θεὸν λύπη μετάνοιαν εἰς σωτηρίαν ἀμεταμέλητον ⸀ἐργάζεται· ἡ δὲ τοῦ κόσμου λύπη θάνατον κατεργάζεται.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/007/010.yaml
  text: For godly sorrow produces repentance leading to salvation without regret[b][a], but worldly sorrow produces death.
translation:
  language: ig
  text: N’ihi na iru uju kwekọrọ n’uche Chineke na-arụpụta nchegharị na-eduga ná nzọpụta, nke a na-agaghị akwa ụta maka ya[b][a]; ma iru uju nke ụwa na-arụpụta ọnwụ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “iru uju dịka uche Chineke si dị.” Okwu Grik ahụ, n’ụzọ nkịtị karị, bụ “iru uju dị ka Chineke si dị.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “nchegharị nke a na-agaghị akwa ụta maka ya, nke na-eduga ná nzọpụta.” Okwu a sụgharịrị “nke a na-agaghị akwa ụta maka ya” pụrụ ịkọwa “nchegharị” kpọmkwem karị.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατὰ θεὸν
  choice: nke dị ka uche Chineke si dị
  rationale: Nke a na-egosi iru uju kwekọrọ n’uche Chineke, ma na-ezere ime ka okwu Grik ahụ bụrụ naanị aha njirimara na-enweghị nkọwa.
- source_word: λύπη
  choice: iru uju
  rationale: Ọ bụ okwu Igbo doro anya maka mwute ma ọ bụ uju miri emi, o kwekwara ekwe n’akụkụ abụọ nke amaokwu ahụ.
- source_word: μετάνοιαν
  choice: nchegharị
  rationale: Nchegharị na-egosi mgbanwe nke uche na ụzọ ndụ n’ebe Chineke nọ, ọ bụghị naanị ichegharị echiche mmadụ.
- source_word: εἰς σωτηρίαν
  choice: nke na-eduga ná nzọpụta
  rationale: Ọ na-echekwa echiche nke ebumnuche ma ọ bụ nsonaazụ dị na εἰς n’enweghị ịkọwapụta usoro nzọpụta karịa ihe amaokwu ahụ kwuru.
- source_word: ἀμεταμέλητον
  choice: nke a na-agaghị akwa ụta maka ya
  rationale: Ọ na-egosi ihe na-adịghị akpata ụta; ebe njikọ okwu a n’ahịrịokwu Grik nwere ike ịmetụta nchegharị n’ụzọ pụrụ iche, e tinyere nkọwa ọzọ n’ala peeji.
- source_word: ἐργάζεται
  choice: na-arụpụta
  rationale: Ọ na-egosi iweta nsonaazụ, ma na-ada nke ọma n’Igbo.
- source_word: τοῦ κόσμου
  choice: nke ụwa
  rationale: Ọ na-echekwa ọdịiche kpọmkwem dị n’etiti ihe kwekọrọ n’uche Chineke na ihe nke ụwa.
- source_word: θάνατον
  choice: ọnwụ
  rationale: A hapụrụ okwu ahụ n’obosara ya, n’ihi na amaokwu ahụ akọwaghị ma ọ bụ ọnwụ anụ ahụ, nke mmụọ, ma ọ bụ nke ikpeazụ.
- source_word: κατεργάζεται
  choice: na-arụpụta
  rationale: Ọ bụ ezie na ngwaa a dị ntakịrị ike karịa ἐργάζεται, otu nsụgharị ahụ na-echekwa nhazi na ọdịiche nke ahịrịokwu abụọ ahụ n’ụzọ eke.
theological_decisions:
- issue: Ọdịiche dị n’etiti ụdị iru uju abụọ
  choice: “iru uju nke dị ka uche Chineke si dị” megide “iru uju nke ụwa”
  alternative: “iru uju nsọ” megide “iru uju mmadụ nkịtị”
  rationale: Nhọrọ a na-echekwa ọdịiche Pọl mere n’enweghị ịkọwapụta “ọnwụ” dịka naanị ọnwụ nke mmụọ, anụ ahụ, ma ọ bụ ikpeazụ.
- issue: Njikọ dị n’etiti nchegharị na nzọpụta
  choice: “nchegharị nke na-eduga ná nzọpụta”
  alternative: “nchegharị maka nzọpụta” ma ọ bụ “nchegharị nke na-eweta nzọpụta”
  rationale: Nke a na-egosi nzọpụta dịka ebe nchegharị ahụ na-eduga, ma ọ naghị ebubata nkọwa ụka pụrụ iche banyere otú nchegharị na nzọpụta si arụkọ ọrụ.
- issue: Ihe ἀμεταμέλητον na-akọwa
  choice: Debe ya n’isi ahịrịokwu ka ọ metụta usoro nchegharị-na-eduga-ná-nzọpụta, tinyekwa nkọwa ala peeji
  alternative: 'Jikọta ya kpọmkwem na “nchegharị”: “nchegharị a na-agaghị akwa ụta maka ya”'
  rationale: Usoro okwu Grik na-enye ohere nghọta abụọ; isi nsụgharị na nkọwa ala peeji na-echekwa mgbagwoju anya ahụ kama idozi ya n’ike.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E jiri “nchegharị” mee ihe maka μετάνοια n’ihi na ọ bụ okwu Akwụkwọ Nsọ a maara nke ọma ma na-egosi mgbanwe omume na ntụgharị uche n’ụzọ zuru ezu. E debere akara nkọwa [b][a] n’ebe ha dị na ederede isi.
