id: 2CO.7.1
reference: 2 Corinthians 7:1
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ταύτας οὖν ἔχοντες τὰς ἐπαγγελίας, ἀγαπητοί, καθαρίσωμεν ἑαυτοὺς ἀπὸ παντὸς μολυσμοῦ σαρκὸς καὶ πνεύματος, ἐπιτελοῦντες ἁγιωσύνην ἐν φόβῳ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/007/001.yaml
  text: Therefore[a], since we have these promises, beloved, let us cleanse ourselves from every defilement of flesh and spirit[c][b], bringing holiness to completion in the fear of God.
translation:
  language: ig
  text: Ya mere, ebe anyị nwere nkwa ndị a, ndị m hụrụ n’anya, ka anyị sachapụ onwe anyị ná mmetọ niile nke anụ ahụ na nke mmụọ[a], na-eme ka ịdị nsọ zuo oke[b] n’ịtụ egwu Chineke.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “ihe niile na-adịghị ọcha nke ahụ na nke mmụọ.”
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsị, “na-eme ka ịdị nsọ ruo n’uju.”
    reason: lexical_alternative
  - marker: c
    text: “Ịtụ egwu Chineke” ebe a gụnyere ịtụnanya na nkwanye ùgwù miri emi n’ihu Chineke; ọ bụghị naanị oke ụjọ.
    reason: lexical_clarification
lexical_decisions:
- source_word: ταύτας ... τὰς ἐπαγγελίας
  choice: nkwa ndị a
  rationale: “Nkwa” bụ okwu Igbo doro anya maka ἐπαγγελία, ebe “ndị a” na-atụgharị uche gaa ná nkwa ndị e kwuru tupu amaokwu a.
- source_word: οὖν
  choice: Ya mere
  rationale: Ọ na-egosi nkwubi okwu ma ọ bụ ndụmọdụ sitere n’ihe Pọl kwuru tupu ya.
- source_word: ἀγαπητοί
  choice: ndị m hụrụ n’anya
  rationale: Nke a na-egosipụta ịhụnanya dị n’okwu ịkpọ oku ahụ n’Igbo dị ndụ ma dị ùgwù.
- source_word: καθαρίσωμεν ἑαυτοὺς
  choice: ka anyị sachapụ onwe anyị
  rationale: “Ka anyị” na-echekwa ụdị agbamume nke onye na-ekwu okwu tinyere onwe ya na ndị ọ na-agwa; “sachapụ” kwekọrọ n’echiche iwepụ mmetọ.
- source_word: ἀπὸ παντὸς μολυσμοῦ
  choice: ná mmetọ niile
  rationale: “Mmetọ” na-eburu echiche nke ihe na-eme mmadụ ghara ịdị ọcha n’omume ma ọ bụ n’ofufe; “niile” na-egosipụta παντός.
- source_word: σαρκὸς καὶ πνεύματος
  choice: nke anụ ahụ na nke mmụọ
  rationale: “Anụ ahụ” na “mmụọ” na-echekwa akụkụ abụọ e jikọtara ọnụ n’asụsụ Grik, n’ebughị ụzọ kọwaa σάρξ dị ka “ọdịdị mmehie.”
- source_word: ἐπιτελοῦντες ἁγιωσύνην
  choice: na-eme ka ịdị nsọ zuo oke
  rationale: Ụdị a na-echekwa participle ahụ dị ka omume na-eso nsachapụ ahụ, ma na-egosipụta ime ka ịdị nsọ ruo ná njedebe ya.
- source_word: ἐν φόβῳ θεοῦ
  choice: n’ịtụ egwu Chineke
  rationale: Nke a na-echekwa okwu siri ike “egwu Chineke,” kama ime ka ọ bụrụ naanị nsọpụrụ, ebe ihe ọ pụtara gụnyere egwu jupụtara ná nkwanye ùgwù.
theological_decisions:
- issue: Ihe σάρξ pụtara n’okwu “mmetọ nke anụ ahụ na nke mmụọ”
  choice: A tụgharịrị ya “anụ ahụ.”
  alternative: “ahụ” ma ọ bụ “ọdịdị mmehie”
  rationale: Njikọ ya na “mmụọ” na-egosi akụkụ ahụ mmadụ na akụkụ ime mmụọ ya, ọ bụghị n’ụzọ doro anya echiche pụrụ iche nke ọchịchọ mmehie.
- issue: Ike dị na καθαρίσωμεν
  choice: “ka anyị sachapụ onwe anyị” dị ka agbamume metụtara Pọl na ndị na-agụ ya
  alternative: “anyị kwesịrị ịsachapụ onwe anyị”
  rationale: Ụdị subjunctive onye mbụ ọtụtụ n’asụsụ Grik bụ agbamume jikọrọ onye na-ekwu na ndị ọ na-agwa, ọ bụghị naanị nkwupụta banyere ọrụ ha kwesịrị ịrụ.
- issue: Ihe φόβος θεοῦ pụtara
  choice: E debere ya dị ka “ịtụ egwu Chineke.”
  alternative: “ịsọpụrụ Chineke nke ukwuu”
  rationale: Okwu ahụ gụnyere egwu jupụtara ná nkwanye ùgwù na ịtụnanya; idowe “egwu” na-echekwa ịdị arọ na esemokwu dị n’okwu Akwụkwọ Nsọ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E debere usoro agbamume “ka anyị,” okwu ahụ na mmụọ, na okwu siri ike “ịtụ egwu Chineke,” ebe e ji nkọwa ala peeji gosi ụzọ ntụgharị ndị ọzọ na-enweghị idozi nghọta nwere ike ịdị iche n’ime isi amaokwu ahụ.
