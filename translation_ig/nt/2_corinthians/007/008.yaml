revisions:
- from: N’ihi na ọ bụrụgodị na m ji akwụkwọ ozi ahụ mee ka obi wute unu, anaghị m akwa ụta maka ya—ọ bụ ezie na m kwara ụta maka ya[a], n’ihi na ana m ahụ na akwụkwọ ozi ahụ mere ka obi wute unu, ma ọ bụ naanị nwa oge[b].
  to: N’ihi na ọ bụ ezie na m ji akwụkwọ ozi ahụ mee ka obi wute unu, anaghị m akwa ụta maka ya—ọ bụ ezie na m kwara ụta maka ya[a], n’ihi na ahụ m na akwụkwọ ozi ahụ mere ka obi wute unu, ma ọ dị naanị nwa oge[b].
  rationale: The revision clarifies the concessive force in the opening clause, uses a natural present expression for Paul’s recognition, explicitly links the short duration to the sorrow, and corrects the inaccurate literal gloss in footnote b. It preserves the source's ambiguity about the precise extent of the earlier regret and introduces no doctrinal interpretation.
