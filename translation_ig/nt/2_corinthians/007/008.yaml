source:
  edition: SBLGNT
  text: ὅτι εἰ καὶ ἐλύπησα ὑμᾶς ἐν τῇ ἐπιστολῇ, οὐ μεταμέλομαι· εἰ καὶ μετεμελόμην (⸀βλέπω ὅτι ἡ ἐπιστολὴ ἐκείνη εἰ καὶ πρὸς ὥραν ἐλύπησεν ὑμᾶς),
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/007/008.yaml
  text: For even if I grieved you with the letter[a], I do not regret it—though I did regret it, for I see that that letter grieved you[b], though only for a time.
translation:
  language: ig
  text: N’ihi na ọ bụ ezie na m ji akwụkwọ ozi ahụ mee ka obi wute unu, anaghị m akwa ụta maka ya—ọ bụ ezie na m kwara ụta maka ya[a], n’ihi na ahụ m na akwụkwọ ozi ahụ mere ka obi wute unu, ma ọ dị naanị nwa oge[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ọ bụ ezie na m nọ na-akwa ụta maka ya.” Oge imperfect Grik nwere ike imesi ọnọdụ ịkwa ụta nke dịgidere n’oge gara aga ike.
    reason: lexical_alternative
  - marker: b
    text: N’ụzọ nkịtị, “maka otu awa”; nke a bụ akpaalaokwu pụtara “obere oge.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλύπησα / ἐλύπησεν
  choice: mee ka obi wute
  rationale: Nkebiokwu a na-egosi ime ka mmadụ nwee mwute ma ọ bụ nhụjuanya n’obi. “Mee ka obi wute” bụ Igbo doro anya ma dịkwa eke, ma na-echekwa mmetụta okwu Grik ahụ.
- source_word: ἐν τῇ ἐπιστολῇ
  choice: ji akwụkwọ ozi ahụ
  rationale: ἐν na-arụ ọrụ dịka ihe e ji mee ihe n’ebe a. “Ji akwụkwọ ozi ahụ” na-egosi na akwụkwọ ozi ahụ bụ ụzọ Pọl si mee ka obi wute ha.
- source_word: μεταμέλομαι
  choice: anaghị m akwa ụta maka ya
  rationale: N’ebe a, okwu ahụ pụtara ịkwa ụta n’ihi ihe mere, ọ bụghị nchegharị n’ihu Chineke. Nhọrọ a na-echekwa ọdịiche ahụ.
- source_word: μετεμελόμην
  choice: m kwara ụta maka ya
  rationale: Oge imperfect Grik na-egosi ọnọdụ ịkwa ụta n’oge gara aga. Isi nsụgharị ahụ na-enye ọdịiche doro anya n’etiti ụta gara aga na enweghị ụta ugbu a; ihe e dere n’ala peeji na-egosi ọdịdị na-aga n’ihu nke imperfect ahụ.
- source_word: βλέπω
  choice: ana m ahụ
  rationale: Nke a na-echekwa present tense na echiche nke Pọl na-achọpụta ma na-aghọta mmetụta akwụkwọ ozi ahụ.
- source_word: ἡ ἐπιστολὴ ἐκείνη
  choice: akwụkwọ ozi ahụ
  rationale: “Ahụ” na-echekwa ike demonstrative nke ἐκείνη ma na-ada ka Igbo nke oge a.
- source_word: πρὸς ὥραν
  choice: naanị nwa oge
  rationale: Nke a bụ akpaalaokwu pụtara obere oge, ọ bụghị kpọmkwem otu elekere. “Naanị nwa oge” na-egosi na mwute ahụ adịteghị aka.
- source_word: εἰ καὶ
  choice: ọ bụrụgodị na / ọ bụ ezie na
  rationale: E jiri ụzọ abụọ a na-asụkarị n’Igbo gosipụta nkebiokwu concessive ndị a ugboro ugboro, na-enweghị ime ka ahịrịokwu ahụ sie ike nghọta.
theological_decisions:
- issue: Ihe μεταμέλομαι pụtara n’otú Pọl si kọwaa mmetụta ya
  choice: ịkwa ụta
  alternative: ichegharị; ime ebere n’obi
  rationale: Ihe gbara amaokwu ahụ gburugburu bụ mmetụta Pọl banyere mwute akwụkwọ ozi ya wetara, ọ bụghị nkwupụta banyere nchegharị mmehie. “Ịkwa ụta” na-ezere itinye echiche nkà mmụta okpukpe nke okwu Grik ahụ anaghị achọ n’ebe a.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. A na-echekwa ntụgharị uche Pọl—ọ naghị akwa ụta ugbu a, ọ bụ ezie na ọ kwara ụta n’oge gara aga—na-enweghị ime ka esemokwu mmetụta ahụ laa n’iyi.
