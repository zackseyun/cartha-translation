id: 2CO.7.6
reference: 2 Corinthians 7:6
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἀλλ’ ὁ παρακαλῶν τοὺς ταπεινοὺς παρεκάλεσεν ἡμᾶς ὁ θεὸς ἐν τῇ παρουσίᾳ Τίτου·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/007/006.yaml
  text: But God[a], who comforts the humble[b], comforted us by the coming of Titus.
translation:
  language: ig
  text: Ma Chineke, onye na-akasi ndị e wedara n’ala obi[a], kasịrị anyị obi site n’ọbịbịa Taịtọs[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ndị dara mbà,” “ndị dị ala,” ma ọ bụ “ndị dị umeala n’obi.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “site n’ịnọ Taịtọs n’etiti anyị.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλ’
  choice: Ma
  rationale: Ọ na-egosi mgbanwe megide ahụhụ na nsogbu Pọl kwuru banyere ha n’amaokwu bu ụzọ.
- source_word: ὁ παρακαλῶν
  choice: onye na-akasi ... obi
  rationale: Nkebi a na-akọwa Chineke site n’omume ọ na-eme mgbe niile. ‘Ịkasi obi’ dabara n’ọnọdụ ahụhụ a ma na-ejigide njikọ ya na παρεκάλεσεν.
- source_word: τοὺς ταπεινοὺς
  choice: ndị e wedara n’ala
  rationale: Nke a nwere ike ịpụta ndị ọnọdụ ha mere ka ha dị ala ma ọ bụ daa mbà. Nhọrọ a na-egosipụta ịbụ ndị e wedara ala n’enweghị ime ka ọ bụrụ naanị ịdị umeala n’obi dị ka àgwà.
- source_word: παρεκάλεσεν
  choice: kasịrị anyị obi
  rationale: A tụgharịrị ya n’otu ụzọ ahụ e si tụgharịa παρακαλῶν iji chekwaa nkwughachi okwu Grik na echiche nkasi obi dị n’amaokwu ahụ.
- source_word: ἐν τῇ παρουσίᾳ
  choice: site n’ọbịbịa
  rationale: παρουσία nwere ike ịpụta ọbịbịa ma ọ bụ ịnọ ya. N’ebe a, ọbịbịa Taịtọs bụ ụzọ Chineke si kasie ha obi; ihe ọzọ okwu ahụ nwere ike ịpụta dị n’okpuru peeji.
- source_word: Τίτου
  choice: Taịtọs
  rationale: Nke a bụ nsụgharị aha onye ahụ n’ụzọ dabara n’usoro mkpụrụokwu na mkpọpụta Igbo.
- source_word: ὁ θεὸς
  choice: Chineke
  rationale: E debere Chineke dị ka onye mere omume ahụ, dịka o doro anya n’ederede Grik.
theological_decisions:
- issue: Ihe τοὺς ταπεινοὺς pụtara n’ọnọdụ a
  choice: ndị e wedara n’ala
  alternative: ndị dara mbà; ndị dị ala; ndị dị umeala n’obi
  rationale: Okwu Grik ahụ nwere ike ịkọwa ndị ọnọdụ ha wedara ala ma ọ bụ ndị dara mbà n’obi. Isiokwu banyere nkasi obi na-akwado echiche nke ndị ahụhụ dara, ma nsụgharị ahụ ekwesịghị imechi ụzọ ndị ọzọ okwu ahụ nwere ike isi pụta.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị ùgwù ma dị mfe nghọta. A họọrọ ‘ndị e wedara n’ala’ iji chekwaa obosara ihe ταπεινούς nwere ike ịpụta, ebe nkọwa ala peeji na-egosi ụzọ ndị ọzọ. E debere akara nkọwa [a] na [b] kpọmkwem n’ebe okwu ndị ha na-akọwa dị.
