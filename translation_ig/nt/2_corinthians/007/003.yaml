id: 2CO.7.3
reference: 2 Corinthians 7:3
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ⸂πρὸς κατάκρισιν οὐ⸃ λέγω, προείρηκα γὰρ ὅτι ἐν ταῖς καρδίαις ἡμῶν ἐστε εἰς τὸ συναποθανεῖν καὶ συζῆν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/007/003.yaml
  text: I do not say this to condemn you[a], for I have said before that you are in our hearts[b], to die together and to live together.
translation:
  language: ig
  text: Anaghị m ekwu nke a iji maa unu ikpe[a], n’ihi na ekwuola m na mbụ na unu nọ n’obi anyị[b], ka anyị na unu nwụọkọ ma dịkọ ndụ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “maka ịma unu ikpe,” ma ọ bụ, “n’ebumnuche ịma unu ikpe.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “unu nọ n’obi anyị, maka ịnwụkọ ọnụ na ịdịkọ ndụ ọnụ.” Grik ahụ na-emesi ịdị n’otu n’ọnwụ na ná ndụ ike.
    reason: lexical_alternative
lexical_decisions:
- source_word: πρὸς κατάκρισιν
  choice: iji maa unu ikpe
  rationale: Nkebi a na-egosi ebumnuche ma ọ bụ ihe okwu ahụ na-ele anya ime. “Iji maa unu ikpe” bụ Igbo doro anya nke na-egosi na okwu Pọl abụghị maka ikpe ha ikpe.
- source_word: λέγω
  choice: Anaghị m ekwu nke a
  rationale: Oge ugbu a dị na Grik ka e gosipụtara n’ụzọ dị ndụ n’Igbo; “nke a” na-ezo aka n’okwu ndị Pọl kwuru tupu amaokwu a.
- source_word: προείρηκα
  choice: ekwuola m na mbụ
  rationale: Ụdị perfect nke Grik na-egosi ihe e kwuru na mbụ nke ka dị mkpa ugbu a; “ekwuola m na mbụ” na-echekwa echiche abụọ ahụ.
- source_word: ἐν ταῖς καρδίαις ἡμῶν ἐστε
  choice: unu nọ n’obi anyị
  rationale: N’Igbo, “obi anyị” bụ ụzọ ebumpụta ụwa isi kwuo ịhụnanya miri emi na njikọ dị n’ime, ma na-echekwa onye-nnọchiaha ọtụtụ nke “anyị.”
- source_word: εἰς τὸ συναποθανεῖν καὶ συζῆν
  choice: ka anyị na unu nwụọkọ ma bikọkwa ndụ
  rationale: “Ka” na-egosi njikọ nke ebumnuche ma ọ bụ nsonaazụ dị na εἰς τό, ebe “nwụọkọ” na “bikọkwa ndụ” na-echekwa συν- nke ngwaa abụọ ahụ na nkwado ha na ibe ha.
theological_decisions:
- issue: Ma a ga-akọwa ‘ịnwụkọ na ibikọ ndụ’ kpọmkwem dị ka ọgbụgba ndụ, alụmdi na nwunye, ma ọ bụ ịdị n’otu n’ime Kraịst
  choice: E debere ya dị ka okwu na-egosi ịhụnanya na nkwado miri emi n’etiti Pọl na ndị Kọrịnt.
  alternative: Ịkọwa ya kpọmkwem dị ka ntụaka nye iguzosi ike n’ihe n’ọgbụgba ndụ ma ọ bụ iso Kraịst bụrụ otu.
  rationale: Amaokwu ahụ na-egosi nkwado siri ike n’ọnwụ na ndụ, ma ọ naghị akpọ otu nkọwa nkà mmụta okpukpe kpọmkwem; ya mere, nsụgharị ahụ anaghị etinye nkọwa dị warara n’ime ya.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta. “Maa ikpe” bụ okwu a na-anụkarị maka condemnation; “nwụọkọ” na “bikọkwa ndụ” na-echekwa nhazi na ike mmetụta nke ngwaa Grik abụọ nwere συν-.
