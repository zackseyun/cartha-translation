  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ τὰ σπλάγχνα αὐτοῦ περισσοτέρως εἰς ὑμᾶς ἐστιν ἀναμιμνῃσκομένου τὴν πάντων ὑμῶν ὑπακοήν, ὡς μετὰ φόβου καὶ τρόμου ἐδέξασθε αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/007/015.yaml
  text: And his affection for you is even greater as he remembers the obedience of all of you[a], how you received him with fear and trembling.
translation:
  language: ig
  text: Ịhụnanya miri emi o nwere n'ebe unu nọ ka ukwuu mgbe ọ na-echeta nrubeisi unu niile, na otú unu si jiri egwu na ịma jijiji nabata ya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “jiri nsọpụrụ na ịma jijiji.” Okwu a bụ akpaala okwu Pọl ji akọwa nzaghachi nke ịdị uchu, ịdị umeala, na nsọpụrụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: σπλάγχνα
  choice: ịhụnanya miri emi
  rationale: Okwu ahụ pụtara akụkụ ime ahụ n'ụzọ nkịtị, ma ebe a ọ bụ akpaala okwu maka mmetụta ịhụnanya dị omimi na nke dị nro.
- source_word: περισσοτέρως
  choice: na-abawanye ọbụna karịa
  rationale: Nke a na-egosipụta mmụba n'ogo mmetụta Taịtọs n'ebe ha nọ.
- source_word: εἰς ὑμᾶς
  choice: n'ebe unu nọ
  rationale: Ọ na-egosi ebe ịhụnanya ahụ chere ihu, ma na-edobe ọtụtụ mmadụ dị na ὑμᾶς.
- source_word: ἀναμιμνῃσκομένου
  choice: mgbe ọ na-echeta
  rationale: 'Ọ na-egosi ọnọdụ na-aga n''otu oge ahụ: mmetụta ya na-abawanye ka ọ na-echeta ihe mere.'
- source_word: ὑπακοήν
  choice: nrubeisi
  rationale: Nke a bụ nsụgharị kwụ ọtọ nke okwu ahụ, na-ekwu maka nzaghachi ha nye ntụziaka e nyere ha.
- source_word: πάντων ὑμῶν
  choice: unu niile
  rationale: Ọ na-emesi ike na ọ bụ ọgbakọ ahụ dum ka a na-ekwu maka ya.
- source_word: μετὰ φόβου καὶ τρόμου
  choice: jiri egwu na ịma jijiji
  rationale: A hapụrụ akpaala okwu Pọl n'ụdị doro anya, ebe nkọwa ala peeji na-egosi na ọ pụrụ ịpụta nsọpụrụ siri ike na nzaghachi dị umeala.
- source_word: ἐδέξασθε
  choice: nabata
  rationale: Ọ na-agụnye ịnabata Taịtọs na ịkwado ọbịbịa ya, n'enweghị itinye nkọwa karịrị nke ederede.
- source_word: αὐτόν
  choice: ya
  rationale: A na-edobe nnọchiaha dị n'asụsụ Grik; ihe ndị gbara amaokwu ahụ gburugburu na-egosi na ọ bụ Taịtọs.
theological_decisions:
- issue: Ihe okwu “egwu na ịma jijiji” pụtara n'otú ndị Kọrịnt si nabata Taịtọs
  choice: Idobe akpaala okwu ahụ n'isi ederede, ma kọwaa na ọ na-egosi ịdị uchu, nsọpụrụ, na nzaghachi dị umeala
  alternative: Ịsụgharị ya ozugbo dịka “jiri nsọpụrụ na ịma jijiji” ma ọ bụ were ya dị ka oke ụjọ nkịtị
  rationale: Akpaala okwu a Pọl ji nwere ike ibu mmetụta nke egwu na nke nsọpụrụ siri ike. Idobe ya na-echekwa mgbagwoju anya ahụ kama ikpebi naanị otu nkọwa.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. “Ịhụnanya miri emi” na-ebute mmetụta dị nro nke σπλάγχνα n'ụzọ okike; e debere “egwu na ịma jijiji” iji chekwaa akpaala okwu na esemokwu nkọwa ya.
