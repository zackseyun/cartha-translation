id: 2CO.7.11
reference: 2 Corinthians 7:11
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἰδοὺ γὰρ αὐτὸ τοῦτο τὸ κατὰ θεὸν ⸀λυπηθῆναι πόσην κατειργάσατο ὑμῖν σπουδήν, ἀλλὰ ἀπολογίαν, ἀλλὰ ἀγανάκτησιν, ἀλλὰ φόβον, ἀλλὰ ἐπιπόθησιν, ἀλλὰ ζῆλον, ἀλλὰ ἐκδίκησιν· ἐν παντὶ συνεστήσατε ἑαυτοὺς ἁγνοὺς ⸀εἶναι τῷ πράγματι.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/007/011.yaml
  text: 'For see what earnestness this very grief according to God has produced in you: but also a defense[a], but also indignation, but also fear, but also longing, but also zeal, but also vindication[c][b]. In every way you proved yourselves to be pure in the matter.'
translation:
  language: ig
  text: N’ihi na, leenụ otú mwute a kpọmkwem dị ka Chineke si chọọ[a] siri rụpụta ịdị uchu dị ukwuu n’ime unu—ọzọkwa, ịgbachitere onwe unu[b]; ọzọkwa, iwe; ọzọkwa, egwu; ọzọkwa, ọchịchọ siri ike; ọzọkwa, ịnụ ọkụ n’obi; ọzọkwa, ịnye ntaramahụhụ[c]. N’ụzọ niile, unu gosiri na aka unu dị ọcha n’okwu ahụ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “mwute a kpọmkwem nke kwekọrọ n’uche Chineke.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ime ka o doo anya na aka unu dị ọcha.”
    reason: lexical_alternative
  - marker: c
    text: Ma ọ bụ, “ime ka e dozie mmejọ ahụ” ma ọ bụ “ime ka ikpe ziri ezi dịrị”; okwu a nwekwara ike ịpụta “ịbọ ọbọ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ γὰρ
  choice: N’ihi na, leenụ
  rationale: “N’ihi na” na-egosipụta njikọ γάρ, ebe “leenụ” na-akpọ ndị na-agụ ya ka ha lekwasị anya n’ihe akaebe Pọl na-edepụta.
- source_word: αὐτὸ τοῦτο τὸ κατὰ θεὸν λυπηθῆναι
  choice: mwute a kpọmkwem nke kwekọrọ n’uche Chineke
  rationale: A sụgharịrị infinitive ahụ dị ka aha “mwute”; “kwekọrọ n’uche Chineke” na-eme ka κατὰ θεόν doo anya n’Igbo n’ebughị ụzọ kpebie nkọwa ya karịa ihe Grik kwuru.
- source_word: πόσην κατειργάσατο ὑμῖν σπουδήν
  choice: si rụpụta nnukwu ịnụ ọkụ n’obi n’ime unu
  rationale: κατεργάζομαι na-egosi ihe kpatara nsonaazụ, ebe σπουδή bụ ịdị ngwa na ịdị uchu sitere n’ezi nchegharị.
- source_word: ἀλλὰ
  choice: ọzọkwa
  rationale: ἀλλά ndị a a na-emegharị abụghị nnukwu mmegide n’ebe a; ha na-agbakwụnye ihe akaebe n’usoro na-arị elu. “Ọzọkwa” na-eme ka mmegharị ahụ bụrụ Igbo nkịtị.
- source_word: ἀπολογίαν
  choice: ịgbachitere onwe unu
  rationale: N’ọnọdụ a okwu ahụ bụ nzaghachi ha ji kọwaa ma gosipụta na ha akwadoghị mmehie ahụ.
- source_word: ἀγανάκτησιν
  choice: iwe dị ọkụ
  rationale: Ọ na-egosi nnukwu iwe ma ọ bụ ịjụ ihe ọjọọ n’obi, ma a hapụrụ onye ma ọ bụ ihe iwe ahụ metụtara n’enweghị nkọwa dịka Grik si mee.
- source_word: φόβον
  choice: egwu
  rationale: A họọrọ okwu sara mbara n’ihi na Grik ekwughị kpọmkwem onye ha tụrụ egwu ma ọ bụ ụdị egwu ọ bụ.
- source_word: ἐπιπόθησιν
  choice: agụụ siri ike
  rationale: Ọ na-egosi ọchịchọ miri emi, ma a tinyeghị ihe ọchịchọ ahụ lekwasịrị anya n’ihi na isi mmalite ahụ ekwughị ya.
- source_word: ζῆλον
  choice: ịnụ ọkụ n’obi
  rationale: Nke a na-egosipụta ume na ekworo siri ike ime ihe ziri ezi, ma na-anọgide bụrụ okwu dị iche n’echiche σπουδή nke dị na mbụ.
- source_word: ἐκδίκησιν
  choice: ime ka ikpe ziri ezi guzosie ike
  rationale: Nhọrọ a na-egosi ime ihe iji dozie mmejọ ma zere ime ka ọ bụrụ ịbọ ọbọ nke onwe; ihe ntaramahụhụ pụtara ka bụ ihe ọzọ okwu Grik nwere ike ịpụta.
- source_word: ἐν παντὶ συνεστήσατε ἑαυτοὺς ἁγνοὺς εἶναι τῷ πράγματι
  choice: N’ụzọ niile, unu gosiri na aka unu dị ọcha n’okwu ahụ
  rationale: “Gosiri” na-enye echiche evidenshial nke συνίστημι, ebe akpaalaokwu “aka unu dị ọcha” na-ekwupụta ἁγνούς n’Igbo doro anya ma dị ndụ.
theological_decisions:
- issue: Ihe κατὰ θεόν pụtara
  choice: nke kwekọrọ n’uche Chineke
  alternative: mwute sitere n’ịsọpụrụ Chineke / mwute dị ka Chineke chọrọ
  rationale: Nhọrọ ahụ na-echekwa echiche nke mwute kwekọrọ n’ụkpụrụ ma ọ bụ uche Chineke, ma ọ naghị akpọchi ma ọ bụ bibie obosara nkebiokwu Grik ahụ.
- issue: Ihe ἐκδίκησις pụtara n’ọnọdụ nchegharị a
  choice: ime ka ikpe ziri ezi guzosie ike
  alternative: ntaramahụhụ / ịbọ ọbọ maka mmejọ
  rationale: Ọnọdụ ahụ na-ekwu maka nzaghachi ndị Kọrịnt na ihe ha mere iji dozie okwu ahụ. Nhọrọ a anaghị akwado ịbọ ọbọ onwe onye, ma ihe okwu ahụ nwere ike ịpụta gbasara ntaramahụhụ ka edebere n’akwụkwọ nkọwa.
- issue: Ịdị ọcha ha n’okwu ahụ
  choice: aka unu dị ọcha n’okwu ahụ
  alternative: unu bụ ndị na-enweghị ntụpọ n’ihe niile
  rationale: τῷ πράγματι na-amachi nkwupụta ahụ n’okwu a na-ekwu maka ya; a zere ime ka Pọl kwuo na ha enweghị mmehie n’ụzọ zuru ụwa ọnụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị nsọ ma dị mfe nghọta, dee ya. A nọgidere na-emegharị “ọzọkwa” iji chekwaa ike na usoro okwu Pọl, ma jiri akpaalaokwu “aka unu dị ọcha” mee ka nkwubi okwu ahụ bụrụ nke ndị Igbo na-aghọta ozugbo.
