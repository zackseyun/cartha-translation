  variant: Standard Igbo
source:
  edition: SBLGNT
  text: οὐ μόνον δὲ ἐν τῇ παρουσίᾳ αὐτοῦ, ἀλλὰ καὶ ἐν τῇ παρακλήσει ᾗ παρεκλήθη ἐφ’ ὑμῖν, ἀναγγέλλων ἡμῖν τὴν ὑμῶν ἐπιπόθησιν, τὸν ὑμῶν ὀδυρμόν, τὸν ὑμῶν ζῆλον ὑπὲρ ἐμοῦ, ὥστε με μᾶλλον χαρῆναι.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/007/007.yaml
  text: and not only by his coming, but also by the comfort with which he was comforted because of you, as he reported to us your longing, your mourning, and your zeal for me, so that I rejoiced even more.
translation:
  language: ig
  text: Ọ bụghịkwa naanị n’ọbịbịa ya[a] ka e kasiri anyị obi, kama ọ bụkwa n’ihi nkasi obi[b] e ji kasie ya obi n’ihi unu, ka ọ na-akọrọ anyị agụụ unu nwere n’ebe m nọ, iru újú unu[c], na ịnụ ọkụ n’obi unu n’ihi m; nke mere ka m ṅụrịakwuo ọṅụ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “ọnụnọ ya,” n’ọnọdụ “ọbịbịa ya.”
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsị, “agbamume,” n’ọnọdụ “nkasi obi,” n’ebe okwu aha na ngwaa ndị si n’otu mgbọrọgwụ pụtara.
    reason: lexical_alternative
  - marker: c
    text: A pụkwara ịsị, “akwa arịrị unu,” n’ọnọdụ “iru újú unu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: παρουσίᾳ
  choice: ọbịbịa ya
  rationale: N’ọnọdụ njem Taịtọs a, okwu ahụ na-ezo aka n’ọbịbịa ya; nke a bụkwa okwu Igbo doro anya ma dị ndụ.
- source_word: παρακλήσει / παρεκλήθη
  choice: nkasi obi / o nwetara nkasi obi
  rationale: E ji otu usoro okwu mee ka njikọ dị n’etiti aha na ngwaa Grik pụta ìhè, ebe ọnọdụ gbara ya gburugburu metụtara nkasi obi mgbe ahụhụ gasịrị.
- source_word: ἐφ’ ὑμῖν
  choice: n’ihi unu
  rationale: Nke a na-egosi na ihe ndị Kọrịnt mere na nzaghachi ha bụ ihe kpatara ma ọ bụ ihe ndabere nkasi obi Taịtọs; e debere nghọta ahụ n’Igbo nkịtị.
- source_word: ἀναγγέλλων
  choice: Mgbe ọ kọọrọ anyị
  rationale: 'Nke a na-eme ka ọrụ participle ahụ doo anya n’Igbo: akụkọ Taịtọs mere ka Pọl mata ọnọdụ ha.'
- source_word: ἐπιπόθησιν
  choice: oke agụụ unu nwere ịhụ m
  rationale: Ọ na-egosi ọchịchọ siri ike; itinye ‘ịhụ m’ na-eme ka Igbo bụrụ nke eke, ebe onye a na-achọsi ike pụtara site n’ọnọdụ okwu.
- source_word: ὀδυρμόν
  choice: iru újú unu
  rationale: Okwu a na-agụnye mwute miri emi nke a na-egosipụta; ‘iru újú’ bụ okwu Igbo dị ùgwù ma kwekọọ n’ọnọdụ ahụ.
- source_word: ζῆλον
  choice: ịnụ ọkụ n’obi unu
  rationale: Nke a na-egosipụta ịnụ ọkụ n’obi na ịdị uchu siri ike n’ebe Pọl nọ, na-enweghị itinye nkọwa okpukpe pụrụ iche.
- source_word: ὑπὲρ ἐμοῦ
  choice: n’ihi m
  rationale: Nhọrọ a sara mbara nke ọma iji gosi mmasị na nkwado ha n’ebe Pọl nọ, na-enweghị imechi ya naanị n’otu nkọwa.
- source_word: ὥστε με μᾶλλον χαρῆναι
  choice: ọ mere ka m ṅụrịakwuo ọṅụ
  rationale: Ọ na-echekwa ihe si na akụkọ ahụ pụta nakwa ike ntụnyere nke μᾶλλον.
theological_decisions: []
translation_notes:
  register: Standard Igbo dị ugbu a, nke dị ùgwù ma dị mfe nghọta. E kewara ahịrịokwu ahụ ụzọ abụọ iji mee ka ogologo usoro Grik doo anya, ma e chekwara njikọ echiche ya. Ihe nrịba ama ala peeji niile dị n’ederede bụ isi.
