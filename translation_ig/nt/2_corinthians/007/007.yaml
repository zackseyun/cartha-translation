    rationale: ‘Nkasi obi e ji kasie ya obi’ na-echekwa ma passive ahụ ma njikọ mkpụrụokwu ahụ.
  - severity: low
    issue: Ihe nrịba ama ala peeji b nwere mkpụrụedemede ezighi ezi n’okwu ‘agbamume.’
    rationale: Ọ bụ njehie mkpụrụedemede; a ga-ede ya ‘agbamume.’
  - severity: low
