- from: Ọ bụghịkwa naanị ọbịbịa ya[a] kasịrị anyị obi, kama ọ bụkwa nkasi obi[b] o nwetara n’ihi unu. Mgbe ọ kọọrọ anyị oke agụụ unu nwere ịhụ m, iru újú unu[c], na ịnụ ọkụ n’obi unu n’ihi m, ọ mere ka m ṅụrịakwuo ọṅụ.
  to: Ọ bụghịkwa naanị n’ọbịbịa ya[a] ka e kasiri anyị obi, kama ọ bụkwa n’ihi nkasi obi[b] e ji kasie ya obi n’ihi unu, ka ọ na-akọrọ anyị agụụ unu nwere n’ebe m nọ, iru újú unu[c], na ịnụ ọkụ n’obi unu n’ihi m; nke mere ka m ṅụrịakwuo ọṅụ.
  rationale: A degharịrị amaokwu ahụ ka ọ gosipụta n’ụzọ doro anya na e kasiri Pọl na ndị ya obi n’ọbịbịa Taịtọs, nakwa na Taịtọs n’onwe ya bụ onye e kasiri obi n’ihi ndị Kọrịnt. A chekwara njikọ mkpụrụokwu nkasi obi/ịkasị obi, e wepụrụ mgbakwunye kpọmkwem ‘ịhụ m’ ka ‘agụụ’ ghara ịdị warara karịa Grik, ma dozie njehie mkpụrụedemede n’ihe nrịba ama b.
