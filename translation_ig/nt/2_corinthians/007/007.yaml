  verdict: revise
  source_fidelity: 'A chọrọ mmezi iji chekwaa usoro na olu passive nke παρακλήσει / παρεκλήθη: nkasi obi a kàsịrị Taịtọs obi. Ederede mbụ gbanwere ya ka ọ bụrụ naanị ‘nkasi obi o nwetara.’ ‘Mgbe’ nwekwara ike igosi usoro oge siri ike karịa participle ἀναγγέλλων; ‘ka ọ na-akọrọ anyị’ na-egosi njikọ ya nke ọma.'
  naturalness: ‘Ọbịbịa ya kasịrị anyị obi’ nwere ike ịda ka ọbịbịa ahụ n’onwe ya mere ha obi ụtọ, karịa echiche nke e kasiri ha obi n’ọbịbịa ya. ‘Ọ bụghịkwa naanị n’ọbịbịa ya ka e kasiri anyị obi’ dị eke ma doo anya. ‘Agụụ unu nwere n’ebe m nọ’ na-adị mfe karịa itinye ‘ịhụ m,’ nke na-eme ka otu nghọta pụta ìhè karịa ka Grik si kwuo.
  terminology: '‘Nkasi obi’ na ‘ịkasị obi’ na-echekwa njikọ mkpụrụokwu Grik. ‘Iru újú’ na ‘ịnụ ọkụ n’obi’ dabara adaba n’Igbo Standard ma na-echekwa ὀδυρμός na ζῆλος. E mezie typo dị n’ihe nrịba ama b: ‘agbamume.’'
  issues:
  - severity: medium
