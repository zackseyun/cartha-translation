id: 2CO.7.4
reference: 2 Corinthians 7:4
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: πολλή μοι παρρησία πρὸς ὑμᾶς, πολλή μοι καύχησις ὑπὲρ ὑμῶν· πεπλήρωμαι τῇ παρακλήσει, ὑπερπερισσεύομαι τῇ χαρᾷ ἐπὶ πάσῃ τῇ θλίψει ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/007/004.yaml
  text: I have great boldness toward you[a], and great boasting on your behalf. I am filled with encouragement[c][b]; I overflow with joy in all our affliction.
translation:
  language: ig
  text: Enwere m obi ike dị ukwuu n’ebe unu nọ[a], enwekwara m ịnya isi dị ukwuu banyere unu. Nkasi obi jupụtara m[b]; ana m ejubiga ókè n’ọṅụ n’ime mkpagbu anyị niile[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “nnukwu ntụkwasị obi n’ebe unu nọ.” Okwu Greek παρρησία nwekwara ike ịpụta ikwu okwu n’atụghị egwu na n’ezoghị ọnụ.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “agbamume jupụtara m.” Okwu Greek παράκλησις gụnyere nkasi obi, agbamume, na iwusi mmadụ ike.
    reason: lexical_alternative
  - marker: c
    text: Ma ọ bụ, “n’agbanyeghị mkpagbu anyị niile.” E nwekwara ike ịghọta Greek ahụ dịka ọṅụ na-ejubiga ókè n’etiti ahụhụ na-aga n’ihu.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρρησία
  choice: nnukwu nkwuwa okwu
  rationale: Nkebi a na-egosi nkwuwa okwu na nnwere onwe ikwu ihe n’ezoghị ọnụ. Ọ dabara n’otú Pọl si emeso ndị Kọrịnt n’enweghị ụjọ, ma ọ naghị amachi okwu ahụ naanị n’ikwu okwu.
- source_word: πρὸς ὑμᾶς
  choice: n’ebe unu nọ
  rationale: Nke a na-egosi ntụgharị uche na mmekọrịta Pọl nwere n’ebe ndị ọ na-agwa okwu nọ, n’Igbo dị mfe ma kwekọọ n’usoro Greek.
- source_word: καύχησις
  choice: ihe m ji unu anya isi
  rationale: Akpaalaokwu Igbo a na-egosi ịnya isi n’ụzọ dị mma n’ihi ndị ọzọ. Ọ na-ezere nghọta nke mpako onwe onye, ma na-edobe ezi echiche nke καύχησις n’ebe a.
- source_word: ὑπὲρ ὑμῶν
  choice: ji unu
  rationale: N’akpaalaokwu ‘ihe m ji unu anya isi,’ nke a na-egosi na ndị Kọrịnt bụ ihe gbasara ịnya isi Pọl nakwa na ọ na-ekwu maka otuto ha.
- source_word: πεπλήρωμαι
  choice: jupụtara m
  rationale: Nke a na-egosi ọnọdụ dị ugbu a nke sitere n’ihe merela, dịka perfect passive Greek si dị.
- source_word: παρακλήσει
  choice: nkasi obi
  rationale: ‘Nkasi obi’ bụ okwu Igbo kachasị mma n’ọnọdụ mkpagbu a, ma παράκλησις nwekwara ike ịgụnye agbamume na iwusi mmadụ ike; e debere nke ahụ n’ala ala peeji.
- source_word: ὑπερπερισσεύομαι
  choice: na-ejubiga m ókè
  rationale: Nke a na-edobe ike nke ngwaa ahụ, nke pụtara ịba ụba nke ukwuu ma ọ bụ ịjupụta ruo n’ókè karịrị akarị.
- source_word: χαρᾷ
  choice: ọṅụ
  rationale: ‘Ọṅụ’ bụ ntụgharị Igbo kwụ ọtọ, doro anya, ma bụrụ nke a na-ejikarị eme ihe maka χαρά.
- source_word: ἐπὶ πάσῃ τῇ θλίψει ἡμῶν
  choice: n’ime mkpagbu anyị niile
  rationale: Nke a na-edobe ọṅụ na mkpagbu dịka ihe na-adị n’otu oge, kama ịkọwa ya naanị dịka ọṅụ n’agbanyeghị mkpagbu.
- source_word: πολλή ... πολλή
  choice: nnukwu ... nnukwu
  rationale: Ikwughachi ‘nnukwu’ na-edobe nkwughachi na ike okwu Greek, ma na-ada nke ọma na Igbo.
theological_decisions:
- issue: Otu e si akọwa καύχησις Pọl ji mee ihe n’ụzọ dị mma
  choice: ihe m ji unu anya isi
  alternative: ịnya isi banyere unu; ntụkwasị obi m n’ebe unu nọ
  rationale: Nke a na-edobe okwu ịnya isi Pọl, ma ihe gbara ya gburugburu na-egosi na ọ bụghị mpako mmehie ma ọ bụ ibuli onwe ya elu.
- issue: Idobe esemokwu dị n’etiti ọṅụ na ahụhụ
  choice: n’ime mkpagbu anyị niile
  alternative: n’agbanyeghị mkpagbu anyị niile
  rationale: Greek na-egosi na ọṅụ na-ejubiga Pọl ókè mgbe mkpagbu ka dị. ‘N’ime’ na-edobe ịdịkọ ọnụ ahụ ma ghara ịgbanwe ya ka ọ bụrụ naanị ihe megidere mkpagbu.
translation_notes:
  register: Asụsụ ahụ bụ Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta. E ji ‘unu’ debe plural nke Greek. Akpaalaokwu ‘ihe m ji unu anya isi’ na-eme ka echiche ọma nke καύχησις doo anya n’Igbo, ebe ‘na-ejubiga m ókè’ na-edobe ihe atụ nke oke ụba.
