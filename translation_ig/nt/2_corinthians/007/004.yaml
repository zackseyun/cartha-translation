revisions:
- from: Enwere m nnukwu nkwuwa okwu n’ebe unu nọ[a], enwekwara m nnukwu ihe m ji unu anya isi. Nkasi obi jupụtara m[b]; ọṅụ na-ejubiga m ókè n’ime mkpagbu anyị niile[c].
  to: Enwere m obi ike dị ukwuu n’ebe unu nọ[a], enwekwara m ịnya isi dị ukwuu banyere unu. Nkasi obi jupụtara m[b]; ana m ejubiga ókè n’ọṅụ n’ime mkpagbu anyị niile[c].
  rationale: The revision makes only safe linguistic corrections. It renders the first-person Greek verb ὑπερπερισσεύομαι with Paul as subject, chooses more natural Standard Igbo for παρρησία, and makes the positive καύχησις phrase more direct. It retains the source’s ambiguity concerning ἐπὶ πάσῃ τῇ θλίψει ἡμῶν and preserves the lexical alternatives in properly anchored footnotes.
