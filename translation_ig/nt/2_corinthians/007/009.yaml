revisions:
- from: Ugbu a, ana m aṅụrị, ọ bụghị n’ihi na unu wutere, kama n’ihi na mwute unu mere ka unu chegharịa[a]. N’ihi na unu wutere n’ụzọ kwekọrọ na Chineke[b], ka unu wee ghara ịta mfu ọ bụla n’aka anyị[c].
  to: Ugbu a, enwere m ọṅụ, ọ bụghị n’ihi na obi wutere unu, kama n’ihi na obi wutere unu ruo nchegharị[a]. N’ihi na obi wutere unu dịka Chineke si chọọ[b], ka unu ghara ịnata mfu ọ bụla site n’aka anyị[c].
  rationale: The revision corrects the active-sounding rendering of the Greek passive ἐλυπήθητε, restores the explicit noun “nchegharị” for μετάνοια, and makes the κατὰ θεόν expression more idiomatic in Standard Igbo. It retains the source’s repeated grief wording, its causal/purpose structure, and the broad source relation in ἐξ ἡμῶν. Footnote markers are all present and each note is attached to the corresponding expression.
