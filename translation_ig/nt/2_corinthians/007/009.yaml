  text: νῦν χαίρω, οὐχ ὅτι ἐλυπήθητε, ἀλλ’ ὅτι ἐλυπήθητε εἰς μετάνοιαν, ἐλυπήθητε γὰρ κατὰ θεόν, ἵνα ἐν μηδενὶ ζημιωθῆτε ἐξ ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/007/009.yaml
  text: Now I rejoice[a], not because you were grieved, but because you were grieved into a change of mind; for you were grieved according to God[c][b], so that you might suffer no loss from us.
translation:
  language: ig
  text: Ugbu a, enwere m ọṅụ, ọ bụghị n’ihi na obi wutere unu, kama n’ihi na obi wutere unu ruo nchegharị[a]. N’ihi na obi wutere unu dịka Chineke si chọọ[b], ka unu ghara ịnata mfu ọ bụla site n’aka anyị[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “mwute unu dugara unu ná nchegharị,” ma ọ bụ, “ka unu chegharịa.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “n’ụzọ kwekọrọ n’uche Chineke,” ma ọ bụ, “n’ụzọ na-asọpụrụ Chineke.”
    reason: lexical_alternative
  - marker: c
    text: Ma ọ bụ, “ka unu ghara ịnata mmerụ ọ bụla n’ihi anyị.”
    reason: lexical_alternative
lexical_decisions:
- source_word: νῦν χαίρω
  choice: Ugbu a, ana m aṅụrị
  rationale: Ọ na-egosi ọṅụ Pọl nwere ugbu a, dị iche n’ọnọdụ gara aga, ma na-edobe ike nke ngwaa χαίρω.
- source_word: ἐλυπήθητε
  choice: unu wutere / mwute unu
  rationale: Nke a bụ Igbo dị mfe ma dị ndụ maka inwe mwute; ikwughachi okwu sitere n’otu mgbọrọgwụ na-egosipụtakwa nkwughachi dị na Grik.
- source_word: εἰς μετάνοιαν
  choice: mwute unu mere ka unu chegharịa
  rationale: εἰς na-egosi ihe mwute ahụ rụpụtara ma ọ bụ ebe ọ dugara ha; ‘chegharịa’ na-egosi mgbanwe nke uche na ụzọ ndụ kwesịrị ekwesị n’ọnọdụ a.
- source_word: κατὰ θεόν
  choice: n’ụzọ kwekọrọ na Chineke
  rationale: Nke a na-edobe njikọ mwute ahụ na Chineke n’ebughị ụzọ mechie ma ọ̀ bụ dịka ụkpụrụ Chineke, uche ya, ma ọ bụ ụzọ ọ chọrọ.
- source_word: ζημιωθῆτε
  choice: ịta mfu ọ bụla
  rationale: Ọ na-egosi ịla ihe ma ọ bụ ịnata ọghọm, na-enweghị ime ka ọ bụrụ naanị mmerụ ahụ.
- source_word: ἐξ ἡμῶν
  choice: n’aka anyị
  rationale: Ọ bụ ụzọ Igbo si egosi na mfu ahụ nwere ike isi n’aka Pọl na ndị ya bịa, ma na-edobe echiche nke isi mmalite dị na ἐξ.
theological_decisions:
- issue: Ihe κατὰ θεόν pụtara banyere mwute ahụ
  choice: n’ụzọ kwekọrọ na Chineke
  alternative: dị ka Chineke chọrọ; n’ụzọ na-asọpụrụ Chineke
  rationale: Nhọrọ a na-ahapụ oghe ma okwu ahụ ọ na-ekwu maka ụkpụrụ Chineke, uche ya, ma ọ bụ ụdị mwute dabara n’ihu ya; ọ naghị eme ka otu nkọwa bụrụ naanị nke ziri ezi.
- issue: Ike omume nke μετάνοια
  choice: chegharịa
  alternative: gbanwee uche
  rationale: N’ọnọdụ a, μετάνοια abụghị naanị ịgbanwe echiche nkịtị; ọ nwere ike omume na nke ime mmụọ. ‘Chegharịa’ bụ okwu Igbo doro anya nke na-eburu ike ahụ n’enweghị ịtinye ozizi otu ụka.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. A họọrọ ahịrịokwu ndị na-asụ nke ọma n’Igbo, ma e chekwara nkwughachi, ntụzịaka gaa ná nchegharị, na nghọtahie nwere ike ịdị na κατὰ θεόν na ἐξ ἡμῶν.
