- from: N’ihi nke a, a kasịala anyị obi[a]. Ma tinyere nkasi obi anyị, anyị ṅụrịrị ọṅụ karịa nnọọ n’ihi ọṅụ Taịtọs, n’ihi na mmụọ ya enwetawo ume ọhụrụ[b] site n’aka unu niile.
  to: N’ihi nke a, anyị enwetala nkasi obi[a]. Ọzọkwa, tinyere nkasi obi anyị, anyị ṅụrịrị ọṅụ karịa nnọọ n’ihi ọṅụ Taịtọs, n’ihi na unu niile emewo ka mmụọ ya nweta ume ọhụrụ[b].
