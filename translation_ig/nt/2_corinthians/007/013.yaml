  variant: Standard Igbo
source:
  edition: SBLGNT
  text: διὰ τοῦτο παρακεκλήμεθα. Ἐπὶ δὲ τῇ παρακλήσει ⸀ἡμῶν περισσοτέρως μᾶλλον ἐχάρημεν ἐπὶ τῇ χαρᾷ Τίτου, ὅτι ἀναπέπαυται τὸ πνεῦμα αὐτοῦ ἀπὸ πάντων ὑμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/007/013.yaml
  text: For this reason we have been comforted[a]. And in addition to our comfort, we rejoiced even more abundantly at Titus’s joy[b], because his spirit has been refreshed by all of you.
translation:
  language: ig
  text: N’ihi nke a, anyị enwetala nkasi obi[a]. Ọzọkwa, tinyere nkasi obi anyị, anyị ṅụrịrị ọṅụ karịa nnọọ n’ihi ọṅụ Taịtọs, n’ihi na unu niile emewo ka mmụọ ya nweta ume ọhụrụ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụ ya, “a gbara anyị ume”; okwu Grik ndị a nwere ike ịpụta ma ịkasi obi ma ịgba ume n’ebe a.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụ ya, “mmụọ ya ezuwo ike.”
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: N’ihi nke a
  rationale: Ọ na-egosi ihe kpatara ma ọ bụ nkwubi okwu n'ụzọ doro anya ma kwekọọ n’usoro okwu Grik.
- source_word: παρακεκλήμεθα
  choice: a kasịala anyị obi
  rationale: Ụdị perfect passive na-egosi na e nyela ha nkasi obi, mmetụta ya ka dịkwa; okwu Igbo a bụ nke e ji ekwu nkasi obi n'ụzọ nkịtị.
- source_word: Ἐπὶ δὲ τῇ παρακλήσει ἡμῶν
  choice: Ma tinyere nkasi obi anyị
  rationale: “Tinyere” na-egosi na ọṅụ ọzọ a bịakwutere nkasi obi ha ma gafee ya, kama ịkọwa ἐπί n’ụzọ siri ike ma na-adịghị eke n’Igbo.
- source_word: περισσοτέρως μᾶλλον
  choice: karịa nnọọ
  rationale: Ọ na-echekwa nkwusi ike nke okwu ntụnyere abụọ ahụ n’Igbo dị nkenke ma dị eke.
- source_word: ἐχάρημεν ἐπὶ τῇ χαρᾷ Τίτου
  choice: anyị ṅụrịrị ọṅụ ... n’ihi ọṅụ Taịtọs
  rationale: Ọ na-edobe njikọ dị n’etiti ọṅụ ndị ode akwụkwọ na ọṅụ Taịtọs, n’Igbo dị mfe nghọta.
- source_word: ἀναπέπαυται
  choice: enwetawo ume ọhụrụ
  rationale: Ọ na-egosi ọnọdụ izu ike na ume ọhụrụ nke sitere n’ihe mere tupu mgbe ahụ, kwekọọkwa na perfect Grik.
- source_word: τὸ πνεῦμα αὐτοῦ
  choice: mmụọ ya
  rationale: Ọ bụ ntụgharị kpọmkwem nke na-echekwa asụsụ gbasara ime mmadụ n’amaokwu ahụ n’enweghị ịgbanwe ya ka ọ bụrụ naanị uche ma ọ bụ mmetụta.
- source_word: ἀπὸ πάντων ὑμῶν
  choice: site n’aka unu niile
  rationale: Ọ na-egosi na unu niile bụ isi mmalite ma ọ bụ ndị mere ka Taịtọs nweta ume ọhụrụ.
theological_decisions:
- issue: Ihe τὸ πνεῦμα αὐτοῦ pụtara n'ebe Taịtọs nọ
  choice: mmụọ Taịtọs, ya bụ ọnọdụ ime ya
  alternative: Mmụọ Nsọ
  rationale: Nnọchiaha “ya” na ihe gbara amaokwu ahụ gburugburu na-ezo aka n’ime Taịtọs na mmetụta ya, ọ bụghị n’ebe Mmụọ Nsọ nọ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta, mee ntụgharị a. E debere “mmụọ ya” iji chekwaa okwu Grik, ebe “enwetawo ume ọhụrụ” na-eme ka ihe ọ pụtara doo onye na-agụ ya anya.
