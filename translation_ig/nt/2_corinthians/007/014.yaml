  terminology: “Ji unu nya isi” and “ịnya isi anyị” preserve the Greek cognate relationship between καυχάομαι and καύχησις without prematurely reducing the terms to “confidence.” Taịtọs is consistently and recognizably rendered. “N’eziokwu” suitably represents the manner expressed by ἐν ἀληθείᾳ.
