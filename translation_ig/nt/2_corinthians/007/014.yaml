id: 2CO.7.14
reference: 2 Corinthians 7:14
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὅτι εἴ τι αὐτῷ ὑπὲρ ὑμῶν κεκαύχημαι, οὐ κατῃσχύνθην, ἀλλ’ ὡς πάντα ἐν ἀληθείᾳ ἐλαλήσαμεν ὑμῖν, οὕτως καὶ ἡ καύχησις ἡμῶν ⸀ἡ ἐπὶ Τίτου ἀλήθεια ἐγενήθη.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/007/014.yaml
  text: For if I have boasted to him at all about you[a], I was not put to shame; rather, just as we spoke everything to you in truth[b], so also our boasting to Titus proved true.
translation:
  language: ig
  text: N’ihi na ọ bụrụgodị na m ji unu nya isi n’ihu ya, ihere emeghị m. Kama, dị ka anyị si gwa unu ihe niile n’eziokwu, otu ahụkwa ka ịnya isi anyị n’ihu Taịtọs[a] si pụta na ọ bụ eziokwu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ịnya isi anyị nye Taịtọs.” Okwu Grik nwere ike ịpụta ihe e kwuru n’ihu Taịtọs ma ọ bụ nye ya; ọnọdụ okwu na-egosi na Pọl na-ekwu maka ihe o kwuru banyere ndị Kọrịnt.
    reason: lexical_alternative
lexical_decisions:
- source_word: κεκαύχημαι
  choice: ji unu nya isi
  rationale: Nkebi a na-egosipụta ịnya isi ma ọ bụ iji mmadụ kpọrọ ihe n’ihu onye ọzọ. Ọ na-edobe ike okwu καυχάομαι n’ebughị ụzọ kọwaa ya dị ka mpako mmehie.
- source_word: οὐ κατῃσχύνθην
  choice: ihere emeghị m
  rationale: Nke a bụ ụzọ Igbo dị mfe ma dị ndụ isi gosipụta na ihe Pọl kwuru emeghị ka ihere mee ya mgbe e mesịrị; ọ dabara na passive Grik nke na-ekwu na e meghị ya onye ihere.
- source_word: πάντα ἐν ἀληθείᾳ ἐλαλήσαμεν
  choice: anyị si gwa unu ihe niile n’eziokwu
  rationale: “Ihe niile” na-edobe oke πάντα, ebe “n’eziokwu” na-egosipụta ἐν ἀληθείᾳ dị ka ụzọ ha si kwuo okwu.
- source_word: ἡ καύχησις ἡμῶν
  choice: ịnya isi anyị
  rationale: A họọrọ otu mgbọrọgwụ okwu ahụ e ji sụgharịa κεκαύχημαι ka njikọ okwu dị na Grik wee pụta ìhè.
- source_word: ἡ ἐπὶ Τίτου
  choice: n’ihu Taịtọs
  rationale: Nke a na-anọ Grik nso ma na-egosi ịnya isi e mere n’ebe Taịtọs nọ. Ihe e ji nya isi—ndị Kọrịnt—apụtaala na nkebi mbụ.
- source_word: ἀλήθεια ἐγενήθη
  choice: si pụta na ọ bụ eziokwu
  rationale: Akpaalaokwu a na-egosi na ihe Pọl ji nya isi mechara kwekọọ n’eziokwu; nsụgharị a bụ Igbo nkịtị ma na-edobe echiche nke nkwenye sitere n’ihe mere.
- source_word: ὅτι
  choice: N’ihi na
  rationale: Ọ na-ewebata nkọwa na-akwado ihe e kwuru n’amaokwu bu ụzọ.
theological_decisions:
- issue: Ụdị ‘ịnya isi’ Pọl na-ekwu maka ya
  choice: E debere ya dị ka ịnya isi ziri ezi ma ọ bụ iji ndị Kọrịnt kpọrọ ihe, ka ọnọdụ okwu kọwaa ya.
  alternative: Ịsụgharị ya naanị dị ka ‘inwe ntụkwasị obi’ iji zere ụda mpako.
  rationale: καυχάομαι na καύχησις nwere ike ịbụ ịnya isi ma ọ bụ iji mmadụ kpọrọ ihe n’ụzọ kwesịrị ekwesị. Idebe “ịnya isi” na-echekwa ike na njikọ okwu Grik n’ebughị ozizi pụrụ iche bata.
- issue: Mmekọrịta ἡ ἐπὶ Τίτου na Taịtọs
  choice: ‘ịnya isi anyị n’ihu Taịtọs’—ihe e kwuru n’ebe Taịtọs nọ banyere ndị Kọrịnt.
  alternative: ‘ịnya isi anyị banyere Taịtọs’—ịghọta Taịtọs dị ka onye e ji nya isi.
  rationale: Nkebi mbụ kwuru hoo haa na Pọl ji ndị Kọrịnt nya isi n’ihu ‘ya’; ọnọdụ ahụ na-akwado na Taịtọs bụ onye Pọl gwara okwu, ọ bụghị isiokwu nke ịnya isi ahụ, ma okwu Grik n’onwe ya dị mkpirikpi.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. “Ji unu nya isi” na “ịnya isi anyị” na-edobe njikọ okwu abụọ sitere n’otu mgbọrọgwụ na Grik. E kewara ahịrịokwu ahụ ụzọ abụọ ka ọ na-agụ nke ọma n’Igbo, na-enweghị ịgbanwe njikọ echiche ya.
