  to: Ma ọ bụrụ na onye ọ bụla akpatala mwute, ọ bụghị m ka onye ahụ wutela, kama ọ wutela unu niile ruo n’ókè ụfọdụ[a]—ka m ghara ibokwasị unu niile ibu.[b]
  rationale: Ndozigharị a na-eme ka onye-isiokwu nke λυπέω nke abụọ doo anya, ma na-ewepụ “gabiga ókè,” nke karịrị ihe ἐπιβαρῶ kwuru kpọmkwem. Isi ederede na-echekwa ihe oyiyi ‘ibokwasị ibu’; odide ala b na-edobe nghọta nke na-ahụ okwu ahụ dịka Pọl na-ezere ikwubiga okwu ókè. A naghị edozi n’amaghị ama mgbagwoju anya nke ἀπὸ μέρους na ἵνα μὴ ἐπιβαρῶ.
