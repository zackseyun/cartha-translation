  text: Εἰ δέ τις λελύπηκεν, οὐκ ἐμὲ λελύπηκεν, ἀλλὰ ἀπὸ μέρους ἵνα μὴ ἐπιβαρῶ πάντας ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/002/005.yaml
  text: But if anyone has caused grief[a], he has grieved not me, but in part all of you—to some extent[b], so that I may not overstate it.
translation:
  language: ig
  text: Ma ọ bụrụ na onye ọ bụla akpatala mwute, ọ bụghị m ka onye ahụ wutela, kama ọ wutela unu niile ruo n’ókè ụfọdụ[a]—ka m ghara ibokwasị unu niile ibu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “n’otu akụkụ.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ka m ghara ikwubiga okwu ahụ ókè.”
    reason: lexical_alternative
lexical_decisions:
- source_word: λελύπηκεν
  choice: akpatala mwute / wutela
  rationale: Ụdị ndị a na-eme ka njikọ okwu ahụ dị n’ahịrịokwu abụọ ahụ pụta ìhè, ma ngwụcha -la na-egosikwa omume mere eme nke mmetụta ya ka dị ugbu a.
- source_word: οὐκ ἐμὲ
  choice: ọ bụghị m
  rationale: Nke a na-echekwa ọdịiche Pọl mere n’ụzọ kwụ ọtọ, n’etinyeghị okwu nkwusi ike na-adịghị na Grik.
- source_word: ἀπὸ μέρους
  choice: ruo n’ókè ụfọdụ
  rationale: Nke a bụ ụzọ Igbo doro anya si kwuo na ihe ahụ metụtara mmadụ n’otu akụkụ ma ọ bụ ruo ókè a kpaara akpa.
- source_word: ἐπιβαρῶ
  choice: ibokwasị ... ibu gabiga ókè
  rationale: Nke a na-echekwa ihe atụ nke ibu dị n’okwu Grik ahụ, ma na-egosikwa na Pọl achọghị ikwu okwu ahụ n’ụzọ ga-akpa ọgbakọ ahụ arọ gabiga ókè.
- source_word: πάντας ὑμᾶς
  choice: unu niile
  rationale: Nke a na-echekwa πάντας, nke na-egosi na ọ na-ekwu banyere ọgbakọ ahụ dum.
theological_decisions:
- issue: Ihe ἀπὸ μέρους na ἵνα μὴ ἐπιβαρῶ na-akọwa n’ahịrịokwu ahụ
  choice: E jikọtara ‘ruo n’ókè ụfọdụ’ na otú mwute ahụ si metụta unu niile; e wee sụgharịa nkebi ikpeazụ dị ka ịghara ibokwasị ha ibu gabiga ókè.
  alternative: A pụrụ ịghọta ya dị ka ‘ọ bụghị m ka o wutere, belụsọ n’otu akụkụ,’ ma ọ bụ ghọta nkebi ikpeazụ dị ka ‘ka m ghara ikwubiga okwu ahụ ókè.’
  rationale: Nhazi Grik ahụ nwere obere mgbagwoju anya. Isi ederede na-enye nghọta dị mfe ma na-echekwa okwu atụ nke ibu; ihe odide ala na-edebe ụzọ nghọta ndị ọzọ n’enweghị idozi ihe mgbagwoju anya ahụ n’amaghị ama.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. ‘Akpatala mwute’ bụ okwu nkịtị ma dabara n’ọgbakọ; ‘ibokwasị ... ibu’ na-echekwa ihe atụ nke Grik n’enweghị okwu ụka pụrụ iche.
