    issue: Isi ederede na-ekwu “ibokwasị unu niile ibu gabiga ókè.”
    rationale: ἐπιβαρῶ pụtara ibokwasị ibu/burden; “gabiga ókè” na-etinye nkwubi okwu ‘too much’ n’ime isi ederede, ebe Grik anaghị ekwu ya kpọmkwem. Ọ bụ ezie na nke a nwere ike ịbụ ihe Pọl bu n’obi n’ọdịnaya ya, a ga-ahapụ ya ka ọ bụrụ nghọta odide ala.
  - severity: low
    issue: “ọ bụghị m ka o wutela” nwere onye-isiokwu na-adịghị akọwapụta nke ọma.
    rationale: ‘O’ nwere ike ileghara anya n’ebe Igbo dị; ịkpọghachi “onye ahụ” na-eme ka njikọ ya na τις pụta ìhè n’enweghị mgbanwe n’ihe pụtara.
  - severity: low
    issue: Odide ala b nwere “ka m ghara ịkpabiga unu niile arọ.”
    rationale: Nkebi okwu a adịghị eke nke ọma n’Igbo. “Ka m ghara ibokwasị unu niile ibu” bụ ụzọ doro anya ma na-edobe ihe oyiyi ibu.
