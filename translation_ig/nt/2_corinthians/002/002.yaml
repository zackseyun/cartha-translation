  text: εἰ γὰρ ἐγὼ λυπῶ ὑμᾶς, καὶ ⸀τίς ὁ εὐφραίνων με εἰ μὴ ὁ λυπούμενος ἐξ ἐμοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/002/002.yaml
  text: For if I grieve you[a], who is there to make me glad except the one who is grieved by me?
translation:
  language: ig
  text: N’ihi na ọ bụrụ na m emee ka unu nwee mwute, ònye ga-eme m obi ụtọ ma ọ bụghị onye ahụ m na-eme ka o nwee mwute[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịtụgharị ya, “onye ahụ a na-eme ka o nwee mwute site n’aka m,” ebe ἐξ ἐμοῦ na-egosi isi mmalite ma ọ bụ ihe kpatara ya—“site n’aka m” ma ọ bụ “n’ihi m.”
    reason: lexical_alternative
lexical_decisions:
- source_word: λυπῶ
  choice: mee ka unu nwee mwute
  rationale: Okwu a pụtara ime ka mmadụ nwee mwute ma ọ bụ ihe mgbu n’obi; ntụgharị a bụ Igbo nkịtị ma na-echekwa ike causative nke ngwaa Grik ahụ.
- source_word: εὐφραίνων
  choice: ga-eme m obi ụtọ
  rationale: Ọ na-ezo aka n’onye na-ewetara Pọl ọṅụ; ‘ime m obi ụtọ’ doro anya, bụrụkwa ụzọ ndị Igbo si ekwu ya nke ọma.
- source_word: τίς ὁ εὐφραίνων με
  choice: ònye ga-eme m obi ụtọ
  rationale: Ajụjụ a na-echekwa ike rhetorical nke okwu Grik ahụ n’Igbo dị mfe ma kwụ ọtọ.
- source_word: ὁ λυπούμενος
  choice: onye ahụ m mere ka o nwee mwute
  rationale: Ọ bụ participle passive n’asụsụ Grik, ma e mere onye kpatara mwute ahụ ka ọ pụta ìhè n’Igbo site n’ihe gbara ya gburugburu.
- source_word: ἐξ ἐμοῦ
  choice: m mere ka o nwee mwute
  rationale: ἐξ ἐμοῦ na-egosi isi mmalite ma ọ bụ ihe kpatara mwute ahụ; a tinyere echiche ahụ n’usoro okwu Igbo dị ndụ.
- source_word: γὰρ
  choice: N’ihi na
  rationale: Ọ na-egosi na amaokwu a na-akọwa ma ọ bụ na-akwado ihe e kwuru tupu ya.
theological_decisions:
- issue: Ma ἐξ ἐμοῦ ga-apụta ‘site n’aka m’ ka ọ bụ ‘n’ihi m’
  choice: m mere ka o nwee mwute
  alternative: onye nwere mwute n’ihi m / site n’aka m
  rationale: Ihe gbara okwu ahụ gburugburu na-egosi na Pọl bụ onye kpatara mwute ahụ, ma ndetu ala na-echekwa ọdịiche dị n’etiti isi mmalite na ihe kpatara ya.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ugwu ma dị mfe nghọta. E ji ‘mwute’ chekwaa ntụnyere dị n’etiti λυπῶ na λυπούμενος, e jikwa ‘obi ụtọ’ gosipụta ọdịiche ya na εὐφραίνων.
