    text: A pụkwara ịtụgharị ya, “onye ahụ a na-eme ka o nwee mwute site n’aka m,” ebe ἐξ ἐμοῦ na-egosi isi mmalite ma ọ bụ ihe kpatara ya—“site n’aka m” ma ọ bụ “n’ihi m.”
    reason: lexical_alternative
  revision_rationale: The revision preserves the draft’s natural conditional and rhetorical wording while changing the final clause to a present, recipient-focused construction corresponding more closely to ὁ λυπούμενος (“the one being made sorrowful”). The footnote retains the source/cause ambiguity of ἐξ ἐμοῦ and corrects its Igbo phrasing.
