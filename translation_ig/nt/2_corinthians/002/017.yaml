language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: οὐ γάρ ἐσμεν ὡς οἱ ⸀πολλοὶ καπηλεύοντες τὸν λόγον τοῦ θεοῦ, ἀλλ’ ὡς ἐξ εἰλικρινείας, ἀλλ’ ὡς ἐκ θεοῦ ⸀κατέναντι θεοῦ ἐν Χριστῷ λαλοῦμεν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/002/017.yaml
  text: For we are not like the many[a], peddling the word of God, but as from sincerity, but as from God[f][e][d][c][b], before God we speak in Messiah.
translation:
  language: ig
  text: N’ihi na anyị adịghị ka ọtụtụ ndị ahụ[a], ndị na-ere okwu Chineke ka ngwá ahịa[b]. Kama, anyị na-ekwu okwu n’ime Mesaya, n’ihu Chineke[d], dị ka ndị sitere n’ezi obi[c], dịkwa ka ndị sitere na Chineke.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ihe ka ọtụtụ ná ndị mmadụ” ma ọ bụ “ọtụtụ ndị ọzọ.”
    reason: lexical_alternative
  - marker: b
    text: Okwu Grik a nwekwara ike ịgụnye echiche nke imebi ozi ahụ ma ọ bụ ịzụ ya ahịa iji nweta uru.
    reason: lexical_alternative
  - marker: c
    text: Ma ọ bụ, “jiri ezi obi.”
    reason: lexical_alternative
  - marker: d
    text: Ma ọ bụ, “n’anya Chineke” ma ọ bụ “n’ọnụnọ Chineke.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ πολλοί
  choice: ọtụtụ ndị ahụ
  rationale: Nkebiokwu a nwere njirimara kpọmkwem ma na-egosi ìgwè ndị Pọl ji onwe ya na ndị ya tụnyere; ọ naghị ekpebi na ha bụ ihe ka ọtụtụ n’ọnụọgụgụ.
- source_word: καπηλεύοντες
  choice: ndị na-ere ... ka ngwá ahịa
  rationale: Nke a na-edobe onyinyo onye na-azụ ahịa na-eme okwu Chineke ihe e ji achọ uru, na-enweghị ịgbakwụnye hoo haa na ha na-agwakọta ya aghụghọ.
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: okwu Chineke
  rationale: Nke a bụ ntụgharị kpọmkwem, nke a maara nke ọma, nke na-edobe ịdị nsọ nke nkebiokwu ahụ.
- source_word: ἐξ εἰλικρινείας
  choice: okwu ha si n’ezi obi pụta
  rationale: Usoro a na-edobe echiche isi iyi dị na ἐξ ma na-ada n’Igbo nkịtị karịa ntụgharị siri ike dịka ‘site n’ezi obi.’
- source_word: ἐκ θεοῦ
  choice: ndị si n’aka Chineke bịa
  rationale: Ọ na-egosipụta na Chineke bụ isi iyi ma ọ bụ onye zitere ha, ma ọ naghị eme ka nkebiokwu Igbo sie ike nghọta.
- source_word: κατέναντι θεοῦ
  choice: n’ihu Chineke
  rationale: Nke a na-egosi ikwu okwu n’ọnụnọ Chineke na n’okpuru nlekọta ya, n’enweghị nkọwa agbakwunyere n’ahịrị isi.
- source_word: ἐν Χριστῷ
  choice: n’ime Mesaya
  rationale: ‘Mesaya’ na-egosipụta Χριστός dịka utu aha Onye E Tere Mmanụ; ‘n’ime’ na-edobe usoro njikọ Pọl n’ejighị nkọwa dochie ya.
- source_word: λαλοῦμεν
  choice: anyị na-ekwu okwu
  rationale: Ọ na-edobe ngwaa nkịtị na oge na-aga n’ihu, n’enweghị ime ya ka ọ bụrụ naanị ‘ikwusa ozi ọma.’
theological_decisions:
- issue: Ihe ἐν Χριστῷ pụtara na nkebiokwu a
  choice: n’ime Mesaya
  alternative: n’ime Kraịst
  rationale: A họọrọ ntụgharị utu aha ahụ iji mee ka ihe Χριστός pụtara pụta ìhè, ma hapụkwa njikọ ‘n’ime’ ka ọ nwee obosara nkọwa Pọl nyere ya.
- issue: Mmekọrịta ὡς ... ὡς na ἐξ εἰλικρινείας / ἐκ θεοῦ
  choice: dị ka ndị okwu ha si n’ezi obi pụta, dịkwa ka ndị si n’aka Chineke bịa
  alternative: kama site n’ezi obi, kama site na Chineke
  rationale: Nke a na-edobe ike ntụnyere nke ὡς na isi iyi abụọ ahụ, ma mee ka usoro ahụ bụrụ Igbo doro anya na nke sitere n’okwu Grik.
translation_notes:
  register: Ejiri Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. A haziri usoro nkebiokwu ahụ ntakịrị ka isi iyi abụọ—ezi obi na Chineke—pụta nke ọma n’Igbo, ebe e debere onyinyo azụmahịa nke καπηλεύοντες na njikọ Pọl ‘n’ime Mesaya.’
