revisions:
- from: N’ihi na anyị adịghị ka ọtụtụ ndị ahụ[a], ndị na-ere okwu Chineke ka ngwá ahịa[b]. Kama, anyị na-ekwu okwu n’ime Mesaya, n’ihu Chineke[d], dị ka ndị okwu ha si n’ezi obi[c] pụta, dịkwa ka ndị si n’aka Chineke bịa.
  to: N’ihi na anyị adịghị ka ọtụtụ ndị ahụ[a], ndị na-ere okwu Chineke ka ngwá ahịa[b]. Kama, anyị na-ekwu okwu n’ime Mesaya, n’ihu Chineke[d], dị ka ndị sitere n’ezi obi[c], dịkwa ka ndị sitere na Chineke.
  rationale: A safe, limited revision replaces the overly specific “si n’aka Chineke bịa” with “sitere na Chineke” and makes the sincerity and God-source clauses parallel. This maintains the Greek order’s essential relationships, the repeated comparative force, and the passage’s formal Igbo register. All footnote markers remain present and correctly anchored.
