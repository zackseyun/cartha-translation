review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys that the disciplinary action is sufficient and that it was imposed by a larger portion of the community. However, “n’ime unu” (“among you”) is not expressed in the Greek text; the source has “by the majority,” without an explicit second-person referent.
  naturalness: The sentence is generally understandable, but “nke ihe ka ọtụtụ n’ime unu nyere” is heavier than needed and introduces an unnecessary explicit referent. “Ntaramahụhụ” is more precise than “ahụhụ” here for a disciplinary sanction imposed by a group.
  terminology: ἐπιτιμία is well represented by “ntaramahụhụ” in this context. “Ihe ka ọtụtụ n’ime ha” preserves the comparative force of τῶν πλειόνων (“the majority”) more accurately than merely “ọtụtụ n’ime ha” (“many of them”).
  issues:
  - severity: medium
    issue: The main text adds “n’ime unu.”
    rationale: The Greek reads ὑπὸ τῶν πλειόνων, “by the majority,” and does not explicitly say “among you.” The contextual referent may be understood, but it should not be added to the translation.
  - severity: low
    issue: “Ahụhụ” is less specific than the source context warrants.
    rationale: While possible, “ahụhụ” can denote suffering generally. “Ntaramahụhụ” more clearly denotes the disciplinary penalty or punishment represented by ἐπιτιμία.
  revised_text: Ntaramahụhụ a nke ihe ka ọtụtụ n’ime ha nyere onye dị otu a ezuola ya.[a]
