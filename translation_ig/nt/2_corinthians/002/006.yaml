lexical_decisions:
- source_word: ἱκανὸν
  choice: ezuola
  rationale: Ọ na-arụ ọrụ dị ka echiche isi nke ahịrịokwu ahụ, na-egosi na ihe e mere eruola ókè kwesịrị ekwesị. “Ezuola” bụ okwu Igbo dị ndụ ma doo anya.
- source_word: τῷ τοιούτῳ
  choice: onye dị otu a
  rationale: Ọ na-ezo aka n’otu onye mmejọ a maara n’ime ihe gbara amaokwu ahụ gburugburu. Nhọrọ a na-edobe ntụaka onye ahụ n’enweghị ịgbakwunye nkọwa na-adịghị na Grik.
- source_word: ἐπιτιμία
  choice: ahụhụ
  rationale: N’ebe a okwu ahụ pụtara ntaramahụhụ ma ọ bụ usoro ịdọ aka ná ntị nke ọgbakọ tinyere onye ahụ; “ahụhụ” na-egosi na ọ bụghị naanị ịbara ya mba n’ọnụ.
- source_word: ἡ ὑπὸ τῶν πλειόνων
  choice: nke ihe ka ọtụtụ n’ime unu nyere
  rationale: “Ihe ka ọtụtụ” na-egosipụta οἱ πλείονες dị ka ọnụ ọgụgụ ka ukwuu, ebe “nyere” na-eme ka onye mere ihe ahụ doo anya n’Igbo. “N’ime unu” sitere n’ọnọdụ okwu ahụ ma na-eme ka ntụaka obodo ahụ bụrụ ihe a na-aghọta nke ọma.
