id: 2CO.2.12
reference: 2 Corinthians 2:12
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ἐλθὼν δὲ εἰς τὴν Τρῳάδα εἰς τὸ εὐαγγέλιον τοῦ Χριστοῦ καὶ θύρας μοι ἀνεῳγμένης ἐν κυρίῳ,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/002/012.yaml
  text: When I came to Troas for the gospel of Messiah[a], and a door had been opened for me in the Lord[b],
translation:
  language: ig
  text: Mgbe m bịara na Troas maka ozi ọma nke Mesaịa[a], a megheela m ọnụ ụzọ n’ime Onyenwe anyị[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ma ọ bụ: “ozi ọma nke Kraịst.”'
    reason: lexical_alternative
  - marker: b
    text: 'Ma ọ bụ: “ọnụ ụzọ dị m oghe n’ime Onyenwe anyị.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐλθὼν
  choice: Mgbe m bịara
  rationale: Aorist participle ahụ na-egosi oge n’ebe a; “Mgbe m bịara” bụ Igbo nkịtị ma na-edobe njikọ ya na ihe ga-esochi n’amaokwu na-esote.
- source_word: δὲ
  choice: —
  rationale: Ọ bụ obere akara ntụgharị okwu, ọ bụghị nnukwu mmegide. Igbo na-egosi ntụgharị a nke ọma site n’ịmalite nkebi oge ahụ ozugbo, ya mere etinyeghị okwu dịka “Ma” nke nwere ike ime ka mmegide sie ike karịa isi mmalite.
- source_word: εἰς τὴν Τρῳάδα
  choice: bịara Troas
  rationale: Nke a na-egosi njem ruo n’obodo Troas n’ụzọ doro anya ma bụrụkwa Igbo dị mfe.
- source_word: εἰς τὸ εὐαγγέλιον
  choice: maka ozi ọma
  rationale: εἰς nke abụọ na-egosi ebumnuche. “Maka ozi ọma” na-edobe nke ahụ n’etinyeghị “ikwusa,” bụ́ okwu na-adịghị n’ederede Grik.
- source_word: τοῦ Χριστοῦ
  choice: nke Mesaịa
  rationale: Χριστός na-arụ ọrụ dịka utu aha n’ebe a. “Mesaịa” na-egosipụta Onye E Tere Mmanụ, ebe “nke” na-edobe obosara ihe genitive ahụ nwere—ozi ọma nke ya ma ọ bụ nke gbasara ya—n’akọwaghị ya karịa isi mmalite.
- source_word: θύρας
  choice: ọnụ ụzọ
  rationale: Ọ bụ ihe atụ maka ohere e nyere Pọl, ma idebe “ọnụ ụzọ” na-echekwa ihe atụ Pọl ji mee okwu.
- source_word: ἀνεῳγμένης
  choice: e megheekwara m
  rationale: Perfect passive participle ahụ na-egosi na e mepeela ụzọ ahụ, ọ nọgidekwara ghe oghe. Ụdị passive a na-edobe onye mere ihe ahụ n’akpọghị aha, dịka Grik si mee.
- source_word: ἐν κυρίῳ
  choice: n’ime Onyenwe anyị
  rationale: Nke a na-edobe okwu Pọl bụ ἐν κυρίῳ n’enweghị ime ka ọ bụrụ naanị “site n’aka Onyenwe anyị,” nke ga-amanye nghọta instrumental.
theological_decisions:
- issue: Nsụgharị Χριστοῦ
  choice: Mesaịa
  alternative: Kraịst
  rationale: N’ebe a Χριστός ka bụ utu aha nke Onye E Tere Mmanụ; “Mesaịa” na-eme ka nke ahụ pụta ìhè. E nyere “Kraịst” dịka ụzọ ọzọ n’ala ala peeji.
- issue: Ihe ἐν κυρίῳ pụtara
  choice: n’ime Onyenwe anyị
  alternative: site n’aka Onyenwe anyị
  rationale: Nhọrọ bụ isi na-echekwa okwu sara mbara nke Grik ma ghara ikpebi na ọ na-egosi naanị onye mere ka ụzọ ahụ meghee.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. Amaokwu ahụ ka bụ nkebi ahịrịokwu na-aga n’ihu ruo amaokwu na-esote, ya mere e mechiri ya na rikoma. E debere ihe atụ “ọnụ ụzọ” na okwu Pọl “n’ime Onyenwe anyị,” ka a ghara idozi ihe isi mmalite hapụrụ sara mbara.
