revisions:
- from: Mgbe m bịara Troas maka ozi ọma nke Mesaịa[a], e megheekwara m ọnụ ụzọ n’ime Onyenwe anyị[b],
  to: Mgbe m bịara na Troas maka ozi ọma nke Mesaịa[a], a megheela m ọnụ ụzọ n’ime Onyenwe anyị[b],
  rationale: The revision corrects the place complement, removes an unwarranted additive nuance, and more accurately represents the perfect passive participle with an idiomatic Igbo impersonal perfect construction. It also replaces the unclear second footnote with a natural alternative that preserves the image and its open-state aspect. The final comma is retained because the source sentence continues into 2 Corinthians 2:13.
