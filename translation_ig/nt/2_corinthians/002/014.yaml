    text: Ma ọ bụ, “onye na-emeri anyị mgbe niile n’ime Mesaịa ahụ.”
    reason: alternative_reading
  - marker: b
    text: Ma ọ bụ, “ísì ọma.”
    reason: lexical_alternative
  revision_rationale: The revision corrects both footnote anchors, restores φανεροῦντι with “na-eme ka … pụta ìhè,” and uses the natural, source-faithful expression “ísì ụtọ.” It retains the debated θριαμβεύοντι sense in a note without resolving the ambiguity doctrinally.
