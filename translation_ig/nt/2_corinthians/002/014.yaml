id: 2CO.2.14
reference: 2 Corinthians 2:14
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Τῷ δὲ θεῷ χάρις τῷ πάντοτε θριαμβεύοντι ἡμᾶς ἐν τῷ Χριστῷ καὶ τὴν ὀσμὴν τῆς γνώσεως αὐτοῦ φανεροῦντι δι’ ἡμῶν ἐν παντὶ τόπῳ·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/002/014.yaml
  text: But thanks be to God[b][a], who always leads us in triumphal procession in the Messiah and makes the fragrance of the knowledge of him known through us in every place.
translation:
  language: ig
  text: Ma ekele dịrị Chineke, onye na-eduru anyị mgbe niile n’usoro ngagharị mmeri n’ime Mesaịa ahụ,[a] ma na-eme ka ísì ụtọ[b] nke ịmata ya pụta ìhè site n’aka anyị n’ebe ọ bụla.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “onye na-emeri anyị mgbe niile n’ime Mesaịa ahụ.”
    reason: alternative_reading
  - marker: b
    text: Ma ọ bụ, “ísì ọma.”
    reason: lexical_alternative
lexical_decisions:
- source_word: χάρις
  choice: ekele dịrị
  rationale: N’okwu a, Τῷ θεῷ χάρις bụ okwu e ji ekele Chineke; “ekele dịrị Chineke” bụ Igbo sitere n’okike ma nwee ụda otuto.
- source_word: θριαμβεύοντι
  choice: na-eduru anyị ... n’usoro ngagharị mmeri
  rationale: Nhọrọ a na-echekwa ihe onyonyo nke ngagharị mmeri, kama ime ka okwu ahụ bụrụ naanị imeri n’ozuzu.
- source_word: ἐν τῷ Χριστῷ
  choice: n’ime Mesaịa ahụ
  rationale: Χριστός na-arụ ọrụ dị ka utu aha ebe a; “n’ime” na-echekwa echiche nke njikọ ma ọ bụ ọnọdụ n’ime Mesaịa ahụ.
- source_word: ὀσμὴν
  choice: ihe ọma na-esi ísì ụtọ
  rationale: N’ọnọdụ a okwu ahụ na-ezo aka n’ísì dị ụtọ; nkọwa a doro ndị na-agụ Igbo anya ma na-echekwa ihe atụ ahụ.
- source_word: γνώσεως αὐτοῦ
  choice: nke ịmata ya
  rationale: “Ịmata ya” na-egosipụta γνώσεως n'ụzọ Igbo sitere n’okike, ma na-ahapụ onye nnọchiaha “ya” dịka o siri dị n’asụsụ Grik.
- source_word: φανεροῦντι
  choice: eme ka ... gbasaa
  rationale: N’ihi na ihe e kwuru bụ ísì ụtọ, “eme ka ... gbasaa” na-eme ka ihe atụ ahụ bụrụ nke sitere n’okike n’Igbo ma na-eburu echiche nke ime ka ọ pụta ìhè n’ebe niile.
- source_word: δι’ ἡμῶν
  choice: site n’aka anyị
  rationale: Nke a na-egosipụta ọrụ mmadụ dị ka ụzọ Chineke si eme ihe ahụ.
- source_word: ἐν παντὶ τόπῳ
  choice: n’ebe niile
  rationale: Ọ bụ nsụgharị Igbo dị mfe ma bụrụ nke sitere n’okike nke pụtara “n’ebe ọ bụla.”
theological_decisions:
- issue: Ihe θριαμβεύω pụtara mgbe ἡμᾶς bụ ihe ngwaa ahụ metụtara
  choice: Chineke na-eduru anyị n’usoro ngagharị mmeri n’ime Mesaịa ahụ.
  alternative: Chineke na-emeri anyị n’ime Mesaịa ahụ.
  rationale: Isi ederede na-echekwa ihe onyonyo doro anya nke ngagharị mmeri ma kwekọọ na ihe atụ nke ísì ụtọ na-esochi ya. Ihe ọzọ okwu ahụ pụrụ ịpụta ka echekwara na nkọwa ala peeji, ka a ghara ihichapụ esemokwu dị n’asụsụ ahụ.
- issue: Onye αὐτοῦ na-ezo aka na ya
  choice: Edebere ya dịka “ya,” dị ka isi iyi Grik si mee.
  alternative: Ịkọwa ya hoo haa dịka Chineke ma ọ bụ Mesaịa.
  rationale: Onye nnọchiaha ahụ nwere onye ọ na-ezo aka na ya site n’okwu gbara ya gburugburu, ma nsụgharị ekwesịghị itinye aha ebe isi iyi tinyere naanị nnọchiaha.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị nsọ ma dị mfe nghọta. A họọrọ “usoro ngagharị mmeri” iji chekwaa ihe onyonyo omenala nke ngwaa Grik; nkọwa ala peeji na-echekwa ọgụgụ ọzọ. Akara nkọwa [a] na [b] abụọ pụtara n’isi ederede.
