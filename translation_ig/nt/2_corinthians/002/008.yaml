  yaml_path: translation/nt/2_corinthians/002/008.yaml
  text: Therefore I urge you to confirm your love for him.
translation:
  language: ig
  text: Ya mere, ana m arịọ unu ka unu kwado ịhụnanya unu n'ebe ọ nọ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διό
  choice: Ya mere
  rationale: Na-egosi nkwubi okwu sitere n’ihe e kwuru tupu amaokwu a.
- source_word: παρακαλῶ ὑμᾶς
  choice: ana m arịọ unu
  rationale: Na-enye arịrịọ Pọl siri ike ma dị nro n’asụsụ Igbo nkịtị.
- source_word: κυρῶσαι
  choice: ka unu gosi ya n'ụzọ doro anya
  rationale: Okwu a pụtara ime ka ihe guzosie ike ma ọ bụ kwado ya n’ụzọ pụtara ìhè; nsụgharị a na-egosi na ọgbakọ kwesịrị igosipụta ịhụnanya ha n’omume.
- source_word: εἰς αὐτὸν ἀγάπην
  choice: na unu hụrụ ya n'anya
  rationale: Na-asụpụta echiche nke ịhụnanya e duziri n’ebe nwoke ahụ nọ n’Igbo eke na nghọta.
theological_decisions:
- issue: Ụdị nkwado ịhụnanya a chọrọ
  choice: gosi ya n'ụzọ doro anya na unu hụrụ ya n'anya
  alternative: mee ka ịhụnanya unu n'ebe ọ nọ guzosie ike
  rationale: A naghị akọwa kpọmkwem usoro ọgbakọ ga-esi mee ya; nsụgharị ahụ na-echekwa ịdị obosara nke κυρῶσαι ma na-ezere itinye emume ma ọ bụ usoro ụka a na-akpọ aha.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E jiri ọtụtụ ‘unu’ mee ka onye na-agụ ya ghọta na arịrịọ ahụ bụ nye ọgbakọ niile.
