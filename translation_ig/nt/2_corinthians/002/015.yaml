id: 2CO.2.15
reference: 2 Corinthians 2:15
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὅτι Χριστοῦ εὐωδία ἐσμὲν τῷ θεῷ ἐν τοῖς σῳζομένοις καὶ ἐν τοῖς ἀπολλυμένοις,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/002/015.yaml
  text: For we are the aroma of Messiah to God among those who are being saved and among those who are perishing[b][a],
translation:
  language: ig
  text: N’ihi na anyị bụ isi ụtọ nke Mesaya nye Chineke n’etiti ndị a na-azọpụta na n’etiti ndị na-ala n’iyi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅτι
  choice: N’ihi na
  rationale: Ọ na-ewebata nkọwa ma ọ bụ ihe kpatara okwu bu ya ụzọ; nke a bụ ụzọ Igbo doro anya si chekwaa njikọ ahụ.
- source_word: Χριστοῦ
  choice: nke Mezaya
  rationale: Ọ na-egosi onye isi ọma ahụ bụ nke ya ma ọ bụ onye ọ na-anọchi anya; “Mezaya” na-echekwa ọrụ Χριστός dị ka utu aha.
- source_word: εὐωδία
  choice: isi ọma
  rationale: Nke a bụ okwu Igbo nkịtị maka ísì na-atọ ụtọ, ma ọ naghị emebiga ihe oyiyi nke isi Greek ahụ ókè.
- source_word: τῷ θεῷ
  choice: nye Chineke
  rationale: 'Ọ na-echekwa mmekọrịta dative ahụ: isi ọma ahụ bụ nye Chineke, ya bụ, n’ebe Chineke nọ.'
- source_word: ἐν τοῖς σῳζομένοις
  choice: n’etiti ndị a na-azọpụta
  rationale: “N’etiti” dabara n’ọnọdụ a, ebe “a na-azọpụta” na-echekwa usoro na-aga n’ihu nke participle dị ugbu a.
- source_word: ἐν τοῖς ἀπολλυμένοις
  choice: n’etiti ndị na-ala n’iyi
  rationale: Ọ na-emegharị “n’etiti” dịka Greek si emegharị ἐν, ma “na-ala n’iyi” na-echekwa usoro na-aga n’ihu n’enweghị ịkọwapụta ụdị mbibi ahụ karịa isi mmalite.
theological_decisions:
- issue: Ụdị usoro na-aga n’ihu dị na σῳζομένοις na ἀπολλυμένοις
  choice: ndị a na-azọpụta na ndị na-ala n’iyi
  alternative: ndị a zọpụtara na ndị furu efu
  rationale: Nhọrọ a na-echekwa participle abụọ dị ugbu a dịka usoro ma ọ bụ ọnọdụ na-aga n’ihu, kama ime ha naanị aha otu ndị nwere ọnọdụ e mechara kpebie.
- issue: Ihe genitive Χριστοῦ pụtara n’ihe oyiyi ahụ
  choice: isi ọma nke Mezaya
  alternative: isi ọma banyere Mezaya
  rationale: “Nke Mezaya” na-ahapụ ohere nke ịbụ isi ọma sitere n’aka ya, bụ nke ya, ma ọ bụ na-anọchi anya ya, n’emebighị obosara nke genitive Greek ahụ.
translation_notes:
  register: Asụsụ ahụ bụ Igbo Izugbe dị ugbu a, dị ugwu ma dị mfe nghọta. E chekwara ihe oyiyi nke ísì ọma, mmegharị “n’etiti,” na esemokwu dị n’etiti usoro nzọpụta na ịla n’iyi.
