  rationale: 'The revision makes two safe lexical-form corrections only: it uses the conventional Igbo form “Mesaya” and the more idiomatic “isi ụtọ” for “aroma/fragrance.” It retains the causal connection, the genitive ambiguity of “nke Mesaya,” the dative relation “nye Chineke,” the repeated “n’etiti,” and the ongoing aspect of both groups.'
