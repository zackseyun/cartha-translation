- from: 'N’ihi na ọ bụkwa maka nke a ka m dere: ka m wee mata ihe akaebe unu[a], ma unu na-erube isi n’ihe niile.'
  to: 'N’ihi nke a kwa ka m dere: ka m wee mata àgwà unu a nwapụtara[a], ma unu na-erube isi n’ihe niile.'
  rationale: The revision replaces an Igbo expression that can mean “your evidence” with a natural rendering of δοκιμή as demonstrated or proven character. The footnote preserves the source word’s possible testing sense without forcing that meaning into the main text. The remaining wording retains Paul’s purpose clause and the indirect question concerning comprehensive obedience.
