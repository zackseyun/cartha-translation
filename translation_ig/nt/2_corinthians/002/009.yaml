review_pass:
  verdict: revise
  source_fidelity: The purpose clause and indirect question are accurately represented. However, “ihe akaebe unu” normally means “your evidence” in Igbo and does not naturally convey δοκιμή as the demonstrated genuineness/proven character of the Corinthians.
  naturalness: The verse is generally clear, but “N’ihi na ọ bụkwa maka nke a” is heavier than needed. “N’ihi nke a kwa” is a more natural, dignified Standard Igbo equivalent in this context.
  terminology: Render δοκιμή as “àgwà unu a nwapụtara,” which communicates the result of testing rather than evidence possessed by the readers. A footnote retains “nnwale unu” as the other viable lexical sense.
  issues:
  - severity: medium
    issue: “ihe akaebe unu” for τὴν δοκιμὴν ὑμῶν
    rationale: In ordinary Standard Igbo this denotes evidence belonging to the readers, whereas δοκιμή here refers to what their response demonstrates—their tested/proven character.
  - severity: low
    issue: Opening causal expression is unnecessarily cumbersome
    rationale: “N’ihi nke a kwa ka m dere” preserves γὰρ, καὶ, and the retrospective/purposive reference while reading more naturally.
  revised_text: 'N’ihi nke a kwa ka m dere: ka m wee mata àgwà unu a nwapụtara[a], ma unu na-erube isi n’ihe niile.'
