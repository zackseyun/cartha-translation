reference: 2 Corinthians 2:9
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: εἰς τοῦτο γὰρ καὶ ἔγραψα ἵνα γνῶ τὴν δοκιμὴν ὑμῶν, εἰ εἰς πάντα ὑπήκοοί ἐστε.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/002/009.yaml
  text: 'For this is why I also wrote: so that I might know the proof of you[a], whether you are obedient in everything.'
translation:
  language: ig
  text: 'N’ihi nke a kwa ka m dere: ka m wee mata àgwà unu a nwapụtara[a], ma unu na-erube isi n’ihe niile.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “nnwale unu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς τοῦτο γὰρ καὶ ἔγραψα
  choice: N’ihi na ọ bụkwa maka nke a ka m dere
  rationale: Na-egosipụta γάρ dị ka nkọwa, εἰς τοῦτο dị ka nzube a kpọtụrụ aha, καὶ dị ka ‘kwa,’ na ἔγραψα dị ka oge gara aga n’Igbo nkịtị.
- source_word: ἵνα γνῶ
  choice: ka m wee mata
  rationale: Na-echekwa ahịrịokwu nzube na echiche nke ịbịa mara ihe.
- source_word: τὴν δοκιμὴν ὑμῶν
  choice: ihe akaebe unu
  rationale: δοκιμή nwere ike ịpụta nnwale ma ọ bụ ihe nnwale gosipụtara. ‘Ihe akaebe unu’ na-ahapụ obosara ahụ n’emeghị ka ọ bụrụ naanị àgwà a nwapụtara.
- source_word: εἰ εἰς πάντα ὑπήκοοί ἐστε
  choice: ma unu na-erube isi n’ihe niile
  rationale: ‘Ma’ na-egosipụta ajụjụ na-apụtachaghị ìhè nke εἰ; ‘na-erube isi n’ihe niile’ na-enye echiche zuru oke nke εἰς πάντα n’Igbo dị mfe nghọta.
theological_decisions:
- issue: Ihe δοκιμή ὑμῶν pụtara kpọmkwem
  choice: ihe akaebe unu
  alternative: nnwale unu; àgwà unu a nwapụtara
  rationale: A họọrọ okwu na-adịghị ekpebi ma Pọl na-ekwu maka usoro nnwale ahụ ka ọ̀ bụ ihe nnwale ahụ gosipụtara, ka e wee debe mgbagwoju anya dị n’asụsụ Grik.
translation_notes:
  register: Igbo Izugbe nke oge a, dị ugwu ma dị mfe nghọta. E debere usoro okwu Pọl nke nzube na ajụjụ na-apụtachaghị ìhè, ma zere ịtụkwasị nkọwa okpukpe pụrụ iche n’elu δοκιμή.
