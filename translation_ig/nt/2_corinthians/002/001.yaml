  yaml_path: translation/nt/2_corinthians/002/001.yaml
  text: 'For I decided this for myself: not to come to you again in sorrow[a].'
translation:
  language: ig
  text: 'N’ihi na ekpebiri m n’onwe m nke a: ka m ghara ịbịakwute unu ọzọ na mwute[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “n’ime mwute.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔκρινα
  choice: ekpebiri m
  rationale: Oge aorist nke κρίνω n’ebe a na-egosi mkpebi Pọl ji nlezianya mee ma guzosie ike na ya. “Ekpebiri m” bụ Igbo doro anya nke oge a.
- source_word: γὰρ
  choice: N’ihi na
  rationale: γάρ na-akọwa ihe e kwuru n’amaokwu bu ụzọ. “N’ihi na” na-egosipụta njikọ nkọwa ahụ n’ụzọ e ji asụ Igbo nke ọma.
- source_word: ἐμαυτῷ
  choice: n’onwe m
  rationale: Dative reflexive a na-egosi na ọ bụ mkpebi Pọl n’onwe ya mere. “N’onwe m” na-edobe echiche nke mkpebi onwe onye ahụ.
- source_word: τοῦτο
  choice: nke a
  rationale: Ihe ngosi a na-atụ aka n’ihu n’ihe infinitive na-esochi ga-akọwa. Akara kọlọ́n na-eme ka ọdịnaya mkpebi ahụ doo anya.
- source_word: τὸ μὴ ... ἐλθεῖν
  choice: na agaghị m abịakwute
  rationale: Articular infinitive na-ekwupụta ọdịnaya mkpebi ahụ. Nkebiokwu a bụ ụzọ Igbo sitere n’okike si kwuo mkpebi ịghara ịbịa.
- source_word: πάλιν
  choice: ọzọ
  rationale: πάλιν na-egosi nkwughachi; “ọzọ” bụ okwu Igbo dị mfe ma kwekọọ na ya.
- source_word: ἐν λύπῃ
  choice: n’ime mwute
  rationale: λύπη nwere ike ịpụta mwute, iru újú, ma ọ bụ obi mgbawa. “N’ime mwute” na-edobe nhazi preposition ahụ na obosara ihe ọ pụrụ ịpụta.
- source_word: πρὸς ὑμᾶς
  choice: abịakwute unu
  rationale: πρός tinyere accusative, mgbe ọ na-eso ngwaa nke ịbịa, na-egosi ịgakwuru mmadụ. “Abịakwute unu” bụ Igbo sitere n’okike.
