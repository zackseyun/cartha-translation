translation_notes:
  register: Asụsụ Igbo Izugbe nke oge a, dị ugwu ma dị mfe nghọta. E debere njikọ nkọwa γάρ, ọdịdị mkpebi onwe onye, na nghọtahie kwesịrị ịdị na ἐν λύπῃ.
