  to: Onye ọ bụla unu na-agbaghara ihe ọ bụla, mụ kwa na-agbaghara ya. N’ihi na ihe m gbaghaara—ọ bụrụ na m gbaghaara ihe ọ bụla—ọ bụ n’ihi unu ka m gbaghaara ya n’ihu Mezaịa ahụ.[a]
