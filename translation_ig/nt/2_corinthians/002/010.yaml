language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ᾧ δέ τι χαρίζεσθε, κἀγώ· καὶ γὰρ ἐγὼ ⸂ὃ κεχάρισμαι, εἴ τι⸃ κεχάρισμαι, δι’ ὑμᾶς ἐν προσώπῳ Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/002/010.yaml
  text: To anyone whom you forgive anything[a], I do too. For what I have forgiven—if I have forgiven anything—I have forgiven for your sake in the presence of Messiah,
translation:
  language: ig
  text: Onye ọ bụla unu na-agbaghara ihe ọ bụla, mụ kwa na-agbaghara ya. N’ihi na ihe m gbaghaara—ọ bụrụ na m gbaghaara ihe ọ bụla—ọ bụ n’ihi unu ka m gbaghaara ya n’ihu Mezaịa ahụ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “n’ọnọdụ Mezaịa ahụ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: χαρίζεσθε / κεχάρισμαι
  choice: gbaghara / m gbaghaara
  rationale: N’ọnọdụ a nke ịdọ aka ná ntị na iweghachi onye mejọrọ, okwu Grik a pụtara ịhapụ mmadụ mmejọ ya; “ịgbaghara” bụ okwu Igbo kachasị doo anya ma bụrụkwa nke e ji eme ihe taa.
- source_word: ᾧ ... τι
  choice: Onye ọ bụla ... ihe ọ bụla
  rationale: Usoro a na-egosi onye a na-agbaghara na ihe a na-agbaghara n’enweghị ịkọwa otu onye ma ọ bụ otu mmejọ kpọmkwem; “onye ọ bụla ... ihe ọ bụla” na-edobe oghere ahụ n’Igbo nkịtị.
- source_word: κἀγώ
  choice: mụ onwe m na-agbagharakwa ya
  rationale: Nke a na-egosi na Pọl na-esonyere ndị Kọrịnt n’ịgbaghara; “-kwa” na-eburu echiche nke “m kwa,” ebe “mụ onwe m” na-eme ka onye na-ekwu okwu pụta ìhè.
- source_word: ὃ κεχάρισμαι, εἴ τι κεχάρισμαι
  choice: ihe m gbaghaara—ọ bụrụ na m gbaghaara ihe ọ bụla—
  rationale: A hapụrụ ahịrịokwu Pọl nke yiri ka ọ na-eweda òkè nke ya ala ma na-etinye ya n’ụdị ọnọdụ; akara ogologo na-egosi na okwu dị n’etiti bụ mgbakwunye.
- source_word: δι’ ὑμᾶς
  choice: n’ihi unu
  rationale: N’ebe a, διά na accusative na-egosi na ihe ahụ mere maka ọdịmma ma ọ bụ n’ihi nchebara ndị Kọrịnt echiche; “n’ihi unu” bụ ụzọ Igbo dị mkpirikpi ma dị ndụ isi kwuo ya.
- source_word: ἐν προσώπῳ Χριστοῦ
  choice: n’ihu Mezaịa ahụ
  rationale: “N’ihu” na-egosi ime ihe n’ebe Mezaịa ahụ nọ ma ọ bụ n’okpuru anya ya. E debere nghọta ọzọ nke πρόσωπον, nke pụrụ ịpụta ime ihe n’ọnọdụ ma ọ bụ n’aha onye ahụ, n’ala ala peeji.
- source_word: Χριστοῦ
  choice: Mezaịa ahụ
  rationale: Χριστός bụ aha ọkwa nke pụtara Onye E Tere Mmanụ; “Mezaịa ahụ” na-edobe ọrụ ya dị ka aha ọkwa kama ime ya naanị aha mmadụ.
theological_decisions:
- issue: Ma Χριστός ga-apụta dị ka aha ọkwa “Mezaịa” ka ọ bụ ụdị aha a na-ejikarị, “Kraịst.”
  choice: Mezaịa ahụ
  alternative: Kraịst
  rationale: N’amaokwu a, ọ dịghị ihe na-amanye ka e were Χριστός dị ka naanị aha mmadụ. Ịsụgharị ya “Mezaịa ahụ” na-edobe ihe aha ọkwa Grik ahụ pụtara.
- issue: Ihe ἐν προσώπῳ Χριστοῦ pụtara kpọmkwem.
  choice: n’ihu Mezaịa ahụ
  alternative: n’ọnọdụ Mezaịa ahụ / dị ka onye nọchitere Mezaịa ahụ
  rationale: πρόσωπον nwere ike ịpụta ihu, ọnụnọ, ma ọ bụ onye/ọnọdụ onye. Isi nsụgharị họọrọ echiche nke ime ihe n’ihu Mezaịa ahụ, ma ihe odide anaghị ekpochapụ nghọta nke ime ihe dị ka onye nọchitere ya; ya mere e tinyere nke ahụ n’ala ala peeji.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị ùgwù ma dị mfe nghọta, dee amaokwu ahụ. E zere okwu ụka nke otu chọọchị pụrụ iche. E jigidere nkwughachi nke “ịgbaghara” na ahịrịokwu ọnọdụ Pọl kama ime ka okwu ya dị larịị karịa ihe Grik kwuru.
