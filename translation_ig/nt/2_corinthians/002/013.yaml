  to: Enweghị m izu ike n'ime mmụọ m, n'ihi na ahụghị m Taịtọs, nwanne m[a]. Ma, mgbe m sịrị ha ka ha nọrọ nke ọma[b], m pụrụ gaa Masedonia.
  rationale: 'E meziewo naanị okwu abụọ na-adịghị eke n’Igbo: e jiri ‘m sịrị ha ka ha nọrọ nke ọma’ dochie okwu nkewa na-adịghị arụ ọrụ nke ọma, ma jiri ‘m pụrụ gaa Masedonia’ dochie mmegharị okwu ‘agara m gawa.’ Mmezi ndị a na-echekwa usoro na ihe okwu Grik pụtara: Pọl enweghị izu ike n’ime mmụọ ya n’ihi na ọ hụghị Taịtọs; o kelere ndị nọ ebe ahụ mgbe ọ na-apụ; o wee pụọ gaa Masedonia.'
