id: 2CO.2.13
reference: 2 Corinthians 2:13
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: οὐκ ἔσχηκα ἄνεσιν τῷ πνεύματί μου τῷ μὴ εὑρεῖν με Τίτον τὸν ἀδελφόν μου, ἀλλὰ ἀποταξάμενος αὐτοῖς ἐξῆλθον εἰς Μακεδονίαν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/002/013.yaml
  text: I had no rest in my spirit because I did not find Titus my brother[a], but after taking leave of them[c][b], I went on to Macedonia.
translation:
  language: ig
  text: Enweghị m izu ike n'ime mmụọ m, n'ihi na ahụghị m Taịtọs, nwanne m[a]. Ma, mgbe m sịrị ha ka ha nọrọ nke ọma[b], m pụrụ gaa Masedonia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Nwanne m” pụtara na Taịtọs bụ onye ya na Pọl kweere na Kraịst, bụrụkwa onye ọrụ ibe ya.
    reason: cultural_note
  - marker: b
    text: Ma ọ bụ, “mgbe m kesịrị ha ekele.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐκ ἔσχηκα
  choice: Enweghị m
  rationale: Ọ bụ ezie na ἔσχηκα bụ perfect n'asụsụ Grik, n'akụkọ a, Igbo eke ji ụdị gara aga “Enweghị m” kọwaa ọnọdụ Pọl tupu ọ pụọ.
- source_word: ἄνεσιν
  choice: izu ike
  rationale: “Izu ike” na-egosi enweghị obi iru ala nke ọma ma na-ahapụkwa ohere echiche okwu Grik nwere, dị ka ahụ efe ma ọ bụ nnwere onwe pụọ ná nrụgide.
- source_word: τῷ πνεύματί μου
  choice: n'ime mmụọ m
  rationale: Nke a na-edobe echiche gbasara ọnọdụ dị n'ime Pọl, n'ebughị ụzọ kpebie ma πνεῦμα ọ̀ bụ naanị uche ya ma ọ bụ okwu nwere nghọta ime mmụọ sara mbara.
- source_word: τῷ μὴ εὑρεῖν με Τίτον
  choice: n'ihi na ahụghị m Taịtọs
  rationale: Articular infinitive a na-enye ihe kpatara enweghị izu ike ahụ; nsụgharị a doro anya ma tinyeghị echiche nke enweghị ike ịchọta ya.
- source_word: Τίτον
  choice: Taịtọs
  rationale: Nke a bụ ntụgharị aha Titus n'ụdị dabara n'usoro mkpụrụokwu na mkpọpụta Igbo.
- source_word: ἀδελφόν μου
  choice: nwanne m
  rationale: “Nwanne m” na-edobe ihe atụ ezinụlọ Pọl ji akọwa onye ya na ya kwere ekwe ma na-arụkọ ọrụ; nkọwa ahụ dị n'okpuru amaokwu.
- source_word: ἀποταξάμενος αὐτοῖς
  choice: mgbe m kwuchara ha ka ha nọrọ nke ọma
  rationale: Nke a bụ ụzọ Igbo eke si egosi na Pọl kelere ha mgbe ọ na-apụ, ma na-edobe ihe aorist participle ahụ dị ka omume mere tupu ọ gawa.
- source_word: ἐξῆλθον εἰς Μακεδονίαν
  choice: agara m gawa Masedonia
  rationale: Okwu a na-egosi na Pọl hapụrụ ebe ahụ gaa n'ihu na njem ya ruo Masedonia, n'ejighị nsụgharị nkịtị nke “pụọ” nke pụrụ ịdị arọ n'Igbo.
theological_decisions:
- issue: Ihe “mmụọ m” pụtara
  choice: E debere ya dịka “n'ime mmụọ m.”
  alternative: “n'obi m” ma ọ bụ “maka mmụọ m”
  rationale: “N'ime mmụọ m” na-echekwa okwu πνεῦμα na mgbagwoju anya ya, kama ime ka ọ bụrụ naanị mmetụta uche ma ọ bụ nye ya nkọwa okpukpe pụrụ iche.
- issue: Mmekọrịta Pọl na Taịtọs
  choice: “nwanne m”
  alternative: “onye otu okwukwe m na onye ọrụ ibe m”
  rationale: E chekwara ihe atụ ezinụlọ dị na Grik; ihe e dere n'okpuru amaokwu na-akọwa na ọ bụghị nwanne anụ ahụ ka a na-ekwu.
translation_notes:
  register: 'E ji Standard Igbo nke oge a, dị mfe nghọta ma nwee ugwu. Ahịrịokwu ahụ na-edobe usoro akụkọ ahụ: enweghị izu ike n''ime Pọl n''ihi na ọ hụghị Taịtọs, ikwu ndị nọ ebe ahụ ka ha nọrọ nke ọma, na ịga Masedonia. A haziri akara amaokwu nta n''usoro [a], [b], ma akara ọ bụla pụtara n''isi ederede.'
