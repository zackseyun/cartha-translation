review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the purpose clause, the anticipated visit, and the contrast of grief and joy. However, “Edere m” is a passive construction (“it was written by me”) rather than the direct active sense of ἔγραψα, and “ka ọ ga-abụ na ... agaghị m” is less precise and introduces a future-like formulation where the Greek expresses Paul’s purpose regarding his coming. The final clause is better rendered without the added force of “-kwa,” which is not present in the Greek.
  naturalness: Several expressions are understandable, but “M dere” is the normal active Standard Igbo form, and “n’ịtụkwasị unu niile obi” is more idiomatic than “inwe ntụkwasị obi n’ebe unu niile nọ.” The revised wording remains formal, clear, and natural.
  terminology: “mwute,” “ṅụrịa ọṅụ,” and “ntụkwasị obi” are appropriate modern Standard Igbo choices. The footnote properly identifies the more literal, though less idiomatic, relationship expressed by ἀφ’ ὧν ἔδει με χαίρειν.
  issues:
  - severity: medium
    issue: “Edere m” is passive in form.
    rationale: 'The Greek ἔγραψα is active: “I wrote.” Standard Igbo “M dere” directly represents the source without introducing a passive construction.'
  - severity: medium
    issue: “ka ọ ga-abụ na mgbe m bịara, agaghị m enwe” does not cleanly express the Greek purpose construction.
    rationale: 'ἵνα μὴ ... σχῶ expresses Paul’s purpose: he wrote so that, upon coming, he would not have grief. “ka, mgbe m bịara, m ghara inwe” conveys this directly and naturally.'
  - severity: low
    issue: “ebe m nwere ntụkwasị obi n’ebe unu niile nọ” is repetitive and less idiomatic.
    rationale: The participle πεποιθὼς is well represented by the idiom “n’ịtụkwasị unu niile obi,” which also avoids making the relation strictly causal.
  - severity: low
    issue: The enclitic “-kwa” in “ọṅụ m bụkwa ọṅụ unu niile” adds an unneeded ‘also.’
    rationale: The Greek states that Paul’s joy is that of all of them; it does not explicitly add a coordinating ‘also.’
  revised_text: M dere kpọmkwem ihe a ka, mgbe m bịara, m ghara inwe mwute n’aka ndị kwesịrị ime ka m ṅụrịa ọṅụ[a], n’ịtụkwasị unu niile obi na ọṅụ m bụ ọṅụ unu niile.
  revised_footnotes:
  - marker: a
    text: Ma ọ bụ, n’ụzọ nke na-esochi okwu Grik nso karị, “site n’aka ndị m kwesịrị isi n’aka ha ṅụrịa ọṅụ.”
    reason: lexical_alternative
  revision_rationale: The revision restores the active sense of “I wrote,” expresses the purpose clause in idiomatic Standard Igbo, renders the Greek perfect participle with a natural non-causal participial expression, and removes an added emphatic ‘also’ from the final clause. The lexical-alternative footnote and its anchor are retained.
