revisions:
- from: Edere m kpọmkwem ihe a ka ọ ga-abụ na mgbe m bịara, agaghị m enwe mwute site n’aka ndị kwesịrị ime ka m ṅụrịa ọṅụ[a], ebe m nwere ntụkwasị obi n’ebe unu niile nọ na ọṅụ m bụkwa ọṅụ unu niile.
  to: M dere kpọmkwem ihe a ka, mgbe m bịara, m ghara inwe mwute n’aka ndị kwesịrị ime ka m ṅụrịa ọṅụ[a], n’ịtụkwasị unu niile obi na ọṅụ m bụ ọṅụ unu niile.
  rationale: The revision restores the active sense of “I wrote,” expresses the purpose clause in idiomatic Standard Igbo, renders the Greek perfect participle with a natural non-causal participial expression, and removes an added emphatic ‘also’ from the final clause. The lexical-alternative footnote and its anchor are retained.
