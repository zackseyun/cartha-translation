source:
  edition: SBLGNT
  text: καὶ ⸀ἔγραψα τοῦτο αὐτὸ ἵνα μὴ ἐλθὼν λύπην ⸀σχῶ ἀφ’ ὧν ἔδει με χαίρειν, πεποιθὼς ἐπὶ πάντας ὑμᾶς ὅτι ἡ ἐμὴ χαρὰ πάντων ὑμῶν ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/002/003.yaml
  text: And I wrote this very thing so that, when I came, I might not have grief from those who ought to make me rejoice, because I was confident about all of you that my joy is the joy of you all.
translation:
  language: ig
  text: M dere kpọmkwem ihe a ka, mgbe m bịara, m ghara inwe mwute n’aka ndị kwesịrị ime ka m ṅụrịa ọṅụ[a], n’ịtụkwasị unu niile obi na ọṅụ m bụ ọṅụ unu niile.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, n’ụzọ nke na-esochi okwu Grik nso karị, “site n’aka ndị m kwesịrị isi n’aka ha ṅụrịa ọṅụ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔγραψα
  choice: Edere m
  rationale: Aorist indicative na-ezo aka n’ihe Pọl dere na mbụ; oge gara aga dị mfe dabara n’ebe a.
- source_word: τοῦτο αὐτὸ
  choice: kpọmkwem ihe a
  rationale: Nke a na-egosipụta nkwusi ike dị na okwu Grik ahụ n’ụzọ Igbo nke oge a na-ada nke ọma.
- source_word: ἵνα μὴ ἐλθὼν λύπην σχῶ
  choice: ka ọ ga-abụ na mgbe m bịara, agaghị m enwe mwute
  rationale: Ọ na-edobe ebumnuche nke ἵνα, ọnọdụ nke ọbịbịa Pọl, na echiche nke izere mwute.
- source_word: ἀφ’ ὧν ἔδει με χαίρειν
  choice: site n’aka ndị kwesịrị ime ka m ṅụrịa ọṅụ
  rationale: 'Nke a na-enye echiche mmekọrịta ahụ n’Igbo dị ire: ndị ahụ kwesịrị ịbụ isi iyi ọṅụ Pọl, ọ bụghị mwute. A na-edebe usoro nkịtị karịa na nkọwa ala peeji.'
- source_word: πεποιθὼς ἐπὶ πάντας ὑμᾶς
  choice: ebe m nwere ntụkwasị obi n’ebe unu niile nọ
  rationale: Perfect participle na-egosi ntụkwasị obi Pọl nke guzosiri ike. “Ebe” na-ahapụ njikọ ya na ahịrịokwu bu ụzọ ntakịrị ghe oghe kama ime ka ọ bụrụ naanị ihe kpatara ya.
- source_word: ἡ ἐμὴ χαρὰ πάντων ὑμῶν ἐστιν
  choice: ọṅụ m bụkwa ọṅụ unu niile
  rationale: Ọ na-edobe nhazi na nkwupụta nke Grik ma na-egosi na Pọl na ndị Kọrịnt niile nwere òkè n’otu ọṅụ ahụ.
theological_decisions:
- issue: Njikọ nke πεποιθὼς na ahịrịokwu bu ụzọ
  choice: ebe m nwere ntụkwasị obi
  alternative: n’ihi na m nwere ntụkwasị obi
  rationale: Participle ahụ nwere ike ịkọwa ọnọdụ ma ọ bụ ihe kpatara ya. “Ebe” na-echekwa njikọ ahụ n’enweghị ime ka ihe kpatara ya sie ike karịa ka Grik si kwuo.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, nke dị ùgwù ma dịkwa mfe nghọta. A họọrọ “mwute,” “ṅụrịa ọṅụ,” na “ntụkwasị obi” ka mmetụta uche na mmekọrịta dị n’amaokwu ahụ doo anya n’enweghị itinye nkọwa ụka pụrụ iche.
