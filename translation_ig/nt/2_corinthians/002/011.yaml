  text: ἵνα μὴ πλεονεκτηθῶμεν ὑπὸ τοῦ Σατανᾶ, οὐ γὰρ αὐτοῦ τὰ νοήματα ἀγνοοῦμεν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/002/011.yaml
  text: so that we would not be outwitted by Satan[b][a], for we are not ignorant of his schemes.
translation:
  language: ig
  text: ka Setan ghara irite uru n’aka anyị[a], n’ihi na anyị amaghị atụmatụ ya[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “iji aghụghọ merie anyị” ma ọ bụ “megbuo anyị.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “echiche ya,” “nzube ya,” ma ọ bụ “atụmatụ ya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα μή
  choice: ka ... ghara
  rationale: Nke a na-egosi ebumnuche ma ọ bụ ihe a chọrọ izere, n’ụzọ Igbo dị mfe ma kwekọọ n’ahịrịokwu bu ya ụzọ.
- source_word: πλεονεκτηθῶμεν
  choice: irigbu anyị
  rationale: Ụdị ngwaa a na-egosi ka onye ọzọ ghara iji aghụghọ nweta uru n’ebe anyị nọ ma ọ bụ megbuo anyị; “irigbu anyị” na-edobe isi echiche ahụ n’Igbo doro anya.
- source_word: Σατανᾶ
  choice: Setan
  rationale: A sụgharịghị aha onye a; e dere ya n’ụdị a na-ejikarị eme ihe n’Igbo.
- source_word: γάρ
  choice: n’ihi na
  rationale: Ọ na-ewebata ihe kpatara okwu dị n’akụkụ mbụ.
- source_word: νοήματα
  choice: atụmatụ ọjọọ
  rationale: N’ebe a, okwu ahụ na-ezo aka n’echiche ma ọ bụ atụmatụ Setan ji achọ ime ihe ọjọọ; nkọwa a na-eme ka ọnọdụ iro ya pụta ìhè n’enweghị ikwu kpọmkwem ụzọ o si eme ya.
- source_word: οὐ ... ἀγνοοῦμεν
  choice: anyị amaghịghị ... ya
  rationale: Mkpụrụokwu Igbo a na-edobe nkwuwa okwu nke njụ abụọ dị na Grik, nke pụtara na atụmatụ ndị ahụ abụghị ihe anyị na-amaghị.
theological_decisions: []
translation_notes:
  register: Standard Igbo dị ugbu a, dị ugwu ma dị mfe nghọta. E ji “irigbu” gosi nghọta sara mbara nke πλεονεκτέω, ebe e debere ụzọ ndị ọzọ na nkọwa ala peeji. A haziri akara nkọwa ala peeji n’ebe okwu ha na-akọwa dị.
