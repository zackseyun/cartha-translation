    text: Ma ọ bụ, “iji aghụghọ merie anyị” ma ọ bụ “megbuo anyị.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “echiche ya,” “nzube ya,” ma ọ bụ “atụmatụ ya.”
    reason: lexical_alternative
  revision_rationale: The revision renders πλεονεκτηθῶμεν with the broader sense of Satan gaining an advantage at the believers’ expense, removes the unstated adjective “ọjọọ” from νοήματα, and uses a natural present negative for οὐ ... ἀγνοοῦμεν. Footnote anchors remain attached to the words they explain.
