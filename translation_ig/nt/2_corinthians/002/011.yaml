review_pass:
  verdict: revise
  source_fidelity: The draft correctly preserves the purpose clause, Satan’s name, and the explanatory conjunction. However, “irigbu anyị” primarily narrows πλεονεκτηθῶμεν to deceiving/tricking, whereas the Greek more broadly expresses Satan gaining an advantage at the believers’ expense. “Atụmatụ ọjọọ” adds the explicit adjective “evil,” which is not present in νοήματα; the hostile context may be understood without adding it.
  naturalness: “Ka Setan ghara irite uru n’aka anyị” is clear, idiomatic Standard Igbo for preventing Satan from gaining an advantage over/at the expense of the community. “anyị amaghị atụmatụ ya” naturally conveys the present sense, “we are not ignorant of his plans.”
  terminology: Setan is an appropriate established Igbo form. “Atụmatụ” suitably renders νοήματα here without over-specifying the term. The revised wording retains the source’s breadth and does not introduce an unnecessary evaluative adjective.
  issues:
  - severity: medium
    issue: “irigbu anyị” is too narrow for πλεονεκτηθῶμεν.
    rationale: It foregrounds deception or trickery, while πλεονεκτέω in this context denotes being exploited, overreached, or having advantage taken of one more broadly.
  - severity: medium
    issue: “atụmatụ ọjọọ” adds “ọjọọ” (“evil”).
    rationale: νοήματα means thoughts, intentions, designs, or plans; the Greek does not state the adjective “evil,” even though the context concerns Satan.
  - severity: low
    issue: “anyị amaghịghị” is less direct for the Greek present negation.
    rationale: “anyị amaghị” is the straightforward Standard Igbo form for “we do not know/are not ignorant of.”
  revised_text: ka Setan ghara irite uru n’aka anyị[a], n’ihi na anyị amaghị atụmatụ ya[b].
  revised_footnotes:
