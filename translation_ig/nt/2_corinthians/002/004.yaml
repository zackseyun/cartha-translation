  text: ἐκ γὰρ πολλῆς θλίψεως καὶ συνοχῆς καρδίας ἔγραψα ὑμῖν διὰ πολλῶν δακρύων, οὐχ ἵνα λυπηθῆτε, ἀλλὰ τὴν ἀγάπην ἵνα γνῶτε ἣν ἔχω περισσοτέρως εἰς ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/002/004.yaml
  text: For out of much affliction and anguish of heart I wrote to you through many tears[a], not so that you might be grieved[b], but so that you might know the love that I have especially for you.
translation:
  language: ig
  text: N’ihi na ọ bụ site n’oké mkpagbu na nhụjuanya nke obi ka m ji ọtụtụ anya mmiri degara unu akwụkwọ[a]. Ọ bụghị iji mee ka unu nwee mwute, kama ọ bụ ka unu mara ịhụnanya m nwere n’ebe unu nọ karị[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “site n’ọtụtụ anya mmiri.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ịhụnanya bara ụba m nwere n’ebe unu nọ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκ γὰρ πολλῆς θλίψεως
  choice: N’ihi na ọ bụ site n’oké mkpagbu
  rationale: “Site na” na-egosi na ihe ahụ e dere sitere n’ọnọdụ ahụ Pọl nọ na ya; “oke mkpagbu” na-edobe ibu nke θλίψεως n’emeghị ka ọ bụrụ naanị mkpagbu sitere n’aka ndị ọzọ.
- source_word: συνοχῆς καρδίας
  choice: nhụjuanya nke obi
  rationale: Nke a na-egosi oke mgbu na mkpagide dị n’ime obi n’Igbo doro anya ma dị ùgwù.
- source_word: ἔγραψα ὑμῖν
  choice: degara unu akwụkwọ
  rationale: Ọ bụ ụzọ Igbo nkịtị si ekwu “I wrote to you”; anaghị etinye echiche na ngwaa ahụ n’onwe ya na nke a bụ akwụkwọ ozi gara aga.
- source_word: διὰ πολλῶν δακρύων
  choice: ji ọtụtụ anya mmiri
  rationale: Nke a na-edobe ihe oyiyi nke ide ihe n’anya mmiri ma na-arụ ọrụ dịka ihe so ide ahụ mee; e nyere ntụgharị nke na-akpachi anya n’ala ala okwu na nkọwa ala peeji.
- source_word: οὐχ ἵνα λυπηθῆτε
  choice: Ọ bụghị iji mee ka unu nwee mwute
  rationale: Nke a na-egosipụta ebumnuche a jụrụ ajụ nakwa na ihe Pọl dere pụrụ ịkpata mwute, n’Igbo sitere n’okike.
- source_word: ἀλλὰ ... ἵνα γνῶτε
  choice: kama ọ bụ ka unu mara
  rationale: Ọ na-edobe ọdịiche na ahịrịokwu ebumnuche ahụ n’enweghị ịkọwa γνῶτε karịa ihe ọ na-ekwu.
- source_word: τὴν ἀγάπην
  choice: ịhụnanya
  rationale: “Ịhụnanya” bụ okwu Igbo kwesịrị ekwesị ma bụrụkwa ntụgharị a na-ejikarị eme ihe maka ἀγάπη.
- source_word: ἣν ἔχω περισσοτέρως εἰς ὑμᾶς
  choice: ịhụnanya pụrụ iche m nwere n’ebe unu nọ
  rationale: “Pụrụ iche” na-egosi ike nke περισσοτέρως n’Igbo sitere n’okike, ebe nkọwa ala peeji na-echekwa ntụgharị nke na-egosi ụba ma ọ bụ ntụnyere nke ọma karị.
