- from: N’ihi na ọ bụ site n’oké mkpagbu na nhụjuanya nke obi ka m ji ọtụtụ anya mmiri degara unu akwụkwọ[a]. Ọ bụghị iji mee ka unu nwee mwute, kama ọ bụ ka unu mara ịhụnanya pụrụ iche m nwere n’ebe unu nọ[b].
  to: N’ihi na ọ bụ site n’oké mkpagbu na nhụjuanya nke obi ka m ji ọtụtụ anya mmiri degara unu akwụkwọ[a]. Ọ bụghị iji mee ka unu nwee mwute, kama ọ bụ ka unu mara ịhụnanya m nwere n’ebe unu nọ karị[b].
  rationale: Only the rendering of περισσοτέρως has been adjusted. “Karị” more faithfully conveys the Greek comparative/intensive sense than “pụrụ iche,” while retaining the original’s ambiguity about the implied point of comparison. Footnote b is aligned with that alternative expression; both anchors remain attached to the phrases they elucidate.
  reviewer_model: gpt-5.6-terra
