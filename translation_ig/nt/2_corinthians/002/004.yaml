translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị mfe nghọta ma dị ùgwù. A hapụrụ ike mmetụta uche dị n’amaokwu ahụ, ma e zere okwu ụka pụrụ iche ma ọ bụ nkọwa okpukpe agbakwunyere.
