id: 2CO.2.7
reference: 2 Corinthians 2:7
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὥστε τοὐναντίον ⸀μᾶλλον ὑμᾶς χαρίσασθαι καὶ παρακαλέσαι, μή πως τῇ περισσοτέρᾳ λύπῃ καταποθῇ ὁ τοιοῦτος.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/002/007.yaml
  text: so that[a], on the contrary, you should rather forgive and comfort him[b], so that such a person may not be overwhelmed by excessive sorrow.
translation:
  language: ig
  text: Kama nke ahụ, ọ ka mma ka unu gbaghara ya[a] ma kasie ya obi, ka oke mwute ghara ilo onye dị otu a.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, ‘jiri amara gbaghara ya’; ngwaa Grik a nwere njikọ na igosi amara ma ọ bụ imere mmadụ ebere.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοὐναντίον
  choice: Kama nke ahụ
  rationale: Na-egosi na ha kwesịrị ịgbanwe ụzọ ha si emeso onye ahụ; ọ bụ okwu Igbo doro anya ma kwekọọ n’echiche ‘on the contrary.’
- source_word: μᾶλλον
  choice: kwesịrị
  rationale: N’usoro ahịrịokwu Igbo a, ntụgharị ‘kama nke ahụ’ tinyere ‘kwesịrị’ na-egosipụta na ihe ha kwesịrị ime ugbu a bụ nke ọzọ, na-enweghị ime ka okwu ahụ sie ike karịa Grik.
- source_word: χαρίσασθαι
  choice: ịgbaghara ya
  rationale: N’ọnọdụ ịdọ aka ná ntị na iweghachi onye ahụ, ngwaa a pụtara inye mgbaghara; ndetu ala peeji na-echekwa njikọ ya na amara na imere mmadụ ebere.
- source_word: παρακαλέσαι
  choice: kasịe ya obi
  rationale: N’ebe a, ọ bụ ịkasi onye nwere mwute obi ka a na-ekwu, ọ bụ ezie na ngwaa ahụ nwekwara ike ịpụta ịgba ume.
- source_word: καταποθῇ
  choice: ilo
  rationale: Na-echekwa ihe atụ Grik nke ịbụ onye ihe ‘lorola,’ nke a na-aghọta nke ọma n’Igbo dịka ịbụ onye mwute meriri kpamkpam.
- source_word: ὁ τοιοῦτος
  choice: onye dị otu a
  rationale: Na-ezo aka n’onye ahụ n’enweghị ịkọwa ihe Grik akọwaghị ma ọ bụ iji okwu ochie.
- source_word: περισσοτέρᾳ λύπῃ
  choice: oke mwute
  rationale: Na-enye echiche nke mwute gabigara ókè n’Igbo dị mfe ma dị ebube.
theological_decisions: []
translation_notes:
  register: Standard Igbo dị ugbu a, dị mfe nghọta ma dị ùgwù. A họọrọ ‘Kama nke ahụ’ iji gosipụta ntụgharị omume ahụ, ebe ‘kasịe ya obi’ na-adabara ọnọdụ iweghachi onye mwute. Ihe atụ ‘ilo’ ka e debere n’ahịrị bụ isi; ndetu [b] na-eme ka ọdịdị okwu Grik pụta ìhè, ọ bụ ezie na ọ na-emegharị akụkụ ahịrị bụ isi.
