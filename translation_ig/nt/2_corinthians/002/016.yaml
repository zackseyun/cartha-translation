- from: 'N’ebe ndị nke mbụ nọ, ọ bụ ísì nke si n’ọnwụ gaa n’ọnwụ; n’ebe ndị nke ọzọ nọkwa, ọ bụ ísì nke si ná ndụ gaa ná ndụ.[a][b] Ònyekwa zuru oke maka ihe ndị a?[c]


