  text: οἷς μὲν ὀσμὴ ⸀ἐκ θανάτου εἰς θάνατον, οἷς δὲ ὀσμὴ ⸁ἐκ ζωῆς εἰς ζωήν. καὶ πρὸς ταῦτα τίς ἱκανός;
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/002/016.yaml
  text: To the one[a], a fragrance from death to death; to the other, a fragrance from life to life[c][b]. And who is sufficient for these things?
translation:
  language: ig
  text: 'Nye ụfọdụ, ọ bụ ísì si n’ọnwụ gaa n’ọnwụ; ma nye ndị ọzọ, ọ bụ ísì si ná ndụ gaa ná ndụ.[a][b] Ònye ruru eru maka ihe ndị a?[c]


    [a] A pụkwara ịsụgharị “ísì” n’ebe abụọ a dị ka “ihe na-esi ísì.”


    [b] Okwu ndị a, “si n’ọnwụ gaa n’ọnwụ” na “si ná ndụ gaa ná ndụ,” nwere ike ịpụta isi iyi na ihe ọ na-eduga na ya (“si n’ọnwụ pụta, na-eduga n’ọnwụ” / “si ná ndụ pụta, na-eduga ná ndụ”), ma ọ bụ bụrụ ụzọ e si mesie ọnwụ na ndụ ike.


    [c] A pụkwara ịsụgharị “ruru eru” dị ka “tozuru etozu” ma ọ bụ “zuru.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị “ísì” n’ebe abụọ a dị ka “ihe na-esi ísì.”
    reason: lexical_alternative
  - marker: b
    text: Okwu ndị a, “si n’ọnwụ gaa n’ọnwụ” na “si ná ndụ gaa ná ndụ,” nwere ike ịpụta isi iyi na ihe ọ na-eduga na ya (“si n’ọnwụ pụta, na-eduga n’ọnwụ” / “si ná ndụ pụta, na-eduga ná ndụ”), ma ọ bụ bụrụ ụzọ e si mesie ọnwụ na ndụ ike.
    reason: alternative_reading
  - marker: c
    text: A pụkwara ịsụgharị “ruru eru” dị ka “tozuru etozu” ma ọ bụ “zuru.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὀσμή
  choice: ísì
  rationale: “Ísì” bụ okwu Igbo sara mbara maka ihe imi na-anụ; ọ na-echekwa ihe atụ nke Pọl n’ebughị ụzọ kpebie na ísì ahụ dị ụtọ ma ọ bụ dị njọ.
- source_word: ἐκ θανάτου εἰς θάνατον
  choice: si n’ọnwụ gaa n’ọnwụ
  rationale: Nsụgharị a na-esochi nhazi okwu Grik ahụ ma na-echekwa ma ndakọrịta ya na akụkụ nke ọzọ ma nghọta ya nke a na-apụghị ikpebi kpamkpam.
- source_word: ἐκ ζωῆς εἰς ζωήν
  choice: si ná ndụ gaa ná ndụ
  rationale: A hapụrụ usoro mbupute na ebe ọ na-aga dịka ọ dị na Grik, ka ọ daba n’ụzọ ziri ezi na “si n’ọnwụ gaa n’ọnwụ.”
- source_word: πρὸς ταῦτα
  choice: maka ihe ndị a
  rationale: Nke a na-egosipụta ọtụtụ ihe nke ταῦτα ma bụrụkwa okwu Igbo doro anya maka ịdị oke ruru ihe ndị a na-ekwu.
- source_word: ἱκανός
  choice: zuru oke
  rationale: “Zuru oke” na-egosi onye ruru eru ma ọ bụ onye ike ya ruru ibu ọrụ ahụ, ma na-echekwa ụda ajụjụ Pọl.
theological_decisions:
- issue: Ihe nkebi abụọ ahụ “si n’ọnwụ gaa n’ọnwụ” na “si ná ndụ gaa ná ndụ” pụtara kpọmkwem
  choice: E debere usoro okwu Grik dị mkpirikpi n’ahịrị bụ isi, n’akọwaghị ya naanị dịka isi iyi na nsonaazụ ma ọ bụ dịka nkwusi ike.
  alternative: “si n’ọnwụ pụta, na-eduga n’ọnwụ” / “si ná ndụ pụta, na-eduga ná ndụ,” ma ọ bụ “ísì ọnwụ” / “ísì ndụ.”
  rationale: Grik nwere ike ibu echiche isi iyi na nsonaazụ ma ọ bụ nkwusi ike. Ịhapụ usoro ahụ dịka ọ dị na-echekwa mgbagwoju anya na esemokwu nkà mmụta okpukpe dị n’ebe ahụ.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị ùgwù ma dị mfe nghọta. E debere ndakọrịta ahịrịokwu abụọ ahụ na ajụjụ nkwubi okwu Pọl. “Ísì” adịghị ekpebi ma ihe ahụ ọ̀ na-esi ụtọ ma ọ bụ na ọ na-esi njọ.
