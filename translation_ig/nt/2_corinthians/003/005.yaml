id: 2CO.3.5
reference: 2 Corinthians 3:5
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: οὐχ ὅτι ⸂ἀφ’ ἑαυτῶν ἱκανοί ἐσμεν⸃ λογίσασθαί τι ὡς ἐξ ⸀αὑτῶν, ἀλλ’ ἡ ἱκανότης ἡμῶν ἐκ τοῦ θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/003/005.yaml
  text: Not that we are sufficient in ourselves to consider anything as coming from ourselves[a], but our sufficiency is from God[b],
translation:
  language: ig
  text: Ọ bụghị na anyị ruru eru n’onwe anyị[a] ịtụle[b] ihe ọ bụla ka ọ bụ ihe sitere n’onwe anyị; kama iru eru anyị sitere na Chineke.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya dịka ‘anyị tozuru’ ma ọ bụ ‘anyị zuru ezu.’
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị ya dịka ‘ịgụ n’uche’ ma ọ bụ ‘ịgụta.’
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐχ ὅτι
  choice: Ọ bụghị na
  rationale: Nke a na-egosi na Pọl na-eme ka okwu ya doo anya, ọ bụghị na ọ na-enye ihe kpatara ya.
- source_word: ἀφ’ ἑαυτῶν ἱκανοί ἐσμεν
  choice: anyị nwere ike zuru ezu n’onwe anyị
  rationale: Okwu a na-egosi ikike ma ọ bụ ntozu nke mmadụ chere na o sitere n’ime onwe ya; ‘ike zuru ezu’ bụ okwu Igbo doro anya ma na-adabara ndị na-agụ akwụkwọ taa.
- source_word: λογίσασθαί
  choice: ịtụle
  rationale: Ngwaa a pụtara iji uche tụlee, gụọ, ma ọ bụ kpebie ihe; ‘ịtụle’ na-echekwa echiche ahụ n’Igbo nkịtị.
- source_word: τι
  choice: ihe ọ bụla
  rationale: N’ahịrịokwu a jụrụ ajụ, okwu a na-egosi ihe ọbụla n’enweghị mmachi.
- source_word: ὡς ἐξ αὑτῶν
  choice: dị ka ihe si n’aka anyị pụta
  rationale: Nke a na-echekwa echiche nke isi mmalite—dị ka a ga-asị na ihe ahụ sitere n’aka anyị onwe anyị.
- source_word: ἡ ἱκανότης ἡμῶν
  choice: ike anyị nwere ime ya
  rationale: Nke a jikọtara ya na ‘ike zuru ezu’ dị n’akụkụ mbụ ma mee ka aha nkịtị ahụ bụrụ Igbo na-aga nke ọma, n’enweghị ibelata ya ka ọ bụrụ naanị nka ọrụ ozi.
- source_word: ἐκ τοῦ θεοῦ
  choice: si n’aka Chineke
  rationale: Nke a na-egosi Chineke n’ụzọ doro anya dịka isi iyi nke ike ahụ.
theological_decisions:
- issue: Ókè okwu Pọl banyere ikike mmadụ ruru
  choice: E debere okwu ahụ ka ọ bụrụ nkwupụta sara mbara banyere enweghị ike sitere n’onwe mmadụ.
  alternative: Ịkọwa ya naanị dịka iru eru maka ọrụ ozi ndịozi.
  rationale: Ọnọdụ gbara amaokwu ahụ gburugburu metụtara ọrụ ozi, ma okwu Grik n’onwe ya sara mbara; ya mere, nsụgharị ahụ ekwesịghị imechi ihe ederede ahụ karịa ka o kwuru.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị ùgwù ma dị mfe nghọta. E zere okwu ụka pụrụ iche; a hapụrụ okwu ahụ ka ọ gbasaa karịa naanị nka ọrụ ozi, dịka asụsụ Grik si dị.
