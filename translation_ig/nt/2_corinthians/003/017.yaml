  text: ὁ δὲ κύριος τὸ πνεῦμά ἐστιν· οὗ δὲ τὸ πνεῦμα ⸀κυρίου, ἐλευθερία.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/003/017.yaml
  text: The Lord is the Spirit[a], and where the Spirit of the Lord is, there is freedom.
translation:
  language: ig
  text: Onyenwe anyị bụ Mmụọ[a]; ebe Mmụọ Onyenwe anyị nọ, nnwere onwe dị.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, a pụrụ ịghọta “Onyenwe anyị bụ Mmụọ” dịka njirimara chiri anya n’ihe gbara amaokwu a gburugburu, n’agwaghị kpọmkwem otú e kwesịrị isi kọwaa mmekọrịta ahụ n’ihe gbasara ozizi.
    reason: alternative_reading
lexical_decisions:
- source_word: κύριος
  choice: Onyenwe anyị
  rationale: Nke a bụ okwu Igbo a na-ejikarị asụgharị κύριος n’ọnọdụ Akwụkwọ Nsọ, ọ na-egosikwa ịdị elu na ikike nke Onye ahụ a na-ekwu maka ya.
- source_word: πνεῦμα
  choice: Mmụọ
  rationale: E ji mkpụrụedemede ukwu dee ya n’ihi na n’ebe abụọ a ọ na-arụtụ aka na Mmụọ Chineke, ma etinyeghị ‘Nsọ’ n’ahịrịokwu ahụ n’ihi na okwu ahụ adịghị kpọmkwem n’asụsụ Grik.
- source_word: οὗ
  choice: ebe ... nọ
  rationale: Usoro a na-enye nghọta ọnọdụ nke οὗ n’Igbo dị ugbu a, n’etinyeghị echiche sara mbara nke ‘ebe ọ bụla’ nke okwu Grik ahụ na-adịghị achọ kpọmkwem.
- source_word: ἐλευθερία
  choice: nnwere onwe
  rationale: Nke a bụ okwu Igbo doro anya ma bụrụkwa nke a na-eji eme ihe ugbu a maka freedom/liberty; ọ na-echekwa ibu echiche nke okwu Grik ahụ.
- source_word: ὁ δὲ κύριος τὸ πνεῦμά ἐστιν
  choice: Onyenwe anyị bụ Mmụọ
  rationale: E chekwara ahịrịokwu nhata ahụ kpọmkwem n’enweghị ịkọwa ụdị njikọ ahụ n’ụzọ ozizi. A hapụrụ δέ ka nhazi okwu na ihe gbara amaokwu ahụ gburugburu gosi njikọ ya, kama ịgbakwunye okwu oge na-adịghị na Grik.
- source_word: τὸ πνεῦμα κυρίου
  choice: Mmụọ Onyenwe anyị
  rationale: Nke a bụ usoro Igbo ebumpụta ụwa nke na-echekwa njikọ genitive dị na Grik, ya bụ ‘Mmụọ nke Onyenwe anyị.’
theological_decisions:
- issue: Nkwupụta njirimara dị n’okwu ‘Onyenwe anyị bụ Mmụọ’ nwere nkọwa dị iche iche n’ihe gbasara ozizi.
  choice: 'A sụgharịrị ya dịka nkwupụta nhata kpọmkwem: ‘Onyenwe anyị bụ Mmụọ.’'
  alternative: A pụrụ ịghọta ya dịka njirimara chiri anya n’ọrụ ma ọ bụ n’ọgbụgba ndụ, n’ekpebighị na ọ bụ nkọwa zuru ezu banyere ụdị mmekọrịta dị n’etiti Onyenwe anyị na Mmụọ.
  rationale: Asụsụ Grik kwuru njirimara ahụ ozugbo. Ya mere, nsụgharị ahụ kwesịrị ichekwa ike na esemokwu nkọwa ya, kama idozi ya site n’ịgbakwunye nkọwa otu òtù ozizi.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, nke dị ùgwù ma dị mfe nghọta. E zere okwu ochie na nkọwa otu ụka. Akara ukwu ‘Mmụọ’ na-enyere onye na-agụ ya aka ịmata na ọ na-arụtụ aka na Mmụọ Chineke, ma a gbakwunyeghị ‘Nsọ’ ebe isi asụsụ etinyeghị ya.
