  text: ὃς καὶ ἱκάνωσεν ἡμᾶς διακόνους καινῆς διαθήκης, οὐ γράμματος ἀλλὰ πνεύματος, τὸ γὰρ γράμμα ἀποκτέννει, τὸ δὲ πνεῦμα ζῳοποιεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/003/006.yaml
  text: who also made us competent as servants of a new covenant[a], not of the letter but of the Spirit; for the letter kills[c][b], but the Spirit gives life.
translation:
  language: ig
  text: Ọ bụkwa ya mere ka anyị tozuo ịbụ ndị na-eje ozi nke ọgbụgba ndụ ọhụrụ, ọ bụghị nke mkpụrụedemede kama nke Mmụọ[a]; n'ihi na mkpụrụedemede[b] na-egbu, ma Mmụọ na-enye ndụ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “mmụọ” n'ebe abụọ ahụ.
    reason: alternative_reading
  - marker: b
    text: A pụkwara ịghọta “mkpụrụedemede” dị ka “iwu e dere ede.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἱκάνωσεν
  choice: mere ka anyị ruo eru
  rationale: Na-egosi na Chineke nyere ha ikike na ntozu maka ọrụ ahụ, ọ bụghị naanị na o kwuru na ha zuru oke n'onwe ha.
- source_word: διακόνους
  choice: ndị na-eje ozi
  rationale: Na-echekwa echiche bụ isi nke ije ozi ma na-ezere itinye n'amaokwu ahụ aha ọkwa ụka nke okwu Grik ahụ n'onwe ya anaghị amanye.
- source_word: καινῆς διαθήκης
  choice: n'ọgbụgba ndụ ọhụrụ
  rationale: Ọ bụ ụzọ Igbo doro anya ma dịkwa mma isi gosi ọrụ ha metụtara ọgbụgba ndụ ọhụrụ ahụ, na-ahapụghị echiche ọgbụgba ndụ nke okwu Grik διαθήκη.
- source_word: γράμματος / γράμμα
  choice: mkpụrụedemede
  rationale: Na-echekwa ihe atụ dị mkpirikpi Pọl ji na ọdịiche ya na πνεῦμα; nkọwa dịka ‘iwu e dere ede’ ga-eme ka ihe okwu Grik pụrụ ịpụta dị warara karịa ka o kwesịrị.
- source_word: πνεύματος / πνεῦμα
  choice: Mmụọ
  rationale: N'ọnọdụ ọgbụgba ndụ ọhụrụ a, o yikarịrị ka ọ na-ezo aka na Mmụọ Nsọ; e debere ohere ịghọta ya dị ka ‘mmụọ’ n'okpuru peeji.
- source_word: ἀποκτέννει
  choice: na-egbu
  rationale: Ọ bụ ntụgharị kwụ ọtọ, siri ike, nke na-echekwa omume dị ugbu a na ọdịiche Pọl mere.
- source_word: ζῳοποιεῖ
  choice: na-enye ndụ
  rationale: Ọ bụ Igbo eke ma doo anya nke na-egosi omume inye ndụ dị n'okwu Grik ahụ.
theological_decisions:
- issue: Ma πνεῦμα ò kwesịrị ịbụ ‘Mmụọ’ ka ọ bụ ‘mmụọ’
  choice: Mmụọ
  alternative: mmụọ
  rationale: Ọnọdụ okwu banyere ọgbụgba ndụ ọhụrụ na ọrụ inye ndụ na-akwado nghọta na ọ bụ Mmụọ Nsọ. Ma ebe ihe odide Grik oge ochie anaghị eji mkpụrụedemede ukwu na nke nta kewaa nghọta abụọ ahụ, e chekwara nhọrọ nke ọzọ n'okpuru peeji.
- issue: Ihe γράμμα pụtara n'ọdịiche ‘mkpụrụedemede’ na ‘Mmụọ’
  choice: mkpụrụedemede
  alternative: iwu e dere ede
  rationale: A hapụrụ ihe atụ Pọl n'ụdị sara mbara ya kama ịkọwa ya ozugbo dị ka usoro iwu e dere ede, nke ga-emechi ụfọdụ nghọta okwu ahụ nwere ike ibu n'ọnọdụ a.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E ji ‘ndị na-eje ozi’ zere aha ọkwa ụka; e jikwa ‘mkpụrụedemede’ chekwaa ihe atụ na esemokwu dị n'okwu mbụ. Akara ala peeji niile dị n'ederede isi.
