- from: Ọ bụkwa ya mere ka anyị ruo eru ịbụ ndị na-eje ozi n'ọgbụgba ndụ ọhụrụ, ọ bụghị nke mkpụrụedemede kama nke Mmụọ[a]; n'ihi na mkpụrụedemede[b] na-egbu, ma Mmụọ na-enye ndụ.
  to: Ọ bụkwa ya mere ka anyị tozuo ịbụ ndị na-eje ozi nke ọgbụgba ndụ ọhụrụ, ọ bụghị nke mkpụrụedemede kama nke Mmụọ[a]; n'ihi na mkpụrụedemede[b] na-egbu, ma Mmụọ na-enye ndụ.
