  text: Ἀρχόμεθα πάλιν ἑαυτοὺς ⸀συνιστάνειν; ⸀ἢ μὴ χρῄζομεν ὥς τινες συστατικῶν ἐπιστολῶν πρὸς ὑμᾶς ἢ ἐξ ⸀ὑμῶν;
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/003/001.yaml
  text: Are we beginning again to commend ourselves? Or do we need[a], like some, letters of recommendation to you or from you?
translation:
  language: ig
  text: Ànyị na-amalite ọzọ ito onwe anyị? Ka ànyị, dị ka ụfọdụ, chọrọ akwụkwọ ozi nkwado nye unu ma ọ bụ site n'aka unu?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀρχόμεθα
  choice: Ànyị na-amalite
  rationale: Ọ bụ ngwaa dị n’ụdị ugbu a, nke e ji jụọ ajụjụ nkwughachi; nkebi a na-egosipụta echiche ịmalite ime ihe ọzọ n’ụzọ Igbo dị mfe.
- source_word: πάλιν
  choice: ọzọ
  rationale: Ọ na-egosi na ihe ahụ bụ imeghachi omume e kwuru maka ya.
- source_word: ἑαυτοὺς
  choice: onwe anyị
  rationale: Ọ bụ nnọchiaha na-alaghachi n’ebe ndị na-ekwu okwu nọ.
- source_word: συνιστάνειν
  choice: ito
  rationale: N’ebe a, ngwaa ahụ pụtara igosi ma ọ bụ kwuo ihe ga-eme ka a nabata mmadụ nke ọma; ‘ito onwe anyị’ bụ okwu Igbo doro anya ma na-echekwa ụda ajụjụ Pọl.
- source_word: μὴ χρῄζομεν
  choice: Ka ànyị ... chọrọ
  rationale: Ajụjụ a na-atụ anya azịza na-adịghị mma; usoro ajụjụ Igbo na-eburu nke ahụ n’enweghị ịgbakwunye okwu ga-eme ka ọ bụrụ nkwupụta.
- source_word: ὥς τινες
  choice: dị ka ụfọdụ ndị
  rationale: Ọ na-atụnyere Pọl na ndị a na-akpọghị aha.
- source_word: συστατικῶν ἐπιστολῶν
  choice: akwụkwọ ozi e ji akwado anyị n’ihu unu
  rationale: Nkebi Grik ahụ na-ezo aka n’akwụkwọ ozi e ji ewebata mmadụ ma gbaara ya akaebe; ntụgharị a bụ nke oge a ma ghara iji okwu Igbo na-adịghị adịkarị.
- source_word: πρὸς ὑμᾶς
  choice: n’ihu unu
  rationale: N’usoro okwu a, πρός na-egosi ndị akwụkwọ ozi ahụ ga-erute ma n’ihu ndị a ga-akwado onye ahụ; ‘n’ihu unu’ na-eme ka ọrụ akwụkwọ ozi ahụ doo anya.
- source_word: ἢ ἐξ ὑμῶν
  choice: ma ọ bụ nke si n’aka unu
  rationale: ἐξ na-egosi isi iyi; ntụgharị a na-egosi na ndị Kọrịnt ga-enye akwụkwọ ozi ahụ.
theological_decisions: []
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E debere ajụjụ abụọ nke Pọl na ụda nkwughachi ha. A naghị etinye akara nkọwa ala peeji n’ihi na ọdịiche Bekee ahụ bụ nkọwa lexical n’etiti ‘recommendation’ na ‘commendation,’ ebe otu ntụgharị Igbo doro anya zuru ezu.
