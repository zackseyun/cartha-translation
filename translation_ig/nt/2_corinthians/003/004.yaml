  text: Such confidence we have through Messiah toward God[a][b].
translation:
  language: ig
  text: Anyị nwere ntụkwasị obi dị otu a site na Mesaya n’ebe Chineke nọ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “site na Kraịst.”
    reason: alternative_reading
lexical_decisions:
- source_word: Πεποίθησιν
  choice: obi ike
  rationale: “Obi ike” na-egosi nkwenye siri ike na ntụkwasị obi Pọl nwere n’ọnọdụ a, n’etinyeghị ihe ọzọ dị ka onye a tụkwasịrị obi n’ime okwu ahụ.
- source_word: δὲ τοιαύτην
  choice: dị otu a
  rationale: Nke a na-ejikọta okwu ahụ nwayọọ nwayọọ na ihe e kwuru tupu ya ma na-echekwa ike ngosipụta nke τοιαύτην, ya bụ, “ụdị a” ma ọ bụ “otu a.”
- source_word: ἔχομεν
  choice: ka anyị nwere
  rationale: Nke a bụ ụzọ Igbo doro anya ma kwekọọ n’usoro ahịrịokwu isi kwuo “anyị nwere.”
- source_word: διὰ τοῦ Χριστοῦ
  choice: site n’aka Mesaya
  rationale: διά tinyere genitive na-egosi onye e si n’aka ya nweta ihe; “site n’aka” bụ okwu Igbo nkịtị maka ọrụ onye ogbugbo. “Mesaya” na-echekwa Χριστός dịka aha ọkwa.
- source_word: πρὸς τὸν θεόν
  choice: n’ebe Chineke nọ
  rationale: Nke a na-echekwa ntụziaka/nhụjuanya okwu πρός n’ụzọ Igbo kwụ ọtọ ma ghara ịkọwa ya naanị dịka “n’ihu Chineke.”
theological_decisions:
- issue: Nsụgharị Χριστοῦ
  choice: Mesaya
  alternative: Kraịst
  rationale: N’ebe a Χριστός ka na-arụ ọrụ dịka aha ọkwa nke Onye E Tere Mmanụ; ya mere “Mesaya” bụ isi nsụgharị, ebe “Kraịst” bụ usoro ọdịnala a pụrụ iji dochie ya.
- issue: Mmekọrịta nke πρὸς τὸν θεόν
  choice: n’ebe Chineke nọ
  alternative: n’ihu Chineke
  rationale: A họọrọ okwu na-echekwa echiche nke ịtụgharị uche ma ọ bụ ịdabere n’ebe Chineke nọ, kama idozi ambiguity ahụ ka ọ bụrụ naanị iguzo n’ihu Chineke.
translation_notes:
  register: Igbo ọkọlọtọ, dị ùgwù ma dị mfe nghọta. E ji “obi ike” mee ihe maka πεποίθησις, “site n’aka” maka ọrụ ogbugbo nke διά, ma hapụ “n’ebe Chineke nọ” ka ọ chekwaa obosara ihe πρός pụrụ ịpụta.
