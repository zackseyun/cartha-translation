- from: Obi ike dị otu a ka anyị nwere site n’aka Mesaya n’ebe Chineke nọ.[a]
  to: Anyị nwere ntụkwasị obi dị otu a site na Mesaya n’ebe Chineke nọ.[a]
  rationale: The revision replaces a courage-oriented expression with one denoting confidence, clarifies the mediatory phrase, and otherwise preserves the source’s syntax and the deliberate breadth of the Godward expression. The sole existing footnote anchor is retained and aligned with the revised wording.
