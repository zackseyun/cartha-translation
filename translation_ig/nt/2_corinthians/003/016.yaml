  yaml_path: translation/nt/2_corinthians/003/016.yaml
  text: But whenever one turns to the Lord[b][a], the veil is removed.
translation:
  language: ig
  text: Ma mgbe ọ bụla mmadụ chigharịkwuru Onyenwe anyị, a na-ewepụ ákwà mkpuchi ahụ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “a napụrụ ákwà mkpuchi ahụ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡνίκα δὲ ἐὰν
  choice: Ma mgbe ọ bụla
  rationale: Nke a na-edobe njikọ δέ ma na-egosipụta oge na-abụghị otu oge kpọmkwem, nke nwere ike ime mgbe ọ bụla.
- source_word: ἐπιστρέψῃ
  choice: mmadụ tụgharịrị
  rationale: “Tụgharịrị” na-edobe ihe atụ nke ịtụgharị n’enweghị ịkọwa ya kpọmkwem dị ka nchegharị ma ọ bụ mgbanwe okpukpe; “mmadụ” na-eme ka isiokwu onye a na-akọwaghị doo anya n’Igbo.
- source_word: πρὸς κύριον
  choice: bịakwute Onyenwe anyị
  rationale: “Bịakwute” na-egosipụta ntụzịaka mmadụ na-atụgharị gaa n’ebe Onyenwe anyị nọ n’ụzọ Igbo dị mma.
- source_word: κύριον
  choice: Onyenwe anyị
  rationale: Nke a bụ aha a na-ejikarị asụ κύριος n’Igbo, ma ọ naghị akọwapụta ma amaokwu a na-ekwu kpọmkwem banyere Kraịst ka ọ bụ Mmụọ.
- source_word: περιαιρεῖται
  choice: a na-ewepụ
  rationale: Ọ na-edobe olu nnara nke ngwaa Grik ma ghara ịgbakwunye onye na-ewepụ ihe ahụ.
- source_word: τὸ κάλυμμα
  choice: ákwà mkpuchi ahụ
  rationale: Ọ dabara n’ihe atụ ákwà Mozis ji kpuchie ihu ya, ma na-ezo aka n’ákwà mkpuchi ahụ a kpọtụrụla aha n’okwu gbara ya gburugburu.
theological_decisions:
- issue: Onye bụ isiokwu nke ἐπιστρέψῃ mgbe e nweghị aha onye e dere kpọmkwem
  choice: Tinye “mmadụ” dị ka isiokwu na-abụghị onye a kapịrị ọnụ
  alternative: Hapụ isiokwu ahụ ka a ghọta ya site n’usoro okwu
  rationale: Grik ekwughị otu onye kpọmkwem; “mmadụ” na-enye Igbo zuru oke ma na-edobe echiche izugbe ahụ n’enweghị ime ka ọ bụrụ naanị otu onye ma ọ bụ otu ìgwè.
- issue: Onye “Onyenwe anyị” bụ n’ebe a
  choice: Dowe naanị “Onyenwe anyị”
  alternative: “Onyenwe anyị Kraịst” ma ọ bụ “Onyenwe anyị, ya bụ, Mmụọ”
  rationale: κύριον n’amaokwu a akọwaghị onye ahụ karịa nke a. Nsụgharị ahụ kwesịrị idebe esemokwu nkọwa dị n’okwu gbara ya gburugburu kama idozi ya n’ahịrị amaokwu.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E ji “mgbe ọ bụla” chekwaa echiche oge na-abụghị otu oge kpọmkwem; e jighị okwu ụka pụrụ iche kọwaa ἐπιστρέψῃ. Akara nkọwa ala peeji [a] dị n’ederede isi.
