revisions:
- from: Ma mgbe ọ bụla mmadụ tụgharịrị bịakwute Onyenwe anyị, a na-ewepụ ákwà mkpuchi ahụ.[a]
  to: Ma mgbe ọ bụla mmadụ chigharịkwuru Onyenwe anyị, a na-ewepụ ákwà mkpuchi ahụ.[a]
  rationale: The revision uses “chigharịkwuru” for ἐπιστρέψῃ πρὸς κύριον, preserving the source’s turn-to metaphor in idiomatic Standard Igbo without adding a separate coming action. The footnote is replaced with a genuine lexical alternative for the passive removal of the veil and removes the unsupported word “kpamkpam.”
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T19:25:12Z'
review_pass:
  verdict: revise
  source_fidelity: The temporal-indefinite force of ἡνίκα δὲ ἐὰν and the passive sense of περιαιρεῖται are substantially represented. However, “tụgharịrị bịakwute” adds a secondary motion (‘comes’) and is less exact than the single Greek verb with πρός; “chigharịkwuru” directly conveys ‘turns to.’
  naturalness: “Mgbe ọ bụla mmadụ chigharịkwuru Onyenwe anyị” is natural, dignified Standard Igbo and avoids the somewhat cumbersome serial expression “tụgharịrị bịakwute.” The generic present “a na-ewepụ” suitably expresses what happens whenever the stated condition occurs.
  terminology: “Onyenwe anyị” appropriately retains κύριον without deciding its referent in this complex context. “Ákwà mkpuchi ahụ” accurately continues Paul’s veil image. The current footnote’s addition of “kpamkpam” (‘completely’) is unsupported by περιαιρεῖται and must not be retained.
  issues:
  - severity: medium
    issue: The expression “tụgharịrị bịakwute” over-explicates ἐπιστρέψῃ πρὸς κύριον.
    rationale: It can mean ‘turned and came to,’ whereas the Greek expresses the single idiom ‘turns to.’ “Chigharịkwuru” preserves both the metaphor and direction without added action.
  - severity: high
    issue: Footnote [a] adds “kpamkpam” (‘completely’).
    rationale: The Greek verb means ‘is removed/taken away’ and contains no modifier for completeness. This alternative introduces an unwarranted semantic element.
  revised_text: Ma mgbe ọ bụla mmadụ chigharịkwuru Onyenwe anyị, a na-ewepụ ákwà mkpuchi ahụ.[a]
  revised_footnotes:
  - marker: a
    text: Ma ọ bụ, “a napụrụ ákwà mkpuchi ahụ.”
    reason: lexical_alternative
  revision_rationale: The revision uses “chigharịkwuru” for ἐπιστρέψῃ πρὸς κύριον, preserving the source’s turn-to metaphor in idiomatic Standard Igbo without adding a separate coming action. The footnote is replaced with a genuine lexical alternative for the passive removal of the veil and removes the unsupported word “kpamkpam.”
