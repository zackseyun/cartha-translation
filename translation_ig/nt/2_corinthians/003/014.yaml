id: 2CO.3.14
reference: 2 Corinthians 3:14
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἀλλὰ ἐπωρώθη τὰ νοήματα αὐτῶν. ἄχρι γὰρ τῆς σήμερον ⸀ἡμέρας τὸ αὐτὸ κάλυμμα ἐπὶ τῇ ἀναγνώσει τῆς παλαιᾶς διαθήκης μένει μὴ ἀνακαλυπτόμενον, ⸀ὅτι ἐν Χριστῷ καταργεῖται,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/003/014.yaml
  text: But their minds were hardened[a]. For until this very day, at the reading of the old covenant, the same veil remains, not being lifted[b], because in Messiah it is removed.
translation:
  language: ig
  text: Ma e mere ka uche ha sie ike. N’ihi na ruo taa, mgbe a na-agụ ọgbụgba ndụ ochie[a], otu ákwà mkpuchi ahụ ka dị, a naghị ebuli ya elu, n’ihi na ọ bụ n’ime Mesaya ka a na-ewepụ ya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụ ya “Agba Ochie.” N’asụsụ Grik, ọ bụ “ọgbụgba ndụ ochie.”
    reason: lexical_alternative
  - marker: b
    text: 'A pụkwara ịghọta ya dị ka: “n’ihi na ọ bụ n’ime Mesaya ka a na-eme ka ọ kwụsị / ka a na-ewepụ ya,” ebe “ya” nwere ike izo aka n’ọgbụgba ndụ ochie kama izo aka n’ákwà mkpuchi.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπωρώθη
  choice: e mere ka ... sie ike
  rationale: Na-egosipụta passive nke okwu Grik ahụ, ya bụ na uche ha ghọrọ ihe siri ike, nke na-adịghị anabata nghọta n’ụzọ dị mfe, n’etinyeghị echiche siri ike karịa nke isi mmalite.
- source_word: νοήματα
  choice: uche
  rationale: “Uche” bụ okwu Igbo nkịtị nke gụnyere echiche na ikike nghọta, dabara n’arụmụka Pọl n’ebe a.
- source_word: κάλυμμα
  choice: ákwà mkpuchi
  rationale: Na-echekwa ihe atụ nke ákwà Mozis ji kpuchie ihu ya n’okwu ndị gbara amaokwu a gburugburu.
- source_word: ἐπὶ τῇ ἀναγνώσει
  choice: mgbe a na-agụ
  rationale: Ọ bụ ntụgharị Igbo dị ndụ ma doo anya nke na-egosi oge a na-agụ ihe ahụ.
- source_word: παλαιᾶς διαθήκης
  choice: ọgbụgba ndụ ochie
  rationale: διαθήκη pụtara ọgbụgba ndụ n’ebe a; nhọrọ a na-ebute ihe odide Grik ụzọ karịa omenala ịsụ ya “Agba Ochie.”
- source_word: μὴ ἀνακαλυπτόμενον
  choice: a naghị ebuli ya elu
  rationale: Na-echekwa passive participle na ihe atụ nke ibuli ákwà mkpuchi elu, n’Igbo doro anya.
- source_word: ἐν Χριστῷ
  choice: n’ime Mesaya
  rationale: Χριστός bụ aha ọkwa pụtara Mesaya; “n’ime Mesaya” na-echekwa usoro na echiche nke okwu Grik ahụ.
- source_word: καταργεῖται
  choice: a na-ewepụ ya
  rationale: “Ewepụ” dabara nke ọma ma ọ bụrụ na ihe a na-ekwu banyere ya bụ ákwà mkpuchi, ma ọ naghị egbochi onye na-agụ ịghọta ihe ọzọ syntax ahụ nwere ike ịpụta.
theological_decisions:
- issue: Ihe καταργεῖται na-ezo aka na ya
  choice: 'N’isi ederede, “ya” na-ezo n’ụzọ kachasị nso n’ákwà mkpuchi: ọ bụ n’ime Mesaya ka a na-ewepụ ya.'
  alternative: O nwere ike ịbụ ọgbụgba ndụ ochie ka a na-ekwu na a na-eme ka ọ kwụsị ma ọ bụ na a na-ewepụ; syntax Grik nwere ntakịrị mgbagwoju anya.
  rationale: Ákwà mkpuchi bụ antecedent kacha nso, nke a kwekọkwara na “a naghị ebuli ya elu.” Ma nkọwa ala peeji na-edebe ụzọ ọgụgụ ọzọ ka a ghara idozi esemokwu dị n’ihe odide n’enweghị ihe zuru ezu.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. E debere ihe atụ nke ákwà mkpuchi, passive nke ahịrịokwu ahụ, na ntakịrị mgbagwoju anya banyere ihe a na-ewepụ. Akara ụda dị na “ákwà” na-enyere aka ikewapụ ya n’okwu ndị ọzọ, ma usoro ahịrịokwu ahụ ka bụ nke onye Igbo nkịtị ga-aghọta.
