revisions:
- from: Ma ọ bụrụ na ọrụ ije ozi nke ọnwụ, nke e ji mkpụrụ edemede kanye n’elu nkume, bịara n’ebube, nke mere na ụmụ Izrel[a] enweghị ike ilegide ihu Mosis anya n’ihi ebube dị n’ihu ya—ebube ahụ nke na-apụ n’anya[b]—
  to: Ma ọ bụrụ na ọrụ ije ozi nke ọnwụ, nke e dere n’akwụkwọ ozi ma pịrị n’elu nkume, bịara n’ebube, nke mere na ụmụ Izrel[a] enweghị ike ilegide ihu Mosis anya n’ihi ebube dị n’ihu ya, bụ́ ebube na-ada mba[b],
  rationale: The revision restores the Greek relationship between “letters” and “stones,” retains the open-ended syntax of the verse, and uses an idiomatic description of the fading visible glory. The alternative sense of καταργουμένην remains in a footnote without resolving Paul’s broader contrast doctrinally. The lexical footnote for “ụmụ Izrel” is recast without implying that the Greek phrase necessarily restricts the referent to males.
  reviewer_model: gpt-5.6-terra
