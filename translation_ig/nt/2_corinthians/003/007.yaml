id: 2CO.3.7
reference: 2 Corinthians 3:7
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Εἰ δὲ ἡ διακονία τοῦ θανάτου ἐν ⸀γράμμασιν ⸀ἐντετυπωμένη λίθοις ἐγενήθη ἐν δόξῃ, ὥστε μὴ δύνασθαι ἀτενίσαι τοὺς υἱοὺς Ἰσραὴλ εἰς τὸ πρόσωπον Μωϋσέως διὰ τὴν δόξαν τοῦ προσώπου αὐτοῦ τὴν καταργουμένην,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/003/007.yaml
  text: But if the ministry of death[a], engraved in letters on stones, came with glory, so that the sons of Israel were not able to gaze at Moses’ face because of the glory of his face, which was fading away[b],
translation:
  language: ig
  text: Ma ọ bụrụ na ọrụ ije ozi nke ọnwụ, nke e dere n’akwụkwọ ozi ma pịrị n’elu nkume, bịara n’ebube, nke mere na ụmụ Izrel[a] enweghị ike ilegide ihu Mosis anya n’ihi ebube dị n’ihu ya, bụ́ ebube na-ada mba[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ndị Izrel.”
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị ya, “nke a na-eweta ná njedebe” ma ọ bụ “nke na-agafe.”
    reason: alternative_reading
lexical_decisions:
- source_word: διακονία
  choice: ọrụ ije ozi
  rationale: Nke a na-egosipụta ma ọrụ a na-arụ ma ozi e nyere mmadụ ka ọ na-elekọta, ma dabara n’ụzọ Pọl si atụnyere ọgbụgba ndụ abụọ.
- source_word: τοῦ θανάτου
  choice: nke ọnwụ
  rationale: A hapụrụ njikọ genitive a n’ụdị ya dị mkpirikpi ka okwu Pọl siri ike ghara ịghọ nkọwa e tinyere n’ime amaokwu ahụ.
- source_word: ἐν γράμμασιν ἐντετυπωμένη λίθοις
  choice: nke e ji mkpụrụ edemede kanye n’elu nkume
  rationale: “Kanye” na-egosi ihe e debere n’elu ihe site n’ịkpụ ya; “nkume” na-edobe λίθοις n’enweghị itinye “mbadamba” nke Grik ekwughị kpọmkwem.
- source_word: ἐγενήθη ἐν δόξῃ
  choice: bịara n’ebube
  rationale: Nke a na-edobe ike ἐγενήθη nke na-egosi ihe bịara ịdị, ya na echiche nke ebube so ya.
- source_word: ὥστε μὴ δύνασθαι ἀτενίσαι
  choice: nke mere na … enweghị ike ilegide … anya
  rationale: “Ilegide … anya” na-egosipụta ile ihe anya nke ọma na n’esepụghị anya, ma na-edobekwa nsonaazụ ὥστε na-egosi.
- source_word: τοὺς υἱοὺς Ἰσραήλ
  choice: ụmụ Izrel
  rationale: Nke a bụ ụzọ Igbo dị mma na nke a na-aghọta ngwa ngwa isi kpọọ ndị Izrel; ihe okwu Grik pụtara n’ụzọ nkịtị ka akọwara n’okpuru amaokwu.
- source_word: εἰς τὸ πρόσωπον Μωϋσέως
  choice: ihu Mosis
  rationale: Nke a na-ada ka Igbo nkịtị mgbe ọ gbasoro “ilegide … anya,” ma na-edobe ihu Mosis dị ka ihe ha na-ele.
- source_word: καταργουμένην
  choice: nke na-apụ n’anya
  rationale: N’ebe a, okwu ahụ na-akọwa ebube a na-ahụ n’ihu Mosis nke na-agafe; nsụgharị a na-edobekwa echiche na ọ bụghị ihe na-adịgide adịgide.
theological_decisions:
- issue: Ma καταργουμένην ọ̀ na-ekwu maka ebube ahụ na-ebelata anya, ka ọ̀ na-ekwu n’ụzọ sara mbara maka ihe a na-eweta ná njedebe.
  choice: ebube ahụ nke na-apụ n’anya
  alternative: ebube ahụ nke a na-eweta ná njedebe; ebube ahụ nke na-agafe
  rationale: Ihe amaokwu a na-ekwu ozugbo bụ ebube dị n’ihu Mosis, ya mere “na-apụ n’anya” dabara n’ihe a pụrụ ịhụ. E debere ihe ndị ọzọ okwu Grik nwere ike ịpụta n’okpuru amaokwu ka a ghara idozi esemokwu echiche ahụ n’otu ụzọ naanị.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. “Ọrụ ije ozi” na-ezere ime διακονία ka ọ bụrụ naanị ọkwa ụka, ebe “mkpụrụ edemede” na-edobe ntụnyere Pọl na-eme n’etiti ihe e dere ede na Mmụọ. A hapụrụ ahịrịokwu ahụ ka ọ na-aga n’ihu, dịka nhazi Grik nke amaokwu na-esochi ya si dị.
