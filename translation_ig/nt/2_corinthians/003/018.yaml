revisions:
- from: Ma anyị niile, ndị ihu anyị na-enweghị ihe mkpuchi, na-ele ebube Onyenwe anyị dị ka n’enyo[a], a na-agbanwe anyị ka anyị yie otu onyinyo ahụ, site n’ebube ruo n’ebube, dịka o si n’aka Onyenwe anyị, bụ Mmụọ[b].
  to: Ma anyị niile, na-enweghị ihe mkpuchi n’ihu anyị, na-ele ebube Onyenwe anyị n’enyo[a], a na-agbanwe anyị ka anyị bụrụ otu onyinyo ahụ, site n’ebube ruo n’ebube, dịka o si n’aka Onyenwe anyị, bụ Mmụọ[b].
  rationale: The revision makes only safe idiomatic and semantic corrections. It preserves the source’s collective singular-face idiom in natural Igbo, keeps the disputed mirror sense and final phrase open through the existing footnotes, and renders the transformation as becoming the same image rather than only resembling it.
