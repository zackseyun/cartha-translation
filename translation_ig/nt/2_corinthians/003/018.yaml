id: 2CO.3.18
reference: 2 Corinthians 3:18
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἡμεῖς δὲ πάντες ἀνακεκαλυμμένῳ προσώπῳ τὴν δόξαν κυρίου κατοπτριζόμενοι τὴν αὐτὴν εἰκόνα μεταμορφούμεθα ἀπὸ δόξης εἰς δόξαν, καθάπερ ἀπὸ κυρίου πνεύματος.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/003/018.yaml
  text: And we all[a], with unveiled face, beholding the glory of the Lord as in a mirror, are being transformed into the same image from glory to glory, just as from the Lord[b], the Spirit.
translation:
  language: ig
  text: Ma anyị niile, na-enweghị ihe mkpuchi n’ihu anyị, na-ele ebube Onyenwe anyị n’enyo[a], a na-agbanwe anyị ka anyị bụrụ otu onyinyo ahụ, site n’ebube ruo n’ebube, dịka o si n’aka Onyenwe anyị, bụ Mmụọ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “na-egosipụta ebube Onyenwe anyị dị ka enyo.”
    reason: alternative_reading
  - marker: b
    text: Ma ọ bụ, “site n’aka Onyenwe anyị onye bụ Mmụọ”; ụzọ ọzọ bụ, “site n’aka Mmụọ nke Onyenwe anyị.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἀνακεκαλυμμένῳ προσώπῳ
  choice: ndị ihu anyị na-enweghị ihe mkpuchi
  rationale: Nke a na-egosi ọnọdụ dị ugbu a nke sitere n’iwepụ ihe mkpuchi ahụ, ma kwuo ya n’Igbo nkịtị ma doo anya.
- source_word: δόξαν κυρίου
  choice: ebube Onyenwe anyị
  rationale: Nke a sụgharịrị genitive ahụ n’ụzọ kwụ ọtọ ma jiri aha a na-ejikarị asụgharị κύριος.
- source_word: κατοπτριζόμενοι
  choice: na-ele ... dị ka n’enyo
  rationale: Ngwaa Grik a nwere ike ịpụta ile ihe n’enyo ma ọ bụ igosipụta ihe dị ka enyo. Isi ederede họọrọ ile ebube ahụ n’enyo; e debere nghọta nke ọzọ n’okpuru peeji.
- source_word: τὴν αὐτὴν εἰκόνα
  choice: otu onyinyo ahụ
  rationale: Nke a na-echekwa njikọ dị n’etiti ebube Onyenwe anyị na onyinyo a na-agbanwe ndị kwere ekwe ka ha yie.
- source_word: μεταμορφούμεθα
  choice: a na-agbanwe anyị
  rationale: Ụdị ugbu a nke passive na-egosi mgbanwe na-aga n’ihu, ọ bụghị naanị ihe mere otu mgbe.
- source_word: ἀπὸ δόξης εἰς δόξαν
  choice: site n’ebube ruo n’ebube
  rationale: A hapụrụ okwu Grik ahụ n’ụdị mkpirikpi ya kama ịgbasa ya n’ụzọ ga-akọwa karịa ihe ederede kwuru.
- source_word: καθάπερ
  choice: dịka
  rationale: Nke a bụ okwu Igbo dị ugbu a ma doo anya maka njikọ ntụnyere ahụ.
- source_word: ἀπὸ κυρίου πνεύματος
  choice: si n’aka Onyenwe anyị, bụ Mmụọ
  rationale: Nke a na-echekwa mkpirikpi okwu Grik ahụ na apposition ya n’etinyeghị nkọwa ozizi karịrị ihe e dere.
- source_word: κύριος
  choice: Onyenwe anyị
  rationale: Nke a bụ nsụgharị Igbo a na-ahụkarị, dị ùgwù, nke dabara n’ebe abụọ okwu ahụ pụtara n’amaokwu a.
theological_decisions:
- issue: Ihe κατοπτριζόμενοι pụtara
  choice: na-ele ebube Onyenwe anyị dị ka n’enyo
  alternative: na-egosipụta ebube Onyenwe anyị dị ka enyo
  rationale: Ọnọdụ amaokwu ahụ na-egosi ịhụ ebube Onyenwe anyị nke na-eduga ná mgbanwe, ya mere isi ederede họọrọ ‘na-ele.’ Ma ebe ngwaa Grik ahụ nwere ike ịpụta nghọta nke ọzọ n’ezie, e debere ya n’okpuru peeji.
- issue: Mmekọrịta dị n’etiti κυρίου na πνεύματος n’ahịrị ikpeazụ
  choice: si n’aka Onyenwe anyị, bụ Mmụọ
  alternative: si n’aka Onyenwe anyị onye bụ Mmụọ; ma ọ bụ, si n’aka Mmụọ nke Onyenwe anyị
  rationale: Akpaokwu Grik ahụ dị mkpirikpi ma nwee ike ịkọwa n’ụzọ ndị a dị iche iche. Isi ederede na-anọgide nso n’okwu ahụ ma ghara idozi esemokwu ahụ n’ụzọ ozizi kpọmkwem.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ okwu ndị a na-anụkarị dịka “ihe mkpuchi,” “ebube,” “onyinyo,” na “a na-agbanwe anyị,” ma chekwaa mgbagwoju anya abụọ dị na Grik site n’okpuru peeji.
