    text: Ma ọ bụ, “n’ihi ebube ahụ na-akakarị.”
    reason: Greek participle ahụ nwere ike ịkpọwa “ebube” dịka ebube na-akakarị, n’etinyeghị “ya”; Greek ekwughị kpọmkwem ihe ebube ahụ karịrị.
  revision_rationale: 'E dochiri “n’akụkụ a” anya na “n’ihe a” ka e wee gosipụta nke ọma ihe Greek idiom ahụ pụtara: ọ bụ mmachi n’usoro ntụnyere. E degharịrị naanị ihe odide ala peeji iji zere echiche “karịrị akarị” nke nwere ike ịpụta ebube gabigara ókè, ma chekwaa ambiguity nke participle Greek ahụ. A hapụrụ “ihe ahụ e nyere ebube … enweghị ebube” ka e wee debe nrụgharị δοξ- na nkwupụta ntụnyere paradoxical nke amaokwu ahụ.'
