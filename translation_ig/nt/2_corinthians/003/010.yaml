id: 2CO.3.10
reference: 2 Corinthians 3:10
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ γὰρ οὐ δεδόξασται τὸ δεδοξασμένον ἐν τούτῳ τῷ μέρει ⸀εἵνεκεν τῆς ὑπερβαλλούσης δόξης·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/003/010.yaml
  text: For indeed[a], what had been glorified has not been glorified in this respect, because of the glory that surpasses it.
translation:
  language: ig
  text: N’ihi na, n’ezie, ihe ahụ e nyere ebube enweghị ebube n’ihe a, n’ihi ebube ahụ nke karịrị ya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “n’ihi ebube ahụ na-akakarị.”
    reason: Greek participle ahụ nwere ike ịkpọwa “ebube” dịka ebube na-akakarị, n’etinyeghị “ya”; Greek ekwughị kpọmkwem ihe ebube ahụ karịrị.
lexical_decisions:
- source_word: καὶ γὰρ
  choice: N’ihi na, n’ezie
  rationale: “N’ihi na” na-egosi na okwu a na-akọwa ihe e kwuru tupu ya, ebe “n’ezie” na-echekwa nkwusikwu okwu dị na καί.
- source_word: οὐ δεδόξασται
  choice: enweghị ebube
  rationale: N’Igbo, ntụgharị a na-egosi n’ụzọ doro anya na ebube mbụ ahụ dị ka ihe na-enweghị ebube mgbe e jiri ya tụnyere nke ka ya; ọ na-echekwakwa ike nke nkwupụta Pọl n’ebughị ụzọ kwuo na ebube adịghị ya ma ọlị.
- source_word: τὸ δεδοξασμένον
  choice: ihe ahụ e nyere ebube
  rationale: A hapụrụ ya dịka ihe a na-akpọghị aha kpọmkwem, dịka participle Greek ahụ si dị, ma jiri passive “e nyere ebube” chekwaa njikọ ya na okwu δοξ-.
- source_word: ἐν τούτῳ τῷ μέρει
  choice: n’akụkụ a
  rationale: Nke a na-amachi nkwupụta ahụ n’otu akụkụ ntụnyere, kama ime ka ọ bụrụ ịgọnahụ ebube mbụ ahụ kpamkpam.
- source_word: εἵνεκεν
  choice: n’ihi
  rationale: Nke a bụ ụzọ nkịtị ma doo anya e si egosi ihe kpatara ihe n’Igbo.
- source_word: τῆς ὑπερβαλλούσης δόξης
  choice: ebube ahụ nke karịrị ya
  rationale: “Nke karịrị ya” na-eme ka ike ntụnyere nke participle ahụ pụta ìhè. “Ya” sitere n’ihe gbara amaokwu ahụ gburugburu, ọ bụ ezie na Greek akpọghị ihe a karịrị aha kpọmkwem.
- source_word: δόξα / δεδοξασμένον wordplay
  choice: e nyere ebube … ebube
  rationale: Iji “ebube” n’ebe abụọ ahụ na-echekwa njikọ okwu na ụda nkwughachi nke δοξ- dị na Greek.
theological_decisions:
- issue: Ma Pọl ọ na-agọnahụ kpamkpam na ọrụ ọgbụgba ndụ mbụ nwere ebube, ka ọ na-ekwu naanị n’ụzọ ntụnyere.
  choice: A ghọtara ya dịka ịsị na ebube mbụ ahụ dị ka ihe na-enweghị ebube n’akụkụ ntụnyere a, n’ihi ebube nke karịrị ya.
  alternative: Ịsị na ọrụ mbụ ahụ enweghị ezi ebube ọ bụla ma ọlị.
  rationale: “N’akụkụ a” na-amachi ịgọnahụ ahụ, ebe amaokwu ndị gbara ya gburugburu na-ekwu na ọrụ mbụ ahụ nwere ebube, ma ebube ka ukwuu kpuchiri ya.
translation_notes:
  register: Asụsụ Igbo Izugbe nke oge a, dị ugwu ma dị mfe nghọta. E jighị aha nkà mmụta okpukpe tinye ihe Greek na-akpọghị aha, ma e chekwara nkwughachi “ebube” na ọdịiche ntụnyere nke amaokwu ahụ.
