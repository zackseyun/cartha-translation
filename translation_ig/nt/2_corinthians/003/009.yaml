id: 2CO.3.9
reference: 2 Corinthians 3:9
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: εἰ γὰρ ⸂τῇ διακονίᾳ⸃ τῆς κατακρίσεως δόξα, πολλῷ μᾶλλον περισσεύει ἡ διακονία τῆς ⸀δικαιοσύνης δόξῃ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/003/009.yaml
  text: For if the ministry of condemnation came with glory[a], much more does the ministry of righteousness abound in glory.
translation:
  language: ig
  text: N’ihi na ọ bụrụ na ozi nke ikpe ọmụma ji ebube bịa, ozi nke ezi omume[a] na-ejubiga n’ebube ókè karịa ya nke ukwuu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ikpe ziri ezi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: διακονία
  choice: ozi
  rationale: “Ozi” na-egosi ọrụ ije ozi ma dabara n’ụzọ Pọl si atụnyere ozi abụọ ahụ; ọ dịkwa mfe nghọta n’Igbo ugbu a.
- source_word: κατάκρισις
  choice: ikpe ọmụma
  rationale: “Ikpe ọmụma” na-echekwa echiche iwu nke ikpe na-ama mmadụ ikpe, kama ịbụ naanị ikpe n’ozuzu ya.
- source_word: δόξα
  choice: ebube
  rationale: “Ebube” bụ okwu Igbo a na-ejikarị akọwa δόξα, ma na-echekwa njikọ ya na arụmụka Pọl banyere ebube.
- source_word: πολλῷ μᾶλλον
  choice: karịa ya nke ukwuu
  rationale: 'Nke a na-egosipụta ike ntụnyere ahụ: ozi nke abụọ karịrị nke mbụ nke ukwuu.'
- source_word: περισσεύω
  choice: na-aba ụba
  rationale: “Na-aba ụba” na-echekwa echiche nke ịjuputa ma ọ bụ ịkarị akarị, na-agbakwụghị ihe okwu Grik kwuru.
- source_word: δικαιοσύνη
  choice: ezi omume
  rationale: “Ezi omume” bụ ntụgharị Igbo doro anya maka righteousness n’ọnọdụ Pọl a; e debere “ikpe ziri ezi” dị ka ụzọ ọzọ na nkọwa ala peeji.
- source_word: εἰ γὰρ τῇ διακονίᾳ τῆς κατακρίσεως δόξα
  choice: N’ihi na ọ bụrụ na ozi nke ikpe ọmụma ji ebube bịa
  rationale: Nkebi Grik ahụ enweghị ngwaa; “ji ebube bịa” na-etinye ngwaa Igbo dị mkpa n’enweghị ịgbanwe isi echiche na ebube so ozi ahụ bịa.
theological_decisions:
- issue: Ntughari δικαιοσύνη n’etiti ozi abụọ Pọl na-atụnyere
  choice: ezi omume
  alternative: ikpe ziri ezi
  rationale: “Ezi omume” na-echekwa nghọta Pauline nke righteousness n’ahịrịokwu bụ isi, ebe “ikpe ziri ezi” na-anọgide na nkọwa ala peeji dịka akụkụ ọzọ nke ihe okwu Grik ahụ pụrụ ịpụta.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, dị ugwu ma dị mfe nghọta. E ji “ozi” mee ka echiche ọrụ ije ozi dị nkenke ma kwekọọ n’usoro ntụnyere Pọl; e jighị okwu ụka pụrụ iche nke otu denominashọn.
