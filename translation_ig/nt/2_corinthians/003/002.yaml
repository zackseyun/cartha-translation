translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A haziri participle passive abụọ ahụ dị ka okwu active nke “mmadụ niile” na-achị, n’ihi na nke ahụ bụ usoro kacha ebumpụta ụwa n’Igbo, ma ihe ha pụtara agbanwebeghị.
