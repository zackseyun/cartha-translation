  text: ἡ ἐπιστολὴ ἡμῶν ὑμεῖς ἐστε, ἐγγεγραμμένη ἐν ταῖς καρδίαις ἡμῶν, γινωσκομένη καὶ ἀναγινωσκομένη ὑπὸ πάντων ἀνθρώπων·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/003/002.yaml
  text: You are our letter[a], written in our hearts, known and read by all people.
translation:
  language: ig
  text: Unu bụ akwụkwọ ozi anyị, nke e dere n’obi anyị, nke mmadụ niile maara ma na-agụ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡ ἐπιστολὴ ἡμῶν
  choice: akwụkwọ ozi anyị
  rationale: “Akwụkwọ ozi” bụ okwu Igbo doro anya, nke oge a, maka ozi e dere ede; “anyị” na-egosi na ndị Kọrịnt bụ akwụkwọ ozi Pọl na ndị ya na ha na-eje ozi n’ụzọ ihe atụ.
- source_word: ὑμεῖς ἐστε
  choice: Unu onwe unu bụ
  rationale: “Unu onwe unu” na-ebupụta nkwusi ike dị na nnọchiaha Greek ὑμεῖς ma ka na-ada nke ọma n’Igbo.
- source_word: ἐγγεγραμμένη
  choice: nke e dere
  rationale: Oge perfect passive participle na-egosi ihe e dere nke ka dị otú ahụ; “nke e dere” na-echekwa ma ọnọdụ passive ma ihe atụ akwụkwọ ozi ahụ.
- source_word: ἐν ταῖς καρδίαις ἡμῶν
  choice: n’ime obi anyị
  rationale: “N’ime” na-egosipụta ἐν nke ọma, ebe “obi anyị” bụ ụzọ Igbo si ekwu ya n’ụzọ ebumpụta ụwa n’agbanyeghị na Greek ji ọtụtụ “obi.”
- source_word: γινωσκομένη
  choice: maara
  rationale: N’usoro ahịrịokwu Igbo a, passive Greek ghọrọ active n’ihi “mmadụ niile” dị ka onye na-eme ihe ahụ. “Maara” na-eburu isi echiche nke ịbụ ihe a maara, ebe “na-amata” ka bụ nhọrọ ọzọ.
- source_word: ἀναγινωσκομένη
  choice: na-agụ
  rationale: “Na-agụ” na-echekwa kpọmkwem ihe atụ nke akwụkwọ ozi a na-agụ.
- source_word: ὑπὸ πάντων ἀνθρώπων
  choice: nke mmadụ niile
  rationale: “Mmadụ niile” gụnyere ụmụ nwoke na ụmụ nwanyị ma na-egosipụta oke zuru ụwa ọnụ nke πάντων ἀνθρώπων n’Igbo nkịtị.
