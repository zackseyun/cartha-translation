id: 2CO.3.15
reference: 2 Corinthians 3:15
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἀλλ’ ἕως σήμερον ἡνίκα ⸂ἂν ἀναγινώσκηται⸃ Μωϋσῆς κάλυμμα ἐπὶ τὴν καρδίαν αὐτῶν κεῖται·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/003/015.yaml
  text: But to this day[a], whenever Moses is read[b], a veil lies over their heart.
translation:
  language: ig
  text: Ma ruo taa, mgbe ọ bụla a na-agụ Mosis[a], ihe mkpuchi ka na-adị n’elu obi ha[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N’ebe a, “Mosis” pụtara ihe odide Mosis, karịchaa Iwu ahụ.
    reason: cultural_note
  - marker: b
    text: Grik kwuru “obi ha” ebe “obi” dị n’otu; o yiri ka e ji otu okwu ahụ achịkọta ha niile. A pụkwara ịsụgharị ya ka ọ pụta “obi onye ọ bụla n’ime ha.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλ’
  choice: Ma
  rationale: Ọ na-egosi ọdịiche dị n’etiti okwu a na ihe e kwuru tupu ya; “Ma” bụ okwu Igbo dị mkpirikpi ma dịkwa n’usoro ebe a.
- source_word: ἕως σήμερον
  choice: ruo taa
  rationale: Ọ na-egosi na ọnọdụ ahụ gara n’ihu wee ruo n’oge a; “ruo taa” bụ ụzọ Igbo si ekwu ya n’ụzọ ebumpụta ụwa.
- source_word: ἡνίκα ἂν ἀναγινώσκηται
  choice: mgbe ọ bụla a na-agụ
  rationale: Njikọ ἡνίκα, ἄν na ngwaa present subjunctive na-egosi ọnọdụ na-eme ugboro ugboro n’oge ọ bụla.
- source_word: Μωϋσῆς
  choice: Mosis
  rationale: E debere aha ahụ dịka o si dị n’asụsụ Grik, ebe ọ nọchiri anya ihe odide Mosis; nkọwa dị n’okpuru peeji na-eme ka nke a doo anya n’enweghị ịgbasa isiokwu n’amaokwu ahụ.
- source_word: κάλυμμα
  choice: ihe mkpuchi
  rationale: Ọ dabara n’ihe atụ nke mkpuchi ihu Pọl ji mee ihe n’akụkụ Akwụkwọ Nsọ a, ma bụrụkwa okwu Igbo doro anya.
- source_word: ἐπὶ τὴν καρδίαν αὐτῶν
  choice: n’elu obi ha
  rationale: E debere “obi” n’otu n’otu dịka Grik si dị, ọ bụ ezie na “ha” na-ezo aka n’ọtụtụ mmadụ; o nwere ike ịbụ otu aha e ji achịkọta ìgwè mmadụ.
- source_word: κεῖται
  choice: ka na-adị
  rationale: Ọ na-egosi ihe dịgide n’ebe ọ nọ. “Ka na-adị” na-egosipụta ma ịdịgide ya ma ọnọdụ na-aga n’ihu ruo taa.
theological_decisions:
- issue: Ma a ga-akọwa “Mosis” n’amaokwu ahụ dịka Iwu Mosis ma ọ bụ ihe odide Mosis
  choice: Idowe “Mosis” n’isi amaokwu dịka aha nọchiri anya ihe odide ya
  alternative: Ịsụgharị ya “Iwu Mosis” ma ọ bụ “ihe odide Mosis”
  rationale: Grik kwuru “Mosis” kpọmkwem. Idowe ya otú ahụ na-echekwa ụzọ e si kwuo okwu n’ebe e si sụgharịta ya ma ghara ikpebi n’isi amaokwu ahụ ma ọ bụ naanị Iwu ka a na-ekwu maka ya; nkọwa ala peeji na-enye enyemaka dị mkpa.
- issue: Ma a ga-asụgharị “obi” dịka otu ma ọ bụ ọtụtụ
  choice: 'Idowe otu: “obi ha”'
  alternative: “obi dị iche iche ha” ma ọ bụ usoro ọzọ na-egosi ọtụtụ obi
  rationale: Grik ji “obi” n’otu, ya na nnọchiaha na-ezo aka n’ọtụtụ mmadụ. Idowe otu ahụ na-echekwa ụdị okwu mkpokọta ahụ na nghọtahie ọ bụla o nwere ike ibu.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ “ihe mkpuchi” iji mee ka njikọ ya na ihe atụ mkpuchi ihu dị n’isiakwụkwọ ahụ pụta ìhè. E tinyere akara [a] ozugbo n’azụ “Mosis,” ebe nkọwa ya metụtara, na [b] n’azụ “obi ha.”
