  variant: Standard Igbo
source:
  edition: SBLGNT
  text: πῶς οὐχὶ μᾶλλον ἡ διακονία τοῦ πνεύματος ἔσται ἐν δόξῃ;
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/003/008.yaml
  text: how will the ministry of the Spirit not be even more in glory?[a]
translation:
  language: ig
  text: 'Olee otú ije ozi nke Mmụọ na-agaghị adị n’ebube karịa?[a]


    [a] Ma ọ bụ, “ga-enwe ebube karịa.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ga-enwe ebube karịa.”
    reason: Ụzọ ọzọ e si egosi n’Igbo okwu Grik ἐν δόξῃ n’usoro a.
lexical_decisions:
- source_word: πῶς οὐχὶ
  choice: Olee otú ... na-agaghị
  rationale: Nke a na-edobe ụdị ajụjụ nkwuwa okwu Grik nke na-atụ anya azịza nkwenye, kama ịgbanwe ya ka ọ bụrụ nkwupụta nkịtị.
- source_word: μᾶλλον
  choice: karịa nke ahụ
  rationale: Ọ na-egosi na e ji ije ozi a tụnyere nke a kpọtụrụ aha n’amaokwu bu ụzọ, ma na ebube nke a ka ukwuu.
- source_word: ἡ διακονία
  choice: ije ozi
  rationale: “Ije ozi” bụ okwu Igbo doro anya maka ọrụ e nyere mmadụ ịrụ, ọ na-adabakwa na ntụnyere Pọl na-eme n’akụkụ Akwụkwọ Nsọ a karịa “ozi,” nke nwekwara ike ịpụta ihe e zigara mmadụ.
- source_word: τοῦ πνεύματος
  choice: nke Mmụọ
  rationale: N’ọnọdụ a, ọ na-ezo aka na Mmụọ Nsọ; mkpụrụedemede ukwu na-egosi onye ahụ a na-ekwu maka ya n’etinyeghị nkọwa ọzọ n’amaokwu ahụ.
- source_word: ἔσται
  choice: ga-adị
  rationale: Ọ na-edobe ọdịnihu nke ngwaa Grik n’Igbo dị ugbu a ma dị mfe nghọta.
- source_word: ἐν δόξῃ
  choice: n’ebube
  rationale: Nke a na-edobe ihe atụ na nhazi okwu preposition nke Grik, tinyere njikọ ya na okwu “ebube” e ji rụọ ụka n’amaokwu ndị gbara ya gburugburu.
theological_decisions:
- issue: Ihe πνεύματος na-ezo aka na ya
  choice: Mmụọ Nsọ
  alternative: mmụọ n’ozuzu ya ma ọ bụ ike na-abụghị onye
  rationale: Ihe gbara amaokwu ahụ gburugburu na-atụnyere mkpụrụedemede na Mmụọ nke na-enye ndụ (2 Kọr. 3:6), ya mere “Mmụọ” na-ezo aka n’ebe a na Mmụọ Nsọ.
- issue: Ụdị mmekọrịta dị na τοῦ πνεύματος
  choice: ije ozi nke Mmụọ
  alternative: ije ozi nke Mmụọ na-arụ ma ọ bụ ije ozi nke na-enye Mmụọ
  rationale: Genitive Grik ahụ nwere ike igosi na ije ozi a bụ nke Mmụọ ma ọ bụ na Mmụọ ji ya mara; ntụgharị a na-ahapụ mmekọrịta ahụ ka ọ ghara ịdị warawara karịa ihe ederede kwuru.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke nwere ugwu ma dị mfe nghọta, dee ya. “Ije ozi” na-ezere mgbagwoju anya nke “ozi” dị ka ozi e zigara mmadụ. Ajụjụ ahụ ka bụ ajụjụ nkwuwa okwu, ebe “karịa nke ahụ” na-eme ka ntụnyere ya na amaokwu bu ụzọ doo anya.
