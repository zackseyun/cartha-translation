  revision_rationale: The revision preserves the Greek rhetorical future question and its lesser-to-greater comparison while avoiding an added explicit object of comparison. The footnote is retained as an idiomatic Igbo alternative, but its rationale is corrected so that it does not misrepresent the wording as ‘with glory.’
