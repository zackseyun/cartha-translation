revisions:
- from: N’ihi na ọ bụrụ na ihe a na-eme ka ọ kwụsị bịara site n’ebube,[a][b] lee ka ihe na-adịgide ga-esi bụrụ nnọọ ihe jupụtara n’ebube![c]
  to: N’ihi na ọ bụrụ na ihe a na-eme ka ọ kwụsị bịara n’ebube,[a][b] ihe na-adịgide karịsịa nọ n’ebube.[c]
  rationale: 'The revision makes the Igbo idiomatic while retaining the Greek contrast: what is being brought to an end came in/with glory, whereas what remains is, by much more, in glory. It removes added fullness imagery and avoids imposing a future sense. Footnote anchors and all three notes are retained and correctly attached.'
  reviewer_model: gpt-5.6-terra
