  text: εἰ γὰρ τὸ καταργούμενον διὰ δόξης, πολλῷ μᾶλλον τὸ μένον ἐν δόξῃ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/003/011.yaml
  text: For if what was being brought to an end came with glory[c][b][a], much more what remains is in glory.
translation:
  language: ig
  text: N’ihi na ọ bụrụ na ihe a na-eme ka ọ kwụsị bịara n’ebube,[a][b] ihe na-adịgide karịsịa nọ n’ebube.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ihe a na-ewepụ,” “ihe a na-eme ka ọ ghara ịdị irè,” ma ọ bụ “ihe a na-eme ka ọ gwụ.”
    reason: lexical_alternative
  - marker: b
    text: N’ụzọ nkịtị, “site n’ebube.” A pụkwara ịghọta ya dị ka “bịara n’ebube” ma ọ bụ “bịara ya na ebube.”
    reason: lexical_alternative
  - marker: c
    text: N’ụzọ nkịtị, “ihe na-adịgide nọ n’ebube.” A pụkwara ịsụgharị “ihe na-anọgide” ma ọ bụ “ihe na-adịgide adịgide.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καταργούμενον
  choice: ihe a na-eme ka ọ kwụsị
  rationale: Nke a na-egosipụta participle dị na present passive nke pụtara ihe a na-eme ka ọ ghara ịdị irè ma ọ bụ ka ọ kwụsị, n’enweghị itinye nkọwa kpọmkwem banyere ọgbụgba ndụ n’amaokwu ahụ.
- source_word: διὰ δόξης
  choice: bịara site n’ebube
  rationale: “Site n’ebube” na-ejigide διά na genitive nke ọma, ma na-ahapụ ntakịrị mgbagwoju anya nke okwu Grik kama ịkọwa ya naanị dị ka ‘ya na ebube.’
- source_word: μένον
  choice: ihe na-adịgide
  rationale: “Na-adịgide” na-egosi ihe na-anọgide ma ọ bụ na-aga n’ihu, ma na-echekwa ọdịiche ya na ihe a na-eme ka ọ kwụsị.
- source_word: ἐν δόξῃ
  choice: ga-abụ nnọọ ihe jupụtara n’ebube
  rationale: Nke a bụ ụzọ Igbo na-asọ asọ nke ọma isi gosipụta ọnọdụ nke ịdị n’ebube, n’agbanyeghị na n'ụzọ nkịtị okwu ahụ bụ ‘n’ebube.’
- source_word: πολλῷ μᾶλλον
  choice: lee ka ... ga-esi bụrụ nnọọ
  rationale: 'Usoro a na-egosipụta ike nke ntụnyere ahụ n’Igbo nkịtị: ihe na-adịgide karịrị nnọọ ihe na-akwụsị n’ebube.'
theological_decisions:
- issue: Ọdịiche dị n’etiti ihe na-akwụsị na ihe na-adịgide
  choice: E ji okwu izugbe “ihe a na-eme ka ọ kwụsị” na “ihe na-adịgide” mee ihe.
  alternative: A pụrụ ịkpọ ha kpọmkwem ọgbụgba ndụ ochie na ọgbụgba ndụ ọhụrụ.
  rationale: Grik n’amaokwu a kpọmkwem ejighị aha ọgbụgba ndụ abụọ ahụ; ọ bụ ọnọdụ gbara amaokwu ahụ gburugburu na-akọwa ha. Ya mere, nsụgharị ahụ anaghị etinye nkọwa nkà mmụta okpukpe karịa okwu Pọl.
- issue: Ike pụtara na καταργούμενον
  choice: ihe a na-eme ka ọ kwụsị
  alternative: ihe na-agwụ nwayọọ nwayọọ; ihe a na-ewepụ; ihe a na-eme ka ọ ghara ịdị irè
  rationale: Nhọrọ a na-egosipụta passive na echiche nke ime ka ihe kwụsị, ma ọ naghị eme ka okwu ahụ bụrụ naanị ‘ibelata nwayọọ nwayọọ.’
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E debere nhazi ntụnyere Pọl na ọdịiche dị n’etiti ihe a na-eme ka ọ kwụsị na ihe na-adịgide; e zere ịkpọ ọgbụgba ndụ abụọ ahụ aha n’amaokwu ebe Grik ekwughị ha kpọmkwem.
