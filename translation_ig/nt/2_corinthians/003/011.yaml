review_pass:
  verdict: revise
  source_fidelity: The draft accurately preserves the two substantival participles and does not add covenant labels. However, “ga-esi bụrụ nnọọ ihe jupụtara n’ebube” expands ἐν δόξῃ (‘in glory’) into ‘be very full of glory’ and introduces a future-like construction not expressed by the Greek. “Bịara site n’ebube” is overly wooden and unnatural in Igbo for διὰ δόξης in this context.
  naturalness: The opening conditional is natural, but “bịara n’ebube” is the idiomatic Igbo expression for something attended by glory. “Ihe na-adịgide karịsịa nọ n’ebube” is concise, preserves the comparative force, and avoids the added imagery of being ‘filled’ with glory.
  terminology: “Ihe a na-eme ka ọ kwụsị” suitably represents the present passive καταργούμενον without forcing ‘fading away’; “ihe na-adịgide” appropriately renders μένον. “Ebube” is the standard and fitting term for δόξα. Footnotes retain lexical alternatives and distinguish the source’s differing prepositions.
  issues:
  - severity: medium
    issue: The final clause adds ‘jupụtara’ (‘filled’) and a future-like ‘ga-esi bụrụ.’
    rationale: ἐν δόξῃ states that what remains is/in a condition of glory; it does not specifically say it is filled with glory or use a future form.
  - severity: medium
    issue: “Bịara site n’ebube” is not idiomatic Igbo in this construction.
    rationale: Although ‘site na’ can formally reflect διά, Igbo naturally says that something ‘bịara n’ebube’ when it came with/in glory. The literal prepositional alternative can be retained in a note.
  revised_text: N’ihi na ọ bụrụ na ihe a na-eme ka ọ kwụsị bịara n’ebube,[a][b] ihe na-adịgide karịsịa nọ n’ebube.[c]
  revised_footnotes:
