  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ οὐ καθάπερ Μωϋσῆς ἐτίθει κάλυμμα ἐπὶ τὸ πρόσωπον ⸀αὐτοῦ, πρὸς τὸ μὴ ἀτενίσαι τοὺς υἱοὺς Ἰσραὴλ εἰς τὸ τέλος τοῦ καταργουμένου.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/003/013.yaml
  text: and not like Moses[b][a], who used to put a veil over his face so that the sons of Israel would not gaze at the end of what was fading away.
translation:
  language: ig
  text: anyị anaghị eme dịka Mozis, onye na-etinyekarị ákwà mkpuchi n’ihu ya, ka ụmụ Izrel[b] ghara ilegide anya n’ọgwụgwụ[a] nke ihe na-agabiga.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụ ya, “n’ihe mgbaru ọsọ ma ọ bụ n’ihe ga-esi n’ihe a na-eme ka ọ kwụsị pụta.”
    reason: alternative_reading
  - marker: b
    text: N’asụsụ Grik, “ụmụ ndị ikom Izrel”; nke a bụ akpaala okwu pụtara “ndị Izrel.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καθάπερ
  choice: dị ka
  rationale: Ọ na-egosi ntụnyere n'ụzọ doro anya ma dịkwa ụtọ n'Igbo ugbu a.
- source_word: ἐτίθει
  choice: na-etinyekarị
  rationale: Ụdị imperfect a na-egosi omume Mozis na-emekarị, ọ bụghị naanị otu ihe mere otu ugboro.
- source_word: κάλυμμα
  choice: ákwà mkpuchi
  rationale: Nke a bụ okwu Igbo doro anya maka ákwà e ji ekpuchi ihu, ma kwekọọ n'akụkọ Ọpụpụ na ihe atụ Pọl ji ya mee.
- source_word: πρόσωπον αὐτοῦ
  choice: n’ihu ya
  rationale: Nke a na-enye ihe okwu Grik ahụ pụtara n'Igbo nkịtị ma doo anya.
- source_word: πρὸς τὸ μὴ ἀτενίσαι
  choice: ka ... ghara ilegide anya
  rationale: “Ka ... ghara” na-egosi nzube, “ilegide anya” na-echekwa echiche nke ile ihe anya nke ọma ma nọgide na-ele ya.
- source_word: τοὺς υἱοὺς Ἰσραήλ
  choice: ụmụ Izrel
  rationale: Ọ bụ akpaala okwu Akwụkwọ Nsọ a na-aghọta nke ọma n'Igbo dị ka ndị Izrel; nkọwa ala peeji na-echekwa ụdị okwu Grik kpọmkwem.
- source_word: εἰς τὸ τέλος
  choice: n’ọgwụgwụ
  rationale: “Ọgwụgwụ” dabara n'echiche nke ihe na-akwụsị n'okwu gbara amaokwu a gburugburu, ma a na-edebe echiche ndị ọzọ “ihe mgbaru ọsọ” na “ihe ga-esi na ya pụta” n'ala peeji.
- source_word: τοῦ καταργουμένου
  choice: nke ihe ahụ na-agwụ nwayọọ nwayọọ
  rationale: Nke a na-egosi ihe na-ala n'iyi ma ọ bụ na-akwụsị ịdị irè n'okwu gbasara ebube na-agafe agafe, n'etinyeghị nkọwa ozizi siri ike karịa ihe odide ahụ.
theological_decisions:
- issue: Ihe τέλος τοῦ καταργουμένου pụtara
  choice: ọgwụgwụ nke ihe ahụ na-agwụ nwayọọ nwayọọ
  alternative: ihe mgbaru ọsọ ma ọ bụ ihe ga-esi n’ihe a na-eme ka ọ kwụsị pụta
  rationale: Ihe gbara amaokwu a gburugburu na-atụnyere ihe na-adịru nwa oge na ihe na-adịgide. Nsụgharị bụ isi na-egosi nkwụsị ahụ, ebe nkọwa ala peeji na-edebe ohere τέλος nwere ike ịpụta “ihe mgbaru ọsọ” ma ọ bụ “ihe ga-esi na ya pụta.”
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. “Na-etinyekarị” na-echekwa omume a na-emekarị nke imperfect, ebe “ilegide anya” na-echekwa ike dị n'ἀτενίζω. E tinyere akara ala peeji [a] na [b] n'ebe ha metụtara kpọmkwem.
