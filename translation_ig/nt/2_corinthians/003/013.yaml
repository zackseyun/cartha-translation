    reason: alternative_reading
  - marker: b
    text: N’asụsụ Grik, “ụmụ ndị ikom Izrel”; nke a bụ akpaala okwu pụtara “ndị Izrel.”
    reason: lexical_alternative
  revision_rationale: The revision supplies the comparison’s implied first-person verbal frame for a complete and natural stand-alone Igbo sentence. It retains the imperfect customary sense in “na-etinyekarị,” the purpose force in “ka ... ghara,” and the intensive sense of ἀτενίζω in “ilegide anya.” “Ihe na-agabiga” preserves the contextual sense of what is transient while avoiding an unnecessarily narrow paraphrase of καταργουμένου. Footnote [a] is placed directly after “ọgwụgwụ,” and both notes are retained with their intended scope.
