id: 2CO.3.3
reference: 2 Corinthians 3:3
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: φανερούμενοι ὅτι ἐστὲ ἐπιστολὴ Χριστοῦ διακονηθεῖσα ὑφ’ ἡμῶν, ἐγγεγραμμένη οὐ μέλανι ἀλλὰ πνεύματι θεοῦ ζῶντος, οὐκ ἐν πλαξὶν λιθίναις ἀλλ’ ἐν πλαξὶν καρδίαις σαρκίναις.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/003/003.yaml
  text: showing that you are a letter from the Messiah[a], ministered by us, written not with ink but with the Spirit of the living God[d][c][b], not on stone tablets but on tablets of hearts of flesh.
translation:
  language: ig
  text: O doro anya na unu bụ akwụkwọ ozi si n’aka Mesaịa[a][b], nke anyị wetara, nke e dere ọ bụghị na inki kama site na Mmụọ nke Chineke dị ndụ; e deghị ya n’elu mbadamba nkume, kama n’elu mbadamba, ndị bụ obi anụ ahụ.[c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “akwụkwọ ozi nke Kraịst.” Genitive Grik ahụ nwere ike ịpụta onye nwe akwụkwọ ozi ahụ ma ọ bụ onye o si n’aka ya.
    reason: alternative_reading
  - marker: b
    text: “Mesaịa” bụ ntụgharị aha-utu Χριστός; a na-akpọkwa ya “Kraịst” n’ọdịnala.
    reason: lexical_alternative
  - marker: c
    text: “Obi anụ ahụ” na-echetara ihe e kwuru banyere ọgbụgba ndụ ọhụrụ, karịchaa Ezikiel 11:19 na 36:26.
    reason: cross_reference
  - marker: d
    text: A pụkwara ịsụ akụkụ ikpeazụ ahụ, “n’elu mbadamba obi anụ ahụ.”
    reason: alternative_rendering
lexical_decisions:
- source_word: φανερούμενοι
  choice: O doro anya
  rationale: Na-egosipụta na ihe Pọl na-ekwu banyere ndị Kọrịnt bụ ihe a na-ahụ anya ma doo anya, n’Igbo dị mfe ma kwụ ọtọ.
- source_word: ἐπιστολὴ
  choice: akwụkwọ ozi
  rationale: Ọ bụ okwu Igbo nke oge a maka akwụkwọ e zigara mmadụ, ma na-echekwa ihe atụ Pọl ji mee ihe.
- source_word: Χριστοῦ
  choice: si n’aka Mesaịa
  rationale: Genitive ahụ nwere ike igosi onye akwụkwọ ozi ahụ si n’aka ya ma ọ bụ onye nwe ya. Isi ederede họọrọ echiche nke isi mmalite/onye dere ya, ebe ndetu na-echekwa nkọwa nkịtị ‘nke Kraịst.’
- source_word: διακονηθεῖσα ὑφ’ ἡμῶν
  choice: nke e wetara site n’ozi anyị
  rationale: Nke a na-egosi na Pọl na ndị ọrụ ibe ya bụ ndị jere ozi n’iweta akwụkwọ ozi ihe atụ ahụ, na-emeghị ka ha bụrụ ndị ji Mmụọ dee ya.
- source_word: ἐγγεγραμμένη
  choice: nke e dere
  rationale: Ọ bụ ntụgharị Igbo nkịtị nke na-arụ ọrụ nke ọma n’ihe atụ banyere ink, Mmụọ, na mbadamba.
- source_word: μέλανι
  choice: ink
  rationale: Okwu a bụ aha a na-ejikarị eme ihe n’Igbo ugbu a maka ihe e ji ede ihe.
- source_word: πνεύματι θεοῦ ζῶντος
  choice: site na Mmụọ nke Chineke dị ndụ
  rationale: Ọnọdụ okwu ahụ na ntụnyere ya na ink na-egosi Mmụọ Chineke; ‘Chineke dị ndụ’ na-echekwa nkọwa Grik ahụ.
- source_word: πλαξὶν λιθίναις
  choice: mbadamba nkume
  rationale: Na-echekwa ntụaka ahụ gbasara mbadamba nkume nke ọgbụgba ndụ ochie n’asụsụ Igbo doro anya.
- source_word: πλαξὶν καρδίαις σαρκίναις
  choice: mbadamba—ndị bụ obi anụ ahụ
  rationale: Na-eme ka o doo anya na obi anụ ahụ bụ mbadamba ndị ahụ, kama imepụta usoro aha jikọrọ ọnụ nke ga-ada mgbagwoju anya n’Igbo; ọ na-echekwakwa olu Ezikiel banyere obi anụ ahụ.
theological_decisions:
- issue: Nkọwa Χριστοῦ
  choice: si n’aka Mesaịa
  alternative: nke Kraịst
  rationale: N’ihe atụ akwụkwọ ozi a, genitive nwere ike igosi isi mmalite ma ọ bụ onye nwe akwụkwọ ozi ahụ. Isi ederede na-enye nkọwa isi mmalite nke yikarịrị, ma ndetu na-echekwa ntụgharị nkịtị na enweghị mkpebi zuru ezu.
- issue: Nkọwa πνεύματι
  choice: Mmụọ nke Chineke dị ndụ
  alternative: mmụọ nke Chineke dị ndụ
  rationale: Ntụnyere ọrụ ide ihe nke Chineke na ink, tinyere ọnọdụ ọgbụgba ndụ ọhụrụ, na-akwado na a na-ekwu maka Mmụọ Nsọ, ọ bụghị nanị ume ma ọ bụ ọnọdụ uche.
- issue: Mmekọrịta πλαξὶν na καρδίαις σαρκίναις
  choice: mbadamba—ndị bụ obi anụ ahụ
  alternative: mbadamba obi anụ ahụ
  rationale: Nhazi ahụ na-akọwa obi ndị ahụ dị ka mbadamba e dere ihe n’elu ha. Akara nkwụsị na nkọwa ‘ndị bụ’ na-eme ka mmekọrịta ahụ doo anya n’Igbo ma na-echekwa ihe atụ ahụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E debere ihe atụ akwụkwọ ozi, ink, Mmụọ, na mbadamba; e zere okwu ụka pụrụ iche ebe okwu Igbo nkịtị ga-ezu. Akara ogologo ahụ na-enyere onye na-agụ ya aka ịhụ na obi anụ ahụ bụ mbadamba ihe atụ ahụ.
