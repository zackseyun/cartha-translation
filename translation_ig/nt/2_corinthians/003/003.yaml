revisions:
- from: O doro anya na unu bụ akwụkwọ ozi si n’aka Mesaịa[a][b], nke e wetara site n’ozi anyị, nke e dere ọ bụghị na ink kama site na Mmụọ nke Chineke dị ndụ; e deghị ya n’elu mbadamba nkume, kama n’elu mbadamba—ndị bụ obi anụ ahụ.[c][d]
  to: O doro anya na unu bụ akwụkwọ ozi si n’aka Mesaịa[a][b], nke anyị wetara, nke e dere ọ bụghị na inki kama site na Mmụọ nke Chineke dị ndụ; e deghị ya n’elu mbadamba nkume, kama n’elu mbadamba, ndị bụ obi anụ ahụ.[c][d]
  rationale: The revision restores the direct agency of ὑφ’ ἡμῶν while retaining the letter-metaphor sense of διακονηθεῖσα as ‘delivered.’ It also lightly regularizes the spelling of ‘inki’ and clarifies the final Greek apposition without flattening the imagery or resolving the genitive more strongly than the source permits.
