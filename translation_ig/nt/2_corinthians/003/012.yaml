  text: Since, then, we have such a hope, we act with great boldness,
translation:
  language: ig
  text: Ya mere, ebe anyị nwere olileanya dị otu a, anyị ji nnukwu obi ike na-ekwu okwu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “anyị na-ekwu okwu hoo haa nke ukwuu,” ma ọ bụ, “anyị na-ekwu okwu n’ezoghị ọnụ nke ukwuu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔχοντες οὖν
  choice: Ya mere, ebe anyị nwere
  rationale: “Ya mere” na-egosi nkwubi okwu οὖν sitere n’ihe e kwuru tupu ya; “ebe anyị nwere” na-egosikwa na participle ἔχοντες bụ ihe kpatara omume dị n’ahịrịokwu ukwu.
- source_word: τοιαύτην ἐλπίδα
  choice: olileanya dị otu a
  rationale: Nke a na-edobe ike demonstrative/qualitative nke τοιαύτην ma jiri okwu Igbo a na-ejikarị akọwa ἐλπίς.
- source_word: πολλῇ παρρησίᾳ
  choice: nnukwu nkwuwa okwu
  rationale: “Nkwuwa okwu” nwere ike ịpụta obi ike na ikwu okwu n’ezoghị ọnụ, ya mere ọ na-edobe obosara ihe παρρησία nwere ike ịpụta n’ebe a.
- source_word: χρώμεθα
  choice: anyị na-eji ... eme ihe
  rationale: 'Nke a na-egosipụta kpọmkwem echiche nke χράομαι na dative: iji ihe eme ihe, na-etinyeghị ihe ọzọ dị ka ‘okwu’ nke Greek ekwughị.'
theological_decisions:
- issue: Ma παρρησία na-elekwasị anya n’obi ike, n’ime ihe n’ezoghị ọnụ, ka ọ bụ n’ikwu okwu hoo haa
  choice: nnukwu nkwuwa okwu
  alternative: anyị ji nnukwu obi ike eme ihe; anyị na-ekwu okwu hoo haa nke ukwuu
  rationale: A họọrọ okwu nwere ike ibu echiche nke obi ike na nkwupụta a na-eme n’ezoghị ọnụ; e debere nhọrọ ndị ọzọ na nkọwa ala peeji kama idozi ambiguity ahụ n’otu ụzọ.
translation_notes:
  register: Asụsụ Igbo Izugbe nke oge a, dị ùgwù ma doo ndị nkịtị anya. Nhazi ahịrịokwu ahụ na-egosi njikọ nkwubi okwu na ihe kpatara ya, ebe nkọwa ala peeji na-echekwa obosara ihe παρρησία nwere ike ịpụta.
