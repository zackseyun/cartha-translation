base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/035.yaml
  text: And Tobiah the Ammonite was beside him[a], and he said, “Even what they are building—if a fox climbs up on it[b], he will break through their stone wall!”
translation:
  language: ta
  text: அம்மோனியனான தொபியா அவனருகில் இருந்தான். அவன், “அவர்கள் கட்டிக்கொண்டிருப்பதுகூட—அதன்மேல் ஒரு நரி ஏறினால்—அவர்களுடைய கற்சுவரை உடைத்துவிடும்!” என்றான்.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அவர்களுடைய கற்சுவரில் பிளவை ஏற்படுத்திவிடும்” என்றும் மொழிபெயர்க்கலாம். எபிரெய வினை உடைத்தல், பிளத்தல், அல்லது மதிலை உடைத்துக்கொண்டு செல்லுதல் என்ற பொருள்களைக் குறிக்கலாம்; மதில் மிகவும் பலவீனமானது என்ற தொபியாவின் ஏளனமே இங்கு வலியுறுத்தப்படுகிறது.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயச் சொல் சில சூழல்களில் நரியை ஒத்த வேறு கோரை வகை விலங்கையும் குறிக்கலாம்; ஆயினும் இங்கே ‘நரி’ என்பதே வழக்கமான மொழிபெயர்ப்பு.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶצְלוֹ
  choice: அவன் அருகில் இருந்தான்
  rationale: אצל என்னும் முன்னிடைச்சொல் அண்மையைக் குறிக்கிறது; சூழலில் தொபியா சன்பல்லாத்தின் அருகில் இருந்ததை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: גַּם אֲשֶׁר הֵם בּוֹנִים
  choice: அவர்கள் கட்டிக்கொண்டிருக்கும் இந்த மதில்...கூட
  rationale: גַּם தரும் வலியுறுத்தலையும் ஏளனத் தொனியையும் தமிழில் ‘கூட’ இயல்பாக வெளிப்படுத்துகிறது; ‘இந்த மதில்’ என்பது கட்டப்படுகிற பொருளைச் சூழலிலிருந்து வெளிப்படையாகக் கூறுகிறது.
- source_word: אִם יַעֲלֶה שׁוּעָל
  choice: ஒரு நரி ஏறினால்கூட
  rationale: אִם நிபந்தனையை அறிமுகப்படுத்துகிறது; שׁוּעָל என்பதற்கான வழக்கமான பொருள் ‘நரி’. ஏளனத்தை இயல்பாகக் காட்ட ‘ஏறினால்கூட’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: וּפָרַץ
  choice: அது ... உடைத்துவிடும்
  rationale: פרץ என்பது உடைத்தல், பிளத்தல் அல்லது தகர்த்தல் என்ற பொருளைத் தருகிறது. எபிரெய ஒருமை வினை முந்தைய ‘நரி’யை எழுவாயாகக் கொண்டிருப்பதை ‘அது’ காக்கிறது.
- source_word: חוֹמַת אַבְנֵיהֶם
  choice: அவர்களுடைய கற்சுவர்
  rationale: சொல்லுக்குச் சொல் ‘அவர்களுடைய கற்களின் சுவர்’; ‘அவர்களுடைய கற்சுவர்’ என்பது பொருளையும் கட்டுமானப் பொருளையும் காக்கும் இயல்பான நவீன தமிழ்.
