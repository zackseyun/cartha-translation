translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியும் ஆனால் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. தொபியாவின் ஏளனத் தொனி ‘ஏறினால்கூட’ மற்றும் ‘உடைத்துவிடும்’ என்பவற்றால் காக்கப்பட்டுள்ளது. அடிக்குறிப்பு குறியீடு பிரதான உரையில் சேர்க்கப்பட்டுள்ளது.
