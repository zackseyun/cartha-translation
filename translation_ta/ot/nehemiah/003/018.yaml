- from: 'அவனுக்குப் பின்பு, அவர்களுடைய சகோதரர்கள் பழுதுபார்த்தார்கள்: கேயிலா மாவட்டத்தின் பாதிக்குத் தலைவரான எனாதாதின் மகன் பவ்வாய்[a].'
  to: 'அவனுக்குப் பின்பு, அவர்களுடைய சகோதரர்கள் பழுதுபார்த்தார்கள்: கெயீலா மாவட்டத்தின் பாதிக்கு அதிகாரியாக இருந்த ஹேனாதாதின் மகன் பவ்வாய்[a].'
  rationale: The revision preserves the source syntax and its ambiguity about “their brothers,” while improving Hebrew-based name transliteration and clarifying the textual-variant note. “அதிகாரியாக இருந்த” conveys a civic administrative office without importing a specific modern or denominational interpretation.
