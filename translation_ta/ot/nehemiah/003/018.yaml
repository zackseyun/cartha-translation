translation_notes:
  register: நவீன செந்தமிழ் நடையில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான மொழி பயன்படுத்தப்பட்டுள்ளது. நிர்வாகச் சூழலில் ‘மாவட்டம்’, ‘தலைவர்’ என்பவை தெளிவுக்காகத் தேர்ந்தெடுக்கப்பட்டன; மூலத்தில் உள்ள ‘சகோதரர்கள்’ என்ற சாத்தியமான உறவுமுறைத் தெளிவின்மை பேணப்பட்டுள்ளது.
