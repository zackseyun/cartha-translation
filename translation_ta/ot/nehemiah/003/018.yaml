language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: אַחֲרָי/ו֙ הֶחֱזִ֣יקוּ אֲחֵי/הֶ֔ם בַּוַּ֖י בֶּן חֵנָדָ֑ד שַׂ֕ר חֲצִ֖י פֶּ֥לֶךְ קְעִילָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/018.yaml
  text: 'After him their brothers repaired: Bavvai son of Henadad[a], ruler of half the district of Keilah.'
translation:
  language: ta
  text: 'அவனுக்குப் பின்பு, அவர்களுடைய சகோதரர்கள் பழுதுபார்த்தார்கள்: கெயீலா மாவட்டத்தின் பாதிக்கு அதிகாரியாக இருந்த ஹேனாதாதின் மகன் பவ்வாய்[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சில மூலப்பிரதிப் பாரம்பரியங்கள் “பவ்வாய்” என்பதற்குப் பதிலாக இப்பெயரை “பின்னூய்” என்று வாசிக்கின்றன.
    reason: textual_variant
lexical_decisions:
- source_word: אַחֲרָיו
  choice: அவனுக்குப் பின்பு
  rationale: பழுதுபார்க்கப்பட்ட அடுத்த பகுதியையும் பணியாளர்களின் வரிசையையும் குறிக்கும் இட/தொடர் சுட்டியாக இயல்பாக மொழிபெயர்க்கப்பட்டது.
- source_word: הֶחֱזִיקוּ
  choice: பழுதுபார்த்தார்கள்
  rationale: வேர் சொல்லின் அடிப்படைப் பொருள் ‘பலப்படுத்துதல்’ என்றாலும், நெகேமியா 3-இன் மதில் மறுசீரமைப்புச் சூழலில் பழுதுபார்க்கும் பணியையே குறிக்கிறது.
- source_word: אֲחֵיהֶם
  choice: அவர்களுடைய சகோதரர்கள்
  rationale: உடன்பிறந்தவர்களையோ உறவினர்/சக பணியாளர்களையோ குறிக்கக்கூடிய மூலமொழியின் ‘சகோதரர்கள்’ என்ற சொல்லைத் தெளிவுபடுத்தாமல் அப்படியே பேணுகிறது.
- source_word: בַּוַּי
  choice: பவ்வாய்
  rationale: WLC-யின் உயிர்க்குறியிடப்பட்ட வடிவத்தைத் தமிழில் ஒலிபெயர்க்கிறது; வேறுபட்ட வாசகம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: בֶּן חֵנָדָד
  choice: எனாதாதின் மகன்
  rationale: எபிரெயப் பெயர்ச்சொல் மரபை இயல்பான தமிழ் உடைமைத் தொடராக வழங்குகிறது.
- source_word: שַׂר
  choice: தலைவர்
  rationale: இங்கு இராணுவத் தளபதியை அல்லாமல் நிர்வாகப் பொறுப்பாளரைச் சுட்டுவதால், இயல்பான பொதுச் சொல்லான ‘தலைவர்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: חֲצִי פֶּלֶךְ
  choice: மாவட்டத்தின் பாதி
  rationale: நிர்வாகப் பிரிவைக் குறிக்கும் சொல்லுக்கு நவீன தமிழில் தெளிவான ‘மாவட்டம்’ பயன்படுத்தப்பட்டு, அதன் பாதிப் பகுதிமீதான அதிகாரம் வெளிப்படுத்தப்பட்டது.
- source_word: קְעִילָה
  choice: கேயிலா
  rationale: இடப்பெயர் எபிரெய ஒலிப்புக்கு ஏற்ப தமிழில் ஒலிபெயர்க்கப்பட்டது.
