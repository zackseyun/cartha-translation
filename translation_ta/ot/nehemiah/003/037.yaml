source:
  edition: WLC
  text: וְ/אַל תְּכַס֙ עַל עֲוֺנָ֔/ם וְ/חַטָּאתָ֖/ם מִ/לְּ/פָנֶ֣י/ךָ אַל תִּמָּחֶ֑ה כִּ֥י הִכְעִ֖יסוּ לְ/נֶ֥גֶד הַ/בּוֹנִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/037.yaml
  text: And do not cover over their guilt[a], and do not let their sin be blotted out from before you[b], for they have provoked anger in the presence of the builders.
translation:
  language: ta
  text: அவர்களுடைய குற்றத்தை மூடிப்போடாதீர்[a]; அவர்களுடைய பாவம் உமது முன்னிலையிலிருந்து அழிக்கப்பட விடாதீர். ஏனெனில் கட்டுகிறவர்களின் முன்னிலையில் அவர்கள் கோபத்தைத் தூண்டியிருக்கிறார்கள்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்களுடைய அக்கிரமத்தை மன்னிக்காதீர்.” எபிரெயத்தில் உள்ள உருவகம், “அவர்களுடைய குற்றத்தை மூடிப்போடாதீர்” என்பதாகும்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “கட்டுகிறவர்களுக்கு முன்பாக அவர்கள் உமக்குக் கோபமூட்டியிருக்கிறார்கள்.” எபிரெயம் கோபமடைந்தவர் யார் என்பதை வெளிப்படையாகக் கூறவில்லை; அவர்களுடைய செயல் கட்டுகிறவர்களின் முன்னிலையில் கோபத்தைத் தூண்டியது என்பதே அதன் நேரடியான அமைப்பு.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּכַס ... עַל עֲוֺנָם
  choice: அவர்களுடைய குற்றத்தை மூடிப்போடாதீர்
  rationale: כסה על என்பதிலுள்ள ‘மூடுதல்’ என்ற எபிரெய உருவகத்தைத் தக்கவைத்தபடியே, குற்றத்தைப் பொருட்படுத்தாமல் விடுதல் அல்லது மன்னித்தல் என்ற சூழல்சார் பொருளையும் தமிழில் உணர்த்துகிறது.
- source_word: עֲוֺנָם
  choice: அவர்களுடைய குற்றம்
  rationale: עָוֹן என்பது அக்கிரமத்தையும் அதனால் ஏற்படும் குற்றப்பழியையும் குறிக்கலாம். இணைவரியில் வரும் ‘பாவம்’ என்பதிலிருந்து வேறுபாட்டைக் காக்க ‘குற்றம்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: חַטָּאתָם
  choice: அவர்களுடைய பாவம்
  rationale: חַטָּאת என்பதன் நேரடியான, இயல்பான பொருள் ‘பாவம்’; இணைவாக்கிய அமைப்புக்கும் இது பொருந்துகிறது.
- source_word: מִלְּפָנֶיךָ
  choice: உமது முன்னிலையிலிருந்து
  rationale: தேவனுடைய முகம் அல்லது சந்நிதிக்கு முன்பாக இருப்பது என்ற இடம்சார், உறவுசார் படிமத்தை இயல்பான தமிழில் காக்கிறது.
- source_word: תִּמָּחֶה
  choice: அழிக்கப்பட விடாதீர்
  rationale: מחה என்பது துடைத்தழித்தல் அல்லது பதிவிலிருந்து நீக்குதல் என்பதைக் குறிக்கிறது. எபிரெயச் செயப்பாட்டு வடிவையும் வேண்டுகோளின் வலிமையையும் இந்தத் தேர்வு வெளிப்படுத்துகிறது.
- source_word: הִכְעִיסוּ
  choice: கோபத்தைத் தூண்டியிருக்கிறார்கள்
  rationale: இந்த வினை கோபமூட்டுதல் அல்லது கோபத்தைத் தூண்டுதல் என்று பொருள்படும். எபிரெயத்தில் செயப்படுபொருள் வெளிப்படையாக இல்லாததால், ‘உம்மை’ என்று உரையில் சேர்க்காமல் அதன் சுருக்கத்தையும் தெளிவின்மையையும் காக்கிறது.
- source_word: לְנֶגֶד הַבּוֹנִים
  choice: கட்டுகிறவர்களின் முன்னிலையில்
  rationale: לְנֶגֶד என்பதன் முதன்மையான இடம்சார் பொருளான ‘முன்பாக, முன்னிலையில்’ என்பதைக் காக்கிறது; மதிலை மீண்டும் கட்டியவர்களின் பார்வைக்கு முன் நிகழ்ந்த பொது அவமதிப்பையும் உணர்த்துகிறது.
theological_decisions:
- issue: எதிரிகளின் பாவத்தை மன்னிக்கவோ அழிக்கவோ வேண்டாம் என்ற சாப வேண்டுதல்
  choice: குற்றத்தை மூடிப்போடாமலும் பாவத்தை அழிக்க விடாமலும் இருக்கும்படி தேவனிடம் செய்யப்படும் நேரடியான வேண்டுகோளை அதன் கடுமையுடன் தக்கவைத்தல்
  alternative: ‘அவர்களுடைய தீமையைப் பொருட்படுத்தாமல் விடாதீர்’ என்று கடுமையைக் குறைத்துக் கூறுதல்
  rationale: எபிரெய உரை வெளிப்படையான சாப வேண்டுதலைக் கொண்டுள்ளது. அதன் இறையியல் பதற்றத்தை மென்மைப்படுத்தாமல், எந்தக் கோட்பாட்டு விளக்கத்தையும் உரைக்குள் புகுத்தாமல் மொழிபெயர்க்கப்பட்டது.
- issue: הִכְעִיסוּ என்பதன் வெளிப்படையாகக் கூறப்படாத செயப்படுபொருள்
  choice: ‘கோபத்தைத் தூண்டியிருக்கிறார்கள்’ என்று செயப்படுபொருளைக் குறிப்பிடாமல் விடுதல்
  alternative: ‘உமக்குக் கோபமூட்டியிருக்கிறார்கள்’ என்று தேவனைச் செயப்படுபொருளாக வெளிப்படுத்துதல்
  rationale: சூழலில் தேவனே கோபமடைந்தவர் என்று புரிந்துகொள்ள இயன்றாலும், எபிரெயம் அதை வெளிப்படையாகக் கூறவில்லை. ஆகவே உண்மையான இலக்கணத் தெளிவின்மை பாதுகாக்கப்பட்டது.
translation_notes:
  register: நவீனத் தரத் தமிழில், தேவனை நோக்கிய மரியாதைப் பன்மை வினைமுற்றுகள் பயன்படுத்தப்பட்டுள்ளன. ‘மூடிப்போடுதல்,’ ‘முன்னிலை,’ ‘கோபத்தைத் தூண்டுதல்’ ஆகியவை எபிரெயப் படிமங்களையும் இலக்கணத் தெளிவின்மையையும் காக்கும் வகையில் தேர்ந்தெடுக்கப்பட்டன; தேவையற்ற சமயக்குழுச் சொற்கள் தவிர்க்கப்பட்டன.
