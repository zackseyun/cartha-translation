translation:
  language: ta
  text: அவருக்குப் பக்கத்தில் எரிகோவின் ஆண்கள் கட்டினார்கள்; அவருக்குப் பக்கத்தில் இம்ரியின் மகன் சக்கூர் கட்டினார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעַל יָדוֹ
  choice: அவருக்குப் பக்கத்தில்
  rationale: עַל יָד என்ற எபிரேய மரபுத்தொடர் இந்தப் பட்டியலில் கட்டுமானப் பணியின் இடத் தொடர்ச்சியைக் குறிக்கிறது; ‘அவருக்குப் பக்கத்தில்’ என்பது இயல்பான நவீனத் தமிழில் அதன் இடஞ்சார்ந்த பொருளைத் தெளிவாகத் தருகிறது.
- source_word: בָנוּ / בָנָה
  choice: கட்டினார்கள் / கட்டினார்
  rationale: בנה என்பதன் நேரடிப் பொருள் ‘கட்டு’. சுற்றுப்பின்னணி மதிலைப் புதுப்பிப்பதைப் பற்றியதாக இருந்தாலும், இவ்வசனத்தில் வினைச்சொல் தனியே ‘மீண்டும் கட்டு’ என்று வெளிப்படையாகக் கூறாததால் உரைக்குக் கட்டுப்பட்ட மொழிபெயர்ப்பு தேர்ந்தெடுக்கப்பட்டது.
- source_word: אַנְשֵׁי יְרֵחוֹ
  choice: எரிகோவின் ஆண்கள்
  rationale: אַנְשֵׁי என்பது ஆண்பால் பன்மை வடிவில் ‘ஆண்கள்’ எனப் பொருள்படும்; குழுவை எரிகோவுடன் தொடர்புபடுத்தும் மூலத்தின் வடிவம் பாதுகாக்கப்பட்டது.
- source_word: וְעַל יָדוֹ
  choice: அவர்களுக்குப் பக்கத்தில்
  rationale: மூல எபிரேயத்தில் ஒருமைச் சுட்டுப்பெயர் (‘அவருக்குப் பக்கத்தில்’) உள்ளது. ஆனால் உடனடியாக முன்வரும் பன்மைக் குழுவான எரிகோவின் ஆண்களோடு இடத் தொடர்ச்சியை இயல்பான தமிழில் தெளிவாக்க ‘அவர்களுக்குப் பக்கத்தில்’ என வழங்கப்பட்டு, மூல வடிவம் அடிக்குறிப்பில் குறிப்பிடப்பட்டது.
- source_word: זַכּוּר בֶּן אִמְרִי
  choice: இம்ரியின் மகன் சக்கூர்
  rationale: எபிரேயப் பெயர்கள் தமிழில் ஒலிபெயர்க்கப்பட்டன; בֶּן என்ற தந்தைவழி உறவு இயல்பான தமிழ் சொல் வரிசையில் ‘இம்ரியின் மகன்’ எனத் தரப்பட்டது.
