translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையும் கண்ணியமும் கொண்ட வரலாற்றுப் பட்டியல் நடை பயன்படுத்தப்பட்டது. எபிரேயத்தின் கட்டுமானத் தொடர்ச்சி பாதுகாக்கப்பட்டு, இரண்டாம் ஒருமைச் சுட்டின் உண்மையான வடிவம் அடிக்குறிப்பில் பதிவு செய்யப்பட்டது.
