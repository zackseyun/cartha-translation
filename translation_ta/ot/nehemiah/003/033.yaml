source:
  edition: WLC
  text: וַ/יְהִ֞י כַּ/אֲשֶׁ֧ר שָׁמַ֣ע סַנְבַלַּ֗ט כִּֽי אֲנַ֤חְנוּ בוֹנִים֙ אֶת הַ֣/חוֹמָ֔ה וַ/יִּ֣חַר ל֔/וֹ וַ/יִּכְעַ֖ס הַרְבֵּ֑ה וַ/יַּלְעֵ֖ג עַל הַ/יְּהוּדִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/033.yaml
  text: When Sanballat heard that we were rebuilding the wall[a], he became angry and very enraged, and he mocked the Jews.
translation:
  language: ta
  text: நாங்கள் மதிலை மீண்டும் கட்டிக்கொண்டிருக்கிறோம் என்று சன்பல்லாத் கேள்விப்பட்டபோது, அவன் கோபமடைந்து, மிகவும் சினங்கொண்டு, யூதர்களை[a] ஏளனம் செய்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யூதேயர்களை.” எபிரெயச் சொல் பிராந்திய அடிப்படையில் யூதா நாட்டினரையும், பரந்த பொருளில் யூதர்களையும் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר
  choice: …கேள்விப்பட்டபோது
  rationale: இந்தக் கதைத் தொடர் சூத்திரத்தைத் தமிழில் இயல்பான காலத் துணைவாக்கியமாக அளிக்கிறது; மூலத்தில் இல்லாத ‘இப்போது’ போன்ற சொல்லைச் சேர்க்கவில்லை.
- source_word: שָׁמַע
  choice: கேள்விப்பட்ட
  rationale: இங்கு செய்தி அறிந்ததைக் குறிக்கும் ‘கேட்டான்’ என்ற அடிப்படைப் பொருளை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: סַנְבַלַּט
  choice: சன்பல்லாத்
  rationale: எபிரெய தனிப்பெயரின் ஒலியைத் தமிழில் வழக்கமான வடிவில் எழுத்துப்பெயர்க்கிறது.
- source_word: כִּי אֲנַחְנוּ בוֹנִים
  choice: நாங்கள் … மீண்டும் கட்டிக்கொண்டிருக்கிறோம் என்று
  rationale: எபிரெயப் பங்கேற்புவினை நடந்துகொண்டிருக்கும் செயலைக் குறிக்கிறது; சேதமடைந்த எருசலேம் மதிலைப் பழைய நிலைக்குக் கொண்டுவரும் சூழலால் ‘மீண்டும் கட்டுதல்’ பொருத்தமானது.
- source_word: הַחוֹמָה
  choice: மதிலை
  rationale: חוֹמָה என்பது பாதுகாப்பு மதிலைக் குறிக்கிறது; இச்சூழலில் எருசலேமின் மதில் தெளிவாகக் குறிக்கப்படுவதால் ‘மதில்’ துல்லியமானதும் சுருக்கமானதும் ஆகும்.
- source_word: וַיִּחַר לוֹ
  choice: அவன் கோபமடைந்து
  rationale: சொல்லுக்குச் சொல் ‘அவனுக்கு எரிந்தது’ எனும் எபிரெயக் கோப மரபுத்தொடரின் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: וַיִּכְעַס הַרְבֵּה
  choice: மிகவும் சினங்கொண்டு
  rationale: முதல் கோபச் சொல்லை அப்படியே திரும்பச் சொல்லாமல், இரண்டாவது வினைச்சொல்லின் தீவிரத்தையும் הַרְבֵּה என்பதன் ‘மிகவும்’ என்ற வலியுறுத்தலையும் காக்கிறது.
- source_word: וַיַּלְעֵג
  choice: ஏளனம் செய்தான்
  rationale: இகழ்ச்சியுடன் பரிகசித்தல் அல்லது கேலி செய்தல் என்ற வினையின் பொருளை கண்ணியமான, தற்போதைய தமிழில் தெரிவிக்கிறது.
- source_word: עַל הַיְּהוּדִים
  choice: யூதர்களை
  rationale: יְהוּדִים என்பதற்கான பரவலாக அறியப்படும் தமிழ்ச் சொல் இது; அதன் பிராந்தியப் பொருளான ‘யூதேயர்கள்’ அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
