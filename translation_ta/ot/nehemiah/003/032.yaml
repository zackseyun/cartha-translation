  text: וּ/בֵ֨ין עֲלִיַּ֤ת הַ/פִּנָּה֙ לְ/שַׁ֣עַר הַ/צֹּ֔אן הֶחֱזִ֥יקוּ הַ/צֹּרְפִ֖ים וְ/הָ/רֹכְלִֽים׃פ
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/032.yaml
  text: And between the upper room of the corner and the Sheep Gate[a], the goldsmiths and the merchants made repairs.
translation:
  language: ta
  text: மூலையின் மேலறைக்கும்[a] செம்மறியாட்டு வாசலுக்கும் இடைப்பட்ட பகுதியைப் பொற்கொல்லர்களும் வணிகர்களும் பழுதுபார்த்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘மூலையின் ஏற்றம்’ அல்லது ‘மூலையின் மேல்மாட அறை’ என்றும் மொழிபெயர்க்கலாம். עֲלִיָּה என்ற எபிரெயச் சொல் மேலறை அல்லது ஏற்றத்தைக் குறிக்கலாம்; இங்கு குறிப்பிடப்படும் கட்டட அமைப்பு எது என்பது உறுதியாகத் தெரியவில்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבֵין
  choice: இடைப்பட்ட பகுதியை
  rationale: இணைப்புச் சொல்லுடன் வரும் இடவுறவை இயல்பான தமிழில் வெளிப்படுத்துகிறது; இது மதில் பழுதுபார்ப்பின் இறுதிப் பகுதியைச் சுட்டுகிறது.
- source_word: עֲלִיַּת
  choice: மேலறை
  rationale: இந்தச் சொல் மேலறை, மேல் அறை அமைப்பு, அல்லது ஏற்றம் எனப் பொருள்படலாம். முதன்மை உரையில் கட்டட அம்சத்தைக் குறிக்கும் இயல்பான ‘மேலறை’ தேர்ந்தெடுக்கப்பட்டு, உறுதியின்மை அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: הַפִּנָּה
  choice: மூலை
  rationale: எபிரெயச் சொல் நேரடியாக ‘மூலை’ என்பதைக் குறிக்கிறது; குறிப்பிட்ட மதில் அமைப்பாக இருந்திருக்கலாம் என்றாலும், உரை கூறுவதைவிட அதிகமாக வரையறுக்கவில்லை.
- source_word: לְשַׁעַר הַצֹּאן
  choice: செம்மறியாட்டு வாசல்
  rationale: எருசலேம் மதிலிலுள்ள வாசலின் பெயரைத் தெளிவாகவும் இயல்பாகவும் தருகிறது; ‘צֹאן’ என்பதன் மந்தை சார்ந்த பொருள் இச்சூழலில் செம்மறியாட்டைக் குறிக்கும் வழக்கமான வாசற்பெயராக மொழிபெயர்க்கப்படுகிறது.
- source_word: הֶחֱזִיקוּ
  choice: பழுதுபார்த்தார்கள்
  rationale: நெகேமியா 3 முழுவதும் இந்த வினை மதிலின் பகுதிகளைச் சீரமைக்கும் பணியைக் குறிக்கிறது; சொற்பொருளான ‘பலப்படுத்தினார்கள்’ என்பதைவிட சூழலுக்குப் பொருத்தமானது.
- source_word: הַצֹּרְפִים
  choice: பொற்கொல்லர்கள்
  rationale: விலைமதிப்புள்ள உலோகங்களைப் புடமிட்டு வேலைசெய்பவர்களைக் குறிக்கும் தொழிற்பெயர்; இச்சூழலில் வழக்கமான ‘பொற்கொல்லர்கள்’ பொருத்தமானது.
- source_word: וְהָרֹכְלִים
  choice: வணிகர்கள்
  rationale: விற்பனையாளர்கள் அல்லது வியாபாரிகளைக் குறிக்கும் பரந்த தொழிற்பெயரை நவீனத் தமிழில் இயல்பாக வழங்குகிறது.
