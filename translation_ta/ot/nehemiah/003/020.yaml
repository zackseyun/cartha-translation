revisions:
- from: அவருக்குப் பின்பு[a], சப்பாயின் மகன் பாரூக் மிகுந்த ஆர்வத்துடன் மற்றொரு பகுதியைப் பழுதுபார்த்தான்[b]. அது மதிலின் மூலையிலிருந்து தலைமைக் குருவான எலியாசிபின் வீட்டுவாசல்வரை இருந்தது.
  to: அவருக்குப் பின்பு[a], சப்பாயின் மகன் பாரூக் மிகுந்த ஆர்வத்துடன் இரண்டாவது பகுதியைப் பழுதுபார்த்தான்[b]—மதிலின் மூலையிலிருந்து பிரதான ஆசாரியரான எலியாசிபின் வீட்டின் வாசல்வரை.
  rationale: ‘இரண்டாவது’ மூலம் שֵׁנִית-ன் குறிப்பைத் தக்கவைத்துள்ளோம். எல்லைக் குறிப்பை பழுதுபார்த்த செயலில் நேரடியாக இணைத்துள்ளோம். ‘பிரதான ஆசாரியர்’ என்பது high priest என்ற பதவிப்பெயரின் துல்லியத்தைப் பேணுகிறது. அடிக்குறிப்பு குறியீடுகள் உரையில் தகுந்த இடங்களில் உள்ளன; அவற்றின் உள்ளடக்கம் மூலத்தின் மாற்று வாசிப்பு மற்றும் அசாதாரண தீவிரப்படுத்தும் சொற்றொடர் பற்றிய நிச்சயமின்மையைப் பாதுகாக்கிறது.
