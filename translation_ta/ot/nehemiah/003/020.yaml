  text: אַחֲרָ֨י/ו הֶחֱרָ֧ה הֶחֱזִ֛יק בָּר֥וּךְ בֶּן זבי מִדָּ֣ה שֵׁנִ֑ית מִן הַ֨/מִּקְצ֔וֹעַ עַד פֶּ֨תַח֙ בֵּ֣ית אֶלְיָשִׁ֔יב הַ/כֹּהֵ֖ן הַ/גָּדֽוֹל־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/020.yaml
  text: After him[a], Baruch son of Zabbai zealously repaired a second section[b], from the angle to the entrance of the house of Eliashib the high priest.
translation:
  language: ta
  text: அவருக்குப் பின்பு[a], சப்பாயின் மகன் பாரூக் மிகுந்த ஆர்வத்துடன் இரண்டாவது பகுதியைப் பழுதுபார்த்தான்[b]—மதிலின் மூலையிலிருந்து பிரதான ஆசாரியரான எலியாசிபின் வீட்டின் வாசல்வரை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சில பழைய மொழிபெயர்ப்பு மரபுகள் இங்குள்ள தந்தையின் பெயரை ‘சக்காய்’ எனக் காட்டுகின்றன.
    reason: alternative_reading
  - marker: b
    text: ‘மிகுந்த ஆர்வத்துடன் பழுதுபார்த்தான்’ என்பதற்குப் பின்னுள்ள எபிரெயச் சொற்றொடர் வழக்கத்திற்கு மாறானது; பாரூக் மிகுந்த ஊக்கத்துடனோ தனிச்சிறப்பான முனைப்புடனோ வேலை செய்ததை அது வலியுறுத்தலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחֲרָיו
  choice: அவருக்குப் பின்பு
  rationale: முந்தைய பணியாளரைத் தொடர்ந்து வரும் வரிசையையும், அவர் பழுதுபார்த்த பகுதிக்கு அடுத்துள்ள இடத்தையும் இச்சொற்றொடர் குறிக்கிறது.
- source_word: הֶחֱרָה הֶחֱזִיק
  choice: மிகுந்த ஆர்வத்துடன் ... பழுதுபார்த்தான்
  rationale: הֶחֱזִיק என்பது இவ்வதிகாரத்தில் மதிலைப் பழுதுபார்த்து உறுதிப்படுத்துவதைக் குறிக்கிறது; வழக்கத்திற்கு மாறான הֶחֱרָה, பாரூக்கின் தீவிர ஆர்வத்தையோ சிறப்பான முனைப்பையோ வலியுறுத்துகிறது.
- source_word: בָּרוּךְ בֶּן זבי
  choice: சப்பாயின் மகன் பாரூக்
  rationale: மசோரா மெய்யெழுத்து வாசகமான זבי அடிப்படையில் பெயர்கள் தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளன.
- source_word: מִדָּה שֵׁנִית
  choice: மற்றொரு பகுதி
  rationale: இது அளவைக் குறிக்கும் நேரடிப் பயன்பாடு அல்ல; பாரூக்குக்குக் கொடுக்கப்பட்ட கூடுதலான மதிற்பகுதியைக் குறிக்கிறது. தமிழில் ‘மற்றொரு பகுதி’ இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: מִן הַמִּקְצוֹעַ
  choice: மதிலின் மூலையிலிருந்து
  rationale: מִקְצוֹעַ என்பது மதிலின் மூலை அல்லது திருப்பத்தைக் குறிக்கிறது; சூழலைத் தெளிவாக்க ‘மதிலின்’ என்பது சேர்க்கப்பட்டுள்ளது.
- source_word: עַד פֶּתַח בֵּית
  choice: வீட்டுவாசல்வரை
  rationale: פֶּתַח என்பது நுழைவிடம் அல்லது வாசல்; இங்கு எலியாசிபின் வீடு அல்லது வளாகத்தின் உடல்சார்ந்த நுழைவிடமே குறிக்கப்படுகிறது.
- source_word: אֶלְיָשִׁיב הַכֹּהֵן הַגָּדוֹל
  choice: தலைமைக் குருவான எலியாசிப்
  rationale: הַכֹּהֵן הַגָּדוֹל என்பது இஸ்ரவேலின் பிரதான ஆசாரியப் பதவியைக் குறிக்கிறது; நவீன பொதுத்தமிழில் ‘தலைமைக் குரு’ தெளிவான பதவிப்பெயர்.
