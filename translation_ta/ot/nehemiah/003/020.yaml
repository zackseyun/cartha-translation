translation_notes:
  register: நவீன நிலையான தமிழில், பட்டியலின் சுருக்கமான வரலாற்று நடையைப் பேணும் வகையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘பழுதுபார்த்தான்’ என்பது மதிலைச் செப்பனிட்டு உறுதிப்படுத்தும் செயலை இயல்பாக எடுத்துரைக்கிறது; எபிரெயத்தின் அசாதாரண தீவிரப்படுத்தும் அமைப்பு அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
