base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/008.yaml
  text: Next to him Uzziel son of Harhaiah[a], one of the goldsmiths, made repairs; and next to him Hananiah, one of the perfumers, made repairs. And they restored Jerusalem as far as the Broad Wall.
translation:
  language: ta
  text: அவனுக்கு அடுத்ததாக, பொற்கொல்லர்களில் ஒருவனான ஹர்ஹயாவின் மகன் உசியேல் பழுதுபார்த்தான். அவனுக்கு அடுத்ததாக, நறுமணப் பொருள் தயாரிப்போர் குடும்பத்தைச் சேர்ந்த அனனியா பழுதுபார்த்தான். அவர்கள் எருசலேமை அகல மதில்வரை புதுப்பித்தார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அகல மதில்வரை எருசலேமை விட்டுவிட்டார்கள்.” எபிரெய வினைச்சொல் பொதுவாக “விட்டுவிட்டார்கள்” என்று பொருள்படும்; ஆனால் இந்த மறுகட்டுமானச் சூழலில் அது “புதுப்பித்தார்கள்” அல்லது “பழுதுபார்த்தார்கள்” என்ற பொருளில் பலரால் புரிந்துகொள்ளப்படுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל יָדוֹ
  choice: அவனுக்கு அடுத்ததாக
  rationale: இந்த அதிகாரத்தின் கட்டுமானப் பட்டியலில் இச்சொற்றொடர் அடுத்தடுத்த பகுதிகளில் வேலை செய்தவர்களின் இட அண்மையைக் குறிக்கிறது; நவீன தமிழில் இயல்பாகத் தெரிவிக்கப்படுகிறது.
- source_word: הֶחֱזִיק
  choice: பழுதுபார்த்தான்
  rationale: அடிப்படைப் பொருள் ‘வலுப்படுத்தினான்’ என்றாலும், நெகேமியா 3-இன் மதில் சீரமைப்புச் சூழலில் பழுதுபார்க்கும் பணியில் ஈடுபட்டதைக் குறிக்கிறது.
- source_word: צֹרְפִים
  choice: பொற்கொல்லர்களில் ஒருவன்
  rationale: இங்கு பன்மை வடிவம் உசியேல் சேர்ந்திருந்த தொழிற்குழுவைக் குறிக்கிறது; ‘பொற்கொல்லர்’ என்பது தெளிவான நவீனத் தமிழ் தொழிற்பெயர்.
- source_word: הָרַקָּחִים
  choice: நறுமணத் தைலம் தயாரிப்பவர்களில் ஒருவன்
  rationale: நறுமணப் பொருட்களையும் தைலங்களையும் கலந்துத் தயாரிக்கும் தொழிலைத் தெளிவாகக் காட்டுகிறது; பழமையான அல்லது தவறாகப் புரிந்துகொள்ளக்கூடிய தொழிற்பெயரைத் தவிர்க்கிறது.
- source_word: וַיַּעַזְבוּ
  choice: புதுப்பித்தார்கள்
  rationale: வினைச்சொல்லின் வழக்கமான பொருள் ‘விட்டார்கள்’ என்பதாக இருந்தாலும், இங்குள்ள மறுகட்டுமானச் சூழலில் எருசலேமின் அரணமைப்பைச் சீரமைத்தார்கள் என்ற பொருள் சாத்தியமானது. மூலத்தின் உண்மையான ஐயப்பாட்டை அடிக்குறிப்பு பாதுகாக்கிறது.
- source_word: יְרוּשָׁלַםִ
  choice: எருசலேமை
  rationale: மூலத்தில் நகரத்தின் பெயரே நேரடியாக வருகிறது; ‘எருசலேமின் மதிலை’ என்று விளக்கச் சொல் சேர்க்காமல், நகரம் அதன் அரணமைப்பைக் குறிக்கும் ஆகுபெயராக இருப்பதைப் பாதுகாக்கிறது.
- source_word: עַד הַחוֹמָה הָרְחָבָה
  choice: அகலமான மதில்வரை
  rationale: எருசலேமின் அறியப்பட்ட மதில் பகுதிக்கான விளக்கப் பெயரை நேரடியாகவும் இயல்பாகவும் வழங்குகிறது.
