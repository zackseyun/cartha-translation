translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. தொழிற்குழுக்களைக் குறிக்கும் பன்மை வடிவங்கள் இயல்பான ஒருமைச் சேர்க்கைகளாகத் தரப்பட்டுள்ளன. கடைசி வினைச்சொல்லின் முக்கியமான பொருள் ஐயப்பாடு அடிக்குறிப்பில் வெளிப்படையாகப் பாதுகாக்கப்பட்டுள்ளது.
