  text: Next to them Jedaiah son of Harumaph made repairs opposite his house[a], and next to him Hattush son of Hashabneiah made repairs.
translation:
  language: ta
  text: அவர்களுக்கு அடுத்ததாக, ஹரூமாப்பின் மகன் யெதாயா தன் வீட்டுக்கு எதிரே பழுதுபார்த்தார்[a]. அவருக்கு அடுத்ததாக, ஹஷப்னியாவின் மகன் ஹத்தூஷ் பழுதுபார்த்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தன் வீட்டுக்கு முன்பாக.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל יָדָם
  choice: அவர்களுக்கு அடுத்ததாக
  rationale: நெகேமியா 3-இன் பணிப்பட்டியலில் עַל יָד என்பது அருகாமையையும் பணியின் தொடர்ச்சியையும் குறிக்கும் மரபுத்தொடர்; இயல்பான தமிழில் இதை இவ்வாறு தருவது பொருத்தமானது.
- source_word: הֶחֱזִיק
  choice: பழுதுபார்த்தார்
  rationale: இந்த அதிகாரத்தின் சுவர் சீரமைப்புச் சூழலில் חזק என்பதன் ஹிப்ஈல் வடிவம் கட்டுமானம் அல்லது பழுதுபார்க்கும் பணியில் ஈடுபட்டதைக் குறிக்கிறது.
- source_word: יְדָיָה
  choice: யெதாயா
  rationale: எபிரெயத் தனிப்பெயரின் ஒலியைத் தமிழில் நெருக்கமாக எழுத்துப்பெயர்த்தல்.
- source_word: בֶן חֲרוּמַף
  choice: அரூமாப்பின் மகன்
  rationale: எபிரெய மரபுவழிக் கட்டமைப்பை இயல்பான தமிழ் உடைமைத் தொடரால் வழங்குகிறது; חֲרוּמַף என்பது அரூமாப் என எழுத்துப்பெயர்க்கப்பட்டது.
- source_word: וְנֶגֶד בֵּיתוֹ
  choice: தன் வீட்டுக்கு எதிரே
  rationale: נֶגֶד என்பது ‘எதிரே’ அல்லது ‘முன்பாக’ என்ற இடவுறவைக் குறிக்கிறது. வினையின் எழுவாய் யெதாயா என்பதால், தமிழில் ‘தன் வீடு’ என்பது குறிப்பைத் தெளிவாகவும் இயல்பாகவும் காட்டுகிறது.
- source_word: וְעַל יָדוֹ
  choice: அவருக்கு அடுத்ததாக
  rationale: முந்தைய עַל יָד மரபுத்தொடரைப் போலவே, யெதாயாவை அடுத்து பணியாற்றியவரைக் குறிக்கும் தொடர்ச்சியான இடவுறவைப் பாதுகாக்கிறது.
- source_word: חַטּוּשׁ
  choice: அத்தூஷ்
  rationale: எபிரெயத் தனிப்பெயரின் ஒலியைத் தமிழில் நெருக்கமாக எழுத்துப்பெயர்த்தல்.
- source_word: בֶן חֲשַׁבְנְיָה
  choice: அசப்னியாவின் மகன்
  rationale: எபிரெய மரபுவழிக் கட்டமைப்பை இயல்பான தமிழில் வழங்குகிறது; חֲשַׁבְנְיָה என்பது அசப்னியா என எழுத்துப்பெயர்க்கப்பட்டது.
