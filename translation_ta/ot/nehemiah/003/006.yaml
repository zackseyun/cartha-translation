  text: וְ/אֵת֩ שַׁ֨עַר הַיְשָׁנָ֜ה הֶחֱזִ֗יקוּ יֽוֹיָדָע֙ בֶּן פָּסֵ֔חַ וּ/מְשֻׁלָּ֖ם בֶּן בְּסֽוֹדְיָ֑ה הֵ֣מָּה קֵר֔וּ/הוּ וַֽ/יַּעֲמִ֨ידוּ֙ דַּלְתֹתָ֔י/ו וּ/מַנְעֻלָ֖י/ו וּ/בְרִיחָֽי/ו־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/006.yaml
  text: And Joiada son of Paseah and Meshullam son of Besodeiah repaired the Old Gate. They laid its beams and set up its doors[a], its bolts, and its bars.
translation:
  language: ta
  text: பாசேயாவின் மகன் யோயாதாவும் பெசோதெயாவின் மகன் மெசுல்லாமும் பழைய வாசலை[a] பழுதுபார்த்தார்கள். அவர்கள் அதன் உத்திரங்களை அமைத்து, அதன் கதவுகளையும் தாழ்ப்பாள்களையும் குறுக்குத் தண்டுகளையும் பொருத்தினார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யெஷானா வாசல்.” இங்கு இரண்டாவது சொல்லை ‘பழைய’ என்னும் பெயரடையாக அல்லாமல் ஓர் இடப்பெயராகவும் எடுத்துக்கொள்ளலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: הֶחֱזִיקוּ
  choice: பழுதுபார்த்தார்கள்
  rationale: நெகேமியா 3-இன் கட்டுமான அறிக்கைகளில் இவ்வினைச்சொல் சேதமடைந்த பகுதியைச் சீரமைப்பதைக் குறிக்கிறது; நவீனத் தமிழில் இயல்பான கட்டுமானச் சொல் இது.
- source_word: שַׁעַר הַיְשָׁנָה
  choice: பழைய வாசல்
  rationale: இத்தொடர் இயல்பாக ‘பழைய வாசல்’ என்னும் வாசலின் பெயராகப் புரிகிறது; இரண்டாம் சொல்லை இடப்பெயராகக் கொள்ளும் வாய்ப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: קֵרוּהוּ
  choice: அதற்கு உத்திரங்களை அமைத்து
  rationale: קרה என்பது உத்திரங்கள் அல்லது விட்டங்களால் மூடுவதைக் குறிக்கிறது. நகர வாசலின் மேல்கட்டமைப்பில் அவற்றை அமைத்த செயலை இச்சொற்றொடர் தெளிவாகக் காட்டுகிறது.
- source_word: וַיַּעֲמִידוּ
  choice: பொருத்தினார்கள்
  rationale: கதவின் கூறுகளை அவற்றுக்குரிய இடத்தில் நிலைநிறுத்திய செயலை நவீனத் தமிழில் இயல்பாகத் தெரிவிக்கிறது.
- source_word: דַּלְתֹתָיו
  choice: அதன் கதவுகள்
  rationale: எபிரெயப் பன்மை, வாசலிலுள்ள இரு கதவுத் தகடுகளைக் குறிக்கக்கூடும்; தமிழிலும் பன்மை தக்கவைக்கப்படுகிறது.
- source_word: מַנְעֻלָיו
  choice: தாழ்ப்பாள்கள்
  rationale: வாசலைப் பூட்டி உறுதிப்படுத்தும் fastening mechanism-ஐக் குறிக்கும் தெளிவான, காலத்திற்கேற்ற தமிழ்ச் சொல்.
- source_word: בְרִיחָיו
  choice: குறுக்குத் தண்டுகள்
  rationale: கதவுகளை உறுதியாக மூடுவதற்குக் குறுக்கே இடப்படும் bars-ஐக் குறிக்கிறது; முந்தைய தாழ்ப்பாள்களிலிருந்து வேறுபாடு தெளிவாகிறது.
- source_word: הֵמָּה
  choice: அவர்கள்
  rationale: பெயரிடப்பட்ட இருவரே தொடர்ந்து கூறப்படும் பணிகளைச் செய்தார்கள் என்பதைக் காட்டும் இயல்பான தமிழ்ப் பதிலீடு.
- source_word: יוֹיָדָע ... וּמְשֻׁלָּם
  choice: யோயாதா ... மெசோதுல்லாம்
  rationale: ஆள்பெயர்கள் எபிரெய உச்சரிப்பை அணுகும் வகையில் தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளன.
- source_word: פָּסֵחַ / בְּסוֹדְיָה
  choice: பாசேயா / பெசோதியா
  rationale: தந்தையரின் ஆள்பெயர்கள் மொழிபெயர்க்கப்படாமல் தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளன.
