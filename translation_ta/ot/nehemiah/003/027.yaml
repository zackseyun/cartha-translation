base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/027.yaml
  text: After him the Tekoites repaired another section[a], opposite the great projecting tower, as far as the wall of Ophel.
translation:
  language: ta
  text: அவனுக்குப் பிறகு, தெக்கோவாவைச் சேர்ந்தவர்கள் வெளியே நீண்டிருந்த பெரிய கோபுரத்துக்கு எதிரே ஓபேலின் மதில்வரை மற்றொரு பகுதியைப் பழுதுபார்த்தார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இரண்டாவது பகுதியைப்.” அவர்கள் முன்பு செய்த பணிப்பகுதிக்கு மேலாக மேலும் ஒரு பகுதியைப் பழுதுபார்த்தார்கள் என்பதை எபிரேயச் சொற்றொடர் வலியுறுத்தலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחֲרָיו
  choice: அவனுக்குப் பிறகு
  rationale: நெகேமியா 3-இன் பணிப்பட்டியலில் அடுத்ததாகப் பணியாற்றியவர்களைச் சுட்டும் தொடர்; முந்தைய வசனத்தில் குறிப்பிடப்பட்டவரை 3ஆம் நபர் ஆண்பால் ஒருமை பின்னொட்டு குறிக்கிறது.
- source_word: הֶחֱזִיקוּ
  choice: பழுதுபார்த்தார்கள்
  rationale: அடிப்படையில் ‘வலுப்படுத்தினார்கள்’ என்றாலும், இவ்வதிகாரத்தின் மதில் மறுகட்டும் சூழலில் பழுதுபார்த்தல்/சீரமைத்தல் என்ற தொழில்நுட்பப் பொருளில் வருகிறது.
- source_word: הַתְּקֹעִים
  choice: தெக்கோவாவைச் சேர்ந்தவர்கள்
  rationale: தெக்கோவா ஊரின் குடிமக்களைக் குறிக்கும் இன/இடப்பெயர் வடிவம்; தமிழில் இயல்பாக ஊர்சார்பை வெளிப்படுத்துகிறது.
- source_word: מִדָּה שֵׁנִית
  choice: இன்னொரு பகுதி
  rationale: அவர்கள் முன்பு செய்த பகுதிக்கு மேலாகக் கூடுதலான ஒரு பணிப்பகுதியைக் குறிக்கிறது; ‘இரண்டாவது பகுதி’ என்பதும் சாத்தியம் என்பதால் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: מִנֶּגֶד
  choice: எதிரே தொடங்கி
  rationale: குறிப்பிடப்பட்ட அடையாளத்தை எதிர்கொண்ட இடத்தைத் தொடக்க எல்லையாக இயல்பான தமிழில் காட்டுகிறது; எபிரெயச் சொல் ‘எதிரே/முன்பாக’ என்ற இடப்பொருளைக் கொண்டது.
- source_word: הַמִּגְדָּל הַגָּדוֹל הַיּוֹצֵא
  choice: வெளியே நீண்டிருந்த பெரிய கோபுரம்
  rationale: יָצָא வினையின் பெயரெச்சம் கட்டடச் சூழலில் மதில் வரியிலிருந்து வெளியே நீண்ட அல்லது புடைத்த அமைப்பைக் குறிக்கிறது.
- source_word: וְעַד חוֹמַת הָעֹפֶל
  choice: ஓபேலின் மதில்வரை
  rationale: பழுதுபார்க்கப்பட்ட பகுதியின் இறுதி எல்லையைச் சுட்டுகிறது; ஓபேல் இடப்பெயராக ஒலிபெயர்க்கப்படுகிறது.
