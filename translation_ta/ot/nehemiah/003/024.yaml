base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/024.yaml
  text: After him[a], Binnui son of Henadad repaired another section[b], from the house of Azariah as far as the angle and as far as the corner.
translation:
  language: ta
  text: 'அவருக்குப் பிறகு, ஹெனாதாதின் மகன் பின்னூயி, அசரியாவின் வீட்டிலிருந்து சுவரின் திருப்புமுனை வரையிலும் மூலை வரையிலும்[b] இன்னொரு பகுதியை[a] பழுதுபார்த்தார்.


    [a] “இரண்டாவது பகுதியை” என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொற்றொடர், பின்னூயி பழுதுபார்த்த கூடுதல் பகுதியையோ அளவிடப்பட்ட இரண்டாவது பகுதியையோ குறிக்கலாம்.


    [b] “சுவரின் திருப்புமுனை” என்றும் “மூலை” என்றும் மொழிபெயர்க்கப்பட்டுள்ள எபிரெயச் சொற்கள் தொடர்புடையவை; ஆனாலும் அவை ஒரே சொற்கள் அல்ல. அருகருகே இருந்த இரு வேறுபட்ட கட்டடக்கூறுகளை இவை குறிக்கக்கூடும்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “இரண்டாவது பகுதியை” என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொற்றொடர், பின்னூயி பழுதுபார்த்த கூடுதல் பகுதியையோ அளவிடப்பட்ட இரண்டாவது பகுதியையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “சுவரின் திருப்புமுனை” என்றும் “மூலை” என்றும் மொழிபெயர்க்கப்பட்டுள்ள எபிரெயச் சொற்கள் தொடர்புடையவை; ஆனாலும் அவை ஒரே சொற்கள் அல்ல. அருகருகே இருந்த இரு வேறுபட்ட கட்டடக்கூறுகளை இவை குறிக்கக்கூடும்.
    reason: cultural_note
lexical_decisions:
- source_word: אַחֲרָיו
  choice: அவருக்குப் பிறகு
  rationale: பழுதுபார்க்கும் பணியாளர்களின் வரிசையை இச்சொல் சுட்டுகிறது. இடரீதியான உடனடி அண்மையை வலியுறுத்தாமல் எபிரெயச் சொல்லின் தொடர்ச்சிப் பொருளை இயல்பாகத் தருகிறது.
- source_word: הֶחֱזִיק
  choice: பழுதுபார்த்தார்
  rationale: அடிப்படையில் ‘வலுப்படுத்துதல், உறுதியாக்குதல்’ என்ற பொருள் இருந்தாலும், நெகேமியா 3-இல் சுவரைப் பழுதுபார்க்கும் பணியைக் குறிக்கும் சூழல்சார் பயன்பாடு இது.
- source_word: בִּנּוּי בֶּן־חֵנָדָד
  choice: கேனாதாதின் மகன் பின்னூயி
  rationale: தனிப்பெயர்கள் எபிரெய ஒலிப்புக்கு ஏற்றவாறு எழுத்துப்பெயர்க்கப்பட்டு, தந்தை–மகன் உறவு இயல்பான தமிழில் தரப்பட்டுள்ளது.
- source_word: מִדָּה שֵׁנִית
  choice: இன்னொரு பகுதியை
  rationale: சுவரின் கூடுதல் பணிப்பகுதியைச் சூழலுக்கு ஏற்ற இயல்பான தமிழில் குறிக்கிறது; ‘இரண்டாவது பகுதி’ என்ற சாத்தியத்தைக் குறிப்பில் பாதுகாக்கிறது.
- source_word: מִבֵּית עֲזַרְיָה
  choice: அசரியாவின் வீட்டிலிருந்து
  rationale: தொடக்க எல்லையைக் குறிக்கும் எபிரெய முன்னிடைச்சொல்லையும் உடைமைத் தொடர்பையும் தெளிவான தமிழில் தருகிறது.
- source_word: עַד הַמִּקְצוֹעַ
  choice: சுவர் திரும்பும் இடம்வரையிலும்
  rationale: சுவரின் கோணமோ திசைமாற்றமோ உள்ள கட்டட இடத்தைக் குறிக்கிறது; அடுத்துவரும் ‘மூலை’ என்ற சொல்லிலிருந்து வேறுபாட்டையும் காக்கிறது.
- source_word: וְעַד הַפִּנָּה
  choice: மூலைவரையிலும்
  rationale: פִּנָּה என்பதன் பொதுவான ‘மூலை’ என்ற பொருளைத் தருவதோடு, மீண்டும் வரும் עַד என்பதையும் ‘வரையிலும்’ என்று வெளிப்படையாகப் பாதுகாக்கிறது.
