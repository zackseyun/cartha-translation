  register: நவீனத் தரமான, கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் தமிழ் பயன்படுத்தப்பட்டுள்ளது. இடவியல் வரிசை தெளிவாக இருக்க ‘வரையிலும்’ இருமுறை தரப்பட்டுள்ளது. மூல எபிரெயத்தில் உள்ள இரண்டு வேறுபட்ட மூலைசார் கட்டடச் சொற்கள் ஒன்றாக்கப்படாமல் பாதுகாக்கப்பட்டுள்ளன.
