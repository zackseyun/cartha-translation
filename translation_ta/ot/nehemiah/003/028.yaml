translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் வடிக்கப்பட்டுள்ளது. முதல் வினைக்குப் பின் வரும் பகுதி மூலத்தில் வெளிப்படையாக மறுபடியும் சொல்லப்படாவிட்டாலும், தமிழில் பொருளைத் தெளிவாக்க ‘உள்ள பகுதியைப் பழுதுபார்த்தார்கள்’ என நிரப்பப்பட்டுள்ளது; இது ஒவ்வொருவரும் தம் வீட்டெதிரே இருந்த சுவர்ப் பகுதியைச் சீரமைத்தனர் என்ற சூழலை வெளிப்படுத்துகிறது.
