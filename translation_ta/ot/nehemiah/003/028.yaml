  text: Above the Horse Gate[a], the priests made repairs, each one opposite his own house.
translation:
  language: ta
  text: குதிரை வாசலுக்கு[a] மேலே ஆசாரியர்கள் ஒவ்வொருவரும் தங்கள் தங்கள் வீட்டுக்கு எதிரே பழுதுபார்த்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘குதிரைகளின் வாசல்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵעַל
  choice: மேலே
  rationale: முந்தைய சுவர்ப் பகுதியுடன் ஒப்பிடுகையில் அமைவிடத்தைக் குறிக்கிறது; கட்டுமானப் பட்டியலின் தொடர்ச்சியில் ‘மேலே’ என்பது இயல்பான மொழிபெயர்ப்பு.
- source_word: שַׁעַר הַסּוּסִים
  choice: குதிரை வாசல்
  rationale: எபிரெயக் கட்டமைப்பு ‘குதிரைகளின் வாசல்’ என்றும் நேரடியாக மொழிபெயர்க்கலாம்; ஆனால் ஓர் இடப்பெயராகத் தமிழில் ‘குதிரை வாசல்’ இயல்பாக உள்ளது.
- source_word: הֶחֱזִיקוּ
  choice: பழுதுபார்த்தார்கள்
  rationale: நெகேமியா 3-ன் கட்டுமானச் சூழலில் இவ்வினை சுவர் அல்லது வாசலின் பழுதைச் சரிசெய்யும் பணியைக் குறிக்கிறது.
- source_word: הַכֹּהֲנִים
  choice: ஆசாரியர்கள்
  rationale: ஆலயப் பணியுடன் தொடர்புடைய இஸ்ரவேலின் மதப்பணியாளர்களைக் குறிக்கும் வழக்கமான, புரிந்துகொள்ளத்தக்க தமிழ் சொல்.
- source_word: אִישׁ
  choice: ஒவ்வொருவரும்
  rationale: இங்கு ஆண்பால் ஒருமைச் சொல் பகிர்ந்தளிக்கும் பொருளில் வந்து, குழுவிலுள்ள ஒவ்வொரு நபரையும் தனித்தனியாகக் குறிக்கிறது.
- source_word: לְנֶגֶד
  choice: எதிரே
  rationale: ஒரு வீட்டுக்கு நேர்முகமாக அல்லது அதற்கு எதிர்ப்புறத்தில் அமைந்த சுவர்ப் பகுதியைக் குறிக்கும் இயல்பான தமிழ் வடிவம்.
- source_word: בֵּיתוֹ
  choice: தங்கள் தங்கள் வீட்டுக்கு
  rationale: மூலத்தில் மூன்றாம் நபர் ஆண்பால் ஒருமை விகுதி இருந்தாலும், அது ‘ஒவ்வொருவரும்’ என்பதுடன் பகிர்ந்தளிக்கும் தொடர்பில் உள்ளது; தமிழில் ‘தங்கள் தங்கள்’ ஒவ்வொருவருக்கும் உரிய தனித்தனி வீட்டைத் தெளிவாகக் காட்டுகிறது.
