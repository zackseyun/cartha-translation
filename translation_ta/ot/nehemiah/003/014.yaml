  register: நவீன நிலையான தமிழில், வரலாற்றுக் கட்டுமானப் பட்டியலுக்கேற்ற சுருக்கமான, கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. பெயர்கள் எபிரெய வடிவுக்கு நெருக்கமாக எழுத்துப்பெயர்க்கப்பட்டுள்ளன; ‘அவனே’ என்பது மூலத்தின் வலியுறுத்தலைப் பாதுகாக்கிறது.
