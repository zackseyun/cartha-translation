  source_fidelity: 'மூல எபிரெயத்தின் கட்டமைப்பும் பொருளும் துல்லியமாகத் தரப்பட்டுள்ளன: மல்கியா, ரேகாபின் மகன்; பெத்-ஹக்கேரேம் மாவட்டத்தின் நிர்வாகத் தலைவர்; கழிவு/சாணம் சார்ந்த பெயருடைய வாயிலின் பழுதுபார்ப்பு; அதைக் கட்டுதல்; கதவுகள், தாழ்ப்பாள்கள், குறுக்குச் சட்டங்கள் ஆகியவற்றை நிறுவுதல். הוּא-வின் வலியுறுத்தலை ‘அவனே’ பொருத்தமாகக் காக்கிறது; בנה-வுக்கு மூலத்தில் இல்லாத ‘மறுகட்டுதல்’ பொருள் சேர்க்கப்படவில்லை.'
  naturalness: நடை நவீன நிலையான தமிழில் தெளிவாகவும் சுருக்கமாகவும் உள்ளது. ‘பழுதுபார்த்தான்,’ ‘மாவட்டத்தின் தலைவன்,’ ‘பொருத்தினான்’ ஆகியவை இச்சூழலுக்கேற்ற இயல்பான சொற்கள். நிறுத்தற்குறியாக உள்ள அரைப்புள்ளியும் புரிந்துகொள்ளத் தடையல்ல.
  terminology: ‘கழிவு வாயில்’ אַשְׁפּוֹת என்பதன் சாணம்/கழிவு என்ற பொருள் பரப்பைக் காக்கிறது; அடிக்குறிப்பு ‘எரு வாயில்’ என்ற சாத்தியமான மாற்றைச் சரியாக வழங்குகிறது. இடப்பெயரும் தனிப்பெயர்களும் எழுத்துப்பெயர்ப்பாகத் தொடர்ந்து வழங்கப்பட்டுள்ளன. ‘தாழ்ப்பாள்கள்’ மற்றும் ‘குறுக்குச் சட்டங்கள்’ முறையே மன்றூல்களையும் தாழிடும் சட்டங்களையும் போதுமான அளவு வேறுபடுத்துகின்றன.
