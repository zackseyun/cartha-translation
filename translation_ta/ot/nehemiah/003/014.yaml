source:
  edition: WLC
  text: וְ/אֵ֣ת שַׁ֣עַר הָ/אַשְׁפּ֗וֹת הֶחֱזִיק֙ מַלְכִּיָּ֣ה בֶן רֵכָ֔ב שַׂ֖ר פֶּ֣לֶךְ בֵּית הַכָּ֑רֶם ה֣וּא יִבְנֶ֔/נּוּ וְ/יַעֲמִיד֙ דַּלְתֹתָ֔י/ו מַנְעֻלָ֖י/ו וּ/בְרִיחָֽי/ו׀־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/014.yaml
  text: And Malchijah son of Rechab[a], ruler of the district of Beth-haccherem, repaired the Dung Gate. He built it and set up its doors, its bolts, and its bars.
translation:
  language: ta
  text: ரேகாபின் மகன் மல்கியா, பெத்-ஹக்கேரேம் மாவட்டத்தின் தலைவன்; அவன் கழிவு வாயிலை[a] பழுதுபார்த்தான். அவனே அதைக் கட்டி, அதன் கதவுகளையும் தாழ்ப்பாள்களையும் குறுக்குச் சட்டங்களையும் பொருத்தினான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “எரு வாயில்” என்றும் மொழிபெயர்க்கலாம். எபிரெயப் பெயர் சாணம் அல்லது பிற கழிவைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶחֱזִיק
  choice: பழுதுபார்த்தான்
  rationale: நெகேமியா 3-இன் கட்டுமானப் பட்டியலில், சுவரின் அல்லது வாயிலின் ஒரு பகுதியைப் பழுதுபார்க்கும் பொறுப்பை ஏற்று நிறைவேற்றுவதை இச்சொல் குறிக்கிறது. நவீன தமிழில் ‘பழுதுபார்த்தான்’ இயல்பாகவும் சூழலுக்கு ஏற்றவாறும் உள்ளது.
- source_word: שַׁעַר הָאַשְׁפּוֹת
  choice: கழிவு வாயில்
  rationale: אַשְׁפּוֹת என்பது சாணம், குப்பை அல்லது பிற கழிவுகளைக் குறிக்கலாம். ‘கழிவு வாயில்’ இடப்பெயராக இயல்பாக இருப்பதோடு, எபிரெயச் சொல்லின் பொருள் பரப்பையும் அளவுக்கு மீறிக் குறுக்காமல் தருகிறது; ‘எரு வாயில்’ என்ற மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: שַׂר פֶּלֶךְ
  choice: மாவட்டத்தின் தலைவன்
  rationale: שַׂר என்பது தலைவர் அல்லது அதிகாரி; פֶּלֶךְ என்பது நிர்வாக மாவட்டம். இந்த இரு கூறுகளையும் தெளிவாகவும் இயல்பாகவும் இச்சொற்றொடர் வெளிப்படுத்துகிறது.
- source_word: בֵּית הַכָּרֶם
  choice: பெத்-ஹக்கேரேம்
  rationale: இது ஓர் இடப்பெயர் என்பதால் பொருளாக்காமல், எபிரெய உச்சரிப்புக்கு நெருக்கமாக எழுத்துப்பெயர்க்கப்பட்டுள்ளது.
- source_word: הוּא יִבְנֶנּוּ
  choice: அவனே அதைக் கட்டி
  rationale: בנה என்பதன் அடிப்படைப் பொருளான ‘கட்டு’ பாதுகாக்கப்பட்டுள்ளது; ‘மறுபடியும் கட்டு’ என்ற வெளிப்படையாக இல்லாத கருத்து சேர்க்கப்படவில்லை. הוּא தரும் வலியுறுத்தலை ‘அவனே’ வெளிப்படுத்துகிறது.
- source_word: וְיַעֲמִיד
  choice: பொருத்தினான்
  rationale: இங்கு வாயிலின் கூறுகளை உரிய இடத்தில் நிறுவுவதைக் குறிக்கிறது. கட்டுமானச் சூழலில் ‘பொருத்தினான்’ தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: דַּלְתֹתָיו
  choice: அதன் கதவுகள்
  rationale: வாயிலில் அமைந்த கதவுப் பலகைகளைக் குறிக்கும் பன்மை, தமிழில் நேரடியாக ‘கதவுகள்’ என வழங்கப்பட்டுள்ளது.
- source_word: מַנְעֻלָיו
  choice: அதன் தாழ்ப்பாள்கள்
  rationale: வாயிலைப் பூட்ட அல்லது இறுக அடைக்கப் பயன்படும் சாதனங்களை இச்சொல் குறிக்கிறது. ‘தாழ்ப்பாள்கள்’ நவீன தமிழில் தெளிவான கட்டுமானச் சொல்.
- source_word: וּבְרִיחָיו
  choice: அதன் குறுக்குச் சட்டங்கள்
  rationale: கதவுகளைப் பாதுகாப்பாக அடைப்பதற்குக் குறுக்காக இடப்படும் வலுவான சட்டங்களை בְּרִיחַ குறிக்கிறது. ‘குறுக்குச் சட்டங்கள்’ இதனைத் தாழ்ப்பாள்களிலிருந்து தெளிவாக வேறுபடுத்துகிறது.
