translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான வரலாற்று நடையைக் கடைப்பிடிக்கிறது. கட்டுமானப் பட்டியலின் தொடர்ச்சி பேணப்பட்டுள்ளது; எபிரேய வலியுறுத்தல் ‘அவர்களே’ என வெளிப்படுத்தப்பட்டுள்ளது. ஆங்கில ஆலோசனை உரையில் அடிக்குறிப்பு குறியீடுகள் உள்ளடக்கத்துடன் பொருந்தாத இடங்களில் இருந்ததால், ‘மகன்கள்’ குறித்த குறிப்பு [a] அதற்குப் பின்னும், קרה குறித்த குறிப்பு [b] ‘மேற்கூரை அமைத்து’ என்பதற்குப் பின்னும் சரியான இடத்தில் வைக்கப்பட்டுள்ளன.
