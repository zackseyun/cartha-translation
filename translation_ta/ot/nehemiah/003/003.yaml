base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/003.yaml
  text: The sons of Hassenaah built the Fish Gate[a]; they roofed it and set up its doors, its bolts[b], and its bars.
translation:
  language: ta
  text: ஹசெனாவின் மகன்கள்[a] மீன் வாசலைக் கட்டினார்கள்; அவர்களே அதற்கு மேற்கூரை அமைத்து[b], அதன் கதவுகளையும் தாழ்ப்பாள்களையும் தாழ்க்கம்பிகளையும் பொருத்தினார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “மகன்கள்” என்பது ஹசெனாவின் குடும்பத்தாரை அல்லது வம்சத்தாரைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அதை மூடினார்கள்” அல்லது “அதன் உத்திரங்களை அமைத்தார்கள்.” கட்டுமானச் சூழலில் எபிரேய வினைச்சொல் ஒரு கட்டமைப்பை மேலே மூடுவதைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׁעַר הַדָּגִים
  choice: மீன் வாசல்
  rationale: எருசலேமின் குறிப்பிட்ட நகரவாசலின் பெயராக வரும் எபிரேய இணைப்புச் சொல்லை இயல்பான தமிழ்ப் பெயராக்கத்தில் வழங்குகிறது.
- source_word: בָּנוּ
  choice: கட்டினார்கள்
  rationale: בנה என்பதன் நேரடிப் பொருள் ‘கட்டு’; சுற்றுப்புறச் சூழல் மறுசீரமைப்பைப் பற்றியதாயினும், இவ்வசனத்தில் ‘பழுதுபார்த்தார்கள்’ என்பதற்கான குறிப்பான வினைச்சொல் இல்லை.
- source_word: בְּנֵי הַסְּנָאָה
  choice: ஹசெனாவின் மகன்கள்
  rationale: בני என்பதன் வடிவத்தை வெளிப்படையாகப் பேணுகிறது; இது குடும்பத்தார் அல்லது வம்சத்தாரையும் குறிக்கக்கூடும் என்பதால் அடிக்குறிப்பில் மாற்றுப் பொருள் தரப்படுகிறது. பெயர் மொழிபெயர்க்கப்படாமல் ஒலிபெயர்க்கப்படுகிறது.
- source_word: הֵמָּה
  choice: அவர்களே
  rationale: தனியாக இடம்பெறும் வலியுறுத்தும் சுட்டுப்பெயரின் அழுத்தத்தை இயல்பான தமிழில் ‘அவர்களே’ எனப் பேணுகிறது.
- source_word: קֵרוּהוּ
  choice: அதற்கு மேற்கூரை அமைத்து
  rationale: கட்டுமானச் சூழலில் קרה என்பது ஒரு கட்டமைப்பை மூடுதல் அல்லது அதன்மேல் கூரை/உத்திரங்களை அமைத்தலைக் குறிக்கிறது; இங்கு இயல்பான கட்டிட மொழியாக வழங்கப்பட்டுள்ளது.
- source_word: וַיַּעֲמִידוּ דַּלְתֹתָיו
  choice: அதன் கதவுகளைப் பொருத்தினார்கள்
  rationale: சொல்லுக்கு சொல் ‘கதவுகளை நிற்கச் செய்தார்கள்’; வாசல் கட்டுமானச் சூழலில் ‘பொருத்தினார்கள்’ என்பது செயலின் பொருளைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: מַנְעוּלָיו
  choice: அதன் தாழ்ப்பாள்கள்
  rationale: வாசலைப் பூட்டி நிலைநிறுத்தும் பொருத்துக் கருவிகளைக் குறிக்கிறது; உடன் வரும் நீண்ட குறுக்குச் சட்டங்களிலிருந்து வேறுபடுத்த ‘தாழ்ப்பாள்கள்’ பொருத்தமானது.
- source_word: וּבְרִיחָיו
  choice: அதன் குறுக்குச் சட்டங்கள்
  rationale: கதவுகளுக்குக் குறுக்காக இடப்பட்டு அவற்றைப் பாதுகாப்பாக மூடும் bars என்பதைக் குறிப்பாக வெளிப்படுத்துகிறது.
