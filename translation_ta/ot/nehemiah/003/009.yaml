  verdict: revise
  source_fidelity: The verse’s sequence, repair action, patronymic, and administrative designation are substantially represented. However, חוּר (Hur) should not be rendered “ஊர்,” since this loses the initial consonant, and the territorial title is more accurately expressed as rulership over half of the Jerusalem district.
