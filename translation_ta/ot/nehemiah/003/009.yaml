  text: וְ/עַל יָדָ֤/ם הֶחֱזִיק֙ רְפָיָ֣ה בֶן ח֔וּר שַׂ֕ר חֲצִ֖י פֶּ֥לֶךְ יְרוּשָׁלִָֽם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/009.yaml
  text: Next to them[a], Rephaiah son of Hur, ruler of half the district of Jerusalem, made repairs.
translation:
  language: ta
  text: அவர்களுக்கு அடுத்ததாக, ஹூரின் மகன் ரெப்பாயா—எருசலேம் மாவட்டத்தின் பாதிக்குத் தலைவராக இருந்தவர்—பழுதுபார்த்தார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: வேறு விதமாக, “வலுப்படுத்தினார்.” எபிரெய வினைச்சொல்லின் நேரடிப் பொருள் “வலுவாக்கினார்”; ஆனால் இந்த அதிகாரத்தில் அது பழுதுபார்க்கும் பணியைக் குறிக்கும் மரபுத்தொடராகப் பயன்படுத்தப்படுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל יָדָם
  choice: அவர்களுக்கு அடுத்ததாக
  rationale: இச்சொற்றொடர் நேரடியாக ‘அவர்களுடைய கைக்குப் பக்கத்தில்’ என்றாலும், நெகேமியா 3-இன் பணியாளர் பட்டியலில் சுவரின் அடுத்த பகுதியில் வேலை செய்தவரைக் குறிக்கிறது. இயல்பான தமிழில் தொடர்ச்சியையும் இட அண்மையையும் இது தெளிவாகக் காட்டுகிறது.
- source_word: הֶחֱזִיק
  choice: பழுதுபார்த்தார்
  rationale: חזק என்பதன் ஹிஃபில் வடிவம் அடிப்படையில் ‘வலுப்படுத்தினார்’ என்று பொருள்படும்; ஆனால் இவ்வதிகாரத்தில் சுவரைச் சீரமைக்கும் பணியைச் சூழலுக்கேற்ற மரபுத்தொடராகக் குறிக்கிறது. ‘பழுதுபார்த்தார்’ நவீன தமிழில் அந்தச் செயலைத் தெளிவாகச் சொல்கிறது; நேரடிப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
- source_word: רְפָיָה
  choice: ரெப்பாயா
  rationale: எபிரெய தனிப்பெயரின் ஒலிப்பைத் தமிழில் இயன்றவரை அணுக்கமாக எழுத்துப்பெயர்த்துள்ளது.
- source_word: בֶן חוּר
  choice: ஊரின் மகனான
  rationale: தந்தையின் பெயரால் ஒருவரை அடையாளப்படுத்தும் வழக்கமான எபிரெய வம்சக் குறிப்பு. חוּר என்பதன் தொடக்க மெய் தமிழ் ‘ஊர்’ என்ற ஒலிப்புக்கு அணுக்கமாக எழுத்துப்பெயர்க்கப்பட்டுள்ளது.
- source_word: שַׂר
  choice: தலைவர்
  rationale: நிர்வாகப் பொறுப்புடைய அதிகாரி அல்லது ஆட்சித் தலைவரைக் குறிக்கும் சொல். ‘தலைவர்’ இயல்பான தமிழில் பதவியைத் தெரிவிக்கிறது; அதீத அரச மரியாதைப் பொருளைச் சேர்ப்பதில்லை.
- source_word: חֲצִי פֶּלֶךְ יְרוּשָׁלִָם
  choice: எருசலேம் மாவட்டத்தின் ஒரு பாதி
  rationale: פֶּלֶךְ இங்கு நிர்வாக மாவட்டத்தைக் குறிக்கிறது. ‘ஒரு பாதி’ என்பது எருசலேம் மாவட்டம் இரண்டு நிர்வாகப் பகுதிகளாகப் பிரிக்கப்பட்டிருந்ததை இயல்பாக வெளிப்படுத்துகிறது.
