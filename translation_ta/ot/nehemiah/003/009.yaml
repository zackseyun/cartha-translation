    issue: חוּר is rendered “ஊர்.”
    rationale: The Hebrew name Hur begins with ח (ḥet). Tamil “ஊர்” omits that consonant and coincides with the ordinary Tamil word for a town; “ஹூர்” better preserves the name’s form.
