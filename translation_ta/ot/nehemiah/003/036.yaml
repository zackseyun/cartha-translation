base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/036.yaml
  text: Hear[a], our God, for we are despised. Turn their reproach back on their own heads[c][b], and give them over as plunder in a land of captivity.
translation:
  language: ta
  text: எங்கள் கடவுளே, செவிகொடும்; ஏனெனில் நாங்கள் இகழ்ச்சிப் பொருளாகிவிட்டோம்.[a] அவர்களுடைய பழிச்சொல்லை அவர்களுடைய தலையின்மேலேயே திருப்பும்; சிறையிருப்பின் ஒரு நாட்டில் அவர்களைக் கொள்ளைப்பொருளாக ஒப்புக்கொடும்.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நாங்கள் இகழப்பட்டிருக்கிறோம்.” எபிரெயத்தில் சொல்லுக்கு சொல், “நாங்கள் இகழ்ச்சியாகிவிட்டோம்.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அவர்களைக் கொள்ளையிடப்படும்படி ஒப்புக்கொடும்” அல்லது “அவர்களைக் கொள்ளைப்பொருளாக்கும்.”
    reason: lexical_alternative
  - marker: c
    text: அல்லது, “சிறையிருப்பின் அந்த நாட்டில்.” சூழலைப் பொறுத்து எபிரெயச் சொற்றொடரை வரையறையற்றதாகவோ குறிப்பிட்டதாகவோ புரிந்துகொள்ளலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁמַע
  choice: செவிகொடும்
  rationale: கடவுளை நோக்கிய வேண்டுதலில் வரும் இரண்டாம் நபர் ஒருமை கட்டளை. எபிரெயத்தில் வெளிப்படையாக இல்லாத ‘எங்களுக்கு’ என்ற செயப்படுபொருளைச் சேர்க்காமல், இயல்பான தமிழ் வேண்டுதல் நடையைப் பேணுகிறது.
- source_word: אֱלֹהֵינוּ
  choice: எங்கள் கடவுளே
  rationale: முதலாம் நபர் பன்மை உரிமை விகுதியையும் நேரடி விளிப்பையும் தெளிவாகக் காட்டுகிறது.
- source_word: הָיִינוּ בוּזָה
  choice: நாங்கள் இகழ்ச்சிப் பொருளாகிவிட்டோம்
  rationale: ‘நாங்கள் இகழ்ச்சியாக ஆகியிருக்கிறோம்’ என்ற மூலத்தின் பெயர்ச்சொல் அமைப்பையும், ஏற்பட்டுவிட்ட தற்போதைய நிலையையும் இயல்பான தமிழில் காக்கிறது.
- source_word: וְהָשֵׁב חֶרְפָּתָם אֶל רֹאשָׁם
  choice: அவர்களுடைய பழிச்சொல்லை அவர்களுடைய தலையின்மேலேயே திருப்பும்
  rationale: שוב என்பதன் காரணவினைப் பொருளான ‘திரும்பும்படி செய்’ என்பதையும், பழி அவர்கள்மீதே திரும்பும் பதிலீட்டு உருவகத்தையும் பேணுகிறது.
- source_word: וּתְנֵם לְבִזָּה
  choice: அவர்களைக் கொள்ளைப்பொருளாக ஒப்புக்கொடும்
  rationale: נתן உடன் வரும் לְבִזָּה-வின் விளைவுநிலைப் பொருளை, அவர்கள் கொள்ளைப்பொருளாகக் கையளிக்கப்பட வேண்டும் என்ற நேரடியான வேண்டுதலாக வெளிப்படுத்துகிறது.
- source_word: בְּאֶרֶץ שִׁבְיָה
  choice: சிறையிருப்பின் ஒரு நாட்டில்
  rationale: ‘சிறையிருப்பு/சிறைநிலை உள்ள ஒரு நாட்டில்’ என்ற எபிரெயச் சொற்றொடரையும், கட்டுரையில்லாததால் தோன்றும் வரையறையற்ற வாசிப்பையும் காக்கிறது.
theological_decisions:
- issue: எதிரிகளுக்கு எதிரான தண்டனை வேண்டுதல்
  choice: பழி அவர்கள்மீது திரும்பவும் அவர்கள் கொள்ளைப்பொருளாக ஒப்புக்கொடுக்கப்படவும் செய்யும் நேரடி வேண்டுதலை அப்படியே வைத்தல்
  alternative: இதைப் பொதுவான நீதிக்கான வேண்டுதலாக மென்மைப்படுத்துதல் அல்லது உருவகமாக மட்டும் விளக்குதல்
  rationale: எபிரெய உரை பதிலீட்டு நீதியையும் உண்மையான தண்டனையையும் நேரடியாக வேண்டுகிறது; இறையியல் அசௌகரியத்திற்காக அதன் தீவிரத்தை மொழிபெயர்ப்பு குறைக்கக்கூடாது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுமக்கள் புரிந்துகொள்ளக்கூடிய கண்ணியமான வேண்டுதல் நடை பயன்படுத்தப்பட்டுள்ளது. ‘செவிகொடும்’, ‘திருப்பும்’, ‘ஒப்புக்கொடும்’ ஆகியவை இறைமுக வேண்டுதலுக்கேற்ற மரியாதைமிக்க ஒருமை ஏவல் வடிவங்கள். மூலத்தின் கடுமையான தண்டனை வேண்டுதல் மென்மைப்படுத்தப்படவில்லை.
