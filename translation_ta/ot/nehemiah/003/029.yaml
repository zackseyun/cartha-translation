translation_notes:
  register: நவீனத் தரத் தமிழில், எளிமையும் கண்ணியமும் கொண்ட வரலாற்று விவரிப்பு. பட்டியல் அமைப்பின் மீளுரையான ‘அவருக்குப் பின்பு’ தக்கவைக்கப்பட்டுள்ளது. அடிக்குறிப்பு குறிகள் தொடர்புடைய சொற்றொடர்களின் பின்னர் முதன்மை உரையில் இடம்பெற்றுள்ளன.
