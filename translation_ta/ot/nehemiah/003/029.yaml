  text: אַחֲרָ֧י/ו הֶחֱזִ֛יק צָד֥וֹק בֶּן אִמֵּ֖ר נֶ֣גֶד בֵּית֑/וֹ וְ/אַחֲרָ֤י/ו הֶחֱזִיק֙ שְׁמַֽעְיָ֣ה בֶן שְׁכַנְיָ֔ה שֹׁמֵ֖ר שַׁ֥עַר הַ/מִּזְרָֽח־ס־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/029.yaml
  text: After him Zadok son of Immer made repairs opposite his house[a], and after him Shemaiah son of Shecaniah, keeper of the East Gate[c][b], made repairs.
translation:
  language: ta
  text: அவருக்குப் பின்பு, இம்மேரின் மகன் சாதோக்கு தன் வீட்டுக்கு எதிரே பழுதுபார்த்தார்.[a] அவருக்குப் பின்பு, கிழக்கு வாசலின் காவலரான செக்கனியாவின் மகன் செமாயா பழுதுபார்த்தார்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “தன் வீட்டுக்கு எதிரே” என்பதை “தன் வீட்டின் முன்பாக” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “கிழக்கு வாசலின் காவலர்” என்பதை “கிழக்கு வாசலைக் காப்பவர்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחֲרָיו
  choice: அவருக்குப் பின்பு
  rationale: பழுதுபார்ப்புப் பணியில் ஈடுபட்டவர்களின் வரிசையையும் இடத்தொடர்பையும் குறிக்கும் எபிரெய வழக்கை இயல்பான தமிழில் தருகிறது.
- source_word: הֶחֱזִיק
  choice: பழுதுபார்த்தார்
  rationale: இந்த அதிகாரத்தில் חזק என்பதன் ஹிஃபீல் வடிவம் சுவரையும் வாசல்களையும் வலுப்படுத்திப் பழுதுபார்க்கும் பணியைக் குறிக்கிறது; சொற்பொருளான ‘வலுப்படுத்தினார்’ என்பதைவிட சூழலுக்குப் பொருத்தமானது.
- source_word: צָדוֹק בֶּן אִמֵּר
  choice: இம்மேரின் மகன் சாதோக்கு
  rationale: தனிப்பெயர்களைத் தமிழில் ஒலிபெயர்த்து, வழக்கமான வம்சத் தொடர்பை இயல்பாகக் கூறுகிறது.
- source_word: נֶגֶד בֵּיתוֹ
  choice: தன் வீட்டுக்கு எதிரே
  rationale: נֶגֶד என்பதன் ‘எதிரில்/முன்பாக’ என்ற இடப்பொருளைத் தக்கவைக்கிறது; உடைமைப் பின்னொட்டு இங்கு சாதோக்கின் சொந்த வீட்டைக் குறிக்கிறது.
- source_word: שְׁמַעְיָה בֶן שְׁכַנְיָה
  choice: செக்கனியாவின் மகன் செமாயா
  rationale: எபிரெய தனிப்பெயர்களை நவீனத் தமிழுக்கு ஏற்றவாறு ஒலிபெயர்க்கிறது.
- source_word: שֹׁמֵר
  choice: காவலர்
  rationale: வாசலைக் காக்கும் பொறுப்பு அல்லது பதவியைக் குறிக்கும் செயப்பெயர்; ‘காப்பாளர்’ என்பதும் சாத்தியம்.
- source_word: שַׁעַר הַמִּזְרָח
  choice: கிழக்கு வாசல்
  rationale: குறிப்பிட்ட வாசலின் திசைப் பெயரை இயல்பான தமிழில் தருகிறது.
