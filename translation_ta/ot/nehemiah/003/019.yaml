base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/019.yaml
  text: Next to him Ezer son of Jeshua[a], official of Mizpah[c][b], repaired another section opposite the ascent to the armory at the angle.
translation:
  language: ta
  text: அவருக்கு அடுத்தபடியாக, மிஸ்பாவின் அதிகாரியான யேசுவாவின் மகன் ஏசேர், மூலையில் உள்ள ஆயுதக்கிடங்கிற்கு[b] ஏறிச் செல்லும் வழிக்கு எதிரே மற்றொரு பகுதியை[a] பழுதுபார்த்தார்.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இரண்டாவது பகுதியை.” எபிரெயச் சொற்றொடர், ஏசேர் மதிலின் கூடுதலான ஒரு பகுதியைப் பழுதுபார்த்தார் என்பதை வலியுறுத்தலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “ஆயுதசாலை” அல்லது “ஆயுதங்கள்.” இங்கு ஆயுதங்கள் வைக்கப்பட்டிருந்த ஓர் இடம் குறிக்கப்படலாம்.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, “கோணத்தில்.” இது மதில் அல்லது கட்டமைப்பு திரும்பும் இடத்தைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחַזֵּק
  choice: பழுதுபார்த்தார்
  rationale: நெகேமியா 3-இன் மதில் மறுகட்டுமானச் சூழலில், இந்த வினைச்சொல் கட்டுமானத்தைச் சீரமைத்தல் அல்லது வலுப்படுத்துதல் என்ற பொருளில் வருகிறது. இயல்பான தமிழில் ‘பழுதுபார்த்தார்’ அந்தச் செயலைத் தெளிவாகக் காட்டுகிறது.
- source_word: עַל יָדוֹ
  choice: அவருக்கு அடுத்தபடியாக
  rationale: இந்த அதிகாரத்தில் பணியாளர்களின் அருகருகான வரிசையைக் குறிக்கும் மரபுத்தொடர்; தமிழில் இடவியல் தொடர்பை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: שַׂר הַמִּצְפָּה
  choice: மிஸ்பாவின் அதிகாரி
  rationale: שַׂר என்பது இங்கு அரசாட்சிப் பட்டத்தைவிட நிர்வாகத் தலைமைப் பொறுப்பைக் குறிக்கிறது; ‘அதிகாரி’ தேவையற்ற அரசியல் அல்லது மரபுசார் கருத்துகளைச் சேர்க்காது.
- source_word: מִדָּה שֵׁנִית
  choice: மற்றொரு பகுதி
  rationale: மதிலில் அவருக்குக் கொடுக்கப்பட்ட கூடுதல் பகுதியைக் குறிக்க வாய்ப்புள்ளது. ‘மற்றொரு பகுதி’ இயல்பான தமிழாகவும் சூழலுக்கு ஏற்றதாகவும் உள்ளது; நேரடியான ‘இரண்டாவது பகுதி’ அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: מִנֶּגֶד
  choice: எதிரே
  rationale: ஒரு நில அடையாளத்தை நோக்கியோ அதற்கு மறுபுறமோ உள்ள இடத்தைக் குறிக்கும் எளிய, துல்லியமான தமிழ் சொல்.
- source_word: עֲלֹת
  choice: ஏறிச் செல்லும் வழி
  rationale: עלה என்பதன் பெயர்ச்சொல் பயன்பாடு மேல்நோக்கிச் செல்லும் ஏற்றத்தை அல்லது அணுகுவழியைக் குறிக்கிறது; தமிழில் நில அமைப்பைத் தெளிவாகச் சொல்கிறது.
- source_word: הַנֶּשֶׁק
  choice: ஆயுதக்கிடங்கு
  rationale: இந்தச் சொல் நேரடியாக ‘ஆயுதங்கள்’ எனப் பொருள்படலாம்; ஆனால் இடவியல் விளக்கத்தில் ஆயுதங்கள் வைக்கப்பட்டிருந்த இடத்தைக் குறிப்பதாகத் தோன்றுவதால் ‘ஆயுதக்கிடங்கு’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: הַמִּקְצֹעַ
  choice: மதில் திரும்பும் மூலை
  rationale: கட்டடம் அல்லது மதிலின் கோணத் திருப்பத்தை இச்சொல் குறிக்கிறது. ‘மதில் திரும்பும் மூலை’ வாசகருக்கு நில அமைப்பைத் தெளிவாக்குகிறது; சுருக்கமான மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
