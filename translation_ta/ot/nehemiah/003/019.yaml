translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. எபிரெய உரையின் இடவியல் அமைப்பை இயல்பான தமிழ் வாக்கிய வரிசையில் வழங்கியுள்ளோம். எல்லா அடிக்குறிப்பு குறிகளும் உரையில் தொடர்புடைய சொற்களுடன் இணைக்கப்பட்டுள்ளன.
