base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/022.yaml
  text: After him the priests[a], the men of the plain, made repairs.
translation:
  language: ta
  text: அவனுக்குப் பிறகு சமவெளிப் பகுதியை[a] சேர்ந்த ஆசாரியர்கள் பழுதுபார்த்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “சமவெளிப் பகுதி” என்பதற்கு “வட்டாரம்” என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் ஒரு சமவெளியையோ வட்ட வடிவிலான மாவட்டத்தையோ குறிக்கக்கூடும்; இங்கு குறிப்பிடப்படும் துல்லியமான இடம் உறுதியாகத் தெரியவில்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַחֲרָיו
  choice: அவனுக்குப் பிறகு
  rationale: எபிரெயச் சொற்றொடரின் தொடர்வரிசைப் பொருளை இயல்பான தமிழில் தருகிறது; தொடக்க இணைப்பைத் தனியே மொழிபெயர்க்காமலிருந்தாலும் அதன் தொடர்ச்சிப் பொருள் நிலைக்கிறது.
- source_word: הֶחֱזִיקוּ
  choice: பழுதுபார்த்தார்கள்
  rationale: நெகேமியா 3-இன் மதில் சீரமைப்புச் சூழலில் இந்த வினைச்சொல் பழுதுபார்க்கும் பணியில் ஈடுபட்டதைக் குறிக்கிறது.
- source_word: הַכֹּהֲנִים
  choice: ஆசாரியர்கள்
  rationale: குறிப்பிட்ட பன்மைப் பெயர்ச்சொல்லின் நேரடியான, வழக்கமான தமிழ் மொழிபெயர்ப்பு.
- source_word: אַנְשֵׁי
  choice: சேர்ந்த
  rationale: சொல்லுக்கு நேரடியாக ‘ஆண்கள்’ என்று பொருள் இருந்தாலும், இங்கு ஓர் இடத்தைச் சேர்ந்த ஆசாரியர்களை அடையாளப்படுத்தும் இணைப்பாக இருப்பதால் இயல்பான தமிழில் ‘சேர்ந்த’ என வழங்கப்பட்டுள்ளது.
- source_word: הַכִּכָּר
  choice: சமவெளிப் பகுதி
  rationale: כִּכָּר என்பது சமவெளியையோ வட்டாரப் பகுதியையோ குறிக்கலாம். ‘சமவெளிப் பகுதி’ புவியியல் பொருளைத் தக்கவைத்தபடி அதன் துல்லியமான உள்ளூர் சுட்டு உறுதியற்றது என்பதற்கும் இடமளிக்கிறது.
