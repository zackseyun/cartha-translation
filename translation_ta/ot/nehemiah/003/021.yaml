base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/021.yaml
  text: After him[a], Meremoth son of Uriah, son of Hakkoz, repaired another section, from the entrance of the house of Eliashib to the end of the house of Eliashib.
translation:
  language: ta
  text: அவனுக்குப் பிறகு, அக்கோசின் மகனான உரியாவின் மகன் மெரெமோத், எலியாசிபின் வீட்டின் நுழைவாயிலிலிருந்து எலியாசிபின் வீட்டின் கடைசிவரை மற்றொரு பகுதியைப்[a] பழுதுபார்த்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘இரண்டாவது பகுதியை.’ எபிரெயச் சொற்றொடர் மெரெமோத்துக்கு ஒதுக்கப்பட்ட இன்னொரு பகுதியையோ அல்லது, நேரடியான முறையில், ‘இரண்டாவது அளவு/நீளம்’ என்பதையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחֲרָיו
  choice: அவனுக்குப் பிறகு
  rationale: நெகேமியா 3-இன் பணிப்பட்டியலில் இது வேலை ஒதுக்கீடுகளின் தொடர்ச்சியைக் குறிக்கிறது; எபிரெயச் சொல்லமைப்பையும் இயல்பான தமிழையும் காக்கிறது.
- source_word: הֶחֱזִיק
  choice: பழுதுபார்த்தார்
  rationale: வினைச்சொல்லின் அடிப்படைப் பொருள் ‘பலப்படுத்துதல்’ என்றாலும், இவ்வதிகாரத்தின் கட்டுமானச் சூழலில் சுவர் அல்லது அதனுடன் தொடர்புடைய அமைப்பைப் பழுதுபார்ப்பதைக் குறிக்கிறது.
- source_word: מְרֵמוֹת בֶּן אוּרִיָּה בֶּן הַקּוֹץ
  choice: அக்கோசின் மகனான உரியாவின் மகன் மெரெமோத்
  rationale: பெயர்களும் வம்சத் தொடர்பின் முழுச் சங்கிலியும் பாதுகாக்கப்பட்டுள்ளன; தமிழில் உறவுமுறை தெளிவாகத் தெரிய இயல்பான வரிசையில் தரப்பட்டுள்ளது.
- source_word: מִדָּה שֵׁנִית
  choice: மற்றொரு பகுதி
  rationale: மெரெமோத் முன்பே ஒரு பகுதியில் வேலை செய்ததாக 4ஆம் வசனம் குறிப்பிடுவதால், இது அவருக்குரிய கூடுதல் பணிப்பகுதியைக் குறிக்கலாம்; அதேவேளை மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: מִפֶּתַח בֵּית אֶלְיָשִׁיב
  choice: எலியாசிபின் வீட்டின் நுழைவாயிலிலிருந்து
  rationale: פֶּתַח என்பது திறப்பு, வாசல் அல்லது நுழைவாயிலைக் குறிக்கும்; கட்டிட விவரிப்பில் ‘நுழைவாயில்’ தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: וְעַד תַּכְלִית בֵּית אֶלְיָשִׁיב
  choice: அந்த வீட்டின் கடைசிவரை
  rationale: תַּכְלִית இங்கு நிறைவேற்றம் என்ற கருத்தைவிட இடத்தின் எல்லை அல்லது கடைசி முனையைக் குறிக்கிறது; மீளுரைப்பை இயல்பான தமிழில் ‘அந்த வீடு’ எனத் தருகிறது.
