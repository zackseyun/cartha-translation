translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் வரலாற்றுப் பட்டியலுக்கேற்ற கண்ணியமான நடையிலும் மொழிபெயர்க்கப்பட்டது. தமிழ் வாக்கிய இயல்புக்காக வினைச்சொல் இறுதியில் வைக்கப்பட்டுள்ளது; மூலத்தின் இரு கூட்டுப் பொருள்களும் ‘-யும்’ மூலம் தெளிவாக்கப்பட்டுள்ளன.
