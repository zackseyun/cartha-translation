  edition: WLC
  text: מִדָּ֣ה שֵׁנִ֗ית הֶחֱזִיק֙ מַלְכִּיָּ֣ה בֶן חָרִ֔ם וְ/חַשּׁ֖וּב בֶּן פַּחַ֣ת מוֹאָ֑ב וְ/אֵ֖ת מִגְדַּ֥ל הַ/תַּנּוּרִֽים־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/011.yaml
  text: Malchijah son of Harim and Hasshub son of Pahath-moab repaired another section[b][a], and also the Tower of the Ovens.
translation:
  language: ta
  text: ஹாரீமின் மகன் மல்கியா, பஹத்-மோவாபின் மகன் ஹஷ்ஷூப் ஆகியோர் மற்றொரு பகுதியையும்[a], அடுப்புகளின் கோபுரத்தையும்[b] பழுதுபார்த்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘இரண்டாவது பகுதியையும்.’ எபிரெயச் சொற்றொடரை இன்னும் நேரடியாக இவ்வாறு மொழிபெயர்க்கலாம்; இங்கே அது பழுதுபார்க்க ஒதுக்கப்பட்ட கூடுதல் பகுதியைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘உலைகளின் கோபுரத்தையும்.’ எபிரெயச் சொல் அடுப்புகளையோ உலைகளையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִדָּה שֵׁנִית
  choice: மற்றொரு பகுதி
  rationale: இந்த அதிகாரத்தின் மதில் பழுதுபார்ப்புச் சூழலில், பழுதுபார்க்க ஒதுக்கப்பட்ட கூடுதல் பகுதியைக் குறிக்கும் இயல்பான தமிழ் சொற்றொடர்; ‘இரண்டாவது பகுதி’ என்ற நேரடி பொருளையும் அடிக்குறிப்பில் பாதுகாக்கிறது.
- source_word: הֶחֱזִיק
  choice: பழுதுபார்த்தார்கள்
  rationale: மதிலைக் கட்டிச் சீரமைக்கும் இச்சூழலில், வினைச்சொல் பழுதுபார்த்தல் அல்லது வலுப்படுத்துதல் என்ற பொருளில் வருகிறது; நவீன தமிழில் ‘பழுதுபார்த்தார்கள்’ தெளிவாக உள்ளது.
- source_word: מַלְכִּיָה בֶן חָרִם
  choice: ஆரீமின் மகன் மல்கியா
  rationale: தனிப்பெயர்களை எபிரெய உச்சரிப்புக்கு அண்மையாக ஒலிபெயர்த்து, மகன் உறவை இயல்பான தமிழில் தருகிறது.
- source_word: וְחַשּׁוּב בֶּן פַּחַת מוֹאָב
  choice: பாகாத்-மோவாபின் மகன் அசூப்
  rationale: இணைப்பையும் தந்தை அல்லது குலப்பெயர் உறவையும் பாதுகாத்து, பெயர்களை மூலமொழிக்கு அண்மையாக ஒலிபெயர்க்கிறது.
- source_word: וְאֵת
  choice: -யும்
  rationale: முந்தைய பகுதியுடன் கோபுரத்தையும் கூடுதல் பழுதுபார்க்கப்பட்ட பொருளாக இணைக்கும் எபிரெய கூட்டல் விசையை இயல்பான தமிழ் வேற்றுமை உருபு வெளிப்படுத்துகிறது.
- source_word: מִגְדַּל הַתַּנּוּרִים
  choice: அடுப்புகளின் கோபுரம்
  rationale: מִגְדָּל என்பதைக் ‘கோபுரம்’ என்றும், תַּנּוּרִים என்பதன் முதன்மையான காட்சிப்பூர்வ பொருளை ‘அடுப்புகள்’ என்றும் வெளிப்படையாகத் தருகிறது; ‘உலைகள்’ என்ற சாத்தியத்தையும் அடிக்குறிப்பு பாதுகாக்கிறது.
