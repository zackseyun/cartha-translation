base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/023.yaml
  text: After him Benjamin and Hasshub made repairs opposite their house. After him Azariah son of Maaseiah[a], son of Ananiah, made repairs beside his house.
translation:
  language: ta
  text: அவருக்குப் பின் பென்யமீனும் ஹஷ்ஷூபும் தங்கள் வீட்டுக்கு எதிரே பழுதுபார்த்தார்கள். அவருக்குப் பின், அனனியாவின் மகனான மாசெயாவின் மகன் அசரியா தன் வீட்டின் அருகே பழுதுபார்த்தான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַחֲרָיו
  choice: அவனுக்குப் பிறகு
  rationale: சுவரின் நெடுகிலும் பழுதுபார்த்தவர்களின் வரிசையைச் சுட்டும் தொடர்ச்சியான சொற்றொடராக இதை இயல்பான தமிழில் வழங்குகிறது.
- source_word: הֶחֱזִיק
  choice: பழுதுபார்த்தார்கள் / பழுதுபார்த்தான்
  rationale: நெகேமியா 3-இல் חזק என்பதன் ஹிஃபில் வடிவம் சுவரைப் பழுதுபார்க்கும் பணியில் ஈடுபடுவதைக் குறிக்கிறது; தமிழில் எழுவாயின் எண்ணிக்கைக்கு ஏற்ப வினைமுற்று அமைக்கப்பட்டுள்ளது.
- source_word: בִּנְיָמִן
  choice: பென்யமீன்
  rationale: எபிரெய தனிப்பெயரின் ஒலியைத் தமிழில் வழக்கமான வேதாகமப் பெயர்ப்பாட்டுக்கு ஏற்றவாறு எழுத்துப்பெயர்த்துள்ளது.
- source_word: חַשּׁוּב
  choice: அசூப்
  rationale: எபிரெய தனிப்பெயரை அதன் மெய்யொலிகளுக்கு நெருக்கமாகத் தமிழில் எழுத்துப்பெயர்த்துள்ளது.
- source_word: נֶגֶד
  choice: எதிரே
  rationale: ஒரு கட்டிடத்தை எதிர்நோக்கிய அல்லது அதன் முன்புறத்திலுள்ள இடத்தைக் குறிக்கும் இயல்பான தமிழ் இடச்சொல்.
- source_word: בֵּיתָם
  choice: தங்கள் வீட்டுக்கு
  rationale: எபிரெய மூலத்தின் ஒருமை 'வீடு' என்பதையும் பன்மை உடைமைப் பின்னொட்டையும் பாதுகாக்கிறது.
- source_word: עֲזַרְיָה
  choice: அசரியா
  rationale: எபிரெய தனிப்பெயரின் தமிழ் எழுத்துப்பெயர்ப்பு.
- source_word: בֶן מַעֲשֵׂיָה בֶּן עֲנָנְיָה
  choice: அனனியாவின் மகனான மாசெயாவின் மகன்
  rationale: அசரியா மாசெயாவின் மகன், மாசெயா அனனியாவின் மகன் என்ற எபிரெய வம்சவரிசை உறவைத் தமிழில் தெளிவாகப் பாதுகாக்கிறது.
- source_word: אֵצֶל
  choice: அருகே
  rationale: அண்மையிலுள்ள இடத்தைக் குறிக்கிறது; முன்னுள்ள வரிசைக் குறியான 'பிறகு' என்பதிலிருந்து இதை வேறுபடுத்துகிறது.
- source_word: בֵּיתוֹ
  choice: தன் வீட்டுக்கு
  rationale: எழுவாயான அசரியாவையே உடைமையாளர் எனத் தெளிவாகச் சுட்டி, மூலத்தின் ஒருமையைப் பாதுகாக்கிறது.
