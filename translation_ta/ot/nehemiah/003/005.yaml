  text: וְ/עַל יָדָ֖/ם הֶחֱזִ֣יקוּ הַ/תְּקוֹעִ֑ים וְ/אַדִּֽירֵי/הֶם֙ לֹא הֵבִ֣יאוּ צַוָּרָ֔/ם בַּ/עֲבֹדַ֖ת אֲדֹנֵי/הֶֽם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/005.yaml
  text: And next to them the Tekoites made repairs[b][a], but their nobles would not put their necks to the work of their lords.
translation:
  language: ta
  text: அவர்களுக்கு அடுத்ததாகத் தெக்கோவா மக்கள் பழுதுபார்த்தார்கள்; ஆனால் அவர்களுடைய பிரமுகர்கள்[a], தங்கள் எஜமானர்களின் பணிக்குத் தங்கள் கழுத்தைக் கொடுக்க மறுத்தார்கள்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘பிரமுகர்கள்’ என்பதற்கு ‘உயர்குடியினர்’ அல்லது ‘முக்கிய மனிதர்கள்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: எழுத்துப்படி, ‘தங்கள் எஜமானர்களின் பணிக்குத் தங்கள் கழுத்தைக் கொண்டுவரவில்லை.’ இது பணிக்கு உட்படவோ அதை ஏற்றுக்கொள்ளவோ மறுப்பதைக் குறிக்கும் உருவகம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל־יָדָם
  choice: அவர்களுக்கு அடுத்ததாக
  rationale: நெகேமியா 3-இன் கட்டுமானப் பட்டியலில் இந்த எபிரெய வழக்கு, முந்தைய குழுவுக்கு அருகிலுள்ள அடுத்த பணிப்பகுதியைக் குறிக்கிறது.
- source_word: הֶחֱזִיקוּ
  choice: பழுதுபார்த்தார்கள்
  rationale: அடிப்படை வினை ‘பலப்படுத்துதல்’ அல்லது ‘பிடித்துக்கொள்ளுதல்’ எனப் பொருள்படலாம்; இங்கு மதிலைச் சீரமைக்கும் சூழலில் ‘பழுதுபார்த்தார்கள்’ என்பதே இயல்பான பொருள்.
- source_word: הַתְּקוֹעִים
  choice: தெக்கோவா மக்கள்
  rationale: இது தெக்கோவா என்ற ஊரைச் சேர்ந்தவர்களைக் குறிக்கும் குடியினப் பெயர்; நவீனத் தமிழில் ஊர்சார்ந்த அடையாளத்தைத் தெளிவாகத் தருகிறது.
- source_word: וְאַדִּירֵיהֶם
  choice: அவர்களுடைய பிரமுகர்கள்
  rationale: இந்தச் சொல் வலிமை, செல்வாக்கு அல்லது உயர்நிலை உடையவர்களைக் குறிக்கலாம். குடிமைப் பணிச் சூழலில் ‘பிரமுகர்கள்’ என்பது பொருத்தமானது; ‘உயர்குடியினர்/முக்கிய மனிதர்கள்’ என்ற நிழற்பொருளும் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: לֹא הֵבִיאוּ צַוָּרָם
  choice: தங்கள் கழுத்தைக் கொடுக்க மறுத்தார்கள்
  rationale: மூலத்தின் ‘தங்கள் கழுத்தைக் கொண்டுவரவில்லை’ என்ற உருவகத்தைத் தக்கவைத்து, அது வெறும் கலந்துகொள்ளாமை அல்ல, பணியை ஏற்க மறுத்த செயல் என்பதையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: בַּעֲבֹדַת
  choice: பணிக்கு
  rationale: இங்கு עֲבֹדָה என்பது பொதுவான ஊழியம் அல்ல; மதில் சீரமைப்புக்கான உழைப்பு அல்லது ஒப்படைக்கப்பட்ட பணியைக் குறிக்கிறது.
- source_word: אֲדֹנֵיהֶם
  choice: தங்கள் எஜமானர்களின்
  rationale: எபிரெயம் பன்மையில் ‘அவர்களுடைய எஜமானர்கள்/ஆண்டவர்கள்’ என்று உள்ளது. மனித அதிகாரிகளைக் குறிக்கும் சமூகப் படிநிலையைப் பாதுகாக்க ‘எஜமானர்கள்’ என மொழிபெயர்க்கப்பட்டுள்ளது.
theological_decisions:
- issue: ‘அவர்களுடைய எஜமானர்கள்’ என்பதன் சுட்டுப்பொருள்
  choice: மறுகட்டுமானப் பணியோடு தொடர்புடைய மனித மேலதிகாரிகள் அல்லது அதிகாரிகள்
  alternative: விளக்கமாக ஒருமைப்படுத்தப்பட்ட ‘ஆண்டவருடைய பணி’ என்ற தெய்வீகச் சுட்டு
  rationale: மூல எபிரெய உரை பன்மையிலும் உடைமைப் பின்னொட்டுடனும் உள்ளது. ஆகவே அதை ஒருமைத் தெய்வீகப் பட்டமாக மாற்றாமல், மூலத்தின் மனித அதிகார உறவையும் சாத்தியமான சுட்டுப்பொருள் திறப்பையும் பாதுகாக்க வேண்டும்.
translation_notes:
  register: நவீன நிலையான தமிழில், பட்டியல் நடையின் சுருக்கத்தையும் கண்ணியத்தையும் காக்கிறது. மூலத்தின் ‘கழுத்து’ உருவகம் முதன்மை உரையிலேயே வைக்கப்பட்டு, அதன் பொருள் அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது. மனித அதிகாரிகளைக் குறிக்கும் பன்மை வடிவம் ஒருமைத் தெய்வீகச் சுட்டாக மாற்றப்படவில்லை.
