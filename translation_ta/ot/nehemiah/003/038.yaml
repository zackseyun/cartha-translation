  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையைப் பயன்படுத்துகிறது. எபிரெய மரபுத்தொடர் இயல்பான தமிழ் உருவகமான ‘மனமிருந்தது’ என்று காக்கப்பட்டுள்ளது; மொழிபெயர்ப்பில் விளக்கமாகச் சேர்க்கப்பட்ட ‘உயரம்’ அடிக்குறிப்பில் வெளிப்படையாகக் குறிக்கப்பட்டுள்ளது.
