source:
  edition: WLC
  text: וַ/נִּבְנֶה֙ אֶת הַ֣/חוֹמָ֔ה וַ/תִּקָּשֵׁ֥ר כָּל הַ/חוֹמָ֖ה עַד חֶצְיָ֑/הּ וַ/יְהִ֧י לֵ֦ב לָ/עָ֖ם לַ/עֲשֽׂוֹת־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/038.yaml
  text: So we rebuilt the wall[a], and the whole wall was joined together up to half its height, for the people had a heart to work.
translation:
  language: ta
  text: ஆகவே நாங்கள் மதிலை மீண்டும் கட்டினோம். மதில் முழுவதும் அதன் பாதி உயரம்வரை[a] ஒன்றாக இணைக்கப்பட்டது; ஏனெனில் வேலை செய்ய மக்களுக்கு மனமிருந்தது[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “அதன் பாதிவரை.” கட்டுமானச் சூழலில் இது மதிலின் பாதி உயரத்தைக் குறிப்பதாகப் புரிந்துகொள்ளப்படுகிறது.
    reason: மூலமொழியில் வெளிப்படையாக இல்லாத ‘உயரம்’ என்ற சூழல்சார் விளக்கத்தைத் தெரிவிக்கிறது.
  - marker: b
    text: எபிரெயத்தில் சொல்லுக்குச் சொல், “செய்ய மக்களுக்கு இருதயம் இருந்தது.” இந்த மரபுத்தொடர், அந்த வேலையைச் செய்ய அவர்கள் உள்ளார்ந்த விருப்பமும் உறுதியும் கொண்டிருந்ததைக் குறிக்கிறது.
    reason: எபிரெய மரபுத்தொடரின் நேரடிப் பொருளையும் அதன் சூழல்சார் பொருளையும் விளக்குகிறது.
lexical_decisions:
- source_word: וַנִּבְנֶה
  choice: ஆகவே நாங்கள் மதிலை மீண்டும் கட்டினோம்
  rationale: בנה என்பதன் Qal wayyiqtol முதல் நபர் பன்மை வடிவம் அடுத்த நிகழ்வை விவரிக்கிறது. முன்பிருந்த எருசலேம் மதிலைப் பழுதுபார்த்துக் கட்டும் சூழலில் ‘மீண்டும் கட்டினோம்’ இயல்பானது; வாவ் இணைப்பின் தொடர்ச்சி/விளைவு நுணுக்கத்தை ‘ஆகவே’ தருகிறது.
- source_word: הַחוֹמָה
  choice: மதில்
  rationale: חוֹמָה என்பது நகரைச் சுற்றிய பாதுகாப்பு மதிலைக் குறிக்கிறது; நவீனத் தமிழில் ‘மதில்’ துல்லியமும் இயல்பும் உடையது.
- source_word: וַתִּקָּשֵׁר
  choice: ஒன்றாக இணைக்கப்பட்டது
  rationale: קשר என்பதன் Niphal வடிவம் மதிலின் பகுதிகள் தொடர்ச்சியான முழுமையாக இணைந்த விளைவைச் சுட்டுகிறது; செயல்பாட்டு/விளைவுநிலையைத் தமிழ் செயப்பாட்டு வடிவம் காக்கிறது.
- source_word: כָּל הַחוֹמָה
  choice: மதில் முழுவதும்
  rationale: வரையறுக்கப்பட்ட பெயர்ச்சொல்லுடன் வரும் כָּל முழுமையைக் குறிக்கிறது; ‘மதில் முழுவதும்’ இயல்பான தமிழ்.
- source_word: עַד חֶצְיָהּ
  choice: அதன் பாதி உயரம்வரை
  rationale: சொல்லுக்குச் சொல் ‘அதன் பாதிவரை.’ கட்டுமானச் சூழலில் மதிலின் உயரத்தில் பாதியளவு கட்டப்பட்டதை இது குறிக்கலாம்; தெளிவுக்காக ‘உயரம்’ சேர்க்கப்பட்டுள்ளது, ஆனால் மூலத்தின் சுருக்கம் அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
- source_word: וַיְהִי לֵב לָעָם
  choice: மக்களுக்கு மனமிருந்தது
  rationale: சொல்லுக்குச் சொல் ‘மக்களுக்கு இருதயம் இருந்தது’ என்ற எபிரெய மரபுத்தொடர் உள்ளார்ந்த விருப்பத்தையும் உறுதியையும் குறிக்கிறது. ‘மனமிருந்தது’ தமிழ் மரபில் இயல்பாக அதே உருவக நுணுக்கத்தைத் தக்கவைக்கிறது.
- source_word: לַעֲשׂוֹת
  choice: வேலை செய்ய
  rationale: עשה பொதுவாக ‘செய்/உருவாக்கு’ எனப் பொருள்படும்; இக்கட்டுமானச் சூழலில் மேற்கொண்ட பணியைக் குறிக்க ‘வேலை செய்ய’ தெளிவானது.
