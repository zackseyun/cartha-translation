base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/025.yaml
  text: Palal son of Uzai repaired opposite the angle and the tower projecting from the upper house of the king[a], which is by the court of the guard[c][b]. After him Pedaiah son of Parosh repaired.
translation:
  language: ta
  text: ஊசாயின் மகன் பாலால், மூலைக்கும் காவல் முற்றத்துக்கு அருகிலிருந்த அரசரின் மேல் வீட்டிலிருந்து வெளியே நீண்டிருந்த கோபுரத்துக்கும் எதிரே பழுதுபார்த்தார்.[a][b][c] அவருக்குப் பிறகு பாரோஷின் மகன் பெதாயா பழுதுபார்த்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘மூலை.’
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘அரசரின் மேல் அரண்மனையிலிருந்து.’ எபிரெயத்தில் நேரடியாக, ‘அரசரின் மேல் வீட்டிலிருந்து.’
    reason: lexical_alternative
  - marker: c
    text: அல்லது, ‘சிறை முற்றம்.’ இந்தச் சொல் காவலில் வைக்கப்படுகிறவர்களோடு தொடர்புடைய முற்றத்தைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִנֶּגֶד
  choice: எதிரே
  rationale: பழுதுபார்க்கப்பட்ட பகுதி ஓர் அடையாள இடத்தை எதிர்நோக்கி இருந்ததைக் குறிக்கும் இயல்பான இடவியல் சொல்.
- source_word: הַמִּקְצוֹעַ
  choice: சுவரின் வளைவு
  rationale: கட்டமைப்பின் கோணம் அல்லது திருப்பத்தைக் குறிக்கிறது; தமிழில் தனியாக ‘கோணம்’ என்பதைக் காட்டிலும் சுவரின் அமைப்பைத் தெளிவாக உணர்த்துகிறது.
- source_word: הַמִּגְדָּל הַיּוֹצֵא
  choice: வெளியே நீண்டிருந்த கோபுரம்
  rationale: יצא என்ற பங்கேற்புவினை கோபுரம் கட்டமைப்பிலிருந்து வெளிப்புறமாக நீண்டிருந்ததைச் சுட்டுகிறது.
- source_word: מִבֵּית הַמֶּלֶךְ הָעֶלְיוֹן
  choice: அரசரின் மேல் மாளிகையிலிருந்து
  rationale: בית இங்கு அரசருக்குரிய கட்டடம் அல்லது அரண்மனைப் பகுதியைக் குறிக்கலாம்; இயல்பான தமிழுக்காக ‘மாளிகை’ பயன்படுத்தப்பட்டாலும், எபிரெயச் சொல்லின் நேரடி வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: אֲשֶׁר לַחֲצַר הַמַּטָּרָה
  choice: காவல் முற்றத்தின் அருகிலுள்ள
  rationale: מטרה காவலில் வைக்கப்பட்ட இடத்துடன் தொடர்புடைய முற்றத்தைக் குறிக்கிறது; சிறைக்கூடம் என்ற வலுவான பொருளை முதன்மை உரையில் திணிக்காமல் ‘காவல் முற்றம்’ என வழங்கப்படுகிறது.
- source_word: אַחֲרָיו
  choice: அவருக்குப் பிறகு
  rationale: நெகேமியா 3-இன் பட்டியல் அமைப்பில் அடுத்த பணியாளரையும் பணிப்பகுதியையும் அறிமுகப்படுத்தும் வழக்கமான தொடர்.
- source_word: פָּלָל / אוּזַי / פְּדָיָה / פַּרְעֹשׁ
  choice: பாலால் / ஊசாய் / பெதாயா / பாரோஷ்
  rationale: எபிரெயப் பெயர்களின் ஒலியைத் தமிழில் இயன்றவரை தெளிவாகப் பெயர்த்தெழுதப்பட்டுள்ளது.
- source_word: '[ellipsis of repair verb with פְּדָיָה בֶן פַּרְעֹשׁ]'
  choice: பழுதுபார்த்தார்
  rationale: எபிரெயத்தில் இரண்டாம் கூறில் வினைச்சொல் விடுபட்டுள்ளது; அதிகாரத்தின் தொடரமைப்பிலிருந்து புரிந்துகொள்ளப்படும் பழுதுபார்க்கும் வினை தமிழில் முழுமையான வாக்கியத்திற்காக நிரப்பப்பட்டுள்ளது.
