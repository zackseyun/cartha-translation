translation_notes:
  register: நவீனத் தரத் தமிழில், பட்டியல் உரைக்கேற்ற சுருக்கமான மற்றும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘வளைவு,’ ‘வெளியே நீண்டிருந்த’ ஆகிய சொற்கள் கட்டட அமைப்பை சாதாரண வாசகருக்குத் தெளிவாக்குகின்றன. மூலத்தில் பழுதுபார்க்கப்பட்ட பொருள் வெளிப்படையாகச் சொல்லப்படாததால் முதன்மை உரையில் ‘சுவர்’ என்பது வளைவைத் தெளிவுபடுத்த மட்டுமே சேர்க்கப்பட்டுள்ளது.
