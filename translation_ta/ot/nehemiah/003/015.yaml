base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/015.yaml
  text: And Shallun son of Col-hozeh[a], official of the district of Mizpah, repaired the Fountain Gate. He rebuilt it and roofed it, and set up its doors, its bolts, and its bars, and repaired the wall of the Pool of Shelah by the king’s garden, as far as the stairs that go down from the City of David.
translation:
  language: ta
  text: மிஸ்பா மாவட்டத்தின் அதிகாரியான கொல்-ஹோசேயின் மகன் சல்லூம் நீரூற்று வாசலைப் பழுதுபார்த்தார். அவரே அதைக் கட்டி, அதற்கு மேற்கூரை அமைத்து, அதன் கதவுகளையும் தாழ்ப்பாள்களையும் குறுக்குக் கம்பிகளையும் பொருத்தினார். அரசரின் தோட்டத்துக்கு அருகிலிருந்த செலாக் குளத்தின்[a] மதிலையும், தாவீதின் நகரத்திலிருந்து இறங்கிச் செல்லும் படிக்கட்டுகள் வரையிலும் அவர் பழுதுபார்த்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சீலோவாம் குளம்.” இங்குள்ள எபிரேய இடப்பெயர் “செலாக்”; இது மரபாக சீலோவாமுடன் தொடர்புபடுத்தப்படுகிறது.
    reason: மூல எபிரேயப் பெயரின் வடிவத்தையும் பரவலாக அறியப்பட்ட பாரம்பரிய அடையாளத்தையும் வேறுபடுத்திக் காட்டுகிறது.
lexical_decisions:
- source_word: שַׁעַר הָעַיִן
  choice: நீரூற்று வாசல்
  rationale: עַיִן என்பது இங்கு நீரூற்று அல்லது ஊற்றுநீரைக் குறிக்கிறது; எருசலேமின் நீரமைப்பு சார்ந்த இடப்பெயராக ‘நீரூற்று வாசல்’ இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: הֶחֱזִיק
  choice: பழுதுபார்த்தார்
  rationale: நெகேமியா 3-இன் கட்டுமானச் சூழலில் இவ்வினைச்சொல் ஒரு மதில் அல்லது வாசல் பகுதியைச் சீரமைப்பதைக் குறிக்கும் மரபுத்தொடராகப் பயன்படுகிறது.
- source_word: שַׂר פֶּלֶךְ הַמִּצְפָּה
  choice: மிஸ்பா மாவட்டத்தின் அதிகாரி
  rationale: שַׂר என்பது தலைவர் அல்லது அதிகாரி; פֶּלֶךְ நிர்வாக மாவட்டம். ‘அதிகாரி’ என்பது பதவியின் அளவை மிகைப்படுத்தாமல் நவீன தமிழில் தெளிவாகத் தருகிறது.
- source_word: הוּא יִבְנֶנּוּ
  choice: அவரே அதைக் கட்டி
  rationale: הוּא தரும் வலியுறுத்தலை ‘அவரே’ காக்கிறது. முந்தைய வாக்கியத்தில் பழுதுபார்த்ததாகக் கூறியிருப்பதால், இங்கு ‘கட்டி’ என்பது எபிரேய வினையின் நேரடிப் பொருளையும் மறுகட்டுமானச் சூழலையும் இணைக்கிறது.
- source_word: וִיטַלְלֶנּוּ
  choice: அதற்கு மேற்கூரை அமைத்து
  rationale: டலல் வேரிலிருந்து வரும் இவ்வினை வாசல் கட்டமைப்பை மூடுதல் அல்லது அதற்கு கூரை அமைத்தலைக் குறிக்கிறது; ‘மேற்கூரை அமைத்து’ கட்டிடச் சூழலைத் தெளிவாக்குகிறது.
- source_word: ויעמידו דַּלְתֹתָיו מַנְעֻלָיו וּבְרִיחָיו
  choice: அதன் கதவுகளையும் தாழ்ப்பாள்களையும் குறுக்குச் சட்டங்களையும் பொருத்தினார்
  rationale: கேதீவ் வடிவம் பன்மையாகத் தோன்றினாலும், மசோரா வாசிப்பும் ஒருமை எழுவாயும் ‘அவர் பொருத்தினார்’ என்பதைக் கோருகின்றன. מַנְעֻלִים பூட்டும் தாழ்ப்பாள்களையும், בְּרִיחִים கதவை உறுதிப்படுத்தும் குறுக்குச் சட்டங்களையும் குறிக்கின்றன.
- source_word: חוֹמַת בְּרֵכַת הַשֶּׁלַח
  choice: செலாகு குளத்தின் மதில்
  rationale: בְּרֵכָה என்பது குளம். הַשֶּׁלַח என்ற எபிரேய வடிவத்தை ‘செலாகு’ எனப் பெயர்த்தெழுதி, பரிச்சயமான ‘சீலோவாம்’ அடையாளத்தை அடிக்குறிப்பில் தருவது மூல வடிவத்தையும் மரபையும் வேறுபடுத்திக் காட்டுகிறது.
- source_word: לְגַן הַמֶּלֶךְ
  choice: அரசரின் தோட்டத்துக்கு அருகிலிருந்த
  rationale: நிலவியல் விளக்கத்தில் לְ உறவு, அண்மை அல்லது திசையைக் குறிக்கலாம். ‘அருகிலிருந்த’ என்பது தமிழில் இயல்பான இடவுறவைத் தருகிறது; துல்லியமான திசையை தேவையின்றி நிர்ணயிப்பதில்லை.
- source_word: וְעַד הַמַּעֲלוֹת הַיּוֹרְדוֹת
  choice: இறங்கிச் செல்லும் படிக்கட்டுகள் வரையிலும்
  rationale: מַעֲלוֹת படிகள் அல்லது ஏற்றங்களைக் குறித்தாலும், הַיּוֹרְדוֹת அவை கீழ்நோக்கிச் செல்பவை என்பதைத் தெளிவாக்குகிறது.
- source_word: מֵעִיר דָּוִיד
  choice: தாவீதின் நகரத்திலிருந்து
  rationale: מִן தொடக்கம் அல்லது மூல இடத்தைக் குறிக்கிறது; ‘நகரத்திலிருந்து’ அதனை நேரடியாகப் பிரதிபலிக்கிறது.
