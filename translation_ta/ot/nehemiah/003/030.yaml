source:
  edition: WLC
  text: אחר/י הֶחֱזִ֜יק חֲנַנְיָ֣ה בֶן שֶׁלֶמְיָ֗ה וְ/חָנ֧וּן בֶּן צָלָ֛ף הַ/שִּׁשִּׁ֖י מִדָּ֣ה שֵׁנִ֑י אַחֲרָ֣י/ו הֶחֱזִ֗יק מְשֻׁלָּם֙ בֶּן בֶּ֣רֶכְיָ֔ה נֶ֖גֶד נִשְׁכָּתֽ/וֹ־־ס־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/030.yaml
  text: After him Hananiah son of Shelemiah and Hanun the sixth son of Zalaph repaired another section[b][a]. After him Meshullam son of Berechiah repaired opposite his chamber.
translation:
  language: ta
  text: அவருக்குப் பின்பு[a], செலேமியாவின் மகன் அனனியாவும் சாலாப்பின் ஆறாவது மகன் ஆனூனும் மதிலின் மற்றொரு பகுதியை[b]ச் செப்பனிட்டார்கள். அவருக்குப் பின்பு, பெரெகியாவின் மகன் மெசுல்லாம் தன் அறைக்கு எதிரே செப்பனிட்டான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: முதல் சொற்றொடரின் எபிரெய வடிவத்தைச் சொல்லுக்கு சொல் ‘எனக்குப் பின்பு’ என்றும் வாசிக்கலாம். ஆனால் இவ்வதிகாரத்தில் தொடர்ந்து வரும் பட்டியல் அமைப்புக்கு ஏற்ப அது மரபாக ‘அவருக்குப் பின்பு’ என்று புரிந்துகொள்ளப்படுகிறது.
    reason: textual_variant
  - marker: b
    text: எபிரெயில் சொல்லுக்கு சொல் ‘இரண்டாவது அளவு’; இங்கு ஏற்கெனவே செய்த பணிக்கு மேலாகப் பழுதுபார்க்க ஒதுக்கப்பட்ட இன்னொரு மதிற்பகுதியைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחֲרַי / אַחֲרָיו
  choice: அவருக்குப் பின்பு / அவர்களுக்குப் பின்பு
  rationale: இவ்வதிகாரத்தின் மதில் பழுதுபார்ப்போர் பட்டியலில் இச்சொற்றொடர் முந்தைய பணியாளரைத் தொடர்ந்து வரும் இடத்தையோ வரிசையையோ குறிக்கிறது. முதல் இடத்திலுள்ள வடிவம் ‘எனக்குப் பின்பு’ என்றும் வாசிக்கத்தக்கதால் அந்த வேறுபாடு அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
- source_word: הֶחֱזִיק
  choice: செப்பனிட்டார்கள் / செப்பனிட்டான்
  rationale: நெகேமியா 3-ன் சூழலில், மதிலின் பகுதியைப் பழுதுபார்த்து உறுதிப்படுத்தும் கட்டுமானப் பணியை இவ்வினைச்சொல் குறிக்கிறது. நவீனத் தமிழில் ‘செப்பனிடு’ இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: הַשִּׁשִּׁי
  choice: ஆறாவது மகன்
  rationale: ‘ஆறாவது’ என்று மட்டுமே உள்ள எபிரெய நீள்விடுபாட்டை குடும்ப வரிசையாகப் புரிந்துகொண்டு, தமிழில் பொருள் தெளிவதற்காக ‘மகன்’ சேர்க்கப்பட்டுள்ளது.
- source_word: מִדָּה שֵׁנִי
  choice: மதிலின் மற்றொரு பகுதி
  rationale: சொல்லுக்கு சொல் ‘இரண்டாவது அளவு’ என்றாலும், இவ்வதிகாரத்தில் ஏற்கெனவே செய்த பணிக்கு மேலாக ஒதுக்கப்பட்ட இன்னொரு மதிற்பகுதியை இச்சொற்றொடர் குறிக்கிறது.
- source_word: נֶגֶד
  choice: எதிரே
  rationale: குறிப்பிட்ட இடத்துக்கு நேர்முகமாக அல்லது முன்னால் உள்ள அமைவிடத்தைக் குறிக்கும் இயல்பான தமிழ் சொல்.
- source_word: נִשְׁכָּתוֹ
  choice: தன் அறை
  rationale: இச்சொல் குடியிருப்பு அல்லது அலுவல் பயன்பாட்டுக்குரிய ஓர் அறையைக் குறிக்கலாம்; அதன் பயன்பாட்டைத் தேவையின்றி வரையறுக்காமல் ‘அறை’ என்று மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: חֲנַנְיָה / שֶׁלֶמְיָה / חָנוּן / צָלָף / מְשֻׁלָּם / בֶּרֶכְיָה
  choice: அனனியா / செலேமியா / ஆனூன் / சாலாப் / மெசுல்லாம் / பெரெகியா
  rationale: தனிப்பெயர்கள் அவற்றின் எபிரெய ஒலிப்புக்கு ஏற்றவாறு தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளன.
