  register: நவீன செந்தமிழை அடிப்படையாகக் கொண்ட, பொதுவாசகர்களுக்கு எளிதில் புரியும் கண்ணியமான நடை. கட்டுமானச் சூழலைத் தெளிவாக்க ‘மதிலின்’ சேர்க்கப்பட்டுள்ளது; ‘எதிரே செப்பனிட்டான்’ என்ற அமைப்பு மூலத்தின் சுருக்கத்தைக் காக்கிறது.
