    issue: ‘கட்டடம்வரை’ மற்றும் ‘இருந்த’ என்பவை ‘ஆலயப் பணியாளர்கள் மற்றும் வணிகர்களின் வீடு’ என்ற மூலத் தொடரைத் துல்லியமாகக் காட்டவில்லை.
    rationale: בֵּית என்பது ‘வீடு’; அதன் பின்னுள்ள இரு குழுக்களுடனான உடைமை/தொடர்பைத் தமிழில் ‘...இன் வீடு’ எனக் காட்டுவது சிறந்தது.
  - severity: low
    issue: ‘பழுதுபார்த்தார்’ இரண்டு முறை சொல்லப்பட்டுள்ளது.
    rationale: மூலத்தில் வினை ஒருமுறை மட்டுமே உள்ளது; தொடர்ச்சியான எல்லைக் குறிப்புகளை ஒரே வாக்கியத்தில் அமைப்பது அதிக நெருக்கமும் இயல்பும் தருகிறது.
  - severity: low
