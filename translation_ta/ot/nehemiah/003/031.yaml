- from: அவருக்குப் பிறகு, பொற்கொல்லனின் மகன் மல்கியா பழுதுபார்த்தார். அவர் ஆலயப் பணியாளர்களும் வணிகர்களும் இருந்த கட்டடம்வரை, கணக்கெடுப்பு வாசலுக்கு[a] எதிரே உள்ள இடம்வரை, மூலையின் மேலறைவரை பழுதுபார்த்தார்.
