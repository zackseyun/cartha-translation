base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/031.yaml
  text: After him Malkijah son of the goldsmith repaired as far as the house of the temple servants and the merchants, opposite the Inspection Gate, and as far as the upper room of the corner.
translation:
  language: ta
  text: அவருக்குப் பிறகு, பொற்கொல்லனின் மகனான மல்கியா, ஆலயப் பணியாளர்கள் மற்றும் வணிகர்களின் வீட்டுவரை, கணக்கெடுப்பு வாசலுக்கு[a] எதிரே, மூலையின் மேலறைவரை பழுதுபார்த்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “கணக்கெடுப்பு வாசல்” என்பதற்கான எபிரெயச் சொல் “ஆய்வு வாசல்” அல்லது “அணிவகுப்பு வாசல்” என்றும் பொருள்படலாம்.
    reason: מפקד என்ற சொல்லின் உண்மையான சொற்பொருள் வரம்பையும் இடப்பெயரின் நிச்சயமின்மையையும் பாதுகாக்கிறது.
lexical_decisions:
- source_word: הַצֹּרְפִי
  choice: பொற்கொல்லன்
  rationale: צרף என்பது உலோகத்தைப் புடமிடுபவர் அல்லது நகை செய்பவர் என்பதைக் குறிக்கலாம்; சூழலும் பாரம்பரியப் புரிதலும் கருதி இயல்பான தமிழில் ‘பொற்கொல்லன்’ என வழங்கப்பட்டது.
- source_word: הַנְּתִינִים
  choice: ஆலயப் பணியாளர்கள்
  rationale: நெதினிம்கள் ஆலயச் சேவைக்கென நியமிக்கப்பட்ட குழுவினர்; பெயரை ஒலிபெயர்ப்பதைவிட அவர்களின் பணியைத் தெளிவாகச் சொல்லும் நவீனத் தமிழ் பயன்படுத்தப்பட்டது.
- source_word: שַׁעַר הַמִּפְקָד
  choice: கணக்கெடுப்பு வாசல்
  rationale: מפקד என்பது கணக்கெடுப்பு, ஆய்வு அல்லது அணிவகுப்புக்கான கூடுகை ஆகிய பொருள்களை உடையது; இங்கு இடப்பெயர் தன்மையைப் பேணியபடி ‘கணக்கெடுப்பு வாசல்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: עֲלִיַּת הַפִּנָּה
  choice: மூலையின் மேலறை
  rationale: עֲלִיָּה பொதுவாக மேல் அறை அல்லது மேல்தள அறையைக் குறிக்கிறது; கட்டிடச் சூழலில் நேரடியான பொருள் பேணப்பட்டது.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழில், வரலாற்றுக் கட்டுமானப் பட்டியலுக்கேற்ற கண்ணியமான மற்றும் எளிதில் புரியும் நடையில் மொழிபெயர்க்கப்பட்டது. நீண்ட எபிரெய வாக்கியம் வாசிப்புத் தெளிவுக்காக இரண்டு வாக்கியங்களாகப் பிரிக்கப்பட்டது; எல்லைக் குறிப்புகளின் மீளுரைத்தல் தமிழில் தெளிவுபடுத்தப்பட்டது.
