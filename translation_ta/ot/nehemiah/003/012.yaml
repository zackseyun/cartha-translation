  text: Next to him Shallum son of Hallohesh[a], ruler of half the district of Jerusalem, made repairs—he and his daughters.
translation:
  language: ta
  text: அவனுக்கு அடுத்தபடியாக, எருசலேம் மாவட்டத்தின் பாதிக்குத் தலைவராக இருந்த ஹல்லோகேஷின் மகன் சல்லூமும் அவனுடைய மகள்களும் பழுதுபார்த்தார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அவனுக்குப் பக்கத்தில் … பழுதுபார்த்தார்கள்” என்றும் மொழிபெயர்க்கலாம். எபிரெய மொழிப்பயன்பாடு சொல்லுக்குச் சொல் “அவனுடைய கைக்கு அருகில்” என அமைந்து, முந்தையவர் வேலை செய்த பகுதிக்கு அடுத்த பகுதியைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל יָדוֹ
  choice: அவனுக்கு அடுத்ததாக
  rationale: எபிரெய மொழிப்பயன்பாடு, முந்தையவர் வேலை செய்த சுவர்ப்பகுதியை அடுத்த பகுதியில் நடந்த வேலையைக் குறிக்கிறது; தமிழில் இயல்பாகவும் இடத்தொடர்ச்சியைத் தெளிவாகவும் தெரிவிக்கிறது.
- source_word: הֶחֱזִיק
  choice: பழுதுபார்த்தார்கள்
  rationale: நெகேமியா 3-ன் சூழலில், ஹிஃபில் வடிவிலுள்ள חזק சுவரைச் சீரமைக்கும் அல்லது மீளக் கட்டும் பணியில் ஈடுபட்டதைக் குறிக்கிறது.
- source_word: שַׁלּוּם
  choice: சல்லூம்
  rationale: எபிரெய தனிப்பெயரின் ஒலியைத் தமிழில் நெருக்கமாக எழுத்துப்பெயர்த்தது.
- source_word: בֶּן הַלּוֹחֵשׁ
  choice: அல்லோகேசின் மகன்
  rationale: தந்தையின் பெயரைக் குறிக்கும் தொடராக இருப்பதால், הַלּוֹחֵשׁ என்பதை மொழிபெயர்க்காமல் தமிழில் எழுத்துப்பெயர்த்தது.
- source_word: שַׂר חֲצִי פֶּלֶךְ יְרוּשָׁלִָם
  choice: எருசலேம் மாவட்டத்தின் பாதிப்பகுதிக்குத் தலைவர்
  rationale: שַׂר என்பது தலைவர் அல்லது நிர்வாக அதிகாரியையும், פֶּלֶךְ இச்சூழலில் நிர்வாக மாவட்டத்தையும் குறிக்கிறது; 'பாதிப்பகுதி' என்பது அந்த மாவட்டத்தின் ஒரு பாதிக்கான பொறுப்பை இயல்பாகத் தெரிவிக்கிறது.
- source_word: הוּא וּבְנוֹתָיו
  choice: சல்லூமும் அவனுடைய மகள்களும்
  rationale: மூலத்தில் சல்லூமையும் அவன் மகள்களையும் தனித்துக் குறிப்பிடும் வலியுறுத்தலைத் தெளிவான தமிழில் பாதுகாக்கிறது.
