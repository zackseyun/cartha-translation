source:
  edition: WLC
  text: וַ/יָּ֡קָם אֶלְיָשִׁיב֩ הַ/כֹּהֵ֨ן הַ/גָּד֜וֹל וְ/אֶחָ֣י/ו הַ/כֹּהֲנִ֗ים וַ/יִּבְנוּ֙ אֶת שַׁ֣עַר הַ/צֹּ֔אן הֵ֣מָּה קִדְּשׁ֔וּ/הוּ וַֽ/יַּעֲמִ֖ידוּ דַּלְתֹתָ֑י/ו וְ/עַד מִגְדַּ֤ל הַ/מֵּאָה֙ קִדְּשׁ֔וּ/הוּ עַ֖ד מִגְדַּ֥ל חֲנַנְאֵֽל־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/001.yaml
  text: Then Eliashib the high priest rose up with his brothers the priests[a], and they built the Sheep Gate. They consecrated it and set up its doors; they consecrated it as far as the Tower of the Hundred, as far as the Tower of Hananel.
translation:
  language: ta
  text: அப்போது தலைமைக் குருவான எலியாசீப், குருக்களான தம் சகோதரர்களுடன் எழுந்தார்; அவர்கள் ஆட்டு வாசலைக் கட்டினார்கள். அவர்களே அதைப் புனிதப்படுத்தி[a], அதன் கதவுகளைப் பொருத்தினார்கள். நூற்றுக் கோபுரம் வரையிலும் அனானியேல் கோபுரம் வரையிலும் அதைப் புனிதப்படுத்தினார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அர்ப்பணித்து.” இங்குள்ள எபிரெய வினைச்சொல், ஒன்றைப் புனிதமானதாகப் பிரித்து வைப்பதையோ சிறப்பான பயன்பாட்டிற்காக அர்ப்பணிப்பதையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: எழுந்து
  rationale: செயலின் தொடக்கத்தைக் குறிக்கும் எபிரெய மொழிநடையை இயல்பான தமிழில் தக்கவைக்கிறது; ‘வேலையைத் தொடங்கினார்’ என்று விளக்கமாக்கவில்லை.
- source_word: הַכֹּהֵן הַגָּדוֹל
  choice: தலைமைக் குரு
  rationale: இது தலைமை வகிக்கும் குருவுக்கான நிலையான பதவி; சொற்சொல்லான ‘பெரிய குரு’ என்பதைவிட நவீன தமிழில் தெளிவானது.
- source_word: וְאֶחָיו הַכֹּהֲנִים
  choice: குருக்களான தன் சகோதரர்களுடன்
  rationale: ‘சகோதரர்கள்’ என்ற குடும்ப உறவையும், அவர்கள் குருக்கள் என்ற இணை விளக்கத்தையும் பாதுகாக்கிறது.
- source_word: שַׁעַר הַצֹּאן
  choice: ஆட்டு வாசல்
  rationale: நகர வாசலின் பெயரைச் சுருக்கமாகவும் புரியக்கூடிய வகையிலும் வழங்குகிறது.
- source_word: הֵמָּה
  choice: அவர்களே
  rationale: தனி சுட்டுப்பெயரால் வரும் எபிரெய வலியுறுத்தலைத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: קִדְּשׁוּהוּ
  choice: அதைப் புனிதப்படுத்தி / அதைப் புனிதப்படுத்தினார்கள்
  rationale: குறிப்பிட்ட பயன்பாட்டிற்காகப் புனிதமாகப் பிரித்துவைக்கும் சமயச் சார்பைத் தக்கவைக்கிறது; ‘அர்ப்பணித்தனர்’ என்பதும் சாத்தியம் என அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: וַיַּעֲמִידוּ דַּלְתֹתָיו
  choice: அதன் கதவுகளைப் பொருத்தினார்கள்
  rationale: கதவுகளை உரிய இடத்தில் நிறுவிய செயலை இயல்பான நவீன தமிழில் தெரிவிக்கிறது; நிறுவும் முறையை தேவையின்றி குறிப்பாக்கவில்லை.
- source_word: מִגְדַּל הַמֵּאָה
  choice: நூற்றுக் கோபுரம்
  rationale: எபிரெய இடப்பெயரின் வடிவத்தைத் தமிழில் சுருக்கமாகவும் பெயர்த்தன்மையுடனும் பிரதிபலிக்கிறது.
- source_word: מִגְדַּל חֲנַנְאֵל
  choice: அனானெயேல் கோபுரம்
  rationale: நபர்பெயரை ஒலிபெயர்த்து, கட்டட வகையை தமிழில் மொழிபெயர்க்கிறது.
- source_word: וְעַד ... עַד
  choice: …வரையிலும், அதற்கு அப்பால் …வரையிலும்
  rationale: மீண்டும் வரும் עַד குறிக்கும் எல்லையைத் தக்கவைத்து, இரண்டாவது கோபுரம் வரை நீளும் பரப்பைத் தமிழில் தெளிவாக்குகிறது.
theological_decisions:
- issue: קדשׁ என்பதன் வழிபாட்டு/புனிதப்படுத்தும் பொருள்
  choice: புனிதப்படுத்தினார்கள்
  alternative: அர்ப்பணித்தார்கள்
  rationale: இது வெறும் குடிமைப் பணித் திறப்புவிழா என்று குறுக்காமல், ஒன்றைப் புனிதமாகப் பிரித்துவைக்கும் பொருளைப் பாதுகாக்கிறது; அதே நேரத்தில் ‘அர்ப்பணித்தல்’ என்ற உண்மையான சொற்பொருள் வாய்ப்பை அடிக்குறிப்பு தக்கவைக்கிறது.
translation_notes:
  register: நவீன, கண்ணியமான பொதுத்தமிழ் பயன்படுத்தப்பட்டுள்ளது. பாரம்பரியமாக அறியப்பட்ட பெயர்கள் ஒலிபெயர்க்கப்பட்டுள்ளன. மூலத்தில் உள்ள வலியுறுத்தல் ‘அவர்களே’ எனத் தக்கவைக்கப்பட்டுள்ளது; அடிக்குறிப்பு குறி அது விளக்கும் ‘புனிதப்படுத்தி’ என்ற சொல்லுக்குப் பின்னர் வைக்கப்பட்டுள்ளது.
