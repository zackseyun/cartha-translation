  text: וְ/עַל יָדָ֨/ם הֶחֱזִ֜יק מְלַטְיָ֣ה הַ/גִּבְעֹנִ֗י וְ/יָדוֹן֙ הַ/מֵּרֹ֣נֹתִ֔י אַנְשֵׁ֥י גִבְע֖וֹן וְ/הַ/מִּצְפָּ֑ה לְ/כִסֵּ֕א פַּחַ֖ת עֵ֥בֶר הַ/נָּהָֽר־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/007.yaml
  text: And next to them Melatiah the Gibeonite and Jadon the Meronothite made repairs[a], along with the men of Gibeon and Mizpah, for the seat of the governor of the province Beyond the River.
translation:
  language: ta
  text: அவர்களுக்கு அடுத்ததாக, கிபியோனைச் சேர்ந்த மெலத்தியாவும் மெரோனோத்தைச் சேர்ந்த யாதோனும், கிபியோன் மற்றும் மிஸ்பாவைச் சேர்ந்த ஆண்களும், நதிக்கு அப்பாலுள்ள மாகாணத்தின் ஆளுநரின் இருக்கை வரை[a] பழுதுபார்த்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “நதிக்கு அப்பாலுள்ள பகுதியின் ஆளுநருடைய இருக்கைக்கு.” இச்சொற்றொடர் ஆளுநரின் அதிகாரப்பூர்வ இருக்கை அல்லது வசிப்பிடத்தைக் குறிக்கலாம்; வாய்ப்புக் குறைவாக, அந்தப் பகுதியில் அவருக்கிருந்த நிர்வாக அதிகார எல்லையையும் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל יָדָם
  choice: அவர்களுக்கு அடுத்ததாக
  rationale: நெகேமியா 3-இன் கட்டுமானப் பட்டியலில் இந்த எபிரெய மரபுத்தொடர் அருகாமையைச் சுட்டுகிறது; இத்தமிழாக்கம் இயல்பாக அந்த இடவியல் பொருளைத் தருகிறது.
- source_word: הֶחֱזִיק
  choice: பழுதுபார்த்தார்கள்
  rationale: இவ்வதிகாரத்தின் சூழலில் சுவரின் பகுதிகளைச் செப்பனிடும் அல்லது மீண்டும் கட்டும் பணியில் ஈடுபட்டதைக் குறிக்கிறது.
- source_word: מְלַטְיָה
  choice: மெலத்தியா
  rationale: தனிப்பெயர் தமிழில் ஒலிபெயர்க்கப்பட்டது.
- source_word: הַגִּבְעֹנִי
  choice: கிபியோனியனான
  rationale: மெலத்தியாவின் ஊர் அல்லது மக்கள் சார்பைக் குறிக்கும் எபிரெய அடைமொழியைத் தெளிவாகக் காட்டுகிறது.
- source_word: יָדוֹן
  choice: யாதோன்
  rationale: தனிப்பெயர் எபிரெய உச்சரிப்பை அணுகும் வகையில் ஒலிபெயர்க்கப்பட்டது.
- source_word: הַמֵּרֹנֹתִי
  choice: மெரோனோத்தியனான
  rationale: யாதோனின் ஊர் சார்பைக் குறிக்கும் அடைமொழி தமிழில் பெயரடை வடிவில் தரப்பட்டது.
- source_word: אַנְשֵׁי גִבְעוֹן וְהַמִּצְפָּה
  choice: கிபியோன் மற்றும் மிஸ்பாவைச் சேர்ந்த ஆண்களுடன் சேர்ந்து
  rationale: இரு நகரங்களையும் சேர்ந்த ஆண்கள் பெயரிடப்பட்ட இருவரோடு பணியில் பங்கேற்றதைத் தெளிவுபடுத்துகிறது.
- source_word: לְכִסֵּא
  choice: இருக்கைக்காக
  rationale: לְ என்பதன் நோக்கம் அல்லது தொடர்பைக் காட்டும் திறனைப் பாதுகாக்கிறது; כִּסֵּא என்பதன் அடிப்படைப் பொருளான ‘இருக்கை’ என்பதையும் வைத்து, அதிகாரப்பூர்வ இருப்பிடம் அல்லது அதிகார எல்லை என்ற தெளிவின்மையை அடிக்குறிப்பில் பாதுகாக்கிறது.
- source_word: פַּחַת
  choice: ஆளுநருடைய
  rationale: பாரசீகக் கால நிர்வாகப் பதவியை நவீன வாசகருக்குத் தெளிவான தமிழில் தருகிறது.
- source_word: עֵבֶר הַנָּהָר
  choice: நதிக்கு அப்பாலுள்ள மாகாணம்
  rationale: யூபிராத்துக்கு மேற்கேயிருந்த பாரசீக நிர்வாகப் பிரதேசத்தின் பெயரைப் பொருள் சார்ந்து வழங்குகிறது; ‘மாகாணம்’ என்பது நிர்வாகச் சூழலைத் தெளிவாக்குகிறது.
