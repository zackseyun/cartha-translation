base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/004.yaml
  text: And next to them Meremoth son of Uriah[a], son of Hakkoz, made repairs; and next to them Meshullam son of Berechiah, son of Meshezabel, made repairs[c][b]; and next to them Zadok son of Baana made repairs.
translation:
  language: ta
  text: அவர்களுக்கு அடுத்ததாக[b], அக்கோசின் மகனான உரியாவின் மகன் மெரேமோத் பழுதுபார்த்தார்[a]. அவர்களுக்கு அடுத்ததாக, மெசேசபெயேலின் மகனான பெரெகியாவின் மகன் மெசுல்லாம் பழுதுபார்த்தார். அவர்களுக்கு அடுத்ததாக, பானாவின் மகன் சாதோக் பழுதுபார்த்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘பழுதுபார்த்தார்’ என்பதற்கு ‘வலுப்படுத்தினார்’ என்றும் மொழிபெயர்க்கலாம். இந்த அதிகாரத்தில் வரும் எபிரேய வினைச்சொல், மதிலின் ஒரு பகுதியைச் சீரமைக்கும் பணிக்குப் பயன்படுத்தப்படும் வழக்குச் சொல்லாகும்.
    reason: lexical_alternative
  - marker: b
    text: எபிரேயத்தில் சொல்லுக்குச் சொல், ‘அவர்களுடைய கைக்கு அடுத்து’; இங்கு அது ‘அவர்களுக்கு அடுத்ததாக’ அல்லது ‘அவர்களுக்கு அருகில்’ என்னும் பொருளுடைய மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל יָדָם
  choice: அவர்களுக்கு அடுத்ததாக
  rationale: சொல்லுக்குச் சொல் ‘அவர்களுடைய கைக்கு அருகில்’ என்று இருந்தாலும், நெகேமியா 3-இன் கட்டுமானப் பட்டியலில் இது அடுத்துள்ள பகுதியைக் குறிக்கும் எபிரேய மரபுத்தொடர். இயல்பான தமிழில் இடவியல் தொடர்பைத் தெளிவாகத் தருகிறது.
- source_word: הֶחֱזִיק
  choice: பழுதுபார்த்தார்
  rationale: வினைச்சொல்லின் அடிப்படைப் பொருள் ‘வலுப்படுத்தினார்’; இக்கட்டுமானச் சூழலில் மதிலின் ஒரு பகுதியைச் சீரமைக்கும் பணியைக் குறிக்கிறது. ‘பழுதுபார்த்தார்’ என்பது செயலை இயல்பாகவும் மீளும் பட்டியல் வடிவத்துக்கு ஏற்றவாறும் தெரிவிக்கிறது.
- source_word: בֶּן
  choice: மகன்
  rationale: இங்குள்ள உடனடி வம்ச அடையாளங்களில் ‘மகன்’ என்பதே இயல்பான பொருள்; ‘வழிவந்தவர்’ என்று விரிவாக்குவதற்குச் சூழல் காரணம் இல்லை.
- source_word: מְרֵמוֹת
  choice: மெரேமோத்
  rationale: எபிரேய தனிப்பெயரின் ஒலியமைப்பைத் தமிழில் அண்மையாக எழுத்துப்பெயர்த்துள்ளது.
- source_word: אוּרִיָּה
  choice: உரியா
  rationale: எபிரேய தனிப்பெயரின் வழக்கமான தமிழ் எழுத்துப்பெயர்ப்பு.
- source_word: הַקּוֹץ
  choice: அக்கோஸ்
  rationale: பெயருடன் இணைந்துள்ள எபிரேய குறிப்புச் சுட்டையும் மெய்யொலியையும் தமிழில் இயல்பாகப் பிரதிபலிக்கும் எழுத்துப்பெயர்ப்பு.
- source_word: מְשֻׁלָּם
  choice: மெசுல்லாம்
  rationale: எபிரேய தனிப்பெயரின் மெய் மற்றும் உயிரொலிகளுக்கு அண்மையான தமிழ் எழுத்துப்பெயர்ப்பு.
- source_word: בֶּרֶכְיָה
  choice: பெரெகியா
  rationale: எபிரேய தனிப்பெயரை அதன் ஒலியமைப்புக்கு அண்மையாகத் தமிழில் எழுத்துப்பெயர்த்துள்ளது.
- source_word: מְשֵׁיזַבְאֵל
  choice: மெசேசபெல்
  rationale: எபிரேய பெயரின் ஒலித்தொடரை வாசிக்கத்தக்க நவீன தமிழில் பிரதிபலிக்கிறது.
- source_word: צָדוֹק
  choice: சாதோக்
  rationale: எபிரேய தனிப்பெயரின் நீண்ட முதல் உயிரையும் இறுதி மெய்யையும் பிரதிபலிக்கும் தமிழ் எழுத்துப்பெயர்ப்பு.
- source_word: בַּעֲנָא
  choice: பானா
  rationale: எபிரேய வடிவத்தின் ஒலியமைப்புக்கு அண்மையான தமிழ் எழுத்துப்பெயர்ப்பு.
