base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/026.yaml
  text: The temple servants were living on the Ophel[a], as far as opposite the Water Gate toward the east and the projecting tower.
translation:
  language: ta
  text: தேவாலயப் பணியாளர்கள்[a] ஓபேலில், கிழக்குத் திசையில் உள்ள தண்ணீர் வாசலுக்கும் வெளியே நீண்டிருந்த கோபுரத்துக்கும் எதிரே உள்ள இடம்வரை குடியிருந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மொழியில் ‘நெதினீம்’; தேவாலயப் பணியாளர்களாக இருந்த ஒரு தனிப்பட்ட வகுப்பினர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנְּתִינִים
  choice: தேவாலயப் பணியாளர்கள்
  rationale: நெதினீம் என அறியப்பட்ட, தேவாலயப் பணிகளுக்காக நியமிக்கப்பட்ட பணியாளர் வகுப்பைக் குறிக்கும். பெயரை ஒலிபெயர்ப்பதைவிட அவர்களின் பணியை மொழிபெயர்ப்பது நவீன வாசகர்களுக்குத் தெளிவாக உள்ளது; மூல எபிரெயச் சொல்லை அடிக்குறிப்பு பாதுகாக்கிறது.
- source_word: הָיוּ יֹשְׁבִים
  choice: குடியிருந்தார்கள்
  rationale: היה உடன் வரும் நிகழ்காலப் பங்கேற்புவினை, தொடர்ந்த அல்லது வழக்கமான குடியிருப்பைக் குறிக்கிறது; ‘குடியிருந்தார்கள்’ இதை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: בָּעֹפֶל
  choice: ஓபேலில்
  rationale: עֹפֶל என்பது எருசலேமிலுள்ள உயர்ந்த பகுதியின் இடப்பெயர் அல்லது நிலவியல் பெயர்; எனவே பெயராக ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: עַד נֶגֶד
  choice: எதிரான இடம்வரை
  rationale: עַד எல்லையையும் נֶגֶד ஒரு அடையாள இடத்துக்கு எதிரேயுள்ள நிலைப்பாட்டையும் குறிக்கின்றன; இரு கூறுகளும் தமிழில் பாதுகாக்கப்பட்டுள்ளன.
- source_word: שַׁעַר הַמַּיִם
  choice: தண்ணீர் வாசல்
  rationale: நகர வாசலின் பெயரைக் குறிக்கும் நேரடியான இணைப்புச் சொற்றொடர்; வழக்கமான, தெளிவான தமிழ்ப் பெயராக மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: לַמִּזְרָח
  choice: கிழக்கே உள்ள
  rationale: வாசலின் திசை அல்லது இருப்பிடத்தைச் சுட்டும் சொல்; சூழலில் இயல்பான இடவியல் அடைமொழியாக வழங்கப்பட்டுள்ளது.
- source_word: הַמִּגְדָּל הַיּוֹצֵא
  choice: வெளியே நீண்டிருந்த கோபுரம்
  rationale: יֹצֵא என்பதன் அடிப்படை ‘வெளியே செல்கிறது’ என்ற படிமத்தைப் பாதுகாத்து, கட்டட அமைப்பில் வெளிப்புறமாக நீண்டிருந்த கோபுரத்தைக் குறிக்கும் இயல்பான தமிழாக மொழிபெயர்க்கப்பட்டுள்ளது.
