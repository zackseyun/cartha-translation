base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/034.yaml
  text: And he said before his brothers and the army of Samaria[a], and said, “What are these feeble Jews doing? Will they restore it for themselves? Will they sacrifice? Will they finish in a day? Will they revive the stones from the heaps of dust, though they are burned?”
translation:
  language: ta
  text: அவன் தன் சகோதரர்களுக்கும் சமாரியாவின் படைக்கும் முன்பாக, “பலவீனமான இந்த யூதர்கள் என்ன செய்கிறார்கள்? தங்களுக்காகவே இதைச் சீரமைப்பார்களா?[a] பலி செலுத்துவார்களா? ஒரே நாளில் முடித்துவிடுவார்களா? எரிந்துபோன கற்களைப் புழுதிக் குவியல்களிலிருந்து மீண்டும் உயிர்பெறச் செய்வார்களா?” என்று சொன்னான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத் தொடர் தெளிவற்றது. “தாங்களாகவே இதை மீண்டும் கட்டுவார்களா?” அல்லது இன்னும் நேரடியாக, “தங்களுக்கே இதை விட்டுவிடுவார்களா?” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִפְנֵי אֶחָיו
  choice: தன் சகோதரர்களுக்கும் ... முன்பாக
  rationale: லִפְנֵי என்பது ஒருவரது முன்னிலையில் பேசுவதைக் குறிக்கிறது; אֶחָיו என்பதன் நேரடிப் பொருளான ‘அவனுடைய சகோதரர்கள்’ தக்கவைக்கப்படுகிறது, அரசியல் கூட்டாளிகள் என்ற சாத்தியமான சூழற்பொருளை உரைக்குள் திணிக்கவில்லை.
- source_word: וְחֵיל שֹׁמְרוֹן
  choice: சமாரியாவின் படைக்கும்
  rationale: חֵיל இச்சூழலில் இராணுவப் படையைக் குறிக்கிறது; ‘படை’ இயல்பான நவீனத் தமிழ்.
- source_word: הָאֲמֵלָלִים
  choice: பலவீனமான
  rationale: இச்சொல் இகழ்ச்சியாக அவர்களின் வலுவின்மையையும் பரிதாப நிலையையும் சுட்டுகிறது; ‘பலவீனமான’ கேலியின் மையத்தைத் தெளிவாகக் காக்கிறது.
- source_word: הֲיַעַזְבוּ לָהֶם
  choice: தங்களுக்காகவே இதைச் சீரமைப்பார்களா?
  rationale: עזב வழக்கமாக ‘விட்டுவிடு’ என்று பொருள்படும்; ஆனால் இத்தொடர் கடினமானதும் விவாதத்திற்குரியதும். மதிலை மீளக் கட்டும் சூழலில் ‘தங்களுக்காக இதைச் சீரமைப்பார்களா?’ என்பது சாத்தியமான சூழற்பொருளை வழங்குகிறது; ஐயம் அடிக்குறிப்பில் காக்கப்படுகிறது.
- source_word: הֲיִזְבָּחוּ
  choice: பலி செலுத்துவார்களா?
  rationale: זבח பலியிடுதல் அல்லது பலி செலுத்துதலைக் குறிக்கிறது; தமிழ் வழக்கில் ‘பலி செலுத்துதல்’ தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: הַיְכַלּוּ בַיּוֹם
  choice: ஒரே நாளில் முடித்துவிடுவார்களா?
  rationale: כלה என்பதன் பியேல் வடிவம் ‘முடித்தல், நிறைவேற்றுதல்’ என்று பொருள்; கேலியான வினாவின் வேகத்தையும் ‘ஒரே நாள்’ என்ற வலியுறுத்தலையும் இவ்வடிவம் காக்கிறது.
- source_word: הַיְחַיּוּ אֶת הָאֲבָנִים
  choice: கற்களை ... மீண்டும் உயிர்பெறச் செய்வார்களா?
  rationale: חיה என்பதன் காரணவினை உணர்வு ‘உயிர்ப்பித்தல்’; சேதமடைந்த கற்களை மனிதர்போல் உருவகிக்கும் எபிரெயப் படிமம் மொழிபெயர்ப்பில் தக்கவைக்கப்படுகிறது.
- source_word: מֵעֲרֵמוֹת הֶעָפָר
  choice: புழுதிக் குவியல்களிலிருந்து
  rationale: עֲרֵמוֹת என்பது குவியல்கள்; עָפָר என்பது புழுதி அல்லது மண். ‘புழுதிக் குவியல்கள்’ மூலத்தின் காட்சியை விளக்கவுரை சேர்க்காமல் காக்கிறது.
- source_word: וְהֵמָּה שְׂרוּפוֹת
  choice: எரிந்துபோன
  rationale: பெண்பால் பன்மை வடிவம் கற்களின் தீச்சேதமடைந்த நிலையைக் குறிக்கிறது; தமிழில் பெயருக்கு முன் வரும் ‘எரிந்துபோன’ இயல்பாக அந்த நிலையைக் காட்டுகிறது.
