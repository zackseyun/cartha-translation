translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. இடப்பெயர்கள் தமிழ் ஒலிபெயர்ப்பில் தரப்பட்டுள்ளன; பண்டைய அளவலகு மூலத்தில் தக்கவைக்கப்பட்டு அதன் தோராய நவீன மதிப்பு அடிக்குறிப்பில் தரப்பட்டுள்ளது. கதவு அடைப்புச் சாதனங்களான மַנְעֻלִים மற்றும் בְּרִיחִים முறையே ‘தாழ்ப்பாள்கள்’, ‘குறுக்குச் சட்டங்கள்’ என்று வேறுபடுத்தப்பட்டுள்ளன.
