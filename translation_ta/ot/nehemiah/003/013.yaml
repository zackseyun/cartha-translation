  text: Hanun and the inhabitants of Zanoah repaired the Valley Gate[a]. They built it and set up its doors, its bolts, and its bars, and repaired a thousand cubits of the wall[c][b], as far as the Dung Gate.
translation:
  language: ta
  text: பள்ளத்தாக்கு வாசலை ஹானூனும் சானோவாவில் வாழ்ந்தவர்களும் பழுதுபார்த்தார்கள்.[a] அவர்கள் அதைச் கட்டி, அதன் கதவுகளையும் தாழ்ப்பாள்களையும் குறுக்குச் சட்டங்களையும் நிறுவினார்கள். மேலும், கழிவு வாசல் வரை மதிலின் ஆயிரம் முழ நீளத்தைப் பழுதுபார்த்தார்கள்.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பள்ளத்தாக்கு வாசலை உறுதிப்படுத்தினார்கள்.” இவ்வதிகாரத்தின் மறுகட்டுமானச் சூழலில் எபிரெய வினைச்சொல் “உறுதியாக்குதல்” அல்லது “பழுதுபார்த்தல்” எனப் பொருள்படலாம்.
    reason: lexical_alternative
  - marker: b
    text: ஆயிரம் முழம் என்பது ஏறத்தாழ 457 மீட்டர்.
    reason: cultural_note
  - marker: c
    text: “கழிவு வாசல்” என்பதை “சாணவாயில்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
