base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/017.yaml
  text: 'After him the Levites carried out repairs: Rehum son of Bani[a]. Next to him Hashabiah, ruler of half the district of Keilah[c][b], carried out repairs for his district.'
translation:
  language: ta
  text: அவருக்குப் பின்பு, லேவியரான பானியின் மகன் ரெகூம் பழுதுபார்த்தார். அவருக்கு அடுத்ததாக, கெயிலா மாவட்டத்தின் பாதிக்குத் தலைவரான ஹஷபியா, தன் மாவட்டத்துக்காக[a] பழுதுபார்த்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தனக்கு ஒதுக்கப்பட்ட பகுதிக்காக.” எபிரெயத் தொடர் ஹஷபியாவின் ஆட்சிக்குட்பட்ட மாவட்டத்தையோ, அவருக்குப் பழுதுபார்க்க ஒதுக்கப்பட்ட பகுதியையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחֲרָיו
  choice: அவனுக்குப் பின்பு
  rationale: சுவர் பழுதுபார்ப்போர் பட்டியலில் இது முந்தைய பணியாளரைத் தொடர்ந்து வரும் இடத்தையோ வரிசையையோ குறிக்கிறது.
- source_word: הֶחֱזִיקוּ / הֶחֱזִיק
  choice: பழுதுபார்த்தார்கள் / பழுதுபார்த்தார்
  rationale: חזק என்பதன் ஹிப்ஃபில் வடிவம் சொற்பொருளில் ‘வலுப்படுத்துதல்’ என்றாலும், நெகேமியா 3இல் சுவரைப் பழுதுபார்க்கும் பணியைக் குறிக்கும் வழக்குச் சொல்லாக வருகிறது.
- source_word: הַלְוִיִּם
  choice: லேவியர்கள்
  rationale: மூலத்தின் இன-சமய அடையாளத்தை விளக்கவுரையின்றி இயல்பாகப் பாதுகாக்கும் நிலையான தமிழ் வடிவம்.
- source_word: רְחוּם בֶּן־בָּנִי
  choice: பானியின் மகன் ரெகூம்
  rationale: தமிழின் இயல்பான மரபுப்பெயர் அமைப்பில் தந்தை-மகன் உறவு தெளிவாகத் தரப்பட்டுள்ளது.
- source_word: עַל יָדוֹ
  choice: அவனுக்கு அடுத்ததாக
  rationale: சொல்லர்த்தமாக ‘அவனுடைய கைக்கு அருகில்’; இச்சூழலில் அருகிலுள்ள அடுத்த பணிப்பகுதியைக் குறிக்கும் எபிரெய மரபுத்தொடர்.
- source_word: חֲשַׁבְיָה
  choice: அசபியா
  rationale: எபிரெய பெயரின் ஒலியை நவீன தமிழில் வாசிக்க இயலும் வகையில் எழுத்துப்பெயர்க்கிறது.
- source_word: שַׂר חֲצִי פֶלֶךְ קְעִילָה
  choice: கேயிலா மாவட்டத்தின் ஒரு பாதிக்குத் தலைவரான
  rationale: שַׂר ஆட்சிப் பொறுப்புள்ள தலைவரையும், פֶלֶךְ இந்நிர்வாகச் சூழலில் மாவட்டத்தையும் குறிக்கிறது; ‘ஒரு பாதி’ என்பது பிரிக்கப்பட்ட மாவட்டத்தின் பாதியைத் தெளிவுபடுத்துகிறது.
- source_word: לְפִלְכּוֹ
  choice: தன் மாவட்டத்திற்காக
  rationale: לְ முன்னொட்டு பொறுப்பு, சார்பு அல்லது பணிப்பகுதியைக் குறிக்கலாம்; ‘மாவட்டத்திற்காக’ நிர்வாகப் பொருளைக் காக்கிறது, ஆனால் துல்லியமான இட/ஒதுக்கீட்டு நுணுக்கத்தை முற்றாகத் தீர்மானிக்கவில்லை.
