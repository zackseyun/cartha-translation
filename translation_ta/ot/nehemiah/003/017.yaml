- from: 'அவனுக்குப் பின்பு லேவியர்கள் பழுதுபார்த்தார்கள்: பானியின் மகன் ரெகூம். அவனுக்கு அடுத்ததாக, கேயிலா மாவட்டத்தின் ஒரு பாதிக்குத் தலைவரான அசபியா, தன் மாவட்டத்திற்காக[a] பழுதுபார்த்தார்.'
  to: அவருக்குப் பின்பு, லேவியரான பானியின் மகன் ரெகூம் பழுதுபார்த்தார். அவருக்கு அடுத்ததாக, கெயிலா மாவட்டத்தின் பாதிக்குத் தலைவரான ஹஷபியா, தன் மாவட்டத்துக்காக[a] பழுதுபார்த்தார்.
  rationale: The revision removes an awkward Tamil fragment, corrects the transliteration of Hashabiah, and retains the source's repair-list sequence and the administrative ambiguity concerning the area for which Hashabiah repaired. The unusual Hebrew plural “Levites” is naturally represented by identifying Rehum as a Levite, without adding interpretive detail.
