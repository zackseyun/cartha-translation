translation_notes:
  register: நவீன நிலையான தமிழில், பட்டியல் நடையின் சுருக்கத்தையும் கண்ணியத்தையும் காக்கும் மொழிநடை. மூல எபிரெயத்தின் நிர்வாகச் சொல்லில் உள்ள தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
