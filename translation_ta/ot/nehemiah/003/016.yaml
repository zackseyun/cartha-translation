base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/016.yaml
  text: After him Nehemiah son of Azbuk[a], ruler of half the district of Beth-zur, made repairs as far as opposite the tombs of David, and as far as the pool that was made[b], and as far as the house of the mighty men.
translation:
  language: ta
  text: அவருக்குப் பிறகு[b], பெத்-சூர் மாவட்டத்தின் பாதிக்கு அதிகாரியாக இருந்த அஸ்பூக்கின் மகன் நெகேமியா, தாவீதின் கல்லறைகளுக்கு எதிரேயுள்ள இடம்வரையும், கட்டப்பட்ட குளம்வரையும், வீரர்களின் இல்லம்வரையும்[a] பழுதுபார்த்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “வீரர்களின் இல்லம்” என்பதை “வலிமைமிக்கவர்களின் இல்லம்” என்றும் மொழிபெயர்க்கலாம். இது ஒரு இராணுவக் கட்டிடத்தைக் குறிக்கக்கூடும்; ஆனால் அதன் துல்லியமான அடையாளம் உறுதியாகத் தெரியவில்லை.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அவருக்கு அடுத்ததாக.” பழுதுபார்ப்போர் பட்டியலில் இச்சொற்றொடர் வரிசையைக் குறிக்கலாம்; இடவியல் தொடர்பையும் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחֲרָיו
  choice: அவருக்குப் பிறகு
  rationale: பழுதுபார்ப்போர் பட்டியலில் முந்தைய நபர் அல்லது பணிப்பகுதியைத் தொடர்ந்து வருவதை இயல்பாகக் குறிக்கிறது; இடவியல் பொருளான ‘அவருக்கு அடுத்ததாக’ என்பதும் சாத்தியம்.
- source_word: הֶחֱזִיק
  choice: பழுதுபார்த்தார்
  rationale: நெகேமியா 3-இல் חזק என்பதன் ஹிஃபில் வடிவம் மதில் பகுதிகளைச் சீரமைக்கும் பணிக்கான வழக்குச் சொல்லாக வருகிறது.
- source_word: שַׂר חֲצִי פֶּלֶךְ
  choice: மாவட்டத்தின் ஒரு பாதிக்குத் தலைவர்
  rationale: பாரசீகக் கால நிர்வாகச் சூழலில் שַׂר என்பது ஆட்சிப் பொறுப்பாளர்; פֶּלֶךְ என்பது மாவட்டம். ‘ஒரு பாதி’ என்பது நிர்வாகப் பிரிவைக் குறிக்கிறது.
- source_word: בֵּית צוּר
  choice: பெத்-சூர்
  rationale: இது இடப்பெயர் என்பதால் பொருள் மொழிபெயர்ப்பு செய்யாமல் தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: עַד נֶגֶד קִבְרֵי דָוִיד
  choice: தாவீதின் கல்லறைகளுக்கு எதிரே இருந்த இடம்வரையிலும்
  rationale: נֶגֶד குறிக்கும் ‘எதிரே/முன்பாக’ என்ற இடவியல் உறவைத் தெளிவாக்குகிறது; கல்லறைப் பகுதிக்குள் சென்றதாகப் பொருள் கொள்ளவில்லை.
- source_word: הַבְּרֵכָה הָעֲשׂוּיָה
  choice: கட்டப்பட்ட குளம்
  rationale: ‘உருவாக்கப்பட்ட குளம்’ என்ற எபிரெயச் சொல்லின் செயப்பாட்டு விளைவு உணர்வைப் பாதுகாத்து, அதன் பொறியியல் தன்மையை ஊகிக்காமல் தருகிறது.
- source_word: בֵּית הַגִּבֹּרִים
  choice: வலிமைமிக்க வீரர்களின் இல்லம்
  rationale: גִּבֹּרִים என்பதில் ‘வலிமைமிக்கவர்கள்’ மற்றும் ‘வீரர்கள்’ ஆகிய இரு பொருள் நிழல்களும் உள்ளன; கட்டிடம் படைவீரர் குடியிருப்பா என்பது உறுதியில்லாததால் ‘படைவீடு’ போன்ற விளக்க மொழிபெயர்ப்பு தவிர்க்கப்படுகிறது.
