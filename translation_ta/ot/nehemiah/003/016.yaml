translation_notes:
  register: நவீனத் தரத் தமிழில், வரலாற்றுப் பதிவுக்கேற்ற கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. மூலத்தின் மீளுரைப்பை இயல்பான தமிழில் இரண்டு வாக்கியங்களாக அமைத்து, மூன்று எல்லைக் குறிப்புகளிலும் ‘வரையிலும்’ என்ற ஒத்த அமைப்பு பேணப்பட்டது.
