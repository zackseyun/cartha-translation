    issue: “பாகாத்-மோவாபின் மகன்களில்” is syntactically misleading.
    rationale: The Hebrew begins a genealogical entry, “sons of Pahath-moab,” not “among the sons of Pahath-moab.” This wording obscures the entry’s structure.
  - severity: low
    issue: The spelling “யெசுவா” does not clearly reflect the Hebrew long ē vowel.
    rationale: “யேசுவா” is a closer and more natural Tamil transliteration of יֵשׁוּעַ.
