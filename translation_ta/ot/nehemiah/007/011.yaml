  text: the sons of Pahath-moab[a], of the sons of Jeshua and Joab, 2,818.
translation:
  language: ta
  text: பாகாத்-மோவாபின் மகன்கள்[a], யேசுவா மற்றும் யோவாபின் மகன்வழியினர்—2,818 பேர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பாகாத்-மோவாபின் வழிவந்தவர்கள், யேசுவா மற்றும் யோவாபின் வழிவந்தவர்கள்.” எபிரெயத்தில் “மகன்கள்” என்பது உடனடிப் புதல்வர்களை மட்டுமல்லாமல் விரிந்த குடும்ப வழியினரையும் அடிக்கடி குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: மகன்கள்
  rationale: எபிரெய மரபுத்தொடரை முறையாகப் பேணுகிறது; இந்தக் கணக்கெடுப்புச் சூழலில் இது உடனடிப் புதல்வர்களை மட்டும் அல்லாமல் ஒரு குடும்ப வழியினரையும் குறிக்கலாம்.
- source_word: פַחַת מוֹאָב
  choice: பாகாத்-மோவாப்
  rationale: இது இயற்பெயர் என்பதால் பொருள் மொழிபெயர்ப்பு செய்யாமல் எபிரெய ஒலிப்புக்கு நெருக்கமாக எழுத்துப்பெயர்க்கப்பட்டுள்ளது.
- source_word: לִבְנֵי
  choice: மகன்களில்
  rationale: முன்னர் சொல்லப்பட்ட பாகாத்-மோவாப் குடும்பத்துக்குள் யெசுவா, யோவாப் குடும்ப வழியினரை உட்பிரிவாகச் சுட்டும் ל முன்னொட்டின் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: יֵשׁוּעַ
  choice: யெசுவா
  rationale: மூலத்தில் உள்ள பிற்கால எபிரெயப் பெயரின் குறுகிய வடிவத்தை எழுத்துப்பெயர்க்கிறது; அதை யோசுவா என்ற முழு வடிவமாக மாற்றவில்லை.
- source_word: וְיוֹאָב
  choice: மற்றும் யோவாப்
  rationale: இணைப்புச்சொல்லையும் இயற்பெயரையும் தெளிவாக வழங்குகிறது.
- source_word: אַלְפַּיִם וּשְׁמֹנֶה מֵאוֹת שְׁמֹנָה עָשָׂר
  choice: 2,818 பேர்
  rationale: மூல எண்ணிக்கையைத் துல்லியமாகப் பேணி, கணக்கெடுப்புப் பட்டியலில் எளிதாக வாசிக்க எண்களாக வழங்குகிறது; ‘பேர்’ மனிதர்களின் எண்ணிக்கை என்பதை இயல்பான தமிழில் தெளிவுபடுத்துகிறது.
