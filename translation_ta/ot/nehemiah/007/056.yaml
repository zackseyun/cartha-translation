lexical_decisions:
- source_word: בְּנֵי
  choice: மகன்கள்
  rationale: எபிரெயச் சொல்லின் நேரடிப் பொருளையும் பட்டியலின் சுருக்கமான அமைப்பையும் காக்கிறது; இத்தகைய வம்சப் பட்டியல்களில் இது சந்ததியினர் அல்லது குடும்ப மரபைச் சேர்ந்தவர்கள் என்பதையும் குறிக்கலாம்.
- source_word: נְצִיחַ
  choice: நெத்சீயா
  rationale: மொழிபெயர்க்காமல், எபிரெய ஒலியமைப்பை நவீனத் தமிழில் இயன்றவரை நெருக்கமாக எழுத்துப்பெயர்த்த தனிப்பெயர்.
- source_word: חֲטִיפָא
  choice: ஹதீபா
  rationale: மொழிபெயர்க்காமல், எபிரெய மெய் மற்றும் உயிரொலிகளைத் தமிழில் வாசிக்க இயலும் வகையில் எழுத்துப்பெயர்த்த தனிப்பெயர்.
