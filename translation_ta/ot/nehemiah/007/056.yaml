    text: அல்லது, “நெத்சீயாவின் சந்ததியினர், ஹதீபாவின் சந்ததியினர்.” வம்சப் பட்டியல்களில் “மகன்கள்” என்ற எபிரெய மரபுத்தொடர் பெரும்பாலும் ஒரு குடும்ப மரபினரையோ குலத்தினரையோ குறிக்கிறது.
