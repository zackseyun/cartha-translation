  rationale: אִישׁ என்பதன் பன்மைக் கட்டுநிலை வடிவம் என்பதால், பட்டியலின் மக்கள்தொகைக் கணக்குச் சூழலில் அதன் பாலினக் குறிப்பைத் தக்கவைத்து இயல்பான தமிழில் வழங்கப்பட்டது.
- source_word: קִרְיַת יְעָרִים
  choice: கீரியாத்-யெயாரீம்
  rationale: இடப்பெயர் பொருளாக்கப்படாமல் எபிரெய ஒலிப்புக்கு அண்மையாகத் தமிழில் ஒலிபெயர்க்கப்பட்டது.
- source_word: כְּפִירָה
  choice: கெபீரா
  rationale: இடப்பெயர் எபிரெய மெய்யொலிகளுக்கும் உயிரொலிப்புக்கும் அண்மையாக ஒலிபெயர்க்கப்பட்டது.
- source_word: וּבְאֵרוֹת
  choice: பெயேரோத்
  rationale: இணைப்புச் சொல் தமிழ் பட்டியல் அமைப்பில் ‘ஆகிய’ என்பதன் மூலம் வெளிப்படுத்தப்பட்டு, இடப்பெயர் ஒலிபெயர்க்கப்பட்டது.
- source_word: שְׁבַע מֵאוֹת אַרְבָּעִים וּשְׁלֹשָׁה
  choice: 743 பேர்
  rationale: மக்கள்தொகைப் பட்டியலில் தெளிவுக்காக எண்ணிக்கை இலக்கங்களில் தரப்பட்டு, மனிதர்களைக் குறிக்கும் ‘பேர்’ சேர்க்கப்பட்டது.
