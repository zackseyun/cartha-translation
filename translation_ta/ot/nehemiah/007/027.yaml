  register: நவீன நிலையான தமிழில், வம்சாவளி/கணக்கெடுப்புப் பட்டியலுக்கேற்ற சுருக்கமான, கண்ணியமான நடை. மூலத்தின் ஆண்பால் குறிப்பும் இடப்பெயர் சார்பும் பாதுகாக்கப்பட்டுள்ளன.
