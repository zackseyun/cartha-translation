translation:
  language: ta
  text: அனாதோத்தின் ஆண்கள், நூற்று இருபத்தெட்டுப் பேர்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַנְשֵׁי
  choice: ஆண்கள்
  rationale: אִישׁ என்பதன் construct பன்மை வடிவம்; இந்தக் கணக்கெடுப்புப் பட்டியலில் அடுத்துவரும் ஊரைச் சேர்ந்த ஆண் உறுப்பினர்களைக் குறிக்கிறது. தமிழில் இயல்பாகவும் பாலினத் துல்லியத்துடனும் ‘ஆண்கள்’ என்று வழங்கப்பட்டது.
- source_word: עֲנָתוֹת
  choice: ஆனதோத்
  rationale: இது ஓர் ஊரின் எபிரெயப் பெயர்; மொழிபெயர்க்காமல் தமிழில் ஒலிபெயர்க்கப்பட்டது. ‘ஆனதோத்தின்’ என்ற வேற்றுமை வடிவம் அந்த ஊரைச் சேர்ந்தவர்களைக் குறிக்கிறது.
- source_word: מֵאָה עֶשְׂרִים וּ/שְׁמֹנָה
  choice: நூற்று இருபத்தெட்டு
  rationale: எண்ணின் மொத்த மதிப்பு 128. நவீனத் தமிழில் இயல்பான எண்ணுப் பெயராக வழங்கப்பட்டது; மனிதர்களின் எண்ணிக்கை என்பதைக் காட்ட ‘பேர்’ சேர்க்கப்பட்டது.
