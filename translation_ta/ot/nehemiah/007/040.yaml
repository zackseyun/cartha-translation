  source_fidelity: மூல எபிரேயத்தின் בְּנֵי אִמֵּר (‘இம்மேரின் மகன்கள்/சந்ததியினர்’) மற்றும் எண்ணிக்கை ‘ஆயிரத்து ஐம்பத்திரண்டு’ ஆகிய இரண்டையும் வரைவு துல்லியமாகக் கொண்டுள்ளது. ‘பேர்’ என்பது கணக்கிடப்பட்ட மனிதர்களைக் குறிக்கும் இயல்பான தமிழ்ச் சேர்க்கை; பொருளை மாற்றவில்லை.
  naturalness: '‘இம்மேரின் மகன்கள்: 1,052 பேர்.’ என்பது நவீன நிலையான தமிழில் சுருக்கமாகவும், பெயர்ப்பட்டியல்/கணக்கெடுப்பு நடைக்கு ஏற்றதாகவும் உள்ளது.'
  terminology: ‘இம்மேர்’ என்பது தனிப்பெயருக்கான ஏற்ற தமிழெழுத்துப் பெயர்ப்பு. ‘மகன்கள்’ மூலத்தின் முறையான வம்சப் பட்டியல் சொல்லாட்சியைப் பாதுகாக்கிறது; இவ்வசனத்தில் தனிப்பட்ட இறையியல் சொற்கள் இல்லை.
