lexical_decisions:
- source_word: בְּנֵי
  choice: மகன்கள்
  rationale: குடும்ப அல்லது குலப் பட்டியல் சூழலில் வரும் בֵּן என்பதன் பன்மை இணைப்புவடிவம். மூலத்தின் பட்டியல் நடையைப் பேணுவதற்காக ‘மகன்கள்’ என மொழிபெயர்க்கப்பட்டது; இங்கு அது பெசாயின் குடும்ப வழியினரைக் குறிக்கலாம்.
- source_word: בֵצָי
  choice: பெசாய்
  rationale: எபிரெய தனிப்பெயரின் ஒலியை நவீனத் தமிழில் இயல்பாக எழுத்துப்பெயர்த்த வடிவம்.
- source_word: שְׁלֹשׁ מֵאוֹת עֶשְׂרִים וְאַרְבָּעָה
  choice: முந்நூற்று இருபத்துநான்கு பேர்
  rationale: எபிரெய எண்ணிக்கையான 324-ஐ இயல்பான நவீனத் தமிழில் வழங்குகிறது. மனிதர்களின் எண்ணிக்கை என்பதால் ‘பேர்’ சேர்க்கப்பட்டது.
