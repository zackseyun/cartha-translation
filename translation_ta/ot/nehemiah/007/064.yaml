base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/007/064.yaml
  text: These sought their record among those enrolled by genealogy[a], but it was not found[b], so they were excluded from the priesthood.
translation:
  language: ta
  text: இவர்கள் தங்கள் வம்சாவளிப் பதிவேட்டைத் தேடினார்கள்[a]; ஆனால் அது கிடைக்கவில்லை. ஆகவே, அவர்கள் ஆசாரியர் பதவியிலிருந்து விலக்கப்பட்டார்கள்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “வம்சாவளியின்படி பதிவு செய்யப்பட்டோரிடையேயுள்ள தங்கள் எழுத்துப் பதிவை.” எபிரெயச் சொற்றொடர் வம்சவழியை நிறுவும் எழுத்து ஆவணம் அல்லது பதிவைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “ஆசாரியர் பதவிக்குத் தகுதியற்றவர்களாகக் கருதப்பட்டார்கள்.” இங்குள்ள எபிரெய வினை தீட்டுள்ளவர் அல்லது தகுதியற்றவர் எனக் கருதப்படுதல் என்ற நுணுக்கத்தைக் கொண்டுள்ளது; இச்சூழலில் சரிபார்க்கப்படாத வம்சாவளியால் ஆசாரியர் பதவியிலிருந்து விலக்கப்பட்டதைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה
  choice: இவர்கள்
  rationale: முன்னர் குறிப்பிடப்பட்ட குழுவைச் சுட்டும் பன்மைச் சுட்டுப்பெயர்; தமிழில் இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: בִּקְשׁוּ
  choice: தேடினார்கள்
  rationale: בקשׁ என்பதன் அடிப்படைப் பொருளான தேடுதல் அல்லது நாடுதல் என்பதை நேரடியாகத் தருகிறது.
- source_word: כְתָבָם הַמִּתְיַחְשִׂים
  choice: தங்கள் வம்சாவளியை உறுதிப்படுத்தும் எழுத்துப்பதிவு
  rationale: כְּתָב என்பது எழுதப்பட்ட ஆவணம் அல்லது பதிவு; יחס தொடர்பான சொல் இங்கு வம்சவழியை நிறுவுதல் அல்லது பதிவுசெய்தல் என்பதைக் குறிக்கிறது. இரண்டையும் இணைத்து நிர்வாக-வம்சாவளிச் சூழலைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: וְלֹא נִמְצָא
  choice: ஆனால் அது கிடைக்கவில்லை
  rationale: ஒருமை வினை வடிவத்தின்படி தேடப்பட்ட எழுத்துப்பதிவே கிடைக்கவில்லை என்பதைக் காட்டுகிறது.
- source_word: וַיְגֹאֲלוּ
  choice: விலக்கப்பட்டார்கள்
  rationale: சரிபார்க்கப்பட்ட வம்சாவளி இல்லாததால் அவர்கள் ஆசாரியத் தகுதிக்குப் புறம்பாகக் கருதப்பட்ட நடைமுறை விளைவைத் தெரிவிக்கிறது; ‘தீட்டுப்பட்டார்கள்’ என்ற சொல் ஏற்படுத்தக்கூடிய தவறான சடங்கு சார்ந்த புரிதலை முதன்மை உரையில் தவிர்க்கிறது.
- source_word: מִן הַכְּהֻנָּה
  choice: ஆசாரியப் பணியிலிருந்து
  rationale: כְּהֻנָּה குறிக்கும் ஆசாரியத்துவம் அல்லது ஆசாரிய அலுவலை நவீன தமிழில் இயல்பாகத் தெரிவிக்கிறது.
theological_decisions:
- issue: וַיְגֹאֲלוּ என்பதன் சூழல்சார் பொருள்
  choice: ஆசாரியப் பணியிலிருந்து விலக்கப்பட்டார்கள்
  alternative: ஆசாரியத்துவத்திற்குத் தகுதியற்றவர்களாகக் கருதப்பட்டார்கள் / தீட்டுள்ளவர்களாகக் கருதப்பட்டார்கள்
  rationale: எபிரெய வினை தீட்டுப்படுத்தப்படுதல் அல்லது தகுதியிழத்தல் என்ற நுணுக்கத்தைக் கொண்டிருந்தாலும், இச்சூழலில் உறுதிப்படுத்தப்படாத வம்சாவளியால் ஆசாரியப் பணியிலிருந்து நீக்கப்பட்டதே அதன் விளைவு. முதன்மை உரை அந்த விளைவைத் தருகிறது; மாற்று நுணுக்கம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் வகையிலும் வேதாகம வரலாற்றுரைக்கேற்ற கண்ணியமான நடையிலும் மொழிபெயர்க்கப்பட்டது. நிர்வாக ஆவணம் மற்றும் ஆசாரியத் தகுதி ஆகிய சூழல்சார் கருத்துகள் தெளிவாக்கப்பட்டுள்ளன; மூலத்தின் மாற்றுப் பொருள் அடிக்குறிப்புகளில் பாதுகாக்கப்பட்டுள்ளது.
