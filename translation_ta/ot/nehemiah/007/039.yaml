base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/007/039.yaml
  text: 'The priests: the sons of Jedaiah[a], of the house of Jeshua[b], nine hundred seventy-three.'
translation:
  language: ta
  text: 'ஆசாரியர்கள்: யெதாயாவின் வழிவந்தவர்கள்[a], யேசுவாவின் குடும்பத்தைச் சேர்ந்தவர்கள்[b]—973 பேர்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இங்குள்ள எபிரெயச் சொல் நேரடி மகன்களை மட்டுமல்லாமல், வழித்தோன்றல்களையோ ஒரு குடும்பக் கிளையின் உறுப்பினர்களையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “குடும்பம்” என்பதற்கான எபிரெயச் சொல் எழுத்துப்படி “வீடு”; இங்கு அது குடும்பம் அல்லது வம்சக் குழுவைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכֹּהֲנִים
  choice: ஆசாரியர்கள்
  rationale: திட்டமான பன்மைப் பெயர்ச்சொல்; மக்கள் கணக்குப் பட்டியலில் ஒரு பிரிவை அறிமுகப்படுத்துகிறது.
- source_word: בְּנֵי
  choice: வழிவந்தவர்கள்
  rationale: இவ்வம்சாவளி மற்றும் மக்கள் கணக்குச் சூழலில், உடனடி மகன்களை மட்டுமல்லாமல் வழித்தோன்றலையோ குடும்பக் கிளையின் உறுப்பினர்களையோ குறிக்கிறது; நவீன தமிழில் பொருளை இயல்பாகத் தெரிவிக்கிறது.
- source_word: יְדַעְיָה
  choice: யெதாயா
  rationale: எபிரெயத் தனிப்பெயரின் ஒலிவடிவத்துக்கு நெருக்கமான தமிழ் ஒலிபெயர்ப்பு.
- source_word: לְבֵית יֵשׁוּעַ
  choice: யேசுவாவின் குடும்பத்தைச் சேர்ந்தவர்கள்
  rationale: בַּיִת இங்கு வீடு என்ற கட்டிடத்தை அல்ல, குடும்பம் அல்லது வம்சக் குழுவைக் குறிக்கிறது; לְ இணைப்பு சார்பைச் சுட்டுகிறது.
- source_word: יֵשׁוּעַ
  choice: யேசுவா
  rationale: சிறையிருப்புக்குப் பிந்தைய சூழலில் காணப்படும் எபிரெய வடிவத்தை வேறு பெயர்வடிவமாக மாற்றாமல் ஒலிபெயர்க்கிறது.
- source_word: תְּשַׁע מֵאוֹת שִׁבְעִים וּשְׁלֹשָׁה
  choice: 973 பேர்
  rationale: எண்ணின் மொத்த மதிப்பு 973; பட்டியல் நடையில் இலக்கங்களும் மனிதர்களைக் குறிக்கும் ‘பேர்’ என்பதும் தெளிவாகவும் இயல்பாகவும் உள்ளன.
