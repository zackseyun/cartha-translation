  source_fidelity: 'மூல எபிரெயத்தின் பட்டியல் வடிவம் நன்றாகப் பாதுகாக்கப்பட்டுள்ளது: “ஆசாரியர்கள்,” யெதாயாவின் வம்ச/குடும்பக் குழு, யேசுவாவின் வீட்டார்/குடும்பத்துடனான தொடர்பு, மற்றும் 973 என்ற எண்ணிக்கை அனைத்தும் சரியாக உள்ளன. “வழிவந்தவர்கள்” என்பது בְּנֵי என்பதன் வம்சாவளிப் பொருளை இயல்பாகத் தருகிறது; “குடும்பத்தைச் சேர்ந்தவர்கள்” என்பது לְבֵית יֵשׁוּעַ என்பதிலுள்ள குடும்ப/வம்சக் குழு உணர்வைச் சரியாகக் காட்டுகிறது.'
