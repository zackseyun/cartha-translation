translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் இருக்க ‘வழிவந்தவர்கள்’ மற்றும் ‘பணியாளர்கள்’ பயன்படுத்தப்பட்டுள்ளன. எபிரெய வம்சப் பட்டியலின் மீளுரைத்தல் அமைப்பு பாதுகாக்கப்பட்டுள்ளது. ஆங்கில ஆலோசனை உரையிலுள்ள அடிக்குறிப்பு குறியீடுகள் அவை விளக்கும் சொற்களுடன் பொருந்தாததால் அவற்றின் இடமமைப்பு பின்பற்றப்படவில்லை; எபிரெய மூலத்தின் உண்மையான சொற்பொருள் மாற்று மட்டும் சரியான இடத்தில் குறிக்கப்பட்டுள்ளது.
