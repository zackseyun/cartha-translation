id: NEH.7.57
reference: Nehemiah 7:57
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: בְּנֵ֖י עַבְדֵ֣י שְׁלֹמֹ֑ה בְּנֵי סוֹטַ֥י בְּנֵי סוֹפֶ֖רֶת בְּנֵ֥י פְרִידָֽא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/007/057.yaml
  text: 'The sons of Solomon’s servants: the sons of Sotai[a], the sons of Sophereth[b], the sons of Perida.'
translation:
  language: ta
  text: சாலொமோனின் பணியாளர்களின் வழிவந்தவர்கள்:[a] சோத்தாயின் வழிவந்தவர்கள், சோபெரெத்தின் வழிவந்தவர்கள், பெரிதாவின் வழிவந்தவர்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'சொல்லுக்குச் சொல்: “மகன்கள்.” வம்சப் பட்டியல்களில் இந்த எபிரெயச் சொல் உடனடியாகப் பிறந்த மகன்களை மட்டுமல்லாமல், வழிவந்தவர்களையும் ஒரு குடும்பத்தைச் சேர்ந்தவர்களையும் குறிக்கலாம்.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: வழிவந்தவர்கள்
  rationale: திரும்பிவந்தோரின் வம்சப் பட்டியலில் בְּנֵי என்பது உடனடியாகப் பிறந்த மகன்களை மட்டும் குறிக்காமல், ஒரு குடும்பம் அல்லது வம்சத்தைச் சேர்ந்தவர்களையும் குறிக்கலாம். ‘வழிவந்தவர்கள்’ இந்த விரிவான பொருளை இயல்பான நவீன தமிழில் தெரிவிக்கிறது; எபிரெய உரையில் இச்சொல் மீண்டும் மீண்டும் வருவதால் தமிழிலும் அந்தப் பட்டியல் அமைப்பு பாதுகாக்கப்பட்டுள்ளது.
- source_word: עַבְדֵי
  choice: பணியாளர்கள்
  rationale: עַבְדֵי שְׁלֹמֹה என்பது இங்கு மரபுவழிக் குழுவைக் குறிக்கும் நிலையான பெயராக உள்ளது. ‘பணியாளர்கள்’ என்பது சேவைத் தொடர்பைத் தெளிவாகக் காட்டுகிறது; இச்சூழல் நிரூபிக்காத அடிமை நிலையை அளவுக்கு மீறி வலியுறுத்துவதையும் தவிர்க்கிறது.
- source_word: שְׁלֹמֹה
  choice: சாலொமோன்
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் பரவலாக அறியப்பட்ட வடிவில் தனிப்பெயர் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: סוֹטַי
  choice: சோத்தாய்
  rationale: மசோரா உயிர்க்குறிப்புகளுக்கு ஏற்ப தனிப்பெயர் தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: סוֹפֶרֶת
  choice: சோபெரெத்
  rationale: இது இங்கு பொதுப்பெயர் அல்ல, குடும்பப் பெயர்; ஆகவே அதன் சாத்தியமான சொற்பிறப்புப் பொருளை மொழிபெயர்க்காமல் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: פְרִידָא
  choice: பெரிதா
  rationale: மசோரா உரையின் உச்சரிப்பை அணுகும் வகையில் தனிப்பெயர் தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளது.
