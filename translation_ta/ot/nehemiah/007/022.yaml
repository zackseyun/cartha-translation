  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי
  choice: மகன்கள்
  rationale: இது בֵּן என்பதன் பன்மை இணைநிலை வடிவம். வம்சப் பதிவுச் சூழலில் குடும்பம் அல்லது வழிவந்தோர் குழுவைக் குறிக்கலாம்; எபிரெய வடிவத்தை நேரடியாகப் பேணுவதற்காக ‘மகன்கள்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: חָשֻׁם
  choice: ஆசூம்
  rationale: இது ஒரு தனிப்பெயர் அல்லது குடும்பப்பெயர். எபிரெய உச்சரிப்பை அணுகும் வகையில் தமிழில் ஒலிபெயர்க்கப்பட்டது.
- source_word: שְׁלֹשׁ מֵאוֹת עֶשְׂרִים וּשְׁמֹנָה
  choice: முந்நூற்று இருபத்தெட்டு
  rationale: ‘மூன்று நூறுகள், இருபது, எட்டு’ என்ற எபிரெய எண்ணிக்கையை இயல்பான நவீனத் தமிழில் துல்லியமாகத் தருகிறது. நபர்களின் எண்ணிக்கை என்பதால் ‘பேர்’ சேர்க்கப்பட்டது.
