base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/007/061.yaml
  text: And these were the ones who came up from Tel-melah[a], Tel-harsha, Kerub, Addon, and Immer, but they were not able to declare their fathers’ houses or their offspring[c][b], whether they were from Israel.
translation:
  language: ta
  text: தெல்-மெலாக், தெல்-ஹர்ஷா, கெரூப், அதோன்[a], இம்மேர் ஆகியோரிடமிருந்து மேலேறி வந்தவர்கள் இவர்கள். ஆனால், தங்கள் தந்தைவழிக் குடும்பத்தையோ[b] தங்கள் சந்ததியையோ, தாங்கள் இஸ்ரவேலைச் சேர்ந்தவர்களா[c] என்பதையோ அவர்களால் தெரிவிக்க முடியவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எஸ்றா 2:59-ல் இங்குள்ள ‘அதோன்’ என்பதற்குப் பதிலாக ‘அத்தான்’ என்ற பெயர்வடிவம் உள்ளது.
    reason: textual_variant
  - marker: b
    text: 'நேரடி மொழிபெயர்ப்பு: ‘தங்கள் தந்தையரின் வீடு’; இது தந்தைவழிக் குடும்பத்தையோ மூதாதையர் குடும்பத்தையோ குறிக்கும் எபிரெய மரபுத்தொடர்.'
    reason: lexical_alternative
  - marker: c
    text: அல்லது, ‘தாங்கள் இஸ்ரவேலர்களா.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה הָעוֹלִים
  choice: மேலேறி வந்தவர்கள் இவர்களே
  rationale: பிந்தைய சிறைவாசச் சூழலில் עָלָה திரும்பிவருதலைக் குறித்தாலும், மூலத்தின் ‘மேலேறுதல்’ உருவகத்தை இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: מִתֵּל מֶלַח תֵּל חַרְשָׁא כְּרוּב אַדּוֹן וְאִמֵּר
  choice: தெல்-மெலாக், தெல்-அர்சா, கேரூப், அத்தோன், இம்மேர் ஆகிய இடங்களிலிருந்து
  rationale: பெயர்கள் எபிரெய மெய்யெழுத்து வடிவத்தை அடிப்படையாகக் கொண்டு தமிழில் ஒலிபெயர்க்கப்பட்டன; பட்டியலின் சூழலுக்கு ஏற்ப இவை இடப்பெயர்கள் எனத் தெளிவுபடுத்தப்பட்டது.
- source_word: וְלֹא יָכְלוּ לְהַגִּיד
  choice: தெரிவிக்கவோ ... சொல்லவோ அவர்களால் முடியவில்லை
  rationale: הִגִּיד என்பதன் ‘தெரிவித்தல்/அறிவித்தல்’ பொருளைத் தக்கவைக்கிறது; ‘நிரூபிக்க’ என்று மொழிபெயர்த்து சட்டப்பூர்வமான பொருளை தேவையின்றி வலுப்படுத்தவில்லை.
- source_word: בֵּית אֲבוֹתָם
  choice: தங்கள் தந்தைவழிக் குடும்பம்
  rationale: ‘தங்கள் தந்தையரின் வீடு’ என்ற எபிரெய மரபுத்தொடரின் வம்ச-குடும்பப் பொருளை நவீன தமிழில் இயல்பாக வழங்குகிறது.
- source_word: וְזַרְעָם
  choice: தங்கள் வம்சம்
  rationale: זֶרַע என்பதன் அடிப்படைப் பொருள் ‘விதை’; இங்கு குடும்பப் பட்டியல் சூழலில் அது வம்சவழி அல்லது சந்ததித் தொடர்பைக் குறிக்கிறது. ‘வம்சம்’ பின்னோக்கிய மரபுறவையும் உள்ளடக்குவதால் சூழலுக்கு ஏற்றது.
- source_word: אִם מִיִּשְׂרָאֵל הֵם
  choice: தாங்கள் இஸ்ரவேலைச் சேர்ந்தவர்களா
  rationale: அவர்கள் இஸ்ரவேல் வம்சத்தைச் சேர்ந்தவர்களா என்ற ஐயத்தை, ‘இஸ்ரவேலர்கள்’ எனச் சுருக்காமல் மூலத்தின் அமைப்புக்கு அருகில் வழங்குகிறது.
theological_decisions:
- issue: இஸ்ரவேலுடன் உள்ள உறவின் தன்மை
  choice: ‘இஸ்ரவேலைச் சேர்ந்தவர்களா’ என்று திறந்த வடிவில் மொழிபெயர்க்கப்பட்டது.
  alternative: ‘இஸ்ரவேலர்கள் தானா’ அல்லது ‘இஸ்ரவேல் வம்சத்தினரா’
  rationale: மூலத்தின் מִן (‘இருந்து/சேர்ந்த’) என்ற சொல்லமைப்பு இன, தேசிய, அல்லது உடன்படிக்கை அடையாளங்களில் ஒன்றை மட்டும் திட்டவட்டமாகத் தேர்ந்தெடுக்கவில்லை; அந்தத் திறந்த தன்மை பாதுகாக்கப்பட்டது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பட்டியல் நடைக்கு ஏற்ற கண்ணியமான மொழிநடை பயன்படுத்தப்பட்டுள்ளது. ‘மேலேறி வந்தவர்கள்’ மூலத்தின் இடவியல்/திரும்பிவருதல் உருவகத்தைத் தக்கவைக்கிறது. நீண்ட எபிரெய வாக்கியத்தை தமிழில் தெளிவாக வாசிக்க இரண்டு வாக்கியங்களாக அமைத்தாலும், அதன் கருத்திணைப்பு பாதுகாக்கப்பட்டுள்ளது.
