  yaml_path: translation/ot/nehemiah/007/059.yaml
  text: the sons of Shephatiah[a], the sons of Hattil, the sons of Pochereth-hazzebaim[b], the sons of Amon.
translation:
  language: ta
  text: செப்பத்தியாவின் சந்ததியினர்[a], ஹத்தீலின் சந்ததியினர், போகெரேத்-ஹச்செபாயீமின் சந்ததியினர்[b], ஆமோனின் சந்ததியினர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இந்த வசனம் முழுவதிலும் “சந்ததியினர்” என்பதற்குப் பதிலாக “மகன்கள்” என்றும் மொழிபெயர்க்கலாம். எபிரெயத்தில் “மகன்கள்” என்பது வம்சப் பட்டியல்களில் ஒரு குடும்ப மரபைச் சேர்ந்தவர்களையும் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “போகெரேத்-ஹச்செபாயீம்” என்பதை “செபாயீமைச் சேர்ந்த போகெரேத்” என்றும் புரிந்துகொள்ளலாம்; இங்கு எபிரெய வடிவம் தனிப்பெயராக ஒலிபெயர்க்கப்பட்டுள்ளது.
    reason: alternative_reading
lexical_decisions:
- source_word: בְּנֵי
  choice: வழிவந்தவர்கள்
  rationale: வம்சப் பட்டியல் சூழலில், בְּנֵי என்பது உடனடிப் புதல்வர்களை மட்டுமல்லாமல் ஒரு குடும்ப மரபைச் சேர்ந்த வழித்தோன்றல்களையும் குறிக்கலாம். இயல்பான நவீன தமிழில் இந்தப் பொருளைத் தெளிவாக வழங்குகிறது.
- source_word: שְׁפַטְיָה
  choice: செப்பத்தியா
  rationale: எபிரெய தனிப்பெயரின் ஒலியைத் தமிழில் இயன்றவரை பிரதிபலிக்கும் ஒலிபெயர்ப்பு.
- source_word: חַטִּיל
  choice: அத்தீல்
  rationale: இது பட்டியலில் வரும் தனிப்பெயர் அல்லது குடும்பப்பெயர் என்பதால் பொருள் மொழிபெயர்ப்பு செய்யாமல் ஒலிபெயர்க்கப்பட்டுள்ளது; தொடக்க ח ஒலி தமிழில் இயல்பாக 'அ' என வழங்கப்பட்டுள்ளது.
- source_word: פֹּכֶרֶת הַצְּבָיִים
  choice: போகெரேத்-அச்செபாயீம்
  rationale: இரு எபிரெயக் கூறுகளும் இணைந்த குடும்பப்பெயராகச் செயல்படுவதால் ஒலிபெயர்த்து இணைப்புக்குறியுடன் வழங்கப்பட்டுள்ளது; அதன் அமைப்பு குறித்த மாற்றுப் புரிதல் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: אָמֽוֹן
  choice: ஆமோன்
  rationale: இங்கு பொதுப்பெயரோ இறையியல் சொல்லோ அல்லாமல் குடும்ப அடையாளமாக வரும் தனிப்பெயர்; ஆகவே ஒலிபெயர்க்கப்பட்டுள்ளது.
