lexical_decisions:
- source_word: הַמְשֹׁרְרִים
  choice: பாடகர்கள்
  rationale: שׁיר என்ற வேரிலிருந்து வந்த இப்பெயரெச்ச வடிவம் பாடுகிறவர்களைக் குறிக்கிறது. பட்டியல் சூழலில் “பாடகர்கள்” என்பது இயல்பானதும் துல்லியமானதும் ஆகும்.
- source_word: בְּנֵי
  choice: மகன்கள்
  rationale: வம்சம் அல்லது குழுவைக் குறிக்கும் பதிவுகளில் בְּנֵי என்பதன் முறையான சொற்றொடரை “மகன்கள்” எனப் பேணுகிறது; இது நேரடி மகன்களை மட்டுமல்லாமல் சந்ததியினரையோ ஒரு மரபுக் குழுவின் உறுப்பினர்களையோ குறிக்கக்கூடும் என்பதால் அடிக்குறிப்பு சேர்க்கப்பட்டுள்ளது.
- source_word: אָסָף
  choice: ஆசாப்
  rationale: தனிப்பெயர் நவீனத் தமிழில் இயல்பாக ஒலிபெயர்க்கப்பட்டுள்ளது; வேற்றுமை உருபுடன் முதன்மை உரையில் “ஆசாப்பின்” என வருகிறது.
- source_word: מֵאָה אַרְבָּעִים וּשְׁמֹנָה
  choice: நூற்று நாற்பத்தெட்டு
  rationale: எபிரெய எண்ணிக்கையைத் தெளிவான, வழக்கமான தமிழ் எண்ணுப்பெயராக நேரடியாக வழங்குகிறது.
