id: NEH.7.63
reference: Nehemiah 7:63
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וּ/מִן הַ/כֹּ֣הֲנִ֔ים בְּנֵ֥י חֳבַיָּ֖ה בְּנֵ֣י הַקּ֑וֹץ בְּנֵ֣י בַרְזִלַּ֗י אֲשֶׁ֣ר לָ֠קַח מִ/בְּנ֞וֹת בַּרְזִלַּ֤י הַ/גִּלְעָדִי֙ אִשָּׁ֔ה וַ/יִּקָּרֵ֖א עַל שְׁמָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/007/063.yaml
  text: 'And from the priests: the sons of Hobaiah[a], the sons of Hakkoz, the sons of Barzillai, who had taken a wife from the daughters of Barzillai the Gileadite and was called by their name.'
translation:
  language: ta
  text: 'ஆசாரியர்களில்: ஹொபாயாவின் வழிவந்தவர்கள், ஹக்கோசின் வழிவந்தவர்கள், பர்சில்லாயின் வழிவந்தவர்கள். இந்தப் பர்சில்லாய் கிலேயாத்தியனான பர்சில்லாயின் மகள்களில் ஒருத்தியை மனைவியாகக் கொண்டிருந்தான்; அவர்களுடைய பெயரால் அழைக்கப்பட்டான்.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּמִן הַכֹּהֲנִים
  choice: ஆசாரியர்களில்
  rationale: מִן என்பதன் பகுதிப்பொருளைத் தக்கவைத்து, பட்டியலில் ஆசாரியக் குடும்பங்களை அறிமுகப்படுத்தும் இயல்பான தமிழ் வடிவம்.
- source_word: בְּנֵי
  choice: வழிவந்தவர்கள்
  rationale: இந்தக் குடிவழிப் பதிவில் בְּנֵי என்பது நேரடியான மகன்களை மட்டும் அல்லாமல் குடும்ப வழியினரையும் குறிக்கிறது; ஆகவே நவீனத் தமிழில் பொருள் தெளிவாக இருக்க இவ்வாறு மொழிபெயர்க்கப்பட்டது.
- source_word: חֳבַיָּה
  choice: ஒபாயா
  rationale: எபிரேயப் பெயரின் ஒலிப்பைத் தமிழில் இயன்றவரை அணுக்கமாகக் காட்டும் எழுத்துப்பெயர்ப்பு.
- source_word: הַקּוֹץ
  choice: அக்கோஸ்
  rationale: குடும்பப் பெயருடன் இணைந்துள்ள எபிரேய வரையறைச் சுட்டையும் பெயரின் ஒலிப்பையும் பிரதிபலிக்கும் தமிழ் எழுத்துப்பெயர்ப்பு.
- source_word: בַרְזִלַּי
  choice: பர்சில்லாய்
  rationale: குடும்பப் பெயருக்கும் கிலேயாத்திய மூதாதையின் பெயருக்கும் ஒரே எழுத்துப்பெயர்ப்பு தொடர்ந்து பயன்படுத்தப்பட்டது.
- source_word: אֲשֶׁר לָקַח מִבְּנוֹת ... אִשָּׁה
  choice: மகள்களில் ஒருத்தியை மனைவியாகக் கொண்டதால்
  rationale: எபிரேய மரபுத்தொடர் அந்தக் குடும்பத்தைச் சேர்ந்த ஒரு பெண்ணை மணந்ததைக் குறிக்கிறது. காரணவினைத் தொடர்பு அடுத்துள்ள பெயரிடுதலுடன் தமிழில் இயல்பாக இணைக்கப்பட்டது.
- source_word: הַגִּלְעָדִי
  choice: கிலேயாத்தியனான
  rationale: பர்சில்லாயின் பிரதேச அடையாளத்தைக் குறிக்கும் இன/இடப்பெயரடை வடிவம்.
- source_word: וַיִּקָּרֵא עַל שְׁמָם
  choice: அவர்களுடைய பெயரால் அழைக்கப்பட்டான்
  rationale: நிபால் வினையின் செயப்பாட்டு உணர்வையும், பன்மை உருபான ‘அவர்களுடைய’ என்பதையும் தக்கவைக்கிறது; திருமணம் செய்த குடும்பத்தின் பெயரை அவன் பெற்றான் என்பது சூழலில் விளங்குகிறது.
