translation_notes:
  register: குடிவழிப் பட்டியலுக்கேற்ற மதிப்பும் செறிவும் கொண்ட நவீனத் தமிழ் பயன்படுத்தப்பட்டுள்ளது. ஒரே பெயருடைய இரு பர்சில்லாய்களை வாசகர் வேறுபடுத்திக் கொள்ள ‘இந்தப் பர்சில்லாய்’ என வாக்கியம் பிரிக்கப்பட்டுள்ளது; இது மூலத்தின் உறவுத்தொடரையே தெளிவாக்குகிறது, புதிய தகவலைச் சேர்ப்பதில்லை.
