  text: The sons of Binnui, six hundred forty-eight.
translation:
  language: ta
  text: 'பின்னூயின் மகன்கள்: அறுநூற்று நாற்பத்தெட்டுப் பேர்.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי
  choice: மகன்கள்
  rationale: மக்கள்தொகைக் கணக்கையும் குலப்பட்டியலையும் சார்ந்த இச்சூழலில், எபிரெயச் சொல்லின் நேரடியான ‘மகன்கள்’ என்ற பொருளையும் மரபுவழிக் குடும்பக் குழுவைக் குறிக்கும் பயன்பாட்டையும் இது தக்கவைக்கிறது.
- source_word: בִנּוּי
  choice: பின்னூய்
  rationale: இது ஒரு நபர் அல்லது குடும்பப் பெயர்; எனவே பொருள் மொழிபெயர்ப்பு செய்யாமல் எபிரெய உச்சரிப்புக்கு அண்மையாக ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: שֵׁשׁ מֵאוֹת אַרְבָּעִים וּשְׁמֹנָה
  choice: அறுநூற்று நாற்பத்தெட்டு
  rationale: எபிரெய எண்ணமைப்பு 600 + 40 + 8 எனத் தெளிவாக 648-ஐக் குறிக்கிறது; தமிழ் உரைநடைக்கு இயல்பாக எண்ணைச் சொற்களால் வழங்குகிறது.
