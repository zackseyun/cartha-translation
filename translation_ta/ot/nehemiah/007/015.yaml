translation_notes:
  register: நவீன தரநிலைத் தமிழில், பட்டியல் நடைக்கு ஏற்ற சுருக்கமான மற்றும் கண்ணியமான வடிவம். எண்ணிக்கை மனிதர்களைக் குறிக்கிறது என்பதை இயல்பாகத் தெளிவுபடுத்த ‘பேர்’ சேர்க்கப்பட்டுள்ளது; இருபுள்ளி பட்டியல் சூத்திரத்தை வாசிக்க எளிதாக்குகிறது.
