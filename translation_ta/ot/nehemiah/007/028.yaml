lexical_decisions:
- source_word: אַנְשֵׁי
  choice: சேர்ந்த ஆண்கள்
  rationale: אִישׁ என்பதன் construct பன்மை வடிவம். கணக்கெடுப்புப் பட்டியலின் சூழலில் ஓர் இடத்தைச் சேர்ந்த ஆண் உறுப்பினர்களைக் குறிக்கிறது; எபிரேயத்தின் ஆண்பால் குறிப்பையும் இயல்பான தமிழையும் காக்கிறது.
- source_word: בֵית עַזְמָוֶת
  choice: பெத்-அஸ்மாவேத்
  rationale: இந்தத் திரும்பிவந்தோர் பட்டியலில் இது ஓர் இடப்பெயராகச் செயல்படுகிறது. எனவே சொல்லுக்குச் சொல் மொழிபெயர்க்காமல், கூட்டு இடப்பெயராக ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: אַרְבָּעִים וּשְׁנָיִם
  choice: நாற்பத்திரண்டு பேர்
  rationale: எபிரேய எண்ணிக்கையான ‘நாற்பதும் இரண்டும்’ என்பதைத் தெளிவான நவீனத் தமிழில் தருகிறது; மனிதர்களின் எண்ணிக்கை என்பதால் ‘பேர்’ சேர்க்கப்பட்டுள்ளது.
