translation_notes:
  register: நவீன நிலையான தமிழில், கண்ணியமான ஆனால் எளிதில் புரியும் பட்டியல் நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘புத்திரர்’ என்ற பழைய நடைக்குப் பதிலாக, குல அல்லது குடும்ப வழியைக் குறிக்கும் ‘சந்ததியினர்’ பயன்படுத்தப்பட்டுள்ளது. பெயர்கள் எபிரெய வடிவங்களுக்கு நெருக்கமாகத் தமிழ் எழுத்துகளில் ஒலிபெயர்க்கப்பட்டுள்ளன.
