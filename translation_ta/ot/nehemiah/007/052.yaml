  text: the sons of Besai[a], the sons of Meunim[c][b], the sons of Nephushesim.
translation:
  language: ta
  text: பெசாயின்[a] சந்ததியினர், மெவுனீமின்[b] சந்ததியினர், நெபூஷெசீமின்[c] சந்ததியினர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “பெஸ்ஸாய்” என்றும் எழுதலாம். ஒலிபெயர்ப்பு முறைகளிலும் இணையான பிற உரை மரபுகளுடனான ஒப்பீட்டிலும் உள்ள வேறுபாடுகளால் பெயரின் எழுத்தாக்கம் மாறுகிறது.
    reason: lexical_alternative
  - marker: b
    text: இதைக் குடும்பப்பெயரின் ஒலிபெயர்ப்பாக அல்லாமல் இன அல்லது குழுப் பெயராகப் புரிந்துகொண்டால், “மெவுனியர்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: சில மொழிபெயர்ப்பு மரபுகளில் “நெபூசீம்” என்று வருகிறது; இங்குள்ள எபிரெய எழுத்து வடிவத்தை “நெபூஷெசீம்” என்பது இன்னும் நேரடியாகப் பிரதிபலிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: சந்ததியினர்
  rationale: திரும்பிவந்தோரின் குலப்பட்டியலில் இச்சொல் ஒருவரின் நேரடி மகன்களை மட்டும் அல்லாமல் அவரது குடும்ப வழியைச் சேர்ந்தவர்களையும் குறிக்கலாம். எனவே இயல்பான நவீன தமிழில் ‘சந்ததியினர்’ என்று வழங்கப்பட்டுள்ளது; மூலத்தின் திரும்பத் திரும்ப வரும் பட்டியல் அமைப்பும் காக்கப்பட்டுள்ளது.
- source_word: בֵסַי
  choice: பெசாய்
  rationale: இது ஒரு சிறப்புப்பெயர் என்பதால் மொழிபெயர்க்காமல் எபிரெய ஒலிப்புக்கு நெருக்கமாக ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: מְעוּנִים
  choice: மெஊனீம்
  rationale: இவ்வடிவம் ஓர் இனக்குழுவைக் குறிக்கக்கூடும்; எனினும் இப்பட்டியலில் பெயராகச் செயல்படுவதால் அதன் பொருளைத் தீர்மானிக்காமல் ஒலிபெயர்ப்பு பயன்படுத்தப்பட்டுள்ளது.
- source_word: נפושסים
  choice: நெபூஷெசீம்
  rationale: WLC-யில் தரப்பட்டுள்ள மெய்யெழுத்து வடிவத்தை நெருக்கமாகப் பிரதிபலிக்கும் ஒலிபெயர்ப்பு தேர்ந்தெடுக்கப்பட்டுள்ளது. இணையான பட்டியல் மரபுகளால் வேறு எழுத்தாக்கங்களும் காணப்படுகின்றன.
