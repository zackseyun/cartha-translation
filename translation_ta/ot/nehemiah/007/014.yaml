  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי
  choice: வழிவந்தவர்கள்
  rationale: குடும்பக் கணக்குப் பட்டியலில் இது நேரடி மகன்களை மட்டும் அல்லாமல், சக்காயின் குடும்பத்தைச் சேர்ந்த சந்ததியினரையும் குறிக்கிறது. எனவே நவீனத் தமிழில் இயல்பாகவும் பொருள் துல்லியமாகவும் ‘வழிவந்தவர்கள்’ என்று மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: זַכָּי
  choice: சக்காய்
  rationale: எபிரெயத் தனிப்பெயரின் ஒலிப்பைத் தமிழில் நெருக்கமாகப் பெயர்த்தெழுதுகிறது.
- source_word: שְׁבַע מֵאוֹת וְשִׁשִּׁים
  choice: எழுநூற்று அறுபது
  rationale: எபிரெய எண்ணுத் தொடரைத் தெளிவான, இயல்பான தமிழ்ச் சொற்களால் வழங்குகிறது; ‘பேர்’ என்பது எண்ணப்படுவது மனிதர்கள் என்பதைத் தமிழில் தெளிவாக்குகிறது.
