  verdict: revise
  source_fidelity: The number is rendered accurately as 760, and the familial-list sense of בְּנֵי is correctly understood as broader than only literal sons. However, ‘வழிவந்தவர்கள்’ is somewhat less precise for the recurrent genealogical/census formula than ‘சந்ததியினர்.’
