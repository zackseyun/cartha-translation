translation_notes:
  register: நவீன நிலையான தமிழில், மக்கள் கணக்குப் பட்டியலுக்கேற்ற சுருக்கமான மற்றும் கண்ணியமான நடை. ‘சக்காயின் மகன்கள்’ என்ற வடிவநெருக்கமான மொழிபெயர்ப்புக்குப் பதிலாக, இச்சூழலில் குடும்ப வழியினரைக் குறிக்கும் பொருளை இயல்பாக வெளிப்படுத்த ‘சக்காயின் வழிவந்தவர்கள்’ பயன்படுத்தப்பட்டுள்ளது.
