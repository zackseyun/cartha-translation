lexical_decisions:
- source_word: בְּנֵי
  choice: மகன்கள்
  rationale: בֵּן என்பதன் பன்மைக் கட்டுநிலை வடிவம். குடும்பம் அல்லது குலத்தைப் பட்டியலிடும் இச்சூழலில் எபிரெயச் சொல்லை நேரடியாகப் பிரதிபலிக்கிறது; இது உடனடிப் பிறந்த மகன்களை மட்டும் அல்லாமல் சந்ததியினரையும் குறிக்கலாம் என்பதால் அடிக்குறிப்பு சேர்க்கப்பட்டுள்ளது.
- source_word: פַרְעֹשׁ
  choice: பாரோஷ்
  rationale: இது ஒரு நபரின் பெயர்; எபிரெய உச்சரிப்பை அணுகும் வகையில் தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: אַלְפַּיִם מֵאָה וְשִׁבְעִים וּשְׁנָיִם
  choice: 2,172 பேர்
  rationale: எபிரெய எண்ணடுக்கின் மொத்தம் 2,172. கணக்குப் பட்டியலின் வாசிப்புத் தெளிவுக்காக இலக்கங்களில் தரப்பட்டுள்ளது; மனிதர்களின் எண்ணிக்கை என்பதை இயல்பாகக் காட்ட ‘பேர்’ சேர்க்கப்பட்டுள்ளது.
