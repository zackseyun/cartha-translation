  register: நவீனத் தரத் தமிழில், கணக்குப் பதிவுக்கேற்ற சுருக்கமான மற்றும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் ‘மகன்கள்’ என்ற சொல்லமைப்பு முதன்மை உரையில் காக்கப்பட்டு, அதன் விரிவான குலப் பொருள் அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது.
