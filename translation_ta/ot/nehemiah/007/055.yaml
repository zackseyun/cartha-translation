  text: the sons of Barkos[a], the sons of Sisera, the sons of Temah.
translation:
  language: ta
  text: பர்கோசின் மகன்கள்; சிசெராவின் மகன்கள்; தேமாஹின்[a] மகன்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தாமாஹ்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: மகன்கள்
  rationale: இது בֵּן என்பதன் பன்மை இணைநிலை வடிவம். வம்ச அல்லது குடும்பப் பட்டியலில் குடும்ப வழியைச் சுட்டக்கூடியதாயினும், எபிரெய மூலத்தின் மீளும் அமைப்பையும் நேரடி சொல்லாட்சியையும் காக்க ‘மகன்கள்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: בַרְקוֹס
  choice: பர்கோஸ்
  rationale: மொழிபெயர்க்கப்படாமல், எபிரெய ஒலிப்புக்கு ஏற்றவாறு தமிழில் எழுத்துப்பெயர்க்கப்பட்ட இயற்பெயர்.
- source_word: סִיסְרָא
  choice: சிசெரா
  rationale: இங்கு குடும்பப் பட்டியலில் வரும் இயற்பெயர்; எபிரெய ஒலிப்புக்கு ஏற்றவாறு தமிழில் எழுத்துப்பெயர்க்கப்பட்டது.
- source_word: תָמַח
  choice: தேமா
  rationale: மசோரா உயிர்க்குறிகளுடன் உள்ள எபிரெய வடிவத்தின் ஒலிப்பைத் தொடர்ந்து தமிழில் ‘தேமா’ என எழுத்துப்பெயர்க்கப்பட்டது.
theological_decisions: []
translation_notes:
  register: நவீனத் தரத் தமிழில், பெயர்ப் பட்டியலுக்குரிய சுருக்கமான மற்றும் கண்ணியமான நடையில் அமைக்கப்பட்டுள்ளது. மூலத்தில் மூன்று முறை வரும் בְּנֵי என்ற இணை அமைப்பு தமிழிலும் ‘மகன்கள்’ என்று மீள வழங்கப்பட்டுள்ளது. ஆங்கில அடிக்குறிப்பிலுள்ள ‘Tamah’ என்பது WLC உயிர்க்குறியிடப்பட்ட תָמַח வடிவத்திற்கான தேவையான மாற்று வாசிப்பு அல்ல; ஆகவே மூல உரைச் சான்றின் அடிப்படையில் அடிக்குறிப்பு சேர்க்கப்படவில்லை.
