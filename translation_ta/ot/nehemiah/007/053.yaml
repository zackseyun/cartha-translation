  text: பக்பூக்கின் வழிவந்தவர்கள்[a], ஹகூபாவின் வழிவந்தவர்கள், ஹர்ஹூரின் வழிவந்தவர்கள்—
  philosophy: optimal-equivalence
  footnotes:
