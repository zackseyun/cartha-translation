  source_fidelity: 'The threefold Hebrew construct phrase בְּנֵי is represented consistently as a genealogical descendant/family-group designation, and the list-continuation dash is retained. However, the draft''s rendering of חַרְחוּר as “அர்கூர்” does not faithfully preserve the name: the second ח is rendered as க rather than an h-like consonant.'
