    issue: The form “அகூபா” does not represent the initial ח in חֲקוּפָא as consistently as the other name forms.
    rationale: Tamil has no exact equivalent for Hebrew ח, but “ஹகூபா” is a clearer conventional approximation and aligns with the English audit form Hakupha.
