  terminology: 'The genealogical designation is handled suitably, with a footnote preserving its possible clan-group scope. Proper names should be transliterated consistently: “ஹகூபா” and “ஹர்ஹூர்” better represent the Hebrew ח consonant than the draft’s forms, especially “அர்கூர்.”'
  issues:
