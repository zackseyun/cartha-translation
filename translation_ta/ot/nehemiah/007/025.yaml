  text: the sons of Gibeon[a], ninety-five.
translation:
  language: ta
  text: கிபியோனின் மக்கள்[a] தொண்ணூற்று ஐந்து பேர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரேய மொழியில் சொல்லர்த்தமாக, ‘கிபியோனின் மகன்கள்.’ வம்ச அல்லது மக்கள்தொகைப் பட்டியல்களில் வரும் இந்த வழக்கமான சொற்றொடர், உடனடியாகப் பிறந்த ஆண் பிள்ளைகளை மட்டும் அல்லாமல், ஒரு பரந்த குலத்தையோ சமூகக் குழுவையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: மக்கள்
  rationale: இது בֵּן என்பதன் பன்மை இணைநிலை வடிவம். இத்தகைய வம்ச/மக்கள்தொகைப் பட்டியலில், உடனடிப் புதல்வர்களை மட்டும் அல்லாமல் ஒரு குடும்பம், குலம் அல்லது ஊரைச் சேர்ந்தவர்களையும் குறிக்கலாம். ஆகவே நவீனத் தமிழில் இயல்பாகவும் மூலத்தின் பொருள் அகலத்தைத் தக்கவைக்கும் வகையிலும் ‘மக்கள்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: גִבְעוֹן
  choice: கிபியோன்
  rationale: இது ஓர் இடப்பெயர்; தமிழில் நிலைபெற்ற வேதாகம ஒலிபெயர்ப்பு மரபுக்கு ஏற்ப ‘கிபியோன்’ என வழங்கப்பட்டது.
- source_word: תִּשְׁעִים וַחֲמִשָּׁה
  choice: தொண்ணூற்று ஐந்து
  rationale: எபிரேய எண்ணுரையின் மதிப்பு 95; இயல்பான நவீனத் தமிழ் எண்ணுருவில் மொழிபெயர்க்கப்பட்டது.
