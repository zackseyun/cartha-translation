base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/007/072.yaml
  text: So the priests[a], the Levites, the gatekeepers, the singers, some of the people, the temple servants, and all Israel lived in their cities. And when the seventh month arrived[b], the sons of Israel were in their cities.
translation:
  language: ta
  text: அவ்வாறு, ஆசாரியர்களும், லேவியர்களும், வாயில் காவலர்களும், பாடகர்களும், மக்களில் சிலரும், ஆலயப் பணியாளர்களும்[a], இஸ்ரவேல் மக்கள் அனைவரும் தங்கள் நகரங்களில் குடியேறினார்கள். ஏழாம் மாதம் வந்தபோது, இஸ்ரவேலர்[b] தங்கள் நகரங்களில் இருந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நெதினீமியர்”; ஆலயப் பணியாளர்களாக இருந்த இந்தக் குறிப்பிட்ட வகுப்பினரின் பெயருக்கான மரபான ஒலிபெயர்ப்பு.
    reason: lexical_alternative
  - marker: b
    text: சொல்லுக்கு சொல், “இஸ்ரவேலின் மகன்கள்”; இங்கு இஸ்ரவேல் மக்களை மொத்தமாகக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּשְׁבוּ
  choice: குடியேறினார்கள்
  rationale: ישׁב என்பதற்கு ‘அமர்தல், குடியிருத்தல், வாழ்தல்’ என்ற பொருள்கள் உண்டு. நாடு திரும்பியவர்கள் தங்கள் இடங்களில் வசிக்கத் தொடங்கிய இச்சூழலில் ‘குடியேறினார்கள்’ என்பது இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: הַכֹּהֲנִים
  choice: ஆசாரியர்கள்
  rationale: ஆலய வழிபாட்டுப் பணியிலிருந்த כהנים என்போருக்கான பரவலாக அறியப்பட்ட நவீனத் தமிழ் சொல்.
- source_word: הַלְוִיִּם
  choice: லேவியர்கள்
  rationale: லேவி கோத்திரத்தாரையும் அவர்களுடைய வழிபாட்டுப் பணியையும் குறிக்கும் மரபான பெயரின் இயல்பான தமிழாக்கம்.
- source_word: הַשּׁוֹעֲרִים
  choice: வாயிற்காவலர்கள்
  rationale: வாயில்களைக் காத்தவர்களை நேரடியாகக் குறிக்கிறது; தெளிவற்ற அல்லது பழமையான சொல்லைத் தவிர்க்கிறது.
- source_word: הַמְשֹׁרְרִים
  choice: பாடகர்கள்
  rationale: ஆலயப் பணியில் பாடியவர்களைக் குறிக்கும் எபிரெயப் பங்கேற்பு வடிவின் நேரடி பொருள்.
- source_word: וּמִן הָעָם
  choice: மக்களில் சிலரும்
  rationale: சொல்லுக்கு சொல் ‘மக்களிலிருந்து’ என்ற பகுதிப்பொருளை, இயல்பான தமிழில் ‘மக்களில் சிலர்’ என்று வெளிப்படுத்துகிறது.
- source_word: הַנְּתִינִים
  choice: ஆலயப் பணியாளர்கள்
  rationale: ஆலயச் சேவைக்கென நியமிக்கப்பட்ட ஒரு குறிப்பிட்ட வகுப்பினரைக் குறிக்கிறது. அவர்களது பணியை மொழிபெயர்ப்பது இன்றைய வாசகருக்குத் தெளிவாக உள்ளது; மரபான ஒலிபெயர்ப்பு அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: וְכָל יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்கள் அனைவரும்
  rationale: கூட்டாகிய முழு இஸ்ரவேலையும் இயல்பான தமிழில் குறிக்கிறது.
- source_word: בְּעָרֵיהֶם
  choice: தங்கள் பட்டணங்களில்
  rationale: עיר என்பது நகரத்தையோ பட்டணத்தையோ குறிக்கலாம். குடியேற்றப் பட்டியல் சூழலில் ‘பட்டணங்கள்’ இயல்பாக உள்ளது.
- source_word: וַיִּגַּע
  choice: வந்தபோது
  rationale: נגע அடிப்படையில் ‘தொடுதல்/எட்டுதல்’ என்றாலும், காலத்தைக் குறிக்கும் பெயருடன் ‘வந்தது’ என்று பொருள்படுகிறது. இணைப்பையும் கால உறவையும் ‘வந்தபோது’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: הַחֹדֶשׁ הַשְּׁבִיעִי
  choice: ஏழாம் மாதம்
  rationale: எபிரெய நாட்காட்டிச் சொற்றொடரின் நேரடியான மொழிபெயர்ப்பு.
- source_word: וּבְנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலர்
  rationale: בני ישראל சொல்லுக்கு சொல் ‘இஸ்ரவேலின் மகன்கள்’ என்றாலும், இங்கு ஆண்களை மட்டும் அல்லாமல் இஸ்ரவேல் மக்களைக் கூட்டாகக் குறிக்கும் நிலையான இனப்பெயர். ‘இஸ்ரவேலர்’ அந்தச் செயல்பாட்டை நவீனத் தமிழில் தெளிவாகத் தருகிறது; நேரடி வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
theological_decisions:
- issue: בני ישראל என்ற பாலின வடிவமுடைய கூட்டுச் சொற்றொடர்
  choice: இஸ்ரவேலர்
  alternative: இஸ்ரவேலின் மகன்கள் / இஸ்ரவேல் மக்கள்
  rationale: இலக்கண வடிவம் ஆண்பால் பன்மையாக இருந்தாலும், இச்சூழலில் அது உடன்படிக்கை மக்களை முழுமையாகக் குறிக்கும் வழக்கமான இனப்பெயர். ‘இஸ்ரவேலர்’ பாலின வரம்பைத் தவறாக உண்டாக்காமல் மூலத்தின் கூட்டுப்பொருளைக் காக்கிறது; நேரடி வடிவம் அடிக்குறிப்பில் குறிப்பிடப்படுகிறது.
- issue: הַנְּתִינִים என்ற நிறுவனப் பெயரின் மொழிபெயர்ப்பு
  choice: ஆலயப் பணியாளர்கள்
  alternative: நெதினீமியர்
  rationale: பெயரை மட்டும் ஒலிபெயர்ப்பதைவிட இவர்களுடைய பணியைச் சொல்வது சாதாரண வாசகருக்குத் தெளிவு. குறிப்பிட்ட வரலாற்று வகுப்பினர் என்ற தன்மை ஒலிபெயர்ப்பு அடிக்குறிப்பால் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகருக்குப் புரியும் கண்ணியமான நடையைப் பயன்படுத்துகிறது. பட்டியலின் ஒத்திசைவுக்காக ஒவ்வொரு குழுவுக்கும் ‘-உம்’ இணைப்பு வைக்கப்பட்டுள்ளது. முதல் வாக்கியத்தின் குடியேற்றச் சூழலும் இரண்டாம் வாக்கியத்தின் நிலை விளக்கமும் வேறுபடுமாறு ‘குடியேறினார்கள்’ மற்றும் ‘இருந்தார்கள்’ பயன்படுத்தப்பட்டுள்ளன. அடிக்குறிப்பு குறியீடுகள் அவை விளக்கும் சொற்களுக்குப் பின்னரே அமைக்கப்பட்டுள்ளன.
