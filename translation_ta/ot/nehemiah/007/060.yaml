lexical_decisions:
- source_word: כָּל
  choice: அனைவரும்
  rationale: பெயரிடப்பட்ட இரு குழுக்களின் முழு எண்ணிக்கையையும் குறிக்கும்; மனிதர்களைக் குறிக்கும் இயல்பான தமிழ் வடிவம்.
- source_word: הַנְּתִינִים
  choice: ஆலயப் பணியாளர்கள்
  rationale: நாடுகடத்தலுக்குப் பிந்தைய சமூகத்தில் ஆலயப் பணிக்கென இணைக்கப்பட்டிருந்த ஒரு குறிப்பிட்ட வகுப்பினரை அவர்களது செயல்பாட்டின் அடிப்படையில் தெளிவாகக் காட்டுகிறது; மரபுவழி ஒலிபெயர்ப்பு அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: וּבְנֵי
  choice: மகன்களும்
  rationale: எபிரெயச் சொல்லின் நேரடியான வடிவத்தைப் பேணி, இது ஒரு மரபான குழுப்பெயராக இருக்கக்கூடும் என்பதையும் திறந்த நிலையில் வைக்கிறது; சூழலில் சந்ததியினரையும் குறிக்கலாம்.
- source_word: עַבְדֵי
  choice: பணியாளர்களுடைய
  rationale: இச்சமூக-நிர்வாகக் குழுப்பெயரில் அடிமைத்தனத்தின் நிலையை வலியுறுத்தாமல், עֶבֶד என்பதன் பொருத்தமான 'servants' பொருளை இயல்பான தமிழில் வழங்குகிறது.
- source_word: שְׁלֹמֹה
  choice: சாலொமோனின்
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் பரவலாக அறியப்படும் பெயர்வடிவம்; உடைமைத் தொடர்பைத் தெளிவாகக் காட்டுகிறது.
- source_word: שְׁלֹשׁ מֵאוֹת תִּשְׁעִים וּשְׁנָיִם
  choice: முந்நூற்றுத் தொண்ணூற்றிரண்டு பேர்
  rationale: எபிரெய எண்ணை வாசிக்க இயல்பான தமிழ் சொல்வடிவில் தருகிறது; மனிதர்களின் கணக்காக இருப்பதால் 'பேர்' சேர்க்கப்பட்டுள்ளது.
