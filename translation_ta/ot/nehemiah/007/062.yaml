translation_notes:
  register: நவீன நிலையான தமிழில், வம்சப்பட்டியலுக்கேற்ற சுருக்கமான மற்றும் கண்ணியமான நடை. எபிரேயப் பட்டியல் அமைப்பு காக்கப்பட்டுள்ளது; எண்ணிக்கை மனிதர்களைக் குறிக்கிறது என்பதைத் தமிழில் தெளிவாக்க ‘பேர்’ என்றும், அது மொத்தம் என்பதை இயல்பாக்க ‘மொத்தம்’ என்றும் சேர்க்கப்பட்டுள்ளது.
