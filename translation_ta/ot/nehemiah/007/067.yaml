  source_fidelity: மூல எபிரெயத்தின் மִלְּבַד (‘தவிர’), ஆண் மற்றும் பெண் அடிமைகள் என்ற இணைச்சொற்கள், 7,337 மற்றும் 245 என்ற இரு எண்ணிக்கைகள், மேலும் ஆண்–பெண் பாடகர்கள் என்ற பாலின வேறுபாடு ஆகிய அனைத்தும் துல்லியமாகப் பேணப்பட்டுள்ளன. “இவர்கள் 7,337 பேர்” என்பது אֵלֶּה என்ற சுட்டுச்சொல்லைத் தொடர்ந்து வரும் எண்ணுடன் இயல்பாக இணைக்கிறது.
