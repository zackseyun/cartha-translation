  terminology: “ஆண் அடிமைகள்,” “பெண் அடிமைகள்,” “ஆண் பாடகர்கள்,” “பெண் பாடகர்கள்” ஆகியவை மூலத்தின் சமூகநிலை மற்றும் வெளிப்படையான பாலின வேறுபாட்டைத் தகுந்தவாறு காட்டுகின்றன. அடிக்குறிப்பு மாற்று பொதுப்பொருளை வழங்கி, இச்சூழலில் ‘அடிமைகள்’ என்பதற்கான காரணத்தையும் சமநிலையுடன் விளக்குகிறது.
