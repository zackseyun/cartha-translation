  text: besides their male and female servants[a], of whom there were 7,337; and they had 245 male and female singers.
translation:
  language: ta
  text: அவர்களுடைய ஆண் அடிமைகளையும் பெண் அடிமைகளையும்[a] தவிர, இவர்கள் 7,337 பேர். அவர்களிடம் ஆண் பாடகர்களும் பெண் பாடகர்களும் 245 பேர் இருந்தனர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஆண் பணியாளர்களையும் பெண் பணியாளர்களையும்.” எபிரெயச் சொற்களைப் பொதுவாக இவ்வாறும் மொழிபெயர்க்கலாம்; ஆனால் இந்த மக்கள்தொகைக் கணக்குச் சூழலில், அவை குடும்பங்களுடன் இணைக்கப்பட்டிருந்த ஆண், பெண் அடிமைகளைக் குறிக்க வாய்ப்பு அதிகம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִלְּבַד
  choice: தவிர
  rationale: முந்தைய மொத்தக் கணக்கில் சேராத கூடுதல் பிரிவைச் சுருக்கமாகவும் இயல்பாகவும் குறிக்கிறது.
- source_word: עַבְדֵיהֶם וְאַמְהֹתֵיהֶם
  choice: அவர்களுடைய ஆண் அடிமைகளையும் பெண் அடிமைகளையும்
  rationale: இரு எபிரெயச் சொற்களும் முறையே ஆண்பால், பெண்பால் பணிநிலையிலிருந்தவர்களைக் குறிக்கின்றன; வீட்டாருடன் இணைத்துக் கணக்கிடும் இச்சூழலில் ‘அடிமைகள்’ சமூக நிலையைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: אֵלֶּה
  choice: இவர்கள்
  rationale: எபிரெய மூலத்தின் சுட்டுப்பெயரை நேரடியாகப் பேணுகிறது; தொடர்ந்து வரும் எண்ணிக்கையுடன் இயல்பாக அமைகிறது.
- source_word: שִׁבְעַת אֲלָפִים שְׁלֹשׁ מֵאוֹת שְׁלֹשִׁים וְשִׁבְעָה
  choice: 7,337 பேர்
  rationale: மக்கள்தொகைப் பட்டியலுக்கேற்ற நவீன எண் வடிவில் துல்லியமான எண்ணிக்கையைத் தருகிறது; ‘பேர்’ மனிதர்களைக் கணக்கிடுவதைத் தெளிவாக்குகிறது.
- source_word: וְלָהֶם
  choice: அவர்களிடம் ... இருந்தனர்
  rationale: உடைமை அல்லது அவர்களோடு இணைந்திருத்தலைக் குறிக்கும் எபிரெயக் கட்டமைப்பை இயல்பான தமிழில் வழங்குகிறது.
- source_word: מְשֹׁרֲרִים וּמְשֹׁרֲרוֹת
  choice: ஆண் பாடகர்களும் பெண் பாடகர்களும்
  rationale: மூலத்தில் வெளிப்படையாக உள்ள ஆண்பால்–பெண்பால் வேறுபாட்டைப் பேணுகிறது.
- source_word: מָאתַיִם וְאַרְבָּעִים וַחֲמִשָּׁה
  choice: 245 பேர்
