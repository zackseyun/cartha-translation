lexical_decisions:
- source_word: בְּנֵי
  choice: மகன்கள்
  rationale: எபிரெய மரபுவழிப் பட்டியல்களில் இச்சொல் நேரடி ஆண் பிள்ளைகளை மட்டுமல்லாமல் ஒரு குடும்பத்தையோ வம்சவழியினரையோ குறிக்கலாம். மூலத்தின் மீளும் பட்டியல் அமைப்பைப் பாதுகாக்க ‘மகன்கள்’ பயன்படுத்தப்பட்டுள்ளது; விரிந்த பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: חָנָן
  choice: ஹானான்
  rationale: இது ஒரு நபரையோ குலத் தலைவரையோ குறிக்கும் பெயர்; எபிரெய ஒலிவடிவத்துக்கு நெருக்கமாக ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: גִדֵּל
  choice: கித்தேல்
  rationale: திரும்பிவந்த ஆலயப் பணியாளர் குடும்பங்களின் பட்டியலில் வரும் பெயர்; எபிரெய மெய்யொலி இரட்டிப்பை இயன்றவரை பிரதிபலிக்கும் வகையில் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: גָחַר
  choice: கஹார்
  rationale: பட்டியலில் வரும் பெயர்; எபிரெய பெயரின் மெய் மற்றும் உயிரொலிகளை நவீன தமிழில் இயன்றவரை தெளிவாகப் பிரதிபலிக்கும் ஒலிபெயர்ப்பு.
