translation:
  language: ta
  text: ரெயாயாவின் மகன்கள்[a], ரெசீனின் மகன்கள், நெகோதாவின் மகன்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இந்த வம்சப் பட்டியலில் வரும் ஒவ்வொரு ‘மகன்கள்’ என்பதையும் ‘வழித்தோன்றல்கள்’ அல்லது ‘குடும்பத்தைச் சேர்ந்தவர்கள்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: மகன்கள்
  rationale: எபிரெயக் கட்டமைப்பை முறையாகப் பாதுகாக்கிறது. இந்த வம்சப் பட்டியல் சூழலில் இது நேரடி மகன்களை மட்டுமல்லாமல் வழித்தோன்றல்களையோ குடும்பத்தைச் சேர்ந்தவர்களையோ குறிக்கலாம்; அந்த விரிவான பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: רְאָיָה
  choice: ரெயாயா
  rationale: எபிரெயப் பெயரின் ஒலியமைப்பைத் தமிழில் இயன்றவரை நெருக்கமாக ஒலிபெயர்க்கிறது.
- source_word: רְצִין
  choice: ரெசீன்
  rationale: எபிரெயப் பெயரின் மெய் மற்றும் உயிர் ஒலிகளை அடிப்படையாகக் கொண்ட தமிழ் ஒலிபெயர்ப்பு.
- source_word: נְקוֹדָא
  choice: நெக்கோதா
  rationale: எபிரெயப் பெயரை மொழிபெயர்க்காமல், அதன் ஒலியமைப்புக்கு நெருக்கமாகத் தமிழில் ஒலிபெயர்க்கிறது.
