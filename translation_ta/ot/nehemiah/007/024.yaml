  rationale: தனிநபர் அல்லது குடும்பப் பெயர்; எபிரெய ஒலிப்புக்கு ஏற்ப தமிழில் ஒலிபெயர்க்கப்பட்டது.
- source_word: מֵאָה שְׁנֵים עָשָׂר
  choice: நூற்றுப் பன்னிரண்டு பேர்
  rationale: மொத்தம் 112 என்பதைக் குறிக்கும் எண்ணுரை. பட்டியலின் மனிதர் எண்ணிக்கையை இயல்பான நவீன தமிழில் தெரிவிக்க ‘பேர்’ சேர்க்கப்பட்டது.
