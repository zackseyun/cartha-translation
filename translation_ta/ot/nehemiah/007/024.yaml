  rationale: בֵּן என்பதன் பன்மை இணைப்புநிலை வடிவம். இந்த வம்சாவளி/மக்கள்தொகைப் பட்டியலில் நேரடியான மரபுவழிச் சொல்லாக ‘மகன்கள்’ பயன்படுத்தப்படுகிறது; சூழலில் இது சந்ததியினர் அல்லது குடும்பக் குழுவினரையும் குறிக்கக்கூடும்.
- source_word: חָרִיף
