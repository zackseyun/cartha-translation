  source_fidelity: எபிரெய மூலத்தின் בְּנֵי עָדִין (‘ஆதீனின் மகன்கள்/குடும்பத்தார்’) மற்றும் எண்ணிக்கை שֵׁשׁ מֵאוֹת חֲמִשִּׁים וַחֲמִשָּׁה (‘அறுநூற்று ஐம்பத்தைந்து’) துல்லியமாகப் பிரதிபலிக்கப்படுகின்றன. வம்ச/மக்கள்தொகைப் பட்டியல் சூழலில் ‘மகன்கள்’ என்பது குடும்பக் குழுவைக் குறிக்கும் மரபுவழிப் பதிவுமொழியாக ஏற்கத்தக்கது.
  naturalness: '‘ஆதீனின் மகன்கள்: அறுநூற்று ஐம்பத்தைந்து பேர்.’ என்பது சுருக்கமான, தெளிவான, நவீனத் தமிழில் இயல்பான பட்டியல் நடை. ‘பேர்’ சேர்க்கை எண்ணிக்கை மனிதர்களைக் குறிப்பதைத் தெளிவாக்குகிறது.'
  terminology: ‘ஆதீன்’ என்பது Adin என்ற பெயருக்கான பொருத்தமான ஒலிபெயர்ப்பு. ‘மகன்கள்’ மூலத்தின் முறையான வம்சப்-பதிவு வடிவத்தைத் தக்கவைக்கிறது; இவ்வசனத்தில் சிறப்புச் சொல் அல்லது இறையியல் சொல் தொடர்பான பிரச்சினை இல்லை.
