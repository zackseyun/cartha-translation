  text: the sons of Lebanah[a], the sons of Hagabah[b], the sons of Shalmai.
translation:
  language: ta
  text: லெபானாவின் மகன்கள்[a], ஹகாபாவின் மகன்கள், ஷல்மாயின் மகன்கள்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘மகன்கள்’ என்று வரும் ஒவ்வோர் இடத்திலும் ‘சந்ததியினர்’ என்றும் மொழிபெயர்க்கலாம்; இந்த எபிரெய வம்சவழிச் சொற்றொடர் உடனடியாகப் பிறந்த ஆண் பிள்ளைகளை மட்டுமல்லாமல் ஒரு குடும்ப வழியையோ குலத்தைச் சேர்ந்தவர்களையோ குறிக்கவும் முடியும்.
    reason: lexical_alternative
  - marker: b
    text: சில இணைப் பட்டியல் மரபுகளில் இந்த இறுதிப் பெயர் ‘சல்மாய்’ என உள்ளது. இங்கு நெகேமியாவின் எபிரெய உரையில் ‘ஷல்மாய்’ என்ற வடிவமே உள்ளது.
    reason: alternative_reading
lexical_decisions:
- source_word: בְּנֵי
  choice: மகன்கள்
  rationale: இது בֵּן என்பதன் பன்மை இணைப்புவடிவம். எபிரெய குடும்பப் பட்டியலின் நேரடியான அமைப்பைத் தக்கவைக்க ‘மகன்கள்’ என மொழிபெயர்க்கப்பட்டுள்ளது; இச்சூழலில் அது உடனடிப் புதல்வர்களை மட்டுமல்லாமல் சந்ததியினர் அல்லது குடும்பக் குழுவினரையும் குறிக்கலாம் என்பதைக் குறிப்பில் தெளிவுபடுத்துகிறது.
- source_word: לְבָנָה
  choice: லெபானா
  rationale: பெயர்ச்சொல்லை மொழிபெயர்க்காமல், மசோரா உயிர்க்குறிப்புகளுடன் கூடிய எபிரெய ஒலிவடிவத்திற்கு அணுக்கமாகத் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: חֲגָבָה
  choice: ஹகாபா
  rationale: தொடக்க ח ஒலியைத் தமிழில் அணுக்கமாகக் காட்ட ‘ஹ’ பயன்படுத்தப்பட்டு, பெயர் எபிரெய வடிவத்திலிருந்து ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: שַׁלְמָי
  choice: ஷல்மாய்
  rationale: மசோரா உரையின் שׁ (sh) தொடக்க ஒலியையும் இறுதி -מָי (-மாய்) வடிவத்தையும் காக்கும் ஒலிபெயர்ப்பு. தொடர்புடைய இணைப் பட்டியல்களில் காணப்படும் ‘சல்மாய்’ என்ற மாற்று வடிவம் முதன்மை உரைக்குள் கொண்டுவரப்படவில்லை.
