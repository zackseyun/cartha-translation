lexical_decisions:
- source_word: בְּנֵי
  choice: மகன்கள்
  rationale: இது ‘மகன்கள்’ என்பதன் பன்மை இணைப்புநிலை வடிவம். இங்கு வம்ச/மக்கள்தொகைக் கணக்குப் பட்டியல் சூழலில் அஸ்காதின் குடும்ப வழியைச் சேர்ந்தவர்களைக் குறித்தாலும், எபிரெயச் சொல்லின் வடிவத்தை இயல்பான தமிழில் பாதுகாக்கிறது.
- source_word: עַזְגָּד
  choice: அஸ்காத்
  rationale: இது ஒரு நபர் அல்லது குடும்பத்தின் இயற்பெயர்; எபிரெய உச்சரிப்பை அணுகும் வகையில் தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: אַלְפַּיִם שְׁלֹשׁ מֵאוֹת עֶשְׂרִים וּשְׁנָיִם
  choice: 2,322 பேர்
  rationale: எபிரெய எண்ணமைப்பு ‘இரண்டாயிரம், முந்நூறு, இருபத்தி இரண்டு’ என மொத்தம் 2,322 என்பதைக் குறிக்கிறது. பட்டியலில் மனிதர்களின் எண்ணிக்கை என்பதைக் தமிழில் தெளிவாக்க ‘பேர்’ சேர்க்கப்பட்டுள்ளது.
