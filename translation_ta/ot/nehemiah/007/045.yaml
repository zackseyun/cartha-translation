base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/007/045.yaml
  text: 'The gatekeepers: the sons of Shallum[a], the sons of Ater, the sons of Talmon, the sons of Akkub, the sons of Hatita, the sons of Shobai, 138.'
translation:
  language: ta
  text: 'வாசற்காவலர்கள்: ஷல்லூமின் வழிவந்தவர்கள்[a], ஆதேறின் வழிவந்தவர்கள், தல்மோனின் வழிவந்தவர்கள், அக்கூபின் வழிவந்தவர்கள், ஹத்தீதாவின் வழிவந்தவர்கள், ஷோபாயின் வழிவந்தவர்கள்—மொத்தம் 138 பேர்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “வழிவந்தவர்கள்” என்பதற்கான எபிரெயச் சொல் நேரடியாக “மகன்கள்” என்று பொருள்படும்; இங்கு அது ஒரு விரிவான குடும்பவழி அல்லது குலத்தையும் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשֹּׁעֲרִים
  choice: வாசற்காவலர்கள்
  rationale: வாசல்களைக் காத்து நிர்வகிக்கும் பணியாளர்களைக் குறிக்கும் எபிரெயச் சொல்லை, ஆலயப் பணி மற்றும் பட்டியல் சூழலுக்கு ஏற்ற இயல்பான தமிழில் தருகிறது.
- source_word: בְּנֵי
  choice: வழிவந்தவர்கள்
  rationale: இப்பட்டியல் சூழலில் இச்சொல் உடனடிப் புதல்வர்களை மட்டும் அல்லாமல் குடும்பவழி அல்லது குலப்பிரிவையும் குறிக்கலாம்; ஆகவே இயல்பான தமிழில் அதன் பரந்த பொருள் காக்கப்படுகிறது.
- source_word: שַׁלּוּם
  choice: சல்லூம்
  rationale: எபிரெயத் தனிப்பெயரின் ஒலிப்பைத் தமிழில் எழுத்துப்பெயர்த்த வடிவம்.
- source_word: אָטֵר
  choice: ஆதேர்
  rationale: எபிரெயத் தனிப்பெயரின் ஒலிப்பைத் தமிழில் எழுத்துப்பெயர்த்த வடிவம்.
- source_word: טַלְמֹן
  choice: தல்மோன்
  rationale: எபிரெயத் தனிப்பெயரின் ஒலிப்பைத் தமிழில் எழுத்துப்பெயர்த்த வடிவம்.
- source_word: עַקּוּב
  choice: அக்கூப்
  rationale: எபிரெய மெய்யெழுத்தின் இரட்டிப்பையும் நீண்ட உயிரொலியையும் இயன்றவரை பிரதிபலிக்கும் தமிழ் எழுத்துப்பெயர்ப்பு.
- source_word: חֲטִיטָא
  choice: அத்தித்தா
  rationale: தொடக்க எபிரெய ח ஒலிக்கு தமிழ் வேதாகமப் பெயர் மரபில் இயல்பான 'அ' வடிவத்தையும், பெயரின் மற்ற ஒலிகளையும் பிரதிபலிக்கிறது.
- source_word: שֹׁבָי
  choice: சோபாய்
  rationale: இறுதி இரட்டை உயிரொலியைப் பாதுகாக்கும் தமிழ் எழுத்துப்பெயர்ப்பு.
- source_word: מֵאָה שְׁלֹשִׁים וּשְׁמֹנָה
  choice: 138 பேர்
  rationale: எபிரெய எண்ணிக்கையை வாசிக்க எளிதான இலக்க வடிவில் தருகிறது; மனிதர்களின் பட்டியல் என்பதால் 'பேர்' சேர்க்கப்பட்டுள்ளது.
