  text: וַ/אֲשֶׁ֣ר נָתְנוּ֮ שְׁאֵרִ֣ית הָ/עָם֒ זָהָ֗ב דַּרְכְּמוֹנִים֙ שְׁתֵּ֣י רִבּ֔וֹא וְ/כֶ֖סֶף מָנִ֣ים אַלְפָּ֑יִם וְ/כָתְנֹ֥ת כֹּֽהֲנִ֖ים שִׁשִּׁ֥ים וְ/שִׁבְעָֽה׃פ
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/007/071.yaml
  text: And what the rest of the people gave was twenty thousand gold darics[a], two thousand minas of silver[c][b], and sixty-seven priests’ tunics.
translation:
  language: ta
  text: 'மக்களில் மற்றவர்கள் கொடுத்தவை: இருபதாயிரம் தங்கத் தரிக்குகள்[a], இரண்டாயிரம் வெள்ளி மினாக்கள்[b], ஆசாரியர்களின் அறுபத்தேழு அங்கிகள்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: தரிக் என்பது பாரசீகத் தங்க நாணயம்.
    reason: cultural_note
  - marker: b
    text: மினா என்பது பண்டைய கால எடை அலகு; அதனால் பண மதிப்பையும் குறித்தது.
    reason: cultural_note
lexical_decisions:
- source_word: וַאֲשֶׁר נָתְנוּ
  choice: கொடுத்தது
  rationale: முந்தைய கொடையாளர்களின் பட்டியலைத் தொடர்ந்து, கொடுக்கப்பட்டவற்றை அறிமுகப்படுத்தும் எபிரெயத் தொடர்பமைப்பை இயல்பான தமிழில் சுருக்கமாக வெளிப்படுத்துகிறது.
- source_word: שְׁאֵרִית הָעָם
  choice: மக்களில் மீதியிருந்தவர்கள்
  rationale: இங்கு שְׁאֵרִית என்பது இறையியல் பொருளுள்ள ‘மீதியானோர்’ என்பதைக் காட்டிலும், முன்பு குறிப்பிடப்பட்ட கொடையாளர்களைத் தவிர மற்ற மக்களைக் குறிக்கும் நிர்வாகப் பட்டியல் சொல்லாக உள்ளது.
- source_word: זָהָב דַּרְכְּמוֹנִים
  choice: தங்கத் தரிக்குகள்
  rationale: தரிக் என்ற வரலாற்றுச் சிறப்புள்ள பாரசீகத் தங்க நாணயத்தின் பெயரைப் பொதுவான ‘தங்க நாணயங்கள்’ என்று மாற்றாமல் பாதுகாக்கிறது.
- source_word: שְׁתֵּי רִבּוֹא
  choice: இருபதாயிரம்
  rationale: சொல்லுக்குச் சொல் ‘இரண்டு பத்தாயிரங்கள்’ என்ற எபிரெய எண்ணிக்கையை நவீன தமிழின் வழக்கமான எண்ணுருவில் தருகிறது.
- source_word: וְכֶסֶף מָנִים אַלְפָּיִם
  choice: இரண்டாயிரம் வெள்ளி மினாக்கள்
  rationale: மினா என்ற பண்டைய எடை மற்றும் மதிப்பு அலகைப் பாதுகாத்து, தமிழில் இயல்பான சொல் வரிசையில் அமைக்கிறது.
- source_word: וְכָתְנֹת כֹּהֲנִים
  choice: ஆசாரியர்களுக்கான அங்கிகள்
  rationale: כָּתְנֹת என்பது நீளமான உடை அல்லது அங்கியைக் குறிக்கிறது; எபிரெய உருபுத்தொடர் உடைமை அல்லது பயன்பாடு என இருவிதமாகப் புரியக்கூடியதால், இச்சூழலில் ஆசாரியர்களுக்காக வழங்கப்பட்ட உடைகள் என்ற இயல்பான பொருளைத் தருகிறது.
- source_word: שִׁשִּׁים וְשִׁבְעָה
  choice: அறுபத்தேழு
  rationale: எபிரெயின் ‘அறுபதும் ஏழும்’ என்பதை நவீனத் தமிழின் வழக்கமான எண்ணுருவில் வழங்குகிறது.
theological_decisions:
- issue: שְׁאֵרִית הָעָם என்பதில் ‘மீதியானோர்’ என்ற இறையியல் நுணுக்கம் உள்ளதா
  choice: மக்களில் மீதியிருந்தவர்கள்
  alternative: மக்களின் மீதியானோர்
  rationale: காணிக்கைகளின் நிர்வாகப் பட்டியல் சூழலில், முன்பு குறிப்பிடப்பட்ட குழுக்களைத் தவிர்த்த பிற மக்களே குறிக்கப்படுகின்றனர்; விசுவாசமுள்ள ‘மீதியானோர்’ என்ற இறையியல் கருத்தை உரையில் இறக்குமதி செய்யவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பட்டியல் நடையைத் தெளிவாகவும் கண்ணியமாகவும் வைத்துள்ளது. வரலாற்று நாணய மற்றும் எடை அலகுகள் ஒலிபெயர்க்கப்பட்டு அடிக்குறிப்புகளில் விளக்கப்பட்டுள்ளன. ‘ஆசாரியர்’ என்பது வேதாகமச் சூழலில் பரவலாகப் புரிந்துகொள்ளப்படும் சொல்லாகப் பயன்படுத்தப்பட்டுள்ளது.
