source:
  edition: WLC
  text: וָ/אֲצַוֶּ֞ה אֶת חֲנָ֣נִי אָחִ֗/י וְ/אֶת חֲנַנְיָ֛ה שַׂ֥ר הַ/בִּירָ֖ה עַל יְרוּשָׁלִָ֑ם כִּי הוּא֙ כְּ/אִ֣ישׁ אֱמֶ֔ת וְ/יָרֵ֥א אֶת הָ/אֱלֹהִ֖ים מֵ/רַבִּֽים־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/007/002.yaml
  text: Then I appointed my brother Hanani and Hananiah[a], the commander of the fortress, over Jerusalem[b], because he was a faithful man and feared God more than many.
translation:
  language: ta
  text: பின்பு என் சகோதரன் அனானியையும், கோட்டையின் தலைவரான அனனியாவையும் எருசலேமுக்குப் பொறுப்பாக நியமித்தேன். ஏனெனில் அவன்[b] உண்மையுள்ள மனிதனாக[a] இருந்ததோடு, பலரைவிட தேவனுக்குப் பயந்தவனாகவும் இருந்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உண்மையின் மனிதன்” அல்லது “நம்பகமான மனிதன்.”
    reason: lexical_alternative
  - marker: b
    text: “அவன்” என்ற ஒருமைச் சொல் இயல்பாக அனனியாவைக் குறிக்கிறது; எனினும், இந்தப் பாராட்டு இருவரையும் நியமித்ததற்கான பொதுவான ஆதாரமாக இருப்பதாகச் சிலர் புரிந்துகொள்கிறார்கள்.
    reason: alternative_reading
lexical_decisions:
- source_word: וָאֲצַוֶּה
  choice: பொறுப்பாக நியமித்தேன்
  rationale: צוה என்பதன் அடிப்படைப் பொருள் ‘கட்டளையிடுதல்’ என்றாலும், இங்கு நபர்களை எருசலேமின்மேல் அமர்த்தும் நிர்வாகச் சூழலில் பொறுப்பை ஒப்படைத்து நியமித்தல் என்ற செயல்பாட்டுப் பொருளைத் தருகிறது.
- source_word: חֲנָנִי אָחִי
  choice: என் சகோதரன் அனானி
  rationale: אָחִי என்பது முதல் நபர் ஒருமை உடைமைப் பின்னொட்டுடன் ‘என் சகோதரன்’ என்று நேரடியாகக் குறிக்கிறது; தமிழின் இயல்பான சொல் வரிசை பின்பற்றப்பட்டுள்ளது.
- source_word: חֲנַנְיָה
  choice: அனனியா
  rationale: எபிரெயத் தனிப்பெயர் தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளது; அனானி என்ற முந்தைய பெயரிலிருந்து வேறுபாடும் காக்கப்படுகிறது.
- source_word: שַׂר הַבִּירָה
  choice: கோட்டையின் தலைவர்
  rationale: שַׂר என்பது தலைவர் அல்லது பொறுப்பதிகாரியையும், בִּירָה என்பது அரண் அமைந்த கோட்டையையும் குறிக்கிறது. குறிப்பிட்ட இராணுவப் பதவியைத் தேவையின்றி உறுதிசெய்யாமல், நிர்வாக-இராணுவத் தலைமையை இச்சொற்றொடர் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: עַל יְרוּשָׁלָ͏ִם
  choice: எருசலேமுக்குப் பொறுப்பாக
  rationale: நியமித்தலைக் குறிக்கும் வினையுடன் வரும் עַל, எருசலேமின்மீதான அதிகாரம் அல்லது பொறுப்பைக் குறிக்கிறது. தமிழில் ‘எருசலேமுக்குப் பொறுப்பாக’ என்பது இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: כִּי הוּא
  choice: ஏனெனில் அவன்
  rationale: כִּי நியமிப்புக்கான காரணத்தை அறிமுகப்படுத்துகிறது; எபிரெய மூலத்தின் ஒருமைப் பெயர்ப்பதிலியை ‘அவன்’ என்று பாதுகாக்கிறது.
- source_word: כְּאִישׁ אֱמֶת
  choice: உண்மையுள்ள மனிதன்
  rationale: אֱמֶת என்பது உண்மை, நம்பகத்தன்மை, விசுவாசத்தன்மை ஆகிய பொருள் நிழல்களைக் கொண்டது. பதவிக்குத் தகுதியான குணத்தைச் சுட்டும் இச்சூழலில் ‘உண்மையுள்ள’ என்பது மூலத்தின் உருவகத்தையும் நெறிப் பொருளையும் காக்கிறது.
- source_word: וְיָרֵא אֶת־הָאֱלֹהִים
  choice: தேவனுக்குப் பயந்தவன்
  rationale: இது தேவனிடம் கொண்ட பயபக்தியை நேரடியாகக் குறிக்கிறது. ‘பயந்தவன்’ என்ற வடிவம் மூலத்தின் நேர்மையையும் தமிழில் வழக்கமான வேதாகமச் சொல்லாட்சியையும் காக்கிறது.
- source_word: מֵרַבִּים
  choice: பலரைவிட
  rationale: ஒப்பீட்டைக் குறிக்கும் מִן மற்றும் ‘பலர்’ என்ற רַבִּים ஆகியவற்றை நேரடியாக வழங்குகிறது; ‘பெரும்பாலோரைவிட’ என்று பொருளை இறுக்காமல் மூலத்தின் திறந்த ஒப்பீட்டைக் காக்கிறது.
theological_decisions:
- issue: பாராட்டுச் சொற்றொடரில் வரும் ஒருமைப் பெயர்ப்பதிலியின் சுட்டுப்பொருள்
  choice: ‘அவன்’ என்பதை ஒருமையாகவே வைத்து, மிக அருகிலுள்ள முன்னிலையான அனனியாவை இயல்பான சுட்டுப்பொருளாகக் கொள்ளுதல்
  alternative: ஒருமை இலக்கணம் இருந்தாலும், அந்தப் பாராட்டு இருவரின் கூட்டு நியமிப்பையும் பொதுவாக ஆதரிப்பதாகப் புரிந்துகொள்ளுதல்
  rationale: எபிரெயத்தில் பெயர்ப்பதிலியும் தொடரும் பண்புகளும் ஒருமையில் உள்ளதால் அவை இயல்பாக அனனியாவைச் சுட்டுகின்றன. எனினும் சூழல் இருவரின் நியமிப்பைப் பற்றியது; ஆகவே ‘அவர்கள்’ என்று மாற்றி மூலத்தின் பதற்றத்தைத் தீர்க்காமல், ஒருமையைப் பாதுகாத்து மாற்றுப் புரிதலை அடிக்குறிப்பில் குறிப்பிடுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. நிர்வாகப் பொருளைத் தெளிவாக்க ‘பொறுப்பாக நியமித்தேன்’ பயன்படுத்தப்பட்டுள்ளது; மூலத்தின் ஒருமைச் சுட்டுப்பெயரும் ‘பலரைவிட’ என்ற திறந்த ஒப்பீடும் மாற்றமின்றிக் காக்கப்பட்டுள்ளன.
