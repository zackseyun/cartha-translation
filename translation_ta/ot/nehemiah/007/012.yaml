  text: ஏலாமின் மகன்கள் 1,254 பேர்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי
  choice: மகன்கள்
  rationale: בְּנֵי என்பது בֵּן என்பதன் பன்மை இணைப்பு வடிவம். இந்த வம்சப் பட்டியல் சூழலில் அது ஏலாம் எனப்படும் குடும்ப அல்லது குலத்தைச் சேர்ந்த ஆண் வழியினரைக் குறிக்கிறது; ‘மகன்கள்’ எபிரெயச் சொல்லமைப்பையும் வம்சவழி மரபுத்தொடரையும் காக்கிறது.
- source_word: עֵילָם
  choice: ஏலாம்
  rationale: இது திரும்பிவந்தோரின் பட்டியலில் இடம்பெறும் குடும்ப அல்லது குலப் பெயர்; புவியியல் பகுதியைக் குறிக்கவில்லை. எனவே பெயர் தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: אֶלֶף מָאתַיִם חֲמִשִּׁים וְאַרְבָּעָה
  choice: 1,254 பேர்
  rationale: எபிரெய எண்ணுத் தொடர் மொத்தம் 1,254 எனக் குறிக்கிறது. பட்டியல் சூழலில் நவீன வாசிப்புத் தெளிவுக்காக எண்களால் கொடுக்கப்பட்டுள்ளது; தமிழில் மனிதர்களின் எண்ணிக்கையை இயல்பாகக் காட்ட ‘பேர்’ சேர்க்கப்பட்டுள்ளது.
