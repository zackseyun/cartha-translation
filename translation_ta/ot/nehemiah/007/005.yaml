base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/007/005.yaml
  text: 'Then my God put it into my heart to assemble the nobles[a], the officials, and the people to be enrolled by genealogy. And I found the book of the genealogy of those who came up first[b], and I found written in it:'
translation:
  language: ta
  text: 'அப்போது என் கடவுள், உயர்குடியினரையும்[a] அதிகாரிகளையும் மக்களையும் ஒன்றுகூட்டி, அவர்களைக் குலவரிசைப்படி பதிவு செய்ய வேண்டும் என்ற எண்ணத்தை என் உள்ளத்தில் வைத்தார். முதலில் திரும்பிவந்தவர்களின் குலவரிசைப் பதிவேட்டை[b] நான் கண்டுபிடித்தேன்; அதில் எழுதப்பட்டிருந்தது இதுதான்:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'வேறு மொழிபெயர்ப்பு: “பிரபுக்கள்.” இச்சொல் சமூகத்தின் உயர்நிலையிலிருந்த தலைவர்களைக் குறிக்கிறது.'
    reason: lexical_alternative
  - marker: b
    text: அதாவது, நாடுகடத்தலிலிருந்து முதல் கட்டமாகத் திரும்பிவந்தவர்களின் குலவரிசைப் பதிவு.
    reason: clarification
lexical_decisions:
- source_word: וַיִּתֵּן אֱלֹהַי אֶל לִבִּי
  choice: என் கடவுள் ... என்ற எண்ணத்தை என் உள்ளத்தில் வைத்தார்
  rationale: ‘என் கடவுள் என் இதயத்திற்குக் கொடுத்தார்’ என்ற எபிரேய மொழிமரபை இயல்பான நவீனத் தமிழில் வழங்கி, இறைவனின் முன்முயற்சியையும் உள்ளார்ந்த தூண்டுதலையும் காக்கிறது.
- source_word: וָאֶקְבְּצָה
  choice: ஒன்றுகூட்டி
  rationale: முந்தைய இறைத் தூண்டுதலின் உள்ளடக்கமாக, நெகேமியா செய்ய எண்ணிய செயலை இயல்பாகத் தெரிவிக்கிறது.
- source_word: הַחֹרִים
  choice: உயர்குடியினர்
  rationale: இச்சூழலில் சுதந்திரமான மக்கள் என்பதைக் காட்டிலும் சமூகத்தின் செல்வாக்குமிக்க தலைவர்களைக் குறிக்கிறது.
- source_word: הַסְּגָנִים
  choice: அதிகாரிகள்
  rationale: நிர்வாகப் பொறுப்பிலிருந்த கீழ்நிலை ஆட்சியாளர்களைத் தெளிவான பொதுத் தமிழில் குறிக்கிறது.
- source_word: לְהִתְיַחֵשׂ
  choice: குலவரிசைப்படி பதிவு செய்ய
  rationale: குடும்ப வழிமரபை உறுதிசெய்து அதிகாரப்பூர்வமாகப் பதிவுசெய்யும் பொருளை வெளிப்படுத்துகிறது.
- source_word: סֵפֶר הַיַּחַשׂ
  choice: குலவரிசைப் பதிவேடு
  rationale: எழுத்துப்பூர்வமான வம்சப் பதிவைக் குறிக்கும் எபிரேயச் சொல்லை இயல்பாகவும் துல்லியமாகவும் வழங்குகிறது.
- source_word: הָעוֹלִים בָּרִאשׁוֹנָה
  choice: முதலில் திரும்பிவந்தவர்கள்
  rationale: நாடுகடத்தலிலிருந்து யூதாவுக்கு முதற்கட்டமாக வந்தவர்களைக் குறிக்கிறது; ‘மேலே வந்தவர்கள்’ என்ற எபிரேய மொழிமரபின் சூழற்பொருளைத் தமிழில் தெளிவாக்குகிறது.
- source_word: וָאֶמְצָא כָתוּב בּוֹ
  choice: 'அதில் எழுதப்பட்டிருந்தது இதுதான்:'
  rationale: அடுத்துவரும் ஆவணப் பதிவை அறிமுகப்படுத்தும் தொடராக இயல்பாக அமைகிறது.
theological_decisions:
- issue: நெகேமியாவின் தலைமையில் இறைவனுடைய உள்ளார்ந்த தூண்டுதல்
  choice: என் கடவுள் ... என்ற எண்ணத்தை என் உள்ளத்தில் வைத்தார்
  alternative: கடவுள் எனக்கு வெளிப்படுத்தினார்
  rationale: எபிரேயம் இறைவனின் செயலை உள்ளார்ந்த தூண்டுதலாகச் சொல்கிறது; அது எவ்வகை வெளிப்பாடு என்பதை வரையறுக்கவில்லை. ஆகவே முறையான வெளிப்பாடு என்று மிகைப்படுத்தாமலும் வெறும் தனிப்பட்ட எண்ணமாகக் குறைக்காமலும் மொழிபெயர்க்கப்பட்டுள்ளது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்கு விளங்கும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘உள்ளத்தில் வைத்தார்’ என்பது இறைத் தூண்டுதலின் இயல்பைப் பற்றி மூலத்தில் உள்ள தெளிவின்மையைப் பாதுகாக்கிறது; நிர்வாகச் சூழலுக்கேற்றவாறு ‘குலவரிசைப்படி பதிவு’ மற்றும் ‘பதிவேடு’ பயன்படுத்தப்பட்டுள்ளன.
