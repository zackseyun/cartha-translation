lexical_decisions:
- source_word: בְּנֵי
  choice: மகன்கள்
  rationale: இந்தக் கணக்குப் பட்டியலில் குடும்பம் அல்லது குலத்தைச் சேர்ந்த ஆண் வழியினரைக் குறிக்கும் எபிரெயச் சொல்லை முறையாகவும் சுருக்கமாகவும் பிரதிபலிக்கிறது; இங்கு உடனடிப் புதல்வர்கள் மட்டுமே என்று பொருள் கொள்ள வேண்டியதில்லை.
- source_word: פַשְׁחוּר
  choice: பஸ்கூர்
  rationale: தனிப்பட்ட பெயர் என்பதால் அதன் எபிரெய உச்சரிப்பைத் தமிழில் ஒலிபெயர்த்துள்ளது.
- source_word: אֶלֶף מָאתַיִם אַרְבָּעִים וְשִׁבְעָה
  choice: 1,247 பேர்
  rationale: எபிரெய எண்ணின் மொத்தம் 1,247. கணக்குப் பட்டியலை எளிதில் வாசிக்க எண்ணுருக்கள் பயன்படுத்தப்பட்டுள்ளன; தமிழில் மனிதர்களின் எண்ணிக்கையை இயல்பாகக் காட்ட ‘பேர்’ சேர்க்கப்பட்டுள்ளது.
