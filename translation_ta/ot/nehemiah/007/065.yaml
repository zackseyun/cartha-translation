base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/007/065.yaml
  text: And the governor said to them that they should not eat from the most holy things until a priest should arise with Urim and Thummim[a][b].
translation:
  language: ta
  text: ஆளுநர்[a] அவர்களிடம், ஊரீமும் தும்மீமும் உடைய ஒரு ஆசாரியர் எழும்பும்வரை, அவர்கள் மிகப் பரிசுத்தமானவற்றிலிருந்து[b] உண்ணக்கூடாது என்று கூறினார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘திர்ஷாதா’; இது ஒரு பாரசீக நிர்வாகப் பட்டம்.
    reason: lexical_alternative
  - marker: b
    text: அதாவது, ‘மிகப் பரிசுத்தமானவை’ என வகைப்படுத்தப்பட்ட ஆசாரியர்களுக்குரிய பரிசுத்த உணவுப் பங்குகள்; இது ஆலயத்தின் மகா பரிசுத்த ஸ்தலத்தைக் குறிக்கவில்லை.
    reason: cultural_note
lexical_decisions:
- source_word: הַתִּרְשָׁתָא
  choice: ஆளுநர்
  rationale: இது ஒரு பாரசீக நிர்வாகப் பட்டம். நவீன வாசகர்களுக்குப் பதவியின் பொருள் தெளிவாக இருக்க மொழிபெயர்க்கப்பட்டது; ஒலிபெயர்ப்பு அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: אֲשֶׁר לֹא יֹאכְלוּ
  choice: அவர்கள் ... உண்ணக்கூடாது என்று
  rationale: ஆளுநர் விதித்த தடையைத் தமிழில் இயல்பான மறைமுகக் கூற்றாக வெளிப்படுத்துகிறது.
- source_word: מִקֹּדֶשׁ הַקֳּדָשִׁים
  choice: மகா பரிசுத்தமான காணிக்கைகளிலிருந்து
  rationale: சொற்றொடரின் உயர்நிலைப் பொருளையும், சூழலில் அது ஆசாரியர்களுக்குரிய பரிசுத்த உணவுப் பங்குகளைக் குறிப்பதையும் தெளிவுபடுத்துகிறது; மகா பரிசுத்த ஸ்தலத்தைக் குறிப்பதாகத் தவறாகப் புரிந்துகொள்வதைத் தவிர்க்கிறது.
- source_word: עַד עֲמֹד הַכֹּהֵן
  choice: ஒரு ஆசாரியர் தோன்றும்வரை
  rationale: தடை நீடிக்கும் எதிர்கால எல்லையைக் குறிக்கிறது. எபிரெயக் குறிப்புச்சொல் இங்கு முன்பு குறிப்பிடப்பட்ட ஒருவரைக் காட்டாமல், தேவையான ஆசாரியப் பொறுப்பாளரைப் பொதுவாகக் குறிக்கலாம்.
- source_word: לְאוּרִים וְתוּמִּים
  choice: ஊரீமும் தும்மீமும் கொண்டு விசாரிக்கக்கூடிய
  rationale: மரபான பெயர்கள் ஒலிபெயர்க்கப்பட்டுள்ளன. எபிரெய முன்னிடைச்சொல் இங்கு அவற்றைக் கொண்டு இறைவனுடைய தீர்ப்பை அறியும் ஆசாரியச் செயல்பாட்டைக் குறிக்கிறது; தமிழில் வாக்கியத் தொடர்பைத் தெளிவாக்க ‘விசாரிக்கக்கூடிய’ சேர்க்கப்பட்டுள்ளது.
theological_decisions:
- issue: ‘மகா பரிசுத்தமானவை’ என்பதன் குறிப்பு
  choice: ஆசாரியர்களுக்குரிய மிகப் பரிசுத்தமான காணிக்கைகள் அல்லது உணவுப் பங்குகள்
  alternative: ஆலயத்தின் மகா பரிசுத்த ஸ்தலம்
  rationale: முந்தைய வசனங்களின் சூழல், ஆசாரிய வம்சாவளி உறுதிசெய்யப்படாதவர்கள் பரிசுத்த உணவை உண்ணலாமா என்பதே பிரச்சினை என்று காட்டுகிறது; ஆலயத்தின் உட்பகுதிக்குள் நுழைவது இங்கு பேசப்படவில்லை.
- issue: பாரசீகப் பட்டத்தின் மொழிபெயர்ப்பு
  choice: ஆளுநர்
  alternative: திர்ஷாதா
  rationale: இது தனிப்பெயர் அல்ல, நிர்வாகப் பட்டம். பொருளைத் தெளிவாகக் கூறும் மொழிபெயர்ப்பு முதன்மை உரையில் வைக்கப்பட்டு, மூல வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: ஊரீமும் தும்மீமும் தொடர்பான ஆசாரியரின் செயல்
  choice: அவற்றைக் கொண்டு விசாரிக்கக்கூடிய ஆசாரியர்
  alternative: ஊரீமும் தும்மீமும் உடைய ஆசாரியர்
  rationale: לְ என்ற முன்னிடைச்சொல் துல்லியமாக எவ்வகை தொடர்பைக் குறிக்கிறது என்பது விரிவானது. சூழலில் இவை தெய்வீகத் தீர்ப்பறிதலுக்கான ஆசாரிய வழிமுறை என்பதால் தமிழில் செயல்பாட்டு உறவு இயல்பாக வெளிப்படுத்தப்படுகிறது; அவற்றின் இயல்பைப் பற்றி மேலதிக கோட்பாடு சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீன தரநிலைத் தமிழில், மரியாதையும் வேதாகமச் செறிவும் கொண்ட இயல்பான நடை பயன்படுத்தப்பட்டுள்ளது. ‘ஆசாரியர்’, ‘காணிக்கைகள்’, ‘மகா பரிசுத்தமான’ போன்ற பரவலாக அறியப்பட்ட சமயச் சொற்கள் தக்கவைக்கப்பட்டுள்ளன. எல்லா அடிக்குறிப்பு குறியீடுகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
