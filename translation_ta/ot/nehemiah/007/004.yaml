  text: וְ/הָ/עִ֞יר רַחֲבַ֤ת יָדַ֨יִם֙ וּ/גְדוֹלָ֔ה וְ/הָ/עָ֥ם מְעַ֖ט בְּ/תוֹכָ֑/הּ וְ/אֵ֥ין בָּתִּ֖ים בְּנוּיִֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/007/004.yaml
  text: The city was wide and large[a], but the people within it were few, and no houses had been built.
translation:
  language: ta
  text: நகரம் பரந்தும் பெரியதுமாக இருந்தது[a]. ஆனால் அதற்குள் மக்கள் சிலரே இருந்தார்கள்; கட்டப்பட்ட வீடுகள் எதுவும் இல்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நகரம் பரந்தும் பெரியதுமாக இருந்தது; அதற்குள் மக்கள் சிலரே இருந்தார்கள்; கட்டப்பட்ட வீடுகளும் இல்லை.” எபிரெயத்தில் இக்கூறுகள் ‘மற்றும்’ என்ற இணைப்புத் தொடர்பில் வருகின்றன; முதன்மைப் பாடம் அந்தத் தொடர்பை இயல்பான தமிழில் முரண்பாட்டை வெளிப்படுத்தும் வகையில் அமைக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָעִיר
  choice: நகரம்
  rationale: הָעִיר என்பது ‘நகரம்’ என்று நேரடியாகப் பொருள்படும். முன்னொட்டு וְ-ஐ தனியாக ‘மேலும்’ என்று மொழிபெயர்ப்பதைவிட, தமிழின் இயல்பான உரையோட்டத்தில் அடுத்துள்ள வாக்கியத் தொடர்புகளால் அதன் இணைப்புத் தன்மை வெளிப்படுகிறது.
- source_word: רַחֲבַת יָדַיִם
  choice: பரந்தும்
  rationale: ‘கைகளில் அகன்றது’ என்ற சொல்லடிப்படையைக் கொண்ட இந்த எபிரெய மரபுத்தொடர், நகரத்தின் பரந்த இடப்பரப்பைக் குறிக்கிறது. ‘பரந்த’ என்பது இன்றைய தமிழில் இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: וּגְדוֹלָה
  choice: பெரியதுமாக
  rationale: இங்கு גָּדוֹל நகரத்தின் அந்தஸ்தை அல்ல, அதன் அளவைச் சுட்டுகிறது. ஆகவே ‘பெரிய’ என்பது தெளிவான இணைச்சொல்.
- source_word: וְהָעָם מְעַט
  choice: ஆனால் அதற்குள் மக்கள் சிலரே இருந்தார்கள்
  rationale: מְעַט என்பது எண்ணிக்கையில் குறைவைக் குறிக்கிறது. பெரிய நகரத்திற்கும் குறைந்த மக்களுக்கும் இடையிலுள்ள மறைமுக முரண்பாட்டை இயல்பான தமிழில் ‘ஆனால்’ வெளிப்படுத்துகிறது; ‘சிலரே’ மக்கள் எண்ணிக்கை குறைவாக இருந்ததைத் துல்லியமாகக் கூறுகிறது.
- source_word: בְּתוֹכָהּ
  choice: அதற்குள்
  rationale: இந்தச் சொல் ‘அதன் நடுவில்/அதற்குள்’ எனப் பொருள்படும். நகரத்தின் எல்லைக்குள் இருந்த மக்களைக் குறிக்க ‘அதற்குள்’ இயல்பானது.
- source_word: וְאֵין בָּתִּים בְּנוּיִם
  choice: வீடுகள் எதுவும் கட்டப்பட்டிருக்கவில்லை
  rationale: אֵין இல்லாமையையும், בְּנוּיִם ‘கட்டப்பட்ட’ என்ற செயல்நிலைப் பொருளையும் தருகின்றன. எபிரெயத்தில் ‘மீண்டும் கட்டப்பட்ட’ என்று வெளிப்படையாக இல்லாததால் ‘கட்டப்பட்டிருக்கவில்லை’ என நெருக்கமாக மொழிபெயர்க்கப்பட்டுள்ளது.
