lexical_decisions:
- source_word: בְּנֵי
  choice: சேர்ந்தவர்கள்
  rationale: இது எழுத்துப்படி ‘மகன்கள்’ என்றாலும், இங்குள்ள குடிமதிப்புப் பட்டியலில் ஓர் ஊரைச் சேர்ந்த மக்கள் அல்லது குழுவினரைக் குறிக்கிறது. இயல்பான நவீன தமிழில் அந்தப் பொருளைத் தெளிவாக வழங்க ‘சேர்ந்தவர்கள்’ பயன்படுத்தப்பட்டது.
- source_word: יְרֵחוֹ
  choice: எரிகோ
  rationale: இடப்பெயர்; தமிழில் வழக்கிலுள்ள வேதாகமப் பெயர்வடிவம் பயன்படுத்தப்பட்டது.
- source_word: שְׁלֹשׁ מֵאוֹת אַרְבָּעִים וַחֲמִשָּׁה
  choice: முந்நூற்று நாற்பத்தைந்து பேர்
  rationale: எபிரெய எண்ணிக்கை 345. பட்டியலிடப்பட்ட மனிதர்களின் எண்ணிக்கை என்பதால் இயல்பான தமிழுக்காக ‘பேர்’ சேர்க்கப்பட்டது.
