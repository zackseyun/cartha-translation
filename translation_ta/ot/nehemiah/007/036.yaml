  source_fidelity: எபிரெய மூலத்தின் בְּנֵי יְרֵחוֹ ('எரிகோவின் மகன்கள்/சந்ததியினர்') என்பது இந்தத் திரும்பிவந்தோர் பட்டியலின் சூழலில் எரிகோவைச் சேர்ந்த குழுவினரைக் குறிக்கிறது. “எரிகோவைச் சேர்ந்தவர்கள்” அந்தக் குழு/தோற்ற அடையாளப் பொருளைத் தக்கவைத்து, உயிரியல் மகன்கள் என்ற தேவையற்ற குறுக்கமான பொருளைத் தவிர்க்கிறது. எண்ணிக்கை 345 துல்லியமாக மொழிபெயர்க்கப்பட்டுள்ளது.
  naturalness: “எரிகோவைச் சேர்ந்தவர்கள் முந்நூற்று நாற்பத்தைந்து பேர்.” என்பது நவீன நிலையான தமிழில் சுருக்கமாகவும் பட்டியல் நடைக்குப் பொருத்தமாகவும் உள்ளது. “பேர்” என்பது மனிதர் எண்ணிக்கையை இயல்பாகத் தெளிவுபடுத்துகிறது.
  terminology: “எரிகோ” தமிழ்வேதாகம வழக்கிற்கு ஏற்ற இடப்பெயர் வடிவம். இவ்வசனத்தில் தனிப்பட்ட இறையியல் சொற்கள் இல்லை. “சேர்ந்தவர்கள்” என்பது குடிமதிப்புப்/மரபுக் குழுப் பட்டியலின் சூழலுக்குப் பொருத்தமான, மதச்சார்பற்ற சொல் தேர்வாகும்.
