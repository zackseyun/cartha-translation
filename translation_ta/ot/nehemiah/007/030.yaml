lexical_decisions:
- source_word: אַנְשֵׁי
  choice: ஊர்களைச் சேர்ந்த ஆண்கள்
  rationale: אִישׁ என்பதன் பன்மை இணைப்புநிலை வடிவம்; இந்தக் கணக்குப் பட்டியலில் இடங்களுடன் தொடர்புடைய ஆண் உறுப்பினர்களைக் குறிக்கிறது. தமிழில் இயல்பான பட்டியல் நடைக்காக இடப்பெயர்களுடன் இணைத்து மொழிபெயர்க்கப்பட்டது; எபிரெயச் சொல்லின் பாலினக் குறிப்பும் காக்கப்பட்டது.
- source_word: הָרָמָה
  choice: ராமா
  rationale: இது ஓர் இடப்பெயர்; பொருள் மொழிபெயர்ப்புக்குப் பதிலாகத் தமிழில் ஒலிபெயர்க்கப்பட்டது.
- source_word: וָגָבַע
  choice: கேபா
  rationale: WLC உரையின் மெய்யெழுத்து வடிவம் גבע என்பதால் ‘கேபா’ என ஒலிபெயர்க்கப்பட்டது; ஒத்த இடப்பெயரான ‘கிபியா’ என்று மாற்றப்படவில்லை.
- source_word: שֵׁשׁ מֵאוֹת עֶשְׂרִים וְאֶחָד
  choice: அறுநூற்று இருபத்தொன்று பேர்
  rationale: எண்ணிக்கை இயல்பான தமிழ்ச் சொல் வடிவில் தரப்பட்டது; மனிதர்களின் எண்ணிக்கை என்பதால் ‘பேர்’ சேர்க்கப்பட்டது.
