  rationale: வம்ச/மக்கள்தொகைப் பட்டியலில் இது ஒரு குடும்ப அல்லது குலக் குழுவைக் குறிக்கலாம். எபிரெயச் சொல்லின் வடிவத்தைப் பேணும் வகையில் ‘மகன்கள்’ என மொழிபெயர்க்கப்பட்டது; இங்கு அது ஆரீமின் குடும்பத்தாரைக் கூட்டாகக் குறிக்கிறது.
