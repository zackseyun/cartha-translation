translation:
  language: ta
  text: மற்ற நெபோவைச் சேர்ந்த ஆண்கள்[a] ஐம்பத்திரண்டு பேர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இன்னொரு நெபோவைச் சேர்ந்த ஆண்கள்.” எபிரெயப் பெயரடை “மற்ற” அல்லது “இன்னொரு” என்று பொருள்படலாம்; பட்டியலில் வேறொரு இடத்தில் குறிப்பிடப்பட்டுள்ள நெபோவிலிருந்து இந்த இடத்தை இது வேறுபடுத்துவதாக இருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַנְשֵׁי
  choice: சேர்ந்த ஆண்கள்
  rationale: אִישׁ என்பதன் பன்மை இணைப்புநிலை வடிவம். மக்கள் கணக்குப் பட்டியல் சூழலில் ஓர் ஊரைச் சேர்ந்த ஆண்களை அல்லது குடும்பப் பிரதிநிதிகளைக் குறிக்கிறது; இயல்பான தமிழுக்காக இடப்பெயருடன் ‘சேர்ந்த ஆண்கள்’ என வழங்கப்பட்டது.
- source_word: נְבוֹ
  choice: நெபோ
  rationale: இது ஓர் இடப்பெயர்; அதன் எபிரெய உச்சரிப்பை அணுகும் வகையில் தமிழில் ஒலிபெயர்க்கப்பட்டது.
- source_word: אַחֵר
  choice: மற்ற
  rationale: இந்தப் பெயருடைய வேறொரு இடத்திலிருந்து இதை வேறுபடுத்தும் ‘other/another’ என்ற பொருளை ‘மற்ற’ இயல்பாகத் தருகிறது; மூலத்தின் சாத்தியமான மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டது.
- source_word: חֲמִשִּׁים וּשְׁנָיִם
  choice: ஐம்பத்திரண்டு பேர்
  rationale: எபிரெய எண்ணான ‘ஐம்பதும் இரண்டும்’ என்பதை நவீனத் தமிழின் வழக்கமான எண் வடிவில் வழங்கி, பட்டியலின் நபர் எண்ணிக்கை தெளிவாக இருக்க ‘பேர்’ சேர்க்கப்பட்டது.
