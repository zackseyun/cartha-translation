  language: ta
  text: 'ஆராகின் மகன்கள்: அறுநூற்று ஐம்பத்திரண்டு பேர்.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי
  choice: மகன்கள்
  rationale: மக்கள்தொகைக் கணக்கெடுப்பு மற்றும் குலப்பட்டியல் சூழலில் இது சொல்லாட்சிப்படி ‘மகன்கள்’ எனப் பொருள்பட்டு, ஆராகைச் சேர்ந்த குலத்தாரைக் குறிக்கிறது. எபிரெய வடிவத்தைப் பேணுவதற்காக ‘வழிவந்தவர்கள்’ என்பதற்குப் பதிலாக ‘மகன்கள்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: אָרַח
  choice: ஆராகு
  rationale: இது ஒரு நபர் அல்லது குலத்தின் இயற்பெயர்; எபிரெய உச்சரிப்புக்கு நெருக்கமாக ஒலிபெயர்க்கப்பட்டது. வேற்றுமை உருபுடன் உரையில் ‘ஆராகின்’ என வருகிறது.
- source_word: שֵׁשׁ מֵאוֹת חֲמִשִּׁים וּשְׁנָיִם
  choice: அறுநூற்று ஐம்பத்திரண்டு
  rationale: எபிரெய எண்ணின் மொத்த மதிப்பை இயல்பான நவீனத் தமிழில் துல்லியமாக வழங்குகிறது.
