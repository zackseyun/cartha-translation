translation:
  language: ta
  text: பேபாயின் மகன்கள் அறுநூற்று இருபத்தெட்டுப் பேர்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי
  choice: மகன்கள்
  rationale: בֵּן என்பதன் பன்மை இணைப்புநிலை வடிவம். வம்சப் பட்டியல் சூழலில் இது குடும்பத்தாரையோ வழிவந்தவர்களையோ குறிக்கலாம்; மூலத்தின் முறையான அமைப்பைப் பாதுகாக்க ‘மகன்கள்’ என வழங்கப்பட்டது.
- source_word: בֵבָי
  choice: பேபாய்
  rationale: எபிரெய தனிப்பெயரின் ஒலிப்பை நவீனத் தமிழில் இயல்பாகப் பெயர்த்தெழுதுகிறது.
- source_word: שֵׁשׁ מֵאוֹת עֶשְׂרִים וּשְׁמֹנָה
  choice: அறுநூற்று இருபத்தெட்டுப் பேர்
  rationale: 628 என்ற துல்லியமான எண்ணிக்கையைத் தமிழின் இயல்பான எண் அமைப்பில் தருகிறது; பட்டியலிடப்பட்ட மனிதர்களின் எண்ணிக்கை என்பது தெளிவாக இருக்க ‘பேர்’ சேர்க்கப்பட்டது.
