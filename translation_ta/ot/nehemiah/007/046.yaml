  yaml_path: translation/ot/nehemiah/007/046.yaml
  text: 'The temple servants: the sons of Ziha[a], the sons of Hasupha[b], the sons of Tabbaoth.'
translation:
  language: ta
  text: 'ஆலயப் பணியாளர்கள்[a]: சிஹாவின் மகன்கள், ஹசூபாவின் மகன்கள், தப்பாவோத்தின் மகன்கள்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரெயத்தில் נְתִינִים (பாரம்பரிய ஒலிபெயர்ப்பு: ‘நெதினீம்’); ஆலயப் பணிக்கென நியமிக்கப்பட்ட ஒரு வகுப்பினரைக் குறிக்கும் தொழில்நுட்பச் சொல்.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנְּתִינִים
  choice: ஆலயப் பணியாளர்கள்
  rationale: நெதினீம் என்பது சிறையிருப்புக்குப் பிந்தைய நூல்களில் ஆலயப் பணிக்கென நியமிக்கப்பட்ட ஒரு குறிப்பிட்ட வகுப்பினரைக் குறிக்கும் தொழில்நுட்பச் சொல். வெறும் ஒலிபெயர்ப்பை விட அதன் பணியைத் தெளிவாகக் கூறும் இந்த மொழிபெயர்ப்பு இயல்பான நவீன தமிழில் புரிகிறது.
- source_word: בְּנֵי
  choice: மகன்கள்
  rationale: இத்தகைய வம்ச மற்றும் குடும்பப் பட்டியல்களில் இது நேரடியாக ‘மகன்கள்’ என்று பொருள்பட்டு, ஒரு குடும்ப அல்லது குலக் குழுவையும் குறிக்கலாம். மூலத்தின் பட்டியல் அமைப்பைப் பாதுகாக்க ‘மகன்கள்’ என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: צִחָא
  choice: சீகா
  rationale: எபிரெயப் பெயரின் ஒலியை நவீன தமிழில் வாசிக்க ஏற்றவாறு ஒலிபெயர்க்கிறது.
- source_word: חֲשֻׂפָא
  choice: ஹசூபா
  rationale: எபிரெயப் பெயரின் தொடக்க மெய்யொலியையும் நீண்ட உயிரொலியையும் இயன்றவரை காட்டும் தமிழ் ஒலிபெயர்ப்பு.
- source_word: טַבָּעוֹת
  choice: தப்பாவோத்
  rationale: எபிரெயப் பெயரிலுள்ள இரட்டித்த மெய்யையும் இறுதி ஒலியையும் பிரதிபலிக்கும் தமிழ் ஒலிபெயர்ப்பு.
