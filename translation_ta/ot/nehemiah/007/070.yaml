translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. ‘தாரிக்’, ‘மினா’ ஆகிய வரலாற்று அலகுகள் பெயர்மாற்றமின்றி ஒலிபெயர்க்கப்பட்டு அடிக்குறிப்புகளில் விளக்கப்பட்டன. எல்லா அடிக்குறிப்பு குறிகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
