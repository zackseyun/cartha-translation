base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/007/070.yaml
  text: 'And some of the heads of the fathers’ houses gave to the treasury for the work: twenty thousand gold darics and two thousand two hundred minas of silver[a][b][c].'
translation:
  language: ta
  text: தந்தைவழிக் குடும்பத் தலைவர்களில் சிலர் அந்தப் பணிக்கான கருவூலத்திற்கு இருபதாயிரம் தங்க தாரிக்குகளையும்[a] இரண்டாயிரத்து இருநூறு மினா வெள்ளியையும்[b] கொடுத்தார்கள்.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: தாரிக் என்பது பாரசீகத் தங்க நாணயம்.
    reason: cultural_note
  - marker: b
    text: மினா என்பது பழங்கால எடை அலகு; அது பண மதிப்பைக் குறிக்கவும் பயன்படுத்தப்பட்டது.
    reason: cultural_note
  - marker: c
    text: “தலைவர்களில் சிலர்” என்பதற்கு எபிரெயத்தில் இன்னும் சொல்லுக்குச் சொல் வடிவம், “தந்தைவழிக் குடும்பத் தலைவர்களிலிருந்து” என்பதாகும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמֵרָאשֵׁי הָאָבוֹת
  choice: தந்தைவழிக் குடும்பத் தலைவர்களில் சிலர்
  rationale: מִן என்பது இங்கு ‘தலைவர்களிலிருந்து/தலைவர்களில்’ என்ற பகுதியைக் குறிக்கும் பொருளில் வந்து, இயல்பான தமிழில் ‘சிலர்’ எனப் பொருள்படுகிறது. הָאָבוֹת குறிக்கும் மூதாதையர் சார்ந்த சமூக அமைப்பை ‘தந்தைவழிக் குடும்பம்’ துல்லியமாக வெளிப்படுத்துகிறது.
- source_word: נָתְנוּ
  choice: கொடுத்தார்கள்
  rationale: எளிய qal perfect வினையின் நேரடியான பொருளை, ‘நன்கொடையாக அளித்தார்கள்’ போன்ற கூடுதல் விளக்கமின்றிப் பாதுகாக்கிறது.
- source_word: לְאוֹצַר הַמְּלָאכָה
  choice: அந்தப் பணிக்கான கருவூலத்திற்கு
  rationale: אוֹצָר என்பதை மதிப்புள்ள பொருட்கள் வைக்கப்படும் ‘கருவூலம்’ என்றும், הַמְּלָאכָה என்பதை நிதியளிக்கப்பட்ட குறிப்பிட்ட பணி என்றும் இயல்பான தமிழில் தருகிறது.
- source_word: זָהָב דַּרְכְּמוֹנִים שְׁתֵּי רִבּוֹת
  choice: இருபதாயிரம் தங்க தாரிக்குகள்
  rationale: வரலாற்றுச் சிறப்புடைய பாரசீக நாணயப் பெயரை ஒலிபெயர்த்து வைத்ததுடன், ‘இரண்டு பத்தாயிரங்கள்’ என்பதைக் காலத்திற்கேற்ற எண் நடையில் தருகிறது.
- source_word: וְכֶסֶף מָנִים אַלְפַּיִם וּמָאתָיִם
  choice: இரண்டாயிரத்து இருநூறு மினா வெள்ளி
  rationale: மினா என்ற பழங்கால எடை/மதிப்பு அலகை அப்படியே பாதுகாத்து, வெள்ளியை அளவிடும் இயல்பான தமிழ் தொடராக அமைக்கிறது.
