  text: the sons of Gazzam[a], the sons of Uzza, the sons of Paseah.
translation:
  language: ta
  text: கஸ்ஸாமின் மகன்கள்[a], உஸ்ஸாவின் மகன்கள், பாசேயாவின் மகன்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இங்குள்ள ஒவ்வொரு ‘மகன்கள்’ என்பதையும் ‘சந்ததியினர்’ என்றும் மொழிபெயர்க்கலாம்; இந்த எபிரெய வம்சாவளிச் சொற்றொடர் உடனடியாகப் பிறந்த ஆண் பிள்ளைகளை மட்டுமல்லாமல், ஒரு விரிவான குடும்ப வம்சவரிசையையும் குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: மகன்கள்
  rationale: בֵּן என்பதன் இணைப்புநிலைப் பன்மை. வம்சப் பட்டியல் சூழலில் இது நேரடி மகன்களை மட்டுமல்லாமல் சந்ததியினரையோ ஒரு குடும்ப வழியைச் சேர்ந்தவர்களையோ குறிக்கலாம். மூலத்தின் வடிவத்தை வெளிப்படையாகப் பேணுவதற்காக ‘மகன்கள்’ என மொழிபெயர்க்கப்பட்டு, பரந்த பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: גַזָּם
  choice: கசாம்
  rationale: எபிரெய தனிப்பெயரின் ஒலிப்பெயர்ப்பு; גּ ஒலி ‘க’ என்றும், זּ ஒலி ‘ச’ என்றும், நீண்ட ā உயிர் ‘ஆ’ என்றும் பிரதிபலிக்கப்படுகிறது.
- source_word: עֻזָּא
  choice: ஊசா
  rationale: எபிரெய தனிப்பெயரின் தமிழ் ஒலிப்பெயர்ப்பு. தொடக்க ע தமிழில் தனியாகக் குறிக்கப்படாமல், உச்சரிப்புக்கு ஏற்ற ‘ஊ’ கொண்டு வழங்கப்படுகிறது; זּ ‘ச’ ஆகப் பிரதிபலிக்கப்படுகிறது.
- source_word: פָסֵחַ
  choice: பாசேயா
  rationale: எபிரெய தனிப்பெயரின் ஒலிப்பெயர்ப்பு. இறுதி ח தமிழ் வாசிப்பில் இயல்பாகவும் பெயரின் ஒலிவடிவத்திற்கு அருகிலும் இருக்க ‘யா’ இணைந்த வடிவில் வழங்கப்படுகிறது.
