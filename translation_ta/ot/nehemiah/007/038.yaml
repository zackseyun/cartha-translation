translation:
  language: ta
  text: 'செனாவாவின் மகன்கள்: மூவாயிரத்துத் தொள்ளாயிரத்து முப்பது பேர்.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי
  choice: மகன்கள்
  rationale: மக்கள்தொகைக் கணக்குப் பட்டியலின் சூழலில் இது ஒரு குடும்பம் அல்லது குலத்தைச் சேர்ந்தவர்களைக் குறிக்கிறது. ‘மகன்கள்’ என்பது எபிரெயச் சொல்லின் வடிவத்தை வெளிப்படையாகப் பேணும் வழக்கமான தமிழ் மொழிபெயர்ப்பு; இங்கு அது நேரடி ஆண் பிள்ளைகளை மட்டும் அல்லாமல் வழித்தோன்றல்களையும் கூட்டாகக் குறிக்கிறது.
- source_word: סְנָאָה
  choice: செனாவா
  rationale: இது ஒரு பெயர் என்பதால் பொருள் மொழிபெயர்ப்பு செய்யாமல், எபிரெய ஒலிவடிவத்தைத் தமிழில் இயல்பாக எழுத்துப்பெயர்த்துள்ளது.
- source_word: שְׁלֹשֶׁת אֲלָפִים תְּשַׁע מֵאוֹת וּשְׁלֹשִׁים
  choice: மூவாயிரத்துத் தொள்ளாயிரத்து முப்பது
  rationale: எபிரெய எண்ணுத் தொடரை இலக்கங்களாகச் சுருக்காமல், பட்டியல் நடைக்கு ஏற்ற இயல்பான தமிழ் எண்ணுச் சொற்களால் வழங்குகிறது.
theological_decisions: []
translation_notes:
  register: நவீனத் தரத் தமிழில், வம்சப் பட்டியலுக்கேற்ற சுருக்கமானதும் கண்ணியமானதுமான நடை. எண்ணிக்கை மனிதர்களைக் குறிக்கிறது என்பதைத் தெளிவாக்க ‘பேர்’ சேர்க்கப்பட்டுள்ளது.
