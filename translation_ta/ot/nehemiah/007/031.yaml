- source_word: אַנְשֵׁי
  choice: சேர்ந்த ஆண்கள்
  rationale: இது אִישׁ என்பதன் பன்மை இணைப்புநிலை வடிவம். திரும்பிவந்தவர்களின் பட்டியல் சூழலில், குறிப்பிட்ட ஊருடன் தொடர்புடைய ஆண்களைக் குறிக்கிறது; தமிழில் ஊர்ப்பெயருடன் ‘சேர்ந்த ஆண்கள்’ என்பது இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: מִכְמָס
  choice: மிக்மாஸ்
  rationale: எபிரெய இடப்பெயரின் மெய்யெழுத்து ஒலிகளை நெருக்கமாகப் பிரதிபலிக்கும் ஒலிபெயர்ப்பு.
- source_word: מֵאָה וְעֶשְׂרִים וּשְׁנָיִם
  choice: 122 பேர்
  rationale: எபிரெய எண்ணின் பொருள் ‘நூற்று இருபத்திரண்டு.’ பட்டியல் நடைக்கு இலக்கங்கள் தெளிவானவை; ‘பேர்’ மனிதர்களின் எண்ணிக்கை என்பதை இயல்பான தமிழில் காட்டுகிறது.
