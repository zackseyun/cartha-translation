  source_fidelity: 'எபிரெய மூலத்தின் கணக்கெடுப்புப் பட்டியல் அமைப்பு சரியாகப் பிரதிபலிக்கப்பட்டுள்ளது: மிக்மாஸுடன் தொடர்புடைய ஆண்களும் அவர்களின் எண்ணிக்கையான 122-உம் தெளிவாக உள்ளன. “பேர்” என்பது எண்ணிக்கைக்கான இயல்பான தமிழ் சேர்க்கை; மூலத்தின் பொருளை மாற்றுவதில்லை.'
  naturalness: '“மிக்மாஸைச் சேர்ந்த ஆண்கள்: 122 பேர்.” என்பது நவீனத் தரத் தமிழில் இயல்பான, சுருக்கமான பட்டியல் நடை. இடப்பெயரின் வேற்றுமை வடிவமான “மிக்மாஸைச்” சரியானது.'
