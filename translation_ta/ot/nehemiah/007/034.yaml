lexical_decisions:
- source_word: בְּנֵי
  choice: மகன்கள்
  rationale: குடும்பக் கணக்குப் பட்டியலை அறிமுகப்படுத்தும் בֵּן என்பதன் பன்மை இணைப்புவடிவம். மூலத்தின் வம்ச/குழு உறவை நேரடியாகப் பேணுவதற்காக ‘மகன்கள்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: עֵילָם
  choice: ஏலாம்
  rationale: இது ஒரு இயற்பெயர்; திரும்பிவந்தோரின் பட்டியலில் ஒரு குடும்பம் அல்லது குழுவைக் குறிக்கிறது. ஆகவே தமிழில் ஒலிபெயர்க்கப்பட்டது.
- source_word: אַחֵר
  choice: வேறொரு
  rationale: ‘வேறு/மற்றொரு’ எனப் பொருள்படும் பெயரடை. இவ்விடத்தில் முன்பு பட்டியலிடப்பட்ட ஏலாம் குழுவிலிருந்து இதை வேறுபடுத்துகிறது; ‘வேறொரு’ என்பது அந்த வேறுபாட்டை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: אֶלֶף מָאתַיִם חֲמִשִּׁים וְאַרְבָּעָה
  choice: 1,254 பேர்
  rationale: ‘ஆயிரத்து இருநூற்று ஐம்பத்து நான்கு’ என்ற துல்லிய எண்ணிக்கை, கணக்குப் பட்டியலில் எளிதாக வாசிக்க எண்ணுருவில் தரப்பட்டது; மனிதர்களின் எண்ணிக்கை என்பதால் ‘பேர்’ சேர்க்கப்பட்டது.
