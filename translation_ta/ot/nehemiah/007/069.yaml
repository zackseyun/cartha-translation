translation_notes:
  register: நடை நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் வேதாகம வரலாற்றுச் சூழலுக்கேற்ற கண்ணியத்துடனும் அமைக்கப்பட்டுள்ளது. குடும்ப அமைப்பு, நிர்வாகப் பட்டம், நாணயப் பெயர், மற்றும் உரை வேறுபாடு ஆகியவை தேவையான அளவு வெளிப்படையாகப் பாதுகாக்கப்பட்டுள்ளன.
