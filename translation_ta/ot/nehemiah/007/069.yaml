base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/007/069.yaml
  text: And some of the heads of the fathers’ houses gave to the work[a]. The governor gave to the treasury one thousand gold darics, fifty basins[c][b], and five hundred thirty-five priests’ tunics.
translation:
  language: ta
  text: குடும்பத் தலைவர்களில் சிலர் பணிக்காகக் கொடுத்தார்கள். ஆளுநர்[a] கருவூலத்திற்கு ஆயிரம் பொன் தாரிக் நாணயங்களையும்[b], ஐம்பது கிண்ணங்களையும், ஆசாரியர்களுக்கான ஐந்நூற்று முப்பத்தைந்து அங்கிகளையும்[c] கொடுத்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘திர்ஷாத்தா’; இது பாரசீக நிர்வாகப் பட்டம்.
    reason: lexical_alternative
  - marker: b
    text: தாரிக் என்பது பாரசீகப் பொன் நாணயம்.
    reason: cultural_note
  - marker: c
    text: எபிரெய உரையில் ‘ஐந்நூற்று முப்பத்தைந்து அங்கிகள்’ என்று உள்ளது. எஸ்றா 2:69-இலுள்ள இணைப் பகுதியில் ‘நூறு ஆசாரிய அங்கிகள்’ என்று உள்ளது; சில மொழிபெயர்ப்புகள் அந்த எண்ணுடன் ஒத்திசைக்கின்றன அல்லது வேறொரு உரை மரபைப் பிரதிபலிக்கின்றன.
    reason: textual_variant
lexical_decisions:
- source_word: וּמִקְצָת רָאשֵׁי הָאָבוֹת
  choice: மூதாதையர் குடும்பங்களின் தலைவர்களில் சிலர்
  rationale: குடும்ப அல்லது குல அமைப்பைக் குறிக்கும் எபிரெயச் சொல்லாட்சியையும், அந்தக் குழுவில் ஒரு பகுதியினர் என்ற பொருளையும் இயல்பான நவீன தமிழில் தருகிறது.
- source_word: לַמְּלָאכָה
  choice: பணிக்காக
  rationale: இங்கு குறிப்பிடப்படும் கட்டுமான அல்லது மறுசீரமைப்புப் பணிக்கான பங்களிப்பு என்பதைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: הַתִּרְשָׁתָא
  choice: ஆளுநர்
  rationale: பாரசீக நிர்வாகப் பட்டத்தை அதன் பணிப்பதவிப் பொருளில் வாசகர்களுக்குத் தெளிவாக மொழிபெயர்க்கிறது; மூலப் பட்டப்பெயர் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: לָאוֹצָר
  choice: கருவூலத்திற்கு
  rationale: மதிப்புமிக்க நன்கொடைகள் சேர்க்கப்பட்ட இடம் என்ற சூழலில் ‘கருவூலம்’ பொருத்தமானது.
- source_word: זָהָב דַּרְכְּמֹנִים אֶלֶף
  choice: ஆயிரம் பொன் தாரிக் நாணயங்கள்
  rationale: பாரசீகப் பொன் நாணயங்களைக் குறிக்கும் வரலாற்றுச் சொல்லை ஒலிபெயர்த்து, ‘நாணயங்கள்’ எனத் தெளிவுபடுத்துகிறது.
- source_word: מִזְרָקוֹת
  choice: கிண்ணங்கள்
  rationale: ஆலயச் சூழலில் பயன்படுத்தப்பட்ட பாத்திரங்களைக் குறிக்கும் சொல்லுக்கு மிகையாகத் தனிப்பொருள் சேர்க்காமல் இயல்பான பொதுப்பெயரைப் பயன்படுத்துகிறது.
- source_word: כָּתְנוֹת כֹּהֲנִים
  choice: ஆசாரியர்களுக்கான அங்கிகள்
  rationale: כָּתְנוֹת குறிக்கும் உடைகளை நவீன தமிழில் ‘அங்கிகள்’ எனவும், அவை ஆசாரியர்களுக்குரியவை என்பதைத் தெளிவாகவும் தருகிறது.
- source_word: שְׁלֹשִׁים וַחֲמֵשׁ מֵאוֹת
  choice: ஐந்நூற்று முப்பத்தைந்து
  rationale: மசோரா எபிரெய உரையின் எண் வடிவத்தை அப்படியே பின்பற்றுகிறது; இணைப் பகுதியிலுள்ள வேறுபாடு அடிக்குறிப்பில் குறிப்பிடப்படுகிறது.
