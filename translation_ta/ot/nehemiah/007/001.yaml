base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/007/001.yaml
  text: When the wall had been built and I had set up the doors[a], the gatekeepers, the singers[b], and the Levites were appointed.
translation:
  language: ta
  text: மதில் கட்டப்பட்டு[a], நான் கதவுகளைப் பொருத்தியபின், வாயிற்காவலர்களும் பாடகர்களும் லேவியர்களும் நியமிக்கப்பட்டார்கள்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “கட்டி முடிக்கப்பட்டு” என்றும் மொழிபெயர்க்கலாம். எபிரெய வினை செயப்பாட்டு வடிவில் உள்ளது; தமிழில் நிகழ்ச்சி வரிசைக்கேற்ப இவ்வாறு கொடுக்கப்பட்டுள்ளது.
    reason: lexical_alternative
  - marker: b
    text: “பொறுப்பளிக்கப்பட்டார்கள்” அல்லது “பட்டியலில் சேர்க்கப்பட்டார்கள்” என்றும் மொழிபெயர்க்கலாம்; எபிரெய வினை முறையான நியமனத்தைவிட விரிவான நிர்வாகப் பொருளைக் கொள்ளக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר
  choice: …பின்
  rationale: இந்த எபிரெயச் சொற்றொடர் பின்னணிச் சூழலைக் காட்டும் கால வாக்கியத்தைத் தொடங்குகிறது. தமிழில் இயல்பான நிகழ்ச்சி வரிசையை வெளிப்படுத்த ‘…பின்’ பயன்படுத்தப்பட்டது; தனியாக ‘அப்போது நிகழ்ந்தது’ என மொழிபெயர்ப்பது செயற்கையாக இருக்கும்.
- source_word: נִבְנְתָה הַחוֹמָה
  choice: மதில் கட்டப்பட்டு
  rationale: בנה என்பதன் நிஃபால் வடிவம் செயல்பாட்டு வினையாக இருப்பதால் ‘கட்டப்பட்டு’ என்று மொழிபெயர்க்கப்பட்டது. ‘மீண்டும் கட்டப்பட்டு’ என்பது சூழலுக்குப் பொருந்தினாலும், ‘மீண்டும்’ என்ற கருத்து இவ்வினையில் வெளிப்படையாக இல்லை.
- source_word: וָאַעֲמִיד הַדְּלָתוֹת
  choice: நான் கதவுகளைப் பொருத்தியபின்
  rationale: עמד என்பதன் ஹிஃபில் வடிவம் இங்கு கதவுகளை அவற்றின் இடத்தில் நிறுத்துதல் அல்லது அமைத்தலைக் குறிக்கிறது. கதவுகளுடன் ‘பொருத்துதல்’ என்பது நவீன தமிழில் இயல்பும் துல்லியமும் உடையது.
- source_word: וַיִּפָּקְדוּ
  choice: நியமிக்கப்பட்டார்கள்
  rationale: פקד என்பதன் நிஃபால் வடிவம் நிர்வாகச் சூழலில் நியமித்தல், பொறுப்பளித்தல் அல்லது பட்டியலில் சேர்த்தல் ஆகிய பொருள்களைக் கொள்ளலாம். இங்கு பணியாளர்களை ஒழுங்குபடுத்தும் சூழலுக்கு ‘நியமிக்கப்பட்டார்கள்’ தெளிவாகப் பொருந்துகிறது.
- source_word: הַשּׁוֹעֲרִים
  choice: வாயிற்காவலர்கள்
  rationale: நகர அல்லது ஆலய வாயில்களைக் காக்கும் பணியாளர்களைக் குறிக்கும் வழக்கமான, புரிந்துகொள்ளத்தக்க தமிழ்ச் சொல்.
- source_word: הַמְשֹׁרְרִים
  choice: பாடகர்கள்
  rationale: שׁיר வேரிலிருந்து வந்த இச்சொல், குறிப்பாக வழிபாட்டுப் பணியில் பாடுவோரைக் குறிக்கிறது; ‘பாடகர்கள்’ அதன் நேரடியான பொருளைத் தருகிறது.
- source_word: הַלְוִיִּם
  choice: லேவியர்கள்
  rationale: இது லேவி கோத்திரத்தைச் சேர்ந்தவர்களுக்கான நிலையான தமிழ்ப் பெயர்; பதவிப் பெயராக மாற்றாமல் இன-சமயக் குழுப்பெயராக வைக்கப்பட்டது.
