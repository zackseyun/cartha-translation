  register: குடும்பப் பட்டியலுக்கேற்ற சுருக்கமான, dignified நவீனத் தமிழ் நடை பயன்படுத்தப்பட்டுள்ளது. ஒவ்வொரு பெயருக்கும் முன் வரும் בְּנֵי என்பதன் மீளுருவாக்கம் தமிழிலும் காக்கப்பட்டுள்ளது; வசனம் தொடரும் பட்டியலைச் சுட்டும் நீண்ட கோட்டுடன் முடிகிறது.
