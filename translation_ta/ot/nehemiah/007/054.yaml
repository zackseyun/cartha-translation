translation:
  language: ta
  text: பஸ்லீத்தின் சந்ததியினர், மெஹீதாவின் சந்ததியினர், ஹர்ஷாவின் சந்ததியினர்—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי
  choice: சந்ததியினர்
  rationale: இக்குடும்பப் பட்டியல் சூழலில், இந்தச் சொல் நேரடியான மகன்களை மட்டும் அல்லாமல் ஒரு மூதாதையரின் வழிவந்த குடும்பத்தாரையோ குலத்தாரையோ குறிக்கிறது. எனவே இயல்பான நவீனத் தமிழில் ‘சந்ததியினர்’ என வழங்கப்பட்டது.
- source_word: בַצְלִית
  choice: பஸ்லீத்
  rationale: இது மொழிபெயர்க்கப்பட வேண்டிய பொதுப்பெயர் அல்ல, தனிப்பெயர். எபிரெய ஒலியமைப்புக்கு அண்மையாகத் தமிழில் ஒலிபெயர்க்கப்பட்டது.
- source_word: מְחִידָא
  choice: மெகிதா
  rationale: தனிப்பெயரானதால் எபிரெய மெய்-உயிர் அமைப்பைப் பின்பற்றி தமிழில் ஒலிபெயர்க்கப்பட்டது.
- source_word: חַרְשָׁא
  choice: கர்சா
  rationale: இங்கு இது பொருள் விளக்கப்பட வேண்டிய சொலாக அல்லாமல் தனிப்பெயராகச் செயல்படுகிறது; ஆகவே எபிரெய ஒலிக்கு அண்மையாக ஒலிபெயர்க்கப்பட்டது.
