translation:
  language: ta
  text: பெத்லெகேம், நெத்தோபா ஆகிய ஊர்களைச் சேர்ந்த ஆண்கள்[a] நூற்று எண்பத்தெட்டுப் பேர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘பெத்லெகேம், நெத்தோபா ஆகிய ஊர்களைச் சேர்ந்த மக்கள்.’ எபிரெயத்தில் சொல்லுக்குச் சொல், ‘பெத்லெகேம் மற்றும் நெத்தோபாவைச் சேர்ந்த ஆண்கள்’; மக்கள்தொகை மற்றும் திரும்பிவந்தோர் பட்டியல்களில் இது வழக்கமான சொற்றொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַנְשֵׁי
  choice: ஊர்களைச் சேர்ந்த ஆண்கள்
  rationale: אִישׁ என்பதன் பன்மை இணைப்புவடிவம்; திரும்பிவந்தோரின் பட்டியல் சூழலில் இரு ஊர்களைச் சேர்ந்த ஆண்களைக் குறிக்கிறது. எபிரெய மூலத்தின் ஆண்பால் குறிப்பைப் பாதுகாக்கும் இயல்பான நவீனத் தமிழ் நடை.
- source_word: בֵית לֶחֶם
  choice: பெத்லெகேம்
  rationale: இது ஓர் ஊர்ப்பெயர்; பொருளாக்காமல் தமிழில் வழக்கமான ஒலிபெயர்ப்பு பயன்படுத்தப்பட்டது.
- source_word: וּנְטֹפָה
  choice: நெத்தோபா
  rationale: இணைப்பிடைச்சொல்லுடன் வரும் ஊர்ப்பெயர். பெத்லெகேமும் நெத்தோபாவும் ஒரே மொத்த எண்ணிக்கையின்கீழ் இணைக்கப்பட்டுள்ளதைத் தமிழில் ‘ஆகிய’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: מֵאָה שְׁמֹנִים וּשְׁמֹנָה
  choice: நூற்று எண்பத்தெட்டு
  rationale: எபிரெய எண்ணுத்தொடர் 188 என்ற மொத்தத்தைக் குறிக்கிறது; தமிழின் இயல்பான எண்ணுருவில் தரப்பட்டது.
