lexical_decisions:
- source_word: בְּנֵי
  choice: மகன்கள்
  rationale: எபிரெய மரபுவழிப் பட்டியல்களில் இந்தக் கட்டமைப்பு நேரடி ஆண் பிள்ளைகளை மட்டுமல்லாமல் ஒரு குடும்ப வழியைச் சேர்ந்த வழித்தோன்றல்களையும் குறிக்கலாம். மூலத்தின் திரும்பத் திரும்ப வரும் முறையான அமைப்பைப் பாதுகாக்க ‘மகன்கள்’ என மொழிபெயர்த்து, அதன் விரிவான பொருளை அடிக்குறிப்பில் குறிப்பிட்டுள்ளோம்.
- source_word: קֵירֹס
  choice: கேரோஸ்
  rationale: எபிரெய உச்சரிப்பை நெருக்கமாகப் பிரதிபலிக்கும் வகையில் பெயர் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: סִיעָא
  choice: சியா
  rationale: பெயருக்கு விளக்கப் பொருள் சேர்க்காமல், எபிரெய வடிவை இயல்பான தமிழில் ஒலிபெயர்க்கிறது.
- source_word: פָדוֹן
  choice: பாதோன்
  rationale: எபிரெய மெய்-உயிர் ஒலிகளை நெருக்கமாகப் பிரதிபலிக்கும் தமிழ் ஒலிபெயர்ப்பு.
