    text: இங்கு ஒவ்வொரு முறையும் வரும் “மகன்கள்” என்பதை “வழித்தோன்றல்கள்” என்றும் மொழிபெயர்க்கலாம்; இந்த எபிரெய மரபுவழிச் சொற்றொடர் நேரடி ஆண் பிள்ளைகளை மட்டுமல்லாமல் விரிவான குடும்ப வழியையும் குறிக்கக்கூடும்.
