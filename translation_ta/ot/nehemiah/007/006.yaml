revisions:
- from: பாபிலோன் அரசன் நேபுகாத்நேச்சார் சிறைப்பிடித்துச் சென்ற நாடுகடத்தப்பட்டவர்களின் சிறையிருப்பிலிருந்து திரும்பி வந்த மாகாணத்தின் மக்கள் இவர்களே. இவர்கள் எருசலேமுக்கும் யூதாவுக்கும், அவரவர் தங்கள் நகரத்திற்குத் திரும்பினார்கள்:[a]
  to: 'பாபிலோன் அரசன் நேபுகாத்நேச்சார் நாடுகடத்திய நாடுகடத்தப்பட்டோரின் சிறையிருப்பிலிருந்து மேலே வந்த மாகாண மக்கள் இவர்கள். இவர்கள் எருசலேமுக்கும் யூதாவுக்கும், அவரவர் தம் நகரத்திற்கு[a] திரும்பினார்கள்:'
  rationale: வசனத்தின் பொருளை மாற்றாமல், עלה மற்றும் שׁוּב என்ற இரண்டு வினைச்சொற்களின் வேறுபாட்டைத் தெளிவுபடுத்த “திரும்பி வந்த” என்பதற்குப் பதிலாக “மேலே வந்த” எனத் திருத்தப்பட்டுள்ளது. “திரும்பினார்கள்” என்பது வַיָּשׁוּבוּ-வைத் தொடர்ந்து மொழிபெயர்க்கிறது. அடிக்குறிப்பு அடையாளமும் அது விளக்கும் பகிர்வுத் தொடருக்கு அருகில் வைக்கப்பட்டுள்ளது.
