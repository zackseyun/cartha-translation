source:
  edition: WLC
  text: אֵ֣לֶּה בְּנֵ֣י הַ/מְּדִינָ֗ה הָ/עֹלִים֙ מִ/שְּׁבִ֣י הַ/גּוֹלָ֔ה אֲשֶׁ֣ר הֶגְלָ֔ה נְבוּכַדְנֶצַּ֖ר מֶ֣לֶךְ בָּבֶ֑ל וַ/יָּשׁ֧וּבוּ לִֽ/ירוּשָׁלִַ֛ם וְ/לִ/יהוּדָ֖ה אִ֥ישׁ לְ/עִירֽ/וֹ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/007/006.yaml
  text: 'These are the sons of the province who came up from the captivity of the exiles[a], whom Nebuchadnezzar king of Babylon had carried away, and who returned to Jerusalem and to Judah[c][b], each man to his city:'
translation:
  language: ta
  text: 'பாபிலோன் அரசன் நேபுகாத்நேச்சார் நாடுகடத்திய நாடுகடத்தப்பட்டோரின் சிறையிருப்பிலிருந்து மேலே வந்த மாகாண மக்கள் இவர்கள். இவர்கள் எருசலேமுக்கும் யூதாவுக்கும், அவரவர் தம் நகரத்திற்கு[a] திரும்பினார்கள்:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அவரவர் தம் நகரத்திற்கு” என்பது சொற்பட, “ஒவ்வொரு ஆணும் தன் நகரத்திற்கு.” இது திரும்பி வந்தவர்களை அவரவர் குடும்பம் அல்லது குடியிருப்பு அலகின்படி பகிர்ந்து குறிப்பிடும் தொடராகும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי הַמְּדִינָה
  choice: மாகாணத்தின் மக்கள்
  rationale: בְּנֵי என்பதன் சொற்பொருள் ‘மகன்கள்’ என்றாலும், இப்பட்டியல் சூழலில் அது ஒரு பகுதியைச் சேர்ந்த மக்களைக் குறிக்கும் எபிரெய மரபுத்தொடர். இயல்பான நவீன தமிழில் ‘மாகாணத்தின் மக்கள்’ அந்தப் பொருளைத் தெளிவாக வழங்குகிறது; הַמְּדִינָה பாரசீகக் கால நிர்வாக மாகாணத்தைக் குறிக்கிறது.
- source_word: הָעֹלִים
  choice: திரும்பி வந்த
  rationale: சொற்பட ‘மேலே வந்தவர்கள்.’ எருசலேம்/யூதாவை நோக்கிச் செல்வதற்கான வழக்கமான ஏறிச் செல்லும் மொழி இது. தமிழில் தனியே ‘மேலே வந்த’ என்பது திசைசார் குழப்பத்தை உண்டாக்கக்கூடும்; சூழலில் இயல்பாகப் புரிய ‘திரும்பி வந்த’ என வழங்கப்பட்டது.
- source_word: מִשְּׁבִי הַגּוֹלָה
  choice: நாடுகடத்தப்பட்டவர்களின் சிறையிருப்பிலிருந்து
  rationale: שְׁבִי மற்றும் גּוֹלָה ஆகிய தொடர்புடைய இரு பெயர்ச்சொற்களையும் பிரதிபலித்து, சிறைநிலையையும் நாடுகடத்தப்பட்ட மக்களையும் வேறுபடுத்திக் காட்டுகிறது.
- source_word: אֲשֶׁר הֶגְלָה
  choice: சிறைப்பிடித்துச் சென்ற
  rationale: நேபுகாத்நேச்சார் அவர்களை வலுக்கட்டாயமாக அகற்றியதை இயல்பான தமிழில் கூறுகிறது. ‘நாடுகடத்திய’ என்பதும் சாத்தியம்; ஆனால் அருகிலுள்ள גּוֹלָה-வுக்குப் பயன்படுத்திய சொல்லை தேவையின்றி மீண்டும் இடாமல் செயலைத் தெளிவாக்குகிறது.
- source_word: נְבוּכַדְנֶצַּר
  choice: நேபுகாத்நேச்சார்
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் அறிமுகமான பெயர்வடிவம்.
- source_word: לִירוּשָׁלַם וְלִיהוּדָה
  choice: எருசலேமுக்கும் யூதாவுக்கும்
  rationale: மீண்டும் வரும் எபிரெய முன்னிடைச்சொல்லை இரு பெயர்களிலும் ‘-க்கும்’ எனப் பிரதிபலிக்கிறது; யூதா இங்கு விரிந்த நிலப்பகுதியைக் குறிக்கிறது.
- source_word: אִישׁ לְעִירוֹ
  choice: அவரவர் தங்கள் நகரத்திற்கு
  rationale: சொற்பட ‘ஒவ்வொரு ஆணும் தன் நகரத்திற்கு.’ இது திரும்பியவர்களை குடும்ப/குடியிருப்பு அலகுகளாகப் பகிர்ந்துரைக்கும் distributive மரபுத்தொடர். தமிழில் ‘அவரவர் தங்கள் நகரத்திற்கு’ அதன் பகிர்வுப் பொருளை இயல்பாகத் தருகிறது.
theological_decisions:
- issue: אִישׁ என்பதிலுள்ள ஆண்பால் பிரதிநிதித்துவ மொழி
  choice: அவரவர் தங்கள் நகரத்திற்கு
  alternative: ஒவ்வொரு ஆணும் தன் நகரத்திற்கு
  rationale: எபிரெய வடிவம் ஆண்பால் ஒருமை என்றாலும், சூழலில் திரும்பிய குடும்பங்கள் அல்லது அலகுகள் ஒவ்வொன்றையும் பகிர்ந்துரைக்கிறது. ‘ஒவ்வொரு ஆணும்’ என்பது ஆண்களை மட்டும் குறிக்கும் தவறான எண்ணத்தைத் தமிழில் வலுப்படுத்தக்கூடும்; ஆகவே செயல்பாட்டு பொருள் பாதுகாக்கப்பட்டது.
- issue: וַיָּשׁוּבוּ-வின் வாக்கியத் தொடர்பு
  choice: இவர்கள் ... திரும்பினார்கள்
  alternative: திரும்பியவர்கள்
  rationale: இது எபிரெயத்தில் தொடர்கதை வினைச்சொல்; தனி பிரதான வினையாக வழங்குவது மூல வாக்கியத்தின் முன்னேற்றத்தையும் தெளிவையும் காக்கிறது. ஆங்கில ஆலோசனை அடுக்கின் relative-clause அமைப்பு கட்டாயமாகப் பின்பற்றப்படவில்லை.
translation_notes:
  register: நவீன நிலையான, கண்ணியமான தமிழ். ‘மாகாணம்,’ ‘நாடுகடத்தப்பட்டவர்கள்,’ ‘சிறையிருப்பு’ ஆகியவை வரலாற்று-நிர்வாகச் சூழலைத் துல்லியமாக வைத்திருக்கின்றன. நீண்ட எபிரெய வாக்கியம் தமிழில் வாசிக்கத் தெளிவாக இரண்டு வாக்கியங்களாகப் பிரிக்கப்பட்டது; வசன முடிவிலுள்ள பட்டியல் அறிமுக இரட்டைப்புள்ளி பாதுகாக்கப்பட்டது.
