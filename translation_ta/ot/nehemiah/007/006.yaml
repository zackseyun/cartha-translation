  source_fidelity: திருத்தம் தேவை. הָעֹלִים என்பதற்கு வரைவில் உள்ள “திரும்பி வந்த” என்பது பின்னர் வரும் וַיָּשׁוּבוּ (“திரும்பினார்கள்”) என்பதையும் முன்கூட்டியே மொழிபெயர்த்து விடுகிறது. “மேலே வந்த” என்பது மூலத்தின் வழக்கமான எருசலேம்/யூதாவை நோக்கிய ஏற்றத் திசை மொழியைப் பாதுகாக்கிறது. மேலும், அசல் வாக்கியத்தின் இரு செயல்களும் தெளிவாக வேறுபடுத்தப்பட வேண்டும்.
