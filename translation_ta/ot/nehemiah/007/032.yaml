translation_notes:
  register: நவீனத் தரத் தமிழில், பட்டியல் வசனத்திற்கேற்ற சுருக்கமானதும் கண்ணியமானதுமான நடை. ‘ஆண்கள்’ என்ற மூலத்தின் ஆண்பால் குறிப்பைப் பேணியபோதும், ‘ஊர்களைச் சேர்ந்த’ என்பது இடங்களோடு உள்ள உறவை இயல்பாக வெளிப்படுத்துகிறது.
