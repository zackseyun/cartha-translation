lexical_decisions:
- source_word: אַנְשֵׁי
  choice: ஆண்கள்
  rationale: אִישׁ என்பதன் ஆண்பால் பன்மை இணைப்புவடிவம்; இடங்களால் அடையாளப்படுத்தப்பட்ட குழுவை அறிமுகப்படுத்துகிறது. எபிரெய மூலத்தின் ஆண்பால் குறிப்பைத் தெளிவாகப் பேணுகிறது.
- source_word: בֵית אֵל
  choice: பெத்தேல்
  rationale: இடப்பெயர் என்பதால் அதன் பொருளான ‘இறைவனின் வீடு’ என்று மொழிபெயர்க்காமல், தமிழில் வழக்கமான வடிவில் ஒலிபெயர்க்கப்பட்டது.
- source_word: וְהָעָי
  choice: ஆயி
  rationale: இணைப்புச் சொல்லுடன் வரும் இடப்பெயர். தமிழில் இயல்பாக ‘பெத்தேல், ஆயி ஆகிய ஊர்கள்’ என்ற ஒருங்கிணைந்த தொடரில் தரப்பட்டது.
- source_word: מֵאָה עֶשְׂרִים וּשְׁלֹשָׁה
  choice: நூற்று இருபத்துமூன்று
  rationale: மக்கள்தொகைக் கணக்கின் சரியான எண்ணிக்கையை நவீனத் தமிழின் இயல்பான எண்ணுருவில் தருகிறது.
