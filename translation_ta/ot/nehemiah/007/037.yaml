translation:
  language: ta
  text: 'லோத்[a], ஹாதீத், ஓனோ ஆகிய ஊர்களைச் சேர்ந்தவர்கள்: எழுநூற்று இருபத்தொருவர்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'சொல்லுக்குச் சொல்: “லோத், ஹாதீத், ஓனோவின் மகன்கள்”; இத்தகைய வம்ச மற்றும் மக்கள்தொகைப் பட்டியல்களில் “மகன்கள்” என்பது அந்த ஊர்களைச் சேர்ந்த விரிவான குலத்தையோ சமூகத்தையோ குறிக்கலாம்.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: ஊர்களைச் சேர்ந்தவர்கள்
  rationale: இந்தத் திரும்பிவந்தோர் பட்டியலில் בְּנֵי என்பது நேரடியான ‘மகன்கள்’ என்பதைவிட, தொடர்ந்து வரும் ஊர்களைச் சேர்ந்த மக்கள் அல்லது சமூகத்தினரைக் குறிக்கிறது. இயல்பான நவீனத் தமிழில் சூழலுக்கேற்ற பொருளைத் தருகிறது.
- source_word: לֹד
  choice: லோத்
  rationale: எபிரெய வடிவத்தை அடிப்படையாகக் கொண்ட ஊர்ப்பெயர் ஒலிபெயர்ப்பு.
- source_word: חָדִיד
  choice: காதீத்
  rationale: எபிரெய ஊர்ப்பெயரின் ஒலியமைப்பை நெருக்கமாகப் பின்பற்றும் தமிழ் ஒலிபெயர்ப்பு.
- source_word: וְאוֹנוֹ
  choice: ஓனோ
  rationale: וְ என்ற இணைப்புச் சொல் தமிழ்ப் பட்டியல் அமைப்பில் ‘ஆகிய’ என்பதால் வெளிப்படுத்தப்பட்டு, אוֹנוֹ ஊர்ப்பெயராக ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: שְׁבַע מֵאוֹת וְעֶשְׂרִים וְאֶחָד
  choice: எழுநூற்று இருபத்தொருவர்
  rationale: மனிதர்களின் எண்ணிக்கையைக் குறிக்கும் இயல்பான தமிழ் எண்ணுப்பெயர் வடிவம் பயன்படுத்தப்பட்டுள்ளது.
