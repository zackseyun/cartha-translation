lexical_decisions:
- source_word: בְּנֵי
  choice: மகன்கள்
  rationale: எபிரெய வம்சப் பட்டியலில் இது குடும்பத்தையோ குலவழியினரையோ குறிக்கக்கூடும்; எனினும் மூலத்தின் நேரடியான உறவுமுறையையும் பட்டியலின் ஒரே வடிவத்தையும் காக்க ‘மகன்கள்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: יַעְלָא
  choice: யாலா
  rationale: இது ஒரு நபரின் பெயர்; எபிரெய வடிவத்துக்கு ஏற்ப ஒலிபெயர்க்கப்பட்டது.
- source_word: דַרְקוֹן
  choice: தர்கோன்
  rationale: இது ஒரு நபரின் பெயர்; மொழிபெயர்க்காமல் எபிரெய உச்சரிப்புக்கு நெருக்கமாக ஒலிபெயர்க்கப்பட்டது.
- source_word: גִדֵּל
  choice: கித்தேல்
  rationale: இது ஒரு நபரின் பெயர்; எபிரெய எழுத்தொலிகளை இயன்றவரை பிரதிபலிக்கும் வகையில் ஒலிபெயர்க்கப்பட்டது.
