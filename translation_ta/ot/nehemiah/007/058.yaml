  register: நவீனத் தரத் தமிழில், வம்சப் பட்டியலுக்குரிய சுருக்கமானவும் கண்ணியமானவும் உள்ள நடையில் அமைக்கப்பட்டது. பெயர்கள் எபிரெய மூலத்திலிருந்து நேரடியாக ஒலிபெயர்க்கப்பட்டன; அடிக்குறி குறியீடு பெயருக்குப் பின் இடப்பட்டது.
