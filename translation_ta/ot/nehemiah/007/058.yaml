    text: எஸ்றா 2:56-இல் உள்ள இணைப் பட்டியலுடனான ஒப்பீட்டின் காரணமாகவும், வேறுபட்ட எழுத்துமுறை மரபின் காரணமாகவும், சில மொழிபெயர்ப்புகள் இந்தப் பெயரை “யாலா” என்பதற்குப் பதிலாக “யாலாஹ்” என்று எழுதுகின்றன.
