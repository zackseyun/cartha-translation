lexical_decisions:
- source_word: בְּנֵי
  choice: வழித்தோன்றல்கள்
  rationale: வம்சாவளி மற்றும் பட்டியல் சூழலில் בְּנֵי என்பது நேரடி மகன்களை மட்டும் அல்லாமல் ஒரு குடும்ப அல்லது குல வழியைச் சேர்ந்தவர்களையும் குறிக்கலாம்; நவீன தமிழில் இயல்பாகவும் பொருள் தெளிவாகவும் இருக்க ‘வழித்தோன்றல்கள்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: בִגְוָי
  choice: பிக்வாய்
  rationale: இது ஒரு நபர் அல்லது குடும்பத்தின் பெயர்; எபிரெய ஒலிப்புக்கு நெருக்கமாகத் தமிழில் ஒலிபெயர்க்கப்பட்டது.
- source_word: אַלְפַּיִם שִׁשִּׁים וְשִׁבְעָה
  choice: 2,067 பேர்
  rationale: ‘இரண்டாயிரத்து அறுபத்தேழு’ என்ற துல்லிய எண்ணிக்கையை வாசிப்புக்கு எளிதான இலக்க வடிவில் கொடுத்து, பட்டியலிடப்பட்டவர்கள் மனிதர்கள் என்பதை ‘பேர்’ தெளிவுபடுத்துகிறது.
