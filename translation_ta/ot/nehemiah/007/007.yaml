source:
  edition: WLC
  text: הַ/בָּאִ֣ים עִם זְרֻבָּבֶ֗ל יֵשׁ֡וּעַ נְחֶמְיָ֡ה עֲ֠זַרְיָה רַֽעַמְיָ֨ה נַחֲמָ֜נִי מָרְדֳּכַ֥י בִּלְשָׁ֛ן מִסְפֶּ֥רֶת בִּגְוַ֖י נְח֣וּם בַּעֲנָ֑ה מִסְפַּ֕ר אַנְשֵׁ֖י עַ֥ם יִשְׂרָאֵֽל־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/007/007.yaml
  text: 'those who came with Zerubbabel were Jeshua[a], Nehemiah, Azariah, Raamiah, Nahamani, Mordecai, Bilshan, Mispereth, Bigvai, Nehum, and Baanah[c][b]. The number of the men of the people of Israel:'
translation:
  language: ta
  text: 'செருபாபேலுடன் வந்தவர்கள்: யேசுவா, நெகேமியா, அசரியா, ராமியா[a], நகமானி, மொர்தெகாய், பில்ஷான், மிஸ்பெரெத், பிக்வாய், நெகூம்[b], பானா. இஸ்ரவேல் மக்களான ஆண்களின் எண்ணிக்கை:[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எஸ்றா 2:2-இலுள்ள இணைப் பட்டியலில் இப்பெயர் ‘ரெயேலாயா’ என்று வருகிறது.
    reason: alternative_reading
  - marker: b
    text: எஸ்றா 2:2-இலுள்ள இணைப் பட்டியலில் இப்பெயர் ‘ரெகூம்’ என்று வருகிறது.
    reason: alternative_reading
  - marker: c
    text: இந்தச் சொற்றொடர் அடுத்த வசனத்தில் தொடரும் மக்கள்தொகைக் கணக்கை அறிமுகப்படுத்துகிறது.
    reason: cross_reference
lexical_decisions:
- source_word: הַבָּאִים
  choice: வந்தவர்கள்
  rationale: குறிப்பிட்ட ஒரு குழுவைக் குறிக்கும் பெயர்ச்சொல் தன்மையுள்ள எபிரெயப் பங்கேற்புவினை; பட்டியலை அறிமுகப்படுத்தும் சூழலில் இயல்பான தமிழுக்காக இறந்தகால உறவுவினை வடிவம் பயன்படுத்தப்பட்டது.
- source_word: עִם
  choice: உடன்
  rationale: உடன்செல்லுதலைக் குறிக்கும் வழக்கமான முன்னிடைச்சொல்; தமிழில் பெயருடன் இணையும் ‘-உடன்’ வடிவம் இயல்பானது.
- source_word: זְרֻבָּבֶל
  choice: செருபாபேல்
  rationale: எபிரெயத் தனிப்பெயரின் ஒலியைத் தமிழில் தெளிவாகக் காட்டும் மரபான எழுத்துப்பெயர்ப்பு.
- source_word: יֵשׁוּעַ
  choice: யேசுவா
  rationale: சிறையிருப்புக்குப் பிந்தைய இத்தனிப்பெயரின் எபிரெய ஒலிவடிவத்தை நேரடியாகப் பிரதிபலிக்கிறது.
- source_word: רַעַמְיָה
  choice: ராமியா
  rationale: நெகேமியா நூலின் மசோரெட்டிக் உரையில் உள்ள பெயரையே முதன்மை உரையில் பின்பற்றுகிறது; எஸ்றா 2:2-இன் மாறுபட்ட பெயர் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: נַחֲמָנִי
  choice: நகமானி
  rationale: மசோரெட்டிக் உயிர்க்குறிகளின்படி தனிப்பெயர் எழுத்துப்பெயர்க்கப்பட்டது.
- source_word: מִסְפֶּרֶת
  choice: மிஸ்பெரேத்
  rationale: இங்கு பொதுப்பெயராக அல்ல, தனிப்பெயராக இருப்பதால் அதன் எபிரெய வடிவம் எழுத்துப்பெயர்க்கப்பட்டது.
- source_word: נְחוּם
  choice: நெகூம்
  rationale: நெகேமியா உரையின் பெயர்வடிவத்தைப் பாதுகாக்கிறது; எஸ்றா 2:2-இலுள்ள ‘ரெகூம்’ என்ற இணைப்பட்டியல் வடிவத்துடன் ஒத்திசைக்கப்படவில்லை.
- source_word: אַנְשֵׁי עַם יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்களிலுள்ள ஆண்கள்
  rationale: ‘இஸ்ரவேல் மக்கள்’ என்பதுடன் இணைந்துள்ள வெளிப்படையான ஆண்பால் பன்மையான ‘ஆண்கள்’ என்ற பொருளையும் தமிழில் பாதுகாக்கிறது.
theological_decisions:
- issue: אַנְשֵׁי עַם יִשְׂרָאֵל என்பதிலுள்ள பாலினத்தைக் குறிக்கும் கணக்கெடுப்பு மொழி
  choice: இஸ்ரவேல் மக்களிலுள்ள ஆண்களின் எண்ணிக்கை
  alternative: இஸ்ரவேல் மக்களின் எண்ணிக்கை
  rationale: எபிரெய உரையில் ‘ஆண்கள்’ என்பது வெளிப்படையாக இருப்பதால் அதை பொதுப்பாலான கூட்டுப்பெயராக மாற்றாமல் பாதுகாக்கப்பட்டது; இது யார் சேர்க்கப்பட்டனர் என்பது குறித்த மேலதிக கோட்பாட்டுத் தீர்மானம் அல்ல.
- issue: எஸ்றா 2:2-க்கும் நெகேமியா 7:7-க்கும் இடையிலான பெயர்வடிவ வேறுபாடுகள்
  choice: முதன்மை உரையில் நெகேமியாவின் மசோரெட்டிக் வடிவங்களான ‘ராமியா’, ‘நெகூம்’ பயன்படுத்தப்பட்டன
  alternative: எஸ்றா 2:2-இன் ‘ரெயேலாயா’, ‘ரெகூம்’ வடிவங்களைப் பயன்படுத்துதல்
  rationale: மொழிபெயர்க்கப்படும் வசனத்தின் எபிரெய உரைக்கு முன்னுரிமை கொடுக்கப்பட்டு, இணைப் பட்டியலிலுள்ள வேறுபாடுகள் ஒத்திசைக்கப்படாமல் அடிக்குறிப்புகளில் பாதுகாக்கப்பட்டன.
translation_notes:
  register: நவீனத் தரத் தமிழில், பட்டியல் தன்மை தெளிவாக இருக்க முக்காற்புள்ளி பயன்படுத்தப்பட்டுள்ளது. தனிப்பெயர்கள் மூல எபிரெய ஒலிக்கு நெருக்கமாகவும், சாதாரண வாசகரால் எளிதில் வாசிக்கத்தக்க வகையிலும் எழுத்துப்பெயர்க்கப்பட்டுள்ளன. இறுதிச் சொற்றொடரின் நிறைவற்ற அறிமுக அமைப்பு அடுத்த வசனத்துடன் உள்ள தொடர்ச்சியைப் பாதுகாக்கிறது.
