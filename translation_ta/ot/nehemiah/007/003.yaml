source:
  edition: WLC
  text: ו/יאמר לָ/הֶ֗ם לֹ֣א יִפָּֽתְח֞וּ שַׁעֲרֵ֤י יְרוּשָׁלִַ֨ם֙ עַד חֹ֣ם הַ/שֶּׁ֔מֶשׁ וְ/עַ֨ד הֵ֥ם עֹמְדִ֛ים יָגִ֥יפוּ הַ/דְּלָת֖וֹת וֶ/אֱחֹ֑זוּ וְ/הַעֲמֵ֗יד מִשְׁמְרוֹת֙ יֹשְׁבֵ֣י יְרוּשָׁלִַ֔ם אִ֚ישׁ בְּ/מִשְׁמָר֔/וֹ וְ/אִ֖ישׁ נֶ֥גֶד בֵּיתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/007/003.yaml
  text: And I said to them[a], “The gates of Jerusalem must not be opened until the sun is hot. While they are still standing guard, let them shut the doors and fasten them. And appoint guards from the inhabitants of Jerusalem[c][b], each at his watch and each opposite his own house.”
translation:
  language: ta
  text: நான் அவர்களிடம், “வெயில் சூடேறும் வரை[a] எருசலேமின் வாயில்களைத் திறக்கக் கூடாது. அவர்கள் இன்னும் காவலில் நிற்கும்போதே, கதவுகளை மூடி, அவற்றை உறுதியாக அடைத்துவைக்கட்டும்[b]. எருசலேமில் குடியிருப்பவர்களிலிருந்து காவலர்களை[c] நியமியுங்கள்; ஒவ்வொருவரையும் அவரவர் காவல் பணிக்காகவும், அவரவர் வீட்டுக்கு எதிரிலும் நியமியுங்கள்” என்றேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சூரியன் சூடாகும் வரை.” இது சூரிய உதய நேரத்தை மட்டும் அல்லாமல், காலையில் வெயில் ஏறிய பிந்தைய நேரத்தைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: எபிரெய மொழியில், “அவற்றைப் பிடித்துக்கொள்ளட்டும்.” கதவுகளை மூடிய பின்பு அவற்றை உறுதியாக அடைத்து வைப்பது என்பது இங்குள்ள சூழற்பொருள்.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, “எருசலேமில் குடியிருப்பவர்களிலிருந்து காவல் குழுக்களை நியமியுங்கள்.” எபிரெயச் சொல் காவலர்களையோ காவல் பணிமுறைகளையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא יִפָּתְחוּ שַׁעֲרֵי יְרוּשָׁלִַם
  choice: எருசலேமின் வாயில்களைத் திறக்கக் கூடாது
  rationale: நிபால் வினையின் செயப்பாட்டு உணர்வையும் לֹא உடன் வரும் வலுவான தடையாணையையும் இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: עַד חֹם הַשֶּׁמֶשׁ
  choice: வெயில் சூடேறும் வரை
  rationale: சூரியன் வெப்பமடையும் நேரம் என்ற எபிரெய உருவகத்தைப் பேணுகிறது; வெறும் சூரிய உதயத்தைவிட காலையில் சற்றுத் தாமதமான நேரத்தைக் குறிக்கக்கூடும்.
- source_word: וְעַד הֵם עֹמְדִים
  choice: காவலர்கள் இன்னும் தங்கள் இடங்களில் நிற்கும்போதே
  rationale: עמד என்பதன் நேரடியான ‘நிற்க’ என்ற பொருளையும் காவல் சூழலில் பணியிடத்தில் இருப்பது என்ற பொருளையும் இணைக்கிறது.
- source_word: יָגִיפוּ הַדְּלָתוֹת
  choice: அவர்கள் கதவுகளை மூடி
  rationale: הגיף என்பது குறிப்பாகக் கதவுகளை மூடுவதைக் குறிக்கிறது; கட்டளைத் தொடரின் தமிழ்ச் சொல்லமைப்புக்கு ஏற்றவாறு வழங்கப்பட்டுள்ளது.
- source_word: וֶאֱחֹזוּ
  choice: அவை திறக்காதபடி உறுதிப்படுத்தட்டும்
  rationale: வினையின் அடிப்படைப் பொருள் ‘பிடித்துக்கொள்’; கதவுகளை மூடிய பின்பு அவற்றைப் பாதுகாப்பாக நிலைநிறுத்துவது என்பதே இங்கு சூழற்பொருள். குறிப்பிட்ட தாழ்ப்பாள் முறையை உரை கூறாததால் அதைச் சேர்க்கவில்லை.
- source_word: וְהַעֲמֵיד מִשְׁמְרוֹת
  choice: காவலர்களை நியமியுங்கள்
  rationale: ‘நிறுத்து/அமர்த்து’ என்ற ஹிபில் உணர்வை நிர்வாகக் கட்டளையாக இயல்பாகத் தருகிறது; מִשְׁמְרוֹת மனிதக் காவலர்களையோ காவல் முறைகளையோ குறிக்கக்கூடியது.
- source_word: יֹשְׁבֵי יְרוּשָׁלִַם
  choice: எருசலேமில் குடியிருப்பவர்களிலிருந்து
  rationale: நகரவாசிகளில் சிலர் காவலுக்கு நியமிக்கப்பட வேண்டும் என்ற பகுதிப்பொருளைத் தெளிவாக்குகிறது.
- source_word: אִישׁ בְּמִשְׁמָרוֹ וְאִישׁ נֶגֶד בֵּיתוֹ
  choice: ஒவ்வொருவரும் அவரவர் காவல் இடத்திலும், அவரவர் வீட்டுக்கு எதிரிலும் காவல் காக்கட்டும்
  rationale: אִישׁ என்பதன் பகிர்நிலைப் பொருளையும் נֶגֶד என்பதன் ‘எதிரில்’ என்ற இடவியல் தெளிவின்மையையும் பேணுகிறது.
