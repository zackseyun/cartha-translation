  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי
  choice: சந்ததியினர்
  rationale: சிறையிருப்புக்குப் பிந்தைய குடிவரவு மற்றும் வம்சப் பட்டியல்களில் இச்சொல் நேரடி மகன்களை மட்டும் அல்லாமல் ஒரு குடும்ப அல்லது குல வழியினரைக் கூட்டாகக் குறிக்கிறது. எனவே நவீன தமிழில் இயல்பாகவும் பொருள்தெளிவுடனும் ‘சந்ததியினர்’ என்று வழங்கப்பட்டது.
- source_word: שְׁפַטְיָה
  choice: செபத்தியா
  rationale: எபிரெய தனிப்பெயர் அதன் ஒலியமைப்பைப் பின்பற்றி தமிழில் எழுத்துப்பெயர்க்கப்பட்டது.
- source_word: שְׁלֹשׁ מֵאוֹת שִׁבְעִים וּשְׁנָיִם
  choice: முந்நூற்று எழுபத்திரண்டு பேர்
  rationale: எபிரெய எண்ணிக்கை துல்லியமாகவும் இயல்பான நவீன தமிழ் நடையிலும் வழங்கப்பட்டுள்ளது; மனிதர்களின் எண்ணிக்கை என்பதைக் காட்ட ‘பேர்’ சேர்க்கப்பட்டுள்ளது.
