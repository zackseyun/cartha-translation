lexical_decisions:
- source_word: בְּנֵי
  choice: மகன்கள்
  rationale: சிறையிருப்புக்குப் பிந்தைய வம்சக் கணக்குப் பட்டியலில் இச்சொல் ஒரு குடும்பம் அல்லது குலத்தைச் சேர்ந்தவர்களைக் குறிக்கிறது. ‘மகன்கள்’ என்பது எபிரெய மரபுவழிச் சொல்லமைப்பைப் பாதுகாக்கிறது; ‘வம்சத்தார்’ என்பது பொருளைச் சற்றே விரித்துரைக்கும் மாற்றாகும்.
- source_word: זַתּוּא
  choice: சத்தூ
  rationale: பெயர் மொழிபெயர்க்கப்படாமல், எபிரெய ஒலிப்புக்கு ஏற்ப தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: שְׁמֹנֶה מֵאוֹת אַרְבָּעִים וַחֲמִשָּׁה
  choice: எண்ணூற்று நாற்பத்தைந்து
  rationale: எபிரெய எண்ணுரை துல்லியமாக 845 என்பதைக் குறிக்கிறது; இயல்பான நவீனத் தமிழ் எண்ணுருவில் தரப்பட்டுள்ளது.
