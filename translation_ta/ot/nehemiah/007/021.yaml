translation:
  language: ta
  text: 'எசேக்கியாவைச் சேர்ந்த ஆத்தேரின் வழித்தோன்றல்கள்[a]: தொண்ணூற்றெட்டுப் பேர்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஆத்தேரின் வழித்தோன்றல்கள், அதாவது எசேக்கியாவின் வழியினர்”; இது ஆத்தேர் குலத்தின் ஒரு குறிப்பிட்ட கிளையைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: வழித்தோன்றல்கள்
  rationale: வம்ச மற்றும் கணக்கெடுப்புப் பட்டியல்களில் בְּנֵי என்பது நேரடி மகன்களை மட்டும் குறிக்காமல், ஒரு குடும்ப வழியைச் சேர்ந்தவர்களையும் குறிக்கலாம். நவீன தமிழில் இங்கு ‘வழித்தோன்றல்கள்’ அந்தப் பொருளை இயல்பாகத் தெரிவிக்கிறது.
- source_word: אָטֵר
  choice: ஆத்தேர்
  rationale: இது ஒரு தனிநபர் அல்லது குடும்பப் பெயர்; எபிரெய ஒலிப்புக்கு ஏற்ப தமிழில் ஒலிபெயர்க்கப்பட்டது.
- source_word: לְחִזְקִיָּה
  choice: எசேக்கியாவைச் சேர்ந்த
  rationale: முன்னொட்டு לְ இங்கு எசேக்கியாவுடன் உள்ள தொடர்பையோ, ஆத்தேர் குலத்துக்குள் எசேக்கியா எனப்படும் ஒரு கிளையையோ குறிக்கக்கூடும். ‘சேர்ந்த’ என்பது அந்த உறவை இயல்பான தமிழில் காட்டுகிறது.
- source_word: תִּשְׁעִים וּשְׁמֹנָה
  choice: தொண்ணூற்றெட்டுப் பேர்
  rationale: எண்ணிக்கை நவீனத் தமிழின் வழக்கமான வடிவில் தரப்பட்டுள்ளது; பட்டியலிடப்படுவது மக்கள் என்பதால் தெளிவுக்காக ‘பேர்’ சேர்க்கப்பட்டுள்ளது.
