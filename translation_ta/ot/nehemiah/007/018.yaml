translation:
  language: ta
  text: 'அதோனிக்காமின் மகன்கள்: அறுநூற்று அறுபத்தேழு பேர்.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי
  choice: மகன்கள்
  rationale: திரும்பிவந்தோரின் பட்டியலில் இந்தச் சொல் பெயரிடப்பட்ட மூதாதையரின் குடும்பத்தாரைக் குறிக்கிறது. எபிரெய வடிவத்தை நேரடியாகப் பேணுவதற்காக ‘மகன்கள்’ என மொழிபெயர்க்கப்பட்டது; தமிழில் இது வம்சத்தாரையும் குறிக்கக்கூடிய பட்டியல் மரபாகப் புரிந்துகொள்ளப்படுகிறது.
- source_word: אֲדֹנִיקָם
  choice: அதோனிக்காம்
  rationale: தனிப்பெயர் அதன் எபிரெய ஒலிப்புக்கு நெருக்கமாகத் தமிழில் ஒலிபெயர்க்கப்பட்டது; பொருள் மொழிபெயர்க்கப்படவில்லை.
- source_word: שֵׁשׁ מֵאוֹת שִׁשִּׁים וְשִׁבְעָה
  choice: அறுநூற்று அறுபத்தேழு பேர்
  rationale: எபிரெய எண்ணிக்கை இயல்பான நவீனத் தமிழ் எண் வடிவில் தரப்பட்டது. நபர்களின் எண்ணிக்கை என்பதைத் தெளிவாக்க ‘பேர்’ சேர்க்கப்பட்டது.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழில், பட்டியலுக்கேற்ற சுருக்கமானவும் கண்ணியமானவும் உள்ள நடை. மூலத்தின் குடும்பப் பட்டியல் அமைப்பைத் தக்கவைத்து, எண்ணிக்கையைத் தமிழில் இயல்பாக வழங்குகிறது.
