translation_notes:
  register: நவீன நிலையான தமிழில், கணக்கெடுப்புப் பட்டியலுக்கேற்ற சுருக்கமானதும் கண்ணியமானதுமான நடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய உறவுச் சொற்றொடரின் சுருக்கத்தையும் அடுக்கையும் முற்றிலும் விளக்கி ஒரே வம்ச அமைப்பாகத் தீர்மானிக்காமல், ‘சேர்ந்த’ மற்றும் ‘மக்கள்’ என்பவற்றால் அதன் நெகிழ்வைத் தக்கவைத்துள்ளது.
