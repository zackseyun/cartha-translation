source:
  edition: WLC
  text: הַ/לְוִיִּ֑ם בְּנֵֽי יֵשׁ֧וּעַ לְ/קַדְמִיאֵ֛ל לִ/בְנֵ֥י לְ/הוֹדְוָ֖ה שִׁבְעִ֥ים וְ/אַרְבָּעָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/007/043.yaml
  text: 'The Levites: the sons of Jeshua[a], of Kadmiel, of the sons of Hodvah, seventy-four.'
translation:
  language: ta
  text: 'லேவியர்கள்: யேசுவாவின் சந்ததியினர், கத்மியேலின், ஒத்வாவின் சந்ததியினரில் எழுபத்து நான்கு பேர்.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘ஒத்வாவின் புதல்வர்கள்.’ எபிரெயத்தில் சொல்லுக்குச் சொல் ‘ஒத்வாவின் புதல்வர்கள்’ என்று உள்ளது; இந்த வம்சாவளிச் சொற்றொடர் உடனடிப் புதல்வர்களை மட்டுமல்ல, விரிந்த குடும்ப வழியினரையும் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַלְוִיִּם
  choice: லேவியர்கள்
  rationale: மக்கள்தொகைப் பட்டியலில் ஒரு தனிக் குழுவை அறிமுகப்படுத்தும் வரையறுக்கப்பட்ட பன்மைப் பெயர்ச்சொல்; மூலத்தின் பட்டியல் நடையைப் பேண வினைச்சொல் சேர்க்கப்படவில்லை.
- source_word: בְּנֵי
  choice: மக்கள்
  rationale: வம்சாவளி மற்றும் கணக்கெடுப்புச் சூழலில் இது உடனடிப் புதல்வர்களை மட்டும் அல்லாமல் ஒரு குடும்ப அல்லது வம்ச வழியினரையும் குறிக்கலாம்; நவீனத் தமிழில் இயல்பாகவும் அந்த விரிந்த பொருளுக்கு இடமளிப்பதாகவும் ‘மக்கள்’ உள்ளது.
- source_word: יֵשׁוּעַ
  choice: யேசுவா
  rationale: சிறையிருப்புக்குப் பிந்தைய காலத்துக்குரிய இந்தப் பெயரின் எபிரெய வடிவத்தைத் தமிழில் ஒலிபெயர்க்கிறது; ‘யோசுவா’ என்ற விரிவான பெயர் வடிவத்தோடு காரணமின்றி ஒன்றாக்கவில்லை.
- source_word: לְקַדְמִיאֵל
  choice: கத்மியேலைச் சேர்ந்த
  rationale: முன்னொட்டு ל இங்கு குடும்ப அல்லது வம்சத் தொடர்பைக் காட்டுகிறது; தமிழில் அந்தத் தொடர்பை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: לִבְנֵי לְהוֹדְוָה
  choice: ஒத்வாவின் மக்கள்
  rationale: மீண்டும் வரும் ל மற்றும் வம்சாவளிச் சொற்றொடரின் அடுக்கை இயன்றவரைச் சுருக்கமாகப் பேணுகிறது; ‘மக்கள்’ என்பது உடனடிப் புதல்வர்கள் அல்லது விரிந்த வம்சத்தார் என்ற இரு வாய்ப்புகளையும் அனுமதிக்கிறது.
- source_word: שִׁבְעִים וְאַרְבָּעָה
  choice: எழுபத்து நான்கு பேர்
  rationale: கணக்கெடுப்பின் எண்ணிக்கையை நவீனத் தமிழின் வழக்கமான எண்ணுருவில் தருகிறது; மனிதர்களைக் கணக்கிடுவதால் ‘பேர்’ சேர்க்கப்பட்டுள்ளது.
