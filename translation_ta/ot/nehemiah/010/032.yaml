base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/010/032.yaml
  text: As for the peoples of the land who bring goods and any grain on the Sabbath day to sell[a], we will not buy from them on the Sabbath or on a holy day; and we will forego the seventh year and every debt.
translation:
  language: ta
  text: நாட்டின் மக்களாகியோர் ஓய்வுநாளில் விற்பதற்காகப் பொருட்களையும் தானியங்களையும் கொண்டுவரும்போது, ஓய்வுநாளிலோ பரிசுத்த நாளிலோ அவர்களிடமிருந்து எதையும் வாங்கமாட்டோம். ஏழாம் ஆண்டில் நிலத்தைப் பயிரிடாமல் விட்டுவிடுவோம்; எல்லாக் கடன்களையும் தள்ளுபடி செய்வோம்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “எல்லா உரிமைக்கோரல்களையும்” அல்லது “எல்லா கட்டாய வசூல்களையும்” என்றும் மொழிபெயர்க்கலாம்; எபிரெயச் சொல்லடை சொல்லுக்குச் சொல் “ஒவ்வொரு கையின் சுமை/வசூல்” என உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַמֵּי הָאָרֶץ
  choice: நாட்டின் மக்கள்
  rationale: பன்மை வடிவத்தை இயல்பான தமிழில் கூட்டுப் பொருளுடன் வழங்குகிறது; சூழலில் யூதாவுக்கு வெளியிலிருந்து அல்லது சுற்றுப்புறத்திலிருந்து வணிகம் செய்ய வந்த மக்களைக் குறிக்கிறது.
- source_word: הַמַּקָּחוֹת
  choice: பொருட்கள்
  rationale: விற்பனைக்குரிய பலவகைச் சரக்குகளைக் குறிக்கும் விரிவான, இயல்பான நவீனத் தமிழ்ச் சொல்.
- source_word: שֶׁבֶר
  choice: தானியங்கள்
  rationale: வணிகச் சூழலில் இச்சொல் பொதுவாக உணவுத் தானியத்தைக் குறிக்கிறது.
- source_word: לֹא נִקַּח מֵהֶם
  choice: அவர்களிடமிருந்து எதையும் வாங்கமாட்டோம்
  rationale: לקח என்பதன் அடிப்படைப் பொருள் ‘எடுத்தல்’ என்றாலும், விற்பனைக்காகக் கொண்டுவரப்பட்ட சரக்குகள் பற்றிய இச்சூழலில் ‘வாங்குதல்’ என்பதே நோக்கப்பட்ட பொருள்; ‘எதையும்’ என்பது சரக்குகளையும் தானியங்களையும் இயல்பாக மீண்டும் சுட்டுகிறது.
- source_word: וּבְיוֹם קֹדֶשׁ
  choice: பரிசுத்த நாளிலோ
  rationale: எதிர்மறை வாக்கியத்தில் ‘ஓய்வுநாளிலோ ... நாளிலோ’ என்ற இணைப்பு தமிழில் இயல்பாகத் தடையை இரு வகை நாட்களுக்கும் விரிவுபடுத்துகிறது.
- source_word: וְנִטֹּשׁ אֶת הַשָּׁנָה הַשְּׁבִיעִית
  choice: ஏழாம் ஆண்டில் நிலத்தைப் பயிரிடாமல் விட்டுவிடுவோம்
  rationale: נטשׁ என்பதன் ‘விட்டுவிடுதல்’ என்ற கருத்தையும் ஏழாம் ஆண்டுக்குரிய நில ஓய்வின் சூழலையும் தெளிவாக வெளிப்படுத்துகிறது; தமிழில் ‘ஆண்டை விட்டுவிடுதல்’ என்பது தெளிவற்றதாக இருப்பதால் உட்கருத்து வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: מַשָּׁא כָל יָד
  choice: எல்லாக் கடன்களையும் தள்ளுபடி செய்வோம்
  rationale: சுருக்கமான எபிரெயச் சொல்லடை கடன் அல்லது சட்டபூர்வக் கோரிக்கையை விடுவிப்பதைக் குறிக்கலாம்; உபாகமம் 15-இன் ஏழாம் ஆண்டு பின்னணியில் ‘கடன்களைத் தள்ளுபடி செய்தல்’ மிகச் சாத்தியமான பொருள். வேறு சாத்தியங்கள் அடிக்குறிப்பில் பாதுகாக்கப்படுகின்றன.
theological_decisions:
- issue: ஏழாம் ஆண்டுக்குரிய இரட்டை பொறுப்பு
  choice: நிலத்தைப் பயிரிடாமல் விடுதல் மற்றும் கடன்களைத் தள்ளுபடி செய்தல் என இரு கடமைகளாக வழங்கப்பட்டது.
  alternative: ‘ஏழாம் ஆண்டையும் ஒவ்வொருவருடைய கைக்குரிய சுமையையும் விட்டுவிடுவோம்’ அல்லது ‘எல்லா உரிமைக்கோரல்களையும் விட்டுவிடுவோம்.’
  rationale: வாக்கியம் ஏழாம் ஆண்டின் வேளாண் ஓய்வையும் பொருளாதார விடுவிப்பையும் ஒன்றாக எதிரொலிக்கிறது. கடன் தள்ளுபடி என்பது சாத்தியமான சட்டப் பொருளைத் தெளிவாக்குகிறது; ஆனால் கடைசிச் சொல்லடையின் உண்மையான lexical ambiguity அடிக்குறிப்பில் வைக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் மரியாதைமிக்க நடையில் அமைக்கப்பட்டது. ‘ஓய்வுநாள்,’ ‘பரிசுத்த நாள்,’ ‘ஏழாம் ஆண்டு’ ஆகிய வேதாகமச் சொற்பயன்பாடுகள் தக்கவைக்கப்பட்டுள்ளன; கடைசி எபிரெயச் சொல்லடையின் தெளிவின்மை அடிக்குறிப்பில் வெளிப்படையாகப் பாதுகாக்கப்பட்டுள்ளது.
