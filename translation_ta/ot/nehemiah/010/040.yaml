  text: כִּ֣י אֶל הַ֠/לְּשָׁכוֹת יָבִ֨יאוּ בְנֵי יִשְׂרָאֵ֜ל וּ/בְנֵ֣י הַ/לֵּוִ֗י אֶת תְּרוּמַ֣ת הַ/דָּגָן֮ הַ/תִּיר֣וֹשׁ וְ/הַ/יִּצְהָר֒ וְ/שָׁם֙ כְּלֵ֣י הַ/מִּקְדָּ֔שׁ וְ/הַ/כֹּהֲנִים֙ הַ/מְשָׁ֣רְתִ֔ים וְ/הַ/שּׁוֹעֲרִ֖ים וְ/הַ/מְשֹׁרְרִ֑ים וְ/לֹ֥א נַעֲזֹ֖ב אֶת בֵּ֥ית אֱלֹהֵֽי/נוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/010/040.yaml
  text: For the sons of Israel and the sons of Levi will bring the contribution of the grain[a], the new wine, and the oil to the chambers, where the vessels of the sanctuary are, and the priests who minister, and the gatekeepers, and the singers[b]. And we will not neglect the house of our God.
translation:
  language: ta
  text: ஏனெனில், இஸ்ரவேல் மக்களும் லேவியர்களும் தானியம், புதுத் திராட்சரசம், எண்ணெய் ஆகியவற்றின் காணிக்கையை அறைகளுக்குக் கொண்டுவருவார்கள். அங்கே பரிசுத்த இடத்தின் பாத்திரங்கள் உள்ளன; பணிவிடை செய்யும் ஆசாரியர்களும், வாயிற்காவலர்களும், பாடகர்களும் உள்ளனர். நாங்கள் எங்கள் கடவுளின் ஆலயத்தைப் புறக்கணிக்க மாட்டோம்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எங்கள் கடவுளின் ஆலயத்தைக் கைவிட மாட்டோம்.”
    reason: עזב என்ற வினைச்சொல் ‘கைவிடுதல்’ என்றும் பொருள்படலாம்; இச்சூழலில் ‘புறக்கணித்தல்’ என்பது நடைமுறை ஆதரவை நிறுத்தாதிருக்கும் கருத்தைத் தெளிவாக்குகிறது.
lexical_decisions:
- source_word: לְּשָׁכוֹת
  choice: அறைகளுக்கு
  rationale: ஆலயத்தோடு இணைந்த சேமிப்பு அறைகளைக் குறிக்கிறது; சூழலை அளவுக்கு மீறி விளக்காமல் கட்டட அமைப்பின் பொதுவான பொருளைப் பாதுகாக்கிறது.
- source_word: בְנֵי יִשְׂרָאֵל וּבְנֵי הַלֵּוִי
  choice: இஸ்ரவேல் மக்களும் லேவியர்களும்
  rationale: எபிரெயச் சொற்றொடர்களின் கூட்ட அடையாளத்தை இயல்பான நவீன தமிழில் தருகிறது; சொற்சொல்லான ‘இஸ்ரவேலின் மகன்கள், லேவியின் மகன்கள்’ தமிழில் தேவையற்ற பாலின வரம்பையும் இயல்பற்ற நடையையும் ஏற்படுத்தும்.
- source_word: תְּרוּמַת
  choice: காணிக்கையை
  rationale: பரிசுத்த பயன்பாட்டிற்காக ஒதுக்கிக் கொடுக்கப்படும் பங்களிப்பை இச்சூழலில் தெளிவாகவும் வழக்காகவும் குறிக்கிறது.
- source_word: הַדָּגָן הַתִּירוֹשׁ וְהַיִּצְהָר
  choice: தானியம், புதுத் திராட்சரசம், எண்ணெய்
  rationale: வேளாண் விளைபொருட்களின் மும்மையையும் தெளிவாகக் காக்கிறது; תירושׁ என்பதன் புதிய விளைச்சல் சார்ந்த நுணுக்கத்தையும் வெளிப்படுத்துகிறது.
- source_word: כְּלֵי הַמִּקְדָּשׁ
  choice: பரிசுத்த இடத்தின் பாத்திரங்கள்
  rationale: ஆலயப் பரிசுத்த இடத்தில் பயன்படும் கருவிகள் அல்லது பாத்திரங்களைச் சுருக்கமாகக் குறிக்கிறது; ‘பாத்திரங்கள்’ இங்கு வழிபாட்டு உபகரணங்களையும் உள்ளடக்கும்.
- source_word: הַכֹּהֲנִים הַמְשָׁרְתִים
  choice: பணிவிடை செய்யும் ஆசாரியர்கள்
  rationale: ஆசாரியர்கள் செயலில் ஆற்றும் ஆலயப் பணியைப் பங்கேற்பு வடிவத்துக்கு ஏற்ப வெளிப்படுத்துகிறது.
- source_word: וְלֹא נַעֲזֹב
  choice: புறக்கணிக்க மாட்டோம்
  rationale: ஆலயத்திற்குரிய ஆதரவு மற்றும் கடமைகளை விட்டுவிடாதிருப்பதைக் குறிக்கும் சூழல்சார் பொருளை இயல்பான தமிழில் தருகிறது.
theological_decisions:
- issue: உடன்படிக்கைச் சமூகங்களின் பாலின வடிவிலான பெயரிடல்
  choice: இஸ்ரவேல் மக்களும் லேவியர்களும்
  alternative: இஸ்ரவேலின் மகன்களும் லேவியின் மகன்களும்
  rationale: בני என்ற ஆண்பால் பன்மை வடிவம் இங்கு சமூகக் குழுக்களைக் குறிக்கும் வழக்குச் சொற்றொடர். தமிழில் ‘மக்கள்’ மற்றும் ‘லேவியர்கள்’ என்பது அதன் கூட்டுப் பொருளைத் துல்லியமாகவும் இயல்பாகவும் தருகிறது; உரை நோக்காத பாலினக் கட்டுப்பாட்டைச் சேர்ப்பதில்லை.
- issue: கடவுளின் ஆலயத்தை விட்டுவிடுதல் அல்லது புறக்கணித்தல்
  choice: புறக்கணிக்க மாட்டோம்
  alternative: கைவிட மாட்டோம்
  rationale: இந்த உறுதிமொழி ஆலயத்தை உடலளவில் விட்டு நீங்குவதைவிட, அதன் வழிபாடு மற்றும் தேவைகளுக்கான பொறுப்பை அலட்சியம் செய்யாதிருப்பதைக் குறிக்கிறது. மாற்றுப் பொருள் உண்மையான சாத்தியமாக அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான வேதாகம நடை. ‘ஆசாரியர்கள்’, ‘திராட்சரசம்’, ‘பணிவிடை’ போன்ற பரவலாக அறியப்பட்ட வழிபாட்டுச் சொற்கள் பயன்படுத்தப்பட்டுள்ளன; எபிரெய வாக்கியத்தின் காரணத் தொடக்கமும் இறுதி கூட்டுறுதி வாக்கியமும் பாதுகாக்கப்பட்டுள்ளன.
