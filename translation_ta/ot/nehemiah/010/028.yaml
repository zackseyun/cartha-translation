- source_word: בַּעֲנָה
  choice: பானா
  rationale: எபிரெய தனிப்பெயர். ע ஒலிக்குத் தமிழில் நேரான இணை இல்லாததால் தனி எழுத்தால் குறிக்காமல், பெயரை இயல்பான தமிழ் ஒலிவடிவில் வழங்கியுள்ளது.
