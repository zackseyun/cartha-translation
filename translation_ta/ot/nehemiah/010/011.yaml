  text: 'and their brothers: Shebaniah, Hodiah, Kelita, Pelaiah, Hanan.'
translation:
  language: ta
  text: 'அவர்களுடைய சகோதரர்களும்: செபனியா, ஹோதியா, கெலித்தா, பெலாயா, ஹானான்.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַ/אֲחֵי/הֶם
  choice: அவர்களுடைய சகோதரர்கள்
  rationale: ו conjunction பட்டியலின் தொடர்ச்சியால் தமிழில் தனியே மொழிபெயர்க்கப்படாமல் இயல்பாக வெளிப்படுகிறது; אֲחֵי மற்றும் மூன்றாம் நபர் ஆண்பால் பன்மை பின்னொட்டு சேர்ந்து ‘அவர்களுடைய சகோதரர்கள்’ எனப் பொருள்படும். இது இங்கு ஆண் உடனிணைவோரைச் சுட்டுவதால் பொதுப்பாலாக்கப்படவில்லை.
- source_word: שְׁבַנְיָה
  choice: செபனியா
  rationale: எபிரேய தனிப்பெயரின் ஒலியைத் தமிழில் இயல்பாக எழுத்துப்பெயர்த்த வடிவம்.
- source_word: הוֹדִיָּה
  choice: ஓதியா
  rationale: எபிரேய உச்சரிப்பை அண்மித்த தமிழ் எழுத்துப்பெயர்ப்பு; தொடக்க ה ஒலியின்மை மற்றும் הוֹ-வின் நீண்ட ‘ஓ’ ஒலி பிரதிபலிக்கப்படுகின்றன.
- source_word: קְלִיטָא
  choice: கெலித்தா
  rationale: எபிரேய தனிப்பெயரின் மெய்-உயிர் அமைப்பை வாசிக்கத்தக்க தமிழில் அண்மையாகப் பிரதிபலிக்கிறது.
- source_word: פְּלָאיָה
  choice: பெலாயா
  rationale: எபிரேய தனிப்பெயரை அதன் ஒலியமைப்புக்கு அண்மையாகத் தமிழில் எழுத்துப்பெயர்க்கிறது.
- source_word: חָנָן
  choice: ஆனான்
  rationale: தொடக்க ח இன் உரசொலியைத் தமிழில் துல்லியமாகக் குறிக்க இயலாததால், எபிரேய நீண்ட உயிரொலியை முன்னிறுத்தும் வாசிக்கத்தக்க எழுத்துப்பெயர்ப்பு தேர்ந்தெடுக்கப்பட்டது.
