translation_notes:
  register: நவீனத் தரமான, கண்ணியமான தமிழ். உடன்படிக்கையில் கையொப்பமிட்டவர்களின் பெயர்ப்பட்டியல் என்பதால் சுருக்கமான பட்டியல் நடை பாதுகாக்கப்பட்டுள்ளது; மூலத்தின் வாக்கியத் தொடர்ச்சியை இயல்பான தமிழ் நிறுத்தக்குறியுடன் வழங்கியுள்ளது.
