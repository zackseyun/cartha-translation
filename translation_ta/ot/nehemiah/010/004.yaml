lexical_decisions:
- source_word: פַּשְׁחוּר
  choice: பஸ்கூர்
  rationale: எபிரெய தனிப்பெயர் தமிழில் ஒலிபெயர்க்கப்பட்டது. ח எழுத்தின் தொண்டையொலியைத் தமிழில் துல்லியமாகக் குறிக்க இயலாததால், இயல்பாக வாசிக்கக்கூடிய ‘ஸ்க்’ வடிவம் பயன்படுத்தப்பட்டது.
- source_word: אֲמַרְיָה
  choice: அமரியா
  rationale: தனிப்பெயர் அதன் எபிரெய ஒலிவடிவத்துக்கு நெருக்கமாக ஒலிபெயர்க்கப்பட்டது; இறுதியிலுள்ள யா கூறும் தக்கவைக்கப்பட்டது.
- source_word: מַלְכִּיָּה
  choice: மல்கியா
  rationale: தனிப்பெயர் எபிரெய மெய்யெழுத்து அமைப்பைத் தொடர்ந்து ஒலிபெயர்க்கப்பட்டது; כּ இங்குள்ள ‘க்’ ஒலியாகவும், இறுதி יָה ‘யா’ என்றும் வழங்கப்பட்டது.
