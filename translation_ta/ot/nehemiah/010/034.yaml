base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/010/034.yaml
  text: for the bread of the arrangement[a], and for the regular grain offering, and for the regular burnt offering, for the Sabbaths, the new moons, the appointed times, and the holy things, and for the sin offerings to make atonement for Israel[e][d][c][b], and for all the work of the house of our God.
translation:
  language: ta
  text: அடுக்கி வைக்கப்பட்ட அப்பத்திற்காகவும்[a], வழக்கமான தானியக் காணிக்கைக்காகவும், வழக்கமான தகனபலிக்காகவும்[b], ஓய்வுநாட்களுக்காகவும், புதிய நிலவு நாட்களுக்காகவும், நியமிக்கப்பட்ட காலங்களுக்காகவும்[c], பரிசுத்தமானவற்றிற்காகவும்[d], இஸ்ரவேலுக்காகப் பாவநிவிர்த்தி செய்வதற்கான பாவநிவாரணப் பலிகளுக்காகவும்[e], நம் தேவனின் ஆலயத்தின் எல்லாப் பணிகளுக்காகவும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சந்நிதி அப்பம்” அல்லது “முன்வைக்கப்பட்ட அப்பம்.”
    reason: lexical_alternative
  - marker: b
    text: “வழக்கமான” என்பதற்கு “தொடர்ந்து செலுத்தப்படும்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: “நியமிக்கப்பட்ட காலங்கள்” என்பதில் நிர்ணயிக்கப்பட்ட பண்டிகைக் காலங்களும் அடங்கும்.
    reason: lexical_alternative
  - marker: d
    text: அல்லது, “பரிசுத்தக் காணிக்கைகள்” அல்லது “அர்ப்பணிக்கப்பட்ட பொருட்கள்.”
    reason: lexical_alternative
  - marker: e
    text: “பாவநிவாரணப் பலிகள்” என்பதைச் சில பலிசார் சூழல்களில் “தூய்மைப்படுத்தும் பலிகள்” என்றும் புரிந்துகொள்ளலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֶחֶם הַמַּעֲרֶכֶת
  choice: அடுக்கிவைக்கப்படும் அப்பம்
  rationale: இந்த எபிரெயச் சொற்றொடர் ஒழுங்காக அடுக்கி அல்லது முன்வைக்கப்படும் அப்பத்தைக் குறிக்கிறது. மரபுவழிப் பெயரை மட்டும் பயன்படுத்தாமல், அதன் செயற்பொருளைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: מִנְחַת הַתָּמִיד
  choice: வழக்கமான தானியக் காணிக்கை
  rationale: பலிசார் சூழலில் מִנְחָה தானியக் காணிக்கையையும், תָּמִיד தொடர்ந்து ஒழுங்காகச் செலுத்தப்படுவதையும் குறிக்கின்றன.
- source_word: עֹלַת הַתָּמִיד
  choice: வழக்கமான தகனபலி
  rationale: עֹלָה முழுவதும் எரிக்கப்படும் பலிக்கான நிலையான பலிசார் சொல்; תָּמִיד அதன் முறையான தொடர்ச்சியைச் சுட்டுகிறது.
- source_word: הַשַּׁבָּתוֹת הֶחֳדָשִׁים לַמּוֹעֲדִים
  choice: ஓய்வுநாட்கள், அமாவாசை நாட்கள், குறிக்கப்பட்ட காலங்கள்
  rationale: மூன்று காலக் குறிப்புகளையும் தனித்தனியாகப் பாதுகாக்கிறது. מוֹעֲדִים என்பதை ‘பண்டிகைகள்’ என்று மட்டும் குறுக்காமல் அதன் பரந்த பொருளான குறிக்கப்பட்ட காலங்கள் என வழங்குகிறது.
- source_word: וְלַקֳּדָשִׁים
  choice: பரிசுத்தமானவற்றிற்காக
  rationale: קֳדָשִׁים என்பதன் பரந்த பொருளைப் பாதுகாத்து, அதை காணிக்கைகள் அல்லது அர்ப்பணிக்கப்பட்ட பொருட்கள் என்று தேவையின்றிக் குறுக்கவில்லை.
- source_word: וְלַחַטָּאוֹת
  choice: பாவநிவாரணப் பலிகளுக்காக
  rationale: பலிசார் சூழலில் חַטָּאת பாவத்தோடு தொடர்புடைய நிவாரண அல்லது தூய்மைப்படுத்தும் பலியைக் குறிக்கிறது; தமிழில் அறியப்பட்ட பலிசார் வடிவம் பயன்படுத்தப்பட்டுள்ளது.
- source_word: לְכַפֵּר עַל יִשְׂרָאֵל
  choice: இஸ்ரவேலுக்காகப் பாவநிவிர்த்தி செய்யும்
  rationale: כפר என்பதன் பலிசார், இறையியல் வலிமையைத் தக்கவைத்து, அதன் செயல்முறையை மேலதிகமாக விளக்காமல் மொழிபெயர்க்கிறது.
- source_word: וְכֹל מְלֶאכֶת בֵּית אֱלֹהֵינוּ
  choice: நம் இறைவனின் ஆலயத்திற்குரிய எல்லாப் பணிகள்
  rationale: מְלָאכָה என்பதன் பரந்த ‘பணி/வேலை’ பொருளைத் தக்கவைக்கிறது; வழிபாட்டுச் சேவைக்கு மட்டும் அதைக் குறுக்கவில்லை.
theological_decisions:
- issue: பலிசார் சொற்களை மிகையாக விளக்காமல் மொழிபெயர்த்தல்
  choice: தானியக் காணிக்கை, தகனபலி, பாவநிவாரணப் பலி, பாவநிவிர்த்தி செய்தல் ஆகிய நிலையான பலிசார் சொற்களைப் பயன்படுத்துதல்
  alternative: அன்பளிப்பு, முழுப்பலி, தூய்மைப்படுத்தும் பலி போன்ற அதிக விளக்கமுள்ள சொற்களைப் பயன்படுத்துதல்
  rationale: இவ்வசனம் ஆலயத் தேவைகளையும் பலிக்கடமைகளையும் பட்டியலிடுகிறது. மூலத்தின் தனித்த பலிவகைகளைப் பாதுகாப்பது இறையியல் விளக்கத்தை மொழிபெயர்ப்புக்குள் திணிப்பதைத் தவிர்க்கிறது.
- issue: קֳדָשִׁים என்பதன் வரம்பு
  choice: பரிசுத்தமானவை என்று பரந்த வடிவில் மொழிபெயர்த்தல்
  alternative: பரிசுத்தக் காணிக்கைகள் அல்லது அர்ப்பணிக்கப்பட்ட பொருட்கள் என்று குறுக்குதல்
  rationale: எபிரெயச் சொல் இங்கு எதை மட்டும் குறிக்கிறது என்று தெளிவுபடுத்தவில்லை; அதன் உண்மையான பொருள் அகலத்தைத் தக்கவைக்க வேண்டும்.
- issue: חַטָּאת என்பதன் பலிசார் நுணுக்கம்
  choice: முதன்மை உரையில் பாவநிவாரணப் பலி; தூய்மைப்படுத்தும் பலி என்ற சாத்தியத்தை அடிக்குறிப்பில் வழங்குதல்
  alternative: முதன்மை உரையிலேயே தூய்மைப்படுத்தும் பலி என்று மொழிபெயர்த்தல்
  rationale: பாவம் மற்றும் தூய்மைப்படுத்துதல் ஆகிய இரு நுணுக்கங்களும் ஆய்வில் விவாதிக்கப்படுகின்றன. பழக்கமான சொல்லை முதன்மை உரையில் வைத்தபடி மாற்றுப் புரிதலை மறைக்காமல் குறிப்பிடுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், ஆலய மற்றும் பலிசார் சூழலுக்கேற்ற கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. எபிரெயப் பட்டியலின் இணை அமைப்பு பாதுகாக்கப்பட்டதுடன், தமிழில் இயல்பாக வாசிக்க ‘-க்காகவும்’ என்ற தொடரமைப்பு பயன்படுத்தப்பட்டது. ‘இறைவன்’ பொதுவாகப் புரியும் உயர்நடைச் சொலாகவும், ‘ஆலயம்’ בֵּית என்பதன் இச்சூழல் பொருளாகவும் தேர்ந்தெடுக்கப்பட்டன.
