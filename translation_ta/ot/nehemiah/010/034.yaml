- from: அடுக்கிவைக்கப்படும் அப்பத்திற்காகவும்[a], வழக்கமான தானியக் காணிக்கைக்காகவும், வழக்கமான தகனபலிக்காகவும்[b], ஓய்வுநாட்களுக்காகவும், அமாவாசை நாட்களுக்காகவும், குறிக்கப்பட்ட காலங்களுக்காகவும்[c], பரிசுத்தமானவற்றிற்காகவும்[d], இஸ்ரவேலுக்காகப் பாவநிவிர்த்தி செய்யும் பாவநிவாரணப் பலிகளுக்காகவும்[e], நம் இறைவனின் ஆலயத்திற்குரிய எல்லாப் பணிகளுக்காகவும்.
  to: அடுக்கி வைக்கப்பட்ட அப்பத்திற்காகவும்[a], வழக்கமான தானியக் காணிக்கைக்காகவும், வழக்கமான தகனபலிக்காகவும்[b], ஓய்வுநாட்களுக்காகவும், புதிய நிலவு நாட்களுக்காகவும், நியமிக்கப்பட்ட காலங்களுக்காகவும்[c], பரிசுத்தமானவற்றிற்காகவும்[d], இஸ்ரவேலுக்காகப் பாவநிவிர்த்தி செய்வதற்கான பாவநிவாரணப் பலிகளுக்காகவும்[e], நம் தேவனின் ஆலயத்தின் எல்லாப் பணிகளுக்காகவும்.
