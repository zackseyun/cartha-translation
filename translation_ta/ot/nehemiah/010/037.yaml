source:
  edition: WLC
  text: וְ/אֶת בְּכֹר֤וֹת בָּנֵ֨י/נוּ֙ וּ/בְהֶמְתֵּ֔י/נוּ כַּ/כָּת֖וּב בַּ/תּוֹרָ֑ה וְ/אֶת בְּכוֹרֵ֨י בְקָרֵ֜י/נוּ וְ/צֹאנֵ֗י/נוּ לְ/הָבִיא֙ לְ/בֵ֣ית אֱלֹהֵ֔י/נוּ לַ/כֹּ֣הֲנִ֔ים הַ/מְשָׁרְתִ֖ים בְּ/בֵ֥ית אֱלֹהֵֽי/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/010/037.yaml
  text: and the firstborn of our sons and of our livestock[a], as it is written in the Law, and the firstborn of our herds and of our flocks, to bring to the house of our God[b], to the priests who minister in the house of our God.
translation:
  language: ta
  text: மேலும், திருச்சட்டத்தில் எழுதியிருக்கிறபடி, எங்கள் மகன்களில் முதற்பேறானவர்களையும் எங்கள் கால்நடைகளில் முதற்பேறானவற்றையும்[a], எங்கள் மாட்டு மந்தைகளிலும் செம்மறியாடு, வெள்ளாடு மந்தைகளிலும் முதற்பேறானவற்றையும்[b], எங்கள் கடவுளின் இல்லத்திற்கும் எங்கள் கடவுளின் இல்லத்தில் பணிபுரியும் ஆசாரியர்களிடமும் கொண்டுவருவதற்கும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அதாவது, மனிதர் மற்றும் கால்நடைகளின் முதற்பேறுகள் குறித்த திருச்சட்டக் கட்டளைகளின்படி.
    reason: cross_reference
  - marker: b
    text: எபிரேயத்தை இன்னும் நேரடியாக, ‘எங்கள் மாடுகளிலும் செம்மறியாடுகள்/வெள்ளாடுகள் அடங்கிய மந்தைகளிலும் முதற்பேறானவை’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּכֹרוֹת בָּנֵינוּ
  choice: எங்கள் மகன்களில் முதற்பேறானவர்கள்
  rationale: மகன்களுள் முதலில் பிறந்தவர்களைக் குறிக்கும் எபிரேய பன்மையைத் தெளிவாகவும் இயல்பாகவும் தருகிறது; ஆண் முதற்பேறுகள் என்ற பொருளைத் தேவையின்றி விரிவாக்கவில்லை.
- source_word: וּבְהֶמְתֵּינוּ
  choice: எங்கள் கால்நடைகளில் முதற்பேறானவை
  rationale: בְּהֵמָה பொதுவாக வீட்டில் வளர்க்கப்படும் கால்நடைகளைக் குறிக்கும்; அடுத்து வரும் மாட்டு மற்றும் ஆட்டு மந்தைகள் என்ற குறிப்புகளைக் காட்டிலும் இது விரிவான சொல்.
- source_word: כַּכָּתוּב בַּתּוֹרָה
  choice: திருச்சட்டத்தில் எழுதியிருக்கிறபடி
  rationale: இது பொதுவான சட்டத்தையல்ல, எழுதப்பட்ட தோரா அறிவுறுத்தலைக் குறிக்கும் நிலையான சொற்றொடர்; ‘திருச்சட்டம்’ அந்தத் தனிப்பட்ட குறிப்பை இயல்பான தமிழில் உணர்த்துகிறது.
- source_word: בְּכוֹרֵי בְקָרֵינוּ וְצֹאנֵינוּ
  choice: எங்கள் மாட்டு மந்தைகளிலும் ஆட்டு மந்தைகளிலும் முதற்பேறானவை
  rationale: בָּקָר பெரிய மந்தை விலங்குகளை, குறிப்பாக மாடுகளைக் குறிக்கிறது; צֹאן செம்மறியாடுகளும் வெள்ளாடுகளும் அடங்கிய சிறுகால்நடை மந்தையைக் குறிக்கலாம். ‘மாட்டு மந்தைகள், ஆட்டு மந்தைகள்’ என்ற இணை தெளிவாகவும் வாசிக்க இயல்பாகவும் உள்ளது.
- source_word: לְהָבִיא
  choice: கொண்டுவந்து ... சேர்ப்பிக்கவும்
  rationale: எபிரேய நோக்க வினையெச்சத்தை, உடன்படிக்கைப் பொறுப்புகளின் தொடராக வாசிக்கப்படும் தமிழில் இயல்பாக வழங்குகிறது; ‘கொடுப்போம்’ என்று மூலத்தில் இல்லாத முடிவுற்ற வினையைச் சேர்க்கவில்லை.
- source_word: לְבֵית אֱלֹהֵינוּ
  choice: எங்கள் கடவுளின் இல்லத்திற்கு
  rationale: மூலத்தின் ‘எங்கள் கடவுளின் வீடு/இல்லம்’ என்ற உருவகத்தைப் பாதுகாக்கிறது; பொருள் ஆலயம் என்றாலும் அதை நேரடியாக ‘ஆலயம்’ என்று விளக்கி மாற்றவில்லை.
- source_word: לַכֹּהֲנִים הַמְשָׁרְתִים
  choice: பணிபுரியும் ஆசாரியர்களிடம்
  rationale: பங்கேற்பு வினைச்சொல் ஆசாரியர்களின் தொடர்ந்த வழிபாட்டுப் பணியைக் குறிக்கிறது; ‘பணிபுரியும்’ நவீனத் தமிழில் தெளிவாக உள்ளது.
- source_word: בְּבֵית אֱלֹהֵינוּ
  choice: எங்கள் கடவுளின் இல்லத்தில்
  rationale: எபிரேயத்தில் மீண்டும் வரும் சொற்றொடரை மீண்டும் வழங்கி, இடத்தையும் மூலத்தின் வலியுறுத்தலையும் காக்கிறது.
theological_decisions:
- issue: בֵּית אֱלֹהֵינוּ என்பதை ‘எங்கள் கடவுளின் இல்லம்’ என்றா, ‘எங்கள் கடவுளின் ஆலயம்’ என்றா மொழிபெயர்ப்பது
  choice: எங்கள் கடவுளின் இல்லம்
  alternative: எங்கள் கடவுளின் ஆலயம்
  rationale: இங்கு குறிக்கப்படுவது ஆலயமே என்றாலும், எபிரேயம் நேரடியாக ‘எங்கள் கடவுளின் இல்லம்’ என்கிறது. அந்த மூல உருவகத்தைப் பாதுகாப்பது தேவையற்ற விளக்க விரிவாக்கத்தைத் தவிர்க்கிறது.
- issue: மகன்கள் மற்றும் விலங்குகளின் முதற்பேறுகளை மீட்பது அல்லது பலியிடுவது குறித்து முதன்மை உரையில் வெளிப்படையாகச் சேர்ப்பதா
  choice: ‘முதற்பேறானவர்கள்/முதற்பேறானவை’ என்ற பொதுவான சொல்லை மட்டும் வைத்தல்
  alternative: ‘மீட்கப்பட வேண்டிய முதற்பேறுகள்’ அல்லது ‘முதற்பேறு காணிக்கைகள்’ என்று விரித்தல்
  rationale: வசனம் திருச்சட்ட விதிகளைச் சுட்டினாலும், மனித முதற்பேறுகளின் மீட்பையும் விலங்கு முதற்பேறுகளின் கையாளுதலையும் இங்கே தனித்தனியாக விளக்கவில்லை. ஆகவே மூலத்தின் கட்டுப்பாடும் இறையியல் நெருக்கடியும் பாதுகாக்கப்படுகின்றன.
translation_notes:
  register: நவீன நிலையான தமிழில், வழிபாட்டு மற்றும் உடன்படிக்கைச் சூழலுக்கேற்ற கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. வசனம் முந்தைய பட்டியலைத் தொடரும் சார்பு அமைப்பாக இருப்பதால் ‘மேலும்’ மற்றும் ‘...சேர்ப்பிக்கவும்’ என்ற தொடரமைப்பு வைக்கப்பட்டுள்ளது. ‘ஆசாரியர்கள்’ என்பது பொதுவாக அறியப்படும் வேதாகம வழிபாட்டுச் சொல்; ‘கடவுளின் இல்லம்’ மூல உருவகத்தைப் பாதுகாக்கிறது.
