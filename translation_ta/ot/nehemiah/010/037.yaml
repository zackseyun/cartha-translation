  source_fidelity: மூலத்தின் பட்டியல் அமைப்பும், ‘திருச்சட்டத்தில் எழுதியிருக்கிறபடி’ என்ற குறிப்பு, கடவுளின் இல்லம், அங்கேப் பணிபுரியும் ஆசாரியர்கள் ஆகியவை பெரும்பாலும் துல்லியமாக உள்ளன. ஆனால் ‘சேர்ப்பிக்கவும்’ என்பது எபிரேய לְהָבִיא (‘கொண்டுவர’) என்பதற்கு இயல்பான இணை அல்ல; அது ‘சேர்த்துவிடுதல்/இணைத்தல்’ என்ற வேறுபட்ட செயலைக் குறிக்கலாம். צֹאן என்பதில் செம்மறியாடுகளும் வெள்ளாடுகளும் அடங்குவதால், ‘ஆட்டு மந்தைகள்’ மட்டும் அதன் பரந்த பொருளைச் சுருக்கக்கூடும்.
  naturalness: ‘சேர்ப்பிக்கவும்’ இவ்வழிபாட்டு-காணிக்கைச் சூழலில் இயல்பற்றதாகவும், வசனத்தின் முந்தைய உடன்படிக்கைப் பட்டியலைத் தொடரும் சார்பு அமைப்புக்கு ஏற்றதல்லாத கட்டளை வடிவமாகவும் இருக்கிறது. ‘கொண்டுவருவதற்கும்’ என்ற வடிவம் பட்டியல் தொடரை நன்றாகக் காக்கிறது.
  terminology: ‘திருச்சட்டம்,’ ‘முதற்பேறானவர்கள்/முதற்பேறானவை,’ ‘கடவுளின் இல்லம்,’ ‘ஆசாரியர்கள்’ ஆகிய சொற்கள் பொருத்தமானவை. மாட்டு மந்தைகளுக்கும் צֹאן குறிக்கும் செம்மறியாடு/வெள்ளாட்டு மந்தைகளுக்கும் உள்ள வேறுபாடு திருத்தத்தில் தெளிவாக்கப்பட்டுள்ளது.
