lexical_decisions:
- source_word: דָּנִיֵּאל
  choice: தானியேல்
  rationale: இது ஓர் ஆளின் பெயர். அதன் சொற்பிறப்புப் பொருளை மொழிபெயர்க்காமல், தமிழில் நிலைபெற்ற வேதாகமப் பெயர்வடிவமான ‘தானியேல்’ பயன்படுத்தப்படுகிறது.
- source_word: גִּנְּתוֹן
  choice: கின்னெத்தோன்
  rationale: இது ஓர் ஆளின் பெயர். எபிரெய ஒலியமைப்பையும் மெய்யெழுத்து இரட்டிப்பையும் இயன்றவரை காக்கும் வகையில் தமிழில் ஒலிபெயர்க்கப்படுகிறது.
- source_word: בָּרוּךְ
  choice: பாரூக்
  rationale: இங்கு இது ‘ஆசீர்வதிக்கப்பட்டவர்’ என்ற பொதுச்சொல் அல்ல, ஓர் ஆளின் பெயர். ஆகவே அதன் பொருளை மொழிபெயர்க்காமல் ‘பாரூக்’ என்று ஒலிபெயர்க்கப்படுகிறது.
