  rationale: எபிரெய தனிப்பெயர்; דּ-இன் வலியுறுத்தப்பட்ட மெய்யை ‘த்த’ என்றும், இறுதியிலுள்ள וּעַ ஒலித்தொடரை இயல்பான தமிழ் உச்சரிப்புக்கேற்ப ‘தூவா’ என்றும் எழுத்துப்பெயர்த்துள்ளது.
