    text: 'எபிரெய மூலத்தில் இங்கு மூன்று தனிப்பெயர்கள் மட்டுமே பட்டியலிடப்பட்டுள்ளன: மெஷேசபெயேல், சாதோக், யத்தூவா. வாசிப்புத் தெளிவுக்காக நிறுத்தற்குறிகள் சேர்க்கப்பட்டுள்ளன.'
