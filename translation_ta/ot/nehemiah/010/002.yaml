translation_notes:
  register: நவீனத் தரமான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. பட்டியல் தலைப்பின் சுருக்கத்தையும் நிர்வாகச் சூழலையும் காக்கும் வகையில் வாக்கியம் அமைக்கப்பட்டுள்ளது; மூலத்தின் இலக்கணத் தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
