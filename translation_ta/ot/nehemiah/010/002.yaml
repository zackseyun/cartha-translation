base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/010/002.yaml
  text: And on the sealed document were Nehemiah the governor[a], son of Hacaliah[b], and Zedekiah.
translation:
  language: ta
  text: முத்திரையிடப்பட்ட ஆவணத்தில் பெயர்கள் இடம்பெற்றவர்கள்:[a] ஆளுநரான[b] அகலியாவின் மகன் நெகேமியாவும், சிதேக்கியாவும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொற்படியாக, “முத்திரையிடப்பட்டவர்கள்” அல்லது “முத்திரையிடப்பட்டவை.” முத்திரையிடப்பட்ட உடன்படிக்கை ஆவணத்தில் இடம்பெற்ற பெயர்களை இது குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: எபிரேயத்தில் “திர்ஷாதா”; இது பாரசீகக் காலத்தைச் சேர்ந்த ஓர் நிர்வாகப் பதவிப்பெயர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל הַחֲתוּמִים
  choice: முத்திரையிடப்பட்ட ஆவணத்தில் பெயர் இடம்பெற்றவர்கள்
  rationale: எபிரெயச் சொற்றொடர் சொற்படியாகப் பன்மையில் ‘முத்திரையிடப்பட்டவர்கள்/முத்திரையிடப்பட்டவை’ என இருந்தாலும், உடன்படிக்கை ஆவணத்துடன் இணைக்கப்பட்ட பெயர்களின் பட்டியலை அறிமுகப்படுத்துகிறது. ஆவணமும் பெயர்களும் எபிரெயத்தில் வெளிப்படையாகச் சொல்லப்படாதவை என்பதால் மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: נְחֶמְיָה
  choice: நெகேமியா
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் நன்கு அறியப்பட்ட வடிவில் பெயர் ஒலிபெயர்க்கப்படுகிறது.
- source_word: הַתִּרְשָׁתָא
  choice: ஆளுநர்
  rationale: பாரசீகக் கால நிர்வாகப் பதவியை இன்றைய வாசகர்களுக்குத் தெளிவாகப் பொருளாக்குகிறது; மூலப் பதவிப்பெயரின் ஒலிபெயர்ப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: בֶּן חֲכַלְיָה
  choice: அகலியாவின் மகன்
  rationale: בֶּן என்பதன் வழக்கமான வம்ச உறவுப் பொருளை இயல்பான தமிழில் தருகிறது; חֲכַלְיָה தமிழ் மரபுப்படி ‘அகலியா’ என ஒலிபெயர்க்கப்படுகிறது.
- source_word: וְצִדְקִיָּה
  choice: சிதேக்கியாவும்
  rationale: இணைப்பிடைச்சொல்லை ‘-உம்’ மூலம் வெளிப்படுத்தி, பெயரைத் தமிழ் வேதாகம மரபுப்படி ஒலிபெயர்க்கிறது.
