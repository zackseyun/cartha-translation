  source_fidelity: மூல எபிரெயத்தில் உள்ள மூன்று தனிப்பட்ட பெயர்களும் அதே வரிசையில் முழுமையாக இடம்பெற்றுள்ளன. «மீகா» மִיכָא என்பதிலிருந்து வேறுபட்ட குறும் பெயர் வடிவத்தைத் தக்கவைக்கிறது. «ரெகோபு», «அசபியா» ஆகியவை தமிழ் வேதாகமப் பெயர்மரபில் நிலையான, வாசிக்க இயல்பான ஒலிபெயர்ப்புகளாக உள்ளன; பொருளாக்கம் அல்லது விளக்கச் சேர்க்கை எதுவும் இல்லை.
  naturalness: பெயர்ப் பட்டியலுக்குரிய சுருக்கமான நவீனத் தமிழ் நடை இயல்பாக உள்ளது. காற்புள்ளிகளும் முற்றுப்புள்ளியும் தெளிவான பட்டியல் வடிவத்தை வழங்குகின்றன.
  terminology: தனிப்பட்ட பெயர்கள் ஒலிபெயர்ப்பாகவே தரப்பட்டுள்ளன. «மீகா» என்பது நீண்ட «மீகாயா/மீகாயாகு» வடிவத்துடன் குழப்பப்படவில்லை. «ரெகோபு» மற்றும் «அசபியா» தமிழ் வேதாகமப் பயன்பாட்டோடு ஒத்துப்போகின்றன; இறுதி உயிர்ச் சேர்க்கை தமிழ் உச்சரிப்பு மரபுக்கேற்றது.
