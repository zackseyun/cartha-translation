lexical_decisions:
- source_word: מִיכָא
  choice: மீகா
  rationale: எபிரெய தனிப்பட்ட பெயரைத் தமிழில் இயல்பாக ஒலிபெயர்த்துள்ளது; நீண்ட வடிவமான ‘மீகாயா’ என்பதிலிருந்து வேறுபடுத்தப்படுகிறது.
- source_word: רְחוֹב
  choice: ரெகோபு
  rationale: எபிரெய தனிப்பட்ட பெயரின் ஒலியைத் தமிழில் அண்மையாகக் கொடுக்கிறது; ח எழுத்தின் உராய்வு ஒலிக்காக ‘க’ பயன்படுத்தப்பட்டு, வாசிப்புக்கு இயல்பான இறுதி ‘உ’ சேர்க்கப்பட்டுள்ளது.
- source_word: חֲשַׁבְיָה
  choice: அசபியா
  rationale: எபிரெய தனிப்பட்ட பெயரைத் தமிழ் வேதாகமப் பெயர் மரபுக்கும் நவீன வாசிப்புக்கும் ஏற்றவாறு ஒலிபெயர்க்கிறது; தொடக்க ח தமிழ் வழக்கில் தனியே குறிக்கப்படாமல் விடப்படுகிறது, இறுதி -יָה ‘-யா’ சார்ந்த ‘-ியா’ வடிவில் தரப்படுகிறது.
