source:
  edition: WLC
  text: וַ/אֲשֶׁ֛ר לֹא נִתֵּ֥ן בְּנֹתֵ֖י/נוּ לְ/עַמֵּ֣י הָ/אָ֑רֶץ וְ/אֶת בְּנֹ֣תֵי/הֶ֔ם לֹ֥א נִקַּ֖ח לְ/בָנֵֽי/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/010/031.yaml
  text: and that we will not give our daughters to the peoples of the land[b][a], nor take their daughters for our sons.
translation:
  language: ta
  text: மேலும், எங்கள் மகள்களை நாட்டின் மக்களினங்களுக்குக் கொடுக்கமாட்டோம்; அவர்களுடைய மகள்களை எங்கள் மகன்களுக்காக எடுத்துக்கொள்ளமாட்டோம்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘எடுத்துக்கொள்வது’ என்பது இங்கே அவர்களுடைய மகள்களை எங்கள் மகன்களுக்குத் திருமணம் செய்வதற்காக எடுத்துக்கொள்வதைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲשֶׁר
  choice: மேலும்
  rationale: முந்தைய உறுதிமொழியுடன் இந்த விதியையும் இணைக்கும் எபிரெயச் சொல்லின் தொடர்ச்சி மற்றும் சார்பு இயல்பை இயல்பான தமிழில் காட்டுகிறது.
- source_word: לֹא נִתֵּן בְּנֹתֵינוּ
  choice: நாங்கள் எங்கள் மகள்களைக் கொடுக்கமாட்டோம்
  rationale: yiqtol வடிவம் இச்சூழலில் உடன்படிக்கையின் கீழான எதிர்கால உறுதிப்பாட்டை வெளிப்படுத்துகிறது; மகள்கள் என்ற பாலினக் குறிப்பும் தக்கவைக்கப்படுகிறது.
- source_word: לְעַמֵּי הָאָרֶץ
  choice: இந்த நாட்டின் மக்களினங்களுக்கு
  rationale: עַמֵּי என்பது பன்மை என்பதால் ‘மக்களினங்கள்’ என மொழிபெயர்க்கப்பட்டது; הָאָרֶץ சூழலுக்கேற்றவாறு ‘இந்த நாடு’ எனக் காட்டப்படுகிறது.
- source_word: וְאֶת בְּנֹתֵיהֶם לֹא נִקַּח
  choice: அவர்களுடைய மகள்களை ... ஏற்றுக்கொள்ளவும் மாட்டோம்
  rationale: לָקַח என்பதன் அடிப்படை ‘எடுத்துக்கொள்’ என்ற பொருளைத் தமிழில் இயல்பாகக் காட்டும் ‘ஏற்றுக்கொள்’ பயன்படுத்தப்பட்டு, திருமணப் பொருள் அடிக்குறிப்பில் தெளிவுபடுத்தப்படுகிறது.
- source_word: לְבָנֵינוּ
  choice: எங்கள் மகன்களுக்காக
  rationale: எபிரெய உரையின் குறிப்பிட்ட ஆண்பால் பன்மையான ‘எங்கள் மகன்கள்’ என்பதைக் காக்கிறது.
theological_decisions:
- issue: திருமணத் தடையை இனவாத அல்லது மதப்பிரிவு சார்ந்த விளக்கமாக மாற்றாமல் மொழிபெயர்த்தல்
  choice: இந்த நாட்டின் மக்களினங்கள்
  alternative: புறமத மக்களினங்கள் / அந்நிய மக்களினங்கள் / நாட்டின் குடிகள்
  rationale: மூலத்தில் இல்லாத ‘புறமத’ அல்லது ‘அந்நிய’ என்ற விளக்கங்களைச் சேர்க்காமல், எபிரெயப் பன்மையையும் நிலத்துடனான தொடர்பையும் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான உடன்படிக்கை மொழிநடை. எபிரெயப் பன்மை ‘மக்களினங்கள்’ எனப் பாதுகாக்கப்பட்டுள்ளது; திருமணச் சூழல் பிரதான உரையில் அதிகமாக விளக்கப்படாமல் அடிக்குறிப்பில் தெளிவுபடுத்தப்பட்டுள்ளது.
