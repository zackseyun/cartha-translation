  rationale: முந்தைய வசனங்களிலிருந்து தொடரும் பெயர்ப்பட்டியலில் வரும் இணைப்புச்சொல் தமிழில் இயல்பாகத் தனியே மொழிபெயர்க்கப்படாமல் விடப்பட்டது. אֲחִיָּה என்ற பெயர் எபிரெய ஒலிப்புக்கு நெருக்கமாக ‘அகியா’ என ஒலிபெயர்க்கப்பட்டது.
