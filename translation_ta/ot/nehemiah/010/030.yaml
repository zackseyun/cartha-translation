  revised_text: அவர்கள் தங்கள் சகோதரர்களுடனும் தங்கள் பிரமுகர்களுடனும் இணைந்து,[a] சாபத்திலும் ஆணையிலும் நுழைந்து,[b] கடவுளின் ஊழியரான மோசேயின் வழியாகக் கொடுக்கப்பட்ட கடவுளின் சட்டத்தின்படி நடக்கவும்,[c] நம் ஆண்டவராகிய யாவேயின் எல்லாக் கட்டளைகளையும் அவருடைய நீதிநியமங்களையும் சட்டதிட்டங்களையும் கடைப்பிடித்துச் செயல்படுத்தவும் ஒப்புக்கொள்கிறார்கள்.[d]
