  revision_rationale: மூலத்தின் சொற்றொடர் அமைப்பை நெருக்கமாகப் பின்பற்றி, சகோதரர்களையும் பிரமுகர்களையும் தனித்தனியாக வைத்துள்ளேன். சாபம் மற்றும் ஆணை என்ற இரு உடன்படிக்கைச் சொற்களும் முதன்மை உரையில் பாதுகாக்கப்பட்டுள்ளன. Yahweh-க்கான திட்டத் தீர்மானத்தோடு ஒத்துப்போக ‘யாவே’ பயன்படுத்தப்பட்டுள்ளது. மோசேயின் வழியாகக் கொடுக்கப்பட்ட சட்டத்தின்படி நடப்பதும், யாவேயின் கட்டளைகள், நீதிநியமங்கள், சட்டதிட்டங்கள் அனைத்தையும் கடைப்பிடித்துச் செயல்படுத்துவதும் என மூலத்தின் இரட்டை infinitive நோக்கம் தமிழில் இயல்பாகத் தரப்பட்டுள்ளது.
