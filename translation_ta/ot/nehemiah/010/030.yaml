- from: அவர்கள் தங்கள் சகோதரர்களாகிய பிரமுகர்களுடன் உறுதியாக இணைந்து,[a] கடவுளின் ஊழியரான மோசேயின் வழியாகக் கொடுக்கப்பட்ட கடவுளின் திருச்சட்டத்தின்படி நடப்போம் என்றும்,[c] நம் ஆண்டவராகிய யெகோவாவின் கட்டளைகள், நீதிநியமங்கள், சட்டதிட்டங்கள் அனைத்தையும் கடைப்பிடித்துச் செயல்படுத்துவோம் என்றும், சாபத்துக்கு உட்பட்ட ஓர் ஆணையை ஏற்கிறார்கள்.[b][d]
  to: அவர்கள் தங்கள் சகோதரர்களுடனும் தங்கள் பிரமுகர்களுடனும் இணைந்து,[a] சாபத்திலும் ஆணையிலும் நுழைந்து,[b] கடவுளின் ஊழியரான மோசேயின் வழியாகக் கொடுக்கப்பட்ட கடவுளின் சட்டத்தின்படி நடக்கவும்,[c] நம் ஆண்டவராகிய யாவேயின் எல்லாக் கட்டளைகளையும் அவருடைய நீதிநியமங்களையும் சட்டதிட்டங்களையும் கடைப்பிடித்துச் செயல்படுத்தவும் ஒப்புக்கொள்கிறார்கள்.[d]
