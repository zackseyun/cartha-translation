base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/010/030.yaml
  text: They join with their brothers[a], their nobles, and enter into a curse and an oath, to walk in the law of God, which was given by the hand of Moses the servant of God, and to keep and to do all the commandments of Yahweh our Lord[d][c][b], and his judgments and his statutes.
translation:
  language: ta
  text: அவர்கள் தங்கள் சகோதரர்களுடனும் தங்கள் பிரமுகர்களுடனும் இணைந்து,[a] சாபத்திலும் ஆணையிலும் நுழைந்து,[b] கடவுளின் ஊழியரான மோசேயின் வழியாகக் கொடுக்கப்பட்ட கடவுளின் சட்டத்தின்படி நடக்கவும்,[c] நம் ஆண்டவராகிய யாவேயின் எல்லாக் கட்டளைகளையும் அவருடைய நீதிநியமங்களையும் சட்டதிட்டங்களையும் கடைப்பிடித்துச் செயல்படுத்தவும் ஒப்புக்கொள்கிறார்கள்.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தங்கள் சகோதரர்களையும் தங்கள் பிரமுகர்களையும் உறுதியாகப் பற்றிக்கொண்டு.” எபிரெயத் தொடர், உடன்படிக்கை ஒற்றுமையில் சமூகத்தின் முக்கிய உறுப்பினர்களுடன் தங்களை உறுதியாக இணைத்துக்கொள்வதைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “சாபத்திலும் ஆணையிலும்” என்பது, கீழ்ப்படியத் தவறினால் உடன்படிக்கையின் சாபவிளைவுகளைத் தாங்களே ஏற்றுக்கொள்வதாக உறுதியளிக்கும் உடன்படிக்கைப் பிரமாணத்தைக் குறிக்கிறது.
    reason: cultural_note
  - marker: c
    text: சொல்லர்த்தமாக, “மோசேயின் கையால் கொடுக்கப்பட்ட.”
    reason: lexical_alternative
  - marker: d
    text: “நீதிநியமங்கள்” என்பதை “முறைமைகள்” என்றும், “சட்டதிட்டங்கள்” என்பதை “நிர்ணயங்கள்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַחֲזִיקִים עַל אֲחֵיהֶם אַדִּירֵיהֶם
  choice: தங்கள் சகோதரர்களாகிய பிரமுகர்களுடன் உறுதியாக இணைந்து
  rationale: חזק על என்பது இங்கு உடன்படிக்கை ஒற்றுமையில் உறுதியாக இணைவதைக் குறிக்கிறது. appositional வாசிப்பின்படி ‘அவர்களுடைய சகோதரர்கள், அவர்களுடைய பிரமுகர்கள்’ என்பதை இயல்பான தமிழில் ‘சகோதரர்களாகிய பிரமுகர்கள்’ என வழங்குகிறது; எபிரெயச் சொற்றொடரின் சாத்தியமான வேறு புரிதல் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: וּבָאִים בְּאָלָה וּבִשְׁבוּעָה
  choice: சாபத்துக்கு உட்பட்ட ஓர் ஆணையை ஏற்கிறார்கள்
  rationale: சாபமும் ஆணையும் தனித்தனியான சாதாரண செயல்கள் அல்ல; உடன்படிக்கையை மீறினால் சாபத்தை ஏற்றுக்கொள்ளும் உறுதிமொழி என்பதைக் காட்டும் இயல்பான தமிழ் வடிவம்.
- source_word: לָלֶכֶת בְּתוֹרַת הָאֱלֹהִים
  choice: கடவுளின் திருச்சட்டத்தின்படி நடப்போம்
  rationale: ‘நடத்தல்’ என்ற எபிரெய உருவகத்தைப் பேணுகிறது; תּוֹרָה இச்சட்ட-உடன்படிக்கைச் சூழலில் ‘திருச்சட்டம்’ என மொழிபெயர்க்கப்படுகிறது.
- source_word: אֲשֶׁר נִתְּנָה בְּיַד מֹשֶׁה
  choice: மோசேயின் வழியாகக் கொடுக்கப்பட்ட
  rationale: ‘மோசேயின் கையால்’ என்ற எபிரெய மொழிமரபு, மோசேயின் மூலம் வழங்கப்பட்டது என்ற பொருளில் இயல்பான தமிழில் தரப்படுகிறது.
- source_word: עֶבֶד הָאֱלֹהִים
  choice: கடவுளின் ஊழியரான
  rationale: மோசேக்கான கௌரவப் பட்டமாக இருப்பதால் עֶבֶד என்பதற்கு இங்கு ‘ஊழியர்’ பொருத்தமானது.
- source_word: וְלִשְׁמוֹר וְלַעֲשׂוֹת
  choice: கடைப்பிடித்துச் செயல்படுத்துவோம்
  rationale: கட்டளைகளைக் கவனமாகப் பேணுதல் மற்றும் நடைமுறையில் செய்தல் ஆகிய இரு வினைகளின் வலியுறுத்தலைப் பாதுகாக்கிறது.
- source_word: יְהוָה אֲדֹנֵינוּ
  choice: நம் ஆண்டவராகிய யெகோவா
  rationale: தெய்வீகப் பெயரையும் அதைத் தொடர்ந்து வரும் ‘நம் ஆண்டவர்’ என்ற பட்டத்தையும் வேறுபடுத்திப் பாதுகாக்கிறது.
- source_word: מִצְוֺת ... מִשְׁפָּטָיו וְחֻקָּיו
  choice: கட்டளைகள், நீதிநியமங்கள், சட்டதிட்டங்கள்
  rationale: மூன்று தொடர்புடைய சட்டச் சொற்களின் வேறுபாட்டை இயன்றவரைத் தக்கவைக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யெகோவா
  alternative: யாவே; கர்த்தர்
  rationale: மூலத்தில் தனிப்பட்ட உடன்படிக்கைப் பெயர் நேரடியாக உள்ளது; அதை ஒரு பட்டத்தால் மாற்றாமல் தமிழில் பரவலாக அறியப்படும் பெயர்வடிவமாக வழங்குகிறது. ‘யாவே’ என்பது மற்றொரு ஒலிபெயர்ப்பு.
- issue: אֲחֵיהֶם என்ற ஆண்பால் உறவுமுறைச் சொல்
  choice: அவர்களுடைய சகோதரர்கள்
  alternative: அவர்களுடைய உறவினர்; சக இஸ்ரவேலர்
  rationale: மூலத்தின் ஆண்பால் பன்மை உறவுமுறைச் சொல்லை நடுநிலைப்படுத்தாமல் பாதுகாக்கிறது.
- issue: மோசேக்கு வழங்கப்படும் עֶבֶד பட்டம்
  choice: கடவுளின் ஊழியர்
  alternative: கடவுளின் அடியார்; கடவுளின் அடிமை
  rationale: இங்கு அடிமைநிலை அல்ல, கௌரவமான பணியாளர் அடையாளமே முன்னிலைப்படுவதால் இயல்பான மரியாதைமிக்க சொல்லைத் தேர்ந்தெடுக்கிறது.
- issue: சாபமும் ஆணையும் கொண்ட உடன்படிக்கை மொழி
  choice: சாபத்துக்கு உட்பட்ட ஓர் ஆணை
  alternative: ஒரு சாபத்திலும் ஓர் ஆணையிலும் நுழைகிறார்கள்
  rationale: தாங்களே தங்கள் மீது சாபத் தண்டனையை ஏற்றுக்கொண்டு கீழ்ப்படிதலை உறுதியளிக்கும் தீவிரத்தைத் தெளிவாக்குகிறது; விளக்கம் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் மரியாதைமிக்க, பொதுமக்களுக்கு எளிதில் புரியும் நடை. நீண்ட எபிரெய வாக்கியம் தமிழில் இயல்பாக ஓடும்படி உறுதிமொழியின் உள்ளடக்கம் மேற்கோள் சார்ந்த வடிவில் அமைக்கப்பட்டுள்ளது; உடன்படிக்கைச் சட்ட மொழியின் செறிவும் மூன்று சட்டச் சொற்களின் வேறுபாடும் பாதுகாக்கப்பட்டுள்ளன.
