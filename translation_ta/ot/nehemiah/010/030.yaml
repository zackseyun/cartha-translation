  source_fidelity: திருத்தம் தேவை. வரைவில் אֲחֵיהֶם மற்றும் אַדִּירֵיהֶם ஆகிய இரு இணைச் சொற்கள் “சகோதரர்களாகிய பிரமுகர்கள்” என ஒன்றாக்கப்பட்டுள்ளன; மூலத்தில் அவை “அவர்களின் சகோதரர்கள், அவர்களின் பிரமுகர்கள்” எனத் தனித்தனியாக உள்ளன. மேலும் “சாபத்துக்கு உட்பட்ட ஓர் ஆணை” என்பது சாபமும் ஆணையும் என்ற இரட்டைப் பதத்தை ஒரே கருத்தாகச் சுருக்குகிறது. யெகோவா என்பது வழங்கப்பட்ட POB audit trail-இன் Yahweh பெயர்வடிவத்துடன் ஒத்துப்போகவில்லை.
  naturalness: தற்போதைய வாக்கியம் தமிழில் புரியக்கூடியது; ஆனால் உறுதிமொழியின் உள்ளடக்கத்தை “நடப்போம் ... செயல்படுத்துவோம்” என நேரடி மேற்கோள் போல் மாற்றி, இறுதியில் “ஏற்கிறார்கள்” என அமைத்திருப்பது மூலத்தின் தொடர்ச்சியான infinitive அமைப்பிலிருந்து விலகுகிறது. திருத்தப்பட்ட வடிவம் நவீன நிலையான தமிழில் நேரடியாகவும் இயல்பாகவும் உள்ளது.
  terminology: யாவே என்பது இத்திட்டத்தின் Yahweh பயன்பாட்டிற்கு ஏற்ற தமிழ்ப் பெயர்வடிவம். “கடவுளின் சட்டம்,” “கடவுளின் ஊழியர்,” “கட்டளைகள், நீதிநியமங்கள், சட்டதிட்டங்கள்” ஆகியவை மூலத்தின் சட்ட மற்றும் மரியாதைமிக்க பதிவைத் தக்கவைக்கின்றன. “திருச்சட்டம்” மூலத்தில் இல்லாத புனித-அடைமொழியைச் சேர்க்கக்கூடும் என்பதால் தவிர்க்கப்பட்டுள்ளது.
