base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/010/029.yaml
  text: and the rest of the people—the priests[a], the Levites, the gatekeepers, the singers, the temple servants, and all who had separated themselves from the peoples of the lands to the law of God—their wives, their sons, and their daughters[b], everyone who knew and understood—
translation:
  language: ta
  text: மீதமுள்ள மக்களும்—ஆசாரியர்களும், லேவியர்களும், வாயில் காவலர்களும், பாடகர்களும், ஆலயப் பணியாளர்களும்[a], தேசங்களின் மக்களிடமிருந்து விலகி, கடவுளுடைய சட்டத்தைப் பின்பற்றுவதற்காகத் தங்களைப் பிரித்துக்கொண்ட அனைவரும்—அவர்களுடைய மனைவிகளும், மகன்களும், மகள்களும், அறிந்தும் புரிந்தும் உள்ள ஒவ்வொருவரும்[b]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நெத்தினிமியர்”; ஆலயத்தில் பணிபுரிந்த ஒரு வகுப்பினருக்கான மரபுவழிப் பெயர்.
    reason: lexical_alternative
  - marker: b
    text: “தங்களைப் பிரித்துக்கொண்ட அனைவரும்” என்றும் “ஒவ்வொருவரும்” என்றும் மொழிபெயர்க்கப்பட்ட சொற்கள் எபிரெயத்தில் ஆண்பால் ஒருமை வடிவில் இருந்தாலும், இங்கு அவை ஒரு குழுவை மொத்தமாகக் குறிக்கின்றன.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׁאָר הָעָם
  choice: மற்ற மக்களும்
  rationale: שְׁאָר என்பது எஞ்சிய அல்லது மற்ற பகுதியைக் குறிக்கிறது; பட்டியலின் தொடர்ச்சியைத் தமிழில் இயல்பாகக் காட்ட “மற்ற மக்களும்” என வழங்கப்பட்டது.
- source_word: הַכֹּהֲנִים הַלְוִיִּם הַשּׁוֹעֲרִים הַמְשֹׁרְרִים
  choice: ஆசாரியர்களும், லேவியர்களும், வாயிற்காவலர்களும், பாடகர்களும்
  rationale: ஒவ்வொரு ஆலயப் பணிக்குழுவின் தனித்தன்மையையும் எபிரெயப் பட்டியலையும் தெளிவாகப் பாதுகாக்கும் வழக்கமான சொற்கள்.
- source_word: הַנְּתִינִים
  choice: ஆலயப் பணியாளர்கள்
  rationale: நெதினீமியர் என்ற ஒலிபெயர்ப்பைவிட இக்குழுவின் பணியை நவீன வாசகர்களுக்குத் தெளிவுபடுத்தும் பொருள் சார்ந்த மொழிபெயர்ப்பு.
- source_word: וְכָל הַנִּבְדָּל מֵעַמֵּי הָאֲרָצוֹת
  choice: அந்நிய தேசத்து மக்களிடமிருந்து தங்களைப் பிரித்துக்கொண்ட அனைவரும்
  rationale: பன்மையான “தேசங்களின் மக்கள்” என்பதைக் கடினமான சொல்லடுக்கின்றி எடுத்துரைக்கிறது; ஒருமைச் செயப்பெயர் கூட்டுப்பொருளில் இருப்பதால் தமிழில் இயல்பான பன்மைத் தற்சுட்டு பயன்படுத்தப்பட்டது.
- source_word: אֶל תּוֹרַת הָאֱלֹהִים
  choice: கடவுளுடைய திருச்சட்டத்தைப் பின்பற்றுவதற்காக
  rationale: אֶל என்பதன் திசை அல்லது இணைவு நுணுக்கத்தை, பிரிவின் நோக்கம் கடவுளுடைய தோராவோடு இணைந்து அதன்படி நடப்பது எனத் தெளிவான தமிழில் வெளிப்படுத்துகிறது.
- source_word: נְשֵׁיהֶם בְּנֵיהֶם וּבְנוֹתֵיהֶם
  choice: அவர்களுடைய மனைவிகளும் மகன்களும் மகள்களும்
  rationale: மனைவிகள், மகன்கள், மகள்கள் என்ற மூன்று வெளிப்படையான எபிரெயக் கூறுகளையும் சுருக்காமல் பாதுகாக்கிறது.
- source_word: כֹּל יוֹדֵעַ מֵבִין
  choice: அறிந்து புரிந்துகொள்ளும் திறனுள்ள ஒவ்வொருவரும்
  rationale: உடன்படிக்கையில் அறிவோடு பங்கேற்கப் போதிய புரிதல் உடையவர்களை இவ்விணைச் செயப்பெயர்கள் குறிக்கின்றன; திறனை வெளிப்படுத்தும் இம்மொழிபெயர்ப்பு சூழலுக்கும் தமிழுக்கும் இயல்பானது.
theological_decisions:
- issue: הַנִּבְדָּל / יוֹדֵעַ מֵבִין ஆகிய ஆண்பால் ஒருமை வடிவங்களின் கூட்டுப்பொருள்
  choice: “தங்களைப் பிரித்துக்கொண்ட அனைவரும்” என்றும் “ஒவ்வொருவரும்” என்றும் கூட்டத்தைக் குறிக்கும் இயல்பான தமிழில் வழங்குதல்
  alternative: “தன்னைப் பிரித்துக்கொண்ட ஒவ்வொரு ஆணும்” போன்ற இலக்கண வடிவைப் பிரதிபலிக்கும் மொழிபெயர்ப்பு
  rationale: எபிரெய ஆண்பால் ஒருமைகள் இங்கு கூட்டுப்பொருளில் வருகின்றன; மனைவிகள், மகன்கள், மகள்கள் என்று உரையே கலப்புக் குழுவை வெளிப்படையாகச் சொல்வதால், தமிழில் ஆண்களுக்கு மட்டும் உரியது என்ற தவறான எண்ணத்தை ஏற்படுத்தாமல் கூட்டுப்பொருளைப் பாதுகாக்கிறது.
- issue: נְתִינִים என்ற ஆலயப் பணிக்குழுவின் பெயர்
  choice: “ஆலயப் பணியாளர்கள்” எனப் பொருள் மொழிபெயர்த்தல்
  alternative: “நெதினீமியர்” என ஒலிபெயர்த்தல்
  rationale: பணிக்குழுவின் அடையாளத்தை வாசகர்களுக்குப் புரியவைக்கிறது; குறிப்பிட்ட சமய மரபின் கூடுதல் விளக்கத்தைச் சேர்ப்பதில்லை.
- issue: אֶל תּוֹרַת הָאֱלֹהִים என்பதற்கும் “பிரித்துக்கொண்ட” என்பதற்கும் உள்ள உறவு
  choice: பிரிவின் நோக்கமாக “திருச்சட்டத்தைப் பின்பற்றுவதற்காக” என வழங்குதல்
  alternative: “கடவுளுடைய திருச்சட்டத்திற்குத் தங்களைப் பிரித்துக்கொண்ட” என்ற நேரடியான வடிவம்
  rationale: மூலத்தின் திசை/இணைவு பொருளை தமிழில் புரியக்கூடியதாக வெளிப்படுத்துகிறது; அவர்கள் வெறுமனே பிற மக்களிடமிருந்து விலகியதல்ல, கடவுளின் தோராவுடன் தங்களை இணைத்துக்கொண்டனர் என்பதையும் காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், வாசிக்க எளிதாகவும் வழிபாட்டு உரைக்கேற்ற கண்ணியத்துடனும் அமைக்கப்பட்டது. வசனம் அடுத்த வசனத்தில் தொடரும் வாக்கியத் துணுக்காக இருப்பதால் இறுதியில் நீண்ட கோடு வைக்கப்பட்டது. “திருச்சட்டம்” என்பது תּוֹרָה என்பதன் உடன்படிக்கைச் சூழலையும் புனித தன்மையையும் சுருக்கமாக உணர்த்துகிறது.
