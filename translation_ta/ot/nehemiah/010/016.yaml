lexical_decisions:
- source_word: בֻּנִּי
  choice: புன்னி
  rationale: இது ஓர் எபிரெயத் தனிப்பெயர். அதன் பொருளை மொழிபெயர்க்காமல், தமிழ் வாசிப்புக்கு இயல்பான வகையில் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: עַזְגָּד
  choice: அஸ்காத்
  rationale: இது ஓர் எபிரெயத் தனிப்பெயர். எபிரெய ஒலியமைப்பை இயன்றவரை நெருக்கமாகக் காட்டும் வகையில் தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: בֵּבָי
  choice: பேபாய்
  rationale: இது ஓர் எபிரெயத் தனிப்பெயர். பெயரின் அடையாளச் செயல்பாட்டைப் பேணும் வகையில், பொருள் மொழிபெயர்ப்பு செய்யாமல் ஒலிபெயர்க்கப்பட்டுள்ளது.
