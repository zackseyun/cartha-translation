  text: וּ/בְ/כָל זֹ֕את אֲנַ֛חְנוּ כֹּרְתִ֥ים אֲמָנָ֖ה וְ/כֹתְבִ֑ים וְ/עַל֙ הֶֽ/חָת֔וּם שָׂרֵ֥י/נוּ לְוִיֵּ֖/נוּ כֹּהֲנֵֽי/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/010/001.yaml
  text: And because of all this[a], we are making a binding agreement in writing, and on the sealed document are our officials, our Levites[b], and our priests.
translation:
  language: ta
  text: இவை அனைத்தின் காரணமாகவும்[a], நாங்கள் உறுதியான ஓர் உடன்பாட்டைச் செய்து, அதை எழுத்தில் பதிவு செய்கிறோம்; முத்திரையிடப்பட்ட அந்த ஆவணத்திற்கு முத்திரையிட்டவர்கள் எங்கள் அதிகாரிகள், எங்கள் லேவியர்கள், எங்கள் ஆசாரியர்கள்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இவை அனைத்திலும், நாங்கள் உறுதியான ஓர் உடன்பாட்டைச் செய்து அதை எழுதிவைக்கிறோம்.” உடன்பாடு செய்வதை எபிரெய மொழி சொற்பட “வெட்டுகிறோம்” என்று கூறுகிறது; பெயர்ச்சொல்லை “உறுதியான உடன்பாடு” அல்லது “நம்பிக்கைக்குரிய உறுதிமொழி” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “முத்திரையிடப்பட்ட ஆவணத்தின் மேல்.” எபிரெயச் சொற்றொடர் சுருக்கமாக உள்ளது; அது முறையாக முத்திரையிடப்பட்ட எழுத்துப்பூர்வ உடன்பாட்டு ஆவணத்தைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְכָל זֹאת
  choice: இவை அனைத்தின் காரணமாகவும்
  rationale: בְּ இங்கு முந்தைய அறிக்கையையும் சூழ்நிலைகளையும் பின்னோக்கிச் சுட்டி காரணப் பொருள் தருகிறது; இயல்பான தமிழில் அதைத் தெளிவாகக் காட்டுகிறது.
- source_word: כֹּרְתִים אֲמָנָה
  choice: உறுதியான ஓர் உடன்பாட்டை ... செய்கிறோம்
  rationale: כרת என்பதன் சொற்பொருள் ‘வெட்டுதல்’ என்றாலும், உடன்பாட்டுடன் வரும் எபிரெய மரபுத்தொடர் ‘உடன்பாடு செய்தல்’ எனப் பொருள்படும். אֲמָנָה அந்த ஒப்பந்தத்தின் உறுதியையும் கட்டுப்படுத்தும் தன்மையையும் காட்டுகிறது.
- source_word: וְכֹתְבִים
  choice: எழுத்தில்
  rationale: உடன்பாடு எழுத்து வடிவில் பதிவு செய்யப்படுவதைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: וְעַל הֶחָתוּם
  choice: முத்திரையிடப்பட்ட ஆவணத்தில்
  rationale: הֶחָתוּם என்பது முத்திரையிடப்பட்ட எழுத்துப்பூர்வமான சட்டபூர்வ ஆவணத்தைக் குறிக்கிறது.
- source_word: שָׂרֵינוּ
  choice: எங்கள் அதிகாரிகள்
  rationale: சிறையிருப்புக்குப் பிந்தைய நிர்வாகச் சூழலில் שׂרים என்போர் அரசகுமாரர்கள் என்பதைக் காட்டிலும் அங்கீகரிக்கப்பட்ட குடியியல் அதிகாரிகள் எனப் புரிந்துகொள்வது பொருத்தமானது.
- source_word: לְוִיֵּינוּ
  choice: எங்கள் லேவியர்கள்
  rationale: கோவில் பணியுடன் தொடர்புடைய குழுவின் வழக்கமான தமிழ்ப் பெயர்.
- source_word: כֹּהֲנֵינוּ
  choice: எங்கள் ஆசாரியர்கள்
  rationale: இஸ்ரவேலின் வழிபாட்டுப் பணியாளர்களைக் குறிக்கும் כֹּהֲנִים என்பதற்கான நிலைபெற்ற தமிழ்ச் சொல்.
