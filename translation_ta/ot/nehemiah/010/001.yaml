translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான சட்ட/உடன்பாட்டு நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. எபிரெயத்தின் சுருக்கமான இறுதித்தொடரில் ‘பெயர்கள்’ என்பது சூழலிலிருந்து நிரப்பப்பட்டுள்ளது; அதிலுள்ள பெயர்கள்/முத்திரைகள் என்ற தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
