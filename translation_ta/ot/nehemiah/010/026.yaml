- source_word: רְחוּם
  choice: ரெகூம்
  rationale: உடன்படிக்கையில் முத்திரையிட்டவர்களின் பெயர்ப்பட்டியலில் வரும் தனிப்பெயர்; எபிரெய ஒலிப்பைத் தமிழில் இயல்பாக எழுத்துப்பெயர்த்துள்ளது.
- source_word: חֲשַׁבְנָה
  choice: அசப்னா
  rationale: தனிப்பெயர் என்பதால் பொருள் மொழிபெயர்ப்பு செய்யாமல் எழுத்துப்பெயர்க்கப்பட்டுள்ளது; தொடக்க חֲ ஒலி தமிழின் வழக்கமான வேதாகமப் பெயராக்க மரபுக்கு ஏற்ப ‘அ’ என வழங்கப்பட்டுள்ளது.
- source_word: מַעֲשֵׂיָה
  choice: மாசெயா
  rationale: இறைப்பெயர்க் கூறுடைய தனிப்பெயராக இருந்தாலும் அதன் பொருளை மொழிபெயர்க்காமல், எபிரெய வடிவுக்கு நெருக்கமாக எழுத்துப்பெயர்க்கப்பட்டுள்ளது.
