lexical_decisions:
- source_word: רָאשֵׁי
  choice: தலைவர்கள்
  rationale: רֹאשׁ என்பதன் பன்மை இணைப்புநிலை இங்கு தலைமைப் பொறுப்பிலுள்ளவர்களைக் குறிக்கும் மரபுத்தொடராக உள்ளது. நவீனத் தமிழில் ‘தலைவர்கள்’ என்பது இயல்பாகவும் தெளிவாகவும் இருந்து, ‘தலைகள்’ என்ற எபிரெய உருவகத்தின் பொருளைப் பாதுகாக்கிறது.
- source_word: הָעָם
  choice: மக்களின்
  rationale: இங்கு עַם என்பது உடன்படிக்கைப் பட்டியலில் பிரதிநிதித்துவம் பெறும் யூதா/எருசலேம் சமூக மக்களைக் குறிக்கிறது; ‘மக்கள்’ என்பது இயல்பான பொதுச் சொல்.
- source_word: פַּרְעֹשׁ
  choice: பாரோஷ்
  rationale: தனிநபர் அல்லது குடும்பப் பெயர்; எபிரெய ஒலிப்புக்கு நெருக்கமாக ஒலிபெயர்க்கப்பட்டது.
- source_word: פַּחַת מוֹאָב
  choice: பாகாத்-மோவாப்
  rationale: இரு கூறுகளைக் கொண்ட பெயராக இருப்பதைத் தெளிவுபடுத்த இணைப்புக்குறியுடன் ஒலிபெயர்க்கப்பட்டது; பொருள் மொழிபெயர்க்கப்படவில்லை.
- source_word: עֵילָם
  choice: ஏலாம்
  rationale: வேறு இடங்களில் ஒரு பிரதேசத்தைக் குறிக்கக்கூடிய பெயராயினும், இங்கு பட்டியலின் சூழலில் தனிநபர் அல்லது குடும்பப் பெயராக ஒலிபெயர்க்கப்பட்டது.
- source_word: זַתּוּא
  choice: சத்தூ
  rationale: எபிரெய பெயரின் ஒலியமைப்பைப் பின்பற்றி தமிழில் ஒலிபெயர்க்கப்பட்டது.
- source_word: בָּנִי
  choice: பானி
  rationale: இவ்வசனத்தின் மெய்யெழுத்து மற்றும் உயிர்க்குறியீட்டு வடிவம் பானி என்பதையே ஆதரிக்கிறது; ஒத்த பெயர்களுடன் ஒத்திசைக்கப்படவில்லை.
