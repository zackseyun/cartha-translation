base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/010/039.yaml
  text: And the priest[a], a son of Aaron, shall be with the Levites when the Levites collect the tithe, and the Levites shall bring up the tithe of the tithe to the house of our God[b], to the chambers of the storehouse.
translation:
  language: ta
  text: லேவியர்கள் பத்திலொரு பங்கைச் சேகரிக்கும்போது, ஆரோனின் வழிவந்த ஓர் ஆசாரியர் அவர்களுடன் இருக்க வேண்டும். லேவியர்கள் அந்தப் பத்திலொரு பங்கிலிருந்து பத்திலொரு பங்கை[a] நம் கடவுளின் ஆலயத்திற்கு, களஞ்சியத்தின் அறைகளுக்கு[b] மேலே கொண்டுசெல்ல வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மொழியில், “பத்திலொரு பங்கின் பத்திலொரு பங்கு” என்று உள்ளது. லேவியர்கள் தாங்கள் பெற்ற பத்திலொரு பங்கிலிருந்து கொடுக்கும் பங்கை இது குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: “கருவூலத்தின் அறைகள்” என்றும் மொழிபெயர்க்கலாம். இங்கே பணம் வைக்கும் கருவூலத்தை மட்டும் குறிக்காமல், பத்திலொரு பங்குகளையும் காணிக்கைகளையும் சேமித்து வைக்கும் அறைகளைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: இருக்க வேண்டும்
  rationale: உடன்படிக்கை சார்ந்த விதிமுறையில் எதிர்காலத்தில் கடைப்பிடிக்க வேண்டிய நிலையைச் சுட்டுகிறது; தமிழில் ‘இருக்க வேண்டும்’ இயல்பாகவும் கட்டளைத் தொனியுடனும் உள்ளது.
- source_word: הַכֹּהֵן בֶּן־אַהֲרֹן
  choice: ஆரோனின் வழிவந்த ஓர் ஆசாரியர்
  rationale: இது ஆரோனிய ஆசாரிய வம்சத்தைச் சேர்ந்த ஒருவரைக் குறிக்கிறது. ‘ஆரோனின் மகன்’ என்பது நவீன தமிழில் நேரடி மகன் என்ற தவறான எண்ணத்தைத் தரக்கூடும் என்பதால் வம்சத் தொடர்பு தெளிவாக்கப்பட்டது.
- source_word: בַּעְשֵׂר הַלְוִיִּם
  choice: லேவியர்கள் பத்திலொரு பங்கைச் சேகரிக்கும்போது
  rationale: עשר என்பதன் infinitive construct வடிவம் இங்கே பத்திலொரு பங்கைப் பெறும் அல்லது சேகரிக்கும் செயலைக் குறிக்கிறது; காலவாக்கியமாக மொழிபெயர்ப்பது இயல்பான தமிழ்.
- source_word: יַעֲלוּ
  choice: மேலே கொண்டுசெல்ல வேண்டும்
  rationale: Hiphil வடிவம் ‘மேலே கொண்டுவருதல்/கொண்டுசெல்லுதல்’ என்ற இயக்க நுணுக்கத்தைக் கொண்டுள்ளது; ஆலயத்தை நோக்கிய உயர்வையும் பாதுகாக்க ‘மேலே’ தக்கவைக்கப்பட்டது.
- source_word: מַעֲשַׂר הַמַּעֲשֵׂר
  choice: அந்தப் பத்திலொரு பங்கிலிருந்து பத்திலொரு பங்கு
  rationale: எபிரெயத்தின் தொழில்நுட்பச் சொற்றொடர், லேவியர்கள் தாங்கள் பெற்ற பங்கிலிருந்து கொடுக்கும் பத்திலொரு பங்கைக் குறிக்கிறது. தமிழில் பொருள் தெளிவாக இருக்க ‘இலிருந்து’ பயன்படுத்தப்பட்டது; சொல்லடித் தோற்றம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டது.
- source_word: לְבֵית אֱלֹהֵינוּ
  choice: நம் கடவுளின் ஆலயத்தில்
  rationale: ‘நம் கடவுளின் வீடு’ என்ற சொல்லடிப் பொருள் இங்கே ஆலயத்தைக் குறிக்கிறது; சாதாரண நவீன வாசகருக்கு இடத்தைத் தெளிவுபடுத்த ‘ஆலயம்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: הַלְּשָׁכוֹת לְבֵית הָאוֹצָר
  choice: களஞ்சிய அறைகள்
  rationale: பத்திலொரு பங்குகளையும் காணிக்கைகளையும் சேமிக்கும் ஆலய அறைகள் குறிக்கப்படுகின்றன. ‘கருவூலம்’ பணத்தை மட்டும் உணர்த்தக்கூடும்; ‘களஞ்சிய அறைகள்’ வேளாண் விளைபொருட்கள் உள்ளிட்ட சேமிப்பை நன்றாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: ஆலயச் சேமிப்பிடத்திற்கான வழிபாட்டு நிர்வாகச் சொல்
  choice: களஞ்சிய அறைகள்
  alternative: கருவூல அறைகள்
  rationale: சூழல் வேளாண் விளைபொருட்களாக வந்த பத்திலொரு பங்குகளின் சேமிப்பைப் பற்றியது. ஆகவே பணக் கருவூலம் என்ற பிற்கால அல்லது குறுகிய கருத்தைத் தவிர்த்து, பொருட்கள் சேமிக்கப்படும் இடம் என்ற பரந்த பொருள் தக்கவைக்கப்பட்டது.
- issue: ஆரோனுடனான ஆசாரியரின் உறவு
  choice: ஆரோனின் வழிவந்த ஓர் ஆசாரியர்
  alternative: ஆரோனின் மகனான ஆசாரியர்
  rationale: בֶּן־אַהֲרֹן என்பது இங்கே ஆரோனிய ஆசாரிய வம்ச உறுப்பினரை அடையாளப்படுத்துகிறது; உயிரியல் ரீதியான நேரடி மகன் என்ற கருத்தைத் திணிக்காமல் வம்சத் தொடர்பை வெளிப்படுத்துகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், மரியாதையும் சட்ட/உடன்படிக்கைத் தொனியும் தக்கவைக்கப்பட்டுள்ளன. திருச்சபை வழக்கில் மட்டும் பரிச்சயமான ‘தசமபாகம்’ என்பதற்குப் பதிலாக பொதுவாசகருக்குப் புரியும் ‘பத்திலொரு பங்கு’ பயன்படுத்தப்பட்டது. ‘ஆசாரியர்’, ‘லேவியர்கள்’, ‘ஆலயம்’ ஆகியவை வேதாகமச் சூழலுக்கு ஏற்ற, பரவலாகப் புரியக்கூடிய சொற்களாக வைக்கப்பட்டுள்ளன.
