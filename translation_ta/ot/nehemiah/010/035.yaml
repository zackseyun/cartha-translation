base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/010/035.yaml
  text: We cast lots concerning the wood offering—the priests[a], the Levites, and the people—to bring it to the house of our God, according to our fathers’ houses, at appointed times year by year, to burn on the altar of Yahweh our God, as it is written in the Law.
translation:
  language: ta
  text: மரக் காணிக்கையைக் குறித்து[a], ஆசாரியர்களும் லேவியர்களும் மக்களுமாகிய நாங்கள், எங்கள் தந்தைவழிக் குடும்பங்களின்படி, ஆண்டுதோறும் குறிக்கப்பட்ட காலங்களில் மரத்தை எங்கள் கடவுளின் இல்லத்திற்குக் கொண்டுவந்து, எங்கள் கடவுளாகிய யாவேயின் பலிபீடத்தின்மேல் எரிப்பதற்காகச் சீட்டுப் போட்டோம்; சட்டத்தில் எழுதப்பட்டுள்ளபடி.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மரக் காணிக்கைக்காக.” இங்குள்ள எபிரெய முன்னிடைச்சொல் இருவிதமாகவும் மொழிபெயர்க்கப்படலாம்; மரம் வழங்கும் பொறுப்பை ஒதுக்குவதற்காகச் சீட்டுப் போட்டனர் என்பதே பொருள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַגּוֹרָלוֹת הִפַּלְנוּ
  choice: நாங்கள் சீட்டுப் போட்டோம்
  rationale: הפיל גורלות என்பது பொறுப்பைத் தீர்மானிக்கச் சீட்டுப் போடுவதைக் குறிக்கும் வழக்குச் சொற்றொடர். நவீன தமிழில் இயல்பாகவும் தெளிவாகவும் இருப்பதால் இவ்வாறு மொழிபெயர்க்கப்பட்டது.
- source_word: עַל קֻרְבַּן הָעֵצִים
  choice: மரக்காணிக்கையைக் குறித்து
  rationale: עַל இங்கு சீட்டுப்போட்டுத் தீர்மானிக்கப்பட்ட விஷயத்தை அறிமுகப்படுத்துகிறது. קֻרְבַּן הָעֵצִים பலிபீடப் பயன்பாட்டிற்காக வழங்கப்பட்ட மரத்தைக் குறிக்கிறது.
- source_word: הַכֹּהֲנִים הַלְוִיִּם וְהָעָם
  choice: ஆசாரியர்களும் லேவியர்களும் மக்களும்
  rationale: சீட்டுப்போட்ட மூன்று குழுக்களையும் எபிரெய உரையைப் போலத் தனித்தனியாகக் குறிப்பிடுகிறது.
- source_word: לְהָבִיא לְבֵית אֱלֹהֵינוּ
  choice: அந்த மரத்தை எங்கள் கடவுளின் இல்லத்திற்குக் கொண்டுவந்து
  rationale: தமிழில் குறிப்பு தெளிவாக இருக்க, மறைமுகமாக உள்ள பொருள் ‘அந்த மரம்’ என்று வெளிப்படுத்தப்பட்டது. ‘கடவுளின் இல்லம்’ என்பது எபிரெய உருவகத்தைப் பாதுகாக்கிறது.
- source_word: לְבֵית אֲבֹתֵינוּ
  choice: எங்கள் தந்தைவழிக் குடும்பங்களின்படி
  rationale: בֵּית אָבוֹת என்பது தனித்தனி வீடுகளை அல்ல, மூதாதையர் வழியில் அமைந்த குல அல்லது குடும்பப் பிரிவுகளைக் குறிக்கிறது.
- source_word: לְעִתִּים מְזֻמָּנִים שָׁנָה בְשָׁנָה
  choice: ஆண்டுதோறும் குறிக்கப்பட்ட காலங்களில்
  rationale: நிர்ணயிக்கப்பட்ட சந்தர்ப்பங்களையும் ஒவ்வோர் ஆண்டும் நிகழும் தொடர்ச்சியையும் இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: לְבַעֵר עַל מִזְבַּח
  choice: பலிபீடத்தின்மேல் எரிப்பதற்காக
  rationale: பலிபீடத்தில் மரத்தை எரிப்பதே சூழலில் நோக்கம். ‘தொடர்ந்து எரியச் செய்வது’ என்ற சாத்தியமான விரிவாக்கத்தை உரைக்குள் சேர்க்கவில்லை.
- source_word: יְהוָה
  choice: யாவே
  rationale: இது பட்டப்பெயர் அல்ல, எபிரெய தெய்வீகப் பெயரின் ஒலிபெயர்ப்பு. தமிழில் பரவலாக அறியப்படும் ‘யாவே’ வடிவம் பயன்படுத்தப்பட்டது.
- source_word: כַּכָּתוּב בַּתּוֹרָה
  choice: இது திருச்சட்டத்தில் எழுதப்பட்டிருக்கிறது
  rationale: தோரா எனப்படும் அங்கீகரிக்கப்பட்ட இறைச் சட்டத் தொகுப்பைச் சுட்டும் சூத்திரத்தைத் தெளிவாகத் தருகிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூல உரை பொதுவான பட்டப்பெயரை அல்ல, நான்கு எபிரெய மெய்யெழுத்துகளால் குறிக்கப்படும் தனிப்பெயரைப் பயன்படுத்துகிறது; ஆகவே அதனைப் பட்டப்பெயரால் மாற்றாமல் ஒலிபெயர்க்கப்பட்டது.
- issue: பலிபீடத்தில் மரத்தை எரிப்பதன் காலநிலைப் பொருள்
  choice: எரிப்பதற்காக
  alternative: தொடர்ந்து எரியச் செய்வதற்காக
  rationale: בער என்ற வினை இச்சூழலில் எரித்தலைக் குறிக்கிறது. பலிபீட நெருப்பைத் தொடர்ந்து எரியவைத்தல் சூழலுக்கு ஏற்ற சாத்தியம் என்றாலும், உடனடி சொற்றொடர் அதை கட்டாயப்படுத்தாததால் விரிவான வாசிப்பு உரையில் சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் மரியாதையான நடையில் மொழிபெயர்க்கப்பட்டது. நீண்ட எபிரெய வாக்கியம் தமிழில் இரண்டு வாக்கியங்களாக அமைக்கப்பட்டாலும் அதன் தர்க்கத் தொடர்பு பாதுகாக்கப்பட்டுள்ளது. ‘தந்தைவழிக் குடும்பங்கள்’, ‘குறிக்கப்பட்ட காலங்கள்’, ‘கடவுளின் இல்லம்’ ஆகியவை நிர்வாக மற்றும் வழிபாட்டு சூழலைத் தெளிவாக வைத்திருக்கின்றன.
