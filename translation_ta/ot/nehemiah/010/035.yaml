revisions:
- from: மரக்காணிக்கையைக் குறித்து[a] நாங்கள்—ஆசாரியர்களும் லேவியர்களும் மக்களும்—சீட்டுப் போட்டோம். எங்கள் தந்தைவழிக் குடும்பங்களின்படி, ஆண்டுதோறும் குறிக்கப்பட்ட காலங்களில் அந்த மரத்தை எங்கள் கடவுளின் இல்லத்திற்குக் கொண்டுவந்து, எங்கள் கடவுளாகிய யாவேயின் பலிபீடத்தின்மேல் எரிப்பதற்காக இப்படிச் செய்தோம்; இது திருச்சட்டத்தில் எழுதப்பட்டிருக்கிறது.
  to: மரக் காணிக்கையைக் குறித்து[a], ஆசாரியர்களும் லேவியர்களும் மக்களுமாகிய நாங்கள், எங்கள் தந்தைவழிக் குடும்பங்களின்படி, ஆண்டுதோறும் குறிக்கப்பட்ட காலங்களில் மரத்தை எங்கள் கடவுளின் இல்லத்திற்குக் கொண்டுவந்து, எங்கள் கடவுளாகிய யாவேயின் பலிபீடத்தின்மேல் எரிப்பதற்காகச் சீட்டுப் போட்டோம்; சட்டத்தில் எழுதப்பட்டுள்ளபடி.
  rationale: 'The revision preserves the Hebrew’s single-purpose construction: the priests, Levites, and people cast lots concerning the wood offering so that, by ancestral-family divisions, they would bring wood at designated yearly times for burning on Yahweh’s altar. It removes an unintended implication of completed action and attaches the Torah formula to the prescribed practice.'
