source:
  edition: WLC
  text: וּ/לְ/הָבִ֞יא אֶת בִּכּוּרֵ֣י אַדְמָתֵ֗/נוּ וּ/בִכּוּרֵ֛י כָּל פְּרִ֥י כָל עֵ֖ץ שָׁנָ֣ה בְ/שָׁנָ֑ה לְ/בֵ֖ית יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/010/036.yaml
  text: and to bring the firstfruits of our land and the firstfruits of all the fruit of every tree[a], year by year, to the house of Yahweh[b],
translation:
  language: ta
  text: மேலும், எங்கள் நிலத்தின்[a] முதற்கனிகளையும், ஒவ்வொரு மரத்தின் எல்லாக் கனிகளின் முதற்கனிகளையும் ஆண்டுதோறும் யாவேயின் இல்லத்திற்குக்[b] கொண்டுவரவும்,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘நிலம்’ என்பதற்கு ‘மண்’ அல்லது ‘பயிர்நிலம்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அதாவது, யாவேயின் ஆலயத்திற்கு. எபிரெயத்தில் நேரடியாக ‘யாவேயின் இல்லத்திற்கு’ என்று உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/לְ/הָבִיא
  choice: மேலும் ... கொண்டுவரவும்
  rationale: இணைப்புச் சொல்லும் வினையெச்ச வடிவமும் முந்தைய வசனங்களில் தொடரும் உடன்படிக்கைக் கடமைகளைச் சுட்டுகின்றன; காணிக்கைகளை ஆலயத்திற்குக் கொண்டுவரும் சூழலில் ‘கொண்டுவரவும்’ இயல்பானது.
- source_word: בִּכּוּרֵי
  choice: முதற்கனிகள்
  rationale: கடவுளுக்குச் செலுத்தப்படும் முதல் விளைச்சலைக் குறிக்கும் வழிபாட்டுச் சொல்லின் பொருளைத் துல்லியமாகப் பாதுகாக்கிறது.
- source_word: אַדְמָתֵנוּ
  choice: எங்கள் நிலம்
  rationale: விவசாய விளைச்சலைத் தரும் மண் அல்லது பயிர்நிலம் என்பதே இங்குள்ள பொருள்; நவீன தமிழில் ‘எங்கள் நிலம்’ இயல்பாகவும் விரிவான மூலப்பொருளைத் தக்கவைத்தும் உள்ளது.
- source_word: וּ/בִכּוּרֵי כָּל פְּרִי כָל עֵץ
  choice: ஒவ்வொரு மரத்தின் எல்லாக் கனிகளின் முதற்கனிகள்
  rationale: ‘ஒவ்வொரு மரம்’, ‘எல்லாக் கனி’ என்ற எபிரெயச் சொல்லடுக்கின் முழுமையுணர்வைப் பாதுகாத்து, தமிழில் புரியத்தக்கவாறு அமைக்கப்பட்டுள்ளது.
- source_word: שָׁנָה בְ/שָׁנָה
  choice: ஆண்டுதோறும்
  rationale: ஒவ்வோர் ஆண்டும் தவறாமல் நிகழும் தொடர்ச்சியான கடமையை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: לְ/בֵית יְהוָה
  choice: யாவேயின் இல்லத்திற்கு
  rationale: בֵּית என்பதன் ‘இல்லம்’ என்ற உருவகத்தையும் יהוה என்ற தனிப்பெயரையும் நேரடியாகப் பாதுகாக்கிறது; சூழலில் இது ஆலயத்தைக் குறிக்கிறது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூலத்தில் பொதுப் பட்டப்பெயர் அல்லாமல் நான்கெழுத்து இறைப் பெயர் நேரடியாக உள்ளது; ‘யாவே’ என்பது அந்த உடன்படிக்கைப் பெயரைத் தமிழில் ஒலிபெயர்க்கிறது.
- issue: בֵּית יְהוָה என்பதைக் ‘இல்லம்’ அல்லது ‘ஆலயம்’ என வழங்குதல்
  choice: யாவேயின் இல்லம்
  alternative: யாவேயின் ஆலயம்
  rationale: ‘இல்லம்’ மூலத்தின் உருவகத்தைத் தக்கவைக்கிறது; வரலாற்றுச் சூழலில் அது ஆலயமே என்பதை அடிக்குறிப்பு தெளிவுபடுத்துகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், உடன்படிக்கைப் பொறுப்புகளின் பட்டியல் தொடர்வதை உணர்த்தும் வாக்கியத் துணுக்காக மொழிபெயர்க்கப்பட்டுள்ளது. ‘முதற்கனிகள்’ என்ற வழிபாட்டுச் சொல் தக்கவைக்கப்பட்டு, எபிரெயச் சொல்லடுக்கின் முழுமையுணர்வு இயன்றவரை இயல்பான தமிழில் பிரதிபலிக்கப்பட்டுள்ளது.
