  source_fidelity: மொழிபெயர்ப்பு எபிரெய மூலத்தின் பட்டியலையும், மாவின் முதல் பங்கு, பிரித்தளிக்கப்படும் காணிக்கைகள், மரப்பழம், புதிய திராட்சரசம், எண்ணெய், நில விளைச்சலின் பத்திலொரு பங்கு ஆகிய வேறுபாடுகளையும் நன்றாகப் பிரதிபலிக்கிறது. ஆயினும் ‘ஆசாரியர்களிடம்—...அறைகளுக்கு’ என்ற இடைச்செருகல் கட்டமைப்பு தமிழில் தடுமாற்றமாக உள்ளது; மூலத்தில் ஆசாரியர்களும் ஆலய அறைகளும் அடுத்தடுத்த இலக்குகளாக வருவதைத் தெளிவாகவும் இயல்பாகவும் காட்ட வேண்டும்.
  naturalness: பெரும்பாலான நடை நவீனத் தரத் தமிழுக்கு ஏற்றது. ‘ஆலயத்தின் அறைகள்’ என்பது ‘ஆலய அறைகள்’ என்பதைவிட இயல்பாகவும் உறவுத்தொடரைத் தெளிவாகவும் தருகிறது. இலக்குகளை ஒரே தொடரில் இணைப்பதால் வாசிப்பு சீராகும்.
  terminology: ‘காணிக்கைகள்’, ‘புதிய திராட்சரசம்’, ‘எண்ணெய்’, ‘லேவியர்கள்’, ‘பத்தில் ஒரு பங்கு’ ஆகியவை பொருத்தமானவை. ‘ஆசாரியர்கள்’ மற்றும் ‘லேவியர்கள்’ ஆகியோருக்கிடையிலான மூலத்தின் வேறுபாடு பாதுகாக்கப்பட்டுள்ளது. அடிக்குறிப்புகள் உரிய இடங்களில் இணைக்கப்பட்டுள்ளன.
