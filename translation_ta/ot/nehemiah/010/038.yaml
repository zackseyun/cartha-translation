  revised_text: எங்கள் பிசைந்த மாவின் முதல் பங்கையும்[a], எங்கள் காணிக்கைகளையும், எல்லா மரங்களின் பழங்களையும், புதிய திராட்சரசத்தையும், எண்ணெயையும் ஆசாரியர்களிடமும் எங்கள் கடவுளின் ஆலயத்தின் அறைகளுக்கும்[b] கொண்டுவருவோம். எங்கள் நிலத்திலிருந்து கிடைக்கும் பத்தில் ஒரு பங்கை லேவியர்களிடம் கொண்டுவருவோம்; ஏனெனில் நாங்கள் உழைக்கும் எல்லா நகரங்களிலும்[c] பத்தில் ஒரு பங்கை வசூலிப்பவர்கள் லேவியர்களே.
