  text: וְ/אֶת רֵאשִׁ֣ית עֲרִיסֹתֵ֣י/נוּ וּ֠/תְרוּמֹתֵי/נוּ וּ/פְרִ֨י כָל עֵ֜ץ תִּיר֣וֹשׁ וְ/יִצְהָ֗ר נָבִ֤יא לַ/כֹּהֲנִים֙ אֶל לִשְׁכ֣וֹת בֵּית אֱלֹהֵ֔י/נוּ וּ/מַעְשַׂ֥ר אַדְמָתֵ֖/נוּ לַ/לְוִיִּ֑ם וְ/הֵם֙ הַ/לְוִיִּ֔ם הַֽ/מְעַשְּׂרִ֔ים בְּ/כֹ֖ל עָרֵ֥י עֲבֹדָתֵֽ/נוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/010/038.yaml
  text: And we will bring the first of our dough[a], our contributions, the fruit of every tree, the new wine, and the oil to the priests, to the chambers of the house of our God, and the tithe of our land to the Levites; for they, the Levites[c][b], are the ones who collect the tithes in all the cities where we labor.
translation:
  language: ta
  text: எங்கள் பிசைந்த மாவின் முதல் பங்கையும்[a], எங்கள் காணிக்கைகளையும், எல்லா மரங்களின் பழங்களையும், புதிய திராட்சரசத்தையும், எண்ணெயையும் ஆசாரியர்களிடமும் எங்கள் கடவுளின் ஆலயத்தின் அறைகளுக்கும்[b] கொண்டுவருவோம். எங்கள் நிலத்திலிருந்து கிடைக்கும் பத்தில் ஒரு பங்கை லேவியர்களிடம் கொண்டுவருவோம்; ஏனெனில் நாங்கள் உழைக்கும் எல்லா நகரங்களிலும்[c] பத்தில் ஒரு பங்கை வசூலிப்பவர்கள் லேவியர்களே.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘பிசைந்த மாவு’ என்பதை ‘பிசைந்த மாவுத்தொகுதி’ என்றும் மொழிபெயர்க்கலாம்; இது மாவிலிருந்து முதலில் பிரித்தெடுக்கப்படும் பங்கைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: ‘அறைகள்’ என்பதை ‘சேமிப்பு அறைகள்’ என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் ஆலய வளாகத்திலுள்ள, பெரும்பாலும் பொருட்களைச் சேமிக்கப் பயன்படுத்தப்பட்ட அறைகளைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: c
    text: சொல்லுக்கு நெருக்கமாக, ‘எங்கள் பணியின் எல்லா நகரங்களிலும்.’ எபிரெயத் தொடர் சுருக்கமாக உள்ளது; மக்களின் உழைப்பு அல்லது பயிர்த்தொழிலுடன் தொடர்புடைய நகரங்களை இது குறிக்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: רֵאשִׁית עֲרִיסֹתֵינוּ
  choice: எங்கள் பிசைந்த மாவின் முதல் பங்கு
  rationale: רֵאשִׁית என்பது முதலில் பிரித்தெடுக்கப்படும் பங்கையும், עֲרִיסָה என்பது பிசைந்த மாவையும் குறிக்கிறது. இத்தொடர் காணிக்கையின் உறுதியான வேளாண்மை மற்றும் உணவுத் தயாரிப்புச் சூழலைத் தக்கவைக்கிறது.
- source_word: תְּרוּמֹתֵינוּ
  choice: எங்கள் காணிக்கைகள்
  rationale: תְּרוּמָה என்பது கடவுளுக்கென்று பிரித்தளிக்கப்படும் பங்களிப்பு அல்லது காணிக்கை. நவீன தமிழில் இயல்பாகவும் சமயச் சூழலுக்கு ஏற்றவாறும் இருப்பதால் ‘காணிக்கைகள்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: פְּרִי כָל עֵץ
  choice: எல்லா மரங்களின் பழங்கள்
  rationale: כָל என்பதன் முழுமை அல்லது பகிர்வு சார்ந்த பொருளையும், עֵץ என்பதன் மரம் என்ற நேரடிப் பொருளையும் இயல்பான தமிழில் தருகிறது.
- source_word: תִּירוֹשׁ
  choice: புதிய திராட்சரசம்
  rationale: תִּירוֹשׁ பொதுவாகப் புதிதாக உற்பத்தி செய்யப்பட்ட திராட்சரசத்தைக் குறிக்கிறது; வெறும் ‘திராட்சரசம்’ என்பதைவிட வேளாண்மைச் சிறப்பை இது தெளிவாகத் தக்கவைக்கிறது.
- source_word: יִצְהָר
  choice: எண்ணெய்
  rationale: வேளாண்மைப் பட்டியல்களில் இச்சொல் பொதுவாக, குறிப்பாக ஒலிவ எண்ணெயைக் குறிக்கும். எபிரெயச் சொல் மரவகையை வெளிப்படையாகக் குறிப்பிடாததால் பொதுவான ‘எண்ணெய்’ பயன்படுத்தப்பட்டது.
- source_word: נָבִיא
  choice: கொண்டுவருவோம்
  rationale: בוא வினையின் ஹிஃபீல், தன்மை பன்மை வடிவம் இங்கு சமூகத்தின் உடன்படிக்கை உறுதிமொழியை வெளிப்படுத்துகிறது.
- source_word: לִשְׁכוֹת
  choice: ஆலய அறைகள்
  rationale: לִשְׁכּוֹת என்பது ஆலய வளாகத்திலுள்ள அறைகளைக் குறிக்கிறது. அவை சேமிப்புக்கும் பயன்பட்டாலும், மூலச்சொல் செயல்பாட்டைக் காட்டிலும் கட்டட இடத்தையே முதன்மையாகக் குறிக்கிறது.
- source_word: מַעְשַׂר אַדְמָתֵנוּ
  choice: எங்கள் நிலத்திலிருந்து கிடைக்கும் பத்தில் ஒரு பங்கு
  rationale: மூலத்தின் சுருக்கமான உருபுத் தொடர்பு, நிலத்தின் விளைச்சலிலிருந்து செலுத்தப்படும் பத்திலொரு பங்கைக் குறிக்கிறது. தமிழில் தவறாக நிலப்பரப்பின் பத்தில் ஒன்று எனப் புரியாமல் இருக்க பொருள் இயல்பாக வெளிப்படுத்தப்பட்டது.
- source_word: הַמְעַשְּׂרִים
  choice: பத்தில் ஒரு பங்கை வசூலிப்பவர்கள்
  rationale: עשר வினையின் இப்பெயரெச்ச வடிவம் இச்சூழலில் பத்திலொரு பங்கைப் பெறுதல் அல்லது வசூலித்தலைக் குறிக்கிறது; லேவியர்களின் நிர்வாகப் பணியை ‘வசூலிப்பவர்கள்’ தெளிவாகத் தருகிறது.
- source_word: בְּכָל עָרֵי עֲבֹדָתֵנוּ
  choice: நாங்கள் உழைக்கும் எல்லா நகரங்களிலும்
  rationale: עֲבֹדָה என்பதற்கு வேலை, உழைப்பு, பணி என்ற பொருட்கள் உண்டு. நிலமும் பத்திலொரு பங்கும் பேசப்படும் இச்சூழலில் ‘உழைக்கும்’ என்பது வேளாண்மை சார்ந்த பொருளை இயல்பாகத் தருகிறது; எனினும் மூலத்தொடர் சுருக்கமானதும் ஓரளவு பல்பொருள் கொண்டதுமாகும்.
theological_decisions:
- issue: பத்திலொரு பங்கின் பெறுநரும் வசூலிப்பவரும்
  choice: பத்திலொரு பங்கு லேவியர்களிடம் கொண்டுவரப்படுகிறது; அதை வசூலிப்பவர்கள் லேவியர்களே என்று உரை கூறுகிறது.
  alternative: ஆசாரியர்களே அனைத்து காணிக்கைகளையும் பத்திலொரு பங்கையும் நேரடியாகப் பெறுகின்றனர் என ஒருங்கிணைத்தல்.
  rationale: எபிரெய உரை ஆசாரியர்களிடம் கொண்டுவரப்படும் முதல் பங்குகள் மற்றும் காணிக்கைகளையும், லேவியர்களிடம் கொண்டுவரப்படும் நிலத்தின் பத்திலொரு பங்கையும் இலக்கண ரீதியாக வேறுபடுத்துகிறது. இந்த வேறுபாடு எந்தப் பிற்கால சமய அமைப்புக்கும் ஏற்ப மாற்றப்படவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. பட்டியலின் உடன்படிக்கை உறுதிமொழித் தொனியைத் தக்கவைக்க ‘கொண்டுவருவோம்’ பயன்படுத்தப்பட்டது. ‘ஆலய அறைகள்’ என்ற கட்டடச் சொல்லும் ‘பத்தில் ஒரு பங்கு’ என்ற வெளிப்படையான அளவுச் சொல்லும் தொழில்நுட்ப சமயச் சொற்களை மிகைப்படுத்தாமல் மூலத்தின் பொருளைத் தருகின்றன.
