  register: நவீன தரமான தமிழில், பெயர்ப்பட்டியலுக்கேற்ற சுருக்கமான மற்றும் கண்ணியமான நடை. எபிரெய வாக்கியத்தின் அடையாளப்படுத்தும் அமைப்பு ‘இவர்களே ஆசாரியர்கள்’ எனக் காக்கப்பட்டுள்ளது.
