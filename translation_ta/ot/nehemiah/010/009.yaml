  text: மாவசியா, பில்காய், செமாயா—இவர்களே ஆசாரியர்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מַֽעַזְיָה
  choice: மாசியா
  rationale: எபிரெயத் தனிப்பட்ட பெயரை அதன் ஒலிக்கு நெருக்கமாகத் தமிழில் எழுத்துப்பெயர்த்துள்ளது.
- source_word: בִלְגַּי
  choice: பில்காய்
  rationale: பெயரின் இறுதி ஒலியையும் காத்து, எபிரெயத் தனிப்பட்ட பெயரைத் தமிழில் எழுத்துப்பெயர்த்துள்ளது.
- source_word: שְׁמַֽעְיָה
  choice: செமாயா
  rationale: எபிரெயத் தனிப்பட்ட பெயரை இயல்பாக வாசிக்கத்தக்க தமிழ் வடிவில் எழுத்துப்பெயர்த்துள்ளது.
- source_word: אֵ֖לֶּה
  choice: இவர்களே
  rationale: மனிதர்களைக் குறிக்கும் பன்மைச் சுட்டுப்பெயராகவும், பட்டியலின் அடையாளப்படுத்தும் வலியுறுத்தலை இயல்பாக வெளிப்படுத்தவும் இவ்வடிவம் பயன்படுத்தப்பட்டுள்ளது.
- source_word: הַכֹּהֲנִים
  choice: ஆசாரியர்கள்
  rationale: குறிப்பிட்ட பட்டியலிலுள்ளவர்களை ஆசாரியக் குழுவினராக அடையாளப்படுத்துகிறது; தமிழில் பன்மை மரியாதை/மனிதர் விகுதியுடன் இயல்பாக வழங்கப்பட்டுள்ளது.
