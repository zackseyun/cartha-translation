translation_notes:
  register: நவீன நிலையான தமிழில், பட்டியல் நடையைச் சுருக்கமாகவும் மரியாதைமிக்கதாகவும் வைத்துள்ளது. தனிப்பெயர்கள் எபிரெய ஒலிப்புக்கு ஏற்ப தமிழாக்கப்பட்டுள்ளன. ஆங்கில ஆலோசனை உரையின் அடிக்குறிப்புகள் மூல எபிரெய உரையின் அமைப்புடன் பொருந்தாததால் அவை சேர்க்கப்படவில்லை; குறிப்பாக מִבְּנֵי חֵנָדָד என்பது அசனியாவை அல்ல, பின்னூயியைத் தெளிவாக விளக்குகிறது.
