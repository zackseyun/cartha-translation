language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וְֽ/הַ/לְוִיִּ֑ם וְ/יֵשׁ֨וּעַ֙ בֶּן אֲזַנְיָ֔ה בִּנּ֕וּי מִ/בְּנֵ֥י חֵנָדָ֖ד קַדְמִיאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/010/010.yaml
  text: 'and the Levites: Jeshua son of Azaniah[a], Binnui from the sons of Henadad[b], Kadmiel.'
translation:
  language: ta
  text: 'மேலும் லேவியர்கள்: அசனியாவின் மகன் யேசுவா, ஹெனாதாதின் வம்சத்தாரான பின்னூயி, கத்மியேல்.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהַלְוִיִּם
  choice: மேலும் லேவியர்கள்
  rationale: וְ இவ்வசனத்தை முந்தைய கையொப்பமிட்டோர் பட்டியலுடன் இணைக்கிறது; הַלְוִיִּם என்பது குறிப்பிட்ட பன்மையாக ‘லேவியர்கள்’ என்று மொழிபெயர்க்கப்பட்டது. எபிரெயத்தில் வினைச்சொல் இல்லாததால் தமிழிலும் தேவையற்ற வினைச்சொல் சேர்க்கப்படவில்லை.
- source_word: וְיֵשׁוּעַ
  choice: யேசுவா
  rationale: எபிரெயத் தனிப்பெயர் தமிழ் ஒலிப்பெயர்ப்பாக வழங்கப்பட்டது. தொடக்கத்திலுள்ள ‘மேலும் லேவியர்கள்’ பட்டியலை இயல்பாக அறிமுகப்படுத்துவதால், பெயருக்கு முன் உள்ள וְ தனியே மீண்டும் மொழிபெயர்க்கப்படவில்லை.
- source_word: בֶּן אֲזַנְיָה
  choice: அசனியாவின் மகன்
  rationale: வம்ச உறவைக் குறிக்கும் எபிரெய இணைப்பு இயல்பான தமிழ் உடைமைத் தொடராக மொழிபெயர்க்கப்பட்டது.
- source_word: בִּנּוּי
  choice: பின்னூயி
  rationale: எபிரெயத் தனிப்பெயரின் ஒலியமைப்பை நெருக்கமாகப் பின்பற்றும் தமிழ் ஒலிப்பெயர்ப்பு.
- source_word: מִבְּנֵי חֵנָדָד
  choice: ஏனாதாதின் மக்களில் ஒருவனான
  rationale: מִן ‘இலிருந்து/மத்தியில்’ என்ற பொருளையும், בְּנֵי இங்கு குலத்தார் அல்லது வழித்தோன்றல்களையும் குறிக்கிறது. ‘மக்களில் ஒருவனான’ என்பது பின்னூயி அந்தக் குலத்தைச் சேர்ந்தவர் என்பதை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: קַדְמִיאֵל
  choice: கத்மியேல்
  rationale: எபிரெயத் தனிப்பெயரின் மெய்யொலி அமைப்பை நெருக்கமாகக் காக்கும் தமிழ் ஒலிப்பெயர்ப்பு.
