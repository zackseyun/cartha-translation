source:
  edition: WLC
  text: וְ/הֶעֱמַ֤דְנוּ עָלֵ֨י/נוּ֙ מִצְוֺ֔ת לָ/תֵ֥ת עָלֵ֛י/נוּ שְׁלִשִׁ֥ית הַ/שֶּׁ֖קֶל בַּ/שָּׁנָ֑ה לַ/עֲבֹדַ֖ת בֵּ֥ית אֱלֹהֵֽי/נוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/010/033.yaml
  text: We also laid on ourselves the obligation to give yearly a third of a shekel for the service of the house of our God[a].
translation:
  language: ta
  text: நமது கடவுளின் ஆலயப் பணிக்காக ஆண்டுதோறும் ஒரு சேக்கலில் மூன்றில் ஒரு பங்கைக் கொடுக்க வேண்டும் என்ற கட்டளையை நாங்களே எங்கள்மேல் விதித்துக்கொண்டோம்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஒவ்வோர் ஆண்டும் ஒரு சேக்கலில் மூன்றில் ஒரு பங்கைக் கொடுப்பதற்கான கடமைகளை நாங்களே ஏற்றுக்கொண்டோம்.”
    reason: מִצְוֺת என்பதைக் கூட்டுப்பொருள் கொண்ட ஒருமையாகவோ, பன்மையான 'கடமைகள்' என்றோ புரிந்துகொள்ள முடியும்; וְהֶעֱמַדְנוּ என்பதும் 'விதித்துக்கொண்டோம்' அல்லது 'ஏற்றுக்கொண்டோம்' என மொழிபெயர்க்கப்படலாம்.
lexical_decisions:
- source_word: וְהֶעֱמַדְנוּ
  choice: நாங்களே எங்கள்மேல் விதித்துக்கொண்டோம்
  rationale: עמד என்பதன் ஹிஃபில் வடிவம் இங்கு ஒரு கட்டுப்பாட்டைத் தங்கள்மேல் ஏற்படுத்திக்கொள்வதைக் குறிக்கிறது. தமிழ் இயல்புக்காகத் தன்னிலைப் பொருள் தெளிவாக வெளிப்படுத்தப்பட்டது.
- source_word: מִצְוֺת
  choice: கட்டளையை
  rationale: வடிவத்தில் பன்மையாக இருந்தாலும், இச்சூழலில் தொடர்ந்து வரும் கொடுக்கும் கடமையைச் சுட்டும் கூட்டுப்பொருள் அல்லது ஒருமைப் பொருளாக அமைகிறது. 'கட்டளை' அதன் கட்டுப்படுத்தும் வலிமையைப் பாதுகாக்கிறது.
- source_word: לָתֵת
  choice: கொடுக்க வேண்டும் என்ற
  rationale: נתן என்பதன் அடிப்படைப் பொருளான 'கொடு' பாதுகாக்கப்படுகிறது; கட்டளையோடு இயல்பாக இணைக்கத் தமிழில் 'வேண்டும் என்ற' சேர்க்கப்பட்டுள்ளது.
- source_word: שְׁלִשִׁית הַשֶּׁקֶל
  choice: ஒரு சேக்கலில் மூன்றில் ஒரு பங்கு
  rationale: எபிரேய அளவையும் நாணயப் பெயரையும் நேரடியாகவும் புரியத்தக்க வகையிலும் அளிக்கிறது.
- source_word: בַּשָּׁנָה
  choice: ஆண்டுதோறும்
  rationale: இச்சொற்றொடர் ஆண்டுதோறும் நிகழும் கொடையைச் சுட்டுகிறது.
- source_word: לַעֲבֹדַת
  choice: ஆலயப் பணிக்காக
  rationale: ஆலயச் சூழலில் עֲבֹדָה வழிபாட்டுச் சேவை மற்றும் அதனுடன் தொடர்புடைய பணிகளை உள்ளடக்குகிறது; 'பணி' தேவையற்ற தொழில்நுட்பத் தன்மையின்றி இதைத் தெரிவிக்கிறது.
- source_word: בֵּית אֱלֹהֵינוּ
  choice: நமது கடவுளின் ஆலயம்
  rationale: சொல்லுக்கு சொல் 'நமது கடவுளின் வீடு' என்றாலும், இச்சூழலில் நவீனத் தமிழில் 'ஆலயம்' தெளிவாகவும் இயல்பாகவும் உள்ளது.
theological_decisions:
- issue: מִצְוֺת என்பதன் கடப்பாட்டுத் தன்மை
  choice: தாங்களே தங்கள்மேல் விதித்துக்கொண்ட கட்டளை
  alternative: தாங்கள் ஏற்றுக்கொண்ட கடமை / பல கட்டளைகள்
  rationale: சமூகம் ஆண்டுதோறும் ஆலயத்திற்குக் கொடுக்க வேண்டிய ஒரு குறிப்பிட்ட கட்டுப்பாட்டைத் தங்கள்மேல் ஏற்படுத்திக்கொள்வதே இங்கு கூறப்படுகிறது. 'கட்டளை' அதன் கட்டாயத் தன்மையைத் தக்கவைக்கிறது; அடிக்குறிப்பு இலக்கண ரீதியான பன்மை வாய்ப்பைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான, கண்ணியமான தமிழ். 'சேக்கல்' வரலாற்று நாணய/எடை அலகாக ஒலிபெயர்க்கப்பட்டது. மூலத்தின் 'வீடு' என்ற உருவகத்தை விட இச்சூழலில் சாதாரண வாசகருக்குத் தெளிவான 'ஆலயம்' பயன்படுத்தப்பட்டது; சுயமாக ஏற்ற கட்டுப்பாடு வலியுறுத்தப்பட்டது.
