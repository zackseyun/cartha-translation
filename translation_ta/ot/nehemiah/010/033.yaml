  source_fidelity: 'மூல எபிரேயத்தின் முக்கிய கூறுகள் அனைத்தும் துல்லியமாக உள்ளன: சமூகத்தினர் தங்கள்மேல் கட்டுப்பாட்டை விதித்துக்கொண்டது, ஆண்டுதோறும் ஒரு சேக்கலில் மூன்றில் ஒரு பங்கை அளிப்பது, அது தங்கள் கடவுளின் ஆலயப் பணிக்கானது என்பன தெளிவாகக் காக்கப்பட்டுள்ளன. מִצְוֺת என்ற வடிவத்தின் கூட்டுப்பொருள்/பன்மைச் சாத்தியத்தை அடிக்குறிப்பு பொருத்தமாகக் குறிக்கிறது.'
