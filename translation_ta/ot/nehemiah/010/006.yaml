  rationale: உடன்படிக்கைப் பட்டியலில் வரும் தனிப்பெயர்; பொருளாக்காமல் எபிரெய உச்சரிப்புக்கு அணுக்கமாக ஒலிபெயர்க்கப்பட்டது. தொடக்க ח ஒலி தமிழில் துல்லியமாக இல்லாததால், இயல்பான தமிழாக்கமாக ‘ஆரீம்’ தேர்ந்தெடுக்கப்பட்டது.
