- source_word: עֹבַדְיָה
  choice: ஒபதியா
  rationale: இது இறைநாமக் கூறுடைய தனிப்பெயராக இருந்தாலும், அதன் பொருளை மொழிபெயர்க்காமல் எபிரெய வடிவத்திற்கு அணுக்கமாக ஒலிபெயர்க்கப்பட்டது.
