base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/004/012.yaml
  text: And the builders each had his sword strapped at his side while they built[a], and the one blowing the trumpet was beside me.
translation:
  language: ta
  text: கட்டுகிறவர்கள் ஒவ்வொருவரும் தன் வாளை இடுப்பில் கட்டியபடியே கட்டுமானப் பணியைச் செய்தார்கள்; எக்காளத்தை[a] ஊதுகிறவன் என்னருகில் இருந்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் ‘ஷோஃபார்’; பொதுவாக ஆட்டுக்கடாவின் கொம்பால் செய்யப்பட்ட ஊதுகருவி.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבּוֹנִים / וּבוֹנִים
  choice: கட்டுகிறவர்கள் / கட்டுமானப் பணியைச் செய்தார்கள்
  rationale: בנה என்ற ஒரே வேர்ச்சொல் முதலில் பெயர்ச்சொல் தன்மையிலும் பின்னர் செயல் தன்மையிலும் வருகிறது. தமிழில் இயல்பாகவும் தெளிவாகவும் இருக்க, முதலில் ‘கட்டுகிறவர்கள்’ என்றும் பின்னர் ‘கட்டுமானப் பணியைச் செய்தார்கள்’ என்றும் வழங்கப்பட்டுள்ளது.
- source_word: אִישׁ
  choice: ஒவ்வொருவரும்
  rationale: இங்கு אִישׁ குழுவிலுள்ள ஒவ்வொரு நபரையும் தனித்தனியாகக் குறிக்கும் பகிர்வுப் பொருளில் வருகிறது.
- source_word: חַרְבּוֹ
  choice: தன் வாளை
  rationale: ஒவ்வொரு கட்டுகிறவருக்கும் உரிய வாளைக் குறிக்கும் ஒருமை உடைமை வடிவம் தமிழில் ‘தன் வாளை’ என இயல்பாகத் தரப்பட்டுள்ளது.
- source_word: אֲסוּרִים עַל מָתְנָיו
  choice: இடுப்பில் கட்டியபடியே
  rationale: אסר என்பதன் செயல்பாட்டில் ‘கட்டப்பட்ட/உறுதியாகப் பொருத்தப்பட்ட’ என்ற பொருளும், מָתְנַיִם என்பதில் இடுப்பு அல்லது அரைப் பகுதியும் குறிக்கப்படுகின்றன. வேலை செய்யும்போதும் வாள் அணிந்திருந்த நிலையை இவ்வடிவம் தெளிவாகக் காட்டுகிறது.
- source_word: וְהַתּוֹקֵעַ בַּשּׁוֹפָר
  choice: எக்காளத்தை[a] ஊதுகிறவன்
  rationale: תקע என்ற பங்கேற்பு வடிவத்தின் தொடர்ச்சியான செயலை ‘ஊதுகிறவன்’ காக்கிறது. שׁוֹפָרின் குறிப்பிட்ட கருவி வகை அடிக்குறிப்பில் விளக்கப்பட்டு, பொதுவாசகருக்கு புரியும் ‘எக்காளம்’ முதன்மை உரையில் பயன்படுத்தப்பட்டுள்ளது.
- source_word: אֶצְלִי
  choice: என்னருகில்
  rationale: பேசுகிறவருக்கு மிக அருகிலான இருப்பிடத்தை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
