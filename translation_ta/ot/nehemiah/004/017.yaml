  text: And neither I[a], nor my brothers, nor my young men, nor the men of the guard who were behind me, took off our clothes; each kept his weapon in his right hand, even for water.
translation:
  language: ta
  text: நானும், என் சகோதரர்களும், என் இளைஞர்களும், எனக்குப் பின்னால் இருந்த காவலர்களும் எங்கள் உடைகளைக் கழற்றவே இல்லை; ஒவ்வொருவனும் தண்ணீருக்காகக்கூடத் தன் ஆயுதத்தைத் தன்னுடன் வைத்திருந்தான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இறுதித் தொடரின் எபிரெய உரை கடினமானது; சொல்லுக்கு சொல், “ஒவ்வொருவன்—அவனுடைய ஆயுதம்—தண்ணீர்” என்று உள்ளது. இது “ஒவ்வொருவனும் தண்ணீர் எடுக்கச் செல்லும்போதும் தன் ஆயுதத்தை உடன் எடுத்துச் சென்றான்” அல்லது “தண்ணீருக்காகக்கூட ஒவ்வொருவனும் தன் ஆயுதத்தைத் தயாராக வைத்திருந்தான்” என்று புரிந்துகொள்ளப்படலாம்.
    reason: lexical_alternative
