translation_notes:
  register: நவீன, கண்ணியமான, பொதுவாசகர்களுக்கு எளிதில் புரியும் தமிழ் பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் பட்டியல் அமைப்பும் தொடர்ச்சியான விழிப்புநிலையும் காக்கப்பட்டுள்ளன. தெளிவற்ற இறுதித் தொடர் வாசிக்கத்தக்க வகையில் முதன்மை உரையில் மொழிபெயர்க்கப்பட்டு, அதன் உண்மையான உரைச்சிக்கலும் மாற்றுப் புரிதல்களும் அடிக்குறிப்பில் தரப்பட்டுள்ளன.
