  choice: கழற்றவே இல்லை
  rationale: אֵין உடன் வரும் பன்மைப் பங்கேற்புவினை தொடர்ச்சியாக நடைபெறாத செயலைக் குறிக்கிறது. தமிழில் பட்டியலிடப்பட்ட எல்லா எழுவாய்களுக்கும் பொருந்துமாறு ஒரே வலியுறுத்தப்பட்ட எதிர்மறை வினை இயல்பாக அமைக்கப்பட்டுள்ளது.
- source_word: אַחַי
  choice: என் சகோதரர்கள்
  rationale: சொல்லின் நேரடியான குடும்பப் பொருளைத் தக்கவைக்கிறது; சூழலில் உறவினர்கள் அல்லது நெருங்கிய உடனுழைப்பாளர்களையும் குறிக்கக்கூடும்.
- source_word: נְעָרַי
  choice: என் இளைஞர்கள்
  rationale: נַעַר என்பது இளைஞன், பணியாள் அல்லது உதவியாளர் எனப் பொருள்படலாம். நிர்வாக அல்லது இராணுவப் பணியாளர் என்ற குறிப்பிட்ட பொருளைத் திணிக்காமல் மூலச்சொல்லின் பரப்பை ஓரளவு காக்கிறது.
- source_word: אַנְשֵׁי הַמִּשְׁמָר
  choice: காவல் ஆட்கள்
  rationale: מִשְׁמָר என்பதன் காவல் அல்லது கண்காணிப்புப் பணி சார்ந்த பொருளை நவீன தமிழில் தெளிவாகத் தருகிறது.
- source_word: אֲשֶׁר אַחֲרַי
  choice: எனக்குப் பின்னால் இருந்த
  rationale: இடஞ்சார்ந்த நேரடிப் பொருளைத் தக்கவைக்கிறது; அவர்கள் நெகேமியாவைப் பின்தொடர்ந்தவர்கள் என்ற பொருளும் சாத்தியம்.
- source_word: פֹשְׁטִים בְּגָדֵינוּ
  choice: எங்கள் உடைகளைக் கழற்றவே இல்லை
  rationale: בגדים உடன் פשט என்பது உடைகளைக் கழற்றுவதைக் குறிக்கிறது. ‘வே இல்லை’ இடைவிடாத விழிப்புநிலையை இயல்பான தமிழில் வலியுறுத்துகிறது.
- source_word: אִישׁ
  choice: ஒவ்வொருவனும்
  rationale: இங்கு אִישׁ பகிர்நிலைப் பொருளில் ஒவ்வொரு ஆணையும் தனித்தனியாகக் குறிக்கிறது.
- source_word: שִׁלְחוֹ
  choice: தன் ஆயுதத்தை
  rationale: שֶׁלַח பொதுவாக எறியப்படும் அல்லது ஈட்டி போன்ற ஆயுதத்தைக் குறிக்கலாம்; குறிப்பிட்ட ஆயுதவகையைத் திணிக்காமல் பொதுப்பெயர் பயன்படுத்தப்பட்டுள்ளது.
- source_word: הַמָּיִם
  choice: தண்ணீர் எடுக்கச் செல்லும்போதுகூட
  rationale: இறுதித் தொடர் மிகவும் சுருக்கமானதும் கடினமானதும். தண்ணீர் தொடர்பான தேவைக்குச் செல்லும்போதும் ஆயுதம் உடன் இருந்தது என்ற சாத்தியமான சூழற்பொருளை இயல்பான தமிழில் தருகிறது; நிச்சயமின்மை அடிக்குறிப்பில் வெளிப்படுத்தப்படுகிறது.
