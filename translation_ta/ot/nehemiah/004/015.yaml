  yaml_path: translation/ot/nehemiah/004/015.yaml
  text: So we kept doing the work[a], while half of them held the spears from the rising of the dawn until the coming out of the stars.
translation:
  language: ta
  text: நாங்கள் தொடர்ந்து வேலையைச் செய்தோம்; அவர்களில் பாதியினர் விடியல் தோன்றியது முதல் நட்சத்திரங்கள் வெளிவரும் வரை[a] ஈட்டிகளைப் பிடித்துக்கொண்டிருந்தனர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இன்னும் இயல்பாக, “விடியற்காலை முதல் நட்சத்திரங்கள் தோன்றும் வரை.”
    reason: lexical_alternative
lexical_decisions:
- source_word: עֹשִׂים
  choice: தொடர்ந்து … செய்தோம்
  rationale: வினையெச்ச வடிவம் சூழலில் நீடித்த செயலைக் குறிக்கிறது; தமிழில் ‘தொடர்ந்து’ என்பது அந்த நீடித்த தன்மையை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: בַּמְּלָאכָה
  choice: அந்த வேலையை
  rationale: מְלָאכָה என்பது பொதுவாக ‘வேலை’ எனப் பொருள்படும். முந்தைய சூழலில் குறிப்பிடப்பட்ட கட்டுமானப் பணியைச் சுட்டுவதால் ‘அந்த வேலை’ என மொழிபெயர்க்கப்பட்டது; ‘கட்டுமான வேலை’ என்று மூலத்தைவிடக் குறிப்பாக்கவில்லை.
- source_word: וְחֶצְיָם
  choice: அவர்களில் பாதிப்பேர்
  rationale: ‘அவர்களில் பாதி’ என்ற பொருளை இயல்பான நவீன தமிழில் தருகிறது; இணைப்புச் சொல் இங்கு ஒரே நேரத்தில் நடந்த இரு செயல்களை இணைக்கிறது.
- source_word: מַחֲזִיקִים
  choice: பிடித்துக்கொண்டிருந்தார்கள்
  rationale: வினையெச்சம் தொடர்ந்து ஆயுதங்களை ஏந்தியிருந்த நிலையைக் குறிக்கிறது; ‘பிடித்துக்கொண்டிருந்தார்கள்’ அந்த நீடித்த நிலையைக் காட்டுகிறது.
- source_word: בָּרְמָחִים
  choice: ஈட்டிகளை
  rationale: רֹמַח என்பதற்கு இந்த இராணுவச் சூழலில் இயல்பான தமிழ் இணைச்சொல் ‘ஈட்டி’.
- source_word: מֵעֲלוֹת הַשַּׁחַר
  choice: விடியல் எழுவது முதல்
  rationale: எபிரெயச் சொற்றொடரின் ‘விடியல் எழுதல்’ என்ற காட்சிப்படிமத்தைத் தக்கவைக்கிறது.
- source_word: עַד צֵאת הַכּוֹכָבִים
  choice: நட்சத்திரங்கள் வெளிவருவது வரை
  rationale: ‘நட்சத்திரங்கள் வெளிவருதல்/தோன்றுதல்’ என்ற மூலமொழியின் தெளிவான காட்சிப்படிமத்தைப் பாதுகாக்கிறது; ‘இரவுவரை’ என்று விளக்கமாகச் சுருக்கவில்லை.
