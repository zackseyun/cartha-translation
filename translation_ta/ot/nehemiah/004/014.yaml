  text: בִּ/מְק֗וֹם אֲשֶׁ֤ר תִּשְׁמְעוּ֙ אֶת ק֣וֹל הַ/שּׁוֹפָ֔ר שָׁ֖מָּ/ה תִּקָּבְצ֣וּ אֵלֵ֑י/נוּ אֱלֹהֵ֖י/נוּ יִלָּ֥חֶם לָֽ/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/004/014.yaml
  text: At the place where you hear the sound of the trumpet[a], gather there to us. Our God will fight for us.
translation:
  language: ta
  text: எந்த இடத்தில் கொம்பு எக்காளத்தின் ஒலியை[a] நீங்கள் கேட்கிறீர்களோ, அங்கே எங்களிடம் கூடிவாருங்கள். நம் இறைவன் நமக்காகப் போரிடுவார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஆட்டுக்கொம்பின் ஒலி.” எபிரெய மொழியிலுள்ள ஷோஃபார் என்பது குறிப்பாகக் கொம்பு எக்காளத்தைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּמְקוֹם אֲשֶׁר
  choice: எந்த இடத்தில் … கேட்கிறீர்களோ
  rationale: இடத்தைக் குறிக்கும் בִּמְקוֹם என்பதையும், அதனுடன் இணையும் உறவுநிலை אֲשֶׁר என்பதையும் இயல்பான நவீனத் தமிழில் நிபந்தனைத் தொனியுள்ள உறவுத் தொடராக வழங்குகிறது.
- source_word: תִּשְׁמְעוּ
  choice: நீங்கள் கேட்கிறீர்களோ
  rationale: שׁמע வினையின் எளிய ‘கேள்’ என்ற பொருளையும் பன்மை முன்னிலையையும் தெளிவாகப் பேணுகிறது.
- source_word: קוֹל הַשּׁוֹפָר
  choice: எக்காளத்தின் ஒலி
  rationale: קוֹל என்பதிலுள்ள ‘ஒலி’யை வெளிப்படையாகப் பேணுகிறது. שׁוֹפָר ஒரு கொம்பினால் செய்யப்பட்ட எக்காளத்தைக் குறிப்பதால், பொதுவாகப் புரியும் ‘எக்காளம்’ முதன்மை உரையில் இடப்பட்டு, குறிப்பான பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: שָׁמָּה
  choice: அங்கே
  rationale: சுட்டப்பட்ட இடத்தை நோக்கிய இடப்பொருளைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: תִּקָּבְצוּ
  choice: ஒன்றுகூடுங்கள்
  rationale: קבץ என்பதன் நிபால் வடிவம் இங்கு ஒன்றாகச் சேரும் கட்டளையாக உள்ளது; ‘ஒன்றுகூடுங்கள்’ அதன் பன்மைக் கட்டளை வலிமையை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: אֵלֵינוּ
  choice: எங்களிடம்
  rationale: முதலாம் நபர் பன்மையான ‘எங்களிடம்/எங்களை நோக்கி’ என்ற பொருளைப் பேணுகிறது; அதை ஒருமையாக மாற்றவில்லை.
- source_word: אֱלֹהֵינוּ
  choice: நம் இறைவன்
  rationale: எபிரெயச் சொல்லிலுள்ள முதலாம் நபர் பன்மை உடைமைப் பின்னொட்டைப் பேணுகிறது. ‘இறைவன்’ நவீனத் தமிழில் கண்ணியமாகவும் பொதுவாகவும் புரியும் சொல்.
- source_word: יִלָּחֶם לָנוּ
  choice: நமக்காகப் போரிடுவார்
  rationale: לחם என்பதன் போரிடும் செயற்பொருளையும், לָנוּ என்பதன் ‘நமது சார்பாக/நன்மைக்காக’ என்ற பொருளையும் நேரடியாகப் பேணுகிறது.
theological_decisions:
- issue: இறைவன் போரிடுவார் என்ற மொழி
  choice: நம் இறைவன் நமக்காகப் போரிடுவார்
  alternative: நம் இறைவன் நாம் போரிட உதவுவார்
  rationale: எபிரெய உரை போரிடும் செயலை இறைவனுக்கே நேரடியாக உரித்தாக்குகிறது; அதை வெறும் உதவியாக மென்மைப்படுத்தாமல் அதன் இறையியல் அழுத்தத்தைப் பேணுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் அதேவேளையில் கண்ணியமான நடையைப் பயன்படுத்துகிறது. ‘எங்களிடம்’ மற்றும் ‘நம்/நமக்காக’ என்ற பன்மை வடிவங்கள் மூலத்தின் நபர் வேறுபாட்டைப் பேணுகின்றன.
