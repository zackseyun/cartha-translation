base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/004/011.yaml
  text: The builders on the wall[a], and those who carried burdens, loaded themselves so that with one hand each did the work[b], and with the other held his weapon.
translation:
  language: ta
  text: மதிலைக் கட்டுகிறவர்களும் சுமைகளைச் சுமக்கிறவர்களும் சுமைகளை ஏற்றிக்கொண்டு[a], ஒவ்வொருவரும் ஒரு கையால் வேலை செய்தார்கள்; மற்ற கையால் ஆயுதத்தைப் பிடித்திருந்தார்கள்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இதனை, ‘சுமை சுமக்கிறவர்கள் சுமை ஏற்றப்பட்டிருந்தார்கள்’ என்றும் மொழிபெயர்க்கலாம். עֹמְשִׂים என்ற எபிரெயச் சொல் அரிதானது; அதன் துல்லியமான பொருள் நிச்சயமில்லை. பணியாளர்கள் ஆயுதம் ஏந்தியபடியே கட்டுமானப் பொருட்களைக் கையாண்டார்கள் என்பதே சூழலின் கருத்து.
    reason: lexical_alternative
  - marker: b
    text: הַשָּׁלַח என்ற எபிரெயச் சொல் இன்னும் குறிப்பாக ஈட்டி, எறிபடை, அல்லது வேறொரு படைக்கலத்தைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבּוֹנִים בַּחוֹמָה
  choice: மதிலைக் கட்டுகிறவர்கள்
  rationale: בנה என்பதன் பன்மை வினையெச்சம் பெயர்ச்சொல் போன்று பயன்படுத்தப்பட்டுள்ளது; בַחוֹמָה இங்கு மதில் கட்டும் பணியைக் குறிக்கும் இயல்பான தமிழில் வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: וְהַנֹּשְׂאִים בַּסֶּבֶל
  choice: சுமைகளைச் சுமக்கிறவர்கள்
  rationale: נשא மற்றும் סבל ஆகியவை கட்டுமானப் பொருட்கள் போன்ற சுமைகளை எடுத்துச் செல்வதைக் குறிக்கின்றன; இந்தச் சொற்றொடர் நவீனத் தமிழில் தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: עֹמְשִׂים
  choice: தங்கள்மேல் சுமைகளை ஏற்றிக்கொண்டு
  rationale: இந்த அரிதான வினையெச்சத்தின் துல்லியமான நயம் உறுதியற்றது; சூழலில் பணியாளர்கள் சுமை ஏற்றப்பட்டவர்களாக அல்லது சுமைகளை எடுத்துச் சென்றவர்களாக இருந்ததைக் காட்டும் வகையில் மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: בְּאַחַת יָדוֹ עֹשֶׂה בַמְּלָאכָה
  choice: ஒவ்வொருவரும் ஒரு கையால் வேலை செய்தார்கள்
  rationale: எபிரெய ஒருமை வடிவம் குழுவிலுள்ள ஒவ்வொருவரையும் தனித்தனியாகக் குறிக்கும் பகிர்வுப் பயன்பாடு கொண்டது; தமிழில் ‘ஒவ்வொருவரும்’ என்பதால் அது தெளிவாக்கப்பட்டுள்ளது.
- source_word: וְאַחַת מַחֲזֶקֶת
  choice: மறு கையால் ... பிடித்திருந்தார்கள்
  rationale: பெண்பால் ஒருமை வினையெச்சம் சொல்லப்படாமல் விடப்பட்டுள்ள ‘கை’ என்பதோடு இயைகிறது; இயல்பான தமிழுக்காக ‘மறு கையால்’ என்று வெளிப்படையாகக் கூறப்பட்டுள்ளது.
- source_word: הַשָּׁלַח
  choice: ஆயுதம்
  rationale: இந்தச் சொல் ஈட்டி, எறிபடை அல்லது வேறு ஆயுதத்தைக் குறிக்கக்கூடும்; குறிப்பிட்ட வகையைத் தீர்மானிக்காமல் பொதுவான ‘ஆயுதம்’ என்பது மூலத்தின் பொருள் விரிவைப் பாதுகாக்கிறது.
