base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/004/005.yaml
  text: And our adversaries said[a], “They will not know, and they will not see, until we come into their midst and kill them and stop the work.”
translation:
  language: ta
  text: நம் எதிரிகள், “நாம் அவர்கள் நடுவிற்குள்[a] வந்து, அவர்களைக் கொன்று, வேலையை நிறுத்திவிடும்வரை அவர்கள் அறியவும் மாட்டார்கள், பார்க்கவும் மாட்டார்கள்” என்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்கள் மத்தியில்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: צָרֵינוּ
  choice: நம் எதிரிகள்
  rationale: צַר என்பது பகைமையுடன் எதிர்த்து நிற்பவர்களைக் குறிக்கிறது. “எதிரிகள்” என்பது இச்சூழலில் இயல்பான, தெளிவான நவீனத் தமிழ் சொல்.
- source_word: יֵדְעוּ
  choice: அறியவும் மாட்டார்கள்
  rationale: יָדַע இங்கு நிகழப்போவதை அறிந்துகொள்ளுதல் அல்லது உணர்ந்துகொள்ளுதல் என்ற பொருளுடையது. “அறிய” என்பது எபிரெயச் சொல்லின் நேரடியான எளிமையைப் பாதுகாக்கிறது.
- source_word: יִרְאוּ
  choice: பார்க்கவும் மாட்டார்கள்
  rationale: רָאָה என்பதன் அடிப்படைப் பொருள் “பார்.” “அறிய” என்பதுடன் அமைந்துள்ள இணைநிலையையும் அச்சுறுத்தலின் காட்சித் தன்மையையும் இத்தேர்வு பாதுகாக்கிறது; சூழலில் இது கவனித்தல் என்ற பொருளையும் தருகிறது.
- source_word: עַד אֲשֶׁר
  choice: வரை
  rationale: இந்தச் சொற்றொடர் எதிரிகள் வந்து தாக்கும் நேரம்வரை மக்கள் அறியாமலும் பார்க்காமலும் இருப்பார்கள் என்ற கால எல்லையைக் குறிக்கிறது.
- source_word: נָבֹא
  choice: நாம் ... வந்து
  rationale: בּוֹא என்பது வருதல் அல்லது உள்ளே செல்லுதல் என்பதைக் குறிக்கலாம். தொடர்ந்து வரும் இடச்சொற்றொடருடன் “வந்து” இயல்பாக அமைந்து, நேரடிக் கூற்றின் உடனடித் தன்மையைப் பாதுகாக்கிறது.
- source_word: אֶל תּוֹכָם
  choice: அவர்கள் நடுவிற்குள்
  rationale: תּוֹךְ என்பது நடுப்பகுதி அல்லது உள்ளிடம். “நடுவிற்குள்” என்பது உள்ளே ஊடுருவி வருவதையும் திடீர்த் தாக்குதலின் அச்சுறுத்தலையும் வெளிப்படுத்துகிறது.
- source_word: וַהֲרַגְנוּם
  choice: அவர்களைக் கொன்று
  rationale: הָרַג என்பது கொல்லுதல் என்பதற்கான வழக்கமான வினை. “கொன்று” என்பது எபிரெயின் நேரடியான கடுமையைத் தெளிவாகக் காட்டுகிறது.
- source_word: וְהִשְׁבַּתְנוּ
  choice: நிறுத்தி
  rationale: שׁבת என்பதன் ஹிஃபில் வடிவம் ஒன்றை ஓயச் செய்தல் அல்லது நிறுத்துதல் என்பதைக் குறிக்கிறது. “வேலையை நிறுத்தி” என்பது காரணவினைப் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: הַמְּלָאכָה
  choice: வேலையை
  rationale: מְלָאכָה இங்கு மதில் மறுகட்டுமானப் பணியைக் குறிக்கிறது. “வேலை” என்பது தெளிவானதும் சூழலுக்குப் போதுமான அளவு பரந்ததுமான சொல்.
