revisions:
- from: பின்பு நான் பார்த்து எழுந்து நின்று, பிரபுக்களிடமும் அதிகாரிகளிடமும் மற்ற மக்களிடமும், “அவர்களுக்குப் பயப்படாதீர்கள். மகத்தானவரும் அஞ்சத்தக்கவருமான[a] ஆண்டவரை நினைவுகூருங்கள். உங்கள் சகோதரர்களுக்காகவும்[b] மகன்களுக்காகவும் மகள்களுக்காகவும் மனைவிகளுக்காகவும் வீடுகளுக்காகவும் போராடுங்கள்” என்றேன்.
  to: பின்பு நான் பார்த்து, எழுந்து நின்று, பிரபுக்களிடமும் அதிகாரிகளிடமும் மீதமுள்ள மக்களிடமும், “அவர்களுக்குப் பயப்படாதீர்கள். மகத்தானவரும் அஞ்சத்தக்கவருமான[a] ஆண்டவரை நினைவுகூருங்கள். உங்கள் சகோதரர்களுக்காகவும்[b] மகன்களுக்காகவும் மகள்களுக்காகவும் மனைவிகளுக்காகவும் வீடுகளுக்காகவும் போராடுங்கள்” என்றேன்.
  rationale: The revision replaces the potentially misleading “மற்ற மக்கள்” with “மீதமுள்ள மக்கள்” to represent יֶתֶר (“remainder/rest”) accurately and adds punctuation for natural Tamil readability. The meaning, list structure, theological terminology, and footnote anchors are otherwise retained.
