  text: Then I looked[a], rose up, and said to the nobles, to the officials, and to the rest of the people, “Do not be afraid of them. Remember the Lord, who is great and fearsome, and fight for your brothers, your sons, your daughters, your wives[b], and your houses.”
translation:
  language: ta
  text: பின்பு நான் பார்த்து, எழுந்து நின்று, பிரபுக்களிடமும் அதிகாரிகளிடமும் மீதமுள்ள மக்களிடமும், “அவர்களுக்குப் பயப்படாதீர்கள். மகத்தானவரும் அஞ்சத்தக்கவருமான[a] ஆண்டவரை நினைவுகூருங்கள். உங்கள் சகோதரர்களுக்காகவும்[b] மகன்களுக்காகவும் மகள்களுக்காகவும் மனைவிகளுக்காகவும் வீடுகளுக்காகவும் போராடுங்கள்” என்றேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மகத்தானவரும் வியப்புக்குரியவருமான.” எபிரெயப் பெயரடை வியப்பையும் அச்சத்தையும் ஏற்படுத்துவதைச் சுட்டலாம்; அதன் வலிமையான பொருளைப் பேண இங்கு “அஞ்சத்தக்கவர்” என்று மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
  - marker: b
    text: “சகோதரர்கள்” என்பது ஆண்பால் பன்மையில் உள்ள எபிரெய உறவுமுறைச் சொல்லின் மொழிபெயர்ப்பு. அதைத் தொடர்ந்து மகன்கள், மகள்கள், மனைவிகள் ஆகியோர் தனித்தனியாகக் குறிப்பிடப்படுகின்றனர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֵרֶא
  choice: பின்பு நான் பார்த்து
  rationale: ראה என்பதன் தொடர்கதை வடிவம் நெகேமியாவின் அடுத்த நடவடிக்கையை அறிமுகப்படுத்துகிறது. ‘பார்த்து’ என்பது செயற்பாட்டைக் காட்டுவதோடு, எபிரெய வாக்கியத் தொடரையும் இயல்பாகப் பேணுகிறது.
- source_word: וָאָקוּם
  choice: எழுந்து நின்று
  rationale: קום இங்கு உறுதியான நடவடிக்கைக்காக எழுந்து நிற்பதைக் குறிக்கிறது. ‘எழுந்து நின்று’ என்பது நவீன தமிழில் தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: הַחֹרִים
  choice: பிரபுக்கள்
  rationale: இச்சொல் உயர்ந்த சமூக நிலையிலிருந்த தலைவர்களைக் குறிக்கிறது. ‘பிரபுக்கள்’ அந்த சமூகத் தரத்தையும் நிர்வாகச் சூழலையும் சுருக்கமாக வெளிப்படுத்துகிறது.
- source_word: הַסְּגָנִים
  choice: அதிகாரிகள்
  rationale: இது துணை ஆட்சியாளர்கள் அல்லது நிர்வாகப் பொறுப்பாளர்களைக் குறிக்கிறது. ‘அதிகாரிகள்’ நவீன வாசகர்களுக்கு தெளிவான பொதுச் சொல்.
- source_word: יֶתֶר הָעָם
  choice: மற்ற மக்கள்
  rationale: முன்னர் குறிப்பிடப்பட்ட தலைவர்களைத் தவிர மீதமிருந்த மக்களைக் குறிக்கிறது. ‘மற்ற மக்கள்’ தமிழில் சுருக்கமாகவும் இயல்பாகவும் உள்ளது.
- source_word: אַל תִּירְאוּ מִפְּנֵיהֶם
  choice: அவர்களுக்குப் பயப்படாதீர்கள்
  rationale: ירא + מִפְּנֵי என்ற மரபுத்தொடர் எதிரிகளைக் கண்டு அஞ்சுவதைக் குறிக்கிறது. இந்தத் தமிழ் வடிவம் தடையின் நேரடியான வலிமையைப் பேணுகிறது.
- source_word: אֶת אֲדֹנָי
  choice: ஆண்டவரை
  rationale: אֲדֹנָי என்பது இங்கு கடவுளுக்கான தெய்வீகப் பட்டம்; இது יהוה அல்ல. ஆகவே தமிழில் வழக்கமான ‘ஆண்டவர்’ பயன்படுத்தப்படுகிறது.
- source_word: הַגָּדוֹל וְהַנּוֹרָא
  choice: மகத்தானவரும் அஞ்சத்தக்கவருமான
  rationale: נוֹרָא என்பது வியப்பையும் அச்சத்தையும் உண்டாக்குகிறவரைக் குறிக்கலாம். ‘அஞ்சத்தக்கவர்’ மனித எதிரிகளுக்கான பயத்துக்கும் கடவுள்மீதான அச்சத்துக்கும் இடையிலுள்ள மூல உரையின் வலிமையான பதற்றத்தைப் பேணுகிறது.
- source_word: זְכֹרוּ
  choice: நினைவுகூருங்கள்
  rationale: கட்டளை வடிவத்தின் நேரடித் தன்மையையும் உடன்படிக்கை சார்ந்த கனத்தையும் ‘நினைவுகூருங்கள்’ வெளிப்படுத்துகிறது.
- source_word: וְהִלָּחֲמוּ עַל
  choice: …க்காகப் போராடுங்கள்
  rationale: עַל உடன் வரும் இவ்வினை, குறிப்பிடப்பட்டவர்களின் பாதுகாப்புக்காகப் போரிடுவதைக் குறிக்கிறது. ‘…க்காகப் போராடுங்கள்’ சூழலுக்கு துல்லியமானது.
- source_word: אֲחֵיכֶם
  choice: உங்கள் சகோதரர்களுக்காக
  rationale: எபிரெயச் சொல் இலக்கணரீதியாக ஆண்பால் பன்மையாக உள்ளது. தொடர்ந்து மகன்கள், மகள்கள், மனைவிகள் தனித்தனியாகப் பெயரிடப்படுவதால் ‘சகோதரர்கள்’ என்ற குறிப்பான பொருள் பேணப்படுகிறது.
- source_word: בְּנֵיכֶם וּבְנֹתֵיכֶם נְשֵׁיכֶם וּבָתֵּיכֶם
  choice: மகன்களுக்காகவும் மகள்களுக்காகவும் மனைவிகளுக்காகவும் வீடுகளுக்காகவும்
  rationale: மூல உரையின் தெளிவான, படிப்படியாகச் சேர்க்கப்படும் பட்டியல் பேணப்படுகிறது. בָּתִּים குடியிருப்புகளையும் குடும்ப வீடுகளையும் குறிக்கக்கூடும் என்பதால் ‘வீடுகள்’ என மொழிபெயர்க்கப்படுகிறது.
theological_decisions:
- issue: אֲדֹנָי என்ற தெய்வீகப் பட்டத்தின் மொழிபெயர்ப்பு
  choice: ஆண்டவர்
  alternative: எஜமான்
  rationale: இங்கு வருவது יהוה என்ற திருப்பெயர் அல்ல, אֲדֹנָי என்ற தெய்வீகப் பட்டம். ‘ஆண்டவர்’ தமிழில் கடவுளைக் குறிக்கும் இயல்பான, மரியாதையான வடிவம்; இரு எபிரெயப் பெயர்களையும் தேவையின்றி ஒன்றாக்குவதில்லை.
- issue: הַנּוֹרָא என்பதன் அச்சம்–வியப்பு சார்ந்த பொருள்
  choice: அஞ்சத்தக்கவர்
  alternative: வியப்புக்குரியவர்
  rationale: மனித எதிரிகளுக்குப் பயப்பட வேண்டாம் என்ற கட்டளைக்கு எதிராக, கடவுளின் அச்சத்தை உண்டாக்கும் மகத்துவம் முன்வைக்கப்படுகிறது. ‘அஞ்சத்தக்கவர்’ அந்தத் தெய்வீகப் பதற்றத்தைத் தணிக்காமல் பேணுகிறது; அடிக்குறிப்பு வியப்பு சார்ந்த பொருளையும் வெளிப்படுத்துகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் மரியாதையான வேதாகம நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. கட்டளைகளின் நேரடித் தன்மையும் பட்டியலின் மீளுரைப்பும் திட்டமிட்டு பேணப்பட்டுள்ளன; ‘அஞ்சத்தக்கவர்’ என்பது நவீன தமிழில் புரியக்கூடியதாக இருந்து, மூலத்தின் அச்சம்–வியப்பு இரட்டைப் பொருளை வலுவாக எடுத்துரைக்கிறது.
