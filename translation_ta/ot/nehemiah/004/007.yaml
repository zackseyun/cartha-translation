  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய உரையிலுள்ள ‘நிறுத்தினேன்’ என்ற வினையின் மறுபயன்பாடும் ஆயுதங்களின் மும்மைப்பட்டியலும் பாதுகாக்கப்பட்டுள்ளன; அரிதான בצחחיים என்பதன் நிச்சயமற்ற பொருள் அடிக்குறிப்பில் வெளிப்படையாக வைக்கப்பட்டுள்ளது.
