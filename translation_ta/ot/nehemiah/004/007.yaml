base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/004/007.yaml
  text: Then I stationed men in the lowest parts of the place[a], behind the wall, in the exposed areas; and I stationed the people by families, with their swords, their spears, and their bows.
translation:
  language: ta
  text: அப்போது மதிலுக்குப் பின்னால், அந்த இடத்தின் மிகவும் தாழ்வான பகுதிகளிலும் வெட்டவெளியான இடங்களிலும்[a] ஆட்களை நிறுத்தினேன்; மக்களை அவரவர் குடும்பங்களின்படி, அவர்களுடைய வாள்கள், ஈட்டிகள், வில்லுகள் ஆகியவற்றுடன் நிறுத்தினேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘வெறுமையான இடங்களில்’ அல்லது ‘திறந்த இடங்களில்.’ இங்கு வரும் எபிரெயச் சொல் அரிதானது; தாக்குதலுக்கு எளிதில் ஆளாகக்கூடிய, மறைவற்ற அல்லது திறந்த பகுதிகளை இது குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאַעֲמִיד
  choice: நிறுத்தினேன்
  rationale: עמד என்பதன் ஹிஃபில் வடிவம் இங்கு தற்காப்புக்காக ஆட்களை குறிப்பிட்ட நிலைகளில் நிறுத்துவதைக் குறிக்கிறது. ‘நிறுத்தினேன்’ என்பது இயல்பான தமிழில் அந்தச் செயப்பாட்டு பொருளைத் தெளிவாகத் தருகிறது.
- source_word: מִתַּחְתִּיּוֹת לַמָּקוֹם
  choice: அந்த இடத்தின் மிகவும் தாழ்வான பகுதிகளில்
  rationale: תחת என்பதிலிருந்து வந்த இச்சொல் இடத்தின் கீழான அல்லது மிகவும் தாழ்வான பகுதிகளைக் குறிக்கிறது. தற்காப்புக்கு ஏதுவான நில அமைப்பை தேவையின்றி மேலதிகமாக விளக்காமல் இடஞ்சார்ந்த பொருளைப் பாதுகாக்கிறது.
- source_word: מֵאַחֲרֵי לַחוֹמָה
  choice: மதிலுக்குப் பின்னால்
  rationale: மதிலின் பின்புறத்திலுள்ள நிலையை நவீனத் தமிழில் இயல்பாகவும் நேரடியாகவும் தெரிவிக்கிறது.
- source_word: בצחחיים
  choice: வெட்டவெளியான இடங்களில்
  rationale: அரிதாக வரும் இச்சொல் மறைவற்ற, திறந்த அல்லது வெறுமையான இடங்களைக் குறிக்கக்கூடும். ‘வெட்டவெளியான’ என்பது தாக்குதலுக்கு வெளிப்பட்டிருக்கக்கூடிய தன்மையை உணர்த்தினாலும் பொருளை அளவுக்கு மீறி உறுதிப்படுத்தாது.
- source_word: וָאַעֲמִיד אֶת־הָעָם
  choice: மக்களை ... நிறுத்தினேன்
  rationale: எபிரெய உரையில் வினைச்சொல் மீண்டும் வருவதால், தற்காப்பு ஏற்பாட்டின் திட்டமிட்ட தன்மையைப் பிரதிபலிக்க தமிழிலும் அதை மீண்டும் வழங்குகிறது.
- source_word: לְמִשְׁפָּחוֹת
  choice: அவரவர் குடும்பங்களின்படி
  rationale: மக்கள் குடும்பக் குழுக்களின் அடிப்படையில் ஒழுங்குபடுத்தப்பட்டதைத் தெளிவாகக் காட்டும் இயல்பான தமிழ் நடை.
- source_word: עִם חַרְבֹתֵיהֶם רָמְחֵיהֶם וְקַשְּׁתֹתֵיהֶם
  choice: அவர்களுடைய வாள்கள், ஈட்டிகள், வில்லுகள் ஆகியவற்றுடன்
  rationale: மூன்று ஆயுதங்களையும் அவற்றின் உடைமைப் பின்னொட்டுகளையும் தெளிவாகப் பாதுகாக்கிறது; பட்டியலை நவீனத் தமிழில் இயல்பாக அமைக்கிறது.
