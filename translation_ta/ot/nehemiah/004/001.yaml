base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/004/001.yaml
  text: When Sanballat and Tobiah and the Arabs and the Ammonites and the Ashdodites heard that the repair of Jerusalem’s walls had gone up[a], that the breaches had begun to be closed[b], they became very angry.
translation:
  language: ta
  text: சன்பல்லாத்தும் தொபியாவும் அரபியரும் அம்மோனியரும் அஸ்தோத் மக்களும், எருசலேமின் மதில்களைச் சீரமைக்கும் பணி முன்னேறியதையும்[a], அவற்றின் உடைந்த பகுதிகள் அடைக்கப்படத் தொடங்கியதையும்[b] கேள்விப்பட்டபோது, அவர்களுக்கு மிகவும் கோபம் மூண்டது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘எருசலேமின் மதில்களின் மறுசீரமைப்பு முன்னேறியது’ என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் பொதுவாகக் குணமடைதல் அல்லது மீட்டமைத்தலைக் குறிக்கும்; இங்கே அது மதில் சீரமைப்பை உருவகமாகக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: ‘உடைந்த பகுதிகள்’ என்பதற்குப் பதிலாக ‘இடைவெளிகள்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כַאֲשֶׁר
  choice: கேள்விப்பட்டபோது
  rationale: எபிரெயக் கதைநடையின் நிகழ்வுமாற்றத்தையும் காலத் தொடர்பையும் இயல்பான நவீன தமிழில் சார்பு வாக்கியமாகக் காட்டுகிறது; மூலத்தில் இல்லாத தனிப்பட்ட ‘இப்போது’ என்ற சொல்லைச் சேர்க்கவில்லை.
- source_word: שָׁמַע
  choice: கேள்விப்பட்டபோது
  rationale: செய்தி அறிந்துகொள்வதைக் குறிக்கும் சூழலில் ‘கேள்விப்பட்டனர்’ என்பது நேரடியும் இயல்பானதும் ஆகும்.
- source_word: סַנְבַלַּט וְטוֹבִיָּה
  choice: சன்பல்லாத்தும் தொபியாவும்
  rationale: தனிப்பெயர்கள் எபிரெய ஒலிப்புக்கு நெருக்கமான, தமிழில் வாசிக்கக்கூடிய வடிவில் ஒலிபெயர்க்கப்பட்டுள்ளன.
- source_word: הָעַרְבִים
  choice: அரபியர்
  rationale: அரபு மக்களைக் குறிக்கும் தற்போதைய தெளிவான இனப்பெயர்.
- source_word: הָעַמֹּנִים
  choice: அம்மோனியர்
  rationale: அம்மோன் மக்களுக்கான வழக்கமான தமிழ்ப் பெயர்.
- source_word: הָאַשְׁדּוֹדִים
  choice: அஸ்தோத் மக்கள்
  rationale: அஸ்தோத் நகரத்தைச் சேர்ந்த மக்களைத் தெளிவாகக் குறிக்கிறது; செயற்கையான இனப்பெயர் வடிவத்தைத் தவிர்க்கிறது.
- source_word: עָלְתָה אֲרוּכָה
  choice: சீரமைக்கும் பணி முன்னேறியது
  rationale: אֲרוּכָה என்பதன் ‘குணமாதல்/மீட்சி’ உருவகத்தையும் עָלְתָה என்பதன் முன்னேற்றக் கருத்தையும், மதில் பழுதுபார்க்கப்படும் சூழலுக்கேற்ற இயல்பான தமிழில் தருகிறது; உருவகம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: לְחֹמוֹת יְרוּשָׁלַםִ
  choice: எருசலேமின் மதில்களை
  rationale: சீரமைப்புப் பணிக்கும் எருசலேமின் மதில்களுக்கும் உள்ள தொடர்பை இயல்பான தமிழ் வேற்றுமை அமைப்பில் தெரிவிக்கிறது.
- source_word: הַפְּרֻצִים
  choice: உடைந்த பகுதிகள்
  rationale: மதிலிலுள்ள பிளவுகள் அல்லது இடைவெளிகளை சாதாரண வாசகருக்குத் தெளிவாகக் காட்டுகிறது; ‘இடைவெளிகள்’ என்ற மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: לְהִסָּתֵם
  choice: அடைக்கப்பட
  rationale: நிபால் வினைவடிவின் செயப்பாட்டு பொருளான ‘மூடப்படுதல்/அடைக்கப்படுதல்’ என்பதை மதிலின் உடைந்த பகுதிகளுக்கேற்றவாறு தெரிவிக்கிறது.
- source_word: וַיִּחַר לָהֶם מְאֹד
  choice: அவர்களுக்கு மிகவும் கோபம் மூண்டது
  rationale: ‘அவர்களுக்கு மிகவும் எரிந்தது’ என்ற எபிரெய மொழிவழக்கின் தீவிரத்தை இயல்பான தமிழில் பாதுகாக்கிறது.
