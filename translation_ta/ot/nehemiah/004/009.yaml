base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/004/009.yaml
  text: And it happened that when our enemies heard that it had become known to us[a], and that God had frustrated their plan, we all returned to the wall[c][b], each man to his work.
translation:
  language: ta
  text: அது எங்களுக்குத் தெரியவந்தது[a] என்றும், கடவுள் அவர்களுடைய திட்டத்தை முறியடித்தார்[b] என்றும் எங்கள் பகைவர்கள் கேள்விப்பட்டபோது, நாங்கள் எல்லாரும் மதிலுக்குத் திரும்பினோம்—ஒவ்வொருவனும் தன் வேலைக்கு[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அதை நாங்கள் அறிந்துகொண்டோம்.” எபிரெயத்தில் சொற்பொருளாக, “அது எங்களுக்குத் தெரியவந்தது.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அவர்களுடைய ஆலோசனையைப் பயனற்றதாக்கினார்.”
    reason: lexical_alternative
  - marker: c
    text: “ஒவ்வொருவனும் தன் வேலைக்கு” என்பது ஒவ்வொருவரையும் தனித்தனியாகக் குறிக்கும் எபிரெயப் பகிர்வுச் சொல்லமைப்பு.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר
