  rationale: மூல எபிரெயம் இந்தச் செயலைக் கடவுளுக்கே நேரடியாகக் கூறுகிறது; அந்த இறையியல் வலியுறுத்தல் மென்மைப்படுத்தப்படவில்லை.
- issue: אִישׁ என்ற ஆண்பால் பகிர்வுச் சொல்
  choice: ஒவ்வொருவனும்
  alternative: ஒவ்வொருவரும்
  rationale: மூலத்தின் ஆண்பால் ஒருமைப் பகிர்வுச் சொல்லைத் தெளிவாகப் பாதுகாக்கிறது; அது தொழிலாளர்களைத் தனித்தனியாகக் குறிப்பிடுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் மரியாதைமிக்க கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘மதில்’, ‘திட்டம்’, ‘முறியடித்தார்’ ஆகியவை தெளிவையும் மூலத்தின் செறிவையும் இணைக்கின்றன; இறுதி எபிரெயச் சொற்றொடரின் சுருக்கமான அமைப்பு நீள்கோட்டின் மூலம் பாதுகாக்கப்பட்டுள்ளது.
