translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும் மரியாதையான நடை. கட்டளையின் இரவு காவல்–பகல் வேலை என்ற இணைநிலையைப் பேணுகிறது. நַעַר என்பதிலுள்ள வயது/பணிநிலைத் தெளிவின்மையை வயதைச் சேர்க்காமல் ‘உதவியாளர்’ என வைத்துள்ளது.
