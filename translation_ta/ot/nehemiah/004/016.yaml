base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/004/016.yaml
  text: Also at that time I said to the people[a], “Let each man and his servant spend the night within Jerusalem[b], and let them be a guard for us by night and workers by day.”
translation:
  language: ta
  text: மேலும், அந்தக் காலத்தில் நான் மக்களிடம், “ஒவ்வொருவரும் தம் பணியாளனும் எருசலேமுக்குள் இரவில் தங்கட்டும்; அவர்கள் இரவில் நமக்குக் காவலாகவும், பகலில் வேலை செய்பவர்களாகவும் இருக்கட்டும்” என்று சொன்னேன்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: גַּם בָּעֵת הַהִיא
  choice: அந்த நேரத்தில்
  rationale: בָּעֵת הַהִיא என்பதன் இயல்பான காலக் குறிப்பைத் தெளிவாகத் தருகிறது. גַּם இங்கு முன்னுள்ள நடவடிக்கைகளுடன் இதை இணைக்கிறது; தமிழில் தொடர்ச்சியான சூழலில் தனியே ‘மேலும்’ சேர்ப்பது செயற்கையாக ஒலிக்கக்கூடும் என்பதால் வெளிப்படையாக மொழிபெயர்க்கப்படவில்லை.
- source_word: אָמַרְתִּי לָעָם
  choice: நான் மக்களிடம் ... என்று சொன்னேன்
  rationale: எபிரெயச் சொல்லமைப்பின் நேரடியான பொருளை இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: אִישׁ וְנַעֲרוֹ
  choice: ஒவ்வொருவரும் தன் உதவியாளனோடு
  rationale: אִישׁ இங்கு பகிர்மானப் பொருளில் ‘ஒவ்வொருவரும்’ என வருகிறது. נַעַר இச்சூழலில் இளைஞன், பணியாள், உதவியாளர் ஆகிய பொருட்களை ஏற்கலாம்; வயதை உறுதிப்படுத்தாமல் கீழ்நிலைத் துணையாளரைக் குறிக்க ‘உதவியாளர்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: יָלִינוּ
  choice: இரவில் தங்கட்டும்
  rationale: לון/לין என்பதன் இரவைக் கழித்தல் அல்லது இரவு தங்குதல் என்ற பொருளை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: בְּתוֹךְ יְרוּשָׁלִָם
  choice: எருசலேமுக்குள்
  rationale: நகரத்தின் எல்லைக்குள் தங்க வேண்டும் என்ற இடப்பொருளைச் சுருக்கமாகவும் தெளிவாகவும் தருகிறது.
- source_word: וְהָיוּ לָנוּ הַלַּיְלָה מִשְׁמָר
  choice: அவர்கள் இரவில் நமக்குக் காவலாகவும்
  rationale: מִשְׁמָר என்பதன் காவல் அல்லது காவற்பணி என்ற பொருளையும், לָנוּ என்பதன் ‘நமக்கு’ என்ற தொடர்பையும் காக்கிறது.
- source_word: וְהַיּוֹם מְלָאכָה
  choice: பகலில் வேலை செய்வோராகவும் இருக்கட்டும்
  rationale: சொல்லுக்குச் சொல் ‘பகலில் வேலை’ என்ற சுருக்கமான எபிரெய இணைப்பை, அதே மனிதர்களே பகலில் வேலை செய்வார்கள் எனத் தமிழில் இயல்பாக விளக்குகிறது.
