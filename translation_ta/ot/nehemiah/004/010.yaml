base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/004/010.yaml
  text: And from that day on[a], half of my young men were doing the work, and half of them were holding the spears, the shields, the bows, and the armor[c][b]; and the officers were behind all the house of Judah.
translation:
  language: ta
  text: அந்த நாள்முதல், என் இளைஞர்களில்[a] பாதிப்பேர் வேலையைச் செய்துகொண்டிருந்தார்கள்; மற்றப் பாதிப்பேர் ஈட்டிகளையும் கேடயங்களையும் வில்லுகளையும் உடற்கவசங்களையும்[b] ஏந்திக்கொண்டிருந்தார்கள். அதிகாரிகள் யூதா மக்களனைவருக்கும் பின்னால் இருந்தார்கள்.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “என் பணியாளர்கள்” அல்லது “என் உடனிருப்போர்” என்றும் மொழிபெயர்க்கலாம்; இங்குள்ள எபிரெயச் சொல் சூழலுக்கேற்ப இளைஞர்கள், பணியாளர்கள் அல்லது உடனிருப்போரைக் குறிக்கக்கூடும்.
    reason: lexical_alternative
  - marker: b
    text: “உடற்கவசங்கள்” என்பது உடலில் அணியும் பாதுகாப்புக் கவசங்களைக் குறிக்கிறது; “சங்கிலிக் கவசங்கள்” அல்லது “மார்புக்கவசங்கள்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: அதிகாரிகள் யூதா மக்களனைவருக்கும் பின்னால் இருந்தனர் என்பது, அவர்களுக்குப் படைப் பாதுகாப்பு அல்லது மேற்பார்வை வழங்கிய நிலையைக் குறிக்கலாம்.
    reason: cultural_note
lexical_decisions:
- source_word: נְעָרַי
  choice: என் இளைஞர்களில்
  rationale: இந்த எபிரெயச் சொல் இளைஞர்கள், பணியாளர்கள் அல்லது உடனிருப்போர் என்பதைக் குறிக்கலாம். இங்குள்ள இராணுவப் பணி சூழலில் ‘என் இளைஞர்கள்’ என்பது அடிப்படைப் பொருளைப் பேணுகிறது; பிற சாத்தியங்கள் அடிக்குறிப்பில் தரப்பட்டுள்ளன.
- source_word: עֹשִׂים בַּמְּלָאכָה
  choice: வேலையைச் செய்துகொண்டிருந்தார்கள்
  rationale: கட்டுமானப் பணியில் தொடர்ந்து ஈடுபட்டிருந்ததை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: מַחֲזִיקִים
  choice: ஏந்திக்கொண்டிருந்தார்கள்
  rationale: ஆயுதங்களைப் பிடித்திருத்தல் அல்லது தயாராக வைத்திருத்தல் என்ற சூழல்சார் பொருளை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: הָרְמָחִים הַמָּגִנִּים וְהַקְּשָׁתוֹת
  choice: ஈட்டிகளையும் கேடயங்களையும் வில்லுகளையும்
  rationale: ஆயுதப் பட்டியலைத் தெளிவான, பொதுவாகப் புரியும் தமிழில் நேரடியாக வழங்குகிறது.
- source_word: הַשִּׁרְיֹנִים
  choice: உடற்கவசங்களையும்
  rationale: உடலில் அணியும் பாதுகாப்புக் கவசத்தைக் குறிக்கிறது; ‘சங்கிலிக் கவசம்’ போன்ற மிகக் குறிப்பான வடிவத்தை மூலச்சொல் கட்டாயப்படுத்தாததால் தவிர்க்கப்பட்டது.
- source_word: הַשָּׂרִים
  choice: அதிகாரிகள்
  rationale: שַׂר என்பது தலைவர்கள், அதிகாரிகள் அல்லது படைத்தலைவர்கள் எனப் பொருள்படலாம். இச்சூழலில் ‘அதிகாரிகள்’ என்பது அரசகுலப் பட்டத்தைத் தேவையின்றி உணர்த்தாமல் அவர்களின் அமைப்புசார் பொறுப்பைக் காட்டுகிறது.
- source_word: אַחֲרֵי כָּל בֵּית יְהוּדָה
  choice: யூதா வம்சத்தார் அனைவருக்கும் பின்னால்
  rationale: אַחֲרֵי என்பதன் இடம்சார் ‘பின்னால்’ என்ற பொருளைத் தக்கவைக்கிறது; בֵּית יְהוּדָה என்ற கூட்டு அடையாளத்தை இயல்பான தமிழில் ‘யூதா வம்சத்தார்’ என வழங்குகிறது.
