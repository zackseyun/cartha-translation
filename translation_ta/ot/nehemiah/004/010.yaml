translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் மரியாதைமிக்க நடையிலும் மொழிபெயர்க்கப்பட்டது. ஆயுதங்களின் பெயர்கள் எளிய வழக்குச் சொற்களால் தரப்பட்டுள்ளன. மூலத்தில் இல்லாத ‘நின்றார்கள்’ என்ற வினை சேர்க்கப்படாமல், ‘பின்னால் இருந்தார்கள்’ என இடம்சார் தெளிவின்மை பாதுகாக்கப்பட்டுள்ளது.
