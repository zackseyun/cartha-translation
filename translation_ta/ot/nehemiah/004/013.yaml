  text: וָ/אֹמַ֞ר אֶל הַ/חֹרִ֤ים וְ/אֶל הַ/סְּגָנִים֙ וְ/אֶל יֶ֣תֶר הָ/עָ֔ם הַ/מְּלָאכָ֥ה הַרְבֵּ֖ה וּ/רְחָבָ֑ה וַ/אֲנַ֗חְנוּ נִפְרָדִים֙ עַל הַ֣/חוֹמָ֔ה רְחוֹקִ֖ים אִ֥ישׁ מֵ/אָחִֽי/ו־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/004/013.yaml
  text: And I said to the nobles[a], to the officials, and to the rest of the people, “The work is great and spread out, and we are separated along the wall, far from one another.”
translation:
  language: ta
  text: நான் பிரபுக்களிடமும், அதிகாரிகளிடமும், எஞ்சிய மக்களிடமும், “வேலை பெரியதும் பரந்ததுமாக இருக்கிறது; நாம் மதில் நெடுகிலும் ஒருவரைவிட்டு ஒருவர் வெகுதொலைவில் பிரிந்திருக்கிறோம்[a]” என்றேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எழுத்துப்படி, “ஒவ்வொருவனும் தன் சகோதரனிடமிருந்து”; இது “ஒருவரைவிட்டு ஒருவர்” என்று பொருள்படும் எபிரேய மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחֹרִים
  choice: பிரபுக்கள்
  rationale: நெகேமியாவின் சூழலில் சமூகத்தின் உயர்நிலைத் தலைவர்களைக் குறிக்கிறது; வெறுமனே ‘சுதந்திரமானவர்கள்’ என்ற பொருள் இங்கு பொருந்தாது.
- source_word: הַסְּגָנִים
  choice: அதிகாரிகள்
  rationale: கீழ்நிலை ஆட்சித் தலைவர்கள் அல்லது நிர்வாகப் பொறுப்பாளர்களைக் குறிக்கும் இயல்பான பொதுப்பெயர்.
- source_word: יֶתֶר הָעָם
  choice: மற்ற மக்கள்
  rationale: முன்னர் குறிப்பிடப்பட்ட தலைவர்களைத் தவிர எஞ்சிய மக்களை இயல்பான தமிழில் குறிக்கிறது.
- source_word: הַמְּלָאכָה הַרְבֵּה וּרְחָבָה
  choice: வேலை பெரிதாகவும் பரந்துபட்டதாகவும் இருக்கிறது
  rationale: மறுகட்டுமானப் பணியின் அளவையும் அது விரிந்த பரப்பில் நடைபெறுவதையும் இரண்டையும் காக்கிறது.
- source_word: נִפְרָדִים
  choice: பிரிந்திருக்கிறோம்
  rationale: பணியாளர்கள் ஒருவருக்கொருவர் இடைவெளிவிட்டு அமைந்திருந்த இடஞ்சார்ந்த நிலையைத் தெரிவிக்கிறது; பகைமை அல்லது உட்பிரிவைக் குறிப்பதில்லை.
- source_word: עַל הַחוֹמָה
  choice: மதில் நெடுகிலும்
  rationale: עַל என்பதன் அடிப்படை இடப்பொருளையும், இச்சூழலில் மதிலின் நீளம் முழுவதும் பணியாளர்கள் பகிர்ந்து நிறுத்தப்பட்டிருப்பதையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: רְחוֹקִים אִישׁ מֵאָחִיו
  choice: ஒருவரைவிட்டு ஒருவர் வெகுதொலைவில்
  rationale: ‘ஒவ்வொருவனும் தன் சகோதரனிடமிருந்து’ என்ற எபிரேய பரஸ்பர இடைவெளி மரபுத்தொடரின் பொருளை இயல்பாகத் தருகிறது.
