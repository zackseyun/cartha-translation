translation_notes:
  register: நவீனத் தரத் தமிழில் மரியாதையும் தெளிவும் கொண்ட நடை. ‘பிரபுக்கள்’ மற்றும் ‘அதிகாரிகள்’ சமூக, நிர்வாக வேறுபாட்டைக் காக்கின்றன. மூலத்தின் இடஞ்சார்ந்த வலியுறுத்தலைத் தக்கவைக்க ‘மதில் நெடுகிலும்’ பயன்படுத்தப்பட்டுள்ளது.
