source:
  edition: WLC
  text: וַ/יִּקְשְׁר֤וּ כֻלָּ/ם֙ יַחְדָּ֔ו לָ/ב֖וֹא לְ/הִלָּחֵ֣ם בִּ/ירוּשָׁלִָ֑ם וְ/לַ/עֲשׂ֥וֹת ל֖/וֹ תּוֹעָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/004/002.yaml
  text: And all of them conspired together to come and fight against Jerusalem and to cause confusion in it[a].
translation:
  language: ta
  text: அவர்கள் அனைவரும் ஒன்றுசேர்ந்து, எருசலேமுக்கு எதிராகப் போரிட வரவும் அதில் குழப்பத்தை ஏற்படுத்தவும் சதி செய்தார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அதில் சீர்குலைவை அல்லது தொந்தரவை ஏற்படுத்தவும்.” எபிரெயச் சொல் குழப்பம், கலக்கம், சீர்குலைவு அல்லது தொந்தரவு ஆகியவற்றைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְשְׁרוּ
  choice: சதித்திட்டம் தீட்டினார்கள்
  rationale: קשר என்ற வினை இச்சூழலில் பகை நோக்கத்துடன் இரகசியமாகச் சதி செய்வதைக் குறிக்கிறது. இயல்பான நவீனத் தமிழில் இந்தப் பொருளைத் தெளிவாகத் தருகிறது.
- source_word: כֻלָּם יַחְדָּו
  choice: அவர்கள் எல்லாரும் ஒன்றுகூடி
  rationale: כֻלָּם குழுவின் முழுமையையும், יַחְדָּו அவர்களின் ஒருங்கிணைந்த செயலையும் வலியுறுத்துகின்றன; இரண்டின் வலிமையும் தமிழில் பாதுகாக்கப்படுகிறது.
- source_word: לָבוֹא לְהִלָּחֵם
  choice: போரிட வரவும்
  rationale: மூலத்தில் உள்ள இயக்க வினையையும் போர் வினையையும் சுருக்காமல், தமிழின் இயல்பான வினை வரிசையில் அளிக்கிறது.
- source_word: בִּירוּשָׁלָם
  choice: எருசலேமுக்கு எதிராக
  rationale: பகைச் செயலைக் குறிக்கும் வினையுடன் בְּ இங்கே இலக்கான நகரத்திற்கு எதிரான நடவடிக்கையைச் சுட்டுகிறது.
- source_word: וְלַעֲשׂוֹת לוֹ
  choice: அதில் ... உண்டாக்கவும்
  rationale: עשה + பெயர்ச்சொல் என்பது ஒரு நிலையை ஏற்படுத்துவதைக் குறிக்கிறது; לוֹ எருசலேமைச் சுட்டுவதால் தமிழில் இடப்பொருளாக இயல்பாக மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: תּוֹעָה
  choice: குழப்பம்
  rationale: இந்த அரிய பெயர்ச்சொல் குழப்பம், சீர்குலைவு அல்லது தொந்தரவு ஆகிய பொருள் எல்லைகளைக் கொண்டது. பிரதான உரையில் பொதுவான பொருளான ‘குழப்பம்’ தரப்பட்டு, மாற்றுப் பொருட்கள் அடிக்குறிப்பில் பாதுகாக்கப்படுகின்றன.
