revisions:
- from: அவர்கள் எல்லாரும் ஒன்றுகூடி, எருசலேமுக்கு எதிராகப் போரிட வரவும், அதில் குழப்பத்தை உண்டாக்கவும்[a] சதித்திட்டம் தீட்டினார்கள்.
  to: அவர்கள் அனைவரும் ஒன்றுசேர்ந்து, எருசலேமுக்கு எதிராகப் போரிட வரவும் அதில் குழப்பத்தை ஏற்படுத்தவும் சதி செய்தார்கள்.[a]
  rationale: The revision makes only stylistic and collocational improvements. It retains the source’s totality and coordinated action, both stated aims, Jerusalem as the target and location of the intended disturbance, and the lexical ambiguity of תּוֹעָה.
  reviewer_model: gpt-5.6-terra
