translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. மூலத்தின் ஒருங்கிணைந்த சதி, வருதல், போரிடுதல் ஆகிய தனித்த கூறுகள் பாதுகாக்கப்பட்டுள்ளன; תּוֹעָה என்பதன் பொருள் பரப்பு அடிக்குறிப்பில் தரப்பட்டுள்ளது.
