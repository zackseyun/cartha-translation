base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/004/003.yaml
  text: So we prayed to our God and stationed a guard against them day and night because of them[a][b].
translation:
  language: ta
  text: ஆகவே, நாங்கள் எங்கள் கடவுளிடம் ஜெபித்தோம்; அவர்களின் காரணமாக, அவர்களுக்கு எதிராக இரவும் பகலும் காவல் ஏற்படுத்தினோம்[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அவர்களுக்கு எதிராக ஒரு காவலை நிறுத்தினோம்.’
    reason: lexical_alternative
  - marker: b
    text: சொல்லுக்குச் சொல், ‘அவர்கள் முன்னிலையிலிருந்து’; இங்கு ‘அவர்களின் காரணமாக’ அல்லது ‘அவர்களினிமித்தம்’ என்று பொருள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַנִּתְפַּלֵּל
  choice: நாங்கள் மன்றாடினோம்
  rationale: פלל என்பதன் ஹித்பயேல் வடிவம் பொதுவாக ‘மன்றாடு/வேண்டிக்கொள்’ எனப் பொருள்படும். மூலத்தில் இல்லாத தீவிரத்தைச் சேர்க்காமல், இச்சூழலில் இயல்பாக அமைவதற்காக ‘மன்றாடினோம்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: אֶל אֱלֹהֵינוּ
  choice: எங்கள் கடவுளிடம்
  rationale: אֶל என்பதன் நோக்குநிலைப் பொருளையும், אֱלֹהֵינוּ என்பதிலுள்ள முதலாம் நபர் பன்மை உடைமைப் பின்னொட்டையும் ‘எங்கள் கடவுளிடம்’ இயல்பாகப் பாதுகாக்கிறது.
- source_word: וַנַּעֲמִיד
  choice: நிறுத்தினோம்
  rationale: עמד என்பதன் ஹிஃபீல் வடிவம் ஒருவரை அல்லது ஒன்றை ஒரு நிலையில் நிறுத்துதல் அல்லது நியமித்தல் எனப் பொருள்படும்; காவல் சூழலில் ‘காவல் நிறுத்தினோம்’ என்பது தெளிவான தமிழ் வழக்கு.
- source_word: מִשְׁמָר
  choice: காவல்
  rationale: இந்தச் சொல் காவல், கண்காணிப்பு அல்லது காவற்குழுவைக் குறிக்கலாம். தமிழில் ‘காவல்’ என்பது செயலும் அதற்காக நிறுத்தப்பட்ட குழுவும் ஆகிய இரண்டையும் இயல்பாகக் குறிக்கக்கூடியதால் மூலத்தின் ஓரளவு நெகிழ்வைத் தக்கவைக்கிறது.
- source_word: עֲלֵיהֶם
  choice: அவர்களிடமிருந்து எங்களைப் பாதுகாக்க
  rationale: עַל என்பதன் அடிப்படைப் பொருள் ‘மேல்/எதிராக’ என்றாலும், பகைவர்களை முன்னிட்டு காவல் நிறுத்திய இச்சூழலில் அதன் எதிர்ப்புற நோக்கம் தமிழில் தெளிவாகத் தெரிவதற்காக இவ்வாறு வழங்கப்பட்டது; ‘அவர்களுக்கு எதிராக’ என்பது மாற்று மொழிபெயர்ப்பு.
- source_word: יוֹמָם וָלַיְלָה
  choice: இரவும் பகலும்
  rationale: இது தொடர்ச்சியான விழிப்பைக் குறிக்கும் நிலையான இணைச்சொல். இயல்பான தமிழ் வரிசையில் ‘இரவும் பகலும்’ என வழங்கப்பட்டது; இதனால் இரு காலப்பகுதிகளும் முழுமையாகப் பாதுகாக்கப்படுகின்றன.
- source_word: מִפְּנֵיהֶם
  choice: அவர்களிடமிருந்து
  rationale: சொல்லுக்குச் சொல் ‘அவர்கள் முன்னிலையிலிருந்து’ என்பதாக இருந்தாலும், இங்கு எதிரிகளால் ஏற்பட்ட அச்சுறுத்தலே காவலுக்கான காரணம். ‘அவர்களால் ஏற்பட்ட அச்சுறுத்தலின் காரணமாக’ என்ற பொருளைச் சுருக்கமாகத் தருகிறது; பயம் என்ற மனநிலையை மூலத்தை மீறிச் சேர்க்கவில்லை.
theological_decisions:
- issue: எதிர்ப்புக்கு அளிக்கப்பட்ட பதிலை மொழிபெயர்த்தல்
  choice: கடவுளிடம் மன்றாடுதலும் நடைமுறைப் பாதுகாப்பாகக் காவல் நிறுத்துதலும் இணையான இரு செயல்களாகத் தரப்பட்டுள்ளன.
  alternative: மன்றாட்டை மட்டும் வலியுறுத்துதல் அல்லது மனிதப் பாதுகாப்பு நடவடிக்கையை மட்டும் வலியுறுத்துதல்.
  rationale: எபிரெய உரை ‘மன்றாடினோம்’ மற்றும் ‘காவல் நிறுத்தினோம்’ என்ற இரு ஒருங்கிணைந்த செயல்களையும் கூறுகிறது. எந்த ஒன்றையும் மற்றொன்றுக்கு மேலாக நிறுத்தாமல், உரையிலுள்ள இறைநம்பிக்கை–நடைமுறைச் செயல்பாடு என்ற பதற்றம் பாதுகாக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. ‘மன்றாடினோம்’ வழிபாட்டு நயத்தைத் தக்கவைக்கிறது; ‘காவல் நிறுத்தினோம்’ இயல்பான நடப்பு வழக்காகும். எபிரெய வரிசை ‘பகலும் இரவும்’ என்றாலும், தமிழில் பழக்கமான ‘இரவும் பகலும்’ பயன்படுத்தப்பட்டுள்ளது.
