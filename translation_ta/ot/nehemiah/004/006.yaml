  text: And when the Jews who lived near them came and told us ten times[a], “From all the places where you turn[b], they will come up against us,”
translation:
  language: ta
  text: அவர்களருகே குடியிருந்த யூதர்கள் வந்து, “நீங்கள் எந்தத் திசையில் திரும்பினாலும், எல்லா இடங்களிலிருந்தும் அவர்கள் எங்களுக்கு எதிராக வருவார்கள்”[a] என்று பத்துமுறை எங்களிடம் சொன்னார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய வாக்கியம் பொருள் காண்பதற்குக் கடினமானது. சொற்சொல்லாக, “எல்லா இடங்களிலிருந்தும் நீங்கள் எங்களுக்கு எதிராகத் திரும்புவீர்கள்” என்றும் புரிந்துகொள்ளலாம். சூழலில் பகைவர்கள் எல்லாத் திசைகளிலிருந்தும் வருவார்கள் என்ற பொருள் பொருத்தமாக இருப்பதால், “அவர்கள் ... வருவார்கள்” என்பது தெளிவுக்காகச் சேர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר בָּאוּ
  choice: எங்களிடம் வந்து
  rationale: וַיְהִי כַּאֲשֶׁר என்பது அடுத்த நிகழ்வை காலத் தொடர்புடன் அறிமுகப்படுத்துகிறது. தனியாகச் சொற்சொல்லாக மொழிபெயர்ப்பதைவிட, தமிழில் இயல்பான தொடர்வாக்கியமாக ‘வந்து’ என்பதில் அந்தத் தொடர்பு வெளிப்படுகிறது.
- source_word: הַיְּהוּדִים
  choice: யூதர்கள்
  rationale: இங்கு இது யூத சமூகத்தைச் சுட்டுகிறது; நவீனத் தமிழில் இயல்பானதும் பரவலாகப் புரியக்கூடியதும் ‘யூதர்கள்’.
- source_word: הַיֹּשְׁבִים אֶצְלָם
  choice: அவர்களருகே குடியிருந்த
  rationale: אֵצֶל அருகாமையைக் குறிக்கிறது. பகைவர்களாகிய அண்டை மக்களின் அருகில் குடியிருந்த யூதர்கள் என்ற சூழலை இந்த மொழிபெயர்ப்பு தெளிவாகத் தருகிறது.
- source_word: וַיֹּאמְרוּ לָנוּ עֶשֶׂר פְּעָמִים
  choice: என்று பத்துமுறை சொன்னார்கள்
  rationale: எபிரெய உரையில் உள்ள துல்லியமான ‘பத்துமுறை’ என்ற எண்ணிக்கையைப் பொதுவான ‘மீண்டும் மீண்டும்’ என்று மாற்றாமல் காக்கிறது; மேற்கோளுக்குப் பின் அமைப்பது தமிழில் இயல்பாக உள்ளது.
- source_word: מִכָּל הַמְּקֹמוֹת אֲשֶׁר תָּשׁוּבוּ
  choice: நீங்கள் எந்தப் பக்கம் திரும்பினாலும்
  rationale: שׁוב வழக்கமாக ‘திரும்பு/திரும்பிவா’ என்று பொருள்படும். இச்சூழலில் எந்தத் திசையில் திரும்பினாலும் என்ற எச்சரிக்கைப் பொருள் பொருத்தமாக உள்ளது; இருப்பினும் மூலவாக்கியத்தின் கடினத்தன்மையும் மாற்றுப் பொருளும் அடிக்குறிப்பில் பாதுகாக்கப்படுகின்றன.
- source_word: עָלֵינוּ
  choice: எங்களைத் தாக்க
  rationale: עַל என்பதன் அடிப்படை உறவுப்பொருள் ‘மேல்/எதிராக’. பகைத் தாக்குதலின் சூழலில் ‘எங்களைத் தாக்க’ என்பது அதன் நோக்கிய பகைமையை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
