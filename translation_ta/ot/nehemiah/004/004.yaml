base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/004/004.yaml
  text: And Judah said[a], “The strength of the burden-bearers has failed, and there is much rubble[b], and we are not able to build the wall.”
translation:
  language: ta
  text: யூதா சொன்னது[a], “சுமை சுமப்பவர்களின் வலிமை தளர்ந்துவிட்டது; இடிபாடுகள்[b] ஏராளமாக உள்ளன; எங்களால் மதிலைக் கட்ட முடியவில்லை.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யூதா மக்கள் சொன்னார்கள்.” ஒருமையில் வரும் “யூதா” என்ற பெயர் இங்கு அந்தச் சமூகத்தைத் தொகுப்பாகக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: எபிரேயத்தில் “தூசி” அல்லது “மண்”; இச்சூழலில் இடிந்த நகரிலிருந்து குவிந்திருந்த இடிபாடுகளைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוּדָה
  choice: யூதா
  rationale: எபிரேய ஒருமை இடப்பெயர்/மக்கள் பெயர் அப்படியே வைக்கப்பட்டுள்ளது; சூழலில் இது யூதா சமூகத்தைத் தொகுப்பாகக் குறிக்கலாம்.
- source_word: כָּשַׁל
  choice: தளர்ந்துவிட்டது
  rationale: ‘தடுமாறுதல், செயலிழத்தல், வலுவிழத்தல்’ என்ற பொருள்களில், உடல் உழைப்பால் வலிமை குறைந்த நிலையை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: כֹּחַ
  choice: வலிமை
  rationale: இங்கு உடல் உழைப்புக்கான ஆற்றலைக் குறிக்கும் நேரான தமிழ் சொல்.
- source_word: הַסַּבָּל
  choice: சுமை சுமப்பவர்கள்
  rationale: எபிரேயத்தில் ஒருமை வடிவம் இருந்தாலும் அது தொகுப்புப் பொருளில் வருகிறது; தமிழில் இயல்பாகப் பன்மையில் தரப்பட்டுள்ளது.
- source_word: הֶעָפָר
  choice: இடிபாடுகள்
  rationale: சொல்லின் அடிப்படைப் பொருள் ‘தூசி/மண்’; இடிந்த நகர மதிலை மீண்டும் கட்டும் சூழலில் குவிந்துள்ள இடிபாடுகளைக் குறிக்கிறது.
- source_word: הַרְבֵּה
  choice: ஏராளமாக உள்ளன
  rationale: பொருளின் மிகுதியைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: לֹא נוּכַל
  choice: எங்களால் முடியவில்லை
  rationale: விருப்பமின்மையை அல்ல, இயலாமையைத் தெரிவிக்கிறது; சூழ்நிலையால் ஏற்பட்ட தற்போதைய முடக்கத்தை இயல்பான தமிழில் காட்டுகிறது.
- source_word: לִבְנוֹת
  choice: கட்ட
  rationale: எபிரேய வினை நேரடியாக ‘கட்டுதல்’ எனப் பொருள்படும்; சூழல் மறுகட்டுதலைக் குறித்தாலும் அதனை உரையில் வெளிப்படையாகச் சேர்க்கவில்லை.
- source_word: בַּחוֹמָה
  choice: மதிலைக்
  rationale: இலக்கு மொழியில் ‘மதிலைக் கட்ட’ என்பது இயல்பான வினைத்தொடர்; எபிரேய ב இங்கு கட்டுமானப் பணியின் பொருளைச் சுட்டுகிறது.
