revisions:
- from: அந்நாட்களில் யூதாவில் சிலர் ஓய்வுநாளில் திராட்சை ஆலைகளை மிதிப்பதையும், தானியக் குவியல்களைக் கொண்டுவந்து கழுதைகள்மேல் ஏற்றுவதையும் கண்டேன். அவர்கள் திராட்சரசம், திராட்சைப் பழங்கள், அத்திப்பழங்கள், இன்னும் எல்லாவகைச் சுமைகளையும் ஓய்வுநாளில் எருசலேமுக்குக் கொண்டுவந்தார்கள். அவர்கள் உணவுப்பொருள்களை விற்ற நாளில் நான் அவர்களை எச்சரித்தேன்.
