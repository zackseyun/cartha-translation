  text: בַּ/יָּמִ֣ים הָ/הֵ֡מָּה רָאִ֣יתִי בִֽ/יהוּדָ֣ה דֹּֽרְכִֽים גִּתּ֣וֹת בַּ/שַּׁבָּ֡ת וּ/מְבִיאִ֣ים הָ/עֲרֵמ֣וֹת וְֽ/עֹמְסִ֪ים עַל הַ/חֲמֹרִ֟ים וְ/אַף יַ֜יִן עֲנָבִ֤ים וּ/תְאֵנִים֙ וְ/כָל מַשָּׂ֔א וּ/מְבִיאִ֥ים יְרוּשָׁלִַ֖ם בְּ/י֣וֹם הַ/שַּׁבָּ֑ת וָ/אָעִ֕יד בְּ/י֖וֹם מִכְרָ֥/ם צָֽיִד׀־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/015.yaml
  text: In those days I saw in Judah people treading winepresses on the Sabbath, and bringing in heaps of grain and loading them on donkeys—and also wine, grapes, figs, and every kind of load—and bringing them into Jerusalem on the Sabbath day. So I testified against them on the day they sold food.
translation:
  language: ta
  text: அக்காலத்தில், யூதாவில் ஓய்வுநாளில் திராட்சைச் சாறு பிழியும் தொட்டிகளில் திராட்சைகளை மிதித்துக்கொண்டும், தானியக் குவியல்களைக் கொண்டுவந்து கழுதைகள்மேல் ஏற்றிக்கொண்டும், திராட்சரசம், திராட்சைகள், அத்திப்பழங்கள், எல்லாவகைச் சுமைகள் ஆகியவற்றை ஓய்வுநாளில் எருசலேமுக்குக் கொண்டுவந்துகொண்டும் இருந்தவர்களைக் கண்டேன். அவர்கள் உணவை விற்ற நாளில் அவர்களுக்கு எதிராகச் சாட்சியமளித்தேன்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: דֹּרְכִים גִּתּוֹת
  choice: திராட்சை ஆலைகளை மிதிப்பது
  rationale: திராட்சைப் பழங்களிலிருந்து சாறு பிழிவதற்காக ஆலையில் காலால் மிதிக்கும் செயலை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: הָעֲרֵמוֹת
  choice: தானியக் குவியல்கள்
  rationale: சொல் பொதுவாக ‘குவியல்கள்’ என்றாலும், அறுவடைப் பொருள்களை ஏற்றிச் செல்லும் சூழல் தானியக் குவியல்களைக் குறிக்கிறது.
- source_word: מַשָּׂא
  choice: சுமை
  rationale: எடுத்துச் செல்லப்படும் பலவகைப் பொருள்களை உள்ளடக்கும் விரிவான பொருளைத் தக்கவைக்கிறது.
- source_word: וָאָעִיד
  choice: நான் அவர்களை எச்சரித்தேன்
  rationale: இங்கு உள்ள hiphil வினைச்சொல் சாட்சியமளித்தல் வழியாகக் கடுமையாக எச்சரித்தல் அல்லது கண்டித்தல் என்ற சூழல்சார் பொருளைக் கொண்டது.
- source_word: צָיִד
  choice: உணவுப்பொருள்கள்
  rationale: வழிப்பயண உணவு, உணவு அல்லது provisions என்னும் பரப்பைக் கொண்ட சொல்லுக்கு, விற்பனைச் சூழலில் இயல்பான பொதுப்பெயர்.
theological_decisions:
- issue: ஓய்வுநாள் மீறலுக்கான நெகேமியாவின் நடவடிக்கை
  choice: எச்சரித்தேன்
  alternative: அவர்களுக்கு எதிராகச் சாட்சியமளித்தேன்
  rationale: மூலத்தின் சட்ட/உடன்படிக்கை சார்ந்த சாட்சியத் தொனி முற்றிலும் மறையாதபடி, அச்சூழலில் நிகழும் கடுமையான அறிவுறுத்தலை இயல்பான தமிழில் தருகிறது; குறிப்பிட்ட தண்டனையையோ கோட்பாட்டு விளக்கத்தையோ சேர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழ்; வரலாற்று விவரணைக்கு ஏற்ற கண்ணியமான, பொதுமக்களுக்கு எளிதில் புரியும் நடை. நீண்ட எபிரெய இணைப்புத் தொடரை இரண்டு வாக்கியங்களாகப் பிரித்தாலும், செயல்களின் வரிசையும் ஓய்வுநாள் என்ற மீளுரையும் பாதுகாக்கப்பட்டுள்ளன.
