base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/019.yaml
  text: When the gates of Jerusalem began to grow dark[a] before the Sabbath, I ordered the doors shut and commanded that they not be opened until after the Sabbath. I stationed some of my servants[b] at the gates so that no load[c] would be brought in on the Sabbath day.
translation:
  language: ta
  text: ஓய்வுநாளுக்கு முன்பு எருசலேமின் வாசல்கள் இருளத் தொடங்கியபோது[a], கதவுகளை மூடும்படி நான் கட்டளையிட்டேன்; ஓய்வுநாள் முடிந்த பிறகுவரை அவற்றைத் திறக்கக்கூடாது என்றும் ஆணையிட்டேன். ஓய்வுநாளில் எந்தச் சுமையும்[c] உள்ளே கொண்டுவரப்படாதபடி, என் பணியாளர்களில் சிலரை[b] வாசல்களில் நிறுத்தினேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘எருசலேமின் வாசல்கள்மேல் மாலை நிழல்கள் படியத் தொடங்கியபோது.’
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘என் உதவியாளர்களில் சிலரை.’ இச்சொல் நெகேமியாவின் தனிப்பட்ட பரிவாரத்தைச் சேர்ந்தவர்களைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: சுற்றியுள்ள வசனங்கள் ஓய்வுநாள் வணிகத்தைப் பற்றிப் பேசுவதால், இந்தச் ‘சுமை’ விற்பனைக்காகக் கொண்டுவரப்பட்ட பொருட்களையும் உள்ளடக்கியிருக்கலாம்.
    reason: cultural_note
lexical_decisions:
- source_word: צָלֲלוּ
  choice: இருளத் தொடங்கியபோது
  rationale: இந்த வினை மாலை இருள் அல்லது நிழல் படியத் தொடங்குவதைச் சுட்டுகிறது. ஓய்வுநாள் தொடங்குவதற்கு முந்தைய நேரத்தை இயல்பான தமிழில் தெரிவிக்கிறது; வாசல்களே இருண்டன என்ற எபிரெய உருவகத்தையும் முற்றிலும் நீக்கவில்லை.
- source_word: שַׁעֲרֵי יְרוּשָׁלִַם
  choice: எருசலேமின் வாசல்கள்
  rationale: எபிரெய இணைப்புத் தொடரைத் தெளிவாகவும் இயல்பாகவும் வழங்குகிறது.
- source_word: לִפְנֵי הַשַּׁבָּת
  choice: ஓய்வுநாளுக்கு முன்பு
  rationale: ஓய்வுநாள் தொடங்குவதற்குச் சற்றுமுந்தைய காலத்தைக் குறிக்கும் நேரடித் தமிழாக்கம்.
- source_word: וָאֹמְרָה ... וָאֹמְרָה
  choice: நான் கட்டளையிட்டேன் ... ஆணையிட்டேன்
  rationale: அடிப்படைப் பொருள் ‘சொன்னேன்’ என்றாலும், ஆளுநர் வழங்கும் நிர்வாக உத்தரவுகளாக இவை செயல்படுகின்றன. இருமுறை வரும் வினையின் கட்டளை வலிமையைத் தமிழ் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וַיִּסָּגְרוּ הַדְּלָתוֹת
  choice: கதவுகளை மூடும்படி
  rationale: வாசல்களில் பொருத்தப்பட்ட கதவுகளை மூடுவதற்கான உத்தரவைத் தெளிவாகக் காட்டுகிறது; செய்பவரை உரையில் இல்லாமல் சேர்ப்பதில்லை.
- source_word: אֲשֶׁר לֹא יִפְתָּחוּם
  choice: அவற்றைத் திறக்கக்கூடாது
  rationale: கதவுகள் திறக்கப்படுவதற்கான தடையை நேரடியாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: עַד אַחַר הַשַּׁבָּת
  choice: ஓய்வுநாள் முடியும் வரை
  rationale: ‘ஓய்வுநாளுக்குப் பின்பு வரை’ என்பதன் சூழல்சார் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: וּמִנְּעָרַי
  choice: என் பணியாளர்களில் சிலரை
  rationale: נַעַר என்பது இங்கு நெகேமியாவின் தனிப்பட்ட பரிவாரத்திலுள்ள பணியாளர்கள் அல்லது உதவியாளர்களைக் குறிக்கலாம்; வயதில் இளைஞர்கள் என்று கட்டாயப்படுத்துவதில்லை.
- source_word: הֶעֱמַדְתִּי עַל הַשְּׁעָרִים
  choice: வாசல்களில் நிறுத்தினேன்
  rationale: வாசல்களைக் காவல் காக்க அல்லது கண்காணிக்க ஆட்களை நியமித்து நிறுத்திய சூழலை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: לֹא יָבֹא מַשָּׂא
  choice: எந்தச் சுமையும் உள்ளே கொண்டுவரப்படாதபடி
  rationale: சுமை வாசல்கள் வழியாக நகருக்குள் கொண்டுவரப்படுவதைச் சூழல் உணர்த்துகிறது. ‘சுமை’ என்ற konkrete பெயர்ச்சொல்லைத் தக்கவைத்து, போக்குவரத்து நிகழ்வைத் தெளிவாக்குகிறது.
- source_word: בְּיוֹם הַשַּׁבָּת
  choice: ஓய்வுநாளில்
  rationale: எபிரெயில் உள்ள குறிப்பிட்ட வாராந்திர நாளைத் தமிழ் வழக்கில் சுருக்கமாகவும் தெளிவாகவும் வழங்குகிறது.
theological_decisions:
- issue: שַׁבָּת என்பதன் மொழிபெயர்ப்பு
  choice: ஓய்வுநாள்
  alternative: சபத்து நாள்
  rationale: இச்சொல் பொதுவான ஓய்வு நாளை அல்ல, இஸ்ரவேலின் உடன்படிக்கைச் சட்டத்திலும் நடைமுறையிலும் உள்ள வாராந்திர சபத்தைக் குறிக்கிறது. ‘ஓய்வுநாள்’ என்பது நவீன தமிழில் புரியக்கூடியதாய் இருந்து அந்த வரலாற்று-இறையியல் குறிப்பைத் தக்கவைக்கிறது.
translation_notes:
  register: நவீன செந்தமிழ் நடையில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான மொழி பயன்படுத்தப்பட்டுள்ளது. நிர்வாகச் சூழலில் וָאֹמְרָה என்பதன் நடைமுறை வலிமை ‘கட்டளையிட்டேன்/ஆணையிட்டேன்’ என வெளிப்படுத்தப்பட்டுள்ளது. எபிரெயில் மீண்டும் மீண்டும் வரும் இணைப்புச் சொற்கள் தமிழின் இயல்பான உரைநடைக்காக வெளிப்படையாகச் சேர்க்கப்படவில்லை; கருத்துத் தொடர்ச்சி காக்கப்பட்டுள்ளது.
