base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/005.yaml
  text: He made for him a large chamber[a], where formerly they had put the grain offering, the frankincense, the vessels, and the tithe of grain, new wine, and oil—the portion commanded for the Levites, the singers[d][c][b], and the gatekeepers—and the contribution for the priests.
translation:
  language: ta
  text: அவன் அவனுக்காக ஒரு பெரிய அறையை[a] அமைத்தான். அங்கே முன்பு தானியக் காணிக்கை, குங்கிலியம், பாத்திரங்கள், தானியம், புதுத் திராட்சரசம், எண்ணெய் ஆகியவற்றின் பத்திலொரு பங்கு—லேவியர்களும் பாடகர்களும் வாயிற்காவலர்களும் பெற வேண்டுமென்று கட்டளையிடப்பட்ட பங்கு[c]—ஆசாரியர்களுக்கான காணிக்கை[d] ஆகியவற்றை வைத்துவந்தார்கள்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘ஒரு பெரிய சேமிப்பு அறையை.’ எபிரெயச் சொல் ஆலய வளாகத்தில் பொருட்களைச் சேமிக்கப் பயன்படுத்தப்பட்ட அறையையும் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில் இத்தொடர், ‘அங்கே முன்பு வழக்கமாக வைத்தார்கள்’ என்ற கடந்தகால வழக்கமான செயலைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: c
    text: சொற்படியாக, ‘லேவியர்கள், பாடகர்கள், வாயிற்காவலர்கள் பற்றிய கட்டளை.’ இச்சூழலில் அவர்களுக்கென விதிக்கப்பட்ட பங்கே குறிக்கப்படுகிறது.
    reason: lexical_alternative
  - marker: d
    text: அல்லது, ‘ஆசாரியர்களுக்கான உயர்த்திப் படைக்கும் காணிக்கை.’ இச்சொல் கடவுளுக்கெனப் பிரித்துவைக்கப்பட்ட பங்களிப்பைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ לוֹ
  choice: அவன் அவனுக்காக ... அமைத்தான்
  rationale: עשה + ל என்பதன் நேரடியான பொருளைத் தக்கவைத்து, ஓர் அறையைப் பயன்பாட்டுக்குத் தயாரித்த செயலை இயல்பான தமிழில் ‘அமைத்தான்’ எனக் கூறுகிறது.
- source_word: לִשְׁכָּה גְדוֹלָה
  choice: ஒரு பெரிய அறை
  rationale: לשכה என்பது ஆலய வளாகத்திலுள்ள அறையையோ சேமிப்பு அறையையோ குறிக்கலாம். ‘அறை’ மூலத்தின் பரந்த பொருளைத் தக்கவைக்கிறது; சேமிப்புப் பயன்பாடு அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: וְשָׁם הָיוּ לְפָנִים נֹתְנִים
  choice: அங்கே முன்பு ... வைத்துவந்தார்கள்
  rationale: היה + பங்கேற்புவினை வடிவம் கடந்தகால வழக்கமான செயலைக் குறிக்கிறது. ‘வைத்துவந்தார்கள்’ அந்தத் தொடர்ச்சியான பழக்கத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: הַמִּנְחָה
  choice: தானியக் காணிக்கை
  rationale: ஆலய வழிபாட்டுச் சூழலில் מנחה என்பதன் குறிப்பான பலிப்பொருளைத் தெளிவாகத் தருகிறது.
- source_word: הַלְּבוֹנָה
  choice: குங்கிலியம்
  rationale: לבונה என்பது பலியிடுதலிலும் தூபத்திலும் பயன்படுத்தப்பட்ட frankincense-ஐக் குறிக்கிறது; ‘குங்கிலியம்’ அதற்கான புரிந்துகொள்ளத்தக்க தமிழ் பெயர்.
- source_word: הַכֵּלִים
  choice: பாத்திரங்கள்
  rationale: ஆலயப் பணியில் பயன்படுத்தப்பட்ட கருவிகள் அல்லது புனிதப் பாத்திரங்களைக் குறிக்கும் பொதுவான, இயல்பான தமிழ் சொல்.
- source_word: מַעְשַׂר
  choice: பத்திலொரு பங்கு
  rationale: מעשר என்பதன் சொற்பொருளையும் சட்டப்படி கொடுக்கப்படும் பங்கையும் தெளிவாகக் காட்டுகிறது; சமயத் தொழில்நுட்பச் சொல்லைவிட பொதுவாசகருக்கு நேரடியாகப் புரியும்.
- source_word: הַדָּגָן הַתִּירוֹשׁ וְהַיִּצְהָר
  choice: தானியம், புதுத் திராட்சரசம், எண்ணெய்
  rationale: எபிரெய வேதாகமத்தில் வழக்கமான இந்த மும்மையைத் தனித்தனியாகவும் துல்லியமாகவும் மொழிபெயர்க்கிறது; תירוש என்பதற்கு ‘புதுத் திராட்சரசம்’ எனும் குறிப்பைத் தக்கவைக்கிறது.
- source_word: מִצְוַת הַלְוִיִּם וְהַמְשֹׁרְרִים וְהַשֹּׁעֲרִים
  choice: லேவியர்களும் பாடகர்களும் வாயிற்காவலர்களும் பெற வேண்டுமென்று கட்டளையிடப்பட்ட பங்கு
  rationale: ‘கட்டளை’ என்ற எபிரெய வடிவை முற்றிலும் மறைக்காமல், பட்டியலிடப்பட்ட உணவுப் பொருட்களில் இவர்களுக்கென விதிக்கப்பட்ட பங்கே இங்கு நோக்கப்படுவதைத் தமிழில் தெளிவாக்குகிறது.
- source_word: תְרוּמַת הַכֹּהֲנִים
  choice: ஆசாரியர்களுக்கான காணிக்கை
  rationale: תרומה என்பது பிரித்துவைக்கப்பட்ட பங்களிப்பு அல்லது காணிக்கை. ‘காணிக்கை’ நவீன தமிழில் எளிதாகப் புரியும்; அதன் சடங்குசார் மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: מִצְוַת என்ற ஒருமை வடிவத்தின் தொடர்பு
  choice: மூன்று ஆலயப் பணிக்குழுக்களுக்கும் விதிக்கப்பட்ட ஒருங்கிணைந்த பங்கைச் சுட்டுவதாக மொழிபெயர்க்கப்பட்டது.
  alternative: ‘லேவியர்கள், பாடகர்கள், வாயிற்காவலர்களின் கட்டளை’ என்று சொற்படியாக மொழிபெயர்த்தல்.
  rationale: சேமிக்கப்பட்ட தசமபாகப் பொருட்களின் பட்டியல் இதை அவர்களுக்கு விதிக்கப்பட்ட அல்லது உரிய பங்காகப் புரிந்துகொள்ளச் செய்கிறது. இருப்பினும் மூலத்தின் ‘கட்டளை’ என்ற வடிவம் உரையிலும் அடிக்குறிப்பிலும் தக்கவைக்கப்படுகிறது.
- issue: תְרוּמָה என்பதன் சடங்குசார் நுட்பம்
  choice: ஆசாரியர்களுக்கான காணிக்கை
  alternative: ஆசாரியர்களுக்கான உயர்த்திப் படைக்கும் காணிக்கை
  rationale: மூலம் காணிக்கையைப் பிரித்துவைக்கும் கருத்தைத் தருகிறது; குறிப்பிட்ட சடங்குமுறையை பிரதான உரையில் மிகையாக நிர்ணயிக்காமல், பாரம்பரிய மாற்று அடிக்குறிப்பில் வழங்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகருக்குப் புரியும் வகையிலும் ஆலயச் சூழலுக்கேற்ற கண்ணியமான நடையிலும் அமைக்கப்பட்டது. ‘பத்திலொரு பங்கு’ போன்ற வெளிப்படையான சொற்றொடர்கள் தொழில்நுட்பச் சமயச் சொற்களைத் தவிர்க்கின்றன; ‘லேவியர்கள்,’ ‘ஆசாரியர்கள்,’ ‘காணிக்கை’ ஆகிய பரவலாக அறியப்பட்ட வேதாகமச் சொற்கள் தக்கவைக்கப்பட்டுள்ளன.
