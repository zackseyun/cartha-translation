  text: זָכְרָ֥/ה לָ/הֶ֖ם אֱלֹהָ֑/י עַ֚ל גָּאֳלֵ֣י הַ/כְּהֻנָּ֔ה וּ/בְרִ֥ית הַ/כְּהֻנָּ֖ה וְ/הַ/לְוִיִּֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/029.yaml
  text: Remember them[a], my God, because they have defiled the priesthood and the covenant of the priesthood and the Levites.
translation:
  language: ta
  text: என் இறைவனே, ஆசாரியத்துவத்தையும் ஆசாரியத்துவத்துக்கும் லேவியர்களுக்கும் உரிய உடன்படிக்கையையும் தீட்டுப்படுத்தியதால், அவர்களை நினைவுகூரும்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'இன்னும் சொல்லுக்குச் சொல்: “என் இறைவனே, ஆசாரியத்துவத்தையும், ஆசாரியத்துவத்தின் உடன்படிக்கையையும், லேவியர்களையும் தீட்டுப்படுத்தியவர்களை முன்னிட்டு நினைவுகூரும்.”'
    reason: எபிரெயத்தில் ‘தீட்டுப்படுத்தியவர்கள்’ என்பது பெயர்ச்சொல்லாகப் பயன்படும் பெயரெச்சம். மேலும், இறுதித் தொடர் உடன்படிக்கை ஆசாரியத்துவத்தையும் லேவியர்களையும் சார்ந்தது என இணைகிறதா, அல்லது ‘லேவியர்கள்’ தனியாக இணைகிறார்களா என்பதில் சுருக்கமான இருபொருள் வாய்ப்பு உள்ளது.
lexical_decisions:
- source_word: זָכְרָה
  choice: நினைவுகூரும்
  rationale: இது இறைவனை நோக்கிய நேரடி வேண்டுகோள். நெகேமியாவின் மன்றாட்டுகளில் வரும் ‘நினைவுகூர்’ என்ற அடிப்படைப் பொருளைத் தக்கவைக்கிறது.
- source_word: לָהֶם
  choice: அவர்களை
  rationale: לְ இணைந்த பன்மைச் சுட்டுப்பெயரை இயல்பான தமிழில் நேரடிச் செயப்படுபொருளாகத் தருகிறது; பாதகமான நீதித்தீர்ப்புச் சார்பு அடுத்த காரணவாக்கியத்தால் வெளிப்படுகிறது.
- source_word: אֱלֹהָי
  choice: என் இறைவனே
  rationale: முதலாம் நபர் ஒருமை உடைமைப் பின்னொட்டையும் நேரடி அழைப்பையும் இயல்பான, கண்ணியமான தமிழில் காட்டுகிறது.
- source_word: עַל
  choice: …தால்
  rationale: இங்கு עַל வேண்டுகோளுக்கான காரணத்தை அறிமுகப்படுத்துகிறது; தமிழில் காரணவினையெச்ச வடிவம் இயல்பாக அந்தத் தொடர்பை வெளிப்படுத்துகிறது.
- source_word: גָּאֳלֵי
  choice: தீட்டுப்படுத்தியதால்
  rationale: גאל என்பதன் ‘தீட்டுப்படுத்து/மாசுபடுத்து’ என்ற பொருளைத் தருகிறது. எபிரெயப் பெயரெச்ச வடிவத்தைத் தெளிவான தமிழ்ச் செயற்பாட்டு வாக்கியமாக மாற்றுகிறது.
- source_word: הַכְּהֻנָּה
  choice: ஆசாரியத்துவம்
  rationale: தனிப்பட்ட ஆசாரியர்களை மட்டும் அல்லாமல், ஆசாரியப் பதவி அல்லது அமைப்பைக் குறிக்கும் அருவப்பெயரைப் பாதுகாக்கிறது.
- source_word: וּבְרִית הַכְּהֻנָּה
  choice: ஆசாரியத்துவம் … உடன்படிக்கை
  rationale: உடன்படிக்கைக்கும் ஆசாரியத்துவத்திற்கும் உள்ள தொடர்பைத் தக்கவைத்து, அது ‘ஆசாரியர்களுடன் செய்யப்பட்டதா’ அல்லது ‘ஆசாரியத்துவத்தைச் சார்ந்ததா’ என்பதை அளவுக்கு மீறித் தீர்மானிக்கவில்லை.
- source_word: וְהַלְוִיִּם
  choice: மற்றும் லேவியர்களுக்குரிய
  rationale: லேவியர்களை உடன்படிக்கையுடன் இணைக்கும் சாத்தியமான தொடரமைப்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது; எபிரெயச் சுருக்கமான தொடரின் வேறு பகுப்பையும் அடிக்குறிப்பு பதிவு செய்கிறது.
theological_decisions:
- issue: இறைவன் அவர்களை நன்மையாகவா தீமையாகவா நினைவுகூர வேண்டும் என்பதன் பொருள்
  choice: அவர்களுடைய தீட்டுப்படுத்தும் செயலின் காரணமாக நீதித்தீர்ப்புக்குரிய வகையில் நினைவுகூருதல்
  alternative: தீர்ப்பின் திசையை வெளிப்படையாகக் காட்டாத நடுநிலையான ‘அவர்களை நினைவுகூரும்’
  rationale: זכר என்ற வினை தனியே நன்மையையோ தீமையையோ கட்டாயப்படுத்தாது. ஆனால் தொடர்ந்து வரும் குற்றச்சாட்டு இங்கு பாதகமான நீதிசார் சூழலை உருவாக்குகிறது. வினையை மிகைப்படுத்தாமல் காரணவாக்கியம் அந்தச் சார்பைத் தெரிவிக்கிறது.
- issue: ‘ஆசாரியத்துவத்தின் உடன்படிக்கையும் லேவியர்களும்’ என்ற தொடரின் வரம்பு
  choice: ஆசாரியத்துவத்தையும் லேவியர்களையும் சார்ந்த உடன்படிக்கை
  alternative: ஆசாரியத்துவத்தின் உடன்படிக்கையும், அதிலிருந்து தனியாக லேவியர்களும்
  rationale: எபிரெயச் சொற்றொடர் சுருக்கமானதும் ஓரளவு இருபொருள்படக்கூடியதும் ஆகும். முதன்மை உரை லேவியர்களை உடன்படிக்கையுடன் இணைக்கும் இயல்பான வாசிப்பைத் தருகிறது; மாற்று தொடரமைப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் கண்ணியமான ஜெப நடையைப் பயன்படுத்துகிறது. ‘ஆசாரியத்துவம்’, ‘உடன்படிக்கை’, ‘லேவியர்கள்’ ஆகிய நிலைபெற்ற வேதாகமச் சொற்கள் தக்கவைக்கப்பட்டுள்ளன. ‘நினைவுகூரும்’ என்பது நேரடி வேண்டுகோளுக்குரிய மரியாதை ஏவல் வடிவம்.
