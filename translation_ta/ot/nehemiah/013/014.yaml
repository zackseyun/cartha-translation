base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/014.yaml
  text: Remember me for this[a], my God[b], and do not wipe out my deeds of covenant faithfulness that I have done for the house of my God and for its services.
translation:
  language: ta
  text: என் இறைவனே, இதற்காக என்னை நினைவுகூரும்; என் இறைவனின் இல்லத்திற்காகவும் அதன் பணிகளுக்காகவும்[b] நான் செய்த பற்றுறுதிச் செயல்களை[a] துடைத்தழிக்காதிரும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “பற்றுறுதிச் செயல்கள்” என்பதற்கு “உண்மையுள்ள செயல்கள்,” “அன்புச் செயல்கள்” அல்லது “இரக்கச் செயல்கள்” என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் அன்பு, பற்றுறுதி, உடன்படிக்கை உண்மைத்தன்மை ஆகிய பொருள்களைத் தாங்கக்கூடும்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது “அதன் கடமைகளுக்காகவும்” அல்லது “அதன் பொறுப்புகளுக்காகவும்”; இது இறைவனின் இல்லத்தோடு தொடர்புடைய ஒழுங்குபடுத்தப்பட்ட பொறுப்புகளைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: זָכְרָה לִּי
  choice: என்னை நினைவுகூரும்
  rationale: இறைவனை நோக்கிய வேண்டுதலாக உள்ள எபிரெயச் சொற்றொடரை, மரியாதையும் இயல்பும் கொண்ட தமிழ் ஏவல் வடிவில் தருகிறது.
- source_word: אֱלֹהַי
  choice: என் இறைவனே
  rationale: முதலாம் நபர் ஒருமை உடைமை விகுதியையும் நேரடி அழைப்பையும் தெளிவாகத் தக்கவைக்கிறது.
- source_word: עַל זֹאת
  choice: இதற்காக
  rationale: முன்பு விவரிக்கப்பட்ட செயலைச் சுட்டும் காரண அல்லது தொடர்புப் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: וְאַל תֶּמַח
  choice: அழித்துவிடாதிரும்
  rationale: பதிவிலிருந்தோ நினைவிலிருந்தோ துடைத்தழிக்கும் מחה என்ற உருவகத்தின் வலிமையைத் தக்கவைக்கிறது.
- source_word: חֲסָדַי
  choice: நான் செய்த பற்றுறுதியான செயல்கள்
  rationale: חסד என்பதிலுள்ள அன்பு, விசுவாசம், உறுதியான பற்று ஆகிய பொருள் வாய்ப்புகளில், இங்கு செயல்களைக் குறிக்கும் பன்மையையும் ஆலயத்திற்கான பற்றையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: בְּבֵית אֱלֹהַי
  choice: என் இறைவனின் இல்லத்திற்காக
  rationale: בְ என்பதன் இடம் அல்லது தொடர்புப் பொருள் இச்சூழலில் இறைவனின் இல்லத்தின் நலனுக்காகச் செய்யப்பட்ட செயல்களைக் குறிக்கிறது.
- source_word: וּבְמִשְׁמָרָיו
  choice: அதன் பணிகளுக்காகவும்
  rationale: மִשְׁמָרָיו என்பது இறைவனின் இல்லத்தோடு தொடர்புடைய பொறுப்புகள், கடமைகள் அல்லது ஒழுங்குபடுத்தப்பட்ட பணிகளைக் குறிக்கிறது.
theological_decisions:
- issue: חֲסָדַי என்ற சொல்லை நெகேமியா தமது செயல்களைப் பற்றிக் கூறும் விதம்
  choice: நான் செய்த பற்றுறுதியான செயல்கள்
  alternative: என் நற்செயல்கள்; நான் காட்டிய இரக்கங்கள்
  rationale: எபிரெயச் சொல்லின் பற்றுறுதி சார்ந்த செறிவைத் தக்கவைத்து, இதை இறைவனுக்கு முன் புண்ணியம் கோரும் கோட்பாடாக மாற்றாமல், ஆலயத்திற்காகச் செய்த உண்மையுள்ள செயல்களாக வழங்குகிறது.
- issue: தம்மை நினைவுகூருமாறு இறைவனிடம் நேரடியாக வேண்டுதல்
  choice: வேண்டுதலின் நேரடியான தன்மையை மென்மைப்படுத்தாமல் தக்கவைத்தல்
  alternative: தம்மைப் பற்றிய குறிப்பைக் குறைக்கும் விளக்கமொழியாக்கம்
  rationale: நெகேமியா தாம் செய்தவற்றின் அடிப்படையில் இறைவன் தம்மை நினைவுகூர வேண்டுமென நேரடியாகக் கேட்கும் மூலமொழியின் இறையியல் அழுத்தத்தையும் பதற்றத்தையும் மொழிபெயர்ப்பு மறைக்கக்கூடாது.
translation_notes:
  register: நவீன தரநிலைத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் ஜெபத்திற்குரிய கண்ணியத்துடனும் மொழியாக்கப்பட்டுள்ளது. “இறைவனே,” “நினைவுகூரும்,” “அழித்துவிடாதிரும்” ஆகிய மரியாதை வடிவங்கள் நேரடி வேண்டுதலின் தொனியைப் பாதுகாக்கின்றன.
