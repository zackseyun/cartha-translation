  text: בַּ/יּ֣וֹם הַ/ה֗וּא נִקְרָ֛א בְּ/סֵ֥פֶר מֹשֶׁ֖ה בְּ/אָזְנֵ֣י הָ/עָ֑ם וְ/נִמְצָא֙ כָּת֣וּב בּ֔/וֹ אֲ֠שֶׁר לֹא יָב֨וֹא עַמֹּנִ֧י וּ/מֹאָבִ֛י בִּ/קְהַ֥ל הָ/אֱלֹהִ֖ים עַד עוֹלָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/001.yaml
  text: On that day the Book of Moses was read in the hearing of the people[c][b][a], and it was found written in it that no Ammonite or Moabite should ever enter the assembly of God.
translation:
  language: ta
  text: அந்த நாளில், மக்கள் கேட்கும்படி மோசேயின் நூல்[a] வாசிக்கப்பட்டது. அதில், அம்மோனியரோ மோவாபியரோ கடவுளின் கூட்டத்தில்[b] என்றென்றும்[c] சேரக்கூடாது என்று எழுதப்பட்டிருப்பது கண்டறியப்பட்டது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மோசேயின் சுருள்.” எபிரெயச் சொல் நூலையோ சுருளையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “கடவுளின் சபை.”
    reason: lexical_alternative
  - marker: c
    text: அதாவது, “எல்லாக் காலத்திற்கும்” அல்லது “ஒருபோதும்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הַהוּא
  choice: அந்த நாளில்
  rationale: குறிப்பிட்ட ஒரு நாளைக் குறிக்கும் எபிரெய காலச் சொற்றொடரின் இயல்பான, நேரடியான தமிழ் வடிவம்.
- source_word: נִקְרָא ... בְּאָזְנֵי הָעָם
  choice: மக்கள் கேட்க வாசிக்கப்பட்டது
  rationale: நִקְרָא என்பதன் செயப்பாட்டு வடிவத்தையும், ‘மக்களின் காதுகளில்’ என்ற எபிரெய மரபுத்தொடர் குறிக்கும் பொது வாசிப்பையும் இயல்பான தமிழில் தருகிறது; மூலத்தில் தனியே இல்லாத ‘சத்தமாக’ என்ற சொல்லைச் சேர்க்கவில்லை.
- source_word: בְּסֵפֶר מֹשֶׁה
  choice: மோசேயின் நூல்
  rationale: סֵפֶר என்பது நூல் அல்லது சுருள் எனப் பொருள்படலாம். முதன்மை உரையில் ‘நூல்’ தெளிவாகவும் இயல்பாகவும் உள்ளது; ‘சுருள்’ அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: וְנִמְצָא כָּתוּב בּוֹ
  choice: அதில் ... எழுதப்பட்டிருப்பது கண்டறியப்பட்டது
  rationale: எபிரெய உரையின் செயப்பாட்டு அமைப்பையும், மோசேயின் நூலைச் சுட்டும் ‘அதில்’ என்பதையும் காக்கிறது.
- source_word: עַמֹּנִי וּמֹאָבִי
  choice: அம்மோனியனோ மோவாபியனோ
  rationale: எதிர்மறை விதியின் கீழ் இரு இனத்தவரில் எவரும் அனுமதிக்கப்படவில்லை என்ற பகிர்ந்தளிக்கும் பொருளை தமிழின் ‘-ஓ ... -ஓ’ அமைப்பு தெளிவாக வெளிப்படுத்துகிறது.
- source_word: בִּקְהַל הָאֱלֹהִים
  choice: கடவுளின் சபையில்
  rationale: קָהָל குறிக்கும் கூடிய சமூகத்தை ‘சபை’ சுருக்கமாகவும் மரியாதையான நடையிலும் தருகிறது; பிற்காலத் திருச்சபை சார்ந்த குறிப்பிட்ட பொருளை உரைக்குள் திணிக்கவில்லை.
- source_word: עַד עוֹלָם
  choice: என்றென்றும்
  rationale: இந்தச் சட்டவிதியில் உள்ள நீடித்த விலக்கின் வலிமையை நேரடியாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: אֲשֶׁר לֹא יָבוֹא
  choice: சேரக்கூடாது என்று
  rationale: சபைக்குள் ‘வருதல்’ என்பது அதன் உறுப்பினர் சமூகத்தில் சேர்வதைக் குறிக்கும் சூழலில், ‘சேரக்கூடாது’ சட்டத் தடையை நவீன தமிழில் தெளிவாகக் கூறுகிறது.
theological_decisions:
- issue: בִּקְהַל הָאֱלֹהִים என்பதன் பொருள்
  choice: கடவுளின் சபையில்
  alternative: கடவுளின் கூட்டத்தில் / கடவுளின் மக்கள் சமூகத்தில்
  rationale: எபிரெயச் சொற்றொடரின் இறை உரிமைத் தொடர்பையும் கூடிய உடன்படிக்கைச் சமூகத்தையும் காக்கிறது; ‘திருச்சபை’ போன்ற பிற்காலத் தனிச்சொல்லைத் தவிர்க்கிறது.
- issue: עַד עוֹלָם என்ற சட்ட விலக்கின் கால வலிமை
  choice: என்றென்றும்
  alternative: எல்லாக் காலத்திற்கும் / ஒருபோதும்
  rationale: மூலத்தின் நீடித்த விலக்கை மெலிதாக்காமல் தருகிறது; அதன் பயன்பாட்டு அல்லது இறையியல் எல்லைகளை மொழிபெயர்ப்பே தனியாகத் தீர்மானிப்பதில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் மரியாதையான நடை பயன்படுத்தப்பட்டுள்ளது. எபிரெயச் செயப்பாட்டு அமைப்பு இயன்றவரை காக்கப்பட்டு, ‘மக்களின் காதுகளில்’ என்ற சொற்படி வடிவம் இயல்பான ‘மக்கள் கேட்க’ என மொழியாக்கப்பட்டுள்ளது. எல்லா அடிக்குறிப்பு குறிகளும் உரிய சொற்களுக்குப் பின் முதன்மை உரையில் இடம்பெற்றுள்ளன.
