  text: וְ/לָ/כֶ֣ם הֲ/נִשְׁמַ֗ע לַ/עֲשֹׂת֙ אֵ֣ת כָּל הָ/רָעָ֤ה הַ/גְּדוֹלָה֙ הַ/זֹּ֔את לִ/מְעֹ֖ל בֵּֽ/אלֹהֵ֑י/נוּ לְ/הֹשִׁ֖יב נָשִׁ֥ים נָכְרִיּֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/027.yaml
  text: Should we then listen to you and do all this great evil[b][a], acting unfaithfully against our God by marrying foreign women?
translation:
  language: ta
  text: அப்படியானால், அந்நியப் பெண்களை மணந்துகொள்வதன் மூலம்[b] நம் கடவுளுக்கு உண்மையற்றவர்களாக நடந்து, இந்தப் பெருந்தீமையெல்லாம் செய்வதற்கு நாங்கள் உங்களுக்கு இணங்க வேண்டுமா?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘உங்களுக்குக் கீழ்ப்படிய வேண்டுமா?’ என்றும் மொழிபெயர்க்கலாம். எபிரெய வினைச்சொல் ஒருவருக்குச் செவிகொடுப்பதையோ அவருக்கு இணங்கி நடப்பதையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: சொற்படி, ‘அந்நியப் பெண்களைக் குடியிருக்கச் செய்தல்.’ இச்சூழலில் அவர்களை மனைவிகளாக ஏற்றுக்கொள்வதைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲנִשְׁמַע ... וְלָכֶם
  choice: நாங்கள் உங்களுக்கு இணங்க வேண்டுமா?
  rationale: שׁמע என்பதன் நிபால் வடிவம் இங்கு ஒருவருக்குச் செவிகொடுத்து அதன்படி நடப்பது என்ற பொருளில் வரும் சொல்லாட்சியாகப் புரிந்துகொள்ளப்படுகிறது. ‘இணங்க’ என்பது நவீனத் தமிழில் செவிகொடுத்தல் மற்றும் கீழ்ப்படிதல் ஆகிய இரு நுண்பொருள்களையும் இயல்பாகத் தாங்குகிறது; கேள்வியின் கண்டனத் தொனியும் காக்கப்படுகிறது.
- source_word: לַעֲשֹׂת אֵת כָּל הָרָעָה הַגְּדוֹלָה הַזֹּאת
  choice: இந்தப் பெருந்தீமையெல்லாம் செய்வதற்கு
  rationale: עשה என்பதற்கு நேரான ‘செய்’ பயன்படுத்தப்பட்டுள்ளது. כָּל என்பதன் முழுமையாக்கும் வலிமையை ‘எல்லாம்’ காக்கிறது; הָרָעָה הַגְּדוֹלָה என்பது கடுமையான ஒழுக்கக்கேட்டைச் சுட்டுவதால் ‘பெருந்தீமை’ என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: לִמְעֹל בֵּאלֹהֵינוּ
  choice: நம் கடவுளுக்கு உண்மையற்றவர்களாக நடந்து
  rationale: מעל என்பது நம்பிக்கையையோ உறவுக்குரிய விசுவாசத்தையோ மீறுவதைக் குறிக்கிறது. ‘உண்மையற்றவர்களாக நடந்து’ என்பது உடன்படிக்கைச் சார்ந்த துரோகத்தின் கனத்தைத் தக்கவைத்தாலும், தேவையற்ற தொழில்நுட்பச் சொல்லைச் சேர்ப்பதில்லை.
- source_word: לְהֹשִׁיב נָשִׁים נָכְרִיּוֹת
  choice: அந்நியப் பெண்களை மணந்துகொள்வதன் மூலம்
  rationale: ישׁב என்பதன் ஹிபீல் வடிவம் சொற்பட ‘குடியிருக்கச் செய்தல்’ என்றாலும், இச்சூழலில் பெண்களைத் தம் குடும்பங்களில் மனைவிகளாக ஏற்றுக்கொள்வதைக் குறிக்கிறது. ‘மணந்துகொள்வது’ இயல்பான தமிழில் சூழல்சார் பொருளைத் தெளிவாக அளிக்கிறது; சொற்பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: לִמְעֹל בֵּאלֹהֵינוּ என்பதில் குறிக்கப்படும் குற்றத்தின் தன்மை
  choice: நம் கடவுளுக்கு உண்மையற்றவர்களாக நடத்தல்
  alternative: கடவுளுக்கு எதிரான பொதுவான தீச்செயல்; சடங்குசார் குற்றம்
  rationale: מעל வழக்கமாக நம்பிக்கை மீறுதலையும் துரோகத்தையும், குறிப்பாக கடவுளுடனான உறவின் சூழலில், குறிக்கிறது. ஆகவே மொழிபெயர்ப்பு அதன் உறவுசார் மற்றும் உடன்படிக்கைச் சார்ந்த கனத்தைப் பாதுகாக்கிறது; அதேவேளையில் அதைச் சடங்குசார் குற்றமாக மட்டும் குறுக்குவதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கண்டனத் தொனி பயன்படுத்தப்பட்டுள்ளது. ‘அப்படியானால்’ முந்தைய வாதத்துடனான தொடர்ச்சியை வெளிப்படுத்துகிறது. ‘பெருந்தீமையெல்லாம்’ என்பது כָּל மற்றும் ‘பெரிய தீமை’ ஆகியவற்றை இயல்பான தமிழில் ஒன்றிணைக்கிறது. மூலத்தின் வினாவடிவமும் சமூகத்தை நோக்கிய பன்மைச் சுட்டும் காக்கப்பட்டுள்ளன.
