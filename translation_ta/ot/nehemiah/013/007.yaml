  to: நான் எருசலேமுக்கு வந்தபோது, எலியாசீப் தோபியாவுக்காகச் செய்த தீமையை உணர்ந்தேன்; அதாவது, தேவனுடைய ஆலயத்தின்[b] முற்றங்களில் தோபியாவுக்காக ஓர் அறையை[a] எலியாசீப் ஏற்படுத்தியிருந்தார்.
