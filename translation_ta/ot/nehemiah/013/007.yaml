base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/007.yaml
  text: When I came to Jerusalem[b][a], I understood the evil that Eliashib had done for Tobiah by making a chamber for him in the courts of the house of God.
translation:
  language: ta
  text: நான் எருசலேமுக்கு வந்தபோது, எலியாசீப் தோபியாவுக்காகச் செய்த தீமையை உணர்ந்தேன்; அதாவது, தேவனுடைய ஆலயத்தின்[b] முற்றங்களில் தோபியாவுக்காக ஓர் அறையை[a] எலியாசீப் ஏற்படுத்தியிருந்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அறை’ என்பதற்கான எபிரெயச் சொல், ஆலய வளாகத்திலுள்ள ஓர் அறையையோ கூடத்தையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘தேவனுடைய ஆலயம்’ என்பது எபிரெயத்தில் சொல்லடியாக ‘தேவனுடைய வீடு’; இங்கு அது ஆலயத்தைக் குறிக்கிறது.
    reason: cultural_note
lexical_decisions:
- source_word: וָאָבוֹא לִירוּשָׁלִָם
  choice: நான் எருசலேமுக்கு வந்தபோது
  rationale: தொடர்நிகழ்வைக் குறிக்கும் எபிரெய வினை வடிவத்தைச் சூழலுக்கேற்ற காலத் தொடர்பாக இயல்பான தமிழில் வழங்குகிறது.
- source_word: וָאָבִינָה
  choice: உணர்ந்தேன்
  rationale: בין என்பதன் புரிந்துகொள்ளுதல் அல்லது உணர்தல் என்ற அறிவுசார் பொருளைப் பேணுகிறது.
- source_word: בָרָעָה
  choice: தீமையை
  rationale: இச்சொல்லிலுள்ள ஒழுக்கத் தீர்ப்பின் வலிமையை மென்மைப்படுத்தாமல் தருகிறது.
- source_word: אֲשֶׁר עָשָׂה אֶלְיָשִׁיב לְטוֹבִיָּה
  choice: எலியாசீப் தோபியாவுக்காகச் செய்த
  rationale: தோபியாவின் நலனுக்காக எலியாசீப் செயல்பட்டார் என்பதை לְ இயல்பாகக் காட்டுகிறது.
- source_word: לַעֲשׂוֹת לוֹ נִשְׁכָּה
  choice: அவர் தோபியாவுக்காக ... ஓர் அறையை அமைத்திருந்தார்
  rationale: தீமையான செயல் எதில் அடங்கியது என்பதைத் தெளிவாக்குகிறது; נִשְׁכָּה என்பதைக் குறிப்பிட்ட பயன்பாட்டைத் திணிக்காமல் பொதுவான ‘அறை’ என்று வழங்குகிறது.
- source_word: בְּחַצְרֵי
  choice: முற்றங்களில்
  rationale: חָצֵר என்பதன் பன்மையையும் ஆலய வளாகத்தின் திறந்த முற்றங்களையும் இயல்பாகக் குறிக்கிறது.
- source_word: בֵּית הָאֱלֹהִים
  choice: தேவனுடைய ஆலயம்
  rationale: சொல்லடியாக ‘தேவனுடைய வீடு’ என்றாலும், இச்சூழலில் குறிக்கப்படுவது ஆலயம் என்பதால் நவீனத் தமிழில் நேரடியாகவும் தெளிவாகவும் வழங்கப்படுகிறது.
theological_decisions:
- issue: எலியாசீப்பின் செயலுக்கான ஒழுக்க மதிப்பீடு
  choice: רָעָה என்பதை ‘தீமை’ என்று வழங்குதல்
  alternative: ‘தவறு’ அல்லது ‘கேடு’
  rationale: ஆலயப் பரிசுத்தத்துக்கு எதிரான செயலை நெகேமியா ஒழுக்கரீதியாகத் தீமை என மதிப்பிடும் வலிமையை இது பேணுகிறது; கூடுதல் கோட்பாட்டு விளக்கம் சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. மூலத்தின் ஒழுக்க வலிமை பேணப்பட்டுள்ளது; ‘அறை’ என்பதன் பயன்பாடு தேவையின்றி ‘களஞ்சிய அறை’ எனக் குறிப்பாக்கப்படவில்லை.
