base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/028.yaml
  text: And one of the sons of Joiada son of Eliashib the high priest was a son-in-law of Sanballat the Horonite[b][a], so I drove him away from me.
translation:
  language: ta
  text: தலைமை ஆசாரியனாகிய எலியாசிபின் மகன் யோயாதாவின் மகன்களில் ஒருவன் ஓரோனியனாகிய சன்பல்லாத்தின் மருமகனாக இருந்தான்[a]. எனவே, நான் அவனை என்னிடமிருந்து துரத்திவிட்டேன்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, விரிவான பொருளில், “சன்பல்லாத்துடன் திருமண உறவுடையவனாக இருந்தான்.” எபிரெயச் சொல் திருமணத்தின் மூலம் ஏற்பட்ட உறவைக் குறிக்கலாம்; இச்சூழலில் “மருமகன்” என்பதே மிகவும் குறிப்பான இயல்பான வாசிப்பு.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அவனை விரட்டியடித்தேன்” அல்லது “அவனை வெளியேற்றினேன்.” எபிரெய வினைச்சொல் வலுக்கட்டாயமாக அகற்றுவதை வலியுறுத்துகிறது; அது எந்த நிர்வாக முறையில் செய்யப்பட்டது என்பது குறிப்பிடப்படவில்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִבְּנֵי
  choice: மகன்களில் ஒருவன்
  rationale: מִן உடன் வரும் பன்மைச் சொல் பகுதியைக் குறிக்கிறது; இயல்பான தமிழில் ‘மகன்களில் ஒருவன்’ என்பது அந்தப் பொருளைத் தெளிவாகத் தருகிறது.
- source_word: יוֹיָדָע
  choice: யோயாதா
  rationale: எபிரெயப் பெயரின் ஒலிவடிவத்தை நவீனத் தமிழில் இயல்பாக எழுத்துப்பெயர்த்துள்ளது.
- source_word: בֶּן אֶלְיָשִׁיב
  choice: எலியாசிபின் மகன்
  rationale: தந்தை-மகன் மரபுத் தொடர்பை நேரடியாகவும் தெளிவாகவும் தருகிறது.
- source_word: הַכֹּהֵן הַגָּדוֹל
  choice: தலைமை ஆசாரியன்
  rationale: இஸ்ரவேலின் முதன்மை ஆசாரியப் பதவியைக் குறிக்கும் நிலைபெற்ற, புரிந்துகொள்ளத்தக்க தமிழ்ச் சொற்றொடர்.
- source_word: חָתָן לְסַנְבַלַּט
  choice: சன்பல்லாத்தின் மருமகனாக இருந்தான்
  rationale: חָתָן இச்சூழலில் திருமண உறவைக் குறிக்கிறது; குறிப்பாக ‘மருமகன்’ என்பது மிகவும் இயல்பான வாசிப்பு. தமிழில் ‘மருமகன்’ சில வேறு உறவுகளையும் குறிக்கக்கூடும் என்பதால் மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: הַחֹרֹנִי
  choice: ஓரோனியன்
  rationale: இடம் அல்லது இனச் சார்பைக் குறிக்கும் அடையாளப் பெயரை எபிரெய ஒலிவடிவத்திற்கு அண்மையாக எழுத்துப்பெயர்த்துள்ளது.
- source_word: וָאַבְרִיחֵהוּ
  choice: எனவே, நான் அவனை ... துரத்திவிட்டேன்
  rationale: ברח என்பதன் ஹிஃபில் வடிவம் ஒருவனை ஓடச்செய்தல் அல்லது வலுக்கட்டாயமாக அகற்றுதல் என்னும் பொருளைக் கொண்டது. ‘துரத்திவிட்டேன்’ அந்த வலிமையைத் தருகிறது; முறையான சட்டநாடுகடத்தலை அவசியம் உணர்த்துவதில்லை.
- source_word: מֵעָלָי
  choice: என்னிடமிருந்து
  rationale: சொல்லுக்கு நெருக்கமாக ‘என் மேலிருந்து’ என்றாலும், இங்கு நேகேமியாவின் முன்னிலையிலிருந்தோ அதிகார வட்டத்திலிருந்தோ அகற்றியதைக் குறிக்கும் இயல்பான தமிழ் வடிவம் ‘என்னிடமிருந்து’.
