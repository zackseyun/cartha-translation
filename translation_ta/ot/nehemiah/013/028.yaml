translation_notes:
  register: நவீன நிலையான தமிழில், வரலாற்று உரைக்கு ஏற்ற கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. வம்சத் தொடர் தெளிவாக வைக்கப்பட்டுள்ளது. ‘ஆசாரியன்’ என்பது பரவலாக அறியப்பட்ட வேதாகமப் பதவிச்சொல்லாகவும், ‘தலைமை’ என்பது הַגָּדוֹל என்பதன் பதவிசார் பொருளை இயல்பாகவும் தருகிறது. அடிக்குறிப்பு குறிகள் தொடர்புடைய சொற்றொடர்களுக்குப் பின் [a], [b] என முதன்மை உரையில் இடம்பெற்றுள்ளன.
