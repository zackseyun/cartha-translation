base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/013.yaml
  text: And I appointed over the storerooms Shelemiah the priest[a], Zadok the scribe, and Pedaiah from the Levites, and Hanan son of Zaccur, son of Mattaniah, at their side, because they were considered faithful[c][b]; and it was upon them to distribute to their brothers.
translation:
  language: ta
  text: சேமிப்பு அறைகளுக்குப் பொறுப்பாளர்களாக ஆசாரியனாகிய செலேமியா, எழுத்தராகிய சாதோக்கு, லேவியர்களில் ஒருவனாகிய பெதாயா, அவர்களுக்குப் பக்கத்தில்[a] மத்தனியாவின் மகனான சக்கூரின் மகன் ஆனான் ஆகியோரை நியமித்தேன். அவர்கள் நம்பிக்கைக்குரியவர்கள் என்று கருதப்பட்டதால்[b], தங்கள் சகோதரர்களுக்குப்[c] பங்கிட்டுக் கொடுக்கும் பொறுப்பு அவர்களுக்கிருந்தது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'வேறொரு மொழிபெயர்ப்பு: “அவர்களுடைய வழிநடத்துதலின் கீழ்.” எபிரெய மரபுத்தொடர் நெருங்கிய உடனுழைப்பையோ கீழ்நிலைப் பணியையோ குறிக்கலாம்.'
    reason: lexical_alternative
  - marker: b
    text: 'வேறொரு மொழிபெயர்ப்பு: “அவர்கள் உண்மையுள்ளவர்கள் என்று மதிக்கப்பட்டதால்.”'
    reason: lexical_alternative
  - marker: c
    text: “சகோதரர்கள்” என்பது எபிரெய மொழியிலுள்ள ஆண்பால் சொல்லை மொழிபெயர்க்கிறது; இங்கு அது அவர்களுடன் சேர்ந்த சமூக உறுப்பினர்களைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֹצְרָה עַל אֹצָרוֹת
  choice: சேமிப்பு அறைகளுக்குப் பொறுப்பாளர்களாக ... நியமித்தேன்
  rationale: அரசாண்மை சார்ந்த நியமிப்பையும், தசமபாகங்களும் பொருட்களும் வைக்கப்பட்டிருந்த அறைகளையும் சூழலுக்கேற்ற இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: שֶׁלֶמְיָה הַכֹּהֵן
  choice: ஆசாரியனாகிய செலேமியா
  rationale: பெயர் ஒலிபெயர்க்கப்பட்டு, பணிப்பெயர் தெளிவாக மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: צָדוֹק הַסּוֹפֵר
  choice: எழுத்தராகிய சாதோக்கு
  rationale: סֹפֵר என்பதன் எழுத்தர் அல்லது நிர்வாகப் பதிவாளர் என்ற பரந்த பொருளை, தேவையற்ற சிறப்பாக்கமின்றி காக்கிறது.
- source_word: וּפְדָיָה מִן הַלְוִיִּם
  choice: லேவியர்களில் ஒருவனாகிய பெதாயா
  rationale: ‘லேவியர்களிலிருந்து’ என்ற குழு உறுப்பினர் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: וְעַל יָדָם
  choice: அவர்களுக்குப் பக்கத்தில்
  rationale: இந்த எபிரெய மரபுத்தொடர் நெருங்கிய உடனுழைப்பையோ அவர்களது வழிநடத்துதலின் கீழான பணியையோ குறிக்கலாம்; முதன்மை உரை படிநிலையைத் தீர்மானிக்காமல் தொடர்பை மட்டும் காக்கிறது.
- source_word: כִּי נֶאֱמָנִים נֶחְשָׁבוּ
  choice: அவர்கள் நம்பிக்கைக்குரியவர்கள் என்று கருதப்பட்டதால்
  rationale: அவர்களுடைய நம்பகத்தன்மையையும், அது பிறரால் மதிப்பிடப்பட்ட நிலை என்பதையும் இரண்டையும் காக்கிறது.
- source_word: וַעֲלֵיהֶם לַחֲלֹק
  choice: உரிய பங்குகளைப் பகிர்ந்தளிக்கும் பொறுப்பு அவர்களிடம் ஒப்படைக்கப்பட்டது
  rationale: מעליהם குறிக்கும் ஒப்படைக்கப்பட்ட பொறுப்பையும், חלק குறிக்கும் பங்கீட்டையும் இயல்பான நிர்வாகத் தமிழில் தருகிறது.
- source_word: לַאֲחֵיהֶם
  choice: தங்கள் சகோதரர்களுக்கு
  rationale: மூலத்திலுள்ள ஆண்பால் பன்மை உறவுமுறைச் சொல்லை அப்படியே காக்கிறது; அதன் சூழல்சார் விரிவான குறிப்பு அடிக்குறிப்பில் விளக்கப்படுகிறது.
theological_decisions:
- issue: אֲחֵיהֶם என்ற ஆண்பால் உறவுமுறைச் சொல்லின் குறிப்பு
  choice: தங்கள் சகோதரர்களுக்கு
  alternative: தங்கள் சக பணியாளர்களுக்கு / தங்கள் சமூகத்தாருக்கு
  rationale: மூலம் ஆண்பால் பன்மை உறவுமுறைச் சொல்லையே பயன்படுத்துகிறது. அதன் குறிப்பு சமூகத்தில் உடன் பணியாற்றியவர்களை உள்ளடக்கக்கூடும் என்றாலும், மொழிபெயர்ப்பில் அதை பாலினநடுநிலையாக்காமல் மூல வடிவத்தைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், வழிபாட்டு மற்றும் நிர்வாகச் சூழலுக்கேற்ற கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. ‘ஆசாரியன்’, ‘லேவியர்’ போன்ற நிலைபெற்ற வேதாகமச் சொற்கள் வைக்கப்பட்டுள்ளன; பழமையான வாக்கிய அமைப்பு தவிர்க்கப்பட்டுள்ளது.
