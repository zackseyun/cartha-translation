  text: Also Tyrians lived in it[a], bringing in fish and every kind of merchandise[b], and selling them on the Sabbath to the sons of Judah, and in Jerusalem.
translation:
  language: ta
  text: தீரு நகரத்தாரும் அதில் குடியிருந்து, மீன்களையும் எல்லா வகையான விற்பனைப் பொருட்களையும் கொண்டுவந்து, ஓய்வுநாளில் யூதாவின் மகன்களுக்கு[a] எருசலேமிலும்[b] அவற்றை விற்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யூதா மக்களுக்கு” அல்லது “யூதர்களுக்கு.” எபிரெயத்தில் சொற்பட “யூதாவின் மகன்களுக்கு” என்று உள்ளது.
    reason: lexical_alternative
  - marker: b
    text: இறுதியில் வரும் “எருசலேமிலும்” என்பதை வலியுறுத்தலாக, “எருசலேமில்கூட” என்றும் புரிந்துகொள்ளலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַצֹּרִים
  choice: தீரு நகரத்தாரும்
  rationale: தீரைச் சேர்ந்த மக்களைக் குறிக்கிறது; וְ தொடர்ச்சியைத் தருவதால் ‘உம்’ பயன்படுத்தப்பட்டது.
- source_word: יָשְׁבוּ בָהּ
  choice: அதில் குடியிருந்து
  rationale: ישׁב இங்கு நகரத்தில் வாழ்வதைச் சுட்டுகிறது; பெண்பால் பின்னொட்டு சூழலில் எருசலேமை நோக்குகிறது.
- source_word: מְבִיאִים דָּאג וְכָל מֶכֶר
  choice: மீன்களையும் எல்லா வகையான விற்பனைப் பொருட்களையும் கொண்டுவந்து
  rationale: דָּאג சந்தைச் சூழலில் மீன்களையும், מֶכֶר விற்பனைக்கான சரக்குகளையும் குறிக்கின்றன.
- source_word: וּמֹכְרִים
  choice: அவற்றை விற்றார்கள்
  rationale: பங்கேற்பு வடிவம் தொடர்ச்சியான வணிகச் செயலை விவரிக்கிறது; ‘அவற்றை’ என்பது முன் சொல்லப்பட்ட பொருட்களை இயல்பாகச் சுட்டுகிறது.
- source_word: בַּשַּׁבָּת
  choice: ஓய்வுநாளில்
  rationale: குறிப்பிட்ட சபத் நாளைக் குறிக்கும் வழக்கமான, புரியக்கூடிய தமிழ் வடிவம்.
- source_word: לִבְנֵי יְהוּדָה
  choice: யூதாவின் மக்களுக்கு
  rationale: எபிரெயத்தில் சொற்பட ‘யூதாவின் மகன்கள்’; இங்கு யூதா மக்கள்தொகையைச் சுட்டும் மரபுத்தொடராக இருப்பதால் இயல்பான கூட்டுப்பொருள் தரப்பட்டது.
- source_word: וּבִירוּשָׁלִָם
  choice: எருசலேமிலும்
  rationale: எபிரெய இணைப்பை அப்படியே காக்கிறது; ‘எருசலேமில்கூட’ என்ற வலியுறுத்தலும் சாத்தியம்.
