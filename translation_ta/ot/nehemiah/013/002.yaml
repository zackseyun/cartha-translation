  text: כִּ֣י לֹ֧א קִדְּמ֛וּ אֶת בְּנֵ֥י יִשְׂרָאֵ֖ל בַּ/לֶּ֣חֶם וּ/בַ/מָּ֑יִם וַ/יִּשְׂכֹּ֨ר עָלָ֤י/ו אֶת בִּלְעָם֙ לְ/קַֽלְל֔/וֹ וַ/יַּהֲפֹ֧ךְ אֱלֹהֵ֛י/נוּ הַ/קְּלָלָ֖ה לִ/בְרָכָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/002.yaml
  text: because they did not meet the sons of Israel with bread and water[a], and hired Balaam against them to curse them, but our God turned the curse into a blessing.
translation:
  language: ta
  text: ஏனெனில், அவர்கள் அப்பமும் தண்ணீரும் கொண்டு இஸ்ரவேல் மக்களைச் சந்திக்கச் செல்லவில்லை; அவனைச் சபிப்பதற்காக அவனுக்கு எதிராகப் பிலேயாமைக் கூலிக்கு அமர்த்தினான்[a]. ஆனால் நம் கடவுள் அந்தச் சாபத்தை ஆசீர்வாதமாக மாற்றினார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரேயத்தில், ‘கூலிக்கு அமர்த்தினான்,’ ‘அவனுக்கு எதிராக,’ ‘அவனைச் சபிக்க’ என மூன்றும் ஒருமையில் உள்ளன. ‘அவன்’ என்பது இஸ்ரவேலை ஒரு கூட்டுத்தொகை ஒருமையாகக் குறிக்கலாம்; ‘அமர்த்தினான்’ என்பதன் குறிப்பிடப்படாத எழுவாய் வரலாற்றுப் பின்னணியிலுள்ள பாலாக்காக இருக்கக்கூடும்.
    reason: மூல உரையிலுள்ள ஒருமை வினை மற்றும் இரு ஒருமைப் பின்னொட்டுகளையும், அவற்றின் குறிப்பு பற்றிய தெளிவின்மையைத் தீர்மானிக்காமல் பாதுகாக்கிறது.
lexical_decisions:
- source_word: קִדְּמוּ
  choice: எதிர்கொண்டு வரவேற்கவில்லை
  rationale: இச்சூழலில் קדמ என்பது ஒருவரை எதிர்கொண்டு சென்று ஏற்றுக்கொள்வதைக் குறிக்கிறது. ‘எதிர்கொண்டு வரவேற்கவில்லை’ என்பது செயலைத் தெளிவாகக் காட்டுவதோடு, அடுத்து வரும் அப்பமும் தண்ணீரும் என்ற சொற்றொடருக்கும் இயல்பாகப் பொருந்துகிறது.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்கள்
  rationale: எபிரெய மொழியில் சொற்படியாக ‘இஸ்ரவேலின் மகன்கள்’ என்றாலும், நவீனத் தமிழில் அது ஆண்களை மட்டும் குறிக்கக்கூடும். இங்கு முழு உடன்படிக்கை மக்களையும் குறிக்கும் கூட்டுப்பெயராக ‘இஸ்ரவேல் மக்கள்’ தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: בַּלֶּחֶם וּבַמָּיִם
  choice: அப்பத்தோடும் தண்ணீரோடும்
  rationale: மூலத்தில் குறிப்பிடப்பட்டுள்ள அடிப்படை உணவுப் பொருட்களைப் பொதுமைப்படுத்தாமல் நேரடியாகப் பாதுகாக்கிறது; உபாகமம் 23:4 உடனான சொல் தொடர்பையும் தக்கவைக்கிறது.
- source_word: וַיִּשְׂכֹּר עָלָיו אֶת־בִּלְעָם
  choice: அவர்களுக்கு எதிராக பிலேயாமைக் கூலிக்கு அமர்த்தினார்கள்
  rationale: ‘கூலிக்கு அமர்த்து’ என்பது שׂכר என்பதன் பொருளை இயல்பான தமிழில் தருகிறது. மசோரெட்டிக் உரையின் வினை வடிவம் எழுத்தில் ஒருமையாகத் தோன்றினாலும், இங்கு அம்மோன்–மோவாப் பற்றிய கூட்டுக் குற்றச்சாட்டையும் பழைய நிகழ்வின் பாலாகையும் பின்னணியாகக் கொண்டுள்ளது; தமிழ் முதன்மை உரையில் முன் வரும் பன்மை எழுவாயோடு இயல்பாக அமைக்கப்பட்டுள்ளது, உருரூபச் சிக்கல் அடிக்குறிப்பில் வெளிப்படுத்தப்படுகிறது.
- source_word: לְקַלְלוֹ
  choice: அவர்களைச் சபிப்பதற்காக
  rationale: எபிரெய பின்னொட்டு ஒருமையானது; ஆனால் இஸ்ரவேலை ஒரு கூட்டுத்தொகை ஒருமையாகக் குறிக்கிறது. தமிழில் நோக்கப்பட்ட மக்களைக் குறிக்கப் பன்மை தெளிவாக உள்ளது; ஒருமை வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: וַיַּהֲפֹךְ אֱלֹהֵינוּ הַקְּלָלָה לִבְרָכָה
  choice: நம் கடவுள் அந்தச் சாபத்தை ஆசீர்வாதமாக மாற்றினார்
  rationale: ‘மாற்றினார்’ என்பது சாபம் ஆசீர்வாதமாக ஆன மாற்றத்தை நேரடியாகத் தெரிவிக்கிறது. אֱלֹהֵינוּ என்பதிலுள்ள முதலாம் நபர் பன்மை உடைமை ‘நம்’ எனப் பாதுகாக்கப்பட்டுள்ளது.
theological_decisions:
- issue: இஸ்ரவேலுக்கான பாலின வடிவமுடைய உடன்படிக்கைப் பெயர்
  choice: இஸ்ரவேல் மக்கள்
  alternative: இஸ்ரவேலின் மகன்கள்
  rationale: בְּנֵי יִשְׂרָאֵל சொற்படியாக ‘இஸ்ரவேலின் மகன்கள்’ என்றாலும், இச்சூழலில் முழு மக்கள்தொகையையும் குறிக்கிறது. தமிழில் ‘மகன்கள்’ ஆண்களை மட்டும் குறிக்கும் தவறான எண்ணத்தை உருவாக்கலாம்; ‘மக்கள்’ கூட்டுப்பொருளைத் துல்லியமாக வழங்குகிறது.
- issue: சாப வாக்கியத்தில் கூட்டுத்தொகை ஒருமை
  choice: அவர்களைச் சபிப்பதற்காக
  alternative: அவனைச் சபிப்பதற்காக
  rationale: לְקַלְלוֹ என்பதில் ஒருமைப் பின்னொட்டு இருந்தாலும் அதன் குறிப்பு கூட்டுத்தொகையான இஸ்ரவேல். இயல்பான தமிழுக்காகப் பன்மை பயன்படுத்தப்பட்டு, மூல ஒருமை அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
- issue: பிலேயாமைக் கூலிக்கு அமர்த்திய வினையின் எண்ணும் எழுவாயும்
  choice: அமர்த்தினார்கள்
  alternative: அமர்த்தினான்
  rationale: மசோரெட்டிக் எழுத்துரு וַיִּשְׂכֹּר ஒருமையாக வாசிக்கப்படலாம்; வரலாற்றுப் பின்னணியில் பாலாக் அதற்குரிய எழுவாயாக இருக்கலாம். ஆனால் இவ்வசனத்தின் உடனடி தொடரில் வெளிப்படையான தனிப்பட்ட எழுவாய் இல்லை; அம்மோன்–மோவாப் பற்றிய பன்மைக் குறிப்பைத் தொடர்ந்து தமிழ் வாக்கியம் பன்மையில் அமைக்கப்பட்டுள்ளது. ambiguity அடிக்குறிப்பில் வைக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. ‘அப்பம்’, ‘சாபம்’, ‘ஆசீர்வாதம்’ ஆகிய பரவலாக அறியப்பட்ட வேதாகமச் சொற்கள் தக்கவைக்கப்பட்டுள்ளன; மூலத்தின் எண்ணியல் மாறுபாடு பிரதான உரையைச் சிக்கலாக்காமல் அடிக்குறிப்பில் வெளிப்படையாகக் கொடுக்கப்பட்டுள்ளது.
