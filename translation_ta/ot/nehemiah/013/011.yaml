base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/011.yaml
  text: So I contended with the officials and said[b][a], “Why has the house of God been neglected?” Then I gathered them and stationed them at their posts.
translation:
  language: ta
  text: நான் அதிகாரிகளுடன் வாதிட்டு, “தேவனுடைய இல்லம் ஏன் புறக்கணிக்கப்பட்டுள்ளது?[a]” என்று சொன்னேன். பின்னர் அவர்களை ஒன்றுகூட்டி, அவர்களுடைய பணியிடங்களில் நிறுத்தினேன்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தேவனுடைய இல்லம் ஏன் கைவிடப்பட்டது?” எபிரெய வினைச்சொல் கைவிடப்படுவதையோ கவனிக்கப்படாமல் விடப்படுவதையோ குறிக்கலாம். இங்கு ஆலயப் பணியும் அதற்கான ஆதரவும் பேணப்படாத சூழலால் “புறக்கணிக்கப்பட்டுள்ளது” என்று மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
  - marker: b
    text: சொல்லுக்கு சொல், “அவர்களை அவர்களுடைய இடத்தில் நிறுத்தினேன்.” இது லேவியர்களையும் தொடர்புடைய ஆலயப் பணியாளர்களையும் அவர்களுக்கு ஒதுக்கப்பட்ட கடமைகளில் மீண்டும் அமர்த்துவதைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאָרִיבָה
  choice: நான் அதிகாரிகளுடன் வாதிட்டு
  rationale: ריב என்பதன் எதிர்த்து வாதிடும் வலிமையைத் தக்கவைக்கிறது; வெறும் கடிந்துகொள்ளுதல் என்று குறுக்கவில்லை.
- source_word: הַסְּגָנִים
  choice: அதிகாரிகள்
  rationale: நிர்வாகப் பொறுப்பிலிருந்த துணைத் தலைவர்களைக் குறிக்கும் சொல்லுக்கு நவீனத் தமிழில் தெளிவான பொதுப்பெயர்.
- source_word: וָאֹמְרָה
  choice: என்று கேட்டேன்
  rationale: மூலத்தில் பொதுவாக ‘சொன்னேன்’ என்றாலும், தொடர்ந்து வரும் நேரடிக் கேள்வியால் தமிழில் ‘கேட்டேன்’ என்பது இயல்பாக உள்ளது.
- source_word: נֶעֱזַב
  choice: புறக்கணிக்கப்பட்டது
  rationale: עזב என்பதன் ‘கைவிடப்படுதல்/கவனிக்கப்படாமல் விடப்படுதல்’ என்ற பொருள்களில், ஆலயப் பணியும் ஆதரவும் பேணப்படாத சூழலுக்கு ‘புறக்கணிக்கப்பட்டது’ பொருந்துகிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: בֵּית הָאֱלֹהִים
  choice: தேவனுடைய இல்லம்
  rationale: எபிரெயச் சொற்றொடரின் உருவகத்தையும் சமய முக்கியத்துவத்தையும் நேரடியாகப் பாதுகாக்கிறது.
- source_word: וָאֶקְבְּצֵם
  choice: அவர்களை ஒன்றுகூட்டி
  rationale: קבץ என்பதன் ஒன்று சேர்த்தல் என்ற அடிப்படைப் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: וָאַעֲמִדֵם עַל עָמְדָם
  choice: அவரவருடைய பணியிடங்களில் நிறுத்தினேன்
  rationale: அவர்களை அவர்களுக்கு ஒதுக்கப்பட்ட நிலைகளிலும் கடமைகளிலும் மீண்டும் அமர்த்திய செயற்பாட்டுப் பொருளை வெளிப்படுத்துகிறது; சொற்சார்ந்த மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
