  naturalness: '''ஒவ்வொருவருக்கும் அவரவர் பணி'' என்பது தலைப்புபோன்ற துண்டுச் சொற்றொடராக ஒலிக்கிறது; நீள்கோட்டுக்குப் பின்னரும் வாக்கியத்தை இயல்பாக நிறைவு செய்யவில்லை. ''ஒவ்வொருவரும் தத்தம் பணியைச் செய்யும்படி'' என்பது நவீன நிலையான தமிழில் இயல்பாகவும் தெளிவாகவும் உள்ளது.'
  terminology: '''ஆசாரியர்கள்,'' ''லேவியர்கள்,'' மற்றும் ''தூய்மைப்படுத்தினேன்'' ஆகியவை ஏற்றவை. מִשְׁמָרוֹת என்பதற்கு ''பணிப்பிரிவுகள்'' என்பது ''பணிமுறைகள்'' என்பதைக் காட்டிலும் பொறுப்புகள்/சேவை ஒதுக்கீடுகள் என்ற பொருளைத் தெளிவாகக் காட்டுகிறது. அடிக்குறிப்பில் ''காவல் முறைகள்'' என்பதற்குப் பதிலாக ''காவல் பணிகள்'' அல்லது ''காவல் பிரிவுகள்'' இயல்பானது.'
