base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/030.yaml
  text: So I cleansed them from everything foreign[a], and I assigned duties for the priests and for the Levites, each in his work,
translation:
  language: ta
  text: அவ்வாறு, அந்நியமான எல்லாவற்றிலிருந்தும் அவர்களைத் தூய்மைப்படுத்தினேன். ஆசாரியர்களுக்கும் லேவியர்களுக்கும், ஒவ்வொருவரும் தத்தம் பணியைச் செய்யும்படி, பணிப்பிரிவுகளை[a] ஏற்படுத்தினேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “பணிப்பிரிவுகள்” என்பதற்கு “காவல் பணிகள்” அல்லது “பணி ஒதுக்கீடுகள்” என்றும் மொழிபெயர்க்கலாம்.
    reason: מִשְׁמָרוֹת என்பது காவல், சேவைப் பொறுப்பு, அல்லது ஒழுங்குபடுத்தப்பட்ட பணி ஒதுக்கீடு என்பதைக் குறிக்கலாம்.
lexical_decisions:
- source_word: וְטִהַרְתִּים
  choice: அவ்வாறு ... அவர்களைத் தூய்மைப்படுத்தினேன்
  rationale: பியேல் வடிவிலுள்ள טהר, தூய்மைப்படுத்துதல் அல்லது சுத்திகரித்தல் எனப் பொருள்படும். “தூய்மைப்படுத்தினேன்” என்பது சீர்திருத்தச் சூழலுக்கும் தமிழின் இயல்பான நடைக்கும் பொருந்துகிறது. தொடக்க இணைப்பை முந்தைய செயல்களின் விளைவைக் காட்டும் “அவ்வாறு” என வழங்கியுள்ளோம்.
- source_word: מִכָּל נֵכָר
  choice: அந்நியமான எல்லாவற்றிலிருந்தும்
  rationale: נֵכָר என்பது அந்நியமானது அல்லது வேற்றுமையானது எனும் பரந்த பொருளைக் கொண்டது. அதை அந்நிய மக்கள் அல்லது அந்நியப் பெண்கள் என்று குறுக்காமல், எபிரெய மொழியின் பரப்பை இச்சொற்றொடர் காக்கிறது.
- source_word: וָאַעֲמִידָה
  choice: ஏற்படுத்தினேன்
  rationale: עמד என்பதன் ஹிஃபில் வடிவம் இங்கு ஒன்றை ஒழுங்காக நிறுவுதல் அல்லது அமைத்தல் என்ற நிர்வாகப் பொருளில் வருகிறது. பணிமுறைகளோடு “ஏற்படுத்தினேன்” இயல்பாக இணைகிறது.
- source_word: מִשְׁמָרוֹת
  choice: பணிமுறைகளை
  rationale: இச்சொல் காவல் முறைகள், பணிப்பிரிவுகள், பொறுப்புகள் அல்லது ஒழுங்குபடுத்தப்பட்ட பணிகள் என்பவற்றைக் குறிக்கலாம். ஆசாரியர் மற்றும் லேவியர் பணிச் சூழலில் “பணிமுறைகள்” தெளிவாகவும் பரந்த பொருளைக் காக்கும் வகையிலும் உள்ளது; பிற சாத்தியங்கள் அடிக்குறிப்பில் தரப்பட்டுள்ளன.
- source_word: לַכֹּהֲנִים וְלַלְוִיִּם
  choice: ஆசாரியர்களுக்கும் லேவியர்களுக்கும்
  rationale: எபிரெயத்தில் இரு குழுக்களுக்கும் தனித்தனியாக வரும் முன்னிடைச்சொல், தமிழில் இரண்டிலும் “-க்கும்” என வெளிப்படுத்தப்பட்டு இணை அமைப்பு காக்கப்படுகிறது.
- source_word: אִישׁ בִּמְלַאכְתּוֹ
  choice: ஒவ்வொருவருக்கும் அவரவர் பணி
  rationale: אִישׁ இங்கு குழுவிலுள்ள ஒவ்வொருவரையும் பகிர்ந்தளிக்கும் விதத்தில் குறிக்கிறது. “அவரவர்” என்ற தமிழ்ச் சொல் அந்தப் பகிர்ந்தளிப்பு வலிமையை இயல்பாகக் காட்டுகிறது; מְלָאכָה என்பதன் பணி/வேலை என்ற பொருளும் காக்கப்படுகிறது.
theological_decisions:
- issue: “அவர்களை” என்பதன் குறிப்பு மற்றும் “அந்நியமான எல்லாவற்றிலிருந்தும்” என்பதன் வரம்பு
  choice: தொடர்புடைய சமூகத்தை அந்நியமான அனைத்திலிருந்தும் தூய்மைப்படுத்தியதாகப் பொதுவாக மொழிபெயர்த்தல்
  alternative: அந்நியர்கள் அனைவரிடமிருந்தும் அவர்களைத் தூய்மைப்படுத்தினேன்; அந்நியப் பெண்கள் அனைவரிடமிருந்தும் ஆசாரியர்களையும் லேவியர்களையும் தூய்மைப்படுத்தினேன்
  rationale: உடனடிச் சூழல் கலப்புத் திருமணங்களையும் ஆசாரிய சமரசத்தையும் பற்றியதாக இருந்தாலும், இவ்வசனத்தின் எபிரெயச் சொற்கள் அவற்றில் ஒன்றை மட்டும் வெளிப்படையாகக் குறிப்பிடவில்லை. ஆகவே இனத்தையோ குறிப்பிட்ட உறவையோ மொழிபெயர்ப்பில் சேர்க்காமல் மூலத்தின் பரப்பும் தெளிவின்மையும் பாதுகாக்கப்படுகின்றன.
- issue: אִישׁ என்பதன் பகிர்ந்தளிப்பு ஆண்பால் வடிவம்
  choice: ஒவ்வொருவருக்கும் அவரவர் பணி
  alternative: ஒவ்வொரு ஆணும் தன் பணியில்
  rationale: இங்கு இலக்கண ஆண்பால் தனிப்பட்ட ஆண்மையை வலியுறுத்தாமல், ஆசாரியர் மற்றும் லேவியர் குழுக்களில் ஒவ்வொருவருக்கும் உரிய பணியைப் பகிர்ந்தளிக்கிறது. “ஒவ்வொருவருக்கும் அவரவர்” என்பது அந்தப் பொருளை இயல்பான நவீனத் தமிழில் துல்லியமாக வெளிப்படுத்துகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் எளிதில் புரியும், ஆனால் வேதாகம வெளியீட்டிற்கு ஏற்ற கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. “அந்நியமான எல்லாவற்றிலிருந்தும்” என்ற சற்றே திறந்த சொற்றொடர் மூலத்தின் பொருள் பரப்பை வேண்டுமென்றே காக்கிறது. இறுதி பகுதி தமிழில் இயல்பாகவும் பகிர்ந்தளிப்பு உணர்வு தெளிவாகவும் இருக்க முற்றுப்புள்ளி மற்றும் நீள்கோடு கொண்டு அமைக்கப்பட்டுள்ளது.
