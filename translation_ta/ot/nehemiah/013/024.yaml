translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகருக்குப் புரியும் கண்ணியமான நடையைப் பயன்படுத்துகிறது. ‘அஸ்தோத்திய மொழி’ மற்றும் ‘யூதாவின் மொழி’ என்பவை மூலத்தின் இன-புவியியல் மொழிப்பெயர்களைக் காக்கின்றன; ‘எபிரெய மொழி’ எனத் தீர்மானிப்பதைத் தவிர்க்கின்றன. இறுதித் தொடரின் சாத்தியமான நேரடி வாசிப்பு அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
