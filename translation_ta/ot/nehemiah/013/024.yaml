base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/024.yaml
  text: And half of their children spoke Ashdodite[a], and they were not able to speak Judean, but only the language of one people or another.
translation:
  language: ta
  text: அவர்களுடைய பிள்ளைகளில் பாதிப்பேர் அஸ்தோத்திய மொழி[a] பேசினார்கள்; யூதாவின் மொழியைப் பேச அவர்களுக்குத் தெரியவில்லை; ஆனால் ஒவ்வொரு மக்களினத்தின் மொழிப்படியே பேசினார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்களுடைய பிள்ளைகளில் பாதிப்பேர் அஸ்தோத்திய மொழி பேசினார்கள்; யூதாவின் மொழியைப் பேசத் தெரியாமல், ஒவ்வொரு மக்களினத்தின் மொழிப்படி [பேசினார்கள்].”
    reason: இறுதி எபிரெயத் தொடரை ‘ஒவ்வொரு மக்களினத்தின் மொழிப்படி’ என நேரடியாக மொழிபெயர்க்கலாம்; அது முந்திய ‘தெரியவில்லை’ தொடரோடு நெருக்கமாக இணையும் சாத்தியமும் உள்ளது.
lexical_decisions:
- source_word: וּבְנֵיהֶם
  choice: அவர்களுடைய பிள்ளைகள்
  rationale: בנים என்பது குறுகிய பொருளில் ‘மகன்கள்’ எனலாம்; கலப்புத் திருமணக் குடும்பங்களின் சந்ததியைக் குறிக்கும் இச்சூழலில் ‘பிள்ளைகள்’ இயல்பாகவும் பாலினப் பொதுமையுடனும் உள்ளது.
- source_word: חֲצִי
  choice: பாதிப்பேர்
  rationale: பிள்ளைகளில் ஒரு பாதியினரைச் சுட்டுவதால், ஆட்களைக் கணக்கிடும் இயல்பான தமிழ்ச் சொல்லாக ‘பாதிப்பேர்’ பயன்படுத்தப்பட்டது.
- source_word: מְדַבֵּר
  choice: பேசினார்கள்
  rationale: எபிரெயப் பங்கேற்புவினை இவர்களின் வழக்கமான பேச்சுநிலையைக் குறிக்கிறது; கதைச் சூழலில் இறந்தகாலத் தமிழ் இயல்பாக உள்ளது.
- source_word: אַשְׁדּוֹדִית
  choice: அஸ்தோத்திய மொழி
  rationale: பெண்பால் இனப்பெயர் இங்கு அஸ்தோத்துடன் தொடர்புடைய மொழியைக் குறிக்கிறது; வெறும் இன அடைமொழியைவிட ‘மொழி’ என வெளிப்படுத்துவது தமிழில் தெளிவு.
- source_word: וְאֵינָם מַכִּירִים
  choice: அவர்களுக்குத் தெரியவில்லை
  rationale: הכיר + வினையெச்ச அமைப்பு ஒரு செயலைச் செய்யத் தேவையான அறிவு அல்லது நடைமுறைத் திறன் இல்லாமையைக் குறிக்கிறது. ‘பேசத் தெரியவில்லை’ என்பது இயல்பான தமிழில் இரண்டையும் தாங்குகிறது.
- source_word: לְדַבֵּר יְהוּדִית
  choice: யூதாவின் மொழியைப் பேச
  rationale: יְהוּדִית என்பது யூதா அல்லது யூதேயரின் மொழியைக் குறிக்கிறது. மூலத்தில் வெளிப்படையாக இல்லாத ‘எபிரெயம்’ என்பதைச் சேர்க்காமல், புவியியல்-இனச் சுட்டை பாதுகாக்கிறது.
- source_word: וְכִלְשׁוֹן עַם וָעָם
  choice: ஒவ்வொரு பிற இனத்தாரின் மொழிகளில் ஒன்றையே
  rationale: עם ועם என்ற பகிர்வுப் பயன்பாடு பல்வேறு மக்களினங்களின் மொழிகளைச் சுட்டுகிறது. முன் கூறிய யூதாவின் மொழிக்கு மாறாக அவர்கள் அந்தப் பிற மொழிகளில் ஏதோ ஒன்றைப் பேசினார்கள் என்ற கருத்தை இயல்பான தமிழில் தருகிறது.
