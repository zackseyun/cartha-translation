  text: וּ/לְ/קֻרְבַּ֧ן הָ/עֵצִ֛ים בְּ/עִתִּ֥ים מְזֻמָּנ֖וֹת וְ/לַ/בִּכּוּרִ֑ים זָכְרָ/ה לִּ֥/י אֱלֹהַ֖/י לְ/טוֹבָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/031.yaml
  text: And for the offering of wood at appointed times[a], and for the firstfruits—remember me, my God, for good.
translation:
  language: ta
  text: குறிக்கப்பட்ட காலங்களில் விறகுக் காணிக்கைக்காகவும் முதற்பலன்களுக்காகவும். என் இறைவனே, நன்மைக்காக என்னை நினைவுகூரும்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קֻרְבַּן הָעֵצִים
  choice: விறகுக் காணிக்கை
  rationale: ஆலயப் பயன்பாட்டிற்காக, குறிப்பாக பலிபீடத்திற்காக, நிர்ணயிக்கப்பட்ட வேளைகளில் கொண்டுவரப்பட்ட விறகைச் சுட்டுகிறது. ‘விறகு’ என்பது சூழலை இயல்பாகத் தெளிவாக்குகிறது; ‘காணிக்கை’ வழிபாட்டுச் சார்ந்த கருத்தைப் பேணுகிறது.
- source_word: בְּעִתִּים מְזֻמָּנוֹת
  choice: குறிக்கப்பட்ட காலங்களில்
  rationale: முன்கூட்டியே நிர்ணயிக்கப்பட்ட அல்லது ஒதுக்கப்பட்ட காலங்களைக் குறிக்கிறது; நவீன தமிழில் தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: בִּכּוּרִים
  choice: முதற்பலன்கள்
  rationale: விளைச்சலில் முதலில் கிடைத்தவற்றை இறைவனுக்குச் செலுத்தும் வழிபாட்டு நடைமுறையைச் சுருக்கமாகக் குறிக்கும் நிலையான தமிழ் சொல்.
- source_word: זָכְרָה לִּי
  choice: என்னை நினைவுகூரும்
  rationale: நெகேமியாவின் தொடர்ச்சியான வேண்டுதல் முறையை நேரடியாகப் பேணுகிறது; இது வெறும் மனநினைவு அல்ல, சாதகமாகக் கவனிக்க வேண்டிய கோரிக்கையாகச் சூழலில் அமைகிறது.
- source_word: אֱלֹהַי
  choice: என் இறைவனே
  rationale: தனிப்பட்ட அழைப்பையும் வேண்டுதல் நடையையும் இயல்பான, கண்ணியமான தமிழில் வெளிப்படுத்துகிறது.
- source_word: לְטוֹבָה
  choice: எனக்கு நன்மை உண்டாகும்படி
  rationale: எபிரெயச் சொற்றொடரின் சாதகமான விளைவு என்ற பொருளைப் பேணுகிறது; அந்த நன்மையின் தன்மையை அளவுக்கு மீறி விளக்கவில்லை.
theological_decisions:
- issue: קֻרְבַּן הָעֵצִים என்ற வழிபாட்டுச் சொற்றொடர்
  choice: விறகுக் காணிக்கை
  alternative: விறகுக்கான காணிக்கை
  rationale: இது பொதுவான மரக்கொடை அல்ல; ஆலயத்தின் பலிபீடத் தேவைக்காக அட்டவணைப்படி வழங்கப்பட்ட விறகைக் குறிக்கிறது. சுருக்கமான கூட்டுச்சொல் அந்த வழிபாட்டுச் சூழலைப் பேணுகிறது.
- issue: לְטוֹבָה என்ற இறுதி வேண்டுதல்
  choice: எனக்கு நன்மை உண்டாகும்படி
  alternative: நன்மைக்காக / எனக்குச் சாதகமாக
  rationale: இறைவனின் நினைவுகூரல் நெகேமியாவுக்கு நன்மையாக அமைய வேண்டும் என்ற வேண்டுதலை வெளிப்படுத்துகிறது; அது ஒப்புதல், ஆசீர்வாதம், அல்லது வேறு சாதகமான விளைவு எனத் தனியாகத் தீர்மானிக்காமல் மூலத்தின் இறையியல் திறந்தநிலையைப் பேணுகிறது.
- issue: பெயர்ச்சொல் தொடர்களை நிறைவு வாக்கியமாக வழங்குதல்
  choice: ஏற்பாடுகள் செய்தேன் என்று பொருளை வெளிப்படையாக வழங்குதல்
  alternative: விறகுக் காணிக்கைக்காகவும் முதற்பலன்களுக்காகவும்
  rationale: எபிரெய வசனம் முந்தைய செயல்களின் பட்டியலைத் தொடரும் துண்டுவாக்கிய அமைப்பைக் கொண்டது. தனித்து வாசிக்கப்படும் தமிழில் பொருள் நிறைவதற்காக முந்தைய சூழலில் உள்ள ‘ஏற்பாடு செய்தல்’ என்ற செயல் வெளிப்படுத்தப்பட்டுள்ளது; புதிய இறையியல் கருத்து சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில் கண்ணியமான வேண்டுதல் நடை பயன்படுத்தப்பட்டுள்ளது. தனித்து நிற்கும் வசனமாக வாசிக்கத் தெளிவளிக்க, முந்தைய சூழலில் இருந்து புரியும் ‘ஏற்பாடுகள் செய்தேன்’ என்பது வெளிப்படுத்தப்பட்டுள்ளது. ‘என் இறைவனே’ என்பது தனிப்பட்ட அழைப்பை இயல்பாகக் காட்டுகிறது; ‘நன்மை’ என்பதன் துல்லிய இயல்பு விளக்கப்படாமல் மூலத்தின் திறந்தநிலை பேணப்பட்டுள்ளது.
