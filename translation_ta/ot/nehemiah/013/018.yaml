  text: הֲ/ל֨וֹא כֹ֤ה עָשׂוּ֙ אֲבֹ֣תֵי/כֶ֔ם וַ/יָּבֵ֨א אֱלֹהֵ֜י/נוּ עָלֵ֗י/נוּ אֵ֚ת כָּל הָ/רָעָ֣ה הַ/זֹּ֔את וְ/עַ֖ל הָ/עִ֣יר הַ/זֹּ֑את וְ/אַתֶּ֞ם מוֹסִיפִ֤ים חָרוֹן֙ עַל יִשְׂרָאֵ֔ל לְ/חַלֵּ֖ל אֶת הַ/שַּׁבָּֽת־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/018.yaml
  text: Did not your fathers do this[a], and our God brought all this evil on us and on this city? Yet you are adding wrath against Israel by profaning the Sabbath.
translation:
  language: ta
  text: “உங்கள் தந்தையர் இப்படிச் செய்தார்கள் அல்லவா? நம் கடவுள் இந்தப் பேரிடரையெல்லாம் நம்மேலும் இந்த நகரத்தின்மேலும் கொண்டு வந்தார் அல்லவா? ஆனால், நீங்கள் ஓய்வுநாளின் புனிதத்தைக் குலைத்து, இஸ்ரயேல்மேல் கடுங்கோபத்தை மேலும் கூட்டுகிறீர்கள்.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֲלוֹא כֹה עָשׂוּ
  choice: இப்படிச் செய்தார்கள் அல்லவா?
  rationale: הֲלוֹא எதிர்பார்க்கப்படும் ஒப்புதலைக் கோரும் வினாவைக் குறிக்கிறது; כֹה עָשׂוּ என்பதற்கு இயல்பான நவீனத் தமிழ் ‘இப்படிச் செய்தார்கள்’ ஆகும்.
- source_word: אֲבֹתֵיכֶם
  choice: உங்கள் முன்னோர்கள்
  rationale: இங்கு முந்தைய தலைமுறையினரைக் குறிக்கும் பொருளை நவீன வாசகர்களுக்குத் தெளிவாகத் தருகிறது; ‘தந்தையர்’ என்ற சொல்லைவிட சூழலுக்கேற்ற இயல்பான வடிவம்.
- source_word: וַיָּבֵא אֱלֹהֵינוּ
  choice: நம் கடவுள் ... வரச்செய்தார்
  rationale: בוא வினையின் ஹிஃபீல் வடிவிலுள்ள காரணவினைப் பொருளைப் பாதுகாத்து, தெய்வீக நியாயத்தீர்ப்பை மென்மைப்படுத்தாமல் கூறுகிறது.
- source_word: אֵת כָּל הָרָעָה הַזֹּאת
  choice: இந்தத் தீங்கையெல்லாம்
  rationale: רָעָה என்பதன் பரந்த பொருளைத் தக்கவைக்கிறது; இச்சூழலில் அது பாவத்திற்கான தண்டனையாக வந்த பேரிடர் அல்லது கேடைக் குறிக்கலாம்.
- source_word: מוֹסִיפִים חָרוֹן עַל יִשְׂרָאֵל
  choice: இஸ்ரயேல்மேல் கடுங்கோபத்தை இன்னும் அதிகரிக்கிறீர்கள்
  rationale: பங்கேற்புவினை ongoing செயலைக் காட்டுவதால் ‘இன்னும் அதிகரிக்கிறீர்கள்’ என வழங்கப்பட்டது; חָרוֹן என்பதன் தீவிரமான எரியும் கோப உணர்வை ‘கடுங்கோபம்’ வெளிப்படுத்துகிறது.
- source_word: לְחַלֵּל אֶת הַשַּבָּת
  choice: ஓய்வுநாளின் புனிதத்தைக் கெடுத்து
  rationale: חלל என்பதன் ‘புனிதத்தைக் குலைத்தல்/புனிதமற்றதாக்குதல்’ என்ற பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது; செயல் எவ்வாறு கோபத்தை அதிகரிக்கிறது என்பதையும் இணைக்கிறது.
theological_decisions:
- issue: கடவுள் கொண்டுவந்ததாகக் கூறப்படும் רָעָה என்பதன் பொருள்
  choice: தீங்கு
  alternative: பேரிடர் / கேடு
  rationale: ‘தீங்கு’ எபிரெயச் சொல்லின் பொருள் அகலத்தைப் பாதுகாக்கிறது. சூழல் இதை ஒழுக்கத் தீமை என அல்லாமல், பாவத்திற்கான தெய்வீகத் தண்டனையாக வந்த கேடு எனத் தெளிவாக்குகிறது; அடிக்குறிப்பு வேறு சாத்தியமான பொருள்களைச் சுட்டுகிறது.
- issue: חָרוֹן என்ற தெய்வீகக் கோப மொழியின் தீவிரம்
  choice: கடுங்கோபம்
  alternative: கோபம் / எரியும் கோபம்
  rationale: தெய்வீக நியாயத்தீர்ப்பின் வலிமையை மென்மைப்படுத்தாமல், நவீனத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் தருகிறது.
translation_notes:
  register: நவீன, பொதுவாகப் புரியும், கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. சொல்லுக்குச் சொல் அமைப்பால் ஏற்படும் செயற்கைத்தன்மையைத் தவிர்த்து, எபிரெய வினாவின் வலிமை, தெய்வீகத் தீர்ப்பு, ஓய்வுநாளின் புனிதம் ஆகியவை பாதுகாக்கப்பட்டுள்ளன.
