revisions:
- from: “உங்கள் முன்னோர்கள் இப்படிச் செய்தார்கள் அல்லவா? அதனால்தானே நம் கடவுள் இந்தத் தீங்கையெல்லாம்[a] நம்மேலும் இந்த நகரத்தின்மேலும் வரச்செய்தார்? நீங்களோ ஓய்வுநாளின் புனிதத்தைக் கெடுத்து, இஸ்ரயேல்மேல் கடுங்கோபத்தை இன்னும் அதிகரிக்கிறீர்கள்.”
  to: “உங்கள் தந்தையர் இப்படிச் செய்தார்கள் அல்லவா? நம் கடவுள் இந்தப் பேரிடரையெல்லாம் நம்மேலும் இந்த நகரத்தின்மேலும் கொண்டு வந்தார் அல்லவா? ஆனால், நீங்கள் ஓய்வுநாளின் புனிதத்தைக் குலைத்து, இஸ்ரயேல்மேல் கடுங்கோபத்தை மேலும் கூட்டுகிறீர்கள்.”
  rationale: The revision restores the explicit ‘fathers,’ avoids over-specifying the coordination as ‘therefore,’ and uses ‘பேரிடர்’ for the judgment-context sense of רָעָה. It retains the draft’s faithful rendering of divine wrath and Sabbath profanation, while preserving lexical alternatives in the footnote.
  reviewer_model: gpt-5.6-terra
