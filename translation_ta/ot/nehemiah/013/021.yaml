base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/021.yaml
  text: So I warned them and said to them[a], “Why are you spending the night in front of the wall? If you do it again, I will lay hands on you.” From that time on they did not come on the Sabbath.
translation:
  language: ta
  text: நான் அவர்களை எச்சரித்து, அவர்களிடம், “நீங்கள் ஏன் மதிலுக்கு எதிரே இரவைக் கழிக்கிறீர்கள்? இதை மீண்டும் செய்தால், உங்கள்மேல் கை வைப்பேன்[a]” என்றேன். அப்போதிலிருந்து அவர்கள் ஓய்வுநாளில் வரவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உங்களுக்கு எதிராகப் பலத்தைப் பயன்படுத்துவேன்.” எபிரெய மரபுத்தொடரின் சொற்சார்ந்த பொருள், “உங்களுக்கு எதிராகக் கையை அனுப்புவேன்” என்பதாகும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאָעִידָה
  choice: கடுமையாக எச்சரித்து
  rationale: העוד என்பதன் ஹிஃபில் வடிவம் இச்சூழலில் ஒருவருடைய நடத்தைக்கு எதிராக உறுதியான எச்சரிக்கை விடுப்பதைக் குறிக்கிறது. ‘கடுமையாக எச்சரித்து’ என்பது அதன் வலிமையை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: וָאֹמְרָה אֲלֵיהֶם
  choice: அவர்களிடம் … என்றேன்
  rationale: எபிரெயக் கதைநடையின் தொடர்ச்சியை இயல்பான தமிழ் நேர்கூற்றாக வழங்குகிறது.
- source_word: מַדּוּעַ
  choice: ஏன்
  rationale: நேரடியான காரண வினாவுக்கு இயல்பான தமிழ் இணை.
- source_word: לֵנִים
  choice: இரவைக் கழிக்கிறீர்கள்
  rationale: לון/לין என்பது இரவில் தங்குதல் அல்லது இரவைக் கழித்தலைக் குறிக்கிறது; இச்சூழலில் ‘இரவைக் கழிக்கிறீர்கள்’ தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: נֶגֶד הַחוֹמָה
  choice: மதிலுக்கு எதிரே
  rationale: נֶגֶד என்பது முன்பாக அல்லது எதிரே என்ற இடத்தொடர்பைக் குறிக்கிறது. ‘மதிலுக்கு எதிரே’ என்பது அவர்கள் மதிலுக்கு வெளியே இருந்தார்கள் என உரையில் இல்லாததைத் தனியே சேர்க்காமல், அந்த இடத்தொடர்பைப் பாதுகாக்கிறது.
- source_word: אִם תִּשְׁנוּ
  choice: இதை மீண்டும் செய்தால்
  rationale: שנה இங்கு ‘மீண்டும் செய்’ என்று பொருள்படுகிறது. மறைந்துள்ள செயப்படுபொருளைத் தமிழில் ‘இதை’ என்று இயல்பாக வெளிப்படுத்துகிறது.
- source_word: יָד אֶשְׁלַח בָּכֶם
  choice: உங்கள்மேல் கைவைப்பேன்
  rationale: இந்த எபிரெய மரபுத்தொடர் நேரடி நடவடிக்கை அல்லது பலப்பிரயோகத்தைக் குறிக்கும் அச்சுறுத்தல். தமிழ் மரபுத்தொடரான ‘கைவைப்பேன்’ அச்சுறுத்தலின் வலிமையைத் தக்கவைக்கிறது; அதன் சொற்சார்ந்த வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: מִן הָעֵת הַהִיא
  choice: அப்போதிலிருந்து
  rationale: எச்சரிக்கைக்குப் பின் ஏற்பட்ட தொடர்ச்சியான விளைவைச் சுருக்கமாகவும் இயல்பாகவும் குறிக்கிறது.
- source_word: לֹא בָאוּ
  choice: வரவில்லை
  rationale: எதிர்மறை நிறைவேற்றுவினையின் நேரடியான கதைநடைப் பொருளை வழங்குகிறது; முந்தைய காலக்குறிப்பு தொடர்ச்சியையும் உணர்த்துகிறது.
- source_word: בַּשַּׁבָּת
  choice: ஓய்வுநாளில்
  rationale: שַׁבָּת என்பதற்கான தெளிவான, பொதுவாகப் புரிந்துகொள்ளப்படும் தமிழ் வேதாகமச் சொல்.
