  yaml_path: translation/ot/nehemiah/013/023.yaml
  text: Also in those days I saw the Jews who had married women of Ashdod[a], Ammonite women[b], and Moabite women.
translation:
  language: ta
  text: அந்த நாட்களிலும், அஸ்தோத், அம்மோன், மோவாபு ஆகிய இடங்களைச் சேர்ந்த பெண்களை மணந்திருந்த[b] யூதர்களை நான் கண்டேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: சொல்லுக்குச் சொல், ‘பெண்களைக் குடியமர்த்தியிருந்த’; இங்குள்ள எபிரேய மரபுத்தொடர், அந்தப் பெண்களை மணந்துகொண்டதை அல்லது மனைவிகளாக ஏற்றுக்கொண்டதைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: -யும்
  rationale: முந்தைய சீர்திருத்த நடவடிக்கைகளுடன் மேலும் ஒரு நிகழ்வைச் சேர்க்கும் பொருளை இயல்பான தமிழில் வாக்கியத்திலுள்ள ‘யூதர்களையும்’ என்ற வடிவம் வெளிப்படுத்துகிறது.
- source_word: בַּיָּמִים הָהֵם
  choice: அந்த நாட்களில்
  rationale: குறிப்பிடப்பட்ட காலப்பகுதியைச் சுட்டும் எபிரேயச் சொற்றொடரின் நேரடியான, இயல்பான தமிழ் வடிவம்.
- source_word: רָאִיתִי
  choice: நான் கண்டேன்
  rationale: நெகேமியாவின் நேரடி சாட்சித் தொனியைப் பேணுகிறது.
- source_word: אֶת הַיְּהוּדִים
  choice: யூதர்களை
  rationale: சிறையிருப்புக்குப் பிந்தைய யூதச் சமூகத்தைக் குறிக்கும் இயல்பான தமிழ் பெயர்; ‘யூதேயர்கள்’ என்ற நிலவியல் சார்ந்த பொருளும் சாத்தியம் என்பதால் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: הֹשִׁיבוּ נָשִׁים
  choice: பெண்களை மணந்திருந்த
  rationale: சொல்லுக்குச் சொல் ‘பெண்களைக் குடியிருக்கச் செய்திருந்த’ என்று வரும் எபிரேய மரபுத்தொடர், இச்சூழலில் அவர்களை மனைவிகளாக ஏற்றுக்கொண்டதைக் குறிக்கிறது. ‘மணந்திருந்த’ என்பது அந்தப் பொருளைத் தெளிவாகவும் சுருக்கமாகவும் தெரிவிக்கிறது.
- source_word: אשדודיות
  choice: அஸ்தோத்திய பெண்கள்
  rationale: அஸ்தோத்தைச் சேர்ந்த பெண்களைக் குறிக்கும் இன/இடப்பெயர் சார்ந்த பெண்பால் வடிவத்தைத் தமிழில் சுருக்கமாக வெளிப்படுத்துகிறது.
- source_word: עמוניות
  choice: அம்மோனிய பெண்கள்
  rationale: அம்மோனைச் சேர்ந்த பெண்களைக் குறிக்கும் இனப்பெயரை இயல்பான தமிழில் தருகிறது.
- source_word: מוֹאֲבִיּוֹת
  choice: மோவாபிய பெண்கள்
  rationale: மோவாபைச் சேர்ந்த பெண்களைக் குறிக்கும் இனப்பெயரை இயல்பான தமிழில் தருகிறது.
theological_decisions:
- issue: הַיְּהוּדִים என்பதன் இன-நிலவியல் பொருள்
  choice: யூதர்கள்
  alternative: யூதேயர்கள்
  rationale: இங்கு சிறையிருப்புக்குப் பிந்தைய உடன்படிக்கைச் சமூகமே முதன்மையாகக் குறிக்கப்படுகிறது; ஆகவே பொதுவாகப் புரியும் ‘யூதர்கள்’ முதன்மை உரையில் வைக்கப்படுகிறது. நிலவியல் வலியுறுத்தலுள்ள மாற்று வாசிப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: הֹשִׁיבוּ נָשִׁים என்ற மரபுத்தொடரின் பொருள்
  choice: பெண்களை மணந்திருந்த
  alternative: பெண்களைக் குடியிருக்கச் செய்திருந்த
  rationale: சூழல் திருமண உறவைக் குறிக்கிறது. ‘மணந்திருந்த’ என்பது மரபுத்தொடரின் நோக்கத்தைத் தெளிவாக்குகிறது; அதே நேரத்தில் அதன் நேரடியான வடிவம் அடிக்குறிப்பில் தரப்பட்டு மூலத்தின் தனித்தன்மை பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், கண்ணியமான வரலாற்று விவரிப்பு நடை பயன்படுத்தப்பட்டுள்ளது. எபிரேய வாக்கியத்தின் சேர்க்கைத் தன்மை ‘யூதர்களையும்’ என்பதன் மூலம் இயல்பாக வெளிப்படுத்தப்பட்டுள்ளது. இன/இடப்பெயர்கள் சுருக்கமான பெயரடை வடிவில் வழங்கப்பட்டுள்ளன.
