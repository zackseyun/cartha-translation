base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/026.yaml
  text: Was it not because of these things that Solomon king of Israel sinned? Yet among the many nations there was no king like him[a], and he was loved by his God, and God made him king over all Israel. Even him foreign women caused to sin.
translation:
  language: ta
  text: இவற்றின் காரணமாகத்தானே இஸ்ரவேலின் அரசனாகிய சாலொமோன் பாவம் செய்தான்? பல நாடுகளிலும் அவனைப்போன்ற அரசன் ஒருவனும் இருந்ததில்லை; அவன் தன் கடவுளால் நேசிக்கப்பட்டவனாக இருந்தான்; கடவுள் அவனை இஸ்ரவேல் முழுவதற்கும் அரசனாக்கினார். அவனையும்கூட அந்நியப் பெண்கள்[a] பாவம் செய்யவைத்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அந்நிய மனைவிகள்.” எபிரெய மூலத்தில் “அந்நியப் பெண்கள்” என்றே உள்ளது; சாலொமோனின் வரலாற்றுச் சூழலின் அடிப்படையில் “மனைவிகள்” என்பது சாத்தியமான மாற்று, ஆனால் அந்தச் சொல் இவ்வசனத்தில் வெளிப்படையாக இல்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלוֹא עַל אֵלֶּה
  choice: இவற்றின் காரணமாகத்தானே
  rationale: הֲלֹא அறுதியான பதிலை எதிர்பார்க்கும் வினாவைக் குறிக்கிறது; עַל אֵלֶּה காரணத்தைக் குறிக்கிறது. தமிழ் வினாவொட்டு ‘தானே’ இரண்டின் சொல்லாற்றலையும் இயல்பாகத் தருகிறது.
- source_word: חָטָא
  choice: பாவம் செய்தான்
  rationale: ஒழுக்க மற்றும் சமயச் சூழலில் חטא என்பதற்கான தெளிவான, வழக்கமான தமிழ் மொழிபெயர்ப்பு.
- source_word: שְׁלֹמֹה מֶלֶךְ יִשְׂרָאֵל
  choice: இஸ்ரவேலின் அரசனாகிய சாலொமோன்
  rationale: பெயரையும் அரசப் பட்டத்தையும் தெளிவாகப் பாதுகாக்கும் இயல்பான தமிழ் அமைப்பு.
- source_word: וּבַגּוֹיִם הָרַבִּים לֹא הָיָה מֶלֶךְ כָּמֹהוּ
  choice: பல நாடுகளிலும் அவனைப்போன்ற அரசன் ஒருவனும் இருந்ததில்லை
  rationale: ஒப்பீட்டின் பரந்த எல்லையையும் மறுப்பின் வலியுறுத்தலையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: וְאָהוּב לֵאלֹהָיו הָיָה
  choice: அவன் தன் கடவுளால் நேசிக்கப்பட்டவனாக இருந்தான்
  rationale: אָהוּב என்பதன் செயப்படுபொருள்/பெயரடைப் பொருளையும் ‘அவனுடைய கடவுள்’ என்ற பின்னொட்டையும் பாதுகாக்கிறது.
- source_word: וַיִּתְּנֵהוּ אֱלֹהִים מֶלֶךְ עַל כָּל יִשְׂרָאֵל
  choice: கடவுள் அவனை இஸ்ரவேல் முழுவதற்கும் அரசனாக்கினார்
  rationale: נתן இங்கு ஒருவரை அரசப் பதவியில் அமர்த்தும் பொருளில் உள்ளது; ‘அரசனாக்கினார்’ சுருக்கமான இயல்பான தமிழ்.
- source_word: גַּם אוֹתוֹ
  choice: அப்படிப்பட்ட அவனையும்கூட
  rationale: முன்னிறுத்தப்பட்ட பொருளின் வியப்பூட்டும் வலியுறுத்தலைத் தமிழில் தெளிவாக்குகிறது; ‘அப்படிப்பட்ட’ என்பது முந்தைய சிறப்புகளுடன் உள்ள தொடர்பை மட்டும் வெளிப்படுத்துகிறது.
- source_word: הֶחֱטִיאוּ
  choice: பாவம் செய்யவைத்தார்கள்
  rationale: חטא என்பதன் ஹிஃபில் வடிவிலுள்ள காரணவினைப் பொருளை நேரடியாகப் பாதுகாக்கிறது.
- source_word: הַנָּשִׁים הַנָּכְרִיּוֹת
  choice: அந்நியப் பெண்கள்
  rationale: எபிரெயத்தில் வெளிப்படையாக ‘பெண்கள்’ என்றே உள்ளது; சாலொமோனின் கதையிலிருந்து ‘மனைவிகள்’ என்று உரைக்குள் சேர்க்காமல் மூலத்தின் சொல் பரப்பைப் பாதுகாக்கிறது.
theological_decisions:
- issue: சாலொமோனின் பாவத்திற்கான காரணம்
  choice: அந்நியப் பெண்கள் அவனைப் பாவம் செய்யவைத்தார்கள் என்று வசனம் கூறும் அளவிலேயே மொழிபெயர்த்தல்
  alternative: அவர்கள் அவனைச் சோதித்தார்கள்; அவனுடைய திருமணங்கள் உடன்படிக்கை விசுவாசத்தைச் சீர்குலைத்தன
  rationale: காரணவினை அவர்களுடைய பங்கைத் தெளிவாகக் கூறுகிறது; ஆனால் அதன் செயல்முறையை இவ்வசனம் விளக்காததால் 1 இராஜாக்கள் 11-இன் விவரங்களை உரைக்குள் இறக்குமதி செய்யவில்லை.
- issue: אֱלֹהִים என்பதன் மொழிபெயர்ப்பு
  choice: கடவுள்
  alternative: கர்த்தர்
  rationale: இங்கு உடன்படிக்கைப் பெயரான יהוה இல்லை. ஆகவே அதை இறக்குமதி செய்யாமல் אֱלֹהִים என்பதைக் ‘கடவுள்’ என மொழிபெயர்க்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பான, கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘அரசன்,’ ‘கடவுள்,’ ‘பாவம் செய்தான்’ போன்ற பரவலாகப் புரியும் சொற்கள் தேர்ந்தெடுக்கப்பட்டுள்ளன; மூலத்தின் வினாவும் வலியுறுத்தலும் காரணவினையும் பாதுகாக்கப்பட்டுள்ளன.
