base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/009.yaml
  text: Then I gave the order[a], and they cleansed the chambers; and I brought back there the vessels of the house of God[b], with the grain offering and the frankincense.
translation:
  language: ta
  text: பின்பு நான் கட்டளையிட்டேன்[a]; அவர்கள் அந்த அறைகளைத் தூய்மைப்படுத்தினார்கள்[b]. அதன்பின் கடவுளின் இல்லத்துக்குரிய பாத்திரங்களையும், தானியக் காணிக்கையையும், குங்கிலியத்தையும் அங்கே மீண்டும் கொண்டுவந்தேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘பின்பு நான் சொன்னேன்’ அல்லது ‘பின்பு நான் ஆணையிட்டேன்.’ எபிரெய வினைச்சொல் நேரடியாக ‘நான் சொன்னேன்’ என்பதே; ஆனால் இச்சூழலில் அது நிறைவேற்றப்பட்ட ஓர் ஆணையை அறிமுகப்படுத்துகிறது.
    reason: lexical_alternative
  - marker: b
    text: ‘தூய்மைப்படுத்தினார்கள்’ என்பது உடல்சார்ந்த சுத்தம் மட்டுமல்லாமல் சடங்குமுறைத் தூய்மையாக்கத்தையும் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֹמְרָה
  choice: பின்பு நான் கட்டளையிட்டேன்
  rationale: எபிரெயச் சொல் நேரடியாக ‘நான் சொன்னேன்’ எனப் பொருள்படும்; ஆனால் அதைத் தொடர்ந்து கட்டளை நிறைவேற்றப்படுவதால், சூழலில் உள்ள ஆணையின் வலிமையை இயல்பான தமிழில் வெளிப்படுத்த ‘கட்டளையிட்டேன்’ என மொழிபெயர்க்கப்பட்டது. தொடக்க வாவ் கதைத் தொடர்ச்சியைக் குறிப்பதால் ‘பின்பு’ சேர்க்கப்பட்டது.
- source_word: וַיְטַהֲרוּ
  choice: அவர்கள் ... தூய்மைப்படுத்தினார்கள்
  rationale: טהר என்பது சாதாரணமாகச் சுத்தம் செய்வதையும் சடங்குமுறைத் தூய்மையாக்கத்தையும் குறிக்கக்கூடும். ‘தூய்மைப்படுத்தினார்கள்’ இரு நுணுக்கங்களையும் தக்கவைக்கிறது.
- source_word: הַלְּשָׁכוֹת
  choice: அந்த அறைகளை
  rationale: לשכה ஆலய வளாகத்திலுள்ள அறைகளைக் குறிக்கிறது. சூழலில் அவை சேமிப்பறைகளாக இருந்தாலும், மூலச்சொல்லைவிடக் குறிப்பாக்காமல் ‘அறைகள்’ என வழங்கப்பட்டது.
- source_word: וָאָשִׁיבָה שָּׁם
  choice: அங்கே மீண்டும் கொண்டுவந்தேன்
  rationale: שוב இங்கு பிறவினைப் பொருளில் அகற்றப்பட்டவற்றை மீண்டும் கொண்டு வருவதைக் குறிக்கிறது; שם என்பதற்கு ‘அங்கே’ வழங்கப்பட்டது.
- source_word: כְּלֵי בֵּית הָאֱלֹהִים
  choice: கடவுளின் இல்லத்துக்குரிய பாத்திரங்கள்
  rationale: כְּלִי என்பது பாத்திரங்கள், கருவிகள் அல்லது பொருட்கள் எனப் பரந்த பொருளுடையது. ஆலயப் பயன்பாட்டுச் சூழலில் ‘பாத்திரங்கள்’ பொருத்தமானது; ‘கடவுளின் இல்லம்’ என்ற மூல உருவகம் தக்கவைக்கப்பட்டது.
- source_word: אֶת הַמִּנְחָה
  choice: தானியக் காணிக்கை
  rationale: முறையான வழிபாட்டுச் சூழலில் מִנְחָה தானியத்தால் செலுத்தப்படும் காணிக்கையைக் குறிக்கிறது. பொதுவான ‘காணிக்கை’ என்பதைவிட ‘தானியக் காணிக்கை’ துல்லியமானது.
- source_word: וְהַלְּבוֹנָה
  choice: சாம்பிராணி
  rationale: לְבוֹנָה பொதுவான தூபத்தை அல்ல, குறிப்பாக frankincense-ஐ குறிக்கிறது. நவீனத் தமிழில் பரவலாகப் புரியக்கூடிய துல்லியமான பெயராக ‘சாம்பிராணி’ தேர்ந்தெடுக்கப்பட்டது.
