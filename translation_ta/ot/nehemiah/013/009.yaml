translation_notes:
  register: நவீன நிலையான தமிழில், இயல்பானதாயும் கண்ணியமானதாயும் வாசிக்கும்படி அமைக்கப்பட்டது. ‘கடவுளின் இல்லம்,’ ‘தானியக் காணிக்கை’ போன்ற வழிபாட்டுச் சொற்கள் மூலத்தின் புனிதப் பயன்பாட்டு நடையைத் தக்கவைக்கின்றன. எபிரெய வாக்கியத்தின் நீண்ட இணைப்புத் தொடரை தெளிவுக்காக இரண்டு வாக்கியங்களாகப் பிரித்துள்ளோம்.
