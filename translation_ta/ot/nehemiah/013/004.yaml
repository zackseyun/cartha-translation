base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/004.yaml
  text: Before this[a], Eliashib the priest, who had been appointed over the chamber of the house of our God, was related to Tobiah—
translation:
  language: ta
  text: இதற்கு முன்பு, நம் கடவுளின் இல்லத்திலுள்ள அறைக்குப் பொறுப்பாக நியமிக்கப்பட்டிருந்த ஆசாரியனான எலியாசிப், தொபியாவுடன் நெருங்கிய உறவு கொண்டிருந்தான்[a]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தொபியாவின் உறவினனாக இருந்தான்.” எபிரெயச் சொற்றொடர் குடும்ப உறவையோ சமூக நெருக்கத்தையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלִפְנֵי מִזֶּה
  choice: இதற்கு முன்பு
  rationale: முந்தைய ஒரு காலநிலையை அறிமுகப்படுத்தும் சொற்றொடர். וְ என்பதன் இணைப்புத்தன்மையைத் தமிழில் தனியே ‘மேலும்’ என்று சேர்க்காமல், இயல்பான உரையோட்டத்தில் வெளிப்படுத்துகிறது.
- source_word: אֶלְיָשִׁיב הַכֹּהֵן
  choice: ஆசாரியனான எலியாசிப்
  rationale: பெயரை ஒலிபெயர்த்து, definite title-ஐ நவீனத் தமிழில் இயல்பாகப் பெயருடன் இணைக்கிறது.
- source_word: נָתוּן בְּלִשְׁכַּת
  choice: அறைக்குப் பொறுப்பாக நியமிக்கப்பட்டிருந்த
  rationale: נתון என்பதன் செயல்பாட்டு நிலையை வெறும் இடவமைப்பாக அல்லாமல் நியமிக்கப்பட்ட பொறுப்பாக வெளிப்படுத்துகிறது; לשכה என்பதன் பொதுவான கட்டடப் பொருளான ‘அறை’ பாதுகாக்கப்படுகிறது.
- source_word: בֵּית אֱלֹהֵינוּ
  choice: நம் கடவுளின் இல்லம்
  rationale: ‘நம் கடவுளின் வீடு/இல்லம்’ என்ற மூல உருவகத்தைப் பாதுகாக்கிறது; சூழல் இது ஆலயத்தைக் குறிக்கிறது.
- source_word: קָרוֹב לְטוֹבִיָּה
  choice: தொபியாவின் உறவினனாக இருந்தான்
  rationale: קרוב ל־ என்பது உறவுமுறையையோ சமூக நெருக்கத்தையையோ குறிக்கலாம். முதன்மை உரையில் சாத்தியமான குடும்ப உறவைத் தருகிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
theological_decisions:
- issue: எலியாசிப்புக்கும் தொபியாவுக்கும் இடையிலான உறவின் தன்மை
  choice: உறவினன்
  alternative: நெருங்கிய தொடர்புடையவன் / கூட்டாளி
  rationale: எபிரெயச் சொற்றொடர் குடும்ப உறவையும் சமூக நெருக்கத்தையும் அனுமதிப்பதால், முதன்மை வாசகத்தில் ஒரு பொருளைத் தேர்ந்தெடுத்தாலும் மற்ற பொருளை அடிக்குறிப்பில் வெளிப்படையாக வைத்திருக்கிறது; குற்றச்சாட்டு அல்லது கோட்பாட்டு முடிவை உரைக்குள் சேர்க்கவில்லை.
translation_notes:
  register: நவீன, தரமான, மரியாதைமிக்க தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘நம் கடவுளின் இல்லம்’ மூலத்தின் உருவகத்தைப் பாதுகாக்கிறது; ‘அறைக்குப் பொறுப்பாக’ என்பது நிர்வாகப் பொறுப்பை சாதாரண வாசகருக்கு தெளிவாக்குகிறது. வாக்கிய முடிவிலுள்ள நீண்ட கோடு அடுத்த வசனத்தில் தொடரும் கருத்தைச் சுட்டுகிறது.
