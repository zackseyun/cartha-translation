translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் dignified நடையில் மொழிபெயர்க்கப்பட்டது. ‘அதனால்’ என்பது முதல் வாக்கியத்தின் வருத்தத்துக்கும் அடுத்த வலுவான செயலுக்கும் உள்ள இயல்பான தொடர்பை வெளிப்படுத்துகிறது; அறை முன்சூழலில் குறிப்பிட்டதாதலால் ‘அந்த அறை’ பயன்படுத்தப்பட்டது.
