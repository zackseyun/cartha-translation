  yaml_path: translation/ot/nehemiah/013/008.yaml
  text: And it displeased me greatly[b][a], and I threw all the household goods of Tobiah out of the chamber.
translation:
  language: ta
  text: அது எனக்கு மிகவும் மனவருத்தமாக இருந்தது; நான் தொபியாவின் எல்லாப் பொருள்களையும் அந்த அறையிலிருந்து வெளியே எறிந்தேன்.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “பொருள்கள்” என்பதற்கான எபிரெயச் சொல், சொல்லுக்குச் சொல், “தொபியாவின் வீட்டின் பாத்திரங்கள்” என்பதாகும்; அது பாத்திரங்கள், கருவிகள், தளவாடங்கள் அல்லது பிற உடைமைகளையும் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “அறை” என்பது ஆலய வளாகத்திலிருந்த ஒரு அறையைக் குறிக்கிறது.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֵּרַע לִי מְאֹד
  choice: அது எனக்கு மிகவும் வருத்தமளித்தது
  rationale: רעע + ל என்ற எபிரெய மரபுத்தொடர், ஏதோ ஒன்று ஒருவருக்கு மிகவும் மோசமாகவோ மனவருத்தம் தருவதாகவோ இருந்ததைச் சொல்கிறது. இந்த மொழிபெயர்ப்பு அதன் மறைமுக அமைப்பையும் உணர்ச்சியின் தீவிரத்தையும் இயல்பான தமிழில் காக்கிறது.
- source_word: וָאַשְׁלִיכָה
  choice: எறிந்தேன்
  rationale: Hiphil வடிவிலுள்ள שלך வலுவாக வெளியே எறிதல் அல்லது வீசுதல் என்ற செயலைக் குறிக்கிறது; ‘எறிந்தேன்’ என்பது தெளிவான நவீனத் தமிழ்.
- source_word: כָּל
  choice: அனைத்தையும்
  rationale: தொடர்ந்து வரும் பன்மைப் பொருள்களின் முழுமையையும் உள்ளடக்கும் சொல்லாக ‘அனைத்தையும்’ இயல்பாக அமைகிறது.
- source_word: כְּלֵי בֵית טוֹבִיָּה
  choice: தொபியாவின் வீட்டுப் பொருள்கள்
  rationale: כְּלִי என்பது பாத்திரங்கள், கருவிகள், தளவாடங்கள், உடைமைகள் எனப் பரந்த பொருளுடையது. இச்சூழலில் தொபியா அறையில் வைத்திருந்த பொருள்களைப் பொதுவாகக் குறிக்க ‘வீட்டுப் பொருள்கள்’ தெளிவாகவும் போதிய அகலத்துடனும் உள்ளது.
- source_word: הַחוּץ מִן הַלִּשְׁכָּה
  choice: அந்த அறையிலிருந்து வெளியே
  rationale: מן உடன் வரும் הַחוּץ வெளிநோக்கிய இயக்கத்தைக் காட்டுகிறது. לשכה இங்கு ஆலய வளாகத்திலுள்ள ஓர் அறையைக் குறிக்கிறது; தமிழில் ‘அந்த அறையிலிருந்து வெளியே’ என்பது இயல்பான வரிசை.
