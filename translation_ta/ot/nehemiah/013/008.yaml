- from: அது எனக்கு மிகவும் வருத்தமளித்தது; அதனால் தொபியாவின் வீட்டுப் பொருள்கள் அனைத்தையும் அந்த அறையிலிருந்து வெளியே எறிந்தேன்.[a]
  to: அது எனக்கு மிகவும் மனவருத்தமாக இருந்தது; நான் தொபியாவின் எல்லாப் பொருள்களையும் அந்த அறையிலிருந்து வெளியே எறிந்தேன்.[a][b]
