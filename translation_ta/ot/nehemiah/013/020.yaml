base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/020.yaml
  text: Then the merchants and sellers of every kind of goods spent the night outside Jerusalem once or twice[a][b].
translation:
  language: ta
  text: அப்போது வியாபாரிகளும் எல்லா வகையான பொருட்களை விற்பவர்களும் எருசலேமுக்கு வெளியே ஓரிரு முறை இரவைக் கழித்தார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “ஒரு முறையும் இரண்டு முறையும்”; இதன் பொருள் “ஓரிரு முறை.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּלִינוּ
  choice: இரவைக் கழித்தார்கள்
  rationale: לון என்ற வினை இரவில் தங்குவதையோ இரவைக் கழிப்பதையோ குறிக்கிறது. இச்சூழலில் ‘இரவைக் கழித்தார்கள்’ என்பது இயல்பான நவீனத் தமிழ்; நிரந்தரமாகத் தங்கியிருந்தார்கள் என்ற பொருளையும் தராது.
- source_word: הָרֹכְלִים
  choice: வியாபாரிகள்
  rationale: רֹכֵל என்பது வணிகர் அல்லது வியாபாரியைக் குறிக்கிறது. அடுத்துவரும் ‘விற்பவர்கள்’ என்பதுடன் தெளிவாக வேறுபட்டும் இயல்பாக இணைந்தும் நிற்கும் சொல் இது.
- source_word: וּמֹכְרֵי כָל מִמְכָּר
  choice: எல்லா வகையான பொருட்களை விற்பவர்களும்
  rationale: விற்கத்தக்க அனைத்துவகைப் பொருட்களையும் குறிக்கும் எபிரெயச் சொற்றொடரின் விரிவை இயல்பான தமிழில் இது பாதுகாக்கிறது.
- source_word: מִחוּץ לִירוּשָׁלָם
  choice: எருசலேமுக்கு வெளியே
  rationale: மִחוּץ என்பது நகரத்தின் புறப்பகுதியில் இருப்பதைக் குறிக்கிறது; ‘எருசலேமுக்கு வெளியே’ என்பது தெளிவான, இயல்பான தமிழ்.
- source_word: פַּעַם וּשְׁתָּיִם
  choice: ஓரிரு முறை
  rationale: சொல்லுக்குச் சொல் ‘ஒரு முறையும் இரண்டு முறையும்’ என்ற எபிரெய மரபுத்தொடர், ஒன்று அல்லது இரண்டு சந்தர்ப்பங்களைக் குறிக்கிறது. ‘ஓரிரு முறை’ அந்தப் பொருளைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
