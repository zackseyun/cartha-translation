base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/003.yaml
  text: And when they heard the law[a], they separated from Israel all the mixed multitude.
translation:
  language: ta
  text: அவர்கள் சட்டத்தைக் கேட்டபோது, கலந்த கூட்டத்தினர்[a] அனைவரையும் இஸ்ரவேலிலிருந்து பிரித்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘கலப்பு வம்சத்தைச் சேர்ந்த அனைவரையும்’ அல்லது ‘கலப்பான கூட்டத்தினர்’ என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் עֵרֶב கலந்த ஒரு குழுவைக் குறிக்கும் கூட்டுச் சொல்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: '[தனி வார்த்தையாக மொழிபெயர்க்காமல் நிகழ்ச்சித் தொடரில் இயல்பாக இணைத்தல்]'
  rationale: இந்தக் கதைத் தொடரில் வாவ்-தொடருடன் வரும் היה அடுத்த நிகழ்வை அறிமுகப்படுத்துகிறது. தமிழில் ‘அப்போது நிகழ்ந்ததாவது’ என்று சொல்வது தேவையற்ற கடின நடையாக இருப்பதால், காலவாக்கியத்துடன் இயல்பாக இணைக்கப்பட்டுள்ளது.
- source_word: כְּשָׁמְעָם
  choice: அவர்கள் ... கேட்டபோது
  rationale: כ முன்னொட்டுடன் வரும் வினையெச்ச வடிவம் கால உறவைக் குறிக்கிறது. ‘கேட்டபோது’ என்பது தெளிவான, இயல்பான தமிழ்.
- source_word: הַתּוֹרָה
  choice: சட்டம்
  rationale: இங்கு תּוֹרָה என்பது பொதுவான போதனையைவிட, பொதுவில் வாசிக்கப்பட்ட அதிகாரப்பூர்வமான மோசேயின் சட்டத்தைக் குறிக்கிறது. ‘சட்டம்’ என்பது பொதுவாசகருக்குத் தெளிவானது; மூலத்தில் இல்லாத ‘திரு’ போன்ற அடைமொழியைச் சேர்ப்பதையும் தவிர்க்கிறது.
- source_word: וַיַּבְדִּילוּ
  choice: பிரித்துவைத்தார்கள்
  rationale: בדל என்பது பிரித்தல் அல்லது தனியே வைத்தல் என்று பொருள்படும். ‘வெளியேற்றினார்கள்’ என்ற அதிக விளக்கமுள்ள சொல்லைத் தவிர்த்து, செயலை நேரடியாகக் காட்டுகிறது.
- source_word: כָל
  choice: அனைவரையும்
  rationale: கூட்டுப் பெயருடன் வரும் כָל அந்தக் குழு முழுவதையும் குறிக்கிறது. மனிதர்களைக் குறிக்கும் தமிழ்ச் சூழலில் ‘அனைவரையும்’ இயல்பானது.
- source_word: עֵרֶב
  choice: கலப்புக் கூட்டத்தார்
  rationale: עֵרֶב என்பது கலந்த ஒரு குழுவைக் குறிக்கும் கூட்டுச் சொல். ‘கலப்புக் கூட்டத்தார்’ அதன் கூட்டுப் பொருளைப் பேணுகிறது; கலப்பு எத்தகையது என்பதை மூலத்தைவிடக் குறுகலாக நிர்ணயிக்கவில்லை.
- source_word: מִיִּשְׂרָאֵל
  choice: இஸ்ரவேலிலிருந்து
  rationale: מן பிரித்தலைக் குறிக்கிறது. ‘இஸ்ரவேல்’ என்பதை மக்களாகவோ சபையாகவோ விரித்துரைக்காமல், மூலத்தின் உடன்படிக்கைச் சமூகப் பெயரை அப்படியே பேணுகிறது.
theological_decisions:
- issue: சிறையிருப்புக்குப் பிந்தைய சமூகத் தூய்மைச் சூழலில் ‘இஸ்ரவேல்’ என்பதன் குறிப்பு
  choice: ‘இஸ்ரவேல்’ என்ற சமூகப் பெயரை அப்படியே வைத்தல்
  alternative: ‘இஸ்ரவேல் மக்கள்’ அல்லது ‘இஸ்ரவேலின் சபை’ என்று விரித்துரைத்தல்
  rationale: எபிரெய மூலத்தில் יִשְׂרָאֵל என்ற இயற்பெயரே உள்ளது. அதை அப்படியே வைப்பது அதன் உடன்படிக்கை மற்றும் சமூக அடையாளத் தன்மையைப் பேணுவதோடு, பிற்கால இறையியல் முடிவுகளை வசனத்திற்குள் சேர்ப்பதைத் தவிர்க்கிறது.
- issue: עֵרֶב குறிக்கும் கலப்பின் தன்மை
  choice: ‘கலப்புக் கூட்டத்தார்’ என்று பரந்த கூட்டுப் பொருளைப் பேணுதல்
  alternative: ‘கலப்பு வம்சத்தவர்’ என்று வம்சாவளியைத் தெளிவாகக் குறிப்பிடுதல்
  rationale: சூழல் வெளிநாட்டுத் தொடர்பைச் சுட்டினாலும், עֵרֶב என்ற சொல் தானாகவே கலப்பின் துல்லியமான அடிப்படையை விளக்குவதில்லை. ஆகவே பிரதான உரை அந்தத் தெளிவின்மையைப் பேணுகிறது.
translation_notes:
  register: நவீன செந்தமிழுக்கு ஏற்ற, எளிதில் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘பிரித்துவைத்தார்கள்’ செயலை விளக்கமின்றி நேரடியாகக் காட்டுகிறது; ‘இஸ்ரவேல்’ சமூகப் பெயராக அப்படியே வைக்கப்பட்டுள்ளது.
