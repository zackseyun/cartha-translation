  text: וָ/אֹמְרָ֣/ה לַ/לְוִיִּ֗ם אֲשֶׁ֨ר יִֽהְי֤וּ מִֽטַּהֲרִים֙ וּ/בָאִים֙ שֹׁמְרִ֣ים הַ/שְּׁעָרִ֔ים לְ/קַדֵּ֖שׁ אֶת י֣וֹם הַ/שַּׁבָּ֑ת גַּם זֹאת֙ זָכְרָ/ה לִּ֣/י אֱלֹהַ֔/י וְ/ח֥וּסָ/ה עָלַ֖/י כְּ/רֹ֥ב חַסְדֶּֽ/ךָ־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/022.yaml
  text: And I told the Levites that they should purify themselves and come to guard the gates[a], to keep the Sabbath day holy. Remember this also in my favor, my God[b], and spare me according to the greatness of your steadfast love.
translation:
  language: ta
  text: லேவியர்கள் தங்களைத் தூய்மைப்படுத்திக்கொண்டு வந்து, ஓய்வுநாளைப் புனிதமாகக் கடைப்பிடிப்பதற்காக வாயில்களைக் காவல் காக்க வேண்டும் என்று அவர்களிடம் சொன்னேன். என் கடவுளே, இதையும் எனக்குச் சாதகமாக நினைவுகூரும்[a]; உமது பேரன்பின் மிகுதிக்கேற்ப என்மீது இரக்கம் காட்டும்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இதற்காக என்னையும் நினைவுகூரும்.” எபிரெயச் சொற்றொடரில், நன்மைநோக்கிய தொடர்பு நெகேமியாவோடும் அல்லது இப்போது குறிப்பிடப்பட்ட செயலோடும் இணைத்துப் புரிந்துகொள்ளப்படலாம்.
    reason: lexical_alternative
  - marker: b
    text: “பேரன்பு” என்பதற்கான எபிரெயச் சொல் ஹெசெத்; இது கடவுளின் உறுதியான அன்பு, பற்றுறுதி, இரக்கம் ஆகியவற்றை அடிக்கடி குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֹמְרָה לַלְוִיִּם
  choice: லேவியர்களிடம் சொன்னேன்
  rationale: אמר என்பதன் இயல்பான பொருள் ‘சொல்’; நிர்வாகச் சூழல் இருந்தாலும், மூலத்தில் வெளிப்படையாக இல்லாத ‘கட்டளையிட்டேன்’ என்ற வலிமையைச் சேர்க்காமல் உள்ளது.
- source_word: אֲשֶׁר יִהְיוּ מִטַּהֲרִים
  choice: தங்களைத் தூய்மைப்படுத்திக்கொண்டு
  rationale: טהר என்பதன் Hitpael வடிவம் இங்கு தற்சுட்டு/இடைநிலைப் பொருளில் லேவியர்கள் தங்களையே சடங்குமுறையாகத் தூய்மைப்படுத்துவதைச் சுட்டுகிறது.
- source_word: וּבָאִים שֹׁמְרִים הַשְּׁעָרִים
  choice: வந்து ... வாயில்களைக் காவல் காக்க வேண்டும்
  rationale: செயல்களின் தொடரையும், வாயில்களைப் பாதுகாக்கும் செயற்பாட்டு பொறுப்பையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: לְקַדֵּשׁ אֶת יוֹם הַשַּׁבָּת
  choice: ஓய்வுநாளைப் புனிதமாகக் கடைப்பிடிப்பதற்காக
  rationale: קדשׁ என்பதன் ‘புனிதமாக வைத்தல்/தனியே ஒதுக்குதல்’ என்ற நோக்கத்தை, நாளைக் கடைப்பிடிக்கும் சூழலில் தெளிவாகக் கூறுகிறது.
- source_word: גַּם זֹאת זָכְרָה לִּי
  choice: இதையும் எனக்குச் சாதகமாக நினைவுகூரும்
  rationale: לִי என்பதன் நன்மைநோக்கிய பயனை வெளிப்படுத்துகிறது; எபிரெயச் சொற்றொடரின் தொடர்பு சார்ந்த மாற்றுப் புரிதல் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: וְחוּסָה עָלַי
  choice: என்மீது இரக்கம் காட்டும்
  rationale: חוס என்பதன் இரக்கம், பரிவு, விட்டுவைத்தல் ஆகிய பொருள் வட்டத்தில், ஜெபச் சூழலுக்கு இயல்பான தமிழைத் தேர்ந்தெடுக்கிறது.
- source_word: כְּרֹב חַסְדֶּךָ
  choice: உமது பேரன்பின் மிகுதிக்கேற்ப
  rationale: חסד என்பதிலுள்ள உறுதியான, விசுவாசமிக்க அன்பையும் இரக்கத்தையும் ‘பேரன்பு’ இயல்பாகத் தருகிறது; רב என்பதன் மிகுதியும் தனியே வெளிப்படுகிறது.
theological_decisions:
- issue: חסד என்ற சொல்லை இரக்கத்திற்கான ஜெபத்தில் மொழிபெயர்த்தல்
  choice: பேரன்பு
  alternative: உடன்படிக்கை அன்பு; மாறாத அன்பு; இரக்கம்
  rationale: இச்சொல் அன்பு, பற்றுறுதி, இரக்கம் ஆகியவற்றை ஒருங்கே தாங்குகிறது. ‘பேரன்பு’ வாசிக்க இயல்பாகவும் அகலமான பொருளைத் தக்கவைத்தும் உள்ளது; ‘உடன்படிக்கை’ என்பதை மூலத்தில் வெளிப்படையாக இல்லாத விளக்கமாக முதன்மை உரைக்குள் சேர்க்கவில்லை.
- issue: זָכְרָה לִּי என்பதிலுள்ள நன்மைநோக்கிய தொடர்பு
  choice: இதையும் எனக்குச் சாதகமாக நினைவுகூரும்
  alternative: இதற்காக என்னையும் நினைவுகூரும்
  rationale: இது நெகேமியாவின் செயலை அவருக்கு நன்மையாகக் கடவுள் கவனிக்க வேண்டும் என்ற வேண்டுதலை முன்னிறுத்துகிறது; இலக்கணத் தொடர்பின் உண்மையான மாற்று வாய்ப்பு அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், மரியாதையும் ஜெபத்திற்குரிய கண்ணியமும் காக்கப்பட்டுள்ளன. கடவுளை நோக்கிய ஒருமை மரியாதை வடிவங்களான ‘உமது’, ‘காட்டும்’, ‘நினைவுகூரும்’ பயன்படுத்தப்பட்டுள்ளன. ‘ஓய்வுநாள்’, ‘லேவியர்கள்’ போன்ற பரவலாக அறியப்பட்ட வேதாகமச் சொற்கள் தக்கவைக்கப்பட்டுள்ளன.
