base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/006.yaml
  text: But during all this I was not in Jerusalem[a], for in the thirty-second year of Artaxerxes king of Babylon I went to the king[b], and after some time I asked leave from the king.
translation:
  language: ta
  text: ஆனால் இவையெல்லாம் நடந்துகொண்டிருந்த காலத்தில் நான் எருசலேமில் இருக்கவில்லை. ஏனெனில் பாபிலோனின் அரசன்[a] அர்தசஷ்டாவின் ஆட்சியின் முப்பத்திரண்டாம் ஆண்டில் நான் அரசனிடம் சென்றேன்; சில காலத்திற்குப் பிறகு[b] அரசனிடம் விடுப்பு கேட்டேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மூலத்தில், “பாபிலோனின் அரசன்” என்று உள்ளது. விரிவான பாரசீகப் பேரரசுச் சூழலுடன் ஒத்திசைக்காமல், எழுதப்பட்டுள்ளபடியே மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: textual_variant
  - marker: b
    text: அல்லது, “சில நாட்கள் முடிந்தபின்”; “ஒரு காலப்பகுதிக்குப் பிறகு.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְכָל זֶה
  choice: ஆனால் இவையெல்லாம் நடந்துகொண்டிருந்த காலத்தில்
  rationale: வாவ் இணைப்பின் எதிர்மறைத் திருப்பத்தையும், முன்பு விவரிக்கப்பட்ட நிகழ்வுகள் நடந்த காலமெங்கும் நெகேமியா அங்கு இல்லாதிருந்த காலப்பொருளையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: לֹא הָיִיתִי בִּירוּשָׁלִָם
  choice: நான் எருசலேமில் இல்லை
  rationale: கதைச்சூழலில் கடந்தகால இல்லாமையைத் தமிழில் இயல்பாகவும் நேரடியாகவும் கூறுகிறது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: நெகேமியா எருசலேமில் இல்லாததற்கான விளக்கத்தை அறிமுகப்படுத்தும் காரணப்பொருளைப் பாதுகாக்கிறது.
- source_word: בִּשְׁנַת שְׁלֹשִׁים וּשְׁתַּיִם
  choice: ஆட்சியின் முப்பத்திரண்டாம் ஆண்டில்
  rationale: அரசரின் ஆட்சியாண்டைக் குறிக்கும் எபிரெய வழக்கைத் தெளிவான நவீனத் தமிழில் தருகிறது; ‘ஆட்சியின்’ என்பது தமிழில் தேவையான சூழலை வெளிப்படையாக்குகிறது.
- source_word: לְאַרְתַּחְשַׁסְתְּא
  choice: அர்தசஷ்டாவின்
  rationale: தமிழ் வேதாகமப் பெயர்வழக்கில் அறியப்பட்ட ஒலிபெயர்ப்பைப் பயன்படுத்துகிறது.
- source_word: מֶלֶךְ בָּבֶל
  choice: பாபிலோனின் அரசனாகிய
  rationale: பாரசீகப் பேரரசுச் சூழலுடன் ஒத்திசைக்காமல், எபிரெய மூலத்தில் உள்ள ‘பாபிலோனின் அரசன்’ என்ற வாசகத்தை அப்படியே பாதுகாக்கிறது.
- source_word: בָּאתִי אֶל הַמֶּלֶךְ
  choice: நான் அரசனிடம் சென்றிருந்தேன்
  rationale: בוא என்பதன் சூழல்சார்ந்த ‘செல்’ பொருளைத் தமிழில் இயல்பாகத் தருகிறது; முந்தைய இல்லாமைக்குக் காரணமான முன்னிகழ்வை ‘சென்றிருந்தேன்’ தெளிவுபடுத்துகிறது.
- source_word: וּלְקֵץ יָמִים
  choice: சில காலத்திற்குப் பிறகு
  rationale: சொல்லாட்சியாக ‘நாட்களின் முடிவில்’ என்றாலும், இங்கு கால அளவு குறிப்பிடப்படாத இடைவெளியைக் குறிக்கும் எபிரெய மரபுத்தொடரின் பொருளை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: נִשְׁאַלְתִּי מִן הַמֶּלֶךְ
  choice: அரசனிடம் விடுப்பு கேட்டேன்
  rationale: இச்சூழலில் நிஃபால் வடிவம் அனுமதி அல்லது விடுப்பு கோருவதைக் குறிக்கிறது. விடுப்பு வழங்கப்பட்டது என்று மூலத்தைவிட அதிகமாகக் கூறாமல், நெகேமியாவின் கோரிக்கையை மட்டும் தெரிவிக்கிறது.
