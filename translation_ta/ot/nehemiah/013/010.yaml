  source_fidelity: 'மூல எபிரெயத்தின் பொருளைத் துல்லியமாகக் கொடுக்கிறது: நெகேமியா நிலைமையை அறிந்தது, லேவியருக்கான பங்குகள் வழங்கப்படாதது, அதன் விளைவாகப் பணியாற்றிய லேவியர்களும் பாடகர்களும் அவரவர் வயல்களுக்குச் சென்றது ஆகியவை அனைத்தும் பாதுகாக்கப்பட்டுள்ளன. ‘அவரவர் வயலுக்கு’ என்பது אִישׁ לְשָׂדֵהוּ என்பதன் பகிர்வுப் பொருளை இயல்பாகத் தருகிறது.'
