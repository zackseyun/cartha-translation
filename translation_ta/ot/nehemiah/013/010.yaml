source:
  edition: WLC
  text: וָ/אֵ֣דְעָ֔/ה כִּֽי מְנָי֥וֹת הַ/לְוִיִּ֖ם לֹ֣א נִתָּ֑נָה וַ/יִּבְרְח֧וּ אִישׁ לְ/שָׂדֵ֛/הוּ הַ/לְוִיִּ֥ם וְ/הַ/מְשֹׁרְרִ֖ים עֹשֵׂ֥י הַ/מְּלָאכָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/010.yaml
  text: And I learned that the portions of the Levites had not been given[b][a], so the Levites and the singers who did the work had each fled to his field.
translation:
  language: ta
  text: 'லேவியர்களுக்குரிய பங்குகள்[a] கொடுக்கப்படவில்லை என்பதை நான் அறிந்துகொண்டேன். அதனால் பணியில் ஈடுபட்டிருந்த லேவியர்களும் பாடகர்களும் அவரவர் வயலுக்குத்[b] தப்பிச் சென்றிருந்தார்கள்.


    [a] அல்லது, “லேவியர்களுக்கென ஒதுக்கப்பட்ட பங்குகள்.”

    [b] எபிரெயத்தில், “ஒவ்வொருவனும் தன் வயலுக்கு.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “லேவியர்களுக்கென ஒதுக்கப்பட்ட பங்குகள்.”
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில், “ஒவ்வொருவனும் தன் வயலுக்கு.”
    reason: literal_rendering
lexical_decisions:
- source_word: וָאֵדְעָה
  choice: நான் அறிந்துகொண்டேன்
  rationale: ידע இங்கு நிலையான அறிவை அல்ல, நெகேமியா ஒரு நிலைமையைத் தெரிந்துகொண்டதைக் குறிக்கிறது; எனவே ‘அறிந்துகொண்டேன்’ இயல்பாகவும் சூழலுக்கு ஏற்றவாறும் உள்ளது.
- source_word: מְנָיוֹת הַלְוִיִּם
  choice: லேவியர்களுக்குரிய பங்குகள்
  rationale: מְנָיוֹת என்பது அவர்களுக்கு ஒதுக்கப்பட்ட ஆதரவுப் பங்குகளைக் குறிக்கிறது. எபிரெயக் கட்டமைப்பின் உறவையும் தமிழில் தெளிவான பயனாளர் பொருளையும் இச்சொற்றொடர் வெளிப்படுத்துகிறது.
- source_word: לֹא נִתָּנָה
  choice: கொடுக்கப்படவில்லை
  rationale: נתן வினையின் செயப்பாட்டு வடிவத்தைப் பாதுகாக்கிறது. எபிரெயத்தில் வினை ஒருமையாக இருந்தாலும் provision-ஐக் கூட்டாகக் கருதியிருக்கலாம்; தமிழில் ‘பங்குகள்’ என்பதுடன் இவ்வடிவம் இயல்பாக அமைகிறது.
- source_word: וַיִּבְרְחוּ
  choice: தப்பிச் சென்றிருந்தார்கள்
  rationale: ברח என்பதன் ‘ஓடிப்போதல்/தப்பிச் செல்லுதல்’ என்ற வலிமையைத் தக்கவைக்கிறது; முந்தையதாக ஏற்பட்ட விளைவைக் காட்ட நிறைவுற்ற இறந்தகால வடிவம் பயன்படுத்தப்பட்டுள்ளது.
- source_word: אִישׁ לְשָׂדֵהוּ
  choice: அவரவர் வயலுக்கு
  rationale: சொற்றொடரின் பகிர்வுப் பொருளான ‘ஒவ்வொருவரும் தன் வயலுக்கு’ என்பதைச் சுருக்கமாகவும் இயல்பான தமிழிலும் தருகிறது.
- source_word: וְהַמְשֹׁרְרִים
  choice: பாடகர்களும்
  rationale: ஆலயச் சூழல் ஏற்கெனவே தெளிவாக இருப்பதால், எபிரெயத்தில் இல்லாத ‘ஆலய’ என்ற விளக்கச் சொல்லைச் சேர்க்காமல் நேரடியாக மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: עֹשֵׂי הַמְּלָאכָה
  choice: பணியில் ஈடுபட்டிருந்த
  rationale: இந்தப் பங்கேற்பு வினைச்சொற்றொடர் லேவியர்களையும் பாடகர்களையும் விளக்குகிறது. பணியின் தன்மையை எபிரெயத்தைவிடக் குறிப்பாக்காமல் இயல்பாக வழங்குகிறது.
