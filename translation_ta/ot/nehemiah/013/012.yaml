  text: וְ/כָל יְהוּדָ֗ה הֵבִ֜יאוּ מַעְשַׂ֧ר הַ/דָּגָ֛ן וְ/הַ/תִּיר֥וֹשׁ וְ/הַ/יִּצְהָ֖ר לָ/אוֹצָרֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/012.yaml
  text: And all Judah brought the tithe of the grain[a], the new wine, and the oil into the storehouses.
translation:
  language: ta
  text: யூதா மக்கள் அனைவரும் தானியம், புதுத் திராட்சரசம், எண்ணெய் ஆகியவற்றின் பத்தில் ஒரு பங்கைக் களஞ்சிய அறைகளுக்குக்[a] கொண்டுவந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கருவூலங்களுக்கு.” எபிரெயச் சொல் சேமிப்பு அறைகளையோ கருவூலங்களையோ குறிக்கலாம்; தானியம், திராட்சரசம், எண்ணெய் ஆகியவை குறிப்பிடப்படும் இச்சூழலில் “களஞ்சிய அறைகள்” என்பது பொருத்தமானது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כָל יְהוּדָה
  choice: யூதா மக்கள் அனைவரும்
  rationale: כָּל יְהוּדָה என்பது யூதாவின் முழுச் சமூகத்தையும் குறிக்கிறது. தமிழில் புவிப்பகுதியைக் காட்டிலும் மக்களைக் குறிக்கும் கூட்டுப்பொருள் இயல்பாகத் தெளிவதற்காக இவ்வாறு மொழிபெயர்க்கப்பட்டது.
- source_word: הֵבִיאוּ
  choice: கொண்டுவந்தார்கள்
  rationale: בוא என்பதன் Hiphil வடிவம் ‘கொண்டுவருதல்’ என்ற பொருளைத் தருகிறது; பன்மை வினைச்சொல் சமூகத்தினரின் செயலை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: מַעְשַׂר
  choice: பத்தில் ஒரு பங்கு
  rationale: இச்சொல் காணிக்கையாகச் செலுத்தப்படும் பத்திலொரு பங்கைக் குறிக்கிறது. பொதுவாசகர்களுக்கு உடனடியாகப் புரியும் வகையில் பொருள் நேரடியாக வழங்கப்பட்டுள்ளது.
- source_word: הַ/דָּגָן
  choice: தானியம்
  rationale: דָּגָן பொதுவாகப் பலவகைத் தானிய விளைபொருள்களைக் குறிக்கிறது; ‘தானியம்’ அதன் பரந்த பொருளைத் தக்கவைக்கிறது.
- source_word: וְ/הַ/תִּירוֹשׁ
  choice: புதுத் திராட்சரசம்
  rationale: תִּירוֹשׁ பொதுவான திராட்சரசத்திலிருந்து வேறுபட்டு புதிய அல்லது அண்மையில் தயாரிக்கப்பட்ட திராட்சரசத்தைக் குறிக்கக்கூடும்; அந்தச் சொல்வேறுபாடு தக்கவைக்கப்பட்டுள்ளது.
- source_word: וְ/הַ/יִּצְהָר
  choice: எண்ணெய்
  rationale: יִצְהָר இத்தகைய வேளாண் பட்டியல்களில் பொதுவாக ஒலிவ எண்ணெயைக் குறித்தாலும், மூலச்சொல் இங்கு மரவகையை வெளிப்படையாகக் குறிப்பிடாததால் ‘எண்ணெய்’ என வழங்கப்பட்டுள்ளது.
- source_word: לָ/אוֹצָרוֹת
  choice: களஞ்சிய அறைகளுக்கு
  rationale: אוֹצָרוֹת என்பது சேமிப்பு அறைகளையோ கருவூலங்களையோ குறிக்கலாம். தானியம், திராட்சரசம், எண்ணெய் ஆகியவை வைக்கப்படும் சூழலில் ‘களஞ்சிய அறைகள்’ மிகப் பொருத்தமானது.
