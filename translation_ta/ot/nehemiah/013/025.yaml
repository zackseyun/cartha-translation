base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/025.yaml
  text: 'So I contended with them and cursed them[a], and I struck some of the men and pulled out their hair, and I made them swear by God: “You shall not give your daughters to their sons[b], nor take any of their daughters for your sons or for yourselves.”'
translation:
  language: ta
  text: ஆகவே, நான் அவர்களோடு வாதாடி, அவர்களைச் சபித்தேன்; அவர்களில் சில ஆண்களை அடித்து, அவர்களுடைய முடியைப் பிடுங்கினேன். பின்பு, அவர்களைக் கடவுளின் பெயரில் சத்தியம் செய்யச் செய்து, “உங்கள் மகள்களை அவர்களுடைய மகன்களுக்குக் கொடுக்கக் கூடாது[a]; அவர்களுடைய மகள்களில் எவரையும் உங்கள் மகன்களுக்கு மணமுடிக்கவோ, நீங்களே மணந்துகொள்ளவோ கூடாது” என்றேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொல்லுக்குச் சொல், “நீங்கள் கொடுத்தால் … நீங்கள் எடுத்தால் …” என்று உள்ளது; ஆனால் ஆணைச் சூழலில் இது “கொடுக்கக் கூடாது … எடுத்துக்கொள்ளக் கூடாது” என்ற தடையை உணர்த்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאָרִיב עִמָּם
  choice: நான் அவர்களோடு வாதாடி
  rationale: ריב என்பது மோதுதல், வாதாடுதல் அல்லது ஒருவருக்கு எதிராக வழக்குரைத்தல் என்ற வலுவான பொருளைக் கொண்டது. நவீன தமிழில் இயல்பாகவும் அதன் மோதல் தன்மையைக் குறைக்காமலும் இருக்க ‘வாதாடி’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: וָאֲקַלְלֵם
  choice: அவர்களைச் சபித்தேன்
  rationale: קלל இங்கு வெறும் திட்டுதலைவிடச் சாபம் கூறுதல் அல்லது சாபத்துக்குட்படுத்துதல் என்ற பொருளைத் தருகிறது. அதன் கடுமையை மென்மைப்படுத்தாமல் ‘சபித்தேன்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: וָאַכֶּה מֵהֶם אֲנָשִׁים
  choice: அவர்களில் சில ஆண்களை அடித்து
  rationale: מֵהֶם ஒரு பகுதியைச் சுட்டுவதால், அனைவரையும் அல்ல, அவர்களில் சில ஆண்களை நெகேமியா அடித்தார் என்பது தெளிவாக்கப்பட்டுள்ளது.
- source_word: וָאֶמְרְטֵם
  choice: அவர்களுடைய முடியைப் பிடுங்கினேன்
  rationale: מרט என்பது முடியைப் பறித்தல் அல்லது பிடுங்குதல். எபிரெயத்தில் ‘முடி’ வெளிப்படையாக இல்லாவிட்டாலும் வினையின் பொருளில் அது உள்ளடங்கியுள்ளது; ‘முடி’ என்பது தலை அல்லது தாடி என்று தேவையின்றிக் குறுக்காமல் பொதுவாக வைக்கப்பட்டுள்ளது.
- source_word: וָאַשְׁבִּיעֵם בֵּאלֹהִים
  choice: அவர்களைக் கடவுளின் பெயரில் ஆணையிடச் செய்து
  rationale: שבע என்பதன் ஹிபீல் வடிவம் ஒருவரை ஆணையிடச் செய்வதைக் குறிக்கிறது. בֵּאלֹהִים ஆணையின் தெய்வீக சாட்சியையும் அதிகாரத்தையும் காட்டுவதால் தமிழில் இயல்பான ‘கடவுளின் பெயரில்’ பயன்படுத்தப்பட்டது.
- source_word: אִם תִּתְּנוּ
  choice: கொடுக்கக் கூடாது
  rationale: ஆணைச் சூழலில் אִם ஒரு சாதாரண நிபந்தனையை அல்ல, ஆணையால் உறுதிப்படுத்தப்பட்ட தடையை அறிமுகப்படுத்துகிறது. ஆகவே தமிழில் தடையின் வலிமையை இயல்பாகத் தெரிவிக்க ‘கூடாது’ பயன்படுத்தப்பட்டது.
- source_word: וְאִם תִּשְׂאוּ מִבְּנֹתֵיהֶם לִבְנֵיכֶם וְלָכֶם
  choice: அவர்களுடைய மகள்களில் எவரையும் உங்கள் மகன்களுக்கு மணமுடிக்கவோ, நீங்களே மணந்துகொள்ளவோ கூடாது
  rationale: נשא இங்கு திருமணத்திற்காகப் பெண்ணை எடுத்துக்கொள்வதைக் குறிக்கிறது. இறுதிப் பதங்கள் மகன்களுக்குத் திருமணம் ஏற்பாடு செய்வதையும் தாங்களே திருமணம் செய்வதையும் தனித்தனியாகத் தடை செய்கின்றன; இதை இயல்பான தமிழில் வெளிப்படுத்தப்பட்டுள்ளது.
theological_decisions:
- issue: நெகேமியாவின் கடுமையான ஒழுங்கு நடவடிக்கைகளை எவ்வாறு மொழிபெயர்ப்பது
  choice: சபித்தல், அடித்தல், முடியைப் பிடுங்குதல் ஆகியவற்றை நேரடியாகக் கூறுதல்
  alternative: செயல்களை வெறும் வாய்மொழிக் கண்டிப்பாக மென்மைப்படுத்துதல் அல்லது மூலத்தைவிடக் கடுமையாக விரிவாக்குதல்
  rationale: இவ்வசனம் நெகேமியாவின் கடுமையான உடன்படிக்கை அமலாக்கத்தை நேரடியாகப் பதிவு செய்கிறது. மொழிபெயர்ப்பு அவரது வன்முறையை மறைக்கவோ மூலத்தைவிட மிகைப்படுத்தவோ கூடாது.
- issue: אִם அறிமுகப்படுத்தும் ஆணைச் சூத்திரத்தின் வலிமை
  choice: ‘கூடாது’ என்ற தடையாக மொழிபெயர்த்தல்
  alternative: சொல்லுக்குச் சொல் ‘நீங்கள் கொடுத்தால்... நீங்கள் எடுத்தால்...’ என்ற நிபந்தனை வடிவைத் தக்கவைத்தல்
  rationale: இங்கு אִם ஆணையின் உள்ளடக்கத்தைத் தொடங்கும் எபிரெயச் சூத்திரமாகும். தமிழில் நிபந்தனை வடிவம் பொருளைத் தவறாக உணர்த்தக்கூடும்; தடை வடிவம் அதன் செயல்பாட்டையும் solemn oath force-ஐயும் தெளிவாகத் தருகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் வரலாற்றுச் செய்தியின் கடுமையை மறைக்காத கண்ணியமான நடையிலும் மொழிபெயர்க்கப்பட்டது. திருமணச் சூழலைத் தமிழில் இயல்பாகத் தெளிவுபடுத்த ‘மணமுடிக்க’ மற்றும் ‘மணந்துகொள்ள’ பயன்படுத்தப்பட்டுள்ளன.
