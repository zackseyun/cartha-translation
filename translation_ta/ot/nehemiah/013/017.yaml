  text: וָ/אָרִ֕יבָ/ה אֵ֖ת חֹרֵ֣י יְהוּדָ֑ה וָ/אֹמְרָ֣/ה לָ/הֶ֗ם מָֽה הַ/דָּבָ֨ר הָ/רָ֤ע הַ/זֶּה֙ אֲשֶׁ֣ר אַתֶּ֣ם עֹשִׂ֔ים וּֽ/מְחַלְּלִ֖ים אֶת י֥וֹם הַ/שַּׁבָּֽת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/017.yaml
  text: So I contended with the nobles of Judah and said to them[a], “What is this evil thing that you are doing, profaning the Sabbath day?”
translation:
  language: ta
  text: அப்போது நான் யூதாவின் பிரபுக்களுடன் வாதாடி, அவர்களிடம், “நீங்கள் ஓய்வுநாளைத் தீட்டுப்படுத்தி செய்யும் இந்தத் தீய செயல் என்ன?” என்று சொன்னேன்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וָאָרִיבָה
  choice: ஆகவே, நான் ... வாதாடி
  rationale: ריב என்பதன் எதிர்த்து வாதிடுதல், கண்டித்தல், குற்றஞ்சாட்டுதல் ஆகிய வலிமையை ‘வாதாடி’ இயல்பாகத் தக்கவைக்கிறது; தொடக்க வாவ் முந்தைய நிகழ்வின் விளைவுத் தொடர்ச்சியாக ‘ஆகவே’ என வழங்கப்பட்டுள்ளது.
- source_word: חֹרֵי יְהוּדָה
  choice: யூதாவின் பிரபுக்கள்
  rationale: חֹרִים என்பது சமூகத்தில் உயர்நிலையிலிருந்த முக்கிய மனிதர்களை அல்லது பிரபுக்களைக் குறிக்கிறது; ‘பிரபுக்கள்’ சமூக அந்தஸ்தைத் தெளிவாகக் காட்டுகிறது.
- source_word: וָאֹמְרָה לָהֶם
  choice: அவர்களிடம் ... என்று கேட்டேன்
  rationale: எபிரெயத்தில் நேரடியாக ‘சொன்னேன்’ என்றிருந்தாலும், தொடர்ந்து வரும் வினாவுடன் தமிழில் ‘என்று கேட்டேன்’ என்பது இயல்பான நேரடி உரை அமைப்பு.
- source_word: מָה הַדָּבָר הָרָע הַזֶּה
  choice: இந்தத் தீய செயல் என்ன?
  rationale: דָּבָר இச்சூழலில் அவர்கள் செய்த காரியத்தைக் குறிக்கிறது; רָע என்பதன் அறநெறிசார் கண்டனத்தை ‘தீய’ தக்கவைக்கிறது.
- source_word: אֲשֶׁר אַתֶּם עֹשִׂים
  choice: நீங்கள் ... செய்கிற
  rationale: எபிரெயப் பங்கேற்புவினையின் தொடர்ச்சியான செயற்பொருளை நவீன தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וּמְחַלְּלִים
  choice: தீட்டுப்படுத்தி
  rationale: חלל என்பதன் இவ்வடிவம் புனிதமானதைப் புனிதமற்றதாக அல்லது சாதாரணமானதாக நடத்துவதைக் குறிக்கிறது; ‘தீட்டுப்படுத்தி’ அந்தப் புனிதத்தன்மை மீறலை வெளிப்படுத்துகிறது.
- source_word: אֶת יוֹם הַשַּׁבָּת
  choice: ஓய்வுநாளை
  rationale: יוֹם הַשַּׁבָּת என்பதற்கு தமிழில் நிலைபெற்ற, இயல்பான வடிவம்; ‘நாள்’ என்ற கூறையும் தக்கவைக்கிறது.
theological_decisions:
- issue: ஓய்வுநாளின் புனிதத்தன்மையை மீறுவதைக் குறிக்கும் சொல்
  choice: ஓய்வுநாளைத் தீட்டுப்படுத்தி
  alternative: ஓய்வுநாளைப் புனிதக்கேடாக்கி / மீறி
  rationale: மூல வினை வெறும் கட்டளைமீறலை மட்டும் அல்லாமல், புனிதமானதைப் புனிதமற்றதாக நடத்துவதையும் குறிக்கிறது. ‘தீட்டுப்படுத்தி’ இந்தப் புனிதம்–புனிதமின்மை வேறுபாட்டைப் பாதுகாக்கிறது; மாற்றுச் சொற்கள் அடிக்குறிப்பில் தரப்பட்டுள்ளன.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. மூலத்தின் கண்டனத் தொனியும் ஓய்வுநாளின் புனிதத்தன்மை குறித்த வலிமையும் பாதுகாக்கப்பட்டுள்ளன.
