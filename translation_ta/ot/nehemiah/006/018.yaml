source:
  edition: WLC
  text: כִּי רַבִּ֣ים בִּֽ/יהוּדָ֗ה בַּעֲלֵ֤י שְׁבוּעָה֙ ל֔/וֹ כִּי חָתָ֥ן ה֖וּא לִ/שְׁכַנְיָ֣ה בֶן אָרַ֑ח וִֽ/יהוֹחָנָ֣ן בְּנ֔/וֹ לָקַ֕ח אֶת בַּת מְשֻׁלָּ֖ם בֶּ֥ן בֶּֽרֶכְיָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/006/018.yaml
  text: For many in Judah were bound by oath to him[a], because he was the son-in-law of Shecaniah son of Arah[b], and Jehohanan his son had taken the daughter of Meshullam son of Berechiah as his wife.
translation:
  language: ta
  text: ஏனெனில், யூதாவில் பலர் அவனுக்குச் சத்தியப்பிரமாணம் செய்து கட்டுப்பட்டிருந்தார்கள்[a]; ஏனெனில், அவன் ஆராகின் மகன் செக்கனியாவின் மருமகனாக இருந்தான். மேலும், அவனுடைய மகன் யெகோகானான், பெரெக்கியாவின் மகன் மெசுல்லாமின் மகளை மணந்திருந்தான்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லுக்கு நெருக்கமாக, “யூதாவில் பலர் அவனுக்குச் சத்தியப்பிரமாணம் உடையவர்களாக இருந்தார்கள்”; அதாவது, சத்தியப்பிரமாணத்தினால் அவர்கள் அவனிடம் கடமைப்பட்டிருந்தார்கள்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில், “மெசுல்லாமின் மகளை எடுத்திருந்தான்”; இது அவளை மணந்துகொண்டதைக் குறிக்கும் வழக்கமான மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: רַבִּים בִּיהוּדָה
  choice: யூதாவில் பலர்
  rationale: בִּיהוּדָה இங்கு இடத்தைக் குறிக்கிறது; யூதா மாகாணம் அல்லது சமூகத்தில் இருந்த பலரை இயல்பாகக் குறிப்பிடுகிறது.
- source_word: בַּעֲלֵי שְׁבוּעָה לוֹ
  choice: அவனுக்கு ஆணையால் கட்டுப்பட்டிருந்தார்கள்
  rationale: சொல்லுக்கு நெருக்கமாக ‘அவனுக்கான ஆணையை உடையவர்கள்’ எனப் பொருள்படும் எபிரெய மரபுத்தொடர், ஆணையினால் அவனிடம் கடமைப்பட்டிருந்ததைக் குறிக்கிறது.
- source_word: כִּי ... כִּי
  choice: ஏனெனில் ... காரணம்
  rationale: முதல் כִּי முந்தைய வசனத்துக்கான விளக்கத்தை அறிமுகப்படுத்துகிறது; இரண்டாவது, அவர்கள் ஆணையால் கட்டுப்பட்டிருந்ததற்கான காரணத்தைத் தருகிறது.
- source_word: חָתָן הוּא לִשְׁכַנְיָה
  choice: அவன் ... செக்கனியாவின் மருமகனாக இருந்தான்
  rationale: חָתָן என்பது இக்குடும்ப உறவுச் சூழலில் திருமணத்தால் ஏற்பட்ட ‘மருமகன்’ உறவைக் குறிக்கிறது.
- source_word: וִיהוֹחָנָן בְּנוֹ
  choice: அவனுடைய மகன் யெகோகானான்
  rationale: எபிரெயச் சொற்றொடரின் பெயர்ச்சொல்-பின்னிணை அமைப்பை இயல்பான தமிழில் தருகிறது; ‘அவனுடைய’ என்பதன் சுட்டு இயல்பாகத் தோபியாவைக் குறித்தாலும், மூலத்தில் பெயர் மீண்டும் கூறப்படவில்லை.
- source_word: לָקַח אֶת בַּת
  choice: மகளை மணந்திருந்தான்
  rationale: ‘மகளை எடுத்தான்’ என்பது திருமணம் செய்துகொண்டதைக் குறிக்கும் எபிரெய மரபுத்தொடர்; அதன் பொருள் நவீன தமிழில் தெளிவாக வழங்கப்பட்டுள்ளது.
- source_word: בַּת מְשֻׁלָּם בֶּן בֶּרֶכְיָה
  choice: பெரெகியாவின் மகன் மெசுல்லாமின் மகள்
  rationale: மூலத்திலுள்ள தந்தைவழிப் பெயர்த் தொடரைத் தெளிவாகவும் இயல்பாகவும் காக்கிறது.
theological_decisions:
- issue: בְּנוֹ (‘அவனுடைய மகன்’) என்பதன் முன்னிலைச் சுட்டு
  choice: பெயரைச் சேர்க்காமல் ‘அவனுடைய மகன்’ என மூலத்தின் சுட்டுப்பெயர் அமைப்பு காக்கப்பட்டது; சூழலில் அது தோபியாவின் மகனைக் குறிப்பதாக இயல்பாகப் புரிகிறது.
  alternative: ‘தோபியாவின் மகன் யெகோகானான்’ என்று வெளிப்படையாகத் தருதல்; அல்லது அருகிலுள்ள செக்கனியாவை முன்னிலையாக எடுத்தல்.
  rationale: மூல எபிரெயம் முன்னிலைப் பெயரை மீண்டும் கூறாததால், மொழிபெயர்ப்பில் அதை நிரப்புவது மூலத்தில் உள்ள இலக்கணத் தெளிவின்மையை மறைத்துவிடும். அடிக்குறிப்பு அந்தச் சிக்கலை வெளிப்படுத்துகிறது.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘ஆணையால் கட்டுப்பட்டிருந்தார்கள்’ என்பது அரசியல் அல்லது குடும்பச் சார்பான உறுதியைத் தனிப்பிரிவுச் சமயச் சொல்லாடல் இன்றி எடுத்துரைக்கிறது. பெயர்கள் எபிரெய ஒலிவடிவங்களுக்கு நெருக்கமாகத் தமிழாக்கப்பட்டுள்ளன.
