base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/006/007.yaml
  text: And you have even appointed prophets to proclaim concerning you in Jerusalem[a], saying, ‘There is a king in Judah!’ And now these reports will be heard by the king. So now, come[b], and let us consult together.
translation:
  language: ta
  text: மேலும், உம்மைக் குறித்து எருசலேமில், ‘யூதாவில் ஓர் அரசன் இருக்கிறார்!’ என்று அறிவிக்கும்படி தீர்க்கதரிசிகளைக்கூட நீர் நியமித்திருக்கிறீர்.[a] இப்போது இத்தகைய செய்திகள் அரசனின் செவிக்கு எட்டும்.[b] ஆகையால் இப்போது வாரும்; நாம் ஒன்றாக ஆலோசிப்போம்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் மேற்கோள் சுருக்கமாக, ‘யூதாவில் அரசன்’ என்று மட்டுமே உள்ளது; அது நெகேமியாவை வெளிப்படையாகப் பெயரிடவில்லை.
    reason: alternative_reading
  - marker: b
    text: ‘செய்திகள்’ என்பதற்கான எபிரெயச் சொல் ‘சொற்கள்,’ ‘காரியங்கள்’ அல்லது ‘இத்தகைய பேச்சுகள்’ என்றும் பொருள்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: மேலும் … கூட
  rationale: இணைப்பையும் வலியுறுத்தும் சேர்க்கைப் பொருளையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: נְבִיאִים הֶעֱמַדְתָּ
  choice: தீர்க்கதரிசிகளைக்கூட நீர் நியமித்திருக்கிறீர்
  rationale: נְבִיאִים என்பதன் வழக்கமான ‘தீர்க்கதரிசிகள்’ என்ற பொருளையும், ஒருவரைப் பொறுப்பில் நிறுத்தும் הֶעֱמַדְתָּ என்பதன் காரணவினைப் பொருளையும் காக்கிறது.
- source_word: לִקְרֹא עָלֶיךָ
  choice: உம்மைக் குறித்து … அறிவிக்கும்படி
  rationale: קרא உடன் வரும் על, ஒருவரைக் குறித்து பொதுவாக அறிவித்தல் என்ற பொருளைக் கொண்டுள்ளது; ‘உம்மையே அறிவிக்க’ என்று மிகைப்படுத்தாமல் முன்னிடைச்சொல்லின் உறவைப் பேணுகிறது.
- source_word: מֶלֶךְ בִּיהוּדָה
  choice: யூதாவில் ஓர் அரசன் இருக்கிறார்!
  rationale: வினைச்சொல் இல்லாத சுருக்கமான எபிரெய அறிவிப்பை இயல்பான தமிழாக்கமாக்குகிறது; மேற்கோளுக்குள் நெகேமியாவின் பெயரையோ ‘நீரே’ என்பதையோ சேர்க்கவில்லை.
- source_word: יִשָּׁמַע לַמֶּלֶךְ
  choice: அரசனின் செவிக்கு எட்டும்
  rationale: ‘அரசனுக்குக் கேட்கப்படும்’ என்ற எபிரெயச் செயப்பாட்டு எண்ணத்தை இயல்பான தமிழ் மரபுத்தொடரில் தருகிறது.
- source_word: כַּדְּבָרִים הָאֵלֶּה
  choice: இத்தகைய செய்திகள்
  rationale: דברים என்பது சொற்கள், காரியங்கள் அல்லது செய்திகள் எனப் பரந்த பொருள் தரலாம்; அரசியல் குற்றச்சாட்டுகள் அரசனை அடையும் இச்சூழலில் ‘செய்திகள்’ பொருத்தமானது.
- source_word: וְנִוָּעֲצָה יַחְדָּו
  choice: நாம் ஒன்றாக ஆலோசிப்போம்
  rationale: கூட்டாக ஆலோசிக்க அழைக்கும் விருப்பநிலை வடிவத்தையும் יַחְדָּו என்பதன் இணைந்த செயலையும் தெளிவாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: அரசுரிமைக் கோரிக்கை குறித்த குற்றச்சாட்டின் தன்மை
  choice: ‘யூதாவில் ஓர் அரசன் இருக்கிறார்!’ என்று, மேற்கோளில் நெகேமியாவை வெளிப்படையாகப் பெயரிடாமல் மொழிபெயர்த்தல்
  alternative: ‘நீரே யூதாவின் அரசர்!’ அல்லது ‘நெகேமியா யூதாவின் அரசர்!’
  rationale: எபிரெய மேற்கோள் ‘யூதாவில் அரசன்’ என்று வினைச்சொல் இல்லாமல் சுருக்கமாக உள்ளது. சூழல் நெகேமியாவையே குறிவைத்தாலும், மேற்கோளுக்குள் அவரது பெயரையோ ‘நீர்’ என்பதையோ மூலவாசகம் கூறவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ஒருமை மரியாதை வடிவங்களான ‘உம்மைக்,’ ‘நீர்,’ ‘வாரும்’ பயன்படுத்தப்பட்டுள்ளன; குற்றச்சாட்டு கடிதத்தின் அழுத்தமான தொனியும் மூலத்தின் தெளிவின்மையும் பாதுகாக்கப்பட்டுள்ளன.
