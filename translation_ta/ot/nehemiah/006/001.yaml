base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/006/001.yaml
  text: When Sanballat[a], Tobiah, Geshem the Arab[b], and the rest of our enemies heard that I had rebuilt the wall and that no breach was left in it—though up to that time I had not set up the doors in the gates—
translation:
  language: ta
  text: சன்பல்லாத், தொபியா, அரபியனான கேஷேம்[b], எங்கள் மீதமுள்ள எதிரிகள் ஆகியோர், நான் மதிலைத் திரும்பக் கட்டியதையும்[a], அதில் உடைவு எதுவும் எஞ்சியிருக்கவில்லை என்பதையும் கேள்விப்பட்டபோது—ஆயினும், அந்நேரம்வரை நான் வாசல்களில் கதவுகளைப் பொருத்தவில்லை—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நான் மதிலைக் கட்டியதையும்.” எபிரெய வினைச்சொல் நேரடியாக “கட்டினேன்” என்றே பொருள்படும்; ஏற்கெனவே இருந்த மதில் மீண்டும் கட்டப்பட்ட சூழலைக் கருத்தில் கொண்டு இங்கு “திரும்பக் கட்டியதையும்” என்று மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அரேபியாவைச் சேர்ந்த கேஷேம்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כַאֲשֶׁר
  choice: கேள்விப்பட்டபோது
  rationale: எபிரெயக் கதைத் தொடரின் இணைப்பைத் தமிழில் இயல்பான காலத் துணைவாக்கியமாகக் காட்டுகிறது; மூலத்தில் இல்லாத ‘இப்போது’ போன்ற சொல்லைச் சேர்க்கவில்லை.
- source_word: נִשְׁמַע לְ
  choice: கேள்விப்பட்டபோது
  rationale: எபிரெயத்தில் செயல்படுபவர் குறிப்பிடப்படாத வடிவம் இருந்தாலும், செய்தியைப் பெற்ற பெயரிடப்பட்டவர்களைத் தமிழில் இயல்பாக எழுவாயாக்குகிறது.
- source_word: סַנְבַלַּט ... טוֹבִיָּה ... גֶשֶׁם הָעַרְבִי
  choice: சன்பல்லாத், தொபியா, அரபியரான கேஷேம்
  rationale: பெயர்கள் எபிரெய ஒலிப்புக்கு ஏற்ப எழுத்துப்பெயர்க்கப்பட்டன; הָעַרְבִי என்பது கேஷேமின் இன அல்லது பிராந்திய அடையாளத்தைக் குறிக்கிறது.
- source_word: יֶתֶר אֹיְבֵינוּ
  choice: எங்கள் மற்ற எதிரிகள்
  rationale: יֶתֶר என்பதன் ‘மீதியானவர்கள்/மற்றவர்கள்’ என்ற பொருளையும் אֹיְבֵינוּ என்பதன் ‘எங்கள் எதிரிகள்’ என்ற பொருளையும் இயல்பாகத் தருகிறது.
- source_word: כִּי
  choice: …தையும் … என்பதையும்
  rationale: இங்கு כִּי காரணத்தைக் காட்டாமல் அவர்கள் கேட்ட செய்தியின் உள்ளடக்கத்தை அறிமுகப்படுத்துகிறது; தமிழில் இணையான பொருள்-துணைவாக்கியங்களால் அது வெளிப்படுத்தப்பட்டது.
- source_word: בָנִיתִי אֶת־הַחוֹמָה
  choice: நான் மதிலைத் திரும்பக் கட்டியிருந்ததையும்
  rationale: בנה நேரடியாக ‘கட்டு’ என்றாலும், ஏற்கெனவே இருந்த எருசலேம் மதிலின் சீரமைப்பே சூழல் என்பதால் ‘திரும்பக் கட்டு’ இயல்பாக உள்ளது; நேரடி மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: לֹא נוֹתַר בָּהּ פָּרֶץ
  choice: அதில் உடைவு எதுவும் எஞ்சியிருக்கவில்லை
  rationale: פֶּרֶץ மதிலில் ஏற்பட்ட உடைவு அல்லது திறப்பைக் குறிக்கிறது; ‘உடைவு’ கட்டுமானச் சூழலுக்கு ஏற்ற எளிய தமிழ்.
- source_word: גַּם עַד הָעֵת הַהִיא
  choice: அந்நேரம்வரை
  rationale: கதவுகள் இன்னும் பொருத்தப்படவில்லை என்ற முக்கியமான கால வரம்பைத் தெளிவாகக் காட்டுகிறது; இடைக்கோடுகள் அதன் சலுகைநிலை விளக்கத் தன்மையை வெளிப்படுத்துகின்றன.
- source_word: דְּלָתוֹת
  choice: கதவுகளை
  rationale: இது முழு வாசல் அமைப்பை அல்ல, வாசல்களில் பொருத்தப்படும் கதவுப் பலகைகளைக் குறிக்கிறது.
- source_word: לֹא הֶעֱמַדְתִּי
  choice: நான் பொருத்தியிருக்கவில்லை
  rationale: עמד என்பதன் ஹிஃபில் வடிவம் இங்கு உரிய இடத்தில் நிறுவுதல் அல்லது பொருத்துதல் என்ற பொருளில் வருகிறது; பொருத்திய முறையைத் தேவையின்றி குறிப்பாக்கவில்லை.
- source_word: בַּשְּׁעָרִים
  choice: வாசல்களில்
  rationale: கதவுகள் வாசல் அமைப்புகளுக்குள் பொருத்தப்படுவதைக் குறிக்கும் நேரடியான, இயல்பான தமிழ்.
