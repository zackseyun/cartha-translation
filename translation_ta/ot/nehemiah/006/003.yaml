base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/006/003.yaml
  text: So I sent messengers to them[a], saying, “I am doing a great work, and I cannot come down. Why should the work stop while I leave it and come down to you?”
translation:
  language: ta
  text: அப்போது நான் அவர்களிடம் தூதுவர்களை அனுப்பி, “நான் ஒரு பெரிய பணியைச் செய்துகொண்டிருக்கிறேன்; என்னால் இறங்கி வர முடியாது. நான் அதை விட்டுவிட்டு உங்களிடம் இறங்கி வரும்போது, பணி ஏன் நின்றுபோக வேண்டும்?[a]” என்று சொன்னேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நான் அதை விட்டுவிட்டு உங்களிடம் இறங்கி வரும்போது, பணி ஏன் ஓய வேண்டும்?”
    reason: שׁבת என்பதற்கு இச்சூழலில் ‘நின்றுபோ’ என்றும் ‘ஓய’ என்றும் பொருள் கொள்ளலாம்.
lexical_decisions:
- source_word: וָאֶשְׁלְחָה
  choice: அப்போது நான் அனுப்பி
  rationale: வழக்கமான எபிரெயக் கதைத் தொடரை இயல்பான நவீனத் தமிழில் அடுத்த நிகழ்வாகக் காட்டுகிறது.
- source_word: עֲלֵיהֶם
  choice: அவர்களிடம்
  rationale: שׁלח மற்றும் ‘தூதுவர்கள்’ என்பவற்றுடன் இங்கு திசையைச் சுட்டுகிறது; எதிரான செயலை அல்ல.
- source_word: מַלְאָכִים
  choice: தூதுவர்களை
  rationale: அரசியல் மற்றும் வரலாற்றுக் கதைச் சூழலில் மனிதச் செய்தியாளர்களைக் குறிக்கிறது; வானதூதர்களை அல்ல.
- source_word: מְלָאכָה גְדוֹלָה
  choice: ஒரு பெரிய பணி
  rationale: மறுகட்டுமான முயற்சியின் அளவையும் முக்கியத்துவத்தையும் உள்ளடக்கக்கூடிய மூலச் சொல்லின் விரிவைத் தக்கவைக்கிறது.
- source_word: אֲנִי עֹשֶׂה
  choice: நான் ... செய்துகொண்டிருக்கிறேன்
  rationale: சுட்டுப்பெயருடன் வரும் பங்கேற்புவினை நிகழ்ந்துகொண்டிருக்கும் செயலைக் குறிக்கிறது.
- source_word: וְלֹא אוּכַל לָרֶדֶת
  choice: என்னால் இறங்கி வர முடியாது
  rationale: ירד என்பதன் கீழ்நோக்கிய இடப்பெயர்ச்சியைப் பாதுகாத்து, நேரடிப் பேச்சில் இயல்பான தமிழைப் பயன்படுத்துகிறது.
- source_word: לָמָּה תִשְׁבַּת הַמְּלָאכָה
  choice: பணி ஏன் நின்றுபோக வேண்டும்?
  rationale: שׁבת இங்கு ஓய்வுநாள் கடைப்பிடிப்பை அல்ல, வேலை நின்றுவிடுவதைச் சுட்டுகிறது; கேள்வியின் வலியுறுத்தலையும் தக்கவைக்கிறது.
- source_word: כַּאֲשֶׁר
  choice: வரும்போது
  rationale: நெகேமியா பணியை விட்டுச் செல்லும் காலத்தில் அது நின்றுபோகும் என்ற நேரத் தொடர்பை வெளிப்படுத்துகிறது.
- source_word: אַרְפֶּהָ
  choice: நான் அதை விட்டுவிட்டு
  rationale: பெண்பால் ஒருமை பின்னொட்டு ‘பணி’யைக் குறிக்கிறது; רפה என்பதிலுள்ள பணியைத் தளர்த்திவிடுதல் அல்லது விட்டுவிடுதல் என்ற பொருளை இயல்பாக வழங்குகிறது.
- source_word: וְיָרַדְתִּי אֲלֵיכֶם
  choice: உங்களிடம் இறங்கி வரும்போது
  rationale: எருசலேமிலிருந்து கீழ்நோக்கிச் செல்லும் இடவியல் கூறையும், செய்தி பெறுபவர்களை நோக்கிய இயக்கத்தையும் பாதுகாக்கிறது.
