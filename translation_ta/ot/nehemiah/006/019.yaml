  text: Also they kept speaking of his good deeds in my presence[a], and they kept reporting my words to him[b]. Tobiah sent letters to frighten me.
translation:
  language: ta
  text: மேலும், அவர்கள் அவனைப் பற்றிய நல்லவற்றை என் முன்னிலையில் சொல்லிக்கொண்டிருந்தார்கள்[a]; நான் சொன்னவற்றை அவனிடம் தொடர்ந்து தெரிவித்து வந்தார்கள்[b]. என்னைப் பயப்பட வைப்பதற்காகத் தொபியா கடிதங்களை அனுப்பினான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அவனுடைய நல்ல செயல்களை’ அல்லது ‘அவனுடைய நல்ல பண்புகளை.’ எபிரெயச் சொற்றொடர் செயல்களை மட்டும் குறிக்காமல் பரந்த பொருளுடையது; இங்கு தொபியாவைப் பற்றி நெகேமியாவின் முன்னிலையில் சாதகமாகச் சொல்லப்பட்டவற்றைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: சொல்லுக்குச் சொல், ‘என் வார்த்தைகளை அவனிடம் வெளியே கொண்டுசென்றார்கள்’; நெகேமியா சொன்னவற்றைத் தொபியாவிடம் எடுத்துச் சென்று தெரிவித்தார்கள் என்பதே பொருள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: மேலும்
  rationale: முந்தைய நிகழ்வுகளுடன் இன்னொரு அம்சத்தைச் சேர்க்கும் எபிரெயச் சொல்லின் கூட்டல் பொருளை இயல்பாகத் தருகிறது.
- source_word: טוֹבֹתָיו
  choice: அவனுடைய நல்ல செயல்கள்
  rationale: ‘அவனுடைய நல்லவை’ என்று விரிவாகப் பொருள்படக்கூடிய பன்மை வடிவம்; இச்சூழலில் தொபியாவைப் பற்றிய சாதகமான செயல்கள் அல்லது பண்புகளைக் குறிக்கிறது.
- source_word: הָיוּ אֹמְרִים
  choice: தொடர்ந்து புகழ்ந்து பேசினார்கள்
  rationale: היה உடன் வரும் பங்கேற்புவினை கடந்தகாலத்தில் நீடித்த அல்லது மீண்டும் மீண்டும் நடந்த செயலைக் காட்டுகிறது; சூழல் சாதகமாகப் பேசுவதைத் தெளிவாக்குகிறது.
- source_word: לְפָנַי
  choice: என் முன்னிலையில்
  rationale: ‘எனக்கு முன்பாக’ என்ற நேரடிப் பொருளை இயல்பான நவீன தமிழில் காக்கிறது.
- source_word: וּדְבָרַי
  choice: நான் சொன்னவை
  rationale: ‘என் வார்த்தைகள்’ என்பதன் இயல்பான தமிழ் வடிவம்; இங்கு நெகேமியாவின் பேச்சு தொபியாவிடம் எடுத்துச் சொல்லப்பட்டதைச் சுட்டுகிறது.
- source_word: הָיוּ מוֹצִיאִים לוֹ
  choice: அவனிடம் தொடர்ந்து தெரிவித்தார்கள்
  rationale: சொல்லுக்குச் சொல் ‘அவனிடம் வெளியே கொண்டுசென்றார்கள்’; தகவலை எடுத்துச் சொல்லுதல் என்ற சூழல்சார் பொருளையும் தொடர்ச்சியான செயலையும் தருகிறது.
- source_word: אִגְּרוֹת
  choice: கடிதங்கள்
  rationale: எழுத்துவழித் தகவல் பரிமாற்றத்திற்கான இயல்பான நவீன தமிழ்ச் சொல்.
- source_word: שָׁלַח
  choice: அனுப்பினான்
  rationale: எளிய கதைநடை வினையை நேரடியாக வழங்குகிறது.
- source_word: לְיָרְאֵנִי
  choice: என்னை அச்சுறுத்துவதற்காக
  rationale: கடிதங்களை அனுப்பியதன் நோக்கம் நெகேமியாவுக்கு அச்சத்தை உண்டாக்குவதாக இருந்ததைத் தெளிவாகவும் சுருக்கமாகவும் தருகிறது.
