translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய வினை அமைப்பிலுள்ள தொடர்ச்சியான செயல் ‘தொடர்ந்து’ என்பதால் வெளிப்படுத்தப்பட்டுள்ளது; மூலத்தின் சொற்பொருள் விரிவும் மொழிவழக்குச் சிறப்பும் அடிக்குறிப்புகளில் பாதுகாக்கப்பட்டுள்ளன.
