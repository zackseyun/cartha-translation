reference: Nehemiah 6:11
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וָ/אֹמְרָ֗/ה הַ/אִ֤ישׁ כָּמ֨וֹ/נִי֙ יִבְרָ֔ח וּ/מִ֥י כָמ֛וֹ/נִי אֲשֶׁר יָב֥וֹא אֶל הַ/הֵיכָ֖ל וָ/חָ֑י לֹ֖א אָבֽוֹא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/006/011.yaml
  text: But I said[a], “Should a man like me flee? And who is like me, who could go into the temple and live? I will not go in.”
translation:
  language: ta
  text: ஆனால் நான், “என்னைப் போன்ற ஒருவன் தப்பி ஓடுவதா? என்னைப் போன்ற ஒருவன் ஆலயத்திற்குள்[a] போய் உயிரோடிருக்க முடியுமா? நான் உள்ளே போகமாட்டேன்” என்றேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘பரிசுத்த இடத்திற்குள்’ என்றும் மொழிபெயர்க்கலாம். இங்கு ஆலயக் கட்டிடத்திற்குள் ஒளிந்துகொள்வது மட்டுமல்லாமல், நெகேமியா நுழைய அனுமதிக்கப்படாத ஆலயப் பகுதிக்குள் செல்வதும் குறிக்கப்பட்டிருக்கலாம். அதனால் ‘உயிரோடிருக்க’ என்ற சொல் வலிமை பெறுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֹמְרָה
  choice: ஆனால் நான் … என்றேன்
  rationale: வாவ் தொடர்ச்சியான நிகழ்வை முன்னெடுத்தாலும், முந்தைய ஆலோசனையை நெகேமியா மறுப்பதால் சூழலில் உள்ள எதிர்மறைத் திருப்பத்தை ‘ஆனால்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: הָאִישׁ כָמוֹנִי
  choice: என்னைப் போன்ற ஒருவன்
  rationale: குறிப்பிட்ட ஒருவரைச் சுட்டாமல், நெகேமியாவின் நிலை மற்றும் பொறுப்பை முன்வைக்கும் பொதுவான, மரியாதை நிறைந்த சொல்லாட்சியாக உள்ளது.
- source_word: יִבְרָח
  choice: தப்பி ஓடுவதா?
  rationale: பயந்து ஓடுவதையோ பின்வாங்குவதையோ குறிக்கும் வினைச்சொல்லின் வலிமையை நவீன தமிழில் இயல்பாகத் தருகிறது.
- source_word: וּמִי כָמוֹנִי אֲשֶׁר יָבוֹא
  choice: என்னைப் போன்ற ஒருவன் … போய் … முடியுமா?
  rationale: எபிரெயச் சொற்றொடரின் சற்றே நீள்வட்டமான அமைப்பை இயல்பான தமிழ்க் கேள்வியாக்கி, நம்பமுடியாமையையும் மறுப்பையும் உணர்த்தும் சொல்லாட்சியைப் பாதுகாக்கிறது.
- source_word: הַהֵיכָל
  choice: ஆலயத்திற்குள்
  rationale: இங்கு ஆலயக் கட்டிடம் அல்லது அதன் பரிசுத்த உட்பகுதியைக் குறிக்கலாம். பொதுவாசகருக்குத் தெளிவான ‘ஆலயம்’ முதன்மை உரையில் வைக்கப்பட்டு, குறிப்பான மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: וָחָי
  choice: உயிரோடிருக்க முடியுமா?
  rationale: உள்ளே சென்ற பின் உயிருடன் இருப்பது அல்லது உயிர் தப்புவது என்ற விளைவைத் தருகிறது; கேள்வியின் இயல்பான தமிழ்ச் சொல்லமைப்பிற்காக ‘முடியுமா’ சேர்க்கப்பட்டுள்ளது.
- source_word: לֹא אָבוֹא
  choice: நான் உள்ளே போகமாட்டேன்
  rationale: முந்தைய ‘உள்ளே போதல்’ என்ற கருத்தை மீண்டும் கூறும் உறுதியான முதலாம் நபர் மறுப்பை இயல்பாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: ஆலயத்திற்குள் நுழைவதன் உட்பொருள்
  choice: நெகேமியா வெறுமனே ஒளிந்துகொள்வதை மட்டுமல்லாமல், தனக்குத் தகாத அல்லது அனுமதிக்கப்படாத ஆலயப் பகுதிக்குள் செல்வதையும் மறுப்பதாக இருக்கக்கூடிய வாசிப்பு திறந்துவைக்கப்பட்டுள்ளது.
  alternative: வழிபாட்டு விதிமீறல் எதையும் சுட்டாமல், ஆலயத்தில் ஒளிந்துகொள்ளும் தந்திரத்தை மட்டுமே நெகேமியா மறுக்கிறார்.
  rationale: சூழலில் இந்த ஆலோசனை நெகேமியாவைப் பாவத்தில் சிக்கவைத்து அவப்பெயருக்கு உள்ளாக்கும் முயற்சியாகத் தெரிகிறது. எனினும் வசனமே ஆலயப் பகுதியின் எல்லையைத் தெளிவாகக் கூறாததால், முதன்மை உரை அதைத் தீர்மானிக்காமல் அடிக்குறிப்பில் சாத்தியத்தை விளக்குகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், உரையாடலுக்கேற்ற இயல்பும் நெகேமியாவின் உறுதியான மறுப்புக்கேற்ற கண்ணியமும் பேணப்பட்டுள்ளன. இரண்டு வினாக்களும் சொல்லாட்சிசார் வினாக்களாகத் தெளிவாக அமைக்கப்பட்டுள்ளன.
