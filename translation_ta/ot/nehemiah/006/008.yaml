  text: וָ/אֶשְׁלְחָ֤/ה אֵלָי/ו֙ לֵ/אמֹ֔ר לֹ֤א נִֽהְיָה֙ כַּ/דְּבָרִ֣ים הָ/אֵ֔לֶּה אֲשֶׁ֖ר אַתָּ֣ה אוֹמֵ֑ר כִּ֥י מִֽ/לִּבְּ/ךָ֖ אַתָּ֥ה בוֹדָֽא/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/006/008.yaml
  text: So I sent to him[a], saying, “These things that you are saying have not happened, for you are inventing them out of your own heart.”
translation:
  language: ta
  text: அப்போது நான் அவனிடம், “நீ சொல்லுகிற இந்தக் காரியங்கள் நடந்ததே இல்லை; இவற்றை உன் மனத்திலிருந்தே நீ இட்டுக்கட்டுகிறாய்[a]” என்று சொல்லியனுப்பினேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இவற்றை உன் உள்ளத்திலிருந்தே நீ புனைந்துரைக்கிறாய்.”
    reason: בדא என்பதற்கு ‘இட்டுக்கட்டுதல்,’ ‘புனைதல்’ என்ற பொருள்கள் உண்டு. மாற்று வாசகம் எபிரெய ‘இதயம்/உள்ளம்’ உருவகத்தையும் கண்ணியமான இலக்கிய நடையையும் வெளிப்படுத்துகிறது.
lexical_decisions:
- source_word: וָאֶשְׁלְחָה אֵלָיו לֵאמֹר
  choice: அதற்கு நான் அவனிடம் … என்று சொல்லியனுப்பினேன்
  rationale: தொடர்ந்து நிகழும் கதைச் செயலை ‘அதற்கு’ இயல்பாகக் காட்டுகிறது; ‘சொல்லியனுப்பினேன்’ என்பது அனுப்புதல் மற்றும் மேற்கோள் அறிமுகம் ஆகிய இரண்டையும் நவீனத் தமிழில் சுருக்கமாக வெளிப்படுத்துகிறது.
- source_word: לֹא נִהְיָה כַּדְּבָרִים הָאֵלֶּה
  choice: நீ சொல்லுகிற இந்தக் காரியங்கள் நடந்ததே இல்லை
  rationale: היה இங்கு குற்றச்சாட்டுகளில் கூறப்பட்ட சம்பவங்கள் உண்மையில் நிகழ்ந்ததை மறுக்கிறது. ‘நடந்ததே இல்லை’ அந்த வலியுறுத்தப்பட்ட மறுப்பை இயல்பாகத் தருகிறது; דברים என்பதன் பரந்த பொருளை ‘காரியங்கள்’ காக்கிறது.
- source_word: אֲשֶׁר אַתָּה אוֹמֵר
  choice: நீ சொல்லுகிற
  rationale: எபிரெயப் பங்கேற்பெயரின் தொடர்நிலைச் சொல்லும் வலிமையை நிகழ்காலத் தமிழ் வடிவம் வெளிப்படுத்துகிறது.
- source_word: מִלִּבְּךָ
  choice: உன் உள்ளத்திலிருந்தே
  rationale: לֵב என்பது சிந்தனை, நோக்கம் உள்ளிட்ட அக மனிதனைச் சுட்டுகிறது. ‘உள்ளம்’ மூலமொழியின் உருவகத்தைப் பாதுகாக்கிறது; ‘-ஏ’ அது வேறு ஆதாரமின்றி அவனிடமிருந்தே வந்தது என்பதை வலியுறுத்துகிறது.
- source_word: בּוֹדָאם
  choice: இவற்றை … நீ புனைந்துரைக்கிறாய்
  rationale: בדא என்பதன் ‘புனைதல், இட்டுக்கட்டுதல்’ என்ற பொருளைத் தெளிவாகவும் கண்ணியமான நடையிலும் தருகிறது; எபிரெயச் சொல்லிலுள்ள பன்மைச் சுட்டுப்பெயரை ‘இவற்றை’ வெளிப்படையாகக் காட்டுகிறது.
