base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/006/012.yaml
  text: Then I recognized, and behold, God had not sent him; rather, he had spoken the prophecy against me because Tobiah and Sanballat had hired him.
translation:
  language: ta
  text: 'அப்போது நான் உணர்ந்துகொண்டேன்: இதோ, கடவுள் அவனை அனுப்பவில்லை; மாறாக, தொபியாவும் சன்பல்லாத்தும் அவனுக்குக் கூலி கொடுத்திருந்ததால், அவன் எனக்கு எதிராக அந்தத் தீர்க்கதரிசனத்தைச் சொல்லியிருந்தான்.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וָאַכִּירָה
  choice: நான் உணர்ந்துகொண்டேன்
  rationale: הכיר என்ற வினையின் சூழல்சார் பொருள் ஒன்றின் உண்மை நிலையை அறிந்து கண்டுகொள்வது; இயல்பான நவீனத் தமிழில் இதைத் தெளிவாகக் காட்டுகிறது.
- source_word: וְהִנֵּה
  choice: இதோ
  rationale: திடீர் உணர்வையும் கவன ஈர்ப்பையும் குறிக்கும் எபிரெய இடைச்சொல்லின் வலிமையைப் பேணுகிறது.
- source_word: הַנְּבוּאָה
  choice: அந்தத் தீர்க்கதரிசனம்
  rationale: குறிப்பிட்ட தீர்க்கதரிசன உரையைச் சுட்டும் definite வடிவத்தைப் பேணுகிறது.
- source_word: דִּבֶּר עָלַי
  choice: எனக்கு எதிராக ... சொல்லியிருந்தான்
  rationale: עַל இங்கு நேகேமியாவுக்கு எதிரான நோக்கை உணர்த்துகிறது; தமிழில் இயல்பான வாக்கிய அமைப்புக்காக வினை பிரிக்கப்பட்டுள்ளது.
- source_word: שְׂכָרוֹ
  choice: அவனுக்குக் கூலி கொடுத்திருந்ததால்
  rationale: שׂכר என்பது இங்கு பணம் கொடுத்து ஒருவரைத் தங்கள் நோக்கத்திற்குப் பயன்படுத்தியதைச் சுட்டுகிறது; காரணத் தொடர்பையும் நிறைவுற்ற முன்னிகழ்வையும் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: தீர்க்கதரிசனத்தின் மூலமும் நம்பகத்தன்மையும்
  choice: கடவுள் அவனை அனுப்பவில்லை; அவன் கூலிக்காகத் தீர்க்கதரிசனம் சொன்னான்
  alternative: அவன் பொய்த் தீர்க்கதரிசி என்று வெளிப்படையாகப் பெயரிடுதல்
  rationale: மூலவசனம் கடவுள் அனுப்பவில்லை என்றும் மனிதர்களால் கூலிக்கு அமர்த்தப்பட்டான் என்றும் கூறுகிறது; ஆனால் அவனை நேரடியாக 'பொய்த் தீர்க்கதரிசி' என்று பெயரிடுவதில்லை. ஆகவே உரையின் தீர்ப்பை மட்டும் பேணுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; dignified ஆனாலும் சாதாரண வாசகர்களுக்குப் புரியும் நடை. எபிரெய உரையின் உணர்தல்–விளக்கம்–காரணம் என்ற நகர்வை இருபுள்ளி மற்றும் அரைப்புள்ளி மூலம் தெளிவாகப் பேணியுள்ளது.
