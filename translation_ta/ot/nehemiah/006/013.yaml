  text: לְמַ֤עַן שָׂכוּר֙ ה֔וּא לְמַֽעַן אִירָ֥א וְ/אֶֽעֱשֶׂה כֵּ֖ן וְ/חָטָ֑אתִי וְ/הָיָ֤ה לָ/הֶם֙ לְ/שֵׁ֣ם רָ֔ע לְמַ֖עַן יְחָֽרְפֽוּ/נִי־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/006/013.yaml
  text: 'He was hired for this purpose: that I should become afraid and act that way and sin[a], so that they would have grounds for an evil report[b], in order that they might reproach me.'
translation:
  language: ta
  text: நான் பயந்து, அப்படிச் செய்து பாவம் செய்ய வேண்டும் என்பதற்காகவே அவன் கூலிக்கு அமர்த்தப்பட்டிருந்தான்[a]. எனக்குக் கெட்ட பெயர் உண்டாக்க அவர்களுக்கு ஆதாரம் கிடைக்கவும், அவர்கள் என்னை நிந்திப்பதற்காகவும் அவ்வாறு செய்தார்கள்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அவன் இதற்காகப் பணம் கொடுக்கப்பட்டிருந்தான்’ அல்லது ‘இதற்காக அவனுக்கு லஞ்சம் கொடுக்கப்பட்டிருந்தது’ என்றும் மொழிபெயர்க்கலாம். שָׂכוּר என்ற எபிரெயச் சொல் நேரடியாக ‘கூலிக்கு அமர்த்தப்பட்ட’ அல்லது ‘பணம் கொடுக்கப்பட்ட’ என்று பொருள்படும்; ‘லஞ்சம் கொடுக்கப்பட்ட’ என்பது அதன் தீய நோக்கத்தை இன்னும் வெளிப்படையாகக் கூறுகிறது.
    reason: lexical_alternative
  - marker: b
    text: சொல்லுக்குச் சொல், ‘அது அவர்களுக்குக் கெட்ட பெயராக இருக்கும்.’ நெகேமியா செய்யும் பாவத்தைப் பயன்படுத்தி அவருக்குக் கெட்ட பெயர் உண்டாக்கவோ அவரைப் பற்றி அவதூறு பரப்பவோ எதிரிகளுக்கு ஆதாரம் கிடைக்கும் என்பதே இங்கு பொருளாக இருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַעַן
  choice: என்பதற்காகவே / அதனால்
  rationale: இச்சொல் மூன்று முறை வந்து நோக்கத்தையும் அதன் விளைவையும் குறிக்கிறது. தமிழில் இயல்பாக அமைய, முதலிரண்டு இடங்களில் நோக்கத்தையும் கடைசி இடத்தில் அதன் தொடர்விளைவையும் தெளிவுபடுத்தும் வகையில் மொழிபெயர்க்கப்பட்டது.
- source_word: שָׂכוּר
  choice: கூலிக்கு அமர்த்தப்பட்டிருந்தான்
  rationale: செயப்பாட்டு வினையெச்சம் நேரடியாக ‘கூலிக்கு அமர்த்தப்பட்டவன்’ அல்லது ‘பணம் கொடுக்கப்பட்டவன்’ என்று பொருள்படும். சூழலிலுள்ள தீய நோக்கத்தை ‘லஞ்சம் கொடுக்கப்பட்டான்’ என மூலத்தைவிட வெளிப்படையாக மாற்றாமல் அடிப்படைப் பொருள் காக்கப்பட்டது.
- source_word: אִירָא
  choice: நான் பயந்து
  rationale: לְמַעַן என்பதற்குப் பின் வரும் இவ்வினை, நெகேமியாவைப் பயமுறுத்துவதே திட்டமிட்ட நோக்கம் என்பதைத் தெரிவிக்கிறது.
- source_word: וְאֶעֱשֶׂה כֵן
  choice: அப்படிச் செய்து
  rationale: ‘அவ்வாறு செய்வேன்’ என்ற எபிரெயச் சொற்றொடரின் இயல்பான, சுருக்கமான தமிழாக்கம்; முந்தைய சூழலில் முன்மொழியப்பட்ட செயலையே சுட்டுகிறது.
- source_word: וְחָטָאתִי
  choice: பாவம் செய்ய
  rationale: பயத்தால் அந்தச் செயலைச் செய்வதன் நோக்கப்பட்ட விளைவு பாவம் செய்வதாகும்; தமிழில் தொடர்ச்சியான நோக்க வாக்கியமாக வழங்கப்பட்டது.
- source_word: וְהָיָה לָהֶם לְשֵׁם רָע
  choice: எனக்குக் கெட்ட பெயர் உண்டாக்க அவர்களுக்கு ஆதாரம் கிடைக்கும்
  rationale: சொல்லுக்குச் சொல் ‘அது அவர்களுக்குக் கெட்ட பெயராக இருக்கும்’ எனும் மரபுத்தொடர், நெகேமியாவுக்கு எதிராகக் கெட்ட பெயரைப் பரப்ப எதிரிகள் பயன்படுத்தக்கூடிய ஆதாரத்தைக் குறிக்கிறது. செயற்பாட்டு பொருள் தெளிவாகவும் மூல உருவகம் அடிக்குறிப்பிலும் காக்கப்பட்டுள்ளது.
- source_word: יְחָרְפוּנִי
  choice: அவர்கள் என்னை நிந்திக்க முடியும்
  rationale: חרף என்பது நிந்தித்தல், பழித்தல், இகழ்தல் ஆகிய பொருள்களைக் கொண்டது. பகைவர்கள் பொதுவெளியில் நெகேமியாவைப் பழிக்க நினைத்த சூழலுக்கு ‘நிந்திக்க’ பொருத்தமானது.
