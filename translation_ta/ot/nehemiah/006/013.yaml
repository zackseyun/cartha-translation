translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் அதேவேளையில் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. எபிரெய வாக்கியத்தின் தொடர்ச்சியான நோக்கம்–விளைவு அமைப்பு இயல்பான தமிழில் இரண்டு வாக்கியங்களாக வழங்கப்பட்டுள்ளது; ‘கெட்ட பெயர்’ என்ற மூல உருவகம் தக்கவைக்கப்பட்டுள்ளது.
