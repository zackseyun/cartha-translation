base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/006/002.yaml
  text: So Sanballat and Geshem sent to me[a], saying, “Come[b], and let us meet together in the villages in the plain of Ono.” But they were planning to do me harm.
translation:
  language: ta
  text: அப்போது சன்பல்லாத்தும் கேஷேமும் என்னிடம் செய்தி அனுப்பி, “வா, ஓனோவின் சமவெளியிலுள்ள கிராமங்களில்[a] நாம் ஒன்றாகச் சந்திப்போம்” என்று கூறினார்கள். ஆனால் அவர்கள் எனக்குத் தீங்கு செய்யத் திட்டமிட்டிருந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, எபிரேயச் சொல்லை இடப்பெயராகக் கொண்டால், “கெபிரீமில்.”
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: ஆளனுப்பி … சொல்லச் செய்தார்கள்
  rationale: ‘அனுப்பினான்’ என்பதே எபிரெய வடிவம்; தொடர்ந்து வரும் ‘சொல்லி’ என்ற செய்தியறிவிப்பு சூழலில், இயல்பான தமிழில் செய்தி கொண்டுசெல்ல ஆளை அனுப்பிய பொருளைத் தெளிவுபடுத்துகிறது. கூட்டெழுவாய்க்கேற்ப தமிழ் பன்மை வினை பயன்படுத்தப்பட்டுள்ளது.
- source_word: סַנְבַלַּט וְגֶשֶׁם
  choice: சன்பல்லாத்தும் கேஷேமும்
  rationale: தனிப்பெயர்கள் தமிழில் ஒலிபெயர்க்கப்பட்டு, கூட்டெழுவாய் இயல்பாக ‘-உம் … -உம்’ அமைப்பில் தரப்பட்டுள்ளது.
- source_word: לֵאמֹר
  choice: என்று சொல்லச் செய்தார்கள்
  rationale: நேர்கூற்றை அறிமுகப்படுத்தும் எபிரெய கதைசொல்லல் சூத்திரத்தை, முன்வரும் ‘ஆளனுப்பி’ என்பதுடன் இயல்பாக இணைக்கிறது.
- source_word: לְכָה
  choice: வாருங்கள்
  rationale: அடிப்படை வினை ‘செல்/நட’ என்றாலும், இங்கு அழைப்பு மரபில் ‘வாருங்கள்’ என்பதே இயல்பான நவீனத் தமிழ்.
- source_word: וְנִוָּעֲדָה יַחְדָּו
  choice: நாம் ஒன்றாகச் சந்திப்போம்
  rationale: நியமிக்கப்பட்ட சந்திப்பையும் הדדיות உணர்வையும் ‘சந்திப்போம்’ தெரிவிக்கிறது; יַחְדָּו என்பதற்காக ‘ஒன்றாக’ வெளிப்படையாக வைக்கப்பட்டுள்ளது.
- source_word: בַּכְּפִירִים
  choice: கிராமங்களில்
  rationale: இவ்வடிவத்தைப் பொதுப்பெயரான ‘கிராமங்கள்’ என்று எடுத்துக்கொள்வது சூழலுக்கு ஏற்றது. இடப்பெயராகப் புரிந்துகொள்ளும் வாய்ப்பு அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
- source_word: בְּבִקְעַת אוֹנוֹ
  choice: ஓனோ சமவெளியில்
  rationale: בִּקְעָה என்பது அகன்ற பள்ளத்தாக்கு அல்லது சமவெளியைக் குறிக்கலாம். இங்குள்ள நிலவியல் பொருளுக்கு ‘சமவெளி’ வாசிக்க எளிதானது; ‘பள்ளத்தாக்கு’ அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: וְהֵמָּה חֹשְׁבִים
  choice: ஆனால் அவர்கள் … திட்டமிட்டிருந்தார்கள்
  rationale: அழைப்பின் வெளிப்படையான நோக்கத்துக்கும் மறைந்த நோக்கத்துக்கும் உள்ள முரண்பாட்டை ‘ஆனால்’ காட்டுகிறது; חֹשְׁבִים இங்கு வெறும் சிந்தனையல்ல, தீங்கு வகுக்கும் திட்டத்தைக் குறிக்கிறது.
- source_word: לַעֲשׂוֹת לִי רָעָה
  choice: எனக்குத் தீங்கு செய்ய
  rationale: தீமையின் துல்லிய வடிவத்தை ஊகிக்காமல், நெகேமியாவுக்கு எதிரான பகைநோக்கை இயல்பான தமிழில் தெரிவிக்கிறது.
