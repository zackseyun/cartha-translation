  text: Then Sanballat sent his servant to me a fifth time in this manner[a], with an open letter in his hand.
translation:
  language: ta
  text: பின்பு சன்பல்லாத் ஐந்தாவது முறையாக இதுபோல் தன் பணியாளனை என்னிடம் அனுப்பினான்; அவன் கையில் திறந்த ஒரு கடிதம் இருந்தது.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘முத்திரையிடப்படாத ஒரு கடிதம்.’
    reason: ‘திறந்த’ என்பதற்கான கடிதச் சூழலிலான சொற்பொருள் மாற்றுவழி.
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: பின்பு ... அனுப்பினான்
  rationale: வாவ் தொடர்வினை கதையின் அடுத்த நிகழ்வை முன்னெடுக்கிறது; நவீன தமிழில் இயல்பான நிகழ்வுத் தொடரை இது காட்டுகிறது.
- source_word: אֵלַי
  choice: என்னிடம்
  rationale: אֶל என்ற முன்னிடைச்சொல் இங்கு தூதன் அனுப்பப்பட்ட இலக்காகப் பேசுபவரைக் குறிக்கிறது.
- source_word: סַנְבַלַּט
  choice: சன்பல்லாத்
  rationale: எபிரெயத் தனிப்பெயரின் ஒலிப்பைத் தமிழில் நெருக்கமாக எழுத்துப்பெயர்த்துள்ளது.
- source_word: כַּדָּבָר הַזֶּה
  choice: இதேபோல்
  rationale: முன்பு விவரிக்கப்பட்ட அதே முறையில் மீண்டும் அனுப்பியதைச் சுட்டும் எபிரெய மரபுத்தொடரின் இயல்பான தமிழாக்கம்.
- source_word: פַּעַם חֲמִישִׁית
  choice: ஐந்தாவது முறையாக
  rationale: செயல் எத்தனையாவது முறை நிகழ்ந்தது என்பதைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: אֶת נַעֲרוֹ
  choice: தன் பணியாளனை
  rationale: נַעַר என்பதற்கு ‘இளைஞன்’ என்றும் பொருள் உண்டு; இங்கு செய்தி கொண்டு செல்லும் சேவைப் பங்கினால் ‘பணியாளன்’ பொருத்தமானது.
- source_word: וְאִגֶּרֶת פְּתוּחָה
  choice: முத்திரையிடப்படாத ஒரு கடிதம்
  rationale: פְּתוּחָה என்பதன் அடிப்படைப் பொருள் ‘திறந்த’; கடிதச் சூழலில் அது மூடி முத்திரையிடப்படாமல், பிறர் வாசிக்கக்கூடிய நிலையில் இருந்ததைக் குறிக்கிறது.
- source_word: בְּיָדוֹ
  choice: அவனுடைய கையில்
  rationale: கடிதத்தைப் பணியாளன் நேரடியாகக் கையில் எடுத்துச் சென்றதைக் காட்டும் மூலத்தின் தெளிவான உருவகத்தைப் பேணுகிறது.
