  source_fidelity: மூல எபிரெயப் பாடத்துடன் மொழிபெயர்ப்பு நன்றாக ஒத்துப்போகிறது. מְיָרְאִים என்பதன் தொடர்ச்சியான அச்சுறுத்தும் நோக்கம், אוֹתָנוּ என்பதன் பன்மை ‘எங்களை’, கைகள் தளர்தல் என்ற உருவகம், செயப்பாட்டு ‘செய்து முடிக்கப்படாது’, மற்றும் இறுதியிலுள்ள இரண்டாம் நபர் கட்டளை வடிவிலான சுருக்கமான வேண்டுதல் ஆகியவை துல்லியமாகப் பாதுகாக்கப்பட்டுள்ளன.
