source:
  edition: WLC
  text: כִּ֣י כֻלָּ֗/ם מְיָֽרְאִ֤ים אוֹתָ֨/נוּ֙ לֵ/אמֹ֔ר יִרְפּ֧וּ יְדֵי/הֶ֛ם מִן הַ/מְּלָאכָ֖ה וְ/לֹ֣א תֵעָשֶׂ֑ה וְ/עַתָּ֖ה חַזֵּ֥ק אֶת יָדָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/006/009.yaml
  text: For all of them were trying to frighten us[a], saying, “Their hands will grow weak from the work, and it will not be done.” But now[b], strengthen my hands.
translation:
  language: ta
  text: ஏனெனில் அவர்கள் எல்லாரும், “வேலையில் அவர்களுடைய கைகள் தளர்ந்துவிடும்[a]; அது செய்து முடிக்கப்படாது” என்று சொல்லி எங்களை அச்சுறுத்த முயன்றார்கள். ஆனால் இப்போதோ, என் கைகளை வலுப்படுத்தும்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மொழிவழக்கில் கைகள் தளர்வது அல்லது தொங்கிப்போவது எனச் சொல்லப்படுகிறது; இதன் பொருள் வலிமையையோ மனவுறுதியையோ இழப்பதாகும்.
    reason: lexical_alternative
  - marker: b
    text: 'இறுதிக் கூறு கடவுளிடம் செய்யப்படும் சுருக்கமான வேண்டுதல்: “ஆனால் இப்போதோ, என் கைகளை வலுப்படுத்தும்.” இதை வேறுவிதமாகப் புரிந்துகொண்டவர்களும் உண்டு; ஆனால் எபிரெய மசோரா உயிர்க்குறிப்பு கடவுளை நோக்கிய நேரடி வேண்டுதலை ஆதரிக்கிறது.'
    reason: alternative_reading
lexical_decisions:
- source_word: מְיָרְאִים
  choice: அச்சுறுத்த முயன்றார்கள்
  rationale: ஹிஃபில் வினையெச்சம் தொடர்ந்து அச்சத்தை உண்டாக்கும் நோக்கத்துடன் அவர்கள் செயல்பட்டதைக் குறிக்கிறது; சூழலில் உள்ள நோக்கத்தையும் தொடர்ச்சியையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: אוֹתָנוּ
  choice: எங்களை
  rationale: மசோரா மெய்யெழுத்துப் பாடம் முதலாம் நபர் பன்மையைத் தெளிவாகக் கொண்டுள்ளது; வசனத்தின் முடிவில் ஒருமை வந்தாலும் இங்கு பன்மை பாதுகாக்கப்படுகிறது.
- source_word: לֵאמֹר
  choice: என்று சொல்லி
  rationale: எதிரிகளின் கூற்று அல்லது எண்ணத்தின் உள்ளடக்கத்தை அறிமுகப்படுத்தும் வழக்கமான மேற்கோள் அமைப்பு.
- source_word: יִרְפּוּ יְדֵיהֶם
  choice: அவர்களுடைய கைகள் தளர்ந்துவிடும்
  rationale: கைகள் தளர்வது என்பது வலிமையையும் மனவுறுதியையும் இழப்பதைக் குறிக்கும் எபிரெய உருவகம்; தமிழிலும் புரியக்கூடியதால் உருவகம் பாதுகாக்கப்பட்டது.
- source_word: מִן הַמְּלָאכָה
  choice: வேலையில்
  rationale: מְלָאכָה மதில் கட்டும் பணியைக் குறிக்கிறது. எபிரெய மொழிவழக்கின் பொருளை இயல்பான தமிழில் தருவதற்கு ‘வேலையில் கைகள் தளர்தல்’ என அமைக்கப்பட்டது.
- source_word: וְלֹא תֵעָשֶׂה
  choice: அது செய்து முடிக்கப்படாது
  rationale: நிஃபால் வினைவடிவின் செயப்பாட்டு பொருளைப் பாதுகாத்து, இங்கு குறிப்பிடப்படும் கட்டுமான வேலை நிறைவேறாது என்பதையும் தெளிவாக்குகிறது.
- source_word: וְעַתָּה
  choice: ஆனால் இப்போதோ
  rationale: எதிரிகளின் நோக்கத்தை விவரிப்பதிலிருந்து நெகேமியாவின் நேரடி வேண்டுதலுக்கு ஏற்படும் திருப்பத்தையும் முரண்பாட்டையும் வெளிப்படுத்துகிறது.
- source_word: חַזֵּק אֶת יָדַי
  choice: என் கைகளை வலுப்படுத்தும்
  rationale: பணிக்கான வலிமையை அளிக்கும்படி கேட்கும் மொழிவழக்கை அதன் கை உருவகத்தோடு பாதுகாக்கிறது; எதிரிகள் கைகள் தளர வேண்டும் என விரும்பியதற்கு இது நேரான எதிரொலி.
theological_decisions:
- issue: விவரிப்பிலிருந்து நேரடி இறைவேண்டுதலுக்கான பேச்சாளர் மாற்றம்
  choice: 'இறுதிக் கூறை நெகேமியா கடவுளிடம் நேரடியாகச் செய்யும் சுருக்கமான வேண்டுதலாக மொழிபெயர்த்தல்: ‘ஆனால் இப்போதோ, என் கைகளை வலுப்படுத்தும்.’'
  alternative: வேறு உயிர்க்குறிப்பை முன்வைத்து, ‘ஆனால் இப்போது நான் என் கைகளை வலுப்படுத்தினேன்’ என்ற தனக்குத்தானான ஊக்கமாகப் புரிந்துகொள்ளுதல்.
  rationale: மசோரா உயிர்க்குறிப்பு இரண்டாம் நபர் ஆண்பால் ஒருமை கட்டளையை ஆதரிக்கிறது; இது கடவுளிடம் செய்யப்படும் நேரடி வேண்டுதலாக இயல்பாகப் புரிகிறது, மேலும் நெகேமியா நூலில் காணப்படும் சுருக்கமான ஜெபங்களுக்கும் பொருந்துகிறது.
translation_notes:
  register: நவீன செந்தமிழுக்கு ஏற்ற, பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டது. ‘கைகள் தளர்தல்’ மற்றும் ‘கைகளை வலுப்படுத்துதல்’ என்ற இணையான உருவகங்கள் பாதுகாக்கப்பட்டுள்ளன. கடவுளிடம் உரைக்கப்படும் ‘வலுப்படுத்தும்’ என்பது மரியாதையுள்ள வேண்டுதல் வடிவமாகப் பயன்படுத்தப்பட்டது.
