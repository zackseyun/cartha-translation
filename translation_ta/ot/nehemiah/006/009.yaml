  terminology: ‘அச்சுறுத்த’, ‘கைகள் தளர்ந்துவிடும்’, ‘செய்து முடிக்கப்படாது’, ‘கைகளை வலுப்படுத்தும்’ ஆகிய தேர்வுகள் பொருத்தமானவை. கைகள் தளர்வதும் கைகளை வலுப்படுத்துவதும் இடையிலான மூலத்தின் சொல்லுருவ எதிரொலி நன்றாகத் தக்கவைக்கப்பட்டுள்ளது. அடிக்குறிப்புகள் குறியீடுகளோடு சரியாக இணைக்கப்பட்டு, மாற்றுவாசிப்பு மற்றும் உருவக விளக்கத்தை முறையாகத் தருகின்றன.
