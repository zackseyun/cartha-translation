  text: וַ/יְהִ֗י כַּ/אֲשֶׁ֤ר שָֽׁמְעוּ֙ כָּל א֣וֹיְבֵ֔י/נוּ וַ/יִּֽרְא֗וּ כָּל הַ/גּוֹיִם֙ אֲשֶׁ֣ר סְבִֽיבֹתֵ֔י/נוּ וַ/יִּפְּל֥וּ מְאֹ֖ד בְּ/עֵינֵי/הֶ֑ם וַ/יֵּ֣דְע֔וּ כִּ֚י מֵ/אֵ֣ת אֱלֹהֵ֔י/נוּ נֶעֶשְׂתָ֖ה הַ/מְּלָאכָ֥ה הַ/זֹּֽאת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/006/016.yaml
  text: And it happened that when all our enemies heard[a], and all the nations around us saw, they fell greatly in their own eyes, and they knew that this work had been done by our God.
translation:
  language: ta
  text: எங்கள் பகைவர்கள் அனைவரும் இதைக் கேள்விப்பட்டு, எங்களைச் சுற்றியிருந்த எல்லா இனத்தாரும் இதைக் கண்டபோது, அவர்கள் தங்கள் பார்வையிலேயே மிகவும் தாழ்ந்தார்கள்[a]. இந்த வேலை எங்கள் கடவுளால் செய்யப்பட்டிருந்தது என்பதை அவர்கள் அறிந்துகொண்டார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அதாவது, அவர்கள் தங்களைப் பற்றிய மதிப்பில் மிகவும் தாழ்ந்தார்கள்; அல்லது, தன்னம்பிக்கையைப் பெரிதும் இழந்தார்கள். எபிரெயத்தில், அவர்கள் தங்கள் சொந்தக் கண்களில் ‘விழுந்தார்கள்’ என்ற உருவகம் உள்ளது.
    reason: எபிரெய மரபுத்தொடரின் உருவகத்தையும் அதன் இயல்பான பொருளையும் ஒருசேர தெரிவிக்கிறது.
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר
  choice: …போது
  rationale: எபிரெயக் கதைத் தொடரின் நிகழ்வு–கால அமைப்பை இயல்பான நவீனத் தமிழில் தருகிறது; தனியே ‘அது நிகழ்ந்தது’ என்று சேர்ப்பது தமிழில் தேவையற்ற கனத்தை உண்டாக்கும்.
- source_word: שָׁמְעוּ
  choice: இதைக் கேள்விப்பட்டு
  rationale: ‘கேட்டார்கள்’ என்பதே நேரடிப் பொருள்; முந்தைய சூழலில் மதில் கட்டி முடிக்கப்பட்ட செய்தி மறைமுகப் பொருளாக இருப்பதால், தமிழில் இயல்பாக ‘இதைக் கேள்விப்பட்டு’ என வழங்கப்பட்டுள்ளது.
- source_word: כָּל אֹיְבֵינוּ
  choice: எங்கள் பகைவர்கள் அனைவரும்
  rationale: மூலத்தின் முழுமையையும் உடைமைத் தொடர்பையும் நேரடியாகப் பாதுகாக்கிறது.
- source_word: וַיִּרְאוּ
  choice: இதைக் கண்டபோது
  rationale: பொதுவான ‘காணுதல்’ என்ற பொருளைத் தக்கவைக்கிறது; அவர்கள் நிறைவேறிய வேலையைக் கண்டார்கள் என்பது சூழலிலிருந்து விளங்குகிறது.
- source_word: כָּל הַגּוֹיִם אֲשֶׁר סְבִיבֹתֵינוּ
  choice: எங்களைச் சுற்றியிருந்த எல்லா இனத்தாரும்
  rationale: גּוֹיִם என்பதை பிற்கால இறையியல் பொருளுடைய சொல்லாக அல்லாமல், சுற்றியிருந்த பிற மக்கள் இனங்களைக் குறிக்கும் வகையில் மொழிபெயர்க்கிறது.
- source_word: וַיִּפְּלוּ מְאֹד בְּעֵינֵיהֶם
  choice: அவர்கள் தங்கள் சொந்தக் கண்களிலேயே மிகவும் தாழ்ந்துபோனார்கள்
  rationale: தங்கள் மதிப்பீட்டிலேயே ‘விழுதல்’ என்ற எபிரெய உருவகத்தைத் தமிழில் இயன்றவரை பாதுகாக்கிறது; அதன் கருத்து அடிக்குறிப்பில் தெளிவுபடுத்தப்படுகிறது.
- source_word: וַיֵּדְעוּ
  choice: அவர்கள் அறிந்துகொண்டார்கள்
  rationale: ஒரு நிகழ்வின் பொருளை உணர்ந்து ஏற்றுக்கொண்டதைக் குறிக்கும் இயல்பான தமிழ்ச் சொற்றொடர்.
- source_word: מֵאֵת אֱלֹהֵינוּ
  choice: எங்கள் கடவுளாலேயே
  rationale: மூலத்தில் உள்ள ஆதாரம் அல்லது செயலாண்மையை வெளிப்படுத்துகிறது; ‘-ஏ’ வலியுறுத்தல், இந்த வேலை கடவுளுக்கே உரியதாக அவர்கள் உணர்ந்ததைத் தெரிவிக்கிறது.
- source_word: נֶעֶשְׂתָה הַמְּלָאכָה הַזֹּאת
  choice: இந்த வேலை … செய்யப்பட்டிருந்தது
  rationale: நிபால் வடிவின் செயப்பாட்டு அமைப்பையும், அப்போது ஏற்கெனவே நிறைவேறியிருந்த வேலையையும் தமிழில் இயல்பாகக் காட்டுகிறது.
theological_decisions:
- issue: வேலை நிறைவேறியதில் கடவுளின் செயலாண்மை
  choice: எங்கள் கடவுளாலேயே இந்த வேலை செய்யப்பட்டிருந்தது
  alternative: இந்த வேலை எங்கள் கடவுளிடமிருந்து வந்தது / எங்கள் கடவுளின் மூலம் செய்யப்பட்டது
  rationale: מֵאֵת என்பது ஆதாரம் அல்லது செயலாண்மையைக் குறிக்கலாம். இங்கு ‘கடவுளாலேயே’ என்பது வேலையின் நிறைவேற்றம் கடவுளுக்கே காரணமாகக் கருதப்பட்டது என்ற வசனத்தின் வலியுறுத்தலைப் பாதுகாக்கிறது; அது எவ்வகையில் நிகழ்ந்தது என்று தேவையின்றி விளக்குவதில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழ்; வாசிக்க எளிதானதாயும் கண்ணியமானதாயும் அமைக்கப்பட்டுள்ளது. எபிரெயக் கதைத் தொடக்கச் சூத்திரம் தமிழில் இயல்பான காலத் துணைவாக்கியமாக இணைக்கப்பட்டுள்ளது. அரிதான ‘தங்கள் கண்களில் விழுதல்’ என்ற உருவகம் முதன்மை உரையில் மிதமாகப் பாதுகாக்கப்பட்டு அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது.
