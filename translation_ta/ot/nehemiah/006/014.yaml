base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/006/014.yaml
  text: Remember Tobiah and Sanballat[a], my God, according to these deeds of theirs, and also Noadiah the prophetess and the rest of the prophets who were trying to make me afraid.
translation:
  language: ta
  text: என் கடவுளே, தொபியாவையும் சன்பல்லாத்தையும் அவர்களுடைய இந்தச் செயல்களுக்கு ஏற்ப நினைவுகூரும். மேலும், என்னை அச்சுறுத்த முயன்ற[a] பெண் இறைவாக்கினரான நோவதியாவையும் மீதமுள்ள இறைவாக்கினர்களையும் நினைவுகூரும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என்னைப் பயமுறுத்திக்கொண்டிருந்தவர்கள்.”
    reason: מְיָרְאִים என்பதன் தொடர்ச்சியான காரணவினைப் பொருளை வேறுவிதமாக வெளிப்படுத்தும் சொற்பொருள் மாற்று.
lexical_decisions:
- source_word: זָכְרָה
  choice: நினைவுகூரும்
  rationale: கடவுளை நேரடியாக நோக்கி வேண்டுதல் விடுக்கும் எபிரெய வடிவத்தின் சுருக்கத்தையும் வலிமையையும் காக்கிறது. தமிழில் மரியாதைத் தொனியுள்ள வேண்டுகோளாக இயல்பாக உள்ளது.
- source_word: אֱלֹהַי
  choice: என் கடவுளே
  rationale: முதலாம் நபர் ஒருமை உடைமைப் பின்னொட்டையும் நேரடி அழைப்பையும் தெளிவாகக் காட்டுகிறது.
- source_word: לְטוֹבִיָּה וּלְסַנְבַלַּט
  choice: தொபியாவையும் சன்பல்லாத்தையும்
  rationale: ஆள்பெயர்கள் தமிழில் ஒலிபெயர்க்கப்பட்டு, ‘நினைவுகூரும்’ என்பதன் செயப்படுபொருள்களாக ஐ வேற்றுமையில் தரப்பட்டுள்ளன.
- source_word: כְּמַעֲשָׂיו אֵלֶּה
  choice: அவர்களுடைய இந்தச் செயல்களுக்கு ஏற்ப
  rationale: כְּ என்பதன் ஒப்புமை/அளவுக்கேற்ற பொருளை ‘ஏற்ப’ காக்கிறது. எபிரெயில் பின்னொட்டு ஒருமையாக இருந்தாலும், சூழலில் முன் குறிப்பிடப்பட்ட இருவரையும் கூட்டாகச் சுட்டுவதால் தமிழில் பன்மை இயல்பானது.
- source_word: וְגַם
  choice: மேலும்
  rationale: மேற்கூறியவர்களுடன் இன்னும் சிலரைச் சேர்க்கும் இணைப்புப் பொருளை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: לְנוֹעַדְיָה הַנְּבִיאָה
  choice: பெண் இறைவாக்கினரான நோவதியாவையும்
  rationale: הַנְּבִיאָה என்பதில் வெளிப்படையாக உள்ள பெண்பாலைக் காக்கிறது; ‘இறைவாக்கினர்’ நவீன, கண்ணியமான தமிழ் சமயச் சொல்.
- source_word: וּלְיֶתֶר הַנְּבִיאִים
  choice: மற்ற இறைவாக்கினர்களையும்
  rationale: יֶתֶר என்பதன் ‘மீதமுள்ள/மற்ற’ பொருளை இயல்பாகத் தருகிறது; நோவதியாவுக்கு அப்பாற்பட்ட குழுவைக் குறிக்கிறது.
- source_word: אֲשֶׁר הָיוּ מְיָרְאִים אוֹתִי
  choice: என்னை அச்சுறுத்த முயன்ற
  rationale: היה உடனான பங்கேற்புவினை கடந்தகாலத் தொடர்ச்சியான அல்லது நோக்கமுள்ள செயலைக் காட்டுகிறது; ירא-இன் காரணவினைப் பொருளான பயமுறுத்தல்/அச்சுறுத்தலைப் பிடிக்கிறது.
theological_decisions:
- issue: எதிரிகளுக்கு எதிராகக் கடவுள் நினைவுகூர வேண்டும் என்ற வேண்டுதலின் தொனி
  choice: அவர்களுடைய செயல்களுக்கு ஏற்ப அவர்களை நினைவுகூரும்படி வேண்டுதல்
  alternative: அவர்களைத் தண்டியும் / அவர்களைக் குற்றவாளிகளாகக் கணக்கிடும்
  rationale: எபிரெய மூலத்தில் தண்டனை அல்லது தீர்ப்பு வெளிப்படையாகச் சொல்லப்படவில்லை. ஆகவே வேண்டுதலின் தீவிரத்தை வைத்துக்கொண்டு, மூலத்தில் இல்லாத நீதித்தீர்ப்பு மொழி சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீன தரத் தமிழில் கண்ணியமான வேதாகம நடையைப் பயன்படுத்துகிறது. ‘நினைவுகூரும்’ என்பது நேரடி வேண்டுதலைக் காக்கிறது; ‘பெண் இறைவாக்கினர்’ மூலத்தின் பாலினக் குறிப்பை வெளிப்படையாக வைத்திருக்கிறது. அடிக்குறிப்பு குறியீடு பிரதான உரையில் இடம்பெற்றுள்ளது.
