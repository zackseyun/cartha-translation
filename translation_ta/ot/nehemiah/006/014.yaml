  source_fidelity: 'முக்கியப் பொருள் மூலத்திற்கு உண்மையாக உள்ளது: கடவுளிடம் நேரடியாக வேண்டுதல், தொபியா மற்றும் சன்பல்லாத்தின் செயல்களுக்கேற்ப அவர்களை நினைவுகூரச் சொல்லுதல், நோவதியா மற்றும் பிற தீர்க்கதரிசிகள் நேகேமியாவைப் பயமுறுத்த முயன்றமை ஆகியவை காக்கப்பட்டுள்ளன. ஆனால் יֶתֶר என்பதற்கு ‘மற்ற’ என்பதைவிட ‘மீதமுள்ள’ என்பது ‘the rest’ என்ற குறிப்பிட்ட பொருளைத் துல்லியமாகத் தருகிறது.'
