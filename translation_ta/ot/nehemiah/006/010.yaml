base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/006/010.yaml
  text: Then I went to the house of Shemaiah son of Delaiah[a], son of Mehetabel, who was confined, and he said, “Let us meet at the house of God, inside the temple, and let us shut the doors of the temple, for they are coming to kill you—yes, at night they are coming to kill you.”
translation:
  language: ta
  text: பின்பு நான், மெகேத்தாபெயேலின் மகனான தெலாயாவின் மகன் செமாயாவின் வீட்டுக்குச் சென்றேன். அவன் அடைபட்டிருந்தான். அவன் என்னிடம், “நாம் கடவுளின் இல்லத்தில், ஆலயத்திற்குள்[a] சந்திப்போம்; ஆலயத்தின் கதவுகளை மூடிக்கொள்வோம். ஏனெனில் உன்னைக் கொல்வதற்காக அவர்கள் வருகிறார்கள்; இரவில் உன்னைக் கொல்வதற்காக வருகிறார்கள்” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பரிசுத்த இடத்திற்குள்.” எபிரெய மொழியிலுள்ள ஹேகால் என்ற சொல், ஆலய வளாகம் முழுவதையும் அல்லாமல், குறிப்பாக ஆலயக் கட்டடத்தை அல்லது பரிசுத்த இடத்தைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי בָאתִי
  choice: பின்பு நான் ... வீட்டுக்குச் சென்றேன்
  rationale: இணைப்புச் சொல்லும் தனிப்பெயரும் கதைத் தொடர்ச்சியுடன் எழுவாயைச் சற்றே வலியுறுத்துகின்றன. בוא இச்சூழலில் தமிழில் இயல்பாக ‘சென்றேன்’ என வருகிறது.
- source_word: בֵּית שְׁמַעְיָה
  choice: செமாயாவின் வீட்டுக்கு
  rationale: தனிப்பெயருடன் வரும் בֵּית இங்கு அவரது வசிப்பிடத்தைக் குறிக்கிறது; ‘வீடு’ இயல்பான நவீனத் தமிழ்.
- source_word: שְׁמַעְיָה ... דְּלָיָה ... מְהֵיטַבְאֵל
  choice: மெகேத்தாபெயேலின் மகனான தெலாயாவின் மகன் செமாயா
  rationale: எபிரெயப் பெயர்கள் தமிழில் ஒலிபெயர்க்கப்பட்டு, தலைமுறைத் தொடர்பு மூலத்தின் வரிசைப்படி தெளிவாகக் கொடுக்கப்படுகிறது.
- source_word: וְהוּא עָצוּר
  choice: அவன் வெளியே வராமல் அடைபட்டிருந்தான்
  rationale: עָצוּר என்பது அடைக்கப்பட்டிருத்தல் அல்லது வெளியே செல்லாமல் தடுக்கப்பட்டிருத்தல் எனப் பொருள்படலாம். காரணத்தை ஊகிக்காமல் நிலையைத் தெரிவிக்க இவ்வாறு மொழிபெயர்க்கப்பட்டது.
- source_word: נִוָּעֵד
  choice: நாம் ... சந்திப்போம்
  rationale: இது சேர்ந்து சந்திப்பதற்கான முன்மொழிவைத் தெரிவிக்கிறது; தமிழ் உரையாடலில் ‘சந்திப்போம்’ இயல்பாக உள்ளது.
- source_word: בֵּית הָאֱלֹהִים
  choice: கடவுளின் இல்லம்
  rationale: எபிரெய மொழியின் நிலையான ‘கடவுளின் வீடு/இல்லம்’ என்ற கோவில் குறியீட்டை மரியாதையான தமிழில் பாதுகாக்கிறது.
- source_word: אֶל תּוֹךְ הַהֵיכָל
  choice: ஆலயத்திற்குள்
  rationale: הֵיכָל இங்கு பரந்த கோவில் வளாகத்தைவிடப் புனிதக் கட்டடத்தையே குறிக்க வாய்ப்புள்ளது. ‘ஆலயத்திற்குள்’ வாசிப்புக்கு இயல்பாக இருக்க, ‘பரிசுத்த இடம்’ என்ற சாத்தியம் அடிக்குறிப்பில் வைக்கப்படுகிறது.
- source_word: וְנִסְגְּרָה דַּלְתוֹת הַהֵיכָל
  choice: ஆலயத்தின் கதவுகளை மூடிக்கொள்வோம்
  rationale: தொடரும் கூட்டு முன்மொழிவையும் கதவுகளைத் தங்களுக்குப் பாதுகாப்பாக மூடும் கருத்தையும் இயல்பாகத் தருகிறது.
- source_word: כִּי בָּאִים לְהָרְגֶךָ
  choice: ஏனெனில் உன்னைக் கொல்வதற்காக அவர்கள் வருகிறார்கள்
  rationale: பன்மை வினையெச்சத்தின் குறிப்பிடப்படாத எழுவாய் தமிழில் ‘அவர்கள்’ என இயல்பாக வெளிப்படுகிறது; நோக்கம் நேரடியாகப் பாதுகாக்கப்படுகிறது.
- source_word: וְלַיְלָה בָּאִים לְהָרְגֶךָ
  choice: இரவில் உன்னைக் கொல்வதற்காக வருகிறார்கள்
  rationale: ‘இரவில்’ என்பதையே மூல உரை கூறுகிறது; ‘இன்றிரவு’ என அளவுக்கு மீறிக் குறிப்பாக்கவில்லை. கொலை செய்ய வருவதாக இருமுறை கூறப்படும் அவசர வலியுறுத்தலும் பாதுகாக்கப்பட்டுள்ளது.
theological_decisions:
- issue: கட்டுப்படுத்தப்பட்ட புனித இடத்தைக் குறிக்கும் הֵיכָל என்பதன் மொழிபெயர்ப்பு
  choice: ஆலயம்
  alternative: பரிசுத்த இடம்
  rationale: அடுத்த வசனத்தின் சூழல் நெகேமியா நுழையக் கூடாத புனிதப் பகுதியாக இதைக் காட்டுகிறது. இருப்பினும் הֵיכָל என்பதே ‘ஆலயம்’ அல்லது குறிப்பாக ‘பரிசுத்த இடம்’ என வரக்கூடும். பிரதான உரை இயல்புக்காக ‘ஆலயம்’ எனக் கொண்டு, சூழலுக்குப் பொருத்தமான மாற்றை அடிக்குறிப்பில் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் மரியாதையான கதைநடை பயன்படுத்தப்பட்டுள்ளது. பெயர்கள் எபிரெய ஒலிப்புக்கு அண்மையாகத் தமிழாக்கப்பட்டுள்ளன; மூலத்தில் தெளிவில்லாத அடைபட்டிருந்ததற்கான காரணம் விளக்கிச் சேர்க்கப்படவில்லை. எச்சரிக்கையின் அவசரத்தைக் காட்டும் இறுதி மறுபடியும் கூறுதல் பாதுகாக்கப்பட்டுள்ளது.
