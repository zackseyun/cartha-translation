base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/006/006.yaml
  text: It was written in it[a], “It is being reported among the nations—and Geshem also says it—that you and the Jews are planning to rebel. Therefore you are rebuilding the wall, and according to these reports you are to become their king.”
translation:
  language: ta
  text: 'அதில் இவ்வாறு எழுதப்பட்டிருந்தது: “நீயும் யூதர்களும் கலகம் செய்யத் திட்டமிடுகிறீர்கள் என்று தேசங்களிடையே செய்தி பரவிக்கொண்டிருக்கிறது; கஷ்மூவும்[a] அவ்வாறே சொல்கிறார். அதனால்தான் நீ மதிலைக் கட்டுகிறாய்; இத்தகைய செய்திகளின்படி, நீ அவர்களுக்கு அரசனாகப் போகிறாய்.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் பெயர் ‘கஷ்மூ’; பல மொழிபெயர்ப்புகளில் இது ‘கெஷேம்’ என்று வழங்கப்படுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּתוּב בָּהּ
  choice: அதில் இவ்வாறு எழுதப்பட்டிருந்தது
  rationale: செயப்பாட்டு வினையெச்ச அமைப்பையும் கடிதத்தின் உள்ளடக்கத்தை அறிமுகப்படுத்தும் பணியையும் இயல்பான தமிழ் இறந்தகால நடையில் வெளிப்படுத்துகிறது.
- source_word: בַּגּוֹיִם נִשְׁמָע
  choice: பிற இனத்தாரிடையே செய்தி பரவிக்கொண்டிருக்கிறது
  rationale: நிஃபால் வடிவிலுள்ள ‘கேட்கப்படுகிறது/அறியப்படுகிறது’ என்ற செயப்பாட்டுப் பொருளை, தொடர்ந்து பரவும் வதந்தி என்ற சூழலுக்கு ஏற்ற இயல்பான தமிழில் தருகிறது; גּוֹיִם என்பதை இங்கு மதச்சார்பான சொல்லாக அல்லாமல் இன-அரசியல் பொருளில் மொழிபெயர்க்கிறது.
- source_word: וְגַשְׁמוּ אֹמֵר
  choice: கஷ்மூவும் அவ்வாறே சொல்கிறார்
  rationale: எபிரெயப் பெயரான கஷ்மூவை நேரடியாக ஒலிபெயர்த்து, וְ என்பதன் கூட்டுப் பொருளை ‘வும்’ என்றும், அவர் அதே செய்தியை உறுதிப்படுத்துகிறார் என்பதை ‘அவ்வாறே’ என்றும் தெளிவாக்குகிறது.
- source_word: חֹשְׁבִים לִמְרוֹד
  choice: கலகம் செய்யத் திட்டமிடுகிறீர்கள்
  rationale: חשב + வினையெச்சம் இங்கு குறிக்கும் நோக்கம் அல்லது திட்டத்தை இயல்பாகத் தெரிவிக்கிறது; ‘சதி செய்கிறீர்கள்’ என்று பொருளை மிகைப்படுத்தவில்லை.
- source_word: עַל כֵּן
  choice: அதனால்தான்
  rationale: குற்றச்சாட்டிலிருந்து மதில் கட்டப்படுவதற்கான காரணத்தை எதிரிகள் ஊகிப்பதாகக் காட்டும் காரணத் தொடர்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: בּוֹנֶה הַחוֹמָה
  choice: மதிலை மறுபடியும் கட்டுகிறாய்
  rationale: בנה என்பதன் அடிப்படைப் பொருளைக் காத்து, நெகேமியாவின் சூழலில் இடிந்த மதில் புதுப்பிக்கப்படுவதைத் தெளிவாக்குகிறது.
- source_word: וְאַתָּה הֹוֶה לָהֶם לְמֶלֶךְ
  choice: நீ அவர்களுக்கு அரசனாகப் போகிறாய்
  rationale: הוה + ל அமைப்பின் ‘ஆகுதல்’ என்ற பொருளையும், இது நிறைவேறிய நிகழ்வு அல்ல எதிரிகள் சுமத்தும் எதிர்நோக்கிய நோக்கம் என்பதையும் காக்கிறது.
- source_word: כַּדְּבָרִים הָאֵלֶּה
  choice: இத்தகைய செய்திகளின்படி
  rationale: דברים என்பதன் பரந்த ‘சொற்கள்/காரியங்கள்’ பொருளை இச்சூழலில் பரவும் குற்றச்சாட்டு அறிக்கைகளாக இயல்பாக வழங்குகிறது.
