  yaml_path: translation/ot/nehemiah/006/017.yaml
  text: Also[a], in those days the nobles of Judah were sending many letters to Tobiah, and those from Tobiah were coming to them.
translation:
  language: ta
  text: மேலும், அந்த நாட்களில் யூதாவின் பிரபுக்கள் தங்கள் பல கடிதங்களைத் தோபியாவுக்கு அனுப்பி வந்தார்கள்; தோபியாவிடமிருந்து வந்த கடிதங்களும் அவர்களிடம் வந்து கொண்டிருந்தன.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொல்லர்த்தமாக, “அவர்களுடைய கடிதங்கள் தோபியாவுக்குப் போய்க்கொண்டிருந்தன; தோபியாவுக்குரியவை அவர்களிடம் வந்துகொண்டிருந்தன.” இரண்டாம் கூறில் “கடிதங்கள்” என்பது முதல் கூறின் இணை அமைப்பிலிருந்து உணரப்படுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: மேலும்
  rationale: சுற்றியுள்ள நிகழ்வுகளுடன் இன்னொரு சூழ்நிலையை இணைக்கும் சேர்க்கைப் பொருளை இயல்பாகக் காட்டுகிறது.
- source_word: בַּיָּמִים הָהֵם
  choice: அந்த நாட்களில்
  rationale: எபிரெய வழக்கின் காலக் குறிப்பை நேரடியாகவும் இயல்பாகவும் தருகிறது.
- source_word: מַרְבִּים
  choice: பல ... அனுப்பிக்கொண்டிருந்தார்கள்
  rationale: தொடர்ச்சியாக அல்லது மீண்டும் மீண்டும் நிகழ்ந்த கடிதப் பரிமாற்றத்தைப் பங்கேற்பெயர் வடிவமும் சூழலும் உணர்த்துகின்றன.
- source_word: חֹרֵי יְהוּדָה
  choice: யூதாவின் பிரபுக்கள்
  rationale: இச்சொல் சமூக, அரசியல் செல்வாக்குள்ள உயர்நிலையினரைக் குறிக்கிறது; 'பிரபுக்கள்' அந்த வரலாற்றுச் சூழலுக்கு ஏற்றது.
- source_word: אִגְּרֹתֵיהֶם
  choice: கடிதங்களை
  rationale: எழுத்து மூலமான தொடர்பைக் குறிக்கும் சொல்லுக்கு நவீனத் தமிழில் தெளிவான இயல்பான இணை.
- source_word: הוֹלְכוֹת עַל טוֹבִיָּה
  choice: தொபியாவுக்கு ... அனுப்பிக்கொண்டிருந்தார்கள்
  rationale: சொல்லர்த்தமாக 'தொபியாவிடம் போய்க்கொண்டிருந்தன'; கடிதங்களின் இலக்கைத் தமிழில் இயல்பாக வெளிப்படுத்த செயப்பாட்டு கருத்து தெளிவாக்கப்பட்டுள்ளது.
- source_word: וַאֲשֶׁר לְטוֹבִיָּה
  choice: தொபியாவிடமிருந்து வந்தவையும்
  rationale: இணை அமைப்பில் விடுபட்டுள்ள 'கடிதங்கள்' என்பதை 'வந்தவை' மறைமுகமாகக் குறிக்கிறது; לְטוֹבִיָּה என்பதன் சொந்தம்/தொடர்பு பொருள் இங்கு மூலத்தைக் குறிக்கும் வகையில் இயல்பாக்கப்பட்டுள்ளது.
- source_word: בָּאוֹת אֲלֵיהֶם
  choice: அவர்களிடம் வந்துகொண்டிருந்தன
  rationale: தொடர்ச்சியான அல்லது மீள நிகழ்ந்த எதிர்திசைக் கடிதப் பரிமாற்றத்தையும் எபிரெய பங்கேற்பெயர் வடிவத்தையும் காக்கிறது.
