  source_fidelity: திருத்தம் தேவை. மூலத்தின் முதல் கூறில் உள்ள உடைமைப் பொருள் (“அவர்களுடைய கடிதங்கள்”) தமிழ்ப் பிரதான உரையில் விடுபட்டுள்ளது. மேலும், பெயரின் நிலையான தமிழ் எழுத்தாக்கமாக “தோபியா” பொருத்தமானது. இரண்டாம் கூறின் எபிரெய எலிப்ஸிஸைத் தெளிவுபடுத்த ‘கடிதங்கள்’ எனச் சேர்ப்பது பாதுகாப்பானது; குறிப்பு அந்த எலிப்ஸிஸையும் சொற்சொல் மாற்றையும் பாதுகாக்கிறது.
