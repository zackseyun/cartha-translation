  text: They sent to me four times in this way[a], and I answered them in the same way.
translation:
  language: ta
  text: அவர்கள் இதேபோல் நான்கு முறை எனக்குச் செய்தி அனுப்பினார்கள்[a]; நானும் அவர்களுக்கு இதேபோல் பதிலளித்தேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இரு இடங்களிலும் நேரடியாக, “இந்த வார்த்தையின்படி.” அவர்கள் ஒரே கோரிக்கையை மீண்டும் அனுப்பியதையும், அதற்கு நேகேமியா அதே வகையில் பதிலளித்ததையும் இச்சொற்றொடர் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלְחוּ אֵלַי
  choice: என்னிடம் ஆள் அனுப்பினார்கள்
  rationale: שׁלח என்பது ‘அனுப்பு’ என்று பொருள்படும். எதை அல்லது யாரை அனுப்பினார்கள் என்பது எபிரெயத்தில் வெளிப்படையாகக் கூறப்படவில்லை; முந்தைய வசனங்களின் சூழலில் தூதுவர்களை அனுப்பியது குறிக்கப்படுவதால், இயல்பான தமிழில் ‘ஆள் அனுப்பினார்கள்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: כַּדָּבָר הַזֶּה
  choice: இதே விதமாக / அதே விதமாக
  rationale: சொல்லுக்குச் சொல் ‘இந்த வார்த்தையின்படி/இந்தக் காரியத்தின்படி.’ இங்கு ஒரே வேண்டுகோள் மீண்டும் அனுப்பப்பட்டதையும் அதே வகையான பதில் திரும்பக் கொடுக்கப்பட்டதையும் குறிக்கிறது; மூலத்தின் இருமுறை வரும் அமைப்பைத் தமிழிலும் ஒத்த சொற்றொடர்களால் காக்கிறது.
- source_word: אַרְבַּע פְּעָמִים
  choice: நான்கு முறை
  rationale: நான்கு சந்தர்ப்பங்களில் மீண்டும் நிகழ்ந்ததை நேரடியாகக் குறிக்கும் இயல்பான தமிழ்.
- source_word: וָאָשִׁיב אוֹתָם
  choice: நானும் அவர்களுக்குப் பதிலளித்தேன்
  rationale: Hiphil வடிவிலுள்ள שׁוב தொடர்பாடல் சூழலில் ‘பதில் திருப்பிக் கொடு’ என்ற பொருளைத் தருகிறது. אוֹתָם அனுப்பியவர்களையோ அவர்களுடைய பிரதிநிதிகளையோ குறிக்கலாம்; ‘அவர்களுக்கு’ என்பது இயல்பான தமிழில் அந்த உறவை வெளிப்படுத்துகிறது.
