translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான வரலாற்று நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. வசனத் தொடக்க வַ தொடர்ச்சியை ‘இவ்வாறு’ என வழங்கி, முந்தைய நிகழ்வுகளின் விளைவாக மதில் நிறைவடைந்ததைத் தெரிவிக்கிறது. எல்லா அடிக்குறிப்பு குறிகளும் உரையில் இடம்பெற்றுள்ளன.
