  yaml_path: translation/ot/nehemiah/006/015.yaml
  text: So the wall was finished on the twenty-fifth day of Elul[b][a], in fifty-two days.
translation:
  language: ta
  text: இவ்வாறு, எலூல் மாதத்தின் இருபத்தைந்தாம் நாளில்[a], ஐம்பத்திரண்டு நாட்களில் மதில் கட்டி முடிந்தது[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எலூல் என்பது எபிரேய நாட்காட்டியின் ஆறாம் மாதம்.
    reason: cultural_note
  - marker: b
    text: அல்லது, “மதில் முடிவடைந்தது.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּשְׁלַם
  choice: கட்டி முடிக்கப்பட்டது
  rationale: שלם என்பதன் இவ்விடத்து நிகழ்வு சார்ந்த பொருள் ‘முடிவடைந்தது/முடிக்கப்பட்டது’ என்பதாகும். ‘மதில்’ பற்றிய கட்டுமானச் சூழலில் ‘கட்டி முடிக்கப்பட்டது’ என்பது இயல்பான தமிழில் பொருளைத் தெளிவாக வெளிப்படுத்துகிறது; எபிரேய வடிவம் தானாக நிறைவடைதல் என்றும் பிறரால் முடிக்கப்படுதல் என்றும் கடுமையாக வேறுபடுத்தாததால் மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: הַחוֹמָה
  choice: மதில்
  rationale: உடனடி வரலாற்றுச் சூழலில் எருசலேமைச் சுற்றிய பாதுகாப்பு மதிலைக் குறிக்கும் குறிப்பிட்ட பெயர்ச்சொல். ‘மதில்’ என்பது ‘சுவர்’ என்பதைக் காட்டிலும் இச்சூழலுக்கு துல்லியமானதும் இயல்பானதும் ஆகும்.
- source_word: בְּעֶשְׂרִים וַחֲמִשָּׁה לֶאֱלוּל
  choice: எலூல் மாதத்தின் இருபத்தைந்தாம் நாளில்
  rationale: எபிரேய தேதி அமைப்பை இயல்பான தமிழில் வெளிப்படுத்த ‘மாதத்தின்’ மற்றும் ‘நாளில்’ சேர்க்கப்பட்டுள்ளன. எலூல் மொழிபெயர்க்கப்படாமல் ஒலிபெயர்க்கப்படுகிறது.
- source_word: לַחֲמִשִּׁים וּשְׁנַיִם יוֹם
  choice: ஐம்பத்திரண்டு நாட்களில்
  rationale: ל முன்னிடைச்சொல்லுடன் வரும் எண்ணிக்கை, வேலை நிறைவடைய எடுத்த மொத்தக் காலத்தைச் சுட்டுகிறது. ‘நாட்களில்’ என்பது வெறும் பின்வரிசையைக் காட்டாமல் கால அளவை இயல்பாகத் தெரிவிக்கிறது.
