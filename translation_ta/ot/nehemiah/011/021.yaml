- from: ஆலயப் பணியாளர்கள் ஓபேல் மேட்டில்[a] குடியிருந்தார்கள். சீகாவும் கிஸ்பாவும் ஆலயப் பணியாளர்களுக்குப் பொறுப்பாளர்களாக இருந்தார்கள்.
  to: ஆலயப் பணியாளர்கள்[a] ஓபேலில் குடியிருந்தார்கள். சீஹாவும் கிஷ்பாவும் ஆலயப் பணியாளர்களுக்குப் பொறுப்பாளர்களாக இருந்தார்கள்.
  rationale: The revision relocates the Nethinim note marker to its proper lexical anchor, retains Ophel as a place name without importing an additional noun into the text, and adjusts the two names toward closer Hebrew-based Tamil transliteration. The verse’s two-clause structure, ongoing residence, and administrative oversight remain intact.
