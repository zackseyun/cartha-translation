base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/011/021.yaml
  text: And the temple servants were living on the Ophel[a], and Ziha and Gishpa were over the temple servants.
translation:
  language: ta
  text: ஆலயப் பணியாளர்கள்[a] ஓபேலில் குடியிருந்தார்கள். சீஹாவும் கிஷ்பாவும் ஆலயப் பணியாளர்களுக்குப் பொறுப்பாளர்களாக இருந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ஆலயப் பணியாளர்கள்” என்பதற்கான எபிரெயச் சொல் நெதினீம்; இது ஆலயப் பணிக்கென நியமிக்கப்பட்ட ஒரு குறிப்பிட்ட பணியாளர் குழுவைக் குறிக்கும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנְּתִינִים
  choice: ஆலயப் பணியாளர்கள்
  rationale: நெதினீம் என்பது ஆலயப் பணிக்கென நியமிக்கப்பட்ட ஒரு குறிப்பிட்ட குழுவைக் குறிக்கும் பிற்காலத் தொழில்நுட்பச் சொல். ஒலிபெயர்ப்பைவிட அதன் பணியைத் தெளிவாக எடுத்துரைக்கும் இச்சொற்றொடர் இயல்பான நவீன தமிழில் நிறுவனச் சார்பையும் காக்கிறது.
- source_word: יֹשְׁבִים
  choice: குடியிருந்தார்கள்
  rationale: ישב என்பதன் பங்கேற்பு வடிவம் தொடர்ந்து வசித்த நிலையைக் குறிக்கிறது; ‘குடியிருந்தார்கள்’ அந்த நீடித்த குடியிருப்புப் பொருளை இயல்பாகத் தருகிறது.
- source_word: בָּעֹפֶל
  choice: ஓபேல் மேட்டில்
  rationale: עֹפֶל என்பது உயர்ந்த கோட்டைப் பகுதியைக் குறிக்கும் இடப்பெயர் அல்லது நிலவியல் பெயர். பெயரை ஒலிபெயர்த்து, அதன் நிலவியல் தன்மையை ‘மேடு’ மூலம் வாசகருக்குத் தெளிவாக்குகிறது.
- source_word: צִיחָא
  choice: சீகா
  rationale: எபிரெய தனிப்பெயரின் தமிழுக்கேற்ற ஒலிபெயர்ப்பு.
- source_word: גִשְׁפָּא
  choice: கிஸ்பா
  rationale: எபிரெய தனிப்பெயரின் தமிழுக்கேற்ற ஒலிபெயர்ப்பு.
- source_word: עַל
  choice: பொறுப்பாளர்களாக இருந்தார்கள்
  rationale: இந்த நிர்வாகச் சூழலில் עַל அதிகாரம் அல்லது மேற்பார்வையைக் குறிக்கிறது. தமிழில் இயல்பாகவும் தெளிவாகவும் அந்தப் பொறுப்பை இச்சொற்றொடர் தெரிவிக்கிறது.
