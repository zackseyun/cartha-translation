  text: and his brothers[a], heads of fathers’ houses, 242; and Amashsai son of Azarel, son of Ahzai, son of Meshillemoth[c][b], son of Immer.
translation:
  language: ta
  text: அவருடைய சகோதரர்கள்[a], தந்தைவழிக் குடும்பங்களின் தலைவர்கள், 242 பேர்[b]; மேலும், இம்மேரின் மகன் மெஷில்லேமோத்தின் மகன் அக்சாயின் மகன் அசரெயேலின் மகன் அமஷ்சாய்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “சகோதரர்கள்” என்பது இங்கு ஒரே குலத்தைச் சேர்ந்த ஆண் உறவினர்களையும் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: 'எபிரெயத்தில்: “இருநூற்று நாற்பத்திரண்டு.”'
    reason: lexical_alternative
  - marker: c
    text: “அமஷ்சாய்” என்ற பெயர் சில மொழிபெயர்ப்புகளில் “அமசாய்” என்றும் வழங்கப்படுகிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: וְאֶחָיו
  choice: அவருடைய சகோதரர்களும்
  rationale: எபிரெயச் சொல்லின் நேரடிப் பொருள் ‘அவருடைய சகோதரர்கள்’; இச்சூழலில் அது ஒரே குலத்தைச் சேர்ந்த ஆண் உறவினர்களையும் குறிக்கக்கூடும் என்பதால் அடிக்குறிப்பில் விரிவான பொருள் தரப்பட்டுள்ளது.
- source_word: רָאשִׁים לְאָבוֹת
  choice: தந்தைவழிக் குடும்பத் தலைவர்கள்
  rationale: தந்தை மரபின் அடிப்படையில் அமைந்த மூதாதையர் குடும்பங்களின் தலைவர்களை இச்சொற்றொடர் குறிக்கிறது; நவீன தமிழில் இயல்பாகவும் சமூக அமைப்பைத் தெளிவாகவும் காட்டும் வகையில் மொழிபெயர்க்கப்பட்டது.
- source_word: מָאתַיִם אַרְבָּעִים וּשְׁנָיִם
  choice: 242 பேர்
  rationale: எண்ணிக்கைப் பட்டியலில் வாசிப்பை எளிதாக்க இலக்கங்களாகத் தரப்பட்டுள்ளது; ‘பேர்’ என்பது மனிதர்களின் எண்ணிக்கை என்பதைத் தமிழில் தெளிவாக்குகிறது.
- source_word: וַעֲמַשְׁסַי
  choice: அமஷ்சாய்
  rationale: மசோரெட்டிய எபிரெய வடிவமான עֲמַשְׁסַי என்பதன் ஒலியைத் தமிழில் நெருக்கமாகப் பெயர்த்தெழுதுகிறது.
- source_word: בֶּן
  choice: மகன்
  rationale: மீண்டும் மீண்டும் வரும் வம்சவரிசைச் சூத்திரத்தில் நேரடியான ‘மகன்’ என்ற பொருள் பொருத்தமானது; தொலைவான வழித்தோன்றலையும் சில சூழல்களில் குறிக்கலாம் என்றாலும் இங்கு அதைத் தீர்மானிக்கத் தேவையில்லை.
- source_word: עֲזַרְאֵל
  choice: அசரெயேல்
  rationale: எபிரெய தனிப்பெயரின் தமிழ் ஒலிபெயர்ப்பு.
- source_word: אַחְזַי
  choice: அக்சாய்
  rationale: எபிரெய தனிப்பெயரின் மசோரெட்டிய உச்சரிப்பை நெருங்கிய தமிழ் ஒலிபெயர்ப்பு.
- source_word: מְשִׁלֵּמוֹת
  choice: மெஷில்லேமோத்
  rationale: இவ்வசனத்தில் உள்ள எபிரெயப் பெயரின் எழுத்து மற்றும் உயிர்க்குறி வடிவத்தை நெருக்கமாகப் பிரதிபலிக்கிறது.
- source_word: אִמֵּר
  choice: இம்மேர்
  rationale: எபிரெய தனிப்பெயரின் நேரடியான தமிழ் ஒலிபெயர்ப்பு; இது ஆசாரியக் குடும்பப் பெயராகவும் சூழலுக்குப் பொருந்துகிறது.
