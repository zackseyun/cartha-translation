  register: நவீன தரத் தமிழில் கண்ணியமான பட்டியல் நடையைப் பயன்படுத்தியுள்ளது. எபிரெய மூலத்தின் பின்னோக்கிச் செல்லும் ‘X-ன் மகன்’ வரிசையைத் தமிழில் இயல்பான முன்னோர் முதல் வழித்தோன்றல் வரையிலான தொடராக மாற்றியமைத்தாலும் உறவுகள் அனைத்தும் மாறாமல் பாதுகாக்கப்பட்டுள்ளன. தனிப்பெயர்கள் WLC மசோரெட்டிய வடிவங்களுக்கு நெருக்கமாக ஒலிபெயர்க்கப்பட்டுள்ளன.
