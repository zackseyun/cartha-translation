base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/011/023.yaml
  text: For the king’s command was upon them[a], and a fixed provision for the singers[b], each day’s matter on its day.
translation:
  language: ta
  text: ஏனெனில் அரசனின் கட்டளை அவர்கள்மீது இருந்தது; பாடகர்களுக்கான ஒரு நிலையான ஒதுக்கீடும் இருந்தது[a]—ஒவ்வொரு நாளுக்குரிய காரியம் அந்தந்த நாளில்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “நிலையான ஒதுக்கீடு” என்பதற்கான எபிரெயச் சொல், உறுதியான ஏற்பாடு அல்லது நிறுவப்பட்ட கடமை என்றும் பொருள்படலாம்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெய மரபுத்தொடர் சொற்சார்பாக, “ஒரு நாளின் காரியம் அதன் நாளில்” என்பதாகும்; நாள்தோறும் தேவையானது அந்நாளிலேயே எனும் கருத்தைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய கூற்றிற்கான காரணத்தை அறிமுகப்படுத்துவதால், தமிழில் இயல்பான காரண இணைப்பாகத் தேர்ந்தெடுக்கப்பட்டது.
- source_word: מִצְוַת הַמֶּלֶךְ
  choice: அரசனின் கட்டளை
  rationale: அரசனிடமிருந்து வந்த அதிகாரப்பூர்வ ஆணை என்ற பொருளைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: עֲלֵיהֶם
  choice: அவர்கள்மேல் இருந்தது
  rationale: கட்டளை அவர்கள்மீது பொறுப்பாக அல்லது கடமையாக இருந்தது என்ற எபிரெய உருவகத்தைப் பாதுகாக்கிறது.
- source_word: וַאֲמָנָה
  choice: ஓர் உறுதியான ஏற்பாடு
  rationale: אֲמָנָה என்பதன் உறுதிப்படுத்தப்பட்ட நிர்வாக ஏற்பாடு அல்லது நிலையான ஒதுக்கீடு என்ற பொருளை, வழங்கல் மட்டுமே எனக் குறுக்காமல் பாதுகாக்கிறது.
- source_word: עַל הַמְשֹׁרְרִים
  choice: பாடகர்களுக்காக
  rationale: சூழலில் அந்த ஏற்பாடு பாடகர்களைச் சார்ந்தது என்பதை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: דְּבַר יוֹם בְּיוֹמוֹ
  choice: ஒவ்வொரு நாளுக்கும் உரியதை அந்தந்த நாளில் வழங்குவதற்கான
  rationale: நாள்தோறும் தேவையான பங்கு அல்லது கடமை அந்நாளிலேயே நிறைவேற்றப்படுதல் என்ற எபிரெய மரபுத்தொடரின் நிர்வாகப் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
