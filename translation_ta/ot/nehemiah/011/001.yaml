  register: நவீன பொதுத்தரத் தமிழில், மரியாதையும் வாசிப்புத் தெளிவும் காக்கப்பட்டுள்ளன. எபிரெய வாக்கியத்தின் தொடர்ச்சியான வாவ் இணைப்பை தேவையற்ற ‘இப்போது’ என்பதாக மாற்றாமல், தமிழில் இயல்பான இரண்டு வாக்கியங்களாக அமைக்கப்பட்டுள்ளது.
