  text: וַ/יֵּשְׁב֥וּ שָׂרֵֽי הָ/עָ֖ם בִּ/ירוּשָׁלִָ֑ם וּ/שְׁאָ֣ר הָ֠/עָם הִפִּ֨ילוּ גוֹרָל֜וֹת לְ/הָבִ֣יא אֶחָ֣ד מִן הָ/עֲשָׂרָ֗ה לָ/שֶׁ֨בֶת֙ בִּֽ/ירוּשָׁלִַ֨ם֙ עִ֣יר הַ/קֹּ֔דֶשׁ וְ/תֵ֥שַׁע הַ/יָּד֖וֹת בֶּ/עָרִֽים־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/011/001.yaml
  text: The officials of the people lived in Jerusalem[a], and the rest of the people cast lots to bring one out of ten to live in Jerusalem, the holy city, while nine parts remained in the towns.
translation:
  language: ta
  text: மக்களின் தலைவர்கள் எருசலேமில் குடியிருந்தார்கள். மீதமுள்ள மக்கள், பத்தில் ஒருவரைப் பரிசுத்த நகரமான எருசலேமில் குடியிருக்கக் கொண்டுவருவதற்காகச் சீட்டுப் போட்டார்கள்; மீதமுள்ள ஒன்பது பங்குகள் பிற பட்டணங்களில் இருந்தன.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שָׂרֵי הָעָם
  choice: மக்களின் தலைவர்கள்
  rationale: שָׂרִים என்பது ஆட்சிப் பொறுப்புள்ள தலைவர்களையோ அதிகாரிகளையோ குறிக்கலாம். இச்சூழலில் இயல்பான நவீன தமிழில் ‘மக்களின் தலைவர்கள்’ என்பது பொருத்தமாக உள்ளது; ‘இளவரசர்கள்’ என்ற காலத்திற்குப் பொருந்தாத பொருளைத் தவிர்க்கிறது.
- source_word: וַיֵּשְׁבוּ / לָשֶׁבֶת
  choice: குடியிருந்தார்கள் / குடியிருக்க
  rationale: ישׁב இங்கு உட்காருவதைக் குறிக்காமல் ஓரிடத்தில் வசிப்பதைக் குறிக்கிறது. ‘குடியிரு’ என்பது குடியேற்றச் சூழலையும் தொடர்ந்த வசிப்பையும் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: וּשְׁאָר הָעָם
  choice: மற்ற மக்களோ
  rationale: שְׁאָר என்பது மீதியினர் அல்லது மற்றவர்கள் என்று பொருள். ‘மற்ற மக்களோ’ என்பது தலைவர்களுடன் உள்ள வேறுபாட்டை இயல்பாகக் காட்டுகிறது.
- source_word: הִפִּילוּ גוֹרָלוֹת
  choice: சீட்டுப் போட்டார்கள்
  rationale: தேர்வு செய்வதற்காகச் சீட்டுகளைப் பயன்படுத்திய செயலை நவீன தமிழில் தெளிவாகவும் வழக்காகவும் தெரிவிக்கிறது.
- source_word: לְהָבִיא
  choice: கொண்டுவருவதற்காக
  rationale: בוא என்பதன் ஹிஃபீல் வடிவம் தேர்ந்தெடுக்கப்பட்டவரை எருசலேமுக்கு வரச் செய்வதைக் குறிக்கிறது; ஆகவே causative force பாதுகாக்கப்படுகிறது.
- source_word: אֶחָד מִן הָעֲשָׂרָה
  choice: பத்துப் பேருக்கு ஒருவரை
  rationale: ஒரு பத்தில் ஒருவர் என்ற தேர்வு விகிதத்தை சாதாரண வாசகருக்குத் தெளிவாகத் தருகிறது.
- source_word: עִיר הַקֹּדֶשׁ
  choice: பரிசுத்த நகரம்
  rationale: கட்டமைப்பின் நேரடியான பொருளைத் தரும், வேதாகமத் தமிழில் பரிச்சயமானதும் நவீன வாசகருக்குப் புரியக்கூடியதுமான சொற்றொடர்.
- source_word: וְתֵשַׁע הַיָּדוֹת
  choice: மீதமுள்ள ஒன்பது பங்கினர்
  rationale: எபிரெயத்தில் சொல்லர்த்தமாக ‘ஒன்பது கைகள்’ என்றிருந்தாலும், இங்கு பத்து பங்குகளில் மீதமுள்ள ஒன்பது பங்கினரைக் குறிக்கும் மரபுத்தொடர். தமிழில் மக்கள் குறிக்கப்படுவதால் ‘பங்கினர்’ என இயல்பாக்கப்பட்டுள்ளது; சொல்லர்த்தம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: בֶּעָרִים
  choice: பிற பட்டணங்களில்
  rationale: עָרִים நகரங்களையோ பட்டணங்களையோ குறிக்கலாம். எருசலேமுக்கு மாறான யூதாவின் பிற குடியிருப்புகளைக் குறிக்கும் இச்சூழலில் ‘பிற பட்டணங்கள்’ இயல்பானது.
