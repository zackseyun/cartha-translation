base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/011/030.yaml
  text: Zanoah[a], Adullam and their villages, Lachish and its fields, Azekah and its daughter towns[b]. So they camped from Beer-sheba as far as the Valley of Hinnom.
translation:
  language: ta
  text: சானோவா, அதுல்லாம் மற்றும் அவற்றின் கிராமங்கள்; லாகீஸ் மற்றும் அதன் வயல்வெளிகள்; அசெக்கா மற்றும் அதைச் சார்ந்த ஊர்கள்[a]. அவர்கள் பெயெர்செபா முதல் இன்னோம் பள்ளத்தாக்குவரை முகாமிட்டனர்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லர்த்தமாக, ‘அதன் மகள் ஊர்கள்’; அதாவது, அசெக்காவைச் சார்ந்த சிற்றூர்கள் அல்லது துணைக் குடியிருப்புகள்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘குடியேறினர்.’ இச்சூழலில் இந்த வினைச்சொல் குடியேறி வாழத் தொடங்கியதையும் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
