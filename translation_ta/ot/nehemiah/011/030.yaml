  choice: சானோவா
  rationale: இடப்பெயரை எபிரெய ஒலிப்புக்கு நெருக்கமாகத் தமிழில் எழுத்துப்பெயர்த்துள்ளது.
- source_word: עֲדֻלָּם
  choice: அதுல்லாம்
  rationale: இடப்பெயரை மொழிபெயர்க்காமல் வழக்கமான தமிழ் வடிவில் எழுத்துப்பெயர்த்துள்ளது.
- source_word: חַצְרֵיהֶם
  choice: அவற்றின் கிராமங்கள்
  rationale: குடியிருப்புப் பட்டியல்களில் חָצֵר என்பது முதன்மை நகரங்களைச் சார்ந்த சிறிய கிராமங்களைக் குறிக்கிறது; பன்மை உருபான ‘அவற்றின்’ என்பது சானோவாவையும் அதுல்லாமையும் இயல்பாகச் சுட்டுகிறது.
- source_word: לָכִישׁ
  choice: லாகீஸ்
  rationale: இடப்பெயரின் தமிழ் எழுத்துப்பெயர்ப்பு.
- source_word: שְׂדֹתֶיהָ
  choice: அதன் வயல்வெளிகள்
  rationale: שָׂדֶה என்பதன் தெளிவான பொருளான வயல் என்பதையும் நகரைச் சுற்றிய வேளாண் நிலங்களையும் பாதுகாக்கிறது.
- source_word: עֲזֵקָה
  choice: அசெக்கா
  rationale: இடப்பெயரின் தமிழ் எழுத்துப்பெயர்ப்பு.
- source_word: בְנֹתֶיהָ
  choice: அதைச் சார்ந்த ஊர்கள்
  rationale: சொல்லர்த்தமான ‘மகள் ஊர்கள்’ என்ற எபிரெய மரபுத்தொடர், ஒரு நகரைச் சார்ந்த துணைக் குடியிருப்புகளைக் குறிக்கிறது; இயல்பான நவீன தமிழில் பொருள் தெளிவாக வழங்கப்பட்டுள்ளது.
- source_word: וַיַּחֲנוּ
  choice: குடியேறினார்கள்
  rationale: חנה என்பதன் அடிப்படைப் பொருள் ‘முகாமிட்டார்கள்’; ஆனால் இங்குள்ள மக்களைக் குடியமர்த்தும் சூழலில் நிலையாக வசிக்கத் தொடங்கியதைக் குறிக்கும் ‘குடியேறினார்கள்’ இயல்பானது. அடிப்படைச் சொல்லர்த்தம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: מִבְּאֵר שֶׁבַע
  choice: பெயெர்செபா முதல்
  rationale: இடப்பெயருக்கு பரவலாக அறியப்படும் தமிழ் வடிவம் பயன்படுத்தப்பட்டு, מִן காட்டும் தொடக்க எல்லை ‘முதல்’ என வழங்கப்பட்டுள்ளது.
- source_word: עַד
  choice: வரை
  rationale: புவியியல் பரப்பின் இறுதி எல்லையைத் தெளிவாகக் குறிக்கிறது.
- source_word: גֵּיא הִנֹּם
  choice: இன்னோம் பள்ளத்தாக்கு
  rationale: எபிரெய இணைப்புத் தொடரின் இயல்பான தமிழ் வடிவம்; அறியப்பட்ட பள்ளத்தாக்கின் பெயரை எழுத்துப்பெயர்க்கிறது.
