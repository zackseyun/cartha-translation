base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/011/017.yaml
  text: And Mattaniah son of Micah[a], son of Zabdi, son of Asaph, was the head, who began the thanksgiving in prayer; and Bakbukiah was second among his brothers; and Abda son of Shammua, son of Galal, son of Jeduthun.
translation:
  language: ta
  text: ஆசாப்பின் மகனான சப்தியின் மகனான மீகாவின் மகன் மத்தனியா, ஜெபத்தில் நன்றிசெலுத்துதலைத் தொடங்கிய தலைவன்[a]. பக்புக்கியா தன் சகோதரர்களில் இரண்டாம் நிலையில் இருந்தான். மேலும், எதுத்தூனின் மகனான காலாலின் மகனான சம்மூவாவின் மகன் அப்தா.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயச் சொற்றொடரை இன்னும் சொற்சொல்லாக, “தொடக்கத்தின் தலைவர்; ஜெபத்தில் நன்றிசெலுத்துபவர்” என்றும் புரிந்துகொள்ளலாம். மத்தனியா நன்றிசெலுத்துதலை வழிநடத்தினார் அல்லது தொடங்கினார் என்பதே இங்குள்ள கருத்தாகத் தெரிகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: רֹאשׁ
  choice: தலைவர்
  rationale: வழிபாட்டுப் பணியில் முன்னிலை வகித்த நிலையை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது; எபிரெயச் சொல்லின் தலைமைப் பொருளைக் காக்கிறது.
- source_word: הַתְּחִלָּה
  choice: தொடங்கிவைக்கும்
  rationale: ‘தொடக்கம்’ என்ற பெயர்ச்சொல் இங்கு மத்தனியாவின் தொடக்கப் பங்கைச் சுட்டுகிறது; தமிழில் வினை வடிவம் வாக்கியத்தைத் தெளிவாக்குகிறது.
- source_word: יְהוֹדֶה לַתְּפִלָּה
  choice: ஜெபத்தில் நன்றிசெலுத்துதலை
  rationale: வழிபாட்டுச் சூழலில் ידה என்பதன் நன்றி/துதி பொருளையும், תפלה என்பதன் ஜெபப் பொருளையும் அளவுக்கு மீறி விளக்காமல் இணைக்கிறது.
- source_word: מִשְׁנֶה
  choice: இரண்டாம் நிலையில்
  rationale: வெறும் வரிசை எண்ணாக அல்லாமல் துணை அல்லது அடுத்த நிலை என்ற பதவிசார் நுட்பத்தை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: מֵאֶחָיו
  choice: தன் சகோதரர்களில்
  rationale: மூலத்தின் உறவுக்குழு மொழியைப் பேணுகிறது; ‘சக லேவியர்’ என விளக்கி விரிவாக்கவில்லை.
- source_word: יְדִיתוּן
  choice: எதுத்தூன்
  rationale: தமிழ் வேதாகமப் பெயர் மரபுக்கு ஏற்ற ஒலிபெயர்ப்பு.
theological_decisions:
- issue: வழிபாட்டுச் சூழலில் ידה என்பதன் பொருள்
  choice: நன்றிசெலுத்துதல்
  alternative: அறிக்கையிடுதல் / பாவத்தை ஒப்புக்கொள்ளுதல்
  rationale: ஆசாப்பிய வழிபாட்டுப் பின்னணியும் ஜெபத்துடனான இணைப்பும் இங்கு நன்றி அல்லது துதியைக் குறிக்கின்றன; இது கோட்பாட்டுத் தீர்மானமல்ல, சூழல்சார் சொற்பொருள் முடிவு.
- issue: רֹאשׁ הַתְּחִלָּה יְהוֹדֶה என்ற கடினமான தொடரின் தொடர்பு
  choice: மத்தனியா நன்றிசெலுத்துதலைத் தொடங்கிவைக்கும் தலைவர்
  alternative: ‘தொடக்கத்தின் தலைவர்; ஜெபத்தில் நன்றிசெலுத்துபவர்’ என்ற சொற்சொல் அமைப்பு
  rationale: தொடக்கப் பொறுப்பை மத்தனியாவின் தலைமைப் பணியுடன் இணைக்கிறது; எனினும் எபிரெயத் தொடரின் இலக்கணச் சுருக்கத்தால் வேறு பகுப்பும் சாத்தியம் என்பதால் அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையும் மாண்பும் பேணப்பட்டுள்ளன. நீண்ட வம்சத் தொடர்களில் குழப்பம் தவிர்க்க ‘வழிவந்த’ பயன்படுத்தப்பட்டுள்ளது. பெயர்கள் வழக்கமான தமிழ் வேதாகம ஒலிப்புமுறைக்கு நெருக்கமாக வழங்கப்பட்டுள்ளன.
