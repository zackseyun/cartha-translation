    reason: cultural_note
lexical_decisions:
- source_word: וּבִירוּשָׁלַם
  choice: எருசலேமில்
  rationale: இணைப்பிடைச்சொல் முந்தைய வசனத்தின் தொடர்ச்சியை உணர்த்தினாலும், தமிழில் பட்டியல் நடையில் வெளிப்படையான “மேலும்” இன்றி தொடங்குவது இயல்பாக உள்ளது; இடப்பொருள் முழுமையாகப் பாதுகாக்கப்படுகிறது.
- source_word: יָשְׁבוּ
  choice: குடியிருந்தார்கள்
  rationale: ישב இங்கு அமர்வதை அல்ல, ஓரிடத்தில் வசிப்பதை அல்லது குடியிருப்பதைச் சுட்டுகிறது. “குடியிருந்தார்கள்” மக்கள் பட்டியலின் சூழலுக்கு இயல்பானது; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: מִבְּנֵי יְהוּדָה / וּמִבְּנֵי בִנְיָמִן
  choice: யூதாவின் மக்களில் சிலரும் / பென்யமீனின் மக்களில் சிலரும்
  rationale: בני என்பதன் மரபுவழித் தோற்றத்தை “மக்கள்” தக்கவைக்கிறது; பகுதி குறிக்கும் מִן என்பதால் “சிலர்” சேர்க்கப்பட்டுள்ளது. இது நேரடி புதல்வர்களை மட்டும் குறிக்காது என்பதை அடிக்குறிப்பு விளக்குகிறது.
- source_word: מִבְּנֵי פָרֶץ
  choice: பாரேசின் வழித்தோன்றல்களில் ஒருவனான
  rationale: இங்கு בני ஒரு குல மரபைச் சுட்டுவதால், தமிழில் நேரடி புதல்வர்கள் என்ற தவறான எண்ணத்தைத் தவிர்த்து வம்சத் தொடர்பைத் தெளிவாகக் காட்டுகிறது.
- source_word: בֶּן
  choice: மகன்
  rationale: வம்சப் பட்டியலில் உள்ள ஒவ்வொரு בן என்பதும் உரைக்கு நெருக்கமாக “மகன்” என மொழிபெயர்க்கப்பட்டுள்ளது; பட்டியல் தலைமுறைகளைச் சுருக்கியிருக்கக்கூடும் என்ற பொதுவான சாத்தியம் இதனால் மறுக்கப்படவில்லை.
- source_word: עֲתָיָה / עֻזִּיָּה / זְכַרְיָה / אֲמַרְיָה / שְׁפַטְיָה / מַהֲלַלְאֵל / פָרֶץ
  choice: அத்தாயா / உசியா / சகரியா / அமரியா / செபத்தியா / மகலலெயேல் / பாரேஸ்
  rationale: எபிரெயப் பெயர்களுக்கு நெருக்கமாகவும் தமிழ் வேதாகம வாசகர்களுக்கு இயல்பாகவும் உள்ள ஒலிபெயர்ப்புகள் பயன்படுத்தப்பட்டுள்ளன.
