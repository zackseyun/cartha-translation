base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/011/004.yaml
  text: 'And in Jerusalem there lived some of the sons of Judah and some of the sons of Benjamin[a]. Of the sons of Judah: Athaiah son of Uzziah, son of Zechariah, son of Amariah, son of Shephatiah, son of Mahalalel[b], of the sons of Perez.'
translation:
  language: ta
  text: 'எருசலேமில் யூதாவின் மக்களில் சிலரும் பென்யமீனின் மக்களில் சிலரும்[b] குடியிருந்தார்கள்[a]. யூதாவின் மக்களில்: பாரேசின் வழித்தோன்றல்களில் ஒருவனான மகலலெயேலின் மகன் செபத்தியா; செபத்தியாவின் மகன் அமரியா; அமரியாவின் மகன் சகரியா; சகரியாவின் மகன் உசியா; உசியாவின் மகன் அத்தாயா.


    [a] “குடியிருந்தார்கள்” என்பதற்கு “வாழ்ந்தார்கள்” என்றும் மொழிபெயர்க்கலாம். எபிரெய வினைச்சொல் ஓரிடத்தில் வசிப்பதையோ குடியேறுவதையோ குறிக்கலாம்.


    [b] “யூதாவின் மக்கள்,” “பென்யமீனின் மக்கள்” என்பவை அந்தக் கோத்திர மரபுகளைச் சேர்ந்தவர்களை அல்லது அவர்களின் வழித்தோன்றல்களைக் குறிக்கின்றன.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “குடியிருந்தார்கள்” என்பதற்கு “வாழ்ந்தார்கள்” என்றும் மொழிபெயர்க்கலாம். எபிரெய வினைச்சொல் ஓரிடத்தில் வசிப்பதையோ குடியேறுவதையோ குறிக்கலாம்.
