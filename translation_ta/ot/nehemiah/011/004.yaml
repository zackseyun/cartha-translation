translation_notes:
  register: நவீன தரநிலைத் தமிழில், கண்ணியமான ஆனால் எளிதில் புரியும் பட்டியல் நடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய வரிசையைத் தமிழில் அப்படியே அடுக்குவதால் உருவாகும் குழப்பத்தைத் தவிர்க்க, வம்சத் தொடர் எதிர்திசையில் தெளிவுபடுத்தப்பட்டுள்ளது; எந்தப் பெயரும் உறவும் நீக்கப்படவில்லை.
