  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: שְׂרָיָ֨ה בֶן חִלְקִיָּ֜ה בֶּן מְשֻׁלָּ֣ם בֶּן צָד֗וֹק בֶּן מְרָיוֹת֙ בֶּן אֲחִיט֔וּב נְגִ֖ד בֵּ֥ית הָ/אֱלֹהִֽים־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/011/011.yaml
  text: Seraiah son of Hilkiah[a], son of Meshullam, son of Zadok, son of Meraioth, son of Ahitub[b], leader of the house of God.
translation:
  language: ta
  text: இல்க்கியாவின் மகனான செராயா, மெசுல்லாமின் மகனான இல்க்கியாவின் மகன், சாதோக்கின் மகனான மெசுல்லாமின் மகன், மெராயோத்தின் மகனான சாதோக்கின் மகன், அகிதூபின் மகனான மெராயோத்தின் மகன்; இறைவனுடைய இல்லத்தின்[a] தலைவர்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அதாவது, ஆலயம்.
    reason: cultural_note
  - marker: b
    text: ‘முதன்மையானவர்’ அல்லது ‘மேற்பார்வையாளர்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂרָיָה
  choice: செராயா
  rationale: எபிரெய தனிப்பெயரின் ஒலிப்பை நவீனத் தமிழில் இயல்பாக எழுத்துப்பெயர்த்துள்ளது.
- source_word: בֶן
  choice: மகன்
  rationale: வம்சவரிசையில் மீண்டும் மீண்டும் வரும் எபிரெயச் சொல்லின் நேரடிப் பொருள் ‘மகன்’. வம்சவரிசை இடைத் தலைமுறைகளைத் தவிர்த்திருக்கக்கூடும் என்ற சாத்தியத்தை மறுக்காமல், மூலத்தின் வடிவத்தைப் பாதுகாக்கிறது.
- source_word: נְגִיד
  choice: தலைவர்
  rationale: பொறுப்பில் அமர்த்தப்பட்ட தலைவர் என்ற பொருளைத் தெளிவாகத் தருகிறது; ‘ஆட்சியாளர்’ என்பதில் தோன்றக்கூடிய அரசருக்குரிய பொருளைத் தவிர்க்கிறது.
- source_word: בֵּית הָאֱלֹהִים
  choice: இறைவனுடைய இல்லம்
  rationale: ‘இறைவனின் வீடு/இல்லம்’ என்ற மூல உருவகத்தைப் பாதுகாக்கும் இயல்பான தமிழ்; இச்சூழலில் அது ஆலயத்தைக் குறிக்கிறது.
- source_word: הָאֱלֹהִים
  choice: இறைவன்
  rationale: இங்கு இஸ்ரவேலின் ஒரே இறைவனைக் குறிக்கும் ஒருமைப் பயன்பாடு; மரியாதையான, பொதுவாகப் புரியும் தமிழ்ச் சொல்.
theological_decisions: []
translation_notes:
  register: நவீனத் தரத் தமிழில், மரியாதையும் வாசிப்புத் தெளிவும் கொண்ட நடை. நீண்ட வம்சவரிசையை அரைப்புள்ளிகளால் பிரித்து உறவுகளைத் தெளிவாக்கியுள்ளது; ‘இறைவனுடைய இல்லம்’ என்ற எபிரெய உருவகம் முதன்மை உரையில் பாதுகாக்கப்பட்டு, அதன் சூழற்பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
