  text: and in Ziklag[a], and in Mekonah and its daughter villages.
translation:
  language: ta
  text: சிக்லாகிலும், மெகோனாவிலும், மெகோனாவைச் சார்ந்த சிற்றூர்களிலும்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/בְ/צִֽקְלַ֥ג
  choice: சிக்லாகிலும்
  rationale: வாவ் இணைப்பையும் பெத் இடப்பொருளையும் தமிழில் இயல்பாக ‘-இலும்’ எனக் கொடுத்துள்ளோம்; צִקְלַג என்பது இடப்பெயர் என்பதால் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: וּ/בִ/מְכֹנָ֖ה
  choice: மெகோனாவிலும்
  rationale: இணைப்பும் இடப்பொருளும் ‘-இலும்’ என்ற விகுதியால் வெளிப்படுத்தப்பட்டுள்ளன; מְכֹנָה இடப்பெயராக ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: וּ/בִ/בְנֹתֶֽי/הָ
  choice: அதைச் சார்ந்த சிற்றூர்களிலும்
  rationale: சொல்லுக்குச் சொல் ‘அதன் மகள்களிலும்’ என்று வரும் எபிரெய வழக்கு, ஒரு முதன்மை ஊரைச் சார்ந்த சிறிய குடியிருப்புகளைக் குறிக்கிறது. நவீன தமிழில் பொருள் தெளிவாக இருக்க ‘அதைச் சார்ந்த சிற்றூர்கள்’ என மொழிபெயர்க்கப்பட்டுள்ளது; பெண்பால் ஒருமை பின்னொட்டு மெகோனாவைக் குறிக்கிறது.
theological_decisions: []
translation_notes:
  register: நவீனத் தரத் தமிழில், இடங்களின் பட்டியலாக இயல்பாக வாசிக்கும்படி அமைக்கப்பட்டுள்ளது. எபிரெய மூலத்தில் வினைச்சொல் இல்லாததால், முந்தைய வசனங்களிலிருந்து தொடரும் கருத்தைத் தமிழில் முழுமைப்படுத்த ‘குடியேறினார்கள்’ சேர்க்கப்பட்டுள்ளது; இது புதிய தகவலைச் சேர்ப்பதல்ல.
