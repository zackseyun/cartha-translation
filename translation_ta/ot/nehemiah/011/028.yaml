    text: சொல்லுக்குச் சொல், ‘அதன் மகள்களிலும்’; இது மெகோனாவைச் சார்ந்த சிறிய ஊர்கள் அல்லது குடியிருப்புகளைக் குறிக்கும் எபிரெய மரபுத்தொடர்.
    reason: lexical_alternative
