  yaml_path: translation/ot/nehemiah/011/036.yaml
  text: And from the Levites[a], divisions in Judah belonged to Benjamin.
translation:
  language: ta
  text: லேவியர்களில், யூதாவிலுள்ள பிரிவுகள்[a] பென்யமீனுக்குரியவையாக இருந்தன.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “லேவியர்களிலிருந்து, யூதாவின் பிரிவுகள் பென்யமீனுக்காக இருந்தன.” எபிரெய வாசகம் மிகவும் சுருக்கமாக உள்ளது; “யூதா”வுக்கும் “பென்யமீன்” என்பதற்கும் இடையிலான துல்லியமான தொடர்பு வெளிப்படையாகக் கூறப்படவில்லை.
    reason: alternative_reading
lexical_decisions:
- source_word: וּמִן
  choice: …இல் சில
  rationale: இணைப்பிடைச்சொல்லும் ‘இலிருந்து/இல்’ என்ற உறவைக் குறிக்கும் முன்னொட்டும் தமிழில் இயல்பாகத் தொடரும்படி அமைக்கப்பட்டுள்ளன; பகுதியெடுக்கும் பொருளை ‘சில’ வெளிப்படுத்துகிறது.
- source_word: הַלְוִיִּם
  choice: லேவியர்கள்
  rationale: மூலத்தின் மக்கள்-குழுப் பெயரை நேரடியாகவும் நவீனத் தமிழில் இயல்பாகவும் தருகிறது.
- source_word: מַחְלְקוֹת
  choice: பிரிவுகள்
  rationale: நிர்வாக அல்லது ஒதுக்கீட்டுக் குழுக்களைக் குறிக்கும் பன்மைச் சொல்லின் பொருளைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: יְהוּדָה
  choice: யூதாவில்
  rationale: சுருக்கமான எபிரெயத் தொடரைச் சூழலுக்கு ஏற்ற இடப்பொருளில் வாசிக்கிறது; ‘யூதாவின்’ என்பதும் இலக்கணரீதியாகச் சாத்தியம் என்பதால் அது அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: לְבִנְיָמִין
  choice: பென்யமீனுக்கு உரியவையாக இருந்தன
  rationale: לְ முன்னொட்டு குறிக்கும் தொடர்பு அல்லது ஒதுக்கீட்டை தமிழில் புரியும்படி வெளிப்படுத்துகிறது; மூலத்தில் விடுபட்டுள்ள வினைச்சொல் அளவுக்கு மீறி விரிவாக்கப்படவில்லை.
