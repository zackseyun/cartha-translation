id: NEH.11.25
reference: Nehemiah 11:25
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וְ/אֶל הַ/חֲצֵרִ֖ים בִּ/שְׂדֹתָ֑/ם מִ/בְּנֵ֣י יְהוּדָ֗ה יָֽשְׁב֞וּ בְּ/קִרְיַ֤ת הָֽאַרְבַּע֙ וּ/בְנֹתֶ֔י/הָ וּ/בְ/דִיבֹן֙ וּ/בְנֹתֶ֔י/הָ וּ/בִֽ/יקַּבְצְאֵ֖ל וַ/חֲצֵרֶֽי/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/011/025.yaml
  text: As for the villages in their fields[a], some of the sons of Judah lived in Kiriath-arba and its villages, and in Dibon and its villages[c][b], and in Jekabzeel and its settlements.
translation:
  language: ta
  text: அவர்களுடைய வயல்வெளிகளில் இருந்த சிற்றூர்களைப் பொறுத்தவரை, யூதாவின் மக்களில் சிலர் கிரியாத்-அர்பாவிலும்[a] அதைச் சார்ந்த ஊர்களிலும்[b], தீபோனிலும் அதைச் சார்ந்த ஊர்களிலும், யெகப்செயேலிலும்[c] அதைச் சார்ந்த குடியிருப்புகளிலும் வாழ்ந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: கிரியாத்-அர்பா என்பது எப்ரோனின் பழைய பெயர்; யோசுவா 14:15-ஐ ஒப்பிடுக.
    reason: cross_reference
  - marker: b
    text: எபிரெயத்தில், “அதன் மகள்கள்”; இது ஒரு நகரத்தைச் சார்ந்த அல்லது அதைச் சுற்றியுள்ள ஊர்களைக் குறிக்கும் மரபுத்தொடர்.
    reason: lexical_alternative
  - marker: c
    text: தொடர்புடைய சில மரபுகளிலும் வேதப்பகுதிகளிலும் யெகப்செயேல் என்பது “கப்செயேல்” என்றும் வழங்கப்படுகிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: וְאֶל הַחֲצֵרִים בִּשְׂדֹתָם
  choice: அவர்களுடைய வயல்வெளிகளில் இருந்த சிற்றூர்களைப் பொறுத்தவரை
  rationale: וְאֶל இங்கு பட்டியலில் புதிய புவியியல் பிரிவை அறிமுகப்படுத்துகிறது; அதனால் இயல்பான தலைப்புமாற்றமாக மொழிபெயர்க்கப்பட்டது. חֲצֵרִים என்பது இச்சூழலில் முற்றங்களை அல்ல, சிறிய ஊர்களைக் குறிக்கிறது; שָׂדוֹת என்பதன் வேளாண்மை சார்ந்த பொருளை ‘வயல்வெளிகள்’ காக்கிறது.
- source_word: מִבְּנֵי יְהוּדָה
  choice: யூதாவின் மக்களில் சிலர்
  rationale: מִן என்பதன் பகுதியைக் குறிக்கும் வலிமையை ‘சிலர்’ வெளிப்படுத்துகிறது. בְּנֵי என்பதன் சொற்பொருளைத் தமிழில் இயல்பாக வைத்துக்கொண்டே இது யூதா கோத்திரத்தைச் சேர்ந்தவர்களைக் குறிக்கும் குழுப்பெயராகப் புரியும்படி மொழிபெயர்க்கப்பட்டது.
- source_word: יָשְׁבוּ
  choice: வாழ்ந்தார்கள்
  rationale: இங்கு வினைச்சொல் குடியிருப்பதைக் குறிக்கிறது; ஆரம்பமாகக் குடியேறிய செயலை அவசியம் உணர்த்தாததால் ‘வாழ்ந்தார்கள்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: בְּקִרְיַת הָאַרְבַּע
  choice: கிரியாத்-அர்பாவில்
  rationale: இடப்பெயர் ஒலிபெயர்க்கப்பட்டது; இது எப்ரோன் என்ற அடையாளம் வசனத்தில் சேர்க்கப்படாமல் அடிக்குறிப்பில் தரப்பட்டது.
- source_word: וּבְנֹתֶיהָ
  choice: அதைச் சார்ந்த ஊர்களில்
  rationale: சொல்லர்த்தமாக ‘அதன் மகள்கள்’; ஒரு முதன்மை நகரத்தைச் சார்ந்த துணை ஊர்களைக் குறிக்கும் எபிரெய மரபுத்தொடரை இயல்பான தமிழில் அளிக்கிறது.
- source_word: וּבְדִיבֹן
  choice: தீபோனில்
  rationale: இடப்பெயர் ஒலிபெயர்க்கப்பட்டது.
- source_word: וּבִיקַּבְצְאֵל
  choice: யெகப்செயேலில்
  rationale: WLC வடிவத்தில் உள்ள ஆரம்ப யொத் ஒலியைப் பிரதிபலிக்கும் வகையில் ஒலிபெயர்க்கப்பட்டது; தொடர்புடைய இடங்களில் காணப்படும் கப்செயேல் என்ற வடிவம் அடிக்குறிப்பில் குறிப்பிடப்பட்டது.
- source_word: וַחֲצֵרֶיהָ
  choice: அதைச் சார்ந்த குடியிருப்புகளில்
  rationale: சார்பு கிராமப்புறக் குடியிருப்புகளைக் குறிக்கிறது. முந்தைய בְּנוֹתֶיהָ என்பதிலிருந்து சொல் வேறுபாட்டைத் தக்கவைக்க ‘குடியிருப்புகள்’ பயன்படுத்தப்பட்டது.
theological_decisions:
- issue: מִבְּנֵי יְהוּדָה என்ற பாலினக் குறியீடுள்ள கோத்திரப் பெயரிடல்
  choice: யூதாவின் மக்களில் சிலர்
  alternative: யூதா மக்களில் சிலர்
  rationale: ‘மக்கள்’ என்று முற்றிலும் பாலினநடுநிலையாக்காமல், எபிரெய உரையின் ‘மகன்கள்’ சார்ந்த வடிவத்தைத் தமிழின் இயல்பான ‘மக்கள்’ என்ற உறவுப்பெயர் மூலம் காக்கிறது; இச்சூழலில் அது கோத்திரத்தைச் சேர்ந்தவர்களைக் குறிக்கிறது, ஆண்கள் மட்டுமே அங்கு வாழ்ந்தார்கள் என்ற இறையியல் முடிவைச் சேர்ப்பதில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழ்; பட்டியல் பாணியின் கண்ணியமும் புவியியல் துல்லியமும் காக்கப்பட்டுள்ளன. அரிதான எபிரெய உருவகமான ‘மகள் ஊர்கள்’ என்பதை நேரடியாகப் பயன்படுத்தாமல், பொதுவாசகர்களுக்குப் புரியும் ‘சார்ந்த ஊர்கள்’ என வழங்கி, சொல்லர்த்தம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
