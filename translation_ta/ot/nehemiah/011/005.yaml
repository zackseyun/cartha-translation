base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/011/005.yaml
  text: and Maaseiah son of Baruch[a], son of Col-hozeh, son of Hazaiah, son of Adaiah, son of Joiarib, son of Zechariah, son of the Shilonite.
translation:
  language: ta
  text: ஷீலோனியரான சகரியாவின் மகன் யோயாரீபின் மகன் அதாயாவின் மகன் அசாயாவின் மகன் கோல்-கோசேயின் மகன் பாரூக்கின் மகன் மாசெயாவும்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/מַעֲשֵׂיָה
  choice: மாசெயாவும்
  rationale: முந்தைய வசனத்தின் பட்டியலைத் தொடரும் வாவ் இணைப்பைத் தமிழ் பட்டியல் நடைக்கேற்ப பெயருடன் சேரும் ‘-வும்’ எனக் கொடுத்துள்ளோம்; தனிப்பெயர் மொழிபெயர்க்கப்படாமல் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: בֶן
  choice: மகன்
  rationale: வம்சத் தொடரில் மீண்டும் மீண்டும் வரும் בֶן என்பதன் நேரடியான உறவுமுறையைப் பாதுகாக்க ‘மகன்’ என்று ஒரேவிதமாக வழங்கப்பட்டுள்ளது. தமிழில் தெளிவாக வாசிக்க, எபிரெய வரிசை இயல்பான உடைமைத் தொடர் வரிசையாக மாற்றப்பட்டுள்ளது.
- source_word: בָּרוּךְ
  choice: பாரூக்
  rationale: எபிரெய தனிப்பெயரின் ஒலிப்பை அணுகும் தமிழ் ஒலிபெயர்ப்பு.
- source_word: כָּל חֹזֶה
  choice: கோல்-கோசே
  rationale: இது பொருள் மொழிபெயர்க்க வேண்டிய சொற்றொடராக அல்லாமல் தனிப்பெயராகச் செயல்படுவதால் ஒலிபெயர்க்கப்பட்டுள்ளது; இரண்டு கூறுகளும் இணைப்புக்குறியால் காட்டப்பட்டுள்ளன.
- source_word: חֲזָיָה
  choice: அசாயா
  rationale: தனிப்பெயர் தமிழில் எளிதாக உச்சரிக்கத்தக்க வகையில் ஒலிபெயர்க்கப்பட்டுள்ளது; தொடக்க எபிரெய ח ஒலி தமிழின் வழக்கமான வேதாகமப் பெயர் நடைக்கேற்ப உயிர்முதலாக வழங்கப்பட்டுள்ளது.
- source_word: עֲדָיָה
  choice: அதாயா
  rationale: எபிரெய தனிப்பெயரின் ஒலிப்பை அணுகும் தமிழ் ஒலிபெயர்ப்பு.
- source_word: יוֹיָרִיב
  choice: யோயாரீப்
  rationale: இங்குள்ள எபிரெய வடிவத்தையே ஒலிபெயர்த்துள்ளது; விரிவாக்கப்பட்ட இறைபெயர்க் கூறைச் சேர்க்கவில்லை.
- source_word: זְכַרְיָה
  choice: சகரியா
  rationale: நவீனத் தமிழில் நிலைபெற்ற வேதாகமப் பெயர் வடிவம் பயன்படுத்தப்பட்டுள்ளது.
- source_word: הַ/שִּׁלֹנִי
  choice: சிலோனியனான
  rationale: உறுப்புடன் வரும் இன/குல அல்லது இடத் தொடர்புச் சொல்லைத் தமிழில் ஒருவரின் தொடர்பைக் குறிக்கும் பெயரடையாக வழங்குகிறது; அது இடத் தொடர்பா குலத் தொடர்பா என்பதை முதன்மை உரை தீர்மானிக்கவில்லை.
