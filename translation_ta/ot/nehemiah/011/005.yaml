translation_notes:
  register: நவீன, மரியாதைமிக்க, பொதுவாசகர்களுக்குப் புரியும் தமிழ் பயன்படுத்தப்பட்டுள்ளது. நீண்ட எபிரெய வம்சத் தொடரைத் தமிழில் இயல்பாக வாசிக்க மூதாதையிலிருந்து மாசெயாவை நோக்கி அமைத்தாலும், ஒவ்வொரு தலைமுறைக்கும் ‘மகன்’ என்ற உறவுச் சொல் பாதுகாக்கப்பட்டுள்ளது. வசனம் முந்தைய பட்டியலின் தொடராக இருப்பதால் இறுதியில் ‘-வும்’ பயன்படுத்தப்பட்டுள்ளது.
