  text: 'ஆசாரியர்களில்: யோயாரீபின் மகன் யெதாயா, யாகீன்.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִן הַכֹּהֲנִים
  choice: ஆசாரியர்களில்
  rationale: மִן இங்கு பட்டியலில் ‘ஆசாரியர்களில்/ஆசாரியர்களுள்’ என்ற பகுதியைக் குறிக்கிறது; சுருக்கமான தலைப்புப்போன்ற எபிரெய அமைப்பை இயல்பான தமிழில் காக்கிறது.
- source_word: יְדַעְיָה
  choice: யெதாயா
  rationale: எபிரெய பெயரின் ஒலிப்பை நவீன தமிழில் அண்மையாக எழுத்துப்பெயர்த்தது.
- source_word: בֶן יוֹיָרִיב
  choice: யோயாரீபின் மகன்
  rationale: בֶן என்பதன் நேர்பொருளான உறவைக் காத்து, יוֹיָרִיב பெயரை எபிரெய ஒலிப்புக்கு அண்மையாக எழுத்துப்பெயர்க்கிறது.
- source_word: יָכִין
  choice: யாகீன்
  rationale: எபிரெய பெயரின் நீள்வொலி மற்றும் இறுதி மெய்யொலியை அண்மையாகக் காட்டும் தமிழ் எழுத்துப்பெயர்ப்பு.
