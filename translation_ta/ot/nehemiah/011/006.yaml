  yaml_path: translation/ot/nehemiah/011/006.yaml
  text: All the sons of Perez who lived in Jerusalem were four hundred sixty-eight valiant men[a].
translation:
  language: ta
  text: எருசலேமில் குடியிருந்த பெரேசின் வழிவந்தவர்கள் மொத்தம் நானூற்று அறுபத்தெட்டுப் பேர்; அவர்கள் வீரமிக்க ஆண்கள்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “வலிமைமிக்க ஆண்கள்,” “திறன்மிக்க ஆண்கள்.” எபிரெயச் சொற்றொடர் வலிமை, திறமை அல்லது வீரம் ஆகியவற்றால் சிறந்து விளங்கிய ஆண்களைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל
  choice: மொத்தம்
  rationale: பட்டியல் மற்றும் எண்ணிக்கைச் சூழலில் குழுவின் முழு எண்ணிக்கையையும் இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: בְּנֵי פֶרֶץ
  choice: பெரேசின் வழிவந்தவர்கள்
  rationale: எபிரெய மொழியில் சொற்பொருளாக ‘பெரேசின் மகன்கள்’ என்றாலும், வம்சப் பட்டியல் சூழலில் பிற்கால வழித்தோன்றல்களைக் குறிக்கிறது; ‘வழிவந்தவர்கள்’ அந்த உறவைக் குழப்பமின்றி தெரிவிக்கிறது.
- source_word: הַיֹּשְׁבִים
  choice: குடியிருந்த
  rationale: ஒரு நகரத்தில் வசித்தல் அல்லது குடியிருத்தல் என்னும் இச்சூழலுக்குரிய பொருளை இயல்பாக வழங்குகிறது.
- source_word: בִּירוּשָׁלִָם
  choice: எருசலேமில்
  rationale: இடப்பொருளைத் தெளிவாகக் காட்டும் வழக்கமான தமிழ் வடிவம்.
- source_word: אַרְבַּע מֵאוֹת שִׁשִּׁים וּשְׁמֹנָה
  choice: நானூற்று அறுபத்தெட்டுப் பேர்
  rationale: எபிரெய எண்ணைச் சொற்களால் வழங்கி, மனிதர்களின் எண்ணிக்கை என்பதைக் ‘பேர்’ மூலம் இயல்பாகத் தெளிவுபடுத்துகிறது.
- source_word: אַנְשֵׁי חָיִל
  choice: வீரமிக்க ஆண்கள்
  rationale: வலிமை, திறமை, வீரம் ஆகிய பாராட்டுக்குரிய பண்புகளைக் குறிக்கக்கூடிய சொற்றொடரின் வீரத்தன்மையைத் தக்கவைக்கிறது; அதன் பரந்த பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
