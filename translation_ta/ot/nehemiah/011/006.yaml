translation_notes:
  register: நவீனத் தரமான, கண்ணியமான தமிழில் பட்டியல் நடையின் சுருக்கம் பேணப்பட்டுள்ளது. ‘மகன்கள்’ என்பதற்குப் பதிலாக வம்சவழிப் பொருளைத் தெளிவாக்க ‘வழிவந்தவர்கள்’ பயன்படுத்தப்பட்டுள்ளது; אַנְשֵׁי חָיִל என்பதன் பொருள் வரம்பு அடிக்குறிப்பில் திறந்தவாறே வைக்கப்பட்டுள்ளது.
