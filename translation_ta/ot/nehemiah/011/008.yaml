lexical_decisions:
- source_word: וְאַחֲרָיו
  choice: அவனுக்குப் பின்பு
  rationale: எபிரெயச் சொற்றொடரின் இயல்பான பொருள் ‘அவனுக்குப் பின்பு’ என்பதாகும். இப்பட்டியல் சூழலில் இது வரிசையைக் குறிப்பதாகப் புரிந்துகொள்வது பொருத்தமானது; இடத்தைக் குறிக்கும் சாத்தியம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
- source_word: גַּבַּי
  choice: கப்பாய்
  rationale: எபிரெயப் பெயரின் ஒலிப்பை நவீனத் தமிழுக்கு இயல்பாக எழுத்துப்பெயர்த்துள்ளது.
- source_word: סַלָּי
  choice: சல்லாய்
  rationale: எபிரெயப் பெயரின் ஒலிப்பை நவீனத் தமிழுக்கு இயல்பாக எழுத்துப்பெயர்த்துள்ளது.
- source_word: תְּשַׁע מֵאוֹת עֶשְׂרִים וּשְׁמֹנָה
  choice: தொள்ளாயிரத்து இருபத்தெட்டு
  rationale: எபிரெய எண்ணின் கூறுகள் 900 + 20 + 8 எனத் தெளிவாக 928-ஐக் குறிக்கின்றன. தமிழில் சொல்லெண்ணாக வழங்குவது வாசிப்புக்கு இயல்பானது.
