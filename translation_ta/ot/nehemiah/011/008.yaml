  language: ta
  text: அவனுக்குப் பின்பு கப்பாயும் சல்லாயும் இருந்தார்கள்; மொத்தம் தொள்ளாயிரத்து இருபத்தெட்டுப் பேர்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, இச்சூழலில் சாத்தியம் குறைவாக, இச்சொற்றொடரை வரிசையைக் குறிப்பதாக அல்லாமல் இடத்தைக் குறிப்பதாக எடுத்தால், “அவனுக்கு அருகில்.”
