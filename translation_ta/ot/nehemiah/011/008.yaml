translation_notes:
  register: நவீனத் தரமான, கண்ணியமான தமிழில் பட்டியல் நடையைப் பேணுகிறது. ‘இருந்தார்கள்’ என்பது எபிரெயத்தில் வெளிப்படையாக இல்லாத வினையைத் தமிழில் முழுமையான வாக்கியத்திற்காகச் சேர்க்கிறது. ‘மொத்தம்’ என்பது 928 என்பது கப்பாய், சல்லாய் ஆகியோருடன் தொடர்புடைய குழுவின் எண்ணிக்கை என்பதை இயல்பாகத் தெளிவுபடுத்துகிறது.
