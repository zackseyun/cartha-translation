  source_fidelity: 'மூல எபிரெய வம்சவரிசையின் வரிசையும் உறவுச் சங்கிலியும் துல்லியமாகக் காக்கப்பட்டுள்ளன: சல்லூ மெசுல்லாமின் மகன்; தொடர்ந்து யோவேத், பெதாயா, கோலாயா, மாசெயா, இத்தியேல், யெஷாயா என வரிசை சரியாக உள்ளது. ‘பென்யமீனின் மகன்கள்’ என்பது בְּנֵי בִנְיָמִן என்பதற்கான நேரடியான மொழிபெயர்ப்பு; அதன் விரிவான கோத்திரப் பொருள் குறிப்பில் முறையாகத் தரப்பட்டுள்ளது.'
  naturalness: நவீனத் தரத் தமிழில் வம்சவரிசைக்குப் பொருத்தமான, தெளிவான நடை. அரைப்புள்ளிகளால் பிரிக்கப்பட்ட உறவுத் தொடர் ஒவ்வொரு தலைமுறையையும் குழப்பமின்றி வாசிக்க உதவுகிறது.
  terminology: பெயர்கள் மூல எபிரெய ஒலிவடிவத்துக்கு நெருக்கமாகவும் ஒரே பாணியிலும் எழுத்துப்பெயர்க்கப்பட்டுள்ளன. ‘மகன்’ வம்சவரிசைச் சூழலில் பொருத்தமானது. யோவேத் குறித்த மாற்றுவாசிப்புக் குறிப்பு தமிழில் சரியான சொல்லுக்கு இணைக்கப்பட்டுள்ளது. ஆங்கில audit trail-இல் b குறி ‘Ithiel’ என்பதுடன் தவறாக இடப்பட்டிருப்பினும், தமிழ்வரைவில் அந்தக் குறி சரியாக ‘யோவேத்’ என்பதுடன் உள்ளது.
