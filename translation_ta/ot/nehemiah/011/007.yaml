translation_notes:
  register: நவீனத் தரத் தமிழில் கண்ணியமான, எளிதில் வாசிக்கத்தக்க வம்சவரிசை நடையைப் பயன்படுத்தியுள்ளது. நீண்ட ‘மகன்’ தொடர் தமிழில் உறவுகள் குழப்பமடையாமல் இருக்க ஒவ்வொரு தலைமுறையும் தனித்தனி கூறாக வெளிப்படுத்தப்பட்டுள்ளது. குறிப்புக்குறிகள் அவை விளக்கும் சொற்களுக்குப் பின்பே வைக்கப்பட்டுள்ளன.
