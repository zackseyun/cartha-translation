base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/011/007.yaml
  text: 'And these were the sons of Benjamin: Sallu son of Meshullam[a], son of Joed, son of Pedaiah, son of Kolaiah, son of Maaseiah, son of Ithiel[b], son of Jeshaiah.'
translation:
  language: ta
  text: 'பென்யமீனின் மகன்கள்[a] இவர்களே: மெசுல்லாமின் மகன் சல்லூ; மெசுல்லாம் யோவேத்தின்[b] மகன்; யோவேத் பெதாயாவின் மகன்; பெதாயா கோலாயாவின் மகன்; கோலாயா மாசெயாவின் மகன்; மாசெயா இத்தியேலின் மகன்; இத்தியேல் யெஷாயாவின் மகன்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘பென்யமீனின் மகன்கள்’ என்பதற்கான எபிரெய சொற்றொடரை விரிவான பொருளில் ‘பென்யமீனின் வழித்தோன்றல்கள்’ அல்லது ‘பென்யமீன் கோத்திரத்தார்’ என்றும் புரிந்துகொள்ளலாம்.
    reason: lexical_alternative
  - marker: b
    text: இங்கு மசோரா மூலப்பாடத்தில் ‘யோவேத்’ என்று உள்ளது. இதற்கு இணையான 1 நாளாகமம் 9:7 வம்சவரிசையில் ‘ஹோதவியா’ என்று உள்ளது.
    reason: alternative_reading
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: இவர்களே
  rationale: புதிய பட்டியலை அறிமுகப்படுத்தும் எபிரெய இணைப்பையும் சுட்டுப்பெயரையும், தமிழில் இயல்பான பட்டியல் தொடக்கமாக வழங்குகிறது.
- source_word: בְּנֵי בִנְיָמִן
  choice: பென்யமீனின் மகன்கள்
  rationale: சொல்லடிப்படையான ‘பென்யமீனின் மகன்கள்’ என்ற வம்சச் சொற்றொடரைத் தக்கவைக்கிறது; இது விரிவான பொருளில் வழித்தோன்றல்களையோ பென்யமீன் கோத்திரத்தாரையோ குறிக்கலாம் என்பதைக் குறிப்பில் தெரிவிக்கிறது.
- source_word: בֶּן
  choice: மகன்
  rationale: இந்த வம்சவரிசையில் நேரடியும் இயல்புமான உறவுச் சொல்லாக உள்ளது; ஒவ்வொரு பெயருக்கும் உரிய உறவைத் தெளிவுபடுத்துகிறது.
- source_word: סַלֻּא
  choice: சல்லூ
  rationale: எபிரெய ஒலிப்புக்கு நெருக்கமான தமிழ் எழுத்துப்பெயர்ப்பு.
- source_word: מְשֻׁלָּם
  choice: மெசுல்லாம்
  rationale: எபிரெய பெயரின் மெய்யொலி அமைப்பையும் இறுதி நீளத்தையும் இயன்றவரை தக்கவைக்கும் தமிழ் வடிவம்.
- source_word: יוֹעֵד
  choice: யோவேத்
  rationale: மசோரா மூலப்பாடத்தின் பெயரை ஒலிப்படியாகப் பின்பற்றுகிறது; இணையான வம்சவரிசையின் வேறுபட்ட பெயர் குறிப்பில் தரப்படுகிறது.
- source_word: פְּדָיָה
  choice: பெதாயா
  rationale: எபிரெய பெயருக்கான தெளிவான தமிழ் எழுத்துப்பெயர்ப்பு.
- source_word: קוֹלָיָה
  choice: கோலாயா
  rationale: எபிரெய உயிரொலி அமைப்பை பிரதிபலிக்கும் தமிழ் வடிவம்.
- source_word: מַעֲשֵׂיָה
  choice: மாசெயா
  rationale: பெயரின் எபிரெய ஒலியமைப்பை தமிழில் வாசிக்கத்தக்க வகையில் வழங்குகிறது.
- source_word: אִיתִיאֵל
  choice: இத்தியேல்
  rationale: எபிரெய பெயரின் ஒலிப்புக்கு நெருக்கமான, வாசிக்க எளிய தமிழ் வடிவம்.
- source_word: יְשַׁעְיָה
  choice: யெஷாயா
  rationale: இப்பெயரை பொதுவாக அறியப்படும் தீர்க்கதரிசி பெயருடன் அமைதியாக ஒன்றாக்காமல், இங்குள்ள எபிரெய வடிவத்தை நெருக்கமாகக் காட்டுகிறது.
