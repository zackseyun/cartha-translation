  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘ஆசாரியர்கள்’, ‘லேவியர்கள்’, ‘பரம்பரைச் சொத்து’ ஆகிய சொற்கள் வரலாற்று மற்றும் நிலப்பங்கு நுணுக்கங்களைத் தக்கவைக்கின்றன.
