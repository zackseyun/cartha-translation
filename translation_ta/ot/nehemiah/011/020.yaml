base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/011/020.yaml
  text: And the rest of Israel[a], the priests, and the Levites were in all the cities of Judah, each in his inheritance.
translation:
  language: ta
  text: இஸ்ரவேலரில் மீதியாயிருந்தவர்களும், ஆசாரியர்களும், லேவியர்களும் யூதாவின் எல்லாப் பட்டணங்களிலும் அவரவர்[a] மரபுரிமை நிலத்தில் இருந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “ஒவ்வொருவனும் அவனுடைய மரபுரிமையில்” என ஆண்பால் ஒருமை வடிவில் உள்ளது; இது ஒவ்வொருவரையும் தனித்தனியாகக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׁאָר יִשְׂרָאֵל
  choice: இஸ்ரவேலின் மற்றவர்களும்
  rationale: שְׁאָר என்பது முன்பு எருசலேமில் பட்டியலிடப்பட்டவர்களைத் தவிர மீதியிருந்த மக்களைக் குறிக்கிறது. ‘மற்றவர்கள்’ என்பது இச்சூழலில் இயல்பான நவீனத் தமிழ்.
- source_word: הַכֹּהֲנִים
  choice: ஆசாரியர்களும்
  rationale: இது இஸ்ரவேலின் ஆசாரிய வகுப்பைக் குறிக்கும் வழக்கமான தமிழ் வேதாகமச் சொல்.
- source_word: הַלְוִיִּם
  choice: லேவியர்களும்
  rationale: லேவி கோத்திரத்தைச் சேர்ந்தவர்களைக் குறிக்கும் நிலைபெற்ற பெயர்.
- source_word: בְּכָל עָרֵי יְהוּדָה
  choice: யூதாவின் எல்லாப் பட்டணங்களிலும்
  rationale: בְּ இங்கு இடப்பொருளில் வருகிறது; ‘எல்லாப் பட்டணங்களிலும்’ என்பது எபிரெய வடிவை நேரடியாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: אִישׁ
  choice: அவரவர்
  rationale: ஒருமை வடிவிலுள்ள אִישׁ இங்கு ஒவ்வொருவரையும் தனித்தனியாகச் சுட்டும் பகிர்வுப் பொருளில் வருகிறது. ‘அவரவர்’ அந்தப் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: בְּנַחֲלָתוֹ
  choice: தங்களுக்குரிய பரம்பரைச் சொத்தில்
  rationale: נַחֲלָה என்பது வெறும் உடைமையை விட, மரபாகப் பெற்ற அல்லது பங்கிடப்பட்ட நிலவுடைமையைக் குறிக்கிறது. ‘பரம்பரைச் சொத்து’ அந்த நில உரிமை நுணுக்கத்தைத் தக்கவைக்கிறது.
theological_decisions:
- issue: பகிர்வுப் பொருளுடைய ஆண்பால் ஒருமையைத் தமிழில் மொழிபெயர்த்தல்
  choice: அவரவர் தங்களுக்குரிய பரம்பரைச் சொத்தில்
  alternative: ஒவ்வொரு ஆணும் அவனுடைய பரம்பரைச் சொத்தில்
  rationale: எபிரெயத்தில் אִישׁ மற்றும் அதனுடன் தொடர்புடைய பின்னொட்டு ஆண்பால் ஒருமையில் இருந்தாலும், அவை இங்கு குழுவிலுள்ள ஒவ்வொருவரையும் பகிர்வாகக் குறிக்கின்றன. ‘அவரவர்’ மூலத்தின் பகிர்வுப் பொருளைப் பாதுகாத்து, தமிழில் தேவையற்ற ஆண்பால் வலியுறுத்தலைத் தவிர்க்கிறது.
- issue: எபிரெயத்தில் வெளிப்படையாக இல்லாத இருப்பு வினையை நிறைவு செய்தல்
  choice: குடியிருந்தார்கள்
  alternative: இருந்தார்கள்
  rationale: எபிரெய வசனம் வினையில்லா அமைப்பில் இடத்தையும் பங்கையும் குறிப்பிடுகிறது. பட்டணங்களிலும் தங்கள் பரம்பரை நிலங்களிலும் வாழ்ந்தனர் என்பதே சூழற்பொருள்; ஆகவே ‘குடியிருந்தார்கள்’ இயல்பான தமிழில் மறைமுக வினையை வெளிப்படுத்துகிறது.
