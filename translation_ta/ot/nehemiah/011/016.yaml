    text: அல்லது, “இறைவனின் இல்லத்துக்கான வெளிப்புறப் பணி.” எபிரெயச் சொற்றொடர், ஆலயத்தின் உட்பகுதியில் செய்யப்பட்ட கடமைகளுக்கு மாறாக, ஆலயத்திற்கு வெளியே செய்யப்பட்ட பணியைக் குறிப்பதாகவும் புரிந்துகொள்ளலாம்.
    reason: lexical_alternative
