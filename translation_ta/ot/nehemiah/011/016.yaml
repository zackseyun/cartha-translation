  text: וְ/שַׁבְּתַ֨י וְ/יוֹזָבָ֜ד עַל הַ/מְּלָאכָ֤ה הַ/חִֽיצֹנָה֙ לְ/בֵ֣ית הָ/אֱלֹהִ֔ים מֵ/רָאשֵׁ֖י הַ/לְוִיִּֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/011/016.yaml
  text: And Shabbethai and Jozabad[a], from the heads of the Levites, were over the outside work of the house of God.
translation:
  language: ta
  text: சப்பெத்தாயும் யோசபாத்தும் லேவியர்களின் தலைவர்களில் ஒருவராய், இறைவனின் இல்லத்தின் வெளிப்புறப் பணிக்குப் பொறுப்பில் இருந்தார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இறைவனின் இல்லத்துக்கான வெளிப்புறப் பணி.” எபிரெயச் சொற்றொடர், ஆலயத்தின் உட்பகுதியில் செய்யப்பட்ட கடமைகளுக்கு மாறாக, ஆலயத்திற்கு வெளியே செய்யப்பட்ட பணியைக் குறிப்பதாகவும் புரிந்துகொள்ளலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׁבְּתַי וְיוֹזָבָד
  choice: சப்பெத்தாயும் யோசபாத்தும்
  rationale: இரு தனிப்பெயர்களும் எபிரெய ஒலிப்பை நெருக்கமாகப் பின்பற்றித் தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளன; இணைப்பு இருவரையும் ஒரே நிர்வாகப் பொறுப்பில் இணைக்கிறது.
- source_word: עַל הַמְּלָאכָה
  choice: பணிக்குப் பொறுப்பாயிருந்தார்கள்
  rationale: இந்த நிர்வாகச் சூழலில் עַל என்பது மேற்பார்வை அல்லது பொறுப்பைக் குறிக்கிறது; מְלָאכָה என்பதன் விரிவான ‘பணி’ என்ற பொருளும் பாதுகாக்கப்படுகிறது.
- source_word: הַחִיצֹנָה
  choice: வெளிப்புறப்
  rationale: ‘வெளியில் உள்ள/வெளிப்புறமான’ என்ற அடிப்படைப் பொருளைத் தருகிறது; ஆலயத்தின் உட்புறக் கடமைகளுக்கு மாறான பணியாக இருக்கலாம் என்ற சாத்தியத்தை அளவுக்கு மீறி விளக்காமல் வைத்திருக்கிறது.
- source_word: לְבֵית הָאֱלֹהִים
  choice: இறைவனின் இல்லத்தின்
  rationale: בֵּית הָאֱלֹהִים என்பதன் ‘இறைவனின் இல்லம்’ என்ற உருவகத்தைப் பாதுகாக்கிறது. לְ இங்கு அந்தப் பணி இறைவனின் இல்லத்தோடு தொடர்புடையது என்பதைக் குறிக்கிறது.
- source_word: מֵרָאשֵׁי הַלְוִיִּם
  choice: லேவியர்களின் தலைவர்களில்
  rationale: מִן என்பதன் ‘அவர்களில்/அவர்களிலிருந்து’ என்ற உறவையும் רָאשִׁים என்பதன் நிர்வாகப் பொருளான ‘தலைவர்கள்’ என்பதையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
