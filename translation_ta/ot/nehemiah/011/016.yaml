translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பாகவும் மதிப்புடனும் அமைக்கப்பட்டுள்ளது. ‘இறைவனின் இல்லம்’ என்பது மூலத்தின் உருவகத்தைப் பாதுகாக்கிறது; ‘வெளிப்புறப் பணி’ என்பதிலுள்ள இடம் அல்லது பணிவகை சார்ந்த தெளிவின்மை அடிக்குறிப்பில் சுட்டப்பட்டுள்ளது.
