lexical_decisions:
- source_word: הַשּׁוֹעֲרִים
  choice: வாசற்காவலர்கள்
  rationale: வாசல்களைக் காக்கவும் அங்கு பணியாற்றவும் நியமிக்கப்பட்டவர்களைக் குறிக்கும் நிறுவப்பட்ட பணிப்பெயராக, இயல்பான நவீனத் தமிழில் வழங்கப்பட்டுள்ளது.
- source_word: עַקּוּב
