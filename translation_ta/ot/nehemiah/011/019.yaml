  rationale: எபிரெய தனிப்பெயரின் ஒலியைத் தமிழில் அண்மையாக எழுத்துப்பெயர்த்த வடிவம்.
- source_word: טַלְמוֹן
  choice: தல்மோன்
  rationale: எபிரெய தனிப்பெயரின் ஒலியைத் தமிழில் அண்மையாக எழுத்துப்பெயர்த்த வடிவம்.
- source_word: וַאֲחֵיהֶם
  choice: அவர்களுடைய சகோதரர்கள்
  rationale: אָח என்பதன் அடிப்படைப் பொருளான ‘சகோதரர்கள்’ என்பதைக் காத்துள்ளது; இத்தகைய பட்டியலில் இது ஆண் உறவினர்களையோ அதே குழுவைச் சேர்ந்தவர்களையோ குறிக்கக்கூடும் என்பதால் மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: הַשֹּׁמְרִים
  choice: காவல் காத்த
  rationale: שׁמר வினையின் பங்கேற்பு வடிவம் தொடர்ச்சியான காவல் பணியைச் சுட்டுகிறது; தமிழில் இயல்பான பணிவிவரமாக வழங்கப்பட்டுள்ளது.
- source_word: בַּשְּׁעָרִים
  choice: வாசல்களில்
  rationale: அவர்கள் காவல் பணியாற்றிய இடங்களைக் குறிக்கும் எபிரெய முன்னிடைச்சொல் அமைப்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: מֵאָה שִׁבְעִים וּשְׁנָיִם
  choice: நூற்று எழுபத்திரண்டு
  rationale: மொத்த எண்ணிக்கையான 172-ஐ நவீனத் தமிழின் வழக்கமான எண்ணுப்பெயர் வடிவில் துல்லியமாக வழங்குகிறது.
