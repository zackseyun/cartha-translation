    text: அல்லது, ‘அவர்களுடைய உறவினர்கள்’; ‘சகோதரர்கள்’ என்பதற்கான எபிரெயச் சொல் நெருங்கிய ஆண் உறவினர்களையோ அதே குழுவைச் சேர்ந்தவர்களையோ குறிக்கலாம்.
