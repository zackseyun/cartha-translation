  text: வாசற்காவலர்களான அக்கூப், தல்மோன், வாசல்களில் காவல் காத்த அவர்களுடைய சகோதரர்கள்[a] ஆகியோர் மொத்தம் நூற்று எழுபத்திரண்டு பேர்.
  philosophy: optimal-equivalence
  footnotes:
