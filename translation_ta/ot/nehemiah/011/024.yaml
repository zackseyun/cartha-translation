base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/011/024.yaml
  text: And Pethahiah son of Meshezabel[a], from the sons of Zerah son of Judah[b], was at the king’s side for every matter concerning the people.
translation:
  language: ta
  text: மேலும், யூதாவின் மகனான சேராகின் வழிவந்தவர்களில் ஒருவராகிய மெஷேசபெலின் மகன் பெத்தகியா, மக்களைப் பற்றிய[b] எல்லா விவகாரங்களிலும் அரசனின் அருகில் இருந்தார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மொழியில் சொல்லர்த்தமாக, “அரசனின் கையில்” என்று உள்ளது; இது “அரசனின் பிரதிநிதியாக இருந்தார்” அல்லது “அரசனுக்கு அருகில் இருந்தார்” என்றும் பொருள்படலாம்.
    reason: lexical_alternative
  - marker: b
    text: “மக்களுக்காக” என்றும் மொழிபெயர்க்கலாம். இது மக்களைப் பற்றிய விவகாரங்களையோ, அவர்கள் சார்பாகக் கையாளப்பட்ட விவகாரங்களையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/פְתַֽחְיָה
  choice: பெத்தகியா
  rationale: முன்னுள்ள நிர்வாகப் பட்டியலுடன் வசனத்தை இணைக்கும் וּ தமிழில் தனியாக மொழிபெயர்க்கப்படாமல், பட்டியல் நடையின் தொடர்ச்சியால் உணர்த்தப்படுகிறது; பெயர் எபிரெய உச்சரிப்புக்கு ஏற்ப ஒலிபெயர்க்கப்பட்டது.
- source_word: בֶּן מְשֵֽׁיזַבְאֵל
  choice: மெசேசபெலின் மகன்
  rationale: எபிரெய மரபுவழிக் கட்டமைப்பை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: מִ/בְּנֵי זֶרַח בֶּן יְהוּדָה
  choice: யூதாவின் மகனான சேராகின் வழிவந்தவர்களில் ஒருவன்
  rationale: מִן உடன் வரும் ‘மகன்கள்’ என்பது இங்கு வம்சத்தாரைக் குறிக்கிறது. யூதா—சேராக் என்ற மரபுவழித் தொடர் தெளிவாகப் பாதுகாக்கப்படுகிறது.
- source_word: לְ/יַד הַ/מֶּלֶךְ
  choice: அரசனுக்கு அருகில் பணியாற்றினார்
  rationale: சொல்லர்த்தமாக ‘அரசனின் கையில்/அருகில்’ எனும் மரபுத்தொடர் அரச அதிகாரத்தின் கீழ் அருகிலிருந்து சேவை செய்ததையோ அரச பிரதிநிதியாகச் செயல்பட்டதையோ குறிக்கலாம். தமிழில் இயல்பாக இருக்க ‘அருகில் பணியாற்றினார்’ என வழங்கி, மாற்று நுண்பொருட்கள் அடிக்குறிப்பில் வைக்கப்பட்டன.
- source_word: לְ/כָל דָּבָר
  choice: எல்லா விவகாரங்களிலும்
  rationale: דָּבָר இங்கு சொல் அல்லது பேச்சு என்பதைவிட நிர்வாக விவகாரத்தைக் குறிக்கிறது.
- source_word: לָ/עָם
  choice: மக்களைப் பற்றிய
  rationale: לְ என்ற முன்னொட்டு மக்கள் தொடர்பான விவகாரங்களையோ அவர்களுக்காகக் கையாளப்பட்ட விவகாரங்களையோ குறிக்கலாம்; முதன்மை உரை தொடர்புப் பொருளைத் தருகிறது, மற்ற சாத்தியம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
