translation_notes:
  register: நவீன நிலையான தமிழில், பட்டியல் நடையின் சுருக்கத்தைக் காத்து, சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான மொழிநடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய மூலத்தின் இரு வாக்கியக் கூறுகளும் இயல்பான தமிழுக்காகத் தனித்தனி வாக்கியங்களாக அமைக்கப்பட்டுள்ளன.
