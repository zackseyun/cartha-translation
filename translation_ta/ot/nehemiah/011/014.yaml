source:
  edition: WLC
  text: וַ/אֲחֵי/הֶם֙ גִּבּ֣וֹרֵי חַ֔יִל מֵאָ֖ה עֶשְׂרִ֣ים וּ/שְׁמֹנָ֑ה וּ/פָקִ֣יד עֲלֵי/הֶ֔ם זַבְדִּיאֵ֖ל בֶּן הַ/גְּדוֹלִֽים־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/011/014.yaml
  text: And their brothers[a], mighty men of valor, were one hundred twenty-eight; and the overseer over them was Zabdiel son of Haggedolim.
translation:
  language: ta
  text: அவர்களுடைய சகோதரர்களான வலிமைமிக்க வீரர்கள் நூற்று இருபத்தெட்டு பேர் இருந்தார்கள். அவர்களுக்கு மேற்பார்வையாளனாக ஹக்கெதோலீமின் மகன் சப்தியேல்[a] இருந்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ஹக்கெதோலீமின் மகன்” என்பதை “பெரியோர்களின் மகன்” அல்லது “பிரபுக்களின் மகன்” என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் ஒரு தனிப்பெயராக இல்லாமல் விளக்கத் தொடராகவும் இருக்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: וַאֲחֵיהֶם
  choice: அவர்களுடைய சகோதரர்களில்
  rationale: אֲחֵיהֶם என்பதன் நேரடிப் பொருள் ‘அவர்களுடைய சகோதரர்கள்.’ பட்டியல் சூழலில் அதே குழுவைச் சேர்ந்த ஆண் உறுப்பினர்களைக் குறிக்கிறது; ‘சகோதரர்கள்’ மூலத்தின் குடும்ப/குழு உறவுச் சொல்லைப் பாதுகாக்கிறது.
- source_word: גִּבּוֹרֵי חַיִל
  choice: வலிமைமிக்க வீரர்கள்
  rationale: இச்சொற்றொடர் வலிமை, துணிவு அல்லது போர்த்திறன் கொண்ட ஆண்களைக் குறிக்கிறது. ‘வலிமைமிக்க வீரர்கள்’ என்பது அதன் வீரத்தையும் திறனையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: מֵאָה עֶשְׂרִים וּשְׁמֹנָה
  choice: 128 பேர்
  rationale: மூலத்திலுள்ள 128 என்ற எண்ணிக்கையைத் தெளிவாகத் தருகிறது; நபர்களைக் கணக்கிடுவதால் ‘பேர்’ சேர்க்கப்பட்டது.
- source_word: וּפָקִיד עֲלֵיהֶם
  choice: அவர்களுடைய மேற்பார்வையாளன்
  rationale: פָקִיד என்பது பிறர்மேல் நிர்வாக அல்லது மேற்பார்வைப் பொறுப்பு பெற்றவரைக் குறிக்கிறது. இது குறிப்பாக இராணுவப் பதவி என்று மூலத்தைவிட அதிகமாக வரையறுக்காமல் ‘மேற்பார்வையாளன்’ எனத் தரப்பட்டுள்ளது.
- source_word: זַבְדִּיאֵל
  choice: சப்தியேல்
  rationale: எபிரெயத் தனிப்பெயரின் ஒலியைத் தமிழில் இயன்றவரை நெருக்கமாக எழுத்துப்பெயர்த்தது.
- source_word: בֶּן הַגְּדוֹלִים
  choice: ஹக்கெதோலீமின் மகன்
  rationale: הַגְּדוֹלִים என்பது குடும்ப அல்லது குலப்பெயராக இருக்கக்கூடும் என்பதால் முதன்மை உரையில் ‘ஹக்கெதோலீம்’ என எழுத்துப்பெயர்க்கப்பட்டது. அதை விளக்கத் தொடராகப் புரிந்துகொள்ளும் வாய்ப்பு அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
