  yaml_path: translation/ot/nehemiah/011/015.yaml
  text: 'And from the Levites: Shemaiah son of Hasshub[a], son of Azrikam, son of Hashabiah, son of Bunni.'
translation:
  language: ta
  text: 'மேலும் லேவியர்களில்: ஹஷ்ஷூபின் மகனான[a] செமாயா; ஹஷ்ஷூப் அஸ்ரிக்காமின் மகன்; அஸ்ரிக்காம் ஹஷபியாவின் மகன்; ஹஷபியா புன்னியின் மகன்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: வம்சப் பட்டியல்களில் ‘மகன்’ என்பதற்கான எபிரெயச் சொல், நேரடியான மகனை மட்டுமல்லாமல் சில சமயங்களில் பிற்கால வழித்தோன்றலையும் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִן
  choice: மேலும் … இல்
  rationale: וְ என்னும் இணைப்புச்சொல் முந்தைய பட்டியலுடன் இவ்வசனத்தை இணைக்கிறது; מִן குழுவிலிருந்து ஒருவரைச் சுட்டுகிறது. எனவே தமிழில் இயல்பாகவும் இணைப்பின் வலிமையைப் பாதுகாக்கவும் இவ்வாறு மொழிபெயர்க்கப்பட்டது.
- source_word: הַלְוִיִּם
  choice: லேவியர்கள்
  rationale: இச்சொல் லேவி கோத்திரத்தைச் சேர்ந்தவர்களை அங்கீகரிக்கப்பட்ட ஒரு குழுவாகக் குறிக்கிறது; ‘லேவியர்கள்’ என்பது இயல்பான நவீனத் தமிழ் வழக்கு.
- source_word: שְׁמַעְיָה
  choice: செமாயா
  rationale: எபிரெயப் பெயரின் ஒலியைத் தமிழில் தெளிவாகக் குறிக்கும் மரபான வடிவம்.
- source_word: בֶן
  choice: மகன்
  rationale: வம்சப் பட்டியலில் בֶן என்பதற்கான நேரடியான இயல்பான மொழிபெயர்ப்பு ‘மகன்’. இது சில இடங்களில் தொலைவான வழித்தோன்றலையும் குறிக்கக்கூடும் என்பதால் அந்த வாய்ப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: חַשּׁוּב
  choice: அசூப்
  rationale: எபிரெயத் தனிப்பெயருக்கான தமிழில் வாசிக்க எளிய ஒலிபெயர்ப்பு.
- source_word: עַזְרִיקָם
  choice: அஸ்ரிக்காம்
  rationale: எபிரெயத் தனிப்பெயரின் மெய்யொலி வரிசையைத் தமிழில் இயன்ற அளவு பிரதிபலிக்கும் ஒலிபெயர்ப்பு.
- source_word: חֲשַׁבְיָה
  choice: அசபியா
  rationale: எபிரெயத் தனிப்பெயருக்கான தெளிவான தமிழ் ஒலிபெயர்ப்பு.
- source_word: בּוּנִּי
  choice: புன்னி
  rationale: எபிரெயப் பெயரிலுள்ள வலுப்பெற்ற மெய்யை இரட்டை ‘ன்’ மூலம் காட்டும் தமிழ் ஒலிபெயர்ப்பு.
