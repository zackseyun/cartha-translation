  text: וּ/פְקִ֤יד הַ/לְוִיִּם֙ בִּ/יר֣וּשָׁלִַ֔ם עֻזִּ֤י בֶן בָּנִי֙ בֶּן חֲשַׁבְיָ֔ה בֶּן מַתַּנְיָ֖ה בֶּן מִיכָ֑א מִ/בְּנֵ֤י אָסָף֙ הַ/מְשֹׁ֣רְרִ֔ים לְ/נֶ֖גֶד מְלֶ֥אכֶת בֵּית הָ/אֱלֹהִֽים־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/011/022.yaml
  text: And the overseer of the Levites in Jerusalem was Uzzi son of Bani[a], son of Hashabiah, son of Mattaniah, son of Mica, from the sons of Asaph, the singers, over the work of the house of God.
translation:
  language: ta
  text: எருசலேமில் லேவியர்களின் மேற்பார்வையாளனாக இருந்தவன் உஸ்ஸி; அவன் பானியின் மகன், ஹஷபியாவின் மகன், மத்தனியாவின் மகன், மீகாவின் மகன். அவன் பாடகர்களான ஆசாப்பின் வழித்தோன்றல்களில் ஒருவனாகவும், தேவனுடைய இல்லத்தின் பணியை மேற்பார்வையிட்டவனாகவும் இருந்தான்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தேவனுடைய இல்லத்தின் பணிக்குப் பொறுப்பாயிருந்த.” לְנֶגֶד என்ற எபிரெயச் சொல், ஆலயப் பணியைச் சார்ந்த மேற்பார்வை அல்லது பொறுப்பைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפְקִיד הַלְוִיִּם
  choice: லேவியர்களின் மேற்பார்வையாளன்
  rationale: פְקִיד என்பது கண்காணிப்பு அல்லது நிர்வாகப் பொறுப்புக்கு நியமிக்கப்பட்ட அதிகாரியைக் குறிக்கிறது. ‘மேற்பார்வையாளன்’ அதன் அதிகாரப்பூர்வப் பொறுப்பை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: בִּירוּשָׁלִַם
  choice: எருசலேமிலிருந்த
  rationale: בְּ இங்கு இடத்தைக் குறிக்கிறது; தமிழ் வாக்கிய அமைப்பில் ‘எருசலேமிலிருந்த’ இயல்பாக அமைகிறது.
- source_word: עֻזִּי בֶן־בָּנִי בֶן־חֲשַׁבְיָה בֶן־מַתַּנְיָה בֶן־מִיכָא
  choice: ஊசி; இவன் பானியின் மகன்; பானி அசபியாவின் மகன்; அசபியா மத்தனியாவின் மகன்; மத்தனியா மீகாவின் மகன்
  rationale: மூலத்தின் தொடர்ச்சியான வம்சவரிசையைப் பாதுகாத்து, தமிழில் ஒவ்வொரு தலைமுறை உறவும் குழப்பமின்றித் தெளிவாகத் தரப்பட்டுள்ளது.
- source_word: מִבְּנֵי אָסָף
  choice: ஆசாப்பின் வழித்தோன்றல்களில் ஒருவன்
  rationale: சொல்லுக்கு சொல் ‘ஆசாப்பின் மகன்களில் ஒருவன்’ எனினும், இங்கு வம்ச அல்லது பணிக்குழு அடையாளம் குறிக்கப்படுவதால் ‘வழித்தோன்றல்களில் ஒருவன்’ நவீன வாசகருக்குத் தெளிவாக உள்ளது.
- source_word: הַמְשֹׁרְרִים
  choice: பாடகர்களான
  rationale: இச்சொல் ஆலயப் பணியில் பாடுகிறவர்களைத் துல்லியமாகக் குறிக்கிறது; ‘இசைக்கலைஞர்கள்’ என்பது மூலத்தைவிடப் பரந்த பொருள் தரும்.
- source_word: לְנֶגֶד מְלֶאכֶת
  choice: பணியை மேற்பார்வையிட்ட
  rationale: நிர்வாகச் சூழலில் לְנֶגֶד என்பது அந்தப் பணியைச் சார்ந்த பொறுப்பு அல்லது கண்காணிப்பைக் குறிக்கலாம். முதன்மை உரையில் சூழலுக்கு ஏற்ற பொருள் தரப்பட்டு, மாற்றுப் புரிதல் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: בֵּית הָאֱלֹהִים
  choice: தேவனுடைய இல்லம்
  rationale: எபிரெயச் சொற்றொடரின் உருவகத்தை நேரடியாகப் பாதுகாக்கிறது; அது இங்கு ஆலயத்தைக் குறிக்கிறது என்பதும் சூழலில் தெளிவாக உள்ளது.
theological_decisions:
- issue: לְנֶגֶד என்பதன் நிர்வாகப் பொருள்
  choice: தேவனுடைய இல்லத்தின் பணியை மேற்பார்வையிட்ட
  alternative: தேவனுடைய இல்லத்தின் பணிக்குப் பொறுப்பாயிருந்த / அந்தப் பணியுடன் தொடர்புடைய
  rationale: சொற்றொடர் கண்காணிப்பு அல்லது பொறுப்பைக் குறிக்கக்கூடும்; ஆனால் அதன் உறவு துல்லியமாக எவ்வளவு அதிகாரப்பூர்வமானது என்பது முழுமையாகத் தீர்மானிக்க முடியாது. ஆகவே முதன்மை பொருள் உரையில் தரப்பட்டு, உண்மையான மொழியியல் மாற்றுவாய்ப்பு அடிக்குறிப்பில் குறிப்பிடப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், வரலாற்று விவரணைக்கு ஏற்ற கண்ணியமான நடையுடன் மொழிபெயர்க்கப்பட்டுள்ளது. நீண்ட எபிரெய வம்சவரிசை தமிழில் தெளிவாக வாசிக்கும்படி தனித்தனி கூறுகளாக அமைக்கப்பட்டுள்ளது; ‘தேவனுடைய இல்லம்’ என்ற மூல உருவகம் பாதுகாக்கப்பட்டுள்ளது.
