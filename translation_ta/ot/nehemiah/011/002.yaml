    reason: הַמִּתְנַדְּבִים என்பதில் தன்னார்வத்துடன் தம்மை முன்வைத்தல் என்ற நுட்பத்தை இன்னும் வெளிப்படையாகக் காட்டும் மாற்று மொழிபெயர்ப்பு.
lexical_decisions:
- source_word: וַיְבָרֲכוּ
  choice: வாழ்த்தினார்கள்
  rationale: பியேல் வடிவிலுள்ள ברך என்பதன் அடிப்படைப் பொருள் ‘ஆசீர்வதித்தல்’. இங்கு மனிதர்கள் செயப்படுபொருளாக இருப்பதால், அவர்கள் மீது நல்வாழ்த்து கூறி அங்கீகரித்தார்கள் என்ற பொருளில் இயல்பான தமிழாக ‘வாழ்த்தினார்கள்’ தேர்ந்தெடுக்கப்பட்டது; வெறும் ‘பாராட்டினார்கள்’ என்று பொருளைக் குறுக்கவில்லை.
- source_word: הָעָם
  choice: மக்கள்
  rationale: עם என்பதற்கான வழக்கமான கூட்டுப்பெயர்; நவீன தமிழில் இயல்பாகவும் மூலத்திற்கு நெருக்கமாகவும் உள்ளது.
- source_word: לְכֹל הָאֲנָשִׁים
  choice: ஆண்கள் அனைவரையும்
  rationale: אֲנָשִׁים இங்கு இலக்கண ரீதியிலும் சொற்பொருள் ரீதியிலும் ஆண்பாலைக் குறிக்கிறது; பாலினக் குறிப்பை பொதுமைப்படுத்தாமல் தக்கவைக்கிறது.
- source_word: הַמִּתְנַדְּבִים
  choice: தாமாக முன்வந்த
  rationale: נדב என்பதன் ஹித்பயேல் வடிவம் தன்னார்வத்தையும் தன்னையே முன்வைத்தலையும் உணர்த்துகிறது. ‘தாமாக முன்வந்த’ என்பது அந்தத் தன்னார்வ நுட்பத்தை இயல்பான தமிழில் தருகிறது.
- source_word: לָשֶׁבֶת
  choice: குடியிருக்க
  rationale: ישב இச்சூழலில் ஓர் இடத்தில் வசிப்பதையோ குடியேறுவதையோ குறிக்கிறது. ‘குடியிருக்க’ என்பது எருசலேமில் வசிக்க முன்வந்த சூழலைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: בִּירוּשָׁלִָם
  choice: எருசலேமில்
  rationale: இடப்பொருளைத் தரும் முன்னொட்டுடன் வந்த இடப்பெயரின் வழக்கமான தமிழ் வடிவம்.
theological_decisions:
- issue: הָאֲנָשִׁים என்பதிலுள்ள பாலினக் குறிப்பு
  choice: ஆண்கள் அனைவரையும்
  alternative: அனைவரையும் / மக்கள் அனைவரையும்
  rationale: எபிரெய மூலத்தில் பொதுவான கூட்டுப்பெயருக்குப் பதிலாக ஆண்பால் பெயர்ச்சொல் பயன்படுத்தப்பட்டுள்ளது. சூழல் அதைத் தெளிவாகப் பொதுப்பாலாக்காததால், ஆண்பால் குறிப்பு தக்கவைக்கப்பட்டது.
translation_notes:
  register: நவீன, தரமான, கண்ணியமான தமிழ். ‘வாழ்த்தினார்கள்’ மூலம் ஆசீர்வாதம் அல்லது நல்வாழ்த்து கூறுதல் என்ற மூலச் சொல்லின் பரப்பைத் தக்கவைத்து, ‘தாமாக முன்வந்த’ மூலம் தன்னார்வச் செயலை இயல்பாக வெளிப்படுத்துகிறது.
