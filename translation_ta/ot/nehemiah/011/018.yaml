base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/011/018.yaml
  text: All the Levites in the holy city were two hundred eighty-four.
translation:
  language: ta
  text: பரிசுத்த நகரத்தில் இருந்த லேவியர்கள் அனைவரும் இருநூற்று எண்பத்து நான்கு பேர்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כָּל
  choice: அனைவரும்
  rationale: குழுவின் முழு எண்ணிக்கையையும் குறிக்கும் எபிரெய அளவுச்சொல்லை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: הַלְוִיִּם
  choice: லேவியர்கள்
  rationale: லேவி கோத்திரத்தாரையும் ஆலயப் பணியுடன் தொடர்புடைய குழுவையும் குறிக்கும் மரபான, துல்லியமான தமிழ்ச் சொல்.
- source_word: בְּעִיר הַקֹּדֶשׁ
  choice: பரிசுத்த நகரத்தில்
  rationale: בְּ என்பதன் இடப்பொருளையும், 'பரிசுத்தத்தின் நகரம்' என்ற எபிரெய இணைப்பின் பண்புப்பொருளையும் இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: מָאתַיִם שְׁמֹנִים וְאַרְבָּעָה
  choice: இருநூற்று எண்பத்து நான்கு பேர்
  rationale: எபிரெய எண்ணிக்கையைச் சொற்களால் துல்லியமாகக் கொடுக்கிறது; மனிதர்களின் எண்ணிக்கை என்பதால் 'பேர்' சேர்ப்பது தமிழில் இயல்பானது.
theological_decisions: []
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையும் கண்ணியமும் கொண்ட நடை. எபிரெயில் வினைச்சொல் இல்லாத எண்ணிக்கை வாக்கியத்தைத் தமிழில் இயல்பாக்க 'இருந்த' மற்றும் மனித எண்ணிக்கைக்கான 'பேர்' பயன்படுத்தப்பட்டுள்ளன.
