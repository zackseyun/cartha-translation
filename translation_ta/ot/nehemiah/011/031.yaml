source:
  edition: WLC
  text: וּ/בְנֵ֥י בִנְיָמִ֖ן מִ/גָּ֑בַע מִכְמָ֣שׂ וְ/עַיָּ֔ה וּ/בֵֽית אֵ֖ל וּ/בְנֹתֶֽי/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/011/031.yaml
  text: And the sons of Benjamin were from Geba[a], Michmash, Aijah, and Bethel and its villages.
translation:
  language: ta
  text: பென்யமீனின் சந்ததியினர் கெபா முதல், மிக்மாஸ், அய்யா[a], பெத்தேல் மற்றும் அதைச் சார்ந்த கிராமங்களில் குடியிருந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ஆய்’ எனவும் வழங்கப்படுகிறது. இங்குள்ள எபிரெய வடிவம் עַיָּה (அய்யா); இது அதே இடத்தையோ அதனுடன் நெருங்கிய தொடர்புள்ள ஓர் இடப்பெயரையோ குறிக்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: וּבְנֵי בִנְיָמִן
  choice: பென்யமீனின் சந்ததியினர்
  rationale: சொல்லாட்சிப்படி ‘பென்யமீனின் மகன்கள்’; குடியேற்றப் பட்டியலின் சூழலில் பென்யமீன் கோத்திரத்தைச் சேர்ந்தவர்களைக் குறிப்பதால், நவீனத் தமிழில் இயல்பாக ‘சந்ததியினர்’ என வழங்கப்பட்டது.
- source_word: מִגָּבַע
  choice: கெபா தொடங்கி
  rationale: மִן முன்னொட்டு தொடக்கப் புள்ளியைச் சுட்டலாம். இவ்வசனம் அடுத்த வசனங்களிலும் தொடரும் குடியேற்ற இடங்களின் பட்டியலின் தொடக்கமாக இருப்பதால் ‘கெபா தொடங்கி’ என்பது எபிரெய அமைப்பையும் பட்டியல் ஓட்டத்தையும் காக்கிறது.
- source_word: מִכְמָשׂ
  choice: மிக்மாஸ்
  rationale: எபிரெய இடப்பெயரின் ஒலியமைப்பை நெருக்கமாகப் பிரதிபலிக்கும் தமிழ் எழுத்துப்பெயர்ப்பு.
- source_word: וְעַיָּה
  choice: அய்யா
  rationale: இங்குள்ள எபிரெய வடிவம் עַיָּה என்பதால் ‘அய்யா’ என நேரடியாக எழுத்துப்பெயர்க்கப்பட்டது; ‘ஆய்’ என்ற சாத்தியமான அடையாளம் அடிக்குறிப்பில் வைக்கப்பட்டது.
- source_word: וּבֵית אֵל
  choice: பெத்தேல்
  rationale: வழக்கில் நிலைபெற்ற தமிழ் வேதாகம இடப்பெயர் வடிவம் பயன்படுத்தப்பட்டது.
- source_word: וּבְנֹתֶיהָ
  choice: அதைச் சார்ந்த கிராமங்கள்
  rationale: சொல்லாட்சிப்படி ‘அதன் மகள்கள்’; பிரதான நகரத்தைச் சார்ந்த துணைக் குடியிருப்புகளைக் குறிக்கும் எபிரெய மரபுத்தொடரின் பொருளைத் தெளிவாகக் காட்டுகிறது.
