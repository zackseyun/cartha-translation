translation_notes:
  register: நவீன நிலையான தமிழில், வரலாற்றுக் குடியேற்றப் பட்டியலுக்கேற்ற சுருக்கமான, கண்ணியமான நடை. எபிரெய வாக்கியத்தில் வெளிப்படையாக இல்லாத குடியிருத்தல் வினை, சூழலின் பொருளைத் தமிழில் இயல்பாக்குவதற்காகச் சேர்க்கப்பட்டது.
