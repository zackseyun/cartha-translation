    text: ‘ஆய்’ எனவும் வழங்கப்படுகிறது. இங்குள்ள எபிரெய வடிவம் עַיָּה (அய்யா); இது அதே இடத்தையோ அதனுடன் நெருங்கிய தொடர்புள்ள ஓர் இடப்பெயரையோ குறிக்கலாம்.
    reason: alternative_reading
  revision_rationale: A minor wording revision makes the Hebrew ‘from Geba’ more direct in Tamil and clarifies that ‘Ai’ is an alternative rendering/identification. No change is made to the verse’s meaning, the place-name ambiguity, or the settlement-list sense.
