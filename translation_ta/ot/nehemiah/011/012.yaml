base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/011/012.yaml
  text: And their brothers[a], doers of the work for the house, were eight hundred twenty-two; and Adaiah son of Jeroham, son of Pelaliah, son of Amzi, son of Zechariah, son of Pashhur, son of Malchijah.
translation:
  language: ta
  text: அவர்களுடைய சகோதரர்களும், வீட்டுக்கான பணியைச் செய்தவர்கள்[a], எட்டுநூற்று இருபத்திரண்டு பேர்; மேலும், யெரோகாமின் மகன் அதாயா, பெலலியாவின் மகன், அம்சியின் மகன், சகரியாவின் மகன், பஷ்ஹூரின் மகன், மல்கியாவின் மகன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஆலயத்துக்கான பணியைச் செய்தவர்கள்.” சொல்லுக்கு சொல், “வீட்டுக்கான பணியைச் செய்தவர்கள்.” இங்கு “வீடு” என்பது சூழலின்படி ஆலயத்தைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲחֵיהֶם
  choice: அவர்களுடைய சகோதரர்களில்
  rationale: ‘சகோதரர்கள்’ என்பது எபிரெய உறவுமுறைச் சொல்லை நேரடியாகப் பாதுகாக்கிறது. சூழலில் இவர்கள் சக ஆசாரியர்களாக இருந்தாலும், அதை முதன்மை உரையில் வெளிப்படையாகச் சேர்க்கவில்லை. எண்ணிக்கை இவர்களில் பணிசெய்தவர்களைக் குறிக்கிறது என்பதால் ‘சகோதரர்களில்’ என இயல்பாக அமைக்கப்பட்டது.
- source_word: עֹשֵׂי הַמְּלָאכָה לַבַּיִת
  choice: ஆலயத்துக்குரிய பணியைச் செய்தவர்கள்
  rationale: சொல்லுக்கு சொல் ‘வீட்டுக்குரிய பணியைச் செய்பவர்கள்’ என்றாலும், இச்சூழலில் ‘வீடு’ என்பது ஆலயத்தைக் குறிக்கிறது. நவீனத் தமிழில் பொருள் தெளிவாக இருக்க ‘ஆலயம்’ பயன்படுத்தப்பட்டு, எபிரெயச் சொல்வடிவம் அடிக்குறிப்பில் தெரிவிக்கப்பட்டது.
- source_word: שְׁמֹנֶה מֵאוֹת עֶשְׂרִים וּשְׁנָיִם
  choice: 822 பேர்
  rationale: மனிதர்களின் எண்ணிக்கையைத் தமிழில் இயல்பாகக் குறிப்பிட ‘பேர்’ சேர்க்கப்பட்டது; எண் துல்லியமாகப் பாதுகாக்கப்பட்டது.
- source_word: וַעֲדָיָה
  choice: மேலும் ... அதாயா
  rationale: வாவ் இணைப்புச்சொல் பட்டியலைத் தொடர்வதால் ‘மேலும்’ என மொழிபெயர்க்கப்பட்டது. அதாயாவின் வம்சவரிசை தமிழில் தெளிவாக வாசிக்கப்படுவதற்காக மூதாதையிலிருந்து அதாயாவரை இயல்பான வரிசையில் அமைக்கப்பட்டது.
- source_word: בֶּן
  choice: மகன்
  rationale: வம்சப்பட்டியலின் வழக்கமான எபிரெயச் சூத்திரம் ‘மகன்’ என ஒரேமாதிரியாகப் பாதுகாக்கப்பட்டது; தலைமுறைகள் விடுபட்டிருக்கலாம் என்ற சாத்தியத்தை முன்னிட்டு ‘வழிவந்தவர்’ என விளக்கமாக மாற்றவில்லை.
- source_word: יְרֹחָם / פְּלַלְיָה / אַמְצִי / זְכַרְיָה / פַּשְׁחוּר / מַלְכִּיָּה
  choice: யெரோகாம் / பெலலியா / அம்சி / சகரியா / பஸ்கூர் / மல்கியா
  rationale: தனிப்பெயர்கள் மொழிபெயர்க்கப்படாமல், எபிரெய ஒலிப்பையும் தமிழில் நிலைபெற்ற வேதாகமப் பெயர்வடிவங்களையும் கருத்தில் கொண்டு எழுத்துப்பெயர்க்கப்பட்டன.
