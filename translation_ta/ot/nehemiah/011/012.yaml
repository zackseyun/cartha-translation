translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையும் கண்ணியமும் காக்கப்பட்டுள்ளன. எபிரெய உரையின் உறவுமுறைச் சொல்லான ‘சகோதரர்கள்’ பாதுகாக்கப்பட்டுள்ளது. நீண்ட வம்சவரிசை தமிழில் உடனடியாகப் புரியும்படி மூதாதையிலிருந்து அதாயாவரை வரிசைப்படுத்தப்பட்டுள்ளது; எந்தப் பெயரும் உறவும் நீக்கப்படவில்லை.
