source:
  edition: WLC
  text: וְ/אֵ֨לֶּה֙ רָאשֵׁ֣י הַ/מְּדִינָ֔ה אֲשֶׁ֥ר יָשְׁב֖וּ בִּ/ירוּשָׁלִָ֑ם וּ/בְ/עָרֵ֣י יְהוּדָ֗ה יָֽשְׁב֞וּ אִ֤ישׁ בַּ/אֲחֻזָּת/וֹ֙ בְּ/עָ֣רֵי/הֶ֔ם יִשְׂרָאֵ֤ל הַ/כֹּהֲנִים֙ וְ/הַ/לְוִיִּ֣ם וְ/הַ/נְּתִינִ֔ים וּ/בְנֵ֖י עַבְדֵ֥י שְׁלֹמֹֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/011/003.yaml
  text: 'These are the heads of the province who lived in Jerusalem[a]. But in the cities of Judah, each man lived in his own possession in their cities: Israel, the priests, the Levites, the temple servants[b], and the descendants of Solomon’s servants.'
translation:
  language: ta
  text: 'எருசலேமில் குடியிருந்த மாகாணத்தின் தலைவர்கள் இவர்களே. ஆனால் யூதாவின் நகரங்களில், ஒவ்வொருவரும் தமக்குச் சொந்தமான நிலத்தில், தங்கள் நகரங்களில் குடியிருந்தார்கள்: இஸ்ரவேலர்,[a] ஆசாரியர்கள், லேவியர்கள், ஆலயப் பணியாளர்கள்,[b] சாலொமோனுடைய பணியாளர்களின் வழிவந்தோர்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மூலத்தில் நேரடியாக ‘இஸ்ரவேல்’ என்று உள்ளது; இங்கே அது ஒரு மக்கள்குழுவைக் கூட்டாகக் குறிப்பதாகத் தெரிகிறது.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில் ‘நெதினீம்’; ஆலயப் பணிக்கென நியமிக்கப்பட்ட ஒரு வகுப்பினர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: רָאשֵׁי הַמְּדִינָה
  choice: மாகாணத்தின் தலைவர்கள்
  rationale: பாரசீகக் கால நிர்வாகப் பிரிவைக் குறிக்கும் הַמְּדִינָה என்பதற்கு ‘மாகாணம்’ பொருத்தமானது; רָאשֵׁי என்பதன் தலைமை வகிப்போர் என்ற மரபுத்தொடர்ப் பொருளை ‘தலைவர்கள்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: אֲשֶׁר יָשְׁבוּ בִּירוּשָׁלִָם
  choice: எருசலேமில் குடியிருந்த
  rationale: יָשַׁב இங்கு நிலையான வசிப்பைக் குறிக்கிறது; ‘குடியிருந்த’ என்பது பட்டியல் மற்றும் குடியேற்றச் சூழலுக்கு ஏற்ற நவீனத் தமிழ்.
- source_word: וּבְעָרֵי יְהוּדָה יָשְׁבוּ
  choice: ஆனால் யூதாவின் நகரங்களில் ... குடியிருந்தார்கள்
  rationale: வாவ் எருசலேமிலிருந்து யூதாவின் பிற நகரங்களுக்கு மாறும் எதிர்நிலையைச் சுட்டுவதால் ‘ஆனால்’ பயன்படுத்தப்பட்டது.
- source_word: אִישׁ בַּאֲחֻזָּתוֹ בְּעָרֵיהֶם
  choice: ஒவ்வொருவரும் தத்தம் நகரத்திலுள்ள தங்கள் சொந்த நிலத்தில்
  rationale: אִישׁ என்பதன் பகிர்நிலைப் பொருளை ‘ஒவ்வொருவரும்’ தருகிறது. אֲחֻזָּה மரபுரிமையாகப் பெற்ற நிலவுடைமையைக் குறிக்கக்கூடும்; இங்கு ‘சொந்த நிலம்’ தெளிவும் இயல்பும் உடையது. ஒருமை–பன்மை மாறுபாட்டை இயல்பான தமிழில் ‘தத்தம் ... தங்கள்’ என வெளிப்படுத்துகிறது.
- source_word: יִשְׂרָאֵל
  choice: இஸ்ரவேலர்
  rationale: தொடரும் மக்கள்குழுக்களின் பட்டியலில் bare collective ‘Israel’ மக்களைச் சுட்டுகிறது; தமிழில் ‘இஸ்ரவேலர்’ என்பதே தெளிவான இயல்பான வடிவம். எபிரெய நேரடி வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: הַכֹּהֲנִים וְהַלְוִיִּם
  choice: ஆசாரியர்கள், லேவியர்கள்
  rationale: இவை தமிழ்ப் வேதாகமப் பயன்பாட்டில் நிலைபெற்ற, பொதுவாகப் புரியும் பதங்கள்.
- source_word: הַנְּתִינִים
  choice: ஆலயப் பணியாளர்கள்
  rationale: நெதினீம் எனும் ஆலயச் சேவைக்கென நியமிக்கப்பட்ட வகுப்பின் பணியை வாசகருக்குத் தெளிவாக மொழிபெயர்க்கிறது; பெயரின் ஒலிபெயர்ப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: בְּנֵי עַבְדֵי שְׁלֹמֹה
  choice: சாலொமோனுடைய பணியாளர்களின் வழிவந்தோர்
  rationale: בְּנֵי இத்தகைய சமூக மற்றும் வம்சப் பட்டியலில் நேரடி மகன்களை மட்டுமல்ல, வழிவந்தோரையும் குறிக்கும்; ‘வழிவந்தோர்’ அந்தக் கூட்டு வம்சப் பொருளைத் தருகிறது.
theological_decisions:
- issue: יִשְׂרָאֵל என்பது இடப்பெயரா, மக்களைக் குறிக்கும் கூட்டுப்பெயரா
  choice: மக்களைக் குறிக்கும் ‘இஸ்ரவேலர்’
  alternative: ‘இஸ்ரவேல்’ என்ற நேரடி வடிவம்
  rationale: இது ஆசாரியர்கள், லேவியர்கள் முதலிய குடியிருப்புக் குழுக்களின் பட்டியலில் வருவதால் மக்களைக் குறிக்கும் கூட்டுப்பெயராக வாசிப்பது இலக்கணச் சூழலுக்கு ஏற்றது; நேரடி வடிவம் அடிக்குறிப்பில் தெரிவிக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீனத் தரத் தமிழில், கண்ணியமான ஆனால் பொதுவாசகருக்குப் புரியும் நடையில் வடிவமைக்கப்பட்டது. ‘மாகாணம்’, ‘சொந்த நிலம்’ ஆகியவை பாரசீகக் கால நிர்வாகத்தையும் நிலவுடைமையையும் தெளிவாகக் காட்டுகின்றன. மூலத்தில் இல்லாத காலக்குறிப்பு தொடக்கச் சொல் சேர்க்கப்படவில்லை; பட்டியலின் அமைப்பும் எதிர்நிலை மாற்றமும் பாதுகாக்கப்பட்டுள்ளன.
