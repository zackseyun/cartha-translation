translation:
  language: ta
  text: லோத், ஓனோ, கைவினைஞர்களின்[a] பள்ளத்தாக்கு ஆகிய இடங்களிலும் குடியேறினார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: வேறு வகையில், ‘கைவினைத் தொழிலாளர்களின் பள்ளத்தாக்கு’ என்றும் மொழிபெயர்க்கலாம்; எபிரெயச் சொல் கொல்லர்கள் போன்ற கைவினைஞர்களைக் குறிப்பாகவும் குறிக்கக்கூடும்.
    reason: הַחֲרָשִׁים என்பதற்கான சொற்பொருள் மாற்றுவழி; இச்சொல் பொதுவாகக் கைவினைஞர்களையும், சில சூழல்களில் குறிப்பாகக் கொல்லர்களையும் குறிக்கலாம்.
lexical_decisions:
- source_word: לֹד
  choice: லோத்
  rationale: இது ஓர் இடப்பெயர்; தமிழில் மொழிபெயர்க்காமல், எபிரெய ஒலிப்பை நெருக்கமாகப் பின்பற்றி ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: וְ/אוֹנוֹ
  choice: ஓனோ
  rationale: இணைப்பிடைச்சொல்லுடன் வரும் இடப்பெயர். பட்டியலின் தமிழ் இயல்புக்கேற்ப இணைப்பு இறுதியில் ‘ஆகிய’ என்பதால் வெளிப்படுத்தப்பட்டுள்ளது; பெயர் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: גֵּי
  choice: பள்ளத்தாக்கு
  rationale: அடுத்த பெயர்ச்சொல்லுடன் உரிமைத் தொடர்பில் நிற்கும் ‘பள்ளத்தாக்கு’ என்பதன் construct வடிவம்; தமிழில் ‘கைவினைஞர்களின் பள்ளத்தாக்கு’ என இயல்பாகத் தரப்பட்டுள்ளது.
- source_word: הַחֲרָשִׁים
  choice: கைவினைஞர்கள்
  rationale: இச்சொல் பொதுவாகக் கைவினைஞர்களையோ தொழிலாளர்களையோ குறிக்கலாம்; சில சூழல்களில் கொல்லர்களைக் குறிப்பாகக் குறிக்கலாம். இடப்பெயரில் உள்ள பரந்த பொருளைத் தக்கவைக்க ‘கைவினைஞர்கள்’ தேர்ந்தெடுக்கப்பட்டுள்ளது.
theological_decisions: []
translation_notes:
  register: நவீனத் தரத் தமிழில், இடப்பெயர் பட்டியல் என்ற சூழலுக்கு ஏற்ற சுருக்கமான, கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய மூலத்தில் வினைச்சொல் இல்லாவிட்டாலும், முந்தைய வசனத்திலிருந்து தொடரும் பட்டியலைத் தமிழில் முழுமையான வாக்கியமாகப் புரியச் செய்ய ‘குடியேறினார்கள்’ சேர்க்கப்பட்டுள்ளது.
