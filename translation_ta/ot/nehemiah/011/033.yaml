lexical_decisions:
- source_word: חָצוֹר
  choice: ஆசோர்
  rationale: இது குடியிருப்புகளின் பட்டியலில் வரும் இடப்பெயர். அதன் சாத்தியமான சொற்பிறப்புப் பொருளை மொழிபெயர்க்காமல், எபிரெய உச்சரிப்பைத் தமிழில் இயல்பாக ஒலிபெயர்த்துள்ளது.
- source_word: רָמָה
  choice: ராமா
  rationale: இங்கு இது ‘உயரம்’ என்ற பொதுப்பெயராக அல்லாமல் இடப்பெயராகச் செயல்படுகிறது; ஆகவே தமிழில் வழக்கமான வேதாகம ஒலிபெயர்ப்பு பயன்படுத்தப்பட்டுள்ளது.
- source_word: גִּתָּיִם
  choice: கித்தாயிம்
  rationale: இடப்பெயரின் எபிரெய வடிவத்தில் உள்ள -யிம் முடிவையும் இரட்டித்த மெய்யொலியையும் இயன்றவரை பிரதிபலிக்கும் தமிழ் ஒலிபெயர்ப்பு.
