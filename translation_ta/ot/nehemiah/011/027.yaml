  text: and in Hazar-shual[a], and in Beer-sheba and its villages.
translation:
  language: ta
  text: ஆசார்-சூவாலிலும், பெயெர்செபாவிலும், அதன் கிராமங்களிலும்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொல்லுக்குச் சொல், “அதன் மகள்கள்”; இது ஒரு நகரத்தைச் சார்ந்த கிராமங்கள் அல்லது குடியிருப்புகளைக் குறிக்கும் மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בַ/חֲצַר שׁוּעָל
  choice: அசார்-சூவாலிலும்
  rationale: இணைப்பிடைச்சொற்கள் ‘-இலும்’ என்று இயல்பாகத் தரப்பட்டுள்ளன. புவியிடப் பெயரான חֲצַר שׁוּעָל, அதன் சொற்பிறப்புப் பொருளான ‘நரியின் கிராமம்’ என்று மொழிபெயர்க்கப்படாமல், எபிரெய ஒலிப்புக்கு நெருக்கமாகப் பெயர்க்கப்பட்டுள்ளது.
- source_word: וּ/בִ/בְאֵר שֶׁבַע
  choice: பெயேர்-செபாவிலும்
  rationale: நன்கு அறியப்பட்ட புவியிடப் பெயர் என்பதால், ‘ஏழின் கிணறு’ அல்லது ‘சத்தியத்தின் கிணறு’ என்ற சொற்பிறப்புப் பொருளில் மொழிபெயர்க்காமல் ஒலிபெயர்க்கப்பட்டுள்ளது; ‘-இலும்’ என்பது וּבִ (‘மற்றும்…இல்’) என்பதைக் குறிக்கிறது.
- source_word: וּ/בְנֹתֶיהָ
  choice: அதன் கிராமங்களிலும்
  rationale: בנותיה என்ற சொல்லின் நேர்ப்பொருள் ‘அதன் மகள்கள்.’ நகரத்தைச் சார்ந்த துணைக் கிராமங்கள் அல்லது குடியிருப்புகளைக் குறிக்கும் எபிரெய மரபுத்தொடர் என்பதால், நவீனத் தமிழில் தெளிவாக ‘அதன் கிராமங்கள்’ என்று தரப்பட்டுள்ளது. பெண்பால் ஒருமை பின்னொட்டு பெயேர்-செபாவைக் குறிக்கிறது.
theological_decisions: []
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, சுருக்கமான பட்டியல் நடையைக் கொண்டுள்ளது. இடப்பெயர்கள் மொழிபெயர்க்கப்படாமல் எபிரெய வடிவத்துக்கு நெருக்கமாக ஒலிபெயர்க்கப்பட்டுள்ளன; மூலத்தின் வாக்கியத் துணுக்கு அமைப்பும் காக்கப்பட்டுள்ளது.
