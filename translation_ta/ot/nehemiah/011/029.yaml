lexical_decisions:
- source_word: וּ/בְ/עֵין רִמּוֹן
  choice: என்-ரிம்மோனிலும்
  rationale: וּבְ என்பதன் ‘-இலும்’ என்ற இணைப்பு-இடப்பொருள் இயல்பாகப் பேணப்பட்டுள்ளது. עֵין רִמּוֹן என்பது இடப்பெயர் என்பதால் மொழிபெயர்க்காமல் தமிழ் ஒலிபெயர்ப்பில் தரப்பட்டுள்ளது.
- source_word: וּ/בְ/צָרְעָה
  choice: சோராவிலும்
  rationale: இடப்பெயரான צָרְעָה தமிழ் வேதாகம வாசகர்களுக்கு இயல்பாக அமையும் வகையில் ‘சோரா’ என்று ஒலிபெயர்க்கப்பட்டு, முன்னொட்டுகளின் பொருள் ‘-விலும்’ எனக் காட்டப்பட்டுள்ளது.
- source_word: וּ/בְ/יַרְמוּת
  choice: யர்மூத்திலும்
  rationale: יַרְמוּת என்ற இடப்பெயரின் தொடக்க எபிரெய y ஒலி ‘ய’ என நேரடியாக ஒலிபெயர்க்கப்பட்டுள்ளது; וּבְ என்பதன் பொருள் ‘-இலும்’ எனப் பேணப்பட்டுள்ளது.
- source_word: יֹשְׁבֵי (understood from the governing context, Neh 11:25)
  choice: குடியிருந்தார்கள்
  rationale: எபிரெய மூலத்தில் இவ்வசனம் முன் வசனங்களிலிருந்து தொடரும் குடியிருப்புப் பட்டியலின் துணைத் தொடராக உள்ளது. தமிழில் தனி வசனமாகவும் தெளிவாக வாசிக்க, சூழலில் உள்ள வினைப்பொருள் நிறைவு செய்யப்பட்டுள்ளது.
