  naturalness: ‘என்-ரிம்மோனிலும், சோராவிலும், யர்மூத்திலும்’ என்பது நவீனத் தமிழில் இயல்பான, சுருக்கமான பட்டியல் தொடராகும். ‘-இலும்’ வடிவம் இடப்பொருளையும் தொடர்ச்சியான சேர்க்கையையும் இயல்பாகக் காட்டுகிறது.
