base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/038.yaml
  text: And the second thanksgiving choir was going to the left[a], and I followed behind it, with half of the people on the wall, from above the Tower of the Ovens as far as the Broad Wall.
translation:
  language: ta
  text: இரண்டாவது நன்றி செலுத்தும் குழு இடதுபுறமாகச் சென்றுகொண்டிருந்தது.[a] நான் அதற்குப் பின்னால் சென்றேன்; மக்களில் பாதிப்பேர் மதிலின்மேல், சூளைகளின் கோபுரத்திலிருந்து அகன்ற மதில்வரை இருந்தனர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இரண்டாவது நன்றி செலுத்தும் பாடகர் குழு” அல்லது “இரண்டாவது நன்றி செலுத்தும் ஊர்வலம்.” எபிரெயச் சொல் பாடுவதை மட்டும் குறிக்காமல், சடங்குமுறை ஊர்வலத்தில் நன்றி செலுத்திய ஒரு குழுவையும் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַתּוֹדָה
  choice: நன்றிசெலுத்தும் குழு
  rationale: இங்கு இந்தச் சொல் நன்றிசெலுத்துதல் என்ற கருத்தை மட்டும் குறிக்காமல், மதில் அர்ப்பணிப்பு ஊர்வலத்தில் பங்கேற்ற ஒழுங்கமைக்கப்பட்ட குழுவைக் குறிக்கிறது. பாடகர்கள் மட்டுமே என்று தேவையின்றிக் குறுக்காமல் சூழலுக்கேற்ற பொதுவான சொல்லாட்சி பயன்படுத்தப்பட்டது.
- source_word: הַשֵּׁנִית
  choice: இரண்டாவது
  rationale: நன்றிசெலுத்தும் குழுவைச் சுட்டும் நேரடியான வரிசை எண்.
- source_word: הַהוֹלֶכֶת
  choice: சென்றுகொண்டிருந்தது
  rationale: எபிரெயப் பெயரெச்ச வடிவத்தின் தொடர்ந்துகொண்டிருந்த இயக்கத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: לְמוֹאל
  choice: இடதுபுறமாக
  rationale: இரு ஊர்வலக் குழுக்களின் எதிரெதிர் இயக்கச் சூழலில் இடப்பக்கத் திசை என்பது இயல்பான பொருள்.
- source_word: אַחֲרֶיהָ
  choice: அதற்குப் பின்னால்
  rationale: பெண்பால் பின்னொட்டு நன்றிசெலுத்தும் குழுவைக் குறிக்கிறது; ஊர்வலத்தில் இடரீதியாகப் பின்தொடர்வதைத் தெளிவாக்குகிறது.
- source_word: חֲצִי הָעָם
  choice: மக்களில் பாதிப்பேர்
  rationale: கூடியிருந்த மக்களில் ஒரு பாதியினரை இயல்பான நவீன தமிழில் குறிக்கிறது.
- source_word: מֵעַל לְהַחוֹמָה
  choice: மதிலின்மேல்
  rationale: ஊர்வலம் மதிலின் மேற்பகுதியில் சென்ற இடச்சூழலைத் தமிழில் சுருக்கமாகவும் தெளிவாகவும் தருகிறது.
- source_word: מִגְדַּל הַתַּנּוּרִים
  choice: சூளைகளின் கோபுரம்
  rationale: תַּנּוּרִים என்பது அடுப்புகள் அல்லது சூளைகள் எனப் பொருள்படலாம்; பழங்காலக் கட்டமைப்பைக் குறிக்கும் இடப்பெயரில் ‘சூளைகள்’ என்பது கண்ணியமான மற்றும் பரந்த தமிழாக்கம்.
- source_word: הַחוֹמָה הָרְחָבָה
  choice: அகன்ற மதில்
  rationale: அறியப்பட்ட மதிற்பகுதியின் விளக்கப் பெயரை அதன் சொற்பொருளோடு இயல்பான தமிழில் தருகிறது.
