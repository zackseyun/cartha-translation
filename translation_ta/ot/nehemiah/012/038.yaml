translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. எபிரெய உரையின் நீண்ட தொடரை வாசிப்புத் தெளிவுக்காக மூன்று வாக்கியங்களாகப் பிரித்துள்ளோம். ‘நன்றிசெலுத்தும் குழு’ என்பது பாடகர் குழு/ஊர்வலம் என்ற உண்மையான சொற்பொருள் பரப்பை முதன்மை உரையில் குறுக்காமல் காக்கிறது; மாற்றுகள் அடிக்குறிப்பில் தரப்பட்டுள்ளன.
