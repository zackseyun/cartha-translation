base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/042.yaml
  text: and Maaseiah[a], Shemaiah, Eleazar, Uzzi, Jehohanan, Malkijah, Elam, and Ezer. And the singers made their voices heard[b], with Izrahiah the overseer.
translation:
  language: ta
  text: மாசெயா, செமாயா, எலெயாசார், உஸ்ஸி, யெகோஹானான், மல்கியா, ஏலாம், ஏசேர் ஆகியோரும் இருந்தார்கள். பாடகர்கள் தங்கள் குரலைக் கேட்கச் செய்தார்கள்[a]; இஸ்ரஹியா அவர்களின் மேற்பார்வையாளராக இருந்தார்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொற்படி, “பாடகர்கள் தங்கள் குரலைக் கேட்கச் செய்தார்கள்.” இதை “உரக்கப் பாடினார்கள்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “மேற்பார்வையாளர்” என்பதற்கு “பொறுப்பாளர்” அல்லது “அதிகாரி” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַעֲשֵׂיָה
  choice: மாசெயா
  rationale: தனிப்பட்ட பெயர்; எபிரெய ஒலியமைப்பை நவீனத் தமிழில் இயல்பாக ஒலிபெயர்த்தது.
- source_word: שְׁמַעְיָה
  choice: செமாயா
  rationale: தனிப்பட்ட பெயர்; இறுதியில் உள்ள தெய்வீகப் பெயர்க்கூறு ஒலிபெயர்ப்பில் பாதுகாக்கப்பட்டது.
- source_word: אֶלְעָזָר
  choice: எலெயாசார்
  rationale: தனிப்பட்ட பெயர்; தமிழில் வாசிக்க ஏற்ற ஒலிபெயர்ப்பு.
- source_word: עֻזִּי
  choice: ஊசி
  rationale: தனிப்பட்ட பெயர்; முதல் உயிரின் நீளத்தையும் இரட்டித்த மெய்யின் ஒலியையும் நெருக்கமாகக் காட்டும் தமிழ் வடிவம்.
- source_word: יְהוֹחָנָן
  choice: யெகோனான்
  rationale: மெய்யெழுத்து வடிவத்திலுள்ள முழுப் பெயரைச் சுருக்காமல் ஒலிபெயர்த்தது.
- source_word: מַלְכִּיָּה
  choice: மல்கியா
  rationale: தனிப்பட்ட பெயர்; எபிரெய வடிவத்தை நெருக்கமாகப் பின்பற்றும் வாசிக்கத்தக்க தமிழ் வடிவம்.
- source_word: עֵילָם
  choice: ஏலாம்
  rationale: இங்கு இடப்பெயர் அல்ல, தனிப்பட்ட பெயர்; ஆகவே ஒலிபெயர்க்கப்பட்டது.
- source_word: עָזֶר
  choice: ஏசேர்
  rationale: தனிப்பட்ட பெயர்; எபிரெய உச்சரிப்பை நெருக்கமாகக் காட்டும் ஒலிபெயர்ப்பு.
- source_word: וַיַּשְׁמִיעוּ
  choice: சத்தமாகப் பாடினார்கள்
  rationale: שמע என்பதன் ஹிஃபீல் வடிவம் சொற்பட ‘கேட்கச் செய்தார்கள்’ எனினும், பாடகர்களைப் பற்றிய இச்சூழலில் அவர்களுடைய பாடல் தெளிவாகவும் உரக்கவும் கேட்கச் செய்ததை இயல்பான தமிழில் தெரிவிக்கிறது; மாற்று சொற்படி பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: הַמְשֹׁרְרִים
  choice: பாடகர்கள்
  rationale: שׁיר வேரிலிருந்து வந்த இச்சொல் ஆலயச் சூழலில் பாடுகிறவர்களை நேரடியாகக் குறிக்கிறது.
- source_word: יִזְרַחְיָה
  choice: இஸ்ரகியா
  rationale: தனிப்பட்ட பெயர்; எபிரெய வடிவத்தை நெருக்கமாக ஒலிபெயர்த்தது.
- source_word: הַפָּקִיד
  choice: மேற்பார்வையாளர்
  rationale: பிறர்மேல் நியமிக்கப்பட்ட நிர்வாக அல்லது கண்காணிப்புப் பொறுப்புடையவரைக் குறிக்கிறது; சூழலுக்கு ஏற்ற நடுநிலையான தமிழ் சொல்.
