translation_notes:
  register: நவீன நிலையான தமிழில், திருவிவிலிய வாசிப்புக்குரிய கண்ணியமான நடையைப் பயன்படுத்துகிறது. எபிரெய வசனம் தொடர்ச்சிப் பட்டியலின் ஒரு துண்டாகத் தொடங்கினாலும், தனித்து வாசிக்க இயலுமாறு “ஆகியோரும் இருந்தார்கள்” சேர்க்கப்பட்டுள்ளது. பெயர்கள் தமிழில் எளிதாக வாசிக்கும்படி ஒலிபெயர்க்கப்பட்டுள்ளன; அர்த்தம் மொழிபெயர்க்கப்படவில்லை. எல்லா அடிக்குறிப்பு குறிகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
