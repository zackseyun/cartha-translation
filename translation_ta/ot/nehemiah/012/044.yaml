base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/044.yaml
  text: On that day men were appointed over the storerooms for the contributions[a], for the firstfruits, and for the tithes, to gather into them from the fields of the cities the portions required by the law for the priests and for the Levites[c][b], for Judah rejoiced over the priests and over the Levites who were serving.
translation:
  language: ta
  text: அந்த நாளில், கருவூலங்கள், காணிக்கைகள், முதற்பலன்கள், பத்திலொரு பங்குகள் ஆகியவற்றுக்கான சேமிப்பு அறைகளுக்குப் பொறுப்பாக ஆண்கள் நியமிக்கப்பட்டார்கள்.[a] நகரங்களுக்குச் சேர்ந்த வயல்களிலிருந்து, ஆசாரியர்களுக்கும் லேவியர்களுக்கும் திருச்சட்டத்தின்படி உரிய பங்குகளை[b] அந்த அறைகளில் சேகரிப்பது அவர்களுடைய பணி. ஏனெனில், பணியில் நின்றிருந்த[c] ஆசாரியர்களையும் லேவியர்களையும் குறித்து யூதா மக்கள் மகிழ்ச்சியடைந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘சேமிப்பு அறைகள்’ என்பதற்கான எபிரெயச் சொல் பொதுவாக ‘அறைகள்’ அல்லது ‘கூடங்கள்’ என்றும் பொருள்படும்; இங்கு அவற்றின் சேமிப்புப் பயன்பாடு சூழலால் தெளிவாகிறது.
    reason: lexical_alternative
  - marker: b
    text: சொல்லுக்கு சொல், ‘திருச்சட்டத்தின் பங்குகள்’; அதாவது, ஆசாரியர்களுக்கும் லேவியர்களுக்கும் திருச்சட்டம் விதித்த பங்குகள்.
    reason: lexical_alternative
  - marker: c
    text: சொல்லுக்கு சொல், ‘நின்றிருந்தவர்கள்.’ ஆலயச் சூழலில் இது பணிக்கு ஆஜராகி நின்று சேவை செய்தவர்களைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפָּקְדוּ
  choice: பொறுப்பாக ... நியமிக்கப்பட்டார்கள்
  rationale: נפקד என்ற செயலின் இங்குள்ள நிர்வாகப் பொருளை, குறிப்பிட்ட அறைகளின் பொறுப்பு ஒப்படைக்கப்பட்டது எனத் தெளிவாகக் காட்டுகிறது.
- source_word: אֲנָשִׁים
  choice: ஆண்கள்
  rationale: எபிரெயச் சொல்லின் ஆண்பால் பன்மையை பாலினத் துல்லியத்துடன் தக்கவைக்கிறது.
- source_word: הַנְּשָׁכוֹת
  choice: சேமித்து வைக்கும் அறைகள்
  rationale: இந்த ஆலயச் சூழலில் இவை பொருட்களைச் சேமிக்கப் பயன்படுத்தப்பட்ட அறைகள்; சொல்லின் அடிப்படைப் பொருளான ‘அறைகள்’ என்பதையும் அதன் செயலையும் ஒருங்கிணைக்கிறது.
- source_word: לָאֹצָרוֹת
  choice: கருவூலப் பொருட்கள்
  rationale: אוצרות என்பது சேமித்து வைக்கப்படும் செல்வம் அல்லது பொருட்களைக் குறிக்கலாம். அறைகளையே மீண்டும் ‘கருவூலங்கள்’ என்று கூறாமல், அங்கு வைக்கப்பட்ட பொருட்கள் என்ற சூழல்சார் பொருளை வெளிப்படுத்துகிறது.
- source_word: לַתְּרוּמוֹת
  choice: காணிக்கைகள்
  rationale: புனிதப் பயன்பாட்டுக்காகப் பிரித்தளிக்கப்பட்ட பங்களிப்புகளை நவீன தமிழில் இயல்பாகக் குறிக்கிறது.
- source_word: לָרֵאשִׁית
  choice: முதற்பலன்கள்
  rationale: தேவனுக்குக் கொடுக்கப்பட்ட விளைச்சலின் முதல் பகுதியைக் குறிக்கும் வழக்கமான வேதாகமச் சொல்.
- source_word: וְלַמַּעַשְׂרוֹת
  choice: பத்திலொன்றுகள்
  rationale: מעשרות என்பதன் அளவுசார் பொருளைத் தெளிவாகவும் மதச்சார்புக் குழப்பமின்றியும் தெரிவிக்கிறது.
- source_word: לִכְנוֹס בָּהֶם
  choice: அந்த அறைகளில் சேர்ப்பது
  rationale: பொருட்களை அறைகளுக்குள் கொண்டுவந்து சேகரிக்கும் திசை மற்றும் செயலை இயல்பான தமிழில் அளிக்கிறது.
- source_word: לִשְׂדֵי הֶעָרִים
  choice: நகரங்களுக்குச் சேர்ந்த வயல்களிலிருந்து
  rationale: நகரங்களின் ஆட்சிப் பரப்போடு தொடர்புடைய விவசாய நிலங்கள் என்பதைக் ‘நகரங்களின் வயல்கள்’ என்பதைவிடத் தெளிவாகக் காட்டுகிறது.
- source_word: מְנָאוֹת הַתּוֹרָה
  choice: திருச்சட்டம் ... நிர்ணயித்த பங்குகள்
  rationale: சொல்லுக்கு சொல் ‘திருச்சட்டத்தின் பங்குகள்’; இங்கு தோரா ஆசாரியர்களுக்கும் லேவியர்களுக்கும் வழங்கப்பட வேண்டுமென விதித்த பங்குகள் என்பதே உறவு.
- source_word: הָעֹמְדִים
  choice: பணியில் நின்றிருந்த
  rationale: ‘நின்றிருந்தவர்கள்’ என்ற உருவகத்தைத் தக்கவைத்தபடியே, ஆலயப் பணியில் ஆஜராகிச் சேவை செய்த சூழலைத் தெளிவாக்குகிறது.
theological_decisions:
- issue: כִּי שִׂמְחַת יְהוּדָה עַל என்ற தொடரின் பொருள்
  choice: யூதா மக்கள் ஆசாரியர்களையும் லேவியர்களையும் குறித்து மகிழ்ச்சியடைந்தார்கள்
  alternative: ஆசாரியர்களும் லேவியர்களும் யூதாவுக்கு மகிழ்ச்சியாயிருந்தார்கள்
  rationale: எபிரெயில் ‘யூதாவின் மகிழ்ச்சி’ என்பது ஆசாரியர்களும் லேவியர்களும் மீது/குறித்து இருந்ததாகக் கூறப்படுகிறது. யூதா சமூகத்தைச் செயப்பொருளாக்கும் வாசிப்பு சூழலுக்கும் இலக்கணத்துக்கும் ஏற்றது; காரணத் தொடர்பை ‘ஏனெனில்’ தக்கவைக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் ஆலய நிர்வாகச் சூழலுக்கேற்ற கண்ணியமான நடையிலும் வடிவமைக்கப்பட்டது. நீண்ட எபிரெய வாக்கியம் வாசிப்புத் தெளிவுக்காக மூன்று தமிழ் வாக்கியங்களாகப் பிரிக்கப்பட்டது; காரணத் தொடர்பு தக்கவைக்கப்பட்டது.
