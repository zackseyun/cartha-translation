revisions:
- from: அந்த நாளில், கருவூலப் பொருட்களையும் காணிக்கைகளையும் முதற்பலன்களையும் பத்திலொன்றுகளையும் சேமித்து வைக்கும் அறைகளுக்குப் பொறுப்பாக ஆண்கள் நியமிக்கப்பட்டார்கள்.[a] நகரங்களுக்குச் சேர்ந்த வயல்களிலிருந்து, திருச்சட்டம் ஆசாரியர்களுக்கும் லேவியர்களுக்கும் நிர்ணயித்த பங்குகளை[b] அந்த அறைகளில் சேர்ப்பது அவர்களுடைய பணி. ஏனெனில், பணியில் நின்றிருந்த[c] ஆசாரியர்களையும் லேவியர்களையும் குறித்து யூதா மக்கள் மகிழ்ச்சியடைந்தார்கள்.
