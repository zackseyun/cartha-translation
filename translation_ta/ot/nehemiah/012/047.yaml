base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/047.yaml
  text: And all Israel[a], in the days of Zerubbabel and in the days of Nehemiah, gave the portions for the singers and the gatekeepers, as each day required; and they set apart the consecrated portions for the Levites[c][b], and the Levites set apart the consecrated portions for the sons of Aaron.
translation:
  language: ta
  text: செருபாபேலின் நாட்களிலும் நெகேமியாவின் நாட்களிலும் இஸ்ரவேலர் அனைவரும் பாடகர்களுக்கும் வாயிற்காவலர்களுக்கும் உரிய பங்குகளை ஒவ்வொரு நாளின் தேவைக்கேற்ப[a] கொடுத்துவந்தார்கள். மேலும், லேவியர்களுக்கெனப் பங்குகளைப் பரிசுத்தமாக ஒதுக்கிவைத்தார்கள்[b]; லேவியர்களும் ஆரோனின் மகன்களுக்கென[c] பங்குகளைப் பரிசுத்தமாக ஒதுக்கிவைத்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “ஒரு நாளின் காரியம் அதனதன் நாளில்”; அதாவது, ஒவ்வொரு நாளுக்கும் தேவைப்பட்ட அளவு.
    reason: lexical_alternative
  - marker: b
    text: “பங்குகளை” என்பது சூழலிலிருந்து சேர்க்கப்பட்டுள்ளது. எபிரெயச் சொற்றொடரை “லேவியர்களுக்காகப் பரிசுத்தப்படுத்தினார்கள்” என்றும் மொழிபெயர்க்கலாம்.
    reason: source_clarity
  - marker: c
    text: “ஆரோனின் மகன்கள்” என்பது ஆரோனின் வழிவந்த ஆசாரியர்களைக் குறிக்கிறது.
    reason: lexical_clarification
lexical_decisions:
- source_word: וְכָל יִשְׂרָאֵל
  choice: இஸ்ரவேலர் அனைவரும்
  rationale: எபிரெயக் கூட்டுப்பெயரின் தேசிய முழுமையை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: בִּימֵי זְרֻבָּבֶל וּבִימֵי נְחֶמְיָה
  choice: செருபாபேலின் நாட்களிலும் நெகேமியாவின் நாட்களிலும்
  rationale: மூலத்தில் இருமுறை வரும் காலக் குறிப்பைப் பாதுகாத்து வரலாற்றுச் சட்டகத்தைத் தெளிவாக்குகிறது.
- source_word: נֹתְנִים
  choice: கொடுத்துவந்தார்கள்
  rationale: எபிரெயப் பங்கேற்புவினை குறிக்கும் தொடர்ச்சியான அல்லது வழக்கமான கடந்தகாலச் செயலைத் தமிழில் இயல்பாகக் காட்டுகிறது.
- source_word: מְנָיוֹת
  choice: உரிய பங்குகளை
  rationale: ஆலயப் பணியாளர்களுக்கென ஒதுக்கப்பட்ட உணவு அல்லது ஆதரவுப் பங்குகள் என்பதைக் குறிக்கிறது; ‘உரிய’ என்பது ஒதுக்கீட்டின் நுணுக்கத்தை வெளிப்படுத்துகிறது.
- source_word: הַמְשֹׁרְרִים וְהַשֹּׁעֲרִים
  choice: பாடகர்களுக்கும் வாயிற்காவலர்களுக்கும்
  rationale: ஆலயப் பணிகளான இரு நிலையான பொறுப்புகளையும் தெளிவாகக் குறிக்கிறது.
- source_word: דְּבַר יוֹם בְּיוֹמוֹ
  choice: ஒவ்வொரு நாளின் தேவைக்கேற்ப
  rationale: ‘ஒரு நாளின் காரியம் அதனதன் நாளில்’ என்ற எபிரெய மரபுத்தொடரின் செயல்பாட்டு பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: וּמַקְדִּשִׁים לַלְוִיִּם
  choice: லேவியர்களுக்குரிய பங்குகளைப் பரிசுத்தமாக ஒதுக்கிவைத்தார்கள்
  rationale: קדשׁ என்பதன் பரிசுத்தப்படுத்துதல் அல்லது பரிசுத்த நோக்கத்திற்காகப் பிரித்துவைத்தல் என்ற பொருளைப் பாதுகாக்கிறது. தமிழில் செயப்படுபொருள் தேவைப்படுவதால் சூழலிலிருந்து ‘பங்குகளை’ சேர்க்கிறது.
- source_word: וְהַלְוִיִּם מַקְדִּשִׁים לִבְנֵי אַהֲרֹן
  choice: லேவியர்களும் ஆரோனின் மக்களுக்குரிய பங்குகளைப் பரிசுத்தமாக ஒதுக்கிவைத்தார்கள்
  rationale: இணையான வாக்கிய அமைப்பையும் பரிசுத்தமாகப் பிரித்துவைக்கும் செயலையும் காக்கிறது.
- source_word: בְּנֵי אַהֲרֹן
  choice: ஆரோனின் மக்கள்
  rationale: ஆசாரிய மரபைக் குறிக்கும் மூலமொழியின் உறவுமுறைச் சொல்லை நேரடியாகப் பாதுகாக்கிறது; இங்கு ‘மக்கள்’ என்பது வழித்தோன்றல்களையும் உள்ளடக்குகிறது.
theological_decisions:
- issue: ஆலய ஆதரவு சூழலில் מַקְדִּשִׁים என்பதன் பொருள்
  choice: பங்குகளைப் பரிசுத்தமாக ஒதுக்கிவைத்தார்கள்
  alternative: லேவியர்களுக்கும் ஆரோனின் மக்களுக்கும் கொடுத்தார்கள் அல்லது வழங்கினார்கள்
  rationale: קדשׁ என்ற வேரின் பரிசுத்தம் அல்லது தனியே பிரித்துவைத்தல் என்ற நுணுக்கத்தை வெறும் கொடையாகத் தட்டையாக்காமல் காக்கிறது. அதே நேரத்தில், மூலத்தில் வெளிப்படையாக இல்லாத செயப்படுபொருள் சூழல் மற்றும் இணை அமைப்பின் அடிப்படையில் சேர்க்கப்பட்டுள்ளதை அடிக்குறிப்பு தெரிவிக்கிறது.
- issue: בְּנֵי אַהֲרֹן என்பவர்களின் அடையாளம்
  choice: ஆரோனின் மக்கள்
  alternative: ஆரோனிய ஆசாரியர்கள்
  rationale: மூலத்தின் குடும்ப அல்லது வம்சச் சொல்லை முதன்மை உரையில் பாதுகாக்கிறது; அந்தச் சொல் ஆசாரியர்களைக் குறிக்கிறது என்பது அடிக்குறிப்பில் விளக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் ஆலய நிர்வாகச் சூழலுக்கேற்ற கண்ணியமான நடையிலும் அமைக்கப்பட்டுள்ளது. வரலாற்றுக் காலக்குறிப்பின் மறுமொழியும், பரிசுத்தமாகப் பிரித்துவைக்கும் வினையின் சமய நுணுக்கமும் பாதுகாக்கப்பட்டுள்ளன.
