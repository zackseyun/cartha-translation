  source_fidelity: 'முக்கிய கருத்தும் இணை அமைப்பும் எபிரெய மூலத்துடன் நன்றாக ஒத்திருக்கின்றன: பாடகர்கள், வாயிற்காவலர்கள் ஆகியோருக்கான நாளாந்தப் பங்குகளும், லேவியர்களுக்கும் ஆரோனின் மகன்களுக்கும் பரிசுத்தமாக ஒதுக்கிவைக்கப்படும் பங்குகளும் தெளிவாகக் கூறப்படுகின்றன. ஆனால் בְּנֵי אַהֲרֹן என்பதற்கு “ஆரோனின் மக்கள்” என்பது உறவுமுறைச் சொல்லின் துல்லியத்தை இழக்கிறது; “ஆரோனின் மகன்கள்” என்பதே மூலத்திற்கு நெருக்கமானதும் தமிழில் இயல்பானதுமாகும்.'
