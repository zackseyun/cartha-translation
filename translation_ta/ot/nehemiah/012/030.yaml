source:
  edition: WLC
  text: וַ/יִּֽטַּהֲר֔וּ הַ/כֹּהֲנִ֖ים וְ/הַ/לְוִיִּ֑ם וַֽ/יְטַהֲרוּ֙ אֶת הָ/עָ֔ם וְ/אֶת הַ/שְּׁעָרִ֖ים וְ/אֶֽת הַ/חוֹמָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/030.yaml
  text: And the priests and the Levites purified themselves[a], and they purified the people, the gates, and the wall.
translation:
  language: ta
  text: ஆசாரியர்களும் லேவியர்களும் தங்களைத் தூய்மைப்படுத்திக்கொண்டார்கள்[a]. பிறகு அவர்கள் மக்களையும், வாசல்களையும், மதிலையும் தூய்மைப்படுத்தினார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தங்களைச் சுத்திகரித்துக்கொண்டார்கள் ... மக்களையும், வாசல்களையும், மதிலையும் சுத்திகரித்தார்கள்.” எபிரெயத்தில் இரண்டு செயல்களுக்கும் ஒரே வேர்ச்சொல் பயன்படுத்தப்பட்டுள்ளது; முதலில் தற்சுட்டு வடிவிலும், பின்னர் பிறர்மேல் செயல்படும் வடிவிலும் வருகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּטַּהֲרוּ
  choice: தங்களைத் தூய்மைப்படுத்திக்கொண்டார்கள்
  rationale: ஹித்பயேல் வடிவத்தின் தற்சுட்டுப் பொருளையும், சூழலில் உள்ள சடங்குமுறைத் தூய்மையையும் இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: הַכֹּהֲנִים
  choice: ஆசாரியர்கள்
  rationale: ஆலய மற்றும் வழிபாட்டுச் சூழலில் כֹּהֲנִים என்பதற்கான வழக்கமான, தெளிவான தமிழாக்கம்.
- source_word: וְהַלְוִיִּם
  choice: லேவியர்களும்
  rationale: லேவி கோத்திரத்தாரையும் ஆலயப் பணியாளர்களையும் குறிக்கும் மரபான இனப்பெயரைத் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: וַיְטַהֲרוּ
  choice: தூய்மைப்படுத்தினார்கள்
  rationale: பியேல் வடிவத்தின் செயப்படுபொருள் கொண்ட பொருளைத் தெளிவாகக் காட்டுவதோடு, முதல் வினையுடன் எபிரெய மூலத்தில் உள்ள ஒரே வேர்ச்சொல் தொடர்பையும் காக்கிறது.
- source_word: הָעָם
  choice: மக்களை
  rationale: இங்கு கூடியிருந்த பரந்த மக்களைக் குறிக்கும் இயல்பான பொருள்; ‘சபை’ என்று தேவையின்றிக் குறுக்கவில்லை.
- source_word: הַשְּׁעָרִים
  choice: வாசல்களை
  rationale: நகர மதிலின் நுழைவாயில்களைக் குறிக்கும் நேரடியான, இயல்பான தமிழ்ச்சொல்.
- source_word: הַחוֹמָה
  choice: மதிலை
  rationale: சூழலில் எருசலேமின் நகர மதில் தெளிவாக இருப்பதால், எபிரெய ஒருமையை நெருக்கமாகப் பின்பற்றும் ‘மதில்’ போதுமானது.
theological_decisions:
- issue: தூய்மைப்படுத்துதல் மொழியின் தன்மை
  choice: சடங்குமுறைத் தூய்மைப்படுத்துதல்
  alternative: பொதுவான சுத்திகரித்தல் அல்லது உடல் சார்ந்த சுத்தம்
  rationale: ஆலய அர்ப்பணிப்பு நிகழ்ச்சியின் சூழலில் טהר என்பது வெறும் உடல் சுத்தத்தையோ ஒழுக்கத் தூய்மையையோ அல்லாமல் சடங்குமுறைத் தூய்மையைக் குறிக்கிறது. குறிப்பிட்ட சடங்கை உரையில் சேர்க்காமல் ‘தூய்மைப்படுத்து’ அந்த நுணுக்கத்தைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், வழிபாட்டுச் சூழலுக்கேற்ற கண்ணியமான ஆனால் பொதுவாசகர்களுக்குப் புரியும் நடை. எபிரெயத்தின் முதல் தற்சுட்டுச் செயலும் பின்னர் வரும் பிறர்மேல் செலுத்தப்படும் செயலும் ‘தூய்மைப்படுத்து’ என்ற ஒரே வினைமூலம் காக்கப்பட்டுள்ளன. நீண்ட கூட்டு வாக்கியத்தை இயல்பான தமிழுக்காக இரண்டு வாக்கியங்களாகப் பிரித்து, தொடர்ச்சியைத் தெளிவாக்க ‘பிறகு’ சேர்க்கப்பட்டுள்ளது.
