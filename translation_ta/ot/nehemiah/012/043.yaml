base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/043.yaml
  text: On that day they offered great sacrifices and rejoiced[a], because God had made them rejoice with great joy. Also the women and the children rejoiced[d][c][b], and the joy of Jerusalem was heard from far away.
translation:
  language: ta
  text: அந்த நாளில் அவர்கள் பெரிய பலிகளைச் செலுத்தி மகிழ்ந்தார்கள்; ஏனெனில் கடவுள் அவர்களைப் பெருமகிழ்ச்சியால் மகிழச் செய்தார்.[a] பெண்களும் பிள்ளைகளும் கூட மகிழ்ந்தார்கள்.[b] எருசலேமின் மகிழ்ச்சி வெகுதொலைவிலிருந்து கேட்கப்பட்டது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கடவுள் அவர்களுக்குப் பெருமகிழ்ச்சியைக் கொடுத்தார்.” எபிரேயத்தில் நேரடியாக, கடவுள் அவர்களைப் பெருமகிழ்ச்சியால் மகிழச் செய்தார் என்று உள்ளது.
    reason: lexical_alternative
  - marker: b
    text: “பெண்கள்” என்பதற்கான எபிரேயச் சொல், சூழலைப் பொறுத்து “மனைவிகள்” என்றும் பொருள்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּזְבְּחוּ זְבָחִים גְּדוֹלִים
  choice: சிறப்பான பலிகளைச் செலுத்தி
  rationale: זבח என்பதன் பலியிடும் பொருளை ‘பலிகளைச் செலுத்தி’ இயல்பாக வெளிப்படுத்துகிறது. גְּדוֹלִים என்பதை ‘சிறப்பான’ என்று மொழிபெயர்ப்பது, எண்ணிக்கையை மட்டும் குறிக்கும் ‘பல’ என்பதைக் காட்டிலும் எபிரேயத்தின் பெருமை அல்லது முக்கியத்துவத்தைப் பாதுகாக்கிறது.
- source_word: וַיִּשְׂמָחוּ / שָׂמֵחוּ
  choice: மகிழ்ந்தார்கள்
  rationale: שׂמח வேரின் மீளுருவாக்கத்தை ஒரே தமிழ்ச் சொல்லால் காத்து, இயல்பான நவீன தமிழில் மகிழ்ச்சியைத் தெளிவாகக் கூறுகிறது.
- source_word: שִׂמְּחָם שִׂמְחָה גְדוֹלָה
  choice: அவர்களைப் பெருமகிழ்ச்சியால் மகிழச் செய்தார்
  rationale: பியேல் வினையின் காரணவினைப் பொருளையும், அதே வேரிலிருந்து வரும் வினை–பெயர்ச்சொல் வலியுறுத்தலையும் இயன்றவரை பாதுகாக்கிறது.
- source_word: הַנָּשִׁים וְהַיְלָדִים
  choice: பெண்களும் பிள்ளைகளும்
  rationale: נָשִׁים என்பது ‘பெண்கள்’ அல்லது ‘மனைவிகள்’ என்று பொருள்படலாம்; உடைமைச் சுட்டு இல்லாததால் பரந்த பொருளான ‘பெண்கள்’ முதன்மை உரையில் பொருத்தமானது. יְלָדִים என்பதற்கு இயல்பான ‘பிள்ளைகள்’ பயன்படுத்தப்பட்டது.
- source_word: וַתִּשָּׁמַע שִׂמְחַת יְרוּשָׁלִַם מֵרָחוֹק
  choice: எருசலேமின் மகிழ்ச்சி வெகுதொலைவிலிருந்து கேட்கப்பட்டது
  rationale: நிஃபால் வடிவின் செயப்பாட்டு பொருளான ‘கேட்கப்பட்டது’ என்பதையும், מֵרָחוֹק குறிக்கும் தொலைவிலிருந்து என்ற நோக்கையும் நேரடியாகக் காக்கிறது.
theological_decisions:
- issue: மகிழ்ச்சிக்கான இறைச் செயலாண்மை
  choice: கடவுள் அவர்களை மகிழச் செய்தார்
  alternative: கடவுள் அவர்களுக்குப் பெருமகிழ்ச்சியைக் கொடுத்தார்
  rationale: שִׂמְּחָם என்பது நேரடியான காரணவினை; ஆகவே மக்களின் மகிழ்ச்சிக்குக் கடவுளே காரணர் என்று உரை கூறுவதைத் தெளிவாகப் பாதுகாக்கிறது.
- issue: மகிழ்ந்த சமூகத்தின் பரப்பு
  choice: பெண்களும் பிள்ளைகளும்கூட தனிப்படக் குறிப்பிடப்படுகிறார்கள்
  alternative: முழுச் சமூகத்தையும் பொதுப்படக் குறிப்பிடுதல்
  rationale: எபிரேய உரை இவ்விரு குழுக்களையும் வெளிப்படையாகப் பெயரிடுவதால், கொண்டாட்டத்தின் விரிவை மொழிபெயர்ப்பும் காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. ‘பெருமகிழ்ச்சியால் மகிழச் செய்தார்’ என்ற திட்டமிட்ட மீளுருவாக்கம் எபிரேயத்தின் காரணவினையையும் வலியுறுத்தலையும் காக்கிறது. அனைத்து அடிக்குறிப்பு அடையாளங்களும் தொடர்புடைய முதன்மை உரையில் இடம்பெற்றுள்ளன.
