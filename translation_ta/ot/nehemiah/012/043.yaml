    issue: ‘சிறப்பான பலிகள்’ for זְבָחִים גְּדֹלִים
    rationale: ‘சிறப்பான’ adds the sense ‘special/excellent,’ whereas the Hebrew adjective means great or large. ‘பெரிய’ preserves the source’s breadth without narrowing it to number or importing an evaluative sense.
  - severity: low
    issue: Footnote a’s phrase ‘இன்னும் சொல்லுக்குச் சொல்’ is unnatural Tamil.
    rationale: The note’s content is accurate, but ‘எபிரேயத்தில் நேரடியாக’ states the same point more idiomatically.
