translation_notes:
  register: நவீனத் தரமான, பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளக்கூடிய கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. இடவியல் நகர்வின் வரிசை இயல்பாக அமைய வாக்கியம் தமிழுக்கேற்றவாறு மறுசீரமைக்கப்பட்டுள்ளது. ஆங்கில ஆலோசனை உரையில் [b] குறியீடு ‘தாவீதின் வீடு’ என்பதற்குப் பின் இருந்தாலும், அதன் அடிக்குறிப்பு מַעֲלוֹת பற்றியது என்பதால் தமிழில் உரிய ‘படிக்கட்டுகள்’ என்பதற்குப் பின் வைக்கப்பட்டுள்ளது.
