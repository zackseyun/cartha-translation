base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/037.yaml
  text: And by the Fountain Gate[a], in front of them, they went up by the stairs of the city of David, at the ascent of the wall, above the house of David[b], and as far as the Water Gate on the east.
translation:
  language: ta
  text: ஊற்று வாசலின்[a] அருகே, அவர்களுக்கு எதிரே, அவர்கள் தாவீதின் நகரத்துப் படிக்கட்டுகள்[b] வழியாக மேலே சென்று, மதிலின் ஏற்றப்பகுதியில், தாவீதின் வீட்டுக்கு மேலாக, கிழக்கிலுள்ள தண்ணீர் வாசல்வரை சென்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘நீரூற்று வாசல்’ என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் நீர் பொங்கிவரும் ஊற்றையோ நீரின் தோற்றுவாயையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘தாவீதின் நகரத்து ஏற்றங்கள்’ என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் கட்டப்பட்ட படிக்கட்டுகளையோ, பொதுவாக மேலே செல்லும் ஏற்றங்களையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׁעַר הָעַיִן
  choice: ஊற்று வாசல்
  rationale: עַיִן என்பது நீர் பொங்கிவரும் இயற்கை ஊற்றைக் குறிக்கலாம். எருசலேமின் இடப்பெயராக ‘ஊற்று வாசல்’ இயல்பாகவும் நிலவியல் சூழலுக்கு ஏற்றதாகவும் உள்ளது.
- source_word: וְעַל
  choice: அருகே வந்தபோது
  rationale: இந்த இடவியல் வழித்தட விவரிப்பில் עַל வாசலின் அருகாமையைச் சுட்டுகிறது; தமிழில் தொடர்ச்சியான நகர்வை இயல்பாகக் காட்ட இவ்வாறு மொழிபெயர்க்கப்பட்டது.
- source_word: וְנֶגְדָּם
  choice: அவர்களுக்கு எதிரே இருந்த
  rationale: נֶגֶד என்பதன் ‘எதிரே/முன்னே’ என்ற இடவியல் பொருளைப் பாதுகாக்கிறது; பின்னரும் வரும் படிக்கட்டுகளோடு இயல்பாக இணைக்கப்பட்டுள்ளது.
- source_word: עָלוּ
  choice: ஏறி
  rationale: עלה என்பதன் மேல்நோக்கிய நகர்வைச் சுருக்கமாகவும் தெளிவாகவும் வெளிப்படுத்துகிறது.
- source_word: מַעֲלוֹת עִיר דָּוִיד
  choice: தாவீதின் நகரத்துப் படிக்கட்டுகள்
  rationale: பன்மையான מַעֲלוֹת இங்கு நகர அமைப்பிலுள்ள படிகள் அல்லது படிக்கட்டுகளைக் குறிக்கும் வாய்ப்பு மிகுதி; இடப்பெயரான ‘தாவீதின் நகரம்’ பாதுகாக்கப்படுகிறது.
- source_word: בַּמַּעֲלֶה לַחוֹמָה
  choice: மதிலுக்குச் செல்லும் ஏற்றத்தில்
  rationale: மதிலை நோக்கிச் செல்லும் உயர்வான வழி என்ற இடவியல் பொருளைத் தெளிவாகத் தருகிறது; ‘மதிலின் ஏற்றம்’ என்ற இறுக்கமான சொல்லாக்கத்தைத் தவிர்க்கிறது.
- source_word: מֵעַל לְבֵית דָּוִיד
  choice: தாவீதின் அரண்மனைக்கு மேலாகக் கடந்து
  rationale: מֵעַל என்பதன் உயர்நிலைத் தொடர்பைத் தக்கவைக்கிறது. בֵית דָּוִד இச்சூழலில் தாவீதின் அரச இல்லம்/அரண்மனை என்ற அடையாள இடத்தைக் குறிக்கிறது.
- source_word: שַׁעַר הַמַּיִם מִזְרָח
  choice: கிழக்கே இருந்த தண்ணீர் வாசல்
  rationale: מִזְרָח என்பதன் கிழக்குத் திசைச் சுட்டுதலையும், ‘தண்ணீர் வாசல்’ என்ற இடப்பெயரையும் இயல்பான தமிழ் தொடரில் தருகிறது.
