base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/029.yaml
  text: and from Beth-gilgal[a], and from the fields of Geba and Azmaveth, for the singers had built villages for themselves around Jerusalem.
translation:
  language: ta
  text: பெத்-கில்காலிலிருந்தும், கேபா மற்றும் அஸ்மாவேத்தின் வயல்வெளிகளிலிருந்தும்; ஏனெனில் பாடகர்கள் எருசலேமைச் சுற்றிலும் தங்களுக்காகக் கிராமங்களைக்[a] கட்டியிருந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “குடியிருப்புகள்”; எபிரெயச் சொல் வேலியிடப்பட்ட வாழ்விடப் பகுதிகளைக் குறிக்கவும் முடியும். இங்கு எருசலேமைச் சுற்றிப் பாடகர்கள் வாழ்ந்த இடங்களைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִבֵּית הַגִּלְגָּל
  choice: பெத்-கில்காலிலிருந்தும்
  rationale: בֵּית என்பது இங்கு ஒரு கட்டிடத்தைக் குறிக்காமல் இடப்பெயரின் பகுதியாக வருகிறது. முன்னொட்டுகள் ‘-இலிருந்தும்’ என்ற இணைப்பு மற்றும் புறப்பாட்டுப் பொருளில் மொழிபெயர்க்கப்பட்டுள்ளன.
- source_word: וּמִשְּׂדוֹת גֶּבַע וְעַזְמָוֶת
  choice: கேபா மற்றும் அஸ்மாவேத்தின் வயல்வெளிகளிலிருந்தும்
  rationale: שָׂדוֹת என்பதன் நேரடிப் பொருள் ‘வயல்வெளிகள்’; இங்கு பெயரிடப்பட்ட ஊர்களைச் சார்ந்த விவசாய நிலப்பகுதிகளைக் குறிக்கிறது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: பாடகர்கள் ஏன் இந்தச் சுற்றுப்புற இடங்களிலிருந்து வந்தார்கள் என்பதற்கான காரணத்தை அறிமுகப்படுத்தும் விளக்க இணைப்பாக உள்ளது.
- source_word: חֲצֵרִים
  choice: கிராமங்கள்
  rationale: இந்தச் சூழலில் வேலியிட்ட முற்றங்கள் என்பதல்லாமல், எருசலேமைச் சுற்றிப் பாடகர்கள் வாழ்ந்த சிறிய குடியிருப்பிடங்களைக் குறிக்கிறது. பொதுவாசகர்களுக்கு ‘கிராமங்கள்’ இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: בָּנוּ לָהֶם
  choice: தங்களுக்காகக் ... கட்டியிருந்தார்கள்
  rationale: வினைச்சொல்லின் அடிப்படைப் பொருளான ‘கட்டுதல்’ பாதுகாக்கப்பட்டுள்ளது; காரணவாக்கியம் ஏற்கெனவே நிலவிய சூழலை விளக்குவதால் ‘கட்டியிருந்தார்கள்’ பொருத்தமானது.
- source_word: הַמְשֹׁרֲרִים
  choice: பாடகர்கள்
  rationale: שׁיר வேரிலிருந்து வந்த இந்த வடிவம் பாடுகிறவர்களையே குறிப்பாகச் சுட்டுகிறது; பொதுவான ‘இசைக்கலைஞர்கள்’ என்பதைவிட இது துல்லியமானது.
- source_word: סְבִיבוֹת יְרוּשָׁלִָם
  choice: எருசலேமைச் சுற்றிலும்
  rationale: எருசலேம் நகரைச் சூழ்ந்திருந்த பகுதிகள் என்ற இடவியல் பொருளை இயல்பான நவீனத் தமிழில் தருகிறது.
