  text: וּ/בַקְבֻּֽקְיָ֨ה ו/ענו אֲחֵי/הֶ֛ם לְ/נֶגְדָּ֖/ם לְ/מִשְׁמָרֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/009.yaml
  text: And Bakbukiah and Unno[a], their brothers, stood opposite them in the divisions of service.
translation:
  language: ta
  text: பக்புக்கியாவும் உன்னோவும்[a], அவர்களுடைய சகோதரர்களும், பணிப் பிரிவுகளின்படி அவர்களுக்கு எதிரே இருந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, וענו என்பதை ‘உன்னோ’ என்ற பெயராக அல்லாமல் வினைச்சொல்லாக வாசித்தால், ‘அவர்களுடைய சகோதரர்கள் பணிப் பிரிவுகளின்படி அவர்களுக்குப் பதிலளித்தார்கள்’ என்றும் இருக்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: וּבַקְבֻּקְיָה
  choice: பக்புக்கியாவும்
  rationale: தனிப்பெயர் தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளது; முன்னொட்டு இணைப்புச் சொல் ‘-வும்’ மூலம் தெரிவிக்கப்பட்டுள்ளது.
- source_word: ו/ענו
  choice: உன்னோவும்
  rationale: உடனடி சூழலில் லேவியர்களின் பெயர்ப்பட்டியல் வருவதால் இதை ‘உன்னோ’ என்ற தனிப்பெயராகக் கொள்வது பொருத்தமானது. எனினும், இதை வினைச்சொல்லாக வாசிக்கும் சாத்தியம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
- source_word: אֲחֵיהֶם
  choice: அவர்களுடைய சகோதரர்களும்
  rationale: எபிரெய உறவுமுறைச் சொல்லை நேரடியாகப் பாதுகாக்கிறது; இச்சூழலில் ஒரே குடும்பம் அல்லது பணிக்குழுவைச் சேர்ந்தவர்களையும் இது குறிக்கலாம்.
- source_word: לְנֶגְדָּם
  choice: அவர்களுக்கு எதிரே இருந்தார்கள்
  rationale: மூலத்தில் வெளிப்படையான வினைச்சொல் இல்லாவிட்டாலும், தமிழில் முழுமையான இயல்பான வாக்கியத்திற்காக ‘இருந்தார்கள்’ சேர்க்கப்பட்டுள்ளது; ‘எதிரே’ என்பது இட அல்லது அணிவகுப்பு உறவைப் பாதுகாக்கிறது.
- source_word: לְמִשְׁמָרוֹת
  choice: பணிப் பிரிவுகளின்படி
  rationale: ஆலய ஊழியத்திற்கான முறைப்படியான குழுக்கள் அல்லது காவல் முறைப்பணிகளை இச்சொல் குறிக்கலாம்; இங்கு பட்டியல் சூழலுக்கு ஏற்றபடி ‘பணிப் பிரிவுகள்’ எனத் தரப்பட்டுள்ளது.
