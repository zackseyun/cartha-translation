base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/031.yaml
  text: Then I brought the leaders of Judah up onto the wall[a], and I appointed two great thanksgiving choirs and processions[b], one going to the right on the wall toward the Dung Gate.
translation:
  language: ta
  text: பிறகு யூதாவின் தலைவர்களை மதிலின் மேல் ஏறச் செய்தேன். நன்றிசெலுத்தும் இரண்டு பெரிய பாடகர் குழுக்களை ஊர்வலமாக அமைத்தேன்[a]. அவற்றில் ஒன்று மதிலின் மேல் வலப்புறமாகக் குப்பை வாயிலை நோக்கிச் சென்றது[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மொழியில் நேரடியாக, ‘இரண்டு பெரிய நன்றிசெலுத்துதல்கள்.’ இங்கு அது வெறும் நன்றியுணர்வுச் செயல்களைக் காட்டிலும், நன்றிசெலுத்திப் பாடிய ஒழுங்கமைந்த குழுக்களையோ ஊர்வலப் பாடகர் குழுக்களையோ குறிக்கக்கூடும்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘குப்பை வாயிலுக்குச் சென்றது.’ இத்திசைச் சூழலில் வரும் முன்னிடைச்சொல்லை ‘வாயிலை நோக்கி’ என்றும் ‘வாயிலுக்கு’ என்றும் மொழிபெயர்க்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: וָאַעֲלֶה
  choice: ஏறிவரச் செய்தேன்
  rationale: עלה என்பதன் ஹிபில் வடிவம் ‘ஏறச் செய்தல்’ என்ற காரணவினைப் பொருளைக் கொண்டது. தலைவர்களை மதிலின்மேல் ஏறச் செய்த செயலைத் தமிழில் இயல்பாகத் தெரிவிக்கிறது.
- source_word: שָׂרֵי יְהוּדָה
  choice: யூதாவின் தலைவர்கள்
  rationale: שָׂרִים என்பது இச்சூழலில் இளவரசர்களை மட்டுமல்லாமல் குடிமைத் தலைவர்களையோ அதிகாரிகளையோ குறிக்கலாம்; ‘தலைவர்கள்’ என்பது தேவையற்ற அரசகுலப் பொருளைச் சேர்க்காத பொதுவான நவீனச் சொல்.
- source_word: מֵעַל לַחוֹמָה
  choice: மதிலின்மேல்
  rationale: மதிலின் மேற்பரப்புக்குச் சென்று அதன்மேல் இருப்பதைக் குறிக்கும்; ஊர்வலம் நடைபெறும் இடத்தையும் தெளிவாகக் காட்டுகிறது.
- source_word: וָאַעֲמִידָה
  choice: அணிவகுத்து நிறுத்தினேன்
  rationale: עמד என்பதன் ஹிபில் வடிவம் ‘நிற்கச் செய்தல், நிலைநிறுத்துதல்’ எனப் பொருள்படும். வழிபாட்டு ஊர்வலக் குழுக்களை ஒழுங்குபடுத்தி நிறுத்திய செயலை இச்சொற்றொடர் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: תֹּודֹת גְּדוֹלֹת
  choice: நன்றிசெலுத்தும் இரண்டு பெரிய பாடகர் குழுக்கள்
  rationale: תודות என்பதன் நேரடிப் பொருள் ‘நன்றிசெலுத்துதல்கள்’; ஆனால் மதில் அர்ப்பணிப்பு ஊர்வலச் சூழலில் அது நன்றிசெலுத்திப் பாடும் ஒழுங்கமைந்த குழுக்களை ஆகுபெயராகக் குறிக்கிறது. மொழிபெயர்ப்பு நன்றிசெலுத்தும் கருத்தையும் குழுவின் இயல்பையும் தக்கவைக்கிறது.
- source_word: וְתַהֲלֻכֹת
  choice: ஊர்வலங்கள்
  rationale: הלך வேரிலிருந்து வந்த இப்பெயர்ச்சொல் செல்லுதல் அல்லது ஊர்வலமாக நகருதல் என்பதைக் குறிக்கிறது; மதில்மேல் நகரும் குழுக்களுக்கு ‘ஊர்வலங்கள்’ பொருத்தமானது.
- source_word: לַיָּמִין
  choice: வலப்புறமாக
  rationale: மூலத்தில் நேரடியாக ‘வலப்புறத்திற்கு’ என்று உள்ளது. அதிலிருந்து ஊகிக்கப்படும் திசைப்பெயரைச் சேர்க்காமல் மூலத்தின் பார்வைநிலையைப் பேணுகிறது.
- source_word: לְשַׁעַר הָאַשְׁפֹּת
  choice: குப்பை வாயிலை நோக்கி
  rationale: אַשְׁפֹּת என்பது குப்பை அல்லது கழிவைக் குறிக்கிறது; இது எருசலேமின் வாயிலுக்கான பெயர். இயக்கச் சூழலில் לְ என்பதைக் ‘நோக்கி’ என வழங்குவது இயல்பானது; ‘வாயிலுக்கு’ என்பதும் சாத்தியம்.
