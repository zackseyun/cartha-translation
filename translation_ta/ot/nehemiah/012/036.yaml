base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/036.yaml
  text: and his brothers—Shemaiah[a], Azarel, Milalai, Gilalai, Maai, Nethanel, Judah, and Hanani—with the musical instruments of David the man of God, and Ezra the scribe before them.
translation:
  language: ta
  text: அவனுடைய சகோதரர்களான செமாயா, அசரெயேல், மிலலாய், கிலலாய், மாயி, நெதனெயேல், யூதா, ஹனானி ஆகியோர் கடவுளின் மனிதரான தாவீதின் இசைக்கருவிகளுடன் இருந்தனர்[a]; எழுத்தரான எஸ்றா அவர்களுக்கு முன்னால் இருந்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘பாடலுக்கான கருவிகளுடன்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶחָיו
  choice: அவனுடைய சகோதரர்களான
  rationale: אֶחָיו என்பதன் நேர்ப்பொருள் ‘அவனுடைய சகோதரர்கள்.’ இங்கு ஒரே லேவியக் குழுவைச் சேர்ந்த நெருங்கிய தோழர்களையும் குறிக்கக்கூடும்; எனினும் மூலத்தின் உறவுமுறைச் சொல்லை உரையில் தக்கவைத்துள்ளது.
- source_word: שְׁמַעְיָה ... חֲנָנִי
  choice: செமாயா, அசரெயேல், மிலலாய், கிலலாய், மாயி, நெதனெயேல், யூதா, அனானி
  rationale: எபிரெயத் தனிப்பெயர்கள் மொழிபெயர்க்கப்படாமல், நவீனத் தமிழில் இயல்பாக ஒலிபெயர்க்கப்பட்டுள்ளன.
- source_word: בִּכְלֵי שִׁיר
  choice: இசைக்கருவிகளுடன்
  rationale: כְּלֵי என்பது கருவிகளையும் שִׁיר என்பது பாடல் அல்லது இசையையும் குறிக்கிறது. ‘இசைக்கருவிகள்’ என்பது இயல்பான நவீனத் தமிழ்; நேரடியான மாற்று அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: דָּוִיד אִישׁ הָאֱלֹהִים
  choice: இறைவனின் மனிதரான தாவீதின்
  rationale: கருவிகள் தாவீதோடு தொடர்புடையவை என்பதை உடைமைத் தொடர் காட்டுகிறது; אִישׁ הָאֱלֹהִים என்ற மரியாதைப் பட்டமும் தக்கவைக்கப்பட்டுள்ளது.
- source_word: וְעֶזְרָא הַסּוֹפֵר
  choice: எழுத்தரான எஸ்றா
  rationale: הַסּוֹפֵר என்பதன் அடிப்படைப் பொருளான ‘எழுத்தர்’ என்பதைத் தக்கவைத்து, பழமையான அல்லது கூடுதல் விளக்கமளிக்கும் பட்டங்களைத் தவிர்க்கிறது.
- source_word: לִפְנֵיהֶם
  choice: அவர்களுக்கு முன்னால் சென்றார்
  rationale: ஊர்வலச் சூழலில் לִפְנֵיהֶם என்பது அவர்களுக்கு முன்னால் இருந்த நிலையைச் சுட்டுகிறது. தமிழில் முழுமையான இயல்பான வாக்கியத்திற்காகச் சூழலால் உணரப்படும் ‘சென்றார்’ சேர்க்கப்பட்டுள்ளது.
theological_decisions:
- issue: אִישׁ הָאֱלֹהִים என்ற மரியாதைப் பட்டத்தின் மொழிபெயர்ப்பு
  choice: இறைவனின் மனிதர்
  alternative: கடவுளுக்குரிய மனிதர்
  rationale: இது வேதாகம வழக்கில் வரும் மரியாதைப் பட்டம். அதன் சொல் வடிவத்தையும் பிற இடங்களுடனான தொடர்பையும் காத்து, கூடுதல் கோட்பாட்டு விளக்கத்தைச் சேர்க்காமல் மொழிபெயர்க்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டுள்ளது. பெயர்கள் எபிரெய ஒலிக்கு நெருக்கமாக வழங்கப்பட்டுள்ளன; பழமையான ‘வேதபாரகன்,’ ‘கீதவாத்தியம்’ போன்ற சொற்கள் தவிர்க்கப்பட்டுள்ளன.
