- from: அவனுடைய சகோதரர்களான செமாயா, அசரெயேல், மிலலாய், கிலலாய், மாயி, நெதனெயேல், யூதா, அனானி ஆகியோர், இறைவனின் மனிதரான தாவீதின் இசைக்கருவிகளுடன்[a] சென்றார்கள். எழுத்தரான எஸ்றா அவர்களுக்கு முன்னால் சென்றார்.
