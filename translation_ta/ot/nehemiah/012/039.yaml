base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/039.yaml
  text: and above the Gate of Ephraim[a], and above the Old Gate, and above the Fish Gate, and the Tower of Hananel, and the Tower of the Hundred, and as far as the Sheep Gate[b]; and they stood at the Gate of the Guard.
translation:
  language: ta
  text: எப்பிராயீம் வாசலுக்கு மேலாகவும், பழைய வாசலுக்கு மேலாகவும், மீன் வாசலுக்கு மேலாகவும், அனனியேல் கோபுரத்தையும் நூறு கோபுரத்தையும் கடந்து, ஆட்டு வாசல்வரை சென்றார்கள்; காவல் வாசலில் அவர்கள் நின்றார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “காவல் வாசல்” என்பதற்கு “சிறை வாசல்” அல்லது “கண்காணிப்பு வாசல்” என்றும் மொழிபெயர்க்கலாம். “நின்றார்கள்” என்பது இச்சூழலில் “அங்கே நின்றுவிட்டார்கள்” அல்லது “தங்கினார்கள்” என்றும் பொருள்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמֵעַל לְשַׁעַר אֶפְרַיִם
  choice: எப்பிராயீம் வாசலுக்கு மேலாகவும்
  rationale: מֵעַל என்பதன் இடஞ்சார்ந்த ‘மேலாக’ என்ற பொருளைத் தக்கவைத்து, முந்தைய வசனத்திலிருந்து தொடரும் மதில்மேல் ஊர்வலப் பாதையை இயல்பான தமிழில் காட்டுகிறது.
- source_word: וְעַל שַׁעַר הַיְשָׁנָה
  choice: பழைய வாசலுக்கு மேலாகவும்
  rationale: שַׁעַר הַיְשָׁנָה என்பதைக் கூடுதல் விளக்கம் சேர்க்காமல் ‘பழைய வாசல்’ எனவும், மீண்டும் வரும் עַל என்பதை ‘மேலாக’ எனவும் மொழிபெயர்க்கிறது.
- source_word: וְעַל שַׁעַר הַדָּגִים
  choice: மீன் வாசலுக்கு மேலாகவும்
  rationale: எபிரெயக் கட்டமைப்பின் இயல்பான தமிழ் பெயராக ‘மீன் வாசல்’ பயன்படுத்தப்பட்டு, עַל என்பதன் இடஞ்சார்ந்த பொருள் தொடர்கிறது.
- source_word: וּמִגְדַּל חֲנַנְאֵל
  choice: அனானெயேல் கோபுரத்தையும் கடந்து
  rationale: חֲנַנְאֵל என்ற பெயர் தமிழ் வேதாகமப் பெயர்வழக்குக்கு ஏற்றவாறு ஒலிபெயர்க்கப்படுகிறது. இவ்விடத்திலும் அடுத்த கோபுரத்திலும் முன்விகுதி מִן இடம்பெறுவதால், பாதை விவரிப்பில் ‘கடந்து’ என்பது ‘அங்கிருந்து/அதற்கு அப்பால்’ என்ற இயக்கத்தை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וּמִגְדַּל הַמֵּאָה
  choice: நூறு கோபுரத்தையும் கடந்து
  rationale: ‘நூறு’ எதைக் குறிக்கிறது என்பது தெளிவற்றதால், விளக்கவுரை சேர்க்காமல் எபிரெயச் சொல்லமைப்பைப் பாதுகாக்கிறது.
- source_word: וְעַד שַׁעַר הַצֹּאן
  choice: ஆட்டு வாசல்வரை
  rationale: עַד குறிக்கும் பாதையின் எல்லையை ‘வரை’ தெளிவாகக் காட்டுகிறது; שַׁעַר הַצֹּאן என்பதற்கு இயல்பான தமிழ் இடப்பெயர் ‘ஆட்டு வாசல்.’
- source_word: וְעָמְדוּ
  choice: அவர்கள் நின்றார்கள்
  rationale: עמד என்பதன் நேரடியான பொருளான ‘நின்றார்கள்’ பாதுகாக்கப்படுகிறது; சூழலில் ‘அங்கே நின்றுவிட்டார்கள்/தங்கினார்கள்’ என்ற நுண்பொருளும் இருக்கலாம்.
- source_word: בְּשַׁעַר הַמַּטָּרָה
  choice: காவல் வாசலில்
  rationale: מַטָּרָה காவல், காவற்கூடம் அல்லது சிறை தொடர்பான இடத்தைக் குறிக்கக்கூடும். ‘காவல் வாசல்’ பாதுகாப்பு சார்ந்த பொருளைப் பேணுகிறது; மாற்றுப் பொருள்கள் அடிக்குறிப்பில் தரப்படுகின்றன.
