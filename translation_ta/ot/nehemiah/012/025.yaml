  source_fidelity: மூல எபிரெயத்தில் பெயரிடப்பட்ட ஆறு நபர்களும், שֹׁמְרִים / שֹׁעֲרִים என்ற ‘காவலர்கள் / வாயிற்காப்பாளர்கள்’ என்னும் இணைச் சொல்லாட்சியும், מִשְׁמָר என்ற காவல் பணிக் கருத்தும் துல்லியமாகக் காக்கப்பட்டுள்ளன. בַּאֲסֻפֵּי הַשְּׁעָרִים என்பதன் சற்றே உறுதியற்ற இட/சேமிப்பிடப் பொருளை ‘வாயில்களின் களஞ்சியங்களில்’ என மொழிபெயர்த்திருப்பது சாத்தியமானது; அடிக்குறிப்பு அந்த அரிதான சொல்லின் ஐயத்தையும் உரியவாறு வெளிப்படுத்துகிறது.
  naturalness: நவீனத் தரத் தமிழில் பெயர்ப்பட்டியலுக்கும் அதிகாரப்பூர்வ வேதாகம நடைக்கும் ஏற்றவாறு உள்ளது. ‘காவலர்களாகவும் வாயிற்காப்பாளர்களாகவும் இருந்து, ... காவல் காத்தார்கள்’ என்பது மூலத்தின் வலியுறுத்தும் மறுமொழியைப் பாதுகாக்கிறது; தமிழிலும் தெளிவாக உள்ளது.
  terminology: ‘வாயிற்காப்பாளர்கள்’ என்பது שֹׁעֲרִים-க்கு பொருத்தமான மரியாதையான வேதாகமச் சொல். ‘களஞ்சியங்கள்’ மற்றும் அடிக்குறிப்பில் உள்ள ‘சேர்த்துவைக்கும் இடங்கள்’ ஆகியவை אֲסֻפֵּי என்பதற்கான விளக்க வரம்பைத் திறந்தே வைத்துள்ளன. பெயர்கள் ஏற்ற தமிழாக்க ஒலிபெயர்ப்பில் உள்ளன.
