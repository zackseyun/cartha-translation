  yaml_path: translation/ot/nehemiah/012/025.yaml
  text: Mattaniah, Bakbukiah, Obadiah, Meshullam, Talmon, and Akkub were guards, gatekeepers, keeping watch at the storehouses of the gates.
translation:
  language: ta
  text: மத்தனியா, பக்குபுக்கியா, ஒபதியா, மெசுல்லாம், தல்மோன், அக்கூப் ஆகியோர் காவலர்களாகவும் வாயிற்காப்பாளர்களாகவும் இருந்து, வாயில்களின் களஞ்சியங்களில்[a] காவல் காத்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “களஞ்சியங்களில்” என்பதற்கான எபிரெயச் சொல் அரிதானது; “சேர்த்துவைக்கும் இடங்களில்” என்றும் பொருள் கொள்ளலாம்.
    reason: அரிதான אֲסֻפֵּי என்ற சொல்லின் சொற்பொருள் ஐயத்தை மறைக்காமல் காட்டுகிறது.
lexical_decisions:
- source_word: שֹׁמְרִים שֹׁעֲרִים
  choice: காவலர்களாகவும் வாயிற்காப்பாளர்களாகவும்
  rationale: இரண்டு எபிரெயச் சொற்களின் நெருக்கமான அடுக்கையும் அவற்றுக்கிடையிலான பொருள் தொடர்பையும் இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: מִשְׁמָר
  choice: காவல் காத்தார்கள்
  rationale: இச்சொல் குறிக்கும் காவல்முறை அல்லது காவல் பணியைத் தெளிவான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: אֲסֻפֵּי הַשְּׁעָרִים
  choice: வாயில்களின் களஞ்சியங்களில்
  rationale: இங்கு אֲסֻפִּים என்பது வாயில்களோடு தொடர்புடைய சேமிப்பிடங்களைக் குறிப்பதாகப் புரிந்துகொள்ளப்பட்டுள்ளது; சொல்லின் அரிதான பயன்பாடு அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
