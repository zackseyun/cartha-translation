translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாக வாசிக்கப்படும் சுருக்கமான பெயர்ப்பட்டியல். மூன்று உறுப்புகளிலும் ‘-வும்’ பயன்படுத்துவது தமிழ் இணைப்புப் பட்டியல் நடைக்கு ஏற்றது; நடை கண்ணியமாகவும் தெளிவாகவும் உள்ளது.
