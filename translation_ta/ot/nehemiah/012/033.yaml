translation:
  language: ta
  text: அசரியாவும், எஸ்றாவும், மெசுல்லாமும்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַ/עֲזַרְיָה
  choice: அசரியாவும்
  rationale: வாவ் இணைப்பைத் தமிழின் இயல்பான பட்டியல் அமைப்புக்கேற்ப பெயருடன் சேர்ந்த ‘-வும்’ எனக் கொடுத்து, עֲזַרְיָה என்ற தனிப்பெயரைத் தமிழில் வழக்கமான வடிவில் ஒலிபெயர்த்துள்ளது.
- source_word: עֶזְרָא
  choice: எஸ்றாவும்
  rationale: עֶזְרָא என்ற தனிப்பெயர் ஒலிபெயர்க்கப்பட்டுள்ளது. எபிரெயத்தில் இதற்கு முன் இணைப்புச்சொல் இல்லாவிட்டாலும், மூன்று பெயர்களையும் இணைக்கும் இயல்பான தமிழ் பட்டியல் நடைக்காக ‘-வும்’ சேர்க்கப்பட்டுள்ளது; பொருளில் மாற்றமில்லை.
- source_word: וּ/מְשֻׁלָּם
  choice: மெசுல்லாமும்
  rationale: வாவ் இணைப்பை ‘-வும்’ எனக் கொடுத்து, מְשֻׁלָּם என்ற தனிப்பெயரை அதன் எபிரெய ஒலிக்கு அண்மையாக ஒலிபெயர்த்துள்ளது.
