  text: וַֽ/יִּשְׁמְר֞וּ מִשְׁמֶ֤רֶת אֱלֹֽהֵי/הֶם֙ וּ/מִשְׁמֶ֣רֶת הַֽ/טָּהֳרָ֔ה וְ/הַ/מְשֹׁרְרִ֖ים וְ/הַ/שֹּׁעֲרִ֑ים כְּ/מִצְוַ֥ת דָּוִ֖יד שְׁלֹמֹ֥ה בְנֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/045.yaml
  text: And they kept the charge of their God and the charge of purification[a], and so did the singers and the gatekeepers[b], according to the command of David and Solomon his son.
translation:
  language: ta
  text: அவர்கள் தங்கள் கடவுளுக்குரிய பணியையும் தூய்மைப்படுத்துதலுக்கான பணியையும் நிறைவேற்றினார்கள்; பாடகர்களும் வாயிற்காவலர்களும் அவ்வாறே செய்தார்கள்[a]. இவை அனைத்தும் தாவீதும் அவருடைய மகன் சாலொமோனும் இட்ட கட்டளையின்படி செய்யப்பட்டன.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “பாடகர்களும் வாயிற்காவலர்களும்” என்ற எபிரெயத் தொடர் வினைச்சொல் வெளிப்படையாக இல்லாமல் சுருக்கமாக உள்ளது; இக்குழுக்களும் தங்களுக்கு ஒப்படைக்கப்பட்ட பணிகளை நிறைவேற்றினார்கள் என்பதே அதன் பொருளாகத் தோன்றுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמְרוּ מִשְׁמֶרֶת
  choice: பணியை நிறைவேற்றினார்கள்
  rationale: שׁמר உடன் מִשְׁמֶרֶת வருவது ஒப்படைக்கப்பட்ட கடமையை முறையாகச் செய்வதைக் குறிக்கும் மரபுத்தொடர். நவீன தமிழில் ‘பணியை நிறைவேற்றினார்கள்’ இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: אֱלֹהֵיהֶם
  choice: தங்கள் கடவுளுக்குரிய
  rationale: எபிரெயச் சொல்லிலுள்ள மூன்றாம் நபர் பன்மை உடைமை விகுதியைத் தக்கவைத்து, அந்தப் பணி யாருக்குரியது என்பதைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: מִשְׁמֶרֶת הַטָּהֳרָה
  choice: தூய்மைப்படுத்தும் பணி
  rationale: ஆலயச் சூழலில் הַטָּהֳרָה சடங்குசார் தூய்மை அல்லது தூய்மைப்படுத்துதலைக் குறிக்கிறது. ‘தூய்மைப்படுத்தும் பணி’ அதன் செயற்பாட்டு மற்றும் வழிபாட்டுச் சூழலைத் தெளிவாக்குகிறது.
- source_word: וְהַמְשֹׁרְרִים וְהַשֹּׁעֲרִים
  choice: பாடகர்களும் வாயிற்காவலர்களும் அவ்வாறே செய்தார்கள்
  rationale: மூலத்தில் வினைச்சொல் வெளிப்படையாக இல்லாத சுருக்கமான தொடர் இது. இக்குழுக்களும் தங்களுக்கு ஒப்படைக்கப்பட்ட பணியைச் செய்தார்கள் என்பதே சூழலுக்கேற்ற பொருள்; ‘அவ்வாறே செய்தார்கள்’ எனச் சேர்ப்பது அந்த மறைபொருளை மட்டும் வெளிப்படுத்துகிறது.
- source_word: שֹׁעֲרִים
  choice: வாயிற்காவலர்கள்
  rationale: ஆலய வாயில்களில் நியமிக்கப்பட்ட காவல் மற்றும் சேவைப் பொறுப்புடையவர்களைக் குறிக்கும் துல்லியமான தமிழ் சொல்.
- source_word: כְּמִצְוַת
  choice: கொடுத்த கட்டளையின்படி
  rationale: מִצְוָה இங்கு ஆலயப் பணிக்கான அதிகாரப்பூர்வ நெறியைக் குறிக்கிறது. ‘கட்டளையின்படி’ நவீன தமிழில் தெளிவாகவும் கண்ணியமாகவும் உள்ளது.
- source_word: דָּוִיד שְׁלֹמֹה בְנוֹ
  choice: தாவீதும் அவருடைய மகன் சாலொமோனும்
  rationale: ‘அவருடைய மகன்’ என்பது சாலொமோனைச் சுட்டுகிறது என்பதைத் தமிழில் இயல்பாகத் தெளிவுபடுத்தி, இருவரின் பெயர்களையும் மூல வரிசையில் வைக்கிறது.
theological_decisions:
- issue: הַטָּהֳרָה என்பதன் ஆலயச் சூழலிலான இயல்பு
  choice: தூய்மைப்படுத்துதல்
  alternative: தூய்மை; சுத்திகரிப்பு
  rationale: வசனம் லேவிய மற்றும் வழிபாட்டுப் பணிகளைப் பற்றியதால், பொதுவான ஒழுக்கத் தூய்மையைவிட சடங்குசார் தூய்மைப்படுத்துதலே முதன்மையான பொருள். பின்னாளைய கோட்பாட்டுச் சொற்களைச் சேர்க்காமல் அந்த வழிபாட்டுப் பரிமாணத்தை இது காக்கிறது.
- issue: பாடகர்களும் வாயிற்காவலர்களும் என்ற வினையற்ற தொடரின் தொடர்பு
  choice: அவர்களும் அதேபோல் தங்கள் பணியைச் செய்தார்கள்
  alternative: அவர்கள் முன் கூறப்பட்ட குழுவுடன் இணைந்திருந்தார்கள்
  rationale: எபிரெயத் தொடர் இலக்கண ரீதியாகச் சுருக்கமானது. சூழலின்படி பாடகர்களும் வாயிற்காவலர்களும் ஒப்படைக்கப்பட்ட பொறுப்புகளை நிறைவேற்றினர் என்பதே வாய்ப்பான வாசிப்பு; ஆயினும் அந்தச் சுருக்கத் தன்மை அடிக்குறிப்பில் சுட்டப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘கடமை’ என்பதற்குப் பதிலாக ஆலயச் சேவையின் ஒப்படைக்கப்பட்ட பொறுப்பை உணர்த்த ‘பணி’ பயன்படுத்தப்பட்டுள்ளது; மூலத்தின் சுருக்கமான இலக்கண அமைப்பு அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
