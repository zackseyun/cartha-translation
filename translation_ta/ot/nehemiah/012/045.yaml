  source_fidelity: 'முதன்மைப் பொருள் பெரும்பாலும் துல்லியமாக உள்ளது: மிஷ்மெரெத் என்பதன் ஒப்படைக்கப்பட்ட ஆலயப் பொறுப்பு, சடங்குசார் தூய்மைப்படுத்துதல், பாடகர்கள் மற்றும் வாயிற்காவலர்களைச் சார்ந்த சுருக்கமான தொடர் ஆகியவை நன்கு காக்கப்பட்டுள்ளன. ஆனால் இறுதி வாக்கியத்தில் “இவை ... நடந்தன” என்பது மூலத்தின் செயற்பாட்டு அமைப்பிலிருந்து விலகி, கட்டளையின்படி செயல்பட்டது யார் என்பது தெளிவிழக்கச் செய்கிறது. “கொடுத்த” என்பதும் மூலத்தில் வெளிப்படையாக இல்லாத வினையைச் சேர்க்கிறது.'
  naturalness: மொழிநடை நவீன நிலையான தமிழில் இயல்பாக உள்ளது. இருப்பினும், கட்டளையின்படியான சொற்றொடரை முதன்மை வினையுடன் நேரடியாக இணைப்பது தமிழிலும் தெளிவாகவும் நேர்த்தியாகவும் இருக்கும்.
