base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/035.yaml
  text: 'and from the sons of the priests[a], with trumpets: Zechariah son of Jonathan, son of Shemaiah, son of Mattaniah, son of Micaiah, son of Zaccur, son of Asaph.'
translation:
  language: ta
  text: 'ஆசாரியர்களின் மகன்களில் சிலர்[a], எக்காளங்களுடன்: யோனத்தானின் மகன் சகரியா; செமாயாவின் மகன் யோனத்தான்; மத்தனியாவின் மகன் செமாயா; மீகாயாவின் மகன் மத்தனியா; சக்கூரின் மகன் மீகாயா; ஆசாப்பின் மகன் சக்கூர்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'மாற்று: “ஆசாரியர்களின் மகன்களிலிருந்து, எக்காளங்களுடன்.” எபிரெயச் சொற்றொடர் ஒரு பகுதியைச் சேர்ந்தவர்களைக் குறிக்கிறது.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/מִ/בְּנֵי הַ/כֹּהֲנִים
  choice: ஆசாரியர்களின் மகன்களில் சிலர்
  rationale: מן உடைய பகுதியைக் குறிக்கும் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது; முந்தைய பட்டியலோடு உள்ள ו இணைப்பும் சூழலில் தொடர்ச்சியால் புலப்படுகிறது.
- source_word: בַּ/חֲצֹצְרוֹת
  choice: எக்காளங்களுடன்
  rationale: ב இங்கு கருவியைக் குறிக்கிறது; ஊர்வலத்தில் அவர்கள் எக்காளங்களை ஏந்தி அல்லது வாசித்துப் பங்கேற்றதை மிகைப்படுத்தாமல் தெரிவிக்கிறது.
- source_word: בֶן
  choice: மகன்
  rationale: மீண்டும் வரும் வம்சத் தொடர்பைத் தமிழில் தெளிவாகப் பாதுகாக்கிறது.
- source_word: זְכַרְיָה ... אָסָף
  choice: சகரியா ... ஆசாப்
  rationale: தனிப்பெயர்கள் வழக்கமான தமிழ் வேதாகம ஒலிபெயர்ப்பு மரபுக்கு ஏற்ப வழங்கப்பட்டுள்ளன.
theological_decisions:
- issue: ஆசாப்புடனான வம்சத் தொடர்பு
  choice: ஒவ்வொரு בֶן என்பதையும் ‘மகன்’ என நேரடியாகப் பாதுகாத்து, தமிழின் இயல்புக்கேற்ப மூதாதையிலிருந்து சகரியாவரை வரிசைப்படுத்துதல்
  alternative: ‘ஆசாப்பின் வம்சத்தவன்’ அல்லது இசைக்குழு உறுப்பினர் என விரிவாக விளக்குதல்
  rationale: எபிரெய உரை நேரடியான வம்சத் தொடரையே தருகிறது; குழு உறுப்பினர், சங்கீத ஆசிரியர் போன்ற கூடுதல் வரலாற்று அல்லது இறையியல் முடிவுகளை வசனத்துக்குள் சேர்க்கவில்லை.
translation_notes:
  register: நவீன, தெளிவான, மரியாதைமிக்க தமிழ். நீண்ட எபிரெய வம்சத் தொடரை வாசகர் எளிதில் பின்தொடர, தமிழின் இயல்பான முறையில் மூதாதையிலிருந்து சகரியாவரை அமைத்துள்ளது; எந்த தலைமுறையும் நீக்கப்படவில்லை.
