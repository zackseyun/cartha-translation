  register: நவீனத் தரத் தமிழில், வாசிக்க எளிதான அதேவேளையில் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. எபிரெயச் சொற்றொடரின் ‘மகன்கள்’ என்ற வடிவம் பாதுகாக்கப்பட்டுள்ளது; புவியியல் சொற்களின் பொருள் மாறுபாடுகள் அடிக்குறிப்புகளில் தரப்பட்டுள்ளன.
