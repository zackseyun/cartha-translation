source:
  edition: WLC
  text: וַ/יֵּאָ֣סְפ֔וּ בְּנֵ֖י הַ/מְשֹׁרְרִ֑ים וּ/מִן הַ/כִּכָּר֙ סְבִיב֣וֹת יְרוּשָׁלִַ֔ם וּ/מִן חַצְרֵ֖י נְטֹפָתִֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/028.yaml
  text: And the sons of the singers were gathered from the district around Jerusalem and from the settlements of the Netophathites[a][b].
translation:
  language: ta
  text: பாடகர்களின் மகன்கள் எருசலேமைச் சுற்றியுள்ள வட்டாரத்திலிருந்தும்[a], நெத்தோபாத்தியரின் குடியிருப்புகளிலிருந்தும்[b] ஒன்றுகூடினார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘எருசலேமைச் சுற்றியுள்ள சமவெளியிலிருந்தும்.’ எபிரெயச் சொல்லான כִּכָּר சூழலுக்கேற்ப சமவெளி, சுற்றுப்பகுதி அல்லது வட்டாரம் என்று பொருள்படும்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘நெத்தோபாத்தியரின் சிற்றூர்களிலிருந்தும்.’ எபிரெயச் சொல்லான חַצְרֵי என்பது பெரும்பாலும் சிறிய குடியிருப்புகளையோ மதிலற்ற சிற்றூர்களையோ குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּאָסְפוּ
  choice: ஒன்றுகூடினார்கள்
  rationale: אסף என்பதன் நிஃபால் வடிவம் மக்கள் ஒன்றாகத் திரண்டதைக் குறிக்கிறது. யாராவது அவர்களைக் கூட்டிவரச் செய்தார்களா, அல்லது அவர்களே கூடினார்களா என்பதைத் தேவையின்றி தீர்மானிக்காமல், இயல்பான தமிழில் ‘ஒன்றுகூடினார்கள்’ என்று தரப்பட்டுள்ளது.
- source_word: בְּנֵי הַמְשֹׁרְרִים
  choice: பாடகர்களின் மகன்கள்
  rationale: בְּנֵי என்பதன் நேரடிப் பொருளான ‘மகன்கள்’ தக்கவைக்கப்பட்டுள்ளது; சூழலில் இது பாடகர் குடும்பம் அல்லது குழுவைச் சேர்ந்தவர்களையும் குறிக்கக்கூடும். הַמְשֹׁרְרִים குறிப்பாகப் பாடுபவர்களைக் குறிக்கிறது, பொதுவாக இசைக்கலைஞர்களை அல்ல.
- source_word: הַכִּכָּר סְבִיבוֹת יְרוּשָׁלִַם
  choice: எருசலேமைச் சுற்றியுள்ள வட்டாரம்
  rationale: כִּכָּר என்பது சமவெளி, சுற்றுப்பகுதி அல்லது வட்டாரம் எனப் பொருள்படலாம். இங்கு ‘எருசலேமைச் சுற்றியுள்ள’ என்ற தொடருடன் வருவதால், ‘வட்டாரம்’ இயல்பாகவும் புவியியல் பொருளுக்கு ஏற்றதாகவும் உள்ளது.
- source_word: חַצְרֵי
  choice: குடியிருப்புகள்
  rationale: חָצֵר என்பதற்கு முற்றம் அல்லது அடைப்பு என்ற அடிப்படைப் பொருள் இருந்தாலும், இடப்பெயர்ச் சூழல்களில் அது சிற்றூர்கள் அல்லது மதிலற்ற குடியிருப்புகளைக் குறிக்கும்.
- source_word: נְטֹפָתִי
  choice: நெத்தோபாத்தியர்
  rationale: இது நெத்தோபா என்ற இடப்பெயர் மட்டுமல்ல, அந்த இடத்தோடு தொடர்புடைய மக்களைக் குறிக்கும் இன/இட அடைமொழி வடிவம்; எனவே ‘நெத்தோபாத்தியர்’ என மொழிபெயர்க்கப்பட்டுள்ளது.
