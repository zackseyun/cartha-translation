translation_notes:
  register: நவீன நிலையான தமிழில், பட்டியல் வசனத்துக்கேற்ற சுருக்கமானவும் கண்ணியமானவும் உள்ள நடை. பெயர்கள் தமிழ் வேதாகம வாசகர்களுக்கு பரிச்சயமான ஒலிபெயர்ப்பில் தரப்பட்டுள்ளன; மூலத்தில் வெளிப்படையாக இல்லாத கோட்பாட்டு விளக்கம் சேர்க்கப்படவில்லை.
