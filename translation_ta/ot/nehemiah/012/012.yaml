base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/012.yaml
  text: 'And in the days of Joiakim, there were priests, heads of the fathers’ houses: for Seraiah, Meraiah; for Jeremiah, Hananiah.'
translation:
  language: ta
  text: 'யோயாக்கீமின் நாட்களில், ஆசாரியர்களாகிய தந்தைவழிக் குடும்பத் தலைவர்கள் இருந்தனர்: செராயா வம்சத்துக்கு மெராயா; எரேமியா வம்சத்துக்கு அனனியா.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבִימֵי יוֹיָקִים
  choice: யோயாக்கீமின் நாட்களில்
  rationale: காலக் குறிப்பை இயல்பான நவீனத் தமிழில் நேரடியாகத் தருகிறது.
- source_word: כֹהֲנִים רָאשֵׁי הָאָבוֹת
  choice: தந்தைவழிக் குடும்பங்களின் தலைவர்களாக இருந்த ஆசாரியர்கள்
  rationale: אָבוֹת என்பது இங்கு தனிப்பட்ட தந்தையரை அல்ல, வம்ச அடிப்படையிலான குடும்பப் பிரிவுகளைக் குறிக்கிறது; ஆசாரியர்களே அவற்றின் தலைவர்கள் என்ற எபிரெய அமைப்பைத் தெளிவாகக் காக்கிறது.
- source_word: לִשְׂרָיָה מְרָיָה
  choice: செராயாவின் குடும்பத்துக்கு மெராயா
  rationale: לְ முன்னொட்டு பிரதிநிதித்துவம் அல்லது தொடர்பைக் குறிக்கிறது; சூழலில் மெராயா செராயாவின் ஆசாரியக் குடும்பப் பிரிவின் தலைவராக இருப்பதை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: לְיִרְמְיָה חֲנַנְיָה
  choice: எரேமியாவின் குடும்பத்துக்கு அனனியா
  rationale: இணையான பட்டியல் அமைப்பைப் பாதுகாத்து, எரேமியாவின் குடும்பப் பிரிவுடன் அனனியாவின் தொடர்பைத் தருகிறது.
