- from: சல்லாயின் குடும்பத்துக்கு[a] கல்லாய்; ஆமோக்கின் குடும்பத்துக்கு, ஏபேர்[b].
  to: சல்லாய்க்கு[a] கல்லாய்; ஆமோக்குக்கு, ஏபேர்[b].
  rationale: The revision removes the interpretive addition “குடும்பம்” while preserving the Hebrew לְ through the natural Tamil dative form “-க்கு.” It maintains the brief roster register, retains appropriate transliterations, and aligns the alternative-name footnote with the English audit trail.
