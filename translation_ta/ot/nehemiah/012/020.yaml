translation:
  language: ta
  text: சல்லாய்க்கு[a] கல்லாய்; ஆமோக்குக்கு, ஏபேர்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சல்லாயின், கல்லாய்; ஆமோக்கின், ஏபேர்.” இப்பட்டியலில் எபிரெய முன்னொட்டு לְ பெயரிடப்பட்ட ஆசாரியக் குழுவுடனான தொடர்பைக் குறிக்கிறது; இதை “-க்கு,” “-இன்,” அல்லது “-ஐச் சேர்ந்த” என மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: இந்தப் பெயர் சில மொழிபெயர்ப்பு மரபுகளில் “ஹேபேர்” என வழங்கப்படுகிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: לְ/סַלַּי
  choice: சல்லாயின் குடும்பத்துக்கு
  rationale: இந்த ஆசாரியக் குடும்பப் பட்டியலில் לְ என்பது சல்லாய் என்ற பெயருடைய ஆசாரியக் குடும்பத்துடனான தொடர்பைக் குறிக்கிறது. தமிழில் தனியாக ‘சல்லாய்க்கு’ என்று கூறுவதைவிட ‘சல்லாயின் குடும்பத்துக்கு’ என்பது பட்டியலின் பொருளை இயல்பாக வெளிப்படுத்துகிறது; அடிச்சொல்லின் மாற்று சாத்தியங்கள் அடிக்குறிப்பில் பாதுகாக்கப்படுகின்றன.
- source_word: קַלָּי
  choice: கல்லாய்
  rationale: எபிரெயப் பெயரின் மெய்யெழுத்து இரட்டிப்பையும் இறுதி -ai ஒலியையும் பிரதிபலிக்கும் தமிழ் ஒலிபெயர்ப்பு.
- source_word: לְ/עָמוֹק
  choice: ஆமோக்கின் குடும்பத்துக்கு
  rationale: முதல் சொற்றொடரைப் போலவே, לְ இங்கு ஆமோக் என்ற ஆசாரியக் குடும்பத்துடனான தொடர்பைக் குறிக்கிறது. பட்டியலின் சுருக்கமான நடையைப் பேணியபடி தமிழில் பொருளைத் தெளிவாக்குகிறது.
- source_word: עֵבֶר
  choice: ஏபேர்
  rationale: எபிரெய עֵבֶר என்ற பெயரின் உயிரொலிகளையும் மெய்யெழுத்துகளையும் நெருக்கமாகப் பிரதிபலிக்கும் தமிழ் ஒலிபெயர்ப்பு; சில மரபுகளில் காணப்படும் ‘எபேர்/ஹேபேர்’ வடிவங்களைவிட மூல உச்சரிப்புக்கு நெருக்கமானது.
