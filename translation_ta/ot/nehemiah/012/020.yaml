translation_notes:
  register: சுருக்கமான பெயர்ப்பட்டியல் நடையைப் பேணும் நவீன, கண்ணியமான தமிழ். மூலத்தில் வெளிப்படையாக இல்லாத ‘குடும்பம்’ என்பது לְ குறிக்கும் ஆசாரிய வீட்டுத் தொடர்பை தமிழில் இயல்பாகத் தெளிவாக்குவதற்காகச் சேர்க்கப்பட்டுள்ளது; அதன் சொற்படியான மாற்று அடிக்குறிப்பில் தரப்பட்டுள்ளது.
