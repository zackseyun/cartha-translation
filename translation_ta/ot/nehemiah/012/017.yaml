base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/017.yaml
  text: for Abijah[a], Zichri; for Miniamin, for Moadiah, Piltai.
translation:
  language: ta
  text: அபியாவுக்கு சிக்ரி; மின்யாமீனுக்கு, மோவாதியாவுக்கு[a] பில்தாய்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: தொடர்புடைய சில உரைமரபுகளில் இதே பெயர் ‘மாதியா’ என்ற மாற்று எழுத்துவடிவத்தில் காணப்படுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: לַאֲבִיָּה
  choice: அபியாவுக்கு
  rationale: முன்னொட்டு ל இந்த ஆசாரியக் குடும்பங்களின் பட்டியலில் தொடர்பைக் குறிக்கிறது. சுருக்கமான எபிரெயப் பட்டியல் நடையைத் தக்கவைக்க ‘அபியாவுக்கு’ என்று மொழிபெயர்க்கப்பட்டது.
- source_word: זִכְרִי
  choice: சிக்ரி
  rationale: இது ஒரு நபரின் பெயர்; எபிரெய ஒலிப்பை அணுகும் வகையில் தமிழில் ஒலிபெயர்க்கப்பட்டது.
- source_word: לְמִנְיָמִין
  choice: மின்யாமினுக்கு
  rationale: ל குறிக்கும் தொடர்பையும் மூலத்தின் சுருக்கமான பட்டியல் அமைப்பையும் பாதுகாக்க இவ்வாறு தரப்பட்டது.
- source_word: לְמוֹעַדְיָה
  choice: மோவதியாவுக்கு
  rationale: WLC-யின் மெய்யெழுத்து வடிவம் மோவதியா என்ற பெயரை ஆதரிக்கிறது; தொடர்புடைய வேறு எழுத்துவடிவம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: פִּלְטָי
  choice: பில்தாய்
  rationale: இது ஒரு நபரின் பெயர்; மொழிபெயர்க்காமல் தமிழில் ஒலிபெயர்க்கப்பட்டது.
theological_decisions:
- issue: மின்யாமினுக்கும் மோவதியாவுக்கும் பில்தாய் எவ்வாறு தொடர்புபடுகிறார் என்பது மூலத்தின் சுருக்கமான பட்டியல் அமைப்பில் தெளிவாகக் கூறப்படவில்லை.
  choice: ‘மின்யாமினுக்கு, மோவதியாவுக்கு பில்தாய்’ என்று தனித்தனி ל முன்னொட்டுகளையும் இடைநிறுத்தத்தையும் தக்கவைத்தல்.
  alternative: ‘மின்யாமினுக்கும் மோவதியாவுக்கும் பில்தாய்’ என்று பில்தாயை இருவருக்கும் பொதுவான பிரதிநிதியாக வெளிப்படையாக இணைத்தல்.
  rationale: மூலத்தில் உள்ள இலக்கணச் சுருக்கத்தையும் உண்மையான தொடர்புக் குழப்பத்தையும் விளக்கமாகத் தீர்த்துவிடாமல் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பெயர்ப்பட்டியலுக்குரிய சுருக்கமான மற்றும் கண்ணியமான நடை பயன்படுத்தப்பட்டது. எபிரெயில் மீண்டும் வரும் ל தொடர்புச் சுட்டு ‘-க்கு’ எனப் பாதுகாக்கப்பட்டது; இயல்பான தமிழுக்காக வேற்றுமை உருபு பெயர்களோடு இணைக்கப்பட்டது.
