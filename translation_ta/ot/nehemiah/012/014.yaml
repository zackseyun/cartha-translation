translation:
  language: ta
  text: மல்லூகியின் சார்பில்[a] யோனத்தான்; செபனியாவின் சார்பில் யோசேப்பு.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ל முன்னொட்டு கொண்ட பெயர்கள் பிரதிநிதித்துவத்தைவிட வம்ச அல்லது குடும்ப உறவைக் குறிப்பதாகக் கொண்டால், “மல்லூகியைச் சேர்ந்தவர் ... செபனியாவைச் சேர்ந்தவர்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ל/מלוכי
  choice: மல்லூகியின் சார்பில்
  rationale: இந்த ஆசாரியக் குடும்பப் பட்டியலின் அமைப்பில் ל முன்னொட்டு ஒரு குடும்பம் அல்லது தந்தைவழி வீட்டின் பிரதிநிதியைக் குறிக்கிறது. ஆகவே, இயல்பான தமிழில் ‘மல்லூகியின் சார்பில்’ என்று மொழிபெயர்க்கப்பட்டது. מלוכי என்ற பெயர் எபிரெய உயிர்க்குறிகளின்படி ‘மல்லூகி’ என ஒலிபெயர்க்கப்பட்டது.
- source_word: יונתן
  choice: யோனத்தான்
  rationale: יוֹנָתָן என்ற எபிரெயப் பெயரின் தமிழில் அறியப்பட்ட, மூல உச்சரிப்புக்கு நெருக்கமான வடிவம்.
- source_word: ל/שבניה
  choice: செபனியாவின் சார்பில்
  rationale: முதல் சொற்றொடரைப் போலவே, ל முன்னொட்டு பட்டியலில் பிரதிநிதித்துவ உறவைக் குறிக்கிறது; எனவே ‘செபனியாவின் சார்பில்’ என வழங்கப்பட்டது.
- source_word: יוסף
  choice: யோசேப்பு
  rationale: יוֹסֵף என்ற பெயரின் வழக்கமான தமிழ் வேதாகம வடிவம் பயன்படுத்தப்பட்டது.
