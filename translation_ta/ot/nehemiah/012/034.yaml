translation:
  language: ta
  text: யூதா[a], பென்யமீன், செமாயா, எரேமியா.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: வேறொரு சூழலில் יְהוּדָה என்பதைப் புவியியல் பெயராகக் கொண்டு ‘யூதேயா’ என்றும் மொழிபெயர்க்கலாம்; ஆனால் இங்குள்ள பெயர்ப்பட்டியலில் தனிநபர் அல்லது கோத்திரப் பெயரான ‘யூதா’ என்பதே பொருத்தமானது.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוּדָה
  choice: யூதா
  rationale: இது பங்கேற்போரின் பெயர்ப்பட்டியல் என்பதால், புவியியல் பெயரான ‘யூதேயா’ என்பதைவிட தனிநபர் அல்லது கோத்திரப் பெயரான ‘யூதா’ சூழலுக்கு நன்றாகப் பொருந்துகிறது.
- source_word: בִנְיָמִן
  choice: பென்யமீன்
  rationale: ஒருங்கிணைக்கப்பட்ட பெயர்ப்பட்டியலில் வரும் இயற்பெயர்; தமிழில் பரவலாக அறியப்படும் வேதாகமப் பெயர் வடிவம் பயன்படுத்தப்பட்டது.
- source_word: שְׁמַעְיָה
  choice: செமாயா
  rationale: தனிநபர் இயற்பெயர் என்பதால் பொருள் மொழிபெயர்ப்பு செய்யாமல், தமிழில் இயல்பாக ஒலிபெயர்க்கப்பட்டது.
- source_word: יִרְמְיָה
  choice: எரேமியா
  rationale: தனிநபர் இயற்பெயர்; வாசகர்களுக்குப் பரிச்சயமான நிலையான தமிழ் வேதாகமப் பெயர் வடிவம் தேர்ந்தெடுக்கப்பட்டது.
- source_word: וְ / וּ
  choice: பட்டியல் நிறுத்தற்குறிகள்
  rationale: எபிரெயத்தில் ஒவ்வொரு பெயரையும் இணைக்கும் வாவ் உள்ளது. இயல்பான நவீன தமிழில் எளிய பெயர்ப்பட்டியலைக் காற்புள்ளிகளால் அமைப்பது அதே தொடர்பைத் தெளிவாகக் காட்டுகிறது.
theological_decisions: []
translation_notes:
  register: நவீன பொதுத்தமிழில் சுருக்கமான பெயர்ப்பட்டியலாக அமைக்கப்பட்டுள்ளது. இயற்பெயர்களுக்கு வாசகர்களிடையே அறியப்பட்ட தமிழ் வேதாகம வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன; எபிரெய இணைப்புச் சொற்களின் தொடர்ச்சி தமிழில் இயல்பான நிறுத்தற்குறிகளால் வெளிப்படுத்தப்பட்டுள்ளது.
