  source_fidelity: மூல எபிரெயத்தின் பெயர்ப்பட்டியலும், பின்னர் மத்தனியாவை ஒருமையில் தனித்துக் குறிப்பிட்டு அவரது சகோதரர்களோடு நன்றிச் செலுத்துதல்கள்மேல் பொறுப்புடையவராகக் கூறுவதும் துல்லியமாகப் பாதுகாக்கப்பட்டுள்ளன. הֻיְּדוֹת என்பதன் வழிபாட்டு-இசைச் சூழலுக்கேற்ற பொருள் ‘நன்றிப் பாடல்கள்’ என இயல்பாகத் தரப்பட்டுள்ளது.
