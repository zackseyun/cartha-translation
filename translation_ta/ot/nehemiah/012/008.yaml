source:
  edition: WLC
  text: וְ/הַ/לְוִיִּ֗ם יֵשׁ֧וּעַ בִּנּ֛וּי קַדְמִיאֵ֥ל שֵׁרֵבְיָ֖ה יְהוּדָ֣ה מַתַּנְיָ֑ה עַֽל הֻיְּד֖וֹת ה֥וּא וְ/אֶחָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/008.yaml
  text: And the Levites were Jeshua[a], Binnui, Kadmiel, Sherebiah, Judah, and Mattaniah, who, with his brothers[b], was over the thanksgiving songs.
translation:
  language: ta
  text: 'லேவியர்கள்: யேசுவா, பின்னூயி, கத்மியேல், செரெபியா, யூதா, மத்தனியா. மத்தனியா தன் சகோதரர்களுடன் நன்றிப் பாடல்களுக்கு[b] பொறுப்பாக இருந்தார்[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அவரும் அவருடைய சகோதரர்களும் நன்றிச் செலுத்துதல்களுக்குப் பொறுப்பாக இருந்தார்கள்.’ எபிரெயச் சொற்றொடரை இன்னும் கூட்டுப்பொருளில் புரிந்துகொள்ள முடியும்; எனினும் ஒருமைச் சுட்டுப்பெயர் மிக இயல்பாக மத்தனியாவையே குறிக்கிறது.
    reason: alternative_reading
  - marker: b
    text: நேர்ச்சொல்லாக, ‘நன்றிச் செலுத்துதல்கள்.’ வழிபாட்டுச் சூழலில் இது நன்றி செலுத்திப் பாடப்பட்ட பாடல்களையோ நன்றித் துதிகளையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַלְוִיִּם
  choice: 'லேவியர்கள்:'
  rationale: எபிரெய மொழியில் வினைச்சொல் இல்லாமல் அடுத்த பட்டியல் அறிமுகப்படுத்தப்படுகிறது. தமிழிலும் முக்காற்புள்ளியுடன் பட்டியலை இயல்பாக அறிமுகப்படுத்த முடிகிறது; தேவையில்லாமல் ‘இருந்தார்கள்’ சேர்க்கப்படவில்லை.
- source_word: יֵשׁוּעַ בִּנּוּי קַדְמִיאֵל שֵׁרֵבְיָה יְהוּדָה מַתַּנְיָה
  choice: யேசுவா, பின்னூயி, கத்மியேல், செரெபியா, யூதா, மத்தனியா
  rationale: ஆள்பெயர்கள் அவற்றின் எபிரெய ஒலிவடிவங்களுக்கு நெருக்கமாகத் தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளன.
- source_word: עַל
  choice: பொறுப்பாக
  rationale: இச்சூழலில் இம்முன்னிடைச்சொல் ஒரு வழிபாட்டுப் பணியின்மேல் இருந்த மேற்பார்வை அல்லது பொறுப்பைக் குறிக்கிறது. ‘பொறுப்பாக’ என்பது நவீன தமிழில் தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: הֻיְּדוֹת
  choice: நன்றிப் பாடல்கள்
  rationale: இப்பன்மைச் சொல் நன்றி செலுத்தும் செயல்களையோ புகழுரைகளையோ குறிக்கலாம்; லேவியரின் வழிபாட்டுப் பணி என்ற சூழலில் பாடல்களாகிய நன்றித் துதிகள் என்பதே இயல்பான பொருள். உள்ளார்ந்த பொருள் வரம்பை அடிக்குறிப்பு பதிவு செய்கிறது.
- source_word: הוּא וְאֶחָיו
  choice: மத்தனியா தன் சகோதரர்களுடன் ... இருந்தார்
  rationale: ஒருமைச் சுட்டுப்பெயரான הוּא, பட்டியலில் கடைசியாக வரும் மத்தனியாவையே மிக இயல்பாகச் சுட்டுகிறது. ‘தன் சகோதரர்களுடன்’ என்பது அவரோடு இணைந்து பணியாற்றியவர்களையும் உள்ளடக்குகிறது.
theological_decisions:
- issue: ஒருமைச் சுட்டுப்பெயர் הוּא யாரைக் குறிக்கிறது
  choice: அது பட்டியலின் கடைசிப் பெயரான மத்தனியாவைக் குறிப்பதாக முதன்மை உரையில் கொள்ளப்பட்டுள்ளது.
  alternative: பெயரிடப்பட்ட லேவியர்களை ஒரு குழுவாகத் தளர்வான முறையில் குறிப்பதாகவும் சொற்றொடரைப் புரிந்துகொள்ளலாம்.
  rationale: பன்மைப் பட்டியலுக்குப் பின் வரும் வெளிப்படையான ஒருமைச் சுட்டுப்பெயர் மத்தனியாவைத் தனித்துக் காட்டுவதே இலக்கணப்படி இயல்பான வாசிப்பு. எனினும் குழுவைக் குறிக்கும் மாற்றுப் புரிதல் முற்றிலும் நீக்கப்படாமல் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. எபிரெயப் பட்டியலின் சுருக்கம் காக்கப்பட்டுள்ளது; பின்னுள்ள பொறுப்புக் கூற்று தமிழில் தெளிவாகப் பிரிக்கப்பட்டுள்ளது. ‘அவர்’ மரியாதை ஒருமை மத்தனியாவைக் குறிக்கிறது; ‘சகோதரர்கள்’ என்ற ஆண்பால் உறவுச்சொல் மூலத்தின் வடிவத்தைப் பாதுகாக்கிறது.
