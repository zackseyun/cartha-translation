translation:
  language: ta
  text: அதாயா குடும்பத்தின் சார்பில்[a] சகரியா; கின்னெத்தோன் குடும்பத்தின் சார்பில் மெசுல்லாம்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இந்தப் பட்டியலில் குடும்பப் பெயர்களுக்கு முன் எபிரெய மொழியின் ל (‘க்கு/உடைய/சார்பில்’) என்ற முன்னொட்டு வருகிறது. சகரியா அதாயா குடும்பத்தையும், மெசுல்லாம் கின்னெத்தோன் குடும்பத்தையும் பிரதிநிதித்துவப்படுத்தினர் என்ற பொருளைத் தெரிவிக்க இங்கு ‘குடும்பத்தின் சார்பில்’ என்று மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ל/עדיא
  choice: இத்தோ குடும்பத்தின் சார்பில்
  rationale: இந்த ஆசாரியக் குடும்பப் பட்டியலில் முன்னொட்டு ל என்பது அடுத்துவரும் நபர் அந்தக் குடும்பத்தைச் சார்ந்தவர் அல்லது அதன் பிரதிநிதி என்பதைக் குறிக்கிறது. வாசிப்புக்கும் பட்டியலின் சூழலுக்கும் ஏற்றபடி ‘குடும்பத்தின் சார்பில்’ என மொழிபெயர்க்கப்பட்டது; עדיא இங்கு ‘இத்தோ’ என்ற பெயராக ஒலிபெயர்க்கப்பட்டது.
- source_word: זְכַרְיָה
  choice: சகரியா
  rationale: இத்தோ குடும்பத்துடன் இணைக்கப்பட்ட நபரின் பெயர்; தமிழில் வழக்கிலுள்ள வேதாகமப் பெயர் வடிவம் பயன்படுத்தப்பட்டது.
- source_word: לְ/גִנְּתוֹן
  choice: கின்னெத்தோன் குடும்பத்தின் சார்பில்
  rationale: முதல் பெயருக்கு முன் வரும் ל போலவே, இங்கும் குடும்பத் தொடர்பையோ பிரதிநிதித்துவத்தையோ குறிக்கிறது. גִנְּתוֹן என்பது ‘கின்னெத்தோன்’ என ஒலிபெயர்க்கப்பட்டது.
- source_word: מְשֻׁלָּם
  choice: மெசுல்லாம்
  rationale: கின்னெத்தோன் குடும்பத்துடன் இணைக்கப்பட்ட நபரின் பெயர்; எபிரெய ஒலிக்கு நெருக்கமான, தமிழில் வாசிக்க இயல்பான வடிவம் தேர்ந்தெடுக்கப்பட்டது.
