  text: וַֽ/תַּעֲמֹ֛דְנָה שְׁתֵּ֥י הַ/תּוֹדֹ֖ת בְּ/בֵ֣ית הָ/אֱלֹהִ֑ים וַ/אֲנִ֕י וַ/חֲצִ֥י הַ/סְּגָנִ֖ים עִמִּֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/040.yaml
  text: So the two thanksgiving choirs took their stand in the house of God[a], and I, and half of the officials with me,
translation:
  language: ta
  text: அப்போது நன்றிசெலுத்தும் இரு பாடகர் குழுக்களும் கடவுளின் இல்லத்தில் நிலைகொண்டன[a]; நானும் என்னுடன் இருந்த அதிகாரிகளில் பாதிப்பேரும் அங்கே நின்றோம்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரெயத்தில், சொல்லுக்கு சொல்: “இரண்டு நன்றிசெலுத்துதல்கள்.” இச்சூழலில் இது நன்றிசெலுத்தும் இரு குழுக்களை அல்லது பாடகர் குழுக்களைக் குறிக்கிறது.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּעֲמֹדְנָה
  choice: தங்கள் இடங்களில் நின்றன
  rationale: עמד என்பதன் 3ஆம் நபர் பெண்பால் பன்மை வடிவம் இரண்டு குழுக்களைக் குறிக்கிறது. சடங்கில் அவை தங்களுக்குரிய இடத்தை எடுத்துக்கொண்டன என்ற நுண்பொருளையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: שְׁתֵּי הַתּוֹדֹת
  choice: நன்றிசெலுத்தும் இரு பாடகர் குழுக்கள்
  rationale: சொல்லுக்கு நேரான பொருள் ‘இரண்டு நன்றிசெலுத்துதல்கள்.’ ஆனால் நெகேமியா 12-ன் சூழலில் நன்றிசெலுத்துவதற்காக ஊர்வலமாகச் சென்ற இரு ஒழுங்கமைந்த குழுக்களை ஆகுபெயராகக் குறிக்கிறது; பாடகர்கள் பற்றிய உடனடிச் சூழலைக் கருத்தில் கொண்டு இவ்வாறு மொழிபெயர்க்கப்பட்டது.
- source_word: בְּבֵית הָאֱלֹהִים
  choice: கடவுளின் இல்லத்தில்
  rationale: בית האלהים ஆலயத்தைக் குறித்தாலும், எபிரெய மொழிமரபான ‘கடவுளின் இல்லம்’ என்பதைத் தக்கவைத்து, בְּ என்பதன் இடப்பொருளை ‘-இல்’ என வழங்குகிறது.
- source_word: וַאֲנִי
  choice: நானும்
  rationale: இணைப்பிடைச்சொல்லையும் தன்மைப் பெயரையும் இயல்பான தமிழில் ஒருங்கிணைத்து, நெகேமியாவை அடுத்துவரும் அதிகாரிகளுடன் இணைக்கிறது.
- source_word: וַחֲצִי הַסְּגָנִים
  choice: அதிகாரிகளில் பாதிப்பேர்
  rationale: סגנים என்பது ஆட்சிப் பொறுப்பு அல்லது நிர்வாகப் பொறுப்பு வகித்தவர்களைக் குறிக்கும் பரந்த சொல். ‘அதிகாரிகள்’ என்பது தெளிவான நவீனத் தமிழ்; ‘பாதிப்பேர்’ என்பது மனிதர்களின் எண்ணிக்கையை இயல்பாகக் காட்டுகிறது.
- source_word: עִמִּי
  choice: என்னுடன்
  rationale: உடனிருத்தலைக் குறிக்கும் முன்னிடைச்சொல்லையும் முதலாம் நபர் ஒருமை பின்னொட்டையும் நேராகவும் இயல்பாகவும் வழங்குகிறது.
