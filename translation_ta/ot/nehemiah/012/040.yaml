revisions:
- from: அப்போது நன்றிசெலுத்தும் இரு பாடகர் குழுக்களும் கடவுளின் இல்லத்தில் தங்கள் இடங்களில் நின்றன[a]. நானும், அதிகாரிகளில் பாதிப்பேரும் என்னுடன் நின்றோம்.
  to: அப்போது நன்றிசெலுத்தும் இரு பாடகர் குழுக்களும் கடவுளின் இல்லத்தில் நிலைகொண்டன[a]; நானும் என்னுடன் இருந்த அதிகாரிகளில் பாதிப்பேரும் அங்கே நின்றோம்.
  rationale: The revision retains the contextual rendering “பாடகர் குழுக்கள்,” supported by the footnote’s literal alternative, while removing an unnecessary possessive addition. It also recasts the coordinated final clause so that modern Tamil clearly conveys that half of the officials were with Nehemiah and that they shared the action of standing in the house of God.
