translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. ‘கடவுளின் இல்லம்’ என்ற எபிரெய மரபுத்தொடர் தக்கவைக்கப்பட்டது; வசனத்தின் பட்டியல் போன்ற எபிரெய அமைப்பு தமிழில் முழுமையான வாக்கியமாக இயல்புபடுத்தப்பட்டது.
