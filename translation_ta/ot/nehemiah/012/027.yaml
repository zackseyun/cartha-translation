  text: וּ/בַ/חֲנֻכַּ֞ת חוֹמַ֣ת יְרוּשָׁלִַ֗ם בִּקְשׁ֤וּ אֶת הַ/לְוִיִּם֙ מִ/כָּל מְק֣וֹמֹתָ֔/ם לַ/הֲבִיאָ֖/ם לִֽ/ירוּשָׁלִָ֑ם לַ/עֲשֹׂ֨ת חֲנֻכָּ֤ה וְ/שִׂמְחָה֙ וּ/בְ/תוֹד֣וֹת וּ/בְ/שִׁ֔יר מְצִלְתַּ֖יִם נְבָלִ֥ים וּ/בְ/כִנֹּרֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/027.yaml
  text: At the dedication of the wall of Jerusalem[a], they sought the Levites from all their places, to bring them to Jerusalem to celebrate the dedication with gladness, with thanksgivings, and with song, with cymbals, harps[c][b], and lyres.
translation:
  language: ta
  text: எருசலேமின் மதில் அர்ப்பணிப்பின்போது, லேவியர்களை அவர்கள் இருந்த எல்லா இடங்களிலிருந்தும் எருசலேமுக்கு அழைத்துவரவும், மகிழ்ச்சியுடனும் நன்றிசெலுத்துதல்களுடனும் பாடலுடனும், கைத்தாளங்கள், நரம்பிசைக் கருவிகள்[b], யாழ்கள் ஆகியவற்றின் இசையுடனும் அர்ப்பணிப்பைக் கொண்டாடவும் அவர்களைத் தேடினார்கள்[a][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “தேடினார்கள்” என்பதற்கு “தேடிக் கண்டுபிடித்தார்கள்” என்றும், சூழலின்படி “வரவழைத்தார்கள்” என்றும் பொருள் கொள்ளலாம். எபிரெய வினைச்சொல்லின் அடிப்படைப் பொருள் “தேடினார்கள்” என்பதே.
    reason: lexical_alternative
  - marker: b
    text: இங்கு எபிரெய மொழியில் இரண்டு வேறுபட்ட நரம்பிசைக் கருவிகள் குறிப்பிடப்படுகின்றன. அவை துல்லியமாக எத்தகைய கருவிகள் என்பது உறுதியாகத் தெரியவில்லை; அவற்றில் இரண்டாவது இங்கு “யாழ்கள்” என்று மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: cultural_note
  - marker: c
    text: “அர்ப்பணிப்பைக் கொண்டாடவும்” என்பது எபிரெய மொழியில் சொற்பொருளாக “ஓர் அர்ப்பணிப்பைச் செய்வதற்காக” என்று உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבַחֲנֻכַּת חוֹמַת יְרוּשָׁלִַם
  choice: எருசலேமின் மதிலை அர்ப்பணித்தபோது
  rationale: ב prefixed to the dedication noun establishes the temporal setting. Tamil expresses the construct naturally with the possessive phrase “எருசலேமின் மதில்”; the verbal form “அர்ப்பணித்தபோது” conveys the dedication event idiomatically.
- source_word: בִּקְשׁוּ אֶת הַלְוִיִּם
  choice: லேவியர்களை ... தேடினார்கள்
  rationale: בקשׁ fundamentally means “seek/look for.” “தேடினார்கள்” preserves that lexical force rather than resolving it as an official summons.
- source_word: מִכָּל מְקוֹמֹתָם
  choice: அவர்கள் வாழ்ந்த எல்லா இடங்களிலிருந்தும்
  rationale: Literally “from all their places.” In this context the possessive refers to the places where the Levites resided; adding “வாழ்ந்த” makes the Tamil referent clear without narrowing it to settlements.
- source_word: לַהֲבִיאָם לִירוּשָׁלִָם
  choice: எருசலேமுக்கு அழைத்து வரும்படி
  rationale: The Hiphil infinitive of בוא is causative. “அழைத்து வர” naturally communicates bringing persons to Jerusalem.
- source_word: לַעֲשֹׂת חֲנֻכָּה
  choice: அர்ப்பணிப்பு விழாவைக் கொண்டாடுவதற்காக
  rationale: The Hebrew is literally “to do a dedication.” Modern Tamil requires an idiomatic event expression; “அர்ப்பணிப்பு விழாவைக் கொண்டாட” preserves the ceremonial sense.
- source_word: וְשִׂמְחָה
  choice: மகிழ்ச்சியோடும்
  rationale: שׂמחה denotes joy or gladness; the sociative Tamil ending fits the following ceremonial accompaniments.
- source_word: וּבְתוֹדוֹת
  choice: நன்றித் துதிகளோடும்
  rationale: תודות denotes plural thanksgivings or expressions of thanks. “நன்றித் துதிகள்” is natural in Tamil and does not identify them specifically as songs.
- source_word: וּבְשִׁיר
  choice: பாடலோடும்
  rationale: שׁיר denotes song or singing; singular collective “பாடல்” preserves the noun form and coordinates naturally.
- source_word: מְצִלְתַּיִם
  choice: கைத்தாளங்கள்
  rationale: This is the standard Tamil designation for paired cymbals in a biblical musical setting.
- source_word: נְבָלִים
  choice: நரம்பிசைக் கருவிகள்
  rationale: נבל is an ancient stringed instrument whose exact modern equivalent is uncertain. A descriptive rendering avoids falsely identifying it with a specific modern harp form while distinguishing it from כינור.
- source_word: וּבְכִנֹּרוֹת
  choice: யாழ்கள்
  rationale: כינור names another ancient stringed instrument, commonly approximated as lyre. “யாழ்” is a dignified and understandable Tamil approximation; the footnote preserves the uncertainty.
