translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் வழிபாட்டு நிகழ்வுக்கேற்ற கண்ணியமான நடையிலும் மொழிபெயர்க்கப்பட்டுள்ளது. நீண்ட எபிரெய வாக்கியம் தமிழில் தெளிவுக்காக இரண்டு வாக்கியங்களாகப் பிரிக்கப்பட்டது. “அவர்கள்” என்பது சூழலில் உள்ள எருசலேமின் தலைவர்களைக் குறிக்கிறது; மூலத்தில் அவர்கள் குறிப்பாக அடையாளப்படுத்தப்படாததால் மொழிபெயர்ப்பிலும் அப்படியே விடப்பட்டுள்ளது. எல்லா [a]–[c] குறிப்பான்களும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
