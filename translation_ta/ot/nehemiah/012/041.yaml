  text: וְ/הַ/כֹּהֲנִ֡ים אֶלְיָקִ֡ים מַעֲשֵׂיָ֡ה מִ֠נְיָמִין מִיכָיָ֧ה אֶלְיוֹעֵינַ֛י זְכַרְיָ֥ה חֲנַנְיָ֖ה בַּ/חֲצֹצְרֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/041.yaml
  text: 'and the priests: Eliakim[a], Maaseiah, Miniamin, Micaiah, Elioenai, Zechariah, and Hananiah, with trumpets.'
translation:
  language: ta
  text: 'ஆசாரியர்களும்: எலியாக்கீம், மாசெயா, மின்யாமீன், மிகாயா, எலியோயேனாய், சகரியா, ஹனனியா ஆகியோர் எக்காளங்களுடன்[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘எக்காளங்களோடு.’ எபிரெயச் சொற்றொடர் இந்த ஆசாரியர்கள் எக்காளங்களுடன் இருந்ததையோ அல்லது அவற்றுக்குப் பொறுப்பாக நியமிக்கப்பட்டிருந்ததையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/הַ/כֹּהֲנִים
  choice: ஆசாரியர்களாகிய
  rationale: முந்தைய வசனத்தின் ஊர்வலப் பட்டியலுடன் வாவ் இணைப்பைத் தமிழில் இயல்பான வாக்கியத் தொடர்ச்சியால் வெளிப்படுத்தி, הַכֹּהֲנִים என்பதற்கு வழக்கமான ‘ஆசாரியர்கள்’ பயன்படுத்தப்பட்டது.
- source_word: אֶלְיָקִים
  choice: எலியாக்கீம்
  rationale: எபிரெய தனிப்பெயரின் ஒலிப்பை நவீனத் தமிழில் தெளிவாக எழுத்துப்பெயர்த்த வடிவம்.
- source_word: מַעֲשֵׂיָה
  choice: மாசெயா
  rationale: எபிரெய தனிப்பெயரின் மெய்-உயிர் அமைப்பைத் தமிழில் இயல்பாகப் பிரதிபலிக்கும் எழுத்துப்பெயர்ப்பு.
- source_word: מִנְיָמִין
  choice: மின்யாமீன்
  rationale: இவ்வசனத்தின் எபிரெய மசோரா வடிவத்திலுள்ள ny ஒலித்தொடரைப் பாதுகாக்கும் எழுத்துப்பெயர்ப்பு.
- source_word: מִיכָיָה
  choice: மிகாயா
  rationale: எபிரெய பெயரின் ஒலியமைப்பைத் தமிழில் நேரடியாகப் பிரதிபலிக்கிறது.
- source_word: אֶלְיוֹעֵינַי
  choice: எலியோவேனாய்
  rationale: எபிரெய தனிப்பெயரின் ஒலிப்பிற்கு நெருக்கமான, தமிழில் வாசிக்கத்தக்க எழுத்துப்பெயர்ப்பு.
- source_word: זְכַרְיָה
  choice: சகரியா
  rationale: தமிழ் வேதாகம வழக்கில் பரிச்சயமானதும் மூலப் பெயரை அடையாளப்படுத்துவதுமான வடிவம்.
- source_word: חֲנַנְיָה
  choice: அனனியா
  rationale: தொடக்க ח ஒலியைத் தமிழ் வாசிப்பு மரபில் இயல்பான ‘அ’ மூலம் வழங்கும் பரிச்சயமான பெயர்வடிவம்.
- source_word: בַּ/חֲצֹצְרֽוֹת
  choice: எக்காளங்களுடன்
  rationale: בְּ முன்னிடைச்சொல் இங்கு உடனிருப்பு அல்லது இசைக்கருவி சார்ந்த பங்கேற்பைக் குறிக்கலாம்; חֲצֹצְרוֹת என்பது அர்ப்பணிப்பு ஊர்வலத்தில் பயன்படுத்தப்பட்ட உலோக எக்காளங்கள்.
