translation_notes:
  register: நவீன நிலையான தமிழில், வழிபாட்டு நிகழ்வுக்கேற்ற கண்ணியமான நடையில் பெயர்ப்பட்டியல் வழங்கப்பட்டுள்ளது. மூலத்தில் முழுமையான வினைச்சொல் இல்லாவிட்டாலும், முந்தைய வசனத்திலிருந்து தொடரும் ஊர்வலச் சூழலைத் தமிழில் இயல்பாக்க ‘சென்றார்கள்’ சேர்க்கப்பட்டுள்ளது; எக்காளங்களை அவர்கள் வாசித்தார்களா அல்லது அவற்றுடன் சென்றார்களா என்ற மூலத்தின் சுருக்கமான தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
