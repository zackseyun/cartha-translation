source:
  edition: WLC
  text: וְ/יֵשׁ֖וּעַ הוֹלִ֣יד אֶת יֽוֹיָקִ֑ים וְ/יֽוֹיָקִים֙ הוֹלִ֣יד אֶת אֶלְיָשִׁ֔יב וְ/אֶלְיָשִׁ֖יב אֶת יוֹיָדָֽע־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/010.yaml
  text: Jeshua fathered Joiakim[a], and Joiakim fathered Eliashib[b], and Eliashib fathered Joiada.
translation:
  language: ta
  text: யேசுவா யோயாக்கீமைப் பெற்றான்[a]; யோயாக்கீம் எலியாசிபைப் பெற்றான்; எலியாசிப் யோயாதாவைப் பெற்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய வம்சவரிசை வாய்பாடு சொல்லுக்குச் சொல் ‘யேசுவா யோயாக்கீமைப் பிறக்கச் செய்தான்’ என்பதாகும்; ‘பெற்றான்’ என்பது அதன் இயல்பான தமிழ்ப் பொருள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵשׁוּעַ
  choice: யேசுவா
  rationale: எபிரெயத் தனிப்பெயரின் இச்சூழலுக்குரிய வடிவத்தைத் தமிழில் ஒலிபெயர்க்கிறது; நூனின் மகன் யோசுவாவிலிருந்து இந்நபரை வேறுபடுத்தவும் உதவுகிறது.
- source_word: הוֹלִיד
  choice: பெற்றான்
  rationale: ילד என்பதன் ஹிஃபில் வம்சவரிசை வாய்பாட்டில் ‘பிறக்கச் செய்தான்’, அதாவது ‘தந்தையானான்/பெற்றான்’ என்று பொருள்படும். நவீன தமிழில் சுருக்கமாகவும் இயல்பாகவும் ஆண் வம்சத் தொடர்பைக் காட்ட ‘பெற்றான்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: אֶת
  choice: '[தனியாக மொழிபெயர்க்கப்படவில்லை]'
  rationale: இது நேரடிச் செயப்படுபொருளைக் குறிக்கும் இலக்கணக் குறியீடு; தமிழில் இரண்டாம் வேற்றுமை உருபான ‘ஐ’ மூலம் தேவையான இடங்களில் வெளிப்படுகிறது.
- source_word: יוֹיָקִים
  choice: யோயாக்கீம்
  rationale: எபிரெய மூலத்தில் உள்ள பெயர் வடிவத்தைத் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: אֶלְיָשִׁיב
  choice: எலியாசிப்
  rationale: எபிரெயத் தனிப்பெயரைத் தமிழின் வழக்கமான வேதாகம ஒலியமைப்புக்கு ஏற்றவாறு ஒலிபெயர்க்கிறது.
- source_word: יוֹיָדָע
  choice: யோயாதா
  rationale: மூலத்தில் காணப்படும் சுருக்கமான எபிரெயப் பெயர் வடிவத்தை நேரடியாகத் தமிழில் ஒலிபெயர்க்கிறது.
