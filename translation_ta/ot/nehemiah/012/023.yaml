base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/023.yaml
  text: The sons of Levi[a], heads of fathers’ houses, were recorded in the book of the chronicles[b], up to the days of Yohanan son of Eliashib.
translation:
  language: ta
  text: லேவியின் மக்களான தந்தைவழிக் குடும்பத் தலைவர்கள், எலியாசீபின் மகன் யோஹானானின்[a] நாட்கள்வரை நாளாகமப் பதிவேட்டில்[b] பதிவு செய்யப்பட்டிருந்தனர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இந்த எபிரெயப் பெயரை “யோகனான்” என்றும் ஒலிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “நாளாகமப் பதிவேடு” என்பது அதிகாரப்பூர்வ வரலாற்றுப் பதிவு அல்லது ஆண்டுக் குறிப்பேட்டைக் குறிக்கிறது; இது வேதாகமத்திலுள்ள நாளாகமப் புத்தகங்களையே அவசியம் குறிக்காது.
    reason: cultural_note
lexical_decisions:
- source_word: בְּנֵי לֵוִי
  choice: லேவியின் மக்கள்
  rationale: எபிரெயக் கட்டமைப்பான ‘லேவியின் மகன்கள்/மக்கள்’ என்பதைக் காக்கிறது; இங்கு முழு லேவியரையும் பொதுவாகக் குறிப்பிடாமல், அடுத்து வருகிற குடும்பத் தலைவர்களைச் சுட்டுகிறது.
- source_word: רָאשֵׁי הָאָבוֹת
  choice: தந்தைவழிக் குடும்பத் தலைவர்கள்
  rationale: மூதாதையர் வழிவந்த குடும்ப அல்லது குலப் பிரிவுகளின் தலைவர்களைக் குறிக்கும் மரபுத்தொடரை, நவீனத் தமிழில் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: כְּתוּבִים
  choice: பெயர்கள் ... பதிவு செய்யப்பட்டிருந்தன
  rationale: எழுத்தில் பதியப்பட்ட நிர்வாகப் பதிவைச் சூழல் குறிக்கிறது. ‘பெயர்கள்’ என்பது எபிரெயில் வெளிப்படையாக இல்லாவிட்டாலும், பதிவு செய்யப்பட்டவர்கள் குடும்பத் தலைவர்கள் என்பதால் தமிழில் இயல்பாகப் பொருளை வெளிப்படுத்துகிறது.
- source_word: עַל סֵפֶר דִּבְרֵי הַיָּמִים
  choice: நாளாகமப் பதிவேட்டில்
  rationale: ‘நாட்களின் நிகழ்வுகள் அடங்கிய நூல்’ என்ற எபிரெயத் தொடரை அதிகாரப்பூர்வ வரலாற்றுப் பதிவு அல்லது ஆண்டுப் பதிவேடு என்ற சூழற்பொருளில் வழங்குகிறது; ‘பதிவேட்டில்’ என்பது עַל என்பதற்கான இயல்பான தமிழ் இடவியல் வடிவம்.
- source_word: וְעַד יְמֵי
  choice: காலம்வரை
  rationale: பதிவு தொடர்ந்த கால எல்லையைத் தெளிவாகவும் இயல்பாகவும் குறிக்கிறது.
- source_word: יֽוֹחָנָן
  choice: யோகனான்
  rationale: எபிரெயப் பெயரின் ஒலியைத் தமிழில் அணுக்கமாக வழங்கும் வடிவம்.
- source_word: בֶּן אֶלְיָשִׁיב
  choice: எலியாசீபின் மகன்
  rationale: தந்தை–மகன் உறவைக் குறிக்கும் எளிய எபிரெயக் கட்டமைப்பை நேரடியாகத் தமிழில் தருகிறது.
