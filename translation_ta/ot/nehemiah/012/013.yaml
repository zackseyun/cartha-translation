    text: அல்லது, “எஸ்றாவைச் சேர்ந்தவர் மெஷுல்லாம்; அமரியாவைச் சேர்ந்தவர் யெகோஹானான்.” எபிரெய முன்னிடைச்சொல்லை இவ்வாறு மொழிபெயர்க்கலாம்; இந்தப் பட்டியலில் அது ஒவ்வொரு ஆசாரியக் குடும்பத்திற்கும் உரிய தலைவரை அல்லது பிரதிநிதியைக் குறிப்பதாகத் தெரிகிறது.
