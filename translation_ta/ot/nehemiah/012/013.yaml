lexical_decisions:
- source_word: לְ/עֶזְרָא
  choice: எஸ்றாவுக்கு
  rationale: இந்த ஆசாரியக் குடும்பத் தலைவர்களின் பட்டியலில் முன்னொட்டு לְ, எஸ்றாவின் குடும்பத்தைச் சார்ந்த அல்லது அதன் சார்பில் இருந்த தலைவரைக் குறிக்கிறது. தமிழில் ‘எஸ்றாவுக்கு’ என்பது பட்டியலின் சுருக்கமான இணை அமைப்பைப் பாதுகாக்கிறது.
- source_word: מְשֻׁלָּם
  choice: மெசுல்லாம்
  rationale: எபிரெய தனிப்பெயரின் ஒலிவடிவத்தைத் தமிழில் இயல்பாக எழுத்துப்பெயர்த்தல்.
- source_word: לַ/אֲמַרְיָה
  choice: அமரியாவுக்கு
  rationale: முதல் தொடரைப் போலவே לַ இங்கு அமரியாவின் ஆசாரியக் குடும்பத்துடன் உள்ள தொடர்பையோ அதன் பிரதிநிதித்துவத்தையோ குறிக்கிறது.
- source_word: יְהוֹחָנָן
  choice: யெகோவானான்
  rationale: יְהוֹ־ என்ற முழுமையான எபிரெயப் பெயர் வடிவத்தைத் தெளிவாகப் பிரதிபலிக்கும் தமிழ் எழுத்துப்பெயர்ப்பு.
