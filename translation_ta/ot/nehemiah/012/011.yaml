lexical_decisions:
- source_word: וְ
  choice: '[தனியாக மொழிபெயர்க்கப்படவில்லை]'
  rationale: எபிரெய இணைப்பிடைச்சொல் முந்தைய வம்சவரிசையைத் தொடர்கிறது. தமிழில் வாக்கியத் தொடக்கத்தில் ‘மேலும்’ சேர்ப்பது இயல்பற்றதாக இருப்பதால், தொடர்ச்சி சூழலால் உணர்த்தப்படுகிறது.
- source_word: יוֹיָדָע
  choice: யோயாதா
  rationale: தனிப்பெயர் எபிரெய வடிவத்திற்கு அண்மையாகத் தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: הוֹלִיד
  choice: பெற்றான்
  rationale: வம்சவரிசையில் Hiphil வடிவம் ‘தந்தையானான்/பெற்றெடுத்தான்’ என்ற ஆண் வழிப் பிறப்புறவைக் குறிக்கிறது; ‘பெற்றான்’ சுருக்கமாகவும் இயல்பாகவும் உள்ளது.
- source_word: אֶת
  choice: '[மொழிபெயர்க்கப்படவில்லை]'
  rationale: இது எபிரெய நேரடிச் செயப்படுபொருள் குறியீடு; அதன் பணி தமிழ் வேற்றுமை உருபால் வெளிப்படுகிறது.
- source_word: יוֹנָתָן
  choice: யோனத்தான்
  rationale: WLC வாசகம் יוֹנָתָן என்பதால் ‘யோனத்தான்’ என ஒலிபெயர்க்கப்பட்டுள்ளது; மாற்று மரபிலுள்ள ‘யோகனான்’ அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: וְ
  choice: ;
  rationale: இரண்டாவது வம்சத் தகவலைத் தொடரும் இணைப்பு, தமிழில் அரைப்புள்ளியால் இயல்பாகவும் தெளிவாகவும் வெளிப்படுத்தப்படுகிறது.
- source_word: יַדּוּעַ
  choice: யத்துவா
  rationale: தனிப்பெயர் எபிரெய உச்சரிப்பிற்கு அண்மையாகத் தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளது.
