  text: Hoshaiah and half of the officials of Judah went behind them[a].
translation:
  language: ta
  text: அவர்களுக்குப் பின்னால் ஹோஷாயாவும் யூதாவின் அதிகாரிகளில் பாதிப் பேரும் சென்றார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்களுக்குப் பிறகு.” எபிரெயச் சொற்றொடர் வரிசையில் பின்தொடர்வதைக் குறிக்கலாம்; “பின்னால்” என்பது அணிவகுப்பில் அவர்கள் இருந்த இடத்தைத் தெளிவுபடுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: சென்றார்கள்
  rationale: הלך என்பதன் தொடர்கதை வடிவம் கடந்தகால இயக்கத்தைச் சொல்கிறது. எழுவாய் பலரை உள்ளடக்கியதால், இயல்பான தமிழில் மரியாதைப் பன்மையான ‘சென்றார்கள்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: אַחֲרֵיהֶם
  choice: அவர்களுக்குப் பின்னால்
  rationale: அணிவகுப்பில் மற்றவர்களைப் பின்தொடரும் இடத்தையும் வரிசையையும் இயல்பாகவும் தெளிவாகவும் காட்டுகிறது; ‘அவர்களுக்குப் பிறகு’ என்பதும் சாத்தியம்.
- source_word: הוֹשַׁעְיָה
  choice: ஓசாயா
  rationale: எபிரெய தனிப்பெயரின் ஒலியை நவீனத் தமிழில் இயல்பாக எழுத்துப்பெயர்த்த வடிவம்.
- source_word: וַחֲצִי
  choice: பாதிப் பேரும்
  rationale: חֲצִי என்பது ‘பாதி’ என்று பொருள். மனிதர்களைக் குறிக்கும் குழுவோடு தமிழில் ‘பாதிப் பேர்’ என்பது தெளிவாகவும் இயல்பாகவும் உள்ளது; וְ இணைப்பை ‘-உம்’ வெளிப்படுத்துகிறது.
- source_word: שָׂרֵי
  choice: அதிகாரிகள்
  rationale: שַׂר என்பது தலைவர்கள், பிரபுக்கள் அல்லது அதிகாரிகளைக் குறிக்கலாம். இங்குள்ள நிர்வாக மற்றும் சடங்கு சூழலில் அரச குமாரர்கள் என்ற தவறான எண்ணத்தைத் தவிர்த்து ‘அதிகாரிகள்’ பொருத்தமாக உள்ளது.
- source_word: יְהוּדָה
  choice: யூதா
  rationale: இடம் மற்றும் கோத்திரப் பெயருக்கான நிலையான தமிழ் வடிவம்.
