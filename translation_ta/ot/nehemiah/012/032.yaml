translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. அணிவகுப்பு வரிசையைத் தெளிவாக்கியபோதும், மூலத்தின் ‘பின்னால்/பிறகு’ என்ற பொருள் விரிவை அடிக்குறிப்பில் பாதுகாக்கிறது.
