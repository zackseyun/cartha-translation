base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/026.yaml
  text: These were in the days of Joiakim son of Jeshua[a], son of Jozadak, and in the days of Nehemiah the governor and Ezra the priest, the scribe.
translation:
  language: ta
  text: இவர்கள் யோசாதாக்கின் மகனான யேசுவாவின் மகன் யோயாக்கீமின் நாட்களிலும், ஆளுநரான நெகேமியாவும் ஆசாரியர், எழுத்தரான எஸ்றாவும் இருந்த நாட்களிலும் காலத்தைச் சேர்ந்தவர்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஆசாரிய-எழுத்தரான எஸ்றா.” எபிரெயத்தில் எஸ்றாவுக்கு “ஆசாரியர்,” “எழுத்தர்” என்ற இரண்டு இணைநிலைப் பட்டங்கள் கொடுக்கப்பட்டுள்ளன.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה
  choice: இவர்களே ... இருந்தவர்கள்
  rationale: முன்பு பட்டியலிடப்பட்ட நபர்களைச் சுட்டுகிறது. வினைச்சொல் இல்லாத எபிரெய வாக்கியத்தை இயல்பான தமிழில் நிறைவு செய்ய ‘இருந்தவர்கள்’ சேர்க்கப்பட்டுள்ளது; ‘ஏ’ சுட்டப்பட்டவர்களைத் தெளிவுபடுத்துகிறது.
- source_word: בִּימֵי
  choice: நாட்களில்
  rationale: ஒருவரின் வாழ்வுக் காலத்தையோ நிர்வாகக் காலத்தையோ குறிக்கும் எபிரெய மரபுத்தொடரை இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: יוֹיָקִים
  choice: யோயாக்கீம்
  rationale: சிறையிருப்புக்குப் பிந்தைய இந்த ஆசாரியரின் எபிரெயப் பெயரைத் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: בֶּן יֵשׁוּעַ בֶּן יוֹצָדָק
  choice: யோசதாக்கின் மகனான யெசுவாவின் மகன்
  rationale: בֶּן என்பதன் இயல்பான வம்சாவளிப் பொருளான ‘மகன்’ என்பதைக் காக்கிறது; உறவுகளின் வரிசை தமிழில் தெளிவாக அமைகிறது.
- source_word: נְחֶמְיָה הַפֶּחָה
  choice: ஆளுநரான நெகேமியா
  rationale: பாரசீகப் பேரரசின் மாகாண நிர்வாகியைச் சுட்டும் פֶּחָה என்பதற்கு நவீன தமிழில் தெளிவான ‘ஆளுநர்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: וְעֶזְרָא הַכֹּהֵן הַסּוֹפֵר
  choice: ஆசாரியரும் வேதபாரகருமான எஸ்றா
  rationale: எஸ்றாவுக்குக் கொடுக்கப்பட்ட ‘ஆசாரியர்’, ‘வேதபாரகர்’ என்ற இரு இணைநிலைப் பட்டங்களையும் ஒரே நபருக்குரியவையாகத் தெளிவாகக் காட்டுகிறது. סוֹפֵר என்பதன் வேதநூல் சார்ந்த பணியை ‘வேதபாரகர்’ வெளிப்படுத்துகிறது.
