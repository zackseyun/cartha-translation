base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/022.yaml
  text: In the days of Eliashib[a], Joiada, Johanan, and Jaddua, the Levites were recorded as heads of fathers’ houses, and the priests also[c][b], during the reign of Darius the Persian.
translation:
  language: ta
  text: எலியாசீப், யோயாதா, யோகனான், யதுவா ஆகியோரின் காலத்தில், லேவியர்கள் தந்தைவழிக் குடும்பங்களின் தலைவர்களாகப் பதிவுசெய்யப்பட்டனர்[a]; ஆசாரியர்களும் பெர்சியனான தரியுவின் ஆட்சிக்காலத்தில் அவ்வாறே பதிவுசெய்யப்பட்டனர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “தந்தைவழிக் குடும்பங்களின் தலைவர்கள்” என்பது மூதாதையர் வழியில் அமைந்த குடும்ப அல்லது குலப் பிரிவுகளின் தலைவர்களைக் குறிக்கும் சொல்லாட்சி.
    reason: cultural_note
lexical_decisions:
- source_word: הַלְוִיִּם
  choice: லேவியர்கள்
  rationale: லேவி குலத்தாரைக் குறிக்கும் வழக்கமான, இயல்பான தமிழ்ப் பெயர்.
- source_word: בִּימֵי
  choice: காலத்தில்
  rationale: ‘ஒருவரின் நாட்களில்’ என்ற எபிரெயக் காலக் குறிப்பை நவீனத் தமிழில் இயல்பாகத் தருகிறது.
- source_word: אֶלְיָשִׁיב יוֹיָדָע וְיוֹחָנָן וְיַדּוּעַ
  choice: எலியாசீப், யோயாதா, யோகனான், யதுவா
  rationale: எபிரெய மெய்யொலிகளுக்கு அண்மையாகத் தமிழில் ஒலிபெயர்க்கப்பட்டது; குறிப்பாக וְיוֹחָנָן என்பது யோகனான், யோனத்தான் அல்ல.
- source_word: כְּתוּבִים
  choice: பதிவுசெய்யப்பட்டிருந்தார்கள்
  rationale: כתב என்பதன் எழுதி வைக்கப்பட்ட அல்லது அதிகாரப்பூர்வமாகப் பதிவு செய்யப்பட்ட நிலையை, இங்குள்ள வம்சாவளி நிர்வாகச் சூழலில் தெளிவாகக் காட்டுகிறது.
- source_word: רָאשֵׁי אָבוֹת
  choice: தந்தைவழிக் குடும்பங்களின் தலைவர்கள்
  rationale: மூதாதையர் வழியாக அமைந்த குடும்ப அல்லது குலப் பிரிவுகளின் தலைவர்களைக் குறிக்கும் நிர்வாகச் சொல்லாட்சியை வாசகருக்கு விளங்குமாறு தருகிறது.
- source_word: וְהַכֹּהֲנִים
  choice: ஆசாரியர்களும்
  rationale: எபிரெயில் விடுபட்டுள்ள ‘பதிவுசெய்யப்பட்டிருந்தார்கள்’ என்ற வினையை முந்தைய தொடரிலிருந்து இயல்பாக எடுத்துக்கொள்கிறது.
- source_word: עַל מַלְכוּת
  choice: ஆட்சிக்காலம்வரை
  rationale: இச்சூழலில் עַל என்பதற்கு ஒரு கால எல்லையைச் சுட்டும் ‘வரை’ என்ற பொருள் சாத்தியமானது; மாற்றாக ‘ஆட்சிக்காலத்தில்’ என்றும் புரிந்துகொள்ளலாம் என்பதால் குறிப்பில் ambiguity பாதுகாக்கப்படுகிறது.
- source_word: דָּרְיָוֶשׁ הַפָּרְסִי
  choice: பெர்சியனான தரியு
  rationale: அரசனின் இன அல்லது நாட்டுச் சார்பைக் காட்டும் எபிரெய அடைமொழியை இயல்பான தமிழில் தருகிறது.
