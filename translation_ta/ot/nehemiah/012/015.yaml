lexical_decisions:
- source_word: לְ/חָרִם
  choice: ஆரீமுக்கு
  rationale: முன்னொட்டு לְ இப்பட்டியலில் தொடர்பையோ பிரதிநிதித்துவத்தையோ குறிக்கிறது; அதனால் ஆசாரியக் குடும்பமாகிய ஆரீமுக்குரிய பிரதிநிதியை அறிமுகப்படுத்தும் வகையில் ‘ஆரீமுக்கு’ என மொழிபெயர்க்கப்பட்டது.
- source_word: עַדְנָא
  choice: அத்னா
  rationale: இது ஓர் ஆள்பெயர்; எபிரெய உச்சரிப்பை நெருக்கமாகக் காட்டும் வகையில் தமிழில் ஒலிபெயர்க்கப்பட்டது.
- source_word: לִ/מְרָיוֹת
  choice: மெராயோதுக்கு
  rationale: இங்கும் לִ முன்னொட்டு, அடுத்து வரும் நபர் எந்த ஆசாரியக் குடும்பத்தைச் சேர்ந்த பிரதிநிதி என்பதைச் சுட்டுகிறது; எனவே ‘மெராயோதுக்கு’ என வழங்கப்பட்டது.
- source_word: חֶלְקָי
  choice: எல்காய்
  rationale: இது ஓர் ஆள்பெயர்; தொடக்க எபிரெய ח ஒலியைத் தமிழில் இயல்பாக ‘எ’ தொடக்கத்துடன் ஒலிபெயர்த்துள்ளோம்.
