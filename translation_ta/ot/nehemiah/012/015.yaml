  register: சுருக்கமான பெயர்ப்பட்டியலின் அமைப்பு பாதுகாக்கப்பட்டுள்ளது. நவீன நிலையான தமிழில் இயல்பாக வாசிக்க ‘-க்கு’ வேற்றுமை உருபு பயன்படுத்தப்பட்டாலும், மூலத்தின் சுருக்கமும் தொடர்புச் சார்ந்த பொருள் நுட்பமும் அடிக்குறிப்பில் விளக்கப்பட்டுள்ளன.
