base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/024.yaml
  text: And the heads of the Levites were Hashabiah[a], Sherebiah, and Jeshua son of Kadmiel, with their brothers opposite them, to praise and to give thanks according to the command of David the man of God[b], watch corresponding to watch.
translation:
  language: ta
  text: லேவியர்களின் தலைவர்கள் ஹஷபியா, ஷெரெபியா, கத்மியேலின் மகன் யேசுவா, அவர்களுக்கு எதிரே இருந்த அவர்களுடைய சகோதரர்கள்[a] ஆகியோர், தேவனுடைய மனிதரான தாவீதின் கட்டளையின்படி புகழ்ந்து நன்றி செலுத்தினர்—பணிப்பிரிவுக்கு இணையாகப் பணிப்பிரிவு[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்களை நோக்கி” அல்லது “அவர்களுக்கு ஒத்ததாக.” வழிபாட்டில் எதிரெதிராக அல்லது ஒன்றுக்கொன்று இணையாக அமைந்த லேவியக் குழுக்களை இச்சொல் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில், “பணிப்பிரிவுக்கு இணையாகப் பணிப்பிரிவு.” ஒன்றுக்கொன்று இணையான சேவைப் பிரிவுகளையோ மாறிமாறிச் செயல்பட்ட குழுக்களையோ இது குறிக்கலாம்.
    reason: cultural_note
lexical_decisions:
- source_word: רָאשֵׁי הַלְוִיִּם
  choice: லேவியர்களின் தலைவர்கள்
  rationale: ரֹאשׁ என்பதன் பன்மை இணைப்புநிலை இங்கு தலைமைப் பொறுப்பிலுள்ளவர்களைக் குறிக்கிறது; இயல்பான தமிழில் ‘தலைவர்கள்’ என்று மொழிபெயர்க்கப்பட்டது.
- source_word: חֲשַׁבְיָה שֵׁרֵבְיָה וְיֵשׁוּעַ בֶּן קַדְמִיאֵל
  choice: அசபியா, செரெபியா, கத்மியேலின் மகன் யெசுவா
  rationale: தனிப்பெயர்கள் எபிரெய ஒலிப்புக்கு நெருக்கமாக எழுத்துப்பெயர்க்கப்பட்டன; בֶּן என்பதன் தந்தை–மகன் உறவு வெளிப்படையாகத் தக்கவைக்கப்பட்டது.
- source_word: וַאֲחֵיהֶם
  choice: இவர்களுடைய சகோதரர்கள்
  rationale: ஆண்பால் பன்மையான உறவுமுறைச் சொல் நேரடியாகப் பாதுகாக்கப்படுகிறது; சூழலில் உடன் பணியாற்றிய மற்ற லேவியர்களைக் குறிக்கிறது.
- source_word: לְנֶגְדָּם
  choice: இவர்களுக்கு எதிரே
  rationale: மற்றொரு குழுவை நோக்கி எதிர்ப்புறத்தில் அல்லது அதற்கு இணையாக அமைந்திருந்த நிலையைச் சொல்கிறது; தெளிவுக்காக அடிக்குறிப்பில் மாற்று நுணுக்கங்கள் தரப்பட்டுள்ளன.
- source_word: לְהַלֵּל לְהוֹדוֹת
  choice: புகழவும் நன்றி செலுத்தவும்
  rationale: இரண்டு எபிரெய வினைநோக்குகளும் ஒன்றாகக் கலக்கப்படாமல் தனித்தனியாகப் பாதுகாக்கப்பட்டன.
- source_word: בְּמִצְוַת
  choice: கட்டளையின்படி
  rationale: בְּ இங்கு அதிகாரமுள்ள கட்டளைக்கு இணங்கச் செய்வதைக் குறிக்கிறது.
- source_word: דָּוִיד אִישׁ הָאֱלֹהִים
  choice: இறைவனின் மனிதரான தாவீது
  rationale: தெய்வீகப் பணியமர்த்தலைக் குறிக்கும் வேதாகமப் பட்டம் விளக்கவுரை சேர்க்காமல் நேரடியாகத் தக்கவைக்கப்பட்டது.
- source_word: מִשְׁמָר לְעֻמַּת מִשְׁמָר
  choice: ஒரு பணிப்பிரிவுக்கு எதிரே மற்றொரு பணிப்பிரிவு
  rationale: வழிபாட்டுப் பணியில் ஒழுங்குபடுத்தப்பட்ட இணையான அல்லது எதிரெதிரான பிரிவுகளைச் சுட்டும் சுருக்கமான சொற்றொடர். தமிழில் பொருள் புரிய ‘பணிப்பிரிவு’ பயன்படுத்தப்பட்டாலும், மூலத்தின் தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
theological_decisions:
- issue: אֲחֵיהֶם என்ற ஆண்பால் உறவுமுறைச் சொல்
  choice: சகோதரர்கள்
  alternative: உடன் லேவியர்கள் / உறவினர்
  rationale: எபிரெயச் சொல் இலக்கணப்படி ஆண்பால் பன்மை; ஆலயப் பணியிலிருந்த ஆண் லேவியர்களைக் குறிக்கும் என்பதால் பாலினத்தைப் பொதுமைப்படுத்தவில்லை.
- issue: מִשְׁמָר לְעֻמַּת מִשְׁמָר என்ற சுருக்கமான வழிபாட்டு அமைப்புச் சொற்றொடர்
  choice: ஒரு பணிப்பிரிவுக்கு எதிரே மற்றொரு பணிப்பிரிவு
  alternative: காவல்முறைக்கு எதிரே காவல்முறை / மாறிமாறிப் பணியாற்றிய பிரிவுகள்
  rationale: ஒழுங்கமைந்த லேவியப் பிரிவுகள் இருந்ததை உரை காட்டுகிறது; ஆனால் அவை மாறிமாறிப் பாடினவையா அல்லது வேறு முறையில் அமைந்தவையா என்பதைத் தெளிவாகச் சொல்லாததால் அதற்கு மேலான விளக்கம் முதன்மை உரையில் சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், எளிதில் புரியும் அதே நேரத்தில் மரியாதைமிக்க நடையில் வடிவமைக்கப்பட்டது. எபிரெயத்தில் முழுமையான பிரதான வினை இல்லாத பட்டியல் அமைப்பு தமிழில் இயல்பாக அமைய ‘இருந்து… செய்தார்கள்’ என நிறைவு செய்யப்பட்டது. ‘பணிப்பிரிவு’ என்பது ஆலயச் சேவைச் சூழலைத் தெளிவாக்குகிறது; மூலச் சொற்றொடரின் சுருக்கமும் பலவாய்ப்பும் அடிக்குறிப்பில் தக்கவைக்கப்பட்டுள்ளன.
