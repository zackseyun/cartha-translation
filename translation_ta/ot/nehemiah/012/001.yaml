translation_notes:
  register: நவீனத் தரத் தமிழில், மரியாதையும் வாசிப்புத் தெளிவும் கொண்ட பட்டியல் நடை பயன்படுத்தப்பட்டுள்ளது. ‘மேலே வந்த’ என்பது எபிரெய வினையின் புவியியல்/திரும்பிவருதல் சார்ந்த நுணுக்கத்தைக் காக்கிறது. அடிக்குறிப்பு குறி மாற்று பெயர்வடிவம் சார்ந்த ‘யெசுவா’ என்பதற்குப் பின்னரே வைக்கப்பட்டுள்ளது.
