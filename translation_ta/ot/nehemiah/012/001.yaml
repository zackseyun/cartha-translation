source:
  edition: WLC
  text: וְ/אֵ֨לֶּה֙ הַ/כֹּהֲנִ֣ים וְ/הַ/לְוִיִּ֔ם אֲשֶׁ֥ר עָל֛וּ עִם זְרֻבָּבֶ֥ל בֶּן שְׁאַלְתִּיאֵ֖ל וְ/יֵשׁ֑וּעַ שְׂרָיָ֥ה יִרְמְיָ֖ה עֶזְרָֽא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/001.yaml
  text: 'These were the priests and the Levites who came up with Zerubbabel son of Shealtiel[a], and Jeshua: Seraiah, Jeremiah, Ezra.'
translation:
  language: ta
  text: 'செயல்தியேலின் மகன் செருபாபேலுடனும் யெசுவாவுடனும்[a] மேலே வந்த ஆசாரியர்களும் லேவியர்களும் இவர்களே: செராயா, எரேமியா, எஸ்றா.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் ‘யெசுவா’; பெயரை ஒலிபெயர்க்காமல் வழக்கமான வடிவத்துக்கு மாற்றினால் ‘யோசுவா’ என்றும் வழங்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: இவர்களே
  rationale: புதிய பெயர்ப்பட்டியலை அறிமுகப்படுத்தும் சுட்டுப்பெயரின் வலியுறுத்தலை இயல்பான தமிழில் வெளிப்படுத்துகிறது; தொடக்க வாவுக்கு தேவையில்லாமல் காலப்பொருள் சேர்க்கப்படவில்லை.
- source_word: הַכֹּהֲנִים וְהַלְוִיִּם
  choice: ஆசாரியர்களும் லேவியர்களும்
  rationale: இரு சமயப் பணிக்குழுக்களையும் இணையாகக் குறிக்கும் வழக்கமான, தெளிவான தமிழ் சொற்கள்.
- source_word: אֲשֶׁר עָלוּ
  choice: மேலே வந்த
  rationale: நாடுகடத்தலிலிருந்து யூதா அல்லது எருசலேமுக்குச் செல்வதைக் குறிக்கும் עלה என்பதன் திசை சார்ந்த நுணுக்கத்தை, மூலத்தில் இல்லாத இடப்பெயரைச் சேர்க்காமல் காக்கிறது.
- source_word: עִם
  choice: உடனும்
  rationale: உடன்செல்லுதல் அல்லது துணைநிற்கும் உறவை நேரடியாகக் காட்டுகிறது; இரு பெயர்களோடும் தொடர்வதால் இணைப்பு வடிவம் பயன்படுத்தப்பட்டது.
- source_word: זְרֻבָּבֶל בֶּן שְׁאַלְתִּיאֵל
  choice: செயல்தியேலின் மகன் செருபாபேல்
  rationale: எபிரெயப் பெயர்களின் ஒலிவடிவத்தைத் தமிழில் பிரதிபலித்து, தந்தை–மகன் உறவை இயல்பான தமிழ் உடைமைத் தொடரில் தருகிறது.
- source_word: וְיֵשׁוּעַ
  choice: யெசுவா
  rationale: பிற்கால எபிரெயப் பயன்பாட்டிலுள்ள יֵשׁוּעַ என்ற குறிப்பிட்ட பெயர்வடிவத்தை ‘யோசுவா’ என்று இயல்பாக்காமல் ஒலிபெயர்க்கிறது.
- source_word: שְׂרָיָה יִרְמְיָה עֶזְרָא
  choice: செராயா, எரேமியா, எஸ்றா
  rationale: அறிமுக வாக்கியத்தைத் தொடர்ந்து வரும் பெயர்ப்பட்டியலை எளிய பட்டியல் வடிவில் தருகிறது.
