  source_fidelity: 'முதன்மை வாக்கியம் ரָאשֵׁי הַכֹּהֲנִים וַאֲחֵיהֶם என்ற தொடரை பெரும்பாலும் சரியாக உணர்த்துகிறது: பெயரிடப்பட்டோர் ஆசாரியர்களுக்கும் அவர்களுடைய சகோதரர்களுக்கும் தலைமை வகித்தவர்கள். ஆனால் அடிக்குறிப்பு [c] இந்தத் தொடருக்கு மூலத்தில் உறுதியில்லாத மாற்றுத் தொடரியல் வாசிப்பை முன்வைத்து, நேரடிச் சொல்லாக்கத்தையும் துல்லியமாகக் காட்டவில்லை.'
  naturalness: “இவர்கள் யெசுவாவின் நாட்களில் ஆசாரியர்களுக்கும் தங்கள் சகோதரர்களுக்கும் தலைவர்களாக இருந்தார்கள்” என்பது புரியக்கூடிய நவீனத் தமிழ். இருப்பினும் “தங்கள் சகோதரர்கள்” என்பதில் உடைமைச் சுட்டு இவர்கள் பெயரிடப்பட்ட தலைவர்களையே குறிக்கலாம்; மூலத்தின் சூழலில் அது ஆசாரியர்களோடு தொடர்புடைய குழுவைக் குறிக்கிறது. “அவர்களுடைய சகோதரர்களுக்கும்” தெளிவானது.
  terminology: “ஆசாரியர்கள்,” “தலைவர்கள்,” மற்றும் “யெசுவா” பொருத்தமானவை. “தலைவர்கள்” ரָאשֵׁי என்பதன் இயல்பான நவீனத் தமிழ் வடிவம்; பிற்காலத் தொழில்நுட்பப் பதவியான “பிரதான ஆசாரியர்கள்” என்பதைக் கொண்டுவரவில்லை. தனிப்பெயர் எழுத்துப்பெயர்ப்புகளும் ஏற்கத்தக்கவை.
