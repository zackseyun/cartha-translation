source:
  edition: WLC
  text: סַלּ֣וּ עָמ֔וֹק חִלְקִיָּ֖ה יְדַֽעְיָ֑ה אֵ֣לֶּה רָאשֵׁ֧י הַ/כֹּהֲנִ֛ים וַ/אֲחֵי/הֶ֖ם בִּ/ימֵ֥י יֵשֽׁוּעַ׃פ
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/007.yaml
  text: Sallu[a], Amok, Hilkiah[c][b], Jedaiah—these were the heads of the priests and their brothers in the days of Jeshua.
translation:
  language: ta
  text: சல்லூ, ஆமோக், இல்க்கியா, யெதாயா—இவர்கள் யெசுவாவின்[a] நாட்களில் ஆசாரியர்களுக்கும் அவர்களுடைய சகோதரர்களுக்கும்[b] தலைவர்களாக இருந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘யெசுவா’ என்பது சிறையிருப்புக்குப் பிந்தைய காலத்தில் காணப்படும் பெயர்வடிவம்; இது ‘யோசுவா’ என்ற பெயருடன் தொடர்புடையது.
    reason: cultural_note
  - marker: b
    text: அல்லது, ‘அவர்களுடைய உறவினர்களுக்கும்’ அல்லது ‘அவர்களோடு பணியாற்றிய ஆசாரியர்களுக்கும்.’ எபிரெயத்தில் நேரடியாக ‘அவர்களுடைய சகோதரர்களுக்கும்’ என்று உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: סַלּוּ
  choice: சல்லூ
  rationale: எபிரெய தனிப்பெயரின் ஒலிப்பைத் தமிழில் இயல்பாக எழுத்துப்பெயர்த்துள்ளது.
- source_word: עָמוֹק
  choice: ஆமோக்
  rationale: பட்டியலில் வரும் தனிப்பெயரை எபிரெய ஒலிப்புக்கு நெருக்கமாக எழுத்துப்பெயர்த்துள்ளது.
- source_word: חִלְקִיָּה
  choice: இல்க்கியா
  rationale: எபிரெய தனிப்பெயரைத் தமிழில் வழக்கமான மெய்யொலிகளுடன் எழுத்துப்பெயர்த்துள்ளது.
- source_word: יְדַעְיָה
  choice: யெதாயா
  rationale: தனிப்பெயரின் எபிரெய ஒலியமைப்பைத் தமிழில் நெருக்கமாகக் காட்டுகிறது.
- source_word: אֵלֶּה
  choice: இவர்கள்
  rationale: முன்னர் பெயரிடப்பட்ட நபர்களைக் குறிக்கும் சுட்டுப்பெயராக இயல்பான தமிழ் வடிவம்.
- source_word: רָאשֵׁי
  choice: தலைவர்களாக
  rationale: மூலத்தில் உள்ள ‘தலைகள்’ என்ற உருவகத்தின் பொருளான தலைமை நிலையைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது; பிற்காலத் தொழில்நுட்பப் பதவியான ‘பிரதான ஆசாரியர்கள்’ என்பதை இறக்குமதி செய்யவில்லை.
- source_word: הַכֹּהֲנִים
  choice: ஆசாரியர்களுக்கு
  rationale: உறுதியான பன்மைப் பெயர்ச்சொல்லைச் சூழலுக்கேற்ற வேற்றுமையுடன் மொழிபெயர்க்கிறது.
- source_word: וַאֲחֵיהֶם
  choice: தங்கள் சகோதரர்களுக்கும்
  rationale: மூலத்தின் ஆண்பால் பன்மையான ‘அவர்களுடைய சகோதரர்கள்’ என்பதைக் காக்கிறது; இச்சூழலில் உறவினர்கள் அல்லது உடன் ஆசாரியர்கள் என்ற பரந்த பொருள் இருக்கக்கூடும் என்பதைக் குறிப்பில் தருகிறது.
- source_word: בִּימֵי
  choice: நாட்களில்
  rationale: எபிரெய காலக்குறிப்பு மரபைத் தமிழில் இயல்பான வேதாகம நடையில் வழங்குகிறது.
- source_word: יֵשׁוּעַ
  choice: யெசுவா
  rationale: சிறையிருப்புக்குப் பிந்தைய இந்த எபிரெயப் பெயரின் வடிவத்தைத் தமிழில் எழுத்துப்பெயர்த்து, யோசுவா என்ற நீளமான பெயர்வடிவத்திலிருந்து வேறுபடுத்துகிறது.
theological_decisions:
- issue: וַאֲחֵיהֶם என்பதன் உறவு மற்றும் குழுச் சுட்டு
  choice: தங்கள் சகோதரர்களுக்கும்
  alternative: தங்கள் உறவினர்களுக்கும் / தங்களோடு பணியாற்றிய ஆசாரியர்களுக்கும்
  rationale: மூலத்தில் நேரடியாக ‘சகோதரர்கள்’ என்ற ஆண்பால் பன்மை உள்ளது. ஆசாரியக் குடும்பத்தினர் அல்லது உடன் ஆசாரியர்கள் என்று சூழல் சுட்டக்கூடியபோதிலும், அந்த விளக்கத்தை முதன்மை உரையில் உறுதிப்படுத்தாமல் மூலச் சொல்லைத் தக்கவைத்துள்ளது.
- issue: רָאשֵׁי என்ற தலைமைச் சொல்
  choice: தலைவர்களாக
  alternative: தலைகளாக / பிரதான ஆசாரியர்களாக
  rationale: இந்தச் சொல் தலைமை வகிப்பவர்களைக் குறிக்கிறது. ‘தலைகளாக’ என்பது தமிழில் இயல்பற்றது; ‘பிரதான ஆசாரியர்கள்’ என்பது பிற்காலத்தில் உருவான குறிப்பிட்ட பதவிப் பொருளைத் தவறாகக் கொண்டுவரலாம்.
- issue: ஆசாரியர்களும் சகோதரர்களும் என்பவர்களுடனான தொடரியல் உறவு
  choice: ஆசாரியர்களுக்கும் தங்கள் சகோதரர்களுக்கும் தலைவர்களாக
  alternative: ஆசாரியர்களின் தலைவர்களும் அவர்களுடைய சகோதரர்களுமாக
  rationale: எபிரெய தொடரில் ‘தலைவர்கள்’ என்பதன் ஆட்சி இரு இணைக்கப்பட்ட குழுக்களுக்கும் பொருந்துவதாக வாசிக்க இயலும். தமிழ் வாக்கியம் இந்த இயல்பான வாசிப்பைத் தருகிறது; மாற்று தொடரியல் வாய்ப்பை அடிக்குறிப்பு [c] சுட்டுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையும் வேதாகம உரைக்குரிய செறிவும் கொண்ட நடை பயன்படுத்தப்பட்டுள்ளது. தனிப்பெயர்கள் எபிரெய மூலத்திலிருந்து எழுத்துப்பெயர்க்கப்பட்டுள்ளன. ‘தலைவர்கள்’ என்பது பொதுவாசகர்களுக்குப் புரியும்படி இயல்பாக்கப்பட்டாலும், மூல உருவகம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
