  source_fidelity: திருத்தம் தேவை. வரைவில் உள்ள யெதாயா பெயரின் இறுதி -யா விடுபட்டுள்ளது; நெதனெயேல் என்பது נְתַנְאֵל என்ற பெயரின் -ஏல் முடிவைத் துல்லியமாகக் காட்டவில்லை. மேலும், לְ என்ற பட்டியல்-இணைப்பு தமிழில் ‘க்காக’ என வரும்போது பயனாளருக்காக என்ற பொருளைத் தூண்டுகிறது; ‘க்கு’ என்ற சுருக்கமான பட்டியல் நடை மூலத்தின் தொடர்பு/பிரதிநிதித்துவ நெகிழ்வை நன்றாகப் பேணுகிறது.
  naturalness: ‘ஹில்க்கியாவுக்கு ஹஷபியா; யெதாயாவுக்கு நெதனேல்’ என்பது நவீனத் தரத் தமிழில் பெயர்ப் பட்டியலாக இயல்பாகவும் சுருக்கமாகவும் உள்ளது. அரைப்புள்ளி இரு இணையான பதிவுகளையும் தெளிவாகப் பிரிக்கிறது.
  terminology: பெயர்கள் எபிரெய வடிவத்துக்கு அணுக்கமாக ஹில்க்கியா (חִלְקִיָּה), ஹஷபியா (חֲשַׁבְיָה), யெதாயா (יְדַעְיָה), நெதனேல் (נְתַנְאֵל) எனச் சீராக்கப்பட்டுள்ளன. לְ-க்கு விளக்கக் குறிப்பில் ‘சார்பாக’ மற்றும் ‘சேர்ந்த’ என்ற மாற்றுகள் வழங்கப்பட்டு, அதன் பட்டியல்-சார்ந்த நெகிழ்வு பாதுகாக்கப்படுகிறது.
