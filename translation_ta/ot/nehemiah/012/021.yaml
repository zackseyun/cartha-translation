lexical_decisions:
- source_word: לְ/חִלְקִיָּה
  choice: இல்க்கியாவுக்காக
  rationale: இந்த ஆசாரியப் பட்டியலில் முன்னொட்டு ל ஒரு குடும்பத் தலைவரோடு உள்ள தொடர்பை அல்லது அவர் சார்பான பிரதிநிதித்துவத்தைக் குறிக்கிறது. பட்டியலின் சுருக்கமான நடையைப் பேணுவதற்கு ‘இல்க்கியாவுக்காக’ என வழங்கப்பட்டது; பெயர் எபிரெய ஒலிப்புக்கு ஏற்றவாறு எழுத்துப்பெயர்க்கப்பட்டது.
- source_word: חֲשַׁבְיָה
  choice: அசபியா
  rationale: இது ஒரு தனிப்பெயர்; பொருள் மொழிபெயர்க்கப்படாமல், எபிரெய உச்சரிப்பை அணுகும் வகையில் தமிழில் எழுத்துப்பெயர்க்கப்பட்டது.
- source_word: לִֽ/ידַֽעְיָה
  choice: யெதாயாவுக்காக
  rationale: முதல் சொற்றொடரைப் போலவே ל குடும்பம் அல்லது வீட்டைச் சார்ந்த பிரதிநிதித்துவத்தைச் சுட்டுகிறது. இணையான பட்டியல் அமைப்பைப் பேண ‘யெதாயாவுக்காக’ என மொழிபெயர்க்கப்பட்டது.
- source_word: נְתַנְאֵל
  choice: நெதனெயேல்
  rationale: இது ஒரு தனிப்பெயர்; எபிரெய ஒலிப்பை அணுகும் வகையில் தமிழில் எழுத்துப்பெயர்க்கப்பட்டது.
