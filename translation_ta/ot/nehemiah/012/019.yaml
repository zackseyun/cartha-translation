revisions:
- from: யோயாரிபுக்காக[a] மத்தெனாய்; யெதாயாவுக்காக ஊசி.
  to: யோயாரீபுக்கு[a] மத்தெனாய்; யெதாயாவுக்கு உஸ்ஸி.
  rationale: The revision renders the list-association force of לְ with natural Tamil -க்கு rather than purposive -க்காக, improves source-near name forms, and retains the optional initial conjunction in a footnote. The concise list syntax and its ambiguity about the exact nature of the association are preserved.
