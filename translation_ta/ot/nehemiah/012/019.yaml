  text: யோயாரீபுக்கு[a] மத்தெனாய்; யெதாயாவுக்கு உஸ்ஸி.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யோயாரீபுக்கும் மத்தெனாய்; யெதாயாவுக்கு உஸ்ஸி.” எபிரெயத்தில் ‘யோயாரீபுக்கு’ என்பதோடு ஒரு இணைப்புச் சொல் இணைந்துள்ளது; பட்டியல் நடையில் தமிழில் அதை வெளிப்படையாகக் கூறாமல் விடலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/לְ/יוֹיָרִיב
  choice: யோயாரிபுக்காக
  rationale: וּ + לְ பட்டியலின் அடுத்த உருப்படியை அறிமுகப்படுத்துகிறது. தமிழில் பட்டியல் நடையில் இணைப்புச் சொல்லை வெளிப்படையாகக் கூறாமல், לְ என்பதன் தொடர்புப் பொருளை ‘-க்காக’ என இயல்பாகக் கொடுத்துள்ளது; பெயர் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: מַתְּנַי
  choice: மத்தெனாய்
  rationale: தனிப்பட்ட நபரின் பெயர் என்பதால் எபிரெய உச்சரிப்புக்கு நெருக்கமாக ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: לִֽ/ידַֽעְיָה
  choice: யெதாயாவுக்காக
  rationale: לְ இங்கு ஆசாரியக் குடும்பப் பட்டியலில் தொடர்பையோ பிரதிநிதித்துவத்தையோ குறிக்கிறது. சுருக்கமான பட்டியல் அமைப்பைத் தக்கவைக்க ‘-க்காக’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: עֻזִּי
  choice: ஊசி
  rationale: தனிப்பட்ட நபரின் பெயர் என்பதால் எபிரெய உச்சரிப்புக்கு நெருக்கமாக ஒலிபெயர்க்கப்பட்டுள்ளது.
