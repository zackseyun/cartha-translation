lexical_decisions:
- source_word: שְׁמַעְיָה
  choice: செமாயா
  rationale: எபிரெய தனிப்பெயரின் ஒலிவடிவத்தை நவீனத் தமிழில் இயல்பாக எழுத்துப்பெயர்த்தல்.
- source_word: וְ
  choice: ','
  rationale: பெயர்ப்பட்டியலில் உள்ள எபிரெய இணைப்புச்சொல் தமிழில் தனியே ‘மற்றும்’ என மொழிபெயர்க்கப்படாமல் காற்புள்ளியால் இயல்பாகக் காட்டப்படுகிறது.
- source_word: יוֹיָרִיב
  choice: யோயாரீப்
  rationale: இவ்வசனத்தில் காணப்படும் குறுகிய எபிரெயப் பெயர்வடிவத்தை மொழிபெயர்க்காமல் ஒலிப்பெயர்த்தல்; இதை விரிவான தொடர்புடைய பெயர்வடிவமாக மாற்றவில்லை.
- source_word: יְדַעְיָה
  choice: யெதாயா
  rationale: எபிரெய தனிப்பெயரின் ஒலிப்பை நெருக்கமாகப் பிரதிபலிக்கும் தமிழ் எழுத்துப்பெயர்ப்பு.
