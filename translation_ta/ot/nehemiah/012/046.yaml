base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/046.yaml
  text: For in the days of David and Asaph[a], of old, there were heads of the singers[b], and songs of praise and thanksgiving to God.
translation:
  language: ta
  text: ஏனெனில், முற்காலத்தில்[a], தாவீதும் ஆசாப்பும் வாழ்ந்த நாட்களில், பாடகர்களின் தலைவர்[b] இருந்தார்; கடவுளுக்குப் புகழ்ச்சிப் பாடலும் நன்றிசெலுத்துதலும் இருந்தன.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பழங்காலத்தில்” அல்லது “பண்டைக் காலத்திலிருந்து.”
    reason: lexical_alternative
  - marker: b
    text: 'எபிரெயத்தில் ஒருமை: “பாடகர்களின் தலைவர்”; இதை “பாடகர்களின் தலைவன்” அல்லது “பாடகர்களின் முதன்மைத் தலைவர்” என்றும் மொழிபெயர்க்கலாம்.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய கூற்றுக்கான விளக்கக் காரணத்தை அறிமுகப்படுத்துகிறது; தமிழில் இந்த உரையாடல் தொடர்பை இயல்பாகக் காட்டுகிறது.
- source_word: בִימֵי דָוִיד וְאָסָף
  choice: தாவீது மற்றும் ஆசாபின் நாட்களில்
  rationale: எபிரெய காலக் குறிப்பின் வடிவத்தையும் இரு நபர்களின் பெயர்களையும் தெளிவாகப் பாதுகாக்கிறது.
- source_word: מִקֶּדֶם
  choice: பழங்காலத்தில்
  rationale: முற்காலத்தைக் குறிக்கும் சொல்லை நவீனத் தமிழில் இயல்பாகவும் சுருக்கமாகவும் தருகிறது.
- source_word: רֹאשׁ הַמְשֹׁרְרִים
  choice: பாடகர்களுக்குத் தலைவர்கள்
  rationale: ரֹאשׁ ஒருமை வடிவில் இருந்தாலும் இங்கு கூட்டுப்பொருளில் தலைமை வகித்தவர்களைக் குறிப்பதாகப் புரிந்துகொள்ளப்படுகிறது; הַמְשֹׁרְרִים என்பதற்கு ‘பாடகர்கள்’ துல்லியமானது.
- source_word: וְשִׁיר תְּהִלָּה
  choice: புகழ்ப்பாடல்களும்
  rationale: ஒருமை வடிவிலுள்ள ‘பாடல்’ இச்சூழலில் கூட்டுப்பொருளாக இயல்பாகப் பன்மையில் மொழிபெயர்க்கப்படுகிறது; ‘புகழ்ப்பாடல்’ இரு பெயர்ச்சொற்களின் தொடர்பைத் தெளிவாக்குகிறது.
- source_word: וְהֹדוֹת לֵאלֹהִים
  choice: கடவுளுக்கு ... நன்றிப் பாடல்களும்
  rationale: הֹדוֹת நன்றி செலுத்தும் வழிபாட்டு வெளிப்பாடுகளைக் குறிக்கிறது; לְ அதன் நோக்கை ‘கடவுளுக்கு’ என்று காட்டுகிறது. இணையான தமிழ் தொடருக்காக ‘நன்றிப் பாடல்கள்’ என வழங்கப்பட்டுள்ளது.
