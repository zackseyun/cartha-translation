  text: וָ/אוֹמַ֣ר אֲלֵ/הֶ֗ם אַתֶּ֤ם רֹאִים֙ הָ/רָעָה֙ אֲשֶׁ֣ר אֲנַ֣חְנוּ בָ֔/הּ אֲשֶׁ֤ר יְרוּשָׁלִַ֨ם֙ חֲרֵבָ֔ה וּ/שְׁעָרֶ֖י/הָ נִצְּת֣וּ בָ/אֵ֑שׁ לְכ֗וּ וְ/נִבְנֶה֙ אֶת חוֹמַ֣ת יְרוּשָׁלִַ֔ם וְ/לֹא נִהְיֶ֥ה ע֖וֹד חֶרְפָּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/002/017.yaml
  text: 'Then I said to them[a], “You see the trouble we are in: Jerusalem lies in ruins, and its gates have been burned with fire. Come, let us rebuild the wall of Jerusalem[c][b], so that we may no longer be a reproach.”'
translation:
  language: ta
  text: 'பின்பு நான் அவர்களிடம், “நாம் இருக்கும் இந்த அவலநிலையை[a] நீங்கள் காண்கிறீர்கள்: எருசலேம் பாழடைந்து[b] கிடக்கிறது; அதன் வாசல்கள் தீயால் எரிக்கப்பட்டுள்ளன. வாருங்கள், எருசலேமின் மதிலை நாம் திரும்பக் கட்டுவோம்; இனியும் நாம் பழிச்சொல்லுக்கு ஆளாகாமல்[c] இருப்போம்” என்றேன்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “துயரநிலை” அல்லது “இக்கட்டான நிலை” என்றும் மொழிபெயர்க்கலாம். இங்கு எபிரெயச் சொல் ஒழுக்கத் தீமையைவிட பேரிடர் அல்லது இடர்ப்பாட்டைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: “பாழாய்க் கிடக்கிறது” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: “இனியும் நாம் அவமானமாக இருக்காதபடி” அல்லது “இகழ்ச்சிக்கு இலக்காகாதபடி” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרָעָה
  choice: இந்த அவலநிலையை
  rationale: இங்கு இச்சொல் ஒழுக்கத் தீமையைக் குறிப்பதல்ல; எருசலேமின் அழிவால் மக்கள் அனுபவிக்கும் துயரமும் இடர்ப்பாடும் நிறைந்த நிலையைக் குறிக்கிறது.
- source_word: אֲשֶׁר אֲנַחְנוּ בָהּ
  choice: நாம் இருக்கும்
  rationale: மக்கள் தற்போது அந்த அவலநிலையில் இருப்பதை எளிமையாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: חֲרֵבָה
  choice: பாழடைந்து கிடக்கிறது
  rationale: எருசலேமின் அழிவுற்ற தற்போதைய நிலையை நவீனத் தமிழில் தெளிவாகவும் உயிரோட்டமாகவும் தெரிவிக்கிறது.
- source_word: נִצְּתוּ בָאֵשׁ
  choice: தீயால் எரிக்கப்பட்டுள்ளன
  rationale: எபிரெயச் செயலப்பாட்டு வடிவத்தையும் ‘தீயால்’ என்ற வெளிப்படையான குறிப்பையும் தக்கவைக்கிறது.
- source_word: לְכוּ
  choice: வாருங்கள்
  rationale: சொல்லடிப்படையில் ‘செல்லுங்கள்’ என்றாலும், இங்கு கூட்டுச் செயலுக்கு அழைக்கும் ஊக்கவுரை என்பதால் ‘வாருங்கள்’ இயல்பான தமிழ் இணையாகும்.
- source_word: וְנִבְנֶה
  choice: நாம் திரும்பக் கட்டுவோம்
  rationale: கூட்டு உறுதியை வெளிப்படுத்தும் cohortative பொருளையும், முன்பு இருந்த மதிலை மீண்டும் கட்டும் சூழலையும் தெரிவிக்கிறது.
- source_word: חוֹמַת יְרוּשָׁלִַם
  choice: எருசலேமின் மதிலை
  rationale: எபிரெயக் கட்டமைப்பின் உடைமைத் தொடர்பை இயல்பான தமிழில் நேரடியாகக் காட்டுகிறது.
- source_word: וְלֹא נִהְיֶה עוֹד חֶרְפָּה
  choice: இனியும் நாம் பழிச்சொல்லுக்கு ஆளாகாமல் இருப்போம்
  rationale: சமூகம் பிறரின் இகழ்ச்சிக்கும் அவமானத்திற்கும் இலக்காகியிருப்பதைத் தெரிவிக்கிறது; இறுதி வாவ் இணைப்பின் நோக்கம் அல்லது விளைவுத் தொனியைத் தமிழில் இயல்பாகப் பாதுகாக்கிறது.
