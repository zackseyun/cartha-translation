  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் அதேவேளையில் வேதாகம உரைக்கு ஏற்ற கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. அழைப்பும் கூட்டு உறுதியும் ‘வாருங்கள்… நாம்… கட்டுவோம்’ என்ற இயல்பான அமைப்பில் வெளிப்படுத்தப்பட்டுள்ளன.
