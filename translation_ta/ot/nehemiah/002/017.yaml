  source_fidelity: மூல எபிரெய உரையின் பொருள் துல்லியமாகப் பாதுகாக்கப்பட்டுள்ளது. הָרָעָה இங்கு ஒழுக்கத் தீமை அல்ல, சமூகத்தின் அவல/இடர்நிலையைக் குறிக்கும் என்பதையும், எருசலேமின் பாழ்நிலை, தீயால் எரிக்கப்பட்ட வாசல்கள், கூட்டாக மதிலை மீளக் கட்டும் அழைப்பு, இனி இகழ்ச்சிக்கு ஆளாகாதிருக்கும் நோக்கம்/விளைவு ஆகியவற்றையும் மொழிபெயர்ப்பு சரியாக வெளிப்படுத்துகிறது.
  naturalness: நடை நவீன நிலையான தமிழில் இயல்பாகவும் வேதாகம உரைக்கு ஏற்ற கண்ணியத்துடனும் உள்ளது. “வாருங்கள் … நாம் திரும்பக் கட்டுவோம்” என்பது கூட்டுச் செயலுக்கான அழைப்பைத் தெளிவாகக் காட்டுகிறது. “பழிச்சொல்லுக்கு ஆளாகாமல் இருப்போம்” என்பது சற்றே விரிவானதாயினும் இயல்பானதும் பொருத்தமானதும் ஆகும்.
  terminology: “அவலநிலை,” “பாழடைந்து கிடக்கிறது,” “மதிலை,” “பழிச்சொல்லுக்கு ஆளாகாமல்” ஆகிய சொற்கள் சூழலுக்கு ஏற்றவை. “எருசலேம்” என்ற பெயர்வடிவம் முழுவதும் ஒரேபோலப் பயன்படுத்தப்பட்டுள்ளது. இறுதிக் குறிப்பு இகழ்ச்சி/அவமானம் என்ற חֶרְפָּה-வின் பொருள்வெளியை நன்றாகக் காக்கிறது.
