base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/002/005.yaml
  text: Then I said to the king[a], "If it pleases the king, and if your servant has found favor before you, that you would send me to Judah, to the city of my fathers' graves[c][b], so that I may rebuild it."
translation:
  language: ta
  text: பின்பு நான் அரசனிடம், “அரசனுக்கு விருப்பமானால், உமது பணியாளனாகிய எனக்கு உமது பார்வையில் தயவு கிடைத்திருந்தால், என் முன்னோர்களின் கல்லறைகள் உள்ள நகரத்துக்குச் சென்று அதைக் கட்டியெழுப்ப[a] என்னை யூதாவுக்கு அனுப்புவீராக” என்றேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “கட்டியெழுப்ப” என்பதற்கான எபிரெய வினை சொற்படியாக “கட்ட” என்று பொருள்படும்; நகரம் பாழடைந்திருந்த சூழலை “கட்டியெழுப்ப” என்பது வெளிப்படுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֹמַר
  choice: பின்பு நான் … என்றேன்
  rationale: வாவ் தொடர்வினை கதை நிகழ்வை முன்னெடுத்துச் செல்கிறது; ‘பின்பு’ இயல்பான தமிழில் அந்த வரிசையைத் தெரிவிக்கிறது.
- source_word: אִם עַל־הַמֶּלֶךְ טוֹב
  choice: அரசனுக்கு விருப்பமானால்
  rationale: அரசரின் ஒப்புதலையும் விருப்பத்தையும் பணிவுடன் கோரும் அரசவை மரபுத்தொடரை இயல்பான, மரியாதையான தமிழில் தருகிறது.
- source_word: וְאִם יִיטַב עַבְדְּךָ לְפָנֶיךָ
  choice: உமது பணியாளனாகிய என்மீது உமக்குத் தயவு இருந்தால்
  rationale: அரசருக்கு முன் சாதகமான நிலையிலும் அங்கீகாரத்திலும் இருப்பதைக் குறிக்கும் மரபுத்தொடரின் பொருளைத் தெளிவாகத் தருகிறது.
- source_word: עַבְדְּךָ
  choice: உமது பணியாளனாகிய நான்
  rationale: அரசனிடம் பேசும் தாழ்மையான சுயக்குறிப்பைத் தக்கவைக்கிறது; இச்சூழலில் ‘அடிமை’ என்பதைக் காட்டிலும் ‘பணியாளன்’ சமூகப் பதிவுக்கு ஏற்றது.
- source_word: תִּשְׁלָחֵנִי
  choice: என்னை … அனுப்புவீராக
  rationale: அரசனிடம் வைக்கப்படும் பணிவான வேண்டுகோளாகத் தமிழில் இயல்பாக அமைகிறது.
- source_word: יְהוּדָה
  choice: யூதா
  rationale: இடப்பெயரின் வழக்கமான தமிழ் வடிவம்.
- source_word: אֶל־עִיר קִבְרוֹת אֲבֹתַי
  choice: என் முன்னோர்களின் கல்லறைகள் உள்ள நகரம்
  rationale: எபிரெயக் கட்டமைப்பு சொற்படியாக ‘என் தந்தையரின் கல்லறைகளுடைய நகரம்’; இங்கு אבות என்பது உடனடி தந்தையரை மட்டும் அல்லாமல் முன்னோர்களைக் குறிக்கும் என்பதையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וְאֶבְנֶנָּה
  choice: அதைக் கட்டியெழுப்புவதற்காக
  rationale: பெண்பால் பின்னொட்டு நகரத்தைக் குறிக்கிறது; நோக்கத்தை வெளிப்படுத்தும் வடிவம் வேண்டுகோளின் தொடர்ச்சியைத் தருகிறது. அடிப்படை வினை ‘கட்டு’; ‘கட்டியெழுப்பு’ அழிந்த நகரத்தை மீண்டும் கட்டும் சூழலை இயல்பாக உணர்த்துகிறது.
