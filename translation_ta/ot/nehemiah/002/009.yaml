base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/002/009.yaml
  text: So I came to the governors Beyond the River and gave them the king’s letters[b][a]. Now the king had sent with me army officers and horsemen.
translation:
  language: ta
  text: ஆகவே, நான் ஆற்றுக்கு அப்பாலிருந்த ஆளுநர்களிடம்[a] சென்று, அரசனின் கடிதங்களை அவர்களிடம் கொடுத்தேன். அரசன் என்னுடன் படை அதிகாரிகளையும் குதிரைவீரர்களையும் அனுப்பியிருந்தான்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ஆற்றுக்கு அப்பால்” என்பது பொதுவாக யூபிராத்து ஆற்றுக்கு மேற்கே இருந்த பாரசீக நிர்வாகப் பகுதியைக் குறிக்கும் பெயர்.
    reason: cultural_note
  - marker: b
    text: 'வேறு மொழிபெயர்ப்பு: “படைத்தலைவர்களையும் குதிரைப்படையினரையும்.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: פַּחֲווֹת
  choice: ஆளுநர்கள்
  rationale: பாரசீகப் பேரரசின் மாவட்ட நிர்வாக அதிகாரிகளைக் குறிக்கிறது; நவீனத் தமிழில் தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: עֵבֶר הַנָּהָר
  choice: ஆற்றுக்கு அப்பாலுள்ள
  rationale: யூபிராத்து ஆற்றுக்கு மேற்கே இருந்த பாரசீக நிர்வாகப் பகுதியின் பெயரைக் குறிக்கிறது. மூலத்தின் சொல்லமைப்பைத் தக்கவைத்தபடி தமிழில் புரியுமாறு வழங்கப்பட்டுள்ளது.
- source_word: אִגְּרוֹת
  choice: கடிதங்கள்
  rationale: இவை அரச அதிகாரத்தை உறுதிப்படுத்தும் எழுத்துப்பூர்வ ஆவணங்கள்; ‘கடிதங்கள்’ என்பது நேரடியும் இயல்புமான மொழிபெயர்ப்பு.
- source_word: שָׂרֵי חַיִל
  choice: படைத்தலைவர்கள்
  rationale: படையின் தலைமை அதிகாரிகளைக் குறிக்கும் சொற்றொடர்; ‘படைத்தலைவர்கள்’ சுருக்கமாகவும் தெளிவாகவும் பொருளைத் தருகிறது.
- source_word: פָרָשִׁים
  choice: குதிரைவீரர்கள்
  rationale: குதிரையில் செல்லும் ஆயுதப்படை வீரர்களைக் குறிக்கிறது; கூட்டுப்படைப் பிரிவாக விளக்காமல் எபிரெயச் சொல்லுக்கு நெருக்கமாக உள்ளது.
- source_word: וַיִּשְׁלַח עִמִּי הַמֶּלֶךְ
  choice: அரசன் என்னுடன் ... அனுப்பியிருந்தான்
  rationale: முந்தைய செயல்களுக்கு பின்னணியாக நேகேமியாவுடன் வந்த பாதுகாப்புப் படையை விளக்குவதால், தமிழின் இறந்தகால நிறைவுவினை இயல்பாகப் பொருந்துகிறது.
- source_word: וָאָבוֹא
  choice: ஆகவே, நான் ... வந்து
  rationale: கதைத் தொடர்ச்சியையும் முந்தைய வசனத்துடனான விளைவுத் தொடர்பையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
