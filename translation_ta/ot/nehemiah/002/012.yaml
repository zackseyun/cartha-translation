base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/002/012.yaml
  text: So I arose in the night[a], I and a few men with me, and I had not told anyone what my God was putting into my heart to do for Jerusalem[c][b]. And there was no animal with me except the animal on which I was riding.
translation:
  language: ta
  text: ஆகவே, நான் இரவில் எழுந்தேன்; என்னுடன் சில ஆண்கள் இருந்தனர். எருசலேமுக்காகச் செய்ய என் கடவுள் என் உள்ளத்தில் வைத்திருந்ததை நான் யாரிடமும் சொல்லவில்லை.[a] நான் ஏறிச் சென்ற விலங்கைத் தவிர வேறு எந்த விலங்கும் என்னுடன் இல்லை.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “என் உள்ளத்தில் வைத்திருந்ததை” என்பதற்கு “என் உள்ளத்தில் தூண்டியதை” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயச் சொல் சவாரிக்குப் பயன்படும் உயிரினத்தைக் குறிப்பாக இனங்காணாமல் பொதுவாக “விலங்கு” என்று கூறுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאָקוּם לַיְלָה
  choice: ஆகவே, இரவில் ... எழுந்தோம்
  rationale: קום என்பதன் தொடர்கதை வடிவத்தையும் இரவுநேரச் சூழலையும் இயல்பான தமிழில் தருகிறது. எபிரெயத்தில் ஒருமை வினை இருந்தாலும், ‘நானும் ... சில ஆண்களும்’ என்ற தமிழ்க் கூட்டெழுவாய்க்கேற்ப பன்மை வினை பயன்படுத்தப்பட்டது.
- source_word: אֲנִי וַאֲנָשִׁים מְעַט עִמִּי
  choice: நானும் என்னுடன் இருந்த சில ஆண்களும்
  rationale: אֲנָשִׁים இங்கு ஆண்களைக் குறிக்கிறது; நெகேமியாவின் வெளிப்படையான தன்மைக் குறிப்பையும் உடன் சென்ற சிறிய குழுவையும் காக்கிறது.
- source_word: וְלֹא הִגַּדְתִּי לְאָדָם
  choice: நான் யாரிடமும் சொல்லவில்லை
  rationale: சொல்லுதல்/தெரிவித்தல் என்ற பொருளை நவீனத் தமிழில் இயல்பாகத் தருகிறது. לְאָדָם இங்கு ‘எந்த ஒருவருக்கும்’ என்ற பொதுப் பொருளில் வருகிறது.
- source_word: מָה אֱלֹהַי נֹתֵן אֶל לִבִּי
  choice: என் கடவுள் என் உள்ளத்தில் வைத்துக்கொண்டிருந்ததை
  rationale: נֹתֵן என்ற நிகழ்நிலைப் பங்கேற்புவினையின் தொடர்ச்சியான அல்லது உயிரோட்டமான தன்மையைத் தக்கவைத்து, לב என்பதன் சிந்தனை-விருப்ப மையப் பொருளை ‘உள்ளம்’ மூலம் வெளிப்படுத்துகிறது.
- source_word: לַעֲשׂוֹת לִירוּשָׁלִָם
  choice: எருசலேமுக்காகச் செய்யும்படி
  rationale: எருசலேமுக்காக என்ன செய்ய வேண்டும் என்பதை இவ்வசனம் இன்னும் குறிப்பாகச் சொல்லாததால், மூலத்தின் திறந்த பொருளைத் தக்கவைக்கிறது.
- source_word: וּבְהֵמָה אֵין עִמִּי כִּי אִם הַבְּהֵמָה
  choice: நான் ஏறிச் சென்ற விலங்கைத் தவிர வேறு எந்த விலங்கும் என்னுடன் இல்லை
  rationale: בְּהֵמָה என்பது இங்கு சவாரிக்குப் பயன்பட்ட உயிரினத்தைக் குறிக்கும் பொதுச் சொல்; அதன் இனத்தை ஊகிக்காமல் ‘விலங்கு’ என மொழிபெயர்க்கப்பட்டது.
- source_word: אֲשֶׁר אֲנִי רֹכֵב בָּהּ
  choice: நான் ஏறிச் சென்ற
  rationale: சவாரி செய்த செயலை இயல்பான தமிழில் தருகிறது; எந்த விலங்கு என்பதைச் சேர்த்து விளக்கவில்லை.
theological_decisions:
- issue: நெகேமியாவின் உள்ளார்ந்த தீர்மானத்தில் கடவுளின் செயல்பாடு
  choice: ‘என் கடவுள் என் உள்ளத்தில் வைத்துக்கொண்டிருந்ததை’ என்று மொழிபெயர்க்கப்பட்டது.
  alternative: ‘என் கடவுள் என் உள்ளத்தில் வைத்திருந்ததை’ அல்லது ‘என் கடவுள் என் உள்ளத்தில் தூண்டிக்கொண்டிருந்ததை’
  rationale: கடவுளே அந்த நோக்கத்தின் தொடக்கமாக இருந்தார் என்பதைத் தக்கவைக்கிறது; அதேவேளை இதை நேரடியான வாய்மொழி வெளிப்பாடு என்று வலுப்படுத்தவில்லை. பங்கேற்புவினையின் தொடர்ச்சித் தன்மையும் மனிதச் செயல்பாட்டுடனான இறையூக்கத்தின் பதற்றமும் பாதுகாக்கப்படுகின்றன.
translation_notes:
  register: நவீன நிலையான தமிழ்; எளிதில் புரியும், கண்ணியமான கதைநடை. மூலத்தின் பொதுவான ‘விலங்கு’ என்பதும், எருசலேமுக்காகச் செய்ய வேண்டிய செயல் இங்கு குறிப்பிடப்படாமல் இருப்பதும் காக்கப்பட்டுள்ளன.
