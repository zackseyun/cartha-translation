base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/002/019.yaml
  text: But when Sanballat the Horonite[a], Tobiah the Ammonite servant, and Geshem the Arab heard, they mocked us and despised us, and said, “What is this thing that you are doing? Are you rebelling against the king?”
translation:
  language: ta
  text: ஓரோனியனான சன்பல்லாத்தும், அம்மோனிய அடிமையான தொபியாவும்[a], அரபியனான கேஷேமும் கேள்விப்பட்டபோது, அவர்கள் எங்களை ஏளனம் செய்து இகழ்ந்து, “நீங்கள் செய்கிற இந்தக் காரியம் என்ன? அரசருக்கு எதிராகக் கலகம் செய்கிறீர்களா?” என்று சொன்னார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அம்மோனியப் பணியாளரான தொபியா”; சிலர் இந்தப் பட்டப்பெயரை விரிவான பொருளில் ஓர் அதிகாரப் பதவியாகக் கருதுகின்றனர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: இதைக் கேட்டபோது
  rationale: வாவ் தொடர்வினை கதையை முன்னெடுத்து, கேட்டதற்குப் பின்வந்த பகைமையான எதிர்வினையோடு இயல்பாக இணைகிறது; முந்தைய சூழலிலுள்ள செயலைக் குறிக்கத் தமிழில் ‘இதை’ சேர்க்கப்பட்டுள்ளது.
- source_word: הַחֹרֹנִי
  choice: ஓரோனியனான
  rationale: இடம் அல்லது இனத்தைச் சுட்டும் அடைமொழியைப் பெயருடன் இணைத்து, எபிரெய வடிவின் தெளிவின்மையைத் தீர்க்காமல் பாதுகாக்கிறது.
- source_word: הָעֶבֶד הָעַמּוֹנִי
  choice: அம்மோனிய அடிமையான
  rationale: עֶבֶד என்பதன் அடிப்படைச் சேவை/அடிமை நிலையை ‘அடிமை’ நேரடியாகக் காட்டுகிறது; இது அதிகாரப் பதவியாக இருக்கலாம் என்ற வாய்ப்பு அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: הָעַרְבִי
  choice: அரபியனான
  rationale: இன அல்லது பிராந்திய அடையாளத்தை நவீனத் தமிழில் நேரடியாகவும் இயல்பாகவும் தருகிறது.
- source_word: וַיַּלְעִגוּ לָנוּ
  choice: எங்களை ஏளனம் செய்து
  rationale: இகழ்ச்சியுடன் கேலி செய்தல் என்னும் வினையின் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: וַיִּבְזוּ עָלֵינוּ
  choice: இகழ்ந்து
  rationale: அவமதித்து அற்பமாகக் கருதும் பொருளைச் சுருக்கமாகத் தருவதோடு முந்தைய வினையுடன் உள்ள இணைநிலையையும் காக்கிறது.
- source_word: מָה הַדָּבָר הַזֶּה אֲשֶׁר אַתֶּם עֹשִׂים
  choice: நீங்கள் செய்கிற இந்தக் காரியம் என்ன?
  rationale: எபிரெய வினாவின் உறுதியான குற்றஞ்சாட்டும் தொனியையும் ‘இந்தக் காரியம்’ என்ற நேரடியான சொற்றொடரையும் இயல்பான தமிழ் வரிசையில் காக்கிறது.
- source_word: הַעַל הַמֶּלֶךְ אַתֶּם מֹרְדִים
  choice: அரசருக்கு எதிராகக் கலகம் செய்கிறீர்களா?
  rationale: על என்பதன் எதிர்ப்புப் பொருளையும், மֹרְדִים குறிக்கும் தொடரும் கலகச் செயலையும் குற்றஞ்சாட்டும் கேள்வியாகத் தருகிறது.
theological_decisions:
- issue: தொபியாவின் அடைமொழியில் עֶבֶד என்பதன் மொழிபெயர்ப்பு
  choice: அடிமை
  alternative: பணியாளர் அல்லது அதிகாரி
  rationale: எபிரெயச் சொல்லின் அடிப்படை சமூகநிலைப் பொருளை ‘அடிமை’ வெளிப்படையாகக் காக்கிறது. ஆனால் இங்கு அது ஓர் அரசுப் பதவிப் பெயராகப் பயன்பட்டிருக்கலாம் என்பதால் அந்த மாற்றுப் புரிதல் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. பெயர்களோடு வரும் இன/இட அடைமொழிகள் தமிழுக்கு இயல்பான ‘-னான’ அமைப்பில் தரப்பட்டுள்ளன; குற்றஞ்சாட்டும் கேள்வியின் வலிமை காக்கப்பட்டுள்ளது.
