  text: וָ/אֱהִ֨י עֹלֶ֤ה בַ/נַּ֨חַל֙ לַ֔יְלָה וָ/אֱהִ֥י שֹׂבֵ֖ר בַּ/חוֹמָ֑ה וָ/אָשׁ֗וּב וָ/אָב֛וֹא בְּ/שַׁ֥עַר הַ/גַּ֖יְא וָ/אָשֽׁוּב׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/002/015.yaml
  text: So I went up by the wadi at night and inspected the wall[a]. Then I turned back and entered by the Valley Gate[b], and returned.
translation:
  language: ta
  text: ஆகவே, இரவில் நான் பள்ளத்தாக்கின் வழியாக மேலே சென்று மதிலை ஆராய்ந்தேன்[a]. பின்னர் திரும்பி, பள்ளத்தாக்கு வாசல் வழியாக உள்ளே நுழைந்து, திரும்பினேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ஆராய்ந்தேன்,” “பரிசோதித்தேன்,” அல்லது “ஆய்வு செய்தேன்” என்றும் மொழிபெயர்க்கலாம். இங்குள்ள எபிரெய வினைச்சொல் வழக்கமாக “உடைத்தல்” என்று பொருள்படும்; ஆனால் இச்சூழலில் சேதமடைந்த மதிலை நெகேமியா ஆராய்ந்ததைக் குறிப்பதாகப் பரவலாகப் புரிந்துகொள்ளப்படுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֹלֶה
  choice: மேலே சென்று
  rationale: היה உடன் வரும் participle இங்கு தொடர்ச்சியான பாதைச் செயலை விவரிக்கிறது; நவீன தமிழில் ‘மேலே சென்று’ இயல்பாகவும் இடப்பெயர்ச்சியைத் தெளிவாகவும் தருகிறது.
- source_word: בַנַּחַל
  choice: ஓடையின் வழியாக
  rationale: נחל என்பது பொதுவாக பள்ளத்தாக்கில் ஓடும் பருவகால நீரோடை அல்லது அதன் படுகையைக் குறிக்கும். ‘ஓடை’ சாதாரண வாசகருக்குப் புரியும்; ‘வழியாக’ இதை பயணப் பாதையாக எடுத்துக்காட்டுகிறது, ஆனால் துல்லிய நிலவியல் குறித்த சிறு தெளிவின்மையை அடிக்குறிப்பு காக்கிறது.
- source_word: לַיְלָה
  choice: இரவில்
  rationale: காலத்தைக் குறிக்கும் இயல்பான நவீன தமிழ் வடிவம்.
- source_word: שֹׂבֵר
  choice: ஆராய்ந்தேன்
  rationale: שבר வழக்கமாக ‘உடைத்தல்’ என்று பொருள்படும்; ஆனால் இச்சூழலில் நெகேமியா சேதமடைந்த மதிலைப் பார்வையிட்டு மதிப்பிடுகிறார். ‘ஆராய்ந்தேன்’ அந்தச் சூழல்சார் பொருளைத் தருகிறது; மூலச்சொல்லின் சிக்கல் அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
- source_word: בַּחוֹמָה
  choice: மதிலை
  rationale: எபிரெய ஒருமையையும் குறிப்பிட்ட நகர அரண் மதிலையும் இயல்பான தமிழில் காக்கிறது.
- source_word: וָאָשׁוּב (முதல் occurrence)
  choice: திரும்பி
  rationale: பயணத்தின் திசையை மாற்றியதைச் சுருக்கமாகவும் இயல்பாகவும் காட்டுகிறது.
- source_word: וָאָבֹוא בְּשַׁעַר הַגַּיְא
  choice: பள்ளத்தாக்கு வாசல் வழியாக நுழைந்து
  rationale: בוא இங்கு வாசல் வழியாக உள்ளே வருவதைச் சுட்டுகிறது; שער הגיא என்பது பெயரிடப்பட்ட நகர வாசல் என்பதால் ‘பள்ளத்தாக்கு வாசல்’ என வழங்கப்படுகிறது.
- source_word: וָאָשׁוּב (இறுதி occurrence)
  choice: வந்த இடத்திற்குத் திரும்பினேன்
  rationale: இறுதி שוב பயணம் முடிந்து தொடங்கிய இடத்துக்குத் திரும்பியதைச் சூழல் காட்டுகிறது. தமிழில் வெறும் ‘திரும்பினேன்’ என்பதால் முந்தைய திரும்புதலுடன் குழப்பம் ஏற்படலாம்; சேர்க்கப்பட்ட சொற்கள் விளக்கத்துக்காக இருந்தாலும் புதிய இடத்தை நிர்ணயிப்பதில்லை.
