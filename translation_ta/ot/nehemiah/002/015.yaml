translation_notes:
  register: மொழிநடை நவீன, மரியாதைமிக்க, பொதுவாசகருக்குப் புரியும் தரநிலைத் தமிழ். ‘வாடி’ என்ற கடன்சொல்லுக்குப் பதிலாக இயல்பான ‘ஓடை’ பயன்படுத்தப்பட்டுள்ளது. ‘பள்ளத்தாக்கு வாசல்’ ஓர் இடப்பெயராகத் தலைப்புமுறையில் வழங்கப்பட்டுள்ளது. ஆங்கில அடுக்கிலிருந்த b அடிக்குறிப்பு ‘wadi’ என்ற ஆங்கிலச் சொல்லை விளக்குவதால் தமிழ் உரைக்கு அவசியமில்லை; எனவே சேர்க்கப்படவில்லை.
