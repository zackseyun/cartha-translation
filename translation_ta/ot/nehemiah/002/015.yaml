revisions:
- from: ஆகவே, இரவில் நான் ஓடையின் வழியாக மேலே சென்று, மதிலை ஆராய்ந்தேன்[a]. பிறகு திரும்பி, பள்ளத்தாக்கு வாசல் வழியாக நுழைந்து, வந்த இடத்திற்குத் திரும்பினேன்.
  to: ஆகவே, இரவில் நான் பள்ளத்தாக்கின் வழியாக மேலே சென்று மதிலை ஆராய்ந்தேன்[a]. பின்னர் திரும்பி, பள்ளத்தாக்கு வாசல் வழியாக உள்ளே நுழைந்து, திரும்பினேன்.
  rationale: The revision removes the unsupported identification of the final destination and uses “பள்ளத்தாக்கு” for נחל so as not to imply a permanently flowing stream. It retains the contextual rendering of the difficult verb שֹׂבֵר and preserves the repeated return language without forcing a destination.
