source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר לִ/י֙ הַ/מֶּ֔לֶךְ עַל מַה זֶּ֖ה אַתָּ֣ה מְבַקֵּ֑שׁ וָֽ/אֶתְפַּלֵּ֔ל אֶל אֱלֹהֵ֖י הַ/שָּׁמָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/002/004.yaml
  text: Then the king said to me, “What is it that you are seeking?” So I prayed to the God of heaven.
translation:
  language: ta
  text: அப்போது அரசன் என்னிடம், “நீ என்ன கேட்கிறாய்?” என்றான். நான் வானத்தின் கடவுளிடம் ஜெபித்தேன்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מְבַקֵּשׁ
  choice: கேட்கிறாய்
  rationale: இச்சூழலில் அரசனிடம் முன்வைக்கவிருக்கும் வேண்டுகோளை இயல்பான தமிழில் குறிக்கிறது; ‘தேடுகிறாய்’ என்ற சொற்சார்ந்த பொருள் இங்கு இயல்பாகாது.
- source_word: וָאֶתְפַּלֵּל
  choice: உடனே நான் ... மன்றாடினேன்
  rationale: வினைச்சொல் கடவுளிடம் ஜெபிப்பதைச் சுட்டுகிறது; அரசனுக்குப் பதிலளிக்கும் முன் நெகேமியா செய்த சுருக்கமான வேண்டுதலை ‘மன்றாடினேன்’ தெளிவாக வெளிப்படுத்துகிறது.
- source_word: אֱלֹהֵי הַשָּׁמָיִם
  choice: பரலோகத்தின் கடவுள்
  rationale: எபிரேய அடைமொழியின் வடிவத்தையும் உயரிய, இயல்பான தமிழ் நடையையும் பேணுகிறது.
theological_decisions:
- issue: அரசனுடனான உரையாடலின் நடுவே நிகழ்ந்த ஜெபத்தின் தன்மை
  choice: ‘உடனே ... மன்றாடினேன்’ என்று மட்டும் கூறி, ஜெபம் வாய்மொழியா அல்லது மனத்திற்குள் செய்யப்பட்டதா என்பதைத் தீர்மானிக்கவில்லை.
  alternative: ‘மனத்திற்குள் ஜெபித்தேன்’
  rationale: மூலவசனம் ஜெபத்தின் முறை அல்லது நீளத்தை வெளிப்படையாகக் கூறாததால் அந்தத் தெளிவின்மையைப் பேணுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான, சுருக்கமான உரை. நேரடி பேச்சில் இயல்பான ‘நீ’ பயன்பாடு அரசன் தன் அதிகாரியிடம் பேசும் சூழலுக்கு ஏற்றது.
