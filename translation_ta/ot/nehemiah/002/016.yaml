base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/002/016.yaml
  text: But the officials did not know where I had gone or what I was doing[a], and until then I had not told the Jews, the priests, the nobles, the officials, or the rest who were doing the work.
translation:
  language: ta
  text: ஆனால், நான் எங்கே போயிருந்தேன், என்ன செய்துகொண்டிருந்தேன் என்பது அதிகாரிகளுக்குத் தெரியவில்லை. அதுவரை யூதர்களுக்கும்[a] ஆசாரியர்களுக்கும் உயர்குடியினருக்கும் அதிகாரிகளுக்கும் வேலையைச் செய்துகொண்டிருந்த மற்றவர்களுக்கும் நான் சொல்லவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யூதேய மக்களுக்கும்.” எபிரெயச் சொல் יְהוּדִים, யூதா பகுதியைச் சேர்ந்த மக்களையோ யூத சமூகத்தையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַסְּגָנִים
  choice: அதிகாரிகள்
  rationale: சְגָנִים என்பது கீழ்நிலை ஆட்சியாளர்கள் அல்லது நிர்வாக அதிகாரிகளைக் குறிக்கிறது. குறிப்பிட்ட பாரசீக நிர்வாகப் பதவியைத் தேவையின்றி வரையறுக்காமல், வசனத்தின் இரு இடங்களிலும் இயல்பாகப் பொருந்துகிறது.
- source_word: יָדְעוּ
  choice: அறிந்திருக்கவில்லை
  rationale: ידע என்பதன் அடிப்படைப் பொருள் ‘அறிதல்.’ நேகேமியாவின் முந்தைய செயல்கள் அதிகாரிகளுக்குத் தெரியாமல் இருந்ததைக் கடந்தகாலச் சூழலில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: אָנָה הָלַכְתִּי
  choice: நான் எங்கே போயிருந்தேன்
  rationale: אָנָה சென்ற இடம் அல்லது திசையைக் குறிக்கிறது; הָלַכְתִּי விவரிக்கப்படும் நேரத்துக்கு முன் நிகழ்ந்த பயணத்தைச் சுட்டுகிறது.
- source_word: וּמָה אֲנִי עֹשֶׂה
  choice: என்ன செய்துகொண்டிருந்தேன்
  rationale: עֹשֶׂה என்னும் பங்கேற்புவினை தொடர்ந்துகொண்டிருந்த செயலைக் குறிக்க முடியும். தமிழ் வாக்கியத்தில் முதல் வினாவுடன் இயல்பாக இணைகிறது.
- source_word: לַיְּהוּדִים
  choice: யூதர்களுக்கும்
  rationale: יְהוּדִים என்பது யூத சமூகத்தையோ, பிராந்திய அடிப்படையில் யூதேய மக்களையோ குறிக்கலாம். பொதுவாகப் புரிந்துகொள்ளப்படும் ‘யூதர்கள்’ முதன்மை உரையில் வைக்கப்பட்டு, உண்மையான சொற்பொருள் மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: לַכֹּהֲנִים
  choice: ஆசாரியர்களுக்கும்
  rationale: כֹּהֲנִים என்பதற்கான நேரடியான, வழக்கமான தமிழ் வேதாகமச் சொல்.
- source_word: לַחֹרִים
  choice: உயர்குடியினருக்கும்
  rationale: இந்தச் சமூக-நிர்வாகச் சூழலில் חֹרִים சமூகத் தலைமை அல்லது உயர்நிலையைக் கொண்டவர்களைக் குறிக்கிறது. ‘உயர்குடியினர்’ இதை இயல்பாகச் சொல்கிறது; ‘சுதந்திரமானவர்கள்’ என்ற சொற்பிறப்புச் சார்ந்த பொருளைத் தவறாக முன்னிறுத்துவதில்லை.
- source_word: וּלְיֶתֶר עֹשֵׂה הַמְּלָאכָה
  choice: வேலையைச் செய்துகொண்டிருந்த மற்றவர்களுக்கும்
  rationale: יֶתֶר மீதமுள்ள மற்றவர்களைக் குறிக்கிறது; ஒருமை வடிவிலுள்ள பங்கேற்புவினை இங்கு கூட்டுப் பொருளில் வேலையில் ஈடுபட்டவர்களைக் குறிப்பிடுகிறது.
- source_word: עַד כֵּן
  choice: அதுவரை
  rationale: நேகேமியா தகவலைத் தெரிவிக்காமல் வைத்திருந்த கால எல்லையைச் சுருக்கமாகவும் இயல்பாகவும் காட்டுகிறது.
- source_word: הִגַּדְתִּי
  choice: நான் சொல்லவில்லை
  rationale: נגד என்பதன் ஹிஃபில் வடிவம் ‘சொல்லுதல், அறிவித்தல்’ என்று பொருள்படும். இங்கு பட்டியலிடப்பட்ட குழுக்களிடம் தகவலைப் பகிராததை எளிய நடையில் வெளிப்படுத்துகிறது.
