  text: Then the king said to me[a], while the queen was sitting beside him, “How long will your journey be, and when will you return?” So it pleased the king to send me, and I gave him a time.
translation:
  language: ta
  text: அப்போது அரசன் என்னிடம்—அரசி அவன் அருகில் அமர்ந்திருந்தாள்—“உன் பயணம் எவ்வளவு காலம் நீடிக்கும்? நீ எப்போது திரும்பி வருவாய்?” என்று கேட்டான். என்னை அனுப்புவது அரசனுக்கு விருப்பமாயிருந்தது; நான் அவனுக்குக் குறிப்பிட்ட ஒரு காலத்தைக் கூறினேன்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַמֶּלֶךְ
  choice: அரசன்
  rationale: கதைச் சூழலில் அரசாட்சியாளரைக் குறிக்கும் מֶלֶךְ என்பதற்கான இயல்பான நவீனத் தமிழ் சொல்.
- source_word: הַשֵּׁגַל
  choice: அரசி
  rationale: அரசனின் அரச துணைவியைக் குறிக்கும் அரிதான எபிரெயச் சொல். தமிழில் இயல்பாகவும் அரச நிலையைக் காக்கும் வகையிலும் ‘அரசி’ பயன்படுத்தப்பட்டுள்ளது; இன்னும் குறிப்பான பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: יוֹשֶׁבֶת אֶצְלוֹ
  choice: அவன் அருகில் அமர்ந்திருந்தாள்
  rationale: பெண்பால் நிகழ்காலப் பங்கேற்புச் சொல் காட்டும் பின்னணிச் செயற்பாட்டையும் אֵצֶל காட்டும் அருகாமையையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: עַד מָתַי יִהְיֶה מַהֲלָכֲךָ
  choice: உன் பயணம் எவ்வளவு காலம் நீடிக்கும்?
  rationale: பயணத்தின் கால அளவைக் கேட்கும் எபிரெயச் சொல்லமைப்பைத் தெளிவான, இயல்பான தமிழில் தருகிறது.
- source_word: וּמָתַי תָּשׁוּב
  choice: நீ எப்போது திரும்பி வருவாய்?
  rationale: שׁוּב என்பதன் ‘திரும்புதல்’ என்ற அடிப்படைப் பொருளையும் கேள்வியின் எதிர்கால நோக்கையும் காக்கிறது.
- source_word: וַיִּיטַב לִפְנֵי הַמֶּלֶךְ
  choice: என்னை அனுப்புவது அரசனுக்கு விருப்பமாயிருந்தது
  rationale: சொல்லுக்குச் சொல் ‘அரசனின் முன்னிலையில் நல்லதாக இருந்தது’ என்ற எபிரெய மரபுத்தொடர் அரசனின் ஒப்புதல் அல்லது விருப்பத்தைக் குறிக்கிறது; தமிழில் இயல்பாக மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: וַיִּשְׁלָחֵנִי
  choice: என்னை அனுப்புவது
  rationale: முந்தைய ஒப்புதல் மரபுத்தொடருடன் தொடர்ச்சியாக இணைத்து, அரசன் நெகேமியாவை அனுப்ப ஒப்புக்கொண்டான் என்ற பொருளை வெளிப்படுத்துகிறது.
- source_word: וָאֶתְּנָה לוֹ זְמָן
  choice: நான் அவனுக்கு ஒரு காலக்கெடுவைக் குறிப்பிட்டேன்
  rationale: זְמָן என்பது குறிப்பிட்ட அல்லது நிர்ணயிக்கப்பட்ட காலத்தைக் குறிக்கிறது. அரசன் கேட்டது பயணமும் திரும்பும் நேரமும் என்பதால், ‘காலக்கெடு’ சூழலுக்கேற்ற தெளிவான தமிழ்; எபிரெயில் காலத்தின் சரியான நீளம் கூறப்படவில்லை.
