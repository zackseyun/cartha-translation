source:
  edition: WLC
  text: וַ/יֹּאמֶר֩ לִ֨/י הַ/מֶּ֜לֶךְ מַדּ֣וּעַ פָּנֶ֣י/ךָ רָעִ֗ים וְ/אַתָּה֙ אֵֽינְ/ךָ֣ חוֹלֶ֔ה אֵ֣ין זֶ֔ה כִּי אִ֖ם רֹ֣עַֽ לֵ֑ב וָ/אִירָ֖א הַרְבֵּ֥ה מְאֹֽד׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/002/002.yaml
  text: And the king said to me[a], “Why is your face sad[b], though you are not sick? This is nothing but sadness of heart.” Then I was very much afraid.
translation:
  language: ta
  text: அரசன் என்னிடம், “நீ நோயுற்றிருக்கவில்லை; அப்படியிருக்க உன் முகம் ஏன் வாடியிருக்கிறது?[a] இது மனவேதனையே[b]; வேறொன்றுமில்லை” என்றான். அப்போது நான் மிகவும் பயந்தேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயில் சொல்லுக்குச் சொல், “உன் முகம் மோசமாக இருக்கிறது.” இது சோகமான அல்லது கலக்கமுற்ற முகத்தோற்றத்தைக் குறிக்கும் மரபுத்தொடர்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயில் சொல்லுக்குச் சொல், “இதயத்தின் தீமை/கேடு.” இங்கு அது ஒழுக்கத் தீமையை அல்ல, உள்ளார்ந்த துயரம் அல்லது மனக்கலக்கத்தைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַדּוּעַ
  choice: ஏன்
  rationale: காரணத்தை வினவும் எபிரெயச் சொல்லுக்கு இயல்பான, நேரடியான நவீனத் தமிழ் இணை.
- source_word: פָּנֶיךָ רָעִים
  choice: உன் முகம் வாடியிருக்கிறது
  rationale: சொல்லுக்குச் சொல் ‘உன் முகம் மோசமாக இருக்கிறது’; இங்கு சோகம் அல்லது மனக்கலக்கத்தை வெளிப்படுத்தும் முகத்தோற்றத்தைக் குறிக்கும் மரபுத்தொடர். ‘முகம் வாடியிருக்கிறது’ என்பது தமிழில் இயல்பாக அந்தப் பொருளைத் தருகிறது.
- source_word: חוֹלֶה
  choice: உடல்நோய்
  rationale: நோயுற்ற நிலையைக் குறிக்கிறது. அடுத்துள்ள ‘மனவேதனை’ என்பதுடன் உடல்–உள்ளம் வேறுபாட்டைத் தெளிவாகக் காட்ட ‘உடல்நோய்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: אֵין זֶה כִּי אִם
  choice: இது ... அன்றி வேறொன்றுமில்லை
  rationale: மற்ற எல்லா விளக்கங்களையும் விலக்கி அரசன் கூறும் முடிவை, எபிரெயக் கட்டமைப்பின் வலியுறுத்தலுடன் இயல்பான தமிழில் தருகிறது.
- source_word: רֹעַ לֵב
  choice: மனவேதனை
  rationale: சொல்லுக்குச் சொல் ‘இதயத்தின் தீமை/கேடு’; சூழலில் ஒழுக்கத் தீமையை அல்ல, உள்ளார்ந்த துயரத்தையோ கலக்கத்தையோ குறிக்கிறது. ‘மனவேதனை’ அந்தச் சூழற்பொருளைத் துல்லியமாகக் காட்டுகிறது.
- source_word: וָאִירָא
  choice: அப்போது நான் ... பயந்தேன்
  rationale: தொடர்ந்து நிகழ்ந்த செயலைக் குறிக்கும் wayyiqtol வடிவத்தின் கதையோட்டத்தை ‘அப்போது’ இயல்பாகக் காட்டுகிறது.
- source_word: הַרְבֵּה מְאֹד
  choice: மிகவும்
  rationale: இரட்டை வலியுறுத்தலால் அச்சத்தின் தீவிரம் வெளிப்படுகிறது; நவீனத் தமிழில் ‘மிகவும்’ இயல்பாகவும் போதிய வலிமையுடனும் உள்ளது.
theological_decisions:
- issue: רֹעַ לֵב என்பதன் பொருள்
  choice: ஒழுக்கத் தீமையல்ல, உள்ளார்ந்த மனவேதனை
  alternative: தீய இதயம் / இதயத்தின் தீமை
  rationale: அரசன் உடல்நோயை உள்ளார்ந்த துயரத்துடன் வேறுபடுத்திப் பேசும் சூழல், இங்கு உணர்ச்சிசார் வேதனையே குறிக்கப்படுவதை ஆதரிக்கிறது; இருப்பினும் மூலச்சொல்லின் நேரடிப் பொருள் அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகருக்குப் புரியும் வகையிலும் வேதாகம உரைக்கு ஏற்ற கண்ணியமான நடையிலும் மொழிபெயர்க்கப்பட்டது. ‘முகம் வாடுதல்’ என்ற இயல்பான தமிழ்த் தொடர் தேர்ந்தெடுக்கப்பட்டு, மூல எபிரெயின் நேரடித் தன்மை அடிக்குறிப்பில் பாதுகாக்கப்பட்டது.
