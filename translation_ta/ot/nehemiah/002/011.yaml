  yaml_path: translation/ot/nehemiah/002/011.yaml
  text: So I came to Jerusalem and was there three days.
translation:
  language: ta
  text: பின்பு நான் எருசலேமுக்கு வந்து, அங்கே மூன்று நாட்கள் இருந்தேன்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וָאָבוֹא
  choice: அப்படியே நான் ... வந்து
  rationale: வாவ் தொடர் வடிவம் கதையின் அடுத்த நிகழ்வை முன்னெடுக்கிறது. முன் நிகழ்வின் தொடர்ச்சியையும் இயல்பான தமிழ் நடையையும் ‘அப்படியே’ வெளிப்படுத்துகிறது; முதல் நபர் வருகையும் தெளிவாக உள்ளது.
- source_word: אֶל
  choice: -க்கு
  rationale: இயக்கத்தைக் குறிக்கும் வினையுடன் אֶל சென்றடையும் இடத்தைக் குறிக்கிறது; தமிழில் ‘எருசலேமுக்கு’ என்பது இயல்பான இணை.
- source_word: יְרוּשָׁלִָם
  choice: எருசலேம்
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் நிலைபெற்றுள்ள இடப்பெயர் வடிவம்.
- source_word: וָאֱהִי
  choice: இருந்தேன்
  rationale: היה என்பதன் அடிப்படைப் பொருளான ‘இரு’ என்பதைப் பேணுகிறது. שָׁם மற்றும் கால அளவுடன் சேர்ந்து, அந்த இடத்தில் தங்கியிருந்ததைக் சூழல் உணர்த்துகிறது.
- source_word: שָׁם
  choice: அங்கே
  rationale: எருசலேமைக் குறிப்பதாகிய இயல்பான தமிழ் இடவினையடை.
- source_word: יָמִים שְׁלֹשָׁה
  choice: மூன்று நாட்கள்
  rationale: கால நீட்சியைக் குறிக்கும் எபிரெயச் சொற்றொடருக்கு நேரான, இயல்பான தமிழ் இணை; ‘இருந்தேன்’ என்பதுடன் கால அளவு தெளிவாகிறது.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழில் எளிமையும் கண்ணியமும் கொண்ட முதல் நபர் வரலாற்று நடை. எபிரெய மூலத்தின் சுருக்கத்தையும் நிகழ்வுகளின் தொடர்ச்சியையும் பேணுகிறது.
