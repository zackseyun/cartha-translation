base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/002/014.yaml
  text: Then I went on to the Fountain Gate and to the King’s Pool[b][a], but there was no place for the animal under me to pass.
translation:
  language: ta
  text: பின்பு நான் ஊற்று வாசலுக்கும்[a] ராஜாவின் குளத்துக்கும் சென்றேன்; ஆனால் எனக்குக் கீழிருந்த விலங்கு கடந்து செல்வதற்கு இடமில்லை.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘நீரூற்று வாசல்’ என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் ஓர் ஊற்றையோ நீரூற்றையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: சொல்லுக்குச் சொல், ‘எனக்குக் கீழிருந்த விலங்கு கடந்து செல்வதற்கு.’ இது நெகேமியா சவாரி செய்துகொண்டிருந்த விலங்கைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶעֱבֹר
  choice: பின்பு நான் ... சென்றேன்
  rationale: עבר என்பது கடத்தல், கடந்துசெல்லுதல், தொடர்ந்து செல்லுதல் ஆகிய பொருள்களைக் கொண்டது. இரவுநேர ஆய்வுப் பயணத்தின் தொடர்ச்சியை இயல்பான தமிழில் காட்ட ‘சென்றேன்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: שַׁעַר הָעַיִן
  choice: ஊற்று வாசல்
  rationale: עַיִן என்பதற்கு ‘கண்’ என்றும் ‘நீரூற்று’ என்றும் பொருள் உண்டு. இங்கு எருசலேமின் நிலவியல் சார்ந்த வாசலின் பெயராக வருவதால் நீரூற்றைக் குறிக்கும் பொருள் ஏற்றது.
- source_word: בְּרֵכַת הַמֶּלֶךְ
  choice: ராஜாவின் குளம்
  rationale: בְּרֵכָה என்பது குளம் அல்லது நீர்த்தேக்கத்தைக் குறிக்கும். இடப்பெயரின் நேரடியான உடைமைத் தொடரை ‘ராஜாவின் குளம்’ இயல்பாகப் பிரதிபலிக்கிறது.
- source_word: וְאֵין מָקוֹם
  choice: ஆனால் ... இடமில்லை
  rationale: וְ என்பது அடிப்படையில் இணைப்புச் சொல்; இங்கு இடமின்மை பயணத்தைத் தடுத்ததால் அதன் எதிர்மறைத் தொடர்பை ‘ஆனால்’ தெளிவாக வெளிப்படுத்துகிறது.
- source_word: לַבְּהֵמָה
  choice: விலங்கு
  rationale: בְּהֵמָה என்பது பொதுவாக விலங்கைக் குறிக்கிறது. அது சவாரி விலங்கு என்பது சூழலால் தெரிந்தாலும், மூலத்தில் இனமோ வகையோ குறிப்பிடப்படாததால் பொதுப் பெயர் காக்கப்பட்டது.
- source_word: לַעֲבֹר
  choice: கடந்து செல்வதற்கு
  rationale: עבר என்ற வினையின் இடம்சார்ந்த நகர்வைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: תַּחְתָּי
  choice: எனக்குக் கீழிருந்த
  rationale: மூலத்தின் ‘எனக்குக் கீழே’ என்ற நேரடிப் படிமத்தைப் பாதுகாத்து, தமிழில் அது விலங்கை இயல்பாகத் தழுவுமாறு வினையெச்ச வடிவில் அமைக்கப்பட்டது.
