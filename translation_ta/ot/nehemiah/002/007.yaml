base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/002/007.yaml
  text: Then I said to the king[a], “If it pleases the king, let letters be given to me for the governors Beyond the River[c][b], so that they may let me pass through until I come to Judah.”
translation:
  language: ta
  text: பின்பு நான் அரசனிடம், “அரசனுக்கு விருப்பமானால், நான் யூதாவுக்கு வந்து சேரும்வரை அவர்கள் என்னைக் கடந்து செல்ல அனுமதிக்கும்படி, ஆற்றுக்கு அப்பாலுள்ள ஆளுநர்களுக்குக் கடிதங்கள் எனக்குக் கொடுக்கப்படட்டும்[a]” என்றேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ஆற்றுக்கு அப்பால்” என்பது ஐபிராத்து ஆற்றுக்கு மேற்கே இருந்த பகுதியைக் குறிக்கும் பாரசீக நிர்வாகப் பெயர்.
    reason: cultural_note
lexical_decisions:
- source_word: וָאֹמַר
  choice: பின்பு நான் … என்றேன்
  rationale: வாவ் தொடர்வினை கதைநிகழ்வை அடுத்த கட்டத்துக்கு நகர்த்துகிறது; ‘பின்பு’ என்பது இயல்பான தமிழ் வரிசையைக் காட்டுகிறது.
- source_word: אִם עַל־הַמֶּלֶךְ טוֹב
  choice: அரசனுக்கு விருப்பமானால்
  rationale: அரசவைக்குரிய பணிவான வேண்டுகோள் மொழியை இயல்பாகவும் நேரடியாகவும் வெளிப்படுத்துகிறது.
- source_word: אִגְּרוֹת יִתְּנוּ לִי
  choice: கடிதங்களை எனக்குக் கொடுக்கட்டும்
  rationale: கடிதங்கள் அதிகாரபூர்வமானவை என்பது அரசன் மற்றும் ஆளுநர்கள் குறித்த சூழலால் தெளிவாகிறது; மூலத்தின் பணிவான மூன்றாம் நபர் வேண்டுகோளையும் ‘கொடுக்கட்டும்’ காக்கிறது.
- source_word: פַּחֲוֹת
  choice: ஆளுநர்கள்
  rationale: பாரசீக நிர்வாக அதிகாரிகளைக் குறிக்கும் சொல்லுக்கு வழக்கமான, தெளிவான தமிழ் இணை.
- source_word: עֵבֶר הַנָּהָר
  choice: ஆற்றுக்கு அப்பால்
  rationale: ஐபிராத்து ஆற்றின் மேற்குப் பகுதியைக் குறித்த பாரசீக நிர்வாகப் பெயரைச் சொற்பொருளுக்கு நெருக்கமாக வழங்குகிறது; வரலாற்றுப் பொருள் அடிக்குறிப்பில் விளக்கப்படுகிறது.
- source_word: אֲשֶׁר יַעֲבִירוּנִי
  choice: என்னைக் கடந்து செல்ல அனுமதிக்கும்படி
  rationale: ஹிபில் வடிவம் இச்சூழலில் அவர்களது ஆட்சிப் பகுதிகள் வழியாகப் பயணிக்க அனுமதி வழங்குவதைக் குறிக்கிறது.
- source_word: עַד אֲשֶׁר אָבוֹא
  choice: நான் … வந்து சேரும்வரை
  rationale: இலக்கை அடையும் வரையிலான கால எல்லையை இயல்பான தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: יְהוּדָה
  choice: யூதா
  rationale: மூலத்திலுள்ள இடப்பெயரை வரலாற்றுக் காலத்துக்கு ஏற்ற வகையில் ஒலிபெயர்க்கிறது; ‘யூதேயா’ எனும் பிற்கால வடிவத்தைத் தவிர்க்கிறது.
