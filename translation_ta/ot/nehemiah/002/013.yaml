  yaml_path: translation/ot/nehemiah/002/013.yaml
  text: So I went out by night through the Valley Gate[a], toward the Dragon Spring and toward the Dung Gate[b], and I inspected the walls of Jerusalem that had been broken down and its gates that had been consumed by fire.
translation:
  language: ta
  text: ஆகவே நான் இரவில் பள்ளத்தாக்கு வாசல் வழியாக வெளியேறி, பெருஞ்சர்ப்ப ஊற்றை[a] நோக்கியும் குப்பை வாசலை நோக்கியும் சென்றேன். இடிக்கப்பட்டிருந்த எருசலேமின் மதில்களையும், நெருப்பில் எரிந்து அழிந்திருந்த அதன் வாசல்களையும் நான் ஆராய்ந்தேன்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “சர்ப்ப ஊற்று” அல்லது “குள்ளநரி ஊற்று” என்றும் மொழிபெயர்க்கலாம். இவ்விடப்பெயரில் உள்ள எபிரெயச் சொல் பெருஞ்சர்ப்பம், சர்ப்பம் அல்லது அதுபோன்ற ஓர் உயிரினத்தைக் குறிக்கக்கூடும்.
    reason: lexical_alternative
  - marker: b
    text: “நான் ஆராய்ந்தேன்” என்று மொழிபெயர்க்கப்பட்டுள்ள எபிரெயச் சொல்லமைப்பு கடினமானது; அதன் வழக்கமான சொற்பொருள் “நான் உடைத்துக்கொண்டிருந்தேன்” என்பதற்கு நெருக்கமானது. இச்சூழலில் நெகேமியா சேதமடைந்த மதில்களைக் கூர்ந்து பார்வையிட்டதாகப் புரிந்துகொள்ளப்படுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֵצְאָה
  choice: ஆகவே நான் ... புறப்பட்டு
  rationale: முதலாம் நபர் ஒருமை தொடர்நிகழ்வு வடிவம்; முந்தைய வசனத்துடன் உள்ள கதைத் தொடரை இயல்பான தமிழில் காட்டுகிறது.
- source_word: בְּשַׁעַר הַגַּיְא
  choice: பள்ளத்தாக்கு வாசல் வழியாக
  rationale: இயக்கச் சூழலில் בְּ என்பது வாசலின் வழியாகச் செல்வதைக் குறிக்கிறது; הַגַּיְא என்பது பள்ளத்தாக்கு அல்லது கணவாய்.
- source_word: לַיְלָה
  choice: இரவில்
  rationale: காலத்தைக் குறிக்கும் வினையடைப் பயன்பாட்டை இயல்பான தமிழில் தருகிறது.
- source_word: וְאֶל־פְּנֵי עֵין הַתַּנִּין
  choice: வலுசர்ப்ப ஊற்றை நோக்கி
  rationale: עֵין இங்கு நீரூற்று; תַּנִּין என்பதன் சர்ப்பம்/பெருஞ்சர்ப்பம்/வலுசர்ப்பம் போன்ற பொருள் வரம்பை இடப்பெயரில் ஓரளவு காக்கிறது. אֶל־פְּנֵי பாதை விவரிப்பில் திசையைக் குறிக்கிறது.
- source_word: שַׁעַר הָאַשְׁפֹּת
  choice: எருக்குவாசல்
  rationale: אַשְׁפֹּת என்பது கழிவு அல்லது எருக் குவியலைக் குறிக்கிறது; வாசலின் பெயராகச் சுருக்கமான, கண்ணியமான தமிழாக்கம்.
- source_word: וָאֱהִי שֹׂבֵר
  choice: நான் ஆராய்ந்தேன்
  rationale: שֹׂבֵר வழக்கமாக ‘உடைத்தல்’ என்று பொருள்பட்டாலும், இச்சூழலில் நெகேமியா சேதமடைந்த மதில்களைப் பார்வையிட்டு ஆராய்வதையே குறிக்கிறது; கடினமான எபிரெய வெளிப்பாடு அடிக்குறிப்பில் சுட்டப்படுகிறது.
- source_word: בְּחוֹמֹת יְרוּשָׁלַםִ אֲשֶׁר הַמְפֹרָצִים
  choice: இடிக்கப்பட்டிருந்த எருசலேமின் மதில்கள்
  rationale: פרץ சார்ந்த சொல்லுரு மதில்கள் உடைக்கப்பட்டு பிளவுபட்ட அல்லது தகர்க்கப்பட்ட நிலையைக் குறிக்கிறது.
- source_word: וּשְׁעָרֶיהָ אֻכְּלוּ בָאֵשׁ
  choice: நெருப்பால் எரித்தழிக்கப்பட்டிருந்த அதன் வாசல்கள்
  rationale: ‘நெருப்பால் உண்ணப்பட்டன’ என்ற எபிரெய உருவகத்தை இயல்பான தமிழில் அதன் முழுமையான அழிவுணர்வோடு தருகிறது.
