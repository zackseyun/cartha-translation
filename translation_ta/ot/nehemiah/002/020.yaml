base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/002/020.yaml
  text: Then I answered them and said[a], “The God of heaven, he will make us prosper, and we his servants will arise and build[b]. But you have no share or right or memorial in Jerusalem.”
translation:
  language: ta
  text: 'அதற்கு நான் அவர்களிடம் மறுமொழியாகச் சொன்னேன்: “வானத்தின் கடவுளான அவரே எங்களுக்கு வெற்றி அளிப்பார்[a]. அவருடைய சேவகர்களான நாங்கள் எழுந்து கட்டுவோம். ஆனால் எருசலேமில் உங்களுக்குப் பங்கோ, நியாயமான உரிமையோ[b], நினைவோ[c] இல்லை.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது “எங்களை வெற்றிபெறச் செய்வார்”; “எங்களைச் செழிக்கச் செய்வார்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது “உரிமைக் கோரிக்கையோ.”
    reason: lexical_alternative
  - marker: c
    text: “நினைவுச் சின்னம்” என்றும் மொழிபெயர்க்கலாம். இங்கு நினைவில் நிலைக்கும் அங்கீகாரத்தையும் குறிக்கக்கூடும்.
    reason: ambiguity
lexical_decisions:
- source_word: וָאָשִׁיב אוֹתָם דָּבָר וָאוֹמַר לָהֶם
  choice: அதற்கு நான் அவர்களிடம் மறுமொழியாகச் சொன்னேன்
  rationale: שׁוּב + דָּבָר என்பது சொல்லுக்குச் சொல் ‘ஒரு வார்த்தையைத் திருப்புதல்’ அல்ல; பதிலளித்தல் என்ற எபிரெய மரபுத்தொடர். தொடரும் וָאוֹמַר לָהֶם என்பதையும் இயல்பான தமிழில் இணைக்கிறது.
- source_word: אֱלֹהֵי הַשָּׁמַיִם
  choice: வானத்தின் கடவுள்
  rationale: சிறையிருப்புக்குப் பிந்தைய காலத்தில் காணப்படும் இறைப்பட்டத்தை, எபிரெய பன்மையைத் தமிழில் செயற்கையாகக் காட்டாமல் இயல்பாக வழங்குகிறது.
- source_word: הוּא יַצְלִיחַ לָנוּ
  choice: அவரே எங்களுக்கு வெற்றி அளிப்பார்
  rationale: הוּא என்பதன் வலியுறுத்தலை ‘அவரே’ காட்டுகிறது; צלח என்பதன் ஹிஃபில் வடிவம் முயற்சிக்கு வெற்றியை அருளுதல் அல்லது வெற்றிபெறச் செய்தல் என்ற காரணப் பொருளைக் கொண்டது.
- source_word: עֲבָדָיו
  choice: அவருடைய பணியாளர்கள்
  rationale: இங்கு அடிமைத்தனத்தின் சமூக நிலையை விட கடவுளுக்குரிய கீழ்ப்படிதலும் பணியும் முன்னிலையில் இருப்பதால் ‘பணியாளர்கள்’ பொருத்தமானது.
- source_word: נָקוּם וּבָנִינוּ
  choice: நாங்கள் எழுந்து கட்டுவோம்
  rationale: வேலையை உறுதியாகத் தொடங்கும் தீர்மானத்தையும் எதிர்கால நோக்கையும் காக்கிறது; மூலத்தில் இல்லாத ‘மறுபடியும்’ என்பதைச் சேர்க்கவில்லை.
- source_word: אֵין חֵלֶק
  choice: பங்கோ ... இல்லை
  rationale: חֵלֶק என்பது ஒதுக்கப்பட்ட பங்கு அல்லது உரிய பங்கைக் குறிக்கிறது; ‘பங்கு’ நேரடியும் இயல்பானதும் ஆகும்.
- source_word: וּצְדָקָה
  choice: நியாயமான உரிமையோ
  rationale: இந்த அரசியல்-சட்டச் சூழலில் இது ஒழுக்கநீதியை அல்ல, எருசலேமில் உரிமை கோருவதற்கான நியாயமான அடிப்படையைச் சுட்டுகிறது.
- source_word: וְזִכָּרוֹן
  choice: நினைவுகூரப்படுதலோ
  rationale: זִכָּרוֹן என்பதன் நினைவு, நினைவுச் சின்னம், நினைவில் நிலைக்கும் அங்கீகாரம் ஆகிய பொருள் பரப்பை ஒரே வகையில் பொருள்குறுக்காமல் ஓரளவு திறந்த நிலையில் வைக்கிறது.
theological_decisions:
- issue: கடவுளுக்குரிய עבד என்ற பணிச்சொல்
  choice: பணியாளர்கள்
  alternative: அடிமைகள்
  rationale: எதிரிகளுக்கு மாறாகக் கடவுளுக்குப் பணிந்து, அவரால் அதிகாரம் பெற்றவர்களாகச் செயல்படுவதுதான் இங்கு மையம்; சமூக அடிமைநிலையை வலியுறுத்துவது சூழலுக்கு அப்பாற்பட்ட இறையியல் சுமையை ஏற்றும்.
- issue: விலக்குக் கூற்றிலுள்ள צְדָקָה
  choice: நியாயமான உரிமை
  alternative: நீதி; உரிமைக் கோரிக்கை
  rationale: இச்சொல் இங்கு பொதுவான ஒழுக்கநீதியைக் காட்டாமல், எருசலேமில் அவர்களுக்கு இருக்கும் சட்டபூர்வ அல்லது உறவுசார் உரிமையை மறுக்கிறது. ‘நியாயமான’ என்பது צְדָקָה-வின் நியாய அடிப்படையையும் ‘உரிமை’ அதன் சூழல்சார் செயலையும் காக்கிறது.
- issue: זִכָּרוֹן என்பதன் தெளிவற்ற பரப்பு
  choice: நினைவுகூரப்படுதல்
  alternative: நினைவு; நினைவுச் சின்னம்
  rationale: இது ஒரு பொருள்மயமான நினைவுச் சின்னத்தை மட்டுமே குறிக்கிறதா அல்லது சமூகத்தில் நினைவுறும் நிலையை குறிக்கிறதா என்பது முழுமையாகத் தெளிவில்லை; ஆகவே அந்தத் தெளிவின்மையை மொழிபெயர்ப்பு மற்றும் அடிக்குறிப்பு காக்கின்றன.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. ‘அவரே’ என்ற வடிவம் எபிரெய வலியுறுத்தலைக் காக்கிறது. ‘எழுந்து கட்டுவோம்’ என்பது தீர்மானத்தைக் காட்டும் அதேவேளையில் மூலத்தில் இல்லாத ‘மீண்டும்’ என்பதைச் சேர்ப்பதில்லை. இறுதி மூவுறுப்பின் சட்ட-சமூக நுணுக்கமும் זִכָּרוֹן சொல்லின் உண்மையான தெளிவின்மையும் அடிக்குறிப்புகளுடன் பாதுகாக்கப்பட்டுள்ளன.
