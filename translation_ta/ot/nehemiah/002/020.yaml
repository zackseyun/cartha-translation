revisions:
- from: 'அதற்கு நான் அவர்களிடம் மறுமொழியாகச் சொன்னேன்: “வானத்தின் கடவுளே எங்களுக்கு வெற்றி அளிப்பார்[a]. அவருடைய பணியாளர்களாகிய நாங்கள் எழுந்து கட்டுவோம். ஆனால் எருசலேமில் உங்களுக்குப் பங்கோ, நியாயமான உரிமையோ[b], நினைவுகூரப்படுதலோ[c] இல்லை.”'
  to: 'அதற்கு நான் அவர்களிடம் மறுமொழியாகச் சொன்னேன்: “வானத்தின் கடவுளான அவரே எங்களுக்கு வெற்றி அளிப்பார்[a]. அவருடைய சேவகர்களான நாங்கள் எழுந்து கட்டுவோம். ஆனால் எருசலேமில் உங்களுக்குப் பங்கோ, நியாயமான உரிமையோ[b], நினைவோ[c] இல்லை.”'
  rationale: The revision explicitly represents the emphatic Hebrew pronoun with ‘அவரே,’ uses ‘சேவகர்கள்’ for contextually appropriate divine service, and replaces the cumbersome abstract ‘நினைவுகூரப்படுதல்’ with the natural, semantically open ‘நினைவு.’ Footnote anchors remain attached to the corresponding source expressions.
