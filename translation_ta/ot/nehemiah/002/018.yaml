base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/002/018.yaml
  text: So I told them that the hand of my God was good upon me[a], and also the words of the king that he had spoken to me. And they said[c][b], “Let us rise up and build.” So they strengthened their hands for the good work.
translation:
  language: ta
  text: அப்போது நான் அவர்களிடம், என் தேவனுடைய கை என்மேல் நன்மையாயிருந்ததையும்[a], அரசர் என்னிடம் கூறிய வார்த்தைகளையும் சொன்னேன். அதற்கு அவர்கள், “நாம் எழுந்து கட்டுவோம்!”[b] என்றார்கள். இவ்வாறு அவர்கள் நல்ல பணிக்காகத் தங்கள் கைகளைப் பலப்படுத்தினார்கள்.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என் தேவனுடைய கை எனக்குச் சாதகமாக இருந்ததையும்,” அல்லது “என் தேவன் எனக்குத் தயவாயிருந்ததையும்.” எபிரேயில் நேரடியாக, “என்மேல் நன்மையாயிருந்தது.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “எழுவோம், கட்டுவோம்!”
    reason: lexical_alternative
  - marker: c
    text: எபிரேயில் நேரடியாக, “நன்மைக்காகத் தங்கள் கைகளைப் பலப்படுத்தினார்கள்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאַגִּיד
  choice: அப்போது நான் ... சொன்னேன்
  rationale: வாவ் தொடர்ச்சியால் கதை அடுத்த நிகழ்வுக்கு நகர்கிறது. நெகேமியா மக்களிடம் நடந்தவற்றை எடுத்துரைப்பதால், நவீனத் தமிழில் இயல்பான ‘சொன்னேன்’ பயன்படுத்தப்பட்டது.
- source_word: יַד אֱלֹהַי
  choice: என் தேவனுடைய கை
  rationale: இது தேவனுடைய செயற்படும் வல்லமை அல்லது தயவைக் குறிக்கும் எபிரேய உருவகம். அதை வெறும் ‘தயவு’ என்று விளக்கிவிடாமல் ‘கை’ என்ற உருவகம் தக்கவைக்கப்பட்டது.
- source_word: אֲשֶׁר הִיא טוֹבָה עָלַי
  choice: என்மேல் நன்மையாக இருந்தது
  rationale: ‘என்மேல் நல்லதாக இருந்தது’ என்ற எபிரேயச் சொல்லமைப்பின் பொருளையும் அதன் சற்றே குறிப்பிடத்தக்க உருவகத் தன்மையையும் காக்கிறது; ‘எனக்குத் தயவாயிருந்தது’ என்பது அடிக்குறிப்பில் மாற்றாக வழங்கப்படுகிறது.
- source_word: וְאַף
  choice: '... வார்த்தைகளையும்'
  rationale: தமிழின் ‘-யும்’ இணைப்பு, தேவனுடைய கையைப் பற்றிய செய்தியோடு அரசரின் வார்த்தைகளையும் நெகேமியா கூறியதை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: דִּבְרֵי הַמֶּלֶךְ אֲשֶׁר אָמַר לִי
  choice: அரசர் என்னிடம் கூறிய வார்த்தைகள்
  rationale: ‘வார்த்தைகள்’ மற்றும் தொடர்புப்பிரிவு இரண்டையும் காத்து, தெளிவான நவீனத் தமிழில் தருகிறது.
- source_word: נָקוּם וּבָנִינוּ
  choice: நாம் எழுந்து கட்டுவோம்
  rationale: வடிவில் முதலாம் நபர் பன்மை வினைகள் என்றாலும், சூழலில் அவை கூட்டு உறுதியையும் ஊக்க அழைப்பையும் தெரிவிக்கின்றன. ‘நாம் ... கட்டுவோம்’ இதைத் தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: וַיְחַזְּקוּ יְדֵיהֶם
  choice: தங்கள் கைகளை வலுப்படுத்திக்கொண்டார்கள்
  rationale: தைரியம் கொண்டார்கள் என்று கருத்துரையாகச் சுருக்காமல், மூலத்தின் ‘கைகளை வலுப்படுத்துதல்’ என்ற உருவகம் பாதுகாக்கப்பட்டது.
- source_word: לַטּוֹבָה
  choice: நல்ல பணிக்காக
  rationale: சொல்லுக்கு நேராக ‘நன்மைக்காக’ என்றாலும், சூழலில் அது மதில் கட்டும் நல்ல முயற்சியைக் குறிக்கிறது. தமிழில் பொருள் தெளிவதற்காக ‘பணி’ வெளிப்படையாகச் சேர்க்கப்பட்டது; நேரடி வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: ‘என் தேவனுடைய கை என்மேல் நன்மையாக இருந்தது’ என்ற தெய்வச் செயல் உருவகத்தை மொழிபெயர்த்தல்
  choice: தேவனுடைய ‘கை’ என்ற உருவகத்தைப் பாதுகாத்தல்
  alternative: ‘என் தேவனுடைய தயவு என்மேல் இருந்தது’ அல்லது ‘என் தேவன் எனக்குக் கிருபை செய்தார்’
  rationale: நெகேமியாவின் முயற்சியில் தேவனுடைய செயற்பாட்டையும் அரசரின் ஆதரவையும் வசனம் ஒன்றாகச் சுட்டுகிறது. ‘கை’ என்பதைத் தக்கவைப்பது, தேவனுடைய செயலின் துல்லியமான முறையை அளவுக்கு மீறி வரையறுக்காமல் மூலத்தின் இறையியல் செறிவைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘தேவனுடைய கை’ மற்றும் ‘தங்கள் கைகளை வலுப்படுத்திக்கொண்டார்கள்’ என்ற இணையான உருவகங்கள் பாதுகாக்கப்பட்டுள்ளன. வாசிப்புத் தெளிவுக்காக இறுதிச் சொற்றொடரில் மறைந்துள்ள பணியை ‘நல்ல பணி’ என வெளிப்படுத்தி, நேரடி எபிரேய வடிவம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
