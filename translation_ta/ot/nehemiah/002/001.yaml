translation_notes:
  register: நவீனத் தரத் தமிழில், மரியாதையும் வாசிப்புத் தெளிவும் கொண்ட நடை. அரசவைக் காட்சியைப் பாதுகாக்க ‘அவர் முன்னிலையில்’ என்றும், தேவையற்ற விளக்கச் சேர்க்கையைத் தவிர்க்க திராட்சரசத்தைப் பின்னர் ‘அதை’ என்றும் வழங்கப்பட்டுள்ளது.
