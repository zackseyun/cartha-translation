source:
  edition: WLC
  text: וַ/יְהִ֣י בְּ/חֹ֣דֶשׁ נִיסָ֗ן שְׁנַ֥ת עֶשְׂרִ֛ים לְ/אַרְתַּחְשַׁ֥סְתְּא הַ/מֶּ֖לֶךְ יַ֣יִן לְ/פָנָ֑י/ו וָ/אֶשָּׂ֤א אֶת הַ/יַּ֨יִן֙ וָ/אֶתְּנָ֣/ה לַ/מֶּ֔לֶךְ וְ/לֹא הָיִ֥יתִי רַ֖ע לְ/פָנָֽי/ו׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/002/001.yaml
  text: And it happened in the month of Nisan[a], in the twentieth year of King Artaxerxes, when wine was before him, that I took up the wine and gave it to the king. Now I had not been sad in his presence.
translation:
  language: ta
  text: அர்த்தசஷ்டா அரசனின் ஆட்சியின் இருபதாம் ஆண்டில், நிசான் மாதத்தில், திராட்சரசம் அவர் முன் இருந்தபோது, நான் அதை எடுத்து அரசனுக்குக் கொடுத்தேன். நான் அதற்கு முன் அவர் முன்னிலையில் முகவாட்டத்துடன் இருந்ததில்லை.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இன்னும் நேரடியாக, “நான் அவர் முன் மோசமான தோற்றத்துடன் இருந்ததில்லை.” எபிரெயத்தில் சொல்லுக்குச் சொல், “நான் அவர் முன் மோசமாக இருக்கவில்லை”; இச்சூழலில் இது சோகமான அல்லது முகவாட்டமான தோற்றத்தைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: …போது
  rationale: எபிரெயக் கதைத் தொடரைத் தமிழில் இயல்பான காலச் சூழல் வாக்கியமாக அமைக்கிறது; தனியே ‘நிகழ்ந்தது’ எனக் கூறுவதால் உண்டாகும் செயற்கைத் தன்மையைத் தவிர்க்கிறது.
- source_word: בְּחֹדֶשׁ נִיסָן
  choice: நிசான் மாதத்தில்
  rationale: மாதத்தின் பெயரை ஒலிபெயர்த்து, முறையான காலக் குறிப்பைப் பாதுகாக்கிறது.
- source_word: שְׁנַת עֶשְׂרִים לְאַרְתַּחְשַׁסְתְּא הַמֶּלֶךְ
  choice: அர்தசஷ்டா அரசனின் ஆட்சியின் இருபதாம் ஆண்டில்
  rationale: இது அரசனின் ஆட்சியாண்டைக் குறிக்கும் என்பதை இயல்பான தமிழில் தெளிவாக்குகிறது.
- source_word: יַיִן לְפָנָיו
  choice: திராட்சரசம் அவர் முன் வைக்கப்பட்டிருந்தபோது
  rationale: வினையற்ற எபிரெயச் சொற்றொடரின் காட்சிச் சூழலைத் தமிழில் தெளிவாகத் தருகிறது; ‘திராட்சரசம்’ என்பது יַיִן என்பதற்கான வழக்கமான துல்லியமான தேர்வு.
- source_word: וָאֶשָּׂא אֶת־הַיַּיִן וָאֶתְּנָה לַמֶּלֶךְ
  choice: நான் அதை எடுத்து அரசனுக்குக் கொடுத்தேன்
  rationale: ‘கிண்ணம்’ அல்லது ‘குடிக்க’ என்று மூலத்தில் இல்லாத தகவலைச் சேர்க்காமல், செயல்களின் எளிய தொடரைப் பாதுகாக்கிறது.
- source_word: וְלֹא הָיִיתִי רַע לְפָנָיו
  choice: அதுவரை நான் அவர் முன்னிலையில் முகவாட்டமாக இருந்ததில்லை
  rationale: רַע என்பதன் நேர்ப்பொருள் ‘மோசமானவன்/தீயவன்’ என்றாலும், அரசவைக் காட்சியில் அது சோகமாக அல்லது வாட்டமாகத் தோன்றுவதைக் குறிக்கிறது. ‘அதுவரை’ என்பது முன்நிலையைக் காட்டும் உரைச்சூழலை இயல்பாக வெளிப்படுத்துகிறது.
