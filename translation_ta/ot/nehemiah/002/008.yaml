base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/002/008.yaml
  text: and a letter to Asaph[a], the keeper of the king’s forest, that he should give me timber to make beams for the gates of the fortress by the temple, and for the wall of the city, and for the house that I will occupy. And the king gave them to me[d][c][b], according to the good hand of my God upon me.
translation:
  language: ta
  text: மேலும், அரசருக்குச் சொந்தமான வனத்தின்[a] காவலரான ஆசாபுக்கு ஒரு கடிதம் தருமாறு கேட்டேன்; ஆலயத்தைச் சேர்ந்த கோட்டையின் வாயில்களுக்கு[b] உத்தரங்கள் அமைப்பதற்கும், நகர மதிலுக்கும், நான் குடியிருக்கப்போகும் வீட்டுக்கும் தேவையான மரங்களை அவர் எனக்குத் தரும்படி கேட்டேன். என் கடவுளின் நல்ல கை என்மேல் இருந்தபடியால்[d], அரசர் நான் கேட்டவற்றை எனக்குக் கொடுத்தார்.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அரசரின் பூங்கா’ அல்லது ‘அரசரின் தோப்பு’ என்றும் மொழிபெயர்க்கலாம். எபிரேயச் சொல், அரசருக்குரிய பராமரிக்கப்பட்ட மரங்கள் நிறைந்த நிலத்தைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: ‘கோட்டை’ என்பதற்கு ‘அரண்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: மூல எபிரேயத்தில் சொல்லுக்கு சொல், ‘அரசர் எனக்குக் கொடுத்தார்’; கொடுக்கப்பட்ட பொருள் வெளிப்படையாகக் குறிப்பிடப்படவில்லை.
    reason: source_ellipsis
  - marker: d
    text: ‘என் கடவுளின் நல்ல கை என்மேல்’ என்பது கடவுளின் சாதகமான பராமரிப்பையும் உதவியையும் குறிக்கும் உருவகம்.
    reason: cultural_note
lexical_decisions:
- source_word: אִגֶּרֶת
  choice: ஒரு கடிதம்
  rationale: இச்சொல் கடிதம் அல்லது அதிகாரப்பூர்வ ஆவணத்தைக் குறிக்கும்; அரசரிடமிருந்து ஆசாபுக்குக் கொடுக்கப்படும் எழுத்துப்பூர்வ ஆணை என்ற சூழலில் ‘கடிதம்’ இயல்பாக உள்ளது.
- source_word: שֹׁמֵר הַפַּרְדֵּס
  choice: அரசருக்குச் சொந்தமான வனத்தின் காவலர்
  rationale: פַּרְדֵּס என்பது அரசருக்குரிய பராமரிக்கப்பட்ட தோப்பு, பூங்கா அல்லது மரங்கள் நிறைந்த பாதுகாக்கப்பட்ட நிலத்தைக் குறிக்கலாம். கட்டுமான மரம் வழங்கப்படும் சூழலில் ‘வனம்’ பொருத்தமானது; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: יִתֶּן לִי עֵצִים
  choice: அவர் எனக்கு மரம் தரவேண்டும்
  rationale: עֵצִים என்பதற்கு மரங்கள் அல்லது மரப்பொருள் எனப் பொருள். கட்டுமானச் சூழலில் தமிழில் ‘மரம்’ இயல்பாகவும் போதுமான தெளிவுடனும் உள்ளது.
- source_word: לְקָרוֹת
  choice: உத்தரங்களைச் செய்ய
  rationale: קרה வினை உத்தரங்களை அமைத்தல் அல்லது கூரை வேய்தலைக் குறிக்கிறது. பட்டியலிடப்பட்ட எல்லா கட்டுமானங்களுக்கும் ஒரே குறுகிய செயற்பாட்டைத் திணிக்காமல், ‘உத்தரங்களைச் செய்ய’ மூலத்தின் கட்டுமானப் படிமத்தைப் பேணுகிறது.
- source_word: שַׁעֲרֵי הַבִּירָה אֲשֶׁר לַבַּיִת
  choice: ஆலயத்தைச் சேர்ந்த கோட்டையின் வாயில்கள்
  rationale: בִּירָה என்பது கோட்டை அல்லது அரண்; אֲשֶׁר לַבַּיִת அதன் ‘வீடு’ உடனான சார்பைச் சுட்டுகிறது. இச்சூழலில் ‘வீடு’ ஆலயத்தைக் குறிக்க வாய்ப்புள்ளதால் அதனை உரையில் தெளிவாக்கினாலும், உறவை ‘சேர்ந்த’ என்று பாதுகாக்கிறது.
- source_word: חוֹמַת הָעִיר
  choice: நகர மதில்
  rationale: எபிரேயச் சேர்க்கையின் இயல்பான, சுருக்கமான தமிழ் வடிவம்.
- source_word: הַבַּיִת אֲשֶׁר אָבוֹא אֵלָיו
  choice: நான் குடியிருக்கப்போகும் வீடு
  rationale: சொல்லுக்கு சொல் ‘நான் அதற்குள் செல்லும் வீடு’; சூழலில் நெகேமியாவின் தங்குமிடத்தைக் குறிப்பதால் ‘குடியிருக்கப்போகும்’ நோக்கத்தை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וַיִּתֶּן לִי הַמֶּלֶךְ
  choice: அரசர் நான் கேட்டவற்றை எனக்குக் கொடுத்தார்
  rationale: மூலத்தில் கொடுக்கப்பட்ட பொருள் வெளிப்படையாக இல்லை. தமிழில் இயல்புக்காக முந்தைய கோரிக்கைகளைச் சுட்டும் ‘நான் கேட்டவற்றை’ சேர்க்கப்பட்டுள்ளது; இந்த நிரப்புதல் அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
- source_word: כְּיַד אֱלֹהַי הַטּוֹבָה עָלָי
  choice: என் கடவுளின் நல்ல கை என்மேல் இருந்தபடியால்
  rationale: தெய்வீக அருளையும் செயற்படும் உதவியையும் குறிக்கும் ‘நல்ல கை’ என்ற மூல உருவகத்தைப் பேணி, தமிழில் காரண உறவை இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: ‘என் கடவுளின் நல்ல கை என்மேல்’ என்ற தெய்வீக பராமரிப்பு உருவகம்
  choice: ‘கை’ என்ற மனிதவுருவகத்தை உரையில் அப்படியே பேணுதல்
  alternative: ‘என் கடவுள் எனக்குத் தயவு காட்டியதால்’ அல்லது ‘எனக்கு உதவியதால்’
  rationale: எஸ்றா–நெகேமியா நூல்களில் கடவுளின் செயற்படும் சாதகமான பராமரிப்பை இந்த உருவகம் தொடர்ந்து வெளிப்படுத்துகிறது. அதை ஒரு கருத்துச்சுருக்கமாக மாற்றாமல் வைத்திருப்பது மூலத்தின் இறையியல் நயத்தையும் பதற்றத்தையும் காக்கிறது.
- issue: הַבַּיִת என்பதன் குறிப்பு
  choice: கோட்டையுடன் தொடர்புடைய முதல் இடத்தில் ‘ஆலயம்’ என்று சூழலடிப்படையில் தெளிவாக்குதல்
  alternative: ‘வீடு’ என்று சொல்லுக்கு சொல் மொழிபெயர்த்தல்
  rationale: இடச்சூழலில் அரசரின் கோட்டை ஆலய வளாகத்துடன் தொடர்புடையதாகப் புரிந்துகொள்ளப்படுகிறது; எனினும் לַ காட்டும் உறவை ‘சேர்ந்த’ என்று வைத்ததால் ‘அருகிலுள்ள’ எனத் தீர்மானிக்கவில்லை.
translation_notes:
  register: நவீன பொதுத்தமிழில், வாசிக்க எளிதானதாயும் மரியாதைமிக்கதாயும் அமைக்கப்பட்டது. ‘உத்தரம்’, ‘மதில்’, ‘கோட்டை’ போன்ற கட்டுமானச் சொற்கள் பொதுவாகப் புரியும் அளவில் துல்லியமாகத் தேர்ந்தெடுக்கப்பட்டன. மூலத்தின் நீண்ட வாக்கியம் தமிழில் தெளிவுக்காக இரண்டு வாக்கியங்களாகப் பிரிக்கப்பட்டது; கோரிக்கையின் சார்பு உறவு ‘என்று அதில் எழுதப்பட வேண்டும்’ என்பதால் வெளிப்படுத்தப்பட்டது.
