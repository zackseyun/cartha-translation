  source_fidelity: திருத்தம் தேவை. வரைவு கோரிக்கையின் மொத்தப் பொருளைத் தருகிறது; ஆனால் ‘அதில் எழுதப்பட வேண்டும்’ என்பது எபிரேயத்தில் வெளிப்படையாக இல்லாத எழுத்து-உள்ளடக்கத்தைச் சேர்க்கிறது. மேலும், மரம் வழங்கப்படுவதன் நோக்கத்தைத் தமிழில் நேரடியாக அமைத்தால் மூலத்தின் தொடர்ச்சி தெளிவாகப் பேணப்படும்.
  naturalness: நடை பொதுவாக நவீனத் தமிழில் இயல்பாக உள்ளது. எனினும் ‘...தரும்படி கேட்டேன். ...என்று அதில் எழுதப்பட வேண்டும்’ என்ற இரட்டைப் பரிமாற்றம் தேவையற்ற விளக்கமாகத் தோன்றுகிறது. அதை ஒரு நேரடியான கோரிக்கைத் தொடராக மாற்றுவது வாசிப்பைச் சீராக்கும்.
  terminology: ‘ஆசாப்’, ‘ஆலயம்’, ‘கோட்டை’, ‘நகர மதில்’, ‘உத்தரங்கள்’ ஆகியவை பொருத்தமானவை. פַּרְדֵּס என்பதற்கான ‘வனம்’ சூழலுக்கு ஏற்றது; மாற்றுப்பொருள்கள் அடிக்குறிப்பில் நன்றாகக் கொடுக்கப்பட்டுள்ளன. ‘நல்ல கை’ என்ற மூல உருவகம் பாதுகாக்கப்படுகிறது.
