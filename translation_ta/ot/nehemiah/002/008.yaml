    rationale: ‘வாயில்களுக்கும், நகர மதிலுக்கும், ... வீட்டுக்கும் தேவையான உத்தரங்களைச் செய்ய’ என்பது எல்லா பொருட்களுக்கும் உத்தரங்கள் செய்யப்படுவதாக ஒலிக்கலாம். வாயில்களுக்கு உத்தரங்கள் அமைப்பதையும் பிற கட்டுமானங்களுக்குத் தேவையான மரத்தையும் தொடர்ச்சியாகக் கூறலாம்.
  revised_text: மேலும், அரசருக்குச் சொந்தமான வனத்தின்[a] காவலரான ஆசாபுக்கு ஒரு கடிதம் தருமாறு கேட்டேன்; ஆலயத்தைச் சேர்ந்த கோட்டையின் வாயில்களுக்கு[b] உத்தரங்கள் அமைப்பதற்கும், நகர மதிலுக்கும், நான் குடியிருக்கப்போகும் வீட்டுக்கும் தேவையான மரங்களை அவர் எனக்குத் தரும்படி கேட்டேன். என் கடவுளின் நல்ல கை என்மேல் இருந்தபடியால்[d], அரசர் நான் கேட்டவற்றை எனக்குக் கொடுத்தார்.[c]
