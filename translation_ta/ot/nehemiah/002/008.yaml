    rationale: மூலம் ஆசாபுக்கான கடிதத்தையும், அவர் மரம் தர வேண்டிய நோக்கத்தையும் இணைக்கிறது; கடிதத்தில் அந்தச் சொற்கள் எழுதப்பட வேண்டும் என்று தனியாகக் கூறுவதில்லை. இந்தச் சேர்க்கையை நீக்கி நேரடியாகக் கோரிக்கையைத் தருவது அதிகத் துல்லியம்.
