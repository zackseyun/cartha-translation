base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/002/003.yaml
  text: I said to the king[a], “May the king live forever! Why should my face not be sad, when the city, the place of my fathers’ tombs, lies in ruins and its gates have been consumed by fire?”
translation:
  language: ta
  text: நான் அரசனிடம், “அரசர் என்றும் வாழ்க! என் முன்னோர்களின் கல்லறைகள் அமைந்த நகரம் பாழடைந்து கிடக்கவும், அதன் வாசல்கள் நெருப்பால் அழிக்கப்பட்டிருக்கவும், என் முகம் ஏன் துயரமாக இருக்கக்கூடாது?” என்றேன்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “என் முன்னோர்களின் கல்லறைகள் அமைந்த நகரம்” என்பது எபிரெயத்தில் சொற்பட, “என் முன்னோர்களின் கல்லறைகளின் வீடு.” இது அவர்களுடைய அடக்கத்துடன் தொடர்புடைய இடத்தைக் குறிக்கும் மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֹמַר לַמֶּלֶךְ
  choice: நான் அரசனிடம் ... என்றேன்
  rationale: வழக்கமான எபிரெயக் கதைநடை இறந்தகாலத்தை இயல்பான நவீனத் தமிழில் வழங்குகிறது; לַמֶּלֶךְ என்பதன் மறைமுகச் செயப்படுபொருள் உறவும் காக்கப்படுகிறது.
- source_word: הַמֶּלֶךְ לְעוֹלָם יִחְיֶה
  choice: அரசர் என்றும் வாழ்க!
  rationale: அரசருக்கு மரியாதையுடன் வாழ்த்து கூறும் வழக்குச் சூத்திரத்தின் வேண்டுதல் தொனியைச் சுருக்கமாகவும் இயல்பாகவும் காக்கிறது.
- source_word: מַדּוּעַ לֹא יֵרְעוּ פָנַי
  choice: என் முகம் ஏன் துயரமாக இருக்கக்கூடாது?
  rationale: முகத்தை மையப்படுத்தும் மூலமொழி உருவகத்தைத் தக்கவைத்து, சோகம் அல்லது மனவேதனை முகத்தில் தெரிவதை இயல்பான தமிழில் உணர்த்துகிறது.
- source_word: אֲשֶׁר
  choice: '...போதும்'
  rationale: நெகேமியாவின் முகத்துயரத்திற்கான சூழலையும் விளக்கக் காரணத்தையும் வெளிப்படுத்துகிறது; காரணத்தைத் தேவையின்றி மிகத் துல்லியமாக நிர்ணயிக்காமல் மூலத்தின் தொடர்பைத் தக்கவைக்கிறது.
- source_word: הָעִיר בֵּית קִבְרוֹת אֲבֹתַי
  choice: என் முன்னோர்களின் கல்லறைகள் உள்ள நகரம்
  rationale: בֵּית என்பதன் சொற்பொருள் ‘வீடு’ என்றாலும், இங்கு முன்னோர்களின் கல்லறைகள் அமைந்துள்ள நகரத்தைச் சுட்டும் இயல்பான தமிழாக்கம். நகரத்தை எருசலேம் என்று மூலத்தில் இல்லாத பெயரால் வெளிப்படையாக அடையாளப்படுத்தவில்லை.
- source_word: חֲרֵבָה
  choice: பாழடைந்து கிடக்கிறது
  rationale: அழிவுற்ற, சிதைந்த நிலையைக் காட்டும் பெயரடையின் வலிமையை இயல்பான தமிழ் தொடரால் வெளிப்படுத்துகிறது.
- source_word: וּשְׁעָרֶיהָ אֻכְּלוּ בָאֵשׁ
  choice: அதன் வாசல்கள் நெருப்பால் அழிக்கப்பட்டிருக்கின்றன
  rationale: אכל என்பதன் நெருப்பு ‘தின்றுவிட்டது’ என்ற உருவகப் பயன்பாட்டை அதன் அழிவுப் பொருளுடன் தெளிவாக வழங்குகிறது; எபிரெயச் செயப்பாட்டு வடிவமும் நிறைவுற்ற விளைவும் காக்கப்படுகின்றன.
