translation_notes:
  register: நவீனத் தரமான, மரியாதைமிக்க தமிழ் பயன்படுத்தப்பட்டுள்ளது. அரசவைக்குரிய பணிவான வாழ்த்து காக்கப்பட்டுள்ளது. ‘முகம்’ என்ற எபிரெய மொழிப்படிமம் தக்கவைக்கப்பட்டாலும், வாக்கியம் சாதாரண வாசகர்களுக்குப் புரியும் இயல்பான தமிழில் அமைக்கப்பட்டுள்ளது. அடிக்குறிப்பு குறியீடு பிரதான உரையில் இடம்பெற்றுள்ளது.
