  text: וַ/יִּשְׁמַ֞ע סַנְבַלַּ֣ט הַ/חֹרֹנִ֗י וְ/טֽוֹבִיָּה֙ הָ/עֶ֣בֶד הָֽ/עַמֹּנִ֔י וַ/יֵּ֥רַע לָ/הֶ֖ם רָעָ֣ה גְדֹלָ֑ה אֲשֶׁר בָּ֥א אָדָ֔ם לְ/בַקֵּ֥שׁ טוֹבָ֖ה לִ/בְנֵ֥י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/002/010.yaml
  text: When Sanballat the Horonite and Tobiah the Ammonite servant heard this[b][a], it was very displeasing to them that a man had come to seek the welfare of the children of Israel.
translation:
  language: ta
  text: ஹோரோனியனான சன்பல்லாத்தும், அம்மோனியனான அடிமை தொபியாவும் இதைக் கேட்டபோது, இஸ்ரவேல் மக்களின் நலனை நாடி ஒரு மனிதன் வந்திருப்பது அவர்களுக்கு மிகவும் அதிருப்தியளித்தது.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'சொல்லுக்குச் சொல்: “அது அவர்களுக்கு மிகுந்த தீமையாக இருந்தது”; எபிரெய மொழியில் ‘தீமை/கெடுதல்’ என்ற ஒரே சொல்லினம் வலியுறுத்தலுக்காகத் திரும்ப வருகிறது.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: இதைக் கேட்டபோது
  rationale: வினைச்சொல் நேரடியாக ‘கேட்டான்’ என்று பொருள்படும்; முந்தைய வசன நிகழ்வைச் சுட்டுவதால், தமிழில் இயல்பாக ‘இதை’ சேர்க்கப்பட்டுள்ளது.
- source_word: הַחֹרֹנִי
  choice: ஓரோனியனான
  rationale: சன்பல்லாத்தின் ஊர் அல்லது பூர்வீக அடையாளத்தைக் குறிக்கும் குடிப்பெயர்; அதன் ஒலிவடிவம் தமிழில் தக்கவைக்கப்படுகிறது.
- source_word: הָעֶבֶד
  choice: அடிமை
  rationale: עֶבֶד என்பதன் அடிப்படை சமூகநிலைப் பொருளை வெளிப்படையாகத் தருகிறது; ‘அதிகாரி’ என்பது சூழலிலிருந்து ஊகிக்கப்படும் விளக்கம்.
- source_word: הָעַמֹּנִי
  choice: அம்மோனியனான
  rationale: தொபியாவின் இன அல்லது தேசிய அடையாளத்தைக் குறிக்கும் குடிப்பெயர்.
- source_word: וַיֵּרַע לָהֶם רָעָה גְדֹלָה
  choice: அவர்களுக்கு மிகவும் வருத்தமளித்தது
  rationale: எபிரெய மொழியில் רע சொல்லினம் வலியுறுத்தலுக்காகத் திரும்ப வருகிறது; நவீன தமிழில் அதன் சூழல்சார் உணர்வை இயல்பாகவும் வலிமையாகவும் தருகிறது.
- source_word: אָדָם
  choice: ஒரு மனிதன்
  rationale: இங்கு தனிப்பட்ட ஒருவராகிய நெகேமியாவைக் குறிக்கும் ஆண்பால் ஒருமைச் சொல்லைத் தெளிவாகத் தக்கவைக்கிறது.
- source_word: לְבַקֵּשׁ טוֹבָה
  choice: நலனை நாடி
  rationale: பிறருக்கான நன்மை அல்லது நல்வாழ்வைத் தேடுவதைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்கள்
  rationale: ‘இஸ்ரவேலின் பிள்ளைகள்’ என்ற தேசிய-உடன்படிக்கை அடையாளத்தை நவீன தமிழில் இயல்பாகக் குறிக்கிறது.
theological_decisions:
- issue: אָדָם என்பதன் பாலினமும் தனிநபர் குறிப்பும்
  choice: ஒரு மனிதன்
  alternative: ஒருவர்
  rationale: இச்சொல் சூழலில் நெகேமியா என்னும் தனிப்பட்ட ஆணைக் குறிக்கிறது; பொதுப்பாலாக்காமல் மூலத்தின் குறிப்பைத் தக்கவைக்கிறது.
- issue: עֶבֶד என்பதன் சமூகநிலை
  choice: அடிமை
  alternative: வேலைக்காரன் / அதிகாரி
  rationale: மூலச்சொல்லின் அடிப்படை அர்த்தத்தைத் தக்கவைக்கிறது; தொபியாவின் துல்லியமான நிர்வாகப் பதவியை உரை வெளிப்படையாகக் கூறாததால் ‘அதிகாரி’ எனத் தீர்மானிக்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், வாசிக்க எளிதான ஆனால் கண்ணியமான வரலாற்று உரைநடை பயன்படுத்தப்பட்டுள்ளது. பெயர்களும் குடிப்பெயர்களும் மரபான வேதாகமத் தமிழ் ஒலிவடிவங்களுக்கு அண்மையாக வைக்கப்பட்டுள்ளன; மூலத்தின் தீவிரத்தை விளக்கும் மாற்று நேரடி வாசிப்பு அடிக்குறிப்பில் தரப்பட்டுள்ளது.
