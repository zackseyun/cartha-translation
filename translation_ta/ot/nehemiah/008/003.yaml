  text: וַ/יִּקְרָא ב/וֹ֩ לִ/פְנֵ֨י הָ/רְח֜וֹב אֲשֶׁ֣ר לִ/פְנֵ֣י שַֽׁעַר הַ/מַּ֗יִם מִן הָ/אוֹר֙ עַד מַחֲצִ֣ית הַ/יּ֔וֹם נֶ֛גֶד הָ/אֲנָשִׁ֥ים וְ/הַ/נָּשִׁ֖ים וְ/הַ/מְּבִינִ֑ים וְ/אָזְנֵ֥י כָל הָ/עָ֖ם אֶל סֵ֥פֶר הַ/תּוֹרָֽה־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/008/003.yaml
  text: And he read from it before the square that was in front of the Water Gate[a], from daybreak until midday, in the presence of the men and the women and those who could understand[c][b]; and the ears of all the people were attentive to the Book of the Law.
translation:
  language: ta
  text: அவர் தண்ணீர் வாசலுக்கு முன்பிருந்த திறந்தவெளியில், விடியற்காலம்[a] முதல் நண்பகல்வரை, ஆண்கள், பெண்கள், புரிந்துகொள்ளும் திறன் உள்ளவர்கள்[b] ஆகியோருக்கு முன்பாக அதிலிருந்து வாசித்தார். மக்கள் அனைவரின் செவிகளும் திருச்சட்டப் புத்தக வாசிப்பில்[c] கவனமாக இருந்தன.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொற்சொல்லாக, “ஒளி தோன்றியதிலிருந்து”; அதாவது விடியலிலிருந்து.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “புரிதலுள்ளவர்கள்”; வாசிக்கப்பட்டதைப் புரிந்துகொள்ளும் வயதுடைய அனைவரையும் இது குறிக்கக்கூடும்.
    reason: lexical_alternative
  - marker: c
    text: “புத்தகம்” என்பதை “சுருள்” என்றும் மொழிபெயர்க்கலாம். “திருச்சட்டம்” என்பதற்கு “போதனை” அல்லது “தோரா” என்றும் பொருள் கொள்ளலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא בּוֹ
  choice: அதிலிருந்து வாசித்தார்
  rationale: எழுதப்பட்ட சுருளைச் சுட்டும் בּוֹ உடன், קרא இச்சூழலில் பொதுவாக ‘வாசித்தார்’ எனப் பொருள்படும்; தமிழில் ‘அதிலிருந்து’ என்பது இயல்பான பயன்பாடு.
- source_word: לִפְנֵי הָרְחוֹב אֲשֶׁר לִפְנֵי שַׁעַר הַמַּיִם
  choice: தண்ணீர் வாசலுக்கு முன்பிருந்த திறந்தவெளியில்
  rationale: רְחוֹב என்பது பொதுமக்கள் கூடும் திறந்த வெளியைக் குறிக்கிறது. முதல் לִפְנֵי-யின் வடிவத்தைச் சொற்சொல்லாக மீட்டெடுப்பதைவிட, இடத்தொடர்பைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: מִן הָאוֹר
  choice: விடியற்காலம்
  rationale: சொற்சொல்லாக ‘ஒளியிலிருந்து’; இங்கு காலத்தைக் குறிக்கும் வழக்கில் முதல் வெளிச்சம் அல்லது விடியல் என்று பொருள்.
- source_word: עַד מַחֲצִית הַיּוֹם
  choice: நண்பகல்வரை
  rationale: ‘நாளின் பாதிவரை’ என்ற எபிரெய வெளிப்பாட்டை இயல்பான நவீன தமிழில் நேரத் தகவலாக அளிக்கிறது.
- source_word: נֶגֶד הָאֲנָשִׁים וְהַנָּשִׁים וְהַמְּבִינִים
  choice: ஆண்கள், பெண்கள், புரிந்துகொள்ளக்கூடியவர்கள் ஆகியோருக்கு முன்பாக
  rationale: ஆண்களும் பெண்களும் தனித்தனியாகக் குறிப்பிடப்படுவதையும், புரிதல் திறனால் வரையறுக்கப்படும் கூடுதல் குழுவையும் மூலத்தைப் போலவே பாதுகாக்கிறது.
- source_word: וְאָזְנֵי כָל הָעָם אֶל
  choice: மக்கள் அனைவரின் செவிகளும் ... கவனமாயிருந்தன
  rationale: எபிரெய மொழியின் உயிரோட்டமான ‘செவிகள் ... நோக்கி இருந்தன’ என்ற உருவகத்தைத் தக்கவைத்து, தமிழில் அதன் கவனமான கேட்பின் பொருளைத் தெளிவாக்குகிறது.
- source_word: סֵפֶר הַתּוֹרָה
  choice: திருச்சட்டப் புத்தகம்
  rationale: סֵפֶר என்பது புத்தகம் அல்லது சுருள் எனப் பொருள்படலாம்; תּוֹרָה இச்சூழலில் அதிகாரப்பூர்வமாக எழுதப்பட்ட உடன்படிக்கைச் சட்டத்தைக் குறிக்கிறது. ‘திருச்சட்டம்’ என்பது அதன் புனித, அதிகாரப்பூர்வ தன்மையை இயல்பான தமிழில் காட்டுகிறது.
theological_decisions:
- issue: תּוֹרָה என்பதன் மொழிபெயர்ப்பு
  choice: திருச்சட்டம்
  alternative: போதனை / தோரா
  rationale: תּוֹרָה பொதுவாக ‘போதனை’ எனவும் வரலாம்; ஆனால் நெகேமியா 8-இல் பொதுமக்களுக்கு வாசிக்கப்படும் எழுதப்பட்ட, அதிகாரப்பூர்வ உடன்படிக்கைத் தொகுப்பே குறிக்கப்படுகிறது. ‘திருச்சட்டம்’ அந்தச் சூழலைத் தெளிவாகக் காட்டுகிறது; அதேவேளை குறிப்பில் ‘போதனை’ என்ற பரந்த பொருளைத் தெரிவிக்கிறது.
- issue: וְהַמְּבִינִים குறிக்கும் குழு
  choice: புரிந்துகொள்ளக்கூடியவர்கள்
  alternative: புரிதலுள்ளவர்கள்
  rationale: இது வயதை நேரடியாகக் குறிப்பிடவில்லை; வாசிப்பைப் புரிந்துகொள்ளும் திறனையே குறிப்பிடுகிறது. ஆகவே குழந்தைகள் என்ற விளக்கத்தை முதன்மை உரையில் சேர்க்காமல் மூலத்தின் திறந்த தன்மை பாதுகாக்கப்படுகிறது.
- issue: கேட்பைக் குறிக்கும் செவி உருவகம்
  choice: செவிகளும் ... கவனமாயிருந்தன
  alternative: மக்கள் அனைவரும் கவனமாகக் கேட்டார்கள்
  rationale: மூலத்தின் உடல் சார்ந்த தெளிவான உருவகத்தைப் பாதுகாத்து, அதன் பொருளை நவீன தமிழில் புரியும்படி வழங்குகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், வாசிப்பிற்கு ஏற்ற கண்ணியமான நடையைக் கடைப்பிடிக்கிறது. ‘தண்ணீர் வாசல்’ இடப்பெயராகத் தெளிவாக உள்ளது. எபிரெயத்தின் ‘செவிகள்’ உருவகம் தக்கவைக்கப்பட்டுள்ளது; புரிதல் உள்ளவர்களின் வயது அல்லது அடையாளம் முதன்மை உரையில் மிகையாக விளக்கப்படவில்லை. அனைத்து அடிக்குறிப்பு குறிகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
