base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/008/005.yaml
  text: Ezra opened the book in the sight of all the people[a], for he was above all the people; and when he opened it, all the people stood.
translation:
  language: ta
  text: எஸ்றா புத்தகத்தை[a] மக்கள் அனைவரும் பார்க்கும்படி திறந்தார்; ஏனெனில் அவர் மக்கள் அனைவருக்கும் மேலாக உயரத்தில் இருந்தார். அவர் அதைத் திறந்தபோது, மக்கள் அனைவரும் நின்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘சுருளை.’ எபிரெய மொழியிலுள்ள סֵפֶר என்ற சொல் சுருள் வடிவிலிருந்த எழுதப்பட்ட ஆவணத்தையும் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְתַּח
  choice: திறந்தார்
  rationale: פתח என்பதன் நேரடியான பொருள் ‘திறத்தல்.’ சுருளை விரித்தல் என்ற நடைமுறை இதில் உட்படலாம்; ஆனால் எபிரெயச் சொல் பொதுவான ‘திறந்தார்’ என்பதையே பயன்படுத்துகிறது.
- source_word: הַסֵּפֶר
  choice: அந்தப் புத்தகம்
  rationale: סֵפֶר என்பது எழுதப்பட்ட ஆவணம், புத்தகம் அல்லது சுருள் என்பதைக் குறிக்கலாம். இயல்பான தமிழுக்காக ‘புத்தகம்’ பயன்படுத்தப்பட்டு, பண்டைய வடிவத்தைக் காட்டும் ‘சுருள்’ அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: לְעֵינֵי כָל הָעָם
  choice: மக்கள் அனைவரும் காணும்படி
  rationale: சொல்லளவில் ‘மக்கள் அனைவரின் கண்களுக்கு முன்பாக.’ பொதுமக்கள் பார்க்கும் வகையில் நிகழ்ந்ததை இயல்பான நவீன தமிழில் இது தெளிவாகக் கூறுகிறது.
- source_word: כִּי מֵעַל כָּל הָעָם הָיָה
  choice: ஏனெனில் அவர் மக்கள் அனைவரையும்விட உயரமான இடத்தில் இருந்தார்
  rationale: מֵעַל இங்கு சமூக மேன்மையை அல்ல, உடல்சார்ந்த இட உயர்வைக் குறிக்கிறது. ‘உயரமான இடத்தில்’ என்பது அந்தப் பொருளைத் தெளிவுபடுத்துகிறது.
- source_word: וּכְפִתְחוֹ
  choice: அவர் அதைத் திறந்தபோது
  rationale: כְּ இங்கு காலத் தொடர்பைக் காட்டுவதால் ‘திறந்தபோது’ என மொழிபெயர்க்கப்பட்டது; ‘அதை’ என்பது முன் வந்த புத்தகத்தைக் குறிக்க இயல்பாகச் சேர்க்கப்பட்டது.
- source_word: עָמְדוּ
  choice: எழுந்து நின்றார்கள்
  rationale: עמד என்பது ‘நிற்றல்’ என்று பொருள்படும். இச்சூழலில் மக்கள் புத்தகம் திறக்கப்பட்டபோது நிற்கத் தொடங்கிய நிகழ்வை இயல்பான தமிழில் ‘எழுந்து நின்றார்கள்’ வெளிப்படுத்துகிறது.
