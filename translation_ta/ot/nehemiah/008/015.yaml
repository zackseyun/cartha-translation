base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/008/015.yaml
  text: and that they should proclaim and spread the message through all their cities and in Jerusalem[a], saying, “Go out to the hill country and bring branches of olive, oil tree, myrtle, palm, and other leafy trees, to make booths[b], as it is written.”
translation:
  language: ta
  text: மேலும், அவர்கள் தங்கள் எல்லா நகரங்களிலும் எருசலேமிலும், “மலைப்பகுதிக்குச் சென்று, ஒலிவ மரம், எண்ணெய் மரம்[a], மிர்டில், பேரீச்சைப் பனை, அடர்ந்த இலைகளுள்ள மரங்கள் ஆகியவற்றின் தழைகளைக் கொண்டுவந்து[b], எழுதப்பட்டுள்ளபடி குடில்களை அமைக்குங்கள்” என்று அறிவிக்கவும் செய்தியைப் பரப்பவும் வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “எண்ணெய் மரம்” என்று மொழிபெயர்க்கப்பட்ட எபிரெயச் சொல் காட்டு ஒலிவ மரத்தையோ ஒலியாஸ்டர் மரத்தையோ குறிக்கலாம்; துல்லியமான தாவர இனம் உறுதியாகத் தெரியவில்லை.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயில் நேர்ப்பொருளாக, “ஒலிவ மரத்தின் இலைகள் ... மிர்டிலின் இலைகள் ...” என்று உள்ளது. குடில்கள் அமைப்பதற்காகச் சேகரிக்கப்படும் இலைகளுடன் கூடிய பொருளைத் தமிழில் இயல்பாகக் குறிக்க “தழைகள்” பயன்படுத்தப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲשֶׁר
  choice: மேலும் ... வேண்டும்
  rationale: முந்தைய வசனத்தில் திருச்சட்டத்தில் கண்டதாகக் கூறப்பட்டவற்றின் தொடர்ச்சியை இயல்பான தமிழில் காட்டுகிறது.
- source_word: יַשְׁמִיעוּ וְיַעֲבִירוּ קוֹל
  choice: அறிவித்து, இந்தச் செய்தியை எங்கும் பரப்ப வேண்டும்
  rationale: ‘கேட்கச் செய்தல்’ மற்றும் ‘குரலைச் செல்லச் செய்தல்’ என்ற எபிரெயப் பொது அறிவிப்பு மரபுத்தொடரின் பொருளைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: בְּכָל עָרֵיהֶם וּבִירוּשָׁלַם
  choice: தங்களுடைய எல்லாப் பட்டணங்களிலும் எருசலேமிலும்
  rationale: עִיר என்பதற்கு இச்சூழலில் ‘பட்டணம்’ இயல்பான பொதுச் சொல்; எருசலேம் தனியாகக் குறிப்பிடப்பட்டிருப்பதும் பாதுகாக்கப்படுகிறது.
- source_word: צְאוּ הָהָר
  choice: மலைப்பகுதிக்குப் போய்
  rationale: הָהָר என்பது ஒரு தனி மலையையோ சுற்றியுள்ள மலைநாட்டையோ குறிக்கலாம்; இலைத்தழைகள் சேகரிக்கும் சூழலில் ‘மலைப்பகுதி’ பொருத்தமானது.
- source_word: עֲלֵי
  choice: தழைகள்
  rationale: சொல்லின் நேர்ப்பொருள் ‘இலைகள்’; ஆனால் குடில்களைக் கட்டுவதற்காகக் கொண்டுவரப்படும் இலைகளுடன் கூடிய சிறு கிளைகளையும் தமிழின் ‘தழைகள்’ இயல்பாகக் குறிக்க முடியும். நேர்ப்பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: זַיִת
  choice: ஒலிவ மரம்
  rationale: அறியப்பட்ட தாவரப் பெயரை நவீன தமிழில் தெளிவாகக் குறிக்கிறது.
- source_word: עֵץ שֶׁמֶן
  choice: எண்ணெய் மரம்
  rationale: எபிரெயச் சொல்லின் அமைப்பை நெருக்கமாகப் பாதுகாக்கிறது; தாவர இனத்தின் துல்லியமான அடையாளம் உறுதியற்றது என்பதால் மாற்றுப் பெயர்கள் அடிக்குறிப்பில் தரப்படுகின்றன.
- source_word: הֲדַס
  choice: மிருதுச் செடி
  rationale: myrtle எனப்படும் தாவரத்திற்குப் பயன்படும் தமிழ்ப் பெயர்; பட்டியலில் மரங்கள் இடையே வந்தாலும் மூலத்தின் தாவரப் பெயரைப் பாதுகாக்கிறது.
- source_word: תְמָרִים
  choice: பேரீச்சை மரம்
  rationale: இங்கு பேரீச்சை வகைப் பனைமரத்தின் தழைகள் குறிக்கப்படுகின்றன; பொதுவான ‘பனை’ என்பதைவிடத் தாவரத்தைத் தெளிவாக அடையாளப்படுத்துகிறது.
- source_word: עֵץ עָבֹת
  choice: அடர்ந்த இலைகளுள்ள பிற மரங்கள்
  rationale: עָבֹת என்பதன் ‘அடர்த்தியான/செறிவான’ பொருளையும், முன் கூறப்பட்ட குறிப்பிட்ட இனங்களுக்குப் பின்வரும் பொதுவகையையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: לַעֲשֹׂת סֻכּוֹת
  choice: குடில்களை அமைக்குங்கள்
  rationale: சֻכּוֹת என்பது விழாவுக்காகத் தழைகளால் அமைக்கப்படும் தற்காலிகக் குடில்கள்; ‘குடில்கள்’ என்பது கூடாரத் துணியால் ஆனவை என்ற தவறான எண்ணத்தைத் தவிர்க்கிறது.
- source_word: כַּכָּתוּב
  choice: எழுதப்பட்டுள்ளபடி
  rationale: திருச்சட்டத்தில் எழுதப்பட்ட கட்டளைக்கு ஏற்பச் செய்ய வேண்டும் என்ற மூலத்தின் சுருக்கமான குறிப்பை அப்படியே பாதுகாக்கிறது.
