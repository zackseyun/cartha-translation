translation_notes:
  register: நவீன தரநிலைத் தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. முந்தைய வசனத்துடன் தொடரும் இலக்கணத் தொடர்பு ‘மேலும்’ மற்றும் இறுதியிலுள்ள ‘வேண்டும்’ மூலம் காக்கப்பட்டுள்ளது; பொது அறிவிப்புக்கான எபிரெய மரபுத்தொடர் இயல்பான தமிழாக மாற்றப்பட்டுள்ளது.
