revisions:
- from: அவர்கள் கடவுளின் திருச்சட்ட நூலிலிருந்து தெளிவாக[a] வாசித்து, அதன் பொருளை விளக்கினார்கள்; அதனால் வாசிக்கப்பட்டதை மக்கள் புரிந்துகொண்டார்கள்.
  to: அவர்கள் கடவுளின் சட்டநூலிலிருந்து தெளிவாக[a] வாசித்து, பொருளை விளக்கி, வாசிப்பை மக்கள் புரிந்துகொள்ளும்படி செய்தார்கள்.
  rationale: 'The revision preserves the Hebrew sequence: reading from the book of God''s law, doing so in a manner made plain/clear, giving the sense, and thereby enabling understanding of the reading. It corrects the final clause to reflect the Hiphil verbal form while retaining the contextually understood audience. The footnote remains anchored to ''தெளிவாக'' and preserves the disputed range of מְפֹרָשׁ.'
