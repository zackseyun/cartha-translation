source:
  edition: WLC
  text: וַֽ/יִּקְרְא֥וּ בַ/סֵּ֛פֶר בְּ/תוֹרַ֥ת הָ/אֱלֹהִ֖ים מְפֹרָ֑שׁ וְ/שׂ֣וֹם שֶׂ֔כֶל וַ/יָּבִ֖ינוּ בַּ/מִּקְרָֽא׃ס
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/008/008.yaml
  text: They read from the book[a], from the law of God, clearly, and they gave the sense, so that they understood the reading.
translation:
  language: ta
  text: அவர்கள் கடவுளின் சட்டநூலிலிருந்து தெளிவாக[a] வாசித்து, பொருளை விளக்கி, வாசிப்பை மக்கள் புரிந்துகொள்ளும்படி செய்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘விளக்கமாக’ என்றும் கொள்ளலாம். எபிரெயச் சொல் தெளிவான முறையில் வாசித்ததையோ, விளக்கத்தின் மூலம் உரையை விளங்கச் செய்ததையோ, ஒருவேளை கேட்டவர்களுக்காக மொழிபெயர்த்ததையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרְאוּ
  choice: வாசித்து
  rationale: எழுதப்பட்ட நூல் இதன் பொருளாக இருப்பதால், קרא என்பதன் இயல்பான பொருள் இங்கு ‘வாசித்தல்’ என்பதே.
- source_word: בַסֵּפֶר בְּתוֹרַת הָאֱלֹהִים
  choice: கடவுளின் திருச்சட்ட நூலிலிருந்து
  rationale: இரு ב முன்னிடைச்சொற்களும் ஒரே நூலை விளக்கும் இணைப்பாக அமைந்துள்ளன. தமிழில் ‘திருச்சட்ட நூலிலிருந்து’ என்பது பொதுவாசிப்பின் மூலத்தை இயல்பாகக் காட்டுகிறது; תּוֹרָה என்பதன் போதனை மற்றும் உடன்படிக்கைச் சட்டம் சார்ந்த பொருளை ‘திருச்சட்டம்’ தக்கவைக்கிறது.
- source_word: מְפֹרָשׁ
  choice: தெளிவாக[a]
  rationale: פרש என்பதிலிருந்து வந்த இச்சொல் தெளிவாக அல்லது விளங்கும்படி செய்வதைக் குறிக்கிறது. தெளிவான உச்சரிப்பு, விளக்கம், அல்லது மொழிபெயர்ப்பு ஆகிய சாத்தியங்களை உரை மட்டும் கொண்டு ஒன்றாகக் குறுக்காமல் ‘தெளிவாக’ என வழங்கப்படுகிறது.
- source_word: וְשׂוֹם שֶׂכֶל
  choice: அதன் பொருளை விளக்கினார்கள்
  rationale: ‘புரிதலை வைத்தல்’ என்ற எபிரெய மொழிமரபின் செயல்பாட்டை, சாதாரண நவீன தமிழில் இயல்பாகவும் துல்லியமாகவும் தெரிவிக்கிறது.
- source_word: וַיָּבִינוּ בַּמִּקְרָא
  choice: அதனால் வாசிக்கப்பட்டதை மக்கள் புரிந்துகொண்டார்கள்
  rationale: முந்தைய வாசிப்பும் விளக்கமும் ஏற்படுத்திய விளைவைத் தமிழில் தெளிவாகக் காட்டுகிறது. சூழலில் புரிந்துகொண்டவர்கள் கூடியிருந்த மக்கள் என்பதால், முந்தைய ‘அவர்கள்’ என்பதுடன் குழப்பம் வராமல் ‘மக்கள்’ வெளிப்படுத்தப்பட்டுள்ளது.
theological_decisions:
- issue: וַיָּבִינוּ என்பதன் செய்பவர் அல்லது செயப்படுபவர் சார்ந்த விளக்கம்
  choice: மக்கள் புரிந்துகொண்டார்கள்
  alternative: அவர்கள் புரியவைத்தார்கள்
  rationale: எபிரெய வடிவமும் உடனடிச் சூழலும் புரிந்துகொள்ளுதல் அல்லது புரியவைத்தல் என்ற நெருங்கிய சாத்தியங்களை அனுமதிக்கின்றன. ஆனால் வாக்கிய ஓட்டத்தில் வாசிப்பும் பொருள் விளக்கமும் மக்கள் புரிந்துகொள்ள வழிவகுத்தன என்பதே இயல்பான முடிவு; எந்தக் குறிப்பிட்ட போதக மரபையும் இதில் சேர்க்கவில்லை.
translation_notes:
  register: நவீனத் தரநிலைத் தமிழில், பொதுமக்கள் எளிதில் புரிந்துகொள்ளும் அதேவேளையில் வேதாகமப் பொதுவாசிப்புக்கு ஏற்ற கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘திருச்சட்டம்’ என்பது תּוֹרָה என்பதன் நூல் மற்றும் உடன்படிக்கைச் சட்டம் சார்ந்த தன்மையைச் சுருக்கமாகத் தக்கவைக்கிறது.
