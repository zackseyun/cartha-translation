  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. நீண்ட எபிரேயத் தொடரைத் தெளிவுக்காக இரண்டு வாக்கியங்களாகப் பிரித்தாலும், இடங்களின் வரிசையும் மக்கள் அமைத்த கூடாரங்களே அனைத்திலும் குறிக்கப்படுகின்றன என்பதும் பாதுகாக்கப்பட்டுள்ளது.
