base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/008/016.yaml
  text: So the people went out and brought them[a], and made booths for themselves, each on his roof, and in their courtyards, and in the courtyards of the house of God, and in the square of the Water Gate[b], and in the square of the Gate of Ephraim.
translation:
  language: ta
  text: ஆகவே மக்கள் வெளியே சென்று, அவற்றைக் கொண்டுவந்து, தங்களுக்காகக் கூடாரங்களை[a] அமைத்தார்கள்; ஒவ்வொருவரும் தம் வீட்டின் மொட்டைமாடியிலும், தங்கள் முற்றங்களிலும், கடவுளின் இல்லத்தின் முற்றங்களிலும், தண்ணீர் வாசலின் திடலிலும்[b], எப்பிராயீம் வாசலின் திடலிலும் அமைத்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘தற்காலிகக் குடில்கள்’ என்றும் மொழிபெயர்க்கலாம். கூடாரப் பண்டிகையுடனான தொடர்பைப் பாதுகாக்க ‘கூடாரங்கள்’ என மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
  - marker: b
    text: எபிரேயச் சொல் நகர வாசலோடு தொடர்புடைய திறந்த பொதுவெளி அல்லது திடலைக் குறிக்கிறது.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֵּצְאוּ הָעָם
  choice: மக்கள் வெளியே சென்று
  rationale: יצא என்பதன் நேரடியான இயக்கப் பொருளையும் הָעָם என்பதன் கூட்டுப் பொருளையும் இயல்பான நவீன தமிழில் தருகிறது.
- source_word: וַיָּבִיאוּ
  choice: அவற்றைக் கொண்டுவந்து
  rationale: Hiphil வடிவத்தின் ‘கொண்டுவருதல்’ என்ற பொருளைத் தருகிறது; ‘அவை’ என்பது முந்தைய வசனத்தில் கூறப்பட்ட கிளைகளையும் தழைகளையும் சுட்டுகிறது.
- source_word: וַיַּעֲשׂוּ לָהֶם סֻכּוֹת
  choice: தங்களுக்காகக் கூடாரங்களை அமைத்தார்கள்
  rationale: לָהֶם என்பதைக் ‘தங்களுக்காக’ என்று வெளிப்படுத்துகிறது. סֻכּוֹת என்பது விழாவுக்காக அமைக்கப்பட்ட தற்காலிகத் தங்குமிடங்கள்; ‘கூடாரங்கள்’ என்பது கூடாரப் பண்டிகையுடனான சொல்லியல் தொடர்பைப் பாதுகாக்கிறது.
- source_word: אִישׁ עַל גַּגּוֹ
  choice: ஒவ்வொருவரும் தங்கள் வீட்டின் மொட்டைமாடியிலும்
  rationale: אִישׁ இங்கு பகிர்ந்தளிக்கும் பொருளில் ‘ஒவ்வொருவரும்’ என வருகிறது. பண்டைய வீடுகளின் தட்டையான גָּג என்பதைக் ‘மொட்டைமாடி’ தெளிவாகக் குறிக்கிறது; ‘வீட்டின்’ என்பது தமிழில் இயல்புக்காக வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: וּבְחַצְרֹתֵיהֶם
  choice: தங்கள் முற்றங்களிலும்
  rationale: חָצֵר என்பது சுற்றுச்சுவருள்ள முற்றம் அல்லது உள்முற்றத்தைக் குறிக்கிறது; ‘முற்றம்’ இயல்பான தமிழ்ச் சொல்.
- source_word: וּבְחַצְרוֹת בֵּית הָאֱלֹהִים
  choice: கடவுளின் ஆலய முற்றங்களிலும்
  rationale: சொல்லுக்கு சொல் ‘கடவுளின் இல்லம்’ என்றாலும், சூழலில் அது ஆலயத்தைக் குறிக்கிறது; ‘ஆலய முற்றங்கள்’ நவீன வாசகருக்கு இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: וּבִרְחוֹב
  choice: அருகிலிருந்த திடலிலும்
  rationale: רְחוֹב என்பது வாசலருகிலுள்ள திறந்த பொதுவெளி அல்லது திடலைக் குறிக்கிறது. இடவுறவைத் தமிழில் தெளிவுபடுத்த ‘அருகிலிருந்த’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: שַׁעַר הַמַּיִם
  choice: தண்ணீர் வாசல்
  rationale: பெயரிடப்பட்ட நகர வாசலின் எபிரேயப் பெயரை இயல்பான தமிழில் நேரடியாகத் தருகிறது.
- source_word: שַׁעַר אֶפְרָיִם
  choice: எப்பிராயீம் வாசல்
  rationale: பெயரிடப்பட்ட வாசலைத் தமிழில் இயல்பான பெயர்ச்சொல் வரிசையில் தருகிறது.
