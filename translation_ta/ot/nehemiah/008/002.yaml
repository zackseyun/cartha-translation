base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/008/002.yaml
  text: Then Ezra the priest brought the law before the assembly[a], both men and women, and all who could understand what they heard[b], on the first day of the seventh month.
translation:
  language: ta
  text: ஏழாம் மாதத்தின் முதல் நாளில், ஆசாரியனாகிய எஸ்றா, ஆண்களும் பெண்களும் கேட்டுப் புரிந்துகொள்ளக்கூடிய அனைவரும் அடங்கிய சபையின் முன்[a] திருச்சட்டத்தைக் கொண்டுவந்தார்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மொழியில் சொற்சொல்லாக, “ஆணிலிருந்து பெண்வரை”; இது சபையில் ஆண்களும் பெண்களும் அடங்கியிருந்ததைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “கேட்பதன் மூலம் புரிந்துகொள்ளக்கூடிய அனைவரும்”; அதாவது, வாசிக்கப்படுவதைக் கேட்டுப் புரிந்துகொள்ளும் திறனுடையவர்கள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבִיא
  choice: கொண்டுவந்தார்
  rationale: வாவ் தொடர்வினை கதைநிகழ்வை முன்னெடுக்கிறது; தமிழில் வாக்கியத் தொடக்கத்திலுள்ள காலக்குறிப்பும் இயல்பான வினைமுற்றும் அந்தத் தொடர்ச்சியைத் தெளிவாக்குகின்றன.
- source_word: הַכֹּהֵן
  choice: ஆசாரியனாகிய
  rationale: எஸ்றாவின் பணியையும் அடையாளத்தையும் வெளிப்படையாகக் காட்டும் பெயரடைத் தொடராக மொழிபெயர்க்கப்பட்டது.
- source_word: הַתּוֹרָה
  choice: திருச்சட்டத்தை
  rationale: இச்சூழலில் பொதுவாக வாசிக்கப்படும் மோசேயின் தோராவைக் குறிக்கிறது. ‘திருச்சட்டம்’ அதன் உடன்படிக்கை சார்ந்த புனித நிறையைக் காத்து, நவீனத் தமிழிலும் தெளிவாக உள்ளது.
- source_word: לִפְנֵי הַקָּהָל
  choice: சபையின்முன்
  rationale: கூடியிருந்த மக்களின் முன்னிலையில் நிகழ்ந்த பொதுவான, முறையான செயலின் பொருளைக் காக்கிறது; இங்கு ‘சபை’ என்பது மக்கள் கூட்டத்தைக் குறிக்கிறது.
- source_word: מֵאִישׁ וְעַד אִשָּׁה
  choice: ஆண்கள், பெண்கள் அடங்கிய
  rationale: எபிரெய மொழியின் சொற்சொல் வடிவம் ‘ஆணிலிருந்து பெண்ண்வரை’ எனினும், முழுக் கூட்டத்தின் இருபாலரையும் குறிக்கும் அதன் இயல்பான பொருள் தமிழில் தெளிவாக வழங்கப்படுகிறது.
- source_word: וְכֹל מֵבִין לִשְׁמֹעַ
  choice: கேட்டுப் புரிந்துகொள்ளக்கூடிய அனைவரும்
  rationale: வெறுமனே ஒலியைக் கேட்பதை அல்ல, வாசிக்கப்படுவதைக் கேட்டுப் புரிந்துகொள்ளும் திறனை இத்தொடர் குறிக்கிறது.
- source_word: בְּיוֹם אֶחָד לַחֹדֶשׁ הַשְּׁבִיעִי
  choice: ஏழாம் மாதத்தின் முதல் நாளில்
  rationale: எபிரெய தேதிக் குறிப்பை இயல்பான நவீனத் தமிழில் துல்லியமாக வழங்குகிறது.
theological_decisions:
- issue: பாலினத்தைக் குறிப்பிட்டு அவையினரின் பரப்பை விவரித்தல்
  choice: ஆண்கள், பெண்கள் அடங்கிய சபை
  alternative: ஆணிலிருந்து பெண்வரை
  rationale: மூலத்தில் ஒருமை வடிவிலான பாலினச் சொற்கள் கூட்டத்தின் முழுப் பரப்பையும் குறிக்கின்றன. தமிழில் இயல்பான வடிவம் ஆண்களும் பெண்களும் சேர்க்கப்பட்டிருந்ததைத் தெளிவாகக் காக்கிறது; அடிக்குறிப்பு சொற்சொல் அமைப்பையும் பதிவு செய்கிறது.
- issue: תּוֹרָה என்பதன் மொழியாக்கம்
  choice: திருச்சட்டம்
  alternative: தோரா; போதனை; சட்டம்
  rationale: உடனடிச் சூழல் மோசேயின் சட்டத் தொகுதியைப் பொதுமக்கள்முன் வாசிப்பதைக் குறிக்கிறது. ‘திருச்சட்டம்’ வாசகருக்குத் தெளிவாகவும் அதன் புனித, உடன்படிக்கை சார்ந்த நிறையைப் பாதுகாப்பதாகவும் உள்ளது.
- issue: לִשְׁמֹעַ என்பதிலுள்ள கேட்டல்–புரிதல் உறவு
  choice: கேட்டுப் புரிந்துகொள்ளக்கூடிய
  alternative: கேட்கப் புரிந்துகொண்ட; புரிந்துகொள்ளக்கூடிய
  rationale: மூலத் தொடர் கேட்பதன் வழியாகப் புரிதலைக் குறிக்கலாம். மொழிபெயர்ப்பு செவியால் கேட்டல் மற்றும் அறிவால் புரிதல் ஆகிய இரண்டையும் வைத்திருக்கிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசிப்புக்கு ஏற்ற கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. ‘ஆசாரியன்’, ‘திருச்சட்டம்’, ‘சபை’ ஆகிய பரிச்சயமான வேதாகமச் சொற்கள் பயன்படுத்தப்பட்டுள்ளன; வாக்கிய அமைப்பு தமிழின் இயல்புக்கேற்ப மறுசீரமைக்கப்பட்டாலும் மூலத்தின் தகவல் வரிசையும் அர்த்தத் திணிவும் காக்கப்பட்டுள்ளன.
