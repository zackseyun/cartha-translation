base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/008/004.yaml
  text: Ezra the scribe stood on a wooden platform that they had made for the purpose[a], and beside him stood Mattithiah, Shema, Anaiah, Uriah, Hilkiah, and Maaseiah on his right hand, and Pedaiah, Mishael, Malchijah, Hashum, Hashbaddanah, Zechariah[b], and Meshullam on his left hand.
translation:
  language: ta
  text: எழுத்தறிஞரான எஸ்றா, இந்த நோக்கத்திற்காக அவர்கள் செய்திருந்த மர மேடையின்மேல்[a] நின்றார். அவருக்கு அருகில், அவரது வலப்புறத்தில் மத்தித்தியா, சேமா, அனாயா, உரியா, ஹில்க்கியா, மாசெயா ஆகியோர் நின்றனர்; அவரது இடப்புறத்தில் பெதாயா, மீசாயேல், மல்கியா, ஹாஷூம், ஹஷ்பத்தானா, சகரியா, மெசுல்லாம் ஆகியோர் நின்றனர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மொழியில், “மரக் கோபுரம்”; அதாவது, உயர்த்திக் கட்டப்பட்ட மர அமைப்பு அல்லது மேடை.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִגְדַּל עֵץ
  choice: உயரமான மர மேடை
  rationale: சொல்லுக்கு நேரான பொருள் ‘மரக் கோபுரம்’; பொதுமக்கள் முன்னிலையில் வாசிப்பதற்காக எஸ்றா நின்ற உயர்த்தப்பட்ட மர அமைப்பைச் சூழல் குறிப்பதால், ‘உயரமான மர மேடை’ என்பது வடிவத்தையும் செயலையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: לַדָּבָר
  choice: இந்த நோக்கத்திற்காக
  rationale: דָּבָר என்பதற்கு ‘சொல், காரியம், விவகாரம், நோக்கம்’ ஆகிய பொருள்கள் உண்டு. இங்கு அந்த மேடை அமைக்கப்பட்ட குறிப்பிட்ட நோக்கத்தைக் குறிக்கிறது; மூலத்தின் பொதுத்தன்மையை இயன்றவரை காக்கிறது.
- source_word: הַסֹּפֵר
  choice: வேத அறிஞர்
  rationale: இச்சூழலில் סֹפֵר என்பது வெறும் எழுதுபவரை அல்லாமல் திருச்சட்டத்தில் தேர்ச்சி பெற்ற எழுத்தறிஞரைச் சுட்டுகிறது. நவீன வாசகருக்கு பணியைத் தெளிவாக்க ‘வேத அறிஞர்’ பயன்படுத்தப்பட்டது.
- source_word: אֶצְלוֹ
  choice: அவருக்குப் பக்கத்தில்
  rationale: அருகாமையைக் குறிக்கும் எபிரெயச் சொல்லை இயல்பான தமிழில் நேராக வழங்குகிறது.
- source_word: עַל יְמִינוֹ / וּמִשְּׂמֹאלוֹ
  choice: அவருக்கு வலப்புறத்தில் / இடப்புறத்தில்
  rationale: இரு குழுக்களின் இடநிலையைத் தெளிவாகவும் இணையான தமிழ் அமைப்பிலும் தருகிறது.
- source_word: וַיַּעֲמֹד
  choice: நின்றார் / நின்றார்கள்
  rationale: எஸ்றாவுக்கும் அவரோடு இருந்தவர்களுக்கும் மீண்டும் வரும் עמד வினையின் எளிய இறந்தகாலப் பொருளைப் பாதுகாக்கிறது.
