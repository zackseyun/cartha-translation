translation_notes:
  register: நவீனத் தரமான, கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் தமிழ் பயன்படுத்தப்பட்டுள்ளது. பெயர்கள் எபிரெய உச்சரிப்புக்கு அண்மையாகத் தமிழாக்கப்பட்டுள்ளன. மூல உரையில் சகரியாவுடன் எந்தக் குறிப்பு வேறுபாடும் இல்லை; ஆங்கில ஆலோசனை உரையின் [b] குறிப்பு தவறான இடத்தில் இணைக்கப்பட்டிருப்பதால் அது சேர்க்கப்படவில்லை.
