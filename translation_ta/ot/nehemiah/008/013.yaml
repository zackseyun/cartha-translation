translation_notes:
  register: நவீன தரத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘தந்தைவழிக் குடும்பத் தலைவர்கள்’ என்ற சற்றே முறையான சொற்றொடர் மூலமொழியின் சமூக அமைப்பைப் பாதுகாக்கிறது; எளிய மாற்று அடிக்குறிப்பில் தரப்பட்டுள்ளது. அடிக்குறிப்பு குறி அது விளக்கும் சொற்றொடருக்குப் பின்னரே வைக்கப்பட்டுள்ளது.
