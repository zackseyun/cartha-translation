base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/008/013.yaml
  text: And on the second day[a], the heads of the fathers’ houses of all the people, the priests, and the Levites gathered to Ezra the scribe to gain insight into the words of the law.
translation:
  language: ta
  text: இரண்டாம் நாளில், மக்கள் அனைவரையும் சேர்ந்த தந்தைவழிக் குடும்பங்களின் தலைவர்களும்[a], ஆசாரியர்களும், லேவியர்களும், சட்டத்தின் வார்த்தைகளைப் புரிந்துகொள்வதற்காக எழுத்தறிஞரான எஸ்றாவிடம் கூடிவந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘குடும்பத் தலைவர்கள்.’ எபிரெயத்தில் உள்ள சொற்றொடர் தந்தைவழி மரபுக்குடும்பங்களின் தலைவர்களைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבַיּוֹם הַשֵּׁנִי
  choice: இரண்டாம் நாளில்
  rationale: வாவ் இணைப்பைத் தமிழில் கட்டாயமாகத் தனியே மொழிபெயர்க்காமல், தொடரும் கதைநடையில் இயல்பான காலக் குறிப்பாக வழங்குகிறது.
- source_word: נֶאֶסְפוּ
  choice: கூடிவந்தார்கள்
  rationale: நிஃபால் பன்மை வடிவத்தின் ஒன்றுகூடுதல் பொருளையும், எஸ்றாவை நோக்கி வந்த இயக்கத்தையும் இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: רָאשֵׁי הָאָבוֹת
  choice: தந்தைவழிக் குடும்பத் தலைவர்கள்
  rationale: மூலமொழியில் உள்ள தந்தைவழி வம்ச/விரிவான குடும்ப அமைப்பைக் காட்டுகிறது; வெறும் ‘குடும்பத் தலைவர்கள்’ என்பதைக் காட்டிலும் சமூக அமைப்பைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: לְכָל הָעָם
  choice: மக்கள் அனைவரின்
  rationale: இந்தத் தலைவர்கள் மக்கள் முழுவதையும் சேர்ந்தவர்கள் என்பதைக் குறிக்கும் இயல்பான உரிமைத் தொடர்பாக மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: הַכֹּהֲנִים וְהַלְוִיִּם
  choice: ஆசாரியர்களும், லேவியர்களும்
  rationale: குடும்பத் தலைவர்களோடு சேர்ந்து கூடிவந்த தனித்தனி குழுக்களின் பட்டியலைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: אֶל עֶזְרָא הַסֹּפֵר
  choice: வேதபாரகரான எஸ்றாவிடம்
  rationale: אֶל என்பதன் எஸ்றாவை நோக்கிய இயக்கத்தை ‘எஸ்றாவிடம்’ எனவும், சட்டத்தில் தேர்ச்சிபெற்ற அதிகாரப்பூர்வ எழுத்தறிஞர் என்ற סֹפֵר என்பதன் சூழல்சார் பொருளை ‘வேதபாரகர்’ எனவும் வழங்குகிறது.
- source_word: וּלְהַשְׂכִּיל
  choice: ஆழமாகப் புரிந்துகொள்வதற்காக
  rationale: שׂכל என்பதன் ஹிஃபில் நோக்கவினை வடிவத்தில் உள்ள நுண்ணறிவு பெறுதல் அல்லது விவேகத்துடன் புரிந்துகொள்ளுதல் என்ற பொருளை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: אֶל דִּבְרֵי הַתּוֹרָה
  choice: திருச்சட்டத்தின் வார்த்தைகளை
  rationale: תּוֹרָה என்பதன் உடன்படிக்கை சார்ந்த போதனை/சட்டப் பொருளை ‘திருச்சட்டம்’ என்றும், דִּבְרֵי என்பதன் குறிப்பிட்ட வார்த்தைகள் அல்லது உள்ளடக்கம் என்ற அம்சத்தை ‘வார்த்தைகள்’ என்றும் பாதுகாக்கிறது.
