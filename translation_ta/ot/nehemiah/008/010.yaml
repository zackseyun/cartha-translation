source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר לָ/הֶ֡ם לְכוּ֩ אִכְל֨וּ מַשְׁמַנִּ֜ים וּ/שְׁת֣וּ מַֽמְתַקִּ֗ים וְ/שִׁלְח֤וּ מָנוֹת֙ לְ/אֵ֣ין נָכ֣וֹן ל֔/וֹ כִּֽי קָד֥וֹשׁ הַ/יּ֖וֹם לַ/אֲדֹנֵ֑י/נוּ וְ/אַל תֵּ֣עָצֵ֔בוּ כִּֽי חֶדְוַ֥ת יְהוָ֖ה הִ֥יא מָֽעֻזְּ/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/008/010.yaml
  text: Then he said to them[a], “Go, eat rich food and drink sweet drinks, and send portions to anyone for whom nothing is prepared, for this day is holy to our Lord. And do not be grieved[c][b], for the joy of Yahweh is your stronghold.”
translation:
  language: ta
  text: பின்பு அவர் அவர்களிடம், “நீங்கள் போய்ச் செழுமையான உணவுகளை உண்டு, இனிய பானங்களைக் குடியுங்கள். யாருக்காகவும் எதுவும் ஆயத்தம் செய்யப்படவில்லையோ, அவர்களுக்கு உணவுப் பங்குகளை அனுப்புங்கள். ஏனெனில் இந்த நாள் நம் ஆண்டவருக்குப் பரிசுத்தமானது. துக்கப்படாதீர்கள்; ஏனெனில் யெகோவாவின் மகிழ்ச்சியே உங்கள் அரண்[a]” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யெகோவாவில் கொள்ளும் மகிழ்ச்சியே உங்கள் அரண்.”
    reason: חֶדְוַת יְהוָה என்ற எபிரெயக் கட்டமைப்பு ‘யெகோவாவின் மகிழ்ச்சி’ என்றும் ‘யெகோவாவில் கொள்ளும் மகிழ்ச்சி’ என்றும் புரிந்துகொள்ளப்படலாம்.
lexical_decisions:
- source_word: מַשְׁמַנִּים
  choice: கொழுமையான உணவுகள்
  rationale: இச்சொல் சொல்லடிப்படையில் கொழுப்பான அல்லது செழுமையானவற்றைக் குறிக்கிறது; பண்டிகைச் சூழலில் சிறப்பான, வளமான உணவுகள் என்ற பொருளை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: מַמְתַקִּים
  choice: இனிய பானங்கள்
  rationale: இனிப்பானவற்றைக் குறிக்கும் சொல்; שְׁתוּ (‘குடியுங்கள்’) என்பதோடு வருவதால் பானங்களாகத் தெளிவுபடுத்தப்படுகிறது. ‘இனிய திராட்சரசம்’ எனக் குறுக்குவது தவிர்க்கப்படுகிறது.
- source_word: מָנוֹת
  choice: உணவுப் பங்குகள்
  rationale: விருந்து சூழலில் பிறருக்குப் பகிர்ந்தளிக்கப்படும் உணவுப் பகுதிகளைக் குறிக்கிறது; தமிழில் பொருள் தெளிவாக இருக்க ‘உணவு’ சேர்க்கப்பட்டது.
- source_word: לְאֵין נָכוֹן לוֹ
  choice: எதுவும் ஆயத்தம் செய்யப்படாதவர்களுக்கு
  rationale: நָכוֹן என்பது ஆயத்தமாக்கப்பட்ட அல்லது தயாராக உள்ளதைக் குறிக்கிறது. எபிரெயச் சொற்றொடரின் மறைமுக அமைப்பையும் பொதுப்பொருளையும் இயல்பான தமிழில் காக்கிறது.
- source_word: קָדוֹשׁ
  choice: பரிசுத்தமானது
  rationale: தேவனுக்கெனப் பிரித்துவைக்கப்பட்ட நாளைக் குறிக்கும் நிலையான, இறையியல் நிறையுள்ள தமிழ் சொல்.
- source_word: לַאֲדֹנֵינוּ
  choice: நம் ஆண்டவருக்கு
  rationale: இங்கு אֲדֹנֵינוּ தேவனைக் குறிக்கும் மரியாதைத் தலைப்பு; ‘நம் ஆண்டவர்’ இயல்பான மற்றும் துல்லியமான தமிழ் வடிவம்.
- source_word: תֵּעָצֵבוּ
  choice: துக்கப்படாதீர்கள்
  rationale: மனவேதனை அல்லது துயரத்தை அடைவதைக் குறிக்கிறது; சூழலுக்கு ஏற்ற நேரடியான நவீன தமிழ்.
- source_word: חֶדְוַת יְהוָה
  choice: யெகோவாவின் மகிழ்ச்சி
  rationale: எபிரெயக் கட்டமைப்பை ‘யெகோவாவின் மகிழ்ச்சி’ எனக் காத்து, அது யெகோவாவுடைய மகிழ்ச்சியா அல்லது அவரில் கொள்ளும் மகிழ்ச்சியா என்ற உண்மையான பொருள் நெருக்கடியை முதன்மை உரையில் தீர்க்கவில்லை.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: தமிழில் பரவலாக அறியப்படும் தெய்வீகப் பெயர் வடிவம்; மூலத்தில் உள்ள தனிப்பெயரை ஒரு பட்டத்தால் மாற்றாமல் வெளிப்படுத்துகிறது.
- source_word: מָעֻזְּכֶם
  choice: உங்கள் அரண்
  rationale: வலிமை, பாதுகாப்பிடம், கோட்டை ஆகியவற்றை உணர்த்தும் உருவகத்தை ‘அரண்’ சுருக்கமாகவும் இயல்பாகவும் காக்கிறது.
theological_decisions:
- issue: חֶדְוַת יְהוָה என்பதன் பொருள்
  choice: யெகோவாவின் மகிழ்ச்சி
  alternative: யெகோவாவில் கொள்ளும் மகிழ்ச்சி
  rationale: உடைமைத் தொடர்புடைய எபிரெயக் கட்டமைப்பை முதன்மை உரையில் காக்கிறது; மகிழ்ச்சியின் பொருள் அல்லது மூலத்தை விளக்கி இறையியல் நெருக்கடியை மறைமுகமாகத் தீர்ப்பதைத் தவிர்க்கிறது. மாற்றுப் புரிதல் அடிக்குறிப்பில் தரப்படுகிறது.
- issue: יְהוָה என்ற தெய்வீகப் பெயர்
  choice: யெகோவா
  alternative: யாவே
  rationale: தலைப்புச் சொல்லான ‘கர்த்தர்’ என்பதற்குப் பதிலாக மூலத்தின் தனிப்பெயரை வெளிப்படுத்துகிறது; நவீன தமிழ் வேதாகமப் பயன்பாட்டில் பரவலாக அறியப்படும் வடிவம் தேர்ந்தெடுக்கப்பட்டது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. கொண்டாட்ட உணவின் செழுமை, பகிர்ந்தளித்தல், நாளின் பரிசுத்தம், ‘அரண்’ என்ற வலுவான உருவகம் ஆகியவை காக்கப்பட்டுள்ளன.
