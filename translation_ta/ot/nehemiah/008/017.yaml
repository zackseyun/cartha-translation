  text: וַ/יַּֽעֲשׂ֣וּ כָֽל הַ֠/קָּהָל הַ/שָּׁבִ֨ים מִן הַ/שְּׁבִ֥י סֻכּוֹת֮ וַ/יֵּשְׁב֣וּ בַ/סֻּכּוֹת֒ כִּ֣י לֹֽא עָשׂ֡וּ מִ/ימֵי֩ יֵשׁ֨וּעַ בִּן נ֥וּן כֵּן֙ בְּנֵ֣י יִשְׂרָאֵ֔ל עַ֖ד הַ/יּ֣וֹם הַ/ה֑וּא וַ/תְּהִ֥י שִׂמְחָ֖ה גְּדוֹלָ֥ה מְאֹֽד־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/008/017.yaml
  text: And all the assembly of those who had returned from the captivity made booths and lived in the booths[a], for the sons of Israel had not done so from the days of Jeshua son of Nun until that day. And there was very great rejoicing.
translation:
  language: ta
  text: சிறையிருப்பிலிருந்து திரும்பி வந்த சமூகத்தினர் அனைவரும் குடில்களை அமைத்து, அவற்றில் தங்கினார்கள். நூனின் மகன் யேசுவாவின்[a] நாட்களிலிருந்து அந்த நாள்வரை இஸ்ரவேல் மக்கள் இவ்வாறு செய்ததில்லை. மிகப் பெரும் மகிழ்ச்சி உண்டாயிற்று.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: யேசுவா என்பது நூனின் மகன் யோசுவாவைக் குறிக்கிறது.
    reason: மூலத்தில் உள்ள יֵשׁוּעַ என்ற பெயர் வடிவத்தையும், வாசகர்களுக்கு நன்கு அறிமுகமான யோசுவா என்ற பெயரையும் தொடர்புபடுத்துகிறது.
lexical_decisions:
- source_word: הַקָּהָל
  choice: சபையார்
  rationale: கூடி நிற்கும் சமூகத்தைக் குறிக்கும் קָהָל என்பதன் கூட்டுணர்வைத் தக்கவைத்தபடி, நவீனத் தமிழில் இயல்பாக ஒலிக்கிறது.
- source_word: הַשָּׁבִים מִן הַשְּׁבִי
  choice: சிறையிருப்பிலிருந்து திரும்பிவந்த
  rationale: திரும்பியவர்களையும் அவர்கள் திரும்பிவந்த சிறையிருப்பு நிலையையும் எபிரெய உரைக்கு நெருக்கமாக வெளிப்படுத்துகிறது.
- source_word: סֻכּוֹת
  choice: குடில்கள்
  rationale: பண்டிகையின்போது அமைக்கப்பட்ட தற்காலிக உறைவிடங்களைக் குறிக்கிறது; ‘கூடாரங்கள்’ என்பதால் வேறு வகை நகர்த்தக்கூடிய கூடாரமோ திருவாசஸ்தலமோ நினைவுக்கு வரக்கூடிய குழப்பம் தவிர்க்கப்படுகிறது.
- source_word: וַיֵּשְׁבוּ בַסֻּכּוֹת
  choice: அவற்றில் தங்கினார்கள்
  rationale: இச்சூழலில் יָשַׁב என்பது வெறுமனே ‘உட்காருதல்’ அல்ல, குடில்களில் வசித்தல் அல்லது தங்குதலைக் குறிக்கிறது.
- source_word: כִּי לֹא עָשׂוּ ... כֵּן
  choice: இவ்வாறு செய்ததில்லை
  rationale: முன்பு கூறப்பட்டபடி குடில்களை அமைத்து அவற்றில் தங்கிய முறையை כֵּן பின்னோக்கிச் சுட்டுகிறது; பண்டிகையே ஒருபோதும் கடைப்பிடிக்கப்படவில்லை என்று தேவையின்றி முடிவுசெய்யவில்லை.
- source_word: מִימֵי יֵשׁוּעַ בִּן נוּן
  choice: நூனின் மகன் யேசுவாவின் நாட்களிலிருந்து
  rationale: இவ்வசனத்தில் காணப்படும் יֵשׁוּעַ என்ற வடிவத்தை ‘யேசுவா’ எனப் பிரதிபலிக்கிறது; பரவலாக அறியப்படும் ‘யோசுவா’ வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்கள்
  rationale: இங்கு בְּנֵי יִשְׂרָאֵל என்பது தனிப்பட்ட ஆண் பிள்ளைகளை அல்ல, இன உடன்படிக்கைச் சமூகத்தையே குறிக்கும் வழக்கமான பெயர்; ‘இஸ்ரவேல் மக்கள்’ நவீனத் தமிழில் அந்தப் பொருளைத் தெளிவாகக் கொடுக்கிறது.
- source_word: וַתְּהִי שִׂמְחָה גְּדוֹלָה מְאֹד
  choice: அப்போது மிகப் பெரும் மகிழ்ச்சி உண்டாயிற்று
  rationale: שִׂמְחָה என்பதன் சமூக மகிழ்ச்சியையும் גְּדוֹלָה מְאֹד என்பதன் வலியுறுத்தலையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל என்பதன் மொழிபெயர்ப்பு
  choice: இஸ்ரவேல் மக்கள்
  alternative: இஸ்ரவேலின் மகன்கள்
  rationale: எபிரெய சொற்றொடர் இலக்கணத்தில் ஆண்பால் வடிவமாயிருந்தாலும், இங்கு முழு இஸ்ரவேல் சமூகத்தைக் குறிக்கும் நிலையான இனப்பெயராகச் செயல்படுகிறது. தமிழில் ‘மகன்கள்’ என்பது ஆண்களை மட்டும் குறிப்பதாகத் தவறாகப் புரியக்கூடும்; ஆகவே பொருளைச் சுருக்காமலும் பாலினத்தைப் பற்றிய தவறான வரம்பை உருவாக்காமலும் ‘மக்கள்’ பயன்படுத்தப்படுகிறது.
- issue: יֵשׁוּעַ בִּן נוּן என்பவரின் பெயர் வடிவம்
  choice: நூனின் மகன் யேசுவா
  alternative: நூனின் மகன் யோசுவா
  rationale: மூல வசனத்தில் உள்ள குறுகிய יֵשׁוּעַ வடிவம் முதன்மை உரையில் பிரதிபலிக்கப்படுகிறது; இதே நபரின் பரவலாக அறியப்படும் பெயரான ‘யோசுவா’ அடிக்குறிப்பில் அடையாளப்படுத்தப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியக்கூடிய ஆனால் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘உண்டாயிற்று’ என்ற இலக்கியத் தன்மையுள்ள வடிவம் வேதாகம வரலாற்றுரையின் மரியாதைமிக்க தொனியைத் தக்கவைக்கிறது; பிற சொற்றொடர்கள் தேவையற்ற பழமைநடையைத் தவிர்க்கின்றன.
