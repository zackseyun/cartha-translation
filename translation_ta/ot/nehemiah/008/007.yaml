source:
  edition: WLC
  text: וְ/יֵשׁ֡וּעַ וּ/בָנִ֡י וְ/שֵׁרֵ֥בְיָ֣ה יָמִ֡ין עַקּ֡וּב שַׁבְּתַ֣י הֽוֹדִיָּ֡ה מַעֲשֵׂיָ֡ה קְלִיטָ֣א עֲזַרְיָה֩ יוֹזָבָ֨ד חָנָ֤ן פְּלָאיָה֙ וְ/הַ/לְוִיִּ֔ם מְבִינִ֥ים אֶת הָ/עָ֖ם לַ/תּוֹרָ֑ה וְ/הָ/עָ֖ם עַל עָמְדָֽ/ם׀׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/008/007.yaml
  text: And Jeshua[a], Bani, Sherebiah, Jamin, Akkub, Shabbethai, Hodiah, Maaseiah, Kelita, Azariah, Jozabad, Hanan[b], Pelaiah, and the Levites explained the law to the people, while the people remained in their places.
translation:
  language: ta
  text: யேசுவா, பானி, செரெபியா, யாமின், அக்கூப், சப்பேத்தாய், ஓதியா, மாசெயா, கெலித்தா, அசரியா, யோசபாத், ஆனான், பெலாயா ஆகியோரும், லேவியர்களும் மக்களுக்குத் திருச்சட்டத்தைப் புரியவைத்தார்கள்[a]; மக்கள் தங்கள் இடங்களிலேயே இருந்தார்கள்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மக்களுக்குத் திருச்சட்டத்தைப் பற்றிய புரிதலை அளித்தார்கள்.” எபிரெய வினைச்சொல் காரணவினை வடிவில் உள்ளது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “மக்கள் தங்கள் இடங்களில் நின்றுகொண்டிருந்தார்கள்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/יֵשׁוּעַ ... פְּלָאיָה
  choice: யேசுவா ... பெலாயா
  rationale: தனிநபர் பெயர்கள் மொழிபெயர்க்கப்படாமல், எபிரெய ஒலிப்புக்கு நெருக்கமானதும் தமிழில் இயல்பாக வாசிக்கத்தக்கதுமான வடிவங்களில் ஒலிபெயர்க்கப்பட்டுள்ளன.
- source_word: וְהַלְוִיִּם
  choice: லேவியர்களும்
  rationale: எபிரெய உரையிலுள்ள இணைப்புச் சொல்லையும் பெயர்ச்சொல்லையும் தக்கவைத்து, பட்டியலிடப்பட்டவர்கள் லேவியர்களின் ஒரு பகுதியா அல்லது அவர்களோடு சேர்ந்த வேறொரு குழுவா என்பதை உரை கூறுவதைக் கடந்துத் தீர்மானிக்காமல் விடுகிறது.
- source_word: מְבִינִים אֶת־הָעָם לַתּוֹרָה
  choice: மக்களுக்குத் திருச்சட்டத்தை விளக்கிப் புரியவைத்தார்கள்
  rationale: בין என்பதன் Hiphil வடிவம் ‘புரிந்துகொள்ளச் செய்தல்’ என்ற காரணவினைப் பொருளைக் கொண்டது. ‘விளக்கிப் புரியவைத்தார்கள்’ என்பது அந்தப் பொருளை இயல்பான நவீன தமிழில் தெளிவாகத் தருகிறது.
- source_word: לַתּוֹרָה
  choice: திருச்சட்டத்தை
  rationale: இந்த உடன்படிக்கைச் சூழலில் תּוֹרָה மோசேயின் சட்டம்/தோராவைக் குறிக்கிறது. ‘திருச்சட்டம்’ என்பது பொதுவாசகர்களுக்குப் புரியத்தக்கதாய் இருந்து, சாதாரண மனிதச் சட்டத்திலிருந்து இதை வேறுபடுத்துகிறது.
- source_word: וְהָעָם עַל עָמְדָם
  choice: அப்போது மக்கள் தங்கள் இடங்களிலேயே இருந்தார்கள்
  rationale: மக்கள் தங்களுக்குரிய இடத்தில் தொடர்ந்து இருந்தனர் என்ற எபிரெயச் சொற்றொடரின் சூழல்சார் பொருளை இயல்பான தமிழில் தருகிறது; ‘நின்றார்கள்’ என்ற நேரடியான வாசிப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
theological_decisions:
- issue: תּוֹרָה என்பதன் பரப்பு
  choice: திருச்சட்டம்
  alternative: தோரா; போதனை
  rationale: நிகழ்வின் சூழல் பொதுவாக வாசிக்கப்பட்ட உடன்படிக்கைச் சட்டத்தைச் சுட்டுகிறது. இருப்பினும் இந்தத் தேர்வு குறிப்பிட்ட சமயப்பிரிவின் விளக்கத்தைச் சேர்க்காமல், சொல்லின் போதனை சார்ந்த இயல்பையும் முற்றிலும் மறைக்காத பொதுவான வடிவமாக உள்ளது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. பெயர்கள் எபிரெய வடிவங்களை அடிப்படையாகக் கொண்டு ஒலிபெயர்க்கப்பட்டுள்ளன. பட்டியலுக்கும் ‘லேவியர்கள்’ என்பதற்கும் இடையிலான எபிரெய அமைப்பின் தெளிவின்மை தீர்மானிக்கப்படாமல் பாதுகாக்கப்பட்டுள்ளது.
