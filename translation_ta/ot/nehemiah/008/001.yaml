base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/008/001.yaml
  text: And all the people gathered as one man at the square that was before the Water Gate[a], and they told Ezra the scribe to bring the Book of the Law of Moses, which Yahweh had commanded Israel.
translation:
  language: ta
  text: மக்கள் அனைவரும் ஒரே மனிதரைப்போல்[a] தண்ணீர் வாசலுக்கு முன்னிருந்த திறந்தவெளியில் ஒன்றுகூடினார்கள். அவர்கள் எழுத்தராகிய எஸ்றாவிடம், யாவே இஸ்ரவேலுக்குக் கட்டளையிட்ட மோசேயின் திருச்சட்ட நூலைக் கொண்டுவரச் சொன்னார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ஒரே மனிதரைப்போல்” என்பது “ஒருமனப்பட்டு” அல்லது “ஒரே மனதுடன்” என்று பொருள்படும் எபிரெய மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּאָסְפוּ
  choice: ஒன்றுகூடினார்கள்
  rationale: நிபால் வடிவம் மக்கள் ஒரே இடத்தில் கூடிவந்த கூட்டுச் செயலைக் குறிக்கிறது; நவீன தமிழில் இயல்பான இணைச்சொல்.
- source_word: כָל הָעָם
  choice: மக்கள் அனைவரும்
  rationale: முழுச் சமூகத்தையும் கூட்டாகக் குறிக்கும் எபிரெயச் சொற்றொடரை இயல்பான தமிழில் தருகிறது.
- source_word: כְּאִישׁ אֶחָד
  choice: ஒரே மனிதரைப்போல்
  rationale: ஒருமித்த செயலை உணர்த்தும் எபிரெய உருவகத்தை அழிக்காமல் தக்கவைக்கிறது; அதன் பொருள் அடிக்குறிப்பில் தெளிவுபடுத்தப்படுகிறது.
- source_word: הָרְחוֹב
  choice: திறந்த வெளி
  rationale: இது நவீன அர்த்தத்திலான தெருவையல்ல, நகருக்குள் இருந்த பொதுவான திறந்த இடத்தைக் குறிக்கிறது.
- source_word: לִפְנֵי שַׁעַר הַמָּיִם
  choice: தண்ணீர் வாசலுக்கு முன்பிருந்த
  rationale: இடத்தைக் குறிக்கும் எபிரெயத் தொடரைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: וַיֹּאמְרוּ לְעֶזְרָא ... לְהָבִיא
  choice: எஸ்றாவிடம் ... கொண்டுவரச் சொன்னார்கள்
  rationale: சொல்லுதல் என்ற வினையும் அதனுடன் வரும் நோக்கவினையும் தமிழில் இயல்பாக இணைக்கப்படுகின்றன; வேண்டுகோள் என்ற கூடுதல் நயத்தைப் புகுத்தவில்லை.
- source_word: הַסֹּפֵר
  choice: வேதபாரகர்
  rationale: எழுத்துப் பிரதியாளர் மட்டுமல்லாமல் திருச்சட்டத்தில் தேர்ச்சி பெற்ற அதிகாரப்பூர்வப் பங்கையும் இச்சூழலில் வெளிப்படுத்தும் நிலைபெற்ற தமிழ் வேதாகமச் சொல்.
- source_word: סֵפֶר תּוֹרַת מֹשֶׁה
  choice: மோசேயின் திருச்சட்ட நூல்
  rationale: סֵפֶר என்பது நூல் அல்லது சுருளைக் குறிக்கலாம்; குறிப்பிட்ட ஊடக வடிவத்தைத் தீர்மானிக்காமல் 'நூல்' அந்தத் தெளிவின்மையைப் பாதுகாக்கிறது. תּוֹרָה-வை வெறும் சட்டம் என்ற குறுகிய நவீன பொருளிலிருந்து வேறுபடுத்த 'திருச்சட்டம்' பயன்படுத்தப்படுகிறது.
- source_word: אֲשֶׁר צִוָּה יְהוָה אֶת יִשְׂרָאֵל
  choice: யெகோவா இஸ்ரவேலுக்குக் கட்டளையிட்ட
  rationale: எபிரெயத் தொடர் சுருக்கமாக இருந்தாலும், இங்கு திருச்சட்டம் இஸ்ரவேல்மீது விதிக்கப்பட்டது என்பதே பொருள்; தமிழ் இலக்கணத்தில் இயல்பாக 'இஸ்ரவேலுக்கு' எனத் தரப்படுகிறது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: தலைப்பால் மாற்றாமல் தேவனுடைய தனிப்பெயரைத் தமிழில் நிலைபெற்ற ஒலிபெயர்ப்பாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: כְּאִישׁ אֶחָד என்ற ஒருமைப்பாட்டு மரபுத்தொடர்
  choice: ஒரே மனிதரைப்போல்
  alternative: ஒருமனப்பட்டு / ஒருவரைப்போல்
  rationale: மூலத்தில் உள்ள ஆண்பால் ஒருமை உருவகத்தை முதன்மை உரையில் பாதுகாத்து, அதன் செயல்பாட்டுப் பொருளை அடிக்குறிப்பில் விளக்குகிறது.
- issue: יהוה என்ற இறைப்பெயர்
  choice: யெகோவா
  alternative: யாவே / கர்த்தர்
  rationale: மூலத்தில் தனிப்பெயர் நேரடியாக உள்ளதால் அதை ஒரு பட்டப்பெயரால் மாற்றாமல், தமிழ் வாசகர்களிடையே நிலைபெற்ற ஒலிபெயர்ப்பில் தருகிறது.
- issue: יהוה கட்டளையிட்டது நூலா, நூலிலுள்ள திருச்சட்டமா என்பதன் இலக்கணச் சுருக்கம்
  choice: யெகோவா இஸ்ரவேலுக்குக் கட்டளையிட்ட மோசேயின் திருச்சட்ட நூல்
  alternative: யெகோவா இஸ்ரவேலுக்குக் கட்டளையிட்ட திருச்சட்டத்தைக் கொண்ட மோசேயின் நூல்
  rationale: மூலத்தின் சுருக்கமான தொடர்பை விரித்து விளக்காமல் பாதுகாக்கிறது; கட்டளை நூலின் பொருளான திருச்சட்டத்தைக் குறிக்கிறது என்பது சூழலால் புரிகிறது.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. வரலாற்றுச் சூழலுக்கேற்ற 'வாசல்', 'வேதபாரகர்', 'திருச்சட்டம்' ஆகிய சொற்கள் தக்கவைக்கப்பட்டுள்ளன; வாக்கிய அமைப்பு பொதுவாசகர்களுக்காக எளிமைப்படுத்தப்பட்டுள்ளது.
