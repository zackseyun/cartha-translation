  text: וְ/הַ/לְוִיִּ֞ם מַחְשִׁ֤ים לְ/כָל הָ/עָם֙ לֵ/אמֹ֣ר הַ֔סּוּ כִּ֥י הַ/יּ֖וֹם קָדֹ֑שׁ וְ/אַל תֵּעָצֵֽבוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/008/011.yaml
  text: And the Levites were quieting all the people[a], saying, “Be still, for the day is holy[b]; do not be grieved.”
translation:
  language: ta
  text: லேவியர்கள் மக்கள் அனைவரையும் அமைதிப்படுத்தி, “அமைதியாக இருங்கள்[a]; ஏனெனில் இந்நாள் பரிசுத்தமானது. வருத்தப்படாதீர்கள்[b]” என்று கூறினார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது “சத்தமிடாமல் இருங்கள்” அல்லது “பேசாமல் இருங்கள்.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது “துக்கப்படாதீர்கள்” அல்லது “சோகமடையாதீர்கள்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַלְוִיִּם
  choice: லேவியர்கள்
  rationale: ஆலயப் பணிகளுடன் தொடர்புடைய இக்குழுவுக்கான தமிழில் நிலைபெற்ற பெயர்; இணைப்புச் சொல் தமிழின் இயல்பான வாக்கிய ஓட்டத்தில் தனியே மொழிபெயர்க்கப்படவில்லை.
- source_word: מַחְשִׁים
  choice: அமைதிப்படுத்தி … கூறிக்கொண்டிருந்தார்கள்
  rationale: மக்களை அமைதியாக்கும் தொடர்ச்சியான செயலை எபிரெயப் பங்கேற்புவினை உணர்த்துகிறது; தமிழில் தொடர்நிலையை முதன்மை வினையின் வடிவம் வெளிப்படுத்துகிறது.
- source_word: לְכָל הָעָם
  choice: மக்கள் அனைவரையும்
  rationale: கூடியிருந்த மொத்த மக்களையும் குறிக்கும் இயல்பான நவீனத் தமிழ் வடிவம்.
- source_word: לֵאמֹר
  choice: என்று கூறிக்கொண்டிருந்தார்கள்
  rationale: நேர்கூற்றை அறிமுகப்படுத்துவதோடு, சூழலில் தொடர்ந்த செயல் என்ற நுணுக்கத்தையும் இயல்பான தமிழில் தருகிறது.
- source_word: הַסּוּ
  choice: அமைதியாக இருங்கள்
  rationale: சத்தத்தையோ அழுகையையோ நிறுத்தி அமைதியாயிருக்கும்படி கூறும் பன்மை ஏவலை மரியாதையான, தெளிவான தமிழில் தருகிறது.
- source_word: כִּי הַיּוֹם קָדֹשׁ
  choice: ஏனெனில் இந்நாள் பரிசுத்தமானது
  rationale: כִּי காரணத்தைக் குறிக்கிறது; הַיּוֹם சூழலில் குறிப்பிட்ட அந்நாளைக் குறிக்கிறது; קָדֹשׁ என்பதன் உடன்படிக்கை மற்றும் வழிபாட்டுச் செறிவை ‘பரிசுத்தமானது’ காக்கிறது.
- source_word: וְאַל תֵּעָצֵבוּ
  choice: வருத்தப்படாதீர்கள்
  rationale: துயரம் அல்லது மனவேதனை அடையாதிருக்கும்படி கூறும் தடையைத் தருகிறது; சடங்குசார் புலம்பலை மட்டும் குறிப்பதாக அளவுக்கு மீறி வரையறுக்கவில்லை.
theological_decisions:
- issue: கூட்டு வழிபாட்டுச் சூழலில் קָדֹשׁ என்பதன் மொழிபெயர்ப்பு
  choice: பரிசுத்தமானது
  alternative: புனிதமானது
  rationale: அந்த நாள் தேவனுக்கென்று பிரித்துவைக்கப்பட்ட தன்மையைத் தெளிவாகவும், சொல்லின் இறையியல் செறிவைக் குறைக்காமலும் ‘பரிசுத்தமானது’ தெரிவிக்கிறது.
- issue: תֵעָצֵבוּ குறிக்கும் துயரத்தின் தன்மை
  choice: வருத்தப்படாதீர்கள்
  alternative: துக்கப்படாதீர்கள் / சோகமடையாதீர்கள்
  rationale: மக்களின் உணர்ச்சிப்பூர்வமான வேதனையை உள்ளடக்குகிறது; ஆனால் இதை முறையான துக்கச்சடங்காக மட்டும் தீர்மானிப்பதைத் தவிர்க்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசிப்புக்கு ஏற்ற கண்ணியமான நடை. ‘கூறிக்கொண்டிருந்தார்கள்’ தொடர்ச்சியான செயலை வெளிப்படுத்துகிறது; ‘பரிசுத்தமானது’ மூலத்தின் இறையியல் வலிமையைப் பேணுகிறது. அடிக்குறிப்பு குறிகள் அவை விளக்கும் சொற்றொடர்களுக்குப் பின்பே வைக்கப்பட்டுள்ளன.
