base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/008/009.yaml
  text: Then Nehemiah the governor[a], Ezra the priest and scribe, and the Levites who were instructing the people said to all the people, “This day is holy to Yahweh your God[b]. Do not mourn or weep.” For all the people were weeping as they heard the words of the law.
translation:
  language: ta
  text: அப்போது ஆளுநரான[a] நெகேமியாவும், ஆசாரியரும் வேதபாரகருமான எஸ்றாவும், மக்களுக்கு விளக்கமளித்துக்கொண்டிருந்த லேவியர்களும் மக்கள் அனைவரிடமும், “இந்த நாள் உங்கள் கடவுளாகிய யாவேக்குப் பரிசுத்தமானது. துக்கப்படாதீர்கள்; அழாதீர்கள்” என்றார்கள். ஏனெனில், திருச்சட்டத்தின் வார்த்தைகளைக் கேட்டபோது மக்கள் அனைவரும் அழுதுகொண்டிருந்தார்கள்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “திர்ஷாத்தா”; இது பாரசீக நிர்வாகப் பட்டம்.
    reason: lexical_alternative
  - marker: b
    text: “திருச்சட்டத்தின் வார்த்தைகள்” என்பதை “தோராவின் வார்த்தைகள்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַתִּרְשָׁתָא
  choice: ஆளுநர்
  rationale: பாரசீகக் கால நிர்வாகப் பட்டத்தின் செயல்பாட்டை நவீன தமிழ் வாசகருக்குத் தெளிவாகத் தெரிவிக்கிறது; மூலப் பட்டம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: הַכֹּהֵן הַסֹּפֵר
  choice: ஆசாரியரும் வேதபாரகருமான
  rationale: எஸ்றாவின் இரு இணைப்பட்டங்களையும் இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: הַלְוִיִּם הַמְּבִינִים אֶת־הָעָם
  choice: மக்களுக்கு விளக்கமளித்த லேவியர்கள்
  rationale: בין என்பதன் ஹிஃபில் வடிவம் மக்களைப் புரிந்துகொள்ளச் செய்தல் அல்லது அறிவுறுத்துதல் என்னும் பொருளைக் கொண்டது; ‘விளக்கமளித்த’ என்பது இச்சூழலின் போதனைப் பணியை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: הַיּוֹם קָדֹשׁ הוּא
  choice: இந்த நாள் ... பரிசுத்தமானது
  rationale: நாளின் வழிபாட்டுக்குரிய தனித்துவத்தை நேரடியாகவும் கண்ணியமாகவும் வெளிப்படுத்துகிறது.
- source_word: לַיהוָה
  choice: யாவேக்கு
  rationale: ל முன்னிடைச்சொல்லின் ‘யாவேக்கு/யாவேவுக்குரியது’ என்ற உறவைத் தமிழில் சுருக்கமாகப் பிரதிபலிக்கிறது.
- source_word: תִּתְאַבְּלוּ
  choice: துக்கப்படாதீர்கள்
  rationale: வெளிப்படையான துயரச்செயலையும் உள்ளார்ந்த துக்கத்தையும் குறிக்கும் வினையை அடுத்துள்ள ‘அழாதீர்கள்’ என்பதிலிருந்து வேறுபடுத்துகிறது.
- source_word: תִּבְכּוּ / בוֹכִים
  choice: அழாதீர்கள் / அழுதுகொண்டிருந்தார்கள்
  rationale: காட்சியின் உணர்ச்சியையும் தொடர்ச்சியான செயற்பாட்டையும் இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: כְּשָׁמְעָם
  choice: கேட்டபோது
  rationale: திருச்சட்ட வார்த்தைகளைக் கேட்டதுடன் தொடர்புடைய மக்களின் உடனடியான எதிர்வினையைத் தெளிவாகக் காட்டுகிறது.
- source_word: דִּבְרֵי הַתּוֹרָה
  choice: திருச்சட்டத்தின் வார்த்தைகள்
  rationale: תּוֹרָה என்பதன் சட்டம்/போதனை சார்ந்த உட்பொருளை இப்பொது உடன்படிக்கை வாசிப்புச் சூழலில் தெரிவிக்கிறது; ‘தோரா’ மாற்று அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
theological_decisions:
- issue: יהוה என்ற இறைபெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: எபிரேய மூலத்தில் உள்ள உடன்படிக்கைப் பெயரைப் பெயராகவே வெளிப்படுத்தி, பொதுப்பட்டமாக மாற்றாமல் பாதுகாக்கிறது.
- issue: תּוֹרָה என்பதன் பொருள்
  choice: திருச்சட்டம்
  alternative: தோரா; போதனை
  rationale: இச்சூழல் பொதுமக்களுக்கு வாசிக்கப்பட்ட உடன்படிக்கைச் சட்டத்தைக் குறிக்கிறது; அதேவேளை ‘தோரா’ என்ற மூலச்சொல் அடிக்குறிப்பில் தரப்பட்டு பொருள் பரப்பு பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன தரத் தமிழில் கண்ணியமான, பொதுவாசகருக்குப் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. ‘ஆசாரியர்’, ‘வேதபாரகர்’, ‘லேவியர்’, ‘பரிசுத்தம்’, ‘திருச்சட்டம்’ ஆகியவை பரவலாக அறியப்பட்ட வேதாகமச் சொற்களாக இருப்பதால் தக்கவைக்கப்பட்டுள்ளன. எல்லா அடிக்குறிப்பு குறிகளும் பிரதான உரையில் இடம்பெற்றுள்ளன.
