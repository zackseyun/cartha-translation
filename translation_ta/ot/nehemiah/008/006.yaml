source:
  edition: WLC
  text: וַ/יְבָ֣רֶךְ עֶזְרָ֔א אֶת יְהוָ֥ה הָ/אֱלֹהִ֖ים הַ/גָּד֑וֹל וַ/יַּֽעֲנ֨וּ כָל הָ/עָ֜ם אָמֵ֤ן אָמֵן֙ בְּ/מֹ֣עַל יְדֵי/הֶ֔ם וַ/יִּקְּד֧וּ וַ/יִּשְׁתַּחֲוֻּ֛ לַ/יהוָ֖ה אַפַּ֥יִם אָֽרְצָ/ה־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/008/006.yaml
  text: And Ezra blessed Yahweh[a], the great God, and all the people answered, “Amen, Amen,” while lifting up their hands. Then they bowed down and worshiped Yahweh with their faces to the ground.
translation:
  language: ta
  text: எஸ்றா மகத்தான இறைவனாகிய யாவேவை வாழ்த்தினார். மக்கள் அனைவரும் தங்கள் கைகளை உயர்த்தியவாறு, “ஆமென், ஆமென்”[a] என்று மறுமொழி கூறினார்கள். பின்பு அவர்கள் தலைவணங்கி, தரையில் முகங்குப்புறப் பணிந்து யாவேவை வழிபட்டார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ஆமென், ஆமென்” என்பது கூறப்பட்டவற்றை உறுதியாக ஏற்றுக்கொள்வதைக் காட்டும், இருமுறை சொல்லப்பட்ட வழிபாட்டு மறுமொழி.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְבָרֶךְ
  choice: வாழ்த்தினார்
  rationale: தேவனைச் செயப்படுபொருளாகக் கொண்ட பியேல் வடிவில், ஆசீர்வதித்தல் அல்லது புகழ்ந்து வாழ்த்துதல் என்ற பொருள் உள்ளது. தமிழில் தேவனை நோக்கி மனிதர் செய்யும் செயலை இயல்பாகவும் மூலச்சொல்லின் நயத்தைப் பேணியும் ‘வாழ்த்தினார்’ தெரிவிக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: நான்கெழுத்துத் திருப்பெயரை ஒரு பட்டத்தால் மாற்றாமல், எபிரெயத் தனிப்பெயரின் பொதுவாக ஏற்றுக்கொள்ளப்பட்ட தமிழ் ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: הָאֱלֹהִים הַגָּדוֹל
  choice: மகத்தான இறைவன்
  rationale: யாவேவை அடையாளப்படுத்தும் இணைப்புச் சொற்றொடரை இயல்பான தமிழில் தருகிறது; גָּדוֹל என்பதன் பெருமை வலியுறுத்தலும் காக்கப்படுகிறது.
- source_word: וַיַּעֲנוּ
  choice: மறுமொழி கூறினார்கள்
  rationale: மக்கள் வழிபாட்டுச் சூழலில் வாய்மொழியாகப் பதிலளித்ததைத் தெளிவாகவும் இயல்பாகவும் காட்டுகிறது.
- source_word: אָמֵן אָמֵן
  choice: ஆமென், ஆமென்
  rationale: வழிபாட்டில் பயன்படும் ஒப்புதல் மொழியை ஒலிபெயர்ப்பாக வைத்துக் கொண்டு, அதன் வலியுறுத்தும் இரட்டிப்பையும் பாதுகாக்கிறது.
- source_word: בְּמֹעַל יְדֵיהֶם
  choice: தங்கள் கைகளை உயர்த்தியவாறு
  rationale: மக்களின் மறுமொழியுடன் இணைந்து நிகழ்ந்த உடல் அசைவை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: וַיִּקְּדוּ
  choice: குனிந்து
  rationale: קדד குறிக்கும் உடலைத் தாழ்த்தும் முதற்செயலைத் தனியே காக்கிறது; அடுத்துள்ள வழிபாட்டு வினையுடன் ஒன்றாக்கவில்லை.
- source_word: וַיִּשְׁתַּחֲווּ
  choice: வழிபட்டார்கள்
  rationale: இந்தச் சூழலில் உடல் பணிவுடன் கூடிய வழிபாட்டைக் குறிக்கிறது. முந்தைய வினை குனிதலை ஏற்கெனவே கூறுவதால், இதன் பக்திசார் பொருள் தெளிவாகத் தரப்படுகிறது.
- source_word: אַפַּיִם אָרְצָה
  choice: தரையில் முகங்குப்புற விழுந்து
  rationale: சொல்லடியாக ‘முகங்கள் நிலத்தை நோக்கி’ என்ற முழுமையான பணிவு நிலையை, சாதாரண தமிழ் வாசகருக்குத் தெளிவான உடல் நிலையாக்கிக் கூறுகிறது.
theological_decisions:
- issue: יהוה என்ற இறைத் தனிப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: ஆண்டவர்; யெகோவா
  rationale: மூலத்தில் தனிப்பெயர் நேரடியாக இருப்பதால் அதை ஒரு பட்டத்தால் மாற்றாமல் ஒலிபெயர்த்துள்ளது. ‘யாவே’ என்பது எபிரெயப் பெயரின் பரவலாக ஏற்கப்படும் மறுகட்டமைக்கப்பட்ட உச்சரிப்பைத் தமிழில் நெருக்கமாகக் காட்டுகிறது.
- issue: וַיְבָרֶךְ என்பதில் மனிதர் தேவனை ‘வாழ்த்துதல்’
  choice: வாழ்த்தினார்
  alternative: புகழ்ந்தார்; ஆசீர்வதித்தார்
  rationale: மூல வினையின் பாரம்பரிய ‘bless’ நயத்தையும் தேவனை நோக்கிய புகழ்/வாழ்த்து பொருளையும் தக்கவைக்கிறது. ‘ஆசீர்வதித்தார்’ என்பது நவீன தமிழில் மனிதர் தேவனுக்கு அருள் வழங்குவது போலத் தவறாகப் புரியக்கூடும்; ‘புகழ்ந்தார்’ மட்டும் மூலத்தின் பரந்த நயத்தைச் சுருக்கலாம்.
translation_notes:
  register: நவீன செந்தமிழுக்கு நெருக்கமான, எளிதில் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘யாவே’, ‘ஆமென்’ ஆகியவை ஒலிபெயர்ப்புகளாக வைக்கப்பட்டுள்ளன. இரண்டு தனித்த எபிரெய வினைகளும் ‘குனிந்து’ மற்றும் ‘வழிபட்டார்கள்’ என வேறுபடுத்தப்பட்டுள்ளன; இறுதி உடல்நிலை ‘முகங்குப்புற’ எனத் தெளிவாக்கப்பட்டுள்ளது.
