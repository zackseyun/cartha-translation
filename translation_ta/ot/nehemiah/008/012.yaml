base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/008/012.yaml
  text: And all the people went away to eat and drink[a], to send portions, and to celebrate with great joy[b], because they had understood the words that had been made known to them.
translation:
  language: ta
  text: மக்கள் அனைவரும் அங்கிருந்து புறப்பட்டுச் சென்று, உண்ணவும் குடிக்கவும், பங்குகளை அனுப்பவும்[a], மிகுந்த மகிழ்ச்சியுடன் கொண்டாடவும் செய்தார்கள். ஏனெனில் தங்களுக்கு அறிவிக்கப்பட்ட வார்த்தைகளை அவர்கள் புரிந்துகொண்டார்கள்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘உணவுப் பங்குகளை அனுப்பவும்’—அதாவது, விழாக்காலக் கொண்டாட்டத்தின் ஒரு பகுதியாக மற்றவர்களுக்கு உணவுப் பங்குகளை அனுப்புவது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘தங்களுக்கு விளக்கப்பட்ட விஷயங்களை.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלְכוּ כָל הָעָם
  choice: மக்கள் அனைவரும் அங்கிருந்து சென்று
  rationale: הלך இங்கு கூடியிருந்த இடத்திலிருந்து மக்கள் புறப்பட்டுச் சென்றதைத் தொடர்கதை வடிவில் குறிக்கிறது. ‘அங்கிருந்து சென்று’ என்பது தமிழில் இயல்பாக அந்தப் புறப்பாட்டை வெளிப்படுத்துகிறது.
- source_word: לֶאֱכֹל וְלִשְׁתּוֹת
  choice: உண்டு குடிக்கவும்
  rationale: சென்றதன் நோக்கத்தைக் குறிக்கும் இரு எபிரெய இறந்தெச்சங்களையும் சுருக்கமான, இயல்பான தமிழ் இணைப்பாக வழங்குகிறது.
- source_word: וּלְשַׁלַּח מָנוֹת
  choice: பங்குகளை அனுப்பவும்
  rationale: מָנוֹת என்பது ஒதுக்கப்பட்ட பங்குகளை, இச்சூழலில் பெரும்பாலும் உணவுப் பங்குகளை, குறிக்கிறது. ‘பங்குகள்’ மூலத்தின் சுருக்கத்தையும் சூழல்சார் பொருளையும் காக்கிறது; உணவைக் குறிக்கும் சாத்தியம் அடிக்குறிப்பில் விளக்கப்படுகிறது.
- source_word: וְלַעֲשׂוֹת שִׂמְחָה גְדוֹלָה
  choice: மிகுந்த மகிழ்ச்சியுடன் கொண்டாடவும் செய்தார்கள்
  rationale: சொல்லுக்குச் சொல் ‘பெரிய மகிழ்ச்சியைச் செய்ய’ என்பதைக் காட்டிலும், விழாக்கால மகிழ்ச்சியான செயலை நவீன தமிழில் இயல்பாக வெளிப்படுத்துகிறது; גְדוֹלָה-வின் வலிமையை ‘மிகுந்த’ காக்கிறது.
- source_word: כִּי הֵבִינוּ
  choice: ஏனெனில் ... அவர்கள் புரிந்துகொண்டிருந்தார்கள்
  rationale: כִּי மகிழ்ச்சிக்கான காரணத்தை அறிமுகப்படுத்துகிறது. நிறைவுற்ற புரிதல் அவர்களின் செயல்களுக்கு அடிப்படையாக இருந்ததை ‘புரிந்துகொண்டிருந்தார்கள்’ தெளிவுபடுத்துகிறது.
- source_word: בַּדְּבָרִים
  choice: வார்த்தைகளை
  rationale: דְּבָרִים என்பதற்கு ‘வார்த்தைகள்’ அல்லது ‘விஷயங்கள்’ என்று பொருள் வரலாம். நியாயப்பிரமாணம் வாசிக்கப்பட்டு விளக்கப்பட்ட சூழலில் ‘வார்த்தைகள்’ வாய்மொழியாக அறிவிக்கப்பட்ட உள்ளடக்கத்தை நன்கு காக்கிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: אֲשֶׁר הוֹדִיעוּ לָהֶם
  choice: தங்களுக்கு அறிவிக்கப்பட்ட
  rationale: ידע என்பதன் ஹிப்ஃபில் வடிவம் ‘அறியச் செய்தல்/அறிவித்தல்’ என்று பொருள்படும். செய்பவரை மூலவசனம் இங்கு பெயரிடாததால், தமிழ் செயப்பாட்டு வடிவம் உள்ளடக்கத்தின் மீதான கவனத்தைத் தக்கவைக்கிறது.
theological_decisions:
- issue: நியாயப்பிரமாணத்திற்கான மக்களின் பதிலின் தன்மை
  choice: அறிவிக்கப்பட்ட வார்த்தைகளைப் புரிந்துகொண்டதே அவர்களின் பெருமகிழ்ச்சிக்கான நேரடிக் காரணம் என்று மொழிபெயர்க்கப்பட்டது.
  alternative: இதை முதன்மையாக மனந்திரும்புதலுக்குப் பிந்தைய கொண்டாட்டம் அல்லது தொழில்நுட்பமான அர்த்தத்தில் உடன்படிக்கைப் புதுப்பித்தல் என்று விரிவுபடுத்துதல்.
  rationale: இவ்வசனம் மக்களின் மகிழ்ச்சியை அவர்களுடைய புரிதலோடு வெளிப்படையாக இணைக்கிறது. பரந்த சூழலில் கூடுதல் இறையியல் கருத்துகள் இருக்கக்கூடியபோதிலும், அவற்றை வசனத்துக்குள் சேர்க்காமல் அதன் காரணத் தொடர்பு பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் எளிதில் புரியக்கூடிய, அதே நேரத்தில் வேதாகம வாசிப்புக்கு ஏற்ற கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய வாக்கியத்தின் காரணத் தொடர்பும் தொடர் செயல்களும் காக்கப்பட்டுள்ளன; דְּבָרִים மற்றும் מָנוֹת ஆகியவற்றின் உண்மையான பொருள் விரிவுகள் அடிக்குறிப்புகளில் பாதுகாக்கப்பட்டுள்ளன.
