base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/008/018.yaml
  text: And he read from the Book of the Law of God day by day[a], from the first day to the last day. And they kept the feast seven days, and on the eighth day there was a solemn assembly[c][b], according to the ordinance.
translation:
  language: ta
  text: அவர் தேவனுடைய திருச்சட்டப் புத்தகத்திலிருந்து[a] முதல் நாள் தொடங்கி கடைசி நாள்வரை நாள்தோறும் வாசித்தார். அவர்கள் ஏழு நாட்கள் பண்டிகையைக் கொண்டாடினார்கள்; எட்டாம் நாளில் விதிமுறைப்படி[c] ஒரு புனிதப் பேரவை[b] நடைபெற்றது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘தேவனுடைய திருச்சட்டச் சுருளிலிருந்து’ என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் பொதுவாக எழுதப்பட்ட ஆவணத்தையும், குறிப்பாக ஒரு சுருளையும் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘நிறைவுப் பேரவை’ என்றும் மொழிபெயர்க்கலாம். இச்சொல் பண்டிகையின் முடிவில் நடைபெறும் புனிதமான சிறப்புக் கூடுகையைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, ‘விதிக்கப்பட்டபடி.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: அவர் வாசித்தார்
  rationale: קרא என்பதுடன் எழுதப்பட்ட ஆவணத்தைக் குறிக்கும் בְּסֵפֶר வருவதால், இங்கு சத்தமாக வாசித்தல் இயல்பான பொருள். எபிரெய வினையின் ஒருமைத் தன்னிலையைப் பேண ‘அவர்’ என மொழிபெயர்க்கப்பட்டது; சூழலில் அது எஸ்றாவைக் குறிக்கிறது.
- source_word: בְּסֵפֶר תּוֹרַת הָאֱלֹהִים
  choice: தேவனுடைய திருச்சட்டப் புத்தகத்திலிருந்து
  rationale: கட்டமைப்புத் தொடரை இயல்பான தமிழில் தெளிவாகக் கொடுக்கிறது. வாசித்தலுடன் வரும் בְּ தமிழில் ‘இலிருந்து’ என மொழிபெயர்க்கப்படுகிறது. סֵפֶר என்பது புத்தகத்தையோ சுருளையோ குறிக்கக்கூடும் என்பதால் மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்பட்டது.
- source_word: יוֹם בְּיוֹם
  choice: நாள்தோறும்
  rationale: ஒவ்வொரு நாளும் தொடர்ந்து நிகழ்ந்த செயலைக் குறிக்கும் எபிரெய மரபுத்தொடருக்கு இயல்பான நவீனத் தமிழ் இணை.
- source_word: מִן הַיּוֹם הָרִאשׁוֹן עַד הַיּוֹם הָאַחֲרוֹן
  choice: முதல் நாள் தொடங்கி கடைசி நாள்வரை
  rationale: குறிப்பிடப்பட்ட முழுக் கால எல்லையையும் உள்ளடக்கும் எபிரெயத் தொடரை நேரடியாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: וַיַּעֲשׂוּ חָג
  choice: அவர்கள் பண்டிகையைக் கொண்டாடினார்கள்
  rationale: עשה + חג என்பது ஒரு பண்டிகையை அனுசரித்தல் அல்லது கொண்டாடுதல் எனப் பொருள்படும். ‘கொண்டாடினார்கள்’ என்பது நவீன வாசகர்களுக்குத் தெளிவானதும், பண்டிகை அனுசரிப்பை இயல்பாகக் குறிப்பதும் ஆகும்.
- source_word: עֲצֶרֶת
  choice: சிறப்புப் பேரவை
  rationale: பண்டிகையின் முடிவுடன் தொடர்புடைய, விதிக்கப்பட்ட தனிப்பட்ட ஒன்றுகூடலை இச்சொல் குறிக்கிறது. ‘சிறப்புப் பேரவை’ அதன் வழிபாட்டு முக்கியத்துவத்தை உணர்த்துகிறது; ‘நிறைவுப் பேரவை’ என்ற சாத்தியத்தை அடிக்குறிப்பு காக்கிறது.
- source_word: כַּמִּשְׁפָּט
  choice: விதிமுறைப்படி
  rationale: இங்கு מִשְׁפָּט வழக்கமான பழக்கத்தை மட்டுமல்ல, பண்டிகைக்காக விதிக்கப்பட்ட ஒழுங்கை அல்லது சட்டத் தேவையைக் குறிக்கிறது.
theological_decisions:
- issue: வாசிப்பவரின் ஒருமையும் பண்டிகையைக் கொண்டாடுவோரின் பன்மையும்
  choice: ‘அவர் வாசித்தார்’; ‘அவர்கள் ... கொண்டாடினார்கள்’ என வேறுபாட்டைப் பேணுதல்
  alternative: இரண்டையும் ‘அவர்கள்’ எனப் பொதுமைப்படுத்துதல்
  rationale: எபிரெய மூலத்தில் வாசிக்கும் வினை ஒருமையிலும், பண்டிகையைக் கொண்டாடும் வினை பன்மையிலும் உள்ளன. கதைப் பாத்திரங்களின் வேறுபாட்டைச் சீராக்காமல் அப்படியே காக்கப்பட்டது.
- issue: עֲצֶרֶת என்ற வழிபாட்டுச் சொல்
  choice: சிறப்புப் பேரவை
  alternative: பேரவை; நிறைவுப் பேரவை; புனிதக் கூடுகை
  rationale: இது பண்டிகையின் எட்டாம் நாளுக்கான விதிக்கப்பட்ட தனிப்பட்ட கூடுகையைச் சுட்டுகிறது. ‘சிறப்புப் பேரவை’ அதன் மதச்சார்ந்த முக்கியத்துவத்தைத் தக்கவைத்தாலும், மூலத்தில் நேரடியாக இல்லாத குறிப்பிட்ட பிற்காலக் கோட்பாட்டைச் சேர்ப்பதில்லை.
- issue: எட்டாம் நாள் வாக்கியத்தில் வெளிப்படையான வினை இல்லாமை
  choice: இயல்பான தமிழுக்காக ‘நடைபெற்றது’ என்பதை நிரப்புதல்
  alternative: ‘எட்டாம் நாளில் ... ஒரு சிறப்புப் பேரவை’ என வினையற்ற வடிவம்
  rationale: எபிரெயத்தில் இப்பகுதி வினையற்றதாக உள்ளது; தமிழில் முழுமையான வாக்கியமாகப் புரிய ‘நடைபெற்றது’ சேர்க்கப்பட்டது. இது நிகழ்வின் தன்மையை மேலதிகமாக நிர்ணயிப்பதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையும் வேதாகம உரைக்கேற்ற கண்ணியமும் காக்கப்பட்டுள்ளன. ‘திருச்சட்டம்’, ‘பண்டிகை’, ‘பேரவை’ ஆகிய சொற்கள் பொதுவாசகர்களுக்குப் புரியும் வகையிலும், வழிபாட்டு மற்றும் சட்டச் சூழலை மிகைப்படுத்தாமல் உணர்த்தும் வகையிலும் தேர்ந்தெடுக்கப்பட்டன.
