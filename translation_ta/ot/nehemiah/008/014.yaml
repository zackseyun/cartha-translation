  text: וַֽ/יִּמְצְא֖וּ כָּת֣וּב בַּ/תּוֹרָ֑ה אֲשֶׁ֨ר צִוָּ֤ה יְהוָה֙ בְּ/יַד מֹשֶׁ֔ה אֲשֶׁר֩ יֵשְׁב֨וּ בְנֵֽי יִשְׂרָאֵ֧ל בַּ/סֻּכּ֛וֹת בֶּ/חָ֖ג בַּ/חֹ֥דֶשׁ הַ/שְּׁבִיעִֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/008/014.yaml
  text: And they found it written in the Law that Yahweh had commanded through Moses that the sons of Israel should dwell in booths during the feast[a], in the seventh month.
translation:
  language: ta
  text: யாவே மோசேயின் மூலம் கட்டளையிட்டிருந்தபடி, இஸ்ரவேல் மக்கள்[a] ஏழாம் மாதப் பண்டிகையின்போது குடில்களில் தங்கியிருக்க வேண்டும் என்று திருச்சட்டத்தில் எழுதப்பட்டிருப்பதை அவர்கள் கண்டார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'நேரடி எபிரேய வடிவம்: ‘இஸ்ரவேலின் மகன்கள்’; இதை ‘இஸ்ரவேலர்’ அல்லது ‘இஸ்ரவேலின் பிள்ளைகள்’ என்றும் மொழிபெயர்க்கலாம்.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּמְצְאוּ כָּתוּב
  choice: எழுதப்பட்டிருப்பதை அவர்கள் கண்டார்கள்
  rationale: מצא என்பதன் இறந்தகால நிகழ்வையும், כָּתוּב என்ற செயப்பாட்டு நிலை வினையெச்சத்தையும் இயல்பான தமிழில் இணைத்துக் காட்டுகிறது.
- source_word: בַּתּוֹרָה
  choice: திருச்சட்டத்தில்
  rationale: இங்கு תּוֹרָה என்பது மோசே வழியாகக் கொடுக்கப்பட்ட எழுத்துப்பூர்வமான இறைச்சட்டத்தைக் குறிக்கிறது; ‘திருச்சட்டம்’ நவீன தமிழில் தெளிவாகவும் மரியாதைக்குரிய நடையிலும் உள்ளது.
- source_word: צִוָּה יְהוָה בְּיַד מֹשֶׁה
  choice: யாவே மோசேயின் மூலம் கட்டளையிட்டிருந்தபடி
  rationale: בְּיַד என்ற எபிரேய மரபுத்தொடர் மோசேயின் இடைமுகச் செயல்பாட்டைக் குறிக்கிறது; ‘மூலம்’ அதை இயல்பாக வெளிப்படுத்துகிறது. கட்டளை முன்பே கொடுக்கப்பட்டதால் ‘கட்டளையிட்டிருந்த’ பொருத்தமானது.
- source_word: יֵשְׁבוּ
  choice: தங்கியிருக்க வேண்டும்
  rationale: பண்டிகைக் காலத்தில் தற்காலிகக் குடில்களில் வசிப்பதைக் குறிக்கும் இச்சூழலில், ‘தங்கியிருக்க’ என்பது ‘உட்கார’ என்பதைக் காட்டிலும் துல்லியமும் இயல்பும் உடையது.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்கள்[a]
  rationale: சொல்லுக்கு சொல் பொருள் ‘இஸ்ரவேலின் மகன்கள்’ என்றாலும், இங்கு முழு உடன்படிக்கை மக்களையும் கூட்டாகக் குறிக்கிறது. ‘இஸ்ரவேல் மக்கள்’ பாலினத்தைத் தவறாகக் குறுக்காமல் இயல்பான தமிழில் அந்தக் கூட்டுப்பொருளைத் தருகிறது; நேரடி வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: בַּסֻּכּוֹת
  choice: குடில்களில்
  rationale: סֻכּוֹת என்பது பண்டிகைக்காக அமைக்கப்படும் தற்காலிகத் தழைக் குடில்களைக் குறிக்கிறது. ‘குடில்கள்’ என்பது கூடாரத் துணியால் செய்யப்பட்ட tents என்ற தவறான எண்ணத்தைத் தவிர்க்கிறது.
- source_word: בֶּחָג בַּחֹדֶשׁ הַשְּׁבִיעִי
  choice: ஏழாம் மாதப் பண்டிகையின்போது
  rationale: அறியப்பட்ட பண்டிகை ஏழாம் மாதத்தில் நடைபெறுவதைச் சுருக்கமாகவும் தெளிவாகவும் கூறி, இரு காலக் குறிப்புகளையும் பாதுகாக்கிறது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: எபிரேய மூலத்தில் உடன்படிக்கைப் பெயரான יהוה நேரடியாக உள்ளது. அதை பொதுப் பட்டப்பெயராக மாற்றாமல், தமிழில் பரவலாக அறியப்படும் ஒலிபெயர்ப்பான ‘யாவே’ என்று வழங்குகிறது.
- issue: בְנֵי יִשְׂרָאֵל என்பதன் கூட்டுப்பொருள்
  choice: இஸ்ரவேல் மக்கள்
  alternative: இஸ்ரவேலின் மகன்கள்
  rationale: இக்கட்டளை உடன்படிக்கைச் சமூகத்தை கூட்டாக நோக்குகிறது. தமிழில் ‘மகன்கள்’ என்பது ஆண்களை மட்டும் குறிப்பதாக எளிதில் புரிந்துகொள்ளப்படலாம்; ஆகவே கூட்டுப்பொருளை முதன்மை உரையில் வைத்து, மூலத்தின் நேரடி வடிவத்தை அடிக்குறிப்பில் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் மரியாதையான நடை பயன்படுத்தப்பட்டுள்ளது. எபிரேய வாக்கியத்தின் ‘எழுதப்பட்டிருப்பதைக் கண்டார்கள்’ என்ற அமைப்பு பாதுகாக்கப்பட்டாலும், தமிழின் இயல்பான சொல் வரிசைக்கேற்ப கட்டளையின் உள்ளடக்கம் முன்னிறுத்தப்பட்டுள்ளது.
