  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் வேதாகம உரைக்கேற்ற கண்ணியமான நடையிலும் வடிவமைக்கப்பட்டது. ‘பிரபுக்கள்’, ‘சபை’ போன்ற நிலைபெற்ற சொற்கள் காக்கப்பட்டுள்ளன; எபிரெய மூலத்தின் சட்டவாத நுணுக்கமும் சகோதர உறவுமொழியும் அழிக்கப்படவில்லை.
