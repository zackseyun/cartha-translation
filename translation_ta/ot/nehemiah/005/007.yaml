base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/005/007.yaml
  text: Then I took counsel with myself[a], and I brought charges against the nobles and the officials, and I said to them, “You are exacting interest[c][b], each from his brother.” And I assembled a great assembly against them.
translation:
  language: ta
  text: பின்பு நான் எனக்குள் ஆலோசித்தேன்[a]. நான் பிரபுக்கள்மீதும் அதிகாரிகள்மீதும் குற்றம் சாட்டினேன்; அவர்களிடம், “உங்களில் ஒவ்வொருவரும் தம் சகோதரரிடமிருந்து வட்டி வசூலிக்கிறீர்கள்[b]” என்றேன். பின்னர் அவர்களுக்கு எதிராக ஒரு பெரிய சபையைக் கூட்டினேன்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயச் சொற்றொடர், நெகேமியா தமக்குள் நிதானமாக ஆலோசித்தார் அல்லது சிந்தித்தார் என்பதைக் குறிக்கிறது.
    reason: idiom_clarification
  - marker: b
    text: “வட்டி” என்பதற்கு “கடன் சுமை” என்றும் பொருள் கொள்ளலாம். “சகோதரர்” என்பது சக இஸ்ரவேலரைக் குறிக்கும் உறவுமொழி.
    reason: lexical_alternative
  - marker: c
    text: சொல்லுக்குச் சொல், “அவர்களுக்கு எதிராக ஒரு பெரிய சபையை வைத்தேன்”; அதாவது, அவர்களைப் பொதுவாக எதிர்கொள்ள ஒரு பெரிய கூட்டத்தைக் கூட்டினேன்.
    reason: idiom_clarification
lexical_decisions:
- source_word: וַיִּמָּלֵךְ לִבִּי עָלַי
  choice: நான் எனக்குள் ஆலோசித்தேன்
  rationale: இந்த எபிரெயச் சொற்றொடர் கோபத்தை அல்ல, உள்ளார்ந்த ஆலோசனையையும் நிதானமான சிந்தனையையும் குறிக்கிறது. இயல்பான நவீனத் தமிழில் அதன் தற்சார்புப் பொருளை இவ்வாறு தெரிவிக்கலாம்.
- source_word: וָאָרִיבָה
  choice: குற்றம் சாட்டி
  rationale: ריב என்பது பொதுவாக எதிர்த்துப் பேசுவதையும் வழக்குரைப்பதையும் குறிக்கலாம்; இங்கு தலைவர்களைப் பொதுவாகப் பொறுப்புக்குட்படுத்தும் அரைச் சட்டமுறைச் சூழலில் ‘குற்றம் சாட்டி’ பொருத்தமானது.
- source_word: הַחֹרִים
  choice: பிரபுக்கள்
  rationale: யூதாவின் சமூக உயர்நிலையினரைக் குறிக்கும் சொல்லுக்கு dignified, established Tamil equivalent.
- source_word: הַסְּגָנִים
  choice: அதிகாரிகள்
  rationale: துணை நிர்வாகிகள் அல்லது ஆட்சிப் பொறுப்பாளர்களைக் குறிக்கும் சொல்லை தேவையின்றி குறிப்பிட்ட பதவியாக மாற்றாமல் பொதுவாகத் தருகிறது.
- source_word: מַשָּׁא ... נשאים
  choice: வட்டி வசூலிக்கிறீர்கள்
  rationale: கடன் கொடுப்பதில் விதிக்கப்படும் பொருளாதாரச் சுமையை இச்சூழலில் ‘வட்டி’ எனப் புரிந்துகொள்வது இயல்பு; participle-ன் தொடர்ச்சியான வசூலிப்பு/சுமத்துதல் நுணுக்கத்தையும் இது காட்டுகிறது.
- source_word: אִישׁ בְּאָחִיו
  choice: ஒவ்வொருவரும் உங்கள் சகோதரரிடமிருந்து
  rationale: אישׁ என்பதன் பகிர்முறைப் பொருளையும், உடன்படிக்கைச் சமூகத்தைச் சேர்ந்த சக இஸ்ரவேலரை ‘சகோதரர்’ எனக் குறிப்பிடும் உறவுமொழியையும் காக்கிறது.
- source_word: וָאֶתֵּן עֲלֵיהֶם קְהִלָּה גְדוֹלָה
  choice: அவர்களுக்கு எதிராக ஒரு பெரிய சபையைக் கூட்டினேன்
  rationale: נתן என்பதன் சொற்பொருள் ‘வைத்தேன்/கொடுத்தேன்’ என்றாலும், இங்கு பெரிய பொதுக்கூட்டத்தைக் கூட்டியதைக் குறிக்கும் சொல்வழக்கு; עֲלֵיהֶם என்பதன் எதிர்ப்புப் பொருளும் காக்கப்படுகிறது.
