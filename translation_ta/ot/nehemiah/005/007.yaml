  to: பின்பு நான் எனக்குள் ஆலோசித்தேன்[a]. நான் பிரபுக்கள்மீதும் அதிகாரிகள்மீதும் குற்றம் சாட்டினேன்; அவர்களிடம், “உங்களில் ஒவ்வொருவரும் தம் சகோதரரிடமிருந்து வட்டி வசூலிக்கிறீர்கள்[b]” என்றேன். பின்னர் அவர்களுக்கு எதிராக ஒரு பெரிய சபையைக் கூட்டினேன்[c].
  rationale: சிறு இலக்கண மற்றும் நடைத்திருத்தங்கள் மட்டுமே செய்யப்பட்டுள்ளன. அவை பன்மை முகவரியையும் ஒவ்வொருவரைக் குறிக்கும் பகிர்முறைச் சொல்லையும் இயல்பாக இணைக்கின்றன; மூலத்தில் உள்ள தொடர்ச்சியான செயல்களை முற்றுவினைகளாகத் தருகின்றன; அடிக்குறிப்புகளின் நபர் ஒத்திசைவு மற்றும் இடிய விளக்கத்தைச் சரிசெய்கின்றன. பொருள் அல்லது இறையியல் விளக்கம் மாற்றப்படவில்லை.
