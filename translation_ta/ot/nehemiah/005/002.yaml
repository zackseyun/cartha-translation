  to: மேலும், சிலர், “நாங்களும் எங்கள் மகன்களும் மகள்களும் பலர்.[a] நாங்கள் உண்பதற்கும் உயிர்வாழ்வதற்கும் தானியத்தைப் பெறுவோம்” என்று சொன்னார்கள்.
