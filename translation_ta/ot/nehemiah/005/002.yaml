source:
  edition: WLC
  text: וְ/יֵשׁ֙ אֲשֶׁ֣ר אֹמְרִ֔ים בָּנֵ֥י/נוּ וּ/בְנֹתֵ֖י/נוּ אֲנַ֣חְנוּ רַבִּ֑ים וְ/נִקְחָ֥ה דָגָ֖ן וְ/נֹאכְלָ֥ה וְ/נִחְיֶֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/005/002.yaml
  text: And there were those who said[a], “We have many sons and daughters. Let us get grain, so that we may eat and live.”
translation:
  language: ta
  text: மேலும், சிலர், “நாங்களும் எங்கள் மகன்களும் மகள்களும் பலர்.[a] நாங்கள் உண்பதற்கும் உயிர்வாழ்வதற்கும் தானியத்தைப் பெறுவோம்” என்று சொன்னார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரேயத்தில், “எங்கள் மகன்களும் எங்கள் மகள்களும், நாங்கள் பலர்” எனக் குடும்ப உறுப்பினர்களும் “நாங்கள்” என்பதும் ஒன்றன்பின் ஒன்றாகக் கூறப்படுகின்றன. இயல்பாக, “எங்களுக்கு மகன்களும் மகள்களும் பலர்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֵשׁ אֲשֶׁר אֹמְרִים
  choice: மேலும், சிலர் ... என்றார்கள்
  rationale: இது முறையிடும் மக்களுக்குள் ஒரு குறிப்பிட்ட பிரிவினரை அறிமுகப்படுத்தும் எபிரேய இருப்புநிலைச் சொற்றொடர். இயல்பான நவீன தமிழில் ‘சிலர்’ அந்தப் பொருளைத் தெளிவாகக் காட்டுகிறது.
- source_word: בָּנֵינוּ וּבְנֹתֵינוּ אֲנַחְנוּ רַבִּים
  choice: எங்கள் மகன்களும் மகள்களும்—நாங்கள் ஏராளமானவர்கள்
  rationale: சொற்றொடரின் இறுக்கமான, இணைப்புமுறை அமைப்பையும் வெளிப்படையாக உள்ள אֲנַחְנוּ (‘நாங்கள்’) என்பதையும் தக்கவைக்கிறது. கோடு குடும்ப உறுப்பினர்களையும் ‘நாங்கள்’ என்பதையும் இணைக்கும் எபிரேய அமைப்பின் இயல்பான தெளிவின்மையைச் சுட்டுகிறது.
- source_word: וְנִקְחָה
  choice: பெற்றுக்கொள்வோம்
  rationale: முதல் நபர் பன்மை cohortative வடிவம் நோக்கம் அல்லது வலியுறுத்திய முனைப்பை வெளிப்படுத்துகிறது. இச்சூழலில் ‘எடுத்துக்கொள்வோம்’ என்பதைவிட உணவைப் பெறுதல் என்ற பொருளில் ‘பெற்றுக்கொள்வோம்’ இயல்பாக உள்ளது.
- source_word: דָגָן
  choice: தானியம்
  rationale: இச்சொல் பொதுவான உணவை அல்ல, தானிய விளைபொருளைக் குறிப்பதால் ‘தானியம்’ துல்லியமான நவீனத் தமிழ் இணைச்சொல்.
- source_word: וְנֹאכְלָה וְנִחְיֶה
  choice: நாங்கள் உண்பதற்கும் உயிர்வாழ்வதற்கும்
  rationale: தானியம் பெறுவதன் நோக்கத்தைத் தமிழில் இயல்பாக வெளிப்படுத்தி, ‘உண்ணுதல்’ மற்றும் ‘வாழ்தல்’ ஆகிய இரு வினைகளையும் தனித்தனியாகத் தக்கவைக்கிறது. நெருக்கடியான சூழலில் ‘உயிர்வாழ்வது’ பொருளைத் தெளிவாக்குகிறது.
