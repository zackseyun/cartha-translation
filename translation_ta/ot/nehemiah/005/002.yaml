translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் சுருக்கமான குடும்பப் பட்டியல் அமைப்பு முற்றிலும் வழுவழுப்பாக்கப்படாமல் கோட்டின் மூலம் பாதுகாக்கப்பட்டுள்ளது.
