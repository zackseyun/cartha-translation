  text: וְ/גַם אֲנִי֙ אַחַ֣/י וּ/נְעָרַ֔/י נֹשִׁ֥ים בָּ/הֶ֖ם כֶּ֣סֶף וְ/דָגָ֑ן נַֽעַזְבָה נָּ֖א אֶת הַ/מַּשָּׁ֥א הַ/זֶּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/005/010.yaml
  text: And I also[a], my brothers and my young men, are lending them money and grain. Please[c][b], let us stop this burden.
translation:
  language: ta
  text: நானும், என் சகோதரர்களும், என் பணியாளர்களும்[a] அவர்களுக்குப் பணமும் தானியமும் கடன் கொடுத்துவருகிறோம்[b]. தயவுசெய்து, இந்தச் சுமையை[c] நாம் விட்டுவிடுவோம்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘என் இளைஞர்கள்’ அல்லது ‘என் உதவியாளர்கள்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘அவர்களிடமிருந்து கடனை வசூலித்துக்கொண்டிருக்கிறோம்’ என்றும் பொருள்கொள்ளலாம்; எபிரெய வினை கடன் கொடுப்பதை மட்டுமல்ல, கடன்காரராக உரிமை கோருவதையும் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: ‘இந்த வசூலை’ அல்லது ‘இந்தக் கடனை’ என்றும் மொழிபெயர்க்கலாம்; எபிரெயச் சொல் நேரடியாக ‘இந்தச் சுமை’ என்று பொருள்படும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם אֲנִי
  choice: நானும்
  rationale: וְגַם என்பதன் சேர்க்கை மற்றும் வலியுறுத்தல் நிழலை இயல்பான தமிழில் ‘நானும்’ வெளிப்படுத்துகிறது.
- source_word: אַחַי
  choice: என் சகோதரர்கள்
  rationale: மூலத்தின் குடும்ப மற்றும் சமூக ஒற்றுமைச் சொல்லை நேரடியாகப் பாதுகாக்கிறது; சூழலில் உறவினர்கள் அல்லது உடனிருந்தவர்களையும் குறிக்கக்கூடும்.
- source_word: וּנְעָרַי
  choice: என் பணியாளர்கள்
  rationale: נַעַר என்பது இளைஞன் என்றும் பணியாளர் அல்லது உதவியாளர் என்றும் பொருள்படும்; நெகேமியாவின் பரிவாரத்தைக் குறிக்கும் இச்சூழலில் ‘பணியாளர்கள்’ இயல்பாக உள்ளது, மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: נֹשִׁים בָּהֶם
  choice: அவர்களுக்குக் கடனாகக் கொடுத்திருக்கிறோம்
  rationale: இவ்வினை கடன் கொடுப்பது அல்லது கடன்காரராக உரிமை கோருவது என்ற நிழலைக் கொண்டது. தமிழ் வாக்கியத்தில் கடன் உறவைத் தெளிவாக்கி, கடுமையான மாற்றுப் பொருளை அடிக்குறிப்பில் பாதுகாக்கிறது.
- source_word: כֶּסֶף וְדָגָן
  choice: பணமும் தானியமும்
  rationale: כֶּסֶף என்பதற்கு ‘வெள்ளி’ என்ற நேரடிப் பொருள் இருந்தாலும், கடன் சூழலில் ‘பணம்’ நவீன வாசகருக்குப் பொருளைத் தெளிவாக அளிக்கிறது.
- source_word: נַעַזְבָה נָּא
  choice: தயவுசெய்து, ... நாம் விட்டுவிடுவோம்
  rationale: கோரிக்கைத் துகள் נָא உடன் வரும் cohortative வடிவத்தின் பணிவான, அனைவரையும் உள்ளடக்கும் அறிவுறுத்தலைப் பாதுகாக்கிறது.
- source_word: הַמַּשָּׁא הַזֶּה
  choice: இந்தச் சுமை
  rationale: מַשָּׁא என்பதன் அடிப்படை உருவகமான ‘சுமை’யைப் பாதுகாக்கிறது; சூழலில் அது கடன் வசூல் அல்லது கடன் பாரத்தைக் குறிக்கலாம்.
theological_decisions:
- issue: நெகேமியா தாமும் தவறான வட்டி வசூலில் ஈடுபட்டதாக ஒப்புக்கொள்கிறாரா?
  choice: கடன் கொடுத்ததை மட்டும் முதன்மை உரையில் கூறி, வசூல் நிழலை அடிக்குறிப்பில் வைக்கிறது.
  alternative: ‘அவர்களிடமிருந்து கடனை வசூலித்துக்கொண்டிருக்கிறோம்’ என்று வெளிப்படையாக மொழிபெயர்த்தல்.
  rationale: נֹשִׁים மற்றும் מַשָּׁא ஆகியவற்றில் எதிர்மறையான கடன்காரர் நிழல் இருக்கலாம்; ஆனால் வட்டி வசூலை இவ்வசனம் தனியாகத் தெளிவாகச் சொல்லவில்லை. ஆகவே மூலத்தின் தெளிவின்மையைத் தீர்த்துவிடாமல் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகருக்குப் புரியும் கண்ணியமான நடை. ‘சுமை’ என்ற மூல உருவகம் காக்கப்பட்டு, நிதிசார் மாற்றுப் பொருள்கள் அடிக்குறிப்புகளில் தரப்பட்டுள்ளன. வாக்கியத்தின் கூட்டு எழுவாயை இயல்பான பன்மை வினையுடன் அமைத்துள்ளது.
