- source_word: צִוָּה אֹתִי לִהְיוֹת פֶּחָם
  choice: அவர் என்னை ஆளுநராக நியமித்த
  rationale: צוה என்பதன் அடிப்படைப் பொருள் ‘கட்டளையிடுதல்’ என்றாலும், ஓர் அலுவல் பதவியில் இருக்கச் செய்த இந்த நிர்வாகச் சூழலில் ‘நியமித்த’ என்பது பொருத்தமானது. פֶּחָם வடிவிலுள்ள இறுதிப் பகுதி சிக்கலானது; தெளிவற்ற உரிமைச் சுட்டைச் சேர்க்காமல் பதவிப் பெயர் மட்டும் தரப்படுகிறது.
- source_word: בְּאֶרֶץ יְהוּדָה
  choice: யூதா நாட்டில்
  rationale: எபிரெய உரையின் புவியியல் சொல்லாட்சியை இயல்பான நவீன தமிழில் காக்கிறது; ‘மாகாணம்’ என்பது சூழலுக்கு ஏற்றதாக இருந்தாலும் விளக்கச் சேர்க்கையாகும்.
- source_word: מִשְּׁנַת עֶשְׂרִים וְעַד שְׁנַת שְׁלֹשִׁים וּשְׁתַּיִם לְאַרְתַּחְשַׁסְתְּא הַמֶּלֶךְ
  choice: அர்தசஷ்டா அரசனின் இருபதாம் ஆண்டிலிருந்து முப்பத்திரண்டாம் ஆண்டுவரை
  rationale: அரசாட்சியாண்டுகளைக் கொண்டு தேதியிடும் மூலத்தின் துல்லியத்தைத் தெளிவான தமிழ் தொடரில் காக்கிறது.
- source_word: שָׁנִים שְׁתֵּים עֶשְׂרֵה
  choice: பன்னிரண்டு ஆண்டுகள்
  rationale: முன்னுள்ள ஆண்டுக் கணக்கைத் தொகுத்துச் சொல்லும் இணைப்புரை என்பதால் கோடுகளுக்குள் வைக்கப்பட்டுள்ளது.
- source_word: אֲנִי וְאַחַי
  choice: நானும் என் சகோதரர்களும்
  rationale: אַחַי என்பதன் நேரடியான ஆண்பால் பன்மைப் பொருளைக் காக்கிறது; ‘உடனிருந்தவர்கள்’ போன்ற பரந்த விளக்கத்தை உரைக்குள் புகுத்தவில்லை.
- source_word: לֶחֶם הַפֶּחָה לֹא אָכַלְתִּי
  choice: ஆளுநருக்குரிய உணவுப்படியைப் பெற்றுக்கொள்ளவில்லை
  rationale: לֶחֶם என்பதன் சொற்பொருள் ‘அப்பம்/உணவு’; இங்கு அது ஆளுநருக்கு உரிய வழக்கமான உணவு அல்லது பராமரிப்புப் படியைக் குறிக்கிறது. தமிழில் ‘உணவுப்படியைப் பெற்றுக்கொள்ளவில்லை’ என்பது நிர்வாகப் பொருளைத் தெளிவாக்குகிறது; சொற்சொற் மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: אַחַי என்பதன் சமூக வரம்பு
  choice: என் சகோதரர்களும்
  alternative: என் உறவினர்களும் / என்னுடன் இருந்தவர்களும்
  rationale: மூலம் நேரடியாக ‘என் சகோதரர்கள்’ என்கிறது. அது உறவினர் அல்லது நெருங்கிய உடன் பணியாளர்களையும் உள்ளடக்கக்கூடியதாக இருந்தாலும், பரந்த பொருளைத் தீர்மானித்து உரையில் பதிக்காமல் மூலத்தின் வடிவம் காக்கப்படுகிறது.
- issue: לֶחֶם הַפֶּחָה என்பதைச் சொற்படியாகவா நிர்வாகப் பொருளிலா மொழிபெயர்ப்பது
  choice: ஆளுநருக்குரிய உணவுப்படி
  alternative: ஆளுநரின் அப்பம் / ஆளுநருக்குரிய உணவு
  rationale: சுற்றியுள்ள பொருளாதாரச் சூழலில் இச்சொற்றொடர் ஆளுநர் மக்களிடமிருந்து பெறும் வழக்கமான உணவு அல்லது பராமரிப்பு ஒதுக்கீட்டைக் குறிக்கிறது. ‘உணவுப்படி’ அந்தப் பொருளை இயல்பான தமிழில் தெரிவிக்கிறது; சொற்படியான வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: לֹא אָכַלְתִּי என்பதிலுள்ள ‘உண்ணுதல்’ உருவகத்தைத் தமிழில் எவ்வாறு வழங்குவது
  choice: பெற்றுக்கொள்ளவில்லை
  alternative: உண்ணவில்லை
  rationale: தமிழில் ‘உணவுப்படியை உண்ணவில்லை’ என்பது இயல்பற்றதாகவும் வெறும் உணவு உட்கொள்ளுதலை மட்டும் குறிக்கக்கூடியதாகவும் உள்ளது. நிர்வாகப் படியைத் தமக்காக ஏற்றுக்கொள்ளவில்லை என்பதே சூழலின் நோக்கம்; ஆகவே செயற்பொருள் தெளிவாக வழங்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையும் வாசிப்பின் இயல்பும் காக்கப்பட்டுள்ளன. ‘அர்தசஷ்டா’ என்ற பரவலாக அறியப்பட்ட தமிழ் வடிவம் பயன்படுத்தப்பட்டுள்ளது. காலக்கணக்கின் இணைப்புரை நீள்கோடுகளால் தெளிவுபடுத்தப்பட்டுள்ளது; ஒரே அடிக்குறி [a] முதன்மை உரையில் சரியாக இடப்பட்டுள்ளது.
