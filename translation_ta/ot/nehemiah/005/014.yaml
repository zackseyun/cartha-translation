base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/005/014.yaml
  text: Also[a], from the day that he appointed me to be governor in the land of Judah, from the twentieth year until the thirty-second year of King Artaxerxes—twelve years—I and my brothers did not eat the governor’s food allowance.
translation:
  language: ta
  text: மேலும், அவர் என்னை யூதா நாட்டில் அவர்களுக்கு ஆளுநராக நியமித்த நாள்முதல், அர்த்தசஷ்டா அரசனின் இருபதாம் ஆண்டிலிருந்து முப்பத்திரண்டாம் ஆண்டுவரை—பன்னிரண்டு ஆண்டுகள்—நானும் என் சகோதரர்களும் ஆளுநருக்குரிய உணவுப்படியை[a] பெற்றுக்கொள்ளவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொற்படியாக, “ஆளுநரின் அப்பத்தை.” இது ஆளுநர் வழக்கமாகப் பெற்ற உணவு அல்லது பராமரிப்புப் படியைக் குறிக்கிறது.
    reason: lexical_alternative
