  to: இப்போதோ, எங்கள் சகோதரர்களின் சதையைப் போன்றதே எங்கள் சதையும்; அவர்களுடைய பிள்ளைகளைப் போன்றவர்களே எங்கள் பிள்ளைகளும்.[a] ஆனாலும் இதோ, நாங்கள் எங்கள் மகன்களையும் மகள்களையும் அடிமைத்தனத்துக்குள் தள்ளுகிறோம்; எங்கள் மகள்களில் சிலர் ஏற்கெனவே அடிமைப்படுத்தப்பட்டுவிட்டார்கள். எங்களால் எதுவும் செய்ய முடியவில்லை[b]; எங்கள் வயல்களும் திராட்சைத்தோட்டங்களும் மற்றவர்களுக்குச் சொந்தமாகிவிட்டன.
  rationale: The revision removes the added specification “to stop it” from both the text and note, preserving the Hebrew expression of general powerlessness. It also streamlines the ongoing action as “தள்ளுகிறோம்,” while retaining the source’s coercive slavery language and all meaningful kinship and property terminology.
