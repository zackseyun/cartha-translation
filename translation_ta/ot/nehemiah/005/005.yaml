base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/005/005.yaml
  text: And now[a], our flesh is like the flesh of our brothers, our children like their children; yet here we are, forcing our sons and our daughters into slavery, and some of our daughters have already been enslaved. But it is not in our power to help[b], and our fields and our vineyards belong to others.
translation:
  language: ta
  text: இப்போதோ, எங்கள் சகோதரர்களின் சதையைப் போன்றதே எங்கள் சதையும்; அவர்களுடைய பிள்ளைகளைப் போன்றவர்களே எங்கள் பிள்ளைகளும்.[a] ஆனாலும் இதோ, நாங்கள் எங்கள் மகன்களையும் மகள்களையும் அடிமைத்தனத்துக்குள் தள்ளுகிறோம்; எங்கள் மகள்களில் சிலர் ஏற்கெனவே அடிமைப்படுத்தப்பட்டுவிட்டார்கள். எங்களால் எதுவும் செய்ய முடியவில்லை[b]; எங்கள் வயல்களும் திராட்சைத்தோட்டங்களும் மற்றவர்களுக்குச் சொந்தமாகிவிட்டன.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நாங்களும் எங்கள் சகோதரர்களும் ஒரே சதையைச் சேர்ந்தவர்கள்; எங்கள் பிள்ளைகளும் அவர்களுடைய பிள்ளைகளுக்கு இணையானவர்கள்.” பொதுவான மனிதத்தன்மையையும் உறவுப்பிணைப்பையும் வலியுறுத்த எபிரெயம் ‘சதை’ என்ற நேரடியான உருவகத்தைத் தக்கவைக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: சொல்லுக்குச் சொல், “எங்கள் கையில் வல்லமை இல்லை.” குறிப்பாக வயல்களும் திராட்சைத்தோட்டங்களும் பிறர் வசமாகிவிட்டதால், அவர்களிடம் ஆற்றலோ வழிவகையோ இல்லை என்பதே இதன் பொருள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִבְשַׂר אַחֵינוּ בְּשָׂרֵנוּ
  choice: எங்கள் சகோதரர்களின் சதையைப் போன்றதே எங்கள் சதையும்
  rationale: בָּשָׂר என்பதன் அடிப்படைப் பொருளான ‘சதை’ என்பதைத் தக்கவைத்து, ஒரே மனிதத்தன்மையையும் உறவுப்பிணைப்பையும் வலியுறுத்தும் எபிரெய உருவகத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: אַחֵינוּ
  choice: எங்கள் சகோதரர்கள்
  rationale: ஆண்பால் உறவுமுறைச் சொல்லை அதன் நேரடிப் பொருளோடு தக்கவைக்கிறது; சூழலில் இது உடன்பிறந்தவர்களை மட்டும் அல்லாமல் ஒரே சமூகத்தைச் சேர்ந்தவர்களையும் குறிக்கிறது.
- source_word: כִבְנֵיהֶם בָּנֵינוּ
  choice: அவர்களுடைய பிள்ளைகளைப் போன்றவர்களே எங்கள் பிள்ளைகளும்
  rationale: בָּנִים என்பது மகன்களைக் குறிப்பாகவோ, பிள்ளைகளைத் தொகுப்பாகவோ குறிக்கலாம். அடுத்த பகுதியில் மகன்களும் மகள்களும் தனித்தனியாகச் சொல்லப்படுவதால் இங்கு ‘பிள்ளைகள்’ பொருத்தமானது.
- source_word: כֹבְשִׁים ... לַעֲבָדִים
  choice: அடிமைத்தனத்துக்குள் தள்ளிக்கொண்டிருக்கிறோம்
  rationale: כבשׁ என்பதிலுள்ள கட்டாயப்படுத்தி அடக்குதல் என்ற வலிமையையும், לַעֲבָדִים காட்டும் அடிமை நிலையையும் மென்மைப்படுத்தாமல் தெரிவிக்கிறது.
- source_word: מִבְּנֹתֵינוּ נִכְבָּשׁוֹת
  choice: எங்கள் மகள்களில் சிலர் ஏற்கெனவே அடிமைப்படுத்தப்பட்டுவிட்டார்கள்
  rationale: நிபால் வினையெச்சம் காட்டும் செயல்படுத்தப்பட்ட நிலையையும், அந்த நிலை ஏற்கெனவே ஏற்பட்டுவிட்டது என்ற புலம்பலையும் வெளிப்படுத்துகிறது.
- source_word: וְאֵין לְאֵל יָדֵנוּ
  choice: அதைத் தடுக்க எங்களுக்கு வல்லமை இல்லை
  rationale: ‘எங்கள் கைக்கு வல்லமை இல்லை’ என்ற எபிரெய மரபுத்தொடரைத் தெளிவான தமிழில் தருகிறது; இங்கு אֵל என்பது இறைப்பெயராக அல்ல, வல்லமை அல்லது ஆற்றல் என்ற பொருளில் கொள்ளப்படுகிறது.
- source_word: וּשְׂדֹתֵינוּ וּכְרָמֵינוּ לַאֲחֵרִים
  choice: எங்கள் வயல்களும் திராட்சைத்தோட்டங்களும் மற்றவர்களுக்குச் சொந்தமாகிவிட்டன
  rationale: வினைச்சொல் இல்லாத எபிரெய உடைமை வாக்கியத்தை இயல்பான தமிழாக்குகிறது; அவர்களுடைய உற்பத்தி நிலங்கள் பிறர் வசமாகிவிட்ட நிலையையும் காட்டுகிறது.
theological_decisions:
- issue: சமூக அநீதியைப் பற்றிய முறையீட்டில் வரும் உறவுமுறை மொழி
  choice: אַחֵינוּ என்பதற்கு ‘சகோதரர்கள்’ என்றும், முதல் ஒப்பீட்டிலுள்ள בָּנִים என்பதற்கு ‘பிள்ளைகள்’ என்றும் மொழிபெயர்த்தல்
  alternative: எங்கும் பாலினப் பொதுமைப்படுத்தப்பட்ட ‘உறவினர்’/‘பிள்ளைகள்’ என்பதையோ, எங்கும் முற்றிலும் சொற்சார்ந்த ‘சகோதரர்கள்’/‘மகன்கள்’ என்பதையோ பயன்படுத்துதல்
  rationale: எபிரெயின் ஆண்பால் உறவுமுறைச் சொல்லைத் தக்கவைக்கும் அதேவேளையில், தொகுப்புப் பொருளுடைய בָּנִים என்பதை ‘பிள்ளைகள்’ எனத் தருகிறது; பின்னர் மூலத்தில் மகன்களும் மகள்களும் தெளிவாக வேறுபடுத்தப்படுகின்றனர்.
- issue: அடிமைத்தன மொழியின் வலிமை
  choice: ‘வேலைக்காரத்தனம்’ போன்ற மென்மையான சொல்லுக்கு பதிலாக ‘அடிமைத்தனம்/அடிமைப்படுத்தப்பட்டார்கள்’ என்று மொழிபெயர்த்தல்
  alternative: ‘ஊழியம்’, ‘கட்டுப்பட்ட வேலை’, அல்லது ‘பணிவிடை’
  rationale: இப்பகுதி கடன் காரணமாகப் பிள்ளைகள் அடிமை நிலைக்குத் தள்ளப்படுவதைச் சொல்கிறது. மூலத்தின் கடுமையான சமூக உண்மையை மென்மைப்படுத்தாமல் தருவது அவசியம்.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டுள்ளது. ‘சதை’ என்ற மூல உருவகமும் ‘அடிமைத்தனம்’ என்ற கடுமையான சமூகச் சொல்லும் திட்டமிட்டுத் தக்கவைக்கப்பட்டுள்ளன; தமிழில் இயல்பில்லாத எபிரெய மரபுத்தொடர்கள் மட்டும் தெளிவாக்கப்பட்டுள்ளன.
