base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/005/006.yaml
  text: I became very angry when I heard their outcry and these words[a].
translation:
  language: ta
  text: அவர்களுடைய கூக்குரலையும் இந்த வார்த்தைகளையும்[a] கேட்டபோது, நான் மிகவும் கோபமடைந்தேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘இந்த விஷயங்களையும்.’ எபிரெயச் சொல் பேசப்பட்ட வார்த்தைகளையோ, தெரிவிக்கப்பட்ட விஷயங்களையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּחַר לִי
  choice: நான் கோபமடைந்தேன்
  rationale: חרה + ל என்ற எபிரெய மரபுத்தொடர் ஒருவருக்குள் கோபம் மூள்வதைக் குறிக்கிறது. அதன் உணர்ச்சி வலிமையை இயல்பான நவீனத் தமிழில் இந்தத் தேர்வு வெளிப்படுத்துகிறது.
- source_word: מְאֹד
  choice: மிகவும்
  rationale: உணர்ச்சியின் தீவிரத்தை வலுப்படுத்தும் מְאֹד என்பதற்கு தெளிவான, இயல்பான தமிழ் இணைச்சொல்.
- source_word: כַּאֲשֶׁר
  choice: கேட்டபோது
  rationale: இங்கு நெகேமியாவின் கோபம் எழுந்த காலத்தையும் சூழலையும் அறிமுகப்படுத்துவதால், வினையுடன் இணைந்த ‘போது’ இயல்பாகத் தற்காலப் பொருளைத் தருகிறது.
- source_word: שָׁמַעְתִּי
  choice: கேட்டபோது
  rationale: שמע இச்சூழலில் மக்களின் முறையீட்டைக் கேட்டதைக் குறிக்கிறது; தமிழில் கால இணைப்புடன் இயல்பாக வழங்கப்பட்டுள்ளது.
- source_word: זַעֲקָתָם
  choice: அவர்களுடைய கூக்குரல்
  rationale: זעקה துன்பம் அல்லது அநீதியால் எழும் வலிமையான முறையீட்டுக் குரலைக் குறிக்கிறது. ‘கூக்குரல்’ அதன் உணர்ச்சி தீவிரத்தையும் பொதுவான எதிர்ப்பின் தன்மையையும் காக்கிறது.
- source_word: וְאֵת הַדְּבָרִים הָאֵלֶּה
  choice: இந்த வார்த்தைகளையும்
  rationale: דברים என்பதற்கு ‘வார்த்தைகள்’ அல்லது ‘விஷயங்கள்’ என்ற இரு பொருள்களும் சாத்தியம். முந்தைய வசனங்களில் மக்கள் கூறியவற்றைக் குறிப்பிடும் நேரடிப் பொருளாக ‘வார்த்தைகள்’ முதன்மை உரையில் வைக்கப்பட்டுள்ளது; மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
