base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/005/018.yaml
  text: What was prepared for each day was one ox and six choice sheep[a]; also birds were prepared for me, and every ten days an abundance of all kinds of wine. Yet even with this, I did not demand the governor’s food allowance[b], because the service was heavy on this people.
translation:
  language: ta
  text: ஒவ்வொரு நாளுக்கும் ஒரு எருதும், தேர்ந்தெடுக்கப்பட்ட ஆறு செம்மறியாடுகளும் தயார் செய்யப்பட்டன; பறவைகளும் எனக்காகத் தயார் செய்யப்பட்டன. பத்து நாட்களுக்கு ஒருமுறை எல்லா வகையான திராட்சரசமும் ஏராளமாக வழங்கப்பட்டது. இவை அனைத்தும் இருந்தபோதிலும், இந்த மக்கள்மீது வேலைப்பளு மிகுந்திருந்ததால், ஆளுநருக்குரிய உணவுப் பங்கை[a] நான் கோரவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லுக்குச் சொல், “ஆளுநரின் அப்பம்”; இது ஆளுநரின் பதவிக்குரிய உணவு அல்லது உணவு வழங்கீட்டைக் குறிக்கலாம்.
    reason: lexical_alternative
