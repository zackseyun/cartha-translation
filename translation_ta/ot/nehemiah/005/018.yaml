theological_decisions:
- issue: நெகேமியா ஆளுநருக்குரிய ஆதரவை ஏற்காததன் சமூகப் பொருளாதார நுட்பம்
  choice: மக்களின் வேலைச்சுமை மிகுந்ததால், பதவியோடு தொடர்புடைய உணவுப் பங்கை நெகேமியா கோரவில்லை
  alternative: ஆளுநரின் அப்பத்தை அவர் வெறுமனே கேட்கவில்லை; அல்லது பதவியுடன் தொடர்புடைய வரியை அவர் வசூலிக்கவில்லை
  rationale: எபிரெய உரை அதிகாரப்பூர்வ உணவு வழங்கீட்டையும் மக்கள்மீதுள்ள கனமான வேலையையும் இணைக்கிறது. மொழிபெயர்ப்பு அவர் உரிமையாகக் கோரக்கூடிய பங்கை விட்டுக்கொடுத்ததை உணர்த்துகிறது; ஆனால் உரையில் வெளிப்படையாக இல்லாத வரிவிதிப்பு முறையைச் சேர்ப்பதில்லை.
translation_notes:
  register: நவீன தரமான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான நடை. பட்டியல் அமைப்பும் அளவுகளும் தெளிவாக வைக்கப்பட்டுள்ளன; மூலத்தில் இல்லாத பறவைகளின் வகை குறிப்பிடப்படவில்லை. ‘வேலைப்பளு’ என்பது עֲבֹדָה என்பதிலுள்ள வேலை/உழைப்பு நுட்பத்தையும் כָבְדָה என்பதிலுள்ள கனத்த சுமையையும் இணைக்கிறது.
