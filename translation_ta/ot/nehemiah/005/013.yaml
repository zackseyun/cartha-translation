  revision_rationale: மூலத்தில் மீள்மீளும் נער (‘உதறு’) உருவகத்தைப் பேணியபடியே, வீட்டிலிருந்தும் உழைப்பின் பலனிலிருந்தும் சாபத்துக்குரியவனை வெளியேற்றும் பொருளைத் தமிழில் தெளிவுபடுத்தினேன். இது உடைமையிழப்பின் அடையாளச் செயலை வெளிப்படுத்துகிறது; அதே சமயம் יְגִיעוֹ என்பதன் ‘உழைப்பு’ என்ற மாற்றுவாய்ப்பு அடிக்குறிப்பில் காக்கப்பட்டுள்ளது. வேறு பொருள் அல்லது இறையியல் மாற்றம் செய்யப்படவில்லை.
