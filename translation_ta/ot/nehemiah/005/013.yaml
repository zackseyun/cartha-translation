    text: ‘என் மடி’ அல்லது ‘என் அங்கியின் முன்புற மடி’ என்றும் மொழிபெயர்க்கலாம். பொருட்களை வைத்துக்கொள்ளப் பயன்பட்ட ஆடையின் மடியை எபிரெயச் சொல் குறிக்கிறது; அதை உதறியது உடைமைகள் அனைத்தும் பறிக்கப்படுவதை அடையாளப்படுத்துகிறது.
    reason: lexical_alternative
  - marker: b
    text: ‘அவன் வீட்டிலிருந்தும் அவன் உழைப்பிலிருந்தும்’ என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் உழைப்பையோ, உழைப்பால் கிடைத்த பலனையோ குறிக்கக்கூடும்.
    reason: lexical_ambiguity
  - marker: c
    text: ‘இந்தச் சொல்லின்படியே’ அல்லது ‘இந்தக் காரியத்தின்படியே’ என்றும் மொழிபெயர்க்கலாம். இங்கு ‘வாக்குறுதி’ எனப்படுவது அவர்கள் ஏற்றுக்கொண்ட உறுதிமொழியைக் குறிக்கிறது.
