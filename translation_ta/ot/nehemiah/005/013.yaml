    issue: ‘அவனுடைய உழைப்பிலிருந்தும் உதறிப்போடுவாராக’ என்ற சொற்றொடர்
    rationale: ஒருவரை அவரது ‘உழைப்பிலிருந்து’ உதறிப்போடுவது தமிழில் பொருள்மயக்கத்தை உண்டாக்குகிறது. இங்கு எபிரெயச் சொல் உழைப்பின் விளைவு/சம்பாத்தியம் என்ற பொருளையும் கொள்ளும்; வீட்டிலிருந்தும் உழைப்பின் பலனிலிருந்தும் அவனை வெளியேற்றும் சாபச் சித்திரமாகத் தருவது இயல்பாகவும் துல்லியமாகவும் உள்ளது.
  revised_text: நானும் என் அங்கியின் மடியை உதறிவிட்டு[a], “இந்த வாக்குறுதியை நிறைவேற்றாத ஒவ்வொரு மனிதனையும் தேவன் இவ்வாறே அவன் வீட்டிலிருந்தும் அவன் உழைப்பின் பலனிலிருந்தும்[b] உதறி வெளியேற்றுவாராக; அவன் இவ்வாறே உதறப்பட்டு வெறுமையாக்கப்படுவானாக” என்றேன். அப்போது கூடியிருந்த அனைவரும், “ஆமென்” என்று சொல்லி, யாவேவைப் புகழ்ந்தார்கள். மக்கள் இந்த வாக்குறுதியின்படியே செய்தார்கள்.[c]
  revised_footnotes:
