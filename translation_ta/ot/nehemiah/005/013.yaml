base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/005/013.yaml
  text: I also shook out the fold of my garment and said[a], “So may God shake out every man who does not fulfill this promise, from his house and from his labor; so may he be shaken out and emptied.” And all the assembly said, “Amen,” and praised Yahweh[c][b]. And the people did according to this promise.
translation:
  language: ta
  text: நானும் என் அங்கியின் மடியை உதறிவிட்டு[a], “இந்த வாக்குறுதியை நிறைவேற்றாத ஒவ்வொரு மனிதனையும் தேவன் இவ்வாறே அவன் வீட்டிலிருந்தும் அவன் உழைப்பின் பலனிலிருந்தும்[b] உதறி வெளியேற்றுவாராக; அவன் இவ்வாறே உதறப்பட்டு வெறுமையாக்கப்படுவானாக” என்றேன். அப்போது கூடியிருந்த அனைவரும், “ஆமென்” என்று சொல்லி, யாவேவைப் புகழ்ந்தார்கள். மக்கள் இந்த வாக்குறுதியின்படியே செய்தார்கள்.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘என் மடி’ அல்லது ‘என் அங்கியின் முன்புற மடி’ என்றும் மொழிபெயர்க்கலாம். பொருட்களை வைத்துக்கொள்ளப் பயன்பட்ட ஆடையின் மடியை எபிரெயச் சொல் குறிக்கிறது; அதை உதறியது உடைமைகள் அனைத்தும் பறிக்கப்படுவதை அடையாளப்படுத்துகிறது.
    reason: lexical_alternative
  - marker: b
    text: ‘அவன் வீட்டிலிருந்தும் அவன் உழைப்பிலிருந்தும்’ என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் உழைப்பையோ, உழைப்பால் கிடைத்த பலனையோ குறிக்கக்கூடும்.
    reason: lexical_ambiguity
  - marker: c
    text: ‘இந்தச் சொல்லின்படியே’ அல்லது ‘இந்தக் காரியத்தின்படியே’ என்றும் மொழிபெயர்க்கலாம். இங்கு ‘வாக்குறுதி’ எனப்படுவது அவர்கள் ஏற்றுக்கொண்ட உறுதிமொழியைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: חָצְנִי
  choice: என் அங்கியின் மடி
  rationale: חָצֶן என்பது பொருட்களை வைத்துக்கொள்ளக்கூடிய ஆடையின் முன்புற மடியைக் குறிக்கிறது. ‘அங்கியின் மடி’ என்பது அடையாளச் செயலைத் தெளிவாகவும் இயல்பான தமிழிலும் காட்டுகிறது.
- source_word: נָעַרְתִּי / יְנַעֵר / נָעוּר
  choice: உதறிவிட்டு / உதறிப்போடுவாராக / உதறப்பட்டு
  rationale: ஒரே எபிரெய வேர்ச்சொல் மூன்று முறை வருவதால், நெகேமியாவின் அடையாளச் செயலுக்கும் சாப அறிவிப்புக்கும் இடையிலான சொல்லோவியத்தை ‘உதறு’ என்ற ஒரே வேரால் பேணுகிறது.
- source_word: יָקִים אֶת הַדָּבָר הַזֶּה
  choice: இந்த வாக்குறுதியை நிறைவேற்றாத
  rationale: הקים דבר என்பது இச்சூழலில் உறுதிமொழியாக ஏற்றுக்கொண்டதை நிலைநிறுத்தி நிறைவேற்றுவதைக் குறிக்கிறது. ‘வாக்குறுதியை நிறைவேற்று’ என்பது சூழலைத் தெளிவுபடுத்தும் இயல்பான தமிழ்.
- source_word: מִבֵּיתוֹ וּמִיגִיעוֹ
  choice: அவனுடைய வீட்டிலிருந்தும் அவனுடைய உழைப்பிலிருந்தும்
  rationale: יְגִיעַ என்பதற்கு உழைப்பு அல்லது உழைப்பின் பலன் என்ற இரு தொடர்புடைய பொருள்கள் இருக்கலாம். முதன்மை உரையில் ‘உழைப்பு’ என்று வைத்து மூலத்தின் சுருக்கத்தையும் பொருள் விரிவையும் பேணுகிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: וָרֵק
  choice: வெறுமையாவானாக
  rationale: רֵק என்பது வெறுமையான அல்லது எதுவுமற்ற நிலையைச் சுட்டுகிறது. உதறப்பட்ட ஆடை மடி வெறுமையாவது என்ற உருவகத்தையும் உடைமையிழப்பையும் இந்தச் சொல் இணைக்கிறது.
- source_word: הַקָּהָל
  choice: கூடியிருந்த அனைவரும்
  rationale: קָהָל என்பது அங்கு கூடியிருந்த சமூகத்தைக் குறிக்கிறது. சமயப் பிரிவுசார் நிழலின்றி இயல்பான நவீன தமிழில் இதன் கூட்டுப் பொருளைத் தெரிவிக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய மூலத்தில் வரும் இறைநாமத்தை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் வழக்கமான ஒலிபெயர்ப்பாகத் தருகிறது.
- source_word: כַדָּבָר הַזֶּה
  choice: இந்த வாக்குறுதியின்படியே
  rationale: முன்பு மக்கள் ஏற்றுக்கொண்ட உறுதிமொழியையே இச்சொற்றொடர் திரும்பச் சுட்டுகிறது. ‘வாக்குறுதி’ என்பது அந்தச் சூழல்சார் குறிப்பை இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைநாமத்தின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூல உரை தனிப்பட்ட உடன்படிக்கைப் பெயரையே பயன்படுத்துவதால், அதை பொதுப் பட்டமாக மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
- issue: כָּל הָאִישׁ என்ற பிரதிநிதித்துவ ஆண்பால் ஒருமை
  choice: ஒவ்வொரு மனிதனையும்
  alternative: ஒவ்வொருவரையும்
  rationale: எபிரெய உரையின் ஆண்பால் ஒருமை வடிவத்தைத் தமிழில் வெளிப்படுத்துகிறது; அதேவேளையில் இது பொதுவான பிரதிநிதித்துவப் பயன்பாடு என்பதை மாற்றாமல் விடுகிறது.
- issue: சாப அறிவிப்பின் விருப்பவினை வலிமை
  choice: உதறிப்போடுவாராக … வெறுமையாவானாக
  alternative: உதறிப்போடுவார் … வெறுமையாவான்
  rationale: כָּכָה மற்றும் தொடரும் வினைவடிவங்கள் அடையாளச் செயலோடு இணைந்த சாப வேண்டுதலைக் காட்டுகின்றன. தமிழ் விருப்பவினை அந்தச் செயற்பாட்டு வலிமையைப் பேணுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. அடையாளச் செயலிலும் சாப அறிவிப்பிலும் திரும்ப வரும் נער என்ற வேரின் சொல்லோவியம் ‘உதறு’ என்பதன் வழியாகப் பேணப்பட்டுள்ளது. மூலத்தில் உள்ள ‘உழைப்பு/உழைப்பின் பலன்’ மற்றும் ‘சொல்/காரியம்/வாக்குறுதி’ ஆகிய பொருள் வாய்ப்புகள் அடிக்குறிப்புகளில் வெளிப்படையாக வைக்கப்பட்டுள்ளன.
