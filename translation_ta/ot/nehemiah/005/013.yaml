  source_fidelity: மொத்தத்தில் மூலத்தின் அடையாளச் செயல், சாப-வேண்டுதல், இறைநாமம், மற்றும் உறுதிமொழியைக் கடைப்பிடித்தல் ஆகியவை நன்றாகத் தரப்பட்டுள்ளன. ஆனால் ‘அவனுடைய உழைப்பிலிருந்தும் உதறிப்போடுவாராக’ என்பது தமிழில் இயல்பாக அமையவில்லை; எபிரெயத்தின் ‘வீட்டிலிருந்தும், உழைப்பின் பலனிலிருந்தும் அவனை உதறுதல்/வெளியேற்றுதல்’ என்ற உடைமையிழப்புச் சித்திரத்தைத் தெளிவுபடுத்த வேண்டும்.
  naturalness: ‘என் அங்கியின் மடியை உதறிவிட்டு’ மற்றும் விருப்பவினை வடிவங்கள் நவீனத் தரத் தமிழில் இயல்பானவை. சாபத்தின் நடுப்பகுதியில் ‘அவனை ... உதறி வெளியேற்றுவாராக’ என்று அமைப்பது இலக்கணத்திலும் பொருளிலும் தெளிவாகும். இறுதி வாக்கியத்தில் ‘அதன்படியே செய்தார்கள்’ என்பது மூலத்தின் சுருக்கமான குறிப்பை இயல்பாகக் காக்கிறது.
  terminology: ‘யாவே,’ ‘ஆமென்,’ ‘வாக்குறுதி,’ மற்றும் ‘ஒவ்வொரு மனிதன்’ ஆகிய தேர்வுகள் திட்டக் கொள்கைக்கும் மூலச் சொல்லாட்சிக்கும் பொருந்துகின்றன. יְגִיעוֹ என்பதன் ‘உழைப்பு/உழைப்பின் பலன்’ என்ற பொருள் வாய்ப்பை முதன்மை உரையில் ‘உழைப்பின் பலன்’ என இயல்பாகத் தருவதும், அடிக்குறிப்பில் மாற்றுவாய்ப்பை வைப்பதும் ஏற்றது.
