source:
  edition: WLC
  text: וַ/תְּהִ֨י צַעֲקַ֥ת הָ/עָ֛ם וּ/נְשֵׁי/הֶ֖ם גְּדוֹלָ֑ה אֶל אֲחֵי/הֶ֖ם הַ/יְּהוּדִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/005/001.yaml
  text: There arose a great outcry from the people and their wives against their Jewish brothers[a].
translation:
  language: ta
  text: மக்களும் அவர்களுடைய மனைவிகளும் தங்கள் யூதச் சகோதரர்களுக்கு[a] எதிராகப் பெரும் கூக்குரல் எழுப்பினர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “யூதச் சகோதரர்கள்” என்பதற்கு “யூதேயச் சகோதரர்கள்” என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல், சூழலைப் பொறுத்து இன-சமய அடையாளத்தையோ பிரதேச அடையாளத்தையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתְּהִי
  choice: எழுந்தது
  rationale: இந்த வழக்காற்று வினை வடிவம் கதையில் ஒரு புதிய நிலை உருவானதை அறிமுகப்படுத்துகிறது. தமிழில் ‘எழுந்தது’ என்பது முறையீட்டுக் குரல் தோன்றியதை இயல்பாகக் காட்டுகிறது; மூலத்தில் தனியான ‘இப்போது’ என்ற காலச்சொல் இல்லாததால் அது சேர்க்கப்படவில்லை.
- source_word: צַעֲקַת
  choice: முறையீட்டுக் குரல்
  rationale: இச்சொல் துயரத்தால் அல்லது அநீதிக்கு எதிரான எதிர்ப்பால் எழும் கூக்குரலைக் குறிக்கிறது. ‘முறையீட்டுக் குரல்’ என்பது வெறும் சத்தத்தைக் காட்டாமல், இச்சூழலின் துயரத்தையும் சமூகப் புகாரையும் வெளிப்படுத்துகிறது.
- source_word: הָעָם
  choice: மக்கள்
  rationale: மூலச்சொல் பொதுவாக மக்களைக் குறிக்கிறது. ‘ஏழை மக்கள்’ அல்லது ‘சாதாரண மக்கள்’ என்று சமூக நிலையை மூலத்தைவிடத் தெளிவாக வரையறுக்காமல் ‘மக்கள்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: וּנְשֵׁיהֶם
  choice: அவர்களுடைய மனைவிகளும்
  rationale: பெயர்ச்சொல்லின் இப்பன்மைச் சேர்க்கை இச்சூழலில் இயல்பாக ‘அவர்களுடைய மனைவிகள்’ எனப் பொருள்படுகிறது; பெண்களும் முறையீட்டில் பங்கேற்றதை மொழிபெயர்ப்பு வெளிப்படையாகப் பாதுகாக்கிறது.
- source_word: גְּדוֹלָה
  choice: பெரும்
  rationale: இந்தப் பெயரடை முறையீட்டுக் குரலின் அளவையும் தீவிரத்தையும் வலியுறுத்துகிறது. ‘பெரும்’ என்பது விரிவுரை சேர்க்காமல் அந்த வலிமையை நேரடியாகக் காட்டுகிறது.
- source_word: אֶל
  choice: எதிராக
  rationale: அடிப்படையில் ‘நோக்கி’ எனப் பொருள்படக்கூடிய இச்சொல், புகார் செய்யும் இச்சூழலில் முறையீட்டின் இலக்கைக் குறிக்கிறது; ஆகவே ‘எதிராக’ என்பது இயல்பான சூழல்சார் மொழிபெயர்ப்பு.
- source_word: אֲחֵיהֶם
  choice: தங்கள் சகோதரர்களுக்கு
  rationale: மூலத்தில் நேரடியாக ‘அவர்களுடைய சகோதரர்கள்’ என்று உள்ளது. தமிழில் எழுவாயைச் சுட்டும் ‘தங்கள்’ உறவையும் ஒரே சமூகத்தைச் சேர்ந்தவர்களுக்கிடையிலான பொறுப்பையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: הַיְּהוּדִים
  choice: யூத
  rationale: இது சகோதரர்களை இன-சமூக அடையாளத்தால் வரையறுக்கிறது. நவீன தமிழில் ‘யூத’ என்பது இயல்பான முதன்மைத் தெரிவு; வரலாற்றுப் பிரதேச அடையாளத்தை வலியுறுத்தும் ‘யூதேய’ என்ற வாய்ப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
theological_decisions:
- issue: יְהוּדִים என்ற இன/பிரதேச அடையாளச் சொல்
  choice: யூத
  alternative: யூதேய
  rationale: இச்சொல் யூத இன-சமயச் சமூகத்தையோ யூதேயப் பிரதேசத்தைச் சேர்ந்தவர்களையோ குறிக்கலாம். நெகேமியா 5-இல் ஒரே உடன்படிக்கைச் சமூகத்திற்குள் நிகழும் அநீதியே முன்னிலையில் இருப்பதால் ‘யூத சகோதரர்கள்’ என்பது அந்த உள்சமூக உறவைத் தெளிவாகக் காட்டுகிறது. வரலாற்றுப் பிரதேச நுணுக்கத்தைத் தீர்மானித்து விடாமல் மாற்று வாசகம் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டது. எபிரெயத்தின் பெயர்ச்சொல் மையமான ‘ஒரு பெரும் முறையீட்டுக் குரல் இருந்தது’ என்ற அமைப்பு, தமிழில் இயல்பான ‘குரல் எழுந்தது’ என வழங்கப்பட்டுள்ளது. ‘முறையீட்டுக் குரல்’ என்பது துயரத்தையும் அநீதிக்கு எதிரான பொதுப் புகாரையும் இணைத்துப் பாதுகாக்கிறது.
