translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியும் ஆனால் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. எபிரெய வினையின் உருவகமான ‘பற்றிக்கொள்’ என்ற சாயல் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது; נְעָרַי என்பதன் பணியாளர்/இளைஞர்/உதவியாளர் என்ற பொருள் வரம்பும் அடிக்குறிப்பில் சுட்டப்பட்டுள்ளது.
