- from: மேலும், இந்த மதிலின் வேலையில் நானும் முழுமையாக ஈடுபட்டேன்[a]. நாங்கள் எந்த வயலையும் வாங்கவில்லை. என் பணியாளர்கள்[b] அனைவரும் அங்கே அந்த வேலைக்காகக் கூடியிருந்தார்கள்.
  to: மேலும், இந்த மதிலின் வேலையில் நானும் ஈடுபட்டேன்[a]. நாங்கள் எந்த வயலையும் வாங்கவில்லை. என் இளைஞர்கள்[b] அனைவரும் அங்கே வேலையில் கூடியிருந்தார்கள்.
  rationale: The revision removes the unsupported intensifier “முழுமையாக” and uses a direct, natural rendering for Nehemiah’s personal involvement. It also restores “இளைஞர்கள்” as the primary equivalent of נְעָרַי, preserving the source’s lexical openness while retaining servant/attendant readings in the anchored footnote. No theological or interpretive expansion has been introduced.
