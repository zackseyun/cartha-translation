base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/005/016.yaml
  text: And I also applied myself to the work on this wall[a], and we did not buy any field[b], and all my young men were gathered there for the work.
translation:
  language: ta
  text: மேலும், இந்த மதிலின் வேலையில் நானும் ஈடுபட்டேன்[a]. நாங்கள் எந்த வயலையும் வாங்கவில்லை. என் இளைஞர்கள்[b] அனைவரும் அங்கே வேலையில் கூடியிருந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இந்த மதிலின் வேலையைப் பற்றிக்கொண்டேன்”; அதாவது, அதில் நானே நேரடியாக ஈடுபட்டேன்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “என் பணியாளர்கள்” அல்லது “என் உதவியாளர்கள்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: மேலும் ... நானும்
  rationale: இணைப்புச் சொல்லின் தொடர்ச்சியையும் גַם என்பதன் சேர்க்கைப் பொருளையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: בִּמְלֶאכֶת הַחוֹמָה הַזֹּאת
  choice: இந்த மதிலின் வேலையில்
  rationale: מְלָאכָה என்பதன் ‘வேலை’ என்ற பொருளையும், வெளிப்படையாகக் கூறப்பட்ட ‘இந்த மதில்’ என்பதையும் நேரடியாகப் பாதுகாக்கிறது.
- source_word: הֶחֱזַקְתִּי
  choice: முழுமையாக ஈடுபட்டேன்
  rationale: இச்சூழலில் வினைச்சொல் வேலையைப் பற்றிக்கொண்டு அதில் தனிப்பட்ட முறையில் முனைப்புடன் ஈடுபடுவதைக் குறிக்கிறது; ‘பலப்படுத்தினேன்’ என்பது இங்கு தவறாகப் புரியக்கூடும்.
- source_word: וְשָׂדֶה לֹא קָנִינוּ
  choice: நாங்கள் எந்த வயலையும் வாங்கவில்லை
  rationale: மூலத்தின் முதலாம் நபர் பன்மையைப் பாதுகாத்து, ஒருமை שָׂדֶה-ஐ எதிர்மறை வாக்கியத்தில் இயல்பான தமிழில் ‘எந்த வயலையும்’ என வழங்குகிறது.
- source_word: נְעָרַי
  choice: என் பணியாளர்கள்
  rationale: இச்சூழலில் நெகேமியாவின் கீழ் பணியாற்றிய ஆட்களைக் குறிக்கும் உறவுப்பொருளை இயல்பாக வெளிப்படுத்துகிறது; வயதை மட்டும் முன்னிறுத்துவதில்லை.
- source_word: קְבוּצִים שָׁם עַל הַמְּלָאכָה
  choice: அங்கே அந்த வேலைக்காகக் கூடியிருந்தார்கள்
  rationale: செயப்பாட்டு பங்கேற்பெயரின் ‘கூடியிருந்த’ நிலையையும், שָׁם என்பதையும், வேலைக்கான நியமனம் அல்லது ஈடுபாட்டையும் காக்கிறது.
