base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/005/017.yaml
  text: The Jews and the officials[a], a hundred and fifty men, and those who came to us from the nations that were around us[b], were at my table.
translation:
  language: ta
  text: யூதர்களும்[a] அதிகாரிகளுமாகிய நூற்றைம்பது பேரும், எங்களைச் சுற்றியிருந்த பிற இனங்களிலிருந்து எங்களிடம் வந்தவர்களும் என் மேசையில் உணவருந்தினார்கள்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “யூதர்கள்” என்பதை “யூதேயர்கள்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “என் மேசையில் உணவருந்தினார்கள்” என்பது, நெகேமியா தமது விருந்தோம்பல் மற்றும் நிர்வாகப் பொறுப்பின் ஒரு பகுதியாக அவர்களுக்கு உணவு வழங்கியதைக் குறிக்கிறது.
    reason: cultural_note
lexical_decisions:
- source_word: וְהַיְּהוּדִים
  choice: யூதர்கள்
  rationale: இச்சொல் யூத மக்களைப் பொதுவாகக் குறிக்கக்கூடும்; நவீன தமிழில் இயல்பாகவும் பரவலாகவும் புரியும் வடிவம் இது. புவியியல் சார்ந்த ‘யூதேயர்கள்’ என்பதும் சாத்தியம் என்பதால் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: וְהַסְּגָנִים
  choice: அதிகாரிகள்
  rationale: கீழ்நிலை ஆட்சித் தலைவர்கள் அல்லது நிர்வாகப் பொறுப்பாளர்களைக் குறிக்கும் சொல்லை, குறிப்பிட்ட பாரசீகப் பதவியை ஊகிக்காமல் பொதுவான நிர்வாகச் சொல்லால் மொழிபெயர்க்கிறது.
- source_word: מֵאָה וַחֲמִשִּׁים אִישׁ
  choice: நூற்றைம்பது பேர்
  rationale: எண்ணிக்கையைத் துல்லியமாகக் காக்கிறது; இங்கு குழுவிலுள்ள மனிதர்களைக் குறிக்க இயல்பான தமிழ்ச் சொல் ‘பேர்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: וְהַבָּאִים אֵלֵינוּ
  choice: எங்களிடம் வந்தவர்கள்
  rationale: எபிரெயப் பங்கேற்புவினை வடிவம் சொற்பொருளில் ‘வருகிறவர்கள்’ என இருந்தாலும், கடந்த நிகழ்வை விவரிக்கும் சூழலில் ‘வந்தவர்கள்’ என்பது இயல்பான தமிழ்.
- source_word: מִן הַגּוֹיִם
  choice: பிற இனங்களிலிருந்து
  rationale: சுற்றியிருந்த யூதரல்லாத மக்களினங்களைக் குறிக்கிறது. ‘புறவினத்தார்’ என்ற இறையியல் சாயலுள்ள சொல்லைத் தவிர்த்து, சூழலுக்கேற்ற பொதுவான சொல்லாட்சி தேர்ந்தெடுக்கப்பட்டுள்ளது.
- source_word: אֲשֶׁר סְבִיבֹתֵינוּ
  choice: எங்களைச் சுற்றியிருந்த
  rationale: அண்டை மக்களினங்களின் புவியியல் நிலையைத் தெளிவாகவும் சுருக்கமாகவும் தெரிவிக்கிறது.
- source_word: עַל שֻׁלְחָנִי
  choice: என் மேசையில் உணவருந்தினார்கள்
  rationale: சொல்லடிப்படையிலான ‘என் மேசையில்’ என்ற உருவகத்தை வைத்துக்கொண்டு, தமிழில் அதன் விருந்தோம்பல் சார்ந்த பொருளை இயல்பாக வெளிப்படுத்த ‘உணவருந்தினார்கள்’ சேர்க்கப்பட்டுள்ளது.
