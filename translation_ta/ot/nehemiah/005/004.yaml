base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/005/004.yaml
  text: And there were those who said[b][a], “We have borrowed money for the king’s tax on our fields and our vineyards.”
translation:
  language: ta
  text: வேறு சிலர், “எங்கள் வயல்களுக்கும் திராட்சைத்தோட்டங்களுக்கும் அரசனுடைய வரிக்காக[b] நாங்கள் பணம்[a] கடன் வாங்கியிருக்கிறோம்” என்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “வெள்ளி”; இங்கு பணத்தைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அரசனுக்குரிய திறைக்காக.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֵשׁ אֲשֶׁר אֹמְרִים
  choice: வேறு சிலர் … என்றார்கள்
  rationale: இந்தச் சொற்றொடர் முறையிட்ட மக்களுக்குள் இருந்த இன்னொரு குழுவை அறிமுகப்படுத்துகிறது. எபிரெயப் பங்கேற்புச் சொல்லின் தொடர்ச்சியான/அறிக்கையிடும் நுணுக்கத்தைத் தமிழ் கதைநடையில் இயல்பான இறந்தகால வடிவம் வெளிப்படுத்துகிறது.
- source_word: לָוִינוּ
  choice: கடன் வாங்கியிருக்கிறோம்
  rationale: வினைச்சொல் கடன் வாங்குவதைக் குறிக்கிறது; வாங்கிய கடனின் விளைவு இன்னும் நீடிப்பதைத் தமிழ் நிறைவுநிலை வடிவம் இயல்பாகக் காட்டுகிறது.
- source_word: כֶסֶף
  choice: பணம்
  rationale: சொல்லின் நேரடிப் பொருள் ‘வெள்ளி’ என்றாலும், இந்தப் பொருளாதாரச் சூழலில் அது பரிமாற்றத்திற்கான பணத்தைக் குறிக்கிறது.
- source_word: לְמִדַּת הַמֶּלֶךְ
  choice: அரசனுடைய வரியைச் செலுத்த
  rationale: מִדָּה இங்கு அரசனுக்குச் செலுத்த வேண்டிய மதிப்பிடப்பட்ட தொகை அல்லது வரியைக் குறிக்கிறது. நவீன தமிழில் ‘வரி’ தெளிவான இயல்பான இணைச்சொல்.
- source_word: שְׂדֹתֵינוּ וּכְרָמֵינוּ
  choice: எங்கள் வயல்களுக்கும் திராட்சைத்தோட்டங்களுக்கும் விதிக்கப்பட்ட
  rationale: இறுதியில் வரும் பெயர்ச்சொற்கள் வரி விதிக்கப்பட்ட நிலவுடைமைகளைக் குறிப்பதாகச் சூழல் காட்டுகிறது. தமிழில் அவற்றுக்கும் வரிக்கும் உள்ள தொடர்பைத் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்த இவ்வாறு அமைக்கப்பட்டுள்ளது.
