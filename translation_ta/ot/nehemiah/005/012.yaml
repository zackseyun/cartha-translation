base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/005/012.yaml
  text: And they said[a], “We will restore it, and from them we will require nothing; we will do as you say.” Then I called the priests and made them swear to do according to this word.
translation:
  language: ta
  text: அவர்கள், “நாங்கள் அவற்றைத் திருப்பிக் கொடுப்போம்; அவர்களிடமிருந்து எதையும் கோரமாட்டோம். நீர் சொல்கிறபடியே செய்வோம்” என்றார்கள். அப்போது நான் ஆசாரியர்களை அழைத்து, இந்த வார்த்தையின்படி[a] செய்யுமாறு அவர்களைச் சத்தியம் செய்யவைத்தேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “இந்த வார்த்தையின்படி” என்பது “இந்தக் காரியத்தின்படி” என்றும், சூழலின்படி “இந்த உறுதிமொழியின்படி” என்றும் மொழிபெயர்க்கப்படலாம். எபிரெய דָּבָר (தாவார்) என்பதற்கு “வார்த்தை” அல்லது “காரியம்” என்று பொருள்படும்; இச்சூழலில் முன்பு கூறப்பட்ட உறுதியையும் அது குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: נָשִׁיב
  choice: நாங்கள் அவற்றைத் திருப்பிக் கொடுப்போம்
  rationale: שׁוב என்பதன் ஹிஃபில் வடிவம் இங்கு முன்பு எடுத்துக்கொண்டவற்றை மீண்டும் உரியவர்களிடம் ஒப்படைப்பதைக் குறிக்கிறது. எபிரெயத்தில் செயப்படுபொருள் வெளிப்படையாக இல்லாததால், முந்தைய வசனத்தின் சூழலைச் சார்ந்து தமிழில் இயல்பாகப் பன்மைச் சுட்டுப்பெயர் சேர்க்கப்பட்டுள்ளது.
- source_word: וּמֵהֶם לֹא נְבַקֵּשׁ
  choice: அவர்களிடமிருந்து எதையும் கோரமாட்டோம்
  rationale: בקשׁ என்பதற்கு தேடுதல், கேட்டல், கோருதல், வற்புறுத்திக் கேட்டல் ஆகிய பொருள்கள் உண்டு. கடன் மற்றும் பொருளாதாரக் கோரிக்கைகள் பற்றிய இச்சூழலில் ‘கோரமாட்டோம்’ என்பது உரிமைக்கோரலைக் கைவிடும் பொருளைத் தெளிவாகத் தருகிறது.
- source_word: כֵּן נַעֲשֶׂה כַּאֲשֶׁר אַתָּה אוֹמֵר
  choice: நீர் சொல்கிறபடியே செய்வோம்
  rationale: כֵּן தரும் ‘அவ்வாறே’ என்ற வலியுறுத்தலை ‘சொல்கிறபடியே’ என்பதிலுள்ள ‘ஏ’ இயல்பான தமிழில் எடுத்துரைக்கிறது. ‘நீர்’ மரியாதையுடனும் நவீனத் தரநிலைத் தமிழுக்கும் ஏற்றதாகவும் உள்ளது.
- source_word: וָאֶקְרָא אֶת־הַכֹּהֲנִים
  choice: அப்போது நான் ஆசாரியர்களை அழைத்து
  rationale: קרא நேரடிச் செயப்படுபொருளோடு வரும்போது அழைத்தல் அல்லது வரவழைத்தல் என்று பொருள்படும். கதைத் தொடர்ச்சியைக் குறிக்க வாவ் தொடர் ‘அப்போது’ எனத் தரப்பட்டுள்ளது.
- source_word: וָאַשְׁבִּיעֵם
  choice: அவர்களைச் சத்தியம் செய்யவைத்தேன்
  rationale: שׁבע என்பதன் ஹிஃபில் வடிவம் ஒருவரைச் சத்தியம் செய்யவைத்தல் அல்லது அவரிடமிருந்து உறுதிமொழி வாங்குதல் என்று பொருள்படும். ‘அவர்களை’ என்பது முன்பு பேசியவர்களைக் குறிப்பதாக இயல்பாகப் புரிகிறது; ஆசாரியர்கள் அழைக்கப்பட்டதன் சாட்சிய அல்லது நிர்வாகப் பங்கு உரையில் விரிவாக்கப்படவில்லை.
- source_word: לַעֲשׂוֹת כַּדָּבָר הַזֶּה
  choice: இந்த வார்த்தையின்படி செய்யுமாறு
  rationale: כ முன்னொட்டு ‘இன்படி’ எனப் பாதுகாக்கப்பட்டுள்ளது. דָּבָר என்பதன் அடிப்படைப் பொருளான ‘வார்த்தை’ முதன்மை உரையில் வைக்கப்பட்டுள்ளது; இங்கு அது முன்னர் கூறப்பட்ட காரியம் அல்லது உறுதிமொழியையும் குறிக்கலாம் என்பதால் மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: சத்தியம் செய்தவர்கள் யார் என்ற சுட்டுப்பெயரின் தொடர்பு
  choice: ‘அவர்களை’ என்ற சுட்டுப்பெயரை விளக்கச் சேர்க்காமல் பாதுகாத்தல்
  alternative: ‘அதிகாரிகளைச் சத்தியம் செய்யவைத்தேன்’ என்று வெளிப்படையாக்குதல்
  rationale: எபிரெய உரையில் ஆண்பால் பன்மைச் சுட்டுப்பெயர் மட்டுமே உள்ளது. சூழலில் அது முன்பு பேசிய பிரபுக்களையும் அதிகாரிகளையும் இயல்பாகக் குறிப்பதாக இருந்தாலும், பெயரைச் சேர்ப்பது மூலத்தில் உள்ள இலக்கணச் சுருக்கத்தைத் தீர்மானமாக விரிவாக்கிவிடும்.
translation_notes:
  register: நவீனத் தரநிலைத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. பொருளாதாரச் சூழலுக்கு ‘கோரமாட்டோம்’ தேர்ந்தெடுக்கப்பட்டது; சத்தியம் மற்றும் வார்த்தை பற்றிய சட்டப்பூர்வத் தொனி பாதுகாக்கப்பட்டுள்ளது. மூலத்தில் மறைந்துள்ள செயப்படுபொருள் முந்தைய வசனச் சூழலைக் காட்ட ‘அவற்றை’ எனச் சுருக்கமாக வழங்கப்பட்டுள்ளது.
