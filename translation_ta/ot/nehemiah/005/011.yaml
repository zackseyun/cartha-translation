  text: הָשִׁיבוּ֩ נָ֨א לָ/הֶ֜ם כְּ/הַ/יּ֗וֹם שְׂדֹתֵי/הֶ֛ם כַּרְמֵי/הֶ֥ם זֵיתֵי/הֶ֖ם וּ/בָתֵּי/הֶ֑ם וּ/מְאַ֨ת הַ/כֶּ֤סֶף וְ/הַ/דָּגָן֙ הַ/תִּיר֣וֹשׁ וְ/הַ/יִּצְהָ֔ר אֲשֶׁ֥ר אַתֶּ֖ם נֹשִׁ֥ים בָּ/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/005/011.yaml
  text: Please restore to them this very day their fields[a], their vineyards, their olive orchards, and their houses, and the hundredth part of the money, the grain, the new wine[b], and the oil that you have been exacting from them.
translation:
  language: ta
  text: இன்றே அவர்களுடைய வயல்களையும் திராட்சைத்தோட்டங்களையும் ஒலிவத்தோப்புகளையும் வீடுகளையும் அவர்களுக்குத் திருப்பிக் கொடுத்துவிடுங்கள். மேலும், நீங்கள் அவர்களிடமிருந்து வசூலித்துவரும்[a] பணம், தானியம், புதுத் திராட்சைமது, எண்ணெய் ஆகியவற்றின் நூற்றில் ஒரு பங்கையும்[b] திருப்பிக் கொடுத்துவிடுங்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நீங்கள் அவர்களிடம் வட்டி வாங்கிவரும்” அல்லது “நீங்கள் அவர்களுக்குக் கடனாகக் கொடுத்திருக்கும்.”
    reason: எபிரெயச் சொல் கடன்கொடுப்பவர் கடன்பட்டவர்மீது கொண்ட நிதிசார் கோரிக்கையையோ அவரிடமிருந்து வசூலிப்பதையோ குறிக்கலாம்.
  - marker: b
    text: அதாவது, “ஒரு சதவீதம்.” இது அவர்களிடமிருந்து வசூலிக்கப்பட்ட பங்கைக் குறிக்கலாம்; அதன் துல்லியமான நிதிமுறை எபிரெய உரையில் விளக்கப்படவில்லை.
    reason: מְאַת என்பதன் நேரடிப் பொருள் ‘நூற்றில் ஒரு பங்கு’; அது எந்தக் கால அளவிலான வட்டி அல்லது கட்டணம் என்பதை உரை குறிப்பிடவில்லை.
lexical_decisions:
- source_word: הָשִׁיבוּ נָא
  choice: திருப்பிக் கொடுத்துவிடுங்கள்
  rationale: שוב என்பதன் causative imperative பறிக்கப்பட்ட அல்லது அடமானமாகப் பெற்ற உடைமைகளை உரியவர்களிடம் மீண்டும் ஒப்படைப்பதைக் குறிக்கிறது. נָא கட்டளையை வேண்டுகோள் கலந்த வலியுறுத்தலாக ஆக்குகிறது; தமிழில் மரியாதை ஏவலும் ‘விடுங்கள்’ வடிவமும் அதை இயல்பாக வெளிப்படுத்துகின்றன.
- source_word: כְּהַיּוֹם
  choice: இன்றே
  rationale: உடனடியாக, இதே நாளில் செய்ய வேண்டும் என்ற வலியுறுத்தலைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: שְׂדֹתֵיהֶם
  choice: அவர்களுடைய வயல்கள்
  rationale: விவசாய நிலங்களைக் குறிக்கும் நேரடியான சமமான சொல்.
- source_word: כַּרְמֵיהֶם
  choice: திராட்சைத்தோட்டங்கள்
  rationale: כרם என்பது இச்சூழலில் திராட்சை பயிரிடப்படும் நிலவுடைமையைக் குறிக்கிறது.
- source_word: זֵיתֵיהֶם
  choice: ஒலிவத்தோப்புகள்
  rationale: வயல்கள், திராட்சைத்தோட்டங்கள் ஆகியவற்றுடன் இணையாக வரும் பயிரிடப்பட்ட ஒலிவ நிலப்பகுதிகளைக் குறிக்கிறது; தனித்தனி மரங்கள் என்ற பொருளுக்கு மட்டுப்படுத்தவில்லை.
- source_word: וּבָתֵּיהֶם
  choice: வீடுகள்
  rationale: அவர்களிடமிருந்து கைமாறிய அசையா உடைமைகளின் பட்டியலை நிறைவு செய்கிறது.
- source_word: וּמְאַת
  choice: நூற்றில் ஒரு பங்கு
  rationale: எபிரெயச் சொல்லின் நேரடியான பின்னப் பொருளைப் பாதுகாக்கிறது; இதை நவீன கணக்கில் ‘ஒரு சதவீதம்’ என்று மட்டும் மாற்றாமல், வசூலின் துல்லிய இயல்பு குறித்த ஐயத்தையும் விடுகிறது.
- source_word: הַכֶּסֶף
  choice: பணம்
  rationale: כֶּסֶף என்பதற்கு ‘வெள்ளி’ என்றும் பொருள் உண்டு; இங்கு கடன் மற்றும் வசூல் சூழலில் அதன் பொருளாதாரச் செயல்பாட்டை ‘பணம்’ தெளிவாகக் காட்டுகிறது.
- source_word: הַדָּגָן
  choice: தானியம்
  rationale: பொதுவாக உணவுத் தானிய வகைகளைக் குறிக்கும் இயல்பான தமிழ் இணைச்சொல்.
- source_word: הַתִּירוֹשׁ
  choice: புதுத் திராட்சைமது
  rationale: תִּירוֹשׁ பொதுவான மதுவை மட்டுமல்லாமல் புதிய திராட்சை விளைச்சலிலிருந்து கிடைக்கும் மதுவைக் குறிக்கலாம்; அந்தச் சொல்வேறுபாட்டைப் பாதுகாக்கிறது.
- source_word: הַיִּצְהָר
  choice: எண்ணெய்
  rationale: பொதுவாக புதிய ஒலிவ எண்ணெயைக் குறிக்கிறது; வேளாண்மைச் சூழல் அதன் மூலத்தைத் தெளிவாக்குவதால் ‘எண்ணெய்’ போதுமானது.
- source_word: נֹשִׁים בָּהֶם
  choice: அவர்களிடமிருந்து வசூலித்துவரும்
  rationale: கடன் கொடுத்தவர் கடன்பட்டவர்மீது உரிமைகோருதல் அல்லது அவரிடமிருந்து தொகை பெறுதல் என்ற பரந்த நிதிசார் பொருளை வெளிப்படுத்துகிறது; ‘வட்டி’ என்று மட்டும் குறுக்காமல் ஒடுக்குமுறை வசூலின் வலிமையையும் தக்கவைக்கிறது.
theological_decisions:
- issue: நֹשִׁים என்ற கடன்/வசூல் சொல்லின் சமூகநீதிசார் பொருள்
  choice: ‘அவர்களிடமிருந்து வசூலித்துவரும்’ என்று பரந்த பொருளில் மொழிபெயர்க்கப்பட்டது.
  alternative: ‘அவர்களிடம் வட்டி வாங்கிவரும்’ அல்லது ‘அவர்களுக்குக் கடனாகக் கொடுத்திருக்கும்’
  rationale: சூழல் கடனாளிகளை ஒடுக்கும் கடன்வழக்குகளைச் சாடுகிறது. ஆனால் எபிரெய வினை கடன்கொடுப்பவரின் நடவடிக்கையைப் பரந்த விதத்தில் குறிக்கக்கூடும்; ஆகவே வட்டி என்ற ஒரே தொழில்நுட்பப் பொருளில் அதை முடிவாகக் கட்டுப்படுத்தவில்லை.
- issue: מְאַת (‘நூற்றில் ஒரு பங்கு’) எதைக் குறிக்கிறது என்பது
  choice: பணம் மற்றும் வேளாண் விளைபொருட்களிலிருந்து வசூலிக்கப்பட்ட நூற்றில் ஒரு பங்காக முதன்மை உரையில் அமைக்கப்பட்டது.
  alternative: முழுப் பட்டியலின் இலக்கண அமைப்பை வேறுவிதமாகப் பிரித்து வாசித்தல், அல்லது இதை குறிப்பாக மாதாந்திர வட்டி என விளக்குதல்
  rationale: சொல் நேரடியாக ‘நூற்றில் ஒரு பங்கு’ என்பதைக் குறிக்கிறது; அது வட்டி அல்லது வேறு கட்டணமாக இருந்திருக்கலாம். மூலத்தில் இல்லாத கால அளவையோ துல்லிய நிதிமுறையையோ மொழிபெயர்ப்பில் சேர்க்கவில்லை.
translation_notes:
  register: நவீன தரத் தமிழில், சாதாரண வாசகருக்குப் புரியும் வகையில் மரியாதையுடனும் அவசர வலியுறுத்தலுடனும் அமைக்கப்பட்டது. நிலவுடைமைப் பட்டியலில் ஒரே மாதிரியான பன்மை வடிவங்கள் பயன்படுத்தப்பட்டன. ‘ஒலிவம்’ மற்றும் ‘புதுத் திராட்சைமது’ போன்ற சொற்கள் மூலத்தின் வேளாண்மைச் சிறப்பைத் தக்கவைக்கின்றன; நிதிசார் ஐயங்கள் அடிக்குறிப்புகளில் வெளிப்படையாகப் பாதுகாக்கப்பட்டன.
