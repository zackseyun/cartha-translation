base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/005/015.yaml
  text: But the former governors who were before me laid heavy burdens on the people[a], and took from them bread and wine, besides forty shekels of silver. Even their servants ruled over the people. But I did not do so[c][b], because of the fear of God.
translation:
  language: ta
  text: ஆனால், எனக்கு முன்பிருந்த ஆளுநர்கள் மக்கள்மீது பெரும் சுமைகளைச் சுமத்தி, அவர்களிடமிருந்து அப்பத்தையும் திராட்சரசத்தையும், அதோடு நாற்பது சேக்கல் வெள்ளியையும்[a] வாங்கினார்கள். அவர்களுடைய பணியாளர்களும்[b] மக்கள்மீது அதிகாரம் செலுத்தினார்கள். நானோ கடவுளுக்குப் பயந்ததால்[c] அப்படிச் செய்யவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நாற்பது சேக்கல் வெள்ளிக்கு மேலாக.” அப்பமும் திராட்சரசமும் நாற்பது சேக்கல் வெள்ளி என்ற பணவரிக்கு மேலாக வாங்கப்பட்டதாக எபிரெயச் சொற்றொடர் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “உதவியாளர்கள்” அல்லது “இளைஞர்கள்.” இங்கு எபிரெயச் சொல் ஆளுநர்களுக்குக் கீழ்ப்பட்ட அலுவலர்களைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: சொல்லுக்கு சொல், “கடவுளுக்கான பயத்தின் காரணமாக”; அல்லது, “கடவுள்மீது கொண்ட பயபக்தியினால்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַפַּחוֹת הָרִאשֹׁנִים אֲשֶׁר לְפָנַי
  choice: எனக்கு முன்பிருந்த ஆளுநர்கள்
  rationale: பாரசீக ஆட்சிக்கால மாகாண நிர்வாகிகளைக் குறிக்கும் פֶּחָה என்பதற்கு ‘ஆளுநர்கள்’ வரலாற்றுப் பொருத்தமுடையது; முழுச் சொற்றொடரும் நெகேமியாவுக்கு முன்பு பதவியிலிருந்தவர்களை இயல்பான தமிழில் குறிக்கிறது.
- source_word: הִכְבִּידוּ עַל הָעָם
  choice: மக்கள்மீது பெரும் சுமைகளைச் சுமத்தி
  rationale: כבד என்பதன் ‘கனமாக்குதல்’ என்ற உருவகத்தைப் பேணுவதோடு, இங்கு குறிக்கப்படும் கடுமையான வரிவிதிப்புகளையும் கோரிக்கைகளையும் தெளிவாக உணர்த்துகிறது.
- source_word: וַיִּקְחוּ מֵהֶם
  choice: அவர்களிடமிருந்து ... வாங்கினார்கள்
  rationale: לקח என்பதன் அடிப்படைப் பொருள் ‘எடுத்தல்’; வரி அல்லது கட்டாய வசூல் சூழலில் ‘வாங்கினார்கள்’ என்பது இயல்பான தமிழ், அதேவேளை ‘பறித்தார்கள்’ என்று கூடுதல் வன்முறையைப் புகுத்தாது.
- source_word: בְּלֶחֶם וָיַיִן
  choice: அப்பத்தையும் திராட்சரசத்தையும்
  rationale: மூலத்தில் குறிப்பிடப்பட்ட இரு பொருட்களையும் பொதுவாக ‘உணவு’ என்று மாற்றாமல் குறிப்பாகப் பேணுகிறது.
- source_word: אַחַר כֶּסֶף שְׁקָלִים אַרְבָּעִים
  choice: அதோடு நாற்பது சேக்கல் வெள்ளியையும்
  rationale: இங்கு אַחַר என்பது உணவும் திராட்சரசமும் பணவரியுடன் கூடுதலாக வாங்கப்பட்டதைக் குறிப்பதாகப் புரிந்துகொள்ளப்படுகிறது; அளவீட்டு அலகான ‘சேக்கல்’ அப்படியே வைக்கப்படுகிறது.
- source_word: נַעֲרֵיהֶם
  choice: அவர்களுடைய பணியாளர்கள்
  rationale: נַעַר என்பதற்கு ‘இளைஞர்’ என்ற பொருள் இருந்தாலும், இந்நிர்வாகச் சூழலில் ஆளுநர்களுக்குக் கீழ்ப்பட்ட பணியாளர்கள் அல்லது உதவியாளர்களைக் குறிக்கிறது.
- source_word: שָׁלְטוּ עַל הָעָם
  choice: மக்கள்மீது அதிகாரம் செலுத்தினார்கள்
  rationale: שׁלט குறிக்கும் ஆளுகை அல்லது அதிகாரச் செலுத்துதலைத் தெளிவாகத் தருகிறது; ‘கொடுங்கோல் செய்தார்கள்’ போன்ற மூலத்தைவிட வலுவான விளக்கத்தைச் சேர்க்கவில்லை.
- source_word: וַאֲנִי לֹא עָשִׂיתִי כֵן
  choice: நானோ ... அப்படிச் செய்யவில்லை
  rationale: முந்தைய ஆளுநர்களின் நடத்தைக்கும் நெகேமியாவின் நடத்தைக்கும் இடையிலான நேரடி முரண்பாட்டைப் பேணுகிறது.
- source_word: מִפְּנֵי יִרְאַת אֱלֹהִים
  choice: கடவுளுக்குப் பயந்ததால்
  rationale: ‘கடவுளுக்கான பயம்’ என்ற எபிரெய வேதாகமச் சொல்லாட்சியின் வலிமையை இயல்பான நவீன தமிழில் தருகிறது; அதை வெறும் மரியாதையாக மென்மைப்படுத்தவில்லை.
theological_decisions:
- issue: יִרְאַת אֱלֹהִים என்பதன் பொருள்
  choice: கடவுளுக்குப் பயந்ததால்
  alternative: கடவுள்மீது கொண்ட பயபக்தியினால்
  rationale: நெகேமியாவின் செயலை வழிநடத்திய கடவுளுக்கான அச்சமும் மரியாதையும் பொறுப்புணர்வும் சேர்ந்த கருத்தை ‘பயந்ததால்’ பேணுகிறது. ‘பயபக்தி’ என்பது சாத்தியமான விளக்கம் என்றாலும், அது மூலத்தின் ‘பயம்’ என்ற நேரடியான கூறை ஓரளவு விளக்கிவிடும்.
translation_notes:
  register: நவீன நிலையான தமிழில் எளிதாக வாசிக்கக்கூடிய, அதேவேளை வரலாற்று மற்றும் வேதாகமக் கண்ணியத்தைப் பேணும் நடை. ‘அப்பம்’, ‘திராட்சரசம்’, ‘சேக்கல்’ போன்ற குறிப்பான சொற்கள் மூலத்தின் பண்பாட்டு வடிவத்தைப் பாதுகாக்கின்றன; ‘நானோ’ என்பது இறுதி எதிர்மறை ஒப்பீட்டைத் தெளிவாக்குகிறது.
