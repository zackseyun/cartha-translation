  text: ו/יאמר לֹא ט֥וֹב הַ/דָּבָ֖ר אֲשֶׁר אַתֶּ֣ם עֹשִׂ֑ים הֲ/ל֞וֹא בְּ/יִרְאַ֤ת אֱלֹהֵ֨י/נוּ֙ תֵּלֵ֔כוּ מֵ/חֶרְפַּ֖ת הַ/גּוֹיִ֥ם אוֹיְבֵֽי/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/005/009.yaml
  text: So I said[a], “What you are doing is not good. Should you not walk in the fear of our God because of the reproach of the nations, our enemies?”
translation:
  language: ta
  text: 'அப்போது நான் சொன்னேன்: “நீங்கள் செய்கிற காரியம் நல்லதல்ல. நம் கடவுளுக்குப் பயந்து, நம் பகைவர்களான பிற இனத்தாரின் பழிச்சொல்லைக் கருத்தில் கொண்டு நீங்கள் நடக்க வேண்டாமா?[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நம் பகைவர்களான பிற இனத்தாரின் பழிச்சொல்லைத் தவிர்ப்பதற்காக” என்றும் மொழிபெயர்க்கலாம். எபிரேய முன்னிடைச்சொல் இங்கு ஒரு காரணத்தையோ, பழிச்சொல்லைத் தவிர்க்கும் நோக்கத்தையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: அப்போது நான் சொன்னேன்
  rationale: וַ־ உரையாடலைக் கதையின் அடுத்த கட்டமாக முன்னெடுக்கிறது. ‘அப்போது’ என்பது அதன் தொடர்ச்சிப் பொருளை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: לֹא טוֹב
  choice: நல்லதல்ல
  rationale: எபிரெய மதிப்பீட்டுச் சொற்றொடரை நேரடியாகக் காத்து, செயலின் ஒழுக்கத் தவற்றையும் தெளிவாக உணர்த்துகிறது.
- source_word: הַדָּבָר אֲשֶׁר אַתֶּם עֹשִׂים
  choice: நீங்கள் செய்கிற காரியம்
  rationale: எபிரெய பெயர்ச்சொல் அமைப்பைப் பொருளிழக்காமல் இயல்பான தமிழில் வழங்குகிறது.
- source_word: הֲלוֹא
  choice: வேண்டாமா?
  rationale: கேள்வி வடிவில் அமைந்த ஒழுக்க அறிவுறுத்தலையும் எதிர்பார்க்கப்படும் உடன்பாட்டையும் வெளிப்படுத்துகிறது.
- source_word: בְּיִרְאַת אֱלֹהֵינוּ
  choice: நம் கடவுளுக்குப் பயந்து
  rationale: יִרְאָה என்பதன் ‘பயம்’ சார்ந்த உடன்படிக்கை மொழியைத் தக்கவைக்கிறது; அதை வெறும் ‘மரியாதை’ என மென்மைப்படுத்தவில்லை.
- source_word: תֵּלֵכוּ
  choice: நடக்க
  rationale: வாழ்க்கை நடத்தையைக் குறிக்கும் எபிரெய உருவகத்தைத் தமிழிலும் தக்கவைக்கிறது.
- source_word: מֵחֶרְפַּת
  choice: பழிச்சொல்லைக் கருத்தில்கொண்டு
  rationale: מִן முன்னிடைச்சொல் இங்கு காரணம் அல்லது தவிர்க்கும் நோக்கம் ஆகிய இரண்டிலும் புரிந்துகொள்ளப்படலாம். முதன்மை உரை காரணத் தூண்டுதலை இயல்பாகத் தருகிறது; மாற்றுப் புரிதல் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: הַגּוֹיִם אֹיְבֵינוּ
  choice: நம் பகைவர்களான பிற இனத்தார்
  rationale: சூழ்ந்திருந்த அந்நிய மக்களைக் குறிக்கும் גּוֹיִם என்பதையும், ‘நம் பகைவர்கள்’ என்ற அதன் விளக்கத்தையும் இயல்பான தமிழில் ஒருங்கிணைக்கிறது.
theological_decisions:
- issue: உடன்படிக்கைச் சூழலில் הלך என்பதன் ஒழுக்க உருவகம்
  choice: ‘வாழ’ என்று உரைநடையாக்காமல் ‘நடக்க’ என்ற உருவகத்தைத் தக்கவைத்தல்
  alternative: வாழ வேண்டும் / நடந்துகொள்ள வேண்டும்
  rationale: கடவுளுக்குப் பயந்து அவருக்கு ஏற்ற நடத்தையில் வாழ்வதைக் குறிக்கும் வேதாகம உருவகத்தை இது பாதுகாக்கிறது; தமிழிலும் இதன் பொருள் சூழலால் புரிகிறது.
- issue: מִן முன்னிடைச்சொல் காட்டும் காரணமா அல்லது தவிர்க்கும் நோக்கமா என்ற தெளிவின்மை
  choice: முதன்மை உரையில் ‘பழிச்சொல்லைக் கருத்தில்கொண்டு’ எனக் காரணத் தூண்டுதலைக் காட்டுதல்
  alternative: பிற இனத்தாரின் பழிச்சொல்லைத் தவிர்ப்பதற்காக
  rationale: எபிரெய சொற்றொடர் இரு பொருளுக்கும் இடமளிப்பதால் ஒன்றை மட்டும் இறுதியான பொருளாக நிர்ணயிக்காமல், மாற்றுப் புரிதலை அடிக்குறிப்பில் வெளிப்படையாகக் குறிப்பிடுகிறது.
