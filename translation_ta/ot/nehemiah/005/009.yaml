  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘கடவுளுக்குப் பயந்து நடக்க’ என்பது மூலத்தின் இறையியல் மற்றும் ஒழுக்க உருவகத்தை இயல்பாகத் தக்கவைக்கிறது.
