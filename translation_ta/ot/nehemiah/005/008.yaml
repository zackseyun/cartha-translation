  text: וָ/אֹמְרָ֣/ה לָ/הֶ֗ם אֲנַ֣חְנוּ קָ֠נִינוּ אֶת אַחֵ֨י/נוּ הַ/יְּהוּדִ֜ים הַ/נִּמְכָּרִ֤ים לַ/גּוֹיִם֙ כְּ/דֵ֣י בָ֔/נוּ וְ/גַם אַתֶּ֛ם תִּמְכְּר֥וּ אֶת אֲחֵי/כֶ֖ם וְ/נִמְכְּרוּ לָ֑/נוּ וַֽ/יַּחֲרִ֔ישׁוּ וְ/לֹ֥א מָצְא֖וּ דָּבָֽר־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/005/008.yaml
  text: And I said to them[a], “We have bought back our Jewish brothers who were sold to the nations, as much as we were able. But now you yourselves are even selling your brothers[b], and they must be sold to us!” Then they were silent and found nothing to say.
translation:
  language: ta
  text: நான் அவர்களிடம், “பிற இனத்தாருக்கு விற்கப்பட்ட நம் யூத சகோதரர்களை[a] நம்மால் இயன்ற அளவுக்கு நாம் விலை கொடுத்து மீட்டிருக்கிறோம். ஆனால் நீங்களோ உங்கள் சகோதரர்களையே விற்கிறீர்கள்; அவர்கள் நமக்கே விற்கப்பட வேண்டுமா?[b]” என்றேன். அப்போது அவர்கள் அமைதியாக இருந்தார்கள்; சொல்ல அவர்களிடம் எதுவும் இல்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “நம் யூத சகோதரர்கள்” என்பது சமூகத்தின் சக உறுப்பினர்களைக் குறிக்கும் ஆண்பால் உறவுமுறைச் சொற்றொடர்; “நம் சக யூதர்கள்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெய வாக்கியம் சுருக்கமாகவும் பொருள் தெளிவில்லாமலும் உள்ளது. “அவர்கள் நமக்கே விற்கப்பட வேண்டும்!” என்றும் இதைப் புரிந்துகொள்ளலாம்; தங்கள் சகோதரர்களை விற்பதால் அவர்கள் மீண்டும் தங்கள் சொந்த மக்களாலேயே விலைக்கு வாங்கப்படும் நிலை ஏற்படுவதை இது கண்டிக்கிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: קָנִינוּ
  choice: விலை கொடுத்து மீட்டிருக்கிறோம்
  rationale: இங்கு பிற இனத்தாரிடம் அடிமைகளாக விற்கப்பட்ட சக யூதர்களை விலை கொடுத்து விடுவித்தலைக் குறிக்கிறது. ‘மீட்டிருக்கிறோம்’ மட்டும் விலை கொடுத்த அம்சத்தை மறைக்கலாம்; ‘விலை கொடுத்து’ என்பது קנה என்பதன் வாங்குதல் சார்ந்த பொருளைத் தெளிவாக்குகிறது.
- source_word: אַחֵינוּ הַיְּהוּדִים
  choice: நம் யூத சகோதரர்களை
  rationale: எபிரெயத்தின் ஆண்பால் உறவுமுறைச் சொல்லையும் யூத சமூக ஒற்றுமையையும் நேரடியாகப் பாதுகாக்கிறது.
- source_word: הַנִּמְכָּרִים לַגּוֹיִם
  choice: பிற இனத்தாருக்கு விற்கப்பட்ட
  rationale: גּוֹיִם என்பதை இச்சூழலில் இயல்பான நவீன தமிழில் ‘பிற இனத்தார்’ என வழங்குகிறது; வினையின் செயப்பாட்டு வடிவத்தையும் காக்கிறது.
- source_word: כְּדֵי בָנוּ
  choice: நம்மால் இயன்ற அளவுக்கு
  rationale: கிடைத்த திறன் அல்லது பொருள்வளத்தின் அளவுக்கேற்ப செய்தோம் என்ற எபிரெய மொழிவழக்கின் பொருளை இயல்பாகத் தருகிறது.
- source_word: וְגַם אַתֶּם
  choice: ஆனால் நீங்களோ
  rationale: முன்னர் செய்த மீட்புக்கும் இப்போது குற்றஞ்சாட்டப்படுவோரின் செயலுக்கும் இடையிலான வலியுறுத்தப்பட்ட முரண்பாட்டைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: תִּמְכְּרוּ
  choice: விற்கிறீர்கள்
  rationale: நெகேமியா அவர்களுடைய தற்போதைய நடைமுறையை நேரடியாகக் கண்டிப்பதை நிகழ்காலத்தில் தருகிறது.
- source_word: וְנִמְכְּרוּ לָנוּ
  choice: அவர்களை மறுபடியும் நாமே விலைக்கு வாங்க வேண்டுமா?
  rationale: சுருக்கமான, கடினமான எபிரெய வாக்கியத்தை வினாவாகப் புரிந்துகொண்டு, அவர்கள் தங்கள் சகோதரர்களை விற்றதால் அதே சமூகத்தார் மீண்டும் விலை கொடுத்து வாங்க வேண்டிய அபத்தமான விளைவை வெளிப்படுத்துகிறது. ‘மறுபடியும்’ சூழலிலிருந்து தெளிவாக்கப்பட்டதாகும்.
- source_word: וַיַּחֲרִישׁוּ
  choice: அவர்கள் அமைதியாக இருந்தார்கள்
  rationale: குற்றச்சாட்டுக்கு மறுமொழியின்றி மௌனமாக இருந்ததை நேராகவும் இயல்பாகவும் கூறுகிறது.
- source_word: וְלֹא מָצְאוּ דָּבָר
  choice: பதில் சொல்ல அவர்களிடம் எதுவும் இருக்கவில்லை
  rationale: சொல்லத்தக்க வார்த்தையையோ பதிலையோ காணவில்லை என்ற எபிரெய மொழிவழக்கை இயல்பான தமிழில் வழங்குகிறது.
theological_decisions:
- issue: אַחֵינוּ / אֲחֵיכֶם என்ற ஆண்பால் உறவுமுறைச் சொல்லின் பரப்பு
  choice: சகோதரர்கள்
  alternative: சக யூதர்கள்; சகோதர சகோதரிகள்
  rationale: மூலத்தில் உள்ள ஆண்பால் பன்மை உறவுமுறைச் சொல்லையும் உடன்படிக்கைச் சமூக ஒற்றுமையின் உருவகத்தையும் முதன்மை உரையில் காக்கிறது; அது சமூக உறுப்பினர்களைக் குறிக்கும் பயன்பாடு என்பதை அடிக்குறிப்பில் விளக்குகிறது.
- issue: וְנִמְכְּרוּ לָנוּ என்ற தெளிவற்ற இறுதி உட்பிரிவின் வாக்கிய வலிமை
  choice: அவர்களை மறுபடியும் நாமே விலைக்கு வாங்க வேண்டுமா?
  alternative: அவர்கள் நமக்கே விற்கப்பட வேண்டும்!
  rationale: எபிரெயம் சுருக்கமாக இருப்பதால் உறுதியான கூற்றாகவும் சொல்லாட்சிக் கேள்வியாகவும் புரிந்துகொள்ள முடியும். சூழலின் கண்டனத் தொனியையும் அபத்தமான விளைவையும் தமிழில் தெளிவாகக் காட்ட சொல்லாட்சிக் கேள்வி தேர்ந்தெடுக்கப்பட்டது; மாற்று வாசிப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான உரைநடை பயன்படுத்தப்பட்டுள்ளது. ‘விலை கொடுத்து மீட்டல்’ என்பது வாங்குதலையும் விடுவித்தலையும் ஒருங்கே தெரிவிக்கிறது. குற்றஞ்சாட்டும் முரண்பாட்டுக்கு ‘நீங்களோ’ பயன்படுத்தப்பட்டுள்ளது; மூலத்தின் கடினமான இறுதி உட்பிரிவின் மாற்று வாசிப்பு அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
