translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும் வகையில் இயல்பும் கண்ணியமும் பேணப்பட்டுள்ளன. ‘அடமானம் வைக்கிறோம்’ என்பது பொருளாதாரச் சூழலைத் தெளிவாக்குகிறது; மூலத்தில் உள்ள ‘பிணையமாகக் கொடுத்தல்’ என்ற நுணுக்கம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
