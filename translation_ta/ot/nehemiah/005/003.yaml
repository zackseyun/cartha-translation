base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/005/003.yaml
  text: And there were others who said[a], “We are mortgaging our fields, our vineyards, and our houses to get grain during the famine.”
translation:
  language: ta
  text: வேறு சிலர், “பஞ்சத்தின்போது தானியம் பெறுவதற்காக எங்கள் வயல்களையும் திராட்சைத்தோட்டங்களையும் வீடுகளையும் அடமானம் வைக்கிறோம்[a]” என்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எங்கள் வயல்களையும் திராட்சைத்தோட்டங்களையும் வீடுகளையும் பிணையமாகக் கொடுக்கிறோம்.” எபிரெய வினைச்சொல், கடனுக்கான உத்தரவாதமாகச் சொத்தைக் கொடுப்பதைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֵשׁ אֲשֶׁר אֹמְרִים
  choice: வேறு சிலர் ... என்றார்கள்
  rationale: முறையிடும் மக்களில் மேலும் ஒரு பிரிவினரை அறிமுகப்படுத்தும் எபிரெய மொழிநடையை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: שְׂדֹתֵינוּ וּכְרָמֵינוּ וּבָתֵּינוּ
  choice: எங்கள் வயல்களையும் திராட்சைத்தோட்டங்களையும் வீடுகளையும்
  rationale: சொத்துகளைக் குறிக்கும் மூன்று தெளிவான சொற்களையும் அவற்றின் வரிசையையும் காக்கிறது.
- source_word: אֲנַחְנוּ עֹרְבִים
  choice: அடமானம் வைக்கிறோம்
  rationale: கடனுக்காகச் சொத்தைப் பிணையமாகக் கொடுப்பதைக் குறிக்கும் சூழல்சார் பொருளை இன்றைய தமிழில் தெளிவாகச் சொல்கிறது.
- source_word: וְנִקְחָה
  choice: வாங்குவதற்காக
  rationale: தானியத்தைப் பெறுவதே சொத்துகளை அடமானம் வைப்பதன் நோக்கம் என்பதை இயல்பாகக் காட்டுகிறது; எனினும் எபிரெய வினையின் அடிப்படைப் பொருள் பொதுவாக ‘பெறுதல்’ என்பதாகும்.
- source_word: דָגָן
  choice: தானியம்
  rationale: தானிய விளைபொருளைக் குறிக்கும் மூலச்சொல்லின் துல்லியமான, பொதுவாகப் புரியக்கூடிய இணைச்சொல்.
- source_word: בָּרָעָב
  choice: பஞ்சத்தின்போது
  rationale: தானியம் தேவைப்பட்ட சூழ்நிலையைச் சுட்டுகிறது; காரணத்தை தேவையின்றி மிகைப்படுத்துவதில்லை.
