base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/005/019.yaml
  text: Remember me[a], my God, for good, for all that I have done for this people.
translation:
  language: ta
  text: என் இறைவனே, இந்த மக்களுக்காக நான் செய்த எல்லாவற்றிற்காகவும் என்னைச் சாதகமாக நினைத்தருளும்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என்னை நன்மைக்காக நினைத்தருளும்.”
    reason: לְטוֹבָה என்பதன் சொல்லுக்கு-சொல் நெருக்கமான மாற்று; முதன்மை உரையில் அதன் இயல்பான பொருளான ‘சாதகமாக’ வழங்கப்பட்டுள்ளது.
lexical_decisions:
- source_word: זָכְרָה ... לִי
  choice: என்னை நினைத்து
  rationale: זכר என்பதன் வேண்டுகோள் வடிவமும் அதனுடன் வரும் לִי என்பதும் இறைவனை நோக்கிய தனிப்பட்ட மன்றாட்டை உருவாக்குகின்றன. தமிழில் ‘என்னை நினைத்து’ என்பது இந்த வேண்டுகோளை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: אֱלֹהַי
  choice: என் இறைவனே
  rationale: முதலாம் நபர் ஒருமை உடைமைப் பின்னொட்டுடன் வரும் சொல் நேரடி அழைப்பாக உள்ளது; ‘என் இறைவனே’ தனிப்பட்ட ஜெபத் தொனியையும் அழைப்பையும் காக்கிறது.
- source_word: לְטוֹבָה
  choice: எனக்கு நன்மை செய்யும்
  rationale: לְטוֹבָה என்பது நன்மையான விளைவுக்காக அல்லது சாதகமாக நினைவுகூருவதைச் சுட்டுகிறது. ‘எனக்கு நன்மை செய்யும்’ என்பது தமிழில் தெளிவாகவும் இயல்பாகவும் இருந்து, சாதகமான தெய்வீக நினைவின் கருத்தைத் தெரிவிக்கிறது.
- source_word: כֹּל אֲשֶׁר עָשִׂיתִי
  choice: நான் செய்த எல்லாவற்றையும்
  rationale: כֹּל אֲשֶׁר என்ற பொதுவான உறவுத்தொடரையும், நிறைவேறிய செயலைக் குறிக்கும் עָשִׂיתִי என்பதையும் நேர்த்தியாகப் பிரதிபலிக்கிறது.
- source_word: עַל הָעָם הַזֶּה
  choice: இந்த மக்களுக்காக
  rationale: இங்கு עַל என்பது மக்களின் நலனுக்காக அல்லது அவர்கள் சார்பாகச் செய்யப்பட்ட செயல்களைக் குறிக்கிறது; ‘இந்த மக்களுக்காக’ என்பது இயல்பான நவீனத் தமிழ்.
theological_decisions:
- issue: நெகேமியா தன்னை நினைக்கும்படி வேண்டுவதன் தன்மை
  choice: மக்களுக்காகச் செய்த செயல்களை முன்னிட்டு இறைவன் தன்னைச் சாதகமாக நினைத்து நன்மை செய்ய வேண்டுமென்ற மன்றாட்டு
  alternative: பொது நியாயநிறுவலுக்கான வேண்டுகோள் அல்லது தன் செயல்கள் இறைவனிடத்தில் தகுதியைச் சம்பாதித்தன என்ற உரிமைக்கோரல்
  rationale: எபிரெய உரை சாதகமான தெய்வீக நினைவுக்கான தனிப்பட்ட மன்றாட்டைக் காட்டுகிறது; ஆனால் அது எந்தக் குறிப்பிட்ட புண்ணியக் கோட்பாட்டையும் வெளிப்படையாக உறுதிப்படுத்தவில்லை. மொழிபெயர்ப்பு இந்த இறையியல் பதற்றத்தைத் தீர்க்காமல் காக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில், மரியாதையும் ஜெபத் தொனியும் கொண்ட நடை. ‘இறைவனே’ நேரடி அழைப்பைக் காட்டுகிறது; ‘செய்யும்’ வேண்டுகோள் சார்ந்த மரியாதை வினை வடிவமாகப் பயன்படுத்தப்பட்டுள்ளது. அடிக்குறிப்பு குறி முதன்மை உரையில் சேர்க்கப்பட்டுள்ளது.
