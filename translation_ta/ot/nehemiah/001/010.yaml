  yaml_path: translation/ot/nehemiah/001/010.yaml
  text: But they are your servants and your people[b][a], whom you redeemed by your great power and by your strong hand.
translation:
  language: ta
  text: ஆனால் அவர்கள் உமது ஊழியர்களும் உமது மக்களும் ஆவர்; அவர்களை உமது மாபெரும் வல்லமையாலும் உமது வலிமைமிக்க கரத்தாலும் மீட்டீர்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘விடுவித்தீர்’ அல்லது ‘மீட்டுக் காப்பாற்றினீர்’ என்றும் மொழிபெயர்க்கலாம்; எபிரேய வினைச்சொல் விடுதலைச் செயலால் ஒருவரை மீட்பதை உணர்த்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵם
  choice: ஆனால் அவர்கள்
  rationale: முந்தைய வசனங்களில் கூறப்பட்ட பாவம் மற்றும் சிதறடிப்பு இருந்தபோதிலும் அவர்கள் இன்னும் இறைவனுக்குரியவர்கள் என்பதை வலியுறுத்தும் மிதமான எதிர்நிலைத் தொடர்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: עֲבָדֶיךָ
  choice: உமது ஊழியர்கள்
  rationale: עבד என்பதற்கு அடிமை என்றும் பொருள் வரலாம்; இங்கு சமூக அடிமைநிலையைவிட இறைவனுடனான உடன்படிக்கைச் சார்பும் சேவையும் முன்னிலையில் இருப்பதால் ‘ஊழியர்கள்’ பொருத்தமானது.
- source_word: וְעַמֶּךָ
  choice: உமது மக்கள்
  rationale: עם என்பது இங்கு இறைவனுக்குரிய உடன்படிக்கைச் சமூகத்தைத் தொகுதியாகக் குறிக்கிறது; உடைமைப் பொருள் தெளிவாகப் பேணப்பட்டுள்ளது.
- source_word: פָּדִיתָ
  choice: மீட்டீர்
  rationale: פדה என்பது விடுதலை செய்து மீட்பதைக் குறிக்கிறது. ‘மீட்டீர்’ யாத்திராகமத்தை நினைவூட்டும் உடன்படிக்கை சார்ந்த பொருள் செறிவைப் பேணுகிறது; பிற்காலக் கோட்பாட்டு விவரங்களைத் திணிப்பதில்லை.
- source_word: בכחך הגדול
  choice: உமது மாபெரும் வல்லமையால்
  rationale: כח குறிக்கும் சக்தி அல்லது ஆற்றலை ‘வல்லமை’ கண்ணியமான, இயல்பான தமிழில் தெரிவிக்கிறது; -ஆல் செயலை நிகழ்த்திய வழிமுறையை வெளிப்படுத்துகிறது.
- source_word: ובידך החזקה
  choice: உமது வலிமைமிக்க கரத்தால்
  rationale: ‘வலிமைமிக்க கரம்’ என்பது இறைவனுடைய ஆற்றல்மிக்க செயலைக் குறிக்கும் எபிரேய உருவகத்தைத் தமிழில் தெளிவாகப் பேணுகிறது.
theological_decisions:
- issue: நெகேமியாவின் ஜெபத்திலுள்ள மீட்பு மொழி
  choice: மீட்டீர்
  alternative: விடுவித்தீர் / மீட்புவிலை கொடுத்து விடுவித்தீர்
  rationale: இந்தச் சொல் இறைவனுடைய வரலாற்றுச் சிறப்புமிக்க உடன்படிக்கை விடுதலையை, குறிப்பாக யாத்திராகமச் சொல்லாட்சியை, எதிரொலிக்கிறது. ‘மீட்டீர்’ அந்த இறையியல் கனத்தைப் பேணுவதோடு மூலத்தில் வெளிப்படையாக இல்லாத பிற்காலக் கோட்பாட்டு நுணுக்கங்களைச் சேர்ப்பதில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், ஜெபத்திற்குரிய கண்ணியத்தைப் பேண ‘உமது’, ‘மீட்டீர்’ ஆகிய மரியாதை வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன. வாக்கியம் சாதாரண வாசகருக்குத் தெளிவாகவும் எபிரேய உருவகமான ‘வலிமைமிக்க கரம்’ மாறாமலும் அமைக்கப்பட்டுள்ளது.
