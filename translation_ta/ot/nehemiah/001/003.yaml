  register: நவீன பொதுத்தமிழில் கண்ணியமான வரலாற்று-விவரிப்பு நடை பயன்படுத்தப்பட்டுள்ளது. ‘மாகாணம்,’ ‘மதில்,’ ‘வாயில்கள்’ ஆகிய சொற்கள் பாரசீகக் கால நிர்வாக மற்றும் நகர அரண் சூழலைத் தெளிவாகக் காட்டுகின்றன. மூலத்தில் உள்ள שׁאר வேர்ச்சொல்லின் மீள்வருகை ‘மீந்து ... எஞ்சியிருப்பவர்கள்’ என ஓரளவு பாதுகாக்கப்பட்டுள்ளது.
