  text: וַ/יֹּאמְרוּ֮ לִ/י֒ הַֽ/נִּשְׁאָרִ֞ים אֲשֶֽׁר נִשְׁאֲר֤וּ מִן הַ/שְּׁבִי֙ שָׁ֣ם בַּ/מְּדִינָ֔ה בְּ/רָעָ֥ה גְדֹלָ֖ה וּ/בְ/חֶרְפָּ֑ה וְ/חוֹמַ֤ת יְרוּשָׁלִַ֨ם֙ מְפֹרָ֔צֶת וּ/שְׁעָרֶ֖י/הָ נִצְּת֥וּ בָ/אֵֽשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/001/003.yaml
  text: And they said to me[a], “The remnant there in the province who survived the captivity are in great trouble and disgrace, and the wall of Jerusalem is broken down[b], and its gates have been burned with fire.”
translation:
  language: ta
  text: அவர்கள் என்னிடம், “சிறையிருப்பிலிருந்து[a] மீந்து, அங்கே மாகாணத்தில் எஞ்சியிருப்பவர்கள் மிகுந்த துன்பத்திலும் அவமானத்திலும் இருக்கிறார்கள். எருசலேமின் மதில் உடைக்கப்பட்டுக் கிடக்கிறது; அதன் வாயில்கள் தீயால் எரிக்கப்பட்டுள்ளன” என்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது “நாடுகடத்தலிலிருந்து.” எபிரெயச் சொற்றொடரை “சிறையிருப்பிலிருந்து” அல்லது “நாடுகடத்தலிலிருந்து” என்று மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנִּשְׁאָרִים / נִשְׁאֲרוּ
  choice: மீந்து ... எஞ்சியிருப்பவர்கள்
  rationale: שׁאר என்பதன் தொடர்புடைய இரு வடிவங்களின் மீள்வருகையை இயன்றவரைத் தக்கவைத்து, பேரழிவுக்குப் பின் உயிர்தப்பி எஞ்சியவர்களைக் குறிக்கும் இயல்பான தமிழாக அளிக்கிறது.
- source_word: מִן הַשְּׁבִי
  choice: சிறையிருப்பிலிருந்து
  rationale: שְׁבִי என்பது இங்கு சிறைப்பட்ட அல்லது நாடுகடத்தப்பட்ட நிலையைக் குறிக்கிறது. ‘சிறையிருப்பு’ மூலத்தின் பெயர்ச்சொல் வடிவத்தையும் வரலாற்றுச் சூழலையும் தெளிவாகக் காட்டுகிறது; ‘நாடுகடத்தல்’ என்பதும் சாத்தியம் என்பதால் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: בַּמְּדִינָה
  choice: அந்த மாகாணத்தில்
  rationale: பாரசீக ஆட்சிக்கால நிர்வாகப் பிரிவைக் குறிக்கும் מְדִינָה என்பதற்கு ‘மாகாணம்’ பொருத்தமான வரலாற்றுச் சமச்சீர்.
- source_word: בְּרָעָה גְדֹלָה
  choice: மிகுந்த துன்பத்தில்
  rationale: רָעָה இங்கு ஒழுக்கத் தீமையை அல்ல, கடுமையான இடரையும் அவலநிலையையும் குறிக்கிறது.
- source_word: וּבְחֶרְפָּה
  choice: அவமானத்தில்
  rationale: חֶרְפָּה பொதுமக்கள் முன் ஏற்படும் இழிவையும் பழிப்பையும் குறிக்கிறது; ‘அவமானம்’ இதைத் தெளிவான நவீன தமிழில் எடுத்துரைக்கிறது.
- source_word: חוֹמַת יְרוּשָׁלִַם
  choice: எருசலேமின் மதில்
  rationale: ஒருமை வடிவம் நகரைச் சுற்றிய அரண் மதிலைத் தொகுதியாகக் குறிப்பிடுகிறது.
- source_word: מְפֹרָצֶת
  choice: உடைக்கப்பட்டுக் கிடக்கிறது
  rationale: פרץ என்பதன் செயல்பாட்டு இடைநிலை வடிவம் மதில் உடைக்கப்பட்டதால் ஏற்பட்ட நிலை தொடர்வதைச் சுட்டுகிறது. இத்தமிழாக்கம் செயப்பாட்டு அர்த்தத்தையும் தற்போதைய சிதைந்த நிலையையும் தக்கவைக்கிறது.
- source_word: וּשְׁעָרֶיהָ נִצְּתוּ בָאֵשׁ
  choice: அதன் வாயில்கள் தீயால் எரிக்கப்பட்டுள்ளன
  rationale: கடந்தகால எரிப்பின் விளைவாக வாயில்கள் அழிந்த நிலையில் இருப்பதைத் தெளிவுபடுத்தி, ‘தீயால்’ என்ற எபிரெய வெளிப்பாட்டையும் தக்கவைக்கிறது.
- source_word: וַיֹּאמְרוּ לִי
  choice: அவர்கள் என்னிடம் ... என்றார்கள்
  rationale: கூடுதல் விளக்க நுணுக்கம் சேர்க்காமல் எளிய கதைத் தொடரை இயல்பான தமிழ் மேற்கோள் அமைப்பில் வழங்குகிறது.
