  yaml_path: translation/ot/nehemiah/001/002.yaml
  text: Hanani[a], one of my brothers, came—he and some men from Judah—and I asked them about the Jews who had escaped, who were left from the captivity[c][b], and about Jerusalem.
translation:
  language: ta
  text: என் சகோதரர்களில் ஒருவனான அனானியும் யூதாவிலிருந்து வந்த சில மனிதர்களும் வந்தார்கள். சிறையிருப்பிலிருந்து தப்பிப் பிழைத்து எஞ்சியிருந்த யூதர்களைப்[a] பற்றியும் எருசலேமைப் பற்றியும் அவர்களிடம் விசாரித்தேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘யூதா நாட்டினரை’ என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் யூதா மக்களையோ, இன்னும் விரிவாக யூத மக்களையோ குறிக்கலாம். ‘தப்பிப் பிழைத்து எஞ்சியிருந்த’ என்பதற்கு ‘தப்பிப் பிழைத்தவர்கள்’ அல்லது ‘மீதியானவர்கள்’ என்றும், ‘சிறையிருப்பிலிருந்து’ என்பதற்கு ‘நாடுகடத்தலிலிருந்து’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: வந்தான்
  rationale: בוא என்பதன் தொடர்கதை வடிவம் கடந்தகால வருகையை எளிமையாகக் குறிக்கிறது; நவீன தமிழில் ‘வந்தான்’ இயல்பான இணை.
- source_word: חֲנָנִי
  choice: அனானி
  rationale: எபிரெய தனிப்பெயர் தமிழின் வழக்கமான வேதாகம ஒலிபெயர்ப்பு மரபுக்கு ஏற்ப வழங்கப்பட்டது.
- source_word: אֶחָד מֵאַחַי הוּא
  choice: என் சகோதரர்களில் ஒருவனான
  rationale: சொற்றொடரின் குடும்ப உறவுப் பொருளை நேரடியாகப் பாதுகாக்கிறது; ‘உறவினன்’ என்பது மூலத்தைவிடப் பரந்தது.
- source_word: וַאֲנָשִׁים מִיהוּדָה
  choice: யூதாவிலிருந்து வந்த சில மனிதர்களுடன்
  rationale: அனானியுடன் வந்த தோழர்களையும் அவர்கள் வந்த இடத்தையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது; எபிரெயில் எண்ணிக்கை குறிப்பிடப்படாததால் ‘சில’ என்பது வரையறுக்காத பன்மையைச் சுட்டுகிறது.
- source_word: וָאֶשְׁאָלֵם
  choice: அவர்களிடம் விசாரித்தேன்
  rationale: שׁאל இங்கு தகவல் கேட்டறிவதைக் குறிக்கிறது; ‘விசாரித்தேன்’ சூழலுக்கேற்ற இயல்பான தமிழ்.
- source_word: הַיְּהוּדִים
  choice: யூதர்களை
  rationale: பாரசீகக் காலச் சூழலில் יהודים யூதா மக்களையோ விரிவாக யூத மக்களையோ குறிக்கலாம்; இங்கு வழக்கமான பரந்த மக்கள் பெயரான ‘யூதர்கள்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: הַפְּלֵיטָה אֲשֶׁר נִשְׁאֲרוּ
  choice: தப்பி எஞ்சியிருந்த
  rationale: הפליטה என்பதின் தப்பிப் பிழைத்தோர் பொருளையும் נשארו என்பதின் எஞ்சிய நிலை பொருளையும் தனித்தனியாகப் பாதுகாக்கிறது.
- source_word: מִן הַשֶּׁבִי
  choice: சிறையிருப்பிலிருந்து
  rationale: שׁבי சிறையிருப்பு அல்லது நாடுகடத்தல் நிலையைக் குறிக்கக்கூடும்; பெயர்ச்சொல் வடிவத்தையும் வரலாற்றுச் சூழலையும் ‘சிறையிருப்பு’ நெருக்கமாகக் காட்டுகிறது.
- source_word: וְעַל יְרוּשָׁלִָם
  choice: எருசலேமைப் பற்றியும்
  rationale: முந்தைய עַל உடன் இணையான இரண்டாம் விசாரணைப் பொருளைத் தெளிவாகக் காட்டுகிறது.
