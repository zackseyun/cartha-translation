  edition: WLC
  text: דִּבְרֵ֥י נְחֶמְיָ֖ה בֶּן חֲכַלְיָ֑ה וַ/יְהִ֤י בְ/חֹֽדֶשׁ כסלו שְׁנַ֣ת עֶשְׂרִ֔ים וַ/אֲנִ֥י הָיִ֖יתִי בְּ/שׁוּשַׁ֥ן הַ/בִּירָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/001/001.yaml
  text: The words of Nehemiah son of Hacaliah[a]. Now it happened in the month of Kislev, in the twentieth year, while I was in Susa the citadel[c][b],
translation:
  language: ta
  text: 'அகலியாவின் மகன் நெகேமியாவின் வார்த்தைகள்[a]. இருபதாம் ஆண்டில்[b], கிஸ்லேவ் மாதத்தில், நான் சூசான் அரண்கோட்டையில்[c] இருந்தபோது இவ்வாறு நிகழ்ந்தது:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அகலியாவின் மகன் நெகேமியாவின் விவரிப்பு.” “வார்த்தைகள்” என்ற எபிரெயத் தலைப்பு ஒரு நினைவுக்குறிப்பையோ நிகழ்ச்சிப் பதிவையோ அறிமுகப்படுத்தலாம்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில், “இருபதாம் ஆண்டில்.” இது யாருடைய ஆட்சியாண்டு என்பதை இவ்வசனம் வெளிப்படையாகக் கூறவில்லை; பின்னருள்ள சூழல் அர்த்தசஷ்டா அரசனைக் குறிப்பிடுகிறது.
    reason: cultural_note
  - marker: c
    text: அல்லது, “சூசான் கோட்டையில்.” எபிரெயச் சொல் பாதுகாப்புமிக்க அரச வளாகத்தைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: דִּבְרֵי
  choice: வார்த்தைகள்
  rationale: எபிரெயத் தலைப்பின் நேரடியான வடிவத்தைத் தக்கவைக்கிறது; அதேவேளையில் இது ஒருவரின் விவரிப்பு அல்லது நினைவுக்குறிப்பையும் அறிமுகப்படுத்தக்கூடும் என்பதை அடிக்குறிப்பு விளக்குகிறது.
- source_word: נְחֶמְיָה בֶּן חֲכַלְיָה
  choice: அகலியாவின் மகன் நெகேமியா
  rationale: தனிப்பெயர்கள் தமிழில் ஒலிபெயர்க்கப்பட்டு, בֶּן என்பதன் உறவு இயல்பான நவீனத் தமிழில் சொல்லப்பட்டுள்ளது.
- source_word: וַיְהִי
  choice: இவ்வாறு நிகழ்ந்தது
  rationale: கதை தொடங்கும் எபிரெயச் சொற்றொடரின் நிகழ்வுத் தன்மையைப் பாதுகாக்கிறது; அடுத்த வசனத்தில் வரும் நிகழ்ச்சியுடன் இணைவதைக் காட்ட இருபுள்ளி பயன்படுத்தப்பட்டுள்ளது.
- source_word: בְחֹדֶשׁ כִּסְלֵו
  choice: கிஸ்லேவ் மாதத்தில்
  rationale: எபிரெய மாதப்பெயரை ஒலிபெயர்த்து, தேதி குறிப்பிடும் சொற்றொடரை இயல்பான தமிழில் வழங்குகிறது.
- source_word: שְׁנַת עֶשְׂרִים
  choice: இருபதாம் ஆண்டில்
  rationale: யாருடைய ஆட்சியாண்டு என்பது இவ்வசனத்தில் கூறப்படாததால் அதைச் சேர்க்காமல் மூலத்தின் தெளிவின்மையைப் பாதுகாக்கிறது.
- source_word: וַאֲנִי הָיִיתִי
  choice: நான் ... இருந்தபோது
  rationale: அடுத்த நிகழ்வுக்கான காலச் சூழலை இயல்பான தமிழில் காட்டுகிறது.
- source_word: בְשׁוּשַׁן
  choice: சூசான்
  rationale: எபிரெய இடப்பெயரின் தமிழுக்கு ஏற்ற ஒலிபெயர்ப்பு.
- source_word: הַבִּירָה
  choice: அரண்கோட்டை
  rationale: அரச மாளிகையையும் உள்ளடக்கிய பாதுகாப்புமிக்க கோட்டை வளாகம் என்ற சொல்லின் பொருளைச் சுருக்கமாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: ‘இருபதாம் ஆண்டு’ யாருடையது என்பது
  choice: அரசரின் பெயரை முதன்மைப் பனுவலில் சேர்க்கவில்லை
  alternative: அர்த்தசஷ்டாவின் இருபதாம் ஆண்டு
  rationale: இந்த வசனம் ஆட்சியாளரின் பெயரை வெளிப்படையாகக் கூறவில்லை; பின்னணியிலிருந்து கிடைக்கும் அடையாளத்தை இங்கே முன்கூட்டியே புகுத்தாமல் மூலத்தின் தெளிவின்மையைத் தக்கவைக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், மரியாதையும் வாசிப்புத் தெளிவும் கொண்ட நடை பயன்படுத்தப்பட்டுள்ளது. தலைப்பிலுள்ள எபிரெய மரபுத்தொடர் முதன்மைப் பனுவலில் நெருக்கமாகப் பாதுகாக்கப்பட்டு, அதன் விரிவான பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது. வசனம் அடுத்த வசனத்துடன் இலக்கண ரீதியாகத் தொடர்வதால் இறுதியில் இருபுள்ளி இடப்பட்டுள்ளது.
