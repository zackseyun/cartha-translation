  source_fidelity: மூல எபிரெயத்தின் தலைப்புச் சொற்றொடரான „நெகேமியாவின் வார்த்தைகள்“ தக்கவைக்கப்பட்டுள்ளது. தந்தைப் பெயருடனான அடையாளம், கிஸ்லேவ் மாதம், குறிப்பிடப்படாத „இருபதாம் ஆண்டு“, சூசான், மற்றும் בִּירָה என்பதன் அரண்கோட்டை/அரச வளாகப் பொருள் ஆகியவை உண்மையாகச் செலுத்தப்பட்டுள்ளன. „இருபதாம் ஆண்டு“ யாருடைய ஆட்சியாண்டு என்பதை முதன்மைப் பனுவல் நிரப்பவில்லை.
