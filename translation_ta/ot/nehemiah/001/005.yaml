  text: וָ/אֹמַ֗ר אָֽנָּ֤א יְהוָה֙ אֱלֹהֵ֣י הַ/שָּׁמַ֔יִם הָ/אֵ֥ל הַ/גָּד֖וֹל וְ/הַ/נּוֹרָ֑א שֹׁמֵ֤ר הַ/בְּרִית֙ וָ/חֶ֔סֶד לְ/אֹהֲבָ֖י/ו וּ/לְ/שֹׁמְרֵ֥י מִצְוֺתָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/001/005.yaml
  text: And I said[a], “Please, O Yahweh, God of heaven, the great and awesome God[b], who keeps the covenant and steadfast love for those who love him and keep his commandments,”
translation:
  language: ta
  text: 'நான் சொன்னேன்: “தயவுசெய்து, வானத்தின் கடவுளாகிய யாவே, மகத்தானவரும் பயபக்தியைத் தூண்டுகிறவருமான கடவுளே[a], உம்மை நேசித்து உமது கட்டளைகளைக் கடைப்பிடிக்கிறவர்களுக்காக உடன்படிக்கையையும் மாறாத அன்பையும்[b] காத்துவருகிறவரே!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மகத்தானவரும் அச்சத்திற்குரியவருமான கடவுளே!”
    reason: נוֹרָא என்பது பயபக்தியைத் தூண்டும் தன்மையையும் அச்சத்திற்குரிய தன்மையையும் குறிக்கலாம்.
  - marker: b
    text: அல்லது, “உடன்படிக்கையையும் உடன்படிக்கைப் பற்றுறுதியையும்.”
    reason: חֶסֶד என்பது இச்சூழலில் மாறாத அன்பு, பற்றுறுதி, உடன்படிக்கை விசுவாசம் ஆகிய தொடர்புடைய கருத்துகளைத் தாங்குகிறது.
lexical_decisions:
- source_word: וָאֹמַר
  choice: நான் சொன்னேன்
  rationale: வழக்கமான தொடர் வினை வடிவம் நெகேமியாவின் ஜெப உரையை அறிமுகப்படுத்துகிறது; தமிழில் இயல்பாகவும் தொடர்ச்சியை மிகையாக விளக்காமலும் உள்ளது.
- source_word: אָֽנָּא
  choice: தயவுசெய்து கேளும்
  rationale: மன்றாட்டின் பணிவான தொனியைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது. ‘தயவுசெய்து’ மட்டும் அடுத்த வசனத்துடன் இணையும் போது தொங்குவதால், ஜெபச் சூழலில் உள்ளடங்கிய வேண்டுதலை ‘கேளும்’ தெளிவாக்குகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைத் திருப்பெயரான நான்கெழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: אֱלֹהֵי הַשָּׁמַיִם
  choice: வானத்தின் கடவுள்
  rationale: எபிரெயக் கட்டமைப்பின் பொருளை நவீனத் தமிழில் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: הָאֵל הַגָּדוֹל וְהַנּוֹרָא
  choice: மகத்தானவரும் பயபக்தியைத் தூண்டுகிறவருமான கடவுள்
  rationale: גָּדוֹל என்பதன் ‘மகத்தான’ பொருளையும் נוֹרָא குறிக்கும் அச்சம் கலந்த வியப்பையும் காக்கிறது; வெறும் பயங்கரத்தன்மையாக மாற்றவில்லை.
- source_word: שֹׁמֵר
  choice: காத்துவருகிறவர்
  rationale: தொடர்ந்து உண்மையுடன் கடைப்பிடித்தல் என்ற பங்கேற்பு வினையின் பண்பை வெளிப்படுத்துகிறது.
- source_word: הַבְּרִית
  choice: உடன்படிக்கை
  rationale: வேதாகம எபிரெய மொழியின் உறவு மற்றும் பொறுப்பு சார்ந்த முறையான கருத்தைத் தக்கவைக்கிறது.
- source_word: חֶסֶד
  choice: மாறாத அன்பு
  rationale: உடன்படிக்கைச் சூழலில் உள்ள உறுதியான, விசுவாசமுள்ள அன்பை எளிதில் புரியும் தமிழில் தருகிறது.
- source_word: לְאֹהֲבָיו וּלְשֹׁמְרֵי מִצְוֺתָיו
  choice: உம்மை நேசித்து உமது கட்டளைகளைக் கடைப்பிடிக்கிறவர்களுக்காக
  rationale: இரு இணையான பங்கேற்பு சொற்றொடர்களையும் ஒரே மக்கள் குழுவைக் குறிக்கும் இயல்பான தமிழில் இணைக்கிறது; இரண்டின் நிபந்தனைத் தன்மையையும் காக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைத் திருப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: ஆண்டவர்; யெகோவா
  rationale: மூலத்தில் தனிப்பட்ட உடன்படிக்கைப் பெயர் நேரடியாக இருப்பதால், அதை பொதுப் பட்டமாக மாற்றாமல் ஒலிபெயர்த்துள்ளது.
- issue: חֶסֶד என்ற உடன்படிக்கைச் சொல்லின் பொருள்
  choice: மாறாத அன்பு
  alternative: உடன்படிக்கை விசுவாசம்; பேரன்பு; இரக்கம்
  rationale: בְּרִית என்பதுடன் இணைந்திருப்பதால் உறுதியான அன்பும் பற்றுறுதியும் இரண்டும் ஒலிக்க வேண்டும்; ஆயினும் முதன்மை உரையில் மிகத் தொழில்நுட்பமான சொற்றொடரைத் தவிர்க்கிறது.
- issue: נוֹרָא குறிக்கும் பயமும் வியப்பும்
  choice: பயபக்தியைத் தூண்டுகிறவர்
  alternative: அச்சத்திற்குரியவர்; அச்சமூட்டுகிறவர்
  rationale: இச்சொல் கடவுள் பயத்தை உண்டாக்குகிறவர் என்பதைக் குறிக்கிறது; அதை கொடூரம் என்றோ சாதாரண பாராட்டு என்றோ சுருக்காமல் பயம் கலந்த வியப்பைத் தக்கவைக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதைமிக்க நேரடி ஜெப நடையில் வடிவமைக்கப்பட்டது. ‘உம்மை/உமது’ என்பது தெய்வத்தை நோக்கிய ஒருமை மரியாதையையும் தெளிவான தொடர்பையும் காக்கிறது. வசனம் அடுத்த வசனத்தில் தொடரும் ஜெபத்தின் தொடக்கமாக இருப்பினும், தமிழில் வாசிக்கத்தக்க அழைப்புத் தொடராக அமைக்கப்பட்டுள்ளது.
