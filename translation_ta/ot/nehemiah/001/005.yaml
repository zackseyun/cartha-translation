    issue: Added imperative ‘கேளும்’
    rationale: אָנָּא is an entreaty particle (‘please,’ ‘I pray’) and does not contain the verb ‘hear.’ Although such wording is idiomatic in some Tamil prayers, it introduces content not expressed in this verse.
