base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/001/009.yaml
  text: but if you return to me and keep my commandments and do them[a], though your outcasts are at the end of the heavens, from there I will gather them and bring them to the place that I have chosen[c][b], to make my name dwell there.
translation:
  language: ta
  text: ஆனால் நீங்கள் என்னிடம் திரும்பி, என் கட்டளைகளைக் கடைப்பிடித்து அவற்றின்படி நடந்தால், உங்களில் துரத்தப்பட்டவர்கள்[a] வானங்களின் கடைக்கோடியில் இருந்தாலும்[b], அங்கிருந்து அவர்களை நான் ஒன்றுகூட்டி, என் பெயர் அங்கே குடியிருக்கும்படி நான் தேர்ந்தெடுத்த இடத்துக்கு அவர்களைக் கொண்டுவருவேன்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது: ‘உங்களில் நாடுகடத்தப்பட்டவர்கள்’ அல்லது ‘உங்களில் சிதறடிக்கப்பட்டவர்கள்.’'
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில், ‘வானங்களின் கடைக்கோடியில்’; இது எட்டக்கூடிய மிகத் தொலைவைக் குறிக்கும் மரபுத்தொடர்.
    reason: cultural_note
  - marker: c
    text: 'அல்லது: ‘என் பெயரை அங்கே நிலைநிறுத்தும்படி.’ தேர்ந்தெடுக்கப்பட்ட இடத்தில் இறைவனுடைய பெயர் குடியிருக்கும் என்ற படிமத்தை எபிரெயம் கொண்டுள்ளது.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְשַׁבְתֶּם אֵלַי
  choice: ஆனால் நீங்கள் என்னிடம் திரும்பி
  rationale: שׁוּב + אֶל என்பது ‘ஒருவரிடம் திரும்புதல்’ என்ற பொருளைத் தருகிறது. முந்தைய வசனத்தின் நிபந்தனை அமைப்பு இங்கும் தொடர்வதால், தமிழில் ‘ஆனால்’ என்பதுடன் நிபந்தனை வாக்கியமாக அமைக்கப்பட்டுள்ளது.
- source_word: וּשְׁמַרְתֶּם מִצְוֺתַי וַעֲשִׂיתֶם אֹתָם
  choice: என் கட்டளைகளைக் கடைப்பிடித்து அவற்றின்படி நடந்தால்
  rationale: שׁמר என்பது கட்டளைகளைக் கவனமாகக் கடைப்பிடிப்பதையும், עשׂה என்பது அவற்றை நடைமுறையில் செய்வதையும் குறிக்கின்றன. ‘கடைப்பிடித்து… நடந்தால்’ என்பது இரு கூறுகளையும் இயல்பான தமிழில் வேறுபடுத்திக் காட்டுகிறது.
- source_word: נִדַּחֲכֶם
  choice: உங்களில் துரத்தப்பட்டவர்கள்
  rationale: נדח என்ற சொல் விரட்டப்பட்ட, நாடுகடத்தப்பட்ட அல்லது சிதறடிக்கப்பட்ட மக்களைக் குறிக்கலாம். ‘துரத்தப்பட்டவர்கள்’ அதன் செயப்பாட்டு உணர்வையும் நாடுகடத்தல் சூழலையும் தக்கவைக்கிறது.
- source_word: בִּקְצֵה הַשָּׁמַיִם
  choice: வானங்களின் கடைக்கோடியில்
  rationale: எபிரெயச் சொற்றொடரின் விண்ணுலகப் படிமத்தையும், எட்டக்கூடிய மிகத் தொலைவைக் குறிக்கும் மரபுத்தொடரையும் தக்கவைக்கும் ஒப்பளவில் நேரடியான மொழிபெயர்ப்பு.
- source_word: מִשָּׁם אֲקַבְּצֵם
  choice: அங்கிருந்து அவர்களை நான் ஒன்றுகூட்டி
  rationale: קבץ என்பது சிதறிய மக்களை மீண்டும் ஒன்றுசேர்ப்பதற்கான வழக்கமான வினைச்சொல். ‘ஒன்றுகூட்டி’ மறுசேர்ப்பின் கருத்தைத் தெளிவாகத் தருகிறது.
- source_word: וַהֲבֹאתִים
  choice: அவர்களைக் கொண்டுவருவேன்
  rationale: בוא என்பதன் காரணவினை வடிவம் இயல்பான தமிழில் ‘கொண்டுவருதல்’ என்று வழங்கப்படுகிறது.
- source_word: הַמָּקוֹם אֲשֶׁר בָּחַרְתִּי
  choice: நான் தேர்ந்தெடுத்த இடம்
  rationale: בחר இங்கு வழிபாட்டிடத்தை இறைவன் தேர்ந்தெடுத்ததைக் குறிக்கிறது; எளிய இறந்தகால வடிவம் தமிழில் அதன் தொடர்ந்த முக்கியத்துவத்தை இயல்பாக உணர்த்துகிறது.
- source_word: לְשַׁכֵּן אֶת שְׁמִי שָׁם
  choice: என் பெயரை அங்கே குடியிருக்கச் செய்வதற்காக
  rationale: שׁכן என்பதன் காரணவினை வடிவத்தையும், தேர்ந்தெடுக்கப்பட்ட இடத்தில் இறைவனுடைய பெயர் ‘குடியிருக்கும்’ என்ற இணைச்சட்டப் படிமத்தையும் இந்த மொழிபெயர்ப்பு பாதுகாக்கிறது.
theological_decisions:
- issue: தேர்ந்தெடுக்கப்பட்ட இடத்தில் இறைவனுடைய பெயர் குடியிருக்கும் என்னும் பிரசன்னச் சூத்திரம்
  choice: என் பெயரை அங்கே குடியிருக்கச் செய்வதற்காக
  alternative: என் பெயரை அங்கே நிலைநிறுத்துவதற்காக
  rationale: மூல எபிரெயம் இறைவனுடைய பெயர் தேர்ந்தெடுக்கப்பட்ட இடத்தில் ‘குடியிருக்கும்’ என்ற படிமத்தைப் பயன்படுத்துகிறது. இதைத் தக்கவைப்பது, அந்த இடத்துடன் இறைவன் தமது பெயரை இணைப்பதையும் அதேவேளையில் அவரது இருப்பு அந்த இடத்துக்குள் மட்டுப்படுத்தப்படவில்லை என்பதையும் விளக்காமல் திறந்த நிலையில் வைத்திருக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், மரியாதையும் வேதாகமச் செறிவும் கொண்ட நடை பயன்படுத்தப்பட்டுள்ளது. ‘கடைக்கோடி’, ‘ஒன்றுகூட்டி’, ‘குடியிருக்கச் செய்வது’ ஆகியவை மூலத்தின் படிமங்களைப் பாதுகாக்கின்றன; அரிதான சமயக் கலைச்சொற்கள் தவிர்க்கப்பட்டுள்ளன.
