  text: וַ/יְהִ֞י כְּ/שָׁמְעִ֣/י אֶת הַ/דְּבָרִ֣ים הָ/אֵ֗לֶּה יָשַׁ֨בְתִּי֙ וָֽ/אֶבְכֶּ֔ה וָ/אֶתְאַבְּלָ֖/ה יָמִ֑ים וָֽ/אֱהִ֥י צָם֙ וּ/מִתְפַּלֵּ֔ל לִ/פְנֵ֖י אֱלֹהֵ֥י הַ/שָּׁמָֽיִם׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/001/004.yaml
  text: And when I heard these words[a], I sat down and wept and mourned for days[b], and I was fasting and praying before the God of heaven.
translation:
  language: ta
  text: இந்தச் செய்திகளை[a] நான் கேட்டபோது, உட்கார்ந்து அழுதேன்; நாட்களாகத் துக்கம் அனுசரித்தேன். பரலோகத்தின் கடவுளின் முன்னிலையில் உபவாசித்து மன்றாடிக்கொண்டிருந்தேன்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘இந்த வார்த்தைகளை’ அல்லது ‘இந்தக் காரியங்களை’ என்றும் மொழிபெயர்க்கலாம். எபிரெய דְּבָרִים என்பதற்கு ‘வார்த்தைகள்,’ ‘விஷயங்கள்,’ ‘காரியங்கள்’ ஆகிய பொருள்கள் உண்டு.
    reason: lexical_alternative
  - marker: b
    text: ‘உபவாசித்து மன்றாடினேன்’ என்றும் எளிமையாக மொழிபெயர்க்கலாம். ஆனால் היה என்பதுடன் வரும் வினையெச்ச வடிவங்கள், இச்செயல்கள் தொடர்ந்துகொண்டிருந்ததை உணர்த்துகின்றன.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כְּשָׁמְעִי
  choice: நான் கேட்டபோது
  rationale: היה உடன் כְּ + infinitive construct அமைந்த இக்கதைத் தொடர் காலச்சூழலைக் குறிக்கிறது. தமிழில் இயல்பாகவும் வரிசையைத் தெளிவாகவும் காட்ட ‘நான் கேட்டபோது’ என மொழிபெயர்க்கப்பட்டது.
- source_word: הַדְּבָרִים הָאֵלֶּה
  choice: இந்தச் செய்திகளை
  rationale: דְּבָרִים என்பதற்கு ‘சொற்கள்,’ ‘காரியங்கள்,’ ‘விஷயங்கள்’ எனப் பல பொருள்கள் உண்டு. முந்தைய வசனங்களில் அறிவிக்கப்பட்ட தகவலின் உள்ளடக்கத்தையே இங்கு குறிக்கும் என்பதால் ‘செய்திகளை’ என்பது இயல்பான சூழல்சார் தெரிவு; மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டது.
- source_word: יָשַׁבְתִּי
  choice: உட்கார்ந்து
  rationale: יָשַׁב என்பதன் அடிப்படைப் பொருள் ‘உட்கார்.’ அதிர்ச்சிக்கும் துயரத்துக்கும் உடனான உடல் எதிர்வினையை நேரடியாகக் காட்டுகிறது.
- source_word: וָאֶבְכֶּה
  choice: அழுதேன்
  rationale: בכה என்பது கண்ணீர்விட்டு அழுவதைக் குறிக்கும் இயல்பான வினை. நவீனத் தமிழில் தெளிவாகவும் கண்ணியமாகவும் ‘அழுதேன்’ என வழங்கப்பட்டது.
- source_word: וָאֶתְאַבְּלָה יָמִים
  choice: பல நாட்கள் துக்கம் அனுசரித்தேன்
  rationale: אבל நீடித்த துக்கம் அல்லது துக்க அனுசரிப்பைக் குறிக்கிறது; יָמִים காலநீட்சியைக் காட்டுகிறது. தமிழில் ‘பல நாட்கள்’ என்பது குறிப்பிடப்படாத பன்மை காலத்தை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וָאֱהִי צָם וּמִתְפַּלֵּל
  choice: உபவாசித்து மன்றாடிக்கொண்டிருந்தேன்
  rationale: היה உடன் வரும் இரு participle-களும் தொடர்ந்துகொண்டிருந்த செயலைக் காட்டுகின்றன. ‘கொண்டிருந்தேன்’ அந்த நீடித்த தன்மையைத் தமிழில் பாதுகாக்கிறது; מִתְפַּלֵּל இச்சூழலில் கடவுளை நோக்கி விண்ணப்பிப்பதைச் சுட்டுவதால் ‘மன்றாடி’ எனப்பட்டது.
- source_word: לִפְנֵי
  choice: முன்பாக
  rationale: לִפְנֵי என்பது ‘முன்’ அல்லது ‘சந்நிதியில்’ என்னும் உறவுப் பொருளைக் கொண்டது. ‘முன்பாக’ மூலத்தின் உருவகத்தையும் தமிழ் ஜெப மொழியின் இயல்பையும் காக்கிறது.
- source_word: אֱלֹהֵי הַשָּׁמָיִם
  choice: பரலோகத்தின் கடவுள்
  rationale: இது எஸ்றா–நெகேமியாவில் காணப்படும் இறைப்பட்டம். ‘பரலோகத்தின் கடவுள்’ என்பது பெயர்ச்சொல் இணைப்பை நேரடியாகவும் இயல்பாகவும் தருகிறது; இங்கு இல்லாத யெகோவா என்ற உடன்படிக்கைப் பெயர் சேர்க்கப்படவில்லை.
theological_decisions:
- issue: אֱלֹהֵי הַשָּׁמָיִם என்ற இறைப்பட்டம்
  choice: பரலோகத்தின் கடவுள்
  alternative: வானங்களின் கடவுள்
  rationale: שָׁמַיִם எபிரெயத்தில் வடிவியல் பன்மையாக இருந்தாலும், இவ்விறைப்பட்டத்தில் கடவுளின் மேலுலக ஆட்சியைக் குறிக்கிறது. நவீனத் தமிழில் வழக்கமான ‘பரலோகம்’ என்பதைப் பயன்படுத்துவது பொருளைத் தெளிவாகத் தருகிறது; மூலத்தில் இல்லாத தனிப்பட்ட இறைப்பெயர் சேர்க்கப்படவில்லை.
- issue: துக்கம், உபவாசம், மன்றாட்டு ஆகியவற்றின் தொடர்பு
  choice: தனித்தனியாக இருந்தாலும் தொடர்ச்சியான செயல்களாக மொழிபெயர்த்தல்
  alternative: அனைத்தையும் ஒரே சடங்குசார் செயல் என இணைத்தல்
  rationale: எபிரெய வினைத் தொடர் நெகேமியாவின் எதிர்வினைகளை வரிசைப்படுத்துகிறது; அவற்றின் துல்லியமான சடங்கு அல்லது கோட்பாட்டு உறவை வசனம் விளக்கவில்லை. ஆகவே மொழிபெயர்ப்பு அதை மேலதிகமாக நிர்ணயிக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், வாசிக்க எளிதானதாயும் மரியாதைமிக்கதாயும் வடிவமைக்கப்பட்டது. ‘துக்கம் அனுசரித்தேன்,’ ‘உபவாசித்து,’ ‘மன்றாடி’ ஆகியவை வேதாகமச் சூழலுக்கேற்ற கண்ணியமான சொற்கள்; அரிதான பழந்தமிழ் வடிவங்கள் தவிர்க்கப்பட்டன. எல்லா அடிக்குறிப்பு குறியீடுகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
