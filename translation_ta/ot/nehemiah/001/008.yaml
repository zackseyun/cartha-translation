revisions:
- from: “உமது ஊழியனாகிய மோசேக்கு நீர் கட்டளையிட்ட வார்த்தையை நினைவுகூரும். ‘நீங்கள் நம்பிக்கைத் துரோகம் செய்தால்[a], நான் உங்களை மக்களினங்களிடையே[b] சிதறடிப்பேன்’ என்று நீர் சொன்னீரே.”
  to: '“உமது ஊழியனான மோசேக்குக் கட்டளையிட்ட வார்த்தையை நினைவுகூரும்: ‘நீங்கள் நம்பிக்கைத் துரோகம் செய்தால்[a], நான் உங்களை மக்களிடையே[b] சிதறடிப்பேன்.’”'
  rationale: The revision retains the prayerful imperative and all source meanings, while using a colon to introduce the content of the command and removing an unsupported emphatic ending. It also adopts the more natural “மக்களிடையே” for ‘among the peoples.’
  reviewer_model: gpt-5.6-terra
