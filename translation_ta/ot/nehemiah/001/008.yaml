source:
  edition: WLC
  text: זְכָר נָא֙ אֶת הַ/דָּבָ֔ר אֲשֶׁ֥ר צִוִּ֛יתָ אֶת מֹשֶׁ֥ה עַבְדְּ/ךָ֖ לֵ/אמֹ֑ר אַתֶּ֣ם תִּמְעָ֔לוּ אֲנִ֕י אָפִ֥יץ אֶתְ/כֶ֖ם בָּ/עַמִּֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/001/008.yaml
  text: Please remember the word that you commanded your servant Moses[a], saying, ‘If you act unfaithfully[b], I will scatter you among the peoples.’
translation:
  language: ta
  text: '“உமது ஊழியனான மோசேக்குக் கட்டளையிட்ட வார்த்தையை நினைவுகூரும்: ‘நீங்கள் நம்பிக்கைத் துரோகம் செய்தால்[a], நான் உங்களை மக்களிடையே[b] சிதறடிப்பேன்.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “விசுவாசமற்றவர்களாய் நடந்தால்” அல்லது “நம்பிக்கையை மீறினால்.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “நாடுகளிடையே.”
    reason: lexical_alternative
lexical_decisions:
- source_word: זְכָר נָא
  choice: நினைவுகூரும்
  rationale: கட்டளை வடிவத்துடன் வரும் נָא வேண்டுதலையும் மரியாதையையும் வெளிப்படுத்துகிறது. தமிழில் கடவுளை நோக்கிய பணிவான வேண்டுதலாக ‘நினைவுகூரும்’ இயல்பாக அமைகிறது.
- source_word: הַדָּבָר
  choice: வார்த்தை
  rationale: இங்கு דָּבָר என்பது மோசேக்கு வழங்கப்பட்ட குறிப்பிட்ட இறை உரையைக் குறிக்கிறது; ‘வார்த்தை’ அதன் வடிவத்தையும் சூழலையும் காக்கிறது.
- source_word: צִוִּיתָ
  choice: கட்டளையிட்ட
  rationale: צוה என்பதன் நேரடிப் பொருள் ‘கட்டளையிடுதல்’; எச்சரிக்கை உள்ளடங்கியிருந்தாலும் எபிரெய உரை அதை மோசேக்கு இடப்பட்ட கட்டளையாகவே கூறுகிறது.
- source_word: עַבְדְּךָ
  choice: உமது ஊழியன்
  rationale: மோசே கடவுளுக்குச் செய்யும் அங்கீகரிக்கப்பட்ட பணியையும் உறவையும் இங்கு குறிக்கிறது; தமிழில் ‘ஊழியன்’ அடிமைச் சொத்துடைமை என்ற தேவையற்ற நிழற்பொருளைத் தவிர்க்கிறது.
- source_word: לֵאמֹר
  choice: என்று நீர் சொன்னீரே
  rationale: மேற்கோளை அறிமுகப்படுத்தும் எபிரெய வடிவம். தமிழில் வாக்கிய இறுதியில் இயல்பாக அமைத்து, முந்தைய இறை உரையை நினைவூட்டும் ஜெபத் தொனியையும் வெளிப்படுத்துகிறது.
- source_word: תִּמְעָלוּ
  choice: நம்பிக்கைத் துரோகம் செய்தால்
  rationale: מעל உடன்படிக்கை அல்லது உறவுசார் விசுவாசத்தை மீறும் செயலைக் குறிக்கிறது. பொதுவான ‘பாவம் செய்தால்’ என்பதைவிட இந்தத் தேர்வு மூலத்தின் துரோக நுணுக்கத்தைக் காக்கிறது.
- source_word: אָפִיץ
  choice: சிதறடிப்பேன்
  rationale: פוץ என்பதன் Hiphil வடிவம் பிறரைச் சிதறச் செய்வதைக் குறிக்கிறது; தீர்ப்பின் செயற்படுத்தும் வலிமையை ‘சிதறடிப்பேன்’ தெளிவாகத் தருகிறது.
- source_word: בָּעַמִּים
  choice: மக்களினங்களிடையே
  rationale: עַמִּים என்பது பன்மையில் வெவ்வேறு மக்கள் குழுக்களைக் குறிக்கிறது. ‘மக்களினங்கள்’ என்பது ‘நாடுகள்’ என்ற அரசியல் நுணுக்கத்தைத் தவிர்த்து, மூலச் சொல்லின் இனக்குழுச் சார்பை நெருக்கமாகக் காக்கிறது.
theological_decisions:
- issue: מעל என்ற சொல்லின் உடன்படிக்கை சார்ந்த நுணுக்கம்
  choice: நம்பிக்கைத் துரோகம் செய்தால்
  alternative: விசுவாசமற்றவர்களாய் நடந்தால்; துரோகம் செய்தால்
  rationale: இவ்வசனம் மோசே வழியாக வழங்கப்பட்ட உடன்படிக்கைத் தீர்ப்பை நினைவுகூருகிறது. ‘நம்பிக்கைத் துரோகம்’ என்பது மீறலின் உறவுசார் தன்மையை வெளிப்படுத்துகிறது; அதேவேளை ஒரு குறிப்பிட்ட சட்ட அல்லது சமய விளக்கத்தை உரைக்குள் சேர்ப்பதில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், ஜெபத்திற்குரிய மரியாதையும் வேதாகம உரைக்குரிய கண்ணியமும் காக்கப்பட்டுள்ளன. ‘நீர்/உமது’ வடிவங்கள் கடவுளை நோக்கிய உரையின் மரியாதைத் தொனியைத் தருகின்றன. மேற்கோள் அறிமுகமான לֵאמֹר தமிழின் இயல்பான தொடரமைப்புக்கேற்ப வாக்கிய முடிவில் மொழிபெயர்க்கப்பட்டுள்ளது.
