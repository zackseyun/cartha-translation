base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/001/006.yaml
  text: Please let your ear be attentive and your eyes open to hear the prayer of your servant that I am now praying before you day and night, for the sons of Israel, your servants, while confessing the sins of the sons of Israel that we have sinned against you. I and my father's house have sinned.
translation:
  language: ta
  text: உமது செவி கவனமாயும் உமது கண்கள் திறந்தும் இருக்க அருளும்; உமது அடியேனாகிய நான் இப்போது உமக்கு முன்பாக, இரவும் பகலும், உமது பணியாளர்களான இஸ்ரவேல் மக்களுக்காக[a] ஏறெடுக்கும் விண்ணப்பத்தைக் கேட்டருளும். இஸ்ரவேல் மக்கள் உமக்கு எதிராகச் செய்த பாவங்களை நான் ஒப்புக்கொள்கிறேன்; நாங்கள் உமக்கு எதிராகப் பாவம் செய்துள்ளோம். நானும் என் தந்தையின் வீட்டாரும் பாவம் செய்துள்ளோம்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொற்படி, “இஸ்ரவேலின் மகன்களுக்காக.” இது இஸ்ரவேல் மக்களை அவர்களுடைய குடும்ப மற்றும் உடன்படிக்கை அடையாளத்தின் அடிப்படையில் குறிப்பிடும் எபிரேயச் சொற்றொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּהִי נָא אָזְנְךָ קַשֶּׁבֶת וְעֵינֶיךָ פְתֻחוֹת
  choice: உமது செவி கவனமாயிருக்கவும், உமது கண்கள் திறந்திருக்கவும் செய்வீராக
  rationale: வேண்டுதலுக்குரிய பணிவான வினைநிலையையும் ‘செவி/கண்கள்’ என்ற மனித உடலுறுப்பு உருவகத்தையும் இணை அமைப்பையும் காக்கிறது; நவீன தமிழில் மரியாதையான வேண்டுதலாக இயல்பாக உள்ளது.
- source_word: לִשְׁמֹעַ אֶל תְּפִלַּת עַבְדְּךָ
  choice: உமது பணியாளனாகிய ... ஏறெடுக்கும் விண்ணப்பத்தைக் கேட்டருளும்
  rationale: தொழுகைச் சூழலில் עבד என்பதற்கு ‘பணியாளன்’ என்றும், תפלה என்பதற்கு dignified Tamil ஆன ‘விண்ணப்பம்’ என்றும் வழங்கப்பட்டுள்ளது. ‘கேட்டருளும்’ வேண்டுதலின் பணிவை வெளிப்படுத்துகிறது.
- source_word: אֲשֶׁר אָנֹכִי מִתְפַּלֵּל לְפָנֶיךָ הַיּוֹם יוֹמָם וָלַיְלָה
  choice: நான் இப்போது உமக்கு முன்பாக இரவும் பகலும் ... ஏறெடுக்கும்
  rationale: பங்கெச்சத்தின் தொடர்ச்சியான செயலைக் காட்டுகிறது. הַיּוֹם-இன் நிகழ்காலச் சுட்டை ‘இப்போது’ காக்கிறது; יוֹמָם וָלַיְלָה தொடர்ச்சியை ‘இரவும் பகலும்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: עַל בְּנֵי יִשְׂרָאֵל עֲבָדֶיךָ
  choice: உமது பணியாளர்களான இஸ்ரவேலின் மக்களுக்காக
  rationale: עַל இங்கு பரிந்துபேசும் பொருளில் ‘க்காக’ என மொழிபெயர்க்கப்பட்டுள்ளது. בְּנֵי יִשְׂרָאֵל என்பதன் சொற்படியான குடும்பச் சாயல் அடிக்குறிப்பில் பாதுகாக்கப்பட்டு, பொதுவாசிப்பில் தவறாக உயிரியல் ஆண் மக்களாக மட்டும் புரியாதவாறு இயல்பான தமிழில் ‘இஸ்ரவேலின் மக்கள்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: וּמִתְוַדֶּה עַל חַטֹּאות
  choice: பாவங்களை நான் அறிக்கையிடுகிறேன்
  rationale: இணையான பங்கெச்சச் செயலைத் தனித் தமிழ் வாக்கியமாக அமைத்தது தெளிவையும் இயல்பையும் தருகிறது; ‘அறிக்கையிடுகிறேன்’ மனந்திரும்புதல் சார்ந்த ஒப்புக்கொள்ளுதலைக் காக்கிறது.
- source_word: אֲשֶׁר חָטָאנוּ לָךְ
  choice: நாங்கள் உமக்கு எதிராகப் பாவம் செய்தோம்
  rationale: לָךְ இங்கு குற்றத்தின் திசையைச் சுட்டுவதால் ‘உமக்கு எதிராக’ எனத் தரப்பட்டுள்ளது; எபிரேய முதல்நபர் பன்மை நேரடியாகக் காக்கப்படுகிறது.
- source_word: וַאֲנִי וּבֵית אָבִי חָטָאנוּ
  choice: நானும் என் தந்தையின் வீட்டாரும் பாவம் செய்தோம்
  rationale: בֵית אָבִי என்பதன் குடும்பம்/தந்தைவழி இல்லம் சார்ந்த பொருளை ‘என் தந்தையின் வீட்டார்’ இயல்பாகத் தருகிறது. வாவுக்கு ஆதாரமில்லாத வலியுறுத்தலைச் சேர்க்காமல் இணைப்பாக மொழிபெயர்க்கிறது.
theological_decisions:
- issue: தேவனைப் பற்றிய ‘செவி’, ‘கண்கள்’ என்ற மனித உடலுறுப்பு மொழி
  choice: உருவகத்தை நேரடியாகத் தக்கவைத்தல்
  alternative: ‘கவனம் செலுத்தும்’ என்று உடலுறுப்பு உருவகமின்றிப் பொழிப்புரை செய்தல்
  rationale: மூலத்தின் ஜெப மொழி தேவனுடைய கவனத்தைக் கண், செவி உருவகங்களால் வேண்டுகிறது. அதை நீக்காமல் வைத்திருப்பது உரையின் சொற்பொழிவுத் தன்மையையும் இறையியல் அழுத்தத்தையும் காக்கிறது.
- issue: בְּנֵי יִשְׂרָאֵל என்பதன் மொழிபெயர்ப்பு
  choice: முதன்மை உரையில் ‘இஸ்ரவேலின் மக்கள்’; அடிக்குறிப்பில் ‘இஸ்ரவேலின் மகன்கள்’
  alternative: முதன்மை உரையில் ‘இஸ்ரவேலின் மகன்கள்’
  rationale: எபிரேயச் சொற்றொடரின் சொற்படியான குடும்ப-உடன்படிக்கை வடிவம் உண்மையானது; ஆனால் தமிழில் ‘மகன்கள்’ என்பது இங்கு ஆண்களை மட்டும் குறிப்பதாக எளிதில் தவறாகப் புரியலாம். ஆகவே பொருளை முதன்மை உரையிலும் வடிவத்தை அடிக்குறிப்பிலும் காக்கிறது.
- issue: கூட்டுப் பாவ அறிக்கையில் நெகேமியாவின் தனிப்பட்ட பங்கு
  choice: ‘நாங்கள்’ என்பதையும் ‘நானும் என் தந்தையின் வீட்டாரும்’ என்பதையும் இரண்டையும் நேரடியாகக் காத்தல்
  alternative: தனிப்பட்ட குற்றத்தை மென்மைப்படுத்தி பொது ஒப்புக்கொள்ளுதலாக மட்டும் வழங்குதல்
  rationale: உரை தேசிய ஒப்புக்கொள்ளுதலையும் தனிப்பட்ட/குடும்பப் பொறுப்பையும் பதற்றத்துடன் இணைக்கிறது; ஒன்றை மற்றொன்றாகச் சுருக்கக் கூடாது.
translation_notes:
  register: நவீன நிலையான தமிழில் மரியாதையான ஜெபநடை பயன்படுத்தப்பட்டுள்ளது. ‘உமது/உமக்கு’ என்ற உயர்வுப் பன்மை, ‘கேட்டருளும்’ மற்றும் ‘செய்வீராக’ ஆகியவை கண்ணியத்தைத் தருகின்றன; மிகப் பழமையான அல்லது சமயப் பிரிவு சார்ந்த சொற்கள் தவிர்க்கப்பட்டுள்ளன. நீண்ட எபிரேய வாக்கியம் வாசிப்புத் தெளிவுக்காக மூன்று தமிழ் வாக்கியங்களாகப் பிரிக்கப்பட்டாலும் அதன் கருத்து வரிசை காக்கப்பட்டுள்ளது.
