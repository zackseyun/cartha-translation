- from: உமது செவி கவனமாயிருக்கவும், உமது கண்கள் திறந்திருக்கவும் செய்வீராக. உமது பணியாளனாகிய நான் இப்போது உமக்கு முன்பாக இரவும் பகலும் உமது பணியாளர்களான இஸ்ரவேலின் மக்களுக்காக[a] ஏறெடுக்கும் விண்ணப்பத்தைக் கேட்டருளும். இஸ்ரவேலின் மக்கள் உமக்கு எதிராகச் செய்த பாவங்களை நான் அறிக்கையிடுகிறேன்; நாங்கள் உமக்கு எதிராகப் பாவம் செய்தோம். நானும் என் தந்தையின் வீட்டாரும் பாவம் செய்தோம்.
  to: உமது செவி கவனமாயும் உமது கண்கள் திறந்தும் இருக்க அருளும்; உமது அடியேனாகிய நான் இப்போது உமக்கு முன்பாக, இரவும் பகலும், உமது பணியாளர்களான இஸ்ரவேல் மக்களுக்காக[a] ஏறெடுக்கும் விண்ணப்பத்தைக் கேட்டருளும். இஸ்ரவேல் மக்கள் உமக்கு எதிராகச் செய்த பாவங்களை நான் ஒப்புக்கொள்கிறேன்; நாங்கள் உமக்கு எதிராகப் பாவம் செய்துள்ளோம். நானும் என் தந்தையின் வீட்டாரும் பாவம் செய்துள்ளோம்.
  rationale: The revision corrects the opening plea so that the ear and eyes, rather than God as an agent causing them, are the grammatical focus of the request. It retains the source's anthropomorphic imagery, present/ongoing prayer (‘இப்போது’), and ‘day and night.’ It replaces ‘அறிக்கையிடுகிறேன்’ with the penitentially precise ‘ஒப்புக்கொள்கிறேன்,’ and keeps Israel's communal guilt alongside Nehemiah's own and his father's house. The footnote remains anchored at ‘இஸ்ரவேல் மக்கள்’ and transparently records the Hebrew literal expression without forcing an unnatural masculine-only reading in the Tamil main text.
