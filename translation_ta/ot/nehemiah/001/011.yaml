  text: אָנָּ֣א אֲדֹנָ֗/י תְּהִ֣י נָ֣א אָזְנְ/ךָֽ קַ֠שֶּׁבֶת אֶל תְּפִלַּ֨ת עַבְדְּ/ךָ֜ וְ/אֶל תְּפִלַּ֣ת עֲבָדֶ֗י/ךָ הַֽ/חֲפֵצִים֙ לְ/יִרְאָ֣ה אֶת שְׁמֶ֔/ךָ וְ/הַצְלִֽיחָ/ה נָּ֤א לְ/עַבְדְּ/ךָ֙ הַ/יּ֔וֹם וּ/תְנֵ֣/הוּ לְ/רַחֲמִ֔ים לִ/פְנֵ֖י הָ/אִ֣ישׁ הַ/זֶּ֑ה וַ/אֲנִ֛י הָיִ֥יתִי מַשְׁקֶ֖ה לַ/מֶּֽלֶךְ־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/001/011.yaml
  text: Please[a], Lord, let your ear be attentive to the prayer of your servant and to the prayer of your servants who delight to fear your name, and please give success to your servant today and grant him compassion before this man[c][b]. Now I was cupbearer to the king.
translation:
  language: ta
  text: ஆண்டவரே, தயவுசெய்து, உமது அடியானின் விண்ணப்பத்திற்கும், உமது பெயருக்கு அஞ்சுவதில் மகிழ்கிற[a] உமது அடியார்களின் விண்ணப்பத்திற்கும் உமது செவி கவனமாக இருக்கட்டும். இன்று உமது அடியானுக்கு வெற்றி அளித்து, இந்த மனிதனிடத்தில்[c] அவனுக்கு இரக்கம் கிடைக்கச் செய்யும்[b]. நான் அரசனுக்குப் பானம் பரிமாறுபவனாக இருந்தேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உமது பெயருக்கு அஞ்ச விரும்புகிறவர்கள்”; அல்லது, “உமது பெயரைப் பயபக்தியுடன் மதிக்க விரும்புகிறவர்கள்.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அவனுக்குத் தயவு கிடைக்கச் செய்யும்.” எபிரெய மரபுத்தொடர் சொல்லுக்குச் சொல், “அவனை இரக்கங்களுக்காக அளியும்” என்கிறது.
    reason: lexical_alternative
  - marker: c
    text: “இந்த மனிதன்” என்பது அரசனைக் குறிக்கிறது; அடுத்த வாக்கியத்தில் நெகேமியா தாம் அரசனுக்குப் பானம் பரிமாறுபவராக இருந்ததாகக் கூறுகிறார்.
    reason: cross_reference
lexical_decisions:
- source_word: אָנָּא
  choice: மன்றாடுகிறேன்
  rationale: வேண்டுதலின் தீவிரத்தைக் காட்டும் எபிரெயத் துகளைக் காலத்திற்கேற்ற, மரியாதையான தமிழ் வேண்டுதல் மொழியில் வெளிப்படுத்துகிறது.
- source_word: אֲדֹנָי
  choice: ஆண்டவரே
  rationale: இது இறைவனை நேரடியாக அழைக்கும் பட்டப்பெயர்; இங்கு நான்கெழுத்துத் திருப்பெயர் அல்ல.
- source_word: תְּהִי נָא אָזְנְךָ קַשֶּׁבֶת
  choice: உமது செவி கவனித்துக் கேட்பதாக
  rationale: இறைவன் சாதகமாகச் செவிகொடுக்க வேண்டும் என்ற வேண்டுதலை, ‘செவி’ என்னும் மூல உருவகத்தோடு இயல்பான தமிழில் காக்கிறது.
- source_word: תְּפִלַּת עַבְדְּךָ / תְּפִלַּת עֲבָדֶיךָ
  choice: உமது அடியானின் விண்ணப்பம் / உமது அடியார்களின் விண்ணப்பம்
  rationale: இறைவனுக்கு முன்பான பணிவான தன்னைச் சுட்டுதலை ‘அடியான்/அடியார்கள்’ வெளிப்படுத்துகிறது; ‘விண்ணப்பம்’ இங்குள்ள வேண்டுதல் சார்ந்த ஜெபத்தைக் குறிக்கிறது.
- source_word: הַחֲפֵצִים לְיִרְאָה אֶת שְׁמֶךָ
  choice: உமது பெயருக்கு அஞ்ச விரும்புகிற
  rationale: חפץ என்பதில் விருப்பம் அல்லது மகிழ்ச்சி ஆகிய நிழற்பொருள்கள் உள்ளன; ‘அஞ்சுதல்’ இறைபக்தி, பயபக்தி ஆகிய பதற்றத்தை மென்மையாக்காமல் காக்கிறது.
- source_word: וְהַצְלִיחָה נָּא לְעַבְדְּךָ הַיּוֹם
  choice: இன்று உமது அடியானுக்கு வெற்றி அளித்து
  rationale: ஹிஃபில் வினை வடிவம் வெற்றியை உண்டாக்கும்படி இறைவனிடம் கேட்கிறது; ‘வெற்றி அளித்து’ காரணகர்த்தா நிழற்பொருளைத் தெளிவாக்குகிறது.
- source_word: וּתְנֵהוּ לְרַחֲמִים
  choice: அவனுக்கு இரக்கம் கிடைக்கச் செய்யும்
  rationale: சொல்லுக்குச் சொல் ‘அவனை இரக்கங்களுக்கு அளியும்’ என்ற எபிரெய மரபுத்தொடர், ஒருவன் இரக்கமான நடத்தையைப் பெறும்படி செய்வதைக் குறிக்கிறது.
- source_word: לִפְנֵי הָאִישׁ הַזֶּה
  choice: இந்த மனிதனிடத்தில்
  rationale: குறிப்பிட்ட நபரின் முன்னிலையில் அல்லது அவருடனான தொடர்பில் என்பதைக் குறிக்கும் சொற்றொடரை இயல்பான தமிழில் தருகிறது; மூலத்தின் சற்றே விலகிய ‘இந்த மனிதன்’ என்ற குறிப்பைத் தக்கவைக்கிறது.
- source_word: וַאֲנִי הָיִיתִי מַשְׁקֶה לַמֶּלֶךְ
  choice: அப்போது நான் அரசனின் பானபாத்திரப் பொறுப்பாளனாக இருந்தேன்
  rationale: מַשְׁקֶה என்பது அரசனின் பானத்தைப் பரிமாறும் நம்பிக்கைக்குரிய அரண்மனைப் பதவியைக் குறிக்கிறது; வெறும் பணியாளன் என்ற எண்ணத்தைத் தவிர்க்க ‘பொறுப்பாளர்’ பயன்படுத்தப்படுகிறது.
theological_decisions:
- issue: ஜெப மொழியில் עבד என்பதன் மொழிபெயர்ப்பு
  choice: அடியான் / அடியார்கள்
  alternative: அடிமை / அடிமைகள்; ஊழியன் / ஊழியர்கள்
  rationale: இச்சூழலில் சட்டரீதியான அடிமை நிலையை விட, இறைவனுக்கு முன்பான பணிவும் பற்றுறுதியும் முன்னிலைப்படுகின்றன. தமிழில் ‘அடியான்’ அந்த ஜெபப் பணிவை இயல்பாக வெளிப்படுத்துகிறது.
- issue: இறைவனுடைய பெயருடன் வரும் ירא
  choice: உமது பெயருக்கு அஞ்ச
  alternative: உமது பெயரைப் பயபக்தியுடன் மதிக்க; உமது பெயருக்கு முன் பிரமிப்புடன் நிற்க
  rationale: எபிரெயச் சொல் பயமும் பயபக்தியும் கலந்த பொருளைக் கொண்டுள்ளது. ‘அஞ்ச’ என்ற தேர்வு அதன் வேதவாக்கியத் தீவிரத்தை மென்மையாக்காமல் காக்கிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- issue: רַחֲמִים என்ற பன்மை வடிவ மரபுத்தொடர்
  choice: இரக்கம் கிடைக்கச் செய்யும்
  alternative: தயவு கிடைக்கச் செய்யும்
  rationale: பொதுவான சாதக நிலையை மட்டும் காட்டும் ‘தயவு’ என்பதை விட, மூலத்தின் இரக்கம்/கருணை சார்ந்த வலிமையை ‘இரக்கம்’ காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் மரியாதைமிக்க ஜெப நடையைப் பயன்படுத்துகிறது. ‘உமது’, ‘அடியான்’, ‘மன்றாடுகிறேன்’ ஆகியவை கண்ணியத்தைத் தக்கவைக்கின்றன; அரிதான பழந்தமிழ் வினைமுற்றுகள் தவிர்க்கப்பட்டுள்ளன. ‘பானபாத்திரப் பொறுப்பாளர்’ அரண்மனைப் பதவியின் நம்பிக்கையும் பொறுப்பும் வெளிப்படுமாறு தேர்ந்தெடுக்கப்பட்டது.
