  text: חֲבֹ֖ל חָבַ֣לְנוּ לָ֑/ךְ וְ/לֹא שָׁמַ֣רְנוּ אֶת הַ/מִּצְוֺ֗ת וְ/אֶת הַֽ/חֻקִּים֙ וְ/אֶת הַ/מִּשְׁפָּטִ֔ים אֲשֶׁ֥ר צִוִּ֖יתָ אֶת מֹשֶׁ֥ה עַבְדֶּֽ/ךָ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/001/007.yaml
  text: We have acted very corruptly against you and have not kept the commandments[a], the statutes[b], and the judgments that you commanded your servant Moses.
translation:
  language: ta
  text: நாங்கள் உமக்கு எதிராக மிகவும் சீர்கெட்டு நடந்துகொண்டோம்[a]. உமது ஊழியரான மோசேக்கு நீர் கட்டளையிட்ட கட்டளைகளையும், நியமங்களையும், தீர்ப்புகளையும்[b] நாங்கள் கடைப்பிடிக்கவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘உம்மிடம் மிகவும் கேடாக நடந்துகொண்டோம்’ என்றும் மொழிபெயர்க்கலாம். எபிரெயத்தில் வலியுறுத்தும் வினைமுதல்வடிவம் முற்றுவினையுடன் சேர்ந்து, அவர்கள் நடந்துகொண்ட விதத்தின் தீவிரத்தை வலியுறுத்துகிறது.
    reason: lexical_alternative
  - marker: b
    text: ‘தீர்ப்புகள்’ என்பதை ‘சட்ட விதிகள்’ அல்லது ‘நீதிநியமங்கள்’ என்றும் மொழிபெயர்க்கலாம்; எபிரெயச் சொல் சட்டத் தீர்ப்புகள், வழக்குச் சட்டங்கள் அல்லது ஒழுங்குவிதிகளைக் குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲבֹל חָבַלְנוּ
  choice: மிகவும் சீர்கெட்டு நடந்துகொண்டோம்
  rationale: ஒரே வேர்ச்சொல்லின் வினையெச்ச வடிவமும் முற்றுவினையும் இணைந்து வினையின் வலிமையை அதிகரிக்கின்றன. தமிழில் இயல்பற்ற சொல் மறுபதிப்பைத் தவிர்த்து, ‘மிகவும்’ என்பதன் மூலம் அந்த வலியுறுத்தல் காக்கப்படுகிறது.
- source_word: לָךְ
  choice: உமக்கு எதிராக
  rationale: இந்தப் பாவ அறிக்கைச் சூழலில் செயல் கடவுளுக்கு எதிரான குற்றமாக இருந்ததைத் தெளிவாகக் காட்டுகிறது; எபிரெய முன்னிடைச்சொல்லின் உறவுசார் திசையும் காக்கப்படுகிறது.
- source_word: שָׁמַרְנוּ
  choice: கடைப்பிடிக்கவில்லை
  rationale: கட்டளைகள் மற்றும் சட்டங்களைப் பொறுத்தவரை שׁמר என்பது அவற்றைக் காத்து நடத்தல் அல்லது அனுசரித்தல் என்று பொருள்படும். ‘கடைப்பிடிக்கவில்லை’ என்பது நவீன தமிழில் இயல்பான சட்ட-உடன்படிக்கைச் சொற்பயன்பாடு.
- source_word: הַמִּצְוֺת
  choice: கட்டளைகள்
  rationale: கட்டளையிடப்பட்ட கடமைகள் என்ற நேரடியான பொருளையும் உடன்படிக்கைச் சட்டப் பதிவையும் காக்கிறது.
- source_word: הַחֻקִּים
  choice: நியமங்கள்
  rationale: நிலையாக வகுக்கப்பட்ட சட்ட ஏற்பாடுகள் அல்லது விதிகளைச் சுட்டுகிறது; மற்ற இரு தோரா சொற்களிலிருந்தும் சொல்வேறுபாட்டைக் காக்கிறது.
- source_word: הַמִּשְׁפָּטִים
  choice: தீர்ப்புகள்
  rationale: சட்டத் தீர்ப்புகள், வழக்குச் சட்டங்கள், நியாய விதிகள் ஆகிய பொருள் எல்லைகளைக் கொண்ட சொல்லின் நீதித்துறை நிழற்பொருளைக் காக்கிறது; அதன் பரந்த பொருள் அடிக்குறிப்பில் குறிப்பிடப்படுகிறது.
- source_word: צִוִּיתָ
  choice: நீர் கட்டளையிட்ட
  rationale: தெய்வீக அதிகாரத்திலிருந்து நேரடியாக வழங்கப்பட்ட கட்டளையைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: עַבְדֶּךָ
  choice: உமது ஊழியரான
  rationale: மோசே கடவுளால் பணிக்கு அமர்த்தப்பட்டவர் என்ற சூழலுக்குப் பொருத்தமான மரியாதைமிக்க பட்டம்; அடிமைத்தனத்தைத் தேவையின்றி முன்னிறுத்தாது.
theological_decisions:
- issue: தோரா தொடர்பான மூன்று சட்டச் சொற்களின் வேறுபாட்டைக் காத்தல்
  choice: கட்டளைகள், நியமங்கள், தீர்ப்புகள்
  alternative: கட்டளைகள், சட்டங்கள், விதிமுறைகள்
  rationale: மூல எபிரெயம் மூன்று வேறுபட்ட சட்டச் சொற்களைப் பயன்படுத்துகிறது. அவற்றை ஒரே பொதுப்பொருளில் கரைக்காமல், சட்ட-உடன்படிக்கை உரையின் அடுக்குகளைத் தமிழிலும் காக்கிறது; அதேவேளை ஒரு குறிப்பிட்ட சமயக் கோட்பாட்டு வகைப்பாட்டைத் திணிப்பதில்லை.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகப் புரியும் வகையிலும், ஜெபத்தின் மரியாதைமிக்க தொனியைப் பேணும் வகையிலும் ‘நீர்/உமது’ வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன. மூன்று சட்டச் சொற்களும் தனித்தனியாக வைக்கப்பட்டுள்ளன; வாக்கிய அமைப்பு தெளிவுக்காக இரண்டு வாக்கியங்களாக வழங்கப்பட்டுள்ளது.
