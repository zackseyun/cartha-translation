  text: וַ/תִּמְשֹׁ֤ךְ עֲלֵי/הֶם֙ שָׁנִ֣ים רַבּ֔וֹת וַ/תָּ֨עַד בָּ֧/ם בְּ/רוּחֲ/ךָ֛ בְּ/יַד נְבִיאֶ֖י/ךָ וְ/לֹ֣א הֶאֱזִ֑ינוּ וַֽ/תִּתְּנֵ֔/ם בְּ/יַ֖ד עַמֵּ֥י הָ/אֲרָצֹֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/030.yaml
  text: For many years you were patient with them and testified against them by your Spirit through your prophets[a], but they would not listen. So you gave them into the hand of the peoples of the lands.
translation:
  language: ta
  text: பல ஆண்டுகளாக நீர் அவர்களிடம் பொறுமையுடன் இருந்தீர்; உமது ஆவியினால் உமது தீர்க்கதரிசிகள் வழியாக அவர்களுக்கு எதிராகச் சாட்சியளித்தீர்[a]. ஆனால் அவர்கள் செவிகொடுக்கவில்லை. எனவே, நாடுகளின் மக்களின் கையில் அவர்களை ஒப்புக்கொடுத்தீர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உமது ஆவியினால் உமது தீர்க்கதரிசிகள் வழியாக அவர்களை எச்சரித்தீர்.”
    reason: עוד என்ற வினை இச்சூழலில் ‘எதிராகச் சாட்சியளித்தல்’ அல்லது ‘எச்சரித்தல்’ என்று பொருள்படலாம்.
lexical_decisions:
- source_word: וַתִּמְשֹׁךְ עֲלֵיהֶם
  choice: நீர் அவர்களிடம் பொறுமையாயிருந்து
  rationale: இச்சொற்றொடர் காலத்தை நீட்டித்து உடனடியாகத் தண்டிக்காமல் சகித்திருப்பதைக் குறிக்கிறது; இயல்பான நவீனத் தமிழில் ‘பொறுமையாயிருந்து’ அந்தப் பொருளைத் தெளிவாகத் தருகிறது.
- source_word: שָׁנִים רַבּוֹת
  choice: பல ஆண்டுகளாக
  rationale: நீண்ட கால அளவை நேரடியாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: וַתָּעַד בָּם
  choice: அவர்களுக்கு எதிராகச் சாட்சியளித்தீர்
  rationale: עוד என்பதன் ஹிஃபில் வடிவிலுள்ள சாட்சியளித்தல்/எச்சரித்தல் என்ற பொருட்களில், בָּם உடன் வரும் இவ்விடத்தின் உடன்படிக்கை மற்றும் குற்றஞ்சாட்டும் நுட்பத்தை ‘எதிராகச் சாட்சியளித்தீர்’ நெருக்கமாகப் பாதுகாக்கிறது; தெளிவான பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: בְּרוּחֲךָ
  choice: உமது ஆவியினால்
  rationale: தீர்க்கதரிசிகள் வாயிலான இறைச் செய்தியின் மூலமும் செயலாற்றும் முகவரும் தேவனுடைய ஆவி என்பதைக் குறிக்கிறது; தமிழ் வேதாகம நடையில் இறை ஆவைக் குறிக்க ‘ஆவி’ பயன்படுத்தப்படுகிறது.
- source_word: בְּיַד נְבִיאֶיךָ
  choice: உமது தீர்க்கதரிசிகள் வழியாக
  rationale: ‘கையால்’ என்ற எபிரெய வழக்கு இங்கு செயற்படும் கருவி அல்லது முகவரைக் குறிக்கும்; ‘வழியாக’ இயல்பான தமிழ்ச் சமமானது.
- source_word: וְלֹא הֶאֱזִינוּ
  choice: ஆனாலும் அவர்கள் செவிகொடுக்கவில்லை
  rationale: האזין கவனமாகக் கேட்பதைக் குறிக்கிறது; ‘செவிகொடுக்கவில்லை’ கேட்டு ஏற்காத நிலையைச் சுருக்கமாக வெளிப்படுத்துகிறது.
- source_word: וַתִּתְּנֵם בְּיַד
  choice: ஆகவே ... கையில் அவர்களை ஒப்புக்கொடுத்தீர்
  rationale: தொடர்வினை முந்தைய மறுப்பின் விளைவைக் காட்டுகிறது; ‘கையில் ஒப்புக்கொடுத்தீர்’ மற்றவர்களின் அதிகாரத்திற்குள் விடப்பட்டதைக் குறிக்கும் எபிரெய உருவகத்தையும் தமிழில் புரியத்தக்கவாறு காக்கிறது.
- source_word: עַמֵּי הָאֲרָצוֹת
  choice: பல்வேறு நாடுகளின் மக்கள்
  rationale: பன்மையிலுள்ள ‘நிலங்கள்/நாடுகள்’ சுற்றியுள்ள அரசியல் மக்களினங்களைக் குறிப்பதாக இயல்பாகப் புரிகிறது; ‘பல்வேறு’ என்பது மூலத்தின் பன்மையைத் தமிழில் தெளிவாக்குகிறது.
theological_decisions:
- issue: ‘உமது ஆவி’ என்பதன் குறிப்பு
  choice: தீர்க்கதரிசிகள் வழியாகச் சாட்சியளித்த தேவனுடைய ஆவி
  alternative: தேவனுடைய மனப்பாங்கு அல்லது மூச்சு
  rationale: ‘உமது ஆவியினால், உமது தீர்க்கதரிசிகள் வழியாக’ என்ற இணைப்பு, தீர்க்கதரிசனச் செய்தியில் செயலாற்றும் தெய்வீக மூலத்தையே மிக இயல்பாகக் குறிக்கிறது; பிற்காலக் கோட்பாட்டு விவரங்களை வசனத்தில் சேர்க்கவில்லை.
- issue: וַתָּעַד בָּם என்பதிலுள்ள நீதித்துறை நுட்பம்
  choice: அவர்களுக்கு எதிராகச் சாட்சியளித்தீர்
  alternative: அவர்களை எச்சரித்தீர்
  rationale: மூல வினை எச்சரிப்பையும் சாட்சியையும் குறிக்கக்கூடும். இங்கு ‘எதிராகச் சாட்சியளித்தீர்’ உடன்படிக்கை மீறலுக்கெதிரான சாட்சியின் தீவிரத்தைக் காக்கிறது; ‘எச்சரித்தீர்’ என்ற சூழற்பொருள் அடிக்குறிப்பில் வைக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. தேவனை நோக்கும் ஒருமை மரியாதை வடிவங்களான ‘நீர்/உமது/அளித்தீர்’ பயன்படுத்தப்பட்டுள்ளன. ‘தீர்க்கதரிசிகள்’ மற்றும் ‘செவிகொடுக்கவில்லை’ ஆகியவை பரவலாக அறியப்படும் வேதாகமச் சொற்கள்; தேவையற்ற பழமையாக்கம் தவிர்க்கப்பட்டுள்ளது.
