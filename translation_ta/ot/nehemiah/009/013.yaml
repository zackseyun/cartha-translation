  text: You came down on Mount Sinai and spoke with them from heaven[a], and you gave them upright judgments, true laws[c][b], good statutes and commandments.
translation:
  language: ta
  text: நீர் சீனாய் மலையின்மேல் இறங்கி, வானத்திலிருந்து அவர்களோடு பேசினீர்[a]. நீதியான தீர்ப்புகளையும்[b], உண்மையான சட்டங்களையும்[c], நல்ல நியமங்களையும் கட்டளைகளையும் அவர்களுக்குக் கொடுத்தீர்.
  philosophy: optimal-equivalence
