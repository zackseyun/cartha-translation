  choice: வானத்திலிருந்து அவர்களோடு பேசினீர்
  rationale: עִם என்பதன் அடிப்படைப் பொருளான ‘உடன்/ஓடு’ என்பதைப் பாதுகாக்க ‘அவர்களோடு’ பயன்படுத்தப்பட்டது. מִשָּׁמָיִם என்பது இயல்பாக ‘வானத்திலிருந்து’ என மொழிபெயர்க்கப்பட்டது.
- source_word: וַתִּתֵּן לָהֶם
  choice: அவர்களுக்குக் கொடுத்தீர்
  rationale: נתן + ל அமைப்பை இயல்பான தமிழில் தருகிறது; ஜெபத்தில் தேவனை நோக்கிய இரண்டாம் நபர் மரியாதை ஒருமையையும் காக்கிறது.
- source_word: מִשְׁפָּטִים יְשָׁרִים
  choice: நீதியான தீர்ப்புகள்
  rationale: מִשְׁפָּטִים என்பதன் சட்டம் மற்றும் தீர்ப்பு சார்ந்த பொருளை ‘தீர்ப்புகள்’ காக்கிறது. יְשָׁרִים என்பதிலுள்ள நேர்மை/சரியான தன்மையைச் சூழலுக்கேற்ற ‘நீதியான’ வெளிப்படுத்துகிறது.
- source_word: וְתוֹרוֹת אֱמֶת
  choice: உண்மையான சட்டங்கள்
  rationale: இந்தச் சட்டவியல் பட்டியலில் תּוֹרוֹת என்பதை ‘சட்டங்கள்’ எனத் தருவது பொருத்தமானது; אֱמֶת அவற்றின் உண்மை மற்றும் நம்பகத்தன்மையைக் குறிக்கிறது.
- source_word: חֻקִּים
  choice: நியமங்கள்
  rationale: நிலைப்படுத்தப்பட்ட விதிமுறைகள் என்ற சட்டவியல் பொருளைத் தருவதோடு, அருகிலுள்ள ‘தீர்ப்புகள்,’ ‘சட்டங்கள்,’ ‘கட்டளைகள்’ என்பவற்றிலிருந்து சொல்வேறுபாட்டையும் காக்கிறது.
- source_word: וּמִצְוֺת
  choice: கட்டளைகள்
  rationale: உடன்படிக்கைச் சட்டச் சூழலில் מִצְוָה என்பதற்கான நேரடியான, வழக்கமான தமிழ் இணைச்சொல்.
- source_word: טוֹבִים
  choice: நல்ல
  rationale: טוֹבִים என்பதன் எளிய மதிப்பீட்டுப் பொருளைக் காக்கிறது; எபிரெயச் சொல்லமைப்பின்படி இறுதி இணைச்சொற்களான ‘நியமங்கள்,’ ‘கட்டளைகள்’ இரண்டுடனும் இயல்பாகப் பொருந்துகிறது.
theological_decisions:
- issue: சீனாயில் கொடுக்கப்பட்ட தெய்வீக வெளிப்பாட்டைக் குறிக்கும் நான்கு சட்டவியல் சொற்களை வேறுபடுத்துதல்
  choice: ‘தீர்ப்புகள்,’ ‘சட்டங்கள்,’ ‘நியமங்கள்,’ ‘கட்டளைகள்’ என்று நான்கு வேறுபட்ட சொற்களாக மொழிபெயர்த்தல்
  alternative: அனைத்தையும் ‘சட்டங்களும் கட்டளைகளும்’ போன்ற குறைந்த எண்ணிக்கையிலான பொதுச்சொற்களாகச் சுருக்குதல்; அல்லது תּוֹרוֹת என்பதை ‘போதனைகள்’ என மொழிபெயர்த்தல்
  rationale: மூல எபிரெயம் பல சட்டவியல் சொற்களைத் திட்டமிட்டு அடுக்குகிறது. அவற்றை வேறுபடுத்துவது சீனாயில் கொடுக்கப்பட்ட வெளிப்பாட்டின் செறிவைக் காக்கிறது; எந்த ஒரு பிரிவுசார் சட்டக் கோட்பாட்டையும் இதன்மேல் திணிக்கவில்லை.
- issue: דבר עם என்பதில் உள்ள தொடர்பின் தன்மை
  choice: ‘அவர்களோடு பேசினீர்’ என்று עִם என்பதைக் காத்தல்
  alternative: ‘அவர்களிடம் பேசினீர்’
  rationale: ‘அவர்களோடு’ என்பது மூலத்தின் ‘with’ உறவை நெருக்கமாகக் காக்கிறது. இருப்பினும் இச்சூழலில் அது இருதரப்பு உரையாடலை கட்டாயமாகக் குறிக்காது என்பதால் இயல்பான மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீனத் தரமான, மரியாதைமிக்க தமிழில் தேவனை நோக்கிய ‘நீர்/பேசினீர்/கொடுத்தீர்’ வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன. சட்டவியல் சொற்களின் வேறுபாடு காக்கப்பட்டாலும், வாசிப்புக்கு மிகப் பழமையான அல்லது அரிதான சொற்கள் தவிர்க்கப்பட்டுள்ளன.
