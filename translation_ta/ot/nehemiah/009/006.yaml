  text: אַתָּה ה֣וּא יְהוָה֮ לְ/בַדֶּ/ךָ֒ את עָשִׂ֡יתָ אֶֽת הַ/שָּׁמַיִם֩ שְׁמֵ֨י הַ/שָּׁמַ֜יִם וְ/כָל צְבָאָ֗/ם הָ/אָ֜רֶץ וְ/כָל אֲשֶׁ֤ר עָלֶ֨י/הָ֙ הַ/יַּמִּים֙ וְ/כָל אֲשֶׁ֣ר בָּ/הֶ֔ם וְ/אַתָּ֖ה מְחַיֶּ֣ה אֶת כֻּלָּ֑/ם וּ/צְבָ֥א הַ/שָּׁמַ֖יִם לְ/ךָ֥ מִשְׁתַּחֲוִֽים־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/006.yaml
  text: You alone are Yahweh[a]. You made the heavens, the highest heavens and all their host, the earth and all that is on it, the seas and all that is in them; and you preserve all of them alive[c][b], and the host of heaven bows down to you.
translation:
  language: ta
  text: நீரே யாவே; நீர் ஒருவரே. வானங்களையும், வானாதி வானங்களையும்[a], அவற்றின் அனைத்துப் படைகளையும்[b], பூமியையும் அதன்மேல் உள்ள அனைத்தையும், கடல்களையும் அவற்றில் உள்ள அனைத்தையும் நீரே உண்டாக்கினீர். அவை அனைத்தையும் நீர் உயிருடன் காத்திருக்கிறீர்[c]; வானத்தின் படைகள் உம்மை வணங்குகின்றன[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொற்பொருளாக, “வானங்களின் வானங்கள்”; அதாவது, மிக உயர்ந்த வானங்கள்.
    reason: lexical_alternative
  - marker: b
    text: “படைகள்” என்பது விண்மீன்களையும் வானுலக உயிர்களையும், அல்லது இரண்டையும் குறிக்கக்கூடும்.
    reason: lexical_ambiguity
  - marker: c
    text: அல்லது, “அவை அனைத்துக்கும் நீர் உயிரளிக்கிறீர்” / “அவை அனைத்தையும் உயிருடன் வைத்திருக்கிறீர்.”
    reason: alternative_reading
  - marker: d
    text: “வானத்தின் படைகள்” என்பதை “வானுலகச் சேனை” என்றும் மொழிபெயர்க்கலாம்; இது விண்மீன்களையோ வானுலக உயிர்களையோ குறிக்கக்கூடும்.
    reason: lexical_ambiguity
lexical_decisions:
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைவனின் தனிப்பெயராகிய நான்கெழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் இயல்பாக ஒலிபெயர்க்கிறது.
- source_word: אַתָּה הוּא ... לְבַדֶּךָ
  choice: நீர் ஒருவரே
  rationale: இரு தனிப்பெயர்ச்சொற்களும் ‘தனியாக/ஒருவரே’ என்பதும் தரும் வலியுறுத்தலையும் தனித்தன்மையையும் இயல்பான தமிழில் காக்கிறது.
- source_word: עָשִׂיתָ
  choice: உண்டாக்கினீர்
  rationale: பொதுவான ‘செய்தீர்/உண்டாக்கினீர்’ என்ற பொருளை இச்சூழலில் இயல்பாகத் தருகிறது; மூலத்தில் இல்லாத குறிப்பான படைப்புச் சொல்லைத் திணிப்பதில்லை.
- source_word: הַשָּׁמַיִם
  choice: வானங்கள்
  rationale: படைப்பின் பரந்த வானுலகைக் குறிக்கும் எபிரெயப் பன்மையைப் பேணுகிறது.
- source_word: שְׁמֵי הַשָּׁמַיִם
  choice: வானாதி வானங்கள்
  rationale: ‘வானங்களின் வானங்கள்’ என்ற எபிரெய உயர்வுநிலை மரபுத்தொடரின் கவித்துவ வடிவத்தையும் பொருளையும் தமிழில் சுருக்கமாகத் தருகிறது; சொற்பொருள் அடிக்குறிப்பில் விளக்கப்படுகிறது.
- source_word: צְבָאָם
  choice: அவற்றின் அனைத்துப் படைகள்
  rationale: விண்மீன்கள் அல்லது வானுலக உயிர்கள் எனக் குறுகலாகத் தீர்மானிக்காமல், צבא என்பதன் கூட்டுத் தொகுதி சார்ந்த விரிந்த பொருளைப் பேணுகிறது.
- source_word: הָאָרֶץ וְכָל אֲשֶׁר עָלֶיהָ
  choice: பூமியும் அதன்மேல் உள்ள அனைத்தும்
  rationale: படைப்புப் பட்டியலில் אֶרֶץ முழுப் பூமியைக் குறிக்கிறது; தமிழில் தெளிவான இடவுறவை வழங்குகிறது.
- source_word: הַיַּמִּים וְכָל אֲשֶׁר בָּהֶם
  choice: கடல்களும் அவற்றில் உள்ள அனைத்தும்
  rationale: வானங்கள், பூமி, கடல்கள் என்ற மூவகைப் படைப்புப் பட்டியலை நேரடியாகப் பேணுகிறது.
- source_word: מְחַיֶּה
  choice: உயிரோடு காத்துவருகிறீர்
  rationale: படைப்புக்குப் பின் தொடரும் இறை பராமரிப்பை நிகழ்காலத் தொடர்ச்சியுடன் வெளிப்படுத்துகிறது; ‘உயிரளிக்கிறீர்’ என்ற சாத்தியத்தை அடிக்குறிப்பில் பேணுகிறது.
- source_word: וּצְבָא הַשָּׁמַיִם
  choice: வானத்தின் படைகள்
  rationale: ‘வானத்தின் சேனை/படை’ என்ற கூட்டுப்பொருளைக் காக்கிறது; விண்மீன்களா வானுலக உயிர்களா என்ற மூலத்தின் பொருள் அகலத்தைத் தீர்மானிக்கவில்லை.
- source_word: מִשְׁתַּחֲוִים
  choice: வணங்குகின்றன
  rationale: ஒருவர்முன் பணிந்து வழிபடுதல் என்ற செயலை இச்சூழலுக்கு ஏற்ற, கண்ணியமான நவீன தமிழில் தருகிறது.
theological_decisions:
- issue: யாவேயின் தனித்தன்மை
  choice: நீர் ஒருவரே யாவே
  alternative: யாவே நீர் மட்டுமே
  rationale: யாவே ஒருவரே என்பதே வலியுறுத்தல் என்பதைத் தெளிவாக்குகிறது; வேறு இறையியல் விளக்கத்தை வசனத்துக்குள் சேர்ப்பதில்லை.
- issue: מְחַיֶּה குறிக்கும் தொடர்ச்சியான இறைச் செயல்
  choice: அவை அனைத்தையும் நீர் உயிரோடு காத்துவருகிறீர்
  alternative: அவை அனைத்துக்கும் நீர் உயிரளிக்கிறீர்
  rationale: இச்சூழலில் படைத்த அனைத்தையும் தொடர்ந்து உயிருடன் நிலைநிறுத்துதல் முதன்மையாகத் தெரிகிறது; எனினும் உயிரளித்தல் என்ற மொழியியல் சாத்தியத்தை அடிக்குறிப்பில் திறந்தே வைக்கிறது.
- issue: வானத்தின் படைகள் என்பதன் அடையாளம்
  choice: வானத்தின் படைகள்
  alternative: வானுலகச் சேனை / விண்மீன்கள்
  rationale: צבא என்பது விண்ணுலகப் படைகள், விண்மீன்கள், அல்லது இரண்டையும் உள்ளடக்கும் பரந்த கூட்டுத்தொகையைக் குறிக்கக்கூடும்; மொழிபெயர்ப்பு அதை ஒரு வகைக்குள் மட்டுப்படுத்தவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், வழிபாட்டு உரைக்கு ஏற்ற கண்ணியமான நடையுடன் மொழிபெயர்க்கப்பட்டது. இறைவனை நோக்கும் ஒருமை மரியாதை வடிவங்களான “நீர்,” “உம்மை” பயன்படுத்தப்பட்டுள்ளன. “வானாதி வானங்கள்” என்ற சற்றே உயர்ந்த நடை மூலத்தின் கவித்துவ உயர்வுநிலையைப் பேணுகிறது; அதன் பொருள் அடிக்குறிப்பில் எளிமையாக விளக்கப்பட்டுள்ளது.
