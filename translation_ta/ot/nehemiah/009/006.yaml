  revision_rationale: 'முதல் வாக்கியம் எபிரெயத்தின் வலியுறுத்தலைத் தெளிவாகவும் இயல்பான நவீன தமிழிலும் தருமாறு மறுசீரமைக்கப்பட்டது: யாவே என்ற அடையாளமும் ‘நீர் ஒருவரே’ என்ற தனித்தன்மை வலியுறுத்தலும் தனித்தனியாகத் தெளிவுபடுத்தப்பட்டன. மְחַיֶּה என்பதன் தொடர்ச்சியான உயிர்காக்கும் பொருளைச் சீராகத் தர “உயிரோடு காத்துவருகிறீர்” என்பதற்குப் பதிலாக “உயிருடன் காத்திருக்கிறீர்” பயன்படுத்தப்பட்டது. அடிக்குறிப்புகள் மூலத்தின் திறந்த பொருள் எல்லைகளைப் பாதுகாப்பதால் மாற்றமின்றி வைக்கப்பட்டன.'
