  naturalness: மரியாதைப் பன்மை நடை பொருத்தமானது. “உயிரோடு காத்துவருகிறீர்” புரியத்தக்கது; “உயிருடன் காத்திருக்கிறீர்” என்பது நவீன தரத் தமிழில் சற்றே இயல்பாகவும் தொடர்ச்சிச் செயலைத் தெளிவாகவும் தருகிறது. “வானாதி வானங்கள்” கவித்துவ/வேதாகம நடையாக ஏற்றுக்கொள்ளத்தக்கது; அதன் சொற்பொருளை அடிக்குறிப்பு நன்கு விளக்குகிறது.
  terminology: “யாவே” என்பது மூலப் பெயரை நேரடியாகக் காக்கிறது. “படைகள்” என்ற சொல்லுக்கு இராணுவத் தொனி இருக்கலாம்; ஆயினும் அடிக்குறிப்புகள் விண்மீன்கள் மற்றும் வானுலக உயிர்கள் என்ற திறந்த பொருளைச் சரியாகக் காக்கின்றன. “வணங்குகின்றன” מִשְׁתַּחֲוִים என்பதற்கு ஏற்றது.
