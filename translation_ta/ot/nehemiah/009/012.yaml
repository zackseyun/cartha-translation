  source_fidelity: 'கருத்து மொத்தத்தில் துல்லியமாக உள்ளது: பகலில் மேகத் தூணாலும் இரவில் நெருப்புத் தூணாலும் இறைவன் மக்களை வழிநடத்தியதையும், இரவுத் தூண் அவர்கள் செல்லவேண்டிய வழிக்கு ஒளியளித்ததையும் சரியாகத் தெரிவிக்கிறது. ஆயினும், மூலத்தில் אֶת הַדֶּרֶךְ (‘வழியை’) என்பது ஒளியூட்டுதலின் நேரடிச் செயப்படுபொருள். ‘வழியில் அவர்களுக்கு வெளிச்சம் கொடுக்க’ என்பது இடப்பொருளாக மாறி, அந்தத் தொடர்பைச் சற்றே தளர்த்துகிறது.'
