base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/012.yaml
  text: By a pillar of cloud you led them by day[a], and by a pillar of fire by night to give them light on the way in which they should go.
translation:
  language: ta
  text: பகலில் மேகத் தூணால் அவர்களை வழிநடத்தினீர்; இரவில் அவர்கள் செல்லவேண்டிய வழியை அவர்களுக்கு ஒளிரச் செய்ய நெருப்புத் தூணால் வழிநடத்தினீர்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְעַמּוּד עָנָן
  choice: மேகத்தூணால்
  rationale: בְּ இங்கு வழிநடத்தப் பயன்படுத்தப்பட்ட கருவி அல்லது வழிமுறையைக் குறிக்கிறது. ‘மேகத்தூணால்’ என்பது எபிரெயச் சொல்லமைப்பின் சுருக்கத்தையும் உருவகத்தையும் இயல்பான தமிழில் காக்கிறது.
- source_word: הִנְחִיתָם
  choice: அவர்களை வழிநடத்தினீர்
  rationale: נחה என்பதன் ஹிஃபில் வடிவம் இச்சூழலில் வழிகாட்டுதல் அல்லது வழிநடத்துதலைக் குறிக்கிறது. மரியாதை ஒருமை வினைமுற்று கடவுளிடம் உரைக்கப்படும் ஜெப நடையைப் பேணுகிறது.
- source_word: יוֹמָם
  choice: பகலில்
  rationale: காலத்தைக் குறிக்கும் வினையடை; இணையான ‘இரவில்’ என்பதுடன் தெளிவான சமநிலையை உருவாக்குகிறது.
- source_word: וּבְעַמּוּד אֵשׁ
  choice: நெருப்புத்தூணால்
  rationale: ‘மேகத்தூணால்’ என்பதற்கு இணையாக கருவிப் பொருளைக் காத்து, மூலத்தின் கவித்துவச் சமச்சீரைத் தக்கவைக்கிறது.
- source_word: לַיְלָה
  choice: இரவில்
  rationale: יוֹמָם என்பதன் காலப்பொருள் இணை; நவீன தமிழில் இயல்பான வடிவம்.
- source_word: לְהָאִיר לָהֶם
  choice: அவர்களுக்கு வெளிச்சம் கொடுக்க
  rationale: אור என்பதன் ஹிஃபில் வினையெச்சம் நோக்கம் அல்லது விளைவைக் குறிக்கிறது; לָהֶם இன் பயனாளிப் பொருளும் வெளிப்படையாகப் பேணப்படுகிறது.
- source_word: אֶת הַדֶּרֶךְ
  choice: வழியில்
  rationale: எபிரெயத்தில் ‘வழி’ நேரடிச் செயப்படுபொருளாக இருந்தாலும், தமிழில் ‘வழியில் வெளிச்சம் கொடுக்க’ என்பது பொருளைத் துல்லியமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: אֲשֶׁר יֵלְכוּ בָהּ
  choice: அவர்கள் செல்லவேண்டிய
  rationale: தொடர்புச் சொற்றொடர் அவர்கள் செல்ல நியமிக்கப்பட்ட அல்லது உரிய பாதையைக் குறிக்கிறது. ‘செல்லவேண்டிய’ என்பது நோக்கத்தைக் காட்டுகிறது; தேவையற்ற கோட்பாட்டு விளக்கத்தைச் சேர்ப்பதில்லை.
theological_decisions:
- issue: வனாந்தரப் பயணத்தில் இறைவழிகாட்டுதலின் உருவகங்கள்
  choice: மேகம் மற்றும் நெருப்பின் தூண்கள் வழியாகக் கடவுள் இஸ்ரவேலரை வரலாற்றில் வழிநடத்தியதாக நேரடியாக மொழிபெயர்த்தல்
  alternative: வழிநடத்துதலைவிடத் தெய்வீகப் பிரசன்னத்தை முன்னிறுத்தும் விளக்க மொழிபெயர்ப்பு
  rationale: எபிரெய உரை வழிநடத்துதலையும் செல்லவேண்டிய வழிக்கு வெளிச்சமளித்தலையும் நேரடியாக வலியுறுத்துகிறது. மேலதிக முன்னடையாள அல்லது கோட்பாட்டு விளக்கத்தை மொழிபெயர்ப்பில் புகுத்தாமல் அந்தத் தெளிவைத் தக்கவைக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும் dignified ஜெபநடை. ‘வழிநடத்தினீர்’ என்பதைக் கடைசி உறுப்பிலும் வெளிப்படையாக மீண்டும் கூறுவது தமிழில் இரு தூண்களின் வழிகாட்டும் பங்கையும் தெளிவாக்குகிறது; இது எபிரெயத்தின் இணை அமைப்பில் இரண்டாம் உறுப்பில் விடுபட்ட வினையை இயல்பாக நிரப்புகிறது.
