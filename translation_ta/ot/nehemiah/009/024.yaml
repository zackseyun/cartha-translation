  text: וַ/יָּבֹ֤אוּ הַ/בָּנִים֙ וַ/יִּֽירְשׁ֣וּ אֶת הָ/אָ֔רֶץ וַ/תַּכְנַ֨ע לִ/פְנֵי/הֶ֜ם אֶת יֹשְׁבֵ֤י הָ/אָ֨רֶץ֙ הַ/כְּנַ֣עֲנִ֔ים וַֽ/תִּתְּנֵ֖/ם בְּ/יָדָ֑/ם וְ/אֶת מַלְכֵי/הֶם֙ וְ/אֶת עַֽמְמֵ֣י הָ/אָ֔רֶץ לַ/עֲשׂ֥וֹת בָּ/הֶ֖ם כִּ/רְצוֹנָֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/024.yaml
  text: So the sons came in and took possession of the land[a], and you subdued before them the inhabitants of the land, the Canaanites, and gave them into their hand, both their kings and the peoples of the land[c][b], to do with them according to their will.
translation:
  language: ta
  text: ஆகவே, அந்த மகன்கள் வந்து தேசத்தைக் கைப்பற்றினார்கள்[a]. நீர் அவர்களுக்கு முன்பாக தேசத்தின் குடிகளான கானானியர்களை அடக்கி, அவர்களையும் அவர்களுடைய அரசர்களையும் தேசத்தின் மக்களினங்களையும் அவர்களுடைய கையில் ஒப்புக்கொடுத்தீர்[b], அவர்கள் அவர்களைத் தங்கள் விருப்பப்படி கையாளும்படி[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அந்தப் பிள்ளைகள்’ என்றும், பொருள் விளக்கமாக ‘இஸ்ரவேலர்கள்’ என்றும் மொழிபெயர்க்கலாம். எபிரெயத்தில் சொற்பட ‘அந்த மகன்கள்’ என்று உள்ளது.
    reason: lexical_alternative
  - marker: b
    text: அதாவது, ‘அவர்களை இவர்களுடைய அதிகாரத்திற்குள் ஒப்புக்கொடுத்தீர்.’ எபிரெயத்தில் சொற்பட ‘அவர்களுடைய கையில் கொடுத்தீர்’ என்று உள்ளது.
    reason: lexical_alternative
  - marker: c
    text: ‘அவர்கள் விரும்பியபடி அவர்களோடு நடந்துகொள்ளும்படி’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבָּנִים
  choice: அந்த மகன்கள்
  rationale: எபிரெயச் சொல்லின் குடும்பவழி மொழியைப் பாதுகாக்கிறது; சூழலில் இது கானானுக்குள் நுழைந்த இஸ்ரவேலின் சந்ததியினரைக் குறிக்கிறது.
- source_word: וַיִּירְשׁוּ אֶת הָאָרֶץ
  choice: தேசத்தைத் தங்களுடையதாக்கிக்கொண்டார்கள்
  rationale: ירשׁ என்பதன் நிலவுடைமை சார்ந்த பொருளான கைப்பற்றி உடைமையாக்குதலை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: וַתַּכְנַע
  choice: பணியச் செய்து
  rationale: கானானியர்களை இஸ்ரவேலரின் ஆட்சிக்குக் கீழ்ப்படுத்திய இறைச் செயலைக் குறிக்கும் வலிமையான இராணுவ-அரசியல் பொருளைப் பாதுகாக்கிறது.
- source_word: יֹשְׁבֵי הָאָרֶץ הַכְּנַעֲנִים
  choice: அந்தத் தேசத்தின் குடிகளான கானானியர்கள்
  rationale: குடியிருப்பவர்களையும் அவர்களுடைய இன அடையாளத்தையும் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: וַתִּתְּנֵם בְּיָדָם
  choice: அவர்களுடைய கையில் ஒப்புக்கொடுத்தீர்
  rationale: கட்டுப்பாடு அல்லது அதிகாரத்தைக் குறிக்கும் எபிரெய உருவகமான ‘கையில்’ என்பதைப் பாதுகாக்கிறது.
- source_word: מַלְכֵיהֶם
  choice: அவர்களுடைய அரசர்கள்
  rationale: பின்னொட்டு கானானியர்களைக் குறிப்பதை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: עַמְמֵי הָאָרֶץ
  choice: தேசத்தின் மக்களினங்கள்
  rationale: עמים என்ற பன்மையையும் தேசத்திலிருந்த பல்வேறு மக்கள் குழுக்களையும் பிரதிபலிக்கிறது.
- source_word: לַעֲשׂוֹת בָּהֶם כִּרְצוֹנָם
  choice: அவர்கள் தங்கள் விருப்பப்படி அவர்களை நடத்தும்படியாக
  rationale: இஸ்ரவேலர் தங்கள் விருப்பத்தின்படி அவர்களைக் கையாளும் அதிகாரம் பெற்றனர் என்ற பொருளைத் தெளிவான தமிழில் தருகிறது.
theological_decisions:
- issue: ‘மகன்கள்’ என்பதன் சுட்டுப்பொருள்
  choice: கானானுக்குள் நுழைந்த இஸ்ரவேலின் சந்ததியினரைக் குறிக்கும் குடும்பவழிச் சொல்லாக ‘அந்த மகன்கள்’ என வைக்கப்பட்டது.
  alternative: ‘இஸ்ரவேலர்கள்’ அல்லது ‘பிள்ளைகள்’
  rationale: முந்தைய தலைமுறையோடு உள்ள உடன்படிக்கை மற்றும் வம்சத் தொடர்ச்சியை வெளிப்படுத்தும் எபிரெய மொழியை விளக்கமாக மாற்றாமல் பாதுகாக்கிறது.
- issue: வெற்றிகொள்ளும் மொழியின் வலிமை
  choice: ‘பணியச் செய்து’ மற்றும் ‘கையில் ஒப்புக்கொடுத்தீர்’ என்ற வலிமையான சொற்கள் தக்கவைக்கப்பட்டன.
  alternative: ‘அவர்களை வெல்ல உதவினீர்’ போன்ற மென்மையான மொழி
  rationale: கானான் கைப்பற்றப்பட்டதை நேரடியாக இறைவனுடைய செயலாக வசனம் கூறுகிறது; மூலத்தின் இராணுவ-அரசியல் வலிமையை மென்மைப்படுத்தவில்லை.
- issue: כִּרְצוֹנָם என்பதிலுள்ள ஒழுக்க மதிப்பீடு
  choice: ‘தங்கள் விருப்பப்படி’ என்று மதிப்பீடு சேர்க்காமல் மொழிபெயர்க்கப்பட்டது.
  alternative: ‘அவர்கள் விரும்பிய எதையும்’ அல்லது ஒழுக்க ரீதியாக விளக்கமளிக்கும் சொற்றொடர்
  rationale: இங்கு அவர்களின் செயல்களை வசனம் ஒழுக்க ரீதியாக அங்கீகரிக்கிறதா என்பதைக் குறிப்பாகத் தீர்மானிக்காமல், பெற்ற அதிகாரத்தின் பரப்பை மட்டும் மூல உரை கூறுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், ஜெபத்தின் மரியாதைத் தொனிக்காக இறைவனை நோக்கும் வினைகளில் ‘நீர்/செய்தீர்’ வடிவம் பயன்படுத்தப்பட்டது. ‘தேசம்’, ‘கானானியர்கள்’, ‘அரசர்கள்’ ஆகியவை வேதாகமச் சூழலுக்கு ஏற்ற கண்ணியமான பொதுநடைச் சொற்கள். மூலத்தின் குடும்பவழி மொழியும் வெற்றிகொள்ளும் வலிமையான மொழியும் தக்கவைக்கப்பட்டுள்ளன.
