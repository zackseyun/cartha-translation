  source_fidelity: 'வரைவின் மையப் பொருள் எபிரெய மூலத்தோடு ஒத்துள்ளது: மகன்கள் தேசத்தை உடைமையாக்கினர்; தேவன் கானானியர்களை அடக்கி, அவர்களையும் அவர்களுடைய அரசர்களையும் தேசத்து மக்களினங்களையும் இஸ்ரவேலரின் அதிகாரத்திற்குள் ஒப்புக்கொடுத்தார். ஆனால் இறுதி வாக்கியத்தில் உள்ள ‘இப்படிச் செய்தீர்’ மூலத்தில் வெளிப்படையாக இல்லாத சுருக்கமான காரணச் செயலைச் சேர்க்கிறது; மேலும் ‘நடத்தும்படியாக’ என்பது לַעֲשׂוֹת בָּהֶם என்பதன் விரிவான ‘அவர்களோடு செய்ய/கையாள’ என்ற பொருளைச் சற்றுக் குறுக்குகிறது.'
  naturalness: ‘தேசத்தைக் கைப்பற்றினார்கள்’ என்பது நிலத்தை உடைமையாக்கிக் கொண்டார்கள் என்பதைக் காட்டிலும் நவீனத் தமிழில் சுருக்கமாகவும் இச்சூழலில் இயல்பாகவும் உள்ளது. இறுதிப் பகுதியை ‘அவர்களைத் தங்கள் விருப்பப்படி கையாளும்படி’ என அமைத்தால், அது முந்தைய ‘ஒப்புக்கொடுத்தீர்’ என்பதுடன் இயல்பாக இணையும்.
