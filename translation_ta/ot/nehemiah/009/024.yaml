- from: ஆகவே, அந்த மகன்கள் வந்து தேசத்தைத் தங்களுடையதாக்கிக்கொண்டார்கள்[a]. நீர் அவர்களுக்கு முன்பாக அந்தத் தேசத்தின் குடிகளான கானானியர்களைப் பணியச் செய்து, அவர்களையும் அவர்களுடைய அரசர்களையும் தேசத்தின் மக்களினங்களையும் அவர்களுடைய கையில் ஒப்புக்கொடுத்தீர்[b]; அவர்கள் தங்கள் விருப்பப்படி அவர்களை நடத்தும்படியாக இப்படிச் செய்தீர்[c].
  to: ஆகவே, அந்த மகன்கள் வந்து தேசத்தைக் கைப்பற்றினார்கள்[a]. நீர் அவர்களுக்கு முன்பாக தேசத்தின் குடிகளான கானானியர்களை அடக்கி, அவர்களையும் அவர்களுடைய அரசர்களையும் தேசத்தின் மக்களினங்களையும் அவர்களுடைய கையில் ஒப்புக்கொடுத்தீர்[b], அவர்கள் அவர்களைத் தங்கள் விருப்பப்படி கையாளும்படி[c].
