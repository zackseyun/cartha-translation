source:
  edition: WLC
  text: וּ/כְ/נ֣וֹחַ לָ/הֶ֔ם יָשׁ֕וּבוּ לַ/עֲשׂ֥וֹת רַ֖ע לְ/פָנֶ֑י/ךָ וַ/תַּֽעַזְבֵ֞/ם בְּ/יַ֤ד אֹֽיְבֵי/הֶם֙ וַ/יִּרְדּ֣וּ בָ/הֶ֔ם וַ/יָּשׁ֨וּבוּ֙ וַ/יִּזְעָק֔וּ/ךָ וְ/אַתָּ֞ה מִ/שָּׁמַ֧יִם תִּשְׁמַ֛ע וְ/תַצִּילֵ֥/ם כְּֽ/רַחֲמֶ֖י/ךָ רַבּ֥וֹת עִתִּֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/028.yaml
  text: But when they had rest, they again did evil before you; so you left them in the power of their enemies[a], who ruled over them. Then they returned and cried out to you, and from heaven you heard and delivered them many times according to your mercies.
translation:
  language: ta
  text: ஆனால் அவர்களுக்கு ஓய்வு கிடைத்தபோது, அவர்கள் மறுபடியும் உமக்கு முன்பாகத் தீமை செய்தார்கள். ஆகவே, நீர் அவர்களை அவர்களுடைய பகைவர்களின் அதிகாரத்தில் விட்டுவிட்டீர்[a]; அந்தப் பகைவர்கள் அவர்கள்மேல் ஆட்சி செலுத்தினர். பின்பு அவர்கள் திரும்பி, உம்மை நோக்கிக் கூக்குரலிட்டார்கள். நீர் வானத்திலிருந்து கேட்டு, உமது இரக்கத்தின்படி அவர்களைப் பலமுறை விடுவித்தீர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மொழியில், “அவர்களுடைய பகைவர்களின் கையில்” என்று உள்ளது; இது அவர்களுடைய அதிகாரத்தையோ கட்டுப்பாட்டையோ குறிக்கும் மரபுத்தொடர்.
    reason: cultural_note
lexical_decisions:
- source_word: וּכְנוֹחַ לָהֶם
  choice: ஆனால் அவர்களுக்கு ஓய்வு கிடைத்தபோது
  rationale: כְּ introduces the circumstance in which they relapsed; it does not require the stronger sense ‘as soon as.’ ‘ஓய்வு கிடைத்தபோது’ is natural Tamil and retains the temporal relation.
- source_word: יָשׁוּבוּ לַעֲשׂוֹת רַע
  choice: அவர்கள் மறுபடியும் ... தீமை செய்தார்கள்
  rationale: With the infinitive, שׁוב expresses repetition here. Tamil ‘மறுபடியும்’ communicates that iterative force without the wooden and potentially misleading ‘திரும்பி தீமை செய்ய.’
- source_word: לְפָנֶיךָ
  choice: உமக்கு முன்பாக
  rationale: Retains the source image of action before God's presence without narrowing it to either mere sight or explicit hostility.
- source_word: וַתַּעַזְבֵם
  choice: நீர் அவர்களை ... விட்டுவிட்டீர்
  rationale: Expresses withdrawal of protection and its serious consequence without implying irrevocable desertion.
- source_word: בְּיַד אֹיְבֵיהֶם
  choice: அவர்களுடைய பகைவர்களின் அதிகாரத்தில்
  rationale: The Hebrew ‘in the hand of’ is an idiom for power or control. The idiomatic Tamil rendering is clear, while the literal image is preserved in a footnote.
- source_word: וַיִּרְדּוּ בָהֶם
  choice: அந்தப் பகைவர்கள் அவர்களை ஆட்சி செய்தார்கள்
  rationale: The verb denotes exercising dominion. Repeating ‘அந்தப் பகைவர்கள்’ avoids an ambiguous Tamil pronoun reference.
- source_word: וַיָּשׁוּבוּ
  choice: பின்பு அவர்கள் திரும்பி
  rationale: Unlike the earlier idiomatic use with an infinitive, this occurrence retains the lexical idea of returning. The Tamil wording preserves that movement without explicitly adding ‘to God.’
- source_word: וַיִּזְעָקוּךָ
  choice: உம்மை நோக்கிக் கூக்குரலிட்டார்கள்
  rationale: Conveys a desperate cry directed to God, without explicitly adding ‘for help,’ though that is contextually implied.
- source_word: מִשָּׁמַיִם תִּשְׁמַע
  choice: நீர் வானத்திலிருந்து கேட்டு
  rationale: Preserves the fronted source location and renders the repeated past action naturally within the summary narrative.
- source_word: וְתַצִּילֵם
  choice: அவர்களைப் ... விடுவித்தீர்
  rationale: In context, נצל refers to release or rescue from enemy domination. ‘விடுவித்தீர்’ fits the historical setting without importing broader doctrinal senses.
- source_word: כְּרַחֲמֶיךָ רַבּוֹת עִתִּים
  choice: உமது இரக்கத்தின்படி அவர்களைப் பலமுறை
  rationale: ‘பல’ modifies ‘முறை/தடவைகள்,’ not ‘இரக்கம்.’ Singular ‘இரக்கம்’ is idiomatic modern Tamil for the Hebrew plural of compassion, while ‘பலமுறை’ correctly carries רַבּוֹת.
theological_decisions:
- issue: Divine abandonment language
  choice: நீர் அவர்களை அவர்களுடைய பகைவர்களின் அதிகாரத்தில் விட்டுவிட்டீர்
  alternative: நீர் அவர்களை அவர்களுடைய பகைவர்களிடம் கைவிட்டீர்
  rationale: ‘விட்டுவிட்டீர்’ preserves the judicial withdrawal and its severity but avoids suggesting absolute or permanent divine forsaking, which the ensuing repeated rescue rules out.
- issue: The two uses of שׁוב
  choice: The first is rendered as repetition (‘மறுபடியும்’), while the second is rendered lexically (‘திரும்பி’).
  alternative: Render both occurrences with ‘திரும்பி.’
  rationale: The first occurrence forms an idiom with ‘to do evil,’ whereas the second narrates a return followed by crying to God. Distinguishing them preserves the source syntax and the narrative-theological tension without making repentance more explicit than the Hebrew does.
- issue: Iterative force of the final imperfect verbs
  choice: கேட்டு ... பலமுறை விடுவித்தீர்
  alternative: பலமுறை கேட்டு விடுவிப்பீர்
  rationale: The prayer summarizes repeated past acts. Tamil past forms together with ‘பலமுறை’ naturally convey iteration without turning the statement into a timeless promise.
- issue: Attachment of רַבּוֹת
  choice: பலமுறை (‘many times’)
  alternative: மிகுந்த இரக்கத்தின்படி (‘according to abundant mercy’)
  rationale: The feminine plural adjective רַבּוֹת agrees with עִתִּים (‘times’), not with רַחֲמֶיךָ. The translation therefore avoids the material attachment error of making the mercies ‘abundant.’
translation_notes:
  register: நவீனத் தரமான, மரியாதைமிக்க தமிழ் பயன்படுத்தப்பட்டுள்ளது. தேவனை நோக்கிய ஒருமை மரியாதை வடிவங்கள் (‘நீர்,’ ‘உமது,’ ‘உம்மை’) தொடர்ச்சியாக உள்ளன. வாக்கியங்கள் சாதாரண வாசகர்களுக்குத் தெளிவாக இருக்கும்படி பிரிக்கப்பட்டுள்ளன; அதேவேளை ‘உமக்கு முன்பாக,’ ‘வானத்திலிருந்து’ போன்ற முக்கிய மூலமொழிப் படிமங்கள் பாதுகாக்கப்பட்டுள்ளன.
