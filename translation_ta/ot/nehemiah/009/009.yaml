  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/תֵּ֛רֶא אֶת עֳנִ֥י אֲבֹתֵ֖י/נוּ בְּ/מִצְרָ֑יִם וְ/אֶת זַעֲקָתָ֥/ם שָׁמַ֖עְתָּ עַל יַם סֽוּף־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/009.yaml
  text: You saw the affliction of our fathers in Egypt[a], and you heard their cry at the Red Sea.
translation:
  language: ta
  text: எகிப்தில் எங்கள் தந்தையரின் துன்பத்தை நீர் கண்டீர்; செங்கடல்[a] அருகே அவர்கள் எழுப்பிய கூக்குரலைக் கேட்டீர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரெயத்தில்: “நாணல் கடல்.” பாரம்பரியமாக “செங்கடல்” என்று மொழிபெயர்க்கப்படுகிறது.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּרֶא
  choice: நீர் கண்டீர்
  rationale: ראה என்பதன் நேரடிப் பொருளான ‘காணுதல்’ என்பதையும், தேவன் அவர்களுடைய நிலையை அறிந்து கவனித்தார் என்ற சூழல்சார் நுணுக்கத்தையும் இயல்பாகத் தக்கவைக்கிறது.
- source_word: עֳנִי
  choice: அனுபவித்த துன்பம்
  rationale: עֳנִי என்பது வேதனை, ஒடுக்கப்பட்ட நிலை, துயரம் ஆகியவற்றைக் குறிக்கலாம். ‘துன்பம்’ காரணத்தைத் தேவையின்றி மிகைப்படுத்தாமல் பரந்த பொருளைத் தருகிறது; தமிழில் இயல்பிற்காக ‘அனுபவித்த’ சேர்க்கப்பட்டுள்ளது.
- source_word: אֲבֹתֵינוּ
  choice: எங்கள் தந்தையர்
  rationale: எபிரெயச் சொல் ஆண்பால் பன்மையில் சமூகத்தின் முன்னோர்களைக் குறிக்கிறது. ‘தந்தையர்’ அதன் வடிவத்தையும் ஜெபத்தின் மரியாதைமிக்க நடையையும் காக்கிறது.
- source_word: בְּמִצְרָיִם
  choice: எகிப்தில்
  rationale: இஸ்ரவேலரின் துன்பம் நிகழ்ந்த இடத்தைச் சுட்டும் நேரடியான இடவியல் தொடர்.
- source_word: זַעֲקָתָם
  choice: அவர்கள் எழுப்பிய கூக்குரல்
  rationale: זְעָקָה துயரத்தில் உதவி கேட்டு எழுப்பப்படும் உரத்த அழுகுரலைக் குறிக்கிறது. ‘கூக்குரல்’ அந்த அவசரத்தையும் தீவிரத்தையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: שָׁמַעְתָּ
  choice: கேட்டீர்
  rationale: שמע இங்கு முறையீட்டைக் கேட்டு கவனித்தல் என்ற நுணுக்கம் கொண்டிருந்தாலும், ‘கேட்டீர்’ மூலத்தின் எளிமையையும் ஜெபத்தின் நேரடி அழைப்பையும் காக்கிறது.
- source_word: עַל
  choice: அருகே
  rationale: இடப்பெயருடன் வரும் עַל இங்கு ‘அருகில்/கரையில்’ என்ற இடவியல் உறவைத் தருகிறது. ‘அருகே’ தமிழில் இயல்பாகவும் தேவையற்ற துல்லியத்தைச் சேர்க்காமலும் உள்ளது.
- source_word: יַם סוּף
  choice: செங்கடல்
  rationale: தமிழ் வேதாகம மற்றும் பொதுப் பயன்பாட்டில் அறியப்பட்ட பாரம்பரியப் பெயர் ‘செங்கடல்’. எபிரெயச் சொற்களின் நேரடிப் பொருளான ‘நாணற்கடல்’ அடிக்குறிப்பில் வழங்கப்படுகிறது.
