    rationale: Although the Hebrew deliberately uses cognate legal terminology, repeating “கட்டளை” as both object and verb is awkward in Tamil. “விதித்தீர்” communicates the source verb’s binding, authoritative sense naturally and preserves the three distinct legal terms.
