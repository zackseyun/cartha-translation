base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/014.yaml
  text: You made your holy Sabbath known to them[b][a], and you commanded them commandments and statutes and a law by the hand of Moses your servant.
translation:
  language: ta
  text: உமது பரிசுத்த ஓய்வுநாளை அவர்களுக்கு அறியச் செய்தீர்; அவர்களுக்குக் கட்டளைகளையும் நியமங்களையும் சட்டத்தையும் உமது ஊழியனாகிய மோசேயின் மூலம்[b] விதித்தீர்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘சட்டம்’ என்பதற்குப் பதிலாக ‘போதனை’ என்றும் மொழிபெயர்க்கலாம்; תוֹרָה என்பது சட்டக் கடமையோடு கற்பித்தலையும் குறிக்கக்கூடும்.
    reason: lexical_alternative
  - marker: b
    text: 'சொல்லுக்குச் சொல்: ‘உமது ஊழியனாகிய மோசேயின் கையினால்’; இது ‘உமது ஊழியனாகிய மோசேயின் மூலம்’ என்று பொருள்படும் எபிரெய மரபுத்தொடர்.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׁבַּת קָדְשְׁךָ
  choice: உமது பரிசுத்த ஓய்வுநாள்
  rationale: שַׁבַּת என்பதன் உடன்படிக்கை மற்றும் வழிபாட்டுச் சிறப்பை ‘ஓய்வுநாள்’ தெளிவாகக் காக்கிறது; קָדְשְׁךָ-வின் பரிசுத்தத் தன்மையும் உரிமைச் சுட்டும் பின்னொட்டும் ‘உமது பரிசுத்த’ என வெளிப்படுகின்றன.
- source_word: הוֹדַעַתָ
  choice: அறியச் செய்தீர்
  rationale: ידע என்பதன் ஹிஃபில் வடிவிலுள்ள காரணவினைப் பொருளை நேரடியாகவும் இயல்பான தமிழிலும் காக்கிறது.
- source_word: מִצְוֹת
  choice: கட்டளைகள்
  rationale: இச்சொல்லின் அதிகாரபூர்வமான கட்டளைப் பொருளையும் உடன்படிக்கைச் சட்டச் சூழலையும் காக்கிறது.
- source_word: חֻקִּים
  choice: நியமங்கள்
  rationale: வகுத்து நிலைநாட்டப்பட்ட விதிமுறைகள் அல்லது சட்ட ஏற்பாடுகள் என்ற பொருளைத் தருகிறது; அருகிலுள்ள ‘கட்டளைகள்’, ‘சட்டம்’ ஆகியவற்றோடு வேறுபாட்டையும் காக்கிறது.
- source_word: תוֹרָה
  choice: சட்டம்
  rationale: சட்டவியல் சொற்களின் தொடரில் ‘சட்டம்’ என்பது சூழலுக்குப் பொருத்தமான முதன்மைப் பொருள்; ‘போதனை’ என்ற விரிவான பொருள் அடிக்குறிப்பில் காக்கப்படுகிறது.
- source_word: צִוִּיתָ
  choice: கட்டளையிட்டீர்
  rationale: צוה என்பதன் நேரடியான அதிகாரபூர்வ வினைப்பொருளை மென்மைப்படுத்தாமல் காக்கிறது.
- source_word: בְּיַד מֹשֶׁה עַבְדֶּךָ
  choice: உமது ஊழியனாகிய மோசேயின் மூலம்
  rationale: ‘கையினால்’ என்ற எபிரெய வழக்குச் சொல்லின் கருவி அல்லது இடையீட்டு முகவர் பொருளை நவீன தமிழில் இயல்பாக வெளிப்படுத்துகிறது; சொல்லுக்குச் சொல் வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: מִצְוֹת וְחֻקִּים וְתוֹרָה என்ற சட்டவியல் மும்மைத் தொடரை மொழிபெயர்த்தல்
  choice: கட்டளைகளையும் நியமங்களையும் சட்டத்தையும்
  alternative: கட்டளைகளையும் விதிமுறைகளையும் போதனையையும்
  rationale: மூன்று எபிரெயச் சொற்களையும் ஒன்றாகக் கரைத்துவிடாமல் அவற்றின் தனித்த சட்ட மற்றும் போதனை நுணுக்கங்களை இயன்றவரை காக்கிறது. அதேவேளையில் תוֹרָה-வின் ‘போதனை’ என்ற சாத்தியப் பொருள் அடிக்குறிப்பில் வெளிப்படையாக வைக்கப்படுகிறது.
- issue: בְּיַד என்ற முகவர் குறிக்கும் மரபுத்தொடர்
  choice: மோசேயின் மூலம்
  alternative: மோசேயின் கையினால்
  rationale: இங்கு கடவுள் மோசேயை இடையீட்டு முகவராகப் பயன்படுத்தினார் என்பதே மரபுத்தொடரின் பொருள். ‘மூலம்’ இதை இயல்பாகத் தெரிவிக்கிறது; மூலத்தின் உருவக வடிவம் அடிக்குறிப்பில் காக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான வழிபாட்டு நடையுடன் அமைக்கப்பட்டது. ‘நீர்/உமது’ மரியாதை ஒருமை கடவுளை நோக்கிய ஜெபச் சூழலைத் தொடர்கிறது. மூலத்தின் சட்டவியல் மும்மைத் தொடர் தமிழிலும் தனித்த சொற்களாகப் பாதுகாக்கப்பட்டுள்ளது.
