source:
  edition: WLC
  text: וּ/מָצָ֣אתָ אֶת לְבָב/וֹ֮ נֶאֱמָ֣ן לְ/פָנֶי/ךָ֒ וְ/כָר֨וֹת עִמּ֜/וֹ הַ/בְּרִ֗ית לָ/תֵ֡ת אֶת אֶרֶץ֩ הַ/כְּנַעֲנִ֨י הַ/חִתִּ֜י הָ/אֱמֹרִ֧י וְ/הַ/פְּרִזִּ֛י וְ/הַ/יְבוּסִ֥י וְ/הַ/גִּרְגָּשִׁ֖י לָ/תֵ֣ת לְ/זַרְע֑/וֹ וַ/תָּ֨קֶם֙ אֶת דְּבָרֶ֔י/ךָ כִּ֥י צַדִּ֖יק אָֽתָּה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/008.yaml
  text: You found his heart faithful before you[a], and made a covenant with him to give the land of the Canaanite, the Hittite, the Amorite, the Perizzite, the Jebusite, and the Girgashite—to give it to his offspring. And you have fulfilled your words[c][b], for you are righteous.
translation:
  language: ta
  text: அவருடைய இதயம் உமக்கு முன்பாக உண்மையுள்ளதாக இருப்பதை நீர் கண்டீர். கானானியர், ஏத்தியர், எமோரியர், பெரிசியர், எபூசியர், கிர்காசியர் ஆகியோரின் நாட்டை—அதை அவருடைய சந்ததிக்குக்[a] கொடுப்பதாக—அவருடன் உடன்படிக்கை செய்தீர். நீர் உமது வார்த்தைகளை நிறைவேற்றினீர்[b]; ஏனெனில், நீர் நீதியுள்ளவர்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அவருடைய வழித்தோன்றல்களுக்கு.’ எபிரெய ‘விதை/சந்ததி’ என்பது ஒருமை வடிவிலுள்ள கூட்டுப்பெயர்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘உமது வார்த்தைகளை நிலைநிறுத்தினீர்’ அல்லது ‘உறுதிப்படுத்தினீர்.’
    reason: lexical_alternative
  - marker: c
    text: அல்லது, ‘நீர் நியாயமானவர்.’
    reason: alternative_reading
lexical_decisions:
- source_word: וּמָצָאתָ
  choice: நீர் கண்டீர்
  rationale: מצא என்பதன் இயல்பான பொருளான ‘காணுதல்’ என்பதைக் காத்து, ஆபிரகாமின் உள்ளார்ந்த நிலையை தேவன் அறிந்தார் என்ற சூழலுக்கும் பொருந்துகிறது.
- source_word: לְבָבוֹ נֶאֱמָן לְפָנֶיךָ
  choice: அவருடைய இதயம் உமக்கு முன்பாக உண்மையுள்ளதாக இருப்பதை
  rationale: לֵבָב என்பதற்கு ‘இதயம்’ என்றும் נֶאֱמָן என்பதற்கு நம்பகத்தன்மை மற்றும் விசுவாசத்தன்மையை உள்ளடக்கும் ‘உண்மையுள்ளது’ என்றும் வழங்கப்பட்டுள்ளது. לְפָנֶיךָ என்பதன் உறவுசார், மதிப்பீட்டுச் சாயலை ‘உமக்கு முன்பாக’ காக்கிறது.
- source_word: וְכָרוֹת עִמּוֹ הַבְּרִית
  choice: அவருடன் உடன்படிக்கை செய்தீர்
  rationale: כרת ברית என்ற எபிரெய மரபுத்தொடரின் பொருள் இயல்பான நவீன தமிழில் ‘உடன்படிக்கை செய்தல்’ எனத் தரப்படுகிறது; சொற்சொல்லான ‘உடன்படிக்கையை வெட்டுதல்’ தவிர்க்கப்படுகிறது.
- source_word: לָתֵת ... לָתֵת לְזַרְעוֹ
  choice: நாட்டை—அதை அவருடைய சந்ததிக்குக் கொடுப்பதாக—
  rationale: எபிரெயத்தில் לָתֵת இருமுறை வருவதைக் கோடிட்ட இடைச்சொற்றொடர் மூலம் இயன்றவரை வெளிப்படுத்தி, உடன்படிக்கையின் உள்ளடக்கத்தையும் பெறுபவரையும் தெளிவாக்குகிறது.
- source_word: אֶרֶץ הַכְּנַעֲנִי ... וְהַגִּרְגָּשִׁי
  choice: கானானியர், ஏத்தியர், எமோரியர், பெரிசியர், எபூசியர், கிர்காசியர் ஆகியோரின் நாடு
  rationale: இனப்பெயர்களின் எபிரெய ஒருமை-கூட்டுப்பொருள் தமிழில் வழக்கமான மக்கள் பெயர்களால் வழங்கப்படுகிறது; ‘நாடு’ என்பது אֶרֶץ என்பதன் நிலப்பரப்பு சார்ந்த பொருளைத் தெளிவாகக் காட்டுகிறது.
- source_word: לְזַרְעוֹ
  choice: அவருடைய சந்ததிக்கு
  rationale: זֶרַע என்பது இலக்கணத்தில் ஒருமையாக இருந்தாலும் கூட்டுப்பொருளில் வருங்கால வழித்தோன்றல்களைக் குறிக்கிறது. ‘சந்ததி’ இந்த இரு அம்சங்களையும் இயல்பாகத் தாங்குகிறது.
- source_word: וַתָּקֶם אֶת דְּבָרֶיךָ
  choice: நீர் உமது வார்த்தைகளை நிறைவேற்றினீர்
  rationale: קום + ‘வார்த்தைகள்’ என்பது அவற்றை நிலைநிறுத்தி நிகழச் செய்தல் எனும் பொருளைக் கொண்டது. இச்சூழலில் ‘நிறைவேற்றினீர்’ வாக்குறுதி நடைமுறைக்கு வந்ததை இயல்பாகச் சொல்கிறது; דְּבָרֶיךָ என்பதன் பன்மை ‘வார்த்தைகள்’ எனக் காக்கப்படுகிறது.
- source_word: כִּי צַדִּיק אָתָּה
  choice: ஏனெனில், நீர் நீதியுள்ளவர்
  rationale: כִּי என்பதன் காரணவிளக்கப் பொருளை ‘ஏனெனில்’ வெளிப்படுத்துகிறது. צַדִּיק என்பதற்கு தேவனுடைய ஒழுக்க மற்றும் உடன்படிக்கை நேர்மையை விரிவாகக் குறிக்கும் ‘நீதியுள்ளவர்’ பயன்படுத்தப்பட்டுள்ளது.
theological_decisions:
- issue: தேவனைச் சுட்டும் צַדִּיק என்பதன் மொழிபெயர்ப்பு
  choice: நீதியுள்ளவர்
  alternative: நியாயமானவர்
  rationale: இரண்டும் சாத்தியமானவை. ‘நியாயமானவர்’ நீதித்தீர்ப்பு சார்ந்த பொருளை முன்னிறுத்தலாம்; ‘நீதியுள்ளவர்’ தேவனுடைய ஒழுக்க நேர்மையையும் உடன்படிக்கையை உண்மையாய் நிறைவேற்றுவதையும் விரிவாகக் காக்கிறது.
- issue: வார்த்தைகளை ‘நிறைவேற்றுதல்’ அல்லது ‘நிலைநிறுத்துதல்’
  choice: நிறைவேற்றினீர்
  alternative: நிலைநிறுத்தினீர் / உறுதிப்படுத்தினீர்
  rationale: קום என்பதில் நிலைநிறுத்துதல் என்ற அடிப்படைச் சாயல் இருந்தாலும், இங்கு உடன்படிக்கையில் கூறியதை நிகழச் செய்ததே சூழலின் மையம். ஆகவே ‘நிறைவேற்றினீர்’ தேர்ந்தெடுக்கப்பட்டு மாற்றுப் பொருள் அடிக்குறிப்பில் காக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான வேதாகம நடையுடன் மொழிபெயர்க்கப்பட்டது. தேவனை நோக்கிய உரையில் ‘நீர்/உமது’ என்ற மரியாதை வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன. எபிரெயத்தின் இருமுறை வரும் ‘கொடுக்க’ என்ற அமைப்பு கோடிட்ட இடைச்சொற்றொடரால் காக்கப்பட்டுள்ளது; இனப்பெயர்கள் தமிழில் நிலைபெற்ற வடிவங்களில் தரப்பட்டுள்ளன.
