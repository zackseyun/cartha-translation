source:
  edition: WLC
  text: וַֽ/יִּלְכְּד֞וּ עָרִ֣ים בְּצֻרוֹת֮ וַ/אֲדָמָ֣ה שְׁמֵנָה֒ וַ/יִּֽירְשׁ֡וּ בָּתִּ֣ים מְלֵֽאִים כָּל ט֠וּב בֹּר֨וֹת חֲצוּבִ֜ים כְּרָמִ֧ים וְ/זֵיתִ֛ים וְ/עֵ֥ץ מַאֲכָ֖ל לָ/רֹ֑ב וַ/יֹּאכְל֤וּ וַֽ/יִּשְׂבְּעוּ֙ וַ/יַּשְׁמִ֔ינוּ וַ/יִּֽתְעַדְּנ֖וּ בְּ/טוּבְ/ךָ֥ הַ/גָּדֽוֹל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/025.yaml
  text: They captured fortified cities and fertile land[a], and took possession of houses full of every good thing, hewn cisterns, vineyards, olive trees, and fruit trees in abundance. So they ate and were filled and grew fat[c][b], and they delighted themselves in your great goodness.
translation:
  language: ta
  text: அவர்கள் அரணமைக்கப்பட்ட நகரங்களையும் வளமான நிலத்தையும்[a] கைப்பற்றினார்கள். எல்லா நல்ல பொருள்களும் நிறைந்த வீடுகள், குடைந்து அமைக்கப்பட்ட நீர்த்தொட்டிகள், திராட்சைத்தோட்டங்கள், ஒலிவ மரங்கள், ஏராளமான பழமரங்கள் ஆகியவற்றைத் தங்கள் உடைமையாக்கிக்கொண்டார்கள். அவர்கள் உண்டு நிறைவடைந்து[b], கொழுத்தார்கள்; உமது பெரும் நன்மையில் இன்புற்றார்கள்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘செழிப்பான நிலம்’; சொல்லுக்குச் சொல், ‘கொழுத்த நிலம்.’
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘திருப்தியடைந்து.’
    reason: lexical_alternative
  - marker: c
    text: அல்லது, ‘உமது பெரும் வளத்தில் செழித்து வாழ்ந்தார்கள்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּלְכְּדוּ
  choice: கைப்பற்றினார்கள்
  rationale: לכד என்பது நகரங்களைப் போரில் பிடித்தல் அல்லது கைப்பற்றுதல் என்னும் பொருளுடையது; இச்சூழலில் ‘கைப்பற்றினார்கள்’ தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: עָרִים בְּצֻרוֹת
  choice: அரண்சூழ்ந்த நகரங்கள்
  rationale: בצר நகரங்கள் பாதுகாப்பு அரண்களால் வலுப்படுத்தப்பட்டிருந்ததைக் குறிக்கிறது; இந்தத் தமிழ் தொடர் இராணுவப் பொருளை இயல்பாகத் தருகிறது.
- source_word: אֲדָמָה שְׁמֵנָה
  choice: வளமான நிலம்
  rationale: சொல்லுக்குச் சொல் ‘கொழுத்த நிலம்’; இது செழிப்பான, விளைச்சல் மிக்க நிலத்தைக் குறிக்கும் எபிரெய மொழிவழக்கு. ‘வளமான நிலம்’ அதன் இயல்பான தமிழ் இணை.
- source_word: וַיִּירְשׁוּ
  choice: தங்கள் உடைமையாக்கிக்கொண்டார்கள்
  rationale: ירשׁ இங்கு வெற்றிக்குப் பின் ஏற்கெனவே இருந்த சொத்துகளை வசப்படுத்தி உரிமையாக்கிக்கொள்வதைக் குறிக்கிறது; ‘சுதந்தரித்தார்கள்’ என்பதைக் காட்டிலும் சூழலுக்கு இத்தேர்வு தெளிவானது.
- source_word: בָּתִּים מְלֵאִים כָּל טוּב
  choice: எல்லா நன்மைகளும் நிறைந்த வீடுகள்
  rationale: כָּל טוּב வாழ்விற்குத் தேவையான பலவகை நல்ல பொருட்களையும் வளத்தையும் விரிவாகக் குறிக்கிறது.
- source_word: בֹּרוֹת חֲצוּבִים
  choice: வெட்டி அமைக்கப்பட்ட நீர்த்தொட்டிகள்
  rationale: בּוֹר இங்கு தண்ணீரைச் சேமிக்கும் தொட்டி; חצוב வெட்டப்பட்ட அல்லது குடையப்பட்டதைக் குறிக்கிறது. மூலத்தில் இல்லாத ‘ஏற்கெனவே’ என்பதைச் சேர்க்கவில்லை.
- source_word: כְּרָמִים וְזֵיתִים וְעֵץ מַאֲכָל לָרֹב
  choice: திராட்சைத்தோட்டங்கள், ஒலிவ மரங்கள், ஏராளமான கனிமரங்கள்
  rationale: வேளாண் சொத்துகளின் பட்டியலைத் தெளிவாகக் காக்கிறது; עֵץ מַאֲכָל என்பது உண்ணத்தக்க கனிகளைத் தரும் மரங்களையும் לָרֹב அவற்றின் மிகுதியையும் குறிக்கிறது.
- source_word: וַיֹּאכְלוּ וַיִּשְׂבְּעוּ
  choice: உண்டு நிறைவடைந்து
  rationale: שׂבע வயிறார உண்டு நிறைவு பெற்ற நிலையைச் சுட்டுகிறது; ‘நிறைவடைந்து’ அதன் உடல்சார்ந்த படிமத்தையும் திருப்தி நுணுக்கத்தையும் தக்கவைக்கிறது.
- source_word: וַיַּשְׁמִינוּ
  choice: கொழுத்தார்கள்
  rationale: வினைச்சொல் நேரடியாகக் கொழுத்ததைக் குறிக்கிறது. வளமும் மிகுதியும் உடலில் வெளிப்பட்டதாகக் கூறும் எபிரெயப் படிமத்தை, அவசியமில்லாத ஒழுக்கத் தீர்ப்பைச் சேர்க்காமல் தக்கவைக்கிறது.
- source_word: וַיִּתְעַדְּנוּ
  choice: இன்புற்றார்கள்
  rationale: עדן என்ற வேரிலிருந்து வரும் இவ்வடிவம் இன்பமாக வாழ்தல், மகிழ்ந்து அனுபவித்தல் என்ற பொருளைத் தருகிறது; ‘இன்புற்றார்கள்’ சுருக்கமாகவும் கண்ணியமாகவும் உள்ளது.
theological_decisions:
- issue: בְּטוּבְךָ הַגָּדוֹל என்பதில் இறைவனுடைய நன்மையும் பொருள் வளமும் இணைந்திருக்கும் நுணுக்கம்
  choice: உமது பெரும் நன்மையில்
  alternative: உமது பெரும் வளத்தினால்
  rationale: טוּב என்பது இச்சூழலில் இறைவன் வழங்கிய பொருள் வளத்தையும், அதைவிட விரிவாக அவருடைய நன்மையையும் குறிக்கக்கூடும். ‘நன்மையில்’ அந்த விரிவைத் தக்கவைக்கிறது; ב முன்னிடைச்சொல்லின் காரண அல்லது சூழ்நிலைப் பொருளை ஒற்றைப் பொருளாகக் குறுக்கவில்லை.
- issue: וַיַּשְׁמִינוּ என்பதில் ஒழுக்கத் தீர்ப்பு உள்ளதா என்பது
  choice: கொழுத்தார்கள்
  alternative: செழிப்படைந்தார்கள்
  rationale: வசனம் நேரடியாக வளத்தின் உடல்சார்ந்த விளைவைக் கூறுகிறது; தனியாகப் பார்த்தால் கண்டனத்தை வெளிப்படையாகச் சொல்லவில்லை. ஆகவே படிமத்தைத் தக்கவைத்து, விளக்கமாக ஒழுக்கத் தீர்ப்பைச் சேர்க்கவில்லை.
translation_notes:
  register: நவீன பொதுத்தமிழில், வாசிக்க எளிதானதாயும் வழிபாட்டு வாசிப்புக்கேற்ற கண்ணியமுடையதாயும் வடிவமைக்கப்பட்டது. பட்டியலின் எபிரெய ஓட்டம் இரண்டு தமிழ் வாக்கியங்களாகப் பிரிக்கப்பட்டது. இறைவனை நோக்கும் ஒருமை மரியாதை வடிவமாக ‘உமது’ பயன்படுத்தப்பட்டது; ‘ஒலிவ’ என்பது பொதுவாக அறியப்படும் நவீன வடிவம்.
