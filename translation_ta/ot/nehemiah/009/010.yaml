base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/010.yaml
  text: You performed signs and wonders against Pharaoh[a], against all his servants, and against all the people of his land, for you knew that they acted presumptuously against them. So you made a name for yourself, as it is to this day.
translation:
  language: ta
  text: நீர் பார்வோனுக்கும், அவனுடைய எல்லா ஊழியர்களுக்கும், அவனுடைய நாட்டின் மக்கள் அனைவருக்கும் எதிராக அடையாளங்களையும் அற்புதங்களையும் செய்தீர். ஏனெனில், அவர்கள் அவர்களுக்கு எதிராக ஆணவத்தோடு நடந்துகொண்டார்கள் என்பதை நீர் அறிந்தீர். இன்றுவரை நிலைத்திருக்கும் ஒரு நாமத்தை உமக்கென்று நிலைநாட்டினீர்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתִּתֵּן
  choice: செய்தீர்
  rationale: சொல்லுக்குச் சொல் ‘கொடுத்தீர்’ எனினும், ‘அடையாளங்களையும் அற்புதங்களையும்’ என்பதோடு தமிழில் ‘செய்தீர்’ என்பது இயல்பாகவும் செயலின் பொருளைத் தெளிவாகவும் தருகிறது.
- source_word: אֹתֹת וּמֹפְתִים
  choice: அடையாளங்களையும் அற்புதங்களையும்
  rationale: தெய்வீகச் செயல்களின் சான்றளிக்கும் தன்மையையும் வியப்பூட்டும் தன்மையையும் காக்கும் வழக்கமான இணைச்சொல்.
- source_word: בְּפַרְעֹה ... וּבְכָל עֲבָדָיו ... וּבְכָל עַם אַרְצוֹ
  choice: பார்வோனுக்கும் ... எல்லா ஊழியர்களுக்கும் ... நாட்டின் மக்கள் அனைவருக்கும் எதிராக
  rationale: בְּ இங்கு நியாயத்தீர்ப்புக்குரிய இலக்கைச் சுட்டுவதால், பட்டியலின் முடிவில் ‘எதிராக’ என்பதை அமைப்பது இயல்பான தமிழில் எதிர்மறை வலிமையைப் பாதுகாக்கிறது.
- source_word: עֲבָדָיו
  choice: அவனுடைய எல்லா ஊழியர்கள்
  rationale: அரசவைக் சூழலில் பணியாளர்கள் அல்லது அதிகாரிகள் ஆகிய இரு பரப்பையும் தேவையின்றிக் குறுக்காமல் ‘ஊழியர்கள்’ வெளிப்படுத்துகிறது.
- source_word: הֵזִידוּ
  choice: ஆணவத்தோடு நடந்துகொண்டார்கள்
  rationale: பெருமிதம், துணிகரம், செருக்கு ஆகிய நிழற்பொருள்களைக் கொண்ட வினையை நவீனத் தமிழில் இயல்பாகத் தருகிறது.
- source_word: עֲלֵיהֶם
  choice: இவர்களுக்கு எதிராக
  rationale: சூழலில் இஸ்ரவேல் மக்களைச் சுட்டுவது இயல்பானது; ஆனால் மூலத்தின் மறைமுகப் பன்மைப் பிரதிப்பெயரை வெளிப்படையான ‘உமது மக்கள்’ என மாற்றாமல் காக்கிறது.
- source_word: וַתַּעַשׂ לְךָ שֵׁם
  choice: உமக்கென்று ஒரு பெயரை ஏற்படுத்திக்கொண்டீர்
  rationale: புகழையும் பெயரையும் நிலைநாட்டுதல் என்ற எபிரெய மொழிவழக்கைத் தமிழில் புரியத்தக்கவாறு, அதன் உருவகத்தைப் பாதுகாத்துத் தருகிறது.
- source_word: כְּהַיּוֹם הַזֶּה
  choice: இன்றுவரை நிலைத்திருப்பதுபோல்
  rationale: அந்தப் பெயர் நிகழ்காலம்வரை நிலைக்கிறது என்ற காலநிலைப் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: ‘அவர்கள் இவர்களுக்கு எதிராக’ என்பதில் வரும் பிரதிப்பெயர்களின் சுட்டுப்பொருள்
  choice: பார்வோனும் எகிப்தியர்களும் இஸ்ரவேலருக்கு எதிராக ஆணவமாக நடந்துகொண்டனர்; எனினும் வசனத்தில் ‘இவர்கள்’ என்ற பிரதிப்பெயரே வைக்கப்பட்டது.
  alternative: ஆணவம் கடவுளுக்கு எதிரானதாகப் பொதுவாகப் புரிந்துகொள்ளப்படலாம்; அல்லது எபிரெய மொழிநடையைப் போலச் சுட்டுப்பொருள் மறைமுகமாகவே விடப்படலாம்.
  rationale: யாத்திராகமச் சூழல் இஸ்ரவேலர்மீதான ஒடுக்குமுறையைச் சுட்டுகிறது. அதேவேளை, ‘உமது மக்கள்’ என்று விளக்கத்தை வசனத்திற்குள் சேர்க்காமல் மூலத்தின் மறைமுகத்தன்மை பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; ஜெப உரையின் மரியாதைத் தொனிக்காக ‘நீர்/உமது’ வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன. சொற்சார்ந்த துல்லியமும் இயல்பான வாசிப்பும் சமநிலைப்படுத்தப்பட்டுள்ளன.
