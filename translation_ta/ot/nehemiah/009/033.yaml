id: NEH.9.33
reference: Nehemiah 9:33
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וְ/אַתָּ֣ה צַדִּ֔יק עַ֖ל כָּל הַ/בָּ֣א עָלֵ֑י/נוּ כִּֽי אֱמֶ֥ת עָשִׂ֖יתָ וַ/אֲנַ֥חְנוּ הִרְשָֽׁעְנוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/033.yaml
  text: Yet you are righteous in all that has come upon us[a], for you have acted faithfully, but we have acted wickedly.
translation:
  language: ta
  text: ஆயினும், எங்களுக்கு நேரிட்ட எல்லாவற்றிலும் நீர் நீதியுள்ளவர். ஏனெனில், நீர் உண்மையுடன் செயல்பட்டீர்[a]; நாங்களோ தீமை செய்தோம்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லுக்குச் சொல், “நீர் உண்மையைச் செய்தீர்”; அதாவது, “நீர் உண்மையுடன் நடந்துகொண்டீர்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַתָּה
  choice: ஆயினும், நீர்
  rationale: சுற்றியுள்ள பாவ அறிக்கையுடன் உள்ள எதிர்மறை வேறுபாட்டை இயல்பான தமிழில் வெளிப்படுத்துகிறது; நேரடி விளியையும் மரியாதைப் பன்மையையும் காக்கிறது.
- source_word: צַדִּיק
  choice: நீதியுள்ளவர்
  rationale: தேவனுடைய ஒழுக்க நேர்மையையும் மக்களுக்கு நேரிட்டவற்றில் அவருடைய நீதியையும் உள்ளடக்கும் சொல்லாகும்; வெறுமனே ‘சரியானவர்’ என்று குறுக்கவில்லை.
- source_word: עַל כָּל הַ/בָּא עָלֵי/נוּ
  choice: எங்களுக்கு நேரிட்ட எல்லாவற்றிலும்
  rationale: மக்களுக்கு ஏற்பட்ட அனைத்தையும் பொறுத்தவரை தேவன் நீதியுள்ளவர் என்ற எபிரெயக் கருத்தை இயல்பான தமிழில் தருகிறது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய கூற்றுக்கான காரணத்தை அறிமுகப்படுத்துகிறது.
- source_word: אֱמֶת עָשִׂיתָ
  choice: உண்மையுடன் செயல்பட்டீர்
  rationale: சொல்லுக்கு சொல் ‘உண்மையைச் செய்தீர்’ என்ற அமைப்பின் பொருளான நம்பகமான, உண்மையுள்ள நடத்தையை இயல்பாக வெளிப்படுத்துகிறது; மூல உருவகம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: וַ/אֲנַחְנוּ
  choice: நாங்களோ
  rationale: தேவனுடைய உண்மையான செயலுக்கும் மக்களின் பொல்லாத நடத்தைக்கும் இடையிலான தெளிவான முரண்பாட்டைத் தமிழில் காட்டுகிறது.
- source_word: הִרְשָׁעְנוּ
  choice: பொல்லாப்பாக நடந்துகொண்டோம்
  rationale: Hiphil வடிவத்தின் ‘தீய முறையில் செயல்பட்டோம்’ என்ற வினைச் சார்ந்த பொருளைக் காக்கிறது; குணநிலையை மட்டும் குறிப்பிடாமல் நடத்தையைச் சுட்டுகிறது.
theological_decisions:
- issue: மக்களுக்கு நேரிட்ட துன்பங்களுடன் தொடர்புடைய தேவனுடைய நீதி
  choice: எங்களுக்கு நேரிட்ட எல்லாவற்றிலும் நீர் நீதியுள்ளவர்
  alternative: எங்களைத் தண்டித்ததில் நீர் நீதியுள்ளவர்
  rationale: மூல உரை மக்களுக்கு நேரிட்ட அனைத்தையும் பொறுத்தவரை தேவனுடைய நீதியை அறிக்கையிடுகிறது. ‘தண்டனை’ என்று வெளிப்படையாகச் சேர்க்காமல், உரையிலுள்ள உடன்படிக்கைப் பொறுப்பையும் இறையியல் அழுத்தத்தையும் அப்படியே காக்கிறது.
translation_notes:
  register: நவீன பொதுத் தமிழில், வேதாகம உரைக்கு ஏற்ற கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. தேவனை நோக்கிய நேரடி உரையில் மரியாதைப் பன்மை பயன்படுத்தப்பட்டுள்ளது; ‘நீர்... நாங்களோ’ என்ற அமைப்பு மூலத்தின் முரண்பாட்டைத் தெளிவாகக் காக்கிறது.
