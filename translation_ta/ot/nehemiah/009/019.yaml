base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/019.yaml
  text: But you[a], in your abundant mercies, did not abandon them in the wilderness. The pillar of cloud did not depart from above them by day, to lead them on the way, nor the pillar of fire by night, to give them light and the way in which they should go.
translation:
  language: ta
  text: ஆனால் நீர், உமது மிகுந்த இரக்கங்களினால்[a], அவர்களைப் பாலைநிலத்தில் கைவிடவில்லை. பகலில் அவர்களை வழியில் நடத்துவதற்காக மேகத்தூண் அவர்கள்மேல் இருந்து விலகவில்லை; இரவில் அவர்களுக்கும் அவர்கள் செல்லவேண்டிய வழிக்கும் ஒளி தருவதற்காக நெருப்புத்தூணும் விலகவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உமது பெரும் கருணையினால்.” எபிரெயத்தில் இச்சொல் பன்மையில் உள்ளது; சொல்லுக்கு சொல், “உமது பல இரக்கங்களினால்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּרַחֲמֶיךָ הָרַבִּים
  choice: உமது மிகுந்த இரக்கங்களினால்
  rationale: רַחֲמִים என்பதன் பன்மையையும் הָרַבִּים என்பதன் மிகுதி உணர்வையும் காக்கிறது; தமிழில் காரணப்பொருளும் இயல்பாக வெளிப்படுகிறது.
- source_word: עֲזַבְתָּם
  choice: அவர்களைக் கைவிடவில்லை
  rationale: עזב என்பதிலுள்ள விட்டுவிடுதல் அல்லது ஆதரவின்றித் துறத்தல் என்ற பொருளை நவீன தமிழில் தெளிவாகத் தருகிறது.
- source_word: בַּמִּדְבָּר
  choice: பாலைநிலத்தில்
  rationale: மனிதக் குடியிருப்பு குறைந்த வறண்ட வனாந்தரப் பகுதியைக் குறிக்கும் מִדְבָּר என்பதற்கு இயல்பான நவீனத் தமிழ் சொல்.
- source_word: עַמּוּד הֶעָנָן
  choice: மேகத்தூண்
  rationale: எபிரெயக் கூட்டுச்சொல்லின் உருவகத்தையும் யாத்திராகமப் பின்னணியையும் சுருக்கமாகவும் தெளிவாகவும் காக்கிறது.
- source_word: לֹא סָר מֵעֲלֵיהֶם
  choice: அவர்களுக்கு மேலிருந்து விலகவில்லை
  rationale: סור என்பதன் விலகுதல் கருத்தையும் מֵעֲלֵיהֶם என்பதன் இடவியல் பொருளையும் பாதுகாக்கிறது.
- source_word: לְהַנְחֹתָם בְּהַדֶּרֶךְ
  choice: அவர்களை வழியில் நடத்துவதற்காக
  rationale: Hiphil נחה என்பதன் வழிநடத்துதல் பொருளையும் בְּ கூறும் வழியிலான பயணத்தையும் இயல்பான தமிழில் தருகிறது.
- source_word: עַמּוּד הָאֵשׁ
  choice: நெருப்புத்தூண்
  rationale: மேகத்தூண் என்பதோடு உள்ள இணை அமைப்பையும் மூல உருவகத்தையும் காக்கிறது.
- source_word: לְהָאִיר לָהֶם וְאֶת הַדֶּרֶךְ אֲשֶׁר יֵלְכוּ בָהּ
  choice: அவர்களுக்கு வெளிச்சமளித்து, அவர்கள் செல்லவேண்டிய வழியைக் காட்டுவதற்காக
  rationale: எபிரெயத்தில் மக்களும் வழியும் ஒளியூட்டலோடு தொடர்புபடுத்தப்படும் சற்றுக் கடினமான அமைப்பை, கூடுதல் பொருளை இறையியலாக்காமல் தமிழில் புரியும்படி வெளிப்படுத்துகிறது.
theological_decisions:
- issue: இறை இரக்கத்தைக் குறிக்கும் பன்மை
  choice: மிகுந்த இரக்கங்கள்
  alternative: மிகுந்த இரக்கம்
  rationale: רַחֲמִים என்ற எபிரெயப் பன்மையைத் தட்டையாக்காமல், தேவனுடைய பலவகையான இரக்கச் செயல்களின் செறிவைக் காக்கிறது.
- issue: இரவில் நெருப்புத்தூண் செய்த செயல்
  choice: மக்களுக்கு வெளிச்சமளித்து அவர்கள் செல்லவேண்டிய வழியைக் காட்டியது
  alternative: மக்களுக்கும் அவர்கள் செல்லவேண்டிய வழிக்கும் வெளிச்சமளித்தது
  rationale: וְאֶת הַדֶּרֶךְ என்ற நேரடி வேற்றுமை அமைப்பின் தனித்துவத்தைப் பொருளில் காத்துக்கொண்டு, தமிழில் தவறான பொருள் தோன்றாமல் தெளிவாக்குகிறது; இது புதிய தெய்வீகக் கட்டளையைச் சேர்ப்பதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில் மரியாதை ஒருமையான “நீர்/உமது” பயன்படுத்தப்பட்டுள்ளது. உரை கண்ணியமானதாகவும் பொதுவாசகர்களுக்குப் புரியத்தக்கதாகவும் வைக்கப்பட்டுள்ளது; மேகத்தூண்—நெருப்புத்தூண் இணை அமைப்பு பாதுகாக்கப்பட்டுள்ளது.
