base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/029.yaml
  text: You warned them in order to bring them back to your law[a], but they acted presumptuously and did not listen to your commandments; they sinned against your judgments, by which a man shall live if he does them. They gave a stubborn shoulder, stiffened their neck[b], and would not listen.
translation:
  language: ta
  text: அவர்களை உமது திருச்சட்டத்திற்குத் திரும்பக் கொண்டுவருவதற்காக நீர் அவர்களை எச்சரித்தீர். ஆனால் அவர்கள் துணிகரமாக நடந்துகொண்டு, உமது கட்டளைகளுக்குச் செவிகொடுக்கவில்லை. உமது நீதிநியமங்களுக்கு எதிராகப் பாவம் செய்தார்கள்—ஒருவர் அவற்றைக் கடைப்பிடித்தால், அவற்றால் வாழ்வார்[a]. அவர்கள் அடங்காத தோளைக் காட்டி, தங்கள் கழுத்தை இறுகச் செய்து[b], செவிகொடுக்க மறுத்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இது லேவியராகமம் 18:5-ஐ எதிரொலிக்கிறது. இங்குள்ள “ஒருவர்” என்பது எந்த மனிதரையும் பொதுவாகக் குறிக்கிறது.
    reason: cross_reference_and_lexical_clarification
  - marker: b
    text: “கழுத்தை இறுகச் செய்தல்” என்பது பிடிவாதமாகக் கீழ்ப்படிய மறுப்பதைக் குறிக்கும் எபிரெய உருவகம்.
    reason: idiom_clarification
lexical_decisions:
- source_word: וַתָּעַד בָּהֶם
  choice: நீர் அவர்களை எச்சரித்தீர்
  rationale: העוד என்பதன் Hifil வடிவம் இங்கு சாட்சியுடன் கூடிய கடுமையான எச்சரிப்பைக் குறிக்கிறது; ‘எச்சரித்தீர்’ என்பது சூழலுக்கேற்ற இயல்பான நவீனத் தமிழ்.
- source_word: לַהֲשִׁיבָם אֶל תּוֹרָתֶךָ
  choice: அவர்களை உமது திருச்சட்டத்திற்குத் திரும்பக் கொண்டுவருவதற்காக
  rationale: Hifil שׁוב என்பதன் காரணவினைப் பொருளையும், உடன்படிக்கைச் சூழலில் תּוֹרָה குறிக்கும் இறைச்சட்டத்தையும் வெளிப்படுத்துகிறது.
- source_word: הֵזִידוּ
  choice: அவர்கள் துணிகரமாக நடந்துகொண்டு
  rationale: இது வெறும் பெருமையை அல்லாமல், இறைவனுக்கு எதிரான செருக்குமிக்க துணிகரச் செயல்பாட்டைக் குறிக்கிறது.
- source_word: לֹא שָׁמְעוּ לְמִצְוֺתֶיךָ
  choice: உமது கட்டளைகளுக்குச் செவிகொடுக்கவில்லை
  rationale: שׁמע என்பதில் கேட்பதோடு கீழ்ப்படிதலும் உட்பொருளாக இருப்பதால், எபிரெய உருவகத்தைத் தமிழில் இயல்பாகப் பாதுகாக்கிறது.
- source_word: וּבְמִשְׁפָּטֶיךָ חָטְאוּ בָם
  choice: உமது நீதிநியமங்களுக்கு எதிராகப் பாவம் செய்தார்கள்
  rationale: מִשְׁפָּטִים என்பது இறைவனின் நீதிசார்ந்த சட்டவிதிகளைக் குறிக்கிறது; בָם-இன் உறவைத் தமிழில் ‘எதிராக’ என்று தெளிவாக வெளிப்படுத்துகிறது.
- source_word: אֲשֶׁר יַעֲשֶׂה אָדָם וְחָיָה בָהֶם
  choice: ஒருவர் அவற்றைக் கடைப்பிடித்தால், அவற்றால் வாழ்வார்
  rationale: אָדָם இங்கு எந்த மனிதரையும் குறிக்கும் பொதுமை ஒருமை. ‘ஒருவர்’ பாலினப் பொருளைச் சுருக்காமல் இயல்பான தமிழில் அந்தப் பொதுமையைத் தருகிறது; ‘அவற்றால் வாழ்வார்’ மூலத்தின் உடன்படிக்கைச் சொல்லாட்சியைப் பாதுகாக்கிறது.
- source_word: וַיִּתְּנוּ כָתֵף סוֹרֶרֶת
  choice: அவர்கள் அடங்காத தோளைக் காட்டி
  rationale: கீழ்ப்படிய மறுக்கும் பிடிவாதத்தை உணர்த்தும் உடல்சார் உருவகத்தை, புரிந்துகொள்ளக்கூடிய தமிழில் பாதுகாக்கிறது.
- source_word: וְעָרְפָּם הִקְשׁוּ
  choice: தங்கள் கழுத்தை இறுகச் செய்து
  rationale: பிடிவாதத்தைக் குறிக்கும் எபிரெய உருவகத்தை விளக்கமாக மாற்றாமல் தக்கவைக்கிறது.
- source_word: וְלֹא שָׁמֵעוּ
  choice: செவிகொடுக்க மறுத்தார்கள்
  rationale: இறுதி வாக்கியம் சாதாரணமாகக் கேட்காததைவிட மனமறிந்த தொடர்ச்சியான மறுப்பை வலியுறுத்துகிறது.
theological_decisions:
- issue: אָדָם என்பதன் பொதுமைப் பொருள்
  choice: ஒருவர்
  alternative: ஒரு மனிதன்
  rationale: எபிரெயச் சொல் இலக்கண ஒருமையில் இருந்தாலும் இங்கு மனிதர் எவரையும் பொதுவாகக் குறிக்கிறது. நவீனத் தமிழில் ‘ஒருவர்’ அந்தப் பொதுமையை இயல்பாகவும் துல்லியமாகவும் தருகிறது.
- issue: கட்டளைகளைக் கடைப்பிடிப்பதால் வாழ்தல்
  choice: அவற்றைக் கடைப்பிடித்தால், அவற்றால் வாழ்வார்
  alternative: அவற்றைச் செய்கிற மனிதன் அவற்றில் வாழ்வான்
  rationale: லேவியராகமம் 18:5-இன் எதிரொலியையும் ‘வாழ்வு’ குறித்த உடன்படிக்கைத் திண்மையையும் அப்படியே வைத்திருக்கிறது; வாழ்வின் தன்மையை மேலதிகமாக விளக்கி இறையியல் முடிவு திணிக்கப்படவில்லை.
translation_notes:
  register: மரியாதைமிக்க இறைமுகப்பு வடிவங்களான ‘நீர்’, ‘உமது’ பயன்படுத்தப்பட்டுள்ளன. நடை நவீனமும் கண்ணியமுமாக வைக்கப்பட்டுள்ளது; ‘திருச்சட்டம்’, ‘நீதிநியமங்கள்’ ஆகியவை உடன்படிக்கை மற்றும் சட்டச் சூழலை வேறுபடுத்திக் காட்டுகின்றன. தோள் மற்றும் கழுத்து உருவகங்கள் தட்டையாக்கப்படாமல், சாதாரண வாசகர் புரிந்துகொள்ளும் தமிழில் பாதுகாக்கப்பட்டுள்ளன.
