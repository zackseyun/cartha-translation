base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/026.yaml
  text: But they acted presumptuously and rebelled against you[a], and they cast your law behind their backs. They killed your prophets, who had warned them in order to bring them back to you[d][c][b], and they committed great blasphemies.
translation:
  language: ta
  text: ஆனால் அவர்கள் துணிகரமாக நடந்துகொண்டு உமக்கு எதிராகக் கலகம் செய்தார்கள்[a]. உமது சட்டத்தைத் தங்கள் முதுகுக்குப் பின்னால் எறிந்துவிட்டார்கள்[b]. அவர்களை மீண்டும் உம்மிடம் கொண்டுவருவதற்காக அவர்களுக்கு எச்சரிக்கை விடுத்த உமது தீர்க்கதரிசிகளைக் கொன்றார்கள்[c]. உம்மை மிகவும் அவமதிக்கும் செயல்களைச் செய்தார்கள்[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘கீழ்ப்படியாமல் நடந்துகொண்டு,’ ‘இறுமாப்புடன் நடந்துகொண்டு’ அல்லது ‘எதிர்த்து நின்று’ என்றும் மொழிபெயர்க்கலாம்; எபிரெய வினை துணிகரமான எதிர்ப்பைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: ‘சட்டம்’ என்பதற்கு ‘போதனை’ அல்லது ‘அறிவுறுத்தல்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: ‘அவர்களுக்கு எதிராகச் சாட்சி கூறிய’ என்றும் மொழிபெயர்க்கலாம்; எபிரெயச் சொல் முறையான எச்சரிக்கை அல்லது சாட்சி என்ற பொருளைக் கொண்டிருக்கலாம்.
    reason: lexical_alternative
  - marker: d
    text: ‘பெரும் தூஷணங்களை,’ ‘பெரும் இகழ்ச்சிகளை’ அல்லது ‘பெரும் ஆத்திரமூட்டும் செயல்களைச் செய்தார்கள்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּמְרוּ
  choice: துணிகரமாக நடந்துகொண்டு
  rationale: מרה என்பது கீழ்ப்படியாமையையும் எதிர்த்து நிற்கும் துணிவையும் குறிக்கலாம். அடுத்துள்ள ‘கலகம் செய்தார்கள்’ என்பதுடன் பொருள் ஒன்றாகிவிடாமல், இறுமாப்புடன் கூடிய எதிர்ப்பை இந்தச் சொற்றொடர் வெளிப்படுத்துகிறது.
- source_word: וַיִּמְרְדוּ בָּךְ
  choice: உமக்கு எதிராகக் கலகம் செய்தார்கள்
  rationale: מרד வெளிப்படையான கலகத்தைக் குறிக்கிறது; בָּךְ குறிக்கும் தனிப்பட்ட எதிர்ப்பையும் ‘உமக்கு எதிராக’ என்பது காக்கிறது.
- source_word: וַיַּשְׁלִכוּ ... אַחֲרֵי גַוָּם
  choice: தங்கள் முதுகுக்குப் பின்னால் எறிந்துவிட்டார்கள்
  rationale: சட்டத்தை அலட்சியத்துடனும் அவமதிப்புடனும் நிராகரித்ததைச் சித்தரிக்கும் எபிரெய உருவகத்தைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: תּוֹרָתְךָ
  choice: உமது சட்டம்
  rationale: תּוֹרָה என்பது போதனை அல்லது அறிவுறுத்தல் என்றும் பொருள்படலாம்; இவ்வுடன்படிக்கை வரலாற்றுச் சூழலில் ‘சட்டம்’ இயல்பானதும் பரவலாகப் புரியக்கூடியதும் ஆகும்.
- source_word: נְבִיאֶיךָ
  choice: உமது தீர்க்கதரிசிகள்
  rationale: தமிழ் வேதாகம நடையில் பரவலாக அறியப்படும், மூலத்தின் பொருளை நேரடியாகத் தரும் சொல்.
- source_word: הֵעִידוּ בָם
  choice: அவர்களுக்கு எச்சரிக்கை விடுத்த
  rationale: הֵעִידוּ בָם என்பது அவர்களுக்கு எதிராகச் சாட்சி கூறுதல் அல்லது வலியுறுத்தி எச்சரித்தல் என்ற இரு நிழற்பொருள்களையும் கொண்டிருக்கலாம். தொடர்ந்து வரும் மீட்புநோக்குடன் ‘எச்சரிக்கை விடுத்த’ என்பது இயல்பாக இணைகிறது.
- source_word: לַהֲשִׁיבָם אֵלֶיךָ
  choice: அவர்களை மீண்டும் உம்மிடம் கொண்டுவருவதற்காக
  rationale: שׁוב என்பதன் காரணவினைப் பொருளையும், திரும்புதலின் இலக்கு தேவனே என்பதையும் தெளிவாகக் காக்கிறது.
- source_word: נֶאָצוֹת גְּדוֹלֹת
  choice: உம்மை மிகவும் அவமதிக்கும் செயல்கள்
  rationale: נֶאָצוֹת என்பது தேவனை நோக்கிய பெரும் அவமதிப்பு, இகழ்ச்சி அல்லது தூஷணச் செயல்களைக் குறிக்கிறது. இது பேச்சால் செய்யப்படும் தூஷணமாக மட்டும் வரையறுக்காமல் மூலச்சொல்லின் பரந்த பொருளைக் காக்கிறது.
theological_decisions:
- issue: וַיַּמְרוּ / וַיִּמְרְדוּ என்ற இணை வினைச்சொற்களின் வேறுபாடு
  choice: ‘துணிகரமாக நடந்துகொண்டு’ என்றும் ‘கலகம் செய்தார்கள்’ என்றும் வேறுபடுத்தப்பட்டது
  alternative: ‘கீழ்ப்படியாமல் கலகம் செய்தார்கள்’
  rationale: இரு எபிரெய வினைகளையும் ஒரே கருத்தாகச் சுருக்காமல், இறுமாப்பான எதிர்ப்பிலிருந்து வெளிப்படையான கலகத்துக்குச் செல்லும் சொற்பொழிவு வலிமையைப் பாதுகாக்கிறது.
- issue: נֶאָצוֹת என்பதன் பரப்பு
  choice: ‘உம்மை மிகவும் அவமதிக்கும் செயல்கள்’
  alternative: ‘பெரும் தூஷணங்களைச் செய்தார்கள்’
  rationale: குற்றம் தேவனை நோக்கியது என்பதை வெளிப்படுத்துகிறது; அதேவேளை மூலச்சொல்லை வாய்மொழித் தூஷணத்துக்குள் மட்டும் குறுக்காமல், அவமதிப்பான செயல்களையும் உள்ளடக்குகிறது.
- issue: הֵעִידוּ בָם என்பதிலுள்ள சாட்சி/எச்சரிக்கை நிழற்பொருள்
  choice: ‘அவர்களுக்கு எச்சரிக்கை விடுத்த’
  alternative: ‘அவர்களுக்கு எதிராகச் சாட்சி கூறிய’
  rationale: அடுத்துள்ள ‘உம்மிடம் கொண்டுவருவதற்காக’ என்ற மீட்புநோக்குடன் எச்சரிக்கை இயல்பாகப் பொருந்துகிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான தமிழில் இறைவனை நோக்கிய மரியாதைப் பன்மை பயன்படுத்தப்பட்டுள்ளது. எபிரெய மொழியின் முதுகுக்குப் பின்னால் எறிதல் என்ற தெளிவான உருவகம் காக்கப்பட்டுள்ளது. ‘தீர்க்கதரிசிகள்’ என்பது சாதாரண வாசகர்களுக்கு அறிமுகமான வேதாகமச் சொல். அடிக்குறிப்பு குறிப்புகள் அனைத்தும் உரையில் தொடர்புடைய இடங்களில் வரிசையாக இடம்பெற்றுள்ளன.
