source:
  edition: WLC
  text: וְ/הַ/יָּם֙ בָּקַ֣עְתָּ לִ/פְנֵי/הֶ֔ם וַ/יַּֽעַבְר֥וּ בְ/תוֹךְ הַ/יָּ֖ם בַּ/יַּבָּשָׁ֑ה וְֽ/אֶת רֹ֨דְפֵי/הֶ֜ם הִשְׁלַ֧כְתָּ בִ/מְצוֹלֹ֛ת כְּמוֹ אֶ֖בֶן בְּ/מַ֥יִם עַזִּֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/011.yaml
  text: You split the sea before them[a], and they passed through the midst of the sea on dry ground[b]; and you threw their pursuers into the depths like a stone in mighty waters.
translation:
  language: ta
  text: அவர்களுக்கு முன்பாகக் கடலைப் பிளந்தீர்[a]; அவர்கள் கடலின் நடுவே உலர்ந்த தரையில் கடந்துபோனார்கள்; அவர்களைத் துரத்தியவர்களை வலிமைமிக்க நீரில் ஒரு கல்லைப்போல் ஆழங்களில்[b] எறிந்தீர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘கடலைப் பிரித்தீர்.’
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘ஆழமான இடங்களில்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּקַעְתָּ
  choice: பிளந்தீர்
  rationale: בקע என்பது பிளத்தல் அல்லது பிளந்து திறத்தல் என்பதைக் குறிக்கிறது. ‘பிளந்தீர்’ என்பது செயலைத் தெளிவாகவும் உயிரோட்டமாகவும் தெரிவிக்கிறது.
- source_word: לִפְנֵיהֶם
  choice: அவர்களுக்கு முன்பாக
  rationale: פנים உடன் வரும் முன்னிடைச்சொல் இங்கு ‘அவர்களுக்கு முன்னால்/முன்பாக’ என்னும் இடப்பொருளைத் தருகிறது; ‘முன்பாக’ ஜெபநடைக்கும் இயல்பான நவீன தமிழுக்கும் ஏற்றது.
- source_word: וַיַּעַבְרוּ
  choice: கடந்துபோனார்கள்
  rationale: עבר இச்சூழலில் ஒரு பகுதியினூடே கடந்து செல்வதைக் குறிக்கிறது. அடுத்து வரும் ‘கடலின் நடுவே’ என்பதுடன் ‘கடந்துபோனார்கள்’ இயல்பாக இணைகிறது.
- source_word: בְתוֹךְ הַיָּם
  choice: கடலின் நடுவே
  rationale: תוך என்பது நடுப்பகுதி அல்லது உட்பகுதியைக் குறிக்கிறது. ‘கடலின் நடுவே’ என்ற மொழிபெயர்ப்பு மூலத்தின் இடக்காட்சியைப் பாதுகாக்கிறது.
- source_word: בַּיַּבָּשָׁה
  choice: உலர்ந்த தரையில்
  rationale: இது நீரற்ற உலர்ந்த நிலப்பரப்பைக் குறிக்கிறது. கடற்படுகையின் அற்புதமான நிலையை ‘உலர்ந்த தரையில்’ தெளிவாக வெளிப்படுத்துகிறது.
- source_word: רֹדְפֵיהֶם
  choice: அவர்களைத் துரத்தியவர்கள்
  rationale: רדף என்பதன் பங்கேற்பு வடிவம் தொடர்ந்து பின்துரத்துவோரைக் குறிக்கிறது; தமிழில் வினைமுற்றுத் தொடர்பெயர் வடிவம் இயல்பாக உள்ளது.
- source_word: הִשְׁלַכְתָּ
  choice: எறிந்தீர்
  rationale: שלך என்பதன் ஹிபில் வடிவம் எறிதல் அல்லது வீசுதல் என்னும் நேரடியான செயலைக் குறிக்கிறது. ‘எறிந்தீர்’ நவீனமாகவும் அளவுக்கு மீறிய தீவிரத்தைச் சேர்க்காமலும் உள்ளது.
- source_word: בִמְצוֹלֹת
  choice: ஆழங்களில்
  rationale: מצולות குறிப்பாக நீரின் ஆழமான பகுதிகளைக் குறிக்கிறது. ‘ஆழங்களில்’ சுருக்கமாகவும் காட்சியைப் பாதுகாக்கும் வகையிலும் உள்ளது.
- source_word: כְּמוֹ אֶבֶן
  choice: கல்லைப்போல்
  rationale: மூலத்தின் எளிய, வலுவான உவமையை தமிழில் நேரடியாகப் பாதுகாக்கிறது.
- source_word: בְּמַיִם עַזִּים
  choice: வலிமைமிக்க நீரில்
  rationale: עזים என்பது வலிமையான அல்லது ஆற்றல்மிக்க என்பதைக் குறிக்கிறது. ‘வலிமைமிக்க நீரில்’ என்பது ‘சீறிப்பாயும்’ போன்ற கூடுதல் விளக்கத்தைச் சேர்க்காமல் உயர்ந்த நடையைத் தக்கவைக்கிறது.
theological_decisions:
- issue: விடுதலை நிகழ்வில் இறைவனின் நேரடியான செயல்
  choice: ‘பிளந்தீர்’, ‘எறிந்தீர்’ என்று இறைவனை நேரடியாக இரண்டாம் நபரில் அழைக்கும் வடிவத்தைப் பாதுகாத்தல்
  alternative: நேரடி அழைப்பை மறைக்கும் பெயர்ப்பண்பு அல்லது தன்மையற்ற வாக்கிய அமைப்பு
  rationale: இவ்வசனம் சமூக ஜெபத்தில் இறைவனின் வரலாற்றுச் செயல்களை நினைவுகூர்கிறது. இரண்டாம் நபர் வினைமுற்றுகள் அதன் துதித்தல் மற்றும் அறிக்கையிடுதல் சார்ந்த இறையியல் வலிமையைப் பாதுகாக்கின்றன.
translation_notes:
  register: நவீன தரநிலைத் தமிழில், பொதுமக்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான ஜெபநடை பயன்படுத்தப்பட்டுள்ளது. இறைவனை நோக்கிய ஒருமை மரியாதை வடிவமான ‘நீர்/–தீர்’ காக்கப்பட்டுள்ளது; மூலத்தின் இணை அமைப்பும் கடல்–உலர்ந்த தரை–கல் ஆகிய காட்சிகளும் தேவையற்ற விளக்கமின்றிப் பாதுகாக்கப்பட்டுள்ளன.
