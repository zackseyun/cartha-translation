base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/023.yaml
  text: You multiplied their children like the stars of the heavens[c][b][a], and you brought them into the land that you had told their fathers to enter and possess.
translation:
  language: ta
  text: அவர்களுடைய பிள்ளைகளை[a] வானத்தின் நட்சத்திரங்களைப் போல[b] பெருகச் செய்தீர்; அவர்கள் நுழைந்து அதை உரிமையாக்கிக்கொள்ள வேண்டும்[c] என்று அவர்களுடைய தந்தையரிடம் நீர் கூறியிருந்த நாட்டிற்குள் அவர்களைக் கொண்டுவந்தீர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘மகன்களை’ அல்லது ‘சந்ததியினரை.’
    reason: lexical_alternative
  - marker: b
    text: ‘வானத்தின் நட்சத்திரங்களைப் போல’ என்ற எபிரெயச் சொற்றொடர், முற்பிதாக்களுக்குத் தேவன் அளித்த வாக்குறுதியை எதிரொலிக்கிறது.
    reason: cross_reference
  - marker: c
    text: அல்லது, ‘நுழைந்து கைப்பற்ற வேண்டும்’; சில சூழல்களில் இந்த வினையை ‘சுதந்தரித்துக்கொள்ள வேண்டும்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵיהֶם
  choice: அவர்களுடைய பிள்ளைகளை
  rationale: בנים என்பது குறுகிய பொருளில் ‘மகன்கள்’ எனக் குறிக்கலாம்; ஆனால் இங்கு ஒரு மக்களினத்தின் பெருக்கத்தைக் குறிப்பதால், பாலினத்தைத் தேவையின்றிக் குறுக்காமல் குடும்பத் தொடர்பைப் பேணும் ‘பிள்ளைகள்’ இயல்பானது.
- source_word: הִרְבִּיתָ
  choice: பெருகச் செய்தீர்
  rationale: רבה என்பதன் ஹிஃபில் வடிவம் பலராகும்படி செய்ததைக் குறிக்கிறது; இந்தச் சொற்றொடர் தேவனுடைய நேரடியான செயலைத் தெளிவாகப் பேணுகிறது.
- source_word: כְּכֹכְבֵי הַשָּׁמָיִם
  choice: வானத்தின் நட்சத்திரங்களைப் போல
  rationale: எபிரெய மூலத்தின் உருவகத்தையும் முற்பிதாக்களுக்குக் கொடுக்கப்பட்ட வாக்குறுதியின் எதிரொலியையும் பேணும் இயல்பான தமிழ்.
- source_word: וַתְּבִיאֵם
  choice: அவர்களைக் கொண்டுவந்தீர்
  rationale: בוא என்பதன் ஹிஃபில் வடிவம் ‘வரச் செய்தல்/கொண்டுவருதல்’ என்று பொருள்படும்; சூழலில் ‘கொண்டுவந்தீர்’ தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: אֶל הָאָרֶץ
  choice: நாட்டிற்குள்
  rationale: இயக்கத்தைக் குறிக்கும் வினையோடு, நாட்டை வெறுமனே அடைவதைவிட அதற்குள் நுழைவதைத் தெளிவாக்குகிறது.
- source_word: אֲשֶׁר אָמַרְתָּ לַאֲבֹתֵיהֶם
  choice: அவர்களுடைய தந்தையரிடம் ... என்று நீர் கூறியிருந்த
  rationale: முன்னர் தந்தையரிடம் தேவன் கூறிய வார்த்தையோடு அந்த நாட்டை இணைக்கிறது; ‘கூறியிருந்த’ கால வரிசையையும் பேணுகிறது.
- source_word: לָבוֹא
  choice: நுழைந்து
  rationale: בוא என்னும் வினையெச்சம் நாட்டிற்குள் செல்வதைக் குறிக்கிறது; தமிழில் அடுத்த வினையுடன் இணைந்த ‘நுழைந்து’ இயல்பானது.
- source_word: לָרָשֶׁת
  choice: உரிமையாக்கிக்கொள்ள
  rationale: ירשׁ இச்சூழலில் நாட்டைக் கைப்பற்றி உடைமையாக்கிக்கொள்வதைக் குறிக்கிறது. ‘உரிமையாக்கிக்கொள்ள’ என்பது ‘சுதந்தரித்துக்கொள்ள’ என்ற சாத்தியமான பொருளைத் தீர்மானமாகத் திணிக்காமல் உடைமையாக்கும் கருத்தை வெளிப்படுத்துகிறது.
theological_decisions:
- issue: முற்பிதாக்களுக்கான வாக்குறுதியின் எதிரொலி
  choice: ‘வானத்தின் நட்சத்திரங்களைப் போல’ என்றும் ‘அவர்களுடைய தந்தையர்’ என்றும் உள்ள வாக்குறுதி மொழி பேணப்பட்டது.
  alternative: ‘வானில் உள்ள எண்ணற்ற நட்சத்திரங்களைப் போல’ அல்லது ‘அவர்களுடைய முன்னோர்’ போன்ற விளக்கமான அல்லது பொதுவான மொழி.
  rationale: இந்த வசனம் தேவனுடைய வாக்குறுதி நிறைவேற்றத்தை முற்பிதாக்களின் கதையோடு இணைக்கிறது. மூலத்தின் சொல் எதிரொலியைப் பேணுவது அந்தத் தெய்வவியல் தொடர்பை விரிவுரையின்றி வெளிப்படுத்துகிறது.
- issue: ירשׁ என்பதன் பொருள் வரம்பு
  choice: முதன்மை உரையில் ‘உரிமையாக்கிக்கொள்ள’ பயன்படுத்தப்பட்டு, மாற்றாக ‘சுதந்தரித்துக்கொள்ள’ அடிக்குறிப்பில் தரப்பட்டது.
  alternative: ‘சுதந்தரித்துக்கொள்ள’ என்பதை மட்டும் முதன்மை உரையில் பயன்படுத்துதல்.
  rationale: இந்தச் சூழலில் நாட்டைக் கைப்பற்றி உடைமையாக்குவது முன்னிலையில் இருந்தாலும், வினை சில சூழல்களில் சுதந்தரிப்பதையும் குறிக்கலாம்; ஆகவே உண்மையான சொற்பொருள் விரிவை அடிக்குறிப்பு பேணுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டது. தேவனை நோக்கிய மரியாதைப் பன்மை வினைமுற்றுகள் (‘செய்தீர்’, ‘கொண்டுவந்தீர்’) பேணப்பட்டன. மூலத்தின் வாக்குறுதி மொழியும் நேரடியான தெய்வச் செயற்பாடும் பாதுகாக்கப்பட்டன.
