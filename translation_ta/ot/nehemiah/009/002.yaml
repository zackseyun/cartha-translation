  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יִּבָּֽדְלוּ֙ זֶ֣רַע יִשְׂרָאֵ֔ל מִ/כֹּ֖ל בְּנֵ֣י נֵכָ֑ר וַ/יַּעַמְד֗וּ וַ/יִּתְוַדּוּ֙ עַל חַטֹּ֣אתֵי/הֶ֔ם וַ/עֲוֺנ֖וֹת אֲבֹתֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/002.yaml
  text: Then the offspring of Israel separated themselves from all foreigners[b][a], and they stood and confessed their sins and the iniquities of their fathers.
translation:
  language: ta
  text: அப்போது இஸ்ரவேலின் சந்ததியினர்[a] அந்நியர் அனைவரிடமிருந்தும் தங்களைப் பிரித்துக்கொண்டார்கள். அவர்கள் நின்று, தங்கள் பாவங்களையும் தங்கள் முன்னோர்களின் அக்கிரமங்களையும்[b] அறிக்கையிட்டார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லுக்குச் சொல், “இஸ்ரவேலின் விதை”; அதாவது, இஸ்ரவேலின் வழிவந்தவர்கள்.
    reason: lexical_alternative
  - marker: b
    text: “அக்கிரமங்கள்” என்பதற்கான எபிரெயச் சொல் குற்றப்பழியையோ அக்கிரமத்தின் விளைவையோ குறிக்கவும் இயலும்; இங்கு மக்கள் தங்கள் முன்னோர்களின் தவறுகளையும் சமூக அறிக்கையில் ஏற்றுக்கொள்வதாக வாக்கிய அமைப்பு காட்டுகிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּבָּדְלוּ
  choice: தங்களைப் பிரித்துக்கொண்டார்கள்
  rationale: בדל என்பதன் நிஃபால் வடிவம் இச்சூழலில் திட்டமிட்ட தன்னிலைச் செயலைக் குறிக்கிறது; தமிழ் தொடர் செயலும் தன்னிலைப் பொருளும் இரண்டையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: זֶרַע יִשְׂרָאֵל
  choice: இஸ்ரவேலின் சந்ததியினர்
  rationale: זֶרַע என்பதன் அடிப்படைப் பொருள் ‘விதை’; இங்கு அது வழிவந்த மக்களைத் தொகுப்பாகக் குறிக்கிறது. ‘சந்ததியினர்’ வம்சத் தொடர்பை நவீன தமிழில் தெளிவாகத் தருகிறது.
- source_word: מִכֹּל בְּנֵי נֵכָר
  choice: அந்நியர் அனைவரிடமிருந்தும்
  rationale: בְּנֵי נֵכָר என்பது சொல்லுக்குச் சொல் ‘அந்நிய நாட்டின் மகன்கள்’ என்றாலும், வழக்குச் சொல்லாக அந்நிய மக்களைக் குறிக்கிறது; பாலினத்தைத் தேவையின்றிக் கட்டுப்படுத்தாமல் தமிழில் இயல்பாக மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: וַיַּעַמְדוּ
  choice: அவர்கள் நின்று
  rationale: עמד என்பதன் நேரடியான பொருளான நிற்றலைப் பாதுகாக்கிறது; மூலத்தில் இல்லாத ‘எழுந்து’ என்ற கருத்து சேர்க்கப்படவில்லை.
- source_word: וַיִּתְוַדּוּ
  choice: அறிக்கையிட்டார்கள்
  rationale: ידה என்பதன் ஹித்பாயேல் வடிவம் இங்கு பாவத்தை ஒப்புக்கொண்டு அறிக்கையிடுவதைக் குறிக்கிறது. ‘அறிக்கையிட்டார்கள்’ வழிபாட்டு மற்றும் பொதுக் குற்றஒப்புதல் சூழலுக்கு ஏற்ற கண்ணியமான தமிழ்.
- source_word: חַטֹּאתֵיהֶם
  choice: தங்கள் பாவங்களை
  rationale: חטאת என்பதன் பன்மை இங்கு நேரடியாகப் பாவங்களைக் குறிக்கிறது.
- source_word: עֲוֺנוֹת אֲבֹתֵיהֶם
  choice: தங்கள் முன்னோர்களின் அக்கிரமங்களை
  rationale: עון என்பது அக்கிரமம், குற்றப்பழி, அல்லது அதன் விளைவு எனச் சூழலுக்கேற்ப பொருள்படலாம். இங்கு ‘அக்கிரமங்கள்’ என்பது தார்மீகத் தவறைத் தெளிவாகக் காட்டுவதுடன், இணையாக வரும் ‘பாவங்கள்’ என்ற சொல்லிலிருந்து மூலத்தின் சொல்வேறுபாட்டையும் காக்கிறது. אבות என்பது சொல்லுக்குச் சொல் ‘தந்தையர்’; இங்கு முந்தைய தலைமுறையினரைக் குறிக்கும் என்பதால் ‘முன்னோர்கள்’ இயல்பானது.
theological_decisions:
- issue: முன்னோர்களின் அக்கிரமங்களைச் சமூகமாக அறிக்கையிடுதல்
  choice: மக்கள் தங்கள் சொந்தப் பாவங்களையும் தங்கள் முன்னோர்களின் அக்கிரமங்களையும் அறிக்கையிட்டார்கள்
  alternative: அவர்கள் முன்னோர்களின் குற்றப்பழியையோ அதன் விளைவுகளையோ மட்டுமே ஒப்புக்கொண்டார்கள்
  rationale: வாக்கிய அமைப்பில் ‘தங்கள் பாவங்கள்’ மற்றும் ‘தங்கள் முன்னோர்களின் அக்கிரமங்கள்’ ஆகிய இரண்டும் ஒரே ‘அறிக்கையிட்டார்கள்’ என்ற வினையின் பொருட்களாக இணைக்கப்பட்டுள்ளன. ஆகவே சமூகமான உடன்படிக்கை அறிக்கையை மொழிபெயர்ப்பு காக்கிறது; அதேவேளை முன்னோர்களின் தனிப்பட்ட குற்றப்பழி இவர்களுக்கு மரபாகச் சுமத்தப்பட்டது என்ற கோட்பாட்டை வசனத்துக்குள் சேர்க்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘அந்நியர்’ மற்றும் ‘அறிக்கையிட்டார்கள்’ போன்ற சொற்கள் மூலத்தின் சுருக்கத்தையும் வழிபாட்டுச் சூழலையும் காக்கின்றன; தேவையற்ற பாலினக் கட்டுப்பாடும் மரபுக் குற்றப்பழி குறித்த கோட்பாட்டு விரிவாக்கமும் தவிர்க்கப்பட்டுள்ளன.
