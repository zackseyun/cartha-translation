  text: וְ/הֵ֣ם בְּ/מַלְכוּתָ/ם֩ וּ/בְ/טוּבְ/ךָ֨ הָ/רָ֜ב אֲשֶׁר נָתַ֣תָּ לָ/הֶ֗ם וּ/בְ/אֶ֨רֶץ הָ/רְחָבָ֧ה וְ/הַ/שְּׁמֵנָ֛ה אֲשֶׁר נָתַ֥תָּ לִ/פְנֵי/הֶ֖ם לֹ֣א עֲבָד֑וּ/ךָ וְֽ/לֹא שָׁ֔בוּ מִ/מַּֽעַלְלֵי/הֶ֖ם הָ/רָעִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/035.yaml
  text: Even in their kingdom[a], and amid your great goodness that you gave them, and in the broad and fertile land that you set before them[d][c][b], they did not serve you and did not turn from their evil deeds.
translation:
  language: ta
  text: அவர்கள் தங்கள் அரசாட்சியிலும், நீர் அவர்களுக்குக் கொடுத்த உமது மிகுந்த நன்மையின் நடுவிலும், நீர் அவர்களுக்கு முன்பாக வைத்த விசாலமும் வளமுமுள்ள நாட்டிலும், உமக்குப் பணிவிடை செய்யவில்லை[a]; தங்கள் தீய செயல்களைவிட்டு விலகவும் இல்லை[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உம்மை வழிபடவில்லை.” இங்குள்ள எபிரெய வினைச்சொல் பணிவிடையையும் வழிபாட்டையும் உள்ளடக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “தங்கள் தீய செயல்களுக்காக மனந்திரும்பவும் இல்லை.” சொற்பட, “தங்கள் தீய செயல்களிலிருந்து திரும்பவும் இல்லை.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּמַלְכוּתָם
  choice: தங்கள் அரசாட்சியில் இருந்தபோதும்
  rationale: מַלְכוּת என்பது அரசாட்சி, ஆட்சி, அல்லது அரசுரிமையைக் குறிக்கலாம். இங்கு அவர்கள் நிலைபெற்ற ஆட்சிநிலையைச் சுட்டுவதால், தமிழில் கால-சூழல் உறவை இயல்பாக வெளிப்படுத்த இவ்வாறு மொழிபெயர்க்கப்பட்டது.
- source_word: וּבְטוּבְךָ הָרָב
  choice: உமது மிகுந்த நன்மையின் நடுவிலும்
  rationale: טוּב என்பது நன்மையையும் வளமான கொடையையும் குறிக்கக்கூடும். இறைவனின் நல்லியல்பையும் அருளான வழங்கலையும் ஒன்றாகத் தக்கவைக்க ‘மிகுந்த நன்மை’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: אֲשֶׁר נָתַתָּ לָהֶם
  choice: நீர் அவர்களுக்குக் கொடுத்த
  rationale: எபிரெய வாக்கியத்தின் எளிய இறந்தகாலச் செயலை இயல்பான தமிழில் நேரடியாகப் பிரதிபலிக்கிறது.
- source_word: אֶרֶץ הָרְחָבָה וְהַשְּׁמֵנָה
  choice: விசாலமும் வளமுமுள்ள நாடு
  rationale: רְחָבָה என்பது விசாலமானது; שְׁמֵנָה என்பதன் சொற்பொருள் ‘கொழுத்தது,’ ஆனால் நிலத்தைக் குறித்து அது செழிப்பான அல்லது வளமானதென்னும் மரபுத்தொடர் பொருளைக் கொண்டுள்ளது.
- source_word: אֲשֶׁר נָתַתָּ לִפְנֵיהֶם
  choice: நீர் அவர்களுக்கு முன்பாக வைத்த
  rationale: לִפְנֵיהֶם என்பதிலுள்ள ‘அவர்களுக்கு முன்பாக’ என்ற உருவகத்தைத் தக்கவைத்து, நாட்டை அவர்கள் வசமாக அளித்த கருத்தையும் தமிழில் உணர்த்துகிறது.
- source_word: לֹא עֲבָדוּךָ
  choice: அவர்கள் உமக்குப் பணிவிடை செய்யவில்லை
  rationale: עבד என்பது கடவுளைக் குறிக்கும்போது சேவை, கீழ்ப்படிதல், வழிபாடு ஆகிய பரப்பைக் கொண்டது. ‘பணிவிடை செய்’ அந்த விரிவை ஒப்பீட்டளவில் தக்கவைக்கிறது.
- source_word: וְלֹא שָׁבוּ
  choice: விலகவுமில்லை
  rationale: שׁוּב என்பதன் அடிப்படைப் பொருள் திரும்புதல் அல்லது விலகுதல். מִן உடன் தீய செயல்களிலிருந்து விலகுவதைக் குறிப்பதால், ‘மனந்திரும்பவில்லை’ என்று விளக்கமாக்காமல் மூல உருவகத்தைப் பாதுகாக்கிறது.
- source_word: מִמַּעַלְלֵיהֶם הָרָעִים
  choice: தங்கள் தீய செயல்களைவிட்டு
  rationale: מַעֲלָלִים என்பது செயல்கள், நடத்தைகள் அல்லது நடைமுறைகளைக் குறிக்கும்; ‘தீய செயல்கள்’ தெளிவானதும் இயல்பானதும் ஆகும்.
theological_decisions:
- issue: கடவுளைப் பொருளாகக் கொண்ட עבד என்பதன் மொழிபெயர்ப்பு
  choice: உமக்குப் பணிவிடை செய்யவில்லை
  alternative: உம்மை வழிபடவில்லை
  rationale: இவ்வினைச்சொல் வழிபாட்டை மட்டும் அல்லாமல் உடன்படிக்கை சார்ந்த சேவையையும் கீழ்ப்படிதலையும் உள்ளடக்குகிறது. ஆகவே அதை வழிபாடு என்ற ஒரே பொருளுக்குள் குறுக்கவில்லை.
- issue: ஒழுக்கச் சூழலில் שׁוּב מִן என்பதன் மொழிபெயர்ப்பு
  choice: தங்கள் தீய செயல்களைவிட்டு விலகவுமில்லை
  alternative: தங்கள் தீய செயல்களுக்காக மனந்திரும்பவுமில்லை
  rationale: மூலவாக்கியம் தீய செயல்களிலிருந்து திரும்புதல் என்ற செயற்படிமத்தைப் பயன்படுத்துகிறது. ‘விலகு’ அதைத் தக்கவைக்கிறது; ‘மனந்திரும்பு’ சரியான விளக்கமாக இருந்தாலும் மூலத்தைவிட அதிகமாக விளக்குகிறது.
translation_notes:
  register: நவீன தரநிலைத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான வேதாகம நடையைப் பயன்படுத்துகிறது. இறைவனைச் சுட்டும் மரியாதை ஒருமை வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன. ‘கொழுத்த நாடு’ என்ற எபிரெய மரபுத்தொடர் தமிழில் தவறாகப் புரியாதபடி ‘வளமுமுள்ள நாடு’ என இயல்பாக்கப்பட்டுள்ளது.
