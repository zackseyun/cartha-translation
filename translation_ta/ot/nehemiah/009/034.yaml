  text: וְ/אֶת מְלָכֵ֤י/נוּ שָׂרֵ֨י/נוּ֙ כֹּהֲנֵ֣י/נוּ וַ/אֲבֹתֵ֔י/נוּ לֹ֥א עָשׂ֖וּ תּוֹרָתֶ֑/ךָ וְ/לֹ֤א הִקְשִׁ֨יבוּ֙ אֶל מִצְוֺתֶ֔י/ךָ וּ/לְ/עֵ֣דְוֺתֶ֔י/ךָ אֲשֶׁ֥ר הַעִידֹ֖תָ בָּ/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/034.yaml
  text: Even our kings[a], our officials, our priests, and our fathers did not keep your law[c][b], and they did not listen to your commandments and your testimonies with which you warned them.
translation:
  language: ta
  text: எங்கள் அரசர்களும், அதிகாரிகளும், ஆசாரியர்களும், மூதாதையர்களும் உமது திருச்சட்டத்தைக் கடைப்பிடிக்கவில்லை; உமது கட்டளைகளுக்கும், அவற்றின் மூலம் நீர் அவர்களை எச்சரித்த உமது சாட்சியங்களுக்கும்[a] அவர்கள் செவிகொடுக்கவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “சாட்சியங்கள்” என்பது தேவனுடைய உடன்படிக்கைச் சாட்சியங்களையும் முறைமையான எச்சரிப்புகளையும் குறிக்கலாம். இப்பகுதியை, “அவற்றைக் கொண்டு நீர் அவர்களுக்கு எதிராகச் சாட்சியமளித்தீர்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְלָכֵינוּ
  choice: எங்கள் அரசர்கள்
  rationale: முதல் நபர் பன்மை உடைமை விகுதியுடன் வரும் ‘அரசர்கள்’ என்பதன் நேரான, இயல்பான மொழிபெயர்ப்பு.
- source_word: שָׂרֵינוּ
  choice: எங்கள் அதிகாரிகள்
  rationale: שָׂרִים என்பது ஆட்சியிலும் நிர்வாகத்திலும் பொறுப்புடைய தலைவர்களைக் குறிக்கிறது; நவீன தமிழில் ‘அதிகாரிகள்’ என்பது இதைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: כֹּהֲנֵינוּ
  choice: எங்கள் ஆசாரியர்கள்
  rationale: כֹּהֵן என்பதற்கான வழக்கமான வேதாகமத் தமிழ் இணைச்சொல்.
- source_word: וַאֲבֹתֵינוּ
  choice: மூதாதையர்களும்
  rationale: אָבוֹת என்பதன் சொற்பொருள் ‘தந்தையர்’; இங்கு முந்தைய தலைமுறையினரைக் குறிப்பதால், இயல்பான தமிழில் ‘மூதாதையர்கள்’ என வழங்கப்பட்டுள்ளது.
- source_word: לֹא עָשׂוּ תּוֹרָתֶךָ
  choice: உமது திருச்சட்டத்தைக் கடைப்பிடிக்கவில்லை
  rationale: תּוֹרָה உடன் வரும் עשה, அதை வெறுமனே ‘செய்தல்’ அல்ல, அனுசரித்தல் அல்லது கடைப்பிடித்தல் எனப் பொருள்படும். ‘திருச்சட்டம்’ உடன்படிக்கைச் சூழலையும் இறைவனுக்குரிய மரியாதை நடையையும் தக்கவைக்கிறது.
- source_word: הִקְשִׁיבוּ
  choice: செவிகொடுக்கவில்லை
  rationale: கவனத்துடன் கேட்டு அதன்படி நடப்பதைச் சுட்டும் வினை; ‘செவிகொடு’ என்பது கேட்பதையும் பொருட்படுத்துவதையும் இயல்பாக இணைக்கிறது.
- source_word: מִצְוֺתֶיךָ
  choice: உமது கட்டளைகள்
  rationale: உடன்படிக்கைச் சூழலில் ‘கட்டளைகள்’ என்பது துல்லியமான, பொதுவாகப் புரியும் இணைச்சொல்.
- source_word: וּלְעֵדְוֺתֶיךָ
  choice: உமது சாட்சியங்கள்
  rationale: עֵדוֹת என்பதன் சாட்சி/உடன்படிக்கைச் சான்று சார்ந்த பொருளைத் தக்கவைத்து, ‘கட்டளைகள்’ என்பதிலிருந்து அதன் சொல்வேறுபாட்டையும் பாதுகாக்கிறது.
- source_word: אֲשֶׁר הַעִידֹתָ בָהֶם
  choice: அவற்றின் மூலம் நீர் அவர்களை எச்சரித்த
  rationale: העיד இங்கு சாட்சியாக வலியுறுத்துதல் வழியாகக் கடுமையாக எச்சரிக்கும் பொருளைக் கொண்டுள்ளது; בָהֶם காட்டும் கருவிப் பொருளை ‘அவற்றின் மூலம்’ தெளிவாக்குகிறது.
theological_decisions:
- issue: תּוֹרָה என்பதன் மொழிபெயர்ப்பு
  choice: உமது திருச்சட்டம்
  alternative: உமது போதனை
  rationale: தேசிய உடன்படிக்கை அறிக்கையான இச்சூழலில், இச்சொல் பொதுவான போதனையைவிட தேவனுடைய உடன்படிக்கைச் சட்டத்தைக் குறிக்கிறது.
- issue: עֵדוֹת மற்றும் העיד இடையிலான தொடர்பு
  choice: சாட்சியங்கள்; அவற்றின் மூலம் எச்சரித்தீர்
  alternative: அவர்களுக்கு எதிராக நீர் சாட்சியமளித்த சாட்சியங்கள்
  rationale: சாட்சியமளித்தல் மற்றும் எச்சரித்தல் ஆகிய இரு நிழற்பொருள்களும் எபிரெயத்தில் உள்ளன. முதன்மை உரை இயல்பான தமிழில் எச்சரிப்பு பொருளை வழங்குகிறது; அடிக்குறிப்பு சாட்சி/குற்றஞ்சாட்டல் சார்ந்த மாற்று புரிதலைத் தக்கவைக்கிறது.
translation_notes:
  register: நவீன தரமான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான வேதாகம நடையைப் பயன்படுத்துகிறது. தேவனை நோக்கிய உரையில் மரியாதைப் பன்மையான ‘உமது/நீர்’ கையாளப்பட்டுள்ளது; கட்டளைகள், சாட்சியங்கள் ஆகிய மூலச்சொல் வேறுபாடுகள் பாதுகாக்கப்பட்டுள்ளன.
