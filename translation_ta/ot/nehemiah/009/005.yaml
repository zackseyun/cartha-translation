base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/005.yaml
  text: Then the Levites—Jeshua[a], Kadmiel, Bani, Hashabneiah, Sherebiah, Hodiah, Shebaniah, and Pethahiah—said, “Stand up; bless Yahweh your God from everlasting to everlasting. Blessed be your glorious name[b], which is exalted above all blessing and praise.”
translation:
  language: ta
  text: பின்பு லேவியர்களான யேசுவா, கத்மியேல், பானி, ஹஷப்னெயா, செரெபியா, ஹோதியா, செபனியா, பெத்தஹியா ஆகியோர், “எழுந்து நில்லுங்கள்; நித்தியம் முதல் நித்தியம் வரை உங்கள் தேவனாகிய யாவேவைப் போற்றுங்கள். உமது மகிமையான பெயரை[b] அவர்கள் போற்றுவார்களாக[a]; அது எல்லாப் போற்றுதலுக்கும் புகழ்ச்சிக்கும் மேலாக உயர்த்தப்பட்டுள்ளது” என்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரெய வினை மூன்றாம் நபர் பன்மையில் விருப்பம் அல்லது வேண்டுதலைக் குறிக்கிறது: “உமது மகிமையான பெயரை அவர்கள் போற்றுவார்களாக.” சில மொழிபெயர்ப்புகள், “உமது மகிமையான பெயர் போற்றப்படுவதாக” எனக் கொடுக்கின்றன.'
    reason: alternative_reading
  - marker: b
    text: சொற்சொல்லாக, “உமது மகிமையின் பெயர்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ הַלְוִיִּם
  choice: பின்பு லேவியர்களான ... என்றார்கள்
  rationale: வாவ் தொடர் உரையாடலை முன்னெடுப்பதை ‘பின்பு’ இயல்பாகக் காட்டுகிறது; லேவியர் பட்டியல் எழுவாயாகத் தெளிவுபடுத்தப்படுகிறது.
- source_word: קוּמוּ
  choice: எழுந்து நில்லுங்கள்
  rationale: பன்மை ஏவலை நவீனத் தமிழில் இயல்பாகவும் பொதுவழிபாட்டுச் சூழலுக்கு ஏற்றவாறும் வெளிப்படுத்துகிறது.
- source_word: בָּרֲכוּ / וִיבָרְכוּ / בְּרָכָה
  choice: போற்றுங்கள் / போற்றுவார்களாக / போற்றுதல்
  rationale: தேவனை நோக்கிய ברך என்பதன் புகழ்ந்து வாழ்த்தும் பொருளைத் தமிழில் இயல்பாகக் காட்டுவதோடு, மூலத்தின் சொல்வேர் எதிரொலியையும் காக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய தனிப்பெயரான நான்கெழுத்துத் திருப்பெயரை பட்டப்பெயராக மாற்றாமல் ஒலிபெயர்க்கிறது.
- source_word: מִן הָעוֹלָם עַד הָעוֹלָם
  choice: நித்தியமுதல் நித்தியம்வரை
  rationale: எல்லையற்ற காலத்தைக் குறிக்கும் எபிரெய மரபுத்தொடரின் உயர்வான, சுருக்கமான தமிழ் வடிவம்.
- source_word: שֵׁם כְּבוֹדֶךָ
  choice: உமது மகிமையான பெயர்
  rationale: ‘உமது மகிமையின் பெயர்’ என்ற சொற்சொல் வடிவத்தின் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: וּמְרוֹמַם עַל כָּל בְּרָכָה וּתְהִלָּה
  choice: அது எல்லாப் போற்றுதலுக்கும் புகழ்ச்சிக்கும் மேலாக உயர்ந்திருக்கிறது
  rationale: பெயரைக் குறிக்கும் உயர்த்தப்பட்ட நிலையையும், மனிதரின் எல்லா வாழ்த்துக்கும் புகழுக்கும் அப்பாற்பட்ட மேன்மையையும் காக்கிறது.
theological_decisions:
- issue: וִיבָרְכוּ என்பதன் இலக்கணப் பொருள்
  choice: உமது மகிமையான பெயரை அவர்கள் போற்றுவார்களாக
  alternative: உமது மகிமையான பெயர் போற்றப்படுவதாக
  rationale: WLC வடிவம் மூன்றாம் நபர் பன்மை விருப்பநிலையைச் சுட்டுவதால், குறிப்பிடப்படாத பன்மை எழுவாயைத் தமிழிலும் காக்கிறது; வினையை ஒருமைச் செயலற்ற வடிவமாக அமைத்து இலக்கணச் சிக்கலை மறைக்கவில்லை.
- issue: יְהוָה என்ற இறைப்பெயர்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் வரும் உடன்படிக்கைத் தனிப்பெயரை நேரடியாக ஒலிபெயர்த்து, பொதுப்பட்டப்பெயருடன் கலக்காமல் வைத்திருக்கிறது.
- issue: இறைப்பெயர் எல்லாப் போற்றுதலுக்கும் மேலானது
  choice: எல்லாப் போற்றுதலுக்கும் புகழ்ச்சிக்கும் மேலாக உயர்ந்திருக்கிறது
  alternative: எல்லாப் போற்றுதலையும் புகழ்ச்சியையும் விட மேன்மையானது
  rationale: மூலத்தின் உயர்த்தப்பட்ட நிலையை வெளிப்படுத்தும் மொழியையும், இறைவனுக்கு உரிய புகழுக்கும் அவர் பெயரின் அளவிடமுடியாத மேன்மைக்கும் இடையிலான பதற்றத்தையும் காக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழ்; பொதுமக்கள் புரிந்துகொள்ளும் வழிபாட்டு மரியாதைநடை. பெயர்கள் எபிரெய ஒலிக்கு நெருக்கமாகத் தமிழாக்கப்பட்டுள்ளன. இரண்டாம் நபர் மரியாதை ஒருமை ‘உமது’ மூலம் இறைவனை நோக்கிய உரை வேறுபடுத்தப்பட்டுள்ளது.
