  text: וַֽ/תִּתְּנֵ/ם֙ בְּ/יַ֣ד צָֽרֵי/הֶ֔ם וַ/יָּצֵ֖רוּ לָ/הֶ֑ם וּ/בְ/עֵ֤ת צָֽרָתָ/ם֙ יִצְעֲק֣וּ אֵלֶ֔י/ךָ וְ/אַתָּה֙ מִ/שָּׁמַ֣יִם תִּשְׁמָ֔ע וּֽ/כְ/רַחֲמֶ֣י/ךָ הָֽ/רַבִּ֗ים תִּתֵּ֤ן לָ/הֶם֙ מֽוֹשִׁיעִ֔ים וְ/יוֹשִׁיע֖וּ/ם מִ/יַּ֥ד צָרֵי/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/027.yaml
  text: So you gave them into the hand of their adversaries[a], who oppressed them. But in the time of their distress they cried out to you, and you heard from heaven; and according to your abundant mercies you gave them deliverers, who saved them from the hand of their adversaries.
translation:
  language: ta
  text: ஆகவே, நீர் அவர்களை அவர்களுடைய பகைவர்களின் கையில் ஒப்புக்கொடுத்தீர்; அந்தப் பகைவர்கள் அவர்களை ஒடுக்கினார்கள். ஆனால் அவர்களுடைய நெருக்கடியின் காலத்தில் அவர்கள் உம்மை நோக்கிக் கூக்குரலிட்டார்கள். நீர் பரலோகத்திலிருந்து கேட்டீர்; உமது மிகுந்த இரக்கத்தின்படி அவர்களுக்கு விடுவிப்பவர்களை[a] அளித்தீர். அவர்கள் அவர்களை அவர்களுடைய பகைவர்களின் கையிலிருந்து விடுவித்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘மீட்பவர்களை.’ எபிரெயச் சொல் ‘காப்பாற்று, விடுவி’ என்ற பொருளுடைய வினையிலிருந்து வந்தது; இங்கு கடவுள் தமது மக்களை மீட்பதற்காக எழுப்பிய மனிதர்களைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּתְּנֵם בְּיַד
  choice: அவர்களை ... கையில் ஒப்புக்கொடுத்தீர்
  rationale: נתן உடன் בְּיַד வருவது மற்றொருவரின் அதிகாரத்துக்குள் ஒப்புக்கொடுப்பதைக் குறிக்கிறது. தமிழிலும் ‘கையில் ஒப்புக்கொடுத்தீர்’ என்ற உருவகம் இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: צָרֵיהֶם
  choice: அவர்களுடைய பகைவர்கள்
  rationale: צָר என்பது பகைமை கொண்ட எதிரிகளைக் குறிக்கிறது. அடுத்துவரும் ஒடுக்குதல் என்ற வினையுடன் இதைக் கலக்காமல் ‘பகைவர்கள்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: וַיָּצֵרוּ לָהֶם
  choice: அந்தப் பகைவர்கள் அவர்களை ஒடுக்கினார்கள்
  rationale: இந்த வினை நெருக்குதல், துன்புறுத்துதல், அடக்கி ஒடுக்குதல் ஆகிய கருத்துகளைத் தருகிறது. ‘ஒடுக்கினார்கள்’ இச்சூழலிலுள்ள அதிகார அடக்குமுறையை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: וּבְעֵת צָרָתָם
  choice: ஆனால் தங்கள் நெருக்கத்தின் காலத்தில்
  rationale: צָרָה என்பது நெருக்கடி அல்லது துன்ப நிலையைச் சுட்டுகிறது. ‘ஆனால்’ என்பது நிகழ்வுகளுக்கிடையிலான எதிர்மறைத் திருப்பத்தைத் தெளிவாக்குகிறது.
- source_word: יִצְעֲקוּ אֵלֶיךָ
  choice: உம்மை நோக்கிக் கூக்குரலிட்டார்கள்
  rationale: צעק என்பது சாதாரணமாக அழைப்பதைவிட, துன்பத்தில் உதவி வேண்டி உரக்கக் கூப்பிடுவதைக் குறிக்கிறது.
- source_word: מִשָּׁמַיִם תִּשְׁמָע
  choice: நீர் பரலோகத்திலிருந்து கேட்டீர்
  rationale: מִן என்பதன் மூல இடக் கருத்தைப் பாதுகாக்க ‘பரலோகத்திலிருந்து’ என மொழிபெயர்க்கப்பட்டது. வரலாற்று நிகழ்வுகளின் தொடருக்கு ஏற்றவாறு இறந்தகாலம் பயன்படுத்தப்பட்டது.
- source_word: וּכְרַחֲמֶיךָ הָרַבִּים
  choice: உமது மிகுந்த இரக்கத்தின்படி
  rationale: רחמים எபிரெயத்தில் பன்மை வடிவில் இருந்தாலும், தமிழில் இயல்பாக அதன் நிறைவையும் பெருக்கத்தையும் ‘மிகுந்த இரக்கம்’ தெரிவிக்கிறது.
- source_word: מֹשִׁיעִים
  choice: விடுவிப்பவர்களை
  rationale: ישע வேரிலிருந்து வந்த இச்சொல், இங்கு கடவுள் எழுப்பிய மனித மீட்பு முகவர்களைக் குறிக்கிறது. ‘விடுவிப்பவர்கள்’ அவர்களது செயலைத் தெளிவாகக் கூறி, அவர்கள் இறுதி இரட்சகர் என்ற தவறான எண்ணத்தைத் தவிர்க்கிறது.
- source_word: וְיוֹשִׁיעוּם
  choice: அவர்கள் இவர்களை ... விடுவித்தார்கள்
  rationale: மֹשִׁיעִים மற்றும் இவ்வினை ஒரே ישע வேரைச் சேர்ந்தவை. ‘விடுவிப்பவர்கள்/விடுவித்தார்கள்’ என்ற சொல் மறுபயன்பாடு அந்தத் தொடர்பைப் பாதுகாக்கிறது.
- source_word: מִיַּד צָרֵיהֶם
  choice: பகைவர்களின் கையிலிருந்து
  rationale: வசனத்தின் தொடக்கத்திலுள்ள ‘கை’ என்ற அதிகார உருவகமும் ‘பகைவர்கள்’ என்ற சொல்லின் மறுபயன்பாடும் இங்கும் பாதுகாக்கப்பட்டுள்ளன.
theological_decisions:
- issue: மனித முகவர்களைக் குறிக்கும் מֹשִׁיעִים என்ற சொல்லின் மொழிபெயர்ப்பு
  choice: விடுவிப்பவர்கள்
  alternative: மீட்பவர்கள்; இரட்சகர்கள்
  rationale: இச்சொல் ‘காப்பாற்று/விடுவி’ என்ற வேரிலிருந்து வந்தாலும், இங்கு கடவுள் தமது மக்களைப் பகைவர்களிடமிருந்து விடுவிக்க அளித்த மனிதர்களைக் குறிக்கிறது. ‘விடுவிப்பவர்கள்’ மூலத்தின் செயற்பொருளைப் பாதுகாத்து, தெய்வீக இரட்சிப்புக்கும் மனிதக் கருவிகளுக்கும் இடையே தேவையற்ற குழப்பத்தைத் தவிர்க்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் மரியாதை ஒருமை (‘நீர்’, ‘உமது’, ‘உம்மை’) பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் ‘கை’ உருவகமும் முக்கியச் சொற்களின் மறுபயன்பாடும் இயன்றவரை பாதுகாக்கப்பட்டுள்ளன; கடினமான எபிரெயப் பன்மைத் தொடரான ‘பல இரக்கங்கள்’ இயல்பான தமிழுக்காக ‘மிகுந்த இரக்கம்’ என வழங்கப்பட்டுள்ளது.
