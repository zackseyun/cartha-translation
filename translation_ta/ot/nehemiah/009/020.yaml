  text: וְ/רוּחֲ/ךָ֨ הַ/טּוֹבָ֔ה נָתַ֖תָּ לְ/הַשְׂכִּילָ֑/ם וּ/מַנְ/ךָ֙ לֹא מָנַ֣עְתָּ מִ/פִּי/הֶ֔ם וּ/מַ֛יִם נָתַ֥תָּה לָ/הֶ֖ם לִ/צְמָאָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/020.yaml
  text: You gave your good Spirit to instruct them[a], and you did not withhold your manna from their mouth, and you gave them water for their thirst.
translation:
  language: ta
  text: அவர்களுக்கு அறிவுணர்வு அளிக்க உமது நல்ல ஆவியை[a] கொடுத்தீர்; உமது மன்னாவை அவர்களுடைய வாயிலிருந்து விலக்கி வைக்கவில்லை; அவர்களுடைய தாகத்திற்குத் தண்ணீர் கொடுத்தீர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் ‘ஆவி’ என்ற சொல், கடவுளுடைய ஆவியைக் குறிப்பாகவோ அல்லது பொதுவான ‘நல்ல ஆவி’ என்ற பொருளிலோ புரிந்துகொள்ளப்படலாம். இச்சூழலில், இஸ்ரவேலருக்கு அறிவுணர்வு அளித்து வழிநடத்திய கடவுளுடைய ஆவியைக் குறிப்பதாகத் தோன்றுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: רוּחֲךָ הַטּוֹבָה
  choice: உமது நல்ல ஆவி
  rationale: רוּחַ என்பது ஆவி, காற்று, மூச்சு ஆகிய பொருள்களைக் கொள்ளலாம். இங்கு கடவுள் இஸ்ரவேலருக்கு அறிவுணர்வு அளித்து வழிநடத்தும் சூழலில் ‘உமது நல்ல ஆவி’ பொருத்தமானது. தமிழில் எழுத்தின் வடிவத்தால் ஆங்கிலம்போல் பெரிய/சிறிய எழுத்து வேறுபாட்டைக் காட்ட இயலாததால், மாற்றுச் சாத்தியம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: לְהַשְׂכִּילָם
  choice: அவர்களுக்கு அறிவுணர்வு அளிக்க
  rationale: שׂכל என்பதன் ஹிஃபில் வடிவம் புரிந்துகொள்ளச் செய்தல், நுண்ணறிவு அளித்தல், அறிவுறுத்தல் என்ற காரணவினைப் பொருளைக் கொண்டது. ‘அறிவுணர்வு அளிக்க’ அந்த காரணவினை நுணுக்கத்தை இயல்பாகப் பாதுகாக்கிறது.
- source_word: מַנְךָ
  choice: உமது மன்னா
  rationale: வனாந்தரத்தில் கடவுள் அளித்த குறிப்பிட்ட உணவைக் குறிக்கும் மரபான பெயர் என்பதால் ‘மன்னா’ தக்கவைக்கப்படுகிறது.
- source_word: מָנַעְתָּ מִפִּיהֶם
  choice: அவர்களுடைய வாயிலிருந்து விலக்கிவைக்கவில்லை
  rationale: מנע என்பது விலக்குதல் அல்லது கொடுக்காமல் தடுத்தல். ‘வாயிலிருந்து’ என்ற எபிரெய மொழியின் தெளிவான, உருவகமிக்க சொல்லாட்சியும் பாதுகாக்கப்படுகிறது.
- source_word: מַיִם
  choice: தண்ணீர்
  rationale: நவீன பொதுத் தமிழில் இயல்பான, நேரடியான இணைச்சொல்.
- source_word: לִצְמָאָם
  choice: அவர்களுடைய தாகத்திற்கு
  rationale: צָמָא என்பது ‘தாகம்’. לְ முன்னொட்டு இங்கு அவர்களுடைய தேவையை நிறைவேற்றும் நோக்கம் அல்லது தொடர்பைக் காட்டுகிறது; ‘தாகத்திற்கு’ அதைச் சுருக்கமாகப் பிரதிபலிக்கிறது.
theological_decisions:
- issue: רוּחֲךָ הַטּוֹבָה என்பது கடவுளுடைய ஆவியைக் குறிக்கிறதா, அல்லது ‘நல்ல ஆவி’ என்ற பொதுப் பொருளைக் குறிக்கிறதா?
  choice: உமது நல்ல ஆவி
  alternative: உமது நல்ல மனப்பாங்கு / உமது நல்ல ஆவி என்ற பொதுப் பொருள்
  rationale: கற்பித்தல் மற்றும் வழிநடத்தல் பற்றிய சூழல் கடவுளுடைய ஆவிக்கான குறிப்பை வலுப்படுத்துகிறது. ஆனால் எபிரெயச் சொல் தனியே இதை முற்றிலும் தீர்மானிப்பதில்லை; மேலும் தமிழில் பெரிய எழுத்து மூலம் தனிப்பெயர் வேறுபாட்டைக் குறிக்க முடியாது. ஆகவே மூலத்தின் இறையியல் நெருக்கடி அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதை ஒருமை வினைமுற்றுகளுடன் dignified வேதாகம நடையைப் பயன்படுத்துகிறது. ‘வாயிலிருந்து’ என்ற மூலத்தின் நேரடி உருவகம் மென்மைப்படுத்தப்படாமல் பாதுகாக்கப்பட்டுள்ளது; ‘அறிவுணர்வு அளிக்க’ என்பது காரணவினை நுணுக்கத்தைத் தெளிவாகக் காட்டுகிறது.
