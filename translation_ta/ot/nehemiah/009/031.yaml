source:
  edition: WLC
  text: וּֽ/בְ/רַחֲמֶ֧י/ךָ הָ/רַבִּ֛ים לֹֽא עֲשִׂיתָ֥/ם כָּלָ֖ה וְ/לֹ֣א עֲזַבְתָּ֑/ם כִּ֛י אֵֽל חַנּ֥וּן וְ/רַח֖וּם אָֽתָּה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/031.yaml
  text: But in your abundant mercies you did not make an end of them or abandon them[a], for you are a gracious and compassionate God.
translation:
  language: ta
  text: ஆனால், உமது மிகுந்த இரக்கத்தினால் நீர் அவர்களை முற்றிலும் அழித்துவிடவுமில்லை, கைவிடவுமில்லை[a]; ஏனெனில் நீர் அருளும் கருணையும் நிறைந்த கடவுள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்களை முடிவுக்குக் கொண்டுவரவுமில்லை, கைவிடவுமில்லை.”
    reason: לֹא עֲשִׂיתָם כָּלָה என்ற மரபுத்தொடர் ‘முற்றிலும் அழித்தல்’ என்றும் ‘முடிவுக்குக் கொண்டுவருதல்’ என்றும் மொழிபெயர்க்கப்படலாம்.
lexical_decisions:
- source_word: וּבְרַחֲמֶיךָ הָרַבִּים
  choice: ஆனால் உமது மிகுந்த இரக்கத்தினால்
  rationale: רַחֲמִים இரக்கம்/கருணையைக் குறிக்கிறது; הָרַבִּים அதன் மிகுதியை வலியுறுத்துகிறது. முன் கூறப்பட்ட மக்களின் கலகத்துக்கும் கடவுளின் இரக்கத்துக்கும் உள்ள எதிர்மறை மாறுபாட்டைத் தொடக்க வாவ் இங்கு காட்டுவதால் ‘ஆனால்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: לֹא עֲשִׂיתָם כָּלָה
  choice: அவர்களை முற்றிலும் அழித்துவிடவில்லை
  rationale: עשה כלה என்பது ஒருவரை முழுமையாக முடிவுக்குக் கொண்டுவருதல் அல்லது அழித்தொழித்தல் என்ற மரபுத்தொடர். இயல்பான நவீனத் தமிழில் அதன் முழுமை சார்ந்த வலிமையை இது தெளிவாகக் காட்டுகிறது.
- source_word: וְלֹא עֲזַבְתָּם
  choice: கைவிடவில்லை
  rationale: עזב என்பதன் இச்சூழலுக்குரிய பொருள் விட்டு விடுதல் அல்லது ஆதரவின்றிக் கைவிடுதல். ‘கைவிடவில்லை’ என்பது இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: கடவுள் அவர்களை அழிக்காமலும் கைவிடாமலும் இருந்ததற்கான காரணத்தை அறிமுகப்படுத்துகிறது.
- source_word: אֵל
  choice: கடவுள்
  rationale: இங்கு אֵל என்பது கடவுளைக் குறிக்கும் பொதுவான பெயர்; ‘வல்லமையுள்ளவர்’ போன்ற கூடுதல் வலியுறுத்தல் மூலத்தில் கட்டாயமில்லை.
- source_word: חַנּוּן
  choice: அருளும் உள்ள
  rationale: חַנּוּן கடவுள் தயவாக அருள் வழங்குகிறவர் என்பதைக் குறிக்கிறது. தொடரும் רַחוּם என்பதிலிருந்து சொல்லியல் வேறுபாட்டைப் பேணுகிறது.
- source_word: וְרַחוּם
  choice: கருணையும் உள்ள
  rationale: רַחוּם ஆழ்ந்த பரிவையும் கருணையையும் குறிக்கிறது. ‘அருள்’ என்பதுடன் ஒன்றாக்காமல் இணைத் தன்மையைப் பேணுகிறது.
- source_word: אַתָּה
  choice: நீர் ... கடவுள்
  rationale: தனி முன்னிலைப் பெயர் தரும் வலியுறுத்தலை மரியாதையான ‘நீர்’ என்பதும் தமிழின் இயல்பான பயனிலை அமைப்பும் வெளிப்படுத்துகின்றன.
theological_decisions:
- issue: חַנּוּן וְרַחוּם என்ற இறைப் பண்பு இணையின் மொழிபெயர்ப்பு
  choice: அருளும் கருணையும் உள்ள
  alternative: கிருபையும் இரக்கமும் உள்ள
  rationale: இரு எபிரெயப் பண்புகளின் வேறுபாட்டைப் பேணுவதுடன், குறிப்பிட்ட சமய மரபின் தொழில்நுட்பச் சொல்லாட்சியைத் திணிக்காமல் பொதுவான நவீனத் தமிழில் கடவுளின் அருளையும் ஆழ்ந்த பரிவையும் தெரிவிக்கிறது.
- issue: தொடக்க וּ-வின் உரைநடைச் செயல்பாடு
  choice: ஆனால்
  alternative: மேலும் / அன்றியும்
  rationale: முந்தைய கலகத்துக்கு மாறாகக் கடவுள் காட்டிய இரக்கத்தை இவ்வாக்கியம் எடுத்துரைப்பதால் எதிர்மறை மாறுபாட்டைக் காட்டும் ‘ஆனால்’ சூழலுக்கு ஏற்றது.
translation_notes:
  register: நவீன நிலையான தமிழில், ஜெப உரைக்கு ஏற்ற கண்ணியமான நடையுடன் கடவுளை ‘நீர்/உமது’ எனக் குறிப்பிட்டுள்ளது. மூலத்தின் இணை அமைப்பும் இறைப் பண்புகளுக்கிடையேயான சொல்லியல் வேறுபாடும் பேணப்பட்டுள்ளன.
