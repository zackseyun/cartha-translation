revisions:
- from: ஆனால் உமது மிகுந்த இரக்கத்தினால், அவர்களை முற்றிலும் அழித்துவிடவோ கைவிடவோ இல்லை[a]; ஏனெனில் நீர் அருளும் கருணையும் உள்ள கடவுள்.
  to: ஆனால், உமது மிகுந்த இரக்கத்தினால் நீர் அவர்களை முற்றிலும் அழித்துவிடவுமில்லை, கைவிடவுமில்லை[a]; ஏனெனில் நீர் அருளும் கருணையும் நிறைந்த கடவுள்.
  rationale: The revision supplies the explicit subject ‘நீர்’ for grammatical completeness, uses parallel negative forms for the two Hebrew clauses, and improves the naturalness of the divine-character predicate. It preserves the source’s adversative relation, plural/abundant mercy, and the alternate lexical possibility for the idiom עָשָׂה כָלָה.
