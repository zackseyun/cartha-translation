  text: וּ/בְ/יוֹם֩ עֶשְׂרִ֨ים וְ/אַרְבָּעָ֜ה לַ/חֹ֣דֶשׁ הַ/זֶּ֗ה נֶאֶסְפ֤וּ בְנֵֽי יִשְׂרָאֵל֙ בְּ/צ֣וֹם וּ/בְ/שַׂקִּ֔ים וַ/אֲדָמָ֖ה עֲלֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/001.yaml
  text: On the twenty-fourth day of this month[a], the sons of Israel assembled with fasting, in sackcloth[b], and with dirt on them.
translation:
  language: ta
  text: இந்த மாதத்தின் இருபத்துநான்காம் நாளில், இஸ்ரவேலின் மகன்கள்[a] உபவாசமிருந்து, சாக்குத்துணி ஆடைகளை அணிந்து, தங்கள்மேல் மண்ணைப் போட்டுக்கொண்டு[b] ஒன்றுகூடினார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இஸ்ரவேலர்”; பாரம்பரியமாக, “இஸ்ரவேலின் பிள்ளைகள்.”
    reason: lexical_alternative
  - marker: b
    text: சொல்லுக்குச் சொல், “அவர்கள்மேல் மண்.” துக்கத்தையும் மனந்திரும்புதலையும் வெளிப்படுத்துவதற்காக அவர்கள் தங்கள்மேல் மண்ணைப் போட்டுக்கொண்டார்கள்.
    reason: cultural_note
lexical_decisions:
- source_word: וּבְיוֹם עֶשְׂרִים וְאַרְבָּעָה לַחֹדֶשׁ הַזֶּה
  choice: இந்த மாதத்தின் இருபத்துநான்காம் நாளில்
  rationale: எபிரெய தேதிக் கூறுமுறையை இயல்பான நவீன தமிழில் வரிசை எண்ணாகத் தருகிறது. தொடக்க וּ־க்கு தனியாக ‘இப்போது’ போன்ற பொருளைச் சேர்க்கவில்லை.
- source_word: נֶאֶסְפוּ
  choice: ஒன்றுகூடினார்கள்
  rationale: நிஃபால் வடிவம் மக்கள் ஓர் அவையாகக் கூடிவந்ததைக் குறிக்கிறது; செயப்படுவினைத் தோற்றத்தை வற்புறுத்தாமல் தமிழில் இயல்பாகக் கூட்டுச் செயலை வெளிப்படுத்துகிறது.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் மகன்கள்
  rationale: குடும்ப உறவைக் காட்டும் எபிரெயச் சொற்றொடரையும் அதன் ஆண்பால் பன்மை வடிவையும் பாதுகாக்கிறது; ‘இஸ்ரவேலர்’ என்பது இயல்பான மாற்றாக இருந்தாலும் மூலத்தின் உறவுமுறை உருவகத்தை மறைக்கும்.
- source_word: בְּצוֹם
  choice: உபவாசமிருந்து
  rationale: கூடிவந்தபோது மேற்கொண்ட நோன்புச் செயலை நவீனத் தமிழில் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: וּבְשַׂקִּים
  choice: சாக்குத்துணி ஆடைகளை அணிந்து
  rationale: துக்கம் மற்றும் மனந்திரும்புதலின் அடையாளமாக அணிந்த கரடுமுரடான துணியாடையைக் குறிக்கிறது; வெறும் ‘சாக்குகளில்’ என்ற சொல்லுக்குச் சொல் வடிவத்தைத் தவிர்க்கிறது.
- source_word: וַאֲדָמָה עֲלֵיהֶם
  choice: தங்கள்மேல் மண்ணைப் போட்டுக்கொண்டு
  rationale: אֲדָמָה என்பதன் ‘மண்/நிலம்’ பொருளையும், அது அவர்கள்மேல் இருந்தது என்பதையும் காக்கிறது. மூலத்தில் இல்லாத ‘தலையில்’ என்ற விவரத்தைச் சேர்க்கவில்லை.
theological_decisions:
- issue: கூட்டத்தின் அடையாளம்
  choice: இஸ்ரவேலின் மகன்கள்
  alternative: இஸ்ரவேலர் / இஸ்ரவேலின் பிள்ளைகள்
  rationale: இது பாலினம் அல்லது உடன்படிக்கை உறுப்பினர் பற்றிய ஒரு இறையியல் முடிவைச் சேர்க்காமல், மூலத்தின் ஆண்பால் குடும்பச் சொற்றொடரை வெளிப்படையாக வைத்திருக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘உபவாசம்’ மற்றும் ‘சாக்குத்துணி’ ஆகியவை தமிழ் வேதாகமப் பயன்பாட்டில் பரிச்சயமானவையாக இருப்பதோடு இங்கு சூழலால் தெளிவுபடுத்தப்படுகின்றன.
