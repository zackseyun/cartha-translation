  source_fidelity: மூல எபிரெயத்தின் காலக் குறிப்பு, கூடிவருதல், இஸ்ரவேலின் குடும்ப அடையாளச் சொற்றொடர், உபவாசம், சாக்குத்துணி, அவர்கள்மேல் மண் ஆகிய அனைத்தும் பொருளிழப்பின்றி தரப்பட்டுள்ளன. நிஃபால் வினைச்சொல்லுக்கு இயல்பான தமிழில் “ஒன்றுகூடினார்கள்” என்பது பொருத்தமானது. “தங்கள்மேல் மண்ணைப் போட்டுக்கொண்டு” என்பது சூழலில் உள்ள துக்கச் சடங்கைத் தெளிவாக வெளிப்படுத்துகிறது; மூலத்தில் இல்லாத உடல் உறுப்பைச் சேர்ப்பதில்லை.
  naturalness: நடை நவீன நிலையான தமிழில் தெளிவாகவும் கண்ணியமாகவும் உள்ளது. “உபவாசமிருந்து,” “சாக்குத்துணி ஆடைகளை அணிந்து,” என்ற தொடர்கள் இயல்பானவை; தொடர்வரிசை மூலத்தின் உடன்சூழ் நிலைகளை நன்றாகக் காட்டுகிறது.
