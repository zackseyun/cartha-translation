base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/015.yaml
  text: You gave them bread from heaven for their hunger[a], and you brought out water from the rock for their thirst, and you told them to go in to possess the land that you had sworn to give them.
translation:
  language: ta
  text: அவர்களுடைய பசிக்காக வானத்திலிருந்து அப்பத்தை அவர்களுக்குக் கொடுத்தீர்; அவர்களுடைய தாகத்துக்காகப் பாறையிலிருந்து தண்ணீரை வரச்செய்தீர். எந்த நாட்டை அவர்களுக்குக் கொடுப்பதாக நீர் உமது கையை உயர்த்தினீரோ[a], அந்த நாட்டிற்குள் சென்று அதைக் கைப்பற்றிக்கொள்ளும்படி அவர்களிடம் சொன்னீர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அதாவது, “நீர் அவர்களுக்குக் கொடுப்பதாகச் சத்தியம் செய்திருந்த நாட்டை.” எபிரெய மொழியில் “கையை உயர்த்துதல்” என்பது சத்தியம் செய்வதைக் குறிக்கும் மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֶחֶם מִשָּׁמַיִם
  choice: வானத்திலிருந்து அப்பம்
  rationale: ‘அப்பம்’ என்ற எபிரெய உருவகத்தைத் தக்கவைக்கிறது; மன்னா என்று விளக்கிப் பொருளை மிகைப்படுத்தவில்லை.
- source_word: לִרְעָבָם
  choice: அவர்களுடைய பசிக்காக
  rationale: லாமேத் முன்னொட்டின் தொடர்பு/தேவை சார்ந்த பொருளை இயல்பான தமிழில் தருகிறது; இணையான ‘தாகத்துக்காக’ என்பதோடும் அமைப்பைத் தக்கவைக்கிறது.
- source_word: מַיִם מִסֶּלַע
  choice: பாறையிலிருந்து தண்ணீர்
  rationale: வனாந்தர நிகழ்வைச் சுட்டும் மூலப்படிமத்தை எளிய நவீன தமிழில் பாதுகாக்கிறது.
- source_word: הוֹצֵאתָ
  choice: வரச்செய்தீர்
  rationale: יצא என்பதன் ஹிஃபில் காரணவினைப் பொருளைத் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: לִצְמָאָם
  choice: அவர்களுடைய தாகத்துக்காக
  rationale: ‘அவர்களுடைய பசிக்காக’ என்பதற்கு இணையான எபிரெய கட்டமைப்பையும் கவிதைச் சமநிலையையும் காக்கிறது.
- source_word: וַתֹּאמֶר לָהֶם
  choice: அவர்களிடம் சொன்னீர்
  rationale: வினையின் அடிப்படைப் பொருளான ‘சொல்’ என்பதையே தருகிறது; ‘கட்டளையிட்டீர்’ என்று வலுப்படுத்தவில்லை.
- source_word: לָבוֹא לָרֶשֶׁת
  choice: நாட்டிற்குள் சென்று அதைக் கைப்பற்றிக்கொள்ள
  rationale: בוא என்பதன் உள்ளே செல்லும் இயக்கத்தையும் ירש என்பதன் நிலத்தை உடைமையாக்கும் செயற்பொருளையும் இயல்பான தமிழில் இணைக்கிறது.
- source_word: נָשָׂאתָ אֶת יָדְךָ
  choice: நீர் உமது கையை உயர்த்தினீர்
  rationale: சத்தியம் செய்வதைக் குறிக்கும் எபிரெய உருவகச் சொல்லாட்சியை முதன்மை உரையில் அப்படியே தக்கவைக்கிறது; அதன் வழக்குப் பொருள் அடிக்குறிப்பில் விளக்கப்படுகிறது.
- source_word: לָתֵת לָהֶם
  choice: அவர்களுக்குக் கொடுப்பதாக
  rationale: நிலத்தைக் கொடுப்பதே உயர்த்தப்பட்ட கையால் உறுதிசெய்யப்பட்டதென்பதைத் தெளிவாகக் காட்டுகிறது.
theological_decisions:
- issue: நிலத்தைக் கொடுப்பது குறித்த தேவனுடைய சத்தியத்தைச் சுட்டும் கை உயர்த்தும் சொல்லாட்சி
  choice: ‘நீர் உமது கையை உயர்த்தினீர்’ என்ற மனித உருவகச் சொல்லாட்சியை முதன்மை உரையில் தக்கவைத்தல்
  alternative: ‘நீர் சத்தியம் செய்தீர்’ என்று நேரடியாக மொழிபெயர்த்தல்
  rationale: எபிரெய மொழியில் இது சத்தியம் செய்வதைக் குறிக்கும் மரபுத்தொடர். உருவகத்தைத் தக்கவைப்பது உடன்படிக்கைச் சூழலின் மூலமொழித் தன்மையைப் பாதுகாக்கிறது; அதன் பொருளை அடிக்குறிப்பு தெளிவுபடுத்துகிறது.
translation_notes:
  register: நவீனத் தரமான, மரியாதையும் வாசிப்புத் தெளிவும் கொண்ட தமிழ் பயன்படுத்தப்பட்டுள்ளது. தேவனை நோக்கிய இரண்டாம் நபர் மரியாதை வினைமுற்றுகள் (‘கொடுத்தீர்’, ‘வரச்செய்தீர்’, ‘சொன்னீர்’) ஒரே சீரில் உள்ளன. மூலத்தின் இணை அமைப்பும் சத்திய உருவகமும் பாதுகாக்கப்பட்டுள்ளன.
