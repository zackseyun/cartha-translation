base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/016.yaml
  text: But they[a], our fathers, acted presumptuously and stiffened their neck[c][b], and did not listen to your commandments.
translation:
  language: ta
  text: ஆனால் அவர்களோ—எங்கள் முற்பிதாக்கள்—துணிகரமாக நடந்துகொண்டு[a], தங்கள் கழுத்தை விறைப்பாக்கி[b], உமது கட்டளைகளுக்குச் செவிகொடுக்கவில்லை[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “செருக்குடன் நடந்துகொண்டு” அல்லது “அகந்தையுடன் நடந்துகொண்டு.”
    reason: lexical_alternative
  - marker: b
    text: “தங்கள் கழுத்தை விறைப்பாக்கி” என்பது பிடிவாதமாகி எதிர்த்ததைக் குறிக்கும் எபிரெய மரபுத்தொடர்.
    reason: cultural_note
  - marker: c
    text: அல்லது, “கவனிக்கவில்லை” அல்லது “கீழ்ப்படியவில்லை.”
    reason: lexical_alternative
lexical_decisions:
