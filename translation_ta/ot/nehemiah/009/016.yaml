- source_word: וַאֲבֹתֵינוּ
  choice: எங்கள் முற்பிதாக்கள்
  rationale: ‘எங்கள் தந்தையர்’ என்ற சொல்லடியான பொருளை வரலாற்று முன்னோர்கள் என்ற சூழலுக்கேற்ற, dignified modern Tamil வடிவில் தருகிறது; முந்தைய தலைமுறையினரோடு சமூகத்தின் ஒன்றிப்பையும் காக்கிறது.
- source_word: הֵזִידוּ
  choice: துணிகரமாக நடந்துகொண்டு
