  rationale: பிடிவாதமான எதிர்ப்பைக் குறிக்கும் எபிரெய உருவகத்தை விளக்கமாக மாற்றாமல் முதன்மை உரையில் காக்கிறது.
- source_word: וְלֹא שָׁמְעוּ אֶל
  choice: செவிகொடுக்கவில்லை
  rationale: שׁמע אֶל என்பதன் ‘கேட்டல்/கவனித்தல்’ பொருளையும், கட்டளைகளுக்குக் கீழ்ப்படிய மறுத்த விளைவையும் இயல்பான தமிழில் இணைக்கிறது.
- source_word: מִצְוֺתֶיךָ
  choice: உமது கட்டளைகள்
  rationale: உடன்படிக்கை மற்றும் சட்டச் சூழலுக்குரிய கட்டளைப் பொருளை மரியாதையான இறைமுகப்பு நடையில் தருகிறது.
theological_decisions:
- issue: முந்தைய பாவத் தலைமுறைகளோடு சமூக அடையாளப்படுத்தல்
  choice: ‘எங்கள் முற்பிதாக்கள்’ என்பதை முதன்மை உரையில் வைத்தல்
  alternative: ‘எங்கள் முன்னோர்கள்’
  rationale: ஜெபிக்கும் தற்போதைய சமூகம் முந்தைய தலைமுறையினரைத் தங்களுடையவர்களாக வெளிப்படையாக ஏற்றுக்கொள்கிறது. ‘முற்பிதாக்கள்’ மூலத்தின் தந்தைமார் சொல்லையும் உடன்படிக்கை-வரலாற்று ஒன்றிப்பையும் காக்கிறது; இதற்கு மேலான கோட்பாட்டுப் பொருளைத் திணிக்கவில்லை.
- issue: கேட்காதது மற்றும் கீழ்ப்படியாதது இடையிலான நுணுக்கம்
  choice: ‘செவிகொடுக்கவில்லை’
  alternative: ‘கீழ்ப்படியவில்லை’
  rationale: மூல வினைச்சொல்லின் கேட்பது/கவனிப்பது என்ற படிமத்தைத் தக்கவைத்தபடியே, கட்டளைகள் என்ற செயப்படுபொருள் கீழ்ப்படியாமையை உணர்த்த அனுமதிக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, மரியாதைமிக்க வேதாகம நடை பயன்படுத்தப்பட்டுள்ளது. ‘உமது’ என்பது ஜெபத்தில் இறைவனை நேரடியாக அழைக்கும் உயரிய ஒருமை நடையைப் பேணுகிறது. எபிரெய உருவகம் முதன்மை உரையில் வைக்கப்பட்டு அடிக்குறிப்பில் விளக்கப்படுகிறது.
