    rationale: רַב־חֶסֶד என்பது மாறாத அன்பில் மிகுந்த/நிறைந்தவர் என்பதாகும். ‘பெருகியவர்’ தமிழில் வளர்ச்சி அல்லது அதிகரிப்பு என்ற பொருளைத் தரலாம்; நிலையான பண்பின் மிகுதியைத் தெளிவாகக் கூறாது.
