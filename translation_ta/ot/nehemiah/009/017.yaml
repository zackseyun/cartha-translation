  source_fidelity: முதன்மை உரை பெரும்பாலும் எபிரேய மூலத்திற்கும் ஆங்கில ஆய்வுத் தடத்திற்கும் உண்மையாக உள்ளது. எனினும், ‘கழுத்தை வணங்காதபடி கடினப்படுத்தி’ என்பதில் மூலத்தின் உருவகத்திற்கு அப்பாற்பட்ட விளக்கச் சேர்க்கை உள்ளது; அதை நீக்குவது பொருத்தம். மேலும் רַב־חֶסֶד என்பதற்கு ‘மாறாத அன்பில் பெருகியவர்’ என்பது தமிழில் ‘அன்பில் வளர்பவர்’ என்ற தவறான நிழலைத் தரக்கூடும்; ‘மாறாத அன்பில் மிகுந்தவர்’ மூலத்தின் மிகுதியைத் துல்லியமாகக் காட்டுகிறது.
  naturalness: ‘செவிகொடுக்க மறுத்தார்கள்,’ ‘அற்புதச் செயல்கள்,’ ‘ஒரு தலைவனை நியமித்தார்கள்,’ மற்றும் ‘அவர்களைக் கைவிடவில்லை’ ஆகியவை நவீன நிலையான தமிழில் இயல்பாக உள்ளன. திருத்தப்பட்ட இணைப்பட்ட பண்புக்கூறுகள் வாசிப்பைச் சீராக்குகின்றன.
  terminology: ‘அடிமைத்தனம்,’ ‘கலகம்,’ ‘மன்னிப்பில் மிகுந்த கடவுள்,’ மற்றும் ‘மாறாத அன்பு’ ஆகியவை சூழலுக்கும் முக்கிய இறையியல் சொற்களுக்கும் ஏற்றவை. அடிக்குறிப்பு எபிரேய பன்மை வடிவத்தின் வலியுறுத்தலைச் சரியாகக் காக்கிறது.
