  revised_text: ஆனால் அவர்கள் செவிகொடுக்க மறுத்தார்கள்; நீர் அவர்கள் நடுவில் செய்த உமது அற்புதச் செயல்களை அவர்கள் நினைவுகூரவில்லை. அவர்கள் தங்கள் கழுத்தைக் கடினப்படுத்தி, தங்கள் கலகத்தில் அடிமைத்தனத்திற்குத் திரும்பிச் செல்ல ஒரு தலைவனை நியமித்தார்கள். ஆனால் நீர் மன்னிப்பில் மிகுந்த கடவுள்[a]; அருளுள்ளவரும் இரக்கமுள்ளவரும், கோபிக்கத் தாமதிப்பவரும், மாறாத அன்பில் மிகுந்தவரும் ஆவீர்; அவர்களைக் கைவிடவில்லை.
