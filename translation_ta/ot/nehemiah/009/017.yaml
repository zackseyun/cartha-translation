    rationale: וַיַּקְשׁוּ אֶת־עָרְפָּם என்பது ‘தங்கள் கழுத்தைக் கடினப்படுத்தினர்’ என்ற உருவகம். ‘வணங்காதபடி’ அதன் உட்குறிப்பை வெளிப்படுத்தினாலும் மூலத்தில் இல்லாத விளக்கத்தை நேரடியாகச் சேர்க்கிறது.
