base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/017.yaml
  text: But they refused to listen and did not remember your wonders that you had done among them. They stiffened their necks and, in their rebellion, appointed a leader to return to their slavery. But you are a forgiving God[a], gracious and compassionate, slow to anger and abundant in steadfast love, and you did not forsake them.
translation:
  language: ta
  text: ஆனால் அவர்கள் செவிகொடுக்க மறுத்தார்கள்; நீர் அவர்கள் நடுவில் செய்த உமது அற்புதச் செயல்களை அவர்கள் நினைவுகூரவில்லை. அவர்கள் தங்கள் கழுத்தைக் கடினப்படுத்தி, தங்கள் கலகத்தில் அடிமைத்தனத்திற்குத் திரும்பிச் செல்ல ஒரு தலைவனை நியமித்தார்கள். ஆனால் நீர் மன்னிப்பில் மிகுந்த கடவுள்[a]; அருளுள்ளவரும் இரக்கமுள்ளவரும், கோபிக்கத் தாமதிப்பவரும், மாறாத அன்பில் மிகுந்தவரும் ஆவீர்; அவர்களைக் கைவிடவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரேயத்தில் சொல்லர்த்தமாக, “மன்னிப்புகளின் கடவுள்”; பன்மை வடிவம் அவருடைய மன்னிப்பின் மிகுதியை வலியுறுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְמָאֲנוּ לִשְׁמֹעַ
  choice: செவிகொடுக்க மறுத்தார்கள்
  rationale: שׁמע என்பதில் கேட்டல் மட்டுமல்ல, கீழ்ப்படிதலின் நிழற்பொருளும் உள்ளது; ‘செவிகொடுக்க’ என்பது இரண்டையும் இயல்பாகத் தக்கவைக்கிறது.
- source_word: נִפְלְאֹתֶיךָ
  choice: உமது அற்புதச் செயல்கள்
  rationale: தேவன் செய்த வியப்பூட்டும் வல்ல செயல்களைக் குறிக்கும் பெயர்ச்சொல்லின் செயற்பொருளைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: עָשִׂיתָ עִמָּהֶם
  choice: நீ அவர்கள் நடுவில் செய்த
  rationale: עִם இங்கு இஸ்ரயேல் சமூகத்தின் நடுவில் நிகழ்ந்த செயல்களைச் சுட்டுகிறது; வெறும் நன்மை செய்தல் என்று குறுக்கப்படவில்லை.
- source_word: וַיַּקְשׁוּ אֶת־עָרְפָּם
  choice: தங்கள் கழுத்தை வணங்காதபடி கடினப்படுத்தி
  rationale: எபிரேய உருவகத்தைத் தக்கவைத்து, பிடிவாதத்தையும் கீழ்ப்படியாமையையும் தமிழ் வாசகருக்குத் தெளிவாக்குகிறது.
- source_word: וַיִּתְּנוּ רֹאשׁ
  choice: ஒரு தலைவனை நியமித்தார்கள்
  rationale: சொல்லர்த்தமான ‘ஒரு தலையை வைத்தார்கள்’ என்பதற்குப் பதிலாக தலைமைக்கு ஒருவரை ஏற்படுத்தியதைக் குறிக்கும் எபிரேய மரபுத்தொடரின் பொருள் வழங்கப்படுகிறது.
- source_word: לָשׁוּב לְעַבְדֻתָם
  choice: அடிமைத்தனத்திற்குத் திரும்பிச் செல்ல
  rationale: עַבְדוּת என்பது பொதுவான பணிவிடையல்ல, எகிப்திய அடிமைநிலைக்குத் திரும்புதலைக் குறிக்கிறது.
- source_word: בְּמִרְיָם
  choice: தங்கள் கலகத்தில்
  rationale: தலைவனை நியமித்த செயல் அவர்களுடைய கலக மனநிலையில் நிகழ்ந்தது என்ற சூழ்நிலைப் பொருளைத் தக்கவைக்கிறது.
- source_word: אֱלוֹהַּ סְלִיחוֹת
  choice: மன்னிப்புகள் நிறைந்த கடவுள்
  rationale: தமிழில் இயல்பாக இருக்கும்போதே, எபிரேயப் பன்மை வலியுறுத்தும் மிகுதியான மன்னிப்பை வெளிப்படுத்துகிறது.
- source_word: חַנּוּן וְרַחוּם
  choice: அருளும் இரக்கமும் உள்ளவர்
  rationale: முதல் சொல் அருள் வழங்கும் தன்மையையும் இரண்டாவது ஆழ்ந்த பரிவையும் தனித்தனியாகத் தக்கவைக்கிறது.
- source_word: אֶרֶךְ אַפַּיִם
  choice: கோபிக்கத் தாமதிப்பவர்
  rationale: ‘நீண்ட மூக்கு’ என்ற சொல்லர்த்த உருவகத்திற்குப் பதிலாக அதன் நிலையான கருத்தாகிய பொறுமையைத் துல்லியமாகக் கூறுகிறது.
- source_word: רַב־חֶסֶד
  choice: மாறாத அன்பில் பெருகியவர்
  rationale: חֶסֶד என்பதிலுள்ள உறுதியான, விசுவாசமிக்க உறவன்பையும் רַב என்பதிலுள்ள மிகுதியையும் வெளிப்படுத்துகிறது.
- source_word: וְלֹא עֲזַבְתָּם
  choice: நீர் அவர்களைக் கைவிடவில்லை
  rationale: עזב என்பதன் உறவு மற்றும் உடன்படிக்கைச் சூழலிலான கைவிடுதல் என்ற வலிமையை இயல்பான தமிழில் தருகிறது.
theological_decisions:
- issue: தெய்வீக மன்னிப்பை விவரிக்கும் אֱלוֹהַּ סְלִיחוֹת என்ற பன்மை அமைப்பு
  choice: மன்னிப்புகள் நிறைந்த கடவுள்
  alternative: மன்னிக்கும் கடவுள்
  rationale: எபிரேயத்தின் சொல்லர்த்தப் பன்மையை அசட்டையாக அப்படியே வைக்காமல், அது வலியுறுத்தும் தேவனுடைய மிகுதியான மன்னிக்கும் இயல்பை முதன்மை உரையில் பாதுகாக்கிறது; அடிக்குறிப்பு மூல அமைப்பை விளக்குகிறது.
- issue: חֶסֶד என்ற உடன்படிக்கைச் செறிவுள்ள சொல்லின் மொழிபெயர்ப்பு
  choice: மாறாத அன்பு
  alternative: பேரன்பு / உடன்படிக்கை அன்பு
  rationale: ‘மாறாத அன்பு’ அன்பு, பற்றுறுதி, நிலைத்தன்மை ஆகியவற்றை எடுத்துரைக்கிறது; ‘உடன்படிக்கை’ என்று மூலத்தில் இல்லாத சொல்லை நேரடியாகச் சேர்ப்பதைத் தவிர்க்கிறது.
- issue: கழுத்தைக் கடினப்படுத்துதல் என்ற உருவகம்
  choice: கழுத்தை வணங்காதபடி கடினப்படுத்துதல்
  alternative: பிடிவாதமாக இருத்தல்
  rationale: உருவகத்தை நீக்காமல் அதன் கீழ்ப்படியாமை சார்ந்த பொருளை விளங்கச்செய்கிறது; இதனால் உரையின் தெய்வீக அழைப்புக்கு எதிரான மனிதக் கலகத்தின் வலிமை தக்கவைக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு விளங்கும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. கடவுளை நோக்கிய உரையில் மரியாதைப் பன்மையான ‘நீர்/உமது’ பயன்படுத்தப்பட்டுள்ளது. எபிரேய உருவகங்கள் பொருள் மறையாத அளவில் பாதுகாக்கப்பட்டுள்ளன.
