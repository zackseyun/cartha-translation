  source_fidelity: மூல எபிரெயத்தின் செயல்வரிசை, எட்டு பெயர்களின் பட்டியல் (பானி இருமுறை வருதலும் உட்பட), லேவியர்களோடு தொடர்புடைய மַעֲלֵה என்ற இடக்குறிப்பு, யாவேவை நோக்கிய உரத்த அழைப்பு ஆகியவை துல்லியமாகப் பிரதிபலிக்கப்படுகின்றன. “படிக்கட்டின்மேல்” என்பது சாத்தியமான முதன்மை வாசிப்பு; அடிக்குறிப்பு உயரமான இடம்/மேடை என்ற மாற்றுச் சாத்தியத்தையும் முறையாகக் காக்கிறது.
