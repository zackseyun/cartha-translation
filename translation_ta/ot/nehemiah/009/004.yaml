source:
  edition: WLC
  text: וַ/יָּ֜קָם עַֽל מַֽעֲלֵ֣ה הַ/לְוִיִּ֗ם יֵשׁ֨וּעַ וּ/בָנִ֜י קַדְמִיאֵ֧ל שְׁבַנְיָ֛ה בֻּנִּ֥י שֵׁרֵבְיָ֖ה בָּנִ֣י כְנָ֑נִי וַֽ/יִּזְעֲקוּ֙ בְּ/ק֣וֹל גָּד֔וֹל אֶל יְהוָ֖ה אֱלֹהֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/004.yaml
  text: Then Jeshua[a], Bani, Kadmiel, Shebaniah, Bunni, Sherebiah, Bani, and Kenani stood on the platform of the Levites, and they cried out with a loud voice to Yahweh their God.
translation:
  language: ta
  text: அப்போது யேசுவா, பானி, கத்மியேல், செபனியா, புன்னி, செரெபியா, பானி, கெனானி ஆகியோர் லேவியர்களின் படிக்கட்டின்மேல்[a] நின்று, தங்கள் இறைவனாகிய யாவேவை நோக்கி உரத்த குரலில் கூக்குரலிட்டார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “லேவியர்களின் ஏற்றம்/படிகள்.” இது லேவியர்களுடன் தொடர்புடைய உயரமான இடத்தையோ படிக்கட்டையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: நின்று
  rationale: קום இங்கு எழுந்து நிற்பதை அல்லது நிற்கும் நிலையை ஏற்றுக்கொள்வதைக் குறிக்கிறது. பட்டியலிடப்பட்ட பலருடன் இயல்பான தமிழில் பன்மைப் பொருளுடன் வழங்கப்பட்டுள்ளது.
- source_word: מַעֲלֵה הַלְוִיִּם
  choice: லேவியர்களின் படிக்கட்டு
  rationale: מַעֲלֵה என்பது ஏற்றம், படி அல்லது படிக்கட்டு எனப் பொருள்படலாம். மூலத்தின் இடவமைப்பு தெளிவின்மையை காக்க ‘படிக்கட்டு’ என மொழிபெயர்த்து, உயர்ந்த மேடை என்ற சாத்தியத்தை அடிக்குறிப்பில் குறிப்பிட்டுள்ளது.
- source_word: יֵשׁוּעַ וּבָנִי קַדְמִיאֵל שְׁבַנְיָה בֻּנִּי שֵׁרֵבְיָה בָּנִי כְנָנִי
  choice: யேசுவா, பானி, கத்மியேல், செபனியா, புன்னி, செரெபியா, பானி, கெனானி
  rationale: ஆள் பெயர்கள் எபிரெய ஒலிவடிவங்களுக்கு நெருக்கமாகத் தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளன. மூலத்தில் இருமுறை வரும் பானி என்ற பெயர் அப்படியே தக்கவைக்கப்பட்டுள்ளது.
- source_word: וַיִּזְעֲקוּ
  choice: கூக்குரலிட்டார்கள்
  rationale: זעק என்பது தீவிரமாகக் குரலெழுப்புவதை, குறிப்பாக இறைவனை நோக்கி முறையிடுவதைச் சுட்டுகிறது; ‘கூக்குரலிட்டார்கள்’ அந்த வலிமையை வெளிப்படுத்துகிறது.
- source_word: בְּקוֹל גָּדוֹל
  choice: உரத்த குரலில்
  rationale: எபிரெய மரபுத்தொடரின் பொருளை இயல்பான, தெளிவான தமிழில் தருகிறது.
- source_word: אֶל יְהוָה
  choice: யாவேவை நோக்கி
  rationale: אֶל என்பது அழைப்பு செலுத்தப்படும் திசையைச் சுட்டுவதால் ‘நோக்கி’ என வழங்கப்பட்டுள்ளது; יהוה என்பது தனிப்பெயராக ‘யாவே’ என ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: אֱלֹהֵיהֶם
  choice: தங்கள் இறைவன்
  rationale: மூன்றாம் நபர் பன்மை உடைமை விகுதியைத் தமிழில் இயல்பாக ‘தங்கள்’ வெளிப்படுத்துகிறது; ‘இறைவன்’ இங்கு இஸ்ரவேலரின் கடவுளைக் குறிக்கிறது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரை வழங்குதல்
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலத்தில் உடன்படிக்கையின் தனிப்பெயரான יהוה நேரடியாக இருப்பதால், பட்டப்பெயராக மாற்றாமல் நவீன ஆய்வுலகில் பரவலான ‘யாவே’ என்ற வடிவில் ஒலிபெயர்க்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன செந்தமிழ் நடையில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான சொற்கள் பயன்படுத்தப்பட்டுள்ளன. பெயர்ப்பட்டியலின் மீளுருவும் இடவமைப்புச் சொல்லின் தெளிவின்மையும் மூலத்தின்படி காக்கப்பட்டுள்ளன.
