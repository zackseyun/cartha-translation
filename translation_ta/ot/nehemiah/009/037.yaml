  source_fidelity: முதலுரையிலுள்ள וּתְבוּאָתָהּ מַרְבָּה என்பது நிலத்தின் விளைச்சல் மிகுதியாக இருப்பதையும் அது அரசர்களுக்குச் செல்வதையும் கூறுகிறது. வரைவில் உள்ள ‘இருந்தாலும்’ என்ற சலுகைத் தொடர்புச்சொல் எபிரெய மூலத்தில் இல்லை; அது இல்லாத எதிர்மறை/முரண்பாட்டுத் தொடர்பைச் சேர்க்கிறது. மற்ற முக்கியக் கூறுகள்—பாவங்களின் காரணமாகக் கடவுள் அரசர்களை மேலாக வைத்தது, உடல்களும் கால்நடைகளும் அவர்களது விருப்பத்தின்படி ஆளப்படுவது, பெருந்துயரம்—மூலத்துடன் ஒத்துள்ளன.
  naturalness: திருத்தப்பட்ட உரை நவீன தரமான தமிழில் இயல்பாகவும் கண்ணியமாகவும் உள்ளது. ‘மிகுதியான விளைச்சல்’ என்பது தமிழில் நேரடியானது; ‘கடுந்துன்பத்தில்’ என்பது சமூகப் புலம்பலின் தீவிரத்தை ‘நெருக்கடி’யைவிடச் சற்றே தெளிவாக வெளிப்படுத்துகிறது.
