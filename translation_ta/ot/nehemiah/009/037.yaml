  text: וּ/תְבוּאָתָ֣/הּ מַרְבָּ֗ה לַ/מְּלָכִ֛ים אֲשֶׁר נָתַ֥תָּה עָלֵ֖י/נוּ בְּ/חַטֹּאותֵ֑י/נוּ וְ/עַ֣ל גְּ֠וִיֹּתֵי/נוּ מֹשְׁלִ֤ים וּ/בִ/בְהֶמְתֵּ֨/נוּ֙ כִּ/רְצוֹנָ֔/ם וּ/בְ/צָרָ֥ה גְדוֹלָ֖ה אֲנָֽחְנוּ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/037.yaml
  text: Its abundant produce goes to the kings whom you have set over us because of our sins[a]. They rule over our bodies and over our livestock as they please[b], and we are in great distress.
translation:
  language: ta
  text: அதன் மிகுதியான விளைச்சல், எங்கள் பாவங்களின் காரணமாக நீர் எங்கள்மேல் வைத்த அரசர்களுக்குச் செல்கிறது.[a] அவர்கள் தங்கள் விருப்பம்போல் எங்கள் உடல்களின்மேலும் எங்கள் கால்நடைகளின்மேலும் ஆட்சி செய்கிறார்கள்;[b] நாங்கள் கடுந்துன்பத்தில் இருக்கிறோம்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அதன் பலன்’ அல்லது ‘அதன் அறுவடை’ என்றும் மொழிபெயர்க்கலாம். ‘அதன்’ என்பது முந்தைய வசனத்தில் குறிப்பிடப்பட்ட நிலத்தைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: ‘எங்கள் நபர்களின்மேலும்’ என்றும் மொழிபெயர்க்கலாம்; எபிரெயச் சொல்லின் நேரடிப் பொருள் ‘எங்கள் உடல்கள்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וּתְבוּאָתָהּ מַרְבָּה
  choice: அதன் விளைச்சல் மிகுதியாக இருந்தாலும்
  rationale: תְּבוּאָה என்பது நிலத்தின் விளைச்சலைக் குறிக்கிறது; பெண்பால் ஒருமை பின்னொட்டு முந்தைய வசனத்திலுள்ள நாட்டைக் குறிக்கிறது. மַרְבָּה விளைச்சலின் மிகுதியைக் கூறுகிறது. அடுத்துள்ள எதிர்மறை நிலையை இயல்பான தமிழில் வெளிப்படுத்த ‘இருந்தாலும்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: לַמְּלָכִים
  choice: அரசர்களுக்குச் செல்கிறது
  rationale: לְ திசை அல்லது பயனைச் சுட்டுகிறது; நிலத்தின் விளைச்சல் அரசர்களுக்குப் போய்ச் சேருவதை இச்சொற்றொடர் இயல்பாகத் தெரிவிக்கிறது.
- source_word: אֲשֶׁר נָתַתָּה עָלֵינוּ
  choice: நீர் எங்கள்மேல் ஏற்படுத்திய
  rationale: נתן + על இங்கு ஒருவரை மற்றவர்கள்மேல் அதிகாரத்தில் வைப்பதைக் குறிக்கிறது; தெய்வீகச் செயற்பாட்டைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: בְּחַטֹּאותֵינוּ
  choice: எங்கள் பாவங்களின் காரணமாக
  rationale: בְּ இச்சூழலில் காரணத்தைக் குறிக்கிறது.
- source_word: גְּוִיֹּתֵינוּ
  choice: எங்கள் உடல்கள்மேலும்
  rationale: גְּוִיָּה இங்கு சடலங்களைக் குறிக்காமல், ஆட்சியாளர்களின் அதிகாரத்திற்குட்பட்ட மக்களின் உடல்களை அல்லது நபர்களைக் குறிக்கிறது.
- source_word: מֹשְׁלִים
  choice: ஆட்சி செய்கிறார்கள்
  rationale: பங்கேற்புவினை தொடரும் ஆட்சியைக் குறிக்கிறது; ‘ஆட்சி செய்கிறார்கள்’ நேரடியான, இயல்பான தமிழ்.
- source_word: וּבִבְהֶמְתֵּנוּ
  choice: எங்கள் கால்நடைகள்மேலும்
  rationale: בְּהֵמָה இங்கு வளர்ப்பு விலங்குகளை ஒட்டுமொத்தமாகக் குறிக்கிறது.
- source_word: כִּרְצוֹנָם
  choice: தங்கள் விருப்பப்படி
  rationale: ஆட்சியாளர்கள் தங்கள் சொந்த விருப்பத்தின்படி அதிகாரம் செலுத்துவதைச் சுருக்கமாகப் பாதுகாக்கிறது.
- source_word: וּבְצָרָה גְדוֹלָה אֲנָחְנוּ
  choice: நாங்கள் பெரும் நெருக்கடியில் இருக்கிறோம்
  rationale: צָרָה கடுமையான துன்பம் அல்லது நெருக்கடியைக் குறிக்கிறது; சமூகப் புலம்பலின் தீவிரத்தை இயல்பான தமிழில் தெரிவிக்கிறது.
theological_decisions:
- issue: அந்நிய அரசர்களின் ஆட்சியில் கடவுளின் செயற்பாடு
  choice: மக்களின் பாவங்களின் காரணமாகக் கடவுளே அந்த அரசர்களை அவர்கள்மேல் ஏற்படுத்தினார் என்று வசனம் கூறுகிறது.
  alternative: கடவுள் அவர்களுடைய ஆட்சியை வெறுமனே அனுமதித்தார்; அல்லது அரசர்களின் எல்லாச் செயல்களையும் அவர் அங்கீகரித்தார்.
  rationale: נָתַתָּה עָלֵינוּ மக்கள் அடிமைப்படுத்தப்பட்டதைப் பாவத்திற்கான கடவுளின் நியாயத்தீர்ப்புச் செயலுடன் நேரடியாக இணைக்கிறது. ஆனால் அரசர்களின் ஒடுக்குமுறையை அவர் ஒழுக்கரீதியாக அங்கீகரித்தார் என்று உரை கூறவில்லை.
translation_notes:
  register: நவீன தரமான தமிழ்; பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. தெய்வீகச் செயற்பாடும் ஒடுக்குமுறையின் தீவிரமும் பாதுகாக்கப்பட்டுள்ளன. எல்லா அடிக்குறிப்புக் குறியீடுகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
