base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/018.yaml
  text: Even when they made for themselves a cast metal calf and said[a], ‘This is your god who brought you up out of Egypt,’ and committed great blasphemies[b],
translation:
  language: ta
  text: அவர்கள் தங்களுக்காக வார்க்கப்பட்ட ஒரு உலோகக் கன்றுக்குட்டியைச் செய்து[a], “உன்னை எகிப்திலிருந்து வெளியே கொண்டுவந்த உன் தெய்வம் இதுதான்” என்று சொல்லி, பெரும் இகழ்ச்சிச் செயல்களைச் செய்தபோதிலும்[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உருக்கி வார்க்கப்பட்ட கன்றுக்குட்டி ஒன்று.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “பெரும் தேவதூஷணங்களை” அல்லது “பெரும் தூண்டுதல்களை.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אַף כִּי
  choice: செய்தபோதிலும்
  rationale: இந்தச் சொற்றொடர் கடவுளின் இரக்கத்துக்கு மாறாக இஸ்ரவேலர் செய்த கலகத்தை எடுத்துரைக்கும் விட்டுக்கொடுப்பு பொருளைக் கொண்டுள்ளது. தமிழில் வாக்கியத்தின் இறுதியில் ‘போதிலும்’ அமைப்பது இயல்பாகவும் மூலத்தின் தொடர்பைத் தெளிவாகவும் காட்டுகிறது.
- source_word: עָשׂוּ לָהֶם
  choice: அவர்கள் தங்களுக்காக ... செய்து
  rationale: לָהֶם என்பதிலுள்ள தங்களுக்கெனச் செய்தார்கள் என்ற பொருளை ‘தங்களுக்காக’ வெளிப்படையாகப் பாதுகாக்கிறது.
- source_word: עֵגֶל מַסֵּכָה
  choice: வார்க்கப்பட்ட உலோகக் கன்றுக்குட்டி
  rationale: מַסֵּכָה என்பது உருக்கிய உலோகத்தை வார்த்து உருவாக்கப்பட்ட சிலையைக் குறிக்கிறது. இந்த மொழிபெயர்ப்பு கன்றுக்குட்டியின் வடிவத்தையும் அதன் உலோகத் தயாரிப்பு முறையையும் தெளிவாகத் தருகிறது.
- source_word: זֶה אֱלֹהֶיךָ
  choice: உன் தெய்வம் இதுதான்
  rationale: זֶה என்ற ஒருமைச் சுட்டுப்பெயரும் ஒருமை உரிமைப் பின்னொட்டும் இங்கு ஒருமை மொழிபெயர்ப்பை ஆதரிக்கின்றன. பொய்வழிபாட்டுப் பொருளைக் குறிப்பதால் ‘தெய்வம்’ எனத் தரப்பட்டுள்ளது.
- source_word: אֲשֶׁר הֶעֶלְךָ מִמִּצְרָיִם
  choice: உன்னை எகிப்திலிருந்து வெளியே கொண்டுவந்த
  rationale: எகிப்திலிருந்து விடுதலையாகக் கொண்டுவரப்பட்டதைச் சுட்டும் யாத்திராகமச் சொல்லாட்சியை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: וַיַּעֲשׂוּ
  choice: செயல்களைச் செய்தபோதிலும்
  rationale: அடுத்து வரும் பன்மைப் பெயர்ச்சொல்லுடன் இயல்பான தமிழில் இணைத்து, செயல் புரிந்தார்கள் என்ற வினை வலிமையைப் பாதுகாக்கிறது.
- source_word: נֶאָצוֹת גְּדֹלוֹת
  choice: கடவுளை அவமதிக்கும் பெரும் செயல்கள்
  rationale: இந்த எபிரெயச் சொல் கடவுளுக்கு எதிரான இகழ்ச்சி, அவமதிப்பு அல்லது தூஷணச் செயல்களைக் குறிக்கலாம். பிரதான உரை அதன் கடவுளை நோக்கிய தன்மையையும் செயல்களின் பரந்த பொருளையும் பாதுகாக்கிறது.
theological_decisions:
- issue: பொய்வழிபாட்டுப் பொருளைக் குறிக்கும் אֱלֹהֶיךָ என்பதன் மொழிபெயர்ப்பு
  choice: உன் தெய்வம்
  alternative: உன் கடவுள்
  rationale: குறிப்பிடப்படுவது பொற்கன்றுக்குட்டி என்பதால், மக்கள் அதற்குச் செய்த உரிமைக் கோரிக்கையைப் பிரதிபலித்தபடியே அதற்கு உண்மைக் கடவுளின் அங்கீகாரம் இருப்பதாகத் தோன்றாமல் ‘தெய்வம்’ என மொழிபெயர்க்கப்பட்டுள்ளது.
- issue: נֶאָצוֹת என்பதன் கடவுளை நோக்கிய வலிமை
  choice: கடவுளை அவமதிக்கும் பெரும் செயல்கள்
  alternative: பெரும் தேவதூஷணங்கள்; கடவுளைக் கோபமூட்டும் பெரும் செயல்கள்
  rationale: மூலச்சொல் தூஷணம் மட்டுமல்லாமல் இகழ்ச்சியான அல்லது எதிர்ப்பை வெளிப்படுத்தும் செயல்களையும் குறிக்கக்கூடும். ஆகவே பிரதான உரை கடவுளை நோக்கிய குற்றத்தைக் காட்டி, அதன் பொருள் வரம்பைத் தேவையின்றிக் குறுக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. இது அடுத்த வசனத்துடன் தொடரும் விட்டுக்கொடுப்பு உட்பிரிவு என்பதால் இறுதியில் காற்புள்ளி வைக்கப்பட்டுள்ளது. ஒருமை இரண்டாம் நபரைக் காட்ட ‘உன்னை/உன்’ என்பவை பாதுகாக்கப்பட்டுள்ளன.
