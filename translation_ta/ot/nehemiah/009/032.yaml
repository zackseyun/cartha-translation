  text: וְ/עַתָּ֣ה אֱ֠לֹהֵי/נוּ הָ/אֵ֨ל הַ/גָּד֜וֹל הַ/גִּבּ֣וֹר וְ/הַ/נּוֹרָא֮ שׁוֹמֵ֣ר הַ/בְּרִ֣ית וְ/הַ/חֶסֶד֒ אַל יִמְעַ֣ט לְ/פָנֶ֡י/ךָ אֵ֣ת כָּל הַ/תְּלָאָ֣ה אֲֽשֶׁר מְ֠צָאַתְ/נוּ לִ/מְלָכֵ֨י/נוּ לְ/שָׂרֵ֧י/נוּ וּ/לְ/כֹהֲנֵ֛י/נוּ וְ/לִ/נְבִיאֵ֥/נוּ וְ/לַ/אֲבֹתֵ֖י/נוּ וּ/לְ/כָל עַמֶּ֑/ךָ מִ/ימֵי֙ מַלְכֵ֣י אַשּׁ֔וּר עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/032.yaml
  text: 'And now[a], our God—the great, mighty, and fearsome God, who keeps the covenant and steadfast love—do not let all the hardship that has come upon us seem small before you: upon our kings, our officials, our priests, our prophets, our fathers[b], and all your people, from the days of the kings of Assyria until this day.'
translation:
  language: ta
  text: இப்போது, எங்கள் இறைவனே—பெரியவரும் வல்லவரும் அஞ்சத்தக்கவருமான[a] இறைவனே, உடன்படிக்கையையும் மாறாத அன்பையும் காக்கிறவரே—அசீரிய அரசர்களின் நாட்கள்முதல் இந்நாள்வரை எங்கள்மேலும், எங்கள் அரசர்கள்மேலும், எங்கள் தலைவர்கள்மேலும், எங்கள் ஆசாரியர்கள்மேலும், எங்கள் இறைவாக்கினர்கள்மேலும், எங்கள் தந்தையர்மேலும்[b], உமது மக்கள் அனைவர்மேலும் வந்தடைந்த எல்லாத் துன்பங்களையும் உமது பார்வையில் அற்பமானதாகக் கருதாதீர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அஞ்சத்தக்கவருமான’ என்பதற்கு ‘பயபக்திக்குரியவருமான’ என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் அச்சமும் ஆழ்ந்த வணக்கமும் கலந்த உணர்வைத் தூண்டும் தன்மையைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: ‘எங்கள் தந்தையர்’ என்பதற்கு ‘எங்கள் முன்னோர்’ என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் ஆண்பால் வடிவில் இருந்து, மக்களின் முற்பிதாக்களைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאֵל
  choice: இறைவனே
  rationale: ‘எங்கள் இறைவனே’ என்பதற்கு விளக்கமாகவும் தொடர்ந்து வரும் இறைப் பண்புகளின் மையச் சொல்லாகவும் இருப்பதால், தமிழில் இயல்பான விளி வடிவில் தரப்பட்டுள்ளது.
- source_word: הַגָּדוֹל הַגִּבּוֹר וְהַנּוֹרָא
  choice: பெரியவரும் வல்லவரும் பயபக்திக்குரியவருமான
  rationale: மூன்று உடன்படிக்கைச் சிறப்புப் பெயர்களையும் தனித்தனியாகக் காக்கிறது. נוֹרָא என்பது வெறும் பயங்கரத்தைக் காட்டாமல், அச்சம் கலந்த வணக்கத்தைத் தூண்டும் தன்மையைச் சுட்டுவதால் ‘பயபக்திக்குரியவர்’ என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: שׁוֹמֵר
  choice: காக்கிறவரே
  rationale: எபிரெயப் பங்கேற்பு வடிவின் தொடர்ச்சியான செயற்பாட்டையும், இறைவனை நேரடியாக அழைக்கும் வாக்கிய அமைப்பையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: הַבְּרִית וְהַחֶסֶד
  choice: உடன்படிக்கையையும் மாறாத அன்பையும்
  rationale: בְּרִית என்பதற்கு ‘உடன்படிக்கை’ நேரான இணை. חֶסֶד இச்சூழலில் நிலைத்த, பற்றுறுதியான உடன்படிக்கை அன்பைக் குறிப்பதால் ‘மாறாத அன்பு’ எனத் தரப்பட்டுள்ளது.
- source_word: אַל יִמְעַט לְפָנֶיךָ
  choice: உமது பார்வையில் அற்பமானதாகக் கருதாதீர்
  rationale: துன்பத்தைச் சிறியதாக எண்ண வேண்டாம் என்ற எபிரெய மரபுத்தொடரின் பொருளையும் לְפָנֶיךָ என்பதிலுள்ள ‘உமக்கு முன்பாக/உமது பார்வையில்’ என்ற உறவுசார் கூறையும் தெளிவாகக் காக்கிறது.
- source_word: כָּל הַתְּלָאָה
  choice: இந்தத் துன்பம் அனைத்தையும்
  rationale: תְּלָאָה குறிக்கும் நெடுங்கால இடர், வருத்தம், கடின அனுபவம் ஆகியவற்றை ‘துன்பம்’ இயல்பாக உள்ளடக்குகிறது; כָּל என்பதன் முழுமை ‘அனைத்தையும்’ என்பதில் காக்கப்படுகிறது.
- source_word: אֲשֶׁר מְצָאַתְנוּ
  choice: வந்தடைந்த
  rationale: சொல்லுக்கு சொல் ‘எங்களைக் கண்டடைந்த’ என்றாலும், தீங்கு அல்லது துன்பம் ஒருவருக்கு நேரிடுவதைக் குறிக்கும் எபிரெய மரபுத்தொடரை நவீன தமிழில் ‘வந்தடைந்த’ என்பது இயல்பாக வெளிப்படுத்துகிறது.
- source_word: לִמְלָכֵינוּ לְשָׂרֵינוּ וּלְכֹהֲנֵינוּ וְלִנְבִיאֵינוּ וְלַאֲבֹתֵינוּ
  choice: எங்கள் அரசர்கள்மேலும், எங்கள் தலைவர்கள்மேலும், எங்கள் ஆசாரியர்கள்மேலும், எங்கள் இறைவாக்கினர்கள்மேலும், எங்கள் தந்தையர்மேலும்
  rationale: לְ முன்னொட்டு துன்பத்தால் பாதிக்கப்பட்ட ஒவ்வொரு குழுவையும் குறிக்கிறது; அதனை ‘மேலும்’ என மீண்டும் கூறுவது பட்டியலின் தெளிவைக் காக்கிறது. שָׂרִים என்பதற்கு சூழலுக்கேற்ற பொதுவான ‘தலைவர்கள்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: וּלְכָל עַמֶּךָ
  choice: உமது மக்கள் அனைவர்மேலும்
  rationale: தலைமைப் பிரிவுகளிலிருந்து உடன்படிக்கைச் சமூகத்தின் முழுமைக்கும் பட்டியல் விரிவதைத் தெளிவாகக் காட்டுகிறது.
- source_word: מִימֵי מַלְכֵי אַשּׁוּר עַד הַיּוֹם הַזֶּה
  choice: அசீரிய அரசர்களின் நாட்கள்முதல் இந்நாள்வரை
  rationale: துன்பத்தின் வரலாற்றுக் கால எல்லையை நேரடியாகவும் இயல்பாகவும் தருகிறது.
theological_decisions:
- issue: נוֹרָא என்ற இறைச் சிறப்புப் பெயரின் பொருள்
  choice: பயபக்திக்குரியவர்
  alternative: அஞ்சுதற்குரியவர்
  rationale: இச்சொல் இறைவன் ஏற்படுத்தும் ஆழ்ந்த அச்சத்தையும் வணக்கத்தையும் ஒருங்கே கொண்டது. ‘பயபக்திக்குரியவர்’ அந்தத் தெய்வீக கனத்தைத் தக்கவைத்தபடி, இறைவனை வெறும் பயங்கரமானவராக மட்டும் சித்தரிப்பதைத் தவிர்க்கிறது.
- issue: אֲבֹתֵינוּ என்பதன் குறிப்பு
  choice: எங்கள் தந்தையர்
  alternative: எங்கள் முன்னோர்
  rationale: எபிரெயச் சொல் ஆண்பால் வடிவில் இருந்து மக்களின் முற்பிதாக்களைக் குறிக்கிறது. மூலத்தின் வடிவை முதன்மை உரையில் காக்க ‘தந்தையர்’ பயன்படுத்தப்பட்டு, விரிவான பொருள் அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
- issue: חֶסֶד என்பதன் உடன்படிக்கைச் சார்பு
  choice: மாறாத அன்பு
  alternative: இரக்கம்
  rationale: இங்கு חֶסֶד என்பது பொதுவான இரக்கத்தைவிட, உடன்படிக்கைக்கு உண்மையுள்ள நிலையான அன்பைச் சுட்டுகிறது; எனவே அதன் உறுதியும் உறவுச் சார்பும் காக்கப்படுகின்றன.
translation_notes:
  register: நவீன பொதுத்தமிழில், ஜெபத்திற்குரிய கண்ணியமான விளி நடையுடன் மொழிபெயர்க்கப்பட்டுள்ளது. வரலாற்றுப் பட்டியலின் வலிமையைத் தக்கவைக்க ‘மேலும்’ மீளுருவாக்கம் பயன்படுத்தப்பட்டுள்ளது; அதேவேளை கடினமான சொல்லுக்குச் சொல் அமைப்புகள் இயல்பான தமிழாக மாற்றப்பட்டுள்ளன.
