base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/022.yaml
  text: You gave them kingdoms and peoples, and allotted them to every corner. So they took possession of the land of Sihon, that is, the land of the king of Heshbon, and the land of Og king of Bashan.
translation:
  language: ta
  text: நீர் அவர்களுக்கு அரசுகளையும் மக்களினங்களையும் கொடுத்து, அவற்றைப் பகுதிவாரியாகப் பங்கிட்டீர்.[a] அவர்கள் சீகோனின் நாட்டையும், எஸ்போனின் அரசனுடைய நாட்டையும்,[b] பாசானின் அரசனான ஓகின் நாட்டையும் கைப்பற்றினார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயச் சொற்றொடரை ‘அவற்றை ஒவ்வொரு பகுதிக்கும் பங்கிட்டீர்’ என்றும் புரிந்துகொள்ளலாம்.
    reason: לְפֵאָה என்ற சொற்றொடரின் பொருளும், வினையின் பன்மைச் சுட்டு எதைக் குறிக்கிறது என்பதும் ஓரளவு தெளிவற்றவை.
  - marker: b
    text: சீகோனே எஸ்போனின் அரசன்; எனவே இதை ‘எஸ்போனின் அரசனான சீகோனின் நாட்டை’ என்றும் புரிந்துகொள்ளலாம். ஆனால் எபிரெய உரை இவ்விரு கூறுகளையும் ‘... நாட்டையும்’ என்ற இணைப்புடன் தனித்தனியாகக் குறிப்பிடுகிறது.
    reason: மசோரெட்டிக் உரையின் இயல்பற்ற இணைப்பை மறைக்காமல், வரலாற்று அடையாளத்தையும் வாசகருக்குத் தெளிவுபடுத்துகிறது.
lexical_decisions:
- source_word: מַמְלָכוֹת וַעֲמָמִים
  choice: அரசுகளையும் மக்களினங்களையும்
  rationale: מַמְלָכוֹת என்பது ஆளப்படும் அரசுப்பகுதிகளையும், עֲמָמִים என்பது தனித்த மக்கள் குழுக்களையும் குறிக்கிறது; இரண்டின் வேறுபாடும் தமிழில் காக்கப்படுகிறது.
- source_word: וַתַּחְלְקֵם לְפֵאָה
  choice: அவற்றைப் பகுதிவாரியாகப் பங்கிட்டீர்
  rationale: வினையுடன் இணைந்துள்ள ‘அவற்றை’ என்ற பன்மைச் சுட்டு முன்பு கூறப்பட்ட அரசுகளையும் மக்களினங்களையும் இயல்பாகச் சுட்டுகிறது. פֵאָה என்பதன் அடிப்படைப் பொருள் ‘ஓரம்/பகுதி’; இங்கு நிலப்பகுதிகளாகப் பிரித்தளித்தல் என்ற சூழற்பொருளில் மொழிபெயர்க்கப்பட்டுள்ளது, ஆனால் சொற்றொடரின் நிச்சயமின்மை அடிக்குறிப்பில் காக்கப்படுகிறது.
- source_word: וַיִּירְשׁוּ
  choice: கைப்பற்றினார்கள்
  rationale: יָרַשׁ இங்கு நாட்டைத் தமதாக்கி உடைமையாக்கும் செயலைக் குறிக்கிறது; போர் மற்றும் நிலப்பிடிப்பு சூழலில் இயல்பான நவீனத் தமிழாக ‘கைப்பற்றினார்கள்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: אֶרֶץ
  choice: நாடு
  rationale: இங்கு அரசர்கள் ஆட்சி செய்த நிலப்பரப்பைக் குறிப்பதால் ‘நாடு’ என்பது ‘நிலம்’ என்பதைக் காட்டிலும் இயல்பாகவும் துல்லியமாகவும் உள்ளது.
theological_decisions:
- issue: சீகோனுக்கும் எஸ்போனின் அரசனுக்கும் இடையிலான தொடர்பு
  choice: மூல எபிரெய உரையில் உள்ள இரு தனித்த இணைப்புகளையும் காத்து, ‘சீகோனின் நாட்டையும், எஸ்போனின் அரசனுடைய நாட்டையும்’ என்று மொழிபெயர்த்தல்
  alternative: ‘சீகோனின் நாட்டை, அதாவது எஸ்போனின் அரசனுடைய நாட்டை’ அல்லது ‘எஸ்போனின் அரசனான சீகோனின் நாட்டை’ என்று விளக்கமாக ஒருங்கிணைத்தல்
  rationale: WLC உரை இரு கூறுகளுக்கும் וְאֶת (‘மேலும் ...ஐ’) பயன்படுத்துகிறது. சீகோனே எஸ்போனின் அரசன் என்று பிற வேதாகம இடங்கள் தெளிவுபடுத்தினாலும், இந்த வசனத்தின் உரைநடைச் சிக்கலை அமைதியாகத் திருத்தாமல், அதன் வடிவத்தை முதன்மை உரையிலும் மாற்று புரிதலை அடிக்குறிப்பிலும் காக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன பொதுத்தமிழில் மரியாதை ஒருமை ‘நீர்’ பயன்படுத்தப்பட்டுள்ளது. ‘மக்களினங்கள்’, ‘பகுதிவாரியாக’, ‘கைப்பற்றினார்கள்’ ஆகியவை சாதாரண வாசகருக்குப் புரியும் வகையில் இருந்தாலும் வரலாற்று-வேதாகம நடையின் கண்ணியத்தைப் பேணுகின்றன. மூல உரையின் தொடரமைப்பும் தெளிவின்மையும் தேவையான இடங்களில் அடிக்குறிப்புகளுடன் காக்கப்பட்டுள்ளன.
