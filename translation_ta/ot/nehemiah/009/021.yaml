translation_notes:
  register: நவீன பொதுத்தமிழில், மரியாதையான வேதாகம உரைநடையைப் பேணும் வகையில் இரண்டாம் நபர் மரியாதை வினைமுற்று பயன்படுத்தப்பட்டுள்ளது. மூல எபிரெய உரையில் இவ்வசனத்திற்குத் தேவையான குறிப்பிடத்தக்க உரைவேறுபாடோ பொருள் தெளிவின்மையோ இல்லாததால் அடிக்குறிப்புகள் சேர்க்கப்படவில்லை; வழங்கப்பட்ட ஆங்கில அடிக்குறிப்புகளின் குறியீடுகளும் உள்ளடக்கமும் ஒன்றோடொன்று இடம்மாறியிருப்பதாகத் தெரிகிறது.
