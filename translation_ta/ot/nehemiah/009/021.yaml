source:
  edition: WLC
  text: וְ/אַרְבָּעִ֥ים שָׁנָ֛ה כִּלְכַּלְתָּ֥/ם בַּ/מִּדְבָּ֖ר לֹ֣א חָסֵ֑רוּ שַׂלְמֹֽתֵי/הֶם֙ לֹ֣א בָל֔וּ וְ/רַגְלֵי/הֶ֖ם לֹ֥א בָצֵֽקוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/021.yaml
  text: For forty years you sustained them in the wilderness[a]; they lacked nothing. Their clothes did not wear out[b], and their feet did not swell.
translation:
  language: ta
  text: நாற்பது ஆண்டுகள் அவர்களைப் பாலைநிலத்தில் பராமரித்தீர்; அவர்களுக்கு ஒன்றும் குறைவுபடவில்லை. அவர்களுடைய ஆடைகள் நைந்துபோகவில்லை; அவர்களுடைய கால்கள் வீங்கவில்லை.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּלְכַּלְתָּם
  choice: அவர்களைப் பராமரித்தீர்
  rationale: כלכל என்ற வினை தொடர்ந்து தேவைகளை நிறைவேற்றி ஆதரிப்பதைக் குறிக்கிறது. உணவு அளித்தல் என்ற குறுகிய பொருளுக்கு மட்டுப்படுத்தாமல், பாலைநிலப் பயணம் முழுவதிலும் கடவுள் அவர்களைக் காத்துப் பேணியதை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: בַּמִּדְבָּר
  choice: பாலைநிலத்தில்
  rationale: מִדְבָּר என்பது குடியிருப்பில்லாத வறண்ட வனாந்தரப் பகுதியைக் குறிக்கிறது. ‘பாலைநிலம்’ நவீனத் தமிழில் தெளிவாகவும் இச்சூழலுக்கு ஏற்றதாகவும் உள்ளது.
- source_word: לֹא חָסֵרוּ
  choice: அவர்களுக்கு ஒன்றும் குறைவுபடவில்லை
  rationale: எதிலும் பற்றாக்குறை ஏற்படவில்லை என்ற முழுமையான மறுப்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: שַׂלְמֹתֵיהֶם
  choice: அவர்களுடைய ஆடைகள்
  rationale: שַׂלְמָה பொதுவாக உடை அல்லது ஆடையைக் குறிக்கும். ‘ஆடைகள்’ தெளிவான, வழக்கிலுள்ள பொதுச் சொல்லாகும்.
- source_word: לֹא בָלוּ
  choice: நைந்துபோகவில்லை
  rationale: בלה என்பது பயன்படுத்தப்பட்டதால் தேய்ந்து பழுதடைதலைக் குறிக்கிறது. ஆடைகளைக் குறித்த தமிழ்ச் சூழலில் ‘நைந்துபோதல்’ துல்லியமும் இயல்பும் உடையது.
- source_word: וְרַגְלֵיהֶם לֹא בָצֵקוּ
  choice: அவர்களுடைய கால்கள் வீங்கவில்லை
  rationale: בצק இங்கு வீங்குதல் அல்லது பருத்துப்போதலைக் குறிக்கிறது. ‘கால்கள் வீங்கவில்லை’ என்பது நேரடியான இயல்பான மொழிபெயர்ப்பு.
- source_word: וְאַרְבָּעִים שָׁנָה
  choice: நாற்பது ஆண்டுகள்
  rationale: முன்னைய உரையின் தொடர்ச்சியைக் காட்டும் ו தமிழில் தனியாக ‘மேலும்’ என்று மொழிபெயர்க்கப்படாமலேயே காலக் கூறால் இயல்பாகப் புலப்படுகிறது.
