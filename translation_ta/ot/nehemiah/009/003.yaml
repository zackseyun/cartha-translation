- from: அவர்கள் தங்கள் இடங்களில் நின்று[a], தங்கள் இறைவனாகிய யாவேயின் திருச்சட்ட நூலிலிருந்து பகலின் நான்கில் ஒரு பகுதி நேரம் வாசித்தார்கள்[b]. மற்றொரு நான்கில் ஒரு பகுதி நேரம் தங்கள் பாவங்களை அறிக்கையிட்டு, தங்கள் இறைவனாகிய யாவேக்கு முன்பாகப் பணிந்து வணங்கினார்கள்.
  to: அவர்கள் தங்கள் இடத்தில் நின்று[a], தங்கள் இறைவனாகிய யாவேயின் சட்ட நூலிலிருந்து பகலின் நான்கில் ஒரு பகுதி நேரம் வாசித்தார்கள்[b]. மற்றொரு நான்கில் ஒரு பகுதி நேரம் அறிக்கையிட்டு, தங்கள் இறைவனாகிய யாவேக்குப் பணிந்து வணங்கினார்கள்.
