base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/003.yaml
  text: And they stood in their place[a], and they read from the Book of the Law of Yahweh their God for a fourth of the day[b]; and for another fourth they were confessing and bowing down to Yahweh their God.
translation:
  language: ta
  text: அவர்கள் தங்கள் இடத்தில் நின்று[a], தங்கள் இறைவனாகிய யாவேயின் சட்ட நூலிலிருந்து பகலின் நான்கில் ஒரு பகுதி நேரம் வாசித்தார்கள்[b]. மற்றொரு நான்கில் ஒரு பகுதி நேரம் அறிக்கையிட்டு, தங்கள் இறைவனாகிய யாவேக்குப் பணிந்து வணங்கினார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: வேறு விதமாக, “தங்கள் நிற்குமிடத்தில்” அல்லது ஒருவேளை “தங்கள் மேடையின்மேல்.” எபிரெயத் தொடர் சுருக்கமானது.
    reason: lexical_alternative
  - marker: b
    text: சொல்லுக்குச் சொல், “பகலின் நான்கில் ஒரு பகுதி ... மற்றொரு நான்கில் ஒரு பகுதி.” அதாவது, பகலின் ஒரு கால்பகுதி வாசிப்பிலும், இன்னொரு கால்பகுதி அறிக்கையிடுதலிலும் பணிந்து வணங்குதலிலும் கழிந்தது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּק֨וּמוּ עַל עָמְדָם
  choice: அவர்கள் தங்கள் இடங்களில் நின்று
  rationale: קום என்பதன் உடல்சார்ந்த ‘நிற்றல்’ பொருளையும், சுருக்கமான עַל עָמְדָם தொடரை இயல்பான தமிழில் ‘தங்கள் இடங்களில்’ என்றும் தருகிறது; மேடை என்ற கட்டடப் பொருளை உறுதிப்படுத்தவில்லை.
- source_word: וַיִּקְרְאוּ בְּסֵפֶר תּוֹרַת
  choice: திருச்சட்ட நூலிலிருந்து ... வாசித்தார்கள்
  rationale: எழுதப்பட்ட நூலுடன் வரும் קרא இங்கு வாசித்தலைக் குறிக்கிறது. תּוֹרָה என்பதற்கு இச்சூழலில் ‘திருச்சட்டம்’ என்பது தெளிவான, மரியாதையான தமிழ்.
- source_word: יְהוָה
  choice: யாவே
  rationale: திருநான்கெழுத்தான இறைபெயரை ஒரு பட்டப்பெயரால் மாற்றாமல், தமிழில் பரவலாக அறியப்படும் ஒலிபெயர்ப்பில் தருகிறது.
- source_word: אֱלֹהֵיהֶם
  choice: தங்கள் இறைவன்
  rationale: மூன்றாம் நபர் எழுவாயைத் திரும்பச் சுட்டும் இயல்பான தமிழ் உடைமை வடிவம்; ‘God’ என்பதற்கான மரியாதையான நவீனத் தமிழ்.
- source_word: רְבִעִית הַיּוֹם וּרְבִעִית
  choice: பகலின் நான்கில் ஒரு பகுதி நேரம் ... மற்றொரு நான்கில் ஒரு பகுதி நேரம்
  rationale: இரு தொடர்ச்சியான காலப்பகுதிகளையும் வெளிப்படையாக்கி, எபிரெய உரையின் ‘நான்கில் ஒரு பகுதி’ அமைப்பைத் தக்கவைக்கிறது.
- source_word: מִתְוַדִּים
  choice: தங்கள் பாவங்களை அறிக்கையிட்டு
  rationale: Hitpael வடிவம் ஒப்புக்கொண்டு அறிக்கையிடும் தொடர்ச்சியான செயலைக் குறிக்கிறது; இச்சூழலில் அறிக்கையிடப்பட்டது பாவங்கள் என்பது தெளிவாக உள்ளடங்குகிறது.
- source_word: וּמִשְׁתַּחֲוִים
  choice: பணிந்து வணங்கினார்கள்
  rationale: உடலைத் தாழ்த்தும் செயலும் வழிபாட்டுச் சூழலும் இரண்டையும் இயல்பான தமிழில் தக்கவைக்கிறது; வெறும் கருத்தாக்கமான ‘வழிபட்டார்கள்’ என்பதைக் காட்டிலும் உடல் செயலைப் பாதுகாக்கிறது.
- source_word: לַיהוָה אֱלֹהֵיהֶם
  choice: தங்கள் இறைவனாகிய யாவேக்கு முன்பாக
  rationale: லாமேத் குறிக்கும் நோக்கு/பெறுநர் உறவை மரியாதையான தமிழில் தருகிறது; பணிதலின் காட்சிக்கு ‘முன்பாக’ இயல்பாக அமைகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைபெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: ஆண்டவர்; யெகோவா
  rationale: மூலத்தில் தனிப்பட்ட உடன்படிக்கைப் பெயர் நேரடியாக உள்ளது. பட்டப்பெயரைப் பதிலிடாமல் ஒலிபெயர்ப்பது மூல வேறுபாட்டைக் காக்கிறது.
- issue: מִשְׁתַּחֲוִים என்பதை உடல் செயல் அல்லது பொதுவான வழிபாடு எனத் தருதல்
  choice: பணிந்து வணங்கினார்கள்
  alternative: வழிபட்டார்கள்; சாஷ்டாங்கமாக விழுந்தார்கள்
  rationale: வினையின் உடல்சார்ந்த பணிதலையும் அதன் வழிபாட்டு நோக்கையும் காக்கிறது; முழுமையாகத் தரையில் விழுந்தனர் என்று தேவையின்றி மிகைப்படுத்தவில்லை.
- issue: מִתְוַדִּים என்பதன் மறைமுகப் பொருளை வெளிப்படுத்துதல்
  choice: தங்கள் பாவங்களை அறிக்கையிட்டு
  alternative: அறிக்கையிட்டு; ஒப்புக்கொண்டு
  rationale: நெகேமியா 9-ன் மனந்திரும்புதல் சூழலில் அறிக்கையிடப்படுவது பாவங்களே; தமிழ் வாசகருக்கு தேவையான கருமத்தை வெளிப்படுத்தினாலும் புதிய கோட்பாட்டுச் சிறப்பைச் சேர்ப்பதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகருக்குப் புரியும் மரியாதையான வேதாகம நடையைக் கடைப்பிடிக்கிறது. ‘திருச்சட்ட நூல்’, ‘பாவங்களை அறிக்கையிட்டு’, ‘பணிந்து வணங்கினார்கள்’ ஆகியவை மூலத்தின் சட்ட, மனந்திரும்புதல், உடல்சார்ந்த வழிபாடு ஆகிய நுணுக்கங்களை இயல்பாகக் காக்கின்றன.
