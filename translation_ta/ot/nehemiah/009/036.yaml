  source_fidelity: மூல எபிரெயத்தின் வலியுறுத்தும் הִנֵּה என்ற இரட்டிப்பு, הַיּוֹם என்பதன் நிகழ்கால முரண்பாடு, עֲבָדִים என்பதன் அரசியல் கீழ்ப்படிதல்/சுதந்திரமின்மை, மற்றும் கடவுள் கொடுத்த அதே நாட்டிலேயே அவர்கள் அடிமைகளாக இருப்பதன் வேதனையான முரண்பாடு ஆகியவை துல்லியமாகப் பாதுகாக்கப்பட்டுள்ளன. ‘நாட்டிலேயே’ என்பது עָלֶיהָ-வின் சொற்சொல் ‘அதன்மேல்’ என்பதைக் காட்டிலும் இயல்பான தமிழ் இடப்பொருளில் தருகிறது; குறிப்பு அதன் நேரடியான வடிவத்தையும் விளக்குகிறது.
  naturalness: உரை நவீன நிலையான தமிழில் இயல்பாகவும் கண்ணியமான வேதாகமப் புலம்பல் நடையுடனும் உள்ளது. ‘இதோ’ என்ற மீளுரைப்பும், கடவுளை நோக்கிய ‘நீர்’ என்ற மரியாதை வடிவும் நன்றாகச் செயல்படுகின்றன. நீளமான நடுப்பகுதி கோடிட்ட இடைநிறுத்தத்தால் தெளிவாக உள்ளது.
  terminology: ‘அடிமைகள்’ இச்சூழலின் அந்நிய அரசாட்சிக்குக் கீழ்ப்பட்ட நிலையைக் பொருத்தமாகத் தெரிவிக்கிறது. ‘தந்தையர்’ மூலத்தின் வெளிப்படையான ஆண்பால் குடும்பக் குறிப்பைத் தக்கவைக்கிறது. ‘கனி’ மற்றும் ‘நல்வளம்’ நிலத்தின் விளைவும் பரந்த நன்மையும் என்ற பொருளுக்கு ஏற்றவை. மூன்று அடிக்குறிப்புகளும் உரிய அடையாளங்களில் இணைக்கப்பட்டுள்ளன; அவை பொருளை மாற்றாமல் மாற்றுச்சொல் மற்றும் சொற்சொல் நுணுக்கத்தை விளக்குகின்றன.
