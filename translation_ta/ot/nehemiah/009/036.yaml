  text: הִנֵּ֛ה אֲנַ֥חְנוּ הַ/יּ֖וֹם עֲבָדִ֑ים וְ/הָ/אָ֜רֶץ אֲשֶׁר נָתַ֣תָּה לַ/אֲבֹתֵ֗י/נוּ לֶ/אֱכֹ֤ל אֶת פִּרְיָ/הּ֙ וְ/אֶת טוּבָ֔/הּ הִנֵּ֛ה אֲנַ֥חְנוּ עֲבָדִ֖ים עָלֶֽי/הָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/036.yaml
  text: Look[a], today we are servants; and in the land that you gave to our fathers to eat its fruit and its good things, look[c][b], we are servants on it.
translation:
  language: ta
  text: இதோ, இன்று நாங்கள் அடிமைகளாக[a] இருக்கிறோம். எங்கள் தந்தையருக்கு அதன் கனியையும் அதன் நல்வளத்தையும்[b] உண்ணும்படி நீர் கொடுத்த நாட்டிலேயே—இதோ, நாங்கள் அடிமைகளாக இருக்கிறோம்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பணியாளர்களாக.” எபிரெயச் சொல் கீழ்ப்பட்ட நிலையில் இருப்பவர்களைக் குறிக்கலாம்; இங்கு அந்நியப் பேரரசின் கீழான அடிமை நிலை வலியுறுத்தப்படலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அதன் நன்மையையும்.” இச்சொல் நாட்டின் செழுமையையும் அது வழங்கும் நல்லவற்றையும் பரந்த முறையில் குறிக்கிறது.
    reason: lexical_alternative
  - marker: c
    text: எபிரெயில் சொல்லுக்குச் சொல், “அதன்மேல் அடிமைகளாக இருக்கிறோம்”; அதாவது, கடவுள் அவர்களுடைய தந்தையருக்குக் கொடுத்த அதே நாட்டிலேயே அவர்கள் அடிமைகளாக உள்ளனர்.
    reason: cultural_note
lexical_decisions:
- source_word: הִנֵּה
  choice: இதோ
  rationale: கவனத்தை ஈர்த்து புலம்பலுக்கு அழுத்தம் தரும் எபிரெயச் சொல்லின் சுட்டும் வலிமையை இயல்பான நவீனத் தமிழில் காக்கிறது; இரு இடங்களிலும் மீளுரைப்பும் பாதுகாக்கப்பட்டுள்ளது.
- source_word: הַיּוֹם
  choice: இன்று
  rationale: கடந்த காலத்தில் கடவுள் நாட்டைக் கொடுத்ததற்கும் அவர்களுடைய தற்போதைய அடிமை நிலைக்கும் உள்ள முரண்பாட்டை நேரடியாகக் காட்டுகிறது.
- source_word: עֲבָדִים
  choice: அடிமைகள்
  rationale: இச்சூழலில் சாதாரணப் பணிவிடையைவிட அந்நிய ஆட்சிக்குக் கீழான சுதந்திரமற்ற நிலையையே புலம்பல் வலியுறுத்துவதால் ‘அடிமைகள்’ பொருத்தமானது.
- source_word: אֲשֶׁר נָתַתָּה לַאֲבֹתֵינוּ
  choice: எங்கள் தந்தையருக்கு ... நீர் கொடுத்த
  rationale: கடவுளை நேரடியாக விளிக்கும் வடிவத்தையும் எபிரெயில் உள்ள ஆண்பால் குடும்பச் சொல்லையும் பாதுகாக்கிறது.
- source_word: פִּרְיָהּ
  choice: அதன் கனி
  rationale: நிலத்தின் விளைவைச் சுட்டும் வேளாண் உருவகத்தை நேரடியாகக் காக்கிறது.
- source_word: טוּבָהּ
  choice: அதன் நல்வளம்
  rationale: நிலத்தின் நன்மை மற்றும் செழுமை ஆகிய பரந்த பொருளை இயல்பான தமிழில் தெரிவிக்கிறது; அதை விளைச்சலுக்கு மட்டும் குறுக்கவில்லை.
- source_word: עָלֶיהָ
  choice: நாட்டிலேயே
  rationale: எபிரெயின் ‘அதன்மேல்’ என்ற இடப்பொருளை இயல்பான தமிழில் தருவதோடு, கடவுள் கொடுத்த அதே நாட்டில் அவர்கள் அடிமைகளாக இருப்பதன் வேதனைமிகு முரண்பாட்டை ‘-லேயே’ வலியுறுத்துகிறது.
theological_decisions:
- issue: உடன்படிக்கைப் புலம்பல் சூழலில் עֲבָדִים என்பதன் மொழிபெயர்ப்பு
  choice: அடிமைகள்
  alternative: வேலைக்காரர்கள் / பணியாளர்கள்
  rationale: வசனம் வாக்குத்தத்த நாட்டிலேயே மக்கள் அந்நிய அரசாட்சிக்குக் கீழ்ப்பட்டிருப்பதைப் புலம்புகிறது. ஆகவே சுதந்திர இழப்பையும் கட்டுப்பட்ட நிலையையும் ‘அடிமைகள்’ தெளிவாகத் தெரிவிக்கிறது.
- issue: לַאֲבֹתֵינוּ என்ற ஆண்பால் மரபுவழிக் குறிப்பு
  choice: எங்கள் தந்தையருக்கு
  alternative: எங்கள் மூதாதையருக்கு
  rationale: ‘மூதாதையர்’ இயல்பான மாற்றாக இருந்தாலும், மூலமொழியின் வெளிப்படையான ‘தந்தையர்’ என்ற குடும்பக் குறிப்பை இங்கு பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பும் கண்ணியமும் காக்கப்பட்டுள்ளன. ‘இதோ’ என்ற இரட்டிப்பு, புலம்பலின் அழுத்தம், கடவுளை நோக்கிய மரியாதைப் பன்மை ‘நீர்’, மற்றும் கொடுக்கப்பட்ட அதே நாட்டில் அடிமையாக இருப்பதன் முரண்பாடு ஆகியவை பாதுகாக்கப்பட்டுள்ளன.
