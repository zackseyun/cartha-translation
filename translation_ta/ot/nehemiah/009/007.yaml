base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/007.yaml
  text: You are Yahweh God[a], who chose Abram, brought him out from Ur of the Chaldeans, and gave him the name Abraham.
translation:
  language: ta
  text: நீரே யாவே தேவன்; நீர் ஆபிராமைத் தேர்ந்தெடுத்து, கல்தேயரின் ஊரிலிருந்து அவரை வெளியே கொண்டுவந்து, அவருக்கு ஆபிரகாம் என்று பெயரிட்டீர்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் இங்கு YHWH என்ற இறைப்பெயர் உள்ளது.
    reason: மூலத்தில் பட்டப்பெயருக்குப் பதிலாக இறைவனின் தனிப்பட்ட பெயர் இருப்பதை வாசகருக்குத் தெரிவிக்கிறது.
lexical_decisions:
- source_word: אַתָּה הוּא
  choice: நீரே
  rationale: இரட்டைச் சுட்டுப்பெயரால் வரும் எபிரெய வலியுறுத்தலை இயல்பான மரியாதைத் தமிழில் ‘நீரே’ தெளிவாக வெளிப்படுத்துகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இது ஒரு பட்டப்பெயர் அல்ல, YHWH என்ற இறைப்பெயர்; அதைப் பெயராகவே தமிழில் ஒலிபெயர்த்துள்ளது.
- source_word: הָאֱלֹהִים
  choice: தேவன்
  rationale: முன்னுள்ள இறைப்பெயரை அடையாளப்படுத்தும் இணைப்புச் சொல்லாக இருப்பதால், ‘தேவனாகிய யாவே’ என இயல்பாக அமைக்கப்பட்டுள்ளது.
- source_word: בָּחַרְתָּ בְאַבְרָם
  choice: ஆபிராமைத் தேர்ந்தெடுத்து
  rationale: בחר என்பதன் நேரான பொருளான ‘தேர்ந்தெடு’ பயன்படுத்தப்பட்டுள்ளது; בְ இங்கு வினையின் நேரடிச் செயப்படுபொருளைக் குறிக்கும் எபிரெய வழக்கு.
- source_word: וְהוֹצֵאתוֹ
  choice: அவரை வெளியே கொண்டுவந்து
  rationale: יצא என்பதன் ஹிஃபில் வடிவிலுள்ள ‘வெளியே கொண்டுவருதல்’ என்ற காரணவினைப் பொருளைப் பாதுகாக்கிறது.
- source_word: מֵאוּר כַּשְׂדִּים
  choice: கல்தேயரின் ஊர் நகரத்திலிருந்து
  rationale: אוּר என்பதை இடப்பெயரான ‘ஊர்’ என்றும் כַּשְׂדִּים என்பதை ‘கல்தேயர்’ என்றும் காட்டி, ‘நகரம்’ என்பதன் மூலம் ‘ஊர்’ இங்கு பொதுப்பெயர் அல்ல என்பதைத் தெளிவாக்குகிறது.
- source_word: וְשַׂמְתָּ שְּׁמוֹ אַבְרָהָם
  choice: அவருக்கு ஆபிரகாம் என்று பெயரிட்டீர்
  rationale: சொல்லுக்குச் சொல் ‘அவருடைய பெயரை ஆபிரகாம் என்று வைத்தீர்’ என்பதன் இயல்பான நவீனத் தமிழ் வடிவம்; ஆபிராம்–ஆபிரகாம் பெயர் மாற்றத்தையும் பாதுகாக்கிறது.
theological_decisions:
- issue: YHWH என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூல எபிரெய உரை பட்டப்பெயரான אֲדֹנָי என்பதை அல்ல, தனிப்பட்ட இறைப்பெயரான יהוה என்பதைப் பயன்படுத்துகிறது. ஆகவே ஒரு பட்டத்தால் மாற்றாமல் பெயராக ஒலிபெயர்க்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன, மரியாதைமிக்க பொதுத் தமிழ் பயன்படுத்தப்பட்டுள்ளது. இறைவனைக் குறிக்க ‘நீர்/நீரே’ என்ற உயர்திணை ஒருமை வடிவமும், மனிதரான ஆபிராமைக் குறிக்க ‘அவர்’ என்பதும் பயன்படுத்தப்பட்டுள்ளன. எபிரெய வாக்கியத்தின் வலியுறுத்தல் காக்கப்பட்டாலும், தமிழில் இயல்பாக வாசிக்க இரண்டு வாக்கியங்களாக அமைக்கப்பட்டுள்ளது.
