  terminology: ‘யாவே’ consistently transliterates the divine name rather than replacing it with a title. ‘ஆசீர்வதித்திருக்கிறார்,’ ‘வாக்களித்தபடியே,’ ‘கடன் கொடுப்பாய்,’ and ‘ஆள்வாய்’ are accurate, natural choices. The footnote properly preserves the more literal alternative for דִּבֶּר.
