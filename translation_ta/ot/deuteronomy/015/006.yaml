source:
  edition: WLC
  text: כִּֽי יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ בֵּֽרַכְ/ךָ֔ כַּ/אֲשֶׁ֖ר דִּבֶּר לָ֑/ךְ וְ/הַֽעֲבַטְתָּ֞ גּוֹיִ֣ם רַבִּ֗ים וְ/אַתָּה֙ לֹ֣א תַעֲבֹ֔ט וּ/מָֽשַׁלְתָּ֙ בְּ/גוֹיִ֣ם רַבִּ֔ים וּ/בְ/ךָ֖ לֹ֥א יִמְשֹֽׁלוּ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/015/006.yaml
  text: For Yahweh your God has blessed you just as he promised you[a], and you will lend to many nations, but you will not borrow; and you will rule over many nations, but they will not rule over you.
translation:
  language: ta
  text: ஏனெனில், உன் கடவுளாகிய யாவே தாம் உனக்கு வாக்களித்தபடியே[a] உன்னை ஆசீர்வதித்திருக்கிறார். நீ பல நாடுகளுக்குக் கடன் கொடுப்பாய்; ஆனால் நீ கடன் வாங்கமாட்டாய். நீ பல நாடுகளை ஆள்வாய்; ஆனால் அவை உன்னை ஆளமாட்டா.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தாம் உன்னிடம் கூறியபடியே.” எபிரேய மொழியில் நேரடியாக “கூறினார்” என்று உள்ளது; இவ்வுடன்படிக்கைச் சூழலில் அது வாக்குறுதி அளித்ததைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைபெயரான நான்கு எழுத்துப் பெயரை ஒரு பட்டமாக மாற்றாமல், தமிழில் இயல்பான ஒலிபெயர்ப்பாகத் தருகிறது.
- source_word: בֵּרַכְךָ
  choice: உன்னை ஆசீர்வதித்திருக்கிறார்
  rationale: எபிரேய நிறைவுற்ற வினை வடிவத்தையும், அதன் தற்போதைய விளைவையும் தமிழ் நிறைவு வினை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: כַּאֲשֶׁר דִּבֶּר לָךְ
  choice: தாம் உனக்கு வாக்களித்தபடியே
  rationale: דִּבֶּר என்பதன் நேரடிப் பொருள் ‘பேசினார்’ என்றாலும், உடன்படிக்கைச் சூழலில் முன்பு அளித்த வாக்குறுதியைக் குறிக்கிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: וְהַעֲבַטְתָּ
  choice: நீ ... கடன் கொடுப்பாய்
  rationale: עבט என்பதன் ஹிஃபில் வடிவம் பிறருக்குக் கடன் வழங்குவதைக் குறிக்கிறது; இது அடுத்துள்ள ‘கடன் வாங்குதல்’ என்பதுடன் உள்ள எதிர்மறை இணைப்பைத் தெளிவாக வைத்திருக்கிறது.
- source_word: גּוֹיִם רַבִּים
  choice: பல நாடுகள்
  rationale: இங்குள்ள பொருளாதார மற்றும் அரசியல் சூழலில் גּוֹיִם என்பது நாடுகளைக் குறிக்கிறது.
- source_word: לֹא תַעֲבֹט
  choice: நீ கடன் வாங்கமாட்டாய்
  rationale: עבט என்பதன் கால் வடிவம் முந்தைய ஹிஃபில் வடிவத்திற்கு எதிராகக் கடன் வாங்குதலைக் குறிக்கிறது.
- source_word: וּמָשַׁלְתָּ
  choice: நீ ... ஆள்வாய்
  rationale: מָשַׁל என்பதன் ஆட்சி அல்லது அதிகாரம் செலுத்துதல் என்ற நேரடிப் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: וּבְךָ לֹא יִמְשֹׁלוּ
  choice: அவை உன்னை ஆளமாட்டா
  rationale: பன்மை வினையின் எழுவாய் முன் கூறப்பட்ட ‘பல நாடுகள்’; ‘அவை’ என வெளிப்படுத்துவது தொடர்பைத் தெளிவாக்குகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைபெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: யெகோவா; கர்த்தர்
  rationale: மூலத்தில் தனிப்பட்ட உடன்படிக்கைப் பெயர் நேரடியாக உள்ளது. அதை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் ஒலிபெயர்த்து வழங்குவது மூலத்தின் தன்மையைப் பாதுகாக்கிறது.
- issue: דִּבֶּר לָךְ என்பதன் உடன்படிக்கைச் சார்ந்த பொருள்
  choice: உனக்கு வாக்களித்தபடியே
  alternative: உன்னிடம் கூறியபடியே
  rationale: ‘பேசினார்’ என்பது நேரடிப் பொருள்; ஆனால் இச்சூழலில் அந்தப் பேச்சு இறைவன் முன்பு அளித்த வாக்குறுதியைக் குறிக்கிறது. முக்கிய உரையில் சூழற்பொருளும், அடிக்குறிப்பில் நேரடிப் பொருளும் தரப்படுகின்றன.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிமையும் கண்ணியமும் கொண்ட நடை பயன்படுத்தப்பட்டுள்ளது. எபிரேய உரை இஸ்ரவேலை ஒருமையில் முன்னிலைப்படுத்துவதால், ‘நீ/உன்’ என்ற ஒருமை வடிவம் தொடர்ச்சியாகப் பாதுகாக்கப்பட்டுள்ளது; கடன் கொடுத்தல்/வாங்குதல் மற்றும் ஆளுதல்/ஆளப்படுதல் ஆகிய இணை எதிர்மறைகளும் தெளிவாக வைக்கப்பட்டுள்ளன.
