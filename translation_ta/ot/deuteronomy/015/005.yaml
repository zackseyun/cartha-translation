  text: if only you carefully listen to the voice of the LORD your God, being careful to do all this commandment that I am commanding you today.
translation:
  language: ta
  text: உங்கள் கடவுளாகிய ஆண்டவரின் குரலுக்குக் கவனமாகச் செவிகொடுத்து, இன்று நான் உங்களுக்குக் கட்டளையிடும் இந்தக் கட்டளை முழுவதையும் கடைப்பிடிக்கக் கவனமாயிருந்தால் மட்டுமே.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רַק אִם
  choice: மட்டுமே இது நிகழும்
  rationale: முந்தைய வசனத்தின் வாக்குறுதியோடு இவ்வசனம் நிபந்தனையாக இணைவதை இயல்பான தமிழில் வெளிப்படுத்துகிறது; எபிரேயத்தின் வலியுறுத்தலையும் காக்கிறது.
- source_word: שָׁמוֹעַ תִּשְׁמַע
  choice: கவனமாகச் செவிகொடுத்து
  rationale: எபிரேய வினைமுற்றின் வலியுறுத்தும் அமைப்பை சொற்சொல்லாக இரட்டிக்காமல் இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: בְּקוֹל יְהוָה אֱלֹהֶיךָ
  choice: உங்கள் கடவுளாகிய ஆண்டவரின் குரலுக்கு
  rationale: குரலைக் கேட்பது கீழ்ப்படிதலையும் உள்ளடக்கும் மூல உருவகத்தைப் பாதுகாக்கிறது; יהוה என்பதற்கு தமிழில் வழக்கமான மரியாதைமிக்க 'ஆண்டவர்' பயன்படுத்தப்படுகிறது.
- source_word: לִשְׁמֹר לַעֲשׂוֹת
  choice: கவனமாகக் கடைப்பிடித்தால்
  rationale: '''காத்து செய்ய'' என்ற இரு வினைகளின் சேர்க்கை, கட்டளையை விழிப்புடன் நடைமுறைப்படுத்துதல் என்னும் பொருளில் இயல்பாக வழங்கப்படுகிறது.'
- source_word: כָּל הַמִּצְוָה הַזֹּאת
  choice: இந்தக் கட்டளை முழுவதையும்
  rationale: כָּל என்பது இங்கு ஒருமை 'கட்டளை'யின் முழுமையைச் சுட்டுகிறது; அதை பன்மை ஆக்காமல் பாதுகாக்கிறது.
theological_decisions:
- issue: வாக்குறுதியின் நிபந்தனைத்தன்மை
  choice: ‘மட்டுமே’ என்ற வலியுறுத்தலுடன் கீழ்ப்படிதலை நிபந்தனையாக வைத்தல்
  alternative: நிபந்தனையை மெலிதாக்கி பொதுவான அறிவுரையாக மொழிபெயர்த்தல்
  rationale: רַק אִם தெளிவான, வலியுறுத்தப்பட்ட நிபந்தனையை அமைக்கிறது; அதன் இறையியல் பதற்றத்தை மெலிதாக்கக் கூடாது.
- issue: ‘குரலைக் கேட்பது’ மற்றும் ‘கீழ்ப்படிதல்’
  choice: மூலத்தின் ‘குரலுக்குச் செவிகொடுத்தல்’ உருவகத்தைப் பாதுகாத்தல்
  alternative: நேரடியாக ‘கீழ்ப்படிந்தால்’ என்று மட்டும் மொழிபெயர்த்தல்
  rationale: ‘கேட்பது’ கீழ்ப்படிதலை உணர்த்தினாலும், மூலத்தின் செவிசாய்தல் உருவகமும் தனித்த நுணுக்கமும் பாதுகாக்கப்பட வேண்டும்.
translation_notes:
  register: நவீன நிலையான தமிழ்; மரியாதைமிக்க, பொதுவாசகர்களுக்குப் புரியும் நடை. சூழலில் மோசே இஸ்ரவேலரிடம் உரையாற்றுவதால் பன்மை மரியாதையல்லாத ‘உங்கள்/உங்களுக்கு’ வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன. வசனம் முந்தைய வாக்கியத்தைச் சார்ந்த நிபந்தனைத் துணைவாக்கியமாதலால், தமிழில் முழுமையான வாசிப்புக்காக ‘இது நிகழும்’ சேர்க்கப்பட்டுள்ளது.
