source:
  edition: WLC
  text: וְ/כִֽי יִהְיֶ֨ה ב֜/וֹ מ֗וּם פִּסֵּ֨חַ֙ א֣וֹ עִוֵּ֔ר כֹּ֖ל מ֣וּם רָ֑ע לֹ֣א תִזְבָּחֶ֔/נּוּ לַ/יהוָ֖ה אֱלֹהֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/015/021.yaml
  text: But if it has a defect—being lame or blind[a], any bad defect—you shall not sacrifice it to Yahweh your God.
translation:
  language: ta
  text: ஆனால் அதற்கு ஓர் ஊனம் இருந்தால்—அது நொண்டியாகவோ குருடாகவோ இருந்தால், அல்லது வேறு ஏதேனும் மோசமான ஊனம்[a] இருந்தால்—அதை உன் கடவுளாகிய யாவேக்குப் பலியிடக் கூடாது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மொழியில், “தீய/மோசமான ஊனம்”; இங்கு பலிக்குத் தகுதியற்ற கடுமையான உடற்குறை என்று பொருள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  choice: ஆனால் ... இருந்தால்
  rationale: முந்தைய கட்டளையுடன் உள்ள மாறுபாட்டையும் நிபந்தனைப் பொருளையும் இயல்பான தமிழில் ஒருங்கே தருகிறது.
- source_word: יִהְיֶה בּוֹ מוּם
  choice: அதற்கு ஓர் ஊனம் இருந்தால்
  rationale: எபிரெய மொழியின் ‘அதில் ஓர் ஊனம் இருந்தால்’ என்ற பொருளை, பலிக்குத் தகுதியிழக்கச் செய்யும் உடற்குறை என்ற சூழலுக்கேற்ற இயல்பான தமிழில் தருகிறது.
- source_word: פִּסֵּחַ
  choice: நொண்டியாக
  rationale: நடக்கும் திறனில் குறைபாடுள்ள விலங்கைக் குறிக்கும் நேரடியான, பொதுவாகப் புரியும் சொல்.
- source_word: עִוֵּר
  choice: குருடாக
  rationale: பார்வையற்ற உடல்நிலையைக் குறிக்கும் நேரடியான இணைச்சொல்.
- source_word: כֹּל מוּם רָע
  choice: வேறு ஏதேனும் மோசமான ஊனம்
  rationale: רָע என்பதன் ‘மோசமான/தீய’ என்ற வெளிப்படையான சொல்லாட்சியைத் தக்கவைத்து, முன்சொன்ன இரு எடுத்துக்காட்டுகளுக்கு அப்பாற்பட்ட ஊனங்களையும் உள்ளடக்குகிறது; அதன் சூழல்சார் பொருள் அடிக்குறிப்பில் விளக்கப்படுகிறது.
- source_word: לֹא תִזְבָּחֶנּוּ
  choice: அதை ... பலியிடக் கூடாது
  rationale: சட்டவிதியில் வரும் தடையைத் தெளிவாகத் தருவதோடு, இது வெறும் கொல்லுதல் அல்ல, பலியாகச் செலுத்துதல் என்பதையும் காட்டுகிறது.
- source_word: לַיהוָה אֱלֹהֶיךָ
  choice: உங்கள் கடவுளாகிய யாவேக்கு
  rationale: உடன்படிக்கையின் தெய்வீகப் பெயரை ‘யாவே’ எனப் பெயர்ப்பதோடு, ஒருமை இரண்டாம் நபர் உருபை தமிழில் மரியாதைமிக்க பொதுவான ‘உங்கள்’ என வழங்குகிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரை வழங்குதல்
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூலத்தில் தனிப்பெயரான நான்கெழுத்துத் தெய்வீகப் பெயர் நேரடியாக இருப்பதால், பட்டப்பெயராக மாற்றாமல் தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளது.
- issue: பலிக்குத் தகுதியற்ற מוּם רָע என்பதன் தன்மை
  choice: மோசமான ஊனம்
  alternative: கடுமையான ஊனம் / ஏற்கத்தகாத ஊனம்
  rationale: மூலத்தின் மதிப்பீட்டுச் சொல்லை மறைக்காமல் தக்கவைக்கிறது; இது அறநெறித் தீமையல்ல, பலிக்குத் தகுதியற்ற உடற்குறை என்பதை அடிக்குறிப்பு தெளிவுபடுத்துகிறது.
translation_notes:
  register: நவீன செந்தமிழ் நடையில், பொதுவாசகர்களுக்கு எளிதில் புரியும் வகையில் சட்டவிதியின் கண்ணியமும் நேரடித்தன்மையும் காக்கப்பட்டுள்ளன. ‘ஊனம்’ என்பது இவ்வசனத்தின் விலங்கு மற்றும் பலி சார்ந்த சூழலிலேயே பயன்படுத்தப்பட்டுள்ளது.
