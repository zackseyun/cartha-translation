translation_notes:
  register: நவீன பொதுத்தரத் தமிழில், மரியாதையும் தெளிவும் கொண்ட நடை பயன்படுத்தப்பட்டுள்ளது. ‘கையைத் திற’ என்ற மூல உருவகம் பாதுகாக்கப்பட்டுள்ளது; எபிரெய வினை மீளுருவாக்கத்தின் வலியுறுத்தல் இயல்பான தமிழ் கட்டளைநடையாலும் அடிக்குறிப்பாலும் தெரிவிக்கப்பட்டுள்ளது.
