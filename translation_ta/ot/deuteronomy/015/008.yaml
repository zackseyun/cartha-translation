    reason: lexical_alternative
  revision_rationale: The revision retains every substantive element of the draft while replacing an awkward final relative expression with idiomatic modern Tamil. The semicolon makes the two coordinated, emphatic obligations clear. The footnote remains anchored to “மாறாக” and accurately explains the Hebrew emphatic verbal repetition without overstating its grammatical effect.
