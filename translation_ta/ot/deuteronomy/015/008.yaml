source:
  edition: WLC
  text: כִּֽי פָתֹ֧חַ תִּפְתַּ֛ח אֶת יָדְ/ךָ֖ ל֑/וֹ וְ/הַעֲבֵט֙ תַּעֲבִיטֶ֔/נּוּ דֵּ֚י מַחְסֹר֔/וֹ אֲשֶׁ֥ר יֶחְסַ֖ר לֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/015/008.yaml
  text: Instead[a], you must open your hand to him and surely lend him enough for whatever he lacks.
translation:
  language: ta
  text: மாறாக[a], நீ உன் கையை அவனுக்காகத் தாராளமாகத் திறக்க வேண்டும்; அவனுக்குக் குறைவாக இருப்பதற்கேற்பப் போதுமான அளவு அவனுக்குக் கடனாகக் கொடுக்க வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், ‘திறக்க, நீ திறக்க வேண்டும் … கடனாகக் கொடுக்க, நீ கடனாகக் கொடுக்க வேண்டும்’ என்று வினை வடிவங்கள் மீண்டும் வருகின்றன; இது கட்டளையை வலியுறுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: மாறாக
  rationale: முந்தைய வசனத்தில் கண்டிக்கப்பட்ட கடின இதயத்துடனான மறுப்புக்கு எதிரான செயலை இச்சொல் அறிமுகப்படுத்துகிறது; எனவே காரணப் பொருளைவிட எதிர்மறைத் தொடர்பைக் காட்டும் மொழிபெயர்ப்பு சூழலுக்கு ஏற்றது.
- source_word: פָתֹחַ תִּפְתַּח
  choice: தாராளமாகத் திறந்து
  rationale: வினையெச்ச முழுவடிவத்துடன் மீண்டும் வரும் வினை கட்டளையை வலியுறுத்துகிறது. ‘கையைத் திற’ என்ற எபிரெய உருவகத்தைப் பாதுகாத்து, வலியுறுத்தலை இயல்பான தமிழில் ‘தாராளமாக’ வெளிப்படுத்துகிறது.
- source_word: יָדְךָ
  choice: உன் கையை
  rationale: ‘கை’ என்ற நேரடியான உருவகம் உதவி செய்யும் மனப்பான்மையையும் கொடையுணர்வையும் தமிழிலும் இயல்பாக உணர்த்துகிறது.
- source_word: לוֹ
  choice: அவனுக்கு
  rationale: வறிய சகோதரனே திறந்த கையுடனான செயலின் பெறுநர் என்பதை நேரடியாகக் குறிக்கிறது.
- source_word: וְהַעֲבֵט תַּעֲבִיטֶנּוּ
  choice: அவனுக்குக் கடனாகக் கொடுக்க வேண்டும்
  rationale: עבט என்பதன் ஹிஃபில் பயன்பாடு கடனாகக் கொடுத்தலைக் குறிக்கிறது; மீளுருவாக்கம் கட்டளையின் உறுதியையும் கடமையையும் வலியுறுத்துவதால் ‘கொடுக்க வேண்டும்’ என்று இயல்பாகத் தரப்பட்டுள்ளது.
- source_word: דֵּי
  choice: போதுமான அளவு
  rationale: தேவையை நிறைவேற்றும் அளவிலான போதுமையைச் சுருக்கமாகவும் தெளிவாகவும் தெரிவிக்கிறது.
- source_word: מַחְסֹרוֹ אֲשֶׁר יֶחְסַר לוֹ
  choice: அவனுக்கு எது குறைவாயிருக்கிறதோ அந்தத் தேவைக்கு
  rationale: ‘அவனுடைய குறைவு—அவனுக்குக் குறைவது’ என்ற எபிரெய தொடர் தமிழில் தேவையற்ற கரடுமுரடான மறுபடியையும் தவிர்த்து, குறைவின் திறந்த வரம்பைப் பாதுகாக்கிறது.
