review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the adversative force of כִּי in context, the open-hand idiom, the obligation to lend, and the requirement that the loan meet the person's actual lack. However, the phrase “எது குறைவாயிருக்கிறதோ அந்தத் தேவைக்கு” is grammatically and idiomatically awkward in modern Tamil, obscuring the source’s “his need/lack that is lacking to him.”
  naturalness: The overall register is clear and appropriately modern. Revising the final need phrase to “அவனுக்குக் குறைவாக இருப்பதற்கேற்ப” produces more natural Tamil while retaining the open-ended scope of the Hebrew expression.
  terminology: “கடனாகக் கொடுக்க” correctly renders the Hiphil of עבט. “உன் கையை ... திறக்க” preserves the Hebrew generosity idiom. “தாராளமாக” is a defensible idiomatic expression of the emphatic ‘open, you shall open’ and does not impose a doctrinal interpretation.
  issues:
  - severity: medium
    issue: Awkward rendering of the need clause
    rationale: “அவனுக்கு எது குறைவாயிருக்கிறதோ அந்தத் தேவைக்கு” is not smooth standard Tamil and blends ‘what is lacking’ with ‘need’ in an unnecessarily cumbersome construction. The Hebrew specifies sufficient provision corresponding to the lack that he has; “அவனுக்குக் குறைவாக இருப்பதற்கேற்ப” expresses this naturally and accurately.
  revised_text: மாறாக[a], நீ உன் கையை அவனுக்காகத் தாராளமாகத் திறக்க வேண்டும்; அவனுக்குக் குறைவாக இருப்பதற்கேற்பப் போதுமான அளவு அவனுக்குக் கடனாகக் கொடுக்க வேண்டும்.
  revised_footnotes:
  - marker: a
