- from: மாறாக[a], நீ உன் கையை அவனுக்குத் தாராளமாகத் திறந்து, அவனுக்கு எது குறைவாயிருக்கிறதோ அந்தத் தேவைக்குப் போதுமான அளவு அவனுக்குக் கடனாகக் கொடுக்க வேண்டும்.
  to: மாறாக[a], நீ உன் கையை அவனுக்காகத் தாராளமாகத் திறக்க வேண்டும்; அவனுக்குக் குறைவாக இருப்பதற்கேற்பப் போதுமான அளவு அவனுக்குக் கடனாகக் கொடுக்க வேண்டும்.
  rationale: The revision retains every substantive element of the draft while replacing an awkward final relative expression with idiomatic modern Tamil. The semicolon makes the two coordinated, emphatic obligations clear. The footnote remains anchored to “மாறாக” and accurately explains the Hebrew emphatic verbal repetition without overstating its grammatical effect.
