source:
  edition: WLC
  text: כָּֽל הַ/בְּכ֡וֹר אֲשֶׁר֩ יִוָּלֵ֨ד בִּ/בְקָרְ/ךָ֤ וּ/בְ/צֹֽאנְ/ךָ֙ הַ/זָּכָ֔ר תַּקְדִּ֖ישׁ לַ/יהוָ֣ה אֱלֹהֶ֑י/ךָ לֹ֤א תַעֲבֹד֙ בִּ/בְכֹ֣ר שׁוֹרֶ֔/ךָ וְ/לֹ֥א תָגֹ֖ז בְּכ֥וֹר צֹאנֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/015/019.yaml
  text: Every firstborn male that is born among your herd and among your flock you shall consecrate to Yahweh your God[a]. You shall not work with the firstborn of your ox[b], nor shear the firstborn of your flock.
translation:
  language: ta
  text: உன் கால்நடை மந்தையிலும் ஆட்டு மந்தையிலும் முதலில் பிறக்கும் ஒவ்வொரு ஆண் விலங்கையும் உன் கடவுளாகிய யாவேக்கு[a] அர்ப்பணித்துப் புனிதமாக்கு. உன் எருதின் முதற்பேற்றை வேலைக்குப் பயன்படுத்தாதே; உன் ஆட்டு மந்தையின் முதற்பேற்றின் மயிரைக் கத்தரிக்காதே.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் இங்கு கடவுளின் தனிப்பெயரான יהוה (YHWH) வருகிறது.
    reason: divine_name
lexical_decisions:
- source_word: כָּל הַבְּכוֹר ... הַזָּכָר
  choice: முதற்பேறான ஆண் ஒவ்வொன்றையும்
  rationale: כָּל உடன் வரும் ஒருமைச் சொற்றொடர் இங்கு பகிர்ந்தளிக்கும் பொருளில் ‘ஒவ்வொன்றையும்’ எனப் பொருள்படுகிறது; הַזָּכָר ஆண் விலங்குகளையே குறிப்பதாகத் தெளிவுபடுத்துகிறது.
- source_word: אֲשֶׁר יִוָּלֵד
  choice: பிறக்கும்
  rationale: ילד என்பதன் நிஃபால் வடிவம் விலங்கு பிறப்பதைச் சுட்டுகிறது; தமிழில் இயல்பான நிகழ்கால உறவெச்சம் கட்டளையின் பொதுவான பயன்பாட்டை வெளிப்படுத்துகிறது.
- source_word: בִּבְקָרְךָ וּבְצֹאנְךָ
  choice: உன் மாட்டு மந்தையிலும் ஆட்டு மந்தையிலும்
  rationale: בקר பெரிய கால்நடைகளையும், צאן செம்மறியாடுகளும் வெள்ளாடுகளும் அடங்கிய சிறுகால்நடை மந்தையையும் குறிக்கின்றன; இரண்டின் வேறுபாட்டையும் இயல்பான தமிழில் காக்கிறது.
- source_word: תַּקְדִּישׁ
  choice: அர்ப்பணித்துப் புனிதமாக்கு
  rationale: קדש என்பதன் ஹிஃபில் வடிவம் கடவுளுக்கெனப் பிரித்துப் புனிதமாக்குவதைச் சுட்டுகிறது. ‘அர்ப்பணி’ மட்டும் காட்டாத புனிதப்படுத்தும் கருத்தையும் இச்சொற்றொடர் காக்கிறது.
- source_word: לַיהוָה אֱלֹהֶיךָ
  choice: உன் கடவுளாகிய யாவேக்கு
  rationale: יהוה என்ற உடன்படிக்கைப் பெயரை பெயராகவே ஒலிபெயர்த்து, אֱלֹהֶיךָ என்பதை ‘உன் கடவுள்’ என்று நேரடியாகத் தருகிறது.
- source_word: לֹא תַעֲבֹד בִּבְכֹר שׁוֹרֶךָ
  choice: உன் மாட்டின் முதற்பேற்றை வேலைக்குப் பயன்படுத்தாதே
  rationale: עבד உடன் வரும் ב இங்கு அந்த விலங்கை உழைப்புக்குப் பயன்படுத்துவதைச் சுட்டுகிறது; தமிழில் ‘வேலைக்குப் பயன்படுத்தாதே’ என்பது பொருளைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: וְלֹא תָגֹז בְּכוֹר צֹאנֶךָ
  choice: உன் ஆட்டு மந்தையின் முதற்பேற்றுக்கு மயிர் கத்தரிக்காதே
  rationale: גזז என்பது மந்தை விலங்கின் மயிரைக் கத்தரிப்பதைக் குறிக்கிறது. צאן என்பதை செம்மறியாடு என்று மட்டும் குறுக்காமல் ‘ஆட்டு மந்தை’ எனக் காக்கிறது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: ஆண்டவர்; யெகோவா
  rationale: மூலத்தில் இறைப்பெயர் நேரடியாக உள்ளது. அதை ஒரு பட்டப்பெயராக மாற்றாமல், பரவலாக ஏற்கப்படும் ‘யாவே’ என்ற தமிழ் ஒலிபெயர்ப்பில் வழங்குவது மூலத்தின் தனிப்பெயர் தன்மையைப் பாதுகாக்கிறது.
- issue: תַּקְדִּישׁ என்பதிலுள்ள வழிபாட்டு சார்ந்த புனிதப்படுத்தல்
  choice: அர்ப்பணித்துப் புனிதமாக்கு
  alternative: அர்ப்பணி; பரிசுத்தப்படுத்து
  rationale: இச்செயல் வெறும் கொடையளிப்பல்ல; யாவேக்கெனத் தனியே பிரித்துப் புனிதமாக்குவதாகும். இரு கருத்துகளையும் வெளிப்படுத்தும் சொற்றொடர் தேர்ந்தெடுக்கப்பட்டது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகருக்குப் புரியும் மதிப்புறு நடையில் வடிவமைக்கப்பட்டது. ‘மாட்டு மந்தை / ஆட்டு மந்தை’ என்ற இணை மூலத்திலுள்ள பெரிய மற்றும் சிறிய கால்நடைகளின் வேறுபாட்டைக் காக்கிறது; ஒருமை இரண்டாம் நபர் கட்டளையும் தக்கவைக்கப்பட்டுள்ளது.
