revisions:
- from: உன் மாட்டு மந்தையிலும் ஆட்டு மந்தையிலும் பிறக்கும் முதற்பேறான ஆண் ஒவ்வொன்றையும் உன் கடவுளாகிய யாவேக்கு[a] அர்ப்பணித்துப் புனிதமாக்கு. உன் மாட்டின் முதற்பேற்றை வேலைக்குப் பயன்படுத்தாதே; உன் ஆட்டு மந்தையின் முதற்பேற்றுக்கு மயிர் கத்தரிக்காதே.
