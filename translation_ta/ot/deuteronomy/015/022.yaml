base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/015/022.yaml
  text: You may eat it within your gates[a]; the unclean and the clean alike may eat it[b], as the gazelle and the deer.
translation:
  language: ta
  text: உங்கள் ஊர்களில்[a] அதை உண்ணலாம்; சடங்குரீதியாகத் தீட்டுப்பட்டவரும் சடங்குரீதியாகச் சுத்தமானவரும் இருவரும் அதை உண்ணலாம்[b]—கலைமானையும் மானையும் உண்பதுபோலவே.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொல்லாட்சியாக, “உங்கள் வாசல்களுக்குள்”; இது உங்கள் ஊர்கள் அல்லது உள்ளூர் குடியிருப்புகளுக்குள் என்பதைக் குறிக்கும் மரபுத்தொடர்.
    reason: cultural_note
  - marker: b
    text: அதாவது, சடங்குரீதியாகத் தீட்டுப்பட்டவரும் சடங்குரீதியாகச் சுத்தமானவரும் இருவரும் அதை உண்ணலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּשְׁעָרֶיךָ
  choice: உங்கள் ஊர்களுக்குள்
  rationale: சொல்லாட்சியாக ‘உங்கள் வாசல்களுக்குள்’ என்றாலும், இங்கு ‘வாசல்கள்’ என்பது நகரங்கள் அல்லது உள்ளூர் குடியிருப்புகளைக் குறிக்கும் எபிரெய மரபுத்தொடர். இயல்பான நவீன தமிழுக்காக பொருள் நேரடியாக வழங்கப்பட்டது; மூலப்படிமம் அடிக்குறிப்பில் சுட்டப்படுகிறது.
- source_word: תֹּאכֲלֶנּוּ
  choice: அதை உண்ணலாம்
  rationale: இரண்டாம் நபர் ஒருமை வினையுடன் மூன்றாம் நபர் ஆண்பால் ஒருமை செயப்படுபொருள் உள்ளது; முந்தைய சூழலிலுள்ள விலங்கை இது குறிக்கிறது. சூழலில் அனுமதி வலியுறுத்தப்படுவதால் ‘உண்ணலாம்’ பொருத்தமானது.
- source_word: הַטָּמֵא
  choice: சடங்குமுறைப்படி தீட்டுள்ளவர்
  rationale: இது ஒழுக்கக்கேட்டைக் குறிக்காமல் சடங்கியல் நிலையைக் குறிக்கிறது. தமிழில் ‘தீட்டுள்ளவர்’ மட்டும் சமூக அல்லது ஒழுக்கத் தவறாகப் புரிந்துகொள்ளப்படக்கூடும் என்பதால் சடங்குமுறைத் தகுதி வெளிப்படையாகக் கூறப்பட்டது.
- source_word: וְהַטָּהוֹר
  choice: சடங்குமுறைப்படி தூய்மையானவர்
  rationale: எதிர்ச் சொல்லான הַטָּמֵא உடன் இணைந்து சடங்கியல் நிலையையே குறிக்கிறது. ‘தூய்மையானவர்’ என்பதற்கு சடங்குமுறை என்ற வரையறை சேர்க்கப்பட்டுள்ளது.
- source_word: יַחְדָּו
  choice: அதுபோலவே
  rationale: இரு சடங்கியல் நிலைகளில் உள்ளவர்களும் வேறுபாடின்றி உண்ண அனுமதிக்கப்படுகின்றனர் என்ற பகிர்ந்த அனுமதியை இயல்பான தமிழில் தெரிவிக்கிறது; ஒரே நேரத்தில் சேர்ந்து உண்ணுதல் என்று கட்டாயப்படுத்தவில்லை.
- source_word: כַּצְּבִי
  choice: கலைமானை உண்பதுபோல
  rationale: צְבִי என்பது பொதுவாக gazelle வகையைக் குறிக்கிறது. தமிழில் அறியப்பட்ட விலங்குப்பெயராக ‘கலைமான்’ தேர்ந்தெடுக்கப்பட்டது; כְּ ஒப்புமை உணவுச் செயலைக் குறிக்கும் வகையில் இயல்பாக விரிக்கப்பட்டது.
- source_word: וְכָאַיָּל
  choice: மானை உண்பதுபோல
  rationale: אַיָּל என்பது மான், சில சூழல்களில் குறிப்பாக ஆண் மான். இங்கு பாலினத்தை வலியுறுத்தாத பொதுவான ‘மான்’ தெளிவானது.
theological_decisions:
- issue: தீட்டுள்ளவரும் தூய்மையானவரும் உண்பதற்கான அனுமதி
  choice: இரு சடங்கியல் நிலைகளில் உள்ளவர்களும் வேறுபாடின்றி உண்ணலாம் என்று மொழிபெயர்க்கப்பட்டது.
  alternative: அவர்கள் கட்டாயமாக ஒன்றாக அல்லது ஒரே நேரத்தில் உண்ண வேண்டும் என்று மொழிபெயர்த்தல்.
  rationale: יַחְדָּו இங்கு பகிர்ந்த அனுமதியைத் தெரிவிக்கிறது; ஒரே இடத்திலும் நேரத்திலும் கூடி உண்பதை வசனம் கட்டாயப்படுத்தவில்லை.
- issue: கலைமான் மற்றும் மான் பற்றிய ஒப்புமையின் நோக்கம்
  choice: ஒப்புமையை அப்படியே வைத்துள்ளது; விளக்கக் கோட்பாட்டை முதன்மை உரையில் சேர்க்கவில்லை.
  alternative: இவை பலியிடப்படாத வேட்டைவிலங்குகள் என்பதால் சடங்கியல் நிலையைக் கருத்தில் கொள்ளாமல் உண்ணலாம் என்று உரையிலேயே விளக்குதல்.
  rationale: அந்தப் பின்னணி சூழலிலிருந்து புரிந்தாலும், இவ்வசனத்தின் எபிரெய உரை ஒப்புமையை மட்டும் கூறுகிறது; அதன் முழு தத்துவ விளக்கத்தை உரைக்குள் இறக்கக்கூடாது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. ‘உங்கள்’ என்பது எபிரெய ஒருமை ‘உன்’ என்பதைக் காட்டிலும் தமிழில் சமூகத்திடம் உரையாடும் இயல்பான மரியாதை வடிவம். எபிரெய வாசல் உருவகம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது; சடங்கியல் தீட்டு ஒழுக்கத் தீமை எனத் தவறாகப் புரியாதவாறு முதன்மை உரையிலேயே தெளிவுபடுத்தப்பட்டுள்ளது.
