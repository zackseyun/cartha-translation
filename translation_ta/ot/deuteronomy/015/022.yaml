  to: உங்கள் ஊர்களில்[a] அதை உண்ணலாம்; சடங்குரீதியாகத் தீட்டுப்பட்டவரும் சடங்குரீதியாகச் சுத்தமானவரும் இருவரும் அதை உண்ணலாம்[b]—கலைமானையும் மானையும் உண்பதுபோலவே.
