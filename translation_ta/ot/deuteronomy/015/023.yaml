revisions:
- from: ஆனால் அதன் இரத்தத்தை மட்டும் நீ உண்ணக்கூடாது; அதைத் தண்ணீரைப் போலத் தரையில் ஊற்றிவிட வேண்டும்.
  to: ஆனால், அதன் இரத்தத்தை நீ உண்ணக்கூடாது; அதைத் தண்ணீரைப் போலத் தரையில் ஊற்ற வேண்டும்.
  rationale: The revision preserves the restrictive exception expressed by רַק, the prohibition against consuming blood, and the command to pour it on the ground like water. It removes minor Tamil overmarking and an unnecessary aspectual nuance while retaining a clear modern legal register.
