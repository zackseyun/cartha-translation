  text: רַ֥ק אֶת דָּמ֖/וֹ לֹ֣א תֹאכֵ֑ל עַל הָ/אָ֥רֶץ תִּשְׁפְּכֶ֖/נּוּ כַּ/מָּֽיִם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/015/023.yaml
  text: Only[a], you shall not eat its blood; you shall pour it out on the ground like water.
translation:
  language: ta
  text: ஆனால், அதன் இரத்தத்தை நீ உண்ணக்கூடாது; அதைத் தண்ணீரைப் போலத் தரையில் ஊற்ற வேண்டும்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רַק
  choice: ஆனால் … மட்டும்
  rationale: முந்தைய அனுமதிக்கு விதிக்கப்படும் கட்டுப்பாட்டை இயல்பான நவீனத் தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: אֶת דָּמוֹ
  choice: அதன் இரத்தத்தை
  rationale: விலங்கைக் குறிக்கும் உடைமைப் பின்னொட்டை நேரடியாகவும் இயல்பாகவும் தருகிறது; ‘உயிர் இரத்தம்’ போன்ற விளக்கத்தைச் சேர்க்கவில்லை.
- source_word: לֹא תֹאכֵל
  choice: நீ உண்ணக்கூடாது
  rationale: சட்டக் கட்டளையின் தடை வலிமையைத் தெளிவான நவீனத் தமிழில் காக்கிறது.
- source_word: עַל הָאָרֶץ
  choice: தரையில்
  rationale: இங்கு இரத்தத்தை மண்ணின்மேல் ஊற்றுவதைச் சுட்டும் உறுதியான சூழலுக்கு இயல்பான தமிழ்ச் சொல்.
- source_word: תִּשְׁפְּכֶנּוּ
  choice: அதை … ஊற்றிவிட வேண்டும்
  rationale: இரத்தத்தை வெளியே ஊற்றி அகற்றும் கட்டளையை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: כַּמָּיִם
  choice: தண்ணீரைப் போல
  rationale: எபிரேய ஒப்புமையை நேரடியாகவும் பொதுவாகப் புரியும் தமிழிலும் காக்கிறது.
theological_decisions:
- issue: உணவுச் சட்டத்தில் இரத்தத்தைக் கையாளுதல்
  choice: விலங்கின் இரத்தத்தை உண்ணக்கூடாது என்ற தடையையும் அதைத் தரையில் ஊற்ற வேண்டும் என்ற கட்டளையையும் மட்டும் வெளிப்படையாக மொழிபெயர்த்தல்
  alternative: ‘உயிர் இரத்தம்’ என்று மொழிபெயர்த்து இரத்தத்துக்கும் உயிருக்கும் உள்ள தொடர்பை இவ்வசனத்திலேயே முன்னிறுத்துதல்
  rationale: இவ்வசனம் இரத்தத்தைப் பற்றிய செயல் கட்டளையைத் தருகிறது; அதற்கான இறையியல் காரணத்தை இங்கே வெளிப்படையாகக் கூறாததால் மொழிபெயர்ப்பில் அதைச் சேர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்கு எளிதில் புரியும், கண்ணியமான சட்டநடை. ‘உண்ணக்கூடாது’ மற்றும் ‘ஊற்றிவிட வேண்டும்’ என்பவை கட்டளையின் வலிமையை இயல்பாகக் காக்கின்றன.
