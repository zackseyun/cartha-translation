  text: נָת֤וֹן תִּתֵּן֙ ל֔/וֹ וְ/לֹא יֵרַ֥ע לְבָבְ/ךָ֖ בְּ/תִתְּ/ךָ֣ ל֑/וֹ כִּ֞י בִּ/גְלַ֣ל הַ/דָּבָ֣ר הַ/זֶּ֗ה יְבָרֶכְ/ךָ֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ בְּ/כָֽל מַעֲשֶׂ֔/ךָ וּ/בְ/כֹ֖ל מִשְׁלַ֥ח יָדֶֽ/ךָ־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/015/010.yaml
  text: You shall surely give to him[a], and your heart shall not be troubled when you give to him[c][b], because on account of this thing Yahweh your God will bless you in all your work and in every undertaking of your hand.
translation:
  language: ta
  text: அவனுக்கு நிச்சயமாகக் கொடு[a]. அவனுக்குக் கொடுக்கும்போது உன் மனதில் மனக்கசப்பு இருக்கக்கூடாது[b]. ஏனெனில், இந்தக் காரியத்தின் காரணமாக உன் கடவுளாகிய யாவே[c], உன் எல்லா வேலைகளிலும், நீ கையிட்டு மேற்கொள்ளும் ஒவ்வொன்றிலும்[d] உன்னை ஆசீர்வதிப்பார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘நிச்சயமாகக் கொடு’ என்பதற்கான எபிரெயக் கட்டமைப்பு, கொடுக்க வேண்டும் என்ற கட்டளையை வலியுறுத்துகிறது; ‘தாராளமாகக் கொடு’ என்றும் பொருள் விளக்கமாக மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘உன் மனதில் மனக்கசப்பு இருக்கக்கூடாது’ என்பதை ‘உன் உள்ளம் வருந்த வேண்டாம்’ அல்லது ‘வேதனைப்பட வேண்டாம்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: ‘யாவே’ என்பது יהוה (YHWH) என்ற எபிரெய இறைத் தனிப்பெயரின் ஒலிபெயர்ப்பு; பல மொழிபெயர்ப்புகள் இதை ‘கர்த்தர்’ என்று வழங்குகின்றன.
    reason: alternative_reading
  - marker: d
    text: 'சொல்லுக்குச் சொல்: ‘உன் கையை அனுப்பும் ஒவ்வொன்றிலும்’; அதாவது, நீ மேற்கொள்ளும் ஒவ்வொன்றிலும்.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נָתוֹן תִּתֵּן
  choice: நிச்சயமாகக் கொடு
  rationale: வினையெச்சத்தின் முழுவடிவமும் தொடரும் வினையும் இணைந்து கட்டளையை வலியுறுத்துகின்றன. ‘நிச்சயமாகக் கொடு’ என்பது ‘தாராளமாக’ என்ற விளக்கத்தைச் சேர்க்காமல் அந்த வலியுறுத்தலை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: לּוֹ
  choice: அவனுக்கு
  rationale: எபிரெயச் சொல் ஆண்பால் ஒருமை விகுதியைக் கொண்டது; முந்தைய சூழலில் குறிப்பிடப்படும் தேவையுள்ள சக இஸ்ரவேலனைச் சுட்டுகிறது.
- source_word: וְלֹא יֵרַע לְבָבְךָ
  choice: உன் உள்ளம் வருந்த வேண்டாம்
  rationale: கொடுப்பதைப் பற்றிய உள்ளார்ந்த வேதனை, தயக்கம் அல்லது மனக்கசப்பை இந்தச் சொற்றொடர் குறிக்கலாம். ‘வருந்த வேண்டாம்’ என்பது மூலத்தின் உள்ளம் சார்ந்த உருவகத்தையும் அதன் பொருள் விரிவையும் காக்கிறது.
- source_word: בְּתִתְּךָ לוֹ
  choice: அவனுக்குக் கொடுக்கும்போது
  rationale: முன்னொட்டுடன் வரும் வினையெச்சக் கட்டமைப்பு இங்கு காலத்தையோ சூழ்நிலையையோ குறிக்கிறது; இத்தமிழாக்கம் இயல்பாக அதைக் காட்டுகிறது.
- source_word: כִּי בִּגְלַל הַדָּבָר הַזֶּה
  choice: ஏனெனில், இந்தக் காரியத்தின் காரணமாக
  rationale: בגלל காரணத்தையும் דבר இங்கு முன் கட்டளையிடப்பட்ட கொடுக்கும் செயலாகிய ‘காரியத்தையும்’ குறிக்கிறது.
- source_word: יְבָרֶכְךָ
  choice: உன்னை ஆசீர்வதிப்பார்
  rationale: ברך என்பதற்கான வழக்கமான வேதாகமத் தமிழ் ‘ஆசீர்வதிப்பார்’; எழுவாயான தேவனுக்குரிய மரியாதைப் பன்மை வினைமுற்று பயன்படுத்தப்பட்டுள்ளது.
- source_word: יְהוָה
  choice: யாவே
  rationale: நான்கு எபிரெய மெய்யெழுத்துகளால் குறிக்கப்படும் தனிப்பெயர், ஒரு பொதுப் பட்டமாக மாற்றப்படாமல் ‘யாவே’ என்று ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: אֱלֹהֶיךָ
  choice: உன் கடவுள்
  rationale: இரண்டாம் நபர் ஒருமை உடைமைப்பொருளுடன் வரும் உடன்படிக்கைச் சூழலிலான நேரடியான அடையாளம்.
- source_word: בְּכָל מַעֲשֶׂךָ
  choice: உன் செயல்கள் அனைத்திலும்
  rationale: מעשה ஒருவர் செய்வதையோ உருவாக்குவதையோ விரிவாகக் குறிக்கும்; ‘செயல்கள்’ அந்தப் பரந்த பொருளைத் தக்கவைக்கிறது.
- source_word: וּבְכֹל מִשְׁלַח יָדֶךָ
  choice: நீ கையிட்டுச் செய்யும் அனைத்திலும்
  rationale: ‘கையை அனுப்புதல்’ என்ற எபிரெய உருவகத்தை, ஒருவர் மேற்கொள்ளும் முயற்சிகள் அனைத்தையும் குறிக்கும் இயல்பான தமிழ் மரபுத்தொடரால் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைத் தனிப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் பட்டம் அல்ல, YHWH என்ற தனிப்பெயரே உள்ளது. ஆகவே அதை மறைக்காமல் தமிழில் ஒலிபெயர்ப்பது மூல ஆதாரத்தை நேரடியாகப் பிரதிபலிக்கிறது.
- issue: பெறுபவரைக் குறிக்கும் ஆண்பால் ஒருமைப் பெயர்ப்பதிலி
  choice: அவனுக்கு
  alternative: அவருக்கு / அவர்களுக்கு
  rationale: எபிரெய விகுதி ஆண்பால் ஒருமை; உடனடிச் சூழலில் உள்ள ஏழைச் சகோதரனைச் சுட்டுவதால் அதன் இலக்கண எண்ணும் பாலினமும் காக்கப்பட்டுள்ளன.
- issue: கொடுப்பதற்கும் ஆசீர்வாதத்திற்கும் இடையிலான காரணத் தொடர்பு
  choice: இந்தக் காரியத்தின் காரணமாக
  alternative: இதனால்
  rationale: בגלל என்ற காரணக் குறியீட்டைத் தெளிவாக வைத்திருக்கிறது; அதேவேளையில் ஆசீர்வாதத்தின் இயல்பு அல்லது செயல்முறையை மூலத்தைத் தாண்டி விளக்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் வேதாகம உரைக்கேற்ற கண்ணியத்துடனும் வடிவமைக்கப்பட்டது. ஒருமை இரண்டாம் நபர் நடை காக்கப்பட்டுள்ளது. ‘உள்ளம் வருந்துதல்’ என்ற சொற்றொடர் துயரம், தயக்கம், மனக்கசப்பு ஆகியவற்றுக்கிடையிலான மூலத்தின் பொருள் பரப்பைத் திறந்தவாறே வைக்கிறது; அடிக்குறிப்பு மாற்றுப் பொருள்களைத் தருகிறது.
