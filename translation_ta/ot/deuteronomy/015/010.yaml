  terminology: ‘யாவே’ மற்றும் ‘உன் கடவுள்’ சரியானவை. ‘ஆசீர்வதிப்பார்’ வேதாகமத் தமிழில் நிலையான, பொருத்தமான சொல். ‘மனக்கசப்பு’ இங்கு உள்ளார்ந்த எதிர்மறை மனநிலையை ‘வருத்தம்’ என்பதைக் காட்டிலும் துல்லியமாகக் குறிக்கிறது.
