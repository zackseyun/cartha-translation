  text: הַעֲנֵ֤יק תַּעֲנִיק֙ ל֔/וֹ מִ/צֹּ֣אנְ/ךָ֔ וּ/מִֽ/גָּרְנְ/ךָ֖ וּ/מִ/יִּקְבֶ֑/ךָ אֲשֶׁ֧ר בֵּרַכְ/ךָ֛ יְהוָ֥ה אֱלֹהֶ֖י/ךָ תִּתֶּן לֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/015/014.yaml
  text: You shall surely furnish him from your flock[a], from your threshing floor, and from your winepress; from what Yahweh your God has blessed you with, you shall give to him.
translation:
  language: ta
  text: உன் மந்தையிலிருந்தும், தானியம் போரடிக்கும் உன் களத்திலிருந்தும், திராட்சை பிழியும் உன் ஆலையிலிருந்தும் அவனுக்கு நிச்சயமாக வழங்கு[a]. உன் கடவுளாகிய யாவே உன்னை எவற்றால் ஆசீர்வதித்தாரோ, அவற்றிலிருந்து அவனுக்குக் கொடு.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அவனுக்குத் தாராளமாக வழங்கு’ என்றும் மொழிபெயர்க்கலாம். எபிரெய மொழியில் வலியுறுத்தும் வினை அமைப்பு பயன்படுத்தப்பட்டுள்ளது; இங்குள்ள வினை, விடுதலை செய்யும்போது ஒருவருக்குத் தேவையானவற்றை நிறைவாக அளிப்பதைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַעֲנֵיק תַּעֲנִיק
  choice: அவனுக்குக் கண்டிப்பாக வழங்கு
  rationale: ஒரே வேர்ச்சொல்லின் வினையெச்ச முழுவடிவமும் முடிவுற்ற வினையும் இணைந்து கட்டளையை வலியுறுத்துகின்றன. ‘கண்டிப்பாக’ அந்த வலியுறுத்தலை இயல்பான நவீனத் தமிழில் தருகிறது; ‘வழங்கு’ என்பது விடுதலையின்போது தேவையான பொருள்களை அளிப்பதைக் குறிக்கிறது. தாராள அளவு குறித்த சொல்லியல் நுட்பம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: מִצֹּאנְךָ
  choice: உன் ஆட்டு மந்தையிலிருந்து
  rationale: צאן என்பது பொதுவாகச் செம்மறியாடுகளையும் வெள்ளாடுகளையும் உள்ளடக்கும் சிறுகால்நடை மந்தையைக் குறிக்கிறது. ‘ஆட்டு மந்தை’ தமிழில் இயல்பாகவும் வேளாண் சூழலைத் தெளிவாகவும் தருகிறது.
- source_word: וּמִגָּרְנְךָ
  choice: தானியம் போரடிக்கும் உன் களத்திலிருந்து
  rationale: גֹּרֶן என்பதன் நேரடிப் பொருள் தானியம் போரடிக்கும் களம்; இங்கு அது அங்கிருந்து கிடைக்கும் தானிய விளைச்சலையும் ஆகுபெயராகக் குறிக்கிறது. விளக்கச் சொற்றொடர் மூலத்தின் காட்சியைத் தக்கவைத்து இன்றைய வாசகருக்குப் பொருளைத் தெளிவாக்குகிறது.
- source_word: וּמִיִּקְבֶךָ
  choice: உன் திராட்சை ஆலையிலிருந்து
  rationale: יֶקֶב திராட்சையைப் பிழியும் ஆலை அல்லது அதன் தொட்டியைக் குறிக்கிறது. ‘திராட்சை ஆலை’ மூலத்தின் வேளாண் காட்சியை இயல்பான தமிழில் பாதுகாக்கிறது.
- source_word: אֲשֶׁר בֵּרַכְךָ יְהוָה אֱלֹהֶיךָ
  choice: உன் கடவுளாகிய யாவே உன்னை எவற்றால் ஆசீர்வதித்தாரோ
  rationale: உறவுச்சொற்றொடர் கொடுக்கப்படும் பொருள்கள் கடவுளின் முந்திய ஆசீர்வாதத்திலிருந்து வருவதைத் தெரிவிக்கிறது. பன்மையான ‘எவற்றால் … அவற்றிலிருந்து’ தமிழில் இந்த உறவைத் தெளிவாகத் தொடர்கிறது.
- source_word: תִּתֶּן לוֹ
  choice: அவற்றிலிருந்து அவனுக்குக் கொடு
  rationale: இறுதி வினைச்சொல் அளிக்க வேண்டிய கடமையை நேரடியான கட்டளையாக மீண்டும் கூறுகிறது; לוֹ என்பதன் பெறுநர் பொருளும் வெளிப்படையாகத் தக்கவைக்கப்படுகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய மூலத்தில் வரும் நான்கெழுத்துத் தெய்வீகப் பெயரை ஒரு பட்டத்தால் மாற்றாமல் தனிப்பெயராக ஒலிபெயர்க்கிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: யெகோவா
  rationale: மூல உரை தெய்வீகத் தனிப்பெயரை நேரடியாகப் பயன்படுத்துகிறது. ‘யாவே’ என்பது அதை ஒரு பொதுப் பட்டமாக மாற்றாமல், பரவலாக ஏற்கப்படும் ஒலிப்புக்கு நெருக்கமாகத் தமிழில் தருகிறது.
- issue: விடுதலையாகும் அடிமைக்குக் கொடுப்பதன் அளவு
  choice: கட்டளையின் வலியுறுத்தலை முதன்மை உரையில் தக்கவைத்து, தாராளமான வழங்கல் என்ற சொல்லியல் வாய்ப்பை அடிக்குறிப்பில் காட்டுதல்
  alternative: முதன்மை உரையிலேயே ‘தாராளமாக வழங்கு’ என்று மொழிபெயர்த்தல்
  rationale: הַעֲנֵיק תַּעֲנִיק கட்டளையை உறுதியாக வலியுறுத்துகிறது; ענק என்ற வினையின் இந்தப் பயன்பாடு நிறைவாகப் பொருளளிப்பதையும் சுட்டக்கூடும். அளவை முற்றிலும் நிர்ணயிக்காமல் இரு நுட்பங்களையும் பாதுகாக்க இவ்வமைப்பு தேர்ந்தெடுக்கப்பட்டது.
translation_notes:
  register: நவீன நிலையான தமிழில், சட்டக் கட்டளைக்கேற்ற நேரடியானவும் கண்ணியமானவும் உள்ள நடை பயன்படுத்தப்பட்டுள்ளது. ‘தானியம் போரடிக்கும் களம்’ மற்றும் ‘திராட்சை ஆலை’ என்ற சொற்கள் மூலத்தின் மூன்று வேளாண் ஆதாரங்களையும் தெளிவாக வைத்திருக்கின்றன; ‘யாவே’ தனிப்பெயராகப் பயன்படுத்தப்பட்டுள்ளது.
