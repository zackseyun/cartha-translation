  text: אֶת הַ/נָּכְרִ֖י תִּגֹּ֑שׂ וַ/אֲשֶׁ֨ר יִהְיֶ֥ה לְ/ךָ֛ אֶת אָחִ֖י/ךָ תַּשְׁמֵ֥ט יָדֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/015/003.yaml
  text: You may press a foreigner for payment[c][b][a], but whatever of yours is with your brother your hand shall release.
translation:
  language: ta
  text: அந்நியனிடமிருந்து நீ கடனைத் திருப்பிச் செலுத்துமாறு வற்புறுத்தலாம்[a]; ஆனால் உன் சகோதரனிடம் இருக்கும் உனக்குரிய எதற்குமான கோரிக்கையையும் நீ விட்டுவிட வேண்டும்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அந்நியனிடமிருந்து நீ கடனை வசூலிக்கலாம்.’ எபிரெய வினைச்சொல், கடன் சூழலில் திருப்பிச் செலுத்துமாறு அழுத்தம் கொடுப்பதையோ கோருவதையோ குறிக்கிறது.
    reason: lexical_alternative
  - marker: c
    text: எபிரெயத்தில் சொல்லுக்குச் சொல், ‘உன் கை விடுவிக்கும்.’ விடுவிப்பு ஆண்டில் கடனை வசூலிப்பதற்கான கோரிக்கையை விட்டுவிடுவதே இம்மரபுத்தொடரின் பொருள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנָּכְרִי
  choice: அந்நியன்
  rationale: இச்சட்டச் சூழலில் உடன்படிக்கைச் சமூகத்திற்கு வெளியே உள்ள ஒருவரைக் குறிக்கிறது. ‘அந்நியன்’ அந்தச் சமூக-சட்ட வேறுபாட்டைச் சுருக்கமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: תִּגֹּשׂ
  choice: கடனைத் திருப்பிச் செலுத்தும்படி வற்புறுத்தலாம்
  rationale: கடன் வசூலிக்கும் சூழலில் נגשׂ என்பது கடனைச் செலுத்தும்படி அழுத்தம் கொடுப்பதையோ கோருவதையோ குறிக்கிறது. தமிழில் கடன் சார்ந்த பொருள் தெளிவாக இருக்க இவ்வாறு விரிவாக மொழிபெயர்க்கப்பட்டது.
- source_word: וַאֲשֶׁר יִהְיֶה לְךָ
  choice: உனக்குரிய எதன்மீதான
  rationale: கடனாளியிடம் கடன் கொடுத்தவருக்குரிய எதையும் குறிக்கக்கூடிய எபிரெய உரையின் திறந்த அமைப்பைப் பாதுகாக்கிறது.
- source_word: אָחִיךָ
  choice: உன் சகோதரன்
  rationale: சொல்லின் நேரடியான குடும்ப உருவகத்தைப் பாதுகாக்கிறது; இங்கு அது உடன்படிக்கைச் சமூகத்தைச் சேர்ந்த சக இஸ்ரவேலனைக் குறிக்கும் என்பதை அடிக்குறிப்பு விளக்குகிறது.
- source_word: תַּשְׁמֵט יָדֶךָ
  choice: உன் உரிமையை விட்டுவிட வேண்டும்
  rationale: ‘உன் கையை விடுவி’ என்ற எபிரெய மரபுத்தொடர், விடுவிப்பு ஆண்டில் கடன் கோரிக்கையைத் துறப்பதைக் குறிக்கிறது. சொற்சொற் வடிவம் தமிழில் பொருள் மங்கச் செய்வதால் அதன் சட்டப் பொருள் இயல்பாக வழங்கப்பட்டது.
theological_decisions:
- issue: உபாகமச் சட்டத்தில் ‘உன் சகோதரன்’ என்பதன் பொருள் எல்லை
  choice: முதன்மை உரையில் ‘உன் சகோதரன்’ என்ற உடன்படிக்கைசார் குடும்பச் சொல்லைத் தக்கவைத்தல்
  alternative: உன் சக இஸ்ரவேலன்
  rationale: வசனம் அந்நியனையும் இஸ்ரவேல் சமூகத்தைச் சேர்ந்த ‘சகோதரனையும்’ வேறுபடுத்துகிறது. நேரடியான உருவகத்தை உரையில் வைத்துக் கொண்டு அதன் சமூகப் பொருளை அடிக்குறிப்பில் விளக்குவது தேவையற்ற மிகை விளக்கத்தைத் தவிர்க்கிறது.
- issue: ‘கையை விடுவித்தல்’ என்ற மரபுத்தொடரின் மொழிபெயர்ப்பு
  choice: கடன்மீதான உரிமையை விட்டுவிடுதல் என்று பொருள்வழி மொழிபெயர்த்தல்
  alternative: உன் கையை விடுவிக்க வேண்டும்
  rationale: இங்கு உடல் செயல் அல்ல, விடுவிப்பு ஆண்டில் கடனை வசூலிக்கும் உரிமையைத் துறப்பதே கருத்து. இயல்பான தமிழில் சட்டப் பொருளைத் தெளிவாக்கியபோதும் உருவகத்தை அடிக்குறிப்பில் பதிவு செய்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சட்டச் சூழலைச் சாதாரண வாசகருக்குத் தெளிவாக்கும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘சகோதரன்’ என்ற மூல உருவகம் தக்கவைக்கப்பட்டு, ‘கையை விடுவித்தல்’ என்ற தெளிவற்ற சொற்சொற் வடிவத்திற்குப் பதிலாக அதன் கடன்-விடுவிப்பு பொருள் முதன்மை உரையில் வழங்கப்பட்டுள்ளது.
