base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/015/007.yaml
  text: If there is a poor man among you[a], one of your brothers, within one of your gates in your land that Yahweh your God is giving you[b], you shall not harden your heart or shut your hand against your poor brother.
translation:
  language: ta
  text: 'உன்னிடையே, உன் சகோதரர்களில் ஒருவனாகிய ஏழை ஒருவன், உன் கடவுளாகிய யாவே உனக்குக் கொடுக்கிற உன் நாட்டிலுள்ள உன் வாசல்களில் ஒன்றில்[a] இருந்தால், உன் உள்ளத்தைக் கடினப்படுத்தாதே; உன் ஏழைச் சகோதரனுக்கு உதவ உன் கையை மூடிக்கொள்ளாதே.


    [a] அதாவது, ‘உன் பட்டணங்களில் ஒன்றில்.’ எபிரெய மொழியில் சொல்லர்த்தமாக, ‘உன் வாசல்களில் ஒன்றில்.’


    [b] இங்கு ‘சகோதரர்கள்,’ ‘சகோதரன்’ என்ற குடும்ப உறவுச் சொற்கள் உடன்படிக்கைச் சமூகத்தைச் சேர்ந்த பிற உறுப்பினர்களைக் குறிக்கின்றன.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அதாவது, ‘உன் பட்டணங்களில் ஒன்றில்.’ எபிரெய மொழியில் சொல்லர்த்தமாக, ‘உன் வாசல்களில் ஒன்றில்.’
    reason: lexical_alternative
  - marker: b
    text: இங்கு ‘சகோதரர்கள்,’ ‘சகோதரன்’ என்ற குடும்ப உறவுச் சொற்கள் உடன்படிக்கைச் சமூகத்தைச் சேர்ந்த பிற உறுப்பினர்களைக் குறிக்கின்றன.
    reason: cultural_note
lexical_decisions:
- source_word: כִּי יִהְיֶה
  choice: இருந்தால்
  rationale: நிபந்தனை அடிப்படையிலான சட்டச் சூழலை இயல்பான தமிழில் வெளிப்படுத்துகிறது; ‘இருக்கும்போது’ என்பதும் சாத்தியம்.
- source_word: אֶבְיוֹן
  choice: ஏழை ஒருவன்
  rationale: வறுமையிலும் தேவையிலும் இருப்பவரைக் குறிக்கும் ஆண்பால் ஒருமை வடிவத்தைத் தக்கவைக்கிறது.
- source_word: מֵאַחַד אַחֶיךָ
  choice: உன் சகோதரர்களில் ஒருவனாகிய
  rationale: உடன்படிக்கைச் சமூகத்துக்குள் உள்ள குடும்ப உறவு மொழியை நேரடியாகப் பாதுகாக்கிறது.
- source_word: בְּאַחַד שְׁעָרֶיךָ
  choice: உன் வாசல்களில் ஒன்றுக்குள்
  rationale: எபிரெய மொழியின் ‘வாசல்கள்’ என்ற உருவகத்தை முதன்மை உரையில் தக்கவைத்து, அது பட்டணத்தைக் குறிக்கக்கூடும் என்பதை அடிக்குறிப்பில் விளக்குகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரான நான்கு எழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: לֹא תְאַמֵּץ אֶת לְבָבְךָ
  choice: உன் இதயத்தைக் கடினப்படுத்தாதே
  rationale: இரக்கமற்ற, இணங்காத மனநிலையைக் குறிக்கும் எபிரெய மொழிமரபைத் தெளிவாகவும் அதன் உருவகத்துடனும் வழங்குகிறது.
- source_word: וְלֹא תִקְפֹּץ אֶת יָדְךָ
  choice: உன் கையை மூடிக்கொள்ளாதே
  rationale: உதவ மறுப்பதை மூடிய கையின் உருவகத்தால் காட்டும் மூல மொழியைப் பாதுகாக்கிறது.
- source_word: מֵאָחִיךָ הָאֶבְיוֹן
  choice: உன் ஏழைச் சகோதரனுக்கு
  rationale: மறுப்பு அந்த ஏழைச் சகோதரனை நோக்கியது என்பதை இயல்பான தமிழில் தெரிவிக்கிறது.
theological_decisions:
- issue: אַחֶיךָ / אָחִיךָ என்ற உடன்படிக்கை உறவுமொழி
  choice: சகோதரர்கள் / சகோதரன்
  alternative: உறவினர் / சக இஸ்ரவேலர்
  rationale: குடும்ப உறவின் வழியாக பொருளாதாரப் பொறுப்பை வலியுறுத்தும் மூலத்தின் சமூக-இறையியல் வலிமையைத் தக்கவைக்கிறது; அதன் சமூகப் பொருள் அடிக்குறிப்பில் தெளிவுபடுத்தப்படுகிறது.
- issue: יְהוָה என்ற தெய்வீகப் பெயர்
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூலத்தில் இடம்பெறும் தனிப்பெயரைத் தக்கவைத்து, அதை ஒரு பட்டமாக மாற்றுவதைத் தவிர்க்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் நேரடியான ஒருமை கட்டளையைக் கொண்ட கண்ணியமான சட்டநடை பயன்படுத்தப்பட்டுள்ளது. இதயம் மற்றும் மூடிய கை ஆகிய எபிரெய உருவகங்கள் இயல்பான தமிழிலும் புரியுமாறு தக்கவைக்கப்பட்டுள்ளன.
