  terminology: ‘யாவே,’ ‘சகோதரர்கள்/சகோதரன்,’ ‘ஏழை’ ஆகியவை மூலத்திற்கும் வழங்கப்பட்ட ஆங்கில ஆய்வுத் தடத்திற்கும் ஏற்றவை. உடன்படிக்கைச் சமூகத்தைப் பற்றிய அடிக்குறிப்பு விளக்கமாக மட்டுமே உள்ளது; பிரதான உரையில் கூடுதல் விளக்கத்தை ஏற்றவில்லை.
