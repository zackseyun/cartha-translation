  source_fidelity: 'மூல எபிரெயத்தின் காரணவியல் அமைப்பும் முக்கியச் சொற்களும் துல்லியமாகக் காக்கப்பட்டுள்ளன: எகிப்து நாட்டிலிருந்த அடிமைநிலை, யாவே தேவன் செய்த மீட்பு, அதனால் வரும் இன்றைய கட்டளை ஆகியவை தெளிவாக உள்ளன. ‘இதை’ என்பது אֶת־הַדָּבָר הַזֶּה என்பதற்குச் சூழலுக்கேற்ற இயல்பான தமிழ் வடிவம்; சொற்சொல் பரந்த பொருள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.'
