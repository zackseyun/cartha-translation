source:
  edition: WLC
  text: וְ/זָכַרְתָּ֗ כִּ֣י עֶ֤בֶד הָיִ֨יתָ֙ בְּ/אֶ֣רֶץ מִצְרַ֔יִם וַֽ/יִּפְדְּ/ךָ֖ יְהוָ֣ה אֱלֹהֶ֑י/ךָ עַל כֵּ֞ן אָנֹכִ֧י מְצַוְּ/ךָ֛ אֶת הַ/דָּבָ֥ר הַ/זֶּ֖ה הַ/יּֽוֹם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/015/015.yaml
  text: And you shall remember that you were a servant in the land of Egypt[a], and Yahweh your God redeemed you[c][b]; therefore I am commanding you this today.
translation:
  language: ta
  text: நீ எகிப்து நாட்டில் அடிமையாக[a] இருந்ததையும், உன் கடவுளாகிய யாவே உன்னை மீட்டதையும்[b] நினைவில் கொள். ஆகவே, இன்று இதை[c] நான் உனக்குக் கட்டளையிடுகிறேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘பணியாளராக’ என்றும் மொழிபெயர்க்கலாம். எபிரெய עֶבֶד இரு பொருள்களையும் தரலாம்; இங்கு எகிப்தின் அடிமைத்தனச் சூழல் ‘அடிமை’ என்ற பொருளை வலுப்படுத்துகிறது.
    reason: lexical_alternative
  - marker: b
    text: ‘மீட்புவிலை கொடுத்து விடுவித்ததையும்’ என்றும் பொருள் கொள்ளலாம். எபிரெய வினை அடிமைத்தனத்திலிருந்து மீட்பதை அல்லது விலை கொடுத்து விடுவிப்பதைச் சுட்டுகிறது.
    reason: lexical_alternative
  - marker: c
    text: சொற்சொல்லாக, ‘இந்தக் காரியத்தை’; அதாவது, இங்கு வழங்கப்படும் அறிவுறுத்தலை.
    reason: literal_rendering
lexical_decisions:
- source_word: וְזָכַרְתָּ
  choice: நினைவில் கொள்
  rationale: சட்ட அறிவுரையின் சூழலில் இது வெறும் எதிர்காலக் கூற்று அல்ல, நினைவுகூரும்படி விடுக்கப்படும் கட்டளை. நவீன தமிழில் இயல்பான கட்டளை வடிவம் பயன்படுத்தப்பட்டது.
- source_word: עֶבֶד
  choice: அடிமை
  rationale: இச்சொல் பணியாளரையும் அடிமையையும் குறிக்கக்கூடும்; ஆனால் எகிப்தின் கட்டாய அடிமைத்தனச் சூழலில் ‘அடிமை’ என்பதே வரலாற்று மற்றும் அறநெறி வலிமையைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: בְּאֶרֶץ מִצְרַיִם
  choice: எகிப்து நாட்டில்
  rationale: ‘எகிப்து நாட்டில்’ என்பது எபிரெய உரையின் konkretமான வரலாற்றுச் சொற்றொடரை இயல்பான தமிழில் காக்கிறது.
- source_word: וַיִּפְדְּךָ
  choice: உன்னை மீட்டதையும்
  rationale: פדה என்பது அடிமைத்தனத்திலிருந்து மீட்பதையும் மீட்புவிலை கொடுத்து விடுவிப்பதையும் குறிக்கிறது. ‘மீட்டார்’ என்பது தேவையற்ற விளக்கத்தைச் சேர்க்காமல் இரு பரிமாணங்களையும் தாங்கும் வழக்கமான தமிழ் சொல்.
- source_word: יְהוָה
  choice: யாவே
  rationale: திருநான்கெழுத்துப் பெயரை பொதுப்பட்டமாக மாற்றாமல், நவீன தமிழில் எளிதாக வாசிக்கக்கூடிய ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: אֱלֹהֶיךָ
  choice: உன் கடவுளாகிய
  rationale: இரண்டாம் நபர் ஒருமை உடைமைப் பின்னொட்டையும், யாவேவுக்கும் ‘கடவுள்’ என்பதற்கும் உள்ள இணைப்பையும் தெளிவாகக் காட்டுகிறது.
- source_word: עַל כֵּן
  choice: ஆகவே
  rationale: கடந்தகால மீட்பே தற்போதைய கட்டளைக்கான காரணம் என்பதைச் சுருக்கமாகவும் தெளிவாகவும் காட்டுகிறது.
- source_word: אָנֹכִי מְצַוְּךָ
  choice: நான் உனக்குக் கட்டளையிடுகிறேன்
  rationale: வலியுறுத்தப்பட்ட ‘நான்’ என்பதையும், நிகழ்காலத்தில் வழங்கப்படும் நேரடி கட்டளையையும் காக்கிறது.
- source_word: אֶת הַדָּבָר הַזֶּה
  choice: இதை
  rationale: சூழலில் இது இப்போது வழங்கப்படும் அறிவுறுத்தலைச் சுட்டுகிறது. ‘இந்தக் காரியத்தை’ என்ற சொற்சொல் வடிவத்தைவிட ‘இதை’ நவீன தமிழில் இயல்பாக உள்ளது; எபிரெய வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: הַיּוֹם
  choice: இன்று
  rationale: உடன்படிக்கை அறிவுறுத்தலின் உடனடித் தன்மையை நேரடியாகக் காக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூல உரை பொதுப்பட்டத்தை அல்ல, கடவுளின் தனிப்பட்ட உடன்படிக்கைப் பெயரையே பயன்படுத்துகிறது. எனவே அந்தப் பெயர் ஒலிபெயர்க்கப்பட்டது.
- issue: எகிப்தில் இஸ்ரவேலரின் நிலையை குறிக்கும் עֶבֶד
  choice: அடிமை
  alternative: பணியாளர்
  rationale: עֶבֶד என்பதற்கு இரு பொருள்களும் இருக்கலாம்; எனினும் எகிப்திய ஒடுக்குமுறை மற்றும் கட்டாயப் பிணைப்பு இங்கு மையமாக இருப்பதால் ‘அடிமை’ தேர்ந்தெடுக்கப்பட்டது.
- issue: பדה என்ற மீட்பு வினையின் பொருள்
  choice: மீட்டார்
  alternative: மீட்புவிலை கொடுத்து விடுவித்தார்
  rationale: ‘மீட்டார்’ என்பது அடிமைத்தனத்திலிருந்து விடுதலையையும் அதனுடன் தொடர்புடைய மீட்புவிலைச் சாயலையும் தாங்குகிறது; விலை உண்மையில் செலுத்தப்பட்ட விதத்தை உரை இங்கு விளக்காததால் விரிவான மாற்று முதன்மை உரையில் சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீன தரநிலைத் தமிழில், ஒருமை முன்னிலையைத் தொடர்ந்து பயன்படுத்தும் கண்ணியமான நேரடி அறிவுரை நடை. மூலத்தின் காரணவியல் அமைப்பும் உடன்படிக்கை நினைவூட்டலும் காக்கப்பட்டுள்ளன; இயல்பற்ற சொற்சொல் வடிவங்கள் அடிக்குறிப்புகளில் பதிவு செய்யப்பட்டுள்ளன.
