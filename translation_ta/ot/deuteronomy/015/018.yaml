base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/015/018.yaml
  text: It shall not seem hard to you when you send him away free from you[a], because for six years he has served you for double the wages of a hired worker; and Yahweh your God will bless you in all that you do.
translation:
  language: ta
  text: அவனை உன்னிடமிருந்து சுதந்திரமாக அனுப்பிவிடுவது உனக்குக் கடினமாகத் தோன்ற வேண்டாம். ஏனெனில், கூலியாளின் கூலியின் இருமடங்கு மதிப்புள்ள சேவையை அவன் ஆறு ஆண்டுகள் உனக்குச் செய்திருக்கிறான்[a]. உன் கடவுளாகிய யாவே, நீ செய்யும் அனைத்திலும் உன்னை ஆசீர்வதிப்பார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கூலியாளின் கூலியின் இருமடங்குக்கு இணையாக அவன் ஆறு ஆண்டுகள் உனக்குச் சேவை செய்திருக்கிறான்.” எபிரேயச் சொல்லாட்சி, அவனுடைய ஆறு ஆண்டுச் சேவையின் மதிப்பைக் கூலி உழைப்பின் மதிப்போடு ஒப்பிடுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִקְשֶׁה בְעֵינֶיךָ
  choice: அது உனக்குக் கடினமாகத் தோன்ற வேண்டாம்
  rationale: ‘உன் கண்களில் கடினமாக இருக்க வேண்டாம்’ என்ற எபிரேய மரபுத்தொடர், விடுதலை செய்வதைச் சுமையாகவோ வருத்தத்துக்குரியதாகவோ கருதாதே என்பதைக் குறிக்கிறது. தமிழில் இயல்பாகவும் அதன் மதிப்பீட்டுச் சாயலைக் காக்கவும் இவ்வாறு மொழிபெயர்க்கப்பட்டது.
- source_word: בְּשַׁלֵּחֲךָ אֹתוֹ חָפְשִׁי מֵעִמָּךְ
  choice: அவனை உன்னிடமிருந்து விடுதலையாக அனுப்பும்போது
  rationale: חָפְשִׁי சட்டரீதியான விடுதலை நிலையைச் சுட்டுகிறது; מֵעִמָּךְ என்பதன் நேரடியான உறவுசார் பொருளான ‘உன்னிடமிருந்து’ என்பதும் காக்கப்பட்டுள்ளது.
- source_word: מִשְׁנֶה שְׂכַר שָׂכִיר
  choice: கூலியாளின் கூலியைப்போல் இருமடங்கு மதிப்புடையது
  rationale: מִשְׁנֶה என்பது ‘இருமடங்கு’; שְׂכַר שָׂכִיר என்பது ‘கூலியாளின் கூலி’. ஆறு ஆண்டுச் சேவையின் மதிப்பை கூலி உழைப்போடு ஒப்பிடும் கருத்தைத் தமிழில் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: עֲבָדְךָ שֵׁשׁ שָׁנִים
  choice: ஆறு ஆண்டுகள் அவன் உனக்குச் செய்த பணி
  rationale: வடிவம் ‘அவன் உனக்குச் சேவை செய்தான்’ என்ற வினைப் பொருளைத் தருகிறது. அடுத்துள்ள மதிப்பு ஒப்பீட்டோடு தமிழில் இயல்பாக இணைய பெயர்ச்சொல் அமைப்பு பயன்படுத்தப்பட்டுள்ளது; அடிமைப்பட்ட நிலை சுற்றியுள்ள சட்டச் சூழலில் தெளிவாகிறது.
- source_word: וּבֵרַכְךָ יְהוָה אֱלֹהֶיךָ
  choice: உன் கடவுளாகிய யாவே உன்னை ஆசீர்வதிப்பார்
  rationale: இங்கு வாக்குறுதி/எதிர்காலப் பொருள் உள்ளது. יהוה தனிப்பட்ட உடன்படிக்கைப் பெயராக ‘யாவே’ என்று ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: בְּכֹל אֲשֶׁר תַּעֲשֶׂה
  choice: நீ செய்யும் அனைத்திலும்
  rationale: முகவரியின் எல்லா செயல்களையும் முயற்சிகளையும் உள்ளடக்கும் விரிவான எபிரேயச் சொல்லாட்சியை இயல்பான நவீனத் தமிழில் தருகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலத்தில் நான்கு எழுத்து இறைப்பெயர் நேரடியாக உள்ளது. அதை பொதுப் பட்டப்பெயராக மாற்றாமல் உடன்படிக்கைப் பெயராக ஒலிபெயர்ப்பது மூல வேறுபாட்டைக் காக்கிறது.
- issue: עבד சூழலில் அடிமைப்பட்ட நிலையை இவ்வசனத்திலேயே வெளிப்படையாகக் குறிப்பிடலாமா
  choice: அவன் உனக்குச் செய்த பணி
  alternative: உன் அடிமை உனக்குச் சேவை செய்தான்
  rationale: இந்தச் சொல் வடிவம் இங்கு வினையாகச் செயல்பட்டு, வழங்கப்பட்ட உழைப்பை முன்னிறுத்துகிறது. அடிமை/கடன் பிணைப்பு நிலை சுற்றியுள்ள சட்டப்பகுதியில் வெளிப்படுவதால், இவ்வசனத்தில் தேவையற்ற விளக்கத்தைச் சேர்க்காமல் மூலத்தின் கவனம் காக்கப்பட்டுள்ளது.
- issue: מִשְׁנֶה שְׂכַר שָׂכִיר என்பதன் ஒப்பீடு
  choice: அவனுடைய ஆறு ஆண்டுப் பணி கூலியாளின் கூலியைப்போல் இருமடங்கு மதிப்புடையது
  alternative: அவன் கூலியாளின் இருமடங்கு கூலிக்காக உழைத்தான்
  rationale: எபிரேயச் சொற்றொடர் அளவு/மதிப்பு ஒப்பீட்டைத் தருகிறது; உண்மையில் அவனுக்குக் கூலி வழங்கப்பட்டதாகச் சொல்லாது. ஆகவே பணி மதிப்பை முன்னிறுத்தி, உண்மையான கூலி செலுத்தப்பட்டதாகத் தோன்றும் வாசிப்பைத் தவிர்க்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; சட்டப்பகுதிக்கேற்ற கண்ணியமான, நேரடியான நடை. ஒருமை இரண்டாம் நபர் தொடர்ச்சியாகப் பேணப்பட்டுள்ளது. ‘விடுதலையாக’ என்பது வெறும் அனுப்பிவைப்பை அல்ல, சட்டரீதியான சுதந்திரத்தை உணர்த்துகிறது.
