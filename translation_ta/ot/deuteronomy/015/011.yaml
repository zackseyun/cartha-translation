base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/015/011.yaml
  text: For the poor will never cease from the midst of the land[a]; therefore I am commanding you, saying, ‘You must surely open your hand to your brother, to your afflicted one[b], and to your poor one in your land.’
translation:
  language: ta
  text: ஏனெனில், நாட்டின் நடுவிலிருந்து ஏழைகள் ஒருபோதும் ஒழிந்துபோக மாட்டார்கள். ஆகையால், “உன் நாட்டிலுள்ள உன் சகோதரனுக்கும்[a], உன் துன்புறும் ஒருவனுக்கும்[b], உன் வறியவனுக்கும் உன் கையைத் தாராளமாகத் திறந்துகொடு” என்று நான் உனக்குக் கட்டளையிடுகிறேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உன் சக இஸ்ரவேலனுக்கும்.” எபிரெயில் “உன் சகோதரனுக்கும்” என்று உள்ளது; இது உடன்படிக்கைச் சமூகத்தைச் சேர்ந்த ஒருவரைக் குறிக்கும் உறவுமுறை மொழி.
    reason: lexical_alternative
  - marker: b
    text: “துன்புறும் ஒருவன்” என்று மொழிபெயர்க்கப்பட்ட எபிரெயச் சொல் ஏழை, தாழ்ந்தவர், அல்லது துன்புறுத்தப்பட்டவர் என்பவற்றைக் குறிக்கலாம்; “ஏழை” அல்லது “வறியவர்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய கட்டளைக்கான காரணத்தை அறிமுகப்படுத்தும் எபிரெய இணைப்பின் விளக்கப் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: לֹא יֶחְדַּל
  choice: ஒருபோதும் ஒழிந்துபோக மாட்டார்கள்
  rationale: எதிர்மறையுடன் வரும் நிறைவுறாத வினை, தொடரும் எதிர்கால உண்மையைக் குறிக்கிறது; ‘ஒருபோதும்’ அதன் வலிமையை வெளிப்படுத்துகிறது.
- source_word: אֶבְיוֹן
  choice: ஏழைகள் / வறியவன்
  rationale: முதல் இடத்தில் ஒருமைச் சொல் ஒரு வகுப்பை மொத்தமாகக் குறிப்பதால் இயல்பான தமிழில் பன்மை பயன்படுத்தப்பட்டுள்ளது; பின்னர் עָנִי என்பதிலிருந்து வேறுபடுத்த ‘வறியவன்’ என வழங்கப்பட்டுள்ளது.
- source_word: מִקֶּרֶב הָאָרֶץ
  choice: நாட்டின் நடுவிலிருந்து
  rationale: קֶרֶב என்பதன் ‘நடுவில்/மத்தியில்’ என்ற நுணுக்கத்தையும், உபாகமச் சூழலில் הָאָרֶץ குறிக்கும் உடன்படிக்கை நாட்டையும் காக்கிறது.
- source_word: עַל כֵּן
  choice: ஆகையால்
  rationale: முந்தைய உண்மையிலிருந்து வரும் முடிவைத் தெளிவாகக் காட்டுகிறது.
- source_word: אָנֹכִי מְצַוְּךָ
  choice: நான் உனக்குக் கட்டளையிடுகிறேன்
  rationale: பேசுபவர் இப்போது நேரடியாக விதிக்கும் கட்டளையின் உடனடித் தன்மையை இயல்பான தமிழில் தருகிறது.
- source_word: לֵאמֹר
  choice: என்று
  rationale: எபிரெய மேற்கோள் அறிமுகத்தைத் தமிழின் இயல்பான மேற்கோள் அமைப்பில் காக்கிறது.
- source_word: פָּתֹחַ תִּפְתַּח
  choice: தாராளமாகத் திறக்க வேண்டும்
  rationale: வினையெச்ச முழுவடிவமும் வினையும் சேர்ந்துள்ள வலியுறுத்தலைக் கட்டளைக் கடமையாக வெளிப்படுத்துகிறது; ‘தாராளமாக’ கை திறத்தல் என்ற உருவகத்தின் கொடைப் பொருளையும் இயல்பாக உணர்த்துகிறது.
- source_word: אֶת יָדְךָ
  choice: உன் கையை
  rationale: தாராளமாகக் கொடுப்பதைக் குறிக்கும் மூலமொழி உருவகத்தை அப்படியே காக்கிறது.
- source_word: לְאָחִיךָ
  choice: உன் சகோதரனுக்கும்
  rationale: உடன்படிக்கை உறவுமுறை மொழியைப் பாதுகாக்கிறது; இச்சூழலில் இது சக இஸ்ரவேலனைப் பிரதிநிதித்துவமாகக் குறிக்கலாம் என்பதைக் காலடிக்குறிப்பு தெளிவுபடுத்துகிறது.
- source_word: לַעֲנִיֶּךָ
  choice: துன்புற்ற ஏழைக்கும்
  rationale: עָנִי என்பதில் வறுமையுடன் துன்பம் அல்லது தாழ்நிலையும் அடங்கலாம்; அருகிலுள்ள אֶבְיוֹן என்பதிலிருந்து அதன் நுணுக்கத்தை வேறுபடுத்துகிறது.
- source_word: וּלְאֶבְיֹנְךָ
  choice: வறியவனுக்கும்
  rationale: இணையாக வரும் இரு எபிரெய வறுமைச் சொற்களையும் தமிழில் முற்றிலும் ஒன்றாக்காமல் வேறுபடுத்துகிறது.
theological_decisions:
- issue: உடன்படிக்கை உறவுமுறைச் சொல்
  choice: உன் சகோதரனுக்கும்
  alternative: உன் சக இஸ்ரவேலனுக்கும்
  rationale: ஆண்பால் ஒருமையில் உள்ள אָחִיךָ என்ற மூலமொழிச் சொல்லின் குடும்ப மற்றும் உடன்படிக்கை வலிமை காக்கப்பட்டுள்ளது; அதன் பிரதிநிதித்துவப் பயன்பாடு காலடிக்குறிப்பில் விளக்கப்படுகிறது.
- issue: הָאָרֶץ / אַרְצֶךָ என்பவற்றின் எல்லை
  choice: நாடு / உன் நாடு
  alternative: பூமி
  rationale: உபாகமத்தின் உடனடிச் சூழலில் குறிக்கப்படுவது இஸ்ரவேலுக்குக் கொடுக்கப்படும் உடன்படிக்கை நாடு; ஆகவே உலகமெங்கும் என்ற பொருளைத் தேவையின்றி புகுத்தவில்லை.
- issue: לְאָחִיךָ לַעֲנִיֶּךָ וּלְאֶבְיֹנְךָ தொடரின் உறவு
  choice: இணையாக வரிசைப்படுத்தப்பட்ட அழைப்புகள்
  alternative: உன் சகோதரனாகிய துன்புற்ற ஏழைக்கும் வறியவனுக்கும்
  rationale: எபிரெயில் ஒவ்வொரு கூறுக்கும் לְ முன்னொட்டு வருவதால் தொடரின் இலக்கணத் திறந்தநிலை காக்கப்படுகிறது; இருப்பினும் இவை ஒரே தேவையுள்ள உடன்படிக்கைச் சமூக உறுப்பினரை விவரிக்கும் இணைச் சொற்களாகவும் புரிந்துகொள்ளப்படலாம்.
translation_notes:
  register: நவீனத் தரத் தமிழில் மரியாதையும் தெளிவும் காக்கப்பட்டுள்ளன. மூலத்தின் ‘கையைத் திற’ என்ற உருவகம் விடப்படாமல், அதன் வலியுறுத்தலும் கொடைப் பொருளும் ‘தாராளமாகத் திறக்க வேண்டும்’ என இயல்பாக்கப்பட்டுள்ளன. முதல் கூற்றிலுள்ள பொதுப்பொருள் ஒருமை தமிழில் இயல்பாகப் பன்மையாக்கப்பட்டுள்ளது.
