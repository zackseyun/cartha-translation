source:
  edition: WLC
  text: וְ/זֶה֮ דְּבַ֣ר הַ/שְּׁמִטָּה֒ שָׁמ֗וֹט כָּל בַּ֨עַל֙ מַשֵּׁ֣ה יָד֔/וֹ אֲשֶׁ֥ר יַשֶּׁ֖ה בְּ/רֵעֵ֑/הוּ לֹֽא יִגֹּ֤שׂ אֶת רֵעֵ֨/הוּ֙ וְ/אֶת אָחִ֔י/ו כִּֽי קָרָ֥א שְׁמִטָּ֖ה לַֽ/יהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/015/002.yaml
  text: 'And this is the matter of the release: every creditor shall release what his hand has lent to his neighbor[a]. He shall not press his neighbor or his brother[b], because a release to Yahweh has been proclaimed.'
translation:
  language: ta
  text: 'விடுவிப்பின் முறை இதுவே: கடன் கொடுத்த ஒவ்வொருவரும் தன் அயலானுக்குக் கொடுத்த கடனை விட்டுவிட வேண்டும்.[a] அவர் தன் அயலானிடமோ தன் சகோதரனிடமோ[b] கடனைத் திருப்பிச் செலுத்தும்படி வற்புறுத்தக் கூடாது; ஏனெனில் யாவேக்குரிய விடுவிப்பு அறிவிக்கப்பட்டுள்ளது.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘விடுவிப்பு’ என்பதற்கு ‘கடன் தள்ளுபடி’ அல்லது ‘கடன் ரத்து’ என்றும் பொருள் கொள்ளலாம். எபிரெயத்தில் ஷெமித்தா என்பது ஓய்வு ஆண்டில் கடன் உரிமைக் கோரிக்கைகளை முறையாக விட்டுவிடுவதைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: இங்கு ‘சகோதரன்’ என்பது உடன்படிக்கைச் சமூகத்தைச் சேர்ந்த ஒருவரைக் குறிக்கிறது; இதை ‘சக இஸ்ரவேலன்’ என்றும் விளக்கமாக மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: דְּבַר הַשְּׁמִטָּה
  choice: விடுவிப்பின் முறை
  rationale: דְּבַר என்பது இங்கு வெறும் ‘சொல்’ அல்ல; விடுவிப்பு எவ்வாறு நடைமுறைப்படுத்தப்பட வேண்டும் என்ற விதிமுறையைக் குறிக்கிறது.
- source_word: הַשְּׁמִטָּה / שְׁמִטָּה
  choice: விடுவிப்பு
  rationale: சப ஓய்வு ஆண்டில் கடன் உரிமைக் கோரிக்கையை விட்டுவிடுவதைக் குறிக்கும் சொல்லாக ‘விடுவிப்பு’ இயல்பாகவும் சட்டப் பொருளுக்கு ஏற்றவாறும் உள்ளது.
- source_word: שָׁמוֹט
  choice: விட்டுவிட வேண்டும்
  rationale: வினையெச்ச முழுவடிவம் கட்டளையின் வலிமையைத் தருகிறது; தமிழில் ‘வேண்டும்’ என்பதுடன் கூறுவது சட்டக் கட்டளையை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: כָּל בַּעַל מַשֵּׁה יָדוֹ
  choice: கடன் கொடுத்த ஒவ்வொருவரும்
  rationale: எபிரெயச் சொற்றொடர் கடன் உரிமைக் கோரிக்கையை வைத்திருப்பவரைக் குறிக்கிறது; தமிழில் இவ்வாறு கூறுவது தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: יַשֶּׁה בְרֵעֵהוּ
  choice: தன் அயலானுக்குக் கொடுத்த கடன்
  rationale: இந்த வடிவம் ஒருவருக்குக் கடன் கொடுத்து அவரைக் கடனாளியாக்கிய செயலைக் குறிக்கிறது.
- source_word: לֹא יִגֹּשׂ
  choice: கடனைத் திருப்பிச் செலுத்தும்படி வற்புறுத்தக் கூடாது
  rationale: இந்த வினை கடனை வசூலிக்க அழுத்தம் கொடுப்பதையோ செலுத்தும்படி கண்டிப்பாகக் கோருவதையோ குறிக்கிறது; தமிழில் பொருள் தெளிவதற்காக கடன் சூழல் வெளிப்படையாகக் கூறப்பட்டுள்ளது.
- source_word: רֵעֵהוּ
  choice: அயலான்
  rationale: சமூக மற்றும் உடன்படிக்கைச் சூழலில் ரֵעַ என்பதற்கான மரபான, புரிந்துகொள்ளத்தக்க தமிழ் இணைச்சொல்.
- source_word: אָחִיו
  choice: தன் சகோதரன்
  rationale: மூலத்தில் உள்ள ஆண்பால் ஒருமைச் சொல்லைத் தக்கவைக்கிறது; இங்கு அது உடன்படிக்கைச் சமூகத்தைச் சேர்ந்த ஒருவரையும் குறிக்கலாம் என்பதை அடிக்குறிப்பு விளக்குகிறது.
- source_word: כִּי קָרָא
  choice: அறிவிக்கப்பட்டுள்ளது
  rationale: எபிரெயத்தில் செய்பவர் குறிப்பிடப்படாத நிறைவுற்ற வினை உள்ளது; தமிழின் செயப்பாட்டு வடிவம் பொது அறிவிப்பின் பொருளை இயல்பாகத் தருகிறது.
- source_word: לַיהוָה
  choice: யாவேக்குரிய
  rationale: לְ முன்னிடைச்சொல் யாவேயோடு உள்ள தொடர்பையோ அவருக்காக அர்ப்பணிக்கப்பட்ட நிலையையோ குறிக்கலாம்; ‘யாவேக்குரிய’ என்பது அந்தத் தொடர்பை அளவுக்கு மீறித் தீர்மானிக்காமல் காக்கிறது.
theological_decisions:
- issue: יהוה என்ற தெய்வீகப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் உடன்படிக்கைப் பெயரான நான்கெழுத்துத் திருப்பெயர் நேரடியாக உள்ளது; அதனை பொதுப் பட்டமாக மாற்றாமல் ‘யாவே’ என்று ஒலிபெயர்க்கப்பட்டுள்ளது.
- issue: אָחִיו என்பதன் சட்ட-சமூகப் பொருள்
  choice: சகோதரன்
  alternative: சக இஸ்ரவேலன்
  rationale: மூலத்தின் ஆண்பால் உறவுச் சொல்லையும் அதன் உடன்படிக்கைச் சாயலையும் முதன்மை உரை தக்கவைக்கிறது; அதன் விரிந்த சமூகப் பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- issue: לַיהוָה என்பதன் உறவு
  choice: யாவேக்குரிய விடுவிப்பு
  alternative: யாவேக்காக விடுவிப்பு
  rationale: לְ என்பது ‘யாவேக்காக’, ‘யாவேக்கு’, அல்லது அவரோடு தொடர்புடையது என்ற நுணுக்கங்களைத் தரலாம். ‘யாவேக்குரிய’ என்பது விடுவிப்பின் புனித/உடன்படிக்கைத் தொடர்பைத் தக்கவைத்து ஒரு நுணுக்கத்தை மட்டும் கட்டாயப்படுத்துவதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், சட்டக் கட்டளையின் கண்ணியமான தொனியைப் பேணியபடி பொதுவாசகருக்குத் தெளிவாக வடிவமைக்கப்பட்டுள்ளது. ‘வற்புறுத்தக் கூடாது’ என்பது கடன் வசூலிக்க அழுத்தம் கொடுப்பதை இயல்பாகச் சொல்கிறது; ‘யாவேக்குரிய’ என்பது மூல முன்னிடைச்சொல்லின் நுணுக்கத்தைத் திறந்தவாறே வைக்கிறது.
