  yaml_path: translation/ot/deuteronomy/015/004.yaml
  text: However[a], there should be no poor among you, because Yahweh will surely bless you in the land that Yahweh your God is giving you as an inheritance to possess,
translation:
  language: ta
  text: ஆயினும்[a], உன் நடுவில் ஏழை எவரும் இருக்கக் கூடாது. ஏனெனில், நீ உரிமையாக்கிக்கொள்ளும்படி உன் கடவுளாகிய யாவே உனக்குப் பரம்பரை உரிமையாகக் கொடுக்கிற நாட்டில் அவர் உன்னை நிச்சயமாக ஆசீர்வதிப்பார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘எனினும்’, ‘இருப்பினும்’, ‘ஆனால்’ அல்லது ‘தவிர’ என்றும் மொழிபெயர்க்கலாம்; எபிரெயச் சொல் முந்தைய அறிவுறுத்தலுக்குத் தகுதிப்படுத்தும் வரம்பைச் சேர்க்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶפֶס
  choice: ஆயினும்
  rationale: முந்தைய கடன் விடுவிப்பு அறிவுறுத்தலுக்கு ஒரு வரம்பையோ தகுதிப்படுத்தலையோ அறிமுகப்படுத்தும் உரையாடல் திருப்பத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: אֶבְיוֹן
  choice: ஏழை
  rationale: பொருளாதார நெருக்கடியில் உள்ள ஏழை அல்லது தேவையுள்ள நபரைக் குறிக்கிறது; இங்கு ‘ஏழை’ என்பது இயல்பான, பரந்த பொருளுடைய சொல்.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: யாவேயின் ஆசீர்வாதமே முந்தைய கூற்றுக்கான காரணம் என்பதைத் தெளிவாகக் காட்டுகிறது.
- source_word: בָרֵךְ יְבָרֶכְךָ
  choice: உன்னை நிச்சயமாக ஆசீர்வதிப்பார்
  rationale: வினையெச்சப் பெயருடன் வினைச்சொல் மீண்டும் வருவதால் உண்டாகும் எபிரெய வலியுறுத்தலை, கூடுதல் கருத்தைச் சேர்க்காமல் தமிழில் வெளிப்படுத்துகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைத்தலைப்பால் மாற்றாமல், எபிரெய நான்கெழுத்துத் திருப்பெயரைத் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: נֹתֵן
  choice: கொடுக்கிற
  rationale: நிகழ்ந்துகொண்டிருக்கும் அல்லது உறுதியாக அண்மித்துள்ள கொடையைச் சுட்டும் எபிரெயப் பங்கேற்புவினையின் பொருளைச் சூழலுக்கேற்றவாறு தருகிறது.
- source_word: נַחֲלָה
  choice: பரம்பரைச் சொத்து
  rationale: ஒதுக்கிக் கொடுக்கப்பட்ட நில உரிமையைக் குறிக்கும் உடன்படிக்கைச் சொல்லின் சட்ட மற்றும் இறையியல் ஒலிப்புகளைப் பாதுகாக்கிறது.
- source_word: לְרִשְׁתָּהּ
  choice: உரிமையாக்கிக்கொள்ளும்படி
  rationale: நிலத்தைக் கைப்பற்றி உடைமையாக்குதல் அல்லது சுதந்தரித்தல் என்ற ירשׁ வேர்ச்சொல்லின் கருத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூல வசனம் நான்கெழுத்துத் திருப்பெயரை நேரடியாகப் பயன்படுத்துவதால், அதை ஒரு பட்டத்தால் மாற்றாமல் தனிப்பட்ட உடன்படிக்கைப் பெயராக ஒலிபெயர்க்கிறது.
- issue: ஏழை எவரும் இருக்கக் கூடாது என்ற கூற்றுக்கும் ஆசீர்வாத வாக்குறுதிக்கும் உள்ள தொடர்பு
  choice: கட்டளையையோ இலட்சியத்தையோ குறிக்கும் ‘இருக்கக் கூடாது’; அதற்கான காரணமாக யாவேயின் உறுதியான ஆசீர்வாதம்
  alternative: எந்த ஏழையும் நிச்சயமாக இருக்கமாட்டார்
  rationale: לֹא יִהְיֶה என்பதிலுள்ள கட்டளை/வாக்குறுதி சார்ந்த இயல்பான பதற்றத்தை முற்றிலும் தீர்த்துவிடாமல் வைத்திருக்கிறது; அடுத்துள்ள காரணவாக்கியம் ஆசீர்வாதத்தின் உறுதியைத் தனியே வெளிப்படுத்துகிறது.
translation_notes:
  register: நவீன தரத் தமிழில் இயல்பான, மரியாதைமிக்க நடையைப் பயன்படுத்துகிறது. எபிரெய மூலத்திலுள்ள இரண்டாம் நபர் ஒருமையை ‘உன்/உன்னை’ எனப் பாதுகாக்கிறது; அது இங்கு இஸ்ரவேல் மக்களை ஒருமைக் கூட்டாக விளிக்கிறது. வசனம் தனியாக வாசிக்கத் தெளிவாக இருக்க முற்றுப்புள்ளியுடன் அமைக்கப்பட்டுள்ளது.
