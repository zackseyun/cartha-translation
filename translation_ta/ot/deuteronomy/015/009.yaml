review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the warning, the impending seventh year of release, the poor covenant brother, the appeal to Yahweh, and resulting sin. However, “அவனுக்கு எதுவும் கொடுக்காமல் இருந்துவிடாதே” is a double-negative construction that naturally means ‘do not fail to give him anything,’ reversing the Hebrew warning not to withhold aid. The main text must state the prohibited withholding unambiguously.
  naturalness: The register is generally modern and clear. Recasting the warning as a unified prohibition avoids the ambiguous double negative. The literal idiom note is improved to idiomatic Tamil, and the malformed alternative “கடன் ரத்தின்” is corrected.
  terminology: “யாவே,” “விடுவிப்பின் ஆண்டு,” “சகோதரன்,” and “பாவம்” are appropriate. “வறியவனாகிய” is slightly more natural than “வறியவனான” in this formal context. The footnote preserves the cultural sense of ‘brother’ without restricting it to a biological sibling.
  issues:
  - severity: high
    issue: The phrase “அவனுக்கு எதுவும் கொடுக்காமல் இருந்துவிடாதே” reverses the intended prohibition through a Tamil double negative.
    rationale: The Hebrew says ‘and you do not give him.’ In Tamil, ‘கொடுக்காமல் ... இருந்துவிடாதே’ ordinarily instructs the reader not to refrain from giving, rather than warning against withholding.
  - severity: medium
    issue: Footnote c contains the malformed expression “கடன் ரத்தின் ஆண்டு.”
    rationale: It should be “கடன் ரத்து ஆண்டு” (or more naturally, “கடன் ரத்து செய்யும் ஆண்டு”) to communicate cancellation/remission accurately.
  - severity: low
    issue: Footnote b’s literal rendering is grammatically incomplete in Tamil.
    rationale: “உன் கண் அவன்மேல் தீயதாயிருக்கும்” more clearly represents the Hebrew idiom while retaining its literal form.
  revised_text: “விடுவிப்பின் ஆண்டாகிய[c] ஏழாம் ஆண்டு நெருங்கிவிட்டது” என்று உன் உள்ளத்தில் தீய எண்ணம் தோன்றவும், வறியவனாகிய உன் சகோதரனை[a] கஞ்சத்தனமாக நோக்கி[b] அவனுக்கு எதுவும் கொடுக்காமல் போகவும் கூடாதபடி எச்சரிக்கையாக இரு. அவன் உனக்கு எதிராக யாவேவிடம் முறையிட்டால், அது உனக்குப் பாவமாகும்.
  revised_footnotes:
  - marker: a
