revisions:
- from: “விடுவிப்பின் ஆண்டாகிய[c] ஏழாம் ஆண்டு நெருங்கிவிட்டது” என்று உன் உள்ளத்தில் ஒரு தீய எண்ணம் எழாதபடி எச்சரிக்கையாக இரு. வறியவனான உன் சகோதரனை[a] நீ கஞ்சத்தனமாகப் பார்த்து[b], அவனுக்கு எதுவும் கொடுக்காமல் இருந்துவிடாதே. அப்படி இருந்தால், அவன் உனக்கு எதிராக யாவேவிடம் முறையிடுவான்; அது உனக்குப் பாவமாகும்.
  to: “விடுவிப்பின் ஆண்டாகிய[c] ஏழாம் ஆண்டு நெருங்கிவிட்டது” என்று உன் உள்ளத்தில் தீய எண்ணம் தோன்றவும், வறியவனாகிய உன் சகோதரனை[a] கஞ்சத்தனமாக நோக்கி[b] அவனுக்கு எதுவும் கொடுக்காமல் போகவும் கூடாதபடி எச்சரிக்கையாக இரு. அவன் உனக்கு எதிராக யாவேவிடம் முறையிட்டால், அது உனக்குப் பாவமாகும்.
  rationale: The revision corrects the main-text negation so that it faithfully warns against withholding assistance. It also corrects the malformed cancellation alternative and makes the literal idiom footnote grammatically complete. The conditional consequence (‘if he appeals’) reflects the Hebrew warning sequence naturally without overstating whether the appeal is certain.
