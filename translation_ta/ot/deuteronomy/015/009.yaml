  text: הִשָּׁ֣מֶר לְ/ךָ֡ פֶּן יִהְיֶ֣ה דָבָר֩ עִם לְבָבְ/ךָ֨ בְלִיַּ֜עַל לֵ/אמֹ֗ר קָֽרְבָ֣ה שְׁנַֽת הַ/שֶּׁבַע֮ שְׁנַ֣ת הַ/שְּׁמִטָּה֒ וְ/רָעָ֣ה עֵֽינְ/ךָ֗ בְּ/אָחִ֨י/ךָ֙ הָֽ/אֶבְי֔וֹן וְ/לֹ֥א תִתֵּ֖ן ל֑/וֹ וְ/קָרָ֤א עָלֶ֨י/ךָ֙ אֶל יְהוָ֔ה וְ/הָיָ֥ה בְ/ךָ֖ חֵֽטְא־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/015/009.yaml
  text: Be careful lest there be in your heart a wicked thought[a], saying, ‘The seventh year, the year of release, is near,’ and your eye be evil toward your poor brother and you give him nothing; then he may cry out against you to Yahweh[c][b], and it will be sin in you.
translation:
  language: ta
  text: “விடுவிப்பின் ஆண்டாகிய[c] ஏழாம் ஆண்டு நெருங்கிவிட்டது” என்று உன் உள்ளத்தில் தீய எண்ணம் தோன்றவும், வறியவனாகிய உன் சகோதரனை[a] கஞ்சத்தனமாக நோக்கி[b] அவனுக்கு எதுவும் கொடுக்காமல் போகவும் கூடாதபடி எச்சரிக்கையாக இரு. அவன் உனக்கு எதிராக யாவேவிடம் முறையிட்டால், அது உனக்குப் பாவமாகும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இங்கே “சகோதரன்” என்பது உடன்பிறந்தவனை மட்டும் அல்லாமல், உடன்படிக்கைச் சமூகத்தைச் சேர்ந்த ஒருவரையும் குறிக்கலாம்.
    reason: cultural_note
  - marker: b
    text: நேரடியாக, “உன் கண் அவன்மேல் தீயதாயிருக்கும்.” இது தேவையிலிருப்பவருக்கு உதவ மனமில்லாமல் கஞ்சத்தனமாக இருப்பதைக் குறிக்கும் எபிரெய மரபுத்தொடர்.
    reason: lexical_alternative
  - marker: c
    text: “விடுவிப்பின் ஆண்டு” என்பதை “கடன் தள்ளுபடியின் ஆண்டு” அல்லது “கடன் ரத்து செய்யும் ஆண்டு” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִשָּׁמֶר לְךָ
  choice: எச்சரிக்கையாக இரு
  rationale: தன்னைக் காத்துக்கொள்ளும்படி எச்சரிக்கும் நிபால் கட்டளையின் வலிமையை இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: דָבָר עִם לְבָבְךָ בְלִיַּעַל
  choice: உன் உள்ளத்தில் ஒரு தீய எண்ணம்
  rationale: דָבָר என்பதன் பரந்த பொருள், உள்ளம் மற்றும் தொடர்ந்து வரும் ‘என்று’ என்ற சொற்களால் இங்கு எண்ணம் அல்லது உள்நோக்கத்தைக் குறிக்கிறது; בְלִיַּעַל ஒழுக்கக்கேட்டைச் சுட்டுகிறது, தனிப்பெயர் அல்ல.
- source_word: שְׁנַת הַשְּׁמִטָּה
  choice: விடுவிப்பின் ஆண்டு
  rationale: ஏழாம் ஆண்டுடன் தொடர்புடைய விடுவித்தல் அல்லது கடன் நீக்கத்தைச் சுருக்கமாகக் குறிக்கிறது; ‘கடன் தள்ளுபடி’ என்று மட்டும் கூறி பொருளை மிகையாகக் குறுக்கவில்லை.
- source_word: וְרָעָה עֵינְךָ
  choice: நீ கஞ்சத்தனமாகப் பார்த்து
  rationale: ‘உன் கண் தீயதாகும்’ என்ற எபிரெய மரபுத்தொடரின் பொருளான உதவ மனமில்லாத கஞ்சத்தனத்தை இயல்பான தமிழில் தெரிவிக்கிறது; நேரடி வடிவம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: בְּאָחִיךָ הָאֶבְיוֹן
  choice: வறியவனான உன் சகோதரனை
  rationale: אָחִיךָ என்பதன் உடன்படிக்கைச் சமூகத்துக்குரிய குடும்ப மொழியை ‘சகோதரன்’ எனப் பாதுகாத்து, אֶבְיוֹן என்பதை ‘வறியவன்’ எனத் தெளிவாகக் கூறுகிறது.
- source_word: וְלֹא תִתֵּן לוֹ
  choice: அவனுக்கு எதுவும் கொடுக்காமல்
  rationale: எதைக் கொடுப்பது என்பதை மூலவசனம் வெளிப்படையாகக் கூறாததால், கடன் என்று சேர்க்காமல் மறுப்பின் நடைமுறை விளைவைத் தருகிறது.
- source_word: וְקָרָא עָלֶיךָ אֶל יְהוָה
  choice: அவன் உனக்கு எதிராக யாவேவிடம் முறையிடுவான்
  rationale: கடவுளிடம் நீதிக்காக எழுப்பப்படும் முறையீட்டின் நுணுக்கத்தையும் எபிரெய தொடர் வினையின் விளைவு வலிமையையும் காக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: திருப்பெயரான நான்கு எழுத்துப் பெயரை ஒரு பட்டப்பெயராக மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: וְהָיָה בְךָ חֵטְא
  choice: அது உனக்குப் பாவமாகும்
  rationale: மறுப்பினால் அந்த நபர்மேல் பாவப்பொறுப்பு ஏற்படுகிறது என்ற எபிரெய தொடரை இயல்பாகத் தருகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் பொதுப் பட்டப்பெயர் அல்லாமல் இறைவனின் தனிப்பெயர் நேரடியாக இருப்பதால், அதைப் பெயராகவே ஒலிபெயர்த்துள்ளது.
- issue: ‘தீய கண்’ என்ற எபிரெய மரபுத்தொடர்
  choice: முதன்மை உரையில் ‘கஞ்சத்தனமாகப் பார்த்து’; நேரடி வடிவம் அடிக்குறிப்பில்
  alternative: உன் கண் தீயதாகி
  rationale: தமிழ் வாசகர் உடனடியாகப் பொருளறியும்படி மரபுத்தொடரின் செயற்பொருள் தரப்படுகிறது; அதே நேரத்தில் மூலத்தின் இலக்கிய வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: אָחִיךָ என்பதன் சமூகப் பொருள்
  choice: உன் சகோதரன்
  alternative: உன் இனத்தவன் / சக இஸ்ரவேலன்
  rationale: மூலத்தின் குடும்ப மற்றும் உடன்படிக்கை மொழியைப் பாதுகாக்கிறது; இது உடன்பிறந்தவனை மட்டும் குறிக்க வேண்டியதில்லை என்பதை அடிக்குறிப்பு தெளிவுபடுத்துகிறது.
- issue: שְׁמִטָּה என்பதன் வரம்பு
  choice: விடுவிப்பு
  alternative: கடன் தள்ளுபடி / கடன் ரத்து
  rationale: உபாகமம் 15-ன் சூழலில் கடனிலிருந்து விடுவிப்பைக் குறித்தாலும், மூலச்சொல்லின் ‘விடுதல்’ சார்ந்த பரப்பை தேவையின்றிக் குறுக்காமல் வைத்துள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகருக்குப் புரியும் வகையில் மரியாதையும் சட்டப்பூர்வ எச்சரிக்கையின் தீவிரமும் காக்கப்பட்டுள்ளன. ‘யாவே’ என்பது இறைப்பெயரின் தமிழ் ஒலிபெயர்ப்பு. மூலத்தின் நீண்ட எச்சரிக்கைத் தொடர் வாசிப்புத் தெளிவுக்காக மூன்று வாக்கியங்களாகப் பிரிக்கப்பட்டுள்ளது.
