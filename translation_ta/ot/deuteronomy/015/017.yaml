  text: וְ/לָקַחְתָּ֣ אֶת הַ/מַּרְצֵ֗עַ וְ/נָתַתָּ֤ה בְ/אָזְנ/וֹ֙ וּ/בַ/דֶּ֔לֶת וְ/הָיָ֥ה לְ/ךָ֖ עֶ֣בֶד עוֹלָ֑ם וְ/אַ֥ף לַ/אֲמָתְ/ךָ֖ תַּעֲשֶׂה כֵּֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/015/017.yaml
  text: then you shall take the awl and put it through his ear and into the door[a], and he shall be your servant permanently. And you shall do the same for your female servant.
translation:
  language: ta
  text: அப்போது நீ குத்தூசியை எடுத்து, அவனுடைய காதின் வழியாகக் கதவில் குத்த வேண்டும்; அவன் உனக்கு வாழ்நாள் முழுவதும் அடிமையாக இருப்பான்.[a] உன் பெண் அடிமைக்கும் அவ்வாறே செய்ய வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நிரந்தரமாக.” எபிரெயச் சொல் “என்றென்றும்” என்றும் மொழிபெயர்க்கப்படலாம்; இச்சட்டச் சூழலில் அது “வாழ்நாள் முழுவதும்” எனப் பொருள்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּרְצֵעַ
  choice: துளையிடும் ஊசி
  rationale: மַרְצֵעַ என்பது துளையிடப் பயன்படும் கூர்மையான கருவி. தமிழில் கருவியின் செயலைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: וְנָתַתָּה בְאָזְנוֹ וּבַדֶּלֶת
  choice: அவனுடைய காதின் வழியாகக் கதவுக்குள் செலுத்த வேண்டும்
  rationale: எபிரெயச் சொற்றொடர் கருவியை அவனுடைய காதிலும் கதவிலும் செலுத்துவதைக் கூறுகிறது; சடங்கின் உடல் செயலை மிகைப்படுத்தாமல் தெளிவாக்குகிறது.
- source_word: עֶבֶד
  choice: அடிமை
  rationale: இச்சட்டச் சூழலில் கட்டுப்பட்ட சமூக-சட்ட நிலையே முன்னிலைப்படுவதால், மென்மையான ‘வேலைக்காரன்’ என்பதற்குப் பதிலாக ‘அடிமை’ பொருத்தமானது.
- source_word: עוֹלָם
  choice: வாழ்நாள் முழுவதும்
  rationale: இங்கு עוֹלָם என்பது முடிவற்ற நித்தியத்தைவிட, சட்டச் சூழலில் வாழ்நாள் முழுவதும் நீடிக்கும் நிலையைக் குறிக்கிறது.
- source_word: אֲמָתְךָ
  choice: உன் பெண் அடிமை
  rationale: אָמָה என்பது பெண் அடிமை அல்லது பணிப்பெண்ணைக் குறிக்கும்; இணையான עֶבֶד என்பதோடு சமூக-சட்ட நிலையைச் சீராகப் பிரதிபலிக்கிறது.
- source_word: תַּעֲשֶׂה כֵּן
  choice: அவ்வாறே செய்ய வேண்டும்
  rationale: அதே முறையைப் பெண் அடிமைக்கும் பயன்படுத்த வேண்டும் என்ற எபிரெய வழக்குச் சொல்லை இயல்பாக வழங்குகிறது.
theological_decisions:
- issue: இஸ்ரவேலரின் அடிமைச் சட்டத்தில் עֶבֶד / אָמָה சொற்களின் மொழிபெயர்ப்பு
  choice: ‘அடிமை’ / ‘பெண் அடிமை’
  alternative: ‘வேலைக்காரன்’ / ‘பணிப்பெண்’
  rationale: இந்த வசனம் சட்டச் சடங்கால் உறுதிப்படுத்தப்படும் கட்டுப்பட்ட நிலையைப் பற்றியது. ‘அடிமை’ என்பது அந்த சமூக-சட்ட வலிமையை மறைக்காமல் தருகிறது; பின்னாளைய எந்தக் கோட்பாட்டையும் இதில் சேர்ப்பதில்லை.
- issue: עוֹלָם என்பதன் கால அளவு
  choice: ‘வாழ்நாள் முழுவதும்’ என்று உரையில் கொடுத்து, மாற்று மொழிபெயர்ப்பைக் குறிப்பில் தருதல்
  alternative: ‘என்றென்றும்’ அல்லது ‘நிரந்தரமாக’
  rationale: சட்டச் சூழலில் மனிதனுடைய சேவைநிலையின் நீடிப்பே நோக்கம்; முடிவற்ற காலத்தைத் திட்டவட்டமாகக் கூறுவது பொருளை மிகைப்படுத்தலாம். இருப்பினும் எபிரெயச் சொல்லின் பரந்த நீடித்தகால நுணுக்கத்தை அடிக்குறிப்பு பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சட்ட மொழியின் கண்ணியத்தையும் கட்டளையின் நேரடித்தன்மையையும் காக்கும் நடை. ‘துளையிடும் ஊசி’ பொதுவாசகருக்குப் புரியும் வகையில் கருவியை விளக்குகிறது; ‘அடிமை’ என்ற சொல் மூலத்தின் கடினமான சமூக உண்மையை மென்மைப்படுத்தாமல் வைத்திருக்கிறது.
