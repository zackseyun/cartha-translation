revisions:
- from: நீ அவனை உன்னிடமிருந்து விடுதலையாக அனுப்பும்போது[a], அவனை வெறுங்கையுடன் அனுப்பாதே.
  to: நீ அவனை உன்னிடமிருந்து விடுதலை செய்து அனுப்பும்போது[a], அவனை வெறுங்கையுடன் அனுப்பாதே.
