source:
  edition: WLC
  text: וְ/כִֽי תְשַׁלְּחֶ֥/נּוּ חָפְשִׁ֖י מֵֽ/עִמָּ֑/ךְ לֹ֥א תְשַׁלְּחֶ֖/נּוּ רֵיקָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/015/013.yaml
  text: And when you send him away free from you[a], you shall not send him away empty-handed.
translation:
  language: ta
  text: நீ அவனை உன்னிடமிருந்து விடுதலை செய்து அனுப்பும்போது[a], அவனை வெறுங்கையுடன் அனுப்பாதே.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நீ அவனை உன்னிடமிருந்து விடுதலை செய்து அனுப்பினால்.” எபிரெய இணைப்புச் சொல் “என்றால்” என்ற நிபந்தனைப் பொருளிலோ “போது” என்ற காலப் பொருளிலோ புரிந்துகொள்ளப்படலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: וְ/כִֽי
  choice: அனுப்பும்போது
  rationale: இணைப்புச் சொல் நிபந்தனைப் பொருளாகவும் காலப் பொருளாகவும் அமையலாம். இச்சட்டச் சூழலில் எதிர்பார்க்கப்படும் நிகழ்வைக் குறிக்கும் காலப் பொருள் இயல்பாக இருப்பதால் ‘போது’ என மொழிபெயர்க்கப்பட்டது; ‘என்றால்’ என்ற மாற்று அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: תְשַׁלְּחֶנּוּ
  choice: அவனை ... அனுப்பு
  rationale: שלח என்பதன் பியேல் வடிவம் இங்கு ஒருவரை அனுப்பிவிடுதல் அல்லது விடுவித்தல் என்னும் பொருள் தருகிறது. எபிரெய உரையில் இருமுறை வரும் ஒரே வினைச்சொல்லைப் பிரதிபலிக்க இரு இடங்களிலும் ‘அனுப்பு’ பயன்படுத்தப்பட்டது.
- source_word: חָפְשִׁי
  choice: விடுதலையாக
  rationale: அடிமை அல்லது கடன்பணி நிலையிலிருந்து விடுபட்டிருப்பதைக் குறிக்கும் חָפְשִׁי என்ற பெயரடையின் பொருளை, தமிழ் வாக்கிய அமைப்புக்கு இயல்பாக வினையடையாக வழங்குகிறது.
- source_word: מֵעִמָּךְ
  choice: உன்னிடமிருந்து
  rationale: சொல்லுக்குச் சொல் ‘உன்னோடு இருந்த நிலையிலிருந்து’ என்ற கருத்தைக் கொண்டது. ‘உன் பணியிலிருந்து’ போன்ற விளக்கத்தைச் சேர்க்காமல் எபிரெயச் சொல்லின் பொதுவான தன்மை காக்கப்படுகிறது.
- source_word: לֹא תְשַׁלְּחֶנּוּ
  choice: அவனை ... அனுப்பாதே
  rationale: எதிர்மறை imperfect வடிவத்தின் சட்டப்பூர்வத் தடையை நவீன தமிழில் நேரடியான கட்டளை நடையான ‘அனுப்பாதே’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: רֵיקָם
  choice: வெறுங்கையுடன்
  rationale: ‘வெறுமையாக’ அல்லது ‘ஒன்றுமின்றி’ என்பதே அடிப்படைப் பொருள். விடுதலையின்போது பொருள் வழங்க வேண்டிய சூழலில் ‘வெறுங்கையுடன்’ என்பது தமிழில் இயல்பானதும் துல்லியமானதும் ஆகும்.
