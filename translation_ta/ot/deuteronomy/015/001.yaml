  text: At the end of every seven years you shall make a release[a].
translation:
  language: ta
  text: ஒவ்வொரு ஏழு ஆண்டுகளின் முடிவிலும் நீ ஒரு விடுவிப்பைச் செய்ய வேண்டும்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஒரு கடன் தள்ளுபடியை” அல்லது “ஒரு கடன் நீக்கத்தை.” எபிரெயச் சொல்லான שְׁמִטָּה, ஏழாம் ஆண்டுக்குரிய கடன் சட்டத்தின்படி நடைமுறைப்படுத்தப்படும் விடுவிப்பைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִקֵּץ
  choice: முடிவிலும்
  rationale: מִקֵּץ என்பது ‘முடிவில்/முடிவுற்றபோது’ என்ற காலப் பொருளைக் கொண்டது. ‘முடிவிலும்’ என்பது ஏழாண்டுச் சுழற்சி மீண்டும் மீண்டும் வருவதை அடுத்த சொற்றொடருடன் இயல்பாக வெளிப்படுத்துகிறது; துல்லியமான தருணத்தை தேவையின்றி நிர்ணயிப்பதில்லை.
- source_word: שֶׁבַע שָׁנִים
  choice: ஒவ்வொரு ஏழு ஆண்டுகளின்
  rationale: எபிரெயத்தில் நேரடியாக ‘ஏழு ஆண்டுகள்’ என்றாலும், சட்டச் சூழலில் இது திரும்பத் திரும்ப நிகழும் ஏழாண்டுச் சுழற்சியைக் குறிக்கிறது. ஆகவே ‘ஒவ்வொரு ஏழு ஆண்டுகளின்’ எனத் தமிழில் தெளிவாகவும் இயல்பாகவும் வழங்கப்படுகிறது.
- source_word: תַּעֲשֶׂה
  choice: செயல்படுத்த வேண்டும்
  rationale: עשה என்பதன் அடிப்படைப் பொருள் ‘செய்/உண்டாக்கு’. இங்கு ஒரு சட்ட ஏற்பாட்டை அமலாக்குவது குறிக்கப்படுவதால், ‘செயல்படுத்த வேண்டும்’ என்பது கட்டளையின் வலிமையையும் இயல்பான தமிழ் நடையையும் காக்கிறது.
- source_word: שְׁמִטָּה
  choice: ஒரு விடுவிப்பு
  rationale: שְׁמִטָּה என்பது விடுதல் அல்லது தள்ளுபடி செய்தல் என்ற பரந்த பொருளைக் கொண்டது; இச்சூழலில் ஏழாம் ஆண்டில் கடனிலிருந்து விடுவிப்பதைக் குறிக்கிறது. அடுத்த வசனங்கள் அதன் தன்மையை விளக்க இடமளிக்கும் வகையில் ‘விடுவிப்பு’ என்ற பரந்த சொல் தேர்ந்தெடுக்கப்பட்டது.
