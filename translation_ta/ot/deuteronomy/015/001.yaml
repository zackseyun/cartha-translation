  register: நவீனத் தரத் தமிழில், சட்டக் கட்டளையின் கண்ணியமான தொனியைத் தக்கவைத்து, பொதுவாசகர்களுக்கு எளிதில் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. ‘விடுவிப்பு’ என்ற சொல் மூலத்தின் பொருள் அகலத்தையும் அடுத்த வசனங்களில் வரும் விளக்கத்திற்கான இடத்தையும் காக்கிறது.
