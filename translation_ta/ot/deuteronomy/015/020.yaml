  rationale: மூலவசனம் இறைத்தனிப்பெயரை நேரடியாகப் பயன்படுத்துகிறது. பட்டப்பெயரான ‘கர்த்தர்’ என்று மாற்றாமல் பெயராகவே வழங்கப்பட்டுள்ளது. தமிழில் பரவலாக அறியப்படும் எழுத்துப்பெயர்ப்பான ‘யெகோவா’ தேர்ந்தெடுக்கப்பட்டுள்ளது; ‘யாவே’ என்பது மாற்று ஒலிபெயர்ப்பு.
translation_notes:
  register: நவீனத் தரத் தமிழ்; மரியாதையும் சட்ட அறிவுறுத்தலுக்குரிய உறுதியும் கொண்ட, பொதுவாசகர்களுக்கு எளிதில் புரியும் நடை. எபிரெய வசனத்தின் இறுதியில் வரும் ‘நீயும் உன் வீட்டாரும்’ என்பதைத் தமிழின் இயல்பான வாக்கிய ஒழுங்குக்காகத் தொடக்கத்தில் வைத்துள்ளது.
