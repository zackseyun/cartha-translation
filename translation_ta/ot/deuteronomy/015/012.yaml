review_pass:
  verdict: revise
  source_fidelity: The draft accurately reflects the passive ‘is sold,’ six years of service, the seventh-year release, and the Hebrew masculine-singular release suffix. However, ‘விடுதலையாக அனுப்பிவிட’ is not an idiomatic or precise Tamil expression for sending someone away as a free person.
  naturalness: The sentence is generally clear, but ‘சுதந்திரமாக உன்னிடமிருந்து அனுப்பிவிட வேண்டும்’ is more natural legal Tamil and better expresses release from the addressee’s service/household. ‘பணிசெய்து வந்தால்’ gives a smoother temporal-legal sense than a bare conditional.
  terminology: ‘சகோதரன்,’ ‘எபிரெய ஆண்/பெண்,’ and ‘பணிசெய்’ appropriately preserve the source’s familial, ethnic-gendered, and service terminology. The footnote correctly explains the generic force of the Hebrew masculine singular.
  issues:
  - severity: medium
    issue: ‘விடுதலையாக அனுப்பிவிட வேண்டும்’ is awkward and semantically imprecise Tamil.
    rationale: חָפְשִׁי denotes free status in a manumission context. ‘சுதந்திரமாக ... அனுப்பிவிட வேண்டும்’ naturally conveys that status while retaining the ‘send away’ sense of תְּשַׁלְּחֶנּוּ.
  - severity: low
    issue: The service clause can read as a simple hypothetical condition rather than the stipulated completed term.
    rationale: ‘ஆறு ஆண்டுகள் உனக்குப் பணிசெய்து வந்தால்’ is idiomatic in a legal instruction and clearly connects the six-year service period with the mandated seventh-year release.
  revised_text: உன் சகோதரன்—எபிரெய ஆணோ எபிரெயப் பெண்ணோ—உனக்கு விற்கப்பட்டு, ஆறு ஆண்டுகள் உனக்குப் பணிசெய்து வந்தால், ஏழாம் ஆண்டில் அவனை[a] உன்னிடமிருந்து சுதந்திரமாக அனுப்பிவிட வேண்டும்.
