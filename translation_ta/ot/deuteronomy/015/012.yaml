  to: உன் சகோதரன்—எபிரெய ஆணோ எபிரெயப் பெண்ணோ—உனக்கு விற்கப்பட்டு, ஆறு ஆண்டுகள் உனக்குப் பணிசெய்து வந்தால், ஏழாம் ஆண்டில் அவனை[a] உன்னிடமிருந்து சுதந்திரமாக அனுப்பிவிட வேண்டும்.
