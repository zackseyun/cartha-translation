source:
  edition: WLC
  text: כִּֽי יִמָּכֵ֨ר לְ/ךָ֜ אָחִ֣י/ךָ הָֽ/עִבְרִ֗י א֚וֹ הָֽ/עִבְרִיָּ֔ה וַ/עֲבָֽדְ/ךָ֖ שֵׁ֣שׁ שָׁנִ֑ים וּ/בַ/שָּׁנָה֙ הַ/שְּׁבִיעִ֔ת תְּשַׁלְּחֶ֥/נּוּ חָפְשִׁ֖י מֵ/עִמָּֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/015/012.yaml
  text: If your brother[a], a Hebrew man or a Hebrew woman, is sold to you and serves you six years, then in the seventh year you shall send him out free from you.
translation:
  language: ta
  text: உன் சகோதரன்—எபிரெய ஆணோ எபிரெயப் பெண்ணோ—உனக்கு விற்கப்பட்டு, ஆறு ஆண்டுகள் உனக்குப் பணிசெய்து வந்தால், ஏழாம் ஆண்டில் அவனை[a] உன்னிடமிருந்து சுதந்திரமாக அனுப்பிவிட வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் இங்கு ஆண்பால் ஒருமை வடிவம், ‘அவனை அனுப்பிவிடு’ என்று வருகிறது. முன்பு எபிரெய ஆணும் பெண்ணும் குறிப்பிடப்பட்டிருப்பதால், விடுவிக்கப்படும் நபர் ஆணாக இருந்தாலும் பெண்ணாக இருந்தாலும் இந்தச் சட்டம் பொருந்தும்.
    reason: மூலத்தின் பாலின இலக்கண வடிவத்தையும் அதன் உள்ளடக்கப் பொருந்துதலையும் தெளிவுபடுத்துதல்
lexical_decisions:
- source_word: יִמָּכֵר
  choice: உனக்கு விற்கப்பட்டு
  rationale: நிஃபால் வடிவின் செயப்பாட்டு பொருளை நேரடியாகப் பிரதிபலிக்கிறது; அவர் தம்மையே விற்றாரா அல்லது வேறொருவரால் விற்கப்பட்டாரா என்பதைத் தீர்மானிக்காமல் விடுகிறது.
- source_word: אָחִיךָ
  choice: உன் சகோதரன்
  rationale: உடன்படிக்கைச் சமூகத்தின் குடும்ப உறவு மொழியை ‘சக நாட்டவர்’ என்று பொதுமைப்படுத்தாமல் காக்கிறது.
- source_word: הָעִבְרִי ... הָעִבְרִיָּה
  choice: எபிரெய ஆணோ எபிரெயப் பெண்ணோ
  rationale: மூலத்தில் அடிமைக்கான வழக்கமான சொற்கள் அல்லாமல், இனத்தையும் பாலினத்தையும் குறிக்கும் ஆண்பால் மற்றும் பெண்பால் வடிவங்கள் வருகின்றன; அதையே தெளிவாகப் பிரதிபலிக்கிறது.
- source_word: וַעֲבָדְךָ
  choice: உனக்குப் பணிசெய்தால்
  rationale: עבד இங்கு பெறுநருக்குச் செய்யப்படும் பணி அல்லது சேவையைக் குறிக்கிறது; சட்டச் சூழலுக்குப் பொருத்தமான இயல்பான தமிழ்.
- source_word: שֵׁשׁ שָׁנִים
  choice: ஆறு ஆண்டுகள்
  rationale: எண்ணிக்கைக் குறிப்பின் நேரடியான மொழிபெயர்ப்பு.
- source_word: וּבַשָּׁנָה הַשְּׁבִיעִת
  choice: ஏழாம் ஆண்டில்
  rationale: ஆறு ஆண்டு பணிக்காலத்துக்குப் பின் நிகழ வேண்டிய விடுதலையைத் தெளிவாகக் குறிக்கிறது.
- source_word: תְּשַׁלְּחֶנּוּ
  choice: அவனை அனுப்பிவிட வேண்டும்
  rationale: שלח என்பதன் ‘அனுப்பு’ என்ற உருவகத்தைத் தக்கவைக்கிறது; எபிரெய ஆண்பால் ஒருமைப் பின்னொட்டை ‘அவனை’ எனக் காட்டுகிறது.
- source_word: חָפְשִׁי
  choice: விடுதலையாக
  rationale: கட்டுப்பட்ட பணிநிலையிலிருந்து விடுபட்ட சுதந்திர நிலையைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: מֵעִמָּךְ
  choice: உன்னிடமிருந்து
  rationale: ‘உன்னோடு இருப்பதிலிருந்து’ என்ற மூல அமைப்புக்கு நெருக்கமாக இருந்து, அந்த நபர் எஜமானின் அதிகாரம் அல்லது பணியிலிருந்து அனுப்பப்படுவதை உணர்த்துகிறது.
theological_decisions:
- issue: ஆண், பெண் இருவரையும் குறிப்பிட்ட பின் வரும் ஆண்பால் ஒருமைச் சுட்டுப்பெயர்
  choice: முதன்மை உரையில் ‘அவனை’ என்று மூலத்தின் ஆண்பால் ஒருமை வடிவத்தைப் பிரதிபலித்து, அதன் பொதுப்பயன்பாட்டை அடிக்குறிப்பில் விளக்குதல்
  alternative: பாலினப் பொதுமையுள்ள ‘அவரை’ அல்லது வெளிப்படையான ‘அவனையோ அவளையோ’ என்பதைக் பயன்படுத்துதல்
  rationale: எபிரெய உரை ஆணையும் பெண்ணையும் வெளிப்படையாகக் குறிப்பிட்டபோதிலும், விடுவிக்கப்படும் நபரைத் தொடர்ந்து ஆண்பால் ஒருமையில் சுட்டுகிறது. அந்த இலக்கணத் தன்மையை மறைக்காமல், சட்டம் இருபாலருக்கும் பொருந்துவதை அடிக்குறிப்பு தெளிவுபடுத்துகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான சட்டநடை பயன்படுத்தப்பட்டுள்ளது. ‘சகோதரன்’ என்ற மூல குடும்ப-உடன்படிக்கைச் சொல்லும், ‘அனுப்பிவிடு’ என்ற வினை உருவகமும் தக்கவைக்கப்பட்டுள்ளன; இடைக்கோடுகள் ‘சகோதரன்’ என்பதற்குப் பின்வரும் ஆண்/பெண் விளக்கத்தை வாசிக்க எளிதாக்குகின்றன.
