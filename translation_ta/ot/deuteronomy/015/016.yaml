base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/015/016.yaml
  text: And if he says to you[a], ‘I will not go out from you,’ because he loves you and your household, because it is good for him with you[b],
translation:
  language: ta
  text: அவன் உன்னிடம்[a], ‘நான் உன்னைவிட்டுப் போகமாட்டேன்’ என்று சொன்னால்—அவன் உன்னையும் உன் வீட்டாரையும் நேசிப்பதாலும், உன்னோடு இருப்பது அவனுக்கு நன்றாக இருப்பதாலும்—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மொழியில் இதை இன்னும் சொல்லுக்குச் சொல்லாக, ‘நான் உன்னோடு இருப்பதிலிருந்து வெளியே போகமாட்டேன்’ என்று கூறலாம். இச்சூழலில், ‘உன்னைவிட்டுப் போகமாட்டேன்’ அல்லது ‘உன்னிடமிருந்து விடுதலையாகிப் போகமாட்டேன்’ என்பது பொருள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: அவன் … சொன்னால்
  rationale: சட்டப் பின்னணியில் வரக்கூடிய ஒரு நிலையை அறிமுகப்படுத்தும் எபிரெய நிபந்தனைத் தொடரை இயல்பான நவீனத் தமிழில் எடுத்துரைக்கிறது.
- source_word: יֹאמַר אֵלֶיךָ
  choice: அவன் உன்னிடம் … என்று சொன்னால்
  rationale: சாத்தியமான சட்டச் சூழலைக் குறிக்கும் வினைவடிவத்தைத் தமிழில் நிபந்தனை வடிவாக இயல்பாக வழங்குகிறது.
- source_word: לֹא אֵצֵא מֵעִמָּךְ
  choice: நான் உன்னைவிட்டுப் போகமாட்டேன்
  rationale: יָצָא என்பதன் ‘வெளியே போ’ என்ற அடிப்படை உருவகத்தையும், מֵעִמָּךְ என்பதன் உடனிருப்பிலிருந்து பிரியும் உறவுசார் நுட்பத்தையும் வாசிக்க இயல்பான தமிழில் இணைக்கிறது.
- source_word: כִּי אֲהֵבְךָ
  choice: அவன் உன்னை … நேசிப்பதாலும்
  rationale: ஊழியன் ஏன் பிரிய விரும்பவில்லை என்பதற்கான காரணத்தைத் தெளிவாகக் காட்டுகிறது.
- source_word: וְאֶת בֵּיתֶךָ
  choice: உன் வீட்டாரையும்
  rationale: בַּיִת இங்கு கட்டிடத்தை மட்டும் அல்லாமல் எஜமானின் குடும்பத்தையும் இல்லச் சமூகத்தையும் குறிக்கிறது; ‘வீட்டார்’ அந்தப் பொருளை இயல்பாகத் தருகிறது.
- source_word: כִּי טוֹב לוֹ עִמָּךְ
  choice: உன்னோடு இருப்பது அவனுக்கு நன்றாக இருப்பதாலும்
  rationale: சொல்லுக்குச் சொல்லான ‘உன்னோடு அவனுக்கு நல்லது’ என்ற கருத்தைத் தெளிவான தமிழில் தருவதோடு, அவன் நலமாக இருப்பதற்கான காரணநிலையையும் பாதுகாக்கிறது.
