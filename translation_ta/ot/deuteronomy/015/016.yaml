translation_notes:
  register: நவீன தரத் தமிழில், சட்ட உரையின் நிபந்தனை ஓட்டத்தைப் பேணும் கண்ணியமான மற்றும் எளிதில் புரியும் நடை. ‘வீட்டார்’ என்பது கட்டிடத்தை அல்ல, குடும்பம் மற்றும் இல்லச் சமூகத்தைச் சுட்டுகிறது. வசனம் அடுத்த வசனத்துடன் தொடர்வதால் இறுதியில் நிறைவுறாத வாக்கிய ஓட்டம் (நீண்ட கோடு) பேணப்பட்டுள்ளது.
