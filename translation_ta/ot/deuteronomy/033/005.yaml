base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/005.yaml
  text: And he was king in Jeshurun[a], when the heads of the people gathered together[c][b], the tribes of Israel as one.
translation:
  language: ta
  text: மக்களின் தலைவர்களும் இஸ்ரவேலின் கோத்திரங்களும் ஒருமித்து ஒன்றுகூடியபோது, அவர் யெஷுரூனில்[a] அரசராக இருந்தார்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘யெஷுரூன்’ என்பது இஸ்ரவேலைக் குறிக்கும் கவிதைநயப் பெயர்.
    reason: cultural_note
  - marker: b
    text: அல்லது, ‘ஆண்டவர் யெஷுரூனில் அரசரானார்’; வேறு சிலர், ‘அவர் [மோசே] யெஷுரூனில் அரசரானார்’ என்று புரிந்துகொள்கிறார்கள். எபிரெய உரை எழுவாயை வெளிப்படையாகக் குறிப்பிடவில்லை.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי
  choice: அவர் ... இருந்தார்
  rationale: היה என்பதன் இவ்வடிவம் இச்சூழலில் நிலையைச் சுட்டும் ‘இருந்தார்’ என இயல்பாக மொழிபெயர்க்கப்படுகிறது. எபிரெய உரையில் எழுவாய் வெளிப்படையாகக் குறிப்பிடப்படாததால், ‘அவர்’ என்று மட்டும் வைத்து அதன் தெளிவின்மையைப் பாதுகாக்கிறது.
- source_word: בִישֻׁרוּן
  choice: யெஷுரூனில்
  rationale: இது இஸ்ரவேலைக் குறிக்கும் கவிதைநயப் பெயர்; ஆகவே பெயரொலிப்பு முறையில் தரப்பட்டு, ב முன்னொட்டு ‘-இல்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: מֶלֶךְ
  choice: அரசராக
  rationale: מֶלֶךְ என்பதன் வழக்கமான பொருள் ‘அரசர்’. היה உடன் வரும் பயனிலை அமைப்பைத் தமிழில் இயல்பாகக் காட்ட ‘அரசராக இருந்தார்’ என வழங்கப்பட்டது.
- source_word: בְּהִתְאַסֵּף
  choice: ஒன்றுகூடியபோது
  rationale: ב முன்னொட்டுடன் கூடிய வினையெச்சப் பெயரின் காலப்பொருளை ‘-போது’ தெளிவாக வெளிப்படுத்துகிறது.
- source_word: רָאשֵׁי עָם
  choice: மக்களின் தலைவர்கள்
  rationale: சொல்லர்த்தமாக ‘மக்களின் தலைகள்’ என்றாலும், இது மக்களின் தலைவர்களைக் குறிக்கும் எபிரெய மரபுத்தொடர். நவீன தமிழில் பொருள் தெளிவாக இருக்க ‘தலைவர்கள்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: יַחַד
  choice: ஒருமித்து
  rationale: ஒன்றாகச் சேர்தல் மற்றும் ஒற்றுமை ஆகிய இரு நுணுக்கங்களையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: שִׁבְטֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் கோத்திரங்கள்
  rationale: இஸ்ரவேல் மக்களின் பழங்குடி அமைப்பைக் குறிக்கும் வழக்கமான வேதாகமச் சொற்றொடராக ‘கோத்திரங்கள்’ பயன்படுத்தப்பட்டது.
theological_decisions:
- issue: ‘அவர்’ மற்றும் ‘அரசர்’ என்பவற்றின் குறிப்பு
  choice: முதன்மை உரையில் எழுவாய் ‘அவர்’ என மட்டுமே வைக்கப்பட்டுள்ளது.
  alternative: ‘ஆண்டவர் யெஷுரூனில் அரசரானார்’ அல்லது ‘மோசே யெஷுரூனில் அரசரானார்’.
  rationale: எபிரெய உரை எழுவாயை வெளிப்படையாக அடையாளப்படுத்தவில்லை. அது ஆண்டவரையா மோசேயையா குறிக்கிறது என்பதில் விளக்க வேறுபாடு இருப்பதால், முதன்மை உரை அந்த உண்மையான தெளிவின்மையைத் தீர்க்காமல் பாதுகாக்கிறது.
- issue: இஸ்ரவேலின் கூட்டு ஒற்றுமை
  choice: தலைவர்களும் கோத்திரங்களும் ஒருமித்து கூடுவதாக உரை வழங்கப்பட்டுள்ளது.
  alternative: இதை முறையான அரசாபிஷேக நிகழ்வாகவோ உடன்படிக்கைச் சபையாகவோ குறிப்பாக விளக்குதல்.
  rationale: ஒன்றுகூடலும் ஒற்றுமையும் மூலத்தில் தெளிவாக உள்ளன; ஆனால் அந்த நிகழ்வின் அரசியல் அல்லது சடங்கு இயல்பு குறிப்பிடப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. சுருக்கமான எபிரெய வாக்கிய அமைப்பு தமிழில் தெளிவாக அமைய இணை விளக்க அமைப்பு பயன்படுத்தப்பட்டுள்ளது; எழுவாயின் இறையியல் தெளிவின்மை பாதுகாக்கப்பட்டுள்ளது.
