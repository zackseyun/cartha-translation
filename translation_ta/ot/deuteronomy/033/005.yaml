  source_fidelity: முதன்மை வரைவில் எபிரெய மூலத்தின் எழுவாய் தெளிவின்மையும் ‘யெஷுரூன்’ என்ற பெயரும் ‘அரசராக இருந்தார்’ என்ற நிலைப்பொருளும் முறையாகப் பாதுகாக்கப்பட்டுள்ளன. ஆனால் בְּהִתְאַסֵּף என்ற ஒரே காலப்பிரிவை, தலைவர்களுக்கும் கோத்திரங்களுக்கும் தனித்தனியான இரண்டு ‘கூடியபோது’ பிரிவுகளாக மாற்றியுள்ளது. மூலத்தில் கோத்திரங்கள் தலைவர்களுக்கு இணையான/ஒட்டிய ஒரே கூடுகையின் கூறாக வருகின்றன.
  naturalness: கோடிட்ட இடைச்செருகலுடன் மீண்டும் மீண்டும் ‘கூடியபோது’ வருவது நவீன நிலையான தமிழில் கனமாகவும், கோத்திரங்கள் வேறொரு சந்தர்ப்பத்தில் கூடியதுபோலும் ஒலிக்கிறது. ஒரே கூட்டு எழுவாயுடன் அமைத்தல் தெளிவாகவும் இயல்பாகவும் இருக்கும்.
  terminology: ‘மக்களின் தலைவர்கள்,’ ‘இஸ்ரவேலின் கோத்திரங்கள்,’ ‘யெஷுரூன்,’ மற்றும் ‘அரசர்’ ஆகிய தேர்வுகள் பொருத்தமானவை. ‘கோத்திரங்கள்’ இங்கு வேதாகமப் பயன்பாட்டில் நிலையானதும் ஏற்றதுமாகும்.
