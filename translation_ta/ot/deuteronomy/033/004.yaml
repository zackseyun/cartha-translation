  text: תּוֹרָ֥ה צִוָּה לָ֖/נוּ מֹשֶׁ֑ה מוֹרָשָׁ֖ה קְהִלַּ֥ת יַעֲקֹֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/004.yaml
  text: Moses commanded a law for us[b][a], an inheritance for the assembly of Jacob.
translation:
  language: ta
  text: மோசே நமக்குச் சட்டத்தைக் கட்டளையிட்டார்[a][b]; அது யாக்கோபின் மக்கள் கூட்டத்துக்குரிய பரம்பரைச் சொத்து.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மோசே நமக்குச் சட்டத்தைக் கட்டளையிட்டார்—யாக்கோபின் மக்கள் கூட்டத்துக்குரிய பரம்பரைச் சொத்து.” எபிரெயத் தொடரமைப்பு சுருக்கமாக இருப்பதால், “பரம்பரைச் சொத்து” என்பதை “சட்டம்” என்பதற்கு இணைப்பெயராகவும் வாசிக்கலாம்.
    reason: alternative_reading
  - marker: b
    text: “சட்டம்” என்பதை “போதனை” என்றும், “பரம்பரைச் சொத்து” என்பதை “சுதந்தரம்” அல்லது “உரிமைச் சொத்து” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: תּוֹרָה
  choice: சட்டம்
  rationale: இந்த உடன்படிக்கைச் சூழலில் மோசே வழியாக இஸ்ரவேலருக்கு அதிகாரபூர்வமாக அளிக்கப்பட்ட கட்டளைகளின் தொகுப்பை குறிக்கிறது. ‘போதனை’ என்பதும் சாத்தியம்; ஆனால் இங்கு ‘சட்டம்’ பொதுவான உடன்படிக்கை சார்ந்த பொருளைத் தெளிவாகக் கொண்டுவருகிறது.
- source_word: צִוָּה
  choice: கட்டளையிட்டார்
  rationale: எபிரெய வினையின் அதிகாரபூர்வமான கட்டளையிடும் வலிமையைப் பாதுகாக்கிறது; வெறுமனே ‘கொடுத்தார்’ என்று மென்மையாக்கவில்லை.
- source_word: לָנוּ
  choice: நமக்காக
  rationale: לָנוּ என்பதிலுள்ள பெறுநர் மற்றும் அவர்களுக்குரிய உடைமை/பயன் ஆகிய நுணுக்கங்களை இயல்பான தமிழில் வெளிப்படுத்துகிறது; ‘நமக்குக்’ என்பதும் சாத்தியம்.
- source_word: מֹשֶׁה
  choice: மோசே
  rationale: தமிழில் நிலைபெற்றுள்ள பெயர் வடிவம்.
- source_word: מוֹרָשָׁה
  choice: பரம்பரைச் சொத்து
  rationale: மரபுரிமையாகப் பெற்றும் உடைமையாக வைத்தும் இருப்பதைக் குறிக்கும் சொல்லின் பொருளைத் தெளிவாக வெளிப்படுத்துகிறது. ‘சுதந்தரம்’ அல்லது ‘உரிமைச் சொத்து’ என்றும் மொழிபெயர்க்கலாம்.
- source_word: קְהִלַּת
  choice: சபைக்கு
  rationale: கூட்டப்பட்ட சமூகத்தைச் சுட்டுகிறது. தமிழில் ‘சபை’ இயல்பாக இருந்தாலும், பிற்கால நிறுவனப் பொருளை மட்டும் நோக்கிச் செல்லாமல் இங்கு யாக்கோபின் மக்கள் கூட்டத்தைக் குறிக்கிறது.
- source_word: יַעֲקֹב
  choice: யாக்கோபின்
  rationale: மூலத்தில் உள்ள ‘யாக்கோபு’ என்ற பெயரை ‘இஸ்ரவேல்’ என்று விளக்கி மாற்றாமல் பாதுகாக்கிறது.
theological_decisions:
- issue: இரு பெயர்ச்சொல் தொடர்களுக்கிடையிலான தொடரியல் உறவு
  choice: மோசே கட்டளையிட்ட சட்டமே யாக்கோபின் சபைக்கு உரிய பரம்பரைச் சொத்து என இரண்டாம் பகுதியை இணைக்கும் வாசிப்பு.
  alternative: ‘மோசே நமக்காக ஒரு சட்டத்தைக் கட்டளையிட்டார்—யாக்கோபின் சபையின் பரம்பரைச் சொத்தை’ என ‘பரம்பரைச் சொத்து’ என்பதை ‘சட்டம்’ என்பதுடன் நேரடி இணைப்பெயராக வாசித்தல்.
  rationale: எபிரெயத்தின் இரண்டாம் பாதியில் வெளிப்படையான வினை இல்லை; அதன் நடை சுருக்கமானது. தமிழில் ‘அது’ என்பதைச் சேர்ப்பது உறவை இயல்பாக வெளிப்படுத்துகிறது; மாற்று இணைப்பெயர் வாசிப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுமக்கள் புரிந்துகொள்ளும் கண்ணியமான நடையைப் பயன்படுத்துகிறது. எபிரெயக் கவிதையின் சுருக்கத்தை ஓரளவு காத்து, தமிழில் உறவு தெளிவாக இருக்க ‘அது’ சேர்க்கப்பட்டுள்ளது. எல்லா அடிக்குறிப்பு குறியீடுகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
