  text: וַ/יֹּאמַ֗ר יְהוָ֞ה מִ/סִּינַ֥י בָּא֙ וְ/זָרַ֤ח מִ/שֵּׂעִיר֙ לָ֔/מוֹ הוֹפִ֨יעַ֙ מֵ/הַ֣ר פָּארָ֔ן וְ/אָתָ֖ה מֵ/רִבְבֹ֣ת קֹ֑דֶשׁ מִֽ/ימִינ֕/וֹ אשדת לָֽ/מוֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/002.yaml
  text: 'And he said: “Yahweh came from Sinai and dawned from Seir upon them[a]; he shone forth from Mount Paran, and came from myriads of holiness[b]; from his right hand came a fiery law for them.”'
translation:
  language: ta
  text: 'அவர் சொன்னார்:


    “யாவே சீனாயிலிருந்து வந்தார்;

    சேயீரிலிருந்து அவர்கள் மேல் உதித்தார்;

    பாரான் மலையிலிருந்து ஒளிவீசினார்;

    பரிசுத்தத்தின் பதினாயிரங்களிலிருந்து வந்தார்.[a]


    அவருடைய வலக்கையிலிருந்து

    அவர்களுக்காக அக்கினிச் சட்டம் வந்தது.[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பரிசுத்தமான பதினாயிரக்கணக்கானவர்களிடமிருந்து.” இங்குள்ள எபிரெயத் தொடர், கருத்தியல் பரிசுத்தத்திற்குப் பதிலாகப் பரிசுத்தமான வானுலகப் பணியாளர்களைக் குறிக்கலாம்.
    reason: alternative_reading
  - marker: b
    text: இங்கு வரும் אשדת என்ற எபிரெயச் சொல் கடினமானதும் பொருள் உறுதியற்றதும் ஆகும். இது பாரம்பரியமாக “அக்கினிச் சட்டம்” என்று மொழிபெயர்க்கப்படுகிறது; ஆனால் “அக்கினிப் பிழம்புகள்” என்றோ, அவருடைய வலக்கையிலிருந்து புறப்படும் அக்கினி என்றோ பொருள்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: யாவே
  rationale: தேவனுடைய தனிப்பட்ட பெயரை ஒரு பட்டத்தால் மாற்றாமல், நவீனத் தமிழில் தெளிவாக ஒலிபெயர்க்கிறது.
- source_word: מִסִּינַי בָּא
  choice: சீனாயிலிருந்து வந்தார்
  rationale: இறைத்தோற்றத்தின் வருகையையும் מִן என்பதன் திசை சார்ந்த பொருளையும் இயல்பான தமிழில் காக்கிறது.
- source_word: וְזָרַח מִשֵּׂעִיר לָמוֹ
  choice: சேயீரிலிருந்து அவர்கள்மேல் உதித்தார்
  rationale: זָרַח என்பதிலுள்ள சூரியன் அல்லது ஒளி உதிக்கும் கவித்துவப் படிமத்தையும், לָמוֹ என்பதன் தொடர்பையும் காக்கிறது.
- source_word: הוֹפִיעַ
  choice: ஒளிவீசினார்
  rationale: இவ்வினையின் பிரகாசமாகத் தோன்றுதல் அல்லது ஒளிர்தல் என்ற பொருளைச் சுருக்கமாகவும் கவித்துவமாகவும் தெரிவிக்கிறது.
- source_word: מֵהַר פָּארָן
  choice: பாரான் மலையிலிருந்து
  rationale: இடப்பெயரையும் הַר என்பதன் ‘மலை’ என்ற நேரடியான பொருளையும் காக்கிறது.
- source_word: וְאָתָה
  choice: வந்தார்
  rationale: இணையான இறைவருகை வினைகளின் தொடர்ச்சியைப் பேணுகிறது.
- source_word: מֵרִבְבֹת קֹדֶשׁ
  choice: பரிசுத்தத்தின் பல்லாயிரங்களிலிருந்து
  rationale: קֹדֶשׁ என்பதை நேரடியாக ‘பரிசுத்தம்’ என்று வைத்து, அது பரிசுத்தமான வானுலகப் பணியாளர்களைக் குறிக்கலாம் என்ற விளக்கத்தை அடிக்குறிப்பில் தருவதன் மூலம் மூலத்தின் தெளிவின்மையைப் பாதுகாக்கிறது.
- source_word: מִימִינוֹ
  choice: அவருடைய வலக்கையிலிருந்து
  rationale: מִן என்பதன் இயல்பான ‘இலிருந்து’ என்ற பொருளையும் வலக்கையிலிருந்து ஒன்று புறப்படும் படிமத்தையும் காக்கிறது.
- source_word: אשדת
  choice: அக்கினிச் சட்டம்
  rationale: சீனாய் சூழலோடு பொருந்தும் பாரம்பரிய வாசிப்பை முதன்மை உரையில் வைத்தாலும், எபிரெயச் சொல் கடினமும் உறுதியற்றதும் என்பதை அடிக்குறிப்பில் வெளிப்படையாகக் குறிப்பிடுகிறது.
- source_word: לָמוֹ
  choice: அவர்களுக்காக
  rationale: மூன்றாம் நபர் பன்மையைத் தக்கவைத்து, கொடுக்கப்பட்டதன் பயனாளிகளை இயல்பான தமிழில் காட்டுகிறது.
theological_decisions:
- issue: கவித்துவமான இறைத்தோற்றத்தில் வருகிற தெய்வீக நபரின் அடையாளம்
  choice: பழைய ஏற்பாட்டுச் சூழலின்படி உடன்படிக்கையின் தேவனுடைய பெயரான ‘யாவே’ என்று நேரடியாக மொழிபெயர்க்கப்பட்டது.
  alternative: இந்த வருகையில் பிற்கால கிறிஸ்தவ வெளிப்பாட்டின் முன்னடையாளத்தைக் காணுதல்.
  rationale: மொழிபெயர்ப்பு மோசேயின் ஆசீர்வாதத்திலுள்ள சீனாய் இறைத்தோற்றத்தைத் தெரிவிக்க வேண்டும்; பிற்கால இறையியல் விளக்கத்தை வசனத்துக்குள் சேர்க்கக் கூடாது.
- issue: מֵרִבְבֹת קֹדֶשׁ என்பதன் பொருள்
  choice: முதன்மை உரையில் ‘பரிசுத்தத்தின் பல்லாயிரங்களிலிருந்து’ என்று தெளிவின்மையை வைத்தல்.
  alternative: ‘பரிசுத்தமான பல்லாயிரக்கணக்கானவர்களின் நடுவிலிருந்து.’
  rationale: קֹדֶשׁ என்பது கருத்தியல் ‘பரிசுத்தம்’ என்பதையோ, சூழலால் ‘பரிசுத்தமானவர்கள்’ என்பதையோ சுட்டலாம்; வானுலகத் துணைவர்களைத் தீர்மானமாக முதன்மை உரையில் புகுத்தாமல் மாற்று வாசிப்பு அடிக்குறிப்பில் தரப்படுகிறது.
- issue: אשדת என்பதன் பொருள்
  choice: ‘அக்கினிச் சட்டம்’ என்று முதன்மை உரையில் வழங்குதல்.
  alternative: ‘அக்கினிப் பிழம்புகள்’ அல்லது ‘வலக்கையிலிருந்து புறப்பட்ட அக்கினி.’
  rationale: இந்த எபிரெய வடிவம் மிகவும் கடினமானது. பாரம்பரிய வாசிப்பு சீனாய் சூழலுக்கு ஏற்றதாக இருந்தாலும், அதன் உறுதியின்மையும் வேறு சாத்தியங்களும் அடிக்குறிப்பில் பாதுகாக்கப்படுகின்றன.
