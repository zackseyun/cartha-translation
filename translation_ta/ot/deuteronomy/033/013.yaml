base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/013.yaml
  text: And of Joseph he said[a], “Blessed by Yahweh be his land, with the choicest things of heaven, with dew[b], and from the deep lying beneath,”
translation:
  language: ta
  text: 'யோசேப்பைக் குறித்து அவர் கூறியது:


    “யாவேயால் அவனுடைய நிலம் ஆசீர்வதிக்கப்படுவதாக!


    வானத்தின் சிறந்த வளங்களாலும்[a], பனியாலும்,


    கீழே கிடக்கும் ஆழத்தினாலும்[b]!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “வானத்திலிருந்து வரும் சிறந்த பொருள்களாலும்.”
    reason: lexical_alternative
  - marker: b
    text: “ஆழம்” என்பது இங்கு நிலத்திற்குக் கீழே உள்ள, நிலத்தை வளப்படுத்தும் நீராதாரங்களைக் குறிக்கலாம்.
    reason: cultural_note
lexical_decisions:
- source_word: וּלְיוֹסֵף אָמַר
  choice: யோசேப்பைக் குறித்து அவர் கூறியது
  rationale: לְ உடன் வரும் பெயரை ஆசீர்வாத அறிமுகச் சூழலில் ‘குறித்து’ என்று இயல்பாகத் தருகிறது; אָמַר என்பதன் நேரடி உரை அறிமுகமும் தக்கவைக்கப்படுகிறது.
- source_word: מְבֹרֶכֶת יְהוָה אַרְצוֹ
  choice: யாவேயால் அவனுடைய நிலம் ஆசீர்வதிக்கப்படுவதாக
  rationale: எபிரெயப் பெயரெச்சத்தின் ஆசீர்வாதத் தொனியையும் தெய்வீகப் பெயரையும் காக்கும் இயல்பான வேண்டுதல் வடிவம்.
- source_word: מִמֶּגֶד שָׁמַיִם
  choice: வானத்தின் அரிய வளங்களாலும்
  rationale: מֶגֶד குறிக்கும் மதிப்புமிக்க, சிறந்த விளைபொருள் அல்லது வளம் என்ற பரப்பை ‘அரிய வளங்கள்’ இயல்பாக வெளிப்படுத்துகிறது; מן இங்கு ஆசீர்வாதத்தின் ஆதாரம் அல்லது சாதனத்தைக் குறிக்கிறது.
- source_word: מִטָּל
  choice: பனித்துளியாலும்
  rationale: வேளாண் வளத்திற்கான வானீய ஈரத்தைச் சுருக்கமாகவும் தெளிவாகவும் குறிக்கிறது.
- source_word: וּמִתְּהוֹם
  choice: கீழே ... ஆழத்தினாலும்
  rationale: תְּהוֹם என்பதை விளக்கவுரையாக ‘நிலத்தடி நீர்’ என்று மட்டும் கட்டுப்படுத்தாமல், மூலத்தின் ‘ஆழம்’ என்ற உருவகத்தைப் பாதுகாக்கிறது.
- source_word: רֹבֶצֶת תָּחַת
  choice: கீழே படுத்திருக்கும்
  rationale: רבץ என்பதன் உயிரோட்டமான ‘படுத்திருத்தல்’ உருவகத்தையும் תחת என்பதன் கீழ்ப்புற இடத்தையும் நேரடியாகக் காக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் பட்டப்பெயர் அல்ல, நான்கெழுத்துத் தெய்வீகப் பெயரே உள்ளது; ஆகவே அதைத் தமிழில் ஒலிபெயர்த்து வழங்குவது மூல வேறுபாட்டைக் காக்கிறது.
- issue: תְּהוֹם என்பதன் பொருள்
  choice: ஆழம்
  alternative: நிலத்தடி நீர்
  rationale: இச்சூழலில் அது நிலத்திற்குக் கீழுள்ள நீராதாரங்களைச் சுட்டலாம்; எனினும் மூலச் சொல்லின் விரிவான மற்றும் உருவகத் தன்மையை முதன்மை உரையில் காக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், கவிதைநயமும் ஆசீர்வாதத் தொனியும் காக்கப்பட்டுள்ளன. ‘யாவே’ எனத் தெய்வீகப் பெயர் ஒலிபெயர்க்கப்பட்டுள்ளது. மூலத்தில் உள்ள ‘கீழே படுத்திருக்கும் ஆழம்’ என்ற உருவகம் விளக்கமாக மாற்றப்படாமல் பாதுகாக்கப்பட்டு, அதன் சாத்தியமான பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
