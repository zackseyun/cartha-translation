source:
  edition: WLC
  text: יְחִ֥י רְאוּבֵ֖ן וְ/אַל יָמֹ֑ת וִ/יהִ֥י מְתָ֖י/ו מִסְפָּֽר־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/006.yaml
  text: May Reuben live and not die[a], and may his men be few.
translation:
  language: ta
  text: ரூபன் வாழ்வானாக; அவன் சாகாதிருப்பானாக. அவனுடைய ஆட்கள் சிலராக இருப்பார்களாக.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவனுடைய ஆட்கள் எண்ணப்பட்டவர்களாக இருப்பார்களாக.” இறுதிக் கூற்றின் எபிரெய உரை கடினமானது. ரூபன் முக்கியத்துவமற்றவனாகிவிடாமலும் கோத்திரக் கணக்கிலிருந்து நீக்கப்படாமலும் இருக்க வேண்டும் என்ற வேண்டுதலாகவும் இதைப் புரிந்துகொண்டுள்ளனர்.
    reason: alternative_reading
lexical_decisions:
- source_word: יְחִי
  choice: வாழ்வானாக
  rationale: חיה என்பதன் Qal வேண்டுகோள் வடிவம் ஆசீர்வாத விருப்பத்தைத் தெரிவிக்கிறது; ‘வாழ்வானாக’ அந்த வலிமையை இயல்பான, கண்ணியமான தமிழில் காக்கிறது.
- source_word: רְאוּבֵן
  choice: ரூபன்
  rationale: எபிரெய தனிப்பெயருக்கான தமிழில் நிலைபெற்ற ஒலிபெயர்ப்பு பயன்படுத்தப்பட்டது.
- source_word: וְאַל יָמֹת
  choice: அவன் சாகாதிருப்பானாக
  rationale: אַל உடன் வரும் வேண்டுகோள் வடிவம் எதிர்மறையான விருப்பத்தைத் தெரிவிக்கிறது. எழுவாயை மீண்டும் வெளிப்படுத்துவது தமிழில் தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: וִיהִי
  choice: இருப்பார்களாக
  rationale: இரண்டாவது வேண்டுகோள் வடிவத்தின் ஆசீர்வாதத் தன்மையைத் தக்கவைக்கிறது; பன்மையான ‘ஆட்கள்’ என்பதுடன் தமிழ் இலக்கணத்துக்கு ஏற்ப இசைவாக்கப்பட்டுள்ளது.
- source_word: מְתָיו
  choice: அவனுடைய ஆட்கள்
  rationale: இச்சூழலில் இந்தக் கடினமான சொல் ரூபன் கோத்திரத்தைச் சேர்ந்த ஆண்கள் அல்லது மக்கள் எனப் பொருள்படுவது மிகப் பொருத்தமானது. ‘ஆட்கள்’ என்பது தேவையற்ற விளக்கத்தைச் சேர்க்காமல் அந்தப் பொருளைக் காட்டுகிறது.
- source_word: מִסְפָּר
  choice: சிலர்
  rationale: சொல்லின் அடிப்படைப் பொருள் ‘எண்/எண்ணிக்கை’; היה உடன் வரும் இக்குறுகிய சொற்றொடரில் ‘எண்ணிக்கையில் சிலர்’ என்பது சாத்தியமான நேரடியான பொருள். தமிழில் ‘சிலராக’ என்பது இயல்பான சுருக்கமான வடிவம்; மாற்றுப் புரிதல் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
theological_decisions:
- issue: וִיהִי מְתָיו מִסְפָּר என்ற இறுதிக் கூற்றின் பொருள்
  choice: ரூபன் தொடர்ந்து வாழ்ந்தாலும் அவனுடைய ஆட்கள் எண்ணிக்கையில் சிலராக இருக்க வேண்டுமென்ற நிதானமான ஆசீர்வாதம்
  alternative: ‘அவனுடைய ஆட்கள் எண்ணப்பட்டவர்களாக இருப்பார்களாக,’ அதாவது கோத்திரக் கணக்கிலிருந்து நீக்கப்படாதிருப்பார்களாக; அல்லது ‘அவனுடைய ஆட்கள் சிலராக இருந்தாலும்’
  rationale: மசோரா உரை சுருக்கமாகவும் கடினமாகவும் உள்ளது. מִסְפָּר என்பதை היה உடன் ‘எண்ணிக்கையில் சிலர்/எண்ணக்கூடிய அளவினர்’ என்று கொள்வது உரையில் மாற்றம் செய்யாத நேரடியான வாசிப்பு. அதேவேளை, கோத்திரக் கணக்கில் இடம்பெறுதல் என்ற சாதகமான புரிதலும் உண்மையான உரைமொழி ஐயமாக இருப்பதால் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், ஆசீர்வாதக் கவிதைக்கு ஏற்ற கண்ணியமான வேண்டுகோள் நடையாக மொழிபெயர்க்கப்பட்டது. எபிரெய இணைப்புச் சொற்களை இயந்திரமாக மீளுருவாக்காமல் குறுவாக்கியங்களாக அமைத்து தெளிவு பேணப்பட்டது; இறுதிக் கூற்றின் உண்மையான ஐயம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டது.
