  source_fidelity: மூல எபிரெய வினைமுறைகளின் வேண்டுதல்/ஆசீர்வாதத் தன்மையை “வாழ்வானாக; ... சாகாதிருப்பானாக” துல்லியமாகக் காக்கிறது. מְתָיו מִסְפָּר என்ற கடினமான இறுதிச் சொற்றொடருக்கு மசோரா உரையோடு பொருந்தும் சாத்தியமான வாசிப்பான “அவனுடைய ஆட்கள் சிலராக இருப்பார்களாக” வழங்கப்பட்டுள்ளது; உரையில் இல்லாத மறுப்புச் சொல்லையோ சாதகமான விளக்கத்தையோ சேர்க்கவில்லை.
