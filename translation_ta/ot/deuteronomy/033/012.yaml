  text: לְ/בִנְיָמִ֣ן אָמַ֔ר יְדִ֣יד יְהֹוָ֔ה יִשְׁכֹּ֥ן לָ/בֶ֖טַח עָלָ֑י/ו חֹפֵ֤ף עָלָי/ו֙ כָּל הַ/יּ֔וֹם וּ/בֵ֥ין כְּתֵיפָ֖י/ו שָׁכֵֽן־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/012.yaml
  text: 'And of Benjamin he said: “The beloved of Yahweh dwells in safety by him[a]; he shields him all the day[b], and he dwells between his shoulders.”'
translation:
  language: ta
  text: 'பென்யமீனைக் குறித்து அவர் கூறினார்:


    “யாவேயின் அன்புக்குரியவன்


    அவரருகே பாதுகாப்பாகக் குடியிருப்பான்;[a]


    யாவே நாள் முழுவதும் அவனை மூடிக் காப்பார்;


    அவன் அவருடைய தோள்களுக்கு நடுவே குடியிருப்பான்.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அவரருகே பாதுகாப்பாக” என்பதற்குப் பதிலாக, “அவருக்குப் பக்கத்தில் பாதுகாப்பாக,” “அவருக்குக் கீழே பாதுகாப்பாக,” அல்லது “அவருக்கு மேலே பாதுகாப்பாக” என்றும் மொழிபெயர்க்கலாம். எபிரெய முன்னிடைச்சொல் அருகாமையையோ பாதுகாப்பான மேற்பார்வையையோ குறிக்கக்கூடும்.
    reason: lexical_alternative
  - marker: b
    text: நேரடியாக, “அவருடைய தோள்களுக்கு நடுவே.” இது பாதுகாப்பான நெருக்கத்தைக் குறிக்கும் உருவகமாக இருக்கலாம். வேறு சிலர் இதை பென்யமீனின் மலைப்பகுதியையோ அவன் எல்லைக்குள் அமைந்த பரிசுத்த இடத்தையோ குறிக்கும் நிலவியல் படிமமாகப் புரிந்துகொள்கிறார்கள். எபிரெய இலக்கணப்படி, இறுதியில் குடியிருப்பவர் யாவே என்றும், தோள்கள் பென்யமீனுடையவை என்றும் புரிந்துகொள்ளவும் வாய்ப்புள்ளது.
    reason: alternative_reading
lexical_decisions:
- source_word: לְבִנְיָמִן
  choice: பென்யமீனைப் பற்றி
  rationale: ஒவ்வொரு கோத்திரத்திற்கான ஆசிமொழியை அறிமுகப்படுத்தும் לְ என்பதைக் காலத்திற்கேற்ற இயல்பான தமிழில் ‘பற்றி’ என வழங்குகிறது; ‘பென்யமீனுக்கு’ என்பதும் இலக்கணப்படி சாத்தியம்.
- source_word: יְדִיד יְהוָה
  choice: யாவேயின் அன்புக்குரியவன்
  rationale: יְדִיד என்பது நேசிக்கப்படுகிற அல்லது அருமையான ஒருவரைக் குறிக்கிறது. இறைப்பெயரான יהוה பட்டப்பெயரால் மாற்றப்படாமல் ‘யாவே’ என ஒலிபெயர்க்கப்படுகிறது.
- source_word: יִשְׁכֹּן לָבֶטַח
  choice: பாதுகாப்பாகக் குடியிருப்பான்
  rationale: שׁכן என்பதன் குடியிருத்தல் என்ற அடிப்படைப் பொருளையும், לָבֶטַח குறிக்கும் பாதுகாப்பான நிலையையும் தெளிவாகத் தருகிறது.
- source_word: עָלָיו
  choice: அவரருகே
  rationale: על இங்கு அருகாமை, மேல்/கீழ் அமைந்த பாதுகாப்பு அல்லது மேற்பார்வை ஆகிய நுண்பொருள்களை ஏற்கக்கூடியது. முதன்மை உரையில் இயல்பான அருகாமைப் பொருள் தேர்ந்தெடுக்கப்பட்டு, மற்ற சாத்தியங்கள் அடிக்குறிப்பில் வைக்கப்பட்டுள்ளன.
- source_word: חֹפֵף
  choice: மூடிக் காப்பார்
  rationale: பாதுகாப்பாக மூடுதல் அல்லது மேலாக விரிந்து காத்தல் என்ற வினையின் படிமத்தையும் அதன் பாதுகாப்புப் பொருளையும் ஒருங்கே வைத்திருக்கிறது.
- source_word: כָּל הַיּוֹם
  choice: நாள் முழுவதும்
  rationale: எபிரெயக் கவிதையின் தொடர்ச்சியான காலக் கருத்தை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: וּבֵין כְּתֵיפָיו שָׁכֵן
  choice: அவன் யாவேயின் தோள்களுக்கு நடுவே குடியிருப்பான்
  rationale: ‘தோள்களுக்கு நடுவே’ என்ற நேரடியான கவித்துவப் படிமத்தையும் மீண்டும் வரும் குடியிருத்தல் கருத்தையும் காக்கிறது. தமிழில் சுட்டுப்பெயர் தெளிவுபடுத்த வேண்டியதால் முதன்மை வாசிப்பு உரையில் தரப்பட்டு, எபிரெயத்தின் மாற்று இலக்கணப் புரிதல்கள் அடிக்குறிப்பில் பதிவு செய்யப்பட்டுள்ளன.
theological_decisions:
- issue: வசனத்திலுள்ள சுட்டுப்பெயர்களின் குறிப்பும் இறுதி வாக்கியத்தின் எழுவாயும்
  choice: பென்யமீன், யாவேயின் அன்புக்குரியவனாக, அவரருகே பாதுகாப்பாக வாழ்கிறான்; யாவே அவனைக் காக்கிறார்; இறுதியில் பென்யமீன் யாவேயின் தோள்களுக்கு நடுவே குடியிருக்கிறான் என்ற வாசிப்பு முதன்மை உரையில் தரப்பட்டுள்ளது.
  alternative: யாவே பென்யமீன்மேல் தங்கி, பென்யமீனுடைய தோள்களுக்கு நடுவே குடியிருக்கிறார் என்றும் எபிரெயக் கவிதையைப் புரிந்துகொள்ளலாம்.
  rationale: எபிரெயத்தில் ஒரே ஆண்பால் ஒருமை வடிவங்கள் நெருக்கமாக வருவதால் குறிப்புகள் முழுமையாகத் தீர்மானிக்கப்படவில்லை. நவீன தமிழுக்கு தேவையான குறைந்தபட்சத் தெளிவு முதன்மை உரையில் வழங்கப்பட்டாலும், மற்ற வாசிப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் எளிதில் புரியும், ஆனால் ஆசிமொழிக்கேற்ற கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘குடியிருப்பான்’ என்ற சொல் இருமுறை வந்து எபிரெய மூலத்தின் மீளுரையைத் தக்கவைக்கிறது; ‘தோள்களுக்கு நடுவே’ என்ற மனித உருவகமும் விளக்கமாக மாற்றப்படாமல் வைக்கப்பட்டுள்ளது.
