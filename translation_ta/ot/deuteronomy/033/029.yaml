  source_fidelity: 'மூல எபிரெயத்தின் முக்கிய கூறுகள் நன்றாகக் காக்கப்பட்டுள்ளன: இஸ்ரவேலுக்கான வாழ்த்து, யாவேயால் இரட்சிக்கப்பட்ட மக்கள், கேடயம்/வாள் என்ற இணை உருவகங்கள், பகைவர்களின் கட்டாயமோ பாசாங்கோ கலந்த அடிபணிதல், மற்றும் அவர்களது உயரங்களின்மேல் மிதித்தல். அடிக்குறிப்புகள் כחשׁ மற்றும் בָּמוֹת ஆகியவற்றின் பொருள் வேறுபாடுகளைப் பொருத்தமாகக் காக்கின்றன.'
  naturalness: ‘யாவேயால் காப்பாற்றப்பட்ட மக்களான உனக்கு’ என்பது தொடரும் ‘அவரே உதவும் கேடயம்’ என்பதோடு இலக்கண ரீதியாகத் தொங்கும் அமைப்பாக உள்ளது. இஸ்ரவேலை நேரடி அழைப்பில் ‘மக்களே’ என்று அமைத்தால் கவிதைத் தொனியும் நவீன இயல்பும் மேம்படும். ‘உனக்கு ஒப்பானவர் யார்?’ என்பதற்குப் பதிலாக ‘உன்னைப்போல் யார்?’ இயல்பானது; இரண்டுமே பொருளில் துல்லியமானவை.
  terminology: ‘யாவே,’ ‘பேறுபெற்றவன்,’ ‘மாட்சி,’ ‘அடிபணிந்து வருவார்கள்’ ஆகியவை உயர்வான, நவீன நிலையான தமிழுக்குப் பொருத்தமானவை. ‘உன் மாட்சியின் வாளும் அவரே’ என்பது எபிரெயத்தில் மறைந்திருக்கும் இணைப்பைத் தேவையற்ற விளக்கமின்றித் தெளிவாக்குகிறது.
