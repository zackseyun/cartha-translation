  rationale: திருத்தம் பொருளை மாற்றாமல், யாவேயால் காப்பாற்றப்பட்ட ‘மக்கள்’ என்ற எபிரெய இணை அழைப்பைத் தமிழில் இலக்கணமாக முழுமைப்படுத்துகிறது. கேடயம் மற்றும் வாள் என்ற இரு உருவகங்களும் யாவேயைக் குறிக்கின்றன என்பதை ‘வாளும் அவரே’ தெளிவாக்குகிறது. இரு அடிக்குறிப்பு அடையாளங்களும் தத்தமது மூலச்சொற்களுக்குரிய இடங்களில் உள்ளன.
