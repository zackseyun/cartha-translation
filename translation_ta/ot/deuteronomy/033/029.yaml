source:
  edition: WLC
  text: אַשְׁרֶ֨י/ךָ יִשְׂרָאֵ֜ל מִ֣י כָמ֗וֹ/ךָ עַ֚ם נוֹשַׁ֣ע בַּֽ/יהוָ֔ה מָגֵ֣ן עֶזְרֶ֔/ךָ וַ/אֲשֶׁר חֶ֖רֶב גַּאֲוָתֶ֑/ךָ וְ/יִכָּֽחֲשׁ֤וּ אֹיְבֶ֨י/ךָ֙ לָ֔/ךְ וְ/אַתָּ֖ה עַל בָּמוֹתֵ֥י/מוֹ תִדְרֹֽךְ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/029.yaml
  text: Blessed are you[a], Israel! Who is like you, a people saved by Yahweh, the shield of your help and the sword of your majesty? Your enemies will come cringing to you[b], and you will tread on their high places.
translation:
  language: ta
  text: 'இஸ்ரவேலே, நீ எவ்வளவு பேறுபெற்றவன்!


    உன்னைப்போல் யார்?


    யாவேயால் காப்பாற்றப்பட்ட மக்களே,


    அவர் உனக்கு உதவும் கேடயம்;


    உன் மாட்சியின் வாளும் அவரே.


    உன் பகைவர்கள் உனக்கு அடிபணிந்து வருவார்கள்[a];


    நீ அவர்களுடைய மேடுகளின்மேல் மிதித்து நடப்பாய்[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘உன் பகைவர்கள் உனக்கு வஞ்சகமாகக் கீழ்ப்படிவார்கள்.’ எபிரெய வினை கட்டாயமான அல்லது பாசாங்கான கீழ்ப்படிதலைக் குறிக்கக்கூடும்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘அவர்களுடைய உயரங்களின்மேல்’ அல்லது ‘கோட்டைகளின்மேல் மிதித்து நடப்பாய்.’ சிலர் இங்கே ‘அவர்களுடைய முதுகுகளின்மேல்’ என்று பொருள்கொள்கிறார்கள்; ஆனால் ‘மேடுகள்’ என்பதே எபிரெயப் பெயர்ச்சொல்லின் நேரடியான பொருள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַשְׁרֶיךָ
  choice: நீ எவ்வளவு பேறுபெற்றவன்
  rationale: இது இஸ்ரவேலின் பேறுபெற்ற, விரும்பத்தக்க நிலையை வியந்து கூறும் பன்மை வடிவிலான எபிரெய வாழ்த்துச் சொற்றொடர். ‘பேறுபெற்றவன்’ உயர்வான தொனியையும் இயல்பான நவீன தமிழையும் காக்கிறது.
- source_word: מִי כָמוֹךָ
  choice: உனக்கு ஒப்பானவர் யார்?
  rationale: இஸ்ரவேலின் ஒப்பற்ற நிலையைக் காட்டும் சொல்லாட்சிக் கேள்வி; தமிழில் தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: עַם נוֹשַׁע בַּיהוָה
  choice: யாவேயால் காப்பாற்றப்பட்ட மக்கள்
  rationale: Niphal வினையெச்சத்தின் செயப்பாட்டு பொருளை ‘காப்பாற்றப்பட்ட’ துல்லியமாகத் தருகிறது; யாவேயால் விடுவிக்கப்பட்டதே இம்மக்களின் அடையாளம் என்பதையும் காட்டுகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தலைப்பால் மாற்றாமல், எபிரெய திருமறையில் காணப்படும் இறைபெயரைத் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: מָגֵן עֶזְרֶךָ
  choice: உனக்கு உதவும் கேடயம்
  rationale: எபிரெய இணைப்புத் தொடரின் சுருக்கமான படிமத்தை இயல்பான தமிழில் வெளிப்படுத்தி, யாவே பாதுகாத்து உதவுகிறவர் என்பதைத் தெரிவிக்கிறது.
- source_word: וַאֲשֶׁר חֶרֶב גַּאֲוָתֶךָ
  choice: அவரே உன் மாட்சியின் வாள்
  rationale: முந்தைய பெயரடைத் தொடருக்கு இணையாக யாவேயையே வாளாகக் குறிப்பிடும் மறைந்த வாக்கிய அமைப்பைத் தமிழில் தெளிவாக்குகிறது. ‘மாட்சி’ என்பது גַּאֲוָה-வின் இச்சூழலுக்குரிய நேர்மறையான மேன்மை அல்லது உயர்வைக் காக்கிறது.
- source_word: וְיִכָּחֲשׁוּ אֹיְבֶיךָ לָךְ
  choice: உன் பகைவர்கள் உனக்கு அடிபணிந்து வருவார்கள்
  rationale: பகைவர்கள் கட்டாயமாக அல்லது உண்மையற்ற விதத்தில் கீழ்ப்படிவதைக் குறிக்கக்கூடிய எபிரெய வினையின் அடிப்படை இராணுவச் சூழலைத் தருகிறது; நடிப்புத்தன்மை அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: עַל בָּמוֹתֵימוֹ תִדְרֹךְ
  choice: அவர்களுடைய மேடுகளின்மேல் மிதித்து நடப்பாய்
  rationale: בָּמוֹת என்பதன் நேரடியான ‘உயரங்கள்/மேடுகள்’ என்ற படிமத்தையும், תִדְרֹךְ என்பதன் மிதித்தல் அல்லது காலால் நடத்தல் என்ற வெற்றிப் படிமத்தையும் காக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைபெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: ஆண்டவர்; யெகோவா
  rationale: மூலத்தில் தனிப்பட்ட இறைபெயர் நேரடியாக இருப்பதால், அதை ஒரு பட்டத்தால் மாற்றாமல் ஒலிபெயர்ப்பது உடன்படிக்கைப் பெயரைப் பாதுகாக்கிறது.
- issue: גַּאֲוָתֶךָ என்பதன் பொருள்
  choice: உன் மாட்சி
  alternative: உன் பெருமை; உன் உயர்வு; உன் மகிமை
  rationale: இவ்வாழ்த்துச் சூழலில் இச்சொல் எதிர்மறையான அகந்தையை விட இஸ்ரவேலின் உயர்வையும் கண்ணியத்தையும் குறிக்கிறது; ‘மாட்சி’ அந்த நேர்மறைப் பொருளைத் தருகிறது.
- issue: பகைவர்களின் கீழ்ப்படிதலின் தன்மை
  choice: அடிபணிந்து வருவார்கள்; உண்மையற்ற அல்லது கட்டாயக் கீழ்ப்படிதலை அடிக்குறிப்பில் சுட்டுதல்
  alternative: கூனிக்குறுகி வருவார்கள்; வஞ்சகமாகக் கீழ்ப்படிவார்கள்
  rationale: எபிரெய வினையில் அடிபணிதலும் வஞ்சனை அல்லது பாசாங்கும் இணைந்திருக்கலாம். முதன்மை உரையை அளவுக்கு மீறி விளக்காமல், உண்மையான பொருள் மாறுபாட்டை அடிக்குறிப்பில் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், கவிதைத் தன்மையும் மோசேயின் வாழ்த்துக்குரிய உயர்வான கண்ணியமும் காக்கப்பட்டுள்ளன. இஸ்ரவேல் ஒரே கூட்டு நபராக ஒருமையில் அழைக்கப்படுவதால் ‘நீ/உனக்கு’ என்ற வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன. இணையான ‘அவரே’ தொடர்கள் எபிரெயக் கவிதையின் அமைப்பைத் தமிழில் தெளிவாக எடுத்துக்காட்டுகின்றன.
