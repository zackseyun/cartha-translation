  revised_text: 'இஸ்ரவேலே, நீ எவ்வளவு பேறுபெற்றவன்!


    உன்னைப்போல் யார்?


    யாவேயால் காப்பாற்றப்பட்ட மக்களே,


    அவர் உனக்கு உதவும் கேடயம்;


    உன் மாட்சியின் வாளும் அவரே.


    உன் பகைவர்கள் உனக்கு அடிபணிந்து வருவார்கள்[a];


    நீ அவர்களுடைய மேடுகளின்மேல் மிதித்து நடப்பாய்[b].'
