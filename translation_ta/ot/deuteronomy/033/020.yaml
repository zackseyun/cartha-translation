- from: 'காதைக் குறித்து அவன் கூறியது:

    “காதுக்கு விரிவான இடமளிக்கிறவர் ஆசீர்வதிக்கப்பட்டவர்[a].

    காத் பெண் சிங்கத்தைப்போல் தங்கியிருந்து[b],

    கையையும் உச்சந்தலையையும்கூடப் பிய்த்தெறிகிறான்[c].”'
  to: 'காதைக் குறித்து அவன் கூறியது:


    “காதுக்கு விசாலமான இடமளிக்கிறவர் ஆசீர்வதிக்கப்பட்டவர்[a].


    காத் சிங்கம்போல் குடியிருக்கிறான்[b];


    அவன் புயத்தையும் உச்சந்தலையையும்கூடப் பிய்த்துக் கிழிக்கிறான்[c].”'
  rationale: 'திருத்தம் இரண்டு துல்லியமான சொற்பொருள் சிக்கல்களைச் சரிசெய்கிறது: זְרוֹעַ-க்கு ‘புயம்’ என்றும் טָרַף-க்கு ‘பிய்த்துக் கிழிக்கிறான்’ என்றும் தரப்பட்டுள்ளது. லָבִיא-இன் சர்ச்சைக்குரிய பாலினக் குறிப்பை முதன்மை உரையில் தீர்மானிக்காமல், ‘சிங்கம்’ என்றும் அடிக்குறிப்பில் ‘பெண் சிங்கம்’ என்ற மாற்றாகவும் தருகிறது. பெயரிடப்படாத விரிவாக்குபவரை தேவன் என வெளிப்படையாகச் சேர்க்காமல், மூல எபிரெயத்தின் திறந்தநிலை பாதுகாக்கப்படுகிறது.'
