source:
  edition: WLC
  text: וּ/לְ/גָ֣ד אָמַ֔ר בָּר֖וּךְ מַרְחִ֣יב גָּ֑ד כְּ/לָבִ֣יא שָׁכֵ֔ן וְ/טָרַ֥ף זְר֖וֹעַ אַף קָדְקֹֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/020.yaml
  text: 'And of Gad he said: “Blessed is he who enlarges Gad[a]. He dwells like a lioness, and tears off arm[c][b], even scalp.”'
translation:
  language: ta
  text: 'காதைக் குறித்து அவன் கூறியது:


    “காதுக்கு விசாலமான இடமளிக்கிறவர் ஆசீர்வதிக்கப்பட்டவர்[a].


    காத் சிங்கம்போல் குடியிருக்கிறான்[b];


    அவன் புயத்தையும் உச்சந்தலையையும்கூடப் பிய்த்துக் கிழிக்கிறான்[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘காதுக்கு விசாலமான இடமளிக்கிறவர் ஆசீர்வதிக்கப்படுவாராக’ என்றும் மொழிபெயர்க்கலாம். இங்கு செய்பவர் தேவன் எனப் புரிந்துகொள்ளப்படலாம்; ஆனால் எபிரெய உரை அவரை வெளிப்படையாகப் பெயரிடவில்லை.
    reason: alternative_reading
  - marker: b
    text: ‘சிங்கம்போல்’ என்பதை ‘பெண் சிங்கம்போல்’ என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் வலிமைமிக்க சிங்கத்தைப் பொதுவாகவும் குறிக்கக்கூடும். ‘குடியிருக்கிறான்’ என்பதற்கு ‘தங்கியிருக்கிறான்’ அல்லது ‘படுத்திருக்கிறான்’ என்றும் பொருள் கொள்ளலாம்.
    reason: lexical_alternative
  - marker: c
    text: 'சொல்லுக்குச் சொல்: ‘புயத்தை, உச்சந்தலையையும்கூட.’'
    reason: literal_rendering
lexical_decisions:
- source_word: וּלְגָד
  choice: காதைக் குறித்து
  rationale: காத் கோத்திரத்திற்குரிய ஆசிமொழியை அறிமுகப்படுத்தும் எபிரெயச் சொல்லாட்சியை இயல்பான தமிழில் தருகிறது.
- source_word: בָּרוּךְ
  choice: ஆசீர்வதிக்கப்பட்டவர்
  rationale: இதை வேண்டுதலாக மாற்றாமல், ஆசீர்வாதத்தை அறிவிக்கும் பயனிலைச் சொல்லாக வைத்திருக்கிறது.
- source_word: מַרְחִיב
  choice: விரிவான இடமளிக்கிறவர்
  rationale: רחב என்பதன் ஹிஃபில் வடிவிலுள்ள ‘விரிவாக்குதல், இடம் விசாலமாக்குதல்’ என்ற கருத்தை, காதுக்காக இடம் உண்டாக்குதல் என்ற இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: כְּלָבִיא
  choice: பெண் சிங்கத்தைப்போல்
  rationale: லָבִיא என்பது வலிமைமிக்க சிங்கத்தைப் பொதுவாகவும், குறிப்பாகப் பெண் சிங்கத்தையும் குறிக்கக்கூடும்; முதன்மை உரையில் குறிப்பான பொருள் வைக்கப்பட்டு மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: שָׁכֵן
  choice: தங்கியிருந்து
  rationale: ‘குடியிருத்தல், தங்குதல், படுத்திருத்தல்’ ஆகிய பொருள் பரப்பை உடைய வினையை, கோத்திரத்தின் வாழ்விடத்திற்கும் சிங்க உருவகத்திற்கும் பொருந்தும் வகையில் தருகிறது.
- source_word: וְטָרַף
  choice: பிய்த்தெறிகிறான்
  rationale: இரை விலங்கு வன்மையாகப் பிய்த்தல் என்ற படிமத்தைத் தெளிவாகவும் இயல்பாகவும் காட்டுகிறது.
- source_word: זְרוֹעַ
  choice: கை
  rationale: ‘வலிமை’ என்ற கருத்தாக்கத்தைச் சேர்க்காமல், உடலுறுப்பைக் குறிக்கும் நேரடிப் படிமத்தைப் பேணுகிறது.
- source_word: אַף קָדְקֹד
  choice: உச்சந்தலையையும்கூட
  rationale: אַף என்பதன் வலியுறுத்தலையும், קָדְקֹד என்பதன் ‘தலையின் உச்சி’ என்ற குறிப்பான பொருளையும் பாதுகாக்கிறது.
theological_decisions:
- issue: காதுக்கு விரிவான இடமளிப்பவரின் அடையாளம்
  choice: அவரை தேவன் என்று முதன்மை உரையில் வெளிப்படையாகக் குறிப்பிடாமல் விடப்பட்டுள்ளது.
  alternative: ‘காதுக்கு விரிவான இடமளிக்கும் தேவன் ஆசீர்வதிக்கப்பட்டவர்’ என்று வெளிப்படையாகக் கூறுதல்.
  rationale: எபிரெய உரையில் செய்பவர் பெயரிடப்படவில்லை. சூழலில் தேவன் எனப் புரிந்துகொள்ள இயன்றாலும், அதை மொழிபெயர்ப்பில் வெளிப்படையாகச் சேர்க்காமல் மூலத்தின் திறந்தநிலையைப் பேணுவது பொருத்தமானது.
- issue: இரண்டாம் வாக்கியத்தின் எழுவாய்
  choice: ‘காத்’ என்று வெளிப்படையாகக் கூறப்பட்டுள்ளது.
  alternative: ‘அவன்’ என்று மட்டும் கூறி, முந்தைய ‘விரிவான இடமளிக்கிறவர்’ என்பதோடு இலக்கண ரீதியாக இணையும் வாய்ப்பை விடுதல்.
  rationale: ஆசிமொழியின் உருவகத்தில் சிங்கத்தைப்போல் தங்கி எதிரியைப் பிய்ப்பது காத் கோத்திரத்தைக் குறிக்கிறது; தமிழில் தவறான எழுவாய் இணைப்பைத் தவிர்க்க பெயர் மீண்டும் சொல்லப்பட்டுள்ளது.
translation_notes:
  register: நவீன தரத்தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘காத்’ என்பது கோத்திரப் பெயராக ஒலிபெயர்க்கப்பட்டுள்ளது; வன்மையான சிங்க உருவகம் மென்மைப்படுத்தப்படவில்லை.
