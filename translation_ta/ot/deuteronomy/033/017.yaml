source:
  edition: WLC
  text: בְּכ֨וֹר שׁוֹר֜/וֹ הָדָ֣ר ל֗/וֹ וְ/קַרְנֵ֤י רְאֵם֙ קַרְנָ֔י/ו בָּ/הֶ֗ם עַמִּ֛ים יְנַגַּ֥ח יַחְדָּ֖ו אַפְסֵי אָ֑רֶץ וְ/הֵם֙ רִבְב֣וֹת אֶפְרַ֔יִם וְ/הֵ֖ם אַלְפֵ֥י מְנַשֶּֽׁה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/017.yaml
  text: His firstborn bull has majesty[a], and his horns are the horns of a wild ox; with them he will gore peoples together to the ends of the earth. These are the myriads of Ephraim[b], and these are the thousands of Manasseh.
translation:
  language: ta
  text: அவனுடைய முதற்பேறான காளைக்கு மாட்சிமை உண்டு; அவனுடைய கொம்புகள் காட்டெருதின் கொம்புகளே.[a] அவற்றால் அவன் மக்களை ஒருசேரப் பூமியின் கடையெல்லைவரை குத்துவான். இவையே எப்பிராயீமின் பதினாயிரங்கள்; இவையே மனாசேயின் ஆயிரங்கள்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘காட்டுக்காளையின் கொம்புகள்’ என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் வலிமையான ஒரு காட்டு மாட்டினத்தைக் குறித்திருக்கலாம்; பழைய மொழிபெயர்ப்புகள் சிலவற்றில் அது ‘ஒற்றைக்கொம்பு விலங்கு’ என வழங்கப்பட்டது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘எப்பிராயீமின் பல்லாயிரக்கணக்கானோர்.’ எபிரெயச் சொல் மிகப் பெரிய எண்ணிக்கையை, குறிப்பாகப் பதினாயிரங்களை, குறிக்கக்கூடும்; இது மனாசேயின் ‘ஆயிரங்கள்’ என்பதற்கு எதிரிணையாக உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּכוֹר שׁוֹרוֹ
  choice: அவனுடைய முதற்பேறான காளை
  rationale: בְּכוֹר என்பது முதற்பேற்றைக் குறிக்கிறது; שׁוֹר ஆண்பால் கொம்புள்ள மாட்டின் வலிமை உருவகத்தைத் தருவதால் ‘காளை’ இயல்பாகப் பொருந்துகிறது.
- source_word: הָדָר לוֹ
  choice: மாட்சிமை உண்டு
  rationale: הָדָר என்பதிலுள்ள மாட்சிமை, பொலிவு, பெருமை ஆகிய கருத்துகளை பெயர்ச்சொல் அமைப்பிலேயே காக்கிறது.
- source_word: קַרְנֵי רְאֵם
  choice: காட்டெருதின் கொம்புகள்
  rationale: רְאֵם என்பது பெரும்பாலும் வலிமையான காட்டு மாட்டினத்தைக் குறிக்கும்; ஒற்றைக்கொம்புள்ள கற்பனை விலங்கைக் குறிக்காது.
- source_word: יְנַגַּח
  choice: முட்டித் தள்ளுவான்
  rationale: கொம்புள்ள விலங்கு தாக்கி முட்டும் தெளிவான படிமத்தைக் காக்கும் இயல்பான நவீனத் தமிழ் சொற்றொடர்.
- source_word: עַמִּים
  choice: மக்கள்
  rationale: பல இனக்குழுக்களை அல்லது மக்களினங்களைச் சுட்டும் பன்மைப் பொருளைச் சூழலில் இயல்பாகத் தருகிறது.
- source_word: יַחְדָּו אַפְסֵי אָרֶץ
  choice: ஒன்றாகப் பூமியின் கடையெல்லைவரை
  rationale: יַחְדָּו என்பதன் கூட்டாக/ஒருசேர என்ற கருத்தையும், אַפְסֵי אָרֶץ என்பதன் மிகத் தொலைவான எல்லைகள் என்ற கவித்துவ விரிவையும் காக்கிறது.
- source_word: רִבְבוֹת אֶפְרַיִם
  choice: எப்பிராயீமின் பல்லாயிரக்கணக்கானோர்
  rationale: רִבְבוֹת மிகப் பெரிய எண்ணிக்கையை, குறிப்பாகப் பதினாயிரங்களைக் குறிக்கலாம்; ‘பல்லாயிரக்கணக்கானோர்’ நவீனத் தமிழில் பெருந்திரளையும் அடுத்த ‘ஆயிரக்கணக்கானோர்’ என்பதுடனான வேறுபாட்டையும் தருகிறது.
- source_word: אַלְפֵי מְנַשֶּׁה
  choice: மனாசேயின் ஆயிரக்கணக்கானோர்
  rationale: இணையான முன்வரியுடன் சேர்ந்து பார்க்கையில் אֶלֶף இங்கு குல அலகை விட எண்ணிக்கையையே குறிக்கிறது.
theological_decisions:
- issue: யோசேப்பின் ஆசீர்வாதத்தில் விலங்கு உருவகத்தின் குறிப்பிடம்
  choice: ‘அவன்’ என்ற எபிரெயச் சுட்டைத் தொடர்ந்து வைத்துக் கொண்டு, இறுதியில் எப்பிராயீம் மற்றும் மனாசேயின் பெருந்திரள்களோடு உருவகத்தை இணைத்தல்
  alternative: ‘முதற்பேறான காளை’ என்பதை நேரடியாக எப்பிராயீமை மட்டுமே குறிக்கும் என வெளிப்படையாக மொழிபெயர்த்தல்
  rationale: வசனம் யோசேப்பைப் பற்றிய ஆசீர்வாதச் சூழலில் உருவகத்தை முன்வைத்து, பின்னர் எப்பிராயீம் மற்றும் மனாசேயை அடையாளப்படுத்துகிறது; மூலத்தில் தீர்க்கப்படாத குறிப்பை மொழிபெயர்ப்பு மிகையாகத் தீர்மானிக்கக் கூடாது.
translation_notes:
  register: நவீன நிலையான தமிழில், கவித்துவ மரியாதையைத் தக்கவைத்து பொதுவாசகருக்கு விளங்கும் சொற்கள் பயன்படுத்தப்பட்டுள்ளன. ‘மாட்சிமை’, ‘காட்டெருது’, ‘பூமியின் கடையெல்லை’ ஆகியவை உயர்ந்த கவித்துவத் தொனியைத் தருகின்றன; விலங்கு உருவகமும் எண்ணியல் இணைப்பும் தெளிவாகப் பாதுகாக்கப்பட்டுள்ளன.
