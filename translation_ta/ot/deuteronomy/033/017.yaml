  source_fidelity: திருத்தம் தேவை. வரைவில் வலிமையான காட்டு மாட்டின உருவகமும், பூமியின் கடையெல்லைவரையான தாக்குதலும், எப்பிராயீம்–மனாசே எண்ணியல் இணையும் பெரும்பாலும் காக்கப்பட்டுள்ளன. ஆனால் רִבְבֹות மற்றும் אַלְפֵי ஆகிய வெளிப்படையான எண்ணியல் பன்மைகளை ‘...க்கணக்கானோர்’ என மாற்றுவது மூலத்தின் திட்டமிட்ட ‘பதினாயிரங்கள்/ஆயிரங்கள்’ வேறுபாட்டை மங்கச் செய்கிறது. மேலும் יְנַגַּח என்பதன் கொம்பால் குத்தும் படிமத்தை ‘முட்டித் தள்ளுவான்’ ஓரளவு மட்டும் தருகிறது.
  naturalness: நவீன நிலையான தமிழில் நடை இயல்பாகவும் கவித்துவமாகவும் உள்ளது. ‘கொம்புகளால் ... குத்துவான்’ என்பது சூழலில் இன்னும் துல்லியமாகவும் இயல்பாகவும் அமையும். இறுதி வரியில் எண்ணியல் பெயர்ச்சொற்களைத் தெளிவாக வைத்தாலும் தமிழ் கவிதைநடை குன்றாது.
  terminology: ‘முதற்பேறான காளை,’ ‘மாட்சிமை,’ ‘காட்டெருது,’ ‘எப்பிராயீம்,’ ‘மனாசே’ ஆகியவை ஏற்கத்தக்கவை. רְאֵம்-க்கு ‘காட்டெருது’ பாதுகாப்பான பொதுவான இணை. அடிக்குறிப்பில் ‘காட்டுக்காளை’ என்ற மாற்றும் பழைய ‘ஒற்றைக்கொம்பு விலங்கு’ மரபும் பொருத்தமாகக் குறிப்பிடப்பட்டுள்ளன.
