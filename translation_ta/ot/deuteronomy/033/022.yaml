  text: וּ/לְ/דָ֣ן אָמַ֔ר דָּ֖ן גּ֣וּר אַרְיֵ֑ה יְזַנֵּ֖ק מִן הַ/בָּשָֽׁן־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/022.yaml
  text: 'And of Dan he said: “Dan is a lion’s cub[a]; he leaps out from Bashan.”'
translation:
  language: ta
  text: 'தானைக் குறித்து அவர் சொன்னார்:


    “தான் ஒரு சிங்கக்குட்டி;


    அவன் பாசானிலிருந்து பாய்கிறான்.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அவன் பாசானிலிருந்து துள்ளிப் புறப்படுகிறான்” என்றும் மொழிபெயர்க்கலாம். எபிரெய வினை திடீரெனப் பாயும் இயக்கத்தைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְדָן
  choice: தாணைக் குறித்து
  rationale: இணைப்புச்சொல்லும் முன்னிடைச்சொல்லும் அடுத்த கோத்திரத்திற்கான ஆசீர்வாதத்தை அறிமுகப்படுத்துகின்றன. தமிழில் ‘தாணைக் குறித்து’ என்பது ‘தாணைப் பொறுத்தவரை’ என்ற பொருளை இயல்பாகத் தருகிறது; தொடர்ச்சியை வசன அமைப்பே தெளிவாக்குகிறது.
- source_word: אָמַר
  choice: அவர் சொன்னது
  rationale: אמר என்பதன் எளிய அறிக்கைப் பொருளைப் பாதுகாக்கும் இயல்பான தமிழ் வடிவம்; ஆசீர்வாத அறிமுகச் சூத்திரத்திற்கும் ஏற்றது.
- source_word: דָּן
  choice: தாண்
  rationale: தனிப்பெயரும் கோத்திரப் பெயருமான இதை எபிரெய உச்சரிப்பை அணுகும் வகையில் எழுத்துப்பெயர்த்துள்ளது.
- source_word: גּוּר אַרְיֵה
  choice: ஒரு சிங்கக்குட்டி
  rationale: இணைப்புச் சொற்றொடர் இளம் சிங்கத்தைக் குறிக்கிறது. ‘சிங்கக்குட்டி’ வயது சார்ந்த நுணுக்கத்தையும் உருவகத்தையும் இயல்பான நவீன தமிழில் காக்கிறது.
- source_word: יְזַנֵּק
  choice: பாய்கிறான்
  rationale: இந்த வினை திடீரெனத் துள்ளிப் பாயும் இயக்கத்தைக் குறிக்கிறது. ‘பாய்கிறான்’ சிங்க உருவகத்துடன் பொருந்துவதோடு, ‘தாக்கிப் பாய்கிறான்’ என்று நோக்கத்தை மிகையாகச் சேர்க்காமல் இயக்கத்தின் வேகத்தைத் தருகிறது.
- source_word: מִן הַבָּשָׁן
  choice: பாசானிலிருந்து
  rationale: מִן தோற்ற இடத்தையோ புறப்படும் இடத்தையோ குறிக்கிறது. ‘பாசானிலிருந்து’ அந்த உறவை நேரடியாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
