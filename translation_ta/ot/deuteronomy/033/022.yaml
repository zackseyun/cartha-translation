translation_notes:
  register: நவீனத் தரத் தமிழில், கவித்துவமான ஆசீர்வாதத்தின் சுருக்கத்தையும் கண்ணியத்தையும் காக்கும் நடை. விலங்கு உருவகம் நேரடியாக வைக்கப்பட்டுள்ளது; தேவையற்ற விளக்கம் முதன்மை உரையில் சேர்க்கப்படவில்லை. அடிக்குறிப்பு குறியீடு தொடர்புடைய வினைக்குப் பிறகு இடப்பட்டுள்ளது.
