base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/026.yaml
  text: There is none like God[a], O Jeshurun, who rides on the heavens to help you[c][b], and in his majesty on the skies.
translation:
  language: ta
  text: 'யெஷுரூனே[a], கடவுளைப் போன்றவர் எவருமில்லை;

    அவர் உனக்கு உதவுவதற்காக[b] வானங்கள்மேல் ஏறிச் செல்கிறார்,

    தமது மாட்சிமையோடு ஆகாயங்கள்மேல் செல்கிறார்.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: யெஷுரூன் என்பது இஸ்ரவேலுக்கான ஒரு கவித்துவப் பெயர்.
    reason: cultural_note
  - marker: b
    text: அல்லது, “உனது உதவிக்காக.”
    reason: lexical_alternative
  - marker: c
    text: அல்லது, “மேகங்கள்மேல்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵין כָּאֵל
  choice: கடவுளைப் போன்றவர் எவருமில்லை
  rationale: எதிர்மறை இருப்புநிலைக் கூற்றையும் ஒப்பீட்டையும் இயல்பான, கவித்துவமான தமிழில் தருகிறது; אֵל இங்கு பொதுவான இறைப்பட்டமாகப் புரிந்துகொள்ளப்படுகிறது.
- source_word: יְשֻׁרוּן
  choice: யெஷுரூனே
  rationale: இஸ்ரவேலுக்கான கவித்துவப் பெயரை மொழிபெயர்க்காமல் ஒலிபெயர்த்து, அழைப்புவேற்றுமையை ‘-ஏ’ மூலம் வெளிப்படுத்துகிறது.
- source_word: רֹכֵב
  choice: சவாரி செய்கிறார்
  rationale: வானங்களின்மேல் செல்கிற உயர்ந்த கவித்துவப் படிமத்தை நேரடியாகப் பாதுகாக்கிறது.
- source_word: שָׁמַיִם
  choice: வானங்கள்
  rationale: எபிரெயப் பன்மையையும் உயர்ந்த கவித்துவ நடையையும் காக்கிறது.
- source_word: בְעֶזְרֶךָ
  choice: உனக்கு உதவுவதற்காக
  rationale: בְּ என்பதன் நோக்கம் அல்லது பயன் சார்ந்த பொருளை நவீன தமிழில் தெளிவாகத் தருகிறது; சொற்சார்ந்த மாற்று அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: וּבְגַאֲוָתוֹ
  choice: தமது மாட்சிமையில்
  rationale: கடவுளைக் குறிக்கும் சூழலில் גַּאֲוָה என்பதன் உயர்வு மற்றும் மகத்துவப் பொருளைத் தருகிறது; தவறாகப் புரியக்கூடிய ‘பெருமை/அகந்தை’ என்பதைத் தவிர்க்கிறது.
- source_word: שְׁחָקִים
  choice: ஆகாயங்கள்
  rationale: மேலுலக வான்வெளியைக் குறிக்கும் கவித்துவச் சொல்லாகவும், முன்வரும் ‘வானங்கள்’ என்பதோடு இணையான சொல்லாகவும் அமைகிறது; ‘மேகங்கள்’ என்ற சாத்தியமான பொருள் அடிக்குறிப்பில் வைக்கப்பட்டுள்ளது.
theological_decisions:
- issue: אֵל என்பதன் குறிப்பும் கவித்துவ ஒப்பீட்டின் வலிமையும்
  choice: பொதுவான இறைப்பட்டமாக ‘கடவுள்’
  alternative: ‘ஏல்’ என்ற தனிப்பெயர் அல்லது ‘வல்லவர்’ என்ற பட்டம்
  rationale: இவ்வசனம் இஸ்ரவேலின் கடவுளை ஒப்பற்றவர் என்று போற்றுகிறது. ‘கடவுள்’ என்பது தனியான வேறொரு தெய்வத்தைச் சுட்டும் எண்ணத்தை உருவாக்காமல், மூலத்தின் இயல்பான இறைப்பட்டத்தையும் ஒப்பற்ற தன்மையையும் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுமக்களுக்கு புரியும் கண்ணியமான கவித்துவ நடை பயன்படுத்தப்பட்டுள்ளது. ‘யெஷுரூனே’ என்ற அழைப்பும், ‘வானங்கள்/ஆகாயங்கள்’ என்ற இணைச்சொல் அமைப்பும் எபிரெயக் கவிதையின் உயர்ந்த நடையையும் இணைமையையும் பாதுகாக்கின்றன.
