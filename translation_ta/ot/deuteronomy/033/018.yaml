  text: וְ/לִ/זְבוּלֻ֣ן אָמַ֔ר שְׂמַ֥ח זְבוּלֻ֖ן בְּ/צֵאתֶ֑/ךָ וְ/יִשָּׂשכָ֖ר בְּ/אֹהָלֶֽי/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/018.yaml
  text: And of Zebulun he said[a], “Rejoice, Zebulun, in your going out, and Issachar, in your tents.”
translation:
  language: ta
  text: 'செபுலோனைக் குறித்து அவர் கூறினார்:


    “செபுலோனே, நீ வெளியே செல்லும்போது[a] மகிழ்ந்திரு;

    இசக்காரே, உன் கூடாரங்களில் மகிழ்ந்திரு.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உன் வெளியே செல்லுதலில்.” எபிரெயச் சொற்றொடர் செபுலோனின் செயல்பாட்டுத் தளம் அல்லது செழிப்பையும் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/לִ/זְבוּלֻן
  choice: செபுலோனைக்குறித்து
  rationale: இணைப்புச்சொல்லும் முன்னிடைச்சொல்லும் அடுத்த கோத்திரத்துக்கான ஆசீர்வாதத்தை அறிமுகப்படுத்துகின்றன. நவீன தமிழில் ‘செபுலோனைக்குறித்து’ என்பது இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: אָמַר
  choice: அவர் சொன்னது
  rationale: ஆசீர்வாத உரையை அறிமுகப்படுத்தும் எளிய, dignified narrative equivalent; சூழலில் ‘அவர்’ மோசேயைக் குறிக்கிறது.
- source_word: שְׂמַח
  choice: மகிழ்ந்திரு
  rationale: ஆண்பால் ஒருமை கட்டளை வடிவத்தின் வலிமையைப் பேணுகிறது. ஒரே கட்டளை இணைக்கப்பட்ட இரு கோத்திரங்களுக்கும் பொருந்துவதைத் தமிழில் இரு வரிகளிலும் வெளிப்படையாக வழங்குவது தெளிவைத் தருகிறது.
- source_word: זְבוּלֻן
  choice: செபுலோன்
  rationale: கோத்திரப் பெயரின் வழக்கமான தமிழ் ஒலிபெயர்ப்பு.
- source_word: בְּ/צֵאתֶךָ
  choice: நீ வெளியே செல்லும்போது
  rationale: בְ + infinitive construct இங்கு காலச்சூழல் அல்லது செயலின் தளத்தைக் குறிக்கலாம். ‘வெளியே செல்லும்போது’ எபிரெய உருவகத்தைப் பேணியபடி இயல்பான தமிழைத் தருகிறது; ‘முயற்சிகளில்’ போன்ற விளக்கவுரை தவிர்க்கப்படுகிறது.
- source_word: וְ/יִשָּׂשכָר
  choice: இசக்காரே
  rationale: செபுலோனுடன் இணையாக நேரடியாக அழைக்கப்படும் இரண்டாவது கோத்திரத்தின் பெயர்; தமிழ் அழைப்புவேற்றுமை கவித்துவ இணைப்பைத் தெளிவாக்குகிறது.
- source_word: בְּ/אֹהָלֶיךָ
  choice: நீ உன் கூடாரங்களில் இருக்கும்போது
  rationale: எபிரெய பன்மையான ‘கூடாரங்கள்’ தக்கவைக்கப்படுகிறது. தமிழில் முழுமையான இணை வாக்கியமாக அமைய ‘இருக்கும்போது’ சூழலிலிருந்து வெளிப்படுத்தப்படுகிறது; ‘வீட்டில்’ என்று உருவகத்தைத் தளர்த்தவில்லை.
