translation_notes:
  register: நவீன தரநிலைத் தமிழில், ஆசீர்வாதத்துக்கேற்ற கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய இணை அமைப்பு பேணப்பட்டாலும், பகிரப்பட்ட கட்டளை தமிழில் இரண்டாவது வரியிலும் வெளிப்படுத்தப்பட்டு பொருள் தெளிவாக்கப்பட்டுள்ளது. மூலத்தில் உள்ள בְצֵאתֶךָ என்பதன் காலச்சூழல்/செயல்தள நுட்பம் ‘வெளியே செல்லும்போது’ என இயல்பாக வழங்கப்பட்டுள்ளது.
