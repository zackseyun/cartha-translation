base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/010.yaml
  text: They will teach your judgments to Jacob and your law to Israel[b][a]; they will place incense before you and whole burnt offerings on your altar.
translation:
  language: ta
  text: அவர்கள் உமது நீதித் தீர்ப்புகளை யாக்கோபுக்கும், உமது போதனையை இஸ்ரவேலுக்கும் கற்பிப்பார்கள்[a]; உமக்கு முன்பாகத் தூபத்தையும்[b], உமது பலிபீடத்தின்மேல் முழுவதும் எரிக்கப்படும் பலியையும் செலுத்துவார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘போதனை’ என்பதற்குப் பதிலாக, ‘திருச்சட்டம்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: சொல்லர்த்தமாக, ‘உமது மூக்கருகில்’; கடவுளுக்கு முன்பாகத் தூபம் செலுத்தப்படுவதைக் குறிக்கும் மனித உருவக மொழி.
    reason: cultural_note
lexical_decisions:
- source_word: יוֹרוּ
  choice: கற்பிப்பார்கள்
  rationale: ירה என்பதன் ஹிபீல் வடிவம் ஆசாரிய மற்றும் சட்டச் சூழலில் ‘கற்பித்தல்/அறிவுறுத்தல்’ என்று பொருள்படும்; இங்கு ‘கற்பிப்பார்கள்’ இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: מִשְׁפָּטֶיךָ
  choice: உமது நீதித் தீர்ப்புகளை
  rationale: מִשְׁפָּט என்பதில் தீர்ப்பு, விதிமுறை, நீதிநெறி ஆகிய சட்டப் பொருள்கள் உள்ளன; ‘நீதித் தீர்ப்புகள்’ அதன் நீதித்துறை சார்ந்த வலிமையைப் பாதுகாக்கிறது.
- source_word: לְיַעֲקֹב
  choice: யாக்கோபுக்கும்
  rationale: לְ என்பது கற்பித்தலின் மறைமுகச் செயப்படுபொருளைக் குறிக்கிறது; அடுத்துள்ள ‘இஸ்ரவேலுக்கும்’ என்பதோடு கவிதை இணைநிலையைப் பாதுகாக்க ‘-க்கும்’ பயன்படுத்தப்பட்டது.
- source_word: וְתוֹרָתְךָ
  choice: உமது போதனையை
  rationale: תּוֹרָה என்பது சட்டத்தை மட்டுமல்ல, கடவுள் அளிக்கும் போதனை அல்லது அறிவுறுத்தலையும் குறிக்கலாம். ஆசாரியர்கள் கற்பிக்கும் சூழலில் ‘போதனை’ இயல்பானது; ‘திருச்சட்டம்’ மாற்றாக அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: לְיִשְׂרָאֵל
  choice: இஸ்ரவேலுக்கும்
  rationale: ‘யாக்கோபுக்கும்’ என்பதுடன் உள்ள இணைநிலையைத் தக்கவைத்து, கற்பித்தலின் பெறுநரைக் குறிக்கிறது.
- source_word: יָשִׂימוּ
  choice: செலுத்துவார்கள்
  rationale: שׂים அடிப்படையில் ‘வை/இடு’ என்றாலும், தூபத்தையும் பலியையும் கடவுளுக்கு முன் வைக்கும் வழிபாட்டுச் சூழலில் ‘செலுத்துவார்கள்’ என்பது இயல்பான தமிழாகும்.
- source_word: קְטוֹרָה
  choice: தூபத்தை
  rationale: இச்சொல் எரிக்கப்படும் நறுமணத் தூபத்தைக் குறிக்கிறது; தமிழ் வேதாகம மற்றும் வழிபாட்டு நடையில் ‘தூபம்’ தெளிவான சொல்.
- source_word: בְּאַפֶּךָ
  choice: உமக்கு முன்பாக
  rationale: சொல்லர்த்தமாக ‘உமது மூக்கருகில்/நாசியில்’ என்ற மனித உருவக மொழி. தூபம் கடவுளின் முன்னிலையில் செலுத்தப்படுவதைக் காட்ட இயல்பான தமிழில் ‘உமக்கு முன்பாக’ என மொழிபெயர்க்கப்பட்டது; சொல்லர்த்தம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: וְכָלִיל
  choice: முழுவதும் எரிக்கப்படும் பலிகளை
  rationale: כָּלִיל பலிபீடத்தில் முற்றிலும் எரிக்கப்பட்ட பலியைக் குறிக்கிறது. எண்ணிக்கை குறித்து வடிவம் தெளிவாக நிர்ணயிக்காததால், வழக்கமான கூட்டு/வகைப் பொருளை இயல்பாக வெளிப்படுத்த பன்மை பயன்படுத்தப்பட்டது.
- source_word: עַל מִזְבְּחֶךָ
  choice: உமது பலிபீடத்தின்மேல்
  rationale: எபிரேய முன்னிடைச்சொல் மற்றும் பெயர்ச்சொல்லை நேரடியாகவும் இயல்பாகவும் பிரதிபலிக்கிறது.
theological_decisions:
- issue: תּוֹרָה என்பதன் உடன்படிக்கைச் சூழலிலான பொருள்
  choice: போதனை
  alternative: திருச்சட்டம்
  rationale: இந்த வசனம் லேவியரின் கற்பித்தல் பணியை எடுத்துரைப்பதால், תּוֹרָה என்பதன் விரிவான ‘போதனை/அறிவுறுத்தல்’ பொருளை ‘போதனை’ நன்றாக வெளிப்படுத்துகிறது. சட்டம் என்ற உடன்படிக்கைச் சார்பும் செல்லத்தக்கதால் அடிக்குறிப்பில் பாதுகாக்கப்பட்டது.
- issue: בְּאַפֶּךָ என்ற மனித உருவகத்தின் விளக்கம்
  choice: உமக்கு முன்பாக
  alternative: சொல்லர்த்தமாக, ‘உமது மூக்கருகில்’
  rationale: இங்கு אַף ‘கோபம்’ என்று பொருள்படுவதற்குப் பதிலாக, தூபம் கடவுளின் மூக்கருகில் வைக்கப்படுவது போன்ற மனித உருவகத்தைப் பயன்படுத்துகிறது. பிரதான உரை வழிபாட்டுச் செயலை இயல்பாகச் சொல்கிறது; உருவகம் அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
- issue: כָּלִיל என்பதன் எண்ணிக்கை மற்றும் பலி வகை
  choice: முழுவதும் எரிக்கப்படும் பலிகள்
  alternative: முழுவதும் எரிக்கப்படும் ஒரு பலி
  rationale: ஒருமை வடிவம் பலி வகையை கூட்டாகவும் குறிக்கலாம். தமிழில் வழக்கமான, மீள நிகழும் ஆசாரியச் சேவையை இயல்பாகக் காட்ட பன்மை தேர்ந்தெடுக்கப்பட்டது; தனிப்பட்ட எண்ணை வலியுறுத்தவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், கவிதை இணைநிலையைப் பாதுகாக்கும் மதிப்புமிக்க ஆனால் பொதுவாசகர்களுக்குப் புரியும் நடை பயன்படுத்தப்பட்டது. கடவுளைச் சுட்டும் இடங்களில் ‘உமது/உமக்கு’ என்ற மரியாதை வடிவம் கையாளப்பட்டது. வழிபாட்டுச் சொற்களாக ‘தூபம்’, ‘பலி’, ‘பலிபீடம்’ பயன்படுத்தப்பட்டன.
