base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/003.yaml
  text: Indeed[a], he loves the peoples; all his holy ones are in your hand, and they sit down at your feet[b]; each receives your words.
translation:
  language: ta
  text: 'மெய்யாகவே, அவர் மக்களினங்களை நேசிக்கிறார்;

    அவருடைய தூயவர்கள் அனைவரும் உமது கையில் இருக்கிறார்கள்.

    அவர்கள் உமது காலடியில் அமர்கிறார்கள்[a];

    ஒவ்வொருவரும் உமது சொற்களைப் பெறுகின்றனர்[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அமர்கிறார்கள்’ என்று மொழிபெயர்க்கப்பட்டுள்ள எபிரெய வினைச்சொல் ஐயத்திற்குரியது; ‘கூடிவருகிறார்கள்,’ ‘குனிந்திருக்கிறார்கள்,’ அல்லது ‘வீழ்த்தப்பட்டார்கள்’ என்றும் இதைப் புரிந்துகொள்ளலாம்.
    reason: alternative_reading
  - marker: b
    text: அல்லது, ‘ஒவ்வொருவரும் உமது சொற்களிலிருந்து எடுத்துக்கொள்கிறார்கள்’ / ‘உமது உரைகளைச் சுமக்கிறார்கள்’; இந்த எபிரெயச் சொற்றொடர் அரிதானதும் பொருள் காணக் கடினமானதும் ஆகும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַף
  choice: மெய்யாகவே
  rationale: இங்கு இது ‘கூட’ என்ற சேர்க்கைப் பொருளைவிட, கூற்றை வலியுறுத்தும் இடைச்சொல்லாக உள்ளது. ‘மெய்யாகவே’ அந்த வலியுறுத்தலை இயல்பான தமிழில் தருகிறது.
- source_word: חֹבֵב
  choice: நேசிக்கிறார்
  rationale: எபிரெயப் பங்கேற்புவினை தொடர்ந்த மனப்பாங்கைக் குறிக்கிறது; ‘நேசிக்கிறார்’ உறவுசார் பொருளைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: עַמִּים
  choice: மக்களினங்களை
  rationale: பன்மை வடிவத்தின் கூட்டுப் பொருளைத் தக்கவைத்து, அதை ‘புறவினத்தார்’ என்று தேவையின்றிக் குறுக்காமல் இருக்கிறது.
- source_word: כָּל קְדֹשָׁיו
  choice: அவருடைய தூயவர்கள் அனைவரும்
  rationale: தேவனுக்கெனப் பிரித்துவைக்கப்பட்டவர்களைக் குறிக்கும் பொதுவான பொருளைத் தக்கவைக்கிறது; அவர்களைத் தேவதூதர்கள் அல்லது இஸ்ரவேலர் என்று குறிப்பாக அடையாளப்படுத்தவில்லை.
- source_word: בְּיָדֶךָ
  choice: உமது கையில்
  rationale: மூலத்தின் நேரடியான உருவகத்தையும், மூன்றாம் நபரிலிருந்து இரண்டாம் நபருக்கு மாறும் கவிதை நடையையும் பாதுகாக்கிறது.
- source_word: תֻּכּוּ
  choice: அமர்கிறார்கள்
  rationale: இவ்வினைச்சொல் மிகவும் ஐயத்திற்குரியது. ‘உமது காலடியில்’ என்பதோடும், அடுத்து சொற்களைப் பெறும் காட்சியோடும் ‘அமர்கிறார்கள்’ நன்றாகப் பொருந்துகிறது; பிற சாத்தியங்கள் அடிக்குறிப்பில் தரப்படுகின்றன.
- source_word: לְרַגְלֶךָ
  choice: உமது காலடியில்
  rationale: உட்கார்ந்து கேட்பதையும் பணிவையும் சுட்டும் இயல்பான தமிழ்ச் சொற்றொடர்.
- source_word: יִשָּׂא
  choice: ஏற்றுக்கொள்கிறார்கள்
  rationale: அடிப்படைப் பொருள் ‘தூக்குதல்/சுமத்தல்’ என்றாலும், சொற்களுடன் வரும் இச்சூழலில் அவற்றைப் பெற்றுக்கொள்ளுதல் அல்லது ஏற்றுக்கொள்ளுதல் என்பதே தெளிவான பொருள்.
- source_word: מִדַּבְּרֹתֶיךָ
  choice: உமது சொற்களை
  rationale: அரிதான இச்சொல் பேச்சு அல்லது உரைகளைக் குறிக்கிறது. ‘உமது சொற்களை’ என்பது தெளிவான தமிழாக்கம்; முன்னொட்டிலுள்ள ‘இலிருந்து’ என்ற சாத்தியம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
theological_decisions:
- issue: கவிதையில் மாறும் நபர்ச் சுட்டுகள்
  choice: ‘அவர்… அவருடைய… உமது…’ என்ற மூலத்தின் மாற்றத்தைத் தக்கவைத்தல்
  alternative: அனைத்துச் சுட்டுகளையும் மூன்றாம் நபராகவோ இரண்டாம் நபராகவோ ஒரே வடிவமாக்குதல்
  rationale: மூல எபிரெயத்தில் நபர்ச் சுட்டு மாறுகிறது. அதைச் சீராக்குவது உண்மையான கவிதைத் தெளிவின்மையை மறைத்துவிடும்.
- issue: ‘தூயவர்கள்’ என்போரின் அடையாளம்
  choice: அவர்களை மேலும் குறிப்பிட்டு அடையாளப்படுத்தாமல் ‘தூயவர்கள்’ என மொழிபெயர்த்தல்
  alternative: ‘தேவதூதர்கள்,’ ‘இஸ்ரவேலின் தூய மக்கள்,’ அல்லது பிற்காலச் சமயத் தனிப்பொருள் கொண்ட சொல்
  rationale: சூழல் இவர்களின் அடையாளத்தை ஒரே வகையில் கட்டாயப்படுத்தவில்லை; எனவே பரந்த மூலச்சொல்லின் பொருள் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. தேவனைச் சுட்டும் இரண்டாம் நபருக்கு ‘உமது’ என்றும் மூன்றாம் நபருக்கு ‘அவர்’ என்றும் பயன்படுத்தி, மூலத்தின் நபர்மாற்றம் பாதுகாக்கப்பட்டுள்ளது. ‘தூயவர்கள்’ என்பது பிற்காலப் பிரிவுசார் நுண்பொருளைத் தவிர்க்கிறது.
