source:
  edition: WLC
  text: וְ/זֹ֣את לִֽ/יהוּדָה֮ וַ/יֹּאמַר֒ שְׁמַ֤ע יְהוָה֙ ק֣וֹל יְהוּדָ֔ה וְ/אֶל עַמּ֖/וֹ תְּבִיאֶ֑/נּוּ יָדָי/ו֙ רָ֣ב ל֔/וֹ וְ/עֵ֥זֶר מִ/צָּרָ֖י/ו תִּהְיֶֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/007.yaml
  text: 'And this he said for Judah: “Hear[a], Yahweh, the voice of Judah, and bring him to his people. Let his hands strive for him, and be a help against his adversaries.”'
translation:
  language: ta
  text: 'யூதாவைக் குறித்து அவர் சொன்னது இதுவே: “யாவே, யூதாவின் குரலைக் கேளும்; அவனை அவனுடைய மக்களிடம் கொண்டுவாரும். அவனுடைய கைகள் அவனுக்காகப் போராடட்டும்[a]; அவனுடைய எதிரிகளுக்கு எதிராக நீர் அவனுக்குத் துணையாயிரும்.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவனுடைய கைகள் அவனுக்குப் போதுமானவையாக இருக்கட்டும்.” இந்த எபிரெயச் சொற்றொடர் பொருள் காணக் கடினமானது; இது ஒன்றுக்கு மேற்பட்ட விதங்களில் புரிந்துகொள்ளப்பட்டுள்ளது.
    reason: alternative_reading
lexical_decisions:
- source_word: וְזֹאת לִיהוּדָה וַיֹּאמַר
  choice: யூதாவைக் குறித்து அவர் சொன்னது இதுவே
  rationale: இணைப்புச்சொல், சுட்டுப்பெயர், பொருளைக் குறிக்கும் לְ ஆகியவற்றை இயல்பான தமிழ் அறிமுகச் சூத்திரமாகத் தருகிறது.
- source_word: שְׁמַע יְהוָה קוֹל יְהוּדָה
  choice: யாவே, யூதாவின் குரலைக் கேட்டு
  rationale: קוֹל என்பதன் ‘குரல்’ உருவகத்தைப் பேணுகிறது; வேண்டுதல் தொடரின் இயல்பான தமிழ் அமைப்பிற்காக வினையெச்சம் பயன்படுத்தப்பட்டுள்ளது.
- source_word: וְאֶל עַמּוֹ תְּבִיאֶנּוּ
  choice: அவனை அவனுடைய மக்களிடம் கொண்டுவாரும்
  rationale: ஹிஃபில் வடிவத்தின் ‘கொண்டுவருதல்’ பொருளைப் பேணி, இது போரிலிருந்து திரும்புதலா அல்லது மக்களோடு சேர்த்தலா என்பதைத் தீர்மானிக்காமல் விடுகிறது.
- source_word: יָדָיו רָב לוֹ
  choice: அவனுடைய கைகள் அவனுக்காகப் போராடட்டும்
  rationale: சுருக்கமானதும் கடினமானதுமான எபிரெய சொற்றொடரை இராணுவச் சூழலுக்கும் அடுத்த வேண்டுதலுக்கும் ஏற்றபடி மொழிபெயர்க்கிறது; மாற்றுப் புரிதல் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: וְעֵזֶר מִצָּרָיו תִּהְיֶה
  choice: அவனுடைய எதிரிகளுக்கு எதிராக நீர் அவனுக்குத் துணையாயிரும்
  rationale: מִן என்பதை எதிர்ப்பு/விடுவிப்பு உறவாகப் புரிந்து ‘எதிராக’ எனத் தருகிறது; யாவேவிடம் நேரடியாகத் தொடரும் வேண்டுதலை வெளிப்படையாகக் காட்டுகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் உள்ள உடன்படிக்கைப் பெயரைப் பொதுப்பட்டமாக மாற்றாமல், தமிழில் நேரடியாக ஒலிபெயர்க்கிறது.
- issue: יָדָיו רָב לוֹ என்ற கடினமான சொற்றொடரின் பொருள்
  choice: அவனுடைய கைகள் அவனுக்காகப் போராடட்டும்
  alternative: அவனுடைய கைகள் அவனுக்குப் போதுமானவையாக இருக்கட்டும்
  rationale: பகைவர்களுக்கு எதிரான உதவியை வேண்டுகிற சூழலோடு முதன்மை வாசிப்பு பொருந்துகிறது; இருப்பினும் எபிரெயத்தின் உண்மையான தெளிவின்மையை அடிக்குறிப்பில் பாதுகாக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில் இயல்பான, கண்ணியமான வேண்டுதல் நடை பயன்படுத்தப்பட்டுள்ளது. இறைவனை நோக்கிய மரியாதைப் பன்மை வடிவங்களான ‘கொண்டுவாரும்’, ‘துணையாயிரும்’ பயன்படுத்தப்பட்டுள்ளன; மூலத்தின் தெளிவின்மை அடிக்குறிப்பில் வைக்கப்பட்டுள்ளது.
