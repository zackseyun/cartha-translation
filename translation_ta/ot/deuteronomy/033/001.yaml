  source_fidelity: 'The draft conveys all core elements of the Hebrew: the formal blessing, Moses’ title, Israel’s sons, and the timing before Moses’ death. Its clause order is natural in Tamil and retains the Hebrew’s emphasis on the blessing. The collective force of בְּנֵי יִשְׂרָאֵל is appropriately explained in the footnote.'
