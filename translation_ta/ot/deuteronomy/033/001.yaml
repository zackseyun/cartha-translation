  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וְ/זֹ֣את הַ/בְּרָכָ֗ה אֲשֶׁ֨ר בֵּרַ֥ךְ מֹשֶׁ֛ה אִ֥ישׁ הָ/אֱלֹהִ֖ים אֶת בְּנֵ֣י יִשְׂרָאֵ֑ל לִ/פְנֵ֖י מוֹתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/001.yaml
  text: 'This is the blessing with which Moses[a], the man of God, blessed the sons of Israel before his death:'
translation:
  language: ta
  text: 'தேவனுடைய மனிதரான மோசே, தம் இறப்பதற்கு முன் இஸ்ரவேலின் மகன்களை[a] ஆசீர்வதித்த ஆசீர்வாதம் இதுவே:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரேயத்தில், “இஸ்ரவேலின் மகன்கள்”; இது இஸ்ரவேல் மக்களை மொத்தமாகக் குறிக்கும் வழக்கமான கூட்டுச் சொற்றொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזֹאת
  choice: இதுவே
  rationale: புதிய பகுதியை அறிமுகப்படுத்தும் சுட்டுப்பெயரின் வலியுறுத்தலை இயல்பான தமிழில் வெளிப்படுத்துகிறது; எபிரேயத்தில் காலத்தைக் குறிக்கும் தனியான ‘இப்போது’ இல்லாததால் அது சேர்க்கப்படவில்லை.
- source_word: הַבְּרָכָה
  choice: ஆசீர்வாதம்
  rationale: முறைப்படியான ஆசீர்வாத உரையைச் சுட்டும் பெயர்ச்சொல்லுக்கு இயல்பான தமிழ் இணை.
- source_word: אֲשֶׁר בֵּרַךְ
  choice: ஆசீர்வதித்த
  rationale: ‘ஆசீர்வாதம்’ என்ற பெயர்ச்சொல்லை விளக்கும் தொடர்புச் சொல்லமைப்பைத் தமிழில் சுருக்கமாகவும் தெளிவாகவும் வழங்குகிறது.
- source_word: אִישׁ הָאֱלֹהִים
  choice: தேவனுடைய மனிதனாகிய
  rationale: இறைவனால் நியமிக்கப்பட்ட ஒருவரைக் குறிக்கும் எபிரேய பட்டத்தின் தனிப்பட்ட ஆண்பால் வடிவத்தையும் உறவையும் நேரடியாகப் பாதுகாக்கிறது.
- source_word: אֶת בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் மகன்களை
  rationale: எபிரேயத்தின் குடும்ப உறவைக் குறிக்கும் ‘இஸ்ரவேலின் மகன்கள்’ என்ற ஆண்பால் பன்மை வடிவத்தைப் பாதுகாக்கிறது; இது இஸ்ரவேல் மக்களைக் கூட்டாகக் குறிக்கும் வழக்கமான சொற்றொடர் என்பதை அடிக்குறிப்பு விளக்குகிறது.
- source_word: לִפְנֵי מוֹתוֹ
  choice: தன் மரணத்திற்கு முன்
  rationale: மோசேயின் மரணத்திற்கு முந்தைய காலத்தைச் சுட்டும் மூலமொழியின் பெயர்ச்சொல் அமைப்பை இயல்பான தமிழில் பாதுகாக்கிறது.
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל என்ற பாலினக் குறியீடுள்ள கூட்டுச் சொல்லின் மொழிபெயர்ப்பு
  choice: இஸ்ரவேலின் மகன்களை
  alternative: இஸ்ரவேல் மக்களை / இஸ்ரவேலர்களை
  rationale: மூலமொழியின் ‘மகன்கள்’ என்ற குடும்ப மற்றும் ஆண்பால் வடிவம் மறைக்கப்படாமல் வைக்கப்படுகிறது. அதேவேளையில், இச்சொற்றொடர் இஸ்ரவேல் மக்களை மொத்தமாகக் குறிக்கும் வழக்கமான கூட்டுப் பயன்பாடு என்பதை அடிக்குறிப்பு தெளிவுபடுத்துகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘தேவனுடைய மனிதன்’ என்ற பட்டமும் ‘இஸ்ரவேலின் மகன்கள்’ என்ற குடும்பச் சொல்லாட்சியும் மூலத்தின் வடிவத்தை வெளிப்படையாக வைத்திருக்கின்றன.
