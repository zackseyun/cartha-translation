lexical_decisions:
- source_word: מֶגֶד
  choice: மிகச் சிறந்த
  rationale: இந்த ஆசீர்வாதச் சூழலில் இச்சொல் அருமை, மேன்மை, விலைமதிப்புள்ள வளம் ஆகியவற்றைக் குறிக்கிறது. இரு இணைச் சொற்றொடர்களிலும் இதன் மறுபயன்பாட்டைத் தமிழ் மொழிபெயர்ப்பு தக்கவைக்கிறது.
- source_word: תְּבוּאֹת
  choice: விளைபொருள்கள்
  rationale: நிலம் விளைவிக்கும் பலவகை வேளாண் பொருள்களையும் உள்ளடக்கும் பரந்த, இயல்பான தமிழ்ச் சொல்.
- source_word: שָׁמֶשׁ
  choice: சூரியன்
  rationale: வேளாண் வளர்ச்சிக்கு ஆதாரமாகச் சூரியன் இங்கு சித்தரிக்கப்படுகிறது; எபிரெயச் சொல்லின் நேரடிப் பொருள் தக்கவைக்கப்படுகிறது.
- source_word: גֶּרֶשׁ
  choice: மகசூல்
  rationale: அரிதாக வரும் இச்சொல் வெளிக்கொணரப்படுவது அல்லது விளைவிக்கப்படுவது என்ற பொருளைக் கொண்டது. வேளாண் இணைநிலைக்கு ‘மகசூல்’ இயல்பாகப் பொருந்துகிறது.
- source_word: יְרָחִים
  choice: மாதங்கள்
  rationale: இச்சொல் நிலாவுடன் சொற்பிறப்புத் தொடர்புடையதாக இருந்தாலும், வழக்கமாக கால அளவான ‘மாதங்கள்’ என்பதையே குறிக்கிறது.
