translation_notes:
  register: நவீனத் தரமான, கண்ணியமான தமிழில் வேளாண் இணைநிலையும் எபிரெய மூலத்தில் மֶגֶד இருமுறை வருவதும் தக்கவைக்கப்பட்டுள்ளன. முந்தைய வசனத்திலிருந்து தொடரும் ஆசீர்வாதப் பட்டியலைக் காட்ட இறுதியில் நிறுத்தக்குறிக்குப் பதிலாக காற்புள்ளி பயன்படுத்தப்பட்டுள்ளது.
