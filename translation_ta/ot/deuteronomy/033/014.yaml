  - marker: a
    text: அல்லது, “சூரியனின் அரிய பொருள்களாலும்.”
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில் “மாதங்கள்”; இச்சொல் நிலாவுடன் தொடர்புடையது. மாதந்தோறும் தோன்றும் விளைச்சலை இது நினைவூட்டலாம்.
