source:
  edition: WLC
  text: וַ/יַּ֤רְא רֵאשִׁית֙ ל֔/וֹ כִּי שָׁ֛ם חֶלְקַ֥ת מְחֹקֵ֖ק סָפ֑וּן וַ/יֵּתֵא֙ רָ֣אשֵׁי עָ֔ם צִדְקַ֤ת יְהוָה֙ עָשָׂ֔ה וּ/מִשְׁפָּטָ֖י/ו עִם יִשְׂרָאֵֽל־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/021.yaml
  text: He chose the best land for himself[a], because there the portion of the ruler was reserved. He came with the heads of the people; he carried out the righteousness of Yahweh[b], and his judgments with Israel.
translation:
  language: ta
  text: அவன் தனக்காக மிகச் சிறந்த நிலப்பகுதியைத் தேர்ந்தெடுத்தான்[a]; ஏனெனில் அங்கே ஆட்சியாளருக்குரிய பங்கு ஒதுக்கிவைக்கப்பட்டிருந்தது. அவன் மக்களின் தலைவர்களோடு வந்தான்; யாவேயின் நீதியைச் செயல்படுத்தினான்[b], இஸ்ரவேலோடு சேர்ந்து அவருடைய நியாயத்தீர்ப்புகளையும் நிறைவேற்றினான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அவன் தனக்காக முதல் பகுதியைத் தேர்ந்தெடுத்தான்’ என்றும் மொழிபெயர்க்கலாம். மேலும், ‘ஆட்சியாளர்’ என்பதற்குப் பதிலாக ‘சட்டம் அளிப்பவர்’ என்றும் பொருள் கொள்ளலாம்; அது மோசேயைக் குறிக்கிறது எனச் சிலர் கருதுகின்றனர்.
    reason: alternative_reading
  - marker: b
    text: ‘யாவேயின் நியாயத்தை’ அல்லது ‘யாவேயின் நீதியான செயல்களை’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: தேர்ந்தெடுத்தான்
  rationale: வினைச்சொல்லின் அடிப்படைப் பொருள் ‘பார்த்தான்’ என்றாலும், ‘தனக்காகப் பார்த்துக்கொண்டான்’ என்ற இச்சூழலிலுள்ள மரபுத்தொடர் தேர்ந்தெடுத்தலைக் குறிக்கிறது.
- source_word: רֵאשִׁית
  choice: மிகச் சிறந்த நிலப்பகுதி
  rationale: காத்துக்குக் கிடைத்த நிலப்பங்கின் முதன்மையான அல்லது சிறப்பான பகுதியை இங்கு குறிக்கிறது; தமிழில் நிலப்பரப்பு சார்ந்த பொருளைத் தெளிவாக்குகிறது.
- source_word: מְחֹקֵק
  choice: ஆட்சியாளர்
  rationale: இச்சொல் ஆட்சியாளர் அல்லது சட்டம் அளிப்பவர் எனப் பொருள்படலாம். குறிப்பிட்ட நபரை அடையாளப்படுத்தாமல், இக்கவிதைச் சூழலில் அதிகாரமுள்ள தலைவரைக் குறிக்கும் பொதுவான சொல்லைத் தேர்ந்தெடுக்கிறது.
- source_word: סָפוּן
  choice: ஒதுக்கிவைக்கப்பட்டிருந்தது
  rationale: மறைத்து அல்லது சேமித்து வைக்கப்பட்டிருந்த பங்கு என்ற கருத்தை, நில ஒதுக்கீட்டுச் சூழலில் இயல்பாகத் தெரிவிக்கிறது.
- source_word: רָאשֵׁי עָם
  choice: மக்களின் தலைவர்கள்
  rationale: ‘மக்களின் தலைகள்’ என்ற எபிரெய உருவகம் நடைமுறைப் பொருளில் மக்களின் தலைவர்களைக் குறிக்கிறது.
- source_word: צִדְקַת יְהוָה
  choice: யாவேயின் நீதி
  rationale: நீதி, நியாயம், அல்லது நீதியான செயல்கள் எனப் பொருள்படக்கூடிய சொற்றொடரின் அடிப்படைத் தெளிவின்மையைப் பாதுகாக்கிறது.
- source_word: וּמִשְׁפָּטָיו
  choice: அவருடைய நியாயத்தீர்ப்புகள்
  rationale: யாவேயுடைய நீதிசார் தீர்ப்புகள் அல்லது நியமங்களை நேரடியாகவும் கண்ணியமாகவும் எடுத்துரைக்கிறது.
- source_word: עִם יִשְׂרָאֵל
  choice: இஸ்ரவேலோடு சேர்ந்து
  rationale: ‘இஸ்ரவேலுடன்’ என்ற எபிரெய முன்னிடைச்சொல்லின் கூட்டுச் செயல் உணர்வை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: מְחֹקֵק என்பவரின் அடையாளமும் பொருளும்
  choice: குறிப்பிட்ட நபராக அடையாளப்படுத்தாமல் ‘ஆட்சியாளர்’ என மொழிபெயர்க்கப்பட்டது.
  alternative: ‘சட்டம் அளிப்பவர்’; இது மோசேயைக் குறிக்கலாம் எனச் சிலர் கருதுகின்றனர்.
  rationale: எபிரெயச் சொற்றொடர் சுருக்கமாகவும் விவாதத்திற்குரியதாகவும் உள்ளது. மூலத்தில் கட்டாயப்படுத்தப்படாத மோசே என்ற அடையாளத்தை உரைக்குள் சேர்க்காமல், அதன் அதிகாரத்துக்குரிய பொருளைப் பாதுகாக்கிறது.
- issue: צִדְקַת יְהוָה என்பதன் எண்ணும் கருத்தும்
  choice: ‘யாவேயின் நீதி’ என ஒருமைச் சொல்லாக்கம் வைக்கப்பட்டது.
  alternative: ‘யாவேயின் நியாயம்’ அல்லது ‘யாவேயின் நீதியான செயல்கள்’.
  rationale: இச்சொற்றொடர் யாவேயின் நீதிப் பண்பையோ அவரது நீதியான செயல்களையோ குறிக்கலாம்; முதன்மை உரை அந்தத் theological tension-ஐ தீர்மானமாகக் குறுக்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், கவிதையின் கண்ணியத்தையும் சுருக்கத்தையும் காக்கும் நடை பயன்படுத்தப்பட்டது. ‘யாவே’ என்ற தனிப்பெயர் יהוה என்பதைக் குறிக்கிறது. நிலப்பங்கீட்டுச் சூழல் தெளிவாக இருக்க ‘நிலப்பகுதி’ சேர்க்கப்பட்டது; விவாதத்திற்குரிய மாற்றுப் பொருள்கள் அடிக்குறிப்புகளில் பாதுகாக்கப்பட்டன.
