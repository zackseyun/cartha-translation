base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/024.yaml
  text: 'And of Asher he said: “Most blessed of sons is Asher[a]; may he be favored by his brothers[c][b], and may he dip his foot in oil.”'
translation:
  language: ta
  text: 'ஆசேரைக் குறித்து அவர் சொன்னார்:


    “மகன்களிலே மிகவும் ஆசீர்வதிக்கப்பட்டவன் ஆசேர்[a];


    அவன் தன் சகோதரர்களால் விரும்பப்படுபவனாக இருப்பானாக[b];


    தன் காலை எண்ணெயில் தோய்ப்பானாக[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மகன்களைவிட அதிகமாக ஆசீர்வதிக்கப்பட்டவன் ஆசேர்.” எபிரெய ஒப்பீட்டுத் தொடரை ஒப்பீடாகவோ மிகையுயர்வாகவோ புரிந்துகொள்ளலாம்.
    reason: lexical_alternative
  - marker: b
    text: “அவனுடைய சகோதரர்கள்” என்பது யாக்கோபின் மற்ற மக்களையும், அவர்களிடமிருந்து வந்த இஸ்ரவேலின் மற்ற கோத்திரங்களையும் குறிக்கலாம்.
    reason: cultural_note
  - marker: c
    text: காலை எண்ணெயில் தோய்த்தல் என்ற உருவகம் மிகுந்த வளத்தையோ செழிப்பையையோ உணர்த்தக்கூடும்; முதன்மை உரை எபிரெய உருவகத்தை அப்படியே வைத்துள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְאָשֵׁר אָמַר
  choice: ஆசேரைக் குறித்து அவர் சொன்னது
  rationale: לְ முன்னொட்டு அடுத்த கோத்திரத்துக்குரிய ஆசீர்வாதத்தை அறிமுகப்படுத்துகிறது. தமிழில் ‘குறித்து’ என்பது இயல்பாகவும், உரையின் தொடரமைப்புக்கு ஏற்றதாகவும் உள்ளது.
- source_word: בָּרוּךְ מִבָּנִים
  choice: மகன்களுக்குள் மிகவும் ஆசீர்வதிக்கப்பட்டவன்
  rationale: מִן கொண்ட இத்தொடர் ஒப்பீட்டு அல்லது மிகையுயர்வு பொருளைத் தரலாம். முதன்மை உரையில் மிகையுயர்வு வாசிப்பு இயல்பான தமிழில் தரப்பட்டு, மாற்று வாசிப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: יְהִי רְצוּי אֶחָיו
  choice: அவன் தன் சகோதரர்களின் ஆதரவைப் பெறுவானாக
  rationale: רְצוּי என்பது ஏற்றுக்கொள்ளப்படுதல் அல்லது சாதகமான அங்கீகாரம் பெறுதல் என்பதைக் குறிக்கிறது. ‘ஆதரவைப் பெறுதல்’ சகோதரர்களுடனான உறவுச் சூழலில் இயல்பான தமிழாக உள்ளது; יְהִי என்பதன் வாழ்த்துவடிவமும் ‘பெறுவானாக’ எனப் பேணப்படுகிறது.
- source_word: וְטֹבֵל בַּשֶּׁמֶן רַגְלוֹ
  choice: தன் காலைக் எண்ணெயில் தோய்ப்பானாக
  rationale: எபிரெய உரையின் ஒருமை ‘கால்’ மற்றும் செழிப்பை உணர்த்தக்கூடிய தெளிவான உருவகம் இரண்டும் விளக்கமாக மாற்றப்படாமல் அப்படியே பாதுகாக்கப்படுகின்றன. கவிதை இணைப்பில் பங்கேற்புவினை வாழ்த்துப் பொருளுடன் மொழிபெயர்க்கப்படுகிறது.
theological_decisions:
- issue: ‘தன் காலைக் எண்ணெயில் தோய்ப்பான்’ என்ற ஆசீர்வாத உருவகத்தின் பொருள்
  choice: உருவகத்தை முதன்மை உரையில் சொல்லுக்குநெருக்கமாக வைத்தல்
  alternative: ஒலிவ எண்ணெய் வளம், வேளாண் செழிப்பு, வசதி அல்லது பிரதேச வளமை என்று நேரடியாக விளக்குதல்
  rationale: உருவகம் வளமையையோ செழிப்பையையோ சுட்டலாம்; ஆனால் எபிரெய உரை அதன் குறிப்பிட்ட பொருளைத் தீர்மானிக்கவில்லை. ஆகவே கவித்துவ மற்றும் விளக்கவியல் திறந்தநிலை பேணப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘பெறுவானாக’, ‘தோய்ப்பானாக’ ஆகிய வடிவங்கள் ஆசீர்வாதத்தின் விருப்ப/வேண்டுதல் நயத்தைத் தக்கவைக்கின்றன.
