base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/009.yaml
  text: who said of his father and his mother[a], ‘I have not seen him,’ and did not acknowledge his brothers or know his sons; for they kept your word and guarded your covenant.
translation:
  language: ta
  text: தன் தந்தையையும் தாயையும் குறித்து, ‘அவனை நான் பார்க்கவில்லை’[a] என்று சொன்னவனும், தன் சகோதரர்களை அங்கீகரிக்கவில்லை; தன் மகன்களை அறியவில்லை; ஏனெனில் அவர்கள் உமது சொல்லைக் கடைப்பிடித்து, உமது உடன்படிக்கையைக் காத்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எழுத்துப்படி, “அவனை நான் பார்க்கவில்லை.” இச்சூழலில், “அவனை நான் பொருட்படுத்தவில்லை” அல்லது “அவனைக் கவனத்தில் கொள்ளவில்லை” என்பது கருத்தாக இருக்கலாம்; உடன்படிக்கைக்கு உண்மையாய் இருப்பது குடும்ப உறவுகளைவிட முன்னுரிமை பெற்றதை இது குறிக்கிறது.
    reason: ראה என்ற வினையின் நேரடிப் பொருளையும் இச்சூழலில் அதன் சாத்தியமான உறவுசார் பொருளையும் இரண்டையும் பாதுகாக்க.
lexical_decisions:
- source_word: הָאֹמֵר
  choice: என்று சொன்னவனும்
  rationale: முன்னுள்ள லேவியைக் குறிக்கும் பெயர்ச்சொல் தன்மையுள்ள வினையெச்சத்தைத் தமிழில் இயல்பான தொடர்புத் தொடராக வழங்குகிறது.
- source_word: לְאָבִיו וּלְאִמּוֹ
  choice: தன் தகப்பனையும் தாயையும் குறித்து
  rationale: אמר உடன் வரும் ל ஒருவரைக் குறித்து உரைப்பதைக் குறிக்கலாம்; குடும்ப உறவுகளைப் பற்றிய மறுப்பே இங்கு சூழலுக்குப் பொருந்துகிறது.
- source_word: לֹא רְאִיתִיו
  choice: அவனை நான் பார்க்கவில்லை
  rationale: ראה என்பதன் அடிப்படைப் பொருளான ‘பார்’ என்பதைப் பாதுகாக்கிறது; சூழலில் ‘பொருட்படுத்தவில்லை’ என்ற உறவுசார் உட்பொருள் இருக்கலாம் என்பதால் அதை அடிக்குறிப்பில் தருகிறது.
- source_word: הִכִּיר
  choice: ஏற்றுக்கொள்ளாமலும்
  rationale: இங்கு வெறும் அடையாளம் காணுதலைவிட குடும்ப உறவினராக அங்கீகரித்தல் அல்லது ஏற்றுக்கொள்ளுதல் என்பதே பொருத்தமானது.
- source_word: אֶחָיו
  choice: தன் சகோதரர்களை
  rationale: எபிரெயச் சொல்லின் ஆண்பால் பன்மைத் துல்லியத்தைப் பாதுகாக்கிறது.
- source_word: בָּנָיו
  choice: தன் மகன்களை
  rationale: மூலத்தில் குறிப்பாக ‘மகன்கள்’ என்று இருப்பதால் அதையே வழங்குகிறது.
- source_word: יָדָע
  choice: அறியாமலும்
  rationale: ידע என்பதன் அடிப்படைச் சொல்லாட்சியைப் பாதுகாக்கிறது; இணைத் தொடரில் இது உறவுசார் அங்கீகார மறுப்பை உணர்த்துகிறது.
- source_word: שָׁמְרוּ
  choice: கடைப்பிடித்து
  rationale: தேவனுடைய சொல்லை அனுசரித்து ஒழுகுதல் என்ற உடன்படிக்கைச் சூழலுக்குப் பொருத்தமான இயல்பான தமிழ்.
- source_word: אִמְרָתֶךָ
  choice: உமது சொல்லை
  rationale: ‘சொல்/உரை’ என்ற பொருளைத் தருகிறது; குறிப்பிட்ட ஒரு கட்டளையாகத் தேவையின்றி சுருக்கவில்லை.
- source_word: בְּרִיתְךָ
  choice: உமது உடன்படிக்கையை
  rationale: ברית என்பதற்கான நிலையான, தெளிவான தமிழ் வேதாகமச் சொல்.
- source_word: יִנְצֹרוּ
  choice: காத்தார்கள்
  rationale: שמר உடனான இணைத்தன்மையையும் נצר-இன் காத்துப் பாதுகாத்தல் நிழற்பொருளையும் தக்கவைக்கிறது.
theological_decisions:
- issue: ஒருமை மற்றும் பன்மை வடிவங்களின் குறிப்பிடுபவர்
  choice: லேவியை/லேவியரை ஒருங்கிணைந்த சமூகமாகக் காட்டி, மூலத்திலுள்ள ஒருமையிலிருந்து பன்மைக்கான மாற்றத்தைத் தக்கவைத்தல்
  alternative: எல்லா வடிவங்களையும் ஒருமையாகவோ பன்மையாகவோ ஒரேமாதிரியாக்குதல்
  rationale: எபிரெயம் முதலில் பிரதிநிதித்துவ ஒருமையைப் பயன்படுத்தி, காரணத் தொடரில் ‘அவர்கள்’ என்ற பன்மைக்கு மாறுகிறது. லேவியைப் பற்றிய ஆசீர்வாதத்தில் உள்ள இந்த உண்மையான இலக்கண மற்றும் இறையியல் இழுப்பை மொழிபெயர்ப்பு மறைக்கக்கூடாது.
- issue: ‘பார்க்கவில்லை’ என்பதன் குடும்ப விசுவாசச் சூழல்
  choice: முதன்மை உரையில் நேரடியான ‘பார்க்கவில்லை’ என்பதை வைத்து, ‘பொருட்படுத்தவில்லை/கவனத்தில் கொள்ளவில்லை’ என்ற சாத்தியமான பொருளை அடிக்குறிப்பில் விளக்குதல்
  alternative: முதன்மை உரையிலேயே ‘பொருட்படுத்தவில்லை’ என்று பொருள்விளக்கமாக மொழிபெயர்த்தல்
  rationale: மூல வினையின் நேரடிப் படிமத்தைப் பாதுகாத்தபடியே, உடன்படிக்கை விசுவாசம் குடும்ப உரிமைகளைவிட முன்னுரிமை பெற்ற சூழலை வாசகருக்குத் தெளிவுபடுத்துகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. ‘உமது’, ‘உடன்படிக்கை’ போன்ற சொற்கள் வேதாகமப் பதிவின் உயர்நிலையைப் பேணுகின்றன. மூலத்திலுள்ள ஒருமை—பன்மை மாற்றம் திட்டமிட்டு தக்கவைக்கப்பட்டுள்ளது.
