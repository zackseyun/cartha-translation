revisions:
- from: தன் தகப்பனையும் தாயையும் குறித்து, ‘அவனை நான் பார்க்கவில்லை’[a] என்று சொன்னவனும், தன் சகோதரர்களை ஏற்றுக்கொள்ளாமலும் தன் மகன்களை அறியாமலும் இருந்தவனும் அவனே; ஏனெனில், அவர்கள் உமது சொல்லைக் கடைப்பிடித்து, உமது உடன்படிக்கையைக் காத்தார்கள்.
  to: தன் தந்தையையும் தாயையும் குறித்து, ‘அவனை நான் பார்க்கவில்லை’[a] என்று சொன்னவனும், தன் சகோதரர்களை அங்கீகரிக்கவில்லை; தன் மகன்களை அறியவில்லை; ஏனெனில் அவர்கள் உமது சொல்லைக் கடைப்பிடித்து, உமது உடன்படிக்கையைக் காத்தார்கள்.
  rationale: மூலத்தில் இல்லாத ‘அவனே’ நீக்கப்பட்டுள்ளது. நவீன நிலையான பயன்பாட்டிற்காக ‘தகப்பன்’ ‘தந்தை’ என மாற்றப்பட்டுள்ளது. הִכִּיר மற்றும் ידע ஆகியவற்றின் இணையான மறுப்பு வடிவங்கள் தமிழில் தெளிவாகத் தரப்பட்டுள்ளன; மூலத்தின் ஒருமையிலிருந்து பன்மைக்கான மாற்றமும், அடிக்குறிப்பு நங்கூரமும் பாதுகாக்கப்பட்டுள்ளன.
