  source_fidelity: மூலத்தின் பிரதிநிதித்துவ ஒருமை வடிவங்களும் இறுதியில் வரும் பன்மை வினைச்சொற்களும் சரியாகப் பிரதிபலிக்கப்படுகின்றன. ‘பார்க்கவில்லை’ என்பது ראה-வின் நேரடிப் பொருளைத் தக்கவைக்கிறது; அடிக்குறிப்பு சூழல்சார் பொருளைத் தகுந்த எச்சரிக்கையுடன் விளக்குகிறது. ஆனால் ‘அவனே’ என்பது மூலத்தில் இல்லாத வலியுறுத்தலையும் முதன்மை வாக்கியத் தொடர்பையும் சேர்க்கிறது.
  naturalness: ‘தன் தகப்பனையும் தாயையும்’ என்பதற்குப் பதில் நவீன நிலையான தமிழில் ‘தன் தந்தையையும் தாயையும்’ இயல்பாகும். மேலும், ‘ஏற்றுக்கொள்ளாமலும் ... அறியாமலும் இருந்தவனும் அவனே’ என்ற அமைப்பு கனமாகவும் தேவையற்ற இணைப்பு/வலியுறுத்தலுடனும் உள்ளது. நேரடியான மறுப்பு வினைத் தொடர்கள் தெளிவானவை.
