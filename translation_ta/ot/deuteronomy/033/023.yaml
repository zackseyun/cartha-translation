  text: וּ/לְ/נַפְתָּלִ֣י אָמַ֔ר נַפְתָּלִי֙ שְׂבַ֣ע רָצ֔וֹן וּ/מָלֵ֖א בִּרְכַּ֣ת יְהוָ֑ה יָ֥ם וְ/דָר֖וֹם יְרָֽשָׁ/ה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/023.yaml
  text: 'And of Naphtali he said: “Naphtali[a], satisfied with favor and full of the blessing of Yahweh, possess the sea and the south.”'
translation:
  language: ta
  text: 'நப்தலியைக் குறித்து அவர் கூறினார்:


    “நப்தலியே,

    தயவால் திருப்தியடைந்தவனே,

    யாவேயின் ஆசீர்வாதத்தால் நிரம்பியவனே,

    கடலையும்[a] தெற்கையும் உரிமையாக்கிக்கொள்.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மேற்கையும் தெற்கையும்”; எபிரெயத்தில் “கடல்” என்ற சொல் மேற்குத் திசையையும் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְנַפְתָּלִי
  choice: நப்தலியைக் குறித்து
  rationale: לְ முன்னொட்டு இங்கு கோத்திர ஆசீர்வாதத்தின் பொருளை அறிமுகப்படுத்துகிறது; இயல்பான நவீனத் தமிழில் ‘குறித்து’ என்பது இதைத் தெளிவாகத் தெரிவிக்கிறது.
- source_word: אָמַר
  choice: அவர் சொன்னது
  rationale: אָמַר என்பதன் எளிய உரைநடைப் பொருளைப் பேணுகிறது; சூழலில் பேசுபவர் மோசே என்பது முன்பே தெரிகிறது.
- source_word: נַפְתָּלִי
  choice: நப்தலி
  rationale: எபிரெயப் பெயரின் வழக்கமான தமிழ் ஒலிபெயர்ப்பு.
- source_word: שְׂבַע רָצוֹן
  choice: அருளால் நிறைவடைந்தவனே
  rationale: שְׂבַע என்பது முழுமையாகப் பெற்றிருத்தல் அல்லது திருப்தியடைந்திருத்தலைக் குறிக்கிறது; רָצוֹן இங்கு தெய்வீக அருள் அல்லது தயவைக் குறிக்கிறது. அழைப்புமுறையைத் தமிழில் இயல்பாகப் பேணுகிறது.
- source_word: וּמָלֵא בִּרְכַּת יְהוָה
  choice: யாவேயின் ஆசீர்வாதத்தால் நிரம்பியவனே
  rationale: முந்தைய அடியுடன் இணையான பெயரடை அமைப்பையும், ஆசீர்வாதம் நிறைவாகக் கிடைத்திருப்பதையும் வெளிப்படுத்துகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: திருநான்கெழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், எபிரெயத் தெய்வீகப் பெயரின் தமிழ் ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: יָם
  choice: கடல்
  rationale: சொல்லின் நேரடிப் பொருள் ‘கடல்’; ‘மேற்கு’ என்ற திசைப்பொருளும் சாத்தியமாதலால் அது அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: וְדָרוֹם
  choice: தெற்கு
  rationale: தெற்குத் திசை அல்லது தென்பகுதி என்ற இயல்பான பொருளைச் சுருக்கமாக வழங்குகிறது.
- source_word: יְרָשָׁה
  choice: உரிமையாக்கிக்கொள்
  rationale: ירשׁ என்பதன் நிலப்பகுதியைக் கைப்பற்றி உரிமையாகக் கொள்ளும் கட்டளை/ஆசீர்வாதத் தன்மையைத் தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலத்தில் தனிப்பட்ட உடன்படிக்கைப் பெயர் நேரடியாக உள்ளது. அதை பட்டமாக மாற்றாமல் தமிழ் ஒலிபெயர்ப்பில் தருவது மூலத்தின் வேறுபாட்டைப் பேணுகிறது.
- issue: יָם என்பதன் புவியியல் பொருள்
  choice: கடல்
  alternative: மேற்கு
  rationale: நேரடி சொற்பொருள் முதன்மை உரையில் வைக்கப்படுகிறது; திசைப்பொருள் உண்மையான மாற்று வாசிப்பாக அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; கவிதைநயமும் ஆசீர்வாதத்தின் அழைப்புமுறையும் பேணப்பட்டுள்ளன. பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான சொற்கள் பயன்படுத்தப்பட்டுள்ளன.
