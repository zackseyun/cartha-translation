source:
  edition: WLC
  text: בַּרְזֶ֥ל וּ/נְחֹ֖שֶׁת מִנְעָלֶ֑י/ךָ וּ/כְ/יָמֶ֖י/ךָ דָּבְאֶֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/025.yaml
  text: Your bars shall be iron and bronze[a], and as your days[b], so shall your strength be.
translation:
  language: ta
  text: உன் தாழ்ப்பாள்கள் இரும்பும் வெண்கலமுமாய் இருக்கும்[a]; உன் நாட்களுக்கு ஏற்ப உன் வலிமை இருக்கும்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உன் காலணிகள் இரும்பும் வெண்கலமுமாய் இருக்கும்.” எபிரெயச் சொல் காலணியைக் குறிக்கலாம்; உலோகப் படிமத்தையும் பாதுகாப்புச் சூழலையும் முன்னிட்டு பலர் இங்கு அதைத் தாழ்ப்பாள்கள் என்று புரிந்துகொள்கிறார்கள்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “உன் நாட்களுக்கு ஏற்ப உன் இளைப்பாறுதலும் (அல்லது பாதுகாப்பும்) இருக்கும்.” இறுதி எபிரெயச் சொல் அரிதானது; அதன் பொருள் உறுதியாகத் தெரியவில்லை. ஆசீர்வாதச் சூழலுக்குப் பொருந்தும் பாரம்பரிய மொழிபெயர்ப்பு “வலிமை.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּרְזֶל
  choice: இரும்பு
  rationale: இது இவ்வுலோகத்தின் வழக்கமான பொருள்; נְחֹשֶׁת என்பதுடன் இணையாக வருகிறது.
- source_word: נְחֹשֶׁת
  choice: வெண்கலம்
  rationale: வேதாகம எபிரெயத்தில் இது செம்பு அல்லது வெண்கலத்தைப் பொதுவாகக் குறிக்கலாம்; இரும்புடன் வரும் இவ்விணைப்பில் ‘வெண்கலம்’ இயல்பாக உள்ளது.
- source_word: מִנְעָלֶיךָ
  choice: உன் தாழ்ப்பாள்கள்
  rationale: இச்சொல் காலணிகளையும் குறிக்கக்கூடும். எனினும் உலோகப் படிமமும் பாதுகாப்புச் சூழலும் இருப்பதால் இங்கு கதவுத் தாழ்ப்பாள்கள் என்ற பொருள் முதன்மை உரையில் ஏற்கப்படுகிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் வைக்கப்படுகிறது.
- source_word: וּכְיָמֶיךָ
  choice: உன் நாட்களுக்கு ஏற்றபடி
  rationale: כְּ ஒப்புமை அல்லது அளவுக்கேற்ப அமைந்த தொடர்பைக் குறிக்கிறது; ஒருவரின் நாட்களுக்கும் அடுத்து வரும் அருளுக்கும் இடையிலான விகிதத்தை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: דָּבְאֶךָ
  choice: உன் வலிமை
  rationale: இது அரிதானதும் பொருள் உறுதியாகத் தெரியாததுமான சொல். ஆசீர்வாதச் சூழலில் நீடிக்கும் ஆற்றல் என்ற பாரம்பரியப் பொருள் பொருந்துகிறது; ‘இளைப்பாறுதல்/பாதுகாப்பு’ என்ற மாற்றுகள் அடிக்குறிப்பில் பாதுகாக்கப்படுகின்றன.
theological_decisions:
- issue: ஆசீர்வாதத்தின் படிமத்தைப் புரிந்துகொள்ளுதல்
  choice: நீடித்த பாதுகாப்பையும் வாழ்நாள் முழுவதற்கேற்ற வலிமையையும் இவ்வசனம் வாக்களிக்கிறது.
  alternative: இது கடினமான நிலப்பரப்புக்கான உறுதியான காலணிகளையும் தொடர்ந்த வீரியத்தையும் குறிக்கலாம்; இறுதிக் கூறு நாட்களுக்கேற்ற இளைப்பாறுதலையோ பாதுகாப்பையோ குறிக்கவும் கூடும்.
  rationale: கோட்பாட்டு முடிவைத் திணிக்காமல், உலோகத் தாழ்ப்பாள் மற்றும் நீடிக்கும் வலிமை என்ற சூழலுக்கு ஏற்ற வாசிப்பு முதன்மை உரையில் தரப்படுகிறது; உண்மையான சொற்பொருள் ஐயங்கள் அடிக்குறிப்புகளில் வைக்கப்படுகின்றன.
translation_notes:
  register: நவீன தரநிலைத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. எபிரெயச் செய்யுளின் இணை அமைப்பு காக்கப்பட்டு, இயல்பான தமிழுக்காக இரண்டாம் கூறில் ‘உம்’ சேர்க்கப்பட்டது. ‘வெண்கலம்’, ‘தாழ்ப்பாள்’, ‘வலிமை’ ஆகியவை தெளிவான பொதுநடைச் சொற்களாகத் தேர்ந்தெடுக்கப்பட்டன; மூலத்தின் உண்மையான ஐயங்கள் அடிக்குறிப்புகளில் வெளிப்படையாகப் பாதுகாக்கப்பட்டன.
