base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/016.yaml
  text: and with the choicest things of the earth and its fullness[a], and the favor of the one who dwelt in the bush—may it come on the head of Joseph[b], and on the crown of the head of the one set apart from his brothers.
translation:
  language: ta
  text: 'பூமியின் தேர்ந்த நன்மைகளும் அதன் நிறைவும்,


    முட்புதரில் வாசமாயிருந்தவரின் தயவும்[a]


    யோசேப்பின் தலைமீதும்,


    தன் சகோதரர்களிடமிருந்து தனியே பிரிக்கப்பட்டவனின் உச்சந்தலையின்மீதும் வந்தடையட்டும்[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “முட்புதரில் வாசமாயிருந்தவர்” என்பது எரியும் முட்புதரில் கடவுள் மோசேக்குத் தோன்றிய நிகழ்வைச் சுட்டுகிறது.
    reason: historical_allusion
  - marker: b
    text: அல்லது, “தன் சகோதரர்களிடையே முதன்மையானவனின்.” எபிரேயச் சொல் அர்ப்பணிக்கப்பட்டவன் அல்லது தனியே பிரிக்கப்பட்டவன் என்பதைக் குறிக்கிறது; யோசேப்பைக் குறிக்கும் இச்சூழலில், சகோதரர்களிடையே மேன்மை பெற்றவன் என்ற பொருளையும் கொண்டிருக்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: מִמֶּגֶד אֶרֶץ
  choice: பூமியின் மிகச் சிறந்த விளைபொருள்களும்
  rationale: மֶגֶד என்பது ஆசீர்வாதச் சூழலில் விலைமதிப்புள்ள அல்லது மிகச் சிறந்த விளைச்சல்/நன்மைகளைக் குறிக்கிறது. அֶרֶץ உடன் சேர்ந்திருப்பதால், தமிழில் இயல்பாகவும் சூழலுக்கு ஏற்றவாறும் ‘விளைபொருள்கள்’ என வழங்கப்பட்டது.
- source_word: מְלֹאָהּ
  choice: அதில் நிறைந்துள்ள அனைத்தும்
  rationale: எபிரெயச் சொல்லின் ‘அதன் நிறைவு’ என்ற செறிவான உருவகத்தை, சாதாரண நவீனத் தமிழில் தெளிவாக ‘அதில் நிறைந்துள்ள அனைத்தும்’ என வெளிப்படுத்துகிறது.
- source_word: רְצוֹן
  choice: தயவு
  rationale: இங்கு கடவுளின் அன்பான விருப்பத்தையும் அருளான ஆதரவையும் குறிக்கிறது; ‘தயவு’ சுருக்கமாகவும் மரியாதைக்குரியதாகவும் உள்ளது.
- source_word: שֹׁכְנִי סְנֶה
  choice: முட்புதரில் குடியிருந்தவர்
  rationale: שֹׁכְנִי என்பதன் குடியிருத்தல்/வாசம்செய்தல் என்ற பங்கேற்பு வடிவத்தையும், סְנֶה என்பதன் முட்புதர் பொருளையும் காக்கிறது; யாத்திராகமம் 3-இன் தெய்வ வெளிப்பாட்டை விளக்கமாகச் சேர்க்காமல் சுட்டுகிறது.
- source_word: תָּבוֹאתָה
  choice: வந்தடையட்டும்
  rationale: பெண்பால் ஒருமை வினை வடிவம் முன் கூறப்பட்ட ஆசீர்வாதத் தொகுப்பை ஒருமையான முழுமையாகக் கொள்ளலாம். ‘வந்தடையட்டும்’ வாழ்த்துரை/ஆசீர்வாதத்தின் வலிமையை இயல்பான தமிழில் தருகிறது.
- source_word: לְרֹאשׁ יוֹסֵף
  choice: யோசேப்பின் தலைமீதும்
  rationale: எபிரெய ஆசீர்வாத மரபுச் சொல்லாட்சியை நேரடியாகவும் இயல்பாகவும் காக்கிறது.
- source_word: קָדְקֹד
  choice: உச்சந்தலை
  rationale: தலையின் மேற்பகுதி அல்லது crown என்ற உடற்பகுதியைத் துல்லியமாகக் குறிக்கும் இயல்பான தமிழ்ச் சொல்; இணைவரியின் உடலியல் உருவகத்தையும் காக்கிறது.
- source_word: נְזִיר אֶחָיו
  choice: தன் சகோதரர்களிடமிருந்து தனியே பிரித்துவைக்கப்பட்டவன்
  rationale: נְזִיר என்பதன் அடிப்படைப் பொருளான தனியே பிரிக்கப்பட்ட/அர்ப்பணிக்கப்பட்ட நிலையை முன்னிறுத்துகிறது; ‘இளவரசன்’ என்ற சாத்தியமான மேன்மைப் பொருளை முதன்மை உரையில் கட்டாயப்படுத்தவில்லை.
theological_decisions:
- issue: ‘முட்புதரில் குடியிருந்தவர்’ என்பவரின் அடையாளம்
  choice: முட்புதரில் மோசேக்குத் தம்மை வெளிப்படுத்திய கடவுளைக் குறிக்கும் மறைமுகத் தெய்வப் பெயராக மொழிபெயர்த்தல்
  alternative: சீனாய்/ஓரேபுடன் தொடர்புடைய பொதுவான தெய்வத் தோற்றத்தைக் குறித்தல்
  rationale: இந்தச் சொற்றொடர் யாத்திராகமம் 3-ஐ வலுவாக நினைவூட்டுகிறது. இருப்பினும் பெயரை உரைக்குள் சேர்க்காமல், மூலத்தின் மறைமுகமான சொல்லாட்சியையும் இலக்கியச் சுட்டையும் காக்கிறது.
- issue: נְזִיר אֶחָיו என்பதன் பொருள்
  choice: சகோதரர்களிடமிருந்து தனியே பிரித்துவைக்கப்பட்டவன்
  alternative: சகோதரர்களில் முதன்மையானவன் அல்லது அவர்களிடையே இளவரசன்
  rationale: இந்தச் சொல் அர்ப்பணிப்பு/பிரித்துவைப்பு மற்றும் மேன்மை ஆகிய இரு நிழற்பொருள்களையும் ஏற்கக்கூடும். முதன்மை உரை அதன் அடிப்படைச் சொல்லியல் பொருளைக் காக்கிறது; மேன்மைப் பொருள் அடிக்குறிப்பில் குறிப்பிடப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், கவிதைநயமும் ஆசீர்வாதத் தொனியும் காக்கப்பட்டுள்ளன. ‘விளைபொருள்கள்’, ‘தயவு’, ‘உச்சந்தலை’ போன்ற பொதுவாகப் புரியும் சொற்கள் பயன்படுத்தப்பட்டன; பழமையான அல்லது குறிப்பிட்ட சமயப்பிரிவு சார்ந்த சொற்கள் தவிர்க்கப்பட்டன. அடிக்குறிப்பு குறிகள் முதன்மை உரையில் [a], [b] என இடம்பெற்றுள்ளன.
