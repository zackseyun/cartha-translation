revisions:
- from: தொன்றுதொட்டிருக்கிற தேவனே உறைவிடம்[a]; கீழே நித்திய கரங்கள் இருக்கின்றன. அவர் உனக்கு முன்பாக எதிரியைத் துரத்திவிட்டு, “அழித்துவிடு!” என்றார்.
  to: பண்டைக்காலத்தின் தேவனே உறைவிடம்[a]; கீழே நித்திய கரங்கள் இருக்கின்றன. அவர் உன் முன்னிலையிலிருந்து எதிரியை விரட்டினார்; “அழித்துவிடு!” என்றார்.
  rationale: The revision distinguishes the direct temporal sense of אֱלֹהֵי קֶדֶם from the traditional interpretive sense “eternal God,” preserving the source-level ambiguity and the English POB audit trail. It also renders מִפָּנֶיךָ more explicitly while retaining the verse’s concise poetic movement and forceful command.
