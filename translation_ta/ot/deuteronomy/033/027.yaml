source:
  edition: WLC
  text: מְעֹנָה֙ אֱלֹ֣הֵי קֶ֔דֶם וּ/מִ/תַּ֖חַת זְרֹעֹ֣ת עוֹלָ֑ם וַ/יְגָ֧רֶשׁ מִ/פָּנֶ֛י/ךָ אוֹיֵ֖ב וַ/יֹּ֥אמֶר הַשְׁמֵֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/027.yaml
  text: The God of old is a dwelling place[a], and underneath are everlasting arms. He drove out the enemy before you, and said, ‘Destroy!’
translation:
  language: ta
  text: பண்டைக்காலத்தின் தேவனே உறைவிடம்[a]; கீழே நித்திய கரங்கள் இருக்கின்றன. அவர் உன் முன்னிலையிலிருந்து எதிரியை விரட்டினார்; “அழித்துவிடு!” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நித்திய தேவனே உன் அடைக்கலம்.” எபிரெயச் சொற்றொடரை இந்தப் பாரம்பரியமான, அதிக விளக்கமளிக்கும் பொருளிலும் புரிந்துகொள்ளலாம்; ஆனால் அதன் நேரடியான பொருள், “பண்டைக்காலத்தின் தேவனே உறைவிடம்” என்பதாகும்.
    reason: alternative_reading
lexical_decisions:
- source_word: מְעֹנָה
  choice: உறைவிடம்
  rationale: இந்தப் பெயர்ச்சொல் குடியிருக்கும் அல்லது அடைக்கலம் அளிக்கும் இடத்தைக் குறிக்கிறது. ‘உறைவிடம்’ என்ற சொல், அதை முழுவதுமாக உருவகமான ‘அடைக்கலம்’ என்று விளக்கிவிடாமல் மூல உருவகத்தைப் பாதுகாக்கிறது.
- source_word: אֱלֹהֵי קֶדֶם
  choice: தொன்றுதொட்டிருக்கிற தேவன்
  rationale: קֶדֶם இங்கு பழங்காலம் அல்லது முற்காலத்தைச் சுட்டும் காலப் பொருளில் வருகிறது. இயல்பான நவீன தமிழில், தேவன் தொன்றுதொட்டு இருப்பவர் என்ற கருத்தை இது வெளிப்படுத்துகிறது; ‘நித்திய தேவன்’ என்ற பாரம்பரியமான விளக்கப் பொருள் அடிக்குறிப்பில் வைக்கப்படுகிறது.
- source_word: וּמִתַּחַת
  choice: கீழே
  rationale: இது இடஞ்சார்ந்த முன்னிடைச்சொல் தொடர். முன் வரும் உறைவிட உருவகத்துடன் இணைந்து, தாங்கும் கரங்கள் கீழே இருப்பதை இயல்பாகக் கூறுகிறது.
- source_word: זְרֹעֹת עוֹלָם
  choice: நித்திய கரங்கள்
  rationale: זְרֹעֹת என்பதன் நேரடிப் பொருள் ‘கரங்கள்’; இங்கு வலிமையையும் தாங்குதலையும் உருவகப்படுத்துகிறது. עוֹלָם நீடித்த, முடிவற்ற தன்மையைச் சுட்டுவதால் ‘நித்திய’ பொருத்தமானது.
- source_word: וַיְגָרֶשׁ
  choice: அவர் ... துரத்திவிட்டு
  rationale: גרש என்பது விரட்டுதல் அல்லது வெளியேற்றுதல் எனப் பொருள்படும். ‘துரத்திவிட்டு’ என்பது இராணுவச் சூழலில் வலிமையையும் அடுத்த கட்டளையுடனான தொடர்ச்சியையும் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: מִפָּנֶיךָ
  choice: உனக்கு முன்பாக
  rationale: நேரடியாக ‘உன் முகத்திலிருந்து/உன் முன்னிலையிலிருந்து’ என்றாலும், இங்கு இஸ்ரவேலின் முன்னேற்றப் பாதையிலிருந்து எதிரி அகற்றப்படுவதைச் சுட்டுகிறது.
- source_word: אוֹיֵב
  choice: எதிரியை
  rationale: எபிரெயத்தில் ஒருமையாக உள்ளது; அது கூட்டுப்பொருளிலும் அமையலாம். தமிழ் ஒருமை வடிவம் மூலத்தின் வடிவத்தையும் சாத்தியமான கூட்டுப்பொருளையும் பாதுகாக்கிறது.
- source_word: וַיֹּאמֶר
  choice: என்றார்
  rationale: எளிய கதைத் தொடர்ச்சி. முந்தைய வாக்கியத்தின் எழுவாயான தேவனே இங்கும் பேசுபவர் என்று இயல்பாகப் புரிகிறது.
- source_word: הַשְׁמֵד
  choice: அழித்துவிடு!
  rationale: שמד என்பதன் ஹிஃபில் கட்டளை வடிவம் முழுமையான அழிப்பை வலியுறுத்துகிறது. ‘அழித்துவிடு’ வலிமையானதும் இயல்பானதும்; மூலத்தில் இல்லாத கூடுதல் விவரத்தைச் சேர்ப்பதில்லை.
theological_decisions:
- issue: אֱלֹהֵי קֶדֶם என்பதில் קֶדֶם என்பதை ‘தொன்றுதொட்டிருக்கிற’ எனக் காலப்பொருளில் மொழிபெயர்ப்பதா, ‘நித்திய’ என இறையியல் விளக்கத்துடன் மொழிபெயர்ப்பதா
  choice: தொன்றுதொட்டிருக்கிற தேவன்
  alternative: நித்திய தேவன்
  rationale: קֶדֶם முதன்மையாக பழங்காலம் அல்லது முற்காலத்தைக் குறிக்கிறது. ‘தொன்றுதொட்டிருக்கிற’ என்பது அந்தக் காலப்பொருளை நவீன தமிழில் இயல்பாக வெளிப்படுத்துகிறது. ‘நித்திய தேவன்’ என்பது நீண்டகால பாரம்பரியமுள்ள சாத்தியமான விளக்கம் என்பதால், மொழிபெயர்ப்பின் இறையியல் இழுபறியைப் பாதுகாக்க அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், கவித்துவமான கண்ணியத்தையும் சாதாரண வாசகருக்கான தெளிவையும் இணைக்கும் நடை பயன்படுத்தப்பட்டுள்ளது. ‘தேவன்’, ‘உறைவிடம்’, ‘நித்திய கரங்கள்’ ஆகியவை உயர்வான ஆனால் எளிதில் புரியும் சொற்கள். ஒருமை இரண்டாம் நபரான ‘உனக்கு’ மூல எபிரெயத்தின் எண்ணைத் தக்கவைக்கிறது.
