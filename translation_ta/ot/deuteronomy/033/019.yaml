  text: עַמִּים֙ הַר יִקְרָ֔אוּ שָׁ֖ם יִזְבְּח֣וּ זִבְחֵי צֶ֑דֶק כִּ֣י שֶׁ֤פַע יַמִּים֙ יִינָ֔קוּ וּ/שְׂפוּנֵ֖י טְמ֥וּנֵי חֽוֹל־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/019.yaml
  text: They will call peoples to the mountain[a]; there they will sacrifice righteous sacrifices[c][b], for they will draw from the abundance of the seas and from the hidden treasures of the sand.
translation:
  language: ta
  text: 'பல மக்களை அவர்கள் மலைக்கு அழைப்பார்கள்[a];


    அங்கே நீதியான பலிகளைச் செலுத்துவார்கள்[b].


    ஏனெனில், கடல்களின் பெருவளத்தையும்,

    மணலின் மறைந்த புதையல்களையும் அவர்கள் பெற்றுக்கொள்வார்கள்[c][d].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘பல மக்களை ஒரு மலைக்கு வரவழைப்பார்கள்’ என்றும் மொழிபெயர்க்கலாம். எபிரெய உரை அந்த மலையின் அடையாளத்தைக் குறிப்பிடவில்லை.
    reason: alternative_reading
  - marker: b
    text: ‘நீதியின் பலிகளைச் செலுத்துவார்கள்’ என்றும் மொழிபெயர்க்கலாம். இச்சொற்றொடர் சரியான அல்லது ஏற்ற பலிகளையும், நீதியுடன் செலுத்தப்படும் பலிகளையும் குறிக்கக்கூடும்.
    reason: alternative_reading
  - marker: c
    text: எபிரெயத்தில் நேர்ப்பொருள், ‘கடல்களின் பெருவளத்தை உறிஞ்சுவார்கள்’ அல்லது ‘பால் அருந்துவார்கள்.’ இது கடலிலிருந்து உணவையோ வளத்தையோ செல்வத்தையோ பெற்றுக்கொள்வதைக் குறிக்கும் உருவகம்.
    reason: lexical_alternative
  - marker: d
    text: எபிரெயச் சொற்றொடரை ‘மணலின் மறைவான பொருள்கள்’ அல்லது ‘மணலில் புதைந்த செல்வங்கள்’ என்றும் மொழிபெயர்க்கலாம். கடற்கரை அல்லது மணற்பகுதிகளோடு தொடர்புடைய வளங்கள் குறிக்கப்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַמִּים
  choice: மக்களினத்தார்
  rationale: பன்மையில் வரும் இச்சொல் தனிநபர்களை அல்ல, பல மக்கள் அல்லது இனக் குழுக்களைக் குறிக்கிறது. ‘மக்களினத்தார்’ அதன் கூட்டு அடையாளத்தைத் தக்கவைக்கிறது.
- source_word: הַר
  choice: மலை
  rationale: எபிரெயத்தில் எந்த மலை என்பது குறிப்பிடப்படவில்லை. தமிழில் பெயர்ச்சொல்லுக்கு தனியான definite article இல்லாததால், ‘மலைக்கு’ என்பது குறிப்பிட்ட மலையா பொதுவான ஒரு மலையா என்ற மூலமொழியின் தெளிவின்மையை இயல்பாகத் தக்கவைக்கிறது.
- source_word: יִקְרָאוּ
  choice: அழைப்பார்கள்
  rationale: קרא என்பதற்கு அழைத்தல், வரவழைத்தல், அறிவித்தல் ஆகிய பொருள் நிழல்கள் இருக்கலாம். இங்கே ‘அழைப்பார்கள்’ என்பது அவற்றில் ஒன்றை அளவுக்கு மீறி நிர்ணயிக்காத இயல்பான சொல்.
- source_word: יִזְבְּחוּ
  choice: பலியிடுவார்கள்
  rationale: זבח என்பது பொதுவாகக் கொடுப்பதைவிட பலிச் செயலைக் குறிப்பாகச் சுட்டுகிறது; ‘பலியிடுவார்கள்’ அந்த வழிபாட்டுச் சிறப்பைத் தக்கவைக்கிறது.
- source_word: זִבְחֵי צֶדֶק
  choice: நீதியான பலிகள்
  rationale: இக்கட்டமைப்பு ‘நீதியின் பலிகள்’ என்றும் புரிந்துகொள்ளப்படலாம். ‘நீதியான பலிகள்’ என்பது கடவுளுக்கு முன் சரியான அல்லது தகுந்த பலிகள் என்ற கருத்தை இயல்பான தமிழில் தருகிறது; பின்னாளைய கோட்பாட்டு விளக்கத்தைச் சேர்ப்பதில்லை.
- source_word: שֶׁפַע יַמִּים
  choice: கடல்களின் பெருவளம்
  rationale: שֶׁפַע என்பது மிகுதி, செழிப்பு, வளம் ஆகியவற்றைக் குறிக்கிறது. ‘பெருவளம்’ கடலிலிருந்து கிடைக்கும் உணவு, பொருள், வாணிகச் செல்வம் முதலியவற்றில் ஒன்றை மட்டும் கட்டாயப்படுத்தாமல் பரந்த பொருளைத் தக்கவைக்கிறது.
- source_word: יִינָקוּ
  choice: உறிஞ்சி எடுத்துக்கொள்வார்கள்
  rationale: வினைச்சொல்லின் நேர்ப்பொருள் ‘உறிஞ்சுதல்’ அல்லது ‘பால் அருந்துதல்.’ கவிதை உருவகத்தைத் தக்கவைத்தபடியே அதன் பயன் பெறுதல் என்ற பொருளைப் புரியவைக்க ‘உறிஞ்சி எடுத்துக்கொள்வார்கள்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: וּשְׂפוּנֵי טְמֻנֵי חוֹל
  choice: மணலில் மறைந்திருக்கும் புதையல்கள்
  rationale: இரண்டு மறைவு/புதைவு சார்ந்த சொற்கள் மணலோடு தொடர்புடைய மறைந்த அல்லது புதைந்த வளங்களைச் சுட்டுகின்றன. ‘புதையல்கள்’ கவிதைத் தன்மையைத் தக்கவைக்கிறது; அவை எந்த இயற்கை வளங்கள் என்பதை நிர்ணயிப்பதில்லை.
theological_decisions:
- issue: ‘நீதியான பலிகள்’ என்பதன் இயல்பு
  choice: கடவுளுக்கு முன் சரியான அல்லது ஏற்ற பலிகள் எனப் பொதுவாக விடப்பட்டது.
  alternative: நீதியுடன் செலுத்தப்படும் பலிகள்; நீதியின் பலிகள்
  rationale: צֶדֶק என்பது பலிகளின் தகுதியையோ, அவை செலுத்தப்படும் நீதியான முறையையோ சுட்டலாம். பிற்கால இறையியல் வகைப்பாட்டை உரைக்குள் கொண்டுவராமல் மூலத்தின் ஒழுக்க–வழிபாட்டு அழுத்தம் பாதுகாக்கப்பட்டது.
- issue: ‘மலை’ என்பதன் அடையாளம்
  choice: எந்த மலை என்று பெயரிடாமல் ‘மலை’ என்றே விடப்பட்டது.
  alternative: சீயோன் மலை; ஒரு மலைத் திருத்தலம்; அவர்களுடைய மலைநாடு
  rationale: மூல எபிரெய உரை மலையின் அடையாளத்தைத் தெளிவுபடுத்தவில்லை. சீயோன், சீனாய் அல்லது ஒரு கோத்திரத் திருத்தலம் என்று குறிப்பிடுவது உரைக்கு அப்பாற்பட்ட விளக்கத்தைச் சேர்க்கும்.
translation_notes:
  register: நவீன பொதுத்தமிழில், கவிதைநயமும் வழிபாட்டுச் செறிவும் காக்கப்பட்டுள்ளன. ‘மக்களினத்தார்,’ ‘பெருவளம்,’ ‘புதையல்கள்’ ஆகிய சொற்கள் dignified ஆனால் எளிதில் புரியக்கூடிய நடையை வழங்குகின்றன. எபிரெயக் கவிதையின் இணை அமைப்பைத் தக்கவைக்க நான்கு வரிகளாக அமைக்கப்பட்டது.
