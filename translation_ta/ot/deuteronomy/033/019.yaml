revisions:
- from: 'மக்களினத்தாரை அவர்கள் மலைக்கு அழைப்பார்கள்[a];

    அங்கே நீதியான பலிகளைப் பலியிடுவார்கள்[b].

    ஏனெனில், கடல்களின் பெருவளத்தை அவர்கள் உறிஞ்சி எடுத்துக்கொள்வார்கள்[c];

    மணலில் மறைந்திருக்கும் புதையல்களையும் பெற்றுக்கொள்வார்கள்[d].'
  to: 'பல மக்களை அவர்கள் மலைக்கு அழைப்பார்கள்[a];


    அங்கே நீதியான பலிகளைச் செலுத்துவார்கள்[b].


    ஏனெனில், கடல்களின் பெருவளத்தையும்,

    மணலின் மறைந்த புதையல்களையும் அவர்கள் பெற்றுக்கொள்வார்கள்[c][d].'
  rationale: The revision improves modern Tamil idiom, keeps עַמִּים plural, preserves the unspecified mountain, retains the cultic force of the sacrifice wording, and restores the single shared verbal relationship between the sea’s abundance and the sand’s concealed treasures. It does not identify the mountain or specify the nature of the resources beyond the Hebrew text.
