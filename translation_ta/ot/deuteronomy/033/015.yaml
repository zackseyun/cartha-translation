  register: நவீனத் தரமான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. இது முந்தைய வசனத்திலிருந்து தொடரும் ஆசீர்வாதப் பட்டியல் என்பதால் இணைப்பைக் காட்ட ‘-ஆலும்’ வடிவம் காக்கப்பட்டுள்ளது. கவிதைநடைச் சமநிலைக்காக ‘பழங்கால மலைகள் / என்றென்றும் நிலைக்கும் குன்றுகள்’ என்ற இணை அமைப்பு பயன்படுத்தப்பட்டுள்ளது.
