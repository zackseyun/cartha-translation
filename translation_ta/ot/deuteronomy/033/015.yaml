  text: and from the choicest things of the ancient mountains[a], and from the abundance of the everlasting hills[b],
translation:
  language: ta
  text: பழங்கால மலைகளின் மிகச் சிறந்தவற்றாலும்[a], என்றென்றும் நிலைக்கும் குன்றுகளின் வளத்தாலும்[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘பழங்கால மலைகளின் உச்சியாலும்.’ எபிரெயச் சொற்றொடரை இடப்பொருளில் ‘உச்சி’ என்றும், பண்புப்பொருளில் ‘மிகச் சிறந்தவை’ என்றும் புரிந்துகொள்ளலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘என்றென்றும் நிலைக்கும் குன்றுகளின் அரிய விளைபொருட்களாலும்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵרֹאשׁ
  choice: மிகச் சிறந்த விளைச்சலாலும்
  rationale: רֹאשׁ என்பதன் அடிப்படைப் பொருள் ‘தலை/உச்சி’ என்றாலும், ஆசீர்வாதங்களின் இந்தப் பட்டியலிலும் இணையான מֶגֶד என்பதுடனான தொடர்பிலும், மலைகள் தரும் முதன்மையான அல்லது மிகச் சிறந்த விளைச்சல் என்ற பண்புசார் பொருள் இயல்பாகிறது. இடம்சார் பொருளையும் அடிக்குறிப்பில் வைத்திருக்கிறது.
- source_word: הַרְרֵי
  choice: மலைகளின்
  rationale: הַר என்பதன் பன்மை இணைப்புவடிவம்; அடுத்துவரும் גִּבְעוֹת ‘குன்றுகள்’ என்பதிலிருந்து வேறுபடுத்தப்பட்டுள்ளது.
- source_word: קֶדֶם
  choice: பழங்கால
  rationale: קֶדֶם என்பதற்கு ‘கிழக்கு’ அல்லது ‘தொன்மை’ என்று பொருள் வரலாம். עוֹלָם என்பதுடன் கவிதைநடையில் இணைவதால் காலத்தைக் குறிக்கும் ‘பழங்கால’ என்பது பொருத்தமானது.
- source_word: מִמֶּגֶד
  choice: வளத்தாலும்
  rationale: מֶגֶד விலையுயர்ந்த விளைபொருள், செழுமையான பலன் அல்லது நிறைவான வளம் ஆகியவற்றைக் குறிக்கலாம். ‘வளம்’ என்பது ஆசீர்வாதச் சூழலில் இயல்பாகவும் பொதுவாகப் புரியும்படியும் உள்ளது.
- source_word: גִּבְעוֹת
  choice: குன்றுகளின்
  rationale: גִּבְעָה என்பதற்கான வழக்கமான தமிழாக்கம்; முந்தைய ‘மலைகள்’ என்பதிலிருந்து தெளிவாக வேறுபடுகிறது.
- source_word: עוֹלָם
  choice: என்றென்றும் நிலைக்கும்
  rationale: இச்சொல் தொன்மையையோ நீடித்த காலத்தையோ குறிக்கலாம். ‘என்றென்றும் நிலைக்கும்’ என்பது அதன் உயர்ந்த கவிதைத் தொனியையும் நீடித்திருக்கும் தன்மையையும் காக்கிறது.
