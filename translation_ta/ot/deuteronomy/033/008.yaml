base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/008.yaml
  text: 'And of Levi he said: “Your Thummim and your Urim belong to your faithful one[a], whom you tested at Massah[b], with whom you contended at the waters of Meribah.”'
translation:
  language: ta
  text: 'லேவியைக் குறித்து அவர் கூறினார்:


    “உம்முடைய தும்மீமும் உம்முடைய ஊரீமும்

    உமக்கு உண்மையுள்ளவருக்குரியவை.[a]

    அவரை நீர் மாசாவில் சோதித்தீர்;[b]

    மெரிபாவின் தண்ணீர்களில் அவரோடு வாதிட்டீர்.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உமது பக்தியுள்ளவருக்குரியவை,” “உமக்கான உடன்படிக்கைப் பற்றுறுதியுள்ளவருக்குரியவை.” எபிரெயச் சொல் உடன்படிக்கைக்குரிய பற்றுறுதியால் அடையாளப்படுத்தப்பட்ட ஒருவரைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “மாசா” என்ற பெயர் “சோதித்தல்” என்பதையும், “மெரிபா” என்ற பெயர் “வாதம்/சச்சரவு” என்பதையும் நினைவூட்டுகின்றன (யாத்திராகமம் 17:1–7; எண்ணாகமம் 20:1–13 பார்க்கவும்).
    reason: cross_reference
lexical_decisions:
- source_word: וּלְלֵוִי
  choice: லேவியைக் குறித்து
  rationale: ஆசீர்வாதத் தொடரில் לְ என்பது அடுத்ததாகப் பேசப்படும் கோத்திரத்தை அறிமுகப்படுத்துகிறது; நவீன தமிழில் ‘லேவியைக் குறித்து’ இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: תֻּמֶּיךָ וְאוּרֶיךָ
  choice: உம்முடைய தும்மீமும் உம்முடைய ஊரீமும்
  rationale: இவை ஆசாரியருக்குரிய சிறப்புக் கருவிகளைக் குறிக்கும் தொழில்நுட்பப் பெயர்கள்; அவற்றின் துல்லியமான வடிவமும் செயல்பாடும் உறுதியற்றதால் பொருளாக்காமல் ஒலிபெயர்க்கப்பட்டுள்ளன. இரண்டாம் நபர் ஆண்பால் ஒருமை உரிமை விகுதி ‘உம்முடைய’ எனத் தக்கவைக்கப்பட்டுள்ளது.
- source_word: לְאִישׁ חֲסִידֶךָ
  choice: உமக்கு உண்மையுள்ளவருக்குரியவை
  rationale: חָסִיד உடன்படிக்கைச் சார்ந்த பற்றுறுதி அல்லது உண்மைத்தன்மையால் அடையாளப்படுத்தப்பட்ட ஒருவரைக் குறிக்கலாம். வினையற்ற எபிரெய வாக்கியம் தமிழில் தெளிவாக அமைய ‘உரியவை’ சேர்க்கப்பட்டுள்ளது; அந்த நபர் யார் என்பது தீர்மானிக்கப்படவில்லை.
- source_word: אֲשֶׁר נִסִּיתוֹ
  choice: அவரை நீர் சோதித்தீர்
  rationale: נסה இங்கு ஒருவரைச் சோதித்தல் அல்லது பரிசோதித்தல் என்ற பொருள் தருகிறது; ‘சோதித்தீர்’ பாலைவன நிகழ்வின் நேரடியான பதற்றத்தைப் பாதுகாக்கிறது.
- source_word: בְּמַסָּה
  choice: மாசாவில்
  rationale: இது ‘சோதனை’ என்ற சொல்லோடு தொடர்புடைய இடப்பெயர். முதன்மை உரையில் அதன் வரலாற்றுச் சிறப்பைப் பாதுகாக்க ஒலிபெயர்ப்பு பயன்படுத்தப்பட்டுள்ளது.
- source_word: תְּרִיבֵהוּ
  choice: அவரோடு வாதிட்டீர்
  rationale: ריב என்பது சச்சரவிடுதல், வழக்காடுதல் அல்லது வாதிடுதல் என்று பொருள்படலாம். ‘வாதிட்டீர்’ தெய்வத்துக்கும் குறிப்பிடப்பட்ட நபருக்கும் இடையிலான மோதலை மென்மையாக்காமல் இயல்பான தமிழில் தருகிறது.
- source_word: עַל מֵי מְרִיבָה
  choice: மெரிபாவின் தண்ணீர்களருகே
  rationale: עַל இச்சூழலில் நிகழ்வு நடந்த இடத்தைக் குறிக்கிறது. ‘தண்ணீர்களருகே’ என்பது ‘மெரிபாவின் தண்ணீர்கள்’ என்ற எபிரெய உருவகத்தையும் இடவுணர்வையும் பாதுகாக்கிறது.
theological_decisions:
- issue: ‘உமக்கு உண்மையுள்ளவர்’ என்பவரின் அடையாளம்
  choice: ஆண்பால் ஒருமையில் உள்ள பொதுவான குறிப்பைத் தக்கவைத்து, அவர் யார் என்பதை அடையாளப்படுத்தாமல் விடுதல்
  alternative: ஆரோன் என்று குறிப்பாகச் சொல்லுதல்; மூதாதையான லேவி என்று கொள்ளுதல்; லேவியர் கோத்திரத்தை ஒட்டுமொத்தமாகக் குறித்தல்
  rationale: எபிரெய ஒருமை இவ்விளக்கங்களில் ஒன்றை கட்டாயப்படுத்தவில்லை. ஆகவே ஆரோன், லேவி அல்லது கோத்திரம் என்று மொழிபெயர்ப்பிலேயே தீர்மானிக்காமல் மூலத்தின் இறையியல் தெளிவின்மை பாதுகாக்கப்பட்டுள்ளது.
- issue: மாசா மற்றும் மெரிபா நிகழ்வுகளில் சோதித்ததும் வாதிட்டதும் யார் என்ற பதற்றம்
  choice: இரண்டாம் நபர் இறைவனைக் குறிக்கும் வகையில் ‘நீர்’ என்றும், ஒருமை நபரை ‘அவர்’ என்றும் நேரடியாகத் தக்கவைத்தல்
  alternative: இஸ்ரவேல் இறைவனைச் சோதித்தது அல்லது மோசே மக்களோடு வாதிட்டது என நிகழ்வை விளக்கி மறுவடிவமைத்தல்
  rationale: எபிரெய இலக்கணம் இங்கு இறைவன் அந்த நபரைச் சோதித்து அவரோடு வாதிட்டதாக நேரடியாகக் கூறுகிறது. தொடர்புடைய வேறு மரபுகளோடு ஒத்திசைக்க உரையை மாற்றாமல் அதன் பதற்றம் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. இறைவனை நோக்கிய ஒருமை மரியாதை வடிவமாக ‘உம்/நீர்’ பயன்படுத்தப்பட்டுள்ளது. தும்மீம், ஊரீம், மாசா, மெரிபா ஆகிய வரலாற்று-சமயச் சிறப்புப் பெயர்கள் ஒலிபெயர்க்கப்பட்டுள்ளன; கவிதை வரியமைப்பு பாதுகாக்கப்பட்டுள்ளது.
