base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/028.yaml
  text: So Israel lived in safety[a], alone; Jacob's fountain in a land of grain and new wine[b]; even his heavens dripped dew.
translation:
  language: ta
  text: இஸ்ரவேல் பாதுகாப்பாகத் தனித்து குடியிருந்தான்[b]; யாக்கோபின் ஊற்று[a] தானியமும் புதிய திராட்சை மதுவும் உள்ள நாட்டில் இருந்தது; அவனுடைய வானங்கள்கூட பனியைச் சொரிந்தன.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘யாக்கோபின் கண்.’ எபிரெயச் சொல் ‘கண்’ அல்லது ‘ஊற்று’ என்ற இரு பொருள்களையும் தரலாம்; வேளாண் செழிப்பைச் சித்தரிக்கும் சூழலுக்கு ‘ஊற்று’ சிறப்பாகப் பொருந்துகிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘தன்னந்தனியாகப் பாதுகாப்புடன் குடியிருந்தான்.’
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשְׁכֹּן
  choice: வாழ்ந்தான்
  rationale: שׁכן என்பது குடியிருத்தல் அல்லது நிலையாக வாழ்தலைக் குறிக்கிறது. நவீன தமிழில் ‘வாழ்ந்தான்’ இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: בֶּטַח
  choice: பாதுகாப்பாக
  rationale: இங்கு இச்சொல் இஸ்ரவேல் அச்சமின்றிப் பாதுகாப்புடன் வாழ்ந்த நிலையை வினையடையாக விவரிக்கிறது.
- source_word: בָּדָד
  choice: தனித்து
  rationale: பிறரால் கைவிடப்பட்ட தனிமையை அல்ல, தனியாகவும் தொந்தரவின்றியும் இருந்த நிலையைக் குறிக்கும் சொல்லாகத் தேர்ந்தெடுக்கப்பட்டது.
- source_word: עֵין יַעֲקֹב
  choice: யாக்கோபின் ஊற்று
  rationale: עֵין என்பதற்கு ‘கண்’ என்றும் ‘ஊற்று’ என்றும் பொருள் உண்டு. தானியம், புதுத் திராட்சை மது, பனித்துளி ஆகிய செழிப்பு உருவகங்களுடன் ‘ஊற்று’ நன்றாகப் பொருந்துகிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: אֶל אֶרֶץ
  choice: நாட்டில் இருந்தது
  rationale: אֶל பொதுவாக ‘நோக்கி/அதற்கு’ எனப் பொருள்பட்டாலும், இந்தக் கவிதைத் தொடரில் இடத்துடனான உறவை இயல்பான தமிழில் தெரிவிக்க ‘நாட்டில் இருந்தது’ என மொழிபெயர்க்கப்பட்டது.
- source_word: דָּגָן
  choice: தானியம்
  rationale: பலவகைத் தானிய விளைச்சலைக் குறிக்கும் பொதுச்சொல்.
- source_word: תִּירוֹשׁ
  choice: புதுத் திராட்சை மது
  rationale: תִּירוֹשׁ பொதுவாகப் புதிய அல்லது புதியதாகத் தயாரிக்கப்பட்ட திராட்சை மதுவைக் குறிக்கிறது; வேளாண் செழிப்பின் உருவகத்தையும் இது காக்கிறது.
- source_word: אַף
  choice: கூட
  rationale: நிலத்தின் வளத்தோடு வானமும் ஆசீர்வாதம் வழங்குவதை வலியுறுத்தும் சேர்க்கைச் சொல்லின் உச்சநிலையை இது இயல்பாக வெளிப்படுத்துகிறது.
- source_word: שָׁמָיו
  choice: அவனுக்கு மேலுள்ள வானங்கள்
  rationale: எபிரெயச் சொல்லிலுள்ள மூன்றாம் நபர் ஆண்பால் ஒருமை உடைமைப் பின்னொட்டைத் தக்கவைத்தபடியே, தமிழில் பொருள் தெளிவாக இருக்க இவ்வாறு மொழிபெயர்க்கப்பட்டது.
- source_word: יַעַרְפוּ
  choice: சொரிந்தன
  rationale: மழை அல்லது பனித்துளி மேலிருந்து துளித்தல், வடிதல் என்ற கவிதைநயமான செயலைக் குறிக்கிறது.
- source_word: טָל
  choice: பனித்துளிகள்
  rationale: இங்கு வேளாண் வளத்தைக் கொடுக்கும் dew என்பதைக் குறிக்கிறது; ‘பனி’ என்பதைவிட ‘பனித்துளிகள்’ தெளிவானது.
theological_decisions:
- issue: עֵין יַעֲקֹב என்பதன் பொருள்
  choice: ‘யாக்கோபின் ஊற்று’ என மொழிபெயர்க்கப்பட்டது
  alternative: ‘யாக்கோபின் கண்’
  rationale: இது கோட்பாட்டுத் தீர்மானத்தைவிடச் சொற்பொருள் மற்றும் கவிதை உருவகம் சார்ந்த தீர்மானம். தானியம், புதுத் திராட்சை மது, பனித்துளி ஆகிய வளமையின் சூழல் ‘ஊற்று’ என்ற பொருளை ஆதரிக்கிறது; உண்மையான சொற்பொருள் மாற்று அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: בָּדָד என்பதன் தன்மை
  choice: பாதுகாப்பான தனித்த நிலையாக ‘தனித்து’ என மொழிபெயர்க்கப்பட்டது
  alternative: ‘தனியாக’ அல்லது ‘தனியே’
  rationale: ஆசீர்வாதச் சூழலில் இச்சொல் கைவிடப்பட்ட துயரமான தனிமையைவிட, அச்சுறுத்தலின்றி வேறுபட்டு வாழும் நிலையைக் குறிக்கிறது. அதேவேளை, மூலத்தின் சுருக்கமும் பொருள் இழுப்பும் அளவுக்கு மீறி விளக்கப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘வாழ்ந்தான்’, ‘பாதுகாப்பாக’, ‘தனித்து’ ஆகியவை இயல்பான நடையைப் பேணுகின்றன; ‘யாக்கோபின் ஊற்று’ மற்றும் ‘வானங்கள்கூட பனித்துளிகளைச் சொரிந்தன’ ஆகியவை மூலத்தின் வேளாண் செழிப்பு உருவகத்தைத் தக்கவைக்கின்றன. எல்லா அடிக்குறிப்பு குறியீடுகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
