- from: எனவே, இஸ்ரவேல் பாதுகாப்பாகத் தனித்து வாழ்ந்தான்[b]; யாக்கோபின் ஊற்று[a], தானியமும் புதுத் திராட்சை மதுவும் நிறைந்த நாட்டில் இருந்தது; அவனுக்கு மேலுள்ள வானங்கள்கூட பனித்துளிகளைச் சொரிந்தன.
  to: இஸ்ரவேல் பாதுகாப்பாகத் தனித்து குடியிருந்தான்[b]; யாக்கோபின் ஊற்று[a] தானியமும் புதிய திராட்சை மதுவும் உள்ள நாட்டில் இருந்தது; அவனுடைய வானங்கள்கூட பனியைச் சொரிந்தன.
