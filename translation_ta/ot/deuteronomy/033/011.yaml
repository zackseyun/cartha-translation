source:
  edition: WLC
  text: בָּרֵ֤ךְ יְהוָה֙ חֵיל֔/וֹ וּ/פֹ֥עַל יָדָ֖י/ו תִּרְצֶ֑ה מְחַ֨ץ מָתְנַ֧יִם קָמָ֛י/ו וּ/מְשַׂנְאָ֖י/ו מִן יְקוּמֽוּ/ן־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/011.yaml
  text: Bless[a], O Yahweh, his strength, and accept the work of his hands. Crush the loins of those who rise against him, and of those who hate him[b], so that they do not rise again.
translation:
  language: ta
  text: 'யாவே, அவனுடைய வலிமையை[a] ஆசீர்வதிப்பீராக;

    அவனுடைய கைகளின் வேலையை ஏற்றுக்கொள்வீராக.

    அவனுக்கு எதிராக எழுகிறவர்களுடைய இடுப்புகளையும்,

    அவனை வெறுக்கிறவர்களுடைய இடுப்புகளையும்

    அவர்கள் மீண்டும் எழாதபடி நொறுக்குவீராக.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘வலிமை’ என்பதற்கான எபிரெயச் சொல் ‘வளம்,’ ‘செல்வம்’ அல்லது ‘படைவலிமை’ என்றும் பொருள்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּרֵךְ
  choice: ஆசீர்வதிப்பீராக
  rationale: யாவேயை நோக்கிக் கூறப்படும் கட்டளை அல்லது வேண்டுதல். தமிழில் இறைவனை நோக்கிய மரியாதையுள்ள வேண்டுதலாக இயல்பாக ஒலிக்கிறது; ‘செழிக்கச் செய்வீராக’ என்பது சூழல்சார் விளக்கத்தை மூல உரைக்குள் சேர்த்துவிடும்.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைத் திருப்பெயரை ஒரு பட்டப்பெயரால் மாற்றாமல், எபிரெயத் தனிப்பெயரின் தமிழ் ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: חֵילוֹ
  choice: அவனுடைய வலிமையை
  rationale: חַיִל என்பது வலிமை, வளம், செல்வம் அல்லது படைவலிமை ஆகியவற்றைக் குறிக்கலாம். ‘வலிமை’ இந்த இடத்தில் பொருளை அளவுக்கு மீறிக் குறுக்காமல் பரந்த தன்மையைப் பேணுகிறது.
- source_word: וּפֹעַל יָדָיו
  choice: அவனுடைய கைகளின் செயலை
  rationale: ஒருவருடைய பணி அல்லது செயல்களைக் குறிக்கும் எபிரெய உருவகத்தைத் தமிழிலும் தெளிவாகப் பேணுகிறது.
- source_word: תִּרְצֶה
  choice: ஏற்றுக்கொள்வீராக
  rationale: லேவியின் பணியை யாவே அங்கீகரித்து மனமுவந்து ஏற்க வேண்டும் என்ற வேண்டுதலைத் தெரிவிக்கிறது; பலி சார்ந்த பொருளை மட்டும் தேவையின்றி வரையறுக்கவில்லை.
- source_word: מְחַץ
  choice: நொறுக்குவீராக
  rationale: நசுக்குதல் அல்லது சிதைத்தல் என்ற வலுவான கவித்துவ வினையின் தீவிரத்தைப் பேணுகிறது.
- source_word: מָתְנַיִם
  choice: இடுப்பை
  rationale: ‘இடுப்பு/அரைக்கட்டு’ எனும் நேரடியான உடல் உருவகத்தைப் பேணுகிறது; இங்கு அது எதிரிகளின் வலிமையைக் குறிக்கிறது.
- source_word: קָמָיו
  choice: அவனுக்கு எதிராக எழுகிறவர்கள்
  rationale: קום என்ற ‘எழுதல்’ வினையிலுள்ள செயல்படிமத்தை ‘எதிரிகள்’ என்று பொதுமைப்படுத்தாமல் காக்கிறது.
- source_word: וּמְשַׂנְאָיו
  choice: அவனை வெறுக்கிறவர்கள்
  rationale: தனிப்பட்ட பகைமையை நேரடியாக வெளிப்படுத்தும் எபிரெய பங்கேற்பு வடிவத்தை இயல்பான தமிழில் வழங்குகிறது.
- source_word: מִן יְקוּמוּן
  choice: மீண்டும் எழ முடியாதபடி
  rationale: எதிரிகள் எழுவதிலிருந்து தடுக்கப்பட வேண்டும் என்ற சுருக்கமான எபிரெயத் தொடரின் விளைவுப் பொருளை இயல்பான தமிழில் தெரிவிக்கிறது. ‘மீண்டும்’ என்பது நொறுக்கப்பட்டவர்கள் மறுபடியும் எழ இயலாத நிலையைச் சூழலிலிருந்து வெளிப்படுத்துகிறது.
theological_decisions:
- issue: ‘அவன்/அவனுடைய’ என்ற ஒருமைப் பதிலிடுபெயரின் சுட்டுப்பொருள்
  choice: உடனடியான சூழலில் ஆசீர்வதிக்கப்படும் லேவி கோத்திரத்தை ஒருமைக் கூட்டுப்பெயராகக் குறிக்கிறது.
  alternative: லேவிய ஆசாரிய ஊழியக்காரனையோ லேவியின் பிரதிநிதித்துவ ஊழியத்தையோ குறிக்கலாம்.
  rationale: உபாகமம் 33:8–11 லேவியைப் பற்றிய ஆசீர்வாதமாகும். எபிரெய ஒருமை வடிவத்தைத் தமிழிலும் வைத்திருப்பது, அதை ஒரு குறிப்பிட்ட தனிநபருக்கோ பின்னைய கோட்பாட்டுச் சுட்டுக்கோ கட்டாயமாகக் குறுக்காமல் காக்கிறது.
- issue: מִן יְקוּמוּן தொடரின் பொருள்
  choice: எதிரிகள் நொறுக்கப்பட்டபின் மீண்டும் எழ முடியாத விளைவாக மொழிபெயர்க்கப்பட்டது.
  alternative: ‘எழாதபடி’ அல்லது ‘எழுவதிலிருந்து [தடுத்து]’ என்று இன்னும் சொற்சார்பாக வழங்கலாம்.
  rationale: எபிரெயத் தொடர் சுருக்கமாகவும் ஓரளவு நீள்விடுபட்டதாகவும் உள்ளது. முன்னுள்ள ‘நொறுக்கு’ என்ற கட்டளையுடன் இணைத்து விளைவைக் கூறுவது இயல்பான தமிழ் தருகிறது; அதேவேளை முற்றிலும் அழித்தல் போன்ற கூடுதல் கருத்தைச் சேர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் மரியாதைமிக்க கவிதை நடையைப் பயன்படுத்துகிறது. இறைவனை நோக்கிய எபிரெயக் கட்டளைகள் தமிழில் மரியாதையுள்ள வேண்டுதல் வடிவங்களாக அமைக்கப்பட்டுள்ளன. வரிப்பிரிப்பு எபிரெயக் கவிதையின் வேண்டுதல்–எதிரிகள் மீதான தீர்ப்பு என்ற நகர்வைத் தெளிவாக்குகிறது.
