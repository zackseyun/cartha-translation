translation_notes:
  register: நவீன பொதுத்தமிழில், மரியாதையான சட்ட அறிவுறுத்தல் நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. மூலத்தின் இரண்டாம் நபர் ஆண்பால் ஒருமை தமிழில் இயல்பான “உன்” வடிவில் காக்கப்பட்டுள்ளது; பயனாளிகளின் பட்டியல் சமூகப் பாதுகாப்பு சார்ந்த மூலப் பொருளோடு வழங்கப்பட்டுள்ளது.
