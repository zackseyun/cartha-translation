base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/024/020.yaml
  text: When you beat your olive tree[a], you shall not go over it again; it shall be for the sojourner, for the fatherless[c][b], and for the widow.
translation:
  language: ta
  text: உன் ஒலிவ மரத்தை அடித்து அறுவடை செய்யும்போது, மீண்டும் அதில் எஞ்சிய ஒலிவப் பழங்களைப் பறிக்காதே[a]. அவை குடியேறி வாழும் பிறநாட்டவருக்கும்[b], தந்தையற்றவருக்கும்[c], விதவைக்கும் உரியவையாக இருக்க வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'வேறு வகையில்: “உனக்குப் பின் எஞ்சியவற்றை முழுவதுமாகப் பறிக்காதே.” அதாவது, முதலில் மரத்தை அடித்த பிறகு எஞ்சிய ஒலிவப் பழங்களை அகற்ற இரண்டாம் முறை செல்லக் கூடாது.'
    reason: lexical_alternative
  - marker: b
    text: “குடியேறி வாழும் பிறநாட்டவர்” என்பது இஸ்ரவேலரிடையே வாழ்ந்த பூர்வகுடியல்லாத ஒருவரைக் குறிக்கிறது; “அந்நியக் குடியிருப்பாளர்” என்றும் மொழிபெயர்க்கலாம்.
    reason: cultural_note
  - marker: c
    text: “அநாதை” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: செய்யும்போது
  rationale: சட்டச் சூழலில் ஒரு நிகழ்வை முன்வைக்கும் காலப் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: תַחְבֹּט
  choice: அடித்து அறுவடை செய்யும்போது
  rationale: ஒலிவப் பழங்களை உதிரச் செய்ய மரத்தையோ கிளைகளையோ அடிக்கும் அறுவடை முறையைத் தெளிவாகக் காட்டுகிறது.
- source_word: זֵיתְךָ
  choice: உன் ஒலிவ மரத்தை
  rationale: வினைச்செயல் மரத்தைக் குறிக்கிறது; எபிரெய மூலத்தின் ஒருமையையும் இரண்டாம் நபர் ஒருமையையும் காக்கிறது.
- source_word: לֹא תְפָאֵר אַחֲרֶיךָ
  choice: உனக்குப் பின் மீண்டும் அதன் கிளைகளில் எஞ்சியவற்றைப் பறிக்காதே
  rationale: முதல் அறுவடைக்குப் பிறகு எஞ்சிய ஒலிவப் பழங்களை இரண்டாம் முறை சென்று முழுவதுமாகப் பறிக்கக் கூடாது என்ற அரிய அறுவடைப் பயன்பாட்டை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: לַגֵּר
  choice: உங்களிடையே குடியிருக்கும் அந்நியருக்கு
  rationale: இஸ்ரவேலரிடையே வாழும் பூர்வகுடியல்லாத குடியிருப்பாளரை גֵּר குறிக்கிறது; வெறும் பயணி என்ற எண்ணத்தைத் தவிர்க்க இந்த விளக்கமான சொற்றொடர் தேர்ந்தெடுக்கப்பட்டது.
- source_word: לַיָּתוֹם
  choice: தந்தையற்றவருக்கு
  rationale: பண்டைய குடும்ப அமைப்பில் தந்தையை இழந்ததால் பாதுகாப்பற்ற நிலையில் இருப்பவரைச் சொல்லின் குறிப்பான பொருளுடன் காட்டுகிறது.
- source_word: וְלָאַלְמָנָה
  choice: விதவைக்கு
  rationale: אַלְמָנָה என்பதற்கான வழக்கமான, தெளிவான தமிழ் இணை.
- source_word: יִהְיֶה
  choice: உரியவையாக இருக்கட்டும்
  rationale: எஞ்சிய பழங்கள் குறிப்பிடப்பட்ட சமூகத்தினருக்காக விடப்பட வேண்டும் என்ற சட்ட ஒதுக்கீட்டைத் தெரிவிக்கிறது.
