  source_fidelity: 'வசனம் எபிரெய மூலத்தின் கட்டளைத் தன்மையையும் தர்க்கத் தொடர்ச்சியையும் துல்லியமாகத் தருகிறது: ‘நினைவில் கொள்’ வְזָכַרְתָּ-வின் அறிவுறுத்தல் வலிமையைப் பாதுகாக்கிறது; ‘எகிப்து நாட்டில் அடிமையாக இருந்ததை’ כִּי עֶבֶד הָיִיתָ בְּאֶרֶץ מִצְרָיִם என்பதன் உள்ளடக்கத்தையும் அடிமை நிலையையும் சரியாக வெளிப்படுத்துகிறது; ‘ஆகையால்’ עַל־כֵּן-இன் முடிவுறுத்தலைக் காட்டுகிறது. இறுதி ‘இந்தக் காரியத்தைச் செய்யும்படி நான் உனக்குக் கட்டளையிடுகிறேன்’ לַעֲשׂוֹת אֶת־הַדָּבָר הַזֶּה-ஐப் பரந்த பொருளில் தக்கவைக்கிறது.'
