  yaml_path: translation/ot/deuteronomy/024/022.yaml
  text: And remember that you were a servant in the land of Egypt[a]; therefore I am commanding you to do this thing.
translation:
  language: ta
  text: நீ எகிப்து நாட்டில் அடிமையாக இருந்ததை நினைவில் கொள்; ஆகையால் இந்தக் காரியத்தைச் செய்யும்படி நான் உனக்குக் கட்டளையிடுகிறேன்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘இந்த விஷயத்தை’ அல்லது ‘இந்தக் கட்டளையை’ என்றும் மொழிபெயர்க்கலாம். ‘இந்தக் காரியம்’ என்ற எபிரெயச் சொற்றொடர், பாதுகாப்பற்றவர்களுக்காக விளைபொருளை விட்டுவைக்க வேண்டும் என்று முந்தைய வசனங்களில் கொடுக்கப்பட்ட அறிவுறுத்தலைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזָכַרְתָּ
  choice: நினைவில் கொள்
  rationale: சட்டச் சூழலில் கட்டளை அல்லது அறிவுறுத்தல் வலிமையுடன் வரும் வினை; நவீன தமிழில் இயல்பான கட்டளை வடிவம்.
- source_word: כִּי עֶבֶד הָיִיתָ
  choice: அடிமையாக இருந்ததை
  rationale: כִּי இங்கு நினைவுகூர வேண்டிய உள்ளடக்கத்தை அறிமுகப்படுத்துகிறது; עֶבֶד எகிப்தியச் சூழலில் சாதாரண பணியாளரை அல்ல, அடிமை நிலையைக் குறிக்கிறது.
- source_word: בְּאֶרֶץ מִצְרָיִם
  choice: எகிப்து நாட்டில்
  rationale: எபிரெயச் சொல்லாட்சியின் ‘எகிப்து நாடு’ என்ற concrete வடிவத்தை இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: עַל כֵּן
  choice: ஆகையால்
  rationale: கடந்தகால அடிமை அனுபவத்துக்கும் தற்போதைய கட்டளைக்கும் இடையிலான காரணவிளைவு தொடர்பைத் தெளிவாகக் காட்டுகிறது.
- source_word: אָנֹכִי מְצַוְּךָ
  choice: நான் உனக்குக் கட்டளையிடுகிறேன்
  rationale: தனிப்பட்ட சுட்டுப்பெயரையும் நிகழ்காலத் தொடர்ச்சியுடைய அதிகாரப்பூர்வ கட்டளையையும் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: לַעֲשׂוֹת אֶת־הַדָּבָר הַזֶּה
  choice: இந்தக் காரியத்தைச் செய்யும்படி
  rationale: דָּבָר என்பதன் பரந்த ‘காரியம்/விஷயம்’ பொருளைத் தக்கவைத்து, முந்தைய அறிவுறுத்தலைச் செயல்படுத்துவதைக் குறிக்கிறது.
