translation_notes:
  register: நவீன தரத் தமிழில், ஒருமை இரண்டாம் நபர் சட்ட அறிவுறுத்தலின் நேர்முகத் தன்மையைப் பாதுகாக்கும் கண்ணியமான நடை. அடிமை நிலையின் தீவிரத்தைக் குறைக்காமல் ‘அடிமை’ பயன்படுத்தப்பட்டுள்ளது; דָּבָר என்பதின் பரந்த தன்மையைப் பாதுகாக்க ‘காரியம்’ தேர்ந்தெடுக்கப்பட்டுள்ளது.
