  terminology: ‘அடிமை’ என்பது இச்சூழலில் עֶבֶד-இன் கட்டுண்ட நிலையைக் குறைப்பதில்லை. ‘காரியம்’ דָּבָר என்பதைக் குறுகலாக்காமல், முந்தைய அறுவடைச் சட்ட அறிவுறுத்தலுக்கான சுட்டலைப் பாதுகாக்கிறது. ‘கட்டளையிடுகிறேன்’ מְצַוְּךָ-வின் அதிகாரப்பூர்வ நிகழ்கால வலிமைக்கு ஏற்றது.
