base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/024/008.yaml
  text: Be careful in the case of an outbreak of skin disease[a], to observe very carefully and to do according to all that the Levitical priests instruct you; as I have commanded them, so you shall be careful to do.
translation:
  language: ta
  text: தோல் நோய்ப் பாதிப்பைக் குறித்து, லேவிய ஆசாரியர்கள் உங்களுக்கு அறிவுறுத்தும் அனைத்தையும் மிகக் கவனமாகக் கடைப்பிடித்துச் செய்ய எச்சரிக்கையாயிருங்கள்[a]; நான் அவர்களுக்குக் கட்டளையிட்டபடியே, நீங்களும் அவ்வாறு செய்யக் கவனமாயிருங்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: மரபாக, “தொழுநோய்” என்று மொழிபெயர்க்கப்படுகிறது. எபிரெயச் சொல் நவீன ஹான்சன் நோயை மட்டும் குறிக்காமல், தோராவில் பலவகையான தோல் நிலைகளைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִשָּׁמֶר
  choice: எச்சரிக்கையாக இருங்கள்
  rationale: שׁמר என்பதன் நிபால் கட்டளை வடிவம் எச்சரிக்கை கலந்த அறிவுறுத்தலைத் தருகிறது; நவீன தமிழில் இயல்பாகவும் கட்டளை வலிமையுடனும் உள்ளது.
- source_word: בְּנֶגַע הַצָּרַעַת
  choice: தோல் நோயின் பாதிப்பு ஏற்படும் விஷயத்தில்
  rationale: נֶגַע என்பது பாதிப்பு அல்லது நோய்க்குறியைக் குறிக்கலாம்; צָרַעַת என்பது நவீன ஹான்சன் நோயை மட்டும் அல்லாமல் தோராவில் பலவகைத் தோல் நிலைகளைக் குறிக்கிறது.
- source_word: לִשְׁמֹר מְאֹד וְלַעֲשׂוֹת
  choice: மிகக் கவனமாகக் கடைப்பிடித்துச் செய்யுங்கள்
  rationale: מְאֹד என்பதன் வலியுறுத்தலையும், கவனித்துக் கடைப்பிடித்தல் மற்றும் செயல்படுத்துதல் என்ற இரு கூறுகளையும் தமிழில் பாதுகாக்கிறது.
- source_word: כְּכֹל אֲשֶׁר יוֹרוּ אֶתְכֶם
  choice: உங்களுக்கு அறிவுறுத்தும் அனைத்தையும்
  rationale: ירה என்பதன் ஹிபில் வடிவம் இங்கு சட்ட மற்றும் ஆசார வழிகாட்டுதலைப் போதித்தல் அல்லது அறிவுறுத்துதல் எனக் குறிக்கிறது.
- source_word: הַכֹּהֲנִים הַלְוִיִּם
  choice: லேவிய ஆசாரியர்கள்
  rationale: உபாகமத்தில் வழக்கமான இச்சொற்றொடர் லேவி கோத்திரத்தைச் சேர்ந்த ஆசாரியர்களைக் குறிக்கும் பெயரடைக் கட்டமைப்பாகப் புரிந்துகொள்ளப்படுகிறது.
- source_word: כַּאֲשֶׁר צִוִּיתִם
  choice: நான் அவர்களுக்குக் கட்டளையிட்டபடியே
  rationale: முதலாம் நபர் ஒருமை வினையும் மூன்றாம் நபர் பன்மை பின்னொட்டும் மோசே ஆசாரியர்களுக்குக் கொடுத்த கட்டளையைக் குறிக்கின்றன.
- source_word: תִּשְׁמְרוּ לַעֲשׂוֹת
  choice: நீங்களும் கவனமாகச் செய்யுங்கள்
  rationale: ஒப்பீட்டுக் கட்டமைப்பின் தொடர்பையும் மீண்டும் வரும் שׁמר + לעשות என்ற எச்சரிக்கை வலியுறுத்தலையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: צָרַעַת என்பதன் மொழிபெயர்ப்பு
  choice: தோல் நோய்
  alternative: தொழுநோய்
  rationale: தோராவில் இச்சொல் நவீன ஹான்சன் நோயை மட்டும் குறிப்பதில்லை; பலவகைச் சடங்கு சார்ந்த தோல் நிலைகளை உள்ளடக்குவதால் காலத்திற்குப் பொருந்தாத மருத்துவத் துல்லியத்தைத் தவிர்க்கிறது.
- issue: הַכֹּהֲנִים הַלְוִיִּם என்பவர்களின் அடையாளம்
  choice: லேவிய ஆசாரியர்கள்
  alternative: ஆசாரியர்களும் லேவியர்களும்
  rationale: இதை இரண்டு தனித்தனி குழுக்களாக அல்லாமல் லேவியைச் சேர்ந்த ஆசாரியர்களைக் குறிக்கும் உபாகமச் சொற்றொடராக மொழிபெயர்க்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியக்கூடிய கண்ணியமான கட்டளை நடையில் அமைக்கப்பட்டுள்ளது. எபிரெய மூலத்தின் எச்சரிக்கை, மிகுந்த கவனம், அறிவுறுத்தலைச் செயல்படுத்துதல் ஆகிய வலியுறுத்தல்கள் பாதுகாக்கப்பட்டுள்ளன.
