base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/024/007.yaml
  text: If a man is found kidnapping one of his brothers from the sons of Israel[a], and he enslaves him and sells him, then that kidnapper shall die[c][b]. So you shall purge the evil from your midst.
translation:
  language: ta
  text: ஒருவன் இஸ்ரயேல் மக்களாகிய தன் சகோதரர்களில்[b] ஒருவனைக் கடத்தி[a], அவனை அடிமையாக நடத்தி[c] விற்றிருப்பது கண்டுபிடிக்கப்பட்டால், அந்தக் கடத்தல்காரன் சாக வேண்டும். நீ உன் நடுவிலிருந்து தீமையை அகற்ற வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லுக்குச் சொல், ‘ஒரு நபரைத் திருடி.’
    reason: lexical_alternative
  - marker: b
    text: இங்கு ‘சகோதரர்கள்’ என்பது உடன்பிறந்தவர்களை மட்டும் அல்ல, இஸ்ரயேல் சமூகத்தைச் சேர்ந்த சக மக்களைக் குறிக்கிறது.
    reason: cultural_note
  - marker: c
    text: அல்லது, ‘அவனை அடிமையாக்கி.’ எபிரெயச் சொல் அவனைத் தனக்குரிய உடைமைபோல் நடத்துவதையும் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִמָּצֵא
  choice: கண்டுபிடிக்கப்பட்டால்
  rationale: நிபால் வடிவத்தின் ‘கண்டுபிடிக்கப்படுதல்’ என்ற செயப்பாட்டு அர்த்தத்தையும் சட்ட நிபந்தனை நடையையும் இயல்பான தமிழில் தருகிறது.
- source_word: אִישׁ
  choice: ஒருவன்
  rationale: எபிரெய ஒற்றை ஆண்பால் வடிவத்தைத் தக்கவைத்து, சட்ட உரைக்கு ஏற்ற சுருக்கமான தமிழை வழங்குகிறது.
- source_word: גֹּנֵב נֶפֶשׁ
  choice: ஒருவனைக் கடத்தி
  rationale: சொல்லுக்குச் சொல் ‘ஒரு நபரைத் திருடுதல்’; இச்சட்டச் சூழலில் மனிதரைக் கடத்துவதே தெளிவான பொருள்.
- source_word: מֵאֶחָיו מִבְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரயேல் மக்களான தன் சகோதரர்களில் ஒருவனை
  rationale: ‘சகோதரர்கள்’ என்ற உடன்படிக்கைச் சார்ந்த உறவுமொழியைப் பாதுகாத்து, அது இஸ்ரயேல் சமூகத்தினரைக் குறிக்கிறது என்பதையும் தெளிவாக்குகிறது.
- source_word: וְהִתְעַמֶּר בּוֹ
  choice: அவனை அடிமையாக நடத்தி
  rationale: கடத்தப்பட்டவரை உடைமை அல்லது அடிமைபோல் சுரண்டி நடத்தும் பொருளை வெளிப்படுத்துகிறது; வினையின் பொருள் வரம்பைத் தேவையின்றி குறுக்காமல் வைத்திருக்கிறது.
- source_word: וּמְכָרוֹ
  choice: விற்றது
  rationale: பொருள் பின்னொட்டுடன் வரும் מכר என்பதன் நேரடியான அர்த்தத்தைத் தக்கவைக்கிறது.
- source_word: וּמֵת הַגַּנָּב הַהוּא
  choice: அந்தக் கடத்தல்காரன் சாக வேண்டும்
  rationale: ‘அந்தத் திருடன் சாக வேண்டும்’ என்ற மூல சட்டக் கூற்றில், குறிப்பாக மனிதரைக் கடத்தியவனே சுட்டப்படுவதைத் தெளிவாக்குகிறது.
- source_word: וּבִעַרְתָּ הָרָע מִקִּרְבֶּךָ
  choice: நீ உன் நடுவிலிருந்து தீமையை அகற்ற வேண்டும்
  rationale: உபாகமத்தில் மீண்டும் வரும் நீதித்துறைச் சூத்திரத்தை இயல்பாகவும் அதன் கட்டாய வலிமையுடனும் மொழிபெயர்க்கிறது.
theological_decisions:
- issue: சட்ட உரையில் உடன்படிக்கைச் சமூக உறவைக் குறிக்கும் ‘சகோதரர்’ மொழி
  choice: ‘இஸ்ரயேல் மக்களான தன் சகோதரர்களில் ஒருவனை’ என்று தக்கவைத்தல்
  alternative: ‘தன் சக இஸ்ரயேலரில் ஒருவனை’
  rationale: மூலத்தின் குடும்ப உறவுமொழியைப் பாதுகாக்கிறது; அதேவேளை அடுத்த சொற்றொடர் இது உடன்பிறந்தவர்களை மட்டும் அல்ல, இஸ்ரயேல் சமூகத்தினரைக் குறிக்கிறது என்பதை விளக்குகிறது.
- issue: וְהִתְעַמֶּר בּוֹ என்பதில் உள்ள அடிமைப்படுத்தல் அல்லது சுரண்டல் நுணுக்கம்
  choice: ‘அவனை அடிமையாக நடத்தி’
  alternative: ‘அவனை அடிமையாக்கி’
  rationale: வினை கடத்தப்பட்டவரை அடிமை அல்லது விற்பனைப் பொருள்போல் பயன்படுத்துவதைச் சுட்டுகிறது. ‘அடிமையாக நடத்தி’ என்பது அந்தச் சுரண்டலைத் தெளிவாகக் கூறுவதோடு, செயல் முற்றிலும் சட்டநிலை மாற்றத்தையே குறிக்கும் என்று தீர்மானிப்பதைத் தவிர்க்கிறது.
- issue: குற்றவாளிக்கான மரணக் கூற்று
  choice: ‘சாக வேண்டும்’
  alternative: ‘கொல்லப்பட வேண்டும்’ அல்லது ‘மரண தண்டனை விதிக்கப்பட வேண்டும்’
  rationale: ומת என்ற மூலத்தின் நேரடி ‘சாக வேண்டும்’ என்ற வடிவத்தைப் பாதுகாக்கிறது; அது சொல்லாத செயப்பாட்டு அல்லது நிர்வாகச் சொற்றொடரைச் சேர்க்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் dignified சட்டநடை பயன்படுத்தப்பட்டுள்ளது. ‘சகோதரர்கள்,’ ‘உன் நடுவிலிருந்து தீமையை அகற்ற வேண்டும்’ போன்ற மூலத்தின் உடன்படிக்கை மற்றும் நீதித்துறைச் சொற்றொடர்கள் இயல்பை இழக்காமல் தக்கவைக்கப்பட்டுள்ளன.
