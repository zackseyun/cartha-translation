  text: לֹא תַעֲשֹׁ֥ק שָׂכִ֖יר עָנִ֣י וְ/אֶבְי֑וֹן מֵ/אַחֶ֕י/ךָ א֧וֹ מִ/גֵּרְ/ךָ֛ אֲשֶׁ֥ר בְּ/אַרְצְ/ךָ֖ בִּ/שְׁעָרֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/024/014.yaml
  text: You shall not oppress a hired worker who is poor and needy[a], whether one of your brothers or one of your sojourners who is in your land[b], within your gates.
translation:
  language: ta
  text: ஏழையும் வறியவனுமான கூலித் தொழிலாளியை ஒடுக்காதே[a]. அவன் உன் சகோதரர்களில் ஒருவனாக இருந்தாலும், உன் நாட்டில், உன் ஊர்களில் வாழும் அந்நியக் குடியிருப்பாளனாக இருந்தாலும் சரி[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘சுரண்டாதே’ அல்லது ‘மோசடி செய்யாதே’ என்றும் மொழிபெயர்க்கலாம்; எபிரெய வினைச்சொல் பொருளாதார ஒடுக்குதலையும் உள்ளடக்குகிறது.
    reason: lexical_alternative
  - marker: b
    text: நேர்ச்சொல்லாக, ‘உன் வாசல்களில்.’ இது ஒருவருடைய ஊர்கள் அல்லது சமூக அதிகார எல்லைக்குள் வாழ்வதைக் குறிக்கும் எபிரெய மரபுத்தொடர்.
    reason: cultural_note
lexical_decisions:
- source_word: תַעֲשֹׁק
  choice: ஒடுக்காதே
  rationale: עָשַׁק என்பது அதிகாரத்தைப் பயன்படுத்தி அநியாயம் செய்வதையும், குறிப்பாக பொருளாதாரச் சுரண்டலையும் குறிக்கலாம். ‘ஒடுக்காதே’ அதன் பரந்த அறநெறி வலிமையைத் தக்கவைக்கிறது; சூழலில் கூலியை மறுத்தல் போன்ற சுரண்டலும் இதில் அடங்கும்.
- source_word: שָׂכִיר
  choice: கூலித் தொழிலாளி
  rationale: கூலிக்காக அமர்த்தப்பட்டு வேலை செய்பவரைக் குறிக்கும் தெளிவான, இன்றைய தமிழ்ச் சொற்றொடர்.
- source_word: עָנִי וְאֶבְיוֹן
  choice: ஏழையும் வறியவனுமான
  rationale: பொருளாதார ரீதியில் பாதுகாப்பற்ற நிலையைக் தீவிரப்படுத்தும் இரட்டை வருணனையைத் தமிழில் இரு சொற்களாலும் தக்கவைக்கிறது.
- source_word: מֵאַחֶיךָ
  choice: உன் சகோதரர்களில் ஒருவன்
  rationale: எபிரெய மூலத்தின் உறவுமுறை உருவகத்தையும், இஸ்ரயேல் உடன்படிக்கைச் சமூகத்தைச் சேர்ந்த ஒருவரைக் குறிக்கும் பயன்பாட்டையும் தக்கவைக்கிறது.
- source_word: מִגֵּרְךָ
  choice: அந்நியக் குடியிருப்பாளன்
  rationale: இஸ்ரயேலரல்லாதவராக இருந்தும் அவர்களிடையே நிலையாக வாழ்ந்த பாதுகாக்கப்பட்ட அந்நியரை இது குறிக்கிறது. நவீன குடிவரவு சட்டப் பிரிவுகளை இதில் திணிக்காமல் சமூக-சட்ட நிலையை வெளிப்படுத்துகிறது.
- source_word: בִּשְׁעָרֶיךָ
  choice: உன் ஊர்களுக்குள்
  rationale: ‘உன் வாசல்களில்’ என்ற சொல்லாட்சியின் எபிரெயப் பொருள், ஒருவரின் ஊர்கள் அல்லது சமூக அதிகார எல்லைக்குள் என்பதாகும். இயல்பான தமிழில் அந்தக் கருத்தை நேரடியாக வழங்குகிறது.
theological_decisions:
- issue: உடன்படிக்கைச் சட்டத்தில் אַחֶיךָ என்ற உறவுமுறைச் சொல்
  choice: உன் சகோதரர்களில் ஒருவன்
  alternative: உன் சக இஸ்ரயேலரில் ஒருவன்
  rationale: மூலத்தின் ஆண்பால் உறவுமுறை மொழியையும் அதன் உடன்படிக்கைத் தொனியையும் தக்கவைக்கிறது; இன அல்லது தேசிய விளக்கத்தை நேரடியாக உரைக்குள் சேர்க்கவில்லை.
- issue: גֵּר என்பவரின் சமூக-சட்ட அடையாளம்
  choice: அந்நியக் குடியிருப்பாளன்
  alternative: குடியேறிய அந்நியன்
  rationale: சொந்த நாட்டினராக இல்லாவிட்டாலும் இஸ்ரயேல் சமூகத்தில் வாழ்ந்த பாதுகாக்கப்பட்ட குடியிருப்பாளரைச் சுட்டுகிறது; நவீன ‘அகதி’ அல்லது குறிப்பிட்ட குடிவரவு சட்டநிலையுடன் தவறாக ஒப்பிடுவதைத் தவிர்க்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சட்டக் கட்டளைக்குரிய கண்ணியமான ஒருமை நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘கூலித் தொழிலாளி’ இன்றைய வாசகருக்கு இயல்பானது; ‘அந்நியக் குடியிருப்பாளன்’ மூலத்தின் தனித்த சமூகப் பிரிவை நவீன அரசியல்-சட்டச் சொற்களால் குறுக்காமல் வெளிப்படுத்துகிறது.
