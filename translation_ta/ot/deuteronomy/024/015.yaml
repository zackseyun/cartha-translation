base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/024/015.yaml
  text: You shall give him his wages on his day[a], and the sun shall not go down on it, because he is poor and sets his life on it, so that he does not cry out against you to Yahweh, and it becomes sin in you.
translation:
  language: ta
  text: அவனுடைய கூலியை அன்றே கொடுத்துவிடு; அதன்மேல் சூரியன் மறைய விடாதே. ஏனெனில் அவன் ஏழை; அதையே தன் உயிராதாரமாக எதிர்நோக்கியிருக்கிறான்[a]. இல்லையெனில், அவன் உனக்கு எதிராக யாவேயிடம் முறையிடுவான்; அது உனக்குப் பாவமாகும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மொழியில் சொல்லுக்கு சொல், ‘அதை நோக்கி அவன் தன் உயிரை உயர்த்துகிறான்/சுமக்கிறான்.’ இது, அந்தக் கூலியையே அவன் தன் உயிர்வாழ்வுக்காக அவசரமாகச் சார்ந்திருப்பதைக் குறிக்கும் சொற்றொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּיוֹמוֹ
  choice: அன்றே
  rationale: எபிரெயச் சொற்றொடரின் நேரடிப் பொருள் ‘அவனுடைய நாளில்’ என்பதாக இருந்தாலும், கூலியை வேலை செய்த அதே நாளில் கொடுக்க வேண்டும் என்ற கால அவசரத்தை இயல்பான நவீனத் தமிழில் ‘அன்றே’ தெளிவாக வெளிப்படுத்துகிறது.
- source_word: שְׂכָרוֹ
  choice: அவனுடைய கூலி
  rationale: செய்த வேலைக்காகக் கிடைக்க வேண்டிய ஊதியத்தை இச்சூழலில் ‘கூலி’ இயல்பாகவும் துல்லியமாகவும் குறிக்கிறது.
- source_word: וְלֹא תָבוֹא עָלָיו הַשֶּׁמֶשׁ
  choice: அதன்மேல் சூரியன் மறைய விடாதே
  rationale: சூரிய மறைவுக்கு முன்பே கூலியைக் கொடுக்க வேண்டும் என்ற எபிரெய உருவகத்தையும், கால எல்லையையும் பாதுகாக்கிறது. ஆண்பால் ஒருமைப் பிரதிப்பெயர் இங்கு ‘கூலி’யைக் குறிப்பதாக எடுத்துக்கொள்ளப்பட்டுள்ளது.
- source_word: כִּי עָנִי הוּא
  choice: ஏனெனில் அவன் ஏழை
  rationale: עָנִי இச்சட்டச் சூழலில் பொருளாதாரத்தில் நலிவுற்ற தொழிலாளியைக் குறிக்கிறது; ‘ஏழை’ நேரடியும் பொதுவாகப் புரியக்கூடியதுமாகும்.
- source_word: וְאֵלָיו הוּא נֹשֵׂא אֶת נַפְשׁוֹ
  choice: அதையே தன் உயிராதாரமாக எதிர்நோக்கியிருக்கிறான்
  rationale: சொல்லுக்கு சொல் மொழிபெயர்த்தால் ‘அதை நோக்கித் தன் உயிரை உயர்த்துகிறான்/சுமக்கிறான்’ என வரும். கூலி கிடைப்பதை அவன் உயிர்வாழ்வுக்காக அவசரமாகச் சார்ந்திருப்பதைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது; அடிப்படை உருவகம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: וְלֹא יִקְרָא עָלֶיךָ אֶל יְהוָה
  choice: இல்லையெனில், அவன் உனக்கு எதிராக யாவேயிடம் முறையிடுவான்
  rationale: ஒடுக்கப்பட்ட தொழிலாளி கடவுளிடம் நீதிகேட்டு அழைக்கும் எச்சரிக்கைப் பொருளை ‘இல்லையெனில்’ மற்றும் ‘முறையிடுவான்’ இயல்பாக எடுத்துரைக்கின்றன.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய மூலத்தில் வரும் இறைப் பெயரான நான்கெழுத்துப் பெயரை ஒரு பட்டமாக மாற்றாமல், தமிழில் அறியப்பட்ட ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: וְהָיָה בְךָ חֵטְא
  choice: அது உனக்குப் பாவமாகும்
  rationale: ‘உன்னில்/உனக்கு பாவம் உண்டாகும்’ என்ற எபிரெய அமைப்பையும், கூலியைத் தாமதிப்பது பாவமாகக் கணிக்கப்படும் என்ற அறநெறி விளைவையும் இயல்பான தமிழில் காக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூல உரை பொதுப் பட்டத்தை அல்ல, தனிப்பட்ட இறைப் பெயரைப் பயன்படுத்துகிறது. எனவே அந்த வேறுபாட்டைப் பாதுகாக்க ‘யாவே’ என்று ஒலிபெயர்க்கப்பட்டுள்ளது.
- issue: וְהָיָה בְךָ חֵטְא என்பதன் அறநெறி விளைவு
  choice: அது உனக்குப் பாவமாகும்
  alternative: நீ குற்றவாளியாவாய்
  rationale: ‘குற்றவாளி’ என்பது சட்டரீதியான தீர்ப்பை அதிகமாக முன்வைக்கக்கூடும். மூலத்தில் உள்ள ‘உனக்குப் பாவம் உண்டாகும்’ என்ற பரந்த அறநெறி மொழியைத் தேர்ந்த வடிவம் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான சட்ட அறிவுறுத்தல் நடை பயன்படுத்தப்பட்டுள்ளது. ஒருமை ஆண்பால் வடிவங்கள் மூல உரையைப் பின்பற்றுகின்றன; ‘கொடுத்துவிடு’ மற்றும் ‘மறைய விடாதே’ கட்டளையின் உடனடித் தன்மையை வெளிப்படுத்துகின்றன.
