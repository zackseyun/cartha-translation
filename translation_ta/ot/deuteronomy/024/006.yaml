source:
  edition: WLC
  text: לֹא יַחֲבֹ֥ל רֵחַ֖יִם וָ/רָ֑כֶב כִּי נֶ֖פֶשׁ ה֥וּא חֹבֵֽל־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/024/006.yaml
  text: No one shall take a pair of millstones[a], or even the upper millstone, as a pledge, for he would be taking a life as a pledge.
translation:
  language: ta
  text: திரிகைக் கற்களையோ, திரிகையின் மேல்கல்லைக்கூடவோ எவரும் அடமானமாக எடுத்துக்கொள்ளக் கூடாது; ஏனெனில், அப்படிச் செய்வது ஓர் உயிரையே அடமானமாக எடுத்துக்கொள்வதாகும்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அப்படிச் செய்வது ஒருவரின் வாழ்வாதாரத்தையே அடமானமாக எடுத்துக்கொள்வதாகும்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יַחֲבֹל / חֹבֵל
  choice: அடமானமாக எடுத்துக்கொள்ள
  rationale: கடனுக்குப் பிணையமாக ஒரு பொருளை எடுத்துக்கொள்வதைச் சட்டச் சூழலில் חבל குறிக்கிறது. மூலத்தில் ஒரே வினை திரும்ப வருவதன் தொடர்பையும் தமிழில் இந்தச் சொற்றொடர் காக்கிறது.
- source_word: רֵחַיִם
  choice: திரிகைக் கற்கள்
  rationale: இருமை வடிவம் கையால் இயக்கப்படும் திரிகையின் இரு கற்களையும் தொகுப்பாகக் குறிக்கிறது. தமிழில் இயல்பாகவும் தெளிவாகவும் ‘திரிகைக் கற்கள்’ என வழங்கப்படுகிறது.
- source_word: וָרָכֶב
  choice: மேல் திரிகைக் கல்லைக்கூட
  rationale: רָכֶב என்பது இங்கு சுழலும் மேல் கல்லைக் குறிக்கிறது. முழுத் திரிகையை மட்டுமல்ல, அதன் இன்றியமையாத மேல் கல்லைக்கூட அடமானமாக எடுக்கக் கூடாது என்ற சட்ட வலிமையை ‘கூட’ வெளிப்படுத்துகிறது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: தடைக்கான காரணத்தை அறிமுகப்படுத்துவதால், நவீனத் தமிழில் தெளிவான காரண இணைப்பான ‘ஏனெனில்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: נֶפֶשׁ
  choice: ஒருவரின் உயிர்
  rationale: இங்கு பொருளற்ற ஆன்மாவைக் காட்டிலும், அன்றாட உணவு தயாரிக்கும் கருவியை இழப்பதால் ஆபத்துக்குள்ளாகும் ஒருவரின் வாழ்வையே נֶפֶשׁ குறிக்கிறது. ‘உயிர்’ மூலத்தின் வலிமையையும் உண்மையான பொருள் விரிவையும் காக்கிறது.
- source_word: הוּא
  choice: அப்படிச் செய்வது ... எடுத்துக்கொள்வதாகும்
  rationale: அடமானம் எடுப்பவரின் செயல் உண்மையில் உயிரையே அடமானம் எடுப்பதற்குச் சமம் என்பதை இயல்பான தமிழில் தெளிவாக்குகிறது; எபிரெய உரையின் வலியுறுத்தலும் காக்கப்படுகிறது.
theological_decisions:
- issue: சட்ட-சமூகச் சூழலில் נֶפֶשׁ என்பதன் பொருள்
  choice: உயிர்; வாழ்வாதாரத்தையும் உள்ளடக்கும் konkretமான வாழ்க்கை
  alternative: ஆத்துமா; நபர்; வாழ்வாதாரம் மட்டும்
  rationale: அன்றாட உணவைத் தயாரிக்கத் தேவையான கருவியைப் பறிப்பது கடன்பட்டவரின் வாழ்வையே ஆபத்துக்குள்ளாக்குகிறது. ‘உயிர்’ என்ற முதன்மை மொழிபெயர்ப்பு மூலத்தின் தீவிரத்தைப் பாதுகாக்கிறது; ‘வாழ்வாதாரம்’ என்ற சூழல்சார் நுண்பொருள் அடிக்குறிப்பில் தரப்படுகிறது. இது மனித இயல்பைப் பற்றிய கோட்பாட்டுத் தீர்ப்பு அல்ல.
translation_notes:
  register: நவீன நிலையான தமிழில், சட்டத் தடையின் கண்ணியமான தொனியுடன் மொழிபெயர்க்கப்பட்டது. ‘எவரும் ... கூடாது’ என்பது பொதுவான சட்டக் கட்டளையை இயல்பாக வெளிப்படுத்துகிறது. ‘திரிகை’ பாரம்பரியக் கையாலையின் பொருளைத் துல்லியமாகக் குறிக்கிறது; ‘மேல் திரிகைக் கல்’ அதன் குறிப்பிட்ட பகுதியை வாசகருக்குத் தெளிவாக்குகிறது.
