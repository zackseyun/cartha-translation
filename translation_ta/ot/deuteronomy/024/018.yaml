base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/024/018.yaml
  text: And remember that you were a servant in Egypt, and Yahweh your God redeemed you from there; therefore I am commanding you to do this.
translation:
  language: ta
  text: நீ எகிப்தில் அடிமையாக இருந்ததையும், உன் கடவுளாகிய யாவே உன்னை அங்கிருந்து மீட்டதையும் நினைவில் கொள். ஆகையால், இதைச் செய்யும்படி நான் உனக்குக் கட்டளையிடுகிறேன்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְזָכַרְתָּ
  choice: நினைவில் கொள்
  rationale: இணைப்பிடைச்சொல்லுடன் வந்த நிறைவுவினை இச்சூழலில் கட்டளையாகச் செயல்படுகிறது. தமிழில் இயல்பான கட்டளை வடிவம் பயன்படுத்தப்பட்டது; வாக்கிய இணைப்பு வாக்கிய அமைப்பிலேயே வெளிப்படுகிறது.
- source_word: כִּי
  choice: …என்பதை / …தையும்
  rationale: நினைவில் கொள்ள வேண்டிய செய்தியின் உள்ளடக்கத்தை அறிமுகப்படுத்துகிறது; காரணப்பொருளாக மாற்றாமல் தமிழ் இணை அமைப்பில் ‘இருந்ததையும்’ என வழங்கப்பட்டது.
- source_word: עֶבֶד
  choice: அடிமை
  rationale: எகிப்தில் இஸ்ரவேலரின் கட்டுண்ட சமூக நிலையைத் தெளிவாகக் காட்டுகிறது; ‘வேலைக்காரன்’ அல்லது ‘ஊழியன்’ அந்த வலிமையைத் தணிக்கும்.
- source_word: בְּמִצְרַיִם
  choice: எகிப்தில்
  rationale: மூலத்தில் உள்ள இடக்குறிப்பை கூடுதல் சொற்கள் இன்றி நேரடியாக வழங்குகிறது.
- source_word: וַיִּפְדְּךָ
  choice: உன்னை … மீட்டதையும்
  rationale: פדה அடிமைத்தனத்திலிருந்து விலைகொடுத்து விடுவித்தல் அல்லது மீட்டல் என்ற கருத்தைக் கொண்டது. ‘மீட்டார்’ தமிழில் இயல்பாகவும் வேதாகமத் தெய்வவியல் ஒலிப்பையும் காக்கும் வகையிலும் உள்ளது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: நான்கெழுத்துத் தெய்வீகப் பெயரை ஒரு பொதுப் பட்டமாக மாற்றாமல், தமிழில் பரவலாக அறியப்படும் பெயர்வடிவில் வழங்குகிறது.
- source_word: אֱלֹהֶיךָ
  choice: உன் கடவுளாகிய
  rationale: இரண்டாம் நபர் ஒருமை உடைமைப் பொருளை நேரடியாகக் காத்து, தெய்வீகப் பெயருடன் இயல்பாக இணைக்கிறது.
- source_word: מִשָּׁם
  choice: அங்கிருந்து
  rationale: முன்னர் குறிப்பிடப்பட்ட எகிப்தைச் சுட்டும் இயல்பான தமிழ் இடச்சுட்டு.
- source_word: עַל כֵּן
  choice: ஆகையால்
  rationale: மீட்பைத் தொடர்ந்து வரும் ஒழுக்கக் கட்டளையின் காரணவிளைவு உறவைத் தெளிவாகக் காட்டுகிறது.
- source_word: אָנֹכִי מְצַוְּךָ
  choice: நான் உனக்குக் கட்டளையிடுகிறேன்
  rationale: வெளிப்படையான முதலாம் நபர் சுட்டுப்பெயரும் வினையெச்ச வடிவமும் தரும் நிகழ்கால, வலியுறுத்தப்பட்ட கட்டளைத் தன்மையைப் பாதுகாக்கிறது.
- source_word: לַעֲשׂוֹת
  choice: செய்யும்படி
  rationale: עשה என்பதன் பரந்த ‘செய்’ பொருளை இயல்பான தமிழ் கட்டளைத் தொடரில் வழங்குகிறது.
- source_word: אֶת־הַדָּבָר הַזֶּה
  choice: இதை
  rationale: முந்தைய சட்ட அறிவுறுத்தலைச் சுட்டும் சொற்றொடரை நவீன தமிழில் இயல்பாக வழங்குகிறது; ‘இந்தக் காரியத்தை’ என்பதும் சாத்தியம், ஆனால் இங்கு தேவையற்ற கனத்தைத் தரும்.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரின் மொழிபெயர்ப்பு
  choice: யெகோவா
  alternative: யாவே; கர்த்தர்
  rationale: மூலத்தில் தனிப்பட்ட உடன்படிக்கைப் பெயர் நேரடியாக உள்ளது. அதைப் பொதுப் பட்டமான ‘கர்த்தர்’ என்று மாற்றாமல் பெயராகவே வைக்கப்பட்டுள்ளது. தமிழ் வாசகர்களிடையே நிலைபெற்ற ‘யெகோவா’ வடிவம் தேர்ந்தெடுக்கப்பட்டது; ‘யாவே’ என்பது மூல உச்சரிப்பை மீட்டமைக்கும் மாற்று வடிவம்.
- issue: எகிப்தில் இஸ்ரவேலரின் நிலையைச் சுட்டும் עֶבֶד
  choice: அடிமை
  alternative: வேலைக்காரன்; ஊழியன்
  rationale: இவ்வசனத்தின் ஒழுக்கத் தூண்டுதலுக்கு அடிமைப்படுத்தப்பட்ட நிலையே மையம். ஆகவே அதன் சமூக வலிமையைத் தணிக்காத ‘அடிமை’ தேர்ந்தெடுக்கப்பட்டது.
- issue: פדה என்பதின் மீட்பு நுணுக்கம்
  choice: மீட்டார்
  alternative: விடுவித்தார்; விலைகொடுத்து மீட்டார்
  rationale: மூல வினை மீட்பு/விடுவிப்பு கருத்தைக் கொண்டாலும், இவ்வசனம் செலுத்தப்பட்ட விலையை வெளிப்படையாகக் குறிப்பிடவில்லை. எனவே ‘விலைகொடுத்து’ என்பதைச் சேர்க்காமல் ‘மீட்டார்’ என ambiguity-ஐ காக்கிறது.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான, பொதுவாசகர்களுக்கு எளிதில் புரியும் தமிழ். இரண்டாம் நபர் ஆண்பால் ஒருமை வடிவத்தைத் தமிழ் பாலினமற்ற ‘நீ/உன்/உன்னை’ வடிவங்கள் இயல்பாக வெளிப்படுத்துகின்றன. மூலத்தின் நீண்ட ஒருங்கிணைந்த வாக்கியம் தமிழின் தெளிவுக்காக இரண்டு வாக்கியங்களாக அமைக்கப்பட்டது; காரணவிளைவு உறவு ‘ஆகையால்’ மூலம் காக்கப்பட்டுள்ளது.
