revisions:
- from: நீங்கள் எகிப்திலிருந்து புறப்பட்டபோது வழியில் உன் கடவுளாகிய யாவே மிரியாமுக்கு என்ன செய்தார் என்பதை நினைவில் கொள்[a][b].
  to: நீங்கள் எகிப்திலிருந்து புறப்பட்டபோது, வழியில் உன் கடவுளாகிய யாவே மிரியாமுக்குச் செய்ததை நினைவில் கொள்[a][b].
  rationale: The revision replaces an awkward interrogative-complement construction with a natural Tamil relative clause. It retains the source’s singular imperative (‘நினைவில் கொள்’), singular ‘உன் கடவுள்,’ and plural ‘நீங்கள் ... புறப்பட்டபோது’ rather than harmonizing them. Footnote a is revised into a complete, usable alternate rendering; footnote b remains accurate and properly anchored.
