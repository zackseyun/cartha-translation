source:
  edition: WLC
  text: זָכ֕וֹר אֵ֧ת אֲשֶׁר עָשָׂ֛ה יְהוָ֥ה אֱלֹהֶ֖י/ךָ לְ/מִרְיָ֑ם בַּ/דֶּ֖רֶךְ בְּ/צֵאתְ/כֶ֥ם מִ/מִּצְרָֽיִם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/024/009.yaml
  text: Remember what Yahweh your God did to Miriam on the way when you were coming out of Egypt[a][b].
translation:
  language: ta
  text: நீங்கள் எகிப்திலிருந்து புறப்பட்டபோது, வழியில் உன் கடவுளாகிய யாவே மிரியாமுக்குச் செய்ததை நினைவில் கொள்[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “வழியில் உன் கடவுளாகிய யாவே மிரியாமுக்குச் செய்திருந்ததை நினைவில் கொள்.”
    reason: עשה என்ற வினையின் கடந்தகாலச் செயலைச் சூழலின்படி முந்திய நிறைவுற்ற செயலாகவும் வெளிப்படுத்தலாம்.
  - marker: b
    text: அதாவது, எகிப்திலிருந்து வெளியேறிய பின் இஸ்ரவேலர் மேற்கொண்ட பயணத்தின்போது; எண்ணாகமம் 12:1–15-ஐப் பார்க்கவும்.
    reason: வரலாற்றுச் சூழலையும் தொடர்புடைய நிகழ்வையும் சுட்டும் குறுக்கு மேற்கோள்.
lexical_decisions:
- source_word: זָכוֹר
  choice: நினைவில் கொள்
  rationale: זכר என்பதன் ஆண்பால் ஒருமை கட்டளை வடிவத்தை நேரடியான, இயல்பான தமிழ் கட்டளையாக வழங்குகிறது; உடன்படிக்கைச் சூழலில் நினைவுகூர வேண்டிய வலியுறுத்தலையும் காக்கிறது.
- source_word: אֵת אֲשֶׁר עָשָׂה
  choice: என்ன செய்தார் என்பதை
  rationale: நினைவுகூர வேண்டிய உள்ளடக்கத்தை அறிமுகப்படுத்தும் தொடர்புச் சொற்றொடரை இயல்பான தமிழில் தருகிறது; עשה என்பதன் பொதுவான ‘செய்’ என்ற பொருளைத் தக்கவைக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய மூலத்தில் உள்ள இறைநாமத்தை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் பரவலாகப் புரியக்கூடிய ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: אֱלֹהֶיךָ
  choice: உன் கடவுளாகிய
  rationale: இரண்டாம் நபர் ஆண்பால் ஒருமை பின்னொட்டைக் காத்து, தமிழில் இயல்பான உடைமைத் தொடர்பாக மொழிபெயர்க்கிறது.
- source_word: לְמִרְיָם
  choice: மிரியாமுக்கு
  rationale: לְ முன்னிடைச்சொல் இங்கு யாவேயின் செயலால் பாதிக்கப்பட்ட நபரைக் குறிக்கிறது. ‘மிரியாமுக்கு’ என்பது அதன் துல்லியமான நுணுக்கத்தை அளவுக்கு மீறித் தீர்மானிக்காமல் விடுகிறது.
- source_word: בַּדֶּרֶךְ
  choice: வழியில்
  rationale: ‘வழி/பாதையில்’ என்ற நேரடிப் பொருளைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: בְּצֵאתְכֶם מִמִּצְרָיִם
  choice: நீங்கள் எகிப்திலிருந்து புறப்பட்டபோது
  rationale: இரண்டாம் நபர் பன்மையைக் காத்து, எகிப்திலிருந்து வெளியேறிய காலத்தைக் குறிக்கும் எபிரெய வினையெச்சத் தொடரை இயல்பான தமிழில் வழங்குகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைநாமத்தை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: ஆண்டவர்; யெகோவா
  rationale: மூலவசனம் நான்கு எழுத்து இறைநாமத்தை நேரடியாகப் பயன்படுத்துகிறது. ஆகவே அதை ஒரு பட்டமாக மாற்றாமல், ‘Yahweh’ என்பதற்குரிய தமிழ் ஒலிபெயர்ப்பாக வழங்கப்பட்டுள்ளது.
- issue: ஒருமைக்கும் பன்மைக்கும் இடையிலான மாற்றம்
  choice: ‘நீங்கள் ... புறப்பட்டபோது’ என்றும் ‘உன் ... நினைவில் கொள்’ என்றும் வேறுபாட்டைக் காத்தல்
  alternative: வசனம் முழுவதையும் ஒருமையிலோ பன்மையிலோ ஒரே சீராக்குதல்
  rationale: எபிரெயத்தில் புறப்பட்டவர்கள் பன்மையில் குறிப்பிடப்படுகின்றனர்; ஆனால் கட்டளையும் ‘உன் கடவுள்’ என்பதும் ஒருமையில் உள்ளன. இஸ்ரவேலை ஒரே உடன்படிக்கை மகனாக அணுகும் இந்த மொழிநடைத் திருப்பத்தை மறைக்காமல் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகருக்குப் புரியும் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. மூலத்தின் ஒருமை–பன்மை மாற்றம் திட்டமிட்டு பாதுகாக்கப்பட்டுள்ளது; அதனால் தமிழில் ‘நீங்கள்’ என்பதிலிருந்து ‘உன்/கொள்’ என்பதற்கான மாற்றம் காணப்படுகிறது.
