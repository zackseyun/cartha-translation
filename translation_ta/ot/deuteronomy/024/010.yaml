  rationale: לֹא உடன் வரும் imperfect இங்கு சட்டத் தடையை வெளிப்படுத்துகிறது; ‘நுழையக் கூடாது’ நவீனத் தமிழில் தெளிவான தடை மொழியாகும்.
- source_word: לַעֲבֹט עֲבֹטוֹ
  choice: அவனுடைய அடமானப் பொருளை வாங்குவதற்காக
  rationale: עבט இங்கு கடனுக்கான உத்தரவாதப் பொருளைப் பெற்றுக்கொள்வதைக் குறிக்கிறது. ‘அடமானப் பொருள்’ பொருளைத் தெளிவாக்குகிறது; ‘வாங்குதல்’ வலுக்கட்டாயமாகப் பறித்தல் என்ற மிகைப்படுத்தலைத் தவிர்க்கிறது.
