  text: When you lend your neighbor anything[a], you shall not go into his house to take his pledge.
translation:
  language: ta
  text: நீ உன் அயலானுக்கு எதையாவது கடனாகக் கொடுக்கும்போது[a], அவனுடைய அடமானப் பொருளைப் பெற்றுக்கொள்வதற்காக அவன் வீட்டுக்குள் நுழையக் கூடாது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நீ உன் அயலானுக்கு எதையாவது கடனாகக் கொடுத்தால்.”
    reason: כִּי வழக்குச் சட்டத்தில் ‘எப்போது’ அல்லது ‘என்றால்’ எனப் புரிந்துகொள்ளப்படலாம்; மூலத்தின் இந்தச் சாத்தியத்தைப் பாதுகாக்கிறது.
lexical_decisions:
- source_word: כִּי
  choice: கொடுக்கும்போது
