  rationale: הִפעיל வடிவமான תַשֶּׁה கடன் வழங்குதலைக் குறிக்கிறது; מְאוּמָה அதன் வரம்பை ‘எதையாவது’ என்று விரிவாக்குகிறது. தமிழில் இரண்டையும் இயல்பாக ஒருங்கிணைக்கிறது.
- source_word: בְרֵעֲךָ
