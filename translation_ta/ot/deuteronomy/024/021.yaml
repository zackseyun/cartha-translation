  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: כִּ֤י תִבְצֹר֙ כַּרְמְ/ךָ֔ לֹ֥א תְעוֹלֵ֖ל אַחֲרֶ֑י/ךָ לַ/גֵּ֛ר לַ/יָּת֥וֹם וְ/לָ/אַלְמָנָ֖ה יִהְיֶֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/024/021.yaml
  text: When you harvest the grapes of your vineyard[a], you shall not go over it again after yourself; it shall be for the sojourner, the fatherless[c][b], and the widow.
translation:
  language: ta
  text: உன் திராட்சைத்தோட்டத்தில் திராட்சைப் பழங்களை அறுவடை செய்யும்போது, அதில் மீதமிருப்பவற்றை மறுபடியும் பறிக்காதே[a]; அவை குடியேறி வாழும் அந்நியருக்கும்[b], தந்தையற்றவருக்கும்[c], விதவைக்கும் உரியவையாக இருக்கட்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அறுவடைக்குப் பிறகு அதில் எஞ்சியவற்றைச் சேகரிக்காதே.” எபிரெய வினைச்சொல், முதல் முறை பறித்த பிறகு மீதமுள்ளவற்றைச் சேகரிக்க மீண்டும் செல்வதைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: “குடியேறி வாழும் அந்நியர்” என்பது இஸ்ரவேலரிடையே வாழ்ந்த, அந்த நாட்டைப் பிறப்பிடமாகக் கொள்ளாத குடியிருப்பாளரைக் குறிக்கிறது.
    reason: cultural_note
  - marker: c
    text: அல்லது, “அனாதை.” எபிரெயச் சொல் பல சூழல்களில் நேரடியாக “தந்தையற்றவர்” என்று பொருள்படும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: செய்யும்போது
  rationale: இங்கு எதிர்பார்க்கப்படும் ஒரு சூழலை அறிமுகப்படுத்தும் சட்ட மொழியாக இருப்பதால், நிபந்தனைக்குரிய ‘செய்தால்’ என்பதைக் காட்டிலும் ‘செய்யும்போது’ இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: תִבְצֹר
  choice: திராட்சைப் பழங்களை அறுவடை செய்யும்போது
  rationale: בצר என்பது திராட்சைத்தோட்டத்திலிருந்து திராட்சைப் பழங்களைச் சேகரிப்பதைக் குறிப்பாகக் குறிக்கிறது; நவீன தமிழில் ‘அறுவடை செய்’ அதன் வேளாண்மைச் சூழலைத் தெளிவாகக் கூறுகிறது.
- source_word: כַּרְמְךָ
  choice: உன் திராட்சைத்தோட்டத்தில்
  rationale: כֶּרֶם என்பதற்கான இயல்பான நவீனத் தமிழ் இணைச்சொல் ‘திராட்சைத்தோட்டம்’.
- source_word: לֹא תְעוֹלֵל אַחֲרֶיךָ
  choice: அதில் மீதமிருப்பவற்றை மறுபடியும் பறிக்காதே
  rationale: முதல் அறுவடைக்குப் பின் மீதமிருப்பவற்றை உரிமையாளர் இரண்டாம் முறையாகச் சென்று சேகரிக்கக் கூடாது என்பதே வேளாண்மைச் சூழலில் இந்தச் சொற்றொடரின் பொருள். தெளிவற்ற சொற்சொல் மொழிபெயர்ப்பைத் தவிர்த்து, இரண்டாம் முறை பறித்தலின் கருத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: לַגֵּר
  choice: குடியேறி வாழும் அந்நியருக்கு
  rationale: גֵּר என்பது இஸ்ரவேலரிடையே நிரந்தரமாக அல்லது நீண்டகாலம் வாழும், அந்த நாட்டைப் பிறப்பிடமாகக் கொள்ளாத குடியிருப்பாளரைக் குறிக்கிறது. ‘குடியேறி வாழும் அந்நியர்’ என்பது வெறும் பயணி அல்லது பொதுவான வெளிநாட்டவர் என்ற தவறான பொருளைத் தவிர்க்கிறது.
- source_word: לַיָּתוֹם
  choice: தந்தையற்றவருக்கு
  rationale: יָתוֹם என்பதன் நேரடியான சமூகச் சட்டப் பொருளை ‘தந்தையற்றவர்’ காக்கிறது; சூழலின்படி ‘அனாதை’ என்றும் புரிந்துகொள்ளலாம்.
- source_word: וְלָאַלְמָנָה
  choice: விதவைக்கு
  rationale: אַלְמָנָה என்பதற்கான நேரான, வழக்கமான தமிழ் இணைச்சொல் ‘விதவை’.
- source_word: יִהְיֶה
  choice: உரியவையாக இருக்கட்டும்
  rationale: மீதியாக விடப்பட்ட திராட்சைப் பழங்கள் குறிப்பிடப்பட்ட நலிவுற்றவர்களுக்காக இருக்க வேண்டும் என்ற சட்ட நோக்கை இது வெளிப்படுத்துகிறது; எபிரெயத்தின் ‘இருக்கட்டும்/இருக்கும்’ என்ற வடிவத்தையும் காக்கிறது.
