translation_notes:
  register: ஒருமை ஆண்பால் முகவரியைத் தமிழில் இயல்பான சட்ட அறிவுறுத்தலாக ‘உன்/பறிக்காதே’ என்று வழங்கியுள்ளது. நடை நவீனமானதும் கண்ணியமானதும் பொதுவாசகர்களுக்குத் தெளிவானதும் ஆகும்; வேளாண்மைச் செயலில் இரண்டாம் முறை சேகரிப்பது என்ற நுணுக்கம் அடிக்குறிப்புடன் பாதுகாக்கப்பட்டுள்ளது.
