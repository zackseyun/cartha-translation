source:
  edition: WLC
  text: לֹ֣א תַטֶּ֔ה מִשְׁפַּ֖ט גֵּ֣ר יָת֑וֹם וְ/לֹ֣א תַחֲבֹ֔ל בֶּ֖גֶד אַלְמָנָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/024/017.yaml
  text: You shall not pervert the justice due to a sojourner or an orphan[a], nor take a widow’s garment as a pledge.
translation:
  language: ta
  text: அந்நியக் குடியிருப்பாளருக்கும் தந்தையற்ற பிள்ளைக்கும் உரிய நீதியைத் திரித்துவிடாதே[a]; விதவையின் ஆடையை அடமானமாக எடுத்துக்கொள்ளாதே.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அந்நியக் குடியிருப்பாளர்” என்பதற்கு “அந்நியன்” அல்லது “பரதேசி” என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல், இஸ்ரவேலரிடையே வாழ்ந்து அவர்களுடைய சமூக மற்றும் சட்டப் பாதுகாப்பைப் பெற்ற பூர்வகுடியல்லாத ஒருவரைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַטֶּה
  choice: புரட்டாதே
  rationale: נטה என்பதன் ஹிஃபில் வடிவம் நீதிசார் சூழலில் நீதியை வளைத்தல் அல்லது தவறான திசைக்குத் திருப்புதல் என்பதைக் குறிக்கிறது. ‘நீதியைப் புரட்டுதல்’ என்பது குறுகியதும் இயல்பானதும் ஆகும்.
- source_word: מִשְׁפַּט
  choice: உரிய நீதி
  rationale: מִשְׁפַּט என்பது நீதி, நீதித் தீர்ப்பு, அல்லது ஒருவருக்குரிய சட்ட உரிமை எனப் பொருள்படலாம். இங்கு பாதுகாப்பற்றவர்களுக்கு மறுக்கப்படக்கூடாத நீதியான உரிமையை ‘உரிய நீதி’ தெளிவாக வெளிப்படுத்துகிறது.
- source_word: גֵּר
  choice: அந்நியக் குடியிருப்பாளர்
  rationale: גֵּר என்பது வழிப்போக்கரைக் குறிக்காமல், இஸ்ரவேலரிடையே வசிக்கும் பூர்வகுடியல்லாத ஒருவரைக் குறிக்கிறது. ‘அந்நியக் குடியிருப்பாளர்’ அதன் குடியிருப்பு மற்றும் சட்டப் பாதுகாப்பு சார்ந்த நுணுக்கத்தைத் தக்கவைக்கிறது.
- source_word: יָתוֹם
  choice: தந்தையற்ற பிள்ளை
  rationale: יָתוֹם குறிப்பாகத் தந்தையின் பாதுகாப்பை இழந்த பிள்ளையைக் குறிக்கலாம். ‘தந்தையற்ற பிள்ளை’ அந்தப் பண்டைய சமூக-சட்ட நுணுக்கத்தை ‘அனாதை’ என்பதைக் காட்டிலும் துல்லியமாகப் பாதுகாக்கிறது.
- source_word: תַחֲבֹל
  choice: அடமானமாக எடுத்துக்கொள்ளாதே
  rationale: חבל என்ற வினைச்சொல் இச்சட்டச் சூழலில் கடனுக்கான பிணையாக ஒரு பொருளை எடுத்துக்கொள்வதைக் குறிக்கிறது. இந்தத் தமிழ் சொற்றொடர் அதன் பொருளை இயல்பாகத் தெரிவிக்கிறது.
- source_word: בֶּגֶד
  choice: ஆடை
  rationale: בֶּגֶד என்பது பொதுவாக உடை அல்லது ஆடையைக் குறிக்கிறது. ஆடையின் குறிப்பிட்ட வகையைத் தேவையின்றி நிர்ணயிக்காமல் ‘ஆடை’ எபிரெயச் சொல்லின் பரப்பைத் தக்கவைக்கிறது.
- source_word: אַלְמָנָה
  choice: விதவை
  rationale: אַלְמָנָה என்பது விதவையைக் குறிக்கிறது; தமிழில் உடைமை உறவை ‘விதவையின் ஆடை’ என்று இயல்பாக வெளிப்படுத்தலாம்.
theological_decisions:
- issue: גֵּר எனப்படும் பாதுகாக்கப்பட்ட சமூகப் பிரிவை மொழிபெயர்த்தல்
  choice: அந்நியக் குடியிருப்பாளர்
  alternative: அந்நியன்; வெளிநாட்டவர்; பரதேசி
  rationale: இந்த வசனம் இஸ்ரவேலரின் சமூகத்திற்குள் வாழ்ந்த பூர்வகுடியல்லாத ஒருவரின் சட்டப் பாதுகாப்பைப் பற்றியது. ‘அந்நியக் குடியிருப்பாளர்’ அவரை சாதாரண வெளிநாட்டவராகவோ தற்காலிக வழிப்போக்கராகவோ மாற்றாமல், குடியிருப்பு மற்றும் சட்ட நிலை இரண்டையும் வெளிப்படுத்துகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சட்டக் கட்டளையின் நேரடியான ஒருமை ஏவல் நடையைத் தக்கவைத்துள்ளோம். ‘புரட்டாதே’ மற்றும் ‘அடமானமாக எடுத்துக்கொள்ளாதே’ என்பவை முறையே நீதிசார் மற்றும் கடன் சார்ந்த செயல்களை சாதாரண வாசகர்களுக்குத் தெளிவாக எடுத்துரைக்கின்றன.
