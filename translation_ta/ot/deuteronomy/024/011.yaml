revisions:
- from: நீ வெளியே நிற்க வேண்டும்; உன்னிடம் கடன்பட்டிருக்கும் மனிதன்[a] அடகுப் பொருளை உன்னிடம் வெளியே கொண்டுவர வேண்டும்.
  to: நீ வெளியே நிற்க வேண்டும்; உனக்குக் கடன்பட்டிருக்கும் மனிதன்[a] அடகுப் பொருளை வெளியே உன்னிடம் கொண்டு வர வேண்டும்.
  rationale: The revision retains the source's legal instruction, male singular referent, and the lexical ambiguity of נשה. It improves modern Tamil word order and changes "உன்னிடம்" to "உனக்குக்" in the debtor relationship, which is the more idiomatic way to express being indebted to someone; "உன்னிடம்" is retained for the directional sense of bringing the pledge to the creditor.
