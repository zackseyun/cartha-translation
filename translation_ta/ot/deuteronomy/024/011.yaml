source:
  edition: WLC
  text: בַּ/ח֖וּץ תַּעֲמֹ֑ד וְ/הָ/אִ֗ישׁ אֲשֶׁ֤ר אַתָּה֙ נֹשֶׁ֣ה ב֔/וֹ יוֹצִ֥יא אֵלֶ֛י/ךָ אֶֽת הַ/עֲב֖וֹט הַ/חֽוּצָ/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/024/011.yaml
  text: You shall stand outside[a], and the man to whom you are making the loan shall bring the pledge out to you.
translation:
  language: ta
  text: நீ வெளியே நிற்க வேண்டும்; உனக்குக் கடன்பட்டிருக்கும் மனிதன்[a] அடகுப் பொருளை வெளியே உன்னிடம் கொண்டு வர வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நீ கடன் கொடுத்த மனிதன்.” எபிரெய வெளிப்பாடு கடன் கொடுப்பவரின் செயலையோ கடனாளியின் கடன்பட்ட நிலையையோ முன்னிறுத்தலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּחוּץ
  choice: வெளியே
  rationale: வீட்டிற்குப் புறம்பே நிற்பதைக் குறிக்கும் இயல்பான நவீனத் தமிழ் சொல்; கடன்பட்டவரின் வீட்டிற்குள் நுழையக் கூடாது என்ற சட்டச் சூழலுக்கும் பொருந்துகிறது.
- source_word: תַּעֲמֹד
  choice: நிற்க வேண்டும்
  rationale: עמד என்பதன் அடிப்படை உடல்சார் பொருளான ‘நில்’ என்பதைப் பாதுகாக்கிறது; இங்கு வெளியே காத்திருப்பதும் உட்கருத்தாக உள்ளது.
- source_word: וְהָאִישׁ
  choice: மனிதன்
  rationale: இங்கு אִישׁ ஆண் கடனாளியைக் குறிக்கிறது; தமிழில் ‘மனிதன்’ என்பது இயல்பாகவும் மூலத்தின் பாலினக் குறிப்பைத் தக்கவைத்தும் உள்ளது.
- source_word: אֲשֶׁר אַתָּה נֹשֶׁה בוֹ
  choice: உன்னிடம் கடன்பட்டிருக்கும்
  rationale: נשה என்ற எபிரெய வெளிப்பாடு கடன் கொடுப்பவரின் செயலைவோ கடனாளியின் கடன்பட்ட நிலையையோ முன்னிறுத்தலாம். தமிழில் இந்த வடிவம் கடனாளர்–கடனாளி உறவைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது; மாற்று நுணுக்கம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: יוֹצִיא
  choice: கொண்டுவர வேண்டும்
  rationale: יצא என்பதன் ஹிஃபில் வடிவம் ‘வெளியே வரச் செய்’ என்பதால், அடுத்துள்ள திசைச்சொல்லுடன் சேர்ந்து ‘வெளியே கொண்டுவர வேண்டும்’ என்பது இயல்பான மொழிபெயர்ப்பு.
- source_word: אֵלֶיךָ
  choice: உன்னிடம்
  rationale: அடகுப் பொருள் கடன் கொடுத்தவரை நோக்கிக் கொண்டுவரப்படுவதை இயல்பான தமிழில் குறிக்கிறது.
- source_word: הָעֲבוֹט
  choice: அடகுப் பொருள்
  rationale: கடனுக்குப் பிணையாக வைக்கப்படும் பொருளைக் குறிக்கும்; ‘அடமானம்’ என்பதைவிட சாதாரண வாசகருக்கு நேரடியாகப் புரியக்கூடியதும் பொருளையே தெளிவாகச் சுட்டுவதுமாகும்.
- source_word: הַחוּצָה
  choice: வெளியே
  rationale: வீட்டின் உள்ளிருந்து புறத்தை நோக்கிய இயக்கத்தைத் துல்லியமாகக் காட்டுகிறது.
