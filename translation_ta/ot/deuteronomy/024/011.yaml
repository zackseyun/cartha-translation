translation_notes:
  register: நவீன நிலையான தமிழில், சட்டக் கட்டளைக்கேற்ற கண்ணியமானவும் நேரடியானவும் உள்ள நடை. ஒருமை இரண்டாம் நபரைக் காட்ட ‘நீ/உன்னிடம்’ பயன்படுத்தப்பட்டுள்ளது; மூலத்தின் கட்டளைத் தன்மையை ‘வேண்டும்’ தக்கவைக்கிறது.
