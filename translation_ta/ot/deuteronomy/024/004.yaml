base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/024/004.yaml
  text: her first husband[a], who sent her away, may not take her again to be his wife after she has been defiled, for that is an abomination before Yahweh; and you shall not bring sin upon the land that Yahweh your God is giving you as an inheritance.
translation:
  language: ta
  text: அவளை அனுப்பிவிட்ட அவளுடைய முதல் கணவன், அவள் தீட்டுப்பட்ட[a] பின்பு, அவளைத் திரும்பவும் தன் மனைவியாக ஏற்றுக்கொள்ளக் கூடாது. ஏனெனில் அது யாவேக்கு முன்பாக அருவருப்பானது. உங்கள் கடவுளாகிய யாவே உங்களுக்கு மரபுரிமையாகக் கொடுக்கிற நாட்டின்மேல் நீங்கள் பாவத்தைக் கொண்டுவரக் கூடாது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “தீட்டுப்பட்ட” என்பதை “அசுத்தமான” அல்லது “தூய்மையிழந்த” என்றும் மொழிபெயர்க்கலாம். தீட்டின் துல்லியமான தன்மையை எபிரெய உரை குறிப்பிடவில்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּעְלָהּ הָרִאשׁוֹן
  choice: அவளுடைய முதல் கணவன்
  rationale: திருமணச் சூழலில் בעל என்பது ‘கணவன்’ எனப் பொருள்படும்; הָרִאשׁוֹן என்பதன் நேரடியான ‘முதல்’ என்ற வேறுபாட்டையும் இது காக்கிறது.
- source_word: שִׁלְּחָהּ
  choice: அவளை அனுப்பிவிட்ட
  rationale: שלח என்பதன் அடிப்படைப் பொருள் ‘அனுப்பிவிடுதல்.’ இச்சட்டச் சூழலில் மணவிலக்கைக் குறித்தாலும், எபிரெயச் சொல்லாக்கத்தை இயல்பான தமிழில் காக்கிறது.
- source_word: לָשׁוּב לְקַחְתָּהּ לִהְיוֹת לוֹ לְאִשָּׁה
  choice: அவளைத் திரும்பவும் தன் மனைவியாக ஏற்றுக்கொள்ள
  rationale: மீண்டும் திருமணம் செய்வதைக் குறிக்கும் எபிரெய வினைத்தொடரை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: אַחֲרֵי אֲשֶׁר הֻטַּמָּאָה
  choice: அவள் தீட்டுப்பட்ட பின்பு
  rationale: טמא என்பதன் செயப்பாட்டு வடிவத்திலுள்ள தூய்மையிழப்பு/தீட்டுப்படுதல் என்ற பரந்த பொருளை, அதன் சரியான தன்மையைத் தீர்மானிக்காமல் காக்கிறது.
- source_word: תוֹעֵבָה
  choice: அருவருப்பானது
  rationale: உடன்படிக்கை சார்ந்த வலுவான ஒழுக்க மதிப்பீட்டை நவீன தமிழில் தெளிவாகவும் கண்ணியமாகவும் தெரிவிக்கிறது.
- source_word: לִפְנֵי יְהוָה
  choice: யாவேக்கு முன்பாக
  rationale: ‘யாவேயின் முன்னிலையில்/பார்வையில்’ என்ற பொருளைச் சுருக்கமாகக் காக்கிறது; திருப்பெயர் யாவே என ஒலிபெயர்க்கப்படுகிறது.
- source_word: וְלֹא תַחֲטִיא אֶת הָאָרֶץ
  choice: நாட்டின்மேல் நீங்கள் பாவத்தைக் கொண்டுவரக் கூடாது
  rationale: חטא என்பதன் ஹிஃபில் வடிவம் நாட்டின்மேல் பாவம் அல்லது குற்றப்பழியை வருவிப்பதைக் குறிக்கலாம்; தேவையற்ற தனிமனிதப்படுத்தலைத் தவிர்த்து அதைக் காக்கிறது.
- source_word: נֹתֵן לְךָ נַחֲלָה
  choice: உங்களுக்கு உரிமைச் சொத்தாகக் கொடுக்கிற
  rationale: נחלה என்பதிலுள்ள மரபுரிமை/உரிமை உடைமை என்ற உடன்படிக்கை-நிலக் கருத்தை இயல்பான தமிழில் தெரிவிக்கிறது.
theological_decisions:
- issue: ‘அவள் தீட்டுப்பட்ட பின்பு’ என்பதன் துல்லியமான தன்மை
  choice: ‘தீட்டுப்பட்ட’ என்ற பரந்த சொல்லை வைத்திருத்தல்
  alternative: சடங்குமுறையில் அசுத்தமானாள்; பாலியல் முறையில் கறைப்பட்டாள்; இடைப்பட்ட திருமணத்தால் மீண்டும் மணக்கத் தகுதியிழந்தாள்
  rationale: எபிரெய உரை טמא என்பதன் செயப்பாட்டு வடிவத்தைப் பயன்படுத்துகிறது; ஆனால் தீட்டின் தன்மையை இவ்வசனத்தில் வரையறுக்கவில்லை. ஆகவே சட்ட மற்றும் இறையியல் தெளிவின்மையை மொழிபெயர்ப்பு தீர்த்துவிடவில்லை.
- issue: יְהוָה என்ற திருப்பெயர்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலத்தில் உள்ள உடன்படிக்கைத் திருப்பெயரை மறைக்காமல் தமிழில் ஒலிபெயர்க்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; சட்டவிதிக்கேற்ற கண்ணியமான நடை. ‘கூடாது’ என்பது איסור வலிமையைத் தெளிவாகத் தருகிறது. ‘நாடு’ என்பது הָאָרֶץ என்பதைக் குறிப்பிட்ட வாக்குத்தத்த நிலமாக இச்சூழலில் இயல்பாக வெளிப்படுத்துகிறது.
