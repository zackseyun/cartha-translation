source:
  edition: WLC
  text: לֹֽא יוּמְת֤וּ אָבוֹת֙ עַל בָּנִ֔ים וּ/בָנִ֖ים לֹא יוּמְת֣וּ עַל אָב֑וֹת אִ֥יש בְּ/חֶטְא֖/וֹ יוּמָֽתוּ־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/024/016.yaml
  text: Fathers shall not be put to death for sons[a], and sons shall not be put to death for fathers[b]; each man shall be put to death for his own sin.
translation:
  language: ta
  text: மகன்களுக்காகத் தந்தையருக்கு மரண தண்டனை விதிக்கக் கூடாது; தந்தையருக்காக மகன்களுக்கு மரண தண்டனை விதிக்கக் கூடாது. ஒவ்வொருவருக்கும் அவரவர் பாவத்திற்காகவே மரண தண்டனை விதிக்கப்பட வேண்டும்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יוּמְתוּ / יוּמָתוּ
  choice: மரண தண்டனை விதிக்க
  rationale: מות என்பதன் ஹொஃபால் வடிவம் ஒருவரைச் சாகச் செய்வதைக் குறிக்கிறது; இந்தச் சட்டச் சூழலில் அது சாதாரண மரணத்தை அல்ல, நீதித் தீர்ப்பின்படி அளிக்கப்படும் மரண தண்டனையைச் சுட்டுகிறது.
- source_word: אָבוֹת
  choice: தந்தையர்
  rationale: எபிரெயச் சொல் பொதுவாகப் ‘பெற்றோர்’ என்று அல்ல, குறிப்பாகத் ‘தந்தையர்’ என்று கூறுகிறது; இணை அமைப்பையும் மூலத்தின் பாலினக் குறிப்பையும் இது காக்கிறது.
- source_word: בָּנִים
  choice: மகன்கள்
  rationale: சட்டக் கொள்கை பிள்ளைகள் அனைவருக்கும் பொருந்தக்கூடியதாக இருந்தாலும், மூல உரை நேரடியாக ‘மகன்கள்’ என்ற ஆண்பால் உறவுமுறைச் சொல்லையே பயன்படுத்துகிறது.
- source_word: עַל
  choice: -க்காக
  rationale: இந்தச் சட்டச் சூழலில் மற்றொருவருடைய செயலின் காரணமாக அல்லது அவர் சார்பாகத் தண்டிக்கப்படுவதை இவ்வுருபு குறிக்கிறது; தமிழில் ‘-க்காக’ சுருக்கமாகவும் இயல்பாகவும் அந்தப் பொருளைத் தருகிறது.
- source_word: אִישׁ
  choice: ஒவ்வொருவருக்கும்
  rationale: אִישׁ இங்கு பகிர்நிலைப் பொருளில் ஒவ்வொரு தனிநபரையும் குறிக்கிறது. இயல்பான தமிழில் ‘ஒவ்வொருவரும்’ தனிநபர் பொறுப்பைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: בְּחֶטְאוֹ
  choice: அவரவர் பாவத்திற்காகவே
  rationale: உடைமை விகுதி ஒவ்வொருவருடைய சொந்தப் பாவத்தைக் குறிக்கிறது. ‘அவரவர்’ தந்தை அல்லது மகனின் குற்றத்தை மற்றவர் சுமப்பதில்லை என்ற முரண்பாட்டை இயல்பாக வெளிப்படுத்துகிறது; ‘-வே’ அந்தத் தனிப்பட்ட அடிப்படையை வலியுறுத்துகிறது.
theological_decisions:
- issue: மரண தண்டனையில் தனிநபர் பொறுப்பு
  choice: ஒருவருடைய பாவத்திற்காக அவருக்கே நீதிமுறையாக மரண தண்டனை விதிக்கப்பட வேண்டும்; தந்தை–மகன் இடையே அந்தத் தண்டனை மாற்றப்படக் கூடாது.
  alternative: தலைமுறைகள் தாண்டி வரும் பாவத்தின் எல்லா விளைவுகளையும் பற்றிய பொதுவான கூற்று.
  rationale: மீண்டும் வரும் מות வினையின் ஹொஃபால் வடிவமும் சட்டச் சூழலும் நீதிமுறையான மரண தண்டனையைச் சுட்டுகின்றன. வசனம் தனிநபர் பொறுப்பை உறுதிப்படுத்தினாலும், அதன் நேரடி கூற்றை எல்லா வகையான பாவ விளைவுகளுக்கும் விரிவுபடுத்தாமல் மொழிபெயர்ப்பது பொருத்தமானது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் சட்டநடை பயன்படுத்தப்பட்டுள்ளது. ‘கொல்லப்படுதல்’ என்ற பொதுவான சொல்லுக்குப் பதிலாகச் சூழல் கோரும் நீதித்துறைப் பொருளைத் தெளிவாக்க ‘மரண தண்டனை விதிக்க’ என வழங்கப்பட்டுள்ளது; வாக்கியத்தின் இணை அமைப்பும் தனிநபர் பொறுப்பின் வலியுறுத்தலும் காக்கப்பட்டுள்ளன.
