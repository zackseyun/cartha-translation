source:
  edition: WLC
  text: כִּ֣י תִקְצֹר֩ קְצִֽירְ/ךָ֨ בְ/שָׂדֶ֜/ךָ וְ/שָֽׁכַחְתָּ֧ עֹ֣מֶר בַּ/שָּׂדֶ֗ה לֹ֤א תָשׁוּב֙ לְ/קַחְתּ֔/וֹ לַ/גֵּ֛ר לַ/יָּת֥וֹם וְ/לָ/אַלְמָנָ֖ה יִהְיֶ֑ה לְמַ֤עַן יְבָרֶכְ/ךָ֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ בְּ/כֹ֖ל מַעֲשֵׂ֥ה יָדֶֽי/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/024/019.yaml
  text: When you reap your harvest in your field and forget a sheaf in the field[a], you shall not go back to take it. It shall be for the sojourner, the fatherless, and the widow[b], so that Yahweh your God may bless you in all the work of your hands.
translation:
  language: ta
  text: நீ உன் வயலில் அறுவடை செய்யும்போது, வயலில் ஒரு கதிர்க்கட்டையை மறந்துவிட்டால், அதை எடுத்துக்கொள்ளத் திரும்பிப் போகக் கூடாது. அது உன்னிடையே குடியிருக்கும் அந்நியருக்கும்[a], தந்தையற்றவருக்கும்[b], விதவைக்கும் உரியதாக இருக்க வேண்டும். இதனால் உன் கடவுளாகிய யாவே உன் கைகளால் செய்யும் எல்லா வேலைகளிலும் உன்னை ஆசீர்வதிப்பார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘உன்னிடையே குடியிருக்கும் அந்நியர்’ என்பதை ‘வேற்று நாட்டிலிருந்து வந்து குடியிருப்பவர்’ என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல், இஸ்ரவேலரிடையே வாழ்ந்த பூர்வீகமற்ற குடியிருப்பாளரைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: ‘தந்தையற்றவர்’ என்பதை ‘அனாதை’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי תִקְצֹר קְצִירְךָ
  choice: நீ ... அறுவடை செய்யும்போது
  rationale: כִּי இங்கு ஒரு சூழ்நிலை சார்ந்த சட்ட நிகழ்வை அறிமுகப்படுத்துகிறது; ‘செய்யும்போது’ என்பது அதன் நிபந்தனைத் தன்மையையும் இயல்பான தமிழ் சட்ட நடையையும் காக்கிறது. תִקְצֹר என்பது தானியத்தை அறுப்பதைக் குறிக்கிறது.
- source_word: בְשָׂדֶךָ
  choice: உன் வயலில்
  rationale: வேளாண்மைச் சூழலில் שָׂדֶה என்பதற்கான இயல்பான, துல்லியமான தமிழ்ச் சொல் ‘வயல்’.
- source_word: עֹמֶר
  choice: ஒரு கதிர்க்கட்டை
  rationale: இங்கு עֹמֶר அளவையல்ல, அறுக்கப்பட்ட தானியக் கதிர்களின் கட்டைக் குறிக்கிறது. ‘கதிர்க்கட்டை’ அந்தப் படிமத்தைத் தெளிவாகக் காக்கிறது.
- source_word: לֹא תָשׁוּב לְקַחְתּוֹ
  choice: அதை எடுத்துக்கொள்ளத் திரும்பிப் போகக் கூடாது
  rationale: திரும்பிச் செல்வதையும் அந்தக் கட்டை மீண்டும் எடுத்துக்கொள்வதையும் தடைசெய்யும் எபிரெயச் சொற்றொடரின் இரு கூறுகளையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: לַגֵּר
  choice: உன்னிடையே குடியிருக்கும் அந்நியருக்கு
  rationale: גֵּר என்பது வெறுமனே அறிமுகமற்ற ஒருவரை அல்ல, இஸ்ரவேலரிடையே வாழும் பூர்வீகமற்ற குடியிருப்பாளரைக் குறிக்கிறது. சூழலை வெளிப்படையாகச் சேர்ப்பது தமிழில் அந்தச் சமூக-சட்ட நுட்பத்தைத் தெளிவாக்குகிறது.
- source_word: לַיָּתוֹם
  choice: தந்தையற்றவருக்கு
  rationale: יָתוֹם குறிக்கும் பாதுகாப்பற்ற குடும்ப-சமூக நிலையை நேரடியாகக் காக்கிறது; ‘அனாதை’ என்பது இயல்பான மாற்று வாசிப்பு.
- source_word: יִהְיֶה
  choice: உரியதாக இருக்க வேண்டும்
  rationale: இந்த விளைபொருள் பலவீனமான சமூகத்தினருக்காக ஒதுக்கப்பட வேண்டும் என்ற சட்ட விதியைத் தெரிவிக்கிறது; முறையான சொத்துரிமை மாற்றத்தை தேவையின்றி வலியுறுத்தவில்லை.
- source_word: לְמַעַן
  choice: இதனால்
  rationale: கட்டளைக்குக் கீழ்ப்படிவதற்கும் யாவேயின் ஆசீர்வாதத்திற்கும் இடையிலான நோக்கம் அல்லது விளைவு சார்ந்த தொடர்பைத் தமிழில் இயல்பாகக் காட்டுகிறது.
- source_word: בְכֹל מַעֲשֵׂה יָדֶיךָ
  choice: உன் கைகளின் எல்லா வேலைகளிலும்
  rationale: எபிரெய மொழியின் உடலுறுப்பு சார்ந்த சொல்லோவியத்தைத் தக்கவைத்தபடி, ஒருவரின் அனைத்து உழைப்பையும் குறிக்கும் வகையில் புரிந்துகொள்ளக்கூடியதாக உள்ளது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலத்தில் நான்கெழுத்து இறைப்பெயர் நேரடியாக உள்ளது. அதை பொதுப்பட்டமாக மாற்றாமல், ‘Yahweh’ என்பதற்கான இயல்பான தமிழ் ஒலிபெயர்ப்பாக ‘யாவே’ பயன்படுத்தப்படுகிறது.
- issue: גֵּר என்ற சமூக-சட்ட வகை
  choice: உன்னிடையே குடியிருக்கும் அந்நியர்
  alternative: அந்நியர்; வேற்று நாட்டுக் குடியிருப்பாளர்
  rationale: இவர் சாதாரண வழிப்போக்கரோ அறிமுகமற்றவரோ அல்ல; இஸ்ரவேலரின் சமூகத்தில் வாழும் பூர்வீகமற்ற குடியிருப்பாளர். தேர்ந்தெடுக்கப்பட்ட வாசிப்பு அந்த நுட்பத்தைப் பிரிவுசார் கருத்தைச் சேர்க்காமல் வெளிப்படுத்துகிறது.
- issue: לְמַעַן காட்டும் ஆசீர்வாதத் தொடர்பு
  choice: இதனால் ... ஆசீர்வதிப்பார்
  alternative: ஆசீர்வதிப்பதற்காக
  rationale: எபிரெயச் சொல் நோக்கம் அல்லது விளைவைக் குறிக்கக்கூடும். ‘இதனால்’ அந்தத் தொடர்பைக் காக்கிறது; மனிதச் செயல் கடவுளை இயந்திரமாகக் கட்டுப்படுத்துகிறது என்ற கருத்தைத் தேவையின்றி வலியுறுத்தாது.
translation_notes:
  register: நவீன நிலையான தமிழில், ஒருமை இரண்டாம் நபரை மூலத்தைப் போலத் தொடர்ந்து பயன்படுத்தும் கண்ணியமான சட்ட நடை. ‘கதிர்க்கட்டை’ வேளாண் படிமத்தைத் தெளிவாக வைத்திருக்கிறது; அரிதான தொழில்நுட்பச் சொற்கள் தவிர்க்கப்பட்டுள்ளன. அடிக்குறிப்பு குறிகள் அவை விளக்கும் சொற்களுக்குப் பின் நேரடியாக வைக்கப்பட்டுள்ளன.
