base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/024/013.yaml
  text: You must surely return the pledge to him at sunset[a], so that he may lie down in his cloak and bless you[b]; and it will be righteousness for you before Yahweh your God.
translation:
  language: ta
  text: சூரியன் மறையும் நேரத்தில் அந்த அடமானப் பொருளை அவனுக்குக் கண்டிப்பாகத் திருப்பிக் கொடு; அப்போது அவன் தன் மேலாடையைப் போர்த்திக்கொண்டு படுத்து உன்னை ஆசீர்வதிப்பான்; உன் கடவுளாகிய யாவேயின் முன்னிலையில் அது உனக்கு நீதியாக இருக்கும்.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அடமானமாகப் பெறப்பட்ட பொருளை” அல்லது “பிணையாக எடுக்கப்பட்டதை.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அது உனக்கு நீதியான செயலாகக் கருதப்படும்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הָשֵׁב תָּשִׁיב
  choice: கண்டிப்பாகத் திருப்பிக் கொடுத்துவிடு
  rationale: முற்றுவினையுடன் வரும் வினையெச்சப் பெயருரு கட்டளையை வலியுறுத்துகிறது; நவீன தமிழில் ‘கண்டிப்பாக’ அந்த அழுத்தத்தை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: הַעֲבוֹט
  choice: அடமானமாக வாங்கியதை
  rationale: கடனுக்குப் பாதுகாப்பாகப் பெறப்பட்ட பொருளைக் குறிக்கிறது. ‘அடமானப் பொருள்’ என்பதைக் காட்டிலும் இத்தொடர் சாதாரண வாசகருக்கு உடனடியாகப் புரியும்.
- source_word: כְּבֹא הַשֶּׁמֶשׁ
  choice: சூரியன் மறையும் நேரத்தில்
  rationale: எபிரெய மொழியின் சொற்படியான ‘சூரியன் வரும்போது’ என்பது சூரிய மறைவைக் குறிக்கும் மரபுத்தொடர்.
- source_word: וְשָׁכַב
  choice: அப்போது அவன் ... படுத்து
  rationale: இணைப்புத் தொடரை இயல்பான தமிழில் விளைவு அல்லது தொடர்நிகழ்வாகக் காட்டுகிறது; தெளிவில்லாத இடத்தில் நோக்கத்தை மட்டும் திணிக்கவில்லை.
- source_word: בְּשַׂלְמָתוֹ
  choice: தன் மேலாடையைப் போர்த்திக்கொண்டு
  rationale: இரவில் போர்வையாகவும் பயன்படும் வெளிப்புற ஆடையைக் குறிக்கிறது; சூழலில் அதன் நடைமுறைப் பயன்பாட்டைத் தெளிவாக்குகிறது.
- source_word: וּבֵרֲכֶךָּ
  choice: உன்னை வாழ்த்துவான்
  rationale: ברך இங்கு கடன்பெற்றவன் கடன்கொடுத்தவனை நன்றியோடு வாழ்த்துவதையோ ஆசீர்வதிப்பதையோ குறிக்கலாம்; ‘வாழ்த்துவான்’ நவீன தமிழில் இயல்பானது.
- source_word: וּלְךָ תִּהְיֶה צְדָקָה
  choice: அது ... உனக்கு நீதியாக இருக்கும்
  rationale: செயல் கடவுளின் முன்னிலையில் சரியானதாகக் கருதப்படும் பொருளைத் தக்கவைத்து, கணக்கிடப்படுதல் அல்லது புண்ணியம் போன்ற கூடுதல் கருத்துகளைத் திணிக்கவில்லை.
- source_word: לִפְנֵי יְהוָה אֱלֹהֶיךָ
  choice: உன் கடவுளாகிய யெகோவாவின் முன்னிலையில்
  rationale: לִפְנֵי என்பதன் முன்னிலை அல்லது பார்வை சார்ந்த பொருளையும், יהוה என்ற தனிப்பெயரையும் வெளிப்படையாகப் பேணுகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யெகோவா
  alternative: யாவே
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் பரவலாக அறியப்படும் தனிப்பெயர் வடிவமாக ‘யெகோவா’ பயன்படுத்தப்படுகிறது; பொதுப்பட்டமான ‘கர்த்தர்’ என்று மாற்றாமல் எபிரெய மூலத்தின் தனிப்பெயர் தன்மையைப் பேணுகிறது.
- issue: צְדָקָה என்பதன் பொருள்
  choice: உனக்கு நீதியாக இருக்கும்
  alternative: உனக்கு நீதியான செயலாகக் கருதப்படும்
  rationale: மூலத்திலுள்ள சுருக்கத்தையும் உடன்படிக்கை அல்லது கணக்கீட்டு ஒலிப்பையும் திறந்த நிலையில் வைக்கிறது; பின்னைய இறையியல் பொருளை வெளிப்படையாகச் சேர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழ்; சட்டச் சூழலின் கட்டளைத் தன்மையைப் பேணியபடி, சாதாரண வாசகருக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ஒருமை ஆண்பால் சூழல் மூலத்தின்படி தக்கவைக்கப்பட்டுள்ளது.
