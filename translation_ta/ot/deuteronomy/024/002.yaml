  yaml_path: translation/ot/deuteronomy/024/002.yaml
  text: and she leaves his house and goes and becomes another man's wife,[a]
translation:
  language: ta
  text: அவள் அவனுடைய வீட்டைவிட்டு வெளியேறி, போய், வேறொருவனுக்கு மனைவியானால்,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லுக்கு சொல், ‘வேறொரு மனிதனுக்கு ஆனாள்.’ இங்கு எபிரெய மரபுத்தொடர் அவள் வேறொருவனைத் திருமணம் செய்துகொள்வதைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָצְאָה מִבֵּיתוֹ
  choice: அவள் அவனுடைய வீட்டைவிட்டு வெளியேறி
  rationale: יצא என்பதன் கால் தொடர் வடிவமும் מן என்ற முன்னொட்டும் சேர்ந்து, அவள் அவனுடைய வீட்டிலிருந்து வெளியேறுவதைச் சட்ட நிகழ்வுகளின் தொடராகக் கூறுகின்றன. இயல்பான நவீனத் தமிழில் ‘வீட்டைவிட்டு வெளியேறி’ என்பது இரண்டையும் தெளிவாகக் காட்டுகிறது.
- source_word: וְהָלְכָה
  choice: போய்
  rationale: הלך இங்கு வெளியேறுதலுக்குப் பின் வரும் அடுத்த செயலைக் குறிக்கிறது. ‘போய்’ என்பது நடையின் முறையைத் தேவையின்றி விவரிக்காமல் இயல்பாகத் தொடரைத் தருகிறது.
- source_word: וְהָיְתָה לְאִישׁ אַחֵר
  choice: வேறொருவனுக்கு மனைவியானால்
  rationale: சொல்லுக்கு சொல் ‘வேறொரு மனிதனுக்கு ஆனாள்’ என்ற அமைப்பு, இச்சூழலில் மற்றொருவனுடன் திருமண உறவுக்குள் நுழைவதைக் குறிக்கும் எபிரெய மரபுத்தொடர். தமிழில் ‘மனைவியானால்’ என்று வெளிப்படுத்துவது அந்த உறவுப் பொருளை இயல்பாகவும் தெளிவாகவும் தருகிறது; ‘-ஆனால்’ என்பது முந்தைய வசனத்தில் தொடங்கிய நிபந்தனைச் சட்ட வாக்கியத்தின் தொடரைத் தக்கவைக்கிறது.
theological_decisions:
- issue: לְאִישׁ אַחֵר என்ற சொற்றொடரின் திருமணப் பொருள்
  choice: வேறொருவனுக்கு மனைவியானால்
  alternative: வேறொருவனுக்கு ஆனாள்
  rationale: விவாகரத்து மற்றும் மறுமணத்தைப் பற்றிய உடனடிச் சூழல் திருமண உறவைச் சுட்டுகிறது. அதைக் ‘மனைவி’ என வெளிப்படுத்துவது மறைமுகப் பொருளைத் தெளிவாக்குகிறது; திருமணத்தின் தன்மை குறித்த கூடுதல் சமயக் கருத்தைச் சேர்ப்பதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், சட்ட உரைக்கேற்ற கண்ணியமான ஆனால் பொதுவாசகர்களுக்குப் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. 24:1-ல் தொடங்கும் நிபந்தனை அமைப்பின் தொடரை உணர்த்த ‘மனைவியானால்’ தேர்ந்தெடுக்கப்பட்டுள்ளது.
