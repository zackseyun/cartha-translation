  text: כִּֽי יִקַּ֥ח אִ֛ישׁ אִשָּׁ֖ה וּ/בְעָלָ֑/הּ וְ/הָיָ֞ה אִם לֹ֧א תִמְצָא חֵ֣ן בְּ/עֵינָ֗י/ו כִּי מָ֤צָא בָ/הּ֙ עֶרְוַ֣ת דָּבָ֔ר וְ/כָ֨תַב לָ֜/הּ סֵ֤פֶר כְּרִיתֻת֙ וְ/נָתַ֣ן בְּ/יָדָ֔/הּ וְ/שִׁלְּחָ֖/הּ מִ/בֵּיתֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/024/001.yaml
  text: If a man takes a wife and marries her[a], and it happens that she does not find favor in his eyes because he has found in her some indecency, and he writes her a certificate of divorce, puts it into her hand, and sends her out of his house,
translation:
  language: ta
  text: ஒருவன் ஒரு பெண்ணை மணந்து அவளுக்குக் கணவனான பின்பு, அவளிடம் வெட்கக்கேடான ஏதோ ஒன்றை[a] அவன் கண்டதால் அவனுக்குப் பிரியமில்லாமல் போனால், அவன் அவளுக்கு மணவிலக்குச் சான்றிதழை எழுதி, அதை அவளுடைய கையில் கொடுத்து, அவளைத் தன் வீட்டிலிருந்து அனுப்பிவிட்டால்,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அநாகரிகமான ஒரு காரியம்’ அல்லது ‘அவமானத்துக்குரிய ஏதோ ஒன்று’ என்றும் மொழிபெயர்க்கலாம். எபிரேயச் சொற்றொடரின் பொருள் திட்டவட்டமாக இல்லை; அது ஒன்றுக்கு மேற்பட்ட விதங்களில் புரிந்துகொள்ளப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ஒருவன் ... போனால்
  rationale: இங்கு כִּי காரணத்தைக் குறிப்பதல்ல; நிபந்தனை வடிவிலான சட்ட நிகழ்வைத் தொடங்குகிறது. தமிழ் சட்டநடைக்கு இயல்பாக நிபந்தனை வினைமுற்று பயன்படுத்தப்பட்டது.
- source_word: יִקַּח אִישׁ אִשָּׁה וּבְעָלָהּ
  choice: ஒருவன் ஒரு பெண்ணை மணந்து அவளுக்குக் கணவனான பின்பு
  rationale: ‘ஒரு மனைவியை எடுத்தல்’ என்ற எபிரேய மரபுத்தொடரைச் சொற்சொல்லாக மாற்றாமல், திருமண உறவுக்குள் நுழைவதைத் தெளிவாகவும் கண்ணியமாகவும் தெரிவிக்கிறது; וּבְעָלָהּ என்பதன் கணவன் ஆகுதல் என்ற தனி நுணுக்கமும் காக்கப்படுகிறது.
- source_word: לֹא תִמְצָא חֵן בְּעֵינָיו
  choice: அவனுடைய பார்வையில் அவள் தயவு பெறாமல் போனால்
  rationale: ‘அவனுடைய கண்களில் தயவு காணுதல்’ என்ற மூல உருவகத்தை நவீன தமிழில் புரியக்கூடிய ‘பார்வையில்’ என்ற சொல்லுடன் காக்கிறது; இதை வெறுமனே ‘அவனுக்குப் பிடிக்காமல் போனால்’ என்று உளவியல் விருப்பமாகக் குறுக்கவில்லை.
- source_word: כִּי מָצָא בָהּ
  choice: அவளிடம் ... அவன் கண்டதால்
  rationale: அந்தச் சட்ட நிகழ்வுக்குள் கணவன் கூறும் காரணத்தை כִּי விளக்குகிறது; ‘கண்டதால்’ அதன் காரணத் தொடர்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: עֶרְוַת דָּבָר
  choice: வெட்கக்கேடான ஏதோ ஒன்று
  rationale: இந்தச் சொற்றொடர் திட்டமிட்ட அளவில் பொதுவாகவும் தெளிவற்றதாகவும் உள்ளது. குறிப்பிட்ட பாலியல் குற்றம் அல்லது வேறு ஓர் ஒழுக்கக்கேடு என்று வரையறுக்காமல், அவமானம் அல்லது அநாகரிகம் சார்ந்த பொருளையும் அதன் தெளிவின்மையையும் காக்கிறது.
- source_word: סֵפֶר כְּרִיתֻת
  choice: மணவிலக்குச் சான்றிதழ்
  rationale: திருமண உறவை முறிக்கும் முறையான எழுத்துப்பூர்வ ஆவணத்தை நவீனத் தமிழில் தெளிவாகக் குறிக்கிறது.
- source_word: וְנָתַן בְּיָדָהּ
  choice: அதை அவளுடைய கையில் கொடுத்து
  rationale: ஆவணத்தைப் பெண்ணின் கையில் நேரடியாகக் கொடுக்கும் சட்ட நடைமுறையின் உடல்சார்ந்த செயலை மூலத்துக்கு நெருக்கமாகக் காக்கிறது.
- source_word: וְשִׁלְּחָהּ מִבֵּיתוֹ
  choice: அவளைத் தன் வீட்டிலிருந்து அனுப்பிவிட்டால்
  rationale: அவளை அனுப்புதல் மற்றும் கணவனுடைய வீட்டிலிருந்து வெளியேற்றுதல் ஆகிய இரு கூறுகளையும் வெளிப்படுத்துகிறது; அடுத்த வசனங்களுக்குச் செல்லும் நிபந்தனைத் தொடரையும் ‘விட்டால்’ காக்கிறது.
theological_decisions:
- issue: இந்த வசனம் மணவிலக்கைக் கட்டளையிடுகிறதா, அல்லது நிபந்தனைச் சட்ட நிகழ்வைத் தொடங்குகிறதா?
  choice: மணவிலக்கை அனுமதிக்கும் அல்லது கட்டளையிடும் தனித்த கட்டளையாக அல்லாமல், உபாகமம் 24:1–4 வரை நீளும் நிபந்தனைச் சட்ட நிகழ்வின் தொடக்கமாக மொழிபெயர்க்கப்பட்டது.
  alternative: ‘அவன் மணவிலக்குச் சான்றிதழை எழுதிக் கொடுத்து அவளை அனுப்பிவிட வேண்டும்’ என்று கட்டளை வடிவில் மொழிபெயர்த்தல்.
  rationale: எபிரேய தொடரமைப்பில் 1ஆம் வசனம் நிபந்தனையைத் தொடங்குகிறது; சட்டத் தடை அல்லது தீர்மானம் பின்னர் வருகிறது. எனவே விவாகரத்துக்கு நேரடியான தெய்வீக ஒப்புதல் அல்லது கட்டளை என்று மொழிபெயர்ப்பு முன்கூட்டியே தீர்மானிக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான சட்டநடை பயன்படுத்தப்பட்டுள்ளது. வசனம் அடுத்தடுத்த நிபந்தனைகளோடு தொடர்வதைக் காட்ட இறுதியில் முற்றுப்புள்ளிக்குப் பதிலாகக் காற்புள்ளி வைக்கப்பட்டுள்ளது. எபிரேயத்தின் பாலின மற்றும் குடும்ப அமைப்பு மாற்றப்படாமல் இருந்தாலும், ‘உடைமையாக்குதல்’ போன்ற தவறான நவீனப் பொருள் தோன்றாதவாறு திருமண மொழி இயல்பாக்கப்பட்டுள்ளது.
