  text: וְ/אִם אִ֥ישׁ עָנִ֖י ה֑וּא לֹ֥א תִשְׁכַּ֖ב בַּ/עֲבֹטֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/024/012.yaml
  text: And if he is a poor man[a], you shall not sleep with his pledge.
translation:
  language: ta
  text: அவன் ஏழையானால், அவன் அடமானமாகக் கொடுத்த பொருளை உன்னிடம் வைத்துக்கொண்டு நீ படுக்கக் கூடாது.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: நேரடியாக, “அவனுடைய அடமானப் பொருளுடன் நீ படுக்கக் கூடாது.” அதாவது, கடனுக்குப் பாதுகாப்பாக அவன் கொடுத்த பொருளை இரவு முழுவதும் நீ வைத்திருக்கக் கூடாது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: அவன் … இருந்தால்
  rationale: முந்தைய வசனத்தின் சட்டக் கருத்தைத் தொடரும் நிபந்தனையை இயல்பான தமிழில் தெரிவிக்கிறது; தமிழில் தனியாக ‘மேலும்’ சேர்க்காமல் தொடர்ச்சி சூழலால் உணரப்படுகிறது.
- source_word: אִישׁ עָנִי הוּא
  choice: அவன் ஏழையாக இருந்தால்
  rationale: இங்கு עָנִי பொருளாதார வறுமையையும் பாதிப்புக்குள்ளாகும் நிலையையும் குறிக்கிறது. ஆண்பால் ஒருமைச் சுட்டை ‘அவன்’ காக்கிறது; הוּא தரும் வலியுறுத்தலும் இயல்பான நிபந்தனை அமைப்பில் வெளிப்படுகிறது.
- source_word: לֹא תִשְׁכַּב
  choice: நீ இரவில் படுக்கக் கூடாது
  rationale: שׁכב என்பதன் நேரடிப் பொருளான ‘படுத்தல்’ என்பதைக் காக்கிறது. இச்சட்டச் சூழலில் அது அடமானப் பொருளை இரவு முழுவதும் வைத்திருப்பதைக் குறிப்பதால் ‘இரவில்’ என்று தெளிவுபடுத்தப்பட்டுள்ளது.
- source_word: בַּעֲבֹטוֹ
  choice: அவன் அடமானமாகக் கொடுத்த பொருளை வைத்துக்கொண்டு
  rationale: עֲבוֹט கடனுக்கான பாதுகாப்பாகக் கொடுக்கப்பட்ட பொருளைக் குறிக்கிறது. ב முன்னிடைச்சொல் இங்கு அந்தப் பொருளைத் தன் வசம் வைத்தவாறு இரவைக் கழிப்பது என்ற நடைமுறைப் பொருளைத் தருகிறது.
theological_decisions: []
translation_notes:
  register: நவீனத் தரத் தமிழில், சட்டத்திற்குரிய கண்ணியமான ஆனால் எளிதில் புரியும் நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘அடமானமாகக் கொடுத்த பொருள்’ என்பது சட்டப் பொருளைத் தெளிவாகச் சொல்கிறது; அடிக்குறிப்பில் எபிரேயத்தின் உருவகத்தன்மை பாதுகாக்கப்படுகிறது.
