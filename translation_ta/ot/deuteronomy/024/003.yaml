base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/024/003.yaml
  text: and the latter man hates her[a], and writes her a certificate of divorce, and puts it into her hand, and sends her out of his house, or if the latter man dies[c][b], who took her as his wife—
translation:
  language: ta
  text: பின்னைய மனிதன் அவளை வெறுத்து[a], அவளுக்காக மணமுறிவுச் சான்றிதழ் ஒன்றை எழுதி, அதை அவள் கையில் கொடுத்து, அவளைத் தன் வீட்டிலிருந்து அனுப்பிவிட்டாலோ, அல்லது அவளைத் தனக்கு மனைவியாக எடுத்துக்கொண்ட அந்தப் பின்னைய மனிதன் இறந்துவிட்டாலோ—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அவளை வெறுக்கத் தொடங்கி’ என்றும் மொழிபெயர்க்கலாம். எபிரெய வினைச்சொல்லின் அடிப்படைப் பொருள் ‘வெறுத்தல்’; இச்சட்ட நிகழ்வுத் தொடரில் அவள்மீது பகைமை வளர்ந்து, அதன்பின் அவன் மணமுறிவு செய்வதையும் இது குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׂנֵאָהּ
  choice: அவளை வெறுத்து
  rationale: שׂנא என்பதன் அடிப்படை வலிமையான பொருள் ‘வெறு.’ சட்டச் சூழல் என்பதற்காக அதை ‘விரும்பாமல்’ என்று மென்மையாக்காமல், எபிரெயச் சொல்லின் வலிமை காக்கப்படுகிறது; qatal வடிவத்தின் நிகழ்வுத் தொடர்ச்சியைத் தமிழ் வினையெச்சம் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: הָאִישׁ הָאַחֲרוֹן
  choice: பிந்திய அந்த மனிதன்
  rationale: אַחֲרוֹן இங்கு முந்தைய மனிதனுக்கு எதிராக ‘பிந்தியவன்’ என்பதைக் குறிக்கிறது. மூலத்தில் ‘கணவன்’ என்ற பெயர்ச்சொல் இல்லாததால் ‘மனிதன்’ தக்கவைக்கப்படுகிறது.
- source_word: וְכָתַב לָהּ סֵפֶר כְּרִיתֻת
  choice: அவளுக்காக மணமுறிவுச் சான்றிதழ் ஒன்றை எழுதி
  rationale: סֵפֶר என்பது எழுத்துப்பூர்வ ஆவணம்; כְּרִיתֻת என்பது உறவைத் துண்டித்தல் அல்லது கலைத்தலைக் குறிக்கும் சட்டச் சொல். ‘மணமுறிவுச் சான்றிதழ்’ நவீன தமிழில் தெளிவாகவும் முறையானதாகவும் உள்ளது.
- source_word: וְנָתַן בְּיָדָהּ
  choice: அதை அவள் கையில் கொடுத்து
  rationale: ஆவணம் நேரடியாக அவளிடம் ஒப்படைக்கப்படும் நடைமுறையைச் சொற்சார்ந்தும் இயல்பான தமிழிலும் வெளிப்படுத்துகிறது.
- source_word: וְשִׁלְּחָהּ מִבֵּיתוֹ
  choice: அவளைத் தன் வீட்டிலிருந்து அனுப்பிவிட்டாலோ
  rationale: שׁלח இச்சூழலில் அனுப்பிவிடுதல் அல்லது விடுவித்தல்; מִבֵּיתוֹ கூறும் இடவியல் பொருளும் வெளிப்படையாகத் தக்கவைக்கப்படுகிறது.
- source_word: אוֹ כִי יָמוּת
  choice: அல்லது ... இறந்துவிட்டாலோ
  rationale: சட்ட வழக்கின் மாற்று நிபந்தனையை ‘அல்லது ... -ஆலோ’ என்ற இயல்பான தமிழ் அமைப்பு தெளிவாகக் காட்டுகிறது.
- source_word: אֲשֶׁר לְקָחָהּ לוֹ לְאִשָּׁה
  choice: அவளைத் தனக்கு மனைவியாக எடுத்துக்கொண்ட
  rationale: לקח + לוֹ + לְאִשָּׁה என்ற திருமண மரபுத்தொடரின் வடிவத்தை இயன்றவரை காக்கிறது; வெறும் ‘மணந்துகொண்ட’ என்பதைக் காட்டிலும் மூலத்தின் கூறுகளை வெளிப்படுத்துகிறது.
