translation_notes:
  register: நவீன நிலையான தமிழில், சட்ட உரைக்கு ஏற்ற முறையான ஆனால் பொதுவாசகர்களுக்குப் புரியும் நடை பயன்படுத்தப்பட்டது. வசனம் முந்தைய வசனத்தில் தொடங்கிய நிபந்தனைத் தொடரின் பகுதியாக இருப்பதால் இறுதியில் நீண்ட கோடு வைக்கப்பட்டுள்ளது. வழங்கப்பட்ட ஆங்கில அடுக்கில் அடிக்குறிப்பு குறியீடுகள் இடமாறியிருந்ததால், மூலத் தகவலுடன் நேரடியாகப் பொருந்தும் ‘வெறுத்து’ குறித்த அடிக்குறிப்பு மட்டும் சேர்க்கப்பட்டது.
