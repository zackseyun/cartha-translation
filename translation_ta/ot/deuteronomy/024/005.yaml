base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/024/005.yaml
  text: When a man takes a new wife[a], he shall not go out with the army, nor shall any duty be imposed on him. He shall be free for his household for one year[d][c][b], and he shall make his wife whom he has taken rejoice.
translation:
  language: ta
  text: ஒருவன் புதிதாக ஒரு பெண்ணைத் திருமணம் செய்துகொண்டால், அவன் படையுடன் புறப்படக் கூடாது; எந்தக் கடமையும் அவன்மேல் சுமத்தப்படக் கூடாது.[a] அவன் ஓராண்டுக்கு தன் குடும்பத்திற்காக விலக்கு பெற்றிருப்பான்,[b] தான் திருமணம் செய்த மனைவியை மகிழ்விப்பான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “எந்தப் பணியும் அவனுக்கு ஒப்படைக்கப்படக் கூடாது” என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொற்றொடர் படைக்கடமையை மட்டும் அல்லாமல் வேறு பொது அல்லது அலுவல் கடமைகளையும் உள்ளடக்கக்கூடும்.
    reason: alternative_reading
  - marker: b
    text: “அவன் ஓராண்டு வீட்டிலேயே விலக்கு பெற்றிருப்பான்” என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொற்றொடர் அவன் குடும்பத்திற்காக விடுவிக்கப்பட்டிருப்பதையோ, தன் இல்லத்தில் தங்கியிருப்பதையோ வலியுறுத்தலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי יִקַּח אִישׁ אִשָּׁה חֲדָשָׁה
  choice: ஒருவன் புதிதாக ஒரு பெண்ணைத் திருமணம் செய்திருந்தால்
  rationale: எபிரெய வழக்கில் לָקַח אִשָּׁה என்பது திருமணம் செய்வதைக் குறிக்கிறது. חֲדָשָׁה என்பது அந்தப் பெண் ‘புதியவள்’ என்பதைக் காட்டாமல், திருமணம் புதிதாக நிகழ்ந்ததைச் சுட்டுவதால் இயல்பான நவீன தமிழில் இவ்வாறு தரப்பட்டது. כִּי சட்ட வழக்கை அறிமுகப்படுத்துவதால் ‘-இருந்தால்’ பொருத்தமானது.
- source_word: לֹא יֵצֵא בַּצָּבָא
  choice: அவன் படையுடன் புறப்படக் கூடாது
  rationale: צָבָא படை அல்லது படைச்சேவையைக் குறிக்கலாம். ‘படையுடன் புறப்படுதல்’ என்ற தேர்வு மூலத்தின் உருவகத்தைப் பேணி, நேரடிப் போரை மட்டும் தேவையின்றிக் குறிப்பதில்லை.
- source_word: וְלֹא יַעֲבֹר עָלָיו לְכָל דָּבָר
  choice: எந்தக் கடமையும் அவன்மேல் சுமத்தப்படக் கூடாது
  rationale: இத்தொடர் அவனுக்கு எந்த அலுவல் அல்லது பொது பொறுப்பும் விதிக்கப்படக்கூடாது என்ற சட்டப் பொருளைக் கொண்டுள்ளது; இது படைக்கடமைக்கு மட்டும் வரம்பிடப்படாத அகலத்தைப் பேணுகிறது.
- source_word: נָקִי יִהְיֶה לְבֵיתוֹ שָׁנָה אֶחָת
  choice: அவன் ஓராண்டு தன் குடும்பத்திற்காகக் கடமைகளிலிருந்து விடுபட்டிருப்பான்
  rationale: נָקִי இங்கு குற்றமற்றவன் என்பதற்குப் பதிலாக பொறுப்புகளிலிருந்து விலக்கப்பட்டவன் என்ற பொருளில் வருகிறது. לְבֵיתוֹ என்பது வீட்டுக் கட்டடத்தைவிட குடும்பம் அல்லது இல்லற வாழ்வை நோக்குகிறது.
- source_word: וְשִׂמַּח אֶת אִשְׁתּוֹ אֲשֶׁר לָקָח
  choice: தான் திருமணம் செய்த மனைவியை மகிழ்விப்பான்
  rationale: שִׂמַּח என்பதன் காரணவினைப் பொருளான ‘மகிழச் செய்தல்’ என்பதை ‘மகிழ்விப்பான்’ தெளிவாகக் காட்டுகிறது. לָקָח என்ற திருமண வழக்கு தமிழில் இயல்பாக ‘திருமணம் செய்த’ என வழங்கப்பட்டது.
