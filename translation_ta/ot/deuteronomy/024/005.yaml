  register: நவீன நிலையான தமிழில், சட்டப்பாங்கையும் கண்ணியமான வேதாகம நடையையும் பேணும் வகையில் மொழிபெயர்க்கப்பட்டது. ‘ஒருவன்’, ‘கூடாது’, ‘விடுபட்டிருப்பான்’ ஆகியவை கட்டளையின் சட்டத் தன்மையை இயல்பாக வெளிப்படுத்துகின்றன; அரிதான அல்லது பழமையான சொற்கள் தவிர்க்கப்பட்டன.
