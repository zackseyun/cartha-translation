  text: הַקְהֵ֣ל אֶת הָ/עָ֗ם הָֽ/אֲנָשִׁ֤ים וְ/הַ/נָּשִׁים֙ וְ/הַ/טַּ֔ף וְ/גֵרְ/ךָ֖ אֲשֶׁ֣ר בִּ/שְׁעָרֶ֑י/ךָ לְמַ֨עַן יִשְׁמְע֜וּ וּ/לְמַ֣עַן יִלְמְד֗וּ וְ/יָֽרְאוּ֙ אֶת יְהוָ֣ה אֱלֹֽהֵי/כֶ֔ם וְ/שָֽׁמְר֣וּ לַ/עֲשׂ֔וֹת אֶת כָּל דִּבְרֵ֖י הַ/תּוֹרָ֥ה הַ/זֹּֽאת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/012.yaml
  text: Assemble the people—the men[a], the women, the little children, and the sojourner within your gates—so that they may hear, and so that they may learn and fear Yahweh your God[d][c][b], and be careful to do all the words of this law.
translation:
  language: ta
  text: மக்களை—ஆண்களையும் பெண்களையும் சிறு பிள்ளைகளையும், உன் வாயில்களுக்குள்[b] வாழும் அந்நியரையும்[a]—ஒன்றுகூட்டு. அவர்கள் கேட்டு, கற்று, உங்கள் தேவனாகிய யாவேவுக்குப் பயந்து[c], இந்தத் திருச்சட்டத்தின்[d] எல்லா வார்த்தைகளையும் கடைப்பிடிக்கக் கவனமாயிருப்பதற்காக.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘வாழும் அந்நியர்’ என்பதற்கு ‘அந்நிய நாட்டைச் சேர்ந்த குடியிருப்பாளர்’ என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல், இஸ்ரவேலரிடையே வாழ்ந்த, அந்த நாட்டைச் சேராத ஒருவரைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: ‘உன் வாயில்களுக்குள்’ என்பது சொல்லுக்குச் சொல் மொழியாக்கம்; இங்கு அது உன் நகரங்களில் அல்லது சமூகத்திற்குள் வாழ்வதைக் குறிக்கும் மரபுத்தொடர்.
    reason: cultural_note
  - marker: c
    text: அல்லது, ‘யாவேவைப் பயபக்தியுடன் அஞ்ச.’ எபிரெய வினை பயத்தோடு கூடிய ஆழ்ந்த மரியாதையையும் கீழ்ப்படிதலுள்ள அச்சத்தையும் உள்ளடக்குகிறது.
    reason: lexical_alternative
  - marker: d
    text: அல்லது, ‘இந்தப் போதனையின்.’ எபிரெய תּוֹרָה (தோரா) என்ற சொல் ‘சட்டம்’ என்பதோடு ‘போதனை’ அல்லது ‘அறிவுறுத்தல்’ என்றும் பொருள்படும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַקְהֵל
  choice: ஒன்றுகூட்டு
  rationale: קהל என்பதன் ஹிஃபில் கட்டளை வடிவம் மக்களை ஓர் அவையாகக் கூடச்செய்வதைக் குறிக்கிறது. ‘ஒன்றுகூட்டு’ என்பது கட்டளையின் செயப்படுத்தும் தன்மையையும் இயல்பான நவீன தமிழையும் காக்கிறது.
- source_word: הָעָם
  choice: மக்களை
  rationale: இங்கு עָם உடன்படிக்கைச் சமூகத்தை முழுமையாகக் குறிக்கிறது; ‘மக்கள்’ அதன் நேரான, பொதுவான தமிழ் இணை.
- source_word: הָאֲנָשִׁים וְהַנָּשִׁים וְהַטַּף
  choice: ஆண்களையும் பெண்களையும் சிறு பிள்ளைகளையும்
  rationale: எபிரெய உரை இக்குழுக்களைத் தனித்தனியாகப் பட்டியலிடுகிறது. טַף சிறு பிள்ளைகள் அல்லது சார்ந்திருக்கும் சிறுவர்களைக் குறிக்கக்கூடும்; ‘சிறு பிள்ளைகள்’ அந்த நுணுக்கத்தைப் பாதுகாக்கிறது.
- source_word: וְגֵרְךָ
  choice: குடியிருக்கும் அந்நியனை
  rationale: גֵר என்பது இஸ்ரவேலரிடையே வாழும், அந்த நாட்டைச் சேராத குடியிருப்பாளரைக் குறிக்கிறது. ‘குடியிருக்கும் அந்நியன்’ என்பது வெறும் பயணி என்ற எண்ணத்தைத் தவிர்த்து, அவரது நிலையான சமூக இருப்பைக் காட்டுகிறது.
- source_word: אֲשֶׁר בִּשְׁעָרֶיךָ
  choice: உன் வாயில்களுக்குள்
  rationale: שְׁעָרִים என்பதன் நேரடிப் பொருள் ‘வாயில்கள்’; உபாகமத்தில் இது நகரங்களையும் குடியிருப்புச் சமூகத்தையும் குறிக்கும் மரபுத்தொடராகவும் வருகிறது. முதன்மை உரையில் உருவகத்தைப் பாதுகாத்து, அடிக்குறிப்பில் பொருள் விளக்கப்பட்டுள்ளது.
- source_word: לְמַעַן יִשְׁמְעוּ וּלְמַעַן יִלְמְדוּ
  choice: அவர்கள் கேட்டு, கற்று
  rationale: שׁמע மற்றும் למד ஆகியவை முறையே கேட்டல் மற்றும் கற்றலைக் குறிக்கின்றன. தொடர்ச்சியான நோக்கத்தை இயல்பான தமிழில் வினையெச்சத் தொடராகக் கொடுத்துள்ளது.
- source_word: וְיָרְאוּ אֶת יְהוָה אֱלֹהֵיכֶם
  choice: உங்கள் தேவனாகிய யாவேவுக்குப் பயந்து
  rationale: ירא உடன்படிக்கைச் சூழலில் பயம், பயபக்தி, கீழ்ப்படிதலுள்ள மரியாதை ஆகியவற்றை உள்ளடக்குகிறது. நேரடிப் பொருளான ‘பயந்து’ முதன்மை உரையில் வைக்கப்பட்டு அதன் பரந்த நுணுக்கம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: וְשָׁמְרוּ לַעֲשׂוֹת
  choice: செய்யக் கவனமாயிருப்பதற்காக
  rationale: שמר + வினையெச்ச அமைப்பு கவனமாகக் காத்துக் கடைப்பிடித்து செயல்படுவதைச் சுட்டுகிறது. இத்தமிழாக்கம் கவனத்தையும் நடைமுறை கீழ்ப்படிதலையும் தக்கவைக்கிறது.
- source_word: כָּל דִּבְרֵי הַתּוֹרָה הַזֹּאת
  choice: இந்தத் திருச்சட்டத்தின் எல்லா வார்த்தைகளின்படியும்
  rationale: דִּבְרֵי என்பதன் ‘வார்த்தைகள்’ என்ற குறிப்பான பொருள் காக்கப்பட்டுள்ளது. תּוֹרָה போதனை அல்லது சட்டம் எனப் பொருள்படலாம்; இங்குள்ள உடன்படிக்கை ஆவணச் சூழலில் ‘திருச்சட்டம்’ இயல்பாகப் பொருந்துகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழியாக்கம்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூல உரை இறைவனின் தனிப்பெயரான நான்கு எழுத்துப் பெயரை நேரடியாகப் பயன்படுத்துகிறது. அதை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் பொதுவாக அறியப்படும் ஒலிபெயர்ப்பான ‘யாவே’ என்று தருவது தனிப்பெயரின் தன்மையைப் பாதுகாக்கிறது.
- issue: ירא என்பதில் பயமும் பயபக்தியும்
  choice: பயந்து
  alternative: பயபக்தியுடன் இருந்து
  rationale: மூல வினை உண்மையான பயத்தையும் மரியாதைமிக்க அச்சத்தையும் கீழ்ப்படிதலையும் ஒருங்கே தாங்குகிறது. ‘பயந்து’ அதன் நேரடியான வலிமையைத் தக்கவைக்கிறது; ‘பயபக்தி’ என்ற விளக்கத்தை அடிக்குறிப்பு தருகிறது, இதனால் உள்ள பதற்றம் மறைக்கப்படவில்லை.
- issue: תּוֹרָה என்பதன் பொருள்
  choice: திருச்சட்டம்
  alternative: போதனை
  rationale: תּוֹרָה என்பதற்கு ‘போதனை’ என்ற பரந்த பொருள் உண்டு. ஆயினும், இவ்வசனத்தில் வாசிக்கப்பட வேண்டிய உடன்படிக்கை ஆவணத்தின் எல்லா வார்த்தைகளும் கூறப்படுவதால் ‘திருச்சட்டம்’ சூழலுக்கு ஏற்றது; மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: கூட்டத்தின் பாலின மற்றும் வயது வகைப்பாடு
  choice: ஆண்களையும் பெண்களையும் சிறு பிள்ளைகளையும்
  alternative: அனைவரையும்
  rationale: மூல உரை குழுக்களை வெளிப்படையாகத் தனித்தனியாகக் குறிப்பிடுகிறது. அவற்றை ஒரு பொதுச் சொல்லில் கரைக்காமல் அப்படியே மொழிபெயர்ப்பது வசனத்தின் முழுமையான சமூக உட்சேர்ப்பை வெளிப்படுத்துகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் வடிவமைக்கப்பட்டுள்ளது. மூலத்தில் ‘உன் வாயில்கள்’ என்று ஒருமையும், ‘உங்கள் தேவன்’ என்று பன்மையும் மாறிவருவது தமிழிலும் முறையே ‘உன்’ மற்றும் ‘உங்கள்’ என்று பாதுகாக்கப்பட்டுள்ளது. நீண்ட எபிரெய நோக்கத் தொடரை வாசிப்பிற்கு ஏற்றவாறு இரண்டு வாக்கியங்களாகப் பிரித்து, இறுதியில் ‘அவர்களை ஒன்றுகூட்டு’ என்பதை மீண்டும் கூறி கட்டளைக்கும் நோக்கத்திற்கும் உள்ள இலக்கணத் தொடர்பைத் தெளிவாக்கியுள்ளது.
