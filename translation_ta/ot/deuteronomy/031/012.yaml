revisions:
- from: மக்களை—ஆண்களையும் பெண்களையும் சிறு பிள்ளைகளையும், உன் வாயில்களுக்குள்[b] குடியிருக்கும் அந்நியனையும்[a]—ஒன்றுகூட்டு. அவர்கள் கேட்டு, கற்று, உங்கள் தேவனாகிய யாவேவுக்குப் பயந்து[c], இந்தத் திருச்சட்டத்தின்[d] எல்லா வார்த்தைகளின்படியும் செய்யக் கவனமாயிருப்பதற்காக அவர்களை ஒன்றுகூட்டு.
