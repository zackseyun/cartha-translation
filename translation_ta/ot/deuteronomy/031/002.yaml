source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֲלֵ/הֶ֗ם בֶּן מֵאָה֩ וְ/עֶשְׂרִ֨ים שָׁנָ֤ה אָנֹכִי֙ הַ/יּ֔וֹם לֹא אוּכַ֥ל ע֖וֹד לָ/צֵ֣את וְ/לָ/ב֑וֹא וַֽ/יהוָה֙ אָמַ֣ר אֵלַ֔/י לֹ֥א תַעֲבֹ֖ר אֶת הַ/יַּרְדֵּ֥ן הַ/זֶּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/002.yaml
  text: And he said to them[a], “I am one hundred twenty years old today. I can no longer go out and come in, and Yahweh has said to me, ‘You shall not cross this Jordan.’”
translation:
  language: ta
  text: அவர் அவர்களிடம், “இன்றைக்கு எனக்கு நூற்று இருபது வயது. இனி என்னால் வெளியே போகவும் உள்ளே வரவும் முடியாது.[a] மேலும், யாவே என்னிடம், ‘நீ இந்த யோர்தானைக் கடந்து போகமாட்டாய்’ என்று சொல்லியிருக்கிறார்” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “வெளியே போகவும் உள்ளே வரவும்” என்பது சாதாரணமாகச் செயல்படுவதையோ மக்களை வழிநடத்துவதையோ குறிக்கக்கூடிய எபிரெய மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֲלֵהֶם
  choice: அவர் அவர்களிடம் ... என்றார்
  rationale: எபிரெயக் கதைநடையின் தொடர்ச்சியை இயல்பான தமிழில் தருகிறது; எழுவாயான மோசே முந்தைய சூழலிலிருந்து புரிந்துகொள்ளப்படுவதால் பெயரைச் சேர்க்கவில்லை.
- source_word: בֶּן מֵאָה וְעֶשְׂרִים שָׁנָה אָנֹכִי הַיּוֹם
  choice: இன்றைக்கு எனக்கு நூற்று இருபது வயது
  rationale: ‘... ஆண்டுகளின் மகன்’ என்ற எபிரெய வயதுக் கூறை நவீனத் தமிழில் இயல்பாகத் தருவதோடு הַיּוֹם என்பதன் கால வலியுறுத்தலையும் காக்கிறது.
- source_word: לֹא אוּכַל עוֹד
  choice: இனி என்னால் ... முடியாது
  rationale: יכולת குறிக்கும் יכל மற்றும் ‘இனிமேல் இல்லை’ எனும் עוֹד ஆகிய இரண்டின் பொருளையும் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: לָצֵאת וְלָבוֹא
  choice: வெளியே போகவும் உள்ளே வரவும்
  rationale: சாதாரணச் செயல்பாட்டையோ மக்களை வழிநடத்துவதையோ குறிக்கக்கூடிய எபிரெய மரபுத்தொடரின் திட்டமிட்ட பொருள் விரிவை முதன்மை உரையில் காக்கிறது.
- source_word: וַיהוָה
  choice: யாவே
  rationale: יהוה என்ற உடன்படிக்கைப் பெயரை பொதுப் பட்டப்பெயராக மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: אָמַר אֵלַי
  choice: என்னிடம் ... சொல்லியிருக்கிறார்
  rationale: முன்னர் கூறப்பட்ட இறைவார்த்தையின் தற்போதைய பொருத்தத்தைத் தமிழின் நிறைவுவினை வடிவம் இயல்பாகக் காட்டுகிறது.
- source_word: לֹא תַעֲבֹר
  choice: நீ ... கடந்து போகமாட்டாய்
  rationale: இவ்வடிவம் தடை அல்லது உறுதியான அறிவிப்பு என்ற இரு நுணுக்கங்களையும் சூழலில் திறந்தவையாக வைத்திருக்கிறது; ‘கடக்கக் கூடாது’ என்று மட்டும் குறுக்கவில்லை.
- source_word: אֶת הַיַּרְדֵּן הַזֶּה
  choice: இந்த யோர்தானை
  rationale: הַזֶּה என்ற சுட்டுச் சொல்லைக் காக்கிறது; மூலத்தில் வெளிப்படையாக இல்லாத ‘ஆறு’ என்பதைச் சேர்க்கவில்லை.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூல உரையிலுள்ள தனிப்பட்ட உடன்படிக்கைப் பெயரை பட்டப்பெயராக மாற்றாமல் வெளிப்படையாகக் காக்கிறது.
- issue: לֹא תַעֲבֹר என்பதன் தடை/அறிவிப்பு நுணுக்கம்
  choice: நீ ... கடந்து போகமாட்டாய்
  alternative: நீ ... கடக்கக் கூடாது
  rationale: இறைவன் விதித்த தடை மற்றும் அதனால் உறுதியாக நிகழப்போகும் விளைவு ஆகியவற்றில் ஒன்றை மட்டும் தீர்மானிக்காமல், எபிரெய வடிவத்தின் இறுக்கத்தைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான உரைநடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய மரபுத்தொடரின் பொருள் விரிவு அடிக்குறிப்பில் விளக்கப்பட்டு, முதன்மை உரையில் பாதுகாக்கப்பட்டுள்ளது.
