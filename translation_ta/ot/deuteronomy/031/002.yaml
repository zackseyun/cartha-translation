  source_fidelity: 'மூல எபிரெயத்தின் எல்லா முக்கிய கூறுகளும் துல்லியமாக உள்ளன: மோசேயின் வயது, ‘இன்று’ என்ற காலக் குறிப்பு, இனி இயலாமை, ‘வெளியே போய் உள்ளே வருதல்’ என்ற திட்டமிட்ட இருபொருள் மரபுத்தொடர், யாவே முன்பே கூறியிருப்பது, மற்றும் ‘இந்த யோர்தான்’ என்பதைக் கடக்கமாட்டாய் என்ற அறிவிப்பு/தடையின் திறந்த நுணுக்கம் ஆகியவை பாதுகாக்கப்பட்டுள்ளன.'
