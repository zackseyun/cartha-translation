  text: וַ/יִּכְתֹּ֣ב מֹשֶׁה֮ אֶת הַ/תּוֹרָ֣ה הַ/זֹּאת֒ וַֽ/יִּתְּנָ֗/הּ אֶל הַ/כֹּהֲנִים֙ בְּנֵ֣י לֵוִ֔י הַ/נֹּ֣שְׂאִ֔ים אֶת אֲר֖וֹן בְּרִ֣ית יְהוָ֑ה וְ/אֶל כָּל זִקְנֵ֖י יִשְׂרָאֵֽל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/009.yaml
  text: So Moses wrote this law and gave it to the priests[a], the sons of Levi, who carry the ark of the covenant of Yahweh[c][b], and to all the elders of Israel.
translation:
  language: ta
  text: மோசே இந்தச் சட்டத்தை[a] எழுதி, யாவேயின்[c] உடன்படிக்கைப் பெட்டியைச் சுமந்துசெல்லும் லேவியின் சந்ததியரான[b] ஆசாரியர்களிடமும், இஸ்ரவேலின் எல்லா மூப்பர்களிடமும் கொடுத்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘இந்தச் சட்டத்தை’ என்பதற்கு ‘இந்தப் போதனையை’ அல்லது ‘இந்தத் தோராவை’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில், ‘லேவியின் மகன்கள்’; இது லேவியின் சந்ததியரைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: c
    text: எபிரெயத்தில் YHWH; ‘யாவே’ என்பது இந்தத் திருநாமத்தின் ஒலிபெயர்ப்பு. மரபாக ‘கர்த்தர்’ என்றும் வழங்கப்படுகிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּכְתֹּב
  choice: எழுதி
  rationale: כתב என்பதன் நேரடியான பொருள் ‘எழுது’; தொடர்வினை அமைப்பில் இயல்பான தமிழுக்காக ‘எழுதி ... கொடுத்தார்’ என வழங்கப்படுகிறது.
- source_word: הַתּוֹרָה הַזֹּאת
  choice: இந்தச் சட்டத்தை
  rationale: תּוֹרָה என்பதற்கு ‘போதனை/அறிவுறுத்தல்’ என்ற பரந்த பொருள் இருந்தாலும், இங்கு எழுதப்பட்ட உடன்படிக்கைச் சட்டத் தொகுப்பைக் குறிப்பதால் ‘சட்டம்’ பொருத்தமானது; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: וַיִּתְּנָהּ
  choice: கொடுத்தார்
  rationale: נתן என்பது இங்கு எழுதப்பட்ட תּוֹרָהவை ஆசாரியர்களுக்கும் மூப்பர்களுக்கும் கொடுத்த செயலை எளிமையாகக் குறிக்கிறது.
- source_word: הַכֹּהֲנִים
  choice: ஆசாரியர்கள்
  rationale: כהנים என்பதற்கான தமிழில் நிலைபெற்ற வேதாகமச் சொல் ‘ஆசாரியர்கள்’; இது மதப்பணியாளர்களின் குறிப்பிட்ட பதவியைத் தெளிவாகக் காட்டுகிறது.
- source_word: בְּנֵי לֵוִי
  choice: லேவியின் மக்களான
  rationale: எபிரெயச் சொற்றொடரின் ‘லேவியின் மகன்கள்’ என்ற வடிவத்தை மரபுவழி வம்சத்தைக் குறிக்கும் இயல்பான தமிழில் ‘லேவியின் மக்கள்’ எனத் தக்கவைக்கிறது.
- source_word: הַנֹּשְׂאִים
  choice: சுமக்கிற
  rationale: נשא என்ற வினையெச்சம் பெட்டியைத் தூக்கிச் சுமக்கும் பணியை இங்கு குறிக்கிறது; ‘சுமக்கிற’ என்பது தெளிவான நவீன தமிழ்.
- source_word: אֲרוֹן בְּרִית יְהוָה
  choice: யெகோவாவின் உடன்படிக்கைப் பெட்டி
  rationale: எபிரெயக் கட்டமைப்பை இயல்பான தமிழில் உடைமைத் தொடராக வழங்குகிறது; ‘உடன்படிக்கைப் பெட்டி’ என்பது ark of the covenant என்பதற்குத் தெளிவான மொழிபெயர்ப்பு.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: திருநாமத்தை ஒரு பொதுப் பட்டமாக மாற்றாமல், தமிழில் பரவலாக அறியப்பட்ட தனிப்பெயர் வடிவமான ‘யெகோவா’ என வழங்குகிறது; ‘யாவே’ என்ற மாற்று ஒலிபெயர்ப்பு அடிக்குறிப்பில் குறிப்பிடப்படுகிறது.
- source_word: כָּל זִקְנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் மூப்பர்கள் அனைவரும்
  rationale: זקנים இங்கு சமூகத் தலைமை வகிக்கும் மூப்பர்களைக் குறிக்கிறது; construct தொடரை இயல்பான தமிழில் வழங்குகிறது.
theological_decisions:
- issue: יְהוָה என்ற திருநாமத்தின் மொழிபெயர்ப்பு
  choice: யெகோவா
  alternative: யாவே; கர்த்தர்
  rationale: மூலத்தில் தனிப்பெயரான நான்கு எழுத்துத் திருநாமம் நேரடியாக உள்ளது. பட்டமான ‘கர்த்தர்’ என்பதைவிட திருநாமத்தை வெளிப்படையாக வைத்திருக்க ‘யெகோவா’ பயன்படுத்தப்படுகிறது; ‘யாவே’ என்பது மாற்று ஒலிபெயர்ப்பு.
- issue: இச்சூழலில் תּוֹרָה என்பதன் வரம்பு
  choice: சட்டம்
  alternative: போதனை; தோரா
  rationale: மோசே எழுதி ஒப்படைக்கும் உடன்படிக்கை சார்ந்த சட்ட உரையை இவ்வசனம் குறிக்கிறது. ‘சட்டம்’ சூழலுக்குப் பொருந்துகிறது; எனினும் மூலச்சொல்லின் ‘போதனை’ என்ற பரந்த நிழற்பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், எளிமையும் கண்ணியமும் இணைந்த நடை. எபிரெய வசனத்தின் வரிசையை முற்றிலும் கடினமாகப் பின்பற்றாமல், ‘எழுதி ... கொடுத்தார்’ என்ற இயல்பான தமிழ் தொடர்வினை அமைப்பு பயன்படுத்தப்பட்டது. [a], [b], [c] குறிகள் முறையே அவை விளக்கும் சொற்றொடர்களோடு பிரதான உரையில் இடம்பெற்றுள்ளன.
