base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/024.yaml
  text: And when Moses had finished writing the words of this law in a book[a], until they were complete,
translation:
  language: ta
  text: மோசே இந்தச் சட்டத்தின் வார்த்தைகள் அனைத்தையும் ஒரு நூலில்[a] எழுதி முடித்தபோது,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘ஒரு சுருளில்.’ எபிரெயச் சொல் எழுதப்பட்ட ஆவணத்தையோ சுருளையோ குறிக்கலாம்; நவீன முறையில் கட்டப்பட்ட புத்தகத்தை மட்டும் அது குறிக்க வேண்டியதில்லை.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְהִי
  choice: …போது
  rationale: விவரிப்பின் அடுத்த நிகழ்வுக்கு மாறும் எபிரெயத் தொடரை, தமிழில் இயல்பான காலத் துணைவாக்கியமாக வெளிப்படுத்துகிறது; தனியாக ‘அப்போது நிகழ்ந்தது’ என்று மொழிபெயர்ப்பது இங்கு செயற்கையாக இருக்கும்.
- source_word: כְּכַלּוֹת
  choice: எழுதி முடித்தபோது
  rationale: כְּ உடன் வரும் כלה வினையெச்சம் காலத்தையும் செயல் நிறைவையும் குறிக்கிறது; தமிழில் ‘முடித்தபோது’ இரண்டையும் இயல்பாகத் தருகிறது.
- source_word: מֹשֶׁה
  choice: மோசே
  rationale: தமிழில் பரவலாக நிலைபெற்றுள்ள பெயர் வடிவம்.
- source_word: לִכְתֹּב
  choice: எழுதி
  rationale: ‘முடித்தபோது’ என்பதுடன் இணைந்து, எழுதும் செயல் முழுமை பெற்றதை இயல்பான தமிழில் காட்டுகிறது.
- source_word: דִּבְרֵי
  choice: வார்த்தைகள்
  rationale: எழுதப்பட்ட சட்ட உரையின் உள்ளடக்கத்தை நேரடியாகக் குறிக்கும்; ‘காரியங்கள்’ என்பதைவிட இச்சூழலுக்கு ஏற்றது.
- source_word: הַתּוֹרָה הַזֹּאת
  choice: இந்தச் சட்டத்தின்
  rationale: உபாகமத்தின் உடன்படிக்கைச் சட்டச் சூழலில் תּוֹרָה என்பதற்கு ‘சட்டம்’ தெளிவானது; ‘இந்த’ என்பது சுட்டுப்பெயரின் வலிமையைப் பாதுகாக்கிறது.
- source_word: עַל סֵפֶר
  choice: ஒரு நூலில்[a]
  rationale: סֵפֶר என்பது எழுதப்பட்ட நூல், ஆவணம் அல்லது சுருளைக் குறிக்கலாம். ‘நூலில்’ என்பது வடிவத்தை அளவுக்கு மீறி நிர்ணயிக்காமல், தமிழில் இயல்பாக எழுதப்பட்ட பதிவைக் குறிக்கிறது.
- source_word: עַד תֻּמָּם
  choice: வார்த்தைகள் அனைத்தையும் … எழுதி முடித்த
  rationale: சொற்கள் முழுமையாக எழுதப்பட்டன என்ற நிறைவு எல்லையைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது; ‘அவற்றின் நிறைவு வரை’ என்ற சொற்சொறான ஆனால் கடினமான நடையைத் தவிர்க்கிறது.
