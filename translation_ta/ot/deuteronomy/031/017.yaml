base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/017.yaml
  text: Then my anger will burn against them on that day[a], and I will forsake them and hide my face from them, and they will be devoured, and many evils and troubles will find them. And he will say on that day[b], ‘Is it not because my God is not among me that these evils have found me?’
translation:
  language: ta
  text: அந்நாளில் அவர்களுக்கு எதிராக என் கோபம் பற்றியெரியும். நான் அவர்களைக் கைவிட்டு, என் முகத்தை அவர்களிடமிருந்து மறைப்பேன். அவர்கள் விழுங்கப்படுவார்கள்[a]; பல தீமைகளும் நெருக்கடிகளும் அவர்களை வந்தடையும். அந்நாளில் இஸ்ரவேல், “என் தேவன் என் நடுவில் இல்லாததால்தானே[b] இந்தத் தீமைகள் என்னை வந்தடைந்தன?” என்று சொல்லும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லெழுத்தாக, “அது/அவன் உண்பதற்குரியதாக ஆகும்.” அழிவுக்கு எளிதில் ஆளாகும் நிலையைக் குறிக்கும் சுருக்கமான எபிரெய சொற்றொடர்; “அவர்கள் இரையாவார்கள்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில், “என் தேவன் என் நடுவில் இல்லை.” இங்கு இஸ்ரவேல் ஒரே நபரைப்போல் பேசி, தன்னை “நான்” என்று குறிப்பிடுகிறது.
    reason: collective_singular
lexical_decisions:
- source_word: וְחָרָה אַפִּי
  choice: என் கோபம் பற்றியெரியும்
  rationale: கோபம் வெப்பமடைந்து எரிவதாகிய எபிரெய மொழிமரபின் உருவகத்தை இயல்பான நவீனத் தமிழில் தக்கவைக்கிறது.
- source_word: בּוֹ
  choice: அவர்களுக்கு எதிராக
  rationale: எபிரெய வடிவம் ஒருமையாக இருந்தாலும், உடனுள்ள பன்மைச் சுட்டுகள் இஸ்ரவேல் மக்களை ஒரு கூட்டாகக் குறிக்கின்றன; தமிழில் பன்மை இயல்பானது.
- source_word: וַעֲזַבְתִּים
  choice: நான் அவர்களைக் கைவிட்டு
  rationale: உடன்படிக்கை உறவில் கடவுள் அவர்களைத் துறந்து விடும் தீவிரத்தை ‘கைவிடு’ தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: וְהִסְתַּרְתִּי פָנַי מֵהֶם
  choice: என் முகத்தை அவர்களிடமிருந்து மறைப்பேன்
  rationale: கடவுளின் நியாயத்தீர்ப்பையும் உறவுசார் விலகலையும் சுமக்கும் மூலமொழி உருவகத்தை விளக்கவுரையாக்காமல் அப்படியே பாதுகாக்கிறது.
- source_word: וְהָיָה לֶאֱכֹל
  choice: அவர்கள் விழுங்கப்படுவார்கள்
  rationale: சொல்லெழுத்தாக ‘உண்பதற்குரியதாக ஆகும்’ எனும் சுருக்கமான எபிரெய சொற்றொடரின் அழிவுக்கு ஆளாகும் பொருளை நேரடியாகத் தெரிவிக்கிறது; செய்பவர் குறிப்பிடப்படாதிருப்பதும் தக்கவைக்கப்படுகிறது.
- source_word: וּמְצָאֻהוּ / מְצָאוּנִי
  choice: அவர்களை வந்தடையும் / என்னை வந்தடைந்தன
  rationale: இரு இடங்களிலும் ஒரே வினைச்சொல் இணைப்பைப் பாதுகாத்து, சூழலில் இயல்பான தமிழை வழங்குகிறது.
- source_word: רָעוֹת רַבּוֹת וְצָרוֹת
  choice: பல தீமைகளும் நெருக்கடிகளும்
  rationale: רָעוֹת என்பதிலுள்ள தீமை/தீங்கு சார்ந்த பரப்பையும் צָרוֹת என்பதிலுள்ள நெருக்கடி அல்லது துன்பத்தின் பொருளையும் வேறுபடுத்திக் காட்டுகிறது.
- source_word: וְאָמַר
  choice: இஸ்ரவேல் ... சொல்லும்
  rationale: மூலத்தில் இஸ்ரவேல் ஒரே நபராக உருவகப்படுத்தப்பட்டுள்ள ஒருமையைத் தமிழில் புரியும்படி வெளிப்படுத்துகிறது.
- source_word: הֲלֹא עַל כִּי
  choice: இல்லாததால்தானே
  rationale: காரணத்தைச் சுட்டும் சொல்லாட்சியையும் எதிர்பார்க்கப்பட்ட ஒப்புதலைக் கோரும் வினாவின் வலிமையையும் இயல்பான தமிழில் காக்கிறது.
- source_word: אֵין אֱלֹהַי בְּקִרְבִּי
  choice: என் தேவன் என் நடுவில் இல்லை
  rationale: ‘என் நடுவில்’ என்ற மூலமொழி உருவகத்தையும், இஸ்ரவேலை ஒரே பேச்சாளராகக் காட்டும் முதல்நபர் ஒருமையையும் தக்கவைக்கிறது.
theological_decisions:
- issue: இஸ்ரவேலைக் குறிக்கும் கூட்டுப் பன்மையும் உருவக ஒருமையும்
  choice: கடவுளின் செயல்களுக்கு உட்படும் மக்களைப் பன்மையில் கூறி, அவர்களின் நேரடிப் பேச்சில் இஸ்ரவேலை ஒரே பேச்சாளராகக் காட்டுதல்
  alternative: முழுவதும் பன்மையாகவோ அல்லது முழுவதும் ஒருமையாகவோ மொழிபெயர்த்தல்
  rationale: மூல உரையின் இலக்கண நகர்வை தமிழில் புரியத்தக்க வகையில் பிரதிபலிக்கிறது; அதேவேளையில் நேரடிப் பேச்சிலுள்ள ‘என்/என்னை’ என்ற குறிப்பிடத்தக்க உருவகத்தை அழிக்கவில்லை.
- issue: கடவுள் தமது முகத்தை மறைத்தல்
  choice: ‘என் முகத்தை ... மறைப்பேன்’ என்ற உருவகத்தைத் தக்கவைத்தல்
  alternative: ‘அவர்களிடமிருந்து விலகுவேன்’ அல்லது ‘என் பிரசன்னத்தை நீக்குவேன்’ என்று விளக்குதல்
  rationale: இது வெறும் உடல்சார் இல்லாமையா, அருள் விலக்கமா, நியாயத்தீர்ப்பா என்பதை மொழிபெயர்ப்பு தனியே தீர்மானிக்காமல், உடன்படிக்கைச் சூழலின் இறையியல் பதற்றத்தைப் பாதுகாக்கிறது.
- issue: וְהָיָה לֶאֱכֹל என்பதன் சுருக்கமான படிமம்
  choice: ‘அவர்கள் விழுங்கப்படுவார்கள்’
  alternative: ‘அவர்கள் இரையாவார்கள்’
  rationale: உண்ணப்படுதல் என்ற மூலப் படிமத்தை நேரடியாகக் காக்கிறது; அழிவை நிகழ்த்தும் செய்பவரை உரையில் இல்லாதபடி சேர்ப்பதில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘கோபம் பற்றியெரியும்’, ‘முகத்தை மறைப்பேன்’ ஆகிய முக்கிய எபிரெய உருவகங்கள் பாதுகாக்கப்பட்டுள்ளன. மக்களைக் குறிக்கும் உரைப்பகுதியில் இயல்பான பன்மையும், இஸ்ரவேலின் சுயவாக்கில் மூலத்தின் உருவக ஒருமையும் தக்கவைக்கப்பட்டுள்ளன.
