  text: וַ/יְצַ֤ו מֹשֶׁה֙ אֶת הַ/לְוִיִּ֔ם נֹ֥שְׂאֵ֛י אֲר֥וֹן בְּרִית יְהוָ֖ה לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/025.yaml
  text: Moses commanded the Levites who carried the ark of the covenant of Yahweh[a], saying,
translation:
  language: ta
  text: 'மோசே, யாவேயின் உடன்படிக்கைப் பெட்டியைச் சுமந்த[a] லேவியர்களுக்குக் கட்டளையிட்டார்:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யாவேயின் உடன்படிக்கைப் பெட்டியைச் சுமப்பவர்களாகிய லேவியர்கள்.” எபிரெயப் பங்கேற்புவடிவத்தை அவர்களின் பொறுப்பைக் குறிக்கும் பட்டப்பெயர் போன்ற விளக்கமாகவும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו
  choice: கட்டளையிட்டுச் சொன்னார்
  rationale: צוה என்பது அதிகாரத்துடன் கட்டளையிடுவதைக் குறிக்கிறது; לֵאמֹר உடன் வருவதால் அடுத்த வசனத்தின் நேரடிக் கூற்றை அறிமுகப்படுத்தும் வகையில் ‘கட்டளையிட்டுச் சொன்னார்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: הַלְוִיִּם
  choice: லேவியர்கள்
  rationale: லேவி கோத்திரத்தாரைக் குறிக்கும் வழக்கமான, தெளிவான தமிழ்ப் பெயர்.
- source_word: נֹשְׂאֵי
  choice: சுமந்துவந்த
  rationale: נשׂא வினையின் பங்கேற்புவடிவம் பெட்டியைச் சுமக்கும் பொறுப்புடைய லேவியர்களை விவரிக்கிறது. இயல்பான தமிழில் தொடர்பெயரெச்சமாக வழங்கப்பட்டது; அதன் பட்டப்பெயர் போன்ற சாத்தியம் அடிக்குறிப்பில் காக்கப்பட்டது.
- source_word: אֲרוֹן
  choice: பெட்டி
  rationale: உடன்படிக்கை மற்றும் திருக்கூடாரச் சூழலில் אֲרוֹן குறிக்கும் புனிதப் பெட்டிக்கு தமிழில் நிலைபெற்ற ‘உடன்படிக்கைப் பெட்டி’ என்ற சொல்லாட்சி பயன்படுத்தப்பட்டது.
- source_word: בְּרִית
  choice: உடன்படிக்கை
  rationale: אֲרוֹן உடன் இணைந்த கட்டமைப்பு ‘உடன்படிக்கைப் பெட்டி’ என இயல்பாகவும் துல்லியமாகவும் வழங்கப்படுகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய மூலத்தில் உள்ள தனிப்பெயரான நான்கு எழுத்துத் திருப்பெயரை ஒரு பொதுப் பட்டத்தால் மாற்றாமல், தமிழில் ஒலிபெயர்த்த வடிவில் வழங்குகிறது.
- source_word: לֵאמֹר
  choice: சொன்னார்
  rationale: அடுத்த வசனத்தில் வரும் நேரடிப் பேச்சை அறிமுகப்படுத்தும் எபிரெயச் சொல்லாக்கம்; தமிழில் முன்னுள்ள ‘கட்டளையிட்டார்’ என்பதுடன் இயல்பாக இணைக்கப்பட்டது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூல உரை தனிப்பெயரான יהוה என்பதையே பயன்படுத்துகிறது. அதன் தனிப்பெயர்த் தன்மையைப் பாதுகாக்க ‘யாவே’ என்று ஒலிபெயர்க்கப்பட்டது; பொதுப் பட்டமான ‘கர்த்தர்’ என்று மாற்றப்படவில்லை.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. அடுத்த வசனத்தின் நேரடிப் பேச்சைத் திறக்கும் நிறுத்தக்குறியாக முக்காற்புள்ளி இடப்பட்டுள்ளது; எபிரெயப் பங்கேற்புவடிவத்தின் செயல்விளக்கத்துக்கும் பொறுப்புப் பட்டத்துக்கும் இடையிலான நுண்ணிய தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
