  text: וְ/אָנֹכִ֗י הַסְתֵּ֨ר אַסְתִּ֤יר פָּנַ/י֙ בַּ/יּ֣וֹם הַ/ה֔וּא עַ֥ל כָּל הָ/רָעָ֖ה אֲשֶׁ֣ר עָשָׂ֑ה כִּ֣י פָנָ֔ה אֶל אֱלֹהִ֖ים אֲחֵרִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/018.yaml
  text: And I myself will surely hide my face on that day because of all the evil that he has done[a], because he has turned to other gods.
translation:
  language: ta
  text: நானே, அவன் செய்த எல்லாத் தீமையின் காரணமாக, அந்நாளில் என் முகத்தை[a] நிச்சயமாக மறைப்பேன்; ஏனெனில் அவன் வேறு தெய்வங்களிடம் திரும்பியிருக்கிறான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொல்லர்த்தமாக, ‘என் முகத்தை.’ இது இறைவனின் அருள் அல்லது உடனிருப்பு விலக்கப்படுவதைக் குறிக்கக்கூடிய மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָנֹכִי
  choice: நானோ
  rationale: வலியுறுத்தப்பட்ட முதலாம் நபர் ஒருமைப் பெயர்ச்சொல்லை இயல்பான தமிழில் முன்னிலைப்படுத்துகிறது; இணைப்பும் சூழலிலுள்ள வேறுபடுத்திக் காட்டும் நுணுக்கமும் ‘-ஓ’ மூலம் வெளிப்படுகின்றன.
- source_word: הַסְתֵּר אַסְתִּיר
  choice: நிச்சயமாக மறைத்துக்கொள்வேன்
  rationale: முற்றுவினையுடன் வரும் வினையெச்ச முழுவடிவம் செயலை வலியுறுத்துகிறது. ‘நிச்சயமாக’ அந்த உறுதியை இயல்பான தமிழில் காக்கிறது.
- source_word: פָּנַי
  choice: என் முகத்தை
  rationale: எபிரெயத்தின் நேரடியான உருவகச் சொல்லாட்சியைத் தக்கவைத்து, அதை ‘என் உடனிருப்பை’ அல்லது ‘என் அருளை’ என்று விளக்கமாக மாற்றவில்லை.
- source_word: בַּיּוֹם הַהוּא
  choice: அந்நாளில்
  rationale: காலத்தையும் சுட்டுப்பொருளையும் சுருக்கமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: עַל כָּל הָרָעָה
  choice: எல்லாத் தீமையின் காரணமாக
  rationale: עַל இங்கு காரணத்தைக் குறிக்கிறது; רָעָה இச்சூழலில் பேரிடரை அல்ல, ஒழுக்க மற்றும் உடன்படிக்கை மீறலான தீமையைக் குறிக்கிறது.
- source_word: אֲשֶׁר עָשָׂה
  choice: அவன் செய்த
  rationale: எபிரெய வினை மூன்றாம் நபர் ஆண்பால் ஒருமையில் உள்ளது. இஸ்ரவேல் மக்களை ஒரு கூட்டு நபராகக் குறிப்பிடும் மூலவடிவத்தை ஒருமையிலேயே காக்கிறது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: அடுத்த கூற்று முன்னைய தீமைக்கும் இறைவனின் பதிலுக்கும் காரணம் என்பதைத் தெளிவாகக் காட்டுகிறது.
- source_word: פָנָה אֶל
  choice: திரும்பியிருக்கிறான்
  rationale: வேறு தெய்வங்களை நோக்கி விசுவாசத்திலும் பற்றுறுதியிலும் திரும்பிய செயலை வெளிப்படுத்துகிறது; தேவையற்ற விளக்கத்தைச் சேர்க்கவில்லை.
- source_word: אֱלֹהִים אֲחֵרִים
  choice: வேறு தெய்வங்கள்
  rationale: ஆண்டவரைத் தவிர்ந்த பிற தெய்வங்களைக் குறிக்கும் எபிரெயத் தொடரின் நேரடியான, இயல்பான தமிழாக்கம்.
theological_decisions:
- issue: இறைவன் தமது முகத்தை மறைப்பதாகக் கூறும் மனித உருவகச் சொல்லாட்சி
  choice: முதன்மை உரையில் ‘என் முகத்தை மறைத்துக்கொள்வேன்’ என்பதைத் தக்கவைத்தல்
  alternative: ‘என் உடனிருப்பை விலக்கிக்கொள்வேன்’ அல்லது ‘என் அருளை மறுப்பேன்’
  rationale: மூல எபிரெயம் ‘என் முகம்’ என்ற திட்டவட்டமான உருவகத்தைப் பயன்படுத்துகிறது. அதன் பொருளை ஒரு குறிப்பிட்ட இறையியல் விளக்கமாகச் சுருக்காமல், மூலத்தின் பதற்றத்தையும் படிமத்தையும் காக்கிறது.
- issue: இஸ்ரவேலை ஒருமை நபராகக் குறிப்பிடுதல்
  choice: ‘அவன் செய்த ... அவன் ... திரும்பியிருக்கிறான்’ என்ற ஒருமை வடிவம்
  alternative: ‘அவர்கள் செய்த ... அவர்கள் திரும்பியிருக்கிறார்கள்’ என்ற பன்மை வடிவம்
  rationale: மூலத்தில் வினைகள் ஒருமையில் உள்ளன; இஸ்ரவேல் ஒரு கூட்டு நபராகச் சித்தரிக்கப்படுவதைத் தமிழிலும் தக்கவைக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டது. ‘நானோ’ வலியுறுத்தலைத் தருகிறது; ‘நிச்சயமாக’ எபிரெய வினை வலியுறுத்தலை இயல்பாக வெளிப்படுத்துகிறது. மூலத்தில் இஸ்ரவேல் ஒருமை நபராகக் குறிப்பிடப்படுவதால் ‘அவன்’ தக்கவைக்கப்பட்டது.
