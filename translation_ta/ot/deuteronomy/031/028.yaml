  text: הַקְהִ֧ילוּ אֵלַ֛/י אֶת כָּל זִקְנֵ֥י שִׁבְטֵי/כֶ֖ם וְ/שֹׁטְרֵי/כֶ֑ם וַ/אֲדַבְּרָ֣ה בְ/אָזְנֵי/הֶ֗ם אֵ֚ת הַ/דְּבָרִ֣ים הָ/אֵ֔לֶּה וְ/אָעִ֣ידָה בָּ֔/ם אֶת הַ/שָּׁמַ֖יִם וְ/אֶת הָ/אָֽרֶץ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/028.yaml
  text: Gather to me all the elders of your tribes and your officers[a], that I may speak these words in their hearing and call heaven and earth to witness against them.
translation:
  language: ta
  text: 'உங்கள் கோத்திரங்களின் மூப்பர்கள் அனைவரையும் உங்கள் அதிகாரிகளையும் என்னிடம் ஒன்றுகூட்டுங்கள்; நான் இந்த வார்த்தைகளை அவர்கள் கேட்கும்படி பேசி, அவர்களுக்கு எதிராக வானத்தையும் பூமியையும்[a] சாட்சிகளாக அழைப்பேன்.


    [a] அல்லது, ‘வானங்களையும் பூமியையும்.’ இது உபாகமத்தில் உடன்படிக்கைக்குச் சாட்சிகளை அழைக்கும் சூழலில் வழக்கமாக வரும் எபிரெயச் சொற்றொடர்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘வானங்களையும் பூமியையும்.’ இது உபாகமத்தில் உடன்படிக்கைக்குச் சாட்சிகளை அழைக்கும் சூழலில் வழக்கமாக வரும் எபிரெயச் சொற்றொடர்.
    reason: எபிரெய הַשָּׁמַיִם வடிவத்தில் பன்மையாக இருப்பதையும், அதன் உடன்படிக்கைச் சாட்சி பயன்பாட்டையும் தெரிவிக்கிறது.
lexical_decisions:
- source_word: הַקְהִילוּ
  choice: ஒன்றுகூட்டுங்கள்
  rationale: קהל என்பதன் ஹிஃபில் பன்மை ஏவல் வடிவம்; தலைவர்களை ஒரே இடத்தில் கூடிவரச் செய்யும் காரணவினைப் பொருளை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: אֵלַי
  choice: என்னிடம்
  rationale: முதலாம் நபர் பின்னொட்டுடன் வரும் முன்னிடைச்சொல்லின் நேரடியான பொருளைத் தக்கவைக்கிறது.
- source_word: זִקְנֵי שִׁבְטֵיכֶם
  choice: உங்கள் கோத்திரங்களின் மூப்பர்கள்
  rationale: கோத்திரங்களுக்குரிய மூப்பர்கள் என்ற எபிரெய இணைப்புத் தொடரைத் தெளிவாகவும் மரியாதையான வேதாகம நடையிலும் தருகிறது.
- source_word: שֹׁטְרֵיכֶם
  choice: உங்கள் அதிகாரிகள்
  rationale: உபாகமத்தின் நிர்வாகச் சூழலில் இச்சொல் கீழ்நிலைத் தலைவர்கள் அல்லது அலுவல் பொறுப்பாளர்களைக் குறிக்கிறது; ‘எழுத்தர்கள்’ என்பது இங்கு மிகக் குறுகிய பொருள்.
- source_word: וַאֲדַבְּרָה
  choice: நான் ... பேசி
  rationale: கூட்டுவதற்குப் பின் மோசே செய்ய எண்ணும் செயலைத் தமிழ் வாக்கியத் தொடரில் இயல்பாக வெளிப்படுத்துகிறது; தொடரும் மற்றொரு cohortative வினையுடன் இணைக்கப்பட்டுள்ளது.
- source_word: בְּאָזְנֵיהֶם
  choice: அவர்கள் கேட்கும்படி
  rationale: சொல்லுக்குச் சொல் ‘அவர்களுடைய காதுகளில்’ என்ற எபிரெய மரபுத்தொடரின் பொருள், அவர்கள் நேரடியாகக் கேட்கும் வகையில் பேசுதல் என்பதாகும்.
- source_word: אֵת הַדְּבָרִים הָאֵלֶּה
  choice: இந்த வார்த்தைகளை
  rationale: உடனடிச் சூழலில் דְּבָרִים பேசப்படும் சொற்களைக் குறிப்பதால் ‘வார்த்தைகள்’ பொருத்தமானது.
- source_word: וְאָעִידָה בָּם
  choice: அவர்களுக்கு எதிராக ... சாட்சியாக அழைப்பேன்
  rationale: עוּד என்பதன் ஹிஃபில் வடிவம் உடன்படிக்கை மற்றும் நீதிமன்றச் சூழலில் சாட்சிகளை அழைக்கும் பொருளைக் கொண்டுள்ளது; בָּם இங்கு ‘அவர்களுக்கு எதிராக’ என்ற பொறுப்புக்கூறும் வலிமையைத் தருகிறது.
- source_word: אֶת הַשָּׁמַיִם וְאֶת הָאָרֶץ
  choice: வானத்தையும் பூமியையும்
  rationale: உபாகமத்தில் வரும் வழக்கமான உடன்படிக்கைச் சாட்சி வாய்பாட்டை இயல்பான தமிழில் தருகிறது; எபிரெயச் சொல்லின் வடிவப் பன்மை அடிக்குறிப்பில் சுட்டப்பட்டுள்ளது.
theological_decisions:
- issue: உடன்படிக்கைச் சாட்சி வாய்பாடு
  choice: அவர்களுக்கு எதிராக வானத்தையும் பூமியையும் சாட்சியாக அழைப்பேன்
  alternative: வானத்தையும் பூமியையும் கொண்டு அவர்களுக்கு எதிராகச் சாட்சியளிப்பேன்
  rationale: வானமும் பூமியும் இஸ்ரவேலின் உடன்படிக்கைப் பொறுப்புக்குச் சாட்சிகளாக அழைக்கப்படும் உபாகமத்தின் நீதிவழக்கு உருவகத்தை இது காக்கிறது; யார் சாட்சி என்ற தெளிவையும் அளிக்கிறது.
translation_notes:
  register: நவீனத் தரநிலைத் தமிழில் இயல்பான, கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘கோத்திரங்கள்’, ‘மூப்பர்கள்’, ‘சாட்சி’ ஆகியவை வாசகர்களுக்குப் பரிச்சயமான வேதாகமச் சொற்களாக இருந்தாலும் வாக்கிய அமைப்பு தற்காலத் தமிழுக்கு ஏற்ப எளிமையாக வைக்கப்பட்டுள்ளது. அரைப்புள்ளி, கூட்டுவதற்கான கட்டளையையும் அதைத் தொடர்ந்து மோசே செய்ய எண்ணும் இரண்டு செயல்களையும் தெளிவாக இணைக்கிறது.
