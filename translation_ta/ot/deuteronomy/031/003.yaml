revisions:
- from: உன் கடவுளாகிய யாவே தாமே உனக்கு முன்பாகக் கடந்துசெல்கிறார்[a]. அவரே இந்த நாடுகளை உன் முன்னிலையிலிருந்து அழித்தொழிப்பார்; நீ அவர்களை வெளியேற்றி, அவர்களுடைய இடத்தை உடைமையாக்கிக்கொள்வாய்[b]. யாவே கூறியபடியே, யோசுவா தாமே உனக்கு முன்பாகக் கடந்துசெல்கிறார்.
  to: உன் கடவுளாகிய யாவே தாமே உனக்கு முன்பாகக் கடந்துசெல்கிறார்[a]. அவரே இந்த நாடுகளை உனக்கு முன்பாக இருந்து அழிப்பார்; நீ அவர்களை உன் உரிமையாக்கிக்கொள்வாய்[b]. யாவே கூறியபடியே, யோசுவா தாமே உனக்கு முன்பாகக் கடந்துசெல்கிறார்.
  rationale: The revision removes interpretive material from the main clause for וִירִשְׁתָּם while retaining that legitimate conquest-context nuance in the footnote. It also renders מִלְּפָנֶיךָ with a more direct spatial expression. No doctrinal interpretation has been added.
