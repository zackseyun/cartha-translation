base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/003.yaml
  text: Yahweh your God himself is crossing over before you[a]. He himself will destroy these nations from before you, and you will dispossess them. Joshua himself is crossing over before you[b], just as Yahweh has spoken.
translation:
  language: ta
  text: உன் கடவுளாகிய யாவே தாமே உனக்கு முன்பாகக் கடந்துசெல்கிறார்[a]. அவரே இந்த நாடுகளை உனக்கு முன்பாக இருந்து அழிப்பார்; நீ அவர்களை உன் உரிமையாக்கிக்கொள்வாய்[b]. யாவே கூறியபடியே, யோசுவா தாமே உனக்கு முன்பாகக் கடந்துசெல்கிறார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உனக்கு முன்பாகச் செல்கிறார்” / “உனக்கு முன்பாகக் கடந்துசெல்வார்.” எபிரெயப் பங்கேற்புவினை தற்போது நடைபெறும், உடனடியாக நடைபெறவிருக்கும், அல்லது உறுதியாக நடைபெறும் எதிர்காலச் செயலைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயில், “நீ அவர்களை உன் உரிமையாக்கிக்கொள்வாய்” என்று நேரடியாக உள்ளது. இங்கு பயன்படுத்தப்பட்டுள்ள வினைச்சொல், முன்பு குடியிருந்தவர்களை வெளியேற்றி அவர்களையோ அவர்களுடைய நாட்டையோ கைப்பற்றுவதைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைத் திருப்பெயரை ஒரு பட்டத்தால் மாற்றாமல், எபிரெய நான்கெழுத்துப் பெயரின் வழக்கமான தமிழ் ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: אֱלֹהֶיךָ
  choice: உன் கடவுள்
  rationale: இரண்டாம் நபர் ஆண்பால் ஒருமை பின்னொட்டையும் உடன்படிக்கைச் சூழலின் நேரடி அழைப்பையும் காக்கிறது.
- source_word: הוּא
  choice: தாமே / அவரே
  rationale: யாவே மற்றும் யோசுவா ஆகிய இரு எழுவாய்களுடனும் வரும் வலியுறுத்தும் தனிப்பெயர்ச்சொல்லைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: עֹבֵר לְפָנֶיךָ
  choice: உனக்கு முன்பாகக் கடந்துசெல்கிறார்
  rationale: பங்கேற்புவினையின் நிகழ்கால, உடனடியாக நடைபெறவிருக்கும், அல்லது உறுதியான எதிர்கால நுணுக்கத்தைத் திறந்தவாறே வைத்து, ஆற்றைக் கடத்தல் மற்றும் முன்னே செல்லுதல் ஆகிய இரு படிமங்களையும் காக்கிறது.
- source_word: יַשְׁמִיד
  choice: அழித்தொழிப்பார்
  rationale: שׁמד என்பதன் ஹிஃபில் வடிவிலுள்ள வலுவான அழிவு அர்த்தத்தை இயல்பான, கண்ணியமான தமிழில் தருகிறது.
- source_word: הַגּוֹיִם הָאֵלֶּה
  choice: இந்த நாடுகள்
  rationale: கானானின் இன-அரசியல் மக்கள் குழுக்களைக் குறிக்கும் גּוֹיִם என்பதன் ‘நாடுகள்’ என்ற வழக்கமான அர்த்தத்தைப் பாதுகாக்கிறது.
- source_word: מִלְּפָנֶיךָ
  choice: உன் முன்னிலையிலிருந்து
  rationale: இஸ்ரவேலின் முன்னிருந்து அகற்றப்படுதல் என்ற இடஞ்சார்ந்த கருத்தைத் தெளிவாகக் காக்கிறது.
- source_word: וִירִשְׁתָּם
  choice: நீ அவர்களை வெளியேற்றி, அவர்களுடைய இடத்தை உடைமையாக்கிக்கொள்வாய்
  rationale: ירשׁ என்பதன் வெற்றிகொள்ளும் சூழலுக்குரிய இரட்டை நுணுக்கங்களான முந்தைய குடியிருப்போரை வெளியேற்றுதலையும் அவர்கள் இருந்த இடத்தை உடைமையாக்குதலையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: יְהוֹשֻׁעַ
  choice: யோசுவா
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் நிலைபெற்ற தனிப்பெயர் வடிவம்.
- source_word: כַּאֲשֶׁר דִּבֶּר יְהוָה
  choice: யாவே கூறியபடியே
  rationale: דִּבֶּר என்பதன் ‘கூறினார்’ என்ற அடிப்படைப் பொருளைக் காக்கிறது; ‘வாக்களித்தார்’ என்று விளக்கமாக விரிவுபடுத்தவில்லை.
theological_decisions:
- issue: יְהוָה என்ற இறைத் திருப்பெயரை வழங்குதல்
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூல உரை இறைவனின் தனிப்பெயரை நேரடியாகப் பயன்படுத்துவதால், அதை ஒரு பட்டப்பெயரால் மாற்றாமல் ஒலிபெயர்க்கிறது.
- issue: யாவே மற்றும் யோசுவாவின் செயற்பாட்டுக்கு இடையிலான வலியுறுத்தல்
  choice: இருவருடனும் வரும் הוּא என்பதன் வலியுறுத்தலை ‘தாமே/அவரே’ என்று காத்தல்
  alternative: வலியுறுத்தலின்றி சாதாரண எழுவாயாக மொழிபெயர்த்தல்
  rationale: யாவே தாமே முன்னே செல்கிறார் என்பதையும், அவருடைய கட்டளையின்கீழ் யோசுவாவும் முன்னே செல்கிறார் என்பதையும் உரை இணைத்துக் காட்டுகிறது; ஒரு செயற்பாட்டை மற்றொன்றால் மறைக்கவில்லை.
translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. இஸ்ரவேலை ஒருமையில் நேரடியாக அழைக்கும் எபிரெய வடிவத்தை ‘உன்/நீ’ எனக் காத்துள்ளது. இறைவனுக்கும் யோசுவாவுக்கும் மரியாதைப் பன்மை வினைமுற்றுகள் பயன்படுத்தப்பட்டாலும், மூலத்தின் எழுவாய் வலியுறுத்தல் தனித்தனியாகத் தெளிவாக வைக்கப்பட்டுள்ளது.
