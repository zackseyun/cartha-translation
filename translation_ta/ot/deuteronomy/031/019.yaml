  register: நவீன நிலையான தமிழில், பொதுவாசகருக்குப் புரியும் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. மூலத்தின் ‘வாயில் வை’ என்ற உருவகம் பாதுகாக்கப்பட்டுள்ளது. எபிரெய ஏவல் எண்ணிக்கையில் உள்ள குறிப்பிடத்தக்க மாற்றம் தமிழில் வெளிப்படையாக வைக்கப்பட்டுள்ளது; இதனால் வாக்கியத்தில் தோன்றும் திடீர் ஒருமை திட்டமிட்ட மூலநெருக்கமாகும்.
