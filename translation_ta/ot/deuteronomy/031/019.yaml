base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/019.yaml
  text: And now[a], write this song for yourselves, and teach it to the sons of Israel; put it in their mouths[b], so that this song may be a witness for me against the sons of Israel.
translation:
  language: ta
  text: இப்போது, இந்தப் பாடலை உங்களுக்காக எழுதுங்கள்; இதை இஸ்ரவேல் மக்களுக்குக் கற்றுக்கொடு[a]; இதை அவர்கள் வாயில் வை. இதனால் இந்தப் பாடல் இஸ்ரவேல் மக்களுக்கு[b] எதிராக[c] எனக்குச் சாட்சியாக இருக்கும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் “எழுதுங்கள்” என்பது பன்மை ஏவல்; ஆனால் “கற்றுக்கொடு” என்பதும் அடுத்து வரும் “வை” என்பதும் ஒருமை ஆண்பால் ஏவல்கள்.
    reason: grammatical_shift
  - marker: b
    text: சொல்லெழுத்தாக, “இஸ்ரவேலின் மகன்கள்”; இங்கு அது இஸ்ரவேல் மக்களை மொத்தமாகக் குறிக்கிறது. இவ்வசனத்தில் இருமுறை வருகிறது.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, “இஸ்ரவேல் மக்களிடையே.” எபிரெய முன்னிடைச்சொல் “இல்/இடையே” என்றும் பொருள்படலாம்; ஆனால் இச்சூழலில் பாடல் அவர்களுக்கு எதிரான சாட்சியாக இருப்பதே அதிகம் பொருந்துகிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: וְעַתָּה
  choice: இப்போது
  rationale: வாக்கியத் தொடர்ச்சியையும் உடனடியான காலச் சுட்டையும் இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது; தனியாக ‘இப்போது’ என்பதே எபிரெய இணைப்பையும் சூழலில் போதுமான அளவு தாங்குகிறது.
- source_word: כִּתְבוּ לָכֶם
  choice: உங்களுக்காக எழுதுங்கள்
  rationale: பன்மை ஏவலைப் பாதுகாப்பதோடு, לָכֶם என்பதன் நலப்பொருள்/தற்சுட்டு நுணுக்கத்தையும் விடாமல் தருகிறது.
- source_word: הַשִּׁירָה הַזֹּאת
  choice: இந்தப் பாடல்
  rationale: שִׁירָה என்பதன் நேரடியான, சூழலுக்கேற்ற பொருள் ‘பாடல்’; அடுத்த அதிகாரத்தின் கவிதை வடிவத்துடனும் இது பொருந்துகிறது.
- source_word: וְלַמְּדָהּ
  choice: இதைக் கற்றுக்கொடு
  rationale: பெண்பால் ஒருமை பின்னொட்டு ‘பாடல்’ என்பதைக் குறிக்கிறது. எபிரெயத்தில் இங்கு வரும் ஒருமை ஆண்பால் ஏவலை தமிழிலும் மறைக்காமல் காட்டுகிறது.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்கள்
  rationale: சொல்லெழுத்தாக ‘இஸ்ரவேலின் மகன்கள்’ என்றாலும், இந்த எபிரெய இனக்குழுப் பெயர் இங்கு முழு இஸ்ரவேல் சமூகத்தைக் குறிக்கிறது. ‘இஸ்ரவேல் மக்கள்’ என்பது உள்ளடக்கத்தைத் துல்லியமாகவும் இயல்பாகவும் தருகிறது; சொல்லெழுத்து வடிவம் அடிக்குறிப்பில் உள்ளது.
- source_word: שִׂימָהּ בְּפִיהֶם
  choice: இதை அவர்கள் வாயில் வை
  rationale: மனப்பாடம் செய்து உரைக்கச் செய்வதைக் குறிக்கும் மூலமொழியின் தெளிவான உருவகத்தை விளக்கமாக மாற்றாமல் பாதுகாக்கிறது.
- source_word: לְמַעַן
  choice: இருக்கும்படி
  rationale: நோக்கத்தைக் குறிக்கும் לְמַעַן என்பதைக் தமிழின் இயல்பான நோக்க வினையெச்ச அமைப்பால் தருகிறது.
- source_word: תִּהְיֶה לִּי לְעֵד
  choice: எனக்குச் சாட்சியாக இருக்கும்படி
  rationale: לִּי என்பதையும் עֵד என்பதன் நீதிமன்ற/உடன்படிக்கைச் சார்ந்த ‘சாட்சி’ பொருளையும் காக்கிறது.
- source_word: בִּבְנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்களுக்கு எதிராக
  rationale: சுற்றியுள்ள உடன்படிக்கை மீறல் மற்றும் குற்றச்சாட்டு சூழலில் בְּ adversative பொருளில் ‘எதிராக’ எனப் புரிவது பொருத்தமானது; ‘அவர்களிடையே’ என்ற இடப்பொருள் வாய்ப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל என்ற கூட்டுப்பெயரின் மொழிபெயர்ப்பு
  choice: இஸ்ரவேல் மக்கள்
  alternative: இஸ்ரவேலின் மகன்கள் / இஸ்ரவேலர்
  rationale: எபிரெய வடிவம் இலக்கண ரீதியாக ‘மகன்கள்’ என்றாலும், இங்கு அது உடன்படிக்கைச் சமூகமான இஸ்ரவேலரை மொத்தமாகக் குறிக்கிறது. பெண்களைத் தவறாக விலக்கிக் கேட்கச் செய்யாமல் நவீனத் தமிழில் இயல்பாகப் பொருளைத் தர ‘மக்கள்’ தேர்ந்தெடுக்கப்பட்டது; மூல வடிவம் அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
- issue: בִּבְנֵי יִשְׂרָאֵל என்பதில் בְּ முன்னிடைச்சொல்லின் வலிமை
  choice: இஸ்ரவேல் மக்களுக்கு எதிராக
  alternative: இஸ்ரவேல் மக்களிடையே
  rationale: பாடல் பிற்கால விசுவாசத் துரோகத்துக்கு எதிரான சாட்சியாகச் செயல்படும் உடனடிச் சூழல் எதிர்மறை/நீதிமன்றப் பொருளை ஆதரிக்கிறது. ஆயினும் இடப்பொருளான மாற்று வாசிப்பு உண்மையான மொழியியல் வாய்ப்பாக அடிக்குறிப்பில் வைக்கப்படுகிறது.
- issue: பன்மை ஏவலிலிருந்து ஒருமை ஏவலுக்கு மாறுதல்
  choice: எழுதுங்கள் … கற்றுக்கொடு … வை
  alternative: எழுதுங்கள் … கற்றுக்கொடுங்கள் … வையுங்கள்
  rationale: எபிரெயத்தில் כִּתְבוּ என்பது பன்மை; וְלַמְּדָהּ மற்றும் שִׂימָהּ ஆகியவை ஒருமை ஆண்பால் ஏவல்கள். இந்தத் திடீர் மாற்றத்தைச் சீராக்காமல் தமிழிலும் பாதுகாத்து, வாசகருக்காக அடிக்குறிப்பில் விளக்கப்படுகிறது.
