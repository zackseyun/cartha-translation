    rationale: The source ends with the purpose that the song may serve as a witness; it does not add a further command. This addition changes the clause structure and should be removed.
  - severity: low
    issue: The purpose clause is less clear in the current word order.
    rationale: Placing “இப்படிச் செய்” after “இருக்கும்படி” makes the Tamil construction sound as though a new singular command has been supplied. A direct result/purpose formulation better reflects לְמַעַן.
