base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/013.yaml
  text: And their children[a], who have not known[c][b], shall hear and learn to fear Yahweh your God all the days that you live on the land that you are crossing the Jordan to possess.
translation:
  language: ta
  text: இதுவரை அறிந்திராத அவர்களுடைய பிள்ளைகள்[a] கேட்டு, உங்கள் கடவுளாகிய யாவேக்கு[b] அஞ்சக் கற்றுக்கொள்வார்கள்; நீங்கள் யோர்தான் ஆற்றைக் கடந்து உரிமையாக்கிக்கொள்ளப் போகிற[c] நாட்டில் நீங்கள் வாழும் நாட்களெல்லாம்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அவர்களுடைய மகன்கள்.’ எபிரெயச் சொல் குறிப்பாக மகன்களையோ, பொதுவாகப் பிள்ளைகள் அல்லது சந்ததியினரையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில் ‘YHWH’; மரபாக ‘கர்த்தர்’ என்று வழங்கப்படுகிறது.
    reason: alternative_reading
  - marker: c
    text: அல்லது, ‘அதைக் கைப்பற்றிக்கொள்ளப் போகிற’ அல்லது ‘அதைச் சுதந்தரித்துக்கொள்ளப் போகிற.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵיהֶם
  choice: அவர்களுடைய பிள்ளைகளும்
  rationale: בנים என்பது குறிப்பாக ‘மகன்கள்’ என்றும், சூழலுக்கேற்ப பொதுவாக ‘பிள்ளைகள்/சந்ததியினர்’ என்றும் பொருள்படும். இங்கு அடுத்த தலைமுறை முழுவதையும் குறிக்கும் உடன்படிக்கைப் போதனைச் சூழலுக்குப் ‘பிள்ளைகள்’ பொருத்தமானது.
- source_word: אֲשֶׁר לֹא יָדְעוּ
  choice: அறிந்திராத
  rationale: ידע வினையின் நிறைவுற்ற வடிவம் முந்தைய அறிவோ அனுபவமோ இல்லாத நிலையைக் குறிக்கிறது. எதை அறியவில்லை என்பதை எபிரெய உரை வெளிப்படையாகச் சொல்லாததால் தமிழிலும் அதை நிரப்பாமல் விடுகிறது.
- source_word: יִשְׁמְעוּ וְלָמְדוּ
  choice: அதைக் கேட்டு ... கற்றுக்கொள்வார்கள்
  rationale: கேட்பதிலிருந்து கற்றுக்கொள்வது விளைவதை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது. ‘அதை’ என்பது முந்தைய வசனத்தில் வாசிக்கப்படும் போதனையைச் சுட்டுகிறது; புதிய விளக்கப் பொருளைச் சேர்ப்பதில்லை.
- source_word: לְיִרְאָה
  choice: அஞ்ச
  rationale: ירא இங்கு கடவுளிடம் கொள்ளும் உடன்படிக்கை சார்ந்த பயபக்தியைக் குறிக்கிறது. ‘அஞ்ச’ என்பது அதன் வலிமையைத் தக்கவைக்கிறது; ‘மதிக்க’ என்று மென்மையாக்கவில்லை.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய மெய்யெழுத்துப் பெயரான יהוה-ஐ ஒரு பட்டப்பெயரால் மாற்றாமல், தமிழில் பரவலாகப் புரியக்கூடிய ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: כָּל הַיָּמִים אֲשֶׁר אַתֶּם חַיִּים
  choice: நீங்கள் ... வாழும் நாளெல்லாம்
  rationale: இரண்டாம் நபர் பன்மையையும், வாழ்நாள் முழுவதையும் குறிக்கும் கால அளவையும் இயல்பான தமிழில் காக்கிறது.
- source_word: עַל הָאֲדָמָה
  choice: நாட்டில்
  rationale: אדמה இச்சூழலில் வெறும் மண்ணை அல்ல, இஸ்ரவேலர் குடியிருக்கப்போகும் நிலப்பகுதியைக் குறிக்கிறது; ஆகவே ‘நாட்டில்’ என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: אֲשֶׁר אַתֶּם עֹבְרִים אֶת הַיַּרְדֵּן שָׁמָּה
  choice: நீங்கள் யோர்தான் ஆற்றைக் கடந்து சென்று ... விருக்கும்
  rationale: שָׁמָּה காட்டும் இலக்கு நோக்கிய இயக்கத்தை ‘கடந்து சென்று’ என்பதும், நிகழவிருக்கும் செயலை ‘விருக்கும்’ என்பதும் இயல்பாக வெளிப்படுத்துகின்றன.
- source_word: לְרִשְׁתָּהּ
  choice: உரிமையாக்கிக்கொள்ள
  rationale: ירשׁ என்பது இங்கு வாக்குத்தத்த நாட்டைத் தமக்குரிய உடைமையாகப் பெற்றுக்கொள்வதைச் சுட்டுகிறது. ‘உரிமையாக்கிக்கொள்ள’ என்பது கைப்பற்றுதல் மற்றும் உடைமையாதல் ஆகிய நுணுக்கங்களைத் தக்கவைக்கிறது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரை வழங்குதல்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூல உரை நேரடியாகப் பயன்படுத்தும் உடன்படிக்கைப் பெயரை ஒரு பட்டப்பெயரால் மாற்றாமல் ஒலிபெயர்க்கிறது.
- issue: בנים என்பதன் வரம்பு
  choice: பிள்ளைகள்
  alternative: மகன்கள்
  rationale: இச்சூழலில் உடன்படிக்கை அறிவுரையைப் பெற வேண்டிய அடுத்த தலைமுறை பொதுவாகக் குறிக்கப்படுகிறது; ஆண் பிள்ளைகளுக்கு மட்டும் பொருளைச் சுருக்கவில்லை.
- issue: ירשׁ என்பதிலுள்ள உடைமையாதல்/சுதந்தரித்தல் நுணுக்கம்
  choice: உரிமையாக்கிக்கொள்ள
  alternative: அதைச் சுதந்தரித்துக்கொள்ள; அதைக் கைப்பற்றிக்கொள்ள
  rationale: நாட்டைப் பெற்றுக்கொள்வதும் அதனை உடைமையாக்குவதும் ஆகிய இரு கூறுகளையும் சமநிலையுடன் தெரிவிக்கிறது; ‘கைப்பற்றுதல்’ அல்லது ‘சுதந்தரம்’ என்ற ஒரே கூறை மட்டும் முன்னிறுத்தவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், வாசிப்புக்கு இயல்பானதாயும் வழிபாட்டு மரியாதை கொண்டதாயும் அமைக்கப்பட்டுள்ளது. நீண்ட எபிரெய வாக்கியம் தமிழில் இரண்டு வாக்கியங்களாகப் பிரிக்கப்பட்டாலும், கேட்பது—கற்றுக்கொள்வது—அஞ்சுவது என்ற கருத்துத் தொடர் காக்கப்பட்டுள்ளது. எல்லா அடிக்குறிப்பு குறிகளும் அவற்றுக்குரிய சொற்களிடமே வைக்கப்பட்டுள்ளன.
