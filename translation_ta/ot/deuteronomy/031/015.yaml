revisions:
- from: யெகோவா மேகத்தூணில் கூடாரத்தில் தோன்றினார்; அந்த மேகத்தூண் கூடாரத்தின் நுழைவாயிலருகே நின்றது.[a]
  to: யாவே கூடாரத்தில், மேகத்தூணில் தோன்றினார்; அந்த மேகத்தூண் கூடாரத்தின் நுழைவாயிலருகே நின்றது.[a]
