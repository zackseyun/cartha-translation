source:
  edition: WLC
  text: וַ/יֵּרָ֧א יְהוָ֛ה בָּ/אֹ֖הֶל בְּ/עַמּ֣וּד עָנָ֑ן וַ/יַּעֲמֹ֛ד עַמּ֥וּד הֶ/עָנָ֖ן עַל פֶּ֥תַח הָ/אֹֽהֶל־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/015.yaml
  text: And Yahweh appeared in the tent in a pillar of cloud[b][a], and the pillar of cloud stood at the entrance of the tent.
translation:
  language: ta
  text: யாவே கூடாரத்தில், மேகத்தூணில் தோன்றினார்; அந்த மேகத்தூண் கூடாரத்தின் நுழைவாயிலருகே நின்றது.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கூடாரத்தின் நுழைவாயிலுக்கு மேல் நின்றது.” எபிரெய முன்னிடைச்சொல் “மேல்” என்றும் பொருள்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרָא
  choice: தோன்றினார்
  rationale: ראה என்பதன் நிஃபால் வடிவம் இங்கு கண்களுக்குப் புலப்படும் வெளிப்பாட்டைக் குறிக்கிறது. ‘தோன்றினார்’ என்பது இயல்பான தமிழாகவும், வெளிப்பாட்டின் முறையை அளவுக்கு மீறி விளக்காததாகவும் உள்ளது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: இஸ்ரவேலின் தேவனுடைய தனிப்பட்ட உடன்படிக்கைப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் பரவலாக அறியப்பட்ட பெயர்வடிவத்தில் தருகிறது.
- source_word: בָּאֹהֶל
  choice: கூடாரத்தில்
  rationale: אֹהֶל என்பதன் நேரடிப் பொருள் ‘கூடாரம்.’ சூழலில் இது சந்திப்புக் கூடாரத்தைக் குறிப்பிட்டாலும், மூலவசனம் இங்கு ‘கூடாரம்’ என்றே கூறுவதால் அதையே தக்கவைக்கிறது.
- source_word: בְּעַמּוּד עָנָן
  choice: மேகத்தூணில்
  rationale: בְּ என்ற முன்னிடைச்சொல்லையும், தேவனுடைய தோற்றத்தின் ஊடகம் அல்லது வடிவம் குறித்த மூலத்தின் சுருக்கமான படிமத்தையும் தக்கவைக்கிறது. தமிழில் எண்ணிடைச்சொல் இல்லாமலேயே வரையறையற்ற பொருள் இயல்பாக வெளிப்படுகிறது.
- source_word: וַיַּעֲמֹד
  choice: நின்றது
  rationale: עמד என்பதன் நேரடியான, தெளிவான இடநிலைப் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: עַמּוּד הֶעָנָן
  choice: அந்த மேகத்தூண்
  rationale: முன்னர் அறிமுகப்படுத்தப்பட்ட அதே மேகத்தூணை சுட்டுவதால், எபிரெய வரையறைச் சுட்டை தமிழில் ‘அந்த’ என்று இயல்பாக வெளிப்படுத்துகிறது.
- source_word: עַל פֶּתַח הָאֹהֶל
  choice: கூடாரத்தின் நுழைவாயிலருகே
  rationale: இந்த இடவியல் சூழலில் עַל என்பது வாயிலின் அருகிலுள்ள நிலையை இயல்பாகக் குறிக்க முடியும். ‘நுழைவாயிலருகே’ தெளிவான நவீன தமிழ்; ‘நுழைவாயிலுக்கு மேல்’ என்ற நேரடியான மாற்றும் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யெகோவா
  alternative: ஆண்டவர்
  rationale: தனிப்பட்ட உடன்படிக்கைப் பெயரை பொதுவான பட்டத்தால் மாற்றாமல் பாதுகாக்கிறது; தமிழில் மரபாக அறியப்படும் பெயர்வடிவத்தைப் பயன்படுத்துகிறது.
- issue: தேவத்தோற்றத்தின் விவரிப்பு
  choice: மேகத்தூணில் கூடாரத்தில் தோன்றினார்
  alternative: மேகத்தூணாகக் கூடாரத்தில் காணப்பட்டார்
  rationale: தேவன் கண்களுக்குப் புலப்படும் விதத்தில் தோன்றியதையும் மேகத்தூண் படிமத்தையும் தக்கவைத்து, அவர் மேகத்தூணுடன் முழுமையாக அடையாளப்படுத்தப்பட்டார் என்ற விளக்கத்தைத் திணிக்கவில்லை.
- issue: மேகத்தூணின் இடம்
  choice: கூடாரத்தின் நுழைவாயிலருகே
  alternative: கூடாரத்தின் நுழைவாயிலுக்கு மேல்
  rationale: காட்சியின் இடவியல் பொருளை இயல்பான தமிழில் தருகிறது; எனினும் עַל என்பதன் நேரடியான ‘மேல்’ பொருளை அடிக்குறிப்பில் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியும் ஆனால் கண்ணியமான உரைநடை பயன்படுத்தப்பட்டது. ‘கூடாரம்,’ ‘மேகத்தூண்,’ ‘நுழைவாயில்’ ஆகிய சொற்கள் மூலத்தின் காட்சிப்படிமத்தை நேரடியாகப் பாதுகாக்கின்றன. வசனத்தின் இறுதியில் உள்ள சதுமா பிரிவு குறியீடு மொழிபெயர்க்கப்படவில்லை.
