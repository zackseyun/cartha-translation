base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/026.yaml
  text: Take this Book of the Law and place it beside the ark of the covenant of Yahweh your God[b][a], and let it remain there as a witness against you.
translation:
  language: ta
  text: “இந்தத் திருச்சட்டப் புத்தகத்தை[a] எடுத்து, உங்கள் கடவுளாகிய யாவேயின் உடன்படிக்கைப் பெட்டிக்குப் பக்கத்தில் வையுங்கள். அது அங்கே உங்களுக்கு எதிரான சாட்சியாக இருக்கட்டும்[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இந்தத் திருச்சட்டச் சுருளை.” எபிரேயச் சொல் ஒரு சுருளையோ எழுதப்பட்ட ஆவணத்தையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அதாவது, நீங்கள் உடன்படிக்கையை மீறினால் உங்களுக்கு எதிராகச் சாட்சி அளிப்பதற்காக.
    reason: cultural_note
lexical_decisions:
- source_word: לָקֹחַ
  choice: எடுத்து
  rationale: இங்கு வினையெச்ச வடிவம் கட்டளையின் வலிமையுடன் பயன்படுகிறது; அடுத்த கட்டளை வினையோடு இயல்பாக இணையும் தமிழ்ச் சொல்.
- source_word: סֵפֶר הַתּוֹרָה הַזֶּה
  choice: இந்தத் திருச்சட்டப் புத்தகம்
  rationale: סֵפֶר என்பது புத்தகம், சுருள் அல்லது எழுதப்பட்ட ஆவணத்தைக் குறிக்கலாம். இச்சூழலில் תּוֹרָה உடன்படிக்கை சார்ந்த இறைச்சட்டத்தைக் குறிக்கிறது; ‘திருச்சட்டம்’ இயல்பும் கண்ணியமும் கொண்ட தெளிவான மொழிபெயர்ப்பு.
- source_word: וְשַׂמְתֶּם אֹתוֹ
  choice: வையுங்கள்
  rationale: שׂוּם என்பதன் நேரடியான இடமிடும் செயலை நவீனத் தமிழில் இயல்பாகக் காட்டுகிறது.
- source_word: מִצַּד
  choice: பக்கத்தில்
  rationale: பெட்டிக்குள் அல்ல, அதன் அருகில் அல்லது பக்கத்தில் வைக்கப்படுவதைத் தெளிவாகக் குறிக்கிறது.
- source_word: אֲרוֹן בְּרִית
  choice: உடன்படிக்கைப் பெட்டி
  rationale: எபிரேயச் சொற்றொடரின் தொடர்பை நேரடியாகவும் தமிழில் இயல்பாகவும் தருகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைப் பெயரான நான்கெழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: אֱלֹהֵיכֶם
  choice: உங்கள் கடவுள்
  rationale: பன்மை இரண்டாம் நபர் உடைமைத் தொடர்பைத் துல்லியமாகத் தருகிறது.
- source_word: וְהָיָה שָׁם
  choice: அது அங்கே ... இருக்கட்டும்
  rationale: வைக்கப்பட்ட பின்னர் அங்கே தொடர்ந்திருக்கும் நோக்கத்தைக் காட்டும் இயல்பான தமிழ்க் கட்டளை வடிவம்.
- source_word: בְּךָ
  choice: உங்களுக்கு எதிரான
  rationale: לְעֵד בְּ என்ற உடன்படிக்கை மற்றும் நீதிமன்றச் சூழலுடைய மரபுத்தொடரில், இம்முன்னொட்டு குற்றஞ்சாட்டும் சாட்சியின் எதிர்நிலையை வெளிப்படுத்துகிறது. எபிரேயத்தில் ஒருமை பின்னொட்டு இருந்தாலும் இஸ்ரவேலைக் கூட்டாகக் குறிப்பிடுவதால் தமிழில் மரியாதை/பன்மை வடிவம் பொருத்தமானது.
- source_word: לְעֵד
  choice: சாட்சியாக
  rationale: עֵד என்பதன் அடிப்படை நீதிமன்றப் பொருளைத் தக்கவைக்கிறது.
theological_decisions:
- issue: திருச்சட்டப் புத்தகத்தின் சாட்சிப் பணி
  choice: உடன்படிக்கையை மீறினால் இஸ்ரவேலுக்கு எதிராக நிற்கும் நீதிமன்றச் சாட்சி
  alternative: நடுநிலையான நினைவுச்சின்னம் அல்லது சாட்சி
  rationale: לְעֵד בְּךָ என்ற சொற்றொடரும் உபாகமத்தின் உடன்படிக்கைச் சூழலும் எதிரான சாட்சியைக் குறிக்கின்றன; அதேவேளையில் மீறுதலின் நிபந்தனை விளக்கக் குறிப்பில் மட்டுமே தெளிவுபடுத்தப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. ‘யாவே’ என்று இறைப் பெயர் ஒலிபெயர்க்கப்பட்டுள்ளது. ‘திருச்சட்டம்’ என்பது תּוֹרָה-வின் இச்சூழலிலுள்ள உடன்படிக்கைச் சட்டப் பொருளை வெளிப்படுத்துகிறது; ‘சுருள்’ என்ற ஆவண வடிவ மாற்று அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
