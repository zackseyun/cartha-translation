  yaml_path: translation/ot/deuteronomy/031/004.yaml
  text: And the LORD will do to them just as he did to Sihon and Og, the kings of the Amorites, and to their land, when he destroyed them.
translation:
  language: ta
  text: யெகோவா எமோரியர்களின் அரசர்களான சீகோனுக்கும் ஓகுக்கும் அவர்களுடைய நாட்டுக்கும் செய்து, அவர்களை அழித்ததுபோலவே இவர்களுக்கும் செய்வார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: யெகோவா
  rationale: தேவனுடைய தனிப்பட்ட பெயரைப் பொதுவாக அறியப்படும் தமிழ் வடிவில் வெளிப்படுத்துகிறது.
- source_word: לָהֶם
  choice: இவர்களுக்கும்
  rationale: உடனுள்ள உரைச்சூழலில் குறிப்பிடப்படும் எதிரிகளைச் சுட்டும் இயல்பான தமிழ் வடிவம்.
- source_word: מַלְכֵי הָאֱמֹרִי
  choice: எமோரியர்களின் அரசர்கள்
  rationale: எபிரெயச் சொற்றொடரின் பொருளைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: הִשְׁמִיד
  choice: அழித்த
  rationale: முழுமையாக ஒழித்தல் அல்லது அழித்தல் என்ற வினையின் வலிமையைப் பாதுகாக்கிறது.
theological_decisions:
- issue: אֲשֶׁר என்பதன் தொடர்பு
  choice: அவர்களை அழித்ததுபோலவே
  alternative: அவர்களை அழித்தபோது
  rationale: எபிரெயில் தொடர்புப்பெயர்ச்சொல் பலவாறு புரியக்கூடியதாக இருந்தாலும், சீகோன், ஓகு மற்றும் அவர்களுடைய நாட்டுக்கு யெகோவா செய்த செயலை விளக்கும் விதத்தில் தமிழில் இயல்பாக அமைக்கப்பட்டுள்ளது; காலப் பொருளை மட்டும் கட்டாயப்படுத்தவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், வேதாகமத்துக்கேற்ற கண்ணியமான ஆனால் சாதாரண வாசகர்களுக்குப் புரியும் நடை. நீண்ட எபிரெய வாக்கிய அமைப்பு தமிழில் இயல்பான வரிசைக்கு மாற்றப்பட்டுள்ளது.
