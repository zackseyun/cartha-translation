  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל מֹשֶׁ֗ה הֵ֣ן קָרְב֣וּ יָמֶי/ךָ֮ לָ/מוּת֒ קְרָ֣א אֶת יְהוֹשֻׁ֗עַ וְ/הִֽתְיַצְּב֛וּ בְּ/אֹ֥הֶל מוֹעֵ֖ד וַ/אֲצַוֶּ֑/נּוּ וַ/יֵּ֤לֶךְ מֹשֶׁה֙ וִֽ/יהוֹשֻׁ֔עַ וַ/יִּֽתְיַצְּב֖וּ בְּ/אֹ֥הֶל מוֹעֵֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/014.yaml
  text: And Yahweh said to Moses[a], “Behold, your days are drawing near for you to die. Call Joshua, and present yourselves in the tent of meeting, that I may command him.” So Moses and Joshua went and presented themselves in the tent of meeting.
translation:
  language: ta
  text: யாவே மோசேயிடம், “இதோ, நீ இறக்கும் காலம் நெருங்கிவிட்டது. யோசுவாவை அழை; நான் அவனுக்குக் கட்டளையிடுவதற்காக நீங்கள் இருவரும் சந்திப்புக் கூடாரத்தில் நில்லுங்கள்” என்றார். ஆகவே மோசேயும் யோசுவாவும் சென்று சந்திப்புக் கூடாரத்தில் நின்றார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைவனின் தனிப்பெயரான நான்கு மெய்யெழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் இயல்பாக ஒலிபெயர்க்கிறது.
- source_word: הֵן
  choice: இதோ
  rationale: தெய்வீக உரையின் தொடக்கத்தில் கவனத்தை ஈர்க்கும் எபிரெய இடைச்சொல்லின் வலிமையையும் கண்ணியமான நடையையும் காக்கிறது.
- source_word: קָרְבוּ יָמֶיךָ לָמוּת
  choice: நீ இறக்கும் காலம் நெருங்கிவிட்டது
  rationale: சொல்லுக்குச் சொல் மொழிபெயர்த்தால் தமிழில் இயல்பற்றதாகும் எபிரெய மரபுத்தொடரை, அதன் பொருளைச் சுருக்காமல் இயல்பான நவீன தமிழில் தருகிறது.
- source_word: קְרָא אֶת יְהוֹשֻׁעַ
  choice: யோசுவாவை அழைத்து
  rationale: எளிய கட்டளையின் நேரடித் தன்மையைப் பேணுகிறது; அடுத்த கட்டளையுடன் தமிழில் இயல்பாக இணைக்கிறது.
- source_word: וְהִתְיַצְּבוּ
  choice: நீங்கள் இருவரும் ... வந்து நில்லுங்கள்
  rationale: பன்மைக் கட்டளையைத் தெளிவாக்கி, குறிப்பிட்ட இடத்தில் தங்களை முன்னிறுத்தி நிற்கும் பொருளை இயல்பான தமிழில் வழங்குகிறது.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: சந்திப்புக் கூடாரத்தில்
  rationale: இஸ்ரவேலின் பரிசுத்தக் கூடாரத்துக்கான நிலையான கருத்தைத் துல்லியமாகத் தருவதோடு, בְ முன்னிடைச்சொல்லையும் பிரதிபலிக்கிறது.
- source_word: וַאֲצַוֶּנּוּ
  choice: அப்போது நான் அவனுக்குக் கட்டளையிடுவேன்
  rationale: צוה என்பதன் அடிப்படைப் பொருளான ‘கட்டளையிடு’ என்பதை முதன்மை உரையில் காக்கிறது; இச்சூழலில் உள்ள பொறுப்பளித்தல் அல்லது நியமித்தல் நுணுக்கம் அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
- source_word: וַיֵּלֶךְ מֹשֶׁה וִיהוֹשֻׁעַ
  choice: ஆகவே மோசேயும் யோசுவாவும் சென்று
  rationale: கட்டளைக்குக் கீழ்ப்படிந்த அடுத்த நிகழ்வைத் தமிழில் இயல்பான கதைத் தொடர்ச்சியாகக் காட்டுகிறது.
- source_word: וַיִּתְיַצְּבוּ
  choice: வந்து நின்றார்கள்
  rationale: முன்னர் கொடுக்கப்பட்ட கட்டளைக்கும் அதன் நிறைவேற்றத்திற்கும் சொற்பொருள் ஒற்றுமையைப் பேணுகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழியாக்கம்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூல உரை ஒரு பட்டத்தை அல்ல, இறைவனின் தனிப்பெயரைப் பயன்படுத்துகிறது. எனவே அதைத் தமிழில் ஒலிபெயர்ப்பது மூலத்தின் வேறுபாட்டைப் பேணுகிறது.
- issue: Joshuaவுக்குச் செய்யப்படவிருக்கும் צוה செயலின் நுணுக்கம்
  choice: அவனுக்குக் கட்டளையிடுவேன்
  alternative: அவனுக்குப் பொறுப்பளிப்பேன்; அவனை நியமிப்பேன்
  rationale: வினையின் நேரடிப் பொருளை முதன்மை உரையில் வைத்தபடியே, மோசேயின் மறைவுக்கு முன் யோசுவாவுக்கு அதிகாரப்பூர்வப் பொறுப்பு அளிக்கப்படும் சூழலை அடிக்குறிப்பு மூலம் வெளிப்படுத்துகிறது; எந்தப் பிற்கால சமயப் பதவிக் கருத்தையும் இறக்குமதி செய்யவில்லை.
- issue: וַאֲצַוֶּנּוּ இணைப்பின் தொடர்பு
  choice: அப்போது நான் அவனுக்குக் கட்டளையிடுவேன்
  alternative: நான் அவனுக்குக் கட்டளையிடும்படி
  rationale: எபிரெய உரையில் வெளிப்படையான நோக்குச் சொல் இல்லாமல் இணை வினை வடிவம் இருப்பதால், அதை உறுதியான நோக்குப் பிரிவாக மட்டும் தீர்மானிக்காமல் தொடர்ச்சியான தெய்வீக செயற்பாடாகத் தருகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான உரைநடை பயன்படுத்தப்பட்டுள்ளது. ‘நீங்கள் இருவரும்’ என்பது எபிரெய பன்மைக் கட்டளையைத் தெளிவாக்குகிறது. ‘வந்து நில்லுங்கள் / வந்து நின்றார்கள்’ என்ற இணை வடிவங்கள் கட்டளைக்கும் அதன் நிறைவேற்றத்திற்கும் இடையிலான ஒற்றுமையைப் பேணுகின்றன.
