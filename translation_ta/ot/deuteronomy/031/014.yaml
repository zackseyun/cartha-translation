revisions:
- from: யாவே மோசேயிடம், “இதோ, நீ இறக்கும் காலம் நெருங்கிவிட்டது. யோசுவாவை அழைத்து, நீங்கள் இருவரும் சந்திப்புக் கூடாரத்தில் வந்து நில்லுங்கள்; அப்போது நான் அவனுக்குக் கட்டளையிடுவேன்[a]” என்றார். ஆகவே மோசேயும் யோசுவாவும் சென்று, சந்திப்புக் கூடாரத்தில் வந்து நின்றார்கள்.
  to: யாவே மோசேயிடம், “இதோ, நீ இறக்கும் காலம் நெருங்கிவிட்டது. யோசுவாவை அழை; நான் அவனுக்குக் கட்டளையிடுவதற்காக நீங்கள் இருவரும் சந்திப்புக் கூடாரத்தில் நில்லுங்கள்” என்றார். ஆகவே மோசேயும் யோசுவாவும் சென்று சந்திப்புக் கூடாரத்தில் நின்றார்கள்.
  rationale: The revision renders the final clause as the purpose of appearing at the tent, removes redundant motion wording, and refines the lexical footnote so that it distinguishes the verb’s central sense (‘command/charge’) from its contextual commissioning nuance. No doctrinal interpretation is added.
