  yaml_path: translation/ot/deuteronomy/031/005.yaml
  text: And the LORD will give them over to you, and you shall do to them according to all the commandment that I have commanded you.
translation:
  language: ta
  text: யெகோவா அவர்களை உங்கள் கையில் ஒப்புக்கொடுப்பார்; நான் உங்களுக்குக் கட்டளையிட்ட எல்லாவற்றின்படியும் நீங்கள் அவர்களுக்குச் செய்ய வேண்டும்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּנְתָנָם יְהוָה לִפְנֵיכֶם
  choice: யெகோவா அவர்களை உங்களிடம் ஒப்புக்கொடுப்பார்
  rationale: נתן ... לפני என்ற எபிரேய சொற்றொடர் இச்சூழலில் எதிரிகளை இஸ்ரவேலரின் அதிகாரத்திற்குள் ஒப்புக்கொடுப்பதைக் குறிக்கிறது. இயல்பான தமிழில் பொருளைத் தெளிவாகத் தருகிறது.
- source_word: כְּכָל הַמִּצְוָה
  choice: கட்டளையிட்ட எல்லாவற்றின்படியும்
  rationale: மூலத்தில் ஒருமையிலுள்ள ‘முழுக் கட்டளை’ என்பது கட்டளையின் முழு உள்ளடக்கத்தையும் குறிக்கிறது; தமிழில் இந்த வடிவம் அதனை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: אֲשֶׁר צִוִּיתִי אֶתְכֶם
  choice: நான் உங்களுக்குக் கட்டளையிட்ட
  rationale: மோசே முன்பு வழங்கிய கட்டளையையே நேரடியாகவும் தெளிவாகவும் பிரதிபலிக்கிறது.
theological_decisions:
- issue: தெய்வீகப் பெயர் יהוה
  choice: யெகோவா
  alternative: கர்த்தர்
  rationale: மூலத்தில் உள்ள தனிப்பட்ட தெய்வீகப் பெயரை பொதுப்பட்டத்தால் மாற்றாமல், தமிழ் வேதாகம வாசகர்களுக்கு அறிமுகமான பெயர்வடிவில் தருகிறது.
- issue: இஸ்ரவேலர் எதிரிகளுக்குச் செய்ய வேண்டியது
  choice: நான் உங்களுக்குக் கட்டளையிட்ட எல்லாவற்றின்படியும் நீங்கள் அவர்களுக்குச் செய்ய வேண்டும்
  alternative: நான் உங்களுக்குக் கட்டளையிட்ட முழுக் கட்டளையின்படியும் அவர்களுக்குச் செய்யுங்கள்
  rationale: வசனத்தின் கடுமையையோ அதன் முந்தைய சூழல் சார்பையோ மென்மைப்படுத்தாமல், அதே நேரத்தில் இவ்வசனத்தில் இல்லாத விவரங்களைச் சேர்க்காமல் மொழிபெயர்க்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், மரியாதையும் தெளிவும் கொண்ட நடையில் மொழிபெயர்க்கப்பட்டது. எபிரேய வாக்கியத்தின் இரண்டு எதிர்கால/கடமைக் கூறுகளும் அரைப்புள்ளியால் இணைக்கப்பட்டுள்ளன.
