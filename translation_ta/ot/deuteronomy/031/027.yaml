  text: כִּ֣י אָנֹכִ֤י יָדַ֨עְתִּי֙ אֶֽת מֶרְיְ/ךָ֔ וְ/אֶֽת עָרְפְּ/ךָ֖ הַ/קָּשֶׁ֑ה הֵ֣ן בְּ/עוֹדֶ/נִּי֩ חַ֨י עִמָּ/כֶ֜ם הַ/יּ֗וֹם מַמְרִ֤ים הֱיִתֶם֙ עִם יְהֹוָ֔ה וְ/אַ֖ף כִּי אַחֲרֵ֥י מוֹתִֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/027.yaml
  text: For I know your rebellion and your stiff neck[a]. Look, while I am still alive with you today, you have been rebellious against Yahweh[b]; and how much more after my death!
translation:
  language: ta
  text: ஏனெனில், உன் கலகத்தையும் உன் விறைப்பான கழுத்தையும்[a] நான் அறிவேன். இதோ, இன்று நான் இன்னும் உயிரோடு உங்களுடன் இருக்கும்போதே நீங்கள் யாவேக்கு எதிராக[b]க் கலகம் செய்து வந்திருக்கிறீர்கள்; என் மரணத்திற்குப் பிறகு இன்னும் எவ்வளவு அதிகமாகக் கலகம் செய்வீர்கள்!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரேயத்தில், “உன் விறைப்பான கழுத்து”; இது பிடிவாதத்தைக் குறிக்கும் ஓர் உருவகம்.
    reason: lexical_alternative
  - marker: b
    text: சொல்லளவில், “யாவேயுடன்”; இச்சூழலில் அது யாவேக்கு எதிரான நிலைப்பாட்டைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֶרְיְךָ
  choice: உன் கலகம்
  rationale: உடன்படிக்கை உறவுக்குள் காட்டப்படும் எதிர்ப்பையும் கீழ்ப்படியாமையையும் குறிக்கும் பெயர்ச்சொல் வடிவத்தைப் பேணுகிறது.
- source_word: עָרְפְּךָ הַקָּשֶׁה
  choice: உன் விறைப்பான கழுத்து
  rationale: பிடிவாதத்தைக் குறிக்கும் எபிரேய உருவகத்தை விளக்கமாக மாற்றாமல் நேரடியாகப் பேணுகிறது.
- source_word: הֵן
  choice: இதோ
  rationale: கவனத்தை ஈர்த்து அடுத்த கூற்றை வலியுறுத்தும் உரையாடல் இடைச்சொல்லின் ஆற்றலை இயல்பான, கண்ணியமான தமிழில் தருகிறது.
- source_word: בְּעוֹדֶנִּי חַי
  choice: நான் இன்னும் உயிரோடு இருக்கும்போதே
  rationale: மோசே இன்னும் உயிருடன் இருக்கும் தற்போதைய காலநிலையையும் ‘கூட’ என்ற வலியுறுத்தலையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: מַמְרִים הֱיִתֶם
  choice: நீங்கள் கலகம் செய்து வந்திருக்கிறீர்கள்
  rationale: היה உடன் வரும் பங்கேற்புவினை காட்டும் தொடர்ச்சியான அல்லது வழக்கமான கலகப் போக்கைத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: עִם יְהוָה
  choice: யாவேக்கு எதிராக
  rationale: עִם என்பதன் அடிப்படைப் பொருள் ‘உடன்’ என்றாலும், ‘கலகம் செய்’ என்பதோடு இங்கு எதிர்ப்புற உறவைக் குறிக்கிறது; தமிழில் ‘எதிராக’ சூழலின் பொருளைத் தெளிவாக்குகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைத் திருப்பெயரை ஒரு பொதுப் பட்டமாக மாற்றாமல் தனிப்பெயராக ஒலிபெயர்க்கிறது.
- source_word: וְאַף כִּי
  choice: இன்னும் எவ்வளவு அதிகமாக
  rationale: இப்போதே கலகம் செய்கிறார்கள் என்றால் மோசேயின் மரணத்திற்குப் பின் அதைவிட அதிகமாக இருக்கும் என்ற வலுவான ஒப்பீட்டு முடிவைத் தருகிறது.
- source_word: אַחֲרֵי מוֹתִי
  choice: என் மரணத்திற்குப் பிறகு
  rationale: எபிரேயத்தின் பெயர்ச்சொல் அமைப்பையும் கால உறவையும் நேரடியாகப் பேணுகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைத் திருப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் வரும் உடன்படிக்கைத் திருப்பெயரை பட்டத்தால் மாற்றாமல் தமிழில் ஒலிபெயர்த்து, அது தனிப்பெயர் என்பதைப் பேணுகிறது.
- issue: עִם יְהוָה என்பதில் עִם-இன் உறவு
  choice: யாவேக்கு எதிராக
  alternative: யாவேயுடன்
  rationale: சொல்லளவில் ‘உடன்’ சாத்தியமானாலும், ‘கலகம் செய்து வந்திருக்கிறீர்கள்’ என்ற வினையுடன் இங்கு எதிர்ப்பு என்ற பொருள் இயல்பாக உள்ளது. மாற்று வாசிப்பை அடிக்குறிப்பு பதிவு செய்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. ஒருமை ‘உன்’ என்பதிலிருந்து பன்மை ‘உங்களுடன்/நீங்கள்’ என்பதற்கான மூலத்தின் மாறுதல் பேணப்பட்டுள்ளது. எபிரேயத்தின் ‘விறைப்பான கழுத்து’ உருவகம் முதன்மை உரையில் வைக்கப்பட்டு அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது.
