  source_fidelity: திருத்தம் அவசியம். אֲשֶׁר נִשְׁבַּעְתִּי לָהֶם என்பதன் பொருள் “நான் அவர்களுக்குச் சத்தியம் செய்த” என்பதே; வரைவில் உள்ள “அவர்களுக்குத் தருவதாக ஆணையிட்ட” என்பது நிஷ்பஅ (‘சத்தியம் செய்தல்’) என்பதற்குப் பதிலாக ‘கட்டளையிடுதல்’ என்ற வேறுபட்ட பொருளைத் தருகிறது; மேலும் மூலத்தில் வெளிப்படையாக இல்லாத ‘தருவதாக’ என்பதையும் சேர்க்கிறது. மற்ற முக்கிய கூறுகள்—மறைமுக எழுவாய், யோசுவாவின் தந்தைப்பெயர், ஊக்கக் கட்டளை, இஸ்ரவேல் மக்களை நாட்டிற்குள் கொண்டுவருதல், உடனிருப்பின் வாக்குறுதி—திருத்திய உரையில் பாதுகாக்கப்பட்டுள்ளன.
  naturalness: “அவர் நூனின் மகனான யோசுவாவுக்குக் கட்டளையிட்டுக் கூறினார்” மற்றும் “வலிமையுடனும் துணிவுடனும் இரு” நவீன நிலையான தமிழில் இயல்பாகவும் கண்ணியமாகவும் உள்ளன. “நான் அவர்களுக்குச் சத்தியம் செய்த நாட்டிற்குள்” என்பது எபிரெய வாக்குறுதி-சத்தியச் சொல்லாட்சியைச் சுருக்கமாகவும் தெளிவாகவும் காக்கிறது.
  terminology: ‘சத்தியம் செய்த’ என்பது נִשְׁבַּעְתִּי-க்கு உரிய மொழிபெயர்ப்பு. ‘இஸ்ரவேலின் மகன்கள்’ மூலத்தின் குடும்பச் சொல்லாட்சியைத் தக்கவைக்கிறது; அடிக்குறிப்பில் அதன் இயல்பான கூட்டுப் பொருள் கொடுக்கப்பட்டுள்ளது. ‘நானே’ אָנֹכִי-யின் வலியுறுத்தலைத் தக்கவைக்கிறது.
