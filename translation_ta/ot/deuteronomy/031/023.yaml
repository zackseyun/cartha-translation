  text: וַ/יְצַ֞ו אֶת יְהוֹשֻׁ֣עַ בִּן נ֗וּן וַ/יֹּאמֶר֮ חֲזַ֣ק וֶֽ/אֱמָץ֒ כִּ֣י אַתָּ֗ה תָּבִיא֙ אֶת בְּנֵ֣י יִשְׂרָאֵ֔ל אֶל הָ/אָ֖רֶץ אֲשֶׁר נִשְׁבַּ֣עְתִּי לָ/הֶ֑ם וְ/אָנֹכִ֖י אֶֽהְיֶ֥ה עִמָּֽ/ךְ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/023.yaml
  text: And he commanded Joshua son of Nun and said[a], “Be strong and courageous, for you will bring the sons of Israel into the land that I swore to them, and I will be with you.”
translation:
  language: ta
  text: 'அவர் நூனின் மகனான யோசுவாவுக்குக் கட்டளையிட்டுக் கூறினார்: “வலிமையுடனும் துணிவுடனும் இரு. ஏனெனில், நான் அவர்களுக்குச் சத்தியம் செய்த நாட்டிற்குள் இஸ்ரவேலின் மகன்களை[a] நீ கொண்டு வருவாய்; நானே உன்னோடு இருப்பேன்.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது “இஸ்ரவேலர்,” “இஸ்ரவேல் மக்கள்.” எபிரெயத்தில் சொற்பட “இஸ்ரவேலின் மகன்கள்.”
    reason: மூலத்தின் குடும்பச் சொல்லாட்சியையும் அதற்கான இயல்பான தமிழ்க் கூட்டு மாற்றுகளையும் காட்டுகிறது.
lexical_decisions:
- source_word: וַיְצַו
  choice: கட்டளையிட்டார்
  rationale: צוה என்பதன் பியேல் வடிவம் இங்கு அதிகாரபூர்வமாகக் கட்டளையிடுதல் அல்லது பொறுப்பளித்தல் என்பதைக் குறிக்கிறது; நவீனத் தமிழில் ‘கட்டளையிட்டார்’ நேரடியும் இயல்புமானது.
- source_word: יְהוֹשֻׁעַ בִּן נוּן
  choice: நூனின் மகனான யோசுவா
  rationale: எபிரெயப் பெயர்களின் வழக்கமான தமிழ் ஒலிபெயர்ப்பையும் தந்தை–மகன் உறவையும் தெளிவாகக் காட்டுகிறது.
- source_word: חֲזַק וֶאֱמָץ
  choice: வலிமையுடனும் துணிவுடனும் இரு
  rationale: இணையாக வரும் இரு கட்டளைகளில் உடல் அல்லது உள்ளார்ந்த வலிமையும் மனத்துணிவும் அடங்குகின்றன; இந்தச் சொற்றொடர் நவீனத் தமிழில் இயல்பாக அந்த முழு வலிமையையும் தருகிறது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: யோசுவா வலிமையுடனும் துணிவுடனும் இருக்க வேண்டிய காரணத்தை இங்கு כִּי அறிமுகப்படுத்துகிறது.
- source_word: תָּבִיא
  choice: அழைத்துச் செல்வாய்
  rationale: בוא என்பதன் ஹிஃபில் வடிவம் ‘உள்ளே கொண்டுவருதல்/அழைத்துச் செல்லுதல்’ என்று பொருள்படும்; நாட்டிற்குள் மக்களை நடத்திச் சேர்ப்பதைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் மகன்கள்
  rationale: எபிரெய மூலத்தின் குடும்ப மற்றும் உடன்படிக்கைச் சாயலைத் தக்கவைக்கும் நேரடியான மொழிபெயர்ப்பு; இது மொத்த இஸ்ரவேல் மக்களையும் குறிக்கும் என்பதை அடிக்குறிப்பு தெளிவுபடுத்துகிறது.
- source_word: הָאָרֶץ
  choice: நாடு
  rationale: உடன்படிக்கை வாக்குறுதியின் பின்னணியில் הארץ என்பது இஸ்ரவேலருக்குரிய நாட்டைக் குறிக்கிறது; ‘நாடு’ நவீனத் தமிழில் இயல்பானதும் தெளிவானதும் ஆகும்.
- source_word: אֲשֶׁר נִשְׁבַּעְתִּי לָהֶם
  choice: நான் அவர்களுக்குத் தருவதாக ஆணையிட்ட
  rationale: எபிரெயம் சொற்பட ‘அவர்களுக்கு நான் ஆணையிட்ட’ என்று இருந்தாலும், ஆணையின் பொருள் நாட்டை அவர்களுக்குக் கொடுப்பதே என்பது வாக்கிய அமைப்பில் மறைமுகமாக உள்ளது; தமிழில் முழுமையற்ற பொருள் தோன்றாமல் ஆணையின் வலிமையைப் பாதுகாக்க இவ்வாறு தரப்பட்டுள்ளது.
- source_word: וְאָנֹכִי אֶהְיֶה עִמָּךְ
  choice: நானே உன்னோடு இருப்பேன்
  rationale: தனியாக வரும் אָנֹכִי தரும் வலியுறுத்தலை ‘நானே’ காக்கிறது; ‘உன்னோடு இருப்பேன்’ என்ற வாக்குறுதி வடிவமும் நேரடியாகப் பாதுகாக்கப்படுகிறது.
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל என்பதன் கூட்டு மற்றும் குடும்பப் பொருள்
  choice: இஸ்ரவேலின் மகன்கள்
  alternative: இஸ்ரவேலர் / இஸ்ரவேல் மக்கள்
  rationale: மூலத்தின் ஆண்பால் குடும்பச் சொல்லாட்சியையும் உடன்படிக்கைத் தொடர்பையும் முதன்மை உரை காக்கிறது; இது ஆண்களை மட்டும் அல்லாமல் இஸ்ரவேல் சமூகத்தையே குறிக்கும் என்பதைக் குறிப்பில் தெரிவிக்கிறது.
- issue: וַיְצַו / וַיֹּאמֶר வினைகளின் மறைமுக எழுவாய்
  choice: அவர் ... கட்டளையிட்டுச் சொன்னார்
  alternative: கர்த்தர் ... கட்டளையிட்டுச் சொன்னார்
  rationale: இவ்வசனத்தின் எபிரெய உரையில் எழுவாய் பெயரால் மீண்டும் குறிப்பிடப்படவில்லை. சூழல் பேசுகிறவரை அடையாளப்படுத்துவதால், மூலத்தில் இல்லாத இறைப்பெயரைச் சேர்க்காமல் ‘அவர்’ என மொழிபெயர்க்கப்பட்டுள்ளது.
- issue: אֲשֶׁר נִשְׁבַּעְתִּי לָהֶם என்ற ஆணைச் சொற்றொடரில் மறைந்திருக்கும் கொடுத்தல்
  choice: நான் அவர்களுக்குத் தருவதாக ஆணையிட்ட
  alternative: நான் அவர்களுக்கு ஆணையிட்ட
  rationale: மூலத்தில் ‘தர’ என்ற வினை வெளிப்படையாக இல்லை; இருப்பினும் நாட்டைக் குறித்த ஆணையின் உள்ளடக்கம் கொடுத்தலே. தமிழில் பொருள் முழுமையாகவும் இயல்பாகவும் அமைய அந்த மறைபொருள் வெளிப்படுத்தப்பட்டுள்ளது; புதிய இறையியல் கருத்து சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் வகையிலும் ஆணையுரையின் கண்ணியமும் வலிமையும் நீங்காத வகையிலும் மொழிநடை அமைக்கப்பட்டுள்ளது. பழமையான அல்லது பிரிவுசார் சொற்கள் தவிர்க்கப்பட்டுள்ளன.
