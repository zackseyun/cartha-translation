  text: Then Moses went and spoke these words to all Israel[a].
translation:
  language: ta
  text: பின்பு மோசே சென்று, இந்த வார்த்தைகளை இஸ்ரவேலர் அனைவரிடமும் பேசினார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘மேலும், மோசே சென்று, இந்த வார்த்தைகளை இஸ்ரவேலர் அனைவரிடமும் பேசினார்.’ தொடக்க இணைப்புச்சொல்லை இன்னும் நேரடியாக ‘மேலும்’ என்றும் மொழிபெயர்க்கலாம்.
