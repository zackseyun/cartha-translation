lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: போய்
  rationale: הלך என்பதன் இயல்பான பொருளான ‘போ’ என்பதைத் தக்கவைக்கிறது. செல்லும் இடம் குறிப்பிடப்படாதபோதிலும், அதை ‘தொடர்ந்து’ என்று மொழிமாற்றி அதன் நேரடியான இயக்கப் பொருளை நீக்க வேண்டிய அவசியம் சூழலில் இல்லை.
- source_word: מֹשֶׁה
  choice: மோசே
  rationale: மֹשֶׁה என்ற எபிரெயப் பெயரின் தமிழில் நிலைபெற்ற வடிவம்.
- source_word: וַיְדַבֵּר
  choice: பேசினார்
  rationale: ப piel வடிவிலுள்ள דבר இங்கு ‘பேசு’ என்று பொருள்படுகிறது; தொடர்ந்து வரும் ‘இந்த வார்த்தைகளை’ என்ற நேரடிச் செயப்படுபொருளுடன் இயல்பாக அமைகிறது.
- source_word: אֶת הַדְּבָרִים הָאֵלֶּה
  choice: இந்த வார்த்தைகளை
  rationale: சொற்றொடரின் நேரடியான பொருளைத் தக்கவைத்து, தொடர்ந்து வரும் குறிப்பிட்ட உரையைக் சுட்டுகிறது.
- source_word: אֶל
  choice: இடமும்
  rationale: אֶל இங்கு உரை யாரை நோக்கிப் பேசப்பட்டது என்பதைக் குறிக்கிறது; ‘இஸ்ரவேல் அனைவரிடமும்’ என்பது நவீனத் தமிழில் இயல்பான வடிவம்.
- source_word: כָּל יִשְׂרָאֵל
  choice: இஸ்ரவேல் அனைவரிடமும்
  rationale: இஸ்ரவேலை ஒரு கூட்டு மக்களாகக் குறிக்கும் எபிரெய வடிவத்தைத் தக்கவைக்கிறது; தனித்தனி நபர்களை முன்னிறுத்தும் ‘இஸ்ரவேலர்கள் எல்லாரிடமும்’ என்பதைத் தவிர்க்கிறது.
- source_word: וַ
  choice: பின்பு
  rationale: தொடக்க வாவ் கதைநிகழ்வை முன்னெடுத்துச் செல்லும் தொடர்ச்சியை இங்கு குறிக்கிறது; ‘பின்பு’ நவீனத் தமிழில் அந்த வரிசையை இயல்பாக வெளிப்படுத்துகிறது.
