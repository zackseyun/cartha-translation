  text: חִזְק֣וּ וְ/אִמְצ֔וּ אַל תִּֽירְא֥וּ וְ/אַל תַּעַרְצ֖וּ מִ/פְּנֵי/הֶ֑ם כִּ֣י יְהוָ֣ה אֱלֹהֶ֗י/ךָ ה֚וּא הַ/הֹלֵ֣ךְ עִמָּ֔/ךְ לֹ֥א יַרְפְּ/ךָ֖ וְ/לֹ֥א יַעַזְבֶֽ/ךָּ־־׀׃פ
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/006.yaml
  text: Be strong and courageous[a]. Do not fear or be terrified because of them, for Yahweh your God is the one who goes with you[b]; he will not fail you or forsake you.
translation:
  language: ta
  text: வலிமையுடனும் துணிவுடனும் இருங்கள். அவர்களைக் கண்டு அஞ்சாதீர்கள்; திகிலடையாதீர்கள்.[a] ஏனெனில், உங்கள் கடவுளாகிய யாவே தாமே உங்களுடன் செல்கிறவர்; அவர் உங்களைத் தளரவிடமாட்டார்,[b] உங்களைக் கைவிடவும் மாட்டார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இரண்டாவது எபிரேய வினை முதலாவதைவிட வலுவானது; ‘அவர்களைக் கண்டு அஞ்சவோ பேரச்சத்தால் நிலைகுலையவோ வேண்டாம்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: எபிரேயத்தில், ‘அவர் உங்களை விடமாட்டார்’ அல்லது ‘உங்கள் மீதுள்ள பிடியைத் தளர்த்தமாட்டார்’; அதாவது, உங்களைத் தாங்குவதில் அவர் தவறமாட்டார்.
    reason: lexical_alternative
lexical_decisions:
- source_word: חִזְקוּ וְאִמְצוּ
  choice: வலிமையுடனும் துணிவுடனும் இருங்கள்
  rationale: இரண்டு பன்மை ஏவல் வினைகளின் இணைந்த ஊக்கமூட்டும் வலிமையை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: אַל תִּירְאוּ וְאַל תַּעַרְצוּ
  choice: அஞ்சாதீர்கள்; திகிலடையாதீர்கள்
  rationale: இரண்டாவது எபிரேய வினை முதலாவதைவிட வலுவான அச்சத்தைக் குறிப்பதால், இரண்டு நிலைகளையும் வேறுபடுத்திக் காட்டுகிறது.
- source_word: מִפְּנֵיהֶם
  choice: அவர்களைக் கண்டு
  rationale: சொல்லடியாக ‘அவர்களுடைய முன்னிலையில்/அவர்களால்’ என்ற பொருளைச் சூழலுக்கேற்ற இயல்பான தமிழில் தருகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைப்பட்டத்தை மாற்றாக இடாமல், எபிரேய நான்கெழுத்துத் திருப்பெயரைத் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: הוּא הַהֹלֵךְ עִמָּךְ
  choice: தாமே உங்களுடன் செல்கிறவர்
  rationale: הוּא என்பதன் வலியுறுத்தலையும், தொடர்ச்சியான உடனிருப்பைக் காட்டும் பங்கேற்பு வினை வடிவத்தையும் காக்கிறது.
- source_word: לֹא יַרְפְּךָ
  choice: உங்களைக் கைவிடமாட்டார்
  rationale: רפה என்பதிலுள்ள பிடியைத் தளர்த்துதல் அல்லது ஆதரிக்கத் தவறுதல் என்ற கருத்தை இயல்பான தமிழில் தருகிறது; அடுத்துள்ள עזב உடன் முழுமையாக ஒன்றாக்காமல் அடிக்குறிப்பில் சொல்லடிப் பொருள் காக்கப்படுகிறது.
- source_word: וְלֹא יַעַזְבֶךָ
  choice: உங்களை விட்டுவிலகவும் மாட்டார்
  rationale: עזב என்பதன் விட்டுச் செல்லுதல்/விலகுதல் என்ற பொருளை முதல் உறுதிமொழியிலிருந்து வேறுபடுத்துகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூலத்தில் தனிப்பட்ட உடன்படிக்கைப் பெயர் நேரடியாக இருப்பதால், பட்டப்பெயரால் மாற்றாமல் ஒலிபெயர்க்கப்பட்டது.
- issue: יַרְפְּךָ மற்றும் יַעַזְבֶךָ என்ற இரு உறுதிமொழி வினைகளை வேறுபடுத்துதல்
  choice: கைவிடமாட்டார்; விட்டுவிலகவும் மாட்டார்
  alternative: உங்களைத் தளரவிடமாட்டார்; உங்களைக் கைவிடவும் மாட்டார்
  rationale: எபிரேயத்தின் இருமடங்கு உறுதியைத் தக்கவைத்து, முதல் வினையின் ‘பிடியைத் தளர்த்துதல்/ஆதரவை விடுதல்’ நிழற்பொருளையும் இரண்டாவது வினையின் ‘விட்டுச் செல்லுதல்’ பொருளையும் வேறுபடுத்துகிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; பன்மை மரியாதை/கூட்டுக் கட்டளை வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன. உரை கண்ணியமாகவும் பொதுவாசகர்களுக்குத் தெளிவாகவும் வைக்கப்பட்டுள்ளது; எபிரேய வலியுறுத்தலை ‘தாமே’ காக்கிறது.
