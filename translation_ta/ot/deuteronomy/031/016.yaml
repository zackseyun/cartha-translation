base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/016.yaml
  text: And Yahweh said to Moses[a], “Behold, you are about to lie down with your fathers. Then this people will rise up and prostitute themselves after the foreign gods of the land into whose midst they are entering[b]. They will forsake me and break my covenant that I made with them.”
translation:
  language: ta
  text: யாவே மோசேயிடம், “இதோ, நீ உன் மூதாதையரோடு படுத்துறங்கப் போகிறாய். அதன்பின் இந்த மக்கள் எழுந்து, அவர்கள் நடுவில் நுழையப்போகும் அந்த நாட்டின் அந்நியத் தெய்வங்களைப் பின்பற்றி விபசாரம் செய்வார்கள்[a]. அவர்கள் என்னைக் கைவிட்டு, நான் அவர்களோடு செய்த என் உடன்படிக்கையை மீறுவார்கள்” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரேய மூலத்தில், “அவன் அங்கே அதன் நடுவில் நுழைகிறான்,” என்றும், “அவனோடு,” என்றும் ஒருமை வடிவங்கள் உள்ளன. அவை இஸ்ரவேல் மக்களை ஒரே சமூகமாகக் குறிக்கும் கூட்டொருமைகள்; தமிழில் பொருள் தெளிவாக இருக்கப் பன்மையில் மொழிபெயர்க்கப்பட்டுள்ளது. “அந்நியத் தெய்வங்களைப் பின்பற்றி விபசாரம் செய்வார்கள்” என்பது சிலைவழிபாட்டினால் உடன்படிக்கைக்கு உண்மையற்றுப் போவதைப் பாலியல் துரோகத்தின் உருவகத்தால் கூறுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: யெகோவா
  rationale: தெய்வீகப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் பரவலாக அறியப்படும் ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: הִנְּךָ שֹׁכֵב עִם אֲבֹתֶיךָ
  choice: இதோ, நீ உன் மூதாதையரோடு படுத்துறங்கப்போகிறாய்
  rationale: மரணத்தைக் குறிக்கும் எபிரேய மொழிப்படிமத்தையும், நிகழ்வு நெருங்கியிருப்பதையும் தக்கவைக்கிறது.
- source_word: וְקָם
  choice: அதன்பின் இந்த மக்கள் எழுந்து
  rationale: மோசேயின் மரணத்துக்குப் பின்வரும் எதிர்கால நிகழ்வைச் சுட்டுகிறது; ‘கலகம் செய்வார்கள்’ என்று மிகைவிளக்கம் தரவில்லை.
- source_word: וְזָנָה אַחֲרֵי אֱלֹהֵי נֵכַר
  choice: அந்நியத் தெய்வங்களைப் பின்பற்றி வேசித்தனம் செய்வார்கள்
  rationale: சிலைவழிபாட்டை உடன்படிக்கைத் துரோகமாகக் காட்டும் கடுமையான பாலியல் உருவகத்தை மென்மைப்படுத்தாமல் தக்கவைக்கிறது.
- source_word: אֲשֶׁר הוּא בָא שָׁמָּה בְּקִרְבּוֹ
  choice: தாங்கள் செல்லும் நாட்டின் நடுவே உள்ள
  rationale: மக்களைக் குறிக்கும் எபிரேயக் கூட்டொருமையை இயல்பான தமிழ் பன்மையால் வெளிப்படுத்தி, நாட்டினுள் நுழையும் பொருளைத் தெளிவாக்குகிறது.
- source_word: וַעֲזָבַנִי
  choice: அவர்கள் என்னைக் கைவிட்டு
  rationale: உடன்படிக்கை உறவில் யெகோவாவை விட்டுவிடும் செயலை இயல்பாகவும் வலிமையாகவும் கூறுகிறது.
- source_word: וְהֵפֵר אֶת בְּרִיתִי
  choice: என் உடன்படிக்கையை மீறுவார்கள்
  rationale: உடன்படிக்கையை மீறுதல் அல்லது செல்லாததாக்குதல் என்ற வினையின் சூழல்சார் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: אֲשֶׁר כָּרַתִּי אִתּוֹ
  choice: நான் அவர்களோடு செய்த
  rationale: ‘உடன்படிக்கையை வெட்டுதல்’ என்ற எபிரேய மரபுத்தொடரை இயல்பான தமிழில் வழங்கி, கூட்டொருமைக் குறிப்பை பன்மையாகத் தெளிவாக்குகிறது.
theological_decisions:
- issue: சிலைவழிபாட்டிற்கான பாலியல் உருவகம்
  choice: ‘வேசித்தனம் செய்வார்கள்’ என்று உருவகத்தை நேரடியாகத் தக்கவைத்தல்
  alternative: ‘உண்மையற்றுப் போவார்கள்’ அல்லது ‘ஆவிக்குரிய விபசாரம் செய்வார்கள்’
  rationale: மூலத்தின் அதிர்ச்சியூட்டும் உடன்படிக்கைத் துரோக உருவகத்தைப் பாதுகாக்கிறது; அதேவேளையில் ‘ஆவிக்குரிய’ போன்ற மூலத்தில் இல்லாத விளக்கத்தைச் சேர்ப்பதில்லை.
- issue: இஸ்ரவேலைக் குறிக்கும் கூட்டொருமை
  choice: தமிழில் சூழலுக்கேற்ற பன்மை வடிவங்கள்
  alternative: ‘அவன் செல்கிறான்… அவனோடு’ என்று ஒருமையை அப்படியே வைத்தல்
  rationale: எபிரேய ஒருமை முழு மக்களையும் கூட்டாகக் குறிக்கிறது; தமிழ் பன்மை அதே குறிப்பைத் தவறான தனிநபர் வாசிப்பின்றித் தெளிவாகத் தருகிறது.
- issue: மூதாதையரோடு படுத்துறங்குதல்
  choice: மரண மொழிப்படிமத்தைத் தக்கவைத்தல்
  alternative: ‘நீ இறக்கப்போகிறாய்’ என்று நேரடியாக்குதல்
  rationale: மூலத்தின் மரணம் மற்றும் மூதாதையருடன் சேர்தல் சார்ந்த மொழித் திண்மையைப் பாதுகாக்கிறது; அதன் மேலான நிலை குறித்து கூடுதல் கோட்பாட்டைச் சேர்ப்பதில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில் கண்ணியமான, பொதுவாசகருக்குப் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. ‘இதோ’, ‘மூதாதையரோடு படுத்துறங்குதல்’, ‘வேசித்தனம்’ ஆகியவை மூலத்தின் solemn force மற்றும் உருவகத் தீவிரத்தைத் தக்கவைக்கின்றன. எல்லா அடிக்குறிப்பு அடையாளங்களும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
