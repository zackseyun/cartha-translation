  text: וַ/יְדַבֵּ֣ר מֹשֶׁ֗ה בְּ/אָזְנֵי֙ כָּל קְהַ֣ל יִשְׂרָאֵ֔ל אֶת דִּבְרֵ֥י הַ/שִּׁירָ֖ה הַ/זֹּ֑את עַ֖ד תֻּמָּֽ/ם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/030.yaml
  text: Then Moses spoke the words of this song in the hearing of all the assembly of Israel[a], until they were finished.
translation:
  language: ta
  text: பின்பு மோசே, இஸ்ரவேலின் முழுச் சபையும் கேட்கும்படியாக, இந்தப் பாடலின் வார்த்தைகளை அவை முடிவடையும் வரை உரைத்தார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவற்றை அவர் சொல்லி முடிக்கும் வரை”—அதாவது, பாடலின் வார்த்தைகளை மோசே உரைத்து முடிக்கும் வரை.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: பின்பு மோசே ... உரைத்தார்
  rationale: வாவ் தொடர்வினை கதையின் அடுத்த நிகழ்வை முன்னெடுக்கிறது. ‘பின்பு’ நிகழ்வுகளின் வரிசையை இயல்பான தமிழில் காட்டுகிறது; பாடலின் வார்த்தைகளைச் சொல்லும் இச்சூழலில் ‘உரைத்தார்’ கண்ணியமான, தெளிவான சொல்லாகும்.
- source_word: בְּאָזְנֵי
  choice: கேட்கும்படி
  rationale: எபிரெய மொழியில் சொற்பொருளாக ‘காதுகளில்’ என்றாலும், ஒருவர் கேட்குமாறு அவரிடம் உரைப்பதைக் குறிக்கும் மரபுத்தொடர் இது. ‘கேட்கும்படி’ அதன் பொருளை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: כָּל קְהַל יִשְׂרָאֵל
  choice: இஸ்ரவேலின் முழுச் சபையும்
  rationale: קהל என்பது கூடியிருக்கும் சமூகத்தையோ பேரவையையோ குறிக்கிறது. ‘சபை’ இங்கு இஸ்ரவேல் மக்களின் ஒன்றுகூடிய மொத்த சமூகத்தைக் குறிக்கிறது; ‘முழு’ כָּל என்பதன் பரப்பை வெளிப்படுத்துகிறது.
- source_word: אֶת דִּבְרֵי הַשִּׁירָה הַזֹּאת
  choice: இந்தப் பாடலின் வார்த்தைகளை
  rationale: மூலத்தில் ‘இந்தப் பாடலை’ என்று மட்டும் இல்லாமல், ‘இந்தப் பாடலின் வார்த்தைகள்’ என்று வெளிப்படையாக உள்ளது. ‘வார்த்தைகள்’ என்பதை வைத்திருப்பது மூலத்தின் வடிவத்தையும் வாய்மொழி உரைத்தலின் கவனத்தையும் காக்கிறது.
- source_word: עַד תֻּמָּם
  choice: அவை முடிவடையும் வரை
  rationale: மூன்றாம் நபர் ஆண்பால் பன்மை பின்னொட்டு இயல்பாக ‘வார்த்தைகள்’ என்பதைக் குறிக்கிறது. ‘அவை முடிவடையும் வரை’ என்பது அந்த இலக்கண வடிவத்தையும் உரைத்தல் முழுமையடைந்ததையும் காக்கிறது; செயப்படுபொருள் சார்ந்த மாற்று வாசிப்பு அடிக்குறிப்பில் தரப்பட்டுள்ளது.
