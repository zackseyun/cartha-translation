translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘சபை’ இங்கு மதப்பிரிவு சார்ந்த அமைப்பைக் குறிக்காமல், கூடியிருந்த இஸ்ரவேல் சமூகத்தைக் குறிக்கிறது. நிறைவைக் குறிக்கும் எபிரெய சொற்றொடரின் இலக்கணத் தெளிவின்மை முதன்மை உரையிலும் அடிக்குறிப்பிலும் பாதுகாக்கப்பட்டுள்ளது.
