  revised_text: ஏனெனில், அவனுடைய மூதாதையருக்கு நான் ஆணையிட்டு வாக்களித்த, பாலும் தேனும் வழிந்தோடும் நாட்டிற்குள் நான் அவனைக் கொண்டுவரும்போது, அவன் உண்டு நிறைவடைந்து கொழுத்துப்போவான்; பிற தெய்வங்களிடம் திரும்புவான்; அவர்கள் அந்தத் தெய்வங்களுக்குப் பணிசெய்து, என்னை இகழ்வார்கள்; அவனோ என் உடன்படிக்கையை முறித்துவிடுவான்.[a]
  revised_footnotes:
  - marker: a
    text: எபிரெய உரை இஸ்ரவேலை முதலில் ஒரே மக்களினமாகக் கருதி ‘அவன்’ என்று குறிப்பிடுகிறது; ‘பணிசெய்வார்கள், இகழ்வார்கள்’ என்பவற்றில் பன்மைக்கு மாறி, ‘உடன்படிக்கையை முறித்துவிடுவான்’ என்பதில் மீண்டும் ஒருமைக்குத் திரும்புகிறது.
    reason: மூலமொழியின் ஒருமை–பன்மை மாறுபாட்டை விளக்குதல்
  revision_rationale: ‘நான் ஆணையிட்டுக் கொடுத்த’ என்பதற்குப் பதிலாக ‘நான் ஆணையிட்டு வாக்களித்த’ என மாற்றி, நִשְׁבַּעְתִּי-யின் சத்திய/உறுதிமொழிப் பொருளை மீட்டெடுக்கப்பட்டது. ‘முன்னோர்கள்’ என்பதற்குப் பதிலாக ‘மூதாதையர்’ பயன்படுத்தப்பட்டுள்ளது. எபிரெயத்தின் ஒருமை–பன்மை–ஒருமை இலக்கண மாற்றமும், பிற தெய்வங்களை நோக்கித் திரும்புதல், அவற்றுக்குப் பணிசெய்தல், யெகோவாவை இகழ்தல், உடன்படிக்கையை முறித்தல் ஆகிய வினைத் தொடரும் பாதுகாக்கப்பட்டுள்ளன.
