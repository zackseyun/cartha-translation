    rationale: ‘ஆணையிட்டுக் கொடுத்த’ என்பது ‘நான் சத்தியம் செய்தேன்/ஆணையிட்டு வாக்களித்தேன்’ என்ற நிஷ்பஅதி வினையை ‘கட்டளையிட்டு அளித்தேன்’ என மாற்றுகிறது. எபிரெயத்தில் நிலத்தை வழங்கினேன் என்று இவ்விடத்தில் சொல்லப்படவில்லை; மூதாதையருக்குச் சத்தியம் செய்தேன் என்பதே சொல்லப்பட்டுள்ளது.
