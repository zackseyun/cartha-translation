  source_fidelity: திருத்தம் தேவை. נִשְׁבַּעְתִּי என்பது ‘நான் ஆணையிட்டு வாக்களித்தேன்/சத்தியம் செய்தேன்’; வரைவில் உள்ள ‘ஆணையிட்டுக் கொடுத்த’ என்பது சத்தியம் செய்தல் என்ற வினைப் பொருளையும், வாக்குறுதியின் தன்மையையும் சரியாகக் காட்டவில்லை. மற்றபடி எபிரெயத்தின் கூட்டு ஒருமை → பன்மை → ஒருமை மாற்றம் சரியாகக் காக்கப்பட்டுள்ளது.
  naturalness: ‘அவனுடைய முன்னோர்களுக்கு நான் ஆணையிட்டுக் கொடுத்த நாடு’ நவீன தமிழில் இயல்பற்றதோடு பொருளிலும் தவறானது. ‘அவனுடைய மூதாதையருக்கு நான் ஆணையிட்டு வாக்களித்த நாடு’ என்பது இயல்பாகவும் துல்லியமாகவும் உள்ளது. தொடர்ச்சியான எதிர்கால நிகழ்வுகளை நிறுத்தற்குறிகளால் துண்டிக்காமல் இணைப்பது வாசிப்பை மேம்படுத்தும்.
  terminology: ‘பாலும் தேனும் வழிந்தோடும்,’ ‘பிற தெய்வங்கள்,’ ‘பணிசெய்,’ ‘இகழ்,’ மற்றும் ‘உடன்படிக்கையை முறி’ ஆகியவை மூலத்தின் பொருளுக்கும் மரியாதையான நவீன நிலையான தமிழ் நடைக்கும் ஏற்றவை. ‘மூதாதையர்’ இங்கே ஆங்கில audit trail-இன் ‘fathers’ என்பதற்கும் எபிரெய אֲבֹתָיו என்பதற்கும் பொருத்தமான, இயல்பான தெரிவாகும்.
  issues:
