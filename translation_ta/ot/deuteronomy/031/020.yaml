  text: כִּֽי אֲבִיאֶ֜/נּוּ אֶֽל הָ/אֲדָמָ֣ה אֲשֶׁר נִשְׁבַּ֣עְתִּי לַ/אֲבֹתָ֗י/ו זָבַ֤ת חָלָב֙ וּ/דְבַ֔שׁ וְ/אָכַ֥ל וְ/שָׂבַ֖ע וְ/דָשֵׁ֑ן וּ/פָנָ֞ה אֶל אֱלֹהִ֤ים אֲחֵרִים֙ וַ/עֲבָד֔וּ/ם וְ/נִ֣אֲצ֔וּ/נִי וְ/הֵפֵ֖ר אֶת בְּרִיתִֽ/י־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/020.yaml
  text: For when I bring him into the land that I swore to his fathers[a], a land flowing with milk and honey, and he eats and is satisfied and grows fat, then he will turn to other gods and serve them[b], and spurn me and break my covenant.
translation:
  language: ta
  text: ஏனெனில், அவனுடைய மூதாதையருக்கு நான் ஆணையிட்டு வாக்களித்த, பாலும் தேனும் வழிந்தோடும் நாட்டிற்குள் நான் அவனைக் கொண்டுவரும்போது, அவன் உண்டு நிறைவடைந்து கொழுத்துப்போவான்; பிற தெய்வங்களிடம் திரும்புவான்; அவர்கள் அந்தத் தெய்வங்களுக்குப் பணிசெய்து, என்னை இகழ்வார்கள்; அவனோ என் உடன்படிக்கையை முறித்துவிடுவான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய உரை இஸ்ரவேலை முதலில் ஒரே மக்களினமாகக் கருதி ‘அவன்’ என்று குறிப்பிடுகிறது; ‘பணிசெய்வார்கள், இகழ்வார்கள்’ என்பவற்றில் பன்மைக்கு மாறி, ‘உடன்படிக்கையை முறித்துவிடுவான்’ என்பதில் மீண்டும் ஒருமைக்குத் திரும்புகிறது.
    reason: மூலமொழியின் ஒருமை–பன்மை மாறுபாட்டை விளக்குதல்
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில், ... கொண்டுவரும்போது
  rationale: இந்தச் சொல் முந்தைய எச்சரிக்கைக்கான காரணத்தையும், தொடர்ந்து வரும் நிகழ்வின் காலச் சூழலையும் தருகிறது. தமிழில் காரணத்தையும் காலத்தையும் இயல்பாக வெளிப்படுத்த இவ்வமைப்பு பயன்படுத்தப்பட்டது.
- source_word: אֲבִיאֶנּוּ
  choice: நான் அவனைக் கொண்டுவரும்போது
  rationale: வினை முதலாம் நபர் ஒருமையையும், செயப்படுபொருள் ஆண்பால் ஒருமையையும் காட்டுகிறது. இங்கு ‘அவன்’ என்பது இஸ்ரவேலை ஒரே மக்களினமாகக் குறிப்பிடும் கூட்டு ஒருமை.
- source_word: הָאֲדָמָה
  choice: நாடு
  rationale: இச்சூழலில் இது வெறும் மண்ணையோ நிலப்பரப்பையோ அல்ல, வாக்குறுதி அளிக்கப்பட்ட நாட்டைக் குறிக்கிறது.
- source_word: נִשְׁבַּעְתִּי לַאֲבֹתָיו
  choice: அவனுடைய முன்னோர்களுக்கு நான் ஆணையிட்டுக் கொடுத்த
  rationale: ஆணையிடுதல் என்ற எபிரெயச் செயலைக் காத்து, கூட்டு ஒருமையான இஸ்ரவேலோடு தொடர்புடைய ‘அவனுடைய’ என்ற ஒருமைச் சுட்டையும் தக்கவைக்கிறது. ‘முன்னோர்கள்’ என்பது நவீன தமிழில் இயல்பாகவும் மரியாதையாகவும் உள்ளது.
- source_word: זָבַת חָלָב וּדְבַשׁ
  choice: பாலும் தேனும் வழிந்தோடும்
  rationale: நாட்டின் வளமையைச் சித்தரிக்கும் மூலமொழியின் தெளிவான உருவகத்தைப் பாதுகாக்கிறது.
- source_word: וְאָכַל וְשָׂבַע וְדָשֵׁן
  choice: அவன் உண்டு நிறைவடைந்து கொழுத்துப்போவான்
  rationale: உணவு, நிறைவு, கொழுமை என்ற மூன்று படிநிலைகளையும் தக்கவைக்கிறது; வளமை மனநிறைவின்மையல்ல, தன்னிறைவு மற்றும் விசுவாசமின்மைக்கு வழிவகுக்கும் என்ற வசனத்தின் கூர்மையான உருவகமும் காக்கப்படுகிறது.
- source_word: וּפָנָה אֶל אֱלֹהִים אֲחֵרִים
  choice: பிற தெய்வங்களிடம் திரும்புவான்
  rationale: வேறு வழிபாட்டை நோக்கித் திரும்பும் உடன்படிக்கைத் துரோகத்தை, ‘விக்கிரகாராதனை செய்வான்’ போன்ற விளக்கச் சொல்லைச் சேர்க்காமல் மூலத்திற்கு நெருக்கமாகச் சொல்கிறது.
- source_word: וַעֲבָדוּם
  choice: அவர்கள் அந்தத் தெய்வங்களுக்குப் பணிசெய்து
  rationale: עבד என்பதன் சேவை/வழிபாடு சார்ந்த உடன்படிக்கைப் பொருளை ‘பணிசெய்து’ காக்கிறது. எபிரெய வினை இங்கு பன்மையாக இருப்பதால் ‘அவர்கள்’ என்று வெளிப்படையாகக் கொடுக்கப்பட்டது; ‘அந்தத் தெய்வங்களுக்கு’ என்பது பன்மைப் பொருளையும் தெளிவுபடுத்துகிறது.
- source_word: וְנִאֲצוּנִי
  choice: என்னை இகழ்வார்கள்
  rationale: இந்த வினை அலட்சியப்படுத்துதல் அல்லது வெறுமனே நிராகரித்தல் என்பதைக் காட்டிலும், அவமதிப்புடனும் இகழ்ச்சியுடனும் நடத்துவதை வலியுறுத்துகிறது. பன்மை வினையும் பாதுகாக்கப்பட்டது.
- source_word: וְהֵפֵר אֶת בְּרִיתִי
  choice: அவனோ என் உடன்படிக்கையை முறித்துவிடுவான்
  rationale: הפר என்பதன் உடைத்தல்/செல்லாமலாக்குதல் சார்ந்த வலிமையை ‘முறித்துவிடுவான்’ வெளிப்படுத்துகிறது. எபிரெயம் இறுதியில் மீண்டும் ஒருமைக்கு மாறுவதால் ‘அவனோ’ என்று அந்த மாற்றம் தெளிவாக்கப்பட்டது.
theological_decisions:
- issue: இஸ்ரவேலைக் குறிக்கும் ஒருமை–பன்மை மாறுபாடுகள்
  choice: ‘அவன்’ என்ற கூட்டு ஒருமையைத் தொடர்ந்து, பணிசெய்தல் மற்றும் இகழ்தல் ஆகியவற்றில் ‘அவர்கள்’ என்ற பன்மையையும், உடன்படிக்கையை முறித்தலில் மீண்டும் ‘அவன்’ என்ற ஒருமையையும் தக்கவைத்தல்.
  alternative: எல்லாச் சுட்டுகளையும் ‘அவர்கள்’ என்ற பன்மையாகவோ அல்லது ‘அவன்’ என்ற ஒருமையாகவோ ஒரே மாதிரியாக்குதல்.
  rationale: எபிரெய உரை இஸ்ரவேலை ஒரே மக்களினமாகவும் அந்த மக்களிலுள்ள பல நபர்களாகவும் மாறிமாறிக் காட்டுகிறது. இந்த இலக்கணப் பதற்றத்தைச் சீராக்காமல் பாதுகாப்பது மூலத்தின் வடிவத்தையும் பொருளையும் மதிக்கிறது.
- issue: பிற தெய்வங்களைச் சார்ந்த உடன்படிக்கைத் துரோக மொழி
  choice: ‘பிற தெய்வங்களிடம் திரும்புவான்’ என்றும் ‘அந்தத் தெய்வங்களுக்குப் பணிசெய்து’ என்றும் செயல்களை நேரடியாக மொழிபெயர்த்தல்.
  alternative: ‘விக்கிரகாராதனை செய்வான்’ அல்லது ‘விசுவாசத்தை விட்டு விலகுவான்’ என்று விளக்கப் பெயரிடுதல்.
  rationale: அத்தகைய இறையியல் பெயர்கள் கருத்தளவில் பொருந்தினாலும், மூலவசனம் தானே கூறும் செயல்களைத் தாண்டி விளக்கத்தை உரைக்குள் சேர்க்காமல் இருப்பது சிறந்தது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் மரியாதையான நடையில் வடிவமைக்கப்பட்டது. ‘பாலும் தேனும் வழிந்தோடும்’ என்ற பரிச்சயமான வளமை உருவகம் காக்கப்பட்டுள்ளது. மூல எபிரெயத்தின் திடீர் ஒருமை–பன்மை–ஒருமை மாற்றம் தமிழிலும் திட்டமிட்டு வெளிப்படுத்தப்பட்டுள்ளது.
