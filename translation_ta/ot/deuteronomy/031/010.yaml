translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையும் கண்ணியமும் காக்கப்பட்டுள்ளன. வசனம் அடுத்த வசனத்தில் தொடரும் மேற்கோளின் தொடக்கம் என்பதால் இறுதியில் காற்புள்ளியும் திறந்த மேற்கோள் அமைப்பும் வைக்கப்பட்டுள்ளன. மூலத்திலுள்ள மீள்நிகழ்வு சார்ந்த நுணுக்கமும் ‘விடுவிப்பு’ என்ற சொல்லின் சட்ட-சமூகத் தன்மையும் அடிக்குறிப்புகள் மூலம் காக்கப்பட்டுள்ளன.
