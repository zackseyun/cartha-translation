base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/010.yaml
  text: And Moses commanded them[a], saying, “At the end of every seven years, at the appointed time of the year of release[c][b], at the Feast of Booths,”
translation:
  language: ta
  text: 'மோசே அவர்களுக்குக் கட்டளையிட்டு, சொன்னார்: “ஒவ்வோர் ஏழு ஆண்டுகளின் முடிவில்[a], விடுவிப்பு ஆண்டின் நியமிக்கப்பட்ட காலத்தில்[b], குடில் பண்டிகையின்போது[c],”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஏழு ஆண்டுகளின் முடிவில்.” எபிரெயச் சொற்றொடரை இவ்வாறு சொற்சார்பாக மொழிபெயர்க்கலாம்; ஆனால் மீண்டும் மீண்டும் வரும் ஏழாண்டுச் சுழற்சியைச் சூழல் சுட்டுவதால் உரையில் “ஒவ்வோர்” என்று தரப்பட்டுள்ளது.
    reason: lexical_alternative
  - marker: b
    text: “விடுவிப்பு ஆண்டு” என்பது ஏழாம் ஆண்டோடு தொடர்புடைய விடுவித்தல் அல்லது தீர்வு அளித்தலைக் குறிக்கும் எபிரெயச் சொல்லின் மொழிபெயர்ப்பு; மரபாக, “ஓய்வு ஆண்டு” என்றும் அழைக்கப்படுகிறது.
    reason: lexical_alternative
  - marker: c
    text: மரபாக, “கூடாரப் பண்டிகை.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו
  choice: கட்டளையிட்டுச் சொன்னார்
  rationale: צוה என்பதன் கட்டளைத் தன்மையை ‘கட்டளையிட்டார்’ காக்கிறது; לֵאמֹר உடன் வரும் மேற்கோள் அறிமுகத்தை இயல்பான தமிழில் ‘சொன்னார்’ வெளிப்படுத்துகிறது.
- source_word: אוֹתָם
  choice: அவர்களுக்கு
  rationale: ஆண்பால் பன்மை நேர்செயப்படுபொருளான ‘அவர்களை’ தமிழில் ‘கட்டளையிடு’ என்ற வினையுடன் இயல்பாக நான்காம் வேற்றுமையில் ‘அவர்களுக்கு’ என்று வழங்கப்பட்டுள்ளது; யாரைக் குறிக்கிறது என்பது சுற்றுப்பகுதியிலிருந்து தெரிகிறது.
- source_word: מִקֵּץ שֶׁבַע שָׁנִים
  choice: ஒவ்வொரு ஏழு ஆண்டுகளின் முடிவிலும்
  rationale: מִקֵּץ என்பது ‘முடிவில்’ எனப் பொருள்படும். சட்டப்பூர்வமான மீள்நிகழும் ஏழாண்டுச் சுழற்சியை ‘ஒவ்வொரு’ தெளிவாகவும் இயல்பாகவும் காட்டுகிறது; எபிரெயின் முறையான வாசிப்பு அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: בְּמוֹעֵד
  choice: குறிக்கப்பட்ட காலத்தில்
  rationale: מוֹעֵד என்பது நிர்ணயிக்கப்பட்ட அல்லது குறிக்கப்பட்ட காலத்தைக் குறிக்கிறது; பண்டிகைச் சூழலையும் இச்சொல் காக்கிறது.
- source_word: שְׁנַת הַשְּׁמִטָּה
  choice: விடுவிப்பு ஆண்டு
  rationale: שְׁמִטָּה ஏழாம் ஆண்டில் நிகழும் விடுவித்தல் அல்லது கடன் நீக்கத்தைக் குறிக்கிறது. ‘விடுவிப்பு ஆண்டு’ அதன் அடிப்படைப் பொருளை சமய மரபுச் சொல்லால் முன்கூட்டியே விளக்காமல் நேரடியாக வழங்குகிறது.
- source_word: בְּחַג הַסֻּכּוֹת
  choice: குடில் பண்டிகையின்போது
  rationale: חַג என்பது பண்டிகை; סֻכּוֹת என்பது தற்காலிகக் குடில்கள். ‘குடில் பண்டிகை’ எபிரெய உருவகத்தை நவீனத் தமிழில் தெளிவாகக் காக்கிறது.
