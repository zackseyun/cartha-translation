  yaml_path: translation/ot/deuteronomy/031/022.yaml
  text: So Moses wrote this song on that day and taught it to the sons of Israel[a].
translation:
  language: ta
  text: அந்த நாளில் மோசே இந்தப் பாடலை எழுதி, அதை இஸ்ரவேலின் மகன்களுக்குக்[a] கற்றுக்கொடுத்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘இஸ்ரவேல் மக்களுக்கு,’ ‘இஸ்ரவேலருக்கு,’ அல்லது ‘இஸ்ரவேலின் பிள்ளைகளுக்கு.’ எபிரெயில் ‘இஸ்ரவேலின் மகன்கள்’ என்று உள்ளது; இது இஸ்ரவேல் மக்களைக் குறிக்கும் வழக்கமான உடன்படிக்கைச் சொல்லாட்சி.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּכְתֹּב
  choice: எழுதி
  rationale: כתב என்பதன் Qal தொடர்வினை வடிவம் நேரடியாக ‘எழுதினார்’ என்று பொருள்படும். அடுத்த வினையோடு இயல்பாக இணைப்பதற்காகத் தமிழில் ‘எழுதி’ என வழங்கப்பட்டுள்ளது.
- source_word: הַשִּׁירָה הַזֹּאת
  choice: இந்தப் பாடலை
  rationale: שִׁירָה என்பது இங்கு உடன்படிக்கைச் சூழலில் அமைந்த பாடலைக் குறிக்கிறது; சுற்றியுள்ள பகுதியின் இலக்கிய வகைப்பாட்டை ‘பாடல்’ தக்கவைக்கிறது.
- source_word: בַּיּוֹם הַהוּא
  choice: அந்த நாளில்
  rationale: காலத்தைக் குறிக்கும் எபிரெய வழக்கை இயல்பான நவீனத் தமிழில் தருகிறது; ‘அதே நாளிலேயே’ என்று வலியுறுத்தி மூலத்தில் இல்லாத நுணுக்கத்தைச் சேர்ப்பதைத் தவிர்க்கிறது.
- source_word: וַיְלַמְּדָהּ
  choice: அதைக் கற்றுக்கொடுத்தார்
  rationale: למד என்பதன் Piel வடிவம் ‘கற்பித்தார்’ எனப் பொருள்படும்; பெண்பால் ஒருமை பின்னொட்டு முன்வரும் ‘பாடலை’ச் சுட்டுவதால் ‘அதை’ வெளிப்படையாக வைக்கப்பட்டுள்ளது.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் மகன்களுக்கு
  rationale: எபிரெயில் உள்ள ‘இஸ்ரவேலின் மகன்கள்’ என்ற ஆண்பால் பன்மை உடன்படிக்கைச் சொல்லாட்சியைத் தக்கவைக்கிறது. தமிழில் இது முழு இஸ்ரவேல் மக்களையும் கூட்டாகக் குறிக்கும் என்பதை அடிக்குறிப்பு தெளிவுபடுத்துகிறது.
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל என்ற பாலினக் குறியீடுள்ள கூட்டுப்பெயர்
  choice: இஸ்ரவேலின் மகன்கள்
  alternative: இஸ்ரவேல் மக்கள் / இஸ்ரவேலர் / இஸ்ரவேலின் பிள்ளைகள்
  rationale: மூலத்தின் ஆண்பால் பன்மை வடிவத்தையும் அதன் உடன்படிக்கைச் சொல்லாட்சியையும் முதன்மை உரையில் தக்கவைத்துள்ளோம்; அதேவேளை இது யாக்கோபின் உடனடிப் புதல்வர்களை மட்டும் அல்ல, இஸ்ரவேல் சமூகத்தைக் கூட்டாகக் குறிக்கிறது என்பதை அடிக்குறிப்பில் தெரிவிக்கிறோம்.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையும் கண்ணியமும் பேணப்பட்டுள்ளன. ‘அந்த நாளில்’ என்பது காலச்சுட்டை மிகைப்படுத்தாமல் தருகிறது. ‘இஸ்ரவேலின் மகன்கள்’ என்ற சற்றே முறையான சொல்லாட்சி மூல வடிவத்தைப் பாதுகாக்கிறது; அதன் கூட்டுப்பொருள் அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது.
