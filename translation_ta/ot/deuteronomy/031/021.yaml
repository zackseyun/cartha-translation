base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/021.yaml
  text: And when many evils and troubles come upon him[a], this song will answer before him as a witness, for it will not be forgotten from the mouth of his offspring; for I know his inclination, what he is doing today[d][c][b], before I bring him into the land that I swore to give.
translation:
  language: ta
  text: பல கேடுகளும் துன்பங்களும் அவனை வந்தடையும்போது[a], இந்தப் பாடல் அவன் முன்னிலையில்[b] ஒரு சாட்சியாகப் பதிலளிக்கும். ஏனெனில், அவனுடைய சந்ததியினரின் வாயிலிருந்து அது மறைந்துபோகாது. நான் அவனை ஆணையிட்டு உறுதியளித்த நாட்டிற்குள் அழைத்துச் செல்வதற்கு முன்பே, இன்று அவன் கொண்டிருக்கும் மனச்சாய்வை[c] அறிவேன்.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அவனைக் கண்டடையும்போது” அல்லது “அவனைப் பிடித்துக்கொள்ளும்போது” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “அவன் முன்னிலையில்” என்பது இங்கு பாடல் சாட்சியாகச் செயல்படுவதால், வலுவான பொருளில் “அவனுக்கு எதிராக” என்றும் புரிந்துகொள்ளப்படலாம்.
    reason: lexical_alternative
  - marker: c
    text: எபிரெயத்தில் “அவனுடைய மனச்சாய்வு”; இது அவனுடைய உள்ளார்ந்த நோக்கு, எண்ணப்போக்கு அல்லது உந்துதலைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: d
    text: எபிரெயத்தில் சொற்பட “நான் ஆணையிட்டு உறுதியளித்த [நாடு]” என்றே உள்ளது; எதைக் குறித்து உறுதியளித்தார் என்பது இவ்வசனத்தில் வெளிப்படையாகக் கூறப்படவில்லை. “கொடுப்பதாக” என்பது உடன்படிக்கைச் சூழலிலிருந்து புரிந்துகொள்ளப்படுகிறது.
    reason: textual_clarity
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: …வந்தடையும்போது
  rationale: எதிர்காலத்தில் நிகழவிருக்கும் சூழலை இயல்பான நவீனத் தமிழில் அறிமுகப்படுத்துகிறது.
- source_word: תִמְצֶאןָ אֹתוֹ
  choice: அவனை வந்தடையும்போது
  rationale: מצא என்பதன் ‘கண்டடைகின்றன/பிடித்துக்கொள்கின்றன’ என்ற உருவகத்தை, தீங்கான நிகழ்வுகள் ஒருவரைச் சென்றடைவதாக இயல்பாக வெளிப்படுத்துகிறது.
- source_word: רָעוֹת רַבּוֹת וְצָרוֹת
  choice: பல கேடுகளும் துன்பங்களும்
  rationale: רָעוֹת இங்கு ஒழுக்கத் தீமையைவிட தீங்கு, பேரிடர் போன்ற நிகழ்வுகளைக் குறிக்கிறது; צָרוֹת நெருக்கங்களையும் துன்பங்களையும் குறிக்கிறது.
- source_word: וְעָנְתָה
  choice: பதிலளிக்கும்
  rationale: ענה என்பதன் அடிப்படைப் பொருளான ‘பதிலளித்தல்’ என்ற பாடல்-உருவகத்தைப் பாதுகாக்கிறது; அதன் சாட்சிப் பணி அடுத்த சொற்றொடரில் தெளிவாகிறது.
- source_word: לְפָנָיו לְעֵד
  choice: அவன் முன்னிலையில் ஒரு சாட்சியாக
  rationale: לְפָנָיו என்பதன் நேரடிப் பொருளான ‘அவன் முன்/முன்னிலையில்’ என்பதையும் לְעֵד என்பதன் சாட்சிப் பணியையும் காக்கிறது.
- source_word: לֹא תִשָּׁכַח מִפִּי זַרְעוֹ
  choice: அவனுடைய சந்ததியினரின் வாயிலிருந்து அது மறைந்துபோகாது
  rationale: பாடல் தலைமுறைதோறும் வாய்மொழியாக நிலைப்பதைத் தமிழில் இயல்பாகச் சொல்கிறது; זֶרַע என்பதன் கூட்டு ஒருமைப் பொருளை ‘சந்ததியினர்’ வெளிப்படுத்துகிறது.
- source_word: יִצְרוֹ אֲשֶׁר הוּא עֹשֶׂה הַיּוֹם
  choice: இன்று அவன் செயல்படுத்திக்கொண்டிருக்கும் மனச்சாய்வை
  rationale: יֵצֶר என்பதன் உள்ளார்ந்த நோக்கு/சாய்வையும் עֹשֶׂה என்பதன் நிகழ்காலச் செயல்பாட்டையும் இணைத்துப் பாதுகாக்கிறது; பின்னாளைய தொழில்நுட்ப இறையியல் பொருளைத் திணிக்கவில்லை.
- source_word: אֲשֶׁר נִשְׁבָּעְתִּי
  choice: நான் ஆணையிட்ட
  rationale: எபிரெய மூலத்தின் சுருக்கமான உடன்படிக்கை மொழியைச் சேர்க்கையின்றி வைத்திருக்கிறது; எதைச் செய்வதாக ஆணையிட்டார் என்பது சூழலில் விளங்குகிறது.
theological_decisions:
- issue: 'יִצְרוֹ: இறைவன் அறிந்திருக்கும் இஸ்ரவேலின் உள்ளார்ந்த நிலை'
  choice: மனச்சாய்வு
  alternative: எண்ணம் / நோக்கம் / கற்பனை
  rationale: ‘மனச்சாய்வு’ என்பது உள்ளார்ந்த ஒழுக்க-விருப்ப நோக்கை வெளிப்படுத்துகிறது; மனிதப் பொறுப்புக்கும் இறை முன்அறிவுக்கும் இடையிலான பதற்றத்தைத் தீர்மானமாக விளக்காமல் அப்படியே வைக்கிறது.
- issue: לְפָנָיו என்பதன் சாட்சிசார் வலிமை
  choice: அவன் முன்னிலையில்
  alternative: அவனுக்கு எதிராக
  rationale: மூலத்தின் வெளிப்படையான இடவியல் சொல்லை முதன்மை உரையில் காக்கிறது; பாடல் எதிர்சாட்சியாகச் செயல்படலாம் என்பதைக் குறிப்பில் தெரிவிக்கிறது.
- issue: אֲשֶׁר נִשְׁבָּעְתִּי என்பதிலுள்ள விடுபட்ட நிறைவு
  choice: நான் ஆணையிட்ட நாடு
  alternative: கொடுப்பதாக நான் ஆணையிட்ட நாடு
  rationale: ‘கொடுப்பதாக’ என்பது உடன்படிக்கைச் சூழலில் நியாயமான நிறைவாக இருந்தாலும் இவ்வசனத்தின் எபிரெய உரையில் வெளிப்படையாக இல்லை; ஆகவே முதன்மை உரையில் சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. இஸ்ரவேலைக் குறிக்கும் எபிரெய ஆண்பால் ஒருமை தொடர்ச்சியாக ‘அவன்’ என வைக்கப்பட்டுள்ளது. ‘பதிலளிக்கும்’, ‘முன்னிலையில்’, ‘வாயிலிருந்து’ ஆகிய உருவகங்கள் மூலத்தின் சாட்சிப் பாடல் மற்றும் வாய்மொழி நினைவுப் படிமங்களைப் பாதுகாக்கின்றன.
