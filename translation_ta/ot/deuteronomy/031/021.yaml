revisions:
- from: பல கேடுகளும் துன்பங்களும் அவனை வந்தடையும்போது[a], இந்தப் பாடல் அவன் முன்னிலையில்[b] ஒரு சாட்சியாகப் பதிலளிக்கும். ஏனெனில், அவனுடைய சந்ததியினரின் வாயிலிருந்து அது மறைந்துபோகாது. இன்று அவன் செயல்படுத்திக்கொண்டிருக்கும் மனச்சாய்வை[c] நான் அறிவேன்; நான் ஆணையிட்ட நாட்டுக்குள்[d] அவனை அழைத்துச் செல்வதற்கு முன்பே அதை அறிவேன்.
  to: பல கேடுகளும் துன்பங்களும் அவனை வந்தடையும்போது[a], இந்தப் பாடல் அவன் முன்னிலையில்[b] ஒரு சாட்சியாகப் பதிலளிக்கும். ஏனெனில், அவனுடைய சந்ததியினரின் வாயிலிருந்து அது மறைந்துபோகாது. நான் அவனை ஆணையிட்டு உறுதியளித்த நாட்டிற்குள் அழைத்துச் செல்வதற்கு முன்பே, இன்று அவன் கொண்டிருக்கும் மனச்சாய்வை[c] அறிவேன்.[d]
  rationale: The revision corrects the oath verb, preserves the Hebrew's unexpressed complement through a natural Tamil oath formula, and rewrites the final sentence so that God's knowledge of Israel's present inclination precedes entry into the land. It retains the song's answering/witness imagery and all footnote anchors.
