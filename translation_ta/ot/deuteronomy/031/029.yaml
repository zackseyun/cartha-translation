  text: כִּ֣י יָדַ֗עְתִּי אַחֲרֵ֤י מוֹתִ/י֙ כִּֽי הַשְׁחֵ֣ת תַּשְׁחִת֔וּ/ן וְ/סַרְתֶּ֣ם מִן הַ/דֶּ֔רֶךְ אֲשֶׁ֥ר צִוִּ֖יתִי אֶתְ/כֶ֑ם וְ/קָרָ֨את אֶתְ/כֶ֤ם הָֽ/רָעָה֙ בְּ/אַחֲרִ֣ית הַ/יָּמִ֔ים כִּֽי תַעֲשׂ֤וּ אֶת הָ/רַע֙ בְּ/עֵינֵ֣י יְהוָ֔ה לְ/הַכְעִיס֖/וֹ בְּ/מַעֲשֵׂ֥ה יְדֵי/כֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/029.yaml
  text: For I know that after my death you will surely act corruptly and turn aside from the way that I commanded you[a], and evil will befall you in the latter days, because you will do what is evil in the eyes of Yahweh[c][b], provoking him to anger by the work of your hands.
translation:
  language: ta
  text: ஏனெனில், நான் இறந்தபின் நீங்கள் நிச்சயமாகச் சீர்கெட்டு[a], நான் உங்களுக்குக் கட்டளையிட்ட வழியைவிட்டு விலகுவீர்கள் என்பதை அறிவேன். வருங்கால நாட்களில்[c] தீங்கு உங்களை வந்தடையும்[b]. ஏனெனில், யாவேவின் பார்வையில் தீமையானதை நீங்கள் செய்து, உங்கள் கைகளால் செய்தவற்றினால் அவருக்குக் கோபமூட்டுவீர்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “நீங்கள் நிச்சயமாக உங்களையே சீரழித்துக்கொள்வீர்கள்” அல்லது “முற்றிலும் சீர்கெட்டுப்போவீர்கள்” என்றும் மொழிபெயர்க்கலாம். எபிரெயத்தில் வினை தீவிரப்படுத்தப்பட்டுள்ளது; இங்கு அது தற்சுட்டுப் பொருளிலோ செயப்படுபொருளற்ற பொருளிலோ புரிந்துகொள்ளப்படலாம்.
    reason: lexical_alternative
  - marker: b
    text: “தீமை” அல்லது “பேரிடர்” என்றும் மொழிபெயர்க்கலாம். எபிரெய רָעָה என்ற சொல் ஒழுக்கத் தீமையையும் தீங்கான துயரத்தையும் குறிக்கக்கூடும்.
    reason: lexical_alternative
  - marker: c
    text: “கடைசி நாட்களில்” என்றும் மொழிபெயர்க்கலாம். இச்சொற்றொடர் எதிர்காலத்தை நோக்குகிறது; சூழலைப் பொறுத்து இறுதிக்கால நுண்ணுணர்வையும் கொண்டிருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי יָדַעְתִּי
  choice: என்பதை அறிவேன்
  rationale: முந்தைய உரைக்கான காரணத்தை அறிமுகப்படுத்தும் כִּי-யையும், மோசேயின் உறுதியான அறிவைக் குறிக்கும் יָדַעְתִּי-யையும் இயல்பான தமிழ் வாக்கிய அமைப்பில் தருகிறது.
- source_word: אַחֲרֵי מוֹתִי
  choice: நான் இறந்தபின்
  rationale: ‘என் மரணத்திற்குப் பின்’ என்பதைக் காட்டிலும் பொதுவாசகருக்கு இயல்பாகவும், மூலத்தின் காலப் பொருளைத் துல்லியமாகவும் தருகிறது.
- source_word: הַשְׁחֵת תַּשְׁחִתוּן
  choice: நிச்சயமாகச் சீர்கெட்டு
  rationale: வினையெச்ச முழுவடிவமும் வினையும் சேர்ந்த எபிரெய தீவிரப்படுத்தலை ‘நிச்சயமாக’ எனக் காட்டுகிறது; செயப்படுபொருள் இல்லாததால் தங்களைச் சீரழித்துக்கொள்வது அல்லது சீர்கெடுவது என்ற சாத்தியங்களைத் திறந்தே வைக்கிறது.
- source_word: וְסַרְתֶּם מִן־הַדֶּרֶךְ
  choice: வழியைவிட்டு விலகுவீர்கள்
  rationale: கட்டளையிடப்பட்ட வாழ்க்கைநெறியிலிருந்து விலகுவதைக் குறிக்கும் உடன்படிக்கைச் சொற்றொடரை இயல்பான தமிழில் பாதுகாக்கிறது.
- source_word: וְקָרָאת אֶתְכֶם הָרָעָה
  choice: தீங்கு உங்களை வந்தடையும்
  rationale: קרא என்பதன் ‘ஒருவருக்கு நேரிடுதல்/வந்தடைதல்’ என்ற பொருளையும், רָעָה என்பதன் தீமை–பேரிடர் பொருள் பரப்பையும் சூழலுக்கு ஏற்றவாறு தருகிறது.
- source_word: בְּאַחֲרִית הַיָּמִים
  choice: வருங்கால நாட்களில்
  rationale: எதிர்காலத்தை நோக்கும் பொருளைத் தெளிவாகத் தருகிறது; இதை ஒரு குறிப்பிட்ட இறுதிக்காலக் கோட்பாட்டுக்குள் கட்டுப்படுத்தவில்லை.
- source_word: כִּי תַעֲשׂוּ אֶת־הָרַע
  choice: ஏனெனில் ... தீமையானதை நீங்கள் செய்து
  rationale: כִּי-யின் காரணப் பொருளையும், யாவேவின் மதிப்பீட்டில் தீமையான செயலைச் செய்வதையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: בְּעֵינֵי יְהוָה
  choice: யாவேவின் பார்வையில்
  rationale: ‘கண்களில்’ என்ற நேரடி உருவகத்தை இயல்பான தமிழ் மதிப்பீட்டுச் சொற்றொடரான ‘பார்வையில்’ என வழங்கி, தெய்வீகப் பெயரை ஒலிபெயர்க்கிறது.
- source_word: לְהַכְעִיסוֹ
  choice: அவருக்குக் கோபமூட்டுவீர்கள்
  rationale: Hiphil காரணவினையின் பொருளை நேரடியாகத் தருகிறது; மனிதச் செயல்கள் யாவேவின் கோபத்தைத் தூண்டும் உறவுநிலைத் தீவிரத்தையும் காக்கிறது.
- source_word: בְּמַעֲשֵׂה יְדֵיכֶם
  choice: உங்கள் கைகளால் செய்தவற்றினால்
  rationale: ‘உங்கள் கைகளின் செயல்’ என்ற எபிரெய உருவகத்தை இயல்பான தமிழில் காத்து, மனிதர்கள் உருவாக்கிய அல்லது செய்த காரியங்களைக் குறிக்கும் பரப்பைத் திறந்தே வைக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரின் மொழியாக்கம்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் வரும் தனிப்பட்ட உடன்படிக்கைப் பெயரை ஒரு பட்டத்தால் மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
- issue: בְּאַחֲרִית הַיָּמִים என்பதன் காலப் பொருள்
  choice: வருங்கால நாட்களில்
  alternative: கடைசி நாட்களில்
  rationale: இச்சூழலில் உள்ள எதிர்கால நோக்கைத் தெளிவாகக் காக்கிறது; அதே நேரத்தில் அந்தச் சொற்றொடருக்கு இருக்கக்கூடிய இறுதிக்கால நுண்ணுணர்வை அடிக்குறிப்பில் பதிவு செய்து, குறிப்பிட்ட கோட்பாட்டைத் திணிக்கவில்லை.
- issue: הָרָעָה என்பதன் பொருள்
  choice: தீங்கு
  alternative: தீமை / பேரிடர்
  rationale: இங்கு இஸ்ரவேலுக்கு நேரிடும் பாதக நிகழ்வைக் குறிக்கும் சூழலுக்கு ‘தீங்கு’ பொருந்துகிறது; ஆனால் எபிரெயச் சொல்லின் ஒழுக்கத் தீமை மற்றும் பேரிடர் சார்ந்த பரப்பை அடிக்குறிப்பில் காக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், மரியாதையும் வேதாகம உரைக்குரிய கண்ணியமும் கொண்ட நடை பயன்படுத்தப்பட்டுள்ளது. மிகப் பழமையான சொற்களையும் தேவையற்ற சமயக்குழுச் சொற்களையும் தவிர்த்து, ‘வழியைவிட்டு விலகுதல்’, ‘பார்வையில் தீமையானது’, ‘கோபமூட்டுதல்’ போன்ற மூல உருவகங்கள் வாசிக்க இயன்ற அளவில் காக்கப்பட்டுள்ளன.
