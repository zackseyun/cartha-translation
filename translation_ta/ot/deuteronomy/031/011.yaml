base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/011.yaml
  text: when all Israel comes to appear before Yahweh your God at the place that he will choose[a], you shall read this law before all Israel in their hearing.
translation:
  language: ta
  text: இஸ்ரவேலர் அனைவரும், அவர் தேர்ந்தெடுக்கும் இடத்தில் உன் கடவுளாகிய யாவேயின் முன்னிலையில் நிற்பதற்கு வரும்போது, இந்தச் சட்டத்தை இஸ்ரவேலர் அனைவரின் முன்னிலையிலும் அவர்கள் கேட்கும்படி நீ வாசிக்க வேண்டும்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּבוֹא כָל־יִשְׂרָאֵל
  choice: இஸ்ரவேலர் அனைவரும் வரும்போது
  rationale: בְּ உடன் வரும் בוא வினையெச்சம் காலத்தைக் குறிக்கும் துணைவாக்கியத்தை அறிமுகப்படுத்துகிறது. தமிழில் ‘வரும்போது’ என்பது அதன் காலப் பொருளை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: לֵרָאוֹת אֶת־פְּנֵי יְהוָה אֱלֹהֶיךָ
  choice: உன் கடவுளாகிய யாவேக்கு முன்பாகத் தோன்றுவதற்கு
  rationale: ‘முகத்தைக் காண’ என்ற எபிரெய வழக்கு இச்சூழலில் கடவுளின் முன்னிலையில் வந்து நிற்பதைக் குறிக்கிறது. ‘முன்பாகத் தோன்றுவதற்கு’ என்பது தவறான நேரடிக் காட்சிப் பொருளைத் தவிர்த்து வழக்கின் கருத்தைப் பாதுகாக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இது பட்டமல்ல, எபிரெய மெய்யெழுத்துகளான יהוה குறிக்கும் தனிப்பெயர்; ஆகவே பெயரெழுத்தாக்கமாக ‘யாவே’ என வழங்கப்படுகிறது.
- source_word: בַּמָּקוֹם אֲשֶׁר יִבְחָר
  choice: அவர் தேர்ந்தெடுக்கும் இடத்தில்
  rationale: இறைவன் வழிபாட்டுக்கான இடத்தைத் தேர்ந்தெடுப்பார் என்ற உபாகமத்தின் கருத்தை இயல்பான தமிழில் தக்கவைக்கிறது. எபிரெய imperfect இங்கு எதிர்கால நோக்கமுடையதாக இருந்தாலும், தமிழின் தொடர்பெயர் வடிவம் அதைச் சூழலிலேயே இயல்பாக உணர்த்துகிறது.
- source_word: תִּקְרָא
  choice: நீ வாசிக்க வேண்டும்
  rationale: ‘இந்தச் சட்டம்’ செயப்படுபொருளாகவும் மக்கள் கேட்பது நோக்கமாகவும் இருப்பதால், קרא இங்கு உரக்கப் பொதுவாசிப்பதைக் குறிக்கிறது. ‘வாசிக்க வேண்டும்’ கட்டளையின் வலிமையை நவீன தமிழில் தெளிவாகத் தருகிறது.
- source_word: הַתּוֹרָה הַזֹּאת
  choice: இந்தச் சட்டத்தை
  rationale: תורה என்பதற்கு ‘போதனை’ என்ற விரிந்த பொருள் இருந்தாலும், இங்கு அது உடன்படிக்கைச் சட்டத் தொகுப்பைக் குறிக்கிறது; ‘இந்தச் சட்டம்’ பொதுவாசகர்களுக்குத் தெளிவானதும் சூழலுக்குப் பொருத்தமானதும் ஆகும்.
- source_word: נֶגֶד כָּל־יִשְׂרָאֵל
  choice: இஸ்ரவேலர் அனைவரின் முன்னிலையிலும்
  rationale: கூடியிருந்த மக்கள் அனைவருக்கும் முன்பாக நடைபெறும் பொதுவாசிப்பை இயல்பாகக் குறிக்கிறது.
- source_word: בְּאָזְנֵיהֶם
  choice: அவர்கள் கேட்கும்படி
  rationale: சொல்லுக்குச் சொல் ‘அவர்களுடைய காதுகளில்’ என்ற வடிவத்தை விட, உரை அவர்களுக்கு கேட்கத்தக்கவாறு வாசிக்கப்பட வேண்டும் என்ற எபிரெய வழக்கின் செயற்பொருளை இயல்பான தமிழில் தெரிவிக்கிறது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: ஆண்டவர்; யெகோவா
  rationale: மூலத்தில் இறைவனின் தனிப்பெயரான יהוה நேரடியாக உள்ளது. அதை ஒரு பட்டமாக மாற்றாமல் ‘யாவே’ என்று பெயரெழுத்தாக்குவது மூலத்தின் தனிப்பெயர்த் தன்மையைப் பாதுகாக்கிறது.
- issue: ‘யாவேயின் முகத்தைக் காணுதல்’ என்ற வழக்கின் பொருள்
  choice: யாவேக்கு முன்பாகத் தோன்றுதல்
  alternative: யாவேயின் முகத்தைக் காணுதல்
  rationale: வழிபாடு அல்லது யாத்திரைச் சூழலில் இச்சொற்றொடர் இறைவனின் முன்னிலையில் வந்து நிற்பதைக் குறிக்கிறது. முதன்மை உரை அந்த வழக்குப் பொருளை அளிக்கிறது; சொற்சார்ந்த வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான, பொதுவாசகர்களுக்கு எளிதில் புரியும் தமிழ் பயன்படுத்தப்பட்டுள்ளது. ஒருமை முன்னிலையான אֱלֹהֶיךָ மற்றும் תִּקְרָא ஆகியவை முறையே ‘உன்’ மற்றும் ‘நீ’ என்று பாதுகாக்கப்பட்டுள்ளன; ‘இஸ்ரவேலர் அனைவரும்’ என்பது கூட்டுமக்களைக் குறிக்கிறது.
