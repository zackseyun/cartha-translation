  terminology: ‘யாவே,’ ‘யோசுவா,’ ‘இஸ்ரவேலர்,’ ‘தந்தையர்’ ஆகியவை பொருத்தமானவை. வாக்குத்தத்த நிலத்திற்குச் ‘நிலம்’ பயன்படுத்தப்பட்டுள்ளது. அடிக்குறிப்பு b-யில் மூலத்தின் சொல் மட்டுமே தரப்பட்டு, ‘முற்பிதாக்கள்’ என்ற விளக்கச் சேர்க்கை நீக்கப்பட்டுள்ளது; இதனால் முதன்மை உரையின் ‘தந்தையர்’ என்ற பால்சுட்டும் சொல்லாட்சி காக்கப்படுகிறது.
