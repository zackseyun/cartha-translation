  text: וַ/יִּקְרָ֨א מֹשֶׁ֜ה לִֽ/יהוֹשֻׁ֗עַ וַ/יֹּ֨אמֶר אֵלָ֜י/ו לְ/עֵינֵ֣י כָל יִשְׂרָאֵ֘ל חֲזַ֣ק וֶ/אֱמָץ֒ כִּ֣י אַתָּ֗ה תָּבוֹא֙ אֶת הָ/עָ֣ם הַ/זֶּ֔ה אֶל הָ/אָ֕רֶץ אֲשֶׁ֨ר נִשְׁבַּ֧ע יְהוָ֛ה לַ/אֲבֹתָ֖/ם לָ/תֵ֣ת לָ/הֶ֑ם וְ/אַתָּ֖ה תַּנְחִילֶ֥/נָּה אוֹתָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/007.yaml
  text: Then Moses called Joshua and said to him in the sight of all Israel[a], “Be strong and courageous, because you will go with this people into the land that Yahweh swore to their fathers to give them[b], and you will give it to them as an inheritance.”
translation:
  language: ta
  text: பின்பு மோசே யோசுவாவை அழைத்து, இஸ்ரவேலர் அனைவரின் முன்னிலையிலும் அவனிடம், “நீ பலமாகவும் துணிவாகவும் இரு. ஏனெனில், யாவே அவர்களுடைய தந்தையருக்கு[b] கொடுப்பதாகச் சத்தியம் செய்த அந்த நிலத்திற்குள் நீ இந்த மக்களோடு செல்வாய்[a]; நீ அதை அவர்களுக்கு உரிமையாகப் பங்கிட்டுக் கொடுப்பாய்” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நீ இந்த மக்களை அந்த நிலத்திற்குள் அழைத்துச் செல்வாய்.” எபிரெயச் சொற்றொடரை யோசுவா மக்களுடன் செல்வதாகவோ, அவர்களை வழிநடத்தி உள்ளே கொண்டுசெல்வதாகவோ புரிந்துகொள்ளலாம். அடுத்த கூற்று, அந்த நிலத்தை அவர்களுக்கு உரிமையாக அளிக்கும் பொறுப்பு யோசுவாவுக்கு இருப்பதைத் தெளிவாகக் கூறுகிறது.
    reason: alternative_reading
  - marker: b
    text: எபிரெயில், “அவர்களுடைய தந்தையர்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: அழைத்து
  rationale: கதைச் சூழலில் קרא என்பதற்கு இயல்பான பொருள் ‘அழைத்தல்’; தேவையற்ற அதிகாரபூர்வத் தன்மையை இது சேர்ப்பதில்லை.
- source_word: לִיהוֹשֻׁעַ
  choice: யோசுவா
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் நன்கு அறியப்பட்ட பெயர் வடிவம்.
- source_word: לְעֵינֵי כָל יִשְׂרָאֵל
  choice: இஸ்ரவேலர் அனைவரின் முன்னிலையிலும்
  rationale: சொல்லாட்சியாக ‘எல்லா இஸ்ரவேலின் கண்களுக்கு முன்பாக’; நிகழ்வு பொதுமக்களின் பார்வையில் நடந்ததை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: חֲזַק וֶאֱמָץ
  choice: பலங்கொண்டு துணிவாயிரு
  rationale: தலைமைப் பொறுப்பை ஏற்க ஊக்குவிக்கும் இணை ஆணைகளின் வலிமையையும் இயல்பான தமிழ் நடையையும் காக்கிறது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய ஊக்குவிப்புக்கான காரணத்தை அறிமுகப்படுத்தும் காரண இடைச்சொல்.
- source_word: תָּבוֹא אֶת הָעָם הַזֶּה
  choice: நீ இந்த மக்களோடு செல்வாய்
  rationale: בוא உடன் வரும் את־העם என்ற அமைப்பை யோசுவா மக்களுடன் செல்வதாகப் புரிந்துகொள்கிறது; ‘அவர்களை அழைத்துச் செல்வாய்’ என்ற காரணவினைப் பொருளை மௌனமாகத் திணிக்கவில்லை.
- source_word: הָאָרֶץ
  choice: இந்த நாடு
  rationale: வாக்குத்தத்தம் செய்யப்பட்ட நிலப்பகுதியைக் குறிக்கும் சூழலுக்கு இயல்பான தமிழ்; சுட்டுச் சொல் எபிரெயிலுள்ள குறிப்பிட்ட நாட்டைத் தெளிவாக்குகிறது.
- source_word: נִשְׁבַּע
  choice: ஆணையிட்ட
  rationale: வெறும் வாக்குறுதியல்ல, உறுதிமொழியுடன் செய்த வாக்கைத் தெரிவிக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரான நான்கு எழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: לַאֲבֹתָם
  choice: அவர்களுடைய தந்தையருக்கு
  rationale: மூலத்தின் ஆண்பால் உறவுமுறைச் சொல்லை ‘முன்னோர்கள்’ என்று பொதுமைப்படுத்தாமல் காக்கிறது.
- source_word: לָתֵת לָהֶם
  choice: கொடுப்பதாக
  rationale: ஆணையின் உள்ளடக்கத்தைத் தெரிவிக்கும் எளிய, நேரான infinitive கட்டமைப்பை இயல்பான தமிழில் தருகிறது.
- source_word: תַּנְחִילֶנָּה אֹתָם
  choice: நீ அதை அவர்களுக்கு உரிமைச் சொத்தாக அளிப்பாய்
  rationale: נחל என்பதன் causative பொருளான ‘சுதந்தரிக்கச் செய்தல்/உரிமையாக வழங்குதல்’ என்பதைத் தெளிவாகவும் தற்போதைய தமிழிலும் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலத்தில் தனிப்பட்ட உடன்படிக்கைப் பெயர் நேரடியாக உள்ளது; அதை பொதுப் பட்டமாக மாற்றாமல் ஒலிபெயர்ப்பு காக்கிறது.
- issue: תָּבוֹא אֶת הָעָם என்பது யோசுவா மக்களுடன் செல்வதா அல்லது அவர்களை அழைத்துச் செல்வதா
  choice: நீ இந்த மக்களோடு செல்வாய்
  alternative: நீ இந்த மக்களை நாட்டுக்குள் அழைத்துச் செல்வாய்
  rationale: இவ்வசனத்தின் கட்டமைப்பு யோசுவா மக்களுடன் நுழைவதை அனுமதிக்கிறது; அடுத்த வினைச்சொல் அவர்களுக்கு நாட்டை உரிமையாக அளிக்கும் அவரது செயற்பாட்டுப் பங்கைத் தனியே கூறுகிறது. உண்மையான மொழியியல் ஐயம் அடிக்குறிப்பில் காக்கப்படுகிறது.
- issue: אֲבֹתָם என்ற ஆண்பால் உறவுமுறைச் சொல்
  choice: அவர்களுடைய தந்தையர்
  alternative: அவர்களுடைய முன்னோர்கள்
  rationale: மூலத்தின் வெளிப்படையான உறவுமுறைச் சொல்லை பாலினப் பொதுமைப்படுத்தலின்றி வைத்திருக்கிறது; இச்சூழலில் அது முற்பிதாக்களைக் குறிக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் மரியாதையும் பொதுவாசகர்களுக்கான தெளிவும் காக்கப்பட்டுள்ளன. ‘பலங்கொண்டு துணிவாயிரு’ என்பது செறிவான ஊக்கவுரையாகவும், ‘உரிமைச் சொத்து’ என்பது மரபுரிமைக் கருத்தை குழப்பமின்றி தெரிவிக்கும் நடையாகவும் தேர்ந்தெடுக்கப்பட்டது. வசனத்திலுள்ள எபிரெய வாக்கிய வரிசை முடிந்தவரை காக்கப்பட்டாலும் தமிழ் இயல்புக்கேற்ப துணைவாக்கியங்கள் ஒழுங்குபடுத்தப்பட்டுள்ளன.
