source:
  edition: WLC
  text: וַֽ/יהוָ֞ה ה֣וּא הַ/הֹלֵ֣ךְ לְ/פָנֶ֗י/ךָ ה֚וּא יִהְיֶ֣ה עִמָּ֔/ךְ לֹ֥א יַרְפְּ/ךָ֖ וְ/לֹ֣א יַֽעַזְבֶ֑/ךָּ לֹ֥א תִירָ֖א וְ/לֹ֥א תֵחָֽת׀׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/008.yaml
  text: And Yahweh himself is the one going before you[a]. He himself will be with you; he will not fail you or forsake you. Do not fear or be dismayed.
translation:
  language: ta
  text: உனக்கு முன்னே செல்கிறவர் யாவே தாமே. அவரே உன்னோடு இருப்பார்; அவர் உன்னை நழுவவிடமாட்டார்[a], உன்னைக் கைவிடவும் மாட்டார். பயப்படாதே; கலங்காதே.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உன்னை விட்டுவிடமாட்டார்.”
    reason: רפה என்ற வினை இச்சூழலில் ‘விடுதல்’ அல்லது ‘நழுவவிடுதல்’ என்ற நுட்பத்தைக் கொண்டிருக்கலாம்; இது அடுத்துள்ள עזב (‘கைவிடுதல்’) என்பதிலிருந்து வேறுபடுத்தப்படுகிறது.
lexical_decisions:
- source_word: וַיהוָה
  choice: யாவே
  rationale: எபிரேய மூலத்தில் வரும் தேவனுடைய உடன்படிக்கைப் பெயரைப் பட்டப்பெயராக மாற்றாமல், தமிழில் ஒலிபெயர்த்துள்ளது.
- source_word: הוּא
  choice: தாமே / அவரே
  rationale: தனித்த சுட்டுப்பெயர் தரும் வலியுறுத்தலை இயல்பான தமிழில் காக்கிறது; மரியாதை ஒருமையும் பேணப்படுகிறது.
- source_word: הַהֹלֵךְ לְפָנֶיךָ
  choice: உனக்கு முன்னால் செல்கிறவர்
  rationale: பங்கேற்பு வினையின் தொடர்ச்சியான செயற்பொருளையும், வழிநடத்தவும் காக்கவும் முன்னே செல்லும் சூழல்சார் பொருளையும் காக்கிறது.
- source_word: יִהְיֶה עִמָּךְ
  choice: உன்னோடு இருப்பார்
  rationale: தேவனுடைய உடனிருப்பை விரிவாக்கமின்றி நேரடியாகக் கூறுகிறது.
- source_word: לֹא יַרְפְּךָ
  choice: உன்னைக் கைவிடமாட்டார்
  rationale: רפה என்பதன் ‘பிடியைத் தளர்த்துதல், நழுவவிடுதல், உதவத் தவறுதல்’ என்ற பொருள் எல்லையை இயல்பான தமிழில் தெரிவிக்கிறது; அதன் உருவக நுட்பம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: וְלֹא יַעַזְבֶךָּ
  choice: உன்னை விட்டுவிலகவும் மாட்டார்
  rationale: עזב என்பதன் விட்டுப்போதல் அல்லது கைவிடுதல் என்ற பொருளை, முந்தைய வினையிலிருந்து ஓரளவு வேறுபடுத்திக் காட்டுகிறது.
- source_word: לֹא תִירָא
  choice: பயப்படாதே
  rationale: இச்சூழலில் தடை அல்லது ஊக்கவுரையாகச் செயல்படும் வினை வடிவத்தை இயல்பான ஒருமை அழைப்பாக வழங்குகிறது.
- source_word: וְלֹא תֵחָת
  choice: கலங்காதே
  rationale: அச்சுறுத்தலால் மனம் உடைதல், திகைத்தல் என்ற பொருளை ‘பயப்படாதே’ என்பதோடு தேவையின்றி ஒன்றாக்காமல் தெரிவிக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற தேவப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: ஆண்டவர் / யெகோவா
  rationale: மூலத்தில் நேரடியாக இடம்பெறும் நான்கெழுத்துத் தேவப் பெயரைப் பொதுப் பட்டப்பெயராக மாற்றாமல், வழக்கமான தமிழ் ஒலிபெயர்ப்பில் காக்கிறது.
- issue: தேவனுடைய முன்னே செல்லுதலும் உடனிருப்பும்
  choice: இரண்டு கூற்றுகளையும் தனித்தனியாக வைத்தல்
  alternative: ‘உன்னை வழிநடத்தி உன்னோடு இருப்பார்’ என்று விளக்கி விரித்தல்
  rationale: முன்னே செல்லுதல் மற்றும் உடனிருத்தல் ஆகிய இரு உருவகங்களுக்கிடையேயுள்ள வேதவாக்கின் வலியுறுத்தலையும் இறையியல் நெருக்கத்தையும் விளக்கிச் சமப்படுத்தாமல் காக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில், சாதாரண வாசகருக்குப் புரியும் வகையிலும் வேதவாக்கிற்கு ஏற்ற கண்ணியமான நடையிலும் மொழிபெயர்க்கப்பட்டுள்ளது. யோசுவாவை நோக்கிய எபிரேய ஒருமை இரண்டாம் நபர் ‘உனக்கு/உன்னோடு/பயப்படாதே’ எனக் காக்கப்பட்டுள்ளது.
