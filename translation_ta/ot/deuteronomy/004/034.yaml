- from: அல்லது, ஒரு தெய்வம் வேறொரு நாட்டின் நடுவிலிருந்து தனக்கென ஒரு நாட்டைச் சோதனைகளாலும், அடையாளங்களாலும், அற்புதங்களாலும், போராலும், வல்லமையான கரத்தாலும், நீட்டப்பட்ட புயத்தாலும், பெரும் அச்சமூட்டும் செயல்களாலும்[a] சென்று எடுத்துக்கொள்ள எப்போதாவது முயன்றதுண்டா? உங்கள் கடவுளாகிய யாவே எகிப்தில் உங்கள் கண்முன்னே உங்களுக்காகச் செய்த அனைத்தையும் போல வேறு எங்காவது நடந்ததுண்டா?
  to: அல்லது, ஒரு தெய்வம் வேறொரு இனத்தின் நடுவிலிருந்து தனக்கென ஒரு இனத்தைச் சோதனைகளாலும், அடையாளங்களாலும், அற்புதங்களாலும், போராலும், வல்லமையான கரத்தாலும், நீட்டிய புயத்தாலும், பெரும் அச்சமூட்டும் செயல்களாலும்[a] சென்று எடுத்துக்கொள்ள எப்போதாவது முயன்றதுண்டா—உங்கள் கடவுளாகிய யாவே எகிப்தில் உங்கள் கண்முன்னே உங்களுக்காகச் செய்த அனைத்தையும் போல?
  rationale: மூலத்தின் ஒரே வினாவையும் அதன் இறுதி ஒப்பீட்டுத் தொடரையும் மீட்டமைத்துள்ளோம்; ஆதாரமற்ற “வேறு எங்காவது” என்ற சேர்க்கை நீக்கப்பட்டுள்ளது. גּוֹי என்ற இருமுறை வரும் சொல்லை “இனம்” என மொழிபெயர்த்து, மற்றொரு மக்களினத்தின் நடுவிலிருந்து ஒரு மக்களினத்தை எடுத்துக்கொள்ளுதல் என்ற படிமம் தெளிவாக்கப்பட்டுள்ளது. மற்ற முக்கிய சொற்களும் அடிக்குறிப்பு மாற்றுவழியும் தக்கவைக்கப்பட்டுள்ளன.
