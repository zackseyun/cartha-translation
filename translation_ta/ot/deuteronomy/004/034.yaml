base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/034.yaml
  text: Or has any god ever attempted to go and take for himself a nation from the midst of another nation[a], by trials, by signs, and by wonders, and by war, and by a mighty hand, and by an outstretched arm, and by great terrors, according to all that Yahweh your God did for you in Egypt before your eyes?
translation:
  language: ta
  text: அல்லது, ஒரு தெய்வம் வேறொரு இனத்தின் நடுவிலிருந்து தனக்கென ஒரு இனத்தைச் சோதனைகளாலும், அடையாளங்களாலும், அற்புதங்களாலும், போராலும், வல்லமையான கரத்தாலும், நீட்டிய புயத்தாலும், பெரும் அச்சமூட்டும் செயல்களாலும்[a] சென்று எடுத்துக்கொள்ள எப்போதாவது முயன்றதுண்டா—உங்கள் கடவுளாகிய யாவே எகிப்தில் உங்கள் கண்முன்னே உங்களுக்காகச் செய்த அனைத்தையும் போல?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பெரும் பிரமிப்பூட்டும் செயல்களாலும்” அல்லது “பெரும் பயங்கரச் செயல்களாலும்.” எபிரெயச் சொற்றொடர் அச்சத்தையும் பிரமிப்பையும் உண்டாக்கும் செயல்களைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲנִסָּה
  choice: எப்போதாவது முயன்றதுண்டா
  rationale: נסה என்பதன் இச்சூழலுக்குரிய ‘முயலுதல்’ என்ற பொருளையும், முன்னெப்போதும் நிகழாத செயலைக் குறிக்கும் வினாவையும் இயல்பான தமிழில் தருகிறது; ‘சோதித்ததுண்டா’ என்பது தவறான பொருளைத் தூண்டும்.
- source_word: אֱלֹהִים
  choice: ஒரு தெய்வம்
  rationale: யாவேயின் செயல்களோடு எந்தத் தெய்வத்தின் செயலையும் ஒப்பிடும் பொதுப்பொருளைத் தருகிறது; முதல் கூறு மெய்யான கடவுளையே நேரடியாகக் குறிப்பதாக ஆக்கவில்லை.
- source_word: לָבוֹא לָקַחַת
  choice: சென்று எடுத்துக்கொள்ள
  rationale: நோக்கத்துடன் நகர்ந்து பின்னர் எடுத்துக்கொள்ளும் இரட்டை வினை அமைப்பைப் பாதுகாக்கிறது.
- source_word: גּוֹי מִקֶּרֶב גּוֹי
  choice: வேறொரு நாட்டின் நடுவிலிருந்து தனக்கென ஒரு நாட்டை
  rationale: ஒரு அரசியல் மக்களினத்தின் உள்ளிருந்து இன்னொரு மக்களினத்தைப் பிரித்தெடுக்கும் எபிரெயப் படிமத்தையும் மீளுரைப்பையும் தெளிவாகத் தருகிறது.
- source_word: בְּמַסֹּת
  choice: சோதனைகளாலும்
  rationale: எகிப்தில் நிகழ்ந்த சோதித்தறியும் நியாயத்தீர்ப்புச் சம்பவங்களைக் குறிக்கும் பரந்த பொருளை வைத்திருக்கிறது.
- source_word: בְּאֹתֹת וּבְמוֹפְתִים
  choice: அடையாளங்களாலும், அற்புதங்களாலும்
  rationale: அசாதாரண தெய்வீகச் செயல்களைக் குறிக்கும் இணைச்சொற்களின் வேறுபாட்டைப் பாதுகாக்கிறது.
- source_word: וּבְמִלְחָמָה
  choice: போராலும்
  rationale: விடுதலையின் போர்சார் பரிமாணத்தை நேரடியாகத் தருகிறது.
- source_word: וּבְיָד חֲזָקָה
  choice: வல்லமையான கரத்தாலும்
  rationale: யாத்திராகமச் சூழலின் நிலையான உருவகத்தை இயல்பான, கண்ணியமான தமிழில் தருகிறது.
- source_word: וּבִזְרֹעַ נְטוּיָה
  choice: நீட்டப்பட்ட புயத்தாலும்
  rationale: மூலத்தின் உடல்-உருவகத்தையும் தெய்வீக வல்லமையின் வெளிப்பாட்டையும் பாதுகாக்கிறது.
- source_word: וּבְמוֹרָאִים גְּדֹלִים
  choice: பெரும் அச்சமூட்டும் செயல்களாலும்
  rationale: அச்சத்தையும் பிரமிப்பையும் உண்டாக்கும் செயல்கள் என்ற பொருளைத் தெளிவாக்குகிறது; ‘பெரும் பயங்கரங்கள்’ என்பதிலுள்ள தெளிவின்மையைத் தவிர்க்கிறது.
- source_word: כְּכֹל אֲשֶׁר עָשָׂה
  choice: செய்த அனைத்தையும் போல
  rationale: யாவே செய்த செயல்களின் முழுமையையும் ஒப்பீட்டின் வலிமையையும் காக்கிறது.
theological_decisions:
- issue: வினாவின் முதல் கூறிலுள்ள אֱלֹהִים யாரைக் குறிக்கிறது
  choice: ஒரு தெய்வம்
  alternative: கடவுள்
  rationale: இது யாவேயின் தனித்துவமான மீட்புச் செயல்களை எந்தத் தெய்வத்தின் செயலோடும் ஒப்பிடும் வினா. ஆகவே முதல் கூறை மெய்யான கடவுளைப் பற்றியதாக முன்கூட்டியே தீர்மானிக்காமல் பொதுப்பொருளில் மொழிபெயர்க்கிறது.
- issue: יְהוָה என்ற தெய்வீகப் பெயர்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்திலுள்ள தனிப்பட்ட தெய்வீகப் பெயரைப் பட்டப்பெயராக மாற்றாமல் ஒலிபெயர்க்கிறது.
- issue: மூலத்தின் ஒரே நீண்ட வினாவைத் தமிழில் வழங்குதல்
  choice: இரண்டு தொடர்புடைய வினாக்களாக வழங்கப்பட்டது
  alternative: ஒரே நீண்ட வினாவாக வழங்குதல்
  rationale: மூலத்தின் வினாவியல் வலிமையையும் ஒப்பீட்டையும் காத்தபடி, நீண்ட கருவிப் பட்டியலுக்குப் பின் நவீன தமிழில் வாசிப்புத் தெளிவை அளிக்கிறது; இரண்டாவது வினா முதலாவதன் ஒப்பீட்டை மட்டுமே வெளிப்படுத்துகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. கருவியைக் குறிக்கும் தொடர்ச்சியான בְ முன்னொட்டுகள் ‘-ஆலும்’ என்ற இணை அமைப்பால் காக்கப்பட்டுள்ளன. ‘கரம்’, ‘புயம்’ ஆகியவை உயர்ந்த ஆனால் பரவலாக அறியப்படும் வேதாகம உருவகச் சொற்களாகப் பயன்படுத்தப்பட்டுள்ளன.
