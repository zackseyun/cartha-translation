base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/043.yaml
  text: Bezer in the wilderness[a], in the land of the tableland, for the Reubenite; and Ramoth in Gilead for the Gadite; and Golan in Bashan for the Manassite.
translation:
  language: ta
  text: ரூபன் கோத்திரத்தாருக்காகப் பீடபூமிப் பகுதியில் உள்ள வனாந்தரத்தில் பேசேரையும்,[a] காத் கோத்திரத்தாருக்காகக் கீலேயாத்தில் உள்ள ராமோத்தையும், மனாசே கோத்திரத்தாருக்காகப் பாசானில் உள்ள கோலானையும் ஒதுக்கினார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘சமவெளிப் பகுதியில்’ என்றும் மொழிபெயர்க்கலாம். இதற்கான எபிரெயச் சொல் சமமான நிலத்தையோ மேட்டு நிலப்பரப்பையோ குறிக்கிறது; இங்கு யோர்தானுக்குக் கிழக்கேயுள்ள உயர்நிலப் பகுதியைக் குறிப்பதால் ‘பீடபூமி’ என்று மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּצֶר
  choice: பேசேர்
  rationale: இடப்பெயர் என்பதால், எபிரெய ஒலிப்புக்கு ஏற்ற வகையில் தமிழில் ஒலிபெயர்க்கப்பட்டது.
- source_word: בַּמִּדְבָּר
  choice: வனாந்தரத்தில்
  rationale: מִדְבָּר என்பது பாலைவனத்தை மட்டும் அல்லாமல் மக்கள் குடியிருப்பு குறைந்த திறந்த வறண்ட நிலப்பகுதியையும் குறிக்கலாம்; வழக்கமான வேதாகமப் புவியியல் சொல்லாக ‘வனாந்தரம்’ பயன்படுத்தப்பட்டது.
- source_word: בְּאֶרֶץ הַמִּישֹׁר
  choice: பீடபூமிப் பகுதியில்
  rationale: מִישֹׁר சமமான அல்லது மேடான நிலப்பரப்பைக் குறிக்கிறது. யோர்தானுக்குக் கிழக்கேயுள்ள உயர்நிலத்தைத் தெளிவாகக் காட்ட ‘பீடபூமி’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: לָרֻאוּבֵנִי
  choice: ரூபன் கோத்திரத்தாருக்காக
  rationale: எபிரெயத்தில் ஒருமை இனப்பெயர் வந்தாலும், கோத்திர ஒதுக்கீட்டுச் சூழலில் அது கூட்டாகப் பொருள்படுகிறது; இயல்பான தமிழுக்காக கோத்திரத்தாரைக் குறிக்கும் வடிவம் பயன்படுத்தப்பட்டது.
- source_word: רָאמֹת
  choice: ராமோத்
  rationale: இடப்பெயர் தமிழில் ஒலிபெயர்க்கப்பட்டது.
- source_word: בַּגִּלְעָד
  choice: கீலேயாத்தில்
  rationale: பிரதேசப் பெயர் எபிரெய ஒலிப்புக்கு நெருக்கமாகத் தமிழில் வழங்கப்பட்டது.
- source_word: לַגָּדִי
  choice: காத் கோத்திரத்தாருக்காக
  rationale: ஒருமை இனப்பெயரின் கூட்டுப் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: גּוֹלָן
  choice: கோலான்
  rationale: இடப்பெயர் தமிழில் ஒலிபெயர்க்கப்பட்டது.
- source_word: בַּבָּשָׁן
  choice: பாசானில்
  rationale: பிரதேசப் பெயர் தமிழில் ஒலிபெயர்க்கப்பட்டது.
- source_word: לַמְנַשִּׁי
  choice: மனாசே கோத்திரத்தாருக்காக
  rationale: எபிரெய ஒருமை இனப்பெயர் இங்கு கோத்திர மக்களைக் கூட்டாகக் குறிப்பதால், தமிழில் தெளிவாக வழங்கப்பட்டது.
- source_word: אֶת ... וְאֶת ... וְאֶת
  choice: …ஐயும், …ஐயும், …ஐயும்
  rationale: நேரடி வேற்றுமை உருபுகளும் இணைப்புகளும் மூன்று நகரங்களின் ஒருங்கிணைந்த பட்டியலாகத் தமிழில் பிரதிபலிக்கப்பட்டன.
