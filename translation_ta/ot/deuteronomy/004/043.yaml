translation_notes:
  register: நவீன செந்தமிழ் சார்ந்த, பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. வசனம் முந்தைய வாக்கியத்தின் வினையைத் தொடர்வதால், தமிழில் தனித்து வாசிக்க இயலுமாறு ‘ஒதுக்கினார்’ சேர்க்கப்பட்டது. கோத்திர இனப்பெயர்களின் எபிரெய ஒருமை வடிவம் தமிழில் இயல்பான கூட்டுப்பெயராக வழங்கப்பட்டது.
