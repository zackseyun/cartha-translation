base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/003.yaml
  text: Your own eyes have seen what Yahweh did at Baal-peor[a], for every man who went after Baal-peor, Yahweh your God destroyed from your midst.
translation:
  language: ta
  text: பாகால்-பெயோரில் யாவே செய்ததை உங்கள் கண்களே கண்டன. ஏனெனில், பாகால்-பெயோரைப் பின்பற்றிச் சென்ற ஒவ்வொரு ஆணையும்[a] உங்கள் கடவுளாகிய யாவே உங்கள் நடுவிலிருந்து அழித்துப்போட்டார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “பின்பற்றிச் சென்ற ஒவ்வொருவரையும்” என்றும் மொழிபெயர்க்கலாம். எபிரெயத்தில் சொற்சொல்லாக, “பின்னால் சென்ற ஒவ்வொரு ஆணையும்” என்று உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵינֵיכֶם הָרֹאֹת
  choice: உங்கள் கண்களே கண்டன
  rationale: கண்களை முன்னிலைப்படுத்தும் எபிரெயக் கட்டமைப்பின் நேரடிச் சாட்சி வலியுறுத்தலை இயல்பான நவீனத் தமிழில் காக்கிறது.
- source_word: עָשָׂה
  choice: செய்ததை
  rationale: இங்கு படைத்தல் அல்ல, பாகால்-பெயோர் சம்பவத்தில் யாவே செய்த நியாயத்தீர்ப்புச் செயலைக் குறிக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரை ஒரு பட்டத்தால் மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: בְּבַעַל פְּעוֹר
  choice: பாகால்-பெயோரில்
  rationale: בְּ என்பதன் இடம் அல்லது சம்பவச் சூழல் சார்ந்த பொருளைச் சுருக்கமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய கூற்றுக்கான விளக்கக் காரணத்தை அறிமுகப்படுத்தும் தொடர்பைத் தெளிவாக்குகிறது.
- source_word: כָּל הָאִישׁ
  choice: ஒவ்வொரு ஆணையும்
  rationale: ஆண்பால் ஒருமையைப் பகிர்வுப் பொருளில் பயன்படுத்தும் மூல வடிவத்தைத் துல்லியமாகக் காக்கிறது; பரந்த பொருள் சாத்தியம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: הָלַךְ אַחֲרֵי
  choice: பின்பற்றிச் சென்ற
  rationale: ஒருவருக்குப் பின்னால் செல்வது என்ற மூல உருவகத்தையும், இங்கு சிலைவழிபாட்டுச் சார்பை ஏற்றுப் பின்பற்றுதல் என்ற பொருளையும் காக்கிறது.
- source_word: הִשְׁמִידוֹ
  choice: அழித்துப்போட்டார்
  rationale: ஹிஃபில் வினையின் தீவிரமான அழித்தொழிக்கும் பொருளை இயல்பான, கண்ணியமான தமிழில் தெரிவிக்கிறது; ‘ஒவ்வொரு ஆணையும்’ என்பதே வினையின் பொருளாக இருப்பதால் தனியான சுட்டுப்பெயர் தேவையில்லை.
- source_word: אֱלֹהֶיךָ
  choice: உங்கள் கடவுளாகிய
  rationale: யாவே என்ற பெயருடன் இணைந்த உடன்படிக்கை உறவைக் குறிக்கும் அடைமொழியை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: מִקִּרְבֶּךָ
  choice: உங்கள் நடுவிலிருந்து
  rationale: உடன்படிக்கைச் சமூகத்துக்குள் இருந்தவர்களை அகற்றிய பொருளை நெருக்கமாகக் காக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூலத்தில் தனிப்பட்ட உடன்படிக்கைப் பெயர் நேரடியாக இருப்பதால், அதை ஒரு பொதுப் பட்டமாக மாற்றாமல் ஒலிபெயர்க்கப்பட்டது.
- issue: כָּל הָאִישׁ என்ற ஆண்பால் பகிர்வு ஒருமை
  choice: ஒவ்வொரு ஆணையும்
  alternative: ஒவ்வொருவரையும்
  rationale: மூலத்தின் இலக்கண ஆண்பாலை முதன்மை உரையில் காத்து, அது பொதுவான பகிர்வுப் பொருளில் புரிந்துகொள்ளப்படக்கூடிய சாத்தியத்தை அடிக்குறிப்பில் பதிவு செய்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘உங்கள் கண்களே’ என்ற வலியுறுத்தலும், ‘பின்பற்றிச் சென்ற’ என்ற மூல உருவகமும் காக்கப்பட்டுள்ளன.
