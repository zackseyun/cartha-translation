source:
  edition: WLC
  text: אַתָּה֙ הָרְאֵ֣תָ לָ/דַ֔עַת כִּ֥י יְהוָ֖ה ה֣וּא הָ/אֱלֹהִ֑ים אֵ֥ין ע֖וֹד מִ/לְ/בַדּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/035.yaml
  text: You were shown these things so that you might know that Yahweh[a], he is God[b]; there is no other besides him.
translation:
  language: ta
  text: 'நீ அறிந்துகொள்வதற்காகவே இவை உனக்குக் காண்பிக்கப்பட்டன: யாவே—அவரே கடவுள்; அவரைத் தவிர வேறு கடவுள் இல்லை.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָרְאֵתָ
  choice: உனக்குக் காண்பிக்கப்பட்டன
  rationale: 'ஹொஃபால் வினைவடிவத்தின் காரணப்பாட்டு-செயப்பாட்டு பொருளைத் தக்கவைக்கிறது: இஸ்ரவேல் தானாகக் கண்டது என்பதல்ல, காணும்படி செய்யப்பட்டான். சூழலில் முன்னர் கூறப்பட்ட செயல்களைச் சுட்டுவதால் தமிழில் பன்மை இயல்பானது.'
- source_word: לָדַעַת
  choice: நீ அறிந்துகொள்வதற்காகவே
  rationale: ל முன்னொட்டுடன் வரும் வினையெச்சம் இங்கு நோக்கம் அல்லது எதிர்பார்க்கப்பட்ட விளைவைத் தெரிவிக்கிறது. ‘வே’ அந்த நோக்க வலியுறுத்தலை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: כִּי
  choice: விளக்க நிறுத்தக்குறியால் வெளிப்படுத்தப்பட்டது
  rationale: இங்கு כִּי அறியப்பட வேண்டிய செய்தியை அறிமுகப்படுத்துகிறது. தமிழில் ‘என்று’ என நீளமாக்காமல், இருபுள்ளி அதே தொடர்பைத் தெளிவாகக் காட்டுகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைத் தனிப்பெயரான நான்கெழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் நேரடியாக ஒலிபெயர்க்கிறது.
- source_word: הוּא
  choice: அவரே
  rationale: தனி சுட்டுப்பெயரின் வலியுறுத்தலைத் தக்கவைக்கிறது. தமிழில் கடவுளைக் குறிக்கும் மரியாதை ஒருமையுடன் ‘அவரே’ இயல்பாக உள்ளது; அடுத்த கூற்றின் தனித்தன்மைப் பொருளை முன்கூட்டியே மிகைப்படுத்தவில்லை.
- source_word: הָאֱלֹהִים
  choice: கடவுள்
  rationale: இங்கு யாவே யார் என்பதை அடையாளப்படுத்தும் பயனிலையாக வருகிறது. ‘கடவுள்’ என்பது நவீனத் தமிழில் இயல்பானதும் தெளிவானதும் ஆகும்.
- source_word: אֵין עוֹד מִלְבַדּוֹ
  choice: அவரைத் தவிர வேறு யாரும் இல்லை
  rationale: யாவேக்கு அப்பால் வேறொரு தெய்வம் இல்லை என்ற விலக்கும் தனித்தன்மைக் கூற்றைத் தெளிவான நவீனத் தமிழில் தெரிவிக்கிறது; மூலத்தைத் தாண்டிய தத்துவ விளக்கத்தைச் சேர்க்கவில்லை.
theological_decisions:
- issue: יְהוָה என்ற இறைத் தனிப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் பட்டம் அல்ல, இறைத் தனிப்பெயரே உள்ளது. ஆகவே பெயரை மறைக்கும் மரபுவழிப் பட்டத்திற்குப் பதிலாக அதன் ஒலிபெயர்ப்பு பயன்படுத்தப்பட்டது.
- issue: யாவேயின் தனித்தன்மைக் கூற்றின் வலிமை
  choice: அவரைத் தவிர வேறு யாரும் இல்லை
  alternative: அவரைத் தவிர வேறு கடவுள் இல்லை
  rationale: எபிரெயத்தின் சுருக்கமான אֵין עוֹד מִלְבַדּוֹ கூற்றை இயல்பாகவும் வலிமையாகவும் வழங்குகிறது. ‘யாரும்’ என்பது முன் வரும் ‘கடவுள்’ என்பதன் வெளிச்சத்தில் வேறு தெய்வத்தைக் குறிப்பது தெளிவு; தேவையற்ற விரிவாக்கம் தவிர்க்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் எளிமையும் கண்ணியமும் இணைக்கப்பட்டுள்ளன. ‘யாவே—அவரே கடவுள்’ என்ற அமைப்பு எபிரெயச் சுட்டுப்பெயரின் வலியுறுத்தலைப் பாதுகாக்கிறது. ‘இவை’ என்பது உடனடி சூழலில் முன்பு விவரிக்கப்பட்ட தெய்வீகச் செயல்களை இயல்பாகச் சுட்டும் சூழல்சார் நிரப்பு.
