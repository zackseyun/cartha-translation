  text: וַ/עֲבַדְתֶּם שָׁ֣ם אֱלֹהִ֔ים מַעֲשֵׂ֖ה יְדֵ֣י אָדָ֑ם עֵ֣ץ וָ/אֶ֔בֶן אֲשֶׁ֤ר לֹֽא יִרְאוּ/ן֙ וְ/לֹ֣א יִשְׁמְע֔וּ/ן וְ/לֹ֥א יֹֽאכְל֖וּ/ן וְ/לֹ֥א יְרִיחֻֽ/ן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/028.yaml
  text: And there you will serve gods[a], the work of human hands, wood and stone, which neither see nor hear nor eat nor smell.
translation:
  language: ta
  text: அங்கே நீங்கள் மனிதக் கைகளால் செய்யப்பட்ட, மரத்தாலும் கல்லாலும் ஆன தெய்வங்களை வழிபடுவீர்கள்; அவை பார்க்கவோ கேட்கவோ உண்ணவோ முகரவோ மாட்டா.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַעֲבַדְתֶּם
  choice: வழிபடுவீர்கள்
  rationale: עבד என்பதற்கு ‘பணிசெய்தல்’ என்ற அடிப்படைப் பொருள் இருந்தாலும், தெய்வங்களைக் குறித்த இச்சூழலில் ‘வழிபடுதல்’ என்பது இயல்பாகவும் துல்லியமாகவும் உள்ளது; எச்சரிப்பின் எதிர்கால நோக்கை ‘-வீர்கள்’ வெளிப்படுத்துகிறது.
- source_word: שָׁם
  choice: அங்கே
  rationale: முந்தைய வசனத்தில் கூறப்பட்ட பிற மக்களிடையே சிதறடிக்கப்படும் இடத்தைக் குறிக்கும் இடவினையடை.
- source_word: אֱלֹהִים
  choice: தெய்வங்களை
  rationale: இங்கு பன்மையில் பொய்த் தெய்வங்களைக் குறிக்கிறது. ‘சிலைகள்’ என்று பொருள் விளக்கமாக மாற்றாமல், மூலத்தின் நேரடியான சொல்லைத் தக்கவைக்கிறது.
- source_word: מַעֲשֵׂה יְדֵי אָדָם
  choice: மனிதக் கைகளால் செய்யப்பட்ட
  rationale: மனிதர்களால் உருவாக்கப்பட்டவை என்னும் கருத்தை நவீனத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது; אָדָם இங்கு பொதுவாக மனிதர்களைக் குறிக்கிறது.
- source_word: עֵץ וָאֶבֶן
  choice: மரத்தையும் கல்லையும்
  rationale: உயிருள்ள மரத்தைக் குறிப்பிடாமல், தெய்வ உருவங்களின் மூலப்பொருட்களான மரம் மற்றும் கல்லைக் குறிக்கிறது.
- source_word: אֲשֶׁר לֹא יִרְאוּן וְלֹא יִשְׁמְעוּן וְלֹא יֹאכְלוּן וְלֹא יְרִיחֻן
  choice: அவை பார்க்கவோ கேட்கவோ உண்ணவோ முகரவோ மாட்டா
  rationale: ஒவ்வொரு வினைக்கும் வரும் எபிரெய மறுப்பைத் தமிழின் இணைநிலை ‘-வோ ... மாட்டா’ அமைப்பில் தெளிவாகவும் ஓசைநயத்துடனும் பிரதிபலிக்கிறது; ‘இயலாது’ என்று திறனின்மையை வெளிப்படையாகச் சேர்க்காமல் மூலத்தின் மறுப்பு வடிவத்தைக் காக்கிறது.
- source_word: יְרִיחֻן
  choice: முகரவோ
  rationale: இங்கு மணத்தை உணரும் செயலைக் குறிக்கிறது. ‘முகர்தல்’ என்பது பட்டியலின் உடலுணர்வு சார்ந்த பொருளைத் துல்லியமாக வழங்குகிறது.
theological_decisions:
- issue: אֱלֹהִים என்பதை ‘தெய்வங்கள்’ அல்லது ‘சிலைகள்’ என்று மொழிபெயர்த்தல்
  choice: தெய்வங்கள்
  alternative: சிலைகள்
  rationale: மூலச்சொல் ‘தெய்வங்கள்’ என்பதே; அவை மனிதக் கைகளால் மரத்திலும் கல்லிலும் செய்யப்பட்டவை என்று அடுத்த சொற்றொடரே அவற்றின் சிலைத் தன்மையை விளக்குகிறது. ஆகவே விளக்கத்தைச் சொல்லுக்குள் முன்கூட்டியே புகுத்தவில்லை.
- issue: உணர்வுச் செயல்களின் மறுப்பை திறனின்மையாக விளக்க வேண்டுமா
  choice: பார்க்கவோ கேட்கவோ உண்ணவோ முகரவோ மாட்டா
  alternative: பார்க்கவோ கேட்கவோ உண்ணவோ முகரவோ இயலாதவை
  rationale: எபிரெயத்தில் நேரடி மறுப்புகள் உள்ளன; திறனின்மை என்பது சூழலின் தெளிவான உட்பொருளாக இருந்தாலும், அதை வெளிப்படையாகச் சேர்க்காமல் மூல வடிவத்தையும் விக்கிரகங்களுக்கு எதிரான நையாண்டியையும் தக்கவைக்கிறது.
- issue: אָדָם என்பதன் பொதுப்பொருள்
  choice: மனிதக் கைகள்
  alternative: ஆண்களின் கைகள்
  rationale: இங்கு பாலினத்தைக் குறிப்பதல்ல; மனிதர்களால் செய்யப்பட்டவை என்பதே கருத்து.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. ‘வழிபடுவீர்கள்’ சூழலுக்கேற்ற சமயப் பொருளை வழங்குகிறது. அடுக்குக்குறிகள் மூலம் ‘மரத்தையும் கல்லையும்’ என்பது தெய்வங்களை விளக்கும் இணைப்பாகத் தெளிவாக்கப்பட்டுள்ளது. அடிக்குறிப்புகள் தேவையில்லை.
