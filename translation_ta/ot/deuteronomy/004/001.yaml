source:
  edition: WLC
  text: וְ/עַתָּ֣ה יִשְׂרָאֵ֗ל שְׁמַ֤ע אֶל הַֽ/חֻקִּים֙ וְ/אֶל הַ/מִּשְׁפָּטִ֔ים אֲשֶׁ֧ר אָֽנֹכִ֛י מְלַמֵּ֥ד אֶתְ/כֶ֖ם לַ/עֲשׂ֑וֹת לְמַ֣עַן תִּֽחְי֗וּ וּ/בָאתֶם֙ וִֽ/ירִשְׁתֶּ֣ם אֶת הָ/אָ֔רֶץ אֲשֶׁ֧ר יְהוָ֛ה אֱלֹהֵ֥י אֲבֹתֵי/כֶ֖ם נֹתֵ֥ן לָ/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/001.yaml
  text: And now[a], Israel, listen to the statutes and the judgments that I am teaching you to do, so that you may live and go in and take possession of the land that Yahweh, the God of your fathers[c][b], is giving to you.
translation:
  language: ta
  text: இப்போது, இஸ்ரவேலே, நீங்கள் கடைப்பிடிப்பதற்காக நான் உங்களுக்குக் கற்பிக்கும் நியமங்களுக்கும் நீதிமுறைகளுக்கும்[a] செவிகொடு; நீங்கள் வாழவும், உங்கள் தந்தையரின் கடவுளாகிய யாவே[c] உங்களுக்குக் கொடுக்கிற நாட்டிற்குள் சென்று அதை உரிமையாக்கிக்கொள்ளவும்[b] செவிகொடுங்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘நியமங்களும் நீதிமுறைகளும்’ என்பதை ‘சட்டங்களும் தீர்ப்புகளும்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘உரிமையாக்கிக்கொள்ள’ என்பதை ‘சுதந்தரித்துக்கொள்ள’ அல்லது ‘உடைமையாக்கிக்கொள்ள’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: எபிரேயில் ‘YHWH’; மரபாக ‘ஆண்டவர்’ என்று மொழிபெயர்க்கப்படுகிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: וְעַתָּה
  choice: இப்போது
  rationale: முந்தைய உரையுடன் இந்த அறிவுறுத்தலை இணைக்கும் சொற்பொழிவு மாற்றத்தை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: שְׁמַע
  choice: செவிகொடு
  rationale: இது வெறுமனே கேட்பதைவிடக் கவனமாகக் கேட்பதைக் குறிக்கிறது. ‘கீழ்ப்படி’ என்று மொழிபெயர்த்தால் உட்கருத்தை அளவுக்கு மீறித் தீர்மானித்துவிடும்; செயல்படுத்துதல் அடுத்த சொற்றொடரில் வெளிப்படுகிறது.
- source_word: הַחֻקִּים
  choice: நியமங்கள்
  rationale: சட்டச் சூழலில் நிர்ணயிக்கப்பட்ட கட்டளைகள் அல்லது விதிகள் என்ற பொருளைத் தெளிவாகத் தருவதோடு, மִשְׁפָּטִים என்பதிலிருந்தும் வேறுபடுத்துகிறது.
- source_word: הַמִּשְׁפָּטִים
  choice: நீதிமுறைகள்
  rationale: சட்டம் மற்றும் நீதித் தீர்மானம் சார்ந்த நுண்பொருளைப் பேணுகிறது; அருகிலுள்ள חֻקִּים என்பதுடன் ஒன்றாக்கவில்லை.
- source_word: מְלַמֵּד
  choice: கற்பிக்கிற
  rationale: மோசே இப்போது தொடர்ந்து வழங்கிக்கொண்டிருக்கும் போதனையை எபிரேயப் பங்கேற்பு வினை வடிவுக்கு ஏற்றவாறு காட்டுகிறது.
- source_word: לַעֲשׂוֹת
  choice: கடைப்பிடிக்கும்படி
  rationale: கட்டளைகளைச் செயல்படுத்துதல் என்ற சூழல்சார் பொருளை இயல்பான தமிழில் தருகிறது; வெறும் அறிவுபூர்வ கற்றல் அல்ல என்பதைத் தெளிவாக்குகிறது.
- source_word: לְמַעַן תִּחְיוּ
  choice: அப்போது நீங்கள் வாழ்வீர்கள்
  rationale: கேட்டு நடைமுறைப்படுத்துவதன் நோக்கம் அல்லது விளைவாக வாழ்வு வருவதைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது; காரணத் தொடர்பை முந்தைய வாக்கியத்துடன் பேணுகிறது.
- source_word: וּבָאתֶם
  choice: நாட்டிற்குள் சென்று
  rationale: வாக்குறுதியளிக்கப்பட்ட நாட்டின் உள்ளே நுழையும் திசைசார் பொருளைத் தெளிவாகப் பேணுகிறது.
- source_word: וִירִשְׁתֶּם
  choice: உரிமையாக்கிக்கொள்வீர்கள்
  rationale: நில வாக்குறுதியின் சூழலில் நாட்டைக் கைப்பற்றி உடைமையாக்கும் பொருளைத் தருகிறது; ‘சுதந்தரிப்பீர்கள்’ என்ற சாத்தியமும் அடிக்குறிப்பில் பேணப்படுகிறது.
- source_word: הָאָרֶץ
  choice: நாடு
  rationale: இங்கு இஸ்ரவேல் நுழைந்து உரிமையாக்கவிருக்கும் வாக்குறுதியின் நிலப்பரப்பைக் குறிக்கும் இயல்பான தமிழ்ச்சொல்.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரேய மெய்யெழுத்துப் பெயரான YHWH-ஐ ஒரு பொதுப்பட்டத்தால் மாற்றாமல், உடன்படிக்கைப் பெயராக வெளிப்படுத்துகிறது.
- source_word: אֱלֹהֵי אֲבֹתֵיכֶם
  choice: உங்கள் முன்னோர்களின் கடவுள்
  rationale: தமிழில் இயல்பாகவும் உள்ளடக்கத்தின் மூதாதையர் சார்ந்த உடன்படிக்கைச் சூத்திரத்தைத் தெளிவாகவும் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூலவசனம் நான்கெழுத்து இறைப்பெயரை நேரடியாகப் பயன்படுத்துகிறது. அதை பொதுப்பட்டமாக மாற்றாமல் பெயராகவே தருவது மூலத்தின் உடன்படிக்கைச் சிறப்பைப் பேணுகிறது.
- issue: לְמַעַן தொடங்கும் தொடரின் நோக்கம்/விளைவு உறவு
  choice: அப்போது நீங்கள் வாழ்வீர்கள்
  alternative: நீங்கள் வாழும்படியாக
  rationale: எபிரேயத்தில் நோக்கத்தையும் எதிர்பார்க்கப்படும் விளைவையும் தாங்கக்கூடிய தொடர்பைத் தமிழ் வாக்கிய ஓட்டத்தில் இயல்பாக வைத்திருக்கிறது; வாழ்வை வெறும் நிபந்தனைக்குரிய சட்டவாதக் கூற்றாக விரிவுபடுத்தவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகருக்கு விளங்கும் கண்ணியமான உரைநடை பயன்படுத்தப்பட்டுள்ளது. ‘இஸ்ரவேலே ... செவிகொடு’ என்பதில் எபிரேயத்தின் ஒருமை அழைப்பு பேணப்பட்டுள்ளது; தொடரும் ‘நீங்கள்’ வடிவங்கள் சமூகமாகிய இஸ்ரவேலைக் குறிக்கும் எபிரேயப் பன்மையைப் பிரதிபலிக்கின்றன. ‘பிதாக்கள்’ போன்ற பழமையான சமயச் சொல்லுக்கு மாற்றாக ‘முன்னோர்கள்’ பயன்படுத்தப்பட்டுள்ளது.
