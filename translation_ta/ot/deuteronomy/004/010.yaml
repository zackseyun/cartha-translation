revisions:
- from: ஓரேபில் உன் கடவுளாகிய யாவேக்கு முன்பாக நீ நின்ற நாளில், யாவே என்னிடம், “மக்களை என்னிடம் ஒன்றுகூட்டு. நான் என் வார்த்தைகளை அவர்கள் கேட்கச் செய்வேன். அவர்கள் பூமியில்[a] உயிரோடிருக்கும் நாளெல்லாம் எனக்கு அஞ்சக் கற்றுக்கொண்டு, தங்கள் பிள்ளைகளுக்கும் கற்பிக்கட்டும்” என்றார்.
  to: ஓரேபில் உன் கடவுளாகிய யாவேக்கு முன்பாக நீ நின்ற நாளில், யாவே என்னிடம், “மக்களை என்னிடம் கூட்டிச்சேர்; நான் என் வார்த்தைகளை அவர்கள் கேட்கச் செய்வேன். அவர்கள் பூமியில்[a] வாழும் நாட்களெல்லாம் எனக்கு அஞ்சக் கற்றுக்கொள்வதற்கும், தங்கள் பிள்ளைகளுக்குக் கற்பிப்பதற்கும்” என்றார்.
  rationale: The revision retains the Hebrew temporal and covenantal framing, the causal force of “I will make them hear,” and the ambiguity of אֲדָמָה. It replaces an imperative-like Tamil ending with coordinated purpose infinitives, matching the Hebrew sequence in which hearing Yahweh’s words leads to lifelong fear of him and teaching the children. It also makes the gathering command and footnote more idiomatic.
