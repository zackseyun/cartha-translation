base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/010.yaml
  text: the day when you stood before Yahweh your God at Horeb[a], when Yahweh said to me, ‘Assemble the people to me, and I will let them hear my words, so that they may learn to fear me all the days that they live on the earth, and that they may teach their children.’
translation:
  language: ta
  text: ஓரேபில் உன் கடவுளாகிய யாவேக்கு முன்பாக நீ நின்ற நாளில், யாவே என்னிடம், “மக்களை என்னிடம் கூட்டிச்சேர்; நான் என் வார்த்தைகளை அவர்கள் கேட்கச் செய்வேன். அவர்கள் பூமியில்[a] வாழும் நாட்களெல்லாம் எனக்கு அஞ்சக் கற்றுக்கொள்வதற்கும், தங்கள் பிள்ளைகளுக்குக் கற்பிப்பதற்கும்” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நாட்டில்.” எபிரெயச் சொல்லான אֲדָמָה பொதுவாகப் பூமி அல்லது நிலப்பரப்பைக் குறிக்கலாம்; குறிப்பாக ஒரு நாட்டையும் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: י֗וֹם אֲשֶׁר
  choice: நின்ற நாளில்
  rationale: நினைவுகூரப்படும் நிகழ்வின் காலத்தைச் சுட்டும் எபிரெய உறவுநிலைத் தொடரை இயல்பான தமிழில் காலவினையடையாக வழங்குகிறது; முந்தைய வசனத்திலிருந்து தொடரும் வாக்கியத் தொடர்பையும் தேவையற்ற சொற்களைச் சேர்க்காமல் காக்கிறது.
- source_word: עָמַדְתָּ לִפְנֵי
  choice: நீ நின்ற
  rationale: கடவுளின் முன்னிலையில் இஸ்ரவேல் நின்ற உடன்படிக்கைச் சூழலின் நேரடியான காட்சியைத் தக்கவைக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய நான்கெழுத்துத் தெய்வீகப் பெயரை ஒரு பட்டப்பெயரால் மாற்றாமல், தமிழில் அதன் பெயரொலிக்கு அண்மையாக எழுத்துப்பெயர்க்கிறது.
- source_word: אֱלֹהֶיךָ
  choice: உன் கடவுளாகிய
  rationale: இரண்டாம் நபர் ஒருமை உடைமைத் தொடர்பையும் உடன்படிக்கை உறவையும் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: בְּחֹרֵב
  choice: ஓரேபில்
  rationale: இடப்பெயரைத் தமிழில் இயல்பாக எழுத்துப்பெயர்த்து, இருப்பிட வேற்றுமையைத் தக்கவைக்கிறது.
- source_word: הַקְהֶל לִי אֶת־הָעָם
  choice: மக்களை என்னிடம் ஒன்றுகூட்டு
  rationale: קהל என்பதன் காரணவினை ஏவல் பொருளான ‘ஒன்றுகூடச் செய்’ என்பதையும் לִי என்பதன் ‘என்னிடம்’ என்ற திசைப்பொருளையும் காக்கிறது.
- source_word: וְאַשְׁמִעֵם
  choice: நான் என் வார்த்தைகளை அவர்கள் கேட்கச் செய்வேன்
  rationale: שמע என்பதன் காரணவினை வடிவை ‘கேட்கச் செய்வேன்’ என்று வெளிப்படையாகத் தருகிறது.
- source_word: דְּבָרָי
  choice: என் வார்த்தைகளை
  rationale: மூலத்தில் உள்ள பன்மையையும் கடவுள் பேசிய சொற்கள் என்ற நேரடிப் பொருளையும் தக்கவைக்கிறது.
- source_word: אֲשֶׁר יִלְמְדוּן לְיִרְאָה אֹתִי
  choice: எனக்கு அஞ்சக் கற்றுக்கொண்டு
  rationale: நோக்கப்பொருளையும் ירא என்பதிலுள்ள அச்சம், பயபக்தி, கீழ்ப்படிதல் ஆகியவற்றின் தீவிரத்தையும் ‘அஞ்ச’ என்பதன் மூலம் மென்மைப்படுத்தாமல் காக்கிறது.
- source_word: כָּל־הַיָּמִים אֲשֶׁר הֵם חַיִּים
  choice: உயிரோடிருக்கும் நாளெல்லாம்
  rationale: வாழ்நாள் முழுவதையும் குறிக்கும் எபிரெய வழக்கை சுருக்கமான, இயல்பான தமிழில் தருகிறது.
- source_word: עַל־הָאֲדָמָה
  choice: பூமியில்
  rationale: אֲדָמָה என்பதன் பொதுவான ‘பூமி/நிலம்’ பொருளைத் தருகிறது; வாக்கியத்தை வாக்குத்தத்த நாட்டிற்கே முன்கூட்டியே கட்டுப்படுத்தாத தேர்வு.
- source_word: בְּנֵיהֶם
  choice: தங்கள் பிள்ளைகளுக்கும்
  rationale: இங்கு ஆண் பாலிலக்கண வடிவம் பொதுவாக சந்ததியினரைக் குறிக்கிறது; ‘பிள்ளைகள்’ என்பது பாலின வரம்பைத் தேவையின்றி சேர்க்காமல் பொருளை வழங்குகிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: யெகோவா; ஆண்டவர்
  rationale: மூலத்தில் தனிப்பட்ட உடன்படிக்கைப் பெயர் நேரடியாக உள்ளது. அதை ஒரு பட்டப்பெயரால் மாற்றாமல், பரவலாக ஏற்றுக்கொள்ளப்படும் ஒலிப்புக்கு அண்மையாக எழுத்துப்பெயர்க்கிறது.
- issue: உடன்படிக்கைச் சூழலில் ירא என்பதன் பொருள்
  choice: எனக்கு அஞ்ச
  alternative: என்னைப் பயபக்தியுடன் போற்ற
  rationale: ‘அஞ்ச’ என்பது மூலத்தின் பயம், மரியாதை, கீழ்ப்படிதல் ஆகியவற்றுக்கிடையிலான இறையியல் அழுத்தத்தைத் தக்கவைக்கிறது; ‘போற்ற’ மட்டும் பொருளை மென்மைப்படுத்தக்கூடும்.
- issue: בנים என்பதன் குறிப்பு
  choice: பிள்ளைகள்
  alternative: மகன்கள்
  rationale: சூழலில் அடுத்த தலைமுறையினர் பொதுவாகக் குறிக்கப்படுகிறார்கள்; இலக்கண ஆண்பாலை உயிரியல் ஆண்களுக்கு மட்டும் வரையறுப்பது மூல நோக்கத்தைச் சுருக்கும்.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு விளங்கும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. தெய்வீகப் பெயர் ‘யாவே’ என்று எழுத்துப்பெயர்க்கப்பட்டுள்ளது. வசனம் முந்தைய வாக்கியத்துடன் இலக்கண ரீதியாகத் தொடருவதால், தொடக்கத்தில் மூலத்தில் இல்லாத ‘நினைத்துக்கொள்’ போன்ற வினை சேர்க்கப்படவில்லை. மேற்கோளுக்குள் ஏவல், காரணவினை, நோக்கம் ஆகியவை இயல்பான தமிழில் தெளிவுபடுத்தப்பட்டுள்ளன.
