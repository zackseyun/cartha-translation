    text: ‘உருவம்’ (תַּבְנִית) என்பதற்கு ‘சாயல்’ அல்லது ‘படிமம்’ என்றும் மொழிபெயர்க்கலாம்; இங்கு அது வழிபாட்டுக்காகச் செய்யப்பட்ட ஒரு பிரதிநிதித்துவத்தைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: ‘வானத்தில்’ என்பதற்கு ‘வானவெளியில்’ என்றும் மொழிபெயர்க்கலாம். எபிரெய மொழியில் இச்சொல் பன்மை வடிவில் உள்ளது; அது கண்களுக்குத் தெரியும் வானத்தைக் குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּבְנִית
  choice: உருவம்
  rationale: வழிபாட்டுக்காகச் செய்யப்படும் காணக்கூடிய பிரதிநிதித்துவத்தை இச்சூழலில் குறிக்கிறது; ‘உருவம்’ இயல்பான தமிழாகவும் இருமுறை வரும் எபிரெயச் சொல்லை ஒரேவிதமாகவும் எடுத்துரைக்கிறது.
- source_word: כָּל
  choice: எந்த
  rationale: ஒருமை வகைப்பெயர்களுடன் வரும் כָּל, தடைச் சூழலில் அந்த வகையைச் சேர்ந்த எதையும் உள்ளடக்கும் பொருளைத் தருவதால் ‘எந்த’ என மொழிபெயர்க்கப்பட்டது.
- source_word: בְּהֵמָה
  choice: மிருகம்
  rationale: இங்கு வீட்டு கால்நடைகளை மட்டும் அல்லாமல் நிலத்தில் வாழும் விலங்குகளைப் பொதுவாகக் குறிக்கிறது; உயர்நடையுடனும் இயல்பாகவும் ‘மிருகம்’ பொருந்துகிறது.
- source_word: אֲשֶׁר בָּאָרֶץ
  choice: பூமியில் வாழும்
  rationale: சொற்பொருளான ‘பூமியில் இருக்கும்’ என்பதை இயல்பான தமிழில் உயிரினத்தைக் குறிக்கும் வகையில் வழங்குகிறது; வானத்துடனான இடவியல் வேறுபாடும் காக்கப்படுகிறது.
- source_word: צִפּוֹר כָּנָף
  choice: சிறகுள்ள பறவை
  rationale: எபிரெயக் கட்டமைப்பின் விளக்கத் தன்மையைக் காத்து, நவீன தமிழில் இயல்பாக ஒலிக்கிறது.
- source_word: תָּעוּף
  choice: பறக்கும்
  rationale: ஒரு பொதுவான உயிரின வகையின் இயல்பான செயலைக் குறிக்கும் எபிரெய வினையைத் தமிழ் பெயரெச்சமாக இயல்பாக வழங்குகிறது.
- source_word: בַּשָּׁמָיִם
  choice: வானங்களில்
  rationale: எபிரெய மொழியின் பன்மை வடிவத்தைப் பாதுகாக்கிறது; இச்சூழலில் அது கண்களுக்குத் தெரியும் வானவெளியையும் குறிக்கலாம்.
