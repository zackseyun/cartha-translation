translation_notes:
  register: நவீனத் தரத் தமிழில், வேதாகமப் பட்டியலுக்கேற்ற கண்ணியமான நடையுடன் மொழிபெயர்க்கப்பட்டது. வசனம் தொடரும் வாக்கியத் துணுக்காக இருப்பதால் இறுதியில் காற்புள்ளி வைக்கப்பட்டுள்ளது. இருமுறை வரும் תַּבְנִית ஒரே சொல்லால் வழங்கப்பட்டு, இணையான அமைப்பு பாதுகாக்கப்பட்டது.
