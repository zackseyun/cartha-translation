revisions:
- from: நீங்கள் சீர்கெட்டுச் செயல்பட்டு, ஆணோ பெண்ணோ போன்ற எந்த உருவத்தின் வடிவிலும் உங்களுக்காக ஒரு செதுக்கப்பட்ட சிலையைச் செய்துவிடாதபடி எச்சரிக்கையாக இருங்கள்.[a]
  to: நீங்கள் சீர்கெட்டுச் செயல்பட்டு, உங்களுக்காக எந்தப் படிமத்தின் வடிவிலாயினும், ஆண் அல்லது பெண்ணின் சாயலிலாயினும், ஒரு செதுக்கப்பட்ட படிமத்தைச் செய்துகொள்ளாதபடி.[a]
  rationale: மூலத்தில் வெளிப்படையாக இல்லாத நேரடிக் கட்டளை நீக்கப்பட்டது. மூன்று உருவச் சொற்களின் அடுக்கைத் தமிழில் ‘செதுக்கப்பட்ட படிமம் / படிமத்தின் வடிவு / சாயல்’ எனக் காத்து, ‘ஆண் அல்லது பெண்’ என்பது இறுதியான குறிப்பாக்கமாக அமையத் திருத்தப்பட்டது. அடுத்த வசனத்திலும் தொடரும் எபிரெயப் பட்டியலின் திறந்த தொடரமைப்பைக் குறிக்கும் நிறுத்தற்குறியும் பேணப்பட்டது.
