source:
  edition: WLC
  text: פֶּ֨ן תַּשְׁחִת֔וּ/ן וַ/עֲשִׂיתֶ֥ם לָ/כֶ֛ם פֶּ֖סֶל תְּמוּנַ֣ת כָּל סָ֑מֶל תַּבְנִ֥ית זָכָ֖ר א֥וֹ נְקֵבָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/016.yaml
  text: so that you do not act corruptly and make for yourselves a carved image[a], in the form of any figure, the likeness of male or female—
translation:
  language: ta
  text: நீங்கள் சீர்கெட்டுச் செயல்பட்டு, உங்களுக்காக எந்தப் படிமத்தின் வடிவிலாயினும், ஆண் அல்லது பெண்ணின் சாயலிலாயினும், ஒரு செதுக்கப்பட்ட படிமத்தைச் செய்துகொள்ளாதபடி.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது: “நீங்கள் உங்களையே சீரழித்துக்கொண்டு, உங்களுக்காக எந்தப் படிமத்தின் வடிவிலாயினும், ஆண் அல்லது பெண்ணின் சாயலிலாயினும், ஒரு செதுக்கப்பட்ட படிமத்தைச் செய்துகொள்ளாதபடி.”'
    reason: תַּשְׁחִתוּן என்பதன் ‘உங்களையே சீரழித்துக்கொண்டு’ என்ற பிரதிபலிப்பு நுணுக்கத்தையும், פֶּן தொடரின் மாற்று அமைப்பையும் காட்டுகிறது.
lexical_decisions:
- source_word: פֶּן
  choice: செய்துவிடாதபடி எச்சரிக்கையாக இருங்கள்
  rationale: פֶּן விரும்பத்தகாத விளைவைப் பற்றிய எச்சரிக்கையை அறிமுகப்படுத்துகிறது. முந்தைய வசனத்தின் சூழலில் தமிழில் இயல்பாக இணைக்க ‘எச்சரிக்கையாக இருங்கள்’ வெளிப்படையாகச் சேர்க்கப்பட்டுள்ளது.
- source_word: תַּשְׁחִתוּן
  choice: சீர்கெட்டுச் செயல்பட்டு
  rationale: שׁחת என்பதன் ஹிஃபில் வடிவம் இங்கு உடன்படிக்கை மீறலில் அழிவுக்கேதுவாக அல்லது ஒழுக்கக்கேடாகச் செயல்படுவதைக் குறிக்கிறது; செயப்பாட்டு நுணுக்கத்தை இது காக்கிறது.
- source_word: וַעֲשִׂיתֶם לָכֶם
  choice: உங்களுக்காக ... செய்துவிடாதபடி
  rationale: לָכֶם என்பதிலுள்ள தனக்காகச் செய்துகொள்ளும் பயனிலைப் பொருளை ‘உங்களுக்காக’ காக்கிறது.
- source_word: פֶּסֶל
  choice: செதுக்கப்பட்ட சிலை
  rationale: செதுக்கி அல்லது வடித்து உருவாக்கப்பட்ட வழிபாட்டு உருவைக் குறிக்கும் சொல்லின் பொருளைத் தெளிவாகவும் நவீனத் தமிழிலும் தருகிறது.
- source_word: תְּמוּנַת כָּל סָמֶל
  choice: எந்த உருவத்தின் வடிவிலும்
  rationale: இரு ஒன்றோடொன்று தொடர்புடைய உருவச் சொற்களையும் ‘உருவம்/வடிவு’ என வேறுபடுத்திக் காட்டுகிறது; סמל என்பதை ‘விக்கிரகம்’ என்று மொழிபெயர்த்து பொருளைத் தேவையின்றிக் குறுக்கவில்லை.
- source_word: תַּבְנִית זָכָר אֹו נְקֵבָה
  choice: ஆணோ பெண்ணோ போன்ற
  rationale: תַּבְנִית இங்கு ஒப்புரு அல்லது சாயலைக் குறிக்கிறது; זָכָר/נְקֵבָה என்பவற்றை மனித உருவங்களைக் குறிக்கும் இந்தச் சூழலில் இயல்பான தமிழில் தருகிறது.
theological_decisions:
- issue: விக்கிரக வழிபாட்டுக்கு எதிரான உருவச் சொற்களின் மொழிபெயர்ப்பு
  choice: פֶּסֶל என்பதை ‘செதுக்கப்பட்ட சிலை’ என்றும் סָמֶל என்பதை ‘உருவம்’ என்றும் வேறுபடுத்துதல்
  alternative: இரண்டையும் ‘விக்கிரகம்’ அல்லது ‘சிலை’ என்று மொழிபெயர்த்தல்
  rationale: எபிரெய உரையின் அடுக்கப்பட்ட வெவ்வேறு சொற்களை ஒரே சொல்லாகத் தட்டையாக்காமல் காக்கிறது. அதேவேளை, סָמֶל என்பதை கட்டாயமாக ‘விக்கிரகம்’ எனக் குறுக்காமல் அதன் உருவம்/பிரதிநிதித்துவம் என்ற பரப்பையும் பாதுகாக்கிறது.
translation_notes:
  register: நவீன தரத்தமிழில் கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் நடை. வசனம் 15-ன் எச்சரிக்கைத் தொடரைத் தமிழில் முழுமையான வாக்கியமாக்க ‘எச்சரிக்கையாக இருங்கள்’ சேர்க்கப்பட்டது. மூலத்தில் முடிவடையாமல் அடுத்த வசனத்துக்குத் தொடரும் பட்டியல் இருப்பதால், தமிழ்ப் பதிப்பில் தொடர்ச்சியை உணர்த்தும் சூழல் பேணப்பட வேண்டும்.
