    issue: மூலத்தில் இல்லாத ‘எச்சரிக்கையாக இருங்கள்’ சேர்க்கப்பட்டுள்ளது.
    rationale: פֶּן என்பது எச்சரிக்கையான விளைவு உட்பிரிவை அறிமுகப்படுத்துகிறது; அது தனி நேரடிக் கட்டளையை வழங்கவில்லை. முந்தைய வசனத்தின் சார்பைத் தமிழில் தொடரமைப்பால் காட்டலாம்.
