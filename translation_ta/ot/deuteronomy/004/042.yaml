revisions:
- from: அறியாமல்[a] தன் அயலானைக் கொன்றவனும், முன்பு[b] அவனைப் பகைத்திருக்காதவனுமான ஒருவன் அங்கே தப்பியோடுவதற்காகவும், இந்த நகரங்களில் ஒன்றுக்குத் தப்பியோடி உயிர்வாழுவதற்காகவும்.
  to: அறியாமல்[a] தன் அயலானைக் கொன்ற ஒருவன், முன்பு[b] அவனைப் பகைத்திருக்காதவன், அங்கே இந்த நகரங்களில் ஒன்றுக்குத் தப்பியோடி உயிர்வாழும்படியாக.
  rationale: 'The revision retains the verse as a purposive continuation of the preceding verse while expressing that purpose only once. It follows the Hebrew order and sense: a person who kills a neighbor without knowledge and without prior hatred may flee to one of the specified cities and remain alive. Footnote anchors and their lexical explanations are retained.'
