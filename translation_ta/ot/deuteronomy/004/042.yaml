source:
  edition: WLC
  text: לָ/נֻ֨ס שָׁ֜מָּ/ה רוֹצֵ֗חַ אֲשֶׁ֨ר יִרְצַ֤ח אֶת רֵעֵ֨/הוּ֙ בִּ/בְלִי דַ֔עַת וְ/ה֛וּא לֹא שֹׂנֵ֥א ל֖/וֹ מִ/תְּמ֣וֹל שִׁלְשׁ֑וֹם וְ/נָ֗ס אֶל אַחַ֛ת מִן הֶ/עָרִ֥ים הָ/אֵ֖ל וָ/חָֽי־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/042.yaml
  text: so that a manslayer who kills his neighbor unintentionally[a], without knowledge, and was not hating him previously[b], may flee there to one of these cities and live.
translation:
  language: ta
  text: அறியாமல்[a] தன் அயலானைக் கொன்ற ஒருவன், முன்பு[b] அவனைப் பகைத்திருக்காதவன், அங்கே இந்த நகரங்களில் ஒன்றுக்குத் தப்பியோடி உயிர்வாழும்படியாக.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: நேர்ச்சொல்லாக, ‘அறிவு இல்லாமல்.’ இந்தச் சட்டச் சூழலில், அறியாமலோ கொல்லும் நோக்கமில்லாமலோ நிகழ்ந்ததைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: நேர்ச்சொல்லாக, ‘நேற்றிலிருந்தோ அதற்கு முந்தின நாளிலிருந்தோ.’ இது ‘முன்பு’ அல்லது ‘ஏற்கெனவே’ என்னும் பொருளுடைய மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָנֻס שָׁמָּה
  choice: அங்கே தப்பியோடுவதற்காகவும்
  rationale: ל prefixed infinitive expresses purpose and continues the action of setting apart the cities in the preceding verse. The Tamil purposive construction preserves that connection.
- source_word: רוֹצֵחַ אֲשֶׁר יִרְצַח
  choice: கொன்றவனுமான ஒருவன்
  rationale: In the refuge-city law this denotes a person who caused a death, without yet labeling the act as culpable murder. ‘கொலைகாரன்’ would imply guilt more strongly than the context permits.
- source_word: רֵעֵהוּ
  choice: தன் அயலானை
  rationale: ‘அயலான்’ naturally expresses a fellow person or neighbor in this legal-relational context.
- source_word: בִּבְלִי דַעַת
  choice: அறியாமல்[a]
  rationale: This closely reflects the Hebrew ‘without knowledge’ while naturally allowing the contextual sense of an unwitting or unintentional killing.
- source_word: וְהוּא לֹא שֹׂנֵא לוֹ
  choice: அவனைப் பகைத்திருக்காதவனுமான
  rationale: The perfect-like Tamil construction conveys the continuing hostile disposition denied by the Hebrew participle.
- source_word: מִתְּמוֹל שִׁלְשׁוֹם
  choice: முன்பு[b]
  rationale: The Hebrew idiom literally refers to yesterday and the day before but conventionally means formerly or previously.
- source_word: אֶל אַחַת מִן הֶעָרִים הָאֵל
  choice: இந்த நகரங்களில் ஒன்றுக்கு
  rationale: ‘இந்த’ preserves the Hebrew demonstrative and points to the cities just identified.
- source_word: וָחָי
  choice: உயிர்வாழுவதற்காகவும்
  rationale: Within the verse’s purpose construction, this expresses the intended outcome—escaping to a city and remaining alive—while linking smoothly to the preceding verse in Tamil.
theological_decisions: []
translation_notes:
  register: Modern standard Tamil in a dignified legal-narrative register. The verse is intentionally phrased as a syntactic continuation of verse 41, matching the Hebrew purpose construction. Potentially prejudicial ‘கொலைகாரன்’ is avoided, and the source text’s distinction between causing death and culpable murder is retained.
