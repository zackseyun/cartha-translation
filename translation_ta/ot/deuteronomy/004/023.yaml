  text: הִשָּׁמְר֣וּ לָ/כֶ֗ם פֶּֽן תִּשְׁכְּחוּ֙ אֶת בְּרִ֤ית יְהוָה֙ אֱלֹ֣הֵי/כֶ֔ם אֲשֶׁ֥ר כָּרַ֖ת עִמָּ/כֶ֑ם וַ/עֲשִׂיתֶ֨ם לָ/כֶ֥ם פֶּ֨סֶל֙ תְּמ֣וּנַת כֹּ֔ל אֲשֶׁ֥ר צִוְּ/ךָ֖ יְהוָ֥ה אֱלֹהֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/023.yaml
  text: Watch yourselves[a], lest you forget the covenant of Yahweh your God that he made with you, and make for yourselves a carved image, the likeness of anything that Yahweh your God has commanded you not to make.
translation:
  language: ta
  text: கவனமாக இருங்கள். உங்கள் கடவுளாகிய யாவே உங்களோடு செய்த உடன்படிக்கையை மறந்து, உங்கள் கடவுளாகிய யாவே நீங்கள் செய்யக்கூடாது என்று கட்டளையிட்ட[a] எந்த வடிவத்திலும் உங்களுக்கென்று செதுக்கப்பட்ட உருவம் ஒன்றைச் செய்துவிடாதீர்கள்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொற்சொல்லாக, “உன் கடவுளாகிய யாவே உனக்குக் கட்டளையிட்ட.” “செய்யக்கூடாது” என்ற தடை சூழலிலிருந்து உள்ளடங்கியுள்ளது; உபாகமம் 4:16-ஐ ஒப்பிடுக.
    reason: மூலத்தில் வெளிப்படையாக இல்லாத எதிர்மறைப் பொருள் சூழலின் அடிப்படையில் உரையில் தெளிவாக்கப்பட்டுள்ளது.
  - marker: b
    text: இந்த வசனத்தின் தொடக்கத்தில் எபிரெயம் பன்மையைப் பயன்படுத்துகிறது; இறுதிக் கூறில் இஸ்ரவேலைக் கூட்டுத்தொகையாகக் கருதி ஒருமைக்கு மாறுகிறது.
    reason: எபிரெயத்தின் எண்ணிக்கை மாற்றம் இயல்பான தமிழுக்காக முதன்மை உரையில் ஒரே பன்மையாக வழங்கப்பட்டுள்ளது.
lexical_decisions:
- source_word: הִשָּׁמְרוּ לָכֶם
  choice: உங்களைக் குறித்து எச்சரிக்கையாக இருங்கள்
  rationale: நிபால் கட்டளை வடிவமும் לָכֶם என்பதும் ஒருவர் தம்மைக் குறித்து விழிப்புடனும் எச்சரிக்கையுடனும் இருக்க வேண்டும் என்ற எச்சரிப்பைக் கொடுக்கின்றன. இத்தமிழாக்கம் அதன் தற்சார்பு வலியுறுத்தலை இயல்பான நவீன தமிழில் காக்கிறது.
- source_word: פֶּן
  choice: மறந்து ... செய்துவிடாதீர்கள்
  rationale: פֶּן எச்சரிக்கப்படும் எதிர்மறை விளைவை அறிமுகப்படுத்துகிறது. தமிழில் ‘செய்துவிடாதீர்கள்’ என்ற அமைப்பு அந்த அபாய எச்சரிப்பை இயல்பாகத் தெரிவிக்கிறது.
- source_word: בְּרִית
  choice: உடன்படிக்கை
  rationale: கடவுளுக்கும் இஸ்ரவேலுக்கும் இடையிலான கட்டுப்படுத்தும் உறவைத் தெரிவிக்கும் நிலையான, பொருத்தமான தமிழ்ச் சொல்.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரை ஒரு பட்டப்பெயரால் மாற்றாமல், எபிரெய நான்கெழுத்துப் பெயரின் வழக்கமான தமிழெழுத்துப்பெயர்ப்பாக வழங்குகிறது.
- source_word: אֲשֶׁר כָּרַת עִמָּכֶם
  choice: உங்களோடு செய்த
  rationale: כרת ברית என்பதன் சொற்சொல் வடிவம் ‘உடன்படிக்கையை வெட்டுதல்’ என்றாலும், அது உடன்படிக்கை செய்தல் என்ற எபிரெய மரபுத்தொடர்; தமிழில் பொருள் தெளிவாகத் தரப்பட்டுள்ளது.
- source_word: וַעֲשִׂיתֶם לָכֶם
  choice: உங்களுக்காக ... செய்துவிடாதீர்கள்
  rationale: לָכֶם என்பதிலுள்ள தமக்காகச் செய்துகொள்ளும் பயன்நோக்குப் பொருளை ‘உங்களுக்காக’ காக்கிறது.
- source_word: פֶּסֶל
  choice: ஒரு செதுக்கப்பட்ட உருவம்
  rationale: פסל என்பது குறிப்பாகச் செதுக்கி வடிவமைக்கப்பட்ட உருவத்தைக் குறிக்கிறது; பொதுவான ‘விக்கிரகம்’ என்பதைவிட மூலச்சொல்லின் காட்சிப்பூர்வமான பொருளை நெருக்கமாகக் காக்கிறது.
- source_word: תְּמוּנַת כֹּל
  choice: எந்த ஒன்றின் சாயலிலும்
  rationale: תמונה என்பதிலுள்ள வடிவம் அல்லது பிரதிநிதித்துவச் சாயல் என்ற கருத்தை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: אֲשֶׁר צִוְּךָ יְהוָה אֱלֹהֶיךָ
  choice: உங்கள் கடவுளாகிய யாவே நீங்கள் செய்யக்கூடாது என்று கட்டளையிட்ட
  rationale: எபிரெயத்தில் எதிர்மறைச் சொல் வெளிப்படையாக இல்லாவிட்டாலும், 4:16 உட்பட உடனடிச் சூழல் உருவம் செய்யக்கூடாது என்ற தடையைத் தெளிவாக்குகிறது. தவறான எதிர்ப்பொருள் தோன்றாமல் இருக்க உள்ளடங்கிய மறுப்பு உரையில் வெளிப்படுத்தப்பட்டுள்ளது.
theological_decisions:
- issue: இறுதி உறவுப்பெயர்க் கூறில் உள்ளடங்கிய மறுப்பு
  choice: ‘நீங்கள் செய்யக்கூடாது என்று கட்டளையிட்ட’ எனத் தடைப் பொருளை வெளிப்படையாக மொழிபெயர்த்தல்
  alternative: ‘உங்களுக்குக் கட்டளையிட்ட’ என்று சொற்சொல்லாக மொழிபெயர்த்து, மறுப்பைச் சூழலிலிருந்து வாசகர் புரிந்துகொள்ள விடுதல்
  rationale: மோசே உருவம் செய்வதற்கு எதிராகவே எச்சரிக்கிறார்; உபாகமம் 4:16 இதை வெளிப்படையாகக் கூறுகிறது. மறுப்பைச் சேர்க்காத தமிழ் வாசகம், கடவுளே உருவம் செய்யும்படி கட்டளையிட்டார் என்ற எதிர்ப்பொருளைத் தரக்கூடும். எனவே உள்ளடங்கிய மறுப்பு உரையில் தரப்பட்டு அடிக்குறிப்பில் ஆவணப்படுத்தப்படுகிறது.
- issue: பன்மையிலிருந்து ஒருமைக்கு மாறும் எபிரெய உரை
  choice: தமிழ் முதன்மை உரையில் கூட்டத்தைக் குறிக்கும் மரியாதைப் பன்மையைத் தொடர்ந்து பயன்படுத்துதல்
  alternative: இறுதிக் கூறில் மட்டும் ‘உன் கடவுள் உனக்குக் கட்டளையிட்ட’ என்று ஒருமைக்கு மாறுதல்
  rationale: எபிரெயத்தில் இஸ்ரவேலைப் பன்மையிலும் கூட்டுத்தொகை ஒருமையிலும் அழைக்கும் மாறுதல் உண்டு. தமிழில் திடீர் மாற்றம் வேறு நபரைச் சுட்டுவது போல் தவறாகப் புரியக்கூடும்; ஆகவே பொருள் தெளிவுக்காகப் பன்மை தொடரப்பட்டு, மூலவடிவம் அடிக்குறிப்பில் குறிப்பிடப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியக்கூடியதாயும் அதே நேரத்தில் எச்சரிப்பின் கண்ணியமான, தீவிரமான தொனியைத் தக்கவைத்தும் வடிவமைக்கப்பட்டது. ‘யாவே’ தனிப்பெயராகப் பாதுகாக்கப்பட்டுள்ளது; பழமையான அல்லது சமயப்பிரிவு சார்ந்த சொற்கள் தவிர்க்கப்பட்டுள்ளன.
