  text: וַ/יִּֽירְשׁ֨וּ אֶת אַרְצ֜/וֹ וְ/אֶת אֶ֣רֶץ ע֣וֹג מֶֽלֶךְ הַ/בָּשָׁ֗ן שְׁנֵי֙ מַלְכֵ֣י הָֽ/אֱמֹרִ֔י אֲשֶׁ֖ר בְּ/עֵ֣בֶר הַ/יַּרְדֵּ֑ן מִזְרַ֖ח שָֽׁמֶשׁ־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/047.yaml
  text: and they took possession of his land[a], and the land of Og king of Bashan—the two kings of the Amorites who were beyond the Jordan[b], toward the sunrise.
translation:
  language: ta
  text: அவர்கள் அவனுடைய நாட்டையும் பாசான் அரசன் ஓகின் நாட்டையும் கைப்பற்றிக்கொண்டார்கள்—இவர்கள் யோர்தானுக்கு அப்பால்[a], சூரியன் உதிக்கும் திசையில்[b] இருந்த எமோரியரின் இரண்டு அரசர்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “யோர்தானுக்கு மறுபுறத்தில்” என்றும் மொழிபெயர்க்கலாம். இது வழக்கமான எபிரெயப் புவியியல் மரபுத்தொடர்; எந்தப் பக்கத்திலிருந்து பார்க்கப்படுகிறது என்பது உரையின் பார்வைநிலையைச் சார்ந்தது.
    reason: lexical_alternative
  - marker: b
    text: அதாவது, கிழக்குத் திசையில்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּירְשׁוּ
  choice: கைப்பற்றிக்கொண்டார்கள்
  rationale: ירשׁ என்பது வெற்றிகொண்டு ஒரு நாட்டைத் தமதாக்கும் சூழலில் ‘கைப்பற்றி உடைமையாக்குதல்’ என்ற பொருளைத் தருகிறது. ‘கைப்பற்றிக்கொண்டார்கள்’ என்பது வெறும் உடைமையைவிட வெற்றிகொள்ளும் நுணுக்கத்தையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: אַרְצוֹ
  choice: அவனுடைய நாட்டை
  rationale: மூன்றாம் நபர் ஆண்பால் ஒருமை விகுதி முந்தைய சூழலில் குறிப்பிடப்பட்ட சீகோனைச் சுட்டுகிறது. ‘நாடு’ என்பது இங்குள்ள அரசியல்-புவியியல் பொருளுக்கு இயல்பானது.
- source_word: אֶרֶץ עוֹג מֶלֶךְ הַבָּשָׁן
  choice: பாசான் அரசன் ஓகின் நாட்டை
  rationale: எபிரெயக் கட்டமைப்பைத் தெளிவான தமிழ் உடைமைத் தொடராக வழங்குகிறது; முந்தைய ‘நாடு’ என்பதுடனும் ஒத்திசைகிறது.
- source_word: שְׁנֵי מַלְכֵי הָאֱמֹרִי
  choice: எமோரியரின் இரண்டு அரசர்கள்
  rationale: எமோரிய மக்களோடு தொடர்புடைய இரு அரசர்களைக் குறிக்கும் எபிரெயத் தொடரை நேரடியாகவும் தெளிவாகவும் வழங்குகிறது.
- source_word: בְּעֵבֶר הַיַּרְדֵּן
  choice: யோர்தானுக்கு அப்பால்
  rationale: இது வழக்கமான புவியியல் மரபுத்தொடர். ‘அப்பால்’ என்பது எந்தப் பக்கத்திலிருந்து பார்க்கப்படுகிறது என்பதைத் தீர்மானிக்காமல் மூலத்தின் பார்வைநிலை சார்ந்த தன்மையைப் பாதுகாக்கிறது.
- source_word: מִזְרַח שָׁמֶשׁ
  choice: சூரியன் உதிக்கும் திசையில்
  rationale: கிழக்கைக் குறிக்கும் மூலமொழியின் தெளிவான ‘சூரிய உதயம்’ உருவகத்தை இயல்பான தமிழில் பாதுகாக்கிறது.
