  source_fidelity: 'முதல் இரண்டு வாக்கியப்பகுதிகள் எபிரெய மூலத்துக்கு உண்மையாக உள்ளன: யாவே நெருப்பின் நடுவிலிருந்து பேசினார்; மக்கள் வார்த்தைகளின் ஒலியைக் கேட்டார்கள்; எந்த உருவத்தையும் காணவில்லை. ஆனால் இறுதிப் பகுதியான זוּלָתִי קוֹל என்பது “குரலை மட்டுமே” என முடிகிறது; “கேட்டீர்கள்” என்பதை மீண்டும் சேர்ப்பது மூலத்தில் இல்லாத வினையைத் தேவையின்றி மறுபடியும் சேர்க்கிறது மற்றும் “வார்த்தைகளின் ஒலியை நீங்கள் கேட்டீர்கள்” என்ற முன்கூறலைத் திரும்பச் சொல்கிறது.'
  naturalness: “குரலை மட்டுமே கேட்டீர்கள்” தமிழ் இயல்பானது என்றாலும், இவ்வசனத்தின் சுருக்கமான எபிரெய விதிவிலக்குத் தொடரை நெருக்கமாகக் காட்ட “குரலைத் தவிர வேறொன்றும் இல்லை” அல்லது “குரல் மட்டுமே இருந்தது” சிறந்தது. “குரலைத் தவிர வேறொன்றும் இல்லை” இயல்பாகவும், காணக்கூடிய உருவம் இல்லாமை மற்றும் கேட்கப்பட்ட குரல் ஆகிய எதிர்மறையையும் தெளிவாக வைத்திருக்கிறது.
  terminology: “யாவே,” “நெருப்பின் நடுவிலிருந்து,” “வார்த்தைகளின் ஒலி,” மற்றும் “உருவம்” ஆகியவை பொருத்தமானவை. குறிப்பு c-இல் “எபிரெயச் சொல் ... வலியுறுத்துகிறது” என்ற விளக்கம் ஏற்கத்தக்கது; ஆனால் அது மூலத்தின் மொழிபெயர்ப்பு மாற்றாக மட்டுமே இருக்க வேண்டும். குறிப்பு அடையாளங்கள் உரையில் சரியாக இணைக்கப்பட்டுள்ளன.
