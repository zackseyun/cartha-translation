  to: அப்போது யாவே நெருப்பின் நடுவிலிருந்து[a] உங்களிடம் பேசினார். வார்த்தைகளின் ஒலியை[b] நீங்கள் கேட்டீர்கள்; ஆனால் எந்த உருவத்தையும்[c] காணவில்லை—குரலைத் தவிர வேறொன்றும் இல்லை.
