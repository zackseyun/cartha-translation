  text: וַ/יְדַבֵּ֧ר יְהוָ֛ה אֲלֵי/כֶ֖ם מִ/תּ֣וֹךְ הָ/אֵ֑שׁ ק֤וֹל דְּבָרִים֙ אַתֶּ֣ם שֹׁמְעִ֔ים וּ/תְמוּנָ֛ה אֵינְ/כֶ֥ם רֹאִ֖ים זוּלָתִ֥י קֽוֹל׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/012.yaml
  text: Then Yahweh spoke to you from the midst of the fire[a]. You heard the sound of words[c][b], but saw no form—only a voice.
translation:
  language: ta
  text: அப்போது யாவே நெருப்பின் நடுவிலிருந்து[a] உங்களிடம் பேசினார். வார்த்தைகளின் ஒலியை[b] நீங்கள் கேட்டீர்கள்; ஆனால் எந்த உருவத்தையும்[c] காணவில்லை—குரலைத் தவிர வேறொன்றும் இல்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நெருப்புக்குள்ளிருந்து.”
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில், “வார்த்தைகளின் ஒலி”; “பேச்சின் ஒலி” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: “சாயல்,” “வடிவம்,” அல்லது “தோற்றம்” என்றும் மொழிபெயர்க்கலாம். காணக்கூடிய எந்தப் பிரதிநிதித்துவமும் காணப்படவில்லை என்பதை எபிரெயச் சொல் வலியுறுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: யாவே
  rationale: தேவனுடைய உடன்படிக்கைப் பெயரை பொதுப்பட்டமாக மாற்றாமல், எபிரெய உச்சரிப்புக்கு நெருக்கமான தமிழாக்கமாகப் பாதுகாக்கிறது.
- source_word: וַיְדַבֵּר
  choice: பேசினார்
  rationale: דבר என்பதன் இயல்பான பொருளான ‘பேசுதல்’ என்பதையும், தெய்வீக உரையின் கண்ணியத்தையும் தக்கவைக்கிறது.
- source_word: מִתּוֹךְ הָאֵשׁ
  choice: நெருப்பின் நடுவிலிருந்து
  rationale: מִתּוֹךְ குறிக்கும் ‘உள்ளிருந்து/நடுவிலிருந்து’ என்ற இடவியல் படிமத்தைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: קוֹל דְּבָרִים
  choice: வார்த்தைகளின் ஒலி
  rationale: ‘வார்த்தைகள்/பேச்சின் ஒலி’ என்ற எபிரெயச் சொற்றொடரின் கேட்கக்கூடிய, பொருளுள்ள பேச்சு என்ற நுணுக்கத்தைத் தக்கவைக்கிறது.
- source_word: שֹׁמְעִים
  choice: நீங்கள் கேட்டீர்கள்
  rationale: இங்கு நிகழ்ந்த கடந்தகால அனுபவத்தை நவீனத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: תְמוּנָה
  choice: உருவம்
  rationale: கண்ணுக்குப் புலப்படும் வடிவம் அல்லது பிரதிநிதித்துவம் என்ற சொல்லின் பரப்பைச் சுருக்காமல் தெரிவிக்கிறது.
- source_word: אֵינְכֶם רֹאִים
  choice: எந்த உருவத்தையும் காணவில்லை
  rationale: பார்வைக்குப் புலப்பட்ட வடிவம் முற்றிலும் இல்லாததைத் தெளிவாகக் கூறுகிறது.
- source_word: זוּלָתִי קוֹל
  choice: குரலை மட்டுமே கேட்டீர்கள்
  rationale: ‘குரலைத் தவிர’ என்ற விதிவிலக்குக் கருத்தைத் தமிழில் இயல்பாக வெளிப்படுத்தி, காட்சி மற்றும் கேள்வி ஆகியவற்றுக்கிடையிலான எதிர்மறையைப் பாதுகாக்கிறது.
theological_decisions:
- issue: தேவனுடைய வெளிப்பாட்டில் குரல் கேட்டதும் காணக்கூடிய உருவம் இல்லாததும்
  choice: கேட்கப்பட்ட தெய்வீகப் பேச்சுக்கும் காணப்படாத உருவத்திற்கும் இடையிலான வேறுபாட்டை மட்டும் உரையில் தக்கவைத்தல்
  alternative: ‘அவருடைய குரலைக் கேட்டீர்கள்; ஆனால் அவருடைய காணக்கூடிய பிரதிநிதித்துவத்தைப் பார்க்கவில்லை’ என்று விளக்கமாக விரித்துரைத்தல்
  rationale: வசனம் உண்மையான தெய்வீகப் பேச்சை உறுதிப்படுத்துவதோடு, காணக்கூடிய வடிவம் காணப்படவில்லை என்றும் கூறுகிறது. இதை பிற்கால உருவவியல் அல்லது கோட்பாட்டு மொழியால் விரிவுபடுத்தாமல் அதன் இயல்பான இறையியல் அழுத்தத்துடன் வைத்திருக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையைப் பயன்படுத்துகிறது. ‘நெருப்பின் நடுவிலிருந்து’ என்ற படிமமும், ‘ஒலி/உருவம்’ என்ற கேள்வி–காட்சி எதிர்மறையும் பாதுகாக்கப்பட்டுள்ளன; தேவையற்ற கோட்பாட்டு விளக்கம் சேர்க்கப்படவில்லை.
