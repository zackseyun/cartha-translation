base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/022.yaml
  text: For I am dying in this land[a]; I am not crossing the Jordan[b], but you are crossing over and will take possession of this good land.
translation:
  language: ta
  text: ஏனெனில், நான் இந்த நாட்டில் இறக்கப்போகிறேன்[a]; நான் யோர்தானைக் கடக்கப்போவதில்லை. ஆனால் நீங்கள் அதைக் கடந்து சென்று, இந்த நல்ல நாட்டை உரிமையாக்கிக்கொள்வீர்கள்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நான் இந்த நாட்டில் இறக்கிறேன்.” எபிரெயப் பங்கேற்புவினை நெருங்கிய எதிர்காலச் செயலையும் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “உடைமையாக்கிக்கொள்வீர்கள்” அல்லது “சுதந்தரித்துக்கொள்வீர்கள்.” எபிரெய வினைச்சொல் ஒரு நாட்டைச் சுதந்தரமாகப் பெற்று உரிமையாக்குவதைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய எச்சரிப்பு அல்லது அறிவுறுத்தலுக்கான காரணத்தை அறிமுகப்படுத்துகிறது; எபிரெயச் சொல்லின் விளக்கக் காரணப் பொருளைத் தக்கவைக்கிறது.
- source_word: אָנֹכִי
  choice: நான்
  rationale: தனித்துப் பயன்படுத்தப்பட்ட பதிலிப்பெயர் வலியுறுத்தலைக் கொண்டிருந்தாலும், தமிழில் இயல்பான ‘நான்’ என்பதே சூழலில் போதுமான வலிமையை அளிக்கிறது.
- source_word: מֵת
  choice: இறக்கப்போகிறேன்
  rationale: எபிரெயப் பங்கேற்புவினை மோசேயின் நெருங்கிய மரணத்தைக் குறிக்கிறது. தமிழில் ‘இறந்துகொண்டிருக்கிறேன்’ என்பது உடல் ரீதியான இறக்கும் செயல்முறையைத் தவறாகச் சுட்டக்கூடும்; ‘இறக்கப்போகிறேன்’ அண்மைய எதிர்காலப் பொருளை இயல்பாக வழங்குகிறது.
- source_word: בָּאָרֶץ הַזֹּאת
  choice: இந்த நாட்டிலேயே
  rationale: இங்கு אֶרֶץ என்பது யோர்தானுக்குக் கிழக்கே மோசே இறக்கவிருக்கும் நிலப்பகுதியைக் குறிக்கிறது. ‘நாடு’ இயல்பான தமிழை வழங்குகிறது; ‘-இலேயே’ அங்கே இறப்பதற்கும் யோர்தானைக் கடக்காததற்கும் உள்ள முரண்பாட்டை வெளிப்படுத்துகிறது.
- source_word: אֵינֶנִּי עֹבֵר
  choice: நான் ... கடக்கப்போவதில்லை
  rationale: எதிர்மறைச் சொற்றொடரும் பங்கேற்புவினையும் நிகழப்போகாத நெருங்கிய செயலைக் குறிக்கின்றன; தமிழில் இந்த எதிர்கால வடிவம் இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: אֶת הַיַּרְדֵּן
  choice: யோர்தானை
  rationale: ஆற்றின் வழக்கமான வேதாகமப் பெயரைப் பயன்படுத்துகிறது; மூலத்தில் தனியாக ‘ஆறு’ என்ற சொல் இல்லாததால் அதைச் சேர்க்கவில்லை.
- source_word: וְאַתֶּם עֹבְרִים
  choice: ஆனால் நீங்கள் அதைக் கடந்து சென்று
  rationale: וְ என்பது வடிவத்தில் ‘மற்றும்’ என்றாலும், மோசே கடக்காததற்கும் மக்கள் கடப்பதற்கும் இடையிலான எதிர்மறை ஒப்பீட்டைச் சூழல் காட்டுவதால் ‘ஆனால்’ என மொழிபெயர்க்கப்பட்டது. ‘அதைக்’ என்பது யோர்தானைக் குறிக்கிறது.
- source_word: וִירִשְׁתֶּם
  choice: உரிமையாக்கிக்கொள்வீர்கள்
  rationale: ירשׁ என்பது வாக்குத்தத்த நாட்டைச் சுதந்தரமாகப் பெற்று உடைமையாக்குவதைச் சுட்டுகிறது. ‘உரிமையாக்கிக்கொள்வீர்கள்’ என்பது கைப்பற்றுதல் மற்றும் உரிமைபெறுதல் ஆகிய இரு நுணுக்கங்களையும் சுருக்கமாக வெளிப்படுத்துகிறது.
- source_word: הָאָרֶץ הַטּוֹבָה הַזֹּאת
  choice: இந்த நல்ல நாட்டை
  rationale: எபிரெயிலுள்ள சுட்டுப்பெயரடையையும் மதிப்பீட்டுப் பெயரடையையும் மிகைப்படுத்தாமல் நேரடியாகவும் இயல்பாகவும் தக்கவைக்கிறது.
