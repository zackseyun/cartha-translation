- from: யாவே உங்களைப் பல மக்களினங்களிடையே சிதறடிப்பார்; யாவே உங்களை ஓட்டிச் செல்லும் தேசங்களிடையே நீங்கள் எண்ணிக்கையில் மிகச் சிலரே எஞ்சியிருப்பீர்கள்.[a]
  to: யாவே உங்களை மக்களிடையே சிதறடிப்பார்; யாவே உங்களை ஓட்டிச் செல்லும் தேசங்களிடையே, நீங்கள் எண்ணிக்கையில் சிலரே மீதியாக இருப்பீர்கள்.[a]
