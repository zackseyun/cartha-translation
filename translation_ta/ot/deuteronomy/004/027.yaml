source:
  edition: WLC
  text: וְ/הֵפִ֧יץ יְהוָ֛ה אֶתְ/כֶ֖ם בָּ/עַמִּ֑ים וְ/נִשְׁאַרְתֶּם֙ מְתֵ֣י מִסְפָּ֔ר בַּ/גּוֹיִ֕ם אֲשֶׁ֨ר יְנַהֵ֧ג יְהוָ֛ה אֶתְ/כֶ֖ם שָֽׁמָּ/ה׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/027.yaml
  text: And Yahweh will scatter you among the peoples[a], and you will be left few in number among the nations where Yahweh will drive you.
translation:
  language: ta
  text: யாவே உங்களை மக்களிடையே சிதறடிப்பார்; யாவே உங்களை ஓட்டிச் செல்லும் தேசங்களிடையே, நீங்கள் எண்ணிக்கையில் சிலரே மீதியாக இருப்பீர்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யாவே உங்களை வழிநடத்திச் செல்லும்.” எபிரெய வினைச்சொல் “வழிநடத்து” அல்லது “ஓட்டிச் செல்” என்று பொருள்படலாம்; இங்கு தீர்ப்பும் நாடுகடத்தலும் சூழலாக இருப்பதால் “ஓட்டிச் செல்லும்” என மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵפִיץ
  choice: சிதறடிப்பார்
  rationale: פוץ என்பதன் ஹிஃபில் வடிவம் பிறரைப் பரவிச் சிதறச் செய்வதைக் குறிக்கிறது. உடன்படிக்கைத் தீர்ப்பின் சூழலில் ‘சிதறடிப்பார்’ என்பது காரணவினைப் பொருளையும் வலிமையையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய தனிப்பெயரான יהוה-ஐ ஒரு பட்டப்பெயராக மாற்றாமல், நவீன தமிழில் பரவலாகப் புரிந்துகொள்ளக்கூடிய ஒலிபெயர்ப்பாக ‘யாவே’ என்று வழங்குகிறது.
- source_word: בָּעַמִּים
  choice: பல மக்களினங்களிடையே
  rationale: עַמִּים என்பது இன அல்லது மக்கள் குழுக்களைக் குறிக்கிறது. பின்னர் வரும் גּוֹיִם என்பதிலிருந்து வேறுபாட்டைக் காக்க ‘மக்களினங்கள்’ என மொழிபெயர்க்கப்பட்டுள்ளது; தமிழ் வாக்கியத்தின் இயல்புக்காக மறைமுகப் பன்மை உணர்வு ‘பல’ என்பதால் தெளிவாக்கப்பட்டுள்ளது.
- source_word: וְנִשְׁאַרְתֶּם
  choice: எஞ்சியிருப்பீர்கள்
  rationale: שׁאר என்பதன் நிஃபால் வடிவம் தீர்ப்புக்குப் பிறகு மீதியாக விடப்படுவதைச் சுட்டுகிறது. ‘எஞ்சியிருப்பீர்கள்’ அந்த விளைவு சார்ந்த பொருளை இயல்பாகத் தருகிறது.
- source_word: מְתֵי מִסְפָּר
  choice: எண்ணிக்கையில் மிகச் சிலரே
  rationale: சொல்லுக்கு சொல் ‘எண்ணிக்கைக்குரிய மனிதர்கள்’ என்ற இந்த மரபுத்தொடர், எளிதில் எண்ணிவிடக்கூடிய அளவுக்கு மிகக் குறைவானவர்களைக் குறிக்கிறது. ‘எண்ணிக்கையில் மிகச் சிலரே’ என்பது அதன் வலியுறுத்தலைத் தெளிவாகக் காக்கிறது.
- source_word: בַּגּוֹיִם
  choice: தேசங்களிடையே
  rationale: இங்கு גּוֹיִם என்பது அந்நிய தேசங்களைப் பொதுவாகக் குறிக்கிறது; பிற்கால மதப் பிரிவைக் குறிக்கும் சொல்லைத் தவிர்த்து ‘தேசங்கள்’ என வழங்கப்பட்டுள்ளது.
- source_word: אֲשֶׁר יְנַהֵג
  choice: ஓட்டிச் செல்லும்
  rationale: נהג என்பதற்கு ‘வழிநடத்து’ அல்லது ‘ஓட்டிச் செல்’ என்ற இரு பொருள்களும் இருக்கலாம். கட்டாய நாடுகடத்தலைக் குறிக்கும் தீர்ப்புச் சூழலில் ‘ஓட்டிச் செல்லும்’ பொருத்தமானது; மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
- source_word: שָׁמָּה
  choice: தேசங்களிடையே
  rationale: שָׁמָּה என்பதன் இடப்பொருள் தொடர்புப்பெயர் வாக்கியத்துடன் தமிழில் இயல்பாக இணைக்கப்பட்டு, ‘தேசங்களிடையே’ என்பதில் வெளிப்படுகிறது; தனியாக ‘அங்கே’ சேர்ப்பது தேவையற்ற இரட்டிப்பாக இருக்கும்.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரை வழங்குதல்
  choice: யாவே
  alternative: யெகோவா
  rationale: மூல உரை இறைவனின் தனிப்பெயரையே பயன்படுத்துகிறது. அதை ‘கர்த்தர்’ போன்ற பட்டப்பெயரால் மாற்றாமல் ‘யாவே’ என்று ஒலிபெயர்ப்பது உடன்படிக்கைப் பெயரைப் பாதுகாக்கிறது.
- issue: נהג வினையின் தீர்ப்புச் சூழலிலான பொருள்
  choice: ஓட்டிச் செல்லும்
  alternative: வழிநடத்திச் செல்லும்
  rationale: இந்த வசனம் சிதறடித்தல், எண்ணிக்கையில் குறைதல், நாடுகடத்தல் ஆகிய தீர்ப்பைப் பேசுவதால் கட்டாய இடப்பெயர்வைக் காட்டும் ‘ஓட்டிச் செல்லும்’ முதன்மை உரையில் தேர்ந்தெடுக்கப்பட்டது. இருப்பினும் வினையின் மென்மையான ‘வழிநடத்து’ பொருள் சாத்தியமானதால் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்கு விளங்கும் அதேவேளையில் கண்ணியமான நடையில் அமைக்கப்பட்டுள்ளது. עַמִּים / גּוֹיִם வேறுபாடு ‘மக்களினங்கள்’ / ‘தேசங்கள்’ எனக் காக்கப்பட்டுள்ளது. அடிக்குறி [a] தெளிவுக்காக அது விளக்கும் ‘ஓட்டிச் செல்லும்’ தொடருக்குரிய வாக்கிய முடிவில் வைக்கப்பட்டுள்ளது.
