base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/020.yaml
  text: But Yahweh took you and brought you out of the iron furnace[a], out of Egypt, to be for him a people of inheritance, as it is this day.
translation:
  language: ta
  text: ஆனால் யாவே உங்களை எடுத்துக்கொண்டு, இரும்பு உருக்கும் உலையான எகிப்திலிருந்து உங்களை வெளியே கொண்டுவந்தார்; இன்றிருப்பதுபோல, நீங்கள் அவருக்கே உரிய மக்களாக[a] இருக்கும்படி.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரெயத்தில் சொல்லுக்குச் சொல்: “அவருக்கு ஒரு சுதந்தரச் சொத்தான மக்களாக.” இதை “அவருடைய சொந்த மக்களாக” அல்லது “அவருடைய உடைமையான மக்களாக” என்றும் பொருள்கொள்ளலாம்.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: யாவே
  rationale: உடன்படிக்கைக்குரிய இறைப்பெயரைப் பொதுப்பட்ட பட்டப்பெயராக மாற்றாமல், தமிழில் இயல்பாக ஒலிபெயர்க்கிறது.
- source_word: לָקַח
  choice: எடுத்துக்கொண்டு
  rationale: வினையின் அடிப்படைப் பொருளான ‘எடுத்தல்’ என்பதைக் காக்கிறது; ‘தெரிந்துகொண்டார்’ என்று விளக்கத்தை மூலத்தில் சேர்க்கவில்லை.
- source_word: וַיּוֹצִא
  choice: வெளியே கொண்டுவந்தார்
  rationale: ஹிஃபில் வடிவின் காரணவினைப் பொருளையும் எகிப்திலிருந்து புறப்படச் செய்த செயலைவும் இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: מִכּוּר הַבַּרְזֶל
  choice: இரும்பு உருக்கும் உலை
  rationale: கடுமையான ஒடுக்குதலைச் சுட்டும் மூல உருவகத்தைக் காக்கிறது; தமிழில் உலையின் செயலையும் தெளிவாக்குகிறது.
- source_word: מִמִּצְרָיִם
  choice: எகிப்திலிருந்து
  rationale: உலை என்ற உருவகம் எகிப்தையே குறிக்கிறது என்பதை ‘உலையாகிய எகிப்து’ என்ற இணைப்பால் தெளிவாகக் காட்டுகிறது.
- source_word: לִהְיוֹת לוֹ לְעַם נַחֲלָה
  choice: அவருக்கே உரிய மக்களாக இருக்கும்படி
  rationale: לו என்பதையும், נַחֲלָה குறிக்கும் உரிமை/சுதந்தரச் சொத்து சார்ந்த உடைமை உணர்வையும் இயல்பான நவீன தமிழில் தருகிறது; சொல்லுக்குச் சொல் அமைப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: כַּיּוֹם הַזֶּה
  choice: இன்றிருப்பதுபோல
  rationale: இஸ்ரவேலின் அப்போதைய கண்கூடான நிலையைச் சுட்டும் எபிரெய வழக்கைச் சுருக்கமான நவீன தமிழில் அளிக்கிறது.
theological_decisions:
- issue: לְעַם נַחֲלָה என்பதில் உள்ள உடன்படிக்கை சார்ந்த உரிமை மொழி
  choice: அவருக்கே உரிய மக்களாக
  alternative: அவருக்குச் சுதந்தரச் சொத்தான மக்களாக
  rationale: இஸ்ரவேல் யாவேக்கு உரியது என்ற பொருளைத் தெளிவாகத் தருகிறது. ‘சுதந்தரம்’ என்பது நவீன தமிழில் ‘விடுதலை’ என்று தவறாகப் புரிந்துகொள்ளப்படக்கூடும் என்பதால் அதை முதன்மை உரையில் தவிர்த்து, மூலத்தின் பெயர்ச்சொல் அமைப்பை அடிக்குறிப்பில் காட்டுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகருக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் ‘இரும்பு உலை’ உருவகம் பாதுகாக்கப்பட்டு, அது இரும்பு உருக்கும் உலை எனத் தெளிவாக்கப்பட்டுள்ளது. நீண்ட எபிரெய வாக்கியம் வாசிப்புத் தெளிவுக்காக இரண்டு தமிழ் வாக்கியங்களாகப் பிரிக்கப்பட்டுள்ளது.
