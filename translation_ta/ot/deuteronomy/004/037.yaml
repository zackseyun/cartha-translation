  text: וְ/תַ֗חַת כִּ֤י אָהַב֙ אֶת אֲבֹתֶ֔י/ךָ וַ/יִּבְחַ֥ר בְּ/זַרְע֖/וֹ אַחֲרָ֑י/ו וַ/יּוֹצִֽאֲ/ךָ֧ בְּ/פָנָ֛י/ו בְּ/כֹח֥/וֹ הַ/גָּדֹ֖ל מִ/מִּצְרָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/037.yaml
  text: And because he loved your fathers and chose their offspring after them[a], he brought you out of Egypt by his presence[b], by his great power.
translation:
  language: ta
  text: உன் தந்தையரை அவர் நேசித்து, அவர்களுக்குப் பின்வந்த சந்ததியைத் தேர்ந்துகொண்டதால்[a], தமது பிரசன்னத்தினாலும்[b] தமது பேராற்றலினாலும் உன்னை எகிப்திலிருந்து வெளியே கொண்டுவந்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவனுக்குப் பின்வந்த அவனுடைய சந்ததியை.” எபிரேயத்தில் ஒருமை பின்னொட்டுகள் உள்ளன; அவை “உன் தந்தையர்” என்பதை ஒரு கூட்டாகக் குறிப்பிடக்கூடும்.
    reason: lexical_alternative
  - marker: b
    text: சொல்லுக்கு சொல், “தமது முகத்தினால்” அல்லது “தமக்கு முன்பாக.” இங்கே இச்சொற்றொடர் கடவுள் தாமே உடனிருந்து இஸ்ரவேலை வெளியே கொண்டுவந்ததைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְתַחַת כִּי
  choice: அதனால்
  rationale: இந்த எபிரேயச் சொற்றொடர் காரணத்தை அறிமுகப்படுத்துகிறது. தமிழில் வாக்கிய முடிவிலுள்ள ‘-தால்’ அமைப்புடன் இணைத்து causal force இயல்பாகத் தரப்பட்டுள்ளது.
- source_word: אָהַב אֶת אֲבֹתֶיךָ
  choice: உன் தந்தையரை அவர் நேசித்து
  rationale: אָהַב என்பதன் நேரடியான பொருளான ‘நேசித்தார்’ பாதுகாக்கப்படுகிறது; אֲבֹתֶיךָ ஆண்பால் பன்மையாக இருப்பதால் ‘உன் தந்தையர்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: וַיִּבְחַר
  choice: தேர்ந்துகொண்டதால்
  rationale: בחר என்பதற்கு இயல்பான, தொழில்நுட்ப இறையியல் சுமையற்ற தமிழ் ‘தேர்ந்துகொள்’; முந்தைய காரணத் தொடருடன் இணைக்க வினையெச்ச-காரண வடிவம் பயன்படுத்தப்பட்டது.
- source_word: בְּזַרְעוֹ אַחֲרָיו
  choice: அவர்களுக்குப் பின்வந்த சந்ததியை
  rationale: எபிரேயத்தில் ஒருமை பின்னொட்டுகள் இருந்தாலும், அவை முன்வரும் ‘தந்தையர்’ என்பதை கூட்டாகச் சுட்டுவதாகத் தெரிகிறது. זרע என்பதன் கூட்டுப் பொருளை ‘சந்ததி’ பாதுகாக்கிறது.
- source_word: וַיּוֹצִאֲךָ
  choice: உன்னை ... வெளியே கொண்டுவந்தார்
  rationale: יצא என்பதன் ஹிஃபில் வடிவம் ‘வெளியே வரச் செய்தல்/கொண்டுவருதல்’ என்று பொருள்படும்; யாத்திரைச் சூழலில் ‘வெளியே கொண்டுவந்தார்’ தெளிவானது.
- source_word: בְּפָנָיו
  choice: தமது பிரசன்னத்தினால்
  rationale: சொல்லுக்கு சொல் ‘தமது முகத்தினால்/தமக்கு முன்பாக’ என்றாலும், இச்சூழலில் கடவுளின் சொந்த உடனிருப்பை உணர்த்துகிறது. ‘பிரசன்னம்’ கண்ணியமான தமிழில் அந்தப் பொருளைத் தக்கவைக்கிறது.
- source_word: בְּכֹחוֹ הַגָּדֹל
  choice: தமது பேராற்றலினால்
  rationale: כח என்பதன் வல்லமை/ஆற்றல் பொருளையும் הַגָּדֹל என்பதன் பெருமையையும் ‘பேராற்றல்’ சுருக்கமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: מִמִּצְרַיִם
  choice: எகிப்திலிருந்து
  rationale: מן முன்னொட்டின் மூலத்திலிருந்து நீங்குதல் என்ற பொருளை ‘-இலிருந்து’ தருகிறது; ‘வெளியே கொண்டுவந்தார்’ என்பதுடன் யாத்திரை அர்த்தம் தெளிவாகிறது.
theological_decisions:
- issue: ‘அவனுடைய சந்ததி, அவனுக்குப் பின்’ என்பதிலுள்ள கூட்டுப் பொருளுடைய ஒருமை பின்னொட்டுகள்
  choice: அவர்களுக்குப் பின்வந்த சந்ததி
  alternative: அவனுக்குப் பின்வந்த அவனுடைய சந்ததி
  rationale: எபிரேய வடிவம் ஒருமையாக இருந்தாலும், முன்வரும் ‘உன் தந்தையர்’ என்பதை ஒரு கூட்டாகக் குறிப்பதாகச் சூழல் காட்டுகிறது. தமிழ் பன்மைச் சுட்டு தவறான ஒற்றைத் தந்தை எண்ணத்தைத் தவிர்க்கிறது; அடிக்குறிப்பு சொல்வடிவத்தைப் பதிவு செய்கிறது.
- issue: בְּפָנָיו என்பதன் பொருள்
  choice: தமது பிரசன்னத்தினால்
  alternative: தமது முகத்தினால் / தமக்கு முன்பாக
  rationale: இச்சொற்றொடர் விடுதலையில் கடவுளின் சொந்த உடனிருப்பை வலியுறுத்துகிறது. இயல்பற்ற சொல்லுக்குச் சொல் மொழிபெயர்ப்புக்குப் பதில் அந்தச் சுமையை வாசிக்கத்தக்க தமிழில் தக்கவைக்கிறது; அடிக்குறிப்பு நேரடி வடிவத்தையும் குறிப்பிடுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் கண்ணியமும் பொதுவாசிப்புத் தெளிவும் சமநிலைப்படுத்தப்பட்டுள்ளன. ஒருமை ‘உன்/உன்னை’ மூலம் எபிரேயத்தின் இரண்டாம் நபர் ஒருமை பாதுகாக்கப்படுகிறது. ‘தந்தையர்,’ ‘சந்ததி,’ ‘பிரசன்னம்,’ ‘பேராற்றல்’ ஆகியவை வேதாகமச் சூழலுக்கேற்றவையாக இருந்தும் மிகப் பழமையான நடையைத் தவிர்க்கின்றன.
