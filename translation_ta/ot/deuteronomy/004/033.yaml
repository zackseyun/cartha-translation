  text: הֲ/שָׁ֣מַֽע עָם֩ ק֨וֹל אֱלֹהִ֜ים מְדַבֵּ֧ר מִ/תּוֹךְ הָ/אֵ֛שׁ כַּ/אֲשֶׁר שָׁמַ֥עְתָּ אַתָּ֖ה וַ/יֶּֽחִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/033.yaml
  text: Has any people heard the voice of God speaking from the midst of the fire[a], as you have heard, and lived?
translation:
  language: ta
  text: எந்த மக்களினமாவது நெருப்பின் நடுவிலிருந்து கடவுள் பேசும் குரலைக் கேட்டு, நீ கேட்டதுபோல் உயிரோடு இருந்ததுண்டா[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உயிர்தப்பியதுண்டா?” எபிரெய வினைச்சொல் நேரடியாக “வாழ்ந்தது” என்று பொருள்படும்; ஆனால் கடவுள் நெருப்பின் நடுவிலிருந்து பேசியதைக் கேட்ட பின்னரும் மக்கள் உயிருடன் இருந்ததைச் சூழல் வலியுறுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲ/שָׁמַע עָם
  choice: எந்த மக்களினமாவது ... கேட்டதுண்டா?
  rationale: வினாவிடை எதிர்பாராத வலியுறுத்தல் கொண்ட எபிரெயச் சொல்லமைப்பை இயல்பான தமிழில் சொல்லாட்சி வினாவாகக் கொடுக்கிறது; עָם என்பது ஒரு மக்கள்குழுவைக் குறிக்கிறது.
- source_word: קוֹל אֱלֹהִים מְדַבֵּר
  choice: கடவுள் பேசும் குரல்
  rationale: מְדַבֵּר ஒருமை வடிவில் இருப்பதால் אֱלֹהִים இங்கு ஒருமையில் ‘கடவுள்’ எனப் பொருள்படுகிறது. קוֹל என்பது பேசுதலோடு இணைந்திருப்பதால் ‘ஒலி’ என்பதைவிட ‘குரல்’ பொருத்தமானது.
- source_word: מִ/תּוֹךְ הָ/אֵשׁ
  choice: நெருப்பின் நடுவிலிருந்து
  rationale: מִתּוֹךְ கூறும் உள்ளிருந்து வரும் இடவியல் படிமத்தை நேரடியாகவும் இயல்பாகவும் காக்கிறது.
- source_word: כַּ/אֲשֶׁר שָׁמַעְתָּ אַתָּה
  choice: நீ கேட்டதுபோல
  rationale: இஸ்ரயேலை ஒருமையில் நேரடியாகச் சுட்டும் இரண்டாம் நபர் வடிவத்தையும் ஒப்பீட்டையும் காக்கிறது. தமிழில் வெளிப்படையான ‘நீ’ தேவையான வலியுறுத்தலை அளிக்கிறது.
- source_word: וַ/יֶּחִי
  choice: உயிரோடு இருந்தது
  rationale: வினையின் அடிப்படைப் பொருள் ‘வாழ்தல்.’ இச்சூழலில் கடவுளின் குரலைக் கேட்ட பின்னரும் இறக்காமல் இருந்ததைக் குறிக்கும் விதமாக ‘உயிரோடு இருந்தது’ இயல்பாக உள்ளது; ‘உயிர்தப்பியது’ என்பது சற்றுக் கூடுதல் விளக்கமுடைய மாற்று.
theological_decisions:
- issue: אֱלֹהִים என்பதன் எண் மற்றும் குறிப்பு
  choice: கடவுள்
  alternative: ஒரு தெய்வம் / தெய்வங்கள்
  rationale: ஒருமை வினையெச்சமும் ஓரேபில் இஸ்ரயேலின் கடவுள் தம்மை வெளிப்படுத்திய உடனடிச் சூழலும் ஒருமைப் பொருளையே கோருகின்றன; இதற்கு மேலான கோட்பாட்டு விளக்கம் சேர்க்கப்படவில்லை.
- issue: கடவுளின் குரலைக் கேட்டும் இறக்காமல் இருந்ததன் மறைமுக முரண்பாட்டை எவ்வளவு வெளிப்படுத்துவது
  choice: உயிரோடு இருந்ததுண்டா
  alternative: உயிர்தப்பியதுண்டா / இருந்தும் உயிரோடு இருந்ததுண்டா
  rationale: எபிரெயம் உடன்பாட்டு இணைப்பையே பயன்படுத்தி ‘வாழ்ந்தது’ என்கிறது. ‘இருந்தும்’ எனச் சேர்த்து முரண்பாட்டை மிகைப்படுத்தாமல், சூழலிலுள்ள இறையியல் பதற்றத்தைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையும் கண்ணியமும் பேணப்பட்டுள்ளன. ‘மக்களினம்’ என்பது ஒருமைக் கூட்டுப்பெயரான עָם என்பதைக் காட்டுகிறது; வாக்கியத்தின் சொல்லாட்சி வினா இயல்பாக ஒலிக்கும்படி அமைக்கப்பட்டுள்ளது.
