source:
  edition: WLC
  text: כִּ֣י אֵ֤ל רַחוּם֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ לֹ֥א יַרְפְּ/ךָ֖ וְ/לֹ֣א יַשְׁחִיתֶ֑/ךָ וְ/לֹ֤א יִשְׁכַּח֙ אֶת בְּרִ֣ית אֲבֹתֶ֔י/ךָ אֲשֶׁ֥ר נִשְׁבַּ֖ע לָ/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/031.yaml
  text: For Yahweh your God is a compassionate God[c][b][a]; he will not abandon you or destroy you or forget the covenant of your fathers that he swore to them.
translation:
  language: ta
  text: ஏனெனில், உங்கள் கடவுளாகிய யாவே இரக்கமுள்ள கடவுள்[a]. அவர் உங்களைக் கைவிடமாட்டார்[b], உங்களை அழிக்கமாட்டார், உங்கள் தந்தையருக்கு[c] அவர் ஆணையிட்டு வாக்களித்த உடன்படிக்கையை மறக்கமாட்டார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘கருணையுள்ள கடவுள்.’
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘உங்களை விட்டுவிடமாட்டார்.’
    reason: lexical_alternative
  - marker: c
    text: அல்லது, ‘உங்கள் மூதாதையருக்கு.’ எபிரெயத்தில் ‘உங்கள் தந்தையர்’ என்று உள்ளது; இது இஸ்ரவேலின் உடன்படிக்கைத் தந்தையரைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய அறிவுறுத்தலுக்கான காரணத்தை அறிமுகப்படுத்தும் இணைப்புச் சொல்லாக இருப்பதால், எபிரெய உரையின் விளக்கத் தொடர்பைப் பாதுகாக்கிறது.
- source_word: אֵל רַחוּם
  choice: இரக்கமுள்ள கடவுள்
  rationale: רַחוּם குறிக்கும் இரக்கம், பரிவு ஆகிய பொருள்களை நவீனத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் தெரிவிக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரான நான்கெழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் ஏற்ற ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: אֱלֹהֶיךָ
  choice: உங்கள் கடவுளாகிய
  rationale: இரண்டாம் நபர் ஒருமை ஆண்பால் பின்னொட்டின் உடன்படிக்கை சார்ந்த நேரடி அழைப்பை, தமிழில் மரியாதை ஒருமையாக இயல்பாகத் தருகிறது.
- source_word: לֹא יַרְפְּךָ
  choice: அவர் உங்களைக் கைவிடமாட்டார்
  rationale: Hiphil வடிவம் குறிக்கும் ‘விட்டுவிடுதல்/ஆதரவின்றிக் கைவிடுதல்’ என்ற கருத்தைத் தெளிவான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: וְלֹא יַשְׁחִיתֶךָ
  choice: உங்களை அழிக்கமாட்டார்
  rationale: שׁחת என்பதன் Hiphil வடிவத்திற்குரிய நேரடியான ‘அழித்தல்’ என்ற பொருளை உடன்படிக்கை எச்சரிக்கைச் சூழலில் பாதுகாக்கிறது.
- source_word: וְלֹא יִשְׁכַּח אֶת בְּרִית
  choice: உடன்படிக்கையை மறக்கவும் மாட்டார்
  rationale: கடவுள் உடன்படிக்கையை ‘மறக்கமாட்டார்’ என்ற மூலத்தின் முக்கியமான உருவகத்தை மென்மைப்படுத்தாமல் தக்கவைக்கிறது.
- source_word: אֲבֹתֶיךָ
  choice: உங்கள் தந்தையர்
  rationale: இஸ்ரவேலின் உடன்படிக்கைத் தந்தையரைக் குறிக்கும் ஆண்பால், வரலாற்றுச் சிறப்புடைய சொல்லாட்சியைப் பாதுகாக்கிறது.
- source_word: אֲשֶׁר נִשְׁבַּע לָהֶם
  choice: அவர்களுக்கு அவர் ஆணையிட்டுக் கொடுத்த
  rationale: נשבע என்பதிலுள்ள முறையான ஆணையுறுதியை இயல்பான தமிழில் வெளிப்படுத்துகிறது; உறுதிமொழியின் தீவிரத்தையும் தக்கவைக்கிறது.
theological_decisions:
- issue: יהוה என்ற தெய்வீகப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலத்தில் தனிப்பட்ட உடன்படிக்கைப் பெயர் நேரடியாக வருவதால், அதை ஒரு பட்டமாக மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
- issue: אֲבֹתֶיךָ என்பதிலுள்ள பாலின மற்றும் உடன்படிக்கை வரலாற்றுச் சுட்டு
  choice: உங்கள் தந்தையர்
  alternative: உங்கள் மூதாதையர்
  rationale: பொதுவான முன்னோர்களை மட்டும் அல்லாமல், இஸ்ரவேலின் உடன்படிக்கைத் தந்தையரைக் குறிப்பாகச் சுட்டும் மூலத்தின் ஆண்பால் வடிவத்தையும் வரலாற்றுத் தன்மையையும் பாதுகாக்கிறது.
- issue: ‘அவர் ஆணையிட்ட’ என்பதன் தொடர்பு
  choice: உடன்படிக்கையையே அவர் அவர்களுக்கு ஆணையிட்டுக் கொடுத்தார் என்று தெளிவுபடுத்தல்
  alternative: உங்கள் தந்தையருக்கு அவர் ஆணையிட்டார்
  rationale: எபிரெய தொடர்புப்பெயர் இலக்கணரீதியாக உடன்படிக்கையைத் தொடர்புபடுத்துகிறது; தமிழில் ஏற்படக்கூடிய ‘தந்தையரை ஆணையிட்டார்’ என்ற தவறான வாசிப்பைத் தவிர்க்க மறுவடிவமைப்பு செய்யப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய உரையின் இரண்டாம் நபர் ஒருமை தமிழில் மரியாதை ஒருமையான ‘உங்கள்/உங்களை’ என வழங்கப்பட்டுள்ளது. வாக்கியத்தின் இறுதிப்பகுதி, தொடர்புப்பெயரின் பொருளைத் தெளிவாக்குவதற்காக இயல்பான தமிழில் மறுவடிவமைக்கப்பட்டுள்ளது.
