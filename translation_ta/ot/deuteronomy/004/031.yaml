revisions:
- from: ஏனெனில், உங்கள் கடவுளாகிய யாவே இரக்கமுள்ள கடவுள்[a]. அவர் உங்களைக் கைவிடமாட்டார்[b]; உங்களை அழிக்கமாட்டார்; உங்கள் தந்தையரோடு[c] செய்துகொண்ட உடன்படிக்கையை மறக்கவும் மாட்டார்—அவர்களுக்கு அவர் ஆணையிட்டுக் கொடுத்த உடன்படிக்கை அது.
  to: ஏனெனில், உங்கள் கடவுளாகிய யாவே இரக்கமுள்ள கடவுள்[a]. அவர் உங்களைக் கைவிடமாட்டார்[b], உங்களை அழிக்கமாட்டார், உங்கள் தந்தையருக்கு[c] அவர் ஆணையிட்டு வாக்களித்த உடன்படிக்கையை மறக்கமாட்டார்.
  rationale: 'The revision restores the Hebrew syntax and meaning: Yahweh will not forget the covenant belonging to Israel’s fathers, a covenant he swore to them. It removes the unsupported notion that he commanded and gave the covenant, while preserving all lexical-alternative footnote anchors.'
