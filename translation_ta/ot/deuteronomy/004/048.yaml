source:
  edition: WLC
  text: מֵ/עֲרֹעֵ֞ר אֲשֶׁ֨ר עַל שְׂפַת נַ֧חַל אַרְנֹ֛ן וְ/עַד הַ֥ר שִׂיאֹ֖ן ה֥וּא חֶרְמֽוֹן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/048.yaml
  text: from Aroer[a], which is on the bank of the Arnon Valley, as far as Mount Sion (that is, Hermon)[b],
translation:
  language: ta
  text: அர்னோன் பள்ளத்தாக்கின் கரையில் உள்ள அரோவேர்[a] முதல் சீயோன் மலைவரை—அது எர்மோன்[b]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அர்னோன் ஓடைப் பள்ளத்தாக்கு” அல்லது “அர்னோனின் பள்ளத்தாக்கு” என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் נַחַל என்பது எப்போதும் ஓடும் நதியை மட்டுமல்லாமல், ஓடைப் படுகை அல்லது பள்ளத்தாக்கையும் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில் “சீயோன்.” உபாகமம் 3:9-ஐ ஒப்பிடுக; அங்கே சீதோனியர் இந்த மலையைச் சிரியோன் என்று அழைத்ததாகக் கூறப்படுகிறது. இங்கே சீயோன் எர்மோன் என்று உரையே வெளிப்படையாக அடையாளப்படுத்துகிறது.
    reason: cross_reference
lexical_decisions:
- source_word: מֵ/עֲרֹעֵר
  choice: அரோவேர் முதல்
  rationale: מִן எல்லைப்பரப்பின் தொடக்கத்தைக் குறிக்கிறது. அரோவேர் என்பது இடப்பெயர்; எனவே ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: אֲשֶׁר עַל שְׂפַת
  choice: கரையில் உள்ள
  rationale: שָׂפָה என்பதன் அடிப்படைப் பொருள் ‘உதடு/விளிம்பு’; இப்புவியியல் சூழலில் இயல்பான தமிழ்ச் சொல் ‘கரை’.
- source_word: נַחַל אַרְנֹן
  choice: அர்னோன் பள்ளத்தாக்கு
  rationale: נַחַל என்பது எப்போதும் ஓடும் நதியை மட்டுமல்லாமல் ஓடைப் படுகை அல்லது பள்ளத்தாக்கையும் குறிக்கலாம். இங்கு நிலவியல் பொருளைத் தெளிவாகவும் மிகைப்படுத்தாமலும் தருகிறது.
- source_word: וְ/עַד
  choice: வரை
  rationale: எல்லைப்பரப்பின் முடிவிடத்தைக் குறிக்கும் எளிய, இயல்பான தமிழ் வடிவம்.
- source_word: הַר שִׂיאֹן
  choice: சீயோன் மலை
  rationale: שִׂיאֹן என்ற இவ்வசனத்தின் இடப்பெயரை சீயோன் என ஒலிபெயர்த்து, הַר என்பதற்கு இயல்பான ‘மலை’ பயன்படுத்தப்பட்டுள்ளது; இதை எருசலேமின் சீயோனுடன் அமைதியாக ஒன்றாக்கவில்லை.
- source_word: הוּא חֶרְמוֹן
  choice: அதுதான் எர்மோன்
  rationale: הוּא இங்கு முன் கூறிய மலையை எர்மோன் என்று விளக்கி அடையாளப்படுத்துகிறது. தமிழில் விளக்கப்பொருளை இயல்பாக வெளிப்படுத்தும் வடிவம்.
theological_decisions:
- issue: சீயோன் மலையும் எர்மோனும் இடையிலான அடையாள உறவு
  choice: அதுதான் எர்மோன்
  alternative: அது எர்மோன்
  rationale: எபிரெய உரையே இரு பெயர்களையும் வெளிப்படையாக அடையாளப்படுத்துகிறது; மொழிபெயர்ப்பு அந்த உறவை அப்படியே வைத்திருக்கிறது, கூடுதல் விளக்கத்தைத் திணிக்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகருக்குப் புரியும் வகையிலும் வேதாகம நிலவியல் எல்லைப்பட்டியலுக்கேற்ற கண்ணியமான நடையிலும் மொழிபெயர்க்கப்பட்டது. தொடர்வசனத்தின் ஒரு பகுதியாக இருப்பதால் இறுதியில் முற்றுப்புள்ளி இடப்படவில்லை. எல்லா அடிக்குறிப்பு குறிகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
