  source_fidelity: திருத்தம் தேவை. மூலத்தில் இல்லாத ‘வேறு’ என்பதை நீக்குவது பாதுகாப்பானது. மேலும் חֻקִּים என்பதற்கு ‘கட்டளைகள்’ என்பதைவிட சட்டத் தன்மையைத் தெளிவாகக் காட்டும் ‘சட்டவிதிகள்’ பொருத்தமானது. வினாவை ‘எந்தப் பெரிய தேசத்துக்கு ... உண்டு?’ என அமைப்பது לֹו (‘அதற்கு/அதனிடம் உள்ளது’) என்ற மூல அமைப்பையும் தமிழின் இயல்பையும் காக்கிறது.
