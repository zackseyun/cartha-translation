  yaml_path: translation/ot/deuteronomy/004/008.yaml
  text: And what great nation is there that has statutes and judgments as righteous as all this law that I am setting before you today?[a]
translation:
  language: ta
  text: நான் இன்று உங்கள் முன் வைக்கிற இந்தச் சட்டம் முழுவதையும் போன்ற நீதியான சட்டவிதிகளும் நியாயத்தீர்ப்புகளும் எந்தப் பெரிய தேசத்துக்கு உண்டு?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '“சட்டம்” என்பதற்குப் பதிலாக “போதனை” என்றும் மொழிபெயர்க்கலாம் (எபிரெய மொழியில்: தோரா); எனினும் இங்கு “சட்டவிதிகளும் நியாயத்தீர்ப்புகளும்” எனச் சட்டம் சார்ந்த சூழல் குறிப்பாக உள்ளது.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִי גּוֹי גָּדוֹל
  choice: வேறு எந்தப் பெரிய தேசம் இருக்கிறது?
  rationale: எபிரெய மொழியில் சொற்சொல்லாக ‘எந்தப் பெரிய தேசம்?’ என்ற வினா அமைந்துள்ளது. முந்தைய வசனத்தின் ஒப்பீட்டுத் தொடர்ச்சியையும் எதிர்பார்க்கப்படும் ‘எதுவுமில்லை’ என்ற விடையையும் இயல்பான நவீன தமிழில் வெளிப்படுத்த ‘வேறு’ சேர்க்கப்பட்டது.
- source_word: חֻקִּים
  choice: கட்டளைகள்
  rationale: நிர்ணயிக்கப்பட்ட சட்ட விதிகளைக் குறிக்கும் இச்சொல்லுக்கு, பொதுவாசகர்களுக்குப் புரியும் சட்டநயம் கொண்ட ‘கட்டளைகள்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: וּמִשְׁפָּטִים
  choice: நியாயத்தீர்ப்புகள்
  rationale: நீதித்துறைத் தீர்ப்புகள் அல்லது சட்டத் தீர்மானங்கள் என்ற தனித்த சட்டப் பொருளைப் பாதுகாத்து, חֻקִּים என்பதிலிருந்து வேறுபடுத்துகிறது.
- source_word: צַדִּיקִם
  choice: நீதியான
  rationale: சட்டங்களும் தீர்ப்புகளும் சரியானதும் நீதிக்கு இசைந்ததும் என்பதைக் காட்டும் அற-சட்டப் பரப்பை இச்சொல் தக்கவைக்கிறது.
- source_word: כְּכֹל הַתּוֹרָה הַזֹּאת
  choice: இந்தச் சட்டம் முழுவதையும் போல
  rationale: כְּכֹל என்பதன் ஒப்பீட்டையும் முழுமையையும் வெளிப்படுத்துகிறது. உடனடிச் சட்டச் சூழலில் תּוֹרָה என்பதற்கு ‘சட்டம்’ தெளிவானது; அதன் விரிவான ‘போதனை’ பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: נֹתֵן לִפְנֵיכֶם
  choice: உங்கள் முன் வைக்கும்
  rationale: சொற்சொல்லான ‘உங்கள் முன்னால் கொடுக்கிறேன்’ என்பதற்குப் பதிலாக, சட்டத்தை மக்களிடம் முன்வைப்பதைக் குறிக்கும் எபிரெய மரபுத்தொடரை இயல்பான தமிழில் தருகிறது.
- source_word: הַיּוֹם
  choice: இன்று
  rationale: கால வலியுறுத்தலை எளிய, நவீன தமிழில் நேரடியாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: תּוֹרָה என்பதன் மொழிபெயர்ப்பு
  choice: சட்டம்
  alternative: போதனை
  rationale: תּוֹרָה என்பது விரிவாக ‘போதனை’ அல்லது ‘அறிவுறுத்தல்’ என்று பொருள்படலாம். ஆனால் இங்கு ‘கட்டளைகளும் நியாயத்தீர்ப்புகளும்’ என்ற உடனடிச் சட்டச் சூழல் இருப்பதால் ‘சட்டம்’ முதன்மை உரையில் பொருத்தமானது. விரிவான பொருள் மறையாதபடி மாற்று வாசிப்பு அடிக்குறிப்பில் பாதுகாக்கப்பட்டது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. சட்டச் சொற்களான חֻקִּים மற்றும் מִשְׁפָּטִים ஆகியவற்றின் வேறுபாட்டை முறையே ‘கட்டளைகள்’, ‘நியாயத்தீர்ப்புகள்’ என்று தக்கவைத்துள்ளது; சொல்லாட்சியை அளவுக்கு மீறி பழமையாக்கவில்லை.
