base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/021.yaml
  text: And Yahweh was angry with me because of you[a], and he swore that I would not cross the Jordan and that I would not enter the good land that Yahweh your God is giving you as an inheritance.
translation:
  language: ta
  text: உங்கள் வார்த்தைகளின் காரணமாக[a] யாவே என்மீது கோபமடைந்தார். நான் யோர்தானைக் கடக்கமாட்டேன் என்றும், உங்கள் கடவுளாகிய யாவே உங்களுக்குச் சுதந்தரமாகக் கொடுக்கிற அந்த நல்ல நாட்டிற்குள் நுழையமாட்டேன் என்றும் அவர் சத்தியம் செய்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உங்களால்.” எபிரெயத்தில் சொல்லர்த்தமாக, “உங்கள் வார்த்தைகளின் காரணமாக.”
    reason: ‘வார்த்தைகள்’ என்ற வெளிப்படையான சொல்லர்த்தத்தையும், சூழலில் சாத்தியமான விரிவான பொருளையும் பாதுகாக்கிறது.
lexical_decisions:
- source_word: יְהוָה
  choice: யாவே
  rationale: தேவப் பெயரின் நான்கு எழுத்துகளைக் பொதுவாக ஏற்றுக்கொள்ளப்படும் உச்சரிப்புக்கு நெருக்கமாக ஒலிபெயர்த்து, தனிப்பெயராகப் பாதுகாக்கிறது.
- source_word: הִתְאַנֶּף בִּי
  choice: என்மீது கோபமடைந்தார்
  rationale: வினைச்சொல்லின் கோபம் என்ற பொருளையும், அதனுடன் வரும் முன்னிடைச்சொல்லின் இலக்கையும் இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: עַל דִּבְרֵיכֶם
  choice: உங்கள் வார்த்தைகளின் காரணமாக
  rationale: எபிரெய மூலத்தில் வெளிப்படையாக உள்ள ‘உங்கள் வார்த்தைகள்’ என்பதை நீக்காமல் பாதுகாக்கிறது; சூழலில் இது ‘உங்களால்’ என்றும் புரிந்துகொள்ளப்படலாம்.
- source_word: וַיִּשָּׁבַע
  choice: அவர் ஆணையிட்டார்
  rationale: உறுதிமொழியுடன் சத்தியம் செய்தல் என்ற பொருளைத் தெளிவான, கண்ணியமான தமிழில் தருகிறது.
- source_word: לְבִלְתִּי עָבְרִי אֶת הַיַּרְדֵּן
  choice: நான் யோர்தானைக் கடக்கமாட்டேன் என்றும்
  rationale: ஆணையின் உள்ளடக்கமாக மோசே யோர்தானைக் கடக்கமாட்டார் என்பதைக் குறிக்கும் எபிரெய கட்டமைப்பை இயல்பாக வழங்குகிறது.
- source_word: וּלְבִלְתִּי בֹא
  choice: நுழையமாட்டேன் என்றும்
  rationale: இணையான இரண்டாவது மறுப்பைச் சுருக்கமாகவும் தெளிவாகவும் பாதுகாக்கிறது.
- source_word: הָאָרֶץ הַטּוֹבָה
  choice: அந்த நல்ல நாடு
  rationale: ‘நல்ல’ என்ற நேரடியான மதிப்பீட்டையும், குறிப்பிட்ட நாட்டைக் குறிக்கும் நிர்ணயத்தையும் பாதுகாக்கிறது.
- source_word: נֹתֵן לְךָ
  choice: உங்களுக்குக் கொடுக்கிற
  rationale: எபிரெய நிகழ்கால வினையெச்சத்தின் தொடரும் அல்லது உடனடி கொடை உணர்வை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: נַחֲלָה
  choice: உரிமைச்சொத்தாக
  rationale: வழிவழியாகப் பெறப்படும் பங்கு அல்லது சொத்து என்ற உடன்படிக்கை நிலக் கருத்தைச் சுருக்கமாகத் தருகிறது.
theological_decisions:
- issue: மோசே நாட்டிற்குள் நுழையத் தடுக்கப்பட்டதற்கும் இஸ்ரவேலரின் நடத்தைக்கும் உள்ள தொடர்பு
  choice: உங்கள் வார்த்தைகளின் காரணமாக
  alternative: உங்களால் / உங்கள் காரணமாக
  rationale: மூல உரை ‘உங்கள் வார்த்தைகள்’ என்று வெளிப்படையாகக் கூறுவதால் அதை முதன்மை உரையில் பாதுகாக்கிறது; அதே வேளையில் அந்த சொற்றொடரின் சூழல்சார் விரிவான பொருளை அடிக்குறிப்பில் குறிப்பிடுகிறது, குற்றப்பொறுப்பு குறித்த இறையியல் இழுபறியைத் தீர்மானிக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ஒருமை/பன்மை வேறுபாட்டைப் பாதுகாக்க, மோசேயைச் சுட்டும் வடிவங்கள் ஒருமையிலும் இஸ்ரவேலரைச் சுட்டும் வடிவங்கள் மரியாதை/பன்மை வடிவத்திலும் உள்ளன. தேவப் பெயர் ‘யாவே’ என ஒலிபெயர்க்கப்பட்டுள்ளது.
