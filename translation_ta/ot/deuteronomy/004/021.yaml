  to: உங்கள் வார்த்தைகளின் காரணமாக[a] யாவே என்மீது கோபமடைந்தார். நான் யோர்தானைக் கடக்கமாட்டேன் என்றும், உங்கள் கடவுளாகிய யாவே உங்களுக்குச் சுதந்தரமாகக் கொடுக்கிற அந்த நல்ல நாட்டிற்குள் நுழையமாட்டேன் என்றும் அவர் சத்தியம் செய்தார்.
  rationale: ‘ஆணையிட்டார்’ என்பதற்குப் பதிலாக ‘சத்தியம் செய்தார்’ என மாற்றப்பட்டுள்ளது; இது וַיִּשָּׁבַע என்பதன் நேரடியான பொருளையும் வாக்கியத்தின் உறுதிமொழி அமைப்பையும் சரியாகக் காட்டுகிறது. நַחֲלָה என்பதற்காக ‘உரிமைச்சொத்தாக’ என்பதற்குப் பதிலாக இயல்பானதும் துல்லியமானதுமான ‘சுதந்தரமாக’ பயன்படுத்தப்பட்டுள்ளது. பிற கூறுகள் மூலத்தின் வெளிப்படையான சொற்களையும் அதன் இறையியல் இழுபறியையும் பாதுகாக்கின்றன.
