  yaml_path: translation/ot/deuteronomy/004/019.yaml
  text: And beware lest you lift up your eyes to heaven[a], and when you see the sun and the moon and the stars—all the host of heaven—you be drawn away and bow down to them and serve them[b], which Yahweh your God has allotted to all the peoples under all the heavens.
translation:
  language: ta
  text: நீ வானத்தை நோக்கி உன் கண்களை உயர்த்தி, சூரியனையும் சந்திரனையும் நட்சத்திரங்களையும்—வானத்தின் அனைத்துப் படையையும்—காணும்போது, நீ இழுக்கப்பட்டு அவற்றைப் பணிந்துகொண்டு அவற்றுக்குச் சேவை செய்யாதபடி எச்சரிக்கையாயிரு. யாவே, உன் கடவுள், அவற்றை வானம் முழுவதின் கீழுள்ள எல்லா மக்களுக்கும்[b] ஒதுக்கியிருக்கிறார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ஒதுக்கியிருக்கிறார்” என்பதற்கு “பங்கிட்டுக் கொடுத்திருக்கிறார்” அல்லது “பகிர்ந்தளித்திருக்கிறார்” என்றும் மொழிபெயர்க்கலாம். யாவே இவற்றை எல்லா மக்களுக்கும் ஒதுக்கினார் என்று எபிரெய உரை கூறுகிறது; அவர்கள் இவற்றை வழிபடுவதை அவர் அங்கீகரித்தார் என்று அந்தச் சொற்றொடரே கூறவில்லை.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயில் நேரடியாக, “எல்லா வானங்களின் கீழ்.” இதை “வானம் முழுவதின் கீழ்” என்றும் இயல்பாக மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפֶן
  choice: செய்யாதபடி எச்சரிக்கையாக இரு
  rationale: פן தொடங்கும் எச்சரிக்கையின் எதிர்மறை நோக்கத்தையும், தொடரில் வரும் சாத்தியமான விளைவையும் இயல்பான தமிழில் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: תִּשָּׂא עֵינֶיךָ הַשָּׁמַיְמָה
  choice: உன் கண்களை வானத்தை நோக்கி உயர்த்தி
  rationale: மேல்நோக்கிப் பார்ப்பதைக் குறிக்கும் எபிரெய மொழிமரபைத் தமிழில் புரியத்தக்கவாறு நெருக்கமாகப் பாதுகாக்கிறது.
- source_word: כֹּל צְבָא הַשָּׁמַיִם
  choice: வானத்தின் படை அனைத்தையும்
  rationale: צָבָא என்பதன் ‘படை/திரள்’ என்ற உருவகத்தைப் பாதுகாக்கிறது; சூழலில் இது வான்கோள்களின் முழுத் திரளைக் குறிக்கிறது, தேவதூதர்களாகக் குறுக்கப்படவில்லை.
- source_word: וְנִדַּחְתָּ
  choice: வழிவிலகி
  rationale: நிஃபால் வடிவம் ஒருவர் வழிதவறச் செய்யப்படுதல் அல்லது இழுக்கப்படுதல் என்ற கருத்தைக் கொண்டது; தமிழ் வாக்கியத்தில் ‘வழிவிலகி’ விசுவாசத் துரோகத்தின் திசையை இயல்பாகத் தருகிறது.
- source_word: וְהִשְׁתַּחֲוִיתָ לָהֶם
  choice: அவற்றைப் பணிந்துகொண்டு
  rationale: உடலைத் தாழ்த்திப் பணியும் செயலைப் பாதுகாக்கிறது; அடுத்துள்ள ‘சேவை செய்ய’ என்பதுடன் சேர்ந்து வழிபாட்டுப் பொருளை வெளிப்படுத்துகிறது.
- source_word: וַעֲבַדְתָּם
  choice: அவற்றுக்குச் சேவை செய்ய
  rationale: עבד என்பதன் அடிப்படை ‘சேவை செய்’ பொருளை வைத்துக்கொண்டு, இச்சூழலில் சிலைவழிபாட்டுச் சேவையையும் உணர்த்துகிறது.
- source_word: אֲשֶׁר חָלַק
  choice: பங்கிட்டுக் கொடுத்திருக்கிறார்
  rationale: חלק என்பதன் பகுத்தல்/பங்கிடுதல் பொருளைப் பாதுகாக்கிறது; அவற்றை வழிபடக் கடவுள் ஒப்புதல் அளித்தார் என்று மொழிபெயர்ப்பே தீர்மானிக்காமல் விடுகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய நான்கெழுத்துத் திருப்பெயரை ஒரு பொதுப் பட்டத்தால் மாற்றாமல், தமிழில் பரவலாகப் புரியக்கூடிய ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: לְכֹל הָעַמִּים
  choice: எல்லா மக்களுக்கும்
  rationale: עַמִּים என்பதன் பன்மை மக்களினங்கள்/மக்கள் குழுக்கள் என்ற பொருளை நவீன இயல்பான தமிழில் தருகிறது.
- source_word: תַּחַת כָּל הַשָּׁמָיִם
  choice: வானங்களின் கீழுள்ள
  rationale: எபிரெயின் ‘எல்லா வானங்களின் கீழ்’ என்ற விரிவான மொழிமரபை நெருக்கமாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: வான்கோள்களை எல்லா மக்களுக்கும் யாவே பங்கிட்டார் என்ற கூற்றின் பொருள்
  choice: அவை மக்களுக்குப் பங்கிடப்பட்டன என்ற எபிரெய உரையின் கூற்றை அப்படியே பாதுகாத்தல்
  alternative: வான்கோள்களை மக்களின் பொதுப் பயன்பாட்டுக்காகக் கடவுள் நியமித்தார்; அல்லது மக்களை அவற்றை வழிபடும்படி ஒப்புக்கொடுத்தார் என்று விளக்கமாக மொழிபெயர்த்தல்
  rationale: חלק என்பது பங்கிடுதல் அல்லது ஒதுக்குதல் என்று பொருள்படும். உடனடிச் சூழல் விக்கிரக வழிபாட்டைத் தடைசெய்கிறது; ஆனால் இந்தச் சொற்றொடர் அந்தப் பங்கீட்டின் துல்லிய நோக்கத்தை வெளிப்படையாகக் கூறவில்லை. ஆகவே வழிபாட்டுக்கு ஒப்புதல் அல்லது தண்டனையாக ஒப்புக்கொடுத்தல் என்ற எந்த விளக்கத்தையும் உரைக்குள் சேர்க்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், ஒருமை இரண்டாம் நபர் அறிவுறுத்தல் நடை பயன்படுத்தப்பட்டுள்ளது. உரையின் எச்சரிக்கைத் தொனியும் ‘பணிதல்—சேவை செய்தல்’ என்ற இணைச் செயல்களும் பாதுகாக்கப்பட்டுள்ளன. ‘வானத்தின் படை’ என்ற வேதாகம உருவகம் விளக்கமாகச் சுருக்கப்படாமல் வைக்கப்பட்டுள்ளது.
