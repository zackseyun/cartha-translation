revisions:
- from: நீ உன் கண்களை வானத்தை நோக்கி உயர்த்தி, சூரியனையும் சந்திரனையும் நட்சத்திரங்களையும்—வானத்தின் படை அனைத்தையும்—காணும்போது, வழிவிலகி அவற்றைப் பணிந்துகொண்டு அவற்றுக்குச் சேவை செய்யாதபடி எச்சரிக்கையாக இரு. அவற்றை உன் கடவுளாகிய யாவே வானங்களின் கீழுள்ள எல்லா மக்களுக்கும் பங்கிட்டுக் கொடுத்திருக்கிறார்.[a][b]
  to: நீ வானத்தை நோக்கி உன் கண்களை உயர்த்தி, சூரியனையும் சந்திரனையும் நட்சத்திரங்களையும்—வானத்தின் அனைத்துப் படையையும்—காணும்போது, நீ இழுக்கப்பட்டு அவற்றைப் பணிந்துகொண்டு அவற்றுக்குச் சேவை செய்யாதபடி எச்சரிக்கையாயிரு. யாவே, உன் கடவுள், அவற்றை வானம் முழுவதின் கீழுள்ள எல்லா மக்களுக்கும்[b] ஒதுக்கியிருக்கிறார்.[a]
  rationale: The revision restores the passive sense of being drawn astray, improves the Tamil apposition for ‘all the host of heaven,’ and places each footnote marker immediately after the wording it explains. It retains the source's ambiguity about the purpose or implication of Yahweh's allotment.
