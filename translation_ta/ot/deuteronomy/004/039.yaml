  source_fidelity: திருத்தம் தேவை. வரைவில் உள்ள ‘ஆகவே’ எபிரெய வவ் இணைப்பைவிடக் காரணவிளைவு உறவை அதிகப்படுத்துகிறது. மேலும், மூலத்தின் அறிவுறுத்தல் வரிசையும், ‘யாவே அவரே கடவுள்’ என்ற அடையாள/வலியுறுத்தல் அமைப்பும் தமிழில் தெளிவாக மீளமைக்கப்பட வேண்டும்.
  naturalness: தற்போதைய வாக்கியத்தின் நீண்ட முன்வைப்பு (‘யாவே ஒருவரே ... கடவுள் என்றும்’) இயல்பாக இல்லை. அறிவுறுத்தலை முதலில் வைத்து, அதன் உள்ளடக்கத்தை இரட்டைப்புள்ளிக்குப் பின் தருவது நவீனத் தரத் தமிழில் தெளிவானதும் கண்ணியமானதுமாகும்.
