  text: וְ/יָדַעְתָּ֣ הַ/יּ֗וֹם וַ/הֲשֵׁבֹתָ֮ אֶל לְבָבֶ/ךָ֒ כִּ֤י יְהוָה֙ ה֣וּא הָֽ/אֱלֹהִ֔ים בַּ/שָּׁמַ֣יִם מִ/מַּ֔עַל וְ/עַל הָ/אָ֖רֶץ מִ/תָּ֑חַת אֵ֖ין עֽוֹד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/039.yaml
  text: So know today[a], and take it to your heart, that Yahweh, he is God in the heavens above and on the earth beneath[b]; there is no other.
translation:
  language: ta
  text: 'இன்று அறிந்து, அதை உங்கள் இதயத்தில் பதித்துக்கொள்ளுங்கள்[a]: மேலே வானங்களிலும் கீழே பூமியிலும் கடவுள் யாவேதான்; வேறு எவரும் இல்லை[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'சொல்லுக்கு சொல்: “அதை உங்கள் இதயத்திற்குத் திரும்பக் கொண்டுவாருங்கள்”; அதாவது, உண்மையை உள்ளார்ந்து ஏற்று மனத்தில் கொள்ளுங்கள்.'
    reason: lexical_alternative
  - marker: b
    text: 'இன்னும் சொற்சார்பாக: “வேறு இல்லை” அல்லது “வேறு எதுவும் இல்லை.” சூழலில், யாவேக்கு அப்பால் கடவுளாக வேறு எவரும் இல்லை என்பதே பொருள்.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְיָדַעְתָּ הַיּוֹם
  choice: இன்று அறிந்து
  rationale: வினை வடிவம் இச்சூழலில் அறிவுறுத்தல் அல்லது வலியுறுத்தல் பொருளில் வருகிறது. הַיּוֹם என்பதன் உடனடித் தன்மையை ‘இன்று’ இயல்பாகக் காக்கிறது.
- source_word: וַהֲשֵׁבֹתָ אֶל־לְבָבֶךָ
  choice: அதை உங்கள் உள்ளத்தில் பதியவையுங்கள்
  rationale: சொல்லுக்கு சொல் வடிவில் ‘உங்கள் இதயத்திற்குத் திரும்பக் கொண்டுவாருங்கள்’ என்றாலும், இது உண்மையை உள்ளார்ந்து ஏற்று உறுதியாக மனத்தில் கொள்ளுதல் என்னும் எபிரெய மொழிவழக்கு. நவீன தமிழில் ‘உள்ளத்தில் பதியவையுங்கள்’ அந்தப் பொருளை இயல்பாகத் தெரிவிக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகத் திருப்பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் பரவலாகப் புரிந்துகொள்ளக்கூடிய ஒலிபெயர்ப்பாகத் தருகிறது.
- source_word: הוּא הָאֱלֹהִים
  choice: யாவே ஒருவரே … கடவுள் … அவரே கடவுள்
  rationale: הוּא தரும் வலியுறுத்தலைத் தமிழில் ‘ஒருவரே/அவரே’ மூலம் காக்கிறது. வானமும் பூமியும் குறித்த இரு பகுதிகளிலும் இயல்பான தமிழுக்காகப் பயனிலை வெளிப்படையாக அமைக்கப்பட்டுள்ளது.
- source_word: בַּשָּׁמַיִם מִמַּעַל וְעַל־הָאָרֶץ מִתָּחַת
  choice: மேலே வானங்களில் … கீழே பூமியிலும்
  rationale: மேல் வானங்கள்/கீழ் பூமி என்ற முழுப் படைப்பையும் உள்ளடக்கும் இணைப்பைத் தக்கவைக்கிறது; שָׁמַיִם என்பதன் பன்மை வடிவமும் காக்கப்படுகிறது.
- source_word: אֵין עוֹד
  choice: வேறு எவரும் இல்லை
  rationale: யாவேக்கு அப்பால் கடவுளாக வேறு ஒருவர் இல்லை என்ற முழுமையான தனித்தன்மைக் கூற்றைத் தெளிவாகவும் சுருக்கமாகவும் தருகிறது.
theological_decisions:
- issue: יְהוָה என்னும் திருப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலத்தில் தனிப்பட்ட திருப்பெயர் நேரடியாக இருப்பதால், அதை பொதுப் பட்டமாக மாற்றாமல் ஒலிபெயர்ப்பாகக் காக்கப்பட்டது.
- issue: אֵין עוֹד என்பதிலுள்ள தனித்துவமான இறைக் கூற்று
  choice: வேறு எவரும் இல்லை
  alternative: வேறு எதுவும் இல்லை; வேறு கடவுள் இல்லை
  rationale: மூலம் யாவேயின் ஒப்பற்ற இறைத்தன்மையை அறிவிக்கிறது. பின்னாளைய இறையியல் சூத்திரங்களைச் சேர்க்காமல் அந்த முழுமையான வலியுறுத்தல் காக்கப்பட்டது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டது. ஒருமை இரண்டாம் நபர் எபிரெய வடிவம் தமிழில் மரியாதைத் தொனியுடன் ‘உங்கள்/வையுங்கள்’ என வழங்கப்பட்டுள்ளது. ‘இதயம்’ என்பதற்குப் பதில் தமிழ் மொழிவழக்கில் சிந்தனை, விருப்பம், உள்ளார்ந்த ஏற்றுக்கொள்ளுதல் ஆகியவற்றை இயல்பாக உள்ளடக்கும் ‘உள்ளம்’ பயன்படுத்தப்பட்டுள்ளது.
