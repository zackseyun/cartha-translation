  text: וּ/בִקַּשְׁתֶּ֥ם מִ/שָּׁ֛ם אֶת יְהוָ֥ה אֱלֹהֶ֖י/ךָ וּ/מָצָ֑אתָ כִּ֣י תִדְרְשֶׁ֔/נּוּ בְּ/כָל לְבָבְ/ךָ֖ וּ/בְ/כָל נַפְשֶֽׁ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/029.yaml
  text: But from there you will seek Yahweh your God[a], and you will find him[b], if you seek him with all your heart and with all your soul.
translation:
  language: ta
  text: ஆனால், அங்கிருந்து உங்கள் கடவுளாகிய யாவேவைத் தேடுவீர்கள்; உங்கள் முழு மனதோடும் முழு உயிரோடும்[a] அவரை நாடினால், அவரைக் கண்டடைவீர்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “உயிர்” என்பதற்கான எபிரெயச் சொல் முழு வாழ்வு அல்லது முழு இருப்பையும் குறிக்கலாம்; “ஆத்துமா” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבִקַּשְׁתֶּם מִשָּׁם
  choice: ஆனால் அங்கிருந்து ... தேடுவீர்கள்
  rationale: முந்தைய எச்சரிக்கையுடன் உள்ள எதிர்மறைத் தொடர்பை ‘ஆனால்’ வெளிப்படுத்துகிறது; מִשָּׁם என்பதன் இடப்பொருளை ‘அங்கிருந்து’ நேரடியாகக் காக்கிறது.
- source_word: אֶת יְהוָה אֱלֹהֶיךָ
  choice: உங்கள் கடவுளாகிய யாவேவை
  rationale: יְהוָה என்ற உடன்படிக்கைப் பெயரை ‘யாவே’ என ஒலிபெயர்த்து, אֱלֹהֶיךָ என்பதை இயல்பான தமிழில் ‘உங்கள் கடவுளாகிய’ என வழங்குகிறது. எபிரெய உரையில் முன் வினை பன்மையாக இருந்தாலும் இங்குள்ள உடைமைப் பின்னொட்டு ஒருமையாக உள்ளது; கூட்டுமக்களை நோக்கிய தமிழில் மரியாதை/பன்மை வடிவம் இயல்பாக அமைகிறது.
- source_word: וּמָצָאתָ
  choice: அவரைக் கண்டடைவீர்கள்
  rationale: உரையில் செயப்படுபொருள் வெளிப்படையாக மீண்டும் வராவிட்டாலும், முந்தைய ‘யாவே’ என்பதே அதன் சூழல் சார்ந்த செயப்படுபொருள். ‘கண்டடைதல்’ வெற்றிகரமான தேடுதலைத் தெரிவிக்கிறது.
- source_word: כִּי
  choice: நாடினால்
  rationale: כִּי இங்கு கண்டடைவதற்கான நிபந்தனையை அறிமுகப்படுத்துவதால், தமிழ் நிபந்தனை வினையெச்சமான ‘-னால்’ மூலம் இயல்பாக வெளிப்படுத்தப்படுகிறது.
- source_word: תִדְרְשֶׁנּוּ
  choice: அவரை நாடினால்
  rationale: דרש என்பது கடவுளை ஆர்வத்துடனும் உறுதியுடனும் தேடுவதைச் சுட்டுகிறது. முதல் வினையிலுள்ள ‘தேடு’ என்பதிலிருந்து சொல் நயத்தை வேறுபடுத்தியும் அதன் உறவுசார் தீவிரத்தை ‘நாடு’ காக்கிறது.
- source_word: בְּכָל לְבָבְךָ
  choice: உங்கள் முழு இதயத்தோடும்
  rationale: לֵבָב எண்ணம், விருப்பம், உணர்வு அடங்கிய உள்ளார்ந்த மனிதனைச் சுட்டுகிறது; ‘முழு இதயம்’ தமிழில் புரிந்துகொள்ளத்தக்க, மரியாதைமிக்க உடன்படிக்கை மொழியாகும்.
- source_word: וּבְכָל נַפְשֶׁךָ
  choice: உங்கள் முழு உயிரோடும்
  rationale: נֶפֶשׁ இங்கு முழு உயிருள்ள தன்மையையும் வாழ்வையும் குறிக்கலாம். நவீன தமிழில் ‘உயிர்’ முழு சுயத்தையும் அர்ப்பணிப்பையும் தெளிவாகக் காட்டுகிறது; ‘ஆத்துமா’ என்ற மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: எபிரெய உரை நான்கெழுத்து இறைப் பெயரை நேரடியாகப் பயன்படுத்துகிறது. ‘யாவே’ அதை ஒரு பொதுப் பட்டமாக மாற்றாமல் உடன்படிக்கைப் பெயராகக் காக்கிறது.
- issue: נֶפֶשׁ என்ற மனித இயல்பைக் குறிக்கும் சொல்லின் பொருள்
  choice: உயிர்
  alternative: ஆத்துமா; முழு இருப்பு
  rationale: இந்த உபாகமச் சூத்திரத்தில் முழுமையான அர்ப்பணிப்பே மையம். ‘உயிர்’ என்பது נֶפֶשׁ என்பதன் வாழ்வு/முழுச் சுயம் என்ற பரப்பை இயல்பான தமிழில் காட்டுகிறது; தனியாகப் பிரிக்கக்கூடிய ஓர் அம்சம் என்ற கருத்தை தேவையின்றி திணிப்பதில்லை.
- issue: இறைவனைக் கண்டடைவதற்கான כִּי தொடர்பின் தன்மை
  choice: நிபந்தனை—‘நாடினால்’
  alternative: காலப்பொருள்—‘நாடும்போது’; காரணப்பொருள்—‘ஏனெனில்’
  rationale: சொற்றொடரமைப்பில் முழு இதயத்தோடும் உயிரோடும் நாடுதல், கண்டடைவதற்கான நிபந்தனையாக அமைகிறது. ‘நாடும்போது’ நிறைவேற்றம் தவிர்க்க முடியாதது என மிகைப்படுத்தக்கூடும்.
translation_notes:
  register: நவீன பொதுத்தரத் தமிழில், வாசிக்க எளிதானாலும் கண்ணியமான நடையில் அமைக்கப்பட்டுள்ளது. கடவுளைக் குறிக்கும் சுட்டுப்பெயராக மரியாதை வடிவமான ‘அவர்’ பயன்படுத்தப்பட்டுள்ளது. இரண்டாம் நபர் வடிவங்கள் தமிழில் இயல்பான கூட்டுமக்கள்/மரியாதைப் பன்மையாக வழங்கப்பட்டுள்ளன; எபிரெய உரையிலுள்ள பன்மை வினையிலிருந்து ஒருமை வடிவத்துக்கான மாற்றத்தை செயற்கையாகத் தமிழில் பிரதிபலிக்கவில்லை. அடிக்குறி [a] முதன்மை உரையில் இடம்பெற்றுள்ளது.
