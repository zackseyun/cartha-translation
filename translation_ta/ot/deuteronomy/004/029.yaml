- from: ஆனால் அங்கிருந்து உங்கள் கடவுளாகிய யாவேவைத் தேடுவீர்கள்; உங்கள் முழு இதயத்தோடும் உங்கள் முழு உயிரோடும்[a] அவரை நாடினால், அவரைக் கண்டடைவீர்கள்.
