review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the locative ‘from there,’ the divine name, the implicit object of ‘you will find,’ the conditional force of כִּי, and the total-devotion formula. The Hebrew shifts from a plural verb (‘you will seek’) to singular forms thereafter; maintaining Tamil plural address is a defensible idiomatic rendering for the people collectively.
  naturalness: The wording is generally clear and dignified, but repeating ‘உங்கள்’ before both coordinated phrases is heavier than natural modern Tamil. ‘முழு மனதோடும்’ is more idiomatic in this total-devotion formula while preserving the Hebrew ‘heart’ as the inner person.
  terminology: ‘யாவே’ appropriately renders יהוה. ‘உயிர்’ is a suitable contextual rendering of נֶפֶשׁ, provided its broader sense is retained in the footnote. ‘நாடுதல்’ appropriately conveys earnest seeking in the second clause.
  issues:
  - severity: low
    issue: The coordinated devotional phrase repeats ‘உங்கள்’ unnecessarily.
    rationale: Tamil reads more naturally as ‘உங்கள் முழு மனதோடும் முழு உயிரோடும்,’ without changing the source sense or the collective form of address.
  - severity: low
    issue: ‘முழு இதயம்’ is understandable but less idiomatic than ‘முழு மனம்’ in modern standard Tamil.
    rationale: In this context, ‘மனம்’ naturally conveys the Hebrew לֵבָב as the inner person, including intention and will; it does not require a doctrinal narrowing.
  revised_text: ஆனால், அங்கிருந்து உங்கள் கடவுளாகிய யாவேவைத் தேடுவீர்கள்; உங்கள் முழு மனதோடும் முழு உயிரோடும்[a] அவரை நாடினால், அவரைக் கண்டடைவீர்கள்.
  revised_footnotes:
