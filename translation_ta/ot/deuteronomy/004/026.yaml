base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/026.yaml
  text: I call heaven and earth to witness against you today that you will surely perish quickly from the land that you are crossing the Jordan to possess[a]. You will not prolong your days on it[c][b], for you will surely be destroyed.
translation:
  language: ta
  text: இன்று உங்களுக்கு எதிராக வானத்தையும் பூமியையும் சாட்சிகளாக அழைக்கிறேன்:[a] அதை உரிமையாக்கிக்கொள்வதற்காக நீங்கள் யோர்தானைக் கடந்து செல்லும் அந்த நாட்டிலிருந்து விரைவில் நிச்சயமாக அழிந்துபோவீர்கள். அதில் நீங்கள் நெடுநாள் வாழமாட்டீர்கள்;[b] நிச்சயமாக அழிக்கப்படுவீர்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இன்று உங்களுக்கு எதிராக வானத்தையும் பூமியையும் சாட்சிகளாகக் கொள்கிறேன்.”
