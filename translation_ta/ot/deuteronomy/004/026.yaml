    reason: lexical_alternative
lexical_decisions:
- source_word: הַעִידֹתִי בָכֶם
  choice: உங்களுக்கு எதிராக ... சாட்சிகளாக அழைக்கிறேன்
  rationale: עוּד என்பதன் ஹிஃபில் வடிவம் இங்கு சட்ட அல்லது உடன்படிக்கைச் சூழலில் சாட்சிகளை அழைக்கும் பொருளைக் கொண்டுள்ளது; בָכֶם என்பதன் எதிர்நிலைப் பொருளை ‘உங்களுக்கு எதிராக’ தெளிவாகக் காட்டுகிறது.
- source_word: אֶת הַשָּׁמַיִם וְאֶת הָאָרֶץ
  choice: வானத்தையும் பூமியையும்
  rationale: எபிரெயத்தில் ‘வானங்கள்’ எனப் பன்மை வடிவம் இருந்தாலும், உடன்படிக்கைச் சாட்சி வாய்ப்பாட்டை இயல்பான நவீனத் தமிழில் ‘வானமும் பூமியும்’ என்பது தெளிவாக எடுத்துரைக்கிறது.
- source_word: אָבֹד תֹּאבֵדוּן
  choice: நிச்சயமாக அழிந்துபோவீர்கள்
  rationale: வினையெச்ச முழுவடிவமும் வினைமுற்றும் இணைந்த எபிரெய அமைப்பு உறுதிப்பாட்டை வலியுறுத்துகிறது; ‘நிச்சயமாக’ அந்த அழுத்தத்தைத் தருகிறது.
- source_word: מַהֵר מֵעַל הָאָרֶץ
  choice: அந்த நாட்டிலிருந்து விரைவில்
  rationale: מַהֵר விரைவான நிகழ்வைக் குறிக்கிறது; מֵעַל הָאָרֶץ என்பது நாட்டின் மேற்பரப்பிலிருந்து நீக்கப்படுவதைத் தமிழில் இயல்பாக ‘நாட்டிலிருந்து’ எனத் தருகிறது.
- source_word: אֲשֶׁר אַתֶּם עֹבְרִים אֶת הַיַּרְדֵּן שָׁמָּה לְרִשְׁתָּהּ
  choice: அதை உரிமையாக்கிக்கொள்வதற்காக நீங்கள் யோர்தானைக் கடந்து செல்லும் அந்த நாடு
  rationale: שָׁמָּה காட்டும் இலக்கை ‘அந்த நாடு’ எனவும், ירשׁ என்பதன் உடன்படிக்கை-நிலச் சூழலை ‘உரிமையாக்கிக்கொள்வது’ எனவும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: לֹא תַאֲרִיכֻן יָמִים עָלֶיהָ
  choice: அதில் நீங்கள் நெடுநாள் வாழமாட்டீர்கள்
  rationale: சொல்லுக்குச் சொல் ‘அதன்மேல் நாட்களை நீட்டிக்கமாட்டீர்கள்’ என்ற உருவகத்தை, பொருள் மாறாமல் சாதாரண நவீனத் தமிழில் தெளிவாகத் தருகிறது.
- source_word: הִשָּׁמֵד תִּשָּׁמֵדוּן
  choice: நிச்சயமாக முற்றிலும் அழிக்கப்படுவீர்கள்
  rationale: நிஃபால் வினையின் செயப்பாட்டு நிலையும் தீவிரப்படுத்தும் எபிரெய அமைப்பும் பாதுகாக்கப்படுகின்றன; ‘முற்றிலும்’ அழிவின் வலிமையையும் ‘நிச்சயமாக’ அதன் உறுதியையும் தெரிவிக்கின்றன.
theological_decisions:
- issue: வானமும் பூமியும் உடன்படிக்கையின் சாட்சிகளாக அழைக்கப்படுதல்
  choice: படைப்பை இஸ்ரவேலுக்கு எதிரான சட்டச் சாட்சிகளாக அழைக்கும் வாய்ப்பாடாக மொழிபெயர்க்கப்பட்டது
  alternative: ‘வானத்தையும் பூமியையும் கொண்டு உங்களை எச்சரிக்கிறேன்’ என்று பொதுவான எச்சரிக்கையாக மொழிபெயர்த்தல்
  rationale: மூலத்தின் சட்ட மற்றும் உடன்படிக்கை வழக்கு மொழியைப் பாதுகாக்கிறது; அதற்கு அப்பாற்பட்ட கோட்பாட்டைச் சேர்க்கவில்லை.
- issue: இரண்டு அழிவு வினைகளின் உறவும் வலியுறுத்தலும்
  choice: முதலாவதை ‘அழிந்துபோவீர்கள்’ என்றும் இரண்டாவதைச் செயப்பாட்டு நிலையில் ‘அழிக்கப்படுவீர்கள்’ என்றும் வேறுபடுத்தி, இரண்டிலும் உறுதிப்பாட்டைப் பாதுகாத்தல்
  alternative: இரண்டையும் ஒரே விதமாக ‘முற்றிலும் அழிவீர்கள்’ என மொழிபெயர்த்தல்
  rationale: אָבַד மற்றும் שׁמד ஆகிய இரு வேறு வேர்ச்சொற்களையும், இரண்டாவது வினையின் நிஃபால் செயப்பாட்டு நுணுக்கத்தையும் அழிக்காமல் காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் மதிப்புமிக்க நடையில் அமைக்கப்பட்டது. ‘தேசம்’ என்பதற்குப் பதிலாக இயல்பான ‘நாடு’ பயன்படுத்தப்பட்டது; ‘உரிமையாக்கிக்கொள்வது’ என்பது ירשׁ என்பதன் நிலத்தைப் பெற்றுக்கொள்ளும் பொருளைப் பாதுகாக்கிறது. சட்டச் சாட்சி வாய்ப்பாடும் இரு வலியுறுத்தப்பட்ட அழிவு வினைகளின் வேறுபாடும் காக்கப்பட்டுள்ளன.
