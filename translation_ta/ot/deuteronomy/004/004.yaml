source:
  edition: WLC
  text: וְ/אַתֶּם֙ הַ/דְּבֵקִ֔ים בַּ/יהוָ֖ה אֱלֹהֵי/כֶ֑ם חַיִּ֥ים כֻּלְּ/כֶ֖ם הַ/יּֽוֹם׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/004.yaml
  text: But you who hold fast to Yahweh your God are all alive today[a].
translation:
  language: ta
  text: ஆனால், உங்கள் கடவுளாகிய யாவேயைப் பற்றிக்கொண்டிருக்கும் நீங்கள் அனைவரும் இன்று உயிரோடு இருக்கிறீர்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “ஒட்டிக்கொண்டிருக்கும்” அல்லது “விடாமல் பற்றிக்கொண்டிருக்கும்.” இந்தச் சொற்றொடர் யாவேயுடனான நெருக்கமான உடன்படிக்கைக்குரிய பற்றுதலைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַתֶּם
  choice: ஆனால் ... நீங்கள்
  rationale: முந்தைய வசனத்தில் பாகால்-பேயோரைப் பின்பற்றி அழிந்தவர்களுக்கும் இப்போது உரையாடப்படும் உயிரோடிருப்போருக்கும் உள்ள முரண்பாட்டை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: הַ/דְּבֵקִים
  choice: பற்றிக்கொண்டிருக்கிற
  rationale: דבק என்ற வினையின் நெருக்கமாக ஒட்டியிருத்தல், விடாமல் பற்றியிருத்தல் என்ற படிமத்தையும், தொடரும் உடன்படிக்கைப் பற்றுறுதியையும் நிகழ்காலப் பெயரெச்ச வடிவில் தக்கவைக்கிறது.
- source_word: בַּ/יהוָה
  choice: யாவேயைப்
  rationale: இணைப்பைக் குறிக்கும் בְ முன்னிலை, தமிழ் வினை அமைப்பில் செயப்படுபொருள் உருபால் இயல்பாக வெளிப்படுகிறது; יהוה என்ற உடன்படிக்கைப் பெயர் யாவே என ஒலிபெயர்க்கப்படுகிறது.
- source_word: אֱלֹהֵי/כֶם
  choice: உங்கள் கடவுளாகிய
  rationale: இரண்டாம் நபர் பன்மை உடைமைப் பொருளையும், யாவே அவர்களுடைய கடவுள் என்ற இணைப்பையும் தெளிவாகக் காக்கிறது.
- source_word: חַיִּים כֻּלְּ/כֶם
  choice: நீங்கள் அனைவரும் ... உயிரோடு இருக்கிறீர்கள்
  rationale: חַיִּים என்பதன் நிலைமையைக் குறிக்கும் பொருளையும் כֻּלְּכֶם தரும் முழுமையான வலியுறுத்தலையும் இயல்பான தமிழ் சொல்வரிசையில் தருகிறது.
- source_word: הַ/יּוֹם
  choice: இன்று
  rationale: குறிப்பிட்ட அந்த நாளின் நிகழ்காலச் சுட்டலை நவீன தமிழில் நேரடியாக வழங்குகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: எபிரெய உரையில் வரும் தனிப்பட்ட உடன்படிக்கைப் பெயரை பொதுப்பட்டப் பெயராக மாற்றாமல் ஒலிபெயர்த்து, அதன் தனித்த அடையாளத்தைப் பாதுகாக்கிறது.
- issue: דבק குறிக்கும் உறவின் தன்மை
  choice: பற்றிக்கொண்டிருக்கிற
  alternative: உறுதியாகப் பின்பற்றுகிற
  rationale: விசுவாசம் அல்லது கீழ்ப்படிதல் என மட்டும் விளக்கி இறையியல் பொருளைச் சுருக்காமல், மூலத்தின் உடல்சார்ந்த ‘ஒட்டிக்கொள்/பற்றிக்கொள்’ படிமத்தையும் உறவுசார் பதற்றத்தையும் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘பற்றிக்கொண்டிருக்கிற’ என்பது மூலத்தின் நிகழ்காலப் பெயரெச்சத்தையும் தொடரும் நெருக்கமான பற்றையும் காக்கிறது; அடிக்குறிப்பு குறியீடு முதன்மை உரையில் சேர்க்கப்பட்டுள்ளது.
