  text: בַּ/צַּ֣ר לְ/ךָ֔ וּ/מְצָא֕וּ/ךָ כֹּ֖ל הַ/דְּבָרִ֣ים הָ/אֵ֑לֶּה בְּ/אַחֲרִית֙ הַ/יָּמִ֔ים וְ/שַׁבְתָּ֙ עַד יְהוָ֣ה אֱלֹהֶ֔י/ךָ וְ/שָׁמַעְתָּ֖ בְּ/קֹלֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/030.yaml
  text: When you are in distress[a], and all these things come upon you[b], in the latter days you will return to Yahweh your God and listen to his voice.
translation:
  language: ta
  text: நீ நெருக்கடியில் இருக்கையில், இவையெல்லாம் உனக்கு நேரிடும்போது, பிற்கால நாட்களில்[a] நீ உன் கடவுளாகிய யாவேவிடம் திரும்பி, அவருடைய குரலுக்குச் செவிகொடுப்பாய்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘வருங்கால நாட்களில்’ என்றும் மொழிபெயர்க்கலாம். ‘பிற்கால நாட்களில்’ என்ற எபிரெயத் தொடர் பொதுவாக எதிர்காலத்திலுள்ள ஒரு காலத்தைக் குறிக்கலாம்; அதை ஒரு குறிப்பிட்ட இறுதிக்காலத் திட்டத்திற்கு மட்டும் கட்டுப்படுத்த வேண்டியதில்லை.
    reason: alternative_reading
  - marker: b
    text: ‘அவருடைய குரலுக்குக் கீழ்ப்படிவாய்’ என்றும் மொழிபெயர்க்கலாம். எபிரெய மொழியில் ‘குரலுக்குச் செவிகொடுத்தல்’ என்பது பல நேரங்களில் அதைக் கேட்டு கீழ்ப்படிந்து நடப்பதையும் உள்ளடக்குகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּצַּר לְךָ
  choice: நீ நெருக்கடியில் இருக்கையில்
  rationale: צַר என்பது இங்கு நெருக்கடி அல்லது துன்பமான சூழ்நிலையைக் குறிக்கிறது. வினையில்லாத எபிரெயத் தொடக்கத்தின் காலச்சூழலைத் தமிழில் இயல்பாக வெளிப்படுத்த ‘இருக்கையில்’ பயன்படுத்தப்பட்டது.
- source_word: וּמְצָאוּךָ
  choice: உனக்கு நேரிடும்போது
  rationale: מצא என்பதன் அடிப்படைப் பொருள் ‘கண்டடைதல்.’ ஆனால் நிகழ்வுகள் எழுவாயாக வரும் இச்சூழலில், அவை ஒருவரை வந்தடைவதை ‘உனக்கு நேரிடும்’ என்பது இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: כֹּל הַדְּבָרִים הָאֵלֶּה
  choice: இவையெல்லாம்
  rationale: דְּבָרִים என்பது ‘வார்த்தைகள்,’ ‘காரியங்கள்,’ அல்லது ‘நிகழ்வுகள்’ எனப் பொருள்படலாம். இங்கு முன்பு எச்சரிக்கப்பட்ட நிகழ்வுகளைச் சுட்டுவதால், ‘இவையெல்லாம்’ சுருக்கமாகவும் தெளிவாகவும் உள்ளது.
- source_word: בְּאַחֲרִית הַיָּמִים
  choice: பிற்கால நாட்களில்
  rationale: இந்த எபிரெயக் காலத்தொடர் எதிர்காலத்திலுள்ள ஒரு காலப்பகுதியைக் குறிக்கக்கூடும். ‘பிற்கால நாட்களில்’ அதன் வேதாகமச் சொல்லாட்சியையும், குறிப்பிட்ட இறுதிக்காலத் திட்டத்திற்குள் அதைச் சுருக்காத பரந்த பொருளையும் காக்கிறது.
- source_word: וְשַׁבְתָּ עַד
  choice: திரும்பி
  rationale: שׁוּב உடன் עַד வரும்போது ஒருவரிடம் திரும்புவதைக் குறிக்கிறது. ‘திரும்பி’ என்பது உறவுசார் மற்றும் உடன்படிக்கைச் சார்ந்த வலிமையைத் தக்கவைக்கிறது; மூலத்தில் வெளிப்படையாக இல்லாத விரிவான மனந்திரும்புதல் கருத்தைச் சேர்க்கவில்லை.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைப்பெயரான நான்கு எழுத்துப் பெயரை ஒரு பட்டப்பெயரால் மாற்றாமல், தமிழில் அதன் பரவலான ஒலிபெயர்ப்பான ‘யாவே’ என்று வழங்குகிறது.
- source_word: אֱלֹהֶיךָ
  choice: உன் கடவுள்
  rationale: இரண்டாம் நபர் ஆண்பால் ஒருமை உரிமை விகுதியைத் தக்கவைத்து, உடன்படிக்கைச் சார்ந்த நேரடி அழைப்பை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: וְשָׁמַעְתָּ בְּקֹלוֹ
  choice: அவருடைய குரலுக்குச் செவிகொடுப்பாய்
  rationale: שׁמע בְּקוֹל என்பது கேட்பதோடு கீழ்ப்படிந்து நடப்பதையும் குறிக்கலாம். ‘குரலுக்குச் செவிகொடுப்பாய்’ என்பது மூலத்தின் கேள்வுணர்வு உருவகத்தைப் பாதுகாத்து, கீழ்ப்படிதலின் நுண்பொருளையும் இயல்பாகத் தாங்குகிறது.
theological_decisions:
- issue: בְּאַחֲרִית הַיָּמִים என்ற காலத்தொடரை இறுதிக்காலக் கோட்பாடாக அளவுக்கு மீறிக் குறிப்பாக்கும் சாத்தியம்
  choice: பிற்கால நாட்களில்
  alternative: வருங்கால நாட்களில்
  rationale: எபிரெயத் தொடர் பரந்த பொருளில் வருங்காலத்தைச் சுட்டலாம்; ஒரு குறிப்பிட்ட இறுதிக்காலத் திட்டத்தை அவசியப்படுத்தாது. தேர்ந்த மொழிபெயர்ப்பு அதன் வேதாகம ஒலியையும் பொருள் திறப்பையும் காக்கிறது.
- issue: וְשַׁבְתָּ עַד יְהוָה என்பதிலுள்ள உடன்படிக்கைச் சார்ந்த திரும்புதல்
  choice: யாவேவிடம் திரும்பி
  alternative: மனந்திரும்பி யாவேவிடம் வந்து
  rationale: மூல வினை கடவுளிடம் திரும்புவதைச் சொல்கிறது. ‘திரும்பி’ என்பது உறவுசார் பொருளைத் தக்கவைத்து, மூலத்தில் வெளிப்படையாகக் கூறப்படாத விரிவான கோட்பாட்டு விளக்கத்தைச் சேர்ப்பதில்லை.
- issue: שׁמע בְּקוֹל என்பதில் கேட்பதற்கும் கீழ்ப்படிவதற்கும் இடையிலான பொருள் விரிவு
  choice: அவருடைய குரலுக்குச் செவிகொடுப்பாய்
  alternative: அவருடைய குரலுக்குக் கீழ்ப்படிவாய்
  rationale: முதன்மை உரை குரலைக் கேட்கும் உருவகத்தைப் பாதுகாக்கிறது; கீழ்ப்படிதல் என்ற சாத்தியமான வலிமை அடிக்குறிப்பில் வெளிப்படுத்தப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், நேரடி ஒருமை அழைப்பைத் தக்கவைத்து, பொதுவாசகர்களுக்கு எளிதாகவும் மரியாதைமிக்கதாகவும் வடிவமைக்கப்பட்டது. ‘யாவே’ என்பது இறைப்பெயரின் ஒலிபெயர்ப்பு. அடிக்குறிப்பு குறிகள் அவை விளக்கும் சொற்றொடர்களுக்குப் பின்பே வைக்கப்பட்டுள்ளன.
