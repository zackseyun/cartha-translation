base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/006.yaml
  text: So keep them and do them[a], for this is your wisdom and your understanding in the sight of the peoples, who will hear all these statutes and say[b], ‘Surely this great nation is a wise and understanding people.’
translation:
  language: ta
  text: அவற்றைக் கடைப்பிடித்து நடைமுறைப்படுத்துங்கள். ஏனெனில் இதுவே மக்களினங்களின் பார்வையில் உங்கள் ஞானமும் விவேகமும் ஆகும். அவர்கள் இந்த நியமங்கள்[a] அனைத்தையும் கேட்டு, “உண்மையாகவே[b], இந்தப் பெரிய நாடு ஞானமும் விவேகமும் உள்ள மக்களைக் கொண்டது!” என்று சொல்வார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “நியமங்கள்” என்பது חֻקִּים என்ற எபிரெயச் சட்டச் சொல்லை மொழிபெயர்க்கிறது; இதை “கட்டளைகள்” அல்லது “சட்டவிதிகள்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “இந்தப் பெரிய நாடு மட்டுமே ஞானமும் விவேகமும் உள்ள மக்களைக் கொண்டது.” எபிரெயச் சொல் רַק என்பதற்கு நேரடியாக “மட்டுமே” என்று பொருள் வரலாம்; இங்கு அது “உண்மையாகவே” என்ற வலியுறுத்தும் வியப்புச் சொல்லாகப் பயன்பட்டிருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׁמַרְתֶּם וַעֲשִׂיתֶם
  choice: கடைப்பிடித்து நடைமுறைப்படுத்துங்கள்
  rationale: שׁמר என்பதன் உடன்படிக்கைச் சூழலிலான ‘கடைப்பிடித்தல்’ என்ற பொருளையும், עשה வலியுறுத்தும் செயல்படுத்துதலையும் இயல்பான நவீன தமிழில் தனித்தனியாகப் பாதுகாக்கிறது.
- source_word: כִּי הִוא
  choice: ஏனெனில் இதுவே
  rationale: பெண்பால் ஒருமைச் சுட்டுப்பெயர் முன் கூறப்பட்ட கட்டளைகளையோ அவற்றைக் கடைப்பிடிக்கும் செயலையோ தொகுப்பாகச் சுட்டலாம்; ‘இதுவே’ அந்தத் தொடர்பைத் தேவையின்றி குறுக்காமல் வைக்கிறது.
- source_word: חָכְמַתְכֶם וּבִינַתְכֶם
  choice: உங்கள் ஞானமும் விவேகமும்
  rationale: חכמה மற்றும் בינה ஆகிய தொடர்புடைய, ஆனால் வேறுபட்ட கருத்துகளை ‘ஞானம்’, ‘விவேகம்’ எனத் தனித்துக் காட்டுகிறது.
- source_word: לְעֵינֵי הָעַמִּים
  choice: மக்களினங்களின் பார்வையில்
  rationale: சொல்லுக்குச் சொல் ‘மக்களினங்களின் கண்களில்’ என்பதன் பொதுமக்கள் முன் வெளிப்படும் மதிப்பீட்டு உணர்வை இயல்பான தமிழில் தருகிறது; பின்னர் வரும் גוי என்பதற்கான ‘நாடு’ என்பதிலிருந்தும் வேறுபடுத்துகிறது.
- source_word: כָּל הַחֻקִּים הָאֵלֶּה
  choice: இந்த நியமங்கள் அனைத்தையும்
  rationale: חֻקִּים என்பது அதிகாரபூர்வமாக நிறுவப்பட்ட விதிமுறைகளைக் குறிக்கும் சட்டச் சொல்; ‘நியமங்கள்’ அதன் சட்ட வலிமையைத் தக்கவைத்து, பொதுவான தமிழிலும் புரிகிறது.
- source_word: רַק
  choice: உண்மையாகவே
  rationale: רַק என்பதன் அடிப்படைப் பொருள் ‘மட்டுமே’ என்றாலும், இங்கு மக்களினங்களின் வியப்பும் உறுதியும் கலந்த முடிவை வலியுறுத்தும் சொல்லாக வருவதால் ‘உண்மையாகவே’ இயல்பாக அமைகிறது.
- source_word: עַם חָכָם וְנָבוֹן
  choice: ஞானமும் விவேகமும் உள்ள மக்கள்
  rationale: முன்னர் வந்த ‘ஞானம்’, ‘விவேகம்’ என்ற இணையை எதிரொலிக்கச் செய்து, தேசத்தின் மக்களைப் பற்றிய கூற்றாகத் தெளிவாக வழங்குகிறது.
theological_decisions:
- issue: கீழ்ப்படிதலுக்கும் ஞானத்துக்கும் உள்ள தொடர்பு
  choice: நியமங்களைக் கடைப்பிடித்து நடைமுறைப்படுத்துவது மற்ற மக்களினங்களின் பார்வையில் இஸ்ரவேலின் ஞானத்தையும் விவேகத்தையும் வெளிப்படுத்துகிறது.
  alternative: கீழ்ப்படிதலைப் பொருட்படுத்தாமல் நியமங்களே தனித்து அவர்களின் ஞானமும் விவேகமும் என்று வாசித்தல்.
  rationale: ‘கடைப்பிடித்து நடைமுறைப்படுத்துங்கள்; ஏனெனில் இதுவே...’ என்ற தொடரமைப்பு கீழ்ப்படிதலையும் பொதுவில் வெளிப்படும் ஞானத்தையும் இணைக்கிறது. அதேவேளை ‘இதுவே’ என்ற சுட்டு, நியமங்களுக்கும் அவற்றைச் செயல்படுத்துவதற்கும் இடையிலான இயல்பான தொடர்பை தேவையின்றி ஒற்றைப் பொருளாகச் சுருக்கவில்லை.
- issue: ரַק என்பதன் வலியுறுத்தல்
  choice: வியப்பும் உறுதியும் கொண்ட ‘உண்மையாகவே’ என்ற வாசிப்பு.
  alternative: ‘இந்தப் பெரிய நாடு மட்டுமே ஞானமும் விவேகமும் உள்ள மக்கள்’ என்ற விலக்குப் பொருள்.
  rationale: ரַק பொதுவாக ‘மட்டுமே’ எனப் பொருள்படலாம்; ஆனால் இங்குள்ள நேரடி கூற்றில் அது உறுதியான வியப்பை வெளிப்படுத்துவதாகப் புரிவது சூழலுக்கு இயல்பானது. மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் வேதவசனத்துக்கேற்ற கண்ணியமான நடையிலும் மொழிபெயர்க்கப்பட்டுள்ளது. ‘மக்களினங்கள்’ மற்றும் ‘நாடு’ என்பவை עמים / גוי என்ற மூலமொழிச் சொல் வேறுபாட்டைத் தக்கவைக்கின்றன; இரட்டை வினைச்சொல் அமைப்பும் ஞானம்–விவேகம் இணையும் பாதுகாக்கப்பட்டுள்ளன.
