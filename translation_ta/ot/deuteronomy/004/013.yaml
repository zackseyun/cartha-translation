revisions:
- from: அவர் உங்களுக்குத் தமது உடன்படிக்கையை அறிவித்தார்; நீங்கள் கடைப்பிடிக்கும்படி அவர் உங்களுக்குக் கட்டளையிட்ட பத்துச் சொற்களே[a] அந்த உடன்படிக்கை. அவற்றை அவர் இரண்டு கற்பலகைகளில் எழுதினார்.
  to: நீங்கள் செய்யும்படி அவர் உங்களுக்குக் கட்டளையிட்ட பத்துச் சொற்களாகிய[a] தமது உடன்படிக்கையை அவர் உங்களுக்கு அறிவித்தார். அவற்றை அவர் இரண்டு கல் பலகைகளின்மேல் எழுதினார்.
