  text: וַ/יַּגֵּ֨ד לָ/כֶ֜ם אֶת בְּרִית֗/וֹ אֲשֶׁ֨ר צִוָּ֤ה אֶתְ/כֶם֙ לַ/עֲשׂ֔וֹת עֲשֶׂ֖רֶת הַ/דְּבָרִ֑ים וַֽ/יִּכְתְּבֵ֔/ם עַל שְׁנֵ֖י לֻח֥וֹת אֲבָנִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/013.yaml
  text: And he declared to you his covenant[a], which he commanded you to do, the Ten Words; and he wrote them on two tablets of stone.
translation:
  language: ta
  text: நீங்கள் செய்யும்படி அவர் உங்களுக்குக் கட்டளையிட்ட பத்துச் சொற்களாகிய[a] தமது உடன்படிக்கையை அவர் உங்களுக்கு அறிவித்தார். அவற்றை அவர் இரண்டு கல் பலகைகளின்மேல் எழுதினார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “பத்துச் சொற்கள்”; மரபாக, “பத்துக் கட்டளைகள்.”
    reason: மூலச் சொற்றொடரின் நேரடிப் பொருளையும் பரிச்சயமான மரபுவழிப் பெயரையும் வேறுபடுத்திக் காட்டுகிறது.
lexical_decisions:
- source_word: וַיַּגֵּד
  choice: அறிவித்தார்
  rationale: נגד என்பதன் ஹிஃபில் வடிவம் ‘அறியச் செய்தல், அறிவித்தல்’ என்ற பொருளைக் கொண்டது. ‘அறிவித்தார்’ என்பது உடன்படிக்கைச் சூழலின் முறையான தொனியையும் நவீன தமிழின் இயல்பையும் காக்கிறது.
- source_word: בְּרִיתוֹ
  choice: தமது உடன்படிக்கை
  rationale: בְּרִית என்பது உறவையும் கட்டுப்படுத்தும் கடப்பாட்டையும் குறிக்கும் நிலையான வேதாகமச் சொல். மரியாதை ஒருமைக்கு ஏற்ற ‘தமது’ என்பதுடன் ‘உடன்படிக்கை’ தெளிவாக அமைகிறது.
- source_word: אֲשֶׁר צִוָּה אֶתְכֶם לַעֲשׂוֹת
  choice: நீங்கள் கடைப்பிடிக்கும்படி அவர் உங்களுக்குக் கட்டளையிட்ட
  rationale: לַעֲשׂוֹת என்பதன் நேரடிப் பொருள் ‘செய்ய’ என்பதாக இருந்தாலும், விதிக்கப்பட்ட சொற்களைச் ‘செய்தல்’ என்பதை இயல்பான தமிழில் ‘கடைப்பிடித்தல்’ தெளிவாக எடுத்துரைக்கிறது; கீழ்ப்படிந்து நடைமுறைப்படுத்தும் கருத்தும் காக்கப்படுகிறது.
- source_word: עֲשֶׂרֶת הַדְּבָרִים
  choice: பத்துச் சொற்கள்
  rationale: எபிரெயச் சொற்றொடரின் நேரடிப் பெயரிடலைக் காக்கிறது. பரவலாக அறியப்பட்ட ‘பத்துக் கட்டளைகள்’ என்ற மரபுவழி பெயரை முதன்மை உரைக்குள் மாற்றீடாகக் கொண்டுவராமல் அடிக்குறிப்பில் தருகிறது.
- source_word: וַיִּכְתְּבֵם
  choice: அவற்றை அவர் ... எழுதினார்
  rationale: כתב என்பது பொதுவாக ‘எழுது’ என்று பொருள்படும். கல்லில் பொறித்தல் சாத்தியமான கருத்தாக இருந்தாலும், மூல வினைச்சொல் அவ்வளவு குறிப்பான சொல்லைத் தேவைப்படுத்தவில்லை.
- source_word: שְׁנֵי לֻחֹת אֲבָנִים
  choice: இரண்டு கற்பலகைகள்
  rationale: கல்லால் செய்யப்பட்ட இரு பலகைகள் என்ற பொருளைச் சுருக்கமாகவும் இயல்பான நவீன தமிழிலும் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: עֲשֶׂרֶת הַדְּבָרִים என்பதன் மொழிபெயர்ப்பு
  choice: பத்துச் சொற்கள்
  alternative: பத்துக் கட்டளைகள்
  rationale: மூல உரை இவற்றை நேரடியாக ‘பத்துச் சொற்கள்’ எனப் பெயரிடுகிறது. ‘பத்துக் கட்டளைகள்’ என்பது பொருத்தமானதும் பரிச்சயமானதுமான மரபுவழிப் பெயர்; எனினும் மூலத்தின் சொந்தப் பெயரிடலுக்கு முன்னுரிமை அளித்து, அந்த மாற்றை அடிக்குறிப்பில் வைத்திருக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையைப் பயன்படுத்துகிறது. நீண்ட எபிரெய apposition-ஐ இயல்பான தமிழுக்காக இரண்டு வாக்கியங்களாக அமைத்து, ‘பத்துச் சொற்கள்’ உடன்படிக்கையை விளக்கும் அடையாள உறவை வெளிப்படையாகக் காக்கிறது. அடிக்குறிப்பு குறி அது சார்ந்த ‘பத்துச் சொற்கள்’ என்பதற்குப் பின்னரே வைக்கப்பட்டுள்ளது.
