base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/015.yaml
  text: So watch yourselves very carefully[b][a], since you saw no form on the day Yahweh spoke to you at Horeb from the midst of the fire.
translation:
  language: ta
  text: எனவே, உங்களை மிகவும் கவனமாகக் காத்துக்கொள்ளுங்கள்[a]; ஏனெனில், ஓரேபில் நெருப்பின் நடுவிலிருந்து யாவே உங்களிடம் பேசிய நாளில் நீங்கள் எந்த உருவத்தையும் காணவில்லை[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரேயில் சொல்லுக்குச் சொல்: ‘உங்கள் உயிர்களுக்காக மிகுந்த கவனத்துடன் உங்களைக் காத்துக்கொள்ளுங்கள்’; இது ‘உங்களை மிகவும் கவனமாகக் காத்துக்கொள்ளுங்கள்’ என்னும் பொருளுடைய மரபுத்தொடர்.'
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘எந்தச் சாயலையும்’ அல்லது ‘எந்தக் காணக்கூடிய தோற்றத்தையும்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנִשְׁמַרְתֶּם מְאֹד לְנַפְשֹׁתֵיכֶם
  choice: உங்கள் உயிர்களைக் குறித்து மிகவும் எச்சரிக்கையாக இருங்கள்
  rationale: எபிரேயச் சொற்றொடரின் தீவிரமான தற்காப்பு எச்சரிக்கையை இயல்பான தமிழில் தெரிவிக்கிறது; לְנַפְשֹׁתֵיכֶם என்பதிலுள்ள ‘உயிர்/தம்மை’ நுணுக்கத்தையும் முற்றிலும் மறைக்காமல் வைத்திருக்கிறது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய எச்சரிக்கைக்கான காரணத்தை அறிமுகப்படுத்தும் காரண இணைப்பைத் தெளிவாகக் காட்டுகிறது.
- source_word: לֹא רְאִיתֶם כָּל תְּמוּנָה
  choice: நீங்கள் எந்த உருவத்தையும் காணவில்லை
  rationale: תְּמוּנָה என்பது உருவம், தோற்றம், சாயல் அல்லது காணக்கூடிய பிரதிநிதித்துவம் எனப் பொருள்படலாம்; ‘உருவம்’ என்பது உடனடியான சூழலில் அதைச் செயற்கைச் சிலை என்று அளவுக்கு மீறிக் குறுக்காமல் இருக்கிறது.
- source_word: דִּבֶּר יְהוָה אֲלֵיכֶם
  choice: யாவே உங்களிடம் பேசிய
  rationale: אֶל என்பதன் திசைநோக்கிய பொருளையும், יהוה என்ற இறைப்பெயரையும் நேரடியாகத் தருகிறது.
- source_word: בְּחֹרֵב
  choice: ஓரேபில்
  rationale: இடப்பெயரைத் தமிழில் ஒலிபெயர்த்து, நிகழ்வு நடந்த இடத்தைக் குறிக்க இயல்பான வேற்றுமையுருபைப் பயன்படுத்துகிறது.
- source_word: מִתּוֹךְ הָאֵשׁ
  choice: நெருப்பின் நடுவிலிருந்து
  rationale: מִתּוֹךְ என்பதன் ‘உள்ளிருந்து/நடுவிலிருந்து’ என்ற தெளிவான இடவியல் படிமத்தைப் பாதுகாக்கிறது.
theological_decisions:
- issue: לְנַפְשֹׁתֵיכֶם என்பதன் மானிடவியல் நுணுக்கம்
  choice: உங்கள் உயிர்களைக் குறித்து மிகவும் எச்சரிக்கையாக இருங்கள்
  alternative: உங்களை மிகவும் எச்சரிக்கையாகக் காத்துக்கொள்ளுங்கள்
  rationale: இது முதன்மையாக தம்மைக் குறித்து விழிப்பாக இருக்கச் சொல்லும் எபிரேய மரபுத்தொடர். இருப்பினும் ‘உயிர்கள்’ என்ற சொல்லை முற்றிலும் மறைக்காமல் தருவது மூலத்தின் வடிவத்தைச் சற்றே பாதுகாக்கிறது; அடிக்குறிப்பு அதன் மரபுத்தொடர் பொருளை விளக்குகிறது. இதை உடல்–ஆன்மா வேறுபாட்டைப் போதிக்கும் தொழில்நுட்பக் கூற்றாக மாற்றவில்லை.
- issue: ஓரேபில் תְּמוּנָה இல்லாமையின் பொருள்
  choice: உருவம்
  alternative: சாயல்; உருவச்சிலை; காணக்கூடிய தோற்றம்
  rationale: இஸ்ரவேலர் யாவேயின் குரலைக் கேட்டாலும் காணக்கூடிய வடிவம் எதையும் காணவில்லை என்பதே வலியுறுத்தப்படுகிறது. ‘உருவம்’ அடுத்துவரும் விக்கிரகத் தடைச் சூழலுக்கு ஏற்றது; அதேவேளை இவ்வசனத்திலேயே சொல்லை ‘சிலை’ எனக் குறுக்கிவிடாது.
translation_notes:
  register: நவீனத் தரத் தமிழ்; பொதுவாசகர்களுக்குப் புரியக்கூடிய, மரியாதையும் எச்சரிக்கைத் தொனியும் கொண்ட நடை. இறைப்பெயர் יהוה ‘யாவே’ என்றும், חֹרֵב ‘ஓரேப்’ என்றும் ஒலிபெயர்க்கப்பட்டுள்ளது. மூல வாக்கியத்தின் காரணத் தொடர்பும் நெருப்பின் நடுவிலிருந்து பேசிய காட்சிப்படிமமும் பாதுகாக்கப்பட்டுள்ளன.
