revisions:
- from: அந்த நேரத்தில், நீங்கள் கைப்பற்றப்போகும் தேசத்திற்குள் கடந்து சென்று, அங்கே அவற்றின்படி நடக்கும்படி, விதிமுறைகளையும் நீதிநியமங்களையும்[a] உங்களுக்குக் கற்பிக்குமாறு யாவே எனக்குக் கட்டளையிட்டார்.[b]
  to: அந்த நேரத்தில், நீங்கள் கடந்து சென்று கைப்பற்றப்போகும்[b] தேசத்தில் அவற்றைக் கடைப்பிடிக்கும்படி, விதிமுறைகளையும் நீதிநியமங்களையும்[a] உங்களுக்குக் கற்பிக்க யாவே எனக்குக் கட்டளையிட்டார்.
  rationale: The revision retains all source elements while arranging the Tamil sentence so that ‘தேசத்தில்’ is explicitly modified by both ‘கடந்து சென்று’ and ‘கைப்பற்றப்போகும்,’ and so that the purpose of teaching is clear. It also moves footnote b to its lexical anchor. No disputed textual or doctrinal issue requires further review.
