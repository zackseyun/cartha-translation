  text: וְ/אֹתִ֞/י צִוָּ֤ה יְהוָה֙ בָּ/עֵ֣ת הַ/הִ֔וא לְ/לַמֵּ֣ד אֶתְ/כֶ֔ם חֻקִּ֖ים וּ/מִשְׁפָּטִ֑ים לַ/עֲשֹׂתְ/כֶ֣ם אֹתָ֔/ם בָּ/אָ֕רֶץ אֲשֶׁ֥ר אַתֶּ֛ם עֹבְרִ֥ים שָׁ֖מָּ/ה לְ/רִשְׁתָּֽ/הּ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/014.yaml
  text: And at that time Yahweh commanded me to teach you statutes and judgments[b][a], so that you might do them in the land that you are crossing over to possess.
translation:
  language: ta
  text: அந்த நேரத்தில், நீங்கள் கடந்து சென்று கைப்பற்றப்போகும்[b] தேசத்தில் அவற்றைக் கடைப்பிடிக்கும்படி, விதிமுறைகளையும் நீதிநியமங்களையும்[a] உங்களுக்குக் கற்பிக்க யாவே எனக்குக் கட்டளையிட்டார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'வேறு மொழிபெயர்ப்பு: “சட்டங்களையும் தீர்ப்புகளையும்.”'
    reason: lexical_alternative
  - marker: b
    text: '“கைப்பற்றப்போகும்” என்பதற்கு வேறு மொழிபெயர்ப்பு: “சுதந்தரிக்கப்போகும்.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைவனுடைய தனிப்பெயரை ஒரு பட்டத்தால் மாற்றாமல், எபிரெய நான்கெழுத்துப் பெயரின் பரவலான ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: צִוָּה
  choice: கட்டளையிட்டார்
  rationale: உடன்படிக்கைச் சட்டச் சூழலில் உள்ள அதிகாரபூர்வமான ஆணையை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: לְלַמֵּד
  choice: கற்பிக்குமாறு
  rationale: மோசே இஸ்ரவேலருக்குச் சட்டங்களைப் போதிக்கப் பெற்ற பணியைத் தெளிவாகக் காட்டுகிறது.
- source_word: חֻקִּים וּמִשְׁפָּטִים
  choice: விதிமுறைகளையும் நீதிநியமங்களையும்
  rationale: இரு எபிரெயச் சட்டச் சொற்களுக்கிடையேயான வேறுபாட்டை முடிந்தவரை காத்து, நவீன தமிழிலும் புரியக்கூடிய இணைச்சொற்களைப் பயன்படுத்துகிறது.
- source_word: לַעֲשֹׂתְכֶם אֹתָם
  choice: அவற்றின்படி நடக்கும்படி
  rationale: சட்டச் சூழலில் ‘அவற்றைச் செய்தல்’ என்பது அவற்றைக் கடைப்பிடித்து நடத்தலைக் குறிக்கிறது; சொல்லுக்குச் சொல் அமைப்பைவிட இது இயல்பாகவும் பொருள் தெளிவாகவும் உள்ளது.
- source_word: עֹבְרִים שָׁמָּה
  choice: தேசத்திற்குள் கடந்து சென்று
  rationale: யோர்தானைக் கடந்து வாக்குத்தத்த தேசத்திற்குள் நுழையும் இயக்கத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: לְרִשְׁתָּהּ
  choice: கைப்பற்றப்போகும்
  rationale: நிலத்தை உடைமையாக்குதல் அல்லது சுதந்தரித்தல் என்ற பொருள் வரம்பில், உடனடிச் சூழலுக்கேற்ற கைப்பற்றும் கருத்தைத் தருகிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் காக்கப்படுகிறது.
- source_word: וְאֹתִי
  choice: எனக்கு
  rationale: எபிரெயத்தில் முன்னிலைப்படுத்தப்பட்ட ‘என்னை’ என்ற கூறின் மெலிந்த வலியுறுத்தலை, தமிழின் இயல்பான வாக்கிய அமைப்பில் ‘எனக்குக் கட்டளையிட்டார்’ என வழங்குகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: யெகோவா
  rationale: தனிப்பட்ட இறைப்பெயரை ‘ஆண்டவர்’ போன்ற பட்டத்தால் மாற்றாமல் ஒலிபெயர்க்கிறது; தமிழ் வாசிப்பில் பரவலாக அறியப்பட்ட ‘யாவே’ வடிவம் தேர்ந்தெடுக்கப்பட்டது.
- issue: לְרִשְׁתָּהּ என்பதிலுள்ள உடைமையாக்குதல்/சுதந்தரித்தல் நுணுக்கம்
  choice: கைப்பற்றப்போகும்
  alternative: சுதந்தரிக்கப்போகும்
  rationale: உடனடிச் சூழலில் தேசத்திற்குள் கடந்து சென்று அதை உடைமையாக்கும் செயலை முன்னிறுத்துகிறது; தெய்வீகக் கொடை அல்லது சுதந்தரிப்பு நுணுக்கத்தை நீக்காமல் அடிக்குறிப்பில் மாற்றாக வழங்குகிறது.
translation_notes:
  register: நவீன செந்தமிழ் சார்ந்த, கண்ணியமான பொதுவாசகர் நடையைப் பயன்படுத்துகிறது. எபிரெயச் சட்டச் சொற்களின் இணை வேறுபாடு காக்கப்பட்டுள்ளது. இயல்புக்காக நீளமான நோக்கக் கூறு தமிழில் முன்னிறுத்தப்பட்டுள்ளது; [b] குறி கைப்பற்றுதல்/சுதந்தரித்தல் மாற்றத்துடன் தொடர்புடைய வாக்கிய முடிவில் வைக்கப்பட்டுள்ளது.
