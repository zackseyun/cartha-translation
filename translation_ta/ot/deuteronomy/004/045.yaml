translation_notes:
  register: நவீன நிலையான தமிழில், சட்டவியல் கண்ணியத்தைத் தக்கவைக்கும் இயல்பான சொற்கள் பயன்படுத்தப்பட்டுள்ளன. மூன்று எபிரெய சட்டப் பிரிவுகளின் வேறுபாடு முடிந்தவரை பாதுகாக்கப்பட்டுள்ளது; தமிழ் வாக்கிய இயல்புக்காகச் சார்புத்தொடர் முதலில் வைக்கப்பட்டு, “இவையே” இறுதியில் வலியுறுத்தப்பட்டுள்ளது.
