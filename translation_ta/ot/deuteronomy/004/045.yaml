base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/045.yaml
  text: These are the testimonies[a], the statutes, and the judgments that Moses spoke to the sons of Israel when they came out from Egypt.
translation:
  language: ta
  text: இஸ்ரவேல் மக்கள்[a] எகிப்திலிருந்து புறப்பட்டு வந்தபோது, மோசே அவர்களிடம் கூறிய சான்றுரைகளும், சட்டதிட்டங்களும், நீதித்தீர்ப்புகளும் இவையே.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் நேர்ச்சொல்லாக, “இஸ்ரவேலின் மகன்கள்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה
  choice: இவையே
  rationale: பின்வரும் சட்டப் பிரிவுகளைச் சுட்டிக்காட்டும் பன்மைச் சுட்டுப்பெயர். வினைச்சொல் இல்லாத எபிரெய வாக்கியத்தின் அடையாளப்படுத்தும் வலிமையைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: הָעֵדֹת
  choice: சான்றுரைகள்
  rationale: உடன்படிக்கைக்குச் சான்றாக நிற்கும் கட்டளைகள் அல்லது நிபந்தனைகள் என்ற சட்டத் தொடர்புடைய பொருளைத் தக்கவைத்து, மற்ற இரண்டு சட்டப் பிரிவுகளிலிருந்தும் வேறுபடுத்துகிறது.
- source_word: הַחֻקִּים
  choice: சட்டதிட்டங்கள்
  rationale: நிர்ணயிக்கப்பட்ட சட்டங்களைக் குறிக்கும் חֻקִּים என்பதற்கு நவீனத் தமிழில் தெளிவான, மரியாதையான இணைச்சொல்.
- source_word: הַמִּשְׁפָּטִים
  choice: நீதித்தீர்ப்புகள்
  rationale: நீதிமுறைத் தீர்ப்புகள் அல்லது சட்டத் தீர்மானங்கள் என்ற பொருளைப் பாதுகாத்து, חֻקִּים என்பதிலிருந்து தனிப் பிரிவாகக் காட்டுகிறது.
- source_word: אֲשֶׁר דִּבֶּר מֹשֶׁה
  choice: மோசே ... கூறிய
  rationale: דבר என்பதன் நேரடியான பேச்சுச் செயலை இயல்பான தமிழில் தருகிறது; தேவையில்லாமல் ‘அறிவித்தார்’ என்ற கூடுதல் அதிகாரப்பூர்வ நுட்பத்தைச் சேர்க்கவில்லை.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்கள்
  rationale: முழு சமூகத்தையும் குறிக்கும் எபிரெய இனப்பெயரை நவீனத் தமிழில் உள்ளடக்கமாகவும் இயல்பாகவும் தருகிறது; நேர்ச்சொல் வடிவம் அடிக்குறிப்பில் குறிப்பிடப்படுகிறது.
- source_word: בְּצֵאתָם מִמִּצְרָיִם
  choice: எகிப்திலிருந்து புறப்பட்டு வந்தபோது
  rationale: முன்னொட்டுடன் கூடிய infinitive construct-இன் காலப்பொருளையும், எகிப்திலிருந்து வெளியேறிய இயக்கத்தையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
