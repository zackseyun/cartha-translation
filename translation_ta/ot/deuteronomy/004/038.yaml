source:
  edition: WLC
  text: לְ/הוֹרִ֗ישׁ גּוֹיִ֛ם גְּדֹלִ֧ים וַ/עֲצֻמִ֛ים מִמְּ/ךָ֖ מִ/פָּנֶ֑י/ךָ לַ/הֲבִֽיאֲ/ךָ֗ לָֽ/תֶת לְ/ךָ֧ אֶת אַרְצָ֛/ם נַחֲלָ֖ה כַּ/יּ֥וֹם הַ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/038.yaml
  text: to drive out before you nations greater and mightier than you[a], to bring you in, to give you their land as an inheritance[b], as it is this day.
translation:
  language: ta
  text: உன்னைவிடப் பெரியவையும் வலிமைமிக்கவையுமான தேசங்களை உன் முன்பாக இருந்து துரத்தி[a], உன்னை அங்கே கொண்டு வந்து, அவற்றின் நாட்டை உனக்கு மரபுரிமையாகக் கொடுக்கும்படி—இன்று இருப்பதுபோல[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அவர்களின் நாட்டுரிமையைப் பறித்து அகற்றி’ அல்லது ‘முன்னிருந்தவர்களை அகற்றி, மற்றொருவருக்கு உரிமையாக்கி’ என்றும் பொருள் கொள்ளலாம். எபிரெய வினை, முன்பு குடியிருந்தவர்களை அகற்றுவதன் மூலம் மற்றொருவர் அந்த நாட்டைப் பெறச் செய்வதைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில், ‘இந்த நாளைப்போல.’ இது ‘இன்று கண்கூடாக இருப்பதுபோல’ அல்லது ‘இன்றைய நிலவரப்படி’ என்று பொருள்படும் மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְהוֹרִישׁ
  choice: துரத்திவிட்டு
  rationale: ஹிஃபில் வடிவில் இவ்வினை, முன்பு குடியிருந்தவர்களை அகற்றி மற்றொருவர் நாட்டைப் பெறச் செய்வதைக் குறிக்கிறது. இங்கு அதன் செயப்படுபொருள் ‘தேசங்கள்’ என்பதால் ‘துரத்திவிட்டு’ என்பது இயல்பாகவும் தெளிவாகவும் உள்ளது; அடிக்குறிப்பு விரிவான பொருளையும் தருகிறது.
- source_word: גּוֹיִם
  choice: தேசங்களை
  rationale: உபாகமத்தின் அரசியல்-நிலப்பரப்புச் சூழலில் ‘தேசங்கள்’ என்பது பொருத்தமான நவீனத் தமிழ் இணைச்சொல்.
- source_word: גְּדֹלִים וַעֲצֻמִים מִמְּךָ
  choice: உன்னைவிடப் பெரியவையும் வலிமைமிக்கவையுமான
  rationale: מִמְּךָ குறிக்கும் ஒப்பீட்டை வெளிப்படையாகக் காத்து, அளவு மற்றும் ஆற்றல் ஆகிய இரு கூறுகளையும் இயல்பான தமிழில் தருகிறது.
- source_word: מִפָּנֶיךָ
  choice: உன் முன்னிலையிலிருந்து
  rationale: ஒருவரின் முகத்துக்கு முன்பாக அல்லது இருப்பிடத்திலிருந்து அகற்றுதல் என்ற எபிரெய மரபுத்தொடரின் இடவியல் உருவகத்தைப் பாதுகாக்கிறது.
- source_word: לַהֲבִיאֲךָ
  choice: உன்னை உள்ளே கொண்டுவந்து
  rationale: செல்லும் இடம் அடுத்த சொற்றொடரில் நாட்டால் தெளிவாகிறது; ‘உள்ளே’ என்பது சூழலால் உணர்த்தப்படும் நாட்டுக்குள் நுழைதலை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: לָתֶת לְךָ אֶת אַרְצָם
  choice: அவற்றின் நாட்டை உனக்குக் கொடுப்பதற்காக
  rationale: நாடு இறைவனால் கொடுக்கப்படும் பரிசு என்ற நேரடியான வாக்கிய அமைப்பையும் நோக்கத்தையும் காக்கிறது.
- source_word: נַחֲלָה
  choice: உரிமைச்சொத்தாக
  rationale: தலைமுறை வழியாக நிலைத்திருக்கும், ஒதுக்கிக் கொடுக்கப்பட்ட உடைமை என்ற נחלה என்பதன் நிலவுரிமை நுண்பொருளை, தனிப்பட்ட வாரிசுரிமை என்று தவறாகக் குறுக்காமல் இயல்பான தமிழில் தருகிறது.
- source_word: כַּיּוֹם הַזֶּה
  choice: இன்று நிலைமை இருப்பதுபோல
  rationale: ‘இந்த நாளைப்போல’ என்ற சொற்படி வடிவத்தைவிட, தற்போதைய கண்கூடான நிலையைச் சுட்டும் உபாகம மரபுத்தொடரின் பொருளைத் தெளிவாகத் தருகிறது.
theological_decisions:
- issue: נַחֲלָה என்பதிலுள்ள உடன்படிக்கை-நில உரிமைக் கருத்து
  choice: உரிமைச்சொத்தாக
  alternative: சுதந்தரமாக / வாரிசுரிமையாக
  rationale: ‘உரிமைச்சொத்து’ என்பது இறைவன் ஒதுக்கிக் கொடுத்த நிலையான நிலவுடைமை என்ற கருத்தைக் காக்கிறது. ‘வாரிசுரிமை’ என்பது தமிழில் முன்னோர் இறந்தபின் கிடைக்கும் சொத்து என்ற குறுகிய எண்ணத்தை ஏற்படுத்தக்கூடும்; ‘சுதந்தரம்’ நவீன வாசகருக்கு தெளிவற்றதாக இருக்கலாம்.
translation_notes:
  register: நவீன நிலையான தமிழில், ஒருமை இரண்டாம் நபர் வடிவங்களைக் காத்து, கண்ணியமான ஆனால் பொதுவாசகருக்குப் புரியும் நடையில் மொழிபெயர்க்கப்பட்டது. முந்தைய வசனங்களுடன் தொடரும் நோக்கத் தொடர் என்பதால், தமிழில் முழு வாக்கியமாக இயங்க ‘அவர் இப்படிச் செய்தார்’ என்பது சூழலிலிருந்து தெளிவாக்கப்பட்டு சேர்க்கப்பட்டுள்ளது; கோடு இறுதி மரபுத்தொடரின் விளக்கத் தன்மையை வெளிப்படுத்துகிறது.
