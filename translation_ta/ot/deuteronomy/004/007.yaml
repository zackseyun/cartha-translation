  text: כִּ֚י מִי ג֣וֹי גָּד֔וֹל אֲשֶׁר ל֥/וֹ אֱלֹהִ֖ים קְרֹבִ֣ים אֵלָ֑י/ו כַּ/יהוָ֣ה אֱלֹהֵ֔י/נוּ בְּ/כָּל קָרְאֵ֖/נוּ אֵלָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/007.yaml
  text: For what great nation is there that has gods so near to it as Yahweh our God is to us whenever we call on him?[a][b]
translation:
  language: ta
  text: ஏனெனில், நாம் அவரை நோக்கிக் கூப்பிடும்போதெல்லாம்[b] நம் கடவுளாகிய யாவே நமக்கு நெருக்கமாக இருப்பதைப்போல, தெய்வங்கள்[a] அதற்கு நெருக்கமாக இருக்கும் பெரிய தேசம் எது?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரேய மொழியில், ‘தெய்வங்கள்’ என்பது பன்மை. இந்த வசனம் பிற தேசங்களின் தெய்வங்களை இஸ்ரவேலின் கடவுளாகிய யாவேயுடன் சொல்லாட்சிவழி ஒப்பிடுகிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘நாம் அவரை நோக்கிக் கூப்பிடும் ஒவ்வொரு முறையும்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய அறிவுறுத்தலுக்கான காரணத்தை அறிமுகப்படுத்தும் வாதத் தொடர்பைப் பாதுகாக்கிறது.
- source_word: מִי גוֹי גָּדוֹל
  choice: பெரிய தேசம் எது?
  rationale: எபிரேய மொழியின் வினாவடிவச் சொல்லாட்சியை இயல்பான நவீன தமிழில் தக்கவைக்கிறது.
- source_word: אֲשֶׁר לוֹ
  choice: தன்னிடம் ... இருக்கும்
  rationale: ஒரு தேசத்தோடு அதன் தெய்வங்கள் கொண்டிருப்பதாகக் கருதப்படும் தொடர்பை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: אֱלֹהִים קְרֹבִים
  choice: தெய்வங்கள் ... நெருக்கமாக
  rationale: கְרֹבִים என்ற பன்மை அடைமொழி காரணமாக אֱלֹהִים இங்கு பிற தேசங்களின் தெய்வங்களைச் சுட்டும் பொதுப்பெயர் பன்மையாக எடுத்துக்கொள்ளப்படுகிறது.
- source_word: אֵלָיו
  choice: தன்னிடம்
  rationale: இப்பெயர்ச்சுட்டு גּוֹי, அதாவது தேசத்தைக் குறிக்கிறது; தமிழில் தற்சுட்டுச் சொல் குறிப்பைத் தெளிவாக்குகிறது.
- source_word: כַּיהוָה אֱלֹהֵינוּ
  choice: நம் கடவுளாகிய யாவே
  rationale: ஒப்பீட்டின் இரண்டாம் கூறை இயல்பாக அமைத்தும், יהוה என்ற தனிப்பட்ட இறைப்பெயரை யாவே என ஒலிபெயர்த்தும் உள்ளது.
- source_word: בְּכָל קָרְאֵנוּ אֵלָיו
  choice: நாம் அவரை நோக்கிக் கூப்பிடும்போதெல்லாம்
  rationale: בְּכָל உடன் வரும் வினைபெயர் கட்டமைப்பின் ‘ஒவ்வொரு முறையும்/எப்போதெல்லாம்’ என்ற மீள்நிகழ்வுப் பொருளையும், אֵלָיו என்பதன் ‘அவரை நோக்கி’ என்ற திசைப்பொருளையும் பாதுகாக்கிறது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலத்தில் வரும் உடன்படிக்கைப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், நவீன தமிழில் பரவலாகப் புரியக்கூடிய ஒலிபெயர்ப்பாக வழங்குகிறது.
- issue: முதல் கூறிலுள்ள אֱלֹהִים ஒருமையா பன்மையா
  choice: பிற தேசங்களின் ‘தெய்வங்கள்’ எனப் பன்மை
  alternative: கடவுள் / தெய்வீக உயிர்கள்
  rationale: கְרֹבִים என்ற பன்மை அடைமொழியும், பின்னர் இஸ்ரவேலின் கடவுளாகிய யாவேயுடன் செய்யப்படும் ஒப்பீடும் பன்மை வாசிப்பை ஆதரிக்கின்றன; இவ்வாசிப்பு அந்தத் தெய்வங்களின் உண்மை இருப்பைத் தானாக உறுதிப்படுத்துவதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையும் வாசிப்புத் தெளிவும் கொண்ட சொல்லாட்சி பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் இரண்டு இணைந்த வினாவடிவக் கூறுகள் தமிழில் கேள்வியும் வியப்பும் கலந்த சொல்லாட்சியாக அமைக்கப்பட்டுள்ளன; ‘இவ்வளவு நெருக்கமாக’ என்பது ஒப்பீட்டு வலிமையை இயல்பாக வெளிப்படுத்துகிறது.
