  to: ஏனெனில், நாம் அவரை நோக்கிக் கூப்பிடும்போதெல்லாம்[b] நம் கடவுளாகிய யாவே நமக்கு நெருக்கமாக இருப்பதைப்போல, தெய்வங்கள்[a] அதற்கு நெருக்கமாக இருக்கும் பெரிய தேசம் எது?
