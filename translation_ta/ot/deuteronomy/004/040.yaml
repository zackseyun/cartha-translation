base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/040.yaml
  text: So you shall keep his statutes and his commandments that I am commanding you today[a], so that it may go well with you and with your children after you[c][b], and so that you may prolong your days on the land that Yahweh your God is giving you for all your days.
translation:
  language: ta
  text: ஆகையால், இன்று நான் உனக்குக் கட்டளையிடுகிற உன் கடவுளாகிய யாவேயின் விதிமுறைகளையும் கட்டளைகளையும் நீ கடைப்பிடி; அப்போது உனக்கும் உனக்குப் பின் வரும் உன் பிள்ளைகளுக்கும் நன்மை உண்டாகவும், யாவே உனக்குக் கொடுக்கிற நிலத்தில் நீண்ட நாட்கள் வாழவும்[a] செய்வாய்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் இறுதியாக ‘எல்லா நாட்களும்’ என்ற சொற்றொடர் உள்ளது. இது நிலத்தில் வாழும் காலத்தின் நீட்சியை வலியுறுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁמַרְתָּ
  choice: கடைப்பிடிக்க வேண்டும்
  rationale: உடன்படிக்கைச் சூழலில் שׁמר என்பது கட்டளைகளைப் பின்பற்றி ஒழுகுவதைக் குறிக்கிறது. முந்தைய உரையிலிருந்து வரும் முடிவையும் கட்டளை வலிமையையும் ‘ஆகையால்’ மற்றும் ‘வேண்டும்’ இயல்பாக வெளிப்படுத்துகின்றன.
- source_word: חֻקָּיו
  choice: அவருடைய சட்டங்கள்
  rationale: חֻקִּים என்பது வகுத்தளிக்கப்பட்ட நியமங்களைக் குறிக்கிறது; מִצְוֹת என்பதிலிருந்து வேறுபாட்டைத் தக்கவைக்க ‘சட்டங்கள்’ பயன்படுத்தப்படுகிறது.
- source_word: מִצְוֺתָיו
  choice: அவருடைய கட்டளைகள்
  rationale: מִצְוָה என்பதன் நேரடியான உடன்படிக்கைச் சொல்லாட்சி ‘கட்டளை’; பெயர்ச்சொல் வடிவம் தக்கவைக்கப்படுகிறது.
- source_word: אֲשֶׁר אָנֹכִי מְצַוְּךָ הַיּוֹם
  choice: இன்று நான் உனக்குக் கட்டளையிடுகிற
  rationale: எபிரெயப் பெயரெச்சம் நிகழும் பேச்சுச் சூழலைக் குறிக்கிறது; தமிழில் நிகழ்கால உறவெச்சம் இயல்பானது.
- source_word: אֲשֶׁר יִיטַב לְךָ
  choice: நீ நன்றாக வாழவும்
  rationale: יִיטַב לְךָ என்பது ஒருவருக்கு நன்மை உண்டாகுதல் அல்லது வாழ்வு நன்றாக அமைதல் என்ற மொழிவழக்காகும்; தமிழில் ‘நன்றாக வாழ’ அதன் பரந்த நல்வாழ்வுப் பொருளை இயல்பாகத் தருகிறது.
- source_word: וּלְבָנֶיךָ אַחֲרֶיךָ
  choice: உனக்குப் பின் உன் பிள்ளைகள்
  rationale: בָּנִים என்பது சூழலுக்கேற்ப மகன்கள், பிள்ளைகள் அல்லது சந்ததியினர் என அமையலாம். தலைமுறைத் தொடர்ச்சியை உள்ளடக்கியும் ஆண்களுக்கு மட்டும் குறுக்காமலும் ‘பிள்ளைகள்’ பயன்படுத்தப்படுகிறது.
- source_word: וּלְמַעַן תַּאֲרִיךְ יָמִים
  choice: நீண்ட காலம் வாழவும்
  rationale: சொல்லுக்கு சொல் ‘நாட்களை நீட்டித்தல்’ என்றாலும், தமிழில் இதன் இயல்பான பொருள் ‘நீண்ட காலம் வாழுதல்’; நோக்கக் கூறு ‘வாழவும்’ மூலம் தக்கவைக்கப்படுகிறது.
- source_word: עַל הָאֲדָמָה
  choice: நிலத்தில்
  rationale: אֲדָמָה இங்கு பொதுவான மண்ணை அல்ல, கடவுள் கொடுக்கும் நிலத்தைக் குறிக்கிறது. עַל என்பதன் இடப்பொருள் தமிழில் ‘நிலத்தில்’ என்று இயல்பாக அமைகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: திருநான்கெழுத்துத் தெய்வீகப் பெயர் ஒரு பட்டத்தால் மாற்றப்படாமல், தமிழில் பரவலாகப் புரியக்கூடிய ‘யாவே’ என்று ஒலிபெயர்க்கப்படுகிறது.
- source_word: נֹתֵן לְךָ
  choice: உனக்குக் கொடுக்கிற
  rationale: எபிரெயப் பெயரெச்சம் தொடரும் அல்லது உடனடியாக நிறைவேறும் கொடுப்பை வெளிப்படுத்துகிறது; தமிழ் நிகழ்கால உறவெச்சம் இதைத் தக்கவைக்கிறது.
- source_word: כָּל הַיָּמִים
  choice: நீண்ட காலம்
  rationale: இறுதிக் கூறு நிலத்தில் வாழும் காலத்தின் நீட்சியை வலியுறுத்துகிறது. தமிழில் முந்தைய ‘நாட்களை நீட்டித்தல்’ கருத்துடன் இணைத்து ‘நீண்ட காலம்’ என வழங்குவது இயல்பானது; சொற்படியான மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூல உரை ஒரு பட்டத்தை அல்ல, இஸ்ரவேலுக்கு வெளிப்படுத்தப்பட்ட தனிப்பெயரை நேரடியாகப் பயன்படுத்துகிறது. ஆகவே பெயரின் தன்மையைத் தக்கவைக்க ‘யாவே’ என ஒலிபெயர்க்கப்படுகிறது.
- issue: கீழ்ப்படிதலும் நல்வாழ்வு மற்றும் நீண்ட ஆயுளும் இடையிலான தொடர்பு
  choice: நோக்கத்தையும் விளைவையும் குறிக்கும் வகையில் வாக்கிய அமைப்பைத் தக்கவைத்தல்
  alternative: தனிநபருக்கான நிபந்தனையற்ற செழிப்பு வாக்குறுதியாக விரிவுபடுத்துதல்
  rationale: אֲשֶׁר மற்றும் לְמַעַן கூறுகள் கீழ்ப்படிதல், தலைமுறை நலம், நிலத்தில் நீண்ட வாழ்வு ஆகியவற்றை இணைக்கின்றன. ஆனால் உரை கூறாத அளவுக்கு தனிநபர் செழிப்பு கோட்பாடாக இதைத் தீர்மானிக்கக் கூடாது.
translation_notes:
  register: நவீனத் தரத் தமிழில் ஒருமை ‘நீ’ வடிவம் மூலம் மூலத்தின் ஒருமை அழைப்பு தக்கவைக்கப்பட்டுள்ளது. சட்ட மற்றும் உடன்படிக்கைச் செம்மையைப் பேணியபடியே, பொதுவாசகருக்குப் புரியும் இயல்பான வாக்கிய ஓட்டம் பயன்படுத்தப்பட்டுள்ளது. மூலத்தில் இல்லாத அடிக்குறிப்புகளை அதிகரிக்காமல், ‘எல்லா நாட்களும்’ என்ற இறுதிச் சொற்றொடரின் மொழிபெயர்ப்பு வேறுபாடு மட்டும் குறிக்கப்பட்டுள்ளது.
