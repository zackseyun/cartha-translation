  source_fidelity: மூலத்தின் முக்கிய கூறுகள்—தலைமுறைச் சந்ததி, நாட்டில் நீண்டகாலம் குடியிருத்தல், சீர்கேடான நடத்தை, எந்த வடிவிலுமான செதுக்கப்பட்ட உருவம், யாவேயின் பார்வையில் தீமை, அவரைக் கோபப்படுத்துதல்—பெரும்பாலும் சரியாக உள்ளன. ஆனால் לְהַכְעִיסוֹ என்பதற்கான ‘அவரைக் கோபமூட்டும்போது’ மீண்டும் ஒரு காலத் துணைவாக்கியத்தை உருவாக்குகிறது; இங்கு தீய செயல்களின் விளைவு/நோக்கைக் காட்டும் ‘அவரைக் கோபப்படுத்தி’ பொருத்தமானது.
  naturalness: ‘எதன் வடிவிலாவது ஒரு செதுக்கப்பட்ட உருவத்தைச் செய்து’ என்பது புரிந்துகொள்ளக்கூடியது; ஆயினும் ‘எதன் சாயலிலாவது செதுக்கப்பட்ட ஒரு உருவத்தை உருவாக்கி’ நவீனத் தமிழில் இயல்பாகவும் சொல்லமைப்பில் தெளிவாகவும் உள்ளது. ‘சீர்கேடாக நடந்து’ செயல்வகையைத் தெளிவாக வெளிப்படுத்துகிறது.
