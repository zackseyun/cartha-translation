  text: כִּֽי תוֹלִ֤יד בָּנִים֙ וּ/בְנֵ֣י בָנִ֔ים וְ/נוֹשַׁנְתֶּ֖ם בָּ/אָ֑רֶץ וְ/הִשְׁחַתֶּ֗ם וַ/עֲשִׂ֤יתֶם פֶּ֨סֶל֙ תְּמ֣וּנַת כֹּ֔ל וַ/עֲשִׂיתֶ֥ם הָ/רַ֛ע בְּ/עֵינֵ֥י יְהוָֽה אֱלֹהֶ֖י/ךָ לְ/הַכְעִיסֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/025.yaml
  text: When you father children and grandchildren[a], and you have grown old in the land, and you act corruptly and make a carved image in the form of anything, and do what is evil in the eyes of Yahweh your God[c][b], provoking him to anger—
translation:
  language: ta
  text: நீ பிள்ளைகளையும் பேரப்பிள்ளைகளையும்[a] பெற்ற பிறகு, நீங்கள் அந்த நாட்டில் நெடுங்காலம் குடியிருந்து[b], சீர்கேடாக நடந்து, எதன் சாயலிலாவது[c] செதுக்கப்பட்ட ஒரு உருவத்தை உருவாக்கி, உன் கடவுளாகிய யாவேயின் பார்வையில் தீமையானதைச் செய்து, அவரைக் கோபப்படுத்தி—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘மகன்களையும் மகன்களின் மகன்களையும்.’ எபிரெயத்தில் ஆண்பால் சந்ததிச் சொற்கள் உள்ளன; இங்கு அவை தலைமுறைகளாக வரும் சந்ததியினரைப் பொதுவாகக் குறிப்பதாகத் தெரிகிறது.
    reason: lexical_alternative
  - marker: b
    text: எபிரெய வினைச்சொல் ‘அந்த நாட்டில் முதுமையடைந்து’ அல்லது ‘அந்த நாட்டில் நீண்டகாலமாக நிலைபெற்று’ என்றும் பொருள்படலாம்.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, ‘எதன் வடிவிலாவது’ அல்லது ‘எந்த உருவத்தையாவது.’
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: பெற்ற பிறகு … கோபமூட்டும்போது
  rationale: இங்கு כִּי காரணத்தைக் காட்டுவதற்குப் பதிலாக, அடுத்த வசனத்தில் வரும் விளைவுக்கு முன்னோடியான எதிர்கால காலச் சூழலை அறிமுகப்படுத்துகிறது.
- source_word: תוֹלִיד
  choice: பெற்ற
  rationale: ஹிபில் வடிவின் பிள்ளைகளைப் பெறச்செய்தல்/பெறுதல் என்ற பொருளை, நவீன தமிழில் இயல்பாகத் தெரிவிக்கிறது.
- source_word: בָּנִים וּבְנֵי בָנִים
  choice: பிள்ளைகளையும் பேரப்பிள்ளைகளையும்
  rationale: ஆண்பால் சொற்கள் பயன்படுத்தப்பட்டாலும், இச்சூழலில் தலைமுறைகளாக வரும் சந்ததியினரைப் பொதுவாகக் குறிக்கின்றன.
- source_word: וְנוֹשַׁנְתֶּם בָּאָרֶץ
  choice: அந்நாட்டில் நெடுங்காலம் குடியிருந்து
  rationale: அந்நாட்டில் காலப்போக்கில் பழமையாகுதல் அல்லது நீண்டகாலம் நிலைபெற்றிருத்தல் என்ற கூட்டுப் பொருளை இயல்பான தமிழில் வழங்குகிறது.
- source_word: וְהִשְׁחַתֶּם
  choice: சீர்கெட்டு
  rationale: உடல் அழிவை அல்ல, விக்கிரக வழிபாட்டின் மூலம் ஏற்படும் உடன்படிக்கை சார்ந்த ஒழுக்கச் சீர்கேட்டை இங்கு குறிக்கிறது.
- source_word: פֶּסֶל
  choice: ஒரு செதுக்கப்பட்ட உருவம்
  rationale: ‘விக்கிரகம்’ என்ற விளக்கச் சொல்லைவிட, செதுக்கி உருவாக்கப்பட்ட பொருள் என்ற எபிரெயச் சொல்லின் திடமான படிமத்தைப் பாதுகாக்கிறது.
- source_word: תְּמוּנַת כֹּל
  choice: எதன் வடிவிலாவது
  rationale: எந்த வகையான உருவத்தையும் பிரதிநிதித்துவப்படுத்தும் முழுமையான பரப்பைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: הָרַע בְּעֵינֵי
  choice: பார்வையில் தீமையானதை
  rationale: எபிரெய மொழியின் மதிப்பீட்டு மரபுத்தொடரான ‘கண்களில் தீமையானது’ என்பதை தமிழில் தெளிவாகவும் அதன் பார்வை உருவகத்தைத் தக்கவைத்தும் தருகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைப்பட்டத்தால் மாற்றாமல், எபிரெய நான்கெழுத்துத் திருப்பெயரைத் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: לְהַכְעִיסוֹ
  choice: அவரைக் கோபமூட்டும்போது
  rationale: முந்திய தீய செயல்கள் அவரைச் சினமடையச் செய்கின்றன என்ற காரணவினைத் தன்மையைப் பாதுகாக்கிறது; வாக்கியம் அடுத்த வசனத்தில் தொடர்வதால் காலத் துணைவாக்கியமாக அமைக்கப்பட்டுள்ளது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலத்தில் பட்டம் அல்ல, உடன்படிக்கையின் தனிப்பெயரான நான்கெழுத்துத் திருப்பெயரே நேரடியாக உள்ளது; ஆகவே அது ஒலிபெயர்க்கப்படுகிறது.
- issue: בָּנִים וּבְנֵי בָנִים என்பதிலுள்ள ஆண்பால் சந்ததிச் சொற்கள்
  choice: பிள்ளைகளையும் பேரப்பிள்ளைகளையும்
  alternative: மகன்களையும் மகன்களின் மகன்களையும்
  rationale: உடன்படிக்கை எச்சரிக்கையின் இச்சூழலில், இந்த ஆண்பால் சொற்றொடர் பல தலைமுறைச் சந்ததியினரைப் பிரதிநிதித்துவ முறையில் குறிக்கிறது; குறிப்பாக ஆண்களை மட்டுமே குறிக்கவில்லை.
- issue: ஒருமையிலிருந்து பன்மைக்கு மாறும் அழைப்பு
  choice: ‘நீ’ என்பதையும் பின்னர் ‘நீங்கள்’ என்பதையும் தக்கவைத்தல்
  alternative: வசனம் முழுவதும் ‘நீங்கள்’ என்று ஒருமைப்படுத்தல்
  rationale: תוֹלִיד மற்றும் אֱלֹהֶיךָ ஆகியவை ஒருமையிலும், நடுவிலுள்ள வினைகள் பன்மையிலும் உள்ளன. இஸ்ரவேலை ஒரே உடன்படிக்கை மக்களாகவும் பல நபர்களாகவும் அணுகும் மூலத்தின் மாறுதலைச் சீராக்காமல் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பாகவும் மரியாதைமிக்க நடையிலும் அமைக்கப்பட்டுள்ளது. வசனம் 26-ஆம் வசனத்தில் நிறைவுபெறும் நீண்ட நிபந்தனை/கால வாக்கியத்தின் தொடக்கம் என்பதால் இறுதியில் நீள்கோடு வைக்கப்பட்டுள்ளது. மூல எபிரெயத்தில் உள்ள ஒருமை–பன்மை மாற்றம் திட்டமிட்டு தக்கவைக்கப்பட்டுள்ளது.
