source:
  edition: WLC
  text: לֹ֣א תֹסִ֗פוּ עַל הַ/דָּבָר֙ אֲשֶׁ֤ר אָנֹכִי֙ מְצַוֶּ֣ה אֶתְ/כֶ֔ם וְ/לֹ֥א תִגְרְע֖וּ מִמֶּ֑/נּוּ לִ/שְׁמֹ֗ר אֶת מִצְוֺת֙ יְהוָ֣ה אֱלֹֽהֵי/כֶ֔ם אֲשֶׁ֥ר אָנֹכִ֖י מְצַוֶּ֥ה אֶתְ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/002.yaml
  text: You shall not add to the word that I am commanding you[a], nor shall you take away from it, so that you may keep the commandments of Yahweh your God that I am commanding you.
translation:
  language: ta
  text: நான் உங்களுக்குக் கட்டளையிடுகிற வார்த்தையோடு எதையும் சேர்க்காதீர்கள்; அதிலிருந்து எதையும் நீக்காதீர்கள். நான் உங்களுக்குக் கட்டளையிடுகிற உங்கள் கடவுளாகிய யாவேயின்[a] கட்டளைகளை நீங்கள் கடைப்பிடிக்கும்படி இவ்வாறு செய்யுங்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் YHWH (יהוה); இது பாரம்பரியமாக ‘கர்த்தர்’ என்று வழங்கப்படுகிறது. இங்கு ‘யாவே’ என்று எழுத்துப்பெயர்க்கப்பட்டுள்ளது.
    reason: இறைப்பெயரின் மூலவடிவத்தையும் பாரம்பரிய மாற்றுவழக்கையும் தெரிவிக்கிறது.
lexical_decisions:
- source_word: תֹסִפוּ עַל
  choice: வார்த்தையோடு எதையும் சேர்க்காதீர்கள்
  rationale: יסף என்பதன் ஹிஃபில் வடிவம் עַל உடன் இங்கு ஒன்றோடு வேறொன்றைச் சேர்ப்பதைக் குறிக்கிறது. ‘சேர்க்காதீர்கள்’ என்பது இயல்பான நவீனத் தமிழில் தடையைத் தெளிவாகக் கூறுகிறது.
- source_word: הַדָּבָר
  choice: வார்த்தை
  rationale: דבר என்பதற்கு ‘வார்த்தை’, ‘காரியம்’, ‘விஷயம்’ ஆகிய பொருள்கள் உண்டு. இங்கு மோசே அறிவிக்கும் கட்டளையின் முழு உள்ளடக்கத்தை ஒருமையாகக் குறிப்பதால் ‘வார்த்தை’ என்று மொழிபெயர்க்கப்பட்டது.
- source_word: מְצַוֶּה
  choice: கட்டளையிடுகிற
  rationale: எபிரெயப் பங்கேற்புவினை, பேசிக்கொண்டிருக்கும் இச்சூழலில் நிகழ்காலச் செயலைக் காட்டுகிறது. ‘கட்டளையிடுகிற’ என்பது இதை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: תִגְרְעוּ מִמֶּנּוּ
  choice: அதிலிருந்து எதையும் நீக்காதீர்கள்
  rationale: גרע என்பது குறைத்தல் அல்லது எடுத்துவிடுதல் என்று பொருள்படும். ‘நீக்காதீர்கள்’ என்பது ‘சேர்க்காதீர்கள்’ என்பதற்கு இயல்பான எதிரிணையாக உள்ளது.
- source_word: לִשְׁמֹר
  choice: கடைப்பிடிப்பதற்காகவே
  rationale: ל உடனான வினையெச்சம் இங்கு நோக்கத்தைக் காட்டுகிறது. ‘கடைப்பிடிப்பதற்காகவே’ என்பது சேர்க்காமலும் நீக்காமலும் இருப்பதன் நோக்கத்தைத் தெளிவுபடுத்துகிறது.
- source_word: מִצְוֺת
  choice: கட்டளைகள்
  rationale: உடன்படிக்கை மற்றும் சட்டச் சூழலில் מצות என்பதற்கு ‘கட்டளைகள்’ என்பது தெளிவான, மதிப்புறு தமிழாக்கம்.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய வேதப்பிரதியில் உள்ள நான்கெழுத்துத் திருப்பெயரை ஒரு பட்டத்தால் மாற்றாமல், அதன் தனிப்பெயர்த் தன்மையைப் பாதுகாக்கும் பரவலான தமிழெழுத்துப் பெயர்ப்பாக ‘யாவே’ பயன்படுத்தப்பட்டது.
- source_word: אֱלֹהֵיכֶם
  choice: உங்கள் கடவுள்
  rationale: யாவே என்ற பெயருடன் வரும் உடன்படிக்கைச் சொற்றொடரில் אֱלֹהִים ஒருமைப் பொருளுடையது; எனவே ‘உங்கள் கடவுள்’ என்று மொழிபெயர்க்கப்பட்டது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழியாக்கம்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலப்பிரதி இங்கு יְהוָה என்ற தனிப்பெயரையே பயன்படுத்துகிறது. ‘யாவே’ என்பது அந்த உடன்படிக்கைப் பெயரைப் பட்டமாக மாற்றாமல் பாதுகாக்கிறது; உச்சரிப்பின் வரலாற்றுச் சிக்கல் அடிக்குறிப்பில் குறிப்பிடப்படுகிறது.
- issue: ‘சேர்க்காதீர்கள் / நீக்காதீர்கள்’ என்ற தடையின் இலக்கு
  choice: மோசே இப்போது கட்டளையிடும் ‘வார்த்தை’ முழுமை
  alternative: ஒவ்வொரு தனிக் கட்டளையும் மட்டும்
  rationale: הַדָּבָר ஒருமையில் இருந்து போதனையின் உள்ளடக்கத்தை ஒருங்கிணைந்த முழுமையாகக் காட்டுகிறது. இதை எந்தப் பிற்காலக் கோட்பாட்டு எல்லைக்கும் குறிப்பாகச் சுருக்காமல் மொழிபெயர்ப்பு திறந்தவாறே வைக்கிறது.
translation_notes:
  register: நவீனத் தரத்தமிழில், பொதுவாசகர்களுக்குப் புரியும் மரியாதைமிக்க நடையில் வடிவமைக்கப்பட்டது. எபிரெய ஒருமையான ‘வார்த்தை’ பாதுகாக்கப்பட்டது. இறுதி நோக்கத் தொடர்பைத் தமிழில் தெளிவாக்க ‘இப்படிச் செய்யுங்கள்’ சேர்க்கப்பட்டுள்ளது; இது புதிய கட்டளையைச் சேர்ப்பதல்ல, முன்னிருக்கும் இரு தடைகளின் நோக்கத்தை இயல்பாக இணைக்கிறது.
