  terminology: ‘சட்டம்’ is an appropriate modern-standard Tamil rendering here. ‘மோசே’ is standard. ‘இஸ்ரவேலின் மகன்கள்’ retains the Hebrew masculine construct form; the note appropriately supplies idiomatic corporate alternatives.
