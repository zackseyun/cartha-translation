  text: וְ/זֹ֖את הַ/תּוֹרָ֑ה אֲשֶׁר שָׂ֣ם מֹשֶׁ֔ה לִ/פְנֵ֖י בְּנֵ֥י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/044.yaml
  text: And this is the law that Moses set before the sons of Israel:[a]
translation:
  language: ta
  text: மேலும், இது மோசே இஸ்ரவேலின் மகன்களுக்கு முன்பாக வைத்த சட்டம்:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘இஸ்ரவேலர்,’ ‘இஸ்ரவேல் மக்கள்’; மரபுவழியாக, ‘இஸ்ரவேலின் பிள்ளைகள்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזֹאת
  choice: இதுவே
  rationale: இந்தக் கூற்று அடுத்த பகுதியை அறிமுகப்படுத்துகிறது. தமிழில் இயல்பான தலைப்பு நடையைப் பேணுவதற்காக இணைப்பிடைச்சொல் தனியே மொழிபெயர்க்கப்படாமல், ‘இதுவே’ என்பதில் அறிமுகப்படுத்தும் வலியுறுத்தல் வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: הַתּוֹרָה
  choice: சட்டம்
  rationale: תּוֹרָה என்பதற்கு ‘போதனை’ என்ற பரந்த பொருள் இருக்கலாம்; இங்கு மோசே மக்கள்முன் வைக்கும் உடன்படிக்கைச் சட்டத்தைக் குறிக்கும் தலைப்பாக வருவதால், நவீனத் தமிழில் தெளிவான ‘சட்டம்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: שָׂם ... לִפְנֵי
  choice: முன்பாக ... வைத்த
  rationale: ‘வைத்தல்’ என்ற வினையின் அடிப்படைப் பொருளையும், மக்களிடம் அதிகாரபூர்வமாக முன்வைத்தல் என்ற சூழற்பொருளையும் இந்தச் சொற்றொடர் பேணுகிறது.
- source_word: מֹשֶׁה
  choice: மோசே
  rationale: தமிழ் வேதாகம வழக்கில் நிலைபெற்ற பெயர்வடிவம்.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் மகன்கள்
  rationale: எபிரெயச் சொற்றொடரின் ஆண்பால் வடிவத்தைத் துல்லியமாகப் பேணுகிறது; இது சூழலில் இஸ்ரவேல் மக்களை ஒட்டுமொத்தமாகக் குறிக்கும் தேசிய அடையாளச் சொற்றொடர்.
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל என்ற பாலினம் குறிக்கப்பட்ட தேசியப் பெயர்
  choice: இஸ்ரவேலின் மகன்கள்
  alternative: இஸ்ரவேலர்; இஸ்ரவேல் மக்கள்; இஸ்ரவேலின் பிள்ளைகள்
  rationale: இது உடன்படிக்கை மக்களைக் குறிக்கும் வழக்கமான தேசியப் பெயர் என்றாலும், மூலமொழியில் உள்ள ஆண்பால் வடிவத்தை மறைக்காமல் ‘மகன்கள்’ என்று மொழிபெயர்க்கப்பட்டுள்ளது. இயல்பான கூட்டுப்பெயர் மாற்றுகள் அடிக்குறிப்பில் தரப்படுகின்றன.
translation_notes:
  register: நவீனத் தரத் தமிழில் சுருக்கமான, கண்ணியமான தலைப்பு நடை பயன்படுத்தப்பட்டுள்ளது. ‘நியாயப்பிரமாணம்’ போன்ற பழைய அல்லது சமயக்குழுச் சார்புடைய சொல்லுக்குப் பதிலாக பொதுவாகப் புரியும் ‘சட்டம்’ பயன்படுத்தப்பட்டுள்ளது.
