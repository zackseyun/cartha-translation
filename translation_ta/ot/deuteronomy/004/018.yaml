  text: the form of any creeping thing on the ground[b][a], the form of any fish that is in the waters under the earth.
translation:
  language: ta
  text: தரையில் ஊர்ந்து செல்லும் எந்த உயிரினத்தின் உருவத்தையும்[a], பூமிக்குக் கீழே உள்ள நீரில்[b] இருக்கும் எந்த மீனின் உருவத்தையும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '‘உருவம்’ என்பதற்கு ‘சாயல்’ அல்லது ‘பிம்பம்’ என்றும் மொழிபெயர்க்கலாம் (எபிரெயம்: תַּבְנִית).'
    reason: lexical_alternative
  - marker: b
    text: ‘பூமிக்குக் கீழே உள்ள நீர்’ என்பது நிலத்திற்குக் கீழுள்ள நீரைப் பற்றிய வேதாகமத்தில் நிலைபெற்ற சொல்லாட்சியை எதிரொலிக்கிறது; யாத்திராகமம் 20:4-இலுள்ள உருவத் தடையின் சொல்லாட்சியுடன் ஒப்பிடுக.
    reason: cross_reference
lexical_decisions:
- source_word: תַּבְנִית
  choice: உருவம்
  rationale: சூழலில் இது காணக்கூடிய வடிவத்தையோ அதைப் பிரதிபலிக்கும் உருவத்தையோ குறிக்கிறது. ‘உருவம்’ என்பது ஒரு குறிப்பிட்ட சிற்ப ஊடகத்திற்குள் பொருளைச் சுருக்காமல், எபிரெயச் சொல்லின் பரப்பை இயல்பான தமிழில் தருகிறது.
- source_word: כָּל
  choice: எந்த ... -த்தையும்
  rationale: தடைச்சூழலில் எதுவும் விதிவிலக்கல்ல என்ற பகிர்வுப் பொருளை நவீன தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: רֹמֵשׂ
  choice: ஊர்ந்து செல்லும் உயிரினம்
  rationale: தரையின் மேற்பரப்பில் நகரும் சிறு உயிரினங்களைக் குறிக்கும் வகைப்பாட்டைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: בָּאֲדָמָה
  choice: தரையில்
  rationale: இங்கு אֲדָמָה உயிரினங்கள் நகரும் நிலப்பரப்பைக் குறிக்கிறது; ‘தரையில்’ என்பது சூழலுக்கு மிகப் பொருத்தமான தமிழ்.
- source_word: דָּגָה
  choice: மீன்
  rationale: எபிரெயச் சொல் தொகுதிப்பொருளில் வந்தாலும், தமிழில் ‘எந்த மீனின்’ என்பது ஒவ்வொரு வகையையும் உள்ளடக்கும் வகையில் இயல்பாக உள்ளது.
- source_word: אֲשֶׁר בַּמַּיִם
  choice: நீரில் வாழும்
  rationale: சொல்லுக்குச் சொல் ‘நீரில் இருக்கும்’ என்பதைக் காட்டிலும் உயிரினத்தைப் பற்றிய தமிழில் ‘நீரில் வாழும்’ இயல்பாக உள்ளது; தொடர்புச் சொற்றொடரின் பொருள் பாதுகாக்கப்படுகிறது.
- source_word: מִתַּחַת לָאָרֶץ
  choice: பூமிக்குக் கீழே உள்ள
  rationale: நிலத்துக்குக் கீழுள்ள நீர் என்ற வேதாகமத்தில் நிலைபெற்ற சொல்லாட்சியையும் யாத்திராகமம் 20:4 உடனான ஒலிப்பையும் விளக்கவுரை சேர்க்காமல் காக்கிறது.
theological_decisions:
- issue: விக்கிரக ஆராதனைத் தடைச் சூழலில் பிரதிநிதித்துவ வடிவங்களுக்கான சொல்
  choice: உருவம்
  alternative: சாயல்; பிம்பம்; சிலை
  rationale: மூலச்சொல் படைக்கப்பட்ட உயிரின் காணக்கூடிய வடிவத்தையும் அதன் பிரதிநிதித்துவத்தையும் குறிக்க முடியும். ‘சிலை’ என்று மொழிபெயர்ப்பது குறிப்பிட்ட ஊடகத்திற்குள் பொருளைச் சுருக்கும்; ‘பிம்பம்’ தேவையற்ற சமயத் தொனியைச் சேர்க்கக்கூடும். தடையின் விக்கிரக எதிர்ப்பு வலிமையைச் சூழலே அளிக்கிறது.
- issue: முந்தைய வசனத்திலிருந்து தொடரும் இலக்கண அமைப்பு
  choice: செயப்பாட்டு வேற்றுமையான ‘-த்தையும்’ கொண்டு தொடர்ச்சியைப் பேணுதல்
  alternative: ‘உருவத்தைச் செய்யாதீர்கள்’ என்று வினையை இவ்வசனத்தில் மீண்டும் சேர்த்தல்
  rationale: எபிரெய மூலத்தில் இவ்வசனம் முந்தைய தடைவாக்கியத்தின் தொடர்ச்சியாக உள்ளது; இல்லாத வினையைச் சேர்க்காமல் தமிழ் தொடரமைப்பால் அதைப் பேணுகிறது.
translation_notes:
  register: நவீன தரத் தமிழில், எளிதில் புரியும் ஆனால் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. இது முந்தைய வசனத்தில் தொடங்கிய தடையின் பட்டியல் தொடர்ச்சி என்பதால், மூலத்தில் இல்லாத வினை சேர்க்கப்படவில்லை. ‘உயிரினம்’ என்பது ‘ஊர்ந்து செல்லும் பொருள்’ என்பதைக் காட்டிலும் உயிருள்ள படைப்புவகையைத் தெளிவாகக் காட்டுகிறது.
