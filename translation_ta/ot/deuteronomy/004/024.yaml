  text: כִּ֚י יְהוָ֣ה אֱלֹהֶ֔י/ךָ אֵ֥שׁ אֹכְלָ֖ה ה֑וּא אֵ֖ל קַנָּֽא׃פ
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/024.yaml
  text: For Yahweh your God is a consuming fire[a], a jealous God.
translation:
  language: ta
  text: ஏனெனில், உன் கடவுளாகிய யாவே எரித்தழிக்கும் நெருப்பு; அவரே பொறாமையுள்ள கடவுள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஆர்வமுள்ள கடவுள்.” சிலைவழிபாட்டைப் பற்றிய இச்சூழலில், எபிரெயச் சொல் யாவே தம் மக்கள்மேல் கொண்ட தனியுரிமையான உடன்படிக்கை உரிமையை வலியுறுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய எச்சரிக்கைக்கான காரணத்தை அறிமுகப்படுத்துவதால், எபிரெயச் சொல்லின் விளக்கக் காரணப் பொருளைப் பாதுகாக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைப் பெயரான நான்கெழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் இயல்பாக ஒலிபெயர்க்கிறது.
- source_word: אֱלֹהֶיךָ
  choice: உன் கடவுளாகிய
  rationale: இரண்டாம் நபர் ஆண்பால் ஒருமை பின்னொட்டைக் காத்து, இஸ்ரவேலை ஒருமையில் நேரடியாக அழைக்கும் உடன்படிக்கைச் சொல்லாடலை வெளிப்படுத்துகிறது.
- source_word: אֵשׁ אֹכְלָה
  choice: எரித்தழிக்கும் நெருப்பு
  rationale: நெருப்பு உண்டுவிடுவது அல்லது முழுமையாக அழிப்பது என்ற உயிரோட்டமான உருவகத்தை, பழமையான சொல்லாடல் இன்றி நவீன தமிழில் தருகிறது.
- source_word: הוּא
  choice: அவர்
  rationale: எபிரெயில் உள்ள வலியுறுத்தும் தனிப்பெயரைத் தமிழில் வெளிப்படையாகக் காத்து, இரண்டாம் பயனிலைக்கு இயல்பான தலைப்பை வழங்குகிறது.
- source_word: אֵל
  choice: கடவுள்
  rationale: இங்கு முந்தைய கூற்றுடன் இணையாக வரும் பொதுவான இறைப் பட்டத்துக்கு இயல்பான தமிழ் இணை.
- source_word: קַנָּא
  choice: பொறாமையுள்ள
  rationale: போட்டி வழிபாட்டை ஏற்காத யாவேயின் தனியுரிமை கொண்ட உடன்படிக்கை உரிமையை மென்மையாக்காமல் காக்கிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: இறைவனுடைய קַנָּא என்ற பண்பின் மொழிபெயர்ப்பு
  choice: பொறாமையுள்ள கடவுள்
  alternative: தீவிர பற்றுள்ள கடவுள்
  rationale: சிலைவழிபாட்டைப் பற்றிய சூழலில், இந்தச் சொல் யாவே தம் மக்கள்மேல் கொண்ட தனிப்பட்ட உடன்படிக்கை உரிமையையும் போட்டி வழிபாட்டை ஏற்காமையையும் குறிக்கிறது. ‘பொறாமையுள்ள’ என்பது அந்த உறவுசார் பதற்றத்தை மென்மையாக்காமல் பாதுகாக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில் சுருக்கமான, கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘பட்சிக்கும் அக்கினி’ போன்ற பழமையான வழக்குக்குப் பதிலாக ‘எரித்தழிக்கும் நெருப்பு’ தேர்ந்தெடுக்கப்பட்டது. எபிரெயின் ஒருமை அழைப்பு ‘உன்’ எனக் காக்கப்பட்டுள்ளது; இறைப் பெயர் ‘யாவே’ என ஒலிபெயர்க்கப்பட்டுள்ளது.
