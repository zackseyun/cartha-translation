  text: וַ/תִּקְרְב֥וּ/ן וַ/תַּֽעַמְד֖וּ/ן תַּ֣חַת הָ/הָ֑ר וְ/הָ/הָ֞ר בֹּעֵ֤ר בָּ/אֵשׁ֙ עַד לֵ֣ב הַ/שָּׁמַ֔יִם חֹ֖שֶׁךְ עָנָ֥ן וַ/עֲרָפֶֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/011.yaml
  text: And you came near and stood at the foot of the mountain[a], while the mountain was burning with fire up to the heart of the heavens—darkness, cloud[b], and thick gloom.
translation:
  language: ta
  text: நீங்கள் அருகில் வந்து மலையின் அடிவாரத்தில் நின்றீர்கள். அந்த மலை வானத்தின் இதயம் வரை[a] நெருப்பில் எரிந்துகொண்டிருந்தது; இருளும் மேகமும் காரிருளும் இருந்தன.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொற்படியாக, ‘வானங்களின் இதயம் வரை.’ இது வானத்தின் நடுப்பகுதியையோ உயரத்தையோ குறிக்கும் எபிரேய மரபுத்தொடர்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘அடர்ந்த இருள்’ அல்லது ‘ஆழ்ந்த இருள்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּקְרְבוּן
  choice: நீங்கள் அருகில் வந்து
  rationale: קרב என்பதன் Qal தொடர்வினை வடிவம் மலையை நோக்கி நெருங்கிவந்த இயக்கத்தைக் குறிக்கிறது; ‘அருகில் வந்து’ என்பது இயல்பான நவீனத் தமிழ்.
- source_word: וַתַּעַמְדוּן
  choice: நின்றீர்கள்
  rationale: עמד என்பதன் நேரடியான பொருளாகிய ‘நிற்றல்’ என்பதையும் நிகழ்வுகளின் தொடரையும் எளிமையாகப் பாதுகாக்கிறது.
- source_word: תַּחַת הָהָר
  choice: மலையின் அடிவாரத்தில்
  rationale: תחת என்பதற்கு சொற்படியாக ‘கீழே’ என்று பொருள் இருந்தாலும், மலையைச் சார்ந்த இந்நிலவியல் சூழலில் அதன் அடிப்பகுதி அல்லது அடிவாரத்தைக் குறிக்கிறது.
- source_word: בֹּעֵר בָּאֵשׁ
  choice: நெருப்பால் எரிந்துகொண்டிருந்தது
  rationale: பங்கேற்புவினையான בֹּעֵר தொடர்ந்துகொண்டிருந்த நிலையைக் காட்டுகிறது; நெருப்பை வெளிப்படையாகக் குறிப்பிடும் எபிரேயச் சொற்றொடரும் பாதுகாக்கப்படுகிறது.
- source_word: עַד לֵב הַשָּׁמַיִם
  choice: வானத்தின் நடுப்பகுதி வரை
  rationale: לֵב என்பதன் சொற்பொருள் ‘இதயம்’; இங்கு அது வானத்தின் நடுப்பகுதி அல்லது உயரத்தைச் சுட்டும் மரபுத்தொடர். இயல்பான தமிழுக்காக பொருள் முதன்மை உரையில் தரப்பட்டு, மூல உருவகம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: חֹשֶׁךְ
  choice: இருள்
  rationale: இறைத்தோற்றத்தின் சூழலை விவரிக்கும் இச்சொல்லின் வழக்கமான, நேரடியான தமிழ் இணை.
- source_word: עָנָן
  choice: மேகம்
  rationale: தனிப்பட்ட வடிவிலுள்ள எபிரேயச் சொல்லின் இயல்பான தமிழ் இணை; இங்கு தொகுதிப்பொருளிலும் புரிந்துகொள்ளலாம்.
- source_word: וַעֲרָפֶל
  choice: காரிருள்
  rationale: עֲרָפֶל குறிக்கும் அடர்ந்த, பார்வையை மறைக்கும் இருளை ‘காரிருள்’ சுருக்கமாகவும் கண்ணியமான நடையிலும் தெரிவிக்கிறது; முந்தைய חֹשֶׁךְ என்பதிலிருந்து அதன் தீவிரத்தையும் வேறுபடுத்துகிறது.
theological_decisions:
- issue: சீனாய் மலையில் நிகழும் இறைவெளிப்பாட்டின் உருவகம்
  choice: நெருப்பு, இருள், மேகம், காரிருள் ஆகிய தெளிவானதும் அச்சமூட்டும் தன்மையுடையதுமான உருவகங்களைப் பாதுகாத்தல்
  alternative: இவற்றை பொதுவான வானிலைச் சூழலாக மென்மைப்படுத்திக் கூறுதல்
  rationale: மூலவசனம் வெறும் வானிலையை அல்லாமல், இறைவெளிப்பாட்டுடன் தொடர்புடைய அடுக்கான காட்சியை வரைகிறது. மொழிபெயர்ப்பு விளக்கத்தைச் சேர்க்காமல் அந்தத் தீவிரத்தையும் மறைபொருள் நிறைந்த சூழலையும் வைத்திருக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. எபிரேயத்தின் தொடர்ச்சியான காட்சியை இயல்பாக வெளிப்படுத்த இரண்டாவது வாக்கியத்தில் அரைப்புள்ளி பயன்படுத்தப்பட்டுள்ளது; இறுதி பெயர்ச்சொல் வரிசையின் சூழலைத் தமிழில் தெளிவாக்க ‘சூழ்ந்திருந்தன’ சேர்க்கப்பட்டுள்ளது.
