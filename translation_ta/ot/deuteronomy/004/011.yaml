revisions:
- from: நீங்கள் அருகில் வந்து மலையின் அடிவாரத்தில் நின்றீர்கள். அந்த மலை வானத்தின் நடுப்பகுதி வரை[a] நெருப்பால் எரிந்துகொண்டிருந்தது; இருளும் மேகமும் காரிருளும்[b] சூழ்ந்திருந்தன.
  to: நீங்கள் அருகில் வந்து மலையின் அடிவாரத்தில் நின்றீர்கள். அந்த மலை வானத்தின் இதயம் வரை[a] நெருப்பில் எரிந்துகொண்டிருந்தது; இருளும் மேகமும் காரிருளும் இருந்தன.[b]
  rationale: மூலத்தின் காட்சித்தன்மை, நிகழ்வுகளின் தொடர், மற்றும் இருள்–மேகம்–அடர்ந்த இருள் என்ற மூவகை வரிசை பாதுகாக்கப்பட்டுள்ளன. மூலத்தில் வெளிப்படையாக இல்லாத ‘சூழ்ந்திருந்தன’ என்ற செயல் நீக்கப்பட்டுள்ளது. ‘வானத்தின் இதயம்’ என்ற உருவகம் உரையில் காக்கப்பட்டு, அதன் இடவியல் பொருள் வாய்ப்புகள் அடிக்குறிப்பில் தரப்பட்டுள்ளன.
