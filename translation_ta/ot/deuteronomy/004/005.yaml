base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/005.yaml
  text: See[a], I have taught you statutes and judgments, just as Yahweh my God commanded me[c][b], so that you may do so in the midst of the land that you are entering there to possess it.
translation:
  language: ta
  text: “இதோ, நீங்கள் உரிமையாக்கிக்கொள்ள அங்கே நுழையவிருக்கும் அந்த நாட்டின் நடுவே[b] அவற்றின்படி நடக்கும்படி, என் கடவுளாகிய யாவே எனக்குக் கட்டளையிட்டபடியே சட்டங்களையும் நீதித்தீர்ப்புகளையும்[a] நான் உங்களுக்குக் கற்றுக்கொடுத்துள்ளேன்.[c]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘சட்டங்களையும் நீதித்தீர்ப்புகளையும்’ என்பதற்கு, ‘நியமங்களையும் நீதிமுறைகளையும்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில், ‘நாட்டின் நடுவே’; இதை இயல்பாக ‘நாட்டில்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: ‘நீங்கள் உரிமையாக்கிக்கொள்ள அங்கே நுழையவிருக்கும்’ என்பதற்கு, ‘நீங்கள் சுதந்தரித்துக்கொள்ள அங்கே செல்லவிருக்கும்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: רְאֵה
  choice: பாருங்கள்
  rationale: இது கவனத்தை ஈர்க்கும் ஒருமை கட்டளை வடிவம். இஸ்ரவேல் மக்களை ஒரு கூட்டாக நோக்கிச் சொல்லப்பட்டாலும், நவீனத் தமிழில் மக்களிடம் பேசும் இயல்பான மரியாதைப் பன்மை வடிவமாக ‘பாருங்கள்’ அமைந்து அதன் நேரடி அழைப்பைத் தக்கவைக்கிறது.
- source_word: לִמַּדְתִּי
  choice: நான் ... கற்றுக்கொடுத்தேன்
  rationale: மோசே ஏற்கெனவே அளித்த போதனையை, இப்போது நடைமுறைப்படுத்த வேண்டிய ஒன்றாகக் குறிப்பிடும் நிறைவேற்றப்பட்ட செயலை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: חֻקִּים
  choice: சட்டங்கள்
  rationale: அதிகாரபூர்வமாக விதிக்கப்பட்ட ஒழுங்குகளைக் குறிக்கும் எபிரெயச் சட்டச் சொல்லின் பொருளையும் சட்டப் பதிவையும் காக்கிறது.
- source_word: מִשְׁפָּטִים
  choice: நீதித்தீர்ப்புகள்
  rationale: நீதி, தீர்ப்பு, சட்ட ஒழுங்கு ஆகிய தொடர்புகளைத் தக்கவைத்து, பொதுவான ‘விதிகள்’ என்பதைக் காட்டிலும் மூலச்சொல்லின் நீதித்துறை நுணுக்கத்தைப் பாதுகாக்கிறது.
- source_word: כַּאֲשֶׁר
  choice: கட்டளையிட்டபடியே
  rationale: மோசேயின் போதனை யாவேயின் கட்டளைக்கு முற்றிலும் ஏற்ப அமைந்தது என்ற ஒப்புமையைத் தெளிவாகக் காட்டுகிறது.
- source_word: יְהוָה אֱלֹהָי
  choice: என் கடவுளாகிய யாவே
  rationale: தெய்வீகப் பெயரான יהוה-ஐ ‘யாவே’ என்று ஒலிபெயர்த்து, אֱלֹהָי என்பதன் ‘என் கடவுள்’ என்ற தனிப்பட்ட உறவையும் தக்கவைக்கிறது.
- source_word: לַעֲשׂוֹת כֵּן
  choice: அவற்றின்படி நடக்கவே
  rationale: இறைவன் கொடுத்த சட்டங்களையும் நீதித்தீர்ப்புகளையும் நாட்டில் செயல்படுத்த வேண்டும் என்ற நோக்கத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது; כֵּן என்பதன் முன்னைய கட்டளைகளைச் சுட்டும் வலிமையும் காக்கப்படுகிறது.
- source_word: בְּקֶרֶב הָאָרֶץ
  choice: அந்த நாட்டின் நடுவே
  rationale: ‘நாட்டில்’ என்று எளிமைப்படுத்தாமல், בְּקֶרֶב என்பதன் ‘நடுவில்/உள்ளே’ என்ற இடவியல் உருவகத்தைப் பாதுகாக்கிறது.
- source_word: בָּאִים שָׁמָּה
  choice: அங்கே நுழைகிற
  rationale: இஸ்ரவேலர் விரைவில் அந்த இடத்திற்குள் செல்வதை நிகழ்காலப் பங்கேற்பு வடிவமும் திசைச் சொல்லும் சேர்ந்து காட்டுவதைச் சுருக்கமான, இயல்பான தமிழில் தருகிறது.
- source_word: לְרִשְׁתָּהּ
  choice: உரிமையாக்கிக்கொள்ள
  rationale: ירשׁ என்பதற்கு நில வாக்குறுதியின் சூழலில் உடைமையாக்குதல் அல்லது சுதந்தரித்தல் ஆகிய பொருள் நிழல்கள் உள்ளன. ‘உரிமையாக்கிக்கொள்ள’ என்பது நிலத்தைக் கைப்பற்றி தமக்குரியதாகக் கொள்வதைத் தெரிவிக்கிறது; சுதந்தரித்தல் என்ற மாற்றுப் பொருள் அடிக்குறிப்பில் காக்கப்படுகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூல வசனம் உடன்படிக்கைப் பெயரான יהוה-ஐ நேரடியாகப் பயன்படுத்துகிறது. அதை பொதுப்பட்டமாக மாற்றாமல் ‘யாவே’ என்று ஒலிபெயர்ப்பது பெயரின் தனித்தன்மையைப் பாதுகாக்கிறது.
- issue: לַעֲשׂוֹת כֵּן என்பதன் செய்பவர் மற்றும் நோக்கம்
  choice: இஸ்ரவேலர் அவற்றின்படி நடப்பதற்காக மோசே கற்றுக்கொடுத்தார்
  alternative: மோசே கட்டளையிடப்பட்டபடி செய்தார்
  rationale: தொடரமைப்பில் நோக்க infinitive, மக்களுக்கு அளிக்கப்பட்ட போதனையின் நடைமுறை நோக்கத்தைச் சுட்டுவது இயல்பானது. இருப்பினும் எபிரெய வடிவம் சுருக்கமாக இருப்பதால் அதன் தொடர்பில் ஓரளவு இலக்கண நெகிழ்வு உள்ளது; மொழிபெயர்ப்பு சூழலுக்கு ஏற்ற முதன்மை வாசிப்பை வழங்குகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுமக்களுக்கு எளிதில் புரியும் அதேவேளையில் சட்ட மற்றும் உடன்படிக்கைச் சூழலுக்கேற்ற கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. நீண்ட எபிரெய வாக்கியம் தமிழில் தெளிவுக்காக இரண்டு வாக்கியங்களாகப் பிரிக்கப்பட்டது; இரண்டாவது வாக்கியத்தில் ‘இவற்றைக் கற்றுக்கொடுத்தேன்’ என்பது வெளிப்படையாக மீண்டும் சேர்க்கப்பட்டாலும் புதிய கருத்தைச் சேர்ப்பதில்லை. ‘அந்த நாட்டின் நடுவே’ என்ற மூல உருவகமும், ‘அங்கே’ என்ற திசைக் குறிப்பும் பாதுகாக்கப்பட்டுள்ளன.
