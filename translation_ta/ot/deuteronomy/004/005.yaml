- from: “பாருங்கள்! என் கடவுளாகிய யாவே எனக்குக் கட்டளையிட்டபடியே, நான் உங்களுக்குச் சட்டங்களையும் நீதித்தீர்ப்புகளையும்[a] கற்றுக்கொடுத்தேன். நீங்கள் உரிமையாக்கிக்கொள்ள அங்கே நுழைகிற அந்த நாட்டின் நடுவே[b] அவற்றின்படி நடக்கவே இவற்றைக் கற்றுக்கொடுத்தேன்.[c]”
  to: “இதோ, நீங்கள் உரிமையாக்கிக்கொள்ள அங்கே நுழையவிருக்கும் அந்த நாட்டின் நடுவே[b] அவற்றின்படி நடக்கும்படி, என் கடவுளாகிய யாவே எனக்குக் கட்டளையிட்டபடியே சட்டங்களையும் நீதித்தீர்ப்புகளையும்[a] நான் உங்களுக்குக் கற்றுக்கொடுத்துள்ளேன்.[c]”
  rationale: மூலத்தில் ஒருமுறையே வரும் ‘கற்பித்தேன்’ என்ற வினையை ஒருமுறையாகவே வைத்துள்ளேன். לַעֲשׂוֹת כֵּן-இன் நோக்கத்தை ‘அவற்றின்படி நடக்கும்படி’ எனவும், בְּקֶרֶב, שָׁמָּה, மற்றும் לְרִשְׁתָּהּ ஆகிய இடம், திசை, உடைமையாக்குதல் கூறுகளை முறையே ‘நாட்டின் நடுவே,’ ‘அங்கே,’ ‘உரிமையாக்கிக்கொள்ள’ எனவும் காத்துள்ளேன். அடிக்குறிப்பு குறியீடுகள் அவை விளக்கும் சொற்களிலேயே வைக்கப்பட்டுள்ளன.
