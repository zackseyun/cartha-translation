  text: מִן הַ/שָּׁמַ֛יִם הִשְׁמִֽיעֲ/ךָ֥ אֶת קֹל֖/וֹ לְ/יַסְּרֶ֑/ךָּ וְ/עַל הָ/אָ֗רֶץ הֶרְאֲ/ךָ֙ אֶת אִשּׁ֣/וֹ הַ/גְּדוֹלָ֔ה וּ/דְבָרָ֥י/ו שָׁמַ֖עְתָּ מִ/תּ֥וֹךְ הָ/אֵֽשׁ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/036.yaml
  text: From heaven he made you hear his voice to discipline you[a], and on earth he showed you his great fire[b], and you heard his words from the midst of the fire.
translation:
  language: ta
  text: உன்னை ஒழுக்கப்படுத்துவதற்காக,[a] வானத்திலிருந்து தமது குரலை உனக்குக் கேட்கச் செய்தார்; பூமியில் தமது பெரும் நெருப்பை உனக்குக் காட்டினார்; நெருப்பின் நடுவிலிருந்து[b] தமது வார்த்தைகளை நீ கேட்டாய்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘உனக்குப் பயிற்றுவிப்பதற்காக’ அல்லது ‘உன்னைக் கண்டித்துத் திருத்துவதற்காக.’ எபிரெய வினைச்சொல் திருத்தும் ஒழுக்கத்தையும் உருவாக்கும் பயிற்றுவிப்பையும் உள்ளடக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘நெருப்புக்குள்ளிருந்து.’
    reason: lexical_alternative
lexical_decisions:
- source_word: מִן הַשָּׁמַיִם
  choice: வானத்திலிருந்து
  rationale: அடுத்த கூறிலுள்ள ‘பூமியில்’ என்பதுடன் அமைந்த இடம்சார் எதிரிணையை இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: הִשְׁמִיעֲךָ אֶת קֹלוֹ
  choice: தமது குரலை உனக்குக் கேட்கச் செய்தார்
  rationale: שׁמע என்பதன் Hiphil வடிவிலுள்ள காரணவினைப் பொருளையும், קוֹל என்பதன் ‘குரல்’ என்ற நேரடியான பொருளையும் பாதுகாக்கிறது.
- source_word: לְיַסְּרֶךָּ
  choice: உன்னை நல்வழிப்படுத்துவதற்காக
  rationale: יסר என்பதில் உள்ள திருத்துதல், பயிற்றுவித்தல் ஆகிய இரு நிழற்பொருள்களையும், அளவுக்கு மீறிய தண்டனைத் தொனியின்றி இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: וְעַל הָאָרֶץ
  choice: பூமியில்
  rationale: இங்கு אֶרֶץ என்பது குறிப்பிட்ட ஒரு நாட்டைவிட, ‘வானம்’ என்பதற்கு எதிரிணையான பூமியைக் குறிக்கிறது.
- source_word: הֶרְאֲךָ אֶת אִשּׁוֹ הַגְּדוֹלָה
  choice: தமது பெரும் நெருப்பை உனக்குக் காட்டினார்
  rationale: ראה என்பதன் Hiphil காரணவினையை இயல்பான தமிழில் ‘காட்டினார்’ என்று தருவதோடு, ‘அவருடைய பெரும் நெருப்பு’ என்ற மூலத்தின் concrete imagery-ஐத் தக்கவைக்கிறது.
- source_word: וּדְבָרָיו שָׁמַעְתָּ
  choice: அவருடைய வார்த்தைகளை நீ கேட்டாய்
  rationale: דְּבָרִים என்பதன் பன்மையையும் שׁמע என்பதன் நேரடியான கேட்டல் பொருளையும் பாதுகாக்கிறது.
- source_word: מִתּוֹךְ הָאֵשׁ
  choice: நெருப்பின் நடுவிலிருந்து
  rationale: מִתּוֹךְ என்பதன் ‘உள்ளிருந்து/நடுவிலிருந்து’ என்ற இடம்சார் வலிமையைத் தெளிவாகத் தக்கவைக்கிறது.
theological_decisions:
- issue: לְיַסְּרֶךָּ என்பதில் வெளிப்படும் இறைநோக்கின் தன்மை
  choice: உன்னை நல்வழிப்படுத்துவதற்காக
  alternative: உனக்குக் கற்பிப்பதற்காக; உன்னைக் கண்டித்துத் திருத்துவதற்காக
  rationale: மூலச்சொல் வெறும் தகவல் கற்பித்தலையோ தண்டனையையோ மட்டும் குறுக்காமல், திருத்தமும் உருவாக்கமும் சேர்ந்த ஒழுக்கப் பயிற்சியை வெளிப்படுத்துகிறது.
- issue: இறைவெளிப்பாட்டின் புலனுணரத்தக்க மொழியைத் தக்கவைத்தல்
  choice: தமது குரல் ... தமது பெரும் நெருப்பு ... அவருடைய வார்த்தைகள்
  alternative: இவற்றை அருவமான ‘வெளிப்பாடு’ போன்ற சொல்லால் பொதுமைப்படுத்துதல்
  rationale: எபிரெய உரை பயன்படுத்தும் குரல், நெருப்பு, வார்த்தைகள் என்ற concrete imagery-ஐ விளக்கவுரையாக மாற்றாமல் அப்படியே தக்கவைக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், ஒருமை இரண்டாம் நபரான ‘உன்னை/உனக்கு/நீ’ என்பவை மூலத்தின் ஒருமையைப் பாதுகாக்கின்றன. இறைவனைச் சுட்டும் இடங்களில் மரியாதை ஒருமை பயன்படுத்தப்பட்டுள்ளது. நீண்ட எபிரெய வாக்கியம் வாசிப்புத் தெளிவுக்காக தமிழில் மூன்று உட்கூறுகளாகப் பிரிக்கப்பட்டாலும், அதன் காரணம், வானம்–பூமி எதிரிணை, நெருப்பிலிருந்து கேட்ட வார்த்தைகள் ஆகிய தொடர்புகள் மாற்றப்படவில்லை.
