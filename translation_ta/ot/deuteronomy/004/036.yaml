  source_fidelity: மொத்தத்தில் மூலத்திற்கு நெருக்கமான மொழிபெயர்ப்பு. ஆனால் ‘நல்வழிப்படுத்துவதற்காகவே’ என்பது לְיַסְּרֶךָּ என்பதன் ஒழுக்கப்படுத்துதல்/பயிற்றுவித்தல் நிழற்பொருளை ‘நல்ல வழி காட்டுதல்’ எனச் சற்றுக் குறுக்குகிறது; மேலும் ‘வே’ என்ற வலியுறுத்தல் மூலத்தில் இல்லை.
  naturalness: வாக்கியம் நவீனத் தரத் தமிழில் இயல்பாக உள்ளது. இருப்பினும் நோக்கத்தைக் கூறும் கூறை முதன்மை வினையுடன் நேரடியாக இணைப்பது தெளிவாகவும் மூல வாக்கிய அமைப்புக்கு நெருக்கமாகவும் இருக்கும்.
  terminology: ‘குரல்,’ ‘பெரும் நெருப்பு,’ ‘வார்த்தைகள்,’ ‘நெருப்பின் நடுவிலிருந்து’ ஆகியவை துல்லியமாகவும் இயல்பாகவும் உள்ளன. ‘ஒழுக்கப்படுத்துவதற்காக’ என்பது יסר என்பதன் உருவாக்கும் மற்றும் திருத்தும் ஒழுக்கப் பொருளை ‘நல்வழிப்படுத்துதல்’ என்பதைக் காட்டிலும் நன்றாகத் தக்கவைக்கிறது.
  issues:
  - severity: medium
    issue: லְיַסְּרֶךָּ என்பதற்கு ‘நல்வழிப்படுத்துவதற்காகவே’ என்று தரப்பட்டுள்ளது.
    rationale: ‘நல்வழிப்படுத்துதல்’ வழிகாட்டுதல் என்ற பொருளுக்கு நகர்கிறது; எபிரெய வினைச்சொல் ஒழுக்கப் பயிற்சி, திருத்தம், கட்டுப்படுத்துதல் ஆகிய பரந்த பொருளைக் கொண்டது. கூடுதலாக, ‘வே’ மூலத்தில் இல்லாத வலியுறுத்தலைச் சேர்க்கிறது.
