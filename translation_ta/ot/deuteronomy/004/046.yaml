base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/046.yaml
  text: beyond the Jordan[a], in the valley opposite Beth-peor, in the land of Sihon king of the Amorites, who lived in Heshbon, whom Moses and the sons of Israel struck down when they came out from Egypt.
translation:
  language: ta
  text: யோர்தானுக்கு அப்பால், பெத்-பேயோருக்கு எதிரே இருந்த பள்ளத்தாக்கில், எஸ்போனில் வாழ்ந்த எமோரியரின் அரசன் சீகோனுடைய நாட்டில் இவை கூறப்பட்டன. எகிப்திலிருந்து வெளியே வந்தபோது, மோசேயும் இஸ்ரவேலின் மகன்களும்[a] அவனை வீழ்த்தினார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இஸ்ரவேலரும்.” எபிரெயத்தில், “இஸ்ரவேலின் மகன்களும்” என்று உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּעֵבֶר הַיַּרְדֵּן
  choice: யோர்தானுக்கு அப்பால்
  rationale: எல்லைக்கு அப்பாலுள்ள பகுதியைக் குறிக்கும் עֵבֶר என்பதையும் பேச்சாளரின் புவியியல் நோக்கையும் இயல்பான தமிழில் காக்கிறது.
- source_word: בַּגַּיְא
  choice: பள்ளத்தாக்கில்
  rationale: גַּיְא என்பது பள்ளத்தாக்கு அல்லது குறுகிய பள்ளத்தைக் குறிக்கும்; இப்புவியியல் சூழலில் ‘பள்ளத்தாக்கு’ இயல்பானது.
- source_word: מוּל
  choice: எதிரே
  rationale: ஓர் இடத்திற்கு நேர் எதிரான நிலையைத் தெளிவாகக் குறிக்கிறது.
- source_word: בֵּית פְּעוֹר
  choice: பெத்-பேயோர்
  rationale: இடப்பெயர் என்பதால் மொழிபெயர்க்காமல் தமிழில் ஒலிபெயர்க்கப்பட்டது.
- source_word: בְּאֶרֶץ סִיחֹן
  choice: சீகோனுடைய நாட்டில்
  rationale: אֶרֶץ இங்கு அரசனின் ஆட்சிப்பகுதி அல்லது நாட்டைக் குறிக்கிறது; ‘நாடு’ தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: מֶלֶךְ הָאֱמֹרִי
  choice: எமோரியரின் அரசன்
  rationale: எபிரெயக் கட்டமைப்பையும் இனக்குழுவின்மேல் சீகோனுக்கிருந்த அரசாட்சியையும் காக்கிறது.
- source_word: אֲשֶׁר יוֹשֵׁב בְּחֶשְׁבּוֹן
  choice: எஸ்போனில் வாழ்ந்த
  rationale: יוֹשֵׁב குடியிருத்தலைக் குறிக்கிறது; ‘வாழ்ந்த’ நவீனத் தமிழில் இயல்பானது.
- source_word: אֲשֶׁר הִכָּה
  choice: அவனை வீழ்த்தினார்கள்
  rationale: נכה என்பதன் போர்ச் சூழலிலான தாக்கி முறியடித்தல் அல்லது கொல்லுதல் சார்ந்த பொருளை, அளவுக்கு மீறித் தீர்மானிக்காமல் வெளிப்படுத்துகிறது.
- source_word: וּבְנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் மகன்களும்
  rationale: எபிரெயத்தின் ஆண்பால் பன்மை அமைப்பை முறையாகக் காக்கிறது; வழக்கான கூட்டுப்பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: בְּצֵאתָם מִמִּצְרָיִם
  choice: எகிப்திலிருந்து வெளியே வந்தபோது
  rationale: בְּ உடன் வரும் infinitive construct குறிக்கும் காலச்சூழலை இயல்பான தமிழில் தருகிறது.
theological_decisions:
- issue: וּבְנֵי יִשְׂרָאֵל என்ற உடன்படிக்கைசார் இனப்பெயரின் பாலின வடிவம்
  choice: இஸ்ரவேலின் மகன்களும்
  alternative: இஸ்ரவேலரும்
  rationale: மூல எபிரெயம் சொற்தோற்றத்தில் ‘இஸ்ரவேலின் மகன்கள்’ என்று ஆண்பால் பன்மையில் உள்ளது. அதை முதன்மை உரையில் காத்து, முழு மக்களையும் குறிக்கும் இயல்பான கூட்டுப்பொருளை அடிக்குறிப்பில் வழங்குகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டது. இவ்வசனம் முந்தைய வசனத்தின் வாக்கியத்தைத் தொடருவதால், தமிழில் தனித்து வாசிக்கத் தெளிவாக ‘இவை கூறப்பட்டன’ சேர்க்கப்பட்டுள்ளது; இது 4:44–45-இன் தொடர்ச்சியிலிருந்து பெறப்படும் மறைமுகத் தகவல்.
