review_pass:
  verdict: revise
  source_fidelity: The draft faithfully conveys the doubled imperative, the warning against forgetting direct experience, the heart/inner-person metaphor, lifelong duration, and intergenerational making-known. However, ‘நீ மட்டும்’ makes רַק restrict the subject (‘you alone’), rather than functioning as the Hebrew's emphatic/discourse-level restriction introducing the warning. The revised opening avoids that misleading focus while retaining the force of the warning.
  naturalness: Most of the Tamil is clear and suitably dignified. The opening is syntactically understandable but unnatural in its present sense, and ‘உள்ளத்தைவிட்டு’ should be spaced and more idiomatically rendered as ‘உள்ளத்திலிருந்து.’
  terminology: ‘உன்னை’ appropriately renders נַפְשְׁךָ here without imposing a narrow body–soul distinction. ‘உள்ளம்’ is a sound rendering of לֵבָב, with a helpful note. ‘பிள்ளைகள்’ is appropriate in this context for בָנִים; the alternative ‘மகன்கள்’ is properly supplied in the footnote.
  issues:
  - severity: medium
    issue: ‘நீ மட்டும்’ for רַק
    rationale: This wording normally means ‘you alone’ in Tamil and can imply an exclusion of others not present in the Hebrew. Here רַק emphasizes/restricts the exhortation, not its addressee.
  - severity: low
    issue: ‘உள்ளத்தைவிட்டு’
    rationale: The expression needs normal word spacing; ‘உள்ளத்திலிருந்து’ is also more idiomatic for the source phrase ‘from your heart.’
  revised_text: ஆனால், மிகவும் எச்சரிக்கையாயிரு; உன்னை மிகக் கவனமாகக் காத்துக்கொள். உன் கண்கள் கண்டவற்றை நீ மறந்துவிடாதபடியும், உன் வாழ்நாளெல்லாம் அவை உன் உள்ளத்திலிருந்து விலகிவிடாதபடியும் பார்த்துக்கொள். அவற்றை உன் பிள்ளைகளுக்கும் உன் பிள்ளைகளின் பிள்ளைகளுக்கும் தெரியப்படுத்து.
