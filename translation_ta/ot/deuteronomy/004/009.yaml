  text: Only guard yourself carefully[a], and keep your soul very carefully, lest you forget the things that your eyes saw and lest they depart from your heart all the days of your life. Make them known to your children and to your children's children[b],
translation:
  language: ta
  text: ஆனால், மிகவும் எச்சரிக்கையாயிரு; உன்னை மிகக் கவனமாகக் காத்துக்கொள். உன் கண்கள் கண்டவற்றை நீ மறந்துவிடாதபடியும், உன் வாழ்நாளெல்லாம் அவை உன் உள்ளத்திலிருந்து விலகிவிடாதபடியும் பார்த்துக்கொள். அவற்றை உன் பிள்ளைகளுக்கும் உன் பிள்ளைகளின் பிள்ளைகளுக்கும் தெரியப்படுத்து.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רַק
  choice: நீ மட்டும்
  rationale: ரַק இங்கு வலியுறுத்தும் கட்டுப்பாட்டுச் சொல்லாக உள்ளது. ‘நீ மட்டும்’ என்பது எச்சரிக்கையின் தீவிரத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: הִשָּׁמֶר לְךָ
  choice: மிகவும் எச்சரிக்கையாக இருந்து
  rationale: שׁמר என்பதன் நிபால் கட்டளை வடிவமும் לְךָ என்பதும் தன்னைக் குறித்த விழிப்பைக் கோரும் சொற்றொடராகும். தமிழில் சொல்லுக்குச் சொல் அமைப்பைவிட இவ்வாறு கூறுவது தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: וּשְׁמֹר נַפְשְׁךָ מְאֹד
  choice: உன்னை மிகக் கவனமாகக் காத்துக்கொள்
  rationale: נֶפֶשׁ இங்கு உடலிலிருந்து தனியான ‘ஆத்துமா’ என்பதைவிட முழு நபரையே குறிக்கிறது. שׁמר மீண்டும் வருவதால் உருவாகும் தீவிரமும் ‘காத்துக்கொள்’ என்பதில் பாதுகாக்கப்படுகிறது.
- source_word: הַדְּבָרִים אֲשֶׁר רָאוּ עֵינֶיךָ
  choice: உன் கண்கள் கண்டவற்றை
  rationale: דְּבָרִים என்பது சொற்கள், காரியங்கள் அல்லது நிகழ்வுகள் எனப் பொருள்படலாம்; கண்கள் கண்டவை என்று தொடர்வதால் ‘கண்டவற்றை’ என்பது சூழலுக்கு ஏற்றது. நேரடி சாட்சியின் வலியுறுத்தலும் தக்கவைக்கப்படுகிறது.
- source_word: וּפֶן יָסוּרוּ מִלְּבָבְךָ
  choice: அவை உன் உள்ளத்தைவிட்டு அகன்றுவிடாதபடியும்
  rationale: סור என்பதன் விலகுதல் அல்லது அகலுதல் என்ற உருவகம் காக்கப்படுகிறது. לֵבָב என்பதற்கு இயல்பான தமிழில் ‘உள்ளம்’ பயன்படுத்தப்பட்டு, அதன் விரிந்த எபிரெயப் பொருள் அடிக்குறிப்பில் விளக்கப்படுகிறது.
- source_word: כֹּל יְמֵי חַיֶּיךָ
  choice: உன் வாழ்நாளெல்லாம்
  rationale: எபிரெயச் சொற்றொடரின் முழு வாழ்நாள் என்ற பொருளைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: וְהוֹדַעְתָּם
  choice: அவற்றை ... தெரியப்படுத்து
  rationale: ידע என்பதன் ஹிபில் வடிவம் ‘அறியச் செய்’ அல்லது ‘தெரியப்படுத்து’ என்று பொருள்படும். ‘கற்பி’ என்று விளக்கிப் பெருக்காமல் மூலத்தின் காரணவினைப் பொருளைத் தக்கவைக்கிறது.
- source_word: לְבָנֶיךָ וְלִבְנֵי בָנֶיךָ
  choice: உன் பிள்ளைகளுக்கும் உன் பிள்ளைகளின் பிள்ளைகளுக்கும்
  rationale: בָּנִים இலக்கணத்தில் ஆண்பால் வடிவமாக இருந்தாலும், இத்தலைமுறைதோறும் தொடரும் சூழலில் பிள்ளைகள் அல்லது சந்ததியினர் அனைவரையும் குறிக்கக்கூடும். எபிரெயத் தொடரின் அமைப்பும் தமிழில் பாதுகாக்கப்படுகிறது.
theological_decisions:
- issue: נֶפֶשׁ என்பதன் மனிதவியல் பொருள்
  choice: ‘உன்னை’ என்று மொழிபெயர்க்கப்பட்டது
  alternative: ‘உன் ஆத்துமாவை’ அல்லது ‘உன் உயிரை’
  rationale: இச்சூழலில் נֶפֶשׁ முழு நபரையும் குறிக்கிறது. ‘ஆத்துமா’ என்பது மூலத்தில் கட்டாயமில்லாத உடல்–ஆத்துமா பிரிவை உணர்த்தக்கூடும்; ‘உன்னை’ என்பது கட்டளையின் முழுமையான தனிப்பட்ட பொறுப்பைத் தக்கவைக்கிறது.
- issue: בָנֶיךָ என்பதன் பாலினச் சுட்டு
  choice: ‘உன் பிள்ளைகள்’ என்று மொழிபெயர்க்கப்பட்டது
  alternative: ‘உன் மகன்கள்’
  rationale: ஆண்பால் பன்மை வடிவம் சூழலின்படி பிள்ளைகள் அல்லது சந்ததியினர் அனைவரையும் பிரதிநிதித்துவமாகக் குறிக்கலாம். இங்கு உடன்படிக்கை நினைவைத் தலைமுறைகளுக்குக் கடத்துவதே கருத்து; ஆண் பிள்ளைகளுக்கு மட்டும் வரையறுப்பதற்கான குறிப்பு இல்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்கு தெளிவாகவும் அதேவேளையில் வேதாகம உரைக்கு ஏற்ற கண்ணியத்துடனும் வடிவமைக்கப்பட்டது. இருமுறை வரும் שׁמר என்பதன் வலியுறுத்தல் ‘எச்சரிக்கையாக இருந்து’ மற்றும் ‘காத்துக்கொள்’ என்ற இணை அமைப்பால் பாதுகாக்கப்பட்டது. எபிரெய மனிதவியல் சொற்களுக்கு குறுகிய சமயவியல் பொருள் திணிக்கப்படவில்லை.
