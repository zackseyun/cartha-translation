revisions:
- from: நீ மட்டும் மிகவும் எச்சரிக்கையாக இருந்து, உன்னை மிகக் கவனமாகக் காத்துக்கொள். உன் கண்கள் கண்டவற்றை நீ மறந்துவிடாதபடியும், உன் வாழ்நாளெல்லாம் அவை உன் உள்ளத்தைவிட்டு[a] அகன்றுவிடாதபடியும் பார்த்துக்கொள். அவற்றை உன் பிள்ளைகளுக்கும் உன் பிள்ளைகளின் பிள்ளைகளுக்கும்[b] தெரியப்படுத்து.
  to: ஆனால், மிகவும் எச்சரிக்கையாயிரு; உன்னை மிகக் கவனமாகக் காத்துக்கொள். உன் கண்கள் கண்டவற்றை நீ மறந்துவிடாதபடியும், உன் வாழ்நாளெல்லாம் அவை உன் உள்ளத்திலிருந்து விலகிவிடாதபடியும் பார்த்துக்கொள். அவற்றை உன் பிள்ளைகளுக்கும் உன் பிள்ளைகளின் பிள்ளைகளுக்கும் தெரியப்படுத்து.
