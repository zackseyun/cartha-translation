  source_fidelity: மூல எபிரெயத்தின் காலச்சுட்டி (אָז), மோசேயின் பிரித்துவைத்தல்/நியமித்தல் செயல் (יַבְדִּיל), மூன்று நகரங்கள், யோர்தானுக்கு அப்பாலுள்ள இடம், கிழக்குத் திசையைக் குறிக்கும் ‘சூரியன் உதிக்கும் திசை’ ஆகிய அனைத்தும் பொருளிலும் வரிசையிலும் துல்லியமாகக் கொடுக்கப்பட்டுள்ளன. ‘யோர்தானுக்கு அப்பால்’ என்ற புவியியல் பார்வைநிலை சார்ந்த சொற்றொடரின் மாற்றுவாசிப்பையும் அடிக்குறிப்பு உரியவாறு காக்கிறது.
  naturalness: நவீன நிலையான தமிழில் வாக்கியம் தெளிவாகவும் கண்ணியமான கதைநடையுடனும் உள்ளது. ‘தனியாக ஒதுக்கிவைத்தார்’ என்பது இச்சூழலில் ‘set apart’ என்பதன் நோக்கமுள்ள பிரித்துவைப்பை இயல்பாக வெளிப்படுத்துகிறது.
