  yaml_path: translation/ot/deuteronomy/004/041.yaml
  text: Then Moses set apart three cities beyond the Jordan[a], toward the sunrise[b],
translation:
  language: ta
  text: அப்போது மோசே யோர்தானுக்கு அப்பால்[a], சூரியன் உதிக்கும் திசையில்[b], மூன்று நகரங்களைத் தனியாக ஒதுக்கிவைத்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘யோர்தானைக் கடந்து’ அல்லது ‘யோர்தானின் மறுபுறத்தில்.’ இந்த எபிரெயச் சொற்றொடர் ஒரு புவியியல் மரபுத்தொடர்; அதன் சரியான தமிழாக்கம் கதை சொல்லப்படும் பார்வைநிலையைப் பொறுத்து மாறலாம்.
    reason: lexical_alternative
  - marker: b
    text: சொல்லர்த்தமாக, ‘சூரியன் உதிப்பதை நோக்கி’; அதாவது, ‘கிழக்கே.’
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  choice: அப்போது
  rationale: அடுத்ததாக நிகழ்ந்த செயலை அறிமுகப்படுத்தும் காலவினையடை; நவீன தமிழில் இயல்பாகக் கதைத் தொடரை வெளிப்படுத்துகிறது.
- source_word: יַבְדִּיל
  choice: தனியாக ஒதுக்கிவைத்தார்
  rationale: בדל என்பதன் ஹிஃபில் வடிவம் ஒரு குறிப்பிட்ட நோக்கத்திற்காகப் பிரித்து வைப்பதைக் குறிக்கிறது. இச்சூழலில் நகரங்களின் நோக்கத்தை வசனத்துக்குள் முன்கூட்டியே சேர்க்காமல், பிரித்தல் மற்றும் நியமித்தல் ஆகிய இரு நுணுக்கங்களையும் இச்சொற்றொடர் தக்கவைக்கிறது.
- source_word: מֹשֶׁה
  choice: மோசே
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் பரவலாக அறியப்பட்ட பெயர்வடிவம்.
- source_word: שָׁלֹשׁ עָרִים
  choice: மூன்று நகரங்கள்
  rationale: எண்ணும் பெயர்ச்சொல்லும் கொண்ட எளிய எபிரெயக் கட்டமைப்பை நேரடியாக வழங்குகிறது; வாக்கியத்தில் வேற்றுமை காரணமாக ‘மூன்று நகரங்களை’ என வருகிறது.
- source_word: בְּעֵבֶר הַיַּרְדֵּן
  choice: யோர்தானுக்கு அப்பால்
  rationale: யோர்தானின் மறுபுறப் பகுதியைக் குறிக்கும் புவியியல் மரபுத்தொடரைச் சுருக்கமாகவும் இயல்பாகவும் வழங்குகிறது; பார்வைநிலையின் நெகிழ்வை அடிக்குறிப்பு காக்கிறது.
- source_word: מִזְרְחָה שָׁמֶשׁ
  choice: சூரியன் உதிக்கும் திசையில்
  rationale: ‘சூரியன் உதிப்பதை நோக்கி’ என்ற மூலமொழியின் தெளிவான உருவகத்தைப் பாதுகாத்தபடியே, நவீன தமிழில் இயல்பாக கிழக்குத் திசையைக் குறிக்கிறது.
