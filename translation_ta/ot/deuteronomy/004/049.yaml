  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான புவியியல் விவரிப்பு. எபிரெய மூலத்தின் பட்டியல் தொடரைத் தமிழுக்கு ஏற்றவாறு அமைத்துள்ளதுடன், ‘அரபா கடல்’ என்ற மூலவடிவப் பெயர் பாதுகாக்கப்பட்டுள்ளது.
