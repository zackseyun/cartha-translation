- from: யோர்தானுக்கு அப்பால் கிழக்கே இருந்த அரபா முழுவதும், பிஸ்காவின் சரிவுகளுக்குக் கீழே உள்ள அரபா கடல்வரை.[a]
  to: யோர்தானுக்கு அப்பால், கிழக்கே உள்ள அரபா முழுவதும், பிஸ்காவின் சரிவுகளுக்குக் கீழே உள்ள அரபா கடல்வரை.[a]
