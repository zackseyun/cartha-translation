  text: וְ/כָל הָ֨/עֲרָבָ֜ה עֵ֤בֶר הַ/יַּרְדֵּן֙ מִזְרָ֔חָ/ה וְ/עַ֖ד יָ֣ם הָ/עֲרָבָ֑ה תַּ֖חַת אַשְׁדֹּ֥ת הַ/פִּסְגָּֽה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/049.yaml
  text: and all the Arabah beyond the Jordan eastward[a], as far as the Sea of the Arabah, below the slopes of Pisgah.
translation:
  language: ta
  text: யோர்தானுக்கு அப்பால், கிழக்கே உள்ள அரபா முழுவதும், பிஸ்காவின் சரிவுகளுக்குக் கீழே உள்ள அரபா கடல்வரை.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: பொதுவாகச் சவக்கடல் என்று அடையாளம் காணப்படும் நீர்நிலை இதுவே.
    reason: cross_reference
lexical_decisions:
- source_word: הָעֲרָבָה
  choice: அரபா
  rationale: இச்சூழலில் பொதுவான ‘சமவெளி’ என்பதைக் காட்டிலும் யோர்தான் பிளவுப் பள்ளத்தாக்குப் பகுதியைக் குறிக்கும் புவியியல் பெயராக இருப்பதால் ஒலிபெயர்க்கப்பட்டது.
- source_word: עֵבֶר הַיַּרְדֵּן
  choice: யோர்தானுக்கு அப்பால்
  rationale: பேசுபவரின் நோக்குநிலையிலிருந்து யோர்தானின் மறுபக்கப் பகுதியைக் குறிக்கும் தொடர்புச் சார்ந்த புவியியல் சொற்றொடரை இயல்பாகப் பாதுகாக்கிறது.
- source_word: מִזְרָחָה
  choice: கிழக்கே
  rationale: கிழக்குத் திசையிலுள்ள பகுதியைக் குறிக்கும் திசை வினையடையைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: יָם הָעֲרָבָה
  choice: அரபா கடல்
  rationale: பிற்காலத்தில் வழக்கமான ‘சவக்கடல்’ என்ற பெயரை மூலத்தில் சேர்க்காமல், எபிரெயச் சொற்றொடரை நேரடியாக மொழிபெயர்க்கிறது; அடையாளம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: תַּחַת
  choice: கீழே உள்ள
  rationale: இங்கு நிலஅமைப்பில் ஒன்றைவிடத் தாழ்வான இடத்தை இயல்பான தமிழில் குறிக்கிறது.
- source_word: אַשְׁדֹּת
  choice: சரிவுகள்
  rationale: புவியியல் பயன்பாட்டில் மலைச் சரிவுகள் அல்லது இறக்கங்களைக் குறிக்கும் பொருளைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: הַפִּסְגָּה
  choice: பிஸ்கா
  rationale: புவியியல் பெயர் நவீனத் தமிழில் ஒலிபெயர்க்கப்பட்டது.
- source_word: וְכָל
  choice: முழுவதும்
  rationale: முந்தைய வசனத்துடன் உள்ள இணைப்பைத் தமிழ் தொடரமைப்பு வெளிப்படுத்தும் நிலையில், விவரிக்கப்படும் பகுதியின் முழுமையான பரப்பை இயல்பாகக் காட்டுகிறது.
