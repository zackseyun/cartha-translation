base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/032.yaml
  text: 'For ask now about the former days that were before you[a], from the day when God created man on the earth, and from one end of the heavens to the other end of the heavens: has anything happened like this great thing, or has anything been heard like it?'
translation:
  language: ta
  text: '32 ஏனெனில், உனக்கு முன்பிருந்த முற்கால நாட்களைப் பற்றி இப்போது கேட்டுப் பார்: கடவுள் மனிதனை[a] பூமியில் படைத்த நாள் தொடங்கி, வானத்தின் ஒரு முனையிலிருந்து வானத்தின் மறுமுனைவரை, இத்தகைய மாபெரும் நிகழ்வு எப்போதாவது நடந்ததுண்டா? அல்லது அதைப்போன்றது கேள்விப்பட்டதுண்டா?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மனிதகுலத்தை”; படைப்பு சூழலில் எபிரெய மொழியின் אָדָם என்ற சொல் மனிதகுலம் முழுவதையும் பிரதிநிதித்துவமாகக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁאַל נָא
  choice: இப்போது கேட்டுப் பார்
  rationale: கட்டளையுடன் வரும் נָא துகளின் வலியுறுத்தும் வேண்டுகோள் தொனியை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: לְיָמִים רִאשֹׁנִים
  choice: முற்கால நாட்களைப் பற்றி
  rationale: தொன்மையான கடந்த காலத்தைச் சுட்டுகிறது; கண்ணியமானதும் சாதாரண வாசகர்களுக்குப் புரியக்கூடியதுமான நடை.
- source_word: אֲשֶׁר הָיוּ לְפָנֶיךָ
  choice: உனக்கு முன்பிருந்த
  rationale: கேட்பவருக்கு அல்லது அவரது தலைமுறைக்கு முந்திய காலம் என்ற நேரப்பொருளைப் பாதுகாக்கிறது.
- source_word: לְמִן הַיּוֹם אֲשֶׁר בָּרָא
  choice: படைத்த நாள் தொடங்கி
  rationale: ஆராய வேண்டிய வரலாற்றுக் காலத்தின் தொடக்க எல்லையைத் தெளிவாகக் குறிக்கிறது.
- source_word: אֱלֹהִים
  choice: கடவுள்
  rationale: இங்கு ஒரே படைப்பாளரைக் குறிக்கும் இயல்பான நிலையான தமிழ் சொல்.
- source_word: אָדָם
  choice: மனிதனை
  rationale: எபிரெய ஒற்றை வடிவத்தையும் படைப்பு சூழலில் மனிதகுலத்தைப் பிரதிநிதித்துவப்படுத்தும் அதன் விரிந்த பொருளையும் தக்கவைக்கிறது.
- source_word: עַל הָאָרֶץ
  choice: பூமியில்
  rationale: இடப்பொருளைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: וּלְמִקְצֵה הַשָּׁמַיִם וְעַד קְצֵה הַשָּׁמָיִם
  choice: வானத்தின் ஒரு முனையிலிருந்து வானத்தின் மறுமுனைவரை
  rationale: முழு பரப்பையும் குறிக்கும் இருமுனைச் சொல்லாட்சியை இயல்பான தமிழில் பாதுகாக்கிறது.
- source_word: הֲנִהְיָה
  choice: எப்போதாவது நடந்ததுண்டா
  rationale: இத்தகைய ஒன்று வரலாற்றில் நிகழ்ந்திருக்கிறதா என்ற வினாவையும் சொல்லாட்சியின் வலிமையையும் வெளிப்படுத்துகிறது.
- source_word: כַּדָּבָר הַגָּדוֹל הַזֶּה
  choice: இத்தகைய மாபெரும் நிகழ்வு
  rationale: דבר இங்கு வெறும் சொல் அல்ல, நிகழ்வு அல்லது காரியம் என்பதால் சூழலுக்கேற்ற தெளிவான சொல்லைத் தேர்ந்தெடுக்கிறது.
- source_word: הֲנִשְׁמַע כָּמֹהוּ
  choice: இதுபோன்ற ஒன்று கேள்விப்பட்டதுண்டா
  rationale: நிபால் வடிவத்தின் ‘கேள்விப்படுதல்/அறியப்படுதல்’ பொருளையும் rhetorical force-ஐயும் இயல்பான தமிழில் தருகிறது.
theological_decisions:
- issue: படைப்பு சூழலில் אָדָם என்பதன் பொருள்
  choice: மனிதனை
  alternative: மனிதகுலத்தை; ஆதாமை
  rationale: இவ்வசனம் படைப்பிலிருந்து தொடங்கிய வரலாற்றை நோக்குகிறது. எபிரெயச் சொல் ஒற்றையில் இருந்தாலும் மனிதகுலத்தைப் பிரதிநிதித்துவப்படுத்தக்கூடும். ‘மனிதனை’ என்பது இந்த வடிவத்தையும் விரிந்த சாத்தியப் பொருளையும் தக்கவைக்கிறது; ‘ஆதாமை’ என்று தனிநபர் பெயராக மட்டும் தீர்மானிப்பதைத் தவிர்க்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் கண்ணியமான, நேரடியாகப் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. ஒருமை இரண்டாம் நபரைக் காட்ட ‘உனக்கு’ தக்கவைக்கப்பட்டுள்ளது. ‘மாபெரும் நிகழ்வு’ என்பது דבר என்பதன் பரந்த நிகழ்வு/காரியம் பொருளை இச்சூழலில் தெளிவாக்குகிறது.
