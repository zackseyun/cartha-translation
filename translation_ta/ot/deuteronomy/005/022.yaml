revisions:
- from: உங்கள் சபை முழுவதிடமும் மலையில், நெருப்பு, மேகம், அடர்ந்த இருள் ஆகியவற்றின் நடுவிலிருந்து யாவே உரத்த குரலில் இந்த வார்த்தைகளைப் பேசினார்; அவர் இதற்கு மேல் எதையும் சேர்த்துச் சொல்லவில்லை.[a] பின்பு அவர் அவற்றை இரண்டு கற்பலகைகளில் எழுதி என்னிடம் கொடுத்தார்.
  to: யாவே மலையில் உங்கள் முழுச் சபையிடமும் நெருப்பு, மேகம், அடர்ந்த இருள் ஆகியவற்றின் நடுவிலிருந்து உரத்த குரலில் இந்த வார்த்தைகளைப் பேசினார்; அதற்குமேல் அவர் எதையும் சேர்த்துச் சொல்லவில்லை.[a] பின்பு அவர் அவற்றை இரண்டு கல் பலகைகளின்மேல் எழுதி, அவற்றை என்னிடம் கொடுத்தார்.
  rationale: The revision corrects the Tamil expression for the collective assembly and renders עַל explicitly as ‘மேல்.’ It retains the source’s sequence, the divine name, and the deliberately non-dogmatic main-text/footnote treatment of the ambiguous וְלֹא יָסָף clause.
