  text: אֶֽת הַ/דְּבָרִ֣ים הָ/אֵ֡לֶּה דִּבֶּר֩ יְהוָ֨ה אֶל כָּל קְהַלְ/כֶ֜ם בָּ/הָ֗ר מִ/תּ֤וֹךְ הָ/אֵשׁ֙ הֶֽ/עָנָ֣ן וְ/הָֽ/עֲרָפֶ֔ל ק֥וֹל גָּד֖וֹל וְ/לֹ֣א יָסָ֑ף וַֽ/יִּכְתְּבֵ֗/ם עַל שְׁנֵי֙ לֻחֹ֣ת אֲבָנִ֔ים וַֽ/יִּתְּנֵ֖/ם אֵלָֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/022.yaml
  text: These words Yahweh spoke to all your assembly on the mountain[a], out of the midst of the fire, the cloud, and the thick darkness, with a loud voice, and he added no more. And he wrote them on two tablets of stone and gave them to me.
translation:
  language: ta
  text: யாவே மலையில் உங்கள் முழுச் சபையிடமும் நெருப்பு, மேகம், அடர்ந்த இருள் ஆகியவற்றின் நடுவிலிருந்து உரத்த குரலில் இந்த வார்த்தைகளைப் பேசினார்; அதற்குமேல் அவர் எதையும் சேர்த்துச் சொல்லவில்லை.[a] பின்பு அவர் அவற்றை இரண்டு கல் பலகைகளின்மேல் எழுதி, அவற்றை என்னிடம் கொடுத்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர் தொடர்ந்து பேசவில்லை.” எபிரெயச் சொற்றொடரை “அவர் இதற்கு மேல் எதையும் சேர்த்துச் சொல்லவில்லை” என்றும் “அவர் தொடர்ந்து பேசவில்லை” என்றும் புரிந்துகொள்ளலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைப்பெயரான நான்கெழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் இயல்பான ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: הַדְּבָרִים הָאֵלֶּה
  choice: இந்த வார்த்தைகளை
  rationale: דְּבָרִים என்பதன் அடிப்படைப் பொருளான ‘வார்த்தைகள்’ என்பதையும், முன்பு உரைக்கப்பட்ட உடன்படிக்கைச் சொற்களைக் குறிக்கும் சூழலையும் காக்கிறது; ‘கட்டளைகள்’ என்று விளக்கத்தைச் சேர்க்கவில்லை.
- source_word: כָּל קְהַלְכֶם
  choice: உங்கள் சபை முழுவதிடமும்
  rationale: கூடியிருந்த இஸ்ரவேல் சமூகத்தின் முழுமையையும், இரண்டாம் நபர் பன்மை உடைமையையும் இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: בָּהָר
  choice: மலையில்
  rationale: சீனாய் மலையில் நிகழ்ந்த பொதுவான வெளிப்பாட்டின் இடத்தை நேரடியாகக் குறிக்கிறது.
- source_word: מִתּוֹךְ הָאֵשׁ הֶעָנָן וְהָעֲרָפֶל
  choice: நெருப்பு, மேகம், அடர்ந்த இருள் ஆகியவற்றின் நடுவிலிருந்து
  rationale: מִתּוֹךְ என்பதன் ‘நடுவிலிருந்து’ என்ற காட்சித் தீவிரத்தையும், עֲרָפֶל என்பதன் அடர்ந்த இருள் அல்லது காரிருள் என்ற பொருளையும் காக்கிறது.
- source_word: קוֹל גָּדוֹל
  choice: உரத்த குரலில்
  rationale: சொல்லுக்குச் சொல் ‘பெரிய குரல்’ என்பதற்குப் பதிலாக, தெய்வீக உரையின் செவிப்புல வலிமையை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: וְלֹא יָסָף
  choice: அவர் இதற்கு மேல் எதையும் சேர்த்துச் சொல்லவில்லை
  rationale: இங்கு வினைச்சொல் ‘மேலும் சேர்த்தல்’ அல்லது ‘தொடர்தல்’ என்ற இரு நெருங்கிய பொருள்களை ஏற்க முடியும். முதன்மை உரை, இந்த வார்த்தைகளுக்கு வேறு எதையும் அவர் சேர்த்துச் சொல்லவில்லை என்ற பொருளைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: שְׁנֵי לֻחֹת אֲבָנִים
  choice: இரண்டு கற்பலகைகளில்
  rationale: எண்ணிக்கையையும் கல்லால் ஆன பலகைகள் என்ற பொருளையும் சுருக்கமான இயல்பான தமிழில் காக்கிறது.
- source_word: וַיִּתְּנֵם אֵלָי
  choice: என்னிடம் கொடுத்தார்
  rationale: முந்தைய வாக்கியத்தின் இறைவனையே எழுவாயாகத் தொடர்ந்து கொண்டு, மோசே பெற்றதைத் தெளிவாகக் கூறுகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: யெகோவா
  rationale: தனிப்பட்ட இறைப்பெயரை ‘கர்த்தர்’ போன்ற பட்டமாக மாற்றாமல் ஒலிபெயர்க்கிறது; குறிப்பிட்ட சமயப்பிரிவின் தனித்துவமான விளக்கத்தைச் சேர்க்கவில்லை.
- issue: וְלֹא יָסָף என்பதன் பொருள்
  choice: அவர் இதற்கு மேல் எதையும் சேர்த்துச் சொல்லவில்லை
  alternative: அவர் தொடர்ந்து பேசவில்லை
  rationale: எபிரெயச் சொற்றொடர் ‘மேலும் சேர்க்கவில்லை’ என்றும் ‘தொடரவில்லை’ என்றும் புரிந்துகொள்ளப்படலாம். உடனடிச் சூழலில் உரைக்கப்பட்ட வார்த்தைகளின் நிறைவைக் குறிக்கும் வாசிப்பு முதன்மை உரையில் வைக்கப்பட்டு, உண்மையான பொருள் ஐயம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதாகவும் வழிபாட்டு உரைக்கு ஏற்ற கண்ணியத்துடனும் வடிவமைக்கப்பட்டது. நீண்ட எபிரெய வாக்கியத்தின் ஒழுங்கு இயன்றவரை காக்கப்பட்டாலும், இறுதி நிகழ்ச்சித் தொடரை இயல்பாக்க ‘பின்பு’ பயன்படுத்தப்பட்டது. அடிக்குறிப்பு குறி அது சார்ந்த וְלֹא יָסָף சொற்றொடருக்குப் பின்னரே வைக்கப்பட்டுள்ளது.
