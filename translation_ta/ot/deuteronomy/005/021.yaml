base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/021.yaml
  text: And you shall not covet your neighbor’s wife[a], and you shall not desire your neighbor’s house, his field, his male servant, his female servant, his ox, his donkey[b], or anything that belongs to your neighbor.
translation:
  language: ta
  text: உன் அயலானின் மனைவியை இச்சிக்காதே[a]; உன் அயலானின் வீட்டையோ[b], அவனுடைய வயலையோ, அவனுடைய ஆண் அடிமையையோ, அவனுடைய பெண் அடிமையையோ, அவனுடைய எருதையையோ, அவனுடைய கழுதையையோ, உன் அயலானுக்குச் சொந்தமான எதையுமோ பேராவல் கொள்ளாதே.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இங்கு ‘இச்சிக்காதே’ என மொழிபெயர்க்கப்பட்ட எபிரேய வினைச்சொல்லும், அடுத்த வாக்கியத்தில் ‘பேராவல் கொள்ளாதே’ என மொழிபெயர்க்கப்பட்ட வினைச்சொல்லும் தொடர்புடையவை; ஆனால் அவை வெவ்வேறு சொற்கள். இந்த வேறுபாடு கட்டளையின் தடையை வலியுறுத்தவோ சொல்லாட்சியில் மாறுபாடு தரவோ இருக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘வீடு’ என்பதற்கான எபிரேயச் சொல் ‘வீட்டார்’ அல்லது விரிவாக ‘குடும்பச் சொத்து’ என்றும் பொருள்படலாம். தொடர்ந்து வயலும் பிற உடைமைகளும் பட்டியலிடப்படுவதால் இங்கு ‘வீடு’ என மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַחְמֹד
  choice: இச்சிக்காதே
  rationale: חמד என்பது பிறருக்குரியதைத் தவறாக விரும்பும் பொருளை இக்கட்டளையில் தருகிறது. ‘இச்சிக்காதே’ என்பது அதன் உள்ளார்ந்த விருப்பத்தையும் ஒழுக்கத் தடையையும் சுருக்கமாகக் காக்கிறது.
- source_word: אֵשֶׁת רֵעֶךָ
  choice: உன் அயலானின் மனைவியை
  rationale: எபிரேய உடைமைத் தொடரை இயல்பான நவீனத் தமிழில் நேரடியாகக் காட்டுகிறது.
- source_word: תִתְאַוֶּה
  choice: அடையப் பேராவல் கொள்ளாதே
  rationale: אוה என்பதன் தீவிர ஏக்கம் அல்லது பேராவல் என்ற நுணுக்கத்தை வெளிப்படுத்தி, முந்தைய חמד என்பதிலிருந்து வினைச்சொல் வேறுபாட்டைக் காக்கிறது. ‘அடைய’ என்பது அயலானுக்குச் சொந்தமானவற்றை நோக்கிய ஆசை என்பதைத் தமிழில் தெளிவாக்குகிறது.
- source_word: בֵּית רֵעֶךָ
  choice: உன் அயலானின் வீட்டை
  rationale: בַּיִת என்பதற்கு வீடு, வீட்டார், குடும்பச் சொத்து ஆகிய பொருள்கள் இருக்கலாம்; தொடர்ந்து சொத்துகள் பட்டியலிடப்படுவதால் இங்கு ‘வீடு’ முதன்மைப் பொருளாகத் தேர்ந்தெடுக்கப்பட்டுள்ளது.
- source_word: שָׂדֵהוּ
  choice: அவனுடைய வயல்
  rationale: שָׂדֶה என்பதன் இயல்பான, குறிப்பான பொருள் ‘வயல்’; உபாகமத்தின் கட்டளை வடிவில் உள்ள இச்சொல் வெளிப்படையாக மொழிபெயர்க்கப்படுகிறது.
- source_word: עַבְדּוֹ
  choice: அவனுடைய ஆண் அடிமை
  rationale: வீட்டுச் சொத்துப் பட்டியலின் சூழலில் கட்டுண்ட சமூக நிலை தெளிவாக இருப்பதால் ‘அடிமை’ பயன்படுத்தப்படுகிறது; ஆண்பால் வேறுபாடும் காக்கப்படுகிறது.
- source_word: אֲמָתוֹ
  choice: பெண் அடிமை
  rationale: אָמָה குறிக்கும் பெண் அடிமை நிலையை மறைக்காமல், முந்தைய ஆண் அடிமையுடன் உள்ள பாலின இணைப்பைத் தெளிவாகக் காட்டுகிறது.
- source_word: שׁוֹרוֹ
  choice: அவனுடைய எருது
  rationale: שׁוֹר என்பது பொதுவாக எருது அல்லது மாட்டின உழவு விலங்கைக் குறிக்கிறது; சட்டப் பட்டியலில் ‘எருது’ குறிப்பான தேர்வாகும்.
- source_word: חֲמֹרוֹ
  choice: அவனுடைய கழுதை
  rationale: חֲמוֹר என்பதற்கான தெளிவான, இயல்பான நவீனத் தமிழ் இணை ‘கழுதை’ ஆகும்.
- source_word: וְכֹל אֲשֶׁר לְרֵעֶךָ
  choice: உன் அயலானுக்குச் சொந்தமான வேறு எதையும்
  rationale: முடிவுச் சொற்றொடரின் முழுமையான பரப்பையும் לְ குறிக்கும் உடைமை உறவையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: רֵעֶךָ
  choice: உன் அயலான்
  rationale: ரֵעַ குறிக்கும் உடனிருக்கும் பிற மனிதர் அல்லது சமூகத்தவர் என்ற உறவை ‘அயலான்’ மரபுடனும் தெளிவுடனும் தெரிவிக்கிறது.
theological_decisions:
- issue: பத்தாம் கட்டளையில் வரும் இரு விருப்ப வினைச்சொற்களை வேறுபடுத்துதல்
  choice: חמד என்பதை ‘இச்சி’ என்றும் אוה என்பதை ‘பேராவல் கொள்’ என்றும் வேறுபடுத்துதல்
  alternative: இரண்டையும் ‘ஆசைப்படு’ அல்லது ‘இச்சி’ என்று ஒரே சொல்லால் மொழிபெயர்த்தல்
  rationale: எபிரேய உரை தொடர்புடையவையாக இருந்தாலும் வேறுபட்ட இரு வினைச்சொற்களைப் பயன்படுத்துகிறது. அவற்றை வேறுபடுத்துவது உபாகம வடிவத்தின் சொல்லாட்சியையும் வலியுறுத்தலையும் காக்கிறது; அவற்றுக்கிடையிலான துல்லிய உறவை அளவுக்கு மீறித் தீர்மானிப்பதில்லை.
- issue: அடிமை நிலையைச் சுட்டும் சொற்களின் மொழிபெயர்ப்பு
  choice: ‘ஆண் அடிமை’, ‘பெண் அடிமை’ என்று வெளிப்படையாக மொழிபெயர்த்தல்
  alternative: ‘வேலைக்காரன்’, ‘வேலைக்காரி’ அல்லது ‘பணியாளர்’ என்று மொழிபெயர்த்தல்
  rationale: இங்கு நபர்கள் வீட்டுச் சொத்துப் பட்டியலில் இடம்பெறுவதால் கட்டுண்ட நிலை உரையில் முக்கியமானது. மென்மைப்படுத்தாமல் ‘அடிமை’ என மொழிபெயர்ப்பதும் பாலின வேறுபாட்டைக் காப்பதும் மூலத்துக்கு நெருக்கமானது.
translation_notes:
  register: நவீனத் தரத் தமிழில், கட்டளைக்குரிய சுருக்கமும் கண்ணியமும் காக்கப்பட்டுள்ளன. ‘இச்சிக்காதே’ சிறிது உயர்ந்த நடையைக் கொண்டிருந்தாலும் பொதுவாகப் புரியக்கூடியது; ‘பேராவல் கொள்ளாதே’ இரண்டாவது எபிரேய வினைச்சொல்லின் வேறுபாட்டை இயல்பாக வெளிப்படுத்துகிறது. பட்டியலில் மீளும் உடைமைச் சுட்டுகள் தமிழில் தேவையான இடங்களில் மட்டும் வெளிப்படுத்தப்பட்டுள்ளன.
