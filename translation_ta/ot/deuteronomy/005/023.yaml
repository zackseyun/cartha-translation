base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/023.yaml
  text: And when you heard the voice from the midst of the darkness[a], while the mountain was burning with fire, you came near to me—all the heads of your tribes and your elders—
translation:
  language: ta
  text: 23 நீங்கள் இருளின் நடுவிலிருந்து அந்தக் குரலைக் கேட்டபோது[a], மலை நெருப்பில் எரிந்துகொண்டிருக்கையில், உங்கள் கோத்திரங்களின் தலைவர்களும் உங்கள் மூப்பர்களும் அனைவரும் என்னிடம் நெருங்கி வந்தீர்கள்—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘குரல்’ என்பதற்குப் பதிலாக ‘ஒலி’ என்றும் மொழிபெயர்க்கலாம். எபிரெய மொழியில் கோல் (qol) என்ற சொல் இரண்டையும் குறிக்கலாம்; இங்கு இருளிலிருந்து கடவுள் பேசும் சூழலுக்கு ‘குரல்’ மிகவும் பொருந்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כְּשָׁמְעֲכֶם
  choice: நீங்கள் ... கேட்டபோது
  rationale: היה உடன் வரும் כְּ காலத்தொடரை அறிமுகப்படுத்துகிறது. தமிழில் இயல்பாகவும் நிகழ்வின் வரிசையைத் தெளிவாகவும் காட்ட ‘கேட்டபோது’ என்று மொழிபெயர்க்கப்பட்டது.
- source_word: הַקּוֹל
  choice: அந்தக் குரல்
  rationale: קוֹל என்பதற்கு ‘குரல்’ அல்லது ‘ஒலி’ என இரு பொருள்கள் இருக்கலாம். இங்கு கடவுள் பேசிய சூழல் என்பதால் ‘குரல்’ முதன்மைத் தேர்வாகும்; உண்மையான சொற்பொருள் மாற்று அடிக்குறிப்பில் பாதுகாக்கப்பட்டது.
- source_word: מִתּוֹךְ הַחֹשֶׁךְ
  choice: இருளின் நடுவிலிருந்து
  rationale: תּוֹךְ என்பதன் ‘நடு/மத்தி’ என்ற உருவகத்தை விடாமல், நவீன தமிழில் தெளிவாக வழங்குகிறது.
- source_word: וְהָהָר בֹּעֵר בָּאֵשׁ
  choice: மலை நெருப்பில் எரிந்துகொண்டிருக்க
  rationale: வாவ் இங்கு ஒரே நேரத்தில் நிலவிய பின்னணிச் சூழலைக் குறிக்கிறது; בֹּעֵר என்ற பங்கேற்பு வடிவத்தின் தொடர்நிலையை ‘எரிந்துகொண்டிருக்க’ வெளிப்படுத்துகிறது.
- source_word: וַתִּקְרְבוּן אֵלַי
  choice: என்னிடம் நெருங்கி வந்தீர்கள்
  rationale: קרב என்பது அணுகுதல் அல்லது அருகில் வருதல். אֵלַי குறிக்கும் மோசேயை நோக்கிய நகர்வை ‘என்னிடம்’ தெளிவாக்குகிறது.
- source_word: כָּל רָאשֵׁי שִׁבְטֵיכֶם
  choice: உங்கள் கோத்திரங்களின் தலைவர்கள் அனைவரும்
  rationale: רָאשֵׁי என்பதன் தலைமைப் பொருளை இயல்பான தமிழில் ‘தலைவர்கள்’ எனத் தருகிறது; ‘கோத்திரங்கள்’ என்பது இஸ்ரவேலின் சமூக அமைப்பைக் குறிக்கும் நிலைபெற்ற சொல்.
- source_word: וְזִקְנֵיכֶם
  choice: உங்கள் மூப்பர்களும்
  rationale: זְקֵנִים இங்கு வயதானவர்களை மட்டும் அல்லாமல் அங்கீகரிக்கப்பட்ட சமூக மூப்பர்களைக் குறிக்கிறது; ‘மூப்பர்கள்’ அந்தப் பொறுப்புநிலையைப் பாதுகாக்கிறது.
theological_decisions:
- issue: הַקּוֹל என்பது ‘குரல்’ அல்லது ‘ஒலி’ எனப் பொருள்படக்கூடியது
  choice: குரல்
  alternative: ஒலி
  rationale: ஓரேபில் கடவுள் பேசியதாக உடனடி மற்றும் விரிந்த சூழல் காட்டுவதால் ‘குரல்’ பொருத்தமானது. எனினும் எபிரெயச் சொல்லின் சொற்பொருள் அகலத்தை அடிக்குறிப்பு வெளிப்படையாகப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகருக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டது. வசனம் அடுத்த வசனத்தில் தொடரும் வாக்கியம் என்பதால் இறுதியில் நீண்ட கோடு வைக்கப்பட்டுள்ளது. ‘நெருப்பில் எரிந்துகொண்டிருக்க’ என்பது எபிரெயச் சொற்றொடரின் காட்சியையும் தொடர்நிலையையும் பாதுகாக்கிறது.
