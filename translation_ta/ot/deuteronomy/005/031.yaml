base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/031.yaml
  text: But you[a], stand here with me, and I will speak to you all the commandment and the statutes and the judgments that you shall teach them[b], so that they may do them in the land that I am giving them to possess.
translation:
  language: ta
  text: ஆனால், நீ என்னுடன் இங்கே நில். நான் உன்னிடம் முழுக் கட்டளையையும்[a], விதிமுறைகளையும், சட்டத் தீர்ப்புகளையும் சொல்வேன். நீ அவற்றை அவர்களுக்குக் கற்பிக்க வேண்டும்; அவர்கள் அதை உடைமையாக்கிக்கொள்ளும்படி[b] நான் அவர்களுக்குக் கொடுக்கிற நாட்டில், அவர்கள் அவற்றைக் கடைப்பிடிக்க வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் ‘கட்டளை’ என்பது ஒருமையில் உள்ளது; அதைத் தொடர்ந்து ‘விதிமுறைகள்’, ‘சட்டத் தீர்ப்புகள்’ என்பவை பன்மையில் வருகின்றன. ‘கட்டளை முழுவதையும்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது ‘சுதந்தரித்துக்கொள்ளும்படி’ அல்லது ‘கைப்பற்றி உடைமையாக்கிக்கொள்ளும்படி’.
    reason: lexical_alternative
lexical_decisions:
- source_word: פֹּה עֲמֹד עִמָּדִי
  choice: என்னுடன் இங்கே நில்
  rationale: עָמַד என்பதன் நேரடியான ‘நில்’ என்ற பொருளையும், மோசே தேவனுடைய முன்னிலையில் அங்கேயே இருக்க வேண்டும் என்ற கட்டளையின் மாண்பையும் காக்கிறது.
- source_word: וַאֲדַבְּרָה אֵלֶיךָ
  choice: நான் உன்னிடம் ... சொல்வேன்
  rationale: கட்டளைக்குப் பின்வரும் cohortative வடிவின் எதிர்கால-விருப்ப நுணுக்கத்தை இயல்பான தமிழில் தருகிறது.
- source_word: אֵת כָּל הַמִּצְוָה
  choice: கட்டளை முழுவதையும்
  rationale: כָּל என்பதன் முழுமையையும், மִצְוָה என்பதன் ஒருமையையும் தமிழில் இயல்பாகக் காக்கிறது.
- source_word: הַחֻקִּים
  choice: விதிமுறைகள்
  rationale: உடன்படிக்கைச் சட்டச் சூழலில் நிலைநிறுத்தப்பட்ட சட்ட விதிகள் என்ற பொருளைத் தருவதோடு அடுத்த சட்டச் சொல்லிலிருந்து வேறுபடுத்துகிறது.
- source_word: הַמִּשְׁפָּטִים
  choice: சட்டத் தீர்ப்புகள்
  rationale: מִשְׁפָּטִים என்பதில் உள்ள சட்டம், நீதி, தீர்ப்பு ஆகிய தொடர்புகளைத் தக்கவைக்கிறது.
- source_word: אֲשֶׁר תְּלַמְּדֵם
  choice: நீ அவற்றை அவர்களுக்குக் கற்பிக்க வேண்டும்
  rationale: மோசேக்கு அளிக்கப்படும் நேரடியான போதனைப் பொறுப்பை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: וְעָשׂוּ
  choice: அவர்கள் அவற்றைக் கடைப்பிடிக்க வேண்டும்
  rationale: சட்டக் கட்டளைகளை ‘செய்தல்’ என்பது அவற்றைக் கடைப்பிடித்தல் எனத் தமிழில் தெளிவாகவும், இச்சூழலின் கடமை நுணுக்கத்துடனும் கூறப்படுகிறது.
- source_word: אֲשֶׁר אָנֹכִי נֹתֵן לָהֶם
  choice: நான் ... கொடுக்கிற
  rationale: נֹתֵן என்னும் participle-இன் நிகழ்கால அல்லது உடனடி கொடை நுணுக்கத்தைப் பாதுகாக்கிறது.
- source_word: לְרִשְׁתָּהּ
  choice: உடைமையாக்கிக்கொள்ளும்படி
  rationale: வாக்குத்தத்த நாட்டைக் கைப்பற்றி உடைமையாகப் பெறுதல் என்ற יָרַשׁ வினையின் இச்சூழல் பொருளைச் சுருக்கமாகத் தருகிறது.
theological_decisions:
- issue: מִצְוָה / חֻקִּים / מִשְׁפָּטִים என்ற மூன்று சட்டச் சொற்கள்
  choice: ‘கட்டளை’, ‘விதிமுறைகள்’, ‘சட்டத் தீர்ப்புகள்’ என்று வேறுபட்ட சொற்களாக வைத்தல்
  alternative: ‘சட்டங்களும் விதிகளும்’ போன்ற பொதுவான தொகுப்பாகச் சுருக்குதல்
  rationale: மூலத்தில் உள்ள உடன்படிக்கைச் சட்டத்தின் வேறுபட்ட சொற்பரப்பைத் தட்டையாக்காமல் பாதுகாக்கிறது.
- issue: மִצְוָה என்பதன் ஒருமை
  choice: ‘கட்டளை முழுவதையும்’ என்று ஒருமையைப் பேணுதல்
  alternative: ‘எல்லாக் கட்டளைகளையும்’ என்று பன்மையாக்குதல்
  rationale: இச்சொல் தொகுப்புப் பொருளில் இருக்கக்கூடும்; ஆயினும் எபிரெய மூலத்தின் ஒருமையைத் தமிழில் தெளிவாகக் காக்க முடிகிறது.
- issue: וְעָשׂוּ என்பதன் கட்டளை/நோக்கம்/விளைவு நுணுக்கம்
  choice: ‘அவர்கள் அவற்றைக் கடைப்பிடிக்க வேண்டும்’
  alternative: ‘அவர்கள் அவற்றைக் கடைப்பிடிப்பார்கள்’ அல்லது ‘அவர்கள் கடைப்பிடிக்கும்படி’
  rationale: waw உடன் வரும் perfect வடிவம் இச்சூழலில் எதிர்கால விளைவு அல்லது கடமையைச் சுட்டலாம். தமிழில் ‘வேண்டும்’ என்பது உடன்படிக்கைக் கடமையைத் தெளிவாகக் காட்டுகிறது; நிகழ்வை உறுதியான முன்னறிவிப்பாக மட்டும் மாற்றுவதில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. தேவனும் மோசேயும் இடையிலான நேரடி ஒருமை உரையாடலை ‘நீ/உன்’ வடிவில் காக்கிறது. சட்டச் சொற்களின் வேறுபாடும், ‘கட்டளை’ என்பதன் ஒருமையும் பாதுகாக்கப்பட்டுள்ளன.
