  to: ஆனால், நீ என்னுடன் இங்கே நில். நான் உன்னிடம் முழுக் கட்டளையையும்[a], விதிமுறைகளையும், சட்டத் தீர்ப்புகளையும் சொல்வேன். நீ அவற்றை அவர்களுக்குக் கற்பிக்க வேண்டும்; அவர்கள் அதை உடைமையாக்கிக்கொள்ளும்படி[b] நான் அவர்களுக்குக் கொடுக்கிற நாட்டில், அவர்கள் அவற்றைக் கடைப்பிடிக்க வேண்டும்.
