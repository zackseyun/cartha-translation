reference: Deuteronomy 5:10
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וְ/עֹ֥שֶׂה חֶ֖סֶד לַֽ/אֲלָפִ֑ים לְ/אֹהֲבַ֖/י וּ/לְ/שֹׁמְרֵ֥י מצות/ו׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/010.yaml
  text: but showing steadfast love to thousands[a], to those who love me and keep my commandments.
translation:
  language: ta
  text: ஆனால், என்னிடம் அன்புகூர்ந்து அவருடைய கட்டளைகளை[a]க் கடைப்பிடிக்கிற ஆயிரக்கணக்கானோருக்கு மாறாத அன்பைக் காட்டுகிறேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: வழங்கப்பட்ட எபிரெய உரை ‘அவருடைய கட்டளைகள்’ என்று வாசிக்கிறது. சில கையெழுத்துப் பிரதிகளும் மொழிபெயர்ப்புகளும், சுற்றியுள்ள முதல் நபர் பேச்சுக்கு ஏற்றபடி, ‘என்னுடைய கட்டளைகள்’ என்று வாசிக்கின்றன.
    reason: textual_variant
lexical_decisions:
- source_word: וְעֹשֶׂה
  choice: ஆனால் … காட்டுகிறேன்
  rationale: முந்தைய வசனத்திலுள்ள தண்டனைக்கு எதிர்மறையான மாறுபாட்டை וְ இங்கு உணர்த்துகிறது. எபிரெயப் பங்கேற்புவினை தொடர்ச்சியான தெய்வீகச் செயலைக் குறிக்கிறது; முந்தைய முதல் நபர் உரையை இயல்பான தமிழில் தொடர்வதற்காக வினை முதல் நபரில் தரப்பட்டுள்ளது.
- source_word: חֶסֶד
  choice: மாறாத அன்பு
  rationale: חֶסֶד என்பது வெறும் உணர்ச்சியையோ இரக்கத்தையோ மட்டும் அல்லாமல் உறுதியான, உண்மையுள்ள உடன்படிக்கை அன்பையும் குறிக்கிறது. ‘மாறாத அன்பு’ இந்தக் கருத்தை இயல்பான நவீன தமிழில் எடுத்துரைக்கிறது.
- source_word: לַאֲלָפִים
  choice: ஆயிரக்கணக்கானோருக்கு
  rationale: எபிரெய உரையில் ‘ஆயிரங்களுக்கு’ என்றே உள்ளது; ‘தலைமுறைகள்’ என்ற பெயர்ச்சொல் இல்லை. மனிதர்களைக் குறிக்கும் சூழலைத் தமிழில் தெளிவாகவும் இயல்பாகவும் சொல்ல ‘ஆயிரக்கணக்கானோருக்கு’ என மொழிபெயர்க்கப்பட்டுள்ளது; ‘ஆயிரம் தலைமுறைகளுக்கு’ என்பது சேர்க்கப்படவில்லை.
- source_word: לְאֹהֲבַי
  choice: என்னிடம் அன்புகூர்ந்து
  rationale: முதல் நபர் பின்னொட்டுடன் உள்ள பங்கேற்புவினை ‘என்னை நேசிக்கிறவர்கள்’ என்று பொருள்படும். அடுத்த பங்கேற்புவினையோடு இணைந்து இயல்பாக வருவதற்காக ‘என்னிடம் அன்புகூர்ந்து’ எனத் தரப்பட்டுள்ளது.
- source_word: וּלְשֹׁמְרֵי
  choice: கடைப்பிடிக்கிற
  rationale: שׁמר என்பது காத்தல், பேணுதல், கடைப்பிடித்தல் ஆகிய பொருள்களைக் கொண்டது. கட்டளைகளுடன் வரும் போது ‘கடைப்பிடித்தல்’ என்பது துல்லியமும் இயல்பும் வாய்ந்த தமிழ் வழக்கு.
- source_word: מצות/ו
  choice: அவருடைய கட்டளைகளை
  rationale: வழங்கப்பட்ட எபிரெய வடிவிலுள்ள மூன்றாம் நபர் ஆண்பால் ஒருமைப் பின்னொட்டை (‘அவருடைய’) மொழிபெயர்ப்பு அப்படியே பின்பற்றுகிறது. சுற்றியுள்ள முதல் நபர் பேச்சுக்கு ஏற்ற ‘என்னுடைய’ என்ற மாற்று வாசகம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
theological_decisions:
- issue: ‘கட்டளைகள்’ என்பதோடு வரும் உடைமைச் சுட்டுப்பெயர்
  choice: அவருடைய கட்டளைகள்
  alternative: என்னுடைய கட்டளைகள்
  rationale: வழங்கப்பட்ட எபிரெய உரையில் மூன்றாம் நபர் ஒருமைப் பின்னொட்டு உள்ளது; ஆகவே அதன் இலக்கண வடிவம் முதன்மை உரையில் காக்கப்பட்டுள்ளது. உடனடிச் சூழலில் கடவுள் முதல் நபரில் பேசுவதால் ‘என்னுடைய கட்டளைகள்’ என்பது பொருத்தமான மாற்று வாசகமாகத் தோன்றினாலும், அந்த இறையியல் மற்றும் உரைநிலை இழுவை அமைதியாகத் தீர்க்காமல் அடிக்குறிப்பில் தெரிவிக்கப்பட்டுள்ளது.
- issue: לַאֲלָפִים என்பதில் ‘தலைமுறைகள்’ உள்ளதா?
  choice: ஆயிரக்கணக்கானோர்
  alternative: ஆயிரம் தலைமுறைகள் / ஆயிரக்கணக்கான தலைமுறைகள்
  rationale: இவ்வசனத்தின் வழங்கப்பட்ட எபிரெய உரையில் ‘தலைமுறைகள்’ என்ற சொல் வெளிப்படையாக இல்லை. இணை வசனங்களின் விரிவான சொல்லாக்கத்தை இங்கு இறக்குமதி செய்யாமல் உரையின் சுருக்கம் பாதுகாக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘மாறாத அன்பு’ என்பது חֶסֶד-இன் உறுதியான, உண்மையுள்ள அன்பை எடுத்துரைக்கிறது. ‘ஆயிரக்கணக்கானோருக்கு’ என்பது தமிழில் இயல்பாக இருக்கும்போதும், மூலத்தில் இல்லாத ‘தலைமுறைகள்’ என்ற கருத்தைச் சேர்ப்பதில்லை. ‘அவருடைய’ என்ற எதிர்பாராத சுட்டுப்பெயர் அடிக்குறிப்புடன் திட்டமிட்டு பாதுகாக்கப்பட்டுள்ளது.
