base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/011.yaml
  text: You shall not take the name of Yahweh your God in vain[b][a], for Yahweh will not leave unpunished the one who takes his name in vain.
translation:
  language: ta
  text: உன் கடவுளாகிய யாவேயின் பெயரை வீணாகப் பயன்படுத்தக் கூடாது[a]. ஏனெனில், தமது பெயரை வீணாகப் பயன்படுத்துகிறவனை யாவே தண்டிக்காமல் விடமாட்டார்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பொய்மைக்காக,” “முறையற்ற விதத்தில்,” அல்லது “வெறுமையாக.” எபிரெயச் சொல் யாவேயின் பெயரைப் பொய்யாகவோ வெறுமையாகவோ பயன்படுத்துவதையும் உள்ளடக்கக்கூடும்; இது ஒரேவகையான தவறான பயன்பாட்டை மட்டும் குறிப்பதல்ல.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “குற்றமற்றவனாகக் கருதமாட்டார்” அல்லது “விடுவிக்கமாட்டார்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: תִשָּׂא / יִשָּׂא (נשא)
  choice: பயன்படுத்து
  rationale: இந்த வினைச்சொல்லின் அடிப்படைப் பொருள் ‘தூக்கு, சும, ஏந்திக்கொள்’ என்பதாக இருந்தாலும், ‘பெயர்’ என்பதோடு வரும் இச்சொற்றொடரில் தமிழில் சொற்பொருள்படி ‘பெயரை எடு’ என்பது இயல்பாக இல்லை. ‘பயன்படுத்து’ என்பது பொய்யான, வெறுமையான அல்லது முறையற்ற வகையில் பெயரைச் சொல்வது, அழைப்பது, முன்வைப்பது போன்ற பல்வேறு தவறான செயல்களை உள்ளடக்குகிறது.
- source_word: שֵׁם
  choice: பெயர்
  rationale: மூலச்சொல்லின் நேரான பொருளைப் பேணுகிறது; அது நற்பெயர், அதிகாரம் அல்லது அழைக்கப்படும் அடையாளம் ஆகியவற்றையும் உணர்த்தக்கூடும் என்பதால் விளக்கமாகக் குறுக்கப்படவில்லை.
- source_word: יְהוָה
  choice: யாவே
  rationale: தலைப்புப் பெயரால் மாற்றாமல், எபிரெய வேதப்பிரதியில் உள்ள தேவனுடைய தனிப்பெயரைத் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: אֱלֹהֶיךָ
  choice: உன் கடவுள்
  rationale: இரண்டாம் நபர் ஒருமையில் நேரடியாகக் கொடுக்கப்படும் உடன்படிக்கை சார்ந்த அழைப்பைப் பேணுகிறது.
- source_word: לַשָּׁוְא
  choice: வீணாக
  rationale: שָׁוְא என்பதன் வெறுமை, பொய், பயனின்மை, தகாத தன்மை ஆகிய பரந்த பொருள் எல்லையை ஓரளவு திறந்தே வைக்கும் இயல்பான தமிழ் சொல்.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: கட்டளைக்கான காரணத்தைத் தெளிவாக அறிமுகப்படுத்துகிறது.
- source_word: יְנַקֶּה (נקה)
  choice: தண்டிக்காமல் விடமாட்டார்
  rationale: குற்றத்திலிருந்தோ அதன் தண்டனையிலிருந்தோ விடுவிக்கமாட்டார் என்ற நீதித்துறை சார்ந்த பொருளை நவீன தமிழில் தெளிவாகத் தெரிவிக்கிறது.
- source_word: אֲשֶׁר
  choice: …கிறவனை
  rationale: குற்றம் செய்பவரை பொதுவாகக் குறிக்கும் எபிரெய உறவுநிலை அமைப்பை இயல்பான தமிழில் தருகிறது.
- source_word: שְׁמוֹ
  choice: தமது பெயர்
  rationale: இது யாவேயின் சொந்தப் பெயரையே மீண்டும் குறிக்கிறது; மரியாதை ஒருமைத் தற்சுட்டுப் பெயர் தமிழில் இயல்பாக உள்ளது.
theological_decisions:
- issue: יְהוָה என்ற தேவனுடைய பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலவசனம் நான்கெழுத்துத் தனிப்பெயரை நேரடியாகப் பயன்படுத்துகிறது. ‘யாவே’ என்பது அதை ஒரு பட்டப்பெயரால் மாற்றாமல் ஒலிபெயர்த்து, சீனாயில் வெளிப்படுத்தப்பட்ட உடன்படிக்கைப் பெயரைப் பேணுகிறது.
- issue: தடையின் பொருள் எல்லை
  choice: ‘பெயரை வீணாகப் பயன்படுத்து’ என்ற பரந்த சொல்லாக்கம்
  alternative: பெயரைப் பொய்யாணைக்காகப் பயன்படுத்து; பெயரை வீணாக உச்சரி; பெயரைத் தவறாகப் பயன்படுத்து
  rationale: எபிரெயச் சொற்றொடர் பொய்யாணை, வெற்று அழைப்பு, பொய்மையான பிரதிநிதித்துவம் மற்றும் வேறு வகையான முறையற்ற பயன்பாடு ஆகியவற்றை உள்ளடக்கக்கூடும். ஒரே விளக்கமாகக் குறுக்காமல் அந்தப் பொருள் இழுவையை முதன்மை உரை பேணுகிறது.
- issue: יְנַקֶּה என்பதிலுள்ள குற்றம் மற்றும் தண்டனை மொழி
  choice: தண்டிக்காமல் விடமாட்டார்
  alternative: குற்றமற்றவனாகக் கருதமாட்டார்; விடுதலை செய்யமாட்டார்
  rationale: சூழலிலுள்ள நீதித்துறை விளைவைத் தெளிவுபடுத்துகிறது; அதே நேரத்தில் ‘குற்றமற்றவர் என அறிவித்தல்’ என்ற ஒரே தொழில்நுட்ப விளக்கத்துக்குள் பொருளைக் கட்டுப்படுத்தவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், நேரடியான ஒருமைக் கட்டளை நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘பெயரை எடுக்காதே’ என்ற சொற்பொருள் சார்ந்த ஆனால் இயல்பற்ற தமிழையும், ‘உச்சரிக்காதே’ என்ற அளவுக்கு பொருளைக் குறுக்கும் சொல்லையும் தவிர்த்து, புரிந்துகொள்ள எளிதானதும் பொருள் பரப்பைத் திறந்துவைப்பதுமான ‘பயன்படுத்தக் கூடாது’ தேர்ந்தெடுக்கப்பட்டது. தேவனைக் குறிக்கும் வினைமுற்றுகளிலும் தற்சுட்டிலும் மரியாதை ஒருமை பயன்படுத்தப்பட்டுள்ளது.
