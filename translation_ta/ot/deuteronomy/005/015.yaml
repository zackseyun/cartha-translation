source:
  edition: WLC
  text: וְ/זָכַרְתָּ֗ כִּ֣י עֶ֤בֶד הָיִ֨יתָ֙ בְּ/אֶ֣רֶץ מִצְרַ֔יִם וַ/יֹּצִ֨אֲ/ךָ֜ יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ מִ/שָּׁ֔ם בְּ/יָ֥ד חֲזָקָ֖ה וּ/בִ/זְרֹ֣עַ נְטוּיָ֑ה עַל כֵּ֗ן צִוְּ/ךָ֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ לַ/עֲשׂ֖וֹת אֶת י֥וֹם הַ/שַׁבָּֽת־׀־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/015.yaml
  text: And remember that you were a servant in the land of Egypt[a], and Yahweh your God brought you out from there with a strong hand and an outstretched arm[b]; therefore Yahweh your God commanded you to observe the Sabbath day.
translation:
  language: ta
  text: நீ எகிப்து நாட்டில் அடிமையாக இருந்தாய் என்பதையும், உன் கடவுளாகிய யாவே உன்னை அங்கிருந்து வலிமைமிக்க கையாலும் நீட்டப்பட்ட புயத்தாலும் வெளியே கொண்டுவந்தார் என்பதையும் நினைவில் கொள். ஆகவே, ஓய்வுநாளைக் கடைப்பிடிக்கும்படி உன் கடவுளாகிய யாவே உனக்குக் கட்டளையிட்டார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְזָכַרְתָּ
  choice: நினைவில்கொள்
  rationale: இணைப்புடன் வரும் வினை வடிவம் இச்சூழலில் கட்டளை/அறிவுறுத்தல் வலிமை கொண்டது; நவீன தமிழில் இயல்பாக அதைப் பிரதிபலிக்கிறது.
- source_word: עֶבֶד
  choice: அடிமை
  rationale: எகிப்திலிருந்த கட்டுண்ட, ஒடுக்கப்பட்ட நிலையைத் தெளிவாகக் காட்டுகிறது; ‘ஊழியன்’ அல்லது ‘பணியாளர்’ என்பவை அதன் தீவிரத்தைக் குறைக்கும்.
- source_word: בְּאֶרֶץ מִצְרַיִם
  choice: எகிப்து நாட்டில்
  rationale: எபிரேயின் concrete expression-ஐ இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: וַיֹּצִאֲךָ
  choice: வெளியே கொண்டுவந்தார்
  rationale: Hiphil வடிவத்தின் காரணவினைப் பொருளையும் விடுதலைச் சூழலையும் நேரடியாக வெளிப்படுத்துகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: திருநாமத்தை பொதுப்பட்டமான ‘ஆண்டவர்’ என்று மாற்றாமல், மூலத்தின் உடன்படிக்கைப் பெயரை ஒலிபெயர்க்கிறது.
- source_word: בְּיָד חֲזָקָה
  choice: வலிமைமிக்க கையால்
  rationale: சொற்படிமமான ‘கை’யைத் தக்கவைத்து, חזק குறிக்கும் வல்லமையை இயல்பான தமிழில் அளிக்கிறது.
- source_word: וּבִזְרֹעַ נְטוּיָה
  choice: நீட்டப்பட்ட புயத்தால்
  rationale: தெய்வீக வல்லமையைக் குறிக்கும் எபிரேயப் படிமத்தை நேரடியாகத் தக்கவைக்கிறது.
- source_word: עַל כֵּן
  choice: ஆகவே
  rationale: விடுதலையையும் ஓய்வுநாள் கட்டளையையும் இணைக்கும் காரணவிளைவு உறவைத் தெளிவாகக் காட்டுகிறது.
- source_word: לַעֲשׂוֹת אֶת יוֹם הַשַּׁבָּת
  choice: ஓய்வுநாளைக் கடைப்பிடிக்கும்படி
  rationale: சொற்படி ‘ஓய்வுநாளைச் செய்ய’ என்பது தமிழில் இயல்பல்ல; இச்சொற்றொடரின் வழக்குப்பொருளான அனுசரித்தல்/காத்தல் என்பதை ‘கடைப்பிடி’ தெளிவாக வழங்குகிறது.
theological_decisions:
- issue: יְהוָה என்ற திருநாமத்தின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூலத்தில் தனிப்பட்ட திருநாமம் நேரடியாக உள்ளது; அதனைப் பொதுப் பட்டமாக மாற்றாமல் தமிழில் ஒலிபெயர்த்துள்ளது.
- issue: எகிப்தில் இஸ்ரவேலரின் עֶבֶד நிலை
  choice: அடிமை
  alternative: ஊழியன்
  rationale: வசனத்தின் விடுதலை மற்றும் ஓய்வு குறித்த நெறியியல்-இறையியல் வலிமை கட்டாய அடிமை நிலையையே சார்ந்துள்ளது.
- issue: לַעֲשׂוֹת אֶת יוֹם הַשַּׁבָּת என்பதன் பொருள்
  choice: ஓய்வுநாளைக் கடைப்பிடிக்க
  alternative: ஓய்வுநாளைச் செய்ய
  rationale: எபிரேய மொழிவழக்கை மரத்தனமாக மொழிபெயர்க்காமல் அதன் கட்டளைப் பொருளைத் தெளிவாகவும் பிரிவுசார் விளக்கமின்றியும் தருகிறது.
translation_notes:
  register: நவீன தரத் தமிழ்; ஒருமை இரண்டாம் நபர் வடிவங்கள் மூலத்தின் 2ms முகவரியைத் தக்கவைக்கின்றன. மொழிநடை மரியாதையும் தெளிவும் உடையது; தேவையற்ற பழமொழிநடை தவிர்க்கப்பட்டுள்ளது. ‘புயம்’ என்ற சொல் மூலத்தின் கை/புயம் படிம வேறுபாட்டைத் தக்கவைக்கப் பயன்படுத்தப்பட்டுள்ளது.
