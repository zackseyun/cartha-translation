source:
  edition: WLC
  text: שָׁמ֛וֹר אֶת י֥וֹם הַ/שַׁבָּ֖ת לְ/קַדְּשׁ֑/וֹ כַּ/אֲשֶׁ֥ר צִוְּ/ךָ֖ יְהוָ֥ה אֱלֹהֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/012.yaml
  text: Observe the Sabbath day[a], to keep it holy, as Yahweh your God commanded you.
translation:
  language: ta
  text: ஓய்வுநாளைப் புனிதமாகக் காத்துக்கொள்ளும்படி கடைப்பிடி; உன் கடவுளாகிய யாவே உனக்குக் கட்டளையிட்டபடியே.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஓய்வுநாளைக் காத்துக்கொள்” அல்லது “ஓய்வுநாளைக் கடைப்பிடி.” எபிரெய வினைச்சொல் கவனமாகக் காத்து அனுசரிப்பதை வலியுறுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמוֹר
  choice: கடைப்பிடி
  rationale: கால் வினையின் வலியுறுத்தல் வடிவம் இங்கு கட்டளையாகச் செயல்படுகிறது. ‘கடைப்பிடி’ என்பது கட்டளையை கவனத்துடன் அனுசரித்து நடப்பதை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது; யாத்திராகமம் 20:8-இன் ‘நினைவில் கொள்’ என்பதிலிருந்து உள்ள சொல் வேறுபாட்டையும் காக்கிறது.
- source_word: יוֹם הַשַׁבָּת
  choice: ஓய்வுநாள்
  rationale: குறிப்பிட்ட சபாத் நாளைக் குறிக்கும் இயல்பான, பரவலாகப் புரிந்துகொள்ளப்படும் தமிழ்ச் சொல்.
- source_word: לְקַדְּשׁוֹ
  choice: அதைப் புனிதமாக வைத்திருக்கும்படி
  rationale: לְ முன்னொட்டு நோக்கத்தை வெளிப்படுத்துகிறது. இச்சொற்றொடர் அந்த நாளைத் தனியே பிரிக்கப்பட்ட புனித நாளாக நடத்த வேண்டும் என்பதைக் காட்டுகிறது; மனிதர் அதற்கு உள்ளார்ந்த புனிதத்தை உருவாக்குகிறார் என்ற தவறான எண்ணத்தைத் தவிர்க்கிறது.
- source_word: כַּאֲשֶׁר
  choice: கட்டளையிட்டபடியே
  rationale: முன்னர் கொடுக்கப்பட்ட இறைக் கட்டளைக்கு ஏற்பச் செய்வதைக் குறிக்கும் இயல்பான தமிழ் அமைப்பு.
- source_word: צִוְּךָ
  choice: உனக்குக் கட்டளையிட்ட
  rationale: צוה என்பதன் அதிகாரபூர்வமான கட்டளைப் பொருளையும் இரண்டாம் நபர் ஒருமையையும் காக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தலைப்புச் சொல்லால் மாற்றாமல், எபிரெயத் திருப்பெயரான יהוה-ஐ தமிழில் ஒலிபெயர்க்கிறது.
- source_word: אֱלֹהֶיךָ
  choice: உன் கடவுள்
  rationale: இரண்டாம் நபர் ஆண்பால் ஒருமை உடைமைப் பின்னொட்டைக் கொண்ட உடன்படிக்கைச் சொல்லாட்சியை இயல்பான தமிழில் தருகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: ஆண்டவர் / யெகோவா
  rationale: மூல வசனம் திருப்பெயரை நேரடியாகப் பயன்படுத்துவதால், அதை ஒரு பட்டத்தால் மாற்றாமல் தமிழில் ஒலிபெயர்ப்பது உடன்படிக்கையின் தனிப்பட்ட இறைப் பெயரைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், ஒருமை நேரடிக் கட்டளை நடையில் அமைக்கப்பட்டுள்ளது. ‘புனிதமாக வைத்திருக்கும்படி’ என்பது நோக்கத்தையும் நாளைத் தனியே பிரித்து நடத்தும் கருத்தையும் தெளிவாக்குகிறது.
