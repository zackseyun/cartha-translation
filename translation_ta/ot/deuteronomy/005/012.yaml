- from: உன் கடவுளாகிய யாவே உனக்குக் கட்டளையிட்டபடியே, ஓய்வுநாளைப் புனிதமாக வைத்திருக்கும்படி அதைக் கடைப்பிடி.[a]
  to: ஓய்வுநாளைப் புனிதமாகக் காத்துக்கொள்ளும்படி கடைப்பிடி; உன் கடவுளாகிய யாவே உனக்குக் கட்டளையிட்டபடியே.[a]
  rationale: 'The revision improves idiomatic Tamil while preserving each element of the Hebrew: an imperative to observe the Sabbath, the purpose of keeping it holy, and the comparison with Yahweh''s previous command. The word order now also follows the source more closely. No doctrinal interpretation has been added.'
