revisions:
- from: உங்கள் கடவுளாகிய யாவே உங்களுக்குக் கட்டளையிட்ட வழி முழுவதிலும் நடங்கள். அப்போது நீங்கள் வாழ்வீர்கள்; உங்களுக்கு நன்மை உண்டாகும்; நீங்கள் உரிமையாக்கிக்கொள்ளப்போகும்[a] நாட்டில் உங்கள் வாழ்நாள் நீடிக்கும்.
