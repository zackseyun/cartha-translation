source:
  edition: WLC
  text: בְּ/כָל הַ/דֶּ֗רֶךְ אֲשֶׁ֨ר צִוָּ֜ה יְהוָ֧ה אֱלֹהֵי/כֶ֛ם אֶתְ/כֶ֖ם תֵּלֵ֑כוּ לְמַ֤עַן תִּֽחְיוּ/ן֙ וְ/ט֣וֹב לָ/כֶ֔ם וְ/הַאֲרַכְתֶּ֣ם יָמִ֔ים בָּ/אָ֖רֶץ אֲשֶׁ֥ר תִּֽירָשֽׁוּ/ן־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/033.yaml
  text: You shall walk in all the way that Yahweh your God has commanded you[a], so that you may live, and that it may go well with you, and that you may prolong your days in the land that you will possess.
translation:
  language: ta
  text: உங்கள் கடவுளாகிய யாவே உங்களுக்குக் கட்டளையிட்ட வழி முழுவதிலும் நடங்கள்; நீங்கள் வாழவும், உங்களுக்கு நன்மை உண்டாகவும், நீங்கள் உரிமையாகப் பெறும் நாட்டில் நீண்ட நாட்கள் வாழவும் அவ்வாறே நடங்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘சுதந்தரித்துக்கொள்ளும்.’ எபிரேய வினைச்சொல் உரிமையாகப் பெறுதல், சுதந்தரித்துக்கொள்ளுதல் ஆகிய இரு பொருள்களையும் தரக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּכָל הַדֶּרֶךְ
  choice: வழி முழுவதிலும்
  rationale: எபிரேய ஒருமையான ‘வழி’ என்பதைக் காத்து, கடவுள் வகுத்த வாழ்க்கை நெறி என்ற உடன்படிக்கை உருவகத்தை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: צִוָּה
  choice: கட்டளையிட்ட
  rationale: ஏற்கெனவே கொடுக்கப்பட்டு தொடர்ந்து நடைமுறையில் இருக்கும் கட்டளையைக் குறிக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரேய மூலத்தில் நேரடியாக வரும் கடவுளின் உடன்படிக்கைப் பெயரைத் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: אֱלֹהֵיכֶם
  choice: உங்கள் கடவுள்
  rationale: இரண்டாம் நபர் பன்மையிலுள்ள உடன்படிக்கை உறவைத் தெளிவாகக் காக்கிறது.
- source_word: תֵּלֵכוּ
  choice: நடங்கள்
  rationale: நடத்தை மற்றும் கீழ்ப்படிதலைக் குறிக்கும் எபிரேய ‘நடத்தல்’ உருவகத்தைத் தக்கவைக்கிறது; கட்டளைத் தொனியையும் நேரடியாக வெளிப்படுத்துகிறது.
- source_word: לְמַעַן
  choice: அப்போது
  rationale: கீழ்ப்படிதலைத் தொடர்ந்து வரும் நோக்கம் மற்றும் விளைவு ஆகிய இரண்டிற்கும் இடமளிக்கும் வகையில் இயல்பான தமிழில் இணைக்கிறது.
- source_word: תִּחְיוּן
  choice: நீங்கள் வாழ்வீர்கள்
  rationale: வாழ்வு என்ற நேரடிப் பொருளை உடன்படிக்கை ஆசீர்வாதத்தின் சூழலில் இயல்பாக வழங்குகிறது.
- source_word: וְטוֹב לָכֶם
  choice: உங்களுக்கு நன்மை உண்டாகும்
  rationale: நலன், செழிப்பு ஆகியவற்றை உள்ளடக்கும் எபிரேயச் சொல்லாட்சியை மிகைப்படுத்தாமல் தெரிவிக்கிறது.
- source_word: וְהַאֲרַכְתֶּם יָמִים
  choice: உங்கள் வாழ்நாள் நீடிக்கும்
  rationale: ‘நாட்களை நீட்டித்தல்’ என்ற எபிரேய மரபுத்தொடரின் உருவத்தை ஓரளவு காத்தபடியே இயல்பான தமிழில் நீண்ட ஆயுளைக் குறிக்கிறது.
- source_word: בָּאָרֶץ
  choice: நாட்டில்
  rationale: உடன்படிக்கையில் வாக்களிக்கப்பட்ட நிலப்பரப்பைக் குறிக்கும் சூழலுக்கு இயல்பான தமிழ் சொல்.
- source_word: תִּירָשׁוּן
  choice: உரிமையாக்கிக்கொள்ளப்போகும்
  rationale: ירשׁ என்பதிலுள்ள கைப்பற்றிப் பெற்றுக்கொள்ளுதல் மற்றும் உரிமையாகப் பெறுதல் ஆகிய பொருள் பரப்பைத் திறந்தவாறு வைக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற கடவுளின் பெயர்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் பொதுப்பட்டப்பெயர் அல்ல, தனிப்பட்ட உடன்படிக்கைப் பெயரே இடம்பெறுவதால் அதை ஒலிபெயர்த்து வழங்குகிறது.
- issue: ירשׁ என்பதன் நில உரிமைப் பொருள்
  choice: உரிமையாக்கிக்கொள்ளப்போகும் நாடு
  alternative: சுதந்தரித்துக்கொள்ளப்போகும் நாடு
  rationale: இஸ்ரவேல் நாட்டைப் பெற்று அதில் குடியேறுவதைக் காட்டும் konkreட்டான பொருளைக் காக்கிறது; அதேவேளை வாரிசுரிமை நிழற்பொருள் மாற்றுவாசிப்பாக அடிக்குறிப்பில் தரப்படுகிறது.
- issue: கீழ்ப்படிதலுக்கும் ஆசீர்வாதங்களுக்கும் உள்ள தொடர்பு
  choice: ‘அப்போது’ என நோக்கம்/விளைவு தொடர்பைத் திறந்தவாறு வைத்தல்
  alternative: ‘அதனால்’ என விளைவை மட்டும் வலியுறுத்துதல்
  rationale: לְמַעַן நோக்கத்தையும் எதிர்பார்க்கப்படும் விளைவையும் குறிக்கக்கூடும்; வசனம் தீர்க்காத இறையியல் நுணுக்கத்தை மொழிபெயர்ப்பு ஒருதலைப்பட்சமாகத் தீர்ப்பதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையுடனும் பொதுவாசகர்களுக்குப் புரியும் வகையிலும் மொழிபெயர்க்கப்பட்டுள்ளது. ஒருமையான ‘வழி’ உருவகம், பன்மை முகவரி, கட்டளைத் தொனி ஆகியவை காக்கப்பட்டுள்ளன; தொடர்ச்சியான ஆசீர்வாதங்கள் தெளிவுக்காக அரைப்புள்ளிகளால் பிரிக்கப்பட்டுள்ளன.
