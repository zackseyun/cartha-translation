base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/003.yaml
  text: It was not with our fathers that Yahweh made this covenant[a], but with us—with us[c][b] who are all here alive today.
translation:
  language: ta
  text: யாவே இந்த உடன்படிக்கையை[b] நம் தந்தையருடன்[a] செய்யவில்லை[c]; நம்முடன்தான்—இன்று இங்கே உயிருடன் இருக்கும் நம் அனைவருடன்தான்—செய்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘நம் முன்னோர்களுடன்.’ எபிரெயத்தில் நேரடியாக ‘நம் தந்தையருடன்’ என்று உள்ளது.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில் நேரடியாக, ‘இந்த உடன்படிக்கையை வெட்டினார்.’
    reason: lexical_alternative
  - marker: c
    text: இந்த முரண்பாட்டைச் சிலர், ‘நம் தந்தையருடன் மட்டும் அல்ல; இன்று இங்கே உயிருடன் இருக்கும் நம்முடனும் குறிப்பாகச் செய்தார்’ என்ற வலியுறுத்தலாகப் புரிந்துகொள்கிறார்கள்.
    reason: alternative_reading
lexical_decisions:
- source_word: כָּרַת ... אֶת הַבְּרִית
  choice: உடன்படிக்கையைச் செய்தார்
  rationale: எபிரெய மொழியின் நேரடிப் பொருள் ‘உடன்படிக்கையை வெட்டினார்’ என்பதாக இருந்தாலும், தமிழில் ‘உடன்படிக்கை செய்தார்’ என்பது அதே பொருளை இயல்பாகவும் தெளிவாகவும் தெரிவிக்கிறது. ‘இந்த’ என்பது הַזֹּאת என்ற சுட்டுச்சொல்லைப் பாதுகாக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைப்பெயரான நான்கெழுத்துப் பெயரை ஒரு பட்டமாக மாற்றாமல், தமிழில் அதன் பரவலாக ஏற்கப்படும் ஒலிபெயர்ப்பான ‘யாவே’ என்று வழங்குகிறது.
- source_word: אֲבֹתֵינוּ
  choice: நம் தந்தையர்
  rationale: எபிரெயச் சொல் நேரடியாக ‘நம் தந்தையர்’ என்று கூறுவதால், பொதுவான ‘முன்னோர்’ என்பதை முதன்மை உரையில் பயன்படுத்தாமல் மூலச்சொல்லின் வடிவம் காக்கப்படுகிறது.
- source_word: כִּי
  choice: ; நம்மோடுதான்
  rationale: முந்தைய மறுப்புக்கு எதிரான வலியுறுத்தலைத் தமிழில் அரைப்புள்ளியும் ‘-தான்’ விகுதியும் இயல்பாக வெளிப்படுத்துகின்றன.
- source_word: אִתָּנוּ אֲנַחְנוּ אֵלֶּה
  choice: நம்மோடுதான்—… நம் அனைவரோடும்தான்
  rationale: ‘நம்மோடு, நாம், இவர்கள்’ என்ற எபிரெய வலியுறுத்தல் அமைப்பைச் சொற்சொல்லாகத் தமிழில் கொடுத்தால் செயற்கையாக இருக்கும். மீண்டும் வரும் ‘-தான்’ மற்றும் இடைக்கோடு அந்த வலியுறுத்தலைப் பாதுகாக்கின்றன.
- source_word: פֹה הַיּוֹם כֻּלָּנוּ חַיִּים
  choice: இன்று இங்கே உயிரோடிருக்கிற நம் அனைவரும்
  rationale: ‘இன்று’, ‘இங்கே’, ‘அனைவரும்’, ‘உயிரோடு’ ஆகிய எல்லாக் கூறுகளையும் இயல்பான தமிழ் வரிசையில் முழுமையாக வழங்குகிறது.
theological_decisions:
- issue: இந்த வசனம் முன்னோர்களுக்கு உடன்படிக்கையுடன் எந்தத் தொடர்பும் இல்லை என்று முற்றிலும் மறுக்கிறதா, அல்லது தற்போதைய தலைமுறைக்கான அதன் நேரடிப் பொருத்தத்தை வலியுறுத்துகிறதா?
  choice: ‘நம் தந்தையரோடு செய்யவில்லை; நம்மோடுதான் … செய்தார்’ என்ற மூலமொழியின் நேரடியான முரண்பாடு முதன்மை உரையில் காக்கப்பட்டது.
  alternative: ‘நம் தந்தையரோடு மட்டும் அல்ல’ அல்லது ‘குறிப்பாக நம்மோடும்’ என்று விளக்கிப் பொருள் கொள்ளலாம்.
  rationale: எபிரெய உரையில் ‘மட்டும்’ என்று வரம்பிடும் சொல் இல்லை. ஆகவே இறையியல் பதற்றத்தைத் தீர்த்து எழுதாமல், மாற்றுப் புரிதல் அடிக்குறிப்பில் மட்டும் குறிப்பிடப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் அதேவேளையில் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘நம்மோடுதான்’ என்பது பேச்சுத் தமிழுக்கு மட்டும் உரியதாக இல்லாமல் இங்கு வலியுறுத்தலை இயல்பாகத் தருகிறது; ‘உயிரோடிருக்கிற’ என்பது தற்போதைய உயிருள்ள தலைமுறையைத் தெளிவாகக் குறிக்கிறது.
