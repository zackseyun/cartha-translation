base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/024.yaml
  text: And you said, ‘Look, the LORD our God has shown us his glory and his greatness, and we have heard his voice from the midst of the fire. This day we have seen that God may speak with man, and he still lives.’
translation:
  language: ta
  text: நீங்கள், ‘இதோ, நம் கடவுளாகிய ஆண்டவர் தமது மகிமையையும் மேன்மையையும் நமக்குக் காட்டியிருக்கிறார்; நெருப்பின் நடுவிலிருந்து அவருடைய குரலையும் நாம் கேட்டோம். கடவுள் மனிதனோடு பேசுகிறார்; மனிதன் உயிரோடிருக்கிறான் என்பதை இன்று கண்டோம்’ என்று சொன்னீர்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: ஆண்டவர்
  rationale: தேவநாமத்தைத் தமிழில் வழக்கமான மரியாதைமிக்க அடையாளப் பெயரால் வழங்குகிறது; பெயரின் தனித்துவத்தை ‘கடவுளாகிய ஆண்டவர்’ என்ற தொடரில் காக்கிறது.
- source_word: כְּבוֹדוֹ
  choice: தமது மகிமை
  rationale: כבוד என்பதன் தெய்வீக ஒளிமை, மாட்சிமை, கனத்துவம் ஆகிய கருத்துகளை இயல்பான வேதாகமத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: גָּדְלוֹ
  choice: மேன்மை
  rationale: இங்கு கடவுளின் பெருமையையும் உயர்வையும் குறிக்கிறது; ‘மகிமை’ என்பதுடன் தேவையற்ற ஒத்தசொல் மறுபடியைத் தவிர்க்கிறது.
- source_word: מִתּוֹךְ הָאֵשׁ
  choice: நெருப்பின் நடுவிலிருந்து
  rationale: எபிரேய இடவியல் சொல்லமைப்பைத் தெளிவாகவும் இயல்பாகவும் பிரதிபலிக்கிறது.
- source_word: אֶת־הָאָדָם
  choice: மனிதனோடு
  rationale: אֶת இங்கு உரையாடலின் தொடர்பைக் குறிக்கும் ‘உடன்/ஓடு’ பொருளில் உள்ளது; குறிப்பிட்ட ஓர் ஆணை அல்ல, மனிதரைப் பொதுவாகக் குறிக்கிறது.
- source_word: וָחָי
  choice: அவன் உயிரோடிருக்க முடியும்
  rationale: சொல்லடியாக ‘அவன் வாழ்ந்தான்/உயிரோடிருந்தான்’; சூழலில் கடவுள் பேசுவதைக் கேட்டும் மனிதன் உயிர் பிழைக்க முடியும் என்ற வியப்பை இயல்பான தமிழில் தருகிறது.
theological_decisions:
- issue: கடவுள் மனிதனோடு பேசுவதற்கும் மனிதன் உயிர்வாழ்வதற்கும் இடையிலான தொடர்பு
  choice: ‘கடவுள் மனிதனோடு பேசினாலும் அவன் உயிரோடிருக்க முடியும்’
  alternative: ‘கடவுள் மனிதனோடு பேசுகிறார், அவன் உயிரோடிருக்கிறான்’
  rationale: כִּי יְדַבֵּר ... וָחָי என்ற வாக்கியம் நிகழ்ந்த சம்பவத்திலிருந்து கண்டறியப்பட்ட சாத்தியத்தை அல்லது ஆச்சரியமான உண்மையைச் சுட்டலாம். ‘பேசினாலும்’ எதிர்பாராத உயிர்பிழைப்பை வெளிப்படுத்துகிறது; ‘முடியும்’ பொதுவான சாத்தியத்தைத் தருகிறது, ஆனால் முழுமையான கோட்பாட்டுத் தீர்வைச் சேர்ப்பதில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழ்; பொதுவாசகர்களுக்குப் புரியும் வகையில் இயல்பாகவும், உரையின் பயபக்தியும் வியப்பும் குன்றாத வகையில் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது.
