base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/005.yaml
  text: I was standing between Yahweh and you at that time[a], to declare to you the word of Yahweh, because you were afraid because of the fire and did not go up the mountain, saying,
translation:
  language: ta
  text: 'அந்த நேரத்தில் யாவேக்கும் உங்களுக்கும் இடையில் நான் நின்றுகொண்டிருந்தேன்; யாவேயின் வார்த்தையை உங்களுக்கு அறிவிப்பதற்காக. ஏனெனில் நீங்கள் நெருப்பினால் பயந்து[a] மலையின்மேல் ஏறவில்லை. யாவே கூறினார்:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் எழுத்துப்படி, “நெருப்பின் முகம்/முன்னிலையிலிருந்து”; இது நெருப்பினால் ஏற்பட்ட பயத்தைக் குறிக்கும் மொழிமரபு.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָנֹכִי עֹמֵד
  choice: நான் ... நின்று
  rationale: தனிப்பெயர் வலியுறுத்தலையும், கடந்தகாலச் சூழலில் மோசே வகித்துக்கொண்டிருந்த இடைநிலைப் பங்கையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: בֵּין יְהוָה וּבֵינֵיכֶם
  choice: யாவேக்கும் உங்களுக்கும் இடையில்
  rationale: இரு தரப்பினருக்கிடையிலான மோசேயின் மத்தியஸ்த நிலையை நேரடியாகப் பாதுகாக்கிறது; தெய்வீகப் பெயர் ஒலிபெயர்க்கப்படுகிறது.
- source_word: בָּעֵת הַהִוא
  choice: அந்த நேரத்தில்
  rationale: ஓரேபில் நிகழ்ந்த குறிப்பிட்ட தருணத்தைக் குறிக்கும் இயல்பான நவீனத் தமிழ் காலச் சொற்றொடர்.
- source_word: לְהַגִּיד לָכֶם
  choice: உங்களுக்கு அறிவித்தேன்
  rationale: நגד என்பதன் ஹிப்இல் வடிவிலுள்ள தெரிவிக்கும் செயலைக் கண்ணியமான, தெளிவான தமிழில் தருகிறது; தமிழின் முதன்மை வினை அமைப்புக்கேற்ப மாற்றப்பட்டுள்ளது.
- source_word: אֶת דְּבַר יְהוָה
  choice: யாவேயின் வார்த்தையை
  rationale: தெய்வீக உரை அல்லது செய்தி என்ற பொருளைத் தரும் பரிச்சயமான வேதாகமச் சொல்லாட்சியைப் பாதுகாக்கிறது.
- source_word: כִּי יְרֵאתֶם
  choice: ஏனெனில் நீங்கள் ... பயந்து
  rationale: כִּי என்பதன் காரணத் தொடர்பையும், மக்களின் அச்சத்தையும் இயல்பான தமிழ் வாக்கிய அமைப்பில் காட்டுகிறது.
- source_word: מִפְּנֵי הָאֵשׁ
  choice: நெருப்பின் முன்னிலையைக் கண்டு
  rationale: மொழிமரபின் காரணப்பொருளைத் தெளிவாக்குவதோடு, ‘முகம்/முன்னிலை’ என்ற எபிரெய உருவகத்தின் சுவடையும் பாதுகாக்கிறது.
- source_word: וְלֹא עֲלִיתֶם בָּהָר
  choice: மலையின்மேல் ஏறவில்லை
  rationale: மலையை ஏறிச் செல்லாத செயலைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: לֵאמֹר
  choice: 'அவர் சொன்னது:'
  rationale: அடுத்த வசனத்தில் தொடங்கும் யாவேயின் நேரடி உரையைத் தெளிவாக அறிமுகப்படுத்துகிறது; எபிரெயச் சொற்றொடரின் பேச்சு-அறிமுகப் பணியைத் தமிழில் இயல்பாக மாற்றுகிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் உள்ள உடன்படிக்கைப் பெயரைப் பட்டப்பெயராக மாற்றாமல் ஒலிபெயர்த்து, உரையின் தனிப்பெயர் இயல்பைப் பாதுகாக்கிறது.
- issue: மோசேயின் இடைநிலைப் பங்கு
  choice: யாவேக்கும் உங்களுக்கும் இடையில் நின்று
  alternative: மத்தியஸ்தராக நின்று
  rationale: ‘மத்தியஸ்தர்’ என்ற விளக்கமான இறையியல் சொல்லைச் சேர்க்காமல், மூலத்தின் இடவியல் மொழியையும் அதன் இறையியல் பதற்றத்தையும் அப்படியே வைத்திருக்கிறது.
- issue: לֵאמֹר என்பதன் மறைமுக எழுவாய்
  choice: 'அவர் சொன்னது:'
  alternative: 'என்று:'
  rationale: அடுத்துவரும் தெய்வீக உரையை நவீன தமிழில் தெளிவாக இணைக்கிறது. எபிரெயத்தில் எழுவாய் வெளிப்படையாக இல்லாததால், இது சூழலிலிருந்து நிரப்பப்பட்டதென கவனத்தில் கொள்ளப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. எபிரெயச் சொற்றொடரின் நீளத்தைத் தமிழில் இயல்பாகப் பிரித்தாலும், காரணத் தொடர்பும் மோசேயின் இடைநிலை நிலையும் அடுத்த வசனத்துக்கான உரை அறிமுகமும் பாதுகாக்கப்பட்டுள்ளன.
