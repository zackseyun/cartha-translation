base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/018.yaml
  text: And you shall not commit adultery[a].
translation:
  language: ta
  text: மேலும், நீ விபசாரம் செய்யாதே.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, இன்னும் சுருக்கமாக, “விபசாரம் செய்யாதே.” எபிரெய மூலத்தில் இக்கட்டளையைச் சுற்றியுள்ள கட்டளைகளுடன் இணைக்கும் ஓர் இணைப்புச்சொல் (“மேலும்/மற்றும்”) உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/לֹא
  choice: மேலும் ... செய்யாதே
  rationale: வாவ் இணைப்புச்சொல் இக்கட்டளையை முந்தைய கட்டளைகளுடன் தொடர்ச்சியாக இணைப்பதால் “மேலும்” என்று வெளிப்படுத்தப்பட்டுள்ளது. לֹא என்பதன் தடைப்பொருள் நவீன தமிழில் நேரடியான “செய்யாதே” வடிவில் தரப்பட்டுள்ளது.
- source_word: תִּנְאָף
  choice: நீ விபசாரம் செய்யாதே
  rationale: נאף வினையின் Qal imperfect இரண்டாம் நபர் ஆண்பால் ஒருமை வடிவம் இங்கு நேரடியான தடைக் கட்டளையாகச் செயல்படுகிறது. திருமண நம்பிக்கையை மீறும் பாலுறவைக் குறிக்கும் இவ்வினைக்கு “விபசாரம் செய்” என்பது துல்லியமும் பொதுவாகப் புரிந்துகொள்ளத்தக்கதுமான தமிழ் இணை.
theological_decisions:
- issue: உடன்படிக்கைச் சட்டத்தில் இரண்டாம் நபர் ஒருமைத் தடையை மொழிபெயர்த்தல்
  choice: மேலும், நீ விபசாரம் செய்யாதே.
  alternative: விபசாரம் செய்யாதே.
  rationale: “நீ” என்பது எபிரெய மூலத்தின் ஒருமை நேரடி அழைப்பைத் தெளிவாக்குகிறது; “செய்யாதே” கட்டளையின் தடை வலிமையை இயல்பான நவீன தமிழில் காக்கிறது. தொடக்கத்திலுள்ள “மேலும்” எபிரெய இணைப்புச்சொல்லையும் கட்டளைகளின் தொடர்ச்சியையும் பிரதிபலிக்கிறது.
translation_notes:
  register: நவீன செந்தமிழ் வழக்கில், சாதாரண வாசகர்களுக்குப் புரியும் வகையில் நேரடியும் கண்ணியமுமான கட்டளைநடை பயன்படுத்தப்பட்டுள்ளது. “விபசாரம்” சட்ட மற்றும் திருமணச் சூழலுக்குரிய குறிப்பான பொருளைத் தக்கவைக்கிறது.
