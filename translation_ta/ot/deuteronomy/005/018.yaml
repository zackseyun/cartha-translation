  source_fidelity: The draft accurately renders וְלֹא as an additive sequential conjunction plus prohibition, and תִנְאָף as the prohibition against adultery. The singular direct address is appropriately represented by “நீ.”
  naturalness: “மேலும், நீ விபசாரம் செய்யாதே” is clear, dignified modern Tamil command language. Although “மேலும்” is somewhat more explicitly additive than a bare Tamil coordinator, it suitably conveys the Hebrew waw in the Decalogue sequence.
  terminology: “விபசாரம்” is the established, precise Tamil term for adultery and preserves the marital-covenantal sense of נאף. “செய்யாதே” naturally conveys the prohibitive legal force without archaic phrasing.
