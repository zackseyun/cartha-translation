reference: Deuteronomy 5:32
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וּ/שְׁמַרְתֶּ֣ם לַ/עֲשׂ֔וֹת כַּ/אֲשֶׁ֥ר צִוָּ֛ה יְהוָ֥ה אֱלֹהֵי/כֶ֖ם אֶתְ/כֶ֑ם לֹ֥א תָסֻ֖רוּ יָמִ֥ין וּ/שְׂמֹֽאל׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/032.yaml
  text: So be careful to do just as Yahweh your God has commanded you[a]; do not turn aside to the right or to the left.
translation:
  language: ta
  text: ஆகவே, உங்கள் கடவுளாகிய யாவே உங்களுக்குக் கட்டளையிட்டபடியே செய்யக் கவனமாயிருங்கள்; வலப்புறமோ இடப்புறமோ விலகாதீர்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “வலப்புறமோ இடப்புறமோ விலகாதீர்கள்” என்பது, கடவுள் கட்டளையிட்டதிலிருந்து எந்த வகையிலும் பிறழாதீர்கள் என்று பொருள்படும் எபிரெய மரபுத்தொடர்.
    reason: cultural_note
lexical_decisions:
- source_word: וּ/שְׁמַרְתֶּם
  choice: கவனமாயிருங்கள்
  rationale: שׁמר என்பதுடன் நோக்கத்தைக் குறிக்கும் வினையெச்சம் வரும்போது, வெறுமனே காப்பதையல்ல, கீழ்ப்படிந்து செயல்படுவதற்கான கவனத்தைக் குறிக்கிறது.
- source_word: לַ/עֲשׂוֹת
  choice: செய்ய
  rationale: עשה இங்கு கொடுக்கப்பட்ட கட்டளைகளை நடைமுறைப்படுத்துவதைக் குறிக்கிறது; எபிரெயச் சொல்லின் எளிமையையும் செயற்பாட்டு வலிமையையும் இது காக்கிறது.
- source_word: כַּ/אֲשֶׁר
  choice: கட்டளையிட்டபடியே
  rationale: כַּאֲשֶׁר, தெய்வீகக் கட்டளைக்கு முழுமையாக ஒத்துச் செயல்படுவதைச் சுட்டுகிறது; ‘படியே’ அந்தத் துல்லியமான ஒத்திசைவை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: צִוָּה
  choice: கட்டளையிட்ட
  rationale: முன்பே வழங்கப்பட்டும் தொடர்ந்து கடமையாக இருக்கும் கட்டளையைத் தமிழ் உறவெச்ச வடிவம் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரான நான்கெழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், அதன் பரவலான தமிழ் ஒலிபெயர்ப்பான ‘யாவே’ என்று வழங்குகிறது.
- source_word: אֱלֹהֵי/כֶם
  choice: உங்கள் கடவுளாகிய
  rationale: இரண்டாம் நபர் பன்மை உடைமைப் பின்னொட்டையும் உடன்படிக்கை உறவையும் தெளிவாகக் காட்டுகிறது.
- source_word: לֹא תָסֻרוּ
  choice: விலகாதீர்கள்
  rationale: סור இங்கு கட்டளையிடப்பட்ட வழியிலிருந்து பிறழ்வதை உருவகமாகக் குறிக்கிறது; ‘விலகாதீர்கள்’ நவீன தமிழில் தெளிவும் கண்ணியமும் உடையது.
- source_word: יָמִין וּ/שְׂמֹאל
  choice: வலப்புறமோ இடப்புறமோ
  rationale: எந்தத் திசையிலும் பிறழக்கூடாது என்னும் எபிரெய வழக்கை அதன் பாதை உருவகத்துடன் இயல்பான தமிழில் காக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர் அல்லது யெகோவா
  rationale: மூலவசனம் தெய்வீகப் பெயரை நேரடியாகப் பயன்படுத்துகிறது. அதை ஒரு பட்டமாக மாற்றாமல் ‘யாவே’ என்று ஒலிபெயர்ப்பது மூலத்தின் தனிப்பெயர் தன்மையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான அறிவுறுத்தல் நடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய மொழியின் பாதை உருவகம் முதன்மை உரையில் காக்கப்பட்டு, அதன் மரபுத்தொடர்ப் பொருள் அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது.
