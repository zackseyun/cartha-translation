revisions:
- from: இப்போது நாம் ஏன் சாக வேண்டும்? இந்தப் பெரும் நெருப்பு நம்மை விழுங்கிவிடுமே! நம் கடவுளாகிய யாவேயின்[a] குரலை நாம் இன்னும் தொடர்ந்து கேட்டால், நாம் செத்துப்போவோம்.
