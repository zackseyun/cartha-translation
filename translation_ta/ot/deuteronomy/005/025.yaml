source:
  edition: WLC
  text: וְ/עַתָּה֙ לָ֣/מָּה נָמ֔וּת כִּ֣י תֹֽאכְלֵ֔/נוּ הָ/אֵ֥שׁ הַ/גְּדֹלָ֖ה הַ/זֹּ֑את אִם יֹסְפִ֣ים אֲנַ֗חְנוּ לִ֠/שְׁמֹעַ אֶת ק֨וֹל יְהוָ֧ה אֱלֹהֵ֛י/נוּ ע֖וֹד וָ/מָֽתְנוּ־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/025.yaml
  text: And now[a], why should we die? For this great fire will consume us. If we continue to hear the voice of Yahweh our God any longer, we will die.
translation:
  language: ta
  text: இப்போதோ நாம் ஏன் சாக வேண்டும்? ஏனெனில், இந்தப் பெரும் நெருப்பு நம்மை விழுங்கிவிடும். நம் கடவுளாகிய யாவேயின்[a] குரலை நாம் இனிமேலும் கேட்டுக்கொண்டிருந்தால், நாம் இறந்துபோவோம்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரேயத்தில்: יהוה (YHWH), கடவுளின் தனிப்பட்ட பெயர்; இங்கு “யாவே” என்று ஒலிபெயர்க்கப்பட்டுள்ளது. மரபாக “கர்த்தர்” என்றும் வழங்கப்படுகிறது.'
    reason: divine_name
lexical_decisions:
- source_word: וְעַתָּה
  choice: இப்போது
  rationale: וְ என்னும் இணைப்பின் தொடர்ச்சிப் பொருள் சூழலிலேயே இயல்பாக வெளிப்படுகிறது; עַתָּה உடனடியான முடிவை அறிமுகப்படுத்துவதால், நவீன தமிழில் இயல்பான ‘இப்போது’ என மொழிபெயர்க்கப்பட்டது.
- source_word: לָמָּה נָמוּת
  choice: நாம் ஏன் சாக வேண்டும்?
  rationale: לָמָּה நேரடியான ‘ஏன்’; imperfect வடிவமான נָמוּת இங்கு அச்சம் கலந்த வினாவாக இருப்பதால் ‘சாக வேண்டும்?’ என்பது அதன் rhetorical நுணுக்கத்தைத் தக்கவைக்கிறது.
- source_word: כִּי תֹאכְלֵנוּ
  choice: நம்மை விழுங்கிவிடுமே
  rationale: אכל என்பதன் அடிப்படைப் படிமம் ‘தின்னுதல்’; நெருப்பு எழுவாயாக வரும்போது ‘விழுங்குதல்’ அழிவின் உயிருள்ள படிமத்தையும், இங்கு உள்ள அச்சம் நிறைந்த காரணவிளக்கத்தையும் இயல்பான தமிழில் காக்கிறது.
- source_word: הָאֵשׁ הַגְּדֹלָה הַזֹּאת
  choice: இந்தப் பெரும் நெருப்பு
  rationale: பெயர்ச்சொல், பெயரடை, சுட்டுப்பெயர் ஆகியவற்றின் பொருளை இயல்பான தமிழ் சொல்வரிசையில் வழங்குகிறது.
- source_word: אִם יֹסְפִים אֲנַחְנוּ לִשְׁמֹעַ
  choice: நாம் இன்னும் தொடர்ந்து கேட்டால்
  rationale: יסף + infinitive என்பது ‘தொடர்ந்து செய்தல்/மேலும் செய்தல்’ என்ற மொழிவழக்குப் பொருளைக் கொண்டது; עוֹד உடன் சேர்ந்த தொடர்ச்சியை ‘இன்னும் தொடர்ந்து’ தெளிவாக வெளிப்படுத்துகிறது.
- source_word: קוֹל
  choice: குரல்
  rationale: இது பொதுவான ‘ஒலி’ அல்ல, கடவுளுடைய பேச்சைக் குறிக்கும் சூழல் என்பதால் ‘குரல்’ துல்லியமானது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரேய நான்கெழுத்துத் திருப்பெயரை ஒரு பட்டப்பெயரால் மாற்றாமல், தமிழில் வழக்கமான ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: אֱלֹהֵינוּ
  choice: நம் கடவுள்
  rationale: முதல் நபர் பன்மை உடைமைத் தொடர்பையும் உடன்படிக்கை உறவுச் சொல்லாட்சியையும் நேரடியாகப் பாதுகாக்கிறது.
- source_word: וָמָתְנוּ
  choice: நாம் செத்துப்போவோம்
  rationale: நிபந்தனையின் அஞ்சப்படும் உறுதியான விளைவை இயல்பான நவீன தமிழில் கூறுகிறது; முதல் வாக்கியத்தின் ‘சாக வேண்டும்’ என்பதிலிருந்து எபிரேயத்தின் வேறுபட்ட வினைநிலையையும் உணர்த்துகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் தனிப்பட்ட உடன்படிக்கைப் பெயர் நேரடியாக உள்ளது. அதனைப் பட்டப்பெயராக மாற்றாமல் ஒலிபெயர்ப்பது மூலத்தின் தன்மையைப் பாதுகாக்கிறது; வாசகர்களுக்காக அடிக்குறிப்பில் எபிரேய வடிவம் விளக்கப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், ஆனால் வேதாகம உரைக்கு ஏற்ற கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. ‘விழுங்கிவிடுமே’ மக்களின் உடனடி அச்சத்தையும் நெருப்பின் அழிவுப் படிமத்தையும் காக்கிறது; இறுதி ‘செத்துப்போவோம்’ என்பது நேரடியான, இயல்பான பேச்சுக் கூற்றாக உள்ளது.
