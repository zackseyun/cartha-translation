  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: כַּבֵּ֤ד אֶת אָבִ֨י/ךָ֙ וְ/אֶת אִמֶּ֔/ךָ כַּ/אֲשֶׁ֥ר צִוְּ/ךָ֖ יְהוָ֣ה אֱלֹהֶ֑י/ךָ לְמַ֣עַן יַאֲרִיכֻ֣/ן יָמֶ֗י/ךָ וּ/לְמַ֨עַן֙ יִ֣יטַב לָ֔/ךְ עַ֚ל הָֽ/אֲדָמָ֔ה אֲשֶׁר יְהוָ֥ה אֱלֹהֶ֖י/ךָ נֹתֵ֥ן לָֽ/ךְ־־׀־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/016.yaml
  text: Honor your father and your mother[a], as Yahweh your God commanded you[b], so that your days may be long and so that it may go well for you on the land that Yahweh your God is giving you.
translation:
  language: ta
  text: உன் தந்தையையும் உன் தாயையும் மதித்து நட; உன் கடவுளாகிய யாவே உனக்குக் கட்டளையிட்டபடியே நட. உன் நாட்கள் நீடிக்கவும், உனக்கு நன்மை உண்டாகவும், உன் கடவுளாகிய யாவே உனக்குக் கொடுக்கிற நிலத்தில் அவ்வாறு நட.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כַּבֵּד
  choice: மதித்து நட
  rationale: כבד என்பதன் பியேல் கட்டளை வடிவம், பெற்றோரை மதிப்புக்குரியவர்களாகக் கருதி அதற்கேற்றவாறு நடத்துவதைக் குறிக்கிறது. நவீன தமிழில் ‘மதித்து நட’ என்பது மனப்பாங்கையும் செயலையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: אָבִיךָ ... אִמֶּךָ
  choice: உன் தந்தையையும் உன் தாயையும்
  rationale: ஒவ்வொரு பெற்றோருக்கும் முன் எபிரெயத்தில் நேரடி செயப்படுபொருள் குறியீடு மீண்டும் வருவதால், இருவருக்கும் வழங்கப்படும் சமச்சீர் வலியுறுத்தலைத் தமிழிலும் தனித்தனியாகப் பேணுகிறது.
- source_word: כַּאֲשֶׁר צִוְּךָ
  choice: உனக்குக் கட்டளையிட்டபடியே
  rationale: முன்னரே வழங்கப்பட்ட இறைக் கட்டளையோடு இக்கட்டளையை இணைக்கும் ஒப்பீட்டு மற்றும் உடன்படிக்கைச் சார்பைத் தெளிவாகப் பேணுகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தலைப்பால் மாற்றாமல், எபிரெயத் தெய்வீகப் பெயரான יהוה-ஐ தமிழில் ஒலிபெயர்க்கிறது.
- source_word: אֱלֹהֶיךָ
  choice: உன் கடவுள்
  rationale: இரண்டாம் நபர் ஒருமை உடைமைப் பின்னொட்டைத் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்தி, உடன்படிக்கை உறவைப் பேணுகிறது.
- source_word: לְמַעַן
  choice: அப்போது
  rationale: இங்கு கட்டளையைத் தொடர்ந்து வரும் நோக்கம் அல்லது விளைவை இயல்பான தமிழில் இணைக்கிறது. இருமுறை வரும் לְמַעַן-இன் இரண்டு விளைவுகளும் அடுத்தடுத்த வாக்கியக் கூறுகளில் பேணப்படுகின்றன.
- source_word: יַאֲרִיכֻן יָמֶיךָ
  choice: உன் நாட்கள் நீடிக்கும்
  rationale: ‘நாட்கள்’ என்பதையே எழுவாயாக வைத்திருக்கும் எபிரெய மொழிநடையைப் பேணி, நீண்ட வாழ்வைக் குறிக்கும் இயல்பான தமிழை வழங்குகிறது.
- source_word: וּלְמַעַן יִיטַב לָךְ
  choice: உனக்கு நன்மை உண்டாகும்
  rationale: ייטב לך குறிக்கும் நல்வாழ்வு அல்லது நலன் என்ற பரந்த பொருளைப் பேணுகிறது; அதை வெறும் பொருளாதார வளமாகக் குறுக்கவில்லை.
- source_word: עַל הָאֲדָמָה
  choice: நிலத்தில்
  rationale: אדמה இச்சூழலில் பொதுவான மண்ணை அல்ல, கடவுள் கொடுக்கும் பிரதேசத்தைச் சுட்டுகிறது. தமிழில் ‘நிலத்தில்’ என்பது עַל-ஐ இடவியல் பொருளில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: נֹתֵן לָךְ
  choice: உனக்குக் கொடுக்கிற
  rationale: எபிரெயப் பங்கேற்பு வடிவத்தின் நிகழ்கால அல்லது நெருங்கிய நிறைவேற்றத் தன்மையையும், கொடை உறுதியானதாக முன்வைக்கப்படுவதையும் பேணுகிறது.
theological_decisions:
- issue: יהוה என்ற தெய்வீகப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலத்தில் தனிப்பெயர் நேரடியாக இருப்பதால், அதை ஒரு பட்டத்தால் மாற்றாமல் தமிழில் ஒலிபெயர்த்துள்ளது.
- issue: பெற்றோரை மதிப்பதோடு இணைக்கப்பட்ட வாக்குறுதியின் இயல்பு
  choice: நீண்ட வாழ்வும் நலனும் கடவுள் கொடுக்கும் நிலத்தோடு தொடர்புடைய உண்மையான உடன்படிக்கை வாக்குறுதியாக அப்படியே வைக்கப்படுகிறது.
  alternative: ஒவ்வொரு தனிநபருக்கும் விதிவிலக்கற்ற ஆயுள் உத்தரவாதம்; அல்லது தனிநபர் பொருள் இல்லாத தேசிய வாக்குறுதி மட்டும்
  rationale: எபிரெய உரை நீண்ட நாட்களையும் நலனையும் தெளிவாக வாக்களிக்கிறது; ஆனால் அது முழுக்கத் தனிநபருக்கான விதிவிலக்கற்ற உத்தரவாதமா அல்லது தேசிய அளவிலானதா என்பதை இவ்வசனம் மட்டும் தீர்மானிப்பதில்லை. அந்த இறையியல் அழுத்தம் மொழிபெயர்ப்பில் தீர்க்கப்படாமல் பேணப்படுகிறது.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான, பொதுவாசகர்களுக்கு எளிதில் புரியும் தமிழ். ஒருமை இரண்டாம் நபர் வடிவங்கள் மூலத்தின் இலக்கணத்தைப் பேணுகின்றன. கட்டளையின் வலிமை இயல்பான ‘மதித்து நட’ வழியாகத் தெரிவிக்கப்படுகிறது.
