revisions:
- from: உன் கடவுளாகிய யாவே உனக்குக் கட்டளையிட்டபடியே, உன் தந்தையையும் உன் தாயையும் மதித்து நட. அப்போது, உன் கடவுளாகிய யாவே உனக்குக் கொடுக்கிற நிலத்தில் உன் நாட்கள் நீடிக்கும்; உனக்கு நன்மை உண்டாகும்.
  to: உன் தந்தையையும் உன் தாயையும் மதித்து நட; உன் கடவுளாகிய யாவே உனக்குக் கட்டளையிட்டபடியே நட. உன் நாட்கள் நீடிக்கவும், உனக்கு நன்மை உண்டாகவும், உன் கடவுளாகிய யாவே உனக்குக் கொடுக்கிற நிலத்தில் அவ்வாறு நட.
  rationale: The revision restores the source order for the parents and explicitly represents both coordinated purpose/result clauses. Repeating “நட” is used to make the final Tamil purpose construction natural and unambiguous; it does not add a distinct command or alter the meaning. No footnote is required because the translation does not adopt a disputed reading or conceal a material lexical alternative.
