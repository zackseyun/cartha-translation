  to: ஏனெனில், நாம் கேட்டதுபோல் நெருப்பின் நடுவிலிருந்து பேசுகிற உயிருள்ள கடவுளின் குரலைக் கேட்டு உயிரோடிருந்தவர் மனிதர் அனைவரிலும் யார்?[a]
