source:
  edition: WLC
  text: כִּ֣י מִ֣י כָל בָּשָׂ֡ר אֲשֶׁ֣ר שָׁמַ֣ע קוֹל֩ אֱלֹהִ֨ים חַיִּ֜ים מְדַבֵּ֧ר מִ/תּוֹךְ הָ/אֵ֛שׁ כָּמֹ֖/נוּ וַ/יֶּֽחִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/026.yaml
  text: For who of all flesh has heard the voice of the living God speaking from the midst of the fire[a], as we have, and lived?
translation:
  language: ta
  text: ஏனெனில், நாம் கேட்டதுபோல் நெருப்பின் நடுவிலிருந்து பேசுகிற உயிருள்ள கடவுளின் குரலைக் கேட்டு உயிரோடிருந்தவர் மனிதர் அனைவரிலும் யார்?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “எல்லா மாம்சமும்”; இது மரணத்துக்குரிய மனிதகுலத்தைக் குறிக்கும் மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய சூழலில் மக்களின் அச்சத்துக்கும் வேண்டுகோளுக்கும் காரணத்தை அறிமுகப்படுத்துகிறது.
- source_word: מִי
  choice: யார்
  rationale: விடை எதிர்பாராத வினாவை இயல்பாக அறிமுகப்படுத்தும் வினாப்பெயர்.
- source_word: כָל בָּשָׂר
  choice: மனிதர் அனைவரிலும்[a]
  rationale: சொல்லெழுத்தாக ‘எல்லா மாம்சமும்’ என்றாலும், இங்கு மரணத்துக்குரிய மனிதகுலத்தைக் குறிக்கும் எபிரெய மரபுத்தொடர். இயல்பான தமிழுக்காக பொருள் முதன்மைப்படுத்தப்பட்டு, மூல உருவகம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: שָׁמַע
  choice: கேட்டும்
  rationale: கடவுளின் குரலைக் கேட்ட பின்னரும் உயிருடன் இருந்த அதிசயத்தை அடுத்த வினையுடன் இயல்பாக இணைக்கிறது.
- source_word: קוֹל
  choice: குரல்
  rationale: பேசுகிற கடவுளிடமிருந்து வருவதால் ‘ஒலி’ என்பதைக் காட்டிலும் ‘குரல்’ பொருத்தமானது.
- source_word: אֱלֹהִים חַיִּים
  choice: உயிருள்ள கடவுள்
  rationale: வடிவத்தில் பன்மைத் தன்மை இருந்தாலும், சூழலில் இது இஸ்ரவேலின் ஒரே கடவுளைக் குறிக்கும் நிலையான ஒருமைச் சொற்றொடர்.
- source_word: מְדַבֵּר
  choice: பேசுகிற
  rationale: கடவுள் நெருப்பின் நடுவிலிருந்து பேசிக்கொண்டிருந்ததைச் சுட்டும் எபிரெயப் பங்கேற்பு வினையின் தொடர்ச்சித் தன்மையை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: מִתּוֹךְ הָאֵשׁ
  choice: நெருப்பின் நடுவிலிருந்து
  rationale: குரல் நெருப்புக்கு அருகிலிருந்து அல்ல, அதன் உள்ளிருந்து வந்தது என்ற மூலத்தின் தெளிவான காட்சியைப் பாதுகாக்கிறது.
- source_word: כָמֹנוּ
  choice: நம்மைப் போல
  rationale: இஸ்ரவேலர் தாமே பெற்ற அனுபவத்துடன் செய்யப்படும் ஒப்பீட்டை நேரடியாகக் காட்டுகிறது.
- source_word: וַיֶּחִי
  choice: உயிரோடிருந்தவர்
  rationale: ‘உயிர்வாழ்ந்தார்’ அல்லது ‘தப்பிப் பிழைத்தார்’ என்று விளக்கமாக்காமல், ‘வாழ்ந்தார்’ என்ற அடிப்படைப் பொருளைப் பாதுகாக்கிறது.
theological_decisions:
- issue: כָל בָּשָׂר என்ற மனிதவியல் மரபுத்தொடர்
  choice: மனிதர் அனைவரிலும்[a]
  alternative: மாம்சமான அனைவரிலும்
  rationale: மூல எபிரெயத்தின் ‘எல்லா மாம்சமும்’ என்ற உருவகம் மனிதரின் மரணத்தன்மையையும் படைக்கப்பட்ட நிலையையும் உணர்த்துகிறது. ஆனால் சொல்லெழுத்தான தமிழ் இயல்பற்றதால், முதன்மை உரையில் தெளிவான பொருளும் அடிக்குறிப்பில் மூல உருவகமும் தரப்படுகின்றன.
- issue: אֱלֹהִים חַיִּים என்பதன் எண்ணும் பொருளும்
  choice: உயிருள்ள கடவுள்
  alternative: உயிருள்ள கடவுள்கள்
  rationale: இரு சொற்களும் வடிவத்தில் பன்மையாக இருந்தாலும், உடனடிச் சூழலும் நிலையான எபிரெயப் பயன்பாடும் இஸ்ரவேலின் ஒரே கடவுளையே சுட்டுகின்றன; ஆகவே தமிழில் ஒருமையாக மொழிபெயர்க்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளும் கண்ணியமான நடையில் அமைக்கப்பட்டது. ‘கேட்டும் உயிரோடிருந்தவர்’ என்ற அமைப்பு, கேட்ட பிறகும் உயிர் நீடித்தது என்ற வியப்பையும் வினாவின் சொற்பொழிவுத் தீவிரத்தையும் காக்கிறது.
