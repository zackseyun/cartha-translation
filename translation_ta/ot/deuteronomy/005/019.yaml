  text: And you shall not steal[a].
translation:
  language: ta
  text: திருடாதே[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயச் சொல் சில சூழல்களில் ‘ஆளைக் கடத்து’ அல்லது ‘ஒருவரைத் திருடு’ என்றும் பொருள்படலாம்; இங்கு கட்டளை பொதுவாக, ‘திருடாதே’ என்று கூறப்படுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/לֹא
  choice: …ஆதே
  rationale: וְ முந்தைய கட்டளைகளுடன் இதைத் தொடராக இணைக்கிறது. ஆனால் தமிழில் ஒவ்வொரு குறுங்கட்டளையையும் இயல்பாகச் சொல்ல தனியான ‘மேலும்’ தேவையில்லை; எதிர்மறை ஏவல் வடிவம் தடையின் நேரடியான வலிமையைத் தக்கவைக்கிறது.
- source_word: תִּגְנֹב
  choice: திருடாதே
  rationale: Qal imperfect இரண்டாம் நபர் ஒருமை வடிவம் இங்கு தடைச்சட்டமாகச் செயல்படுகிறது. பொருள் குறிப்பிடப்படாததால் பொதுவான ‘திருடு’ என்பதே பொருத்தம்; சில சூழல்களில் காணப்படும் ‘ஆளைக் கடத்து’ என்ற குறுகிய பொருளை முதன்மை உரையில் திணிக்கவில்லை.
