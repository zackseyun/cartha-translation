  text: לֹא יִהְיֶ֥ה לְ/ךָ֛ אֱלֹהִ֥ים אֲחֵרִ֖ים עַל פָּנָֽ/יַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/007.yaml
  text: You shall have no other gods before me[a].
translation:
  language: ta
  text: என் முன்னிலையில் உனக்கு வேறு தெய்வங்கள் இருக்கக் கூடாது.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என்னைத் தவிர.” எபிரெயத்தில் சொல்லுக்குச் சொல், “என் முகத்துக்கு முன்பாக”; இது என் முன்னிலையில் என்பதையும், என்னைத் தவிர என்பதான பிரத்தியேகத்தன்மையையும் குறிக்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: לֹא
  choice: கூடாது
  rationale: எதிர்மறைக் கட்டளையின் தடை வலிமையை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: יִהְיֶה לְךָ
  choice: உனக்கு ... இருக்கக் கூடாது
  rationale: எபிரெய மொழியின் ‘உனக்கு/உனக்கென இருக்குதல்’ என்ற உறவுசார் அமைப்பைத் தமிழில் நேரடியாகவும் இயல்பாகவும் காக்கிறது; ஒருமை முகவரியையும் தக்கவைக்கிறது.
- source_word: אֱלֹהִים אֲחֵרִים
  choice: வேறு தெய்வங்கள்
  rationale: கர்த்தரிலிருந்து வேறுபட்ட போட்டித் தெய்வங்களைக் குறிக்கும் பன்மைச் சொல்லுக்கு தெளிவான, வழக்கமான தமிழ் இணை.
- source_word: עַל פָּנָי
  choice: என் முன்னிலையில்
  rationale: சொல்லுக்குச் சொல் உள்ள ‘என் முகத்திற்கு முன்’ என்ற படிமத்தின் முன்னிலை/சந்நிதி பொருளைக் காக்கும் இயல்பான தமிழ்; தனிப்பட்ட உரிமை என்ற விரிவான பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: עַל פָּנָי என்ற இறுதிச் சொற்றொடரின் பொருள்
  choice: என் முன்னிலையில்
  alternative: என்னைத் தவிர
  rationale: எபிரெய சொற்றொடர் முன்னிலை அல்லது சந்நிதியையும், இந்தத் தடைச் சூழலில் தனிப்பட்ட இறை உரிமையையும் வெளிப்படுத்த முடியும். முதன்மை உரை வடிவத்துக்கு நெருக்கமான பொருளைக் காக்கிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன, மரியாதைமிக்க, பொதுவாசகர்களுக்குப் புரியும் தமிழ். இஸ்ரவேலை ஒருமையில் முகவரியிடும் எபிரெய வடிவத்தை ‘உனக்கு’ என்று காக்கிறது.
