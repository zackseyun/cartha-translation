  text: יְהוָ֣ה אֱלֹהֵ֗י/נוּ כָּרַ֥ת עִמָּ֛/נוּ בְּרִ֖ית בְּ/חֹרֵֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/002.yaml
  text: Yahweh our God made a covenant with us at Horeb[a].
translation:
  language: ta
  text: நம் கடவுளாகிய யாவே ஓரேபில் நம்மோடு ஓர் உடன்படிக்கை செய்தார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'சொல்லுக்கு சொல்: “ஓரேபில் நம்மோடு ஓர் உடன்படிக்கையை வெட்டினார்.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைவனின் தனிப்பெயரான நான்கெழுத்துப் பெயரை ஒரு பட்டப்பெயரால் மாற்றாமல், தமிழில் இயல்பான ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: אֱלֹהֵינוּ
  choice: நம் கடவுளாகிய
  rationale: ‘நம் கடவுள்’ என்ற உறவைக் காத்து, யாவே என்ற பெயருடன் இயல்பான தமிழ்த் தொடராக அமைக்கிறது.
- source_word: כָּרַת
  choice: செய்தார்
  rationale: ‘உடன்படிக்கையை வெட்டினார்’ என்ற எபிரெய மரபுத்தொடரின் பொருளை நவீன தமிழில் இயல்பாகத் தெரிவிக்கிறது; நேரடிப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: עִמָּנוּ בְּרִית
  choice: நம்மோடு ஓர் உடன்படிக்கை
  rationale: உடன்படிக்கையின் உறவுத்தன்மையையும், இங்கு குறிப்பிடப்படும் உடன்படிக்கையையும் தெளிவாகப் பாதுகாக்கிறது.
- source_word: בְּחֹרֵב
  choice: ஓரேபில்
  rationale: இடப்பெயரைத் தமிழ் ஒலிமுறைக்கு ஏற்ப ஒலிபெயர்த்து, בְּ என்ற இடப்பொருளை ‘-இல்’ மூலம் இயல்பாக வழங்குகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலத்தில் தனிப்பெயர் நேரடியாக இருப்பதால், பட்டப்பெயரைப் பதிலிடாமல் இறைப் பெயரை ஒலிபெயர்ப்பது உடன்படிக்கைச் சூழலையும் மூலத்தின் தனித்தன்மையையும் காக்கிறது.
- issue: בְּרִית என்ற சொல்லின் உடன்படிக்கைப் பொருள்
  choice: உடன்படிக்கை
  alternative: ஒப்பந்தம்
  rationale: ‘உடன்படிக்கை’ என்பது கடவுளுக்கும் இஸ்ரவேலுக்கும் இடையிலான பிணைப்பின் உறவு மற்றும் கடப்பாட்டுச் செறிவைத் தக்கவைக்கிறது; ‘ஒப்பந்தம்’ அதனைச் சுருக்கக்கூடும்.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. எபிரெய மரபுத்தொடரின் நேரடி வடிவம் முதன்மை உரையை இயல்பற்றதாக்காமல் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
