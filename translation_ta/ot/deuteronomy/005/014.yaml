base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/014.yaml
  text: But the seventh day is a Sabbath to Yahweh your God[a]. You shall not do any work—you, or your son, or your daughter, or your male servant, or your female servant, or your ox, or your donkey, or any of your livestock[b], or the sojourner who is within your gates—so that your male servant and your female servant may rest as you do.
translation:
  language: ta
  text: ஆனால் ஏழாம் நாளோ உன் கடவுளாகிய யாவேக்கு உரிய ஓய்வுநாள். நீயும், உன் மகனும், உன் மகளும், உன் ஆண் அடிமையும், உன் பெண் அடிமையும், உன் எருதும், உன் கழுதையும், உன் கால்நடைகள் எதுவும், உன் வாசல்களுக்குள்[b] குடியிருக்கும் அந்நியனும்[a] எந்த வேலையையும் செய்யக்கூடாது; உன் ஆண் அடிமையும் உன் பெண் அடிமையும் உன்னைப் போலவே ஓய்வெடுக்கும்படியாக.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘குடியிருக்கும் அந்நியன்’ என்பதை ‘அந்நியக் குடியிருப்பாளர்’ என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் גֵּר, சமூகத்துக்குள் வாழும் அந்நாட்டைச் சேர்ந்திராத ஒருவரைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: சொல்லுக்கு சொல், ‘உன் வாசல்களுக்குள்.’ இது உன் நகரம் அல்லது சமூக எல்லைக்குள் குடியிருப்பவர்களைக் குறிக்கும் மரபுத்தொடர்.
    reason: cultural_note
lexical_decisions:
- source_word: שַׁבָּת
  choice: ஓய்வுநாள்
  rationale: இது பொதுவான ஓய்வை மட்டும் குறிக்காமல் உடன்படிக்கைக்குரிய குறிப்பிட்ட புனித நாளைக் குறிக்கிறது; தமிழில் நிலைபெற்ற இயல்பான சொல் பயன்படுத்தப்பட்டது.
- source_word: לַיהוָה
  choice: யாவேக்கு உரிய
  rationale: לְ முன்னிடைச்சொல் அர்ப்பணிப்பு அல்லது உரிமைத் தொடர்பைக் காட்டுவதால், அந்த நாள் யாவேக்கென ஒதுக்கப்பட்டது என்ற பொருள் தெளிவாகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய மூலத்தில் வரும் இறைப் பெயரை ஒரு பொதுப்பட்டமாக மாற்றாமல் பெயராகவே ஒலிபெயர்க்கிறது.
- source_word: מְלָאכָה
  choice: வேலை
  rationale: ஓய்வுநாள் சட்டத்தில் தடைசெய்யப்படும் செயல்களின் பரந்த வகையைத் தேவையின்றிக் குறுக்காமல் இயல்பாகக் குறிக்கிறது.
- source_word: עַבְדְּךָ
  choice: உன் ஆண் அடிமை
  rationale: אמה என்பதிலிருந்து பாலின வேறுபாட்டையும், வீட்டாரோடு பிணைக்கப்பட்ட சமூக நிலையையும் வெளிப்படையாகக் காட்டுகிறது.
- source_word: אֲמָתֶךָ / אֲמָתְךָ
  choice: உன் பெண் அடிமை
  rationale: עבד என்பதுடன் இணையாக வரும் பெண்பால் அடிமை நிலையையும் பாலின வேறுபாட்டையும் பாதுகாக்கிறது.
- source_word: שׁוֹר
  choice: மாடு
  rationale: சட்டப் பட்டியலில் வரும் வீட்டுப் பயன்பாட்டுக்குரிய bovine விலங்கை நவீனத் தமிழில் இயல்பாகக் குறிக்கிறது; ‘எருது’ என்று பாலினம் அல்லது பயன்பாட்டை மிகையாகக் குறிப்பதைத் தவிர்க்கிறது.
- source_word: חֲמוֹר
  choice: கழுதை
  rationale: மூலச் சொல்லுக்கான நேரடியான, நவீனத் தமிழ் இணை.
- source_word: בְּהֵמָה
  choice: கால்நடைகள்
  rationale: இச்சூழலில் வீட்டாருக்குச் சொந்தமான வளர்ப்பு விலங்குகளைக் குறிக்கிறது.
- source_word: גֵּר
  choice: குடியிருக்கும் அந்நியன்
  rationale: இஸ்ரவேல் சமூகத்தில் வாழும், அந்த இடத்தைத் தாயகமாகக் கொண்டிராத குடியிருப்பாளரைத் தெளிவாகக் குறிக்கிறது; வழிப்போக்கன் என்ற பொருளைத் தவிர்க்கிறது.
- source_word: בִּשְׁעָרֶיךָ
  choice: உன் வாசல்களுக்குள்
  rationale: மூல உருவகத்தைப் பாதுகாக்கிறது; இது ஒருவரின் நகரம் அல்லது சமூக அதிகார எல்லைக்குள் இருப்பதைக் குறிக்கும் மரபுத்தொடர் என்பதை அடிக்குறிப்பு விளக்குகிறது.
- source_word: לְמַעַן
  choice: இதனால் ... ஓய்வெடுக்கலாம்
  rationale: கட்டளையின் நோக்கம் அடிமைகளுக்கும் சமமான ஓய்வு கிடைப்பது என்பதை இயல்பான தமிழில் தெரிவிக்கிறது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் நான்கெழுத்து இறைப் பெயர் நேரடியாக வருவதால், அதை பொதுப்பட்டமாக மாற்றாமல் உடன்படிக்கைப் பெயராகப் பாதுகாக்கிறது.
- issue: עבד/אמה என்போரின் சமூக நிலை
  choice: ஆண் அடிமை / பெண் அடிமை
  alternative: வேலைக்காரன் / வேலைக்காரி
  rationale: இவர்கள் சுதந்திரமான கூலிப் பணியாளர்கள் என்று மென்மைப்படுத்தாமல், வீட்டாருடன் பிணைக்கப்பட்ட அடிமை நிலையையும் அவர்களுக்கு அளிக்கப்படும் ஓய்வையும் தெளிவாகக் காட்டுகிறது.
- issue: כָּמוֹךָ என்பதிலுள்ள ஒப்புமை
  choice: உன்னைப் போலவே
  alternative: உன்னோடு சேர்ந்து
  rationale: மூலம் சமமான ஓய்வை ஒப்புமையாகச் சொல்கிறது; ஒரே நேரத்தில் அல்லது ஒரே இடத்தில் ஓய்வெடுப்பதாகத் தேவையின்றி விரிவாக்கவில்லை.
translation_notes:
  register: நவீன, கண்ணியமான ஒருமை உரையாடல் நடை பயன்படுத்தப்பட்டது. சட்ட மொழியின் பட்டியல் அமைப்பும், ஆண்/பெண் அடிமைகளுக்கிடையிலான மூல வேறுபாடும், இறுதியில் அவர்களுக்குக் கிடைக்கும் ஒத்த ஓய்வும் பாதுகாக்கப்பட்டுள்ளன.
