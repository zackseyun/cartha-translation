source:
  edition: WLC
  text: וְ/לֹֽא תַעֲנֶ֥ה בְ/רֵֽעֲ/ךָ֖ עֵ֥ד שָֽׁוְא־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/020.yaml
  text: You shall not bear false witness against your neighbor[a].
translation:
  language: ta
  text: உன் அயலானுக்கு எதிராகப் பொய்ச் சாட்சி சொல்லாதே[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உன் அயலானுக்கு எதிராகப் பொய்யாகச் சாட்சி அளிக்காதே.”
    reason: ענה + עֵד என்ற சட்டச் சொற்றொடரை ‘சாட்சி சொல்லுதல்’ என்றும் ‘சாட்சி அளித்தல்’ என்றும் இயல்பாக மொழிபெயர்க்கலாம்; மாற்று வடிவம் சாட்சியளிக்கும் செயலை வெளிப்படையாகக் காட்டுகிறது.
lexical_decisions:
- source_word: לֹא
  choice: சொல்லாதே
  rationale: எபிரேயத் தடைக் கட்டளையின் மறுப்புப் பொருள், தமிழில் இயல்பான நேரடிக் கட்டளை வடிவமான ‘-ஆதே’ என்பதால் வெளிப்படுத்தப்படுகிறது.
- source_word: תַעֲנֶה
  choice: சொல்லாதே
  rationale: ענה என்பதன் அடிப்படைப் பொருள் ‘பதில் சொல்’ என்றாலும், עֵד உடன் வரும் இச்சட்டச் சூழலில் சாட்சி கூறுதலைக் குறிக்கிறது; ‘சாட்சி சொல்லுதல்’ என்பது இயல்பான நவீனத் தமிழ் சட்ட வழக்கு.
- source_word: בְרֵעֲךָ
  choice: உன் சக மனிதருக்கு எதிராக
  rationale: רֵעַ என்பது அருகில் வசிப்பவரை மட்டும் அல்லாமல் உடனிருப்பவர், தோழர், சக மனிதர் ஆகிய பரந்த பொருளைக் கொள்ளலாம். இங்கு בְ சாட்சியின் பாதிப்புக்குரிய நபரைச் சுட்டுவதால் ‘எதிராக’ என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: עֵד
  choice: சாட்சி
  rationale: இச்சொல் சட்டச் சூழலில் சாட்சியையோ சாட்சி அளிக்கும் செயலையோ குறிக்கிறது; தமிழில் ‘சாட்சி சொல்லுதல்’ என்ற இணைப்பு பொருளைத் தெளிவாக வழங்குகிறது.
- source_word: שָׁוְא
  choice: பொய்
  rationale: שָׁוְא என்பதற்கு பொய்மை, பயனின்மை, வெறுமை போன்ற பொருள்கள் உண்டு; நீதித்துறைச் சாட்சியச் சூழலில் ‘பொய்’ என்பதே துல்லியமும் இயல்பும் வாய்ந்தது.
