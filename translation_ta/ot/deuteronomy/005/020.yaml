translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் dignified நேரடிக் கட்டளை நடை பயன்படுத்தப்பட்டுள்ளது. ‘அயலான்’ என்பதைக் காட்டிலும் எபிரேய רֵעַ என்பதன் பரந்த மனித உறவுப் பொருளைத் தர ‘சக மனிதர்’ தேர்ந்தெடுக்கப்பட்டுள்ளது.
