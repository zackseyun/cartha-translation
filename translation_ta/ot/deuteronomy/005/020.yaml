revisions:
- from: உன் சக மனிதருக்கு எதிராகப் பொய்ச் சாட்சி சொல்லாதே[a].
  to: உன் அயலானுக்கு எதிராகப் பொய்ச் சாட்சி சொல்லாதே[a].
  rationale: ரֵעַ என்பதற்கான ‘சக மனிதர்’ என்பதற்குப் பதிலாக, இச்சட்டச் சூழலில் மூலத்தின் தனிப்பட்ட ‘fellow/neighbor’ பொருளையும் தமிழின் இயல்பான வழக்கையும் தரும் ‘அயலான்’ பயன்படுத்தப்பட்டுள்ளது. மற்ற சொற்கள் மூலத்தின் பொருளையும் கட்டளை நடையையும் துல்லியமாகக் காக்கின்றன.
