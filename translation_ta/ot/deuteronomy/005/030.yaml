  text: לֵ֖ךְ אֱמֹ֣ר לָ/הֶ֑ם שׁ֥וּבוּ לָ/כֶ֖ם לְ/אָהֳלֵי/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/030.yaml
  text: Go[a], say to them, ‘Return to your tents.’
translation:
  language: ta
  text: நீ போய் அவர்களிடம், ‘உங்கள் கூடாரங்களுக்குத் திரும்பிச் செல்லுங்கள்’ என்று சொல்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לֵךְ
  choice: நீ போய்
  rationale: הלך என்பதன் ஆண்பால் ஒருமை கட்டளை வடிவம்; அடுத்த கட்டளையான ‘சொல்’ என்பதோடு இயல்பான தமிழில் ‘போய் ... சொல்’ என்று இணைக்கப்பட்டது.
- source_word: אֱמֹר
  choice: சொல்
  rationale: אמר என்பதன் ஆண்பால் ஒருமை கட்டளை வடிவம்; செய்தியை அறிவிக்கும்படியான நேரடியான கட்டளையைத் தக்கவைக்கிறது.
- source_word: לָהֶם
  choice: அவர்களிடம்
  rationale: முன்னிடைச்சொல்லும் மூன்றாம் நபர் ஆண்பால் பன்மை பின்னொட்டும் பேச்சின் மறைமுகப் பெறுநர்களைக் குறிக்கின்றன; தமிழில் ‘அவர்களிடம்’ இயல்பான வடிவம்.
- source_word: שׁוּבוּ
  choice: திரும்பிச் செல்லுங்கள்
  rationale: שוב என்பதன் ஆண்பால் பன்மை கட்டளை வடிவம்; மக்கள் தங்கள் முந்தைய தங்குமிடங்களுக்குத் திரும்பும் திசைச்சார்ந்த பொருளை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: לָכֶם
  choice: உங்கள்
  rationale: இரண்டாம் நபர் ஆண்பால் பன்மை பின்னொட்டுடன் வரும் முன்னிடைச்சொல், ஒருவர் தமக்குரிய இடத்திற்குத் திரும்பும் எபிரெய வழக்கை உருவாக்குகிறது; தமிழில் உடைமைச் சொல்லாக இயல்பாக வெளிப்படுகிறது.
- source_word: לְאָהֳלֵיכֶם
  choice: கூடாரங்களுக்குத்
  rationale: சொல்லின் நேரடியான பொருள் ‘உங்கள் கூடாரங்களுக்கு’; ‘கூடாரங்கள்’ வனாந்தர வரலாற்றுச் சூழலின் தெளிவான உருவகத்தைப் பாதுகாக்கிறது.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழில், நேரடியும் மரியாதைமிக்கதுமான உரைநடை பயன்படுத்தப்பட்டுள்ளது. மேற்கோளுக்குள் உள்ள பன்மைக் கட்டளை ‘செல்லுங்கள்’ எனவும், மோசேயிடம் கூறப்படும் ஒருமைக் கட்டளை ‘சொல்’ எனவும் இலக்கண வேறுபாடு தெளிவாக வைக்கப்பட்டுள்ளது.
