  source_fidelity: லֵךְ אֱמֹר என்ற இரட்டை ஒருமைக் கட்டளையை “நீ போய் … சொல்” என்று சரியாகக் காட்டுகிறது. לָהֶם-இன் மறைமுகப் பெறுநர் “அவர்களிடம்” என்றும், שׁוּבוּ לָכֶם לְאָהֳלֵיכֶם என்பதின் பன்மைக் கட்டளையும் தமக்குரிய கூடாரங்களுக்குத் திரும்பும் பொருளும் “உங்கள் கூடாரங்களுக்குத் திரும்பிச் செல்லுங்கள்” என்றும் நம்பகமாக வழங்கப்பட்டுள்ளன.
  naturalness: நவீன நிலையான தமிழில் வாக்கியம் இயல்பாகவும் தெளிவாகவும் உள்ளது. “போய் … என்று சொல்” என்ற இணைப்பு நேரடியான கட்டளைச் சூழலுக்கு ஏற்றது; மேற்கோளுக்குள் மரியாதைப் பன்மை கட்டளை பயன்படுத்தப்பட்டிருப்பதும் பொருத்தமானது.
  terminology: “கூடாரங்கள்” என்பது אָהֳלֵיכֶם என்பதன் நேரடித் தமிழ்ச் சமமானது; வரலாற்றுச் சூழலையும் காக்கிறது. முக்கிய இறையியல் சொற்கள் இவ்வசனத்தில் இல்லை.
