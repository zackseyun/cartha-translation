  text: You shall not murder[a].
translation:
  language: ta
  text: கொலை செய்யாதே.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: மரபுவழியாக, ‘கொல்லாதே’ என்றும் மொழிபெயர்க்கப்படுகிறது. இங்குள்ள எபிரேய வினைச்சொல் குறிப்பாகக் கொலை அல்லது சட்டவிரோதமாக உயிரைப் பறிப்பதைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא
  choice: செய்யாதே
  rationale: எபிரேய மறுப்புச் சொல் வினையுடன் சேர்ந்து நேரடியான தடையைத் தெரிவிக்கிறது; நவீனத் தமிழில் ஒருமை முன்னிலைத் தடை வடிவமான ‘செய்யாதே’ இயல்பாகவும் கட்டளையின் நேரடித்தன்மையைத் தக்கவைத்தும் உள்ளது.
- source_word: תִּרְצָח
  choice: கொலை செய்
  rationale: רָצַח என்பது பொதுவாக எல்லா வகையான உயிர்க்கொல்லுதலையும் அல்ல, கொலை அல்லது சட்டவிரோதமாக உயிரைப் பறிப்பதைக் குறிக்கிறது. ‘கொலை செய்’ என்பது தமிழில் இதன் அற-சட்ட வலிமையைத் தெளிவாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: ஆறாம் கட்டளையின் தடை வரம்பு
  choice: ‘கொலை செய்யாதே’—கொலை அல்லது சட்டவிரோத உயிர்ப்பறிப்பைத் தடைசெய்வதாக மொழிபெயர்த்தல்
  alternative: ‘கொல்லாதே’—எல்லா வகையான உயிர்க்கொல்லுதலையும் உள்ளடக்கக்கூடிய விரிவான சொல்
  rationale: மூலத்தில் பொதுவாக ‘கொல்லுதல்’ என்பதற்கான விரிவான வினை அல்லாமல் רָצַח பயன்படுத்தப்பட்டுள்ளது. ஆகவே ‘கொலை செய்யாதே’ என்பது மூலத்தின் குறிப்பான அற-சட்டப் பொருளைத் தக்கவைக்கிறது; திருச்சட்டத்தில் வேறுபடுத்தப்படும் பிற உயிர்க்கொல்லுதல் சூழல்களோடும் தேவையற்ற முரண்பாட்டைத் தவிர்க்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் சுருக்கமான, நேரடியான கட்டளை வடிவம் பயன்படுத்தப்பட்டுள்ளது. ‘கொலை செய்யாதே’ என்பது சாதாரண வாசகர்களுக்குத் தெளிவாகவும் கண்ணியமான வேதாகம நடைக்கு ஏற்றதாகவும் உள்ளது; அடிக்குறிப்பு மரபான விரிவான மொழிபெயர்ப்பை பதிவு செய்கிறது.
