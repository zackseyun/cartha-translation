revisions:
- from: நீ அவற்றுக்கு முன் பணிந்து வணங்கவோ, அவற்றுக்குப் பணிவிடை செய்யவோ கூடாது.[a] ஏனெனில், உன் கடவுளாகிய யாவே என்னும் நான், எனக்கே உரிய பற்றுறுதியைக் கோரும் கடவுள். என்னை வெறுப்பவர்களிடையே, தந்தையரின் அக்கிரமத்தைப் பிள்ளைகள்மேலும், மூன்றாம் தலைமுறையினர்மேலும், நான்காம் தலைமுறையினர்மேலும் கணக்குக் கேட்கிறேன்.[b][c]
  to: நீ அவற்றை வணங்கவோ, அவற்றுக்குப் பணிவிடை செய்யவோ கூடாது.[a] ஏனெனில், நான், உன் கடவுளாகிய யாவே, பொறாமையுள்ள கடவுள்; என்னை வெறுப்பவர்களின் தந்தையரின் அக்கிரமத்திற்காக அவர்களின் பிள்ளைகள்மேலும், மூன்றாம் தலைமுறையினர்மேலும், நான்காம் தலைமுறையினர்மேலும் கணக்குக் கேட்கிறேன்.[b][c]
  rationale: The revision restores a direct equivalent for ‘jealous God,’ corrects the final phrase so that it identifies those who hate Yahweh rather than placing the action ‘among’ them, and smooths the Tamil syntax. ‘என்னை வெறுப்பவர்களின்’ expresses the source’s scope without adding a claim that descendants are judged independently of, or necessarily in continuity with, their own stance. The judicial breadth of פקד remains represented by ‘கணக்குக் கேட்கிறேன்’ and explained in the existing note.
