base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/009.yaml
  text: You shall not bow down to them or serve them[a], for I, Yahweh your God, am a jealous God, visiting the iniquity of fathers on children, and on the third and on the fourth generations of those who hate me[c][b],
translation:
  language: ta
  text: நீ அவற்றை வணங்கவோ, அவற்றுக்குப் பணிவிடை செய்யவோ கூடாது.[a] ஏனெனில், நான், உன் கடவுளாகிய யாவே, பொறாமையுள்ள கடவுள்; என்னை வெறுப்பவர்களின் தந்தையரின் அக்கிரமத்திற்காக அவர்களின் பிள்ளைகள்மேலும், மூன்றாம் தலைமுறையினர்மேலும், நான்காம் தலைமுறையினர்மேலும் கணக்குக் கேட்கிறேன்.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அவற்றுக்கு முன்பாகத் தரையில் விழுந்து வணங்கவோ’ என்றும் மொழிபெயர்க்கலாம். எபிரெய வினை மரியாதை அல்லது வழிபாட்டின் அடையாளமாக உடலைத் தாழ்த்துவதைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: ‘கணக்குக் கேட்கிறேன்’ என்பதற்கு ‘விசாரிக்கிறேன்’ அல்லது ‘தண்டிக்கிறேன்’ என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் நீதிசார் பொறுப்புக்கூறலையும் அதனால் வரும் தண்டனையையும் உள்ளடக்கக்கூடியது.
    reason: lexical_alternative
  - marker: c
    text: எபிரெயத்தில் எழுத்துப்படி ‘மூன்றாம் மேலும் நான்காம் மேலும்’ என்று உள்ளது; தெளிவுக்காக ‘தலைமுறையினர்’ சேர்க்கப்பட்டுள்ளது.
    reason: supplied_word
lexical_decisions:
- source_word: תִשְׁתַּחֲוֶה
  choice: பணிந்து வணங்க
  rationale: இந்த வினை உடலைத் தாழ்த்தி மரியாதை அல்லது வழிபாடு செலுத்தும் செயலைக் குறிக்கிறது. அடுத்துள்ள ‘பணிவிடை செய்ய’ என்பதுடன் வேறுபாட்டைக் காக்க, பொதுவான ‘வழிபட’ என்பதைக் காட்டிலும் concrete action retained.
- source_word: תָעָבְדֵם
  choice: அவற்றுக்குப் பணிவிடை செய்ய
  rationale: சிலைகள் அல்லது பிற தெய்வங்களுக்குச் செய்யப்படும் வழிபாட்டுச் சேவையை இது குறிக்கிறது; முந்தைய வினையுடன் உள்ள சொற்பொருள் வேறுபாட்டையும் காக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெயத் திருப்பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் வழக்கமான ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: אֵל קַנָּא
  choice: எனக்கே உரிய பற்றுறுதியைக் கோரும் கடவுள்
  rationale: கַנָּא என்பது இச்சூழலில் போட்டி வழிபாட்டை ஏற்காத கடவுளின் உடன்படிக்கை சார்ந்த தனியுரிமைக் கோரிக்கையைச் சுட்டுகிறது. ‘பொறாமையுள்ள’ என்பது நவீன தமிழில் தீய மனப்பான்மையைத் தவறாக உணர்த்தக்கூடும்; இத்தேர்வு உறவுசார் தீவிரத்தையும் தனிப்பட்ட உரிமைக் கோரிக்கையையும் வெளிப்படுத்துகிறது.
- source_word: פֹּקֵד
  choice: கணக்குக் கேட்கிறேன்
  rationale: இந்த நீதிசார் வினை விசாரணை, பொறுப்புக்கூறல், தண்டனை ஆகிய பொருள் பரப்பைக் கொண்டது. ‘தண்டிக்கிறேன்’ என்று மட்டும் குறுக்காமல், நீதியான reckoning என்ற அகலத்தைப் பாதுகாக்கிறது.
- source_word: עֲוֺן
  choice: அக்கிரமம்
  rationale: பாவச்செயல், குற்றம், அதனால் வரும் குற்றப்பொறுப்பு ஆகியவற்றை உள்ளடக்கக்கூடிய சொல்லின் ஒழுக்கப் பாரத்தைப் பாதுகாக்கிறது.
- source_word: אָבוֹת
  choice: தந்தையர்
  rationale: எபிரெயச் சொல் ஆண்பால் பன்மை என்பதால் பாலினத் துல்லியத்துடன் வழங்கப்படுகிறது.
- source_word: עַל בָּנִים
  choice: பிள்ளைகள்மேல்
  rationale: தலைமுறைச் சூழலில் בנים சந்ததியினரை உள்ளடக்கிப் பொதுவாகக் குறிக்க முடிவதால் இயல்பான தமிழில் ‘பிள்ளைகள்’ என வழங்கப்படுகிறது.
- source_word: שִׁלֵּשִׁים וְעַל רִבֵּעִים
  choice: மூன்றாம் தலைமுறையினர்மேலும், நான்காம் தலைமுறையினர்மேலும்
  rationale: எபிரெயத்தில் ‘மூன்றாம், நான்காம்’ என்று மட்டும் உள்ள தலைமுறை மரபுத்தொடரைத் தமிழில் தெளிவாக்க ‘தலைமுறையினர்’ சேர்க்கப்பட்டுள்ளது.
- source_word: לְשֹׂנְאָי
  choice: என்னை வெறுப்பவர்களிடையே
  rationale: இறுதி எபிரெயத் தொடர் நீதிசார் கணக்குக் கேட்பு கடவுளை வெறுப்பவர்களைச் சார்ந்தது என்பதைக் காட்டுகிறது. அதே வேளையில், அதன் துல்லியமான தொடரியல் தொடர்பை அளவுக்கு மீறித் தீர்மானிக்காமல் ‘இடையே’ என வழங்கப்படுகிறது.
theological_decisions:
- issue: கடவுளின் קַנָּא பண்பை எவ்வாறு மொழிபெயர்ப்பது
  choice: எனக்கே உரிய பற்றுறுதியைக் கோரும் கடவுள்
  alternative: பொறாமையுள்ள கடவுள் / வைராக்கியமுள்ள கடவுள்
  rationale: இங்கு கருத்து போட்டி வழிபாட்டை ஏற்காத உடன்படிக்கை சார்ந்த உரிமைக் கோரிக்கை. ‘பொறாமை’ நவீன தமிழில் பெரும்பாலும் குற்றமான envy-ஐக் குறிக்கும்; ‘வைராக்கியம்’ வேறு பொருளில் புரியக்கூடும். தேர்ந்த வடிவம் கருத்தை இயல்பாகவும் கண்ணியமாகவும் தெரிவிக்கிறது.
- issue: முன்னோரின் அக்கிரமத்துக்காகச் சந்ததியினர் தாமாகவே தண்டிக்கப்படுகிறார்களா
  choice: ‘என்னை வெறுப்பவர்களிடையே’ என்ற இறுதித் தொடர் தீர்ப்பின் வரம்பை உணர்த்துமாறு வைக்கப்பட்டுள்ளது; ஆனால் அதன் தொடரியல் தொடர்பு முழுமையாகத் தீர்க்கப்படவில்லை.
  alternative: சந்ததியினரின் சொந்த நிலைப்பாட்டைப் பொருட்படுத்தாமல் முன்னோரின் பாவத்திற்காகத் தண்டனை விழுகிறது என்று வெளிப்படையாக மொழிபெயர்த்தல்
  rationale: לְשֹׂנְאָי இறுதியில் இருப்பதால் அது கடவுளை வெறுப்பவர்களை நீதிசார் நடவடிக்கையுடன் இணைக்கிறது. பிற வேதாகமப் பகுதிகளுடனான இறையியல் பதற்றத்தைச் செயற்கையாகத் தீர்க்காமல், மூலத்தின் கடினத்தன்மை பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், ஒருமை இரண்டாம் நபரைப் பாதுகாத்து, கண்ணியமான ஆனால் பொதுவாசகர்களுக்கு எளிதில் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. ‘தேவன்’ என்பதற்குப் பதில் சமயப் பிரிவுசார் ஒலியைத் தவிர்க்க இயல்பான ‘கடவுள்’ பயன்படுத்தப்பட்டுள்ளது; யாவே என்ற தனிப்பெயர் அப்படியே காக்கப்பட்டுள்ளது.
