  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: אָֽנֹכִי֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ אֲשֶׁ֧ר הוֹצֵאתִ֛י/ךָ מֵ/אֶ֥רֶץ מִצְרַ֖יִם מִ/בֵּ֥ית עֲבָדִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/006.yaml
  text: I am Yahweh your God[a], who brought you from the land of Egypt, from the house of servants.
translation:
  language: ta
  text: எகிப்து நாட்டிலிருந்து, அடிமைகளின் வீட்டிலிருந்து[a] உன்னை வெளியே கொண்டுவந்த உன் கடவுளாகிய யாவே நானே.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அடிமைத்தனத்தின் வீட்டிலிருந்து.” எபிரேயில் சொற்பொருளாக, “அடிமைகளின் வீட்டிலிருந்து.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אָֽנֹכִי
  choice: நானே
  rationale: வினைச்சொல் இல்லாத தனித்த முதலாம் நபர் சுட்டுப்பெயரின் வலியுறுத்தலை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இது பட்டப்பெயர் அல்ல, இறைவனுடைய தனிப்பெயர்; எனவே தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: אֱלֹהֶיךָ
  choice: உன் கடவுளாகிய
  rationale: இரண்டாம் நபர் ஒருமை உரிமை விகுதியை ‘உன்’ நேரடியாகக் காட்டுகிறது; உடன்படிக்கைச் சூழலில் இது உண்மையான கடவுளைக் குறிக்கிறது.
- source_word: הוֹצֵאתִיךָ
  choice: உன்னை வெளியே கொண்டுவந்த
  rationale: יצא என்பதன் ஹிஃபில் வடிவம் ‘வெளியே செல்லச் செய், வெளியே கொண்டுவா’ என்று பொருள்படும்; இத்தொடர் விடுதலையின் இயக்கத்தையும் இரண்டாம் நபர் ஒருமையையும் தெளிவாகப் பாதுகாக்கிறது.
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: எகிப்து நாட்டிலிருந்து
  rationale: מִן குறிக்கும் புறப்படும் இடத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: מִבֵּית עֲבָדִים
  choice: அடிமைகளின் வீட்டிலிருந்து
  rationale: עֲבָדִים என்பது பன்மை வடிவிலுள்ள ‘அடிமைகள்’; மூலத்தின் உருவகத்தையும் அடிமைப்படுத்தப்பட்ட சமூக நிலையையும் நேரடியாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூல உரையில் பட்டப்பெயர் அல்லாமல் நான்கு எழுத்துகளைக் கொண்ட இறைத்தனிப்பெயரே நேரடியாக வருகிறது; ஆகவே அதைப் பட்டப்பெயரால் மாற்றாமல் ஒலிபெயர்ப்பது உரையின் உடன்படிக்கைச் சிறப்பைப் பாதுகாக்கிறது.
- issue: עֲבָדִים என்பதன் விடுதலைச் சூழல் பொருள்
  choice: அடிமைகள்
  alternative: வேலையாட்கள் / அடிமைத்தனம்
  rationale: இங்கு எகிப்திலிருந்து விடுவிக்கப்பட்டவர்களின் கட்டுண்ட நிலை மையமாக இருப்பதால், மென்மையான ‘வேலையாட்கள்’ என்பதற்குப் பதிலாக ‘அடிமைகள்’ துல்லியமானது. பெயர்ச்சொல்லின் பன்மை வடிவமும் முதன்மை உரையில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், ஒருமை இரண்டாம் நபரான ‘உன்/உன்னை’ என்பவற்றை மூலத்தைப் பின்பற்றி வைத்துள்ளோம். ‘நானே’ இறுதியில் வருவது எபிரேய தொடக்கச் சொல்லின் வலியுறுத்தலை தமிழில் இயல்பாகத் தக்கவைக்கிறது; நடை கண்ணியமானதும் பொதுவாசகர்களுக்கு புரியத்தக்கதுமாக உள்ளது.
