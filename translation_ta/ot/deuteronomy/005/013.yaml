  text: שֵׁ֤שֶׁת יָמִים֙ תַּֽעֲבֹ֔ד וְ/עָשִׂ֖יתָ כָּל מְלַאכְתֶּֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/013.yaml
  text: Six days you shall labor and do all your work,[a]
translation:
  language: ta
  text: ஆறு நாட்கள் நீ உழைத்து, உன் வேலைகளையெல்லாம் செய்ய வேண்டும்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஆறு நாட்கள் நீ உழைத்து, உன் வேலைகளையெல்லாம் செய்யலாம்.” இந்தச் சட்டச் சூழலில் எபிரெய வினை வடிவத்தை அறிவுறுத்தலாகவோ அனுமதியாகவோ புரிந்துகொள்ளலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: שֵׁשֶׁת יָמִים
  choice: ஆறு நாட்கள்
  rationale: முன்னிடைச்சொல் இல்லாத எபிரெய கால அளவுத் தொடரைத் தமிழில் இயல்பாகவும் நேரடியாகவும் தருகிறது.
- source_word: תַּעֲבֹד
  choice: நீ உழைத்து
  rationale: עבד இங்கு வழக்கமான உழைப்பைக் குறிக்கிறது. தொடர்ந்து வரும் עשה என்பதிலிருந்து வேறுபாட்டையும் தமிழில் காக்கிறது; வாக்கியத்தின் சட்டபூர்வ அறிவுறுத்தல் வலிமை இறுதி வினைத்தொடரில் வெளிப்படுகிறது.
- source_word: וְעָשִׂיתָ
  choice: செய்ய வேண்டும்
  rationale: עשה என்பதன் பரந்த பொருளை இயல்பான தமிழில் தருவதோடு, சட்டச் சூழலில் imperfect வடிவங்களுக்குள்ள அறிவுறுத்தல் வலிமையையும் வெளிப்படுத்துகிறது.
- source_word: כָּל
  choice: எல்லாம்
  rationale: வேலைகளின் முழுமையைக் குறிக்கும் כָּל என்பதற்கு இயல்பான தமிழ் இணை.
- source_word: מְלַאכְתֶּךָ
  choice: உன் வேலைகளை
  rationale: מְלָאכָה ஓய்வுநாள் சூழலில் வேலை, பணி ஆகியவற்றைக் குறிக்கிறது. ஒருமைத் தொகுப்புப்பொருளைத் தமிழில் இயல்பாகப் பன்மையால் தருகிறது.
theological_decisions:
- issue: ஓய்வுநாள் சட்டத்தில் வினைமுற்றுகளின் அறிவுறுத்தல் அல்லது அனுமதி வலிமை
  choice: “உழைத்து ... செய்ய வேண்டும்” என்று அறிவுறுத்தல் வலிமையுடன் மொழிபெயர்த்தல்
  alternative: “உழைத்து ... செய்யலாம்” என்று அனுமதிப் பொருளுடன் மொழிபெயர்த்தல்
  rationale: இது உடன்படிக்கைச் சட்டத்தின் கட்டளைச் சூழலில் வருவதால் அறிவுறுத்தல் வலிமை முதன்மை உரையில் பொருத்தமானது. எனினும் எபிரெய imperfect வடிவம் இச்சூழலில் அனுமதியாகவும் புரிந்துகொள்ளப்படலாம் என்பதால் அந்த உண்மையான தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழ்; பொதுவாசகர்களுக்குப் புரியும் இயல்பான, கண்ணியமான சட்ட-அறிவுறுத்தல் நடை. “உழைத்து” மற்றும் “செய்ய” என்பவற்றால் இரண்டு எபிரெய வேர்களின் வேறுபாடு காக்கப்பட்டுள்ளது.
