  source_fidelity: 'மூல எபிரெயத்தின் கால-அளவுத் தொடர் (“ஆறு நாட்கள்”), இரண்டு வேறுபட்ட வினைகள் (עבד / עשה: “உழைத்து ... செய்ய”), முழுமையைக் குறிக்கும் כָּל (“எல்லாம்”), மற்றும் உடைமைப் பொருள் (“உன்”) ஆகியவை பொருளுக்கு உண்மையாகக் காக்கப்பட்டுள்ளன. இறுதியிலுள்ள “வேண்டும்” சட்டச் சூழலிலுள்ள அறிவுறுத்தல் வலிமையை இயல்பாக வெளிப்படுத்துகிறது.'
