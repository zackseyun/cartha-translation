  text: You shall not make for yourself a carved image[a], or any likeness of what is in the heavens above, or on the earth beneath[b], or in the waters under the earth.
translation:
  language: ta
  text: உனக்காகச் செதுக்கப்பட்ட உருவத்தையோ, மேலே வானங்களில் உள்ளவை, கீழே பூமியில் உள்ளவை, அல்லது பூமிக்குக் கீழே உள்ள தண்ணீர்களில் உள்ளவை ஆகியவற்றில் எதனுடைய சாயலையோ[a] நீ உருவாக்கக் கூடாது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘செதுக்கப்பட்ட உருவம்’ என்பதற்கு ‘விக்கிரகம்’ என்றும், ‘சாயல்’ என்பதற்கு ‘வடிவம்’ என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் சிலைவழிபாட்டிற்குப் பயன்படுத்தப்படும் உருவத்தை அடிக்கடி குறிக்கிறது; ஆனால் இங்கே அதன் நேரடியான பொருளான ‘செதுக்கப்பட்ட உருவம்’ தக்கவைக்கப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: פֶסֶל
  choice: செதுக்கப்பட்ட உருவம்
  rationale: இந்த எபிரெயச் சொல் செதுக்கி அல்லது வெட்டி உருவாக்கப்பட்ட படிமத்தைக் குறிக்கிறது; சிலைவழிபாட்டுச் சூழலில் அடிக்கடி வந்தாலும், ‘விக்கிரகம்’ என்று விளக்கமாக மொழிபெயர்க்காமல் அதன் நேரடியான பொருள் தக்கவைக்கப்படுகிறது.
- source_word: תְּמוּנָה
  choice: சாயல்
  rationale: இச்சொல் வடிவம், தோற்றம் அல்லது ஒப்புருவைக் குறிக்கிறது. ‘சாயல்’ என்பது செதுக்கப்பட்ட உருவத்தைத் தாண்டி பிரதிநிதித்துவ வடிவங்கள் அனைத்துக்கும் தடையை விரிவுபடுத்தும் பொருளை இயல்பாகத் தெரிவிக்கிறது.
- source_word: לֹא תַעֲשֶׂה לְךָ
  choice: உனக்காக ... நீ உருவாக்கக் கூடாது
  rationale: உடன்படிக்கைச் சட்டத்தில் לֹא உடன் வரும் வினைச்சொல் உறுதியான தடையைக் குறிக்கிறது. לְךָ என்பதன் தனிப்பட்ட பயன்பாடு அல்லது உடைமையாக்கும் நுண்பொருளை ‘உனக்காக’ தக்கவைக்கிறது.
- source_word: כָּל תְּמוּנָה
  choice: எந்தச் சாயலையும்
  rationale: தடை வாக்கியத்தில் כָּל என்பதன் முழுமையான பரப்பை நவீன தமிழில் ‘எந்த ... உம்’ என்ற அமைப்பு இயல்பாக வெளிப்படுத்துகிறது.
- source_word: אֲשֶׁר בַּשָּׁמַיִם מִמַּעַל
  choice: மேலே வானங்களில் இருப்பவற்றின் சாயல்
  rationale: שָׁמַיִם என்பதன் பன்மை ‘வானங்களில்’ என்று தக்கவைக்கப்பட்டுள்ளது; மேலுலகில் உள்ளவற்றை அடிப்படையாகக் கொண்ட சாயல்களை உறவுத்தொடர் சுட்டுகிறது.
- source_word: בָּאָרֶץ מִתָּחַת
  choice: கீழே பூமியில் இருப்பவற்றின் சாயல்
  rationale: ‘மேலே’ என்பதற்கு எதிரான செங்குத்து இடவேறுபாட்டை ‘கீழே’ காக்கிறது; பூமியிலுள்ளவற்றைத் தெளிவாகவும் இயல்பாகவும் குறிக்கிறது.
- source_word: בַּמַּיִם מִתַּחַת לָאָרֶץ
  choice: பூமிக்குக் கீழுள்ள தண்ணீர்களில் இருப்பவற்றின் சாயல்
  rationale: நிலத்திற்குக் கீழே தண்ணீர்கள் உள்ளதாகக் கூறும் மூலமொழியின் பழங்கால உலகக் காட்சியைத் திருத்தாமல் நேரடியாகத் தக்கவைக்கிறது.
theological_decisions:
- issue: உருவத் தடையின் வரம்பு
  choice: வழிபாட்டைப் பற்றிய விளக்கத்தைச் சேர்க்காமல், செதுக்கப்பட்ட உருவம் அல்லது சாயலை உருவாக்குவதற்கான தடையாக வசனம் மொழிபெயர்க்கப்பட்டுள்ளது.
  alternative: ‘வழிபடுவதற்காக விக்கிரகங்களை உருவாக்காதே’ என்று விளக்கவுரை கலந்து மொழிபெயர்த்தல்.
  rationale: வணங்குவதையும் பணிவிடை செய்வதையும் பற்றிய தடை அடுத்த வசனத்தில் வெளிப்படையாக வருகிறது. இவ்வசனத்தில் அதை முன்கூட்டியே சேர்க்காதது மூலவாக்கியத்தின் முன்னேற்றத்தையும் அதன் இறையியல் பதற்றத்தையும் காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், ஒருமை இரண்டாம் நபர் உரையாடலும் உடன்படிக்கைச் சட்டத்திற்குரிய கண்ணியமான உறுதியும் காக்கப்பட்டுள்ளன. மூன்று உலகப் பகுதிகளின் அடுக்கமைப்பு தெளிவாகத் தெரிவதற்காக ‘சாயல்’ மீண்டும் பயன்படுத்தப்பட்டுள்ளது.
