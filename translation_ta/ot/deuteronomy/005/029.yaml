source:
  edition: WLC
  text: מִֽי יִתֵּ֡ן וְ/הָיָה֩ לְבָבָ֨/ם זֶ֜ה לָ/הֶ֗ם לְ/יִרְאָ֥ה אֹתִ֛/י וְ/לִ/שְׁמֹ֥ר אֶת כָּל מִצְוֺתַ֖/י כָּל הַ/יָּמִ֑ים לְמַ֨עַן יִיטַ֥ב לָ/הֶ֛ם וְ/לִ/בְנֵי/הֶ֖ם לְ/עֹלָֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/029.yaml
  text: Oh[a], that they had such a heart as this always—to fear me and to keep all my commandments all their days—so that it might go well with them and with their children forever!
translation:
  language: ta
  text: அவர்கள் எனக்குப் பயந்து, என் கட்டளைகள் அனைத்தையும் தங்கள் வாழ்நாளெல்லாம் கடைப்பிடிக்கும் இதேபோன்ற இருதயம் அவர்களுக்கு எப்போதும் இருந்தால் எவ்வளவு நன்றாயிருக்கும்![a] அப்போது அவர்களுக்கும் அவர்களுடைய பிள்ளைகளுக்கும் என்றென்றும் நன்மை உண்டாகும்படி!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்களுக்கு இதேபோன்ற இருதயம் இருந்தால்!” எபிரெயத் தொடர் சொல்லுக்குச் சொல், “யார் தருவார்...?” என்று உள்ளது; இங்கு அது ஆழ்ந்த ஏக்கத்தை வெளிப்படுத்தும் மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי יִתֵּן
  choice: இருந்தால் எவ்வளவு நன்றாயிருக்கும்!
  rationale: சொல்லுக்குச் சொல் ‘யார் கொடுப்பார்?’ என்றாலும், இங்கு அது ஆழ்ந்த ஏக்கத்தையும் விருப்பத்தையும் வெளிப்படுத்தும் எபிரெய மரபுத்தொடர். இயல்பான நவீன தமிழில் அதன் உணர்வை இத்தொடர் தருகிறது.
- source_word: וְהָיָה לְבָבָם זֶה לָהֶם
  choice: இதேபோன்ற இருதயம் அவர்களுக்கு எப்போதும் இருந்தால்
  rationale: மக்கள் முன்பு வெளிப்படுத்திய மனப்பாங்கைப் போன்ற உள்ளார்ந்த நிலை தொடர்ந்து அவர்களுக்கு இருக்க வேண்டும் என்ற விருப்பத்தை வெளிப்படுத்துகிறது. ‘இருதயம்’ என்பது சிந்தனை, விருப்பம், ஒழுக்க மனப்பாங்கு ஆகியவற்றை உள்ளடக்கும் வேதாகம உருவகத்தைப் பாதுகாக்கிறது.
- source_word: לְיִרְאָה אֹתִי
  choice: எனக்குப் பயந்து
  rationale: தேவனை நோக்கிய பயபக்தியையும் கீழ்ப்படிதலையும் குறிக்கும் உடன்படிக்கைச் சொற்பயன்பாட்டை ‘பயந்து’ பாதுகாக்கிறது; வெறும் அச்சம் என்ற பொருளில் மட்டும் இதைக் குறுக்கவில்லை.
- source_word: וְלִשְׁמֹר אֶת כָּל מִצְוֺתַי
  choice: என் கட்டளைகள் அனைத்தையும் கடைப்பிடிப்பதற்கு
  rationale: שׁמר என்பது கட்டளைகளுடன் வரும்போது அவற்றைக் கீழ்ப்படிந்து அனுசரிப்பதைக் குறிக்கிறது. ‘கடைப்பிடி’ நவீன தமிழில் இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: כָּל הַיָּמִים
  choice: தங்கள் வாழ்நாளெல்லாம்
  rationale: சொல்லர்த்தமாக ‘எல்லா நாட்களும்’; இச்சூழலில் அவர்களுடைய வாழ்நாள் முழுவதையும் குறிக்கிறது.
- source_word: לְמַעַן יִיטַב לָהֶם
  choice: அப்போது அவர்களுக்கு ... நன்மை உண்டாகும்
  rationale: לְמַעַן நோக்கம் அல்லது விளைவை அறிமுகப்படுத்துகிறது; יִיטַב என்பது பொருளாதாரச் செழிப்பை மட்டும் அல்லாமல் பொது நல்வாழ்வைக் குறிக்கிறது.
- source_word: וְלִבְנֵיהֶם
  choice: அவர்களுடைய பிள்ளைகளுக்கும்
  rationale: בנים இலக்கணரீதியாக ஆண்பால் வடிவமாயிருந்தாலும், இங்கு உடன்படிக்கைச் சூழலில் சந்ததியினரைப் பொதுவாகக் குறிக்கிறது.
- source_word: לְעֹלָם
  choice: என்றென்றும்
  rationale: தொடரும் தலைமுறை நன்மையின் நீடித்த தன்மையை மூலத்துக்கு நெருக்கமாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: לְבָבָם என்பதன் மானுடவியல் பொருள்
  choice: இருதயம்
  alternative: மனம் / உள்ளார்ந்த மனப்பாங்கு
  rationale: மூலச்சொல் அறிவை மட்டும் அல்லாமல் விருப்பம், சிந்தனை, ஒழுக்கத் தீர்மானம் ஆகிய முழு உள்ளார்ந்த மனித நிலையையும் குறிக்கிறது. ‘இருதயம்’ அந்த வேதாகமக் கருத்தமைப்பைப் பாதுகாக்கிறது.
- issue: לְיִרְאָה אֹתִי என்பதில் பயத்தின் இயல்பு
  choice: எனக்குப் பயந்து
  alternative: என்னைப் பயபக்தியுடன் மதித்து
  rationale: ‘பயந்து’ என்பது மூலத்தின் வலிமையையும் உடன்படிக்கை மொழியையும் பாதுகாக்கிறது. அதனை ‘மதித்து’ என்று மட்டும் மாற்றுவது பொருளைக் குறுக்கிவிடும்; சூழல் இது கீழ்ப்படிதலோடு இணைந்த பயபக்தி என்பதைத் தெளிவுபடுத்துகிறது.
- issue: וְלִבְנֵיהֶם என்பதன் பாலின மற்றும் தலைமுறை வரம்பு
  choice: அவர்களுடைய பிள்ளைகள்
  alternative: அவர்களுடைய மகன்கள்
  rationale: இங்கு ஆண்பால் பன்மை வடிவம் சந்ததியினரைப் பொதுவாகக் குறிக்கிறது; ‘பிள்ளைகள்’ மூலத்தின் நோக்கத்தையும் உடன்படிக்கை வாக்கின் தலைமுறை விரிவையும் துல்லியமாகத் தருகிறது.
- issue: יִיטַב என்பதன் நன்மை
  choice: நன்மை உண்டாகும்
  alternative: செழிப்படைவார்கள்
  rationale: இந்தச் சொல் தேவனுடைய ஆசீர்வாதத்தின்கீழ் நல்வாழ்வைக் குறிக்கிறது; அதை பொருளாதாரச் செழிப்பாக மட்டும் குறிப்பாக்காமல் விடுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; சாதாரண வாசகர்களுக்குப் புரியும் வகையில் இயல்பானதும் கண்ணியமானதுமான நடை. ‘இருதயம்,’ ‘பயந்து,’ ‘கட்டளைகள்’ போன்ற முக்கிய உடன்படிக்கைச் சொற்கள் பாதுகாக்கப்பட்டுள்ளன. நீண்ட எபிரெய வாக்கியம் தமிழின் இயல்புக்காக இரண்டு வாக்கியங்களாக அமைக்கப்பட்டாலும், விருப்பம்–கீழ்ப்படிதல்–நன்மை என்ற தர்க்கத் தொடர்பு காக்கப்பட்டுள்ளது.
