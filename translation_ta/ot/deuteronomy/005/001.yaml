reference: Deuteronomy 5:1
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יִּקְרָ֣א מֹשֶׁה֮ אֶל כָּל יִשְׂרָאֵל֒ וַ/יֹּ֣אמֶר אֲלֵ/הֶ֗ם שְׁמַ֤ע יִשְׂרָאֵל֙ אֶת הַ/חֻקִּ֣ים וְ/אֶת הַ/מִּשְׁפָּטִ֔ים אֲשֶׁ֧ר אָנֹכִ֛י דֹּבֵ֥ר בְּ/אָזְנֵי/כֶ֖ם הַ/יּ֑וֹם וּ/לְמַדְתֶּ֣ם אֹתָ֔/ם וּ/שְׁמַרְתֶּ֖ם לַ/עֲשֹׂתָֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/001.yaml
  text: And Moses called all Israel and said to them[a], “Hear, Israel, the statutes and the judgments that I am speaking in your hearing today; learn them and keep them[b], to do them.”
translation:
  language: ta
  text: 'மோசே இஸ்ரவேலர் அனைவரையும் அழைத்து அவர்களிடம் சொன்னார்: “இஸ்ரவேலே, கேள்! இன்று நான் உங்களுக்குச் சொல்லிக்கொண்டிருக்கிற சட்டங்களையும் நீதி நியமங்களையும் கற்றுக்கொள்ளுங்கள்; அவற்றைக் கடைப்பிடித்து அவற்றை நடைமுறைப்படுத்துங்கள்.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: அழைத்து
  rationale: இச்சூழலில் קרא என்பது மக்களை அழைத்து ஒன்றுகூட்டுவதைக் குறிக்கிறது; ‘அழைத்து’ என்பது இயல்பான தமிழில் அதன் கதையோட்ட வலிமையைத் தக்கவைக்கிறது.
- source_word: כָּל יִשְׂרָאֵל
  choice: இஸ்ரவேலர் அனைவரையும்
  rationale: முழு உடன்படிக்கைச் சமூகத்தையும் கூட்டாகக் குறிக்கும் சொற்றொடரை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: שְׁמַע יִשְׂרָאֵל
  choice: இஸ்ரவேலே, கேள்!
  rationale: שׁמע வெறும் ஒலி கேட்டலை அல்லாமல் கவனமாகக் கேட்டு கீழ்ப்படிவதற்கான அழைப்பையும் கொண்டுள்ளது; ‘கேள்’ அதன் சுருக்கத்தையும் உடன்படிக்கைச் செறிவையும் காக்கிறது.
- source_word: הַחֻקִּים
  choice: சட்டங்கள்
  rationale: חֻקִּים என்பது விதிக்கப்பட்ட சட்டங்களையோ நிர்ணயங்களையோ குறிக்கிறது; நவீன வாசகருக்குத் தெளிவான சட்டச் சொல்லாக ‘சட்டங்கள்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: הַמִּשְׁפָּטִים
  choice: நீதி நியமங்கள்
  rationale: מִשְׁפָּטִים என்பதிலுள்ள நீதித்துறை சார்ந்த தீர்ப்புகள் அல்லது கட்டுப்படுத்தும் விதிமுறைகள் என்ற நுணுக்கத்தைக் காத்து, חֻקִּים என்பதிலிருந்து வேறுபடுத்துகிறது.
- source_word: דֹּבֵר
  choice: சொல்லும்
  rationale: எபிரெயப் பங்கேற்புவினை நிகழ்காலத்தில் நடைபெறும் உரையைக் காட்டுகிறது; ‘இன்று நான் ... சொல்லும்’ என்பது தமிழில் இயல்பாக அதைப் பிரதிபலிக்கிறது.
- source_word: בְּאָזְנֵיכֶם
  choice: நீங்கள் கேட்கும்படி
  rationale: சொற்பொருளில் ‘உங்கள் காதுகளில்’ என்றாலும், நேரடியாகக் கேட்கும் வகையில் உரைக்கப்படுவதை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: וּלְמַדְתֶּם אֹתָם
  choice: கற்றுக்கொள்ளுங்கள்
  rationale: சட்டங்களை அறிந்து உள்ளீர்த்துக்கொள்ள வேண்டும் என்ற கட்டளையை நேரடியாக வெளிப்படுத்துகிறது.
- source_word: וּשְׁמַרְתֶּם
  choice: கடைப்பிடித்து
  rationale: உடன்படிக்கைச் சூழலில் שׁמר என்பது கட்டளைகளைப் பாதுகாத்து அனுசரிப்பதைக் குறிக்கிறது; ‘கடைப்பிடித்து’ செயல்முறை கீழ்ப்படிதலைத் தெளிவாக்குகிறது.
- source_word: לַעֲשֹׂתָם
  choice: அவற்றின்படி செயல்படுங்கள்
  rationale: சொற்பொருளான ‘அவற்றைச் செய்யுங்கள்’ என்பதன் நோக்கத்தை இயல்பான தமிழில் விளக்கி, சட்டங்களை நடைமுறைப்படுத்தும் கீழ்ப்படிதலைக் காக்கிறது.
theological_decisions:
- issue: חֻקִּים / מִשְׁפָּטִים என்ற உடன்படிக்கைச் சட்டச் சொற்களைத் தனித்தனியாக மொழிபெயர்த்தல்
  choice: சட்டங்களையும் நீதி நியமங்களையும்
  alternative: கட்டளைகளையும் விதிமுறைகளையும்
  rationale: தொடர்புடைய இரு சட்டச் சொற்களையும் ஒரே பொதுச்சொல்லாகச் சுருக்காமல், מִשְׁפָּטִים என்பதிலுள்ள நீதிசார் நுணுக்கத்தைத் தக்கவைக்கிறது; பின்னாளைய சமயக் கோட்பாட்டு வகைப்பாடுகளைச் சேர்ப்பதில்லை.
- issue: שׁמע என்ற கட்டளையின் உடன்படிக்கை சார்ந்த வலிமை
  choice: இஸ்ரவேலே, கேள்!
  alternative: இஸ்ரவேலே, கவனித்துக் கேள்!
  rationale: ‘கேள்’ மூலத்தின் சுருக்கமான இலக்கிய வடிவத்தைக் காக்கிறது; தொடரும் கற்றல், கடைப்பிடித்தல், செயல்படுதல் ஆகியவை அது கீழ்ப்படிதலை நோக்கிய கேட்டல் என்பதைச் சூழலிலேயே தெளிவாக்குகின்றன.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளக்கூடியதாயும் உடன்படிக்கைச் சட்ட உரைக்கு ஏற்ற கண்ணியமான நடையிலும் வடிவமைக்கப்பட்டது. மூலத்தில் இல்லாத விளக்க அடிக்குறிப்புகள் சேர்க்கப்படவில்லை; ‘கேள்’ என்பதன் விரிந்த பொருளைத் தொடரும் வினைகள் சூழலிலேயே வெளிப்படுத்துகின்றன.
