base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/027.yaml
  text: You go near and hear all that the LORD our God says, and you shall tell us all that the LORD our God speaks to you; and we will hear and do it.
translation:
  language: ta
  text: நீர் அருகில் சென்று, நம் இறைவனாகிய ஆண்டவர் கூறும் அனைத்தையும் கேளும். நம் இறைவனாகிய ஆண்டவர் உம்மிடம் உரைக்கும் அனைத்தையும் எங்களுக்குச் சொல்லும்; நாங்கள் கேட்டு அதன்படி செய்வோம்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קְרַב
  choice: அருகில் சென்று
  rationale: எபிரேய வினையின் ‘நெருங்கிச் செல்’ என்ற நேரடியான பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: יְהוָה
  choice: ஆண்டவர்
  rationale: இறைநாமத்தைக் குறிக்கும் நான்கு எழுத்துப் பெயருக்கான மரியாதைமிக்க, பரவலாகப் புரியக்கூடிய தமிழ் மரபு வடிவம்.
- source_word: וְשָׁמַעְנוּ וְעָשִׂינוּ
  choice: நாங்கள் கேட்டு அதன்படி செய்வோம்
  rationale: ‘கேட்போம், செய்வோம்’ என்ற இரு செயல்களையும் காத்து, கேட்ட செய்திக்குக் கீழ்ப்படிந்து செயல்படுதல் என்ற இயல்பான தொடர்பை தமிழில் தெளிவாக்குகிறது.
theological_decisions:
- issue: மோசே மக்களுக்கும் ஆண்டவருக்கும் இடையில் செய்தியைப் பெறுபவராக நிற்பது
  choice: இரண்டாம் நபர் மரியாதை ஒருமையில் ‘நீர்/உம்மிடம்/சொல்லும்’ என்று மொழிபெயர்க்கப்பட்டது
  alternative: பன்மை அல்லது பேச்சுவழக்கு ‘நீ’ வடிவம்
  rationale: மூலத்தில் மோசே ஒருவரே அழைக்கப்படுகிறார்; தமிழில் வேதாகமத்திற்கேற்ற கண்ணியமான ஒருமையை இது காக்கிறது.
- issue: ‘கேட்டு செய்வோம்’ என்பதிலுள்ள கீழ்ப்படிதல் நுணுக்கம்
  choice: ‘கேட்டு அதன்படி செய்வோம்’
  alternative: ‘கேட்போம், செய்வோம்’
  rationale: மூலத்தின் வரிசையையும் உறுதியையும் காத்தபடி, இரண்டாம் வினை கேட்டவற்றை நிறைவேற்றுவதைக் குறிக்கிறது என்பதை இயல்பான தமிழில் வெளிப்படுத்துகிறது; கூடுதல் சமயக் கோட்பாட்டைச் சேர்க்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழ்; பொதுவாசகர்களுக்குப் புரியும் வகையில் இயல்பானதும் கண்ணியமானதும். மோசே ஒருவரை நோக்கிய மரியாதை ஒருமை வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன.
