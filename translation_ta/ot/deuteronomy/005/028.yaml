source:
  edition: WLC
  text: וַ/יִּשְׁמַ֤ע יְהוָה֙ אֶת ק֣וֹל דִּבְרֵי/כֶ֔ם בְּ/דַבֶּרְ/כֶ֖ם אֵלָ֑/י וַ/יֹּ֨אמֶר יְהוָ֜ה אֵלַ֗/י שָׁ֠מַעְתִּי אֶת ק֨וֹל דִּבְרֵ֜י הָ/עָ֤ם הַ/זֶּה֙ אֲשֶׁ֣ר דִּבְּר֣וּ אֵלֶ֔י/ךָ הֵיטִ֖יבוּ כָּל אֲשֶׁ֥ר דִּבֵּֽרוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/028.yaml
  text: And Yahweh heard the sound of your words when you spoke to me[a], and Yahweh said to me, “I have heard the sound of the words of this people, which they have spoken to you[b]; they have spoken well in all that they have said.”
translation:
  language: ta
  text: நீங்கள் என்னிடம் பேசியபோது, உங்கள் வார்த்தைகளின் ஒலியை[a] யாவே கேட்டார். அப்போது யாவே என்னிடம், “இந்த மக்கள் உன்னிடம் பேசிய வார்த்தைகளின் ஒலியை நான் கேட்டேன். அவர்கள் சொன்ன அனைத்திலும் நன்றாகப் பேசியிருக்கிறார்கள்[b]” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'சொல்லுக்குச் சொல்: ‘உங்கள் வார்த்தைகளின் குரலை’; இது எபிரெய மொழியின் கேட்புணர்வு சார்ந்த சொல்வழக்கு.'
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘அவர்கள் சொன்ன அனைத்திலும் நன்றாகச் செய்திருக்கிறார்கள்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: யாவே
  rationale: தேவனுடைய உடன்படிக்கைப் பெயரைப் பொதுப்பட்டப் பெயரால் மாற்றாமல், எபிரெய வடிவத்திற்கு அண்மையான தமிழ் ஒலிபெயர்ப்பில் தருகிறது.
- source_word: וַיִּשְׁמַע / שָׁמַעְתִּי
  choice: கேட்டார் / நான் கேட்டேன்
  rationale: பேசப்பட்டதைச் செவியுற்றல் என்பதே இங்கு நேரடியான பொருள்; தமிழ் உரையாடல் சூழலில் இயல்பாக உள்ளது.
- source_word: קוֹל דִּבְרֵיכֶם / קוֹל דִּבְרֵי
  choice: உங்கள் வார்த்தைகளின் ஒலி / வார்த்தைகளின் ஒலி
  rationale: קוֹל என்பதன் கேட்புணர்வு சார்ந்த வலியுறுத்தலைத் தக்கவைத்து, எபிரெய மொழிநடைக்கு நெருக்கமாக உள்ளது.
- source_word: בְּדַבֶּרְכֶם אֵלַי
  choice: நீங்கள் என்னிடம் பேசியபோது
  rationale: בְּ உடன் வரும் infinitive construct குறிக்கும் சமகாலச் செயலை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: הָעָם הַזֶּה
  choice: இந்த மக்கள்
  rationale: எபிரெய ஒருமைக் கூட்டுப்பெயரின் சுட்டுப் பொருளை தமிழில் இயல்பாக எடுத்துரைக்கிறது.
- source_word: אֲשֶׁר דִּבְּרוּ אֵלֶיךָ
  choice: உன்னிடம் பேசிய
  rationale: உறவுநிலைத் தொடரைச் சுருக்கமான தமிழ் பெயரெச்சத் தொடராக அளித்து, דבר என்ற வினையின் பேச்சுப் பொருளைத் தக்கவைக்கிறது.
- source_word: הֵיטִיבוּ
  choice: நன்றாகப் பேசியிருக்கிறார்கள்
  rationale: הֵיטִיבוּ தனியே ‘நன்றாகச் செய்தார்கள்’ என்றும் கொள்ளலாம்; ஆனால் தொடர்ந்து வரும் ‘சொன்ன அனைத்திலும்’ என்பதுடன் இணைத்து, சூழலுக்கேற்ற பேச்சு சார்ந்த பொருளை முதன்மைப்படுத்துகிறது.
- source_word: כָּל אֲשֶׁר דִּבֵּרוּ
  choice: அவர்கள் சொன்ன அனைத்திலும்
  rationale: כָּל אֲשֶׁר என்பதன் முழுமை உணர்வையும், பேச்சின் உள்ளடக்கத்தைக் குறிக்கும் இயல்பான தமிழையும் காக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலத்தில் வரும் தனிப்பட்ட உடன்படிக்கைப் பெயரைப் பட்டப்பெயராக மாற்றாமல் ஒலிபெயர்க்கிறது; குறிப்பிட்ட சமய மரபின் மாற்றீட்டைத் திணிப்பதையும் தவிர்க்கிறது.
- issue: הֵיטִיבוּ என்பதன் மதிப்பீடு பேச்சையா செயலையா குறிக்கிறது
  choice: அவர்கள் நன்றாகப் பேசியிருக்கிறார்கள்
  alternative: அவர்கள் நன்றாகச் செய்திருக்கிறார்கள்
  rationale: அடுத்துள்ள ‘அவர்கள் சொன்ன அனைத்திலும்’ என்ற சொற்றொடர் பேச்சு சார்ந்த வாசிப்பை ஆதரிக்கிறது; எனினும் வினையின் விரிந்த ‘நன்றாகச் செய்தல்’ பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையும் கண்ணியமும் இணைந்த நடை. மோசேயை நோக்கிய பன்மை ‘நீங்கள்’ மற்றும் தேவன் மோசேயிடம் கூறும் ஒருமை ‘உன்னிடம்’ ஆகிய மூலமொழியின் எண்ணிக்கை வேறுபாடு தெளிவாகப் பேணப்பட்டுள்ளது.
