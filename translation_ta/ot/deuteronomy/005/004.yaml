base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/004.yaml
  text: Yahweh spoke with you face to face on the mountain[a], from the midst of the fire.
translation:
  language: ta
  text: மலையில், நெருப்பின் நடுவிலிருந்து, யாவே உங்களோடு முகமுகமாகப் பேசினார்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரெயத்தில், ‘முகத்திற்கு முகமாக’; இது நேரடியான தனிப்பட்ட உரையாடலைக் குறிக்கும் மரபுத்தொடர். ஒப்பிடுக: உபாகமம் 4:12—இஸ்ரவேலர் குரலைக் கேட்டார்கள்; ஆனால் எந்த உருவத்தையும் காணவில்லை.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פָּנִים בְּפָנִים
  choice: முகமுகமாக
  rationale: எபிரெயச் சொற்றொடரின் நேரடியான உருவகத்தையும் வலிமையையும் தக்கவைக்கிறது; இது நேரடியான தனிப்பட்ட உரையாடலைக் குறிக்கிறது, தேவனுடைய உருவத்தைக் கண்டதாக அவசியம் கூறுவதில்லை.
- source_word: דִּבֶּר
  choice: பேசினார்
  rationale: வினைச்சொல்லின் இயல்பான பொருளைத் தெளிவாகத் தருகிறது; עִמָּכֶם உடன் சேர்ந்து ‘உங்களோடு ... பேசினார்’ என அமைகிறது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: தெய்வீகப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் பரவலாக அறியப்படும் ஒலிபெயர்ப்பால் தருகிறது.
- source_word: עִמָּכֶם
  choice: உங்களோடு
  rationale: עִם என்பதன் ‘உடன்/ஓடு’ என்ற உறவுநிலைப் பொருளையும் சந்திப்பின் நேரடித்தன்மையையும் காக்கிறது.
- source_word: בָּהָר
  choice: மலையில்
  rationale: இங்குள்ள ב இடத்தைக் குறிக்கிறது; சீனாய் நிகழ்வின் இடத்தை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: מִתּוֹךְ הָאֵשׁ
  choice: நெருப்பின் நடுவிலிருந்து
  rationale: מִתּוֹךְ என்பதிலுள்ள ‘உள்ளிருந்து/நடுவிலிருந்து’ என்ற குறிப்பான பொருளையும் காட்சியின் வலிமையையும் தக்கவைக்கிறது.
theological_decisions:
- issue: ‘முகமுகமாக’ என்ற மனித உருவகச் சொல்லும் சீனாய் இறைவெளிப்பாட்டில் உருவம் காணப்படாமையும்
  choice: நேரடியான உடன்படிக்கை உரையாடலைக் குறிக்கும் ‘முகமுகமாக’ என்ற சொற்றொடரைத் தக்கவைத்தல்
  alternative: தவறான புரிதலைத் தவிர்க்க ‘நேரடியாக’ அல்லது ‘தனிப்பட்ட முறையில்’ என்று விளக்கமாக மொழிபெயர்த்தல்
  rationale: உபாகமம் 4:12, 15-இன் சூழலில் மக்கள் குரலைக் கேட்டார்கள், ஆனால் உருவம் எதையும் காணவில்லை. ஆகவே சொற்றொடரை நேரடியான காட்சியெனத் தீர்மானிக்காமலும் அதன் இயல்பான உருவகத்தை அழிக்காமலும் பதற்றம் தக்கவைக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான நடை. ‘முகமுகமாக’ என்ற எபிரெய மரபுத்தொடர் பாதுகாக்கப்பட்டுள்ளது. இறுதியில் ‘பேசினார்’ மீண்டும் இடப்பட்டிருப்பது ‘நெருப்பின் நடுவிலிருந்து’ என்பதன் தொடர்பைத் தமிழில் தெளிவாக்குகிறது.
