  source_fidelity: 'திருத்தம் தேவை. வரைவு மூலத்தின் முக்கிய கூறுகளைச் சரியாகக் கொண்டுள்ளது: நீதிபதிகள், நிர்வாக அதிகாரிகள், யாவே என்ற இறைநாமம், நகரவாசல்கள், மற்றும் நீதியான தீர்ப்பு. ஆனால் לִשְׁבָטֶיךָ என்பது நியமனத்தின் கோத்திரவாரியான அமைப்பைக் குறிக்கும் வகையில் தெளிவாக அமைக்கப்பட வேண்டும்; தற்போதைய சொற்றொடர் யாவே கோத்திரங்களுக்குக் கொடுப்பதாகப் படிக்கக்கூடும்.'
