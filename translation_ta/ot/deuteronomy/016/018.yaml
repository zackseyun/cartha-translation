source:
  edition: WLC
  text: שֹׁפְטִ֣ים וְ/שֹֽׁטְרִ֗ים תִּֽתֶּן לְ/ךָ֙ בְּ/כָל שְׁעָרֶ֔י/ךָ אֲשֶׁ֨ר יְהוָ֧ה אֱלֹהֶ֛י/ךָ נֹתֵ֥ן לְ/ךָ֖ לִ/שְׁבָטֶ֑י/ךָ וְ/שָׁפְט֥וּ אֶת הָ/עָ֖ם מִשְׁפַּט צֶֽדֶק־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/018.yaml
  text: You shall appoint judges and officers for yourself in all your gates that Yahweh your God is giving you[a], according to your tribes[b], and they shall judge the people with righteous judgment.
translation:
  language: ta
  text: உன் கடவுளாகிய யாவே உனக்குக் கொடுக்கும் எல்லா நகரவாசல்களிலும்[a] உன் கோத்திரங்களின்படி[b] நீதிபதிகளையும் அதிகாரிகளையும் நியமிக்க வேண்டும். அவர்கள் மக்களுக்கு நீதியான தீர்ப்பு வழங்க வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லடியாக, “உன் எல்லா வாசல்களிலும்.” நகரவாசல் பகுதிகள் குடிமை மற்றும் நீதி நிர்வாக மையங்களாகச் செயல்பட்டதால், இதை “உன் எல்லா நகரங்களிலும்” என்றும் புரிந்துகொள்ளலாம்.
    reason: cultural_note
  - marker: b
    text: அல்லது, “உன் கோத்திரங்களுக்காக.”
    reason: lexical_alternative
lexical_decisions:
- source_word: שֹׁפְטִים
  choice: நீதிபதிகள்
  rationale: சட்ட வழக்குகளில் தீர்ப்பு வழங்குவோரைக் குறிக்கும் எபிரெயச் சொல்லின் தெளிவான, இயல்பான தமிழ் இணைச்சொல்.
- source_word: שֹׁטְרִים
  choice: அதிகாரிகள்
  rationale: நீதி நிர்வாகத்துடன் தொடர்புடைய அலுவலர்களைக் குறிக்கிறது; அவர்களின் சரியான பணியை ஆதாரம் கூறாததால் மேலும் குறிப்பிட்டுச் சொல்லப்படவில்லை.
- source_word: תִּתֶּן
  choice: நியமிக்க வேண்டும்
  rationale: சொல்லடியாக ‘வைக்க/கொடுக்க’ என்றாலும், இச்சூழலில் ஒருவரைப் பதவியில் அமர்த்தும் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: בְּכָל שְׁעָרֶיךָ
  choice: எல்லா நகரவாசல்களிலும்
  rationale: ‘உன் எல்லா வாசல்களிலும்’ என்ற மூல உருவகத்தைப் பாதுகாக்கிறது; இவை குடிமை மற்றும் நீதி நிர்வாக மையங்களாக இருந்த நகரவாசல்கள் என்பதை அடிக்குறிப்பு விளக்குகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய மூலத்தில் உள்ள இறைநாமத்தை ஒரு பட்டத்தால் மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: לִשְׁבָטֶיךָ
  choice: உன் கோத்திரங்களுக்குக்
  rationale: לְ இங்கு கோத்திரங்களுக்குரிய அல்லது அவற்றின் அடிப்படையிலான ஏற்பாட்டைக் குறிக்கலாம்; ‘கோத்திரங்களுக்குக்’ என்பது மூலத்தின் சுருக்கத்தையும் பொருள் நெகிழ்வையும் காக்கிறது.
- source_word: וְשָׁפְטוּ אֶת־הָעָם
  choice: அவர்கள் மக்களுக்கு ... தீர்ப்பு வழங்க வேண்டும்
  rationale: நீதித்துறைச் சூழலில் ‘நியாயந்தீர்த்தல்’ என்ற பொருளை நவீன, இயல்பான தமிழில் வழங்குகிறது.
- source_word: מִשְׁפַּט צֶדֶק
  choice: நீதியான தீர்ப்பு
  rationale: சட்டத் தீர்ப்பையும் அதன் நேர்மை/நீதித் தன்மையையும் ஒருங்கே வெளிப்படுத்துகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைநாமத்தின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலத்தில் தனிப்பட்ட இறைநாமம் நேரடியாக வருகிறது; அதனைப் பட்டமாக மாற்றாமல், பொதுவாக ஏற்றுக்கொள்ளப்பட்ட மறுகட்டமைக்கப்பட்ட உச்சரிப்பைத் தமிழில் ஒலிபெயர்க்கிறது.
- issue: לִשְׁבָטֶיךָ என்பதன் தொடர்பு
  choice: உன் கோத்திரங்களுக்குக்
  alternative: உன் கோத்திரங்களின்படி
  rationale: இந்தச் சொற்றொடர் நியமனங்களின் கோத்திரவாரியான அமைப்பையோ கோத்திரங்களுக்கு உரிய நகரங்களையோ சுட்டலாம். உரையில் சுருக்கமான வடிவம் வைக்கப்பட்டு மாற்று புரிதல் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், ஒருமை இரண்டாம் நபர் வடிவம் காக்கப்பட்டுள்ளது. சட்டநிர்வாகச் சொற்கள் தெளிவாகவும் கண்ணியமாகவும் உள்ளன; மூலத்தின் ‘வாசல்கள்’ என்ற பண்பாட்டு உருவகம் விளக்க அடிக்குறிப்புடன் தக்கவைக்கப்பட்டுள்ளது.
