  text: שִׁבְעָ֥ה שָׁבֻעֹ֖ת תִּסְפָּר לָ֑/ךְ מֵ/הָחֵ֤ל חֶרְמֵשׁ֙ בַּ/קָּמָ֔ה תָּחֵ֣ל לִ/סְפֹּ֔ר שִׁבְעָ֖ה שָׁבֻעֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/009.yaml
  text: You shall count seven weeks for yourself; from the time the sickle begins to be put to the standing grain[a], you shall begin to count seven weeks.
translation:
  language: ta
  text: உனக்கென்று ஏழு வாரங்களைக் கணக்கிட வேண்டும். நிற்கும் பயிரில் அரிவாளைச் செலுத்தத் தொடங்கும் காலத்திலிருந்து ஏழு வாரங்களைக் கணக்கிடத் தொடங்க வேண்டும்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் இதை ‘ஏழு ஏழுகள்’ என்றும் மொழிபெயர்க்கலாம். இங்கே அது ஏழு வாரங்களைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁבְעָה שָׁבֻעֹת / שִׁבְעָה שָׁבֻעוֹת
  choice: ஏழு வாரங்கள்
  rationale: שָׁבֻעֹת என்பது நாட்காட்டிச் சூழலில் வழக்கமாக ‘வாரங்கள்’ எனப் பொருள்படும்; இரு இடங்களிலும் ஒரே விதமாக மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: תִּסְפָּר לָךְ
  choice: உனக்காக ... எண்ண வேண்டும்
  rationale: ספר வினையின் கட்டளைத் தன்மையை ‘எண்ண வேண்டும்’ என்றும், வெளிப்படையாக உள்ள לָךְ என்பதைக் ‘உனக்காக’ என்றும் தக்கவைக்கிறது.
- source_word: מֵהָחֵל
  choice: தொடங்கும் காலத்திலிருந்து
  rationale: מִן உடன் வரும் தொடக்கத்தைக் குறிக்கும் வினையெச்சம், எண்ணிக்கையின் காலத் தொடக்கப் புள்ளியைச் சுட்டுகிறது.
- source_word: חֶרְמֵשׁ
  choice: அரிவாள்
  rationale: அறுவடைக்குப் பயன்படும் sickle-ஐ நவீனத் தமிழில் இயல்பாகவும் தெளிவாகவும் குறிக்கிறது.
- source_word: בַּקָּמָה
  choice: நிற்கும் கதிர்களில்
  rationale: קָמָה என்பது அறுவடைக்கு முன் வயலில் நிற்கும் தானியப் பயிரைக் குறிக்கிறது; ‘கதிர்கள்’ தமிழில் இயல்பான வேளாண்மைச் சொல்லாக உள்ளது.
- source_word: תָּחֵל לִסְפֹּר
  choice: எண்ணத் தொடங்க வேண்டும்
  rationale: தொடக்கத்தைக் குறிக்கும் Hiphil வடிவமும் ספר வினையெச்சமும் சேர்ந்த அமைப்பைத் தெளிவாகப் பிரதிபலிக்கிறது.
