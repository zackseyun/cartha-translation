  source_fidelity: எபிரெயத்தின் பகிர்ந்தளிக்கும் אִישׁ, விகிதத்தைக் குறிக்கும் இரு כְּ முன்னொட்டுகள், ‘கையின் கொடை’ என்ற மரபுத்தொடரின் பொருள், யாவே என்ற இறைப் பெயர், மற்றும் ‘உனக்குக் கொடுத்த’ என்ற தொடர்புத்தொடர் அனைத்தும் துல்லியமாகப் பிரதிபலிக்கப்படுகின்றன. ‘தன்னால் கொடுக்க முடிந்த அளவுக்கு’ என்பது இச்சூழலில் மַתְּנַת יָדוֹ-வின் இயல்பான பொருளைச் சரியாகத் தருகிறது; சொற்படியான உருவகம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
