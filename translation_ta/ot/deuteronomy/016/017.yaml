  terminology: ‘யாவே’ மூலத்தின் தனிப்பெயரைப் பாதுகாக்கிறது. ‘ஆசீர்வாதத்திற்கு ஏற்ப’ בְּרָכָה மற்றும் விகிதப் பொருளை முறையாகத் தருகிறது. ஆண்பால் ஒருமை மூலக் குறிப்பை ‘ஒவ்வொருவனும்’ காக்கிறது; எந்தக் கொள்கைச் சார்ந்த விளக்கமும் சேர்க்கப்படவில்லை.
