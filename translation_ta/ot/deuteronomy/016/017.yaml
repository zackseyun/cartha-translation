source:
  edition: WLC
  text: אִ֖ישׁ כְּ/מַתְּנַ֣ת יָד֑/וֹ כְּ/בִרְכַּ֛ת יְהוָ֥ה אֱלֹהֶ֖י/ךָ אֲשֶׁ֥ר נָֽתַן לָֽ/ךְ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/017.yaml
  text: Each man shall give according to the gift of his hand[a], according to the blessing of Yahweh your God that he has given you.
translation:
  language: ta
  text: ஒவ்வொருவனும் தன்னால் கொடுக்க முடிந்த அளவுக்கு[a], உன் கடவுளாகிய யாவே உனக்குக் கொடுத்த ஆசீர்வாதத்திற்கு ஏற்பக் கொடுக்க வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லுக்கு சொல், “அவனுடைய கையின் கொடைக்கு ஏற்ப.” இது ஒருவனிடம் கொடுப்பதற்கு இருப்பதையும் அவனால் கொடுக்க முடியும் அளவையும் குறிக்கும் மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ
  choice: ஒவ்வொருவனும்
  rationale: இங்கு ஒருமை ஆண்பால் பெயர்ச்சொல் பகிர்ந்தளிக்கும் பொருளில், ‘ஒவ்வொரு ஆணும்’ என்பதைக் குறிக்கிறது. இயல்பான தமிழில் அதன் ஆண்பால் குறிப்பும் பகிர்ந்தளிக்கும் வலிமையும் ‘ஒவ்வொருவனும்’ என்பதால் காக்கப்படுகின்றன.
- source_word: כְּמַתְּנַת יָדוֹ
  choice: தன்னால் கொடுக்க முடிந்த அளவுக்கு
  rationale: சொல்லுக்கு சொல் ‘அவனுடைய கையின் கொடைக்கு ஏற்ப’ என்று வரும் எபிரெய மரபுத்தொடர், ஒருவனிடம் கொடுப்பதற்கு இருப்பதையும் அவனால் கொடுக்க முடியும் அளவையும் குறிக்கிறது. தமிழில் இயல்பாகப் பொருளைத் தெரிவிக்கும் மொழிபெயர்ப்பு தேர்ந்தெடுக்கப்பட்டு, மூல உருவகம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: כְּבִרְכַּת
  choice: ஆசீர்வாதத்திற்கு ஏற்ப
  rationale: முன்னொட்டு כְּ விகிதம் அல்லது அளவுப்பொருத்தத்தைக் குறிக்கிறது; בְּרָכָה இங்கு கடவுள் அளித்த ஆசீர்வாதத்தை, சூழலில் குறிப்பாக அவர் அளித்த வளத்தை, குறிக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: நான்கு எழுத்துகளைக் கொண்ட கடவுளின் தனிப்பெயர் ஒரு பட்டத்தால் மாற்றப்படாமல், தமிழில் வழக்கமான ஒலிபெயர்ப்பான ‘யாவே’ என்று வழங்கப்படுகிறது.
- source_word: אֱלֹהֶיךָ
  choice: உன் கடவுளாகிய
  rationale: இரண்டாம் நபர் ஒருமை உடைமைத் தொடர்பைத் தெளிவாகக் காட்டி, ‘யாவே’ என்ற பெயருடன் இயல்பான தமிழ்த் தொடராக அமைகிறது.
- source_word: אֲשֶׁר נָתַן לָךְ
  choice: உனக்குக் கொடுத்த
  rationale: இறந்தகால வினைச்சொல்லையும், ‘ஆசீர்வாதம்’ என்பதைக் குறிக்கும் தொடர்புச் சொல்லையும் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூலத்தில் கடவுளின் தனிப்பெயர் நேரடியாக உள்ளது. ஆகவே அதை ஒரு பட்டமாக மாற்றாமல் ஒலிபெயர்த்து, உடன்படிக்கைப் பெயரின் தனித்தன்மை காக்கப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் மரியாதைமிக்க நடையிலும் வடிவமைக்கப்பட்டது. மூலத்தின் ஆண்பால் ஒருமை ‘ஒவ்வொருவனும்’ எனக் காக்கப்பட்டுள்ளது; கடினமாக ஒலிக்கும் எபிரெய மரபுத்தொடரின் பொருள் முதன்மை உரையில் தெளிவுபடுத்தப்பட்டு, அதன் சொற்படி உருவகம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
