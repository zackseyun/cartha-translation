base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/002.yaml
  text: And you shall sacrifice the Passover to Yahweh your God[a], from the flock and the herd, at the place that Yahweh will choose to make his name dwell there.
translation:
  language: ta
  text: உன் கடவுளாகிய யாவே தம் பெயரை அங்கே தங்கவைக்கத் தேர்ந்தெடுக்கும் இடத்தில், ஆட்டுமந்தையிலிருந்தும் மாட்டுமந்தையிலிருந்தும் பஸ்காவை யாவேக்கு பலியிட வேண்டும்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இங்கு ‘பஸ்கா’ என்பது ‘ஆட்டுமந்தையிலிருந்தும் மாட்டுமந்தையிலிருந்தும்’ என்பதுடன் இணைக்கப்பட்டுள்ளது. இது பஸ்காப் பலியை மட்டும் அல்லாமல், பஸ்கா மற்றும் புளிப்பில்லா அப்பப் பண்டிகையுடன் தொடர்புடைய மற்ற பண்டிகைப் பலிகளையும் உள்ளடக்கலாம் என்று சிலர் புரிந்துகொள்கிறார்கள்.
    reason: alternative_reading
lexical_decisions:
- source_word: וְזָבַחְתָּ
  choice: பலியிட வேண்டும்
  rationale: זבח என்பது பொதுவாகக் கொல்வதை அல்ல, பலிக்காக அறுத்துப் பலியிடுவதைக் குறிக்கிறது. ‘வேண்டும்’ என்பது இச்சூழலின் சட்டபூர்வமான கட்டளைத் தன்மையை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: פֶּסַח
  choice: பஸ்கா
  rationale: இந்தச் சொல் பஸ்கா அனுசரிப்பையோ அதன் பலிப்பொருளையோ குறிக்கலாம். ‘பலியிட’ என்ற வினை பலி சார்ந்த பொருளைத் தெளிவாக்குவதால், எபிரெய உரையின் சுருக்கத்தையும் பொருள் விரிவையும் ‘பஸ்கா’ காக்கிறது.
- source_word: לַיהוָה אֱלֹהֶיךָ
  choice: உன் கடவுளாகிய யாவேக்கு
  rationale: לְ என்பது பலி யாருக்கு அர்ப்பணிக்கப்படுகிறது என்பதைக் காட்டுகிறது. יהוה என்ற உடன்படிக்கைப் பெயர் ‘யாவே’ என்று ஒலிபெயர்க்கப்பட்டது.
- source_word: צֹאן וּבָקָר
  choice: ஆட்டுமந்தையிலிருந்தும் மாட்டுமந்தையிலிருந்தும்
  rationale: இரண்டு சொற்களும் தனித்தனி விலங்கு எண்ணிக்கைகளைவிட சிறுகால்நடை மந்தை மற்றும் மாட்டு மந்தை என்னும் கூட்டுப் பிரிவுகளைக் குறிக்கின்றன. தமிழில் இயல்பாக இருக்க, பலிப்பொருள் இம்மந்தைகளிலிருந்து எடுக்கப்படுகிறது என்ற மறைமுக உறவு ‘இலிருந்தும்’ மூலம் வெளிப்படுத்தப்பட்டது.
- source_word: בַּמָּקוֹם
  choice: இடத்தில்
  rationale: கடவுள் தேர்ந்தெடுக்கும் குறிப்பிட்ட வழிபாட்டுத் தலத்தை இயல்பாகக் குறிக்கிறது.
- source_word: אֲשֶׁר יִבְחַר יְהוָה
  choice: யாவே ... தேர்ந்தெடுக்கும்
  rationale: எபிரெய வினை மோசேயின் உரையுடன் ஒப்பிடும்போது வருங்காலத் தேர்வைக் குறிக்கிறது. தமிழில் சார்பு வினையெச்ச வடிவமான ‘தேர்ந்தெடுக்கும்’ காலத்தையும் வாக்கிய ஓட்டத்தையும் இயல்பாகத் தருகிறது.
- source_word: לְשַׁכֵּן שְׁמוֹ שָׁם
  choice: தமது பெயரை அங்கே தங்கியிருக்கச் செய்வதற்காக
  rationale: שכן என்பதன் ஹிஃபீல் வடிவம் காரணவினைப் பொருளைக் கொண்டது. ‘பெயர்’ மற்றும் ‘தங்கியிருக்கச் செய்தல்’ ஆகிய உருவகங்களைத் தக்கவைத்து, தெய்வீகப் பிரசன்னம் மற்றும் உரிமை சார்ந்த உடன்படிக்கை மொழியைத் தட்டையாக்காமல் பாதுகாக்கிறது.
theological_decisions:
- issue: יהוה என்ற தெய்வீகப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூல உரையில் நான்கெழுத்துத் தெய்வீகப் பெயர் நேரடியாக உள்ளது. அதனை ஒரு பட்டப்பெயராக மாற்றாமல், வெளிப்படுத்தப்பட்ட உடன்படிக்கைப் பெயராக ‘யாவே’ என்று வழங்குவது மூலத்தின் தனித்தன்மையைப் பாதுகாக்கிறது.
- issue: ‘ஆட்டுமந்தையும் மாட்டுமந்தையும்’ என்பதுடன் தொடர்புடைய ‘பஸ்கா’வின் பொருள் எல்லை
  choice: விரிவான கால்நடைக் குறிப்பை விளக்கி மாற்றாமல் மூல உரையின் சொற்றொடரைத் தக்கவைத்தல்
  alternative: ‘பஸ்காப் பலியையும் பண்டிகையுடன் தொடர்புடைய மற்ற பலிகளையும்’ என்று விளக்கமாக மொழிபெயர்த்தல்
  rationale: இவ்வசனத்தில் வரும் ‘ஆட்டுமந்தையும் மாட்டுமந்தையும்’ என்ற குறிப்பு பஸ்கா ஆட்டுக்குட்டி அல்லது வெள்ளாட்டுக்குட்டியை மட்டும் காட்டிலும் விரிவானதாகத் தோன்றுகிறது. இந்த இறுக்கத்தை முதன்மை உரையில் ஒத்திசைத்து அகற்றாமல், விளக்கக் குறிப்பில் அதன் சாத்தியமான பொருளைத் தெரிவிக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளும் வகையிலும் வேதாகமச் சட்ட மொழிக்குரிய கண்ணியத்துடனும் வடிவமைக்கப்பட்டது. ஒருமை இரண்டாம் நபர் ‘உன்’ என்று காக்கப்பட்டது; கடவுளைக் குறிக்கும் தற்சுட்டுப் பெயர் மரியாதை வடிவில் ‘தமது’ என வழங்கப்பட்டது.
