revisions:
- from: யாவே தமது பெயரை அங்கே தங்கியிருக்கச் செய்வதற்காகத் தேர்ந்தெடுக்கும் இடத்தில், உன் கடவுளாகிய யாவேக்கு ஆட்டுமந்தையிலிருந்தும் மாட்டுமந்தையிலிருந்தும் பஸ்காவைப்[a] பலியிட வேண்டும்.
  to: உன் கடவுளாகிய யாவே தம் பெயரை அங்கே தங்கவைக்கத் தேர்ந்தெடுக்கும் இடத்தில், ஆட்டுமந்தையிலிருந்தும் மாட்டுமந்தையிலிருந்தும் பஸ்காவை யாவேக்கு பலியிட வேண்டும்.[a]
  rationale: The revision improves modern Tamil flow and replaces an awkward causative construction with a concise natural equivalent. It preserves the source’s command form, the divine name, the broad livestock terminology, the disputed compact use of ‘Passover,’ and the explanatory footnote anchor.
