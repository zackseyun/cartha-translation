review_pass:
  verdict: revise
  source_fidelity: The draft accurately renders the command to offer the Passover to Yahweh, the livestock phrase, and the chosen-place formula. It also appropriately retains the broader wording ‘flock and herd’ rather than resolving the debated scope in the main text. The causative force of לְשַׁכֵּן is represented, though its Tamil expression can be made clearer.
  naturalness: The fronted purpose clause is understandable but heavily loaded, and ‘தமது பெயரை அங்கே தங்கியிருக்கச் செய்வதற்காக’ is less idiomatic in modern standard Tamil. ‘தம் பெயரை அங்கே தங்கவைக்கத்’ is more concise and natural while retaining the causative sense.
  terminology: ‘யாவே,’ ‘பஸ்கா,’ and ‘பலியிட வேண்டும்’ are suitable. ‘ஆட்டுமந்தையிலிருந்தும் மாட்டுமந்தையிலிருந்தும்’ faithfully conveys the source categories without prematurely narrowing them to individual species.
  issues:
  - severity: low
    issue: The expression for making the name dwell is cumbersome.
    rationale: ‘தமது பெயரை அங்கே தங்கியிருக்கச் செய்வதற்காக’ is grammatically possible, but ‘தம் பெயரை அங்கே தங்கவைக்கத்’ is clearer, more idiomatic Tamil and still reflects the Hiphil causative of שכן.
  - severity: low
    issue: Clause ordering obscures the main command slightly.
    rationale: Placing the full relative clause immediately before ‘இடத்தில்’ and then continuing with the sacrifice command provides a smoother Tamil sentence without changing the Hebrew relationships.
  revised_text: உன் கடவுளாகிய யாவே தம் பெயரை அங்கே தங்கவைக்கத் தேர்ந்தெடுக்கும் இடத்தில், ஆட்டுமந்தையிலிருந்தும் மாட்டுமந்தையிலிருந்தும் பஸ்காவை யாவேக்கு பலியிட வேண்டும்.[a]
