  text: וְ/זָ֣כַרְתָּ֔ כִּי עֶ֥בֶד הָיִ֖יתָ בְּ/מִצְרָ֑יִם וְ/שָׁמַרְתָּ֣ וְ/עָשִׂ֔יתָ אֶת הַֽ/חֻקִּ֖ים הָ/אֵֽלֶּה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/012.yaml
  text: Remember that you were a servant in Egypt[a], and keep and do these statutes.
translation:
  language: ta
  text: நீ எகிப்தில் அடிமையாக[a] இருந்ததை நினைவில் கொள்; இந்த நியமங்களைக் கடைப்பிடித்து அவற்றின்படி நட.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயச் சொல் பணியாளரையோ அடிமையையோ குறிக்கலாம்; எகிப்தில் இஸ்ரவேலர் அனுபவித்த கட்டாயப் பிணைப்பை இங்கு ‘அடிமை’ தெளிவாகக் காட்டுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזָכַרְתָּ
  choice: நினைவில் கொள்
  rationale: அறிவுறுத்தல் சூழலில் கட்டளை வலிமையைக் கொண்ட வினையாக உள்ளது; நவீனத் தமிழில் இயல்பாகவும் நேரடியாகவும் இதைத் தெரிவிக்கிறது.
- source_word: כִּי
  choice: இருந்ததை
  rationale: நினைவுகூர வேண்டிய கருத்தின் உள்ளடக்கத்தை அறிமுகப்படுத்துகிறது; தமிழில் தனிச் சொல் சேர்ப்பதைவிட வினைப்பெயர் அமைப்பில் இயல்பாக வெளிப்படுகிறது.
- source_word: עֶבֶד
  choice: அடிமை
  rationale: இச்சொல் பணியாளரையோ அடிமையையோ குறிக்கலாம்; ஆனால் எகிப்தில் இஸ்ரவேலர் அனுபவித்த கட்டாய அடிமைத்தனமே இங்கு முன்னிலையில் உள்ளது.
- source_word: הָיִיתָ
  choice: இருந்ததை
  rationale: கடந்தகால நிலையைக் குறிக்கும் எளிய, இயல்பான தமிழ் வடிவம்.
- source_word: בְּמִצְרָיִם
  choice: எகிப்தில்
  rationale: மூலத்தின் இடப்பொருளைச் சுருக்கமாகவும் நேரடியாகவும் தருகிறது.
- source_word: וְשָׁמַרְתָּ
  choice: கடைப்பிடித்து
  rationale: உடன்படிக்கைச் சட்டச் சூழலில் கட்டளைகளைப் பேணிக் கடைப்பிடிப்பதைச் சுட்டுகிறது.
- source_word: וְעָשִׂיתָ
  choice: அவற்றின்படி நட
  rationale: நியமங்களை வெறுமனே அறிந்திராமல் நடைமுறையில் செயல்படுத்த வேண்டும் என்ற இரண்டாவது வினையின் வலிமையை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: הַחֻקִּים
  choice: நியமங்கள்
  rationale: விதிக்கப்பட்ட சட்ட ஏற்பாடுகளைக் குறிக்கும் பொருத்தமான, பொதுவாகப் புரியும் தமிழ்ச் சொல்.
- source_word: הָאֵלֶּה
  choice: இந்த
  rationale: அருகிலுள்ள அல்லது தற்போது குறிப்பிடப்படும் நியமங்களைச் சுட்டும் நேரடியான வடிவம்.
theological_decisions:
- issue: எகிப்தில் இஸ்ரவேலரின் நிலையை விவரிக்கும் עֶבֶד என்பதன் மொழிபெயர்ப்பு
  choice: அடிமை
  alternative: பணியாளர்
  rationale: עֶבֶד என்பதற்கு இரு பொருள்களும் இருக்கலாம். எனினும், எகிப்திய ஒடுக்குமுறையையும் கட்டாயப் பிணைப்பையும் நினைவுகூரும் இச்சூழலில் ‘அடிமை’ என்பதே சமூக மற்றும் வரலாற்று உண்மையைத் தெளிவாகப் பிரதிபலிக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், ஒருமை இரண்டாம் நபருக்கான நேரடியான கட்டளை நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘கடைப்பிடித்து அவற்றின்படி நட’ என்பது மூலத்திலுள்ள ‘பேணி/காத்து’ மற்றும் ‘செய்’ என்ற இணை வினைகளின் வேறுபாட்டை இயல்பான தமிழில் தக்கவைக்கிறது.
