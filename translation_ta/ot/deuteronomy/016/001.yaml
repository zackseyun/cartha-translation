source:
  edition: WLC
  text: שָׁמוֹר֙ אֶת חֹ֣דֶשׁ הָ/אָבִ֔יב וְ/עָשִׂ֣יתָ פֶּ֔סַח לַ/יהוָ֖ה אֱלֹהֶ֑י/ךָ כִּ֞י בְּ/חֹ֣דֶשׁ הָֽ/אָבִ֗יב הוֹצִ֨יאֲ/ךָ֜ יְהוָ֧ה אֱלֹהֶ֛י/ךָ מִ/מִּצְרַ֖יִם לָֽיְלָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/001.yaml
  text: Observe the month of Abib[a], and keep the Passover to Yahweh your God, because in the month of Abib Yahweh your God brought you out from Egypt by night.
translation:
  language: ta
  text: ஆபிப் மாதத்தைக் கடைப்பிடி; உன் கடவுளாகிய யாவேக்குப் பஸ்காவைக் கொண்டாடு. ஏனெனில், ஆபிப் மாதத்தில் உன் கடவுளாகிய யாவே உன்னை எகிப்திலிருந்து இரவிலே வெளியே கொண்டுவந்தார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שָׁמוֹר
  choice: கடைப்பிடித்து
  rationale: இங்கு கட்டளை வடிவம் ஒரு நாட்காட்டி சார்ந்த புனிதக் காலத்தை கவனமாக அனுசரிப்பதைக் குறிக்கிறது; வெறுமனே நினைவில் வைத்திருப்பதை அல்ல.
- source_word: חֹדֶשׁ הָאָבִיב
  choice: ஆபிப் மாதம்
  rationale: אָבִיב முதிரத் தொடங்கிய தானியத்தையும் வசந்தக் காலத்தையும் குறிக்கலாம்; இச்சட்டச் சூழலில் அது வழிபாட்டு நாட்காட்டியின் மாதப் பெயராகச் செயல்படுவதால் ஒலிபெயர்க்கப்படுகிறது.
- source_word: וְעָשִׂיתָ פֶּסַח
  choice: பஸ்காவைக் கொண்டாடு
  rationale: சொல்லுக்குச் சொல் 'பஸ்காவைச் செய்' என்றிருந்தாலும், திருவிழாவை முறையாக அனுசரிப்பதை இயல்பான நவீனத் தமிழில் இவ்வாறு தெரிவிக்கலாம்.
- source_word: לַיהוָה
  choice: யாவேக்கு
  rationale: ל முன்னொட்டு இந்த அனுசரிப்பு யாவேக்கு உரியதாகவும் அவரை நோக்கியதாகவும் இருப்பதைக் காட்டுகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெயத் திருப்பெயரை ஒரு பொதுப் பட்டத்தால் மாற்றாமல், தமிழில் நேரடியாக ஒலிபெயர்க்கிறது.
- source_word: הוֹצִיאֲךָ
  choice: உன்னை வெளியே கொண்டுவந்தார்
  rationale: ஹிஃபில் வடிவத்தின் காரணவினைப் பொருளையும் எகிப்திலிருந்து புறப்படச் செய்த நிகழ்வையும் தெளிவாகப் பாதுகாக்கிறது.
- source_word: מִמִּצְרַיִם
  choice: எகிப்திலிருந்து
  rationale: מִן முன்னொட்டின் மூலத்திலிருந்து வெளியேறுதல் என்ற பொருளை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: לָיְלָה
  choice: இரவில்
  rationale: வெளியே கொண்டுவந்த நிகழ்வின் நேரத்தைச் சுருக்கமாகவும் இயல்பாகவும் குறிக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலத்தில் தனிப்பட்ட திருப்பெயர் நேரடியாக இடம்பெறுவதால், பட்டப்பெயராக மாற்றாமல் ஒலிபெயர்க்கப்பட்டது.
- issue: אָבִיב என்பதைப் பருவமாகவா மாதப் பெயராகவா கொள்வது
  choice: ஆபிப் என்ற நாட்காட்டிப் பெயர்
  alternative: வசந்த காலம்
  rationale: பஸ்கா குறித்த சட்டச் சூழலில் இச்சொற்றொடர் குறிப்பிட்ட வழிபாட்டு மாதத்தை அடையாளப்படுத்துகிறது; எனினும் அதன் தானியப் பருவப் பின்னணி அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சட்டக் கட்டளையின் வலிமையையும் புனிதமான தொனியையும் காக்கும் வகையில் மொழிபெயர்க்கப்பட்டது. ஒருமை இரண்டாம் நபர் உருபுகள் பாதுகாக்கப்பட்டுள்ளன; இறைப்பெயர் 'யாவே' என ஒலிபெயர்க்கப்பட்டுள்ளது.
