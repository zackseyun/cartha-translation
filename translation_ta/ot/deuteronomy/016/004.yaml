source:
  edition: WLC
  text: וְ/לֹֽא יֵרָאֶ֨ה לְ/ךָ֥ שְׂאֹ֛ר בְּ/כָל גְּבֻלְ/ךָ֖ שִׁבְעַ֣ת יָמִ֑ים וְ/לֹא יָלִ֣ין מִן הַ/בָּשָׂ֗ר אֲשֶׁ֨ר תִּזְבַּ֥ח בָּ/עֶ֛רֶב בַּ/יּ֥וֹם הָ/רִאשׁ֖וֹן לַ/בֹּֽקֶר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/004.yaml
  text: No leaven is to be seen with you within all your territory for seven days[b][a], and none of the flesh that you sacrifice in the evening on the first day shall remain overnight until morning.
translation:
  language: ta
  text: ஏழு நாட்களுக்கு உன் எல்லைக்குள் எங்கும் புளிப்பூட்டும் பொருள் காணப்படக் கூடாது. முதல் நாளின் மாலையில் நீ பலியிடும் இறைச்சியில்[a] எதுவும் காலைவரை மீதியாக இருக்கக்கூடாது.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'நேரடிப் பொருள்: “சதை.” எபிரெயச் சொல் பலி தொடர்பான சூழலில் பொதுவாக இறைச்சியைக் குறிக்கிறது.'
    reason: lexical_alternative
  - marker: b
    text: இங்குள்ள “முதல் நாள்” என்பது விழாவின் தொடக்கத்தில் செலுத்தப்படும் பஸ்காப் பலியைக் குறிப்பாகக் குறிக்கலாம்; ஆனால் எபிரெய உரை இங்கு “பஸ்கா ஆட்டுக்குட்டி” என்று வெளிப்படையாகச் சொல்லவில்லை.
    reason: alternative_reading
lexical_decisions:
- source_word: יֵרָאֶה
  choice: காணப்படக் கூடாது
  rationale: ראה என்பதன் நிஃபால் வடிவம் இங்கு செயப்பாட்டு பொருளில் வந்து தடையைத் தெரிவிக்கிறது; தமிழில் இயல்பாகவும் தெளிவாகவும் அதைப் பாதுகாக்கிறது.
- source_word: שְׂאֹר
  choice: புளிப்பூட்டும் பொருள்
  rationale: புளிக்கச் செய்யும் மாவுப்பொருளைக் குறிக்கிறது. சடங்குச் சூழலில் பொருளைத் தெளிவாகக் கூறுவதற்காக இச்சொற்றொடர் தேர்ந்தெடுக்கப்பட்டது.
- source_word: בְּכָל גְּבֻלְךָ
  choice: உன் எல்லைக்குள் எங்கும்
  rationale: גְּבוּל என்பது எல்லையையும் அதற்குள் உள்ள ஆட்சிப்பரப்பையும் குறிக்கலாம்; இங்கு முழுப் பரப்பையும் உள்ளடக்கும் இயல்பான தமிழ் வடிவம்.
- source_word: שִׁבְעַת יָמִים
  choice: ஏழு நாட்களுக்கு
  rationale: காலநீட்டத்தைக் குறிக்கும் எபிரெயச் சொற்றொடரை இயல்பான தமிழில் தருகிறது.
- source_word: יָלִין
  choice: இரவு முழுவதும் மீந்திருக்கக் கூடாது
  rationale: לין இங்கு மறுநாள் காலைவரை வைத்திருத்தல் அல்லது மீந்திருக்கச் செய்தல் என்ற தடையை உணர்த்துகிறது.
- source_word: מִן הַבָּשָׂר
  choice: இறைச்சியில் எதுவும்
  rationale: בָּשָׂר என்பதன் நேரடிப் பொருள் ‘சதை’; பலிச் சூழலில் உண்ணத்தக்க பலி இறைச்சியைக் குறிக்கும் இயல்பான தமிழ் ‘இறைச்சி’.
- source_word: אֲשֶׁר תִּזְבַּח
  choice: நீ பலியிடும்
  rationale: זבח பலிக்காக விலங்கைக் கொல்லுதல் அல்லது பலியாகச் செலுத்துதல் என்ற சடங்குச் செயலைக் குறிக்கிறது.
- source_word: בָּעֶרֶב
  choice: மாலையில்
  rationale: எபிரெய மூலத்தின் நேரக் குறிப்பை நேரடியாகவும் இயல்பாகவும் தருகிறது.
- source_word: בַּיּוֹם הָרִאשׁוֹן
  choice: முதல் நாளின்
  rationale: மூலம் ‘முதல் நாள்’ என்று மட்டுமே கூறுகிறது; ‘பண்டிகையின்’ போன்ற விளக்கச் சொல்லைச் சேர்க்காமல் அதன் தெளிவின்மையைப் பாதுகாக்கிறது.
- source_word: לַבֹּקֶר
  choice: காலைவரை
  rationale: இச்சூழலில் ל கால எல்லையைக் குறிக்கிறது; ‘காலைவரை’ என்பது தெளிவான தமிழ் இணை.
theological_decisions:
- issue: ‘முதல் நாளில்’ பலியிடப்படும் இறைச்சியின் குறிப்பு
  choice: முதன்மை உரையில் பொதுவாக ‘பலியிடும் இறைச்சி’ என்று வழங்கப்பட்டது.
  alternative: அதைப் பஸ்காப் பலி அல்லது பஸ்கா ஆட்டுக்குட்டி என்று குறிப்பாக விளக்குதல்; அல்லது தொடக்கநாள் விழாப் பலிகள் அனைத்தையும் குறிக்கும் எனக் கொள்ளுதல்.
  rationale: எபிரெய உரை ‘முதல் நாளின் மாலையில் நீ பலியிடும் இறைச்சி’ என்று மட்டுமே கூறுகிறது. அது பஸ்காப் பலியை மட்டும் குறிக்கிறதா அல்லது விழாவின் பிற பலிகளையும் குறிக்கிறதா என்பதை உரையே வெளிப்படையாகத் தீர்மானிக்காததால், அந்தத் தெளிவின்மை பாதுகாக்கப்பட்டது.
translation_notes:
  register: நவீன தரநிலைத் தமிழில், ஒருமை இரண்டாம் நபர் வடிவத்தைப் பாதுகாத்து, சட்டக் கட்டளையின் கண்ணியமான மற்றும் தெளிவான நடையில் மொழிபெயர்க்கப்பட்டது. மூலத்தில் இல்லாத ‘பண்டிகை’ அல்லது ‘பஸ்கா ஆட்டுக்குட்டி’ முதன்மை உரையில் சேர்க்கப்படவில்லை.
