base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/015.yaml
  text: For seven days you shall celebrate a feast to Yahweh your God in the place that Yahweh will choose[a], because Yahweh your God will bless you in all your produce and in all the work of your hands, and you shall be altogether joyful.
translation:
  language: ta
  text: ஏழு நாட்கள், யாவே தேர்ந்தெடுக்கும் இடத்தில் உன் கடவுளாகிய யாவேக்குப் பண்டிகை கொண்டாடு. ஏனெனில், உன் விளைச்சல் அனைத்திலும் மற்றும் உன் கைகளின் எல்லா உழைப்பிலும் உன் கடவுளாகிய யாவே உன்னை ஆசீர்வதிப்பார்; நீ முற்றிலும் மகிழ்ச்சியுடன் இருப்பாய்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இதனை, “நீ மகிழ்ச்சியுடன் மட்டுமே இருப்பாய்” அல்லது “நீ நிச்சயமாக மகிழ்வாய்” என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொற்றொடர் முழுமையான, கலப்பற்ற மகிழ்ச்சியை வலியுறுத்துகிறது.
    reason: אַךְ שָׂמֵחַ என்ற எபிரெயச் சொற்றொடரின் கட்டுப்படுத்தும் அல்லது வலியுறுத்தும் நிழற்பொருள்களைப் பாதுகாக்கும் சொற்பொருள் மாற்று.
lexical_decisions:
- source_word: תָּחֹג
  choice: பண்டிகை கொண்டாடு
  rationale: חגג என்பது பொதுவாக மகிழ்வதை மட்டும் குறிக்காமல், யாத்திரைப் பண்டிகையைக் கொண்டாடுவதைக் குறிக்கிறது. இத்தேர்வு பண்டிகைச் செயலையும் இயல்பான நவீன தமிழையும் காக்கிறது.
- source_word: לַיהוָה
  choice: யாவேக்குப்
  rationale: ל என்ற முன்னொட்டு பண்டிகை யாவேக்கு அர்ப்பணிக்கப்பட்டு அவரை நோக்கிக் கொண்டாடப்படுவதைச் சுட்டுகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய மூலத்தில் வரும் இறைத் தனிப்பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் அறியப்பட்ட ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: בַּמָּקוֹם אֲשֶׁר יִבְחַר יְהוָה
  choice: யாவே தேர்ந்தெடுக்கும் இடத்தில்
  rationale: இறைவன் தேர்ந்தெடுக்கும் வழிபாட்டு இடத்தை நெருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: பண்டிகையையும் மகிழ்ச்சியையும் கட்டளையிடுவதற்கான காரணத்தை இங்கு כִּי அறிமுகப்படுத்துகிறது.
- source_word: יְבָרֶכְךָ
  choice: உன்னை ஆசீர்வதிப்பார்
  rationale: ברך என்பதன் உடன்படிக்கைச் சார்ந்த ஆசீர்வாதப் பொருளைக் காக்கிறது; வெறும் பொருளாதாரச் செழிப்பாகக் குறுக்கவில்லை.
- source_word: תְּבוּאָתְךָ
  choice: உன் விளைச்சல்
  rationale: வேளாண் நிலத்தின் விளைபொருள் அல்லது மகசூல் என்ற பரந்த பொருளைத் தருகிறது; தானியத்திற்கு மட்டும் வரையறுக்கவில்லை.
- source_word: מַעֲשֵׂה יָדֶיךָ
  choice: உன் கைகளின் வேலை
  rationale: ஒருவருடைய உழைப்பையும் அதன் பயனையும் குறிக்கும் எபிரெய உருவகத்தை, தமிழிலும் புரியத்தக்க வடிவில் காக்கிறது.
- source_word: אַךְ שָׂמֵחַ
  choice: முற்றிலும் மகிழ்ச்சியாயிருப்பாய்
  rationale: אַךְ என்பதன் வலியுறுத்தலை முழுமையான மகிழ்ச்சியாக வெளிப்படுத்துகிறது; அதன் மாற்றான கட்டுப்படுத்தும் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைத் தனிப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூல உரை இறைத் தனிப்பெயரை நேரடியாகப் பயன்படுத்துவதால், பட்டப்பெயரைப் பதிலிடாமல் தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளது.
- issue: וְהָיִיתָ אַךְ שָׂמֵחַ என்ற இறுதிக் கூற்றின் வலிமை
  choice: நீ முற்றிலும் மகிழ்ச்சியாயிருப்பாய்
  alternative: நீ மகிழ்ச்சியாயே இருப்பாய்; நீ நிச்சயமாக மகிழ்வாய்
  rationale: אַךְ என்பது ‘மட்டுமே’ என்ற கட்டுப்படுத்தும் நிழற்பொருளையோ வலியுறுத்தும் பொருளையோ தரலாம். சூழலில் நிறைவான, கலப்பற்ற மகிழ்ச்சி முதன்மைப்படுத்தப்பட்டாலும், உண்மையான மொழியியல் இருபொருள்தன்மை அடிக்குறிப்பில் தெரிவிக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன தரத் தமிழில், ஒருமை முன்னிலையைத் தொடர்ந்து ‘உன்/உன்னை’ பயன்படுத்துகிறது. கட்டளையின் நேரடித்தன்மையும், பண்டிகைச் சூழலின் கண்ணியமான தொனியும் காக்கப்பட்டுள்ளன. ‘கைகளின் வேலை’ என்ற செமித்திய உருவகம் புரியத்தக்கதாக இருப்பதால் தக்கவைக்கப்பட்டுள்ளது.
