base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/020.yaml
  text: Justice[a], justice you shall pursue[b], so that you may live and possess the land that Yahweh your God is giving you.
translation:
  language: ta
  text: நீதியையே, நீதியையே நீ நாட வேண்டும்[a]; நீ வாழ்வதற்கும், உன் கடவுளாகிய யாவே உனக்குக் கொடுக்கிற நாட்டை உரிமையாகப் பெறுவதற்கும்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘நேர்மையையே, நேர்மையையே நீ நாட வேண்டும்’ என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் צֶדֶק நீதி மற்றும் நேர்மை ஆகிய இரு பொருள்களையும் தரலாம்; இங்குள்ள சட்டச் சூழலுக்கு ‘நீதி’ பொருத்தமானது.
    reason: lexical_alternative
  - marker: b
    text: ‘நாட்டைச் சுதந்தரித்துக்கொள்வதற்கும்’ என்றும் மொழிபெயர்க்கலாம். எபிரெய வினைச்சொல் ירשׁ சுதந்தரித்தல் அல்லது உடைமையாகப் பெறுதல் என்ற பொருள்களைக் கொள்ளலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: צֶדֶק צֶדֶק
  choice: நீதியையே, நீதியையே
  rationale: சட்டம் மற்றும் நீதிபதிகள் குறித்த உடனடிச் சூழலில் צֶדֶק என்பதன் பொது-நீதித்துறை சார்ந்த பொருளை ‘நீதி’ தெளிவாக வெளிப்படுத்துகிறது. இரட்டிப்பு தரும் வலியுறுத்தலைத் தமிழிலும் அப்படியே காக்க ‘-யையே’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: תִּרְדֹּף
  choice: நீ நாட வேண்டும்
  rationale: רדף என்பதன் அடிப்படை உணர்வு தீவிரமாகப் பின்தொடர்வது அல்லது நாடுவது. ‘நாட வேண்டும்’ என்பது கட்டளையின் வலிமையையும் இயல்பான நவீன தமிழையும் காக்கிறது.
- source_word: לְמַעַן תִּחְיֶה
  choice: அப்போது நீ வாழ்வாய்
  rationale: לְמַעַן நோக்கம் அல்லது விளைவைக் குறிக்கலாம். இங்கு கட்டளையுடன் உடன்படிக்கை விளைவை இயல்பாக இணைக்க ‘அப்போது’ பயன்படுத்தப்பட்டுள்ளது; תִּחְיֶה நேரடியாக ‘நீ வாழ்வாய்’ என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: וְיָרַשְׁתָּ
  choice: நீ உரிமையாக்கிக்கொள்வாய்
  rationale: ירשׁ என்பது உரிமையாகப் பெறுதல், உடைமையாக்குதல், சுதந்தரித்தல் ஆகிய பொருள்களைக் கொள்ளலாம். கொடுக்கப்படும் நாட்டைப் பெற்று உடைமையாக்கும் கருத்தை ‘உரிமையாக்கிக்கொள்வாய்’ வெளிப்படுத்துகிறது.
- source_word: הָאָרֶץ
  choice: நாட்டை
  rationale: இங்கு குறிப்பிட்ட வாக்குத்தத்த நிலப்பரப்பைக் குறிக்கிறது. தமிழில் ‘நாடு’ இயல்பாகவும் தெளிவாகவும் உள்ளது; ‘நிலம்’ என்பது வெறும் மண்ணாகப் புரிந்துகொள்ளப்படலாம்.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: எபிரெய தனிப்பெயரான יהוה-ஐ ஒரு பொதுப் பட்டத்தால் மாற்றாமல், தமிழில் பரவலாக அறியப்பட்ட தனிப்பெயர் வடிவமான ‘யெகோவா’ என வழங்குகிறது.
- source_word: אֱלֹהֶיךָ
  choice: உன் கடவுளாகிய
  rationale: இரண்டாம் நபர் ஒருமை உடைமைப் பின்னொட்டைத் துல்லியமாகக் காத்து, தமிழில் இயல்பான பெயரடைத் தொடராக அமைக்கப்பட்டுள்ளது.
- source_word: נֹתֵן לָךְ
  choice: உனக்குக் கொடுக்கிற
  rationale: நிகழ்காலப் பங்கேற்புவினையின் தொடரும் அல்லது சமீபமாக நிகழவிருக்கும் கொடை உணர்வை நவீன தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: நீதித்துறைச் சூழலில் צֶדֶק என்பதன் மொழிபெயர்ப்பு
  choice: நீதி
  alternative: நேர்மை
  rationale: முந்தைய வசனங்களில் நீதிபதிகள், பாகுபாடு, லஞ்சம் ஆகியவை பேசப்படுவதால், இங்கு நீதியின் பொது மற்றும் சட்டவியல் பரிமாணமே முதன்மையானது. இருப்பினும் எபிரெயச் சொல்லின் ஒழுக்கநெறி சார்ந்த பரந்த பொருள் அடிக்குறிப்பில் காக்கப்படுகிறது.
- issue: יהוה என்ற இறைபெயரின் வடிவம்
  choice: யெகோவா
  alternative: யாவே
  rationale: இது ‘ஆண்டவர்’ போன்ற பட்டப்பெயர் அல்ல, தனிப்பட்ட உடன்படிக்கைப் பெயர் என்பதை உரையில் காக்கிறது. எபிரெய உச்சரிப்பு உறுதியாகத் தெரியாததால் பரவலாக அறியப்பட்ட தமிழ் வடிவம் தேர்ந்தெடுக்கப்பட்டு மாற்று ஒலிபெயர்ப்பு அடிக்குறிப்பில் குறிப்பிடப்பட்டுள்ளது.
- issue: לְמַעַן என்பதில் நோக்கம் மற்றும் விளைவு
  choice: அப்போது
  alternative: அதனால் / அப்படி நீ வாழும்படி
  rationale: எபிரெய இணைப்புச் சொல் நோக்கத்தையும் விளைவையும் தாங்கக்கூடும். ‘அப்போது’ கட்டளைக்குப் பின்வரும் உடன்படிக்கை விளைவைத் தெரிவிக்கிறது; கடுமையான காரண-விளைவு இயந்திரத்தன்மையைச் சேர்ப்பதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் வடிவமைக்கப்பட்டுள்ளது. எபிரெய ஒருமை ஆண்பால் முகவரியைத் தமிழின் பாலினம் குறிக்காத ‘நீ/உன்’ வடிவங்கள் இயல்பாகக் காக்கின்றன. வலியுறுத்தும் இரட்டிப்பு நீக்கப்படவில்லை; இறைபெயர் பட்டப்பெயராக மாற்றப்படவில்லை.
