revisions:
- from: நீதியையே, நீதியையே நீ நாட வேண்டும்[a]. அப்போது நீ வாழ்வாய்; உன் கடவுளாகிய யெகோவா உனக்குக் கொடுக்கிற நாட்டை நீ உரிமையாக்கிக்கொள்வாய்[b].
  to: நீதியையே, நீதியையே நீ நாட வேண்டும்[a]; நீ வாழ்வதற்கும், உன் கடவுளாகிய யாவே உனக்குக் கொடுக்கிற நாட்டை உரிமையாகப் பெறுவதற்கும்[b].
