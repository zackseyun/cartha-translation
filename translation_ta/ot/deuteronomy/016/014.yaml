base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/014.yaml
  text: And you shall rejoice in your festival—you and your son and your daughter[a], and your male servant and your female servant, and the Levite, and the sojourner, and the fatherless, and the widow[d][c][b], who are within your gates.
translation:
  language: ta
  text: உன் பண்டிகையில்[a] நீ மகிழ்வாயாக—நீயும், உன் மகனும், உன் மகளும், உன் ஆண் அடிமையும், உன் பெண் அடிமையும், உன் வாசல்களுக்குள் இருப்பவர்களான லேவியரும், அந்நியக் குடியிருப்பாளரும்[b], தந்தையற்றவரும்[c], விதவையும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “உன் பண்டிகையின்போது” என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் பண்டிகையையோ பண்டிகைக் கொண்டாட்டத்தையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “அந்நியக் குடியிருப்பாளர்” என்பது இஸ்ரவேலரல்லாதவராக இருந்தும் அவர்களிடையே வசிப்பவரைக் குறிக்கிறது; “குடியிருக்கும் அந்நியர்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: “அனாதை” என்றும் மொழிபெயர்க்கலாம். இங்கு “தந்தையற்றவர்” என்பது தோரா சட்டத்தில் பாதுகாப்பற்ற சமூக நிலையைக் குறிப்பாக எடுத்துக்காட்டுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׂמַחְתָּ
  choice: நீ மகிழ்வாயாக
  rationale: சட்ட அறிவுறுத்தலின் சூழலில் கட்டளைப் பொருள்படும் எபிரெய வினை வடிவத்தை, நவீனத் தமிழில் கண்ணியமான கட்டளை நடையாக வழங்குகிறது.
- source_word: בְּחַגֶּךָ
  choice: உன் பண்டிகையில்
  rationale: חַג என்பது யாத்திரைப் பண்டிகையையும் அதன் கொண்டாட்டத்தையும் குறிக்கிறது; ‘பண்டிகை’ இச்சூழலில் இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: וְעַבְדְּךָ וַאֲמָתֶךָ
  choice: உன் ஆண் அடிமையும் பெண் அடிமையும்
  rationale: இரு சொற்களும் பாலின வேறுபாட்டுடன் சார்புநிலையிலுள்ள அடிமைகளைக் குறிக்கின்றன; ‘வேலைக்காரர்’ என்று மென்மையாக்காமல் சமூக நிலையை வெளிப்படுத்துகிறது.
- source_word: וְהַלֵּוִי
  choice: லேவியரும்
  rationale: லேவி கோத்திரத்தைச் சேர்ந்தவருக்கான வழக்கமான தமிழ் பெயர்ப்பு.
- source_word: וְהַגֵּר
  choice: அந்நியக் குடியிருப்பாளரும்
  rationale: இஸ்ரவேலரல்லாதவராக இருந்தும் அவர்களிடையே நிலையாக வசித்த சட்ட-சமூகப் பிரிவைத் தெளிவாகக் குறிக்கிறது.
- source_word: וְהַיָּתוֹם
  choice: தந்தையற்றவரும்
  rationale: தந்தையின் பாதுகாப்பை இழந்ததால் ஏற்பட்ட சமூகப் பாதிப்பை எபிரெயச் சொல் முன்னிறுத்துகிறது.
- source_word: וְהָאַלְמָנָה
  choice: விதவையும்
  rationale: கணவனை இழந்த சமூகப் பிரிவைக் குறிக்கும் நேரான, வழக்கமான பெயர்ப்பு.
- source_word: אֲשֶׁר בִּשְׁעָרֶיךָ
  choice: அதாவது உன் வாசல்களுக்குள் வாழ்கிற அனைவரும்
  rationale: ‘வாசல்கள்’ என்ற எபிரெய உருவகத்தைத் தக்கவைத்து, அது அங்கு வசிப்பவர்களைச் சுட்டுவதைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: עֶבֶד / אָמָה என்ற சார்புநிலை வீட்டாரைக் குறிக்கும் சொற்கள்
  choice: ஆண் அடிமை / பெண் அடிமை
  alternative: ஆண் வேலைக்காரன் / பெண் வேலைக்காரி
  rationale: உரையின் பண்டைய சமூக உண்மையையும் பிணைக்கப்பட்ட நிலையையும் மறைக்காமல் காட்டுகிறது; பொதுவான ஊழியத்தைக் குறிக்கும் சொற்களாக மென்மையாக்கவில்லை.
- issue: גֵּר என்பவரின் சமூக அடையாளம்
  choice: அந்நியக் குடியிருப்பாளர்
  alternative: அந்நியன் / பரதேசி
  rationale: இஸ்ரவேலரிடையே வசிக்கும் இஸ்ரவேலரல்லாத நபர் என்ற சட்ட-சமூகப் பொருளைப் பாதுகாக்கிறது; நவீன குடியேற்றச் சட்டப் பிரிவுகளைத் திணிக்கவில்லை.
- issue: יָתוֹם என்பதன் சமூக நுணுக்கம்
  choice: தந்தையற்றவர்
  alternative: அனாதை
  rationale: தோரா சட்டத்தில் தந்தையின் பாதுகாப்பை இழந்ததால் உண்டாகும் பாதிப்பை முன்னிறுத்துகிறது; ‘அனாதை’ என்ற பரந்த பொருளையும் அடிக்குறிப்பில் தருகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகருக்கு விளங்கும் கண்ணியமான சட்ட-அறிவுறுத்தல் நடை பயன்படுத்தப்பட்டுள்ளது. ஒருமை இரண்டாம் நபர் உரை பாதுகாக்கப்பட்டு, பட்டியலில் உள்ள அனைவரும் மகிழ்ச்சியில் பங்கேற்பது தமிழில் தெளிவாகத் தெரிவதற்காக இறுதியில் பன்மை வினை சேர்க்கப்பட்டுள்ளது. எபிரெயத்தின் சமூகப் பிரிவுகள் மென்மையாக்கப்படாமல், தேவையான விளக்கங்கள் அடிக்குறிப்புகளில் வழங்கப்பட்டுள்ளன.
