  text: חַ֧ג הַ/סֻּכֹּ֛ת תַּעֲשֶׂ֥ה לְ/ךָ֖ שִׁבְעַ֣ת יָמִ֑ים בְּ/אָ֨סְפְּ/ךָ֔ מִֽ/גָּרְנְ/ךָ֖ וּ/מִ/יִּקְבֶֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/013.yaml
  text: You shall keep the Feast of Booths for seven days[a], when you gather in from your threshing floor and from your winepress.
translation:
  language: ta
  text: நீ ஏழு நாட்கள் கூடாரத் திருவிழாவைக்[a] கொண்டாட வேண்டும்; உன் போரடிக்கும் களத்திலிருந்தும் உன் திராட்சை பிழியும் ஆலையிலிருந்தும் விளைச்சலைச் சேர்த்துக்கொள்ளும்போது இவ்விழாவைக் கொண்டாடு.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘குடில்களின் திருவிழா’ என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் தற்காலிகக் கூடாரங்கள் அல்லது குடில்களை நேரடியாகக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: חַג הַסֻּכֹּת
  choice: கூடாரத் திருவிழா
  rationale: חַג என்பது விழாவைக் குறிக்கிறது; סֻכּוֹת என்பது தற்காலிகக் கூடாரங்கள் அல்லது குடில்கள் என்பதன் பன்மை. இயல்பான நவீன தமிழில் பொருளைத் தெளிவாகச் சொல்லும் மரபுப் பெயராக ‘கூடாரத் திருவிழா’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: תַּעֲשֶׂה לְךָ
  choice: கொண்டாட வேண்டும்
  rationale: מעשה என்பதன் அடிப்படைப் பொருள் ‘செய்/உண்டாக்கு’; ஆனால் חַג உடன் வரும் விழாச் சட்டச் சூழலில் ஒரு விழாவைக் கடைப்பிடித்தல் அல்லது கொண்டாடுதல் என்று பொருள். கட்டளையின் வலிமையை ‘வேண்டும்’ தக்கவைக்கிறது.
- source_word: שִׁבְעַת יָמִים
  choice: ஏழு நாட்கள்
  rationale: கால அளவை நேரடியாகவும் இயல்பாகவும் குறிக்கிறது.
- source_word: בְּאָסְפְּךָ
  choice: விளைச்சலைச் சேர்த்துக்கொள்ளும்போது
  rationale: ב + אסף என்னும் அமைப்பு காலத்தைக் குறிக்கிறது. ‘சேர்த்துக்கொள்ளும்போது’ என்பது ‘சேர்த்த பின்பு’ என்று தேவையின்றி வரிசையைத் தீர்மானிக்காமல் எபிரெய உரையின் காலத் தொடர்பைத் தக்கவைக்கிறது; ‘விளைச்சலை’ என்பது களம் மற்றும் திராட்சை ஆலை கூறும் அறுவடைச் சூழலைத் தமிழில் தெளிவாக்குகிறது.
- source_word: מִגָּרְנְךָ
  choice: உன் களத்திலிருந்து
  rationale: גֹּרֶן என்பது தானியத்தைப் போரடிக்கும் களம். ‘களம்’ சுருக்கமாகவும் இயல்பாகவும் அந்த இடத்தைக் குறிக்கிறது; பொருளை பொதுவான ‘அறுவடை’ என்பதாக மட்டும் மாற்றவில்லை.
- source_word: וּמִיִּקְבֶךָ
  choice: உன் திராட்சை ஆலையிலிருந்து
  rationale: יֶקֶב என்பது திராட்சையைப் பிழியும் ஆலை அல்லது அதனுடன் சேர்ந்த தொட்டி. நவீன வாசகருக்குத் தெளிவாக ‘திராட்சை ஆலை’ பயன்படுத்தப்பட்டது.
