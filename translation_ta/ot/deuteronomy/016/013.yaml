translation_notes:
  register: நவீன நிலையான தமிழில், ஒருமை இரண்டாம் நபர் கட்டளை வடிவம் தக்கவைக்கப்பட்டது. மூலத்தின் உறுதியான சட்டத் தொனிக்காக ‘வேண்டும்’ பயன்படுத்தப்பட்டது. தமிழ் வாக்கியத் தெளிவுக்காக இறுதியில் ‘அதைக் கொண்டாடு’ மீண்டும் கூறப்பட்டுள்ளது; இது புதிய கட்டளையைச் சேர்ப்பதல்ல, நீண்ட காலவினையெச்சத் தொடருக்குப் பின் முதன்மை வினையைத் தெளிவுபடுத்துகிறது.
