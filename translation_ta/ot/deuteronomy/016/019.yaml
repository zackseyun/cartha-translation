review_pass:
  verdict: revise
  source_fidelity: 'The draft accurately renders all three prohibitions and preserves the causal imagery: a bribe blinds the wise and distorts the words (or legally, the case) of the righteous. The ambiguity of דִּבְרֵי צַדִּיקִם is appropriately retained in the footnote.'
  naturalness: ‘நீதியைப் புரட்டாதீர்கள்’ is understandable, but it more readily suggests overturning justice than bending or perverting its proper course. ‘நீதியைத் திரிக்காதீர்கள்’ is more idiomatic in modern Tamil for corrupting or distorting justice in a judicial setting.
  terminology: ‘பாரபட்சம்,’ ‘கையூட்டு,’ ‘ஞானிகள்,’ and ‘நீதிமான்கள்’ are suitable modern-standard Tamil choices. ‘கையூட்டு’ clearly carries the corrupt-payment sense of שֹׁחַד. The footnotes accurately explain the Hebrew idiom and the legal semantic range of ‘words.’
  issues:
  - severity: low
    issue: The first prohibition uses ‘புரட்டாதீர்கள்.’
    rationale: Although defensible, ‘புரட்டுதல்’ can suggest overturning rather than the Hebrew sense of bending, turning aside, or perverting justice. Replacing it with ‘திரிக்காதீர்கள்’ more directly preserves the forensic force in natural modern Tamil.
  revised_text: நீதியைத் திரிக்காதீர்கள்; பாரபட்சம் காட்டாதீர்கள்[a]; கையூட்டு வாங்காதீர்கள். ஏனெனில், கையூட்டு ஞானிகளின் கண்களைக் குருடாக்கி, நீதிமான்களின் சொற்களைத் திரித்துவிடும்[b].
