  text: לֹא תַטֶּ֣ה מִשְׁפָּ֔ט לֹ֥א תַכִּ֖יר פָּנִ֑ים וְ/לֹא תִקַּ֣ח שֹׁ֔חַד כִּ֣י הַ/שֹּׁ֗חַד יְעַוֵּר֙ עֵינֵ֣י חֲכָמִ֔ים וִֽ/יסַלֵּ֖ף דִּבְרֵ֥י צַדִּיקִֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/019.yaml
  text: You shall not pervert justice[a]; you shall not show partiality; and you shall not take a bribe[b], for the bribe blinds the eyes of the wise and twists the words of the righteous.
translation:
  language: ta
  text: நீதியைத் திரிக்காதீர்கள்; பாரபட்சம் காட்டாதீர்கள்[a]; கையூட்டு வாங்காதீர்கள். ஏனெனில், கையூட்டு ஞானிகளின் கண்களைக் குருடாக்கி, நீதிமான்களின் சொற்களைத் திரித்துவிடும்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரேயத்தில் சொல்லர்த்தமாக, “முகங்களை அறியாதீர்கள்”; இது ஒருவருக்குச் சலுகை காட்டுவதையோ பாரபட்சமாக நடப்பதையோ குறிக்கும் மரபுத்தொடர்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “நீதிமான்களின் வழக்கைத் திரித்துவிடும்.” எபிரேயச் சொல் அவர்களுடைய சொற்களையோ, சட்டச் சூழலில் அவர்களுடைய வாதம் அல்லது வழக்கையோ குறிக்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: תַטֶּה מִשְׁפָּט
  choice: நீதியைப் புரட்டாதீர்கள்
  rationale: נטה என்பதன் ஹிஃபில் வடிவம், நீதித்தீர்ப்பை நேரிய வழியிலிருந்து விலக்குவதைக் குறிக்கிறது. ‘நீதியைப் புரட்டுதல்’ என்பது சட்டச் சூழலின் வலிமையை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: תַכִּיר פָּנִים
  choice: பாரபட்சம் காட்டாதீர்கள்
  rationale: சொல்லர்த்தமாக ‘முகங்களை அறிதல்’ என்ற எபிரேய மரபுத்தொடர், தீர்ப்பில் ஒருவருக்குச் சலுகை காட்டுவதைக் குறிக்கிறது. தமிழில் ‘பாரபட்சம் காட்டுதல்’ அதன் பொருளைத் தெளிவாகத் தருகிறது.
- source_word: שֹׁחַד
  choice: கையூட்டு
  rationale: இச்சட்டச் சூழலில், தீர்ப்பைத் தவறாகச் செல்வாக்கு செய்ய வழங்கப்படும் லஞ்சத்தைச் சொல் குறிக்கிறது. ‘கையூட்டு’ நவீனத் தமிழில் இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: יְעַוֵּר עֵינֵי חֲכָמִים
  choice: ஞானிகளின் கண்களைக் குருடாக்கி
  rationale: மூலத்தின் தெளிவான உருவகத்தையும் காரண விளைவையும் நேரடியாகப் பாதுகாக்கிறது.
- source_word: חֲכָמִים
  choice: ஞானிகள்
  rationale: இங்கு ஆண்பால் பன்மை பொதுவாக ஞானமுள்ளவர்களைக் குறிக்கிறது; ‘ஞானிகள்’ தமிழில் பாலினத்தைத் தனிப்பட வலியுறுத்தாமல் பொருளை வழங்குகிறது.
- source_word: וִיסַלֵּף דִּבְרֵי צַדִּיקִם
  choice: நீதிமான்களின் சொற்களைத் திரித்துவிடும்
  rationale: סלף என்பது திரித்தல் அல்லது சிதைத்தலைக் குறிக்கிறது. דִּבְרֵי என்பதற்கு ‘சொற்கள்’ என்றும், நீதிமன்றச் சூழலில் ‘வாதம்/வழக்கு’ என்றும் பொருள் கொள்ளலாம்; முதன்மை உரை சொல்லுக்கு நெருக்கமான பொருளை வைத்துக்கொண்டு மாற்றுப் பொருளை அடிக்குறிப்பில் தருகிறது.
- source_word: צַדִּיקִם
  choice: நீதிமான்கள்
  rationale: இச்சொல் ஒழுக்க ரீதியாக நீதியுள்ளவர்களையோ சட்ட ரீதியாக நியாயம் அவர்கள் பக்கம் உள்ளவர்களையோ குறிக்கலாம். ‘நீதிமான்கள்’ இந்த விரிவை ‘குற்றமற்றவர்கள்’ என்பதைக் காட்டிலும் நன்றாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: דִּבְרֵי צַדִּיקִם என்பதன் வரம்பு
  choice: நீதிமான்களின் சொற்கள்
  alternative: நீதிமான்களின் வழக்கு / நியாயமானவர்களின் வாதம்
  rationale: மூலத்தின் நேரடியான சொற்பொருளை முதன்மை உரையில் வைத்துள்ளோம்; சட்டச் சூழலில் சாத்தியமான விரிவான பொருளை அடிக்குறிப்பில் குறிப்பிட்டு உண்மையான தெளிவின்மையைப் பாதுகாத்துள்ளோம்.
translation_notes:
  register: நவீன நிலையான தமிழில், நீதித்துறைச் சூழலுக்கேற்ற கண்ணியமான நேரடி கட்டளைநடை பயன்படுத்தப்பட்டுள்ளது. ‘பாரபட்சம்’, ‘கையூட்டு’ போன்ற பொதுவாகப் புரியும் சொற்கள் தேர்ந்தெடுக்கப்பட்டுள்ளன; மூலத்தின் ‘கண்களைக் குருடாக்குதல்’ மற்றும் ‘சொற்களைத் திரித்தல்’ ஆகிய உருவகங்கள் பாதுகாக்கப்பட்டுள்ளன.
