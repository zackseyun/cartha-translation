base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/021.yaml
  text: You shall not plant for yourself an Asherah of any kind of tree beside the altar of Yahweh your God that you make for yourself[a].
translation:
  language: ta
  text: நீ உனக்காக, அசேராவாக எந்த மரத்தையும், உன் கடவுளாகிய யாவேக்காக நீ அமைக்கும் பலிபீடத்தின் அருகில் நடக்கக்கூடாது.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அசேரா கம்பம்’. எபிரெயச் சொல் אֲשֵׁרָה, அசேரா என்னும் பெண் தெய்வத்தை மட்டுமல்லாமல், அவளுடன் தொடர்புடைய ஒரு வழிபாட்டுப் பொருளையும் குறிக்கலாம்.
    reason: மாற்று வாசிப்பையும் எபிரெயச் சொல்லின் பொருள் தெளிவின்மையையும் பதிவு செய்தல்.
lexical_decisions:
- source_word: תִטַּע
  choice: நடக் கூடாது
  rationale: נטע என்பதன் வழக்கமான பொருள் ‘நடு’. வழிபாட்டுப் பொருளை நிறுவுவது என்ற பொருள் இங்கு சாத்தியமானாலும், எபிரெய உரையிலுள்ள மரம் நடும் உருவகத்தையும் வழிபாட்டுச் சூழலையும் ‘நடு’ பாதுகாக்கிறது.
- source_word: אֲשֵׁרָה
  choice: அசேரா
  rationale: இச்சொல் அசேரா என்னும் பெண் தெய்வத்தையோ, அவளோடு தொடர்புடைய வழிபாட்டுப் பொருளையோ குறிக்கலாம். ‘அசேரா’ என்ற ஒலிபெயர்ப்பு இந்தப் பொருள் தெளிவின்மையைத் தீர்த்துவிடாமல் பாதுகாக்கிறது.
- source_word: כָּל עֵץ
  choice: எந்த வகை மரத்தினாலான
  rationale: சொல்லுக்குச் சொல் ‘எந்த/எல்லா மரமும்’. அசேராவுக்கும் மரத்துக்கும் உள்ள நெருங்கிய தொடர்பை இயல்பான தமிழில் காட்டுவதற்காக இவ்வாறு மொழிபெயர்க்கப்பட்டது; அசேரா வெறும் கம்பம் மட்டுமே என்று முதன்மை உரை கட்டுப்படுத்தவில்லை.
- source_word: אֵצֶל
  choice: அருகில்
  rationale: אֵצֶל இடத்தின் நெருக்கத்தைக் குறிக்கிறது. சட்டத் தடையில் ‘அருகில்’ தெளிவான, இயல்பான தமிழாகும்.
- source_word: מִזְבַּח
  choice: பலிபீடம்
  rationale: מזבח என்பதற்கான வழக்கமான தமிழ் வேதாகமச் சொல்; பலி செலுத்தப்படும் பீடத்தைத் தெளிவாகக் குறிக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரான நான்கு எழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் அறியப்பட்ட ஒலிபெயர்ப்பாக அளிக்கிறது.
- source_word: אֱלֹהֶיךָ
  choice: உன் கடவுளாகிய
  rationale: இரண்டாம் நபர் ஒருமை உடைமைப் பின்னொட்டைத் தக்கவைத்து, தமிழில் அடுத்துவரும் ‘யாவே’யுடன் இயல்பாக இணைக்கிறது.
- source_word: אֲשֶׁר תַּעֲשֶׂה לָּךְ
  choice: உனக்காக நீ அமைக்கும்
  rationale: עשה என்பது பொதுவாக ‘செய்/உருவாக்கு’ எனப் பொருள்படும். இங்கு பலிபீடம் சூழலில் ‘அமைக்கும்’ இயல்பானது; לָּךְ என்பதன் தன்நோக்குப் பொருளை ‘உனக்காக’ பாதுகாக்கிறது.
theological_decisions:
- issue: אֲשֵׁרָה என்பது பெண் தெய்வத்தின் பெயரா அல்லது அவளுடன் தொடர்புடைய வழிபாட்டுப் பொருளா?
  choice: முதன்மை உரையில் ‘அசேரா’ என்று ஒலிபெயர்த்து, மரத்துடனான தொடர்பை வாக்கியத்திலேயே காட்டுதல்.
  alternative: ‘அசேரா கம்பம்’ அல்லது ‘அசேராவின் மரச்சிலை’ என்று குறிப்பாக மொழிபெயர்த்தல்.
  rationale: எபிரெயச் சொல் இச்சூழலில் பெண் தெய்வத்தையோ, அவளுடைய அடையாளமாகிய மரம்/மரப்பொருளையோ குறிக்கக்கூடும். ஒலிபெயர்ப்பு இந்த இறையியல் மற்றும் வரலாற்றுப் பொருள் தெளிவின்மையை அளவுக்கு மீறித் தீர்க்காமல் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சட்டக் கட்டளைக்குரிய கண்ணியமான நேரடி நடையைக் கடைப்பிடிக்கிறது. ஒருமை ‘நீ/உன்’ என்பவை மூலத்தின் இரண்டாம் நபர் ஆண்பால் ஒருமை உரையாடலைத் தமிழில் பாலின வேறுபாடின்றி பிரதிபலிக்கின்றன. ‘அசேரா’ விளக்கமின்றி மறைந்துவிடாதபடி அடிக்குறிப்பு சேர்க்கப்பட்டுள்ளது.
