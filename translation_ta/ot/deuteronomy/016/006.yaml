base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/006.yaml
  text: but only at the place that Yahweh your God will choose for his name to dwell—there you shall sacrifice the Passover in the evening[a], at sunset[c][b], at the appointed time of your departure from Egypt.
translation:
  language: ta
  text: ஆனால், உங்கள் கடவுளாகிய யாவே தமது பெயர் அங்கே தங்கியிருக்கும்படி தேர்ந்தெடுக்கும் இடத்தில் மட்டுமே நீங்கள் பஸ்காவைப் பலியிட வேண்டும்; மாலையில், சூரியன் மறையும் வேளையில், நீங்கள் எகிப்திலிருந்து புறப்பட்ட நியமிக்கப்பட்ட நேரத்தில்.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “தமது பெயரை அங்கே தங்கச் செய்ய” அல்லது “தமது பெயரை அங்கே வைக்க” என்றும் மொழிபெயர்க்கலாம். “பஸ்காவைப் பலியிட” என்பதற்கு “பஸ்காவை அறுக்க” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: சொல்லாக, “நீங்கள் எகிப்திலிருந்து புறப்பட்ட நியமிக்கப்பட்ட நேரத்தில்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  choice: ஆனால் ... மட்டுமே
  rationale: முந்தைய வசனத்தின் தடைக்கு மாறாக ஒரே இடத்தை வலுவாக வரையறுக்கும் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: הַמָּקוֹם אֲשֶׁר יִבְחַר
  choice: தேர்ந்தெடுக்கும் இடம்
  rationale: சட்டச் சூழலில் கடவுள் வழிபாட்டுக்கென தேர்வு செய்யும் குறிப்பிட்ட இடத்தைக் குறிக்கிறது; எபிரெய இறந்தகாலமல்லாத வினை வடிவின் எதிர்நோக்கிய பொருள் தமிழ்ச் சூழலில் இயல்பாகத் தெரிகிறது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: தெய்வீகப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் பரவலாக அறியப்படும் ஒலிபெயர்ப்பால் தருகிறது.
- source_word: לְשַׁכֵּן שְׁמוֹ שָׁם
  choice: தமது பெயர் தங்கியிருக்க
  rationale: கடவுளின் பெயர் தேர்ந்தெடுக்கப்பட்ட இடத்தில் தங்குவது என்ற உபாகமத்தின் சொற்றொடரை, கடவுளை அந்த இடத்துக்குள் மட்டுப்படுத்தாமல், அதன் திட்டமிட்ட தெளிவின்மையுடன் காக்கிறது.
- source_word: תִּזְבַּח אֶת הַפֶּסַח
  choice: பஸ்காவைப் பலியிட வேண்டும்
  rationale: זבח என்பதன் சடங்குசார் பலியிடும் பொருளையும், הַפֶּסַח என்பதன் பஸ்காப் பலிப் பொருள் அல்லது அனுசரிப்பு என்ற சுருக்கமான குறிப்பையும் காக்கிறது.
- source_word: בָּעָרֶב כְּבֹא הַשֶּׁמֶשׁ
  choice: மாலையில், சூரியன் மறையும் வேளையில்
  rationale: இரண்டு தொடர்புடைய காலக் குறிப்புகளையும் ஒன்றாக்காமல் தனித்தனியாகக் காக்கிறது.
- source_word: מוֹעֵד צֵאתְךָ מִמִּצְרָיִם
  choice: நீங்கள் எகிப்திலிருந்து புறப்பட்ட நியமிக்கப்பட்ட நேரத்தில்
  rationale: מוֹעֵד என்பதன் நியமிக்கப்பட்ட காலத்தையும், צאתך என்பதன் புறப்படுதல்/வெளியேறுதல் பொருளையும் நெருக்கமாகப் பிரதிபலிக்கிறது.
theological_decisions:
- issue: தேர்ந்தெடுக்கப்பட்ட இடத்தில் கடவுளின் பெயர் தங்குதல்
  choice: தமது பெயர் தங்கியிருக்க
  alternative: தமது பெயரை அங்கே தங்கச் செய்ய
  rationale: எபிரெய வினை வடிவில் காரணவினைப் பொருள் சாத்தியமானாலும், ‘பெயர் தங்குதல்’ என்ற உடன்படிக்கைச் சார்ந்த மொழிப்படிமத்தையும் கடவுளின் இருப்பை இடத்துக்குள் சுருக்காத இறையியல் இழுப்பையும் முதன்மை உரை காக்கிறது; மாற்று வாசிப்பு அடிக்குறிப்பில் தரப்படுகிறது.
- issue: பஸ்காவைச் சார்ந்த வினையின் சடங்குப் பொருள்
  choice: பஸ்காவைப் பலியிட வேண்டும்
  alternative: பஸ்காவை அறுக்க வேண்டும்
  rationale: மைய வழிபாட்டு இடம் பற்றிய சூழலில் இது சாதாரண அறுத்தலைவிட பலிக்குரிய அறுத்தலைக் குறிக்கிறது; ஆகவே ‘பலியிட’ என்பது பொருத்தமானது, அதேவேளை ‘அறுக்க’ என்பது சாத்தியமான சொற்பொருள் மாற்றாகும்.
translation_notes:
  register: நவீன செந்தமிழ் நடை; சட்டவிதிக்குரிய கண்ணியமான தொனி. ‘மட்டுமே’ என்பது கட்டுப்பாட்டைத் தெளிவாக்குகிறது. காலக் குறிப்புகளின் தொடரை வாசிப்புக்கு இயல்பாக்க நீள்கோடு பயன்படுத்தப்பட்டுள்ளது; மூலத்தின் இறையியல் சொற்றொடர் விளக்கமாக விரிவாக்கப்படவில்லை.
