base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/008.yaml
  text: For six days you shall eat unleavened bread[a], and on the seventh day there shall be a solemn assembly to Yahweh your God; you shall do no work.
translation:
  language: ta
  text: ஆறு நாட்களுக்கு நீ புளிப்பில்லாத அப்பத்தை உண்ண வேண்டும்; ஏழாம் நாளில் உன் கடவுளாகிய யாவேக்கு ஒரு முறையான விழாக் கூடுகை[a] நடைபெறும்; நீ எந்த வேலையும் செய்யக்கூடாது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘புனிதக் கூடுகை’ அல்லது ‘நிறைவுக் கூடுகை’ என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் முறையான விழாக் கூடுகையைக் குறிக்கிறது; இங்கே விழாவின் நிறைவுக் கூடுகை என்ற நுட்பமும் இருக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: שֵׁשֶׁת יָמִים
  choice: ஆறு நாட்கள்
  rationale: இந்த இணைச்சொல் கால அளவைக் குறிக்கிறது; தமிழில் இயல்பாகவும் நேரடியாகவும் கால நீளத்தைத் தெரிவிக்கிறது.
- source_word: תֹּאכַל
  choice: நீ ... சாப்பிட வேண்டும்
  rationale: சட்டப் பின்னணியில் இந்த வினை கட்டளையைக் குறிக்கிறது; ‘வேண்டும்’ அதன் விதிப்பொருளைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: מַצּוֹת
  choice: புளிப்பில்லாத அப்பம்
  rationale: பஸ்கா சூழலில் இது புளிக்கச் செய்யப்படாத அப்பத்தைக் குறிக்கும் வழக்கமான சொல்; பொதுவாசகருக்கு எளிதில் புரியும் தமிழாக்கம் இது.
- source_word: וּבַיּוֹם הַשְּׁבִיעִי
  choice: ஏழாம் நாளில்
  rationale: வாவ் எளிய தொடர்ச்சியைத் தருகிறது; தனி தமிழ் வாக்கியத்தின் தொடக்கத்தில் கூடுதல் இணைப்புச்சொல் இல்லாமலேயே அந்தத் தொடர்ச்சி இயல்பாகப் புரிகிறது.
- source_word: עֲצֶרֶת
  choice: ஒரு சிறப்புக் கூடுகை
  rationale: விழாவுடன் தொடர்புடைய முறையான கூடுகையை இது குறிக்கிறது. ‘சிறப்பு’ என்பது அதன் தனிப்பட்ட, கட்டுப்படுத்தப்பட்ட கூடுகைத் தன்மையைத் தருகிறது; ‘நிறைவு’ என்ற சாத்தியமான நுட்பத்தை முதன்மை உரையில் கட்டாயப்படுத்தவில்லை.
- source_word: לַיהוָה
  choice: யாவேக்கு
  rationale: לְ அர்ப்பணிப்பு அல்லது தொடர்பைக் குறிக்கிறது; ‘-க்கு’ எபிரெயச் சொல்லமைப்பை நெருக்கமாகப் பிரதிபலிக்கிறது.
- source_word: אֱלֹהֶיךָ
  choice: உன் கடவுளாகிய
  rationale: இரண்டாம் நபர் ஒருமை உடைமையைப் பாதுகாத்து, தெய்வீகப் பெயருடன் இயல்பான தமிழில் இணைக்கிறது.
- source_word: לֹא תַעֲשֶׂה מְלָאכָה
  choice: நீ எந்த வேலையும் செய்யக்கூடாது
  rationale: வேலை செய்வதற்கான முழுத் தடையை இயல்பான நவீன தமிழில் தெளிவாகத் தெரிவிக்கிறது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூல உரையில் நான்கெழுத்து இறைப்பெயர் நேரடியாக உள்ளது. அதை ஒரு பட்டமாக மாற்றாமல், பொதுவாக ஏற்றுக்கொள்ளப்படும் உச்சரிப்புக்கு நெருக்கமான தமிழ் ஒலிபெயர்ப்பாக ‘யாவே’ வழங்கப்பட்டுள்ளது.
- issue: עֲצֶרֶת என்பதன் துல்லியமான விழாசார் நுட்பம்
  choice: சிறப்புக் கூடுகை
  alternative: புனிதக் கூடுகை; நிறைவுக் கூடுகை
  rationale: இது முறையான விழாக் கூடுகையைக் குறிக்கிறது; சூழலில் நிறைவுக் கூடுகை என்ற நுட்பம் இருக்கக்கூடும். ஆனால் அந்த நுட்பத்தை உறுதியானதாக முதன்மை உரையில் நிர்ணயிக்காமல் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், ஒருமை இரண்டாம் நபரான ‘நீ/உன்’ என்பவற்றைப் பாதுகாத்து, சட்டக் கட்டளைக்குரிய கண்ணியமான ஆனால் எளிதில் புரியும் நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ஆங்கில ஆலோசனை உரையில் அடிக்குறி ‘புளிப்பில்லாத அப்பம்’ என்பதற்குப் பின் இருந்தாலும், அதன் உள்ளடக்கம் עֲצֶרֶת என்பதைக் குறிக்கும் என்பதால் தமிழில் ‘சிறப்புக் கூடுகை’ என்பதற்குப் பின் சரியாக இடப்பட்டுள்ளது.
