base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/016.yaml
  text: 'Three times a year all your males shall appear before Yahweh your God in the place that he will choose: at the Feast of Unleavened Bread[a], at the Feast of Weeks, and at the Feast of Booths[c][b]. No one shall appear before Yahweh empty-handed.'
translation:
  language: ta
  text: 'ஆண்டுதோறும் மூன்று முறை, உன்னிடையே உள்ள எல்லா ஆண்களும் யாவே உன் கடவுள் தேர்ந்தெடுக்கும் இடத்தில் அவருடைய முன்னிலையில் ஆஜராக வேண்டும்[a]: புளிப்பில்லா அப்பத் திருவிழா, வாரங்களின் திருவிழா, குடில்களின் திருவிழா ஆகியவற்றில்[b]. யாவேயின் முன்னிலையில் எவரும் வெறுங்கையோடு வரக்கூடாது[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய வினைச்சொல்லைச் சொற்படியாக ‘யாவேயின் முன்னிலையில் காணப்பட வேண்டும்’ என்றும் மொழிபெயர்க்கலாம்; இச்சூழலில் அது கடவுளின் முன்னிலையில் வந்து நிற்பதைக் குறிக்கும் மரபுத்தொடர்.
    reason: lexical_alternative
  - marker: b
    text: ‘குடில்களின் திருவிழா’ பாரம்பரியமாக ‘கூடாரத் திருவிழா’ என்றும் அழைக்கப்படுகிறது.
    reason: alternative_reading
  - marker: c
    text: ‘வெறுங்கையோடு’ என்பது செலுத்த வேண்டிய காணிக்கையோ பரிசோ இல்லாமல் வருவதைக் குறிக்கிறது.
    reason: cultural_note
lexical_decisions:
- source_word: יֵרָאֶה
  choice: முன்னிலையில் வர வேண்டும்
  rationale: ראה என்பதன் நிஃபால் வடிவம் சொற்படியாக ‘காணப்பட வேண்டும்’ என்றாலும், யாத்திரைத் திருவிழாக்களின் சூழலில் கடவுளின் முன்னிலையில் வந்து நிற்பதைக் குறிக்கும் மரபுத்தொடராகச் செயல்படுகிறது. இயல்பான நவீனத் தமிழுக்காக ‘வர வேண்டும்’ என மொழிபெயர்க்கப்பட்டு, சொற்பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: כָל זְכוּרְךָ
  choice: உன்னிடையிலுள்ள ஆண்கள் அனைவரும்
  rationale: எபிரெயச் சொற்றொடர் சட்டக் கடமையை ஆண்களுக்கே வெளிப்படையாகக் குறிப்பிடுகிறது; ஆகவே பாலினக் குறிப்பை பொதுமைப்படுத்தாமல் காக்கிறது. இரண்டாம் நபர் ஒருமை ‘உன்’ என்பதும் பாதுகாக்கப்பட்டுள்ளது.
- source_word: פְּנֵי יְהוָה אֱלֹהֶיךָ
  choice: யாவே உன் கடவுளின் முன்னிலையில்
  rationale: ‘முகத்திற்கு முன்’ என்ற எபிரெய மரபுத்தொடர் ஒருவருடைய பிரசன்னத்தில் இருப்பதைக் குறிக்கிறது. ‘முன்னிலையில்’ என்பது அதற்கான இயல்பான தமிழ் வடிவம்.
- source_word: יְהוָה
  choice: யாவே
  rationale: திருநான்கெழுத்தான இறைப்பெயரை ஒரு பட்டத்தால் மாற்றாமல், அதன் பரவலான தமிழ் ஒலிபெயர்ப்பான ‘யாவே’ என்று வழங்குகிறது.
- source_word: בַּמָּקוֹם אֲשֶׁר יִבְחָר
  choice: தேர்ந்தெடுக்கும் இடத்தில்
  rationale: வழிபாட்டுக்கான இடத்தை யாவே தாமே தேர்ந்தெடுப்பார் என்ற உபாகமத்தின் மையக் கருத்தைத் தெளிவாகக் காக்கிறது.
- source_word: חַג הַמַּצּוֹת
  choice: புளிப்பில்லா அப்பத் திருவிழா
  rationale: מַצּוֹת என்பதன் பொருளைத் தெளிவாகவும், திருவிழாவின் பெயரை நவீன வாசகர்களுக்கு எளிதில் புரியுமாறும் வழங்குகிறது.
- source_word: חַג הַשָּׁבֻעוֹת
  choice: வாரங்களின் திருவிழா
  rationale: பிற்காலக் கிரேக்கப் பெயரைப் புகுத்தாமல், எபிரெயப் பெயரின் நேரடிப் பொருளைப் பாதுகாக்கிறது.
- source_word: חַג הַסֻּכּוֹת
  choice: குடில்களின் திருவிழா
  rationale: סֻכּוֹת என்பது தற்காலிகக் குடில்களைக் குறிக்கிறது. ‘குடில்கள்’ என்பது நவீனத் தமிழில் தெளிவான நேரடி இணை.
- source_word: רֵיקָם
  choice: வெறுங்கையோடு
  rationale: வழிபாட்டு சூழலில் காணிக்கையோ பரிசோ இல்லாமல் வருவதைக் குறிக்கும் எபிரெய மரபுத்தொடரை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூலத்தில் தனிப்பட்ட உடன்படிக்கைப் பெயர் நேரடியாக உள்ளது. அதை ஒரு பட்டமாக மாற்றாமல் ஒலிபெயர்ப்பது மூல வேறுபாட்டைக் காக்கிறது.
- issue: כָל זְכוּרְךָ என்பதில் உள்ள பாலினம் குறித்த சட்டக் கடமை
  choice: உன்னிடையிலுள்ள ஆண்கள் அனைவரும்
  alternative: உன்னிடையிலுள்ள அனைவரும்
  rationale: மூலம் எல்லாரையும் பொதுவாகக் குறிப்பிடாமல் ஆண்களை வெளிப்படையாகக் குறிப்பிடுவதால், அந்தச் சட்ட வரம்பு மொழிபெயர்ப்பிலும் பாதுகாக்கப்படுகிறது.
- issue: יֵרָאֶה என்பதிலுள்ள இலக்கண மற்றும் மரபுத்தொடர் சார்ந்த இரட்டை வாய்ப்பு
  choice: முன்னிலையில் வர வேண்டும்
  alternative: முன்னிலையில் காணப்பட வேண்டும்
  rationale: சூழலில் இது யாவேயின் முன்னிலையில் தன்னை ஆஜர்படுத்தும் யாத்திரைக் கடமையைக் குறிக்கிறது. இருப்பினும் நிஃபால் வடிவத்தின் சொற்படியான ‘காணப்படுதல்’ என்ற சாத்தியம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் அதேவேளையில் சட்ட மற்றும் வழிபாட்டு உரைக்கு ஏற்ற கண்ணியமான நடையில் வடிவமைக்கப்பட்டுள்ளது. இரண்டாம் நபர் ஒருமை முகவரி காக்கப்பட்டுள்ளது; திருவிழாப் பெயர்கள் எபிரெய வடிவங்களுக்கு நெருக்கமாகவும் தெளிவாகவும் தரப்பட்டுள்ளன.
