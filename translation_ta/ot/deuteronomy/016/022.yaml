base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/022.yaml
  text: And you shall not set up for yourself a pillar[a], which Yahweh your God hates.
translation:
  language: ta
  text: உனக்காக ஒரு தூணை[a] நிறுவாதே; உன் இறைவனாகிய யாவே அதை வெறுக்கிறார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘நிறுத்தப்பட்ட கல்’ அல்லது ‘வழிபாட்டுத் தூண்.’ எபிரெயச் சொல் வழிபாட்டோடு தொடர்புடையதாக எழுப்பி நிறுத்தப்பட்ட கல்லைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: תָקִים
  choice: நிறுவாதே
  rationale: קום என்பதன் ஹிஃபில் வடிவம் இங்கு ஓர் பொருளை நிமிர்த்தி நிலைநிறுத்துவதைக் குறிக்கிறது. எதிர்மறைக் கட்டளையாக ‘நிறுவாதே’ என்பது இயல்பாகவும் பொருளுக்கேற்றவாறும் உள்ளது.
- source_word: לְךָ
  choice: உனக்காக
  rationale: தனிப்பட்ட தொடர்பையோ நோக்கத்தையோ காட்டும் தத்துவேற்றுமைப் பின்னொட்டை நேரடியாகப் பாதுகாக்கிறது.
- source_word: מַצֵּבָה
  choice: வழிபாட்டுத் தூண்
  rationale: இச்சொல் நிமிர்த்தி வைக்கப்பட்ட கல்லையோ தூணையோ குறிக்கும்; உபாகமத்தின் இச்சூழலில் அது வழிபாட்டுடன் தொடர்புடையது. ‘வழிபாட்டுத் தூண்’ என்பது சாதாரண கட்டடத் தூண் என்ற தவறான புரிதலைத் தவிர்க்கிறது; அடிக்குறிப்பு அதன் பொருள் வரம்பைக் காட்டுகிறது.
- source_word: אֲשֶׁר
  choice: அதை
  rationale: எபிரெய உறவுப்பெயரால் தொடங்கும் தொடரைத் தமிழில் இயல்பான தனி வாக்கியமாக மாற்றி, அதன் முன்னிலையான தூணை ‘அதை’ எனத் தெளிவாகச் சுட்டுகிறது.
- source_word: שָׂנֵא
  choice: வெறுக்கிறார்
  rationale: வினையின் வலிமையான வெறுப்பு அல்லது அருவருப்பை மென்மைப்படுத்தாமல் நேரடியாகத் தருகிறது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: திருநான்கெழுத்துத் தெய்வீகப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் பரவலாக அறியப்படும் தனிப்பெயர் வடிவில் வழங்குகிறது.
- source_word: אֱלֹהֶיךָ
  choice: உன் இறைவனாகிய
  rationale: இரண்டாம் நபர் ஒருமை உடைமைப் பின்னொட்டையும் உடன்படிக்கை சார்ந்த உறவையும் இயல்பான தமிழில் பாதுகாக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரின் மொழிபெயர்ப்பு
  choice: யெகோவா
  alternative: யாவே; கர்த்தர்
  rationale: மூலத்தில் தனிப்பெயர் நேரடியாக இருப்பதால் அதை ‘கர்த்தர்’ என்ற பட்டமாக மாற்றவில்லை. எபிரெய உயிரெழுத்தாக்கம் உறுதியற்றதால் தமிழில் பரவலாக அறியப்படும் ‘யெகோவா’ வடிவைத் தேர்ந்தெடுத்தோம்; ‘யாவே’ என்பதும் சாத்தியமான ஒலிபெயர்ப்பு.
- issue: מַצֵּבָה என்பதன் வழிபாட்டுச் சார்பு
  choice: வழிபாட்டுத் தூண்
  alternative: தூண்; நிறுத்தப்பட்ட கல்; புனிதத் தூண்
  rationale: சொல் அடிப்படையில் நிமிர்த்தப்பட்ட கல் அல்லது தூணைக் குறித்தாலும், இங்கு தடைசெய்யப்படுவது வழிபாட்டுடன் தொடர்புடைய பொருள். ‘வழிபாட்டுத் தூண்’ சூழலைத் தெளிவாக்குகிறது; ‘புனித’ என்பது பொருளை அளவுக்கு மீறி நேர்மறையாகச் சாய்க்கக்கூடும்.
translation_notes:
  register: நவீன நிலையான தமிழில், ஒருமை இரண்டாம் நபருக்கான நேரடியான கட்டளை நடையில் மொழிபெயர்க்கப்பட்டது. மூலத்தின் கடுமையான ‘வெறுக்கிறார்’ என்ற சொல்லாட்சி தக்கவைக்கப்பட்டது; வழிபாட்டுச் சூழல் அடிக்குறிப்புடன் தெளிவுபடுத்தப்பட்டது.
