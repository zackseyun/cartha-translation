  terminology: Use ‘யாவே’ for the Tetragrammaton in accordance with the POB policy and English audit trail. Render מַצֵּבָה as ‘தூண்’ in the text, while the footnote supplies ‘நிறுத்தப்பட்ட கல்’ and the worship-related sense.
