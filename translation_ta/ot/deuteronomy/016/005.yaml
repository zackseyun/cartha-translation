  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: לֹ֥א תוּכַ֖ל לִ/זְבֹּ֣חַ אֶת הַ/פָּ֑סַח בְּ/אַחַ֣ד שְׁעָרֶ֔י/ךָ אֲשֶׁר יְהוָ֥ה אֱלֹהֶ֖י/ךָ נֹתֵ֥ן לָֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/005.yaml
  text: You may not sacrifice the Passover in any one of your gates that Yahweh your God is giving you[b][a],
translation:
  language: ta
  text: உன் கடவுளாகிய யாவே உனக்குக் கொடுக்கிற நகரங்களில்[b] எந்த ஒன்றிலும் பஸ்காவைப்[a] பலியிடக் கூடாது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘பஸ்காப் பலியை.’
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில் ‘வாயில்களில்’; நகரம் அல்லது குடியிருப்பைக் குறிக்கும் பொதுவான ஆகுபெயர்.
    reason: cultural_note
lexical_decisions:
- source_word: לֹא תוּכַל
  choice: பலியிடக் கூடாது
  rationale: יכל + வினையெச்சம் இங்குள்ள சட்டச் சூழலில் இயலாமையை அல்ல, தடையைத் தெரிவிக்கிறது; தமிழில் ‘கூடாது’ அந்தச் சட்ட வலிமையை இயல்பாகக் காட்டுகிறது.
- source_word: לִזְבֹּחַ
  choice: பலியிட
  rationale: வழிபாட்டுச் சூழலில் זבח பலிக்காகக் கொல்வதையோ பலியாகச் செலுத்துவதையோ குறிக்கிறது; ‘பலியிட’ என்பது சுருக்கமாகவும் தெளிவாகவும் உள்ளது.
- source_word: הַפָּסַח
  choice: பஸ்கா
  rationale: פסח பண்டிகையையோ பலிப்பொருளையோ பஸ்காப் பலியையோ குறிக்கக்கூடும். உடனுள்ள ‘பலியிட’ என்ற வினை இங்கு பலியைக் குறிக்கும் பொருளை உணர்த்துகிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: בְּאַחַד שְׁעָרֶיךָ
  choice: உன் நகரங்களில் எந்த ஒன்றிலும்
  rationale: שער என்பதன் நேரடிப் பொருள் ‘வாயில்’; ஆனால் உபாகமத்தில் அது ஆகுபெயராக நகரம் அல்லது குடியிருப்பைக் குறிக்கிறது. தடையின் பரப்பைத் தமிழில் தெளிவாகக் காட்ட ‘எந்த ஒன்றிலும்’ பயன்படுத்தப்பட்டுள்ளது; எபிரெய உருவகம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: אֲשֶׁר יְהוָה אֱלֹהֶיךָ נֹתֵן לָךְ
  choice: உன் கடவுளாகிய யாவே உனக்குக் கொடுக்கிற
  rationale: נֹתֵן என்னும் வினையெச்ச வடிவின் தொடரும் அல்லது வழக்கமான செயற்பொருளை ‘கொடுக்கிற’ பிரதிபலிக்கிறது. יהוה என்ற உடன்படிக்கைப் பெயர் ‘யாவே’ என ஒலிபெயர்க்கப்பட்டுள்ளது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூலத்தில் நான்கு எழுத்துகளைக் கொண்ட இறைப்பெயர் நேரடியாக வருகிறது. பொதுப்பட்டப் பெயராக மாற்றாமல் உடன்படிக்கைப் பெயரைத் தமிழில் ஒலிபெயர்ப்பது மூலத்தின் வேறுபாட்டைப் பாதுகாக்கிறது.
- issue: הַפָּסַח என்பதன் குறிப்பு
  choice: பஸ்கா
  alternative: பஸ்காப் பலி
  rationale: இச்சொல் பண்டிகை, பலிப்பொருள், அல்லது பலி என ஒன்றுக்கு மேற்பட்ட தொடர்புடைய பொருள்களைக் கொண்டிருக்கலாம். ‘பலியிட’ என்ற வினை சூழலைத் தெளிவாக்குவதால், முதன்மை உரையில் சுருக்கமான வடிவம் வைக்கப்பட்டு மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், ஒருமை இரண்டாம் நபர் அழைப்பைத் தக்கவைத்து, சட்டநடையை இயல்பாகவும் கண்ணியமாகவும் அமைத்துள்ளோம். ‘நகரங்கள்’ வாசகருக்குப் பொருளை நேரடியாகத் தருகிறது; மூல எபிரெயின் ‘வாயில்கள்’ உருவகம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
