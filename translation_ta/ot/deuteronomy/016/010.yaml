source:
  edition: WLC
  text: וְ/עָשִׂ֜יתָ חַ֤ג שָׁבֻעוֹת֙ לַ/יהוָ֣ה אֱלֹהֶ֔י/ךָ מִסַּ֛ת נִדְבַ֥ת יָדְ/ךָ֖ אֲשֶׁ֣ר תִּתֵּ֑ן כַּ/אֲשֶׁ֥ר יְבָרֶכְ/ךָ֖ יְהוָ֥ה אֱלֹהֶֽי/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/010.yaml
  text: Then you shall celebrate the Feast of Weeks to Yahweh your God with a tribute of a freewill offering from your hand[a], which you shall give according to how Yahweh your God blesses you.
translation:
  language: ta
  text: அப்பொழுது, உங்கள் கடவுளாகிய யாவேவுக்காக வாரங்களின் திருவிழாவைக் கொண்டாடுங்கள்; உங்கள் கையால் மனமுவந்து கொடுக்கும் காணிக்கையின் அளவுக்கேற்ப, உங்கள் கடவுளாகிய யாவே உங்களை ஆசீர்வதித்திருப்பதற்கு ஏற்ப அதைச் செலுத்துங்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உங்கள் கையால் மனமுவந்து கொடுக்கும் காணிக்கையின் அளவின்படி.” எபிரெயச் சொற்றொடர், காணிக்கை தன்னார்வமானது என்பதையும், கடவுள் அளித்த ஆசீர்வாதத்திற்கு விகிதாசாரமாக அது இருக்க வேண்டும் என்பதையும் வலியுறுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: பின்பு ... கொண்டாடுங்கள்
  rationale: עשה என்ற வினைச்சொல் חג என்பதுடன் வரும்போது பண்டிகையைக் ‘கொண்டாடுதல்/அனுசரித்தல்’ என்று பொருள்படும். தொடர்ச்சியைக் காட்டும் וְ என்பதைச் சூழலுக்கேற்ற ‘பின்பு’ வெளிப்படுத்துகிறது.
- source_word: חַג שָׁבֻעוֹת
  choice: வாரங்களின் பண்டிகை
  rationale: எண்ணப்பட்ட வாரங்களோடு தொடர்புடைய பண்டிகைப் பெயரை நேரடியாகவும் புரியும்படியாகவும் வழங்குகிறது.
- source_word: לַיהוָה אֱלֹהֶיךָ
  choice: உங்கள் கடவுளாகிய யெகோவாவுக்காக
  rationale: לְ இங்குப் பண்டிகை யாருக்காக அர்ப்பணித்துக் கொண்டாடப்படுகிறது என்பதைக் குறிக்கிறது; יהוה என்ற உடன்படிக்கைப் பெயர் ‘யெகோவா’ என ஒலிபெயர்க்கப்படுகிறது.
- source_word: מִסַּת נִדְבַת יָדְךָ
  choice: உங்கள் கையிலிருந்து நீங்கள் மனமுவந்து கொடுக்கும் காணிக்கை
  rationale: נדבה காணிக்கையின் தன்னார்வத் தன்மையையும் ידך தனிப்பட்ட கொடையையும் காட்டுகின்றன. அரிதான מִסַּת அளவு, விகிதம் அல்லது போதுமான பங்கு என்ற நுணுக்கத்தைக் கொண்டுள்ளது; அடுத்த வாக்கியப்பகுதி அதன் அளவை ஆசீர்வாதத்துக்கு ஏற்றதாக விளக்குவதால், தமிழ் முதன்மை உரை இயல்பாக அமைக்கப்பட்டுள்ளது; மாற்று நுணுக்கம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: אֲשֶׁר תִּתֵּן
  choice: நீங்கள் ... கொடுக்கும்
  rationale: காணிக்கையைக் குறிக்கும் தொடர்புச் சொல்லாட்சியைத் தமிழில் இயல்பான பெயரெச்சத் தொடராக வழங்குகிறது.
- source_word: כַּאֲשֶׁר יְבָרֶכְךָ
  choice: உங்களை ஆசீர்வதித்திருப்பதற்கு ஏற்றவாறு
  rationale: כַּאֲשֶׁר இங்கு கடவுள் அளித்த ஆசீர்வாதத்துக்கு ஒத்த அளவு அல்லது விகிதத்தைக் குறிக்கிறது. நிறைவுற்ற ஆசீர்வாதமே கொடையின் அடிப்படை என்பதை ‘ஆசீர்வதித்திருப்பதற்கு’ வெளிப்படுத்துகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யெகோவா
  alternative: யாவே; ஆண்டவர்
  rationale: மூல உரை நான்கெழுத்து இறைப் பெயரை நேரடியாகப் பயன்படுத்துகிறது. அதை பொதுப்பட்டமான ‘ஆண்டவர்’ என்று மாற்றாமல், தமிழில் பரவலாக அறியப்படும் பெயர்வடிவமான ‘யெகோவா’ என வழங்குவது தனிப்பெயர்த் தன்மையைப் பாதுகாக்கிறது.
- issue: காணிக்கையின் தன்மையும் அளவும்
  choice: மனமுவந்த காணிக்கை; பெற்ற ஆசீர்வாதத்திற்கு ஏற்ற அளவு
  alternative: கட்டாயமான நிர்ணயிக்கப்பட்ட காணிக்கை
  rationale: נדבה தன்னார்வத்தைக் குறிக்கிறது; மִסַּת மற்றும் כַּאֲשֶׁר יְבָרֶכְךָ ஆகியவை கொடை பெற்ற ஆசீர்வாதத்துக்கு விகிதாசாரமாக இருக்க வேண்டும் என்பதைக் காட்டுகின்றன. வசனம் நிர்ணயிக்கப்பட்ட ஒரே அளவைச் சொல்லவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில் மரியாதைமிக்க பன்மை கட்டளை வடிவம் பயன்படுத்தப்பட்டுள்ளது. ‘வாரங்களின் பண்டிகை’ மூலப் பெயரின் வடிவத்தைத் தக்கவைக்கிறது. மִסַּת என்பதன் அரிதானதும் விவாதத்திற்குரியதுமான ‘அளவு/பங்கு’ நுணுக்கம் முதன்மை உரையைச் சுமையாக்காமல் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
