base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/011.yaml
  text: And you shall rejoice before Yahweh your God—you[a], your son, your daughter, your male servant, your female servant, the Levite who is within your gates, and the sojourner, the fatherless[c][b], and the widow who are among you—at the place that Yahweh your God will choose for his name to dwell there.
translation:
  language: ta
  text: உன் கடவுளாகிய யாவேக்கு முன்பாக—நீயும், உன் மகனும், உன் மகளும், உன் ஆண் அடிமையும், உன் பெண் அடிமையும், உன் நகரங்களில் இருக்கும் லேவியரும், உன் நடுவில் குடியிருக்கும் அந்நியரும்[a], தந்தையற்றவரும்[b], விதவையும்—உன் கடவுளாகிய யாவே தமது பெயரை அங்கே குடியிருக்கச் செய்வதற்காகத் தேர்ந்தெடுக்கும் இடத்தில் மகிழ வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அங்கே குடியிருக்கும் அயல்நாட்டவர்’ என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல், இஸ்ரவேலரல்லாதவராக இருந்தும் இஸ்ரவேலரின் சமூக அமைப்புக்குள் அவர்களோடு வாழ்ந்த ஒருவரைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: ‘அனாதை’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׂמַחְתָּ
  choice: மகிழ வேண்டும்
  rationale: שׂמח என்பதன் மகிழ்ச்சி சார்ந்த பொருளையும், கட்டளையின் உடன்படிக்கை மற்றும் வழிபாட்டுச் சாயலையும் இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: לִפְנֵי
  choice: முன்னிலையில்
  rationale: ‘முன்பாக’ என்ற இடவியல் பொருளைவிட, தேவனுடைய பிரசன்னத்தில் கொண்டாடுவதைத் தெளிவாகவும் இயல்பாகவும் உணர்த்துகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெயத் திருப்பெயரான יהוה-ஐ ஒரு பட்டத்தால் மாற்றாமல், அதன் பொதுவாக ஏற்கப்படும் தமிழ் ஒலிபெயர்ப்பால் தருகிறது.
- source_word: וְעַבְדְּךָ / וַאֲמָתֶךָ
  choice: உன் ஆண் அடிமை / உன் பெண் அடிமை
  rationale: பாலின வேறுபாட்டையும் வீட்டுக் கட்டமைப்பில் உள்ள பிணைக்கப்பட்ட சமூக நிலையையும் மென்மைப்படுத்தாமல் வெளிப்படுத்துகிறது.
- source_word: בִּשְׁעָרֶיךָ
  choice: உன் ஊர்களில்
  rationale: சொல்லுக்குச் சொல் ‘உன் வாசல்களில்’ என்றாலும், உபாகமச் சட்ட மொழியில் இது உள்ளூர் ஊர்களையோ குடியிருப்புகளையோ குறிக்கிறது; நவீனத் தமிழில் பொருள் தெளிவாக இருக்க ‘ஊர்களில்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: וְהַגֵּר
  choice: குடியேறிய அந்நியர்
  rationale: இஸ்ரவேலரல்லாதவராக இருந்தும் அவர்களிடையே நிலையாக வாழ்ந்து வந்த ஒருவரின் சமூகச் சட்ட நிலையைக் காட்டுகிறது.
- source_word: וְהַיָּתוֹם
  choice: தந்தையற்றவர்
  rationale: יָתוֹם என்பதன் நேரடியான குடும்ப மற்றும் சமூகப் பாதிப்பைத் தக்கவைக்கிறது; ‘அனாதை’ என்பது சாத்தியமான மாற்று.
- source_word: לְשַׁכֵּן שְׁמוֹ שָׁם
  choice: தமது பெயர் அங்கே குடியிருக்கும்படி
  rationale: שׁכן வினையின் காரணவினைச் சாயலை இயல்பான தமிழில் வெளிப்படுத்தி, தேவனுடைய பெயர் தேர்ந்தெடுக்கப்பட்ட இடத்தில் குடியிருக்கும் என்ற உபாகமத் தெய்வவியல் மொழியைப் பாதுகாக்கிறது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: ஆண்டவர்; யெகோவா
  rationale: மூலத்தில் தனிப்பட்ட உடன்படிக்கைப் பெயர் நேரடியாக வருவதால் அதை ஒரு பட்டமாக மாற்றாமல் ஒலிபெயர்ப்பது பொருத்தமானது.
- issue: עבד / אמה என்போரின் சமூக நிலை
  choice: ஆண் அடிமை / பெண் அடிமை
  alternative: வேலைக்காரன் / வேலைக்காரி; பணியாளன் / பணிப்பெண்
  rationale: இந்த வீட்டுச் சட்டச் சூழலில் பிணைக்கப்பட்ட நிலை முக்கியமானது. ‘பணியாளர்’ போன்ற சொற்கள் அந்தக் கடினமான சமூக உண்மையை மறைக்கக்கூடும்.
- issue: தேவனுடைய பெயர் குடியிருக்கும் ஆலயச் சூத்திரம்
  choice: தமது பெயர் அங்கே குடியிருக்கும்படி
  alternative: தமது பெயரை அங்கே நிலைநிறுத்த; தமது பெயர் அங்கே குடியிருக்க
  rationale: காரணவினைச் சாயலைக் காத்துக்கொண்டே, தேவனுடைய உயர்நிலைக்கும் அவர் தேர்ந்தெடுத்த இடத்தில் வெளிப்படும் உடன்படிக்கைப் பிரசன்னத்திற்கும் இடையிலான தெய்வவியல் அழுத்தத்தைத் தீர்த்துவிடாமல் விடுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசிப்புக்கும் வழிபாட்டு வாசிப்புக்கும் ஏற்ற கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ஒருமை இரண்டாம் நபர் கட்டளையும் பட்டியலின் வலியுறுத்தலும் பாதுகாக்கப்பட்டுள்ளன; இறுதி வினையில் ‘நீங்கள்’ என்று வந்துவிடாதபடி முழு வாக்கியமும் ஒருமைச் சட்ட முகவரியைத் தொடர வேண்டும்.
