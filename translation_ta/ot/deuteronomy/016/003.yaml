source:
  edition: WLC
  text: לֹא תֹאכַ֤ל עָלָי/ו֙ חָמֵ֔ץ שִׁבְעַ֥ת יָמִ֛ים תֹּֽאכַל עָלָ֥י/ו מַצּ֖וֹת לֶ֣חֶם עֹ֑נִי כִּ֣י בְ/חִפָּז֗וֹן יָצָ֨אתָ֙ מֵ/אֶ֣רֶץ מִצְרַ֔יִם לְמַ֣עַן תִּזְכֹּר֔ אֶת י֤וֹם צֵֽאתְ/ךָ֙ מֵ/אֶ֣רֶץ מִצְרַ֔יִם כֹּ֖ל יְמֵ֥י חַיֶּֽי/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/003.yaml
  text: You shall not eat leavened bread with it. Seven days you shall eat with it unleavened bread[a], the bread of affliction, because you came out from the land of Egypt in haste, so that you may remember the day of your coming out from the land of Egypt all the days of your life.
translation:
  language: ta
  text: அதனுடன் புளிப்புள்ள அப்பத்தைச் சாப்பிடக் கூடாது. ஏழு நாட்கள் அதனுடன் புளிப்பில்லாத அப்பத்தை—துன்பத்தின் அப்பத்தை[a]—சாப்பிட வேண்டும். ஏனெனில், நீ எகிப்து நாட்டிலிருந்து அவசரமாகப் புறப்பட்டாய்; நீ எகிப்து நாட்டிலிருந்து புறப்பட்ட நாளை உன் வாழ்நாளெல்லாம் நினைவுகூரும்படி இவ்வாறு செய்ய வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “வறுமையின் அப்பம்” அல்லது “அவலத்தின் அப்பம்.” எபிரெயச் சொற்றொடர் வெளியேற்றத்துடன் தொடர்புடைய கடினநிலை, இல்லாமை அல்லது துன்பத்தை வலியுறுத்தலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָלָיו
  choice: அதனுடன்
  rationale: பஸ்காப் பலியுடன் சேர்த்து உண்பதைக் குறிக்கும் சூழலில் עַל என்பதன் இயல்பான பொருளைத் தருகிறது; சொற்சொல்லான ‘அதன்மேல்’ இங்கு தவறாகப் புரிந்துகொள்ளப்படலாம்.
- source_word: חָמֵץ
  choice: புளிப்புள்ள அப்பம்
  rationale: இச்சூழலில் புளிக்கச் செய்யப்பட்ட உணவை, குறிப்பாக அப்பத்தை, குறிக்கிறது; ‘புளிப்பு’ என்று மட்டும் கூறுவது மூலப்பொருளைக் குறிப்பதாகத் தோன்றலாம்.
- source_word: מַצּוֹת
  choice: புளிப்பில்லாத அப்பம்
  rationale: திருவிழா உணவைக் குறிக்கும் தெளிவான, வழக்கமான தமிழ் மொழிபெயர்ப்பு.
- source_word: לֶחֶם עֹנִי
  choice: துன்பத்தின் அப்பம்
  rationale: עֹנִי என்பதில் உள்ள துன்பம், வறுமை, அவலம் ஆகிய விரிந்த பொருள் வளையத்தை முழுமையாகக் குறுக்காமல், வெளியேற்றத்துடன் தொடர்புடைய கடின அனுபவத்தைத் தக்கவைக்கிறது.
- source_word: בְחִפָּזוֹן
  choice: அவசரமாக
  rationale: இஸ்ரவேலர் விரைந்து வெளியேறிய சூழலை இயல்பான நவீன தமிழில் தெரிவிக்கிறது; அச்சம் அல்லது தப்பியோட்டம் என்ற கூடுதல் விளக்கத்தைச் சேர்க்கவில்லை.
- source_word: לְמַעַן
  choice: ஆகவே … வேண்டும்
  rationale: 'எபிரெயச் சொல்லின் நோக்கப் பொருளைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது: இந்தச் சடங்கின் நோக்கம் வெளியேற்ற நாளைத் தொடர்ந்து நினைவுகூர்வதாகும்.'
- source_word: תִּזְכֹּר
  choice: நினைவுகூர வேண்டும்
  rationale: வெறும் மனநினைவைக் காட்டிலும் நினைவாகக் கடைப்பிடிக்கும் கருத்தையும் ஏந்தக்கூடிய, சூழலுக்கு ஏற்ற வினை.
- source_word: יוֹם צֵאתְךָ
  choice: நீ … புறப்பட்ட நாள்
  rationale: எபிரெய infinitive construct-இன் பொருளை நவீன தமிழில் இயல்பாகத் தருகிறது.
- source_word: כֹּל יְמֵי חַיֶּיךָ
  choice: உன் வாழ்நாளெல்லாம்
  rationale: வாழ்க்கை முழுவதும் தொடரும் நினைவுகூருதலைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
theological_decisions:
- issue: לֶחֶם עֹנִי என்பதன் வெளியேற்ற நினைவுச் சார்ந்த பொருள்
  choice: துன்பத்தின் அப்பம்
  alternative: வறுமையின் அப்பம்; அவலத்தின் அப்பம்
  rationale: இச்சொற்றொடர் எகிப்திலிருந்த கடினநிலையையும் அவசர வெளியேற்றத்தையும் நினைவூட்டுகிறது. ‘துன்பம்’ என்பது பொருளாதார வறுமை என்று மட்டும் பொருளைக் குறுக்காமல் அதன் திட்டமிட்ட தெளிவின்மையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில், ஒருமை இரண்டாம் நபரைப் பேணும் கண்ணியமான சட்டவுரை நடை. ‘சாப்பிடக் கூடாது/சாப்பிட வேண்டும்’ என்பது கட்டளையின் வலிமையை இயல்பான தமிழில் தருகிறது. அடிக்குறிப்பு குறியீடு [a] முதன்மை உரையில் இடம்பெற்றுள்ளது.
