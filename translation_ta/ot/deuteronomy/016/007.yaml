base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/007.yaml
  text: And you shall cook it and eat it in the place that the LORD your God will choose for it, and in the morning you shall turn and go to your tents.
translation:
  language: ta
  text: உன் கடவுளாகிய ஆண்டவர் தேர்ந்தெடுக்கும் இடத்தில் நீ அதைச் சமைத்து உண்ண வேண்டும். காலையில் நீ திரும்பி, உன் கூடாரங்களுக்குச் செல்ல வேண்டும்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבִשַּׁלְתָּ
  choice: சமைத்து
  rationale: The verb can denote boiling or cooking; in this sacrificial context, the broader Tamil verb preserves the source range without unnecessarily specifying a method.
- source_word: בַּמָּקוֹם אֲשֶׁר יִבְחַר יְהוָה אֱלֹהֶיךָ בּוֹ
  choice: உன் கடவுளாகிய ஆண்டவர் தேர்ந்தெடுக்கும் இடத்தில்
  rationale: The Hebrew pronominal בּוֹ resumes the place and is naturally implicit in Tamil’s locative construction; adding ‘அங்கே’ would be possible but redundant.
- source_word: וּפָנִיתָ
  choice: நீ திரும்பி
  rationale: Preserves the concrete sense ‘turn’ while allowing the following motion verb to complete the departure toward the tents.
- source_word: לְאֹהָלֶיךָ
  choice: உன் கூடாரங்களுக்குச்
  rationale: Retains the Hebrew plural ‘your tents’ rather than generalizing it to ‘home’ or ‘camp.’
- source_word: יְהוָה
  choice: ஆண்டவர்
  rationale: Uses a dignified, broadly intelligible Tamil convention for the divine name without importing a denominationally marked form.
theological_decisions:
- issue: Referent and force of בּוֹ after ‘the place that YHWH will choose’
  choice: Expressed through the Tamil locative ‘இடத்தில்’ without an added object such as ‘for it’
  alternative: ‘அதற்காகத் தேர்ந்தெடுக்கும் இடத்தில்’ or ‘தேர்ந்தெடுக்கும் இடத்தில் அங்கே’
  rationale: In Hebrew, בּוֹ most naturally refers back locatively to ‘the place’ (‘in it/there’). Rendering it as ‘for it’ risks introducing a purpose relation absent from the source.
translation_notes:
  register: Modern standard Tamil with dignified imperative-obligation phrasing. The syntax is kept direct and accessible, while preserving the sequence of cooking, eating, turning, and going to the tents.
