source:
  edition: WLC
  text: וְ/אָמְר֞וּ אֶל זִקְנֵ֣י עִיר֗/וֹ בְּנֵ֤/נוּ זֶה֙ סוֹרֵ֣ר וּ/מֹרֶ֔ה אֵינֶ֥/נּוּ שֹׁמֵ֖עַ בְּ/קֹלֵ֑/נוּ זוֹלֵ֖ל וְ/סֹבֵֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/021/020.yaml
  text: Then they shall say to the elders of his city[a], ‘This son of ours is stubborn and rebellious; he does not listen to our voice; he is a glutton and a drunkard.’
translation:
  language: ta
  text: பின்னர் அவர்கள் அவனுடைய நகரத்தின் மூப்பர்களிடம், “எங்களுடைய இந்த மகன் பிடிவாதக்காரனும் கலகக்காரனுமாய் இருக்கிறான். அவன் எங்கள் குரலுக்குச் செவிகொடுப்பதில்லை[a]. அவன் பெருந்தீனிக்காரனும் குடிகாரனுமாய் இருக்கிறான்” என்று சொல்ல வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவன் எங்களுக்குக் கீழ்ப்படிவதில்லை.” “எங்கள் குரலுக்குச் செவிகொடுப்பதில்லை” என்பது எபிரெய மரபுத்தொடரின் நேரடியான வடிவம்; இங்கே செவிகொடுத்தல் என்பது சொல்லை ஏற்று அதன்படி நடப்பதையும் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמְרוּ
  choice: பின்னர் அவர்கள் … சொல்ல வேண்டும்
  rationale: சட்ட நடைமுறையின் தொடர்ச்சியை உணர்த்தும் எபிரெய வினை அமைப்பை, நவீனத் தமிழில் இயல்பான விதிப்பாங்குடன் அளிக்கிறது.
- source_word: זִקְנֵי עִירוֹ
  choice: அவனுடைய நகரத்தின் மூப்பர்கள்
  rationale: זִקְנֵי என்பது சமூகத்தை ஆளும் மூத்த தலைவர்களைக் குறிக்கிறது; עִירוֹ என்பதன் நகர/ஊர் பொருளில் சட்டநிர்வாகச் சூழலுக்கு ‘நகரம்’ பொருந்துகிறது.
- source_word: בְּנֵנוּ זֶה
  choice: எங்களுடைய இந்த மகன்
  rationale: சுட்டுப்பெயரின் வலியுறுத்தலையும் பெற்றோரின் உறவையும் தெளிவாகவும் இயல்பாகவும் காக்கிறது.
- source_word: סוֹרֵר
  choice: பிடிவாதக்காரன்
  rationale: வழிமாறி உறுதியாக எதிர்த்து நிற்பவனைச் சுட்டும் தொடர்ச்சியான குணத்தைத் தமிழில் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: וּמֹרֶה
  choice: கலகக்காரன்
  rationale: வெறும் முதிர்ச்சியின்மையல்லாமல் செயல்முறையான எதிர்ப்பையும் கீழ்ப்படியாமையையும் குறிக்கும் சட்டரீதியான குற்றச்சாட்டின் வலிமையைப் பேணுகிறது.
- source_word: אֵינֶנּוּ שֹׁמֵעַ בְּקֹלֵנוּ
  choice: அவன் எங்கள் குரலுக்குச் செவிகொடுப்பதில்லை
  rationale: ‘எங்கள் குரலைக் கேட்பதில்லை’ என்ற எபிரெய மரபுத்தொடரைத் தமிழில் இயல்பாகப் பேணி, அதிலுள்ள கவனித்து ஏற்றுக்கொள்ளுதல் அல்லது கீழ்ப்படிதல் என்ற நுண்பொருளையும் தக்கவைக்கிறது.
- source_word: זוֹלֵל
  choice: பெருந்தீனிக்காரன்
  rationale: குடிகாரன் என்பதோடு இணையும் இச்சூழலில், ஊதாரி என்ற பொதுப்பொருளைவிட அளவுக்கு மீறி உண்பவன் என்ற பொருளே பொருத்தமானது.
- source_word: וְסֹבֵא
  choice: குடிகாரன்
  rationale: மதுபானம் அருந்துவதை வழக்கமாகக் கொண்டவனைச் சுட்டும் பங்கேற்புவினையின் தொடர்ச்சியான குணத்தை நேரடியாக வெளிப்படுத்துகிறது.
