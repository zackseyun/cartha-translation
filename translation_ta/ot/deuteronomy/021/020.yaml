translation_notes:
  register: நவீன நிலையான தமிழில், சட்ட நடைமுறைக்கேற்ற கண்ணியமான விதிப்பாங்கு பயன்படுத்தப்பட்டுள்ளது. ‘எங்கள் குரலுக்குச் செவிகொடுப்பதில்லை’ என்ற மூலமொழி உருவகம் பிரதான உரையில் காக்கப்பட்டு, அதன் கீழ்ப்படிதல் சார்ந்த பொருள் அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது.
