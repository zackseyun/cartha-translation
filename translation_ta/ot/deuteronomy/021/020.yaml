  source_fidelity: மூல எபிரெயத்தின் சட்டநடைத் தொடர்ச்சி, ‘அவனுடைய நகரத்தின் மூப்பர்கள்,’ பெற்றோரின் வலியுறுத்தலான ‘எங்களுடைய இந்த மகன்,’ பிடிவாதம்/கலகம், ‘எங்கள் குரலுக்குச் செவிகொடுப்பதில்லை,’ மற்றும் பெருந்தீனி–குடிப்பழக்கம் ஆகிய அனைத்தும் பொருள்தவறாமல் தரப்பட்டுள்ளன. ‘சொல்ல வேண்டும்’ என்பது இச்சட்ட நடைமுறைச் சூழலில் பொருத்தமான விதிப்பாங்காக உள்ளது.
  naturalness: உரை நவீன நிலையான தமிழில் இயல்பாகவும் சட்டரீதியான கண்ணியமான நடையிலும் உள்ளது. ‘பிடிவாதக்காரனும் கலகக்காரனுமாய் இருக்கிறான்’ மற்றும் ‘பெருந்தீனிக்காரனும் குடிகாரனுமாய் இருக்கிறான்’ ஆகிய இணைகள் தெளிவாக உள்ளன.
  terminology: ‘மூப்பர்கள்’ நிர்வாக/சமூகத் தலைவர்களுக்கான பொருத்தமான சொல். ‘கலகக்காரன்’ இச்சூழலில் மோரே என்பதன் செயல்மிக்க எதிர்ப்பைக் போதுமான அளவு உணர்த்துகிறது; ‘பெருந்தீனிக்காரன்,’ ‘குடிகாரன்’ ஆகியவை மூலத்தின் வழக்கமான குணநிலையைக் காக்கின்றன.
