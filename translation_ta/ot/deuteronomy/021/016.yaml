source:
  edition: WLC
  text: וְ/הָיָ֗ה בְּ/יוֹם֙ הַנְחִיל֣/וֹ אֶת בָּנָ֔י/ו אֵ֥ת אֲשֶׁר יִהְיֶ֖ה ל֑/וֹ לֹ֣א יוּכַ֗ל לְ/בַכֵּר֙ אֶת בֶּן הָ֣/אֲהוּבָ֔ה עַל פְּנֵ֥י בֶן הַ/שְּׂנוּאָ֖ה הַ/בְּכֹֽר־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/021/016.yaml
  text: And on the day he gives his sons as an inheritance what belongs to him[a], he may not treat the son of the loved wife as firstborn over the son of the hated wife, who is the firstborn.
translation:
  language: ta
  text: அவன் தனக்குச் சொந்தமானவற்றைத் தன் மகன்களுக்கு உரிமைச் சொத்தாகப் பகிர்ந்தளிக்கும் நாளில், முதற்பேறானவனாகிய வெறுக்கப்பட்ட மனைவியின்[a] மகனுக்கு மேலாக, அன்பு செலுத்தப்பட்ட மனைவியின் மகனை முதற்பேறானவனாக நடத்த அவனுக்கு உரிமையில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அன்பு செலுத்தப்படாத மனைவி’ அல்லது ‘குறைவாக அன்பு செலுத்தப்பட்ட மனைவி.’ எபிரெயத்தில் சொல்லுக்குச் சொல் ‘அன்பு செலுத்தப்பட்டவள்’ மற்றும் ‘வெறுக்கப்பட்டவள்’ என்று எதிரிணையாக உள்ளது. ஆனால் குடும்பச் சட்டச் சூழலில் பின்னைய சொல் முற்றிலும் வெறுக்கப்படுகிறவளைக் குறிக்காமல், மற்றவளைவிடக் குறைவாக விரும்பப்படுகிறவளைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה בְּיוֹם
  choice: நாளில்
  rationale: சட்டவிதியின் சூழ்நிலையை அறிமுகப்படுத்தும் எபிரெயக் கட்டமைப்பு. தமிழில் தனியே ‘அப்போது நிகழும்’ என்று சேர்க்காமல் காலச் சார்பு வாக்கியமாக இயல்பாக வழங்கப்பட்டுள்ளது.
- source_word: הַנְחִילוֹ אֶת בָּנָיו
  choice: தன் மகன்களுக்கு உரிமைச் சொத்தாக அளிக்கும்
  rationale: נחל என்பதன் Hiphil வடிவம் ஒருவரை உரிமை பெறச் செய்தல் அல்லது உரிமைச் சொத்தை வழங்குதல் என்னும் பொருளைத் தருகிறது. ‘மகன்களைச் சொத்தாக அளித்தல்’ என்ற தவறான தொடர்பைத் தவிர்க்க, தமிழின் இயல்பான வேற்றுமை அமைப்பு பயன்படுத்தப்பட்டுள்ளது.
- source_word: אֵת אֲשֶׁר יִהְיֶה לוֹ
  choice: தனக்குச் சொந்தமானவற்றை
  rationale: அவனிடம் உள்ள உடைமைகள் அல்லது சொத்துத் தொகுதியைக் குறிக்கும் விரிவான சொற்றொடர்; மூலத்தின் பொதுத்தன்மை காக்கப்பட்டுள்ளது.
- source_word: לֹא יוּכַל
  choice: அவனுக்கு உரிமையில்லை
  rationale: இச்சட்டச் சூழலில் உடல் இயலாமையை அல்ல, சட்டப்படி செய்ய முடியாமையையும் அனுமதியின்மையையும் குறிக்கிறது.
- source_word: לְבַכֵּר
  choice: முதற்பேறானவனாக நடத்த
  rationale: Piel வடிவம் முதற்பேற்றின் நிலை அல்லது உரிமைகளை ஒருவருக்கு வழங்குவதைக் குறிக்கிறது. மூலத்தில் வெளிப்படையாக இல்லாத உரிமைப் பங்கின் விவரங்களைச் சேர்க்காமல் சட்டப் பொருள் காக்கப்பட்டுள்ளது.
- source_word: בֶּן הָאֲהוּבָה
  choice: அன்புக்குரிய மனைவியின் மகன்
  rationale: சொற்பொருள் ‘அன்பு செலுத்தப்பட்டவளின் மகன்.’ முந்தைய வசனச் சூழலிலிருந்து ‘மனைவி’ தெளிவாக நிரப்பப்பட்டுள்ளது.
- source_word: עַל פְּנֵי
  choice: அவனைப் புறக்கணித்து
  rationale: இங்கு உண்மையான முதற்பேறான மகனை விட மற்றவனுக்கு முன்னுரிமை அளிப்பதைக் குறிக்கிறது. தமிழில் சட்டத்தின் எதிர்மறைச் செயலைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: בֶן הַשְּׂנוּאָה
  choice: வெறுக்கப்பட்ட மனைவியின் மகன்
  rationale: שׂנא என்பதன் வலுவான சொற்பொருளை முதன்மை உரையில் காக்கிறது; குடும்ப ஒப்பீட்டில் ‘குறைவாக அன்பு செலுத்தப்பட்ட’ என்ற மென்மையான பொருள் இருக்கக்கூடும் என்பதால் அது அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: הַבְּכֹר
  choice: முதற்பேறானவனாக
  rationale: வெறுக்கப்பட்ட மனைவியின் மகன்தான் உண்மையான முதற்பேறானவன் என்பதைத் தெளிவுபடுத்துகிறது.
theological_decisions:
- issue: இரு மனைவிகளுக்கிடையிலான உறவுநிலையைச் சுட்டும் אֲהוּבָה / שְׂנוּאָה என்ற எதிரிணை
  choice: முதன்மை உரையில் ‘அன்புக்குரிய மனைவி’ மற்றும் ‘வெறுக்கப்பட்ட மனைவி’ என்று வலுவான எதிரிணையை வைத்தல்
  alternative: ‘அன்புக்குரிய மனைவி’ மற்றும் ‘குறைவாக அன்பு செலுத்தப்பட்ட மனைவி’
  rationale: எபிரெய மூலத்தின் வெளிப்படையான எதிரிணையை மென்மையாக்காமல் காக்கிறது. அதேவேளை, குடும்பச் சட்டச் சூழலில் இது ஒப்பீட்டு விருப்பத்தைக் குறிக்கக்கூடிய உண்மையான மொழியியல் வாய்ப்பை அடிக்குறிப்பு பாதுகாக்கிறது.
- issue: לֹא יוּכַל என்பதன் சட்ட வலிமை
  choice: ‘அவனுக்கு உரிமையில்லை’
  alternative: ‘அவனால் முடியாது’
  rationale: இது நடைமுறை இயலாமை அல்ல; முதற்பேற்றுரிமையை மாற்றுவதற்கான சட்ட அதிகாரம் அவனுக்கு இல்லை என்பதே சூழலுக்கேற்ற பொருள்.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளும் கண்ணியமான சட்டநடையைப் பயன்படுத்துகிறது. ‘உரிமைச் சொத்து,’ ‘உரிமையில்லை,’ ‘முதற்பேறானவனாக நடத்த’ ஆகியவை சட்டப் பொருளைத் தெளிவாக்குகின்றன; மூலத்தில் இல்லாத வாரிசுப் பங்கு விவரங்கள் சேர்க்கப்படவில்லை.
