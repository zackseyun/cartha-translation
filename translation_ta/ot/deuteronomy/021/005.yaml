source:
  edition: WLC
  text: וְ/נִגְּשׁ֣וּ הַ/כֹּהֲנִים֮ בְּנֵ֣י לֵוִי֒ כִּ֣י בָ֗/ם בָּחַ֞ר יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ לְ/שָׁ֣רְת֔/וֹ וּ/לְ/בָרֵ֖ךְ בְּ/שֵׁ֣ם יְהוָ֑ה וְ/עַל פִּי/הֶ֥ם יִהְיֶ֖ה כָּל רִ֥יב וְ/כָל נָֽגַע־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/021/005.yaml
  text: And the priests[a], the sons of Levi, shall come forward, for Yahweh your God has chosen them to minister to him and to bless in the name of Yahweh, and by their word every dispute and every injury shall be settled.
translation:
  language: ta
  text: லேவியின் மகன்களான ஆசாரியர்கள் முன்வருவார்கள்; ஏனெனில், உன் கடவுளாகிய யாவே தமக்குப் பணிவிடை செய்யவும், யாவேயின் பெயரில் ஆசீர்வதிக்கவும் அவர்களைத் தேர்ந்தெடுத்திருக்கிறார். எல்லா வழக்குகளும் எல்லாப் பாதிப்புகளும்[a] அவர்களுடைய சொல்லின்படியே தீர்மானிக்கப்படும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “காயம்,” “அடி,” அல்லது “நோய்ப்பாதிப்பு.” இதற்கான எபிரெயச் சொல் பலவகையான உடல் பாதிப்புகளைக் குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנִגְּשׁוּ
  choice: முன்வர வேண்டும்
  rationale: இந்த நிபால் வினை, சடங்கு-நீதிமுறை நடவடிக்கையில் ஆசாரியர்கள் அதிகாரபூர்வமாக அணுகி ஈடுபடுவதைக் குறிக்கிறது; ‘முன்வர வேண்டும்’ என்பது இயல்பான நவீனத் தமிழ்.
- source_word: הַכֹּהֲנִים בְּנֵי לֵוִי
  choice: லேவியின் மக்களான ஆசாரியர்கள்
  rationale: எபிரெய உரையின் இணைப்புச் சொல்லமைப்பையும், ஆசாரியர்கள் லேவியின் வழிவந்தவர்கள் என்பதையும் தெளிவாகக் காக்கிறது.
- source_word: כִּי בָם בָּחַר
  choice: ஏனெனில் ... அவர்களைத் தேர்ந்தெடுத்திருக்கிறார்
  rationale: כִּי காரணத்தைக் காட்டுகிறது; நிறைவுற்ற தேர்வின் தொடரும் விளைவைத் தமிழ் நிகழ்கால நிறைவு வடிவம் வெளிப்படுத்துகிறது.
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: உன் கடவுளாகிய யாவே
  rationale: உடன்படிக்கைப் பெயரான יהוה ஒலிபெயர்க்கப்பட்டு, אֱלֹהֶיךָ ஒருமை இரண்டாம் நபருக்கேற்ப ‘உன் கடவுள்’ என வழங்கப்படுகிறது.
- source_word: לְשָׁרְתוֹ
  choice: தமக்குப் பணிவிடை செய்யவும்
  rationale: שרת ஆசாரியச் சூழலில் புனிதப் பணியைக் குறிக்கிறது; ‘பணிவிடை செய்ய’ என்பது வெறும் பொதுவான சேவையைவிட அந்த நுட்பத்தை நன்றாகக் காட்டுகிறது.
- source_word: וּלְבָרֵךְ בְּשֵׁם יְהוָה
  choice: யாவேயின் பெயரில் ஆசீர்வதிக்கவும்
  rationale: தெய்வீக அதிகாரத்தின்கீழ் ஆசாரியர்கள் ஆசீர்வாதம் வழங்குவதை நேரடியாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: וְעַל פִּיהֶם
  choice: அவர்களுடைய சொல்லின்படியே
  rationale: ‘அவர்களுடைய வாயின்படி’ என்ற எபிரெய மரபுத்தொடர் அவர்களின் அதிகாரபூர்வமான வாய்மொழித் தீர்ப்பைக் குறிக்கிறது; தமிழ் மொழியில் ‘சொல்லின்படியே’ அந்தச் சொல்லடிப்படையைப் பேணுகிறது.
- source_word: יִהְיֶה
  choice: தீர்மானிக்கப்படும்
  rationale: எபிரெயில் வினை பொதுவாக ‘இருக்கும்’ என்றாலும், இந்நீதிமுறைச் சூழலில் மறைந்துள்ள தீர்ப்புச் செயலைத் தமிழில் வெளிப்படையாகச் சொல்வது அவசியம்.
- source_word: כָּל רִיב
  choice: எல்லா வழக்குகளும்
  rationale: רִיב சச்சரவையும் நீதிமன்ற வழக்கையும் குறிக்கலாம்; இச்சட்டச் சூழலில் ‘வழக்கு’ இயல்பானதும் பொருத்தமானதும்.
- source_word: וְכָל נָגַע
  choice: எல்லாப் பாதிப்புகளும்[a]
  rationale: נֶגַע என்பது அடி, காயம், நோய்ப்பாதிப்பு போன்ற பல பொருள்களைக் கொண்டது. ‘பாதிப்பு’ அதன் அகலத்தை ஓரளவு காக்கிறது; அடிக்குறிப்பு மாற்றுப் பொருள்களைப் பதிவு செய்கிறது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூல உரை உடன்படிக்கைப் பெயரை நேரடியாகப் பயன்படுத்துவதால் அதை பொதுப்பட்டமாக மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
- issue: נֶגַע என்பதன் சட்ட-ஆசாரியப் பொருள்
  choice: பாதிப்பு
  alternative: காயம்; அடி; நோய்ப்பாதிப்பு
  rationale: இச்சொல் உடற்காயத்தை மட்டுமே குறிக்கிறதா அல்லது ஆசாரியர்கள் ஆராயும் நோய்ப்பாதிப்புகளையும் உள்ளடக்குகிறதா என்பது முழுமையாகத் தெளிவில்லை; அகன்ற சொல்லைத் தேர்ந்தெடுத்து அந்தத் தெளிவின்மையைப் பேணுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், சட்ட மற்றும் ஆசாரியச் சூழலுக்கு ஏற்ற கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ஒருமை இரண்டாம் நபரான ‘உன்’ மூல உரைக்கு ஏற்ப காக்கப்பட்டுள்ளது; யாவேயைக் குறிக்கும் இடத்தில் மரியாதைப் பன்மை பயன்படுத்தப்பட்டுள்ளது.
