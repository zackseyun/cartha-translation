base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/021/015.yaml
  text: If a man has two wives[a], one loved and the other unloved, and both the loved and the unloved have borne him sons, and the firstborn son belongs to the unloved wife,
translation:
  language: ta
  text: ஒருவனுக்கு இரண்டு மனைவிகள் இருந்தால், அவர்களில் ஒருத்தி அன்புக்குரியவளாகவும் மற்றவள் அன்பு பெறாதவளாகவும்[a] இருந்து, அன்புக்குரியவளும் அன்பு பெறாதவளும் அவனுக்கு மகன்களைப் பெற்றிருந்து, மூத்த மகன் அன்பு பெறாதவளுக்குப் பிறந்தவனாக இருந்தால்,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அன்பு பெறாதவள்” என்பதற்கு “வெறுக்கப்பட்டவள்” என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் அந்த வலுவான பொருளையும் தரக்கூடும்; ஆனால் இங்கு அன்புக்குரிய மனைவிக்கு மாறாக ஆதரவு பெறாத மனைவியைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: இருந்து ... இருந்தால்
  rationale: எபிரெயச் சட்டத்தின் நிபந்தனைச் சூழலை இயல்பான தமிழில் அறிமுகப்படுத்துகிறது.
- source_word: תִהְיֶיןָ לְאִישׁ שְׁתֵּי נָשִׁים
  choice: ஒருவனுக்கு இரண்டு மனைவிகள் இருந்து
  rationale: சொல்லுக்குச் சொல் அமைப்பின் பொருளைத் தக்கவைத்து, திருமண உறவைக் குறிக்கும் נָשִׁים என்பதை ‘மனைவிகள்’ எனத் தெளிவாக வழங்குகிறது.
- source_word: הָאַחַת אֲהוּבָה
  choice: ஒருத்தி அன்புக்குரியவளாக
  rationale: אֲהוּבָה என்பதன் ‘அன்பு செலுத்தப்படுபவள்’ என்ற நேரடிப் பொருளை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: וְהָאַחַת שְׂנוּאָה
  choice: மற்றவள் அன்பு பெறாதவளாக
  rationale: சொல் வலுவாக ‘வெறுக்கப்பட்டவள்’ என்றும் பொருள்படலாம்; இங்கு அன்புக்குரிய மனைவிக்கு எதிரான புறக்கணிக்கப்பட்ட நிலையை மிகைப்படுத்தாமல் காட்டுகிறது.
- source_word: וְיָלְדוּ לוֹ בָנִים
  choice: அவனுக்கு மகன்களைப் பெற்றிருக்க
  rationale: בָנִים என்பதை பாலினப் பொதுமைப்படுத்தாமல் ‘மகன்கள்’ எனத் தக்கவைத்து, சட்டச் சூழலுக்கு ஏற்ற நிறைவுற்ற நிகழ்வாக வழங்குகிறது.
- source_word: וְהָיָה הַבֵּן הַבְּכוֹר לַשְּׂנִיאָה
  choice: மூத்த மகன் அன்பு பெறாதவளுக்குப் பிறந்தவனாக இருந்தால்
  rationale: முதற்பேறான மகன் எந்த மனைவியின் மகன் என்பதைத் தெளிவான தமிழில் கூறுகிறது; ‘மூத்த மகன்’ இங்கு முதற்பேறான மகனைக் குறிக்கிறது.
theological_decisions:
- issue: שְׂנוּאָה என்ற சொல்லை குடும்பச் சட்டச் சூழலில் மொழிபெயர்த்தல்
  choice: அன்பு பெறாதவள்
  alternative: வெறுக்கப்பட்டவள்; குறைவாக நேசிக்கப்பட்டவள்
  rationale: எபிரெயச் சொல் ‘வெறுக்கப்பட்டவள்’ என்ற வலுவான பொருளைக் கொள்ளக்கூடும். ஆனால் இச்சூழலில் அது அன்புக்குரிய மனைவிக்கு மாறாக ஆதரவு பெறாத அல்லது புறக்கணிக்கப்பட்ட மனைவியைக் குறிக்கலாம். முதன்மை உரை உறவுநிலையை இயல்பாகக் காட்டுகிறது; வலுவான மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், சட்ட நிபந்தனையின் தொடர்ச்சியைப் பேணும் கண்ணியமான நடை. அடுத்த வசனத்தில் வாக்கியம் தொடர்வதால் இறுதியில் முற்றுப்புள்ளிக்குப் பதிலாக காற்புள்ளி வைக்கப்பட்டுள்ளது.
