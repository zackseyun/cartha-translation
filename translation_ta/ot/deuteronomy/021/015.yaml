- from: ஒருவனுக்கு இரண்டு மனைவிகள் இருந்து, ஒருத்தி அன்புக்குரியவளாகவும் மற்றவள் அன்பு பெறாதவளாகவும் இருக்கலாம்.[a] அன்புக்குரியவளும் அன்பு பெறாதவளும் அவனுக்கு மகன்களைப் பெற்றிருக்க, மூத்த மகன் அன்பு பெறாதவளுக்குப் பிறந்தவனாக இருந்தால்,
