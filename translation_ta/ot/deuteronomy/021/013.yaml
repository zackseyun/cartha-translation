  text: וְ/הֵסִ֩ירָה֩ אֶת שִׂמְלַ֨ת שִׁבְיָ֜/הּ מֵ/עָלֶ֗י/הָ וְ/יָֽשְׁבָה֙ בְּ/בֵיתֶ֔/ךָ וּ/בָֽכְתָ֛ה אֶת אָבִ֥י/הָ וְ/אֶת אִמָּ֖/הּ יֶ֣רַח יָמִ֑ים וְ/אַ֨חַר כֵּ֜ן תָּב֤וֹא אֵלֶ֨י/הָ֙ וּ/בְעַלְתָּ֔/הּ וְ/הָיְתָ֥ה לְ/ךָ֖ לְ/אִשָּֽׁה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/021/013.yaml
  text: She shall remove the clothing of her captivity from herself and remain in your house[a], and mourn her father and her mother for a month of days. After that you may go in to her and be her husband, and she shall be your wife.
translation:
  language: ta
  text: அவள் தன் சிறைநிலையின் உடையை[a] தன் உடலிலிருந்து அகற்றி, உன் வீட்டில் தங்கி, தன் தந்தையையும் தாயையும் நினைத்து ஒரு மாதம் அழ வேண்டும். அதன் பிறகு நீ அவளிடம் சென்று, அவளுக்குக் கணவனாவாய்; அவள் உனக்கு மனைவியாவாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவளுடைய சிறையிருப்பின் உடை” அல்லது “அவள் பிடிக்கப்பட்டபோது அணிந்திருந்த உடை.”
    reason: சִׂמְלַת שִׁבְיָהּ என்பதன் தொடர்புப்பொருள் எந்த வகை உடையைக் குறிக்கிறது என்பதை மூல உரை துல்லியமாக வரையறுக்கவில்லை; மாற்று விளக்கங்களைச் சுட்டுகிறது.
lexical_decisions:
- source_word: וְהֵסִירָה
  choice: அகற்றி
  rationale: הסיר என்பதன் ஹிஃபில் வடிவம் அகற்றுதல் அல்லது கழற்றுதல் என்ற செயற்பொருளைக் கொண்டது; உடை தொடர்பான சூழலில் இயல்பான தமிழாக உள்ளது.
- source_word: שִׂמְלַת שִׁבְיָהּ
  choice: அவள் சிறைப்பட்டபோது அணிந்திருந்த உடை
  rationale: எபிரேயத்தின் ‘அவளுடைய சிறையிருப்பின் உடை’ என்ற தொடர்பை, அது சிறைப்பட்ட நிலையின் அடையாள உடையா அல்லது பிடிக்கப்பட்டபோது அணிந்த உடையா என்பதை மிகுதியாகத் தீர்மானிக்காமல், சாதாரண வாசகருக்குப் புரியும் வகையில் அளிக்கிறது.
- source_word: מֵעָלֶיהָ
  choice: தன்னிடமிருந்து
  rationale: சொல்லுக்குச் சொல் ‘அவள்மேலிருந்து’; ‘அகற்றி’ என்பதுடன் இவ்வடிவம் பிரதிபெயர்ச் சார்பைத் தக்கவைக்கிறது.
- source_word: וְיָשְׁבָה בְּבֵיתֶךָ
  choice: உன் வீட்டில் தங்கியிருந்து
  rationale: ישב என்பது அமருதல், குடியிருத்தல், தங்கியிருத்தல் ஆகிய பொருள்களை உடையது; இச்சட்டச் சூழலில் தொடர்ந்திருக்கும் காலத்தை ‘தங்கியிருந்து’ இயல்பாகக் குறிக்கிறது.
- source_word: וּבָכְתָה אֶת אָבִיהָ וְאֶת אִמָּהּ
  choice: தன் தந்தையையும் தாயையும் நினைத்து ... அழுது துக்கம் அனுசரிக்க வேண்டும்
  rationale: בכה அடிப்படையில் ‘அழுதல்’; பெற்றோரை நேரடிப் பொருளாகக் கொண்ட இச்சூழல் துக்கம் அனுசரிப்பதைக் குறிக்கிறது. ‘அழுது’ என்ற மூலச் செயலும் துக்கச் சூழலும் இரண்டும் பாதுகாக்கப்படுகின்றன.
- source_word: יֶרַח יָמִים
  choice: ஒரு மாத காலம்
  rationale: சொல்லுக்குச் சொல் ‘நாட்களுள்ள ஒரு மாதம்’; தமிழில் ‘ஒரு மாத காலம்’ என்பது முழு கால அளவை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: תָּבֹא אֵלֶיהָ
  choice: நீ அவளிடம் சேரலாம்
  rationale: ‘அவளிடம் செல்லுதல்/உட்புகுதல்’ என்பது பாலுறவைக் குறிக்கும் எபிரேய மரபுத்தொடர். ‘சேரலாம்’ அதன் மறைமுகத் தன்மையையும் சட்ட அனுமதியையும் தமிழில் தக்கவைக்கிறது.
- source_word: וּבְעַלְתָּהּ
  choice: அவளுக்குக் கணவனாவாய்
  rationale: இச்சூழலில் בעל கணவனின் நிலையை ஏற்றலைக் குறிக்கிறது; உடைமைப் பொருளைத் தவறாகச் சேர்க்காமல் திருமண உறவை வெளிப்படுத்துகிறது.
- source_word: וְהָיְתָה לְךָ לְאִשָּׁה
  choice: அவள் உனக்கு மனைவியாவாள்
  rationale: எபிரேயத்தின் வழக்கமான திருமண நிலைச் சூத்திரத்தை நேரடியாகவும் இயல்பாகவும் வழங்குகிறது.
theological_decisions:
- issue: போரில் சிறைப்பட்ட பெண்ணைப் பற்றிய கடினமான சட்டத்தில் பாலுறவு மற்றும் திருமண மொழி
  choice: ‘அவளிடம் சேரலாம்’ என்பதையும், அதன் பின் கணவன் மற்றும் மனைவி என்ற தெளிவான திருமண நிலையையும் தனித்தனியாகப் பாதுகாத்தல்
  alternative: முழுவதையும் ‘அவளை மணந்துகொள்ளலாம்’ என்று மென்மையாக்குதல், அல்லது ‘அவளுடன் பாலுறவு கொள்ளலாம்’ என்று மறைமுக மொழியை முற்றிலும் வெளிப்படையாக்குதல்
  rationale: மூல உரை அவளிடம் செல்லுதல், கணவனாதல், அவள் மனைவியாதல் ஆகியவற்றை வேறுபடுத்திக் கூறுகிறது. தமிழாக்கமும் அந்தச் சட்ட மற்றும் அறநெறிசார் பதற்றத்தைத் தீர்த்துவிடாமல் தக்கவைக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளும் கண்ணியமான சட்டநடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் மரபுத்தொடர் மிக வெளிப்படையாகவும் மிக மென்மையாகவும் மாற்றப்படவில்லை.
