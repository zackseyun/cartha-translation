revisions:
- from: அவள் சிறைப்பட்டபோது அணிந்திருந்த உடையைத் தன்னிடமிருந்து அகற்றி, உன் வீட்டில் தங்கியிருந்து, தன் தந்தையையும் தாயையும் நினைத்து ஒரு மாத காலம் அழுது துக்கம் அனுசரிக்க வேண்டும். அதன் பிறகு நீ அவளிடம் சேரலாம்; அவளுக்குக் கணவனாவாய், அவள் உனக்கு மனைவியாவாள்.
  to: அவள் தன் சிறைநிலையின் உடையை[a] தன் உடலிலிருந்து அகற்றி, உன் வீட்டில் தங்கி, தன் தந்தையையும் தாயையும் நினைத்து ஒரு மாதம் அழ வேண்டும். அதன் பிறகு நீ அவளிடம் சென்று, அவளுக்குக் கணவனாவாய்; அவள் உனக்கு மனைவியாவாள்.
  rationale: This revision corrects the over-specific rendering of the captivity-clothing phrase, removes an added ritual nuance from the mourning clause, and supplies a properly anchored lexical footnote. It retains the Hebrew legal sequence and the differentiated sexual and marital idioms without adding doctrinal interpretation.
