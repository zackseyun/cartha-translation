base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/021/010.yaml
  text: When you go out to war against your enemies[a], and Yahweh your God gives them into your hand, and you take them captive[b],
translation:
  language: ta
  text: உன் பகைவர்களுக்கு எதிராக நீ போருக்குப் புறப்பட்டுச் செல்லும்போது, உன் கடவுளாகிய யாவே அவர்களை[a] உன் கையில் ஒப்புக்கொடுத்து, நீ அவர்களிடமிருந்து கைதிகளைப் பிடித்தாய்[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொல்லுக்குச் சொல், ‘அவனை/அதை உன் கையில் கொடுத்து.’ ஒருமைச் சுட்டுப்பின்னொட்டு பகைவர் படையை ஒரு தொகுதியாகக் குறிப்பதாகத் தெரிகிறது; அதனால் உரையில் ‘அவர்களை’ என்று தரப்பட்டுள்ளது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘நீ அவர்களிடமிருந்து கைதிகளைக் கைப்பற்றினாய்.’ எபிரெயத்தில் கைதிகளைப் பிடிப்பதைக் குறிக்க ஒரே சொல்லேரைச் சேர்ந்த வினைச்சொல்லும் பெயர்ச்சொல்லும் இணைந்து வருகின்றன.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: புறப்பட்டுச் செல்லும்போது
  rationale: இங்கு כִּי ஒரு சட்டச் சூழ்நிலையை அறிமுகப்படுத்துகிறது. எனவே நிபந்தனையை மட்டும் வலியுறுத்தும் ‘என்றால்’ என்பதைக் காட்டிலும் ‘செல்லும்போது’ இயல்பானது; தொடரும் வினைச்சொல்லுடன் இணைத்து மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: תֵצֵא לַמִּלְחָמָה
  choice: போருக்குப் புறப்பட்டுச் செல்லும்போது
  rationale: יָצָא என்பதன் ‘வெளியே செல்/புறப்படு’ என்ற இயக்கத்தையும், לַמִּלְחָמָה என்பதன் போர்ச் சூழலையும் இயல்பான நவீனத் தமிழில் காக்கிறது.
- source_word: עַל אֹיְבֶיךָ
  choice: உன் பகைவர்களுக்கு எதிராக
  rationale: பகைமைச் செயலைக் குறிக்கும் עַל என்பதற்கு ‘எதிராக’ பொருத்தமானது; אֹיְבֶיךָ என்பது பன்மையில் ‘உன் பகைவர்கள்’ என வருகிறது.
- source_word: וּנְתָנוֹ
  choice: அவர்களை … ஒப்புக்கொடுத்து
  rationale: נתן என்பதன் அடிப்படைப் பொருளான ‘கொடு’ என்பதைக் காத்து, எதிரிகளை ஒருவரின் அதிகாரத்திற்குள் கொடுக்கும் சூழலில் ‘ஒப்புக்கொடுத்து’ என வழங்கப்பட்டுள்ளது. எபிரெயச் சுட்டுப்பின்னொட்டு ஒருமையில் இருந்தாலும், முன்வரும் பகைவர் படையைத் தொகுதியாகக் குறிக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரான நான்கு எழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் பரவலாகப் புரிந்துகொள்ளக்கூடிய ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: אֱלֹהֶיךָ
  choice: உன் கடவுளாகிய
  rationale: இரண்டாம் நபர் ஒருமை உடைமைப்பொருளுடன் வரும் உடன்படிக்கைச் சொல்லாக்கத்தை இயல்பான தமிழில் தருகிறது.
- source_word: בְּיָדֶךָ
  choice: உன் கையில்
  rationale: ஒருவரின் அதிகாரம் அல்லது கட்டுப்பாட்டுக்குள் கொடுப்பதைக் குறிக்கும் எபிரெய உருவகத்தைத் தமிழிலும் தெளிவாகக் காக்கிறது.
- source_word: וְשָׁבִיתָ שִׁבְיוֹ
  choice: நீ அவர்களிடமிருந்து கைதிகளைப் பிடித்தால்
  rationale: שָׁבָה மற்றும் அதனோடு தொடர்புடைய שְׁבִי ஆகிய வினை–பெயர் இணைப்பின் பொருள், தோற்கடிக்கப்பட்ட எதிரிகளிடமிருந்து கைதிகளைப் பிடிப்பதாகும். தமிழில் தேவையற்ற சொல் மறுமொழியின்றி இதைத் தெளிவாக வழங்குகிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: ஆண்டவர் / யெகோவா
  rationale: மூல உரையில் தனிப்பட்ட தெய்வீகப் பெயர் நேரடியாக உள்ளது. ஆகவே அதை ‘ஆண்டவர்’ என்ற பட்டத்தால் மாற்றாமல் ஒலிபெயர்க்கப்பட்டுள்ளது; ‘யாவே’ என்பது எபிரெயப் பெயரின் ஏற்றுக்கொள்ளப்பட்ட மறுவடிவ உச்சரிப்பை நெருக்கமாகப் பிரதிபலிக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் மரியாதைமிக்க நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. மூலத்தில் இரண்டாம் நபர் ஆண்பால் ஒருமை இருந்தாலும், தமிழில் இயல்பான பொதுமை ஒருமையான ‘நீ/உன்’ பயன்படுத்தப்பட்டுள்ளது. வசனம் அடுத்த வசனத்தில் தொடரும் சட்ட நிபந்தனையின் தொடக்கம் என்பதால் இறுதியில் காற்புள்ளி வைக்கப்பட்டுள்ளது.
