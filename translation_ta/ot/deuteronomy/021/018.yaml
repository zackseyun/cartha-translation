base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/021/018.yaml
  text: If a man has a stubborn and rebellious son who does not listen to the voice of his father or to the voice of his mother[a], and though they discipline him, he does not listen to them[d][c][b],
translation:
  language: ta
  text: ஒருவனுக்கு அடங்காதவனும் கலகக்காரனுமான ஒரு மகன் இருந்தால், அவன் தன் தந்தையின் குரலுக்கும் தன் தாயின் குரலுக்கும் செவிகொடுக்காமல்,[a] அவர்கள் அவனை ஒழுக்கப்படுத்தியும் அவன் அவர்களுக்குச் செவிகொடுக்காவிட்டால்,[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “தன் தந்தையின் குரலுக்கும் தன் தாயின் குரலுக்கும்.” இங்கு “குரலுக்குச் செவிகொடுத்தல்” என்பது பெற்றோரின் அறிவுறுத்தலை ஏற்று அதன்படி நடப்பதைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அவர்கள் அவனை ஒழுக்கப்படுத்தி, அவன் அவர்களுக்குச் செவிகொடுக்காவிட்டால்.” எபிரெய இணைப்புச்சொல்லை நேரடியாகவும், இச்சூழலில் “ஒழுக்கப்படுத்தியும்” என்ற விட்டுக்கொடுப்பு உணர்வுடனும் மொழிபெயர்க்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: …இருந்து …ஆவிட்டால்
  rationale: எபிரெய சட்ட நிபந்தனைச் சூத்திரத்தை இயல்பான தமிழ் நிபந்தனை வாக்கியமாகத் தருகிறது; ‘ஒருவனுக்கு … மகன் இருந்தால்’ என்றும் அமைக்கலாம்.
- source_word: יִהְיֶה לְאִישׁ
  choice: ஒருவனுக்கு … ஒரு மகன் இருந்து
  rationale: ‘ஒரு மனிதனுக்கு இருக்கிறான்’ என்ற எபிரெய உடைமை அமைப்பை இயல்பான தமிழில் தருகிறது.
- source_word: בֵּן
  choice: மகன்
  rationale: மூலச்சொல் பாலினக் குறிப்புடன் ‘மகன்’ எனப் பொருள்படுகிறது; பொதுவான ‘பிள்ளை’ அல்ல.
- source_word: סוֹרֵר וּמוֹרֶה
  choice: அடங்காதவனும் கலகம் செய்கிறவனுமான
  rationale: முதல் சொல் பிடிவாதமாக வழிக்குவராமையையும், இரண்டாவது சொல் அதிகாரத்திற்கு எதிராகச் செயல்படும் கலகத்தையும் இணைத்துக் காட்டுகிறது.
- source_word: אֵינֶנּוּ שֹׁמֵעַ
  choice: கீழ்ப்படியாமல்
  rationale: שׁמע என்பதன் அடிப்படைப் பொருள் ‘கேட்பது’ என்றாலும், இங்கு பெற்றோரின் அறிவுறுத்தலை ஏற்று நடப்பது தெளிவாகக் குறிக்கப்படுகிறது; இயல்பான தமிழில் ‘கீழ்ப்படி’ அதைப் பொருத்தமாகத் தருகிறது.
- source_word: בְּקוֹל אָבִיו וּבְקוֹל אִמּוֹ
  choice: தன் தந்தையின் சொல்லுக்கும் தன் தாயின் சொல்லுக்கும்
  rationale: ‘குரலுக்கு’ என்ற எபிரெய மரபுத்தொடர் அதிகாரமுள்ள அறிவுறுத்தலைக் குறிக்கிறது. ‘சொல்லுக்கு’ என்பது மூல உருவகத்தின் ஓரளவைத் தக்கவைத்தபடி தமிழில் இயல்பாக உள்ளது.
- source_word: וְיִסְּרוּ אֹתוֹ
  choice: அவர்கள் அவனைக் கண்டித்துத் திருத்திய பின்னும்
  rationale: יסר என்பது வெறும் தண்டனை அல்ல, ஒழுக்கப்படுத்தும் திருத்தத்தைக் குறிக்கிறது. சூழலில் இணைப்புச்சொல் விட்டுக்கொடுப்பு உணர்வைத் தருவதால் ‘பின்னும்’ பயன்படுத்தப்பட்டது.
- source_word: וְלֹא יִשְׁמַע אֲלֵיהֶם
  choice: அவர்களுக்குக் கீழ்ப்படியாவிட்டால்
  rationale: மீண்டும் வரும் שׁמע-ஐ அதே ‘கீழ்ப்படி’ சொல்லால் தருவது மூலத்தின் வலியுறுத்தலைக் காக்கிறது; சட்ட நிபந்தனையைத் தமிழில் நிறைவு செய்கிறது.
