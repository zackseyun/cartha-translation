translation_notes:
  register: நவீன நிலையான தமிழில், சட்ட உரைக்கேற்ற கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. ‘கீழ்ப்படி’ வாசகருக்கு உடனடியாகப் புரியும் வகையில் பயன்படுத்தப்பட்டுள்ளது; ‘குரல்’ என்ற மூல மரபுத்தொடர் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது. வசனம் அடுத்த வசனத்தில் தொடரும் நிபந்தனை வாக்கியம் என்பதால் இறுதியில் காற்புள்ளி வைக்கப்பட்டுள்ளது.
