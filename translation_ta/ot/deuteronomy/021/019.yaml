translation_notes:
  register: நவீன நிலையான தமிழில், சட்டப்பாங்கின் கண்ணியத்தையும் மூலத்தின் வரிசையையும் காக்கும் உகந்த-ஒப்புமை நடை பயன்படுத்தப்பட்டுள்ளது. “தகப்பன்” வேதாகமச் சட்டச் சூழலுக்கேற்ற மரியாதையான பொதுநடைச் சொல்லாகத் தேர்ந்தெடுக்கப்பட்டது; மிகப் பழமையான வினை வடிவங்கள் தவிர்க்கப்பட்டன.
