base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/021/019.yaml
  text: then his father and his mother shall seize him and bring him out to the elders of his city and to the gate of his place[a][b].
translation:
  language: ta
  text: அப்போது அவனுடைய தந்தையும் தாயும் அவனைப் பிடித்துக்கொண்டு, அவனை வெளியே அழைத்துக்கொண்டு சென்று அவனுடைய நகரத்து மூப்பர்களிடமும் அவன் வசிக்கும் இடத்தின் வாசலுக்கும்[a][b] கொண்டு செல்ல வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: நகர வாசல் என்பது உள்ளூர் மூப்பர்கள் சட்ட வழக்குகளை விசாரித்த பொது இடமாக இருந்தது.
    reason: cultural_note
  - marker: b
    text: அல்லது, “அவனுடைய இடத்தின் வாசலுக்கு.” எபிரெயத்தில், “அவனுடைய இடத்தின் வாசல்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְתָפְשׂוּ בוֹ
  choice: அவனைப் பிடித்து
  rationale: תפשׂ என்பதுடன் ב வருவது ஒருவரை உடல்ரீதியாக உறுதியாகப் பற்றிப் பிடிப்பதைக் குறிக்கிறது. “அவனைப் பிடித்து” என்பது அதன் வலிமையை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: אָבִיו וְאִמּוֹ
  choice: அவனுடைய தகப்பனும் தாயும்
  rationale: எபிரெயம் தந்தையையும் தாயையும் தனித்தனியாகக் குறிப்பிடுகிறது; தமிழ் இணைப்பும்மை இருவரும் சேர்ந்து செயல்படுவதைத் தெளிவாகக் காட்டுகிறது.
- source_word: וְהוֹצִיאוּ אֹתוֹ
  choice: அவனைக் கொண்டுவர வேண்டும்
  rationale: יצא என்பதன் ஹிஃபில் வடிவம் ஒருவரை வெளியே கொண்டுவருதல் அல்லது அழைத்துவருதல் என்ற பொருள் தருகிறது. வீட்டுச் சூழலிலிருந்து பொது நீதிமன்ற இடத்திற்கான நகர்வை இச்சொற்றொடர் இயல்பாகத் தெரிவிக்கிறது.
- source_word: אֶל זִקְנֵי עִירוֹ
  choice: அவனுடைய நகரத்தின் மூப்பர்களிடம்
  rationale: זקני העיר என்பது உள்ளூர் சமூகத் தலைவர்களாகவும் நீதித் தீர்ப்பு வழங்குவோராகவும் இருந்த மூப்பர்களைக் குறிக்கும் வழக்கமான சட்டச் சொற்றொடர்.
- source_word: וְאֶל שַׁעַר מְקֹמוֹ
  choice: அவன் வாழும் ஊரின் வாசலிடம்
  rationale: மொழிவழியாக “அவனுடைய இடத்தின் வாசல்” என்றாலும், מקום இங்கு அவன் சேர்ந்துள்ள உள்ளூர் குடியிருப்பைக் குறிக்கிறது. “அவன் வாழும் ஊர்” என்பது பொருளைத் தெளிவாகவும் இயல்பாகவும் தருகிறது; அடிப்படைச் சொல்லாக்கம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
