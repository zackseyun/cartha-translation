revisions:
- from: அப்போது அவனுடைய தகப்பனும் தாயும் அவனைப் பிடித்து, அவனுடைய நகரத்தின் மூப்பர்களிடமும் அவன் வாழும் ஊரின் வாசலிடமும்[a][b] அவனைக் கொண்டுவர வேண்டும்.
  to: அப்போது அவனுடைய தந்தையும் தாயும் அவனைப் பிடித்துக்கொண்டு, அவனை வெளியே அழைத்துக்கொண்டு சென்று அவனுடைய நகரத்து மூப்பர்களிடமும் அவன் வசிக்கும் இடத்தின் வாசலுக்கும்[a][b] கொண்டு செல்ல வேண்டும்.
  rationale: The revision explicitly expresses the Hebrew causative ‘bring out,’ improves idiomatic Tamil destination marking, and uses current standard Tamil while retaining the legal register. It preserves the Hebrew distinction between ‘his city’ and the more general ‘his place’; the latter remains visible in the text and is clarified in the footnote.
