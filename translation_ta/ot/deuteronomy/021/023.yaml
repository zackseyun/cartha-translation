  source_fidelity: 'மையப் பொருள் நன்றாகப் பாதுகாக்கப்பட்டுள்ளது: இரவெல்லாம் உடலை மரத்தில் விடக்கூடாது, அதே நாளில் அடக்கம் செய்ய வேண்டும், தொங்கவிடப்பட்டவனைச் சார்ந்த ‘கடவுளின் சாபம்’ என்ற சுருக்கமான/விவாதத்துக்குரிய சொற்றொடர், நிலத்தைத் தீட்டுப்படுத்தக் கூடாது என்பவை அனைத்தும் இடம்பெறுகின்றன. ஆயினும் எபிரெயத்தின் ஒருமை இரண்டாம் நபர் தொடர்ச்சியைத் தமிழிலும் ஒருமையாக வைத்தல் சிறந்தது; நַחֲלָהக்கு ‘மரபுரிமையாக’ என்பது ‘உரிமைச்சொத்தாக’ என்பதைக் காட்டிலும் துல்லியமானது.'
  naturalness: ‘அவனை அன்றே கண்டிப்பாக அடக்கம் செய்ய வேண்டும்’ என்பது வலியுறுத்தலையும் கால வரம்பையும் தெளிவாகவும் நவீனத் தமிழில் இயல்பாகவும் சொல்கிறது. அடிக்குறிப்பில் ‘இழுக்கு’ என்பதற்குப் பதில் முறையான நடையில் ‘அவமதிப்பு’ பயன்படுத்தப்பட்டுள்ளது.
