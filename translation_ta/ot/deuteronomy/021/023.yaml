base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/021/023.yaml
  text: His corpse shall not remain all night on the tree[a], but you shall surely bury him that same day, for a hanged man is under God's curse; and you shall not defile your land that Yahweh your God is giving you as an inheritance.
translation:
  language: ta
  text: அவனுடைய சடலம் மரத்தின்மேல் இரவு முழுவதும் இருக்கக் கூடாது. அவனை அன்றே கண்டிப்பாக அடக்கம் செய்ய வேண்டும்; ஏனெனில் தொங்கவிடப்பட்டவன் கடவுளின் சாபத்துக்கு உட்பட்டவன்[a]. உன் கடவுளாகிய யாவே உனக்கு மரபுரிமையாகக் கொடுக்கும் உன் நிலத்தை நீ தீட்டுப்படுத்தக் கூடாது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தொங்கவிடப்பட்டவன் கடவுளால் சபிக்கப்பட்டவன்”; மற்றொரு பொருள், “தொங்கவிடுதல் கடவுளுக்கு அவமதிப்பாகும்.” எபிரெயச் சொற்றொடர் சுருக்கமாக இருப்பதால், அதை ஒன்றுக்கு மேற்பட்ட விதங்களில் புரிந்துகொள்ள முடியும்.
    reason: alternative_reading
lexical_decisions:
- source_word: תָלִין
  choice: இரவு முழுவதும் இருக்கக் கூடாது
  rationale: לון என்ற வினையின் இரவு தங்குதல் அல்லது இரவு முழுவதும் அப்படியே இருத்தல் என்ற காலப் பொருளை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: נִבְלָתוֹ
  choice: அவனுடைய சடலம்
  rationale: நெவேலா என்பது உயிரற்ற உடலைக் குறிக்கிறது; ‘சடலம்’ என்பது ‘உடல்’ என்பதைவிட இங்கு துல்லியமானது.
- source_word: עַל הָעֵץ
  choice: மரத்தின்மேல்
  rationale: עֵץ என்பதன் முதன்மைப் பொருளான ‘மரம்’ என்பதையும், மரத்தின்மேல் உடலைத் தொங்கவிடும் சூழலையும் நேரடியாகப் பாதுகாக்கிறது.
- source_word: קָבוֹר תִּקְבְּרֶנּוּ
  choice: அவனை அடக்கம் செய்தே ஆக வேண்டும்
  rationale: வினையெச்சப் பெயர்ச்சொல்லுடன் வரும் வினை வடிவத்தின் வலியுறுத்தலை, இயல்பான தமிழில் கட்டாயத்தை வலியுறுத்தும் ‘செய்தே ஆக வேண்டும்’ வெளிப்படுத்துகிறது.
- source_word: בַּיּוֹם הַהוּא
  choice: அன்றே
  rationale: அதே நாளில், இரவுக்கு முன் அடக்கம் செய்ய வேண்டும் என்ற அவசரமான கால வரம்பைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: קִלְלַת אֱלֹהִים
  choice: கடவுளின் சாபத்துக்கு
  rationale: சுருக்கமான எபிரெய இணைப்பை ‘கடவுளின் சாபம்’ என்று வைத்துக்கொண்டு, தொங்கவிடப்பட்டவன் அந்தச் சாபத்தின்கீழ் இருக்கிறான் என்ற முதன்மை வாசிப்பைத் தருகிறது; பிற சாத்தியங்கள் அடிக்குறிப்பில் பாதுகாக்கப்படுகின்றன.
- source_word: תָלוּי
  choice: தொங்கவிடப்பட்டவன்
  rationale: செயப்பாட்டு வினையெச்சத்தின் ‘தொங்கவிடப்பட்டவர்’ என்ற பொருளையும், இங்கு குறிப்பிடப்படும் ஒருமை ஆண் நபரையும் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: תְטַמֵּא
  choice: தீட்டுப்படுத்த
  rationale: טמא என்பதிலுள்ள சடங்குசார் அசுத்தம் மற்றும் ஒழுக்க மாசு ஆகிய இரு நிழற்பொருள்களையும் ‘தீட்டுப்படுத்து’ பாதுகாக்கிறது.
- source_word: אַדְמָתְךָ
  choice: உங்கள் நிலத்தை
  rationale: உடன்படிக்கைச் சூழலில் வழங்கப்படும் தேசத்தைக் குறிக்கும் சொல்லாக ‘நிலம்’ இயல்பாக உள்ளது; உரை மோசே மக்களிடம் பேசுவதால் மரியாதைப் பன்மை பயன்படுத்தப்பட்டுள்ளது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைப் பெயரான நான்கு எழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் ஒலிபெயர்க்கிறது.
- source_word: נַחֲלָה
  choice: உரிமைச்சொத்தாக
  rationale: வழிவழியாகப் பெறப்படும் உடைமை அல்லது பங்காக வழங்கப்படும் நிலம் என்ற உடன்படிக்கைப் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: כִּי קִלְלַת אֱלֹהִים תָּלוּי என்பதன் பொருள்
  choice: தொங்கவிடப்பட்டவன் கடவுளின் சாபத்துக்கு உட்பட்டவன்
  alternative: தொங்கவிடப்பட்டவன் கடவுளால் சபிக்கப்பட்டவன்; அல்லது தொங்கவிடுதல் கடவுளுக்கு இழுக்காகும்
  rationale: எபிரெய சொற்றொடர் மிகவும் சுருக்கமானது; இலக்கண உறவு ஒன்றுக்கு மேற்பட்ட விதத்தில் புரிந்துகொள்ளப்படலாம். உடல் வெளியில் விடப்படுவதால் நிலம் தீட்டுப்படாதபடி உடனே அடக்கம் செய்ய வேண்டும் என்ற சட்டச் சூழலுடன் முதன்மை வாசிப்பு நன்றாகப் பொருந்துகிறது; ஆனாலும் மற்ற வாசிப்புகளை அடிக்குறிப்பு வெளிப்படையாகப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான சட்ட மொழிநடை பயன்படுத்தப்பட்டுள்ளது. ஒருமை எபிரெய இரண்டாம் நபரைத் தமிழின் மரியாதை/கூட்டுப் பயன்பாட்டுக்கு ஏற்றவாறு ‘நீங்கள்’ என வழங்கியுள்ளது; கட்டளையின் வலிமை ‘செய்தே ஆக வேண்டும்’ மற்றும் ‘கூடாது’ வழியாகப் பாதுகாக்கப்பட்டுள்ளது.
