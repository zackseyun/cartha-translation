  text: וְ/אַתָּ֗ה תְּבַעֵ֛ר הַ/דָּ֥ם הַ/נָּקִ֖י מִ/קִּרְבֶּ֑/ךָ כִּֽי תַעֲשֶׂ֥ה הַ/יָּשָׁ֖ר בְּ/עֵינֵ֥י יְהוָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/021/009.yaml
  text: So you shall purge the innocent blood from your midst[a], because you shall do what is right in the eyes of Yahweh.
translation:
  language: ta
  text: ஆகவே, அப்பாவியின் இரத்தத்தை உன் நடுவிலிருந்து அகற்றுவாய்[a]; ஏனெனில், யாவேவின் பார்வையில் சரியானதை நீ செய்வாய்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “குற்றமற்ற இரத்தத்தை உன் நடுவிலிருந்து அகற்றுவாய்.” “குற்றமற்ற இரத்தம்” என்ற எபிரெய மரபுத்தொடர், பரிகாரம் செய்யப்படாத இரத்தச்சிந்துதலுக்காகச் சமூகத்தின் மீது இருக்கும் பொறுப்பையும் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַתָּה
  choice: ஆகவே, ... நீ
  rationale: இணைப்புச்சொல்லும் தனிப்பட்ட முன்னிலைப்பெயரும் சேர்ந்து வலியுறுத்தப்பட்ட முடிவுரையைத் தருகின்றன; ‘ஆகவே’ என்பது இங்கு இயல்பான தமிழில் அந்த உரையோட்டத்தை வெளிப்படுத்துகிறது.
- source_word: תְּבַעֵר
  choice: அகற்றுவாய்
  rationale: உபாகமத்தின் சட்டச் சூழலில் பியேல் வடிவம் தீமை அல்லது இரத்தப்பழியைச் சமூகத்தின் நடுவிலிருந்து நீக்குவதைக் குறிக்கிறது; தமிழில் ‘அகற்று’ தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: הַ/דָּם הַ/נָּקִי
  choice: குற்றமற்றவரின் இரத்தப்பழி
  rationale: சொல்லடிப்படையில் ‘குற்றமற்ற இரத்தம்’; இச்சூழலில் தீர்க்கப்படாத கொலையால் சமூகத்தின் மீது நிற்கும் பொறுப்பையும் குற்றப்பழியையும் குறிக்கிறது. ‘குற்றமற்றவரின் இரத்தப்பழி’ சட்ட-ஒழுக்கப் பொருளைத் தெளிவாக்குகிறது; நேரடியான வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: מִ/קִּרְבֶּךָ
  choice: உன் நடுவிலிருந்து
  rationale: இரண்டாம் நபர் ஒருமை முகவரியையும் உடன்படிக்கைச் சமூகத்தின் மத்தியிலிருந்து நீக்குதல் என்ற கருத்தையும் பாதுகாக்கிறது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய கட்டளைக்கான காரணம் அல்லது அடிப்படையை அறிமுகப்படுத்தும் காரணப் பொருளைப் பாதுகாக்கிறது.
- source_word: תַעֲשֶׂה
  choice: நீ செய்வாய்
  rationale: இம்பெர்ஃபெக்ட் வடிவத்தின் சட்ட அறிவுறுத்தல் சார்ந்த எதிர்கால/கடமைத் தொனியைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: הַ/יָּשָׁר
  choice: நேர்மையானதை
  rationale: பெயர்ச்சொல்லாகச் செயல்படும் பெயரடை; ‘நேர்மையானதை’ என்பது ஒழுக்க ரீதியில் சரியானதை இயல்பாகக் குறிக்கிறது.
- source_word: בְּ/עֵינֵי יְהוָה
  choice: யாவேவின் பார்வையில்
  rationale: தெய்வீக மதிப்பீட்டைக் குறிக்கும் எபிரெய உருவகத்தை இயல்பான நவீன தமிழில் பாதுகாக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலத்தில் உடன்படிக்கைப் பெயரான நான்கெழுத்து இறைப் பெயர் நேரடியாக உள்ளது. அதை பொதுப்பட்டப் பெயராக மாற்றாமல், வழக்கமான தமிழெழுத்துப் பெயர்ப்பான ‘யாவே’ என வழங்குகிறது.
- issue: הַדָּם הַנָּקִי என்பதன் சட்ட-இறையியல் நுட்பம்
  choice: குற்றமற்றவரின் இரத்தப்பழி
  alternative: குற்றமற்ற இரத்தம்
  rationale: இப்பகுதியின் தீர்க்கப்படாத கொலைச் சூழலில் இது சிந்தப்பட்ட இரத்தத்தை மட்டுமல்லாமல், அதனால் சமூகத்தின் மீது நிற்கக்கூடிய பொறுப்பையும் குறிக்கிறது. இருப்பினும் சொல்லடிப்படையான மாற்று அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன தரத் தமிழில், சட்ட அறிவுறுத்தலுக்கேற்ற கண்ணியமான தொனி பயன்படுத்தப்பட்டுள்ளது. இரண்டாம் நபர் ஒருமை ‘உன்/நீ’ பாதுகாக்கப்பட்டுள்ளது; யாவே என்ற இறைப் பெயர் ஒலிபெயர்க்கப்பட்டுள்ளது.
