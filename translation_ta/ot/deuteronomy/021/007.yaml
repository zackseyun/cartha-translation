base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/021/007.yaml
  text: Then they shall answer and say[a], ‘Our hands did not shed this blood[b], and our eyes did not see it.’
translation:
  language: ta
  text: 'அப்போது அவர்கள் மறுமொழியாகச் சொல்வார்கள்: “எங்கள் கைகள் இந்த இரத்தத்தைச் சிந்தவில்லை[a]; எங்கள் கண்கள் அதைக் காணவில்லை[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “இந்த இரத்தம்” என்பது எபிரெய மூலத்தின் நேரடிச் சொல்லாட்சி. கொலைக்குத் தாங்கள் பொறுப்பல்ல என்று மறுக்கும் சட்டவழக்குச் சொல் இது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அதற்கு நேரில் சாட்சியாக இருக்கவில்லை.” “எங்கள் கண்கள் காணவில்லை” என்ற எபிரெயச் சொல்லாட்சி, சம்பவத்தை நேரில் கண்ட அறிவு தங்களுக்கு இல்லை என்று மறுக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָנוּ וְאָמְרוּ
  choice: அப்போது அவர்கள் மறுமொழியாகச் சொல்வார்கள்
  rationale: ענה மற்றும் אמר இணைந்து, சட்டச் சடங்கில் பொதுவாக அளிக்கப்படும் முறையான வாய்மொழிப் பதிலைக் குறிக்கின்றன. தொடக்க வாவ் காட்டும் நிகழ்வரிசையை ‘அப்போது’ வெளிப்படுத்துகிறது; இரண்டு எபிரெய வினைகளையும் தமிழில் இயல்பான ஒரே சொற்றொடராக வழங்குகிறது.
- source_word: יָדֵינוּ
  choice: எங்கள் கைகள்
  rationale: நேரடிச் செயலுக்கும் பொறுப்புக்கும் ஆகுபெயராக வரும் ‘கைகள்’ என்ற எபிரெய உடல்-உறுப்பு சொல்லாட்சியை அப்படியே தக்கவைக்கிறது.
- source_word: לֹא שָׁפְכָה אֶת־הַדָּם הַזֶּה
  choice: இந்த இரத்தத்தைச் சிந்தவில்லை
  rationale: דם உடன் வரும் שפך என்பது இரத்தம் சிந்துதல், அதாவது கொலை செய்தல் என்ற நிலையான சொல்லாட்சி. ‘இந்த இரத்தம்’ என்ற மூலத்தின் தெளிவான, சட்டரீதியான உருவகத்தை ‘இந்தக் கொலை’ என விளக்கிவிடாமல் பாதுகாக்கிறது.
- source_word: וְעֵינֵינוּ לֹא רָאוּ
  choice: எங்கள் கண்கள் அதைக் காணவில்லை
  rationale: நேரில் கண்ட அறிவை மறுக்கும் ‘எங்கள் கண்கள் காணவில்லை’ என்ற மூலத்தின் உடல்-உறுப்பு சொல்லாட்சியைத் தக்கவைக்கிறது. தமிழ் வாக்கியத் தெளிவுக்காக முன் குறிப்பிடப்பட்ட சம்பவத்தைக் குறிக்கும் ‘அதை’ சேர்க்கப்பட்டுள்ளது.
