translation_notes:
  register: நவீன நிலையான தமிழில், சட்டச் சடங்கிற்குரிய கண்ணியமான தொனி பயன்படுத்தப்பட்டுள்ளது. ‘கைகள்’ மற்றும் ‘கண்கள்’ என்ற மூலத்தின் தெளிவான உடல்-உறுப்பு மொழி பாதுகாக்கப்பட்டுள்ளது. ஆங்கில ஆலோசனை உரையில் அடிக்குறிப்புக் குறிகள் அவை விளக்கும் சொற்றொடர்களுடன் பொருந்தாத இடங்களில் இருந்ததால், [a] ‘இந்த இரத்தம்’ என்பதற்குப் பின்னும் [b] ‘காணவில்லை’ என்பதற்குப் பின்னும் பொருத்தப்பட்டுள்ளன.
