source:
  edition: WLC
  text: וְ/כִֽי יִהְיֶ֣ה בְ/אִ֗ישׁ חֵ֛טְא מִשְׁפַּט מָ֖וֶת וְ/הוּמָ֑ת וְ/תָלִ֥יתָ אֹת֖/וֹ עַל עֵֽץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/021/022.yaml
  text: And if in a man there is a sin deserving death[a], and he is put to death, and you hang him on a tree[b],
translation:
  language: ta
  text: ஒரு மனிதனிடம் மரணத்திற்குரிய பாவம் இருந்து, அவன் கொல்லப்பட்ட பின்பு, நீ அவனை ஒரு மரத்தில்[a] தொங்கவிட்டால்,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஒரு மரக்கம்பத்தில்.” எபிரெயத்தில் சொல்லுக்கு சொல், “ஒரு மரத்தில்” என்று உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כִי
  choice: ஒரு மனிதனிடம் ... இருந்து
  rationale: எபிரெயச் சட்ட வழக்கின் நிபந்தனைத் தொடக்கத்தைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது; וְ என்பதைக் கட்டாயமாகத் தனியே ‘மேலும்’ என்று மொழிபெயர்க்காமல் தொடர்ச்சியை வாக்கிய அமைப்பில் காக்கிறது.
- source_word: יִהְיֶה בְ/אִישׁ
  choice: ஒரு மனிதனிடம் ... இருந்து
  rationale: ‘ஒரு மனிதனில் இருக்குமானால்’ என்ற செயற்கையான சொல்லாக்கத்தைத் தவிர்த்து, இருப்பு/நிலைப் பொருளையும் ஆண்பால் ஒருமைச் சட்டப் பொருளையும் காக்கிறது.
- source_word: חֵטְא
  choice: பாவம்
  rationale: இச்சொல்லின் ஒழுக்க மற்றும் சட்ட பரிமாணங்களை இரண்டையும் காக்கிறது; ‘குற்றம்’ என்று மட்டும் குறுக்கவில்லை.
- source_word: מִשְׁפַּט מָוֶת
  choice: மரணத்திற்குரிய
  rationale: சொல்லுக்கு சொல் அமைப்பு ‘மரணத் தீர்ப்பு/நியாயம்’ எனும் தெளிவின்மையைக் கொண்டுள்ளது. முதன்மை உரையில் மரணத்துக்குத் தகுதியான குற்றம் என்ற சட்டப் பொருளை இயல்பாகத் தருகிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் காக்கப்படுகிறது.
- source_word: וְ/הוּמָת
  choice: அவன் கொல்லப்பட்டு
  rationale: מות என்பதன் ஹொஃபால் வடிவிலுள்ள காரணப்பாட்டு செயல்பாட்டு பொருளைத் தருகிறது. சூழலில் நீதித்துறை மரணதண்டனை குறிக்கப்பட்டாலும், ‘மரணதண்டனை நிறைவேற்றப்பட்டு’ என மூலத்தைவிட விரிவாக்கவில்லை.
- source_word: וְ/תָלִיתָ אֹת/וֹ
  choice: அவனை ... தொங்கவிட்டால்
  rationale: இரண்டாம் நபர் ஒருமை வினையைத் தமிழ்ச் சட்ட நிபந்தனை நடையில் இயல்பாக வெளிப்படுத்துகிறது; பொருள் சுட்டுப்பெயரையும் தெளிவாக வைத்துள்ளது.
- source_word: עַל עֵץ
  choice: ஒரு மரத்தில்
  rationale: עֵץ என்பதன் அடிப்படைப் பொருளான ‘மரம்’ என்பதைக் காக்கிறது; ‘கழுமரம்’ போன்ற குறிப்பிட்ட கருவியை ஆதாரமின்றி இறக்குமதி செய்யவில்லை.
theological_decisions:
- issue: சட்ட வழக்கின் பாலினம் குறித்த பொருள்
  choice: ஒரு மனிதன்
  alternative: ஒருவர் / ஒரு நபர்
  rationale: אִישׁ என்பது ஆண்பால் ஒருமை. மூலத்தில் உள்ள பாலினக் குறிப்பை நீக்காமல் நவீனத் தமிழில் இயல்பாகக் காக்கிறது.
- issue: עַל עֵץ என்பதன் மொழிபெயர்ப்பு
  choice: ஒரு மரத்தில்
  alternative: ஒரு கழுமரத்தில் / ஒரு மரக்கம்பத்தில்
  rationale: மூலத்தின் பொதுவான ‘மரம்/மரப்பொருள்’ என்ற சொல்லைத் தக்கவைத்து, மரணக் கருவியின் வடிவத்தைத் தேவையின்றி நிர்ணயிக்கவில்லை; வேதாகமத்தின் பிற்கால இடைஉரைத் தொடர்பும் பாதுகாக்கப்படுகிறது.
- issue: מִשְׁפַּט מָוֶת என்பதன் உறவு
  choice: மரணத்திற்குரிய பாவம்
  alternative: மரணத் தீர்ப்புக்குரிய பாவம் / மரணதண்டனை விதிக்கப்பட்ட பாவம்
  rationale: இச்சொற்றொடர் குற்றத்தின் தகுதியையோ அதன்மேல் வந்த தீர்ப்பையோ சுட்டக்கூடும். முதன்மை உரை இயல்பான சட்டப் பொருளைத் தருகிறது; தீர்ப்பு சார்ந்த மாற்று அடிக்குறிப்பில் வெளிப்படையாக வைக்கப்படுகிறது.
translation_notes:
  register: நவீன, கண்ணியமான சட்ட வழக்கு நடை பயன்படுத்தப்பட்டுள்ளது. வசனம் அடுத்த வசனத்துடன் தொடர்வதால் இறுதியில் முற்றுப்புள்ளிக்குப் பதிலாக காற்புள்ளி வைக்கப்பட்டுள்ளது. ‘கொல்லப்பட்டு’ என்பது மூல வினையின் அகலத்தைப் பாதுகாக்கிறது; நீதித்துறைச் சூழல் வாக்கியத்திலேயே தெளிவாகிறது.
