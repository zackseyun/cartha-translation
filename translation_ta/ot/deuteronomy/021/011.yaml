  text: וְ/רָאִיתָ֙ בַּ/שִּׁבְיָ֔ה אֵ֖שֶׁת יְפַת תֹּ֑אַר וְ/חָשַׁקְתָּ֣ בָ֔/הּ וְ/לָקַחְתָּ֥ לְ/ךָ֖ לְ/אִשָּֽׁה־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/021/011.yaml
  text: and you see among the captives a woman beautiful in form[a], and you desire her and take her for yourself as a wife[b],
translation:
  language: ta
  text: சிறைபிடிக்கப்பட்டவர்களிடையே அழகிய தோற்றமுள்ள ஒரு பெண்ணை[a] நீ கண்டு, அவளை விரும்பி, அவளை உனக்கு மனைவியாக எடுத்துக்கொண்டால்[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அழகிய உருவமுள்ள ஒரு பெண்ணை.’
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில், ‘உனக்காக அவளை மனைவியாக எடுத்துக்கொள்’; இது அவளை மணந்துகொள்வதைக் குறிக்கும் மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָאִיתָ בַּשִּׁבְיָה
  choice: சிறைபிடிக்கப்பட்டவர்களிடையே ... நீ கண்டு
  rationale: בַּשִּׁבְיָה என்பது போரில் சிறைபிடிக்கப்பட்டவர்களின் கூட்டத்தைக் குறிக்கிறது. முந்தைய நிபந்தனைச் சட்டவாக்கியத்தைத் தொடரும் וְרָאִיתָ தமிழில் இயல்பாக ‘நீ கண்டு’ என்று தரப்படுகிறது.
- source_word: אֵשֶׁת יְפַת תֹּאַר
  choice: அழகிய தோற்றமுள்ள ஒரு பெண்ணை
  rationale: தோற்றம் அல்லது உருவழகைக் குறிக்கும் יְפַת תֹּאַר என்பதன் உடல்சார்ந்த வெளிப்புறப் பொருளை இயல்பான நவீன தமிழில் தெளிவாகத் தருகிறது.
- source_word: וְחָשַׁקְתָּ בָהּ
  choice: அவளை விரும்பி
  rationale: חָשַׁקְתָּ வலுவான விருப்பம் அல்லது பற்றுதலைக் குறிக்கிறது; ‘விரும்பி’ என்பது அதை மென்மைப்படுத்தாமலும் தேவையற்ற விளக்கம் சேர்க்காமலும் தருகிறது.
- source_word: וְלָקַחְתָּ לְךָ לְאִשָּׁה
  choice: உனக்கு மனைவியாக அவளை எடுத்துக்கொள்ள விரும்பினால்
  rationale: எபிரெயச் சொற்றொடர் சொற்படியாக ‘உனக்காக மனைவியாக எடுத்துக்கொள்’ என்பதாகவும் திருமணத்தைக் குறிக்கும் மரபுத்தொடராகவும் உள்ளது. சட்டவாக்கியத்தின் நிபந்தனை அமைப்பைத் தமிழில் நிறைவு செய்ய ‘விரும்பினால்’ பயன்படுத்தப்பட்டுள்ளது; திருமணப் பொருள் அடிக்குறிப்பில் தெளிவுபடுத்தப்படுகிறது.
theological_decisions:
- issue: ஒழுக்க ரீதியாகக் கடினமான போர்க்காலச் சட்டவாக்கியத்தை மென்மைப்படுத்தாமலும் வசனத்தில் இல்லாத மதிப்பீட்டைச் சேர்க்காமலும் மொழிபெயர்த்தல்
  choice: ஆணின் விருப்பத்தையும் பெண்ணை மனைவியாக எடுத்துக்கொள்ளும் செயலையும் நேரடியாகத் தக்கவைத்தல்
  alternative: ‘அவளை மனைவியாகத் தேர்ந்தெடுத்தால்’ என்று மென்மைப்படுத்துதல் அல்லது கட்டாயம்/ஒப்புதல் குறித்த மதிப்பீட்டை வசனத்துக்குள் சேர்த்தல்
  rationale: எபிரெய உரை இந்தச் சூழலை நேரடியாக விவரிக்கிறது; அது வெளிப்படையாகக் கூறாத அங்கீகாரத்தையோ கண்டனத்தையோ மொழிபெயர்ப்பு சேர்க்கக் கூடாது. இவ்வாறு உரையின் ஒழுக்கத் த tension இயல்பாகத் தக்கவைக்கப்படுகிறது.
translation_notes:
  register: நவீன தரத் தமிழ்; பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான சட்டநடை. ‘சிறைபிடிக்கப்பட்டவர்களிடையே’ என்பது பாலினத்தை முன்கூட்டியே வரையறுக்காமல் போர்ச் சிறைக் கூட்டத்தைக் குறிக்கிறது. எல்லா அடிக்குறிப்பு குறியீடுகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
