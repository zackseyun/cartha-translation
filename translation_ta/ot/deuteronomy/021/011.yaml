  - marker: b
    text: எபிரெயத்தில், ‘உனக்காக அவளை மனைவியாக எடுத்துக்கொள்’; இது அவளை மணந்துகொள்வதைக் குறிக்கும் மரபுத்தொடர்.
    reason: lexical_alternative
  revision_rationale: The revision removes the added second expression of desire while preserving the verse’s legal conditional flow, direct description, and marital idiom. Footnote b is aligned with the corrected wording and explains the idiomatic marital sense without importing evaluation.
