source:
  edition: WLC
  text: כַּפֵּר֩ לְ/עַמְּ/ךָ֨ יִשְׂרָאֵ֤ל אֲשֶׁר פָּדִ֨יתָ֙ יְהוָ֔ה וְ/אַל תִּתֵּן֙ דָּ֣ם נָקִ֔י בְּ/קֶ֖רֶב עַמְּ/ךָ֣ יִשְׂרָאֵ֑ל וְ/נִכַּפֵּ֥ר לָ/הֶ֖ם הַ/דָּֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/021/008.yaml
  text: Make atonement for your people Israel[a], whom you redeemed, O Yahweh, and do not let innocent blood remain among your people Israel. Then the bloodguilt will be atoned for them.
translation:
  language: ta
  text: “யாவே, நீர் மீட்ட உமது மக்களாகிய இஸ்ரவேலருக்காகப் பரிகாரம் செய்யும்; குற்றமற்றவரின் இரத்தம் சிந்தப்பட்டதனால் உண்டான பழி உமது மக்களாகிய இஸ்ரவேலரிடையே நிலைத்திருக்க விடாதேயும். அப்போது அந்த இரத்தப்பழி அவர்களுக்காகப் பரிகரிக்கப்படும்.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'சொல்லுக்குச் சொல்: “அந்த இரத்தம் அவர்களுக்காகப் பரிகரிக்கப்படும்.” இங்கு “இரத்தம்” என்பது இரத்தஞ்சிந்தியதால் ஏற்படும் சட்டவியல் பழியைக் குறிக்கிறது.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּפֵּר
  choice: பரிகாரம் செய்யும்
  rationale: כפר என்பதன் பலிசார் மற்றும் சட்டவியல் பொருளைத் தக்கவைத்தபடி, வேண்டுதலுக்குரிய மரியாதையான நவீனத் தமிழில் இயல்பாக அமைகிறது.
- source_word: לְעַמְּךָ יִשְׂרָאֵל
  choice: உமது மக்களாகிய இஸ்ரவேலருக்காக
  rationale: ל பயனடைவோரைக் குறிக்கிறது; ‘உமது மக்களாகிய இஸ்ரவேலர்’ உடன்படிக்கை உறவையும் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: אֲשֶׁר פָּדִיתָ
  choice: நீர் மீட்டுக்கொண்ட
  rationale: פדה அடிமைத்தனம் அல்லது கட்டுப்பாட்டிலிருந்து விலைகொடுத்து மீட்பதைக் குறிக்கலாம்; ‘மீட்டுக்கொண்ட’ என்பது இங்கு இயல்பாகவும் உடன்படிக்கைச் சூழலுக்கு ஏற்றதாகவும் உள்ளது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் அதன் ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: וְאַל תִּתֵּן
  choice: நிலைத்திருக்க விடாதேயும்
  rationale: נתן என்பதன் அடிப்படைப் பொருள் ‘கொடு/வை’ என்றாலும், இச்சூழலில் தீராத கொலைப்பழி சமூகத்தின்மேல் தொடர அனுமதிக்காதிருக்க வேண்டுதல் விடுக்கப்படுகிறது.
- source_word: דָּם נָקִי
  choice: குற்றமற்றவரின் இரத்தப்பழி
  rationale: இது குற்றமற்ற ஒருவர் கொல்லப்பட்டதால் உண்டாகும் சட்டவியல் பொறுப்பைக் குறிக்கும் எபிரெய மரபுத்தொடர்; தமிழில் ‘இரத்தப்பழி’ அந்தச் சூழலைத் தெளிவாக்குகிறது.
- source_word: בְּקֶרֶב עַמְּךָ יִשְׂרָאֵל
  choice: உமது மக்களாகிய இஸ்ரவேலரிடையே
  rationale: בקרב என்பதன் சமூகத்தின் நடுவிலான இருப்பை நவீனத் தமிழில் இயல்பாகக் காட்டுகிறது.
- source_word: וְנִכַּפֵּר לָהֶם הַדָּם
  choice: அப்போது அந்த இரத்தப்பழி அவர்களுக்காகப் பரிகரிக்கப்படும்
  rationale: נכפר என்பதன் செயல்பாட்டு/விளைவுநிலைப் பொருளைச் செயப்பாட்டு வடிவில் தக்கவைக்கிறது. הַדָּם என்பதைச் சூழலுக்கேற்ற சட்டவியல் பொருளில் ‘இரத்தப்பழி’ என வழங்குகிறது; ‘அப்போது’ இறுதிக் கூற்றின் விளைவுத் தொடர்பைக் காட்டுகிறது.
theological_decisions:
- issue: יהוה என்ற தெய்வீகப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூலத்தில் தனிப்பட்ட தெய்வீகப் பெயர் நேரடி அழைப்பில் வருகிறது; அதை ஒரு பட்டமாக மாற்றாமல் ஒலிபெயர்ப்பது மூலத்தின் வேறுபாட்டைப் பாதுகாக்கிறது.
- issue: இறுதிக் கூற்றிலுள்ள הַדָּם என்பதன் பொருள்
  choice: இரத்தப்பழி
  alternative: இரத்தம்
  rationale: தீர்க்கப்படாத கொலையால் சமூகத்தின்மேல் வரும் சட்டவியல் பொறுப்பே சூழலின் மையம். எனினும் எபிரெயம் நேரடியாக ‘இரத்தம்’ என்று கூறுவதை அடிக்குறிப்பு பாதுகாக்கிறது.
translation_notes:
  register: மரியாதையான நேரடி வேண்டுதலுக்காக ‘நீர்/உமது’ மற்றும் ‘செய்யும்/விடாதேயும்’ வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன. நடை நவீனமும் கண்ணியமுமாக உள்ளது; சட்டவியல்-பலிசார் கருத்தைத் தெளிவாக்கினாலும், மூலத்தின் நேரடி ‘இரத்தம்’ என்ற சொல்லாட்சி அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
