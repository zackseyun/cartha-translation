base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/021/017.yaml
  text: But he shall acknowledge the firstborn[a], the son of the unloved wife, by giving him a double portion of all that is found to belong to him, for he is the firstfruits of his vigor[c][b]; the right of the firstborn belongs to him.
translation:
  language: ta
  text: மாறாக, அன்புபெறாத மனைவியின்[a] மகனை முதற்பேறானவனாக அங்கீகரித்து, தனக்குச் சொந்தமான எல்லாவற்றிலும் அவனுக்கு இரட்டைப் பங்கு[b] கொடுக்க வேண்டும். ஏனெனில், அவன் தந்தையின் வலிமையின் முதற்பலன்[c]; முதற்பேற்றுரிமை அவனுக்கே உரியது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “வெறுக்கப்பட்ட மனைவி.” எபிரெயச் சொல்லை இன்னும் நேரடியாக இவ்வாறு மொழிபெயர்க்கலாம்; ஆனால் இங்கு அது அன்புபெற்ற மனைவிக்கு மாறாகக் குறைவாக நேசிக்கப்பட்ட அல்லது அன்புபெறாத மனைவியைக் குறிப்பதாக இருக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: சொல்லுக்கு சொல், “இரண்டின் வாய்”; இது இரு பங்குகள் அல்லது இரட்டைப் பங்கைக் குறிக்கும் எபிரெய மரபுத்தொடர்.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, “தந்தையின் வலிமையின் தொடக்கம்.” இந்த எபிரெயச் சொற்றொடர் தந்தையின் இனப்பெருக்க வலிமையின் முதல் வெளிப்பாடாக முதற்பேறான மகனைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַכִּיר
  choice: முதற்பேறானவன் என்று ஏற்றுக்கொண்டு
  rationale: இங்கு ஹிஃபில் வடிவம் உண்மையான முதற்பேறான மகனின் சட்டபூர்வ நிலையை அங்கீகரிப்பதைக் குறிக்கிறது; வெறுமனே அடையாளம் காண்பதைவிட இந்தச் சொற்றொடர் சட்டச் சூழலைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: הַבְּכֹר
  choice: முதற்பேறானவன்
  rationale: பிறப்புரிமையும் வாரிசுரிமையும் உடைய மகனைக் குறிக்கும் நிலையான குடும்பச் சட்டச் சொல்.
- source_word: בֶּן הַשְּׂנוּאָה
  choice: அன்புபெறாத மனைவியின் மகன்
  rationale: שְׂנוּאָה என்பதன் நேரடிப் பொருள் ‘வெறுக்கப்பட்டவள்’ என இருக்கலாம்; ஆனால் அன்புபெற்ற மனைவியுடன் செய்யப்படும் ஒப்பீட்டில், குறைவாக நேசிக்கப்பட்ட அல்லது அன்புபெறாத மனைவியைக் குறிப்பதே இயல்பானது.
- source_word: לָתֶת לוֹ פִּי שְׁנַיִם
  choice: அவனுக்கு இரு பங்குகள் கொடுக்க வேண்டும்
  rationale: ‘இரண்டின் வாய்’ என்ற எபிரெய மரபுத்தொடர் வாரிசுச் சொத்தில் மற்றொரு மகனுக்குக் கிடைக்கும் ஒரு பங்கிற்கு எதிராக இரு பங்குகளைக் குறிக்கிறது. ‘இரு பங்குகள்’ என்பது தமிழில் தெளிவான சட்டப் பொருளைத் தருகிறது.
- source_word: בְּכֹל אֲשֶׁר יִמָּצֵא לוֹ
  choice: தனக்குச் சொந்தமான எல்லாவற்றிலும்
  rationale: தந்தையின் உடைமையில் காணப்படும் அனைத்தையும், அதாவது அவரது சொத்துத் தொகுப்பை, இயல்பான தமிழில் குறிக்கிறது.
- source_word: רֵאשִׁית אֹנוֹ
  choice: தந்தையின் வலிமையின் முதற்பலன்
  rationale: தந்தையின் இனப்பெருக்க வலிமையின் முதல் வெளிப்பாடாக முதற்பேறான மகனைச் சித்தரிக்கும் உருவகத்தை ‘முதற்பலன்’ காக்கிறது; ‘தந்தையின்’ என்பது தமிழில் சுட்டுப்பெயர் குழப்பத்தைத் தவிர்க்கிறது.
- source_word: מִשְׁפַּט הַבְּכֹרָה
  choice: முதற்பேற்றுரிமை
  rationale: முதற்பேறான நிலைக்கு இணைந்த சட்டபூர்வ உரிமையைச் சுருக்கமாகவும் தெளிவாகவும் குறிக்கிறது.
- source_word: כִּי ... כִּי
  choice: மாறாக ... ஏனெனில்
  rationale: முதல் כִּי முந்தைய வசனத்திலுள்ள பாரபட்சச் செயலுக்கு எதிரான மாற்றத்தையும், இரண்டாவது כִּי சட்டத்திற்கான காரணத்தையும் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: சட்டச் சூழலில் שְׂנוּאָה என்ற திருமண உறவுச் சொல்லின் பொருள்
  choice: அன்புபெறாத மனைவி
  alternative: வெறுக்கப்பட்ட மனைவி; குறைவாக நேசிக்கப்பட்ட மனைவி
  rationale: இவ்வசனம் வாரிசுரிமைச் சட்டத்தைப் பற்றியது. ‘அன்புபெறாத’ என்பது அன்புபெற்ற மனைவியுடனான ஒப்பீட்டு உறவைத் தக்கவைத்தபடி, எபிரெயம் கட்டாயப்படுத்தாத அளவுக்கு கடுமையான பகைமை உணர்வை மொழிபெயர்ப்பில் புகுத்தாமல் இருக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், சட்டத் தன்மையைத் தக்கவைக்கும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘முதற்பேறானவன்,’ ‘இரு பங்குகள்,’ ‘முதற்பேற்றுரிமை’ ஆகியவை சாதாரண வாசகருக்குப் புரியும் வகையில் தேர்ந்தெடுக்கப்பட்டுள்ளன; எபிரெய உருவகம் ‘வலிமையின் முதற்பலன்’ எனப் பாதுகாக்கப்பட்டுள்ளது.
