base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/021/002.yaml
  text: then your elders and your judges shall go out and measure to the cities that are around the slain man[a].
translation:
  language: ta
  text: அப்போது உன் மூப்பர்களும் உன் நீதிபதிகளும் புறப்பட்டுச் சென்று, கொல்லப்பட்டவரைச் சுற்றியுள்ள நகரங்கள்வரை அளக்க வேண்டும்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது, இன்னும் முறையாக: “கொல்லப்பட்டவரைச் சுற்றியுள்ள நகரங்களை நோக்கி அளக்க வேண்டும்.”'
    reason: எபிரெயத்தில் அளவீட்டின் முடிவிடத்தைக் குறிக்கும் அֶל (“நோக்கி/வரை”) என்ற முன்னிடைச்சொல்லுக்கான முறையான சொற்பொருள் மாற்று.
lexical_decisions:
- source_word: וְיָצְאוּ
  choice: அப்போது ... புறப்பட்டுச் சென்று
  rationale: வாவ் + வினை வடிவம் சட்ட நடைமுறையின் அடுத்த கட்டத்தைத் தொடர்கிறது. ‘அப்போது’ அதன் தொடர் நடைமுறைப் பொருளையும், ‘புறப்பட்டுச் சென்று’ வெளியே செல்வதையும் இயல்பான தமிழில் காட்டுகிறது.
- source_word: זְקֵנֶיךָ
  choice: உன் மூப்பர்கள்
  rationale: இஸ்ரவேல் சமூகத்தை ஒருமையில் முன்னிலைப்படுத்தும் இரண்டாம் நபர் ஒருமை உடைமை விகுதியை ‘உன்’ என்று பாதுகாக்கிறது; ‘மூப்பர்கள்’ சமூகத் தலைவர்களைக் குறிக்கும் இயல்பான சொல்.
- source_word: וְשֹׁפְטֶיךָ
  choice: உன் நீதிபதிகள்
  rationale: நீதித்துறை அதிகாரம் செலுத்துவோரைக் குறிக்கும் நேரடியான, சூழலுக்கேற்ற மொழிபெயர்ப்பு.
- source_word: וּמָדְדוּ אֶל הֶעָרִים
  choice: நகரங்கள்வரை அளக்க வேண்டும்
  rationale: ‘அளத்தல்’ என்ற வினையையும் நகரங்கள் அளவீட்டின் முடிவிடங்களாக இருப்பதையும் பாதுகாக்கிறது. தமிழில் அளவீட்டின் தொடக்கத்தைத் தெளிவாக்க ‘கொல்லப்பட்டவர் கிடக்கும் இடத்திலிருந்து’ என சூழலால் உணரப்படும் தகவல் வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: אֲשֶׁר סְבִיבֹת
  choice: சுற்றிலுமுள்ள
  rationale: சடலம் கண்ட இடத்தைச் சுற்றியுள்ள அருகாமை நகரங்களைச் சுருக்கமாகவும் இயல்பாகவும் குறிக்கிறது.
- source_word: הֶחָלָל
  choice: கொல்லப்பட்டவர்
  rationale: חָלָל என்பது கொல்லப்பட்ட ஒருவரைக் குறிக்கிறது. ‘சடலம்’ என்பதைக் காட்டிலும் மூலத்தின் பொருளை நெருக்கமாகக் காக்கிறது; ‘கொலை செய்யப்பட்டவர்’ எனக் கூறி சட்டரீதியாக இன்னும் நிரூபிக்கப்படாத நோக்கம் அல்லது குற்றவகையை மிகைப்படுத்துவதையும் தவிர்க்கிறது.
