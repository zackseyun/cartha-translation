translation_notes:
  register: நவீன நிலையான தமிழில், சட்டமுறைச் சடங்கின் கண்ணியமான தொனியைப் பேணும் வகையில் மொழிபெயர்க்கப்பட்டது. ‘மூப்பர்கள்’, ‘கழுவ வேண்டும்’ ஆகியவை அதிகாரப்பூர்வச் சூழலை இயல்பாக வெளிப்படுத்துகின்றன; அரிதான ‘வாடி’ போன்ற கடன்சொல் தவிர்க்கப்பட்டது.
