language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וְ/כֹ֗ל זִקְנֵי֙ הָ/עִ֣יר הַ/הִ֔וא הַ/קְּרֹבִ֖ים אֶל הֶ/חָלָ֑ל יִרְחֲצוּ֙ אֶת יְדֵי/הֶ֔ם עַל הָ/עֶגְלָ֖ה הָ/עֲרוּפָ֥ה בַ/נָּֽחַל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/021/006.yaml
  text: And all the elders of that city nearest to the slain man shall wash their hands over the heifer whose neck was broken in the wadi[a][b].
translation:
  language: ta
  text: கொல்லப்பட்டவருக்கு[a] மிக அருகிலுள்ள அந்த நகரத்தின் மூப்பர்கள் அனைவரும், ஓடைப் பள்ளத்தாக்கில்[b] கழுத்து முறிக்கப்பட்ட அந்த இளம் பசுவின்மேல் தங்கள் கைகளைக் கழுவ வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘கொல்லப்பட்டவரின் உடலுக்கு’ என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் கொல்லப்பட்ட ஒருவரையோ, கொல்லப்பட்டவரின் உடலையோ குறிக்கக்கூடும்.
    reason: lexical_alternative
  - marker: b
    text: ‘பள்ளத்தாக்கில்’ அல்லது ‘ஓடைப் படுகையில்’ என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் நீரோட்டத்துடன் தொடர்புடைய பள்ளத்தாக்கையோ பருவகால ஓடைப் படுகையையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכֹל
  choice: அனைவரும்
  rationale: וְ தொடர்ச்சியைக் குறிக்கிறது; כֹל அந்தக் குழுவின் முழுமையையும் குறிக்கிறது. தமிழில் வாக்கிய ஓட்டத்துக்கேற்ப இணைப்பைத் தனியே மொழிபெயர்க்காமல், ‘அனைவரும்’ என்பதில் உள்ளடக்கப்பட்டுள்ளது.
- source_word: זִקְנֵי הָעִיר הַהִוא
  choice: அந்த நகரத்தின் மூப்பர்கள்
  rationale: זִקְנֵי என்பது நகரின் மூத்த குடிமக்களை மட்டும் அல்ல, அதன் சமூகத் தலைவர்களையும் குறிக்கிறது; மரியாதையும் சட்டச் சூழலும் காக்க ‘மூப்பர்கள்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: הַקְּרֹבִים אֶל הֶחָלָל
  choice: கொல்லப்பட்டவருக்கு மிக அருகிலுள்ள
  rationale: קְרֹבִים אֶל என்பது அருகாமையைக் குறிக்கிறது. חָלָל கொல்லப்பட்ட நபரையோ அவருடைய உடலையோ குறிக்கலாம்; முதன்மை உரையில் கொலைச் சூழலைத் தெளிவாக வைத்திருக்க ‘கொல்லப்பட்டவர்’ பயன்படுத்தப்பட்டது.
- source_word: יִרְחֲצוּ אֶת יְדֵיהֶם
  choice: தங்கள் கைகளைக் கழுவ வேண்டும்
  rationale: இங்குள்ள வினைச்சொல் சட்டமுறைச் செயலுக்கான கட்டளையைத் தெரிவிக்கிறது. நவீன தமிழில் அதன் கட்டாயத் தன்மையை இயல்பாகக் காட்ட ‘கழுவ வேண்டும்’ பயன்படுத்தப்பட்டது.
- source_word: עַל
  choice: மேல்
  rationale: சடங்கின்போது இளம் பசுவுக்கு மேலாகக் கைகளைக் கழுவும் நிலையை עַל குறிக்கிறது; ‘மேல்’ நேரடியான இயல்பான இணை.
- source_word: הָעֶגְלָה
  choice: அந்த இளம் பசு
  rationale: עֶגְלָה என்பது இளம் பெண் மாட்டைக் குறிக்கிறது. பொதுவான வாசகர்களுக்குப் புரியும் வகையில் ‘இளம் பசு’ பயன்படுத்தப்பட்டது.
- source_word: הָעֲרוּפָה
  choice: கழுத்து முறிக்கப்பட்ட
  rationale: ערף என்ற வேர்ச்சொல் இச்சடங்கில் வழக்கமான அறுப்பை அல்ல, கழுத்தை முறிப்பதைக் குறிக்கிறது; ‘தலை வெட்டப்பட்ட’ என்ற தேவையற்ற கருத்தைத் தவிர்க்கிறது.
- source_word: בַנָּחַל
  choice: ஓடைப் பள்ளத்தாக்கில்
  rationale: נַחַל நீரோட்டத்துடன் தொடர்புடைய பள்ளத்தாக்கு, பருவகால ஓடை அல்லது ஓடைப் படுகையைக் குறிக்கலாம். ‘ஓடைப் பள்ளத்தாக்கு’ நில அமைப்பையும் நீர்வழித் தொடர்பையும் ஒருங்கே காக்கிறது.
