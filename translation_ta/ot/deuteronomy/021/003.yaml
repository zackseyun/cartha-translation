translation_notes:
  register: நவீன நிலையான தமிழில், சட்டநடைத் தெளிவும் கண்ணியமும் பேணப்பட்டுள்ளன. நீளமான எபிரேய வாக்கிய அமைப்பு தமிழின் இயல்பான சொல்வரிசைக்கு மாற்றப்பட்டாலும், அருகிலுள்ள நகரம், அதன் மூப்பர்கள், விலங்கின் பாலினம் மற்றும் முன்பு உழைப்பில் பயன்படுத்தப்படாத நிலை ஆகிய அனைத்தும் காக்கப்பட்டுள்ளன.
