base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/021/003.yaml
  text: And it shall be that the city nearest to the slain man[c][b][a], the elders of that city shall take a heifer from the herd that has not been worked with and has not pulled in a yoke.
translation:
  language: ta
  text: கொல்லப்பட்டவனுக்கு[a] மிக அருகிலுள்ள நகரத்தின் மூப்பர்கள், மாட்டு மந்தையைச் சேர்ந்த ஒரு இளம் பெண் மாட்டை[b], அது வேலைக்குப் பயன்படுத்தப்படாததும் நுகம் பூட்டி இழுக்காததுமானதால்[c], எடுத்துக்கொள்ள வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “கொல்லப்பட்டவனுக்கு” என்பதற்கு “கொல்லப்பட்ட நபருக்கு” அல்லது “பிணத்துக்கு” என்றும் மொழிபெயர்க்கலாம். எபிரேயச் சொல் கொல்லப்பட்ட ஒருவரைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: “மாட்டு மந்தையைச் சேர்ந்த ஒரு இளம் பெண் மாடு” என்பதற்கு சுருக்கமாக “ஒரு இளம் பெண் மாடு” என்றும் மொழிபெயர்க்கலாம். எபிரேயச் சொற்றொடர் மாட்டு மந்தையைச் சேர்ந்த இளம் பெண் மாட்டைக் குறிப்பாகக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: c
    text: எழுத்துப்படி, “நுகத்தில் இழுக்காதது”; அதாவது, இதற்கு முன் நுகம் பூட்டி இழுவைப் பணிக்குப் பயன்படுத்தப்படாத விலங்கு.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה הָעִיר הַקְּרֹבָה
  choice: மிக அருகிலுள்ள நகரத்தின் மூப்பர்கள்... கொண்டுவர வேண்டும்
  rationale: எபிரேய சட்டநடைச் சூத்திரத்தைத் தமிழில் இயல்பான தொடர்ச்சியான கட்டளையாக அளிக்கிறது; சூழலில் קְרֹבָה மிக அருகிலுள்ள நகரத்தைக் குறிக்கிறது.
- source_word: אֶל הֶחָלָל
  choice: கொல்லப்பட்டவனுக்கு
  rationale: חָלָל என்பது கொல்லப்பட்ட நபரைக் குறிக்கிறது; உயிரற்ற உடலை மட்டும் சுட்டும் சொல்லைவிட நபர்சார் பொருளைப் பேணுகிறது.
- source_word: זִקְנֵי הָעִיר הַהִוא
  choice: நகரத்தின் மூப்பர்கள்
  rationale: அந்த நகரத்தின் அங்கீகரிக்கப்பட்ட குடிமைத் தலைவர்களைக் குறிக்கும் சட்டப்பூர்வப் பதவிப் பொருளைத் தக்கவைக்கிறது.
- source_word: עֶגְלַת בָּקָר
  choice: மந்தையிலிருந்து ஒரு இளம் பசு
  rationale: עֶגְלָה இளம் பெண் மாட்டையும் בָּקָר மாட்டு மந்தையையும் குறிக்கின்றன; தமிழில் தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: אֲשֶׁר לֹא עֻבַּד בָּהּ
  choice: வேலைக்குப் பயன்படுத்தப்படாத
  rationale: அந்த விலங்கைக் கொண்டு இதற்கு முன் வேலை செய்யப்படவில்லை என்ற கருவிப்பொருளை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: אֲשֶׁר לֹא מָשְׁכָה בְּעֹל
  choice: நுகத்தின்கீழ் இழுக்காத
  rationale: משך என்பதன் இழுத்தல் என்ற நேரடிப் பொருளையும், நுகம் பூட்டப்பட்டு இழுவைப் பணியில் பயன்படுத்தப்படாத நிலையும் பேணுகிறது.
