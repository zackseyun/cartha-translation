- from: பின்பு நீ அவளை உன் வீட்டுக்குள் அழைத்துவர வேண்டும். அவள் தன் தலையை மழித்து, தன் நகங்களை வெட்டிக்கொள்ள வேண்டும்.[a]
  to: பின்பு நீ அவளை உன் வீட்டுக்குள் கொண்டுவந்து, அவள் தன் தலையை மழித்துத் தன் நகங்களை வெட்டிக்கொள்ள வேண்டும்.[a]
