source:
  edition: WLC
  text: וַ/הֲבֵאתָ֖/הּ אֶל תּ֣וֹךְ בֵּיתֶ֑/ךָ וְ/גִלְּחָה֙ אֶת רֹאשָׁ֔/הּ וְ/עָשְׂתָ֖ה אֶת צִפָּרְנֶֽי/הָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/021/012.yaml
  text: then you shall bring her into your house[a], and she shall shave her head and trim her nails.
translation:
  language: ta
  text: பின்பு நீ அவளை உன் வீட்டுக்குள் கொண்டுவந்து, அவள் தன் தலையை மழித்துத் தன் நகங்களை வெட்டிக்கொள்ள வேண்டும்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தன் நகங்களை வளர விட வேண்டும்.” எபிரேய மூலத்தில் சொல்லுக்குச் சொல், “தன் நகங்களைச் செய்ய வேண்டும்” என்று உள்ளது; இந்த மரபுத்தொடரின் பொருள் விவாதத்திற்குரியது.
    reason: alternative_reading
lexical_decisions:
- source_word: וַהֲבֵאתָהּ
  choice: பின்பு நீ அவளை அழைத்துவர வேண்டும்
  rationale: சட்ட விதிகளின் தொடரில் வாவ் இணைந்த ஹிஃபில் வடிவம் அடுத்ததாகச் செய்ய வேண்டிய செயலைக் குறிக்கிறது. ‘பின்பு’ அதன் தொடர்ச்சியையும், ‘அழைத்துவர வேண்டும்’ கட்டாயத்தையும் இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: אֶל תּוֹךְ בֵּיתֶךָ
  choice: உன் வீட்டுக்குள்
  rationale: תּוֹךְ என்பது வீட்டின் உட்பகுதியைக் குறிக்கிறது. ‘உன் வீட்டுக்குள்’ என்பது அந்த இடப்பொருளைத் துல்லியமாகவும் இயல்பாகவும் தருகிறது; ‘வீட்டின் நடுவிற்குள்’ என்பது தமிழில் தேவையற்ற அளவு சொல்லுக்குச் சொல் மொழிபெயர்ப்பாக இருக்கும்.
- source_word: וְגִלְּחָה אֶת רֹאשָׁהּ
  choice: அவள் தன் தலையை மழித்து
  rationale: גלח என்பதன் வழக்கமான பொருள் ‘மழித்தல்’. ‘தன் தலையை மழித்து’ என்பது எபிரெயச் சொல்லின் உறுதியை மீறி ‘முடி முழுவதையும்’ போன்ற விளக்கத்தைச் சேர்க்காமல் செயலைத் தெளிவாகக் கூறுகிறது.
- source_word: וְעָשְׂתָה אֶת צִפָּרְנֶיהָ
  choice: தன் நகங்களை வெட்டிக்கொள்ள வேண்டும்
  rationale: ‘நகங்களைச் செய்தல்’ என்று சொற்பொருளில் வரும் இந்த எபிரெய மரபுத்தொடர் விவாதத்திற்குரியது. முதன்மைப் பொருளாக நகங்களைச் சீராக்குதல் அல்லது வெட்டுதல் என்பதை இயல்பான தமிழில் தருகிறது; மற்ற முக்கியப் புரிதல் அடிக்குறிப்பில் காக்கப்படுகிறது.
theological_decisions:
- issue: וְעָשְׂתָה אֶת צִפָּרְנֶיהָ என்ற தொடரின் பொருள் தெளிவின்மை
  choice: அவள் தன் நகங்களை வெட்டிக்கொள்ள வேண்டும்
  alternative: அவள் தன் நகங்களை வளர விட வேண்டும்
  rationale: எபிரெய மூலத்தில் சொல்லுக்குச் சொல் ‘அவள் தன் நகங்களைச் செய்ய வேண்டும்’ என்று உள்ளது. இது நகங்களை வெட்டிச் சீராக்குவதையோ, வளர விடுவதையோ குறிக்கலாம். வாசிக்க இயல்பான முதன்மை வாசகம் உரையில் தரப்பட்டு, உண்மையான மாற்றுப் புரிதல் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான சட்டநடை பயன்படுத்தப்பட்டுள்ளது. ஒரே நீண்ட வாக்கியமாக்காமல், செய்பவர் மாறுவதைத் தெளிவுபடுத்த இரண்டு வாக்கியங்களாக அமைக்கப்பட்டுள்ளது. அடிக்குறிப்பு குறியீடு தெளிவின்மை உள்ள ‘நகங்கள்’ பற்றிய வாசகத்தோடு இணைக்கப்பட்டுள்ளது.
