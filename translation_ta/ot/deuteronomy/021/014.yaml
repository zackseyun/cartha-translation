  text: וְ/הָיָ֞ה אִם לֹ֧א חָפַ֣צְתָּ בָּ֗/הּ וְ/שִׁלַּחְתָּ/הּ֙ לְ/נַפְשָׁ֔/הּ וּ/מָכֹ֥ר לֹא תִמְכְּרֶ֖/נָּה בַּ/כָּ֑סֶף לֹא תִתְעַמֵּ֣ר בָּ֔/הּ תַּ֖חַת אֲשֶׁ֥ר עִנִּיתָֽ/הּ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/021/014.yaml
  text: But if it happens that you do not delight in her[a], then you shall let her go where she wishes; you must certainly not sell her for money. You must not treat her as merchandise[c][b], because you have humiliated her.
translation:
  language: ta
  text: ஆனால், நீ அவளை விரும்பாவிட்டால், அவள் விரும்பும் இடத்திற்குச் சுதந்திரமாகப் போக அவளை அனுப்பிவிட வேண்டும்.[a] அவளைப் பணத்திற்காக ஒருபோதும் விற்கக் கூடாது. அவளை வணிகப் பொருளாக நடத்தக் கூடாது.[b] ஏனெனில், நீ அவளை அவமானப்படுத்தினாய்.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லுக்குச் சொல், “அவளை அவளுக்காக அனுப்ப வேண்டும்”; அதாவது, அவளைச் சுதந்திரமாகச் செல்ல விட வேண்டும்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “ஆதாயத்திற்காக அவளைச் சுரண்டக் கூடாது.” இங்குள்ள எபிரெய வினை அரிதானது; அவளைப் பொருளாதாரப் பயன்பாட்டுக்குரிய பொருளாக நடத்தும் கருத்தைக் கொண்டிருக்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, “நீ அவளை மீறியிருக்கிறாய்.” எபிரெயச் சொல் சூழலுக்கேற்ப துன்புறுத்துதல், அவமானப்படுத்துதல் அல்லது பாலியல் ரீதியாக மீறுதல் என்பவற்றைக் குறிக்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהָיָה אִם
  choice: ஆனால், ... கொள்ளாவிட்டால்
  rationale: முந்தைய சட்டத்தின் தொடர்ச்சியில் வரும் மாறுபட்ட நிபந்தனையை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது; எபிரெயச் சொற்றொடரின் இடியோமாட்டிக் தன்மையைச் செயற்கையாக விரிவாக்கவில்லை.
- source_word: לֹא חָפַצְתָּ בָּהּ
  choice: நீ அவள்மேல் விருப்பம் கொள்ளாவிட்டால்
  rationale: חפץ என்பதன் விரும்புதல், இன்பம் காணுதல் என்ற உணர்வுசார் பொருளைப் பாதுகாக்கிறது; மூலத்தில் இல்லாத ‘இனிமேல்’ என்பதைச் சேர்க்கவில்லை.
- source_word: וְשִׁלַּחְתָּהּ לְנַפְשָׁהּ
  choice: அவள் விரும்பியபடி செல்ல அவளை விடுதலையாக்க வேண்டும்
  rationale: சொல்லுக்குச் சொல் ‘அவளை அவளுக்காக அனுப்புதல்’ என்ற இடியம், அவள் தன் விருப்பப்படி சுதந்திரமாகச் செல்ல அனுமதிக்கப்படுவதைச் சுட்டுகிறது.
- source_word: וּמָכֹר לֹא תִמְכְּרֶנָּה בַּכָּסֶף
  choice: அவளைப் பணத்திற்காக ஒருபோதும் விற்கக் கூடாது
  rationale: வினையெச்ச முழுமையும் வினைமுற்றும் இணைந்து தரும் வலியுறுத்தப்பட்ட தடையை ‘ஒருபோதும் ... கூடாது’ இயல்பாக வெளிப்படுத்துகிறது; כסף இங்கு ‘பணம்’ எனத் தெளிவாக மொழிபெயர்க்கப்படுகிறது.
- source_word: לֹא תִתְעַמֵּר בָּהּ
  choice: அவளை வணிகப் பொருளாக நடத்தக் கூடாது
  rationale: அரிதான עמר வினை, விற்பனைத் தடைக்கு இணையாக பொருளாதாரச் சுரண்டலையும் பொருளாக்குதலையும் குறிக்கிறது; உறுதியற்ற ஒரு குறிப்பிட்ட அடிமைச் சட்டப் பொருளைத் திணிக்கவில்லை.
- source_word: תַּחַת אֲשֶׁר
  choice: ஏனெனில்
  rationale: தடைக்கான காரணத்தைத் தரும் இக்கட்டமைப்பின் காரணவியல் பொருளைத் தெளிவான தமிழில் வழங்குகிறது.
- source_word: עִנִּיתָהּ
  choice: நீ அவளை அவமானப்படுத்தியிருக்கிறாய்
  rationale: ענה piel வடிவத்தின் துன்புறுத்துதல், தாழ்த்துதல், பாலியல் மீறல் ஆகிய பொருள் வரம்பில், சூழலின் தீவிரத்தைப் பாதுகாத்தபடி ஒரே குறுகிய சட்ட வகைப்பாட்டை முதன்மை உரையில் திணிக்காத தெரிவு.
theological_decisions:
- issue: சிறைபிடிக்கப்பட்ட பெண்ணைப் பற்றிய சட்டத்தின் அறநெறி வலிமை
  choice: பாலியல்/திருமண உறவுக்குப் பின் ஆணின் அதிகாரத்தை இந்த வசனம் கட்டுப்படுத்தி, பெண்ணை விடுதலை செய்யவும் அவளைப் பொருளாக்காதிருக்கவும் கட்டளையிடுவதாக மொழிபெயர்க்கப்பட்டது.
  alternative: இதை முழுமையாக இருதரப்புச் சம்மதமுள்ள மணவிலக்காகக் காட்டுதல், அல்லது முதன்மை உரையிலேயே குறிப்பிட்ட சட்டச் சொல்லால் பாலியல் வன்முறை என்று வரையறுத்தல்.
  rationale: எபிரெய உரை பெண் ‘அவமானப்படுத்தப்பட்டதால்/மீறப்பட்டதால்’ அவளை விடுவிக்கவும் விற்காமலும் சுரண்டாமலும் இருக்கச் சொல்கிறது. கட்டாயத்தின் பின்னணியை மென்மையாக்காமலும், மூலத்தைவிடக் குறிப்பான முடிவைத் திணிக்காமலும் அதன் அறநெறி அழுத்தம் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான சட்டநடை பயன்படுத்தப்பட்டது. ‘விடுதலையாக்க’, ‘வணிகப் பொருள்’, ‘அவமானப்படுத்து’ ஆகிய தெரிவுகள் பெண்ணின் சுயாதீனத்தையும் உரையின் கடுமையான நெறிசார் அழுத்தத்தையும் வெளிப்படுத்துகின்றன; அடிக்குறிப்புகள் எபிரெயத்தின் உண்மையான சொற்பொருள் தெளிவின்மையைப் பாதுகாக்கின்றன.
