base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/021/021.yaml
  text: Then all the men of his city shall stone him with stones[a], and he shall die. So you shall purge the evil from your midst, and all Israel shall hear and fear.
translation:
  language: ta
  text: அப்போது அவனுடைய நகரத்து ஆண்கள் அனைவரும்[a] அவன்மேல் கற்களை எறிய வேண்டும்; அவன் இறக்க வேண்டும். இவ்வாறு உன் நடுவிலிருந்து தீமையை அகற்றுவாய். இஸ்ரவேலர் அனைவரும் கேட்டு அஞ்சுவார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவனுடைய நகர மக்கள் அனைவரும்”; எபிரெய மொழியில் சொல்லுக்குச் சொல், “அவனுடைய நகரத்து ஆண்கள் அனைவரும்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּרְגָמֻהוּ ... בָאֲבָנִים
  choice: அவன்மேல் கற்களை எறிந்து அவனைக் கொல்ல வேண்டும்
  rationale: רגם என்பதன் நீதித்துறைச் சூழலிலான கல்லெறிந்து கொல்லும் பொருளையும், בָאֲבָנִים என்ற கருவியைக் குறிக்கும் சொற்றொடரையும் இயல்பான நவீனத் தமிழில் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: כָּל אַנְשֵׁי עִירוֹ
  choice: அவனுடைய நகரத்து ஆண்கள் அனைவரும்
  rationale: אַנְשֵׁי என்பது வெளிப்படையாக ஆண்பால் பன்மை; ஆகவே அதை பொதுமைப்படுத்தாமல், மூலத்தின் பாலினக் குறிப்பைத் தக்கவைக்கிறது.
- source_word: וָמֵת
  choice: அவனைக் கொல்ல வேண்டும்
  rationale: கல்லெறிதலின் விளைவாக அவன் இறக்க வேண்டும் என்ற சட்டத் தொடரைத் தமிழில் இயல்பாக இணைக்கிறது; நோக்கமா விளைவா என்ற நுண் வேறுபாட்டை அளவுக்கு மீறி விளக்கவில்லை.
- source_word: וּבִעַרְתָּ הָרָע מִקִּרְבֶּךָ
  choice: உன் நடுவிலிருந்து தீமையை அகற்றுவாய்
  rationale: உபாகமத்தில் திரும்பத் திரும்ப வரும் சமூக-நீதிசார் சூத்திரத்தின் பொருளை இயல்பாகத் தருகிறது; இங்கு בער என்பது நேரடியாக எரிப்பதை அல்ல, அகற்றுவதைச் சுட்டுகிறது.
- source_word: יִשְׁמְעוּ וְיִרָאוּ
  choice: இதைக் கேட்டு அஞ்சுவார்கள்
  rationale: தீர்ப்புச் செய்தியைக் கேட்பதும் அதனால் எச்சரிக்கைமிக்க அச்சம் ஏற்படுவதும் தமிழில் தெளிவாக வெளிப்படுகிறது; ‘இதைக்’ என்பது சூழலில் மறைந்துள்ள பொருளை மட்டும் நிரப்புகிறது.
theological_decisions:
- issue: சட்டச் சூழலில் பாலினம் குறிக்கப்பட்ட நகரக் குழு
  choice: அவனுடைய நகரத்து ஆண்கள் அனைவரும்
  alternative: அவனுடைய நகர மக்கள் அனைவரும்
  rationale: எபிரெயச் சொற்றொடர் வெளிப்படையாக ‘அவனுடைய நகரத்தின் ஆண்கள்’ எனக் கூறுவதால், மூலத்தின் பாலினக் குறிப்பைத் தக்கவைக்கிறது; இதிலிருந்து விரிவான பாலினக் கோட்பாடு எதுவும் ஊகிக்கப்படவில்லை.
- issue: உபாகமத்தின் தீமையை அகற்றும் சூத்திரம்
  choice: உன் நடுவிலிருந்து தீமையை அகற்றுவாய்
  alternative: உங்களிடையிலிருந்து தீமையை ஒழிப்பாய்
  rationale: மூலத்தில் உள்ள இரண்டாம் நபர் ஒருமையையும் ‘நடுவிலிருந்து’ என்ற உடன்படிக்கைச் சமூகச் சொல்லாட்சியையும் தக்கவைத்து, בער என்பதன் உருவக நீதிசார் பொருளைத் தெளிவாக அளிக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சட்ட உரைக்கு ஏற்ற கண்ணியமான மற்றும் தெளிவான நடை. ‘கல்லெறிந்து கொல்ல வேண்டும்’ என்பது தமிழில் இயல்பாக இருக்கும்படியும் மூலத்தின் தண்டனை முறையைத் தெளிவாகத் தக்கவைக்கும்படியும் தேர்ந்தெடுக்கப்பட்டது; அடிக்குறிப்பு குறியீடு அதனுடன் தொடர்புடைய ‘ஆண்கள்’ என்ற சொல்லுக்குப் பின் வைக்கப்பட்டது.
