  text: כִּי יִמָּצֵ֣א חָלָ֗ל בָּ/אֲדָמָה֙ אֲשֶׁר֩ יְהוָ֨ה אֱלֹהֶ֜י/ךָ נֹתֵ֤ן לְ/ךָ֙ לְ/רִשְׁתָּ֔/הּ נֹפֵ֖ל בַּ/שָּׂדֶ֑ה לֹ֥א נוֹדַ֖ע מִ֥י הִכָּֽה/וּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/021/001.yaml
  text: If a slain man is found in the land that Yahweh your God is giving you to possess[a], lying in the open field, and it is not known who struck him,
translation:
  language: ta
  text: உன் கடவுளாகிய யாவே உனக்கு உரிமையாக்கிக்கொள்ளக் கொடுக்கிற நாட்டில், கொல்லப்பட்ட ஒரு மனிதன் திறந்தவெளியில் விழுந்துகிடக்கக் காணப்பட்டால், அவனை அடித்தது யார் என்று தெரியாமல் இருந்தால்,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கொல்லப்பட்ட ஒருவர் … காணப்பட்டால்.” எபிரேயத்தில் இச்சொற்றொடர் இலக்கணரீதியாக ஆண்பால் ஒருமையில் (“கொல்லப்பட்ட ஒரு மனிதன்”) உள்ளது; எனினும், இந்தச் சட்டத்தின் நெறி குற்றவாளி அடையாளம் தெரியாத கொலைச் சம்பவத்துக்குப் பொதுவாகப் பொருந்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: இருந்தால்
  rationale: சட்டத்தின் நிபந்தனையை அறிமுகப்படுத்துவதால், தமிழில் இயல்பான நிபந்தனை வாக்கிய அமைப்பு பயன்படுத்தப்பட்டது.
- source_word: יִמָּצֵא
  choice: கண்டுபிடிக்கப்பட்டு
  rationale: מצא என்பதன் நிஃபால் வடிவிலுள்ள செயப்பாட்டு பொருளை நேரடியாகத் தருகிறது.
- source_word: חָלָל
  choice: கொல்லப்பட்ட ஒரு மனிதன்
  rationale: வன்முறையால் கொல்லப்பட்டவரைக் குறிக்கும் பொருளையும், எபிரெயின் ஆண்பால் ஒருமையையும் காக்கிறது; வெறும் ‘பிணம்’ என்று மொழிபெயர்ப்பது கொலையின் கருத்தை மங்கச் செய்யும்.
- source_word: בָּאֲדָמָה
  choice: நாட்டில்
  rationale: பின்வரும் உரிமையாக்கிக்கொள்ளுதல் பற்றிய வாக்கியத்தால், இங்கு மண் அல்ல, இஸ்ரவேலுக்குக் கொடுக்கப்படும் நாடு/நிலப்பரப்பு குறிக்கப்படுகிறது.
- source_word: אֲשֶׁר יְהוָה אֱלֹהֶיךָ נֹתֵן לְךָ לְרִשְׁתָּהּ
  choice: உன் கடவுளாகிய யெகோவா நீ உரிமையாக்கிக்கொள்ளும்படி உனக்குக் கொடுக்கிற
  rationale: தொடர்ந்து கொடுக்கிற செயலைக் குறிக்கும் பங்கேற்புவடிவத்தையும், நாட்டை உடைமையாக்கும் உடன்படிக்கைச் சொல்லாட்சியையும் இயல்பான தமிழில் தருகிறது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: திருநாமத்தைப் பட்டப்பெயராக மாற்றாமல் தனிப்பெயராகத் தமிழில் வழங்குகிறது.
- source_word: נֹפֵל
  choice: விழுந்துகிடக்க
  rationale: சொல்லின் அடிப்படை ‘விழுந்த’ பொருளையும், உடல் அங்கே கிடக்கும் நிலைமையையும் தமிழில் இயல்பாக ஒருங்கிணைக்கிறது.
- source_word: בַּשָּׂדֶה
  choice: திறந்தவெளியில்
  rationale: שָׂדֶה இங்கு குடியிருப்புக்கு வெளியேயுள்ள வெளிப்பகுதியைக் குறிக்கிறது; ‘வயல்’ என்பது தேவையில்லாமல் பயிரிடப்பட்ட நிலம் எனக் குறுக்கிவிடலாம்.
- source_word: לֹא נוֹדַע
  choice: தெரியாமல்
  rationale: யார் செய்தார் என்பது அறியப்படாத நிலையைத் தமிழில் தெளிவான செயப்பாட்டுப் பொருளுடன் தருகிறது.
- source_word: מִי הִכָּהוּ
  choice: அவனை அடித்தது யார்
  rationale: נכה என்பதன் ‘அடி/தாக்கு’ என்ற சொற்பொருளைத் தக்கவைக்கிறது; חָלָל ஏற்கெனவே மரணத்தைத் தெளிவுபடுத்துவதால் ‘கொன்றது’ என்று மீண்டும் விளக்கவில்லை.
theological_decisions:
- issue: יְהוָה என்ற இறைத் திருநாமத்தின் மொழிபெயர்ப்பு
  choice: யெகோவா
  alternative: கர்த்தர்
  rationale: மூலத்தில் வரும் உடன்படிக்கைத் திருநாமத்தை ஒரு பட்டப்பெயரால் மாற்றாமல் தனிப்பெயராகக் காக்கிறது.
- issue: חָלָל என்பதிலுள்ள பாலினக் குறிப்பு
  choice: கொல்லப்பட்ட ஒரு மனிதன்
  alternative: கொல்லப்பட்ட ஒருவர்
  rationale: எபிரெய் சொல் இலக்கணரீதியாக ஆண்பால் ஒருமையில் உள்ளது. அதேவேளை, இந்தச் சட்ட நெறி அடையாளம் தெரியாத கொலைச் சம்பவத்துக்குப் பொதுவாகப் பொருந்தலாம் என்பதை அடிக்குறிப்பு தெரிவிக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சட்ட உரைக்கு ஏற்ற கண்ணியமான நிபந்தனை வாக்கியமாக வடிவமைக்கப்பட்டது. ‘உரிமையாக்கிக்கொள்ள’ என்பது நாட்டைப் பெறுதல்/உடைமையாக்குதல் என்ற உடன்படிக்கைச் சூழலைத் தக்கவைக்கிறது; ‘திறந்தவெளி’ என்பது தேவையற்ற வேளாண் குறிப்பைத் தவிர்க்கிறது.
