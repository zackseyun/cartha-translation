  text: Then the elders of that city shall bring the heifer down to a perennial wadi[a], which is neither worked nor sown, and there in the wadi they shall break the heifer’s neck.
translation:
  language: ta
  text: 'அந்த நகரத்தின் மூப்பர்கள் அந்த இளம் பசுவை, உழப்படாமலும் விதைக்கப்படாமலும் இருக்கும் வற்றாத ஓடைப் படுகைக்கு[a] இறக்கிக் கொண்டு செல்ல வேண்டும். அங்கே அந்த ஓடைப் படுகையில் அவர்கள் அதன் கழுத்தை முறிக்க வேண்டும்.


    [a] எபிரெயச் சொற்றொடரை “வற்றாத ஓடைப் படுகை” என்றும் மொழிபெயர்க்கலாம்; “நிலைத்த பள்ளத்தாக்கு” அல்லது “கரடுமுரடான பள்ளத்தாக்கு” என்றும் புரிந்துகொள்ளப்படுகிறது. இச்சொற்றொடர் நிலையான நீரோட்டத்தை மட்டுமே அவசியமாகக் குறிக்கிறதா என்பது உறுதியற்றது.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயச் சொற்றொடரை “வற்றாத ஓடைப் படுகை” என்றும் மொழிபெயர்க்கலாம்; “நிலைத்த பள்ளத்தாக்கு” அல்லது “கரடுமுரடான பள்ளத்தாக்கு” என்றும் புரிந்துகொள்ளப்படுகிறது. இச்சொற்றொடர் நிலையான நீரோட்டத்தை மட்டுமே அவசியமாகக் குறிக்கிறதா என்பது உறுதியற்றது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוֹרִדוּ
  choice: இறக்கிக் கொண்டுபோக வேண்டும்
  rationale: ירד என்பதன் ஹிஃபில் வடிவம் கீழ்நோக்கிக் கொண்டுபோவதைக் குறிக்கிறது; பள்ளத்தாக்கை நோக்கிய இயக்கத்தையும் காரணவினைப் பொருளையும் இத்தேர்வு இயல்பாக வெளிப்படுத்துகிறது.
- source_word: זִקְנֵי הָעִיר הַהִוא
  choice: அந்த நகரத்தின் மூப்பர்கள்
  rationale: சட்டச் சூழலுக்கு ஏற்றவாறு எபிரெயக் கட்டமைப்பைத் துல்லியமாகவும் இயல்பான தமிழிலும் வழங்குகிறது.
- source_word: הָעֶגְלָה
  choice: அந்த இளம் பசு
  rationale: עגלה என்பது இளம் பெண் மாட்டைக் குறிக்கிறது; பொதுவாசகர்களுக்குப் புரியும் வகையில் ‘இளம் பசு’ என்று மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: אֶל נַחַל אֵיתָן
  choice: வற்றாத நீரோடையுள்ள பள்ளத்தாக்குக்கு
  rationale: נחל என்பது ஓடைப் படுகை அல்லது பள்ளத்தாக்கைக் குறிக்கலாம்; איתן இச்சூழலில் நிலைத்த அல்லது வற்றாத தன்மையைக் குறிக்கலாம். மாற்றுப் பொருளான கரடுமுரடான பள்ளத்தாக்கு அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
- source_word: אֲשֶׁר לֹא יֵעָבֵד בּוֹ וְלֹא יִזָּרֵעַ
  choice: உழப்படாமலும் விதைக்கப்படாமலும் இருக்கும்
  rationale: இரு செயல்களிலும் உள்ள செயப்பாட்டு வடிவத்தையும் வேளாண்மைச் சூழலையும் காத்து, தமிழில் இயல்பான இணை அமைப்பாக வழங்குகிறது.
- source_word: וְעָרְפוּ
  choice: அதன் கழுத்தை முறிக்க வேண்டும்
  rationale: ערף இச்சடங்கில் பொதுவாகக் கொல்வதை மட்டும் அல்லாமல், கழுத்தை முறிக்கும் குறிப்பிட்ட செயலைக் குறிக்கிறது.
- source_word: שָׁם ... בַּנָּחַל
  choice: அங்கே, அந்தப் பள்ளத்தாக்கில்
  rationale: இடத்தைக் குறிக்கும் இரு எபிரெயக் கூறுகளையும் தெளிவாகக் காத்து, נחל என்பதற்கான மொழிபெயர்ப்பையும் ஒரேவிதமாக வைத்திருக்கிறது.
