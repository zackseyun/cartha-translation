  source_fidelity: மூலத்தின் சட்டப்பூர்வ எதிர்காலக் கருத்து, நகர மூப்பர்கள், இளம் பெண் மாடு, பயிரிடப்படாத இடம், அங்கே கழுத்தை முறிக்கும் சடங்கு ஆகியவை வரைவில் துல்லியமாக உள்ளன. ஆனால் “வற்றாத நீரோடையுள்ள பள்ளத்தாக்கு” என்பது נַחַל אֵיתָן என்பதற்கு ‘நீரோடை உள்ளது/ஓடுகிறது’ என்ற பொருளைச் சற்றே அதிகமாக நிர்ணயிக்கிறது. எபிரெயச் சொல்லில் நீடித்த/வற்றாத தன்மை உறுதியானாலும், நிலையான நீரோட்டம் என்பது விவாதத்திற்குரிய விளக்கமாகும்.
  naturalness: “ஓடைப் படுகை” என்பது நவீனத் தரத் தமிழில் நַחַל (wadi/streambed/ravine) என்பதற்குத் துல்லியமும் இயல்பும் உடையது. “இறக்கிக் கொண்டு செல்ல வேண்டும்” மற்றும் “அங்கே அந்த ஓடைப் படுகையில்” என்பவை சட்ட நடையில் தெளிவாக உள்ளன.
  terminology: “இளம் பசு” עֶגְלָה என்ற இளம் பெண் மாட்டைத் தெளிவாகக் குறிக்கிறது. “கழுத்தை முறிக்க வேண்டும்” עָרַף என்ற இச்சடங்கிற்குரிய குறிப்பிட்ட செயலைப் பாதுகாக்கிறது. நַחַל என்பதற்கு வசனத்திலும் அடிக்குறிப்பிலும் ஒரேவகையில் “ஓடைப் படுகை” பயன்படுத்தப்பட்டுள்ளது.
