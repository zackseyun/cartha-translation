  text: יְהוָ֖ה בָּדָ֣ד יַנְחֶ֑/נּוּ וְ/אֵ֥ין עִמּ֖/וֹ אֵ֥ל נֵכָֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/012.yaml
  text: Yahweh alone led him[a], and no foreign god was with him.
translation:
  language: ta
  text: யாவே மட்டுமே அவனை வழிநடத்தினார்[a]; அந்நிய தெய்வம் எதுவும் அவனுடன் இருக்கவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவனை நடத்தினார்.” எபிரேய வினைச்சொல் நடத்துதல் அல்லது வழிகாட்டுதல் என்ற நெருங்கிய பொருள்களைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைவன் இஸ்ரவேலுக்கு வெளிப்படுத்திய தனிப்பெயரைப் பட்டப்பெயரால் மாற்றாமல், எபிரேய நான்கெழுத்துப் பெயரின் ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: בָּדָד
  choice: ஒருவரே
  rationale: இங்கு வினையை அடைமொழிபோல் வரையறுத்து, யாவே வேறு எவருடைய துணையுமின்றித் தாமே செயல்பட்டார் என்பதை இயல்பான தமிழில் உணர்த்துகிறது.
- source_word: יַנְחֶנּוּ
  choice: அவனை வழிநடத்தினார்
  rationale: נחה என்பதன் ஹிஃபீல் வடிவம் இச்சூழலில் நடத்துதல் அல்லது வழிகாட்டுதல் என்று பொருள்படும். ஆண்பால் ஒருமை பின்னொட்டு, சுற்றியுள்ள பாடலில் ஒருமையாக உருவகிக்கப்படும் இஸ்ரவேல்/யாக்கோபைக் குறிக்கிறது.
- source_word: וְאֵין
  choice: எதுவும் ... இருக்கவில்லை
  rationale: இருப்பின்மையைத் தெரிவிக்கும் எபிரேய எதிர்மறைக் கட்டமைப்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: עִמּוֹ
  choice: அவருடன்
  rationale: עִם முன்னிடைச்சொல் உடனிருத்தலைக் குறிக்கிறது; பின்னொட்டு இலக்கணப்படி ஆண்பால் ஒருமை. தமிழில் அருகிலுள்ள கர்த்தாவாகிய யாவேவைக் குறிக்க மரியாதை ஒருமை பயன்படுத்தப்பட்டுள்ளது.
- source_word: אֵל נֵכָר
  choice: அந்நிய தெய்வம்
  rationale: இஸ்ரவேலின் தேவனுக்கு அயலான அல்லது வேறான தெய்வத்தைக் குறிக்கும் சொற்றொடரின் விக்கிரகாராதனை எதிர்ப்புப் பொருளைத் தெளிவாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: “அவனை” என்பதன் ஒருமைக் குறிப்பு
  choice: எபிரேய ஆண்பால் ஒருமையை “அவனை” என்று தக்கவைத்து, அதைச் சூழலில் ஒருமையாக உருவகிக்கப்படும் இஸ்ரவேல்/யாக்கோபைக் குறிக்கச் செய்தல்
  alternative: தேசமாகிய இஸ்ரவேலைப் பன்மையாகக் காட்ட “அவர்களை” என்று மொழிபெயர்த்தல்
  rationale: மூலத்தில் ஒருமை ஆண்பால் பின்னொட்டு இருப்பதாலும், முந்தைய சூழல் யாக்கோபு/இஸ்ரவேலை ஒருமையாகப் பேசுவதாலும், இலக்கண வடிவமும் கூட்டு ஆளுமை உருவகமும் பாதுகாக்கப்படுகின்றன.
- issue: “அவருடன்” என்பதன் சுட்டுப்பொருள்
  choice: யாவேவைக் குறிக்கும் வகையில் மரியாதை ஒருமையான “அவருடன்” பயன்படுத்துதல்
  alternative: இஸ்ரவேலைக் குறிக்கும் “அவனுடன்” என்று வாசித்தல்
  rationale: எபிரேய வாக்கிய அமைப்பில் “யாவே ஒருவரே” என்பதற்கு எதிராக வேறு தெய்வம் அவருடன் இல்லை என்ற கருத்தே இயல்பானது. இருப்பினும் மூலத்தின் ஆண்பால் ஒருமைப் பின்னொட்டு மட்டும் தனித்து சுட்டுப்பொருளை வெளிப்படையாகப் பெயரிடவில்லை.
translation_notes:
  register: நவீன செந்தமிழ் சார்ந்த, எளிதில் புரியும் கண்ணியமான நடை. இறைப்பெயர் “யாவே” என்று ஒலிபெயர்க்கப்பட்டுள்ளது. யாக்கோபு/இஸ்ரவேலைக் குறிக்கும் மூலத்தின் ஆண்பால் ஒருமை “அவனை” எனப் பாதுகாக்கப்பட்டுள்ளது; தேவனைச் சுட்டும் இடத்தில் தமிழ் மரியாதை ஒருமை பயன்படுத்தப்பட்டுள்ளது.
