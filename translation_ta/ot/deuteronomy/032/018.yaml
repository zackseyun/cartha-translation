source:
  edition: WLC
  text: צ֥וּר יְלָדְ/ךָ֖ תֶּ֑שִׁי וַ/תִּשְׁכַּ֖ח אֵ֥ל מְחֹלְלֶֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/018.yaml
  text: You neglected the Rock who fathered you[c][b][a], and forgot the God who gave you birth.
translation:
  language: ta
  text: உன்னைப் பிறப்பித்த கன்மலையை நீ அலட்சியம் செய்தாய்[a][b]; உன்னைப் பிரசவித்த கடவுளை மறந்தாய்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அலட்சியம் செய்தாய்” என்று மொழிபெயர்க்கப்பட்டுள்ள எபிரெய வினைச்சொல்லின் பொருள் கடினமானது; “மறந்தாய்,” “நினைவில் கொள்ளாமல் இருந்தாய்,” அல்லது “பலவீனப்படுத்தினாய்” என்றும் எடுத்துக்கொள்ளலாம்.
    reason: lexical_alternative
  - marker: b
    text: “உன்னைத் தந்தையாகப் பெற்ற கன்மலை” என்றும் மொழிபெயர்க்கலாம்; எபிரெயச் சொல் பிறப்பித்தல்/பெறுதல் உருவகத்தைப் பயன்படுத்துகிறது.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, “உன்னைப் பிறப்புக்கு கொண்டுவந்த கடவுள்”; எபிரெயத்தில் பிரசவம் மற்றும் பிறப்புவலி உருவகம் உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: צוּר
  choice: கன்மலை
  rationale: இச்சொல் நேரடியாகப் ‘பாறை/கன்மலை’ என்று பொருள்படுவதோடு, உபாகமத்தில் இஸ்ரவேலின் கடவுளைக் குறிக்கும் செறிவுமிக்க உருவகப் பட்டமாக வருகிறது. ‘கன்மலை’ அந்தப் பட்டத்தையும் அதன் நேரடி உருவகத்தையும் காக்கிறது.
- source_word: יְלָדְךָ
  choice: உன்னைப் பெற்றெடுத்த
  rationale: Qal வடிவிலுள்ள ילד பிறப்பித்தல் அல்லது தந்தையாகப் பெறுதல் என்ற பொருளைக் கொள்ளலாம். தமிழில் ‘பெற்றெடுத்த’ என்பது யார் பெற்றார் என்ற பாலினத்தைத் தானாகத் தீர்மானிக்காமல், இஸ்ரவேலைத் தோற்றுவித்தவர் என்ற பிறப்பு உருவகத்தைக் காக்கிறது.
- source_word: תֶּשִׁי
  choice: நீ அலட்சியம் செய்தாய்
  rationale: இவ்வினைச்சொல்லின் பொருள் கடினமானது. இணை வரியான ‘மறந்தாய்’ என்பதோடு சேர்ந்து, வெறும் நினைவிழப்பை விடக் குற்றமுள்ள புறக்கணிப்பை இது சுட்டுவதாகத் தெரிகிறது; ‘அலட்சியம் செய்தாய்’ அந்த வேறுபாட்டைக் காக்கிறது.
- source_word: וַתִּשְׁכַּח
  choice: மறந்தாய்
  rationale: שכח என்பதன் இயல்பான பொருள் ‘மறத்தல்’; இது முந்தைய குற்றச்சாட்டுக்கு இணையான இரண்டாம் குற்றச்சாட்டாக வருகிறது.
- source_word: אֵל
  choice: கடவுள்
  rationale: இங்கு אל என்பது இஸ்ரவேலின் கடவுளைக் குறிக்கிறது; தமிழில் ‘கடவுள்’ தெளிவான, இயல்பான இணை.
- source_word: מְחֹלְלֶךָ
  choice: உன்னைப் பிரசவித்த
  rationale: חול வேரின் இவ்வடிவம் பிரசவ வேதனையையும் அதன் வழியாகப் பிறப்பித்தலையும் குறிக்கலாம். ‘பிரசவித்த’ என்பது அந்தத் தெளிவான பிறப்பு உருவகத்தைப் பொதுவான ‘உருவாக்கிய’ என்று மென்மைப்படுத்தாமல் காக்கிறது.
theological_decisions:
- issue: கடவுளுக்கான பெற்றோர் மற்றும் பிரசவ உருவகம்
  choice: முதல் அடியில் பாலினத்தைத் தீர்மானிக்காத ‘பெற்றெடுத்த’ என்பதையும், இரண்டாம் அடியில் தெளிவான ‘பிரசவித்த’ என்பதையும் கொண்டு பிறப்பு உருவகத்தைத் தக்கவைத்தல்.
  alternative: ‘உன்னை உருவாக்கிய கன்மலை’ மற்றும் ‘உன்னைப் படைத்த கடவுள்’ போன்ற பொதுவான படைப்பு மொழியைப் பயன்படுத்துதல்.
  rationale: எபிரெய உரை கன்மலை, பெற்றெடுத்தல், பிரசவித்தல் ஆகிய வலுவான உருவகங்களை அடுத்தடுத்து வைக்கிறது. பொதுவான படைப்பு மொழி அந்தக் கவித்துவ மற்றும் இறையியல் அழுத்தத்தை நீக்கிவிடும்; ஆகவே மூலத்தின் பதற்றம் காக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், கவித்துவ இணை அமைப்பும் குற்றச்சாட்டின் நேரடியான தொனியும் காக்கப்பட்டுள்ளன. ‘கன்மலை’ தெய்வீகப் பட்டத்தின் உருவகச் செறிவைத் தருகிறது; ‘பிரசவித்த’ என்பது மூலத்தில் உள்ள அதிர்ச்சியூட்டும் பிறப்பு உருவகத்தை மறைக்காமல் வெளிப்படுத்துகிறது.
