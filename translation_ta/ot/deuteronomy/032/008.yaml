base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/008.yaml
  text: When the Most High gave the nations their inheritance[a], when he separated the sons of man[b], he fixed the boundaries of the peoples according to the number of the sons of Israel.
translation:
  language: ta
  text: 'உன்னதமானவர் தேசங்களுக்குச் சுதந்தரப் பங்குகளை அளித்தபோது,

    மனிதர்களை[b] அவர் பிரித்தபோது,

    இஸ்ரவேலின் மகன்களின்[a] எண்ணிக்கைக்கு ஏற்ப

    மக்களின் எல்லைகளை நிர்ணயித்தார்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சவக்கடல் சுருள்களில் “தேவனின் மகன்கள்” என்றும், செப்துவஜிந்தில் “தேவதூதர்கள்” என்றும் வாசிக்கப்படுகிறது; மசோரா உரையில் “இஸ்ரவேலின் மகன்கள்” என்று உள்ளது.
    reason: textual_variant
  - marker: b
    text: “மனிதர்கள்” என்பதற்கு மொழிபெயர்க்கப்பட்டுள்ள எபிரெயச் சொற்றொடர், மனிதர்கள் அல்லது மனிதகுலம் முழுவதையும் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּהַנְחֵל
  choice: சுதந்தரப் பங்கை அளித்தபோது
  rationale: נחל என்பதன் ஹிஃபில் வடிவம் இங்கு தேசங்களுக்கு உரிய பங்குகளை ஒதுக்கிக் கொடுப்பதைக் குறிக்கிறது; prefixed ב temporal clause ஆக இருப்பதால் ‘அளித்தபோது’ என மொழிபெயர்க்கப்பட்டது.
- source_word: עֶלְיוֹן
  choice: உன்னதமானவர்
  rationale: இது இறைவனுக்குரிய பட்டப்பெயர்; தமிழில் இயல்பாகவும் மாண்புடனும் ஒலிக்கும் வகையில் பெயர்ச்சொல் வடிவில் தரப்பட்டது.
- source_word: גּוֹיִם
  choice: தேசங்கள்
  rationale: இங்கு உலகின் பல்வேறு தேசங்களைக் குறிக்கிறது; பிற்கால சமய வேறுபாட்டைக் குறிக்கும் சொல்லாக மொழிபெயர்க்கப்படவில்லை.
- source_word: בְּהַפְרִידוֹ
  choice: அவர் பிரித்தபோது
  rationale: פרד என்பதன் அடிப்படைப் பொருளான பிரித்தல் காக்கப்பட்டது; 3ஆம் நபர் ஆண்பால் ஒருமை விகுதி உன்னதமானவரைக் குறிக்கிறது.
- source_word: בְּנֵי אָדָם
  choice: மனிதனின் மகன்கள்
  rationale: எபிரெய மொழியின் உருவகமிக்க ஆண்பால் பன்மை அமைப்பு காக்கப்பட்டது; இது பொதுவாக மனிதகுலத்தைக் குறிக்கும் என்பது அடிக்குறிப்பில் தெளிவுபடுத்தப்பட்டது.
- source_word: יַצֵּב
  choice: நிர்ணயித்தார்
  rationale: எல்லைகளை உறுதியாக அமைத்தல் அல்லது நிறுவுதல் என்ற ஹிஃபில் வினையின் பொருளை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: גְּבֻלֹת עַמִּים
  choice: மக்களினங்களின் எல்லைகள்
  rationale: עמים என்பது இன, சமூக அல்லது அரசியல் மக்கள்குழுக்களைக் குறிக்கக்கூடும்; ‘மக்களினங்கள்’ என்பது தேசங்கள் என்ற முந்தைய சொல்லை தேவையின்றி மீண்டும் பயன்படுத்தாமல் வேறுபாட்டைக் காக்கிறது.
- source_word: לְמִסְפַּר
  choice: எண்ணிக்கைக்கு ஏற்ப
  rationale: லாமேத் முன்னொட்டு இங்கு எண்ணிக்கையுடனான ஒத்திசைவு அல்லது அளவைக் காட்டுகிறது.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் மகன்கள்
  rationale: வழங்கப்பட்ட WLC மசோரா உரையின் בני ישראל என்ற வாசகம் நேரடியாகக் காக்கப்பட்டது; வேறுபட்ட பழங்கால வாசகம் அடிக்குறிப்பில் தரப்பட்டது.
theological_decisions:
- issue: இறுதி சொற்றொடரிலுள்ள உரை வேறுபாடு
  choice: இஸ்ரவேலின் மகன்கள்
  alternative: தேவனின் மகன்கள் / தேவதூதர்கள்
  rationale: வழங்கப்பட்ட WLC உரை בני ישראל என்று வாசிப்பதால் முதன்மை உரை அதைப் பின்பற்றுகிறது. சவக்கடல் சுருள்களும் செப்துவஜிந்தும் வேறுபட்ட வாசகத்துக்குச் சான்றளிப்பதால், வசனத்தின் இறையியல் பொருளை மாற்றக்கூடிய அந்த வேறுபாடு மறைக்கப்படாமல் அடிக்குறிப்பில் வைக்கப்பட்டது.
- issue: בני אדם என்ற மனிதவியல் சொற்றொடர்
  choice: மனிதனின் மகன்கள்
  alternative: மனிதகுலம் / மனிதர்கள்
  rationale: எபிரெய மூலத்தின் பிரதிநிதித்துவ ஆண்பால் கவிதை வடிவம் முதன்மை உரையில் காக்கப்பட்டது; அது மனிதர்கள் அனைவரையும் குறிக்கும் விரிந்த பொருள் அடிக்குறிப்பில் விளக்கப்பட்டது.
translation_notes:
  register: நவீனத் தரத் தமிழில், கவிதைநடையின் இணை அமைப்பைக் காக்கும் மாண்பான ஆனால் எளிதில் புரியும் நடை பயன்படுத்தப்பட்டது. ‘சுதந்தரப் பங்கு’, ‘மக்களினங்கள்’, ‘நிர்ணயித்தார்’ ஆகிய சொற்கள் நிலப்பங்கீடு மற்றும் எல்லை அமைத்தலின் கருத்துகளைத் தெளிவாகக் காட்டுகின்றன.
