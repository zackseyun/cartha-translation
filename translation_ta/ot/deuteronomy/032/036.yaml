revisions:
- from: ஏனெனில், யெகோவா தம் மக்களுக்கு நீதி வழங்குவார்[a]; தம் ஊழியர்கள்மேல் இரக்கம் கொள்வார்[b]. அவர்களுடைய வலிமை ஒழிந்துவிட்டதையும், அடைபட்டவனோ விடப்பட்டவனோ ஒருவனும் எஞ்சவில்லை என்பதையும் அவர் காணும்போது[c][d], இப்படிச் செய்வார்.
  to: அவர்களுடைய வலிமை ஒழிந்துபோனதையும், அடைபட்டவனோ விடப்பட்டவனோ எவரும் இல்லாததையும் அவர் காணும்போது, யாவே தம் மக்களுக்கு நீதி வழங்குவார்[a]; தம் ஊழியர்கள்மீது இரக்கம் கொள்வார்[b][c][d].
  rationale: யְהוָה-க்கு ‘யாவே’ என்ற ஒலிபெயர்ப்பு பயன்படுத்தப்பட்டது. மூலத்தில் இல்லாத ‘இப்படிச் செய்வார்’ நீக்கப்பட்டு, காரண/காலத் துணைவாக்கியம் முதலில் வைக்கப்பட்டது. வலிமை தீர்ந்ததற்கான மரபுத்தொடருக்கும், இறுதியிலுள்ள விவாதத்துக்குரிய இணைக்கும் அடிக்குறிப்புகள் தொடர்கின்றன. குறிப்பு அடையாளங்கள் தொடர்புடைய சொற்றொடர்களில் இருக்கும்படி மறுஅமைக்கப்பட்டுள்ளன.
