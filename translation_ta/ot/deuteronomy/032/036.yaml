  text: כִּֽי יָדִ֤ין יְהוָה֙ עַמּ֔/וֹ וְ/עַל עֲבָדָ֖י/ו יִתְנֶחָ֑ם כִּ֤י יִרְאֶה֙ כִּי אָ֣זְלַת יָ֔ד וְ/אֶ֖פֶס עָצ֥וּר וְ/עָזֽוּב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/036.yaml
  text: For Yahweh will vindicate his people and will have compassion on his servants[a], when he sees that their strength is gone, and there is none left[d][c][b], bond or free.
translation:
  language: ta
  text: அவர்களுடைய வலிமை ஒழிந்துபோனதையும், அடைபட்டவனோ விடப்பட்டவனோ எவரும் இல்லாததையும் அவர் காணும்போது, யாவே தம் மக்களுக்கு நீதி வழங்குவார்[a]; தம் ஊழியர்கள்மீது இரக்கம் கொள்வார்[b][c][d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தம் மக்களைத் தீர்ப்பிடுவார்.” இங்குள்ள எபிரேய வினை தீர்ப்பிடுதல், ஆட்சி செய்தல், அல்லது ஒருவருக்கு ஆதரவாக நீதி வழங்குதல் ஆகிய பொருள்களைக் கொள்ளலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “தம் ஊழியர்களைக் குறித்து மனம் மாறுவார்.” எபிரேய வினை மனம் மாறுதல், ஒரு நடவடிக்கையிலிருந்து விலகுதல், அல்லது இரக்கத்தால் நெகிழ்தல் ஆகியவற்றை வெளிப்படுத்தலாம்.
    reason: lexical_alternative
  - marker: c
    text: சொல்லர்த்தமாக, “கை ஒழிந்துபோனது”; வலிமை அல்லது ஆற்றல் முற்றிலும் தீர்ந்துவிட்டதைக் குறிக்கும் மரபுத்தொடர்.
    reason: lexical_alternative
  - marker: d
    text: “அடைபட்டவனும் விடப்பட்டவனும்” என்ற எபிரேய இணையின் துல்லியமான பொருள் உறுதியற்றது. இது “அடிமையும் சுதந்திரனும்” என்று எல்லாரையும் குறிக்கலாம்; அல்லது “எவருமே எஞ்சவில்லை” என்பதை வலியுறுத்தலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: יָדִין
  choice: நீதி வழங்குவார்
  rationale: דין என்பதன் நீதித்துறை சார்ந்த பொருளைத் தக்கவைத்து, இச்சூழலில் யெகோவா தம் மக்களுக்கு ஆதரவாகச் செயல்படுவதைக் காட்டுகிறது; ‘தீர்ப்பிடுவார்’ என்ற மாற்றுப் பொருளும் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: எபிரேய இறைப்பெயரை ஒரு பட்டப்பெயரால் மாற்றாமல், தமிழில் பரவலாக அறியப்பட்ட ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: עַמּוֹ
  choice: தம் மக்கள்
  rationale: உடன்படிக்கைச் சமூகத்தைக் குறிக்கும் கூட்டுப்பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: וְעַל עֲבָדָיו יִתְנֶחָם
  choice: தம் ஊழியர்கள்மேல் இரக்கம் கொள்வார்
  rationale: נחם வினையின் இங்குள்ள இரங்குதல்/மனம் மாறுதல் சார்ந்த பொருளில், சூழலுக்கு ஏற்ற இரக்கத்தை முதன்மைப்படுத்துகிறது; ‘அவர்களைக் குறித்து மனம் மாறுவார்’ என்பது சாத்தியமான மாற்று.
- source_word: כִּי יִרְאֶה
  choice: அவர் காணும்போது
  rationale: כִּי இங்குக் கொண்டுள்ள கால-காரணத் தொடர்பின் இயல்பான தமிழாக்கம்.
- source_word: אָזְלַת יָד
  choice: அவர்களுடைய வலிமை ஒழிந்துவிட்டது
  rationale: சொல்லர்த்தமான ‘கை ஒழிந்தது’ என்ற எபிரேய மரபுத்தொடரின் வல்லமை அல்லது ஆற்றல் முற்றிலும் தீர்ந்தது என்ற பொருளைத் தெளிவாக்குகிறது.
- source_word: וְאֶפֶס
  choice: ஒருவனும் எஞ்சவில்லை
  rationale: இல்லாமை அல்லது முற்றுப்பெறுதலை, தொடர்ந்து வரும் நபர் வகைகளோடு இயல்பாக இணைக்கிறது.
- source_word: עָצוּר וְעָזוּב
  choice: அடைபட்டவனோ விடப்பட்டவனோ
  rationale: கடினமான இந்த எபிரேய இணையின் சொல்லுருவைத் தக்கவைத்து அதன் உண்மையான தெளிவின்மையை மறைக்கவில்லை; இது அடிமை-சுதந்திரன் அல்லது எவருமே இல்லை எனப் பொருள்படும் மரபுத்தொடராக இருக்கலாம்.
theological_decisions:
- issue: יָדִין என்பதில் மக்களுக்கான இறைச் செயலின் தன்மை
  choice: தம் மக்களுக்கு நீதி வழங்குவார்
  alternative: தம் மக்களைத் தீர்ப்பிடுவார்
  rationale: அடுத்த இணைப்பகுதியிலுள்ள இரக்கமும், மக்களின் முழு வலிமையின்மையும், அவர்களுக்குச் சாதகமான நீதிச் செயலை ஆதரிக்கின்றன; ஆயினும் வினையின் பொதுவான ‘தீர்ப்பிடுதல்’ பொருளை அடிக்குறிப்பு பாதுகாக்கிறது.
- issue: יִתְנֶחָם என்பதன் இரக்கம் மற்றும் மனம் மாறுதல் சார்ந்த பொருள்
  choice: இரக்கம் கொள்வார்
  alternative: அவர்களைக் குறித்து மனம் மாறுவார் / தம் முடிவை மாற்றிக்கொள்வார்
  rationale: சூழலில் உதவியற்ற ஊழியர்களை நோக்கிய இரக்கமே முன்னிலைப்படுகிறது; இருப்பினும் எபிரேய வினையின் ‘மனம் மாறுதல்/விலகுதல்’ நுணுக்கம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: עָצוּר וְעָזוּב என்ற இணையின் அடையாளம்
  choice: அடைபட்டவனோ விடப்பட்டவனோ
  alternative: அடிமையோ சுதந்திரனோ / எவருமே
  rationale: மூலத்தின் கடினமான, தெளிவற்ற சொல்லிணையை முதன்மை உரையில் தக்கவைத்து, சாத்தியமான மரபுத்தொடர் விளக்கங்களை அடிக்குறிப்பில் தருகிறது; இதனால் உறுதியற்ற பொருள் ஒரே விளக்கமாக முடிவுசெய்யப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில் கண்ணியமான, பொதுவாசகருக்குப் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. ‘தம்’ என்ற மரியாதைத் தற்சுட்டு இறைவனைக் குறிக்கிறது. கடினமான இறுதி எபிரேய இணை எளிதாக்கப்பட்ட ஒரே விளக்கமாக மாற்றப்படாமல், முதன்மை உரையில் சொல்லுருவோடு வைக்கப்பட்டு அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது.
