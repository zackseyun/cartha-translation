source:
  edition: WLC
  text: אִם שַׁנּוֹתִי֙ בְּרַ֣ק חַרְבִּ֔/י וְ/תֹאחֵ֥ז בְּ/מִשְׁפָּ֖ט יָדִ֑/י אָשִׁ֤יב נָקָם֙ לְ/צָרָ֔/י וְ/לִ/מְשַׂנְאַ֖/י אֲשַׁלֵּֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/041.yaml
  text: when I sharpen the lightning of my sword, and my hand takes hold of judgment, I will return vengeance on my adversaries, and I will repay those who hate me.
translation:
  language: ta
  text: 'என் வாளின் மின்னலைக் கூராக்கி,


    என் கை நீதித்தீர்ப்பைப் பற்றிக்கொள்ளும்போது,


    என் எதிரிகள்மேல் பழிவாங்குவேன்;


    என்னை வெறுப்பவர்களுக்குத் தக்க பதிலளிப்பேன்.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִם
  choice: -க்கும்போது
  rationale: இங்கு אִם வெறும் ஐயப்பாட்டு ‘என்றால்’ என்பதைக் காட்டிலும், அடுத்த செயலுடன் இணைந்த கால/நிபந்தனை உறவைச் சுட்டுகிறது; பாடலின் உறுதியான அறிவிப்புக்கு இயல்பாக ‘போது’ என வழங்கப்பட்டது.
- source_word: שַׁנּוֹתִי בְּרַק חַרְבִּי
  choice: என் வாளை மின்னலைப்போல் கூராக்கி
  rationale: שׁנן என்பது கூராக்குதல்; בְּרַק חַרְבִּי இலக்கண ரீதியாக ‘என் வாளின் மின்னல்’ எனலாம். தமிழில் பொருள் தெளிவாகவும் கவிதை உருவகம் நிலைக்கவும் ‘மின்னலைப்போல்’ பயன்படுத்தப்பட்டது.
- source_word: מִשְׁפָּט
  choice: நீதித்தீர்ப்பு
  rationale: இச்சூழலில் பொதுவான ‘நீதி’ மட்டுமல்லாமல் எதிரிகள்மேல் நிறைவேற்றப்படும் நீதித் தீர்ப்பைச் சுட்டுவதால் இச்சொல் தேர்ந்தெடுக்கப்பட்டது.
- source_word: אָשִׁיב נָקָם
  choice: பழிவாங்குவேன்
  rationale: சொல்லுக்கு சொல் ‘பழிவாங்குதலைத் திருப்புவேன்’ என்ற எபிரேயச் சொற்றொடரின் இயல்பான தமிழாக்கம்; தெய்வீக நீதிச் செயலை மென்மைப்படுத்தவில்லை.
- source_word: אֲשַׁלֵּם
  choice: தக்க பதிலளிப்பேன்
  rationale: שלם இங்கு செய்ததற்கேற்ற பிரதிபலனை முழுமையாகச் செலுத்துதல்/திருப்பிச் செய்தல் எனப் பொருள்படும். ‘பதிலளிப்பேன்’ என்பதுடன் ‘தக்க’ சேர்த்து ஈடுசெய்யும் நீதியின் நுணுக்கம் வெளிப்படுத்தப்பட்டது.
theological_decisions:
- issue: தெய்வீக பழிவாங்குதல்
  choice: பழிவாங்குவேன்
  alternative: தண்டிப்பேன்
  rationale: மூலத்தின் נָקָם என்ற வலுவான சொல்லை பொதுவான ‘தண்டனை’ என மென்மைப்படுத்தாமல், நீதித்தீர்ப்பின் பதிலளிக்கும் தன்மையைப் பாதுகாக்கிறது.
- issue: אִם என்பதன் நிபந்தனை அல்லது காலப் பொருள்
  choice: -க்கும்போது
  alternative: என்றால்
  rationale: மூலத்தில் வடிவ ரீதியாக நிபந்தனைத் துகள் இருந்தாலும், இங்கு தேவன் செயலை மேற்கொள்வாரா என்ற ஐயத்தை விட, அவர் அதை மேற்கொள்ளும் தருணத்தையும் தொடர்ந்து வரும் உறுதியான விளைவையும் வலியுறுத்துகிறது.
translation_notes:
  register: நவீன தரத் தமிழ்; மோசேயின் பாடலுக்கேற்ற சுருக்கமான, உயர்ந்த கவிதை நடை. ‘மின்னலைப்போல்’ என்ற இயல்பான உவமை மூலத்தின் ஒளிரும் வாள் உருவகத்தைத் தக்கவைக்கிறது; ‘நீதித்தீர்ப்பு’, ‘பழிவாங்குவேன்’ ஆகியவை உரையின் தீவிரத்தைக் குறைக்காமல் வழங்குகின்றன.
