  yaml_path: translation/ot/deuteronomy/032/017.yaml
  text: They sacrificed to demons[a], not God, to gods they had not known, new ones that had recently come[c][b], whom your fathers had not feared.
translation:
  language: ta
  text: அவர்கள் பேய்களுக்குப் பலியிட்டார்கள், கடவுளுக்கு அல்ல; அவர்கள் அறிந்திராத தெய்வங்களுக்கு—அண்மையில் வந்த புதிய தெய்வங்களுக்கு—உங்கள் தந்தையர் அஞ்சாத தெய்வங்களுக்கு.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘ஒரு தெய்வத்துக்கு அல்ல.’ இவ்வுயிர்கள் உண்மையில் தெய்வங்கள் அல்ல என்று எபிரெயச் சொற்றொடரைப் புரிந்துகொள்ளலாம்; எனினும் சூழல் அவற்றை இஸ்ரவேலின் உண்மையான கடவுளுடன் குறிப்பாக எதிரெதிராக நிறுத்துகிறது.
    reason: lexical_alternative
  - marker: b
    text: 'சொல்லுக்குச் சொல்: ‘புதியவை; அவை அண்மையில் வந்தன.’ அதாவது, அண்மையில் வந்த அல்லது புதிதாக அறிமுகப்படுத்தப்பட்ட தெய்வங்கள்.'
    reason: lexical_alternative
  - marker: c
    text: அல்லது, ‘உங்கள் தந்தையர் அஞ்சி நடுங்காத தெய்வங்களுக்கு.’
    reason: lexical_alternative
lexical_decisions:
- source_word: יִזְבְּחוּ
  choice: பலியிட்டார்கள்
  rationale: זבח என்பதன் பலியிடுதல் அல்லது பலிக்காக அறுத்தல் என்ற வழிபாட்டுச் சார்ந்த பொருளைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: לַשֵּׁדִים
  choice: பேய்களுக்கு
  rationale: שֵׁדִים குறிக்கும் தீய ஆவிக்குரிய உயிர்களை நவீனத் தமிழில் தெளிவாகக் குறிக்கிறது; ஒலிபெயர்ப்பு வாசகருக்குப் பொருளை மறைக்கும்.
- source_word: לֹא אֱלֹהַ
  choice: கடவுளுக்கு அல்ல
  rationale: பலிகள் பேய்களுக்கே செலுத்தப்பட்டன, இஸ்ரவேலின் உண்மையான கடவுளுக்கு அல்ல என்ற எதிர்மறை முரணைப் பாதுகாக்கிறது. எபிரெயச் சொல்லை ‘ஒரு தெய்வத்துக்கு அல்ல’ என்றும் புரிந்துகொள்ள முடியும் என்பதால் மாற்று அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: אֱלֹהִים
  choice: தெய்வங்களுக்கு
  rationale: முந்தைய ‘பேய்கள்’ என்பதையே வேறு பெயரில் சுட்டும் பன்மையைப் பாதுகாத்து, அவை வழிபடப்பட்ட பொய்த் தெய்வங்கள் என்ற வசனத்தின் கருத்தை வெளிப்படுத்துகிறது.
- source_word: לֹא יְדָעוּם
  choice: அவர்கள் அறிந்திராத
  rationale: ידע என்பதன் அடிப்படைப் பொருளான ‘அறிதல்’ என்பதையும், முன்னர் அறிமுகமில்லாத தெய்வங்கள் என்ற பின்னோக்கிய கால உறவையும் இயல்பான தமிழில் தருகிறது.
- source_word: חֲדָשִׁים
  choice: புதிதாக வந்தவற்றுக்கு
  rationale: பெயர்ச்சொல்லாகப் பயன்படும் ‘புதியவை’ என்ற பெயரடையை, முன் வந்த ‘தெய்வங்கள்’ என்பதோடு இணைத்து இயல்பாக மொழிபெயர்க்கிறது.
- source_word: מִקָּרֹב בָּאוּ
  choice: அண்மையில் ... வந்த
  rationale: இடவியல் அருகாமையைவிட அண்மைக்கால வருகையைக் குறிக்கும் சொற்றொடரின் பொருளைத் தெளிவுபடுத்துகிறது.
- source_word: לֹא שְׂעָרוּם
  choice: அஞ்சாதவற்றுக்கு
  rationale: இச்சூழலில் שער/שׂער குறிக்கும் பயத்துடன் கூடிய மதிப்பையோ நடுக்கத்தையோ சுருக்கமாகத் தருகிறது; ‘அஞ்சி நடுங்காத’ என்பது சாத்தியமான விரிவான மாற்று.
- source_word: אֲבֹתֵיכֶם
  choice: உங்கள் தந்தையர்
  rationale: எபிரெய மூலத்தின் ஆண்பால் பன்மையைப் பாதுகாத்து, இஸ்ரவேலின் முற்பிதாக்களைக் குறிக்கிறது.
theological_decisions:
- issue: ‘பேய்கள்’ மற்றும் ‘தெய்வங்கள்’ ஆகியவற்றின் தொடர்பு
  choice: இரு சொற்களையும் அடுத்தடுத்து வைத்து, ஒரே பலியிடுதலின் பெறுநர்களை இருவிதமாகக் குறிப்பிடுதல்
  alternative: ‘தெய்வங்கள்’ என்பதை விளக்கச் சொல்லாக மட்டும் கருதி தமிழில் அதை விடுதல்
  rationale: மூலம் שֵׁדִים மற்றும் אֱלֹהִים இரண்டையும் திட்டமிட்டே பயன்படுத்துகிறது. அவற்றைப் பேய்கள் என்றும் வழிபடப்பட்ட தெய்வங்கள் என்றும் அழைக்கும் இறையியல் பதற்றத்தை மொழிபெயர்ப்பு நீக்கக்கூடாது.
- issue: לֹא אֱלֹהַ என்பதன் குறிப்பு
  choice: ‘கடவுளுக்கு அல்ல’ என்று உண்மையான கடவுளுடனான முரணாக மொழிபெயர்த்தல்
  alternative: ‘ஒரு தெய்வத்துக்கு அல்ல’ அல்லது ‘தெய்வமே அல்லாத’
  rationale: சூழல் இஸ்ரவேலின் கடவுளையும் பலி பெற்ற பொய்த் தெய்வங்களையும் எதிரெதிராக நிறுத்துகிறது. அதேவேளை எபிரெய ஒருமையின் மாற்றுப் புரிதல் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியும் ஆனால் கண்ணியமான வேதாகம நடையில் அமைக்கப்பட்டது. எபிரெயத்தின் தொடர்ச்சியான இணைப்புச் சொற்றொடர்களைத் தக்கவைத்தபோதும், தமிழில் பொருள் தெளிவாக இருக்க இறுதியில் ‘பலியிட்டார்கள்’ மீண்டும் வழங்கப்பட்டுள்ளது. ‘கடவுள்’ உண்மையான ஒரே கடவுளைக் குறிக்கவும், ‘தெய்வங்கள்’ வழிபாட்டுக்குரியவையாகக் கருதப்பட்ட பன்மை உயிர்களைக் குறிக்கவும் வேறுபடுத்தப்பட்டுள்ளது.
