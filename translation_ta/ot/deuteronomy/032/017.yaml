revisions:
- from: அவர்கள் பேய்களுக்குப் பலியிட்டார்கள்; கடவுளுக்கு அல்ல[a]. அவர்கள் அறிந்திராத தெய்வங்களுக்கு, அண்மையில் புதிதாக வந்தவற்றுக்கு[b], உங்கள் தந்தையர் அஞ்சாதவற்றுக்கு[c] பலியிட்டார்கள்.
  to: அவர்கள் பேய்களுக்குப் பலியிட்டார்கள், கடவுளுக்கு அல்ல; அவர்கள் அறிந்திராத தெய்வங்களுக்கு—அண்மையில் வந்த புதிய தெய்வங்களுக்கு—உங்கள் தந்தையர் அஞ்சாத தெய்வங்களுக்கு.[a][b][c]
