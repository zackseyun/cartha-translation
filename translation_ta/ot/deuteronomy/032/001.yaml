source:
  edition: WLC
  text: הַאֲזִ֥ינוּ הַ/שָּׁמַ֖יִם וַ/אֲדַבֵּ֑רָה וְ/תִשְׁמַ֥ע הָ/אָ֖רֶץ אִמְרֵי פִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/001.yaml
  text: Give ear[a], O heavens, and I will speak; and let the earth hear the words of my mouth.
translation:
  language: ta
  text: வானங்களே, செவிகொடுங்கள்[a]; நான் பேசுவேன்; பூமி என் வாயின் வார்த்தைகளைக் கேட்கட்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “வானங்களே, கவனமாகக் கேளுங்கள் … பூமி கேட்கட்டும்.” எபிரெயத்தில் உயர்ந்த கவிதைநடைக்குரிய கட்டளை மற்றும் வேண்டுகோள் வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַאֲזִינוּ
  choice: செவிகொடுங்கள்
  rationale: אזן என்பதன் ஹிஃபில் கட்டளை வடிவம் வெறுமனே கேட்பதை அல்ல, கவனமாய்ச் செவிசாய்ப்பதை அழைக்கிறது. ‘செவிகொடுங்கள்’ உயர்ந்த கவிதைநடையையும் இன்றைய வாசகருக்கான தெளிவையும் காக்கிறது.
- source_word: הַשָּׁמַיִם
  choice: வானங்களே
  rationale: எபிரெயப் பன்மை வடிவத்தையும் நேரடி விளிப்பையும் இயல்பான தமிழில் காக்கிறது; ‘வானமே’ என்று ஒருமைப்படுத்தவில்லை.
- source_word: וַאֲדַבֵּרָה
  choice: நான் பேசுவேன்
  rationale: இது பேசுபவரின் மனவுறுதி அல்லது நோக்கத்தை உணர்த்தும் cohortative வடிவம். ‘நான் பேசுவேன்’ அந்த முன்னோக்குச் செயற்பாட்டையும் கவிதை இணைப்பையும் தெளிவாகக் காட்டுகிறது.
- source_word: וְתִשְׁמַע
  choice: கேட்கட்டும்
  rationale: வடிவில் imperfect/jussive ஆக இருந்தாலும், இங்கு வானங்களுக்கு விடுக்கப்படும் கட்டளைக்கு இணையான விருப்ப அல்லது வேண்டுகோள் வலிமையைக் கொண்டுள்ளது. ‘கேட்கட்டும்’ அதைத் தீர்மானித்து கடுமையான கட்டளையாக மாற்றாமல் காக்கிறது.
- source_word: הָאָרֶץ
  choice: பூமி
  rationale: வானம்–பூமி என்ற பிரபஞ்ச இணைப்பில் ‘நாடு’ என்பதைவிட ‘பூமி’ பொருத்தமானது.
- source_word: אִמְרֵי
  choice: வார்த்தைகள்
  rationale: பேசப்பட்ட கூற்றுகளைக் குறிக்கும் சொல்லுக்கு இயல்பான, கண்ணியமான தமிழ் இணை இது.
- source_word: פִי
  choice: என் வாயின்
  rationale: ‘நான் பேசுவதை’ என்று உரைநடையாக்காமல், ‘என் வாயின் வார்த்தைகள்’ என்ற எபிரெயக் கவிதையின் உருவகத் தெளிவைக் காக்கிறது.
theological_decisions:
- issue: வானம்–பூமிக்கு விடுக்கப்படும் அழைப்பின் பரப்பு
  choice: சாட்சியாகப் பிரபஞ்சத்தையே அழைக்கும் கவிதைமிகு உரை
  alternative: எல்லாக் கேட்போருக்கும் விடுக்கப்படும் வெறும் சொல்லாட்சிசார் அழைப்பு
  rationale: இந்த வசனம் உடன்படிக்கை மற்றும் தீர்க்கதரிசனச் சூழல்களில் காணப்படும் முறைப்படி ‘வானங்களையும்’ ‘பூமியையும்’ மிகுந்த முறையான கவிதை வடிவில் அழைக்கிறது. சாட்சித்தன்மையை விளக்கத்தில் உணர்த்தினாலும், மொழிபெயர்ப்பு மூலத்தைக் கடந்த விளக்கத்தைச் சேர்க்கவில்லை.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘செவிகொடுங்கள்’ கவிதைமிகு அழைப்பைத் தக்கவைக்கிறது; ‘கேட்கட்டும்’ இணையான வேண்டுகோள் வலிமையை இயல்பாக வெளிப்படுத்துகிறது. வானம்–பூமி இணையின் பிரபஞ்சப் பரப்பு மற்றும் எபிரெயப் பன்மை பாதுகாக்கப்பட்டுள்ளன.
