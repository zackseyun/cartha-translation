base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/025.yaml
  text: Outside[a], the sword will bereave; and in the inner rooms, terror—both young man and virgin[b], nursing child together with gray-haired man.
translation:
  language: ta
  text: 'வெளியே வாள் பிள்ளையிழக்கச் செய்யும்;

    உள்ளறைகளில் திகில்—

    இளைஞனையும் கன்னிப் பெண்ணையும்,

    பால்குடிக்கும் குழந்தையையும் நரைமுடியுள்ள முதியவரையும்.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִחוּץ
  choice: வெளியே
  rationale: வீட்டின் உள்ளறைகளுக்கு எதிரான வெளிப்புற இடத்தைக் குறிக்கும் எளிய, இயல்பான சொல்.
- source_word: תְּשַׁכֶּל
  choice: பிள்ளைகளைப் பறிக்கும்
  rationale: שׁכל என்பதன் பியேல் வடிவம் பிள்ளையிழக்கச் செய்தல் அல்லது உறவுகளைப் பறித்தல் என்ற வலிமையான படிமத்தைக் கொண்டது; வாளைச் செயற்பாட்டாளராகவே வைத்திருக்கிறது.
- source_word: חֶרֶב
  choice: வாள்
  rationale: போர் மரணத்தின் உருவகப்படுத்தப்பட்ட கருவியாக வரும் எபிரெயச் சொல்லை நேரடியாகப் பாதுகாக்கிறது.
- source_word: וּמֵחֲדָרִים
  choice: உள்ளறைகளிலோ
  rationale: சொல்லுக்கு நேராக ‘அறைகளிலிருந்து’ என்றாலும், கவிதையின் வெளியே–உள்ளே இடமுரணை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: אֵימָה
  choice: திகில்
  rationale: உள்ளே நிலவும் கடுமையான அச்சத்தையும் கவிதையின் சுருக்கமான தீவிரத்தையும் தெரிவிக்கிறது.
- source_word: גַּם בָּחוּר גַּם בְּתוּלָה
  choice: இளைஞனும் கன்னிப்பெண்ணும்
  rationale: இளம் ஆணையும் திருமணமாகாத இளம் பெண்ணையும் இணையாகக் குறிப்பிடும் மூலச்சொற்களின் வேறுபாட்டைப் பாதுகாக்கிறது.
- source_word: יוֹנֵק
  choice: பால்குடிக்கும் குழந்தை
  rationale: தாய்ப்பால் அருந்தும் ஒருவரைக் குறிக்கும் எபிரெயப் பங்கேற்புவினை வடிவத்தின் தெளிவான படிமத்தைப் பாதுகாக்கிறது.
- source_word: עִם אִישׁ שֵׂיבָה
  choice: நரைத்த முதியவர்
  rationale: முதுமையைக் குறிக்கும் நரைமுடி என்ற மூலத்தின் கண்கூடிய படிமத்தையும் வயதான ஆண் என்ற பொருளையும் இயல்பான தமிழில் தருகிறது.
