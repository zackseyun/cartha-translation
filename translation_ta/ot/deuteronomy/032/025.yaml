translation_notes:
  register: நவீனத் தரத் தமிழில், மோசேயின் பாடலுக்கேற்ற சுருக்கமான கவிதை நடையும் வெளியே–உள்ளே என்ற இடமுரணும் பேணப்பட்டுள்ளன. இறுதி வினைச்சொல் மூலத்தில் வெளிப்படையாக இல்லாவிட்டாலும், பட்டியலிடப்பட்ட அனைவரும் வாளுக்கும் திகிலுக்கும் உட்படுவதைத் தமிழில் தெளிவாக்க ‘அழிவார்கள்’ சேர்க்கப்பட்டுள்ளது.
