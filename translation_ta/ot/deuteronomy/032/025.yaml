  to: 'வெளியே வாள் பிள்ளையிழக்கச் செய்யும்;

    உள்ளறைகளில் திகில்—

    இளைஞனையும் கன்னிப் பெண்ணையும்,

    பால்குடிக்கும் குழந்தையையும் நரைமுடியுள்ள முதியவரையும்.'
  rationale: The revision removes interpretive verbs that are absent from the Hebrew, restores the causative sense of ‘bereave,’ and retains the poetic ellipsis and spatial contrast. The existing lexical footnote remains appropriate and its anchor stays with ‘கன்னிப் பெண்.’
  reviewer_model: gpt-5.6-terra
