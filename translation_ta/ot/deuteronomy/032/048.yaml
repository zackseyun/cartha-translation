base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/048.yaml
  text: And Yahweh spoke to Moses on that very day[a], saying,
translation:
  language: ta
  text: 'அந்த நாளிலேயே யாவே[a] மோசேயிடம் கூறினார்:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் יהוה (YHWH); மரபாக “கர்த்தர்” என்று வழங்கப்படுகிறது. இங்கு “யாவே” என்று வழங்கப்பட்டுள்ளது; “யெகோவா” என்பது மற்றொரு வடிவம்.
    reason: இறைப் பெயரின் எபிரெய வடிவம், மரபுவழி பட்டப் பயன்பாடு, மற்றும் மாற்று வடிவம் ஆகியவற்றைத் துல்லியமாகத் தெரிவிக்கிறது.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: கூறினார்
  rationale: דבר என்பது இங்கு அடுத்த நிகழ்வை முன்னெடுக்கும் பேச்சுவினை. தமிழில் தொடர்ந்து வரும் நேரடிக் கூற்றை இயல்பாக அறிமுகப்படுத்த “கூறினார்” பொருத்தமானது.
- source_word: יְהוָה
  choice: யாவே
  rationale: יהוה என்ற இறைப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், அதன் பரவலாக ஏற்றுக்கொள்ளப்பட்ட ஒலிபெயர்ப்பான “யாவே” என்று வழங்குகிறது.
- source_word: אֶל־מֹשֶׁה
  choice: மோசேயிடம்
  rationale: பேச்சு யாரை நோக்கிச் சொல்லப்பட்டது என்பதைக் குறிக்கும் אֶל என்பதற்கு இயல்பான நவீனத் தமிழ் வடிவம்.
- source_word: בְּעֶצֶם הַיּוֹם הַזֶּה
  choice: அதே நாளில்
  rationale: இந்த எபிரெய மரபுத்தொடர் குறிப்பிட்ட அந்த நாளிலேயே நிகழ்ந்ததை வலியுறுத்துகிறது; சொல்லுக்குச் சொல் “அந்த நாளின் சாரத்தில்” என மொழிபெயர்ப்பது பொருளை மறைக்கும்.
- source_word: לֵאמֹר
  choice: ':'
  rationale: இந்த எபிரெயப் பேச்சு அறிமுக வாய்பாடு அடுத்த வசனத்தில் வரும் நேரடிக் கூற்றைத் தொடங்குகிறது. தமிழில் “கூறினார்:” என்பதே அதன் செயல்பாட்டை இயல்பாகவும் சுருக்கமாகவும் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலத்தில் பட்டமல்ல, நான்கு எபிரெய மெய்யெழுத்துகளைக் கொண்ட தனிப்பெயர் உள்ளது. அதன் ஒலிப்பு முற்றிலும் உறுதியானதல்ல என்பதைக் குறிப்பில் தெரிவித்து, பெயர்த் தன்மையைப் பாதுகாக்க “யாவே” பயன்படுத்தப்பட்டது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டது. எபிரெயத்தின் இரட்டை பேச்சுவாய்பாடான “பேசினார்—சொல்லும்படி” என்பதைத் தமிழில் இயல்பான “கூறினார்:” என ஒருங்கிணைத்துள்ளது; “அதே நாளில்” என்பது நேரத்தின் வலியுறுத்தலைத் தக்கவைக்கிறது.
