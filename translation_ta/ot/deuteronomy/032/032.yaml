  text: כִּֽי מִ/גֶּ֤פֶן סְדֹם֙ גַּפְנָ֔/ם וּ/מִ/שַּׁדְמֹ֖ת עֲמֹרָ֑ה עֲנָבֵ֨/מוֹ֙ עִנְּבֵי ר֔וֹשׁ אַשְׁכְּלֹ֥ת מְרֹרֹ֖ת לָֽ/מוֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/032.yaml
  text: For their vine is from the vine of Sodom, and from the fields of Gomorrah; their grapes are grapes of poison, their clusters are bitter to them.
translation:
  language: ta
  text: 'ஏனெனில், அவர்களுடைய திராட்சைக்கொடி

    சோதோமின் திராட்சைக்கொடியிலிருந்தும்,

    கொமோராவின் வயல்களிலிருந்தும் உண்டானது;

    அவர்களுடைய திராட்சைகள் நஞ்சுத் திராட்சைகள்;

    அவர்களுடைய திராட்சைக்குலைகள் அவர்களுக்குக் கசப்பானவை.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: גֶּפֶן / גַּפְנָם
  choice: திராட்சைக்கொடி / அவர்களுடைய திராட்சைக்கொடி
  rationale: மூலத்தின் கொடி உருவகத்தையும் உடைமைப் பின்னொட்டையும் தெளிவாகத் தக்கவைக்கிறது.
- source_word: שַׁדְמוֹת
  choice: வயல்கள்
  rationale: பயிரிடப்பட்ட நிலப்பரப்புகளைக் குறிக்கும் எபிரேயச் சொல்லுக்கான இயல்பான நவீனத் தமிழ்.
- source_word: עִנְּבֵי רוֹשׁ
  choice: நஞ்சுப் பழங்கள்
  rationale: רֹאשׁ என்பது இங்கு நஞ்சான அல்லது நச்சுத்தன்மையுள்ள செடியைச் சுட்டுகிறது; 'நஞ்சு' உருவகத்தின் அழிவூட்டும் தன்மையை நேரடியாக வெளிப்படுத்துகிறது.
- source_word: אַשְׁכְּלוֹת מְרֹרֹת לָמוֹ
  choice: அவர்களுடைய திராட்சைக்குலைகள் அவர்களுக்குக் கசப்பானவை
  rationale: லָמוֹ என்ற 'அவர்களுக்கு' பொருளை விடாமல் காத்து, முந்தைய அடியுடனான இணை அமைப்பையும் பேணுகிறது.
theological_decisions:
- issue: சோதோம், கொமோராவிலிருந்து வந்த கொடி என்ற உருவகம்
  choice: உருவகத்தை அப்படியே தக்கவைத்தல்
  alternative: அவர்களின் தீமை சோதோம், கொமோராவின் தீமையைப் போன்றது என்று விளக்கமாக மொழிபெயர்த்தல்
  rationale: மூலம் நேரடியான விளக்கத்தை அல்ல, வம்சமூலத்தைப் போன்ற தீவிரமான கவித்துவ உருவகத்தைப் பயன்படுத்துகிறது; அதன் இறையியல் தாக்கத்தை மொழிபெயர்ப்பில் தீர்த்து வைக்கக் கூடாது.
- issue: לָמוֹ என்பதன் வெளிப்பாடு
  choice: அவர்களுக்குக் கசப்பானவை
  alternative: கசப்பானவை
  rationale: மசோரெட்டிக் உரையில் உள்ள மறைமுகப் பன்மைப் பெயர்ச்சுட்டை வெளிப்படையாகப் பாதுகாக்கிறது; அதன் துல்லியமான உறவைக் கூடுதலாக விளக்கவில்லை.
translation_notes:
  register: மோசேயின் பாடலுக்கேற்ற கவித்துவ இணை அமைப்பு நான்கு அடிகளாகப் பேணப்பட்டுள்ளது. மொழிநடை நவீனமும் கண்ணியமானதும்; பொதுவாசகருக்குப் புரியும் சொற்கள் பயன்படுத்தப்பட்டுள்ளன.
