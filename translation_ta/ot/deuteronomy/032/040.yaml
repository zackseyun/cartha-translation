  text: כִּֽי אֶשָּׂ֥א אֶל שָׁמַ֖יִם יָדִ֑/י וְ/אָמַ֕רְתִּי חַ֥י אָנֹכִ֖י לְ/עֹלָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/040.yaml
  text: For I lift up my hand to heaven and say[a], ‘As I live forever,’
translation:
  language: ta
  text: ஏனெனில், நான் என் கையை வானத்தை நோக்கி உயர்த்தி, ‘நான் என்றென்றும் உயிரோடிருக்கிறேன்’ என்று ஆணையிட்டுக் கூறுகிறேன்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'இன்னும் சொற்படியான மொழிபெயர்ப்பு: “நான் என் கையை வானத்தை நோக்கி உயர்த்தி, ‘நான் என்றென்றும் உயிரோடிருக்கிறேன்’ என்று கூறுகிறேன்.” கை உயர்த்தும் சூழலில், எபிரெயச் சொற்றொடர் தன்னாணையின் வலிமையைக் கொண்டுள்ளது.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய அறிவிப்புக்கான அடிப்படையை அறிமுகப்படுத்துகிறது; பாடலின் உரைத்தொடர்பை இயல்பாகக் காக்கிறது.
- source_word: אֶשָּׂא
  choice: உயர்த்தி
  rationale: נשׂא என்ற வினையின் நேரடிப் பொருளையும், ஆணையிடும்போது கையை உயர்த்தும் சைகையையும் காக்கிறது.
- source_word: אֶל שָׁמַיִם
  choice: வானத்தை நோக்கி
  rationale: மேல்நோக்கிய திசையை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது; எபிரெய வடிவத்தின் இலக்கணப் பன்மையைச் செயற்கையாகப் பிரதிபலிக்கவில்லை.
- source_word: יָדִי
  choice: என் கையை
  rationale: மூலத்தில் உள்ள ஒருமையையும் உடல்சார்ந்த ஆணைச் சைகையையும் நேரடியாகக் காக்கிறது.
- source_word: וְאָמַרְתִּי
  choice: என்று கூறுகிறேன்
  rationale: வாவ் + கத்தால் வடிவம் இச்சூழலில் முந்தைய செயலைத் தொடரும் உறுதிமொழிசார் உரையாகச் செயல்படுகிறது; நிகழ்காலத் தமிழ் அதன் நிகழ்த்துரைப் பலத்தை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: חַי אָנֹכִי
  choice: நான் உயிரோடிருப்பது உறுதிபோல
  rationale: இது வெறும் உயிர்நிலை அறிவிப்பு அல்ல, தன்னையே சாட்சியாகக் கொண்ட ஆணைச் சூத்திரம்; ‘உறுதிபோல’ என்பது மூலத்தில் இல்லாத புதிய உறுதிப்படுத்தும் சொல்லைச் சேர்க்காமல் அதன் சொற்றொடரியல் வலிமையைத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: לְעֹלָם
  choice: என்றென்றும்
  rationale: நீடித்த, முடிவில்லாத காலத்தை எளிய, உயர்ந்த நவீனத் தமிழில் தெரிவிக்கிறது.
theological_decisions:
- issue: தெய்வீகத் தன்னாணையின் வலிமையையும் நேரடிப் பொருளையும் ஒருங்கே காப்பது
  choice: ‘நான் என்றென்றும் உயிரோடிருப்பது உறுதிபோல’
  alternative: ‘நான் என்றென்றும் உயிரோடிருக்கிறேன்’
  rationale: எபிரெயம் சொற்படியாக உயிர்நிலையை அறிவித்தாலும், கை உயர்த்தும் சூழலில் அது ஆணைச் சூத்திரமாக உள்ளது. தேர்ந்த வடிவம் எந்த மேலதிக கோட்பாட்டுச் சொல்லையும் சேர்க்காமல் அந்த ஆணை வலிமையை வெளிப்படுத்துகிறது; அடிக்குறிப்பு சொற்படியான மாற்றை வழங்குகிறது.
translation_notes:
  register: இயல்பான, நவீன, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘வானத்தை நோக்கி கையை உயர்த்துதல்’ என்ற தெளிவான சைகை காக்கப்பட்டு, நேரடி உரையில் உள்ள தெய்வீகத் தன்னாணையின் தன்மை மிகைவிளக்கமின்றி வெளிப்படுத்தப்பட்டுள்ளது.
