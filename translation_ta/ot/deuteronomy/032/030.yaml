source:
  edition: WLC
  text: אֵיכָ֞ה יִרְדֹּ֤ף אֶחָד֙ אֶ֔לֶף וּ/שְׁנַ֖יִם יָנִ֣יסוּ רְבָבָ֑ה אִם לֹא֙ כִּי צוּרָ֣/ם מְכָרָ֔/ם וַֽ/יהוָ֖ה הִסְגִּירָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/030.yaml
  text: How could one pursue a thousand[a], and two put ten thousand to flight, unless their Rock had sold them, and Yahweh had given them up?
translation:
  language: ta
  text: 'அவர்களுடைய பாறை அவர்களை விற்று,

    யாவே அவர்களை ஒப்படைத்திருந்தாலன்றி[a],

    ஒருவன் ஆயிரம் பேரைத் துரத்தவும்,

    இருவர் பத்தாயிரம் பேரை ஓடச்செய்யவும் எப்படி முடியும்?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்களை கையளித்திருந்தாலன்றி.”
    reason: הִסְגִּירָם என்பது ஒருவரை மற்றொருவரின் அதிகாரத்திற்குள் ஒப்படைத்தல் அல்லது கையளித்தல் என்றும் மொழிபெயர்க்கப்படலாம்.
lexical_decisions:
- source_word: אֵיכָה
  choice: எப்படி முடியும்?
  rationale: வியப்பையும் நம்பமுடியாத நிலையைச் சுட்டும் வினாவையும் இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: יִרְדֹּף
  choice: துரத்தவும்
  rationale: போர்ச் சூழலில் רדף என்பதன் ‘பின்தொடர்ந்து துரத்து’ என்ற பொருளைச் சுருக்கமாகத் தருகிறது.
- source_word: אֶחָד אֶלֶף
  choice: ஒருவன் ஆயிரம் பேரை
  rationale: ஒருவருக்கும் ஆயிரம் பேருக்கும் இடையிலான திட்டமிட்ட எண்ணியல் முரண்பாட்டை மாற்றமின்றிக் காக்கிறது.
- source_word: יָנִיסוּ
  choice: ஓடச்செய்யவும்
  rationale: נוּס என்பதன் ஹிஃபில் வடிவிலுள்ள காரணவினைப் பொருளைத் தெளிவாகக் காக்கிறது.
- source_word: רְבָבָה
  choice: பத்தாயிரம் பேரை
  rationale: இங்கு எண்ணாகிய பத்தாயிரமே சூழலுக்குப் பொருத்தமான நேரடிப் பொருள்.
- source_word: אִם לֹא כִּי
  choice: …இருந்தாலன்றி
  rationale: இந்த அசாதாரண வெற்றிக்கான ஒரே விளக்கத்தை முன்வைக்கும் விலக்குநிலைப் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: צוּרָם
  choice: அவர்களுடைய பாறை
  rationale: உபாகமம் 32-இல் தேவனைக் குறிக்கும் உருவகப் பட்டத்தை விளக்கவுரையாக்காமல் அப்படியே காக்கிறது; தமிழில் பெரிய எழுத்து வேறுபாடு இல்லாததால் சூழலே பட்டத்தன்மையை உணர்த்துகிறது.
- source_word: מְכָרָם
  choice: அவர்களை விற்றுவிட்டிருந்தாலன்றி
  rationale: உடன்படிக்கைத் தீர்ப்பில் மக்களை எதிரியின் அதிகாரத்திற்குக் கையளிப்பதைச் சித்தரிக்கும் ‘விற்றல்’ உருவகத்தை நேரடியாகக் காக்கிறது.
- source_word: וַיהוָה
  choice: யாவே
  rationale: எபிரெய மெய்யெழுத்துப் பெயரான יהוה-ஐ பட்டப்பெயராக மாற்றாமல், நவீனத் தமிழில் உச்சரிக்க ஏற்ற வடிவில் தருகிறது.
- source_word: הִסְגִּירָם
  choice: அவர்களை ஒப்படைத்திருந்தாலன்றி
  rationale: ஒருவரின் அதிகாரத்திற்குள் கையளித்தல் என்ற காரணவினைப் பொருளை இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூலத்தில் பொதுப் பட்டப்பெயர் அல்ல, உடன்படிக்கைப் பெயரே நேரடியாக உள்ளது; ஆகவே அதைத் தமிழில் ஒலிபெயர்த்துக் காக்கிறது.
- issue: צוּר என்பதைத் தெய்வீக உருவகப் பட்டமாகப் புரிந்துகொள்ளுதல்
  choice: அவர்களுடைய பாறை
  alternative: அவர்களுடைய பாதுகாவலர்
  rationale: மோசேயின் பாடல் முழுவதிலும் வரும் ‘பாறை’ உருவகத்தை விளக்கச் சொல்லால் மாற்றாமல் காக்கிறது; அது நிலைத்தன்மை, பாதுகாப்பு, தேவனைச் சார்ந்திருத்தல் ஆகிய தொடர்புகளை வாசகருக்குத் திறந்தவையாக வைக்கிறது.
- issue: מכר மற்றும் סגר ஆகிய இணையான தீர்ப்புச் சொற்களின் வேறுபாடு
  choice: விற்றுவிட்டார் / ஒப்படைத்தார் என்ற இரு உருவகங்களையும் தனித்தனியாகக் காத்தல்
  alternative: இரண்டையும் ‘கைவிட்டார்’ என்று ஒரே சொல்லால் மொழிபெயர்த்தல்
  rationale: எபிரெயக் கவிதையின் இணைநிலையைக் காத்தாலும், இரண்டு வினைகளின் தனித்துவமான படிமங்களையும் அழிக்காமல் வைக்கிறது.
translation_notes:
  register: நவீன, மரியாதைமிக்க, பொதுவாசகருக்கு எளிதில் புரியும் தமிழ்நடை பயன்படுத்தப்பட்டுள்ளது. எபிரெயக் கவிதையின் எண்ணியல் இணைநிலையும் ‘பாறை’ மற்றும் ‘விற்றல்’ உருவகங்களும் காக்கப்பட்டுள்ளன. இயல்பான தமிழ்வினா அமைப்புக்காக காரண நிபந்தனை முதலில் வைக்கப்பட்டுள்ளது.
