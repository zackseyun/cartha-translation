base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/052.yaml
  text: For you shall see the land from a distance[a], but you shall not go there[b], into the land that I am giving to the sons of Israel.
translation:
  language: ta
  text: ஏனெனில், நீ அந்த நாட்டைத் தொலைவிலிருந்து[a] காண்பாய்; அங்கே, நான் இஸ்ரவேலின் மகன்களுக்குக்[b] கொடுக்கிற அந்த நாட்டுக்குள் நீ செல்லமாட்டாய்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “எதிரே இருந்து” அல்லது “தொலைவில் இருந்து” என்றும் மொழிபெயர்க்கலாம். மோசே நாட்டிற்குள் செல்லாமல் அதை எதிரிலிருந்து பார்ப்பார் என்பதே எபிரெயச் சொற்றொடரின் கருத்து.
    reason: lexical_alternative
  - marker: b
    text: எபிரெய மொழியில் நேரடியாக “இஸ்ரவேலின் மகன்கள்” என்று உள்ளது. இது முழு இஸ்ரவேல் மக்களையும் குறிக்கும் மரபான பெயர்; “இஸ்ரவேல் மக்கள்” அல்லது “இஸ்ரவேலர்கள்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய கூற்றிற்கான காரணத்தை அல்லது விளக்கத்தை அறிமுகப்படுத்தும் இணைப்பாக இங்கு வருகிறது.
- source_word: מִנֶּגֶד
  choice: தொலைவிலிருந்து
  rationale: எதிரே நின்று அல்லது சற்றுத் தொலைவிலிருந்து பார்ப்பதைக் குறிக்கும் எபிரெய வெளிப்பாட்டை இயல்பான நவீன தமிழில் தருகிறது; மோசே நாட்டைப் பார்ப்பார், ஆனால் அதற்குள் செல்லமாட்டார் என்ற வேறுபாட்டையும் தெளிவாக்குகிறது.
- source_word: תִּרְאֶה
  choice: காண்பாய்
  rationale: இச்சூழலில் இரண்டாம் நபர் ஆண்பால் ஒருமை imperfect வடிவம் வருங்காலத்தை அறிவிக்கும் இறைத் தீர்ப்பாக உள்ளது.
- source_word: הָאָרֶץ
  choice: அந்த நாடு
  rationale: இங்கு குறிப்பிட்ட வாக்குத்தத்த நாட்டைக் குறிக்கிறது; தமிழ் சூழலில் குறிப்புத்தன்மையை ‘அந்த’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וְשָׁמָּה לֹא תָבֹא
  choice: ஆனால் அங்கே … நீ செல்லமாட்டாய்
  rationale: שָׁמָּה என்பதன் இடத்தையும் இலக்கையும் ‘அங்கே’ எனப் பாதுகாத்து, בוא என்பதன் ‘செல்/வா/நுழை’ என்ற இயக்கப் பொருளை இயல்பான தமிழில் ‘செல்லமாட்டாய்’ எனத் தருகிறது.
- source_word: אֲשֶׁר אֲנִי נֹתֵן
  choice: நான் … கொடுக்கிற
  rationale: נֹתֵן என்ற நிகழ்காலப் பங்கேற்பு வடிவத்தின் நடைபெறும் அல்லது உடனடியாக நிறைவேறும் கொடுக்கும் செயலைப் பாதுகாக்கிறது.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் மகன்களுக்கு
  rationale: בְנֵי என்பதன் ஆண்பால் பன்மை வடிவத்தை மறைக்காமல் மொழிபெயர்க்கிறது; இது இச்சூழலில் இஸ்ரவேல் உடன்படிக்கை மக்களைக் குறிக்கும் மரபான தேசியப் பெயர் என்பதை அடிக்குறிப்பு விளக்குகிறது.
theological_decisions:
- issue: בְנֵי יִשְׂרָאֵל என்ற பாலினம் குறிக்கப்பட்ட உடன்படிக்கைச் சொற்றொடர்
  choice: இஸ்ரவேலின் மகன்கள்
  alternative: இஸ்ரவேல் மக்கள் / இஸ்ரவேலர்கள்
  rationale: மூலத்தின் ஆண்பால் பன்மையை உரையில் தக்கவைத்துள்ளோம்; அதே நேரத்தில் இதன் குறிப்பு ஆண்களுக்கு மட்டும் அல்ல, முழு இஸ்ரவேல் மக்களுக்கும் உரியது என்பதை அடிக்குறிப்பில் தெளிவுபடுத்துகிறோம்.
translation_notes:
  register: நவீன, கண்ணியமான, பொதுவாசகர்களுக்கு எளிதில் புரியும் தமிழ் பயன்படுத்தப்பட்டுள்ளது. மூலத்தில் உள்ள ‘அங்கே … அந்த நாட்டுக்குள்’ என்ற வலியுறுத்தலை இடைக்கோடுகள் மூலம் இயல்பாகப் பாதுகாத்துள்ளோம்.
