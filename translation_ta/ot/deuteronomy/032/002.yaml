translation_notes:
  register: நவீன தரத் தமிழில், வாசிக்க எளிதானதாயினும் கவிதைநயமும் கண்ணியமும் கொண்ட நடை பயன்படுத்தப்பட்டுள்ளது. எபிரெயக் கவிதையின் இரட்டை இணை அமைப்பும், பனித்துளி மற்றும் தூறலிலிருந்து பெருமழைக்குச் செல்லும் மழைப் படிமமும் பாதுகாக்கப்பட்டுள்ளன.
