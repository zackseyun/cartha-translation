base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/002.yaml
  text: May my teaching fall like the rain[a]; may my speech drip like the dew, like showers upon the tender grass[b], and like abundant rain upon the green plants.
translation:
  language: ta
  text: 'என் போதனை மழையைப்போல் பொழியட்டும்[a];

    என் உரை பனித்துளியைப்போல் துளிக்கட்டும்;

    இளம்புல்மேல் பெய்யும் தூறலைப்போல்[b],

    செடிகள்மேல் பொழியும் பெருமழையைப்போல்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “துளிதுளியாக இறங்கட்டும்”; எபிரெய வினை, போதனை மழையைப்போல் கீழிறங்குவதைச் சித்தரிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: “தூறல்” என மொழிபெயர்க்கப்பட்டுள்ள அரிதான எபிரெயச் சொல், மென்மழையையோ மழைத்துளிகளையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעֲרֹף
  choice: பொழியட்டும்
  rationale: மழை துளிகளாகக் கீழிறங்கும் படிமத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது; ‘வடிக்கட்டும்’ போன்ற சொற்கள் இங்கு செயற்கையாக ஒலிக்கும்.
- source_word: לִקְחִי
  choice: என் போதனை
  rationale: பெறப்படும் அல்லது வழங்கப்படும் அறிவுரையையும் போதனையையும் குறிக்கும் இச்சொல், மோசேயின் உரை என்ற சூழலில் ‘என் போதனை’ என்று இயல்பாக அமைகிறது.
- source_word: תִּזַּל
  choice: துளிக்கட்டும்
  rationale: சொட்டுதல் அல்லது வழிதலைக் குறிக்கும் வினை; பனித்துளி என்ற ஒப்புமையுடன் ‘துளிக்கட்டும்’ மென்மையான நீர்த்துளிப் படிமத்தைப் பாதுகாக்கிறது.
- source_word: אִמְרָתִי
  choice: என் உரை
  rationale: ஒரே தனிச்சொல்லைவிடப் பேசப்பட்ட கருத்தை விரிவாகக் குறிக்கிறது; ‘என் போதனை’ என்பதுடன் கவிதை இணையாகவும் அமைகிறது.
- source_word: שְׂעִירִם
  choice: தூறல்
  rationale: அரிதான எபிரெயச் சொல் இச்சூழலில் மென்மழையையோ மழைத்துளிகளையோ குறிக்கலாம்; ‘தூறல்’ தெளிவான, இயல்பான தமிழ்ச் சொல்.
- source_word: דֶשֶׁא
  choice: இளம்புல்
  rationale: புதிதாக முளைத்த புல் அல்லது மென்மையான பசுந்தழையைக் குறிக்கும் வேறுபாட்டைச் சுருக்கமாகக் காக்கிறது.
- source_word: רְבִיבִים
  choice: பெருமழை
  rationale: மிகுதியாகப் பெய்யும் மழைப்பொழிவைக் குறிக்கிறது; முந்தைய மென்மையான தூறலிலிருந்து அதிகமான மழைக்குச் செல்லும் கவிதை முன்னேற்றத்தையும் காட்டுகிறது.
- source_word: עֵשֶׂב
  choice: செடிகள்
  rationale: புல்லை மட்டும் அல்லாமல் தழை மற்றும் பலவகைத் தாவரங்களையும் குறிக்கும் பரந்த சொல்லாக இருப்பதால், முன் வரும் ‘இளம்புல்’ என்பதிலிருந்து இதை வேறுபடுத்துகிறது.
