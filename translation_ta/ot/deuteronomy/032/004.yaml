  text: הַ/צּוּר֙ תָּמִ֣ים פָּעֳל֔/וֹ כִּ֥י כָל דְּרָכָ֖י/ו מִשְׁפָּ֑ט אֵ֤ל אֱמוּנָה֙ וְ/אֵ֣ין עָ֔וֶל צַדִּ֥יק וְ/יָשָׁ֖ר הֽוּא־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/004.yaml
  text: The Rock—his work is perfect[a], for all his ways are justice. He is a God of faithfulness and without injustice[c][b], righteous and upright is he.
translation:
  language: ta
  text: கன்மலை—அவருடைய செயல் குறையற்றது; ஏனெனில் அவருடைய வழிகள் அனைத்தும் நீதியானவை.[a] அவர் நம்பத்தகுந்த கடவுள்,[b] அவரிடம் அநீதி இல்லை;[c] அவர் நீதியுள்ளவரும் நேர்மையானவருமாய் இருக்கிறார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவருடைய வழிகள் அனைத்தும் நீதியே.” எபிரெயச் சொல் நீதி, நியாயத்தீர்ப்பு, அல்லது சட்டப்படி சரியானது என்பவற்றைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “நம்பத்தகுந்த கடவுள்” என்பதை “விசுவாசமுள்ள கடவுள்” அல்லது “உண்மையுள்ள கடவுள்” என்றும் புரிந்துகொள்ளலாம்; இச்சூழலில் “சத்தியத்தின் கடவுள்” என்பது சாத்தியமாயினும் குறைவான வாய்ப்புடையது.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, “அவரில் எந்தத் தவறும் இல்லை” / “அவரிடம் அக்கிரமம் இல்லை.” எபிரெயச் சொல் ஒழுக்கக்கேடு, அநீதி, அல்லது அக்கிரமம் ஆகிய பொருள்களை உள்ளடக்குகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַצּוּר
  choice: கன்மலையானவர்
  rationale: இங்கு צוּר என்பது மோசேயின் பாடலில் கடவுளைக் குறிக்கும் உருவகப் பட்டம். ‘கன்மலையானவர்’ என்பது உருவகத்தையும் ஆளைக் குறிக்கும் பட்டத் தன்மையையும் இயல்பான தமிழில் காக்கிறது.
- source_word: תָּמִים
  choice: குறையற்றது
  rationale: கடவுளுடைய செயலின் முழுமையையும் பழுதின்மையையும் குறிக்கிறது; நவீன தமிழில் இயல்பாகவும் கவித்துவச் செறிவுடனும் உள்ளது.
- source_word: פָּעֳלוֹ
  choice: அவருடைய செயல்
  rationale: ஒருமை பெயர்ச்சொல்லைத் தக்கவைத்து, கடவுள் செய்வதனைத் தொகுத்துக் குறிக்கும் எபிரெயப் பயன்பாட்டைப் பிரதிபலிக்கிறது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்திய கூற்றுக்கான காரணத்தை அறிமுகப்படுத்தும் இணைப்பைத் தெளிவாகக் காட்டுகிறது.
- source_word: כָל־דְּרָכָיו
  choice: அவருடைய வழிகள் அனைத்தும்
  rationale: கடவுளுடைய செயல்முறைகளையும் நடத்தையையும் குறிக்கும் ‘வழிகள்’ என்ற உருவகத்தைத் தக்கவைக்கிறது.
- source_word: מִשְׁפָּט
  choice: நீதியானவை
  rationale: இங்கு பயனிலையாக வந்து, கடவுளுடைய எல்லா வழிகளும் நீதிக்கு ஏற்ப இருப்பதை இயல்பான தமிழில் தெரிவிக்கிறது; ‘நியாயத்தீர்ப்பு’ என்ற மாற்றுப் பொருளும் அடிக்குறிப்பில் காக்கப்படுகிறது.
- source_word: אֵל
  choice: கடவுள்
  rationale: இஸ்ரவேலின் கடவுளைக் குறிக்கும் இயல்பான நவீனத் தமிழ் சொல்.
- source_word: אֱמוּנָה
  choice: உண்மைத்தன்மையுள்ள
  rationale: இச்சூழலில் நம்பத்தகுந்த தன்மை, மாறாத நேர்மை, விசுவாசத்தன்மை ஆகியவற்றைக் குறிக்கிறது; வெறும் கருத்துசார் ‘உண்மை’ என்று சுருக்காமல் பண்பை வெளிப்படுத்துகிறது.
- source_word: וְאֵין עָוֶל
  choice: அவரிடம் அநீதி இல்லை
  rationale: கடவுளில் ஒழுக்கக் கேடும் அநீதியும் இல்லை என்ற மறுப்பைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: צַדִּיק
  choice: நீதியுள்ளவர்
  rationale: கடவுளின் ஒழுக்க மற்றும் நீதிசார் பண்பைக் குறிக்கும் நேரடியான தமிழ் இணை.
- source_word: וְיָשָׁר
  choice: நேர்மையானவர்
  rationale: ஒழுக்க நேர்மையையும் கோணலின்மையையும் நவீன தமிழில் இயல்பாகத் தெரிவிக்கிறது.
- source_word: הוּא
  choice: அவர் ... இருக்கிறார்
  rationale: எபிரெயத்தில் இறுதியில் வரும் வலியுறுத்தலைத் தமிழ் வாக்கிய அமைப்பில் இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: הַצּוּר என்பதன் இறைப்பட்ட உருவகம்
  choice: கன்மலையானவர்
  alternative: கன்மலை
  rationale: இது கடவுளுக்கான உருவகப் பட்டம் என்பதைத் தெளிவாக்குகிறது; அதேவேளை உருவகத்தை விளக்கவுரையாக மாற்றாமல் அப்படியே காக்கிறது.
- issue: אֱמוּנָה என்ற இறைப் பண்பு
  choice: உண்மைத்தன்மையுள்ள
  alternative: விசுவாசமுள்ள / உண்மையுள்ள
  rationale: கடவுளின் நம்பகத்தன்மை மற்றும் மாறாத நேர்மையை முன்னிறுத்துகிறது; ‘உண்மை’ என்ற கருத்துப் பொருளுக்கு மட்டும் இதைச் சுருக்கவில்லை.
- issue: מִשְׁפָּט என்பதன் நீதிசார் பொருள்
  choice: நீதியானவை
  alternative: நியாயத்தீர்ப்புகளாகும்
  rationale: கடவுளுடைய வழிகள் அனைத்தும் நீதிக்கு ஏற்ப உள்ளன என்ற இச்சூழலின் பயனிலைப் பொருளை இயல்பாகத் தருகிறது; நீதித்தீர்ப்பு என்ற சொற்பொருள் அடிக்குறிப்பில் விடப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியும் ஆனால் கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய இணைமொழி அமைப்பும் இறைப் பட்ட உருவகமும் காக்கப்பட்டுள்ளன; தெளிவுக்காக பாலின மரியாதை ஒருமையான ‘அவர்’ பயன்படுத்தப்பட்டுள்ளது.
