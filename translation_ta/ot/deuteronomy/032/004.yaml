  rationale: திருத்தம் மூலத்தின் உருவகத்தையும் இணைநடை அமைப்பையும் காக்கிறது. “கன்மலை” இறைப் பட்டத்தை அதிக விளக்கமின்றி நேரடியாகத் தருகிறது. “நம்பத்தகுந்த” என்பது אֱמוּנָה-வின் நம்பகத்தன்மை/விசுவாசத்தன்மை உணர்வை நவீன தமிழில் தெளிவாக வெளிப்படுத்துகிறது. அடிக்குறிப்பு a ஒருமை மூலச் சொல்லோடு ஒழுங்குபடுத்தப்பட்டுள்ளது.
