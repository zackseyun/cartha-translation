- from: கன்மலையானவர்—அவருடைய செயல் குறையற்றது; ஏனெனில் அவருடைய வழிகள் அனைத்தும் நீதியானவை.[a] அவர் உண்மைத்தன்மையுள்ள கடவுள்,[b] அவரிடம் அநீதி இல்லை;[c] அவர் நீதியுள்ளவரும் நேர்மையானவருமாய் இருக்கிறார்.
