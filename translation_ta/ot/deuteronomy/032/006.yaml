  source_fidelity: திருத்தம் தேவை. மூலத்தில் உள்ள יְהוָה பெயருக்கு ஆங்கில POB நடைமுறையோடு ஒத்த ‘யாவே’ பயன்படுத்தப்பட வேண்டும்; ‘யெகோவா’ என்பது வேறுபட்ட மரபுவழி வடிவம். மேலும், எபிரெயில் கூட்டுப் பெயருக்கு இலக்கண ஒருமை இணைந்திருந்தாலும், தமிழில் ‘மக்களே’ என்பதோடு ‘உன்/உன்னை’ கலப்பது இயல்பற்றது. பன்மை முகவரியைத் தொடர்ந்து பயன்படுத்துவது பொருளை மாற்றாது. קָּנֶךָ-வின் ‘acquire/possess’ நுணுக்கத்தை முதன்மை உரையில் தக்கவைத்து, படைத்தல்/வாங்குதல் மாற்றுப்பொருள்களை அடிக்குறிப்பில் வைக்கலாம்.
  naturalness: ‘உன்னைத் தனக்குரியவனாக்கியவர்’ என்ற ஒருமை ஆண்பால் வடிவம், முன்னுள்ள ‘மக்களே’ என்பதுடன் பொருந்தவில்லை. ‘உங்களைத் தனதாக்கிக்கொண்டவர்’ நவீன நிலையான தமிழில் இயல்பாகவும் சுருக்கமாகவும் உள்ளது. வினாவை ‘செய்கிறீர்களா?’ என அமைப்பது கண்டனமிக்க வினாவைத் தெளிவாகக் காட்டுகிறது.
  terminology: ‘யாவே’ என்பது வழங்கப்பட்ட ஆங்கில audit trail-இன் Yahweh-க்கு ஒத்த ஒலிபெயர்ப்பு. נָבָל-இன் ஒழுக்கவியல் மதியீனத் தன்மையை ‘மதிகேடான’ வெளிப்படுத்துகிறது; ‘ஞானமற்ற’ லֹא חָכָם-ஐ நேரடியாகத் தருகிறது. ‘தனதாக்கிக்கொண்டவர்’ கנה-வின் பெறுதல்/உரிமையாக்குதல் கருத்தை, அடுத்துள்ள ‘உண்டாக்கி’ என்பதிலிருந்து வேறுபடுத்துகிறது.
