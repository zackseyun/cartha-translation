source:
  edition: WLC
  text: הֲ לַ/יְהוָה֙ תִּגְמְלוּ זֹ֔את עַ֥ם נָבָ֖ל וְ/לֹ֣א חָכָ֑ם הֲ/לוֹא הוּא֙ אָבִ֣י/ךָ קָּנֶ֔/ךָ ה֥וּא עָֽשְׂ/ךָ֖ וַֽ/יְכֹנְנֶֽ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/006.yaml
  text: Is this how you repay Yahweh[a], O foolish and unwise people? Is he not your Father, who created you? He made you and established you.
translation:
  language: ta
  text: மதிகேடான, ஞானமற்ற மக்களே, யாவேக்கு நீங்கள் இவ்வாறு கைம்மாறு செய்கிறீர்களா? உங்களைத் தனதாக்கிக்கொண்ட உங்கள் தந்தை அவர் அல்லவா?[a] அவரே உங்களை உண்டாக்கி நிலைநிறுத்தினார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உங்களைப் படைத்தவர்” அல்லது “உங்களை வாங்கியவர்.” இங்குள்ள எபிரெய வினைச்சொல் பெறுதல், உடைமையாக்குதல், வாங்குதல் அல்லது சில சூழல்களில் படைத்தல் என்று பொருள்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּגְמְלוּ
  choice: கைம்மாறு செய்கிறீர்கள்
  rationale: גמל என்பது ஒருவருடைய செயலுக்கு ஏற்றவாறு திருப்பிச் செய்வதைக் குறிக்கிறது. கண்டனம் நிறைந்த வினாவில் ‘கைம்மாறு செய்கிறீர்கள்’ என்பது பதிலளிக்கும் நடத்தையை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: זֹאת
  choice: இவ்வாறு
  rationale: சுட்டுப்பெயர் இஸ்ரவேலரின் முன் விவரிக்கப்பட்ட நடத்தையின் விதத்தைச் சுட்டுகிறது; தமிழில் வினாவோடு ‘இவ்வாறா’ என்பது இயல்பானது.
- source_word: עַם נָבָל וְלֹא חָכָם
  choice: அறிவில்லாத, ஞானமற்ற மக்களே
  rationale: נָבָל வெறும் அறிவுத்திறன் குறைவை மட்டுமல்ல, ஒழுக்கநெறி சார்ந்த மதியீனத்தையும் குறிக்கிறது. ‘அறிவில்லாத’ மற்றும் ‘ஞானமற்ற’ என்பவை நேரடி அழைப்பின் கண்டனத் தொனியைத் தக்கவைக்கின்றன.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: இது பட்டத்தால் மாற்றப்படாமல், தேவனுடைய தனிப்பட்ட பெயராகத் தமிழில் நிலைபெற்ற ஒலிபெயர்ப்பில் வழங்கப்படுகிறது.
- source_word: הֲלוֹא
  choice: அல்லவா
  rationale: ஒப்புதலை எதிர்பார்க்கும் எதிர்மறை வினாவின் வலிமையைத் தமிழில் இயல்பாகப் பாதுகாக்கிறது.
- source_word: אָבִיךָ
  choice: உன் தந்தை
  rationale: இஸ்ரவேலை ஒருமை வடிவில் நேரடியாக அழைக்கும் எபிரெயச் சொல்லைத் தக்கவைத்து, தேவனுக்கும் மக்களுக்கும் இடையிலான உறவை வெளிப்படுத்துகிறது.
- source_word: קָּנֶךָ
  choice: உன்னைத் தனக்குரியவனாக்கியவர்
  rationale: קנה என்பதன் பெற்றுக்கொள்ளுதல், உடைமையாக்குதல் என்ற பரப்பை வெளிப்படுத்தி, அடுத்து வரும் ‘உருவாக்கி’ என்பதிலிருந்து சொற்பொருள் வேறுபாட்டைப் பாதுகாக்கிறது.
- source_word: עָשְׂךָ
  choice: உன்னை உருவாக்கி
  rationale: עשה இங்கு தேவன் இஸ்ரவேலை உண்டாக்கிய செயலைக் குறிக்கிறது; ‘உருவாக்கி’ என்பது தெளிவான நவீனத் தமிழ்.
- source_word: וַיְכֹנְנֶךָ
  choice: நிலைநிறுத்தினார்
  rationale: כון என்பது உறுதிப்படுத்துதல், நிலைபெறச் செய்தல், அமைத்தல் ஆகிய கருத்துகளை உடையது; ‘நிலைநிறுத்தினார்’ அந்த வலிமையைச் சுருக்கமாக வழங்குகிறது.
theological_decisions:
- issue: தேவனுக்கும் இஸ்ரவேலுக்கும் இடையிலான உறவில் קנה என்பதன் பொருள்
  choice: உன்னைத் தனக்குரியவனாக்கியவர்
  alternative: உன்னைப் படைத்தவர்; உன்னை வாங்கியவர்
  rationale: קנה என்பதற்குப் பெறுதல், உடைமையாக்குதல், வாங்குதல், சில சூழல்களில் படைத்தல் ஆகிய பொருள்கள் உண்டு. அடுத்ததாக עשה தனியே வருவதால் சொற்களுக்கிடையிலான வேறுபாட்டைத் தக்கவைக்க முதன்மை உரையில் ‘தனக்குரியவனாக்கியவர்’ தேர்ந்தெடுக்கப்பட்டது; உண்மையான பொருள் பன்மை அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: தேவனுடைய தந்தைத்துவ மொழி
  choice: உன் தந்தை
  alternative: உன்னைப் பெற்றவர்
  rationale: மூல உரை தேவனை நேரடியாக இஸ்ரவேலின் தந்தை என அழைக்கிறது. இதை விளக்கமாக மாற்றாமல் உறவுச் சொல்லாகவே வழங்குவது உடன்படிக்கை சார்ந்த வலிமையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பாடலுக்குரிய கண்ணியத்தையும் கண்டனமுள்ள நேரடி அழைப்பையும் காக்கும் நடை. எபிரெயில் ‘மக்களே’ என்பது பன்மையாக இருந்தாலும், பின்னர் இஸ்ரவேல் ஒரே மக்களாக ஒருமையில் அழைக்கப்படுவதால் ‘உன்/உன்னை’ பயன்படுத்தப்பட்டது.
