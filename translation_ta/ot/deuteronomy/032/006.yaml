revisions:
- from: அறிவில்லாத, ஞானமற்ற மக்களே, யெகோவாவுக்கு நீங்கள் இவ்வாறா கைம்மாறு செய்கிறீர்கள்? அவர் உன் தந்தை அல்லவா—உன்னைத் தனக்குரியவனாக்கியவர்?[a] அவரே உன்னை உருவாக்கி, நிலைநிறுத்தினார்.
  to: மதிகேடான, ஞானமற்ற மக்களே, யாவேக்கு நீங்கள் இவ்வாறு கைம்மாறு செய்கிறீர்களா? உங்களைத் தனதாக்கிக்கொண்ட உங்கள் தந்தை அவர் அல்லவா?[a] அவரே உங்களை உண்டாக்கி நிலைநிறுத்தினார்.
  rationale: திருத்தம் யாவே என்ற பெயர்வடிவத்தை POB audit trail-உடன் ஒத்திசைக்கிறது; தமிழில் எண்ணொத்திசைவைச் சரிசெய்கிறது; நָבָל-இன் கண்டனத் தொனியைத் தெளிவாக்குகிறது; கנה, עשה, כון ஆகிய மூன்று வினைகளின் வேறுபாட்டைத் தக்கவைக்கிறது. கנה-வின் பொருள் விவாதத்திற்குரியதாதலால் மாற்றுப்பொருள்கள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளன.
