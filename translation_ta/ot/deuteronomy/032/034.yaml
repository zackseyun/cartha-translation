  source_fidelity: மூல எபிரெயத்தின் உறுதிப்படுத்தலை எதிர்பார்க்கும் வினாக்கட்டமைப்பு (הֲלֹא), தெளிவற்ற ஆண்பால் ஒருமைச் சுட்டுப்பெயர், ‘என்னிடம்/என் பாதுகாப்பில்’ என்ற கருத்து, சேமித்துவைத்தல் மற்றும் முத்திரையிடுதல் ஆகிய இணையான செயப்பாட்டு நிலைகள் அனைத்தும் துல்லியமாகக் காக்கப்பட்டுள்ளன. ‘அது’ என்பது முன்னிலையின் துல்லியத்தைத் தேவையின்றி நிர்ணயிக்காமல் வைத்திருக்கிறது.
