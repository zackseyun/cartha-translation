  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: הֲ/לֹא ה֖וּא כָּמֻ֣ס עִמָּ/דִ֑י חָתֻ֖ם בְּ/אוֹצְרֹתָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/034.yaml
  text: Is it not laid up with me[b][a], sealed in my storehouses?
translation:
  language: ta
  text: அது என்னிடம் சேமித்து வைக்கப்பட்டு[a], என் களஞ்சியங்களில்[b] முத்திரையிடப்பட்டிருக்கவில்லையா?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என்னிடம் மறைத்து வைக்கப்பட்டு.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “என் பொக்கிஷசாலைகளில்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא
  choice: இருக்கவில்லையா?
  rationale: உறுதியான பதிலை எதிர்பார்க்கும் எபிரெய மறுப்புக் கேள்வியின் வலிமையை இயல்பான நவீனத் தமிழில் காக்கிறது.
- source_word: הוּא
  choice: அது
  rationale: இலக்கணத்தில் ஆண்பால் ஒருமையாக இருந்தாலும், முந்தைய பகுதியில் கூறப்பட்ட காரியத்தைச் சுட்டுகிறது; மனித ஆளைக் குறிப்பதாகத் தேவையின்றி முடிவுசெய்யாமல் ‘அது’ என மொழிபெயர்க்கப்பட்டது.
- source_word: כָּמֻס
  choice: சேமித்து வைக்கப்பட்டு
  rationale: மறைத்து அல்லது பாதுகாப்பாக வைத்திருப்பதைக் குறிக்கும் செயப்பாட்டு வினையெச்சம்; தொடர்ந்து வரும் களஞ்சியம் மற்றும் முத்திரை உருவகங்களோடு இயல்பாகப் பொருந்துகிறது.
- source_word: עִמָּדִי
  choice: என்னிடம்
  rationale: தேவனுடைய உடைமை அல்லது பாதுகாப்பில் இருப்பதைக் குறிக்கும் ‘என்னுடன்/என்னிடம்’ என்ற அடிப்படைப் பொருளைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: חָתֻם
  choice: முத்திரையிடப்பட்டு
  rationale: பாதுகாப்பாக மூடி உறுதிப்படுத்தப்பட்ட நிலையை நேரடியாகக் காட்டும் செயப்பாட்டு வடிவம்.
- source_word: בְּאוֹצְרֹתָי
  choice: என் களஞ்சியங்களில்
  rationale: אוֹצָר என்பதன் சேமிப்பிடம் அல்லது பொக்கிஷசாலை என்ற பொருள்களில், இச்சூழலின் சேமிப்பு உருவகத்துக்கு ‘களஞ்சியங்கள்’ சிறப்பாகப் பொருந்துகிறது.
theological_decisions:
- issue: சேமிக்கப்பட்டு முத்திரையிடப்பட்டிருப்பதன் குறிப்பு
  choice: முன்னர் கூறப்பட்ட காரியத்தைத் தெளிவாக வரையறுக்காமல் சுட்டும் ‘அது’
  alternative: பகைவரையோ உருவகப்படுத்தப்பட்ட ஓர் ஆளையோ சுட்டும் ‘அவன்’; அல்லது முன் கூறியவற்றைத் தொகுத்துச் சுட்டும் ‘இது’
  rationale: எபிரெயச் சுட்டுப்பெயர் ஆண்பால் ஒருமையாக இருந்தாலும், அதன் துல்லியமான முன்னிலையை வசனம் வெளிப்படையாகக் கூறவில்லை. ‘அது’ என்பது குற்றப்பதிவா, நியாயத்தீர்ப்பா, வேறு முன்கூறிய காரியமா என்பதைத் தேவையின்றி தீர்மானிக்காமல் மூலத்தின் தெளிவின்மையைக் காக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் அதேவேளையில் கண்ணியமான நடையில் அமைக்கப்பட்டது. எபிரெய மொழியின் மறுப்புக் கேள்வி இறுதியில் இயல்பான தமிழ் வினை வடிவில் காக்கப்பட்டுள்ளது; இரு செயப்பாட்டு வினையெச்சங்களின் இணையான அமைப்பும் சேமிப்பு–முத்திரை உருவகமும் பேணப்பட்டுள்ளன.
