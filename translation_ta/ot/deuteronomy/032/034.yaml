  terminology: ‘களஞ்சியங்கள்’ சேமிப்பிடம்/கருவூல இடம் என்ற אוֹצְרֹתָי சொல்லின் சூழல்சார் பொருளுக்கு ஏற்றது. ‘முத்திரையிடப்பட்டு’ חָתֻם என்பதன் நேரடியான பொருளைத் தருகிறது. மாற்று வாசிப்புகளுக்கான அடிக்குறிப்புகள் சரியான இடங்களில் இணைக்கப்பட்டுள்ளன.
