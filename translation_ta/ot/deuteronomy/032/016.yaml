  text: יַקְנִאֻ֖/הוּ בְּ/זָרִ֑ים בְּ/תוֹעֵבֹ֖ת יַכְעִיסֻֽ/הוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/016.yaml
  text: They made him jealous with strangers[a]; with abominations they provoked him to anger.
translation:
  language: ta
  text: 'அந்நியர்களால்[a] அவருக்குப் பொறாமை உண்டாக்கினார்கள்;

    அருவருப்பானவற்றால் அவரைக் கோபப்படுத்தினார்கள்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அந்நிய தெய்வங்களால்’ அல்லது ‘வேற்றுத் தெய்வங்களால்’; எபிரெயத்தில் சொல்லுக்குச் சொல் ‘அந்நியர்களால்/வேற்றவர்களால்’ என்று உள்ளது.
    reason: alternative_reading
lexical_decisions:
- source_word: יַקְנִאֻהוּ
  choice: அவருக்கு எரிச்சலூட்டினார்கள்
  rationale: קנא என்பதன் ஹிஃபில் வடிவம், ஒருவரிடம் பொறாமை அல்லது தீவிர எரிச்சலைத் தூண்டுவதைக் குறிக்கிறது. இங்கு உடன்படிக்கைச் சூழலில் தேவனுக்கு ஏற்பட்ட பொறாமை கலந்த எரிச்சலை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: בְּזָרִים
  choice: அந்நியர்களால்
  rationale: זָרִים என்பதன் நேரடிப் பொருள் ‘அந்நியர்கள்/வேற்றவர்கள்.’ இவ்வசனத்தில் ‘தெய்வங்கள்’ என்பது வெளிப்படையாக இல்லை; எனவே மூலத்தின் ambiguity-ஐ முதன்மை உரை காக்கிறது. சூழல் காட்டும் ‘அந்நிய தெய்வங்கள்’ என்ற பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: בְּתוֹעֵבֹת
  choice: அருவருப்பானவற்றால்
  rationale: תּוֹעֵבָה என்பது வெறுக்கத்தக்க அல்லது அருவருப்பான ஒன்றைக் குறிக்கிறது; விக்கிரக வழிபாட்டுச் சூழலிலும் அடிக்கடி வருகிறது. ‘அருவருப்பானவை’ என்பது பொருளைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: יַכְעִיסֻהוּ
  choice: அவரைக் கோபமடையச் செய்தார்கள்
  rationale: כעס என்பதன் ஹிஃபில் வடிவம் ‘கோபத்தைத் தூண்டுதல்/கோபமடையச் செய்தல்’ என்று காரணவினைப் பொருள் தருகிறது; தேர்ந்தெடுத்த மொழிபெயர்ப்பு அந்த வலிமையையும் முதல் அடியுடனான இணைப்பையும் காக்கிறது.
theological_decisions:
- issue: זָרִים என்பதில் மறைமுகமாக உள்ள வழிபாட்டுப் பொருளை வெளிப்படையாகச் சேர்ப்பதா
  choice: முதன்மை உரையில் நேரடியான ‘அந்நியர்கள்’ என்ற சொல்லை வைத்தல்
  alternative: அந்நிய தெய்வங்கள் / வேற்றுத் தெய்வங்கள்
  rationale: உடனடிச் சூழல் விக்கிரக வழிபாட்டைக் குறித்தாலும், எபிரெய உரை இங்கு ‘தெய்வங்கள்’ என்று நேரடியாகச் சொல்லவில்லை. ஆகவே மூலத்தின் சொற்களையும் அதன் சுருக்கமான ambiguity-யையும் முதன்மை உரை காக்கிறது; சூழல்சார் பொருள் அடிக்குறிப்பில் வழங்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; கவிதைநடையின் இணை அமைப்பைக் காக்க இரண்டு அடிகளாக வழங்கப்பட்டுள்ளது. இறைவனைக் குறிக்கும் மரியாதைப் பன்மை வினைவடிவங்கள் பயன்படுத்தப்பட்டுள்ளன; மூலத்தில் வெளிப்படையாக இல்லாத ‘தெய்வங்கள்’ முதன்மை உரையில் சேர்க்கப்படவில்லை.
