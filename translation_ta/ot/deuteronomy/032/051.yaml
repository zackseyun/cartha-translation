  to: ஏனெனில், சீன் வனாந்தரத்திலுள்ள மெரிபத்-காதேஸ் நீர்நிலைகளில், இஸ்ரவேல் மக்களின் நடுவில் நீங்கள் எனக்கு எதிராக உண்மையற்றபடி நடந்துகொண்டீர்கள்; இஸ்ரவேல் மக்களின் நடுவில் என்னைப் பரிசுத்தமானவராக மதிக்கவில்லை.[a]
  rationale: திருத்தம் இடப்பெயர் மற்றும் இடச்சுட்டலின் துல்லியத்தை மேம்படுத்துகிறது; அதேவேளையில் மூலத்தின் காரணவியல் அமைப்பு, மீளுரைத்தல், மற்றும் தேவனுடைய பரிசுத்தத்தை மக்கள் முன்னிலையில் மதித்து வெளிப்படுத்த வேண்டிய பொருள் ஆகியவற்றை மாற்றவில்லை. அடிக்குறிப்பு கִדַּשְׁתֶּם மற்றும் மெரிபத்-காதேஸ் ஆகியவற்றின் பொருத்தமான மாற்றுகளை வழங்குகிறது.
