  text: עַל֩ אֲשֶׁ֨ר מְעַלְתֶּ֜ם בִּ֗/י בְּ/תוֹךְ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל בְּ/מֵֽי מְרִיבַ֥ת קָדֵ֖שׁ מִדְבַּר צִ֑ן עַ֣ל אֲשֶׁ֤ר לֹֽא קִדַּשְׁתֶּם֙ אוֹתִ֔/י בְּ/ת֖וֹךְ בְּנֵ֥י יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/051.yaml
  text: because you acted unfaithfully against me among the sons of Israel at the waters of Meribath-kadesh[a], in the wilderness of Zin[c][b], because you did not treat me as holy among the sons of Israel.
translation:
  language: ta
  text: ஏனெனில், சீன் வனாந்தரத்திலுள்ள மெரிபத்-காதேஸ் நீர்நிலைகளில், இஸ்ரவேல் மக்களின் நடுவில் நீங்கள் எனக்கு எதிராக உண்மையற்றபடி நடந்துகொண்டீர்கள்; இஸ்ரவேல் மக்களின் நடுவில் என்னைப் பரிசுத்தமானவராக மதிக்கவில்லை.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “என்னைப் பரிசுத்தமானவராக மதிக்கவில்லை” என்பதை “என்னைப் பரிசுத்தமானவராக வெளிப்படுத்தவில்லை,” “என்னைப் பரிசுத்தப்படுத்தவில்லை,” அல்லது “என் பரிசுத்தத்தை நிலைநாட்டவில்லை” என்றும் மொழிபெயர்க்கலாம். “மெரிபத்-காதேஸ்” என்பது “காதேசின் மெரிபா” அல்லது, இன்னும் சொல்லுக்கு சொல், “காதேசின் சச்சரவின் நீர்நிலைகள்” என்றும் தரப்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְעַלְתֶּם בִּי
  choice: எனக்கு எதிராக உண்மையற்றவர்களாய் நடந்துகொண்டீர்கள்
  rationale: מעל என்பது நம்பிக்கையை மீறி உண்மையற்ற விதத்தில் செயல்படுவதைக் குறிக்கிறது; בִּי இங்கு பாதிக்கப்பட்டவராகிய தேவனைச் சுட்டுவதால் ‘எனக்கு எதிராக’ என்பது இயல்பான தமிழ்.
- source_word: בְּתוֹךְ בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்களின் நடுவில்
  rationale: בני ישראל என்பது சொல்லுக்கு சொல் ‘இஸ்ரவேலின் மகன்கள்’ என்றாலும், நிலையான இனக்குழுப் பெயராக இங்கு ஆண்களை மட்டும் குறிக்கவில்லை. ‘இஸ்ரவேல் மக்கள்’ நவீன தமிழில் இயல்பாகவும் பொருள் துல்லியமாகவும் உள்ளது; ‘நடுவில்’ என்ற மீளுருவாக்கம் எபிரெய மூலத்தின் வலியுறுத்தலைப் பேணுகிறது.
- source_word: בְּמֵי מְרִיבַת קָדֵשׁ
  choice: காதேசின் மெரிபா நீரருகே
  rationale: மெரிபா என்பதன் இடப்பெயர் தன்மையைப் பேணியபடி, காதேசுடன் உள்ள தொடர்பையும் நீர்நிலையையும் தெளிவாகக் காட்டுகிறது.
- source_word: מִדְבַּר צִן
  choice: சீன் வனாந்தரத்தில்
  rationale: மִדְבָּר என்பதற்கு வேதாகமப் புவியியல் சூழலில் வழக்கமான ‘வனாந்தரம்’ பொருத்தமானது; צִן என்பது சீன் என ஒலிபெயர்க்கப்பட்டது.
- source_word: לֹא קִדַּשְׁתֶּם אֹתִי
  choice: என்னைப் பரிசுத்தராக மதிக்கவில்லை
  rationale: பியேல் வினை இங்கு தேவனைப் பரிசுத்தராக ஏற்று, அவருடைய பரிசுத்தத்தை மக்கள் முன் நிலைநாட்டுவதைக் குறிக்கிறது. இந்த மொழியாக்கம் தேவனுக்குப் பரிசுத்தம் அளிப்பதாகத் தவறாக உணர்த்தாமல் பொதுமக்களுக்கு இயல்பாக உள்ளது.
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל என்பதன் இனக்குழுப் பயன்பாடு
  choice: இஸ்ரவேல் மக்கள்
  alternative: இஸ்ரவேலின் மகன்கள்
  rationale: இது வழக்கமான இனக்குழுப் பெயர்; சூழலில் முழு இஸ்ரவேல் சமூகத்தைக் குறிக்கிறது. ஆகவே பாலினத்தைக் குறுகலாக்காத இயல்பான தமிழ் தேர்ந்தெடுக்கப்பட்டது.
- issue: கִדַּשְׁתֶּם אֹתִי என்பதன் பொருள்
  choice: என்னைப் பரிசுத்தராக மதிக்கவில்லை
  alternative: என்னைப் பரிசுத்தப்படுத்தவில்லை; என் பரிசுத்தத்தை நிலைநாட்டவில்லை
  rationale: இங்கு தேவனுடைய உள்ளார்ந்த பரிசுத்தத்தில் குறைவு ஏற்பட்டதாகப் பொருள் இல்லை; மோசேயும் ஆரோனும் மக்கள் முன் அவரைப் பரிசுத்தராக மதித்து வெளிப்படுத்தத் தவறியதே கருத்து. தேர்ந்த மொழியாக்கம் அந்தப் பொது மற்றும் உறவுசார் பரிமாணத்தைப் பேணுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையும் வேதாகமப் புவியியல் நடையும் பேணப்பட்டுள்ளன. எபிரெய மூலத்தில் இருமுறை வரும் ‘இஸ்ரவேல் மக்களின் நடுவில்’ என்ற தொடர் வலியுறுத்தலுக்காக இருமுறையும் வைக்கப்பட்டுள்ளது. ‘மெரிபா’ இடப்பெயராகப் பேணப்பட்டுள்ளது; தேவையான பொருள் மாற்று அடிக்குறிப்பில் மட்டும் வழங்கப்பட்டுள்ளது.
