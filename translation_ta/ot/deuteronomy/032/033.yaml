source:
  edition: WLC
  text: חֲמַ֥ת תַּנִּינִ֖ם יֵינָ֑/ם וְ/רֹ֥אשׁ פְּתָנִ֖ים אַכְזָֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/033.yaml
  text: Their wine is the venom of serpents[b][a], the cruel poison of cobras.
translation:
  language: ta
  text: அவர்களுடைய திராட்சரசம் பெரும்பாம்புகளின் நஞ்சு[b]; நச்சுப்பாம்புகளின் கொடிய விஷம்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘விரியன் பாம்புகளின் விஷம்’; எபிரெயச் சொல் ஒரு நச்சுப்பாம்பைக் குறிக்கிறது; அது எந்த வகைப் பாம்பு என்பது உறுதியாகத் தெரியவில்லை.
    reason: lexical_alternative
  - marker: b
    text: ‘பெரும்பாம்புகள்’ என்பதற்கான எபிரெயச் சொல் வேறு சூழல்களில் ‘கடற்பெருயிர்கள்’ அல்லது ‘அரக்கப்பாம்புகள்’ என்றும் மொழிபெயர்க்கப்படலாம்; ஆனால் இங்கு நச்சுப்பாம்புகளைப் பற்றிய இணைவரி பாம்பு சார்ந்த பொருளை ஆதரிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲמַת
  choice: நஞ்சு
  rationale: பாம்புகளுடன் இணைந்த அமைப்பிலும் அடுத்த அடியின் நச்சுப் பொருள் குறித்த இணைப்பிலும், இச்சொல் ‘சினம்’ அல்லது ‘வெப்பம்’ என்பதற்குப் பதிலாக நஞ்சைக் குறிக்கிறது.
- source_word: תַּנִּינִם
  choice: பெரும்பாம்புகள்
  rationale: இச்சொல் வேறு சூழல்களில் கடற்பெருயிர்கள் அல்லது அரக்கப்பாம்புகளைக் குறிக்கலாம்; இங்கு நஞ்சையும் நச்சுப்பாம்புகளையும் பற்றிய இணைவரி பாம்பு சார்ந்த பொருளை ஆதரிக்கிறது. ‘பெரும்பாம்புகள்’ அதன் பெரிதும் அச்சமூட்டும் தன்மையையும் ஓரளவு காக்கிறது.
- source_word: יֵינָם
  choice: அவர்களுடைய திராட்சரசம்
  rationale: எளிய உடைமைத் தொடர். தமிழில் ‘மது’ என்பதைவிட ‘திராட்சரசம்’ மூலச்சொல்லின் குறிப்பான பொருளைத் தெளிவாகக் காட்டுகிறது.
- source_word: וְרֹאשׁ
  choice: விஷம்
  rationale: இங்கு சொல் நேரடியான ‘தலை’யைக் குறிக்காமல் கசப்பான அல்லது நச்சான பொருளைக் குறிக்கிறது. முதல் அடியின் ‘நஞ்சு’ என்பதுடன் கவிதை இணைப்பை வைத்துக்கொண்டு தேவையற்ற சொல் மறுபடியையும் தவிர்க்க ‘விஷம்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: פְּתָנִים
  choice: நாகப்பாம்புகள்
  rationale: துல்லியமான உயிரின அடையாளம் உறுதியல்ல; எனினும் இது கொடிய நச்சுப்பாம்பைக் குறிக்கிறது. ‘நாகப்பாம்பு’ நவீன தமிழில் தெளிவான, இயல்பான சாத்தியமான இணைச்சொல்.
- source_word: אַכְזָר
  choice: கொடிய
  rationale: விஷத்தின் இரக்கமற்ற, உயிர்க்கொல்லும் விளைவை இயல்பான தமிழில் சுருக்கமாக வெளிப்படுத்துகிறது.
