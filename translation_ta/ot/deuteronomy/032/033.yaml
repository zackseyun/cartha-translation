  register: நவீன தரநிலைத் தமிழில், கவித்துவமான இணைவரியைத் தெளிவாகவும் கண்ணியமாகவும் வைத்திருக்கிறது. ‘நஞ்சு/விஷம்’ என்ற மாறுபாடு எபிரெய இணைச்சொற்களை இயல்பான தமிழில் பிரதிபலிக்கிறது; இரண்டாம் வாக்கியத்தில் மூலத்தின் இணைப்பை வெளிப்படுத்த ‘அது’ சேர்க்கப்பட்டுள்ளது.
