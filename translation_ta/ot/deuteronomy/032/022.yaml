  text: כִּי אֵשׁ֙ קָדְחָ֣ה בְ/אַפִּ֔/י וַ/תִּיקַ֖ד עַד שְׁא֣וֹל תַּחְתִּ֑ית וַ/תֹּ֤אכַל אֶ֨רֶץ֙ וִֽ/יבֻלָ֔/הּ וַ/תְּלַהֵ֖ט מוֹסְדֵ֥י הָרִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/022.yaml
  text: For a fire has been kindled in my anger[a], and it burns to the depths of Sheol; it devours the earth and its produce, and sets ablaze the foundations of the mountains.
translation:
  language: ta
  text: ஏனெனில், என் கோபத்தில் ஒரு நெருப்பு மூண்டுள்ளது; அது ஷியோலின் ஆழம் வரை எரிகிறது.[a] அது பூமியையும் அதன் விளைச்சலையும் விழுங்கி, மலைகளின் அஸ்திவாரங்களுக்குத் தீ மூட்டி எரியச் செய்கிறது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “மிகக் கீழுள்ள ஷியோல் வரை” அல்லது “ஷியோலின் மிக ஆழமான பகுதிவரை” என்றும் மொழிபெயர்க்கலாம். எபிரெயில், “கீழான/ஆழமான ஷியோல் வரை” என்று உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய நியாயத்தீர்ப்பு மொழிக்கான காரணத்தையோ விளக்கத்தையோ அறிமுகப்படுத்தும் இணைப்புச் சொல்லின் வலிமையை இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: אֵשׁ קָדְחָה
  choice: ஒரு நெருப்பு மூண்டுள்ளது
  rationale: நெருப்பு பற்றித் தொடங்கியதையும் அதன் விளைவு தொடர்வதையும் இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: בְאַפִּי
  choice: என் கோபத்தில்
  rationale: אַף என்பதன் சொற்பொருள் ‘மூக்கு/நாசி’ என்றாலும், இங்கு அது கோபத்தைக் குறிக்கும் எபிரெய மரபுத்தொடர்; அதன் பொருளை நேரடியாகத் தருகிறது.
- source_word: וַתִּיקַד
  choice: அது ... எரிகிறது
  rationale: முன்பு மூண்ட நெருப்பு தொடர்ந்து எரிவதையும் அதன் பரவலையும் தெளிவாகக் காட்டுகிறது.
- source_word: עַד שְׁאוֹל תַּחְתִּית
  choice: ஷியோலின் ஆழம்வரை
  rationale: שְׁאוֹל என்பதை பிற்கால ‘நரகம்’ என்ற கருத்தோடு முன்கூட்டியே ஒன்றாக்காமல் ஒலிபெயர்த்து, תַּחְתִּית குறிக்கும் கீழான அல்லது ஆழமான எல்லையையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וַתֹּאכַל
  choice: விழுங்கி
  rationale: நெருப்பு ‘தின்பது’ என்ற உயிரோட்டமான உருவகத்தைத் தமிழில் வலிமையாகத் தக்கவைக்கிறது.
- source_word: אֶרֶץ
  choice: பூமி
  rationale: ஷியோலும் மலைகளின் அஸ்திவாரங்களும் இடம்பெறும் பரந்த கவிதைச் சூழலில், உள்ளூர் ‘நிலம்’ என்பதைக் காட்டிலும் ‘பூமி’ பொருத்தமானது.
- source_word: יְבֻלָהּ
  choice: அதன் விளைச்சல்
  rationale: பூமி விளைவிப்பவற்றைத் தெளிவாகவும் பொதுவாகவும் குறிக்கிறது.
- source_word: וַתְּלַהֵט
  choice: தீப்பற்றி எரியச் செய்கிறது
  rationale: வினைச்சொல்லின் தீவிரமான, காரணவினை சார்ந்த நெருப்புப் படிமத்தைத் தக்கவைக்கிறது.
- source_word: מוֹסְדֵי הָרִים
  choice: மலைகளின் அஸ்திவாரங்கள்
  rationale: மலைகளின் மிக ஆழமான அடிப்பகுதிகளைச் சித்தரிக்கும் மூல உருவகத்தை நேரடியாகவும் புரியத்தக்க வகையிலும் தருகிறது.
theological_decisions:
- issue: שְׁאוֹל என்பதன் மொழிபெயர்ப்பு
  choice: ஷியோல்
  alternative: பாதாளம்; இறந்தோரின் உலகம்; கல்லறை; நரகம்
  rationale: எபிரெயச் சொல் இறந்தோரின் உலகைக் குறிக்கிறது. அதை ‘நரகம்’ என்று மொழிபெயர்ப்பது பிற்கால இறையியல் கருத்தை உரைக்குள் கொண்டுவரக்கூடும்; ‘கல்லறை’ என்பது பொருளைச் சுருக்கக்கூடும். ஒலிபெயர்ப்பு மூல உரையின் கருத்துலகத்தையும் அதன் தெளிவின்மையையும் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் தமிழ் பயன்படுத்தப்பட்டுள்ளது. கவிதையின் தீவிரமான நெருப்புப் படிமமும் பிரபஞ்ச அளவிலான தீர்ப்புச் சித்திரமும் தக்கவைக்கப்பட்டுள்ளன; ‘ஷியோல்’ விளக்கக் குறிப்புடன் பாதுகாக்கப்பட்டுள்ளது.
