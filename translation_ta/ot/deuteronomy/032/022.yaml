    rationale: ‘தீப்பற்றி எரியச் செய்கிறது’ can sound redundant in Tamil. ‘தீ மூட்டி எரியச் செய்கிறது’ naturally conveys that the fire sets the foundations ablaze.
  - severity: low
    issue: Minor orthographic spacing in the Sheol phrase.
    rationale: Writing ‘ஆழம் வரை’ is the more standard and readily readable form.
