  rationale: மூலத்தில் ஒருமுறை மட்டுமே உள்ள ‘கேள்’ என்ற கட்டளையைப் பாதுகாக்க, மூப்பர்களைப் பற்றிய இரண்டாவது வரியிலிருந்த சேர்க்கப்பட்ட கட்டளை நீக்கப்பட்டது. נגד வினையின் அறிவித்தல் நுணுக்கத்திற்கு ‘அறிவிப்பார்’ பயன்படுத்தப்பட்டது. தலைமுறைகள் தொடர்வதைக் குறிக்கும் எபிரெய மரபுத்தொடருக்கு, ‘கடந்த’ என்ற சேர்க்கையின்றி ‘தலைமுறைதோறும் உள்ள ஆண்டுகள்’ என மொழிபெயர்க்கப்பட்டது. அடிக்குறிப்பு உரிய இடத்தில் உள்ளது; அதன் பொருளும் பாதுகாக்கப்பட்டுள்ளது.
