base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/007.yaml
  text: Remember the days of old[a]; consider the years of generation after generation. Ask your father, and he will tell you, your elders[b], and they will say to you.
translation:
  language: ta
  text: 'பண்டைய நாட்களை நினைவுகூர்;

    தலைமுறைதோறும் உள்ள ஆண்டுகளைச் சிந்தித்துப் பார்.


    உன் தந்தையிடம்[a] கேள்; அவர் உனக்கு அறிவிப்பார்;

    உன் மூப்பர்கள் உனக்குச் சொல்வார்கள்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘உன் மூதாதையிடம்’ என்றும் பொருள் கொள்ளலாம்; இங்கு ‘தந்தை’ என்பது உடனடியான தந்தையைவிடப் பரந்த பொருளில் முன்னோரைக் குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: זְכֹר
  choice: நினைவுகூர்
  rationale: זכר என்பதன் கால் கட்டளை வடிவம் கடந்தவற்றை நினைவுக்குக் கொண்டுவருமாறு நேரடியாகக் கூறுகிறது; ‘நினைவுகூர்’ என்பது இயல்பான, கண்ணியமான தமிழாக்கம்.
- source_word: יְמוֹת עוֹלָם
  choice: பண்டைய நாட்கள்
  rationale: இச்சொற்றொடர் மிகப் பழைய காலத்து நாட்களைக் குறிக்கிறது. ‘பண்டைய நாட்கள்’ என்பது அதன் காலத்தொலைவையும் கவித்துவச் சுருக்கத்தையும் காக்கிறது.
- source_word: בִּינוּ
  choice: சிந்தித்துப் பார்
  rationale: בין இங்கு புரிந்துகொள்ளுதல் அல்லது பகுத்துணர்தல் நோக்கில் கவனம் செலுத்துவதைக் குறிக்கிறது. ‘சிந்தித்துப் பார்’ என்பது நினைவுகூருதலுக்கு இணையான ஆழ்ந்த பரிசீலனையை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: שְׁנוֹת דּוֹר וָדֹר
  choice: தலைமுறை தலைமுறையாகக் கடந்த ஆண்டுகள்
  rationale: சொல்லுக்கு நெருக்கமாக ‘தலைமுறையும் தலைமுறையும் ஆகிய ஆண்டுகள்’ எனும் எபிரெய மரபுத்தொடர் அடுத்தடுத்த தலைமுறைகளின் காலத்தைக் குறிக்கிறது; தேர்ந்த வடிவம் அந்தப் பகிர்வுப் பொருளைத் தெளிவாக்குகிறது.
- source_word: שְׁאַל
  choice: கேள்
  rationale: שאל என்பதன் எளிய கட்டளைப் பொருளை நேரடியாகவும் இயல்பாகவும் தருகிறது.
- source_word: אָבִיךָ
  choice: உன் தந்தை
  rationale: இரண்டாம் நபர் ஒருமை உரிமை விகுதி கொண்ட אָב என்பதன் முதன்மையான பொருள் ‘உன் தந்தை’; பரந்த சூழலில் முன்னோரைக் குறிக்கும் சாத்தியம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: וְיַגֵּדְךָ
  choice: அவர் உனக்கு எடுத்துச் சொல்வார்
  rationale: נגד என்பதன் ஹிஃபில் வடிவம் அறிவித்தல் அல்லது விளக்கிச் சொல்லுதல் என்ற வலிமையைக் கொண்டது; ‘எடுத்துச் சொல்வார்’ என்பது வெறும் ‘சொல்வார்’ என்பதிலிருந்து கவித்துவ வேறுபாட்டையும் தகவலை அறிவிக்கும் நுணுக்கத்தையும் காக்கிறது.
- source_word: זְקֵנֶיךָ
  choice: உன் மூப்பர்கள்
  rationale: இது வயதான ஆண்களை மட்டும் அல்லாமல், சமூகத்தின் வயதும் அனுபவமும் கொண்ட மூத்தவர்களைக் குறிக்கலாம்; ‘மூப்பர்கள்’ அந்த சமூகப் பங்கைக் காக்கிறது.
- source_word: וְיֹאמְרוּ לָךְ
  choice: அவர்கள் உனக்குச் சொல்வார்கள்
  rationale: אמר என்பதன் பொதுவான ‘சொல்’ என்ற பொருளைத் தக்கவைத்து, முந்தைய נגד வினையுடன் உள்ள சிறிய சொல்வேறுபாட்டைப் பாதுகாக்கிறது.
