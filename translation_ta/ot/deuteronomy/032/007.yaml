  register: நவீன நிலையான தமிழில், கவிதைநடையின் இணை அமைப்பைத் தக்கவைத்து மொழிபெயர்க்கப்பட்டது. எபிரெயத்தில் இரண்டாவது ‘கேள்’ வெளிப்படையாக மீண்டும் வராவிட்டாலும், தமிழில் பொருளும் இணை அமைப்பும் தெளிவாக இருக்க அது இயல்பாக நிரப்பப்பட்டுள்ளது.
