source:
  edition: WLC
  text: ל֥וּ חָכְמ֖וּ יַשְׂכִּ֣ילוּ זֹ֑את יָבִ֖ינוּ לְ/אַחֲרִיתָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/029.yaml
  text: If only they were wise[a], they would understand this; they would discern their end.
translation:
  language: ta
  text: அவர்கள் ஞானமுள்ளவர்களாய் இருந்தால் எவ்வளவு நன்றாயிருக்கும்! அவர்கள் இதைப் புரிந்துகொண்டு, தங்கள் இறுதி நிலையை[a] உணர்ந்துகொள்வார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘தங்கள் பிற்கால நிலையை’ அல்லது ‘தங்கள் எதிர்காலத்தை.’ எபிரெயச் சொல் இறுதி விளைவையோ, பின்னர் நிகழப்போவதையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ל֥וּ
  choice: இருந்தால் எவ்வளவு நன்றாயிருக்கும்!
  rationale: இது வெறும் நிபந்தனையை அல்ல, நிறைவேறாத விருப்பத்தையும் வருத்தத்தையும் வெளிப்படுத்துகிறது; இச்சொற்றொடர் அந்த உணர்வை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: חָכְמ֖וּ
  choice: ஞானமுள்ளவர்களாய் இருந்தால்
  rationale: ஞானத்தை உடையவர்களாக அல்லது அதைச் செயல்படுத்துபவர்களாக இருப்பதைக் குறிக்கிறது; விருப்பநிலைத் தொடக்கத்தோடு இயல்பாக இணைகிறது.
- source_word: יַשְׂכִּ֣ילוּ
  choice: புரிந்துகொண்டு
  rationale: இந்த ஹிஃபில் வடிவம் விவேகத்துடன் செயல்படுதல் அல்லது நுண்ணறிவு பெறுதல் எனப் பொருள்படலாம்; இங்குள்ள அறிவுசார் கவிதை இணைப்பில் ‘புரிந்துகொண்டு’ பொருத்தமானது.
- source_word: זֹ֑את
  choice: இதை
  rationale: எபிரெய ஒருமைச் சுட்டுப்பெயரைப் பாதுகாத்து, முன்பு கூறப்பட்ட உண்மை அல்லது பாடத்தைக் குறிக்கிறது.
- source_word: יָבִ֖ינוּ
  choice: உணர்ந்துகொள்வார்களே
  rationale: பகுத்தறிந்து உணர்தல் என்ற பொருளைக் கொண்டது; முந்தைய வினையிலிருந்து வேறுபடுத்தி கவிதை இணைப்பைத் தக்கவைக்கிறது. இறுதி ‘ஏ’ விருப்பமும் வருத்தமும் தொடர்வதை இயல்பாகக் காட்டுகிறது.
- source_word: לְאַחֲרִיתָם
  choice: தங்கள் முடிவை
  rationale: ஒருவருக்கு இறுதியில் நேரும் விளைவு, பிற்கால நிலை அல்லது எதிர்காலம் ஆகியவற்றைக் குறிக்கலாம்; சூழலின் எச்சரிக்கைத் தொனியை மிகைப்படுத்தாமல் ‘முடிவு’ காக்கிறது.
theological_decisions:
- issue: אַחֲרִיתָם என்பதன் சூழல்சார் பொருள்
  choice: தங்கள் முடிவை
  alternative: தங்கள் பிற்கால நிலையை / தங்கள் எதிர்காலத்தை
  rationale: இப்பாடல் அவர்கள் எதிர்கொள்ளவிருக்கும் விளைவை உணர வேண்டும் என வலியுறுத்துகிறது. ‘முடிவு’ என்பது நீதித்தீர்ப்பின் தீவிரத்தைக் காக்கிறது; அதேவேளை அதை மரணம் மட்டும் எனக் குறுக்குவதில்லை.
translation_notes:
  register: நவீன தரத் தமிழில், கவிதைக்குரிய கண்ணியத்துடனும் பொதுவாசகர்களுக்கு எளிதில் புரியும் வகையிலும் வடிவமைக்கப்பட்டது. தொடக்கத்தின் நிறைவேறாத விருப்பம் தனி வியப்புவாக்கியமாகவும், அடுத்த இரண்டு வினைகள் கவிதை இணைப்பாகவும் வைக்கப்பட்டுள்ளன.
