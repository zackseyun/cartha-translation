revisions:
- from: அவர் அவர்களிடம், “இன்று நான் உங்கள் நடுவில் சாட்சியாக எடுத்துரைக்கும் வார்த்தைகள் அனைத்தையும் உங்கள் உள்ளத்தில் பதியவையுங்கள்.[a] இந்தச் சட்டத்தின் வார்த்தைகள் அனைத்தையும் காத்துச் செயல்படுத்தும்படி உங்கள் மகன்களுக்குக் கட்டளையிடுங்கள்.[b]” என்றார்.
  to: அவர் அவர்களிடம், “இன்று நான் உங்கள் நடுவில் சாட்சியமளித்து அறிவிக்கும் இந்த வார்த்தைகள் அனைத்தையும் உங்கள் உள்ளத்தில் நிலைநிறுத்துங்கள்.[a] இந்தச் சட்டத்தின் வார்த்தைகள் அனைத்தையும் காத்து நடைமுறைப்படுத்துமாறு உங்கள் மகன்களுக்குக் கட்டளையிடுங்கள்.[b]” என்றார்.
  rationale: The revised wording improves modern Tamil idiom and explicitly links the command to the sons with keeping and doing all the words of the law. It preserves the source’s plural exhortation, masculine ‘sons,’ twofold ‘keep and do,’ and the deliberately non-exclusive witness nuance of מֵעִיד בָּכֶם.
