base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/046.yaml
  text: And he said to them[a], “Set your heart on all the words that I am testifying to you today, which you shall command your sons to keep[b], to do all the words of this law.”
translation:
  language: ta
  text: அவர் அவர்களிடம், “இன்று நான் உங்கள் நடுவில் சாட்சியமளித்து அறிவிக்கும் இந்த வார்த்தைகள் அனைத்தையும் உங்கள் உள்ளத்தில் நிலைநிறுத்துங்கள்.[a] இந்தச் சட்டத்தின் வார்த்தைகள் அனைத்தையும் காத்து நடைமுறைப்படுத்துமாறு உங்கள் மகன்களுக்குக் கட்டளையிடுங்கள்.[b]” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “உங்களை எச்சரிக்கும்” அல்லது “உங்களுக்கு எதிராகச் சாட்சி கூறும்” என்றும் மொழிபெயர்க்கலாம். உடன்படிக்கைச் சூழலில் எபிரெய வினைச்சொல் சாட்சி கூறுதல், எச்சரித்தல், நீதிமன்ற முறையில் எதிராகச் சாட்சி நிறுத்துதல் ஆகிய நுணுக்கங்களைக் கொண்டிருக்கலாம்.
    reason: alternative_reading
  - marker: b
    text: எபிரெயத்தில் “உங்கள் மகன்கள்”; இச்சொல் அடுத்த தலைமுறையைப் பரந்த முறையில் குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׂימוּ לְבַבְכֶם
  choice: உங்கள் உள்ளத்தில் பதியவையுங்கள்
  rationale: ‘இதயத்தை வையுங்கள்’ என்ற எபிரெய உருவகத்தின் கவனம், மனவுறுதி, உள்ளார்ந்த ஏற்றுக்கொள்ளுதல் ஆகியவற்றை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: הַדְּבָרִים / דִּבְרֵי
  choice: வார்த்தைகள்
  rationale: உடன்படிக்கை சார்ந்த வாய்மொழி அறிவுறுத்தல்களைக் குறிக்கும் דָּבָר என்பதையும், வசனத்திலுள்ள சொல்லின் மறுபயன்பாட்டையும் நேரடியாகப் பேணுகிறது.
- source_word: מֵעִיד בָּכֶם הַיּוֹם
  choice: இன்று நான் உங்கள் நடுவில் சாட்சியாக எடுத்துரைக்கும்
  rationale: עוּד என்பதன் சாட்சி கூறுதல் என்ற அடிப்படை வலிமையையும், בָּכֶם என்பதன் சமூகத்தின் நடுவிலான பொது அறிவிப்பு நுணுக்கத்தையும் பேணுகிறது; எச்சரிக்கை அல்லது எதிரான நீதிமன்ற நுணுக்கம் அடிக்குறிப்பில் விடப்பட்டுள்ளது.
- source_word: אֲשֶׁר תְּצַוֻּם
  choice: கட்டளையிடுங்கள்
  rationale: முற்கூறிய வார்த்தைகளை அடுத்த தலைமுறைக்குக் கட்டளையாக ஒப்படைக்க வேண்டும் என்ற சூழல்சார் நோக்கத்தை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: בְּנֵיכֶם
  choice: உங்கள் மகன்கள்
  rationale: எபிரெயச் சொல் வெளிப்படையாக ஆண்பால் பன்மையில் இருப்பதால் ‘பிள்ளைகள்’ எனப் பொதுமைப்படுத்தாமல் மூலவடிவைப் பேணுகிறது.
- source_word: לִשְׁמֹר לַעֲשׂוֹת
  choice: காத்துச் செயல்படுத்தும்படி
  rationale: கவனமாகப் பேணுதல் மற்றும் நடைமுறையில் செய்தல் என்ற இணைந்த இரு கருத்துகளையும் சுருக்காமல் தமிழில் வெளிப்படுத்துகிறது.
- source_word: הַתּוֹרָה הַזֹּאת
  choice: இந்தச் சட்டம்
  rationale: תּוֹרָה என்பதற்கு ‘போதனை’ என்ற பரந்த பொருள் இருந்தாலும், உபாகமத்தின் உடன்படிக்கைச் சூழலில் ‘சட்டம்’ தெளிவாகவும் நிலைபெற்றதாகவும் உள்ளது.
theological_decisions:
- issue: מֵעִיד בָּכֶם என்பதிலுள்ள சாட்சி, எச்சரிக்கை, நீதிமன்ற நுணுக்கங்கள்
  choice: உங்கள் நடுவில் சாட்சியாக எடுத்துரைக்கும்
  alternative: இன்று நான் உங்களை எச்சரிக்கிற / இன்று நான் உங்களுக்கு எதிராகச் சாட்சி கூறுகிற
  rationale: முதன்மை உரை சாட்சியின் உடன்படிக்கை வலிமையைப் பேணுகிறது; ‘எதிராக’ என்பதைத் தெளிவாகச் சேர்த்து மூலத்தின் உண்மையான பொருள் விரிவை ஒற்றை நீதிமன்ற வாசிப்பாகக் குறுக்கவில்லை.
- issue: בְּנֵיכֶם என்பதிலுள்ள பாலினக் குறிப்பு
  choice: உங்கள் மகன்கள்
  alternative: உங்கள் பிள்ளைகள் / அடுத்த தலைமுறையினர்
  rationale: மூலத்தின் ஆண்பால் பன்மையை முதன்மை உரையில் அப்படியே பேணுகிறது; அது அடுத்த தலைமுறையைப் பரந்த வகையில் பிரதிநிதித்துவப்படுத்தக்கூடிய சாத்தியம் அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘உள்ளத்தில் பதியவையுங்கள்’ என்பது எபிரெய மொழிமரபை இயல்பாக எடுத்துரைக்கிறது; ‘காத்துச் செயல்படுத்துதல்’ கீழ்ப்படிதலின் கவனமும் நடைமுறையும் ஆகிய இரண்டையும் பேணுகிறது.
