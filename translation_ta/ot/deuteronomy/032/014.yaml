translation:
  language: ta
  text: மாட்டுப் பாலிலான தயிரும்[a], ஆட்டுமந்தையின் பாலும், செம்மறியாட்டுக் குட்டிகளின் கொழுப்பும், பாசானில் வளர்ந்த செம்மறியாட்டுக் கடாக்களும், வெள்ளாட்டுக் கடாக்களும், மிகச் சிறந்த கோதுமையும் உனக்குக் கிடைத்தன; திராட்சையின் இரத்தமாகிய நுரைக்கும் திராட்சரசத்தை[b] நீ குடித்தாய்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரேயச் சொல் கெட்டியான அல்லது புளித்த பால் உணவைக் குறிக்கலாம்; ‘வெண்ணெய்’ அல்லது ‘பாற்கொழுப்பு’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘சிவந்த திராட்சரசம்’ என்றும் மொழிபெயர்க்கலாம்; எபிரேயச் சொல் நன்றாகப் புளித்த அல்லது நுரைக்கும் திராட்சரசத்தை நினைவூட்டக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֶמְאַת בָּקָר
  choice: மாட்டுமந்தையின் தயிராடை
  rationale: חֶמְאָה என்பது இன்றைய வெண்ணெயைக் காட்டிலும் கெட்டியான அல்லது புளித்த பால் உணவைக் குறிக்கலாம். தமிழில் இயல்பாகப் புரியும் ‘தயிராடை’ அந்த மேய்ப்பியல் உணவுப் படிமத்தைத் தக்கவைக்கிறது; בָּקָר கூட்டாக மாடுகளைக் குறிக்கிறது.
- source_word: חֲלֵב צֹאן
  choice: ஆட்டுமந்தையின் பால்
  rationale: צֹאן சிறிய கால்நடைகளின் மந்தையைக் குறிக்கும் கூட்டுப்பெயர். பின்னர் வெள்ளாட்டுக் கடாக்கள் தனியாக வருவதால், தமிழில் இயல்பான ‘ஆட்டுமந்தை’ இங்கு பொருத்தமானது.
- source_word: חֵלֶב כָּרִים
  choice: செம்மறியாட்டுக் குட்டிகளின் கொழுப்பு
  rationale: חֵלֶב என்பதன் நேரடியான பொருள் ‘கொழுப்பு’; כָּרִים இளம் செம்மறியாடுகளை அல்லது கொழுத்த குட்டிகளைச் சுட்டுகிறது. செழுமையின் கண்கூடான படிமத்தை மொழிபெயர்ப்பு காக்கிறது.
- source_word: אֵילִים בְּנֵי בָשָׁן
  choice: பாசானில் வளர்ந்த செம்மறியாட்டுக் கடாக்கள்
  rationale: אֵילִים ஆண் செம்மறியாடுகள்; בְּנֵי בָשָׁן சொல்லுக்கு சொல் ‘பாசானின் மகன்கள்’ என்றாலும், பாசான் பகுதியில் வளர்க்கப்பட்ட விலங்குகள் என்பதே இயல்பான பொருள்.
- source_word: עַתּוּדִים
  choice: வெள்ளாட்டுக் கடாக்கள்
  rationale: இந்தச் சொல் குறிப்பாக ஆண் வெள்ளாடுகளைக் குறிக்கக்கூடும்; அந்த விவரத்தைத் தமிழில் வெளிப்படையாகத் தக்கவைத்துள்ளது.
- source_word: חֵלֶב כִּלְיוֹת חִטָּה
  choice: மிகச் சிறந்த கோதுமை
  rationale: சொல்லுக்கு சொல் ‘கோதுமையின் சிறுநீரகங்களின் கொழுப்பு’ என்ற எபிரேய மரபுத்தொடர், மிகச் செழுமையான அல்லது தேர்ந்த கோதுமையைக் குறிக்கிறது. புரியாத உடற்கூறு உருவகத்தை நேரடியாக இறக்காமல் அதன் உயர்தரப் பொருளை இயல்பான தமிழில் வழங்குகிறது.
- source_word: דַם עֵנָב
  choice: திராட்சையின் இரத்தம்
  rationale: திராட்சரசத்தைக் குறிக்கும் வலிமையான கவிதை உருவகம்; அதன் கவித்துவத் தாக்கம் தக்கவைக்கப்பட்டது.
- source_word: תִּשְׁתֶּה
  choice: நீ குடித்தாய்
  rationale: இரண்டாம் நபர் ஆண்பால் ஒருமை imperfect வடிவம் பாடலின் கடந்தகால விவரிப்பில் வருகிறது; தமிழில் எளிய இறந்தகாலம் சூழலுக்கு ஏற்றது.
- source_word: חָמֶר
  choice: நுரைக்கும் திராட்சரசம்
  rationale: இந்தச் சொல் திராட்சரசத்தைக் குறிக்கிறது; அதன் புளித்தல் அல்லது நுரைத்தல் சார்ந்த நிழற்பொருள் இருக்கலாம். உறுதியின்மையை அடிக்குறிப்பு பதிவு செய்கிறது.
theological_decisions:
- issue: செழுமையை விவரிக்கும் கவிதைப் படிமங்களை மறைபொருளாக்காமல் மொழிபெயர்த்தல்
  choice: மேய்ப்பியல் மற்றும் வேளாண் வளத்தின் கண்கூடான உணவு, பானப் படிமங்கள் தக்கவைக்கப்பட்டன.
  alternative: உடன்படிக்கை ஆசீர்வாதம் அல்லது ஆடம்பரம் என்று கருத்துரைத்துச் சுருக்குதல்
  rationale: வசனம் இறைவன் அளித்த வளத்தை உணவு மற்றும் பானங்களின் பட்டியலால் வர்ணிக்கிறது. மூலத்தில் வெளிப்படையாக இல்லாத இறையியல் கருத்தாக்கம் சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், கவிதைத் தன்மையும் கண்ணியமும் காக்கப்பட்டுள்ளன. பட்டியலின் இணைநிலையைத் தெளிவாக்க ‘உனக்குக் கிடைத்தன’ சேர்க்கப்பட்டுள்ளது; இது எபிரேயக் கவிதையில் முன்சூழலிலிருந்து தொடரும் வழங்குதலை இயல்பான தமிழில் வெளிப்படுத்துகிறது. ‘பாசான்’ என்ற இடப்பெயரும் ‘திராட்சையின் இரத்தம்’ என்ற உருவகமும் பாதுகாக்கப்பட்டுள்ளன.
