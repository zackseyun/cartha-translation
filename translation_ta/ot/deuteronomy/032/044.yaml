    rationale: மூலத்தில் ஒரு உரைத்தல் வினை மட்டுமே உள்ளது; இறுதியில் வரும் ‘அவனும் ஓசேயாவும்’ அந்தச் செயலில் இணைந்தவர்களைக் குறிக்கிறது. தற்போதைய தமிழ் வடிவம் மோசே தனியாகவும் பின்னர் இருவரும் மீண்டும் தனியாகவும் பாடலை உரைத்தனர் எனத் தோற்றமளிக்கிறது.
