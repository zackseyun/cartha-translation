revisions:
- from: பின்பு மோசே வந்து, இந்தப் பாடலின் வார்த்தைகள் அனைத்தையும் மக்கள் கேட்கும்படி உரைத்தார்; அவரும் நூனின் மகன் ஓசேயாவும்[a] உரைத்தார்கள்.
  to: பின்பு மோசேயும் நூனின் மகன் ஓசேயாவும் வந்து, இந்தப் பாடலின் எல்லா வார்த்தைகளையும் மக்கள் கேட்கும்படி உரைத்தார்கள்.[a]
  rationale: மீள்வினையை நீக்கி, மூலத்தின் இறுதியில் இணைக்கப்பட்ட இரு நபர்களையும் தமிழில் ஒரே இணை எழுவாயாக அமைத்துள்ளோம். இதனால் செயல் ஒருமுறை மட்டுமே கூறப்படுகிறது; அதே நேரத்தில் மோசேயும் ஓசேயாவும் பாடலின் வார்த்தைகளை உரைத்தனர் என்ற வாக்கியத்தின் இயல்பான பொருள் தெளிவாகிறது. பெயரின் மூல வடிவமும் அடிக்குறிப்பு விளக்கமும் மாற்றப்படவில்லை.
