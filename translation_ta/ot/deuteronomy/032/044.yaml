source:
  edition: WLC
  text: וַ/יָּבֹ֣א מֹשֶׁ֗ה וַ/יְדַבֵּ֛ר אֶת כָּל דִּבְרֵ֥י הַ/שִּׁירָֽה הַ/זֹּ֖את בְּ/אָזְנֵ֣י הָ/עָ֑ם ה֖וּא וְ/הוֹשֵׁ֥עַ בִּן נֽוּן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/044.yaml
  text: Then Moses came and spoke all the words of this song in the hearing of the people[a], he and Hoshea son of Nun.
translation:
  language: ta
  text: பின்பு மோசேயும் நூனின் மகன் ஓசேயாவும் வந்து, இந்தப் பாடலின் எல்லா வார்த்தைகளையும் மக்கள் கேட்கும்படி உரைத்தார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் “ஓசேயா”; இவர் மற்ற இடங்களில் பொதுவாக யோசுவா என்று அழைக்கப்படுகிறார் (எண் 13:16 பார்க்கவும்).
    reason: மூல உரையிலுள்ள பெயர்வடிவத்துக்கும் வாசகர்களுக்குப் பரிச்சயமான பெயருக்கும் உள்ள வேறுபாட்டைத் தெளிவுபடுத்துகிறது.
lexical_decisions:
- source_word: וַיָּבֹא
  choice: வந்து
  rationale: בוא என்பதன் இயல்பான கதைநடைப் பொருள் ‘வந்தார்’; திசையைத் தேவையின்றி மிகைப்படுத்தாமல் நிகழ்வின் தொடர்ச்சியை இது காட்டுகிறது.
- source_word: וַיְדַבֵּר
  choice: உரைத்தார் / உரைத்தார்கள்
  rationale: דבר என்பதன் நேரடியான பொருள் ‘பேசுதல், உரைத்தல்.’ பாடலின் சொற்களை வாய்மொழியாக அறிவித்த சூழலில் ‘உரைத்தல்’ இயல்பாகவும் கண்ணியமாகவும் உள்ளது. எபிரெய வாக்கியத்தின் இறுதியில் இணைக்கப்பட்ட இரண்டாம் நபரைத் தமிழில் தெளிவுபடுத்த பன்மை வினை மீண்டும் தரப்பட்டுள்ளது.
- source_word: אֶת כָּל דִּבְרֵי
  choice: வார்த்தைகள் அனைத்தையும்
  rationale: ‘எல்லா வார்த்தைகளையும்’ என்ற முழுமையைப் பாதுகாக்கிறது; ‘செய்தி’ என்று சுருக்கவில்லை.
- source_word: הַשִּׁירָה הַזֹּאת
  choice: இந்தப் பாடலின்
  rationale: שירה இச்சூழலில் பாடலைக் குறிக்கிறது; ‘கவிதை’ என்பதைக் காட்டிலும் உடனடி இலக்கியச் சூழலுடன் பொருந்துகிறது.
- source_word: בְּאָזְנֵי הָעָם
  choice: மக்கள் கேட்கும்படி
  rationale: சொல்லுக்கு சொல் ‘மக்களின் காதுகளில்’ என்ற எபிரெய மரபுத்தொடரின் இயல்பான தமிழ் வடிவம்; பொதுமக்கள் முன்னிலையில் வாய்மொழியாக உரைத்த பொருளைப் பாதுகாக்கிறது.
- source_word: הָעָם
  choice: மக்கள்
  rationale: עם இங்கு உடன்படிக்கைச் சமூகமாகக் கூடியிருந்த மக்களைக் குறிக்கிறது; ‘மக்கள்’ என்பது பரந்ததும் இயல்பானதும் ஆகும்.
- source_word: הוּא וְהוֹשֵׁעַ
  choice: அவரும் ... ஓசேயாவும்
  rationale: தனிப்பட்ட சுட்டுப்பெயரையும் இணைந்த துணைநபரையும் வெளிப்படையாக வைத்திருக்கிறது. தமிழில் பொருள் தெளிவாக இருக்க வினை பன்மையில் மீண்டும் தரப்படுகிறது.
- source_word: וְהוֹשֵׁעַ
  choice: ஓசேயா
  rationale: இவ்வசனத்தின் எபிரெய உரை הוֹשֵׁעַ என்ற பெயரையே கொண்டுள்ளது; பரிச்சயமான ‘யோசுவா’ என ஒத்திசைக்காமல் மூலப் பெயர்வடிவம் ஒலிபெயர்க்கப்படுகிறது.
- source_word: בִּן נוּן
  choice: நூனின் மகன்
  rationale: எபிரெய தந்தைவழி அடையாளத்தின் இயல்பான நவீனத் தமிழ் வடிவம்.
theological_decisions:
- issue: மோசேயின் துணைநபரின் பெயரை ‘ஓசேயா’ எனவா, பரிச்சயமான ‘யோசுவா’ எனவா தருவது
  choice: ஓசேயா
  alternative: யோசுவா
  rationale: மசோரா எபிரெய உரையில் இங்கு הוֹשֵׁעַ என்று வெளிப்படையாக உள்ளது. ஆகவே பெயரை வேறு வசனங்களோடு ஒத்திசைக்காமல் மூல வடிவமே பிரதான உரையில் வைக்கப்படுகிறது; வாசகருக்கு உதவ மாற்றுப் பரிச்சயப் பெயர் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான வேதாகமக் கதைநடை பயன்படுத்தப்பட்டுள்ளது. எபிரெயத்தில் ஒருமை வினைக்குப் பின் ‘அவரும் ஓசேயாவும்’ சேரும் சற்றுக் கடினமான அமைப்பு உள்ளது; மோசே மட்டும் பேசினார் என்ற தவறான எண்ணத்தைத் தவிர்க்க, தமிழில் இணை எழுவாயைத் தெளிவாக்கி ‘உரைத்தார்கள்’ என்று வினை மீண்டும் தரப்பட்டுள்ளது.
