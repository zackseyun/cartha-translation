  text: וְ/אָמַ֖ר אֵ֣י אֱלֹהֵ֑י/מוֹ צ֖וּר חָסָ֥יוּ בֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/037.yaml
  text: And he will say[a], ‘Where are their gods, the rock in which they took refuge?’
translation:
  language: ta
  text: 'அவர் சொல்வார்: “அவர்களுடைய தெய்வங்கள்—அவர்கள் அடைக்கலம் புகுந்த பாறை—எங்கே?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאָמַר
  choice: அவர் சொல்வார்
  rationale: கவிதைச் சூழலில் இணைப்புடன் வரும் வினை வடிவம், ஆண்டவர் தொடர்ந்து கூறப்போகும் சொல்லைக் குறிக்கும் எதிர்காலப் பொருளில் இயல்பாகப் புரிகிறது. தமிழில் வசனத் தொடக்கத்தில் தேவையற்ற ‘மேலும்’ என்பதைக் காட்டிலும் இவ்வடிவம் இயல்பானது.
- source_word: אֵי
  choice: எங்கே?
  rationale: ‘எங்கே?’ என்னும் வினாவை நேரடியாகக் கொடுக்கிறது. அடுத்துள்ள பன்மைப் பொருளான ‘அவர்களுடைய தெய்வங்கள்’ என்பதோடு தமிழ் வாக்கியம் இயல்பாக அமைகிறது.
- source_word: אֱלֹהֵימוֹ
  choice: அவர்களுடைய தெய்வங்கள்
  rationale: மூன்றாம் நபர் ஆண்பால் பன்மை உடைமை விகுதியுடன் வரும் பன்மைப் பொருளைத் தெளிவாகப் பாதுகாக்கிறது; பொய்த் தெய்வங்களின் இயலாமையை வெளிப்படுத்தும் சூழலுக்கும் பொருந்துகிறது.
- source_word: צוּר
  choice: பாறை
  rationale: சொல்லின் நேரடியான உருவகப் பொருளைப் பாதுகாக்கிறது. இங்கு அது ஆண்டவருக்கான பட்டமல்ல; அவர்கள் நம்பிய தெய்வங்களைப் பாதுகாப்பளிக்கும் பாறையாக ஏளனமாகச் சுட்டுகிறது.
- source_word: חָסָיוּ
  choice: அவர்கள் அடைக்கலம் புகுந்த
  rationale: חסה என்பதன் ‘அடைக்கலம் நாடுதல்/புகுதல்’ என்ற தெளிவான உருவகத்தைப் பாதுகாக்கிறது; வெறும் ‘நம்பின’ என்பதைவிட மூலத்தின் படிமத்திற்கு நெருக்கமானது.
- source_word: בּוֹ
  choice: பாறை எங்கே?
  rationale: எபிரெயத்தில் ‘அதில்/அவனில்’ என்ற ஒருமைச் சுட்டு ‘பாறை’ என்பதைக் குறிக்கிறது. தமிழில் ‘அவர்கள் அடைக்கலம் புகுந்த பாறை’ என்ற தொடர்பெயர் அமைப்பு இதை இயல்பாக வெளிப்படுத்துகிறது; மீண்டும் வரும் ‘எங்கே?’ மூல வினாவை இரு இணைச் சுட்டுகளுக்கும் தெளிவுபடுத்துகிறது.
theological_decisions:
- issue: பேசுபவர் யார், வினையின் காலப்பொருள் என்ன
  choice: ஆண்டவர் எதிர்காலத்தில் ஏளனமாகக் கேட்பதாக ‘அவர் சொல்வார்’ என மொழிபெயர்க்கப்பட்டது.
  alternative: ‘அவர் சொன்னார்’ அல்லது ‘அப்போது ஒருவர் சொல்வார்’
  rationale: உபாகமம் 32:36–38-ன் ஓட்டத்தில், ஆண்டவர் தமது மக்களை நியாயந்தீர்த்து அவர்கள் நம்பிய பொய்த் தெய்வங்களின் இயலாமையை வெளிப்படுத்தும்போது கூறும் சொல் எனப் புரிவதே மிகவும் இயல்பானது. கவிதை நடையில் எபிரெய வினை வடிவம் இத்தகைய எதிர்காலப் பொருளை ஏற்கிறது.
- issue: ‘பாறை’ என்பதன் தெய்வீகப் பட்டப் பொருள்
  choice: சாதாரணப் பெயராக ‘பாறை’
  alternative: ஆண்டவரைக் குறிக்கும் சிறப்புப் பட்டமாக ‘பாறை’
  rationale: இந்த இடத்தில் உடனடி முன்னிலைச் சொல் ‘அவர்களுடைய தெய்வங்கள்’ என்பதாகும். எனவே பொய்த் தெய்வங்களைப் பாதுகாப்பான பாறையாகக் கருதியதை ஏளனமாகச் சொல்கிறது; ஆண்டவருக்குரிய பட்டப் பொருளை இங்கு கொண்டுவரவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதாகவும் கண்ணியமான கவிதைத் தொனியுடனும் அமைக்கப்பட்டது. ‘அடைக்கலம் புகுந்த’ என்பது மூலத்தின் பாறை/பாதுகாப்பு உருவகத்தைத் தக்கவைக்கிறது. எபிரெயத்தின் எண்ணிக்கை மாறுபாடு மற்றும் விளக்கப்பெயர் அமைப்பு அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
