  text: לוּלֵ֗י כַּ֤עַס אוֹיֵב֙ אָג֔וּר פֶּֽן יְנַכְּר֖וּ צָרֵ֑י/מוֹ פֶּן יֹֽאמְרוּ֙ יָדֵ֣י/נוּ רָ֔מָה וְ/לֹ֥א יְהוָ֖ה פָּעַ֥ל כָּל זֹֽאת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/027.yaml
  text: Were it not that I feared the provocation of the enemy[a], lest their adversaries should misunderstand, lest they should say, ‘Our hand is exalted[c][b], and Yahweh has not done all this.’
translation:
  language: ta
  text: எதிரியின் ஆத்திரமூட்டலைக் குறித்து நான் அஞ்சியிருக்காவிட்டால்[a]—அவர்களுடைய பகைவர்கள் உண்மையைத் தவறாகப் புரிந்துகொண்டு[b], ‘எங்கள் கை ஓங்கிவிட்டது[c]; யாவே இவை அனைத்தையும் செய்யவில்லை’ என்று சொல்லிவிடக்கூடும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எதிரியின் சீற்றத்துக்கு நான் அஞ்சியிருக்காவிட்டால்.”
    reason: lexical_alternative
  - marker: b
    text: “தவறாகப் புரிந்துகொள்வார்கள்” என்று மொழிபெயர்க்கப்பட்டுள்ள எபிரேய வினை கடினமானது; “தவறாக மதிப்பிடுவார்கள்” அல்லது இஸ்ரவேலின் வீழ்ச்சிக்கான உண்மைக் காரணத்தை “உணரத் தவறுவார்கள்” என்றும் இதைப் புரிந்துகொள்ளலாம்.
    reason: lexical_alternative
  - marker: c
    text: சொல்லுக்கு சொல், “எங்கள் கை உயர்ந்திருக்கிறது.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לוּלֵי
  choice: அஞ்சியிராவிட்டால்
  rationale: முந்தைய தீர்ப்புச் செயலைத் தடுக்கும் எதிர்நிலை நிபந்தனையை இயல்பான தமிழில் வெளிப்படுத்துகிறது; வசனத்தின் தொடர்ச்சித் தன்மையையும் காக்கிறது.
- source_word: כַּעַס אוֹיֵב
  choice: எதிரியின் ஆத்திரமூட்டல்
  rationale: כַּעַס இங்கு எதிரி காட்டும் கோபத்தையோ, அவன் ஆத்திரமூட்டும் இகழ்ச்சியையோ குறிக்கலாம். ‘ஆத்திரமூட்டல்’ எதிரியின் இறுமாப்பான எதிர்வினையை முன்னிறுத்துகிறது; மாற்று வாசிப்பு அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: אָגוּר
  choice: நான் அஞ்சியிராவிட்டால்
  rationale: மூலத்தின் முதலாம் நபர் ‘அஞ்சுதல்/பயப்படுதல்’ சொல்லை மிருதுவாக்காமல் வைத்திருக்கிறது. இது பலவீனத்தால் உண்டான பயம் என்று உரை கூறவில்லை.
- source_word: פֶּן
  choice: சொல்லிவிடக்கூடும்
  rationale: மீண்டும் வரும் தடுப்பு அல்லது அச்சக் கருத்தை தமிழில் இயல்பான சாத்தியவினை அமைப்பில் தருகிறது.
- source_word: יְנַכְּרוּ
  choice: உண்மையைத் தவறாகப் புரிந்துகொண்டு
  rationale: கடினமான פיעל வடிவம் இச்சூழலில் இஸ்ரவேலின் வீழ்ச்சிக்கான உண்மைக் காரணத்தை எதிரிகள் தவறாக மதிப்பிடுவதைக் குறிக்கிறது; ‘உண்மையை’ என்பது சூழல் தெளிவுக்கான குறைந்த அளவிலான நிரப்பல்.
- source_word: צָרֵימוֹ
  choice: அவர்களுடைய பகைவர்கள்
  rationale: பகைமை கொண்ட எதிரிகளைச் சுட்டும் வடிவத்தையும் அதன் பன்மைச் சூழலையும் காக்கிறது.
- source_word: יָדֵינוּ רָמָה
  choice: எங்கள் கை ஓங்கிவிட்டது
  rationale: ‘கை உயர்ந்தது’ என்ற எபிரேய உருவகத்தை இயல்பான தமிழில் காத்து, வெற்றி மற்றும் சுயப்பெருமை இரண்டையும் உணர்த்துகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரை ஒரு பட்டப்பெயரால் மாற்றாமல், தமிழில் வழக்கமான ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: פָּעַל כָּל זֹאת
  choice: இவை அனைத்தையும் செய்தவர்
  rationale: செய்தல் அல்லது நிகழ்த்துதல் என்ற வினையின் நேரடியான பொருளைத் தருகிறது; இஸ்ரவேலுக்கு நேர்ந்ததை யாவே செய்தார் என்பதை எதிரிகள் மறுப்பதே மேற்கோளின் கருத்து.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் உள்ள தனிப்பட்ட பெயரைப் பட்டப்பெயராக மாற்றாமல் ஒலிபெயர்க்கிறது.
- issue: ‘நான் அஞ்சினேன்’ என்ற மனித உணர்வை இறைவனுக்குப் பொருத்தும் மொழி
  choice: அஞ்சுதல் என்ற நேரடி சொல்லைத் தக்கவைத்தல்
  alternative: கவலைப்பட்டேன் / கருதினேன்
  rationale: எபிரேய வினையின் வெளிப்படையான பதற்றத்தை மறைக்கவில்லை. எதிரி நிகழ்வைத் தவறாகப் புரிந்துகொள்வதே இந்த அச்சத்தின் பொருள் என்பதை உடனிருக்கும் சூழல் விளக்குகிறது.
- issue: יְנַכְּרוּ என்ற கடினமான வினையின் பொருள்
  choice: உண்மையைத் தவறாகப் புரிந்துகொள்வது
  alternative: தவறாக மதிப்பிடுவது / உண்மைக் காரணத்தை உணரத் தவறுவது
  rationale: அடுத்த மேற்கோள் எதிரிகள் தங்கள் வல்லமையே வென்றதாகக் கூறுவார்கள் என்பதால், தவறான காரணவிளக்கமே சூழலுக்கு மிகச் சரியாகப் பொருந்துகிறது; உறுதியின்மை அடிக்குறிப்பில் காக்கப்படுகிறது.
translation_notes:
  register: நவீன தரத்தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் dignified நடையில் அமைக்கப்பட்டுள்ளது. ‘ஆத்திரமூட்டல்,’ ‘கை ஓங்கிவிட்டது’ ஆகியவை முறையே எதிரியின் இறுமாப்பான தூண்டுதலையும் வெற்றிப் பெருமித உருவகத்தையும் காக்கின்றன. வசனம் முந்தைய வாக்கியத்தின் நிபந்தனைத் தொடர்ச்சியாக இருப்பதால் தொடக்கத்தில் எதிர்நிலை நிபந்தனைப் பேணப்பட்டுள்ளது.
