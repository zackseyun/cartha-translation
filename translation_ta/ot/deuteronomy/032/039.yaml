  text: רְא֣וּ עַתָּ֗ה כִּ֣י אֲנִ֤י אֲנִי֙ ה֔וּא וְ/אֵ֥ין אֱלֹהִ֖ים עִמָּ/דִ֑י אֲנִ֧י אָמִ֣ית וַ/אֲחַיֶּ֗ה מָחַ֨צְתִּי֙ וַ/אֲנִ֣י אֶרְפָּ֔א וְ/אֵ֥ין מִ/יָּדִ֖/י מַצִּֽיל׀׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/039.yaml
  text: See now that I[a], even I, am he, and there is no god beside me. I put to death and I make alive; I have wounded, and I will heal[e][d][c][b]; and there is no one who can deliver from my hand.
translation:
  language: ta
  text: '“இப்போது பாருங்கள்: நானே அவர்[a]; என்னுடன் வேறு தெய்வம் இல்லை.[b] நான் கொல்கிறேன்; நானே உயிர்ப்பிக்கிறேன். நான் காயப்படுத்தினேன்; நானே குணமாக்குவேன்.[c] என் கையிலிருந்து யாரும் விடுவிக்க முடியாது.[d]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொற்சொல்லாக, “நான், நான் அவர்.” இருமுறை வரும் “நான்” வலியுறுத்துகிறது.
    reason: மூலமொழி வடிவம்
  - marker: b
    text: அல்லது, “என்னுடன் தெய்வம் இல்லை”; கருத்துப்படி, “என்னைத் தவிர வேறு தெய்வம் இல்லை.”
    reason: சொற்பொருள் மாற்றுவழி
  - marker: c
    text: “காயப்படுத்தினேன்” என்பதற்கான எபிரெய வினை “நொறுக்கினேன்” என்ற வலிமையான பொருளையும் தரலாம்.
    reason: சொற்பொருள் மாற்றுவழி
  - marker: d
    text: “என் கையிலிருந்து” என்பது ஒருவரின் அதிகாரத்திலிருந்தோ கட்டுப்பாட்டிலிருந்தோ தப்புவதைக் குறிக்கும் எபிரெயச் சொல்லாட்சி.
    reason: பண்பாட்டு சொல்லாட்சி
lexical_decisions:
- source_word: רְאוּ עַתָּה
  choice: இப்போது பாருங்கள்
  rationale: பன்மை ஏவல் வினையான ‘பாருங்கள்’ நேரடியான அறிதல் அழைப்பைக் காக்கிறது; עַתָּה என்பதன் கால வலியுறுத்தலை ‘இப்போது’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: כִּי אֲנִי אֲנִי הוּא
  choice: நான், நானே அவர் என்பதை
  rationale: இருமுறை வரும் אֲנִי என்பதன் வலியுறுத்தலை ‘நான், நானே’ காக்கிறது. הוּא என்பதற்கு மேலதிக இறையியல் விளக்கத்தைச் சேர்க்காமல் ‘அவர்’ என்று மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: וְאֵין אֱלֹהִים עִמָּדִי
  choice: என்னுடன் வேறு தெய்வம் இல்லை
  rationale: עִם என்பதன் அடிப்படை ‘உடன்’ பொருளைக் காக்கும் அதேவேளையில், சூழலில் வெளிப்படும் போட்டித் தெய்வமின்மையை ‘வேறு தெய்வம் இல்லை’ தெளிவுபடுத்துகிறது.
- source_word: אֲנִי אָמִית וַאֲחַיֶּה
  choice: நான் கொல்கிறேன்; நானே உயிர்ப்பிக்கிறேன்
  rationale: מות என்பதன் causative வடிவத்தைத் தமிழில் தெளிவான ‘கொல்கிறேன்’ என்றும், חיה என்பதைக் காரணவினையான ‘உயிர்ப்பிக்கிறேன்’ என்றும் அளிக்கிறது; இரண்டிற்கும் இடையிலான கவிதை எதிரிணை காக்கப்படுகிறது.
- source_word: מָחַצְתִּי וַאֲנִי אֶרְפָּא
  choice: நான் காயப்படுத்தினேன்; நானே குணமாக்குவேன்
  rationale: מָחַץ காயப்படுத்துதல் முதல் நொறுக்குதல் வரை வலிமை கொண்டது; குணமாக்குதலுடன் உள்ள நேரடி எதிரிணைக்காக முதன்மை உரையில் ‘காயப்படுத்தினேன்’ தேர்ந்தெடுக்கப்பட்டது. முற்றுவினை–முற்றாத வினை வேறுபாடு கடந்த செயலும் வருங்கால குணமாக்குதலுமாக வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: וְאֵין מִיָּדִי מַצִּיל
  choice: என் கையிலிருந்து விடுவிப்பவர் எவரும் இல்லை
  rationale: מַצִּיל என்ற செயப்பெயர் வடிவமும் இருப்பின்மைக் கூற்றும் நேரடியாகக் காக்கப்படுகின்றன; ‘என் கை’ என்ற எபிரெயச் சொல்லாட்சியும் முதன்மை உரையில் விடப்பட்டுள்ளது.
theological_decisions:
- issue: மற்ற தெய்வங்கள் தொடர்பான இறைவனின் தனித்தன்மை
  choice: என்னுடன் வேறு தெய்வம் இல்லை
  alternative: என்னைத் தவிர வேறு தெய்வம் இல்லை / என்னுடன் தெய்வம் இல்லை
  rationale: சூழல் வேறொரு தெய்வம் இறைவனோடு இணையாக அல்லது துணையாக இல்லை என்ற வலுவான தனித்தன்மைக் கூற்றைக் கொண்டுள்ளது. பின்னாளைய மெய்யியல் சொற்களைச் சேர்க்காமல் அந்த வலிமை காக்கப்படுகிறது.
- issue: ‘நான், நானே அவர்’ என்பதன் இறையியல் எதிரொலி
  choice: எபிரெய உரையின் சுருக்கமான, வலியுறுத்தப்பட்ட வடிவத்தைப் பேணுதல்
  alternative: நான் ஒருவரே அவர் / நானே அந்த ஒரே இறைவன்
  rationale: இத்தொடருக்கு விரிவான வேதாகம எதிரொலிகள் இருக்கலாம்; ஆனால் மூலத்தில் இல்லாத கோட்பாட்டு விரிவாக்கத்தைச் சேர்க்காமல், இரட்டைப் பெயர்ச்சொல் வலியுறுத்தல் மட்டும் காக்கப்படுகிறது.
- issue: உயிரையும் மரணத்தையும், காயத்தையும் குணமாக்குதலையும் ஆளும் இறை அதிகாரம்
  choice: இரு எதிரிணைகளையும் நேரடியாகக் காக்குதல்
  alternative: தீர்ப்பு மற்றும் மீட்பு என்று விளக்கிப் பொருளுரைத்தல்
  rationale: வசனம் செயலை நேரடியாக இறைவனுக்குரியதாகக் கூறுகிறது. அதை மென்மைப்படுத்தாமலும் குறிப்பிட்ட கோட்பாட்டு அமைப்புக்குள் சுருக்காமலும் மொழிபெயர்க்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன பொதுத்தமிழில் தெளிவாகவும், மோசேயின் பாடலுக்கேற்ற கண்ணியமான கவிதைநடையிலும் வடிவமைக்கப்பட்டது. ‘நான்/நானே’ என்ற மீளுரைகள் மூலத்தின் இறை வலியுறுத்தலைக் காக்கின்றன; தேவையற்ற பழமொழிநடை மற்றும் சமயப்பிரிவு சார்ந்த சொற்கள் தவிர்க்கப்பட்டுள்ளன.
