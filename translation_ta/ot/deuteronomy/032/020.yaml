  text: וַ/יֹּ֗אמֶר אַסְתִּ֤ירָה פָנַ/י֙ מֵ/הֶ֔ם אֶרְאֶ֖ה מָ֣ה אַחֲרִיתָ֑/ם כִּ֣י ד֤וֹר תַּהְפֻּכֹת֙ הֵ֔מָּה בָּנִ֖ים לֹא אֵמֻ֥ן בָּֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/020.yaml
  text: And he said[a], “I will hide my face from them; I will see what their end will be, for they are a perverse generation[b], children in whom there is no faithfulness.”
translation:
  language: ta
  text: 'அவர் சொன்னார்: “நான் என் முகத்தை அவர்களிடமிருந்து மறைப்பேன்; அவர்களுடைய முடிவு என்னவாகும் என்று பார்ப்பேன். ஏனெனில் அவர்கள் நெறிபிறழ்ந்த தலைமுறையினர்[a]; நம்பகத்தன்மையற்ற பிள்ளைகள்[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எழுத்துப்படி, “சீர்கேடுகளின் தலைமுறை”; அல்லது “வக்கிரமான தலைமுறை.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது “உடன்படிக்கையில் உண்மையில்லாத பிள்ளைகள்” அல்லது “விசுவாசமில்லாத பிள்ளைகள்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אַסְתִּירָה פָנַי מֵהֶם
  choice: நான் என் முகத்தை அவர்களிடமிருந்து மறைத்துக்கொள்வேன்
  rationale: ‘முகத்தை மறைத்தல்’ என்ற எபிரேய உடன்படிக்கைச் சொற்றொடரைத் தக்கவைத்து, அருள் அல்லது பிரசன்னத்தை விலக்கிக்கொள்ளும் கருத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: אֶרְאֶה מָה אַחֲרִיתָם
  choice: அவர்களுடைய முடிவு என்னவாகும் என்று பார்ப்பேன்
  rationale: אַחֲרִית என்பதன் ‘முடிவு/இறுதி விளைவு’ என்ற பொருளையும் மூலத்தின் கடுமையான தொனியையும் காக்கிறது.
- source_word: דּוֹר תַּהְפֻּכֹת
  choice: சீர்கெட்ட தலைமுறையினர்
  rationale: תַּהְפֻּכֹת குறிக்கும் புரட்டுத்தன்மை, வக்கிரம், ஒழுக்கச் சீர்கேடு ஆகிய பொருள் வட்டத்தை வாசிக்க இயல்பான தமிழில் தருகிறது; மூலத்தின் பெயர்ச்சொல் அமைப்புக்கான மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: בָּנִים
  choice: பிள்ளைகள்
  rationale: இங்கு மக்களைக் கடவுளின் சந்ததியினராகப் பொதுவாகக் குறிப்பதால், ‘மகன்கள்’ என்பதைவிட ‘பிள்ளைகள்’ பொருத்தமானது.
- source_word: לֹא אֵמֻן בָּם
  choice: உண்மைத்தன்மை இல்லாத
  rationale: אֵמֻן குறிக்கும் நம்பகத்தன்மை, விசுவாசம், உறவுசார் நிலைத்தன்மை ஆகியவற்றை ‘உண்மைத்தன்மை’ சுருக்கமாகத் தாங்குகிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
theological_decisions:
- issue: தெய்வீக ‘முகத்தை மறைத்தல்’ என்ற மனித உருவக உடன்படிக்கைச் சொற்றொடர்
  choice: ‘நான் என் முகத்தை அவர்களிடமிருந்து மறைத்துக்கொள்வேன்’ என்று உருவகத்தைத் தக்கவைத்தல்
  alternative: ‘நான் அவர்களைவிட்டு விலகுவேன்’ அல்லது ‘அவர்களைப் புறக்கணிப்பேன்’
  rationale: மூல உருவகம் கடவுளின் அருள்/பிரசன்னம் விலக்கப்படுவதைக் குறிக்கிறது; அதை பொதுவான விலகலாகத் தட்டையாக்காமல் அதன் இறையியல் அழுத்தத்தைப் பாதுகாக்கிறது.
- issue: אֵמֻן என்பதன் உறவுசார் குற்றச்சாட்டு
  choice: உண்மைத்தன்மை
  alternative: நம்பகத்தன்மை அல்லது விசுவாசம்
  rationale: இது வெறும் மனநம்பிக்கை இல்லாமையை அல்ல, உடன்படிக்கை உறவில் நம்பத்தகுந்த நிலைத்தன்மை இல்லாமையைக் குறிக்கிறது; ஒரே பொருளை மிகையாக நிர்ணயிக்காமல் மாற்றுகள் அடிக்குறிப்பில் தரப்படுகின்றன.
translation_notes:
  register: நவீன தரத் தமிழில், பாடலுக்குரிய கண்ணியமான மற்றும் கடுமையான தொனி பேணப்பட்டுள்ளது. ‘முகத்தை மறைத்தல்’ என்ற மூல உருவகம் நேரடியாகத் தக்கவைக்கப்பட்டு, அரிதான சொற்களைத் தவிர்த்து வாசிப்புத் தெளிவு காக்கப்பட்டுள்ளது.
