source:
  edition: WLC
  text: אָמַ֖רְתִּי אַפְאֵי/הֶ֑ם אַשְׁבִּ֥יתָה מֵ/אֱנ֖וֹשׁ זִכְרָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/026.yaml
  text: I said[a], ‘I would scatter them[b]; I would make their memory cease from mankind,’
translation:
  language: ta
  text: 'நான் சொன்னேன்: “அவர்களைச் சிதறடிப்பேன்[a];

    மனிதர்களிடையே[b] அவர்களுடைய நினைவு இல்லாமல் போகச் செய்வேன்.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்களை ஊதிப் பறக்கச்செய்வேன் / பல இடங்களுக்குச் சிதறச்செய்வேன்.” இங்கு பயன்படுத்தப்பட்டுள்ள எபிரெய வினைச்சொல் அரிதானது; அதன் பொருள் உறுதியாகத் தெரியவில்லை. சிலர் இதை அவர்களை மூலைகளுக்குத் துரத்துவது அல்லது பார்வையிலிருந்து அகற்றுவது என்றும் புரிந்துகொள்கிறார்கள்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “மனிதனிடமிருந்து” அல்லது “சாவுக்குரிய மனிதர்களிடமிருந்து.” எபிரெயில் மனிதர்களைத் தொகுப்பாகக் குறிக்கும் ஒருமைச் சொல் பயன்படுத்தப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָמַרְתִּי
  choice: நான் சொன்னேன்
  rationale: אמר என்பதன் Qal நிறைவுவினை, தன்மை ஒருமை வடிவம். இது ஆண்டவர் தமது நோக்கத்தை உரைப்பதை நேரடியாகக் காட்டுகிறது.
- source_word: אַפְאֵיהֶם
  choice: அவர்களைச் சிதறடிப்பேன்
  rationale: இது அரிதானதும் பொருள் உறுதியாகத் தெரியாததுமான எபிரெய வடிவம். சூழலில் வரும் முழுமையான அழித்தொழிப்பு அச்சுறுத்தலுக்கு ஏற்றவாறு ‘சிதறடிப்பேன்’ என்பது தெளிவான பொருளைத் தருகிறது; அதேவேளையில் மாற்றுப் புரிதல்கள் அடிக்குறிப்பில் பாதுகாக்கப்படுகின்றன.
- source_word: אַשְׁבִּיתָה
  choice: மறையச் செய்வேன்
  rationale: שבת என்பதன் Hiphil வடிவம் ஒன்றை நின்றுபோகச் செய்வதைக் குறிக்கிறது. இங்கு அதன் நேரடிப் பொருள் ‘நினைவு’ என்பதால், அந்த நினைவு மனிதர்களிடையே இல்லாமற்போவதை ‘மறையச் செய்வேன்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: מֵאֱנוֹשׁ
  choice: மனிதகுலத்திலிருந்து
  rationale: אֱנוֹשׁ ஒருமை வடிவில் இருந்தாலும் மனிதர்களைத் தொகுப்பாகக் குறிக்கிறது; மனிதரின் நிலையாமையையும் சுட்டக்கூடும். ‘மனிதகுலத்திலிருந்து’ என்பது அந்தக் கூட்டுப்பொருளை நவீன தமிழில் தெளிவாகத் தருகிறது.
- source_word: זִכְרָם
  choice: அவர்களுடைய நினைவை
  rationale: זֵכֶר நினைவு அல்லது நினைவுகூரப்படுதல் என்பதைக் குறிக்கிறது. ‘அவர்களுடைய நினைவு’ என்பது மனிதர்களின் நினைவிலிருந்து அவர்கள் அழிக்கப்படுவதைச் சுருக்கமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: கவிதை வடிவிலான இறை உரையும் அறிவிக்கப்பட்ட நியாயத்தீர்ப்பு நோக்கமும்
  choice: தமிழில் எதிர்கால நோக்காக ‘சிதறடிப்பேன்… மறையச் செய்வேன்’ என்று வழங்குதல்
  alternative: ‘சிதறடித்திருப்பேன்… மறையச் செய்திருப்பேன்’ என்று நிறைவேறாத எதிர்நிலை வாக்கியமாக வழங்குதல்
  rationale: எபிரெயச் சொற்கள் முதலில் அறிவிக்கப்பட்ட உறுதியான நோக்கை முன்வைக்கின்றன; அடுத்த வசனம் அந்தத் தீர்ப்பைச் செயல்படுத்துவதில் உள்ள தடையைச் சொல்கிறது. ஆகவே இவ்வசனத்திலேயே நிறைவேறாத எதிர்நிலையை மிகத் தெளிவாகச் சேர்க்காமல், தொடர்ச்சியில் நிலவும் இறையியல் பதற்றம் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன செந்தமிழுக்கு ஏற்ற, எளிதில் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. கவிதைநடை காக்க இரு இணையான வரிகள் அமைக்கப்பட்டுள்ளன; அரிதான எபிரெயச் சொல்லின் தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
