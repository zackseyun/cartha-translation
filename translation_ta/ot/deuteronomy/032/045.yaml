  yaml_path: translation/ot/deuteronomy/032/045.yaml
  text: When Moses finished speaking all these words to all Israel,
translation:
  language: ta
  text: மோசே இந்த வார்த்தைகள் அனைத்தையும் இஸ்ரவேல் மக்கள் அனைவரிடமும் பேசி முடித்தபோது,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְכַל
  choice: முடித்தபோது
  rationale: כלה வினையின் wayyiqtol வடிவம் செயல் நிறைவடைந்ததைச் சுட்டுகிறது. அடுத்த வசனத்துடன் தொடரும் வாக்கிய அமைப்பைத் தமிழில் இயல்பாகக் காட்ட, காலத் தொடர்புடைய ‘முடித்தபோது’ பயன்படுத்தப்பட்டது.
- source_word: לְדַבֵּר
  choice: பேசி
  rationale: כלה என்பதுடன் இணைந்த infinitive construct, ‘பேசி முடித்தல்’ என்ற இயல்பான தமிழ் வினைத்தொடராக மொழிபெயர்க்கப்பட்டது.
- source_word: אֶת כָּל הַדְּבָרִים הָאֵלֶּה
  choice: இந்த வார்த்தைகள் அனைத்தையும்
  rationale: דברים இங்கு முந்தைய உரை அல்லது பாடலின் வார்த்தைகளைக் குறிக்கிறது. ‘வார்த்தைகள்’ என்பது மூலத்தின் வெளிப்பாட்டைத் தக்கவைக்கிறது.
- source_word: אֶל כָּל יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்கள் அனைவரிடமும்
  rationale: ‘அனைத்து இஸ்ரவேலிடமும்’ என்பது தமிழில் இயல்பற்றதாக இருப்பதால், கூட்டு மக்களைக் குறிக்கும் பொருளைத் தெளிவாகவும் இயல்பாகவும் தர ‘இஸ்ரவேல் மக்கள் அனைவரிடமும்’ என வழங்கப்பட்டது.
- source_word: מֹשֶׁה
  choice: மோசே
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் நிலைபெற்ற பெயர் வடிவம் பயன்படுத்தப்பட்டது.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழில், எளிமையும் கண்ணியமும் கொண்ட நடை. எபிரெய உரையில் வசனம் அடுத்த கூற்றை நோக்கித் தொடர்வதால் இறுதியில் காற்புள்ளி வைக்கப்பட்டு, ‘முடித்தபோது’ என்ற தொடரமைப்பு பயன்படுத்தப்பட்டுள்ளது.
