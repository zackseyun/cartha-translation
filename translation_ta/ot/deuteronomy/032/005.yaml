id: DEU.32.5
reference: Deuteronomy 32:5
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: שִׁחֵ֥ת ל֛/וֹ לֹ֖א בָּנָ֣י/ו מוּמָ֑/ם דּ֥וֹר עִקֵּ֖שׁ וּ/פְתַלְתֹּֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/005.yaml
  text: They have acted corruptly toward him[a]; they are not his children, because of their defect[b]. They are a crooked and twisted generation.
translation:
  language: ta
  text: அவரிடத்தில் அவர்கள் கேடாக நடந்துகொண்டார்கள்[a]; தங்களுடைய குறையினால் அவர்கள் அவருடைய பிள்ளைகள் அல்ல. அவர்கள் கோணலான, திரிந்துபோன தலைமுறை[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய வாசகம் கடினமும் மிகவும் சுருக்கமானதுமாக உள்ளது. முதல் பகுதியை, “அவர்கள் தங்களையே கெடுத்துக்கொண்டார்கள்” என்றும் புரிந்துகொள்ளலாம்; அடுத்த தொடரை, “அவர்களுடைய களங்கம்” அல்லது “அவர்களுடைய குற்றம்” என்றும் மொழிபெயர்க்கலாம்.
    reason: alternative_reading
  - marker: b
    text: அல்லது, “வக்கிரமும் கோணலுமான தலைமுறை.”
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁחֵת
  choice: சீர்கெட்டு நடந்துகொண்டார்கள்
  rationale: פיעל வடிவம் சீரழிந்த அல்லது கேடான நடத்தையைச் சுட்டுகிறது. எபிரெயத்தில் வெளிப்படையாக இல்லாத தற்சுட்டுப் பொருளைத் திணிக்காமல் வினைச்செயலைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: לוֹ
  choice: அவருக்கு எதிராக
  rationale: לֹו என்ற சுருக்கமான தொடர்புச் சொல் இங்கு கடவுளை நோக்கிய எதிர்மறையான நடத்தையைக் குறிக்கிறது. ‘அவருக்கு’ என்பதைக் காட்டிலும் ‘அவருக்கு எதிராக’ என்பது சூழலின் கண்டனத் தொனியைத் தெளிவாக்குகிறது; இருப்பினும் மூலத்தின் சிக்கல் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: לֹא בָּנָיו
  choice: அவர்கள் அவருடைய பிள்ளைகள் அல்ல
  rationale: வினையில்லாத எபிரெய வாக்கியத்தை இயல்பான தமிழில் முழு வாக்கியமாக்குகிறது. ‘இனி அல்ல’ என்ற மூலத்தில் இல்லாத காலநுணுக்கத்தைச் சேர்க்கவில்லை.
- source_word: מוּמָם
  choice: தங்கள் குறைபாட்டினால்
  rationale: מוּם என்பது குறை அல்லது களங்கத்தைக் குறிக்கும். சுருக்கமான தொடரில் உள்ள தொடர்பை வாசிக்கத்தக்க தமிழில் காட்ட ‘-னால்’ சேர்க்கப்பட்டுள்ளது; வேறு இலக்கணப் புரிதல்கள் அடிக்குறிப்பில் தரப்படுகின்றன.
- source_word: דּוֹר
  choice: தலைமுறையினர்
  rationale: இங்கு ஒரு காலப்பகுதியை மட்டுமல்ல, அந்தத் தலைமுறையைச் சேர்ந்த மக்களைக் குறிக்கிறது; ஆகவே தமிழில் மனிதர்களைக் குறிக்கும் பன்மை வடிவம் இயல்பானது.
- source_word: עִקֵּשׁ
  choice: கோணல் உள்ள
  rationale: நேர்மையிலிருந்து விலகிய, வளைந்த தன்மையைச் சுட்டும் உருவகத்தைப் பாதுகாக்கிறது.
- source_word: וּפְתַלְתֹּל
  choice: திருகல் உள்ள
  rationale: அரிய இந்தப் பெயரடை மேலும் சிக்கலாகத் திரிந்த ஒழுக்கச் சீர்கேட்டைத் தீவிரப்படுத்துகிறது. முந்தைய சொல்லோடு ஒன்றாக்காமல் தனித்த உருவகமாக வைத்திருக்கிறது.
theological_decisions:
- issue: לֹא בָּנָיו என்பது உடன்படிக்கைப் பிள்ளைநிலையை இழந்ததைக் கூறுகிறதா, அல்லது பிள்ளைகளுக்குரிய பண்பை மறுக்கிறதா?
  choice: அவர்கள் அவருடைய பிள்ளைகள் அல்ல
  alternative: அவர்கள் இனி அவருடைய பிள்ளைகள் அல்ல; அவர்கள் அவருக்குப் பிள்ளைகள் அல்ல
  rationale: எபிரெயம் காலத்தைக் குறிக்கும் சொல்லின்றி மறுப்பைத் தீவிரமாக முன்வைக்கிறது. மொழிபெயர்ப்பு அதன் கடுமையைப் பாதுகாக்கிறது; ஆனால் உடன்படிக்கை நிலை இழக்கப்பட்டது என்ற விரிவான இறையியல் முடிவைச் சேர்க்கவில்லை.
- issue: முதல் கவியடியின் மிகச் சுருக்கமான தொடரமைப்பை எவ்வாறு புரிந்துகொள்வது?
  choice: அவருக்கு எதிராக அவர்கள் சீர்கெட்டு நடந்துகொண்டார்கள்; தங்கள் குறைபாட்டினால் அவர்கள் அவருடைய பிள்ளைகள் அல்ல.
  alternative: அவர்கள் தங்களையே கெடுத்துக்கொண்டார்கள்; அவர்கள் அவருடைய பிள்ளைகள் அல்ல; அது அவர்களுடைய களங்கம்.
  rationale: மசோரா உயிர்க்குறிப்பை அடிப்படையாகக் கொண்டு பொருத்தமான தொடரை முதன்மை உரையில் வழங்குகிறது. ஆயினும் தொடரமைப்பு உண்மையாகவே தெளிவற்றதால் மாற்றுப் புரிதல் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், கவிதைக்குரிய கண்ணியத்தையும் மூலத்தின் சுருக்கத்தையும் காக்கும் நடை. ‘கோணல்’, ‘திருகல்’ என்ற இணை உருவகங்கள் עִקֵּשׁ மற்றும் פְתַלְתֹּל ஆகிய இரு சொற்களின் வேறுபாட்டைக் காக்கின்றன. அனைத்து அடிக்குறிப்பு குறிகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
