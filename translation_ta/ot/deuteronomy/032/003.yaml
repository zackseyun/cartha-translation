  yaml_path: translation/ot/deuteronomy/032/003.yaml
  text: For I will proclaim the name of Yahweh[a]; ascribe greatness to our God.
translation:
  language: ta
  text: 'ஏனெனில், நான் யாவேவின்[a] பெயரை அறிவிப்பேன்;

    நம் கடவுளுக்கு மகத்துவம் செலுத்துங்கள்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரெயத்தில்: ‘YHWH’ (יהוה); மரபாக ‘கர்த்தர்’ என்று மொழிபெயர்க்கப்படுகிறது. ‘யெகோவா’ என்பதும் மற்றொரு தமிழ் வடிவம்.'
    reason: கடவுளின் நான்கெழுத்துப் பெயருக்கான மரபுவழி மற்றும் மாற்று வடிவங்களைத் தெரிவிக்கிறது.
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: சுற்றியுள்ள பாடல் மற்றும் அழைப்புடன் இவ்வசனத்தை காரணத் தொடர்பில் இணைக்கும் எபிரெயச் சொல்லின் இயல்பான பொருளைப் பாதுகாக்கிறது.
- source_word: שֵׁם
  choice: பெயர்
  rationale: கடவுளின் வெளிப்படுத்தப்பட்ட அடையாளத்தையும் புகழையும் உள்ளடக்கக்கூடிய concrete சொல்லை, விளக்கவுரையாக மாற்றாமல் நேரடியாகப் பாதுகாக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய மூலத்தில் உள்ள கடவுளின் தனிப்பெயரான நான்கெழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: אֶקְרָא
  choice: அறிவிப்பேன்
  rationale: இந்தப் பாடலில் யாவேவின் பெயரை வெளிப்படையாக எடுத்துரைக்கும் அறிவிப்புச் செயலை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: הָבוּ
  choice: செலுத்துங்கள்
  rationale: பன்மை ஏவல் வடிவத்தைப் பாதுகாத்து, மனிதர்கள் கடவுளுக்கு மகத்துவத்தை உருவாக்கிக் கொடுக்கிறார்கள் என்ற தவறான எண்ணமின்றி அவருக்குரிய மகத்துவத்தை ஏற்றுக்கொண்டு போற்றுமாறு அழைக்கிறது.
- source_word: גֹדֶל
  choice: மகத்துவம்
  rationale: பெருமை அல்லது மேன்மை என்ற பொருளுடைய எபிரெயப் பெயர்ச்சொல்லுக்கு நேரடியான, dignified தமிழ் இணை.
- source_word: לֵאלֹהֵינוּ
  choice: நம் கடவுளுக்கு
  rationale: לְ என்னும் திசை/பெறுநர் குறிக்கும் முன்னொட்டையும், முதல் நபர் பன்மை உடைமைப் பின்னொட்டையும் தெளிவாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: יְהוָה என்னும் கடவுளின் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: இவ்வசனம் ஒரு பொதுப் பட்டத்தை அல்ல, நான்கெழுத்துக் கடவுள் பெயரை நேரடியாகப் பயன்படுத்துகிறது. அதனால் அந்தத் தனிப்பெயரைத் தமிழில் ஒலிபெயர்த்து, மரபுவழி மாற்றீடுகளைக் குறிப்பு வழியாகத் தெரிவிக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பாடலுக்கேற்ற கண்ணியமான நடையுடன் மொழிபெயர்க்கப்பட்டுள்ளது. ‘மகத்துவம் செலுத்துங்கள்’ என்பது மூலத்தின் ஏவலையும் வழிபாட்டுச் சூழலையும் இயல்பாகப் பாதுகாக்கிறது.
