base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/011.yaml
  text: Like an eagle that stirs up its nest[a], that hovers over its young, he spreads out his wings, takes him[c][b], and carries him on his pinions.
translation:
  language: ta
  text: 'தன் கூட்டைக் கிளறி,


    தன் குஞ்சுகளின்மேல் மிதந்துபறக்கும் கழுகைப் போல[a],


    அவர் தமது சிறகுகளை விரித்து, அவனை எடுத்துக்கொண்டு,


    தமது இறகுகளின்மேல் அவனைச் சுமந்தார்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘கழுகு’ என்று மொழிபெயர்க்கப்பட்ட எபிரெயச் சொல் பெரிய பிணந்தின்னிப் பறவையையும் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּנֶשֶׁר
  choice: கழுகைப் போல
  rationale: נֶשֶׁר என்பது பெரிய இரைகொல்லிப் பறவையையோ பிணந்தின்னிப் பறவையையோ குறிக்கக்கூடும். பாதுகாப்பும் வலிமையும் கொண்ட இவ்வுருவகத்திற்கு ‘கழுகு’ இயல்பான தமிழ் சொல்லாகும்; விலங்கியல் சார்ந்த மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: יָעִיר קִנּוֹ
  choice: தன் கூட்டைக் கிளறிவிட்டு
  rationale: עור என்பதன் ஹிபீல் வடிவம் எழுப்புதல் அல்லது செயல்படத் தூண்டுதல் என்னும் கருத்தைக் கொண்டது. ‘கிளறிவிட்டு’ என்பது கூட்டிலுள்ள குஞ்சுகளை அசைவுறச் செய்யும் தாய்ப்பறவையின் செயலை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: עַל גּוֹזָלָיו יְרַחֵף
  choice: தன் குஞ்சுகளுக்கு மேலே சிறகடித்துப் பறக்கும்
  rationale: רחף அசைந்தாடுதல், சிறகடித்தல் அல்லது மேலே மிதந்து பறத்தல் ஆகிய பொருட்களைக் கொண்டது. தமிழ் சூழலில் ‘சிறகடித்துப் பறக்கும்’ என்பது இயக்கத்தையும் பாதுகாப்பான அண்மையையும் தெளிவாகக் காட்டுகிறது; மாற்றுகள் அடிக்குறிப்பில் தரப்படுகின்றன.
- source_word: יִפְרֹשׂ כְּנָפָיו
  choice: அவர் தமது சிறகுகளை விரித்து
  rationale: פרשׂ என்பது விரித்தல். பின்னணியில் ஆண்டவரே இந்த உருவகத்தின் குறிக்கப்படுபவர் என்பதால், பறவைக்கு உரிய அஃறிணை வடிவத்திலிருந்து மனித/தெய்வக் குறிப்பு கொண்ட மரியாதை வடிவத்திற்கு கவிதை நகர்வை ‘அவர்/தமது’ தக்கவைக்கிறது.
- source_word: יִקָּחֵהוּ
  choice: அவனை எடுத்துக்கொண்டு
  rationale: לקח என்பதன் அடிப்படைப் பொருள் எடுத்துக்கொள்ளுதல். எபிரெய ஆண்பால் ஒருமைச் செயப்படுபொருள் பின்னொட்டை ‘அவனை’ என்று பாதுகாக்கிறது.
- source_word: יִשָּׂאֵהוּ
  choice: அவனைச் சுமந்தார்
  rationale: נשׂא இங்கு உடலால் தூக்கிச் செல்லுதல் அல்லது சுமத்தல் என்னும் பொருளில் வருகிறது. ‘சுமந்தார்’ நவீனத் தமிழில் இயல்பாகவும் கவிதைநயத்துடனும் உள்ளது.
- source_word: עַל אֶבְרָתוֹ
  choice: தமது இறகுகளின்மேல்
  rationale: אֶבְרָה என்பது பொதுவான ‘சிறகு’ என்பதைக் காட்டிலும் இறகு அல்லது சிறகின் நீண்ட வெளிப்புற இறகுகளைக் குறிக்கிறது. தமிழில் அரிதான தொழில்நுட்பச் சொல்லைத் தவிர்த்து, முன்னுள்ள ‘சிறகுகள்’ என்பதிலிருந்து வேறுபாட்டை ‘இறகுகள்’ பாதுகாக்கிறது.
theological_decisions:
- issue: கழுகு உருவகத்திலிருந்து ஆண்டவரைக் குறிக்கும் சுட்டுப்பெயருக்கு நகர்தல்
  choice: பின்னரைக் கூறுகளில் ‘அவர்/தமது’ என்று மரியாதை ஆண்பால் வடிவத்தைப் பயன்படுத்துதல்
  alternative: முழு வசனத்திலும் பறவையைக் குறிக்கும் ‘அது/அதன்’ வடிவத்தைத் தொடருதல்
  rationale: எபிரெயத்தில் ஆண்பால் ஒருமை வினைவடிவங்கள் உள்ளன; பாடலின் சூழலில் இவ்வுருவகம் ஆண்டவர் இஸ்ரவேலைப் பராமரித்ததைக் குறிக்கிறது. ‘அவர்/தமது’ என்பது ஆண்டவரை வெளிப்படையாகப் பெயரிட்டு சேர்க்காமல், உருவகத்திலிருந்து அதன் குறிக்கப்படுபவரை நோக்கிய கவிதை நகர்வைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; கவிதைநயமும் கண்ணியமும் காக்கப்பட்டுள்ளன. ‘தமது’ மற்றும் ‘சுமந்தார்’ ஆகியவை தெய்வக் குறிப்பு நோக்கிய நகர்வை இயல்பாக வெளிப்படுத்துகின்றன. மூலத்தின் அடுக்கமைப்பை வாசிக்கத்தக்க நான்கு கவிதை வரிகளாக அமைத்துள்ளது.
