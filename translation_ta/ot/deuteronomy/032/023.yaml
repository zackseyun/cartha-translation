  yaml_path: translation/ot/deuteronomy/032/023.yaml
  text: I will heap disasters upon them[b][a]; I will use up my arrows against them.
translation:
  language: ta
  text: அவர்கள்மேல் பேரழிவுகளைக் குவிப்பேன்[a]; என் அம்புகளை அவர்களுக்கு எதிராகச் செலவழித்துத் தீர்ப்பேன்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘கேடுகளைக்’; எபிரெயச் சொல் சொற்பட ‘தீயவற்றை’ எனினும், இங்கு அறநெறித் தீமையை அல்ல, தீங்கு விளைவிக்கும் தண்டனைகளைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘என் அம்புகளை அவர்கள்மேல் முழுவதும் செலவழிப்பேன்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: אַסְפֶּה
  choice: குவிப்பேன்
  rationale: அவற்றை ஒருவர்மேல் தொடர்ந்து சேரச் செய்வது என்ற ஹிப்இல் வினையின் வலிமையை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: עָלֵימוֹ
  choice: அவர்கள்மேல்
  rationale: தீங்குகள் மக்கள்மேல் கொண்டுவரப்படுவதைக் குறிக்கும் עַל முன்னிடைச்சொல்லின் இடவியல் சார்ந்த உருவகப் பொருளைத் தக்கவைக்கிறது.
- source_word: רָעוֹת
  choice: பேரழிவுகள்
  rationale: இங்கு அறநெறித் தீமைகளை அல்ல, தண்டனைத் தீர்ப்பாக வரும் தீங்கான நிகழ்வுகளைக் குறிக்கிறது; சூழலின் கடுமையையும் தெளிவாகத் தெரிவிக்கிறது.
- source_word: חִצַּי
  choice: என் அம்புகளை
  rationale: மூலத்திலுள்ள போரியல் உருவகத்தை நேரடியாகப் பாதுகாக்கிறது.
- source_word: אֲכַלֶּה
  choice: தீரும்வரை எய்வேன்
  rationale: அம்புகளை முழுமையாகச் செலவழித்துத் தீர்த்தல் என்ற பிஎல் வினையின் பொருளை, தமிழில் இயல்பாகவும் அம்பு உருவகத்தோடு பொருந்துமாறும் தெரிவிக்கிறது.
- source_word: בָּם
  choice: அவர்களுக்கு எதிராக
  rationale: அம்புகள் செலுத்தப்படும் இலக்கையும் பகைமை நோக்கிய திசையையும் இயல்பான தமிழில் காட்டுகிறது.
theological_decisions:
- issue: தெய்வீகத் தீர்ப்பின் சூழலில் רָעוֹת என்பதன் மொழிபெயர்ப்பு
  choice: பேரழிவுகள்
  alternative: தீமைகள்; கேடுகள்; துன்பங்கள்
  rationale: இச்சொல் பொதுவாகத் ‘தீயவை’ எனப் பொருள்படலாம்; ஆனால் இங்கு உடன்படிக்கை மீறலுக்கான தீங்கான தண்டனைகளைக் குறிக்கிறது. ‘பேரழிவுகள்’ என்பது அறநெறித் தீமையை இறைவனுக்குச் சுமத்தாமல், தீர்ப்பின் கடுமையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பாடலின் உயர்ந்த கவித்துவத் தொனியையும் போரியல் உருவகத்தையும் காக்கும் தெளிவான, கண்ணியமான நடை. ‘தீரும்வரை எய்வேன்’ என்பது சொற்சொல் மொழிபெயர்ப்பை விட இயல்பான தமிழில் முழுமையாகச் செலவழித்தல் என்ற கருத்தை வெளிப்படுத்துகிறது.
