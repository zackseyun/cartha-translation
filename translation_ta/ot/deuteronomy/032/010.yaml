    issue: Footnote b anchor is placed at the end of the full guarding clause rather than with the pupil/eye expression.
    rationale: The note concerns כְּאִישׁוֹן עֵינוֹ, rendered “கண்ணின் கருவிழியைப்போல்,” so the marker should immediately follow that expression.
