base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/010.yaml
  text: He found him in a desert land[a], and in the howling waste of the wilderness; he surrounded him, he cared for him[b], he guarded him like the pupil of his eye.
translation:
  language: ta
  text: 'பாலைநிலத்தில், ஊளையிடும் பாழான வனாந்தரத்தில், அவர் அவனைக் கண்டார்;

    அவனைச் சூழ்ந்துகொண்டார்;

    அவனை அக்கறையுடன் கவனித்தார்[a];

    தமது கண்ணின் கருவிழியைப்போல்[b] அவனைக் காத்தார்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இதற்கான எபிரெய வினையை “அவனுக்கு அறிவுணர்வு அளித்தார்” அல்லது “அவன்மீது கூர்ந்து கவனம் செலுத்தினார்” என்றும் மொழிபெயர்க்கலாம்.
    reason: alternative_reading
  - marker: b
    text: மரபுவழியாக, “தமது கண்மணியைப்போல்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִמְצָאֵהוּ
  choice: அவனை அவர் கண்டார்
  rationale: מצא என்பதன் இயல்பான பொருள் ‘காணுதல்/கண்டடைதல்’. பாடல் கடந்தகாலச் செயல்களை நினைவுகூருவதால் தமிழ் இறந்தகாலம் பொருத்தமானது; ‘கண்டார்’ என்பது கூடுதல் விளக்கத்தைச் சேர்க்காமல் உருவகத்தைப் பாதுகாக்கிறது.
- source_word: בְּאֶרֶץ מִדְבָּר
  choice: பாலைநிலத்தில்
  rationale: אֶרֶץ מִדְבָּר என்பது வறண்ட, மனித வாழ்வுக்கு ஏதுவற்ற நிலத்தைக் குறிக்கிறது. ‘பாலைநிலம்’ நவீன தமிழில் சுருக்கமாகவும் இயல்பாகவும் அந்தக் காட்சியைத் தருகிறது.
- source_word: וּבְתֹהוּ יְלֵל יְשִׁמֹן
  choice: ஊளையிடும் வெறுமையான வனாந்தரத்தில்
  rationale: תֹהוּ என்பதன் வெறுமை/பாழ்மை நுணுக்கத்தையும், יְלֵל என்பதன் ‘ஊளையிடும்’ ஒலிப்படிமத்தையும், יְשִׁמֹן என்பதன் பாழான வனாந்தரக் காட்சியையும் இச்சொற்றொடர் தக்கவைக்கிறது.
- source_word: יְסֹבְבֶנְהוּ
  choice: அவனைச் சூழ்ந்துகொண்டார்
  rationale: סבב என்பதன் நேரடியான ‘சுற்றுதல்/சூழ்தல்’ உருவகத்தைப் பாதுகாக்கிறது; பாதுகாப்பு என்ற விளைவை மொழிபெயர்ப்பிலேயே வெளிப்படையாகச் சேர்க்கவில்லை.
- source_word: יְבֹונְנֵהוּ
  choice: அவனை அக்கறையுடன் கவனித்தார்
  rationale: இந்த வினை புரிந்துகொள்ளுதல், கவனம் செலுத்துதல், விவேகத்துடன் பராமரித்தல் ஆகிய நுணுக்கங்களைக் கொண்டிருக்கலாம். சூழ்தல் மற்றும் காத்தல் என்ற இணைச் செயல்களுக்கிடையில் ‘அக்கறையுடன் கவனித்தார்’ என்பது உறவுசார் கவனிப்பை இயல்பாகத் தருகிறது; வேறு சாத்தியத்தை அடிக்குறிப்பு பாதுகாக்கிறது.
- source_word: יִצְּרֶנְהוּ
  choice: அவனைக் காத்தார்
  rationale: נצר என்பதன் ‘காத்தல், பாதுகாத்தல், பேணுதல்’ பொருள்களில் இச்சூழலில் ‘காத்தார்’ தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: כְּאִישׁוֹן עֵינוֹ
  choice: தமது கண்ணின் கருவிழியைப்போல்
  rationale: אִישׁוֹן עֵין என்பது கண்ணின் மையப் பகுதியான pupil-ஐக் குறிக்கிறது. ‘கருவிழி’ நவீனத் தமிழில் புரியக்கூடிய உடற்கூற்றுச் சொல்லாக இருந்து, கண் மிகுந்த கவனத்துடன் காக்கப்படுவது என்ற உருவகத்தையும் தக்கவைக்கிறது.
theological_decisions:
- issue: ஒருமை ஆண்பால் சுட்டுப்பெயர்களின் குறிப்பு
  choice: யாக்கோபு/இஸ்ரவேல் மக்களை ஒருமையில் உருவகப்படுத்தி ‘அவன்’ என்று வைத்தல்
  alternative: கூட்டுப் பொருளை வெளிப்படுத்த ‘அவர்கள்’ என்று மாற்றுதல் அல்லது தனிநபர் யாக்கோபை மட்டும் குறிப்பதாக வாசித்தல்
  rationale: சுற்றியுள்ள பாடல் யாக்கோபு/இஸ்ரவேலைக் கூட்டு ஒருமையாகப் பேசுகிறது. எபிரெயச் சொல்லிலக்கணத்தையும் கவிதை உருவகத்தையும் காக்கத் தமிழ் ஒருமை பயன்படுத்தப்பட்டது.
- issue: יְבֹונְנֵהוּ வினையின் பொருள்
  choice: அக்கறையுடன் கவனித்தார்
  alternative: அவனுக்கு அறிவுணர்வு அளித்தார் / அவனைப் புரிந்துகொண்டார்
  rationale: வினைக்கு அறிவுசார் மற்றும் கவனம்சார் பொருட்கள் இரண்டும் சாத்தியம். சூழ்தல், காத்தல் ஆகிய வினைகளின் தொடரில் அக்கறையான கவனம் இயல்பாக இருந்தாலும், அறிவுணர்வு அளித்தல் என்ற சாத்தியம் அடிக்குறிப்பில் விடப்பட்டுள்ளது.
- issue: கண்ணைப் பற்றிய உருவகம்
  choice: கண்ணின் கருவிழி
  alternative: கண்மணி
  rationale: ‘கண்மணி’ என்பது தமிழில் அன்புக்குரியவர் என்ற மரபுவழி உருவகப் பொருளையும் ஏற்கலாம். மூலத்தின் உடற்கூற்றுப் படிமத்தை வெளிப்படையாக வைக்க ‘கருவிழி’ தேர்ந்தெடுக்கப்பட்டது; பழக்கமான மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், கவிதைக்குரிய கண்ணியமான ஓசையுடன் மொழிபெயர்க்கப்பட்டுள்ளது. இறைவனைக் குறிக்கும் வினைகளில் மரியாதைப் பன்மை பயன்படுத்தப்பட்டுள்ளது. எபிரெயக் கவிதையின் தொடர் வினை அமைப்பையும் கூட்டு ஒருமையையும் இயன்றவரை பாதுகாத்து, கடினமான சொற்களுக்கான உண்மையான மாற்று வாசிப்புகள் அடிக்குறிப்புகளில் தரப்பட்டுள்ளன.
