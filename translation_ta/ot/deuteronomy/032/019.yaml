source:
  edition: WLC
  text: וַ/יַּ֥רְא יְהוָ֖ה וַ/יִּנְאָ֑ץ מִ/כַּ֥עַס בָּנָ֖י/ו וּ/בְנֹתָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/019.yaml
  text: And Yahweh saw and rejected them, provoked to anger by his sons and daughters[a].
translation:
  language: ta
  text: யாவே கண்டார்; தம் மகன்களும் மகள்களும் தூண்டிய கோபத்தினால் அவர்களைப் புறக்கணித்தார்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அவர்களை இகழ்ந்து ஒதுக்கினார்’ அல்லது ‘அவர்களை அவமதித்தார்.’
    reason: נאץ என்பது புறக்கணித்தல் அல்லது நிராகரித்தல் என்பதோடு இகழ்ச்சியின் நிழற்பொருளையும் கொண்டுள்ளது; இந்த மாற்றுகள் அந்த வலிமையை வெளிப்படுத்துகின்றன.
lexical_decisions:
- source_word: יְהוָה
  choice: யாவே
  rationale: தேவனுடைய உடன்படிக்கைப் பெயரை ஒரு பொதுப்பட்டமாக மாற்றாமல், எபிரெயப் பெயரின் ஒலிப்பைத் தமிழில் இயல்பாகப் பெயர்த்துள்ளது.
- source_word: וַיַּרְא
  choice: அதைக் கண்டு
  rationale: ראה என்பதன் அடிப்படைப் பொருளான ‘காணுதல்’ பாதுகாக்கப்படுகிறது; முந்தைய சூழலில் கூறப்பட்ட செயல்களை ‘அது’ சுட்டுகிறது.
- source_word: וַיִּנְאָץ
  choice: அவர்களைத் தள்ளிவிட்டார்
  rationale: נאץ குறிக்கும் அவமதிப்புடன் கூடிய நிராகரிப்பை, உறவுமுறிவு தெளிவாகத் தெரியும் இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது. எபிரெயத்தில் மறைந்துள்ள செயப்படுபொருள் சூழலிலிருந்து ‘அவர்களை’ என வழங்கப்படுகிறது.
- source_word: מִכַּעַס
  choice: தம்மைக் கோபமூட்டியதால்
  rationale: כעס குறிக்கும் எரிச்சல் அல்லது கோபத்தைத் தூண்டும் செயலைக் காரணத் தொடர்புடன் இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: בָּנָיו וּבְנֹתָיו
  choice: தம் மகன்களும் மகள்களும்
  rationale: எபிரெயம் ஆண், பெண் சந்ததியினரைத் தனித்தனியாகக் குறிப்பிடுவதால், பொதுவான ‘பிள்ளைகள்’ என்பதற்குப் பதிலாக இரண்டையும் பாதுகாக்கிறது.
theological_decisions:
- issue: וַיִּנְאָץ என்பதன் மறைந்துள்ள செயப்படுபொருள்
  choice: சூழலில் குறிக்கப்படும் இஸ்ரவேல் மக்களை ‘அவர்களை’ என்று வெளிப்படையாக வழங்குதல்
  alternative: செயப்படுபொருளைச் சொல்லாமல் ‘தள்ளிவிட்டார்’ என்று மட்டும் மொழிபெயர்த்தல்
  rationale: தமிழிலும் இவ்வினை இங்கு செயப்படுபொருளுடன் தெளிவாக அமைகிறது; சூழல் அதன் குறிப்பு மக்களே என்பதைத் தீர்மானிக்கிறது. இது புதிய இறையியல் கருத்தைச் சேர்ப்பதில்லை.
- issue: இறைக் கோபமும் நிராகரிப்பும்
  choice: ‘கோபமூட்டியதால்’ என்றும் ‘தள்ளிவிட்டார்’ என்றும் நேரடியாக வழங்குதல்
  alternative: ‘வெறுத்தார்’ அல்லது ‘அருவருத்தார்’ என்று தீவிரப்படுத்துதல்
  rationale: உடன்படிக்கை மீறலுக்கான உண்மையான இறைத் தீர்ப்பின் கனத்தைப் பாதுகாக்கிறது; அதேவேளையில் மூலச்சொற்கள் உறுதிப்படுத்தாத அளவுக்கு உணர்ச்சியைத் தீவிரப்படுத்தவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘தம்/தம்மை’ என்ற தற்சுட்டுப் பெயர்கள் மகன்களும் மகள்களும் யாவேக்குரியவர்கள் என்பதையும், அவர்கள் யாவேயையே கோபமூட்டினர் என்பதையும் தெளிவாக்குகின்றன.
