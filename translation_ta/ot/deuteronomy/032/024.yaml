source:
  edition: WLC
  text: מְזֵ֥י רָעָ֛ב וּ/לְחֻ֥מֵי רֶ֖שֶׁף וְ/קֶ֣טֶב מְרִירִ֑י וְ/שֶׁן בְּהֵמוֹת֙ אֲשַׁלַּח בָּ֔/ם עִם חֲמַ֖ת זֹחֲלֵ֥י עָפָֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/024.yaml
  text: wasted by famine[a], consumed by plague and bitter destruction; I will send against them the fangs of beasts[c][b], with the venom of things that crawl in the dust.
translation:
  language: ta
  text: 'பஞ்சத்தால் மெலிந்து,

    கொள்ளைநோயாலும்[a] கொடிய அழிவாலும் விழுங்கப்பட்டு,

    மிருகங்களின் கோரைப்பற்களையும்[b],

    மண்ணில் ஊர்வனவற்றின்[c] நஞ்சையும்

    அவர்களுக்கு எதிராக அனுப்புவேன்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எரிக்கும் காய்ச்சலால்.” இதற்கான எபிரெயச் சொல், பண்டைய அண்மைக் கிழக்கில் கொள்ளைநோயுடன் தொடர்புபடுத்தப்பட்ட ரேஷெப் என்ற தெய்வத்தின் பெயரையும் எதிரொலிக்கக்கூடும்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “மிருகங்களின் பற்களையும்.”
    reason: lexical_alternative
  - marker: c
    text: அல்லது, “மண்ணில் ஊரும் பாம்புகளின்.” ஆனால் எபிரெயச் சொற்றொடர் இதைவிடப் பரந்தது; தரையோடு ஒட்டி ஊரும் உயிரினங்களைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְזֵי רָעָב
  choice: பசியால் வற்றி
  rationale: מְזֵי என்பது உடல் வற்றிப்போய் மெலிவதைக் குறிக்கிறது; רָעָב இங்கு பசியையும் பஞ்சத்தின் விளைவையும் சுட்டலாம். தமிழ் கவிதைநடையில் மூலத்தின் உடல் சிதைவு தெளிவாகத் தெரிவதற்காக இவ்வாறு மொழிபெயர்க்கப்பட்டது.
- source_word: לְחֻמֵי
  choice: விழுங்கப்பட்டு
  rationale: அரிதான இந்த வடிவம் ‘தின்னப்பட்டு/விழுங்கப்பட்டு’ என்ற செயலற்ற பொருளைக் கொண்டுள்ளது. அழிவின் தீவிரத்தையும் எபிரெய உருவகத்தையும் ‘விழுங்கப்பட்டு’ இயல்பாகக் காக்கிறது.
- source_word: רֶשֶׁף
  choice: கொள்ளைநோய்
  rationale: இச்சூழலில் எரிக்கும் நோய் அல்லது கொள்ளைநோய் என்னும் பொதுப்பெயர்ப் பொருள் கவிதைத் தீர்ப்புப் பட்டியலுடன் பொருந்துகிறது. சாத்தியமான வேறு பொருள்கள் அடிக்குறிப்பில் தரப்பட்டுள்ளன.
- source_word: קֶטֶב מְרִירִי
  choice: கொடிய அழிவு
  rationale: קֶטֶב என்பது பேரழிவு அல்லது கொல்லும் கொள்ளைநோயைக் குறிக்கலாம்; מְרִירִי சொற்படியாக ‘கசப்பான’ எனினும் இங்கு அதன் கொடுமையை வலியுறுத்துகிறது. முந்தைய சொல்லுடன் தேவையற்ற மறுபதிப்பைத் தவிர்த்து இயல்பான தமிழில் ‘கொடிய அழிவு’ என வழங்கப்பட்டது.
- source_word: שֶׁן בְּהֵמוֹת
  choice: மிருகங்களின் கோரப்பற்கள்
  rationale: שֶׁן என்பதன் நேர்ப்பொருள் ‘பல்’; தாக்கும் மிருகங்களின் சூழலில் ‘கோரப்பற்கள்’ அச்சுறுத்தும் உருவகத்தைத் தமிழில் தெளிவாகத் தருகிறது. நேரடியான மாற்று அடிக்குறிப்பில் உள்ளது.
- source_word: אֲשַׁלַּח בָּם
  choice: அவர்களுக்கு எதிராக அனுப்புவேன்
  rationale: தீர்ப்புக்காகப் பகைமையான சக்திகளை அவர்கள்மேல் அனுப்பும் பொருளைத் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: חֲמַת
  choice: நஞ்சு
  rationale: இந்தப் பெயர்ச்சொல் ‘கோபம்/சூடு’ என்றும் பொருள்படலாம்; ஆனால் ஊர்வனவற்றுடன் சேர்ந்துள்ளதால் இங்கு ‘நஞ்சு’ என்பதே சூழலுக்குரிய துல்லியமான பொருள்.
- source_word: זֹחֲלֵי עָפָר
  choice: மண்ணில் ஊர்வனவை
  rationale: மண்ணோடு ஒட்டி ஊரும் உயிரினங்களைப் பொதுவாகக் குறிக்கும் எபிரெயச் சொற்றொடரின் பரந்த பொருளைக் காக்கிறது; அதை பாம்புகள் என்று மட்டும் குறுக்கவில்லை.
theological_decisions:
- issue: רֶשֶׁף என்பதில் இருக்கக்கூடிய புராணப் பின்னணி
  choice: முதன்மை உரையில் பொதுப்பெயராக ‘கொள்ளைநோய்’ என்று மொழிபெயர்த்தல்
  alternative: ‘ரேஷெப்’ என்ற தனிப்பெயர் அல்லது ‘எரிக்கும் காய்ச்சல்’
  rationale: உடனடி இலக்கியச் சூழல் உடன்படிக்கைத் தீர்ப்புகளின் கவிதைப்பட்டியல் என்பதால் பொதுப்பெயர்ப் பொருள் இயல்பாகப் பொருந்துகிறது. இருப்பினும் சொல்லின் வரலாற்றுப் பின்னணியையும் மாற்றுப் பொருளையும் அடிக்குறிப்பு மறைக்காமல் பாதுகாக்கிறது.
translation_notes:
  register: நவீன செந்தமிழுக்கும் பொதுமக்கள் புரிந்துகொள்ளும் நடைமுறைத்தமிழுக்கும் இடைப்பட்ட கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய வரியின் இணை அமைப்பைச் சுருக்கமான அடிகளால் பிரதிபலித்துள்ளோம்; அரிதான அல்லது இருபொருள் தரும் சொற்கள் முதன்மை உரையில் தேவையின்றி கடினப்படுத்தப்படாமல், அடிக்குறிப்புகளில் பாதுகாக்கப்பட்டுள்ளன.
