  text: יַרְכִּבֵ֨/הוּ֙ עַל במותי אָ֔רֶץ וַ/יֹּאכַ֖ל תְּנוּבֹ֣ת שָׂדָ֑י וַ/יֵּנִקֵ֤/הֽוּ דְבַשׁ֙ מִ/סֶּ֔לַע וְ/שֶׁ֖מֶן מֵ/חַלְמִ֥ישׁ צֽוּר־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/013.yaml
  text: He made him ride on the heights of the land[a], and he ate the produce of the field; he made him suck honey from the rock[c][b], and oil from the flinty rock.
translation:
  language: ta
  text: அவர் அவனை நாட்டின் உயர்ந்த இடங்களின்மேல் சவாரி செய்ய வைத்தார்[a]; அவன் வயல்வெளியின் விளைச்சலை உண்டான்[b]. பாறையிலிருந்து தேனையும், கடினக் கற்பாறையிலிருந்து எண்ணெயையும் அவர் அவனை உறிஞ்சிக் குடிக்கச் செய்தார்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பூமியின் மேடுகளின்மேல்.” இச்சொற்றொடர் வழிபாட்டுக்குரிய மேடுகளை அல்ல, பெரும்பாலும் உயரமான, வளமிக்க நிலப்பகுதிகளையே குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “வயல்வெளியின் பலனை.”
    reason: lexical_alternative
  - marker: c
    text: அல்லது, “பாறையிலிருந்து தேனை அவன் உறிஞ்சச் செய்தார்.” எபிரெய வினைச்சொல்லின் நேரடிப் பொருள் “உறிஞ்சச் செய்தார்” என்பதாகும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַרְכִּבֵהוּ
  choice: அவர் அவனை ... ஏறிச் செல்லச் செய்தார்
  rationale: רכב என்பதன் ஹிஃபில் வடிவிலுள்ள காரணவினைப் பொருளைத் தக்கவைத்து, பொருள் குறிப்பிடப்படாத ‘சவாரி’ என்ற சொல்லைவிடத் தமிழில் இயல்பாக அமைகிறது.
- source_word: עַל בָּמֳתֵי אָרֶץ
  choice: நாட்டின் உயர்ந்த இடங்களின்மேல்
  rationale: במות இங்கு நிலவியல் சார்ந்த உயர்ந்த இடங்களைக் குறிக்கிறது; வழிபாட்டுக்குரிய ‘மேடைகள்’ என்ற தவறான எண்ணத்தைத் தவிர்க்கிறது. ארץ என்பதற்கு இச்சூழலில் ‘நாடு’ பொருத்தமானது.
- source_word: וַיֹּאכַל
  choice: அவன் ... உண்டான்
  rationale: אכל என்பதன் நேரடியான, உருவகத்தைத் தெளிவாக வைத்திருக்கும் பொருள்.
- source_word: תְּנוּבֹת שָׂדָי
  choice: வயல்வெளியின் விளைச்சல்
  rationale: תנובות என்பது நிலம் தரும் விளைச்சல் அல்லது பலனைக் குறிக்கிறது; שדי என்னும் ஒருமைச் சொல் தொகுப்புப் பொருளில் இயல்பாகத் தரப்பட்டுள்ளது.
- source_word: וַיֵּנִקֵהוּ
  choice: அவர் அவனை உறிஞ்சிக் குடிக்கச் செய்தார்
  rationale: ינק என்பதன் ஹிஃபில் வடிவிலுள்ள ‘உறிஞ்சச் செய்தல்’ என்ற உயிர்ப்பான காரணவினை உருவகத்தைத் தமிழில் புரியத்தக்கவாறு பாதுகாக்கிறது.
- source_word: דְבַשׁ
  choice: தேன்
  rationale: செழுமையான உணவளிப்பைக் காட்டும் சொல்லின் வழக்கமான நேரடிப் பொருள்.
- source_word: מִסֶּלַע
  choice: பாறையிலிருந்து
  rationale: סלע என்பதன் பாறை அல்லது குன்றுப்பாறை என்ற பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: וְשֶׁמֶן
  choice: எண்ணெய்
  rationale: பண்பாட்டுச் சூழலில் ஒலிவ எண்ணெய் கருதப்பட்டிருக்கலாம்; எனினும் மூலச்சொல் ஒலிவத்தை வெளிப்படையாகக் குறிப்பிடாததால் பொதுவான ‘எண்ணெய்’ என்பதே வைக்கப்பட்டுள்ளது.
- source_word: מֵחַלְמִישׁ צוּר
  choice: கடினமான கற்பாறையிலிருந்து
  rationale: חלמיש என்பது தீக்கல் அல்லது மிகக் கடினமான கல்லைக் குறிக்கிறது; צור உடன் சேர்ந்து, வளமற்ற கடினப் பாறையிலிருந்தே செழுமை கிடைத்த வியப்பை வலுப்படுத்துகிறது.
theological_decisions:
- issue: வசனம் முழுவதிலுமுள்ள மூன்றாம் நபர் ஒருமைப் பெயர்ச்சொற்களின் குறிப்பு
  choice: முதன்மை உரையில் பெயர்களைச் சேர்க்காமல் ‘அவர்’, ‘அவனை’, ‘அவன்’ என்ற பெயர்ச்சொற்களையே வைத்தல்
  alternative: எழுவாயை ‘ஆண்டவர்’ என்றும் செயப்படுபொருளை ‘இஸ்ரவேல்’ அல்லது ‘யாக்கோபு’ என்றும் வெளிப்படையாகக் குறிப்பிடுதல்
  rationale: உடனடி சூழல் இவற்றின் குறிப்பை விளக்கினாலும், இவ்வசனம் பெயர்களுக்குப் பதிலாகப் பெயர்ச்சொற்களையே பயன்படுத்துகிறது. அவற்றைத் தக்கவைப்பது எபிரெய உரையின் உரையோட்டத்தைப் பாதுகாத்து, விளக்கத்தை மொழிபெயர்ப்புக்குள் சேர்ப்பதைத் தவிர்க்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிதில் புரியும், அதேவேளையில் கவிதைநயமும் கண்ணியமும் கொண்ட நடை பயன்படுத்தப்பட்டுள்ளது. ‘பாறை—கடினமான கற்பாறை’ என்ற இணை அமைப்பும், சாத்தியமற்ற இடங்களிலிருந்து கிடைக்கும் செழுமை என்ற மூல உருவகமும் பாதுகாக்கப்பட்டுள்ளன.
