  text: who ate the fat of their sacrifices and drank the wine of their drink offerings—let them rise up and help you; let them be your shelter.
translation:
  language: ta
  text: 'அவர்களுடைய பலிகளின் கொழுப்பைத் தின்று,

    அவர்களுடைய பானபலிகளின் திராட்சரசத்தைக் குடித்தவர்கள்

    எழுந்து உங்களுக்கு உதவட்டும்;

    அவர்கள் உங்களுக்கு ஒரு அடைக்கலமாக இருக்கட்டும்.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חֵלֶב זְבָחֵימוֹ
  choice: அவர்களுடைய பலிகளின் கொழுப்பு
  rationale: חֵלֶב என்பது பலியிலுள்ள ‘கொழுப்பு’; זְבָחֵימוֹ என்பது ‘அவர்களுடைய பலிகள்’. மூலத்தின் வழிபாட்டுச் சொல்லாட்சியை நேரடியாகப் பாதுகாக்கிறது.
- source_word: יֵין נְסִיכָם
  choice: அவர்களுடைய பானபலிகளின் திராட்சரசம்
  rationale: יֵין என்பது திராட்சரசம்; נְסִיכָם என்பது அவர்கள் ஊற்றிய பானபலிகளைக் குறிக்கிறது. இயல்பான தமிழில் இரண்டையும் தெளிவாக இணைக்கிறது.
- source_word: יָק֨וּמוּ֙ וְיַעְזְרֻכֶם
  choice: அவர்கள் எழுந்து உங்களுக்கு உதவட்டும்
  rationale: இகழ்ச்சியான சவாலின் கட்டளை/வேண்டுகோள் நயத்தை ‘உதவட்டும்’ பாதுகாக்கிறது.
- source_word: סִתְרָה
  choice: அடைக்கலம்
  rationale: இச்சொல் மறைவிடம் அல்லது பாதுகாப்பைக் குறிக்கிறது; சூழலில் பொய்த் தெய்வங்கள் பாதுகாப்பளிக்கட்டும் என்ற கிண்டலான சவாலுக்கு ‘அடைக்கலம்’ இயல்பாகப் பொருந்துகிறது.
theological_decisions:
- issue: பலிகளை உண்டவர்கள் யார் என்பதன் சுட்டுப்பொருள்
  choice: ‘தின்றவர்கள் எங்கே?’ என்று முன் சூழலில் குறிப்பிடப்பட்ட தெய்வங்களைச் சுட்டும் கேள்வியாக மொழிபெயர்க்கப்பட்டது
  alternative: ‘தின்றவர்கள்’ என்பதைக் கேள்விச் சொல்லின்றி தொடர்புப்பெயர் வாக்கியமாக மட்டும் அமைத்தல்
  rationale: אֲשֶׁר இலக்கணப்படி தொடர்புப்பெயராக இருந்தாலும், முந்தைய வசனத்திலுள்ள ‘அவர்களுடைய தெய்வங்கள் எங்கே?’ என்ற கேள்வியை இது தொடர்கிறது. தமிழில் தனிவசனமாக வாசிக்கும்போது அந்தத் தொடர்பை ‘எங்கே?’ தெளிவாக்குகிறது; தெய்வங்கள் உண்மையில் உண்ணுகின்றன என்ற கூற்றை மொழிபெயர்ப்பாளர் தனியாக உறுதிப்படுத்தவில்லை.
- issue: இறுதி பாதுகாப்புச் சொல்லின் பொருள்
  choice: அடைக்கலம்
  alternative: மறைவிடம் / பாதுகாப்பு
  rationale: סִתְרָה என்பதிலுள்ள மறைத்துப் பாதுகாக்கும் பொருளைச் சுருக்கமாகவும் இறையியல் சார்பின்றியும் தெரிவிக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழ்; மோசேயின் பாடலுக்கேற்ற dignified கவிதைநடை. இணை அமைப்பும் இகழ்ச்சியான சவாலும் பாதுகாக்கப்பட்டுள்ளன. தேவையற்ற சமயப் பிரிவுச் சொற்கள் தவிர்க்கப்பட்டுள்ளன.
