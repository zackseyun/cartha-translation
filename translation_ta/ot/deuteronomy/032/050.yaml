  text: וּ/מֻ֗ת בָּ/הָר֙ אֲשֶׁ֤ר אַתָּה֙ עֹלֶ֣ה שָׁ֔מָּ/ה וְ/הֵאָסֵ֖ף אֶל עַמֶּ֑י/ךָ כַּֽ/אֲשֶׁר מֵ֞ת אַהֲרֹ֤ן אָחִ֨י/ךָ֙ בְּ/הֹ֣ר הָ/הָ֔ר וַ/יֵּאָ֖סֶף אֶל עַמָּֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/050.yaml
  text: and die on the mountain that you are ascending[a], and be gathered to your people, just as Aaron your brother died on Mount Hor and was gathered to his people.
translation:
  language: ta
  text: உன் சகோதரன் ஆரோன் ஓர் என்னும் மலையில் இறந்து தன் மக்களோடு சேர்க்கப்பட்டதுபோலவே, நீ ஏறிச் செல்லும் அந்த மலையில் இறந்து, உன் மக்களோடு சேர்க்கப்படுவாயாக[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘உன் மூதாதையரோடு சேர்க்கப்படுவாயாக.’ எபிரெய மரபுத்தொடர் சொல்லுக்குச் சொல், ‘உன் மக்களோடு சேர்க்கப்படுவாயாக’ என்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמֻת
  choice: இறந்து
  rationale: מות என்பதன் கால் கட்டளை/விருப்ப வடிவத்தின் நேரடித்தன்மையைத் தக்கவைக்கிறது; தொடரும் கட்டளையோடு இயல்பாக இணைகிறது.
- source_word: בָּהָר אֲשֶׁר אַתָּה עֹלֶה שָׁמָּה
  choice: நீ ஏறிச் செல்லும் அந்த மலையிலேயே
  rationale: עלה என்பதன் மேல்நோக்கிய இயக்கத்தை ‘ஏறிச் செல்லும்’ எனக் காக்கிறது; שָׁמָּה-வின் இடச்சுட்டை இயல்பான தமிழில் ‘அந்த’ என்றும், இடவலியுறுத்தலை ‘-இலேயே’ என்றும் வெளிப்படுத்துகிறது.
- source_word: וְהֵאָסֵף אֶל עַמֶּיךָ
  choice: உன் மக்களோடு சேர்க்கப்படுவாயாக
  rationale: ‘தன் மக்களிடம் சேர்க்கப்படுதல்’ என்ற எபிரெய மரண மரபுத்தொடரை விளக்கிப் பொருள்குறுக்காமல் காக்கிறது.
- source_word: כַּאֲשֶׁר
  choice: போலவே
  rationale: ஆரோனின் மரணத்துடன் செய்யப்படும் தெளிவான ஒப்பீட்டை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: אַהֲרֹן אָחִיךָ
  choice: உன் சகோதரன் ஆரோன்
  rationale: நவீனத் தமிழில் இயல்பான பெயர்-உறவு அமைப்பைப் பயன்படுத்துகிறது.
- source_word: בְּהֹר הָהָר
  choice: ஓர் மலையில்
  rationale: הֹר என்பது ‘ஓர்’ என ஒலிபெயர்க்கப்படும் இடப்பெயர்; הָהָר உடன் சேர்ந்து தமிழின் வழக்கமான இடப்பெயர் வடிவமான ‘ஓர் மலை’ ஆகிறது.
- source_word: וַיֵּאָסֶף אֶל עַמָּיו
  choice: தன் மக்களோடு சேர்க்கப்பட்டது
  rationale: மோசேயைப் பற்றிய அதே மரண மரபுத்தொடருடன் சொல்லொற்றுமையைப் பேணுகிறது.
theological_decisions:
- issue: אסף אל־עמיו என்ற மரண மரபுத்தொடரின் மொழிபெயர்ப்பு
  choice: ‘உன்/தன் மக்களோடு சேர்க்கப்படுதல்’ என்ற உருவகத்தை முதன்மை உரையில் தக்கவைத்தல்
  alternative: ‘உன்/தன் மூதாதையரோடு சேர்க்கப்படுதல்’ அல்லது ‘இறந்து உறவினரோடு இணைதல்’
  rationale: இது மரணத்தைக் குறிக்கும் வழக்குச் சொற்றொடராக இருந்தாலும், வெறும் அடக்கம் அல்லது மூதாதையர் என்பதைக் காட்டிலும் விரிவான பொருள் நுணுக்கம் கொண்டிருக்கலாம். ஆகவே அதன் இறையியல் திறந்தநிலையை விளக்கத்தால் குறுக்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையும் கண்ணியமும் கொண்ட நடை. எபிரெய மரண மரபுத்தொடர் திட்டமிட்டு அப்படியே காக்கப்பட்டுள்ளது; ‘ஏறிச் செல்லும் அந்த மலையிலேயே’ என்பது மூலத்தின் இடச்சுட்டையும் மேல்நோக்கிய இயக்கத்தையும் இயல்பாக வெளிப்படுத்துகிறது.
