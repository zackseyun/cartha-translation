source:
  edition: WLC
  text: אַשְׁכִּ֤יר חִצַּ/י֙ מִ/דָּ֔ם וְ/חַרְבִּ֖/י תֹּאכַ֣ל בָּשָׂ֑ר מִ/דַּ֤ם חָלָל֙ וְ/שִׁבְיָ֔ה מֵ/רֹ֖אשׁ פַּרְע֥וֹת אוֹיֵֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/042.yaml
  text: I will make my arrows drunk with blood[a], and my sword will devour flesh— with the blood of the slain and the captives, from the heads of the enemy leaders.
translation:
  language: ta
  text: 'என் அம்புகளை இரத்தத்தால் போதையுறச் செய்வேன்;


    என் வாள் சதையை விழுங்கும்—


    கொல்லப்பட்டவர்களின் மற்றும் சிறைபிடிக்கப்பட்டவர்களின் இரத்தத்தால்,


    பகைவரின் நீண்ட தலைமுடியுடையோரின் தலைகளிலிருந்து.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: கடைசித் தொடர் எபிரெயத்தில் தெளிவற்றது. இதை “பகைவரின் தலைவர்களுடைய தலைகளிலிருந்து” அல்லது “பகைவரின் நீண்ட தலைமுடியுள்ள போர்வீரர்களின் தலைகளிலிருந்து” என்றும் மொழிபெயர்க்கலாம். פַּרְעוֹת என்ற அரிய சொல்லின் பொருள் விவாதத்திற்குரியது.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַשְׁכִּיר
  choice: வெறிகொள்ளச் செய்வேன்
  rationale: שׁכר என்பதன் ஹிப்ஈல் வடிவம் நேரடியாக ‘குடிவெறிகொள்ளச் செய்’ எனப் பொருள்படும். அம்புகள் இரத்தத்தால் நிறைவதைச் சித்தரிக்கும் துணிவான கவிதை உருவகத்தைத் தக்கவைக்க, இயல்பான தமிழில் ‘வெறிகொள்ளச் செய்வேன்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: חִצַּי
  choice: என் அம்புகளை
  rationale: חֵץ என்பதன் பன்மை, முதலாம் நபர் ஒருமை உடைமை வடிவம்; நவீனத் தமிழில் இயல்பான போர் ஆயுதச் சொல்.
- source_word: מִדָּם
  choice: இரத்தத்தால்
  rationale: ‘வெறிகொள்ளச் செய்வேன்’ என்பதோடு வரும் מן இங்கு காரணம் அல்லது நிறைவைச் சுட்டுகிறது; தமிழ் கருவிப்பொருள் வேற்றுமை அந்த உறவை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וְחַרְבִּי תֹּאכַל בָּשָׂר
  choice: என் வாள் சதையை விழுங்கும்
  rationale: ‘வாள் சதையைத் தின்னும்’ என்ற எபிரெய உருவகத்தின் வன்மையையும் கவித்துவத்தையும் ‘விழுங்கும்’ இயல்பாகத் தக்கவைக்கிறது.
- source_word: מִדַּם חָלָל וְשִׁבְיָה
  choice: கொல்லப்பட்டவர்களுடையவும் சிறைபிடிக்கப்பட்டவர்களுடையவும் இரத்தத்தை
  rationale: חָלָל போரில் கொல்லப்பட்டவர்களையும், שִׁבְיָה இச்சூழலில் சிறைபிடிக்கப்பட்ட மனிதர்களையும் குறிக்கிறது. ஒரே ‘இரத்தத்தை’ இரு குழுக்களுடனும் இணைத்து, மூலத்தின் கடுமையான பொருளை மறைக்காமல் தருகிறது.
- source_word: מֵרֹאשׁ
  choice: தலைகளிலிருந்து
  rationale: רֹאשׁ என்பதன் நேரடியான உடலுறுப்பு உருவகத்தைப் பாதுகாக்கிறது; பின்வரும் விவாதத்திற்குரிய பன்மைச் சொல்லுடன் பொருந்தும்படி தமிழில் பன்மையாக வழங்கப்படுகிறது.
- source_word: פַּרְעוֹת
  choice: விரிந்த தலைமுடியுள்ள
  rationale: அரிதான இச்சொல் கட்டவிழ்ந்த அல்லது விரிந்த தலைமுடியைக் குறிக்கக்கூடும். ‘தலைவர்கள்’ என்று விளக்கவுரை செய்வதைவிட, மூலத்தின் உடற்காட்சி மற்றும் உண்மையான தெளிவின்மையை முதன்மை உரையில் காக்கிறது.
- source_word: אוֹיֵב
  choice: பகைவரின்
  rationale: கூட்டுப் பொருளுடைய ஒருமையை நவீனத் தமிழில் இயல்பான ‘பகைவர்’ மூலம் வழங்குகிறது.
theological_decisions:
- issue: מֵרֹאשׁ פַּרְעוֹת אוֹיֵב என்ற கடினமான தொடரின் பொருள்
  choice: பகைவரின் விரிந்த தலைமுடியுள்ள தலைகளிலிருந்து
  alternative: பகைவரின் தலைவர்களுடைய தலைகளிலிருந்து; பகைவரின் நீண்ட தலைமுடியுள்ள போர்வீரர்களிலிருந்து
  rationale: இது கோட்பாட்டுச் சிக்கலைவிட சொற்பொருள் மற்றும் தொடரியல் தெளிவின்மை. פַּרְעוֹת என்பதை ‘தலைவர்கள்’ என்று உறுதியாக விளக்காமல், தலைமுடி சார்ந்த சாத்தியமான நேரடிப் பொருளை முதன்மை உரையில் வைத்தும் மற்ற வாசிப்புகளை அடிக்குறிப்பில் குறிப்பிட்டும் தெளிவின்மை பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான தமிழில் மோசேயின் பாடலுக்குரிய இணைவரி அமைப்பும் கடுமையான போர்க்கவிதை உருவகங்களும் தக்கவைக்கப்பட்டுள்ளன. ‘வெறிகொள்ளச் செய்வேன்’, ‘விழுங்கும்’ ஆகியவை மூலத்தின் மனிதப்படுத்தல் உருவகங்களை மென்மைப்படுத்தாமல் வழங்குகின்றன.
