base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/049.yaml
  text: Go up to this mountain of the Abarim[a], Mount Nebo, which is in the land of Moab, opposite Jericho, and see the land of Canaan[c][b], which I am giving to the sons of Israel as a possession.
translation:
  language: ta
  text: “எரிகோவுக்கு எதிரில்[a] அமைந்துள்ள மோவாப் நாட்டில் உள்ள அபாரீம் மலையின் இந்த நேபோ மலைக்கு ஏறிப்போ. நான் இஸ்ரவேல் மக்களுக்கு[b] உடைமையாகக்[c] கொடுக்கிற கானான் நாட்டைப் பார்.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘எரிகோவுக்கு முகமாக’ என்றும் மொழிபெயர்க்கலாம். எபிரெய மரபுத்தொடர் புவியியல் நிலையில் எதிரில் அல்லது முன்னால் இருப்பதைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: சொல்லெழுத்தாக, ‘இஸ்ரவேலின் மகன்களுக்கு.’ இங்கு இஸ்ரவேல் மக்களைக் கூட்டாகக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: c
    text: ‘நிலவுடைமையாக’ என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் ஒருவருக்குரிய உடைமையை, குறிப்பாக நிலப்பற்றைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲלֵה
  choice: ஏறிப்போ
  rationale: עלה என்பதன் இரண்டாம் நபர் ஆண்பால் ஒருமை கட்டளை வடிவம் மேல்நோக்கிச் செல்வதைச் சுட்டுகிறது; ‘ஏறிப்போ’ இயல்பான நவீனத் தமிழில் அதன் திசை உணர்வைத் தக்கவைக்கிறது.
- source_word: הַר הָעֲבָרִים הַזֶּה הַר נְבוֹ
  choice: இந்த அபாரீம் மலையாகிய நேபோ மலை
  rationale: அபாரீம், நேபோ ஆகியவை புவியியல் பெயர்களாக ஒலிபெயர்க்கப்பட்டுள்ளன; எபிரெயச் சேர்க்கை மற்றும் விளக்கநிலையைத் தமிழில் தெளிவாகக் காட்ட ‘மலையாகிய’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: אֲשֶׁר בְּאֶרֶץ מוֹאָב
  choice: மோவாப் நாட்டில் ... உள்ள
  rationale: இந்த உறவுத்தொடர் மலையின் புவியியல் இருப்பிடத்தைச் சொல்கிறது; தமிழில் இயல்பான பெயரெச்சத் தொடராக அமைக்கப்பட்டுள்ளது.
- source_word: אֲשֶׁר עַל פְּנֵי יְרֵחוֹ
  choice: எரிகோவுக்கு எதிரே
  rationale: புவியியல் சூழலில் עַל־פְּנֵי என்பது ‘எதிரே’ அல்லது ‘முகமாக’ என்ற பொருளைத் தருகிறது; ‘எதிரே’ தெளிவான நவீனத் தமிழ்.
- source_word: וּרְאֵה
  choice: பார்
  rationale: ראה என்பதன் கட்டளை வடிவத்தின் நேர்மையையும் எளிமையையும் ‘பார்’ தக்கவைக்கிறது.
- source_word: אֶת אֶרֶץ כְּנַעַן
  choice: கானான் நாடு
  rationale: கானான் என்ற புவியியல் பெயர் வழக்கமான தமிழ் வடிவில் ஒலிபெயர்க்கப்பட்டுள்ளது; אֶרֶץ இங்கு ‘நாடு’ என இயல்பாக மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: אֲשֶׁר אֲנִי נֹתֵן
  choice: நான் ... கொடுக்கிற
  rationale: முதல் நபர் சுட்டுப்பெயருடன் வரும் நிகழ்காலப் பங்கேற்பு வடிவம் நடந்து கொண்டிருக்கும் அல்லது உறுதியாக நடைபெறவுள்ள கொடையை உணர்த்துகிறது; ‘கொடுக்கிற’ அந்த உடனடியான தன்மையைத் தக்கவைக்கிறது.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்களுக்கு
  rationale: சொல்லெழுத்தாக ‘இஸ்ரவேலின் மகன்களுக்கு’ என்றாலும், இத்தொடர் இங்கு முழு உடன்படிக்கை மக்களையும் குறிக்கும் வழக்கமான இனப்பெயர்; ‘இஸ்ரவேல் மக்கள்’ நவீனத் தமிழில் இயல்பாகவும் பொருள் தெளிவாகவும் உள்ளது. சொல்லெழுத்து அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: לַאֲחֻזָּה
  choice: உடைமையாக
  rationale: אֲחֻזָּה என்பது ஒருவருக்குரிய உடைமை அல்லது குறிப்பாக நிலவுடைமையைக் குறிக்கிறது; ‘உடைமையாக’ தேவையற்ற மரபுரிமை நுணுக்கத்தைச் சேர்க்காமல் மூலப் பொருளைத் தருகிறது.
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל என்பதன் பாலின வடிவத்தையும் கூட்டுமக்கள் பொருளையும் தமிழில் வெளிப்படுத்துதல்
  choice: இஸ்ரவேல் மக்களுக்கு
  alternative: இஸ்ரவேலின் மகன்களுக்கு
  rationale: எபிரெயத் தொடர் இலக்கணப்படி ஆண்பால் பன்மையாக இருந்தாலும், இச்சூழலில் இஸ்ரவேல் சமூகத்தையே குறிக்கும் நிலையான இனப்பெயராகச் செயல்படுகிறது. ‘மக்களுக்கு’ என்பது அதன் கூட்டு நோக்கத்தை நவீனத் தமிழில் தெளிவாக்குகிறது; சொல்லெழுத்தான வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: אֲחֻזָּה என்பதைக் ‘மரபுரிமை’ என்று மொழிபெயர்க்கலாமா
  choice: உடைமையாக
  alternative: மரபுரிமையாக
  rationale: இச்சொல் நிலையான உடைமை அல்லது நிலப்பற்றைக் குறிக்கிறது; ‘மரபுரிமை’ என்பது சில சூழல்களில் சாத்தியமானாலும், இங்கே வெளிப்படையாக இல்லாத பரம்பரை வழி பெறுதல் என்ற நுணுக்கத்தைச் சேர்க்கக்கூடும்.
translation_notes:
  register: நவீன நிலையான தமிழில் நேரடியான தெய்வீகக் கட்டளையின் வலிமை காக்கப்பட்டுள்ளது. புவியியல் பெயர்கள் தமிழ் வேதாகமப் பயன்பாட்டிற்கு ஏற்ற வழக்கமான வடிவங்களில் தரப்பட்டுள்ளன. நீண்ட எபிரெய உறவுத்தொடர் தமிழில் வாசிக்க எளிதான ஒரே பெயரெச்ச அமைப்பாக மாற்றப்பட்டாலும், தகவல் வரிசையும் கருத்துச் சார்புகளும் பாதுகாக்கப்பட்டுள்ளன.
