base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/028.yaml
  text: For they are a nation devoid of counsel, and there is no understanding in them.
translation:
  language: ta
  text: 'ஏனெனில், அவர்கள் ஆலோசனை இழந்த ஒரு தேசம்;

    அவர்களிடம் பகுத்தறிவு இல்லை.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய கூற்றுக்கான காரணத்தையோ விளக்கத்தையோ அறிமுகப்படுத்துகிறது; இச்சூழலில் இயல்பான தொடர்பை அளிக்கிறது.
- source_word: גּוֹי
  choice: தேசம்
  rationale: ஒரு மக்கள் கூட்டத்தை ஒருமையாகக் குறிக்கும் பெயர்ச்சொல்; எபிரெயச் செய்யுளின் கூட்டு ஒருமையைப் பேணுகிறது.
- source_word: אֹבַד עֵצוֹת
  choice: அறிவுரையற்ற
  rationale: நல்ல அறிவுரையையோ விவேகமான திட்டமிடலையோ இழந்த நிலையைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது; சொற்சொல்லான ‘அறிவுரைகளை இழந்த’ என்பதன் இடர்ப்பாட்டைத் தவிர்க்கிறது.
- source_word: הֵמָּה
  choice: அவர்கள்
  rationale: வலியுறுத்தப்பட்ட தனிப்பட்ட சுட்டுப்பெயரைக் காட்டுகிறது; தமிழில் பெயர்ப் பயனிலை வாக்கியத்திற்கு வெளிப்படையான இணைப்புவினை தேவையில்லை.
- source_word: וְאֵין
  choice: இல்லை
  rationale: எதிர்மறை இருப்புநிலையை இயல்பான தமிழில் தெரிவிக்கிறது; இரண்டாம் அடியில் உள்ள வாக்கிய இணைப்பு செய்யுள் அமைப்பால் தெளிவாகிறது.
- source_word: בָּהֶם
  choice: அவர்களிடம்
  rationale: அந்த மக்களுக்குள் அல்லது அவர்களிடத்தில் இக்குணம் இல்லாததை இயல்பான தமிழில் குறிக்கிறது.
- source_word: תְּבוּנָה
  choice: புரிந்துணர்வு
  rationale: வெறும் தகவல் அறிவை அல்லாமல், பகுத்தறிந்து உணரும் திறனைச் சுட்டுகிறது; எபிரெய ஞானச் சொல்வழக்கைத் தெளிவாகப் பேணுகிறது.
