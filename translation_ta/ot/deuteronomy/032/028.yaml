translation_notes:
  register: நவீன நிலையான தமிழில், எபிரெயச் செய்யுளின் இரு இணை அடிகளையும் கூட்டு ஒருமையையும் பேணும் கண்ணியமான நடை. ‘அறிவுரை’ மற்றும் ‘புரிந்துணர்வு’ என்ற சொற்கள் ஞானம் சார்ந்த கருத்து இணைப்பைத் தக்கவைக்கின்றன.
