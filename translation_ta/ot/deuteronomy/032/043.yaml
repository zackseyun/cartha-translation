base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/043.yaml
  text: Rejoice[a], O nations, with his people, for he will avenge the blood of his servants; he will repay vengeance on his adversaries[d][c][b], and he will make atonement for his land and his people.
translation:
  language: ta
  text: நாடுகளே, அவருடைய மக்களோடு சேர்ந்து அகமகிழுங்கள்[a]; ஏனெனில் அவர் தம் ஊழியர்களின் இரத்தத்திற்குப் பழிதீர்ப்பார்[b]; தம் எதிரிகளுக்குப் பழிவாங்குவார்; தம் நாட்டிற்கும் தம் மக்களுக்கும் பாவநிவிர்த்தி செய்வார்[d].[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நாடுகளே, அவருடைய மக்களோடு சேர்ந்து மகிழ்ச்சியுடன் பாடுங்கள்.” எபிரேய ஏவல்வினை மகிழ்ச்சி ஆரவாரத்தையோ பாடலையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: எபிரேயத்தில், “தம் ஊழியர்களின் இரத்தம்.” இங்கு அவர்களுடைய சிந்தப்பட்ட இரத்தத்திற்காகப் பழிதீர்ப்பது பொருள். ‘ஊழியர்கள்’ என்பதற்கு வேறு சூழல்களில் ‘அடிமைகள்’ என்றும் பொருள் வரலாம்.
    reason: lexical_alternative
  - marker: c
    text: கிரேக்க செப்துவஜிந்தாவும் ஒரு சவக்கடல் சுருளும் இவ்வசனத்தின் நீண்ட வடிவத்தைப் பாதுகாக்கின்றன. அதில் வானங்களும் தெய்வீக உயிர்களும் மகிழுமாறும் நாடுகள் அவரை வணங்குமாறும் கூடுதல் அழைப்புகள் உள்ளன. இங்குள்ள பிரதான உரை மசோரா எபிரேய உரையைப் பின்பற்றுகிறது.
    reason: textual_variant
  - marker: d
    text: அல்லது, “தம் நாட்டையும் தம் மக்களையும் தூய்மைப்படுத்துவார் (அல்லது, களங்கம் நீக்குவார்).” எபிரேய வினைச்சொல் பாவநிவிர்த்தியையோ தூய்மைப்படுத்தலையோ வலியுறுத்தலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַרְנִינוּ
  choice: அகமகிழுங்கள்
  rationale: רנן என்பதன் பன்மை ஏவல்வினை ஆரவாரத்தோடும் பாடலோடும் வெளிப்படும் பேருவகையைக் குறிக்கலாம். இயல்பான தமிழில் மகிழ்ச்சியின் வலிமையைத் தெரிவிக்க ‘அகமகிழுங்கள்’ தேர்ந்தெடுக்கப்பட்டது; ஒலியுடன் கூடிய மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: גוֹיִם
  choice: நாடுகளே
  rationale: சர்வதேச மக்கள்தொகுதிகளைச் சுட்டும் גוים என்பதற்கான இயல்பான தமிழ். ‘புறவினத்தார்’ என்பது இச்சூழலில் பிற்கால சமயச் சாயலை ஏற்படுத்தக்கூடும்.
- source_word: עַמּוֹ
  choice: அவருடைய மக்களோடு சேர்ந்து
  rationale: மசோரா உரையின் சொற்றொடர் சுருக்கமானது. நாடுகள் அவருடைய மக்களுடன் மகிழுமாறு அழைக்கப்படுகின்றன என்ற சாத்தியமான தொடரியலை ‘ஓடு சேர்ந்து’ இயல்பாக வெளிப்படுத்துகிறது; உள்ளார்ந்த தெளிவின்மை இறையியல் குறிப்பில் பதிவு செய்யப்படுகிறது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: மகிழ்ச்சிக்கான அழைப்பின் காரணத்தை அறிமுகப்படுத்துகிறது.
- source_word: דַם עֲבָדָיו
  choice: தம் ஊழியர்களின் இரத்தப்பழி
  rationale: ‘இரத்தம்’ என்பதோடு יִקּוֹם இணைவதால் அநியாயமாகச் சிந்தப்பட்ட இரத்தத்திற்கான பழிதீர்ப்பைக் குறிக்கும் இயல்பான தமிழ் கூறு பயன்படுத்தப்படுகிறது. עבדים என்பதன் அடிப்படை மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: יִקּוֹם
  choice: இரத்தப்பழியைத் தீர்ப்பார்
  rationale: נקם வேரின் இவ்வடிவம் சிந்தப்பட்ட இரத்தத்திற்காக நீதி செய்து பழிதீர்ப்பதைக் குறிக்கிறது.
- source_word: וְנָקָם יָשִׁיב
  choice: பழிவாங்குவார்
  rationale: சொல்லுக்கு சொல் ‘பழிவாங்குதலைத் திருப்பிக்கொடுப்பார்’ என்றிருந்தாலும், எதிரிகளுக்கு அவர்கள் செய்ததற்கேற்ற பதிலடியை வழங்கும் எபிரேய மொழிவழக்கை இயல்பான தமிழில் ‘பழிவாங்குவார்’ எனத் தருகிறது.
- source_word: לְצָרָיו
  choice: தம் எதிரிகளுக்கு
  rationale: ' hostile opponents என்பதைக் குறிக்கும் צרים-க்கு தெளிவான, dignified தமிழ் இணை.'
- source_word: וְכִפֶּר
  choice: பாவநிவிர்த்தி செய்வார்
  rationale: כפר என்பதன் நிவிர்த்தி/தூய்மைப்படுத்தல் சார்ந்த இறையியல் வலிமையைப் பாதுகாக்கிறது; ‘தூய்மைப்படுத்துவார்’ என்ற மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: אַדְמָתוֹ
  choice: தம் நாட்டிற்காக
  rationale: தேசிய-உடன்படிக்கைச் சூழலில் אדמה என்பதற்கு ‘நாடு’ இயல்பானது; -க்காக என்பது כפר உடன் வரும் பொருள் உறவை வெளிப்படுத்துகிறது.
- source_word: עַמּוֹ
  choice: தம் மக்களுக்காக
  rationale: இறுதி இணைச்சொல் தொடரில் ‘நாடு’ என்பதோடு ‘மக்கள்’ என்பதையும் ஒரே வகையில் இணைக்கிறது.
theological_decisions:
- issue: தொடக்க அடியில் ‘நாடுகள்’ மற்றும் ‘அவருடைய மக்கள்’ ஆகியோருக்கிடையிலான உறவு
  choice: நாடுகள் தேவனுடைய மக்களோடு சேர்ந்து மகிழுமாறு அழைக்கப்படுகின்றன.
  alternative: நாடுகள் அவருடைய மக்களைப் புகழுமாறு அழைக்கப்படுகின்றன; அல்லது நீண்ட கிரேக்க/சவக்கடல் சுருள் வாசகத்தைப் பின்பற்றலாம்.
  rationale: மசோரா வாசகம் மிகவும் சுருக்கமாக இருந்தாலும், עמו-வை உடனிகழ்ச்சி உறவாகக் கொள்வது பொருத்தமான தொடரியல். ‘ஓடு சேர்ந்து’ என்பது அதைக் குறைந்த அளவில் வெளிப்படுத்துகிறது; வேறு வாசக மரபு அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
- issue: இறுதி அடியில் כפר என்பதன் பொருள்
  choice: தேவன் தம் நாட்டிற்காகவும் மக்களுக்காகவும் பாவநிவிர்த்தி செய்வார்.
  alternative: தேவன் தம் நாட்டையும் மக்களையும் தூய்மைப்படுத்துவார்/களங்கம் நீக்குவார்.
  rationale: வினைச்சொல்லின் நிவிர்த்தி சார்ந்த இறையியல் எடையை பிரதான உரை பாதுகாக்கிறது; அது செயல்படும் முறையைப் பற்றிய பிற்கால கோட்பாட்டை வசனத்திற்குள் சேர்க்கவில்லை.
translation_notes:
  register: நவீன தரத் தமிழில், கவிதைநயம் கொண்ட ஆனால் பொதுவாசகர்களுக்குப் புரியக்கூடிய கண்ணியமான நடை. தெய்வீக உரையாடலில் மரியாதைத் தன்னிலைச் சுட்டாக ‘தம்’ பயன்படுத்தப்பட்டது. ‘பாவநிவிர்த்தி’ என்ற பரவலாக அறியப்படும் வேதாகமச் சொல் தக்கவைக்கப்பட்டு அதன் மாற்றுப் பொருள் அடிக்குறிப்பில் விளக்கப்பட்டது. அனைத்து அடிக்குறிப்பு குறிகளும் பிரதான உரையில் இடம்பெறுகின்றன.
