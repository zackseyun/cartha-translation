    rationale: The Hebrew explicitly says “the blood of his servants.” Although “bloodguilt” conveys the contextual implication, it adds an abstraction not present in the source and obscures the explicit image of blood. “தம் ஊழியர்களின் இரத்தத்திற்குப் பழிதீர்ப்பார்” preserves both the Hebrew wording and the intended sense.
