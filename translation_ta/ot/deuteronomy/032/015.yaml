base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/015.yaml
  text: But Jeshurun grew fat and kicked; you grew fat[a], thick, and sleek. Then he forsook God who made him and treated with contempt the Rock of his salvation.
translation:
  language: ta
  text: 'ஆனால் யெஷுரூன் கொழுத்தான்; உதைத்தான்;


    நீ கொழுத்தாய், பருத்தாய், கொழுப்பேறினாய்.[a]


    பின்பு அவன் தன்னை உண்டாக்கிய கடவுளைக் கைவிட்டு,


    தன் மீட்பின் கற்பாறையை அவமதித்தான்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கொழுப்பால் மூடப்பட்டாய்” அல்லது “வீங்கிப்போனாய்.” இதற்கான எபிரெயச் சொல் அரிதானது; அதன் துல்லியமான நயம் உறுதியில்லை. எனினும், அளவுக்கு மீறி ஊட்டமடைந்த நிலையே இங்கு தெளிவாகத் தெரிகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְשֻׁרוּן
  choice: யெஷுரூன்
  rationale: இஸ்ரவேலைக் குறிக்கும் கவிதைமிக்க சிறப்புப்பெயரை விளக்கமாக மாற்றாமல் ஒலிபெயர்ப்பதால் அதன் பெயர்த் தன்மையும் பொருள் நயமும் காக்கப்படுகின்றன.
- source_word: וַיִּשְׁמַן
  choice: கொழுத்து
  rationale: செழிப்பால் ஏற்பட்ட தன்னிறைவை உணர்த்தும் மூலத்தின் நேரடியான உடல் உருவகத்தைப் பேணுகிறது.
- source_word: וַיִּבְעָט
  choice: காலால் உதைத்தான்
  rationale: நன்றாகத் தீனியூட்டப்பட்ட விலங்கு அடங்காமல் உதைப்பதைப் போன்ற உயிரோட்டமுள்ள உருவகத்தைத் தெளிவாக்குகிறது.
- source_word: שָׁמַנְתָּ
  choice: நீ கொழுத்தாய்
  rationale: மூன்றாம் நபரிலிருந்து நேரடி இரண்டாம் நபர் குற்றச்சாட்டுக்கு மாறும் எபிரெயக் கவிதை நடையைப் பேணுகிறது.
- source_word: עָבִיתָ
  choice: பருத்தாய்
  rationale: அளவுக்கு மீறிய வளத்தால் உடல் கனத்துப் பருத்த உருவகத்தை இயல்பான தமிழில் தொடர்கிறது.
- source_word: כָּשִׂיתָ
  choice: கொழுப்பேறினாய்
  rationale: அரிதான இச்சொல்லின் துல்லிய நயம் உறுதியற்றிருந்தாலும், அளவுக்கு மீறிய கொழுமை என்ற சூழல்சார் பொருளைத் தெரிவிக்கிறது; மாற்று சாத்தியங்கள் அடிக்குறிப்பில் தரப்படுகின்றன.
- source_word: וַיִּטֹּשׁ
  choice: கைவிட்டு
  rationale: உடன்படிக்கைச் சார்ந்த விசுவாசமின்மையை நவீன, தெளிவான தமிழில் உணர்த்துகிறது.
- source_word: אֱלוֹהַ עָשָׂהוּ
  choice: தன்னை உண்டாக்கிய கடவுள்
  rationale: இஸ்ரவேலை உருவாக்கியவர் கடவுள் என்பதைக் காட்டும் தொடர்புச் சொற்றொடர் அமைப்பைப் பேணுகிறது.
- source_word: וַיְנַבֵּל
  choice: அவமதித்தான்
  rationale: இழிவாகக் கருதி மரியாதையின்றி நடத்தும் செயற்பாட்டுப் பொருளைச் சுருக்கமாகவும் தெளிவாகவும் தருகிறது.
- source_word: צוּר
  choice: கற்பாறை
  rationale: உபாகமம் 32 முழுவதும் கடவுளைக் குறிக்கும் வலிமையான உருவகத்தை மொழிபெயர்த்து வைத்திருக்கிறது.
- source_word: יְשׁוּעָתוֹ
  choice: தன் மீட்பு
  rationale: விடுதலை மற்றும் இரட்சிப்பின் பொருட்சுமையை இயல்பான தமிழில் தக்கவைக்கிறது.
theological_decisions:
- issue: மூன்றாம் நபர் உரையிலிருந்து இரண்டாம் நபர் நேரடி விளிப்புக்கும் மீண்டும் மூன்றாம் நபருக்கும் மாறுதல்
  choice: “யெஷுரூன் ... உதைத்தான்; நீ ... கொழுத்தாய் ... பின்பு அவன் ... கைவிட்டு” என்ற நபர் மாற்றம் பேணப்பட்டது.
  alternative: எல்லா வினைகளையும் மூன்றாம் நபரில் ஒருமைப்படுத்துதல்.
  rationale: இந்தத் திடீர் மாற்றம் விளக்கத்திலிருந்து நேரடிக் குற்றச்சாட்டுக்குச் சென்று மீண்டும் விளக்கத்திற்குத் திரும்பும் எபிரெயக் கவிதையின் வலிமையை உருவாக்குகிறது; அதைச் சீராக்குவது மூலத்தின் அழுத்தத்தைக் குறைக்கும்.
- issue: צוּר என்னும் இறை உருவகம்
  choice: “தன் மீட்பின் கற்பாறை” என உருவகம் நேரடியாகப் பேணப்பட்டது.
  alternative: “தன்னை மீட்ட கடவுள்” என்று உருவகத்தை விளக்கமாக மாற்றுதல்.
  rationale: மோசேயின் பாடலில் “கற்பாறை” கடவுளுக்கான தொடர்ச்சியான உருவகப் பெயராக வருகிறது; இதை அப்படியே வைத்திருப்பது பாடலின் இறையியல் மற்றும் கவிதைத் தொடர்பைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், கவிதைத் தன்மையும் கண்டனத்தின் வலிமையும் காக்கப்பட்டுள்ளன. “யெஷுரூன்” ஒலிபெயர்க்கப்பட்டுள்ளது; “கற்பாறை” என்ற இறை உருவகம் விளக்கமாகக் கரைக்கப்படவில்லை. நபர் மாற்றம் திட்டமிட்டு அப்படியே வைக்கப்பட்டுள்ளது.
