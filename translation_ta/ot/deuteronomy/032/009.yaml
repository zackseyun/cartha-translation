source:
  edition: WLC
  text: כִּ֛י חֵ֥לֶק יְהֹוָ֖ה עַמּ֑/וֹ יַעֲקֹ֖ב חֶ֥בֶל נַחֲלָתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/009.yaml
  text: For Yahweh’s portion is his people[a], Jacob the share of his inheritance.
translation:
  language: ta
  text: 'ஏனெனில், யாவேக்குரிய பங்கு அவருடைய மக்களே;

    யாக்கோபு அவருடைய உரிமைச்சொத்தின் ஒதுக்கப்பட்ட பங்கு[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவருடைய உரிமைச்சொத்தின் அளவிடும் கயிறு” அல்லது “அவருடைய உரிமைச்சொத்தின் பங்கு.” எபிரெயச் சொல்லான חֶבֶל, சொல்லளவில் அளவிடும் கயிற்றையும், விரிவான பொருளில் அளந்து ஒதுக்கப்பட்ட பங்கையும் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய கருத்துக்கான காரணத்தையோ விளக்கத்தையோ அறிமுகப்படுத்தும் இணைப்புச் சொல்லாக இங்கு வருகிறது.
- source_word: חֵלֶק
  choice: பங்கு
  rationale: ஒருவருக்கு உரியதாக அல்லது ஒதுக்கப்பட்டதாக இருக்கும் பங்கைக் குறிக்கிறது; செய்யுளின் உரிமைச்சொத்து உருவகத்திற்கும் பொருந்துகிறது.
- source_word: יְהֹוָה
  choice: யாவே
  rationale: எபிரெய மூலத்தில் நேரடியாக வரும் இறைத் திருப்பெயரைத் தமிழில் ஒலிபெயர்த்துள்ளது.
- source_word: עַמּוֹ
  choice: அவருடைய மக்கள்
  rationale: உறவையும் உடன்படிக்கைச் சார்பையும் வெளிப்படுத்தும் עַם என்பதற்கு ‘மக்கள்’ இயல்பான தமிழ் இணையாகும்.
- source_word: יַעֲקֹב
  choice: யாக்கோபு
  rationale: மூலத்தில் உள்ள முற்பிதாவின் பெயரை அப்படியே வைத்து, இஸ்ரவேல் மக்களைக் கூட்டாகக் குறிக்கும் கவிதை நடையையும் இணை அமைப்பையும் பாதுகாக்கிறது.
- source_word: חֶבֶל
  choice: பங்கு
  rationale: இச்சொல் சொல்லளவில் அளவிடும் கயிற்றையும், விரிவான பொருளில் அளந்து ஒதுக்கப்பட்ட பங்கையும் குறிக்கலாம். முதன்மை உரையில் இயல்பான ‘பங்கு’ பயன்படுத்தப்பட்டு, மூல உருவகமும் மாற்றுப் பொருள்களும் அடிக்குறிப்பில் தரப்படுகின்றன.
- source_word: נַחֲלָתוֹ
  choice: அவருடைய உரிமைச்சொத்து
  rationale: மரபுவழியாகக் கிடைக்கும் உடைமை அல்லது ஒருவருக்குச் சொந்தமான பங்கு என்ற נַחֲלָה சொல்லின் உரிமை மற்றும் சுதந்தர உருவகத்தைத் தக்கவைக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைத் திருப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: ஆண்டவர் / யெகோவா
  rationale: மூலத்தில் வரும் தனிப்பட்ட உடன்படிக்கைப் பெயரை பொதுப் பட்டப்பெயராக மாற்றாமல் ஒலிபெயர்க்கிறது.
- issue: יַעֲקֹב என்பதை விளக்கமாக ‘இஸ்ரவேல்’ என்று மாற்றலாமா
  choice: யாக்கோபு
  alternative: இஸ்ரவேல்
  rationale: எபிரெயச் செய்யுள் முற்பிதாவின் பெயரைப் பயன்படுத்துகிறது; அதைத் தக்கவைப்பது மூலச் சொல்லையும் கவிதை இணை அமைப்பையும் பாதுகாக்கிறது.
- issue: חֶבֶל என்பதிலுள்ள உருவகத் தெளிவின்மை
  choice: முதன்மை உரையில் ‘பங்கு’; மாற்றுப் பொருள்கள் அடிக்குறிப்பில்
  alternative: அளவிடும் கயிறு / ஒதுக்கப்பட்ட பங்கு
  rationale: சூழலில் ஒதுக்கப்பட்ட பங்கு என்பதே உடனடிப் பொருள்; ஆயினும் ‘அளவிடும் கயிறு’ என்ற சொல்லளவுப் படிமத்தை அடிக்குறிப்பில் பாதுகாப்பது மூலத்தின் பலபொருள் தன்மையை மறைக்காமல் வைத்திருக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் எளிமையும் கண்ணியமும் கொண்ட கவிதை இணை அமைப்பு பயன்படுத்தப்பட்டுள்ளது. எபிரெய மூலத்தின் பெயர்ச்சொல் வாக்கிய வடிவமும் ‘பங்கு—பங்கு’ என்ற கருத்து இணையும் இயன்றவரை தக்கவைக்கப்பட்டுள்ளன.
