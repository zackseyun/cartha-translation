  text: כִּ֛י לֹ֥א כְ/צוּרֵ֖/נוּ צוּרָ֑/ם וְ/אֹיְבֵ֖י/נוּ פְּלִילִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/031.yaml
  text: For their rock is not like our Rock[a], and our enemies are judges.
translation:
  language: ta
  text: ஏனெனில், அவர்களுடைய கற்பாறை நமது கற்பாறையைப் போன்றது அல்ல[a]; நமது பகைவர்களே நடுவர்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது: “அவர்களுடைய கற்பாறை நமது கற்பாறையைப் போன்றது அல்ல; நமது பகைவர்கள்கூட இதற்குத் தீர்ப்பளிக்கிறார்கள்.” எபிரெயச் சொல் פְּלִילִים என்பதன் நேர்ப்பொருள் “நீதிபதிகள்” அல்லது “நடுவர்கள்.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய கூற்றுக்கான காரணத்தையோ ஆதாரத்தையோ அறிமுகப்படுத்துகிறது; பாடலின் வாத ஓட்டத்தில் இயல்பாக அமைகிறது.
- source_word: כְצוּרֵנוּ צוּרָם
  choice: அவர்களுடைய கற்பாறை நமது கற்பாறையைப் போன்றது அல்ல
  rationale: צוּר என்ற ஒரே உருவகம் இரு தரப்புக்கும் பயன்படுத்தப்பட்டிருப்பதால், ‘பாதுகாவலர்’ போன்ற விளக்கச் சொல்லால் மாற்றாமல் ‘கற்பாறை’ என்ற சொல் விளையாட்டையும் ஒப்பீட்டையும் காக்கிறது. தமிழில் பெரிய/சிறிய எழுத்து வேறுபாடு இல்லாததால் சூழலே உண்மையான தேவனுக்கும் பிறர் நம்பும் ஆதாரத்திற்கும் உள்ள வேறுபாட்டைக் காட்டுகிறது.
- source_word: וְאֹיְבֵינוּ
  choice: நமது பகைவர்களே
  rationale: ‘-ஏ’ என்ற வலியுறுத்தல், பகைவர்கள்கூட இந்த மதிப்பீட்டுக்கு நடுவர்களாக இருப்பதன் வியப்பூட்டும் சொல்லாட்சிச் சக்தியை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: פְּלִילִים
  choice: நடுவர்கள்
  rationale: பன்மை பெயர்ச்சொல்லின் ‘நீதிபதிகள்/நடுவர்கள்’ என்ற சட்டவியல் உணர்வைப் பாதுகாக்கிறது; ‘தீர்ப்பளிக்கிறார்கள்’ என்று வினைச்சொல்லாக்கி மறைபொருளை அளவுக்கு மீறி வெளிப்படுத்தவில்லை.
theological_decisions:
- issue: צוּר என்ற இறை உருவகத்தை விளக்கப் பட்டமாக மாற்றலாமா
  choice: ‘கற்பாறை’ என்ற உருவகத்தையே இரு இடங்களிலும் வைத்தல்
  alternative: பாதுகாவலர் / அடைக்கலம் / வல்லமை
  rationale: எபிரெய மூலத்தில் ஒரே பெயர்ச்சொல் இஸ்ரவேலின் தேவனுக்கும் பிற இனத்தார் நம்பும் ஆதாரத்திற்கும் பயன்படுத்தப்பட்டு கூர்மையான முரண்பாட்டை உருவாக்குகிறது; அதை அப்படியே வைத்திருப்பது எந்த ஓர் குறுகிய இறையியல் விளக்கத்தையும் திணிப்பதைத் தவிர்க்கிறது.
- issue: פְּלִילִים என்பதை பெயர்ச்சொல்லாகவா தீர்ப்பளிக்கும் வினையாகவா மொழிபெயர்ப்பது
  choice: ‘நடுவர்கள்’ என்ற பெயர்ச்சொல் வடிவத்தைத் தக்கவைத்தல்
  alternative: ‘நமது பகைவர்கள்கூட இவ்வாறு தீர்ப்பளிக்கிறார்கள்’
  rationale: மூலத்தின் சுருக்கமான சட்டவியல் கூற்றையும், பகைவர்கள் எந்த வகையில் ‘நடுவர்கள்’ என்பதில் உள்ள இயல்பான மறைநிலையையும் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பாடலுக்குரிய கண்ணியத்தையும் சுருக்கத்தையும் காக்கும் நடை. ‘கற்பாறை’ என்ற வேதாகம உருவகம் விளக்கமாக மாற்றப்படாமல் பாதுகாக்கப்பட்டுள்ளது; ‘நடுவர்கள்’ சட்டவியல் தொனியைத் தக்கவைக்கிறது.
