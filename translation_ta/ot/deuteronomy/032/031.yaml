  source_fidelity: மூல எபிரெயத்தின் சொற்சுருக்கமும் அமைப்பும் நன்றாகக் காக்கப்பட்டுள்ளன. כִּי-க்கு “ஏனெனில்,”, இரட்டை צוּר உருவகத்திற்கு இரு இடங்களிலும் “கற்பாறை,” மற்றும் פְּלִילִים-க்கு சட்டவியல் தொனியுடைய “நடுவர்கள்” ஆகியவை பொருத்தமானவை. “நமது பகைவர்களே” என்பது சூழலில் உள்ள வலியுறுத்தலை இயல்பாக வெளிப்படுத்துகிறது; மூலத்தின் சுருக்கமான பெயர்ச்சொல்-கூற்றையும் தக்கவைக்கிறது.
