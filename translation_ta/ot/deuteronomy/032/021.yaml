base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/021.yaml
  text: They made me jealous with what is not a god[a]; they provoked me to anger with their idols. So I will make them jealous with those who are not a people[c][b]; I will provoke them to anger with a foolish nation.
translation:
  language: ta
  text: 'அவர்கள் கடவுளல்லாததனால் என்னைப் பொறாமையடையச் செய்தார்கள்;

    தங்கள் வீணான சிலைகளால்[a] என்னைக் கோபமூட்டினார்கள்.


    ஆகவே, மக்களல்லாதவர்களால்[b] நான் அவர்களைப் பொறாமையடையச் செய்வேன்;

    மதியற்ற ஒரு இனத்தால்[c] அவர்களைக் கோபமூட்டுவேன்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “வீணான சிலைகள்” என்பதற்கான எபிரெயச் சொல் மூச்சு, நீராவி, வெறுமை அல்லது வீண்மை என்பதையும் குறிக்கலாம்; இச்சூழலில் அது சிலைகளைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: 'சொல்லுக்கு சொல்: “மக்களல்லாதவர்களால்.” இது “கடவுளல்லாதது” என்பதற்கு வேண்டுமென்றே இணையாக அமைக்கப்பட்டுள்ளது.'
    reason: lexical_alternative
  - marker: c
    text: “மதியற்ற” என்பது வெறும் அறிவுத்திறன் குறைவை அல்ல; ஒழுக்க மற்றும் ஆன்மிக விவேகக்கேட்டையும் குறிக்கிறது.
    reason: cultural_note
lexical_decisions:
- source_word: קִנְאוּנִי
  choice: எனக்கு எரிச்சலூட்டினார்கள்
  rationale: קנא என்பதன் பொறாமை அல்லது உரிமை உணர்வைத் தூண்டும் பொருளை இயல்பான தமிழில் தெரிவிக்கிறது; பின்னர் வரும் אַקְנִיאֵם உடனான பதிலீட்டு இணைப்பையும் காக்கிறது.
- source_word: בְּלֹא אֵל
  choice: கடவுள் அல்லாத ஒன்றால்
  rationale: உண்மையான கடவுளுக்கு எதிராக நிறுத்தப்படும் ‘கடவுளே அல்லாதது’ என்ற எபிரெயச் சொல்லின் மறுப்பையும் கண்டன வலிமையையும் காக்கிறது.
- source_word: כִּעֲסוּנִי
  choice: என்னைக் கோபமூட்டினார்கள்
  rationale: כעס என்பதன் காரணவினைப் பொருளைத் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: בְּהַבְלֵיהֶם
  choice: தங்கள் வீணான சிலைகளால்
  rationale: הבל என்பதன் நீராவி, வெறுமை, வீண்மை ஆகிய அடிப்படை நிழற்பொருளையும் இச்சூழலில் அது குறிக்கும் சிலைகளையும் ஒருங்கே தெரிவிக்கிறது.
- source_word: אַקְנִיאֵם
  choice: நான் அவர்களுக்கு எரிச்சலூட்டுவேன்
  rationale: முதல் அடியில் உள்ள קנא வினையோடு ஒரே தமிழ்ச் சொல்லைப் பயன்படுத்தி, செயலுக்கும் பதில்தீர்ப்புக்கும் இடையிலான திட்டமிட்ட ஒப்புமையைக் காக்கிறது.
- source_word: בְּלֹא עָם
  choice: மக்களே அல்லாதவர்களால்
  rationale: ‘கடவுள் அல்லாத ஒன்று’ என்பதற்கு இணையாக அமைந்த ‘மக்களே அல்லாதவர்கள்’ என்ற அதிர்ச்சியூட்டும் எபிரெயச் சொற்றொடரை விளக்கித் தீர்க்காமல் காக்கிறது.
- source_word: בְּגוֹי נָבָל
  choice: அறிவுகெட்ட ஒரு நாட்டினால்
  rationale: נבל குறிக்கும் வெறும் அறிவுத்திறன் குறைவை அல்லாமல் ஒழுக்க-ஆன்மிக விவேகக்கேட்டை நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: אַכְעִיסֵם
  choice: அவர்களைக் கோபமூட்டுவேன்
  rationale: முன்னுள்ள כעס வினையுடன் ஒத்த மொழிபெயர்ப்பைப் பயன்படுத்தி, தெய்வீகப் பதில்தீர்ப்பின் சமச்சீரைக் காக்கிறது.
theological_decisions:
- issue: ‘மக்களே அல்லாதவர்கள்’ மற்றும் ‘அறிவுகெட்ட நாடு’ என்பவற்றின் குறிப்பு
  choice: எந்த வரலாற்று நாட்டையும் இனத்தையும் பெயரிடாமல் பொதுவாக மொழிபெயர்த்தல்
  alternative: ஒரு குறிப்பிட்ட பிறஇன நாடு அல்லது பிறஇனத்தார் அனைவரையும் வெளிப்படையாக அடையாளப்படுத்துதல்
  rationale: எபிரெய மூலவசனம் அந்த நாட்டை அடையாளப்படுத்தவில்லை; பொதுவான மொழிபெயர்ப்பு அதன் சொல்லாட்சியையும் இறையியல் இழுபறியையும் பின்னாளைய விளக்கத்தால் தீர்த்துவிடாமல் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; கவிதைநடையின் நான்கு இணை அடிகளும் காரணவினைகளின் பதிலீட்டு சமச்சீரும் காக்கப்பட்டுள்ளன. ‘எரிச்சலூட்டுதல்’ என்பது קנא-வின் பொறாமை/உரிமை உணர்வைத் தூண்டும் நிழற்பொருளை இயல்பாகத் தருகிறது; ‘கோபமூட்டுதல்’ כעס-இலிருந்து வேறுபடுத்தப்பட்டுள்ளது. எல்லா அடிக்குறிப்பு குறிகளும் உரையில் இடம்பெற்றுள்ளன.
