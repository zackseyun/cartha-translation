  source_fidelity: 'மூலத்தின் முக்கியக் கூறுகள் சரியாக உள்ளன: ‘வெறும் வார்த்தை அல்ல,’ ‘உங்கள் வாழ்வு,’ வார்த்தையினால் நீண்ட நாள் வாழ்தல், யோர்தானைக் கடத்தல், நிலத்தை உரிமையாக்குதல். ஆனால் עַל־הָאֲדָמָה என்பதற்கு ‘தேசத்தில்’ என்பதைக் காட்டிலும் ‘நிலத்தில்’ என்பது நிலப்பரப்பு/வாக்குத்தத்த நிலம் என்ற பொருளைத் துல்லியமாகக் காக்கிறது. மேலும் שָׁמָּה לְרִשְׁתָּהּ-இல் உள்ள ‘அங்கே/அதை’ என்ற இலக்கு உறவு தமிழில் வெளிப்படையாக இருப்பது நல்லது.'
  naturalness: திருத்தப்பட்ட வாக்கியம் நவீனத் தரத் தமிழில் இயல்பாகவும் தெளிவாகவும் உள்ளது. ‘யோர்தானைக் கடந்து, அதை உரிமையாக்கிக்கொள்ளப் போகும் நிலத்தில்’ என்பது கடத்தல், இலக்கு, உடைமையாக்குதல் ஆகியவற்றைத் தெளிவாக இணைக்கிறது.
