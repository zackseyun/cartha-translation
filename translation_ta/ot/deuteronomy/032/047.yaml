  text: כִּ֠י לֹֽא דָבָ֨ר רֵ֥ק הוּא֙ מִ/כֶּ֔ם כִּי ה֖וּא חַיֵּי/כֶ֑ם וּ/בַ/דָּבָ֣ר הַ/זֶּ֗ה תַּאֲרִ֤יכוּ יָמִים֙ עַל הָ֣/אֲדָמָ֔ה אֲשֶׁ֨ר אַתֶּ֜ם עֹבְרִ֧ים אֶת הַ/יַּרְדֵּ֛ן שָׁ֖מָּ/ה לְ/רִשְׁתָּֽ/הּ־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/047.yaml
  text: For it is not an empty word for you[a], but it is your life[c][b], and by this word you will prolong your days on the land that you are crossing the Jordan to possess.
translation:
  language: ta
  text: ஏனெனில், இது உங்களுக்கு வெறும் வார்த்தை அல்ல[a]; இதுவே உங்கள் வாழ்வு[b]. நீங்கள் யோர்தானைக் கடந்து, அதை உரிமையாக்கிக்கொள்ளப் போகும் நிலத்தில், இந்த வார்த்தையினால் நீண்ட நாட்கள் வாழ்வீர்கள்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘இது உங்களுக்கு அற்பமான காரியம் அல்ல’ அல்லது ‘பயனற்ற ஒன்று அல்ல.’
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில் ‘உங்கள் வாழ்வுகள்’ என்று பன்மை வடிவம் உள்ளது; அது மொழிமரபுப்படி ‘உங்கள் வாழ்வு’ என்ற ஒருமைத் தொகுப்புப்பொருளைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, ‘அதைச் சுதந்தரித்துக்கொள்ளப் போகும்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: דָבָר רֵק
  choice: வெறும் வார்த்தை
  rationale: דָבָר என்பது இங்கு இப்போது அறிவிக்கப்பட்ட உடன்படிக்கைப் போதனையைக் குறிக்கிறது; רֵק அதன் வெறுமை, பயனின்மை அல்லது அற்பத்தன்மையைச் சுட்டுகிறது. ‘வெறும் வார்த்தை’ என்பது மூலத்தின் உருவகத்தையும் இயல்பான தமிழையும் காக்கிறது.
- source_word: מִכֶּם
  choice: உங்களுக்கு
  rationale: מן இங்கு பிரிவைக் குறிக்கும் ‘உங்களிடமிருந்து’ என்ற பொருளில் அல்லாமல், இஸ்ரவேலருடன் தொடர்புடைய ‘உங்களுக்கு’ என்ற மொழிமரபுப் பொருளில் வருகிறது.
- source_word: חַיֵּיכֶם
  choice: உங்கள் வாழ்வு
  rationale: எபிரெயத்தில் இலக்கண வடிவம் பன்மையாக இருந்தாலும், חַיִּים வழக்கமாக ‘வாழ்வு’ என்ற ஒருமைத் தொகுப்புப்பொருளில் செயல்படுகிறது.
- source_word: וּבַדָּבָר הַזֶּה
  choice: இந்த வார்த்தையினால்
  rationale: בְּ இங்கு கருவிப்பொருளைக் காட்டுகிறது. ‘வார்த்தை’ என்று மொழிபெயர்ப்பது முந்தைய דָבָר உடனான தொடர்ச்சியைப் பாதுகாக்கிறது; கீழ்ப்படிதலை உரையில் வெளிப்படையாகச் சேர்க்காமல், உடன்படிக்கைச் சூழலைத் தக்கவைக்கிறது.
- source_word: תַּאֲרִיכוּ יָמִים
  choice: நீண்ட நாட்கள் வாழ்வீர்கள்
  rationale: சொல்லுக்கு சொல் ‘நாட்களை நீடிப்பீர்கள்’ என்ற எபிரெய உருவகம் தமிழில் இயல்பற்றதாக இருக்கும். ‘நீண்ட நாட்கள் வாழ்வீர்கள்’ என்பது அதே பொருளைத் தெளிவான நவீன தமிழில் தருகிறது.
- source_word: עַל הָאֲדָמָה
  choice: தேசத்தில்
  rationale: உபாகமத்தின் சூழலில் אֲדָמָה என்பது இஸ்ரவேலர் பெறவிருக்கும் நிலப்பரப்பைக் குறிக்கிறது. ‘தேசத்தில்’ என்பது ‘பூமியில்’ என்ற பொதுமைப்படுத்தலைத் தவிர்த்து உடன்படிக்கை சார்ந்த நிலக் கருத்தை வெளிப்படுத்துகிறது.
- source_word: עֹבְרִים אֶת־הַיַּרְדֵּן
  choice: யோர்தானைக் கடந்து சென்று
  rationale: நிகழ்காலப் பங்கேற்பு வடிவம் மோசேயின் பார்வையில் நெருங்கியுள்ள கடத்தலைக் காட்டுகிறது. தமிழ் வாக்கிய அமைப்பில் ‘கடந்து சென்று’ என்பது இலக்கையும் அடுத்த செயலையும் இயல்பாக இணைக்கிறது.
- source_word: שָׁמָּה לְרִשְׁתָּהּ
  choice: உரிமையாக்கிக்கொள்ளவிருக்கும்
  rationale: ירשׁ என்பது நிலத்தைச் சொந்தமாகப் பெறுதல் அல்லது சுதந்தரித்தல் என்ற பொருளைக் கொண்டது. ‘உரிமையாக்கிக்கொள்ள’ என்பது செயலின் நோக்கத்தைத் தெளிவாகச் சொல்கிறது; ‘விருக்கும்’ அதன் நெருங்கிய எதிர்காலச் சூழலை வெளிப்படுத்துகிறது.
theological_decisions:
- issue: கீழ்ப்படிதல், வாழ்வு, தேசத்தில் நீடித்திருத்தல் ஆகியவற்றின் உடன்படிக்கைத் தொடர்பு
  choice: தேவனுடைய வார்த்தை இஸ்ரவேலரின் வாழ்வாகவும், தேசத்தில் அவர்கள் நீண்ட நாட்கள் வாழ்வதற்கான வழியாகவும் கூறப்படுகிறது.
  alternative: இது உடன்படிக்கை விளைவைக் குறிக்காமல், போதனையின் முக்கியத்துவத்தை மட்டும் வலியுறுத்தும் சொல்லாட்சி என்று வாசித்தல்.
  rationale: ‘இதுவே உங்கள் வாழ்வு’ என்பதும் ‘இந்த வார்த்தையினால் நீண்ட நாட்கள் வாழ்வீர்கள்’ என்பதும் இணையாக வந்து உடன்படிக்கை சார்ந்த வாழ்வு–தேசத் தொடர்பை வெளிப்படுத்துகின்றன. பின்னாளைய கோட்பாட்டுச் சொற்களைச் சேர்க்காமல் அந்தத் தொடர்பு மொழிபெயர்ப்பில் பாதுகாக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் மரியாதைமிக்க நடையில் வடிவமைக்கப்பட்டது. ‘வெறும் வார்த்தை’ மற்றும் ‘இதுவே உங்கள் வாழ்வு’ ஆகியவை மூலத்தின் வலிமையான எதிர்மறை–நேர்மறை இணைப்பைப் பாதுகாக்கின்றன. இறுதி வாக்கியம் தமிழில் இயல்பாக இருக்கும்படி மறுவரிசைப்படுத்தப்பட்டாலும், யோர்தானைக் கடத்தல், தேசத்தை உரிமையாக்குதல், வார்த்தையினால் நீண்ட நாள் வாழ்தல் ஆகிய அனைத்து மூலக் கூறுகளும் தக்கவைக்கப்பட்டுள்ளன.
