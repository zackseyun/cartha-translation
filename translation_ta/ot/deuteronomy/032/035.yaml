source:
  edition: WLC
  text: לִ֤/י נָקָם֙ וְ/שִׁלֵּ֔ם לְ/עֵ֖ת תָּמ֣וּט רַגְלָ֑/ם כִּ֤י קָרוֹב֙ י֣וֹם אֵידָ֔/ם וְ/חָ֖שׁ עֲתִדֹ֥ת לָֽ/מוֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/035.yaml
  text: Vengeance is mine[a], and recompense, at the time when their foot slips; for the day of their disaster is near[d][c][b], and what is prepared for them hastens.
translation:
  language: ta
  text: '“பழிவாங்குதலும் பதில்செய்தலும் எனக்குரியவை;

    அவர்களுடைய கால் சறுக்கும் வேளையில்.

    ஏனெனில், அவர்களுடைய பேரழிவின் நாள் அருகில் உள்ளது;

    அவர்களுக்கென ஆயத்தமாக உள்ளவை விரைகின்றன.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: “அவர்களுக்கு நியமிக்கப்பட்டவை விரைகின்றன” என்றும் மொழிபெயர்க்கலாம்; எபிரெயச் சொற்றொடர் சுருக்கமானது. “பழிவாங்குதல் எனக்குரியது” என்ற கருத்து ரோமர் 12:19-ல் மேற்கோளாகவும் எபிரெயர் 10:30-ல் எதிரொலியாகவும் வருகிறது.
    reason: lexical_alternative_and_cross_reference
lexical_decisions:
- source_word: לִי נָקָם וְשִׁלֵּם
  choice: பழிவாங்குதலும் பதிலளித்தலும் எனக்குரியவை
  rationale: לִי என்பதன் உரிமை/தெய்வீக உரிமையை ‘எனக்குரியவை’ எனத் தெளிவாகக் காட்டுகிறது. נָקָם நீதிசார்ந்த பழிவாங்குதலைக் குறிக்கிறது; שִׁלֵּם இங்கு இணையான பெயர்ச்சொல் மதிப்பில் உரிய பதிலளிப்பைக் குறிக்கிறது.
- source_word: לְעֵת תָּמוּט רַגְלָם
  choice: அவர்களுடைய கால் சறுக்கும் காலத்தில்
  rationale: எபிரெயத்தின் ஒருமை ‘கால்’ மற்றும் பன்மை உரிமை விகுதியை அப்படியே தக்கவைத்து, வரவிருக்கும் வீழ்ச்சியின் உருவகத்தை இயல்பான தமிழில் வழங்குகிறது.
- source_word: כִּי קָרוֹב יוֹם אֵידָם
  choice: ஏனெனில், அவர்களுடைய பேரழிவின் நாள் நெருங்கிவிட்டது
  rationale: כִּי என்பதன் காரணப்பொருளையும் אֵידָם என்பதன் அழிவூட்டும் பேரிடர்/வீழ்ச்சி உணர்வையும் காக்கிறது.
- source_word: וְחָשׁ עֲתִדֹת לָמוֹ
  choice: அவர்களுக்காக ஆயத்தமாயிருப்பவை விரைந்து வருகின்றன
  rationale: எபிரெயத்தின் சுருக்கமான பன்மை அமைப்பையும், அவர்களுக்கென தயாராக அல்லது நியமிக்கப்பட்டிருப்பவை வேகமாக அணுகுகின்றன என்ற பொருளையும், குறிப்பிட்ட ‘விதி’ என மிகையாக விளக்காமல் தக்கவைக்கிறது.
theological_decisions:
- issue: தெய்வீகப் பழிவாங்குதலின் இயல்பு
  choice: ‘பழிவாங்குதல் ... எனக்குரியது’ என்ற தெய்வீக உரிமையைத் தக்கவைத்தல்
  alternative: ‘நீதி எனக்குரியது’ அல்லது ‘நான் கோபத்தில் பழிதீர்ப்பேன்’
  rationale: மூலமொழி இறைவனுக்குரிய நியாயத்தீர்ப்பு அதிகாரத்தை வலியுறுத்துகிறது. ‘நீதி’ என்று மென்மையாக்காமலும், தனிப்பட்ட பகைமையாகத் தீவிரப்படுத்தாமலும் மூலத்தின் பதற்றத்தைப் பாதுகாக்கிறது.
- issue: עֲתִדֹת לָמוֹ என்பதன் தெளிவற்ற சுருக்கம்
  choice: ‘அவர்களுக்காக ஆயத்தமாயிருப்பவை’
  alternative: ‘அவர்களுடைய அழிவு’ அல்லது ‘அவர்களுக்கு விதிக்கப்பட்டவை’
  rationale: எது ஆயத்தமாக உள்ளது என்பதை வசனம் வெளிப்படையாகச் சொல்லாததால், அதன் உண்மையான தெளிவின்மையை மொழிபெயர்ப்பு காக்கிறது.
translation_notes:
  register: நவீன செந்தமிழ் நடையில், கவிதைத் தன்மையும் தீர்ப்பின் கண்ணியமான தீவிரமும் காக்கப்பட்டுள்ளன. அரிதான சமயத் தொழில்நுட்பச் சொற்கள் தவிர்க்கப்பட்டுள்ளன; இணை அமைப்பும் உருவகமும் பாதுகாக்கப்பட்டுள்ளன.
