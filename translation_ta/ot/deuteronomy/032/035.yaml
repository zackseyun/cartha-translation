revisions:
- from: '“பழிவாங்குதலும் பதிலளித்தலும் எனக்குரியவை;

    அவர்களுடைய கால் சறுக்கும் காலத்தில் அவை நேரிடும்.[a]

    ஏனெனில், அவர்களுடைய பேரழிவின் நாள் நெருங்கிவிட்டது;

    அவர்களுக்காக ஆயத்தமாயிருப்பவை விரைந்து வருகின்றன.”[b]'
  to: '“பழிவாங்குதலும் பதில்செய்தலும் எனக்குரியவை;

    அவர்களுடைய கால் சறுக்கும் வேளையில்.

    ஏனெனில், அவர்களுடைய பேரழிவின் நாள் அருகில் உள்ளது;

    அவர்களுக்கென ஆயத்தமாக உள்ளவை விரைகின்றன.”[b]'
  rationale: The repayment term is corrected to avoid the unrelated sense of merely answering. The statement that the day is near is rendered without unwarranted perfective force. The Hebrew’s poetic ellipsis after the temporal phrase and its ambiguity concerning the things prepared for them are retained. Footnote a is retained as the lexical alternative for the foot-slipping image; its anchor should be placed immediately after “வேளையில்” in typesetting.
