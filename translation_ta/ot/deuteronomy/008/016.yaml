source:
  edition: WLC
  text: הַ/מַּֽאֲכִ֨לְ/ךָ֥ מָן֙ בַּ/מִּדְבָּ֔ר אֲשֶׁ֥ר לֹא יָדְע֖וּ/ן אֲבֹתֶ֑י/ךָ לְמַ֣עַן עַנֹּֽתְ/ךָ֗ וּ/לְמַ֨עַן֙ נַסֹּתֶ֔/ךָ לְ/הֵיטִֽבְ/ךָ֖ בְּ/אַחֲרִיתֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/008/016.yaml
  text: who fed you manna in the wilderness[a], which your fathers had not known, in order to humble you and in order to test you[b], to do you good in the end.
translation:
  language: ta
  text: வனாந்தரத்தில் உன் தந்தையர் அறிந்திராத மன்னாவை உனக்கு உண்ணக் கொடுத்தவர் அவரே; உன்னைத் தாழ்த்துவதற்காகவும் உன்னைச் சோதிப்பதற்காகவும், முடிவில் உனக்கு நன்மை செய்வதற்காகவும் அவர் இப்படிச் செய்தார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “முடிவில்” என்பது “பிற்காலத்தில்” அல்லது “உன் இறுதி விளைவில்” என்றும் மொழிபெயர்க்கப்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּאֲכִלְךָ
  choice: உனக்கு உண்ணக் கொடுத்தவர்
  rationale: אכל என்பதன் ஹிப்ஃபில் வினையெச்சம் காரணவினைப் பொருளைக் கொண்டுள்ளது; முந்தைய வசனத்திலிருந்து தொடரும் கடவுளைப் பற்றிய விளக்கமாகத் தமிழில் இயல்பாக வழங்கப்பட்டுள்ளது.
- source_word: מָן
  choice: மன்னா
  rationale: வனாந்தர உணவுக்கான எபிரேயப் பெயரின் தமிழில் நிலைபெற்ற ஒலிபெயர்ப்பு.
- source_word: בַּמִּדְבָּר
  choice: வனாந்தரத்தில்
  rationale: மக்கள் குடியிராத வறண்ட வனப்பகுதியைக் குறிக்கும் מִדְבָּר என்பதற்குப் பொருத்தமான, வேதாகமத் தமிழில் பரிச்சயமான சொல்.
- source_word: אֲשֶׁר לֹא יָדְעוּן אֲבֹתֶיךָ
  choice: உன் தந்தையர் அறிந்திராத
  rationale: மன்னா அவர்களின் தந்தையருக்கு முன்பு அறிமுகமில்லாதது என்பதைப் பெயரெச்சத் தொடராக இயல்பாக வெளிப்படுத்துகிறது.
- source_word: אֲבֹתֶיךָ
  choice: உன் தந்தையர்
  rationale: எபிரேய மூலத்தின் ஆண்பால் பன்மையான ‘தந்தையர்’ என்பதைப் பொதுமைப்படுத்தாமல் நேரடியாகப் பாதுகாக்கிறது.
- source_word: לְמַעַן עַנֹּתְךָ
  choice: உன்னைத் தாழ்த்துவதற்காக
  rationale: ענה என்பதற்கு ‘துன்புறுத்து’ என்றும் பொருள் இருக்கலாம்; ஆனால் உபாகமம் 8-ன் உடனடிச் சூழலில் ஒழுக்கப் பயிற்சியாகத் தாழ்த்துதல் முதன்மையான கருத்து.
- source_word: וּלְמַעַן נַסֹּתֶךָ
  choice: உன்னைச் சோதிப்பதற்காகவும்
  rationale: נסה என்பதன் சோதித்தல் அல்லது பரிசோதித்தல் என்ற உடன்படிக்கைச் சூழல் பொருளைத் தெளிவாகக் காட்டுகிறது.
- source_word: לְהֵיטִבְךָ
  choice: உனக்கு நன்மை செய்வதற்காகவும்
  rationale: יטב என்பதன் ஹிப்ஃபில் வடிவம் ஒருவருக்கு நன்மை செய்தல் அல்லது நலமுண்டாக்குதல் என்று பொருள்படுகிறது.
- source_word: בְּאַחֲרִיתֶךָ
  choice: முடிவில்
  rationale: אַחֲרִית என்பது முடிவு, பிற்காலம், இறுதி விளைவு ஆகிய பொருட்களைத் தரக்கூடும்; இங்கு முன் நிகழ்ந்த தாழ்த்தலும் சோதனையும் இறுதியில் நன்மையாக அமையும் என்பதை ‘முடிவில்’ இயல்பாகத் தெரிவிக்கிறது.
theological_decisions:
- issue: வனாந்தரத் துன்பத்தின் நோக்கம்
  choice: உணவளித்தல், தாழ்த்துதல், சோதித்தல் ஆகியவை இறுதியில் இஸ்ரவேலுக்கு நன்மை செய்வதற்கான கடவுளின் நோக்கமுள்ள செயல்களாக வழங்கப்பட்டுள்ளன.
  alternative: தாழ்த்துதலையும் சோதித்தலையும் வெறும் தண்டனையாக மட்டும் புரிந்துகொள்ளலாம்.
  rationale: இரண்டு לְמַעַן நோக்கத் தொடர்களும் לְהֵיטִבְךָ בְּאַחֲרִיתֶךָ என்ற நன்மையான இறுதி நோக்கத்தில் நிறைவடைகின்றன. ஆகவே கடினத்தன்மையும் நன்மையான நோக்கமும் இரண்டும் மொழிபெயர்ப்பில் தக்கவைக்கப்பட்டுள்ளன.
- issue: בְּאַחֲרִיתֶךָ என்பதன் கால அல்லது விளைவு நுணுக்கம்
  choice: முடிவில்
  alternative: பிற்காலத்தில்; உன் இறுதி விளைவில்
  rationale: இந்தச் சொல் காலப்பிந்திய நிலையையோ இறுதி விளைவையோ குறிக்கலாம். எந்த ஓர் குறிப்பிட்ட இறுதிக்காலக் கோட்பாட்டையும் திணிக்காமல் அதன் இயல்பான பரப்பை ‘முடிவில்’ பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. ‘வனாந்தரம்’, ‘மன்னா’ ஆகிய பரிச்சயமான வேதாகமச் சொற்கள் தக்கவைக்கப்பட்டுள்ளன. எபிரேய வசனத்தின் சார்புத்தொடர் தமிழில் தனிநிறை வாக்கியமாக இயல்பாக்கப்பட்டாலும் நோக்கத் தொடர்களின் மீளுருவாக்கம் பாதுகாக்கப்பட்டுள்ளது.
