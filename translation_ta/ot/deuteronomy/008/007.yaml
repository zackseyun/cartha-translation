source:
  edition: WLC
  text: כִּ֚י יְהוָ֣ה אֱלֹהֶ֔י/ךָ מְבִֽיאֲ/ךָ֖ אֶל אֶ֣רֶץ טוֹבָ֑ה אֶ֚רֶץ נַ֣חֲלֵי מָ֔יִם עֲיָנֹת֙ וּ/תְהֹמֹ֔ת יֹצְאִ֥ים בַּ/בִּקְעָ֖ה וּ/בָ/הָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/008/007.yaml
  text: For Yahweh your God is bringing you into a good land[a], a land of streams of water, springs[c][b], and depths flowing out in the valley and in the hill country.
translation:
  language: ta
  text: ஏனெனில், உன் கடவுளாகிய யாவே உன்னை ஒரு நல்ல நாட்டிற்குள் கொண்டுபோகிறார். அது நீரோடைகளும்[a], ஊற்றுகளும், ஆழ்நீர்களும்[b] பள்ளத்தாக்கிலும் மலைப்பகுதியிலும்[c] வெளிப்படும் நாடு.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “நீரோடைகள்” என்பதற்கான எபிரேயச் சொல் ஓடைகள், வெள்ளோடைகள் அல்லது பருவகால நீர்வழிகளைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது “ஆழமான நீர்நிலைகள்”; எபிரேயச் சொல் நிலத்தடி நீரையோ ஆழத்திலுள்ள நீரையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: அல்லது “சமவெளியிலும் மலைகளிலும்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய அறிவுறுத்தலுக்கான காரணத்தை அறிமுகப்படுத்தும் இணைப்புச் சொல்லின் வலிமையை இயல்பான தமிழில் காக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரேய மூலத்தில் வரும் இறைத் திருப்பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் ஒலிபெயர்த்துக் கொடுக்கிறது.
- source_word: אֱלֹהֶיךָ
  choice: உன் கடவுள்
  rationale: இரண்டாம் நபர் ஆண்பால் ஒருமை பின்னொட்டைத் துல்லியமாகக் காக்கிறது; இங்கு இஸ்ரவேல் ஒரே மக்களாக ஒருமையில் அழைக்கப்படுகிறது.
- source_word: מְבִיאֲךָ
  choice: உன்னை ... கொண்டுபோகிறார்
  rationale: நிகழ்காலப் பெயரெச்சத்தின் தொடரும் அல்லது நெருங்கிய செயல் உணர்வை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: אֶל אֶרֶץ טוֹבָה
  choice: ஒரு நல்ல நாட்டிற்குள்
  rationale: இயக்கத்தின் உட்செல்லும் பொருளையும் טוֹבָה என்பதன் எளிய பண்புச் சொல்லான ‘நல்ல’ என்பதையும் விரிவாக்கமின்றிக் காக்கிறது.
- source_word: נַחֲלֵי מָיִם
  choice: நீரோடைகள்
  rationale: நீர் பாயும் ஓடைகள், வெள்ளோடைகள் அல்லது வறண்ட காலங்களில் நீரற்றுப் போகக்கூடிய ஓடைகளைச் சுட்டக்கூடிய சொல்லை வாசிக்க எளிய தமிழில் தருகிறது.
- source_word: עֲיָנֹת
  choice: ஊற்றுகள்
  rationale: இயற்கையாக நீர் வெளிப்படும் இடங்களைக் குறிக்கும் நேரடியான, தற்போதைய தமிழ்ச் சொல்.
- source_word: וּתְהֹמֹת
  choice: ஆழ்நீர்கள்
  rationale: ஆழத்திலுள்ள அல்லது நிலத்தடியில் உள்ள நீரைக் குறிக்கும் சொல்லின் உருவகத்தையும் தெளிவின்மையையும் தேவையின்றித் தீர்மானிக்காமல் காக்கிறது.
- source_word: יֹצְאִים
  choice: வெளிப்பட்டுப் பாயும்
  rationale: நீர் ஒரு மூலத்திலிருந்து வெளியே வந்து பாய்வதை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: בַּבִּקְעָה
  choice: பள்ளத்தாக்கில்
  rationale: பரந்த பள்ளத்தாக்கு அல்லது சமவெளி எனப் பொருள்படக்கூடிய நிலவியல் சொல்லுக்கு முதன்மையான சூழல்சார் பொருளைத் தருகிறது.
- source_word: וּבָהָר
  choice: மலைப்பகுதியில்
  rationale: ஒருமை வடிவம் கூட்டுப்பொருளில் உயர்நிலப் பிரதேசத்தைக் குறிக்கக்கூடும் என்பதால், இயல்பான தமிழில் நிலவியல் பொருளை வெளிப்படுத்துகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைத் திருப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலவசனம் நான்கு எபிரேய மெய்யெழுத்துகளாலான இறைத் திருப்பெயரை நேரடியாகப் பயன்படுத்துகிறது. அதைப் பட்டமாக மாற்றாமல் பொதுவாக ஏற்கப்படும் ஒலிப்பிற்கு அண்மையாகத் தமிழில் தரப்பட்டுள்ளது.
- issue: இஸ்ரவேலை ஒருமையில் அழைத்தல்
  choice: உன் / உன்னை
  alternative: உங்கள் / உங்களை
  rationale: எபிரேய உரை இரண்டாம் நபர் ஒருமையைப் பயன்படுத்தி இஸ்ரவேலை ஒரே உடன்படிக்கை மக்களாக அழைக்கிறது; அந்த இலக்கண மற்றும் இறையியல் நுணுக்கம் காக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையும் கண்ணியமும் இணைந்த நடை பயன்படுத்தப்பட்டுள்ளது. எபிரேயத்தின் ஒருமை அழைப்பு பாதுகாக்கப்பட்டுள்ளது; நீரியல் மற்றும் நிலவியல் சொற்களில் உள்ள உண்மையான பொருள் விரிவு அடிக்குறிப்புகளில் காட்டப்பட்டுள்ளது.
