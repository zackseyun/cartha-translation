  yaml_path: translation/ot/deuteronomy/008/004.yaml
  text: Your clothing did not wear out on you[a], and your foot did not swell[b], these forty years.
translation:
  language: ta
  text: இந்த நாற்பது ஆண்டுகளாக உன் உடை உன் மேல் தேய்ந்துபோகவில்லை[a]; உன் கால் வீங்கவில்லை[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘உன் ஆடை உன் மேல் தேய்ந்துபோகவில்லை.’
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘உன் கால் வீக்கமடையவில்லை’; சிலர் இந்த வினைச்சொல் இன்னும் குறிப்பாகக் காலில் கொப்புளங்கள் ஏற்படுவதைக் குறிப்பதாகப் புரிந்துகொள்கிறார்கள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׂמְלָתְךָ
  choice: உன் உடை
  rationale: שִׂמְלָה என்பது ஓர் ஆடையையோ மேலுடையையோ குறிக்கலாம். ஒருமை வடிவத்தைப் பேணுவதோடு, நவீனத் தமிழில் இயல்பாக இருக்க ‘உன் உடை’ என மொழிபெயர்க்கப்பட்டது.
- source_word: בָלְתָה
  choice: இற்றுப்போகவில்லை
  rationale: בלה என்பது பயன்படுத்தப்பட்டதால் பழுதடைதல் அல்லது தேய்ந்து பயனற்றுப்போதலைக் குறிக்கிறது. உடையைப் பற்றிய இச்சூழலில் ‘இற்றுப்போதல்’ சுருக்கமாகவும் துல்லியமாகவும் உள்ளது.
- source_word: מֵעָלֶיךָ
  choice: உன்மேல்
  rationale: எபிரெயச் சொற்றொடர் எழுத்துப்படி ‘உன்மேலிருந்து’ என்றாலும், உடை அணிந்திருந்தபோது அது இற்றுப்போகவில்லை என்பதே சூழல்சார் பொருள். ‘உன்மேல்’ மூலப்படிமத்தையும் தமிழின் இயல்பையும் பேணுகிறது.
- source_word: וְרַגְלְךָ
  choice: உன் கால்
  rationale: மூலத்தில் ஒருமை இருப்பதால், தமிழிலும் இயல்பாக உள்ள ‘உன் கால்’ என ஒருமை பேணப்பட்டது.
- source_word: בָצֵקָה
  choice: வீங்கவும் இல்லை
  rationale: בצק என்ற வினை இங்கு பொதுவாக வீங்குதல் எனப் புரிந்துகொள்ளப்படுகிறது. கொப்புளித்தல் என்ற குறிப்பான புரிதல் சாத்தியமாயினும் உறுதியற்றதால், பொதுவான பொருள் முதன்மை உரையில் வைக்கப்பட்டது.
- source_word: זֶה אַרְבָּעִים שָׁנָה
  choice: இந்த நாற்பது ஆண்டுகளும்
  rationale: கால அளவுடன் வரும் எபிரெய ‘இந்த’ என்ற சுட்டைத் தக்கவைத்து, முழுக் காலத்தையும் வலியுறுத்தும் இயல்பான தமிழாக ‘இந்த நாற்பது ஆண்டுகளும்’ தேர்ந்தெடுக்கப்பட்டது.
