review_pass:
  verdict: revise
  source_fidelity: The draft correctly reflects eating, being sated, building good houses, and dwelling in them. However, it adds the imperative “உனக்கு நேரிடாதபடி எச்சரிக்கையாக இரு” (‘be careful lest it happen to you’), which is not in this verse. Although the warning is syntactically dependent on the preceding context, this verse itself should retain its subordinate warning/condition without importing an explicit imperative from verse 11.
  naturalness: “வயிறு நிறைந்து” is more natural and contextually precise than the somewhat abstract “நிறைவடைந்து” for being sated after eating. The revised wording is a fluent Tamil subordinate clause and its final dash signals that the warning construction continues in the surrounding sentence.
  terminology: “நல்ல வீடுகள்,” “கட்டி,” and “அவற்றில் குடியிருக்கும்போது” are accurate, natural renderings. The supplied “அவற்றில்” is warranted by the referent ‘houses.’
  issues:
  - severity: medium
    issue: The translation supplies “உனக்கு நேரிடாதபடி எச்சரிக்கையாக இரு.”
    rationale: This imperative is not present in Deuteronomy 8:12. It reflects the wider warning context, but it introduces wording and a referent (‘it’) not expressed in the Hebrew of this verse. The dependent clause should instead be left syntactically open, as in the source.
  - severity: low
    issue: “நிறைவடைந்து” is broader and more abstract than the immediate food-related sense.
    rationale: שׂבע here denotes being sated/full after eating. “வயிறு நிறைந்து” clearly preserves that concrete sense, while the footnote can retain ‘satisfied’ as a possible broader nuance.
  revised_text: நீ உண்டு வயிறு நிறைந்து[a], நல்ல வீடுகளைக் கட்டி அவற்றில் குடியிருக்கும்போது—
