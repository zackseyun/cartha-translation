lexical_decisions:
- source_word: פֶּן
  choice: உனக்கு நேரிடாதபடி எச்சரிக்கையாக இரு
  rationale: פֶּן ஒரு எச்சரிக்கைத் தொடரை அறிமுகப்படுத்துகிறது. தமிழில் தனியாக ‘அப்படி ஆகாதபடி’ என்று தொடங்குவது இயல்பற்றதாக இருப்பதால், முந்தைய வசனத்திலிருந்து தொடரும் எச்சரிக்கைத் தொனியை வெளிப்படையாகக் காட்டும் வகையில் மொழிபெயர்க்கப்பட்டது; கோடு அடுத்த வசனங்களில் நிறைவடையும் தொடரைக் குறிக்கிறது.
- source_word: תֹּאכַל
  choice: நீ உண்டு
  rationale: இரண்டாம் நபர் ஒருமை வினை வடிவத்தையும், எதிர்பார்க்கப்படும் வளமான சூழ்நிலையையும் இயல்பான தமிழில் தருகிறது.
- source_word: וְשָׂבָעְתָּ
  choice: நிறைவடைந்து
  rationale: שׂבע என்பது உணவால் வயிறு நிறைவதையும் முழுத் திருப்தியடைவதையும் குறிக்கலாம். ‘நிறைவடைந்து’ இரு நுணுக்கங்களையும் சுருக்கமாகத் தாங்குகிறது.
- source_word: וּבָתִּים טוֹבִים
  choice: நல்ல வீடுகளை
  rationale: טוֹבִים என்பதன் அடிப்படைப் பொருளான ‘நல்ல’ என்பதைக் காத்து, ஆடம்பரத்தின் அளவை தேவையின்றி மிகைப்படுத்தவில்லை.
- source_word: תִּבְנֶה
  choice: கட்டி
  rationale: தொடர்ச்சியான செயல்களின் பட்டியலில் இயல்பான தமிழ் வினையெச்ச வடிவம் பயன்படுத்தப்பட்டது.
- source_word: וְיָשָׁבְתָּ
  choice: அவற்றில் குடியிருக்கும்போது
  rationale: ישׁב இங்கு வீடுகளில் வாழ்வதைக் குறிக்கிறது. எபிரெயத்தில் மறைமுகமாக உள்ள வீடுகளைக் குறிக்க ‘அவற்றில்’ சேர்க்கப்பட்டுள்ளது.
theological_decisions:
- issue: פֶּן தொடங்கும் எச்சரிக்கையின் நிறைவு இவ்வசனத்துக்கு அப்பால் வருகிறது
  choice: வசனத்தை எச்சரிக்கைச் சொற்றொடராகவும் இறுதியில் கோடுடனும் வழங்குதல்
  alternative: எச்சரிக்கைத் தொடர்பை விடுத்து ‘நீ ... குடியிருக்கும்போது’ என்று மட்டும் மொழிபெயர்த்தல்
  rationale: எபிரெயச் சொற்றொடரின் இலக்கணச் சார்பையும் தொடரும் எச்சரிக்கைத் திணிவையும் வாசகருக்குத் தெளிவாக்குகிறது; அதேவேளை அடுத்த வசனங்களின் உள்ளடக்கத்தை இவ்வசனத்துக்குள் இறக்குமதி செய்யவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிமையான ஆனால் கண்ணியமான நடையில் அமைக்கப்பட்டது. ஒருமை ‘நீ’ என்பது எபிரெய இரண்டாம் நபர் ஆண்பால் ஒருமையை இயல்பாக பிரதிபலிக்கிறது.
