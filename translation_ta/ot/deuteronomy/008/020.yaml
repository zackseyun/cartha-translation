base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/008/020.yaml
  text: Like the nations that Yahweh is destroying before you[a], so you will perish, because you did not listen to the voice of Yahweh your God.
translation:
  language: ta
  text: யாவே உங்கள் முன்னிலையிலிருந்து அழித்துவரும் நாடுகளைப் போலவே நீங்களும் அழிந்துபோவீர்கள். ஏனெனில், உங்கள் கடவுளாகிய யாவேயின் குரலுக்குச் செவிகொடுக்கவில்லை.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உங்கள் கடவுளாகிய யாவேக்குக் கீழ்ப்படியவில்லை.” எபிரேயத்தில் சொல்லுக்குச் சொல், “உங்கள் கடவுளாகிய யாவேயின் குரலுக்குச் செவிகொடுக்கவில்லை” என உள்ளது; இச்சொற்றொடர் பெரும்பாலும் கீழ்ப்படிதலையும் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּגּוֹיִם
  choice: அந்த மக்களினங்களைப் போலவே
  rationale: כְּ குறிக்கும் ஒப்பீட்டையும், இச்சூழலில் கானான் தேசத்து மக்களினங்களைக் குறிக்கும் גּוֹיִם என்பதையும் இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைத் திருப்பெயரான יהוה-வை ஒரு பட்டப்பெயரால் மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: מַאֲבִיד
  choice: அழித்துக்கொண்டிருக்கும்
  rationale: אבד என்பதன் ஹிஃபில் வினையெச்சம் உணர்த்தும் காரணவினையையும் தொடரும் செயல் நிலையையும் காக்கிறது.
- source_word: מִפְּנֵיכֶם
  choice: உங்கள் முன்னிலையிலிருந்து
  rationale: ‘உங்கள் முகத்திற்கு முன்னிருந்து’ என்ற எபிரேய இடைச்சொல் அமைப்பை, அவர்கள் முன்னிருந்து அகற்றப்படுதல் என்ற பொருளுடன் இயல்பாகத் தருகிறது.
- source_word: כֵּן תֹאבֵדוּן
  choice: அப்படியே நீங்களும் அழிந்துபோவீர்கள்
  rationale: தொடக்க ஒப்பீட்டுடன் இணையும் כֵּן அமைப்பையும், Qal வடிவான אבד குறிக்கும் ‘அழிந்துபோதல்’ என்பதையும் காக்கிறது.
- source_word: עֵקֶב
  choice: ஏனெனில்
  rationale: வரவிருக்கும் அழிவுக்கான காரணத்தைத் தெளிவாக அறிமுகப்படுத்துகிறது.
- source_word: לֹא תִשְׁמְעוּן בְּקוֹל
  choice: குரலுக்கு நீங்கள் செவிகொடுக்கவில்லை
  rationale: ‘குரலுக்குச் செவிகொடுத்தல்’ என்ற எபிரேய உட்சொல்லைத் தக்கவைத்து, அதிலுள்ள கீழ்ப்படிதல் சார்ந்த பொருளையும் மறைக்காமல் விடுகிறது.
- source_word: אֱלֹהֵיכֶם
  choice: உங்கள் கடவுள்
  rationale: யாவேயுடன் வரும் இரண்டாம் நபர் பன்மை உரிமை விகுதி, இஸ்ரவேலின் ஒரே கடவுளைக் குறிக்கிறது.
theological_decisions:
- issue: יהוה என்ற இறைத் திருப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூலத்தில் நேரடியாக வரும் உடன்படிக்கைத் திருப்பெயரை ஒரு பட்டப்பெயரால் மாற்றாமல் பாதுகாக்கிறது.
- issue: שׁמע בקול என்பதை ‘கீழ்ப்படி’ என்று பொருள்விரிவாக்குவதா, ‘குரலுக்குச் செவிகொடு’ என்று தருவதா
  choice: குரலுக்குச் செவிகொடு
  alternative: கீழ்ப்படி
  rationale: எபிரேய சொற்றொடரின் கேட்பதும் கீழ்ப்படிவதும் இணைந்த பொருள் பரப்பைப் பிரதான உரையில் பாதுகாத்து, மாற்றுப் பொருளை அடிக்குறிப்பில் விளக்குகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. ‘ஜாதிகள்’ போன்ற காலஞ்சென்ற அல்லது வேறு நிழற்பொருள் தரக்கூடிய சொல்லுக்குப் பதிலாக ‘மக்களினங்கள்’ பயன்படுத்தப்பட்டது; எபிரேய ஒப்பீட்டு அமைப்பும் உடன்படிக்கைச் சொற்றொடரும் இயன்றவரை காக்கப்பட்டன.
