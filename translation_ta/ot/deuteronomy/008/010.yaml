base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/008/010.yaml
  text: And you shall eat and be satisfied[a], and you shall bless Yahweh your God for the good land that he has given you.
translation:
  language: ta
  text: நீ உண்டு நிறைவடைந்து, உனக்குக் கொடுத்த நல்ல நாட்டிற்காக உன் கடவுளாகிய யாவேவை வாழ்த்துவாய்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நன்றி சொல்வாய்” அல்லது “போற்றுவாய்.” எபிரெயத்தில் “வாழ்த்துவாய்” என்றுள்ளது; இது கடவுளைப் பற்றி நன்றியுடன் நன்மையாகப் பேசும் வேதாகம மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אָכַלְתָּ וְ/שָׂבָעְתָּ
  choice: நீ சாப்பிட்டுத் திருப்தியடைந்தபின்
  rationale: இணைக்கப்பட்ட இரண்டு நிறைவுவினைகள் இச்சூழலில் உண்பதும் நிறைவடைவதும் அதைத் தொடர்ந்து கடவுளை வாழ்த்துவதுமாகிய இயல்பான நிகழ்வுத் தொடரைக் காட்டுகின்றன. ‘திருப்தியடை’ என்பது வயிறு நிறைதலையும் போதுமென்ற மனநிறைவையும் வெளிப்படுத்துகிறது.
- source_word: וּ/בֵרַכְתָּ
  choice: வாழ்த்துவாய்
  rationale: கடவுளைச் செயப்படுபொருளாகக் கொண்ட ברך என்பது அவரைப் போற்றி நன்றியுடன் நன்மையாகப் பேசுவதைக் குறிக்கும். ‘வாழ்த்து’ மூலமொழியின் வேதாகம மரபுத்தொடரைப் பாதுகாக்கிறது; ‘நன்றி சொல்’ அல்லது ‘போற்று’ என்பவை பொருளின் தலா ஒரு கூறை மட்டும் முன்னிறுத்தும்.
- source_word: יְהוָה
  choice: யாவே
  rationale: நான்கு எழுத்துகளைக் கொண்ட இறைப்பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் பரவலாகப் புரியக்கூடிய ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: אֱלֹהֶי/ךָ
  choice: உன் கடவுளாகிய
  rationale: இரண்டாம் நபர் ஆண்பால் ஒருமை உடைமைப் பின்னொட்டின் உடன்படிக்கை சார்ந்த உறவை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: עַל הָ/אָרֶץ הַ/טֹּבָה
  choice: நல்ல நாட்டிற்காக
  rationale: עַל இங்கு வாழ்த்துவதற்கான காரணத்தை அறிமுகப்படுத்துகிறது. ‘நல்ல நாடு’ உடன்படிக்கையின் நாட்டுக் கருத்தை மிகைப்படுத்தாமல் நேரடியாகக் காக்கிறது.
- source_word: אֲשֶׁר נָתַן לָ/ךְ
  choice: உனக்குக் கொடுக்கப்பட்ட
  rationale: கொடுப்பவர் யாவே என்பது சூழலில் தெளிவாக இருப்பதால், தமிழின் இயல்பான பெயரெச்ச அமைப்பு தெய்வீகக் கொடையைத் தெளிவாகவும் சுருக்கமாகவும் தெரிவிக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலத்தில் தனிப்பட்ட உடன்படிக்கைப் பெயரே உள்ளது. அதை ஒரு பட்டமாக மாற்றாமல் ஒலிபெயர்ப்பது மூலத்தின் வேறுபாட்டைப் பாதுகாக்கிறது.
- issue: கடவுளை நோக்கிய ברך என்பதன் பொருள்
  choice: வாழ்த்துவாய்
  alternative: நன்றி சொல்வாய்; போற்றுவாய்
  rationale: ‘வாழ்த்து’ என்பது கடவுளைக் குறித்து நன்றியுடன் நன்மையாகப் பேசும் எபிரெய மரபுத்தொடரைப் பாதுகாக்கிறது. நன்றியும் புகழும் இதில் அடங்கினாலும், அவற்றில் ஒன்றை மட்டும் முதன்மைப்படுத்துவது பொருளைச் சுருக்கும்.
translation_notes:
  register: நவீனத் தரத் தமிழில், ஒருமை முன்னிலை உரையாடலைக் காத்து, கண்ணியமானதும் பொதுவாசகர்களுக்கு எளிதில் புரியக்கூடியதுமான நடை பயன்படுத்தப்பட்டுள்ளது. வசனத்தின் கட்டளை/அறிவுறுத்தல் நயத்தை ‘வாழ்த்துவாய்’ காக்கிறது.
