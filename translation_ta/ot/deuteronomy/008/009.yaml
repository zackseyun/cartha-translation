translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் வடிவமைக்கப்பட்டது. ‘அப்பம்,’ ‘வறுமையில்,’ ‘கற்கள் இரும்பாக இருக்கும்’ ஆகியவை மூலத்தின் concrete மற்றும் சுருக்கமான சொல்லாட்சியைப் பாதுகாக்கின்றன; ‘வெட்டி எடுப்பாய்’ பொதுவாசகருக்குத் தெளிவான இயற்கைத் தமிழாகத் தேர்ந்தெடுக்கப்பட்டது.
