source:
  edition: WLC
  text: אֶ֗רֶץ אֲשֶׁ֨ר לֹ֤א בְ/מִסְכֵּנֻת֙ תֹּֽאכַל בָּ֣/הּ לֶ֔חֶם לֹֽא תֶחְסַ֥ר כֹּ֖ל בָּ֑/הּ אֶ֚רֶץ אֲשֶׁ֣ר אֲבָנֶ֣י/הָ בַרְזֶ֔ל וּ/מֵ/הֲרָרֶ֖י/הָ תַּחְצֹ֥ב נְחֹֽשֶׁת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/008/009.yaml
  text: a land in which you will not eat bread in poverty[a], in which you will lack nothing; a land whose stones are iron[b], and from whose hills you will quarry copper.
translation:
  language: ta
  text: நீ வறுமையில் அப்பம் உண்ணாததும், அதில் உனக்கு எதுவும் குறைவுபடாததுமான நாடு[a]; அதன் கற்கள் இரும்பாக இருக்கும் நாடு; அதன் மலைகளிலிருந்து நீ செம்பை வெட்டி எடுப்பாய்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘பற்றாக்குறையில்’ அல்லது ‘இல்லாமையில்.’
    reason: lexical_alternative
  - marker: b
    text: இதற்கான எபிரெயச் சொல் ‘செம்பு’ அல்லது ‘வெண்கலம்’ எனப் பொருள்படலாம். இங்கு மலைகளிலிருந்து வெட்டி எடுக்கப்படும் இயற்கைப் பொருளைப் பற்றிக் கூறப்படுவதால் ‘செம்பு’ என மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְמִסְכֵּנֻת
  choice: வறுமையில்
  rationale: இந்தப் பெயர்ச்சொல் வறுமை, பற்றாக்குறை, இல்லாமை ஆகிய பொருள்களைக் குறிக்கலாம். அடுத்த வாக்கியக்கூறு எதுவும் குறைவுபடாது என்று கூறுவதால், இங்கு மூலத்தின் தனித்துவமான சொல்லாட்சியைப் பாதுகாக்க ‘வறுமையில்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: לֶחֶם
  choice: அப்பம்
  rationale: அடிப்படைப் பொருள் ‘அப்பம்’; சூழலில் அது உணவை விரிவாகக் குறிக்கக்கூடியதாயினும், மூலத்தின் concrete imagery காக்கப்பட்டது.
- source_word: תֶחְסַר כֹּל
  choice: உனக்கு எதுவும் குறைவுபடாது
  rationale: முழுமையான நிறைவை உணர்த்தும் எபிரெய மொழிநடையை இயல்பான நவீனத் தமிழில், כֹּל என்பதன் முழுமைப்படுத்தும் வலிமையுடன் தருகிறது.
- source_word: אֲבָנֶיהָ בַרְזֶל
  choice: அதன் கற்கள் இரும்பாக இருக்கும்
  rationale: ‘அதன் கற்கள் [என்பவை] இரும்பு’ என்ற சுருக்கமான, வலிமையான எபிரெய உருவகத்தைத் தளர்த்தாமல் காக்கிறது; இது இரும்புத்தாது கொண்ட கற்களைக் குறிக்கலாம்.
- source_word: תַּחְצֹב
  choice: வெட்டி எடுப்பாய்
  rationale: வெட்டுதல் அல்லது கல்லை/தாதுவைப் பிளந்து எடுத்தல் என்ற பொருளை, மலைகளிலிருந்து கனிம வளம் எடுக்கும் சூழலில் பொதுவாசகருக்குத் தெளிவாகத் தருகிறது.
- source_word: נְחֹשֶׁת
  choice: செம்பு
  rationale: இந்தச் சொல் செம்பையோ வெண்கலத்தையோ குறிக்கலாம். மலைகளிலிருந்து இயற்கைப் பொருளை வெட்டி எடுப்பதாக வசனம் கூறுவதால், கலவை உலோகமான வெண்கலத்தைவிட ‘செம்பு’ பொருத்தமானது.
