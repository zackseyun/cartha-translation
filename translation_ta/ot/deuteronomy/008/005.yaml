base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/008/005.yaml
  text: So know in your heart that[a], just as a man disciplines his son, Yahweh your God disciplines you.
translation:
  language: ta
  text: ஆகவே, ஒருவன் தன் மகனை ஒழுக்கப்படுத்துவதுபோலவே, உன் இறைவனாகிய யாவே உன்னை ஒழுக்கப்படுத்துகிறார்[a] என்பதை உன் உள்ளத்தில் அறிந்துகொள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘கண்டித்துத் திருத்துகிறார்’ அல்லது ‘பயிற்றுவிக்கிறார்’ என்றும் மொழிபெயர்க்கலாம்; இங்குள்ள எபிரேய வினைச்சொல், தவறைத் திருத்தும் தண்டனையையும் ஒருவரை உருவாக்கும் பயிற்சியையும் குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָדַעְתָּ
  choice: ஆகவே ... அறிந்துகொள்
  rationale: முன்னுள்ள சூழலிலிருந்து வரும் முடிவையும், உள்ளார்ந்த உணர்வுக்கான அறிவுறுத்தலையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: עִם לְבָבֶךָ
  choice: உன் உள்ளத்தில்
  rationale: சொல்லுக்குச் சொல் ‘உன் இதயத்துடன்’ என்பதற்குப் பதிலாக, உள்ளார்ந்த அங்கீகாரம் என்னும் எபிரேய மரபுத்தொடரின் பொருளை இயல்பாகத் தருகிறது.
- source_word: כִּי
  choice: என்பதை
  rationale: அறிந்துகொள்ள வேண்டிய கருத்தின் உள்ளடக்கத்தை அறிமுகப்படுத்துகிறது.
- source_word: כַּאֲשֶׁר
  choice: போலவே
  rationale: மனிதன் தன் மகனை ஒழுக்கப்படுத்துவதற்கும் யாவே தம் மக்களை ஒழுக்கப்படுத்துவதற்கும் இடையிலான ஒப்புமையைத் தெளிவாகப் பேணுகிறது.
- source_word: יְיַסֵּר / מְיַסְּרֶךָּ
  choice: ஒழுக்கப்படுத்து
  rationale: திருத்தும் கண்டிப்பையும் வளர்க்கும் பயிற்சியையும் உள்ளடக்கக்கூடிய יסר வேர்ச்சொல்லின் பரந்த பொருளைப் பேணுகிறது; இரு இடங்களிலும் ஒரே சொல்லைப் பயன்படுத்தி மூலத்தின் மீளுரையையும் காக்கிறது.
- source_word: אִישׁ
  choice: ஒருவன்
  rationale: மூலத்தில் உள்ள ஆண்பால் ஒருமையையும், ‘தன் மகன்’ என்ற உறவையும் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: בְּנוֹ
  choice: தன் மகனை
  rationale: பொதுவான ‘பிள்ளை’ என்பதற்குப் பதிலாக, மூலத்தின் குறிப்பான ‘மகன்’ என்ற பொருளைப் பேணுகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைப்பட்டத்தால் மாற்றாமல், திருநாமத்தின் தமிழாக்க ஒலிபெயர்ப்பைப் பயன்படுத்துகிறது.
- source_word: אֱלֹהֶיךָ
  choice: உன் இறைவனாகிய
  rationale: உடன்படிக்கை உறவைக் குறிக்கும் இரண்டாம் நபர் ஒருமையைப் பேணி, யாவே என்ற பெயருடன் இயல்பாக இணைக்கிறது.
theological_decisions:
- issue: இறைவன் அளிக்கும் ஒழுக்கத்தின் இயல்பு
  choice: ஒழுக்கப்படுத்துகிறார்
  alternative: கண்டிக்கிறார் / திருத்துகிறார் / பயிற்றுவிக்கிறார்
  rationale: தண்டனை சார்ந்த கண்டிப்பாக மட்டும் குறுக்காமலும், வெறும் போதனையாக மென்மைப்படுத்தாமலும், திருத்தம் மற்றும் உருவாக்கும் பயிற்சி ஆகிய இரண்டையும் திறந்தவாறு வைத்திருக்கிறது.
- issue: יְהוָה என்ற இறைநாமத்தின் மொழியாக்கம்
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலத்தில் நேரடியாக வரும் தனிப்பட்ட உடன்படிக்கைப் பெயரை ஒரு பட்டத்தால் மாற்றாமல் ஒலிபெயர்க்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில், ஒருமை இரண்டாம் நபரை மூலத்தின்படி பேணியுள்ளோம். ‘ஒழுக்கப்படுத்து’ என்பது சற்றே செறிவான சொல் என்றாலும், தந்தை–மகன் ஒப்புமையிலும் இறைச் செயலிலும் திருத்தம் மற்றும் பயிற்சி ஆகிய இரு நுணுக்கங்களையும் ஒரே சொல்லால் தாங்குகிறது.
