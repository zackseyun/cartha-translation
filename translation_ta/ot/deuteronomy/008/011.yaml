  text: הִשָּׁ֣מֶר לְ/ךָ֔ פֶּן תִּשְׁכַּ֖ח אֶת יְהוָ֣ה אֱלֹהֶ֑י/ךָ לְ/בִלְתִּ֨י שְׁמֹ֤ר מִצְוֺתָי/ו֙ וּ/מִשְׁפָּטָ֣י/ו וְ/חֻקֹּתָ֔י/ו אֲשֶׁ֛ר אָנֹכִ֥י מְצַוְּ/ךָ֖ הַ/יּֽוֹם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/008/011.yaml
  text: Be careful lest you forget Yahweh your God by failing to keep his commandments and his judgments and his statutes[b][a], which I am commanding you today.
translation:
  language: ta
  text: இன்று நான் உனக்குக் கட்டளையிடுகிற அவருடைய கட்டளைகளையும் நியாயவிதிகளையும் நியமங்களையும் கடைப்பிடிக்காமல், உன் கடவுளாகிய யாவேவை மறந்துவிடாதபடி எச்சரிக்கையாய் இரு.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “கடைப்பிடிக்காமல்” என்பதற்கு, “கடைப்பிடிக்கத் தவறுவதன் மூலம்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִשָּׁמֶר לְךָ
  choice: உன்னைக் கவனித்துக்கொள்
  rationale: நிபால் கட்டளை வடிவிலுள்ள எச்சரிக்கையின் வலிமையை இயல்பான நவீனத் தமிழில் தக்கவைக்கிறது; ‘உன்னைக் காத்துக்கொள்’ என்பதைக் காட்டிலும் இச்சூழலில் விழிப்புடன் இருப்பதைத் தெளிவாகச் சொல்கிறது.
- source_word: פֶּן תִּשְׁכַּח
  choice: மறந்துவிடாதபடி
  rationale: தவிர்க்க வேண்டிய அபாயத்தை அறிமுகப்படுத்தும் எபிரெய எச்சரிக்கைக் கட்டமைப்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: உன் கடவுளாகிய யாவே
  rationale: திருப்பெயரை ஒரு பட்டத்தால் மாற்றாமல் ‘யாவே’ என ஒலிபெயர்த்து, אֱלֹהֶיךָ என்பதிலுள்ள இரண்டாம் நபர் ஒருமையையும் காக்கிறது.
- source_word: לְבִלְתִּי שְׁמֹר
  choice: கடைப்பிடிக்காமல்
  rationale: யாவேவை மறப்பது அவரது கட்டளைகளைக் கடைப்பிடிக்காததில் வெளிப்படுகிறது என்ற தொடர்பைத் தமிழில் சுருக்கமாகத் தருகிறது; நோக்கத்தையும் விளைவையும் மட்டும் தீர்மானித்து விடாமல் மூலத்தின் உறவைத் தக்கவைக்கிறது.
- source_word: מִצְוֺתָיו
  choice: அவருடைய கட்டளைகள்
  rationale: உடன்படிக்கைச் சட்டச் சூழலில் מִצְוָה என்பதற்கான நேரடியான, பொதுவாகப் புரியும் தமிழ் இணை.
- source_word: מִשְׁפָּטָיו
  choice: அவருடைய நீதிமுறைகள்
  rationale: מִשְׁפָּט என்பதிலுள்ள நீதி மற்றும் சட்ட ஒழுங்கு ஆகிய இரு நுணுக்கங்களையும் ஓரளவு தக்கவைத்து, ‘தீர்ப்புகள்’ எனும் தவறான தனிப்பட்ட தீர்ப்பு எண்ணத்தைத் தவிர்க்கிறது.
- source_word: חֻקֹּתָיו
  choice: அவருடைய சட்டதிட்டங்கள்
  rationale: நிர்ணயிக்கப்பட்ட சட்டங்கள் அல்லது விதிகள் என்ற உடன்படிக்கைச் சட்ட நுணுக்கத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: אֲשֶׁר אָנֹכִי מְצַוְּךָ הַיּוֹם
  choice: இன்று நான் உனக்குக் கட்டளையிடுகிற
  rationale: மோசேயின் உரையின் நிகழ்கால உடனடித்தன்மையையும் ‘இன்று’ என்பதன் உடன்படிக்கை அவசரத்தையும் காக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற திருப்பெயரின் மொழியாக்கம்
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூலத்தில் தனிப்பட்ட உடன்படிக்கைப் பெயர் நேரடியாக உள்ளது. அதை பட்டப்பெயரால் மாற்றாமல் தமிழில் பொதுவாக அறியப்பட்ட ‘யாவே’ என ஒலிபெயர்ப்பது மூல வேறுபாட்டைக் காக்கிறது.
- issue: கடவுளை மறத்தலுக்கும் கட்டளைகளைக் கடைப்பிடிக்காமைக்கும் இடையிலான தொடர்பு
  choice: ‘கடைப்பிடிக்காமல்’ என்று முறையையோ வெளிப்பாட்டையோ குறிக்கும் வகையில் அமைத்தல்
  alternative: ‘கடைப்பிடிக்கத் தவறுவதன் மூலம்’ அல்லது ‘கடைப்பிடிக்காதிருக்கும்படி’
  rationale: לְבִלְתִּי שְׁמֹר கட்டமைப்பு மறத்தல் எவ்வாறு வெளிப்படுகிறது என்பதையோ அதனுடன் இணைந்த செயலையோ குறிக்கலாம். மொழிபெயர்ப்பு அந்தத் தொடர்பைத் தக்கவைத்து, நோக்கக் கருத்தை மட்டும் கட்டாயப்படுத்தவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழ்; மரியாதையுடனும் பொதுவாசகர்களுக்குப் புரியுமாறும் அமைந்த ஒருமை உரையாடல் நடை. சட்டச் சொற்களின் மூவகை வேறுபாடு ‘கட்டளைகள், நீதிமுறைகள், சட்டதிட்டங்கள்’ எனப் பாதுகாக்கப்பட்டுள்ளது.
