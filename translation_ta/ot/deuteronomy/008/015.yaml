base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/008/015.yaml
  text: who led you through the great and fearsome wilderness[a], with fiery serpents and scorpions and thirsty ground where there was no water; who brought out water for you from the flinty rock[b],
translation:
  language: ta
  text: பெரியதும் அச்சமூட்டுவதுமான வனாந்தரத்தின் வழியாக—எரிச்சல் உண்டாக்கும் பாம்புகளும்[a] தேள்களும், தண்ணீரே இல்லாத வறண்ட நிலமும்[b] உள்ள இடத்தின் வழியாக—உன்னை நடத்திச் சென்றவரும், கடினமான கற்பாறையிலிருந்து உனக்குத் தண்ணீரை வெளிவரச் செய்தவரும் அவரே.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நச்சுப் பாம்புகள்.” எபிரேயச் சொற்றொடரைச் சொல்லுக்கு சொல் “எரியும் பாம்புகள்” என்று மொழிபெயர்க்கலாம்; அவற்றின் கடி ஏற்படுத்திய எரிச்சலை இது குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “வறட்சி” அல்லது “தாகம்.” எபிரேயச் சொல் தண்ணீரற்ற இடத்தின் வறண்ட தன்மையைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמּוֹלִיכֲךָ
  choice: உன்னை நடத்திச் சென்றவரும்
  rationale: ஹிஃபில் வினையெச்சம் பெரிய வாக்கியத்தில் கர்த்தரைக் குறிக்கும் விளக்கத் தொடராக வருகிறது; கடந்தகால வனாந்தரப் பயணத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: בַּמִּדְבָּר הַגָּדֹל וְהַנּוֹרָא
  choice: பெரிதும் அச்சமூட்டுவதுமான வனாந்தரத்தின் வழியாக
  rationale: מִדְבָּר என்பதை மணற்பாலை என மிகக் குறுகலாகப் பொருள்படுத்தாமல் ‘வனாந்தரம்’ எனவும், נוֹרָא என்பதை நவீன வாசகருக்குத் தெளிவாக ‘அச்சமூட்டுவது’ எனவும் மொழிபெயர்க்கிறது.
- source_word: נָחָשׁ שָׂרָף
  choice: எரிச்சல் உண்டாக்கும் பாம்புகள்
  rationale: שָׂרָף என்பதிலுள்ள ‘எரிதல்’ படிமத்தை, பாம்பின் கடியால் ஏற்படும் எரிச்சலைக் குறிக்கக்கூடிய வகையில் இயல்பான தமிழில் காக்கிறது; சொல்லின் வேறு சாத்தியத்தை அடிக்குறிப்பு தருகிறது.
- source_word: וְעַקְרָב
  choice: தேள்களும்
  rationale: பட்டியலிலுள்ள அபாயத்தை நேரடியான நவீன தமிழில் கூறுகிறது.
- source_word: וְצִמָּאוֹן אֲשֶׁר אֵין מָיִם
  choice: தண்ணீரே இல்லாத வறண்ட நிலமும்
  rationale: צִמָּאוֹן குறிக்கும் தாகம் அல்லது வறண்ட தன்மையை, அடுத்துள்ள ‘தண்ணீர் இல்லை’ என்ற தொடருடன் இணைத்து நிலப்பரப்பின் தன்மையாகத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: הַמּוֹצִיא לְךָ מַיִם
  choice: உனக்காகத் தண்ணீரைப் புறப்படச் செய்தவரும்
  rationale: יצא என்பதன் காரணவினைப் பொருளையும், பாறையிலிருந்து தண்ணீர் வெளிவந்த காட்சியையும் காக்கிறது.
- source_word: מִצּוּר הַחַלָּמִישׁ
  choice: கடினமான கற்பாறையிலிருந்து
  rationale: צוּר என்பதைக் ‘கற்பாறை’ என்றும் חַלָּמִישׁ குறிக்கும் கடினமான அல்லது தீக்கல் போன்ற இயல்பை ‘கடினமான’ என்றும் இயல்பாக இணைக்கிறது.
theological_decisions:
- issue: வனாந்தர அபாயங்களின் தன்மை
  choice: பாம்புகள், தேள்கள், தண்ணீரற்ற வறண்ட நிலம் ஆகியவற்றை இஸ்ரவேலின் பயணத்தில் எதிர்கொண்ட உண்மையான அபாயங்களாக மொழிபெயர்த்தல்
  alternative: அவற்றை உருவக அல்லது ஆன்மிக அபாயங்களாக விளக்குதல்
  rationale: எபிரேய உரை வரலாற்றுப் பயணத்தையும் கர்த்தரின் பாதுகாப்பையும் உறுதியான காட்சிகளால் நினைவூட்டுகிறது; உருவக விளக்கத்தை உரைக்குள் சேர்க்கவில்லை.
- issue: נָחָשׁ שָׂרָף என்பதன் பொருள்
  choice: கடியால் எரிச்சல் உண்டாக்கும் பாம்புகள் எனப் புரியவைக்கும் மொழிபெயர்ப்பு
  alternative: சொல்லுக்கு சொல் ‘எரியும் பாம்புகள்’ அல்லது பொதுவாக ‘நச்சுப் பாம்புகள்’
  rationale: ‘எரிதல்’ என்ற மூலப் படிமத்தைப் பாதுகாத்தபடியே, பாம்புகள் உண்மையில் தீப்பற்றி எரிந்தன என்ற தேவையற்ற முடிவைத் தவிர்க்கிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான தமிழ்நடை பயன்படுத்தப்பட்டுள்ளது. வசனம் பெரிய வாக்கியத்தின் தொடராக இருப்பதால் எபிரேய வினையெச்ச அமைப்பு ‘...சென்றவரும் ...செய்தவரும் அவரே’ எனத் தக்கவைக்கப்பட்டது. பழமையான ‘கொள்ளிவாய்ச் சர்ப்பம்’ போன்ற சொற்கள் தவிர்க்கப்பட்டன; இடைச்செருகல் கோடுகள் நீண்ட அபாயப் பட்டியலை வாசிக்க உதவுகின்றன.
