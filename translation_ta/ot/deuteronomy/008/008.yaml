  text: a land of wheat and barley[a], of vines and fig trees and pomegranates, a land of olive oil and honey,
translation:
  language: ta
  text: கோதுமையும் வாற்கோதுமையும், திராட்சைக் கொடிகளும் அத்திமரங்களும் மாதுளைகளும் விளையும் நாடு; ஆலிவ் எண்ணெயும் தேனும்[a] நிறைந்த நாடு.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பேரீச்சம்பழப் பாகு.” எபிரெயச் சொல் இனிப்பான பாகு என்பதையும் குறிக்கக்கூடும்; குறிப்பாக நாட்டின் விளைபொருள்களை விவரிக்கும் இத்தகைய சூழலில் இப்பொருள் சாத்தியம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶרֶץ
  choice: நாடு
  rationale: வாக்குத்தத்த நாட்டின் விளைபொருள்களை விவரிக்கும் பட்டியலை அறிமுகப்படுத்துகிறது. தமிழில் இயல்பாக அமைய, ‘விளையும் நாடு’, ‘நிறைந்த நாடு’ என்ற தொடர்களில் இருமுறை வைத்துள்ளோம்.
- source_word: חִטָּה
  choice: கோதுமை
  rationale: இத்தானியத்திற்கான வழக்கமான, தெளிவான தமிழ்ச் சொல்.
- source_word: שְׂעֹרָה
  choice: வாற்கோதுமை
  rationale: barley-ஐ கோதுமையிலிருந்து தெளிவாக வேறுபடுத்தும் நவீனத் தமிழ்ப் பெயர்.
- source_word: גֶּפֶן
  choice: திராட்சைக் கொடிகள்
  rationale: எபிரெய ஒருமை இங்கு ஒரு பயிரினத்தைத் தொகுப்பாகக் குறிக்கிறது; தமிழில் பன்மை இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: תְּאֵנָה
  choice: அத்திமரங்கள்
  rationale: மூலச்சொல் பொதுவாகப் பழத்தைவிட அத்திமரத்தையே குறிக்கிறது; ஆகவே தாவரப் பட்டியலில் மரம் என்ற பொருளைப் பாதுகாக்கிறது.
- source_word: רִמּוֹן
  choice: மாதுளைகள்
  rationale: சொல் மாதுளைப் பழத்தையோ மரத்தையோ குறிக்கலாம்; விளைபொருள் பட்டியலில் ‘மாதுளைகள்’ இயல்பானதும் தேவையற்ற மிகை விளக்கத்தைத் தவிர்ப்பதும் ஆகும்.
- source_word: זֵית שֶׁמֶן
  choice: ஒலிவ எண்ணெய்
  rationale: சொற்றொடர் நேரடியாக ஒலிவமும் எண்ணெயும் தொடர்புடையதைக் காட்டுகிறது; தமிழில் விளைபொருளாக இயல்பாகப் புரிவது ‘ஒலிவ எண்ணெய்’.
- source_word: דְּבָשׁ
  choice: தேன்
  rationale: பொதுவான முதன்மைப் பொருளை முதன்மை உரையில் வைத்துள்ளோம்; நாட்டின் விளைபொருள் சூழலில் பேரீச்சம்பழப் பாகு என்ற வாய்ப்பை அடிக்குறிப்பில் பாதுகாத்துள்ளோம்.
