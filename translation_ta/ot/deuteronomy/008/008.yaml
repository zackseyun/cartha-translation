translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய உரையில் אֶרֶץ இருமுறை வருவதால் ‘நாடு’ என்ற சொல்லின் மறுபடியும் வருதல் பாதுகாக்கப்பட்டுள்ளது; பட்டியல் தமிழில் இயல்பாக அமைய ‘விளையும்’ மற்றும் ‘நிறைந்த’ சேர்க்கப்பட்டுள்ளன. அடிக்குறிப்பு குறியீடு தேன் என்ற சொல்லோடு இணைக்கப்பட்டுள்ளது.
