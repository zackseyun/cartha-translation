- from: “என் ஆற்றலும் என் கையின் வலிமையும்தான் இந்தச் செல்வத்தை எனக்குச் சம்பாதித்துத் தந்தன” என்று நீ உன் உள்ளத்தில் சொல்லிக்கொள்ளலாம்.[a]
  to: “என் ஆற்றலும் என் கையின் வலிமையும்தான் இந்தச் செல்வம் எனக்குக் கிடைக்கச் செய்தன” என்று நீ உன் உள்ளத்தில் சொல்லுவாய்.[a]
  rationale: The revision retains the draft’s sound lexical choices while rendering the projected inner claim with a future form rather than a weakened possibility. It also removes the added sense that the speaker’s power and hand-strength ‘gave’ wealth to him, while retaining the contextual sense that they obtained or produced it for him.
