base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/008/017.yaml
  text: and you say in your heart[a], ‘My power and the strength of my hand have gotten me this wealth,’
translation:
  language: ta
  text: “என் ஆற்றலும் என் கையின் வலிமையும்தான் இந்தச் செல்வம் எனக்குக் கிடைக்கச் செய்தன” என்று நீ உன் உள்ளத்தில் சொல்லுவாய்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இந்த வளம்.” எபிரேயச் சொல்லான חַיִל, சூழலுக்கேற்ப செல்வம், வளங்கள், வலிமை அல்லது திறன் ஆகியவற்றைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמַרְתָּ
  choice: என்று நீ ... சொல்லிக்கொள்ளலாம்
  rationale: இணைப்புடன் வரும் Qal perfect 2ms இங்கு எச்சரிக்கைச் சூழலில் நிகழக்கூடிய எதிர்காலச் சிந்தனையைக் குறிக்கிறது. ‘சொல்லிக்கொள்ளலாம்’ என்பது உறுதியான முன்கூற்றாக மாற்றாமல் அந்தச் சாத்தியத்தையும் உள்ளார்ந்த தன்னுரையையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: בִּלְבָבֶךָ
  choice: உன் உள்ளத்தில்
  rationale: எபிரேய மொழியின் ‘இதயத்தில்’ என்ற உருவகத்தை நவீன தமிழில் உள்ளார்ந்த சிந்தனை என இயல்பாகக் காட்டுகிறது.
- source_word: כֹּחִי
  choice: என் ஆற்றல்
  rationale: כֹּחַ என்பது வலிமை, ஆற்றல், திறன் ஆகியவற்றைக் குறிக்கலாம். அடுத்த சொற்றொடரிலுள்ள ‘வலிமை’ என்பதோடு தேவையற்ற மறுபடியும் வருவதைத் தவிர்த்து தனிப்பட்ட திறனை எடுத்துரைக்க ‘ஆற்றல்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: וְעֹצֶם יָדִי
  choice: என் கையின் வலிமை
  rationale: தனது செயல்வல்லமையைக் கைக்கு உரிய வலிமையாகக் கூறும் எபிரேய உருவகத்தை அப்படியே காக்கிறது.
- source_word: עָשָׂה לִי
  choice: எனக்குச் சம்பாதித்துத் தந்தன
  rationale: அடிப்படையில் ‘எனக்காகச் செய்தது/உண்டாக்கியது’ என்றாலும், செல்வச் சூழலில் பெற்றுக்கொடுத்தது அல்லது ஈட்டியது என்பதே பொருள். இரண்டு இணை எழுவாய்களுக்கு ஏற்ப தமிழ் வினை பன்மையில் அமைக்கப்பட்டது.
- source_word: הַחַיִל הַזֶּה
  choice: இந்தச் செல்வம்
  rationale: உபாகமம் 8-ன் உடனடிச் சூழல் பொருளாதார வளம், கால்நடைகள், வெள்ளி, தங்கம் ஆகியவற்றைப் பற்றியது; ஆகவே חַיִל என்பதற்கு இங்கு ‘செல்வம்’ முதன்மைப் பொருளாக ஏற்றது. அதன் விரிந்த பொருள் அடிக்குறிப்பில் காக்கப்படுகிறது.
theological_decisions:
- issue: உடன்படிக்கை எச்சரிக்கைச் சூழலில் חַיִל என்பதன் பொருள்
  choice: செல்வம்
  alternative: வளம்; வலிமை; வளவாய்ப்புகள்
  rationale: இஸ்ரவேல் தனது பொருளாதார வளத்தைத் தன் சொந்த ஆற்றலுக்கே உரியதாகக் கருதும் அபாயமே உடனடிச் சூழலில் வலியுறுத்தப்படுகிறது. ‘செல்வம்’ இதைத் தெளிவாகக் காட்டுகிறது; எனினும் மூலச்சொல்லின் பரந்த பொருள் அடிக்குறிப்பில் பதிவு செய்யப்படுகிறது.
translation_notes:
  register: நவீன தரநிலைத் தமிழில், வாசிக்க எளிதானாலும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. ‘உள்ளத்தில்’ மற்றும் ‘கையின் வலிமை’ என்பவை மூலத்தின் உருவகங்களைப் பாதுகாக்கின்றன; நேரடி உரை தமிழின் இயல்பான சொல்வரிசையில் அமைக்கப்பட்டுள்ளது.
