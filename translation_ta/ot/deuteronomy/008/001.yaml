- from: நீங்கள் வாழ்ந்து பெருகவும், உங்கள் தந்தையருக்கு யாவே ஆணையிட்டுக் கொடுத்த நாட்டிற்குள் சென்று அதைச் சொந்தமாக்கிக்கொள்ளவும், இன்று நான் உனக்குக் கட்டளையிடும் ஒவ்வொரு கட்டளையையும்[a] கவனமாகக் கடைப்பிடிக்க வேண்டும்.[b][c]
