base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/008/001.yaml
  text: You shall carefully keep every commandment that I am commanding you today[c][b][a], so that you may live and multiply and enter and possess the land that Yahweh swore to your fathers.
translation:
  language: ta
  text: இன்று நான் உனக்குக் கட்டளையிடும் ஒவ்வொரு கட்டளையையும்[a] நீங்கள் கவனமாகக் கடைப்பிடிக்க வேண்டும்.[b] அப்பொழுது நீங்கள் வாழ்ந்து பெருகி, யாவே உங்கள் தந்தையருக்கு ஆணையிட்டு வாக்களித்த நாட்டிற்குள் சென்று அதைச் சொந்தமாக்கிக்கொள்வீர்கள்.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “முழுக் கட்டளையையும்.” எபிரெய மொழியில் இது ஒருமைத் தொகுப்புச் சொற்றொடர்.
    reason: lexical_alternative
  - marker: b
    text: “உனக்கு” என்பது எபிரெய மொழியில் ஒருமை; “நீங்கள்” என்பது பன்மை. இஸ்ரவேல் ஒரே மக்களாகவும் பலரைக் கொண்ட சமூகமாகவும் அழைக்கப்படுவதால் இந்த மாற்றம் வருகிறது.
    reason: source_ambiguity
  - marker: c
    text: “உங்கள் தந்தையர்” என்பது இஸ்ரவேலின் முற்பிதாக்களைக் குறிக்கிறது. “சொந்தமாக்கிக்கொள்வீர்கள்” என்பதற்கு “சுதந்தரித்துக்கொள்வீர்கள்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל הַמִּצְוָה
  choice: ஒவ்வொரு கட்டளையையும்
  rationale: எபிரெய மொழியில் ஒருமைத் தொகுப்புச் சொற்றொடராக இருந்தாலும், கட்டளைகளின் முழுத் தொகுதியையும் இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது; ‘முழுக் கட்டளையையும்’ என்பதும் சாத்தியம் என்பதால் அடிக்குறிப்பு தரப்பட்டுள்ளது.
- source_word: מְצַוְּךָ
  choice: நான் உனக்குக் கட்டளையிடும்
  rationale: பங்கேற்புவினை வடிவத்தின் நிகழ்கால/உடனடி தன்மையைப் பாதுகாக்கிறது. இங்குள்ள இரண்டாம் நபர் ஒருமையை ‘உனக்கு’ என வைத்துள்ளதால், இஸ்ரவேல் ஒரே மக்களாக அழைக்கப்படும் மாற்றமும் மறையவில்லை.
- source_word: תִּשְׁמְרוּן לַעֲשׂוֹת
  choice: கவனமாகக் கடைப்பிடிக்க வேண்டும்
  rationale: ‘காத்து, செய்ய’ என்ற சொற்படியான அமைப்பை இயல்பான தமிழில், கவனத்தோடு கீழ்ப்படிந்து செயல்படுத்துதல் என்ற ஒருங்கிணைந்த பொருளில் வழங்குகிறது.
- source_word: לְמַעַן
  choice: …வும் …வும்
  rationale: நோக்கம்/விளைவைத் தமிழின் இணை நோக்குவினை அமைப்பால் இயல்பாகக் காட்டுகிறது.
- source_word: תִּחְיוּן
  choice: நீங்கள் வாழ்ந்து
  rationale: வாழ்தல் அல்லது உயிருடன் நிலைத்திருத்தல் என்ற நேரடியான பொருளைத் தருகிறது.
- source_word: וּרְבִיתֶם
  choice: பெருகவும்
  rationale: எண்ணிக்கையில் அதிகரித்தல் என்ற உடன்படிக்கைச் சூழலின் பொருளைப் பாதுகாக்கிறது.
- source_word: וּבָאתֶם
  choice: சென்று
  rationale: வாக்குத்தத்த நாட்டிற்குள் பிரவேசிப்பதை இயல்பான தமிழில் தொடர்வினையாகக் காட்டுகிறது.
- source_word: וִירִשְׁתֶּם
  choice: சொந்தமாக்கிக்கொள்ளவும்
  rationale: יָרַשׁ என்பதன் நாட்டைக் கைப்பற்றி உரிமையாக்கிக்கொள்ளும் பொருளைத் தருகிறது; ‘சுதந்தரித்துக்கொள்ளவும்’ என்ற மாற்றுப் பொருளும் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: הָאָרֶץ
  choice: நாட்டை
  rationale: உடன்படிக்கையில் வாக்குறுதி அளிக்கப்பட்ட குறிப்பிட்ட நிலப்பரப்பை நவீனத் தமிழில் தெளிவாகக் குறிக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: திருநான்கெழுத்துத் தெய்வீகப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் பரவலாகப் புரியக்கூடிய ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: נִשְׁבַּע
  choice: ஆணையிட்டுக் கொடுத்த
  rationale: இறைவன் தம்மை ஆணையால் பிணைத்துக்கொண்டதைக் காட்டும் வினையின் உடன்படிக்கை வலிமையைத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: לַאֲבֹתֵיכֶם
  choice: உங்கள் தந்தையருக்கு
  rationale: மூலத்தின் ஆண்பால் உறவுச் சொல்லைப் பாதுகாக்கிறது; இங்கு இஸ்ரவேலின் முற்பிதாக்கள் குறிக்கப்படுகின்றனர்.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: யெகோவா; ஆண்டவர்
  rationale: மூலத்தில் தனிப்பெயர் நேரடியாக உள்ளது. ஆகவே பட்டமான ‘ஆண்டவர்’ என்பதற்குப் பதிலாகத் தெய்வீகப் பெயரை ஒலிபெயர்த்து வைத்துள்ளது.
- issue: אֲבֹתֵיכֶם என்ற ஆண்பால் உறவுச் சொல்
  choice: உங்கள் தந்தையர்
  alternative: உங்கள் மூதாதையர்
  rationale: மூலத்தின் ஆண்பால் வடிவத்தை மாற்றாமல் பாதுகாக்கிறது; அதன் சூழல்சார் குறிப்பு முற்பிதாக்கள் என்பதை அடிக்குறிப்பு விளக்குகிறது.
- issue: ஒருமை மற்றும் பன்மை இரண்டாம் நபர் வடிவங்களின் மாறுதல்
  choice: ‘உனக்கு’ என்ற ஒருமையையும் ‘நீங்கள்’ என்ற பன்மையையும் பாதுகாத்தல்
  alternative: எங்கும் ‘உங்களுக்கு/நீங்கள்’ என்று ஒருமைப்படுத்தல்
  rationale: மோசே இஸ்ரவேலை ஒரே கூட்டு நபராகவும் பலரைக் கொண்ட மக்களாகவும் மாறிமாறி அழைக்கும் மூல இலக்கணத் திடீர்மாற்றத்தைச் சீராக்காமல் வைத்துள்ளது.
translation_notes:
  register: நவீன தரத் தமிழ்; பொதுவாசகர்களுக்குப் புரியும் வகையில் இயல்பானதும் கண்ணியமானதும். உடன்படிக்கைச் சூழலின் செறிவையும், ஒருமை–பன்மை மாற்றத்தையும், יָרַשׁ என்பதின் உடைமையாக்குதல்/சுதந்தரித்தல் இருபொருள் வாய்ப்பையும் பாதுகாக்கிறது.
