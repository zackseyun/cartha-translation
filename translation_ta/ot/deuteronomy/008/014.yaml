  text: וְ/רָ֖ם לְבָבֶ֑/ךָ וְ/שָֽׁכַחְתָּ֙ אֶת יְהוָ֣ה אֱלֹהֶ֔י/ךָ הַ/מּוֹצִיאֲ/ךָ֛ מֵ/אֶ֥רֶץ מִצְרַ֖יִם מִ/בֵּ֥ית עֲבָדִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/008/014.yaml
  text: then your heart is lifted up[a], and you forget Yahweh your God, who brought you from the land of Egypt, from the house of servants.
translation:
  language: ta
  text: அப்போது உன் உள்ளம் உயர்ந்துவிடும்[a]; எகிப்து நாட்டிலிருந்தும் அடிமைகளின் வீட்டிலிருந்தும் உன்னை வெளியே கொண்டுவந்த உன் கடவுளாகிய யாவேவை நீ மறந்துவிடுவாய்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அதாவது, உன் உள்ளம் செருக்கடையும்; அல்லது, நீ பெருமைகொள்வாய்.
    reason: மூலத்தில் ‘உள்ளம் உயர்தல்’ என்ற உருவகம் உள்ளது; இச்சூழலில் அது ஆணவம் அல்லது பெருமையைக் குறிக்கிறது.
lexical_decisions:
- source_word: וְרָם לְבָבֶךָ
  choice: உன் உள்ளம் உயர்ந்துவிடும்
  rationale: எபிரெய மொழியின் ‘இதயம்/உள்ளம் உயர்தல்’ என்ற உருவகத்தைத் தக்கவைக்கிறது; சூழலில் அது செருக்கையும் பெருமையையும் குறிக்கிறது. தமிழில் ‘உள்ளம்’ என்பது மனவிருப்பம், மனப்பாங்கு, அகநிலை ஆகியவற்றை இயல்பாகக் குறிக்கிறது.
- source_word: וְשָׁכַחְתָּ
  choice: நீ மறந்துவிடுவாய்
  rationale: முந்தைய வசனங்களிலிருந்து தொடரும் எச்சரிக்கை–விளைவு அமைப்பை இயல்பான தமிழ் எதிர்கால வடிவில் வெளிப்படுத்துகிறது; இதை முடிந்துபோன இறந்தகால நிகழ்வாக நிர்ணயிப்பதில்லை.
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: உன் கடவுளாகிய யாவே
  rationale: தெய்வீகப் பெயரான יהוה என்பதை ஒரு பட்டப்பெயரால் மாற்றாமல் ‘யாவே’ என்று ஒலிபெயர்க்கிறது; אֱלֹהֶיךָ என்பதின் இரண்டாம் நபர் ஒருமை உடைமைப் பொருளையும் காக்கிறது.
- source_word: הַמּוֹצִיאֲךָ
  choice: உன்னை … வெளியே கொண்டுவந்தவர்
  rationale: பெயர்ச்சொல் தன்மையுடன் வரும் எபிரெயப் பங்கேற்பு வடிவத்தை இயல்பான தமிழ் உறவுத்தொடராக வழங்கி, வெளியேற்றச் செயலைத் தெளிவாகத் தக்கவைக்கிறது.
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: எகிப்து நாட்டிலிருந்து
  rationale: ‘எகிப்து நாடு’ என்ற முழுமையான எபிரெயச் சொற்றொடரையும் அதன் மூலத்தைக் குறிக்கும் முன்னிடைத் தொடர்பையும் பிரதிபலிக்கிறது.
- source_word: מִבֵּית עֲבָדִים
  choice: அடிமைகளின் வீட்டிலிருந்து
  rationale: עֲבָדִים என்பது ‘அடிமைகள்’ என்ற பன்மைத் திடப்பெயர் என்பதால், ‘அடிமைத்தனம்’ என்ற கருத்துப்பெயராக மாற்றாமல் எபிரெய உருவகத்தையும் சமூக உண்மையையும் காக்கிறது.
theological_decisions:
- issue: יהוה என்ற தெய்வீகப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: ஆண்டவர் / யெகோவா
  rationale: மூல உரையில் தனிப்பட்ட உடன்படிக்கைப் பெயர் நேரடியாக வருகிறது. ஆகவே அதை பட்டப்பெயரான ‘ஆண்டவர்’ என்று மாற்றாமல், சாத்தியமான எபிரெய உச்சரிப்பைத் தமிழில் ‘யாவே’ என்று ஒலிபெயர்க்கிறது.
- issue: מִבֵּית עֲבָדִים என்பதிலுள்ள அடிமை நிலை
  choice: அடிமைகளின் வீட்டிலிருந்து
  alternative: அடிமைத்தனத்தின் வீட்டிலிருந்து / அடிமைத்தனத்திலிருந்து
  rationale: ‘அடிமைகள்’ என்ற பன்மைத் திடப்பெயரைப் பாதுகாத்து, யாத்திராகமப் பின்னணியிலுள்ள கட்டாய அடிமை நிலையைக் கருத்துப்பெயராக மென்மைப்படுத்தாமல் வழங்குகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பாகவும் மதிப்புமிக்க நடையிலும் அமைக்கப்பட்டுள்ளது. ‘உன்/நீ’ என்ற ஒருமை வடிவங்கள் எபிரெய இரண்டாம் நபர் ஆண்பால் ஒருமையைத் தக்கவைக்கின்றன. ‘உள்ளம் உயர்தல்’ மற்றும் ‘அடிமைகளின் வீடு’ ஆகிய மூல உருவகங்கள் அடிக்குறிப்புகளுடன் பாதுகாக்கப்பட்டுள்ளன.
