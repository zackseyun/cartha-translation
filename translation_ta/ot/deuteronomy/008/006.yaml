source:
  edition: WLC
  text: וְ/שָׁ֣מַרְתָּ֔ אֶת מִצְוֺ֖ת יְהוָ֣ה אֱלֹהֶ֑י/ךָ לָ/לֶ֥כֶת בִּ/דְרָכָ֖י/ו וּ/לְ/יִרְאָ֥ה אֹתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/008/006.yaml
  text: So you shall keep the commandments of Yahweh your God[b][a], by walking in his ways and by fearing him.
translation:
  language: ta
  text: ஆகவே[a], உன் இறைவனாகிய யாவேயின் கட்டளைகளைக் கடைப்பிடிக்க வேண்டும்—அவருடைய வழிகளில் நடப்பதன் மூலமும் அவருக்கு அஞ்சுவதன்[b] மூலமும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘மேலும், ... கடைப்பிடிக்க வேண்டும்’ என்றும் மொழிபெயர்க்கலாம். எபிரேய இணைப்புச்சொல் ஒரு சாதாரண இணைப்பாகவும் வாசிக்கப்படலாம்; இங்கு முந்தைய சூழலிலிருந்து வரும் முடிவை அது உணர்த்துவதாகத் தெரிகிறது.
    reason: lexical_alternative
  - marker: b
    text: ‘அவருக்கு அஞ்சுவது’ என்பது கடவுள்முன் பயபக்தியுடன் அஞ்சுவதைக் குறிக்கிறது; ‘அவரைப் பயபக்தியுடன் போற்றுவது’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁמַרְתָּ
  choice: ஆகவே ... கடைப்பிடிக்க வேண்டும்
  rationale: שׁמר என்பது உடன்படிக்கைச் சூழலில் கட்டளைகளைப் பேணிக் கடைப்பிடிப்பதைக் குறிக்கிறது. முன்னுள்ள கருத்திலிருந்து வரும் முடிவை וְ இங்கு உணர்த்துவதால் ‘ஆகவே’ என மொழிபெயர்க்கப்பட்டுள்ளது; அதன் எளிய இணைப்புப் பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: מִצְוֺת
  choice: கட்டளைகள்
  rationale: מִצְוָה என்பதன் பன்மை வடிவம் கடவுள் விதித்த கடமைகளைக் குறிக்கிறது; ‘கட்டளைகள்’ அதன் சட்ட மற்றும் உடன்படிக்கைச் செறிவைப் பேணுகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இது தெய்வீகப் பெயரான நான்கெழுத்துப் பெயரைத் தலைப்பால் மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: אֱלֹהֶיךָ
  choice: உன் இறைவன்
  rationale: இரண்டாம் நபர் ஒருமை உடைமைப் பின்னொட்டை நேரடியாகவும் இயல்பான தமிழிலும் வெளிப்படுத்துகிறது.
- source_word: לָלֶכֶת בִּדְרָכָיו
  choice: அவருடைய வழிகளில் நடப்பதன் மூலம்
  rationale: ‘வழிகளில் நடப்பது’ என்ற உருவகத்தைப் பேணுகிறது; ‘மூலம்’ என்பது கட்டளைகளைக் கடைப்பிடிக்கும் விதத்தைத் தெளிவாக்குகிறது.
- source_word: וּלְיִרְאָה אֹתוֹ
  choice: அவருக்கு அஞ்சுவதன் மூலம்
  rationale: ירא என்பதிலுள்ள அச்சத்தின் வலிமையை மென்மையாக்காமல் வைத்திருக்கிறது; இச்சூழலில் அது பயபக்தியுடன் கூடிய அச்சம் என்பதை அடிக்குறிப்பு விளக்குகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலத்தில் தனிப்பட்ட உடன்படிக்கைப் பெயர் நேரடியாக உள்ளது; ஆகவே ஒரு பட்டப்பெயரைப் பதிலிடாமல் ‘யாவே’ என்று ஒலிபெயர்க்கப்பட்டுள்ளது.
- issue: கடவுளை ‘அஞ்சுதல்’ என்பதன் பொருள்
  choice: அவருக்கு அஞ்சுவது
  alternative: அவரைப் பயபக்தியுடன் போற்றுவது
  rationale: மூல வினைச்சொல்லில் உள்ள அச்சம் என்ற பொருளையும் அதன் இறையியல் அழுத்தத்தையும் முதன்மை உரை பேணுகிறது; பயபக்தி சார்ந்த நுட்பம் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகருக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. மூலத்தின் இரண்டாம் நபர் ஒருமை ‘உன்’ என்று பேணப்பட்டுள்ளது. நீளமான இரண்டு விதவினைத் தொடர்களின் தொடர்பை இயல்பாக்க நீண்ட கோடு பயன்படுத்தப்பட்டுள்ளது.
