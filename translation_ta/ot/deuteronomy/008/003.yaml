  text: וַֽ/יְעַנְּ/ךָ֮ וַ/יַּרְעִבֶ/ךָ֒ וַ/יַּֽאֲכִֽלְ/ךָ֤ אֶת הַ/מָּן֙ אֲשֶׁ֣ר לֹא יָדַ֔עְתָּ וְ/לֹ֥א יָדְע֖וּ/ן אֲבֹתֶ֑י/ךָ לְמַ֣עַן הוֹדִֽעֲ/ךָ֗ כִּ֠י לֹ֣א עַל הַ/לֶּ֤חֶם לְ/בַדּ/וֹ֙ יִחְיֶ֣ה הָֽ/אָדָ֔ם כִּ֛י עַל כָּל מוֹצָ֥א פִֽי יְהוָ֖ה יִחְיֶ֥ה הָ/אָדָֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/008/003.yaml
  text: And he humbled you and let you hunger and fed you the manna[a], which you had not known, nor had your fathers known, so that he might make you know that man does not live by bread alone[b], but man lives by every word that comes from the mouth of Yahweh.
translation:
  language: ta
  text: அவர் உன்னைத் தாழ்த்தினார்; உன்னைப் பசியுறச் செய்தார்; நீயும் உன் முன்னோர்களும் அறிந்திராத மன்னாவை உனக்கு உணவாகக் கொடுத்தார்; மனிதன்[a] அப்பத்தினால் மட்டும் வாழ்வதில்லை; யாவேயின் வாயிலிருந்து புறப்படும் ஒவ்வொன்றினாலும்[b] மனிதன் வாழ்கிறான் என்பதை உனக்கு உணர்த்துவதற்காக.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இங்கே ‘மனிதன்’ என்பது ஆண்களை மட்டும் அல்லாமல் மனிதர்கள் அனைவரையும் பொதுவாகக் குறிக்கிறது.
    reason: cultural_note
  - marker: b
    text: அல்லது, “யாவேயின் வாயிலிருந்து வரும் ஒவ்வொரு வார்த்தையினாலும்.” எபிரெயச் சொற்றொடர் ‘வார்த்தை’ என்பதைக் காட்டிலும் விரிவானது; ஆயினும் இச்சூழலில் ‘வார்த்தை’ என்பது பொருத்தமான மொழிபெயர்ப்பு.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְעַנְּךָ
  choice: அவர் உன்னைத் தாழ்த்தி
  rationale: பியேல் வடிவிலுள்ள ענה என்பதற்கு ‘துன்புறுத்து’ அல்லது ‘தாழ்த்து’ என்ற பொருள் வரலாம். வனாந்தரச் சோதனை மற்றும் பயிற்சி என்ற சூழலில், ‘தாழ்த்தி’ என்பது உடல் வேதனையை அளவுக்கு மீறி வலியுறுத்தாமல் நோக்கத்தை வெளிப்படுத்துகிறது.
- source_word: וַיַּרְעִבֶךָ
  choice: உன்னைப் பசியுறச் செய்து
  rationale: ஹிஃபில் வடிவின் காரணவினைப் பொருளையும் கடவுளின் செயற்பாட்டையும் நேரடியாகப் பாதுகாக்கிறது.
- source_word: וַיַּאֲכִלְךָ אֶת־הַמָּן
  choice: மன்னாவை உனக்கு உணவாகக் கொடுத்தார்
  rationale: אכל என்பதன் காரணவினைப் பொருளை இயல்பான தமிழில் தருகிறது; ‘மன்னா’ என்ற நிலைபெற்ற பெயரும் பாதுகாக்கப்படுகிறது.
- source_word: אֲשֶׁר לֹא יָדַעְתָּ וְלֹא יָדְעוּן אֲבֹתֶיךָ
  choice: நீயும் உன் முன்னோர்களும் அறிந்திராத
  rationale: இங்கு ‘அறிதல்’ என்பது வெறும் அறிவுசார் தெரிதலைவிட, முன்பு அறிமுகம் அல்லது அனுபவம் இல்லாததைக் குறிக்கிறது. இணைந்த தமிழ் வடிவம் இரு தரப்பையும் தெளிவாக உள்ளடக்குகிறது.
- source_word: לְמַעַן הוֹדִעֲךָ
  choice: உனக்கு உணர்த்தவே
  rationale: ידע என்பதன் காரணவினைப் பொருளான ‘அறியச் செய்தல்’ என்பதை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: הָאָדָם
  choice: மனிதன்
  rationale: ஒரு குறிப்பிட்ட ஆணை அல்லாமல் மனிதகுலத்தைப் பிரதிநிதித்துவமாகக் குறிக்கும் எபிரெயச் சொல்லுக்கு இயல்பான தமிழ்ச் சமமான சொல். எபிரெயத்தில் உள்ள மறுபடியும் கூறுதலும் இரு இடங்களிலும் பாதுகாக்கப்பட்டுள்ளது.
- source_word: הַלֶּחֶם לְבַדּוֹ
  choice: அப்பத்தினால் மட்டும்
  rationale: உயிர்வாழ்வதற்கான சாதாரண உணவைக் குறிக்கும் உருவகத்தையும் எதிர்மறை–நேர்மறை முரண்பாட்டையும் சுருக்கமாகப் பாதுகாக்கிறது.
- source_word: כָּל־מוֹצָא פִי יְהוָה
  choice: யாவேயின் வாயிலிருந்து புறப்படும் ஒவ்வொன்றினாலும்
  rationale: מוֹצָא என்பது சொல்லைக் காட்டிலும் விரிவாக, ‘புறப்படுவது’ அல்லது ‘வெளிவருவது’ எனப் பொருள்படலாம். எனவே மூலத்தின் உண்மையான விரிவையும் தெளிவின்மையையும் முதன்மை உரையில் பாதுகாக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரை பொதுப்பட்டமான ‘கர்த்தர்’ என்று மாற்றாமல், எபிரெயத் தனிப்பெயரின் வழக்கமான தமிழ் ஒலிபெயர்ப்பாக வழங்குகிறது.
theological_decisions:
- issue: பிரதிநிதித்துவப் பொதுப்பொருளில் வரும் הָאָדָם என்பதன் மொழிபெயர்ப்பு
  choice: மனிதன்
  alternative: மனிதகுலம் / ஒருவர்
  rationale: இவ்வாக்கியம் ஆண்களை மட்டும் குறிக்கவில்லை. ‘மனிதன்’ என்பது தமிழில் மனிதகுலத்தைப் பிரதிநிதித்துவமாகக் குறிக்கக்கூடியதுடன், மூலத்தின் ஒருமை வடிவத்தையும் இருமுறை வரும் சொல்லாட்சியையும் காக்கிறது.
- issue: מוֹצָא פִי יְהוָה என்பதன் பொருள் வரம்பு
  choice: யாவேயின் வாயிலிருந்து புறப்படும் ஒவ்வொன்றினாலும்
  alternative: யாவேயின் வாயிலிருந்து வரும் ஒவ்வொரு வார்த்தையினாலும்
  rationale: ‘வார்த்தை’ என்பது சூழலுக்குப் பொருத்தமான விளக்கம் என்றாலும், מוֹצָא என்ற சொல் வாயிலிருந்து புறப்படும் அனைத்தையும் குறிக்கும் விரிவான சொல்லாகும். முதன்மை உரை அந்த விரிவைத் தக்கவைத்து, விளக்கமான மாற்றை அடிக்குறிப்பில் தருகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையில் கண்ணியமான நடையுடன் மொழிபெயர்க்கப்பட்டுள்ளது. ‘அப்பம்’, ‘மன்னா’, ‘யாவே’ ஆகிய வேதாகமச் சூழலில் நிலைபெற்ற சொற்கள் தக்கவைக்கப்பட்டுள்ளன. காரணத்தை இறுதியில் வைக்கும் தமிழ் வாக்கிய அமைப்பு இயல்பான ஓட்டத்திற்காகப் பயன்படுத்தப்பட்டுள்ளது.
