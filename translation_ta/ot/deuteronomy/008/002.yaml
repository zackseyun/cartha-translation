base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/008/002.yaml
  text: And you shall remember all the way that Yahweh your God has led you these forty years in the wilderness[a], in order to humble you, to test you, to know what was in your heart, whether you would keep his commandments or not.
translation:
  language: ta
  text: உன் கடவுளாகிய யாவே உன்னை இந்த நாற்பது ஆண்டுகளாகப் பாலைநிலத்தில் நடத்திவந்த வழி முழுவதையும் நினைவில் கொள்; உன்னைத் தாழ்த்தவும், உன்னைச் சோதிக்கவும், உன் உள்ளத்தில் என்ன இருக்கிறது என்பதையும் நீ அவருடைய கட்டளைகளைக் கடைப்பிடிப்பாயா இல்லையா என்பதையும் அறியவும் அவர் உன்னை நடத்தினார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உன் உள்ளத்தில் என்ன இருக்கிறது என்பதை வெளிப்படுத்துவதற்காக.” எபிரெய உரை நேரடியாக, “உன் உள்ளத்தில் என்ன இருக்கிறது என்பதை அறிய” என்கிறது; அந்தச் சொற்றொடர் முதன்மை உரையில் தக்கவைக்கப்பட்டுள்ளது.
    reason: ‘அறிய’ என்ற நேரடிப் பொருளைத் தக்கவைத்தபடி, சோதனையால் உள்ளத்தில் இருப்பது வெளிப்படுகிறது என்ற சூழல்சார் மாற்றுப் புரிதலைப் பதிவு செய்கிறது.
lexical_decisions:
- source_word: וְזָכַרְתָּ
  choice: நினைவில் கொள்
  rationale: அறிவுறுத்தல் சூழலில் கட்டளையுணர்வுடன் வரும் வினையை நவீனத் தமிழில் இயல்பான நேரடிக் கட்டளையாக வழங்குகிறது.
- source_word: כָּל הַדֶּרֶךְ
  choice: பாதை முழுவதையும்
  rationale: இது ஒரு சாலையை மட்டும் அல்லாமல் பாலைநிலப் பயணத்தின் முழுப் போக்கையும் குறிக்கிறது; ‘பாதை முழுவதும்’ என்ற உருவகத்தையும் தக்கவைக்கிறது.
- source_word: הֹלִיכֲךָ
  choice: உன்னை வழிநடத்திய
  rationale: הלך என்பதன் causative வடிவம் இங்கு யாவேயின் நடத்துதலைக் குறிக்கிறது; ‘வழிநடத்திய’ என்பது இயல்பாகவும் பொருள்நெருக்கமாகவும் உள்ளது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெயத் தனிப்பெயரான יהוה-ஐ ஒரு பட்டப்பெயரால் மாற்றாமல், தமிழில் ஏற்ற ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: אֱלֹהֶיךָ
  choice: உன் கடவுள்
  rationale: உடன்படிக்கை உறவை வெளிப்படுத்தும் இரண்டாம் நபர் ஒருமைப் possessive வடிவத்தை நேரடியாகத் தக்கவைக்கிறது.
- source_word: זֶה אַרְבָּעִים שָׁנָה
  choice: இந்த நாற்பது ஆண்டுகளாக
  rationale: காலநீட்சியை நவீனத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: בַּמִּדְבָּר
  choice: பாலைநிலத்தில்
  rationale: மக்கள் குடியேற்றம் குறைந்த வறண்ட wilderness பகுதியைக் குறிக்கும் இயல்பான நவீனத் தமிழ் சொல்; ‘பாலைவனம்’ என்பதைக் காட்டிலும் பொருள் பரப்பைச் சற்றே அகலமாக வைத்திருக்கிறது.
- source_word: עַנֹּתְךָ
  choice: உன்னைத் தாழ்த்துவதற்காக
  rationale: இந்தச் சூழலில் hardship மூலம் தாழ்த்துதல் அல்லது கீழ்ப்படுத்துதல் என்ற கருத்தை வெளிப்படுத்துகிறது; ‘துன்புறுத்துதல்’ என்று மட்டும் குறுக்கவில்லை.
- source_word: לְנַסֹּתְךָ
  choice: உன்னைச் சோதிப்பதற்காக
  rationale: נסה என்பதன் மதிப்பீட்டு அல்லது நிரூபிப்பு சார்ந்த பொருளைத் தெளிவாகக் காட்டுகிறது.
- source_word: לָדַעַת אֶת אֲשֶׁר בִּלְבָבְךָ
  choice: உன் உள்ளத்தில் இருப்பதை அறிந்துகொள்வதற்காக
  rationale: ‘அறிய’ என்ற எபிரெய நேரடிப் பொருளையும், לֵבָב குறிக்கும் உள்ளார்ந்த எண்ணம் மற்றும் மனவிருப்பத்தையும் தக்கவைக்கிறது.
- source_word: הֲתִשְׁמֹר מצותו אִם לֹא
  choice: நீ அவருடைய கட்டளைகளைக் கடைப்பிடிப்பாயா இல்லையா
  rationale: கீழ்ப்படிதல் குறித்த இருவழிக் கேள்வியை இயல்பான தமிழில் தெளிவாக வழங்குகிறது.
theological_decisions:
- issue: ‘உன் உள்ளத்தில் இருப்பதை அறிந்துகொள்ள’ என்பதில் உள்ள மனித இயல்புச் சாயலுடைய இறைமொழி
  choice: ‘அறிந்துகொள்வதற்காக’ என்ற நேரடிச் சொல்லை முதன்மை உரையில் தக்கவைத்தல்
  alternative: ‘உன் உள்ளத்தில் இருப்பதை வெளிப்படுத்துவதற்காக’
  rationale: எபிரெய உரை ‘அறிய’ என்றே கூறுகிறது. இறைவனின் அனைத்தறிவு குறித்த கேள்வியை மொழிபெயர்ப்பில் முன்கூட்டியே தீர்க்காமல், மூலத்தில் உள்ள இறையியல் அழுத்தத்தையும் பன்முகத் திறனையும் தக்கவைக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், ஒருமை ‘நீ’ வடிவத்தின் மூலம் இஸ்ரவேல் மக்களை ஒருங்கிணைந்த உடன்படிக்கை சமூகமாக அழைக்கும் எபிரெய நடையைத் தக்கவைத்துள்ளது. மொழிநடை கண்ணியமானதும் பொதுவாசகர்களுக்குப் புரியத்தக்கதுமாக உள்ளது; இறைப்பெயர் ‘யாவே’ என்று ஒலிபெயர்க்கப்பட்டுள்ளது.
