revisions:
- from: உன் கடவுளாகிய யாவே இந்த நாற்பது ஆண்டுகளாகப் பாலைநிலத்தில் உன்னை வழிநடத்திய பாதை முழுவதையும் நினைவில் கொள். உன்னைத் தாழ்த்துவதற்காகவும், உன்னைச் சோதிப்பதற்காகவும், நீ அவருடைய கட்டளைகளைக் கடைப்பிடிப்பாயா இல்லையா என்று உன் உள்ளத்தில் இருப்பதை அறிந்துகொள்வதற்காகவும்[a] அவர் உன்னை இவ்வாறு வழிநடத்தினார்.
  to: உன் கடவுளாகிய யாவே உன்னை இந்த நாற்பது ஆண்டுகளாகப் பாலைநிலத்தில் நடத்திவந்த வழி முழுவதையும் நினைவில் கொள்; உன்னைத் தாழ்த்தவும், உன்னைச் சோதிக்கவும், உன் உள்ளத்தில் என்ன இருக்கிறது என்பதையும் நீ அவருடைய கட்டளைகளைக் கடைப்பிடிப்பாயா இல்லையா என்பதையும் அறியவும் அவர் உன்னை நடத்தினார்.[a]
  rationale: 'திருத்தம் எபிரெய வாக்கியத்தின் அமைப்பை நெருக்கமாகப் பின்பற்றுகிறது: யாவே வழிநடத்திய முழுப் பயணத்தை நினைவுகூருமாறு கூறி, அந்த நடத்துதலின் நோக்கங்களாகத் தாழ்த்துதல், சோதித்தல், மற்றும் உள்ளத்தின் நிலை/கட்டளைக்குக் கீழ்ப்படிதல் அறியப்படுதல் ஆகியவற்றை வழங்குகிறது. ‘அறிய’ என்ற சொல்லின் இறையியல் அழுத்தம் தணிக்கப்படவில்லை; மாற்றுப் புரிதல் அடிக்குறிப்பில் மட்டுமே தரப்பட்டுள்ளது.'
