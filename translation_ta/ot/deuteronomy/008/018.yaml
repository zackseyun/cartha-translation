revisions:
- from: ஆனால் உன் கடவுளாகிய யாவேவை நினைவில் கொள்; ஏனெனில் செல்வம் ஈட்டுவதற்கான ஆற்றலை உனக்குக் கொடுப்பவர் அவரே. இவ்வாறு, உன் தந்தையருக்கு அவர் ஆணையிட்டுத் தந்த தமது உடன்படிக்கையை இன்று காணப்படுவதுபோல் நிலைநிறுத்துகிறார்.[a][b]
  to: ஆனால், உன் கடவுளாகிய யாவேவை நினைவில் கொள்; ஏனெனில், அவர் உன் தந்தையருக்குச் சத்தியம் செய்து வாக்குறுதி அளித்த தமது உடன்படிக்கையை இன்று இருப்பதுபோல் நிலைநிறுத்துவதற்காக, செல்வம் ஈட்ட[a] உனக்கு ஆற்றலைக் கொடுப்பவர் அவரே. உன் தந்தையருக்கு[b] அவர் சத்தியம் செய்து வாக்குறுதி அளித்த அந்த உடன்படிக்கையை இன்று இருப்பதுபோல்[c] நிலைநிறுத்துகிறார்.
  rationale: 'The text is revised to render the oath verb faithfully and to state the Hebrew purpose clause clearly. To avoid repetition introduced by the initial reordering, the final sentence should instead be read as a single sentence: “ஆனால், உன் கடவுளாகிய யாவேவை நினைவில் கொள்; ஏனெனில், செல்வம் ஈட்ட[a] உனக்கு ஆற்றலைக் கொடுப்பவர் அவரே; அவர் உன் தந்தையருக்குச்[b] சத்தியம் செய்து வாக்குறுதி அளித்த தமது உடன்படிக்கையை இன்று இருப்பதுபோல்[c] நிலைநிறுத்துவதற்காகவே அவ்வாறு கொடுக்கிறார்.” This preserves the source’s emphasis, purpose, oath, and idiom in natural Tamil.'
