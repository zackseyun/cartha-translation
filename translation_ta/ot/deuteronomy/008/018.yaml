base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/008/018.yaml
  text: But you shall remember Yahweh your God[a], for it is he who gives you power to gain wealth, so that he may establish his covenant that he swore to your fathers[c][b], as it is this day.
translation:
  language: ta
  text: ஆனால், உன் கடவுளாகிய யாவேவை நினைவில் கொள்; ஏனெனில், அவர் உன் தந்தையருக்குச் சத்தியம் செய்து வாக்குறுதி அளித்த தமது உடன்படிக்கையை இன்று இருப்பதுபோல் நிலைநிறுத்துவதற்காக, செல்வம் ஈட்ட[a] உனக்கு ஆற்றலைக் கொடுப்பவர் அவரே. உன் தந்தையருக்கு[b] அவர் சத்தியம் செய்து வாக்குறுதி அளித்த அந்த உடன்படிக்கையை இன்று இருப்பதுபோல்[c] நிலைநிறுத்துகிறார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “செல்வம் ஈட்டுதல்” என்பதற்கு “வளம் உண்டாக்குதல்” அல்லது, விரிவாக, “வெற்றி அடைதல்” என்றும் பொருள் கொள்ளலாம்.
    reason: lexical_alternative
  - marker: b
    text: “உன் தந்தையர்” என்பது உடன்படிக்கை வாக்குறுதியைப் பெற்ற பிதாக்களான ஆபிரகாம், ஈசாக்கு, யாக்கோபு ஆகியோரைச் சிறப்பாகக் குறிக்கிறது.
    reason: cultural_note
  - marker: c
    text: “இன்று இருப்பதுபோல்” என்பது எபிரெய மரபுத்தொடர்; “இன்றைய நிலையே அதற்குச் சான்றாக இருப்பதுபோல்” எனப் பொருள்படும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזָכַרְתָּ
  choice: ஆனால் ... நினைவில் கொள்
  rationale: முந்தைய வசனத்தில் தன் ஆற்றலுக்குப் பெருமை பாராட்டுவதை எச்சரித்ததற்கு எதிர்மாற்றாக וְ־ஐ ‘ஆனால்’ எனவும், அறிவுறுத்தல் சூழலில் கட்டளை வலிமையுடைய வினையை இயல்பான தமிழ் கட்டளையாகவும் வழங்குகிறது.
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: உன் கடவுளாகிய யாவேவை
  rationale: திருப்பெயரான יהוה என்பதை ‘யாவே’ என ஒலிபெயர்த்து, אֱלֹהֶיךָ என்பதிலுள்ள உடன்படிக்கை உறவைக் ‘உன் கடவுள்’ என்று காக்கிறது.
- source_word: כִּי הוּא הַנֹּתֵן לְךָ
  choice: ஏனெனில் ... உனக்குக் கொடுப்பவர் அவரே
  rationale: כִּי காரணத்தை அறிமுகப்படுத்துகிறது; தனியே இடம்பெறும் הוּא தரும் அழுத்தத்தை ‘அவரே’ காக்கிறது; பெயரெச்ச வினை தொடர்ச்சியான அல்லது இயல்பான செயலைக் குறிக்கிறது.
- source_word: כֹּחַ לַעֲשׂוֹת חָיִל
  choice: செல்வம் ஈட்டுவதற்கான ஆற்றல்
  rationale: வசனம் 17-இன் செல்வச் சூழலில் חָיִל என்பதற்கு ‘செல்வம்’ பொருத்தமானது; עשה חָיִל என்ற சொற்றொடரை இயல்பாக ‘செல்வம் ஈட்டுதல்’ என்றும் כֹּחַ என்பதை ‘ஆற்றல்’ என்றும் வழங்குகிறது.
- source_word: לְמַעַן הָקִים אֶת בְּרִיתוֹ
  choice: இவ்வாறு ... தமது உடன்படிக்கையை ... நிலைநிறுத்துகிறார்
  rationale: לְמַעַן நோக்கம் அல்லது விளைவைச் சுட்டலாம்; ‘இவ்வாறு’ அந்தத் தொடர்பைத் திறந்த நிலையில் வைக்கிறது. הָקִים என்பது உடன்படிக்கையை வரலாற்றில் நடைமுறையாக்கி உறுதியாக நிலைநிறுத்துவதைக் குறிக்கிறது.
- source_word: אֲשֶׁר נִשְׁבַּע לַאֲבֹתֶיךָ
  choice: உன் தந்தையருக்கு அவர் ஆணையிட்டுத் தந்த
  rationale: נשבע என்பதின் சத்தியம் செய்து உறுதியளிக்கும் வலிமையை ‘ஆணையிட்டுத் தந்த’ காக்கிறது; אֲבֹתֶיךָ என்பது பொதுவான முன்னோர்களை மட்டுமல்ல, உடன்படிக்கைப் பிதாக்களைச் சுட்டுவதால் ‘தந்தையர்’ பயன்படுத்தப்படுகிறது.
- source_word: כַּיּוֹם הַזֶּה
  choice: இன்று காணப்படுவதுபோல்
  rationale: ‘இந்த நாளைப்போல்’ என்ற எபிரெய மரபுத்தொடரின் கருத்தான, தற்போதைய நிலை சான்றாகத் தென்படுவதை இயல்பான தமிழில் தெரிவிக்கிறது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரின் மொழியாக்கம்
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூலத்தில் பட்டப்பெயர் அல்லாமல் தனிப்பட்ட உடன்படிக்கைப் பெயர் இருப்பதால் அதை ஒலிபெயர்க்கிறது.
- issue: חָיִל என்பதன் பொருள்
  choice: செல்வம்
  alternative: வெற்றி அல்லது வளம்
  rationale: உடனடி சூழலில் மந்தைகள், வெள்ளி, பொன், சொத்துகள் மற்றும் ‘இந்தச் செல்வத்தை எனக்காக ஈட்டினேன்’ என்ற வசனம் 17-இன் எண்ணம் உள்ளதால் பொருளாதாரப் பொருள் முதன்மையானது; சொல்லின் விரிவான பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- issue: לְמַעַן என்பதிலுள்ள நோக்கம்/விளைவு உறவு
  choice: இவ்வாறு
  alternative: அதற்காக / நிலைநிறுத்தும்படியாக
  rationale: இறைவன் ஆற்றல் கொடுப்பதன் நோக்கத்தை மட்டும் கடுமையாக நிர்ணயிக்காமல், அதனால் உடன்படிக்கை நிலைநிறுத்தப்படுவதையும் உள்ளடக்கும் மூலத்தின் நோக்கம்-விளைவு நெகிழ்வைக் காக்கிறது.
- issue: הָקִים בְּרִיתוֹ என்பதன் உடன்படிக்கை சார்ந்த நுட்பம்
  choice: தமது உடன்படிக்கையை நிலைநிறுத்துகிறார்
  alternative: தமது உடன்படிக்கையை உறுதிப்படுத்துகிறார்
  rationale: உடன்படிக்கை முன்பு இல்லாதது போல உருவாக்குதல் என்ற பொருளைத் தவிர்த்து, சத்தியமாகக் கொடுத்த உடன்படிக்கையை வரலாற்றில் செயலாக்கி நிறைவேற்றுவதை ‘நிலைநிறுத்துதல்’ வெளிப்படுத்துகிறது.
- issue: אֲבֹתֶיךָ என்பதன் குறிப்பு
  choice: உன் தந்தையர்
  alternative: உன் முன்னோர்
  rationale: இங்கு பொதுவான எல்லா முன்னோர்களையும் விட ஆபிரகாம், ஈசாக்கு, யாக்கோபு ஆகிய உடன்படிக்கைப் பிதாக்கள் குறிப்பாகக் கருதப்படுவதால் மூலத்தின் ஆண்பால் பன்மையையும் தனிச்சுட்டையும் காக்கிறது.
translation_notes:
  register: நவீனச் செந்தமிழ் சார்ந்த, பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. ஒருமை இரண்டாம் நபரான இஸ்ரவேலை நோக்கிய உரை ‘உன்’ என்று காக்கப்பட்டுள்ளது. ‘யாவே’, ‘உடன்படிக்கை’, ‘நிலைநிறுத்து’ ஆகியவை வேதாகமச் சூழலுக்கேற்ற தெளிவான சொற்கள். வசனத்தில் உள்ள இரு அடிக்குறிப்பு குறிகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
