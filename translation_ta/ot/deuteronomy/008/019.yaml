  text: וְ/הָיָ֗ה אִם שָׁכֹ֤חַ תִּשְׁכַּח֙ אֶת יְהוָ֣ה אֱלֹהֶ֔י/ךָ וְ/הָֽלַכְתָּ֗ אַחֲרֵי֙ אֱלֹהִ֣ים אֲחֵרִ֔ים וַ/עֲבַדְתָּ֖/ם וְ/הִשְׁתַּחֲוִ֣יתָ לָ/הֶ֑ם הַעִדֹ֤תִי בָ/כֶם֙ הַ/יּ֔וֹם כִּ֥י אָבֹ֖ד תֹּאבֵדֽוּ/ן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/008/019.yaml
  text: And if you indeed forget Yahweh your God and go after other gods and serve them and bow down to them[a], I testify against you today that you will surely perish.
translation:
  language: ta
  text: நீ உன் கடவுளாகிய யாவேவை நிச்சயமாக மறந்து, வேறு தெய்வங்களைப் பின்சென்று, அவற்றுக்குச் சேவை செய்து, அவற்றுக்கு முன் விழுந்து வணங்கினால், நீங்கள் நிச்சயமாக அழிந்துபோவீர்கள் என்று இன்று உங்களுக்கு எதிராகச் சாட்சியிடுகிறேன்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் “மறத்தல்” என்னும் வினைச்சொல் வலியுறுத்தலுக்காக இருமுறை அமைந்துள்ளது; அதனால் “நிச்சயமாக மறந்து” அல்லது “உண்மையிலேயே மறந்து” எனப் பொருள்படும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה אִם
  choice: …பணிந்தால்
  rationale: எபிரெய நிபந்தனைத் தொடர் தமிழில் இயல்பாக வாக்கியத்தின் நிபந்தனைப் பகுதியின் முடிவில் ‘-ஆல்’ வடிவில் வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: שָׁכֹחַ תִּשְׁכַּח
  choice: உண்மையிலேயே மறந்து
  rationale: முற்றுவினையுடன் வரும் வினையெச்சப் பெயரின் வலியுறுத்தலை இயல்பான தமிழில் காட்டுகிறது; ‘முழுமையாக’ என்று பொருளை அளவுக்கு மீறிக் குறிப்பாக்கவில்லை.
- source_word: יְהוָה
  choice: யாவே
  rationale: திருநாமத்தை பொதுப்பட்டமான ‘ஆண்டவர்’ என்று மாற்றாமல், மூலத்தில் உள்ள உடன்படிக்கைப் பெயராகவே ஒலிபெயர்க்கிறது.
- source_word: אֱלֹהֶיךָ
  choice: உங்கள் கடவுள்
  rationale: இரண்டாம் நபர் ஒருமை உருபுடைய அமைப்பைத் தமிழில் மரியாதை/கூட்டுப்பொருள் கொண்ட இயல்பான ‘உங்கள் கடவுள்’ என வழங்குகிறது.
- source_word: וְהָלַכְתָּ אַחֲרֵי
  choice: பின்பற்றிச் சென்று
  rationale: ஒருவரின் பின்னால் செல்வது என்ற உருவகத்தையும் விசுவாசப் பற்றை மாற்றும் கருத்தையும் காக்கிறது.
- source_word: אֱלֹהִים אֲחֵרִים
  choice: வேறு தெய்வங்கள்
  rationale: ‘அந்நிய’ என்று விளக்கமாக்காமல் ‘வேறு’ என்ற நேரடிப் பொருளைக் காக்கிறது.
- source_word: וַעֲבַדְתָּם
  choice: அவற்றுக்குப் பணிசெய்து
  rationale: עבד என்பதன் ‘சேவை/பணி செய்தல்’ என்ற தனிப்பொருளைக் காக்கிறது; அடுத்துள்ள பணிந்து வணங்கும் செயலில் இதைக் கலக்கவில்லை.
- source_word: וְהִשְׁתַּחֲוִיתָ לָהֶם
  choice: அவற்றுக்கு முன் விழுந்து பணிந்தால்
  rationale: தரையில் விழுந்து அல்லது குனிந்து மரியாதை செலுத்தும் உடல் செயலையும் அதன் வழிபாட்டுப் பொருளையும் வெளிப்படுத்துகிறது.
- source_word: הַעִדֹתִי בָכֶם הַיּוֹם
  choice: இன்று உங்களுக்கு எதிராகச் சாட்சியிடுகிறேன்
  rationale: சட்ட/உடன்படிக்கைச் சூழலில் உள்ள எதிர்மறைச் சாட்சியின் வலிமையைக் காக்கிறது; மூலத்தில் இல்லாத சாட்சிகளைச் சேர்க்கவில்லை.
- source_word: כִּי אָבֹד תֹּאבֵדוּן
  choice: நீங்கள் நிச்சயமாக அழிந்துபோவீர்கள் என்று
  rationale: வினையெச்சப் பெயர்–முற்றுவினை இணைப்பின் உறுதியான வலியுறுத்தலை ‘நிச்சயமாக’ என்பதால் வெளிப்படுத்துகிறது; செயப்பாட்டு வடிவைத் தேவையின்றி புகுத்தவில்லை.
theological_decisions:
- issue: יְהוָה என்ற திருநாமத்தை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: ஆண்டவர் / யெகோவா
  rationale: மூல எபிரெய உரை நான்கு எழுத்துத் திருநாமத்தை நேரடியாகப் பயன்படுத்துவதால், பொதுப்பட்டமாக மாற்றாமல் ‘யாவே’ என ஒலிபெயர்க்கப்பட்டுள்ளது.
- issue: ‘வேறு தெய்வங்கள்’ குறித்த வினைச்சொற்களின் வேறுபாடு
  choice: பணிசெய்து; முன் விழுந்து பணிந்து
  alternative: இரண்டையும் ‘வழிபட்டு’ என ஒரே சொல்லால் வழங்குதல்
  rationale: עבד மற்றும் השתחוה ஆகியவை சேவை செய்தல், விழுந்து பணிதல் என்ற தொடர்புடைய ஆனால் வேறுபட்ட செயல்களைச் சுட்டுகின்றன; மூலத்தின் அடுக்கைத் தக்கவைத்துள்ளது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் மரியாதையான நடையில் அமைக்கப்பட்டது. எபிரெயத்தில் இஸ்ரவேலை நோக்கிய ஒருமை முகவரி இறுதியில் பன்மையாக மாறுகிறது; தமிழின் ‘நீங்கள்/உங்கள்’ வடிவங்கள் எண்ணிக்கையைத் தீர்மானிக்காமல் அந்தக் கூட்டு முகவரியை இயல்பாகத் தாங்குகின்றன.
