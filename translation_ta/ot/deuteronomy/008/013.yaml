  source_fidelity: 'மூல எபிரெயத்தின் மூன்று படிநிலைத் தொடரும் நன்றாகப் பாதுகாக்கப்பட்டுள்ளது: மாட்டினம் மற்றும் சிறுகால்நடைகள் பெருகுதல், வெள்ளி-பொன் பெருகுதல், ஒருவருக்குள்ள அனைத்தும் பெருகுதல். וְכֶסֶף וְזָהָב உடன் வரும் לָךְ-ஐ “உனக்குப் பெருகி” என வெளிப்படுத்துவது உரைக்கு உண்மையானது. இறுதி יִרְבֶּה, முந்திய வசனங்களிலிருந்து தொடரும் நிபந்தனைச் சூழலில் “பெருகும்போது” என வழங்கப்பட்டிருப்பதும் பொருத்தமானது.'
  naturalness: “உன் மாடுகளும் ஆடுமந்தைகளும் பெருகி, வெள்ளியும் பொன்னும் உனக்குப் பெருகி, உனக்குள்ள அனைத்தும் பெருகும்போது—” என்பது நவீன நிலையான தமிழில் தெளிவாகவும் இயல்பாகவும் உள்ளது. மீண்டும் வரும் “பெருகி/பெருகும்போது” மூலத்தின் வினை மீளுரையைச் சரியாகக் காக்கிறது.
  terminology: “மாடுகள்” என்பது בקר-க்கு ஏற்ற இயல்பான கூட்டுப் பயன்பாடு. “ஆடுமந்தைகள்” צאן-இன் கூட்டுத் தன்மையைப் பாதுகாக்கிறது; செம்மறியாடுகளையும் வெள்ளாடுகளையும் தனித்தனியாகக் குறிப்பிடாத மூலத்தின் பொதுமையையும் மீறுவதில்லை. “வெள்ளி,” “பொன்,” மற்றும் “உனக்குள்ள அனைத்தும்” ஆகியவை துல்லியமானவை.
