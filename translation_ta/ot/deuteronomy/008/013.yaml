translation_notes:
  register: நவீன நிலையான தமிழில், ஒருமை முன்னிலையில் பேசப்படும் உரைநடையைப் பேணியுள்ளோம். கால்நடை, செல்வம், மொத்த உடைமைகள் என்ற மூலத்தின் படிப்படியான அமைப்பும் ‘பெருகு’ என்ற மீளுரையும் காக்கப்பட்டுள்ளன. இறுதியிலுள்ள நீண்ட கோடு, அடுத்த வசனத்திற்குத் தொடரும் முடிவுறாத எச்சரிக்கை வாக்கியத்தைச் சுட்டுகிறது.
