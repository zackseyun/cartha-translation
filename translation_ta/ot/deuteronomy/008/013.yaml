  text: and your herds and your flocks multiply[a], and silver and gold increase for you[b], and all that is yours increases—
translation:
  language: ta
  text: உன் மாடுகளும் ஆடுமந்தைகளும் பெருகி, வெள்ளியும் பொன்னும் உனக்குப் பெருகி, உனக்குள்ள அனைத்தும் பெருகும்போது—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְקָרְךָ
  choice: உன் மாடுகளும்
  rationale: בקר என்பது கூட்டாகக் குறிப்பிடப்படும் மாட்டினத்தைக் குறிக்கிறது. ‘மாடுகள்’ என்பது நவீன தமிழில் இயல்பானதும், அடுத்துவரும் சிறுகால்நடைகளிலிருந்து இதைத் தெளிவாக வேறுபடுத்துவதுமாகும்.
- source_word: וְצֹאנְךָ
  choice: ஆடுமந்தைகளும்
  rationale: צאן என்பது முக்கியமாகச் செம்மறியாடுகளையும் வெள்ளாடுகளையும் உள்ளடக்கிய சிறுகால்நடைகளைக் குறிக்கும் கூட்டுப்பெயர். ‘ஆடுமந்தைகள்’ அந்தக் கூட்டுப்பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: יִרְבְּיוּן
  choice: பெருகி
  rationale: רבה என்பதன் இவ்வடிவம் எண்ணிக்கையில் பெருகுவதைக் குறிக்கிறது; கால்நடைகளைப் பற்றிய சூழலில் ‘பெருகி’ இயல்பாக உள்ளது.
- source_word: וְכֶסֶף וְזָהָב
  choice: வெள்ளியும் பொன்னும்
  rationale: எபிரெய உரை இந்த விலைமதிப்புள்ள உலோகங்களை உடைமைப் பெயர்ச்சொல் சேர்க்காமல் நேரடியாகக் குறிப்பிடுகிறது.
- source_word: יִרְבֶּה לָּךְ
  choice: உனக்குப் பெருகி
  rationale: לָךְ என்ற பயன்நிலைத் தொடரை வெளிப்படையாகப் பேணுகிறது; அதேவேளையில் மூலத்தில் இல்லாத உடைமைப் பெயர்ச்சொல்லை ‘வெள்ளியும் பொன்னும்’ என்பதோடு சேர்ப்பதில்லை.
- source_word: וְכֹל אֲשֶׁר לְךָ
  choice: உனக்குள்ள அனைத்தும்
  rationale: இந்தச் சொற்றொடர் ஒருவருடைய மொத்த உடைமைகளையும் சுருக்கமாகக் குறிக்கிறது. ‘உனக்குள்ள அனைத்தும்’ சுருக்கமாகவும் இயல்பாகவும் உள்ளது.
- source_word: יִרְבֶּה
  choice: பெருகும்போது
  rationale: רבה என்பதன் பொருளான அதிகரிப்பைத் தருகிறது. வசனம் 12 முதல் தொடரும் எச்சரிக்கை வாக்கியத்தின் சூழலை வெளிப்படுத்த ‘-போது’ என்ற தொடரமைப்பு பயன்படுத்தப்பட்டுள்ளது.
