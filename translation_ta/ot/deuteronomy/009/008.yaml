source:
  edition: WLC
  text: וּ/בְ/חֹרֵ֥ב הִקְצַפְתֶּ֖ם אֶת יְהוָ֑ה וַ/יִּתְאַנַּ֧ף יְהוָ֛ה בָּ/כֶ֖ם לְ/הַשְׁמִ֥יד אֶתְ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/008.yaml
  text: Even at Horeb you provoked Yahweh to wrath[b][a], and Yahweh was angry with you enough to destroy you.
translation:
  language: ta
  text: ஓரேபில்கூட[a] நீங்கள் யாவேக்குக் கடுஞ்சினம் மூட்டினீர்கள்; உங்களை அழித்துவிடும் அளவுக்கு[b] யாவே உங்கள்மேல் கோபங்கொண்டார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ஓரேபில்’ அல்லது ‘ஓரேபிலும்’ என்றும் மொழிபெயர்க்கலாம். எபிரேய இணைப்பிடைச்சொல் உரையை மட்டும் தொடரக்கூடும்; இங்கே அது வலியுறுத்துவதாகவும் இருக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘யாவே உங்கள்மேல் கோபங்கொண்டு உங்களை அழிக்க இருந்தார்’ அல்லது ‘உங்களை அழிப்பதற்காக யாவே உங்கள்மேல் கோபங்கொண்டார்’ என்றும் மொழிபெயர்க்கலாம். எபிரேயத்தில் யாவேயின் கோபம், அழிவின் அச்சுறுத்தலுடன் நேரடியாக இணைக்கப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְחֹרֵב
  choice: ஓரேபில்கூட
  rationale: இணைப்பிடைச்சொல் முந்தைய உரையைத் தொடர்வதோடு, இச்சூழலில் வலியுறுத்தலையும் தருகிறது. ‘ஓரேபில்கூட’ என்பது அந்த வலியுறுத்தலை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: הִקְצַפְתֶּם
  choice: கடுஞ்சினம் மூட்டினீர்கள்
  rationale: קצף என்பதன் ஹிஃபில் வடிவம் ஒருவரைக் கோபமடையச் செய்தல் அல்லது கடுஞ்சினத்துக்குத் தூண்டுதல் என்ற காரணவினைப் பொருளைக் கொண்டது. இந்தத் தேர்வு அந்தக் காரணவினை வலிமையைப் பாதுகாக்கிறது.
- source_word: אֶת יְהוָה
  choice: யாவே
  rationale: எபிரேய மூலத்தில் வரும் உடன்படிக்கைப் பெயரான יהוה, பொதுப்பட்டப்பெயராக மாற்றப்படாமல் ‘யாவே’ என்று ஒலிபெயர்க்கப்படுகிறது.
- source_word: וַיִּתְאַנַּף
  choice: கோபங்கொண்டார்
  rationale: אנף வலுவான கோபத்தைக் குறிக்கிறது. தொடர்ந்து வரும் அழித்தல் என்னும் விளைவு அல்லது நோக்கத்துடன் இணைக்கும்போது, தமிழில் ‘அழித்துவிடும் அளவுக்கு … கோபங்கொண்டார்’ என்பது பொருளுறவை இயல்பாகக் காட்டுகிறது.
- source_word: בָּכֶם
  choice: உங்கள்மேல்
  rationale: கோபத்தின் இலக்கைத் தமிழில் இயல்பாகவும் தெளிவாகவும் ‘உங்கள்மேல்’ வெளிப்படுத்துகிறது.
- source_word: לְהַשְׁמִיד אֶתְכֶם
  choice: உங்களை அழித்துவிடும்
  rationale: שׁמד என்பதன் ஹிஃபில் வடிவம் முழுமையாக அழித்தல் அல்லது ஒழித்தல் என்ற வலுவான பொருளைக் கொண்டது. ‘அழித்துவிடும்’ என்பது பேச்சுவழக்காகத் தாழாமல் அந்த வலிமையைத் தருகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூலவசனம் இறைவனின் தனிப்பட்ட உடன்படிக்கைப் பெயரையே பயன்படுத்துகிறது. அதை ஒரு பொதுப்பட்டப்பெயரால் மாற்றாமல் ஒலிபெயர்ப்பது மூலத்தின் தனித்தன்மையைப் பாதுகாக்கிறது.
- issue: இறைக் கோபத்துக்கும் அழித்தலுக்கும் உள்ள தொடர்பு
  choice: உங்களை அழித்துவிடும் அளவுக்கு … கோபங்கொண்டார்
  alternative: உங்களை அழிப்பதற்காக … கோபங்கொண்டார்
  rationale: לְ தொடங்கும் வினையெச்சம் நோக்கம் அல்லது விளைவு என இருவகையில் புரிந்துகொள்ளப்படலாம். முதன்மை உரை கோபத்தின் தீவிரத்தையும் அழிவு அச்சுறுத்தலுடனான நேரடித் தொடர்பையும் காட்டுகிறது; அடிக்குறிப்பு மாற்று அமைப்புகளையும் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் வேதவாக்கியத்திற்கேற்ற கண்ணியமான நடையிலும் மொழிபெயர்க்கப்பட்டுள்ளது. ‘கடுஞ்சினம் மூட்டினீர்கள்’ காரணவினையையும், ‘உங்கள்மேல் கோபங்கொண்டார்’ இறைக் கோபத்தின் இலக்கையும் தெளிவுபடுத்துகிறது.
