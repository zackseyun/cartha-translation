  text: וָֽ/אֶתְנַפַּל֩ לִ/פְנֵ֨י יְהוָ֜ה כָּ/רִאשֹׁנָ֗ה אַרְבָּעִ֥ים יוֹם֙ וְ/אַרְבָּעִ֣ים לַ֔יְלָה לֶ֚חֶם לֹ֣א אָכַ֔לְתִּי וּ/מַ֖יִם לֹ֣א שָׁתִ֑יתִי עַ֤ל כָּל חַטַּאתְ/כֶם֙ אֲשֶׁ֣ר חֲטָאתֶ֔ם לַ/עֲשׂ֥וֹת הָ/רַ֛ע בְּ/עֵינֵ֥י יְהוָ֖ה לְ/הַכְעִיסֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/018.yaml
  text: Then I fell down before Yahweh[a], as at the first, forty days and forty nights; I ate no bread and drank no water, because of all your sin that you had committed by doing what was evil in the sight of Yahweh, provoking him to anger.
translation:
  language: ta
  text: பின்பு, முன்புபோலவே[a] நான் யாவேக்கு முன்பாக விழுந்து வணங்கினேன். நாற்பது பகலும் நாற்பது இரவும் நான் அப்பம் உண்ணவில்லை; தண்ணீரும் குடிக்கவில்லை. யாவேயின் பார்வையில் தீமையானதைச் செய்து அவருக்குக் கோபமூட்டின உங்கள் எல்லாப் பாவங்களினாலும் இப்படிச் செய்தேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘முதலில் செய்ததுபோல’ அல்லது ‘முன்னர்போல’ என்றும் மொழிபெயர்க்கலாம். இந்த எபிரெயச் சொற்றொடர், மோசே முன்பு யாவேக்கு முன்பாக இருந்த நாற்பது நாள் காலத்தைச் சுட்டுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶתְנַפַּל
  choice: விழுந்து கிடந்தேன்
  rationale: התנפל இங்கு மோசே யாவேயின் முன் தன்னைத் தாழ்த்தி விழுந்த நிலையில் வேண்டுதல் செய்ததைக் குறிக்கிறது. ‘விழுந்து கிடந்தேன்’ உடல் நிலையையும் நீடித்த செயற்பாட்டையும் இயல்பான தமிழில் காட்டுகிறது; தொடக்கத்திலுள்ள ‘பின்பு’ தொடர் நிகழ்வைக் குறிக்கும் ו־ஐ வெளிப்படுத்துகிறது.
- source_word: לִפְנֵי יְהוָה
  choice: யாவேயின் திருமுன்
  rationale: לִפְנֵי என்பது ‘முன்/சந்நிதியில்’ என்ற இட-உறவுப் பொருளுடையது. ‘திருமுன்’ நவீனத் தமிழில் மரியாதையுடனும் இயல்பாகவும் உள்ளது; יְהוָה உடன்படிக்கைப் பெயராக ‘யாவே’ என ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: כָּרִאשֹׁנָה
  choice: முன்பு செய்ததுபோலவே
  rationale: இந்த ஒப்பீட்டுச் சொற்றொடர் மோசேயின் முந்தைய நாற்பது நாள் காலத்தைத் திரும்பச் சுட்டுகிறது. செயலை வெளிப்படையாகச் சேர்ப்பது தமிழில் தெளிவாக இருக்கிறது; ‘போலவே’ ஒப்பீட்டு வலிமையைப் பாதுகாக்கிறது.
- source_word: אַרְבָּעִים יוֹם וְאַרְבָּעִים לַיְלָה
  choice: நாற்பது பகலும் நாற்பது இரவும்
  rationale: கால அளவை நேரடியாகவும் இயல்பான தமிழ் இணைப்புடனும் வழங்குகிறது.
- source_word: לֶחֶם לֹא אָכַלְתִּי
  choice: நான் அப்பம் உண்ணவில்லை
  rationale: எபிரெயச் சொல் பொதுவான ‘உணவு’ அல்ல, குறிப்பாக ‘அப்பம்’ என்று கூறுவதால் அந்தச் சொற்பொருள் பாதுகாக்கப்படுகிறது.
- source_word: וּמַיִם לֹא שָׁתִיתִי
  choice: தண்ணீரும் குடிக்கவில்லை
  rationale: முந்தைய எதிர்மறை வாக்கியத்துடன் இயல்பாக இணைத்து, மூலத்தின் நேரடிப் பொருளைப் பாதுகாக்கிறது.
- source_word: עַל כָּל חַטַּאתְכֶם
  choice: உங்கள் பாவம் அனைத்தினிமித்தமும்
  rationale: עַל இங்கு மோசேயின் விழுந்துகிடத்தலுக்கும் நோன்புக்கும் காரணத்தைத் தருகிறது. חַטָּאת ஒருமையில் இருந்தாலும் தொகுப்புப் பொருள் கொண்டதால், செயற்கையான பன்மையைத் தவிர்த்து ‘பாவம் அனைத்தும்’ என வழங்கப்பட்டுள்ளது.
- source_word: אֲשֶׁר חֲטָאתֶם
  choice: நீங்கள் ... செய்த
  rationale: பாவம் ஏற்கெனவே நிகழ்ந்ததைத் தமிழில் சுருக்கமாகவும் இயல்பாகவும் காட்டுகிறது.
- source_word: לַעֲשׂוֹת הָרַע
  choice: தீமையானதைச் செய்து
  rationale: மக்களின் பாவத்தின் தன்மை அல்லது முறையைத் தெரிவிக்கும் infinitive அமைப்பை இயல்பான வினையெச்சமாக வழங்குகிறது.
- source_word: בְּעֵינֵי יְהוָה
  choice: யாவேயின் பார்வையில்
  rationale: இது கடவுளுடைய மதிப்பீட்டைக் குறிக்கும் எபிரெய மரபுத்தொடர். ‘பார்வையில்’ அதன் உருவகத்தையும் இயல்பான தமிழையும் காக்கிறது.
- source_word: לְהַכְעִיסוֹ
  choice: அவருக்குக் கோபமூட்டிய
  rationale: כעס என்பதன் causative வடிவம் ‘கோபமடையச் செய்தல்’ என்ற பொருளைக் கொண்டது. இத்தேர்வு அதன் காரணவினைப் பொருளைக் காக்கிறது; நோக்கம் அல்லது விளைவு என்ற நுணுக்கத்தை மிகையாகத் தீர்மானிக்கவில்லை.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை வழங்குதல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலவசனத்தில் நான்கு எழுத்து உடன்படிக்கைப் பெயர் நேரடியாக உள்ளது. பட்டப்பெயராக மாற்றாமல், அதன் பொதுவாக ஏற்றுக்கொள்ளப்படும் உச்சரிப்பைத் தமிழில் ‘யாவே’ என ஒலிபெயர்ப்பது பெயரின் தனித்துவத்தைப் பாதுகாக்கிறது.
- issue: לְהַכְעִיסוֹ என்பதிலுள்ள நோக்கம்/விளைவு நுணுக்கம்
  choice: அவருக்குக் கோபமூட்டிய
  alternative: அவருக்குக் கோபமூட்டுவதற்காக
  rationale: எபிரெய infinitive நோக்கத்தையோ விளைவையோ சுட்டக்கூடும். இஸ்ரயேலர் திட்டமிட்டே கடவுளைக் கோபப்படுத்த முயன்றார்கள் என்று உறுதியாக்காமல், காரணவினைப் பொருளை மட்டும் மொழிபெயர்க்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளக்கூடிய மரியாதைமிக்க நடையைப் பயன்படுத்துகிறது. ‘திருமுன்’ உயர்நடையை அளித்தாலும் வழக்கில் புரியத்தக்கது; ‘அப்பம்’ மூலத்தின் குறிப்பிட்ட சொல்லை காக்கிறது. காரணத்தை இறுதியில் வைத்து ‘இப்படிச் செய்தேன்’ எனச் சேர்த்தது நீண்ட எபிரெய வாக்கியத்தைத் தமிழில் தெளிவாக்குகிறது; புதிய கருத்தைச் சேர்ப்பதில்லை.
