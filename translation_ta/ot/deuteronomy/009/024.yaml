revisions:
- from: நான் உங்களை அறிந்த நாள்முதல், நீங்கள் யாவேக்கு எதிராக[a]க் கலகம் செய்துகொண்டே வந்திருக்கிறீர்கள்.
  to: நான் உங்களை அறிந்த நாள்முதல், நீங்கள் யாவேக்கு எதிராக[a]க் கலகக்காரர்களாக இருந்திருக்கிறீர்கள்.
  rationale: The revision retains the source’s retrospective force (“இருந்திருக்கிறீர்கள்”) and its characterization of Israel as rebellious, while avoiding the added explicit sense that they were continually performing acts of rebellion. The rendering of the divine name, the contextual sense “எதிராக,” and the literal-form footnote are retained.
