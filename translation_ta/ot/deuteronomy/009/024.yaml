  text: מַמְרִ֥ים הֱיִיתֶ֖ם עִם יְהוָ֑ה מִ/יּ֖וֹם דַּעְתִּ֥/י אֶתְ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/024.yaml
  text: You have been rebellious against Yahweh from the day I knew you[a].
translation:
  language: ta
  text: நான் உங்களை அறிந்த நாள்முதல், நீங்கள் யாவேக்கு எதிராக[a]க் கலகக்காரர்களாக இருந்திருக்கிறீர்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொற்சொல்லாக, “யாவேயுடன்”; இங்கு அந்தச் சொற்றொடர் அவரை எதிர்ப்பதைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַמְרִים
  choice: கலகம் செய்துகொண்டே
  rationale: מרה என்பது அதிகாரத்தை எதிர்த்தல் அல்லது கலகம் செய்தல் என்பதைக் குறிக்கிறது. הֱיִיתֶם என்பதுடன் சேர்ந்து, இஸ்ரவேலரின் தொடர்ந்து காணப்பட்ட கலகப் போக்கை இச்சொற்றொடர் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: הֱיִיתֶם
  choice: வந்திருக்கிறீர்கள்
  rationale: היה வினையின் இரண்டாம் நபர் ஆண்பால் பன்மை நிறைவுவடிவம் இது. கடந்த காலத்தில் தொடங்கி மோசே பேசும் காலம்வரை நீடித்த நிலையைத் தமிழில் பின்னோக்கிச் சுருக்கமாகக் காட்டுகிறது.
- source_word: עִם
  choice: எதிராக
  rationale: இதன் அடிப்படைப் பொருள் ‘உடன்’ என்றாலும், מרה என்பதுடன் இங்கு எதிர்ப்பு உறவைக் குறிக்கிறது. எனவே தமிழில் ‘எதிராக’ என்பது சூழலுக்கேற்ற இயல்பான மொழிபெயர்ப்பு; நேரடியான வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இது தேவனுடைய தனிப்பெயரான நான்கெழுத்துப் பெயர். அதை ஒரு பட்டப்பெயரால் மாற்றாமல், தமிழில் வழக்கமான ஒலிபெயர்ப்பாக ‘யாவே’ என்று வழங்குகிறது.
- source_word: מִיּוֹם
  choice: நாள்முதல்
  rationale: குற்றச்சாட்டில் கூறப்படும் நடத்தை தொடங்கிய காலப்புள்ளியை நெருக்கமாகவும் இயல்பாகவும் குறிக்கிறது.
- source_word: דַּעְתִּי
  choice: நான் அறிந்த
  rationale: ידע வினையின் முதல் நபர் ஒருமை நிறைவுவடிவம். இங்கு வெறும் அறிவாற்றலை அல்ல, மோசே இஸ்ரவேலரை அறிமுகமாக அறிந்திருந்த காலத்தைச் சுட்டுகிறது; மூலத்தின் சுருக்கத்தையும் தெளிவின்மையையும் காக்க ‘அறிந்த’ என மொழிபெயர்க்கப்படுகிறது.
- source_word: אֶתְכֶם
  choice: உங்களை
  rationale: நேரடிச் செயப்படுபொருள் குறியீட்டுடன் இணைந்த இரண்டாம் நபர் பன்மை பின்னொட்டு; தமிழில் ‘உங்களை’ என நேரடியாக வழங்கப்படுகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை வழங்குதல்
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூல எபிரெய உரையில் தனிப்பெயர் நேரடியாக வருகிறது. அதனைப் பட்டப்பெயரால் மாற்றாமல் ஒலிபெயர்ப்பது உடன்படிக்கைப் பெயரை வெளிப்படையாகப் பாதுகாக்கிறது.
- issue: עִם என்பதன் உறவுப்பொருள்
  choice: எதிராக
  alternative: உடன்
  rationale: מַמְרִים என்பதுடன் ‘உடன்’ என்பது ஒருமைப்பாட்டை அல்ல, யாவேக்கு எதிரான எதிர்ப்பைக் குறிக்கும் எபிரெய மொழிவழக்கு. வாசகருக்குப் பொருள் தெளிவாக ‘எதிராக’ என வழங்கி, சொற்சொல் வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் மதிப்புடனும் அமைக்கப்பட்டுள்ளது. ‘செய்துகொண்டே வந்திருக்கிறீர்கள்’ என்பது மோசே அறிந்த தொடக்ககாலத்திலிருந்து உரையாடல் நிகழும் காலம்வரை நீடித்த கலகப் போக்கை எடுத்துரைக்கிறது.
