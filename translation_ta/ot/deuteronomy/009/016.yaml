revisions:
- from: நான் பார்த்தபோது, இதோ, நீங்கள் உங்கள் கடவுளாகிய யாவேக்கு எதிராகப் பாவம் செய்திருந்தீர்கள். உங்களுக்காக வார்ப்பினால் செய்யப்பட்ட ஒரு கன்றுக்குட்டியை[a] உருவாக்கியிருந்தீர்கள். யாவே உங்களுக்குக் கட்டளையிட்ட வழியிலிருந்து வெகு விரைவாக விலகியிருந்தீர்கள்.
  to: நான் பார்த்தேன்; இதோ, நீங்கள் உங்கள் கடவுளாகிய யாவேக்கு எதிராகப் பாவம் செய்திருந்தீர்கள். உங்களுக்காக உலோகத்தில் வார்க்கப்பட்ட ஒரு கன்றுக்குட்டியைச் செய்திருந்தீர்கள்.[a] யாவே உங்களுக்குக் கட்டளையிட்ட வழியிலிருந்து விரைவாக விலகியிருந்தீர்கள்.
  rationale: The revision removes the added temporal implication in the opening and makes the cast-metal sense explicit in the main text. It retains the retrospective past, the beneficiary force of “உங்களுக்காக,” the divine name Yahweh, and the covenant-path metaphor. The footnote remains anchored to “கன்றுக்குட்டியை” and supplies the legitimate ‘molten’ lexical alternative.
