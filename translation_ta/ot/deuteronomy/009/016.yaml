  text: וָ/אֵ֗רֶא וְ/הִנֵּ֤ה חֲטָאתֶם֙ לַ/יהוָ֣ה אֱלֹֽהֵי/כֶ֔ם עֲשִׂיתֶ֣ם לָ/כֶ֔ם עֵ֖גֶל מַסֵּכָ֑ה סַרְתֶּ֣ם מַהֵ֔ר מִן הַ/דֶּ֕רֶךְ אֲשֶׁר צִוָּ֥ה יְהוָ֖ה אֶתְ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/016.yaml
  text: 'And I looked[a], and behold, you had sinned against Yahweh your God: you had made for yourselves a cast-metal calf. You had turned aside quickly from the way that Yahweh had commanded you.'
translation:
  language: ta
  text: நான் பார்த்தேன்; இதோ, நீங்கள் உங்கள் கடவுளாகிய யாவேக்கு எதிராகப் பாவம் செய்திருந்தீர்கள். உங்களுக்காக உலோகத்தில் வார்க்கப்பட்ட ஒரு கன்றுக்குட்டியைச் செய்திருந்தீர்கள்.[a] யாவே உங்களுக்குக் கட்டளையிட்ட வழியிலிருந்து விரைவாக விலகியிருந்தீர்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘உருக்கிய உலோகத்தால் செய்யப்பட்ட கன்றுக்குட்டி.’ எபிரெயச் சொற்றொடர் உலோகத்தை வார்த்து செய்யப்பட்ட கன்றுக்குட்டியைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֵרֶא וְהִנֵּה
  choice: நான் பார்த்தபோது, இதோ
  rationale: ראה என்பதன் பார்வையிடும் செயலும் הִנֵּה என்பதன் கவன ஈர்ப்பும் இயல்பான, கண்ணியமான தமிழில் தனித்தனியாகப் பாதுகாக்கப்படுகின்றன.
- source_word: חֲטָאתֶם לַיהוָה אֱלֹהֵיכֶם
  choice: நீங்கள் உங்கள் கடவுளாகிய யாவேக்கு எதிராகப் பாவம் செய்திருந்தீர்கள்
  rationale: לַיהוָה இச்சூழலில் ‘எதிராக’ என்ற பொருளையும், மோசே முந்தைய நிகழ்வைத் திரும்பக் கூறுவதால் நிறைவுற்ற கடந்தகாலத் தொடர்பையும் வெளிப்படுத்துகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: திருநான்கெழுத்தான இறைப்பெயரை ஒரு பட்டத்தால் மாற்றாமல், அதன் பரவலான தமிழ் ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: עֲשִׂיתֶם לָכֶם
  choice: உங்களுக்காக ... உருவாக்கியிருந்தீர்கள்
  rationale: לָכֶם பயனாளியைக் குறிக்கிறது; தங்களுடைய பயன்பாட்டிற்காகச் செய்தார்கள் என்ற பொருளைத் தெளிவுபடுத்துகிறது.
- source_word: עֵגֶל מַסֵּכָה
  choice: வார்ப்பினால் செய்யப்பட்ட ஒரு கன்றுக்குட்டி
  rationale: மַסֵּכָה உருக்கப்பட்ட உலோகத்தை வார்த்து உருவாக்கிய உருவத்தைக் குறிக்கிறது; பொருள் மற்றும் தயாரிப்பு முறையை நவீன தமிழில் எடுத்துரைக்கிறது.
- source_word: סַרְתֶּם מַהֵר מִן הַדֶּרֶךְ
  choice: வழியிலிருந்து வெகு விரைவாக விலகியிருந்தீர்கள்
  rationale: சட்டநெறியை ஒரு வழியாகக் காட்டும் மூல உருவகத்தைப் பாதுகாத்து, மַהֵר என்பதன் வலுவான விரைவையும் தெரிவிக்கிறது.
- source_word: אֲשֶׁר צִוָּה יְהוָה אֶתְכֶם
  choice: யாவே உங்களுக்குக் கட்டளையிட்ட
  rationale: இந்த உறவுச்சொற்றொடர் ‘வழி’ என்பதை இயல்பான தமிழ் தொடரமைப்பில் நேரடியாக விளக்குகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலத்தில் தனிப்பட்ட உடன்படிக்கைப் பெயர் நேரடியாக உள்ளது. அதை ஒரு பொதுப் பட்டமாக மாற்றாமல் ஒலிபெயர்ப்பது மூல வேறுபாட்டைப் பாதுகாக்கிறது.
- issue: ‘வழி’ என்ற உடன்படிக்கை/ஒழுக்க உருவகம்
  choice: வழி
  alternative: நெறி
  rationale: ‘நெறி’ பொருளை விளக்கக்கூடியதாக இருந்தாலும், דֶּרֶךְ என்பதன் பாதை/வழி உருவகத்தையும் உபாகமத்தின் மொழிசார் ஒத்திசைவையும் ‘வழி’ பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் வேதக் கதைநடையின் கண்ணியத்தைத் தக்கவைக்கும் வகையிலும் மொழிபெயர்க்கப்பட்டது. ‘இதோ’ கவன ஈர்ப்புச் சொல்லின் வலிமையைப் பாதுகாக்கிறது; வாக்கியங்கள் வாசிப்புத் தெளிவுக்காகப் பிரிக்கப்பட்டுள்ளன.
