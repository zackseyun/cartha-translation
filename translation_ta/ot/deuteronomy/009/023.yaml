source:
  edition: WLC
  text: וּ/בִ/שְׁלֹ֨חַ יְהוָ֜ה אֶתְ/כֶ֗ם מִ/קָּדֵ֤שׁ בַּרְנֵ֨עַ֙ לֵ/אמֹ֔ר עֲלוּ֙ וּ/רְשׁ֣וּ אֶת הָ/אָ֔רֶץ אֲשֶׁ֥ר נָתַ֖תִּי לָ/כֶ֑ם וַ/תַּמְר֗וּ אֶת פִּ֤י יְהוָה֙ אֱלֹ֣הֵי/כֶ֔ם וְ/לֹ֤א הֶֽאֱמַנְתֶּם֙ ל֔/וֹ וְ/לֹ֥א שְׁמַעְתֶּ֖ם בְּ/קֹלֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/023.yaml
  text: And when Yahweh sent you from Kadesh-barnea[a], saying, 'Go up and take possession of the land that I have given you,' you rebelled against the command of Yahweh your God[c][b], and you did not believe him or listen to his voice.
translation:
  language: ta
  text: யாவே உங்களைக் காதேஸ்-பர்னேயாவிலிருந்து அனுப்பி, “மேலே சென்று, நான் உங்களுக்குக் கொடுத்துள்ள நாட்டை உரிமையாகப் பெற்றுக்கொள்ளுங்கள்” என்று சொன்னபோது, நீங்கள் உங்கள் கடவுளாகிய யாவேயின் கட்டளைக்கு எதிராகக் கலகம் செய்தீர்கள்[a]; அவரை நம்பவில்லை[b], அவருடைய குரலுக்குச் செவிகொடுக்கவும் இல்லை[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரேயத்தில் சொற்சொல்லாக, “உங்கள் கடவுளாகிய யாவேயின் வாய்க்கு எதிராக”; இது அவருடைய கட்டளை அல்லது சொல்லுக்கு எதிராக என்பதைக் குறிக்கும் மரபுத்தொடர்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அவர்மீது நம்பிக்கை வைக்கவில்லை.”
    reason: lexical_alternative
  - marker: c
    text: அல்லது, “அவருடைய குரலுக்குக் கீழ்ப்படியவும் இல்லை.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבִשְׁלֹחַ
  choice: அனுப்பி ... சொன்னபோது
  rationale: இணைப்புச் சொல், முன்னொட்டு மற்றும் வினையெச்சத்தின் காலச்சூழலை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இது பட்டப்பெயராக மாற்றப்படாமல், எபிரேய இறைப்பெயரின் தமிழாக்க ஒலிபெயர்ப்பாக வைக்கப்பட்டுள்ளது.
- source_word: מִקָּדֵשׁ בַּרְנֵעַ
  choice: காதேஸ்-பர்னேயாவிலிருந்து
  rationale: இடப்பெயர் தமிழில் ஒலிபெயர்க்கப்பட்டு, ‘இருந்து’ என்ற வேற்றுமை உருபால் மூலத்தின் מִן பொருள் காட்டப்பட்டுள்ளது.
- source_word: עֲלוּ
  choice: மேலே சென்று
  rationale: עלה என்பதன் ஏறிச் செல்லுதல் அல்லது உயரமான பகுதிக்குச் செல்லுதல் என்ற இடவியல் நுணுக்கத்தைத் தக்கவைக்கிறது.
- source_word: וּרְשׁוּ
  choice: உரிமையாக்கிக்கொள்ளுங்கள்
  rationale: ירשׁ இச்சூழலில் நாட்டைக் கைப்பற்றி தங்களுடைய உடைமையாக ஏற்றுக்கொள்வதைக் குறிக்கிறது; வெறும் ‘சுதந்தரித்துக்கொள்ளுங்கள்’ என்பதைக் காட்டிலும் சூழலுக்கு ஏற்றது.
- source_word: אֲשֶׁר נָתַתִּי לָכֶם
  choice: நான் உங்களுக்குக் கொடுத்திருக்கிற
  rationale: எபிரேய நிறைவுவினையின் முடிவுற்றும் தற்போதும் பொருந்தும் கொடை என்ற நுணுக்கத்தைத் தக்கவைக்கிறது.
- source_word: וַתַּמְרוּ
  choice: கலகம் செய்தீர்கள்
  rationale: מרה அதிகாரத்துக்கு எதிரான கலகம் அல்லது எதிர்ப்பைக் குறிக்கிறது.
- source_word: אֶת־פִּי יְהוָה אֱלֹהֵיכֶם
  choice: உங்கள் கடவுளாகிய யாவேயின் கட்டளைக்கு எதிராக
  rationale: ‘வாய்க்கு எதிராக’ என்ற சொற்சொல் வடிவம் தமிழில் தெளிவற்றதாக இருக்கும்; இங்கு ‘வாய்’ என்பது அதிகாரபூர்வமான கட்டளை அல்லது சொல் என்பதைக் குறிக்கும் எபிரேய மரபுத்தொடர்.
- source_word: וְלֹא הֶאֱמַנְתֶּם לוֹ
  choice: அவரை நம்பவில்லை
  rationale: אמן என்பதில் நம்புதல், நம்பிக்கை வைத்தல் ஆகிய இரு நுணுக்கங்களும் உள்ளன; தமிழ் ‘நம்புதல்’ அவற்றை இயல்பாகத் தாங்குகிறது.
- source_word: וְלֹא שְׁמַעְתֶּם בְּקֹלוֹ
  choice: அவருடைய குரலுக்குச் செவிகொடுக்கவும் இல்லை
  rationale: கேட்பதையும் அதன்படி நடப்பதையும் உள்ளடக்கும் எபிரேய சொல்லாட்சியை, கீழ்ப்படிதல் என்ற உட்பொருளை முற்றிலும் மறைக்காமல், உருவகத்துடன் தக்கவைக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூலத்தில் தனிப்பட்ட உடன்படிக்கைப் பெயர் நேரடியாக உள்ளது; அதை ஒரு பட்டப்பெயரால் மாற்றாமல் ஒலிபெயர்ப்பது மூல வேறுபாட்டைக் காக்கிறது.
- issue: נָתַתִּי என்ற நிறைவுவினையின் காலநுணுக்கம்
  choice: கொடுத்திருக்கிற
  alternative: கொடுத்தேன்
  rationale: நாடு ஏற்கெனவே உறுதியாகக் கொடுக்கப்பட்டிருக்கிறது என்ற உரையின் பார்வையையும் அதன் தற்போதைய பொருத்தத்தையும் காட்டுகிறது; இதற்கு மேல் எந்தக் கோட்பாட்டு அமைப்பையும் சேர்ப்பதில்லை.
- issue: הֶאֱמַנְתֶּם என்பதிலுள்ள நம்புதல்/நம்பிக்கை வைத்தல் நுணுக்கம்
  choice: நம்பவில்லை
  alternative: அவர்மீது நம்பிக்கை வைக்கவில்லை
  rationale: மூலத்தின் உண்மை என ஏற்றுக்கொள்ளுதல் மற்றும் நம்பிக்கை வைத்தல் ஆகிய இரு சாத்தியங்களையும் சுருக்கமாகத் திறந்துவைக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. நேரடி உரை தெளிவாக வைக்கப்பட்டு, ‘குரலுக்குச் செவிகொடுத்தல்’ போன்ற மூல உருவகம் பாதுகாக்கப்பட்டுள்ளது; கடினமான எபிரேய ‘வாய்’ மரபுத்தொடர் முதன்மை உரையில் பொருளாக்கப்பட்டு அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது.
