  source_fidelity: 'மூல எபிரேயத்தின் செயல்வரிசையும் முக்கிய கூறுகளும் துல்லியமாகப் பாதுகாக்கப்பட்டுள்ளன: இரண்டு பலகைகளைப் பிடித்தல், இரு கைகளிலிருந்தும் அவற்றை எறிதல், கேட்போர் கண்முன் அவற்றை உடைத்தல். ‘அந்த’ என்பது உடனடியான சூழலில் ஏற்கெனவே குறிப்பிடப்பட்ட பலகைகளைச் சுட்டுவதால் ஏற்றது; ‘கல்’ என மூல வசனத்தில் வெளிப்படையாக இல்லாததைச் சேர்க்கவில்லை.'
  naturalness: நடை நவீனத் தரத் தமிழில் தெளிவாகவும் கண்ணியமாகவும் உள்ளது. ‘என் இரு கைகளிலிருந்தும்’ என்பது எபிரேய இரட்டைப் பயன்பாட்டின் வலியுறுத்தலை இயல்பாகக் காட்டுகிறது. ‘பற்றிப் பிடித்து’ சிறிது வலியுறுத்தலானதாயினும், மூல வினையின் உடல் செயலை இயல்பாகவே தருகிறது.
