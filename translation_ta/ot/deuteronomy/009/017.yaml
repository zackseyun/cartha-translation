translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான நடையுடன் மொழிபெயர்க்கப்பட்டது. எபிரேயத்தில் உள்ள ‘இரண்டு பலகைகள்,’ ‘இரு கைகள்,’ ‘உங்கள் கண்களுக்கு முன்பாக’ என்ற கூறுகள் பாதுகாக்கப்பட்டுள்ளன; தேவையற்ற வகையில் ‘கற்பலகைகள்’ என விரிவுபடுத்தப்படவில்லை.
