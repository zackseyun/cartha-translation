base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/017.yaml
  text: So I took hold of the two tablets and threw them from my two hands and shattered them before your eyes[a].
translation:
  language: ta
  text: அப்போது நான் அந்த இரண்டு பலகைகளையும் பற்றிப் பிடித்து, என் இரு கைகளிலிருந்தும் அவற்றை எறிந்து, உங்கள் கண்களுக்கு முன்பாக அவற்றை உடைத்தேன்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அவற்றைச் சிதறடித்தேன்.’ எபிரேய வினைச்சொல்லின் அடிப்படைப் பொருள் ‘உடைத்தேன்’; கற்பலகைகளுக்குச் சூழலில் ஏற்பட்டிருக்கக்கூடிய விளைவை ‘சிதறடித்தேன்’ அதிகத் தீவிரமாக வெளிப்படுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶתְפֹּשׂ
  choice: பற்றிப் பிடித்து
  rationale: תפשׂ என்பது ஒன்றைப் பற்றுதல் அல்லது பிடித்துக்கொள்ளுதல் எனப் பொருள்படும். ‘பற்றிப் பிடித்து’ என்பது உடல் செயலை இயல்பாகவும் மிகைப்படுத்தாமலும் தெரிவிக்கிறது.
- source_word: בִּשְׁנֵי הַלֻּחֹת
  choice: அந்த இரண்டு பலகைகளையும்
  rationale: לֻחֹת என்பது பலகைகளைக் குறிக்கிறது; இவை முன்சூழலில் ஏற்கெனவே அறிமுகமான உடன்படிக்கைப் பலகைகள் என்பதால் ‘அந்த’ பொருத்தமானது. இவ்வசனத்தில் ‘கல்’ என்பது வெளிப்படையாக இல்லை.
- source_word: וָאַשְׁלִכֵם
  choice: அவற்றை எறிந்து
  rationale: שלך என்பதன் நேரான பொருள் எறிதல். ‘எறிந்து’ என்பது நவீனத் தமிழில் இயல்பானதும் செயலைத் தெளிவாகக் காட்டுவதுமாகும்.
- source_word: מֵעַל שְׁתֵּי יָדָי
  choice: என் இரு கைகளிலிருந்தும்
  rationale: எபிரேய சொற்றொடர் இரு கைகளையும் வெளிப்படையாகச் சுட்டுகிறது. ‘என் இரு கைகளிலிருந்தும்’ அந்த வலியுறுத்தலைத் தமிழில் இயல்பாகப் பாதுகாக்கிறது.
- source_word: וָאֲשַׁבְּרֵם
  choice: அவற்றை உடைத்தேன்
  rationale: שׁבר என்பதன் அடிப்படைப் பொருள் ‘உடைத்தல்’. கற்பலகைகள் சிதறிய விளைவு சூழலில் சாத்தியமானாலும், அதை உரைக்குள் கட்டாயமாக்காமல் மூலச்சொல்லின் பொருள் பரப்பைப் பாதுகாக்க ‘உடைத்தேன்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: לְעֵינֵיכֶם
  choice: உங்கள் கண்களுக்கு முன்பாக
  rationale: இச்சொற்றொடர் கேட்போரின் பார்வையில் அல்லது அவர்கள் முன்னிலையில் நடந்ததைச் சுட்டுகிறது. ‘உங்கள் கண்களுக்கு முன்பாக’ எபிரேய உருவகத்தைத் தெளிவாகப் பேணுகிறது.
