    issue: Divine name rendered as “யெகோவா” rather than “யாவே.”
    rationale: The source uses יהוה, and the current POB audit trail explicitly directs that this covenant name be rendered “Yahweh,” not replaced or rendered with the traditional form “Jehovah.”
