base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/025.yaml
  text: So I fell down before Yahweh for forty days and forty nights[a], because Yahweh had said he would destroy you.
translation:
  language: ta
  text: ஆகவே, யாவே உங்களை அழித்துவிடுவதாகக் கூறியிருந்ததால், நான் நாற்பது பகலும் நாற்பது இரவும் யாவேவின் முன்னிலையில் விழுந்து கிடந்தேன்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “விழுந்து கிடந்தேன்” என்பதை “யாவேவின் முன்னிலையில் நெடுஞ்சாண்கிடையாகக் கிடந்தேன்” என்றும் மொழிபெயர்க்கலாம். எபிரெய வினைச்சொல், பரிந்துவேண்டுவதற்காகத் தாழ்ந்து தரையில் கிடப்பதை வலியுறுத்தக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶתְנַפַּל ... אֲשֶׁר הִתְנַפָּלְתִּי
  choice: ஆகவே ... விழுந்து கிடந்தேன்
  rationale: נפל என்பதன் ஹித்பயேல் வடிவம் இங்கு மோசே வேண்டுதலில் தம்மைத் தரையில் வீழ்த்தி நெடுநேரம் கிடந்ததைக் குறிக்கிறது. எபிரெய உரையிலுள்ள வினைச்சொல் மறுபடியும் வருவது தமிழில் சொற்சொல்லாகத் திரும்பக் கூறினால் இயல்பற்றதாகும்; ஒரே தொடர்ச்சியான செயலைக் குறிக்கும் ‘விழுந்து கிடந்தேன்’ அதன் பொருளை இயல்பாகத் தருகிறது. தொடக்க வாவ், முந்தைய நிகழ்வின் விளைவைக் காட்டுவதால் ‘ஆகவே’ என மொழிபெயர்க்கப்பட்டது.
- source_word: לִפְנֵי יְהוָה
  choice: யெகோவாவின் முன்னிலையில்
  rationale: לִפְנֵי என்பது ‘முன்னிலையில்’ அல்லது ‘சந்நிதியில்’ என்ற இடம்/உறவு சார்ந்த பொருளைக் கொண்டது. இங்கு எளிதாகப் புரியும் ‘முன்னிலையில்’ தேர்ந்தெடுக்கப்பட்டது; יהוה என்ற உடன்படிக்கைப் பெயர் ‘யெகோவா’ என ஒலிபெயர்க்கப்பட்டது.
- source_word: אֵת אַרְבָּעִים הַיּוֹם וְאֶת אַרְבָּעִים הַלַּיְלָה
  choice: நாற்பது பகலும் நாற்பது இரவும்
  rationale: இவை காலநீட்டத்தைக் குறிக்கும் குறியிடப்படாத வேற்றுமைத் தொடர்கள். தமிழில் கால அளவை இயல்பாகக் குறிக்க ‘நாற்பது பகலும் நாற்பது இரவும்’ போதுமானது.
- source_word: כִּי
  choice: கூறியிருந்ததால்
  rationale: כִּי இங்கு மோசே விழுந்து கிடந்ததற்கான காரணத்தை அறிமுகப்படுத்துகிறது; தமிழில் காரணத் தொடர்பை ‘-தால்’ தெளிவாக வெளிப்படுத்துகிறது.
- source_word: אָמַר יְהוָה
  choice: யெகோவா ... கூறியிருந்ததால்
  rationale: யெகோவாவின் அறிவிப்பு மோசே விழுந்து கிடப்பதற்கு முன்னதாக நிகழ்ந்தது. தமிழின் இறந்தகால நிறைவுநிலை ‘கூறியிருந்த’ அந்த நிகழ்வுகளின் வரிசையை வெளிப்படுத்துகிறது.
- source_word: לְהַשְׁמִיד אֶתְכֶם
  choice: உங்களை அழித்துவிடுவதாக
  rationale: השמיד என்பது முற்றாக அழிப்பதைக் குறிக்கும் காரணவினை. ‘அழித்துவிடு’ அதன் தீவிரத்தைக் காட்டுகிறது; ஆனாலும் ‘நிர்மூலமாக்கு’ போன்ற மிகக் கடினமான சொல்லைத் தவிர்க்கிறது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யெகோவா
  alternative: யாவே; கர்த்தர்
  rationale: இங்கு எபிரெய மூலத்தில் நான்கெழுத்து உடன்படிக்கைப் பெயர் நேரடியாக உள்ளது. பொதுவான பட்டப்பெயரால் மாற்றாமல் தனிப்பெயராகப் பாதுகாக்க ‘யெகோவா’ பயன்படுத்தப்பட்டது; அதன் வரலாற்று உச்சரிப்பு குறித்த வேறுபாடு அடிக்குறிப்பில் சுட்டப்படுகிறது.
- issue: மோசேயின் உடல்நிலையும் பரிந்துபேசுதலும்
  choice: விழுந்து கிடந்தேன்
  alternative: விழுந்தேன்; முகங்குப்புறக் கிடந்தேன்
  rationale: மூலம் தாழ்ந்து விழுதல் அல்லது நெடுஞ்சாண்கிடையாகக் கிடத்தலைக் குறிக்கலாம்; அது ‘முகங்குப்புற’ என்ற துல்லிய உடல்நிலையை வெளிப்படையாகச் சொல்லவில்லை. எனவே அதன் வேண்டுதல் சார்ந்த தீவிரத்தைக் காத்து, மூலத்தைவிட கூடுதல் விவரம் சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகருக்குப் புரியும் அதேவேளையில் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. ‘சந்நிதி’, ‘நிர்மூலம்’ போன்ற உயர்நடைச் சொற்களுக்குப் பதிலாக ‘முன்னிலையில்’, ‘அழித்துவிடு’ ஆகிய இயல்பான சொற்கள் பயன்படுத்தப்பட்டன. மூலத்தின் மறுபடியான வினைத் தொடரைச் சொற்சொல்லாகக் கொடுக்காமல், ‘விழுந்து கிடந்தேன்’ என்பதில் அதன் நீடித்த செயற்பொருள் ஒருங்கிணைக்கப்பட்டது.
