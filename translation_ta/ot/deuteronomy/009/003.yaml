  text: וְ/יָדַעְתָּ֣ הַ/יּ֗וֹם כִּי֩ יְהוָ֨ה אֱלֹהֶ֜י/ךָ הֽוּא הָ/עֹבֵ֤ר לְ/פָנֶ֨י/ךָ֙ אֵ֣שׁ אֹֽכְלָ֔ה ה֧וּא יַשְׁמִידֵ֛/ם וְ/ה֥וּא יַכְנִיעֵ֖/ם לְ/פָנֶ֑י/ךָ וְ/הֽוֹרַשְׁתָּ֤/ם וְ/הַֽאַבַדְתָּ/ם֙ מַהֵ֔ר כַּ/אֲשֶׁ֛ר דִּבֶּ֥ר יְהוָ֖ה לָֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/003.yaml
  text: So know today that Yahweh your God is the one crossing over before you[a], a consuming fire. He will destroy them, and he will subdue them before you; and you will dispossess them and make them perish quickly[d][c][b], just as Yahweh has spoken to you.
translation:
  language: ta
  text: 'ஆகவே, இன்று அறிந்துகொள்: உன் கடவுளாகிய யாவேதாமே உனக்கு முன்னாகக் கடந்துசெல்கிறவர்[a]; அவர் விழுங்கும் நெருப்பு[b]. அவரே அவர்களை அழித்து, உனக்கு முன்பாக அவர்களை அடக்குவார். நீ அவர்களை அவர்களுடைய உடைமையிலிருந்து அகற்றி[c], விரைவில் அவர்களை ஒழிப்பாய்—யாவே உன்னிடம் கூறியபடியே[d].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “உனக்கு முன்னால் செல்கிறவர்” என்றும் மொழிபெயர்க்கலாம். எபிரெய பங்கேற்பு வினை, இஸ்ரவேலுக்கு முன்னால் யாவே கடந்துசெல்வதைச் சொல்லளவில் சித்தரிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: “பட்சிக்கும் நெருப்பு” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: “அவர்களைத் துரத்திவிடுவாய்” என்றும் மொழிபெயர்க்கலாம். இங்குள்ள எபிரெய வினை, அவர்களை அவர்களுடைய உடைமையிலிருந்து அகற்றுதல் அல்லது அவர்களிடமிருந்த உரிமையைப் பறித்தல் என்ற பொருளைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: d
    text: “யாவே உன்னிடம் கூறியவாறே” என்றும் மொழிபெயர்க்கலாம்; யாவே இஸ்ரவேலிடம் முன்னதாக உரைத்த வார்த்தைக்கு ஏற்ப இது நிகழும் என்பதே பொருள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָדַעְתָּ הַיּוֹם
  choice: ஆகவே, இன்று இதை அறிந்துகொள்
  rationale: முந்தைய கருத்துடன் உள்ள தொடர் உறவை ‘ஆகவே’ காட்டுகிறது; எபிரெய வினையின் நேரடி அறிவுறுத்தலை ‘அறிந்துகொள்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய மூலத்தில் வரும் இறைவனின் தனிப்பெயரை ஒரு பட்டப்பெயரால் மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: אֱלֹהֶיךָ
  choice: உன் கடவுளாகிய
  rationale: இரண்டாம் நபர் ஒருமை உடைமைப் பொருளையும் உடன்படிக்கைச் சொல்லாட்சியையும் தெளிவாகக் காக்கிறது.
- source_word: הוּא הָעֹבֵר לְפָנֶיךָ
  choice: தாமே உனக்கு முன்னால் கடந்துசெல்கிறவர்
  rationale: הוּא என்பதன் வலியுறுத்தலை ‘தாமே’ என்றும், עבר பங்கேற்பு வினையின் தொடர்ச்சியான, உயிரோட்டமுள்ள கடத்தலை ‘கடந்துசெல்கிறவர்’ என்றும் காக்கிறது.
- source_word: אֵשׁ אֹכְלָה
  choice: பட்சிக்கும் நெருப்பு
  rationale: ‘உண்ணும்/விழுங்கும்’ என்ற உருவகத்தின் அழிவூட்டும் வலிமையை மரியாதையான, வேதாகமத் தமிழில் சுருக்கமாகத் தருகிறது.
- source_word: יַשְׁמִידֵם
  choice: அவர்களை அழித்து
  rationale: שׁמד என்பதன் காரணவினை அழிவுப் பொருளைத் தீவிரம் குறையாமல் வெளிப்படுத்துகிறது.
- source_word: יַכְנִיעֵם
  choice: அவர்களைப் பணியச் செய்வார்
  rationale: போர்ச் சூழலில் எதிரிகளைத் தாழ்த்தி அடக்குவதைக் குறிக்கும் כנע என்பதன் காரணவினைப் பொருளைத் தருகிறது.
- source_word: וְהוֹרַשְׁתָּם
  choice: அவர்கள் வசமிருந்த நாட்டை அவர்களிடமிருந்து கைப்பற்றி
  rationale: ירשׁ என்பதன் காரணவினையில் உள்ள நிலப்பரப்பு சார்ந்த உரிமையகற்றல் பொருளை இயல்பான தமிழில் தெளிவுபடுத்துகிறது.
- source_word: וְהַאֲבַדְתָּם
  choice: அவர்களை ... ஒழித்துவிடுவாய்
  rationale: אבד என்பதன் காரணவினைப் பொருளைக் காக்கிறது; முன்பு வரும் שׁמד என்பதற்குப் பயன்படுத்திய ‘அழி’ என்பதிலிருந்து சொல்வேறுபாட்டையும் பேணுகிறது.
- source_word: מַהֵר
  choice: விரைவில்
  rationale: நடவடிக்கை அல்லது விளைவு சீக்கிரமாக நிகழ்வதைக் குறிக்கும் வினையடைப் பொருளை இயல்பாகத் தருகிறது.
- source_word: כַּאֲשֶׁר דִּבֶּר יְהוָה לָךְ
  choice: யாவே உன்னிடம் கூறியபடியே
  rationale: முன்னதாக உரைக்கப்பட்ட இறைவார்த்தைக்கு ஏற்ப இது நிகழும் என்ற பொருளைக் காக்கிறது; ‘வாக்குறுதி அளித்தார்’ என்று விளக்கத்தைச் சேர்க்கவில்லை.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் பட்டப்பெயர் அல்லாமல் நான்கெழுத்து இறைப்பெயரே வருவதால், தனிப்பெயரை ஒலிபெயர்த்து அதன் உடன்படிக்கைச் சிறப்பைத் தக்கவைக்கிறது.
- issue: אֵשׁ אֹכְלָה என்பதிலுள்ள இறைநியாயத் தீர்ப்பின் உருவகம்
  choice: பட்சிக்கும் நெருப்பு
  alternative: விழுங்கும் நெருப்பு
  rationale: இறைவனின் பரிசுத்தமான, அழிவூட்டும் பிரசன்னத்தைச் சித்தரிக்கும் மூல உருவகத்தை மென்மைப்படுத்தாமலும் கோட்பாட்டு விளக்கமாக விரிவாக்காமலும் காக்கிறது.
- issue: இறைச் செயலும் இஸ்ரவேலின் செயலும் இணைந்திருத்தல்
  choice: அவரே ... செய்வார்; நீ ... ஒழித்துவிடுவாய்
  alternative: இறைவன் மட்டுமே அனைத்தையும் செய்வார் என ஒருங்கிணைத்தல்
  rationale: எபிரெய உரை இறைவன் அழித்துப் பணியச் செய்வதையும் இஸ்ரவேல் கைப்பற்றி ஒழிப்பதையும் அருகருகே வைக்கிறது; அந்த இறையியல் இழுவிசையைத் தீர்த்துவிடாமல் அப்படியே பேணுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழை அடிப்படையாகக் கொண்டு, இறைவனைச் சுட்டும் இடங்களில் மரியாதை ஒருமையும் வேதாகமத்துக்கேற்ற கண்ணியமான நடையும் பயன்படுத்தப்பட்டுள்ளன. போரையும் அழிவையும் குறிக்கும் மூலத்தின் கடுமை மென்மைப்படுத்தப்படவில்லை; அதேவேளை தேவையற்ற நவீன அரசியல் அல்லது தொழில்நுட்பச் சொற்கள் தவிர்க்கப்பட்டுள்ளன.
