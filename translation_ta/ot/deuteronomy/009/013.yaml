  text: וַ/יֹּ֥אמֶר יְהוָ֖ה אֵלַ֣/י לֵ/אמֹ֑ר רָאִ֨יתִי֙ אֶת הָ/עָ֣ם הַ/זֶּ֔ה וְ/הִנֵּ֥ה עַם קְשֵׁה עֹ֖רֶף הֽוּא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/013.yaml
  text: Then Yahweh said to me[a], saying, ‘I have seen this people, and behold, it is a stiff-necked people.’
translation:
  language: ta
  text: 'அப்போது யாவே என்னிடம் கூறினார்: “இந்த மக்களை நான் பார்த்திருக்கிறேன்[a]; இதோ, இவர்கள் கழுத்தை வளைக்காத மக்கள்.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இந்த மக்களை நான் பார்த்தேன்; உண்மையாகவே, இவர்கள் கழுத்தை வளைக்காத மக்கள்.”
    reason: רָאִיתִי என்பதை எளிய இறந்தகாலமாகவும் וְהִנֵּה என்பதை ‘உண்மையாகவே’ என்றும் மொழிபெயர்க்க முடியும்.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: அப்போது … கூறினார்
  rationale: வாவ் தொடர்வினை கதையின் அடுத்த நிகழ்வை முன்னெடுக்கிறது; ‘அப்போது’ இயல்பான தமிழ் கதைநடையில் அந்த வரிசையை வெளிப்படுத்துகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைப்பட்டத்தால் மாற்றாமல், எபிரேய இறைப்பெயரின் வழக்கமான தமிழ் ஒலிபெயர்ப்பைப் பயன்படுத்துகிறது.
- source_word: אֵלַי לֵאמֹר
  choice: 'என்னிடம் கூறினார்:'
  rationale: எபிரேய பேச்சு அறிமுகச் சூத்திரத்தின் பொருளை இயல்பான தமிழ் நேர்கூற்று அமைப்பில் தருகிறது; ‘சொல்லும்படியாக’ போன்ற தேவையற்ற இரட்டிப்பைத் தவிர்க்கிறது.
- source_word: רָאִיתִי
  choice: நான் பார்த்திருக்கிறேன்
  rationale: எபிரேய நிறைவுவினையின் முடிவுற்ற பார்வையையும் அதன் தற்போதைய மதிப்பீட்டு விளைவையும் தமிழ் நிறைவுநிலை வடிவம் வெளிப்படுத்துகிறது.
- source_word: הָעָם הַזֶּה
  choice: இந்த மக்களை
  rationale: עַם என்பதன் கூட்டுப்பொருளை இயல்பான நவீன தமிழில் ‘மக்கள்’ எனத் தருகிறது.
- source_word: וְהִנֵּה
  choice: இதோ
  rationale: அடுத்து வரும் மதிப்பீட்டின் மீது கவனம் ஈர்க்கும் வலியுறுத்தலைப் பாதுகாக்கிறது.
- source_word: עַם קְשֵׁה עֹרֶף
  choice: கழுத்தை வளைக்காத மக்கள்
  rationale: ‘கடினமான கழுத்து’ என்ற எபிரேய உருவகத்தை இயல்பான தமிழில் காத்து, கீழ்ப்படிய மறுக்கும் பிடிவாதத்தையும் உணர்த்துகிறது.
- source_word: הוּא
  choice: இவர்கள்
  rationale: எபிரேயத்தில் கூட்டுப்பெயர் ஒருமையுடன் வரும் சுட்டுப்பெயர், தமிழில் ‘மக்கள்’ என்பதோடு இயல்பாகப் பன்மையில் ஒத்திசைக்கப்படுகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: யெகோவா
  rationale: மூலத்தில் வரும் உடன்படிக்கைப் பெயரை ‘கர்த்தர்’ போன்ற பட்டத்தால் மாற்றாமல் ஒலிபெயர்க்கிறது; ‘யாவே’ என்பது எபிரேயப் பெயரின் பரவலாக ஏற்கப்பட்ட மறுஉருவாக்கத்துக்கு அணுக்கமானது.
- issue: קְשֵׁה עֹרֶף என்ற குற்றச்சாட்டின் உருவகம்
  choice: கழுத்தை வளைக்காத மக்கள்
  alternative: பிடிவாதமான மக்கள்
  rationale: பிடிவாதத்தையும் கீழ்ப்படியாமையையும் குறிக்கும் கழுத்து உருவகத்தைத் தக்கவைக்கிறது; விளக்கப் பொருளை மட்டும் வைத்து உருவகத்தை நீக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகருக்குப் புரியும் கண்ணியமான நேர்கூற்று நடை பயன்படுத்தப்பட்டுள்ளது. எபிரேய உருவகம் பாதுகாக்கப்பட்டாலும், சொல்லுக்குச் சொல் இயல்பற்ற ‘கடின கழுத்துள்ள’ என்ற வடிவம் தவிர்க்கப்பட்டுள்ளது.
