base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/012.yaml
  text: And Yahweh said to me[a], 'Arise, go down quickly from here, because your people, whom you brought out from Egypt, have corrupted themselves. They have quickly turned aside from the way that I commanded them; they have made for themselves a cast image.'
translation:
  language: ta
  text: யாவே என்னிடம், “எழுந்து, இங்கிருந்து விரைவாக இறங்கிப் போ. ஏனெனில், எகிப்திலிருந்து நீ வெளியே கொண்டுவந்த உன் மக்கள் தங்களைச் சீர்கெடுத்துக்கொண்டார்கள். நான் அவர்களுக்குக் கட்டளையிட்ட வழியிலிருந்து அவர்கள் விரைவாக விலகிவிட்டார்கள்; தங்களுக்காக ஒரு வார்ப்புச் சிலையை[a] செய்துகொண்டார்கள்” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உருக்கப்பட்ட சிலை.” எபிரெயச் சொல், உலோகத்தை உருக்கி வார்த்து உருவாக்கப்பட்ட ஒரு படிமத்தைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: யாவே
  rationale: உடன்படிக்கையின் தனிப்பட்ட இறைப்பெயரைப் பொதுப்பட்டமான ‘கர்த்தர்’ என்று மாற்றாமல், தமிழில் இயல்பாக ஒலிபெயர்க்கிறது.
- source_word: קוּם רֵד מַהֵר מִזֶּה
  choice: எழுந்து, இங்கிருந்து விரைவாக இறங்கிப் போ
  rationale: தொடர்ச்சியான கட்டளைகளையும், மலையிலிருந்து கீழ்நோக்கிச் செல்லும் திசையையும், அவசரத்தையும் பாதுகாக்கிறது.
- source_word: שִׁחֵת
  choice: தங்களைச் சீர்கெடுத்துக்கொண்டார்கள்
  rationale: மக்களின் ஒழுக்க மற்றும் வழிபாட்டுச் சீரழிவைக் காட்டுகிறது; தமிழில் செயலும் அதன் விளைவும் அவர்களையே சார்ந்திருப்பதை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: עַמְּךָ
  choice: உன் மக்கள்
  rationale: தேவன் மோசேயிடம் பேசும்போது காணப்படும் திட்டவட்டமான இடைவெளிப்படுத்தும் சொற்றொடரை மென்மைப்படுத்தாமல் காக்கிறது.
- source_word: אֲשֶׁר הוֹצֵאתָ מִמִּצְרָיִם
  choice: எகிப்திலிருந்து நீ வெளியே கொண்டுவந்த
  rationale: ஹிஃபில் வடிவின் காரணவினைப் பொருளையும், தேவன் மோசேயிடம் நேரடியாகக் கூறும் கண்டனத் தொனியையும் காக்கிறது.
- source_word: סָרוּ מַהֵר מִן הַדֶּרֶךְ
  choice: வழியிலிருந்து அவர்கள் விரைவாக விலகிவிட்டார்கள்
  rationale: கட்டளையிடப்பட்ட நடத்தை ஒரு ‘வழி’ எனக் காட்டும் உருவகத்தையும், מַהֵר என்பதன் மறுபடியான அவசரத் தன்மையையும் பாதுகாக்கிறது.
- source_word: מַסֵּכָה
  choice: வார்ப்புச் சிலை
  rationale: பொதுவாக ‘விக்கிரகம்’ என்று மட்டும் விளக்காமல், உருக்கிய உலோகத்தை வார்த்து உருவாக்கப்பட்ட படிமம் என்ற குறிப்பான பொருளைத் தருகிறது.
theological_decisions:
- issue: ‘உன் மக்கள், எகிப்திலிருந்து நீ வெளியே கொண்டுவந்த’ என்பதில் உள்ள கண்டனமும் உறவுசார் இடைவெளியும்
  choice: எபிரெய உரையின் இரண்டாம் நபர் உரிமையையும் செயப்பாட்டையும் அப்படியே பாதுகாத்தல்
  alternative: ‘எகிப்திலிருந்து வெளியே கொண்டுவரப்பட்ட இஸ்ரயேல் மக்கள்’ என்று நடுநிலைப்படுத்தல்
  rationale: மோசேயை நோக்கி தேவன் கூறும் கூர்மையான கண்டனத்தை உரை திட்டமிட்டே உருவாக்குகிறது; அதை மொழிபெயர்ப்பு மென்மைப்படுத்தக் கூடாது.
- issue: מַסֵּכָה என்ற வழிபாட்டுப் படிமத்திற்கான சொல்
  choice: வார்ப்புச் சிலை
  alternative: விக்கிரகம்; உருக்கப்பட்ட சிலை
  rationale: மூலச்சொல் பாவத்தின் பொதுவான வகையை மட்டும் அல்லாமல் படிமம் உருவாக்கப்பட்ட முறையையும் சுட்டுகிறது; ‘வார்ப்புச் சிலை’ அந்தத் துல்லியத்தை இயல்பான தமிழில் காக்கிறது.
- issue: שִׁחֵת என்பதன் செயற்பாட்டு நுணுக்கம்
  choice: தங்களைச் சீர்கெடுத்துக்கொண்டார்கள்
  alternative: சீர்கெட்டார்கள்; கேடாக நடந்துகொண்டார்கள்
  rationale: மக்கள் செய்த செயலும் அதனால் அவர்களுக்கே ஏற்பட்ட சீரழிவும் இணைந்திருக்கும் மூலமொழியின் வலிமையைத் தமிழில் தருகிறது; அதை வெறும் நிலைமையாகவோ பொதுவான தவறான நடத்தையாகவோ குறைக்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில் தெளிவான, கண்ணியமான நேரடி உரை பயன்படுத்தப்பட்டுள்ளது. ‘இறங்கிப் போ’ என்பது மலையிலிருந்து கீழே செல்லும் திசையை இயல்பாகத் தருகிறது. மַהֵר இருமுறை வருவதால் ‘விரைவாக’ இரு இடங்களிலும் வைக்கப்பட்டுள்ளது. அடிக்குறிப்பு குறியீடு அது விளக்கும் ‘வார்ப்புச் சிலை’ என்பதற்குப் பின்பே இடப்பட்டுள்ளது.
