  text: פֶּן יֹאמְר֗וּ הָ/אָרֶץ֮ אֲשֶׁ֣ר הוֹצֵאתָ֣/נוּ מִ/שָּׁם֒ מִ/בְּלִי֙ יְכֹ֣לֶת יְהוָ֔ה לַ/הֲבִיאָ֕/ם אֶל הָ/אָ֖רֶץ אֲשֶׁר דִּבֶּ֣ר לָ/הֶ֑ם וּ/מִ/שִּׂנְאָת֣/וֹ אוֹתָ֔/ם הוֹצִיאָ֖/ם לַ/הֲמִתָ֥/ם בַּ/מִּדְבָּֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/028.yaml
  text: Otherwise the land from which you brought us out will say[a], ‘Because Yahweh was not able to bring them into the land that he promised them, and because he hated them[b], he brought them out to put them to death in the wilderness.’
translation:
  language: ta
  text: இல்லையென்றால், நீர் எங்களை எங்கிருந்து வெளியே கொண்டுவந்தீரோ, அந்த நாடு[a], ‘யாவே அவர்களுக்கு வாக்களித்த நாட்டிற்குள்[b] அவர்களைக் கொண்டுவர முடியாததாலும், அவர்களை வெறுத்ததாலும், வனாந்தரத்தில் அவர்களைக் கொன்றுபோடுவதற்காக அவர்களை வெளியே கொண்டுவந்தார்’ என்று சொல்லும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “நீர் எங்களை எங்கிருந்து வெளியே கொண்டுவந்தீரோ, அந்த நாடு” என்று உள்ளது; இங்கு “நாடு” என்பது அதன் குடிமக்களைக் குறிக்கிறது.
    reason: cultural_note
  - marker: b
    text: இன்னும் சொற்படியாக, “அவர்களிடம் அதைப் பற்றிப் பேசிய நாட்டிற்குள்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: פֶּן
  choice: இல்லையென்றால்
  rationale: முந்தைய சூழலில் அஞ்சப்படும் விளைவை அறிமுகப்படுத்தும் எபிரெயச் சொல்லின் எச்சரிக்கைத் தன்மையை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: הָאָרֶץ אֲשֶׁר הוֹצֵאתָנוּ מִשָּׁם
  choice: நீர் எங்களை எங்கிருந்து வெளியே கொண்டுவந்தீரோ, அந்த நாடு
  rationale: எபிரெய மூலத்தில் ‘நாடு’ என்பதே எழுவாய்; அது அந்நாட்டின் மக்களைக் குறிக்கும் ஆகுபெயராக இருந்தாலும், மூலத்தின் உருவகத்தை முதன்மை உரையில் பாதுகாக்கிறது.
- source_word: מִבְּלִי יְכֹלֶת יְהוָה
  choice: யாவே ... கொண்டுவர இயலாததாலும்
  rationale: இந்தக் கட்டமைப்பு இயலாமையை காரணமாகக் காட்டுகிறது. இது மற்ற நாட்டினரின் பழிச்சொல்; கடவுளுக்கு உண்மையில் ஆற்றல் இல்லை என்று உரை உறுதிப்படுத்துவதில்லை.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய வேதாகமத்தில் வெளிப்படையாக வரும் உடன்படிக்கைப் பெயரை ஒலிபெயர்த்து வழங்குகிறது.
- source_word: אֶל הָאָרֶץ אֲשֶׁר דִּבֶּר לָהֶם
  choice: அவர்களுக்கு வாக்களித்த நாட்டிற்குள்
  rationale: வினைச்சொல் சொற்படியாக ‘பேசினார்’ என்றாலும், இச்சூழலில் நாட்டைப் பற்றிய கடவுளின் உறுதிமொழியே குறிக்கப்படுவதால் ‘வாக்களித்த’ என்பது தமிழில் பொருளைத் தெளிவாகத் தருகிறது; சொற்படியான வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: וּמִשִּׂנְאָתוֹ אֹתָם
  choice: அவர்களை வெறுத்ததாலும்
  rationale: முன்னிடைச்சொல் காரணத்தைச் சுட்டுகிறது; யாவேயின் நோக்கம் வெறுப்பு என்று அந்நாட்டினர் கூறக்கூடிய குற்றச்சாட்டை நேரடியாகப் பாதுகாக்கிறது.
- source_word: הוֹצִיאָם
  choice: அவர்களை வெளியே கொண்டுவந்தார்
  rationale: வசனத்தின் தொடக்கத்தில் வரும் அதே எபிரெய வேர்ச்சொல்லுடன் சொல் ஒற்றுமையைப் பேணி, எகிப்திலிருந்து வெளியேற்றிய நிகழ்வின் எதிரொலியையும் காக்கிறது.
- source_word: לַהֲמִתָם
  choice: அவர்களைக் கொன்றுபோடுவதற்காகவே
  rationale: מות என்பதன் காரணவினை வடிவத்தையும், வெளியே கொண்டுவந்ததன் நோக்கமாக மரணம் சுமத்தப்படும் வலியுறுத்தலையும் தெரிவிக்கிறது.
- source_word: בַּמִּדְבָּר
  choice: வனாந்தரத்தில்
  rationale: இஸ்ரவேலின் பாலைவனப் பயணச் சூழலுக்குப் பொருத்தமான, தமிழ் வேதாகம நடையில் பரவலாகப் புரிந்துகொள்ளப்படும் சொல்லைத் தேர்ந்தெடுக்கிறது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரை எவ்வாறு வழங்குவது
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலத்தில் பொதுப்பட்டம் அல்ல, நான்கெழுத்து இறைப்பெயரே உள்ளது; ஆகவே அதை ஒலிபெயர்ப்பது மூலத்தின் தனித்துவத்தைப் பாதுகாக்கிறது.
- issue: דִּבֶּר לָהֶם என்பதை சொற்படியாகவா சூழலுக்கேற்பவா மொழிபெயர்ப்பது
  choice: அவர்களுக்கு வாக்களித்த
  alternative: அவர்களிடம் பேசிய
  rationale: வாக்குத்தத்த நாட்டைப் பற்றிய உடன்படிக்கைச் சூழலில் ‘வாக்களித்த’ என்பது கருத்தை இயல்பாகக் காட்டுகிறது; எனினும் எபிரெயின் சொற்படியான ‘பேசிய’ வாசிப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: யாவேயால் கொண்டுவர இயலவில்லை என்ற கூற்றின் நிலை
  choice: மேற்கோளுக்குள் நேரடியாகப் பாதுகாக்கப்பட்டது
  alternative: ‘இயலவில்லை என்று அவர்கள் நினைப்பார்கள்’ என விளக்கிச் சொல்லுதல்
  rationale: இது மோசே அந்நாட்டினர் கூறக்கூடும் என முன்வைக்கும் பழிச்சொல். விளக்கச் சொற்களைச் சேர்க்காமல் மேற்கோள் அமைப்பே அந்தத் தூரத்தைத் தெளிவாக்குகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான நடையைப் பயன்படுத்துகிறது. கடவுளை நேரடியாக அழைக்கும் இடத்தில் மரியாதைப் பன்மையான ‘நீர்’ பயன்படுத்தப்பட்டுள்ளது; மேற்கோளுக்குள் அவரைக் குறிக்க ‘அவர்’ பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் ‘நாடு பேசும்’ ஆகுபெயரும், பிற நாட்டினரின் கடுமையான குற்றச்சாட்டும் மென்மையாக்கப்படாமல் பாதுகாக்கப்பட்டுள்ளன.
