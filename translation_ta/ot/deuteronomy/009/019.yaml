revisions:
- from: உங்களை அழித்துப்போடும்படி யாவே உங்கள்மேல் கொண்டிருந்த கோபத்தையும் கடுஞ்சினத்தையும் கண்டு நான் அஞ்சினேன்.[a] ஆனாலும், அந்த முறையும் யாவே எனக்குச் செவிகொடுத்தார்.[b]
  to: உங்களை அழித்துப்போடுவதற்காக யாவே உங்கள்மேல் சினங்கொண்ட கோபத்தையும் கடுஞ்சினத்தையும் கண்டு நான் அஞ்சினேன்.[a] ஆனால், அந்த வேளையிலும் யாவே எனக்குச் செவிகொடுத்தார்.[b]
  rationale: 'The revision makes the Hebrew verb קָצַף (‘was angry’) explicit through ‘சினங்கொண்ட,’ while retaining the paired nouns for אַף and חֵמָה. It also renders the temporal-additive phrase גַּם בַּפַּעַם הַהִוא more precisely as ‘அந்த வேளையிலும்.’ Footnote anchors remain correctly attached: [a] to the fear/anger clause and [b] to Yahweh’s hearing.'
