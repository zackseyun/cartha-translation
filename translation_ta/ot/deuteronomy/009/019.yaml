  text: כִּ֣י יָגֹ֗רְתִּי מִ/פְּנֵ֤י הָ/אַף֙ וְ/הַ֣/חֵמָ֔ה אֲשֶׁ֨ר קָצַ֧ף יְהוָ֛ה עֲלֵי/כֶ֖ם לְ/הַשְׁמִ֣יד אֶתְ/כֶ֑ם וַ/יִּשְׁמַ֤ע יְהוָה֙ אֵלַ֔/י גַּ֖ם בַּ/פַּ֥עַם הַ/הִֽוא׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/019.yaml
  text: For I was afraid because of the anger and the wrath with which Yahweh was angry against you[a], to destroy you[b]. But Yahweh listened to me also at that time.
translation:
  language: ta
  text: உங்களை அழித்துப்போடுவதற்காக யாவே உங்கள்மேல் சினங்கொண்ட கோபத்தையும் கடுஞ்சினத்தையும் கண்டு நான் அஞ்சினேன்.[a] ஆனால், அந்த வேளையிலும் யாவே எனக்குச் செவிகொடுத்தார்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'இன்னும் சொற்சார்பாக: “யாவே உங்களை அழித்துப்போடுவதற்காக உங்கள்மேல் சினங்கொண்ட கோபத்தையும் கடுஞ்சினத்தையும் முன்னிட்டு நான் அஞ்சினேன்.”'
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில் “என்னைக் கேட்டார்” அல்லது “எனக்குச் செவிசாய்த்தார்”; இச்சூழலில் மோசேயின் பரிந்துரைக்கு யாவே சாதகமாகப் பதிலளித்ததை இது குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָגֹרְתִּי
  choice: நான் அஞ்சினேன்
  rationale: இந்த வினை ஆழமான அச்சத்தைக் குறிக்கிறது. ‘அஞ்சினேன்’ என்பது அதன் தனிப்பட்ட உணர்வையும் தீவிரத்தையும் இயல்பான நவீன தமிழில் தருகிறது.
- source_word: מִפְּנֵי
  choice: கண்டு
  rationale: இங்கு பயத்திற்கான காரணத்தைக் குறிக்கும் எபிரெய மரபுத்தொடர். தமிழில் ‘கோபத்தையும் கடுஞ்சினத்தையும் கண்டு ... அஞ்சினேன்’ என்பது அந்தக் காரணத் தொடர்பை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: הָאַף וְהַחֵמָה
  choice: கோபத்தையும் கடுஞ்சினத்தையும்
  rationale: மூலத்தில் அடுத்தடுத்து வரும் இரு வலுவான சினச் சொற்களையும் தனித்தனியாகப் பேணி, அவற்றின் தீவிரத்தைத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: אֲשֶׁר קָצַף יְהוָה עֲלֵיכֶם
  choice: யாவே உங்கள்மேல் கொண்டிருந்த
  rationale: கצף என்ற சினங்கொள்ளும் வினையின் பொருள் முன்வரும் ‘கோபம், கடுஞ்சினம்’ என்பவற்றோடு இணைக்கப்பட்டுள்ளது. இதனால் எபிரெயத்தின் சினச் சொல் அடுக்கை அளவுக்கு மீறிய மறுபடியுரையின்றி இயல்பான தமிழில் காக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: திருநான்கெழுத்தான இறைப்பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழுக்கு ஏற்ற ஒலிபெயர்ப்பில் தருகிறது.
- source_word: לְהַשְׁמִיד אֶתְכֶם
  choice: உங்களை அழித்துப்போடும்படி
  rationale: ஹிஃபில் வினையெச்சத்தின் அழிவு நோக்கத்தையும் அதன் வலிமையையும் நேரடியாகக் காட்டுகிறது.
- source_word: וַיִּשְׁמַע יְהוָה אֵלַי
  choice: ஆனாலும் ... யாவே எனக்குச் செவிகொடுத்தார்
  rationale: שׁמע உடன் אֶל வருவது வெறுமனே ஒலியைக் கேட்டதல்ல, ஒருவரின் வேண்டுதலுக்குச் சாதகமாகச் செவிகொடுத்ததையும் குறிக்கலாம். ‘ஆனாலும்’ அழிவு அச்சத்திலிருந்து சாதகமான பதிலுக்கான திருப்பத்தை வெளிப்படுத்துகிறது.
- source_word: גַּם בַּפַּעַם הַהִוא
  choice: அந்த முறையும்
  rationale: גַּם என்பதன் கூடுதல் நிகழ்வு என்ற பொருளைச் சுருக்கமாகவும் இயல்பாகவும் காக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூல உரை தனிப்பட்ட உடன்படிக்கைப் பெயரைப் பயன்படுத்துவதால், அதை ஒரு பொதுப் பட்டமாக மாற்றாமல் ஒலிபெயர்த்துள்ளது.
- issue: இறைக்கோபத்தின் தீவிரம்
  choice: கோபத்தையும் கடுஞ்சினத்தையும்
  alternative: கோபத்தை
  rationale: மூலத்தில் אַף, חֵמָה, קצף எனச் சினத்தை வலியுறுத்தும் சொற்கள் அடுக்கப்படுகின்றன. அவற்றை ஒரே மென்மையான சொல்லாகச் சுருக்காமல், தீவிரத்தைப் பேணுகிறது.
- issue: மோசேயின் வேண்டுதலுக்கு யாவே அளித்த பதில்
  choice: எனக்குச் செவிகொடுத்தார்
  alternative: என் குரலைக் கேட்டார்
  rationale: மூல வினை ‘கேட்டார்’ என்றும் பொருள்படலாம்; ஆனால் இச்சூழலில் மோசேயின் பரிந்துரைக்கு யாவே சாதகமாகப் பதிலளித்ததையும் உட்பொருளாகக் கொண்டுள்ளது. ‘செவிகொடுத்தார்’ இரு நுணுக்கங்களையும் காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் அதேவேளையில் கண்ணியமும் மூலத்தின் தீவிரமும் காக்கப்பட்டுள்ளன. ‘அந்த முறையும்’ என்பது உரையாடல் இயல்பைத் தருகிறது; ‘அழித்துப்போடும்படி’, ‘கடுஞ்சினம்’, ‘செவிகொடுத்தார்’ ஆகியவை வசனத்தின் வலிமையையும் பரிந்துரைச் சூழலையும் பேணுகின்றன.
