base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/027.yaml
  text: Remember your servants[a], Abraham, Isaac, and Jacob. Do not turn your attention to the stubbornness of this people, or to their wickedness[b], or to their sin.
translation:
  language: ta
  text: உமது ஊழியர்களாகிய ஆபிரகாம், ஈசாக்கு, யாக்கோபு ஆகியோரை நினைவுகூரும். இந்த மக்களின் பிடிவாதத்தையோ[b], அவர்களுடைய தீமையையோ, அவர்களுடைய பாவத்தையோ கவனத்தில் கொள்ளாதிரும்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நோக்காதிரும்” அல்லது “பொருட்படுத்தாதிரும்.”
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில் “கடினத்தன்மை” என்றும் பொருள்படலாம்; வேறு இடங்களில் வரும் குறிப்பான “வணங்காக் கழுத்து” என்ற உருவகம் இங்கு பயன்படுத்தப்படவில்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: זְכֹר
  choice: நினைவுகூரும்
  rationale: கடவுளை நோக்கி மோசே ஏறெடுக்கும் பரிந்துரையில் வரும் கட்டளை வடிவம். உடன்படிக்கை உறவைச் சார்ந்த வேண்டுதலின் இயல்பான பொருளை இது தருகிறது; மூலத்தில் இல்லாத ‘அருளும்’ போன்ற கருத்தைச் சேர்க்கவில்லை.
- source_word: לַעֲבָדֶיךָ
  choice: உமது ஊழியர்களாகிய
  rationale: עבד இங்கு முற்பிதாக்கள் கடவுளோடு கொண்ட உறவை மரியாதையுடன் குறிக்கிறது. அடிமைநிலையை முன்னிறுத்தாமல், இச்சூழலுக்கேற்ற உறவையும் மரியாதையையும் ‘ஊழியர்கள்’ வெளிப்படுத்துகிறது.
- source_word: לְאַבְרָהָם לְיִצְחָק וּלְיַעֲקֹב
  choice: ஆபிரகாம், ஈசாக்கு, யாக்கோபு
  rationale: தமிழ்க் கிறிஸ்தவப் பயன்பாட்டில் நன்கு அறியப்பட்ட பெயர் வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன.
- source_word: אַל תֵּפֶן אֶל
  choice: கவனத்தில் கொள்ளாதிரும்
  rationale: פנה אל என்பதன் அடிப்படைப் படிமம் ‘அதை நோக்கித் திரும்புதல்’; இவ்விண்ணப்பத்தில் அதன் பொருள் ஒன்றைக் கருத்தில் எடுத்துக்கொள்வது அல்லது அதற்குக் கவனம் கொடுப்பது. தமிழில் வேண்டுதலாக இயல்பாகவும் தெளிவாகவும் அமைகிறது.
- source_word: קְשִׁי
  choice: பிடிவாதம்
  rationale: இந்தப் பெயர்ச்சொல் கடினத்தன்மை அல்லது பிடிவாதத்தைக் குறிக்கிறது. இங்கு ஒழுக்கரீதியான மனவுறுதியின்மையை அல்ல, கீழ்ப்படிய மறுக்கும் பிடிவாதத்தைத் தெளிவாகக் காட்டுகிறது; வேறொரு எபிரெயச் சொற்றொடரின் ‘வணங்காக் கழுத்து’ உருவகத்தை இறக்குமதி செய்யவில்லை.
- source_word: הָעָם הַזֶּה
  choice: இந்த மக்கள்
  rationale: עם என்பதன் பொதுவான பொருளான ‘மக்கள்’ என்பதையும், הַזֶּה என்பதன் சுட்டுப்பொருளையும் நேரடியாகப் பாதுகாக்கிறது.
- source_word: רִשְׁעוֹ
  choice: அவர்களுடைய பொல்லாப்பு
  rationale: ரֶשַׁע இங்கு சட்டரீதியான குற்றப்பொறுப்பை மட்டும் அல்லாமல் ஒழுக்கரீதியான தீமையைக் குறிக்கிறது. ஒருமை பின்னொட்டு கூட்டுப்பெயரான ‘மக்கள்’ என்பதைக் குறிப்பதால் தமிழில் இயல்பான பன்மைச் சுட்டு பயன்படுத்தப்பட்டுள்ளது.
- source_word: חַטָּאתוֹ
  choice: அவர்களுடைய பாவம்
  rationale: חטאת இங்கு குறிப்பான ஒழுக்க மீறலைக் குறிக்கிறது. எபிரெய ஒருமை பின்னொட்டு கூட்டாகிய மக்களைக் குறிப்பதால் தமிழில் பன்மைச் சுட்டு இயல்பாக உள்ளது.
theological_decisions:
- issue: முற்பிதாக்களை עבד என்று அழைத்தல்
  choice: உமது ஊழியர்களாகிய
  alternative: உமது அடிமைகளாகிய
  rationale: இந்த வேண்டுதலில் இது ஆபிரகாம், ஈசாக்கு, யாக்கோபு ஆகியோரின் கடவுளுடனான உடன்படிக்கை உறவை மரியாதையுடன் குறிக்கும் அழைப்பு. சமூக அடிமைநிலையை முன்னிறுத்துவது இச்சூழலின் நோக்கம் அல்ல.
- issue: ‘பொல்லாப்பு’, ‘பாவம்’ ஆகியவற்றோடு வரும் ஒருமை பின்னொட்டுகள்
  choice: அவர்களுடைய பொல்லாப்பு ... அவர்களுடைய பாவம்
  alternative: அதன் பொல்லாப்பு ... அதன் பாவம்
  rationale: எபிரெயத்தில் கூட்டுப்பெயரான ‘மக்கள்’ ஒருமை இலக்கண ஒத்திசைவைப் பெறுகிறது. தமிழில் மக்களின் செயல்களைச் சொல்லும்போது பன்மைச் சுட்டு இயல்பானது; இது பொருளை மறுவிளக்கம் செய்வதல்ல.
- issue: கடவுள் மக்களின் தீமையை ‘நோக்காதிருப்பது’ என்ற வேண்டுதல்
  choice: கவனத்தில் கொள்ளாதிரும்
  alternative: பாராதிரும் / பொருட்படுத்தாதிரும்
  rationale: மூலத்தின் வேண்டுதல் கடவுளின் அறிவை மறுப்பதாக அல்லாமல், தீர்ப்பளிக்கும்போது இவற்றைக் கருத்தில் எடுத்துக்கொள்ள வேண்டாம் என்ற பரிந்துரையாக நிற்கிறது. மொழிபெயர்ப்பு இந்த வேண்டுதலின் பதற்றத்தைத் தக்கவைத்து, அதன் விளைவைப் பற்றிய மேலதிக கோட்பாட்டைச் சேர்க்கவில்லை.
translation_notes:
  register: நவீன செந்தமிழுக்கு நெருக்கமான, பொதுவாசகர்களுக்குப் புரியும் மரியாதைமிக்க வேண்டுதல் நடை பயன்படுத்தப்பட்டுள்ளது. கடவுளை நோக்கிய மரியாதைப் பன்மை கட்டளை வடிவங்களாக ‘நினைவுகூரும்’, ‘கொள்ளாதிரும்’ அமைந்துள்ளன. மூலத்தின் மூன்று இணை குற்றச்சாட்டுகளும் ‘-ஐயோ’ அமைப்பால் பாதுகாக்கப்பட்டுள்ளன.
