source:
  edition: WLC
  text: וּ/בְ/תַבְעֵרָה֙ וּ/בְ/מַסָּ֔ה וּ/בְ/קִבְרֹ֖ת הַֽתַּאֲוָ֑ה מַקְצִפִ֥ים הֱיִיתֶ֖ם אֶת יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/022.yaml
  text: And at Taberah[a], and at Massah, and at Kibroth-hattaavah, you kept provoking Yahweh to anger.
translation:
  language: ta
  text: தபேராவிலும், மாசாவிலும், கிப்ரோத்-ஹத்தாவாவிலும்[a] நீங்கள் யாவேக்குக் கோபமூட்டிக்கொண்டே இருந்தீர்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “கிப்ரோத்-ஹத்தாவா” என்பது ஓர் இடத்தின் பெயர்; சொல்லுக்குச் சொல், “வேட்கையின் கல்லறைகள்” அல்லது “ஆசையின் கல்லறைகள்” என்று பொருள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בְ/תַבְעֵרָה
  choice: தபேராவிலும்
  rationale: וּ conjunction and בְ location preposition are naturally combined with Tamil -இலும் in this list; the place name is transliterated.
- source_word: וּ/בְ/מַסָּה
  choice: மாசாவிலும்
  rationale: The location is rendered with -இலும், and the fixed place name is transliterated rather than translated.
- source_word: וּ/בְ/קִבְרֹת הַתַּאֲוָה
  choice: கிப்ரோத்-அத்தாவாவிலும்
  rationale: This is a fixed wilderness place name, so it is transliterated; its lexical meaning is supplied in a footnote.
- source_word: מַקְצִפִים הֱיִיתֶם
  choice: கோபமூட்டிக்கொண்டே இருந்தீர்கள்
  rationale: The Hiphil participle with היה expresses continuing or characteristic past action. This Tamil construction preserves both the causative sense and the durative force.
- source_word: אֶת יְהוָה
  choice: யாவேக்கு
  rationale: The direct-object construction identifies Yahweh as the one provoked; Tamil idiom expresses the person caused to become angry with the dative. The divine name is transliterated.
theological_decisions:
- issue: யְהוָה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: The Hebrew text gives the divine covenant name directly; transliteration preserves that name without replacing it with a title.
translation_notes:
  register: நவீனத் தரத் தமிழில், எளிதில் புரியும் அதேவேளையில் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. இடப்பெயர்கள் மொழிபெயர்க்கப்படாமல் தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளன; தொடர்ச்சியான கடந்தகாலச் செயலைக் காட்ட “கோபமூட்டிக்கொண்டே இருந்தீர்கள்” பயன்படுத்தப்பட்டுள்ளது.
