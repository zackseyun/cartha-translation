source:
  edition: WLC
  text: הֶ֤רֶף מִמֶּ֨/נִּי֙ וְ/אַשְׁמִידֵ֔/ם וְ/אֶמְחֶ֣ה אֶת שְׁמָ֔/ם מִ/תַּ֖חַת הַ/שָּׁמָ֑יִם וְ/אֶֽעֱשֶׂה֙ אֽוֹתְ/ךָ֔ לְ/גוֹי עָצ֥וּם וָ/רָ֖ב מִמֶּֽ/נּוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/014.yaml
  text: Leave me alone[a], so that I may destroy them and blot out their name from under the heavens[b]; and I will make you into a nation mightier and more numerous than they are.
translation:
  language: ta
  text: “அவர்களை அழித்தும், வானங்களுக்குக் கீழிருந்து அவர்களுடைய பெயரைத் துடைத்தழித்தும் விடும்படி என்னை விட்டுவிடு[a]. உன்னை அவர்களைவிட வலிமைமிக்கவும் எண்ணிக்கையில் அதிகமானதுமான ஒரு மக்களினமாக ஆக்குவேன்.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என்னை விட்டுவிடு; நான் அவர்களை அழித்து, வானங்களுக்குக் கீழிருந்து அவர்களுடைய பெயரைத் துடைத்தழிப்பேன்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶרֶף מִמֶּנִּי
  choice: என்னை விட்டுவிடு
  rationale: רפה என்ற கட்டளைச்சொல் מן + பதிலிப்பெயருடன், தலையிடாமல் விலகியிருக்க அல்லது தடுப்பதை நிறுத்தச் சொல்லும் மரபுத்தொடர். ‘என்னை விட்டுவிடு’ என்பது இயல்பான நவீனத் தமிழ்; மூலத்தில் இல்லாத கருத்தைச் சேர்ப்பதில்லை.
- source_word: וְאַשְׁמִידֵם
  choice: அப்போது நான் அவர்களை அழித்து
  rationale: שׁמד என்பது முற்றாக அழித்தலைக் குறிக்கும் வலிமையான சொல். கட்டளையைத் தொடர்ந்து வரும் waw வடிவம் இங்கு விளைவு அல்லது தொடர்ச்சியை உணர்த்துவதால் ‘அப்போது’ என மொழிபெயர்க்கப்பட்டது; இதை வெறும் இணைப்பாகவும் புரிந்துகொள்ள முடியும் என்பதால் அடிக்குறிப்பு [a] தரப்பட்டுள்ளது.
- source_word: וְאֶמְחֶה אֶת־שְׁמָם
  choice: அவர்களுடைய பெயரைத் துடைத்தழிப்பேன்
  rationale: מחה + ‘பெயர்’ என்ற மரபுத்தொடர் பெயர், நினைவு, இருப்பு ஆகியவை நீக்கப்படுவதைச் சுட்டுகிறது. ‘துடைத்தழிப்பேன்’ அழித்தல் மற்றும் அழித்தொழித்தல் ஆகிய நுணுக்கங்களை இயல்பாக இணைக்கிறது.
- source_word: מִתַּחַת הַשָּׁמַיִם
  choice: வானங்களின் கீழிருந்து
  rationale: மூல எபிரெயத்தில் ‘வானங்கள்’ பன்மையில் உள்ளது. தமிழ் வாசிப்பிலும் இயல்பாக இருக்கும்படி மூல வடிவம் பாதுகாக்கப்பட்டது.
- source_word: וְאֶעֱשֶׂה אֹתְךָ לְגוֹי
  choice: உன்னை ... ஒரு மக்களினமாக ஆக்குவேன்
  rationale: עשה + பொருள் + ל என்பது ஒருவரை அல்லது ஒன்றை வேறொன்றாக ஆக்குவதை வெளிப்படுத்துகிறது. גוי இங்கு அரசியல் நாட்டை மட்டும் அல்லாமல் மக்கள் கூட்டத்தையும் குறிக்கக்கூடியதால் ‘மக்களினம்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: עָצוּם וָרָב מִמֶּנּוּ
  choice: அவர்களைவிட வலிமையும் எண்ணிக்கையில் பெருக்கமும் கொண்ட
  rationale: עָצוּם வலிமையையும், רָב இச்சூழலில் மிகுந்த எண்ணிக்கையையும் குறிக்கின்றன; מִמֶּנּוּ ஒப்பீட்டைச் சுட்டுகிறது. எபிரெய ஒருமைச் சுட்டு இஸ்ரவேலைக் கூட்டு மக்களாகக் குறிப்பதால் தமிழில் இயல்பான பன்மை ‘அவர்களைவிட’ பயன்படுத்தப்பட்டது.
theological_decisions:
- issue: தீர்ப்பைப் பற்றிய இறை அறிவிப்பும் மோசேயை அதைவிடப் பெரிய மக்களினமாக ஆக்குவதாகக் கூறியதும்
  choice: அழிவின் அறிவிப்பையும் மோசே குறித்த வாக்கையும் கதையில் உள்ள நேரடியான இறை உரையாகத் தெளிவாக மொழிபெயர்த்தல்
  alternative: இது முதன்மையாக மோசேக்கு வைக்கப்பட்ட சோதனை அல்லது வெறும் சொல்லாட்சிக்குரிய மிரட்டல் என்று மொழிபெயர்ப்பிலேயே விளக்குதல்
  rationale: எபிரெய உரை தீர்ப்பையும் வாக்கையும் நேரடியாக முன்வைக்கிறது. அதன் நோக்கத்தைப் பற்றிய பிற்கால விளக்கத்தைச் சேர்க்காமல், உரையிலுள்ள இறையியல் பதற்றம் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்கள் புரிந்துகொள்ளும் கண்ணியமான நேரடி நடை பயன்படுத்தப்பட்டுள்ளது. ‘வானங்களின்’ என்ற மூலத்தின் பன்மையும், அழிவு மற்றும் வாக்குறுதி இடையிலான இறையியல் பதற்றமும் பாதுகாக்கப்பட்டுள்ளன.
