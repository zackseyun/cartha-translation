revisions:
- from: வனாந்தரத்தில் உன் கடவுளாகிய யாவேக்குக் கடும் கோபம் உண்டாகும்படி நீ செய்ததை நினைவில் கொள்—மறந்துவிடாதே.[a] நீ எகிப்து நாட்டிலிருந்து புறப்பட்ட நாள் முதல் நீங்கள் இந்த இடத்திற்கு வந்து சேர்ந்த நாள்வரை, யாவேக்கு எதிராகக் கலகம் செய்துகொண்டே இருந்தீர்கள்.[b]
  to: வனாந்தரத்தில் உன் கடவுளாகிய யாவே கடும் கோபமடையச் செய்ததை நினைவில் கொள்—மறந்துவிடாதே.[a] நீ எகிப்து நாட்டிலிருந்து புறப்பட்ட நாள்முதல், நீங்கள் இந்த இடத்திற்கு வந்ததுவரை, யாவேக்கு எதிராகக் கலகக்காரர்களாகவே இருந்தீர்கள்.[b]
  rationale: The revision retains every substantive element of the Hebrew and the intended English audit trail, while improving Tamil idiom. It preserves the source’s singular ‘நீ’ in the exodus clause and plural ‘நீங்கள்/இருந்தீர்கள்’ in the later clause. ‘கலகக்காரர்களாகவே இருந்தீர்கள்’ reflects the participial characterization and the extended time span without introducing a doctrinal interpretation.
