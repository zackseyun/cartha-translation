base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/007.yaml
  text: Remember—do not forget—how you provoked Yahweh your God to wrath in the wilderness[a]. From the day you came out of the land of Egypt until you came to this place[b], you have been rebellious against Yahweh.
translation:
  language: ta
  text: வனாந்தரத்தில் உன் கடவுளாகிய யாவே கடும் கோபமடையச் செய்ததை நினைவில் கொள்—மறந்துவிடாதே.[a] நீ எகிப்து நாட்டிலிருந்து புறப்பட்ட நாள்முதல், நீங்கள் இந்த இடத்திற்கு வந்ததுவரை, யாவேக்கு எதிராகக் கலகக்காரர்களாகவே இருந்தீர்கள்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'வேறுவிதமாக: “வனாந்தரத்தில் உன் கடவுளாகிய யாவேயைக் கோபப்படுத்தினதை.”'
    reason: lexical_alternative
  - marker: b
    text: 'சொல்லுக்குச் சொல்: “யாவேயுடன்”; இங்கு சூழலில் அதன் பொருள் “யாவேக்கு எதிராக.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: זְכֹר אַל תִּשְׁכַּח
  choice: நினைவில் கொள்—மறந்துவிடாதே
  rationale: கட்டளையையும் அதை வலியுறுத்தும் எதிர்மறைக் கட்டளையையும் தனித்தனியாகப் பாதுகாத்து, எபிரெய மொழியின் அழுத்தத்தை இயல்பான தமிழில் தருகிறது.
- source_word: הִקְצַפְתָּ
  choice: கடும் கோபம் உண்டாகும்படி நீ செய்ததை
  rationale: ஹிஃபில் வடிவின் காரணவினைப் பொருளைப் பாதுகாக்கிறது; வெறும் ‘கோபப்படுத்தினாய்’ என்பதைவிட மூலத்தின் வலிமையை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் பரவலாகப் புரியக்கூடிய ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: בַּמִּדְבָּר
  choice: வனாந்தரத்தில்
  rationale: யாத்திராகமப் பின்னணிக்கு ஏற்ற, மணற்பாலை மட்டும் குறிக்காத மரபானதும் புரிந்துகொள்ளக்கூடியதுமான தமிழ் சொல்.
- source_word: יָצָאתָ מֵאֶרֶץ מִצְרַיִם
  choice: நீ எகிப்து நாட்டிலிருந்து புறப்பட்ட
  rationale: இரண்டாம் நபர் ஒருமையைப் பாதுகாத்து, வெளியேறுதலை இயல்பான தமிழில் கூறுகிறது.
- source_word: עַד בֹּאֲכֶם עַד הַמָּקוֹם הַזֶּה
  choice: நீங்கள் இந்த இடத்திற்கு வந்து சேர்ந்த நாள்வரை
  rationale: இங்கு மூலத்தில் ஒருமையிலிருந்து பன்மைக்கு ஏற்படும் மாற்றத்தைத் தமிழிலும் வெளிப்படையாகப் பாதுகாக்கிறது; ‘வந்து சேர்ந்த’ என்பது வருகை நிறைவடைந்ததை இயல்பாகக் காட்டுகிறது.
- source_word: מַמְרִים הֱיִיתֶם
  choice: கலகம் செய்துகொண்டே இருந்தீர்கள்
  rationale: מָרָה என்பதிலுள்ள அதிகாரத்திற்கு எதிரான தொடர்ச்சியான எதிர்ப்பை, குறிப்பிடப்பட்ட காலப்பரப்பு முழுவதும் நீடித்த செயலாகக் காட்டுகிறது.
- source_word: עִם יְהוָה
  choice: யாவேக்கு எதிராக
  rationale: עִם என்பதன் அடிப்படைப் பொருள் ‘உடன்’ என்றாலும், ‘கலகம் செய்தல்’ என்ற சூழலில் எதிர்நிலையை இயல்பான தமிழில் தெரிவிக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் நேரடியாக வரும் உடன்படிக்கைப் பெயரைப் பட்டமாக மாற்றாமல் ஒலிபெயர்க்கிறது.
- issue: இஸ்ரவேலின் கலகத்தின் காலநீட்சி
  choice: கலகம் செய்துகொண்டே இருந்தீர்கள்
  alternative: கலகக்காரர்களாக இருந்தீர்கள்
  rationale: எகிப்திலிருந்து புறப்பட்ட நாள் முதல் தற்போதைய இடம் வரை தொடர்ந்த நடத்தை என வசனம் சித்தரிப்பதைத் தெளிவாக்குகிறது; குணநிலையை மட்டும் கூறுவதைத் தவிர்க்கிறது.
- issue: עִם יְהוָה என்பதிலுள்ள உறவுப்பொருள்
  choice: யாவேக்கு எதிராக
  alternative: யாவேயுடன்
  rationale: מַמְרִים என்ற ‘கலகம் செய்தல்’ வினையுடன், சூழல் பகைமையான அல்லது எதிர்நிலை உறவைக் குறிக்கிறது; அடிப்படை ‘உடன்’ பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் dignified ஆனால் பொதுவாசகர்களுக்குப் புரியும் நடையைப் பயன்படுத்துகிறது. ‘நீ’ என்பதிலிருந்து ‘நீங்கள்’ என்பதற்கான மூலமொழி எண் மாற்றம் திட்டமிட்டு பாதுகாக்கப்பட்டுள்ளது. ‘நினைவில் கொள்—மறந்துவிடாதே’ என்ற இணைப்பு எபிரெய வலியுறுத்தலைக் காக்கிறது.
