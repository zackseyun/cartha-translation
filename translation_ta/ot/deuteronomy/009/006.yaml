  text: וְ/יָדַעְתָּ֗ כִּ֠י לֹ֤א בְ/צִדְקָֽתְ/ךָ֙ יְהוָ֣ה אֱ֠לֹהֶי/ךָ נֹתֵ֨ן לְ/ךָ֜ אֶת הָ/אָ֧רֶץ הַ/טּוֹבָ֛ה הַ/זֹּ֖את לְ/רִשְׁתָּ֑/הּ כִּ֥י עַם קְשֵׁה עֹ֖רֶף אָֽתָּה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/006.yaml
  text: So know that it is not because of your righteousness that Yahweh your God is giving you this good land to possess[a], for you are a stiff-necked people.
translation:
  language: ta
  text: ஆகவே, உங்கள் நீதியின் காரணமாக அல்ல, உங்கள் இறைவனாகிய யாவே இந்த நல்ல நாட்டை உங்களுக்குச் சொந்தமாக்கிக் கொள்வதற்காக உங்களுக்குத் தருகிறார் என்பதை அறிந்துகொள்ளுங்கள்; ஏனெனில் நீங்கள் பிடிவாதமுள்ள மக்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சுதந்தரித்துக்கொள்ள.” எபிரெய வினைச்சொல் சுதந்தரமாகப் பெறுவதைக் குறிக்கலாம்; ஆனால் உபாகமத்தில் அது நாட்டைக் கைப்பற்றி உடைமையாக்கிக் கொள்வதையும் அடிக்கடி உள்ளடக்குகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָדַעְתָּ
  choice: ஆகவே ... என்று எண்ணாதீர்கள்
  rationale: ידע என்பதன் Qal perfect 2ms வடிவம் இச்சூழலில் அறிவுறுத்தல் வலிமையைக் கொண்டது. முந்தைய வாதத்திலிருந்து வரும் முடிவை וְ சுட்டுவதால் ‘ஆகவே’ என மொழிபெயர்க்கப்பட்டது; தமிழில் இயல்பாக இருக்க, அறிய வேண்டிய மறுப்புக் கருத்து ‘என்று எண்ணாதீர்கள்’ என அமைக்கப்பட்டது.
- source_word: לֹא בְצִדְקָתְךָ
  choice: உங்கள் நீதியின் காரணமாக ... என்று எண்ணாதீர்கள்
  rationale: בְ இங்கு கருவியையல்ல, அடிப்படையையோ காரணத்தையோ குறிக்கிறது. நாட்டைப் பெறுவதற்கான காரணம் இஸ்ரவேலரின் சொந்த நீதி அல்ல என்பதைத் தெளிவாகக் காட்டுகிறது.
- source_word: צִדְקָה
  choice: நீதி
  rationale: இங்கு நீதித்துறை சார்ந்த நியாயத்தைவிட ஒழுக்க மற்றும் உடன்படிக்கைச் சூழலிலான நேர்மையைச் சுட்டுகிறது. ‘நீதி’ வேதாகமப் பயன்பாட்டையும் கருத்தின் செறிவையும் காக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தேவனுடைய தனிப்பெயரை பொதுப் பட்டப்பெயராக மாற்றாமல், எபிரெய உச்சரிப்புக்கு அண்மையான தமிழாக்கமாக வழங்குகிறது.
- source_word: אֱלֹהֶיךָ
  choice: உங்கள் இறைவன்
  rationale: இரண்டாம் நபர் ஒருமை பின்னொட்டைக் கொண்ட உடன்படிக்கை உறவுச் சொற்றொடர். தமிழில் மரியாதை மற்றும் கூட்டுமுகவரியை இயல்பாக வெளிப்படுத்த ‘உங்கள்’ பயன்படுத்தப்பட்டது.
- source_word: נֹתֵן לְךָ
  choice: உங்களுக்குத் தருகிறார்
  rationale: பங்கேற்பு வடிவம் சூழலில் நிகழ்ந்து கொண்டிருக்கும் அல்லது உடனடியாக நிகழவிருக்கும் கொடையைச் சுட்டுகிறது; தமிழ் நிகழ்காலம் இதை இயல்பாக ஏந்துகிறது.
- source_word: הָאָרֶץ הַטּוֹבָה הַזֹּאת
  choice: இந்த நல்ல நாடு
  rationale: சுட்டுப்பெயர் மற்றும் மதிப்பீட்டுப் பெயரடை இரண்டையும் காக்கிறது. வாக்குத்தத்தப் பிரதேசத்தைத் தமிழில் இயல்பாகக் குறிக்க ‘நாடு’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: לְרִשְׁתָּהּ
  choice: சொந்தமாக்கிக் கொள்ள
  rationale: ירשׁ என்பது உபாகமத்தில் சுதந்தரமாகப் பெறுதல் மட்டுமன்றி நாட்டைக் கைப்பற்றி உடைமையாக்கிக் கொள்வதையும் குறிக்கிறது. இத்தேர்வு உடைமையாக்கும் செயற்பாட்டை வெளிப்படுத்துகிறது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: இரண்டாவது כִּי, முந்தைய மறுப்புக்கான விளக்கக் காரணத்தை அறிமுகப்படுத்துகிறது.
- source_word: עַם קְשֵׁה עֹרֶף
  choice: பிடிவாதமுள்ள மக்கள்
  rationale: சொல்லுக்கு சொல் ‘கழுத்து கடினமான மக்கள்’ என்பது தமிழில் அர்த்தம் தெளிவில்லாத உருவகமாகிவிடும். உருவகத்தின் குறிக்கோளான அடங்காமை மற்றும் முரட்டுப் பிடிவாதத்தை இயல்பான தமிழில் வழங்குகிறது.
theological_decisions:
- issue: இஸ்ரவேல் நாட்டைப் பெறுவதற்கான காரணம்
  choice: இஸ்ரவேலரின் சொந்த நீதி அந்த நாட்டை யாவே கொடுப்பதற்கான காரணமல்ல என்பதை நேரடியாக மறுத்தல்
  alternative: இதை உடன்படிக்கைத் தகுதியின்மையை வலியுறுத்தாத பொதுவான தாழ்மை அறிவுரையாக மட்டும் வழங்குதல்
  rationale: எபிரெய உரை இஸ்ரவேலின் நீதியை அடிப்படையாக மறுத்து, தேவனுடைய கொடையையும் மக்களின் பிடிவாதத்தையும் நேரெதிராக நிறுத்துகிறது. வசனத்துக்கு அப்பாற்பட்ட கோட்பாட்டைச் சேர்க்காமல் இந்த இறையியல் பதற்றம் காக்கப்படுகிறது.
- issue: கூட்டுத்தன்மையுள்ள ஒருமை முகவரி
  choice: இஸ்ரவேலை ஒரே கூட்டுச் சமூகமாகக் கருதும் முகவரியை, இயல்பான தமிழ் மரியாதை/பன்மை வடிவமான ‘உங்கள், நீங்கள்’ மூலம் வழங்குதல்
  alternative: இலக்கண ஒருமையைப் பின்பற்றி ‘உன், நீ’ என்று மொழிபெயர்த்தல்
  rationale: எபிரெயம் இஸ்ரவேலைக் கூட்டுத்தன்மையுள்ள ஒருமையாக அழைக்கிறது. நவீனத் தமிழில் முழு மக்களையும் நோக்கிய உரைக்கு ‘நீங்கள்’ இயல்பாகவும் கண்ணியமாகவும் இருந்து, கூட்டுச் சுட்டுதலைக் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. ‘யாவே’ தனிப்பெயராக வைக்கப்பட்டது. எபிரெய ‘கழுத்து கடினமான’ என்ற உருவகம் தமிழில் உடனடியாகத் தெளிவாகாததால் அதன் பொருள் ‘பிடிவாதமுள்ள’ என இயல்பாக்கப்பட்டது. அடிக்குறிப்பு குறியீடு முதன்மை உரையில் இணைக்கப்பட்டுள்ளது.
