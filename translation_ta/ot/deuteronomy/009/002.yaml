translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. மூலத்தின் வலிமைமிக்க விளக்கமும் வினாவுரையின் தாக்கமும் பாதுகாக்கப்பட்டுள்ளன; ‘ஆனாக்கின் மகன்கள்’ என்ற நேரடி வடிவத்துக்கான இயல்பான இனப்பெயர் மாற்று அடிக்குறிப்பில் தரப்பட்டுள்ளது.
