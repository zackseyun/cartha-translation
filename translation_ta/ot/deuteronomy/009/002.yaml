source:
  edition: WLC
  text: עַֽם גָּד֥וֹל וָ/רָ֖ם בְּנֵ֣י עֲנָקִ֑ים אֲשֶׁ֨ר אַתָּ֤ה יָדַ֨עְתָּ֙ וְ/אַתָּ֣ה שָׁמַ֔עְתָּ מִ֣י יִתְיַצֵּ֔ב לִ/פְנֵ֖י בְּנֵ֥י עֲנָֽק־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/002.yaml
  text: 'a great and tall people[a], the sons of Anak, whom you know, and of whom you have heard: ‘Who can stand before the sons of Anak?’'
translation:
  language: ta
  text: பெரியதும் உயரமானதுமான மக்கள்—ஆனாக்கின் மகன்கள்; அவர்களை நீ அறிந்திருக்கிறாய்; ‘ஆனாக்கின் மகன்களுக்கு முன்பாக யார் நிலைத்து நிற்க முடியும்?’ என்று நீ கேட்டிருக்கிறாய்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עַם גָּדוֹל וָרָם
  choice: பெரியதும் உயரமானதுமான மக்கள்
  rationale: עַם என்பது இங்கு ஒரு மக்களினத்தைக் குறிக்கிறது. גָּדוֹל உடல் அளவு அல்லது வலிமையின் பெருமையையும், רָם அவர்களின் உயரமான உடல்வாகையும் குறிக்கின்றன; ஆகவே இயல்பான நவீன தமிழில் இவ்வாறு மொழிபெயர்க்கப்பட்டது.
- source_word: בְּנֵי עֲנָקִים / בְּנֵי עֲנָק
  choice: ஆனாக்கின் மகன்கள்
  rationale: எபிரெயச் சொற்றொடரின் நேரடியான உறவுமுறை வடிவத்தைத் தக்கவைத்து, ஆனாக் என்ற பெயரிலிருந்து வந்த மக்களைக் குறிக்கிறது. இனப்பெயராக மட்டும் மாற்றாமல் மூலத்தின் உருவகத்தையும் ஒத்திசைவையும் பாதுகாக்கிறது.
- source_word: אֲשֶׁר אַתָּה יָדַעְתָּ
  choice: அவர்களை நீ அறிந்திருக்கிறாய்
  rationale: எபிரெய நிறைவுவினையின் தற்போதைய தொடர்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது; இஸ்ரவேலருக்கு ஏற்கெனவே தெரிந்த மக்களைக் குறிக்கிறது.
- source_word: וְאַתָּה שָׁמַעְתָּ
  choice: என்று சொல்லப்படுவதையும் நீ கேட்டிருக்கிறாய்
  rationale: அடுத்து வரும் மேற்கோளே அவர்கள் கேட்ட செய்தி என்பதைத் தமிழில் தெளிவாக இணைக்கிறது; மூலத்தில் வெளிப்படையாக இல்லாத குறிப்பிட்ட பேசுபவரைச் சேர்க்கவில்லை.
- source_word: מִי יִתְיַצֵּב לִפְנֵי
  choice: யாரால் ... முன்பாக நிலைத்து நிற்க முடியும்?
  rationale: יִתְיַצֵּב לִפְנֵי என்பதன் நேரடியான ‘முன்பாக நிற்றல்’ வடிவத்தையும், எதிரியை எதிர்கொண்டு தாக்குப்பிடித்தல் என்ற சூழல்சார் பொருளையும் தக்கவைக்கிறது.
