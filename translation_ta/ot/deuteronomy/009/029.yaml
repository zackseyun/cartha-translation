  text: וְ/הֵ֥ם עַמְּ/ךָ֖ וְ/נַחֲלָתֶ֑/ךָ אֲשֶׁ֤ר הוֹצֵ֨אתָ֙ בְּ/כֹחֲ/ךָ֣ הַ/גָּדֹ֔ל וּ/בִֽ/זְרֹעֲ/ךָ֖ הַ/נְּטוּיָֽה׃פ
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/029.yaml
  text: But they are your people and your inheritance[b][a], whom you brought out by your great power and by your outstretched arm.
translation:
  language: ta
  text: ஆனால்,[a] அவர்கள் உமது மக்களும் உமது சுதந்தரமும் ஆவர். அவர்களை உமது பெரும் வல்லமையாலும் நீட்டப்பட்ட உமது கரத்தாலும்[b] வெளியே கொண்டுவந்தீர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘மேலும், அவர்கள் உமது மக்களும் உமது சுதந்தரமும் ஆவர்.’ எபிரெய இணைப்புச்சொல்லை வெறுமனே ‘மேலும்’ என்று மொழிபெயர்க்கலாம்; இங்கு ‘ஆனால்’ என்பது மோசேயின் மன்றாட்டிலுள்ள மாறுபாட்டு வலியுறுத்தலை வெளிப்படுத்துகிறது.
    reason: lexical_alternative
  - marker: b
    text: ‘நீட்டப்பட்ட கரம்’ என்பது ஆண்டவரின் வல்லமையான விடுதலையைக் குறிக்கும் யாத்திராகமச் சொல்வழக்கு.
    reason: cross_reference
lexical_decisions:
- source_word: וְהֵם
  choice: ஆனால், அவர்கள்
  rationale: וְ என்பதற்கு அடிப்படையில் ‘மேலும்/அவர்கள்’ என்று பொருள் கொள்ளலாம்; இங்கு இஸ்ரவேலை அழிக்க வேண்டாம் என்ற மோசேயின் மன்றாட்டில் எதிர்மறை ஒப்பீடு இருப்பதால், ‘ஆனால்’ என்பது சூழலின் வலியுறுத்தலை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: עַמְּךָ
  choice: உமது மக்கள்
  rationale: עַם என்பது இங்கு உடன்படிக்கை உறவில் கடவுளுக்குரிய மக்களைக் குறிக்கிறது; ‘உமது மக்கள்’ என்பது நேரானதும் இயல்பானதும் ஆகும்.
- source_word: וְנַחֲלָתֶךָ
  choice: உமது சுதந்தரம்
  rationale: נַחֲלָה என்பது சுதந்தரம் அல்லது உரிமையாகப் பெற்ற பங்கைக் குறிக்கிறது. ‘சுதந்தரம்’ உடன்படிக்கை சார்ந்த உரிமை மற்றும் சொந்தத்தன்மையைப் பாதுகாக்கிறது.
- source_word: אֲשֶׁר הוֹצֵאתָ
  choice: அவர்களை ... வெளியே கொண்டுவந்தீர்
  rationale: הוֹצֵאתָ என்பது ‘வெளியே வரச் செய்தீர்’ என்ற பொருளில் யாத்திராகம விடுதலையைச் சுட்டும் வழக்கமான சொற்றொடர்; தமிழில் ‘வெளியே கொண்டுவந்தீர்’ இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: בְּכֹחֲךָ הַגָּדֹל
  choice: உமது பெரும் வல்லமையால்
  rationale: כֹּחַ என்பது வலிமை அல்லது ஆற்றலைக் குறிக்கிறது; גָּדוֹל என்பதையும் கருவிப் பொருளுடைய בְ என்பதையும் ‘பெரும் வல்லமையால்’ நேராகப் பிரதிபலிக்கிறது.
- source_word: וּבִזְרֹעֲךָ הַנְּטוּיָה
  choice: நீட்டப்பட்ட உமது கரத்தால்
  rationale: זְרוֹעַ என்ற ‘கரம்’ உருவகத்தையும் נְטוּיָה என்ற ‘நீட்டப்பட்ட’ பண்பையும் தக்கவைத்து, கடவுளின் வல்லமையான விடுதலையைச் சித்தரிக்கும் எபிரெய உருவகத்தைப் பாதுகாக்கிறது.
theological_decisions:
- issue: கடவுளின் செயலுக்கான மனித உடலுறுப்பு உருவகம்
  choice: ‘நீட்டப்பட்ட உமது கரம்’ என்ற உருவகத்தை அப்படியே தக்கவைத்தல்
  alternative: ‘உமது வல்லமையான செயல்கள்’ என்று கருத்தை மட்டும் மொழிபெயர்த்தல்
  rationale: எபிரெய உரை உடல்சார்ந்த உருவகத்தை நோக்கத்துடன் பயன்படுத்துகிறது; இது யாத்திராகம விடுதலையின் இலக்கிய மற்றும் இறையியல் வலிமையைத் தாங்குவதால் அதை அருவமாக்காமல் பாதுகாக்கப்படுகிறது.
- issue: נַחֲלָה என்பதிலுள்ள உடன்படிக்கை சார்ந்த உரிமை மொழி
  choice: ‘உமது சுதந்தரம்’
  alternative: ‘உமது உடைமை’ அல்லது ‘உமது மரபுரிமை’
  rationale: மோசே இஸ்ரவேலுக்கும் கடவுளுக்கும் இடையிலான தனிப்பட்ட உடன்படிக்கை உறவை முன்னிறுத்துகிறார். ‘சுதந்தரம்’ உரையின் உரிமை மற்றும் பங்கு சார்ந்த நுட்பத்தைத் தக்கவைக்கிறது; ‘உடைமை’ அந்த நுட்பத்தைத் தட்டையாக்கக்கூடும்.
translation_notes:
  register: நவீன தரத் தமிழில், மரியாதைமிக்க ‘நீர்/உமது’ இறைமொழி நடையும் சாதாரண வாசகர்களுக்குப் புரியும் சொற்றொடர்களும் பயன்படுத்தப்பட்டுள்ளன. எபிரெயத்தின் உடன்படிக்கைச் சொல்வழக்கும் உருவகமும் தேவையற்ற விளக்கவுரையின்றித் தக்கவைக்கப்பட்டுள்ளன.
