source:
  edition: WLC
  text: וּֽ/בְ/אַהֲרֹ֗ן הִתְאַנַּ֧ף יְהוָ֛ה מְאֹ֖ד לְ/הַשְׁמִיד֑/וֹ וָֽ/אֶתְפַּלֵּ֛ל גַּם בְּעַ֥ד אַהֲרֹ֖ן בָּ/עֵ֥ת הַ/הִֽוא־
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/020.yaml
  text: And Yahweh was very angry with Aaron[a], to destroy him; and I also prayed for Aaron at that time.
translation:
  language: ta
  text: ஆரோன்மீதும் யாவே மிகவும் கோபங்கொண்டு, அவனை அழித்துப்போட எண்ணினார்.[a] அந்த நேரத்தில் ஆரோனுக்காகவும் நான் ஜெபித்தேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ஆரோன்மீதும்” என்பதற்கு “ஆரோனுக்கு எதிராகவும்” என்றும் மொழிபெயர்க்கலாம்; இச்சூழலில் எபிரெய முன்னிடைச்சொல் இருவிதமாகவும் புரிந்துகொள்ளப்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְאַהֲרֹן
  choice: ஆரோன்மீதும்
  rationale: கோபத்தைக் குறிக்கும் வினையுடன் வரும் בְ முன்னிடைச்சொல் இங்கு கோபம் யார்மீது செலுத்தப்பட்டது என்பதைக் காட்டுகிறது. ‘ஆரோன்மீதும்’ என்பது முந்தைய சூழலுடன் உள்ள ‘மேலும்’ என்ற தொடர்பையும் இயல்பாகக் காக்கிறது.
- source_word: הִתְאַנַּף יְהוָה מְאֹד
  choice: யாவே மிகவும் கோபங்கொண்டு
  rationale: Hitpael வினை தீவிரமான கோபத்தைக் குறிக்கிறது; מְאֹד அதன் தீவிரத்தை மேலும் வலியுறுத்துகிறது. தமிழில் இயல்பான வாக்கிய ஓட்டத்துடன் இரண்டையும் வெளிப்படுத்துகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய தனிப்பெயரான יהוה-ஐ ஒரு பட்டப்பெயரால் மாற்றாமல், தமிழில் அதன் வழக்கமான ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: לְהַשְׁמִידוֹ
  choice: அவனை அழித்துப்போட எண்ணினார்
  rationale: לְ + infinitive இங்கு யாவேயின் கோபத்தின் நோக்கம் அல்லது எண்ணத்தைச் சுட்டுகிறது. שׁמד-ன் கடுமையான அழிவு உணர்வை ‘அழித்துப்போட’ காக்கிறது; தமிழ் முழு வாக்கியமாக இயங்க ‘எண்ணினார்’ வெளிப்படையாகச் சேர்க்கப்பட்டுள்ளது.
- source_word: וָאֶתְפַּלֵּל
  choice: நான் மன்றாடினேன்
  rationale: פלל Hitpael பொதுவாக ‘ஜெபித்தல்’ எனினும், בְּעַד உடன் இங்கு ஒருவருக்காக வேண்டிக்கொள்ளும் பரிந்துரைச் செயலைக் குறிக்கிறது. ‘மன்றாடினேன்’ என்பது சூழலை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: גַּם בְּעַד אַהֲרֹן
  choice: ஆரோனுக்காகவும்
  rationale: גַּם என்பது மோசே மக்களுக்காக வேண்டியதோடு ஆரோனுக்காகவும் வேண்டியதைச் சேர்க்கிறது; בְּעַד பரிந்துரையின் பயனாளியைக் குறிக்கிறது.
- source_word: בָּעֵת הַהִוא
  choice: அந்த நேரத்தில்
  rationale: விவரிக்கப்படும் அதே நிகழ்வுக் காலத்தை நேரடியாகவும் இயல்பாகவும் சுட்டுகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலத்தில் பட்டப்பெயர் அல்ல, உடன்படிக்கையின் தனிப்பெயர் நேரடியாக உள்ளது. ஆகவே தனிப்பெயரின் தன்மையை ஒலிபெயர்ப்பு காக்கிறது.
- issue: லְהַשְׁמִידוֹ குறிக்கும் நோக்கம்
  choice: அவனை அழித்துப்போட எண்ணினார்
  alternative: அவனை அழித்துப்போடும்படி / அவனை அழிப்பதற்காக
  rationale: இறைவனுடைய கோபம் ஆரோனை அழிக்கும் நோக்கை எட்டியதாக உரை வலுவாகக் கூறுகிறது. தமிழில் தவறாக வேறொருவருக்குக் கொடுக்கப்பட்ட கட்டளையாகப் புரியாதபடி நோக்கத்தைத் தெளிவாக்குகிறது; ஆனால் நிகழ்ந்து முடிந்த அழிவாக மாற்றவில்லை.
- issue: மோசேயின் செயல் ஜெபமா அல்லது பரிந்துரையா
  choice: ஆரோனுக்காகவும் நான் மன்றாடினேன்
  alternative: ஆரோனுக்காகவும் நான் ஜெபித்தேன்
  rationale: வினையின் அடிப்படைப் பொருள் ஜெபித்தல்; בְּעַד காரணமாக இங்கு அது ஒருவருக்காக வேண்டுதல் என்பதால் ‘மன்றாடினேன்’ சூழல்சார் வலிமையை அளிக்கிறது, தனிப்பட்ட கோட்பாட்டைச் சேர்க்காது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டது. ‘அழித்துப்போட’ மூலத்தின் கடுமையை காக்கிறது; ‘மன்றாடினேன்’ பரிந்துரைச் சூழலை இயல்பாகத் தெரிவிக்கிறது. அடிக்குறிப்பு குறியீடு தொடர்புடைய முதல் வாக்கியத்திலேயே இடப்பட்டுள்ளது.
