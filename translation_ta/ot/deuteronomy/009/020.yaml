    issue: “மன்றாடினேன்” over-specifies Moses’ action.
    rationale: וָאֶתְפַּלֵּל means “and I prayed.” In this context prayer is on Aaron’s behalf, but the verb itself does not necessarily assert the heightened pleading expressed by “மன்றாடினேன்.”
