  text: וַ/יִּתֵּ֨ן יְהוָ֜ה אֵלַ֗/י אֶת שְׁנֵי֙ לוּחֹ֣ת הָֽ/אֲבָנִ֔ים כְּתֻבִ֖ים בְּ/אֶצְבַּ֣ע אֱלֹהִ֑ים וַ/עֲלֵי/הֶ֗ם כְּֽ/כָל הַ/דְּבָרִ֡ים אֲשֶׁ֣ר דִּבֶּר֩ יְהוָ֨ה עִמָּ/כֶ֥ם בָּ/הָ֛ר מִ/תּ֥וֹךְ הָ/אֵ֖שׁ בְּ/י֥וֹם הַ/קָּהָֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/010.yaml
  text: And Yahweh gave me the two stone tablets[a], written with the finger of God[b], and on them were all the words that Yahweh had spoken to you on the mountain from the midst of the fire on the day of the assembly.
translation:
  language: ta
  text: யாவே எனக்கு அந்த இரண்டு கற்பலகைகளைக் கொடுத்தார். அவை கடவுளின் விரலால் எழுதப்பட்டிருந்தன; நீங்கள் ஒன்றுகூடிய நாளில், மலையில் நெருப்பின் நடுவிலிருந்து யாவே உங்களிடம் பேசிய வார்த்தைகள் அனைத்தும் அவற்றில் இருந்தன.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: யாவே
  rationale: உடன்படிக்கையின் தனிப்பெயரைப் பொதுப்பட்டமாக மாற்றாமல், தமிழில் இயல்பாக ஒலிபெயர்க்கிறது.
- source_word: וַיִּתֵּן
  choice: கொடுத்தார்
  rationale: נתן என்பதன் நேரடியான பொருளையும், சூழலுக்கு ஏற்ற மரியாதை ஒருமையையும் தருகிறது.
- source_word: שְׁנֵי לוּחֹת הָאֲבָנִים
  choice: அந்த இரண்டு கற்பலகைகள்
  rationale: கல்லால் ஆன எழுதுபலகைகள் என்ற பொருளை இயல்பான நவீன தமிழில் தெளிவாகத் தெரிவிக்கிறது; குறிப்பிட்ட பலகைகள் என்பதால் சுட்டுச்சொல் சேர்க்கப்பட்டுள்ளது.
- source_word: כְּתֻבִים בְּאֶצְבַּע אֱלֹהִים
  choice: கடவுளின் விரலால் எழுதப்பட்டிருந்தன
  rationale: செயப்படுபொருள் வடிவையும், בְּ என்பதன் கருவிப்பொருளையும், மூலத்தின் உயிரோட்டமான மனிதவுருவகப் படிமத்தையும் பாதுகாக்கிறது.
- source_word: וַעֲלֵיהֶם כְּכָל הַדְּבָרִים
  choice: வார்த்தைகள் அனைத்தும் அவற்றில் இருந்தன
  rationale: எபிரெயத்தின் வினையற்ற தொடருக்குத் தமிழில் இயல்பான வினையை வழங்கி, பலகைகளில் உள்ள முழு உரையையும் குறிக்கிறது.
- source_word: אֲשֶׁר דִּבֶּר יְהוָה עִמָּכֶם
  choice: யாவே உங்களிடம் பேசிய
  rationale: עִם நேரடியாக ‘உடன்’ என்றாலும், இச்சூழலில் வெளிப்பாடு மக்களிடம் உரைக்கப்பட்டதை நவீன தமிழில் இயல்பாக ‘உங்களிடம் பேசிய’ எனத் தருகிறது.
- source_word: בָּהָר מִתּוֹךְ הָאֵשׁ
  choice: மலையில் நெருப்பின் நடுவிலிருந்து
  rationale: வெளிப்பாட்டின் இடத்தையும் அது நெருப்பின் மத்தியிலிருந்து வந்ததையும் மூல வரிசைக்கு நெருக்கமாகப் பாதுகாக்கிறது.
- source_word: בְּיוֹם הַקָּהָל
  choice: நீங்கள் ஒன்றுகூடிய நாளில்
  rationale: הַקָּהָל குறிக்கும் இஸ்ரவேலரின் கூடுகையை சுருக்கமான பெயர்ச்சொல்லைவிட இயல்பாகவும் தெளிவாகவும் வினைத்தொடராகத் தருகிறது.
theological_decisions:
- issue: தெய்வச் செயலுக்கான மனிதவுருவகச் சொற்றொடர்
  choice: கடவுளின் விரலால்
  alternative: கடவுளின் வல்லமையால் / கடவுளே
  rationale: ‘விரல்’ என்ற வெளிப்படையான மூலப் படிமத்தை விளக்கவுரையாக மாற்றாமல் பாதுகாக்கிறது.
- issue: יְהוָה என்ற தெய்வீகப் பெயர்
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலத்தில் வரும் உடன்படிக்கைப் பெயரைப் பட்டப்பெயரால் மாற்றாமல் ஒலிபெயர்க்கிறது.
- issue: דִּבֶּר ... עִמָּכֶם என்பதிலுள்ள உறவுசார் நுணுக்கம்
  choice: உங்களிடம் பேசிய
  alternative: உங்களோடு பேசிய
  rationale: עִם என்பதன் சொற்பொருள் ‘உடன்’ என்ற நுணுக்கத்தைக் கொண்டிருந்தாலும், முழு சூழலில் யாவே மக்களிடம் உரைத்ததை ‘உங்களிடம்’ என்பது இயல்பாக வெளிப்படுத்துகிறது; உரையாடல் என்ற கூடுதல் கருத்தை வலியுறுத்தவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழ்; மரியாதையுடனும் எளிதில் புரியக்கூடிய வகையிலும் அமைந்த நடை. எபிரெய நீண்ட வாக்கியம் வாசிப்புத் தெளிவுக்காக இரண்டு வாக்கியங்களாகப் பிரிக்கப்பட்டுள்ளது. மூலத்தின் ‘கடவுளின் விரல்’ என்ற படிமம் மாற்றமின்றிப் பாதுகாக்கப்பட்டுள்ளது.
