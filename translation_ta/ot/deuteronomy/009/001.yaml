base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/001.yaml
  text: 'Hear[a], Israel: today you are crossing the Jordan to go in to dispossess nations greater and mightier than you[b], with cities great and fortified up to the heavens.'
translation:
  language: ta
  text: இஸ்ரவேலே, கேள்! இன்று நீ யோர்தானைக் கடந்து, உன்னைவிடப் பெரியவும் வலிமைமிக்கவும் உள்ள நாடுகளைக் கைப்பற்றுவதற்காக உள்ளே நுழைகிறாய்; அவற்றின் நகரங்கள் பெரியவையும் வானத்தை எட்டும் அரண்களையுடையவையும் ஆகும்.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘உடைமையாக்கிக்கொள்வதற்காக’ அல்லது ‘சுதந்தரித்துக்கொள்வதற்காக’ என்றும் மொழிபெயர்க்கலாம். எபிரெய வினை உடைமையாக்குதல் அல்லது சுதந்தரித்துக்கொள்ளுதல் என்று பொருள்படலாம்; இவ்வெற்றிச் சூழலில் முன்பு குடியிருந்தவர்களை அகற்றும் பொருளையும் கொண்டிருக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில் நேரடியாக ‘வானங்களில்’ என்று உள்ளது. இது மிகவும் உயரமான, வலிமையான அரண்களைக் குறிக்கும் மிகைப்படுத்திய சொல்லாட்சி.
    reason: cultural_note
lexical_decisions:
- source_word: שְׁמַע יִשְׂרָאֵל
  choice: இஸ்ரவேலே, கேள்!
  rationale: ஒருமை ஏவல் வடிவம் இஸ்ரவேலை ஒரே மக்களாக நேரடியாக அழைக்கிறது. ‘கேள்’ என்பது உபாகமத்தில் காணப்படும் உடன்படிக்கைச் சார்ந்த அழைப்பின் சுருக்கத்தையும் வலிமையையும் காக்கிறது.
- source_word: עֹבֵר הַיּוֹם אֶת־הַיַּרְדֵּן
  choice: இன்று நீ யோர்தானைக் கடந்து
  rationale: நிகழ்காலப் பங்கேற்புவினையும் ‘இன்று’ என்பதையும் சேர்த்து, உடனடியாக நிகழவிருக்கும் கடத்தலை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: לָבֹא
  choice: அங்கு நுழைகிறாய்
  rationale: யோர்தானைக் கடந்து நாட்டிற்குள் செல்வதைக் குறிக்கும் திசைநுணுக்கத்தைத் தெளிவாகக் காட்டுகிறது; ‘அங்கு’ என்பது சூழலால் தெரியும் இலக்கை இயல்பாகச் சுட்டுகிறது.
- source_word: לָרֶשֶׁת גּוֹיִם
  choice: நாடுகளை வெளியேற்றி, அவர்களுடைய நாட்டை உடைமையாக்குவதற்காக
  rationale: ירשׁ என்ற வினை வெற்றிகொள்ளும் சூழலில் முன் குடியிருந்தவர்களை வெளியேற்றுவதையும் அவர்களுடைய நிலத்தை உடைமையாக்குவதையும் குறிக்கலாம். எபிரெயச் சொற்றொடரின் கடினமான நேரடி அமைப்பைத் தமிழில் தெளிவாக வெளிப்படுத்த இந்த இரு கூறுகளும் இணைக்கப்பட்டுள்ளன.
- source_word: גְּדֹלִים וַעֲצֻמִים מִמֶּךָּ
  choice: உன்னைவிடப் பெரியவையும் வலிமைமிக்கவையுமான
  rationale: ஒப்பீட்டையும், அளவு அல்லது மேன்மையையும், ஆற்றலையும் காக்கும் இயல்பான தமிழ் வடிவம்.
- source_word: עָרִים גְּדֹלֹת וּבְצֻרֹת בַּשָּׁמָיִם
  choice: அவர்களுடைய நகரங்கள் பெரியவை; அவை வானம்வரை உயர்ந்த மதில்களால் அரண்செய்யப்பட்டவை
  rationale: நகரங்களுக்கும் நாடுகளுக்கும் உள்ள தொடர்பைத் தமிழில் தெளிவாக்குகிறது. ‘வானம்வரை’ என்பது அரண்களின் மிகுந்த உயரத்தையும் வலிமையையும் வருணிக்கும் மூலமொழிப் படிமத்தைத் தக்கவைக்கிறது.
theological_decisions:
- issue: நகர அரண்களை ‘வானம்வரை’ என்று வருணித்தல்
  choice: மூலத்தின் மிகைப்படுத்திய படிமத்தை ‘வானம்வரை உயர்ந்த மதில்கள்’ என்று தக்கவைத்தல்
  alternative: ‘மிக உயரமான மதில்கள்’ என்று படிமத்தை விளக்கவுரையாக மாற்றுதல்
  rationale: இது அரண்களின் அசாதாரண உயரத்தையும் வலிமையையும் உணர்த்தும் சொல்லாட்சியாகும். அதைத் தட்டையான உரைநடையாக மாற்றாமல், வாசகருக்குப் புரியும் தமிழில் மூலப் படிமம் பாதுகாக்கப்படுகிறது.
- issue: ירשׁ என்பதன் வெற்றிகொள்ளும் சூழலிலான பொருள்
  choice: மக்களை வெளியேற்றுதலும் அவர்களுடைய நாட்டை உடைமையாக்குதலும் இணைந்த பொருளாக மொழிபெயர்த்தல்
  alternative: ‘சுதந்தரித்துக்கொள்ள’ அல்லது ‘உடைமையாக்கிக்கொள்ள’ என்று மட்டும் மொழிபெயர்த்தல்
  rationale: வினையின் பொருளாக ‘நாடுகள்’ வருவதால், இச்சூழலில் ஏற்கெனவே குடியிருப்பவர்களை அகற்றும் பரிமாணம் உள்ளது. அதேவேளை, உடைமையாக்கும் அடிப்படைப் பொருளையும் மொழிபெயர்ப்பு இழக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகருக்குப் புரியும் கண்ணியமான உரைநடை பயன்படுத்தப்பட்டுள்ளது. ‘இஸ்ரவேலே, கேள்!’ என்ற தொடக்கம் மூலத்தின் நேரடியான உடன்படிக்கை அழைப்பின் வலிமையைப் பேணுகிறது. நீண்ட எபிரெய வாக்கியம் வாசிப்புத் தெளிவுக்காக இரண்டு தமிழ் வாக்கியங்களாகப் பிரிக்கப்பட்டுள்ளது; ஆனால் கருத்துகளின் வரிசையும் தொடர்பும் காக்கப்பட்டுள்ளன.
