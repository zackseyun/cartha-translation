revisions:
- from: இஸ்ரவேலே, கேள்! உன்னைவிடப் பெரியவையும் வலிமைமிக்கவையுமான நாடுகளை வெளியேற்றி, அவர்களுடைய நாட்டை உடைமையாக்குவதற்காக[a] இன்று நீ யோர்தானைக் கடந்து அங்கு நுழைகிறாய். அவர்களுடைய நகரங்கள் பெரியவை; அவை வானம்வரை உயர்ந்த மதில்களால் அரண்செய்யப்பட்டவை[b].
  to: இஸ்ரவேலே, கேள்! இன்று நீ யோர்தானைக் கடந்து, உன்னைவிடப் பெரியவும் வலிமைமிக்கவும் உள்ள நாடுகளைக் கைப்பற்றுவதற்காக உள்ளே நுழைகிறாய்; அவற்றின் நகரங்கள் பெரியவையும் வானத்தை எட்டும் அரண்களையுடையவையும் ஆகும்.[a][b]
  rationale: The revision removes the unstated reference to the nations’ land and does not present displacement as the only possible sense of the Hebrew verb. It retains the conquest-context force through “கைப்பற்றுவதற்காக,” preserves the appositional relationship of nations and cities, and renders the hyperbolic ‘to/in the heavens’ image naturally in modern standard Tamil.
