  rationale: 'மறுப்பின் வரம்பு தெளிவாகும்படி முதல் வாக்கியம் திருத்தப்பட்டுள்ளது: நாட்டை உரிமையாக்கிக்கொள்ளும் வருகை மறுக்கப்படாமல், அதற்கான இஸ்ரவேலின் நீதி அல்லது உள்ள நேர்மை காரணமல்ல என்பது காட்டப்படுகிறது. “கொடுமை” “தீமை” என மாற்றப்பட்டு ரִשְׁעָהவின் பரந்த ஒழுக்கப் பொருள் காக்கப்பட்டுள்ளது. מִפָּנֶיךָவின் இடவியல் உறவு “உன் முன்னே” எனச் சரிசெய்யப்பட்டுள்ளது. இறுதியாக, נִשְׁבַּעவின் சத்தியம் செய்தல் என்ற பொருளுக்கு ஏற்ப பிரதான உரலும் அடிக்குறிப்பு c-யும் திருத்தப்பட்டுள்ளன. இரு காரணங்களும்—இந்த மக்களினங்களின் தீமையும், முற்பிதாக்களுக்கு யாவே சத்தியம் செய்த வார்த்தையை நிலைநிறுத்தும் நோக்கமும்—தனித்தனியாகப் பேணப்பட்டுள்ளன.'
