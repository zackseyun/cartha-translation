  text: לֹ֣א בְ/צִדְקָתְ/ךָ֗ וּ/בְ/יֹ֨שֶׁר֙ לְבָ֣בְ/ךָ֔ אַתָּ֥ה בָ֖א לָ/רֶ֣שֶׁת אֶת אַרְצָ֑/ם כִּ֞י בְּ/רִשְׁעַ֣ת הַ/גּוֹיִ֣ם הָ/אֵ֗לֶּה יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ מוֹרִישָׁ֣/ם מִ/פָּנֶ֔י/ךָ וּ/לְמַ֜עַן הָקִ֣ים אֶת הַ/דָּבָ֗ר אֲשֶׁ֨ר נִשְׁבַּ֤ע יְהוָה֙ לַ/אֲבֹתֶ֔י/ךָ לְ/אַבְרָהָ֥ם לְ/יִצְחָ֖ק וּֽ/לְ/יַעֲקֹֽב־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/005.yaml
  text: It is not because of your righteousness or the uprightness of your heart that you are going in to possess their land[a], but because of the wickedness of these nations Yahweh your God is driving them out before you, and in order to confirm the word that Yahweh swore to your fathers, to Abraham, to Isaac[c][b], and to Jacob.
translation:
  language: ta
  text: நீ உன் நீதியினாலோ உன் இதயத்தின் நேர்மையினாலோ அவர்களுடைய நாட்டை உரிமையாக்கிக்கொள்ள வருகிறவன் அல்ல. இந்த மக்களினங்களின் தீமையினாலே உன் கடவுளாகிய யாவே அவர்களை உன் முன்னே வெளியேற்றுகிறார்[a]; மேலும், உன் தந்தையரான ஆபிரகாம், ஈசாக்கு, யாக்கோபு ஆகியோருக்குத் யாவே சத்தியம் செய்து கூறிய வார்த்தையை நிலைநிறுத்துவதற்காகவும் அவர் அப்படிச் செய்கிறார்[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்களை உன் முன்னே உரிமையிழக்கச் செய்கிறார்.” எபிரெய வினைச்சொல், அவர்களை வெளியேற்றுவது மட்டுமன்றி, அவர்கள் நாட்டின் உடைமையை இழக்கும்படி செய்வதையும் வலியுறுத்தலாம்.
    reason: lexical_alternative
  - marker: b
    text: “உன் தந்தையர்” என்பது இங்கு பெயரிட்டு சொல்லப்படும் ஆபிரகாம், ஈசாக்கு, யாக்கோபு ஆகிய முற்பிதாக்களைக் குறிப்பாகக் குறிக்கிறது.
    reason: cultural_note
  - marker: c
    text: அல்லது, “யாவே சத்தியம் செய்து கூறிய வாக்குறுதியை.” எபிரெய மொழியில் “வார்த்தை” என்பது இந்தச் சத்தியச் சூழலில் உறுதியளிக்கப்பட்ட வாக்கைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְצִדְקָתְךָ
  choice: உன் நீதியினால்
  rationale: ப முன்னொட்டு இங்கு காரணத்தைக் குறிக்கிறது; צְדָקָה என்பதன் ஒழுக்கநீதிப் பொருளையும் தமிழில் இயல்பாகப் பேணுகிறது.
- source_word: וּבְיֹשֶׁר לְבָבְךָ
  choice: உன் இதயத்தின் நேர்மையினால்
  rationale: יֹשֶׁר என்பதன் நேர்மை/செம்மை உணர்வையும் לֵבָב குறிக்கும் உள்ளார்ந்த ஒழுக்கநிலையையும் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: בָא לָרֶשֶׁת
  choice: உரிமையாக்கிக்கொள்ளப் போவதில்லை
  rationale: בוא உடன் வரும் நோக்க வினையெச்சம் நெருங்கிய செயலும் உடைமையாக்கும் நோக்கமும் குறிக்கிறது; முந்தைய சூழலில் நாட்டிற்குள் நுழைவது தெளிவாக இருப்பதால் தமிழில் இயல்பாகச் சுருக்கப்பட்டுள்ளது.
- source_word: אַרְצָם
  choice: அவர்களுடைய நாடு
  rationale: אֶרֶץ என்பதற்கான நேரடியான, சூழலுக்கேற்ற தமிழ் இணை.
- source_word: בְרִשְׁעַת
  choice: கொடுமையினால்
  rationale: רִשְׁעָה குறிக்கும் தீமை, குற்றநிலை ஆகியவற்றை மக்களினங்களின் ஒழுக்கச் சீர்கேட்டைக் காட்டும் இயல்பான தமிழில் தருகிறது.
- source_word: הַגּוֹיִם הָאֵלֶּה
  choice: இந்த மக்களினங்கள்
  rationale: גּוֹיִם இங்கு பல தேசிய/இனக் குழுக்களைக் குறிக்கிறது; ‘மக்களினங்கள்’ என்பது தேவையற்ற சமயப் பொருளைச் சேர்க்காது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய தனிப்பெயரான நான்கெழுத்துத் திருப்பெயரை ஒரு பட்டத்தால் மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: מוֹרִישָׁם מִפָּנֶיךָ
  choice: அவர்களை உன் முன்னிலையிலிருந்து அகற்றி, அவர்களுடைய நாட்டை இழக்கச் செய்கிறார்
  rationale: ירשׁ என்பதன் Hiphil வடிவத்தில் வெளியேற்றுதல் மட்டுமன்றி உடைமையை இழக்கச் செய்தல் என்ற நுட்பமும் உள்ளது; இரண்டையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: וּלְמַעַן הָקִים
  choice: நிலைநிறுத்துவதற்காகவும்
  rationale: לְמַעַן நோக்கத்தையும் הקים சத்தியமாகக் கூறப்பட்ட வார்த்தையை உறுதிப்படுத்துதல்/நிறைவேற்றுதல் என்பதையும் குறிக்கிறது.
- source_word: הַדָּבָר אֲשֶׁר נִשְׁבַּע
  choice: ஆணையிட்டுச் சொன்ன வார்த்தை
  rationale: דָּבָר என்பதன் ‘வார்த்தை’ என்ற நேரடிப் பொருளையும் נשׁבע குறிக்கும் ஆணையையும் பேணுகிறது; வாக்குறுதி உணர்வு சூழலில் விளங்குகிறது.
- source_word: לַאֲבֹתֶיךָ
  choice: உன் தந்தையர்
  rationale: பெயரிட்டு வரிசைப்படுத்தப்படும் ஆபிரகாம், ஈசாக்கு, யாக்கோபு ஆகிய முற்பிதாக்களையே குறிப்பாகக் குறிக்கும் ஆண்பால் பன்மையைப் பேணுகிறது.
theological_decisions:
- issue: இஸ்ரவேல் நாட்டை உரிமையாக்குவதற்கான காரணம்
  choice: இஸ்ரவேலின் நீதி காரணமல்ல; மக்களினங்களின் கொடுமையும் யாவே தந்தையருக்கு ஆணையிட்ட வார்த்தையை நிலைநிறுத்துவதும் ஆகிய இரு காரணங்களும் கூறப்படுகின்றன.
  alternative: மக்களினங்களின் கொடுமையை மட்டும் அல்லது உடன்படிக்கை வாக்குறுதியை மட்டும் மையப்படுத்துதல்.
  rationale: எபிரெய உரையில் כִּי கூறும் காரணமும் וּלְמַעַן கூறும் நோக்கமும் இரண்டும் உள்ளன; ஒன்றை மற்றொன்றில் கரைக்காமல் இறையியல் இழுவை பேணப்பட்டுள்ளது.
- issue: יְהוָה என்ற திருப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர் அல்லது யெகோவா
  rationale: மூலத்தில் தனிப்பெயர் நேரடியாக உள்ளது; அதனைப் பட்டமாக மாற்றாமல் பரவலான அறிஞர் ஒலிப்புக்கு ஏற்ப தமிழாக்கம் செய்கிறது.
- issue: தெய்வீகச் செயலும் நாட்டை இழத்தலும்
  choice: யாவே மக்களினங்களை அகற்றி அவர்களுடைய நாட்டை இழக்கச் செய்கிறார் என உரையின் செயப்படுத்தும் வலிமை பேணப்படுகிறது.
  alternative: ‘துரத்துகிறார்’ என்று மட்டும் மொழிபெயர்த்து உடைமை இழப்பின் நுட்பத்தை மறைத்தல்.
  rationale: מוֹרִישָׁם என்பதில் வெளியேற்றுதல் மற்றும் உரிமை இழக்கச் செய்தல் ஆகிய பொருள் வாய்ப்புகள் இணைந்துள்ளன.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘உரிமையாக்கிக்கொள்ளுதல்,’ ‘நிலைநிறுத்துதல்’ போன்ற சொற்கள் சட்ட/உடன்படிக்கை நுட்பத்தைப் பேணுகின்றன. ஒருமை இரண்டாம் நபர் வடிவம் மூல எபிரெய உரைக்கு ஏற்ப காக்கப்பட்டுள்ளது; அடிக்குறிப்பு குறியீடுகள் அனைத்தும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
