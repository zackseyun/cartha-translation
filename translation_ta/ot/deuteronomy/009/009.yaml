  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: בַּ/עֲלֹתִ֣/י הָ/הָ֗רָ/ה לָ/קַ֜חַת לוּחֹ֤ת הָֽ/אֲבָנִים֙ לוּחֹ֣ת הַ/בְּרִ֔ית אֲשֶׁר כָּרַ֥ת יְהוָ֖ה עִמָּ/כֶ֑ם וָ/אֵשֵׁ֣ב בָּ/הָ֗ר אַרְבָּעִ֥ים יוֹם֙ וְ/אַרְבָּעִ֣ים לַ֔יְלָה לֶ֚חֶם לֹ֣א אָכַ֔לְתִּי וּ/מַ֖יִם לֹ֥א שָׁתִֽיתִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/009.yaml
  text: When I went up the mountain to receive the stone tablets[a], the tablets of the covenant that Yahweh made with you, I remained on the mountain forty days and forty nights[c][b]; I ate no bread and drank no water.
translation:
  language: ta
  text: கற்பலகைகளை[a]—உங்களோடு யாவே செய்த உடன்படிக்கையின் பலகைகளை—பெறுவதற்காக நான் மலைக்கு ஏறிச் சென்றபோது, நாற்பது நாட்களும் நாற்பது இரவுகளும் மலையில் தங்கியிருந்தேன். நான் அப்பம் சாப்பிடவில்லை; தண்ணீரும் குடிக்கவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “எடுத்துக்கொள்வதற்காக.” இங்கே யாவே கொடுக்கும் பலகைகளை மோசே பெறுவதைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּעֲלֹתִי הָהָרָה
  choice: நான் மலையின்மேல் ஏறிச் சென்றபோது
  rationale: ב plus the infinitive construct is temporal, and the directional ה indicates movement toward/up the mountain. This Tamil wording is natural while retaining both ascent and temporal force.
- source_word: לָקַחַת
  choice: பெற்றுக்கொள்வதற்காக
  rationale: The basic sense is ‘to take,’ but in context Moses goes up to take possession of tablets being given to him; ‘பெற்றுக்கொள்ள’ naturally conveys that contextual sense without implying seizure.
- source_word: לוּחֹת הָאֲבָנִים
  choice: கற்பலகைகளை
  rationale: This concise modern Tamil compound accurately identifies the tablets as made of stone.
- source_word: לוּחֹת הַבְּרִית
  choice: உடன்படிக்கையின் பலகைகளை
  rationale: The repeated appositional phrase is retained to preserve the Hebrew identification and emphasis.
- source_word: אֲשֶׁר כָּרַת יְהוָה עִמָּכֶם
  choice: யெகோவா உங்களோடு செய்த
  rationale: כרת is literally ‘cut’ but conventionally means making a covenant. Tamil naturally uses ‘உடன்படிக்கை செய்தார்/செய்த.’ The divine name is represented directly rather than replaced by a title.
- source_word: וָאֵשֵׁב בָּהָר
  choice: மலையிலேயே தங்கியிருந்தேன்
  rationale: ישב can mean sit, dwell, or remain; the duration here favors ‘தங்கியிருந்தேன்.’ The emphatic ஏயே supports the sense of remaining there.
- source_word: אַרְבָּעִים יוֹם וְאַרְבָּעִים לַיְלָה
  choice: நாற்பது பகலும் நாற்பது இரவும்
  rationale: A direct, idiomatic Tamil rendering of the Hebrew duration formula.
- source_word: לֶחֶם לֹא אָכַלְתִּי
  choice: நான் அப்பம் சாப்பிடவும் இல்லை
  rationale: Retains the concrete Hebrew ‘bread’ rather than broadening it to all food, while using ordinary modern Tamil.
- source_word: וּמַיִם לֹא שָׁתִיתִי
  choice: தண்ணீர் குடிக்கவும் இல்லை
  rationale: Directly preserves the parallel negative clause in natural Tamil.
theological_decisions:
- issue: Rendering the divine name יְהוָה
  choice: யெகோவா
  alternative: யாவே
  rationale: The Hebrew presents the personal divine name, not the title ‘Lord.’ ‘யெகோவா’ is a recognizable Tamil form of the name; the alternative ‘யாவே’ more closely reflects the widely reconstructed pronunciation, whose exact ancient vowels remain uncertain.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. எபிரெயத்தின் இருமுறை வரும் ‘பலகைகள்’ அமைப்பு வலியுறுத்தலுக்காகத் தக்கவைக்கப்பட்டுள்ளது; அப்பம் மற்றும் தண்ணீர் என்ற குறிப்பான சொற்களும் பொதுமைப்படுத்தப்படவில்லை.
