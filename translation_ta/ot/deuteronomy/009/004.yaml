  text: אַל תֹּאמַ֣ר בִּ/לְבָבְ/ךָ֗ בַּ/הֲדֹ֣ף יְהוָה֩ אֱלֹהֶ֨י/ךָ אֹתָ֥/ם מִ/לְּ/פָנֶי/ךָ֮ לֵ/אמֹר֒ בְּ/צִדְקָתִ/י֙ הֱבִיאַ֣/נִי יְהוָ֔ה לָ/רֶ֖שֶׁת אֶת הָ/אָ֣רֶץ הַ/זֹּ֑את וּ/בְ/רִשְׁעַת֙ הַ/גּוֹיִ֣ם הָ/אֵ֔לֶּה יְהוָ֖ה מוֹרִישָׁ֥/ם מִ/פָּנֶֽי/ךָ־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/004.yaml
  text: Do not say in your heart[a], when Yahweh your God drives them out from before you, saying, ‘Because of my righteousness Yahweh has brought me in to possess this land,’ while because of the wickedness of these nations Yahweh is dispossessing them before you.
translation:
  language: ta
  text: உன் கடவுளாகிய யாவே அந்த மக்களை உனக்கு முன்பாக இருந்து துரத்தும்போது, ‘என் நீதியின் காரணமாகவே இந்த நாட்டை உடைமையாக்கிக்கொள்ள யாவே என்னை இந்த நாட்டுக்குள் கொண்டுவந்தார்’ என்று உன் உள்ளத்தில் சொல்லாதே.[a] ஆனால், இந்த மக்களின் தீமையின் காரணமாக யாவே அவர்களை உனக்கு முன்பாக இருந்து அகற்றுகிறார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “என் நீதியின் காரணமாக இந்த நாட்டைச் சுதந்தரித்துக்கொள்ள யாவே என்னை உள்ளே கொண்டுவந்தார்” என்றும் மொழிபெயர்க்கலாம்.
    reason: בְּצִדְקָתִי, הֱבִיאַנִי, லָרֶשֶׁת ஆகியவற்றின் மேலும் சொற்சார்ந்த மாற்று மொழிபெயர்ப்பு.
lexical_decisions:
- source_word: אַל תֹּאמַר
  choice: சொல்லாதே
  rationale: אַל உடன் வரும் வினை வடிவம் தடையைக் குறிக்கிறது; நவீன தமிழில் ஒருமை முன்னிலைக்கான இயல்பான தடை வடிவம்.
- source_word: בִּלְבָבְךָ
  choice: உன் உள்ளத்தில்
  rationale: உள்ளார்ந்த எண்ணத்தையோ தனக்குள் பேசிக்கொள்வதையோ குறிக்கும் எபிரேய உருவகத்தைத் தெளிவாகப் பேணுகிறது.
- source_word: בַּהֲדֹף
  choice: துரத்தும்போது
  rationale: ב முன்னொட்டுள்ள வினையெச்சம் காலச் சூழலைக் காட்டுகிறது; נדף இங்கு வலுக்கட்டாயமாக விரட்டுவதைச் சுட்டுகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைப்பட்டத்தால் மாற்றாமல், எபிரேய இறைப்பெயரின் பொதுவாக ஏற்கப்படும் தமிழாக்க ஒலிபெயர்ப்பைப் பயன்படுத்துகிறது.
- source_word: אֱלֹהֶיךָ
  choice: உன் இறைவனாகிய
  rationale: உடன்படிக்கை சார்ந்த ‘உன் கடவுள்’ என்ற உறவை இயல்பான, கண்ணியமான தமிழில் தருகிறது.
- source_word: מִלְּפָנֶיךָ / מִפָּנֶיךָ
  choice: உன் முன்னிலையிலிருந்து
  rationale: ‘உன் முகம்/சந்நிதி முன்பிருந்து’ என்ற இடவியல் உறவைத் தமிழில் இயல்பாகப் பேணுகிறது.
- source_word: בְּצִדְקָתִי
  choice: என் நீதியினிமித்தமே
  rationale: இஸ்ரவேல் தனக்குக் கற்பித்துக்கொள்ளக்கூடிய ஒழுக்கத் தகுதியை ‘நீதி’ என்ற மூலத்தின் இறையியல் எடையுடன் காக்கிறது; ‘-மே’ அந்தத் தவறான காரணக் கூற்றை வலியுறுத்துகிறது.
- source_word: הֱבִיאַנִי
  choice: என்னை இங்கே கொண்டுவந்தார்
  rationale: בוא என்பதன் ஹிஃபீல் வடிவமான ‘என்னை உள்ளே வரச்செய்தார்’ என்பதை நாட்டிற்குள் நுழையும் சூழலில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: לָרֶשֶׁת
  choice: உரிமையாக்கிக்கொள்ள
  rationale: ירשׁ இங்கு நாட்டைக் கைப்பற்றி உடைமையாக்குவதைச் சுட்டுகிறது; ‘சுதந்தரித்துக்கொள்ள’ என்பதும் சாத்தியம் என்பதை அடிக்குறிப்பு பதிவு செய்கிறது.
- source_word: וּבְרִשְׁעַת הַגּוֹיִם הָאֵלֶּה
  choice: மாறாக, அந்த மக்களின் கொடுமையினிமித்தமே
  rationale: ו இங்கு முன் கூறிய தவறான காரணத்துக்கு மாறான உண்மைக் காரணத்தை அறிமுகப்படுத்துகிறது. רִשְׁעָה என்பதற்கு சூழலில் ஒழுக்கத் தீமையைத் தெளிவாகக் காட்ட ‘கொடுமை’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: מוֹרִישָׁם
  choice: அவர்களை ... அகற்றுகிறார்
  rationale: ירשׁ என்பதன் ஹிஃபீல் இங்கு அவர்களின் உடைமையையும் இருப்பிடத்தையும் இழக்கச் செய்வதைக் குறிக்கிறது; தமிழில் சுருக்கமாகவும் தெளிவாகவும் வழங்கப்படுகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் தனிப்பட்ட உடன்படிக்கைப் பெயர் நேரடியாக உள்ளது; அதை ஒரு பட்டமாக மாற்றாமல் ஒலிபெயர்ப்பது மூல வேறுபாட்டைப் பேணுகிறது.
- issue: இஸ்ரவேல் தனது நீதியால் நாட்டைப் பெற்றதாகக் கருதும் சாத்தியம்
  choice: ‘என் நீதியினிமித்தமே’ என்ற தவறான உள்கூற்றைத் தெளிவாக வைத்துப் பின்னர் உண்மைக் காரணத்தை எதிர்மறையாக நிறுத்துதல்
  alternative: ‘நான் நல்லவனாக இருப்பதால்’ என்று விளக்கிப் பரவலாக்குதல்
  rationale: צְדָקָה என்பதன் இறையியல் மற்றும் ஒழுக்கச் செறிவைச் சுருக்காமல், மோசே மறுக்கும் தகுதி-அடிப்படையிலான கூற்றை அப்படியே பேணுகிறது.
- issue: வசனத்தின் இரண்டாம் காரணவாக்கியத்திலுள்ள ו-வின் உறவு
  choice: மாறாக
  alternative: மேலும் / ஆனால்
  rationale: எபிரேய இணைப்பின் பரந்த அர்த்தவாய்ப்புக்குள், இங்கு இஸ்ரவேலின் கற்பனையான காரணத்துக்கும் மக்களின் தீமை என்ற கூறப்பட்ட காரணத்துக்கும் உள்ள முரணை இயல்பான தமிழில் காட்டுகிறது.
translation_notes:
  register: நவீன தரத் தமிழ்; சாதாரண வாசகர்களுக்குப் புரியும் வகையில் இயல்பாகவும், வேதாகம உரைக்கு ஏற்ற கண்ணியத்துடனும் அமைக்கப்பட்டது. ஒருமை முன்னிலைத் தொடர் முழுவதும் பேணப்பட்டுள்ளது. ‘நாடு’ என்பது הָאָרֶץ என்பதன் உடன்படிக்கை-புவியியல் பொருளைக் காட்டுகிறது.
