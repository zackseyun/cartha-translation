base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/015.yaml
  text: So I turned and came down from the mountain[a], and the mountain was burning with fire[b], and the two tablets of the covenant were in my two hands.
translation:
  language: ta
  text: அப்போது நான் திரும்பி, மலையிலிருந்து இறங்கினேன். மலை நெருப்பில் எரிந்துகொண்டிருந்தது.[a] உடன்படிக்கையின் இரண்டு பலகைகளும் என் இரண்டு கைகளில் இருந்தன.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய இணைப்புச் சொல்லை நேரடியாக, “மேலும் மலை நெருப்பில் எரிந்துகொண்டிருந்தது” என்றும் மொழிபெயர்க்கலாம். சூழலில், “மலை நெருப்பில் எரிந்துகொண்டிருக்கும்போது” என்ற ஒரே நேரத்தில் நிகழ்ந்த சூழ்நிலைப் பொருளும் இருக்கலாம்.
    reason: alternative_reading
  - marker: b
    text: சொல்லர்த்தமாக, “என் இரண்டு கைகளின்மேல்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֵפֶן
  choice: அதனால் நான் திரும்பி
  rationale: פנה என்பது இங்கு ‘திரும்பு’ என்ற பொருளில் தொடர்ச்சியான நிகழ்வைச் சொல்கிறது. முன்னைய சூழலுடன் இயல்பாக இணைக்க ו־ என்பதற்கு ‘அதனால்’ பயன்படுத்தப்பட்டது.
- source_word: וָאֵרֵד מִן־הָהָר
  choice: மலையிலிருந்து இறங்கிவந்தேன்
  rationale: ירד என்பது ‘கீழே இறங்கு’ என்பதாகும்; குறிப்பிட்ட மலையிலிருந்து மோசே கீழே வந்ததை ‘இறங்கிவந்தேன்’ இயல்பாகத் தெரிவிக்கிறது.
- source_word: וְהָהָר בֹּעֵר בָּאֵשׁ
  choice: மலை நெருப்பில் எரிந்துகொண்டிருந்தது
  rationale: בֹּעֵר தொடர்ந்துகொண்டிருந்த எரிதலைக் குறிக்கிறது; בָּאֵשׁ என்பதிலுள்ள நெருப்பு என்ற வெளிப்படையான குறிப்பும் தக்கவைக்கப்பட்டது. தொடக்க இணைப்புச் சொல்லின் எளிய ஒருங்கிணைப்பும் சூழ்நிலைப் பொருளும் அடிக்குறிப்பில் திறந்துவைக்கப்படுகின்றன.
- source_word: וּשְׁנֵי לֻחֹת הַבְּרִית
  choice: உடன்படிக்கையின் இரண்டு பலகைகள்
  rationale: לֻחֹת இச்சூழலில் கற்பலகைகளைக் குறிக்கிறது; הַבְּרִית என்பது ‘உடன்படிக்கை.’ எபிரெயத்தில் உள்ள ‘இரண்டு’ என்பதும் வெளிப்படையாகப் பாதுகாக்கப்பட்டது.
- source_word: עַל שְׁתֵּי יָדָי
  choice: என் இரண்டு கைகளிலும்
  rationale: עַל என்பதன் அடிப்படைப் பொருள் ‘மேல்’ என்றாலும், இங்கு பலகைகளை இரு கைகளிலும் தாங்கியிருந்தார் என்பதே இயல்பான பொருள். மூலத்தில் உள்ள ‘இரண்டு கைகள்’ என்ற கூறு தக்கவைக்கப்பட்டது.
