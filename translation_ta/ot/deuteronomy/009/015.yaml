translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. எபிரெயத்தின் நிகழ்ச்சி வரிசை, நெருப்பைப் பற்றிய வலியுறுத்தல், ‘இரண்டு’ என்ற எண்ணிக்கை ஆகியவை தக்கவைக்கப்பட்டுள்ளன; இணைப்புச் சொல்லின் சாத்தியமான சூழ்நிலைப் பொருள் அடிக்குறிப்பில் குறிப்பிடப்பட்டுள்ளது.
