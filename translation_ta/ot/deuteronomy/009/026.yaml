revisions:
- from: அப்போது நான் யாவேயிடம் மன்றாடி, “ஆண்டவராகிய யாவே[a], உமது மக்களையும் உமது உரிமைச் சொத்தையும் அழித்துவிடாதீர். உமது மகத்துவத்தால் நீர் அவர்களை மீட்டு, வலிமையான கையால் எகிப்திலிருந்து வெளியே கொண்டுவந்தீர்” என்று சொன்னேன்.
