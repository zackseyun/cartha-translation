base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/026.yaml
  text: So I prayed to Yahweh and said[a], “Lord GOD, do not destroy your people and your inheritance, whom you redeemed by your greatness[b], whom you brought out of Egypt with a strong hand.”
translation:
  language: ta
  text: நான் யாவேயிடம் ஜெபித்து, “ஆண்டவராகிய யாவே[a], உமது மக்களையும் உமது சுதந்தரத்தையும் அழித்துவிடாதீர். உமது மகத்துவத்தால் நீர் அவர்களை மீட்டீர்; வலிமையான கையால் அவர்களை எகிப்திலிருந்து வெளியே கொண்டுவந்தீர்” என்று சொன்னேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் இவ்வழைப்பு “ஆண்டவர் யாவே” என ஆண்டவர் என்ற பட்டத்தையும் யாவே என்ற இறைப் பெயரையும் இணைக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶתְפַּלֵּל אֶל־יְהוָה
  choice: அப்போது நான் யாவேயிடம் மன்றாடி
  rationale: வழக்குரைத் தொடரை முன்னெடுக்கும் ו־ வடிவை ‘அப்போது’ இயல்பாக வெளிப்படுத்துகிறது. התפלל என்பதன் வேண்டுதல் நிறைந்த ஜெபப் பொருளை ‘மன்றாடி’ காட்டுகிறது; יהוה என்பது தனிப்பெயராக ‘யாவே’ என்று ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: אֲדֹנָי יְהוִה
  choice: ஆண்டவராகிய யாவே
  rationale: אֲדֹנָי என்ற பட்டத்தையும் יהוה என்ற இறைப் பெயரையும் இரண்டையும் காத்து, தமிழில் இயல்பற்ற இரட்டிப்பைத் தவிர்க்கிறது.
- source_word: אַל־תַּשְׁחֵת
  choice: அழித்துவிடாதீர்
  rationale: தடை வேண்டுகோளின் தீவிரத்தையும் שׁחת என்பதன் அழிவு சார்ந்த பொருளையும் நேரடியாகக் காக்கிறது.
- source_word: עַמְּךָ וְנַחֲלָתְךָ
  choice: உமது மக்களையும் உமது உரிமைச் சொத்தையும்
  rationale: נחלה என்பதில் உள்ள ஒருவருக்குரிய பங்கு அல்லது உடைமை என்ற கருத்தை, மக்களையே குறிக்கும் இச்சூழலில் புரியக்கூடிய நவீன தமிழில் தெரிவிக்கிறது.
- source_word: אֲשֶׁר פָּדִיתָ בְּגָדְלֶךָ
  choice: உமது மகத்துவத்தால் நீர் அவர்களை மீட்டு
  rationale: פדה என்பதற்கு ‘மீட்டு’ என்றும், גדל என்ற பெயர்ச்சொல்லுக்கு விளக்கச் சேர்க்கையின்றி ‘மகத்துவம்’ என்றும் மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: אֲשֶׁר הוֹצֵאתָ מִמִּצְרַיִם בְּיָד חֲזָקָה
  choice: வலிமையான கையால் எகிப்திலிருந்து வெளியே கொண்டுவந்தீர்
  rationale: விடுதலைப் பயணத்தைக் குறிக்கும் வழக்கமான הוציא தொடரையும், ‘வலிமையான கை’ என்ற எபிரெய உருவகத்தையும் காக்கிறது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர் / ஆண்டவர்
  rationale: மூலத்தில் உள்ள உடன்படிக்கைப் பெயரை ஒரு பொதுப் பட்டமாக மாற்றாமல், தனிப்பெயராக வெளிப்படுத்துகிறது.
- issue: אֲדֹנָי יְהוִה என்ற இணைந்த இறைப் பட்டம்
  choice: ஆண்டவராகிய யாவே
  alternative: ஆண்டவர் யாவே
  rationale: ‘ஆண்டவர்’ என்ற பட்டத்தையும் ‘யாவே’ என்ற பெயரையும் காத்தபடி, நவீன தமிழில் இயல்பான அழைப்புமுறையை அளிக்கிறது.
- issue: Israel as נחלה
  choice: உமது உரிமைச் சொத்து
  alternative: உமது சுதந்தரம்
  rationale: இஸ்ரவேல் யாவேக்கு உரிய பங்காக இருப்பதைக் காட்டுகிறது; நிலம் அல்லது வாரிசுவழிச் சொத்து என்று மட்டும் தவறாகப் புரிந்துகொள்ளப்படுவதைத் தவிர்க்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில் மரியாதை ஒருமை பயன்படுத்தப்பட்டுள்ளது. வாக்கியம் மன்றாட்டு மொழிக்குரிய கண்ணியத்தைக் கொண்டிருந்தாலும், பொதுவாசகருக்குப் புரியாத பழமையான சொற்கள் தவிர்க்கப்பட்டுள்ளன. மூலத்தின் ‘மகத்துவம்’ மற்றும் ‘வலிமையான கை’ ஆகிய வேறுபட்ட சொற்படிமங்கள் தனித்தனியாகக் காக்கப்பட்டுள்ளன.
