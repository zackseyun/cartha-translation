    reason: lexical_alternative
  revision_rationale: The revision replaces the commercial-sounding “உரிமைச் சொத்து” with “சுதந்தரம்,” retaining the covenantal inheritance sense of נַחֲלָה. It also uses the direct prayer verb “ஜெபித்து,” makes the two completed divine actions explicit, and refines the title footnote without adding interpretation.
