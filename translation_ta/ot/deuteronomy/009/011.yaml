  yaml_path: translation/ot/deuteronomy/009/011.yaml
  text: And at the end of forty days and forty nights[a], Yahweh gave me the two stone tablets, the tablets of the covenant.
translation:
  language: ta
  text: நாற்பது நாட்களும் நாற்பது இரவுகளும் முடிந்தபோது[a], யாவே எனக்கு அந்த இரண்டு கற்பலகைகளை—உடன்படிக்கையின் பலகைகளை—கொடுத்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நாற்பது நாட்களும் நாற்பது இரவுகளும் முடிவடைந்ததும்.”
    reason: מִקֵּץ என்ற காலத் தொடரை இன்னும் சொற்சார்பாக மொழிபெயர்க்கும் மாற்று.
lexical_decisions:
- source_word: וַיְהִי
  choice: …முடிந்தபோது
  rationale: இது கதைத் தொடர்ச்சியையும் அடுத்த நிகழ்வுக்கான காலச் சூழலையும் குறிக்கிறது; தமிழில் தனியே ‘அது நிகழ்ந்தது’ என்று மொழிபெயர்ப்பதைவிட காலத் தொடரோடு இணைப்பது இயல்பானது.
- source_word: מִקֵּץ
  choice: முடிந்தபோது
  rationale: குறிப்பிட்ட காலப்பகுதி நிறைவடைந்த எல்லையைத் தெளிவாகக் குறிக்கிறது.
- source_word: אַרְבָּעִים יוֹם וְאַרְבָּעִים לָיְלָה
  choice: நாற்பது பகலும் நாற்பது இரவும்
  rationale: எபிரெய மொழியின் இணை அமைப்பைப் பாதுகாத்து, தமிழில் இயல்பாகக் கால அளவைச் சொல்கிறது.
- source_word: נָתַן
  choice: கொடுத்தார்
  rationale: வினையின் பொதுவான, நேரடியான பொருளைச் சேர்க்கை விளக்கமின்றி வழங்குகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரை ஒரு பட்டப்பெயரால் மாற்றாமல், தமிழில் வழக்கமான ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: אֵלַי
  choice: எனக்கு
  rationale: נתן உடன் வரும் மறைமுகச் செயப்படுபொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: שְׁנֵי
  choice: அந்த இரண்டு
  rationale: சூழலில் ஏற்கெனவே அறியப்பட்ட குறிப்பிட்ட இரு பலகைகள் என்பதைக் காட்டுகிறது.
- source_word: לֻחֹת הָאֲבָנִים
  choice: கற்பலகைகள்
  rationale: கல்லால் செய்யப்பட்ட பலகைகள் என்ற பொருளைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: לֻחֹת הַבְּרִית
  choice: உடன்படிக்கையின் பலகைகள்
  rationale: எபிரெய உரையிலுள்ள பெயர்ச்சொல் மீளுரைப்பைத் தக்கவைத்து, அந்தப் பலகைகளின் உடன்படிக்கை சார்ந்த முக்கியத்துவத்தைப் பாதுகாக்கிறது.
