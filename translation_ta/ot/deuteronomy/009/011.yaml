  register: நவீன பொதுத்தமிழில் எளிமையும் கண்ணியமும் பேணப்பட்டுள்ளன. எபிரெய உரையின் மறுஅடையாளப்படுத்தும் அமைப்பைத் தக்கவைக்க இடைக்கோடுகள் பயன்படுத்தப்பட்டுள்ளன.
