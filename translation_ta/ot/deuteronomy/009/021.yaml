source:
  edition: WLC
  text: וְֽ/אֶת חַטַּאתְ/כֶ֞ם אֲשֶׁר עֲשִׂיתֶ֣ם אֶת הָ/עֵ֗גֶל לָקַחְתִּי֮ וָ/אֶשְׂרֹ֣ף אֹת֣/וֹ בָּ/אֵשׁ֒ וָ/אֶכֹּ֨ת אֹת֤/וֹ טָחוֹן֙ הֵיטֵ֔ב עַ֥ד אֲשֶׁר דַּ֖ק לְ/עָפָ֑ר וָֽ/אַשְׁלִךְ֙ אֶת עֲפָר֔/וֹ אֶל הַ/נַּ֖חַל הַ/יֹּרֵ֥ד מִן הָ/הָֽר־־־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/021.yaml
  text: And I took your sin[a], the calf that you had made, and burned it with fire; then I crushed it, grinding it thoroughly until it was as fine as dust, and I threw its dust into the stream that comes down from the mountain.
translation:
  language: ta
  text: நீங்கள் செய்த கன்றுக்குட்டியாகிய உங்கள் பாவத்தை நான் எடுத்து, அதை நெருப்பில் எரித்தேன். பின்பு அதை நொறுக்கி, நன்றாக அரைத்து, அது தூளைப்போல் நுண்மையாகும்வரை செய்தேன்; அதன் தூளை மலையிலிருந்து இறங்கிவரும் ஓடையில்[a] எறிந்தேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ஓடை’ என்பதற்கான எபிரெயச் சொல், நீரோடை, காட்டாறு அல்லது பருவநீர் ஓடும் பள்ளத்தாக்கையும் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: חַטַּאתְכֶם
  choice: உங்கள் பாவம்
  rationale: இங்கு இச்சொல் பாவநிவாரணப் பலியைக் குறிக்காமல், இஸ்ரவேலரின் பாவத்தை உருவகப்படுத்திய சிலையாகிய கன்றுக்குட்டியையே நேரடியாகக் குறிக்கிறது. எபிரெய உரையின் கடுமையான அடையாளப்படுத்தலை இது காக்கிறது.
- source_word: הָעֵגֶל
  choice: கன்றுக்குட்டி
  rationale: இச்சொல்லின் வழக்கமான பொருள் ‘கன்று’; பொற்கன்றுக்குட்டி நிகழ்வை இயல்பாகவும் தெளிவாகவும் சுட்டுகிறது.
- source_word: וָאֶשְׂרֹף אֹתוֹ בָּאֵשׁ
  choice: அதை நெருப்பில் எரித்தேன்
  rationale: எபிரெய மொழியின் ‘நெருப்பில்/நெருப்பால் எரித்தேன்’ என்ற உறுதியான, நேரடியான செயலை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: וָאֶכֹּת אֹתוֹ
  choice: அதை ... நொறுக்கினேன்
  rationale: அடித்தல் அல்லது நொறுக்குதல் எனப் பொருள்படும் வினை, தொடர்ந்து வரும் அரைத்தலோடு சேர்ந்து சிலையை முற்றிலும் சிதைத்த செயலைக் குறிக்கிறது.
- source_word: טָחוֹן הֵיטֵב
  choice: நன்றாகப் பொடியாக அரைத்து
  rationale: அரைக்கும் முறையையும் הֵיטֵב தரும் தீவிரத்தையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: עַד אֲשֶׁר דַּק לְעָפָר
  choice: தூள்போல் நுண்மையாகும்வரை
  rationale: நொறுக்கப்பட்ட பொருள் தூளின் அளவுக்கு மிக நுண்மையானதைச் சொல்வதன் மூலம் மூலத்தின் அளவு/விளைவு நுணுக்கத்தைப் பாதுகாக்கிறது.
- source_word: עֲפָרוֹ
  choice: அதன் தூள்
  rationale: கன்றுக்குட்டியின் பொடியாக்கப்பட்ட எச்சத்தைக் குறிக்கிறது; ‘சாம்பல்’ என்று பொருளைத் தேவையின்றி குறுக்குவதையும் தவிர்க்கிறது.
- source_word: הַנַּחַל
  choice: ஓடை
  rationale: நீர் ஓடும் ஓடை, பருவநீரோடை அல்லது நீரோடைப் பள்ளத்தாக்கு ஆகிய பொருள் வரம்புகளுள், நவீனத் தமிழில் எளிதில் புரியும் பொதுவான சொல்லாக ‘ஓடை’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: הַיֹּרֵד מִן הָהָר
  choice: மலையிலிருந்து இறங்கிவரும்
  rationale: நீரோட்டத்தின் தொடர்ச்சியான இயக்கத்தைச் சுட்டும் எபிரெயப் பெயரெச்சத்தின் நிகழ்கால விளக்கத் தன்மையைப் பாதுகாக்கிறது.
theological_decisions:
- issue: கன்றுக்குட்டியை ‘உங்கள் பாவம்’ என்று நேரடியாக அடையாளப்படுத்துதல்
  choice: ‘நீங்கள் செய்த கன்றுக்குட்டியாகிய உங்கள் பாவம்’ என்று மொழிபெயர்க்கப்பட்டது.
  alternative: ‘நீங்கள் செய்த பாவமான பொருளாகிய கன்றுக்குட்டி’
  rationale: எபிரெய உரை சிலையை இஸ்ரவேலரின் பாவத்தோடு கடுமையாகவும் நேரடியாகவும் அடையாளப்படுத்துகிறது. அதை மென்மைப்படுத்தாமல், தமிழில் உறவைக் குழப்பமின்றி வெளிப்படுத்த ‘கன்றுக்குட்டியாகிய உங்கள் பாவம்’ என அமைக்கப்பட்டது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் வேதாகம உரைக்கேற்ற கண்ணியமான நடையிலும் வடிவமைக்கப்பட்டது. மூலத்தின் செயல்வரிசையும் ‘உங்கள் பாவம்’ என்ற வலுவான சொல்லாட்சியும் பாதுகாக்கப்பட்டுள்ளன.
