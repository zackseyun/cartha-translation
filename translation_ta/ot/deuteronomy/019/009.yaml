base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/019/009.yaml
  text: if you keep all this commandment by doing it[a], which I am commanding you today—to love Yahweh your God and to walk in his ways all your days—then you shall add for yourself three more cities besides these three,
translation:
  language: ta
  text: நான் இன்று உனக்குக் கட்டளையிடும் இந்தக் கட்டளை முழுவதையும்[a] நீ கடைப்பிடித்து அதன்படி செய்து, உன் கடவுளாகிய யாவேவை நேசித்து, உன் வாழ்நாளெல்லாம் அவருடைய வழிகளில் நடந்தால், இந்த மூன்று நகரங்களுக்கு மேலாக மேலும் மூன்று நகரங்களைச் சேர்க்க வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் ‘இந்தக் கட்டளை முழுவதையும்’ என்று, ‘கட்டளை’ ஒருமையில் உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: நடந்தால்
  rationale: இங்கு நிபந்தனையை அறிமுகப்படுத்துவதால், தமிழில் இயல்பான ‘-ஆல்’ நிபந்தனை வடிவம் பயன்படுத்தப்பட்டது.
- source_word: תִשְׁמֹר
  choice: கடைப்பிடித்து
  rationale: உடன்படிக்கைச் சூழலில் שׁמר என்பது கட்டளையைக் காத்து அனுசரிப்பதைக் குறிக்கிறது; ‘கடைப்பிடி’ இதைத் தெளிவாகத் தருகிறது.
- source_word: כָּל הַמִּצְוָה הַזֹּאת
  choice: இந்தக் கட்டளை முழுவதையும்
  rationale: மூலத்தில் ‘கட்டளை’ ஒருமையில் இருப்பதையும் כָּל என்பதன் முழுமைப் பொருளையும் இயல்பான தமிழில் காக்கிறது.
- source_word: לַעֲשֹׂתָהּ
  choice: அதன்படி நடந்தால்
  rationale: கட்டளையை நடைமுறையில் செயல்படுத்துவதைக் குறிக்கிறது; ‘அதைச் செய்தால்’ என்பதைக் காட்டிலும் தமிழில் தெளிவாக உள்ளது.
- source_word: אֲשֶׁר אָנֹכִי מְצַוְּךָ הַיּוֹם
  choice: நான் இன்று உனக்குக் கட்டளையிடும்
  rationale: பேசிக்கொண்டிருக்கும் தருணத்தில் மோசே வழங்கும் கட்டளையின் நிகழ்காலத் தன்மையைப் பாதுகாக்கிறது.
- source_word: לְאַהֲבָה אֶת יְהוָה אֱלֹהֶיךָ
  choice: உன் கடவுளாகிய யாவேவை நேசித்து
  rationale: தெய்வீகப் பெயரை ஒலிபெயர்த்து, நேசிப்பதற்கான நேரடி அழைப்பையும் காக்கிறது.
- source_word: וְלָלֶכֶת בִּדְרָכָיו
  choice: அவருடைய வழிகளில் நடந்தால்
  rationale: உடன்படிக்கை வாழ்வைக் குறிக்கும் ‘வழிகளில் நட’ என்ற மூல உருவகத்தைத் தக்கவைக்கிறது.
- source_word: כָּל הַיָּמִים
  choice: உன் வாழ்நாளெல்லாம்
  rationale: வாழ்நாள் முழுவதும் தொடரும் உண்மைத்தன்மையை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: וְיָסַפְתָּ לְךָ עוֹד שָׁלֹשׁ עָרִים
  choice: மேலும் மூன்று நகரங்களை உனக்காகச் சேர்க்க வேண்டும்
  rationale: கூடுதலாக மூன்று அடைக்கல நகரங்களை ஏற்படுத்த வேண்டும் என்ற பொருளையும் לְךָ என்பதையும் பிரதிபலிக்கிறது.
- source_word: עַל הַשָּׁלֹשׁ הָאֵלֶּה
  choice: இந்த மூன்று நகரங்களோடு
  rationale: இங்கு עַל கூடுதலாகச் சேர்த்தல் என்ற பொருளில் வருவதால் இவ்வாறு மொழிபெயர்க்கப்பட்டது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் பட்டமல்ல, நான்கெழுத்து இறைப் பெயரே நேரடியாக உள்ளது; ஆகவே அதைத் தமிழில் ஒலிபெயர்ப்பது மூலத்தின் தனிப்பெயரைப் பாதுகாக்கிறது.
- issue: ஒருமையிலுள்ள הַמִּצְוָה
  choice: இந்தக் கட்டளை முழுவதையும்
  alternative: இந்தக் கட்டளைகள் அனைத்தையும்
  rationale: பொருள் பல விதிமுறைகளை உள்ளடக்கக்கூடியதாக இருந்தாலும், எபிரெயச் சொல்லின் ஒருமையைப் பன்மையாக்காமல் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையும் தெளிவும் கொண்ட நடையில் மொழிபெயர்க்கப்பட்டது. ஒருமை இரண்டாம் நபர் வடிவங்கள் காக்கப்பட்டுள்ளன; ‘அவருடைய’ என்பது இறைவனை மரியாதையுடன் சுட்டுகிறது. மூலத்தின் ‘வழிகளில் நடப்பது’ என்ற உருவகம் அப்படியே தக்கவைக்கப்பட்டுள்ளது.
