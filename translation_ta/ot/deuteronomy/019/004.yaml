source:
  edition: WLC
  text: וְ/זֶה֙ דְּבַ֣ר הָ/רֹצֵ֔חַ אֲשֶׁר יָנ֥וּס שָׁ֖מָּ/ה וָ/חָ֑י אֲשֶׁ֨ר יַכֶּ֤ה אֶת רֵעֵ֨/הוּ֙ בִּ/בְלִי דַ֔עַת וְ/ה֛וּא לֹא שֹׂנֵ֥א ל֖/וֹ מִ/תְּמֹ֥ל שִׁלְשֹֽׁם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/019/004.yaml
  text: 'This is the provision for the manslayer who may flee there and live: when he strikes his neighbor without intent[a], and he did not hate him in times past.'
translation:
  language: ta
  text: 'உயிரிழப்பை ஏற்படுத்தியவன் அங்கே ஓடிச் சென்று உயிர்வாழுவதற்கான விதிமுறை இதுதான்: தன் அயலானை அறியாமல் தாக்கி, முன்பே அவனை வெறுத்திருக்காதவன் அங்கே ஓடிச் சென்று உயிர்வாழலாம்.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: דְּבַר
  choice: விதிமுறை
  rationale: சட்டச் சூழலில் இது வெறும் ‘சொல்’ அல்லது ‘காரியம்’ என்பதைக் காட்டிலும், இவ்வழக்கை நிர்ணயிக்கும் விதியைக் குறிக்கிறது.
- source_word: הָרֹצֵחַ
  choice: கொலை செய்தவன்
  rationale: இச்சொல் இங்கு ஒருவரின் மரணத்துக்குக் காரணமானவனைக் குறிக்கிறது; திட்டமிட்ட கொலைகாரன் என்ற குற்றவுணர்வை முன்கூட்டியே சுமத்தாமல் இருக்க இந்தச் சொற்றொடர் தேர்ந்தெடுக்கப்பட்டது.
- source_word: יָנוּס שָׁמָּה וָחָי
  choice: அங்கே தப்பியோடி உயிர்வாழுவதற்கான
  rationale: அடைக்கல நகரத்துக்கு ஓடிச் சென்று உயிருடன் இருப்பதற்கான அனுமதி மற்றும் விளைவு இரண்டையும் இயல்பான தமிழில் இணைக்கிறது.
- source_word: יַכֶּה אֶת־רֵעֵהוּ
  choice: தன் அயலானை ... தாக்கியிருக்க வேண்டும்
  rationale: נכה என்பதன் அடிப்படைப் பொருளான ‘தாக்கு’ என்பதைக் காக்கிறது; தாக்குதல் மரணத்தில் முடிந்தது என்பதைச் சுற்றுப்பின்னணி தெரிவிக்கிறது.
- source_word: בִּבְלִי דַעַת
  choice: அறியாமல்
  rationale: ‘அறிவு இல்லாமல்’ என்ற நேரடிப் பொருளையும், சட்டச் சூழலில் உள்ள நோக்கமின்மை அல்லது தற்செயல் தன்மையையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: לֹא שֹׂנֵא לוֹ
  choice: அவனை வெறுத்தவனாக இருந்திருக்கக் கூடாது
  rationale: சம்பவத்துக்கு முன்பிருந்த தொடர்ச்சியான பகைமை மனநிலை இல்லை என்பதைக் காட்டுகிறது.
- source_word: מִתְּמֹל שִׁלְשֹׁם
  choice: முன்பே
  rationale: ‘நேற்றும் முந்தின நாளும்’ என்ற எபிரெய மரபுத்தொடரின் ‘இதற்கு முன்பு’ என்ற பொருளைத் தெளிவான நவீன தமிழில் தருகிறது.
theological_decisions:
- issue: הָרֹצֵחַ என்பதன் குற்றநிலை
  choice: கொலை செய்தவன்
  alternative: கொலைகாரன்
  rationale: அடைக்கல நகரச் சட்டம் திட்டமிடாத மரணத்தைப் பற்றியது; ஆகவே திட்டமிட்ட கொலையை உள்ளடக்கியதாக வாசிக்கக்கூடிய ‘கொலைகாரன்’ என்பதைத் தவிர்த்து, ஒருவரைக் கொன்ற செயலை மட்டும் குறிக்கும் வடிவம் பயன்படுத்தப்பட்டது.
translation_notes:
  register: நவீன நிலையான தமிழில், சட்டத் தன்மையைத் தெளிவாக வைத்துக்கொண்டு பொதுவாசகர்களும் எளிதில் புரிந்துகொள்ளும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘கொலைகாரன்’ என்ற சொல் தவிர்க்கப்பட்டதால் திட்டமிட்ட குற்றம் முன்கூட்டியே தீர்மானிக்கப்படவில்லை; ‘அறியாமல்’ என்பதிலுள்ள அறிவின்மை/நோக்கமின்மை நுட்பம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
