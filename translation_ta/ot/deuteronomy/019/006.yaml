base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/019/006.yaml
  text: otherwise the avenger of blood may pursue the manslayer[a], because his heart is hot, and overtake him because the way is long, and strike him dead, though he did not deserve the death penalty[b], since he had not hated him previously.
translation:
  language: ta
  text: இல்லையெனில், இரத்தப்பழி வாங்குபவன் தன் உள்ளம் கொதிப்பதால்[a] கொன்றவனைத் துரத்திச் சென்று, பயணவழி நீண்டிருப்பதால் அவனை எட்டிப்பிடித்து, அவனை அடித்துக் கொன்றுவிடலாம்; ஆனால் கொன்றவன் முன்பே[b] அவனைப் பகைத்திருக்காததால், அவன் மரணத்தண்டனைக்கு உரியவன் அல்ல.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “அவனுடைய உள்ளம் சூடாக இருப்பதால்.” இது கடும் சினத்தைக் குறிக்கும் மரபுத்தொடர்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில், “நேற்றோ முந்தின நாளோ முதல்.” இது முன்னதாக அல்லது முன்பு என்பதைக் குறிக்கும் மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: פֶּן
  choice: இல்லையெனில்
  rationale: அடைக்கல நகரங்களுக்கான வழியை ஆயத்தப்படுத்தாவிட்டால் ஏற்படக்கூடிய ஆபத்தை எச்சரிக்கும் நோக்கத்தை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: גֹּאֵל הַדָּם
  choice: இரத்தப்பழி வாங்குபவன்
  rationale: கொல்லப்பட்டவரின் சார்பில் பழிவாங்கும் உறவினரின் சட்டப்பூர்வப் பங்கைத் தெளிவாகவும், எபிரெயச் சொல்லாட்சிக்கு நெருக்கமாகவும் காட்டுகிறது.
- source_word: הָרֹצֵחַ
  choice: கொன்றவன்
  rationale: இங்கு முன்பகையின்றிக் கொன்ற ஒருவனைச் சுட்டுவதால், திட்டமிட்ட கொலையைக் குறிக்கும் சொல்லைத் தவிர்த்து, நடுநிலையான சொல்லாட்சி பயன்படுத்தப்படுகிறது.
- source_word: כִּי יֵחַם לְבָבוֹ
  choice: தன் உள்ளம் கொதிப்பதால்
  rationale: உள்ளம் சூடாதல் என்ற எபிரெய உருவகத்தின் வலிமையையும் கடும் சினம் என்ற பொருளையும் இயல்பான தமிழில் காக்கிறது.
- source_word: וְהִשִּׂיגוֹ
  choice: அவனை எட்டிப்பிடித்து
  rationale: துரத்திச் சென்று அவனை அடையும் சூழலைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: כִּי יִרְבֶּה הַדֶּרֶךְ
  choice: வழி நீண்டிருப்பதால்
  rationale: அடைக்கல நகரத்திற்குச் செல்ல வேண்டிய நீண்ட பயணவழி என்ற மூலமொழியின் நேரடியான காட்சியைப் பாதுகாக்கிறது.
- source_word: וְהִכָּהוּ נָפֶשׁ
  choice: அவனை அடித்துக் கொன்றுவிடக்கூடும்
  rationale: உயிரைப் பறிக்கும் வகையில் அடித்தல் என்ற எபிரெயச் சொல்லாட்சியின் வன்மையான, விளைவுசார் பொருளை இயல்பாகக் கூறுகிறது.
- source_word: וְלוֹ אֵין מִשְׁפַּט מָוֶת
  choice: அவன் மரணத்தீர்ப்புக்கு உரியவன் அல்ல
  rationale: அவன்மேல் சட்டப்படி மரணத்தீர்ப்பு விதிக்கத் தக்க காரணம் இல்லை என்ற நீதித்துறைப் பொருளைத் தெளிவாகக் காக்கிறது.
- source_word: כִּי לֹא שֹׂנֵא הוּא לוֹ
  choice: அவனைப் பகைத்திருக்காததால்
  rationale: முன்பகை இல்லாததே மரணத்தீர்ப்பு பொருந்தாமைக்கான சட்டக் காரணம் என்பதை வெளிப்படுத்துகிறது.
- source_word: מִתְּמוֹל שִׁלְשׁוֹם
  choice: முன்பே
  rationale: ‘நேற்றோ முந்தின நாளோ முதல்’ என்ற எபிரெய மரபுத்தொடரின் ‘முன்னதாக’ என்னும் பொருளைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
