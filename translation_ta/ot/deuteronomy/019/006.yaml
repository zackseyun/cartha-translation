translation_notes:
  register: நவீனத் தரத் தமிழில், சட்டச் சூழலுக்கேற்ற கண்ணியமான நடையுடன் மொழிபெயர்க்கப்பட்டுள்ளது. திட்டமிட்ட கொலை என்ற பொருளைத் தவறாகத் தரக்கூடிய சொல்லுக்குப் பதிலாக நடுநிலையான ‘கொன்றவன்’ பயன்படுத்தப்பட்டுள்ளது; எபிரெய உருவகங்களும் சட்டநுணுக்கமும் இயன்றவரை காக்கப்பட்டுள்ளன.
