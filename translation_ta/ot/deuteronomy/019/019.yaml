base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/019/019.yaml
  text: Then you shall do to him just as he intended to do to his brother[a]. So you shall purge the evil from your midst.
translation:
  language: ta
  text: அப்போது, அவன் தன் சகோதரனுக்குச்[a] செய்யத் திட்டமிட்டபடியே, நீங்கள் அவனுக்குச் செய்ய வேண்டும். அவ்வாறு உன் நடுவிலிருந்து தீமையை அகற்றுவாய்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தன் சக மனிதருக்கு”; எபிரெயத்தில் “தன் சகோதரனுக்கு.” இச்சட்டச் சூழலில் இது உடன்படிக்கைச் சமூகத்தைச் சேர்ந்த ஒருவரைக் குறிக்கும் சொல்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַעֲשִׂיתֶם
  choice: செய்ய வேண்டும்
  rationale: சமூகத்தாரையோ நீதிபதிகளையோ நோக்கிய சட்டக் கட்டளையின் வலிமையை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது; வாவால் குறிக்கப்படும் தொடர்ச்சி ‘அப்போது’ என்பதால் காட்டப்படுகிறது.
- source_word: לוֹ
  choice: அவனுக்கும்
  rationale: சூழலில் பொய்ச்சாட்சியாளனைக் குறிக்கும் மறைமுகச் செயப்படுபொருள்; முந்தைய ஒப்பீட்டு அமைப்புடன் இயல்பாக இணைகிறது.
- source_word: כַּאֲשֶׁר
  choice: படியே
  rationale: திட்டமிட்ட தண்டனையும் அவனுக்கு வழங்கப்பட வேண்டிய தண்டனையும் சரியாக ஒத்திருக்க வேண்டும் என்ற அளவுக்கேற்ற நீதியைத் தெரிவிக்கிறது.
- source_word: זָמַם
  choice: திட்டமிட்ட
  rationale: זמם என்பது செய்ய எண்ணி வகுத்த திட்டத்தைக் குறிக்கிறது; பொய்ச்சாட்சியின் தீய நோக்கம் சூழலிலேயே தெளிவாக இருப்பதால் அதற்கு மேலான உணர்வுநிறத்தைச் சேர்க்கவில்லை.
- source_word: לַעֲשׂוֹת
  choice: செய்ய
  rationale: זָמַם என்பதற்கு நிரப்பியாக வரும் வினையெச்சப் பொருளை நேரடியாகத் தருகிறது.
- source_word: לְאָחִיו
  choice: தன் சகோதரனுக்கு
  rationale: אָח என்ற மூலச்சொல்லின் ‘சகோதரன்’ என்னும் வடிவத்தைக் காக்கிறது; இச்சட்டச் சூழலில் அது உடன்படிக்கைச் சமூகத்தைச் சேர்ந்த ஒருவரையும் குறிக்கலாம் என்பதை அடிக்குறிப்பு தெரிவிக்கிறது.
- source_word: וּבִעַרְתָּ
  choice: இவ்வாறு ... அகற்ற வேண்டும்
  rationale: உபாகமச் சட்டச் சூத்திரத்தில் בער என்பது சொல்லர்த்தமான எரித்தலை அல்ல, சமூகத்திலிருந்து தீமையை நீக்குவதைக் குறிக்கிறது.
- source_word: הָרָע
  choice: தீமையை
  rationale: சட்டமீறலை மட்டும் அல்லாமல் அதன் ஒழுக்கத் தீவிரத்தையும் கொண்ட சூத்திரப் பொருளைப் பாதுகாக்கிறது.
- source_word: מִקִּרְבֶּךָ
  choice: உங்கள் நடுவிலிருந்து
  rationale: இஸ்ரவேல் சமூகத்தின் உள்ளிருந்து தீமை நீக்கப்பட வேண்டும் என்ற உடன்படிக்கைச் சமூக உருவகத்தைப் பாதுகாக்கிறது; எபிரெய ஒருமைச் சமூக முகவரியைத் தமிழில் இயல்பான மரியாதைப் பன்மையாக வழங்குகிறது.
theological_decisions:
- issue: சட்டச் சூழலில் பாலின வடிவமுள்ள உடன்படிக்கைச் சொல் אָחִיו
  choice: தன் சகோதரனுக்கு
  alternative: தன் சக மனிதருக்கு / தன் சக இஸ்ரவேலருக்கு
  rationale: எபிரெயச் சொல் ஆண்பால் ஒருமையில் இருந்தாலும், இச்சூழலில் உடன்படிக்கைச் சமூகத்தின் மற்றொரு உறுப்பினரை பிரதிநிதித்துவமாகக் குறிக்கலாம். முதன்மை உரை மூல வடிவத்தைப் பாதுகாக்கிறது; பரந்த சமூகப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன தரத் தமிழில், சட்டக் கட்டளைக்கேற்ற கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘செய்யத் திட்டமிட்டபடியே’ என்பது அளவுக்கேற்ற நீதியின் அமைப்பைத் தெளிவாகக் காட்டுகிறது; ‘தீமையை அகற்ற வேண்டும்’ என்பது உபாகமத்தின் நிலையான நீதிச் சூத்திரத்தை இயல்பாக வழங்குகிறது.
