- from: அப்போது, அவன் தன் சகோதரனுக்குச்[a] செய்யத் திட்டமிட்டபடியே அவனுக்கும் செய்ய வேண்டும். இவ்வாறு, உங்கள் நடுவிலிருந்து தீமையை அகற்ற வேண்டும்.
  to: அப்போது, அவன் தன் சகோதரனுக்குச்[a] செய்யத் திட்டமிட்டபடியே, நீங்கள் அவனுக்குச் செய்ய வேண்டும். அவ்வாறு உன் நடுவிலிருந்து தீமையை அகற்றுவாய்.
