base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/019/001.yaml
  text: When Yahweh your God cuts off the nations whose land Yahweh your God is giving you[a], and you dispossess them and dwell in their cities and houses,
translation:
  language: ta
  text: உன் கடவுளாகிய யாவே, உனக்குக் கொடுக்கிற அவர்களுடைய தேசத்தை உடைய மக்களினங்களை அகற்றும்போது[a], நீ அவர்களை வெளியேற்றி, அவர்களுடைய நகரங்களிலும் வீடுகளிலும் குடியிருப்பாய்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அழிக்கும்போது” அல்லது “ஒழிக்கும்போது”; எபிரெயத்தில் நேரடியாக, “வெட்டி அகற்றும்போது.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: அகற்றும்போது
  rationale: இங்கு வரும் சட்டக் கட்டளைகளுக்கான, நிகழும் என எதிர்பார்க்கப்படும் எதிர்காலச் சூழலை அறிமுகப்படுத்துவதால், நிபந்தனையைவிட காலப்பொருளைக் காட்டும் ‘போது’ இயல்பானது.
- source_word: יַכְרִית
  choice: அகற்றும்போது
  rationale: ஹிபீல் வடிவம் இங்கு மக்களினங்களை அந்தத் தேசத்திலிருந்து நீக்குவதைக் குறிக்கிறது. ‘அகற்று’ என்பது தமிழில் இயல்பாகவும் தெளிவாகவும் உள்ளது; எபிரெயத்தின் நேரடி உருவகம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைப்பட்டத்தால் மாற்றாமல், நான்கு எழுத்துகளைக் கொண்ட தனிப்பெயரைத் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: אֱלֹהֶיךָ
  choice: உன் கடவுளாகிய
  rationale: இரண்டாம் நபர் ஒருமை உறவைத் துல்லியமாகக் காட்டும் இயல்பான தமிழ் அமைப்பு.
- source_word: הַגּוֹיִם
  choice: மக்களினங்கள்
  rationale: இங்கு இஸ்ரவேலுக்கு முன்பாக தேசத்தில் வாழும் பல இனக்குழுக்களைச் சுட்டுகிறது; பிற்கால சமயப் பொருளை ஏற்றாமல் மொழிபெயர்க்கிறது.
- source_word: נֹתֵן לְךָ אֶת אַרְצָם
  choice: உனக்குக் கொடுக்கிற தேசத்திற்குரிய
  rationale: நֹתֵן என்ற பங்கேற்புவினையின் நிகழ்நிலை/உறுதியான செயற்பாட்டை ‘கொடுக்கிற’ காக்கிறது; אַרְצָם என்பதிலுள்ள ‘அவர்களுடைய தேசம்’ என்ற உறவு தமிழில் தொடர்புச் சொல்லால் இயல்பாக வெளிப்படுகிறது.
- source_word: וִירִשְׁתָּם
  choice: நீ அவர்களைத் துரத்திவிட்டு
  rationale: மனிதர்களைக் குறிக்கும் நேரடி செயப்படுபொருள் இருப்பதால், இங்கு அவர்களை உடைமையாக்குவது அல்ல, அவர்களிடமிருந்து இடத்தைப் பறித்து வெளியேற்றுவது பொருள்.
- source_word: וְיָשַׁבְתָּ
  choice: குடியிருப்பாய்
  rationale: அங்கு வாழ்வதோடு நிலையாகக் குடியேறுவதையும் சுருக்கமாகக் காட்டுகிறது.
- source_word: בְעָרֵיהֶם וּבְבָתֵּיהֶם
  choice: அவர்களுடைய நகரங்களிலும் வீடுகளிலும்
  rationale: இரு பெயர்களிலும் உள்ள முன்னிலையையும் பன்மை உரிமைச் சுட்டையும் தமிழில் தெளிவாகப் பேணுகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழியாக்கம்
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலத்தில் பட்டமல்ல, இறைவனின் தனிப்பெயர் நேரடியாக உள்ளது. ஆகவே பட்டத்தால் மாற்றாமல் தமிழில் ஒலிபெயர்க்கப்படுகிறது.
- issue: יַכְרִית என்பதன் வன்முறைத் தீவிரம்
  choice: அகற்றுகிறார்
  alternative: அழிக்கிறார் / துண்டிக்கிறார்
  rationale: சொல் ‘வெட்டி அகற்றுதல், ஒழித்தல்’ என்ற தீவிரத்தைக் கொண்டிருக்கலாம். இச்சூழலில் தேசத்திலிருந்து மக்களினங்களை நீக்குவது மையம்; ‘அழித்தல்’ என மட்டும் கூறி முழுமையான உயிரழிப்பைத் தீர்மானிக்காமல், மாற்று நுணுக்கங்கள் அடிக்குறிப்பில் பாதுகாக்கப்படுகின்றன.
translation_notes:
  register: நவீன நிலையான தமிழில், சட்டவுரைக்கேற்ற கண்ணியமான நடையுடன் ஒருமை ‘நீ/உன்’ வடிவம் பேணப்பட்டுள்ளது. வசனம் அடுத்த கட்டளையுடன் தொடரும் சார்புவாக்கியமாக இருப்பதால் இறுதியில் தொடர்ச்சியைக் காட்டும் வகையில் அமைக்கப்பட்டுள்ளது.
