base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/019/002.yaml
  text: You shall set apart three cities for yourself within your land that Yahweh your God is giving you to possess[a].
translation:
  language: ta
  text: உன் கடவுளாகிய யாவே, நீ உடைமையாக்கிக்கொள்ளும்படி உனக்குக் கொடுக்கிற உன் நாட்டிற்குள், உனக்காக மூன்று நகரங்களைத் தனியே ஒதுக்க வேண்டும்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நீ சுதந்தரித்துக்கொள்ளும்படி.” நிலம் வழங்கப்படும் சூழல்களில் எபிரெய வினைச்சொல் “உடைமையாக்கிக்கொள்ளுதல்” அல்லது “சுதந்தரித்துக்கொள்ளுதல்” என்று பொருள்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁלֹשׁ עָרִים
  choice: மூன்று நகரங்கள்
  rationale: עִיר என்பது நகரம் அல்லது ஊர் எனப் பொருள்படலாம்; அடைக்கல நகரங்களைப் பற்றிய சட்டச் சூழலில் ‘நகரங்கள்’ இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: תַּבְדִּיל
  choice: தனியாக ஒதுக்க வேண்டும்
  rationale: בדל என்பதன் ஹிப்ஃபில் வடிவம் பிரித்தல் அல்லது தனிப்படுத்துதல் எனப் பொருள்படும்; இங்கு சட்டப்படி குறிப்பிட்ட நோக்கத்திற்காக ஒதுக்குவதைக் குறிக்கிறது.
- source_word: לָךְ
  choice: உனக்காக
  rationale: பெறுநரின் நன்மை அல்லது பயன்பாட்டைக் குறிக்கும் எபிரெய தத்திவப் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: בְּתוֹךְ אַרְצְךָ
  choice: உன் நாட்டிற்குள்
  rationale: בְּתוֹךְ என்பதன் உட்புறம் அல்லது நடுவில் என்ற இடப்பொருளைப் பேணும் இயல்பான தமிழ் வடிவம்.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய மெய்யெழுத்துப் பெயரான יהוה-ஐ ஒரு பட்டத்தால் மாற்றாமல், தமிழில் பரவலாகப் புரிந்துகொள்ளக்கூடிய ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: אֱלֹהֶיךָ
  choice: உன் கடவுள்
  rationale: இரண்டாம் நபர் ஒருமை உடைமைப் பின்னொட்டுடன் உள்ள உடன்படிக்கைச் சொல்லாட்சியை நேரடியாகப் பேணுகிறது.
- source_word: נֹתֵן לְךָ
  choice: உனக்குக் கொடுக்கிற
  rationale: எபிரெய நிகழ்கால வினையெச்சம் தொடர்ந்து நடைபெறும் அல்லது நெருங்கிய செயலைக் குறிக்கிறது; வாக்குத்தத்தச் சூழலில் இந்த வடிவம் இயல்பாக உள்ளது.
- source_word: לְרִשְׁתָּהּ
  choice: நீ உரிமையாக்கிக்கொள்ளும்படி
  rationale: ירשׁ என்பது நிலத்தைச் சுதந்தரித்தல் அல்லது உடைமையாக்குதல் எனப் பொருள்படலாம்; கடவுள் வழங்கும் நாட்டைக் கைப்பற்றி உரிமையாகக் கொள்வதை இத்தேர்வு தெளிவாகக் காட்டுகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலத்தில் தனிப்பட்ட இறைப் பெயர் நேரடியாக உள்ளது; அதை பொதுப்பட்டமாக மாற்றாமல் ஒலிபெயர்ப்பது மூலத்தின் வேறுபாட்டைப் பேணுகிறது.
- issue: ירשׁ என்பதன் நில-உரிமைப் பொருள்
  choice: உரிமையாக்கிக்கொள்ளுதல்
  alternative: சுதந்தரித்துக்கொள்ளுதல்
  rationale: வழங்கப்பட்ட நாட்டைப் பெறுதல் மற்றும் உடைமையாக்குதல் ஆகிய பொருள்களை முதன்மை உரை காட்டுகிறது; ‘சுதந்தரித்தல்’ என்ற உண்மையான மாற்றுப் பொருள் அடிக்குறிப்பில் பேணப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், ஒருமை இரண்டாம் நபர் சட்டக் கட்டளையின் நேரடித் தன்மை பேணப்பட்டுள்ளது. ‘தனியாக ஒதுக்க வேண்டும்’ என்பது பிரித்துவைத்தல் மற்றும் அதிகாரப்பூர்வமாக நியமித்தல் ஆகிய இரு நுணுக்கங்களையும் இயல்பாக வெளிப்படுத்துகிறது.
