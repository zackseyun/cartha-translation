  to: உன் கடவுளாகிய யாவே, நீ உடைமையாக்கிக்கொள்ளும்படி உனக்குக் கொடுக்கிற உன் நாட்டிற்குள், உனக்காக மூன்று நகரங்களைத் தனியே ஒதுக்க வேண்டும்.[a]
