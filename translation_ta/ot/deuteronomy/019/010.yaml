  text: so that innocent blood may not be shed in the midst of your land that Yahweh your God is giving you as an inheritance[a], and bloodguilt would be upon you.
translation:
  language: ta
  text: இதனால், உங்கள் கடவுளாகிய யாவே உங்களுக்குச் சுதந்தரமாகக் கொடுக்கிற உங்கள் நாட்டின் நடுவில் குற்றமற்ற இரத்தம் சிந்தப்படாதபடியும், இரத்தப்பழி உங்கள்மேல் வராதபடியும் இருக்கும்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'நேர்ச்சொல்லாக: ‘இரத்தங்கள் உங்கள்மேல் இருக்கும்.’ இந்த எபிரெய மரபுத்தொடர், குற்றமற்ற இரத்தம் சிந்தப்பட்டதற்கான பொறுப்பாகிய இரத்தப்பழியைக் குறிக்கிறது.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשָּׁפֵךְ
  choice: சிந்தப்பட்டு
  rationale: שׁפך என்பதன் நிஃபால் வடிவம் இங்கு இரத்தம் சிந்தப்படுவதைக் குறிக்கிறது. கொலை மற்றும் சட்டச் சூழலில் ‘இரத்தம் சிந்தப்படுதல்’ என்பது இயல்பான நவீனத் தமிழ் வழக்கு.
- source_word: דָּם נָקִי
  choice: குற்றமற்ற இரத்தம்
  rationale: மரணத்திற்குத் தகுந்த குற்றம் செய்யாத ஒருவரின் இரத்தத்தைக் குறிக்கும் செறிவான சட்ட-அறச் சொற்றொடராக எபிரெய வடிவம் பாதுகாக்கப்படுகிறது.
- source_word: בְּקֶרֶב אַרְצְךָ
  choice: உங்கள் நாட்டின் நடுவில்
  rationale: קֶרֶב என்பதன் ‘நடு/உட்பகுதி’ என்ற இடப்பொருளைப் பாதுகாத்து, கண்ணியமான தமிழ் நடையில் வழங்குகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இது ஒரு பட்டப்பெயர் அல்ல, தேவனுடைய தனிப்பெயரான நான்கு எழுத்துப் பெயர். ‘Yahweh’ என்பதற்கான இயல்பான தமிழ் ஒலிபெயர்ப்பு ‘யாவே’.
- source_word: נֹתֵן לְךָ נַחֲלָה
  choice: உங்களுக்கு உரிமைச் சொத்தாகக் கொடுக்கிற
  rationale: நֹתֵן என்பதன் தொடர்நிலைச் செயற்பொருளையும், נַחֲלָה என்பதன் பரம்பரை உரிமை/உரிமைச் சொத்து கருத்தையும் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: וְהָיָה עָלֶיךָ דָּמִים
  choice: இரத்தப்பழி உங்கள்மேல் வர
  rationale: சட்டச் சூழலில் דָּמִים என்பது குற்றமற்ற இரத்தத்தைச் சிந்தியதற்கான பொறுப்பு அல்லது பழியைக் குறிக்கிறது; עַל அமைப்பு அந்தப் பொறுப்பு ஒருவர்மேல் இருப்பதைச் சொல்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: ஆண்டவர் / யெகோவா
  rationale: மூலவசனம் இறைவனுடைய தனிப்பெயரையே பயன்படுத்துவதால், அதை ஒரு பட்டப்பெயரால் மாற்றாமல் தமிழ் ஒலிபெயர்ப்பாக வழங்குகிறது.
- issue: இறுதிக் கூற்றின் நோக்க/எச்சரிக்கை உறவு
  choice: ‘சிந்தப்பட்டு, இரத்தப்பழி உங்கள்மேல் வராதபடி’
  alternative: ‘இரத்தப்பழி உங்கள்மேல் இருக்கும்’ என்று தனி உறுதிக் கூற்றாக மொழிபெயர்த்தல்
  rationale: முந்தைய கட்டளைகளுடன் தொடரும் וְלֹא அமைப்பு, குற்றமற்ற இரத்தம் சிந்தப்படுவதையும் அதனால் இரத்தப்பழி ஏற்படுவதையும் தவிர்க்கும் நோக்கத்தை வெளிப்படுத்துகிறது. அதேவேளை, இரத்தப்பழி வருவது இரத்தம் சிந்தப்பட்டதன் விளைவு என்ற எச்சரிக்கையும் காக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சட்டநடையின் கண்ணியத்தையும் மூலத்தின் சுருக்கத்தையும் காக்கும் வகையில் வடிவமைக்கப்பட்டது. ‘பார்த்துக்கொள்ளுங்கள்’ என்பது முந்தைய வசனங்களிலிருந்து தொடரும் நோக்கக் கட்டமைப்பை தமிழில் முழுமையான வாக்கியமாக்குகிறது.
