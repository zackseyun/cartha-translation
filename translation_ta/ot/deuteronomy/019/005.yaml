  text: וַ/אֲשֶׁר֩ יָבֹ֨א אֶת רֵעֵ֥/הוּ בַ/יַּעַר֮ לַ/חְטֹ֣ב עֵצִים֒ וְ/נִדְּחָ֨ה יָד֤/וֹ בַ/גַּרְזֶן֙ לִ/כְרֹ֣ת הָ/עֵ֔ץ וְ/נָשַׁ֤ל הַ/בַּרְזֶל֙ מִן הָ/עֵ֔ץ וּ/מָצָ֥א אֶת רֵעֵ֖/הוּ וָ/מֵ֑ת ה֗וּא יָנ֛וּס אֶל אַחַ֥ת הֶ/עָרִים הָ/אֵ֖לֶּה וָ/חָֽי־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/019/005.yaml
  text: But if a man goes with his neighbor into the forest to cut wood[a], and his hand swings the axe to cut down the tree, and the iron head slips from the handle and strikes his neighbor so that he dies, he may flee to one of these cities and live.
translation:
  language: ta
  text: ஒருவன் விறகு வெட்டுவதற்காகத் தன் அயலானுடன் காட்டுக்குச் சென்று, மரத்தை வெட்டக் கோடரியை ஓங்கும்போது, இரும்புத் தலை மரக்கைப்பிடியிலிருந்து கழன்று[a] அவனுடைய அயலானைத் தாக்கி, அயலான் இறந்துபோனால், அவன் இந்த நகரங்களில் ஒன்றுக்கு ஓடிப்போய் உயிர்வாழலாம்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: நேரடியாக, “இரும்பு மரத்திலிருந்து கழன்றது.” இங்கு “இரும்பு” என்பது கோடரியின் இரும்புத் தலையையும், “மரம்” என்பது அதன் மரக்கைப்பிடியையும் குறிக்கின்றன.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲשֶׁר
  choice: ஒருவன் ... போனால்
  rationale: முந்தைய சட்டச் சூழலைத் தொடரும் நிபந்தனை நிகழ்வை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: רֵעֵהוּ
  choice: தன் அயலான் / அவனுடைய அயலான்
  rationale: சட்டப் பின்னணியில் நெருங்கிய நண்பனை மட்டும் அல்லாமல் உடனிருக்கும் சக மனிதரைக் குறிக்கும் பரந்த சமூகப் பொருளைப் பேணுகிறது.
- source_word: בַיַּעַר
  choice: காட்டுக்கு
  rationale: יַעַר என்பதன் மரங்கள் அடர்ந்த நிலப்பகுதி என்ற பொருளைத் தெளிவாக வழங்குகிறது.
- source_word: לַחְטֹב עֵצִים
  choice: விறகு வெட்டுவதற்காக
  rationale: பொதுவான மரவெட்டும் செயலைத் தமிழில் இயல்பாகக் குறிக்கிறது; குறிப்பிட்ட ஒரு மரத்தை வீழ்த்துவதை மட்டும் முன்கூட்டியே வரையறுப்பதில்லை.
- source_word: וְנִדְּחָה יָדוֹ בַגַּרְזֶן
  choice: கோடரியை ஓங்கும்போது
  rationale: கோடரியைக் கொண்டு கை செலுத்தப்படும் இயக்கத்தை வார்த்தைக்கு வார்த்தை செயற்கையாக மொழிபெயர்க்காமல், நிகழ்வைத் தெளிவாகக் காட்டுகிறது.
- source_word: לִכְרֹת הָעֵץ
  choice: மரத்தை வெட்ட
  rationale: இந்தச் சூழலில் மரத்தை வெட்டி வீழ்த்தும் நோக்கைக் குறிக்கிறது; தமிழில் சுருக்கமாகவும் இயல்பாகவும் உள்ளது.
- source_word: וְנָשַׁל הַבַּרְזֶל מִן הָעֵץ
  choice: இரும்புத் தலை மரக்கைப்பிடியிலிருந்து கழன்று
  rationale: எபிரெயத்தில் நேரடியாக ‘இரும்பு மரத்திலிருந்து கழன்றது’ என்று இருந்தாலும், சூழலில் அவை கோடரியின் இரும்புத் தலை மற்றும் மரக்கைப்பிடியைக் குறிக்கின்றன. முதன்மை உரை பொருளைத் தெளிவாக்கி, அடிக்குறிப்பு நேரடி வடிவத்தைப் பதிவு செய்கிறது.
- source_word: וּמָצָא אֶת רֵעֵהוּ
  choice: அவனுடைய அயலானைத் தாக்கி
  rationale: מצא என்பதன் அடிப்படைப் பொருள் ‘சென்றடைதல்/கண்டடைதல்’; இங்கு பறந்த இரும்புத் தலை ஒருவரைச் சென்றடைந்து தாக்குவதைக் குறிக்கிறது.
- source_word: וָמֵת
  choice: அவன் இறந்துபோனால்
  rationale: இறப்பவர் அயலானே என்பதைத் தமிழ் சுட்டுப்பெயருடன் தெளிவாகக் காட்டுகிறது.
- source_word: הוּא יָנוּס ... וָחָי
  choice: அந்த மனிதன் ... ஓடிப்போய் உயிர்தப்பலாம்
  rationale: குற்றமற்ற கொலையாளிக்குக் கிடைக்கும் பாதுகாப்பான வாய்ப்பை ‘லாம்’ என வெளிப்படுத்தி, உயிருடன் தொடர்வது இங்கு உயிர்தப்புதலைக் குறிக்கும் என்பதை இயல்பாக வழங்குகிறது.
theological_decisions:
- issue: הוּא יָנוּס என்பதன் சட்ட நுணுக்கம்
  choice: ஓடிப்போய் ... உயிர்தப்பலாம்
  alternative: ஓடிப்போய் ... உயிர்வாழ வேண்டும் / ஓடிப்போவான்
  rationale: இது அடைக்கலப் பட்டணத்துக்குச் செல்ல அனுமதிக்கும் பாதுகாப்புச் சட்டம். கட்டளை அல்லது வெறும் எதிர்கால நிகழ்வாக மட்டும் தீர்மானிக்காமல், வாய்ப்பு மற்றும் உரிமை சார்ந்த நுணுக்கத்தைப் பேணுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சட்டச் சூழலுக்கேற்ற கண்ணியமான ஆனால் பொதுவாசகருக்கு எளிதில் புரியும் நடை. ‘அயலான்’, ‘கோடரி’, ‘மரக்கைப்பிடி’, ‘உயிர்தப்பலாம்’ ஆகிய சொற்கள் மூலத்தின் சட்ட மற்றும் நிகழ்வு சார்ந்த நுணுக்கத்தை இயல்பாகக் காக்கின்றன.
