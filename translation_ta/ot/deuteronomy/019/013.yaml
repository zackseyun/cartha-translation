base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/019/013.yaml
  text: Your eye shall not pity him[a], but you shall purge the innocent blood from Israel[b], and it shall go well with you.
translation:
  language: ta
  text: அவன்மேல் உன் கண் இரங்கக்கூடாது[a]; ஆனால், குற்றமற்ற இரத்தத்தின் பழியை இஸ்ரவேலிலிருந்து அகற்றிவிடு[b]; அப்போது உனக்கு நன்மை உண்டாகும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உன் கண் அவனை விட்டுவிடக்கூடாது.” இரக்கம் அல்லது பரிவைக் குறிக்க எபிரெய மரபுத்தொடர் ‘கண்’ என்பதைக் குறிப்பிடுகிறது.
    reason: lexical_alternative
  - marker: b
    text: அதாவது, குற்றமற்றவரின் இரத்தம் சிந்தப்பட்டதால் இஸ்ரவேல் சமூகத்தின்மேல் ஏற்பட்ட இரத்தப்பழியை அகற்றிவிடு.
    reason: lexical_alternative
