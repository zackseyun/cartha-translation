  choice: அவன்மேல் உன் கண் இரக்கம் கொள்ளக்கூடாது
  rationale: חוס உடன் வரும் ‘உன் கண்’ என்ற எபிரெய உருவகத்தைத் தக்கவைத்து, இரக்கம் காரணமாகக் குற்றவாளியைத் தப்பவிடக் கூடாது என்ற நீதித்துறைச் சூழலை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: וּבִעַרְתָּ
  choice: அகற்றிவிடு
  rationale: உபாகமத்தின் சட்டச் சூழலில் בער என்பது நேரடியாக எரிப்பதை அல்ல, சமூகத்திலிருந்து தீமை அல்லது இரத்தப்பழியை முற்றிலும் நீக்குவதைச் சுட்டுகிறது.
- source_word: דַם הַנָּקִי
  choice: குற்றமற்ற இரத்தத்தின் பழி
  rationale: சொற்றொடரின் ‘குற்றமற்ற இரத்தம்’ என்ற உருவகத்தையும், குற்றமற்றவரைக் கொன்றதால் சமூகத்தின்மேல் வரும் இரத்தப்பழி என்ற சட்டப் பொருளையும் தமிழில் தெளிவாக இணைக்கிறது.
- source_word: מִיִּשְׂרָאֵל
  choice: இஸ்ரவேலிலிருந்து
  rationale: מן குறிக்கும் அகற்றப்பட வேண்டிய சமூக எல்லையைச் சுருக்கமாகவும் நேரடியாகவும் காட்டுகிறது.
- source_word: וְטוֹב לָךְ
  choice: அப்போது உனக்கு நன்மை உண்டாகும்
  rationale: கீழ்ப்படிதலைத் தொடர்ந்து வரும் நலமான விளைவைச் சொல்லும் உபாகமத்தின் உடன்படிக்கைச் சூத்திரத்தை இயல்பான நவீன தமிழில் தருகிறது.
theological_decisions:
- issue: கொலைகாரனைத் தண்டிக்கும் கட்டளையின் தன்மை
  choice: தவறான இரக்கத்தால் நீதியைத் தடுக்காமல், முறையான நீதித்துறை நடவடிக்கையால் சமூகத்தின் இரத்தப்பழியை அகற்ற வேண்டும் என்ற கட்டளையாக மொழிபெயர்க்கப்பட்டது.
  alternative: தனிப்பட்ட பழிவாங்குதலுக்கு அனுமதி அளிக்கும் கட்டளையாகப் புரிந்துகொள்ளுதல்.
  rationale: உபாகமம் 19:11–12 இன் சூழல் திட்டமிட்டுக் கொன்றவனை மூப்பர்கள் சட்டப்படி கையாளுவதைப் பற்றியது; ஆகவே தனிப்பட்ட பழிவாங்குதலை உரையில் சேர்க்காமல் நீதித்துறைச் சூழல் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சட்டப்பூர்வமான கண்ணியத்துடன் மொழிபெயர்க்கப்பட்டுள்ளது. ‘உன் கண் இரக்கம் கொள்ளக்கூடாது’ என்பது எபிரெய மூலத்தின் உடல்-உருவகத்தைத் தக்கவைக்கிறது; அடிக்குறிப்பு அதன் பொருளை விளக்குகிறது. ஒருமை இரண்டாம் நபர் கட்டளை வடிவம் முழுவதும் பாதுகாக்கப்பட்டுள்ளது.
