  text: כִּֽי יָק֥וּם עֵד חָמָ֖ס בְּ/אִ֑ישׁ לַ/עֲנ֥וֹת בּ֖/וֹ סָרָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/019/016.yaml
  text: If a malicious witness rises up against a man to testify against him of rebellion[b][a],
translation:
  language: ta
  text: தீய நோக்கமுள்ள ஒரு சாட்சி[a] ஒருவனுக்கு எதிராக எழுந்து, அவன் கலகம் செய்ததாகக் குற்றஞ்சாட்டிச் சாட்சியளித்தால்,[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பொய்ச் சாட்சி.” எபிரேயச் சொற்றொடர் சொற்படி “வன்முறை/அநீதியின் சாட்சி” எனப்படுகிறது; நீதிமன்றத்தில் தீய நோக்கத்துடன் அல்லது பொய்யாகக் குற்றஞ்சாட்டுபவனை இது குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “நெறிபிறழ்ந்ததாக” அல்லது “விசுவாசத்துரோகம் செய்ததாக.” எபிரேயச் சொல் கடுமையான விலகல், எதிர்ப்பு அல்லது துரோகத்தைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: —ஆல் (நிபந்தனை விகுதி)
  rationale: சட்ட வழக்கை அறிமுகப்படுத்தும் நிபந்தனையாக இருப்பதால், தமிழில் இயல்பான ‘சாட்சியளித்தால்’ என்ற அமைப்பில் மொழிபெயர்க்கப்பட்டது.
- source_word: יָקוּם
  choice: எழுந்து
  rationale: சாட்சியாக முன்வந்து நிற்பதைக் குறிக்கும் மூலமொழியின் உருவகத்தைத் தக்கவைக்கிறது.
- source_word: עֵד חָמָס
  choice: தீய நோக்கமுள்ள ஒரு சாட்சி
  rationale: இச்சொற்றொடர் சொற்படி ‘வன்முறை/அநீதியின் சாட்சி’ என்று பொருள்படும்; நீதிமன்றச் சூழலில் தீங்கு செய்யும் நோக்கத்தோடு குற்றஞ்சாட்டும் சாட்சியைக் குறிக்கிறது.
- source_word: בְּאִישׁ
  choice: ஒருவனுக்கு எதிராக
  rationale: בְּ இங்கு சாட்சியால் குறிவைக்கப்படும் நபரைக் குறிக்கிறது; אִישׁ என்பதன் ஒருமை ஆண்பால் வடிவமும் தக்கவைக்கப்பட்டது.
- source_word: לַעֲנוֹת
  choice: சாட்சியளித்தால்
  rationale: ענה என்பதற்கு பொதுவாக ‘பதிலளித்தல்’ என்ற பொருள் இருந்தாலும், சட்டச் சூழலில் சாட்சியம் கூறுவதைக் குறிக்கிறது.
- source_word: בּוֹ
  choice: அவன் ... செய்ததாக
  rationale: குற்றச்சாட்டு அந்த மனிதனுக்கு எதிரானது என்பதை இயல்பான தமிழ் மறைமுகக் கூற்று அமைப்பில் தெரிவிக்கிறது.
- source_word: סָרָה
  choice: கலகம்
  rationale: விலகுதல், பிறழ்ச்சி, எதிர்ப்பு அல்லது கலகம் என்ற கருத்தைக் கொண்ட இச்சொல்லின் கடுமையைப் பொதுவான ‘தவறு’ என்று தளர்த்தாமல், குறிப்பாக மதத்துரோகம் என்ற பொருளையும் கட்டாயப்படுத்தாமல் வழங்குகிறது.
theological_decisions:
- issue: சட்ட மொழியில் பிரதிநிதித்துவ ஆண்பால்
  choice: ஒருவனுக்கு எதிராக
  alternative: ஒருவருக்கு எதிராக
  rationale: மூலமொழியில் אִישׁ என்பது ஒருமை ஆண்பால். சட்ட வழக்கின் பிரதிநிதித்துவ அமைப்பை மாற்றாமல் அதைப் பாதுகாக்கிறது.
- issue: סָרָה குற்றச்சாட்டின் தன்மை
  choice: கலகம்
  alternative: தவறு / நெறிபிறழ்வு / விசுவாசத்துரோகம்
  rationale: மூலச்சொல்லின் தீவிரமான விலகல் அல்லது எதிர்ப்பைத் தக்கவைக்கிறது; அதேவேளையில் இந்த இடத்தில் வெளிப்படையாக இல்லாத மதரீதியான விசுவாசத்துரோகத்தை மட்டும் பொருளாக நிர்ணயிப்பதில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், சட்டச் சூழலுக்கேற்ற கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. ‘எழுந்து’ என்ற மூல உருவகம் பாதுகாக்கப்பட்டுள்ளது; நிபந்தனைத் தொடர் தமிழுக்கு இயல்பாக இறுதி வினையில் அமைக்கப்பட்டுள்ளது.
