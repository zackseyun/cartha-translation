  source_fidelity: 'முதன்மை உரை எபிரெயத்தின் சட்ட நிபந்தனை அமைப்பையும் முக்கிய கூறுகளையும் துல்லியமாகத் தருகிறது: עֵד חָמָס என்பதற்கு ‘தீய நோக்கமுள்ள ஒரு சாட்சி,’ יָקוּם என்பதற்கு ‘எழுந்து,’ மற்றும் לַעֲנוֹת בּוֹ סָרָה என்பதற்கு ஒருவனுக்கு எதிராகக் கலகக் குற்றச்சாட்டு குறித்து சாட்சியளித்தல் எனப் பொருள் வழங்கப்பட்டுள்ளது. ‘கலகம் செய்ததாக’ என்பது சாத்தியமான வாசிப்பே; ஆயினும் சாட்சியின் குற்றச்சாட்டு என்ற சட்டவியல் உறவை ‘கலகம் குறித்துச் சாட்சியளிக்க’ என வெளிப்படுத்துவது தமிழில் இன்னும் நேரடியாக அமைகிறது.'
