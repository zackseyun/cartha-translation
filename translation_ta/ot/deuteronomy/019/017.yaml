  text: then the two men who have the dispute shall stand before Yahweh[b][a], before the priests and the judges who are in office in those days.
translation:
  language: ta
  text: அப்போது, தகராறு கொண்ட அந்த இரு ஆண்களும் யாவே முன்னிலையில், அந்நாட்களில் பதவியில் இருக்கும் ஆசாரியர்கள் மற்றும் நீதிபதிகள் முன்னிலையில் நிற்க வேண்டும்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעָמְדוּ
  choice: அப்போது ... நிற்க வேண்டும்
  rationale: வாவ் இணைப்புடன் வரும் வினை, சட்ட நடைமுறையின் அடுத்த கட்டத்தைத் தொடர்ச்சியாகக் குறிக்கிறது. ‘அப்போது’ அந்த நடைமுறைத் தொடர்ச்சியையும், ‘நிற்க வேண்டும்’ கட்டளைக்குரிய நீதித்துறைத் தொனியையும் இயல்பான தமிழில் தருகிறது.
- source_word: שְׁנֵי הָאֲנָשִׁים
  choice: அந்த இரு ஆண்களும்
  rationale: எபிரெயச் சொற்றொடர் எண்ணிக்கையையும் ஆண்பால் பன்மையையும் வெளிப்படையாகக் குறிப்பிடுகிறது. சட்டச் சூழலை மட்டும் முன்னிறுத்தி ‘இரு தரப்பினரும்’ என்று விளக்கமாக மாற்றாமல், மூலத்தின் வடிவம் காக்கப்படுகிறது.
- source_word: אֲשֶׁר לָהֶם הָרִיב
  choice: தங்களுக்குள் தகராறு உள்ள
  rationale: רִיב என்பது தகராறு, சர்ச்சை, அல்லது சட்ட வழக்கு எனப் பொருள்படலாம். ‘தங்களுக்குள் தகராறு உள்ள’ என்பது ‘அவர்களுக்குரியது தகராறு’ என்ற எபிரெயக் கட்டமைப்பின் உறவுப் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது; சட்ட வழக்கு என்ற மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: לִפְנֵי יְהוָה
  choice: யாவே முன்னிலையில்
  rationale: לִפְנֵי என்பதன் முன்னிலை/சந்நிதி சார்ந்த நீதித்துறைப் பொருள் காக்கப்படுகிறது. தேவனுடைய தனிப்பெயரான יהוה, ‘யாவே’ என்று ஒலிபெயர்க்கப்படுகிறது.
- source_word: לִפְנֵי הַכֹּהֲנִים וְהַשֹּׁפְטִים
  choice: ஆசாரியர்களுக்கும் நீதிபதிகளுக்கும் முன்னிலையில்
  rationale: இரு அதிகாரக் குழுக்களும் குறிப்பாகச் சுட்டப்படுகின்றன. எபிரெயத்தில் மீண்டும் வரும் ‘முன்னிலையில்’ என்ற அமைப்பு தமிழிலும் காக்கப்பட்டுள்ளது.
- source_word: אֲשֶׁר יִהְיוּ בַּיָּמִים הָהֵם
  choice: அந்நாட்களில் பொறுப்பில் இருக்கும்
  rationale: அந்தக் காலத்தில் பதவிப் பொறுப்பில் உள்ளவர்களையே இச்சொற்றொடர் அடையாளப்படுத்துகிறது. ‘பொறுப்பில் இருக்கும்’ என்பது வெறுமனே அங்கே இருப்பதைக் காட்டாமல் அதிகாரப்பூர்வச் செயல்பாட்டை இயல்பாக உணர்த்துகிறது.
theological_decisions:
- issue: יהוה என்ற தேவப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூல உரையில் உடன்படிக்கைக்குரிய தேவப் பெயர் நேரடியாக உள்ளது. அதை பொதுப் பட்டப்பெயராக மாற்றாமல், தனிப்பெயராக ஒலிபெயர்ப்பது மூலத்தின் வேறுபாட்டைக் காக்கிறது.
- issue: ‘யாவே முன்னிலையில்’ என்பதற்கும் ஆசாரியர் மற்றும் நீதிபதிகள் முன்னிலையில் நிற்பதற்கும் உள்ள உறவு
  choice: இரண்டு முன்னிலைச் சொற்றொடர்களையும் இணையாக வைத்தல்
  alternative: ‘அதாவது’ என்று இரண்டாவது சொற்றொடரை முதலாவதன் விளக்கமாக்குதல்
  rationale: எபிரெயம் இரண்டு முறை לִפְנֵי என்பதைப் பயன்படுத்துகிறது; ஆனால் அவற்றின் உறவை ‘அதாவது’ என்று வெளிப்படையாகத் தீர்மானிப்பதில்லை. எனவே மூலத்தின் நீதித்துறை மற்றும் இறைமுன்னிலை சார்ந்த பதற்றம் விளக்கமின்றி காக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சட்ட நடைமுறைக்கேற்ற கண்ணியமான தொனி பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் ‘முன்னிலையில்’ என்ற மீளுருவாக்கம் திட்டமிட்டு காக்கப்பட்டுள்ளது; தேவையற்ற நிர்வாக மொழியும் சமயப் பிரிவு சார்ந்த சொற்களும் தவிர்க்கப்பட்டுள்ளன.
