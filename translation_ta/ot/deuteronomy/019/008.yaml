  text: וְ/אִם יַרְחִ֞יב יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ אֶת גְּבֻ֣לְ/ךָ֔ כַּ/אֲשֶׁ֥ר נִשְׁבַּ֖ע לַ/אֲבֹתֶ֑י/ךָ וְ/נָ֤תַן לְ/ךָ֙ אֶת כָּל הָ/אָ֔רֶץ אֲשֶׁ֥ר דִּבֶּ֖ר לָ/תֵ֥ת לַ/אֲבֹתֶֽי/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/019/008.yaml
  text: And if Yahweh your God enlarges your territory[a], as he swore to your fathers, and gives you all the land that he promised to give to your fathers,
translation:
  language: ta
  text: மேலும், உன் கடவுளாகிய யாவே உன் தந்தையருக்கு[a] சத்தியம் செய்தபடி உன் எல்லையை விரிவுபடுத்தி, உன் தந்தையருக்குக் கொடுப்பதாக அவர் கூறிய நாடு முழுவதையும் உனக்குக் கொடுத்தால்,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உன் முன்னோர்களுக்கு.” இவ்வசனத்தில் வரும் “உன் தந்தையருக்கு” என்ற இரு இடங்களிலும் இவ்வாறு மொழிபெயர்க்கலாம். எபிரெயத்தில் நேரடியாக “உன் தந்தையருக்கு” என்று உள்ளது; இது இஸ்ரவேலின் முற்பிதாக்களைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: அவ்வாறு ... கொடுத்தால்
  rationale: முந்தைய சட்ட அறிவுறுத்தலுடன் தொடர்ச்சியைப் பேணுகிறது; எபிரெய நிபந்தனை அமைப்பு தமிழில் இயல்பாக வாக்கியத்தின் இறுதியில் ‘கொடுத்தால்’ என நிறைவுபெறுகிறது.
- source_word: יַרְחִיב ... אֶת גְּבֻלְךָ
  choice: உன் எல்லையை விரிவுபடுத்தி
  rationale: רחב என்பதன் காரணவினை வடிவம் அகலமாக்குதல் அல்லது விரிவுபடுத்துதல் எனப் பொருள்படும்; גְּבוּל இங்கு வெறும் எல்லைக்கோட்டை அல்ல, நாட்டின் பரப்பையும் குறிக்கிறது. ‘எல்லையை விரிவுபடுத்தி’ என்பது தமிழில் இரு நுணுக்கங்களையும் இயல்பாகத் தருகிறது.
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: உன் கடவுளாகிய யாவே
  rationale: தெய்வீகப் பெயரான יהוה-ஐ பட்டப்பெயரால் மாற்றாமல் ‘யாவே’ என ஒலிபெயர்த்து, אֱלֹהֶיךָ-ஐ ‘உன் கடவுள்’ எனத் துல்லியமாக வழங்குகிறது.
- source_word: כַּאֲשֶׁר נִשְׁבַּע
  choice: ஆணையிட்டபடி
  rationale: נשבע என்பது சத்தியம் செய்தல் அல்லது ஆணையிடுதல்; வாக்குறுதியை உறுதிப்படுத்திய செயலை ‘ஆணையிட்டபடி’ சுருக்கமாகவும் கண்ணியமாகவும் வெளிப்படுத்துகிறது.
- source_word: לַאֲבֹתֶיךָ
  choice: உன் தந்தையருக்கு
  rationale: எபிரெயச் சொல்லின் நேரடியான ஆண்பால் குடும்பக் குறிப்பைப் பேணி, இஸ்ரவேலின் முற்பிதாக்களைக் குறிக்கும் உடன்படிக்கைச் சொல்லாட்சியைத் தக்கவைக்கிறது. சூழல்சார் மாற்று ‘முன்னோர்கள்’ அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: וְנָתַן לְךָ
  choice: உனக்குக் கொடுத்தால்
  rationale: எதிர்கால நோக்குடைய நிபந்தனைத் தொடரைத் தமிழின் இயல்பான இறுதி நிபந்தனை வினை வடிவில் வழங்குகிறது.
- source_word: כָּל הָאָרֶץ
  choice: நாடு முழுவதையும்
  rationale: אָרֶץ இங்கு உலகத்தைக் குறிக்காமல் இஸ்ரவேலுக்கு வாக்களிக்கப்பட்ட நாட்டைக் குறிக்கிறது; ‘நாடு முழுவதையும்’ இச்சூழலில் தெளிவாக உள்ளது.
- source_word: אֲשֶׁר דִּבֶּר לָתֵת
  choice: கொடுப்பதாக அவர் சொன்ன
  rationale: דִּבֶּר என்பதன் ‘சொன்னார்’ என்ற அடிப்படைப் பொருளைப் பேணுகிறது; அதேவேளை கொடுப்பதற்கான தெய்வீக உறுதியைச் சூழல் வெளிப்படுத்த அனுமதிக்கிறது; ‘வாக்களித்த’ என்று விளக்கமாகத் தீர்மானிப்பதைத் தவிர்க்கிறது.
theological_decisions:
- issue: יהוה என்ற தெய்வீகப் பெயரை வழங்குதல்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூல உரை தனிப்பட்ட உடன்படிக்கைப் பெயரைப் பயன்படுத்துவதால், அதை ஒரு பட்டப்பெயரால் மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
- issue: אבות என்பதை ‘தந்தையர்’ அல்லது ‘முன்னோர்கள்’ என வழங்குதல்
  choice: தந்தையர்
  alternative: முன்னோர்கள்
  rationale: மூலத்தின் ஆண்பால் குடும்பச் சொல்லையும் முற்பிதாக்களுடனான உடன்படிக்கைத் தொடர்பையும் முதன்மை உரையில் பேணுகிறது; பரந்த வம்சாவளிப் பொருள் அடிக்குறிப்பில் குறிப்பிடப்படுகிறது.
- issue: דִּבֶּר לָתֵת என்பதை வாக்குறுதி மொழியாக விளக்குதல்
  choice: கொடுப்பதாக அவர் சொன்ன
  alternative: கொடுப்பதாக அவர் வாக்களித்த
  rationale: உடன்படிக்கைச் சூழலில் இது வாக்குறுதியின் வலிமையைக் கொண்டிருந்தாலும், மூல வினையின் ‘சொல்/பேசு’ என்ற வடிவத்தைத் தக்கவைத்து அதன் இறையியல் வலிமையை வாசகர் சூழலிலிருந்து உணர அனுமதிக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சட்ட உரையின் நீண்ட நிபந்தனை வாக்கிய அமைப்பைப் பேணிய கண்ணியமான நடை. தனித்த தெய்வீகப் பெயர் ‘யாவே’ என வழங்கப்பட்டுள்ளது. வசனம் அடுத்த வசனத்தில் தொடருவதால் இறுதியில் முற்றுப்புள்ளிக்குப் பதிலாக காற்புள்ளி வைக்கப்பட்டுள்ளது.
