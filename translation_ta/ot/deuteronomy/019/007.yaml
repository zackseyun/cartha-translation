  text: עַל כֵּ֛ן אָנֹכִ֥י מְצַוְּ/ךָ֖ לֵ/אמֹ֑ר שָׁלֹ֥שׁ עָרִ֖ים תַּבְדִּ֥יל לָֽ/ךְ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/019/007.yaml
  text: Therefore I am commanding you[a], saying, ‘You shall set apart three cities for yourself.’
translation:
  language: ta
  text: 'ஆகையால் நான் உனக்குக் கட்டளையிடுகிறேன்: ‘உனக்காக மூன்று நகரங்களைத் தனியே ஒதுக்கி வை.’'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עַל כֵּן
  choice: ஆகையால்
  rationale: முந்தைய சூழலிலிருந்து வரும் முடிவை அல்லது காரணவிளைவைச் சுருக்கமாகவும் இயல்பாகவும் குறிக்கிறது.
- source_word: אָנֹכִי
  choice: நான்
  rationale: தனி எழுவாய்ப் பதிலிப்பெயர் தரும் வலியுறுத்தலைத் தமிழில் வெளிப்படையான ‘நான்’ போதுமான அளவு தாங்குகிறது; ‘நானே’ என்பது இங்கு தேவைக்கு மீறிய வலியுறுத்தலாகலாம்.
- source_word: מְצַוְּךָ
  choice: உனக்குக் கட்டளையிடுவது
  rationale: நிகழ்காலத்தில் வழங்கப்படும் நேரடியான கட்டளையின் தன்மையைத் தமிழில் இயல்பாகக் காட்டுகிறது.
- source_word: לֵאמֹר
  choice: 'இதுதான்:'
  rationale: கட்டளையின் உள்ளடக்கத்தை அறிமுகப்படுத்தும் எபிரெய மேற்கோள் அமைப்பைச் சொற்சொல்லாகக் கடினப்படுத்தாமல், நவீனத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: שָׁלֹשׁ עָרִים
  choice: மூன்று நகரங்களை
  rationale: எண் மற்றும் பெயர்ச்சொல் கொண்ட நேரடியான அமைப்பைத் துல்லியமாக மொழிபெயர்க்கிறது.
- source_word: תַּבְדִּיל
  choice: தனியே ஒதுக்கிவை
  rationale: בדל என்பதன் ஹிஃபில் வடிவிலுள்ள பிரித்தல் அல்லது தனிப்படுத்தல் என்ற அடிப்படை அர்த்தத்தையும், இச்சட்டச் சூழலில் அதிகாரபூர்வமாக நியமித்தல் என்ற கருத்தையும் தாங்குகிறது.
- source_word: לָךְ
  choice: உனக்காக
  rationale: இரண்டாம் நபர் ஆண்பால் ஒருமை பின்னொட்டுடன் வரும் முன்னிடைச்சொல், இஸ்ரவேலின் பயன்பாடு அல்லது நன்மைக்காகச் செய்யப்படுவதைச் சுட்டுகிறது.
theological_decisions:
- issue: உடன்படிக்கைச் சட்டத்தில் இரண்டாம் நபர் ஆண்பால் ஒருமை அழைப்பு
  choice: ‘உனக்கு/உனக்காக’ என்று ஒருமையிலேயே மொழிபெயர்த்தல்
  alternative: கூட்டு மக்களைத் தெளிவுபடுத்த ‘உங்களுக்காக’ என்று பன்மையாக்குதல் அல்லது செயப்பாட்டு வடிவில் கூறுதல்
  rationale: எபிரெய உடன்படிக்கை அறிவுறுத்தல்கள் இஸ்ரவேலை அடிக்கடி ஒருமையில் அழைக்கின்றன. அதைத் தக்கவைப்பது மூலத்தின் சொல்லாட்சியையும் உரையாடல் வலிமையையும் பாதுகாக்கிறது.
translation_notes:
  register: நவீன பொதுத்தரத் தமிழில், சட்ட அறிவுறுத்தலுக்கேற்ற கண்ணியமான மற்றும் நேரடியான நடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய ஒருமை அழைப்பு பாதுகாக்கப்பட்டிருக்கிறது; לֵאמֹר என்பதன் சொற்சொல்லான ‘சொல்லி’ என்பதற்குப் பதிலாக இயல்பான தமிழில் ‘இதுதான்:’ பயன்படுத்தப்பட்டுள்ளது.
