revisions:
- from: 'ஆகையால் நான் உனக்குக் கட்டளையிடுவது இதுதான்: ‘உனக்காக மூன்று நகரங்களைத் தனியே ஒதுக்கிவை[a].’'
  to: 'ஆகையால் நான் உனக்குக் கட்டளையிடுகிறேன்: ‘உனக்காக மூன்று நகரங்களைத் தனியே ஒதுக்கி வை.’'
  rationale: The revision retains every semantic component of the Hebrew and the English audit trail while using a more direct Tamil command formula for the participial command plus quotative infinitive. It also regularizes the spelling of the compound verb. The footnote is retained with minor punctuation and phrasing normalization only.
