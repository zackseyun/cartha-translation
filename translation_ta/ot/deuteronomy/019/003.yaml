  source_fidelity: திருத்தம் தேவை. வரைவில் உள்ள “இப்படிச் செய்ய வேண்டும்” என்பது எபிரெயத்தின் வினைச்சொல் இல்லாத நோக்க/விளைவு அமைப்பைத் தேவையற்ற கட்டளையாக மாற்றுகிறது; மேலும் יהוה-வுக்கு ‘யெகோவா’ என்பதற்குப் பதிலாக மூலப்பெயருக்கு நெருக்கமான ‘யாவே’ பயன்படுத்தப்பட வேண்டும். ரֹצֵחַ என்பது இச்சூழலில் திட்டமிட்ட கொலையை மட்டும் குறிக்காததால், ‘ஒருவரைக் கொன்ற எவரும்’ எனக் குற்றநோக்கை முன்கூட்டியே தீர்மானிக்காத வகையில் வழங்கப்பட்டுள்ளது.
  naturalness: “சாலையைத் தயார்செய்” மற்றும் “மூன்று பகுதிகளாகப் பிரி” நவீனத் தரத் தமிழில் நேரடியான சட்டக் கட்டளை நடையைத் தருகின்றன. இறுதி நோக்கத்தை “...தப்பியோடலாம்” எனத் தெளிவாகவும் இயல்பாகவும் கூறலாம்.
  terminology: ‘யாவே’ தனிப்பெயராகத் தக்கவைக்கப்படுகிறது. ‘உரிமையாகக் கொடுக்கும்’ நחל-ன் மரபுரிமை/உரிமை அளிக்கும் பொருளைச் சுருக்கமாகக் காக்கிறது. ‘ஒருவரைக் கொன்ற எவரும்’ என்பது ‘கொலைகாரன்’ என்ற குறுகிய குற்றத் தீர்ப்பைத் தவிர்க்கிறது.
