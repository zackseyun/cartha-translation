revisions:
- from: நீ உனக்காகச் சாலையை ஆயத்தப்படுத்தி, உன் கடவுளாகிய யெகோவா உனக்கு உரிமைச்சொத்தாகக் கொடுக்கும் உன் நாட்டின் நிலப்பரப்பை மூன்று பகுதிகளாகப் பிரிக்க வேண்டும். கொலை செய்த எவனும் அங்கே தப்பியோடுவதற்காக இப்படிச் செய்ய வேண்டும்.[a]
  to: நீ உனக்காகச் சாலையைத் தயார்செய்; உன் கடவுளாகிய யாவே உனக்கு உரிமையாகக் கொடுக்கும் உன் நாட்டின் நிலப்பரப்பை மூன்று பகுதிகளாகப் பிரி. அப்பொழுது, ஒருவரைக் கொன்ற எவரும் அங்கே தப்பியோடலாம்.[a]
  rationale: இரண்டு கட்டளைகளையும் இணைநிலையில் தெளிவுபடுத்தி, இறுதிச் சொற்றொடரின் நோக்கத்தை கூடுதல் கட்டளையின்றி வழங்கியுள்ளோம். இறைப்பெயர் தனிப்பெயராக ‘யாவே’ எனவும், ரֹצֵחַ குறிக்கும் பரந்த சட்டவகை குற்றநோக்கைத் தீர்மானிக்காத வகையிலும் திருத்தப்பட்டுள்ளது. அடிக்குறிப்பு குறியீடு இறுதி எபிரெயச் சொற்றொடருடன் இணைக்கப்பட்டுள்ளது.
