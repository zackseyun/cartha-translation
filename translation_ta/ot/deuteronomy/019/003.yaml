  text: תָּכִ֣ין לְ/ךָ֮ הַ/דֶּרֶךְ֒ וְ/שִׁלַּשְׁתָּ֙ אֶת גְּב֣וּל אַרְצְ/ךָ֔ אֲשֶׁ֥ר יַנְחִֽילְ/ךָ֖ יְהוָ֣ה אֱלֹהֶ֑י/ךָ וְ/הָיָ֕ה לָ/נ֥וּס שָׁ֖מָּ/ה כָּל רֹצֵֽחַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/019/003.yaml
  text: You shall prepare the road for yourself[a], and you shall divide into three parts the territory of your land that Yahweh your God is giving you as an inheritance[b], so that every manslayer may flee there.
translation:
  language: ta
  text: நீ உனக்காகச் சாலையைத் தயார்செய்; உன் கடவுளாகிய யாவே உனக்கு உரிமையாகக் கொடுக்கும் உன் நாட்டின் நிலப்பரப்பை மூன்று பகுதிகளாகப் பிரி. அப்பொழுது, ஒருவரைக் கொன்ற எவரும் அங்கே தப்பியோடலாம்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொற்பட, “அங்கே தப்பியோடுவதற்காக ஒவ்வொரு கொலைசெய்தவரும் [இருப்பான்].”
    reason: வசனத்தின் இறுதியில் உள்ள சுருக்கமான எபிரெய நோக்க/விளைவு அமைப்பைச் சுட்டிக்காட்டுகிறது. ‘கொலைசெய்தவர்’ இங்கே சொற்படியான குறிப்பு மட்டுமே; முதன்மை உரை உடனடிச் சட்டச் சூழலுக்கேற்ற நடுநிலைச் சொல்லை பயன்படுத்துகிறது.
lexical_decisions:
- source_word: תָּכִין לְךָ הַדֶּרֶךְ
  choice: நீ உனக்காகச் சாலையை ஆயத்தப்படுத்தி
  rationale: כון என்பதன் ஹிஃபில் வடிவம் இங்கு ஒரு பயணப் பாதையைப் பயன்பாட்டுக்கு ஏற்றவாறு ஆயத்தப்படுத்துவதைக் குறிக்கிறது; לְךָ என்பதையும் ‘உனக்காக’ என்று வெளிப்படையாகத் தக்கவைத்துள்ளது.
- source_word: וְשִׁלַּשְׁתָּ
  choice: மூன்று பகுதிகளாகப் பிரிக்க வேண்டும்
  rationale: שלש என்பதன் பியேல் வடிவம் மூன்றாகப் பிரித்தல் அல்லது முப்பகுதியாக அமைத்தல் என்ற பொருளுடையது; தமிழில் பொருள் தெளிவாக வெளிப்பட இவ்வாறு மொழிபெயர்க்கப்பட்டது.
- source_word: גְּבוּל אַרְצְךָ
  choice: உன் நாட்டின் நிலப்பரப்பு
  rationale: גְּבוּל என்பது எல்லையைக் குறிக்கக்கூடியதாயினும், இங்கு அடைக்கல நகரங்களை அணுகும் வகையில் பிரிக்கப்பட வேண்டிய நாட்டின் முழுப் பரப்பைக் குறிக்கிறது.
- source_word: יַנְחִילְךָ
  choice: உனக்கு உரிமைச்சொத்தாகக் கொடுக்கும்
  rationale: נחל என்பதன் ஹிஃபில் வடிவம் ஒருவருக்கு உரிமைச்சொத்தாக அளித்தல் அல்லது சுதந்தரிக்கச் செய்தல் என்பதைக் குறிக்கிறது; கொடை மற்றும் உரிமை ஆகிய இரு கூறுகளும் தக்கவைக்கப்பட்டுள்ளன.
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: உன் கடவுளாகிய யெகோவா
  rationale: יהוה என்ற தனிப்பெயர் தமிழில் பரவலாக அறியப்படும் ‘யெகோவா’ என்ற ஒலிபெயர்ப்பில் வழங்கப்பட்டுள்ளது; אֱלֹהֶיךָ ‘உன் கடவுள்’ என்று தக்கவைக்கப்பட்டுள்ளது.
- source_word: וְהָיָה לָנוּס שָׁמָּה
  choice: அங்கே தப்பியோடுவதற்காக இப்படிச் செய்ய வேண்டும்
  rationale: எபிரெயச் சொற்றொடர் சொற்பட ‘அங்கே தப்பியோடுவதற்காக அது இருக்கட்டும்’ எனச் சுருக்கமாக உள்ளது. முன் கட்டளைகளுடன் அதன் நோக்கத் தொடர்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: כָּל רֹצֵחַ
  choice: கொலை செய்த எவனும்
  rationale: רֹצֵחַ இச்சூழலில் திட்டமிட்ட கொலைகாரனை மட்டும் குறிக்காமல், ஒருவரைக் கொன்றவரையும் உள்ளடக்குகிறது. ‘கொலை செய்த எவனும்’ என்பது குற்றநோக்கம் இருந்ததா என்பதை முன்கூட்டியே தீர்மானிக்காது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யெகோவா
  alternative: யாவே; கர்த்தர்
  rationale: மூலத்தில் வரும் உடன்படிக்கைப் பெயரை பொதுப்பட்டமாக மாற்றாமல் தனிப்பெயராகத் தக்கவைக்கிறது. எபிரெய உயிரொலிப்பு உறுதியற்றதால் ‘யாவே’ என்பதும் சாத்தியம்.
- issue: רֹצֵחַ என்பது திட்டமிட்ட கொலையை மட்டுமே குறிக்கிறதா
  choice: கொலை செய்த எவனும்
  alternative: கொலைகாரன்
  rationale: அடைக்கல நகரங்கள் பற்றிய உடனடிச் சூழல், முன்பகையோ திட்டமோ இல்லாமல் உயிரிழப்பை ஏற்படுத்தியவரையும் உள்ளடக்குகிறது. ஆகவே குற்றவாளித்தன்மையை இவ்வசனத்திலேயே தீர்மானிக்காத விரிவான சொற்றொடர் தேர்ந்தெடுக்கப்பட்டது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சட்டக் கட்டளைக்கேற்ற கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. ஒருமை இரண்டாம் நபரான ‘நீ’ தக்கவைக்கப்பட்டுள்ளது. ‘கொலைகாரன்’ என்ற குறுகிய குற்றத் தீர்ப்பைத் தவிர்த்து, சூழலுக்கேற்ற ‘கொலை செய்த எவனும்’ பயன்படுத்தப்பட்டுள்ளது.
