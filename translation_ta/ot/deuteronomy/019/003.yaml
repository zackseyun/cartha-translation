    rationale: וְהָיָה לָנוּס שָׁמָּה כָּל רֹצֵחַ என்பது சுருக்கமான ‘அங்கே தப்பியோடுவதற்கு ...’ என்ற நோக்க/விளைவு அமைப்பு; கூடுதல் கட்டளையை மூலத்தில் இருந்து பெற முடியாது.
  - severity: medium
