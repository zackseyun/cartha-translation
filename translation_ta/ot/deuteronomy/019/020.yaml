source:
  edition: WLC
  text: וְ/הַ/נִּשְׁאָרִ֖ים יִשְׁמְע֣וּ וְ/יִרָ֑אוּ וְ/לֹֽא יֹסִ֨פוּ לַ/עֲשׂ֜וֹת ע֗וֹד כַּ/דָּבָ֥ר הָ/רָ֛ע הַ/זֶּ֖ה בְּ/קִרְבֶּֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/019/020.yaml
  text: And those who remain shall hear and fear[c][b][a], and shall never again do such an evil thing in your midst.
translation:
  language: ta
  text: எஞ்சியிருப்பவர்கள் கேட்டு அஞ்சுவார்கள்; உன் நடுவில்[a] இப்படிப்பட்ட தீய செயலை[b] அவர்கள் இனி ஒருபோதும் செய்யமாட்டார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் ‘உன்’ என்பது ஒருமை; இஸ்ரவேல் மக்கள் அனைவரும் ஒரே சமூக முழுமையாக அழைக்கப்படுகிறார்கள்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில், ‘இந்தத் தீய காரியத்தைப் போல’; அதாவது, இந்த வகையான தீய செயல்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנִּשְׁאָרִים
  choice: மீதியிருப்பவர்கள்
  rationale: நிஃபால் வினையெச்ச வடிவம் தண்டனைக்குப் பின் எஞ்சியிருக்கும் மக்களைக் குறிக்கிறது; இத்தமிழ்ச் சொல் இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: יִשְׁמְעוּ
  choice: அதைக் கேட்டு
  rationale: அடிப்படைப் பொருள் ‘கேட்பார்கள்’; சூழலில் நடந்ததைக் கேள்விப்படுவதைக் குறிக்கிறது. தமிழ் வாக்கிய ஓட்டத்திற்காக ‘அதைக்’ வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: וְיִרָאוּ
  choice: அஞ்சுவார்கள்
  rationale: நீதித் தண்டனையால் உண்டாகும் தடுப்பு அச்சத்தைச் சுருக்கமாகவும் கண்ணியமான நடையிலும் தெரிவிக்கிறது.
- source_word: וְלֹא יֹסִפוּ לַעֲשׂוֹת עוֹד
  choice: இனி ஒருபோதும் செய்யமாட்டார்கள்
  rationale: יסף உடன் வரும் வினையெச்சம் மீண்டும் செய்யாதிருப்பதைக் குறிக்கிறது; ‘இனி ஒருபோதும்’ அதன் வலுவான எதிர்கால மறுப்பை இயல்பான தமிழில் தருகிறது.
- source_word: כַּדָּבָר הָרָע הַזֶּה
  choice: இப்படிப்பட்ட தீய செயலை
  rationale: כ முன்னொட்டின் ஒப்புமைப் பொருளையும், இங்கு דָּבָר குறிப்பது முன் விவரிக்கப்பட்ட வகையான தீய செயலையே என்பதையும் தெளிவாகப் பாதுகாக்கிறது.
- source_word: בְּקִרְבֶּךָ
  choice: உன் நடுவில்
  rationale: இரண்டாம் ஆண்பால் ஒருமை பின்னொட்டைத் தக்கவைத்து, இஸ்ரவேலை ஒருமையான சமூக முழுமையாக நோக்கும் உடன்படிக்கைச் சட்ட நடையைப் பாதுகாக்கிறது.
theological_decisions:
- issue: בְּקִרְבֶּךָ என்பதில் எண்ணும் அழைக்கப்படுபவரும்
  choice: ‘உன் நடுவில்’ என்ற ஒருமையைத் தக்கவைத்தல்
  alternative: ‘உங்களிடையே’ என்று பன்மையில் இயல்பாக்குதல்
  rationale: எபிரெய உரை இஸ்ரவேல் மக்களை ஒரே சமூக முழுமையாகக் கொண்டு இரண்டாம் ஆண்பால் ஒருமையில் அழைக்கிறது; அதனை விளக்கவுரை சேர்க்காமல் முதன்மை உரையில் பாதுகாக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன பொதுத்தமிழில், சட்ட மற்றும் உடன்படிக்கைச் சூழலுக்கேற்ற கண்ணியமான நடையுடன் மொழிபெயர்க்கப்பட்டது. எபிரெயத்தின் சமூக ஒருமை ‘உன்’ என்பதில் தக்கவைக்கப்பட்டுள்ளது; வாக்கிய அமைப்பு இயல்பான தமிழுக்காக காரண-விளைவு ஓட்டத்தில் அமைக்கப்பட்டுள்ளது.
