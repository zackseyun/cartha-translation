  text: And the judges shall investigate thoroughly, and if the witness is a false witness and has testified falsely against his brother,
translation:
  language: ta
  text: நியாயாதிபதிகள் நன்றாக விசாரிக்க வேண்டும். அந்தச் சாட்சியாளர் பொய்ச் சாட்சியாளர் என்றும், தன் சகோதரனுக்கு எதிராகப் பொய்யாகச் சாட்சி சொன்னான் என்றும் தெரியவந்தால்,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְדָרְשׁוּ ... הֵיטֵב
  choice: நன்றாக விசாரிக்க வேண்டும்
  rationale: דָּרַשׁ என்பது இங்கு நீதித்துறை சார்ந்த கவனமான விசாரணையைக் குறிக்கிறது; הֵיטֵב அதன் முழுமையையும் தீவிரத்தையும் வலியுறுத்துகிறது.
- source_word: וְהִנֵּה
  choice: தெரியவந்தால்
  rationale: சொல்லுக்கு சொல் ‘இதோ’ என்றாலும், விசாரணையின் முடிவில் உண்மை கண்டறியப்படும் நிபந்தனைச் சூழலை நவீன தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: עֵד שֶׁקֶר
  choice: பொய்ச்சாட்சி
  rationale: பொய்யான சாட்சியைக் கொடுக்கும் நபரைக் குறிக்கும் நிலையான, சுருக்கமான நீதித்துறைச் சொல்.
- source_word: שֶׁקֶר עָנָה
  choice: பொய்யாகச் சாட்சி சொன்னான்
  rationale: עָנָה இங்கு நீதிமன்றத்தில் சாட்சியளிப்பதைக் குறிக்கிறது; தமிழில் பொருளைத் தெளிவாக வழங்குகிறது.
- source_word: בְאָחִיו
  choice: தன் சகோதரனுக்கு எதிராக
  rationale: ‘சகோதரன்’ என்ற உறவுமுறை உருவகத்தைப் பாதுகாக்கிறது; இச்சட்டச் சூழலில் உடன்படிக்கைச் சமூகத்தின் சக உறுப்பினரை உள்ளடக்கலாம்.
theological_decisions:
- issue: וְהִנֵּה என்பதன் உரைநடைப் பங்கு
  choice: ‘தெரியவந்தால்’ என்று நிபந்தனை-விளைவு உறவாக மொழிபெயர்த்தல்
  alternative: ‘இதோ’ என்று நேரடியாக மொழிபெயர்த்தல்
  rationale: எபிரேயச் சொல் கண்டறியப்பட்ட நிலையை உயிர்ப்புடன் அறிமுகப்படுத்துகிறது; தமிழில் ‘தெரியவந்தால்’ என்பது அடுத்த வசனத்துக்குச் செல்லும் சட்ட நிபந்தனையைத் தெளிவாகவும் இயல்பாகவும் வைத்திருக்கிறது, எந்தக் கோட்பாட்டு முடிவையும் சேர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழ்; நீதித்துறைச் சூழலுக்கேற்ற கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் நடை. வசனம் அடுத்த வசனத்தில் நிறைவுபெறும் நிபந்தனை வாக்கியம் என்பதால் இறுதியில் காற்புள்ளி வைக்கப்பட்டுள்ளது.
