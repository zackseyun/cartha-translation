base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/019/015.yaml
  text: A single witness shall not stand against a man for any iniquity or for any sin[a], in connection with any sin that he commits[c][b]; on the testimony of two witnesses or on the testimony of three witnesses a matter shall stand.
translation:
  language: ta
  text: ஒருவனுக்கு எதிராக, எந்த அக்கிரமத்திற்காகவும் எந்தப் பாவத்திற்காகவும்—அவன் செய்யும் எந்தப் பாவத்தைக் குறித்தும்—ஒரே சாட்சி நிலைநிற்கக் கூடாது.[a] இரண்டு சாட்சிகளின் வாக்கினாலோ மூன்று சாட்சிகளின் வாக்கினாலோ ஒரு காரியம் நிலைநிற்கும்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘நிலைநிற்கக் கூடாது’ என்பது இங்கு ஒரே சாட்சியின் சான்று சட்டப்படி செல்லுபடியாகவோ ஒரு குற்றச்சாட்டை உறுதிப்படுத்தப் போதுமானதாகவோ இருக்கக் கூடாது என்பதைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: சொற்சொல்லாக, ‘இரண்டு சாட்சிகளின் வாயின்படியோ மூன்று சாட்சிகளின் வாயின்படியோ ஒரு காரியம் நிலைநிற்கும்.’ ‘ஒரு காரியம்’ என்பதற்கு ‘ஒரு வழக்கு’ அல்லது ‘ஒரு விவகாரம்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָקוּם ... יָקוּם
  choice: நிலைநிற்கக் கூடாது ... நிலைபெறும்
  rationale: קום என்ற வினைச்சொல்லின் ‘நிற்றல்/நிலைபெறுதல்’ என்ற உருவகத்தையும், சட்டச் சூழலில் ‘செல்லுபடியாக இருத்தல்/உறுதிப்படுதல்’ என்ற பொருளையும் முடிந்தவரை பேணுகிறது. இரு அரையடிகளிலும் வரும் எபிரெயச் சொல்லின் மீளுருவாக்கமும் தமிழில் தொடர்புடைய சொற்களால் வெளிப்படுகிறது.
- source_word: עֵד אֶחָד
  choice: ஒரே ஒரு சாட்சி
  rationale: தனியொரு சாட்சியின் சான்று போதாது என்பதை இயல்பான தமிழில் வலியுறுத்துகிறது.
- source_word: בְּאִישׁ
  choice: ஒருவனுக்கு எதிராக
  rationale: சட்டச் சூழலில் בְ என்பது ஒருவருக்கு எதிராகச் சாட்சி கூறப்படுவதைக் குறிக்கிறது. אִישׁ ஆண்பால் ஒருமை வடிவில் பிரதிநிதித்துவமாக இருப்பதால் அதைத் தமிழிலும் பேணுகிறது.
- source_word: לְכָל עָוֺן
  choice: எந்த அக்கிரமத்திற்காகவும்
  rationale: עָוֺן என்பதிலுள்ள ஒழுக்க மற்றும் சட்டக் கனத்தை ‘அக்கிரமம்’ வெளிப்படுத்துகிறது; அதைத் தொடர்ந்து வரும் பாவச் சொற்களிலிருந்து வேறுபடுத்தவும் உதவுகிறது.
- source_word: וּלְכָל חַטָּאת
  choice: எந்தப் பாவத்திற்காகவும்
  rationale: חַטָּאת இங்கு பரந்த பொருளில் பாவத்தைக் குறிக்கிறது; எபிரெய உரையின் திரட்டுச் சொல்லமைப்பைச் சுருக்காமல் பேணுகிறது.
- source_word: בְּכָל חֵטְא אֲשֶׁר יֶחֱטָא
  choice: ஒருவன் செய்யும் எந்தப் பாவத்தைக் குறித்தும்
  rationale: ‘அவன் பாவம் செய்யும் எந்தப் பாவத்திலும்’ என்ற சொற்சொல் மொழிபெயர்ப்பு தமிழில் இயல்பற்றது. இத்தேர்வு மூலத்தின் விரிவான சட்டப் பரப்பையும் பாவம் என்ற சொல்லின் மீளுருவாக்கத்தையும் பேணுகிறது.
- source_word: עַל פִּי
  choice: வாக்கினால்
  rationale: சொற்சொல்லாக ‘வாயின்படி’ என்றாலும், இது சாட்சிகளின் வாய்மொழிச் சான்றை அடிப்படையாகக் கொள்வதைக் குறிக்கும் சட்ட மரபுத்தொடர். ‘வாக்கினால்’ என்பது தெளிவான, சுருக்கமான தமிழ்.
- source_word: דָּבָר
  choice: ஒரு காரியம்
  rationale: நீதித்துறைச் சூழலில் דָּבָר விசாரணைக்குரிய காரியம், விவகாரம் அல்லது வழக்கைக் குறிக்கலாம். ‘காரியம்’ மூலத்தின் பரந்த பொருளைத் திறந்தவாறு வைக்கிறது.
theological_decisions:
- issue: אִישׁ என்பதிலுள்ள பிரதிநிதித்துவ ஆண்பால் மொழி
  choice: ஒருவனுக்கு எதிராக
  alternative: ஒருவருக்கு எதிராக
  rationale: மூல எபிரெயம் ஆண்பால் ஒருமையைப் பயன்படுத்துகிறது; சட்டக் கோட்பாடு பொதுவான பயன்பாட்டைக் கொண்டிருந்தாலும், அந்த இலக்கண வடிவத்தை முதன்மை உரையில் அழிக்காமல் பேணுகிறது.
- issue: சாட்சியின் செல்லுபடித்தன்மையா அல்லது வழக்கின் உறுதிப்பாடா
  choice: முதல் பகுதியில் சாட்சி ‘நிலைநிற்கக் கூடாது’; இறுதியில் காரியம் ‘நிலைபெறும்’
  alternative: ஒரே சாட்சியின் சான்று போதாது; வழக்கு உறுதிப்படுத்தப்படும்
  rationale: ஒரே קום வினை இரு இடங்களிலும் வருவதால் உருவாகும் சட்ட இணைப்பைத் தக்கவைக்கிறது; அதே நேரத்தில் தமிழில் புரியத்தக்க வேறுபட்ட வடிவங்களைப் பயன்படுத்துகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான சட்ட நடையைப் பயன்படுத்துகிறது. மூலத்தின் மூன்று பாவ/குற்றச் சொற்களின் திரட்டையும் קום என்ற வினையின் இருமுறைப் பயன்பாட்டையும் சாத்தியமான அளவு பேணுகிறது; தேவையற்ற சமயப்பிரிவு சார்ந்த சொற்கள் தவிர்க்கப்பட்டுள்ளன.
