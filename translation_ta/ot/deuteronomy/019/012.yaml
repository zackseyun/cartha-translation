base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/019/012.yaml
  text: then the elders of his city shall send and take him from there and hand him over to the avenger of blood[a], and he shall die.
translation:
  language: ta
  text: அப்போது அவனுடைய நகரத்தின் மூப்பர்கள் அனுப்பி, அங்கிருந்து அவனை அழைத்துக்கொண்டு வந்து, இரத்தப் பழிவாங்குபவனிடம்[a] அவனை ஒப்படைக்க வேண்டும்; அவன் இறக்க வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இரத்தத்தின் பழிவாங்குபவனிடம்.” גֹּאֵל הַדָּם (கோஏல் ஹத்தாம்) என்ற எபிரேயச் சொற்றொடர், சிந்தப்பட்ட இரத்தத்துக்குப் பழிவாங்கும் பொறுப்புடைய நபரைக் குறிக்கும் தொழில்நுட்பச் சட்டப் பதமாகும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁלְחוּ
  choice: ஆட்களை அனுப்பி
  rationale: சட்ட விதிமுறையின் கட்டளைத் தன்மையை இறுதியிலுள்ள ‘வேண்டும்’ இயல்பாகத் தாங்குகிறது; எபிரேய வினை இங்கு மூப்பர்கள் தாமே செல்வதைவிட ஆட்களை அனுப்புவதைக் குறிக்கிறது.
- source_word: זִקְנֵי עִירוֹ
  choice: அவனுடைய நகரத்தின் மூப்பர்கள்
  rationale: זִקְנֵי என்பது அங்கீகரிக்கப்பட்ட சமூகத் தலைவர்களைக் குறிக்கிறது; עִיר என்பதற்கு சட்ட-நிர்வாகச் சூழலில் ‘நகரம்’ என்பது நேரடியான, வழக்கமான இணை.
- source_word: וְלָקְחוּ אֹתוֹ מִשָּׁם
  choice: அங்கிருந்து அவனை அழைத்துவரச் செய்து
  rationale: לקח என்பதன் அடிப்படைப் பொருள் ‘எடுத்தல்/கொண்டுவருதல்.’ அடைக்கல நகரத்திலிருந்து அவனை அகற்றிக் கொண்டுவரும் செயலைத் தெளிவாகச் சொல்கிறது; மூலத்தில் வெளிப்படையாக இல்லாத வன்முறையைச் சேர்க்கவில்லை.
- source_word: וְנָתְנוּ אֹתוֹ בְּיַד
  choice: அவனை ஒப்படைக்க வேண்டும்
  rationale: נתן ביד என்ற மரபுத்தொடர் ஒருவரை மற்றொருவரின் அதிகாரத்தில் ஒப்படைப்பதைக் குறிக்கிறது. ‘ஒப்படைக்க’ என்பது நவீன சட்டநடையில் இயல்பான இணை.
- source_word: גֹּאֵל הַדָּם
  choice: இரத்தப்பழி வாங்குகிறவன்
  rationale: கொல்லப்பட்டவருக்காக இரத்தப்பழி வாங்கும் பொறுப்புள்ள நபரைக் குறிக்கும் தொழில்நுட்பச் சட்டச் சொற்றொடர். ‘இரத்தப்பழி வாங்குகிறவன்’ என்பது உறவுமுறையை மூலத்தைவிட அதிகமாக வரையறுக்காமல் அதன் செயல்பாட்டைத் தெளிவாகக் காட்டுகிறது.
- source_word: וָמֵת
  choice: அவன் சாக வேண்டும்
  rationale: ஒப்படைப்புக்குப் பின்வரும் சட்ட முடிவை எபிரேயம் சுருக்கமாகக் கூறுகிறது. ‘சாக வேண்டும்’ அதன் கட்டாயமான விளைவை இயல்பான தமிழில் பாதுகாக்கிறது.
