  register: நவீன தரநிலைத் தமிழில், சட்ட விதிமுறைக்கேற்ற கண்ணியமான நடையைப் பயன்படுத்துகிறது. தொடர் எபிரேய வினைகளின் கட்டளைத் தன்மை தமிழில் இறுதியிலுள்ள ‘வேண்டும்’ மூலம் தெளிவாக்கப்பட்டுள்ளது; மூலத்தின் சுருக்கமும் கடுமையான சட்டத் தொனியும் பாதுகாக்கப்பட்டுள்ளன.
