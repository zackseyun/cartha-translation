- from: உன் இறைவனாகிய யாவே உனக்குச் சொந்தமாக்கிக்கொள்ளக் கொடுக்கிற நாட்டில், நீ உரிமைச் சொத்தாகப் பெறவிருக்கும் பகுதியில், முந்தின தலைமுறையினர் நாட்டிய உன் அயலானின் எல்லைக் கல்லை[a] நகர்த்தாதே.
  to: உன் இறைவனாகிய யாவே உனக்குச் சொந்தமாக்கிக் கொள்ளக் கொடுக்கிற நாட்டில், நீ உரிமையாகப் பெறவிருக்கும் உன் பங்கில், முந்தினோர் நிறுவிய உன் அயலானின் எல்லைக் கல்லை[a] நகர்த்தாதே.
