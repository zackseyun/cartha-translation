    text: அல்லது, ‘எல்லைக் குறியீட்டை.’ எபிரேயச் சொல், ஒரு குறியீட்டால் நிர்ணயிக்கப்பட்ட நில எல்லையைக் குறிக்கிறது.
    reason: lexical_alternative
