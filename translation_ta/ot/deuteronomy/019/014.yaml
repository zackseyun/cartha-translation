  text: לֹ֤א תַסִּיג֙ גְּב֣וּל רֵֽעֲ/ךָ֔ אֲשֶׁ֥ר גָּבְל֖וּ רִאשֹׁנִ֑ים בְּ/נַחֲלָֽתְ/ךָ֙ אֲשֶׁ֣ר תִּנְחַ֔ל בָּ/אָ֕רֶץ אֲשֶׁר֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ נֹתֵ֥ן לְ/ךָ֖ לְ/רִשְׁתָּֽ/הּ׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/019/014.yaml
  text: You shall not move your neighbor’s boundary marker[a], which the former generations set, in your inheritance that you will inherit in the land that Yahweh your God is giving you to possess.
translation:
  language: ta
  text: உன் இறைவனாகிய யாவே உனக்குச் சொந்தமாக்கிக் கொள்ளக் கொடுக்கிற நாட்டில், நீ உரிமையாகப் பெறவிருக்கும் உன் பங்கில், முந்தினோர் நிறுவிய உன் அயலானின் எல்லைக் கல்லை[a] நகர்த்தாதே.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘எல்லைக் குறியீட்டை.’ எபிரேயச் சொல், ஒரு குறியீட்டால் நிர்ணயிக்கப்பட்ட நில எல்லையைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַסִּיג
  choice: நகர்த்தாதே
  rationale: ஹிஃபில் வடிவம் எல்லையைப் பின்னுக்குத் தள்ளி அடுத்தவரின் நிலத்தை அபகரிப்பதைக் குறிக்கிறது. திசையை மிகையாக விளக்காமல், சட்டத் தடையை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: גְּבוּל
  choice: எல்லைக் கல்
  rationale: இச்சொல் அடிப்படையில் எல்லையைக் குறித்தாலும், நகர்த்தக்கூடிய பொருளாக இங்கு வருவதால் நில எல்லையைக் குறிக்கும் கல்லைச் சுட்டுகிறது. ‘எல்லைக் கல்’ நவீனத் தமிழில் தெளிவாக உள்ளது.
- source_word: רֵעֲךָ
  choice: உன் அயலானின்
  rationale: சமூக மற்றும் சட்டச் சூழலில் சக சமூக உறுப்பினரை, குறிப்பாக அருகிலுள்ள நில உரிமையாளரை, இயல்பாகக் குறிக்கிறது.
- source_word: גָּבְלוּ
  choice: நாட்டிய
  rationale: எல்லைக் கல்லை நிறுவி எல்லையை நிர்ணயித்த செயலைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: רִאשֹׁנִים
  choice: முந்தின தலைமுறையினர்
  rationale: முன்னிருந்தவர்கள் அல்லது முன்னோர்கள் என்ற பொருளை, பழைய நிலப் பங்கீட்டை நிறுவிய தலைமுறைகளைக் குறிக்கும் வகையில் தெளிவுபடுத்துகிறது.
- source_word: בְּנַחֲלָתְךָ
  choice: நீ உரிமைச் சொத்தாகப் பெறவிருக்கும் பகுதியில்
  rationale: נַחֲלָה என்பதன் பரம்பரை உரிமை மற்றும் ஒதுக்கப்பட்ட நிலப்பங்கு ஆகிய இரு சட்ட-உடன்படிக்கை நுணுக்கங்களையும் இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: תִּנְחַל
  choice: பெறவிருக்கும்
  rationale: இஸ்ரவேல் எதிர்காலத்தில் பெறும் நில உரிமையைத் தெரிவிக்கிறது; அதேவேளை தமிழில் தேவையற்ற சொல்லடுக்கு மீளுரையைத் தவிர்க்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், எபிரேய நான்கெழுத்துப் பெயரின் வழக்கமான தமிழ் ஒலிபெயர்ப்பாகத் தருகிறது.
- source_word: נֹתֵן לְךָ
  choice: உனக்குக் கொடுக்கிற
  rationale: நிகழ்காலப் பங்கேற்பு வடிவத்தின் தொடர்ச்சியான அல்லது பண்புரீதியான கொடுத்தலை இயல்பாகப் பிரதிபலிக்கிறது.
- source_word: לְרִשְׁתָּהּ
  choice: சொந்தமாக்கிக்கொள்ள
  rationale: நாட்டைக் கைப்பற்றி உரிமையுடன் வைத்திருக்கும் ירשׁ என்பதன் பொருளை இச்சூழலில் தெளிவாகக் காட்டுகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் தனிப்பட்ட உடன்படிக்கைப் பெயர் நேரடியாக வருகிறது. எனவே அதை ஒரு பட்டத்தால் மாற்றாமல் ஒலிபெயர்த்து, ‘உன் இறைவனாகிய’ என்பதன் மூலம் אֱלֹהֶיךָ என்பதையும் தனியே தக்கவைத்துள்ளது.
translation_notes:
  register: நவீன, பொதுவாகப் புரியும், கண்ணியமான ஒருமை முன்னிலை நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. சட்டக் கட்டளையின் நேரடித்தன்மை காக்கப்பட்டுள்ளது; ‘உரிமைச் சொத்து’ என்பது நַחֲלָהவின் நிலப்பங்கு மற்றும் பரம்பரை உரிமை நுணுக்கத்தை வெளிப்படுத்துகிறது.
