  text: וְ/לֹ֥א תָח֖וֹס עֵינֶ֑/ךָ נֶ֣פֶשׁ בְּ/נֶ֗פֶשׁ עַ֤יִן בְּ/עַ֨יִן֙ שֵׁ֣ן בְּ/שֵׁ֔ן יָ֥ד בְּ/יָ֖ד רֶ֥גֶל בְּ/רָֽגֶל׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/019/021.yaml
  text: 'Your eye shall not pity: life for life[a], eye for eye, tooth for tooth, hand for hand[b], foot for foot.'
translation:
  language: ta
  text: 'உன் கண் இரக்கம் காட்டக்கூடாது[a]: உயிருக்கு உயிர்[b], கண்ணுக்குக் கண், பல்லுக்குப் பல், கைக்குக் கை, காலுக்குக் கால்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “விட்டுவிடக்கூடாது”; அல்லது, “பரிவு காட்டக்கூடாது.”
    reason: lexical_alternative
  - marker: b
    text: இங்குள்ள எபிரெயச் சொல் உயிரைக் குறிக்கிறது; பிற்கால இறையியல் பயன்பாட்டிலுள்ள “ஆத்துமா”வைத் தனிப்படக் குறிக்கவில்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: תָחוֹס
  choice: இரக்கம் காட்டக்கூடாது
  rationale: חוס என்பது இரக்கம் காட்டுதல், பரிதாபப்படுதல் அல்லது தண்டனையிலிருந்து விட்டுவிடுதல் என்ற பொருள்களைக் கொண்டது. நீதித்துறைச் சூழலில் கட்டளையின் கடுமையையும் எபிரெய மொழிநடையையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: עֵינֶךָ
  choice: உன் கண்
  rationale: எபிரெயம் ‘உன் கண்’ என்பதையே எழுவாயாகக் கொண்டுள்ளது. அதைத் தக்கவைப்பது இரக்கம் குறித்த மூலமொழியின் உருவகத்தைப் பாதுகாக்கிறது.
- source_word: נֶפֶשׁ
  choice: உயிர்
  rationale: נֶפֶשׁ בְּנֶפֶשׁ என்ற சட்ட வாய்பாட்டில் இது உயிரையே குறிக்கிறது; பிற்கால மெய்யியல் பொருளிலான ‘ஆத்துமா’வைத் தனிப்படக் குறிக்கவில்லை.
- source_word: בְּ
  choice: -க்கு
  rationale: ஒவ்வொரு இணைப்பிலும் בְּ ஈடு அல்லது சமமான பதிலீட்டைக் குறிக்கிறது. தமிழில் ‘உயிருக்கு உயிர், கண்ணுக்குக் கண்’ என்ற அமைப்பு அதைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: עַיִן
  choice: கண்
  rationale: சட்டரீதியான ஈட்டுச் சூத்திரத்தில் வரும் நேரடியான உடல் உறுப்புப் பெயர்.
- source_word: שֵׁן
  choice: பல்
  rationale: மூலமொழியின் நேரடியான உடல் உறுப்புப் பெயரைத் துல்லியமாகத் தருகிறது.
- source_word: יָד
  choice: கை
  rationale: மூலமொழியின் நேரடியான உடல் உறுப்புப் பெயரையும் சட்ட வாய்பாட்டின் இணை அமைப்பையும் பாதுகாக்கிறது.
- source_word: רֶגֶל
  choice: கால்
  rationale: רֶגֶל என்பதற்கான இயல்பான தமிழ் இணை; இங்கு உடல் காயங்களின் வரிசைக்குப் பொருந்துகிறது.
theological_decisions:
- issue: குறிப்பிட்ட ஈட்டுச் சட்ட வாய்பாட்டை அப்படியே தக்கவைக்க வேண்டுமா, அல்லது விகிதாசார நீதியின் பொதுக் கொள்கையாக மென்மையாக்க வேண்டுமா?
  choice: ‘உயிருக்கு உயிர், கண்ணுக்குக் கண், பல்லுக்குப் பல், கைக்குக் கை, காலுக்குக் கால்’ என்ற குறிப்பிட்ட வாய்பாட்டைத் தக்கவைத்தல்.
  alternative: ‘குற்றத்திற்கேற்ற தண்டனை வழங்க வேண்டும்’ என்று பொதுமைப்படுத்துதல்.
  rationale: எபிரெய உரை நிலையான, தெளிவான நீதித்துறை வாய்பாட்டைப் பயன்படுத்துகிறது. அதை பொதுக் கொள்கையாக மாற்றுவது உரையின் வலிமையான உருவகத்தையும் தோராவின் பிற பகுதிகளுடனான தொடர்பையும் மறைத்துவிடும்.
translation_notes:
  register: நவீன நிலையான தமிழில், சுருக்கமானதும் கண்ணியமானதுமான சட்ட மொழிநடை பயன்படுத்தப்பட்டுள்ளது. ‘உன் கண்’ என்ற எபிரெய உருவகம் இயல்புக்கு மாறாத அளவில் நேரடியாகத் தக்கவைக்கப்பட்டு, இணைச் சொற்றொடர்களின் ஓசையும் கட்டமைப்பும் பாதுகாக்கப்பட்டுள்ளன.
