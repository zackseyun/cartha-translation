  source_fidelity: மூல எபிரெய உரையின் உருவகமான “உன் கண்” மற்றும் חוּס வினையின் இரக்கம்/விட்டுவிடுதல் சார்ந்த பொருள் துல்லியமாகக் காக்கப்பட்டுள்ளன. நֶפֶשׁ בְּנֶפֶשׁ சட்ட வாய்பாடு சரியாக “உயிருக்கு உயிர்” எனவும், தொடர்ந்து வரும் சமமான ஈட்டுச் சூத்திரம் முழுமையாகவும் தரப்பட்டுள்ளது.
  naturalness: “உன் கண் இரக்கம் காட்டக்கூடாது” என்பது மூல உருவகத்தைத் தக்கவைத்துக்கொண்டு நவீன நிலையான தமிழில் தெளிவாக உள்ளது. இணைத் தொடர்கள் சுருக்கமாகவும் சட்ட மொழிநடைக்கு ஏற்றவாறும் உள்ளன.
  terminology: “உயிர்,” “கண்,” “பல்,” “கை,” “கால்” ஆகியவை பொருத்தமான சொற்கள். “ஆத்துமா” என்பது இவ்விடத்தில் நோக்கமல்ல என்பதைக் குறிக்கும் அடிக்குறிப்பு தெளிவானதும் இறையியல் முன்முடிவுகளைத் திணிக்காததுமாக உள்ளது.
