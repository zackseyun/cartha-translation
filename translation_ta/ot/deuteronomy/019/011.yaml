source:
  edition: WLC
  text: וְ/כִֽי יִהְיֶ֥ה אִישׁ֙ שֹׂנֵ֣א לְ/רֵעֵ֔/הוּ וְ/אָ֤רַב ל/וֹ֙ וְ/קָ֣ם עָלָ֔י/ו וְ/הִכָּ֥ה/וּ נֶ֖פֶשׁ וָ/מֵ֑ת וְ/נָ֕ס אֶל אַחַ֖ת הֶ/עָרִ֥ים הָ/אֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/019/011.yaml
  text: But if there is a man who hates his neighbor[a], and lies in wait for him, and rises up against him, and strikes him so that he dies, and he flees to one of these cities,
translation:
  language: ta
  text: ஆனால் ஒருவன் தன் அயலானைப் பகைத்து, அவனுக்காகப் பதுங்கிக் காத்திருந்து, அவனுக்கு எதிராக எழுந்து, அவனை உயிர்போகும்படி அடித்து[a], அவன் இறந்ததும், அந்த மனிதன் இந்த நகரங்களில் ஒன்றுக்குத் தப்பியோடினால்,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அவனுக்கு மரண அடி கொடுத்து” என்றும் மொழிபெயர்க்கலாம். எபிரெய மரபுத்தொடர் சொற்பொருளாக, “அவனை உயிரில்/உயிரைப் பொறுத்தவரை அடித்து” என உள்ளது; இது உயிரைப் பறிக்கும் அடி கொடுப்பதைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  choice: ஆனால் ... என்றால்
  rationale: முந்தைய வசனங்களில் கூறப்பட்ட தற்செயலான கொலைக்கு மாறான நிபந்தனை வழக்கை அறிமுகப்படுத்துவதால், எதிர்மறை மாற்றத்தையும் நிபந்தனையையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: יִהְיֶה אִישׁ
  choice: ஒருவன்
  rationale: சட்ட வழக்கில் ஒரு பிரதிநிதி ஆணைக் குறிக்கும் எபிரெய ஆண்பால் சொல்லைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: שֹׂנֵא לְרֵעֵהוּ
  choice: தன் அயலானைப் பகைத்து
  rationale: שֹׂנֵא என்பதன் நேரடியான பகைமை உணர்வையும், சட்டச் சூழலில் רֵעַ குறிக்கும் உடன்வாழும் சக மனிதன் என்ற பொருளையும் பாதுகாக்கிறது.
- source_word: וְאָרַב לוֹ
  choice: அவனுக்காகப் பதுங்கிக் காத்திருந்து
  rationale: திட்டமிட்டுத் தாக்குவதற்காக மறைந்து காத்திருக்கும் செயலை வெளிப்படுத்துகிறது; வெறும் மறைந்திருத்தலைவிட முன்திட்டத்தைக் காட்டுகிறது.
- source_word: וְקָם עָלָיו
  choice: அவனுக்கு எதிராக எழுந்து
  rationale: எபிரெய மொழியின் படிமத்தையும் பகைமையான தாக்குதல் தொடங்கும் பொருளையும் பாதுகாக்கிறது.
- source_word: וְהִכָּהוּ נֶפֶשׁ
  choice: அவனை உயிர்போகும்படி அடித்து[a]
  rationale: נֶפֶשׁ சேர்ந்துள்ள மரணத்துக்குரிய அடி என்ற எபிரெய மரபுத்தொடரை இயல்பான தமிழில் தெரிவிக்கிறது; அதன் அசாதாரண சொற்சேர்க்கை அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: וָמֵת
  choice: அவன் இறந்துபோன பின்பு
  rationale: அடியின் விளைவாகப் பாதிக்கப்பட்டவன் இறப்பதைத் தெளிவாக்குகிறது. அடுத்த செயலைச் செய்பவர் கொன்றவர் என்பதில் தமிழில் குழப்பம் வராதபடி தொடரை அமைக்கிறது.
- source_word: וְנָס
  choice: அடித்தவன் ... தப்பியோடினால்
  rationale: எபிரெயத்தில் சூழலால் தெளிவாகும் செய்பவரை தமிழில் வெளிப்படையாகக் குறிப்பதால், இறந்தவனே தப்பியோடுகிறான் என்ற தவறான வாசிப்பைத் தவிர்க்கிறது.
- source_word: אֶל אַחַת הֶעָרִים הָאֵל
  choice: இந்த நகரங்களில் ஒன்றுக்கு
  rationale: உடனடி சூழலில் ஏற்கெனவே நியமிக்கப்பட்ட அடைக்கல நகரங்களில் ஒன்றைக் குறிக்கும் அண்மைச் சுட்டை பாதுகாக்கிறது.
theological_decisions:
- issue: தற்செயலான கொலைக்கு மாறான திட்டமிட்ட கொலையின் சட்ட விளக்கம்
  choice: “பகைத்து ... பதுங்கிக் காத்திருந்து ... எதிராக எழுந்து ... உயிர்போகும்படி அடித்து” என்ற செயல்களின் தொடரைப் பாதுகாத்தல்
  alternative: “அவனைக் கொலைசெய்து” என்று ஒரே வினையால் சுருக்குதல்
  rationale: இது திட்டமிட்ட கொலை என்பதைச் சூழல் தெளிவாக்கினாலும், மூல உரை அதை ஒரு கருத்துரைப் பெயரால் சுருக்காமல் பகை, பதுங்கல், தாக்குதல், மரணம் ஆகிய தொடரால் விவரிக்கிறது. அந்தச் சட்ட மற்றும் ஒழுக்க அழுத்தத்தை மொழிபெயர்ப்பு பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சட்ட உரைக்கு ஏற்ற கண்ணியமான நடையும் சாதாரண வாசகர்களுக்குப் புரியும் சொற்களும் பயன்படுத்தப்பட்டுள்ளன. வசனம் அடுத்த வசனத்தில் நிறைவடையும் நிபந்தனை வாக்கியம் என்பதால் இறுதியில் காற்புள்ளி வைக்கப்பட்டுள்ளது. மூலத்தில் உள்ள செயல் தொடரும் நோக்கமுள்ள கொலைக்கும் தற்செயலான கொலைக்கும் இடையிலான வேறுபாடும் பாதுகாக்கப்பட்டுள்ளன.
