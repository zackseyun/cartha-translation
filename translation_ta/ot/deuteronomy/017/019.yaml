  text: וְ/הָיְתָ֣ה עִמּ֔/וֹ וְ/קָ֥רָא ב֖/וֹ כָּל יְמֵ֣י חַיָּ֑י/ו לְמַ֣עַן יִלְמַ֗ד לְ/יִרְאָה֙ אֶת יְהוָ֣ה אֱלֹהָ֔י/ו לִ֠/שְׁמֹר אֶֽת כָּל דִּבְרֵ֞י הַ/תּוֹרָ֥ה הַ/זֹּ֛את וְ/אֶת הַ/חֻקִּ֥ים הָ/אֵ֖לֶּה לַ/עֲשֹׂתָֽ/ם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/017/019.yaml
  text: And it shall be with him[a], and he shall read in it all the days of his life, so that he may learn to fear Yahweh his God, to keep all the words of this law and these statutes[c][b], to do them.
translation:
  language: ta
  text: அது அவனுடன் இருக்க வேண்டும்; அவன் தன் வாழ்நாளெல்லாம் அதில்[a] வாசிக்க வேண்டும். தன் இறைவனாகிய யாவேக்கு[b] அஞ்சவும்[c], இந்தத் திருச்சட்டத்தின் எல்லா வார்த்தைகளையும் இந்த விதிமுறைகளையும் கடைப்பிடித்து அவற்றைச் செய்யவும் அவன் கற்றுக்கொள்ளும்படி இவ்வாறு செய்ய வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அதிலிருந்து வாசிக்க’ என்றும் மொழிபெயர்க்கலாம்; எபிரெயத்தில் சொல்லுக்குச் சொல் ‘அதில் வாசிக்க’ என்று உள்ளது.
    reason: lexical_alternative
  - marker: b
    text: ‘யாவே’ என்பது எபிரெய இறைபெயரான YHWH-ஐக் குறிக்கிறது.
    reason: alternative_reading
  - marker: c
    text: ‘தன் இறைவனாகிய யாவேக்குப் பயபக்தி கொள்ளவும்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיְתָה עִמּוֹ
  choice: அது அவனுடனே இருக்க வேண்டும்
  rationale: முந்தைய வசனத்தில் கூறப்பட்ட திருச்சட்டத்தின் பிரதியைச் சுட்டுகிறது; அது அரசனிடம் தொடர்ந்து இருக்க வேண்டும் என்ற பொருளைத் தெளிவாகத் தருகிறது.
- source_word: וְקָרָא בוֹ
  choice: அதில் வாசிக்க வேண்டும்
  rationale: בּוֹ என்பதிலுள்ள ‘அதில்’ என்ற இடப்பொருளைப் பாதுகாக்கிறது; ‘அதிலிருந்து வாசிக்க’ என்பதும் சாத்தியம் என்பதால் அடிக்குறிப்பு தரப்பட்டுள்ளது.
- source_word: כָּל יְמֵי חַיָּיו
  choice: தன் வாழ்நாளெல்லாம்
  rationale: வாழ்நாள் முழுவதும் தொடரும் செயலை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: לְמַעַן יִלְמַד
  choice: இவ்வாறு ... கற்றுக்கொள்வான்
  rationale: வாசிப்பதன் நோக்கத்தையும் விளைவையும் தமிழில் இயல்பாக இணைக்கிறது.
- source_word: לְיִרְאָה אֶת יְהוָה אֱלֹהָיו
  choice: தன் இறைவனாகிய யாவேக்கு அஞ்சவும்
  rationale: יִרְאָה என்பதிலுள்ள அச்சம், பயபக்தி, கீழ்ப்படிதல் ஆகிய உடன்படிக்கைச் சார்ந்த பொருள் விரிவை ‘அஞ்ச’ பாதுகாக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய மூலத்தில் நேரடியாக இடம்பெறும் இறைபெயர் YHWH-ஐ பட்டப்பெயரால் மாற்றாமல் ஒலிபெயர்க்கிறது.
- source_word: לִשְׁמֹר
  choice: கைக்கொண்டு
  rationale: சட்டங்களைக் கவனமாகப் பேணி கடைப்பிடித்தல் என்ற உடன்படிக்கைச் சட்டப் பொருளைத் தருகிறது.
- source_word: כָּל דִּבְרֵי הַתּוֹרָה הַזֹּאת
  choice: இந்தத் திருச்சட்டத்தின் வார்த்தைகள் அனைத்தையும்
  rationale: תּוֹרָה இங்கு குறிப்பிட்ட எழுத்துப்பூர்வமான உடன்படிக்கைச் சட்டத்தைக் குறிக்கிறது; ‘வார்த்தைகள் அனைத்தையும்’ என்பது மூலத்தின் முழுமையைப் பாதுகாக்கிறது.
- source_word: הַחֻקִּים הָאֵלֶּה
  choice: இந்தச் சட்டதிட்டங்களையும்
  rationale: חֻקִּים என்பதன் முறையான சட்ட விதிகள் என்ற பொருளை பொதுவாசகர்களுக்குப் புரியும் தமிழில் தருகிறது.
- source_word: לַעֲשֹׂתָם
  choice: அவற்றைச் செய்யவும்
  rationale: ‘செய்’ என்ற மூல வினையின் நேரடியான உடன்படிக்கை வழக்கைத் தக்கவைத்து, ‘கீழ்ப்படி’ என்று மட்டும் விளக்கமாக மாற்றுவதைத் தவிர்க்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைபெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலத்தில் உள்ள தனிப்பட்ட உடன்படிக்கைப் பெயரை வெளிப்படையாகப் பாதுகாக்கிறது; ‘கர்த்தர்’ என்பது பெயருக்குப் பதிலான பட்டப்பெயர்.
- issue: உடன்படிக்கைச் சூழலில் ירא என்பதன் பொருள்
  choice: அஞ்ச
  alternative: பயபக்தி கொள்ள
  rationale: இறைவனைப் பற்றிய அச்சம், ஆழ்ந்த மரியாதை, கீழ்ப்படிதல் ஆகியவற்றுக்கிடையிலான வேதாகமப் பொருள் அழுத்தத்தைச் சுருக்காமல் பாதுகாக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் வடிவமைக்கப்பட்டது. ‘திருச்சட்டம்’, ‘சட்டதிட்டங்கள்’ ஆகியவை சட்டச் சூழலைத் தெளிவாக்குகின்றன; ‘கைக்கொண்டு அவற்றைச் செய்யவும்’ என்பது மூலத்தில் தனித்தனியாக உள்ள காத்தல் மற்றும் செய்தல் ஆகிய இரு கருத்துகளையும் பாதுகாக்கிறது.
