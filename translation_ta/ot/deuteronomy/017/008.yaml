  source_fidelity: மூலத்தின் சட்டச் சூழல், மூன்று இணை ‘இடையில்’ வகைப்பாடுகள், உள்ளூர் நகரவாசல் நீதிமன்றக் குறிப்பு, மற்றும் யாவே என்ற பெயர் ஆகியவை பெரும்பாலும் துல்லியமாக உள்ளன. ஆனால் ‘புறப்பட்டு ... செல்ல வேண்டும்’ என்பது וְקַמְתָּ וְעָלִיתָ (‘எழுந்து ... ஏறிச் செல்ல வேண்டும்’) என்ற இரட்டை வினைகளின் ‘எழுதல்/ஏறுதல்’ நுட்பத்தைத் தளர்த்துகிறது. மேலும், ‘உங்கள் நகரவாசல்களில் எழும்’ என்பது மூலத்தின் ‘உங்கள் நகரவாசல்களில் உள்ள’ என்ற இடச்சுட்டலைத் தேவையின்றி ‘எழும்’ என மாற்றுகிறது.
