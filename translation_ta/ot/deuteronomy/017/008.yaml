base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/017/008.yaml
  text: If a matter for judgment is too difficult for you—between bloodshed and bloodshed[a], between one legal claim and another, and between one injury and another[d][c][b], matters of dispute within your gates—then you shall arise and go up to the place that Yahweh your God will choose.
translation:
  language: ta
  text: 8 உங்கள் நகரவாசல்களில் உள்ள சர்ச்சைக்குரிய வழக்குகளில் தீர்ப்பளிக்க வேண்டிய ஒரு காரியம் உங்களுக்கு மிகவும் கடினமாக இருந்தால்—இரத்தப்பழி தொடர்பான ஒரு வழக்குக்கும் மற்றொன்றுக்கும் இடையிலோ[a], ஒரு சட்டக் கோரிக்கைக்கும் மற்றொன்றுக்கும் இடையிலோ[b], ஒருவகைக் காயத்திற்கும் மற்றொன்றுக்கும் இடையிலோ[c]—நீங்கள் எழுந்து, உங்கள் கடவுளாகிய யாவே தேர்ந்தெடுக்கும் இடத்திற்கு ஏறிச் செல்ல வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “இரத்தத்துக்கும் இரத்தத்துக்கும் இடையில்.” இது கொலை அல்லது இரத்தப்பழி தொடர்பான வெவ்வேறு வழக்குகளை வேறுபடுத்துவதைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “ஒரு சட்ட வழக்கிற்கும் மற்றொன்றுக்கும் இடையில்.”
    reason: lexical_alternative
  - marker: c
    text: அல்லது, “ஒருவகைப் பீடைக்கும் மற்றொன்றுக்கும் இடையில்,” அல்லது “ஒருவகைக் கொள்ளைநோய்க்கும் மற்றொன்றுக்கும் இடையில்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יִפָּלֵא
  choice: உங்களுக்கு மிகவும் கடினமாக இருந்தால்
  rationale: நீதித்துறைச் சூழலில் நிஃபால் வடிவம், தீர்மானிக்க இயலாத அளவுக்குக் கடினமாக இருப்பதைக் குறிக்கிறது; இயல்பான நவீனத் தமிழில் இதைத் தெளிவாகத் தருகிறது.
- source_word: דָבָר לַמִּשְׁפָּט
  choice: தீர்ப்பளிக்க வேண்டிய ஒரு வழக்கு
  rationale: דָבָר என்பது பொதுவாக ‘காரியம்’ எனினும், לַמִּשְׁפָּט உடன் நீதிவிசாரணைக்கு உரிய வழக்கைக் குறிக்கிறது.
- source_word: בֵּין דָּם לְדָם
  choice: ஒருவகை இரத்தப்பழிக்கும் மற்றொன்றுக்கும் இடையில்
  rationale: ‘இரத்தத்துக்கும் இரத்தத்துக்கும் இடையில்’ என்ற எபிரெய உருவகத்தை ஓரளவு காத்து, கொலை அல்லது இரத்தப்பழி சார்ந்த வழக்குகளைத் தமிழில் சட்டப் பொருளுடன் வெளிப்படுத்துகிறது.
- source_word: בֵּין דִּין לְדִין
  choice: ஒரு சட்டக் கோரிக்கைக்கும் மற்றொன்றுக்கும் இடையில்
  rationale: דִּין என்பதற்கு வழக்கு, சட்டக் கோரிக்கை, தீர்ப்பு ஆகிய பொருள்கள் உண்டு; இங்கு தரப்புகளின் முரண்பட்ட சட்டக் கோரிக்கைகள் என்ற நீதித்துறைச் சூழல் பொருந்துகிறது.
- source_word: וּבֵין נֶגַע לָנֶגַע
  choice: ஒருவகைக் காயத்திற்கும் மற்றொன்றுக்கும் இடையில்
  rationale: נֶגַע என்பது அடி, காயம், பீடை அல்லது கொள்ளைநோய் எனப் பலவாறு பொருள்படலாம்; நீதிவழக்குகளின் பட்டியலில் ‘காயம்’ இயல்பாகப் பொருந்தினாலும், மாற்றுப் பொருள்கள் அடிக்குறிப்பில் காக்கப்படுகின்றன.
- source_word: דִּבְרֵי רִיבֹת
  choice: சர்ச்சைக்குரிய வழக்குகள்
  rationale: சச்சரவு மற்றும் நீதிமன்றத் தகராறு ஆகிய இரு கூறுகளையும் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: בִּשְׁעָרֶיךָ
  choice: உங்கள் நகரவாசல்களில்
  rationale: ‘வாசல்கள்’ என்ற மூலப் படிமத்தைக் காத்து, அது நகரங்களின் உள்ளூர் நீதியிடத்தைக் குறிக்கிறது என்பதைச் சூழலும் அடிக்குறிப்பும் தெளிவாக்குகின்றன.
- source_word: וְקַמְתָּ וְעָלִיתָ
  choice: நீங்கள் புறப்பட்டு ... செல்ல வேண்டும்
  rationale: இரண்டு வினைகளும் தீர்மானமான பயணத்தைச் சுட்டுகின்றன. தமிழில் ‘புறப்பட்டு ... செல்ல வேண்டும்’ இயல்பானது; உயர்ந்த இடத்துக்குச் செல்லும் திசைநுட்பம் உரையில் கட்டாயமாக மிகைப்படுத்தப்படவில்லை.
- source_word: הַמָּקוֹם אֲשֶׁר יִבְחַר
  choice: தேர்ந்தெடுக்கும் இடம்
  rationale: முன்னோக்கிய எபிரெய வினை வடிவத்தைக் காத்து, யாவே இனி நியமிக்கவிருக்கும் மைய இடத்தைச் சுட்டுகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரான நான்கெழுத்துப் பெயரை ஒரு பட்டமாக மாற்றாமல், தமிழில் பொதுவாகப் புரியக்கூடிய ஒலிபெயர்ப்பாக வழங்குகிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலத்தில் தனிப்பட்ட உடன்படிக்கைப் பெயர் நேரடியாக உள்ளது. அதனைப் பட்டமான ‘கர்த்தர்’ என்று மாற்றாமல் ஒலிபெயர்ப்பது மூல வேறுபாட்டைக் காக்கிறது.
- issue: נֶגַע என்பதன் பொருள்
  choice: காயம்
  alternative: பீடை; கொள்ளைநோய்
  rationale: இது நீதித்துறை வழக்குகளின் வரிசையில் வருவதால் உடற்காயம் முதன்மைப் பொருளாகப் பொருந்துகிறது; எனினும் சொல்லின் மருத்துவ அல்லது பீடை சார்ந்த சாத்தியம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சட்டச் சூழலுக்கேற்ற கண்ணியமான ஆனால் பொதுமக்களுக்கு விளங்கும் நடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் மூன்று இணையான ‘இடையில்’ கூறுகள் காக்கப்பட்டுள்ளன; தமிழில் வாக்கிய ஓட்டம் தெளிவாக இருக்க இடைக்கோடுகள் பயன்படுத்தப்பட்டுள்ளன.
