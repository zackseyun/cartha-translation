  text: and it is reported to you[a], and you hear of it, and you investigate thoroughly, and behold, it is true and certain that this abomination has been done in Israel,
translation:
  language: ta
  text: அது உனக்கு அறிவிக்கப்பட்டு, நீ அதைக் கேள்விப்பட்டு நன்றாக விசாரித்தபின், இதோ, அந்தக் காரியம் உண்மையும் உறுதியுமானது என்றும், இந்த அருவருப்பான செயல் இஸ்ரவேலில் செய்யப்பட்டிருக்கிறது என்றும் தெரியவந்தால்—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהֻגַּד לְךָ
  choice: அது உனக்கு அறிவிக்கப்பட்டு
  rationale: נגד என்பதன் ஹொஃபால் வடிவம் செயல்பாட்டு வினையின் பயனிலைப் பொருளைத் தருகிறது; ஒரு செய்தி அதிகாரப்பூர்வமாகக் கேட்பவரிடம் கொண்டுவரப்படுவதை இத்தேர்வு இயல்பான தமிழில் காக்கிறது.
- source_word: וְשָׁמָעְתָּ
  choice: நீ அதைக் கேள்விப்பட்டு
  rationale: שׁמע என்பதன் அடிப்படைப் பொருள் ‘கேள்’; முன்னுள்ள அறிவிப்பையே மறைமுகச் செயப்படுபொருளாகக் கொண்டு, தமிழில் தெளிவாக ‘அதைக் கேள்விப்பட்டு’ என வழங்கப்படுகிறது.
- source_word: וְדָרַשְׁתָּ הֵיטֵב
  choice: நன்றாக விசாரிக்கும்போது
  rationale: நீதித்துறைச் சூழலில் דרש என்பது விசாரணை செய்வதையும் הֵיטֵב முழுமையுடனும் கவனமாகவும் செய்வதையும் குறிக்கிறது.
- source_word: וְהִנֵּה
  choice: இதோ
  rationale: הִנֵּה உறுதிசெய்யப்பட்ட முடிவின்மீது கவனத்தைத் திருப்பும் உரைக் குறியீடு; ‘இதோ’ அதன் வலிமையையும் மாண்பான நடையையும் காக்கிறது.
- source_word: אֱמֶת נָכוֹן הַדָּבָר
  choice: அந்தச் செய்தி உண்மையென்றும் உறுதிப்படுத்தப்பட்டதென்றும் தெரியவந்தால்
  rationale: இச்சட்டப்பூர்வ உறுதிப்பாட்டு மொழியில் אֱמֶת உண்மைத்தன்மையையும் נָכוֹן நிலைநாட்டப்பட்ட உறுதியையும் தெரிவிக்கிறது; இரண்டையும் ஒன்றாகச் சுருக்காமல் தமிழ் வெளிப்படுத்துகிறது.
- source_word: נֶעֶשְׂתָה
  choice: செய்யப்பட்டிருப்பது
  rationale: עשה என்பதன் பயனிலை வடிவம் அந்தச் செயல் உண்மையில் செய்யப்பட்டிருப்பதைக் கூறுகிறது.
- source_word: הַתּוֹעֵבָה הַזֹּאת
  choice: இந்த அருவருப்பான செயல்
  rationale: תּוֹעֵבָה என்பதன் கடுமையான உடன்படிக்கைசார் ஒழுக்க மதிப்பீட்டை ‘அருவருப்பான’ காக்கிறது; சூழலில் இது ஒரு செயலைக் குறிப்பதால் ‘செயல்’ இயல்பாகச் சேர்க்கப்படுகிறது.
- source_word: בְּיִשְׂרָאֵל
  choice: இஸ்ரவேலில்
  rationale: குற்றம் உடன்படிக்கைச் சமூகத்தின் மத்தியில் நிகழ்ந்திருப்பதை நேரடியாகக் குறிப்பிடுகிறது.
theological_decisions:
- issue: אֱמֶת נָכוֹן הַדָּבָר என்ற நீதித்துறை உறுதிப்பாட்டு வாய்பாட்டை மொழிபெயர்த்தல்
  choice: அந்தச் செய்தி உண்மையென்றும் உறுதிப்படுத்தப்பட்டதென்றும் தெரியவந்தால்
  alternative: அந்தக் காரியம் உண்மையும் உறுதியுமானது என்றால்
  rationale: எபிரெயத்தில் உண்மைத்தன்மையும் உறுதியாக நிலைநாட்டப்பட்ட நிலையும் தனித்தனியாக வலியுறுத்தப்படுகின்றன. இத்தேர்வு நீதித்துறைச் சூழலைக் காத்து, தேவையற்ற கோட்பாட்டு விளக்கத்தைச் சேர்க்காமல் இரண்டையும் வெளிப்படுத்துகிறது.
- issue: תּוֹעֵבָה என்பதன் வலிமையை மொழிபெயர்த்தல்
  choice: அருவருப்பான செயல்
  alternative: அருவருப்பு
  rationale: உபாகமத்தில் இச்சொல் கடுமையான ஒழுக்க மற்றும் உடன்படிக்கைசார் மதிப்பீட்டைக் கொண்டுள்ளது. ‘அருவருப்பான செயல்’ அதன் வலிமையைத் தக்கவைத்தபடியே நவீன தமிழில் இயல்பாக உள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், சட்ட விசாரணையின் மாண்பும் கடுமையும் காக்கப்பட்டுள்ளன. இவ்வசனம் அடுத்த வசனத்தில் தொடரும் நிபந்தனை அமைப்பின் ஒரு பகுதி என்பதால் இறுதியில் நீள்கோடு வைக்கப்பட்டுள்ளது; எபிரெயத்தின் தொடர்ச்சியான வினைமொழிகள் தமிழில் இயல்பான நிபந்தனைத் தொடராக அமைக்கப்பட்டுள்ளன.
