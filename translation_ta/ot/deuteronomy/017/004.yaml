revisions:
- from: அது உனக்கு அறிவிக்கப்பட்டு, நீ அதைக் கேள்விப்பட்டு, நன்றாக விசாரிக்கும்போது, இதோ, அந்தச் செய்தி உண்மையென்றும் உறுதிப்படுத்தப்பட்டதென்றும் தெரியவந்தால்[a]—இந்த அருவருப்பான செயல் இஸ்ரவேலில் செய்யப்பட்டிருப்பது உறுதியானால்—
  to: அது உனக்கு அறிவிக்கப்பட்டு, நீ அதைக் கேள்விப்பட்டு நன்றாக விசாரித்தபின், இதோ, அந்தக் காரியம் உண்மையும் உறுதியுமானது என்றும், இந்த அருவருப்பான செயல் இஸ்ரவேலில் செய்யப்பட்டிருக்கிறது என்றும் தெரியவந்தால்—
  rationale: The revision removes the duplicated conditional confirmation and presents the verified act as the content of the judicial finding, in keeping with the Hebrew sequence. It also uses ‘அந்தக் காரியம்’ for the investigated matter and retains the verse’s continuing conditional syntax marked by the final dash.
