base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/017/020.yaml
  text: so that his heart may not be lifted up above his brothers[a], and so that he may not turn aside from the commandment to the right or to the left, in order that he may prolong his days in his kingdom, he and his sons, in the midst of Israel.
translation:
  language: ta
  text: அவன் தன் சகோதரர்களுக்கு மேலாகத் தன் இதயத்தை உயர்த்திக்கொள்ளாமலும், கட்டளையைவிட்டு வலப்புறமோ இடப்புறமோ விலகாமலும் இருப்பதனால், அவனும் அவன் மகன்களும் இஸ்ரவேலின் நடுவில் தங்கள் அரசாட்சியில் நீண்ட நாட்கள் வாழ்வார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְבִלְתִּי רוּם לְבָבוֹ
  choice: தன்னை உயர்ந்தவனாகக் கருதாமலும்
  rationale: எபிரெய மொழியின் ‘அவனுடைய இதயம் உயராதபடி’ என்ற பெருமையைக் குறிக்கும் உருவகத்தை, நவீனத் தமிழில் இயல்பாகவும் அதன் உள்ளார்ந்த மனப்பாங்கைத் தெளிவாகவும் வெளிப்படுத்துகிறது.
- source_word: מֵאֶחָיו
  choice: தன் சகோதரர்களைவிட
  rationale: அரசனுடன் உடன்படிக்கைச் சமூகத்தைச் சேர்ந்தவர்களை ‘சகோதரர்கள்’ என்று அழைக்கும் மூலமொழியின் உறவுச் சொல்லைத் தக்கவைக்கிறது.
- source_word: וּלְבִלְתִּי סוּר מִן הַמִּצְוָה
  choice: கட்டளையைவிட்டு ... விலகாமலும்
  rationale: கொடுக்கப்பட்ட கட்டளைக்குக் கீழ்ப்படிவதிலிருந்து விலகுவதைச் சுட்டும் உடன்படிக்கை மொழிநடையை இயல்பான தமிழில் தருகிறது.
- source_word: יָמִין וּשְׂמֹאול
  choice: வலதுபுறமோ இடதுபுறமோ
  rationale: எந்தத் திசையிலும் நெறிபிறழ்வதைக் குறிக்கும் எபிரெய உருவகத்தைப் பாதுகாக்கிறது.
- source_word: לְמַעַן יַאֲרִיךְ יָמִים עַל מַמְלַכְתּוֹ
  choice: தங்கள் அரசாட்சியில் நீண்ட நாட்கள் நிலைத்திருப்பார்கள்
  rationale: ‘தன் அரசாட்சியின்மேல் நாட்களை நீட்டித்தல்’ என்ற மொழிப்பாங்கின் பொருளான நீடித்த ஆட்சியைத் தமிழில் தெளிவாகத் தருகிறது; மகன்களும் குறிப்பிடப்படுவதால் பகிர்ந்த வினைப்பொருத்தம் பயன்படுத்தப்பட்டுள்ளது.
- source_word: הוּא וּבָנָיו
  choice: அவனும் அவன் மகன்களும்
  rationale: அரச மரபுத் தொடர்ச்சியைச் சுட்டும் ‘மகன்கள்’ என்ற மூலமொழியின் குறிப்பை விரிவுபடுத்தாமல் தக்கவைக்கிறது.
- source_word: בְּקֶרֶב יִשְׂרָאֵל
  choice: இஸ்ரவேலின் நடுவில்
  rationale: இஸ்ரவேல் சமூகத்தின் மத்தியில் என்ற மூலமொழியின் இடவியல் மற்றும் உடன்படிக்கைச் சூழலைப் பாதுகாக்கிறது.
theological_decisions:
- issue: அரசனைச் சார்ந்த பாலினக் குறியுள்ள உறவுமொழி
  choice: சகோதரர்கள்
  alternative: சக இஸ்ரவேலர்கள்
  rationale: மூலமொழி ஆண்பால் பன்மையான ‘சகோதரர்கள்’ என்பதையே பயன்படுத்துகிறது; அது உடன்படிக்கை உறவையும் அரசன் அவர்களுக்கு மேலான இயல்புடையவன் அல்ல என்பதையும் உணர்த்துகிறது. விரிந்த சூழற்பொருள் அடிக்குறிப்பில் விளக்கப்படுகிறது.
- issue: அரச மரபுத் தொடர்ச்சியின் சொல்வடிவு
  choice: அவனும் அவன் மகன்களும்
  alternative: அவனும் அவன் சந்ததியினரும்
  rationale: மூலமொழி குறிப்பாக ‘மகன்கள்’ என்று கூறுவதால், பொதுவான ‘சந்ததியினர்’ என்று விரிவாக்காமல் அரச வாரிசுரிமைச் சொல்லைத் தக்கவைக்கிறது.
- issue: நீண்ட நாட்கள் என்பதன் தொடர்பு
  choice: அவனும் அவன் மகன்களும் அரசாட்சியில் நீடித்திருத்தல்
  alternative: அரசன் தனிப்பட்ட முறையில் நீண்ட ஆயுள் பெறுதல்
  rationale: ‘அரசாட்சியின்மேல்’ என்பதும் ‘அவனும் அவன் மகன்களும்’ என்பதும் தனிநபர் ஆயுளை மட்டும் அல்லாமல் அரச மரபின் நீடிப்பை முன்னிறுத்துகின்றன; ஆயினும் ‘நீண்ட நாட்கள்’ என்ற மூலமொழிச் சாயலும் மொழிபெயர்ப்பில் வைக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில் dignified ஆனால் எளிதில் புரியும் உரைநடை. பெருமையைக் குறிக்கும் எபிரெய இதய உருவகம் முதன்மை உரையில் இயல்பாக்கப்பட்டு, அதன் சொற்சார்ந்த வடிவு அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
