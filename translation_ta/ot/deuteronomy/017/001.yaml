base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/017/001.yaml
  text: You shall not sacrifice to Yahweh your God an ox or a sheep that has in it a blemish[a], any bad thing, for that is an abomination to Yahweh your God.
translation:
  language: ta
  text: உன் கடவுளாகிய யாவேக்கு, குறைபாடோ எந்தவிதக் கேடோ உள்ள ஒரு மாட்டையோ செம்மறியாட்டையோ[a] நீ பலியிடக் கூடாது; ஏனெனில் அது உன் கடவுளாகிய யாவேக்கு அருவருப்பானது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயச் சொல் שֶׂה, செம்மறியாட்டை மட்டுமல்லாமல் வெள்ளாட்டையும் குறிக்கக்கூடிய பரந்த பொருளுடையது.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִזְבַּח
  choice: பலியிடக் கூடாது
  rationale: זבח இங்கு பலிச் சூழலில் வருவதால், வெறுமனே கொல்வதை அல்லாமல் கடவுளுக்குப் பலியாகச் செலுத்துவதைக் குறிக்கிறது.
- source_word: לַיהוָה
  choice: யாவேக்கு
  rationale: יהוה என்ற தனிப்பட்ட இறைப் பெயரைப் பொதுப்பட்டமான ‘ஆண்டவர்’ என்று மாற்றாமல், ‘Yahweh’ என்பதற்கேற்ற தமிழாக்கமாக ‘யாவே’ என ஒலிபெயர்த்துள்ளது.
- source_word: שׁוֹר
  choice: மாடு
  rationale: שׁוֹר என்பதைக் பாலினத்தைத் தேவையின்றி வரையறுக்கும் ‘காளை’ அல்லது ‘எருது’ என்பதற்குப் பதிலாக, பலிக்குரிய மாட்டின விலங்கைக் குறிக்கும் இயல்பான பொதுச்சொல்லாக மொழிபெயர்த்துள்ளது.
- source_word: שֶׂה
  choice: செம்மறியாடு
  rationale: வாசிப்புக்கு இயல்பான முதன்மைத் தேர்வு. இச்சொல் வெள்ளாட்டையும் குறிக்கக்கூடிய பரந்த மந்தைச்சொல் என்பதால் அந்த நுட்பம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
- source_word: מוּם
  choice: குறைபாடு
  rationale: பலிக்குத் தகுதியற்றதாக்கும் உடற்குறையைத் தெளிவாகவும் இயல்பாகவும் குறிக்கிறது.
- source_word: כֹּל דָּבָר רָע
  choice: வேறு ஏதேனும் கேடு
  rationale: ‘எந்தத் தீய காரியமும்’ என்ற சூழலுக்குப் பொருந்தாத சொற்சொல் மொழிபெயர்ப்பைத் தவிர்த்து, முந்தைய ‘குறைபாடு’ என்பதை விரிவாக்கும் எபிரெய இணைப்பை இயல்பான தமிழில் தருகிறது.
- source_word: תוֹעֲבַת
  choice: அருவருப்பானது
  rationale: கடவுளின் பார்வையில் ஏற்கத்தகாததும் வெறுக்கத்தக்கதுமான ஒன்றைக் குறிக்கும் சொல்லின் வலிமையைத் தக்கவைக்கிறது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: ஆண்டவர் / யெகோவா
  rationale: மூலத்தில் உள்ள உடன்படிக்கைப் பெயரைப் பட்டப்பெயராக மாற்றாமல் பாதுகாக்கிறது; ‘யெகோவா’ என்ற மாற்று ஒலிப்பையும் ஏற்காமல், Yahweh என்பதற்குரிய தமிழ் ஒலிபெயர்ப்பைப் பயன்படுத்துகிறது.
- issue: תוֹעֵבָה என்பதின் சடங்கு மற்றும் ஒழுக்க வலிமை
  choice: அருவருப்பானது
  alternative: வெறுக்கத்தக்கது
  rationale: இவ்வசனத்தில் குறைபாடுள்ள விலங்கைப் பலியிடுவது யாவேக்கு முற்றிலும் ஏற்கத்தகாதது என்ற தீவிரமான மதிப்பீட்டைத் தக்கவைக்கிறது; அதன் பொருளை ஒரு குறிப்பிட்ட கோட்பாட்டிற்குள் மேலும் சுருக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் வேதச்சட்டத்திற்கேற்ற கண்ணியமான நடையிலும் அமைக்கப்பட்டுள்ளது. எபிரெய வாக்கியத்தின் வலியுறுத்தலைத் தக்கவைத்தபடியே ‘குறைபாடோ வேறு ஏதேனும் கேடோ’ என்று இயல்பாக்கப்பட்டுள்ளது.
