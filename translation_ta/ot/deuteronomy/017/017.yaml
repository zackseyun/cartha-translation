source:
  edition: WLC
  text: וְ/לֹ֤א יַרְבֶּה לּ/וֹ֙ נָשִׁ֔ים וְ/לֹ֥א יָס֖וּר לְבָב֑/וֹ וְ/כֶ֣סֶף וְ/זָהָ֔ב לֹ֥א יַרְבֶּה לּ֖/וֹ מְאֹֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/017/017.yaml
  text: And he shall not multiply wives for himself[a], lest his heart turn away; and he shall not greatly multiply silver and gold for himself.
translation:
  language: ta
  text: அவனுடைய இதயம் விலகிப்போகாதபடி, அவன் தனக்கெனப் பல மனைவிகளைப் பெருக்கிக்கொள்ளக் கூடாது; வெள்ளியையும் தங்கத்தையும் அவன் தனக்கென மிகுதியாகச் சேர்த்துக்கொள்ளக் கூடாது.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יַרְבֶּה
  choice: பெருக்கிக்கொள்ள / மிகுதியாகச் சேர்த்துக்கொள்ள
  rationale: முதல் இடத்தில் மனைவிகளின் எண்ணிக்கையைப் பெருக்குவதையும், இரண்டாம் இடத்தில் செல்வத்தைக் குவிப்பதையும் குறிக்கிறது. தமிழில் ஒவ்வொரு பொருளுக்கும் இயல்பான வினைச்சொல் பயன்படுத்தப்பட்டாலும், இரண்டிலும் அளவுக்கு மீறிய சேர்த்தல் என்ற ஒரே கருத்து காக்கப்படுகிறது.
- source_word: נָשִׁים
  choice: மனைவிகள்
  rationale: அரசனுக்கான சட்டத்தின் சூழலில் இது பொதுவாகப் பெண்களைக் குறிக்காமல், திருமண உறவிலுள்ள மனைவிகளைக் குறிக்கிறது.
- source_word: יָסוּר
  choice: விலகிப்போக
  rationale: இதயம் தன் சரியான பற்றுறுதியிலிருந்து திரும்புவதைக் குறிக்கும் எபிரெய உருவகத்தை இது காக்கிறது; மூலத்தில் சொல்லப்படாத ‘ஆண்டவரிடமிருந்து’ போன்ற நிறைவைச் சேர்க்கவில்லை.
- source_word: לְבָבוֹ
  choice: அவனுடைய இதயம்
  rationale: மனவிருப்பம், பற்று, உள்ளார்ந்த தீர்மானம் ஆகியவற்றை உள்ளடக்கும் வேதாகம மானுடவியல் உருவகத்தை ‘இதயம்’ நேரடியாகக் காக்கிறது.
- source_word: כֶּסֶף וְזָהָב
  choice: வெள்ளியும் தங்கமும்
  rationale: இரண்டு உறுதியான செல்வப் பொருட்களையும் மூலத்தின் இணைச்சொல் அமைப்பையும் நேரடியாகக் காக்கிறது.
- source_word: מְאֹד
  choice: மிகுதியாக
  rationale: செல்வம் வைத்திருப்பதையே அல்லாமல், அதை அளவுக்கு அதிகமாகக் குவிப்பதையே தடை குறிக்கிறது என்பதை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: பல மனைவிகளைப் பெறுவதற்கான தடைக்கும் இதயம் விலகுவதற்கும் உள்ள தொடர்பு
  choice: இதயம் விலகிப்போகாதபடி என்ற நோக்கம்/விளைவு சார்ந்த வாசிப்பு
  alternative: ‘அவனுடைய இதயம் விலகிப்போகக் கூடாது’ என்ற இணையான தனித் தடை
  rationale: சொற்றொடரின் ஓட்டத்தில் நடுப்பகுதி முதல் தடைக்கான எச்சரிக்கையான காரணம் அல்லது எதிர்பார்க்கப்படும் விளைவு என்று இயல்பாகப் புரிகிறது. இருப்பினும், எபிரெய தொடரை இணையான மற்றொரு தடையாகவும் வாசிக்க இயலும் என்பதால் அது அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் சட்ட உரைக்கு ஏற்ற கண்ணியத்துடனும் வடிவமைக்கப்பட்டது. ‘தனக்கென’ என்பது לּוֹ என்பதன் தன்நலச் சேர்த்தல் நுணுக்கத்தைக் காக்கிறது. மூலத்தில் குறிப்பிடப்படாத இதயம் எதிலிருந்து விலகுகிறது என்ற விளக்கம் சேர்க்கப்படவில்லை.
