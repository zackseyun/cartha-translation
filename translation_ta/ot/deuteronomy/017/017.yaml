revisions:
- from: அவன் தனக்கென மனைவிகளைப் பெருக்கிக்கொள்ளக் கூடாது; அவனுடைய இதயம் விலகிப்போகாதபடி[a] அவன் பார்த்துக்கொள்ள வேண்டும். வெள்ளியையும் தங்கத்தையும் அவன் தனக்கென மிகுதியாகச் சேர்த்துக்கொள்ளக் கூடாது.
  to: அவனுடைய இதயம் விலகிப்போகாதபடி, அவன் தனக்கெனப் பல மனைவிகளைப் பெருக்கிக்கொள்ளக் கூடாது; வெள்ளியையும் தங்கத்தையும் அவன் தனக்கென மிகுதியாகச் சேர்த்துக்கொள்ளக் கூடாது.
  rationale: The revision removes the unsupported ‘பார்த்துக்கொள்ள வேண்டும்’ and directly renders the likely warning/purpose sense as ‘அவனுடைய இதயம் விலகிப்போகாதபடி.’ The footnote preserves the viable coordinate-prohibition reading. “பல” is supplied idiomatically to convey the force of multiplying wives, without implying a prohibition of marriage itself.
