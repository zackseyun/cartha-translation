base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/017/005.yaml
  text: then you shall bring out to your gates that man or that woman who did this evil thing[a], that man or that woman, and you shall stone them with stones[b], and they shall die.
translation:
  language: ta
  text: அப்போது, இந்தத் தீய காரியத்தை[a] செய்த அந்த ஆணையோ அந்தப் பெண்ணையோ உன் நகரவாசல்களிடம் வெளியே கொண்டுவா. அந்த ஆணையோ அந்தப் பெண்ணையோ கற்களால் எறி; அவர்கள் இறப்பார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “காரியம்” என்பதற்கு “விவகாரம்” என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் ஒரு செயலை அல்லது சட்ட விசாரணைக்குரிய விவகாரத்தைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוֹצֵאתָ
  choice: அப்போது ... வெளியே கொண்டுவா
  rationale: சட்ட நடைமுறையின் அடுத்த கட்டத்தைக் குறிக்கும் தொடர்ச்சிப் பொருளை “அப்போது” வெளிப்படுத்துகிறது; இரண்டாம் நபர் ஒருமை கட்டளை வடிவமும் காக்கப்படுகிறது.
- source_word: הָאִישׁ הַהוּא אוֹ ... הָאִשָּׁה הַהִוא
  choice: அந்த ஆணையோ அந்தப் பெண்ணையோ
  rationale: எபிரெய மூலத்தில் ஆணும் பெண்ணும் தனித்தனியாகக் குறிப்பிடப்படுவதையும், சுட்டுப்பெயரால் காட்டப்படும் குறிப்புத்தன்மையையும் தமிழில் காக்கிறது.
- source_word: הַדָּבָר הָרָע הַזֶּה
  choice: இந்தத் தீய காரியத்தை
  rationale: דָּבָר என்பதற்கு “காரியம்” அல்லது சட்டச் சூழலில் “விவகாரம்” எனப் பொருள் கொள்ளலாம். இங்கு “தீய காரியம்” இயல்பாகவும் மூலத்தின் பொருள் விரிவை அளவோடு காப்பதாகவும் உள்ளது.
- source_word: אֶל שְׁעָרֶיךָ
  choice: உன் நகரவாசல்களுக்கு
  rationale: שְׁעָרֶיךָ என்பதன் பன்மையைப் பேணுகிறது. தமிழில் “நகரவாசல்கள்” எனக் கூறுவது, இவை நகரத்தின் பொது நீதி விசாரணை நடைபெறும் வாசல்கள் என்பதை மிகையில்லாமல் தெளிவாக்குகிறது.
- source_word: וּסְקַלְתָּם בָּאֲבָנִים
  choice: கற்களால் எறி
  rationale: செயலையும் அதற்குப் பயன்படுத்தப்படும் கற்களையும் மூலத்தைப் போல வெளிப்படையாகக் குறிப்பிடுகிறது; தமிழில் தேவையற்ற இரட்டிப்பைத் தவிர்த்து இயல்பாக உள்ளது.
- source_word: וָמֵתוּ
  choice: அவர்கள் சாகும்படி
  rationale: கல்லெறிதலின் விளைவாக மரணம் நிகழ வேண்டும் என்ற சட்ட வாக்கியத்தின் நோக்கவிளைவை இயல்பான தமிழில் தெரிவிக்கிறது; மூலத்தில் இல்லாத கூடுதல் தண்டனைவியல் விளக்கத்தைச் சேர்க்கவில்லை.
theological_decisions:
- issue: பாலினத்தைக் குறிப்பிட்ட சட்ட வடிவம்
  choice: அந்த ஆணையோ அந்தப் பெண்ணையோ
  alternative: அந்த நபரை
  rationale: மூலம் ஆண், பெண் இருவரையும் வெளிப்படையாகத் தனித்தனியாகக் குறிப்பிடுவதால், பாலினப் பொதுமைப்படுத்தல் செய்யாமல் அதே வடிவம் காக்கப்பட்டது.
- issue: நகரவாசல் நீதித்தலமாக இருப்பது
  choice: உன் நகரவாசல்களுக்கு
  alternative: பொது நீதித்தலத்திற்கு
  rationale: மூலத்தின் உருவகமற்ற, வரலாற்றுச் சிறப்புடைய இடக்குறிப்பு காக்கப்படுகிறது; அதன் பண்பாட்டுப் பின்னணி அடிக்குறிப்பில் விளக்கப்படுகிறது.
- issue: தண்டனையின் இறுதி விளைவு
  choice: அவர்கள் சாகும்படி கற்களால் எறி
  alternative: கற்களால் எறி; அவர்கள் சாவார்கள்
  rationale: וָמֵתוּ என்பது இங்கு நீதித்தீர்ப்பின் மரண விளைவைக் குறிக்கிறது. தமிழ் வாக்கியத்தில் அந்த உறவைத் தெளிவாகக் காட்டுவதுடன், தனிப்பட்ட கோட்பாட்டு விளக்கமொன்றும் சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், சட்ட உரைக்கு ஏற்ற கண்ணியமான நேரடி கட்டளை நடை பயன்படுத்தப்பட்டது. மூலத்தில் இருமுறை வரும் “அந்த ஆணையோ அந்தப் பெண்ணையோ” என்பது வலியுறுத்தலாக இருப்பதால் சுருக்கப்படாமல் காக்கப்பட்டது. அடிக்குறிப்பு குறியீடுகள் அவை விளக்கும் சொற்றொடர்களுக்குப் பின்னரே வைக்கப்பட்டுள்ளன.
