source:
  edition: WLC
  text: יַ֣ד הָ/עֵדִ֞ים תִּֽהְיֶה בּ֤/וֹ בָ/רִאשֹׁנָה֙ לַ/הֲמִית֔/וֹ וְ/יַ֥ד כָּל הָ/עָ֖ם בָּ/אַחֲרֹנָ֑ה וּ/בִֽעַרְתָּ֥ הָ/רָ֖ע מִ/קִּרְבֶּֽ/ךָ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/017/007.yaml
  text: The hand of the witnesses shall be first against him to put him to death[a], and afterward the hand of all the people[b]. So you shall purge the evil from your midst.
translation:
  language: ta
  text: அவனுக்கு மரணதண்டனையை நிறைவேற்றுவதில் முதலில் சாட்சிகளின் கை அவனுக்கு எதிராக இருக்க வேண்டும்; பின்னர் மக்கள் அனைவரின் கையும் இருக்க வேண்டும்.[a] இவ்வாறு உன் நடுவிலிருந்து தீமையை அகற்றிவிட வேண்டும்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “சாட்சிகளின் கை… மக்கள் அனைவரின் கை” என்பது, தீர்ப்பை நிறைவேற்றுவதில் சாட்சிகளே முதலில் செயல்பட வேண்டும் என்று பொறுப்பை விதிக்கும் எபிரெயச் சட்ட மரபுத்தொடர்.
    reason: cultural_note
  - marker: b
    text: அல்லது “உனக்குள்ளிருந்து.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יַד
  choice: கை
  rationale: எபிரெயச் சட்ட மரபுத்தொடரில் ‘கை’ என்பது தண்டனையை நிறைவேற்றுவதில் ஒருவருக்குள்ள செயற்பாட்டையும் பொறுப்பையும் குறிக்கிறது. மூலத்தின் ஒருமை வடிவமும் உருவகமும் காக்கப்பட்டுள்ளன.
- source_word: הָעֵדִים
  choice: சாட்சிகள்
  rationale: இது வெறும் குற்றஞ்சாட்டுவோரைக் குறிக்காமல், நீதிமன்றத்தில் சாட்சி கூறியவர்களைக் குறிக்கிறது.
- source_word: בּוֹ
  choice: அவனுக்கு எதிராக
  rationale: தண்டனைச் சூழலில் ‘கை’ என்பதுடன் சேர்ந்த இந்தச் சொல், வெறும் இடத்தைக் காட்டாமல் அவனுக்கு எதிரான செயலைக் குறிக்கிறது.
- source_word: בָרִאשֹׁנָה
  choice: முதலில்
  rationale: தண்டனையை நிறைவேற்றத் தொடங்குவதில் சாட்சிகளுக்குள்ள முன்னுரிமையைத் தெளிவாகக் காட்டுகிறது.
- source_word: לַהֲמִיתוֹ
  choice: அவனைக் கொல்வதற்கு
  rationale: מות என்பதன் ஹிஃபில் வினைவடிவம் ‘இறக்கச் செய்தல்’ என்று பொருள்படும்; இங்குள்ள நீதித்துறைச் சூழலில் இது மரணதண்டனையை நிறைவேற்றுவதைக் குறிக்கிறது.
- source_word: וְיַד כָּל הָעָם
  choice: பின்னர் மக்கள் அனைவரின் கையும்
  rationale: சாட்சிகளுக்குப் பின் சமூகமெங்கும் தண்டனையை நிறைவேற்றுவதில் பங்கேற்பதை, மூலத்தின் இணையான வாக்கிய அமைப்புடன் காட்டுகிறது.
- source_word: בָאַחֲרֹנָה
  choice: பின்னர்
  rationale: ‘முதலில்’ என்பதற்கு இணையான தொடர்ச்சியை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: וּבִעַרְתָּ
  choice: அகற்றிவிட வேண்டும்
  rationale: உபாகமச் சட்ட மரபுத்தொடரில் בער என்பது இங்கு நேரடியாக எரிப்பதைக் குறிக்காமல், சமூகத்திலிருந்து தீமையை முற்றிலும் நீக்குவதைக் குறிக்கிறது.
- source_word: הָרָע
  choice: தீமை
  rationale: குற்றவாளியை மட்டும் என்று குறுக்காமல், குற்றத்திலும் அதைச் சகித்துக்கொள்வதிலும் வெளிப்படும் தீமையைச் சுட்டும் மூலத்தின் பரந்த, மரபுவழிப் பொருளைக் காக்கிறது.
- source_word: מִקִּרְבֶּךָ
  choice: உன் நடுவிலிருந்து
  rationale: உடன்படிக்கைச் சமூகத்தின் மத்தியிலிருந்து என்பதைக் காட்டும் எபிரெய மரபுத்தொடரைத் தன்மை ஒருமையுடன் காக்கிறது.
theological_decisions:
- issue: וּבִעַרְתָּ הָרָע מִקִּרְבֶּךָ என்ற உபாகமச் சட்ட மரபுத்தொடரின் பொருள்
  choice: இவ்வாறு உன் நடுவிலிருந்து தீமையை அகற்றிவிட வேண்டும்
  alternative: இவ்வாறு உங்களிடையிலிருந்து தீயவனை அகற்றிவிட வேண்டும்
  rationale: எபிரெய உரை நேரடியாக ‘தீமை’ என்று கூறுகிறது; ‘தீயவன்’ என்று மாற்றுவது அதன் பரந்த சட்ட மற்றும் உடன்படிக்கைச் சார்ந்த வலிமையைத் தேவையின்றிக் குறுக்கும். தன்மை ஒருமை வடிவமும் காக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சட்டச் சூழலுக்கேற்ற கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘கை’ என்ற மூல உருவகம் தெளிவூட்டும் அடிக்குறிப்புடன் காக்கப்பட்டுள்ளது; சமூகத்தை ஒருமையில் அழைக்கும் எபிரெய ‘உன்’ வடிவமும் மொழிபெயர்ப்பில் நிலைநிறுத்தப்பட்டுள்ளது.
