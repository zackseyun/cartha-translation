base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/017/009.yaml
  text: And you shall come to the Levitical priests and to the judge who is in office in those days[a], and you shall inquire, and they shall declare to you the decision in the case.
translation:
  language: ta
  text: லேவிய ஆசாரியர்களிடமும், அந்தக் காலத்தில் பணியாற்றும் நீதிபதியிடமும் நீ சென்று விசாரிக்க வேண்டும்; அவர்கள் அந்த வழக்குக்கான நீதித் தீர்ப்பை உனக்கு அறிவிப்பார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லுக்குச் சொல் மொழிபெயர்த்தால், “நியாயத்தீர்ப்பின் சொல்.” இந்த எபிரெயச் சொற்றொடர் அதிகாரப்பூர்வமான நீதித்துறைத் தீர்ப்பைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָאתָ
  choice: நீ சென்று
  rationale: சட்ட அறிவுறுத்தலில் இணைப்புடன் வரும் வினை கட்டளைப் பொருளைத் தருகிறது. அதிகாரம்பெற்ற நீதிமன்றத்தை அணுகுவதைக் குறிக்க இயல்பான தமிழில் ‘சென்று’ என மொழிபெயர்க்கப்பட்டது.
- source_word: הַכֹּהֲנִים הַלְוִיִּם
  choice: லேவிய ஆசாரியர்கள்
  rationale: ஆசாரியர்கள் லேவி கோத்திரத்தைச் சேர்ந்தவர்கள் என்பதை இணைநிலைச் சொற்றொடர் அடையாளப்படுத்துகிறது; எல்லா லேவியர்களும் ஆசாரியர்கள் என்ற பொருளை இது தராது.
- source_word: הַשֹּׁפֵט
  choice: நீதிபதி
  rationale: நீதித்துறை அதிகாரியைக் குறிக்கும் நேரடியான, நவீனத் தமிழ்ச் சொல்.
- source_word: אֲשֶׁר יִהְיֶה בַּיָּמִים הָהֵם
  choice: அந்தக் காலத்தில் பணியாற்றும்
  rationale: குறிப்பிட்ட நபரைக் காட்டிலும் அப்போது பதவியில் இருந்து பணியாற்றும் அதிகாரியைக் குறிக்கிறது; மூலத்தின் காலச்சார்பை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וְדָרַשְׁתָּ
  choice: விசாரிக்க வேண்டும்
  rationale: இந்த நீதித்துறைச் சூழலில் அதிகாரப்பூர்வமான வழிகாட்டலையோ தீர்ப்பையோ கேட்டறிவதைக் குறிக்கிறது.
- source_word: וְהִגִּידוּ לְךָ
  choice: உனக்கு அறிவிப்பார்கள்
  rationale: அதிகாரப்பூர்வத் தீர்ப்பை முறையாகத் தெரிவிக்கும் பொருளை dignified modern Tamil-இல் வெளிப்படுத்துகிறது.
- source_word: דְּבַר הַמִּשְׁפָּט
  choice: அந்த வழக்குக்கான நீதித் தீர்ப்பு
  rationale: சொல்லர்த்தமாக ‘நியாயத்தீர்ப்பின் சொல்/விவகாரம்’; சூழலில் அதிகாரப்பூர்வமான நீதித்துறை முடிவைக் குறிக்கிறது. ‘நீதித் தீர்ப்பு’ மூலத்தின் משפט கூறைத் தெளிவாக வைத்திருக்கிறது.
