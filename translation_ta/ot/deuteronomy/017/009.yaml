revisions:
- from: அந்தக் காலத்தில் பணியாற்றும் லேவிய ஆசாரியர்களிடமும் நீதிபதியிடமும் நீ சென்று விசாரிக்க வேண்டும்; அவர்கள் அந்த வழக்குக்கான நீதித் தீர்ப்பை உனக்கு அறிவிப்பார்கள்.[a]
