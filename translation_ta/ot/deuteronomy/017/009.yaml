translation_notes:
  register: நவீன நிலையான தமிழில், சட்ட உரைக்கேற்ற கண்ணியமான ஆனால் எளிதில் புரியும் நடையில் வடிவமைக்கப்பட்டது. ஒருமை இரண்டாம் நபர் ‘நீ/உனக்கு’ மூலத்தின் இலக்கண எண்ணைப் பாதுகாக்கிறது; பன்மை எழுவாயான ஆசாரியர்களும் நீதிபதியும் சேர்ந்து ‘அவர்கள்’ எனத் தொடர்கின்றனர்.
