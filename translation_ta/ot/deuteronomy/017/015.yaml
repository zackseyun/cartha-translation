base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/017/015.yaml
  text: You shall surely set over yourself a king whom Yahweh your God chooses[a]. From among your brothers you shall set a king over yourself; you may not put over yourself a foreigner[b], one who is not your brother.
translation:
  language: ta
  text: உன் கடவுளாகிய யாவே தேர்ந்தெடுக்கும் ஒருவனை நீ உன்மேல் அரசனாக நிச்சயமாக நியமிக்க வேண்டும். உன் சகோதரர்களின் நடுவிலிருந்து[a] ஒருவனை உன்மேல் அரசனாக நியமிக்க வேண்டும்; உன் சகோதரன் அல்லாத அந்நியனான ஒருவனை[b] உன்மேல் நியமிக்க உனக்கு அனுமதி இல்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “சகோதரர்கள்” என்பது இங்கு உறவுமுறை மொழியில் இஸ்ரவேல் மக்களில் ஒருவரை, அதாவது உன் சொந்த மக்களில் ஒருவரைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில் சொல்லுக்குச் சொல், “அந்நிய மனிதன்—உன் சகோதரன் அல்லாத ஒருவன்” என்று உள்ளது.
    reason: alternative_reading
lexical_decisions:
- source_word: שׂוֹם תָּשִׂים
  choice: நிச்சயமாக நியமிக்க வேண்டும்
  rationale: வினையெச்ச முழுவடிவமும் முற்றுவினையும் இணைந்த எபிரெய வலியுறுத்தலை இயல்பான நவீனத் தமிழில் கட்டளையின் உறுதியுடன் வெளிப்படுத்துகிறது.
- source_word: עָלֶיךָ
  choice: உன்மேல்
  rationale: இஸ்ரவேல் தன்னையே ஆள ஒருவரை ஏற்படுத்தும் பொருளையும், வசனத்தில் மீண்டும் வரும் ஒருமை முன்னிலையையும் காக்கிறது.
- source_word: מֶלֶךְ
  choice: அரசன்
  rationale: ஆண் அரசப் பதவியைக் குறிக்கும் எபிரெயச் சொல்லின் நேரடியான, வழக்கமான தமிழாக்கம்.
- source_word: אֲשֶׁר יִבְחַר יְהוָה אֱלֹהֶיךָ בּוֹ
  choice: உன் கடவுளாகிய யாவே தேர்ந்தெடுக்கும் ஒருவனையே
  rationale: தேர்ந்தெடுக்கப்பட வேண்டிய அரசனை யாவே தீர்மானிக்கிறார் என்பதைக் காட்டுகிறது; ‘ஒருவனையே’ என்பது בּוֹ மற்றும் கட்டளையின் வரையறுக்கும் வலிமையை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைத் திருப்பெயரை ஒரு பட்டப்பெயராக மாற்றாமல், தமிழில் ஏற்ற ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: מִקֶּרֶב אַחֶיךָ
  choice: உன் சகோதரர்களின் நடுவிலிருந்து
  rationale: ‘உன் சகோதரர்களின் நடுவிலிருந்து’ என்ற உறவுமுறை மொழியையும் மூலத்தின் உருவகத்தையும் காக்கிறது.
- source_word: לֹא תוּכַל לָתֵת
  choice: நியமிக்க உனக்கு அனுமதி இல்லை
  rationale: சொல்லுக்குச் சொல் ‘உன்னால் நியமிக்க முடியாது’ என்றாலும், சட்டச் சூழலில் இது இயலாமையை விடத் தடையைச் சுட்டுவதால் தமிழில் அனுமதி மறுப்பாக வழங்கப்படுகிறது.
- source_word: אִישׁ נָכְרִי
  choice: அந்நியன் ஒருவனை
  rationale: அரசப் பதவிக்குரிய தனிப்பட்ட ஆண் நபரைக் குறிப்பதோடு, சொந்த மக்களுக்குப் புறம்பானவர் என்ற வேறுபாட்டையும் இயல்பான தமிழில் காக்கிறது.
- source_word: אֲשֶׁר לֹא אָחִיךָ הוּא
  choice: உன் சகோதரன் அல்லாத
  rationale: ‘அந்நியன்’ என்பதை உடன்படிக்கைச் சமூகத்தின் உறவுமுறை மொழியில் விளக்கும் மூலவாக்கியத்தைச் சுருக்கமின்றிக் காக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற உடன்படிக்கைப் பெயரின் தமிழாக்கம்
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூலத்தில் இறைவனின் தனிப்பெயர் நேரடியாக இருப்பதால், அதை ஒரு பட்டப்பெயரால் மாற்றாமல் ஒலிபெயர்க்கிறது.
- issue: אַחֶיךָ / אָחִיךָ என்ற பாலினம் குறித்த உறவுமுறை மொழி
  choice: சகோதரர்கள் / சகோதரன்
  alternative: சக இஸ்ரவேலர் / உன் சொந்த மக்களில் ஒருவன்
  rationale: அரசனாக நியமிக்கப்பட வேண்டிய ஆண் உறுப்பினரைப் பற்றிய மூலத்தின் உறவுமுறைச் சொல்லாட்சியைத் தக்கவைக்கிறது; அதன் சமூகப் பொருள் அடிக்குறிப்பில் தெளிவுபடுத்தப்படுகிறது.
- issue: לֹא תוּכַל என்பதன் சட்ட வலிமை
  choice: அனுமதி இல்லை
  alternative: உன்னால் முடியாது
  rationale: இச்சட்டப் பகுதியில் இது உடல் அல்லது நடைமுறை இயலாமையை அல்ல, நியமிப்பதற்கான தடையை வெளிப்படுத்துகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சட்டக் கட்டளைக்குரிய கண்ணியமும் உறுதியும் பேணப்பட்டுள்ளன. ஒருமை முன்னிலை ‘உன்/நீ’ மூலம் மக்கள் முழுவதையும் பிரதிநிதித்துவப்படுத்தும் மூலத்தின் இலக்கண அமைப்பு தக்கவைக்கப்பட்டுள்ளது; தேவையற்ற சமயப் பிரிவுச் சொற்கள் தவிர்க்கப்பட்டுள்ளன.
