source:
  edition: WLC
  text: עַל פִּ֨י הַ/תּוֹרָ֜ה אֲשֶׁ֣ר יוֹר֗וּ/ךָ וְ/עַל הַ/מִּשְׁפָּ֛ט אֲשֶׁר יֹאמְר֥וּ לְ/ךָ֖ תַּעֲשֶׂ֑ה לֹ֣א תָס֗וּר מִן הַ/דָּבָ֛ר אֲשֶׁר יַגִּ֥ידֽוּ לְ/ךָ֖ יָמִ֥ין וּ/שְׂמֹֽאל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/017/011.yaml
  text: According to the instruction that they give you[a], and according to the judgment that they tell you, you shall do; you shall not turn aside from the word that they declare to you[b], to the right or to the left.
translation:
  language: ta
  text: அவர்கள் உனக்கு அளிக்கும் அறிவுறுத்தலின்படியும்[a], அவர்கள் உனக்குச் சொல்லும் தீர்ப்பின்படியும் நீ செய்ய வேண்டும்; அவர்கள் உனக்கு அறிவிக்கும் வார்த்தையிலிருந்து[b] வலப்புறமோ இடப்புறமோ விலகாதே.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '‘அறிவுறுத்தல்’ என்பதற்கு ‘சட்டம்’ அல்லது ‘போதனை’ என்றும் மொழிபெயர்க்கலாம் (எபிரேய மொழியில்: தோரா).'
    reason: lexical_alternative
  - marker: b
    text: ‘வார்த்தை’ என்பதற்கு ‘விவகாரம்’ அல்லது ‘தீர்ப்பு’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל פִּי
  choice: …இன்படியும்
  rationale: ‘இதன்படி/இதற்கேற்ப’ என்ற எபிரெயச் சட்டவழக்கின் பொருளை இயல்பான தமிழில் தருகிறது; ‘வாயின்படி’ என்ற சொல்லுக்கு சொல் மொழிபெயர்ப்பைத் தவிர்க்கிறது.
- source_word: הַתּוֹרָה
  choice: போதனை
  rationale: תּוֹרָה என்பதன் அடிப்படைப் பொருளான போதனை அல்லது வழிகாட்டுதலைக் காக்கிறது; இச்சூழலில் அதைச் சட்டத் தொகுப்பாக மட்டும் குறுக்கிவிடவில்லை.
- source_word: אֲשֶׁר יוֹרוּךָ
  choice: அவர்கள் உனக்கு அளிக்கும்
  rationale: ירה என்பதன் ஹிஃபில் வடிவம் இங்கு அறிவுறுத்துதல் அல்லது வழிகாட்டுதல் எனப் பொருள்படும். ‘போதனையை அளிக்கும்’ என்பது தமிழில் இயல்பாகவும் அதிகாரப்பூர்வ வழிகாட்டுதலை உணர்த்துவதாகவும் உள்ளது.
- source_word: הַמִּשְׁפָּט
  choice: தீர்ப்பு
  rationale: நீதித்துறைச் சூழலிலுள்ள அதிகாரப்பூர்வ முடிவைத் தெளிவாகக் குறிக்கிறது.
- source_word: אֲשֶׁר יֹאמְרוּ לְךָ
  choice: அவர்கள் உனக்குச் சொல்லும்
  rationale: אָמַר என்ற பொதுவான ‘சொல்’ வினையின் நேரடியான பொருளையும் தீர்ப்பு தெரிவிக்கப்படுவதையும் இயல்பான தமிழில் காக்கிறது.
- source_word: תַּעֲשֶׂה
  choice: நீ செயல்பட வேண்டும்
  rationale: கடமையை உணர்த்தும் இவ்வினை வடிவத்தின் கட்டளை வலிமையைத் தெளிவான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: לֹא תָסוּר
  choice: விலகாதே
  rationale: סוּר என்பதன் ‘விலகு/திசைமாறு’ என்ற பொருளை, தொடர்ந்து வரும் வலது–இடது உருவகத்துடன் இயல்பாக இணைக்கிறது.
- source_word: הַדָּבָר
  choice: வார்த்தை
  rationale: דָּבָר என்பதிலுள்ள ‘வார்த்தை, விவகாரம், காரியம்’ என்ற பொருள் பரப்பை முற்றிலும் குறுக்காமல், இங்குள்ள அதிகாரப்பூர்வ அறிவிப்பைக் குறிக்கிறது.
- source_word: אֲשֶׁר יַגִּידוּ לְךָ
  choice: அவர்கள் உனக்கு அறிவிக்கும்
  rationale: נגד என்பதன் ஹிஃபில் வடிவத்திலுள்ள அறிவித்தல் அல்லது தெரியப்படுத்துதல் என்ற முறையான பொருளைப் பாதுகாக்கிறது.
- source_word: יָמִין וּשְׂמֹאל
  choice: வலப்புறமோ இடப்புறமோ
  rationale: எந்தத் திசையிலும் வழுவாதிருத்தலைக் குறிக்கும் நிலையான எபிரெய உருவகத்தைத் தமிழில் தெளிவாகக் காக்கிறது.
theological_decisions:
- issue: ஆசாரியர் மற்றும் நீதிபதிகளின் அதிகாரத்துக்குக் கீழ்ப்படிவதன் எல்லை
  choice: குறிப்பிட்ட வழக்கில் வழங்கப்படும் அதிகாரப்பூர்வ போதனைக்கும் தீர்ப்புக்கும் கீழ்ப்படிய வேண்டும் என்ற கட்டளையாக மொழிபெயர்க்கப்பட்டது.
  alternative: பிற்கால மத அமைப்புகள் அனைத்திற்கும் எல்லையற்ற அல்லது தவறாத அதிகாரம் உண்டு என்று வாசித்தல்.
  rationale: இந்த வசனம் இஸ்ரவேலின் உடன்படிக்கை சார்ந்த நீதித்துறை நடைமுறையைப் பற்றியது. சூழலில் உள்ள கீழ்ப்படிதலின் வலிமை காக்கப்படுகிறது; ஆனால் எபிரெய உரை கூறாத பிற்காலத் திருச்சபை அதிகாரக் கோட்பாடு சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், நீதித்துறைச் சூழலுக்கேற்ற கண்ணியமான மற்றும் தெளிவான நடை பயன்படுத்தப்பட்டுள்ளது. ஒருமை இரண்டாம் நபருக்கான ‘உனக்கு/நீ/விலகாதே’ வடிவங்கள் எபிரெய மூலத்துடன் ஒத்திருக்கின்றன. இணை அமைப்பும் வலது–இடது உருவகமும் பாதுகாக்கப்பட்டுள்ளன.
