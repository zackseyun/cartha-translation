  source_fidelity: 'கருத்து நம்பகமாக உள்ளது: עַל־פִּי-யின் ‘...இன்படி’, תּוֹרָה-வின் அதிகாரப்பூர்வ அறிவுறுத்தல், מִשְׁפָּט-வின் தீர்ப்பு, மற்றும் வலது–இடது விலகல் உருவகம் அனைத்தும் பாதுகாக்கப்பட்டுள்ளன. இருப்பினும் ‘போதனை’ என்பதற்குப் பதில் ‘அறிவுறுத்தல்’ என்பது இவ்வழக்காடல் சூழலில் תּוֹרָה-வின் வழிகாட்டும்/நெறிப்படுத்தும் பொருளை இன்னும் துல்லியமாகக் காட்டுகிறது.'
  naturalness: திருத்தப்பட்ட வாசகம் நவீனத் தரத் தமிழில் இயல்பான சட்டப்பாங்குடன் அமைகிறது. ‘நீ செய்ய வேண்டும்’ கட்டளையின் கடமை வலிமையைத் தக்கவைக்கிறது; ‘விலகாதே’ நேரடியான இரண்டாம் நபர் ஒருமைத் தடை வடிவமாகத் தொடர்கிறது.
