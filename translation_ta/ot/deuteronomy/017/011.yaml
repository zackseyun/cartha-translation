revisions:
- from: அவர்கள் உனக்கு அளிக்கும் போதனையின்படியும்[a], அவர்கள் உனக்குச் சொல்லும் தீர்ப்பின்படியும் நீ செயல்பட வேண்டும்; அவர்கள் உனக்கு அறிவிக்கும் வார்த்தையிலிருந்து[b] வலப்புறமோ இடப்புறமோ விலகாதே.
  to: அவர்கள் உனக்கு அளிக்கும் அறிவுறுத்தலின்படியும்[a], அவர்கள் உனக்குச் சொல்லும் தீர்ப்பின்படியும் நீ செய்ய வேண்டும்; அவர்கள் உனக்கு அறிவிக்கும் வார்த்தையிலிருந்து[b] வலப்புறமோ இடப்புறமோ விலகாதே.
  rationale: இந்தச் சிறிய திருத்தம் תּוֹרָה-வை ‘சட்டம்’ என்று மிகக் குறுக்காமல், இவ்வசனத்தின் நீதித்துறைச் சூழலுக்குரிய கட்டாயமான அறிவுறுத்தலாகத் தெளிவுபடுத்துகிறது. கட்டளையின் வலிமை, அறிவிக்கப்பட்ட தீர்ப்புக்குக் கீழ்ப்படிதல், மற்றும் ‘வலது அல்லது இடது’ என்ற உருவகம் மாற்றமின்றி காக்கப்படுகின்றன. அடிக்குறிப்பு அடையாளங்கள் உரிய இடங்களில் நிலைநிறுத்தப்பட்டுள்ளன.
