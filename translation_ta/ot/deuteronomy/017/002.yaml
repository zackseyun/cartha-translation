  text: If there is found among you[a], within one of your gates that Yahweh your God is giving you, a man or a woman who does what is evil in the eyes of Yahweh your God by transgressing his covenant[b],
translation:
  language: ta
  text: உங்கள் தேவனாகிய யாவே உங்களுக்குக் கொடுக்கிற உங்கள் நகரங்களில் ஒன்றில், உங்கள் நடுவே, உங்கள் தேவனாகிய யாவேயின் பார்வையில் தீமையானதைச் செய்து, யாவேயின் உடன்படிக்கையை மீறி வாழும் ஒரு ஆணோ பெண்ணோ காணப்பட்டால்—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי יִמָּצֵא
  choice: காணப்பட்டால்
  rationale: நிபந்தனைச் சட்டவாக்கியத்தை இயல்பான தமிழில் காட்டுகிறது; נִפעל வடிவின் செயல்படுபொருள் மறைந்த தன்மையையும் காக்கிறது.
- source_word: בְקִרְבְּךָ
  choice: உங்கள் நடுவே
  rationale: உடன்படிக்கைச் சமூகத்திற்குள் ஒருவர் இருப்பதைக் குறிக்கும் எபிரெயச் சொல்லாட்சியைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: בְאַחַד שְׁעָרֶיךָ
  choice: பட்டணங்களில் ஒன்றில்[a]
  rationale: ‘வாசல்களில் ஒன்றில்’ என்பது சொற்பொருள்; உபாகமத்தில் ‘வாசல்கள்’ என்பது பெரும்பாலும் அவற்றைச் சார்ந்த பட்டணங்களை ஆகுபெயராகக் குறிக்கிறது. பிரதான உரையில் இயல்பான பொருள் தரப்பட்டு, சொற்பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: אֲשֶׁר יְהוָה אֱלֹהֶיךָ נֹתֵן לָךְ
  choice: உங்கள் தேவனாகிய யாவே உங்களுக்குக் கொடுக்கிற
  rationale: நிகழ்காலப் பங்கேற்புவினையின் தொடர்ச்சியான கொடுக்கும் செயலைக் காக்கிறது; יהוה என்ற தனிப்பெயர் ‘யாவே’ என ஒலிபெயர்க்கப்படுகிறது.
- source_word: אִישׁ אוֹ אִשָּׁה
  choice: ஓர் ஆணோ பெண்ணோ
  rationale: மூலத்தில் வெளிப்படையாக உள்ள ஆண்–பெண் இணைப்பைச் சுருக்காமல் இயல்பான தமிழில் தருகிறது.
- source_word: אֲשֶׁר יַעֲשֶׂה אֶת הָרַע
  choice: தீமையானதைச் செய்து
  rationale: ‘தீமையைச் செய்தல்’ என்ற எபிரெய மொழிமரபின் அறநெறி வலிமையைத் தெளிவான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: בְעֵינֵי יְהוָה אֱלֹהֶיךָ
  choice: உங்கள் தேவனாகிய யாவேயின் பார்வையில்
  rationale: ‘கண்களில்’ என்ற மூல உருவகத்தின் மதிப்பீட்டுப் பொருளை இயல்பான தமிழ் வழக்கில் தருகிறது.
- source_word: לַעֲבֹר בְּרִיתוֹ
  choice: அவருடைய உடன்படிக்கையை மீறியிருந்தால்[b]
  rationale: עבר என்பதன் உடன்படிக்கை மீறல் பொருளைக் காக்கிறது. நிபந்தனை வாக்கியத்தோடு இயல்பாக இணைத்து, தீய செயல் உடன்படிக்கை மீறலாக இருப்பதை வெளிப்படுத்துகிறது.
theological_decisions:
- issue: உடன்படிக்கை மீறலின் தன்மை
  choice: ‘அவருடைய உடன்படிக்கையை மீறியிருந்தால்’ என்று பொதுவாக மொழிபெயர்த்தல்
  alternative: ‘அவருடைய உடன்படிக்கையை உடைத்திருந்தால்’ அல்லது ‘அவருடைய உடன்படிக்கையை மீறும் விதத்தில்’
  rationale: இந்த வசனம் எந்தக் குறிப்பிட்ட கட்டளை மீறப்பட்டது என்பதை இன்னும் கூறவில்லை; அடுத்த வசனம் குற்றத்தை விளக்குகிறது. ஆகவே இங்கே உள்ள பொதுவான உடன்படிக்கைச் சொல்லாட்சி மேலதிக இறையியல் விளக்கமின்றிப் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சட்டவாக்கியத்தின் நிபந்தனைத் தொனியையும் வசனம் அடுத்த வசனத்துக்குத் தொடரும் நிறைவுறாத அமைப்பையும் நீள்கோடுகள் மூலம் காக்கிறது. ஒருமை ஆண்பால் இரண்டாம் நபரைத் தமிழில் இயல்பான மரியாதை/பொதுப் பன்மையான ‘உங்கள்’ வடிவில் வழங்குகிறது.
