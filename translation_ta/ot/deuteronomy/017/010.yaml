source:
  edition: WLC
  text: וְ/עָשִׂ֗יתָ עַל פִּ֤י הַ/דָּבָר֙ אֲשֶׁ֣ר יַגִּ֣ידֽוּ לְ/ךָ֔ מִן הַ/מָּק֣וֹם הַ/ה֔וּא אֲשֶׁ֖ר יִבְחַ֣ר יְהוָ֑ה וְ/שָׁמַרְתָּ֣ לַ/עֲשׂ֔וֹת כְּ/כֹ֖ל אֲשֶׁ֥ר יוֹרֽוּ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/017/010.yaml
  text: You shall act according to the word that they declare to you from that place which Yahweh will choose[a], and you shall be careful to do according to all that they instruct you.
translation:
  language: ta
  text: 'யாவே தேர்ந்தெடுக்கும் அந்த இடத்திலிருந்து அவர்கள் உனக்கு அறிவிக்கும் சொல்லின்படி[a] நீ செயல்பட வேண்டும்; அவர்கள் உனக்கு அறிவுறுத்தும் அனைத்தின்படியும் செய்யக் கவனமாக இரு.


    [a] “அவர்கள் உனக்கு அறிவிக்கும் தீர்ப்பின்படி” என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் דָּבָר (தாவார்) என்பது “சொல்,” “விவகாரம்,” அல்லது நீதித்துறைச் சூழலில் “தீர்ப்பு” என்று பொருள்படலாம்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அவர்கள் உனக்கு அறிவிக்கும் தீர்ப்பின்படி” என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் דָּבָר (தாவார்) என்பது “சொல்,” “விவகாரம்,” அல்லது நீதித்துறைச் சூழலில் “தீர்ப்பு” என்று பொருள்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: நீ செயல்பட வேண்டும்
  rationale: עשה என்பது ‘செய்/செயல்படு’ என்ற பரந்த பொருளுடையது. இங்கு அதிகாரபூர்வ அறிவிப்பின்படி நடப்பதைக் குறிப்பதால், இயல்பான தமிழில் ‘செயல்பட வேண்டும்’ என வழங்கப்பட்டது.
- source_word: עַל פִּי הַדָּבָר
  choice: சொல்லின்படி
  rationale: עַל־פִּי என்பது ‘அதன்படி/அதன் அதிகாரத்தின் அடிப்படையில்’ என்றும், דָּבָר என்பது ‘சொல், விவகாரம், தீர்ப்பு’ என்றும் பொருள்படலாம். எபிரெய உருவகத்தை முதன்மை உரையில் காத்து, நீதித்துறைப் பொருளான ‘தீர்ப்பு’ அடிக்குறிப்பில் தரப்பட்டது.
- source_word: יַגִּידוּ לְךָ
  choice: அவர்கள் உனக்கு அறிவிக்கும்
  rationale: נגד என்பதன் ஹிப்ஃபில் வடிவம் அதிகாரபூர்வமாக அறிவித்தல் அல்லது தெரியப்படுத்துதல் என்ற பொருளைத் தருகிறது; ‘அறிவிக்கும்’ என்பது இச்சூழலுக்குப் பொருத்தமான நவீனத் தமிழ்.
- source_word: מִן הַמָּקוֹם הַהוּא אֲשֶׁר יִבְחַר יְהוָה
  choice: யாவே தேர்ந்தெடுக்கும் அந்த இடத்திலிருந்து
  rationale: மைய வழிபாட்டு இடத்தையும், உபாகமத்தின் எதிர்நோக்கிய சூழலில் יִבְחַר குறிக்கும் எதிர்காலச் செயலையும் காக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: திருநான்கெழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் பரவலாகப் புரிந்துகொள்ளத்தக்க ஒலிபெயர்ப்பாக ‘யாவே’ வழங்கப்பட்டது.
- source_word: וְשָׁמַרְתָּ לַעֲשׂוֹת
  choice: செய்யக் கவனமாக இரு
  rationale: שׁמר + வினையெச்சம் கவனமான கடைப்பிடிப்பைக் குறிக்கிறது. ‘செய்யக் கவனமாக இரு’ அதன் கட்டளை வலிமையையும் இயல்பான தமிழையும் காக்கிறது.
- source_word: כְּכֹל אֲשֶׁר
  choice: அனைத்தின்படியும்
  rationale: கொடுக்கப்படும் அறிவுறுத்தலின் எல்லா கூறுகளுக்கும் முழுமையாக இணங்க வேண்டும் என்ற விரிவைச் சுருக்கமாக வெளிப்படுத்துகிறது.
- source_word: יוֹרוּךָ
  choice: அவர்கள் உனக்கு அறிவுறுத்தும்
  rationale: ירה என்பதன் ஹிப்ஃபில் வடிவம் சட்டம் சார்ந்த சூழலில் ‘கற்பி, அறிவுறுத்து, வழிகாட்டு’ என்று பொருள்படும். அதிகாரமிக்க சட்ட வழிகாட்டுதலை ‘அறிவுறுத்தும்’ தெளிவாகக் காட்டுகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரை வழங்குதல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூல உரை தனிப்பட்ட உடன்படிக்கைப் பெயரான יְהוָה என்பதை நேரடியாகப் பயன்படுத்துகிறது. அந்தப் பெயரைப் பட்டத்தால் மாற்றாமல் ஒலிபெயர்த்து, மூலத்தின் தன்மையைப் பாதுகாக்கிறது.
- issue: דָּבָר என்பதன் நீதித்துறைப் பொருள்
  choice: முதன்மை உரையில் ‘சொல்’; அடிக்குறிப்பில் ‘தீர்ப்பு’
  alternative: முதன்மை உரையிலேயே ‘தீர்ப்பு’
  rationale: இச்சூழலில் ‘தீர்ப்பு’ மிகச் சாத்தியமான பொருளாக இருந்தாலும், דָּבָר என்பதன் பரந்த பொருள் வீச்சையும் எபிரெய உரையின் உண்மையான நெகிழ்வையும் அமைதியாகத் தீர்த்துவிடாமல் காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், ஒருமை இரண்டாம் நபரைத் தொடர்ந்து பயன்படுத்தி, சட்டக் கட்டளையின் கண்ணியமும் அதிகாரமும் காக்கப்பட்டுள்ளன. மிகப் பழமையான அல்லது சமயப் பிரிவுக்கே உரிய சொற்கள் தவிர்க்கப்பட்டுள்ளன.
