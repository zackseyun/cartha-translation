  text: וְ/כָל הָ/עָ֖ם יִשְׁמְע֣וּ וְ/יִרָ֑אוּ וְ/לֹ֥א יְזִיד֖וּ/ן עֽוֹד־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/017/013.yaml
  text: And all the people shall hear and fear[a], and shall not act presumptuously again.
translation:
  language: ta
  text: மக்கள் அனைவரும் கேட்டு அஞ்சுவார்கள்[a]; இனி துணிகரமாகச் செயல்படமாட்டார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பயப்படுவார்கள்.” அச்சம் யாரை அல்லது எதை நோக்கியது என்பதை எபிரெய உரை வெளிப்படையாகக் கூறவில்லை.
    reason: lexical_and_theological_ambiguity
lexical_decisions:
- source_word: וְכָל הָעָם
  choice: அப்போது மக்கள் அனைவரும்
  rationale: எபிரெய உரை ‘மக்கள் அனைவரும்’ என்றே கூறுகிறது; ‘இஸ்ரவேல்’ என்பதை வெளிப்படையாகச் சேர்க்கவில்லை. வாக்கியத் தொடர்பை இயல்பான தமிழில் காட்ட ‘அப்போது’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: יִשְׁמְעוּ
  choice: அதைக் கேட்டு
  rationale: שׁמע என்பதன் அடிப்படைப் பொருள் ‘கேள்’. முந்தைய தீர்ப்பைப் பற்றிய செய்தியை மக்கள் கேட்பார்கள் என்பது சூழலில் தெளிவாக இருப்பதால், தமிழில் இயல்பாக ‘அதைக் கேட்டு’ என வழங்கப்பட்டுள்ளது.
- source_word: וְיִרָאוּ
  choice: அஞ்சுவார்கள்
  rationale: ירא இங்கு நீதித்தீர்ப்பினால் உண்டாகும் அச்சத்தைக் குறிக்கிறது. அச்சம் கடவுளைப் பற்றியதா, தண்டனையைப் பற்றியதா என்று மூல உரை குறிப்பிடாததால், பொருள் வரையறுக்கப்படாமல் விடப்பட்டுள்ளது.
- source_word: וְלֹא יְזִידוּן
  choice: துணிகரமாகச் செயல்படமாட்டார்கள்
  rationale: זיד என்பதன் ஹிஃபீல் வடிவம் மனமறிந்த செருக்கான, அதிகாரத்தை மீறும் துணிகரச் செயலைக் குறிக்கிறது. வெறும் பெருமையைவிட திட்டமிட்ட கீழ்ப்படியாமையை ‘துணிகரமாகச் செயல்படுதல்’ நன்கு வெளிப்படுத்துகிறது.
- source_word: עוֹד
  choice: இனி
  rationale: עוֹד இங்கு அந்தச் செயல் தொடர்ந்து அல்லது மறுபடியும் நடைபெறாததைக் குறிக்கிறது; ‘இனி’ என்பது தெளிவான, இயல்பான நவீனத் தமிழ் வழக்கு.
theological_decisions:
- issue: நீதித்தீர்ப்பால் உண்டாகும் அச்சத்தின் தன்மை
  choice: ‘அஞ்சுவார்கள்’ என்று மட்டும் கூறி அச்சத்தின் இலக்கைத் தீர்மானிக்காமல் வைத்தல்
  alternative: ‘கர்த்தருக்கு அஞ்சுவார்கள்’ அல்லது ‘தண்டனைக்கு அஞ்சுவார்கள்’
  rationale: எபிரெய உரையில் ‘அஞ்சுதல்’ என்பதற்கு வெளிப்படையான இலக்கு இல்லை. அது கடவுளைப் பற்றிய அச்சமா, நீதித் தண்டனையைப் பற்றிய அச்சமா, இரண்டுமா என்ற தெளிவின்மையை மொழிபெயர்ப்பு பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சட்டச் சூழலுக்கேற்ற கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. ‘துணிகரமாக’ என்பது செருக்குடன் அதிகாரத்தை வேண்டுமென்றே மீறும் செயலைக் குறிக்கிறது.
