revisions:
- from: அவன் சென்று, வேறு தெய்வங்களுக்குப் பணிவிடை செய்து, அவற்றுக்கோ சூரியனுக்கோ சந்திரனுக்கோ வானப் படைகள் அனைத்துக்குமோ[a] முன்பாகப் பணிந்து வணங்கினால்—அதை நான் கட்டளையிடவில்லை[b]—
  to: அவன் சென்று, வேறு தெய்வங்களுக்குப் பணிவிடை செய்து, அவற்றுக்கு முன்பாகப் பணிந்து வணங்கினால், அல்லது சூரியனுக்கோ சந்திரனுக்கோ வானத்தின் படைகள் அனைத்துக்குமோ முன்பாகப் பணிந்து வணங்கினால்—அதை நான் கட்டளையிடவில்லை[b]—
  rationale: The bowing construction has been recast for natural Tamil and for clearer alignment with the Hebrew disjunction, while preserving the distinction between cultic service and the physical act of prostration. “வானத்தின் படைகள்” improves idiomatic clarity. The final clause continues to use a deliberately broad demonstrative, and its two viable scopes remain documented in the footnote.
