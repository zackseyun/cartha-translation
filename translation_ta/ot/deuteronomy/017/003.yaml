  yaml_path: translation/ot/deuteronomy/017/003.yaml
  text: and goes and serves other gods and bows down to them[a], or to the sun or to the moon or to all the host of heaven, which I have not commanded[b],
translation:
  language: ta
  text: அவன் சென்று, வேறு தெய்வங்களுக்குப் பணிவிடை செய்து, அவற்றுக்கு முன்பாகப் பணிந்து வணங்கினால், அல்லது சூரியனுக்கோ சந்திரனுக்கோ வானத்தின் படைகள் அனைத்துக்குமோ முன்பாகப் பணிந்து வணங்கினால்—அதை நான் கட்டளையிடவில்லை[b]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: “அதை நான் கட்டளையிடவில்லை” என்பது குறிப்பாக “வானத்தின் படைகள் அனைத்தையும்” குறிக்கலாம்; அல்லது இங்கு விவரிக்கப்பட்ட வேறு தெய்வங்களை வழிபடும் செயல் முழுவதையும் குறிக்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: அவன் சென்று
  rationale: சட்ட நிபந்தனையின் தொடர்ச்சியாக வரும் எபிரெய வினையை, முந்தைய வசனத்தோடு இயல்பாக இணையும் நிபந்தனைத் தொடராக மொழிபெயர்க்கிறது.
- source_word: וַיַּעֲבֹד
  choice: பணிவிடை செய்து
  rationale: தெய்வங்களுக்குச் செய்யப்படும் வழிபாட்டுச் சேவையைச் சுட்டுகிறது; அடுத்து வரும் பணிந்து வணங்குதல் என்ற உடல் செய்கையிலிருந்து இதை வேறுபடுத்தியும் காட்டுகிறது.
- source_word: אֱלֹהִים אֲחֵרִים
  choice: வேறு தெய்வங்கள்
  rationale: ‘அந்நிய தெய்வங்கள்’ என்று இன அல்லது நாட்டுச் சார்பைச் சேர்க்காமல், எபிரெய மொழியின் நேரடியான பொருளைப் பாதுகாக்கிறது.
- source_word: וַיִּשְׁתַּחוּ לָהֶם
  choice: அவற்றுக்கு முன்பாகப் பணிந்து வணங்கினால்
  rationale: வினைச்சொல் குறிக்கும் குனிந்து அல்லது தாழ விழுந்து வணங்கும் உடல் செய்கையைத் தெளிவாகக் காட்டுகிறது.
- source_word: וְלַשֶּׁמֶשׁ ... לַיָּרֵחַ
  choice: சூரியனுக்கோ சந்திரனுக்கோ
  rationale: தொடர்ந்து வரும் אוֹ...אוֹ என்ற மாற்றுத் தொடரின் இயல்பான தமிழாக்கம்.
- source_word: לְכָל צְבָא הַשָּׁמַיִם
  choice: வானப் படைகள் அனைத்துக்கும்
  rationale: צְבָא என்பதன் கூட்டுத் தொகுதி மற்றும் ‘படை’ உருவகத்தைப் பாதுகாத்து, விண்பொருட்களா வானுலக உயிர்களா என்பதை உரையிலேயே அளவுக்கு மீறித் தீர்மானிப்பதைத் தவிர்க்கிறது.
- source_word: אֲשֶׁר לֹא צִוִּיתִי
  choice: அதை நான் கட்டளையிடவில்லை
  rationale: ‘தடைசெய்தேன்’ என்று மூலத்தில் இல்லாத வினையைச் சேர்க்காமல், தெய்வீகக் கட்டளை இல்லை என்பதையே நேரடியாகக் கூறுகிறது.
theological_decisions:
- issue: אֲשֶׁר לֹא צִוִּיתִי என்ற இறுதி சார்பு வாக்கியத்தின் தொடர்பெல்லை
  choice: ‘அதை நான் கட்டளையிடவில்லை’ என்று மொழிபெயர்த்து, சுட்டுப்பெயரின் தொடர்பை அளவுக்கு மீறித் துல்லியப்படுத்தாமல் வைத்தல்
  alternative: இது உடனடியாக முந்திய ‘வானப் படைகள் அனைத்தையும்’ மட்டும் குறிக்கலாம்; அல்லது விவரிக்கப்பட்ட பிறதெய்வ வழிபாட்டுச் செயல் முழுவதையும் குறிக்கலாம்.
  rationale: எபிரெய தொடரமைப்பு அருகிலுள்ள பெயர்த்தொடருடன் இணைவதற்கும், சூழலில் முழுச் செயலையும் மறுப்பதற்கும் இடமளிக்கிறது. அடிக்குறிப்பு இரு வாசிப்புகளையும் வெளிப்படையாகப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், சட்ட நிபந்தனையின் தொடர்ச்சியைத் தக்கவைக்கும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘பணிவிடை செய்து’ மற்றும் ‘பணிந்து வணங்கினால்’ என்பவை עבד மற்றும் חוה ஆகிய இரு வேறுபட்ட வழிபாட்டுச் செயல்களையும் தனித்தனியாக வெளிப்படுத்துகின்றன.
