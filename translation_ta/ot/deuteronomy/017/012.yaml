  edition: WLC
  text: וְ/הָ/אִ֞ישׁ אֲשֶׁר יַעֲשֶׂ֣ה בְ/זָד֗וֹן לְ/בִלְתִּ֨י שְׁמֹ֤עַ אֶל הַ/כֹּהֵן֙ הָ/עֹמֵ֞ד לְ/שָׁ֤רֶת שָׁם֙ אֶת יְהוָ֣ה אֱלֹהֶ֔י/ךָ א֖וֹ אֶל הַ/שֹּׁפֵ֑ט וּ/מֵת֙ הָ/אִ֣ישׁ הַ/ה֔וּא וּ/בִֽעַרְתָּ֥ הָ/רָ֖ע מִ/יִּשְׂרָאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/017/012.yaml
  text: But the man who acts presumptuously by not listening to the priest who stands there to minister before Yahweh your God[a], or to the judge—that man shall die[c][b]. So you shall purge the evil from Israel.
translation:
  language: ta
  text: ஆனால், அங்கே உன் கடவுளாகிய யாவேக்குப் பணிவிடை செய்ய நிற்கும் ஆசாரியருக்கோ நீதிபதிக்கோ செவிகொடுக்காமல் ஆணவத்துடன் நடக்கிற அந்த மனிதன் மரிக்க வேண்டும். இவ்வாறு இஸ்ரவேலிலிருந்து தீமையை அகற்றுவாய்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהָאִישׁ
  choice: ஆனால், ... அந்த மனிதன்
  rationale: முந்தைய சட்டவிதியுடன் தொடர்வதையும் அதற்கு மாறாகக் கீழ்ப்படிய மறுக்கும் தனிநபரையும் காட்டுகிறது; ஆண்பால் ஒருமை வடிவம் காக்கப்படுகிறது.
- source_word: יַעֲשֶׂה בְזָדוֹן
  choice: அகந்தையோடு செயல்படுகிற
  rationale: தற்செயலான தவறை அல்ல, தெரிந்தே செய்யும் துணிகரமான எதிர்ப்பை இந்த எபிரெய மொழித்தொடர் குறிக்கிறது.
- source_word: לְבִלְתִּי שְׁמֹעַ
  choice: செவிகொடுக்காமல்
  rationale: שׁמע என்பதன் அடிப்படை கேட்பது என்ற உருவகத்தையும், சட்டச் சூழலில் அதற்குள்ள கீழ்ப்படிதல் என்ற உட்பொருளையும் இயல்பாகத் தக்கவைக்கிறது.
- source_word: אֶל הַכֹּהֵן
  choice: ஆசாரியருக்கு
  rationale: כֹּהֵן என்பதற்கான வழக்கமான, தெளிவான தமிழ் சமயச் சொல்.
- source_word: הָעֹמֵד לְשָׁרֶת שָׁם אֶת יְהוָה אֱלֹהֶיךָ
  choice: அங்கே உன் கடவுளாகிய யாவேக்குப் பணிவிடை செய்ய நிற்கும்
  rationale: ஆசாரியரின் அதிகாரபூர்வ வழிபாட்டுப் பணியையும் שָׁם என்ற ‘அங்கே’ என்பதையும் காக்கிறது; את இங்கு שׁרת வினையின் நேரடிப் பொருளைக் குறிக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: நான்கு எழுத்துத் தெய்வீகப் பெயரை ஒரு பட்டத்தால் மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: אוֹ אֶל הַשֹּׁפֵט
  choice: நீதிபதிக்கோ
  rationale: சட்டத் தீர்ப்பு வழங்கும் அதிகாரியை இயல்பான நவீன தமிழில் குறிக்கிறது.
- source_word: וּמֵת הָאִישׁ הַהוּא
  choice: அந்த மனிதன் கொல்லப்பட வேண்டும்
  rationale: சட்டரீதியான மரணத் தண்டனை விளைவைக் கூறுகிறது; வெறும் இயற்கை மரணமாகத் தவறாகப் புரிந்துகொள்ளப்படுவதைத் தவிர்க்கிறது.
- source_word: וּבִעַרְתָּ הָרָע מִיִּשְׂרָאֵל
  choice: இவ்வாறு இஸ்ரவேலிலிருந்து தீமையை அகற்றுவாய்
  rationale: உடன்படிக்கைச் சட்டத்தில் வரும் நிலையான தீமையை நீக்கும் சூத்திரத்தை தெளிவான தமிழில் வழங்குகிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயர்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் நேரடியாக வரும் உடன்படிக்கைப் பெயரைப் பட்டமாக மாற்றாமல் ஒலிபெயர்த்து வழங்குகிறது.
- issue: குற்றவாளியைக் குறிக்கும் ஆண்பால் ஒருமை
  choice: அந்த மனிதன்
  alternative: அந்த நபர்
  rationale: אִישׁ மற்றும் הָאִישׁ הַהוּא ஆகியவற்றின் ஆண்பால் ஒருமையை மறைக்காமல் காக்கிறது.
- issue: וּמֵת என்பதன் தண்டனைப் பொருள்
  choice: கொல்லப்பட வேண்டும்
  alternative: சாக வேண்டும்
  rationale: சட்டத் தீர்ப்பின் விளைவாக விதிக்கப்படும் மரணத்தைத் தமிழில் தெளிவுபடுத்துகிறது; இது தனிப்பட்ட பழிவாங்கலைக் குறிக்காமல் நீதித்துறைச் சூழலில் நிற்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழ்; சட்டவிதிக்கேற்ற கண்ணியமும் உறுதியும் காக்கப்பட்டுள்ளன. ‘செவிகொடுக்காமல்’ என்பது கேட்க மறுத்தல் மற்றும் கீழ்ப்படிய மறுத்தல் ஆகிய இரு நுணுக்கங்களையும் தக்கவைக்கிறது. தேவையற்ற சமயப்பிரிவு சார்ந்த சொற்கள் சேர்க்கப்படவில்லை.
