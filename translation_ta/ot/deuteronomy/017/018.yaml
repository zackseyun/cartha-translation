  source_fidelity: முதன்மை உரையில் “அந்த நகலை ... எழுத வேண்டும்” என்று இரண்டாவது தனி வாக்கியம் சேர்க்கப்பட்டிருப்பது மூலத்தில் ஒரே வினையாக உள்ள וְכָתַב לוֹ-வை தேவையின்றி இரட்டிப்பாக்குகிறது. மேலும் “முன்னிலையில் உள்ளதிலிருந்து” என்பதற்கு வெளிப்படையான பெயர்ச்சொல் இல்லாததால் எதைச் சுட்டுகிறது என்பது தமிழில் தெளிவற்றதாகிறது. திருத்தம் ஒரே கட்டளை வாக்கியத்தில் எபிரெயத்தின் மִלִּפְנֵי-யின் திறந்த பொருளைத் தக்கவைக்கிறது.
