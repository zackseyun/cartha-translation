  text: וְ/הָיָ֣ה כְ/שִׁבְתּ֔/וֹ עַ֖ל כִּסֵּ֣א מַמְלַכְתּ֑/וֹ וְ/כָ֨תַב ל֜/וֹ אֶת מִשְׁנֵ֨ה הַ/תּוֹרָ֤ה הַ/זֹּאת֙ עַל סֵ֔פֶר מִ/לִּ/פְנֵ֥י הַ/כֹּהֲנִ֖ים הַ/לְוִיִּֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/017/018.yaml
  text: And when he sits on the throne of his kingdom[a], he shall write for himself in a book a copy of this law[b], from before the Levitical priests.
translation:
  language: ta
  text: அவன் தன் அரசாட்சியின் அரியணையில் அமரும்போது, இந்தச் சட்டத்தின் ஒரு நகலைத் தனக்காக ஒரு சுருளில், லேவிய ஆசாரியர்களின் முன்னிலையிலிருந்து[a], எழுதிக்கொள்ள வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயில் சொற்சொல்லாக, “லேவிய ஆசாரியர்களின் முன்னிலையிலிருந்து.” இது லேவிய ஆசாரியர்களிடம் பாதுகாப்பாக வைக்கப்பட்டிருந்த பிரதியிலிருந்து என்று பொருள் கொள்ளலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה כְשִׁבְתּוֹ
  choice: அவன் ... அமரும்போது
  rationale: וְהָיָה அறிமுகப்படுத்தும் சட்டச் சூழலையும், כְשִׁבְתּוֹ என்பதன் காலப்பொருளான ‘அமரும்போது’ என்பதையும் இயல்பான தமிழில் தருகிறது.
- source_word: עַל כִּסֵּא מַמְלַכְתּוֹ
  choice: தன் அரசாட்சியின் அரியணையில்
  rationale: ‘அரியணை’ என்ற நேரடியான அரச உருவகத்தையும், ‘அவனுடைய அரசாட்சி’ என்ற தொடர்பையும் தக்கவைக்கிறது.
- source_word: וְכָתַב לוֹ
  choice: தனக்காக ... எழுதிக்கொள்ள வேண்டும்
  rationale: לוֹ என்பதன் தன்னலப் பயன் பொருளையும், சட்டக் கட்டளையைச் சுட்டும் வினை வடிவத்தையும் நவீனத் தமிழில் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: מִשְׁנֵה הַתּוֹרָה הַזֹּאת
  choice: இந்தச் சட்டத்தின் நகல் ஒன்று
  rationale: מִשְׁנֵה என்பதை இச்சூழலில் ‘நகல்’ என்றும், תּוֹרָה என்பதை அரசனுக்குரிய சட்டச் சூழலுக்கு ஏற்றபடி ‘சட்டம்’ என்றும் மொழிபெயர்க்கிறது.
- source_word: עַל סֵפֶר
  choice: ஒரு சுருளில்
  rationale: பண்டைய எழுத்துப் பொருளான סֵפֶר இங்கு எழுதப்பட்ட சுருளை அல்லது ஆவணத்தைச் சுட்டுவதால், வரலாற்றுச் சூழலைத் தெளிவாகத் தர ‘சுருள்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: מִלִּפְנֵי
  choice: முன்னிலையில் உள்ளதிலிருந்து
  rationale: ‘முன்னிலையிலிருந்து’ என்ற எபிரெயச் சொல்லமைப்பைத் தக்கவைத்து, அது ஆசாரியர்களிடம் பாதுகாக்கப்பட்டிருந்த மூலப்பிரதியைக் குறிக்கலாம் என்ற விளக்கத்தை அடிக்குறிப்பில் வழங்குகிறது.
- source_word: הַכֹּהֲנִים הַלְוִיִּם
  choice: லேவிய ஆசாரியர்கள்
  rationale: ஆசாரியர்களை லேவியர்களாக அடையாளப்படுத்தும் எபிரெயப் பதர்க்கையை இயல்பான தமிழில் தருகிறது; அதன் சொற்சொல் அமைப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
theological_decisions:
- issue: அரசனுக்குரிய சட்டத்தில் תּוֹרָה என்பதன் வரம்பு
  choice: இந்தச் சட்டம்
  alternative: இந்தப் போதனை; இந்தத் தோரா
  rationale: உடனடியான உடன்படிக்கைச் சட்டச் சூழலுக்கு ‘சட்டம்’ பொருத்தமானது; அதேவேளையில், வசனம் கூறுவதைக் கடந்த ஒரு விரிவான வேதாகமத் தொகுப்பை முன்கூட்டியே வரையறுப்பதைத் தவிர்க்கிறது.
- issue: ஆசாரியர்களின் முன்னிலையிலிருந்து நகல் எடுப்பது
  choice: முன்னிலையில் உள்ளதிலிருந்து
  alternative: லேவிய ஆசாரியர்களிடம் வைக்கப்பட்டுள்ள மூலப்பிரதியிலிருந்து; லேவிய ஆசாரியர்களின் முன்னிலையில்
  rationale: மூல எபிரெயின் இடவியல் சொல்லமைப்பையும் அதன் உண்மையான தெளிவின்மையையும் முதன்மை உரையில் தக்கவைக்கிறது. ஆசாரியர்களின் பாதுகாப்பிலிருந்த அங்கீகரிக்கப்பட்ட பிரதியிலிருந்து நகலெடுப்பதே சாத்தியமான பொருள் என்பதை அடிக்குறிப்பு விளக்குகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சட்டக் கட்டளைக்கேற்ற கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘எழுதிக்கொள்ள வேண்டும்’ என்பது கடமையையும் அரசன் தன் பயன்பாட்டிற்காக நகல் தயாரிக்க வேண்டியதையும் இயல்பாக வெளிப்படுத்துகிறது. மூலத்தின் தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
