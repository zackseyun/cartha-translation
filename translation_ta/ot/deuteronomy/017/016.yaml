  text: רַק֮ לֹא יַרְבֶּה לּ֣/וֹ סוּסִים֒ וְ/לֹֽא יָשִׁ֤יב אֶת הָ/עָם֙ מִצְרַ֔יְמָ/ה לְמַ֖עַן הַרְבּ֣וֹת ס֑וּס וַֽ/יהוָה֙ אָמַ֣ר לָ/כֶ֔ם לֹ֣א תֹסִפ֗וּ/ן לָ/שׁ֛וּב בַּ/דֶּ֥רֶךְ הַ/זֶּ֖ה עֽוֹד־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/017/016.yaml
  text: Only[a], he must not multiply horses for himself, nor cause the people to return to Egypt in order to multiply horses, since Yahweh has said to you[c][b], ‘You must never return again by this way.’
translation:
  language: ta
  text: ஆனால், அவன் தனக்காகக் குதிரைகளைப் பெருக்கிக்கொள்ளக் கூடாது[a]. குதிரைகளைப் பெருக்குவதற்காக மக்களை எகிப்துக்குத் திரும்பச் செய்யவும் கூடாது[b]. ஏனெனில் யாவே உங்களிடம், “நீங்கள் இனி ஒருபோதும் இந்த வழியாகத் திரும்பிச் செல்லக் கூடாது” என்று கூறியிருக்கிறார்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவன் தனக்காக ஏராளமான குதிரைகளைச் சேர்த்துக்கொள்ளக் கூடாது.” எபிரெய வினைச்சொல் ‘பெருகச் செய்தல்’ அல்லது ‘அதிகமாக்குதல்’ என்று பொருள்படும்.
    reason: lexical_alternative
  - marker: b
    text: 'அல்லது, “மக்களை மீண்டும் எகிப்துக்குக் கொண்டுபோகவும் கூடாது.” எபிரெய வினைச்சொல் காரணவினை வடிவில் உள்ளது: மக்கள் திரும்புவதற்கு அரசன் காரணமாகக் கூடாது.'
    reason: lexical_alternative
  - marker: c
    text: 'சொல்லுக்குச் சொல்: “நீங்கள் இனி இந்த வழியாகத் திரும்புவதை மீண்டும் சேர்க்கக் கூடாது.” இது, “நீங்கள் இனி ஒருபோதும் இந்த வழியாகத் திரும்பிச் செல்லக் கூடாது” என்று பொருள்படும் எபிரெய மொழிவழக்கு.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רַק
  choice: ஆனால்
  rationale: இங்கு அரசனுக்கான கட்டுப்பாட்டை அறிமுகப்படுத்தும் எதிர்மறைத் திருப்பத்தை இயல்பான தமிழில் காட்டுகிறது; எபிரெயச் சொல்லின் வரையறுக்கும் வலிமை தொடர்ந்து வரும் ‘கூடாது’ என்பதிலும் வெளிப்படுகிறது.
- source_word: יַרְבֶּה לּוֹ סוּסִים
  choice: அவன் தனக்காகக் குதிரைகளைப் பெருக்கிக்கொள்ளக் கூடாது
  rationale: רבה என்பதன் ‘அதிகமாக்குதல்/பெருக்குதல்’ என்ற பொருளையும், לּוֹ என்பதிலுள்ள தனக்கான சேர்த்துவைப்பு நுணுக்கத்தையும் பாதுகாக்கிறது.
- source_word: וְלֹא יָשִׁיב אֶת הָעָם מִצְרַיְמָה
  choice: மக்களை எகிப்துக்குத் திரும்பச் செய்யவும் கூடாது
  rationale: שוב என்பதன் causative வடிவத்தை ‘திரும்பச் செய்ய’ என்று வெளிப்படையாகக் காட்டி, அரசனே மக்களின் திரும்புதலுக்குக் காரணமாகக் கூடாது என்ற பொருளைப் பாதுகாக்கிறது.
- source_word: לְמַעַן הַרְבּוֹת סוּס
  choice: குதிரைகளைப் பெருக்குவதற்காக
  rationale: நோக்கத்தைக் குறிக்கும் לְמַעַן கட்டமைப்பையும், முந்தைய רבה வேருடனான சொல் தொடர்பையும் காக்கிறது.
- source_word: וַיהוָה
  choice: யாவே
  rationale: உரையில் நேரடியாக உள்ள உடன்படிக்கைப் பெயரான יהוה என்பதை பொதுப்பட்டப் பெயராக மாற்றாமல் ஒலிபெயர்க்கிறது.
- source_word: לֹא תֹסִפוּן לָשׁוּב ... עוֹד
  choice: நீங்கள் இனி ஒருபோதும் ... திரும்பிச் செல்லக் கூடாது
  rationale: ‘மீண்டும் திரும்புவதைச் சேர்க்காதீர்கள்’ என்ற எபிரெய மொழிவழக்கின் கடுமையான மறுப்பை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: בַּדֶּרֶךְ הַזֶּה
  choice: இந்த வழியாக
  rationale: דֶּרֶךְ என்பதன் வழி/பாதை பொருளையும் בְּ முன்னிடைச்சொல்லின் ‘வழியாக’ என்ற பாதைநுணுக்கத்தையும் இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் உள்ள தனிப்பட்ட உடன்படிக்கைப் பெயரைப் பட்டப்பெயராக மாற்றாமல் பாதுகாக்கிறது.
- issue: எகிப்துக்குத் திரும்பச் செய்வது குறித்த தடையின் முகவர்
  choice: அரசன் மக்களைத் திரும்பச் செய்யக் கூடாது
  alternative: அரசன் மக்களை எகிப்துக்குக் கொண்டுபோகக் கூடாது
  rationale: יָשִׁיב என்ற causative வினைவடிவத்தைத் தெளிவாகப் பேணி, வணிகம், அனுப்புதல் அல்லது நேரடி அழைத்துச் செல்லுதல் போன்ற குறிப்பிட்ட முறையை உரையில் இல்லாமல் சேர்ப்பதைத் தவிர்க்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டது. சட்டக் கட்டளையின் வலிமைக்காக ‘கூடாது’ பயன்படுத்தப்பட்டது. காரணவினை மற்றும் ஒரே רבה வேரின் மறுபயன்பாடு முடிந்தவரை வெளிப்படையாகப் பேணப்பட்டுள்ளன.
