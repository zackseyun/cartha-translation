base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/017/006.yaml
  text: On the testimony of two witnesses or three witnesses[a], the one to die shall be put to death[b]; he shall not be put to death on the testimony of one witness.
translation:
  language: ta
  text: இரண்டு சாட்சிகளின் அல்லது மூன்று சாட்சிகளின் வாக்குமூலத்தின் அடிப்படையில்[a], மரணத்திற்கு உரியவர் கொல்லப்பட வேண்டும்[b]. ஒரு சாட்சியின் வாக்குமூலத்தின் அடிப்படையில் அவர் கொல்லப்படக் கூடாது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொற்பொருளாக, “இரண்டு சாட்சிகளின் வாயின்படி அல்லது மூன்று சாட்சிகளின் வாயின்படி.” இந்த எபிரெய மரபுத்தொடர் சட்டரீதியான வாக்குமூலத்தை அல்லது ஆதாரத்தைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “இறக்க வேண்டியவர்.” இது உயிர்த்தண்டனைக்கு உட்படக்கூடிய நபரைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל־פִּי
  choice: வாக்குமூலத்தின் அடிப்படையில்
  rationale: எபிரெய மொழியில் சொற்பொருளாக ‘வாயின்படி’ என்றிருந்தாலும், சட்டச் சூழலில் இது சாட்சி அளிக்கும் வாக்குமூலம் அல்லது ஆதாரத்தைக் குறிக்கும் மரபுத்தொடர். தமிழில் இயல்பான சட்டப் பொருளைத் தெளிவாகத் தருகிறது.
- source_word: שְׁנַיִם עֵדִים ... שְׁלֹשָׁה עֵדִים
  choice: இரண்டு சாட்சிகளின் அல்லது மூன்று சாட்சிகளின்
  rationale: மூலத்தில் இரு எண்களுக்குப் பின்னரும் ‘சாட்சிகள்’ என்பது திரும்ப வருகிறது. சட்டநடையின் வலியுறுத்தலையும் இணை அமைப்பையும் காக்க அந்தத் திருப்புரை தமிழிலும் வைக்கப்பட்டுள்ளது.
- source_word: יוּמַת
  choice: கொல்லப்பட வேண்டும்
  rationale: מות என்பதன் ஹோஃபால் வடிவம் வெறுமனே ‘இறப்பார்’ என்பதல்ல; காரணவினைச் செயப்பாட்டு வடிவில் நீதித் தீர்ப்பின்படி உயிர்தண்டனை நிறைவேற்றப்படுவதைக் குறிக்கிறது.
- source_word: הַמֵּת
  choice: மரணத்திற்கு உரியவர்
  rationale: உருபுடன் வரும் இந்தப் பெயரெச்ச வடிவம் ‘இறக்க வேண்டியவர்/மரணத்திற்கு உரியவர்’ என்ற இடைநிறுத்தப்பட்ட சட்டப் பொருளைக் கொண்டுள்ளது. ஏற்கெனவே இறந்தவரைக் குறிக்காது; அதேவேளை ‘குற்றவாளி எனத் தீர்ப்பளிக்கப்பட்டவர்’ என்று மூலத்தைவிட அதிகமாகத் தீர்மானிப்பதையும் தவிர்க்கிறது.
- source_word: לֹא יוּמַת
  choice: அவர் கொல்லப்படக் கூடாது
  rationale: அதே வினையின் எதிர்மறை வடிவம் சட்டத் தடையைத் தெளிவாகக் கூறுகிறது. ‘கூடாது’ என்பது நவீன தமிழில் இயல்பான கட்டாயத் தடையை வெளிப்படுத்துகிறது.
- source_word: עֵד אֶחָד
  choice: ஒரே ஒரு சாட்சி
  rationale: தனி ஒருவரின் சாட்சி போதாது என்ற வலியுறுத்தலை இயல்பான தமிழில் தருகிறது; முந்தைய ‘இரண்டு... மூன்று’ என்பதுடனான எண்ணியல் மாறுபாட்டையும் தெளிவாக்குகிறது.
theological_decisions:
- issue: மரணத் தண்டனைச் சட்டச் சூழலில் הַמֵּת என்பதன் குறிப்பு மற்றும் வலிமை
  choice: மரணத்திற்கு உரியவர்
  alternative: இறக்க வேண்டியவர்; தண்டனைத் தீர்ப்புப் பெற்றவர்; இறந்தவர்
  rationale: இந்த வசனம் உயிர்தண்டனை விதிக்கத் தேவையான சாட்சியத் தரத்தை ஒழுங்குபடுத்துகிறது. ‘இறந்தவர்’ என்பது சூழலுக்குப் பொருந்தாது; ‘தண்டனைத் தீர்ப்புப் பெற்றவர்’ என்பது நீதித் தீர்ப்பு ஏற்கெனவே முடிந்ததாக மூலத்தைவிட வெளிப்படையாகச் சொல்கிறது. ‘மரணத்திற்கு உரியவர்’ மூலத்தின் சுருக்கமான சட்டச் சொல்லாட்சியையும் அதன் தீவிரத்தையும் காக்கிறது.
translation_notes:
  register: நவீன, கண்ணியமான சட்டநடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் ‘இரண்டு சாட்சிகள் ... மூன்று சாட்சிகள்’ என்ற திருப்புரை பாதுகாக்கப்பட்டுள்ளது. ‘மரணத்திற்கு உரியவர்’ என்பது எபிரெயச் சொல்லின் இடைநிறுத்தப்பட்ட தன்மையை ஓரளவு காத்தபடி சாதாரண வாசகருக்கும் பொருள் புரியச் செய்கிறது.
