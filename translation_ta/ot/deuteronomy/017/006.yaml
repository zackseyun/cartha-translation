  source_fidelity: 'முதன்மை உரை எபிரெயச் சட்டநடையையும் பொருளையும் உண்மையுடன் தருகிறது: இரண்டு அல்லது மூன்று சாட்சிகளின் வாக்குமூலம் அவசியம்; ஒரே சாட்சியின் அடிப்படையில் மரணத் தண்டனை நிறைவேற்றப்படக் கூடாது. הַמֵּת என்பதற்கான “மரணத்திற்கு உரியவர்” என்பது, ஏற்கெனவே இறந்தவராகவோ அல்லது தீர்ப்பளிக்கப்பட்ட குற்றவாளியாகவோ மிகைப்படுத்தாமல், சூழலுக்கு ஏற்றதாக உள்ளது.'
  naturalness: நவீன தரநிலைத் தமிழில் உரை தெளிவாகவும் கண்ணியமான சட்டநடையுடனும் உள்ளது. “ஒரே ஒரு சாட்சி” என்பது சிறிது வலியுறுத்தலானதாயினும் இயல்பானது; மூலத்தின் ‘ஒரு சாட்சி’ என்ற எண்ணியல் எதிர்மறை அமைப்பைத் துல்லியமாகக் காக்க “ஒரு சாட்சி” என மாற்றப்பட்டுள்ளது.
