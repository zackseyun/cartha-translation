base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/017/014.yaml
  text: When you come into the land that Yahweh your God is giving you[a], and you take possession of it and live in it, and you say, “I will set a king over myself, like all the nations that are around me,”
translation:
  language: ta
  text: உன் கடவுளாகிய யாவே உனக்குக் கொடுக்கிற நாட்டிற்குள் நீ வந்து, அதை உரிமையாக்கிக்கொண்டு, அதில் குடியிருக்கும்போது, “என்னைச் சுற்றியுள்ள எல்லா நாடுகளைப் போலவே எனக்குமேல் ஓர் அரசனை நியமிப்பேன்[a]” என்று நீ சொன்னால்,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எனக்குமேல் ஓர் அரசனை ஏற்படுத்துவேன்.” எபிரெயத்தில் சொல்லுக்குச் சொல், “எனக்குமேல் ஓர் அரசனை வைப்பேன்.”
    reason: שׂים என்பதற்கான ‘வை’ என்ற நேரடியான பொருளையும், சூழலுக்கேற்ற ‘ஏற்படுத்து’ என்ற மாற்று மொழிபெயர்ப்பையும் காட்டுகிறது; עָלַי-யின் ‘எனக்குமேல்’ என்ற முதல் நபர் பார்வையும் காக்கப்படுகிறது.
lexical_decisions:
- source_word: כִּי תָבֹא
  choice: நீ வந்து … குடியிருக்கும்போது
  rationale: כִּי இங்கு எதிர்காலத்தில் நிகழும் சூழலை அறிமுகப்படுத்துகிறது. தமிழில் தொடரின் முடிவில் வரும் ‘-போது’ அமைப்பு காலச்சார்ந்த எதிர்பார்க்கப்பட்ட சூழலை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இது பதவிப்பெயர் அல்ல, இஸ்ரவேலின் கடவுளுடைய தனிப்பெயரான நான்கெழுத்துப் பெயர். அதன் ஒலிபெயர்ப்பைத் தமிழில் ‘யாவே’ என வழங்குகிறது.
- source_word: נֹתֵן לָךְ
  choice: உனக்குக் கொடுக்கிற
  rationale: எபிரெயப் பெயரெச்ச வினை வடிவின் நிகழ்/நெருங்கிய செயல் உணர்வையும் கடவுளின் செயல்பாட்டையும் காக்கிறது.
- source_word: וִירִשְׁתָּהּ
  choice: அதை உரிமையாக்கிக்கொண்டு
  rationale: நிலம் குறித்த சூழலில் ירשׁ என்பது அதைக் கைப்பற்றி உடைமையாக்குவதைக் குறிக்கிறது; ‘சுதந்தரித்தல்’ என்பதன் நவீன தவறான உட்பொருளைத் தவிர்க்கிறது.
- source_word: וְיָשַׁבְתָּה בָּהּ
  choice: அதில் குடியிருக்கும்போது
  rationale: ישׁב இங்கு நிலையான குடியிருப்பைக் குறிக்கிறது; நவீனத் தமிழில் இயல்பான சொல்லாக்கம்.
- source_word: אָמַרְתָּ
  choice: என்று நீ சொன்னால்
  rationale: சட்டவிதிக்கான எதிர்காலச் சூழலை தமிழில் தெளிவாக இணைக்க நிபந்தனை வடிவம் பயன்படுத்தப்பட்டுள்ளது; இது எபிரெயத்தில் உள்ள சூழ்நிலைத் தொடரை காரணவாக்கியமாக மாற்றுவதில்லை.
- source_word: אָשִׂימָה עָלַי מֶלֶךְ
  choice: நானும் என்மேல் ஓர் அரசனை ஏற்படுத்துவேன்
  rationale: שׂים என்பதன் ‘ஏற்படுத்து/நியமி’ பொருளையும் עָלַי என்பதன் ‘என்மேல்’ என்ற முதல் நபர் பார்வையையும் காக்கிறது. ‘நானும்’ என்பது சுற்றியுள்ள நாடுகளைப் போலச் செய்வதைக் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: כְּכָל הַגּוֹיִם אֲשֶׁר סְבִיבֹתָי
  choice: என்னைச் சுற்றியுள்ள எல்லா நாடுகளையும் போல
  rationale: גּוֹיִם என்பதை பிற்கால இறையியல் பொருளுடைய சொல்லால் அல்லாமல் இங்குள்ள அரசியல் மக்களினங்களான ‘நாடுகள்’ என்று வழங்கி, மேற்கோளின் முதல் நபர் பார்வையையும் காக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: ஆண்டவர்; யெகோவா
  rationale: மூலத்தில் தனிப்பெயர் நேரடியாக உள்ளது. பட்டப்பெயரால் மாற்றாமல், அதிகம் ஏற்றுக்கொள்ளப்பட்ட ‘Yahweh’ உச்சரிப்பைத் தமிழில் ஒலிபெயர்க்கிறது.
- issue: அரசனை விரும்பும் கூற்றின் மதிப்பீடு
  choice: மூலத்தில் உள்ளபடி மக்களின் கூற்றை மட்டும் பதிவு செய்தல்
  alternative: அந்த விருப்பத்தை வெளிப்படையாக அங்கீகரித்தல் அல்லது கண்டித்தல்
  rationale: இந்த வசனம் தனித்து அந்த விருப்பத்துக்கு நேரடியான ஒழுக்கத் தீர்ப்பு வழங்கவில்லை. ஆகவே சுற்றியுள்ள நாடுகளைப் போல அரசனை ஏற்படுத்தும் விருப்பத்தில் உள்ள இறையியல் பதற்றம் விளக்கத்தால் தீர்க்கப்படவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், ஒருமை இரண்டாம் நபர் உரையாடலைக் காத்து, கண்ணியமான ஆனால் எளிதில் புரியும் நடையில் வடிவமைக்கப்பட்டது. வசனம் அடுத்த கட்டளைக்குத் தொடருவதால் இறுதியில் காற்புள்ளி வைக்கப்பட்டுள்ளது.
