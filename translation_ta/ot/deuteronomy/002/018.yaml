  text: אַתָּ֨ה עֹבֵ֥ר הַ/יּ֛וֹם אֶת גְּב֥וּל מוֹאָ֖ב אֶת עָֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/018.yaml
  text: You are crossing today the border of Moab at Ar[a].
translation:
  language: ta
  text: நீ இன்று மோவாபின் எல்லையான ஆரைக் கடக்கிறாய்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மோவாபின் எல்லையை, அதாவது ஆரைக் கடக்கிறாய்.” எபிரெயத்தில் ‘ஆர்’ என்பதற்கு முன் நேரடிப் பொருள் குறியீடு மீண்டும் வருகிறது; இது ஆர் என்பதை மோவாபின் எல்லைப் பகுதி அல்லது நகரத்துடன் இணைநிலையில் அடையாளப்படுத்தலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֹבֵר
  choice: கடந்து செல்கிறாய்
  rationale: முன்னிலைப் பெயருடன் பயனிலையாக வரும் ஆண்பால் ஒருமை Qal வினையெச்சம், சூழலில் உடனடியாக நடைபெறும் செயலைக் குறிக்கிறது; நவீன தமிழில் நிகழ்காலத் தொடர்ச்சியை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: הַיּוֹם
  choice: இன்று
  rationale: ‘இன்று/இந்த நாள்’ என்னும் பொதுவான கால வினையடை; ‘இன்று’ இயல்பான நவீனத் தமிழ்.
- source_word: גְּבוּל
  choice: எல்லை
  rationale: மோவாபின் நிலப்பரப்பு எல்லையைக் குறிக்கிறது; ‘எல்லை’ தெளிவான, இயல்பான தமிழ்ச் சொல்.
- source_word: מוֹאָב
  choice: மோவாப்
  rationale: இடம் மற்றும் மக்களினத்தின் பெயருக்கான வழக்கமான தமிழ் ஒலிபெயர்ப்பு.
- source_word: עָר
  choice: ஆர்
  rationale: பெயர்க்காமல் ஒலிபெயர்க்கப்படும் இடப்பெயர்.
- source_word: אֶת ... אֶת
  choice: மோவாபின் எல்லையான ஆர் வழியாக
  rationale: இருமுறை வரும் நேரடி வேற்றுமை உருபு, ‘மோவாபின் எல்லை’ என்பதையும் ‘ஆர்’ என்பதையும் இணைநிலையாகக் காட்டலாம். முதன்மை உரை ஆரை அந்த எல்லையுடன் தொடர்புபடுத்துகிறது; அடிக்குறிப்பு அதன் மாற்று தொடரமைப்பைத் தருகிறது.
- source_word: אַתָּה
  choice: நீ
  rationale: இஸ்ரவேலை ஒருங்கிணைந்த மக்களாக நோக்கி உரைக்கப்படும் இரண்டாம் நபர் ஆண்பால் ஒருமை; தமிழில் ஒருமை வடிவமான ‘நீ’ மூலத்தின் சொல்லாட்சியைப் பாதுகாக்கிறது.
theological_decisions:
- issue: இஸ்ரவேலை நோக்கிய ஒருமை அழைப்பு
  choice: விளக்கச் சேர்க்கையின்றி ‘நீ’ என ஒருமையில் வைத்தல்
  alternative: ‘இஸ்ரவேல் மக்களாகிய நீங்கள்’ அல்லது ‘நீங்கள்’
  rationale: எபிரெயத்தில் இஸ்ரவேல் ஓர் ஒருங்கிணைந்த மக்களாக ஒருமையில் அழைக்கப்படுகிறது. ‘நீ’ அந்தச் சொல்லாட்சியை விளக்கவுரை சேர்க்காமல் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியும் ஆனால் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. எபிரெய ஒருமை அழைப்பும் ‘மோவாபின் எல்லை—ஆர்’ என்ற தொடரமைப்பின் உண்மையான தெளிவின்மையும் பாதுகாக்கப்பட்டுள்ளன.
