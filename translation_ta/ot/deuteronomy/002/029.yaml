revisions:
- from: சேயீரில் வாழும் ஏசாவின் மக்களும், ஆரில் வாழும் மோவாபியர்களும் எனக்குச் செய்ததுபோலவே[a], நம் கடவுளாகிய யாவே நமக்குக் கொடுத்துக்கொண்டிருக்கும் நாட்டுக்குள் போவதற்காக நான் யோர்தானைக் கடக்கும்வரை அனுமதியுங்கள்.
