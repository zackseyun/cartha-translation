base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/029.yaml
  text: just as the sons of Esau who live in Seir and the Moabites who live in Ar did for me[a], until I cross the Jordan into the land that Yahweh our God is giving to us.
translation:
  language: ta
  text: சேயீரில் வசிக்கும் ஏசாவின் மக்களும், ஆரில் வசிக்கும் மோவாபியர்களும் எனக்குச் செய்ததுபோலவே[a], நான் யோர்தானைக் கடந்து நம் கடவுளாகிய யாவே நமக்குக் கொடுக்கிற நாட்டுக்குள் செல்லும்வரை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என்னோடு நடந்துகொண்டதுபோலவே.” எபிரேயத்தில் சொல்லுக்குச் சொல், “எனக்குச் செய்ததுபோலவே”; சூழலில் இது வழியாகச் செல்ல அனுமதித்ததையும் தேவையான பொருட்களை வழங்கியதையும் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּאֲשֶׁר
  choice: செய்ததுபோலவே
  rationale: ஒப்பீட்டின் வலிமையை இயல்பான தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: עָשׂוּ לִי
  choice: எனக்குச் செய்தது
  rationale: எபிரேயச் சொல்லின் பொதுவான பொருளைத் தக்கவைத்து, வழிவிடுதல் மற்றும் உணவுப் பொருட்கள் வழங்குதல் என்ற சூழல் சார்ந்த விவரங்களை முதன்மை உரையில் தேவையின்றி சேர்க்கவில்லை.
- source_word: בְּנֵי עֵשָׂו
  choice: ஏசாவின் மக்கள்
  rationale: இது ஏசாவின் சந்ததியினரைக் கூட்டாகக் குறிக்கிறது; எபிரேயத்தின் குடும்ப உறவு சார்ந்த சொல்லாட்சியையும் தமிழில் இயல்பாகத் தக்கவைக்கிறது.
- source_word: הַיֹּשְׁבִים בְּשֵׂעִיר
  choice: சேயீரில் வாழும்
  rationale: நிலையான குடியிருப்பைக் குறிக்கும் பங்கேற்பு வினை வடிவத்தை நவீனத் தமிழில் இயல்பாக வழங்குகிறது.
- source_word: וְהַמּוֹאָבִים
  choice: மோவாபியர்களும்
  rationale: இனக்குழுவைக் குறிக்கும் எபிரேயப் பன்மையை நேரடியாகவும் இயல்பாகவும் மொழிபெயர்க்கிறது.
- source_word: הַיֹּשְׁבִים בְּעָר
  choice: ஆரில் வாழும்
  rationale: முந்தைய இணை அமைப்பைப் பேணுகிறது; ஆர் என்ற இடப்பெயர் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: עַד אֲשֶׁר אֶעֱבֹר
  choice: நான் ... கடக்கும்வரை
  rationale: எல்லையைக் கடந்து செல்வதைத் தமிழில் தெளிவாகக் குறிக்கிறது.
- source_word: אֶת הַיַּרְדֵּן
  choice: யோர்தானைக்
  rationale: ஆற்றின் வழக்கமான வேதாகமத் தமிழ்ப் பெயரைப் பயன்படுத்துகிறது; சூழலில் ‘ஆறு’ என்பதைச் சேர்க்கத் தேவையில்லை.
- source_word: אֶל הָאָרֶץ
  choice: நாட்டுக்குள் போவதற்காக
  rationale: யோர்தானைக் கடந்து ஒரு நிலப்பகுதிக்குள் நுழையும் இயக்கத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைப்பட்டத்தை மாற்றாக இடாமல், எபிரேயத்தின் தனிப்பட்ட உடன்படிக்கைப் பெயரைத் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: אֱלֹהֵינוּ
  choice: நம் கடவுள்
  rationale: முதல் நபர் பன்மை உடைமைத் தொடர்பை நேரடியாக வழங்குகிறது.
- source_word: נֹתֵן לָנוּ
  choice: நமக்குக் கொடுத்துக்கொண்டிருக்கும்
  rationale: பங்கேற்பு வினையின் நிகழ்நிலை/முன்னேற்றத் தன்மையை வெளிப்படுத்தி, கொடை ஏற்கெனவே முற்றிலும் நிறைவடைந்ததாகக் காட்டுவதைத் தவிர்க்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரின் மொழியாக்கம்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் பட்டம் அல்ல, நான்கெழுத்துத் தனிப்பட்ட இறைப் பெயரே உள்ளது; ஆகவே அதைப் பட்டமாக மாற்றாமல் ஒலிபெயர்க்கப்பட்டுள்ளது.
- issue: נֹתֵן என்பதன் கால/நிலைத் தன்மை
  choice: கொடுத்துக்கொண்டிருக்கும்
  alternative: கொடுக்கிறார்
  rationale: நிலம் வழங்கப்படுவது நிகழ்ந்துகொண்டிருப்பதாகவும் உறுதியாக முன்னெடுக்கப்படுவதாகவும் உள்ள பங்கேற்பு வினையின் திறந்த தன்மையைத் தக்கவைக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையும் வாசிப்புத் தெளிவும் கொண்ட நடை பயன்படுத்தப்பட்டுள்ளது. இந்த வசனம் முந்தைய வசனத்தில் தொடங்கிய மோசேயின் வேண்டுகோளின் தொடர்ச்சி என்பதால், தமிழில் வாக்கியம் முழுமையடைய ‘அனுமதியுங்கள்’ சேர்க்கப்பட்டுள்ளது; இது உடனடி சூழலிலிருந்து பெறப்பட்டதே அன்றி தனியான புதிய தகவல் அல்ல.
