  text: אֹ֣כֶל תִּשְׁבְּר֧וּ מֵֽ/אִתָּ֛/ם בַּ/כֶּ֖סֶף וַ/אֲכַלְתֶּ֑ם וְ/גַם מַ֜יִם תִּכְר֧וּ מֵ/אִתָּ֛/ם בַּ/כֶּ֖סֶף וּ/שְׁתִיתֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/006.yaml
  text: You shall buy food from them with silver[a], so that you may eat; and you shall also buy water from them with silver, so that you may drink.
translation:
  language: ta
  text: நீங்கள் உண்பதற்காக அவர்களிடமிருந்து உணவை வெள்ளி கொடுத்து வாங்க வேண்டும்[a]; குடிப்பதற்காகத் தண்ணீரையும் அவர்களிடமிருந்து வெள்ளி கொடுத்து வாங்க வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இன்னும் சொல்லுக்குச் சொல் வடிவில், “வாங்கி உண்ணுங்கள்; … வாங்கிக் குடியுங்கள்” என்றும் மொழிபெயர்க்கலாம். எபிரெய மொழியில் இவை ‘மற்றும்’ என்ற இணைப்புடன் தொடர்கின்றன; இங்கு அந்தத் தொடர், உணவையும் தண்ணீரையும் வாங்குவதன் நோக்கம் அல்லது எதிர்பார்க்கப்பட்ட விளைவைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹכֶל
  choice: உணவு
  rationale: இது தானியத்தை மட்டும் குறிக்காமல், உண்ணக்கூடிய பொருட்களைப் பொதுவாகக் குறிக்கும் சொல்; ‘உணவு’ இயல்பானதும் பொருளளவில் போதுமான அகலமுடையதும் ஆகும்.
- source_word: תִּשְׁבְּרוּ
  choice: வாங்க வேண்டும்
  rationale: இந்தச் சூழலில் שׁבר என்பது உணவை விலை கொடுத்து வாங்குவதைக் குறிக்கிறது; தமிழில் கட்டளையின் வலிமையை ‘வாங்க வேண்டும்’ தெளிவாகத் தெரிவிக்கிறது.
- source_word: מֵאִתָּם
  choice: அவர்களிடமிருந்து
  rationale: உணவும் தண்ணீரும் சேயீர்/ஏதோம் மக்களிடமிருந்து பெறப்பட வேண்டும் என்பதைக் காட்டும் மூலத்தைக் குறிக்கும் சொற்றொடர்.
- source_word: בַּכֶּסֶף
  choice: வெள்ளி கொடுத்து
  rationale: கட்டணமாகப் பயன்படுத்தப்பட்ட வெள்ளியை எபிரெயச் சொல் நேரடியாகக் குறிப்பிடுகிறது. ‘பணம் கொடுத்து’ என்பது இயல்பான மாற்றாக இருந்தாலும், ‘வெள்ளி கொடுத்து’ மூலத்தின் concrete imagery-ஐப் பாதுகாக்கிறது.
- source_word: וַאֲכַלְתֶּם
  choice: உண்பதற்காக
  rationale: அறிவுறுத்தல் சூழலில், வாங்குவதன் நோக்கம் அல்லது விளைவாக உண்பதை இத்தொடர் சுட்டுகிறது. எபிரெய இணைப்பின் நேரடியான வடிவம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: וְגַם
  choice: தண்ணீரையும்
  rationale: ‘-யும்’ என்னும் இணைப்புருபு, உணவுக்கான அறிவுறுத்தலுடன் தண்ணீருக்கான இரண்டாவது அறிவுறுத்தலையும் சேர்க்கும் வலிமையை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: מַיִם
  choice: தண்ணீர்
  rationale: பொதுமக்கள் எளிதில் புரிந்துகொள்ளும் இயல்பான நவீனத் தமிழ் இணைச்சொல்.
- source_word: תִּכְרוּ
  choice: வாங்க வேண்டும்
  rationale: כרה வேறு சூழல்களில் ‘தோண்டு’ எனப் பொருள்படலாம்; ஆனால் ‘அவர்களிடமிருந்து’, ‘வெள்ளி கொடுத்து’ என்ற வணிகச் சூழலும் உணவுடன் உள்ள இணை அமைப்பும் இங்கு ‘வாங்கு’ என்ற பொருளை உறுதிப்படுத்துகின்றன.
- source_word: וּשְׁתִיתֶם
  choice: குடிப்பதற்காக
  rationale: உணவுக்கான இணை அமைப்பைப் போலவே, தண்ணீர் வாங்குவதன் நோக்கம் அல்லது விளைவாகக் குடிப்பதைத் தெரிவிக்கிறது.
theological_decisions:
- issue: ஏதோமியரின் உணவு மற்றும் தண்ணீரைப் பெறுவதற்கான கட்டளையின் அறநெறி வலிமை
  choice: இஸ்ரவேலர் அவற்றைப் பறித்துக்கொள்ளாமல், வெள்ளி கொடுத்து வாங்க வேண்டும் என்று தெளிவாக மொழிபெயர்க்கப்பட்டுள்ளது.
  alternative: ‘உணவை வாங்கி உண்ணுங்கள்; தண்ணீரை வாங்கிக் குடியுங்கள்’ என்று எபிரெய இணைப்பை இன்னும் நேரடியாக மொழிபெயர்க்கலாம்.
  rationale: ‘அவர்களிடமிருந்து’ மற்றும் ‘வெள்ளி கொடுத்து’ என்பவை ஈடுசெய்து முறையாகப் பெற வேண்டும் என்ற சட்ட/அறநெறி வலிமையை வெளிப்படுத்துகின்றன. இறுதி வினைகள் நோக்கம் அல்லது எதிர்பார்க்கப்பட்ட விளைவு எனப் புரிந்துகொள்ளப்படலாம்; அந்த இலக்கண நுணுக்கம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் மரியாதைமிக்க சட்ட/அறிவுறுத்தல் நடையிலும் அமைக்கப்பட்டுள்ளது. ‘வெள்ளி கொடுத்து’ என்பது மூலத்தின் பண்பாட்டு உருவகத்தைப் பாதுகாக்கிறது; நோக்கம்/இணைப்பு சார்ந்த உண்மையான இலக்கணத் தெளிவின்மை அடிக்குறிப்பில் வைக்கப்பட்டுள்ளது.
