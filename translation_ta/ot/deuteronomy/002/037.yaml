source:
  edition: WLC
  text: רַ֛ק אֶל אֶ֥רֶץ בְּנֵי עַמּ֖וֹן לֹ֣א קָרָ֑בְתָּ כָּל יַ֞ד נַ֤חַל יַבֹּק֙ וְ/עָרֵ֣י הָ/הָ֔ר וְ/כֹ֥ל אֲשֶׁר צִוָּ֖ה יְהוָ֥ה אֱלֹהֵֽי/נוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/037.yaml
  text: Only you did not come near the land of the sons of Ammon[a], all along the bank of the Jabbok, and the cities of the hill country[c][b], and all that Yahweh our God had commanded.
translation:
  language: ta
  text: ஆனால், அம்மோனியரின் நாட்டுக்கு[a], யாப்போக்கு நீரோடையின் கரையோரப் பகுதி முழுவதற்கும்[b], மலைநாட்டின் நகரங்களுக்கும், நம் கடவுளாகிய யாவே கட்டளையிட்ட அனைத்திற்கும்[c] நீ நெருங்கவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'சொல்லுக்கு சொல்: ‘அம்மோனின் மக்களின் நாடு.’'
    reason: lexical_alternative
  - marker: b
    text: 'சொல்லுக்கு சொல்: ‘யாப்போக்கு நீரோடையின் கை முழுவதும்.’ இங்கு ‘கை’ என்பது நீரோடையின் பக்கம், கரை, அல்லது அதை ஒட்டிய பகுதியைக் குறிக்கும் மரபுத்தொடர்.'
    reason: cultural_note
  - marker: c
    text: 'எபிரெயத்தில்: ‘நம் கடவுளாகிய யாவே கட்டளையிட்ட அனைத்தும்.’ அந்தக் கட்டளை குறிப்பாக எந்த இடங்கள் அல்லது காரியங்களைச் சார்ந்தது என்பது வெளிப்படையாகக் கூறப்படவில்லை.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רַק
  choice: ஆனால்
  rationale: முந்தைய வெற்றிகளின் சுருக்கத்துக்கு விதிவிலக்கை அறிமுகப்படுத்துகிறது; தமிழில் ‘ஆனால்’ இயல்பாக அந்த மாறுபாட்டைக் காட்டுகிறது.
- source_word: אֶל אֶרֶץ בְּנֵי עַמּוֹן
  choice: அம்மோனியரின் நாட்டை
  rationale: ‘அம்மோனின் மக்களின் நாடு’ என்ற எபிரெயக் கட்டமைப்பை நவீன தமிழில் இயல்பாகவும் தெளிவாகவும் வழங்குகிறது; சொல்லடித் தோற்றம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: לֹא קָרַבְתָּ
  choice: நீ நெருங்கவில்லை
  rationale: קרב என்பதன் இடம்சார்ந்த ‘அருகில் செல்லுதல்/நெருங்குதல்’ என்ற பொருளைப் பேணுகிறது; தாக்குதல் என்று மிகையாக விளக்கவில்லை.
- source_word: כָּל יַד נַחַל יַבֹּק
  choice: யாப்போக்கு நீரோடையின் கரையோரப் பகுதி முழுவதையும்
  rationale: நீரோடையுடன் வரும் ‘கை’ என்ற எபிரெய மரபுத்தொடர் அதன் பக்கம், கரை, அல்லது அதை ஒட்டிய பகுதியைக் குறிக்கிறது.
- source_word: וְעָרֵי הָהָר
  choice: மலைநாட்டின் நகரங்களையும்
  rationale: הָהָר இங்கு தனியொரு மலையைவிட உயர்நில அல்லது மலைப்பாங்கான பிரதேசத்தைக் குறிக்கிறது.
- source_word: וְכֹל אֲשֶׁר צִוָּה
  choice: கட்டளையிட்டிருந்த அனைத்தையும்
  rationale: எபிரெயத்தில் கட்டளையின் குறிப்பிட்ட பொருள் வெளிப்படையாகச் சொல்லப்படவில்லை; அதைக் கூடுதலாக நிரப்பாமல் அதன் விரிவையும் தெளிவின்மையையும் பேணுகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைப் பெயரான நான்கு எழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: אֱלֹהֵינוּ
  choice: நம் கடவுள்
  rationale: முதலாம் நபர் பன்மை உடைமையைக் கொண்ட உடன்படிக்கைச் சொல்லாக்கத்தை நேராக வழங்குகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் பட்டமல்ல, இறைவனின் தனிப்பெயரான יהוה நேரடியாக உள்ளது; ஆகவே தனிப்பெயர் ஒலிபெயர்க்கப்படுகிறது.
- issue: וְכֹל אֲשֶׁר צִוָּה என்பதில் மறைந்துள்ள கட்டளையின் பொருள்
  choice: ‘கட்டளையிட்டிருந்த அனைத்தையும்’ என்று பொருளை வெளிப்படையாக நிரப்பாமல் விடுதல்
  alternative: ‘நெருங்கக்கூடாது என்று கட்டளையிட்ட எல்லா இடங்களையும்’
  rationale: சூழல் தடைசெய்யப்பட்ட இடங்களைச் சுட்டலாம்; ஆனால் எபிரெயத்தில் ‘நெருங்கக்கூடாது’ அல்லது ‘இடங்கள்’ என்பவை வெளிப்படையாக இல்லை. எனவே உள்ளார்ந்த இறையியல்/சூழல் முடிவை முதன்மை உரையில் சேர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகருக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. கூட்டாகிய இஸ்ரவேலை நோக்கும் எபிரெய ஒருமை இரண்டாம் நபர் ‘நீ’ எனப் பேணப்பட்டுள்ளது. பட்டியலின் நீளத்தால் தமிழில் வாக்கியம் தெளிவாக இருக்க ‘நீ நெருங்கவில்லை’ இறுதியில் மீண்டும் கூறப்பட்டுள்ளது.
