  source_fidelity: 'மூலத்தின் முக்கிய கூறுகள் சரியாக உள்ளன: அம்மோனியர் நாடு, யாப்போக்கு நீரோடையை ஒட்டிய பகுதி, மலைநாட்டின் நகரங்கள், யாவே என்ற இறைப் பெயர் ஆகியவை நம்பகமாக வழங்கப்பட்டுள்ளன. ஆனால் வாக்கியத்தின் நடுவில் ‘நீ நெருங்கவில்லை’ என்று கூறிவிட்டு இறுதியில் மீண்டும் அதையே கூறுவது, எபிரெயத்தில் ஒரே வினையால் ஆளப்படும் தொடரைத் தமிழில் தேவையின்றி உடைக்கிறது. இறுதிப் பகுதியை ‘கட்டளையிட்ட அனைத்திற்கும்’ என அமைப்பது, கட்டளையின் குறிப்பிட்ட பொருளைச் சேர்க்காமல் மூலத்தின் சுருக்கத்தைப் பேணுகிறது.'
