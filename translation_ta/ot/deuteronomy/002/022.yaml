  text: כַּ/אֲשֶׁ֤ר עָשָׂה֙ לִ/בְנֵ֣י עֵשָׂ֔ו הַ/יֹּשְׁבִ֖ים בְּ/שֵׂעִ֑יר אֲשֶׁ֨ר הִשְׁמִ֤יד אֶת הַ/חֹרִי֙ מִ/פְּנֵי/הֶ֔ם וַ/יִּֽירָשֻׁ/ם֙ וַ/יֵּשְׁב֣וּ תַחְתָּ֔/ם עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/022.yaml
  text: just as he did for the sons of Esau who live in Seir[a], when he destroyed the Horites from before them[c][b], and they dispossessed them and settled in their place to this day.
translation:
  language: ta
  text: சேயீரில் வாழும் ஏசாவின் சந்ததியினருக்காக அவர் செய்ததுபோலவே, அவர் அவர்களுக்கு முன்னிலையிலிருந்து ஓரியர்களை அழித்தார்; அவர்கள் அவர்களை வெளியேற்றி, அவர்களுடைய இடத்தில் இன்றுவரை குடியிருந்து வருகிறார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அவர்களை வெளியேற்றி” என்பதற்கு மாற்றாக, எபிரெயத்தில் “அவர்களை உடைமையாக்கினர்” என்றும் மொழிபெயர்க்கலாம். இச்சூழலில், ஓரியர்களை இடம்பெயரச் செய்து அவர்களுடைய இடத்தை ஏசாவின் சந்ததியினர் கைப்பற்றினர் என்பதே பொருள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּאֲשֶׁר עָשָׂה
  choice: அவர் செய்ததுபோலவே
  rationale: முந்தைய வசனத்தில் கூறப்பட்ட ஆண்டவரின் செயலைக் குறிப்பாக விளக்காமல், எபிரெய ஒப்பீட்டு அமைப்பை இயல்பான தமிழில் காக்கிறது.
- source_word: לִבְנֵי עֵשָׂו
  choice: ஏசாவின் சந்ததியினருக்காக
  rationale: இங்கு ‘மகன்கள்’ என்பது இனவழிச் சந்ததியினரைக் குறிக்கிறது; நவீன தமிழில் பொருள் தெளிவாக இருக்க ‘சந்ததியினர்’ பயன்படுத்தப்பட்டது.
- source_word: הַיֹּשְׁבִים בְּשֵׂעִיר
  choice: சேயீரில் வாழும்
  rationale: தொடர்ந்து அங்கு வசிப்பதைக் குறிக்கும் பங்கேற்பு வடிவத்தை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: הִשְׁמִיד
  choice: அழித்தார்
  rationale: முழுமையான அழிவைச் சுட்டும் வலுவான காரணவினையின் தீவிரத்தை மிகைப்படுத்தாமல் வெளிப்படுத்துகிறது.
- source_word: הַחֹרִי
  choice: ஓரியர்கள்
  rationale: மக்கள் இனப் பெயரின் வழக்கமான தமிழ் ஒலிபெயர்ப்பு.
- source_word: מִפְּנֵיהֶם
  choice: அவர்களுக்கு முன்பாக இருந்த
  rationale: சொல்லுக்கு சொல் ‘அவர்களுக்கு முன்பாக இருந்து’ என்ற எபிரெய மரபுத்தொடர், சூழலில் அவர்களுடைய முன்னிலையிலும் நிலப்பகுதியிலும் இருந்ததைக் குறிக்கிறது; தமிழில் புரியத்தக்க வகையில் தரப்பட்டுள்ளது.
- source_word: וַיִּירָשֻׁם
  choice: அவர்களைத் துரத்திவிட்டு அவர்களுடைய நாட்டைக் கைப்பற்றி
  rationale: ירשׁ என்பதன் இச்சூழலிலான பொருள் முந்தைய குடிகளை வெளியேற்றி அவர்கள் நிலத்தை உடைமையாக்குதல். நேரடி ‘அவர்களைச் சுதந்தரித்தார்கள்’ என்பது தமிழில் தவறாகப் புரியும் என்பதால் செயற்பொருள் வெளிப்படுத்தப்பட்டது.
- source_word: וַיֵּשְׁבוּ תַחְתָּם
  choice: அவர்களுக்குப் பதிலாக அங்கே குடியிருக்கிறார்கள்
  rationale: முந்தைய குடிகளின் இடத்தில் நிலையான வசிப்பைத் தொடங்கியதையும் அது தொடர்வதையும் இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: இன்றுவரை
  rationale: எபிரெய காலக் குறிப்பின் வழக்கமான, சுருக்கமான தமிழ் வடிவம்.
theological_decisions:
- issue: ‘செய்தார்’, ‘அழித்தார்’ ஆகிய ஒருமை வினைகளின் மறைமுக எழுவாய்
  choice: உடனடிச் சூழலின்படி ஆண்டவரைக் குறிக்கும் ‘அவர்’ என மொழிபெயர்க்கப்பட்டது.
  alternative: எழுவாயைப் பெயரிடாமல், சூழலிலிருந்து மட்டும் உணர விடுதல்.
  rationale: எபிரெய வினைகள் ஆண்பால் ஒருமையில் உள்ளன; முந்தைய வசனச் சூழலில் அவை ஆண்டவரின் செயலைக் குறிக்கின்றன. ‘அவர்’ என்பது அந்தத் தொடர்பைத் தெளிவாக்குகிறது; ‘ஆண்டவர்’ என்ற பெயரை இவ்வசனத்துக்குள் புதிதாகச் சேர்க்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழ்; மரியாதையும் வேதாகமப் பாங்கும் காக்கப்பட்டுள்ளன. மிகப் பழமையான ‘வாசம்பண்ணினர்’ போன்ற சொற்களைத் தவிர்த்து, சாதாரண வாசகர்களுக்குப் புரியும் ‘வாழும்’, ‘குடியிருக்கிறார்கள்’ ஆகியவை பயன்படுத்தப்பட்டன. வசனம் முந்தைய வாக்கியத்துடன் தொடர்வதால் தொடக்க ஒப்பீட்டு அமைப்பு பாதுகாக்கப்பட்டது.
