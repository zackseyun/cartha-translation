  source_fidelity: திருத்தம் தேவை. வரைவு ירשׁ வினையின் இடப்பெயர்வு/உடைமையாக்கல் பொருளை நன்கு விளக்குகிறது; ஆனால் முதன்மை உரையில் “அவர்களுடைய நாட்டைக் கைப்பற்றி” என்பது எபிரெயத்தில் வெளிப்படையாக இல்லாத ‘நாடு’ என்பதைச் சேர்க்கிறது. மேலும் “குடியிருக்கிறார்கள்” என்பது நிகழ்காலமாக இருப்பதால், கடந்த நிகழ்வையும் ‘இன்றுவரை’ தொடர்வதையும் இணைக்கும் வடிவம் சிறந்தது.
  naturalness: நவீனத் தரத் தமிழில் வாசிக்கத் தகுந்தது. “அவர்களுக்கு முன்பாக இருந்த” என்பதற்குப் பதிலாக “அவர்களுக்கு முன்னிலையிலிருந்து” என்பது מִפְּנֵיהֶם என்ற எபிரெய மரபுத்தொடரின் நீக்கப்படுதல்/முன்னிலையிலிருந்து அகற்றப்படுதல் என்ற கருத்தை இயல்பாகத் தருகிறது. “குடியிருந்து வருகிறார்கள்” கடந்தகாலக் குடியேற்றத்தின் தொடர்ச்சியைத் தெளிவாக்குகிறது.
  terminology: “சேயீர்,” “ஏசா,” “ஓரியர்கள்” ஆகிய பெயர்கள் சீராக உள்ளன. “வெளியேற்றி” என்பது இச்சூழலில் וַיִּירָשֻׁם என்பதன் ‘அவர்களை இடம்பெயரச் செய்து அவர்களுடைய இடத்தைப் பெற்றுக்கொள்ளுதல்’ என்ற பொருளுக்கு ஏற்றது; பொருளில் இல்லாத ‘நாடு’ முதன்மை உரையிலிருந்து நீக்கப்பட வேண்டும்.
