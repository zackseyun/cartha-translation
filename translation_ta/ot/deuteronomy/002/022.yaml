  to: சேயீரில் வாழும் ஏசாவின் சந்ததியினருக்காக அவர் செய்ததுபோலவே, அவர் அவர்களுக்கு முன்னிலையிலிருந்து ஓரியர்களை அழித்தார்; அவர்கள் அவர்களை வெளியேற்றி, அவர்களுடைய இடத்தில் இன்றுவரை குடியிருந்து வருகிறார்கள்.[a]
