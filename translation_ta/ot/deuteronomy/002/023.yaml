  text: וְ/הָֽ/עַוִּ֛ים הַ/יֹּשְׁבִ֥ים בַּ/חֲצֵרִ֖ים עַד עַזָּ֑ה כַּפְתֹּרִים֙ הַ/יֹּצְאִ֣ים מִ/כַּפְתּ֔וֹר הִשְׁמִידֻ֖/ם וַ/יֵּשְׁב֥וּ תַחְתָּֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/023.yaml
  text: As for the Avvim[a], who lived in villages as far as Gaza, the Caphtorim, who came out from Caphtor[b], destroyed them and settled in their place.
translation:
  language: ta
  text: காசா வரையிலும் குடியிருப்புகளில் வாழ்ந்த அவ்வீமியரை[a] கப்தோரிலிருந்து வந்த கப்தோரியர் அழித்து, அவர்களுடைய இடத்தில் குடியேறினார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அவ்வீம் மக்கள்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: הָעַוִּים
  choice: ஆவ்வீமியர்
  rationale: மக்களினப் பெயரைத் தமிழில் ஒலிபெயர்த்து, மக்கள் குழுவைக் குறிக்கும் இயல்பான ‘-யர்’ முடிவுடன் வழங்குகிறது.
- source_word: הַיֹּשְׁבִים
  choice: வாழ்ந்த
  rationale: ישב இங்கு நிலையாக வசித்தலைக் குறிக்கிறது; நவீனத் தமிழில் இயல்பாக ‘வாழ்ந்த’ என்று மொழிபெயர்க்கப்படுகிறது.
- source_word: בַּחֲצֵרִים
  choice: குடியிருப்புகளில்
  rationale: חֲצֵרִים என்பது மதிலில்லா கிராமங்கள், சிற்றூர்கள் அல்லது முகாம்போன்ற வசிப்பிடங்களைக் குறிக்கலாம்; ‘குடியிருப்புகள்’ இந்தப் பரந்த பொருளை மிகையாகக் குறிப்பாக்காமல் காக்கிறது.
- source_word: עַד עַזָּה
  choice: காசா வரையிலும்
  rationale: עד குறிக்கும் புவியியல் எல்லையை இயல்பான தமிழில் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: כַּפְתֹּרִים
  choice: கப்தோரியர்
  rationale: மக்களினப் பெயரைத் தமிழில் ஒலிபெயர்த்து மக்கள் குழுவாக வழங்குகிறது.
- source_word: הַיֹּצְאִים מִכַּפְתּוֹר
  choice: கப்தோரிலிருந்து வந்த
  rationale: יצא என்பதன் புறப்பட்டு வருதல் என்ற இயக்கப் பொருளை வாசிக்க இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: הִשְׁמִידֻם
  choice: அழித்து
  rationale: Hiphil வடிவிலுள்ள שׁמד குறிக்கும் முற்றான அழித்தலை, தேவையற்ற சொல்லாற்றல் மிகையின்றி வலுவாகக் காட்டுகிறது.
- source_word: וַיֵּשְׁבוּ תַחְתָּם
  choice: அவர்களுடைய இடத்தில் குடியேறினார்கள்
  rationale: முந்தைய குடிகளுக்குப் பதிலாக அவர்களுடைய நிலத்தில் வசிக்கத் தொடங்கியதைக் தெளிவாகக் காட்டுகிறது.
theological_decisions: []
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான நடையைக் கடைப்பிடிக்கிறது. மக்களின மற்றும் இடப்பெயர்கள் எபிரேய ஒலிக்கு ஏற்றவாறு ஒலிபெயர்க்கப்பட்டுள்ளன. חֲצֵרִים என்பதன் பொருள் பரப்பைக் காக்க ‘குடியிருப்புகள்’ தேர்ந்தெடுக்கப்பட்டுள்ளது.
