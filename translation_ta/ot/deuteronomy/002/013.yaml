source:
  edition: WLC
  text: עַתָּ֗ה קֻ֛מוּ וְ/עִבְר֥וּ לָ/כֶ֖ם אֶת נַ֣חַל זָ֑רֶד וַֽ/נַּעֲבֹ֖ר אֶת נַ֥חַל זָֽרֶד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/013.yaml
  text: Now rise up and cross over the Wadi Zered[a]. So we crossed over the Wadi Zered.
translation:
  language: ta
  text: “இப்போது எழுந்து, சேரேத் ஓடையைக்[a] கடந்து செல்லுங்கள்.” ஆகவே நாங்கள் சேரேத் ஓடையைக் கடந்து சென்றோம்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது “சேரேத் பள்ளத்தாக்கு” அல்லது “சேரேத் ஓடைப்படுகை.” எபிரெயச் சொல்லான נחל, சூழலைப் பொறுத்து ஓடை, பருவகால நீர்வழி, பள்ளத்தாக்கு அல்லது ஓடைப்படுகையைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַתָּה
  choice: இப்போது
  rationale: அடுத்த கட்டப் பயணத்திற்கான கட்டளையை உடனடியாக அறிமுகப்படுத்தும் காலக் குறிப்பு; எபிரெயச் சொல்லின் நேரடியான உணர்வைப் பாதுகாக்கிறது.
- source_word: קֻמוּ
  choice: எழுந்து
  rationale: קום என்பதன் பன்மை ஏவல் வடிவம். தமிழில் அடுத்த ஏவல் வினையுடன் இயல்பாக இணைந்து கட்டளையின் வலிமையைத் தருகிறது.
- source_word: וְעִבְרוּ
  choice: கடந்து செல்லுங்கள்
  rationale: ஒரு பக்கத்திலிருந்து மறுபக்கத்திற்குச் செல்லும் עבר என்பதன் பயணச் சூழலிலான பொருளைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: לָכֶם
  choice: தனியாக மொழிபெயர்க்கப்படவில்லை
  rationale: இங்குள்ள நெறிசார்/வலியுறுத்தல் தத்துவேற்றுமை தமிழில் சொற்சொல்லாகத் தரப்பட்டால் இயல்பற்றதாகும்; ஏவல் வினையின் வலிமைக்குள் அதன் நயம் உள்ளடக்கப்பட்டுள்ளது.
- source_word: נַחַל
  choice: ஓடை
  rationale: நחל என்பது பள்ளத்தாக்கு, பருவகால நீரோடை, அல்லது ஓடைப்படுகையைக் குறிக்கலாம். இங்கு ‘ஓடை’ பொதுவாசகருக்கு இயல்பான புவியியல் சொல்லாக உள்ளது; பொருளின் பரப்பை அடிக்குறிப்பு பாதுகாக்கிறது.
- source_word: זָרֶד
  choice: சேரேத்
  rationale: இடப்பெயர் எபிரெய உச்சரிப்பை அணுகும் வகையில் தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: וַנַּעֲבֹר
  choice: ஆகவே நாங்கள் ... கடந்து சென்றோம்
  rationale: முதல் நபர் பன்மை தொடர் நிகழ்வை விவரித்து, கட்டளை நிறைவேற்றப்பட்டதைத் தெரிவிக்கிறது; ‘ஆகவே’ அந்த நிகழ்வுத் தொடரை இயல்பான தமிழில் காட்டுகிறது.
