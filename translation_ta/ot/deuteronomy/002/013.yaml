translation_notes:
  register: நவீனத் தரத் தமிழில், எளிதில் புரியக்கூடியதும் கண்ணியமானதுமான நடை பயன்படுத்தப்பட்டுள்ளது. நேரடிக் கட்டளை மேற்கோள் குறிகளுக்குள் தரப்பட்டு, அதனைத் தொடர்ந்து அதன் நிறைவேற்றம் கதைநடையில் கூறப்பட்டுள்ளது. ‘வாடி’ என்ற அயல்மொழிச் சொல்லுக்குப் பதிலாக இயல்பான ‘ஓடை’ பயன்படுத்தப்பட்டு, மூலச்சொல்லின் புவியியல் தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
