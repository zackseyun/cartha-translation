  register: நவீன நிலையான தமிழில் மரியாதையும் தூதரக வேண்டுகோளின் நயமும் காக்கப்பட்டுள்ளன. ‘உமது’ மற்றும் ‘அனுமதியும்’ ஆகியவை கண்ணியமான உரையாடல் நடையைத் தருகின்றன; எபிரெய இரட்டிப்பின் வலியுறுத்தல் ‘சாலையிலேயே’ என இயல்பாக வெளிப்படுத்தப்பட்டுள்ளது.
