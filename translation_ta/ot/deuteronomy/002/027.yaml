base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/027.yaml
  text: Let me pass through your land; I will go only by the road[a]. I will not turn aside to the right or to the left.
translation:
  language: ta
  text: “உமது நாட்டின் வழியாக நான் கடந்துசெல்ல அனுமதியுங்கள். நான் சாலையிலேயே[a] செல்வேன்; வலப்புறமோ இடப்புறமோ விலகமாட்டேன்.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'சொல்லுக்குச் சொல்: “சாலையில், சாலையில்.” இவ்வாறு இருமுறை கூறுவது, நான் குறிப்பிட்ட பாதையிலிருந்து சிறிதும் விலகாமல் செல்வேன் என்பதை வலியுறுத்துகிறது.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶעְבְּרָה
  choice: நான் கடந்துசெல்ல அனுமதியும்
  rationale: עבר என்பதன் முதலாம் நபர் ஒருமை cohortative வடிவம் இத்தூதரகச் சூழலில் பணிவான வேண்டுகோளை வெளிப்படுத்துகிறது; சாதாரண எதிர்கால வாக்கியத்தைவிட இந்தத் தேர்வு அந்த நயத்தைத் தெளிவாகக் காட்டுகிறது.
- source_word: בְאַרְצֶךָ
  choice: உமது நாட்டின் வழியாக
  rationale: עבר என்பதுடன் வரும் ב இங்கு ஒரு நிலப்பரப்பினூடாகக் கடந்துசெல்வதைக் குறிக்கிறது; நவீன தமிழில் இது இயல்பானதும் தெளிவானதும் ஆகும்.
- source_word: בַּדֶּרֶךְ בַּדֶּרֶךְ
  choice: சாலையிலேயே
  rationale: எபிரெய மொழியின் சொல் இரட்டிப்பு குறிப்பிட்ட பாதையிலிருந்து விலகாமல் கண்டிப்பாகச் செல்வதை வலியுறுத்துகிறது; ‘-லேயே’ அந்த வலியுறுத்தலை இயல்பான தமிழில் தருகிறது.
- source_word: אֵלֵךְ
  choice: செல்வேன்
  rationale: הלך பயணச் சூழலில் பொதுவாகச் செல்லுதல் அல்லது முன்னேறுதல் என்று பொருள்படும்; ‘செல்வேன்’ தெளிவான நவீனத் தமிழ்.
- source_word: לֹא אָסוּר
  choice: விலகமாட்டேன்
  rationale: סור என்பது பாதையிலிருந்து விலகுதல் அல்லது திரும்புதல் என்பதைக் குறிக்கிறது; அடுத்து வரும் வலது–இடது திசைச்சொற்களுடன் ‘விலகமாட்டேன்’ இயல்பாகப் பொருந்துகிறது.
- source_word: יָמִין וּשְׂמֹאול
  choice: வலப்புறமோ இடப்புறமோ
  rationale: எந்தத் திசையிலும் பாதையைவிட்டு விலகாமையைச் சுட்டும் நிலையான திசை வெளிப்பாட்டைத் தமிழில் முழுமையாகப் பாதுகாக்கிறது.
