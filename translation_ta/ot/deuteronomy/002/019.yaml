source:
  edition: WLC
  text: וְ/קָרַבְתָּ֗ מ֚וּל בְּנֵ֣י עַמּ֔וֹן אַל תְּצֻרֵ֖/ם וְ/אַל תִּתְגָּ֣ר בָּ֑/ם כִּ֣י לֹֽא אֶ֠תֵּן מֵ/אֶ֨רֶץ בְּנֵי עַמּ֤וֹן לְ/ךָ֙ יְרֻשָּׁ֔ה כִּ֥י לִ/בְנֵי ל֖וֹט נְתַתִּ֥י/הָ יְרֻשָּֽׁה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/019.yaml
  text: When you come opposite the sons of Ammon[a], do not harass them or provoke them, for I will not give you any of the land of the sons of Ammon as a possession[c][b], because I have given it as a possession to the sons of Lot.
translation:
  language: ta
  text: அம்மோனின் மக்களுக்கு[a] எதிரே நீ நெருங்கி வரும்போது, அவர்களைத் துன்புறுத்தாதே[b]; அவர்களோடு பகைத் தகராறில் ஈடுபடாதே. ஏனெனில், அம்மோனின் மக்களுடைய நாட்டின் எந்தப் பகுதியையும் உனக்கு உடைமையாக[c] கொடுக்கமாட்டேன்; அதை லோத்தின் மக்களுக்கு உடைமையாகக் கொடுத்திருக்கிறேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அம்மோனியர்.’ இவ்வசனம் முழுவதிலும் இவ்வாறே மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘அவர்களைத் தாக்காதே’ அல்லது ‘அவர்களை முற்றுகையிடாதே.’ எபிரேயச் சொல் முறையான முற்றுகையை மட்டுமல்லாமல் பகைமையான நடவடிக்கையைப் பரந்த விதத்தில் குறிக்கக்கூடும்.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, ‘சுதந்தரமாக.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְקָרַבְתָּ מוּל
  choice: எதிரே நீ நெருங்கி வரும்போது
  rationale: קָרַב என்பதன் அணுகுதல் என்ற பொருளையும், מוּל என்பதன் எதிரே அல்லது முகமாக என்ற இடஞ்சார்ந்த பொருளையும் இயல்பான தமிழில் காக்கிறது.
- source_word: בְּנֵי עַמּוֹן
  choice: அம்மோனின் மக்கள்
  rationale: தேசியக் குழுவைக் குறிக்கும் எபிரேய உறவுமுறைச் சொல்லான בְּנֵי-ஐ தமிழில் இயல்பாகவும் அதன் வம்சத் தொடர்பை மறைக்காமலும் வழங்குகிறது.
- source_word: אַל תְּצֻרֵם
  choice: அவர்களைத் துன்புறுத்தாதே
  rationale: இந்தச் சூழலில் பகைமையான அழுத்தம் அல்லது தாக்குதல் எனும் பரந்த பொருளைத் தருகிறது; ‘முற்றுகையிடாதே’ என்று மட்டும் கூறுவது பொருளை மிகக் குறுகச் செய்யலாம்.
- source_word: וְאַל תִּתְגָּר בָּם
  choice: அவர்களோடு சண்டையைத் தூண்டாதே
  rationale: גרה என்பதன் தன்னிலை வடிவம் மோதலைக் கிளப்புதல் அல்லது பகை நடவடிக்கையில் இறங்குதல் என்ற பொருளைக் கொண்டது; மூலத்தில் இல்லாத ‘போருக்கு’ என்ற சொல்லைச் சேர்க்காமல் இராணுவச் சூழலை உணர்த்துகிறது.
- source_word: מֵאֶרֶץ בְּנֵי עַמּוֹן
  choice: அம்மோனின் மக்களுடைய நாட்டில் எதையும்
  rationale: மறுப்பு வாக்கியத்தில் מִן தரும் பகுதியளவு பொருளை, அந்த நாட்டின் எந்தப் பகுதியும் கொடுக்கப்படாது எனத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: יְרֻשָּׁה
  choice: உடைமையாக
  rationale: நிலம் அளிக்கப்படும் இச்சூழலில் உரிமையுடன் பெற்ற நிலப்பகுதி என்ற பொருளைத் தெளிவாகத் தருகிறது; ‘சுதந்தரம்’ என்பதும் சாத்தியமானது.
- source_word: לִבְנֵי לוֹט
  choice: லோத்தின் மக்கள்
  rationale: எபிரேய உறவுமுறை அமைப்பையும் லோத்துடன் உள்ள வம்சத் தொடர்பையும் இயல்பான நவீன தமிழில் காக்கிறது.
- source_word: נְתַתִּיהָ
  choice: அதைக் ... கொடுத்திருக்கிறேன்
  rationale: முன்பே நிறைவேற்றப்பட்டு இப்போதும் செல்லுபடியாகும் இறை அளிப்பைத் தமிழ் நிறைவுக்கால வடிவம் உணர்த்துகிறது.
theological_decisions:
- issue: בְּנֵי என்ற உறவுமுறைச் சொல்லை தேசிய அடையாளத்தில் வழங்குதல்
  choice: அம்மோனின் மக்கள் / லோத்தின் மக்கள்
  alternative: அம்மோனியர் / லோத்தின் சந்ததியினர்
  rationale: மூலத்தின் வம்ச மற்றும் குடும்பச் சாயலைக் காக்கிறது; அதே நேரத்தில் ‘மகன்கள்’ என்ற சொல்லால் தமிழில் ஏற்படக்கூடிய உடனடி உயிரியல் மகன்கள் என்ற தவறான புரிதலைத் தவிர்க்கிறது.
- issue: יְרֻשָּׁה என்பதன் நில உரிமைப் பொருள்
  choice: உடைமை
  alternative: சுதந்தரம்
  rationale: இங்கு வலியுறுத்தப்படுவது கடவுள் ஒதுக்கிக் கொடுத்த நிலத்தின் உரிமை. ‘உடைமை’ அதை நேரடியாகக் கூறுகிறது; ‘சுதந்தரம்’ என்ற குடும்ப வாரிசுரிமைச் சாயலையும் அடிக்குறிப்பு மூலம் திறந்துவைக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், ஒருமை இரண்டாம் நபர் கட்டளையையும் கண்ணியமான வேதாகம நடையையும் காக்கும் மொழிநடை. தேவையற்ற பழமையான சொற்கள் தவிர்க்கப்பட்டுள்ளன; மூலத்தின் வம்சத் தொடர்பும் நிலம் அளிக்கப்பட்டதன் இறையியல் பதற்றமும் தெளிவாக வைக்கப்பட்டுள்ளன.
