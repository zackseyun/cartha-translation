translation_notes:
  register: நவீன பொதுத்தமிழில் புரியக்கூடிய, ஆனால் வேதாகம உரைக்கு ஏற்ற கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘விற்பாயாக/கொடுப்பாயாக/அனுமதிப்பாயாக’ என்பவை கட்டளையாக மட்டுமல்லாமல் பணிவான வேண்டுகோளாகவும் ஒலிக்கின்றன. எபிரேய இணைப்புவாக்கியங்களின் நோக்கம்–விளைவு ambiguity அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
