base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/028.yaml
  text: You may sell me food for silver[a], so that I may eat, and give me water for silver, so that I may drink[b]; only let me pass through on my feet—
translation:
  language: ta
  text: நான் சாப்பிடுவதற்கு உணவை வெள்ளிப் பணத்திற்கு[a] எனக்கு விற்பாயாக; நான் குடிப்பதற்குத் தண்ணீரையும் வெள்ளிப் பணத்திற்கு எனக்குக் கொடுப்பாயாக. நான் நடந்தே[c] கடந்து செல்ல மட்டும் என்னை அனுமதிப்பாயாக—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘பணத்திற்கு.’ எபிரேயத்தில் நேரடியாக, ‘வெள்ளிக்கு/வெள்ளியால்.’
    reason: lexical_alternative
  - marker: c
    text: அல்லது, ‘என் கால்களால்.’ எபிரேயத்தில் நேரடியாக, ‘என் கால்களால்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹכֶל
  choice: உணவு
  rationale: இது அப்பம் அல்லது தானியம் என்று குறுக்கப்படாத பொதுவான உணவைக் குறிக்கிறது.
- source_word: בַּכֶּסֶף
  choice: வெள்ளிப் பணத்திற்கு
  rationale: கட்டணத்தைக் குறிக்கும் வேற்றுமைப் பொருளையும், כֶּסֶף என்பதன் நேரடியான ‘வெள்ளி’ என்ற பொருளையும் இயன்றவரை தக்கவைக்கிறது; நவீன தமிழில் வெறும் ‘வெள்ளிக்கு’ என்பதைவிட இது தெளிவானது.
- source_word: תַּשְׁבִּרֵנִי
  choice: எனக்கு விற்பாயாக
  rationale: இந்தச் சூழலில் שׁבר என்பதன் ஹிபீல் வடிவம் உணவை விற்பதைக் குறிக்கிறது; வேண்டுகோளின் தொனியை ‘விற்பாயாக’ வெளிப்படுத்துகிறது.
- source_word: וְאָכַלְתִּי
  choice: நான் சாப்பிடுவதற்கு
  rationale: இணைப்புடன் வரும் நிறைவுவினை இங்கு கோரிக்கையின் நோக்கம் அல்லது எதிர்பார்க்கப்படும் விளைவைக் குறிக்கிறது; தமிழில் நோக்கவாக்கியமாக இயல்பாக வழங்கப்பட்டுள்ளது.
- source_word: וּמַיִם
  choice: தண்ணீரையும்
  rationale: அன்றாட நவீன தமிழில் இயல்பான நேரடி இணைச்சொல்; ‘-உம்’ உணவு மற்றும் தண்ணீர் கோரிக்கைகளை இணைக்கிறது.
- source_word: תִּתֶּן לִי
  choice: எனக்குக் கொடுப்பாயாக
  rationale: נתן + ל அமைப்பை நேரடியாகவும், வேண்டுகோளுக்கேற்ற மரியாதையான தொனியுடனும் வழங்குகிறது.
- source_word: וְשָׁתִיתִי
  choice: நான் குடிப்பதற்கு
  rationale: וְאָכַלְתִּי போலவே நோக்கம் அல்லது எதிர்பார்க்கப்படும் விளைவாகப் புரிந்துகொள்ளப்பட்டு இயல்பான தமிழில் வழங்கப்பட்டுள்ளது.
- source_word: רַק
  choice: மட்டும்
  rationale: கோரிக்கையின் வரம்பைத் தெளிவாகக் காட்டும் இயல்பான தமிழ் சொல்.
- source_word: אֶעְבְּרָה
  choice: கடந்து செல்ல ... என்னை அனுமதிப்பாயாக
  rationale: கோஹார்டேட்டிவ் வடிவத்தின் அனுமதி கோரும் நுணுக்கத்தைப் பாதுகாக்கிறது; வெறும் எதிர்காலக் கூற்றாக மாற்றவில்லை.
- source_word: בְרַגְלָי
  choice: என் கால்களால்
  rationale: ‘என் கால்களின்மேல்/என் கால்களால்’ என்ற எபிரேய மொழியின் உருவகமிக்க நேரடித் தொடரைத் தக்கவைக்கிறது; இயல்பான தமிழில் ‘நடந்தே’ என்பதும் சாத்தியம்.
