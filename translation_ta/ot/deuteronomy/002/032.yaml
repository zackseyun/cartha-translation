base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/032.yaml
  text: Then Sihon came out to meet us[a], he and all his people[b], for battle at Jahaz.
translation:
  language: ta
  text: அப்போது சீகோன் தன் மக்கள் அனைவருடனும் எங்களை எதிர்த்துப் போரிட யாகாசுக்கு புறப்பட்டு வந்தான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: புறப்பட்டு வந்தான்
  rationale: יצא என்பதன் ‘வெளியே புறப்படுதல்’ என்ற இயக்கத்தையும், உரையாற்றுபவர்களின் நோக்குநிலையிலிருந்து அவன் அவர்களை நோக்கி வந்ததையும் இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: סִיחֹן
  choice: சீகோன்
  rationale: எபிரெய தனிப்பெயரின் ஒலியை நவீனத் தமிழில் இயல்பாக ஒலிபெயர்க்கிறது.
- source_word: לִקְרָאתֵנוּ
  choice: எங்களை எதிர்த்து
  rationale: சொல்லடியாக ‘எங்களைச் சந்திக்க’ என்றாலும், போருக்காக வந்த சூழலில் எதிர்ப்பான சந்திப்பைக் குறிக்கிறது; தமிழில் ‘எங்களை எதிர்த்து’ அந்தப் பொருளைத் தெளிவாகத் தருகிறது.
- source_word: הוּא וְכָל־עַמּוֹ
  choice: தன் மக்கள் அனைவருடனும்
  rationale: சீகோனும் அவனுடைய மக்கள் அனைவரும் சேர்ந்துவந்ததை இயல்பான தமிழில் தெரிவிக்கிறது; עַם என்பதை ‘படை’ என்று குறுக்காமல் ‘மக்கள்’ எனப் பாதுகாக்கிறது.
- source_word: לַמִּלְחָמָה
  choice: போரிட
  rationale: இச்சொற்றொடர் நோக்கத்தைக் குறிப்பிடுவதால், ‘போரிட’ என்பது சுருக்கமாகவும் இயல்பாகவும் உள்ளது.
- source_word: יָהְצָה
  choice: யாகாசில்
  rationale: இடப்பெயரை எபிரெய உச்சரிப்பிற்கு அண்மையாக ஒலிபெயர்த்து, இடத்தைக் குறிக்கும் ‘-இல்’ உருபைச் சேர்க்கிறது.
theological_decisions: []
translation_notes:
  register: நவீனத் தரத் தமிழில், எளிமையும் கண்ணியமும் கொண்ட வரலாற்றுக் கதைநடை. மூலத்தின் இராணுவச் சூழல் தெளிவாக வைக்கப்பட்டு, ‘மக்கள்’ என்பது ‘படை’ எனக் குறுக்கப்படவில்லை.
