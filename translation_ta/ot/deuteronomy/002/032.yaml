revisions:
- from: அப்போது சீகோன் தன் மக்கள் அனைவருடனும் யாகாசில் எங்களை எதிர்த்துப் போரிடப் புறப்பட்டு வந்தான்.
  to: அப்போது சீகோன் தன் மக்கள் அனைவருடனும் எங்களை எதிர்த்துப் போரிட யாகாசுக்கு புறப்பட்டு வந்தான்.
