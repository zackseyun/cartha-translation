  text: Then Yahweh said to me[a], saying,
translation:
  language: ta
  text: அப்போது யாவே என்னிடம் கூறினார்:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் இறுதியாக வரும் “சொல்லி” என்னும் சொல் அடுத்த வசனத்தில் வரும் பேச்சை அறிமுகப்படுத்துகிறது. தமிழில் அது இரட்டைப்புள்ளியால் காட்டப்பட்டுள்ளது.
    reason: மூலமொழியின் பேச்சை அறிமுகப்படுத்தும் கட்டமைப்பை விளக்குதல்
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: அப்போது … கூறினார்
  rationale: வாவ் தொடர்வினை கதையின் அடுத்த நிகழ்வை முன்னெடுக்கிறது. நவீனத் தமிழில் ‘அப்போது’ அந்தத் தொடர்ச்சியை இயல்பாக வெளிப்படுத்துகிறது; ‘கூறினார்’ என்பது אָמַר என்பதன் எளிய பேச்சுவினைப் பொருளைப் பாதுகாக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய மெய்யெழுத்துப் பெயரான יהוה-ஐ ஒரு பட்டப்பெயரால் மாற்றாமல், தேவனுடைய தனிப்பெயராகத் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: אֵלַי
  choice: என்னிடம்
  rationale: אֶל என்னும் முன்னிடைச்சொல்லும் முதலாம் நபர் ஒருமை பின்னொட்டும் சேர்ந்து ‘என்னிடம்’ என்று நேரடியாகப் பொருள்படுகின்றன.
- source_word: לֵאמֹר
  choice: 'இவ்வாறு கூறினார்:'
  rationale: இந்த வினையெச்சம் அடுத்த வசனத்தில் வரும் நேரடிப் பேச்சை அறிமுகப்படுத்துகிறது. ‘இவ்வாறு’ மற்றும் இரட்டைப்புள்ளி அதன் செயலையும் பொருளையும் இயல்பான தமிழில் வெளிப்படுத்துகின்றன.
theological_decisions:
- issue: יהוה என்னும் தெய்வீகப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலவசனம் ஒரு பட்டப்பெயரை அல்ல, יהוה என்னும் தனிப்பெயரையே பயன்படுத்துகிறது. ஆகவே அதை ‘கர்த்தர்’ என்று மாற்றாமல் ‘யாவே’ என்று ஒலிபெயர்ப்பது மூலத்தின் வேறுபாட்டைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் மரியாதைமிக்க நடையிலும் வடிவமைக்கப்பட்டது. அடுத்த வசனத்தில் தொடரும் நேரடிப் பேச்சைத் தெளிவாகச் சுட்ட இரட்டைப்புள்ளி பயன்படுத்தப்பட்டுள்ளது.
