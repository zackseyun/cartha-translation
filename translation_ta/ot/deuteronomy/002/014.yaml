source:
  edition: WLC
  text: וְ/הַ/יָּמִ֞ים אֲשֶׁר הָלַ֣כְנוּ מִ/קָּדֵ֣שׁ בַּרְנֵ֗עַ עַ֤ד אֲשֶׁר עָבַ֨רְנוּ֙ אֶת נַ֣חַל זֶ֔רֶד שְׁלֹשִׁ֥ים וּ/שְׁמֹנֶ֖ה שָׁנָ֑ה עַד תֹּ֨ם כָּל הַ/דּ֜וֹר אַנְשֵׁ֤י הַ/מִּלְחָמָה֙ מִ/קֶּ֣רֶב הַֽ/מַּחֲנֶ֔ה כַּ/אֲשֶׁ֛ר נִשְׁבַּ֥ע יְהוָ֖ה לָ/הֶֽם־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/014.yaml
  text: And the days that we traveled from Kadesh-barnea until we crossed the Wadi Zered were thirty-eight years[a], until the entire generation of the men of war had come to an end from the midst of the camp, just as Yahweh had sworn to them.
translation:
  language: ta
  text: காதேஸ்-பர்னேயாவிலிருந்து நாங்கள் புறப்பட்டுச் செரேத் நீரோடையைக்[a] கடக்கும் வரையிலான காலம் முப்பத்தெட்டு ஆண்டுகள். அந்தக் காலத்தில், போரிடும் ஆண்களாகிய அந்தத் தலைமுறையினர் அனைவரும் முகாமின் நடுவிலிருந்து முற்றிலும் ஒழிந்துபோனார்கள்; யாவே அவர்களுக்குச் சத்தியமிட்டபடியே.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘செரேத் பள்ளத்தாக்கு’ அல்லது ‘செரேத் ஓடை’ என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் பருவகால நீரோடை, அதன் படுகை, அல்லது சிற்றாறு ஆகியவற்றைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַיָּמִים
  choice: வரையிலான காலம்
  rationale: சொல்லுக்கு நேர் பொருள் ‘நாட்கள்’ என்றாலும், இங்கு பயணத்தின் மொத்தக் கால அளவை அறிமுகப்படுத்துவதால் இயல்பான தமிழில் ‘காலம்’ என வழங்கப்பட்டது.
- source_word: הָלַכְנוּ
  choice: நாங்கள் புறப்பட்டு
  rationale: பயணப் பாதைச் சூழலில் ‘சென்றோம்/பயணித்தோம்’ என்ற பொருள்; தொடக்க இடத்திலிருந்து நகர்ந்ததை இயல்பாகக் காட்ட ‘புறப்பட்டு’ என வழங்கப்பட்டது.
- source_word: מִקָּדֵשׁ בַּרְנֵעַ
  choice: காதேஸ்-பர்னேயாவிலிருந்து
  rationale: எபிரெய இடப்பெயரின் தமிழாக்க ஒலிபெயர்ப்பு.
- source_word: עַד אֲשֶׁר עָבַרְנוּ
  choice: நாங்கள் ... கடக்கும் வரை
  rationale: நீர்ப்பாதையைத் தாண்டுவதைக் குறிக்கும் עבר என்பதற்கு ‘கடத்தல்’ இயல்பான தமிழ் இணை.
- source_word: נַחַל זֶרֶד
  choice: செரேத் நீரோடை
  rationale: נחל என்பது வறண்ட காலத்தில் உலரக்கூடிய ஓடைப் படுகை, நீரோடை, அல்லது சிற்றாறு ஆகியவற்றைக் குறிக்கலாம்; வாசிக்க எளிய முதன்மை உரைக்காக ‘நீரோடை’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: שְׁלֹשִׁים וּשְׁמֹנֶה שָׁנָה
  choice: முப்பத்தெட்டு ஆண்டுகள்
  rationale: எண்ணின் இயல்பான நவீனத் தமிழ் வடிவம்.
- source_word: עַד תֹּם
  choice: முற்றிலும் மறைந்துபோகும்வரை
  rationale: תֹּם நிறைவு அல்லது முடிவைச் சுட்டுகிறது; முகாமிலிருந்து அந்தத் தலைமுறை ஒழிந்துபோனதைத் தமிழில் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: כָּל הַדּוֹר
  choice: அந்தத் தலைமுறையினர் அனைவரும்
  rationale: கூட்டுத் தலைமுறையைக் குறிக்கும் எபிரெயச் சொற்றொடரின் இயல்பான தமிழ் வடிவம்.
- source_word: אַנְשֵׁי הַמִּלְחָמָה
  choice: போர்வீரர்களான
  rationale: சொல்லடியாக ‘போரின் ஆண்கள்’; சூழலில் போரிடத் தகுதியான ஆண்களைக் குறிக்கும் சுருக்கமான, இயல்பான வடிவம்.
- source_word: מִקֶּרֶב הַמַּחֲנֶה
  choice: முகாமின் நடுவிலிருந்து
  rationale: קֶרֶב என்பதன் ‘நடுவில்/மத்தியில்’ என்ற இடவியல் படிமத்தைப் பாதுகாக்கிறது.
- source_word: כַּאֲשֶׁר נִשְׁבַּע יְהוָה לָהֶם
  choice: யெகோவா அவர்களுக்கு ஆணையிட்டுச் சொன்னபடியே
  rationale: נשבע என்பதன் சத்தியம்/ஆணை மொழியை வெளிப்படையாக வைத்திருக்கிறது; יהוה தனிப்பட்ட இறைப் பெயராக ‘யெகோவா’ என ஒலிபெயர்க்கப்பட்டது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரின் மொழிபெயர்ப்பு
  choice: யெகோவா
  alternative: யாவே
  rationale: நான்கு எழுத்து இறைப் பெயரை ‘கர்த்தர்’ என்ற பட்டமாக மாற்றாமல் தனிப்பட்ட பெயராகப் பாதுகாக்கிறது; தமிழ்க் கிறிஸ்தவப் பயன்பாட்டில் பரவலாக அறியப்படும் வடிவம் தேர்ந்தெடுக்கப்பட்டது.
- issue: אַנְשֵׁי הַמִּלְחָמָה என்பதிலுள்ள பாலினக் குறிப்பு
  choice: போர்வீரர்களான அந்தத் தலைமுறையினர்
  alternative: போருக்குரிய ஆண்கள்
  rationale: சூழல் போரிடத் தகுதியான ஆண்களைக் குறிக்கிறது. ‘போர்வீரர்கள்’ இதை இயல்பாகத் தருகிறது; ‘ஆண்கள்’ என்பதைச் சேர்ப்பது மூலத்தை இன்னும் வெளிப்படையாகக் காட்டினாலும் தமிழ் நடையில் சற்றுக் கனமாகும்.
- issue: தலைமுறையின் முடிவைக் குறிக்கும் עַד תֹּם
  choice: முற்றிலும் மறைந்துபோகும்வரை
  alternative: அழிந்துபோகும்வரை
  rationale: தீர்ப்பினால் அவர்கள் முகாமிலிருந்து ஒழிந்ததைத் தெரிவிக்கிறது; ‘அழிந்தனர்’ என்பதைக் காட்டிலும் மூலத்தின் ‘முடிவடைதல்’ கூறை ஓரளவு திறந்த நிலையில் வைத்திருக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; மரியாதைமிக்க ஆனால் பொதுவாசகருக்கு எளிய நடை. நீண்ட எபிரெய வாக்கியம் தமிழின் தெளிவுக்காக இரண்டு வாக்கியங்களாகப் பிரிக்கப்பட்டது. இடப்பெயர்கள் மூல எபிரெய ஒலிக்கு அருகாக வழங்கப்பட்டன.
