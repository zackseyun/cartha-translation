base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/001.yaml
  text: Then we turned and set out for the wilderness by the way of the Red Sea[a], just as Yahweh had spoken to me, and we went around Mount Seir for many days.
translation:
  language: ta
  text: பின்பு நாங்கள் திரும்பி, யாவே என்னிடம் கூறியபடியே செங்கடல்[a] வழியில் பாலைநிலத்தை நோக்கிப் புறப்பட்டோம்; சேயீர் மலையைப் பல நாட்கள் சுற்றிச் சென்றோம்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “நாணற்கடல்” என்றும் மொழிபெயர்க்கலாம்; எபிரெயப் பெயரான யாம் சூஃப் என்பதன் நேரடியான பொருள் இதுவாக இருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַנֵּפֶן
  choice: பின்பு நாங்கள் திரும்பி
  rationale: פנה என்பதன் Qal wayyiqtol வடிவம் திசை திரும்புவதையும் கதைநிகழ்வின் தொடர்ச்சியையும் குறிக்கிறது; சூழலில் இல்லாத ‘திரும்பிச் சென்றோம்’ என்ற பொருளைச் சேர்க்காமல் மொழிபெயர்க்கப்பட்டது.
- source_word: וַנִּסַּע הַמִּדְבָּרָה
  choice: பாலைநிலத்தை நோக்கிப் புறப்பட்டோம்
  rationale: נסע பயணச் சூழலில் முகாமைப் பெயர்த்துப் புறப்படுவதைக் குறிக்கிறது; מִדְבָּרָה-விலுள்ள திசைகாட்டும் ה, ‘நோக்கி’ என்பதால் வெளிப்படுகிறது.
- source_word: דֶּרֶךְ יַם סוּף
  choice: செங்கடல் வழியாக
  rationale: דרך என்பது இங்கு பயணப்பாதையைக் குறிக்கிறது. ים סוף என்பதற்கான மரபான, வாசகர்களுக்குப் பரிச்சயமான பெயராக ‘செங்கடல்’ முதன்மை உரையில் வைக்கப்பட்டு, சொற்பொருள் சார்ந்த மாற்று அடிக்குறிப்பில் தரப்பட்டது.
- source_word: כַּאֲשֶׁר דִּבֶּר יְהוָה אֵלָי
  choice: யாவே என்னிடம் கூறியபடியே
  rationale: כַּאֲשֶׁר-இன் ஒப்புமை வலிமையை ‘கூறியபடியே’ இயல்பாகக் காட்டுகிறது; דִּבֶּר ... אֵלַי என்பது ‘என்னிடம் கூறினார்’ என்ற பொருளில் வழங்கப்பட்டது.
- source_word: יְהוָה
  choice: யாவே
  rationale: திருநான்கெழுத்தான இறைப்பெயரை ஒரு பட்டப்பெயரால் மாற்றாமல், தமிழில் இயல்பான ஒலிபெயர்ப்பாக ‘யாவே’ என்று வழங்குகிறது.
- source_word: וַנָּסָב אֶת הַר שֵׂעִיר
  choice: சேயீர் மலையைச் சுற்றிச் சென்றோம்
  rationale: סבב இங்கு ஓர் இடத்தைச் சுற்றிப் பயணிப்பதைக் குறிக்கிறது; הַר שֵׂעִיר புவியியல் பெயராக ‘சேயீர் மலை’ என வழங்கப்பட்டது.
- source_word: יָמִים רַבִּים
  choice: பல நாட்கள்
  rationale: காலநீட்சியைக் குறிக்கும் எபிரெயச் சொற்றொடரை விளக்கவுரை சேர்க்காமல் நேரடியாகவும் இயல்பாகவும் வழங்குகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூல உரை தனிப்பட்ட உடன்படிக்கைப் பெயரை நேரடியாகக் கொண்டிருப்பதால், பட்டப்பெயரான ‘கர்த்தர்’ என்பதைக் கொண்டு மாற்றாமல் பெயரையே ஒலிபெயர்க்கிறது; ‘யாவே’ என்பது தமிழில் தெளிவான நவீன வடிவம்.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. எபிரெய வாக்கியத்தின் தொடர்ச்சியும் பயணத் திசையும் பாதுகாக்கப்பட்டுள்ளன. அடிக்குறி அது விளக்கும் ‘செங்கடல்’ என்பதன் உடனேயே இடப்பட்டுள்ளது.
