base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/030.yaml
  text: But Sihon king of Heshbon was not willing to let us pass through his land[a], because Yahweh your God had hardened his spirit and made his heart stubborn, in order to give him into your hand, as it is this day.
translation:
  language: ta
  text: ஆனால், எஸ்போனின் அரசன் சீகோன் நம்மைத் தன் நாட்டின் வழியாகக் கடந்து செல்ல விட விரும்பவில்லை; ஏனெனில் உன் கடவுளாகிய யாவே, அவனை உன் கையில் கொடுப்பதற்காக அவனுடைய ஆவியைக் கடினப்படுத்தி, அவனுடைய இதயத்தைப் பிடிவாதமாக்கினார்[a], இன்று நிலைமை அப்படியே இருக்கிறது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவனுடைய இதயத்தை வலுப்படுத்தினார்.” எபிரெய வினை “வலுவாக்கு” என்று பொருள்படலாம்; இங்கே சூழலில் எதிர்ப்பில் பிடிவாதமாக்குதல் என்ற கருத்து இருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָבָה
  choice: அனுமதிக்க மனமில்லாதிருந்தான்
  rationale: வெளிப்படையான மறுப்பை மட்டும் அல்லாமல், விருப்பம் அல்லது சம்மதம் இல்லாத அகநிலையையும் தெரிவிக்கிறது.
- source_word: הַעֲבִרֵנוּ בּוֹ
  choice: நம்மைத் தன் நாட்டின் வழியாகக் கடந்து செல்ல அனுமதிக்க
  rationale: எபிரெய வினை அனுமதித்தல் அல்லது கடக்கச் செய்தல் என்ற பொருளைத் தருகிறது; சூழலில் בּוֹ என்பது சீகோனின் நபரை அல்ல, அவனுடைய ஆட்சிப்பகுதியைக் குறிக்கிறது.
- source_word: הִקְשָׁה ... אֶת רוּחוֹ
  choice: அவனுடைய ஆவியைக் கடினப்படுத்தி
  rationale: ‘ஆவி’ என்ற எபிரெய மனிதவியல் சொல்லையும், கடினப்படுத்துதல் என்ற வினையின் நேரடியான இறையியல் வலிமையையும் தக்கவைக்கிறது.
- source_word: וְאִמֵּץ אֶת לְבָבוֹ
  choice: அவனுடைய இதயத்தைப் பிடிவாதமாக்கினார்
  rationale: அடிப்படையில் ‘வலுப்படுத்தினார்’ என்ற பொருள் இருக்கக்கூடும்; ஆனால் இச்சூழலில் எதிர்ப்பில் உறுதியாக அல்லது பிடிவாதமாக ஆக்குதல் என்ற கருத்து இயல்பாகிறது. மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: לְמַעַן
  choice: கொடுப்பதற்காக
  rationale: நோக்கத்தைக் குறிக்கும் எபிரெய இணைப்பை இயல்பான தமிழில் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: תִּתּוֹ בְיָדְךָ
  choice: அவனை உன் கையில் கொடுப்பதற்காக
  rationale: ஒருவரை மற்றொருவரின் அதிகாரத்திற்குள் ஒப்படைத்தல் என்ற எபிரெய மரபுத்தொடரை, அதன் ‘கை’ உருவகத்துடன் தக்கவைக்கிறது.
- source_word: כַּיּוֹם הַזֶּה
  choice: இன்று நிலைமை அப்படியே இருக்கிறது
  rationale: பேசப்படும் நாளில் கண்முன் விளங்கும் முடிவைச் சுட்டும் உபாகம மரபுத்தொடரை தெளிவான நவீன தமிழில் வழங்குகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், அதன் தனிப்பெயர் வடிவில் ஒலிபெயர்க்கிறது.
theological_decisions:
- issue: இறைவன் கடினப்படுத்துதலும் சீகோனின் மனமின்மையும்
  choice: சீகோனின் மனமின்மையையும் யாவே அவனைக் கடினப்படுத்தியதையும் இரண்டையும் நேரடியாகத் தக்கவைத்தல்
  alternative: சீகோன் தன்னைத்தானே கடினப்படுத்தினான் என்றோ, யாவே அதை வெறுமனே அனுமதித்தார் என்றோ பொருளை மென்மைப்படுத்துதல்
  rationale: எபிரெய உரை சீகோன் மனமில்லாதிருந்ததையும் யாவே அவனுடைய ஆவியைக் கடினப்படுத்தி இதயத்தைப் பிடிவாதமாக்கியதையும் ஒன்றாகக் கூறுகிறது. அந்த இறையியல் இழுபறியை மொழிபெயர்ப்பு தீர்த்துவிடாமல் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. மூலத்தில் இரண்டாம் நபர் ஒருமை இருப்பதால் ‘உன்’ பயன்படுத்தப்பட்டுள்ளது. அடிக்குறிப்பு குறி அது விளக்கும் சொற்றொடருக்குப் பின்னர் வைக்கப்பட்டுள்ளது.
