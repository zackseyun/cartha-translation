    issue: Slightly unnatural expression for Sihon’s unwillingness
    rationale: ‘அனுமதிக்க மனமில்லாதிருந்தான்’ is grammatically possible, but ‘நம்மைத் ... கடந்து செல்ல விட விரும்பவில்லை’ is more idiomatic modern Tamil and clearly conveys the Hebrew volitional verb אָבָה.
