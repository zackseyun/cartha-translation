  text: רַב לָ/כֶ֕ם סֹ֖ב אֶת הָ/הָ֣ר הַ/זֶּ֑ה פְּנ֥וּ לָ/כֶ֖ם צָפֹֽנָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/003.yaml
  text: You have gone around this hill country long enough[a]; turn northward.
translation:
  language: ta
  text: நீங்கள் இந்த மலைப்பகுதியைச் சுற்றித் திரிந்தது போதும்[a]; வடக்கே திரும்புங்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘இந்த மலையை.’ எபிரெயச் சொல் ஒரு தனி மலையையோ மலைநிறைந்த பகுதியையோ குறிக்கலாம்; இங்குள்ள பயணச் சூழல் ‘மலைப்பகுதி’ என்ற பொருளை ஆதரிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: רַב לָכֶם
  choice: போதும்
  rationale: இந்த எபிரெயச் சொற்றொடர் அளவு மிகுதியையோ நிறைவையோ குறிக்கிறது; பயணச் சூழலில், அவர்கள் சுற்றிவந்த காலம் போதுமானதாகிவிட்டது என்ற பொருளை இயல்பாகத் தருகிறது.
- source_word: סֹב
  choice: சுற்றிவந்தது
  rationale: סבב என்ற வேரிலிருந்து வந்த இச்சொல் சுற்றிச் செல்வதைக் குறிக்கிறது. முந்தைய பயணத்தைத் திரும்பிப் பார்க்கும் கட்டளையின் சூழலில் ‘சுற்றிவந்தது’ இயல்பானது.
- source_word: הָהָר הַזֶּה
  choice: இந்த மலைப்பகுதியை
  rationale: הַר என்பது ஒரு தனி மலையையோ மலைநிறைந்த பகுதியையோ குறிக்கலாம். இங்குள்ள பரந்த பயணச் சூழல் ‘மலைப்பகுதி’ என்ற பொருளை ஆதரிக்கிறது; உண்மையான சொற்பொருள் மாற்று அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: פְּנוּ
  choice: திரும்புங்கள்
  rationale: பயணத்தின் திசையை மாற்றுமாறு கூறும் பன்மை கட்டளை; நவீன தமிழில் நேரடியாகவும் இயல்பாகவும் உள்ளது.
- source_word: לָכֶם
  choice: தனியாக மொழிபெயர்க்கப்படவில்லை
  rationale: கட்டளைக்குப் பின் வரும் இந்த மறைமுக வேற்றுமை வடிவம் எபிரெய மொழிநடையின் ஒரு பகுதி. தமிழில் ‘உங்களுக்காக’ அல்லது ‘நீங்களே’ என்று வெளிப்படையாகச் சேர்த்தால் தேவையற்ற பொருள் வலியுறுத்தல் உண்டாகும்.
- source_word: צָפֹנָה
  choice: வடக்கே
  rationale: திசையை நோக்கிய இயக்கத்தைச் சுட்டும் வடிவம்; ‘வடக்கே’ அதன் திசைநோக்குப் பொருளைச் சுருக்கமாகத் தருகிறது.
