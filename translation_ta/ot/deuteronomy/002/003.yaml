- from: இந்த மலைப்பகுதியைச் சுற்றிவந்தது போதும்[a]; வடக்கே திரும்புங்கள்.
  to: நீங்கள் இந்த மலைப்பகுதியைச் சுற்றித் திரிந்தது போதும்[a]; வடக்கே திரும்புங்கள்.
  rationale: The revision retains the draft’s contextual rendering and directional command, while making the plural addressees explicit and using “சுற்றித் திரிந்தது” for the extended circling implied by the Hebrew construction. The footnote is retained with a minor stylistic adjustment only.
