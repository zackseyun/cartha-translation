source:
  edition: WLC
  text: רְפָאִ֛ים יֵחָשְׁב֥וּ אַף הֵ֖ם כָּ/עֲנָקִ֑ים וְ/הַ/מֹּ֣אָבִ֔ים יִקְרְא֥וּ לָ/הֶ֖ם אֵמִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/011.yaml
  text: They too were considered Rephaim[a], like the Anakim; but the Moabites call them Emim.
translation:
  language: ta
  text: அவர்களும் ஆனாக்கியரைப் போலவே ரெப்பாயீம்களாக[a] கருதப்பட்டார்கள்; ஆனால் மோவாபியர் அவர்களை ஏமியர் என்று அழைக்கிறார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ரெப்பாயீம்கள்’ என்பதற்குப் பதிலாக ‘இராட்சதர்கள்’ என்றும் மொழிபெயர்க்கலாம். எனினும், எபிரேயச் சொல் மிக இயல்பாகப் பழங்கால மக்கள் இனத்தின் பெயரைப் பாதுகாக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: רְפָאִים
  choice: ரெப்பாயீம்கள்
  rationale: இச்சூழலில் இது பழங்கால மக்கள் இனத்தின் பெயராக இயல்பாகப் புரிகிறது. எனவே ‘இராட்சதர்கள்’ என்று விளக்கமாக மொழிபெயர்க்காமல், பெயரை ஒலிபெயர்த்து மூல உலகின் வகைப்பாட்டைப் பாதுகாக்கிறது.
- source_word: יֵחָשְׁבוּ
  choice: கருதப்பட்டார்கள்
  rationale: நிஃபால் வடிவத்தின் செயப்பாட்டு பொருளையும், ஒரு மக்கள் வகையைச் சேர்ந்தவர்களாக மதிப்பிடப்பட்டார்கள் என்ற கருத்தையும் இயல்பான நவீன தமிழில் தருகிறது.
- source_word: אַף הֵם
  choice: அவர்களும்
  rationale: முன்னர் குறிப்பிடப்பட்ட வகைப்பாட்டில் இவர்களும் அடங்கினர் என்ற சேர்க்கை வலியுறுத்தலைச் சுருக்கமாக வெளிப்படுத்துகிறது.
- source_word: כָּעֲנָקִים
  choice: ஆனாக்கியரைப் போலவே
  rationale: כְּ முன்னொட்டின் ஒப்பீட்டுப் பொருளைப் பாதுகாக்கிறது; ‘போலவே’ என்பது ஒப்பீட்டையும் வலியுறுத்தலையும் இயல்பாகத் தருகிறது. ‘ஆனாக்கியர்’ மக்கள் இனப் பெயராக ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: וְהַמֹּאָבִים
  choice: ஆனால் மோவாபியர்
  rationale: வாவ் இணைப்புச்சொல் இங்கு பொதுவான வகைப்பாட்டிலிருந்து மோவாபியரின் பெயரிடும் வழக்கிற்கு மாறுவதைச் சுட்டுகிறது; தமிழில் ‘ஆனால்’ அந்த மாற்றத்தைத் தெளிவாகவும் இயல்பாகவும் காட்டுகிறது.
- source_word: יִקְרְאוּ לָהֶם
  choice: அவர்களை ... என்று அழைக்கிறார்கள்
  rationale: קרא ל என்ற எபிரேய மரபுத்தொடரின் ‘அழை/பெயரிடு’ என்ற பொருளை இயல்பான தமிழில் வழங்குகிறது.
- source_word: אֵמִים
  choice: ஏமியர்
  rationale: மோவாபியர் பயன்படுத்திய மக்கள் இனப் பெயராக ஒலிபெயர்க்கப்பட்டுள்ளது. தமிழில் மனித மக்கள் குழுவைக் குறிக்கும் பெயராகத் தெளிவுபடுத்த ‘-யர்’ வடிவம் பயன்படுத்தப்பட்டுள்ளது.
