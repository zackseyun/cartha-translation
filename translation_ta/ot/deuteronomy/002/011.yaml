  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியக்கூடிய கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. பழங்கால மக்கள் இனப் பெயர்கள் ஒலிபெயர்க்கப்பட்டுள்ளன; வசனத்தின் வகைப்பாடு மற்றும் பெயரிடுதல் ஆகியவற்றுக்கிடையிலான வேறுபாடு பாதுகாக்கப்பட்டுள்ளது.
