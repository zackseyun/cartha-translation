base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/020.yaml
  text: That also is considered a land of the Rephaim[a]; Rephaim lived in it formerly[b], but the Ammonites call them Zamzummim.
translation:
  language: ta
  text: அதுவும் ரெப்பாயீமியரின் நிலம் எனக் கருதப்படுகிறது[a]. முன்பு ரெப்பாயீமியர்[b] அதில் வாழ்ந்தனர்; அம்மோனியர்களோ அவர்களை ஜம்ஜும்மியர் என்று அழைக்கிறார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ரெப்பாயீமியரின் நிலம்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘ரெப்பாயீமியர்’ என்பது மிகப் பெரிய உருவத்துடன் மரபாகத் தொடர்புபடுத்தப்படும் ஒரு பழங்கால மக்களைக் குறிக்கலாம்; சில மொழிபெயர்ப்புகள் இங்கே ‘இராட்சதர்கள்’ என்று வழங்குகின்றன.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶרֶץ רְפָאִים
  choice: ரெப்பாயீமியரின் ஒரு நாடு
  rationale: אֶרֶץ என்பது ‘நாடு’ எனப் பொருள்படும். ரְפָאִים என்பதை விளக்கப் பெயராக மாற்றாமல் மக்களினப் பெயராக ஒலிபெயர்த்து, எபிரெய உரையின் வரையறையற்ற தன்மையை ‘ஒரு’ என்பதன் மூலம் வெளிப்படுத்துகிறது.
- source_word: תֵּחָשֵׁב
  choice: கருதப்படுகிறது
  rationale: חשׁב வினையின் நிஃபால் வடிவம் இங்கு ‘அவ்வாறு மதிக்கப்படுதல்/எண்ணப்படுதல்’ என்ற செயப்பாட்டு பொருளைத் தருகிறது; ‘கருதப்படுகிறது’ என்பது இயல்பான நவீனத் தமிழ்.
- source_word: אַף הִוא
  choice: அதுவும்
  rationale: முன்னர் குறிப்பிடப்பட்ட நிலப்பகுதிகளோடு இந்த நாட்டையும் இணைக்கும் சொல்லாடலைச் சுருக்கமாகவும் இயல்பாகவும் காட்டுகிறது.
- source_word: רְפָאִים
  choice: ரெப்பாயீமியர்
  rationale: இங்கு இது ஒரு பழங்கால மக்களினத்தின் பெயராகச் செயல்படுவதால் ‘இராட்சதர்கள்’ என்று விளக்கமாக மொழிபெயர்க்காமல் ஒலிபெயர்க்கப்படுகிறது; தமிழ் மக்களினப் பெயருக்கேற்ற ‘-யர்’ விகுதி சேர்க்கப்பட்டுள்ளது.
- source_word: יָשְׁבוּ בָהּ
  choice: அதில் வாழ்ந்தார்கள்
  rationale: יָשְׁבוּ இங்கு குடியிருத்தல் அல்லது வாழ்தல் எனப் பொருள்படும்; ‘வாழ்ந்தார்கள்’ தெளிவான, வழக்கமான தமிழ்.
- source_word: לְפָנִים
  choice: முன்பு
  rationale: முந்தைய காலத்தைக் குறிக்கும் வினையடை; ‘முன்பு’ சுருக்கமாகவும் இயல்பாகவும் உள்ளது.
- source_word: וְהָעַמֹּנִים
  choice: அம்மோனியர்களோ
  rationale: வாவ் இணைப்பை வெறும் ‘மற்றும்’ எனக் கொடுப்பதற்குப் பதிலாக, ரெப்பாயீமியர் என்ற உரையாசிரியரின் பெயருக்கும் அம்மோனியர்கள் பயன்படுத்திய பெயருக்கும் இடையிலான மாற்றத்தை ‘-ஓ’ காட்டுகிறது; வலுவான எதிர்மறைப் பொருள் சேர்க்கப்படவில்லை.
- source_word: יִקְרְאוּ לָהֶם
  choice: அவர்களை … என்று அழைக்கிறார்கள்
  rationale: இம்பர்ஃபெக்ட் வடிவம் வழக்கமான பெயரிடுதலைக் குறிக்கிறது; நிகழ்காலத் தமிழ் இதை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: זַמְזֻמִּים
  choice: சம்சும்மியர்
  rationale: இது மக்களினப் பெயர் என்பதால் பொருள் மொழிபெயர்ப்பு செய்யாமல் தமிழ் ஒலியமைப்புக்கு ஏற்றவாறு ஒலிபெயர்க்கப்பட்டுள்ளது.
theological_decisions:
- issue: רְפָאִים என்பது மக்களினப் பெயரா அல்லது உடல் அளவைச் சுட்டும் சொல்லா
  choice: மக்களினப் பெயராக ‘ரெப்பாயீமியர்’
  alternative: ‘இராட்சதர்கள்’ அல்லது ‘பேருருவினர்’
  rationale: இந்த வசனத்தில் ரְפָאִים என்பது நிலத்துடனும் அம்மோனியர்களின் மாற்றுப் பெயருடனும் தொடர்புபடுத்தப்பட்ட இனப்பெயராக வருகிறது. உடல் அளவை வெளிப்படையாக நிர்ணயிக்காமல் மூலத்தின் தெளிவின்மையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. பழங்கால மக்களினப் பெயர்கள் விளக்கமாக மாற்றப்படாமல் தமிழ் ஒலிபெயர்ப்பில் தரப்பட்டுள்ளன; தேவையான மாற்றுப் புரிதல்கள் அடிக்குறிப்புகளில் பாதுகாக்கப்பட்டுள்ளன.
