revisions:
- from: அதுவும் ரெப்பாயீமியரின் ஒரு நாடாகக் கருதப்படுகிறது[a]. முன்பு ரெப்பாயீமியர்[b] அதில் வாழ்ந்தார்கள்; அம்மோனியர்களோ அவர்களைச் சம்சும்மியர் என்று அழைக்கிறார்கள்.
  to: அதுவும் ரெப்பாயீமியரின் நிலம் எனக் கருதப்படுகிறது[a]. முன்பு ரெப்பாயீமியர்[b] அதில் வாழ்ந்தனர்; அம்மோனியர்களோ அவர்களை ஜம்ஜும்மியர் என்று அழைக்கிறார்கள்.
  rationale: The revision uses ‘நிலம்’ for the territorial sense of אֶרֶץ, improves the Tamil flow of the classificatory expression, and revises Zamzummim to a source-nearer transliteration. It retains the ethnonym Rephaim and the footnote’s qualified explanation, without asserting that the term necessarily means giants.
