  text: עַ֣ם גָּד֥וֹל וְ/רַ֛ב וָ/רָ֖ם כָּ/עֲנָקִ֑ים וַ/יַּשְׁמִידֵ֤/ם יְהוָה֙ מִ/פְּנֵי/הֶ֔ם וַ/יִּירָשֻׁ֖/ם וַ/יֵּשְׁב֥וּ תַחְתָּֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/021.yaml
  text: a people great[a], numerous, and tall like the Anakim. Yahweh destroyed them from before them, and they dispossessed them and lived in their place.
translation:
  language: ta
  text: அவர்கள் ஒரு பெரிய, எண்ணிக்கையில் மிகுந்த, ஆனாக்கீமியரைப் போல[a] உயரமான மக்கள். யாவே அவர்களை ஏசாவின் சந்ததியினருக்கு முன்னிருந்து அழித்தார்; ஏசாவின் சந்ததியினர் அவர்களை வெளியேற்றி, அவர்களுடைய இடத்தில் குடியிருந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது: “ஆனாக்கியரைப் போல.” எபிரெயப் பெயர் עֲנָקִים (ஆனாக்கீம்).'
    reason: மக்களினப் பெயரை ஒலிபெயர்க்கும் இரண்டு ஏற்ற தமிழ் வடிவங்களைத் தெரிவிக்கிறது.
lexical_decisions:
- source_word: עַם גָּדוֹל וְרַב
  choice: பெரியவர்களும் எண்ணிக்கையில் மிகுந்தவர்களும்
  rationale: עַם என்பது ஒரே மக்கள் குழுவைக் குறிக்கும் கூட்டுப்பெயர். தமிழ் வாக்கியத்தில் மனிதர்களைக் குறிக்கும் இயல்பான பன்மை அமைப்பைப் பயன்படுத்தி, גָּדוֹל மற்றும் רַב ஆகிய இரு தனித்த கருத்துகளையும்—பெருமை/அளவு மற்றும் எண்ணிக்கை மிகுதி—காத்திருக்கிறது.
- source_word: רָם
  choice: உயரமானவர்கள்
  rationale: ஆனாக்கீமியரோடு செய்யப்படும் ஒப்பீட்டினால் இங்கு உடல் உயரமே குறிக்கப்படுகிறது; ‘உயரமானவர்கள்’ என்பது தெளிவான நவீனத் தமிழ்.
- source_word: כָּעֲנָקִים
  choice: ஆனாக்கீமியரைப் போல
  rationale: כְּ ஒப்பீட்டைக் குறிக்கிறது. עֲנָקִים என்ற மக்களினப் பெயரை மொழிபெயர்த்து மாற்றாமல் தமிழில் ஒலிபெயர்த்துள்ளது.
- source_word: וַיַּשְׁמִידֵם
  choice: அவர்களை ... அழித்தார்
  rationale: שׁמד என்பதன் Hiphil வடிவம் வலுவான அழித்தல் அல்லது அகற்றுதலைக் குறிக்கிறது. ‘அழித்தார்’ அதன் வலிமையைத் தக்கவைத்தாலும், சூழலைத் தாண்டி முழுமையான இனஅழிப்பை வெளிப்படையாகச் சேர்ப்பதில்லை.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைத் திருப்பெயரான יהוה-ஐ ஒரு பட்டப்பெயராக மாற்றாமல், தமிழில் ‘யாவே’ என்று ஒலிபெயர்த்துள்ளது.
- source_word: מִפְּנֵיהֶם
  choice: ஏசாவின் சந்ததியினருக்கு முன்னிருந்து
  rationale: ‘அவர்களின் முகத்திற்கு முன்பிருந்து’ என்ற எபிரெய மரபுத்தொடரின் இடவியல் கருத்தை ‘முன்னிருந்து’ காக்கிறது. பலமுறை வரும் பன்மைச் சுட்டுப்பெயர்களால் தமிழில் உருவாகும் குழப்பத்தைத் தவிர்க்க, முந்தைய சூழலில் தெளிவாகக் குறிப்பிடப்பட்ட ஏசாவின் சந்ததியினரைப் பெயரிட்டு கூறுகிறது.
- source_word: וַיִּירָשֻׁם
  choice: அவர்களை வெளியேற்றி
  rationale: ירשׁ இச்சூழலில் முந்தைய குடிகளை வெளியேற்றி அவர்களுடைய இடத்தை உடைமையாக்குவதைக் குறிக்கிறது. அடுத்துள்ள ‘அவர்களுடைய இடத்தில் குடியிருந்தார்கள்’ என்பதுடன் சேர்ந்து உடைமையாக்கும் கருத்தும் தெளிவாகிறது.
- source_word: וַיֵּשְׁבוּ תַחְתָּם
  choice: அவர்களுடைய இடத்தில் குடியிருந்தார்கள்
  rationale: תַּחְתָּם குறிக்கும் மாற்றீட்டு இடத்தையும், ישׁב குறிக்கும் நிலையான குடியிருப்பையும் இயல்பான தமிழில் தெரிவிக்கிறது.
theological_decisions:
- issue: יהוה என்ற இறைத் திருப்பெயரை வழங்குதல்
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூலவசனம் இறைவனின் தனிப்பட்ட திருப்பெயரை நேரடியாகப் பயன்படுத்துகிறது. அதனை ஒரு பட்டப்பெயரால் மாற்றாமல் ஒலிபெயர்ப்பது மூலத்தின் பெயரியல் தன்மையைப் பாதுகாக்கிறது.
- issue: அழித்தல் மற்றும் மனிதர்களின் வெளியேற்றம் ஆகியவற்றின் செயற்பாட்டுத் தொடர்பு
  choice: யாவே அழித்தார்; ஏசாவின் சந்ததியினர் வெளியேற்றிக் குடியிருந்தார்கள்
  alternative: யாவே அவர்களை முற்றிலும் அழித்தொழித்தார்; பின்னர் ஏசாவின் சந்ததியினர் நிலத்தைப் பெற்றார்கள்
  rationale: மூலத்தில் இறைச் செயலும் மனிதச் செயலும் அடுத்தடுத்து கூறப்படுகின்றன. அழித்தலின் துல்லியமான பரப்பை அல்லது இரண்டிற்கிடையிலான இயந்திரத் தொடர்பை வசனம் விளக்காததால், மொழிபெயர்ப்பு அதற்கு மேல் ஒரு இறையியல் விளக்கத்தைச் சேர்க்கவில்லை.
translation_notes:
  register: நவீன, மரியாதைமிக்க, பொதுவாசகர்களுக்கு எளிதில் புரியும் தமிழைப் பயன்படுத்தியுள்ளது. வசனத்தின் தொடக்கத்தில் உள்ள எபிரெயப் பெயர்ச்சொல் தொடர் தமிழில் முழு வாக்கியமாக இயங்க ‘இருந்தார்கள்’ சேர்க்கப்பட்டுள்ளது. தொடர்ச்சியான எபிரெயப் பன்மைச் சுட்டுப்பெயர்களின் இரு வேறு குறிப்புகளைத் தெளிவுபடுத்த, உடனடி சூழலிலுள்ள ‘ஏசாவின் சந்ததியினர்’ வெளிப்படையாகக் கூறப்பட்டுள்ளது.
