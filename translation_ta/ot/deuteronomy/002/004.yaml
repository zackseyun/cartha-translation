  source_fidelity: மூலத்தின் கட்டளைத் தொனி, ஏசாவின் மக்களுடனான ‘சகோதரர்கள்’ என்ற உறவுமுறை, சேயீரில் வசித்தல், அவர்கள் இஸ்ரவேலருக்கு அஞ்சுதல், மற்றும் கடுமையான எச்சரிக்கை ஆகியவை வரைவில் பெரும்பாலும் துல்லியமாக உள்ளன. ஆனால் בִּגְבוּל என்பதன் ‘எல்லை/நிலப்பகுதி’ என்ற பொருள்-வீச்சை முதன்மை உரையில் ‘நிலப்பகுதி’ எனத் தேர்ந்தெடுத்துள்ளபோதும் அதற்கான மாற்றுவாசிப்பு அடிக்குறிப்பு விடுபட்டுள்ளது. மேலும், מִכֶּם-ஐ நேரடியாகப் பிரதிபலிக்கும் ‘உங்களுக்குப் பயப்படுவார்கள்’ என்பது ‘உங்களைக் கண்டு அஞ்சுவார்கள்’ என்பதைக் காட்டிலும் மூலத்திற்கு நெருக்கமானது.
  naturalness: நடை நவீன தரத் தமிழிலும் வேதாகம உரைக்கேற்ற கண்ணியமான பதிவிலும் இயல்பாக உள்ளது. ‘உங்களுக்குப் பயப்படுவார்கள்’ என்பது சுருக்கமாகவும் இயல்பாகவும் உள்ளது. ‘நிலப்பகுதி வழியாக’ தெளிவான பயணச் சூழல் மொழியாகும்.
