  rationale: மூலத்தில் உள்ள גְּבוּל சொல்லின் பொருள்-வீச்சைச் சுட்டும் அடிக்குறிப்பு சேர்க்கப்பட்டுள்ளது. அச்சத்தைக் குறிக்கும் சொல்லாக்கம் மִכֶּם-க்கு நெருக்கமாக ‘உங்களுக்குப் பயப்படுவார்கள்’ என மாற்றப்பட்டுள்ளது. மற்ற எல்லா கூறுகளும் மூலத்தின் பொருளையும் நவீன தரத் தமிழ் நடையையும் நன்கு பேணுவதால் பாதுகாக்கப்பட்டுள்ளன.
