source:
  edition: WLC
  text: וְ/אֶת הָ/עָם֮ צַ֣ו לֵ/אמֹר֒ אַתֶּ֣ם עֹֽבְרִ֗ים בִּ/גְבוּל֙ אֲחֵי/כֶ֣ם בְּנֵי עֵשָׂ֔ו הַ/יֹּשְׁבִ֖ים בְּ/שֵׂעִ֑יר וְ/יִֽירְא֣וּ מִ/כֶּ֔ם וְ/נִשְׁמַרְתֶּ֖ם מְאֹֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/004.yaml
  text: And command the people[a], saying, ‘You are about to pass through the territory of your brothers, the sons of Esau, who live in Seir; and they will be afraid of you[c][b]. So be very careful.’
translation:
  language: ta
  text: 'மக்களுக்குக் கட்டளையிட்டுச் சொல்: ‘சேயீரில் குடியிருக்கிற ஏசாவின் மக்களான உங்கள் சகோதரர்களின் நிலப்பகுதி[a] வழியாக நீங்கள் இப்போது கடந்து செல்லவிருக்கிறீர்கள்[b]. அவர்கள் உங்களுக்குப் பயப்படுவார்கள். ஆகவே, நீங்கள் மிகவும் எச்சரிக்கையாக இருங்கள்[c].’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘எல்லை.’ எபிரெயச் சொல் எல்லைக்கோட்டையோ அதனால் வரையறுக்கப்படும் நிலப்பகுதியையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘நீங்கள் கடந்து செல்கிறீர்கள்’ அல்லது ‘நீங்கள் கடந்து செல்வீர்கள்.’ எபிரெய வினையெச்சம் விரைவில் நடைபெறவிருக்கும் செயலையும் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, ‘எனவே, உங்களை மிகவும் கவனமாகக் காத்துக்கொள்ளுங்கள்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: צַו
  choice: கட்டளையிட்டுச் சொல்
  rationale: צוה என்பதன் கட்டளை வலிமையைப் பேணுவதோடு, לֵאמֹר உடன் சேர்ந்த எபிரெய அமைப்பையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: הָעָם
  choice: மக்கள்
  rationale: இங்கு עם என்பது இஸ்ரவேல் மக்களை ஒட்டுமொத்தமாகக் குறிக்கிறது; ‘மக்கள்’ என்பது நேரடியான, இயல்பான தமிழ்.
- source_word: אַתֶּם עֹבְרִים
  choice: நீங்கள் இப்போது கடந்து செல்லவிருக்கிறீர்கள்
  rationale: தனிப்பட்ட சுட்டுப்பெயருடன் வரும் எபிரெய நிகழ்கால வினையெச்சம் சூழலில் அண்மையில் நடைபெறவிருக்கும் செயலைக் குறிக்கிறது. ‘இப்போது ... செல்லவிருக்கிறீர்கள்’ அந்த அண்மை எதிர்கால நுணுக்கத்தை வெளிப்படுத்துகிறது.
- source_word: בִּגְבוּל
  choice: நிலப்பகுதி வழியாக
  rationale: גְּבוּל என்பதற்கு எல்லைக்கோடு அல்லது அந்த எல்லைக்குள் அமைந்த நிலப்பகுதி என இரு பொருள்கள் உண்டு. பயணச் சூழலில் நிலப்பகுதியைக் குறிப்பது பொருத்தமானது.
- source_word: אֲחֵיכֶם בְּנֵי עֵשָׂו
  choice: ஏசாவின் மக்களான உங்கள் சகோதரர்கள்
  rationale: ‘உங்கள் சகோதரர்கள்’ என்று மொழிபெயர்ப்பது இஸ்ரவேலுக்கும் ஏதோமுக்கும் இடையிலான உறவுமுறை மொழியைப் பேணுகிறது; ‘ஏசாவின் மக்கள்’ என்பது வம்சத்தாரைக் குறிக்கும் இயல்பான நவீன தமிழ்.
- source_word: הַיֹּשְׁבִים בְּשֵׂעִיר
  choice: சேயீரில் குடியிருக்கிற
  rationale: ישב இங்கு நிலையாக வசிப்பதைக் குறிக்கிறது; ‘குடியிருக்கிற’ என்பது அந்தப் பொருளை தெளிவாகத் தருகிறது.
- source_word: וְיִירְאוּ מִכֶּם
  choice: அவர்கள் உங்களைக் கண்டு அஞ்சுவார்கள்
  rationale: ירא உடன் מן வருவது இஸ்ரவேலை முன்னிட்டு அல்லது அவர்களால் ஏற்படும் அச்சத்தைக் குறிக்கிறது; ‘உங்களைக் கண்டு அஞ்சுவார்கள்’ இயல்பான தமிழில் இதைத் தெளிவாகச் சொல்கிறது.
- source_word: וְנִשְׁמַרְתֶּם מְאֹד
  choice: ஆகவே, நீங்கள் மிகவும் எச்சரிக்கையாக இருங்கள்
  rationale: שמר என்பதன் நிபால் வடிவம் இங்கு தங்களைத் தாங்களே காத்துக்கொள்ளுதல் அல்லது எச்சரிக்கையாக இருத்தல் என்னும் பொருளைத் தருகிறது; מְאֹד-இன் வலியுறுத்தலை ‘மிகவும்’ பேணுகிறது.
theological_decisions:
- issue: ஏதோமியரைக் குறிக்கும் உறவுமுறை மொழி
  choice: ஏசாவின் மக்களான உங்கள் சகோதரர்கள்
  alternative: ஏசாவின் வம்சத்தாரான உங்கள் உறவினர்கள்
  rationale: மூலத்தில் உள்ள ‘சகோதரர்கள்’ என்ற நேரடி உறவுமுறைச் சொல்லை வைத்திருப்பது இஸ்ரவேலுக்கும் ஏதோமுக்கும் இடையிலான வம்ச உறவைத் தெளிவாகப் பேணுகிறது; அதை பொதுவான ‘உறவினர்கள்’ என மென்மைப்படுத்தவில்லை.
translation_notes:
  register: நவீன தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் வேதாகம உரைக்கு ஏற்ற கண்ணியத்துடனும் வடிவமைக்கப்பட்டது. ‘சகோதரர்கள்’ என்ற உறவுமுறை மொழியும், அண்மை எதிர்கால வினை நுணுக்கமும், எச்சரிக்கையின் வலியுறுத்தலும் பேணப்பட்டுள்ளன. גְּבוּל என்பதிலுள்ள ‘எல்லை/நிலப்பகுதி’ ambiguity-யில் பயணச் சூழலுக்கேற்ற ‘நிலப்பகுதி’ முதன்மை உரையில் தேர்ந்தெடுக்கப்பட்டது.
