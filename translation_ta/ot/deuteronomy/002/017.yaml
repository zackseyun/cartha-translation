  text: וַ/יְדַבֵּ֥ר יְהוָ֖ה אֵלַ֥/י לֵ/אמֹֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/017.yaml
  text: Then Yahweh spoke to me[a], saying,
translation:
  language: ta
  text: அப்போது யாவே என்னிடம் பேசிச் சொன்னார்:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரேய மூலத்தில்: “YHWH”; பாரம்பரியமாக “கர்த்தர்” என்று மொழிபெயர்க்கப்படுகிறது.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: அப்போது ... பேசிச்
  rationale: வாவ் தொடரமைப்பு நிகழ்வின் அடுத்த கட்டத்தைச் சுட்டுவதால் ‘அப்போது’ என வழங்கப்பட்டது; דִּבֵּר என்பதன் ‘பேசு’ பொருள், தொடர்ந்து வரும் לֵאמֹר என்பதிலிருந்து வேறுபடுமாறு காக்கப்பட்டது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரேய நான்கெழுத்துத் தெய்வீகப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் வழக்கமான ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: אֵלַי
  choice: என்னிடம்
  rationale: אֶל முன்னிடைச்சொல் பேச்சு நோக்கிச் செலுத்தப்பட்டதைத் தெளிவாகக் காட்டுகிறது; இங்கு ‘என்னோடு’ என்பதைக் காட்டிலும் ‘என்னிடம்’ இயல்பானது.
- source_word: לֵאמֹר
  choice: சொன்னது
  rationale: நேர்கூற்றை அறிமுகப்படுத்தும் எபிரேய வாய்பாட்டைத் தமிழில் இயல்பாகக் காட்டுகிறது; அடுத்த வசனத்தில் வரும் உரைக்கான முன்னுரை என்பதால் முற்றுப்புள்ளிக்குப் பதிலாக முக்காற்புள்ளி இடப்பட்டுள்ளது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரை வழங்குதல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் தனிப்பட்ட தெய்வீகப் பெயர் நேரடியாக உள்ளது. ஆகவே அதைப் பட்டமாக மாற்றாமல் ஒலிபெயர்த்து, பாரம்பரிய மாற்றீட்டை அடிக்குறிப்பில் குறிப்பிடுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் மரியாதைமிக்கதாகவும் அமைக்கப்பட்டுள்ளது. ‘பேசிச் சொன்னது’ என்பது דִּבֵּר ... לֵאמֹר என்ற இரட்டை உரை அறிமுகத்தைச் சுருக்காமல் காக்கிறது; அஃறிணை வினைமுற்று தமிழில் இறைவனைக் குறிக்கும் மரியாதைக் குறைவாகக் கருதப்படாத நடுநிலை வேதாகம நடையாகப் பயன்படுத்தப்பட்டுள்ளது.
