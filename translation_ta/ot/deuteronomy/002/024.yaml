source:
  edition: WLC
  text: ק֣וּמוּ סְּע֗וּ וְ/עִבְרוּ֮ אֶת נַ֣חַל אַרְנֹן֒ רְאֵ֣ה נָתַ֣תִּי בְ֠/יָדְ/ךָ אֶת סִיחֹ֨ן מֶֽלֶךְ חֶשְׁבּ֧וֹן הָֽ/אֱמֹרִ֛י וְ/אֶת אַרְצ֖/וֹ הָחֵ֣ל רָ֑שׁ וְ/הִתְגָּ֥ר בּ֖/וֹ מִלְחָמָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/024.yaml
  text: Rise up[a], set out, and cross over the Arnon Valley. See, I have given into your hand Sihon king of Heshbon, the Amorite, and his land. Begin to take possession of it[c][b], and engage him in battle.
translation:
  language: ta
  text: “எழுந்து புறப்பட்டு, அர்னோன் பள்ளத்தாக்கைக்[a] கடந்து செல்லுங்கள். இதோ, எஸ்போனின் அரசனான எமோரியன் சீகோனையும் அவனுடைய நாட்டையும் உன் கையில் கொடுத்துவிட்டேன். அதைக் கைப்பற்றத் தொடங்கு[b]; அவனோடு போரில் மோது[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது “அர்னோன் ஓடைப்படுகையை” அல்லது “அர்னோன் ஓடையை.” எபிரேயச் சொல் ஓடை, வறண்ட ஓடைப்படுகை, அல்லது பள்ளத்தாக்கைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது “அதை உரிமையாக்கத் தொடங்கு.” இவ்வினைச்சொல் சில சூழல்களில் “அங்கிருப்பவர்களை அகற்று” என்ற பொருளையும் தரலாம்; இங்கு உடனடி பொருள் சீகோனின் நாடு.
    reason: lexical_alternative
  - marker: c
    text: அல்லது “அவனோடு போரிடு,” “அவனைப் போருக்குத் தூண்டு.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ק֣וּמוּ סְּע֗וּ
  choice: எழுந்து புறப்பட்டு
  rationale: இரு பன்மை ஏவல் வினைகளின் நகரத் தொடங்கும் வலிமையையும் தொடர்ச்சியையும் இயல்பான நவீன தமிழில் தருகிறது.
- source_word: וְ/עִבְרוּ֮
  choice: கடந்து செல்லுங்கள்
  rationale: ஓர் ஆற்றுப்பள்ளத்தாக்கு அல்லது எல்லையைக் கடக்கும் திசைச்செயலைத் தெளிவாகக் காட்டுகிறது.
- source_word: נַ֣חַל אַרְנֹן
  choice: அர்னோன் பள்ளத்தாக்கு
  rationale: נחל என்பது ஓடை, வறண்ட ஓடைப்படுகை, அல்லது பள்ளத்தாக்கைக் குறிக்கலாம்; பொதுவாசகருக்குப் புரியும் வகையில் ‘பள்ளத்தாக்கு’ முதன்மை உரையில் வைக்கப்பட்டது.
- source_word: רְאֵ֣ה
  choice: இதோ
  rationale: ஒருமை ஏவலின் கவன ஈர்ப்பு செயல்பாட்டை இயல்பான, கண்ணியமான தமிழில் வெளிப்படுத்துகிறது.
- source_word: נָתַ֣תִּי בְ֠/יָדְ/ךָ
  choice: உன் கையில் கொடுத்துவிட்டேன்
  rationale: அதிகாரம் அல்லது கட்டுப்பாட்டுக்குள் ஒப்படைத்தல் என்ற எபிரேய உருவகத்தையும் நிறைவேற்றப்பட்ட தெய்வீக கொடையையும் காக்கிறது.
- source_word: סִיחֹ֨ן מֶֽלֶךְ חֶשְׁבּ֧וֹן הָֽ/אֱמֹרִ֛י
  choice: எஸ்போனின் அரசனான எமோரியன் சீகோன்
  rationale: சீகோனின் அரச பதவியையும் இன அடையாளத்தையும் தமிழில் தெளிவான இணைப்புடன் தருகிறது.
- source_word: וְ/אֶת אַרְצ֖/וֹ
  choice: அவனுடைய நாடு
  rationale: אֶרֶץ இங்கு அரசனின் ஆட்சிப்பகுதியைக் குறிக்கிறது; ‘நாடு’ இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: הָחֵ֣ל רָ֑שׁ
  choice: அதைக் கைப்பற்றத் தொடங்கு
  rationale: החל என்பதன் ‘தொடங்கு’ என்ற பொருளையும் ירש என்பதன் நிலத்தை உடைமையாக்கும் பொருளையும் காக்கிறது; அகற்றுதல் என்ற சாத்திய நிழற்பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: וְ/הִתְגָּ֥ר בּ֖/וֹ מִלְחָמָֽה
  choice: அவனோடு போரில் மோது
  rationale: பகை நடவடிக்கையில் நேரடியாக இறங்குதல் என்ற பொருளை சுருக்கமான, இயல்பான தமிழில் தெரிவிக்கிறது.
theological_decisions:
- issue: தெய்வீகக் கொடையும் மனிதச் செயலும்
  choice: ‘கொடுத்துவிட்டேன்’ என்ற நிறைவேற்றப்பட்ட தெய்வீக அறிவிப்பையும் ‘கைப்பற்றத் தொடங்கு; ... போரில் மோது’ என்ற மனிதச் செயலுக்கான கட்டளைகளையும் ஒன்றாகக் காத்தல்
  alternative: ‘கொடுப்பேன்’ என்று எதிர்கால வாக்குறுதியாக மென்மைப்படுத்துதல், அல்லது கைப்பற்றுதலை மட்டும் முன்னிறுத்துதல்
  rationale: எபிரேய உரை கடவுளின் முடிவுற்ற கொடையையும் இஸ்ரவேலுக்குக் கட்டளையிடப்பட்ட செயலையும் அடுத்தடுத்து வைக்கிறது; அந்த இறையியல் இழுவையைத் தீர்த்துவிடாமல் மொழிபெயர்ப்பு பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழ்; நேரடியான ஏவல் வடிவங்களும் கண்ணியமான வேதாகம நடையும் பயன்படுத்தப்பட்டுள்ளன. மூலத்தில் பன்மையாக உள்ள தொடக்கக் கட்டளைகள் பன்மையாகவும், மோசேயை நோக்கிய ஒருமை வடிவங்கள் ‘உன்/தொடங்கு’ என ஒருமையாகவும் பாதுகாக்கப்பட்டுள்ளன. எல்லா அடிக்குறிப்பு குறிகளும் உரையில் இடம்பெற்றுள்ளன.
