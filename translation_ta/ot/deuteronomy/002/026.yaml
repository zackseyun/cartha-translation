base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/026.yaml
  text: So I sent messengers from the wilderness of Kedemoth to Sihon king of Heshbon with words of peace[a], saying,
translation:
  language: ta
  text: 'ஆகவே, நான் கெதேமோத் வனாந்தரத்திலிருந்து எஸ்போனின் ராஜாவான சீகோனிடம் சமாதான வார்த்தைகளுடன்[a] தூதர்களை அனுப்பி, இவ்வாறு சொன்னேன்:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சமாதான நிபந்தனைகளுடன்.” எபிரேய மொழியில் நேரடியாக “சமாதான வார்த்தைகள்” என்று உள்ளது; இது அமைதியான அரசதந்திர அணுகுமுறையைக் குறிக்கும் மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶשְׁלַח
  choice: ஆகவே, நான் ... அனுப்பி
  rationale: முதல் நபர் ஒருமைச் செயலைத் தக்கவைத்து, தொடர் நிகழ்வைக் குறிக்கும் வாவ் வடிவின் முன்னேற்றத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: מַלְאָכִים
  choice: தூதர்களை
  rationale: இது மனிதர்களுக்கிடையேயான அரசதந்திரச் சூழல் என்பதால், விண்ணுலகத் தூதர்கள் அல்ல, செய்தியுடன் அனுப்பப்பட்ட மனிதப் பிரதிநிதிகளைக் குறிக்கிறது.
- source_word: מִמִּדְבַּר קְדֵמוֹת
  choice: கெதேமோத் வனாந்தரத்திலிருந்து
  rationale: מִדְבָּר என்பது மக்கள் குடியிருப்பு குறைந்த வறண்ட வனப்பகுதியைக் குறிக்கிறது; இடப்பெயரும் அதன் தொடர்பும் நேரடியாகப் பாதுகாக்கப்பட்டுள்ளன.
- source_word: אֶל
  choice: '...இடம்'
  rationale: அரசதந்திரத் தூதின் பெறுநரை இயல்பான தமிழில் குறிக்கிறது.
- source_word: סִיחוֹן מֶלֶךְ חֶשְׁבּוֹן
  choice: எஸ்போனின் ராஜாவான சீகோனிடம்
  rationale: அரச பட்டத்தையும் இடப்பெயருடனான உறவையும் தெளிவாகக் காட்டும் இயல்பான தமிழ் அமைப்பு.
- source_word: דִּבְרֵי שָׁלוֹם
  choice: சமாதான வார்த்தைகளுடன்
  rationale: எபிரேய மொழியின் நேரடியான ‘சமாதான வார்த்தைகள்’ என்ற சொற்றொடரைப் பாதுகாக்கிறது; இது அமைதியான அரசதந்திர அணுகுமுறை அல்லது சமாதான நிபந்தனைகளைக் குறிக்கக்கூடும்.
- source_word: לֵאמֹר
  choice: 'இவ்வாறு சொன்னேன்:'
  rationale: அடுத்த வசனத்தில் வரும் நேரடிக் கூற்றை அறிமுகப்படுத்தும் எபிரேய மேற்கோள் வடிவை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
