source:
  edition: WLC
  text: הָ/אֵמִ֥ים לְ/פָנִ֖ים יָ֣שְׁבוּ בָ֑/הּ עַ֣ם גָּד֥וֹל וְ/רַ֛ב וָ/רָ֖ם כָּ/עֲנָקִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/010.yaml
  text: The Emim formerly lived there[a], a people great and numerous and tall as the Anakim.
translation:
  language: ta
  text: முன்பு[a] ஏமியர் அங்கே குடியிருந்தார்கள். அவர்கள் பெரியதும், எண்ணிக்கையில் மிகுந்ததும், ஏனாக்கியரைப் போல உயரமானதுமான ஒரு மக்கள் இனம்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “முற்காலத்தில்.”
    reason: காலத்தைக் குறிக்கும் לְפָנִים என்பதற்கான இயல்பான மாற்று மொழிபெயர்ப்பு.
lexical_decisions:
- source_word: הָאֵמִים
  choice: ஏமியர்
  rationale: மக்கள் இனத்தின் பெயரைப் பொருள்படுத்தாமல், தமிழில் இயல்பாக ஒலிபெயர்த்துள்ளது.
- source_word: לְפָנִים
  choice: முன்பு
  rationale: இங்கு இது இடத்தைக் குறிக்காமல், முந்தைய காலத்தைக் குறிக்கும் வினையடைப் பொருளில் வருகிறது.
- source_word: יָשְׁבוּ בָהּ
  choice: அங்கே குடியிருந்தார்கள்
  rationale: ישׁב உடன் ב வருவது ஓர் இடத்தில் வசித்ததைக் குறிக்கிறது; பெண்பால் ஒருமைச் சுட்டுப்பெயர் சூழலில் குறிப்பிடப்பட்ட நிலப்பகுதியைச் சுட்டுகிறது.
- source_word: עַם
  choice: மக்கள் இனத்தினர்
  rationale: ஒரு தனித்த இனக்குழுவைக் குறிக்கும் கூட்டுப்பெயரின் பொருளை நவீன தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: גָּדוֹל
  choice: பெரிய
  rationale: அளவு, பெருமை அல்லது வியப்பூட்டும் தன்மை ஆகியவற்றை உள்ளடக்கக்கூடிய மூலச்சொல்லின் விரிந்த பொருளைச் சுருக்காமல் வைத்திருக்கிறது.
- source_word: וְרַב
  choice: எண்ணிக்கையில் மிகுந்த
  rationale: இங்கு மக்கள் தொகையின் பெருக்கத்தைக் குறிக்கிறது; ‘பெரிய’ என்பதிலிருந்து இதன் தனிப் பொருளையும் தெளிவாக்குகிறது.
- source_word: וָרָם
  choice: உயரமான
  rationale: ஏனாக்கியரோடு ஒப்பிடப்படும் சூழலில் உடல் உயரத்தைக் குறிக்கிறது.
- source_word: כָּעֲנָקִים
  choice: ஏனாக்கியரைப் போல
  rationale: כ comparative particle காட்டும் ஒப்புமையையும், இனப்பெயரின் ஒலிபெயர்ப்பையும் காக்கிறது.
