revisions:
- from: முன்பு[a] ஏமியர் அங்கே குடியிருந்தார்கள். அவர்கள் பெரிய, எண்ணிக்கையில் மிகுந்த, ஏனாக்கியரைப் போல உயரமான மக்கள் இனத்தினர்.
  to: முன்பு[a] ஏமியர் அங்கே குடியிருந்தார்கள். அவர்கள் பெரியதும், எண்ணிக்கையில் மிகுந்ததும், ஏனாக்கியரைப் போல உயரமானதுமான ஒரு மக்கள் இனம்.
  rationale: The revision retains every element of the source and the temporal-alternative footnote, while replacing an unnatural and semantically imprecise predicate with a natural collective expression. The coordinated adjectival form clearly qualifies “ஒரு மக்கள் இனம்.”
