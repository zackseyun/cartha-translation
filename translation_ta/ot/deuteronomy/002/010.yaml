  register: நவீன பொதுத்தமிழில் எளிமையும் கண்ணியமும் காக்கப்பட்டுள்ளன. இனப்பெயர்கள் ‘ஏமியர்’, ‘ஏனாக்கியர்’ என ஒலிபெயர்க்கப்பட்டுள்ளன; மூலத்தின் மூன்று தனித்த வருணனைகளும் தொடராகப் பாதுகாக்கப்பட்டுள்ளன.
