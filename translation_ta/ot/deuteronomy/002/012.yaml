  text: וּ/בְ/שֵׂעִ֞יר יָשְׁב֣וּ הַ/חֹרִים֮ לְ/פָנִים֒ וּ/בְנֵ֧י עֵשָׂ֣ו יִֽירָשׁ֗וּ/ם וַ/יַּשְׁמִידוּ/ם֙ מִ/פְּנֵי/הֶ֔ם וַ/יֵּשְׁב֖וּ תַּחְתָּ֑/ם כַּ/אֲשֶׁ֧ר עָשָׂ֣ה יִשְׂרָאֵ֗ל לְ/אֶ֨רֶץ֙ יְרֻשָּׁת֔/וֹ אֲשֶׁר נָתַ֥ן יְהוָ֖ה לָ/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/012.yaml
  text: And in Seir the Horites formerly lived[a], but the sons of Esau dispossessed them and destroyed them from before them, and settled in their place, just as Israel did to the land of his possession[c][b], which Yahweh gave to them.
translation:
  language: ta
  text: சேயீரில் முன்பு ஓரியர்கள் குடியிருந்தார்கள். ஆனால் ஏசாவின் மகன்கள் அவர்களை உரிமையிலிருந்து அகற்றி[a], அவர்களைத் தங்கள் முன்னிலையிலிருந்து அழித்து[b], அவர்களுடைய இடத்தில் குடியேறினார்கள். யாவே அவர்களுக்குக் கொடுத்த தன் உரிமை நிலத்தை இஸ்ரவேல் கைப்பற்றியபோது செய்ததுபோலவே இதுவும் நடந்தது.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்களைத் துரத்திவிட்டார்கள்.” எபிரெய வினை, முந்தைய குடிகளை அகற்றி அவர்களுடைய நிலத்தைத் தங்கள் வசமாக்குவதையும் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில், “தங்கள் முன்னிலையிலிருந்து.” இது அவர்களைத் தங்கள் இருப்பிடத்திலிருந்தும் முன்னிலையிலிருந்தும் அகற்றியதைக் குறிக்கும் மரபுத்தொடர்.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, “தன் சுதந்தர நிலத்தை.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחֹרִים
  choice: ஓரியர்கள்
  rationale: சேயீரில் வாழ்ந்த இனக்குழுவைக் குறிக்கும் பெயராக, தமிழில் இயல்பான ஒலிபெயர்ப்புடன் வழங்கப்பட்டது.
- source_word: לְפָנִים
  choice: முன்பு
  rationale: இங்கு இடத்தைக் குறிக்காமல் முந்தைய காலத்தைக் குறிக்கும் வினையடை.
- source_word: יִירָשׁוּם
  choice: அவர்களைத் துரத்திவிட்டு
  rationale: ירשׁ என்பது முந்தைய குடிகளை அகற்றித் தங்கள் வசமாக்கும் பொருளைக் கொண்டது; சூழலில் அகற்றுதல் தெளிவாகத் தெரிவதால் இவ்வாறு மொழிபெயர்க்கப்பட்டது. ‘அவர்களுடைய உடைமையைப் பறித்துக்கொண்டார்கள்’ என்பதும் சாத்தியம்.
- source_word: וַיַּשְׁמִידוּם
  choice: அவர்களை அழித்து
  rationale: שׁמד என்பதன் வலுவான அழிவுப் பொருளைப் பாதுகாக்கிறது; முழுமையான இனஅழிப்பு என கூடுதலாக வரையறுக்கவில்லை.
- source_word: מִפְּנֵיהֶם
  choice: தங்கள் முன்னிலையிலிருந்து
  rationale: எபிரெயச் சொற்றொடரின் உருவகத்தையும் ஒருவரது இருப்பிடத்திலிருந்து அகற்றும் பொருளையும் தக்கவைக்கிறது.
- source_word: תַּחְתָּם
  choice: அவர்களுடைய இடத்தில்
  rationale: முந்தைய குடிகளுக்குப் பதிலாக அதே இடத்தில் குடியேறியதை இயல்பான தமிழில் குறிக்கிறது.
- source_word: לְאֶרֶץ יְרֻשָּׁתוֹ
  choice: தன் உரிமை நிலத்திற்கு
  rationale: יְרֻשָּׁה என்பதில் பெறப்பட்டு உடைமையாக வைத்திருக்கும் நிலம் என்ற கருத்து உள்ளது; ‘இஸ்ரவேல்’ என்ற கூட்டொருமைக்கு ஏற்ப ‘தன்’ என்று ஒருமை பாதுகாக்கப்பட்டது.
- source_word: יְהוָה
  choice: யாவே
  rationale: திருப்பெயரை ஒரு பட்டப்பெயரால் மாற்றாமல் தமிழில் நேரடியாக ஒலிபெயர்க்கிறது.
- source_word: לָהֶם
  choice: தங்களுக்குக்
  rationale: எபிரெயத்தில் ‘இஸ்ரவேல்/தன்’ என்ற கூட்டொருமையிலிருந்து ‘அவர்களுக்கு’ என்ற பன்மைக்கு வரும் எண்ணிக்கை மாற்றம் தமிழிலும் பாதுகாக்கப்பட்டது.
theological_decisions:
- issue: ‘இஸ்ரவேலும் ... செய்தது’ என்ற ஒப்பீட்டின் காலக் குறிப்பு
  choice: இஸ்ரவேல் தன் உரிமை நிலத்திற்குச் செய்ததாக உரை கூறும் வரலாற்று ஒப்பீட்டை அப்படியே வைத்தல்
  alternative: இதைப் பிற்காலச் சேர்க்கையாகக் கருதுதல் அல்லது இஸ்ரவேல் ஏற்கெனவே நிலத்தைக் கைப்பற்றியதாகத் தோன்றாதபடி மாற்றுதல்
  rationale: பெறப்பட்ட எபிரெய உரை நேரடியாக இந்த ஒப்பீட்டைச் செய்கிறது. காலவரிசை அல்லது மூலவிமர்சனச் சிக்கலை மொழிபெயர்ப்பு மறைமுகமாகத் தீர்க்கக் கூடாது.
- issue: יהוה என்ற இறைப்பெயர்
  choice: யாவே
  alternative: கர்த்தர் அல்லது யெகோவா
  rationale: எபிரெய தனிப்பெயரைப் பட்டப்பெயரால் மாற்றாமல், தமிழில் வாசிக்கத்தக்க ஒலிபெயர்ப்பாக வழங்குகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், வாசிக்க எளிதான ஆனால் கண்ணியமான உரைநடை பயன்படுத்தப்பட்டது. எபிரெயத்தின் ‘இஸ்ரவேல்—தன்—தங்களுக்கு’ என்ற கூட்டொருமை/பன்மை மாற்றம் திட்டமிட்டு பாதுகாக்கப்பட்டது; உண்மையான சொற்பொருள் மாற்றுகள் அடிக்குறிப்புகளில் தரப்பட்டன.
