  naturalness: ‘தங்கள் முன்னிலையிலிருந்து அவர்களை அழித்து’ என்பது மூலத்திற்கு நெருக்கமாக இருந்தாலும் தமிழில் சொல் வரிசை கடினமாக உள்ளது. ‘அவர்களைத் தங்கள் முன்னிலையிலிருந்து அழித்து’ என்பது தெளிவானது. இறுதிக் கூறை ‘யாவே அவர்களுக்குக் கொடுத்த தன் உரிமை நிலத்தை இஸ்ரவேல் கைப்பற்றியபோது செய்ததுபோலவே’ என்று அமைப்பது நவீனத் தரத் தமிழில் இயல்பாகவும் ஒப்பீட்டின் மறைவான செயலைத் தெளிவாகவும் தெரிவிக்கிறது.
