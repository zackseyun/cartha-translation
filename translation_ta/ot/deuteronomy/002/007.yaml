  text: כִּי֩ יְהוָ֨ה אֱלֹהֶ֜י/ךָ בֵּֽרַכְ/ךָ֗ בְּ/כֹל֙ מַעֲשֵׂ֣ה יָדֶ֔/ךָ יָדַ֣ע לֶכְתְּ/ךָ֔ אֶת הַ/מִּדְבָּ֥ר הַ/גָּדֹ֖ל הַ/זֶּ֑ה זֶ֣ה אַרְבָּעִ֣ים שָׁנָ֗ה יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ עִמָּ֔/ךְ לֹ֥א חָסַ֖רְתָּ דָּבָֽר־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/007.yaml
  text: For Yahweh your God has blessed you in all the work of your hands[a]. He has known your walking through this great wilderness. These forty years Yahweh your God has been with you; you have lacked nothing.
translation:
  language: ta
  text: ஏனெனில், உன் கடவுளாகிய யாவே உன் கையின் எல்லாச் செயல்களிலும் உன்னை ஆசீர்வதித்திருக்கிறார். இந்தப் பெரிய பாலைநிலத்தின் வழியாக நீ பயணித்ததை அவர் அறிந்திருக்கிறார்.[a] இந்த நாற்பது ஆண்டுகளாக உன் கடவுளாகிய யாவே உன்னோடு இருந்திருக்கிறார்; உனக்கு எதுவும் குறைவுபடவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இந்தப் பெரிய பாலைநிலத்தின் வழியாக உன் பயணத்தை அவர் கவனித்து காத்திருக்கிறார்.” எபிரெய வினைச்சொல்லின் நேரடிப் பொருள் “அறிந்திருக்கிறார்”; இச்சூழலில் அது அக்கறையுடன் கவனித்ததையும் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைவனின் தனிப்பெயரான நான்கெழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் இயல்பாக ஒலிபெயர்க்கிறது.
- source_word: בֵּרַכְךָ
  choice: உன்னை ஆசீர்வதித்திருக்கிறார்
  rationale: நிறைவுற்ற செயலின் தற்போதைய தொடர்பையும் சமயச் சார்புடைய ‘ஆசீர்வதித்தல்’ என்ற பொருளையும் காக்கிறது.
- source_word: בְּכֹל מַעֲשֵׂה יָדֶךָ
  choice: உன் கைகளின் எல்லா வேலைகளிலும்
  rationale: ‘கையின் வேலை’ என்ற எபிரெய உருவகத்தை தமிழில் புரியத்தக்க விதத்தில் வழங்குகிறது; இஸ்ரவேல் மக்களை ஒருமையில் அழைக்கும் மூலத்தின் வடிவமும் காக்கப்படுகிறது.
- source_word: יָדַע
  choice: அறிந்திருக்கிறார்
  rationale: வினையின் அடிப்படைப் பொருளான ‘அறிதல்’ என்பதைக் காத்து, சூழலில் இருக்கக்கூடிய அக்கறையுடன் கவனித்தல் என்ற நுட்பத்தை அடிக்குறிப்பில் தருகிறது.
- source_word: לֶכְתְּךָ
  choice: நீ நடந்ததை
  rationale: הלך என்பதன் ‘நடத்தல்/செல்லுதல்’ பொருளை நேரடியாகவும் இயல்பான தமிழிலும் வெளிப்படுத்துகிறது.
- source_word: אֶת הַמִּדְבָּר הַגָּדֹל הַזֶּה
  choice: இந்தப் பெரிய பாலைநிலத்தின் வழியாக
  rationale: இங்கு குறிக்கப்படும் கடந்து செல்லும் பாதையைத் தமிழில் இயல்பாகத் தெளிவுபடுத்துகிறது.
- source_word: זֶה אַרְבָּעִים שָׁנָה
  choice: இந்த நாற்பது ஆண்டுகளாக
  rationale: நீடித்த கால அளவைக் குறிக்கும் எபிரெயச் சொற்றொடருக்கு இயல்பான நவீனத் தமிழ் வடிவம்.
- source_word: עִמָּךְ
  choice: உன்னோடு இருந்திருக்கிறார்
  rationale: எபிரெயில் வெளிப்படையாக இல்லாத இணைப்புவினையைத் தமிழுக்குத் தேவையானவாறு சேர்த்து, தொடர்ந்திருந்த இறைப் பிரசன்னத்தை வெளிப்படுத்துகிறது.
- source_word: לֹא חָסַרְתָּ דָּבָר
  choice: உனக்கு எதுவும் குறைவுபடவில்லை
  rationale: முழுமையான தேவைத்தீர்வைக் குறிக்கும் மூலமொழி மரபுத்தொடரை இயல்பான தமிழில் தருகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: யெகோவா; கர்த்தர்
  rationale: மூல வசனம் இறைவனின் தனிப்பெயரை நேரடியாகப் பயன்படுத்துவதால், அதை ஒரு பட்டமாக மாற்றாமல் ஒலிபெயர்த்து வழங்குகிறது.
- issue: יָדַע என்பதில் உள்ள அறிவும் பராமரிப்பும்
  choice: அறிந்திருக்கிறார்
  alternative: உன் பயணத்தைக் கவனித்துப் பராமரித்திருக்கிறார்
  rationale: அடிப்படைச் சொல்லின் உண்மையான தெளிவின்மையையும் இறையியல் நெருக்கடியையும் பிரதான உரையில் காத்து, சூழல் சார்ந்த அக்கறையான கண்காணிப்பு பொருளை அடிக்குறிப்பில் தெரிவிக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையும் வாசிப்பின் இயல்பும் காக்கப்பட்டுள்ளன. மூலத்தில் இஸ்ரவேல் மக்களிடம் பயன்படுத்தப்படும் ஒருமை இரண்டாம் நபர் வடிவம் ‘உன்/நீ/உனக்கு’ எனத் தொடர்ச்சியாகப் பாதுகாக்கப்பட்டுள்ளது.
