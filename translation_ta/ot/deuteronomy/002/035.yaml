  text: רַ֥ק הַ/בְּהֵמָ֖ה בָּזַ֣זְנוּ לָ֑/נוּ וּ/שְׁלַ֥ל הֶ/עָרִ֖ים אֲשֶׁ֥ר לָכָֽדְנוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/035.yaml
  text: Only the livestock we took as plunder for ourselves[a], along with the spoil of the cities that we captured.
translation:
  language: ta
  text: கால்நடைகளையும், நாங்கள் கைப்பற்றிய நகரங்களின் கொள்ளைப்பொருள்களையும் மட்டுமே நமக்கென்று எடுத்துக்கொண்டோம்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רַק
  choice: மட்டும்
  rationale: முந்தைய வசனத்தில் மனிதர்கள் முற்றிலும் அழிக்கப்பட்டதற்கு மாறாக, கால்நடைகளும் பொருட்களும் தக்கவைக்கப்பட்டன என்ற வரம்பை இயல்பான தமிழில் காட்டுகிறது.
- source_word: הַבְּהֵמָה
  choice: கால்நடைகள்
  rationale: இங்கு பொதுவாக விலங்குகளை அல்ல, போரில் கொள்ளையாகப் பிடிக்கப்பட்ட வீட்டுவளர்ப்பு மிருகங்களைக் குறிக்கிறது.
- source_word: בָּזַזְנוּ לָנוּ
  choice: நமக்காகக் கொள்ளையாக எடுத்துக்கொண்டோம்
  rationale: בזז என்பதன் கொள்ளையிடுதல் என்ற பொருளையும், לָנוּ என்பதன் பயனாளர் உணர்வையும் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: וּשְׁלַל
  choice: கொள்ளைப்பொருள்களையும்
  rationale: போரில் கைப்பற்றப்பட்ட உடைமைகளைச் சுட்டும் שָׁלָל என்பதற்கு நவீனத் தமிழில் தெளிவான கூட்டுப்பெயர்.
- source_word: הֶעָרִים
  choice: நகரங்கள்
  rationale: עִיר என்பதற்கான வழக்கமான, சூழலுக்கு ஏற்ற தமிழ் மொழிபெயர்ப்பு.
- source_word: אֲשֶׁר לָכָדְנוּ
  choice: நாங்கள் கைப்பற்றிய
  rationale: இராணுவச் சூழலில் לכד என்பது ஒரு நகரத்தைக் கைப்பற்றுவதைக் குறிக்கிறது.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியும் அதேவேளையில் கண்ணியமான உரைநடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய வாக்கியத்தின் இரு இணைச் செயப்படுபொருள்களையும் இயல்பான தமிழ் வரிசையில் அமைத்து, ‘மட்டும்’ இரண்டிற்கும் பொருந்துமாறு வைக்கப்பட்டுள்ளது.
