base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/036.yaml
  text: From Aroer[a], which is on the edge of the Arnon Valley, and the city that is in the valley, as far as Gilead, there was no town too high for us; Yahweh our God gave all of it before us.
translation:
  language: ta
  text: அர்னோன் பள்ளத்தாக்கின் விளிம்பிலுள்ள அரோவேர் தொடங்கி, பள்ளத்தாக்கிலுள்ள நகரத்தையும் சேர்த்து, கிலெயாதுவரை, நம்மால் எட்ட முடியாத அளவுக்கு உயர்ந்திருந்த பட்டணம் ஒன்றுகூட இல்லை[a]; நம் கடவுளாகிய யாவே அனைத்தையும் நமக்கு முன்பாகத் தந்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நம்மைவிட வலிமையான பட்டணம் ஒன்றுகூட இல்லை” அல்லது “நம்மால் அணுக முடியாத பட்டணம் ஒன்றுகூட இல்லை.” எபிரேயத்தில், எந்தப் பட்டணமும் “நம்மால் எட்ட முடியாத அளவுக்கு உயர்ந்திருக்கவில்லை” என்று சொல்லப்படுகிறது; இங்கு உயரம் என்பது பாதுகாப்பு வலிமை அல்லது அணுக முடியாத தன்மைக்கான உருவகம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵעֲרֹעֵר
  choice: அரோவேர் தொடங்கி
  rationale: முன்னொட்டு מ־ புவியியல் எல்லையின் தொடக்கப் புள்ளியைக் குறிக்கிறது; நவீன தமிழில் இயல்பாக இதைத் தெரிவிக்கிறது.
- source_word: שְׂפַת נַחַל אַרְנֹן
  choice: அர்னோன் பள்ளத்தாக்கின் விளிம்பு
  rationale: שָׂפָה என்பதன் அடிப்படைப் பொருளான ‘விளிம்பு/கரை’ என்பதையும், நַחַל குறிக்கும் ஓடைப்பள்ளத்தாக்கு நிலஅமைப்பையும் வாசிக்க எளிய முறையில் தக்கவைக்கிறது.
- source_word: וְהָעִיר אֲשֶׁר בַּנַּחַל
  choice: பள்ளத்தாக்கிலுள்ள நகரத்தையும் சேர்த்து
  rationale: எபிரெய இணைப்பை இயல்பான தமிழில் புவியியல் வரம்புக்குள் அடங்கும் கூடுதல் இடமாகக் காட்டுகிறது; நகரத்தின் அடையாளத்தை ஊகிக்கவில்லை.
- source_word: וְעַד הַגִּלְעָד
  choice: கிலெயாதுவரை
  rationale: עַד குறிக்கும் எல்லையின் முடிவுப் புள்ளியைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: קִרְיָה
  choice: பட்டணம்
  rationale: கோட்டையமைந்த குடியிருப்பையும் நகரையும் குறிக்கக்கூடிய சொல்லுக்கு, அளவை மிகைப்படுத்தாத பொதுவான தமிழ் இணை.
- source_word: שָׂגְבָה מִמֶּנּוּ
  choice: நமக்கு எட்டாத உயரத்தில் இருந்த
  rationale: உயரத்தால் பாதுகாப்பாக அல்லது அணுக முடியாததாக இருப்பது என்ற எபிரெய உருவகத்தைத் தீர்த்துவிடாமல் தக்கவைக்கிறது.
- source_word: אֶת־הַכֹּל
  choice: அவை அனைத்தையும்
  rationale: முன்னர் குறிப்பிடப்பட்ட பட்டணங்களையும் பிரதேசத்தையும் கூட்டாகச் சுட்டுகிறது; כֹּל என்பதன் முழுமைப் பொருளை வெளிப்படுத்துகிறது.
- source_word: יְהוָה אֱלֹהֵינוּ
  choice: நம் கடவுளாகிய யாவே
  rationale: יהוה என்ற உடன்படிக்கைப் பெயரை ‘யாவே’ என ஒலிபெயர்த்து, אֱלֹהֵינוּ என்பதைக் ‘நம் கடவுள்’ எனத் தெளிவாகக் கொடுக்கிறது.
- source_word: לְפָנֵינוּ
  choice: நமக்கு முன்பாக
  rationale: வெற்றிக்காக அவர்களிடம் ஒப்படைத்தல் என்ற சூழல்நிலைப் பொருளைச் சுமந்தபடியே எபிரெய மொழிப்படிமத்தைத் தக்கவைக்கிறது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் நேரடியாக வரும் நான்கெழுத்து இறைப்பெயரைப் பட்டப்பெயராக மாற்றாமல், உடன்படிக்கைப் பெயராக ஒலிபெயர்க்கிறது.
- issue: பட்டணங்கள் இஸ்ரவேலருக்கு முன்பாகக் கொடுக்கப்பட்டதன் பொருள்
  choice: நமக்கு முன்பாகத் தந்தார்
  alternative: நம் கையில் ஒப்புக்கொடுத்தார்
  rationale: வெற்றி அல்லது அதிகாரத்திற்குள் ஒப்படைத்தல் என்ற சூழல்நிலை உட்கருத்தை மிகையாக விளக்காமல், לְפָנֵינוּ என்ற மூல மொழிப்படிமத்தையும் இறைச் செயலின் வலியுறுத்தலையும் பாதுகாக்கிறது.
translation_notes:
  register: நவீன தரநிலைத் தமிழில் இயல்பான, கண்ணியமான நடையைப் பயன்படுத்துகிறது. புவியியல் பெயர்கள் வழக்கமான தமிழ் ஒலிபெயர்ப்பில் தரப்பட்டுள்ளன. ‘எட்டாத உயரம்’ என்ற உருவகம் மூலத்தின் உண்மையான பொருள் விரிவைத் தக்கவைக்கிறது; அதன் மாற்றுப் பொருள்கள் அடிக்குறிப்பில் வழங்கப்பட்டுள்ளன.
