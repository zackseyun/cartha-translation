  register: நவீனத் தரமான, மரியாதைமிக்க தமிழ் பயன்படுத்தப்பட்டுள்ளது. ஒருமை இரண்டாம் நபர் வடிவங்கள் மூலத்தின் இலக்கணத்தைப் பேணுகின்றன. எபிரெயப் படிமங்களை இயன்றவரை காக்கும்போது, தமிழில் செயற்கையாக ஒலிக்கும் ‘மக்களின் முகத்தின்மேல்’ போன்ற சொல்லுக்குச் சொல் அமைப்பு தவிர்க்கப்பட்டுள்ளது.
