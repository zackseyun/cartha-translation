base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/025.yaml
  text: Today I will begin to put the dread and fear of you on the face of the peoples under all the heavens[b][a], who will hear the report about you and will tremble and writhe because of you.
translation:
  language: ta
  text: இன்று நான், எல்லா வானங்களின்கீழும் உள்ள மக்கள்மேல் உன்னைக் குறித்த திகிலையும் அச்சத்தையும் உண்டாக்கத் தொடங்குவேன். அவர்கள் உன்னைப் பற்றிய செய்தியைக் கேட்டு[a], உன்னால் நடுங்கி வேதனையில் துடிப்பார்கள்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உன் புகழைக் கேட்டு” அல்லது “உன்னைப் பற்றிய தகவலைக் கேட்டு.” எபிரெயச் சொற்றொடர், உன்னைப் பற்றிய செய்தியையும் அந்தச் செய்தியால் உருவாகும் புகழையும் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “கடும் வேதனை அடைவார்கள்”; இவ்வினை பிரசவ வேதனையில் ஒருவர் துடிப்பதைப் போன்ற கடுமையான உடல் வேதனையையும் உணர்த்தலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַיּוֹם הַזֶּה אָחֵל תֵּת
  choice: இன்று நான் ... உண்டாக்கத் தொடங்குவேன்
  rationale: חלל என்பதன் Hiphil வடிவமும் נתן என்பதன் infinitive construct வடிவமும் சேர்ந்து ‘கொடுக்க/ஏற்படுத்தத் தொடங்கு’ என்ற பொருளைத் தருகின்றன. அச்சம் மக்களிடம் ஏற்படுவதை இயல்பான தமிழில் ‘உண்டாக்கத் தொடங்குவேன்’ எனத் தருகிறது.
- source_word: פַּחְדְּךָ וְיִרְאָתְךָ
  choice: உன்னைக் குறித்த திகிலையும் அச்சத்தையும்
  rationale: இரண்டு இணையான எபிரெயச் சொற்களின் வேறுபாட்டை ‘திகில்’, ‘அச்சம்’ எனப் பேணுகிறது; இது இஸ்ரவேலின் சொந்த அச்சத்தை அல்ல, அவனைக் கண்டு பிறர் அடையும் அச்சத்தைக் குறிக்கிறது.
- source_word: עַל פְּנֵי הָעַמִּים
  choice: மக்கள்மீது
  rationale: சொல்லுக்குச் சொல் ‘மக்களின் முகத்தின்மேல்’ என்றிருந்தாலும், இங்கு עַל־פְּנֵי என்பது தாக்கம் மக்கள்மீது வருவதைக் குறிக்கும் வழக்கு. ‘மக்கள்மீது’ என்பது பொருளைத் துல்லியமாகவும் இயல்பாகவும் தருகிறது.
- source_word: תַּחַת כָּל הַשָּׁמָיִם
  choice: வானங்கள் அனைத்தின் கீழுமுள்ள
  rationale: ‘எல்லா வானங்களின் கீழ்’ என்ற எபிரெய வடிவத்தையும், உலகெங்குமுள்ள மக்களைக் குறிக்கும் அதன் பரந்த பொருளையும் பேணுகிறது.
- source_word: אֲשֶׁר יִשְׁמְעוּן שִׁמְעֲךָ
  choice: அவர்கள் உன்னைப் பற்றிய செய்தியைக் கேட்டு
  rationale: שֵׁמַע என்பது செய்தி, கேள்விப்பட்ட தகவல், அல்லது அதனால் உருவாகும் புகழ் எனப் பொருள்படலாம். முதன்மை உரை இந்தப் பொருள் வரம்பை ‘செய்தி’ எனப் பரவலாகத் தருகிறது; மாற்றுப் பொருள்கள் அடிக்குறிப்பில் குறிப்பிடப்படுகின்றன.
- source_word: וְרָגְזוּ
  choice: நடுங்கி
  rationale: பயத்தால் குலுங்குதல் அல்லது பதற்றமடைதல் என்ற வினையின் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: וְחָלוּ
  choice: வேதனையில் துடிப்பார்கள்
  rationale: கடுமையான உடல் வேதனையில் துடித்தல் என்ற உயிரோட்டமான படிமத்தைப் பேணுகிறது; பிரசவ வேதனையை மட்டும் முதன்மை உரையில் கட்டாயப்படுத்தவில்லை.
- source_word: מִפָּנֶיךָ
  choice: உன்னால்
  rationale: சொல்லுக்குச் சொல் ‘உன் முகத்திற்கு/முன்னிலையிலிருந்து’ என்றாலும், இச்சூழலில் மக்களின் நடுக்கத்துக்கும் வேதனைக்கும் நீயே காரணம் என்பதைக் குறிக்கிறது. ‘உன்னால்’ என்பது இதைத் தெளிவாகத் தருகிறது.
