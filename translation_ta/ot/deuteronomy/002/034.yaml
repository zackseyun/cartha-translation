source:
  edition: WLC
  text: וַ/נִּלְכֹּ֤ד אֶת כָּל עָרָי/ו֙ בָּ/עֵ֣ת הַ/הִ֔וא וַֽ/נַּחֲרֵם֙ אֶת כָּל עִ֣יר מְתִ֔ם וְ/הַ/נָּשִׁ֖ים וְ/הַ/טָּ֑ף לֹ֥א הִשְׁאַ֖רְנוּ שָׂרִֽיד־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/034.yaml
  text: At that time we captured all his cities[a], and we devoted to destruction every inhabited city, with the women and the little children. We left no survivor.
translation:
  language: ta
  text: அக்காலத்தில் அவனுடைய நகரங்கள் அனைத்தையும் கைப்பற்றினோம். ஒவ்வொரு நகரத்தையும், அதிலிருந்த ஆண்கள், பெண்கள், சிறு குழந்தைகள் உட்பட, அழிவுக்கென ஒதுக்கினோம்[a]. உயிர்தப்பியவர் ஒருவரையும் விட்டுவைக்கவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஒவ்வொரு நகரத்திற்கும் அழிவுக்கெனத் தடை விதித்தோம்.” எபிரெய வினைச்சொல் ḥērem (ஹேரேம்) என்பதின் கீழ் ஒன்றை அழிவுக்கென ஒதுக்கும் கருத்தைக் கொண்டுள்ளது.
    reason: חרם என்ற தொழில்நுட்பச் சொல்லின் இன்னும் முறையான மாற்றையும் அதன் நுணுக்கத்தையும் பதிவு செய்தல்.
lexical_decisions:
- source_word: וַנִּלְכֹּד
  choice: கைப்பற்றினோம்
  rationale: לכד என்பது போரில் ஒரு நகரத்தைக் கைப்பற்றுவதைக் குறிக்கும் வழக்கமான வினை; “கைப்பற்றினோம்” என்பது இயல்பான நவீனத் தமிழில் வெற்றிகொண்டு வசப்படுத்திய பொருளைத் தெளிவாகத் தருகிறது.
- source_word: כָּל עָרָיו
  choice: அவனுடைய நகரங்கள் அனைத்தையும்
  rationale: כָּל என்பதன் முழுமையையும் עָרָיו என்பதிலுள்ள மூன்றாம் ஆண்பால் ஒருமை உடைமைச் சுட்டையும் வெளிப்படையாகப் பாதுகாக்கிறது.
- source_word: בָּעֵת הַהִוא
  choice: அக்காலத்தில்
  rationale: எபிரெய காலக் குறிப்பைச் சுருக்கமாகவும் இயல்பாகவும் எடுத்துரைக்கிறது.
- source_word: וַנַּחֲרֵם
  choice: அழிக்கப்படுவதற்கென ஒதுக்கினோம்
  rationale: חרם என்பதன் ஹிஃபில் வடிவம் ஒன்றை சாதாரணமாக அழிப்பதை மட்டும் அல்லாமல், அழிவுக்கெனத் தனியே ஒதுக்கும் தொழில்நுட்பமான கருத்தையும் கொண்டுள்ளது. தேர்ந்த சொற்றொடர் அந்த இரு கூறுகளையும் வாசிக்கத்தக்க நவீனத் தமிழில் காக்கிறது.
- source_word: כָּל עִיר מְתִם
  choice: குடியிருந்த ஒவ்வொரு நகரத்தையும்—ஆண்களையும்
  rationale: சுருக்கமான எபிரெயத் தொடரில் מְתִם மனிதக் குடியிருப்பையும் குறிப்பாக ஆண்களையும் சுட்டுகிறது. “குடியிருந்த” என்பது நகரங்கள் வெறுமையானவை அல்ல என்பதைத் தெரிவிக்க, தொடர்ந்து வரும் “ஆண்களையும்” பாலின/location specificity-ஐ வெளிப்படையாகக் காக்கிறது.
- source_word: וְהַנָּשִׁים וְהַטָּף
  choice: பெண்களையும் சிறு குழந்தைகளையும்
  rationale: பெண்கள் மற்றும் இளம் குழந்தைகள் என்ற தனித்த வகைகளை எபிரெய உரைக்கு ஏற்ப நேரடியாகப் பாதுகாக்கிறது; טף என்பதின் இளவயது நுணுக்கத்தை “சிறு குழந்தைகள்” தருகிறது.
- source_word: לֹא הִשְׁאַרְנוּ שָׂרִיד
  choice: உயிர்தப்பியவர் ஒருவரையும் விட்டுவைக்கவில்லை
  rationale: שָׂרִיד என்பது இப்போர்ச் சூழலில் உயிர்தப்பியவரைக் குறிக்கிறது. தமிழ் வடிவம் எவரும் மீதியாக விடப்படவில்லை என்ற முழுமையை இயல்பாகத் தருகிறது.
theological_decisions:
- issue: வெற்றிப்போர் உரையில் חרם என்ற தொழில்நுட்பச் சொல்லின் மொழிபெயர்ப்பு
  choice: அழிக்கப்படுவதற்கென ஒதுக்கினோம்
  alternative: முற்றிலும் அழித்தோம்
  rationale: தேர்ந்த வடிவம் நிகழ்ந்த அழிவை மென்மைப்படுத்தாமல், அதே நேரத்தில் חרם என்பதில் உள்ள அழிவுக்கென ஒதுக்குதல் என்ற புனித-நீதித்துறை நுணுக்கத்தையும் காக்கிறது. “முற்றிலும் அழித்தோம்” என்பது விளைவைத் தரினும் அந்தத் தொழில்நுட்பக் கூறைத் தட்டையாக்கும்.
- issue: מְתִם என்பதிலுள்ள ஆண்பால் குறிப்பை வெளிப்படுத்துதல்
  choice: ஆண்களையும் பெண்களையும் சிறு குழந்தைகளையும்
  alternative: மக்களையும், பெண்கள் மற்றும் குழந்தைகள் உட்பட
  rationale: மூல உரை ஆண்கள், பெண்கள், சிறு குழந்தைகள் என வேறுபடுத்துகிறது. பொதுவான “மக்கள்” என்று மாற்றாமல் அந்த வேறுபாட்டைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியக்கூடியதாயும் கண்ணியமானதாயும் வடிவமைக்கப்பட்டது. போரின் வன்முறையையோ ஆண்கள், பெண்கள், சிறு குழந்தைகள் என்ற வெளிப்படையான பட்டியலையோ மென்மைப்படுத்தவில்லை. கோடுகளால் அமைந்த இடைச்செருகல், நகரங்களையும் அவற்றின் குடியிருப்பாளர்களையும் ஒரே அழிப்பு வாக்கியத்தோடு இயல்பாக இணைக்கிறது.
