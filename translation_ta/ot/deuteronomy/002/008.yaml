revisions:
- from: 'சேயீரில் குடியிருக்கும் ஏசாவின் மக்களாகிய நம் சகோதரர்களைக்[a] கடந்து, அரபா[b] வழியைவிட்டு, ஏலாத்திலிருந்தும் எசியோன்-கேபேரிலிருந்தும் தொடர்ந்து சென்றோம். பின்பு நாங்கள் திசைதிரும்பி, மோவாபின் வனாந்தர வழியாகச் சென்றோம்.


    [a] எபிரெய மூலத்தில், “நம் சகோதரர்களாகிய ஏசாவின் மகன்கள்” என்று உள்ளது. இங்கு “மகன்கள்” என்பது ஏசாவின் வழிவந்தவர்களைக் குறிக்கிறது.

    [b] “அரபா வழியிலிருந்து” என்றும் மொழிபெயர்க்கலாம். “அரபா” என்பது சவக்கடலுக்குத் தெற்கே நீளும் பிளவுப் பள்ளத்தாக்குப் பகுதியின் பெயர்.'
  to: சேயீரில் குடியிருக்கும் ஏசாவின் மகன்களாகிய நம் சகோதரர்களை விட்டு விலகி, ஏலாத்திலிருந்தும் எசியோன்-கேபேரிலிருந்தும் செல்லும் அரபா வழியை விட்டு நாங்கள் கடந்துசென்றோம். பின்னர் நாங்கள் திசை திரும்பி, மோவாபின் வனாந்தர வழியாகச் சென்றோம்.
  rationale: The revision retains the Hebrew kinship language and both occurrences of the travel verb while making the Arabah road’s relationship to Elath and Ezion-geber clear in natural modern Tamil. It removes an unnecessary addition and deletes the now-superfluous footnote a. Footnote b remains anchored to “அரபா.”
