  text: וַֽ/נַּעֲבֹ֞ר מֵ/אֵ֧ת אַחֵ֣י/נוּ בְנֵי עֵשָׂ֗ו הַ/יֹּֽשְׁבִים֙ בְּ/שֵׂעִ֔יר מִ/דֶּ֨רֶךְ֙ הָֽ/עֲרָבָ֔ה מֵ/אֵילַ֖ת וּ/מֵ/עֶצְיֹ֣ן גָּ֑בֶר וַ/נֵּ֨פֶן֙ וַֽ/נַּעֲבֹ֔ר דֶּ֖רֶךְ מִדְבַּ֥ר מוֹאָֽב־ס׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/008.yaml
  text: So we passed on from our brothers[a], the sons of Esau, who live in Seir, away from the way of the Arabah, from Elath and from Ezion-geber[b]; and we turned and passed by the way of the wilderness of Moab.
translation:
  language: ta
  text: சேயீரில் குடியிருக்கும் ஏசாவின் மகன்களாகிய நம் சகோதரர்களை விட்டு விலகி, ஏலாத்திலிருந்தும் எசியோன்-கேபேரிலிருந்தும் செல்லும் அரபா வழியை விட்டு நாங்கள் கடந்துசென்றோம். பின்னர் நாங்கள் திசை திரும்பி, மோவாபின் வனாந்தர வழியாகச் சென்றோம்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַנַּעֲבֹר מֵאֵת
  choice: கடந்து ... தொடர்ந்து சென்றோம்
  rationale: עבר என்பதன் பயணச் சூழலிலான ‘கடந்து செல்லுதல்/தொடர்ந்து செல்லுதல்’ என்ற பொருளையும், מֵאֵת காட்டும் ஒருவரிடமிருந்து விலகிச் செல்லும் நுணுக்கத்தையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: אַחֵינוּ בְנֵי עֵשָׂו
  choice: ஏசாவின் மக்களாகிய நம் சகோதரர்கள்
  rationale: இஸ்ரவேலருக்கும் ஏதோமியருக்கும் உள்ள உறவுமுறையைச் சுட்டும் ‘சகோதரர்கள்’ என்பதைக் காக்கிறது; ‘மக்கள்’ என்பது இங்கு வழிவந்தவர்களை இயல்பாகக் குறிக்கிறது, நேரடி வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: הַיֹּשְׁבִים בְּשֵׂעִיר
  choice: சேயீரில் குடியிருக்கும்
  rationale: ישב என்னும் பங்கேற்புவினை நிலையான குடியிருப்பைக் குறிக்கிறது; ‘குடியிருக்கும்’ நவீனத் தமிழில் இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: מִדֶּרֶךְ הָעֲרָבָה
  choice: அரபா வழியைவிட்டு
  rationale: מִן விலகிச் செல்லுதலைக் காட்டுகிறது; דרך என்பதற்கு ‘வழி’ என்றும், அர்த்தத்தை பாலைவெளி எனச் சுருக்காமல் הָעֲרָבָה என்பதை இடப்பெயராக ‘அரபா’ என்றும் வழங்குகிறது.
- source_word: מֵאֵילַת וּמֵעֶצְיֹן גָּבֶר
  choice: ஏலாத்திலிருந்தும் எசியோன்-கேபேரிலிருந்தும்
  rationale: இரு இடப்பெயர்களையும் தமிழுக்கு ஏற்ற ஒலிபெயர்ப்பில் வழங்கி, மீண்டும் வரும் מִן முன்னிடைச்சொல்லின் ‘இலிருந்து’ என்ற பொருளைக் காக்கிறது.
- source_word: וַנֵּפֶן
  choice: நாங்கள் திசைதிரும்பி
  rationale: פנה இங்கு பயணத் திசையை மாற்றுவதைக் குறிக்கிறது; வெறும் ‘திரும்பி’ என்பதில் ஏற்படக்கூடிய பின்னோக்கிச் சென்றனர் என்ற தவறான புரிதலைத் தவிர்க்கிறது.
- source_word: וַנַּעֲבֹר דֶּרֶךְ מִדְבַּר מוֹאָב
  choice: மோவாபின் வனாந்தர வழியாகச் சென்றோம்
  rationale: דֶּרֶךְ מִדְבַּר מוֹאָב என்ற தொடர் மோவாபின் வனாந்தரப் பகுதி வழியான பயணத்தைக் குறிக்கிறது; ‘வனாந்தரம்’ வேதாகமப் புவியியல் சூழலில் புரியக்கூடிய மரியாதையான சொல்.
theological_decisions:
- issue: ஏதோமியரைப் பற்றிய உறவுமுறை மொழி
  choice: ஏசாவின் மக்களாகிய நம் சகோதரர்கள்
  alternative: ஏசாவின் வழிவந்த நம் உறவினர்கள்
  rationale: ‘உறவினர்கள்’ என்பது பொருளைத் தரினும், எபிரெயத்தின் நேரடியான ‘நம் சகோதரர்கள்’ என்ற சொல்லாட்சி இஸ்ரவேல்–ஏதோம் உறவின் வலிமையைத் தக்கவைக்கிறது; ‘மகன்கள்’ என்ற தலைமுறைச் சொல்லின் பரந்த வழிவந்தோர் பொருள் அடிக்குறிப்பில் தெளிவுபடுத்தப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பயண விவரணைக்கு ஏற்ற மரியாதையான மற்றும் எளிதில் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. ‘சகோதரர்கள்’ என்ற மூல உறவுமுறைச் சொல் காக்கப்பட்டுள்ளது; இடப்பெயர்கள் மொழிபெயர்க்கப்படாமல் தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளன. மூலத்தில் ஒரே עבר வேர்ச்சொல் இருமுறை வருவதைக் தமிழின் இயல்புக்கேற்ப ‘கடந்து ... தொடர்ந்து சென்றோம்’ மற்றும் ‘வழியாகச் சென்றோம்’ என வழங்கியுள்ளோம்.
