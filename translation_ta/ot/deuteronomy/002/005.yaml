source:
  edition: WLC
  text: אַל תִּתְגָּר֣וּ בָ֔/ם כִּ֠י לֹֽא אֶתֵּ֤ן לָ/כֶם֙ מֵֽ/אַרְצָ֔/ם עַ֖ד מִדְרַ֣ךְ כַּף רָ֑גֶל כִּֽי יְרֻשָּׁ֣ה לְ/עֵשָׂ֔ו נָתַ֖תִּי אֶת הַ֥ר שֵׂעִֽיר־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/005.yaml
  text: Do not provoke them[a], for I will not give you any of their land, not even enough to set the sole of a foot on[c][b], because I have given Mount Seir to Esau as a possession.
translation:
  language: ta
  text: அவர்களோடு சண்டையைத் தூண்டாதீர்கள்; ஏனெனில், அவர்களுடைய நாட்டிலிருந்து உள்ளங்கால் பதிக்கும் அளவுகூட நான் உங்களுக்குக் கொடுக்கமாட்டேன். சேயீர் மலைநாட்டை ஏசாவுக்கு உடைமையாக[a] கொடுத்திருக்கிறேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “உடைமையாக” என்பதை “பரம்பரைச் சொத்தாக” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּתְגָּרוּ בָם
  choice: அவர்களோடு சண்டையைத் தூண்டாதீர்கள்
  rationale: התגרה ב என்பது பகைமையான மோதலைத் தூண்டுதல் அல்லது அதில் இறங்குதல் என்ற பொருளைக் கொண்டது. போரையே மட்டும் குறிப்பதாக மிகைப்படுத்தாமல், சூழலில் தடைசெய்யப்படும் பகை நடவடிக்கையை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: לֹא אֶתֵּן לָכֶם מֵאַרְצָם
  choice: அவர்களுடைய நாட்டில் ... நான் உங்களுக்குக் கொடுக்கமாட்டேன்
  rationale: מִן இங்கு பகுதியைக் குறிக்கிறது; அவர்களுடைய நிலப்பரப்பிலிருந்து எந்தப் பகுதியும் இஸ்ரவேலுக்குக் கொடுக்கப்படாது என்பதைத் தமிழ் வாக்கிய அமைப்பில் இயல்பாகத் தெரிவிக்கிறது.
- source_word: עַד מִדְרַךְ כַּף רָגֶל
  choice: உள்ளங்கால் பதிக்கும் அளவுகூட
  rationale: காலின் உள்ளங்கால் மிதிக்கத் தேவையான மிகச் சிறிய இடத்தைக்கூட குறிக்கும் எபிரெய உருவகத்தைச் சுருக்கமாகவும் புரியத்தக்கவாறும் காக்கிறது.
- source_word: יְרֻשָּׁה
  choice: உடைமையாக
  rationale: இச்சொல் பரம்பரைச் சொத்து அல்லது உடைமை எனப் பொருள்படலாம். இங்கு கடவுள் வழங்கிய நிலவுடைமையே முன்னிலைப்படுவதால் ‘உடைமையாக’ தேர்ந்தெடுக்கப்பட்டது; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: לְעֵשָׂו
  choice: ஏசாவுக்கு
  rationale: பெயர் தமிழில் வழக்கமான வடிவில் ஒலிபெயர்க்கப்பட்டு, வழங்கப்பட்டதன் பெறுநரைக் குறிக்கும் இலக்கண உறவு காக்கப்படுகிறது.
- source_word: הַר שֵׂעִיר
  choice: சேயீர் மலைநாட்டை
  rationale: הַר என்பது தனி மலையை மட்டுமல்லாமல் மலைப்பாங்கான பகுதியையும் குறிக்கக்கூடும். இச்சூழலில் ஏசாவுக்குக் கொடுக்கப்பட்ட பிரதேசத்தைக் குறிப்பதால் ‘மலைநாடு’ இயல்பாகவும் துல்லியமாகவும் உள்ளது.
theological_decisions:
- issue: ஏதோமிய நிலப்பரப்பின் தெய்வீக ஒதுக்கீடு
  choice: இஸ்ரவேல் ஏசாவின் மக்களுடன் மோதலைத் தூண்டக்கூடாது; ஏனெனில் சேயீர் பகுதியைக் கடவுளே ஏசாவுக்கு வழங்கியுள்ளார்.
  alternative: இதைத் தெய்வீக நில ஒதுக்கீட்டை வலியுறுத்தாத வெறும் அரசியல் தடையாக வாசித்தல்.
  rationale: 'இரு כִּי கூறுகளும் கட்டளைக்கான காரணத்தைத் தருகின்றன: அவர்களுடைய நிலம் இஸ்ரவேலுக்குக் கொடுக்கப்படாது; அது ஏசாவுக்கு வழங்கப்பட்டுள்ளது. இந்தக் காரணத் தொடர்பு விளக்கச் சேர்க்கையின்றிக் காக்கப்படுகிறது.'
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. எபிரெய உருவகமான ‘உள்ளங்கால் பதிக்கும் அளவு’ காக்கப்பட்டுள்ளது. சேயீர் என்பது இங்கு நிலப்பரப்பைக் குறிப்பதால் ‘மலைநாடு’ என முதன்மை உரையில் தரப்பட்டுள்ளது.
