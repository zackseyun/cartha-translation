source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֵלַ֗/י אֶל תָּ֨צַר֙ אֶת מוֹאָ֔ב וְ/אַל תִּתְגָּ֥ר בָּ֖/ם מִלְחָמָ֑ה כִּ֠י לֹֽא אֶתֵּ֨ן לְ/ךָ֤ מֵֽ/אַרְצ/וֹ֙ יְרֻשָּׁ֔ה כִּ֣י לִ/בְנֵי ל֔וֹט נָתַ֥תִּי אֶת עָ֖ר יְרֻשָּֽׁה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/009.yaml
  text: And Yahweh said to me[a], “Do not harass Moab or provoke them to war, for I will not give you any of its land as a possession[b], because I have given Ar to the sons of Lot as a possession.”
translation:
  language: ta
  text: யாவே என்னிடம், “மோவாபைத் துன்புறுத்தாதே; அவர்களோடு போரில் ஈடுபடாதே[a]. ஏனெனில், அதன் நாட்டில் ஒரு பகுதியைக்கூட உனக்கு உரிமைச் சொத்தாகக் கொடுக்கமாட்டேன்[b]. லோத்தின் புதல்வர்களுக்கு ஆரை உரிமைச் சொத்தாகக் கொடுத்திருக்கிறேன்” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மோவாபைத் தொந்தரவு செய்யாதே; அவர்களோடு போரில் மோதாதே.”
    reason: lexical_alternative
  - marker: b
    text: இவ்வசனத்தில் இருமுறை வரும் “உரிமைச் சொத்தாக” என்பதற்கு, “சுதந்தரமாக” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைத் திருப்பெயரை ஒரு பட்டத்தால் மாற்றாமல், எபிரெய மெய்யெழுத்துப் பெயரின் பரவலாக ஏற்றுக்கொள்ளப்பட்ட உச்சரிப்பைத் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: אֶל תָּצַר אֶת מוֹאָב
  choice: மோவாபைத் துன்புறுத்தாதே
  rationale: צרר இங்கு முழுப் போருக்கு முந்திய பகைமை அழுத்தத்தையோ தொல்லையையோ குறிக்கிறது; ‘துன்புறுத்தாதே’ என்பது அந்தப் பரந்த பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: וְאַל תִּתְגָּר בָּם מִלְחָמָה
  choice: அவர்களோடு போரைத் தொடங்காதே
  rationale: גרה என்பதன் இவ்வடிவமும் ‘போர்’ என்ற பெயர்ச்சொல்லும் சேர்ந்து, அவர்களுக்கு எதிராகப் போரில் இறங்குவதையோ பகைமையைத் தொடங்குவதையோ குறிக்கின்றன.
- source_word: מֵאַרְצוֹ
  choice: அதன் நாட்டில் ஒரு பகுதியைக்கூட
  rationale: ஒருமை பின்னொட்டு மோவாபை ஓர் அரசியல் நிலப்பகுதியாகச் சுட்டுகிறது; מִן என்பதன் பகுதிப்பொருளை ‘ஒரு பகுதியைக்கூட’ தெளிவாக வெளிப்படுத்துகிறது.
- source_word: יְרֻשָּׁה
  choice: உரிமைச் சொத்தாக
  rationale: பங்காகப் பெற்று நிலையாக உடைமையாக்கப்படும் நிலத்தைக் குறிக்கிறது; ‘உரிமைச் சொத்து’ என்பது உடைமை மற்றும் பங்குரிமை ஆகிய இரு நுணுக்கங்களையும் தாங்குகிறது.
- source_word: לִבְנֵי לוֹט
  choice: லோத்தின் மக்களுக்கு
  rationale: எபிரெய மூலத்தின் வம்சவழிச் சொல்லாக்கத்தைப் பாதுகாக்கிறது; சூழலில் இது லோத்தின் வழிவந்தவர்களைக் குறிக்கிறது.
- source_word: עָר
  choice: ஆர்
  rationale: இடப்பெயரைத் தமிழின் ஒலியமைப்புக்கு ஏற்றவாறு நேரடியாக ஒலிபெயர்க்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைத் திருப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூலத்தில் பட்டம் அல்ல, தனிப்பட்ட இறைத் திருப்பெயரே உள்ளது; ஆகவே அதை மறைக்காமல் ஒலிபெயர்ப்பது மூலவடிவைத் தெளிவாகப் பாதுகாக்கிறது.
- issue: יְרֻשָּׁה என்பதில் உடைமையா, சுதந்தரமா
  choice: உரிமைச் சொத்து
  alternative: சுதந்தரம்
  rationale: இச்சொல் பங்காக வழங்கப்பட்ட நிலையான உடைமையைக் குறிக்க முடியும். ‘உரிமைச் சொத்து’ அந்தப் பொருளைத் தெளிவாகத் தருகிறது; ‘சுதந்தரம்’ என்பதும் சாத்தியமான வாசிப்பாக அடிக்குறிப்பில் வைக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், எளிதில் புரியும் அதேவேளையில் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ஒருமையில் வரும் மோவாப் நாட்டுக்கும் பன்மையில் வரும் மோவாபிய மக்களுக்கும் இடையிலான மூலமொழி வேறுபாடு ‘அதன்’ / ‘அவர்களோடு’ எனப் பாதுகாக்கப்பட்டுள்ளது.
