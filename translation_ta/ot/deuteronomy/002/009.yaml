  terminology: ‘யாவே’ மூலத்தின் தனிப்பட்ட இறைநாமத்தைப் பாதுகாக்கிறது. יְרֻשָּׁה-க்கு ‘உரிமைச் சொத்தாக’ என்பது ஏற்கத்தக்கது; இரு நிகழ்வுகளிலும் ஒரே சொல்லைப் பயன்படுத்துவது நல்லது. ‘சுதந்தரமாக’ என்ற மாற்றுவாசிப்பு அடிக்குறிப்பில் தக்கவைக்கப்படுகிறது.
