  source_fidelity: யாவே, மோவாப், அதன் நாடு/அவர்களோடு என்ற குறிப்பு வேறுபாடு, நிலத்தின் ஒரு பகுதியும் வழங்கப்படாது என்ற பொருள், ஆர், மற்றும் இருமுறை வரும் יְרֻשָּׁה ஆகியவை அடிப்படையில் சரியாகத் தரப்பட்டுள்ளன. ஆனால் וְאַל־תִּתְגָּר בָּם מִלְחָמָה என்பது பொதுவாக ‘அவர்களோடு போரில் ஈடுபடாதே/போரிடாதே’ என்ற நேரடிப் பொருளை உடையது; ‘போரைத் தொடங்காதே’ என்பது தேவையற்ற வகையில் தொடக்கச் செயலை மட்டும் வலியுறுத்துகிறது. לִבְנֵי לוֹט என்பதன் வெளிப்படையான ‘புதல்வர்கள்’ என்ற வம்சவழிச் சொல்லாக்கமும் திருத்தத்தில் காக்கப்படுகிறது.
