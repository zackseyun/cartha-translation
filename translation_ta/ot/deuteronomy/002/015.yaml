id: DEU.2.15
reference: Deuteronomy 2:15
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וְ/גַ֤ם יַד יְהוָה֙ הָ֣יְתָה בָּ֔/ם לְ/הֻמָּ֖/ם מִ/קֶּ֣רֶב הַֽ/מַּחֲנֶ֑ה עַ֖ד תֻּמָּֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/015.yaml
  text: Moreover[a], the hand of Yahweh was against them[b], to throw them into confusion from the midst of the camp until they were finished off.
translation:
  language: ta
  text: மேலும், முகாமின் நடுவிலிருந்தே அவர்களை நிலைகுலையச் செய்வதற்கும், அவர்கள் முற்றிலும் முடிவுக்கு வரும்வரையும் யாவேயின் கை அவர்களுக்கு எதிராக இருந்தது.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְגַם
  choice: மேலும்
  rationale: முந்தைய வசனத்துடன் இணைக்கும் கூட்டல் மற்றும் வலியுறுத்தல் ஆகிய இரு நுணுக்கங்களையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: יַד יְהוָה
  choice: யாவேயின் கை
  rationale: இறைவனுடைய வல்லமையையும் செயலையும் குறிக்கும் எபிரெய உருவகத்தைத் தக்கவைத்து, יהוה என்ற உடன்படிக்கைப் பெயரை ‘யாவே’ என்று ஒலிபெயர்க்கிறது.
- source_word: בָם
  choice: அவர்களுக்கு எதிராக
  rationale: யாவேயின் ‘கை’ அவர்கள்மீது பகைமைத் தீர்ப்பாகச் செயல்பட்டதைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: לְהֻמָּם
  choice: அவர்களை நிலைகுலையச் செய்வதற்காக
  rationale: המם வினையின் பதற்றம், குழப்பம், சிதறல் உண்டாக்கும் பொருளைத் தக்கவைக்கிறது; அதன் விளைவாக ஏற்பட்ட அழிவை வினையின் நேரடிப் பொருளாக மாற்றிவிடவில்லை.
- source_word: מִקֶּרֶב הַמַּחֲנֶה
  choice: முகாமின் நடுவிலிருந்து
  rationale: முகாமின் உள்ளிருந்து அல்லது அதன் மத்தியிலிருந்து அவர்கள் அகற்றப்படும் எபிரெய மொழியின் இடவியல் படிமத்தைப் பாதுகாக்கிறது.
- source_word: עַד תֻּמָּם
  choice: அவர்கள் முற்றிலும் ஒழிந்துபோகும்வரை
  rationale: அந்தத் தலைமுறை முழுமையாக முடிவுக்கு வந்ததை இயல்பான தமிழில் தெரிவிக்கிறது; செயப்படுபொருள் சார்ந்த முடிவு நுணுக்கத்தையும் காக்கிறது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலத்தில் நான்கெழுத்து உடன்படிக்கைப் பெயர் நேரடியாக இருப்பதால், பொதுப்பட்டப் பெயராக மாற்றாமல் ‘யாவே’ என்று ஒலிபெயர்க்கப்பட்டுள்ளது.
- issue: இறைத் தீர்ப்பின் செயலை לְהֻמָּם என்பதில் எவ்வாறு வெளிப்படுத்துவது
  choice: நிலைகுலையச் செய்வது
  alternative: அழித்தொழிப்பது
  rationale: இச்சொல் ஏற்படுத்தும் பதற்றம் அல்லது குழப்பம் என்ற உடனடிப் பொருளையும், தொடர்ந்து வரும் முற்றழிவு என்ற விளைவையும் ஒன்றாகக் கலக்காமல் வேறுபடுத்திக் காட்டுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளக்கூடிய கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘யாவேயின் கை’ என்ற மூல உருவகம் பாதுகாக்கப்பட்டுள்ளது. வசனத்தின் நோக்குறவு மற்றும் கால எல்லை தெளிவாக இருக்கச் சொற்தொடர்கள் தமிழுக்கேற்ற வரிசையில் அமைக்கப்பட்டுள்ளன.
