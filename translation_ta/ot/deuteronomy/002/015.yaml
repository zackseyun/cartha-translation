revisions:
- from: மேலும், முகாமின் நடுவிலிருந்து அவர்களை நிலைகுலையச் செய்வதற்காக[a], அவர்கள் முற்றிலும் ஒழிந்துபோகும்வரை[b] யாவேயின் கை அவர்களுக்கு எதிராக இருந்தது.
  to: மேலும், முகாமின் நடுவிலிருந்தே அவர்களை நிலைகுலையச் செய்வதற்கும், அவர்கள் முற்றிலும் முடிவுக்கு வரும்வரையும் யாவேயின் கை அவர்களுக்கு எதிராக இருந்தது.
  rationale: The revision clarifies that the camp phrase belongs with the discomfiting action, while retaining its spatial sense. It also uses a more idiomatic Tamil expression for the group’s final completion. Footnote anchors remain on the two relevant lexical expressions and the notes preserve the source’s lexical alternatives.
