translation_notes:
  register: நவீனத் தரமான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. இது அடுத்த வசனத்தில் தொடரும் காலச் சார்பு வாக்கியம் என்பதால் இறுதியில் காற்புள்ளி வைக்கப்பட்டுள்ளது. ‘இறந்து முடிந்தபோது’ என்பது தமிழில் சற்றே வலியுறுத்தப்பட்ட அமைப்பாக இருந்தாலும், மூல எபிரெயத்தின் நிறைவு அம்சத்தைப் பாதுகாக்கிறது.
