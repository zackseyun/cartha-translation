  text: And when all the men of war had finished dying from among the people,[a]
translation:
  language: ta
  text: போர்வீரர்கள் அனைவரும் மக்களின் நடுவிலிருந்து இறந்து நீங்கியபோது,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “போரிடும் ஆண்கள்.” எபிரெயத்தில் சொல்லுக்குச் சொல், “போரின் ஆண்கள்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כַאֲשֶׁר
  choice: …போது
  rationale: வַיְהִי புதிய நிகழ்வுக் கட்டத்தை அறிமுகப்படுத்துகிறது; כַאֲשֶׁר காலச் சூழலைக் குறிக்கிறது. அடுத்த வசனத்தில் நிறைவுபெறும் சார்பு வாக்கியமாக இருப்பதால், நவீன தமிழில் இரண்டையும் இயல்பாக ‘…போது’ என்பதில் வெளிப்படுத்தியது.
- source_word: תַּמּוּ לָמוּת
  choice: இறந்து முடிந்த
  rationale: תמם நிறைவு அல்லது முடிவைச் சுட்டுகிறது; לָמוּת உடன் சேர்ந்து அந்தத் தலைமுறையினரின் இறப்பு முழுமையாக நிறைவடைந்ததைத் தெரிவிக்கிறது. ‘இறந்தபோது’ என்பதைக் காட்டிலும் ‘இறந்து முடிந்தபோது’ மூலத்தின் நிறைவு அம்சத்தைத் தக்கவைக்கிறது.
- source_word: כָּל
  choice: அனைவரும்
  rationale: முழுத் தொகுதியையும் குறிக்கும் அளவுச்சொல்லை வெளிப்படையாகத் தக்கவைக்கிறது.
- source_word: אַנְשֵׁי הַמִּלְחָמָה
  choice: போர்வீரர்கள்
  rationale: சொல்லுக்குச் சொல் ‘போரின் ஆண்கள்.’ சூழலில் போரிடும் ஆண்களைக் குறிக்கும் இயல்பான, தெளிவான தமிழ்ச் சொல் ‘போர்வீரர்கள்’; மூலத்தின் ஆண்பால் வடிவம் அடிக்குறிப்பில் குறிப்பிடப்படுகிறது.
- source_word: מִקֶּרֶב הָעָם
  choice: மக்களிடையே
  rationale: இஸ்ரவேல் மக்களின் நடுவிலிருந்து அவர்கள் இறப்பால் நீங்கிய சூழலை இயல்பான தமிழில் காட்டுகிறது; ‘மக்களின் நடுவிலிருந்து’ என்ற சொற்படி வடிவத்தின் கடினத்தன்மையைத் தவிர்க்கிறது.
