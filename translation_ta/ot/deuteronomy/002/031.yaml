base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/031.yaml
  text: And Yahweh said to me[a], “See, I have begun to give Sihon and his land over to you[b]. Begin to take possession of his land.”
translation:
  language: ta
  text: யாவே என்னிடம், “பார், சீகோனையும் அவனுடைய நாட்டையும் உன் அதிகாரத்தில்[a] ஒப்படைக்கத் தொடங்கிவிட்டேன். அவனுடைய நாட்டை உரிமையாக்கிக்கொள்ளத் தொடங்கு[b]” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லளவில், ‘உனக்கு முன்பாகக் கொடுக்கத் தொடங்கிவிட்டேன்.’ இங்கு சீகோனையும் அவனுடைய நாட்டையும் இஸ்ரவேலின் அதிகாரத்தில் ஒப்படைப்பதே பொருள்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெய மொழியில் ‘உரிமையாக்கிக்கொள்’ என்ற ஒரே வேர்ச்சொல் மீண்டும் பயன்படுத்தப்பட்டு வலியுறுத்தப்படுகிறது; இதை ‘உரிமையாக்கிக்கொள்ளும்படி உரிமையாக்கத் தொடங்கு’ என்றும் சொல்லளவில் தரலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: யெகோவா
  rationale: இறைப்பெயரான நான்கெழுத்துப் பெயரை ஒரு பட்டமாக மாற்றாமல், தமிழில் நிலைபெற்றுள்ள ஒலிபெயர்ப்பு வடிவில் தருகிறது.
- source_word: רְאֵה
  choice: பார்
  rationale: கவனத்தை ஈர்க்கும் ஒருமை ஏவல் வடிவை இயல்பான நவீனத் தமிழில் நேரடியாகப் பாதுகாக்கிறது.
- source_word: הַחִלֹּתִי תֵּת
  choice: ஒப்படைக்கத் தொடங்கிவிட்டேன்
  rationale: ‘கொடுக்கத் தொடங்கியிருக்கிறேன்’ என்ற அடிப்படைப் பொருளையும், போர் சூழலில் எதிரியை இஸ்ரவேலின் அதிகாரத்துக்குள் கொண்டுவரும் கருத்தையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: לְפָנֶיךָ
  choice: உன் அதிகாரத்தில்
  rationale: சொல்லளவில் ‘உனக்கு முன்பாக’ என்றாலும், இச்சூழலில் ஒருவரை மற்றொருவரின் வசம் அல்லது அதிகாரத்தில் வைப்பதைக் குறிக்கும் மரபுத்தொடரின் பொருளைத் தருகிறது.
- source_word: הָחֵל רָשׁ לָרֶשֶׁת
  choice: உரிமையாக்கிக்கொள்ளத் தொடங்கு
  rationale: ירש என்ற ஒரே வேர்ச்சொல்லின் ஏவல் மற்றும் வினையெச்ச வடிவங்கள் இணைந்து தரும் வலியுறுத்தலைச் சீரான தமிழில் வெளிப்படுத்துகிறது; தேவன் தொடங்கிய செயலும் இஸ்ரவேல் தொடங்க வேண்டிய செயலும் இணையாக நிற்கின்றன.
- source_word: אַרְצוֹ
  choice: அவனுடைய நாடு
  rationale: சீகோனின் ஆட்சிக்குட்பட்ட நிலப்பரப்பைக் குறிக்கும் אֶרֶץ என்பதற்கு இச்சூழலில் இயல்பான தமிழ்ச் சொல்.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யெகோவா
  alternative: யாவே; கர்த்தர்
  rationale: மூலத்தில் நேரடியாக இடம்பெறும் தனிப்பட்ட இறைப்பெயரைப் பட்டத்தால் மாற்றாமல் பாதுகாக்கிறது. தமிழ் வாசகர்களிடையே நிலைபெற்ற ஒலிபெயர்ப்பான ‘யெகோவா’ தேர்ந்தெடுக்கப்பட்டது.
- issue: நிலத்தைக் கைப்பற்றுவதில் தெய்வீகச் செயலும் மனிதச் செயலும்
  choice: ‘ஒப்படைக்கத் தொடங்கிவிட்டேன்’ / ‘உரிமையாக்கிக்கொள்ளத் தொடங்கு’ என்ற இணை அமைப்பு
  alternative: தேவன் முழுமையாகக் கொடுத்துவிட்டார் என்று அல்லது இஸ்ரவேலே தனித்து வென்றது என்று விளக்குதல்
  rationale: தேவன் செயலைத் தொடங்கியிருப்பதையும் இஸ்ரவேல் அதற்கேற்ப செயல்பட வேண்டியிருப்பதையும் உரையின் பதற்றத்தோடு அப்படியே பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், நேரடியும் கண்ணியமுமான உரைநடை பயன்படுத்தப்பட்டுள்ளது. ‘பார்’ என்பது கவன ஈர்ப்பு ஏவலை இயல்பாகத் தருகிறது. ‘உரிமையாக்கிக்கொள்’ என்பது வெறும் உடைமையாக வைத்திருப்பதைவிட, நாட்டைக் கைப்பற்றி தமதாக்கும் ירש என்பதன் சூழற்பொருளை வெளிப்படுத்துகிறது. எல்லா அடிக்குறிப்புக் குறிகளும் முதன்மை உரையில் சேர்க்கப்பட்டுள்ளன.
