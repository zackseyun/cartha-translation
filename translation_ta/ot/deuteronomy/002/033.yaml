- from: நம் கடவுளான யாவே அவனை நம்மிடம் ஒப்புக்கொடுத்தார்[a]. நாங்கள் அவனையும், அவனுடைய மகன்களையும்[b], அவனுடைய மக்கள் அனைவரையும் வீழ்த்தினோம்.
  to: நம் கடவுளாகிய யாவே அவனை நம்மிடம் ஒப்புக்கொடுத்தார்[a]; நாங்கள் அவனையும், அவனுடைய மகன்களையும்[b], அவனுடைய மக்கள் அனைவரையும் வீழ்த்தினோம்.
