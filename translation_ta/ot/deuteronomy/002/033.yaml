source:
  edition: WLC
  text: וַֽ/יִּתְּנֵ֛/הוּ יְהוָ֥ה אֱלֹהֵ֖י/נוּ לְ/פָנֵ֑י/נוּ וַ/נַּ֥ךְ אֹת֛/וֹ וְ/אֶת בנ/ו וְ/אֶת כָּל עַמּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/033.yaml
  text: And Yahweh our God gave him over to us[a], and we struck him down[b], along with his sons and all his people.
translation:
  language: ta
  text: நம் கடவுளாகிய யாவே அவனை நம்மிடம் ஒப்புக்கொடுத்தார்[a]; நாங்கள் அவனையும், அவனுடைய மகன்களையும்[b], அவனுடைய மக்கள் அனைவரையும் வீழ்த்தினோம்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொல்லுக்குச் சொல், ‘நமக்கு முன்பாக’; இங்கு அவனை இஸ்ரவேலரின் அதிகாரத்துக்குள் ஒப்புக்கொடுத்தார் என்பது பொருள்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெய மெய்யெழுத்து உரையில் ‘அவனுடைய மகன்’ என்று உள்ளது; இச்சூழலில் பலர் அதை பன்மைப் பொருளில் ‘அவனுடைய மகன்கள்’ என்று புரிந்துகொள்கிறார்கள்.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּתְּנֵהוּ ... לְפָנֵינוּ
  choice: அவனை நம்மிடம் ஒப்புக்கொடுத்தார்
  rationale: போர்ச் சூழலில் נתן என்பதுடன் לְפָנֵינוּ (‘நமக்கு முன்பாக’) சேர்ந்திருப்பது, எதிரியை இஸ்ரவேலரின் அதிகாரத்துக்குள் ஒப்புக்கொடுப்பதைக் குறிக்கிறது. தமிழில் ‘நம்மிடம் ஒப்புக்கொடுத்தார்’ என்பது அந்தப் பொருளை இயல்பாகத் தருகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இது இறைப்பட்டம் அல்ல, எபிரெயத் தனிப்பெயரான நான்கெழுத்துத் திருப்பெயர்; எனவே தமிழில் ஒலிபெயர்த்து வழங்கப்படுகிறது.
- source_word: אֱלֹהֵינוּ
  choice: நம் கடவுளான
  rationale: முதலாம் நபர் பன்மை உரிமை விகுதியுடன் உள்ள சொல்லின் நேரான பொருள் ‘நம் கடவுள்’; ‘நம் கடவுளான யாவே’ என்பது இயல்பான தமிழ் அமைப்பு.
- source_word: וַנַּךְ
  choice: வீழ்த்தினோம்
  rationale: נכה என்பது போர்க்கதையில் தீர்மானமான தாக்குதலால் எதிரியைத் தோற்கடிப்பதை அல்லது கொல்வதைச் சுட்டலாம். ‘வீழ்த்தினோம்’ அதன் வலிமையைப் பேணுவதோடு, ‘கொன்றோம்’ என்று பொருளை அளவுக்கு மீறித் தீர்மானிப்பதையும் தவிர்க்கிறது.
- source_word: אֹתוֹ
  choice: அவனையும்
  rationale: முந்தைய வசனத்தில் குறிப்பிடப்பட்ட சீகோனைச் சுட்டும் நேரடி பொருள் சுட்டுப்பெயர்.
- source_word: בנו
  choice: அவனுடைய மகன்களையும்
  rationale: எழுதப்பட்ட மெய்யெழுத்து வடிவம் ஒருமையாக வாசிக்கப்படலாம்; எனினும் போரறிக்கையின் சூழலில் இது கூட்டுப்பொருளில் பன்மையாகப் புரிந்துகொள்ளப்படுகிறது. மாற்று வாசிப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: כָּל עַמּוֹ
  choice: அவனுடைய மக்கள் அனைவரையும்
  rationale: עַם என்பதன் அடிப்படைப் பொருள் ‘மக்கள்’. ‘படை’ என்று குறுக்காமல், மூலத்தின் பரந்த சொல்லாட்சியை இத்தேர்வு பேணுகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைத்தனிப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூலத்தில் பட்டமான אֲדֹנָי அல்ல, இறைத்தனிப்பெயரான יְהוָה நேரடியாக உள்ளது. ஆகவே பட்டத்தால் மாற்றாமல் தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளது.
- issue: וַנַּךְ என்பதில் மரணம் வெளிப்படையாக உள்ளதா?
  choice: வீழ்த்தினோம்
  alternative: கொன்றோம்
  rationale: போர்ச் சூழல் மரணத்தை உள்ளடக்கக்கூடும்; ஆனால் வினைச்சொல் தனியே எப்போதும் ‘கொல்’ என்று மட்டும் பொருள்படாது. எனவே மூலத்தின் பொருள் விரிவைத் திறந்தவாறே வைத்திருக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. போர்ச் சூழலின் வலிமை ‘வீழ்த்தினோம்’ என்பதால் பேணப்படுகிறது; அதேவேளை மூலத்தில் வெளிப்படையாக இல்லாத ‘கொன்றோம்’ என்ற முடிவு திணிக்கப்படவில்லை. இறைத்தனிப்பெயர் ‘யாவே’ என்று ஒலிபெயர்க்கப்பட்டுள்ளது.
