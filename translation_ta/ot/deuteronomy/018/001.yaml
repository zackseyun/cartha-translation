source:
  edition: WLC
  text: לֹֽא יִ֠הְיֶה לַ/כֹּהֲנִ֨ים הַ/לְוִיִּ֜ם כָּל שֵׁ֧בֶט לֵוִ֛י חֵ֥לֶק וְ/נַחֲלָ֖ה עִם יִשְׂרָאֵ֑ל אִשֵּׁ֧י יְהוָ֛ה וְ/נַחֲלָת֖/וֹ יֹאכֵלֽוּ/ן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/018/001.yaml
  text: The Levitical priests—all the tribe of Levi—shall have no portion or inheritance with Israel[a]; they shall eat the food offerings of Yahweh, that is[b], his inheritance.
translation:
  language: ta
  text: லேவிய ஆசாரியர்கள்—லேவி கோத்திரம் முழுவதும்—இஸ்ரவேலோடு பங்கோ உரிமைச்சொத்தோ இருக்காது. அவர்கள் யாவேயின் நெருப்புக் காணிக்கைகளையும்[a] அவருடைய உரிமைச்சொத்தையும்[b] உண்பார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இது யாவேக்கு நெருப்பில் செலுத்தப்படும் காணிக்கைகளைக் குறிக்கிறது.
    reason: lexical_clarification
  - marker: b
    text: '“அவருடைய” என்பது யாவேயைக் குறிக்கலாம்; அல்லது லேவியை ஒரு கூட்டொருமையாகக் குறிக்கலாம். ஒப்பிடுக: உபாகமம் 18:2-ல் யாவே அவர்களுடைய உரிமைச்சொத்து எனக் கூறப்படுகிறது.'
    reason: ambiguity_and_cross_reference
lexical_decisions:
- source_word: לַכֹּהֲנִים הַלְוִיִּם
  choice: லேவிய ஆசாரியர்கள்
  rationale: இரு பெயர்ச்சொற்களின் இணைப்பை இயல்பான நவீனத் தமிழில் சுருக்கமாகக் கொடுத்து, இவர்கள் லேவி குலத்தைச் சேர்ந்த ஆசாரியர்கள் என்பதைத் தெரிவிக்கிறது.
- source_word: כָּל שֵׁבֶט לֵוִי
  choice: லேவி கோத்திரம் முழுவதும்
  rationale: כָּל என்பதன் முழுமையான உள்ளடக்கத்தைப் பேணி, கட்டளை ஆசாரியர்களை மட்டும் அல்லாமல் லேவி கோத்திரம் முழுவதையும் உள்ளடக்குவதை வெளிப்படுத்துகிறது.
- source_word: חֵלֶק וְנַחֲלָה
  choice: பங்கோ உரிமைச்சொத்தோ
  rationale: நிலம் அல்லது சொத்தில் ஒதுக்கப்படும் பங்கைக் குறிக்கும் நெருங்கிய பொருளுடைய இரு சட்டச் சொற்களையும் தமிழில் வேறுபடுத்திக் காட்டுகிறது; எதிர்மறை வாக்கியத்தில் ‘ஓ…ஓ’ இயல்பாக உள்ளது.
- source_word: עִם יִשְׂרָאֵל
  choice: இஸ்ரவேலோடு
  rationale: மற்ற இஸ்ரவேல் கோத்திரங்களுடன் பொதுவாகப் பங்கு பெறுதல் என்ற உறவைச் சுருக்கமாகப் பாதுகாக்கிறது.
- source_word: אִשֵּׁי יְהוָה
  choice: யாவேயின் உணவுக் காணிக்கைகள்
  rationale: இந்தச் சொல் நெருப்பில் செலுத்தப்பட்ட பலிகளுடன் தொடர்புடையது; அவற்றிலிருந்து ஆசாரியர்கள் உண்ணும் பங்கைச் சூழல் வலியுறுத்துவதால் ‘உணவுக் காணிக்கைகள்’ தெளிவான நவீன மொழிபெயர்ப்பு. சொல்லடியான மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: וְנַחֲלָתוֹ
  choice: அவருடைய உரிமைச்சொத்து
  rationale: எபிரெய ஆண்பால் ஒருமை பின்னொட்டை அப்படியே பேணி, அது யாரைக் குறிக்கிறது என்ற சூழல்சார் தெளிவின்மையைத் தீர்மானிக்காமல் விடுகிறது.
- source_word: יֹאכֵלוּן
  choice: உண்பார்கள்
  rationale: சட்ட ஏற்பாட்டில் தொடர்ச்சியான அல்லது எதிர்கால நடைமுறையைச் சுட்டும் imperfect வடிவை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: ஆண்டவர்; யெகோவா
  rationale: மூலத்தில் உடன்படிக்கையின் தனிப்பெயரான நான்கெழுத்துப் பெயர் நேரடியாக உள்ளது; அதனைப் பொதுப்பட்டமாக மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
- issue: וְנַחֲלָתוֹ என்பதிலுள்ள ‘அவருடைய’ யாரைக் குறிக்கிறது
  choice: குறிப்பிடப்படாதபடி ‘அவருடைய’ என்று வைத்தல்
  alternative: யாவேயின் உரிமைச்சொத்து; லேவியின் உரிமைச்சொத்து
  rationale: ஒருமை பின்னொட்டு இலக்கணரீதியாக யாவேயையும், கூட்டொருமையாகக் கொள்ளப்படும் லேவியையும் குறிக்கக்கூடியதாக வாசிக்கப்படலாம். அடுத்த வசனம் யாவே அவர்களுடைய உரிமைச்சொத்து எனக் கூறினாலும், இவ்வசனத்தின் தெளிவின்மையை முதன்மை உரையில் தீர்க்காமல் பாதுகாப்பது பொருத்தமானது.
- issue: אִשֵּׁי יְהוָה וְנַחֲלָתוֹ இடையிலான தொடர்பு
  choice: ‘காணிக்கைகளையும் … உரிமைச்சொத்தையும்’ என இணைத்தல்
  alternative: ‘காணிக்கைகளாகிய அவரது உரிமைச்சொத்தை’ என விளக்கவுரை செய்தல்
  rationale: மூலத்தில் וְ என்ற இணைப்புச் சொல் உள்ளது. இரண்டாம் கூறை முதலாம் கூறின் விளக்கமாக வாசிக்க வாய்ப்பிருந்தாலும், ‘அதாவது’ என்று சேர்ப்பது அந்த உறவைத் தீர்மானித்துவிடும்; ஆகவே மூலத்தின் இணைப்பையும் சாத்தியமான பதற்றத்தையும் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான சட்டநடை பயன்படுத்தப்பட்டுள்ளது. ‘ஆசாரியர்கள்’, ‘கோத்திரம்’, ‘காணிக்கைகள்’, ‘உரிமைச்சொத்து’ ஆகியவை வேதாகமச் சூழலைப் பேணும் பரவலாக அறியப்பட்ட சொற்கள். இடைக்கோடுகள் எபிரெய உரையின் விரிவாக்க apposition-ஐத் தெளிவாகக் காட்டுகின்றன.
