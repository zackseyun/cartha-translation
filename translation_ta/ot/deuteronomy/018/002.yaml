base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/018/002.yaml
  text: He shall have no inheritance among his brothers[a]; Yahweh is his inheritance[b], as he spoke to him.
translation:
  language: ta
  text: அவனுடைய சகோதரர்களின் நடுவே அவனுக்குச் சுதந்தரம் எதுவும் இருக்காது[a]. யாவேவே அவனுடைய சுதந்தரம்; அவர் அவனுக்குக் கூறியபடி[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அவனுடைய உறவினரிடையே.’ எபிரெயத்தில் ‘அவனுடைய சகோதரர்கள்’ என்று உள்ளது; இது அவனுடைய சக இஸ்ரவேலரையும், குறிப்பாக மற்ற கோத்திரங்களையும் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: எபிரெய வினைச்சொல் பொதுவாக ‘பேசு’ அல்லது ‘கூறு’ என்று பொருள்படும். சூழலின்படி ‘அவர் அவனுக்கு வாக்களித்தபடி’ என்றும் புரிந்துகொள்ளலாம்; ஆனால் அது சற்றே விளக்கமான மொழிபெயர்ப்பு.
    reason: lexical_alternative
lexical_decisions:
- source_word: נַחֲלָה / נַחֲלָתוֹ
  choice: சுதந்தரம்
  rationale: உபாகமத்தில் இச்சொல் ஒதுக்கப்பட்ட நிலப்பங்கையும் பரம்பரை உரிமையையும் குறிக்கிறது. இரு இடங்களிலும் ஒரே தமிழ்ச் சொல்லைப் பயன்படுத்துவது எபிரெய மறுபயன்பாட்டையும், யெகோவாவே சுதந்தரம் என்ற உருவகத்தின் செறிவையும் காக்கிறது.
- source_word: בְּקֶרֶב
  choice: நடுவே
  rationale: בְּקֶרֶב אֶחָיו என்பதன் உறவுசார் பொருள் ‘அவனுடைய சகோதரர்களின் நடுவே’ என்பதாகும்; இது இயல்பான தமிழில் மூலத்தின் அமைப்பை நெருக்கமாகப் பிரதிபலிக்கிறது.
- source_word: אֶחָיו
  choice: அவனுடைய சகோதரர்கள்
  rationale: எபிரெயச் சொல் நேரடியாக ‘அவனுடைய சகோதரர்கள்’ என்று உள்ளது. சூழலில் இது மற்ற இஸ்ரவேலரையும், குறிப்பாக மற்ற கோத்திரங்களையும் குறித்தாலும், அந்த விளக்கத்தை முதன்மை உரைக்குள் சேர்க்காமல் மூலச் சொல்லைத் தக்கவைக்கிறது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: தெய்வீகப் பெயரான நான்கெழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் வழக்கமான ஒலிபெயர்ப்பான ‘யெகோவா’ என்று வழங்குகிறது.
- source_word: הוּא
  choice: -வே
  rationale: தனித்து வரும் எபிரெயச் சுட்டுப்பெயரின் வலியுறுத்தலை ‘யெகோவாவே’ என்ற ஏகாரத்தின் மூலம் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: כַּאֲשֶׁר דִּבֶּר לוֹ
  choice: அவர் அவனிடம் கூறியபடியே
  rationale: דִּבֶּר என்பது பொதுவாக ‘பேசு/கூறு’ என்பதாகும். ‘வாக்களித்தபடியே’ என்பது சூழலில் சாத்தியமானாலும் வினைச்சொல்லில் இல்லாத கருத்தை வெளிப்படையாகச் சேர்க்கும்; ஆகவே ‘கூறியபடியே’ தேர்ந்தெடுக்கப்பட்டது.
theological_decisions:
- issue: ‘அவன்/அவனுடைய’ என்ற ஒருமைப் பிரதிப்பெயர்களின் குறிப்பு
  choice: லேவியனையோ லேவிய ஆசாரியனையோ கோத்திரத்தின் பிரதிநிதியாகக் குறிக்கும் பொதுமை ஒருமையாகவே வைத்தல்
  alternative: கோத்திரத் தந்தையான லேவியை மட்டும் குறித்தல்; அல்லது ஒவ்வொரு ஆசாரியனையும் தனித்தனியாகக் குறித்தல்
  rationale: உடனடி சூழல் லேவிய ஆசாரியர்களையும் லேவி கோத்திரத்தையும் பற்றியது. எபிரெயத்தில் காணப்படும் பிரதிநிதித்துவ ஒருமையைத் தமிழிலும் காப்பது எந்த ஒரு குறுகிய விளக்கத்தையும் கட்டாயப்படுத்தாது.
- issue: ‘யெகோவாவே அவனுடைய சுதந்தரம்’ என்பதன் இயல்பு
  choice: உடன்படிக்கை சார்ந்த உருவகக் கூற்றை விளக்கி விரிவாக்காமல் அப்படியே வைத்தல்
  alternative: ‘நிலத்திற்குப் பதிலாக யெகோவாவே லேவியருக்கு ஒதுக்கப்பட்ட பங்கு’ என்று விளக்கமாக விரித்தல்
  rationale: யெகோவாவே சுதந்தரம் என்ற மூலத்தின் சுருக்கமான இறையியல் செறிவையும் பதற்றத்தையும் மொழிபெயர்ப்பு காக்கிறது; அதன் பொருளை ஒரு விளக்கத்திற்குள் அடைக்கவில்லை.
translation_notes:
  register: நவீன தரத் தமிழில், கண்ணியமானதும் பொதுவாசகர்களுக்குப் புரியக்கூடியதுமான நடை. ‘சுதந்தரம்’ என்ற சொல்லின் சட்டபூர்வ நிலப்பங்கு மற்றும் உருவக இறையியல் ஆகிய இரு பொருள்களும் ஒரே சொல்லால் காக்கப்பட்டுள்ளன. இறுதி ‘இது இருக்கும்’ என்பது தமிழில் வாக்கியத்தை இயல்பாக முடிக்கச் சேர்க்கப்பட்ட வெளிப்படுத்தல்; புதிய இறையியல் கருத்தைச் சேர்ப்பதில்லை.
