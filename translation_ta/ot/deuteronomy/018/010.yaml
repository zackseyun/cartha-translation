  source_fidelity: மூல எபிரெயப் பட்டியலின் வரிசையும் தடைக் கருத்தும் பெரும்பாலும் சரியாக உள்ளன. ஆனால் ‘நெருப்பின் வழியாகக் கடக்கச் செய்கிறவன்’ என்பதற்குப் பதில் ‘நெருப்பினூடே செல்லச் செய்கிறவன்’ என்பது מַעֲבִיר என்பதன் ‘செல்லச் செய்’ என்ற காரணவினைப் பொருளை நவீனத் தமிழில் இயல்பாகவும் துல்லியமாகவும் தருகிறது. கֹסֵם கְסָמִים என்பதற்கான ‘குறிகேட்டுச் சோதிடம் பார்க்கிறவன்’ சொல்லமைப்பு பொருளில் சற்றே கலங்கலாக இருப்பதால் திருத்தப்பட்டுள்ளது.
  naturalness: திருத்தப்பட்ட உரை சட்டப்பாங்கான நவீன நிலையான தமிழில் இயல்பாக ஓடுகிறது. ‘குறிசொல்லுகிறவன்,’ ‘நிமித்தம் பார்ப்பவன்,’ ‘சகுனம் பார்ப்பவன்’ என்ற தொடர், தொடர்புடைய ஆனால் வேறுபட்ட எபிரெயச் சொற்களைத் தனித்தனியாகக் காட்டுகிறது.
  terminology: ‘சூனியம் செய்கிறவன்’ מְכַשֵּׁף என்பதற்கு ஏற்ற பொதுவான நவீனத் தமிழாகும். ‘நிமித்தம்’ என்ற தேர்வு மְעוֹנֵן-இன் உறுதியற்ற பொருளை அடிக்குறிப்புடன் பாதுகாக்கிறது; ‘சகுனம்’ மְנַחֵשׁ-இன் அடையாள/சகுன விளக்கத்தைச் சரிவரத் தருகிறது.
