source:
  edition: WLC
  text: לֹֽא יִמָּצֵ֣א בְ/ךָ֔ מַעֲבִ֥יר בְּנֽ/וֹ וּ/בִתּ֖/וֹ בָּ/אֵ֑שׁ קֹסֵ֣ם קְסָמִ֔ים מְעוֹנֵ֥ן וּ/מְנַחֵ֖שׁ וּ/מְכַשֵּֽׁף־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/018/010.yaml
  text: There must not be found among you anyone who makes his son or his daughter pass through the fire[a], one who practices divination, tells fortunes, interprets omens[d][c][b], or practices sorcery.
translation:
  language: ta
  text: உங்களிடையே தன் மகனையோ மகளையோ நெருப்பினூடே செல்லச் செய்கிறவனும்[a], குறிசொல்லுகிறவனும், நிமித்தம் பார்ப்பவனும்[b], சகுனம் பார்ப்பவனும்[c], சூனியம் செய்கிறவனும்[d] காணப்படக் கூடாது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தன் மகனையோ மகளையோ நெருப்பில் எரிக்கிறவன்,” அல்லது “தன் மகனையோ மகளையோ நெருப்பில் பலியிடுகிறவன்.” எபிரெயத்தில் சொற்பட, “தன் மகனையோ மகளையோ நெருப்பினூடே செல்லச் செய்கிறவன்.”
    reason: alternative_reading
  - marker: b
    text: பொருள் உறுதிப்படுத்தக் கடினமான எபிரெயச் சொல்; “காலம் பார்த்துக் குறிசொல்கிறவன்” அல்லது “குறிசொல்கிறவன்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, “சகுனங்களைக் கொண்டு குறிசொல்கிறவன்.”
    reason: lexical_alternative
  - marker: d
    text: அல்லது, “மந்திரவித்தை செய்கிறவன்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יִמָּצֵא בְךָ
  choice: உங்களிடையே ... காணப்படக் கூடாது
  rationale: எதிர்மறையுடன் வரும் நிபால் வினை வடிவம் உடன்படிக்கைச் சமூகத்தில் இத்தகைய நபர் அனுமதிக்கப்படக் கூடாது என்ற தடையைத் தெரிவிக்கிறது; בְךָ என்பதற்கு இச்சட்டச் சூழலில் இயல்பான தமிழாக ‘உங்களிடையே’ பயன்படுத்தப்பட்டது.
- source_word: מַעֲבִיר בְּנוֹ וּבִתּוֹ בָּאֵשׁ
  choice: தன் மகனையோ மகளையோ நெருப்பின் வழியாகக் கடக்கச் செய்கிறவன்
  rationale: עבר என்பதன் ஹிபில் வடிவம் சொற்பட ‘கடக்கச் செய்தல்’ என்று பொருள்படும். குழந்தைகளும் நெருப்பும் சம்பந்தப்பட்ட தடைசெய்யப்பட்ட சடங்கை இது குறிக்கிறது; அதன் துல்லியமான முறையை மூலவசனம் வெளிப்படையாகக் கூறாததால் எரித்தல் அல்லது பலியிடுதல் என்று முதன்மை உரையில் தீர்மானிக்கவில்லை.
- source_word: קֹסֵם קְסָמִים
  choice: குறிகேட்டுச் சோதிடம் பார்க்கிறவன்
  rationale: ஒரே வேர் கொண்ட வினையெச்சமும் பெயர்ச்சொல்லும் சேர்ந்து குறிகேட்பதை வலியுறுத்துகின்றன. பொதுவான மறைவியல் வழியாக எதிர்காலத்தையோ மறைந்த காரியங்களையோ அறிய முயல்வதை நவீன வாசகருக்குப் புரியும்படி இவ்வாறு மொழிபெயர்க்கப்பட்டது.
- source_word: מְעוֹנֵן
  choice: நிமித்தம் பார்க்கிறவன்
  rationale: இது பொருள் உறுதிப்படுத்தக் கடினமான சொல்; காலங்களை உற்றுநோக்குதல், குறிசொல்லுதல், நிமித்தம் பார்த்தல் எனப் பலவாறு விளக்கப்பட்டுள்ளது. அருகிலுள்ள மறைவியல் சொற்களுடன் முற்றிலும் ஒன்றாக்காமல், தமிழில் அறியப்பட்ட ‘நிமித்தம் பார்க்கிறவன்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: מְנַחֵשׁ
  choice: சகுனம் பார்க்கிறவன்
  rationale: நிகழ்வுகள் அல்லது அடையாளங்களிலிருந்து மறைபொருளை ஊகிக்கும் சகுனப் பார்வையோடு இந்த வினை தொடர்புடையது. முந்தைய பொதுவான சோதிடச் சொல்லிலிருந்து இதை வேறுபடுத்த ‘சகுனம் பார்க்கிறவன்’ இயல்பான தேர்வாகும்.
- source_word: מְכַשֵּׁף
  choice: சூனியம் செய்கிறவன்
  rationale: பீயேல் வினையெச்சம் மந்திர அல்லது தீய மறைவியல் செயல்களில் ஈடுபடுபவரைக் குறிக்கிறது. நவீனத் தமிழில் எளிதில் புரியும் வகையில் ‘சூனியம் செய்கிறவன்’ பயன்படுத்தப்பட்டது.
theological_decisions:
- issue: குழந்தையும் நெருப்பும் சம்பந்தப்பட்ட தடையின் இயல்பு
  choice: ‘தன் மகனையோ மகளையோ நெருப்பின் வழியாகக் கடக்கச் செய்கிறவன்’ என்ற எபிரெய மொழிவழக்கை முதன்மை உரையில் தக்கவைத்தல்
  alternative: ‘நெருப்பில் எரிக்கிறவன்’ அல்லது ‘நெருப்பில் பலியிடுகிறவன்’
  rationale: இது குழந்தைகளும் நெருப்பும் சம்பந்தப்பட்ட கண்டிக்கப்பட்ட அந்நிய சமயச் சடங்கு என்பது தெளிவு. ஆனால் இந்த வசனத்தில் மட்டும் அதன் முறை எரித்தலா, பலியிடுதலா என்பதை எபிரெய வாசகம் முழுமையாக விளக்காததால், மொழிபெயர்ப்பு அந்தத் தெளிவின்மையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சட்டப்பாங்கும் கண்ணியமும் காக்கப்பட்டுள்ளன. பட்டியலின் எபிரெய வினையெச்ச அமைப்பு தமிழில் ‘...கிறவனும்’ எனத் தொடர்ச்சியாக வெளிப்படுத்தப்பட்டுள்ளது. ஒன்றுக்கொன்று நெருக்கமான மறைவியல் சொற்களை இயன்றவரை வேறுபடுத்தியபோதும், உறுதியற்ற சொற்களுக்கு அடிக்குறிப்புகள் வழங்கப்பட்டுள்ளன.
