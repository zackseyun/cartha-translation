- from: உங்களிடையே தன் மகனையோ மகளையோ நெருப்பின் வழியாகக் கடக்கச் செய்கிறவனும்[a], குறிகேட்டுச் சோதிடம் பார்க்கிறவனும், நிமித்தம் பார்க்கிறவனும்[b], சகுனம் பார்க்கிறவனும்[c], சூனியம் செய்கிறவனும்[d] காணப்படக் கூடாது.
  to: உங்களிடையே தன் மகனையோ மகளையோ நெருப்பினூடே செல்லச் செய்கிறவனும்[a], குறிசொல்லுகிறவனும், நிமித்தம் பார்ப்பவனும்[b], சகுனம் பார்ப்பவனும்[c], சூனியம் செய்கிறவனும்[d] காணப்படக் கூடாது.
  rationale: சிறிய மொழிநடை மற்றும் துல்லியத் திருத்தங்கள் மட்டும் செய்யப்பட்டுள்ளன. குழந்தைகளை நெருப்புடன் தொடர்புபடுத்தும் சடங்கின் சரியான வடிவத்தை முதன்மை உரை தீர்மானிக்கவில்லை; எனவே எபிரெய மொழிவழக்கின் தெளிவின்மை ‘நெருப்பினூடே செல்லச் செய்கிறவன்’ எனப் பாதுகாக்கப்பட்டுள்ளது. அடிக்குறிப்புகள் தங்கள் உரிய அடையாளங்களில் நிலைத்துள்ளன.
