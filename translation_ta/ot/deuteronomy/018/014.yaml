  source_fidelity: திருத்தம் தேவை. כִּי என்பதன் விளக்க/காரணத் தொடர்பு முதன்மை உரையில் விடுபட்டுள்ளது. மேலும், நָתַן לְךָ என்ற வெளிப்படாத செயப்படுபொருளை ‘அனுமதிக்கவில்லை’ என்று மாற்றுவது மூலத்தின் ‘கொடுத்ததில்லை’ என்ற சொல்லாட்சியையும் அதன் திட்டமிட்ட சுருக்கத்தையும் அதிகமாக விளக்குகிறது.
  naturalness: ‘சகுனம் பார்ப்பவர்களுக்கும் குறிசொல்பவர்களுக்கும் செவிகொடுக்கின்றன’ என்பது நவீனத் தரத் தமிழில் இயல்பாகவும் தெளிவாகவும் உள்ளது. இறுதிப் பகுதியை ‘அப்படிக் கொடுத்ததில்லை’ என அமைத்தால் இயல்பையும் மூலத்தின் சுருக்கத்தையும் இணைக்க முடியும்.
  terminology: ‘யாவே’ மூல இறைப்பெயரைச் சரியாகப் பாதுகாக்கிறது. ‘சகுனம் பார்ப்பவர்கள்’ மற்றும் ‘குறிசொல்பவர்கள்’ ஆகியவை இரு வேறுபட்ட நடைமுறையாளர்களுக்கான பொருத்தமான, வேறுபடுத்தும் சொற்கள். ‘நாடுகள்’ இச்சூழலில் ஏற்கத்தக்கது.
