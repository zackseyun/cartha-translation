revisions:
- from: நீ துரத்திவிட்டு உரிமையாக்கிக்கொள்ளும்[a] இந்த நாடுகள், சகுனம் பார்ப்பவர்களுக்கும்[b] குறிசொல்பவர்களுக்கும் செவிகொடுக்கின்றன. ஆனால் உனக்கோ, அப்படிச் செய்வதை உன் கடவுளாகிய யாவே அனுமதிக்கவில்லை.[c]
  to: ஏனெனில், நீ துரத்திவிட்டு உரிமையாக்கிக்கொள்ளும்[a] இந்த நாடுகள் சகுனம் பார்ப்பவர்களுக்கும்[b] குறிசொல்பவர்களுக்கும் செவிகொடுக்கின்றன. ஆனால் உனக்கோ, உன் கடவுளாகிய யாவே அப்படிக் கொடுத்ததில்லை.[c]
  rationale: ‘ஏனெனில்’ சேர்க்கப்பட்டு மூலத்தின் விளக்கத் தொடர்பு மீட்டெடுக்கப்பட்டுள்ளது. இறுதிப் பகுதி ‘அனுமதிக்கவில்லை’ என்பதிலிருந்து ‘அப்படிக் கொடுத்ததில்லை’ என மாற்றப்பட்டு, נתן என்ற வினையின் அடிப்படைப் பொருளும் மூலத்தின் வெளிப்படாத செயப்படுபொருளும் பாதுகாக்கப்பட்டுள்ளன. மற்ற சொற்களும் அடிக்குறிப்பு அடையாளங்களும் பொருத்தமாக உள்ளன.
