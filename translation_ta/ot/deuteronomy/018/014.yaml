  text: כִּ֣י הַ/גּוֹיִ֣ם הָ/אֵ֗לֶּה אֲשֶׁ֤ר אַתָּה֙ יוֹרֵ֣שׁ אוֹתָ֔/ם אֶל מְעֹנְנִ֥ים וְ/אֶל קֹסְמִ֖ים יִשְׁמָ֑עוּ וְ/אַתָּ֕ה לֹ֣א כֵ֔ן נָ֛תַן לְ/ךָ֖ יְהוָ֥ה אֱלֹהֶֽי/ךָ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/018/014.yaml
  text: For these nations[a], which you are dispossessing, listen to soothsayers and diviners; but as for you[c][b], Yahweh your God has not allowed you to do this.
translation:
  language: ta
  text: ஏனெனில், நீ துரத்திவிட்டு உரிமையாக்கிக்கொள்ளும்[a] இந்த நாடுகள் சகுனம் பார்ப்பவர்களுக்கும்[b] குறிசொல்பவர்களுக்கும் செவிகொடுக்கின்றன. ஆனால் உனக்கோ, உன் கடவுளாகிய யாவே அப்படிக் கொடுத்ததில்லை.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘துரத்திவிட்டு உரிமையாக்கிக்கொள்ளும்’ என்பதற்கான எபிரெய வினை, முந்தைய குடிகளை அவர்களது உடைமையிலிருந்து அகற்றுவதையும் அந்த நாட்டைத் தன் உடைமையாக்குவதையும் உள்ளடக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘சகுனம் பார்ப்பவர்கள்’ என்பது அறிகுறிகளைக் கவனித்து அவற்றிலிருந்து பலன் அல்லது முன்னறிவிப்பு கூறுவோரைக் குறிக்கிறது.
    reason: cultural_note
  - marker: c
    text: எபிரெயத்தில் சொற்சார்ந்து, ‘ஆனால் நீயோ, அப்படி அல்ல; உன் கடவுளாகிய யாவே உனக்குக் கொடுத்திருக்கவில்லை’ என்று உள்ளது. எது ‘கொடுக்கப்படவில்லை’ என்பது வெளிப்படையாகச் சொல்லப்படாமல், சூழலிலிருந்து புரிந்துகொள்ளப்படுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: (தனி இணைப்புச்சொல்லாக வெளிப்படுத்தாமல் விளக்கத் தொடர்பில்)
  rationale: முந்தைய தடைகளுக்கான விளக்கத்தை அறிமுகப்படுத்துகிறது; தமிழில் வசனத்தின் இயல்பான தொடர்ச்சியால் இத்தொடர்பு தெளிவாகிறது.
- source_word: הַגּוֹיִם הָאֵלֶּה
  choice: இந்த நாடுகள்
  rationale: இங்கு இஸ்ரவேலரல்லாத தேச மக்களைக் குறிக்கிறது; ‘நாடுகள்’ என்பது தெளிவான, வழக்கமான இணை.
- source_word: אֲשֶׁר אַתָּה יוֹרֵשׁ אֹתָם
  choice: நீ துரத்திவிட்டு உரிமையாக்கிக்கொள்ளும்
  rationale: ירשׁ என்ற வினையின், முன்னிருந்த குடிகளை அகற்றி உடைமையாக்கும் இரு கூறுகளையும் தமிழில் வெளிப்படுத்துகிறது.
- source_word: אֶל מְעֹנְנִים
  choice: சகுனம் பார்ப்பவர்களுக்கு
  rationale: מְעֹנְנִים என்பது அறிகுறிகள் அல்லது சகுனங்களைக் கவனித்து பலன் கூறுவோரைக் குறிக்கிறது; குறிப்பிட்ட ஒரு முறையை மட்டும் கட்டாயப்படுத்தாமல் பொருளைத் தருகிறது.
- source_word: וְאֶל קֹסְמִים
  choice: குறிசொல்பவர்களுக்கு
  rationale: קֹסְמִים என்பது குறிகேட்டு அல்லது குறிபார்த்து மறைவானவற்றை அறிவிப்பதாகக் கூறுவோரைக் குறிக்கிறது; நவீன தமிழில் புரியக்கூடிய வேறுபட்ட இணை.
- source_word: יִשְׁמָעוּ
  choice: செவிகொடுக்கின்றன
  rationale: வெறுமனே கேட்பதல்லாமல் அவர்களது வழிகாட்டுதலை ஏற்று நடப்பதையும் குறிக்கும் שׁמע என்பதன் சூழல்சார் வலிமையைப் பாதுகாக்கிறது.
- source_word: וְאַתָּה לֹא כֵן
  choice: ஆனால் உனக்கோ, அப்படி... இல்லை
  rationale: எபிரெயச் சொற்றொடரின் சுருக்கமான எதிர்மறை முரணை இயல்பான தமிழில் தருகிறது.
- source_word: נָתַן לְךָ יְהוָה אֱלֹהֶיךָ
  choice: உன் கடவுளாகிய யாவே அனுமதிக்கவில்லை
  rationale: நேரடியாக ‘உனக்குக் கொடுக்கவில்லை’ என்றாலும், இச்சூழலில் அத்தகைய நடைமுறைகள் இஸ்ரவேலுக்குக் கொடுக்கப்பட்ட வழி அல்ல என்பதே கருத்து; தமிழில் பொருள் தெளிவாக ‘அனுமதிக்கவில்லை’ என வழங்கப்பட்டு, அடிச்சொல் குறிப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: எபிரெய மூலத்தில் உடன்படிக்கைப் பெயர் நேரடியாக உள்ளது; அதை பொதுப் பட்டப்பெயராக மாற்றாமல் ஒலிபெயர்க்கிறது.
- issue: נָתַן לְךָ என்பதன் வெளிப்படாத செயப்படுபொருள்
  choice: அப்படிச் செய்வதை ... அனுமதிக்கவில்லை
  alternative: அப்படிப்பட்டதை உனக்குக் கொடுக்கவில்லை
  rationale: சூழலில் குறிக்கப்படுவது அத்தகைய நடைமுறைகளைப் பின்பற்றுவதே. வாசிக்க இயல்பாக அதை வெளிப்படுத்தினாலும், எபிரெயத்தின் சொற்சார்ந்த வடிவமும் அதன் சுருக்கமும் அடிக்குறிப்பில் தரப்படுகின்றன.
translation_notes:
  register: நவீனத் தரத் தமிழில், ஒருமை இரண்டாம் நபர் வடிவத்தைப் பேணி, மரியாதையும் எளிய புரிதலும் இணைந்த நடையில் அமைக்கப்பட்டது. ‘சகுனம் பார்ப்பவர்கள்’ மற்றும் ‘குறிசொல்பவர்கள்’ ஆகியவை தொடர்புடைய இரு எபிரெயச் சொற்களையும் ஒன்றாக்காமல் வேறுபடுத்துகின்றன.
