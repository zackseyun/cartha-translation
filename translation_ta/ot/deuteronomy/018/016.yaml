  edition: WLC
  text: כְּ/כֹ֨ל אֲשֶׁר שָׁאַ֜לְתָּ מֵ/עִ֨ם יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ בְּ/חֹרֵ֔ב בְּ/י֥וֹם הַ/קָּהָ֖ל לֵ/אמֹ֑ר לֹ֣א אֹסֵ֗ף לִ/שְׁמֹ֨עַ֙ אֶת קוֹל֙ יְהוָ֣ה אֱלֹהָ֔/י וְ/אֶת הָ/אֵ֨שׁ הַ/גְּדֹלָ֥ה הַ/זֹּ֛את לֹֽא אֶרְאֶ֥ה ע֖וֹד וְ/לֹ֥א אָמֽוּת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/018/016.yaml
  text: just as you asked from the LORD your God at Horeb on the day of the assembly, saying, ‘Let me not continue to hear the voice of the LORD my God, and let me not see this great fire anymore, lest I die.’
translation:
  language: ta
  text: ஓரேபில் சபை கூடிய நாளில், “என் இறைவனாகிய ஆண்டவரின் குரலை நான் இனித் தொடர்ந்து கேட்கவும், இந்தப் பெரும் நெருப்பை இனிப் பார்க்கவும் வேண்டாம்; இல்லையெனில் நான் இறந்துவிடுவேன்” என்று உங்கள் இறைவனாகிய ஆண்டவரிடம் நீங்கள் கேட்டுக்கொண்டபடியே,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כְּכֹל אֲשֶׁר שָׁאַלְתָּ
  choice: நீங்கள் கேட்டுக்கொண்டபடியே
  rationale: ‘நீ கேட்ட அனைத்தின்படியும்’ என்ற எபிரெய அமைப்பின் பொருளை இயல்பான தமிழில் தருகிறது; வசனம் முந்தைய வசனத்தின் தொடராக இருப்பதால் இறுதியில் தொடர்ச்சிக் காற்புள்ளி வைக்கப்பட்டுள்ளது.
- source_word: יְהוָה
  choice: ஆண்டவர்
  rationale: இறைநாமத்தின் எபிரெய மெய்யெழுத்துகளைக் கருத்தில் கொண்டு, நவீனத் தமிழில் மரியாதையுடனும் வழக்காகவும் பயன்படும் பிரதிநிதித்துவத்தைத் தேர்ந்தெடுக்கிறது.
- source_word: בְּיוֹם הַקָּהָל
  choice: சபை கூடிய நாளில்
  rationale: ‘சபையின் நாளில்’ என்பதைக் காட்டிலும் நிகழ்வின் பொருளை சாதாரண வாசகருக்குத் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: לֹא אֹסֵף לִשְׁמֹעַ
  choice: நான் தொடர்ந்து கேட்க ... வேண்டாம்
  rationale: יָסַף + வினையெச்சம் இங்கு ‘இனி தொடர்ந்து செய்யாதிருத்தல்’ என்பதைக் குறிக்கிறது.
- source_word: הָאֵשׁ הַגְּדֹלָה הַזֹּאת
  choice: இந்தப் பெரும் நெருப்பு
  rationale: மூலத்தின் சுட்டுப்பெயரையும் தீவிரத்தையும் நேரடியாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: வசன முடிவிலுள்ள וְלֹא אָמוּת என்பதன் தொடர்பு
  choice: அப்படிப் பார்த்தால் நான் இறந்துவிடுவேன்
  alternative: நான் இறக்காதபடி / அப்போது நான் இறக்கமாட்டேன்
  rationale: இங்கு இணைப்புச் சொல் அச்சத்தின் விளைவை அல்லது தவிர்க்க வேண்டிய அபாயத்தைச் சுட்டுகிறது. தமிழில் தேர்ந்த வாசகத்தின் நோக்கம் தெளிவாக இருந்தாலும், மரண அச்சத்தை காரண-விளைவு வடிவில் வெளிப்படுத்துவது சூழலுக்கு இயல்பாகப் பொருந்துகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழ்; பொதுவாசகருக்குப் புரியும் வகையில் இயல்பான சொற்றொடர்கள் பயன்படுத்தப்பட்டுள்ளன. ஒருமை இரண்டாம் நபருக்கான மரியாதை வடிவமான ‘நீங்கள்’ தேர்ந்தெடுக்கப்பட்டுள்ளது. மேற்கோள் கண்ணியமான பேச்சுநடையில் அமைந்துள்ளது; வசனம் 18:15-இன் தொடராக இருப்பதால் முற்றுப்புள்ளிக்குப் பதிலாக தொடர்ச்சிக் காற்புள்ளியுடன் முடிகிறது.
