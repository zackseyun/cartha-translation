base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/018/007.yaml
  text: then he may minister in the name of Yahweh his God[c][b][a], like all his brothers the Levites who stand there before Yahweh.
translation:
  language: ta
  text: அப்போது, அவன் அங்கே யாவேயின் முன்னிலையில் நிற்கும் தன் சகோதரர்களாகிய எல்லா லேவியர்களைப் போல, தன் கடவுளான யாவேயின் பெயரில் ஊழியம் செய்யலாம்[a][b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஊழியம் செய்வான்.” சட்டச் சூழலை எவ்வாறு வெளிப்படுத்துகிறோம் என்பதைப் பொறுத்து, எபிரெய முற்றுபெறா வினை வடிவத்தை அனுமதியாகவோ நேரடியான எதிர்காலக் கூற்றாகவோ மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயில், “தன் சகோதரர்கள்”; இங்கு அவனுடைய சக லேவியர்களைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: c
    text: எபிரெயில் יהוה (YHWH); இது மரபாக “கர்த்தர்” என்று வழங்கப்படுகிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: וְשֵׁרֵת
  choice: அப்போது … ஊழியம் செய்யலாம்
  rationale: שׁרת என்பதன் பியேல் வடிவம் வழிபாட்டிடம் சார்ந்த லேவியப் பணியைக் குறிக்கிறது. அதனால் பொதுவான ‘சேவை செய்யலாம்’ என்பதைக் காட்டிலும் ‘ஊழியம் செய்யலாம்’ சூழலுக்கு ஏற்றது. முற்பகுதியின் சட்ட அனுமதியைத் தொடர்வதால், எபிரெய நிறைவுறா வினையின் அனுமதிப் பொருள் ‘செய்யலாம்’ எனக் காக்கப்படுகிறது.
- source_word: בְּשֵׁם
  choice: பெயரில்
  rationale: ஒருவரின் பெயரால் அல்லது அதிகாரத்தின் கீழ் செயல்படுவதைக் குறிக்கும் எபிரெய மரபுத்தொடருக்கு இயல்பான தமிழ் இணை.
- source_word: יְהוָה
  choice: யாவே
  rationale: יהוה என்ற இறைப் பெயரை ஒரு பட்டப்பெயரால் மாற்றாமல், தமிழில் இயல்பாக ஒலிபெயர்க்கிறது.
- source_word: אֱלֹהָיו
  choice: தன் கடவுளாகிய
  rationale: மூலத்தின் மூன்றாம் நபர் உடைமைப் பின்னொட்டைத் தெளிவாகக் காக்கிறது; எழுவாயையே சுட்டுவதால் தமிழில் ‘தன்’ இயல்பானது.
- source_word: כְּכָל אֶחָיו הַלְוִיִּם
  choice: லேவியர்களான தன் சகோதரர்கள் அனைவரையும் போல
  rationale: כְּ என்ற ஒப்புமையையும், אֶחָיו என்ற ஆண்பால் உறவுமுறைச் சொல்லையும், הַלְוִיִּם தரும் விளக்கத்தையும் ஒன்றாகக் காக்கிறது.
- source_word: הָעֹמְדִים שָׁם
  choice: அங்கே … நிற்கும்
  rationale: עמד என்பதன் நேரடிப் பொருளான ‘நிற்கும்’ என்பதையும், שָׁם என்பதன் இடச்சுட்டையும் காக்கிறது; ‘பணிபுரியும்’ என்று பொருளை விரித்துரைக்கவில்லை.
- source_word: לִפְנֵי יְהוָה
  choice: யாவேயின் முன்னிலையில்
  rationale: இறைச் சமூகத்தில், குறிப்பாக வழிபாட்டுப் பணியில், இருப்பதைக் குறிக்கும் வழக்கமான எபிரெய சொற்றொடரின் இயல்பான தமிழ் வடிவம்.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் தனிப்பட்ட உடன்படிக்கைப் பெயர் நேரடியாக உள்ளது. எனவே அதை ஒரு பட்டப்பெயரால் மாற்றாமல் ஒலிபெயர்ப்பது மூல வேறுபாட்டைக் காக்கிறது.
- issue: אֶחָיו என்ற பாலினம் குறிக்கும் உறவுமுறைச் சொல்
  choice: தன் சகோதரர்கள்
  alternative: தன் சக லேவியர்கள்
  rationale: மூலம் ‘சகோதரர்கள்’ எனத் தெளிவாகக் கூறுகிறது; உடன்வரும் ‘லேவியர்கள்’ அதன் சூழல்சார் பொருளை விளக்குவதால் உறவுமுறை உருவகத்தை நீக்கத் தேவையில்லை.
- issue: וְשֵׁרֵת என்பதன் சட்டச் செயற்பாட்டு வலிமை
  choice: ஊழியம் செய்யலாம்
  alternative: ஊழியம் செய்வான்
  rationale: முந்தைய வசனத்திலிருந்து தொடரும் சட்டச் சூழல் அனுமதிப் பொருளை ஆதரிக்கிறது. இருப்பினும் எபிரெய நிறைவுறா வடிவம் நேரடியான எதிர்கால அல்லது கட்டளைநிகர் வலிமையையும் ஏற்கக்கூடும்; அது அடிக்குறிப்பில் காக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத்தமிழில், வழிபாட்டு மற்றும் சட்டச் சூழலுக்கேற்ற கண்ணியமான நடையில் அமைக்கப்பட்டது. தமிழ் வாக்கிய இயல்புக்காக ஒப்புமைத் தொடர் முன்வைக்கப்பட்டுள்ளது; மூலத்தின் கருத்துறவுகள் அனைத்தும் காக்கப்பட்டுள்ளன. ‘ஊழியம்’ வழிபாட்டுப் பணியைத் தெளிவுபடுத்துகிறது; ‘யாவே’ இறைப் பெயராக ஒலிபெயர்க்கப்படுகிறது.
