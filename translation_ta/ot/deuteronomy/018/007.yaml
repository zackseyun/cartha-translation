- from: அப்போது, அங்கே யாவேயின் முன்னிலையில் நிற்கும் லேவியர்களான தன் சகோதரர்கள்[b] அனைவரையும் போல, அவனும் தன் கடவுளாகிய யாவேயின்[c] பெயரில் ஊழியம் செய்யலாம்[a].
  to: அப்போது, அவன் அங்கே யாவேயின் முன்னிலையில் நிற்கும் தன் சகோதரர்களாகிய எல்லா லேவியர்களைப் போல, தன் கடவுளான யாவேயின் பெயரில் ஊழியம் செய்யலாம்[a][b][c].
  rationale: சிறிய நடையியல் திருத்தங்கள் மட்டுமே செய்யப்பட்டுள்ளன. வாக்கிய வரிசை தமிழில் தெளிவாக அமைக்கப்பட்டு, ‘சகோதரர்கள்’ என்ற சொல்லுக்குப் பின் ‘எல்லா லேவியர்கள்’ என்ற விளக்கத் தொடர்பு இயல்பாக்கப்பட்டுள்ளது. மூலத்தின் சட்ட அனுமதி, ஒப்புமை, இறைப் பெயர், உடைமை, மற்றும் வழிபாட்டுச் சேவை குறித்த பொருள் மாற்றப்படவில்லை. அடிக்குறிப்பு அடையாளங்கள் உரிய சொற்களுக்குப் பின் மறுவரிசைப்படுத்தப்பட்டுள்ளன.
