  text: You shall give him the firstfruits of your grain[a], your new wine, and your oil[c][b], and the first of the fleece of your flock.
translation:
  language: ta
  text: உன் தானியம், புதுத் திராட்சரசம், எண்ணெய் ஆகியவற்றின் முதற்பகுதியையும்[a], உன் மந்தையிலிருந்து கத்தரித்த கம்பளியின் முதற்பகுதியையும்[c] அவனுக்குக் கொடுக்க வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘உன் தானியம், புதுத் திராட்சரசம், எண்ணெய் ஆகியவற்றின் முதற்பலனையும்’.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, ‘உன் மந்தையை முதலில் கத்தரித்ததிலிருந்து கிடைக்கும் பகுதியையும்’.
    reason: lexical_alternative
lexical_decisions:
- source_word: רֵאשִׁית
  choice: முதற்பலன்
  rationale: இச்சொல் முதல் அல்லது தொடக்கப் பகுதியைக் குறிக்கிறது. விளைபொருட்கள் வழங்கப்படும் இச்சூழலில் ‘முதற்பலன்’ என்பது அதன் முன்னுரிமையையும் காணிக்கையாக வழங்கப்படும் தன்மையையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: דָּגָן
  choice: தானியம்
  rationale: பலவகைத் தானிய விளைபொருட்களையும் உள்ளடக்கும் பொதுப்பெயராக இது நவீனத் தமிழில் தெளிவாக உள்ளது.
- source_word: תִּירוֹשׁ
  choice: புதுத் திராட்சரசம்
  rationale: இச்சொல் பொதுவாகப் புதிதாக உற்பத்தி செய்யப்பட்ட திராட்சரசத்தைக் குறிக்கிறது; ‘புது’ என்பது எபிரெயச் சொல்லின் தனித்துவத்தைப் பாதுகாக்கிறது.
- source_word: יִצְהָר
  choice: எண்ணெய்
  rationale: இஸ்ரவேலியச் சூழலில் இது பெரும்பாலும் ஒலிவ எண்ணெயைக் குறித்தாலும், மூலச்சொல் பொதுவாக ‘எண்ணெய்’ என்றே உள்ளது; எனவே கூடுதல் விளக்கத்தை முதன்மை உரையில் சேர்க்கவில்லை.
- source_word: גֵּז
  choice: கத்தரிக்கப்பட்ட கம்பளி
  rationale: இது கத்தரித்தல் என்ற செயலை அல்லது கத்தரித்து எடுக்கப்பட்ட கம்பளியைச் சுட்டலாம். கொடுக்கப்படும் பொருளைக் குறிக்கும் இச்சூழலில் ‘கத்தரிக்கப்பட்ட கம்பளி’ இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: צֹאן
  choice: மந்தை
  rationale: இச்சொல் செம்மறியாடுகளையும் வெள்ளாடுகளையும் உள்ளிட்ட சிறுகால்நடை மந்தையைச் சுட்டக்கூடும்; ‘மந்தை’ இந்தப் பொதுத்தன்மையைப் பாதுகாக்கிறது.
- source_word: תִּתֶּן לוֹ
  choice: அவனுக்குக் கொடுக்க வேண்டும்
  rationale: இங்குள்ள வினை சட்டப்பூர்வக் கட்டளையாகச் செயல்படுகிறது. ‘கொடுக்க வேண்டும்’ என்பது நவீனத் தமிழில் அதன் கட்டாயத் தன்மையைத் தெளிவாகத் தருகிறது.
theological_decisions:
- issue: לוֹ (‘அவனுக்கு’) என்பதன் சுட்டுப்பொருள்
  choice: ஒருமை ஆண்பால் சுட்டுப்பெயரை ‘அவனுக்கு’ என்று அப்படியே வைத்தல்
  alternative: ‘ஆசாரியனுக்குக்’ கொடுக்க வேண்டும் என்று சூழலின் சுட்டுப்பொருளை உரையிலேயே வெளிப்படுத்துதல்
  rationale: உடனடிச் சூழலில் பெறுபவர் ஆசாரியர் என்றாலும், எபிரெய உரை ஒருமைச் சுட்டுப்பெயரையே பயன்படுத்துகிறது. ‘அவனுக்கு’ என்பது இலக்கண வடிவத்தையும் சூழலில் உள்ள சாத்தியமான தனிநபர்/கூட்டு பிரதிநிதித்துவப் பதற்றத்தையும் மிகைப்படுத்தாமல் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சட்டக் கட்டளையின் கண்ணியத்தையும் தெளிவையும் காக்கும் நடை பயன்படுத்தப்பட்டுள்ளது. ‘கொடுக்க வேண்டும்’ கட்டாயத்தை இயல்பாக வெளிப்படுத்துகிறது; தொழில்நுட்பமான அல்லது சமயப்பிரிவு சார்ந்த சொற்கள் தவிர்க்கப்பட்டுள்ளன.
