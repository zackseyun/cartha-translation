revisions:
- from: உன் தானியத்தின் முதற்பலனையும்[a], உன் புதுத் திராட்சரசத்தையும்[b], உன் எண்ணெயையும், உன் மந்தையிலிருந்து முதலில் கத்தரிக்கப்பட்ட கம்பளியையும்[c] அவனுக்குக் கொடுக்க வேண்டும்.
  to: உன் தானியம், புதுத் திராட்சரசம், எண்ணெய் ஆகியவற்றின் முதற்பகுதியையும்[a], உன் மந்தையிலிருந்து கத்தரித்த கம்பளியின் முதற்பகுதியையும்[c] அவனுக்குக் கொடுக்க வேண்டும்.
