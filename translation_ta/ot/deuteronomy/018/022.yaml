base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/018/022.yaml
  text: When the prophet speaks in the name of Yahweh[a], and the matter does not happen or come about, that is the matter that Yahweh has not spoken. The prophet has spoken it presumptuously[c][b]; you shall not fear him.
translation:
  language: ta
  text: 'தீர்க்கதரிசி ஒருவன் யாவேயின்[a] பெயரில் ஒரு செய்தியைச் சொல்லி, அது நிகழாமலும் நிறைவேறாமலும் போனால், யாவே சொல்லாத செய்தி அதுவே.[b] அந்தத் தீர்க்கதரிசி அதைச் செருக்குடன் பேசியிருக்கிறான்;[c] நீ அவனுக்கு அஞ்ச வேண்டாம்.


    [a] “யாவே” என்பது எபிரேய மொழியில் கடவுளின் தனிப்பட்ட பெயராகிய יהוה (YHWH) என்பதன் ஒலிபெயர்ப்பு.


    [b] “செய்தி” என்பதற்கான எபிரேயச் சொல் דָּבָר; அது சொல்லப்பட்ட வார்த்தையையும் முன்னறிவிக்கப்பட்ட நிகழ்வையும் குறிக்கக்கூடும்.


    [c] “செருக்குடன்” என்பது யாவேயின் அதிகாரமின்றி, அகந்தையுடனும் வேண்டுமென்றும் பேசுவதைக் குறிக்கிறது.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “யாவே” என்பது எபிரேய மொழியில் கடவுளின் தனிப்பட்ட பெயராகிய יהוה (YHWH) என்பதன் ஒலிபெயர்ப்பு.
    reason: divine_name
  - marker: b
    text: “செய்தி” என்பதற்கான எபிரேயச் சொல் דָּבָר; அது சொல்லப்பட்ட வார்த்தையையும் முன்னறிவிக்கப்பட்ட நிகழ்வையும் குறிக்கக்கூடும்.
    reason: lexical_alternative
  - marker: c
    text: “செருக்குடன்” என்பது யாவேயின் அதிகாரமின்றி, அகந்தையுடனும் வேண்டுமென்றும் பேசுவதைக் குறிக்கிறது.
    reason: cultural_note
lexical_decisions:
- source_word: הַנָּבִיא
  choice: தீர்க்கதரிசி ஒருவன்
  rationale: எபிரெயில் வரையறைச் சுட்டு இருந்தாலும், சட்டவழக்கில் இது ஒரு பொதுவான பிரதிநிதி நிகழ்வைக் குறிக்கிறது; நவீன தமிழில் “ஒருவன்” அந்தப் பொதுப்பொருளை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: בְּשֵׁם יְהוָה
  choice: யாவேயின் பெயரில்
  rationale: தெய்வீக அதிகாரத்தை உரிமைகோரி பேசுவதைக் குறிக்கும் உடன்படிக்கைச் சொற்றொடரை இயல்பாகப் பாதுகாக்கிறது; יהוה தனிப்பெயராக ஒலிபெயர்க்கப்படுகிறது.
- source_word: הַדָּבָר
  choice: செய்தி
  rationale: דָּבָר இங்கு தீர்க்கதரிசி சொன்ன உள்ளடக்கத்தையும் அது சுட்டும் நிகழ்வையும் இணைக்கிறது. “செய்தி” தமிழில் தீர்க்கதரிசன உரைக்கு இயல்பானது; மூலச்சொல்லின் இருபொருள் அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
- source_word: וְלֹא יִהְיֶה ... וְלֹא יָבֹא
  choice: நிகழாமலும் நிறைவேறாமலும் போனால்
  rationale: இரண்டு எபிரெய வினைகளையும் தனித்தனியாகக் காட்டி, முன்னறிவிக்கப்பட்டது நிகழ்வாகி நிறைவேறாததைத் தெளிவாகச் சொல்கிறது.
- source_word: הוּא הַדָּבָר אֲשֶׁר לֹא דִבְּרוֹ יְהוָה
  choice: யாவே சொல்லாத செய்தி அதுவே
  rationale: הוּא தரும் வலியுறுத்தலை “அதுவே” என்பதால் காத்து, செய்தி யாவேயிடமிருந்து வரவில்லை என்ற அடையாளத்தைச் சுருக்கமாக வெளிப்படுத்துகிறது.
- source_word: בְּזָדוֹן
  choice: துணிகரமான தற்துணிவுடன்
  rationale: זָדוֹן குறிக்கும் செருக்கான, அதிகாரமற்ற, வேண்டுமென்ற துணிவை வெறும் “தைரியமாக” என்று தவறாகப் புரிந்துகொள்ளாத வகையில் தெரிவிக்கிறது.
- source_word: לֹא תָגוּר מִמֶּנּוּ
  choice: நீ அவனுக்கு அஞ்ச வேண்டாம்
  rationale: தீர்க்கதரிசியால் அச்சுறுத்தப்படவோ அவனுக்கு அஞ்சவோ வேண்டாம் என்ற தடையை நேரடியான நவீன தமிழில் தருகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலத்தில் வரும் நான்கெழுத்துத் தனிப்பெயரை ஒரு பட்டப்பெயரால் மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
- issue: தீர்க்கதரிசனத்தைச் சோதிக்கும் அளவுகோல்
  choice: இந்த வசனத்தில் கூறப்பட்ட முன்னறிவிப்பு நிகழ்ந்து நிறைவேறுகிறதா என்பதையே உரை கூறும் சோதனையாக வைத்தல்
  alternative: எல்லா வகையான தீர்க்கதரிசன ஊழியத்திற்குமான விரிவான கோட்பாடாக விளக்குதல்
  rationale: வசனத்தின் சட்டச் சூழலையும் அதன் வரையறுக்கப்பட்ட கூற்றையும் காத்து, மூலத்தில் இல்லாத கோட்பாட்டு விரிவாக்கத்தைத் தவிர்க்கிறது.
- issue: דָּבָר என்பதன் பொருள் பரப்பு
  choice: முதன்மை உரையில் “செய்தி”; வார்த்தை மற்றும் முன்னறிவிக்கப்பட்ட நிகழ்வு ஆகிய இரண்டையும் குறிக்கக்கூடியது என்று அடிக்குறிப்பில் தெரிவித்தல்
  alternative: “வார்த்தை” அல்லது “காரியம்” என்று ஒரே பொருளுக்குள் கட்டுப்படுத்துதல்
  rationale: தீர்க்கதரிசி பேசிய உரைக்கும் அது நிறைவேறும் நிகழ்வுக்கும் இடையிலான எபிரெயச் சொல்லின் திட்டமிட்ட தொடர்பைச் சுருக்காமல் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதாகவும் வேதாகம உரைக்கேற்ற கண்ணியத்துடனும் அமைக்கப்பட்டுள்ளது. சட்டவழக்கின் பொதுப்பொருளுக்கு “தீர்க்கதரிசி ஒருவன்” பயன்படுத்தப்பட்டுள்ளது. எபிரெய இரட்டை வினைச்சொல் அமைப்பும் דָּבָר என்பதன் உண்மையான பொருள் நெகிழ்வும் பாதுகாக்கப்பட்டுள்ளன.
