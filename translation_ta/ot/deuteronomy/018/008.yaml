  source_fidelity: முதற் கூற்று ‘சரிசமமான பங்குகளை உண்ண வேண்டும்’ என்பது חֵלֶק כְּחֵלֶק יֹאכֵלוּ என்ற சொல்லாட்சியை நன்றாகப் பேணுகிறது. ஆனால் ‘இதற்கு மேற்பட்டது’ என்பது לְבַד என்பதன் ‘அதோடு/தவிர’ என்ற சேர்க்கை அல்லது தனித்திருக்கும் பொருளை ‘அதைவிட அதிகம்’ என்ற ஒப்பீட்டுப் பொருளாக மாற்றுகிறது. மேலும், இறுதித் தொடரின் உறுதியற்ற தன்மையை முதன்மை உரையில் ‘மூதாதையர் சொத்து’ என மிக உறுதியாகக் குறிப்பதற்குப் பதிலாக, ‘தொடர்புடையது’ என்று எச்சரிக்கையுடன் கூறுவது பொருத்தம்.
  naturalness: ‘இதற்கு மேற்பட்டது’ இவ்விடத்தில் இயல்பான இணைப்பல்ல; அது சமப் பங்கைவிட அதிகமான தொகையைக் குறிக்கிறது. ‘அதோடு’ மற்றும் ‘பெறுவார்கள்’ நவீன தரத் தமிழில் தெளிவான, கண்ணியமான ஓட்டத்தைத் தருகின்றன. எபிரெயத்தில் பன்மை வினைக்குப் பின் ஒருமை உடைமை வடிவம் வருவதால், தமிழிலும் ‘அவர்கள்’ / ‘அவனுடைய’ என்ற மாற்றம் பாதுகாக்கப்பட்டுள்ளது.
  terminology: ‘சமமான பங்குகள்’ மற்றும் ‘உண்ண வேண்டும்’ பொருத்தமானவை. ‘மூதாதையர் சொத்தோடு தொடர்புடைய’ என்பது עַל הָאָבוֹת என்ற கடினமான சொல்லாட்சியை மரபுரிமைச் சொத்து என்று முழுமையாகத் தீர்மானிக்காமல் வழங்குகிறது. அடிக்குறிப்பு மாற்று வாசிப்பையும் பரந்த ‘மரபுவழி வீட்டுடன் தொடர்புடைய வருவாய்’ என்ற சாத்தியத்தையும் பதிவு செய்கிறது.
