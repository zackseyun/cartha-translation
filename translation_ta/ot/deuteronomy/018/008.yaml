source:
  edition: WLC
  text: חֵ֥לֶק כְּ/חֵ֖לֶק יֹאכֵ֑לוּ לְ/בַ֥ד מִמְכָּרָ֖י/ו עַל הָ/אָבֽוֹת־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/018/008.yaml
  text: They shall eat equal portions[a], besides what comes from the sale of his patrimony.
translation:
  language: ta
  text: அவர்கள் சமமான பங்குகளை உண்ண வேண்டும்; அதோடு, அவனுடைய மூதாதையர் சொத்தோடு தொடர்புடைய விற்பனைகளிலிருந்து கிடைப்பதையும் பெறுவார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “குடும்பச் சொத்துகளை விற்று அவன் பெறுவதும் கூட.” இறுதி எபிரெயத் தொடர் பொருள் காண்பதற்குக் கடினமானது; அது அவனுடைய மரபுவழி வீட்டுடன் தொடர்புடைய வருவாயை இன்னும் பொதுவாகக் குறிக்கக்கூடும்.
    reason: alternative_reading
lexical_decisions:
- source_word: חֵלֶק כְּחֵלֶק
  choice: சரிசமமான பங்குகள்
  rationale: ‘பங்குக்குப் பங்கு’ என்ற எபிரெயச் சொற்றொடர் சமமான பங்கீட்டைக் குறிக்கிறது; நவீன தமிழில் ‘சரிசமமான பங்குகள்’ இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: יֹאכֵלוּ
  choice: உண்ண வேண்டும்
  rationale: மூலத்தில் உள்ள ‘உண்’ என்ற நேரடியான வினையைப் பேணி, ஆசாரிய ஆதரவுக்காக ஒதுக்கப்பட்ட உணவுப் பங்குகளை அனுபவிப்பதைக் காட்டுகிறது.
- source_word: לְבַד
  choice: இதற்கு மேற்பட்டது
  rationale: சமமான ஆலயப் பங்கிற்கு அப்பாற்பட்டு வரும் தனிப்பட்ட வருவாயைத் தனியே சுட்டும் கூடுதல் பொருளை வெளிப்படுத்துகிறது.
- source_word: מִמְכָּרָיו
  choice: விற்றுக் கிடைப்பது
  rationale: இந்தச் சொல் விற்பனைகளையோ விற்பனையிலிருந்து கிடைக்கும் வருவாயையோ குறிக்கலாம்; தமிழ் சொற்றொடர் இரண்டாவது பொருளை இயல்பாகத் தருகிறது.
- source_word: עַל הָאָבוֹת
  choice: தன் மூதாதையர் சொத்தை
  rationale: சொல்லடக்கமான ‘தந்தையர்மேல்/மூதாதையரின்படி’ என்ற கடினமான தொடரை, குடும்ப மரபோடு தொடர்புடைய சொத்து என்ற சாத்தியமான பொருளில் வழங்குகிறது; உறுதியின்மையை அடிக்குறிப்பு பதிவு செய்கிறது.
theological_decisions:
- issue: מִמְכָּרָיו עַל הָאָבוֹת என்ற இறுதித் தொடரின் பொருள்
  choice: மூதாதையர் சொத்தை விற்பதால் கிடைக்கும் தனிப்பட்ட வருவாய், சமமான ஆசாரியப் பங்கிற்கு மேலானதாகக் கொள்ளப்படுகிறது.
  alternative: குடும்பச் சொத்துகளை விற்பதால் அவன் பெறுவது; அல்லது மூதாதையர் வீட்டுடன் தொடர்புடைய வருவாய்
  rationale: எபிரெயத் தொடர் இலக்கண ரீதியாகச் சுருக்கமாகவும் தெளிவற்றதாகவும் உள்ளது. உடனடிச் சூழலில், மையத் திருத்தலத்தில் பணியாற்றும் லேவியருக்குச் சமமான பங்கு வழங்கப்படுவது முதன்மை; குடும்ப மரபுடன் தொடர்புடைய தனிப்பட்ட வருவாய் அதிலிருந்து தனியே இருப்பதாக வாசிப்பது பொருத்தமானது. மாற்றுப் பொருள்களை அடிக்குறிப்பு திறந்தவையாக வைத்திருக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில் இயல்பான, கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘உண்ண வேண்டும்’ என்பது மூலத்தின் தெளிவான உருவகமற்ற வினையைப் பேணுகிறது; கடினமான இறுதித் தொடரின் உறுதியின்மை அடிக்குறிப்பில் வெளிப்படையாக வைக்கப்பட்டுள்ளது.
