  text: כִּ֣י ב֗/וֹ בָּחַ֛ר יְהוָ֥ה אֱלֹהֶ֖י/ךָ מִ/כָּל שְׁבָטֶ֑י/ךָ לַ/עֲמֹ֨ד לְ/שָׁרֵ֧ת בְּ/שֵׁם יְהוָ֛ה ה֥וּא וּ/בָנָ֖י/ו כָּל הַ/יָּמִֽים־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/018/005.yaml
  text: For Yahweh your God has chosen him from all your tribes to stand and minister in the name of Yahweh[a], he and his sons all the days.
translation:
  language: ta
  text: ஏனெனில், உன் கடவுளாகிய யாவே, உன் எல்லாக் கோத்திரங்களிலிருந்தும் அவனை, அவனும் அவன் மகன்களும் எல்லா நாட்களும்[a] யாவேயின் பெயரில் நின்று திருப்பணி செய்யும்படி, தேர்ந்தெடுத்திருக்கிறார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் நேரடியாக, ‘எல்லா நாட்களும்.’ இச்சூழலில் இது ஆசாரியத் திருப்பணி தொடர்ந்து நீடிப்பதைக் குறிக்கிறது.
    reason: மூலச் சொற்றொடரின் நேரடி வடிவத்தையும், சூழலில் உள்ள அதன் நீடித்த காலப் பொருளையும் விளக்குகிறது.
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய கட்டளைக்கான காரணத்தை அறிமுகப்படுத்தும் எபிரெய இணைப்புச் சொல்லின் விளக்கத் தன்மையை இயல்பான தமிழில் காக்கிறது.
- source_word: בּוֹ בָּחַר
  choice: அவனைத் தேர்ந்தெடுத்திருக்கிறார்
  rationale: בחר என்பதுடன் வரும் ב தேர்ந்தெடுக்கப்பட்ட நபரைக் குறிக்கிறது; நிகழ்காலத்திலும் பொருந்தும் கடந்தகாலத் தெய்வீகத் தேர்வைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: உன் கடவுளாகிய யாவே
  rationale: உடன்படிக்கைப் பெயரான יהוה என்பதை ‘யாவே’ எனவும், இரண்டாம் நபர் ஒருமை உரிமையைக் ‘உன்’ எனவும் துல்லியமாகக் காட்டுகிறது.
- source_word: מִכָּל שְׁבָטֶיךָ
  choice: உன் எல்லாக் கோத்திரங்களிலிருந்தும்
  rationale: இஸ்ரவேலின் எல்லாக் கோத்திரங்களின் நடுவிலிருந்து செய்யப்பட்ட தேர்வைக் குறிக்கிறது.
- source_word: לַעֲמֹד
  choice: நின்று
  rationale: ஆசாரியப் பணியுடன் தொடர்புடைய உடல் நிலையை மறைக்காமல், தமிழில் அடுத்த வினையுடன் இயல்பாக இணைக்கிறது.
- source_word: לְשָׁרֵת
  choice: திருப்பணி செய்வதற்காக
  rationale: பொதுவான சேவையைவிட வழிபாடு சார்ந்த ஆசாரியப் பணியை இச்சூழலில் தெளிவாகக் குறிக்கிறது.
- source_word: בְּשֵׁם יְהוָה
  choice: யாவேயின் பெயரில்
  rationale: யாவேயின் பெயரின் அதிகாரத்திலும் பிரதிநிதித்துவத்திலும் செய்யப்படும் பணியைக் குறிக்கும் மூலமொழி அமைப்பைப் பாதுகாக்கிறது.
- source_word: הוּא וּבָנָיו
  choice: அவனும் அவன் மகன்களும்
  rationale: ஆசாரிய வழித்தோன்றலைக் குறிக்கும் ஆண்பால் பன்மையான ‘மகன்கள்’ என்பதைப் பாலினப் பொதுமைப்படுத்தல் இன்றித் தருகிறது.
- source_word: כָּל הַיָּמִים
  choice: எல்லா நாட்களிலும்
  rationale: எபிரெயச் சொற்றொடரின் உருவகத்தை நெருக்கமாகக் காத்து, தொடர்ந்து நீடிக்கும் பணியையும் இயல்பான தமிழில் உணர்த்துகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் நேரடியாக வரும் உடன்படிக்கைப் பெயரை ஒரு பட்டப்பெயராக மாற்றாமல் ஒலிபெயர்த்துக் காக்கிறது.
- issue: ஆசாரிய வழித்தோன்றலின் பாலினக் குறிப்பு
  choice: அவனும் அவன் மகன்களும்
  alternative: அவனும் அவன் பிள்ளைகளும்
  rationale: மூல எபிரெயம் ஆண்பால் பன்மையைத் தெளிவாகக் கொண்டிருப்பதால் அதை நடுநிலைப்படுத்தாமல் வழங்குகிறது.
- issue: כָּל הַיָּמִים என்பதன் கால அளவு
  choice: எல்லா நாட்களிலும்
  alternative: என்றென்றும்
  rationale: நீடித்த ஆசாரியப் பணியை உணர்த்தினாலும், மூலத்தின் நேரடியான ‘எல்லா நாட்களும்’ என்ற வடிவத்தை வைத்து அதன் காலவியல் நுணுக்கத்தைத் தீர்மானித்து விடாமல் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் கண்ணியமான, பொதுவாசகர்களுக்கு எளிதில் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. ‘திருப்பணி’ வழிபாடு சார்ந்த சேவையைச் சுருக்கமாகக் குறிக்கிறது; ‘நின்று’ என்ற சொல் மூலத்தின் ஆசாரியப் பணிநிலையைப் பாதுகாக்கிறது. இறுதி காலச் சொற்றொடரின் பொருள் அடிக்குறிப்பில் விளக்கப்பட்டு, உரையில் மூல உருவகம் காக்கப்பட்டுள்ளது.
