  text: תָּמִ֣ים תִּֽהְיֶ֔ה עִ֖ם יְהוָ֥ה אֱלֹהֶֽי/ךָ׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/018/013.yaml
  text: You shall be blameless with Yahweh your God[a].
translation:
  language: ta
  text: உன் கடவுளாகிய யாவேயோடு நீ முழு மனதுடன் இரு[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உன் கடவுளாகிய யாவேயோடு நீ முழுமையாய் இரு”; “குற்றமற்றவனாய்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: תָּמִים
  choice: குற்றமற்றவனாய்
  rationale: இச்சொல் குறைபாடின்மை, முழுமை, நேர்மை ஆகிய பொருள் நிழல்களைக் கொண்டது. சுற்றியுள்ள வசனங்களில் தடைசெய்யப்பட்ட குறிகேட்டல் மற்றும் மந்திரச் செயல்களுக்கு மாறாக, யாவேக்கு உண்மையுடன் வாழும் ஒழுக்கநேர்மையை இங்கு குறிக்கிறது; பாவமே இல்லாத பரிபூரண நிலையை அவசியமாகக் குறிக்கவில்லை. ‘முழுமையானவனாய்’ என்பதும் சாத்தியம் என்பதால் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: תִּהְיֶה
  choice: நீ ... இருக்க வேண்டும்
  rationale: היה என்பதன் Qal imperfect இரண்டாம் நபர் ஆண்பால் ஒருமை வடிவம் இங்கு கட்டளையூட்டும் அறிவுறுத்தலாகச் செயல்படுகிறது. ‘இருக்க வேண்டும்’ என்பது அதன் கடமையுணர்வையும் நவீன தமிழின் இயல்பையும் காக்கிறது.
- source_word: עִם
  choice: உடன்
  rationale: עִם என்பதன் நேரடிப் பொருள் ‘உடன்’. இது யாவேயோடுள்ள உறவையும் அவருக்கு முன்பான வாழ்வையும் உணர்த்துகிறது; ‘முன்பாக’ என்று மொழிபெயர்ப்பது உறவுசார் நிழலை அளவுக்கு மீறித் தீர்மானித்துவிடும்.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய தனிப்பெயரான יהוה-ஐ ஒரு பட்டப்பெயரால் மாற்றாமல், தமிழில் அதன் பொதுவாக ஏற்றுக்கொள்ளப்பட்ட ஒலிபெயர்ப்பான ‘யாவே’ என்று தருகிறது.
- source_word: אֱלֹהֶיךָ
  choice: உன் கடவுள்
  rationale: இரண்டாம் நபர் ஆண்பால் ஒருமை உடைமை விகுதியுடன், யாவேயைக் குறிக்கும் இச்சூழலில் இது ஒருமையான ‘உன் கடவுள்’ எனப் பொருள்படுகிறது.
theological_decisions:
- issue: உடன்படிக்கை அறிவுறுத்தலில் תָּמִים என்பதன் பொருள்
  choice: கடவுளோடு உறவில் குற்றமற்ற நேர்மையுடன் இருத்தல்
  alternative: யாவேயுடன் முழுமையானவனாய் அல்லது முழு மனதுடன் இருத்தல்
  rationale: உடனடிச் சூழல் (உபா 18:9–14) பிற இனங்களின் குறிகேட்டல், மந்திரம் போன்ற நடைமுறைகளுக்கு மாறாகப் பிளவுபடாத உடன்படிக்கை உண்மையை வலியுறுத்துகிறது. ‘குற்றமற்றவனாய்’ என்பது ஒழுக்க மற்றும் உடன்படிக்கை வலிமையைத் தக்கவைக்கிறது; அதை முழுமையான பாவமின்மை என்ற கோட்பாடாகத் தீர்மானிப்பதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், ஒருமை ஆண்பால் முகவரியை மூலத்தின்படி காத்து, எளிமையானதும் கண்ணியமானதுமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘குற்றமற்றவன்’ என்ற சொல்லின் சாத்தியமான முழுமை/முழு மனம் சார்ந்த பொருள் நிழல்கள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளன.
