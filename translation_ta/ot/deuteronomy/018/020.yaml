  text: אַ֣ךְ הַ/נָּבִ֡יא אֲשֶׁ֣ר יָזִיד֩ לְ/דַבֵּ֨ר דָּבָ֜ר בִּ/שְׁמִ֗/י אֵ֣ת אֲשֶׁ֤ר לֹֽא צִוִּיתִי/ו֙ לְ/דַבֵּ֔ר וַ/אֲשֶׁ֣ר יְדַבֵּ֔ר בְּ/שֵׁ֖ם אֱלֹהִ֣ים אֲחֵרִ֑ים וּ/מֵ֖ת הַ/נָּבִ֥יא הַ/הֽוּא־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/018/020.yaml
  text: But the prophet who presumptuously speaks a word in my name that I have not commanded him to speak[b][a], or who speaks in the name of other gods—that prophet shall die.
translation:
  language: ta
  text: ஆனால், நான் அவனுக்குச் சொல்லும்படி கட்டளையிடாத ஒரு வார்த்தையை என் பெயரில் துணிகரமாகச் சொல்லும் தீர்க்கதரிசியோ[a], வேறு தெய்வங்களின் பெயரில் பேசும் தீர்க்கதரிசியோ—அந்தத் தீர்க்கதரிசி சாக வேண்டும்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அகந்தையுடன் அதிகார வரம்பை மீறிப் பேசும்.’ எபிரெய வினை வேண்டுமென்றே செய்யப்படும் துணிகரமான மீறுதலைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘இறக்க வேண்டும்’ / ‘மரணதண்டனைக்கு உட்பட வேண்டும்.’ எபிரெய உரை சட்டப்பூர்வமான மரணத் தீர்ப்பைச் சுருக்கமாகக் கூறுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: ஆனால்
  rationale: முந்தைய வசனத்தில் கூறப்பட்ட உண்மையான தீர்க்கதரிசிக்கு எதிரான வலுவான வேறுபாட்டை இயல்பான தமிழில் காட்டுகிறது.
- source_word: הַנָּבִיא
  choice: தீர்க்கதரிசி
  rationale: நָבִיא என்பதற்கான தமிழில் நிலைபெற்ற, பொதுவாகப் புரிந்துகொள்ளப்படும் சொல்.
- source_word: יָזִיד
  choice: துணிகரமாக
  rationale: זיד என்பதன் ஹிபில் வடிவம் வேண்டுமென்றே அதிகார வரம்பை மீறும் அகந்தையான துணிவைக் குறிக்கிறது; ‘துணிகரமாக’ அதன் ஒழுக்க மற்றும் சட்ட வலிமையைத் தக்கவைக்கிறது.
- source_word: לְדַבֵּר דָּבָר
  choice: ஒரு வார்த்தையை ... சொல்லும்
  rationale: எபிரெய மொழியின் வினை–பெயர்ச்சொல் அமைப்பை வாசிக்கத்தக்க தமிழில் நெருக்கமாகப் பாதுகாக்கிறது.
- source_word: בִּשְׁמִי
  choice: என் பெயரில்
  rationale: தெய்வீக அதிகாரத்தைத் தனக்குள்ளதாகக் கூறிப் பேசுவதைக் குறிக்கும் மூலமொழி வழக்கை நேரடியாகவும் தெளிவாகவும் தருகிறது.
- source_word: אֵת אֲשֶׁר לֹא צִוִּיתִיו לְדַבֵּר
  choice: நான் சொல்லும்படி கட்டளையிடாத
  rationale: பேசுவதற்கான தெய்வீகக் கட்டளை வழங்கப்படவில்லை என்ற உறவுத்தொடரையும் கட்டளை மொழியையும் சுருக்கமான இயல்பான தமிழில் காக்கிறது.
- source_word: וַאֲשֶׁר יְדַבֵּר
  choice: அல்லது ... பேசும்
  rationale: வாவ் இங்கு இரண்டாவது தனித்த குற்றத்தை இணைக்கிறது; இரண்டில் எது நிகழ்ந்தாலும் தண்டனை பொருந்துவதால் ‘அல்லது’ பொருத்தமானது.
- source_word: בְּשֵׁם אֱלֹהִים אֲחֵרִים
  choice: வேறு தெய்வங்களின் பெயரில்
  rationale: பிற தெய்வங்களின் அதிகாரத்தை உரிமைகோரி அல்லது அவற்றை அழைத்து பேசுவதைக் குறிக்கும் சொற்றொடரை நேரடியாக வழங்குகிறது.
- source_word: וּמֵת
  choice: சாக வேண்டும்
  rationale: சுருக்கமான சட்டத் தீர்ப்பைத் தமிழில் இயல்பாகத் தெரிவிக்கிறது; மரணத்தை ஏற்படுத்தும் முறையை மூலமொழியைவிட அதிகமாகக் குறிப்பிடவில்லை.
- source_word: הַנָּבִיא הַהוּא
  choice: அந்தத் தீர்க்கதரிசி
  rationale: பெயர்ச்சொல்லுடன் வரும் சுட்டுச்சொல்லின் வலியுறுத்தலை இயல்பான தமிழில் தக்கவைக்கிறது.
theological_decisions:
- issue: முதல் நபரில் வரும் தெய்வீகப் பெயர்க் குறிப்பு
  choice: ‘என் பெயரில்’ என்று முதல் நபர் நேரடிக் கூற்றாகவே வைக்கப்பட்டது.
  alternative: ‘ஆண்டவரின் பெயரில்’ என்று விரித்துரைத்தல்.
  rationale: எபிரெய உரை கடவுளின் நேரடிப் பேச்சாக இருப்பதால் முதல் நபரைப் பாதுகாப்பது துல்லியமானது; வசனத்தில் இல்லாத பெயரைச் சேர்ப்பதையும் தவிர்க்கிறது.
- issue: மரணத் தண்டனைச் சூத்திரம்
  choice: וּמֵת என்பது ‘சாக வேண்டும்’ என்று மொழிபெயர்க்கப்பட்டது.
  alternative: ‘கொல்லப்பட வேண்டும்’ அல்லது ‘மரணதண்டனை விதிக்கப்பட வேண்டும்.’
  rationale: மூலமொழி சட்டத் தீர்ப்பைச் சுருக்கமாகக் கூறுகிறது; செயப்படுபொருள் வடிவிலான கொலைச் செயல்முறையை வெளிப்படையாகச் சேர்க்காமல் அதன் கட்டாய நீதித்தீர்ப்பை இந்தத் தேர்வு காக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழ்; பொதுவாசகர்களுக்குப் புரியக்கூடிய, கண்ணியமான சட்டப்பாங்கு. ‘தீர்க்கதரிசி’ என்பது தமிழ்க் கிறிஸ்தவப் பயன்பாட்டில் நிலைபெற்ற சொல்லாக இருப்பதால் தக்கவைக்கப்பட்டது. ‘துணிகரமாக’ என்ற சொல் திட்டமிட்ட அகந்தையான அதிகாரமீறலை உணர்த்துகிறது. இணை அமைப்பைத் தெளிவாக்க ‘தீர்க்கதரிசியோ ... தீர்க்கதரிசியோ’ பயன்படுத்தப்பட்டது.
