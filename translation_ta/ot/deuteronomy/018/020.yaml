- from: ஆனால், நான் சொல்லும்படி கட்டளையிடாத ஒரு வார்த்தையை என் பெயரில் துணிகரமாகச் சொல்லும் தீர்க்கதரிசியோ[a], வேறு தெய்வங்களின் பெயரில் பேசும் தீர்க்கதரிசியோ—அந்தத் தீர்க்கதரிசி சாக வேண்டும்[b].
