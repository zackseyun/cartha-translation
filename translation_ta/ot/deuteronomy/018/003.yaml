- from: 'பலியிடுபவர்களாகிய மக்களிடமிருந்து ஆசாரியர்களுக்குக் கிடைக்கவேண்டிய பங்கு இதுவே: பலியிடப்படுவது மாடாக இருந்தாலும் செம்மறியாடாக இருந்தாலும், பலியிடுகிறவர் அதன் முன்னங்காலையும்[a], இரண்டு தாடைகளையும்[b], இரைப்பையையும்[c] ஆசாரியருக்குக் கொடுக்கவேண்டும்.'
