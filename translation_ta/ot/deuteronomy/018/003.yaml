  text: וְ/זֶ֡ה יִהְיֶה֩ מִשְׁפַּ֨ט הַ/כֹּהֲנִ֜ים מֵ/אֵ֣ת הָ/עָ֗ם מֵ/אֵ֛ת זֹבְחֵ֥י הַ/זֶּ֖בַח אִם שׁ֣וֹר אִם שֶׂ֑ה וְ/נָתַן֙ לַ/כֹּהֵ֔ן הַ/זְּרֹ֥עַ וְ/הַ/לְּחָיַ֖יִם וְ/הַ/קֵּבָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/018/003.yaml
  text: 'And this shall be the priests’ due from the people[a], from those who sacrifice a sacrifice, whether an ox or a sheep: he shall give to the priest the shoulder, the two cheeks[d][c][b], and the stomach.'
translation:
  language: ta
  text: 'மக்களிடமிருந்து, அதாவது பலியைப் பலியிடுகிறவர்களிடமிருந்து, ஆசாரியர்களுக்குரிய உரிமைப் பங்கு இதுவே: எருதையோ செம்மறியாட்டையோ பலியிடுகிறவர், ஆசாரியருக்கு அதன் முன்னங்கால் பகுதியை[b], இரண்டு கன்னங்களை[c], இரைப்பையை[d] கொடுக்கவேண்டும்.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘பலியைப் பலியிடுகிறவர்களிடமிருந்து’ என்பதில் எபிரெயத்தில் பலியைக் குறிக்கும் அதே வேர்ச்சொல் இருமுறை வருகிறது; இதை ‘பலியைச் செலுத்துகிறவர்களிடமிருந்து’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘முன்னங்கால் பகுதி’ என்பதற்கான எபிரெயச் சொல் சொல்லுக்கு சொல் ‘கை’ என்று பொருள்படும்; இங்கு அது விலங்கின் தோளுடன் சேர்ந்த முன்னங்கால் பகுதியைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: c
    text: ‘இரண்டு கன்னங்கள்’ என்பதை ‘கன்னங்கள்’ அல்லது ‘இரண்டு தாடையெலும்புகள்’ என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் இருமை வடிவில் உள்ளது.
    reason: lexical_alternative
  - marker: d
    text: மரபுவழி மொழிபெயர்ப்புகளில் ‘பெருவயிறு’ என வழங்கப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשְׁפַּט
  choice: கிடைக்கவேண்டிய பங்கு
  rationale: இச்சட்ட மற்றும் பலியிடல் சூழலில், ஆசாரியர்களுக்கு உரிமையாக நிர்ணயிக்கப்பட்ட பகுதியைக் குறிக்கிறது; ‘நியாயத்தீர்ப்பு’ என்ற பொதுப்பொருள் இங்கு பொருந்தாது.
- source_word: הַכֹּהֲנִים
  choice: ஆசாரியர்களுக்கு
  rationale: பன்மையைத் தக்கவைத்து, அவர்களுக்கு உரிய பங்கு என்ற உறவை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: מֵאֵת הָעָם מֵאֵת זֹבְחֵי הַזֶּבַח
  choice: பலியிடுபவர்களாகிய மக்களிடமிருந்து
  rationale: ‘மக்களிடமிருந்து, பலியைப் பலியிடுகிறவர்களிடமிருந்து’ என்ற எபிரெய இணைப்பை இயல்பான தமிழில், மக்கள் கூட்டத்திலுள்ள பலியிடுவோரைக் குறிப்பதாக அளிக்கிறது.
- source_word: אִם שׁוֹר אִם שֶׂה
  choice: மாடாக இருந்தாலும் செம்மறியாடாக இருந்தாலும்
  rationale: שׁוֹר என்பதன் மாட்டினப் பொருளையும் שֶׂה என்பதன் சிறிய மந்தை விலங்குப் பொருளில் இச்சூழலுக்குப் பொருத்தமான செம்மறியாட்டையும் தெளிவாக வழங்குகிறது.
- source_word: וְנָתַן
  choice: பலியிடுகிறவர் ... கொடுக்கவேண்டும்
  rationale: எபிரெய ஒருமை வினையை ஒவ்வொரு பலியிடுபவருக்கும் பொருந்தும் பகிர்வு ஒருமையாகப் பாதுகாக்கிறது; பாலினக் குறியீட்டைத் தவிர்க்கப் பெயர்ச்சொல் மீண்டும் பயன்படுத்தப்படுகிறது.
- source_word: לַכֹּהֵן
  choice: ஆசாரியருக்கு
  rationale: குறிப்பிட்ட பணியைச் செய்யும் ஆசாரியரை வகைசார் ஒருமையில் சுட்டுகிறது.
- source_word: הַזְּרֹעַ
  choice: முன்னங்கால்
  rationale: சொல்லின் அடிப்படைப் பொருள் ‘கை’; விலங்கின் உடற்கூறு மற்றும் பலிப்பங்கு சூழலில் தோளுடன் சேர்ந்த முன்னங்கால் பகுதியைக் குறிக்கிறது.
- source_word: הַלְּחָיַיִם
  choice: இரண்டு தாடைகள்
  rationale: எபிரெய இருமை வடிவத்தை ‘இரண்டு’ என வெளிப்படையாகக் காட்டி, கன்னங்கள் அல்லது தாடையெலும்புகள் எனப் புரிந்துகொள்ளக்கூடிய உடற்பகுதியைத் துல்லியமாகக் குறிக்கிறது.
- source_word: הַקֵּבָה
  choice: இரைப்பை
  rationale: விலங்கின் வயிற்று உறுப்பைக் குறிக்கும் தெளிவான, நவீன தமிழ் உடற்கூறியல் சொல்; மிகத் தொழில்நுட்பமான குறிப்பிட்ட வயிற்றறை என்ற பொருளைத் திணிக்கவில்லை.
