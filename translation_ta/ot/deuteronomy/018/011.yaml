base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/018/011.yaml
  text: or one who binds a spell[a], or one who consults a medium or a spiritist[d][c][b], or one who seeks the dead.
translation:
  language: ta
  text: அல்லது மந்திர உச்சாடனம் செய்கிறவனும்[a], ஆவி ஊடகரிடமும்[b] குறிசொல்பவரிடமும்[c] விசாரிக்கிறவனும், இறந்தவர்களிடம் விசாரிக்கிறவனும்[d] இருக்கக் கூடாது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘மந்திரம் கட்டுகிறவன்’ என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொற்றொடர் சொல்லுக்குச் சொல் ‘பிணைப்பைப் பிணைப்பவன்’ என்ற இடியமாக இருந்து, மந்திர உச்சாடனத்தைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: ‘இறந்தவரின் ஆவியிடம் விசாரிக்கிறவன்’ என்றும் மொழிபெயர்க்கலாம்; எபிரெயச் சொல் ஆவியையோ அதனுடன் தொடர்புகொள்ளும் ஊடகரையோ குறிக்கக்கூடும்.
    reason: lexical_ambiguity
  - marker: c
    text: ‘மறைவான அறிவுடையவன்’ என்றும் மொழிபெயர்க்கலாம். இங்கு ஆவிகளின் மூலம் மறைவான அறிவைப் பெறுவதாகக் கருதப்பட்ட ஒருவகை நபர் குறிக்கப்படுகிறார்.
    reason: lexical_alternative
  - marker: d
    text: ‘இறந்தவர்களிடம் பதில் தேடுகிறவன்’ அல்லது ‘இறந்தவர்களிடம் குறிகேட்கிறவன்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֹבֵר חָבֶר
  choice: மந்திரம் கட்டுகிறவன்
  rationale: ‘கட்டுதல்’ என்ற எபிரெயச் சொல்லுருவை ஓரளவு காத்துக்கொண்டு, மந்திர உச்சாடனத்தால் கட்டுப்படுத்தும் செயலை நவீன தமிழில் சுருக்கமாகத் தெரிவிக்கிறது.
- source_word: שֹׁאֵל אוֹב
  choice: ஆவியூடகரிடம் விசாரிக்கிறவன்
  rationale: אוֹב என்பது இறந்தவரின் ஆவியையோ அதனுடன் தொடர்புடைய ஊடகரையோ குறிக்கக்கூடும். முதன்மை உரையில் நடைமுறையைத் தெளிவாகக் காட்டும் ‘ஆவியூடகர்’ பயன்படுத்தப்பட்டு, மாற்றுப் பொருள் அடிக்குறிப்பில் காக்கப்படுகிறது.
- source_word: יִדְּעֹנִי
  choice: ஆவிகளிடம் குறிகேட்பவன்
  rationale: மறைவான அறிவைப் பெற ஆவிகளுடன் தொடர்புகொள்ளும் occult practitioner என்பதைக் கற்பனை இலக்கியச் சாயலுள்ள சொற்கள் இன்றி இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: דֹרֵשׁ אֶל הַמֵּתִים
  choice: இறந்தவர்களிடம் பதில் தேடுகிறவன்
  rationale: דֹרֵשׁ என்பதன் ‘தேடுதல்/விசாரித்தல்’ பொருளையும், இறந்தவர்களிடமிருந்து அறிவுரை அல்லது பதில் பெற முயலும் சூழலையும் காக்கிறது.
- source_word: וְ
  choice: அல்லது / -உம்
  rationale: முந்தைய வசனத்திலிருந்து தொடரும் தடைப்பட்ட நடைமுறைகளின் பட்டியலைத் தமிழில் இயல்பாக இணைக்கிறது.
theological_decisions:
- issue: பிற்கால நாட்டுப்புற அல்லது கற்பனை இலக்கியக் கருத்துகளைச் சேர்க்காமல் மறைமாந்திரிகச் சொற்களை மொழிபெயர்த்தல்
  choice: மந்திரம் கட்டுகிறவன், ஆவியூடகர், ஆவிகளிடம் குறிகேட்பவன் போன்ற தெளிவான நவீன சொற்களைப் பயன்படுத்துதல்
  alternative: மந்திரவாதி, சூனியக்காரன் போன்ற பரந்த பொருளுள்ள மரபுச் சொற்களைப் பயன்படுத்துதல்
  rationale: எபிரெய உரை வேறுபடுத்திக் காட்டும் குறிப்பிட்ட நடைமுறைகளை ஒன்றாகக் கலக்காமல் காக்கவும், பிற்காலக் கற்பனை அல்லது சமய மரபுகளின் தனிப்பட்ட கருத்துகளை இறக்குமதி செய்யாமல் இருக்கவும் இச்சொற்கள் தேர்ந்தெடுக்கப்பட்டன.
translation_notes:
  register: நவீன நிலையான தமிழில், சட்டவிதிப் பட்டியலின் தொடர்ச்சியை உணர்த்தும் வகையில் அமைக்கப்பட்டுள்ளது. ‘ஆவியூடகர்’ என்பது குறிப்பிட்ட நடைமுறையைக் குறிக்கும் தெளிவான சொல்லாகப் பயன்படுத்தப்பட்டுள்ளது; அரிதான எபிரெயச் சொற்களின் உண்மையான பொருள் நிச்சயமின்மை அடிக்குறிப்புகளில் காக்கப்பட்டுள்ளது.
