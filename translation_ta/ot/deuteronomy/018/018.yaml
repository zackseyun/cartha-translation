source:
  edition: WLC
  text: נָבִ֨יא אָקִ֥ים לָ/הֶ֛ם מִ/קֶּ֥רֶב אֲחֵי/הֶ֖ם כָּמ֑וֹ/ךָ וְ/נָתַתִּ֤י דְבָרַ/י֙ בְּ/פִ֔י/ו וְ/דִבֶּ֣ר אֲלֵי/הֶ֔ם אֵ֖ת כָּל אֲשֶׁ֥ר אֲצַוֶּֽ/נּוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/018/018.yaml
  text: I will raise up for them a prophet like you from among their brothers[a], and I will put my words in his mouth, and he will speak to them all that I command him.
translation:
  language: ta
  text: அவர்களுக்காக, அவர்களுடைய சகோதரர்களின் நடுவிலிருந்து[a] உன்னைப் போன்ற ஒரு தீர்க்கதரிசியை எழுப்புவேன். என் வார்த்தைகளை அவனுடைய வாயில் வைப்பேன்; நான் அவனுக்குக் கட்டளையிடும் அனைத்தையும் அவன் அவர்களிடம் பேசுவான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்களுடைய உறவினரின் நடுவிலிருந்து” அல்லது “அவர்களுடைய சக இஸ்ரயேலரின் நடுவிலிருந்து.” எபிரெயத்தில் சொற்படியாக, “அவர்களுடைய சகோதரர்களின் நடுவிலிருந்து.”
    reason: lexical_alternative
lexical_decisions:
- source_word: נָבִיא
  choice: ஒரு தீர்க்கதரிசி
  rationale: கடவுளின் சார்பாகப் பேசுபவரைக் குறிக்கும் எபிரெயச் சொல்லின் வழக்கமான, தெளிவான தமிழ் மொழிபெயர்ப்பு. இந்த முன்னறிவிப்பு சூழலில் ஒருமை இயல்பாக வெளிப்படுகிறது.
- source_word: אָקִים
  choice: எழும்பச் செய்வேன்
  rationale: קום என்பதன் ஹிஃபில் வடிவம் ஒருவரை எழச் செய்தல் அல்லது ஏற்படுத்துதல் என்ற பொருளைத் தருகிறது. தெய்வீக நியமனத்தை மிகையாக விளக்காமல் மூல உருவகத்தைப் பாதுகாக்கிறது.
- source_word: לָהֶם
  choice: அவர்களுக்காக
  rationale: மக்களுக்கான தெய்வீக ஏற்பாடு அல்லது வழங்குதலை இங்குள்ள ל குறிக்கிறது.
- source_word: מִקֶּרֶב אֲחֵיהֶם
  choice: அவர்களுடைய சகோதரர்களின் நடுவிலிருந்து
  rationale: מִקֶּרֶב என்பதன் ‘நடுவிலிருந்து’ என்ற பொருளையும், אֲחֵיהֶם என்பதன் சொற்படியான ஆண்பால் குடும்ப உறவுச் சொல்லையும் பாதுகாக்கிறது. உடன்படிக்கை மக்களான சக இஸ்ரயேலரைக் குறிக்கும் விரிந்த பயன்பாடு அடிக்குறிப்பில் விளக்கப்படுகிறது.
- source_word: כָּמוֹךָ
  choice: உன்னைப் போன்ற
  rationale: மோசேயுடன் செய்யப்படும் நேரடியான ஒப்பீட்டைச் சுருக்கமாகவும் தெளிவாகவும் தருகிறது.
- source_word: וְנָתַתִּי דְבָרַי בְּפִיו
  choice: என் வார்த்தைகளை அவனுடைய வாயில் வைப்பேன்
  rationale: தீர்க்கதரிசிக்கு இறைவன் உரையை வழங்குவதைச் சித்தரிக்கும் உயிரோட்டமான மூல உருவகத்தை அப்படியே பாதுகாக்கிறது.
- source_word: וְדִבֶּר אֲלֵיהֶם
  choice: அவன் அவர்களிடம் பேசுவான்
  rationale: אֶל என்பதன் திசைநோக்கிய பொருளையும், வாக்குறுதியின் எதிர்காலத் தொடரையும் இயல்பான தமிழில் தருகிறது.
- source_word: אֵת כָּל אֲשֶׁר אֲצַוֶּנּוּ
  choice: நான் அவனுக்குக் கட்டளையிடும் அனைத்தையும்
  rationale: כָּל אֲשֶׁר என்பதன் முழுமையைப் பாதுகாக்கிறது; எதிர்கால வாக்குறுதியின் சட்டகத்துக்குள் எபிரெய நிறைவுறா வினையை இயல்பான தமிழ் சார்பு வினையாக வழங்குகிறது.
theological_decisions:
- issue: வாக்குறுதி அளிக்கப்படும் தீர்க்கதரிசியின் சாத்தியமான மேசியா சார்ந்த தனித்துவம்
  choice: மோசேயைப் போன்ற ‘ஒரு தீர்க்கதரிசி’ என்ற எபிரெய உரையை மட்டும் முதன்மை உரை வைத்திருக்கிறது; அவர் யார் என்பதை வெளிப்படையாக அடையாளப்படுத்தவில்லை.
  alternative: இது தீர்க்கதரிசிகளின் தொடரைக் குறிக்கலாம்; அல்லது மேசியாவில் நிறைவேறும் இறுதிக்காலத் தனிப்பட்ட தீர்க்கதரிசியைக் குறிக்கலாம்.
  rationale: வசனம் தானாகவே அந்த நபரை மேலும் அடையாளப்படுத்தாததால், அதன் உண்மையான விளக்கவியல் மற்றும் இறையியல் திறந்தநிலையை மொழிபெயர்ப்பு பாதுகாக்கிறது.
- issue: אֲחֵיהֶם என்பதன் பொருள்
  choice: அவர்களுடைய சகோதரர்கள்
  alternative: அவர்களுடைய உறவினர்; அவர்களுடைய சக இஸ்ரயேலர்
  rationale: மூலத்தின் ஆண்பால் பன்மை உறவுச் சொல் முதன்மை உரையில் பாதுகாக்கப்படுகிறது. அதன் உடன்படிக்கை-இன உறவுப் பொருள் அடிக்குறிப்பில் தெளிவாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையும் வேதாகம உரைக்கேற்ற கண்ணியமும் கொண்ட நடை பயன்படுத்தப்பட்டுள்ளது. ‘வாயில் வைப்பேன்’ போன்ற மூல உருவகங்கள் தெளிவாக இருப்பதால் பாதுகாக்கப்பட்டுள்ளன; விளக்கவியல் முடிவுகள் முதன்மை உரைக்குள் சேர்க்கப்படவில்லை.
