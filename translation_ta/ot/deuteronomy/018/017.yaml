  text: וַ/יֹּ֥אמֶר יְהוָ֖ה אֵלָ֑/י הֵיטִ֖יבוּ אֲשֶׁ֥ר דִּבֵּֽרוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/018/017.yaml
  text: And Yahweh said to me[a], ‘They have spoken well.’
translation:
  language: ta
  text: அப்போது யாவே என்னிடம், “அவர்கள் சொன்னது நல்லது[a]” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல் சொல்லாக, “அவர்கள் பேசியதை நன்றாகச் செய்தார்கள்.”
    reason: மூல எபிரெய வாக்கிய அமைப்பைச் சுட்டும் நேரடி மொழிபெயர்ப்பு.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: அப்போது ... என்றார்
  rationale: אמר என்பதன் wayyiqtol வடிவம் கதையின் அடுத்த நிகழ்வை அறிமுகப்படுத்துகிறது. நவீன தமிழில் நிகழ்வின் தொடர்ச்சியை இயல்பாகக் காட்ட “அப்போது ... என்றார்” பயன்படுத்தப்பட்டுள்ளது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இது தேவனுடைய தனிப்பெயரான நான்கெழுத்துப் பெயர். பட்டப்பெயரால் மாற்றாமல், அதன் ஒலிபெயர்ப்பான “யாவே” என வழங்கப்பட்டுள்ளது.
- source_word: אֵלָי
  choice: என்னிடம்
  rationale: אֶל என்பதுடன் முதலாம் நபர் ஒருமை பின்னொட்டு சேர்ந்து “என்னிடம்/எனக்கு” என்று பொருள்படுகிறது; உரையாடல் சூழலில் “என்னிடம்” இயல்பானது.
- source_word: הֵיטִיבוּ אֲשֶׁר דִּבֵּרוּ
  choice: அவர்கள் சொன்னது நல்லது
  rationale: சொல்லுக்கு நெருக்கமான அமைப்பு “அவர்கள் பேசியதை நன்றாகச் செய்தார்கள்” என்பதாகும். ஆனால் இங்கு הֵיטִיבוּ அவர்கள் கூறியதன் நேர்மையை மதிப்பிடுவதால், “அவர்கள் சொன்னது நல்லது” என்பது பொருளைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: ஆண்டவர்; யெகோவா
  rationale: மூலவசனம் தனிப்பட்ட இறைப்பெயரையே நேரடியாகப் பயன்படுத்துகிறது. அதனை ஒரு பட்டப்பெயராக மாற்றாமல் “யாவே” என்று ஒலிபெயர்ப்பது மூலத்தின் வேறுபாட்டைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில், சுருக்கமானதும் கண்ணியமானதுமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. மேற்கோள் இயல்பான தமிழாக அமைக்கப்பட்டுள்ளதுடன், எபிரெய மொழியின் நேரடி அமைப்பு அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
