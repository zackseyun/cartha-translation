  to: உன் கடவுளாகிய யாவே உனக்குக் கொடுக்கிற தேசத்திற்குள் நீ செல்லும்போது, அந்த நாடுகளின் அருவருப்பான செயல்களைப் பின்பற்றி நடக்கக் கற்றுக்கொள்ளக் கூடாது.[a]
  rationale: தேசப்பிரவேசத்தின் காலச்சூழல், யாவே என்ற இறைப்பெயர், மற்றும் சட்டப்பூர்வத் தடை ஆகியவை தக்கவைக்கப்பட்டுள்ளன. “அந்த நாடுகள்” மூலத்தின் הַגּוֹיִם என்பதை நேரடியாகக் காட்டுகிறது. “பின்பற்றி நடக்கக் கற்றுக்கொள்ளக் கூடாது” என்பது தேவையற்ற வினைமீட்டலை நீக்கி, כְּ குறிக்கும் ஒப்புமை/ஒத்திசைவு நுணுக்கத்தையும் לֹא תִלְמַד לַעֲשׂוֹת என்ற ‘செய்யக் கற்றுக்கொள்ளாதே’ அமைப்பையும் இயல்பாக வெளிப்படுத்துகிறது.
