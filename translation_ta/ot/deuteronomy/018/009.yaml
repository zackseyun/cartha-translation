  text: כִּ֤י אַתָּה֙ בָּ֣א אֶל הָ/אָ֔רֶץ אֲשֶׁר יְהוָ֥ה אֱלֹהֶ֖י/ךָ נֹתֵ֣ן לָ֑/ךְ לֹֽא תִלְמַ֣ד לַ/עֲשׂ֔וֹת כְּ/תוֹעֲבֹ֖ת הַ/גּוֹיִ֥ם הָ/הֵֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/018/009.yaml
  text: When you come into the land that Yahweh your God is giving you[a], you shall not learn to do according to the abominations of those nations.
translation:
  language: ta
  text: உன் கடவுளாகிய யாவே உனக்குக் கொடுக்கிற தேசத்திற்குள் நீ செல்லும்போது, அந்த நாடுகளின் அருவருப்பான செயல்களைப் பின்பற்றி நடக்கக் கற்றுக்கொள்ளக் கூடாது.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அந்த நாடுகளின் அருவருப்பான செயல்களைப் போலச் செய்ய”; எபிரேய முன்னிடைச்சொல் ஒப்புமையையோ அவற்றிற்கு ஏற்ப நடப்பதையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: செல்லும்போது
  rationale: இங்கு כִּי காரணத்தைக் காட்டாமல், தடை பொருந்தும் காலச் சூழலை அறிமுகப்படுத்துகிறது; எனவே தமிழில் இயல்பான காலவினையெச்சத் தொடர் பயன்படுத்தப்பட்டது.
- source_word: בָּא אֶל־הָאָרֶץ
  choice: தேசத்திற்குள் நீ செல்லும்போது
  rationale: வரவிருக்கும் தேசப்பிரவேசத்தைச் சுட்டும் பங்கேற்புவினையின் பொருளையும், אֶל குறிக்கும் உள்நோக்கிய நகர்வையும் இது இயல்பாக வெளிப்படுத்துகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைப்பட்டத்தால் மாற்றாமல், எபிரேய நான்கெழுத்து இறைப்பெயரைத் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: אֱלֹהֶיךָ
  choice: உன் கடவுளாகிய
  rationale: இரண்டாம் நபர் ஒருமை உடைமையையும், யாவேக்கும் கடவுளுக்கும் உள்ள இணைப்பையும் இயல்பான தமிழில் காட்டுகிறது.
- source_word: נֹתֵן לָךְ
  choice: உனக்குக் கொடுக்கிற
  rationale: எபிரேயப் பங்கேற்புவினையின் நிகழ்கால/உடன்வரவிருக்கும் செயல் நுணுக்கத்தைப் பேணுகிறது.
- source_word: לֹא תִלְמַד לַעֲשׂוֹת
  choice: செய்ய நீ கற்றுக்கொள்ளக் கூடாது
  rationale: எதிர்மறை imperfect-இன் தடையாணை வலிமையையும், ‘கற்றுக்கொள்—செய்’ என்ற மூல வினையமைப்பையும் காக்கிறது.
- source_word: כְּתוֹעֲבֹת
  choice: அருவருப்பான செயல்களைப் பின்பற்றி
  rationale: כְ குறிக்கும் ஒப்புமை அல்லது நடைமுறை ஒத்திசைவை ‘பின்பற்றி’ வெளிப்படுத்துகிறது; תּוֹעֵבָה-வின் வலுவான அற-சமயக் கண்டனத்தை ‘அருவருப்பான’ காக்கிறது. சூழலில் குறிப்பிட்ட பழக்கங்கள் நோக்கப்படுவதால் ‘செயல்கள்’ சேர்க்கப்பட்டுள்ளது.
- source_word: הַגּוֹיִם הָהֵם
  choice: அந்த மக்களினங்களின்
  rationale: גּוֹיִם இங்கு தேசங்களின் மக்களையும் அவர்களுடைய பழக்கங்களையும் குறிக்கிறது; ‘மக்களினங்கள்’ தமிழில் இந்தக் கூட்டுப்பொருளைத் தெளிவாகத் தருகிறது, ‘அந்த’ தொலைச்சுட்டை காக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலத்தில் தனிப்பட்ட உடன்படிக்கைப் பெயர் நேரடியாக இருப்பதால், அதை ஒரு பட்டத்தால் மாற்றாமல் ஒலிபெயர்க்கப்பட்டது.
- issue: תּוֹעֵבָה என்பதன் கண்டன வலிமை
  choice: அருவருப்பான செயல்கள்
  alternative: வெறுக்கத்தக்க பழக்கங்கள் / அருவருப்புகள்
  rationale: இச்சொல்லின் வலுவான அற-சமயக் கண்டனத்தைப் பேணியபடியே, அடுத்த வசனங்களில் பட்டியலிடப்படும் நடைமுறைகளை நவீன தமிழில் இயல்பாகக் குறிக்கிறது.
- issue: כְ முன்னிடைச்சொல்லின் பொருள்
  choice: பின்பற்றிச் செய்ய
  alternative: அருவருப்பான செயல்களைப் போலச் செய்ய
  rationale: முன்னிடைச்சொல் ஒப்புமையையோ நடைமுறை ஒத்திசைவையோ குறிக்கலாம். முதன்மை உரை பின்பற்றுதலை இயல்பாக வெளிப்படுத்துகிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன தரத் தமிழ்; பொதுவாசகர்களுக்குப் புரியும் வகையில் இயல்பானதாயும், சட்டப்பகுதிக்கேற்ற கண்ணியமான தடைநடையுடனும் அமைக்கப்பட்டது. ஒருமை ‘நீ/உன்’ மூலத்தின் இரண்டாம் நபர் ஒருமையைப் பேணுகிறது.
