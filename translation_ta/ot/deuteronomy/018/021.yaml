  text: וְ/כִ֥י תֹאמַ֖ר בִּ/לְבָבֶ֑/ךָ אֵיכָה֙ נֵדַ֣ע אֶת הַ/דָּבָ֔ר אֲשֶׁ֥ר לֹא דִבְּר֖/וֹ יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/018/021.yaml
  text: And if you say in your heart[a], ‘How shall we know the word that Yahweh has not spoken?’
translation:
  language: ta
  text: உன் உள்ளத்தில், “யாவே சொல்லாத வார்த்தை எது என்று நாம் எப்படி அறிவோம்?” என்று நீ சொன்னால்,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְכִי
  choice: என்று நீ கேட்டால்
  rationale: வாவ் மற்றும் כִּי இணைந்து முந்தைய சூழலுடன் தொடர்புடைய நிபந்தனைக்குரிய கேள்வியை அறிமுகப்படுத்துகின்றன. தமிழில் இயல்பான வாக்கிய அமைப்புக்காக நிபந்தனை இறுதியில் வைக்கப்பட்டது.
- source_word: תֹאמַר
  choice: நீ கேட்டால்
  rationale: சொற்பொருளில் ‘நீ சொன்னால்’ என்றாலும், தொடர்ந்து வரும் நேரடிக் கேள்வியை மனத்தில் எழுப்புவதைக் குறிக்கும் இச்சூழலில் ‘நீ கேட்டால்’ என்பது இயல்பாகவும் பொருளுக்கு உண்மையாகவும் உள்ளது.
- source_word: בִּלְבָבֶךָ
  choice: உன் உள்ளத்தில்
  rationale: எண்ணத்தின் இருப்பிடமாக ‘இதயம்/உள்ளம்’ என்பதைக் காட்டும் எபிரெய உருவகத்தைப் பாதுகாக்கிறது; நவீனத் தமிழில் ‘உள்ளத்தில்’ இயல்பானது.
- source_word: אֵיכָה
  choice: எப்படி
  rationale: அறிவதற்கான முறையை விசாரிக்கும் கேள்வியை நேரடியாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: נֵדַע
  choice: நாம் அறிந்துகொள்வோம்
  rationale: ידע என்பதன் பொதுவான பொருளான ‘அறிதல்’ பாதுகாக்கப்படுகிறது; இங்கு அடையாளம் காணும் செயல்முறையையும் ‘அறிந்துகொள்வோம்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: הַדָּבָר
  choice: வார்த்தை
  rationale: தீர்க்கதரிசனச் சூழலில் דָּבָר என்பது கூறப்பட்ட இறைச்செய்தி அல்லது உரையைக் குறிக்கிறது. ‘வார்த்தை’ அந்தச் சூழலை நன்கு பிரதிபலிக்கிறது; பரந்த மாற்றுப் பொருள்கள் அடிக்குறிப்பில் தரப்பட்டுள்ளன.
- source_word: אֲשֶׁר לֹא דִבְּרוֹ
  choice: சொல்லாத
  rationale: யெகோவா அந்த வார்த்தையின் மூலமல்ல என்பதைக் குறிக்கும் எதிர்மறை சார்பு வாக்கியத்தைச் சுருக்கமாகவும் தெளிவாகவும் தருகிறது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: இறைப்பெயரான நான்கு எழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் பரவலாக அறியப்பட்ட ‘யெகோவா’ என்ற ஒலிபெயர்ப்பில் வழங்குகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யெகோவா
  alternative: யாவே
  rationale: மூலத்தில் உள்ள தனிப்பட்ட இறைப்பெயரை ‘கர்த்தர்’ போன்ற பட்டமாக மாற்றாமல் ஒலிபெயர்க்கப்பட்டது. ‘யாவே’ என்பது மாற்று ஒலிப்புமுறை; ‘யெகோவா’ நவீன தமிழ் வேதாகமப் பயன்பாட்டில் பரவலாக அடையாளம் காணப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதைமிக்க ஆனால் பொதுவாசகருக்கு எளிதில் புரியும் நடையில் மொழிபெயர்க்கப்பட்டது. எபிரெய வாக்கியத்தின் ‘உள்ளத்தில்’ என்ற உருவகம் பாதுகாக்கப்பட்டுள்ளது; தமிழின் இயல்பான நிபந்தனை வாக்கிய வரிசை பயன்படுத்தப்பட்டுள்ளது.
