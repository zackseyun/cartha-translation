base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/018/006.yaml
  text: And if the Levite comes from one of your gates out of all Israel[a], where he is residing, and comes with all the desire of his soul to the place that Yahweh will choose[b],
translation:
  language: ta
  text: இஸ்ரயேல் முழுவதிலும் உள்ள உன் நகரங்களில்[a] ஏதாவது ஒன்றில் தங்கியிருக்கும் ஒரு லேவியன் அங்கிருந்து வந்து, தன் முழு விருப்பத்தோடும்[b] யாவே தேர்ந்தெடுக்கும் இடத்துக்கு வந்தால்,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லுக்குச் சொல், “உன் வாசல்களில் ஒன்றிலிருந்து.” இங்கு “வாசல்கள்” என்பது ஒரு நகரத்தையோ குடியிருப்பையோ ஆகுபெயராகக் குறிக்கிறது.
    reason: cultural_note
  - marker: b
    text: அல்லது, “தன் ஆத்துமாவின் முழு விருப்பத்தோடும்”; “தன் உள்ளத்தின் முழு ஏக்கத்தோடும்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  choice: வந்தால்
  rationale: முந்தைய சட்டத்துடன் தொடர்புடைய நிபந்தனை வழக்கைத் தொடங்குகிறது; தமிழில் வாக்கிய இறுதியிலுள்ள ‘வந்தால்’ இயல்பாக நிபந்தனைத் தெரிவிக்கிறது.
- source_word: הַלֵּוִי
  choice: ஒரு லேவியன்
  rationale: எபிரெயத்தில் உருபு இருந்தாலும், இங்கு ஒரு பொதுவான சட்ட வழக்கின் பிரதிநிதியைச் சுட்டுவதால் நவீன தமிழில் ‘ஒரு லேவியன்’ தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: מֵאַחַד שְׁעָרֶיךָ
  choice: உன் நகரங்களில் ஒன்றிலிருந்து
  rationale: சொல்லுக்குச் சொல் ‘உன் வாசல்களில் ஒன்றிலிருந்து’; இங்கு ‘வாசல்கள்’ என்பது நகரங்களை ஆகுபெயராகக் குறிக்கிறது. பொருளை முதன்மை உரையில் இயல்பாகத் தருகிறது.
- source_word: מִכָּל יִשְׂרָאֵל
  choice: இஸ்ரயேல் முழுவதிலும்
  rationale: இஸ்ரயேலின் எந்தப் பகுதியிலிருந்தும் வரலாம் என்ற பரவலான பொருளைத் தருகிறது.
- source_word: אֲשֶׁר הוּא גָּר שָׁם
  choice: அவன் தங்கியிருக்கிற
  rationale: גור என்பது நிரந்தர நிலவுடைமையின்றி வசித்தல் அல்லது தங்கியிருத்தல் என்ற நுணுக்கம் உடையது; ‘தங்கியிருக்கிற’ அதை மிகைப்படுத்தாமல் காக்கிறது.
- source_word: וּבָא
  choice: வந்து … வந்தால்
  rationale: 'மூலத்தில் יָבֹא / וּבָא என வரும் வினைச்சொல் மீளுரைப்பைத் தமிழிலும் காக்கிறது: அவன் தன் நகரிலிருந்து வந்து, தேர்ந்தெடுக்கப்பட்ட இடத்துக்கு வந்தால்.'
- source_word: בְּכָל אַוַּת נַפְשׁוֹ
  choice: தன் உள்ளத்தின் முழு ஏக்கத்தோடும்
  rationale: אַוַּת என்பது ஆவல் அல்லது ஏக்கம்; נֶפֶשׁ முழு உள்ளார்ந்த நபரைச் சுட்டுகிறது. இந்தத் தேர்வு முழுமையான தனிப்பட்ட ஏக்கத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: אֶל הַמָּקוֹם
  choice: இடத்துக்கு
  rationale: மூலம் ‘இடம்’ என்றே கூறுகிறது; ‘ஆலயம்’ அல்லது ‘வழிபாட்டு இடம்’ என்று விளக்கத்தை முதன்மை உரையில் சேர்க்கவில்லை.
- source_word: אֲשֶׁר יִבְחַר יְהוָה
  choice: யெகோவா தேர்ந்தெடுக்கும்
  rationale: இறைபெயரை நேரடியாக ஒலிபெயர்க்கிறது; imperfect வடிவத்தை இந்தத் தொடர்ச்சியான உபாகமச் சூத்திரத்தில் இயல்பான எதிர்நோக்குப் பொருளுடன் ‘தேர்ந்தெடுக்கும்’ என வழங்குகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைபெயரின் மொழிபெயர்ப்பு
  choice: யெகோவா
  alternative: கர்த்தர்; யாவே
  rationale: மூலத்தில் நான்கெழுத்து இறைபெயர் நேரடியாக உள்ளது. பட்டப்பெயராக மாற்றாமல், தமிழ்க் கிறிஸ்தவ வாசகர்களுக்குப் பரவலாக அறிமுகமான ‘யெகோவா’ என்ற வடிவில் பெயராகவே காக்கப்படுகிறது.
- issue: ‘அந்த இடம்’ என்பதன் அடையாளம்
  choice: இடம்
  alternative: வழிபாட்டு இடம்; பரிசுத்த ஸ்தலம்
  rationale: சூழலில் மைய வழிபாட்டுத் தலம் குறிக்கப்பட்டாலும், எபிரெய உரை இவ்வசனத்தில் வெறுமனே ‘இடம்’ என்கிறது; ஆகவே விளக்கமான அடையாளத்தை முதன்மை உரையில் சேர்க்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழ்; சட்டவியல் நிபந்தனை அமைப்பை இயல்பான தமிழ் சொல்வரிசையில் வழங்குகிறது. ‘லேவியன்’, ‘யெகோவா’ ஆகியவை மரியாதைமிக்க வேதாகமச் சொல்லாட்சியாக வைக்கப்பட்டுள்ளன; தேவையற்ற தொன்மையான வினைவடிவங்கள் தவிர்க்கப்பட்டுள்ளன.
