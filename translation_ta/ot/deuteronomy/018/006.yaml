revisions:
- from: இஸ்ரயேல் முழுவதிலும், அவன் தங்கியிருக்கிற உன் நகரங்களில் ஒன்றிலிருந்து ஒரு லேவியன் வந்து[a], தன் உள்ளத்தின் முழு ஏக்கத்தோடும் யெகோவா தேர்ந்தெடுக்கும் இடத்துக்கு வந்தால்[b],
  to: இஸ்ரயேல் முழுவதிலும் உள்ள உன் நகரங்களில்[a] ஏதாவது ஒன்றில் தங்கியிருக்கும் ஒரு லேவியன் அங்கிருந்து வந்து, தன் முழு விருப்பத்தோடும்[b] யாவே தேர்ந்தெடுக்கும் இடத்துக்கு வந்தால்,
