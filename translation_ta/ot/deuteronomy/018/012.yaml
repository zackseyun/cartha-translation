  text: כִּֽי תוֹעֲבַ֥ת יְהוָ֖ה כָּל עֹ֣שֵׂה אֵ֑לֶּה וּ/בִ/גְלַל֙ הַ/תּוֹעֵבֹ֣ת הָ/אֵ֔לֶּה יְהוָ֣ה אֱלֹהֶ֔י/ךָ מוֹרִ֥ישׁ אוֹתָ֖/ם מִ/פָּנֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/018/012.yaml
  text: For everyone who does these things is an abomination to Yahweh[a], and because of these abominations Yahweh your God is driving them out before you.
translation:
  language: ta
  text: ஏனெனில், இவற்றைச் செய்கிற ஒவ்வொருவரும் யாவேக்கு அருவருப்பானவர்; இந்த அருவருப்பான செயல்களின் காரணமாக, உன் கடவுளாகிய யாவே அவர்களை உன் முன்னிலையிலிருந்து துரத்திவிடுகிறார்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அவர்களுடைய நிலவுடைமையைப் பறிக்கிறார்.’ எபிரெய வினைச்சொல், அவர்களைத் துரத்துவதோடு, அந்தத் தேசங்கள் நிலத்தின் உடைமையை இழக்கச் செய்வதையும் வலியுறுத்தலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: காரண விளக்கத்தைத் தனியாகச் சொல்லாமல், தொடரின் பொருளில் வெளிப்படுத்தப்பட்டது
  rationale: இது முந்தைய தடைகளுக்கான காரணத்தை அறிமுகப்படுத்துகிறது. தமிழில் வசனத்தை இயல்பாகத் தொடங்குவதற்காக தனி இணைப்புச்சொல் தவிர்க்கப்பட்டது.
- source_word: תוֹעֲבַת יְהוָה
  choice: யாவேக்கு அருவருப்பானவர்
  rationale: யாவேயின் பார்வையில் கடுமையாக வெறுக்கத்தக்கவர் என்ற மூலமொழியின் வலுவான ஒழுக்க மற்றும் உடன்படிக்கைச் சார்ந்த பொருளைப் பேணுகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: திருநாம எழுத்துகளான יהוה-ஐ பொதுவாக ஏற்றுக்கொள்ளப்பட்ட தமிழ் ஒலிபெயர்ப்பில் நேரடியாகக் கொடுக்கிறது.
- source_word: כָּל עֹשֵׂה אֵלֶּה
  choice: இவற்றைச் செய்கிற ஒவ்வொருவரும்
  rationale: இந்தச் செயல்களைப் பழக்கமாகச் செய்யும் எவரையும் உள்ளடக்கும் எபிரெய உலகளாவிய குறிப்பைப் பேணுகிறது.
- source_word: וּבִגְלַל הַתּוֹעֵבֹת הָאֵלֶּה
  choice: இந்த அருவருப்பான செயல்களின் காரணமாகவே
  rationale: தீர்ப்புக்கான காரணத்தைத் தெளிவாகக் காட்டுகிறது; ‘செயல்கள்’ என்பது முந்தைய வசனங்களில் தடைசெய்யப்பட்ட நடைமுறைகளைக் குறிக்கிறது.
- source_word: אֱלֹהֶיךָ
  choice: உன் கடவுளாகிய
  rationale: இஸ்ரவேலை ஒருமையில் நேரடியாக அழைக்கும் இரண்டாம் நபர் ஒருமை வடிவத்தைப் பேணுகிறது.
- source_word: מוֹרִישׁ אוֹתָם
  choice: அவர்களை ... துரத்திவிடுகிறார்
  rationale: ירש என்பதன் ஹிஃபில் வடிவம் தேசங்களை நிலத்திலிருந்து அகற்றுவதையோ அவர்களுடைய உடைமையை இழக்கச் செய்வதையோ குறிக்கலாம்; முதன்மை உரையில் இயல்பான தமிழ் பயன்படுத்தப்பட்டது.
- source_word: מִפָּנֶיךָ
  choice: உன் முன்னிலையிலிருந்து
  rationale: ‘உன் முகத்திற்கு முன்பிருந்து’ என்ற சொற்பொருளை வெற்றிகொள்ளல் சூழலுக்கேற்ற இயல்பான தமிழில் தருகிறது.
theological_decisions:
- issue: יהוה என்ற இறைநாமத்தை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: வசனம் உடன்படிக்கையின் தனிப்பட்ட இறைநாமத்தை நேரடியாகப் பயன்படுத்துவதால், பட்டப்பெயராக மாற்றாமல் ஒலிபெயர்க்கப்பட்டது.
- issue: תוֹעֵבָה என்பது செய்பவரையா செயல்களையா குறிக்கிறது
  choice: முதல் வாக்கியத்தில் செய்பவர் யாவேக்கு அருவருப்பானவர்; இரண்டாவது வாக்கியத்தில் செயல்கள் அருவருப்பானவை
  alternative: இரு இடங்களிலும் ‘அருவருப்பான செயல்கள்’ என்று மட்டும் மொழிபெயர்த்தல்
  rationale: மூலத்தில் ஒருமைச் சொற்றொடர் ‘இவற்றைச் செய்கிற ஒவ்வொருவரையும்’ இலக்கண ரீதியாகச் சுட்டுகிறது; பன்மை வடிவம் முந்தைய நடைமுறைகளைக் குறிக்கிறது. இந்த வேறுபாடு ஒழிக்கப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையும் தெளிவும் கொண்ட நடை பயன்படுத்தப்பட்டது. எபிரெய இரண்டாம் நபர் ஒருமையைப் பேண ‘உன்’ பயன்படுத்தப்பட்டுள்ளது. அடிக்குறிப்பு குறி, அது விளக்கும் ‘துரத்திவிடுகிறார்’ என்பதற்குப் பின்னர் வைக்கப்பட்டுள்ளது.
