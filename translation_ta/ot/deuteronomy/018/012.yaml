revisions:
- from: இவற்றைச் செய்கிற ஒவ்வொருவரும் யாவேக்கு அருவருப்பானவர். இந்த அருவருப்பான செயல்களின் காரணமாகவே, உன் கடவுளாகிய யாவே அவர்களை உன் முன்னிலையிலிருந்து துரத்திவிடுகிறார்[a].
  to: ஏனெனில், இவற்றைச் செய்கிற ஒவ்வொருவரும் யாவேக்கு அருவருப்பானவர்; இந்த அருவருப்பான செயல்களின் காரணமாக, உன் கடவுளாகிய யாவே அவர்களை உன் முன்னிலையிலிருந்து துரத்திவிடுகிறார்[a].
  rationale: The revision adds ‘ஏனெனில்’ to express כִּי’s explanatory force. The remaining wording is retained because it faithfully and naturally conveys the Hebrew, including the person-focused singular ‘abomination’ in the first clause, the plural reference to the prohibited practices in the second, and the dispossession/driving-out ambiguity supported by the footnote.
