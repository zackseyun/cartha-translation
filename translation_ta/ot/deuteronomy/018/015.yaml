base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/018/015.yaml
  text: Yahweh your God will raise up for you a prophet like me from among you[a], from your brothers[b]; you must listen to him.
translation:
  language: ta
  text: 'உபாகமம் 18:15


    “உன் கடவுளாகிய ஆண்டவர், உன் நடுவிலிருந்து—உன் சகோதரர்களிலிருந்து[a]—என்னைப் போன்ற ஓர் இறைவாக்கினரை[b] உனக்காக எழுப்புவார். நீங்கள்[c] அவருக்குச் செவிகொடுக்க வேண்டும்.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘உன் நடுவிலிருந்து, உன் சக இஸ்ரவேலர்களிலிருந்து’ என்றும் மொழிபெயர்க்கலாம். இங்கு ‘சகோதரர்கள்’ என்று மொழிபெயர்க்கப்பட்டுள்ள எபிரெய ஆண்பால் உறவுமுறைச் சொல், பொதுவாக இஸ்ரவேல் மக்களைச் சேர்ந்தவர்களைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: புதிய ஏற்பாட்டில் இவ்வசனம் மேசியாவுக்குப் பொருத்திக் கூறப்படுகிறது. எனினும் இங்குள்ள எபிரெய உரை நேரடியாக ‘என்னைப் போன்ற ஓர் இறைவாக்கினர்’ என்றே கூறுகிறது.
    reason: cross_reference
  - marker: c
    text: இவ்வசனத்தின் தொடக்கத்தில் மோசே இஸ்ரவேலை ஒருமையில் (‘உன்’, ‘உனக்காக’) அழைக்கிறார்; இறுதிக் கட்டளை எபிரெயத்தில் பன்மையில் (‘நீங்கள்’) உள்ளது.
    reason: grammar
lexical_decisions:
- source_word: נָבִיא
  choice: ஓர் இறைவாக்கினர்
  rationale: கடவுளின் சார்பில் செய்தியை அறிவிப்பவரைக் குறிக்கும் எபிரெயச் சொல்லின் ஒருமையைப் பாதுகாக்கிறது. ‘தீர்க்கதரிசி’ என்பதைக் காட்டிலும், எதிர்காலத்தை முன்னறிவிப்பவர் என்ற குறுகிய பொருளைத் தவிர்த்து, சொல்லின் விரிவான பணியை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: מִקִּרְבְּךָ
  choice: உன் நடுவிலிருந்து
  rationale: ‘உன் மத்தியிலிருந்து’ என்ற மூல உருவகத்தை இயல்பான தமிழில் காத்து, இறைவாக்கினர் இஸ்ரவேலுக்கு வெளியிலிருந்து அல்லாமல் அதன் மக்களிடமிருந்தே எழுவார் என்பதைக் காட்டுகிறது.
- source_word: מֵאַחֶיךָ
  choice: உன் சகோதரர்களிலிருந்து
  rationale: எபிரெயத்தின் ஆண்பால் பன்மை உறவுமுறைச் சொல்லை நேரடியாகப் பாதுகாக்கிறது; இச்சூழலில் அது சக இஸ்ரவேலர்களைக் பொதுவாகக் குறிக்கிறது என்பதை அடிக்குறிப்பு விளக்குகிறது.
- source_word: כָּמֹנִי
  choice: என்னைப் போன்ற
  rationale: மோசேயுடன் செய்யப்படும் நேரடியான ஒப்பீட்டைத் தெளிவாகவும் மிகைப்படுத்தாமலும் வழங்குகிறது.
- source_word: יָקִים לְךָ
  choice: உனக்காக எழுப்புவார்
  rationale: קום என்பதன் காரணவினை வடிவிலுள்ள ‘எழுப்புதல்/தோன்றச் செய்தல்’ என்ற உருவகத்தையும், לְךָ என்பதன் பயனாளிப் பொருளையும் பாதுகாக்கிறது.
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: உன் கடவுளாகிய ஆண்டவர்
  rationale: திருப்பெயரான יהוה என்பதை ‘ஆண்டவர்’ என்றும், உடன்படிக்கைச் சொற்றொடரை இயல்பான தமிழில் ‘உன் கடவுளாகிய ஆண்டவர்’ என்றும் வழங்குகிறது.
- source_word: אֵלָיו
  choice: அவருக்கு
  rationale: எபிரெயத்தில் உள்ள முன்னிடைச்சொல்லின் திசைப் பொருளைப் பாதுகாத்து, தமிழில் இயல்பான ‘அவருக்குச் செவிகொடு’ என்ற தொடரை உருவாக்குகிறது.
- source_word: תִּשְׁמָעוּן
  choice: நீங்கள் அவருக்குச் செவிகொடுக்க வேண்டும்
  rationale: שׁמע என்பதன் ‘கேள்/கவனித்துக் கேள்/செவிகொடு’ என்ற பொருளையும் கட்டளையின் வலிமையையும் தெரிவிக்கிறது; பிரதான உரையிலேயே ‘கீழ்ப்படிய வேண்டும்’ என்று பொருளை மேலும் குறுக்கவில்லை. வினையின் பன்மையும் வெளிப்படையாகப் பாதுகாக்கப்பட்டுள்ளது.
theological_decisions:
- issue: ‘என்னைப் போன்ற ஓர் இறைவாக்கினர்’ என்பது குறிப்பாக மேசியாவையே குறிக்கிறதா?
  choice: பிரதான உரையில் எபிரெயத்தின் வரையறுக்கப்படாத ஒருமைச் சொற்றொடரான ‘என்னைப் போன்ற ஓர் இறைவாக்கினர்’ என்பதே வைக்கப்பட்டுள்ளது.
  alternative: ‘அந்த இறைவாக்கினர்’ அல்லது வெளிப்படையாக ‘மேசியா’ என்று மொழிபெயர்த்தல்; அல்லது இதை இறைவாக்கினர் அமைப்பை மட்டும் குறிக்கும் கூட்டுப் பொருளாக வழங்குதல்.
  rationale: எபிரெய வசனம் தானாகவே பின்னாளைய கிறிஸ்தவ அடையாளப்படுத்தலைச் சொற்களில் வெளிப்படுத்தவில்லை. ஆகவே உடனடி சொற்பொருள் பாதுகாக்கப்பட்டு, புதிய ஏற்பாட்டின் மேசியத் தொடர்பு அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
- issue: אָח (‘சகோதரர்கள்’) என்பதன் பிரதிநிதித்துவப் பொருள்
  choice: மூலத்தின் ஆண்பால் உறவுமுறை வடிவை ‘சகோதரர்கள்’ என்று பிரதான உரையில் காத்து, அது சக இஸ்ரவேலர்களைக் குறிக்கிறது என்று அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது.
  alternative: ‘சக இஸ்ரவேலர்கள்’, ‘உன் இனத்தார்’ அல்லது ‘சகோதர சகோதரிகள்’.
  rationale: இவ்வாறு செய்வது எபிரெய வடிவை மறைக்காமல் அதன் சமூகப் பொருளையும் வாசகருக்குத் தெளிவாக்குகிறது.
- issue: ஒருமை அழைப்பிலிருந்து பன்மைக் கட்டளைக்கான மாற்றம்
  choice: ‘உன்/உனக்காக’ என்ற ஒருமையையும் ‘நீங்கள்’ என்ற பன்மையையும் பிரதான உரையில் அப்படியே காட்டுதல்.
  alternative: தமிழில் முழுவதையும் ஒருமையாகவோ பன்மையாகவோ ஒத்திசைத்தல்.
  rationale: எபிரெயத்தின் எண்ணிக்கை மாற்றம் இஸ்ரவேலை ஒரே சமூகமாக அழைப்பதற்கும் அதன் உறுப்பினர்களைத் தொகுதியாகக் கட்டளையிடுவதற்கும் இடையிலான சொல்லாட்சித் தன்மையை வெளிப்படுத்தக்கூடும்; அதை அமைதியாகச் சீராக்காமல் பாதுகாப்பது பொருத்தமானது.
translation_notes:
  register: நவீனத் தரத்தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. ‘இறைவாக்கினர்’, ‘செவிகொடுக்க வேண்டும்’ ஆகிய சொற்கள் மூலத்தின் அர்த்த வரம்பை மிகையாகச் சுருக்காமல் தெரிவிக்கின்றன. நீண்ட இடைச்சொற்றொடரை தெளிவுபடுத்த நீள்கோடுகள் பயன்படுத்தப்பட்டுள்ளன.
