base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/018/019.yaml
  text: And the man who does not listen to my words that he speaks in my name—I myself will require it from him[a].
translation:
  language: ta
  text: என் பெயரில் அவன் பேசும் என் வார்த்தைகளுக்குச் செவிகொடுக்காத மனிதனிடம் நானே கணக்குக் கேட்பேன்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் நேரடியாக, “அவனிடமிருந்து நான் கோருவேன்” என்று உள்ளது; கோரப்படுவது என்ன என்பது சூழலால் உணர்த்தப்படுகிறது. அதாவது, தீர்க்கதரிசியின் வாயிலாகப் பேசப்படும் கடவுளின் வார்த்தைகளுக்குச் செவிகொடுக்க மறுப்பதற்காக அவனைப் பொறுப்புக்குள்ளாக்குவேன்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: (தனி இணைப்புச் சொல் இல்லாமல் விளைவு வாக்கியமாக அமைத்தல்)
  rationale: இது முந்தைய வாக்குறுதியின் விளைவை அறிமுகப்படுத்துகிறது. தமிழில் வாக்கிய அமைப்பே அந்தத் தொடர்பை இயல்பாக உணர்த்துவதால், தேவையற்ற ‘அப்பொழுது’ அல்லது ‘மேலும்’ சேர்க்கப்படவில்லை.
- source_word: הָאִישׁ
  choice: மனிதனை
  rationale: எபிரெயச் சொல் ஒருமை ஆண்பால் வடிவில் பொதுப்பிரதிநிதித்துவப் பொருளில் வருகிறது. ‘மனிதன்’ என்பது மூல வடிவை நெருக்கமாகப் பேணுகிறது.
- source_word: לֹא יִשְׁמַע אֶל
  choice: செவிகொடுக்காத
  rationale: இந்தச் சூழலில் வினைச்சொல் கேட்டல் மட்டுமல்லாமல் கவனித்து ஏற்றுக்கொள்ளும் பொருளையும் கொண்டுள்ளது. ‘செவிகொடுக்காத’ என்பது ‘கேட்காத’ என்பதைவிட அந்த மறுமொழி நுணுக்கத்தைத் தெளிவாகக் காட்டுகிறது; ‘கீழ்ப்படியாத’ என்று முழுமையாகத் தீர்மானிப்பதையும் தவிர்க்கிறது.
- source_word: דְּבָרַי
  choice: என் வார்த்தைகளுக்கு
  rationale: மூலத்தில் உள்ள பன்மையையும் நேரடியான தெய்வீக உரிமையையும் பேணுகிறது.
- source_word: אֲשֶׁר יְדַבֵּר
  choice: அவன் பேசும்
  rationale: முன் வசனத்தில் குறிப்பிடப்பட்ட தீர்க்கதரிசி பேசுவதைச் சுட்டுகிறது; தமிழில் பொதுவான எதிர்காலச் செயலை நிகழ்கால உறவெச்சம் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: בִּשְׁמִי
  choice: என் பெயரில்
  rationale: மூல மொழியின் நேரடிப் பழமொழியைப் பேணி, கடவுளின் அதிகாரத்தின் பேரில் பேசுதல் என்ற கருத்தையும் கொண்டுள்ளது.
- source_word: אָנֹכִי
  choice: நானே
  rationale: தனி முதலாம் நபர் சுட்டுப்பெயரின் வலியுறுத்தலைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: אֶדְרֹשׁ מֵעִמּוֹ
  choice: அவனைக் கணக்குக் கேட்பேன்
  rationale: இந்தச் சூழலில் דרשׁ உடன் வரும் முன்னிடைச்சொல் தெய்வீகப் பொறுப்புக்கூறலைக் குறிக்கிறது. ‘கணக்குக் கேட்பேன்’ என்பது இயல்பான நவீன தமிழில் நீதித்துறை சார்ந்த தீவிரத்தைக் காட்டுகிறது; தண்டனையின் குறிப்பிட்ட வடிவத்தைச் சேர்ப்பதில்லை.
theological_decisions:
- issue: தீர்க்கதரிசியின் வாயிலாக வரும் கடவுளின் வார்த்தைகளை மறுப்பதற்கான தெய்வீகப் பதில்
  choice: நானே கணக்குக் கேட்பேன்
  alternative: அவனிடமிருந்து அதைக் கேட்பேன்
  rationale: எபிரெயம் பொறுப்புக்கூறலையும் நியாயத்தீர்ப்பையும் உணர்த்துகிறது; ஆனால் தண்டனையின் முறை என்ன என்பதைத் தெளிவுபடுத்தவில்லை. முதன்மை மொழிபெயர்ப்பு அந்த எச்சரிக்கையை இயல்பான தமிழில் வெளிப்படுத்தி, குறிப்பிடப்படாத தண்டனையை இறக்குமதி செய்யவில்லை.
translation_notes:
  register: நவீன தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் வேதவாக்கியத்துக்குரிய கண்ணியத்துடனும் வடிவமைக்கப்பட்டது. ‘செவிகொடுக்காத’ என்பது கேட்டல்–ஏற்றுக்கொள்ளுதல் என்ற இரட்டை நுணுக்கத்தைப் பேணுகிறது; ‘கணக்குக் கேட்பேன்’ என்பது தெளிவான தமிழை வழங்கும்போது மூலத்தின் தெய்வீகப் பொறுப்புக்கூறலைக் காக்கிறது.
