translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதாகவும் வேதாகம அறிவிப்பு நடைக்கேற்ற கண்ணியத்துடனும் வடிவமைக்கப்பட்டது. ‘எடுத்துக்கொள்’ என்ற எபிரெய மணமுறை மரபுத்தொடரை அப்படியே இயல்பற்ற தமிழில் இடாமல், ‘மனைவியாக ஏற்றுக்கொள்’ என மொழிபெயர்த்து அதன் மாற்றுப் பொருளை அடிக்குறிப்பில் விளக்கியுள்ளது.
