source:
  edition: WLC
  text: וּ/מִֽי הָ/אִ֞ישׁ אֲשֶׁר אֵרַ֤שׂ אִשָּׁה֙ וְ/לֹ֣א לְקָחָ֔/הּ יֵלֵ֖ךְ וְ/יָשֹׁ֣ב לְ/בֵית֑/וֹ פֶּן יָמוּת֙ בַּ/מִּלְחָמָ֔ה וְ/אִ֥ישׁ אַחֵ֖ר יִקָּחֶֽ/נָּה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/020/007.yaml
  text: And who is the man who has become engaged to a woman and has not taken her? Let him go and return to his house[c][b][a], lest he die in the battle and another man take her.
translation:
  language: ta
  text: ஒரு பெண்ணை மணம் நிச்சயித்துக்கொண்டு, இன்னும் அவளை மனைவியாக ஏற்றுக்கொள்ளாதவன் எவன்? அவன் புறப்பட்டுத் தன் வீட்டுக்குத் திரும்பட்டும்; அவன் போரில் இறந்துவிடவும், வேறொருவன் அவளை மனைவியாக ஏற்றுக்கொள்ளவும் நேராதபடி.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּמִי הָאִישׁ
  choice: எவன்?
  rationale: அடுத்ததாகப் போரிலிருந்து விலக்கு பெறும் ஆணை வினா வடிவில் அறிமுகப்படுத்தும் எபிரெயச் சொற்றொடரின் ஆண்பால் ஒருமையையும் அறிவிப்பு நடையையும் காக்கிறது.
- source_word: אֵרַשׂ אִשָּׁה
  choice: ஒரு பெண்ணுடன் திருமணம் நிச்சயிக்கப்பட்டும்
  rationale: முழுமையான திருமண வாழ்வு தொடங்குவதற்கு முந்தைய முறையான மணஉறுதியை நவீனத் தமிழில் இயல்பாகக் குறிக்கிறது; தொழில்நுட்பமான ‘மணஒப்பந்தம்’ அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: וְלֹא לְקָחָהּ
  choice: இன்னும் அவளை மனைவியாக ஏற்றுக்கொள்ளாதவன்
  rationale: לקח என்பதன் அடிப்படை ‘எடுத்துக்கொள்’ கருத்தையும் இச்சூழலிலுள்ள திருமணப் பொருளையும் இணைத்து, நிச்சயிக்கப்பட்ட திருமணம் இன்னும் நிறைவு பெறவில்லை என்பதைத் தெளிவாக்குகிறது.
- source_word: יֵלֵךְ וְיָשֹׁב לְבֵיתוֹ
  choice: அவன் புறப்பட்டுத் தன் வீட்டுக்குத் திரும்பட்டும்
  rationale: இரு எபிரெய வினைகளையும் தக்கவைத்து, படைச் சூழலில் வழங்கப்படும் அனுமதி கலந்த கட்டளையை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: פֶּן יָמוּת בַּמִּלְחָמָה
  choice: அவன் போரில் இறந்துவிட ... ஏற்றுக்கொள்ளாதபடி
  rationale: פֶּן குறிக்கும் அஞ்சப்படும் சாத்தியத்தைத் தமிழ் எதிர்மறை நோக்கத் தொடரால் வெளிப்படுத்துகிறது; ‘போர்’ இங்குள்ள படையெடுப்பைச் சுட்டுகிறது.
- source_word: וְאִישׁ אַחֵר יִקָּחֶנָּה
  choice: வேறொருவன் அவளை மனைவியாக ஏற்றுக்கொள்ள
  rationale: முந்தைய לקח வடிவத்துடன் சொல்லியல் ஒற்றுமையைப் பேணுவதோடு, இங்கு நோக்கப்படுவது திருமணம் என்பதை இயல்பாகக் காட்டுகிறது.
