  text: so that they may not teach you to do according to all their abominations that they have done for their gods[a], and you would sin against Yahweh your God.
translation:
  language: ta
  text: அவர்கள் தங்கள் தெய்வங்களுக்காகச் செய்த எல்லா அருவருப்பான செயல்களைப்போல் செய்ய உங்களுக்குக் கற்றுக்கொடுக்காதபடியாகவும், உங்கள் கடவுளாகிய யாவேக்கு எதிராக நீங்கள் பாவம் செய்யாதபடியாகவும்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְמַעַן אֲשֶר
  choice: …செய்யாதபடிக்கும் …செய்யாதபடிக்கும் இது வேண்டும்
  rationale: நோக்கம் அல்லது தவிர்க்க வேண்டிய விளைவை அறிமுகப்படுத்தும் எபிரேயத் தொடரைத் தமிழில் இயல்பான எதிர்மறை நோக்கக் கட்டமைப்பாக வெளிப்படுத்துகிறது.
- source_word: יְלַמְּדוּ אֶתְכֶם לַעֲשׂוֹת
  choice: செய்ய உங்களுக்குக் கற்றுக்கொடுக்க
  rationale: ‘கற்றுக்கொடு’ என்ற நேரடியான பொருளையும், அதைத் தொடர்ந்து வரும் செயலைக் குறிக்கும் வினையெச்சத் தொடர்பையும் காக்கிறது.
- source_word: כְּכֹל תּוֹעֲבֹתָם
  choice: அவர்களின் எல்லா அருவருப்பான செயல்களின்படியும்
  rationale: כְּ என்பதன் ‘அதன்படி/அதைப் போல’ என்ற இணக்கப் பொருளையும், תועבה என்பதன் வலுவான சமய-ஒழுக்க வெறுப்புணர்வையும் காக்கிறது; தமிழில் பன்மைச் செயல்களை இயல்பாகக் குறிக்கிறது.
- source_word: אֲשֶׁר עָשׂוּ לֵאלֹהֵיהֶם
  choice: அவர்கள் தங்கள் தெய்வங்களுக்குச் செய்த
  rationale: சார்பு வாக்கியத்தையும், לְ என்பதன் வழிபாட்டு நோக்கு அல்லது தொடர்பைக் குறிக்கும் இயல்பான தமிழையும் நேரடியாக வழங்குகிறது.
- source_word: וַחֲטָאתֶם לַיהוָה
  choice: யாவேக்கு எதிராக நீங்கள் பாவம் செய்யாதபடிக்கும்
  rationale: חטא + לְ என்பதில் யாவே பாவத்தால் பாதிக்கப்படும் தரப்பாக இருப்பதை ‘எதிராக’ தெளிவாக்குகிறது; முந்தைய தடுப்பு நோக்கத்தின் தொடர்ச்சியையும் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: יְהוָה אֱלֹהֵיכֶם
  choice: உங்கள் கடவுளாகிய யாவே
  rationale: திருப்பெயரை ‘யாவே’ என ஒலிபெயர்த்து, உடன்படிக்கை சார்ந்த ‘உங்கள் கடவுள்’ என்ற அடையாளத்தை இயல்பான தமிழ் இணைப்பில் காக்கிறது.
theological_decisions:
- issue: יהוה என்ற திருப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் காணப்படும் தனிப்பட்ட உடன்படிக்கைப் பெயரைப் பொதுப் பட்டமாக மாற்றாமல் ஒலிபெயர்க்கிறது.
- issue: וַחֲטָאתֶם என்பதன் நோக்கம்/விளைவு உறவு
  choice: பாவம் செய்யாதபடிக்கும்
  alternative: அதனால் நீங்கள் பாவம் செய்வீர்கள்
  rationale: לְמַעַן אֲשֶׁר தொடங்கும் தடுப்பு நோக்கம் இரண்டாம் கூறையும் ஆளக்கூடும்; தமிழ் எதிர்மறை நோக்கக் கட்டமைப்பு இதைத் தெளிவாகவும் இயல்பாகவும் தருகிறது. விளைவாகப் புரியும் வாய்ப்பு இருந்தாலும் பொருளை நிபந்தனை வாக்கியமாக விரிவாக்கவில்லை.
translation_notes:
  register: நவீனத் தரமான, மரியாதைமிக்க தமிழ். ‘அருவருப்பான செயல்கள்’ என்பது பொதுவாசகருக்குப் புரியும்படி תועבה என்பதன் வலிமையைத் தக்கவைக்கிறது. வசனத்தின் நோக்கத் தொடரை முழுமையான தமிழ்வாக்கியமாக்க இறுதியில் ‘இது வேண்டும்’ பயன்படுத்தப்பட்டுள்ளது.
