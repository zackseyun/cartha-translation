source:
  edition: WLC
  text: וְ/יָסְפ֣וּ הַ/שֹּׁטְרִים֮ לְ/דַבֵּ֣ר אֶל הָ/עָם֒ וְ/אָמְר֗וּ מִי הָ/אִ֤ישׁ הַ/יָּרֵא֙ וְ/רַ֣ךְ הַ/לֵּבָ֔ב יֵלֵ֖ךְ וְ/יָשֹׁ֣ב לְ/בֵית֑/וֹ וְ/לֹ֥א יִמַּ֛ס אֶת לְבַ֥ב אֶחָ֖י/ו כִּ/לְבָבֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/020/008.yaml
  text: Then the officers shall continue to speak to the people and say[a], ‘Who is the man who is fearful and fainthearted? Let him go and return to his house[b], lest he melt the heart of his brothers like his own heart.’
translation:
  language: ta
  text: பின்பு அதிகாரிகள் மக்களிடம் தொடர்ந்து பேசி, “பயந்தும் மனம் தளர்ந்தும் இருக்கும் மனிதன் யார்?[a] அவன் சென்று தன் வீட்டுக்குத் திரும்பட்டும்; அவனுடைய உள்ளம்போல அவன் சகோதரர்களின் உள்ளத்தை அவன் உருகச் செய்யாதபடி” என்று சொல்ல வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரேயத்தில், “பயப்படுகிறவனும் உள்ளத்தில் மென்மையானவனும் யார்?” என்பது சொல்லுக்குச் சொல் பொருள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָסְפוּ
  choice: தொடர்ந்து
  rationale: ‘பேசுவதைக் கூட்டுதல்’ என்ற எபிரேய மரபுத்தொடர் இங்கு தொடர்ந்து அல்லது மேலும் பேசுவதைக் குறிக்கிறது.
- source_word: הַשֹּׁטְרִים
  choice: அதிகாரிகள்
  rationale: இச்சூழலில் இச்சொல் நவீன காவலர்களை அல்ல, நியமிக்கப்பட்ட நிர்வாக அல்லது படை அதிகாரிகளைக் குறிக்கிறது.
- source_word: הַיָּרֵא וְרַךְ הַלֵּבָב
  choice: பயமும் மனத்தளர்ச்சியும் கொண்ட
  rationale: முதல் சொல் அச்சத்தையும், ‘மென்மையான உள்ளம்’ என்ற சொற்றொடர் போருக்கான துணிவின்மையையும் குறிக்கின்றன; இயல்பான தமிழில் இரு கூறுகளும் வேறுபடுத்தப்பட்டுள்ளன.
- source_word: יֵלֵךְ וְיָשֹׁב לְבֵיתוֹ
  choice: அவன் புறப்பட்டுத் தன் வீட்டுக்குத் திரும்பிப் போகட்டும்
  rationale: எபிரேய வினைகள் இங்கு அனுமதியோடு கூடிய கட்டளை வலிமை கொண்டவை; ‘வீடு’ என்ற மூல உருவகமும் தக்கவைக்கப்பட்டுள்ளது.
- source_word: וְלֹא יִמַּס
  choice: இல்லையெனில் ... உருகச் செய்துவிடுவான்
  rationale: உள்ளம் உருகுதல் என்பது துணிவிழப்பதற்கான எபிரேய உருவகம். வாக்கியத்தில் ‘சகோதரர்களின் உள்ளம்’ நேரடிப் பொருளாக இருப்பதால் தமிழில் இயல்பான காரணவினை பயன்படுத்தப்பட்டுள்ளது.
- source_word: לְבַב אֶחָיו
  choice: அவனுடைய சகோதரர்களின் உள்ளம்
  rationale: ‘உள்ளம்’ என்ற உருவகமும், படைச் சூழலிலுள்ள ஆண்பால் உறவுமுறைச் சொல்லான ‘சகோதரர்கள்’ என்பதும் பாதுகாக்கப்பட்டுள்ளன.
- source_word: כִּלְבָבוֹ
  choice: அவனுடைய உள்ளம் போலவே
  rationale: மூலத்தில் உள்ள לבב என்ற சொல்லின் மறுபயன்பாட்டையும் ஒப்பீட்டையும் தமிழிலும் தக்கவைக்கிறது.
theological_decisions:
- issue: படைச் சூழலின் பாலினக் குறிப்பு
  choice: ‘மனிதன்’ மற்றும் ‘சகோதரர்கள்’ என்பவற்றை முதன்மை உரையில் வைத்தல்
  alternative: ‘ஒருவன்’ மற்றும் ‘உடன் படைவீரர்கள்’
  rationale: மூலம் ஆண்பால் ஒருமையையும் சகோதர உறவுமுறை மொழியையும் பயன்படுத்துகிறது. படைச் சூழலின் சமூகத் தன்மையை நடுநிலைப்படுத்தாமல் பாதுகாக்க இவை தக்கவைக்கப்பட்டன.
- issue: உள்ளம் உருகுதல் என்ற உருவகம்
  choice: உருவகத்தைத் தக்கவைத்து காரணவினையாக மொழிபெயர்த்தல்
  alternative: ‘துணிவிழக்கச் செய்துவிடுவான்’
  rationale: மூலத்தின் வலிமையான உடல்சார் உருவகத்தையும் இருமுறை வரும் ‘உள்ளம்’ என்ற சொல்லையும் காக்கிறது; அதே நேரத்தில் தமிழ் வாக்கிய உறவைத் தெளிவாக்குகிறது.
translation_notes:
  register: நவீன தரத் தமிழில் கண்ணியமான, பொதுவாசகர்களுக்கு எளிதில் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. ‘உள்ளம் உருகுதல்’ என்ற மூல உருவகம் பாதுகாக்கப்பட்டு, அதன் பொருள் சூழலிலிருந்து தெளிவாகும் வகையில் காரணவினை அமைக்கப்பட்டுள்ளது.
