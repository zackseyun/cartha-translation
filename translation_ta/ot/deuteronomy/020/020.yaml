  text: רַ֞ק עֵ֣ץ אֲשֶׁר תֵּדַ֗ע כִּֽי לֹא עֵ֤ץ מַאֲכָל֙ ה֔וּא אֹת֥/וֹ תַשְׁחִ֖ית וְ/כָרָ֑תָּ וּ/בָנִ֣יתָ מָצ֗וֹר עַל הָ/עִיר֙ אֲשֶׁר הִ֨וא עֹשָׂ֧ה עִמְּ/ךָ֛ מִלְחָמָ֖ה עַ֥ד רִדְתָּֽ/הּ־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/020/020.yaml
  text: Only the trees that you know are not trees for food[a], those you may destroy and cut down, and build siegeworks against the city that is making war with you[b], until you bring it down.
translation:
  language: ta
  text: உணவுக்குப் பயன்படாத மரங்கள் என்று உனக்குத் தெரிந்த மரங்களை மட்டும் நீ அழித்தும் வெட்டியும், உன்னோடு போர் செய்துகொண்டிருக்கும் அந்த நகரத்திற்கு எதிராக முற்றுகை அரண்களைக் கட்டலாம்; நகரம் வீழும்வரை அவ்வாறு செய்யலாம்.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “முற்றுகை மேட்டைக் கட்டலாம்” அல்லது “முற்றுகைப் பொறியமைப்புகளைக் கட்டலாம்.” எபிரெயச் சொல் ஒரு குறிப்பிட்ட அமைப்பை மட்டும் அல்லாமல் முற்றுகைக்கான அரண்களையும் பொறியமைப்புகளையும் பொதுவாகக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயில் நேரடியாக, “அது வீழும்வரை.” நகரத்தின் தோல்வி அல்லது வீழ்ச்சியை இறங்குதல் குறித்த வினைச்சொல்லால் கூறுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: רַק
  choice: மட்டும்
  rationale: முந்தைய வசனத்தில் கூறப்பட்ட கனிமரங்களை அழிக்கக்கூடாது என்ற தடைக்கு விதிவிலக்கைச் சுட்டும் கட்டுப்படுத்தும் பொருளைப் பாதுகாக்கிறது.
- source_word: עֵץ ... עֵץ מַאֲכָל
  choice: மரங்கள் ... உணவுக்குப் பயன்படும் மரங்கள்
  rationale: சூழலில் உயிருள்ள மரங்களே குறிக்கப்படுகின்றன; கனிதரும் மரங்கள் என்ற கருத்தை அளவுக்கு மீறிக் குறிப்பாக்காமல், உணவளிக்கும் மரங்கள் என்ற எபிரெயக் கருத்தை இயல்பான தமிழில் தருகிறது.
- source_word: אֲשֶׁר תֵּדַע כִּי לֹא ... הוּא
  choice: அல்ல என்று உனக்குத் தெரிந்த
  rationale: மரங்கள் உணவுக்குப் பயன்படாதவை என்பதை அறிந்து உறுதிசெய்வதைக் காட்டும் எபிரெய வாக்கிய அமைப்பை இயல்பான தமிழில் தருகிறது.
- source_word: אֹתוֹ תַשְׁחִית וְכָרָתָּ
  choice: மரங்களை மட்டும் நீ அழித்து வெட்டலாம்
  rationale: ஒருமை வடிவம் வகையைக் குறிக்கும் பகிர்வுப் பொருளில் இருப்பதால் தமிழில் பன்மையாகத் தரப்பட்டுள்ளது; சட்ட வழிமுறையில் அனுமதியை உணர்த்த ‘வெட்டலாம்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: וּבָנִיתָ מָצוֹר
  choice: முற்றுகை அரண்களைக் கட்டலாம்
  rationale: מָצוֹר என்பது ஒரே குறிப்பிட்ட அமைப்பை மட்டுமல்லாமல் முற்றுகைக்கான அரண் அல்லது பொறியமைப்புகளைப் பரந்த வகையில் குறிக்க முடியும்.
- source_word: עַל הָעִיר
  choice: அந்த நகரத்திற்கு எதிராக
  rationale: இடத்தொடர்பை மட்டும் அல்லாமல் நகரத்துக்கு எதிரான முற்றுகை நடவடிக்கையையும் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: אֲשֶׁר הִוא עֹשָׂה עִמְּךָ מִלְחָמָה
  choice: உன்னோடு போர் செய்துகொண்டிருக்கும்
  rationale: தொடர்ந்து நடைபெறும் செயலைக் குறிக்கும் எபிரெயப் பங்கேற்பு வடிவத்தை இயல்பான நவீன தமிழில் பாதுகாக்கிறது.
- source_word: עַד רִדְתָּהּ
  choice: நகரம் வீழும்வரை
  rationale: நகரம் முற்றுகையில் தோல்வியடைந்து வீழ்வதைக் குறிக்கும் பொருளை இயல்பாகத் தருகிறது; எபிரெய வடிவத்தின் செயப்பாட்டு நுணுக்கம் அடிக்குறிப்பில் குறிப்பிடப்பட்டுள்ளது.
