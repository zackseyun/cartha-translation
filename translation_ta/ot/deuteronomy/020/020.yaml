translation_notes:
  register: நவீன நிலையான தமிழில், சட்ட வழிமுறையின் கட்டுப்பாடும் அனுமதியும் தெளிவாகத் தெரியுமாறு மொழிபெயர்க்கப்பட்டுள்ளது. ‘முற்றுகை அரண்கள்’ என்பது பொதுவாசகருக்குப் புரியக்கூடியதாயும் எபிரெயச் சொல்லின் பரந்த பொருளைத் தக்கவைத்ததாயும் உள்ளது. எல்லா அடிக்குறிப்பு குறிகளும் முதன்மை உரையில் சேர்க்கப்பட்டுள்ளன.
