base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/020/001.yaml
  text: When you go out to battle against your enemies and see horses and chariots[a], a people more numerous than you, do not fear them, for Yahweh your God is with you[c][b], who brought you up from the land of Egypt.
translation:
  language: ta
  text: உன் பகைவர்களுக்கு எதிராகப் போருக்குப் புறப்படும்போது, குதிரைகளையும் தேர்களையும்[a], உன்னைவிட அதிக எண்ணிக்கையுள்ள மக்களையும்[b] நீ கண்டால், அவர்களுக்கு அஞ்சாதே. ஏனெனில் உன் கடவுளாகிய யாவே உன்னோடு இருக்கிறார்; அவரே உன்னை எகிப்து நாட்டிலிருந்து மேலே கொண்டுவந்தவர்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘குதிரையையும் தேரையும்’; எபிரெய ஒருமைச் சொற்கள் இங்கு படைப் பிரிவுகளை மொத்தமாகக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘உன்னைவிடப் பெரிய மக்களை.’ இச்சொற்றொடர் பகைவர்களின் எண்ணிக்கை அதிகம் என்பதை முதன்மையாகக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: ‘எகிப்து நாட்டிலிருந்து மேலே கொண்டுவந்தவர்’ என்பது யாவே இஸ்ரவேலை எகிப்திலிருந்து விடுவித்த நிகழ்வை நினைவூட்டி, அவர்கள் அஞ்சாமலிருக்க வேண்டிய அடிப்படையைச் சுட்டுகிறது.
    reason: cross_reference
lexical_decisions:
- source_word: כִּי תֵצֵא לַמִּלְחָמָה
  choice: போருக்குப் புறப்படும்போது
  rationale: כִּי இங்கு எதிர்காலச் சூழலை அறிமுகப்படுத்துவதால் காலப்பொருளில் ‘போது’ என மொழிபெயர்க்கப்பட்டது; יצא למלחמה என்ற இராணுவ மரபுத்தொடர் இயல்பான தமிழில் ‘போருக்குப் புறப்படு’ என வழங்கப்பட்டது.
- source_word: עַל אֹיְבֶיךָ
  choice: உன் பகைவர்களுக்கு எதிராக
  rationale: பகைமைச் செயலுடன் வரும் עַל என்பதன் பொருள் ‘எதிராக’; இரண்டாம் நபர் ஒருமை உரிமைத் தொடர்பும் பன்மையும் காக்கப்பட்டன.
- source_word: וְרָאִיתָ
  choice: நீ கண்டால்
  rationale: வடிவில் நிறைவேற்றுவினையாக இருந்தாலும், இச்சட்ட அறிவுறுத்தலின் எதிர்காலச் சூழலைத் தொடர்கிறது. தமிழில் நிபந்தனைத் தொடராக அமைப்பது இயல்பாக உள்ளது.
- source_word: סוּס וָרֶכֶב
  choice: குதிரைகளையும் தேர்களையும்
  rationale: எபிரெய ஒருமைச் சொற்கள் இங்கு படைத் தொகுதிகளைச் சுட்டும் கூட்டுப்பொருளில் உள்ளதால் தமிழில் பன்மை பயன்படுத்தப்பட்டது.
- source_word: עַם רַב מִמְּךָ
  choice: உன்னைவிட அதிக எண்ணிக்கையுள்ள மக்களையும்
  rationale: רַב மற்றும் מן ஒப்பீடு எண்ணிக்கையில் மிகுதியைக் குறிக்கிறது; ‘மக்கள்’ என்ற எபிரெயச் சொல்லை ‘படை’ என்று மிகையாக விளக்காமல் காக்கிறது.
- source_word: לֹא תִירָא מֵהֶם
  choice: அவர்களுக்கு அஞ்சாதே
  rationale: சட்ட/அறிவுறுத்தல் நடையில் உள்ள imperfect தடைப்பொருளைக் கொண்டதால் நேரடியான ஒருமைத் தடையாக மொழிபெயர்க்கப்பட்டது.
- source_word: יְהוָה
  choice: யாவே
  rationale: திருநாமத்தை ஒரு பட்டப்பெயரால் மாற்றாமல், தமிழில் வழக்கமான ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: אֱלֹהֶיךָ עִמָּךְ
  choice: உன் கடவுளாகிய யாவே உன்னோடு இருக்கிறார்
  rationale: உடனிருப்பை நேரடியாகக் காக்கிறது; இயல்பான தமிழ் வாக்கிய அமைப்புக்காக திருநாமத்தையும் ‘உன் கடவுள்’ என்பதையும் ஒருங்கிணைக்கிறது.
- source_word: הַמַּעַלְךָ מֵאֶרֶץ מִצְרָיִם
  choice: அவரே உன்னை எகிப்து நாட்டிலிருந்து மேலே கொண்டுவந்தவர்
  rationale: பெயரடைச் செயல்பாட்டுடைய participle-ஐ ‘அவரே ... கொண்டுவந்தவர்’ என வழங்கி, עלה வினையின் ‘மேலே’ என்ற வெளியேற்றப் பயண உருவகத்தைத் தக்கவைக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைத் திருநாமத்தின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூல உரை தனிப்பட்ட உடன்படிக்கைத் திருநாமத்தையே பயன்படுத்துகிறது. அதனைப் பட்டப்பெயரால் மாற்றாமல் ஒலிபெயர்ப்பது மூலத்தின் தன்மையைப் பாதுகாக்கிறது.
- issue: எகிப்திலிருந்து ‘மேலே கொண்டுவருதல்’ என்ற மொழிநடை
  choice: மேலே கொண்டுவந்தவர்
  alternative: வெளியே கொண்டுவந்தவர்
  rationale: ‘வெளியே’ என்பது கருத்தைத் தெளிவாக்கினாலும், எபிரெய עלה-இன் மேலேறுதல் உருவகத்தையும் யாத்திராகம நினைவூட்டலையும் ‘மேலே’ நேரடியாகக் காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், ஒருமை இரண்டாம் நபர் சட்ட அறிவுறுத்தல் நடையைத் தக்கவைத்து, dignified ஆனால் பொதுவாசகர்களுக்குப் புரியும் சொற்கள் பயன்படுத்தப்பட்டன. மூலத்தின் நீண்ட நிபந்தனை வாக்கியம் வாசிப்புத் தெளிவிற்காக இரண்டு வாக்கியங்களாகப் பிரிக்கப்பட்டது; பாலினம் குறிக்காத எபிரெயப் பன்மைக்குத் தமிழில் மரியாதை/மனிதப் பன்மையான ‘அவர்கள்’ பயன்படுத்தப்பட்டது.
