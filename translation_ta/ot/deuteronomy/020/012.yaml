source:
  edition: WLC
  text: וְ/אִם לֹ֤א תַשְׁלִים֙ עִמָּ֔/ךְ וְ/עָשְׂתָ֥ה עִמְּ/ךָ֖ מִלְחָמָ֑ה וְ/צַרְתָּ֖ עָלֶֽי/הָּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/020/012.yaml
  text: But if it does not make peace with you[a], but makes war against you[b], then you shall besiege it.
translation:
  language: ta
  text: ஆனால் அது உன்னுடன் சமாதானம் செய்துகொள்ளாமல், உனக்கு எதிராகப் போர் செய்தால்[a], நீ அதை முற்றுகையிட வேண்டும்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: நேரடியாக, “உன்னுடன் போர் செய்தால்.” இச்சூழலில் இதன் பொருள் “உனக்கு எதிராகப் போர் செய்தால்” என்பதாகும்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அதற்கு எதிராக முற்றுகை போட வேண்டும்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם לֹא
  choice: ஆனால் ... இல்லாமல்
  rationale: முந்தைய வசனத்தில் கூறப்பட்ட சமாதானமான முடிவுக்கு மாறான நிலையை வாவ் இணைப்பும் אִם לֹא நிபந்தனையும் அறிமுகப்படுத்துகின்றன; நவீன தமிழில் இந்த முரண்பாட்டை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: תַשְׁלִים עִמָּךְ
  choice: உன்னுடன் சமாதானம் செய்துகொள்ளாமல்
  rationale: שׁלם என்பதன் ஹிஃபீல் வடிவம் இங்கு சமாதான உறவை ஏற்படுத்துவதையோ சமாதான உடன்பாட்டுக்கு வருவதையோ குறிக்கிறது. “சமாதானம் செய்துகொள்” என்பது செயற்பாட்டு நுணுக்கத்தையும் עִם என்பதன் “உடன்” உறவையும் காக்கிறது.
- source_word: וְעָשְׂתָה עִמְּךָ מִלְחָמָה
  choice: உனக்கு எதிராகப் போர் செய்தால்
  rationale: עשה מלחמה என்பது “போர் செய்/நடத்து” என்ற எபிரேய மொழிமரபு. עִם என்பதற்கு நேரடியாக “உன்னுடன்” என்று வரலாம்; ஆனால் பகைமைச் சூழலில் இயல்பான தமிழுக்காக “உனக்கு எதிராக” என மொழிபெயர்க்கப்பட்டுள்ளது; நேரடி வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: וְצַרְתָּ עָלֶיהָ
  choice: நீ அதை முற்றுகையிட வேண்டும்
  rationale: צור இங்கு ஒரு நகரத்தை முற்றுகையிடுவதைக் குறிக்கிறது. சட்ட அறிவுறுத்தலிலுள்ள தொடர் வினைவடிவத்தின் கட்டளை சார்ந்த வலிமையை “வேண்டும்” தெளிவாகத் தெரிவிக்கிறது; עַל குறிக்கும் இலக்கு தமிழில் நேரடி செயப்படுபொருளாக இயல்பாக வெளிப்படுகிறது.
theological_decisions: []
translation_notes:
  register: நவீன தரத் தமிழில், ஒருமை முன்னிலையான “நீ/உன்” வடிவம் காக்கப்பட்டுள்ளது. நகரம் தமிழில் அஃறிணையாகக் குறிப்பிடப்பட்டு “அது” என மொழிபெயர்க்கப்பட்டுள்ளது. மொழிநடை நேரடியானதும் கண்ணியமானதும் சட்ட அறிவுறுத்தலுக்கு ஏற்றதுமாக உள்ளது.
