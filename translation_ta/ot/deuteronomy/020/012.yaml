  source_fidelity: 'The Tamil accurately represents the Hebrew conditional sequence: failure to make peace, engagement in war, and the consequent instruction to besiege the city. “உன்னுடன் சமாதானம் செய்துகொள்ளாமல்” preserves the active sense of Hiphil שׁלם, while “உனக்கு எதிராகப் போர் செய்தால்” is a natural contextual rendering of עשה מלחמה עם. “அதை முற்றுகையிட வேண்டும்” correctly conveys וְצַרְתָּ עָלֶיהָ.'
