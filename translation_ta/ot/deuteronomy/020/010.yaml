    reason: lexical_alternative
  revision_rationale: The revision explicitly renders the adversative sense of ‘against it’ and improves the Tamil expression for proclaiming/calling for peace. The footnote retains more idiomatic alternatives without treating ‘terms’ as the only possible sense of the Hebrew.
