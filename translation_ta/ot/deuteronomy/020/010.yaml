revisions:
- from: நீ ஒரு நகரத்தோடு போரிட அதை நெருங்கும்போது, சமாதானத்திற்காக அதற்கு அழைப்பு விடு.[a]
  to: நீ ஒரு நகரத்திற்கு எதிராகப் போரிட அதை நெருங்கும்போது, அதற்குச் சமாதான அழைப்பு விடு.[a]
  rationale: The revision explicitly renders the adversative sense of ‘against it’ and improves the Tamil expression for proclaiming/calling for peace. The footnote retains more idiomatic alternatives without treating ‘terms’ as the only possible sense of the Hebrew.
