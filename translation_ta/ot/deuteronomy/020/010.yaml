  text: כִּֽי תִקְרַ֣ב אֶל עִ֔יר לְ/הִלָּחֵ֖ם עָלֶ֑י/הָ וְ/קָרָ֥אתָ אֵלֶ֖י/הָ לְ/שָׁלֽוֹם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/020/010.yaml
  text: When you draw near to a city to fight against it[a], you shall call out to it for peace.
translation:
  language: ta
  text: நீ ஒரு நகரத்திற்கு எதிராகப் போரிட அதை நெருங்கும்போது, அதற்குச் சமாதான அழைப்பு விடு.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இதை இயல்பான நடையில், “அதற்குச் சமாதான நிபந்தனைகளை அறிவி” அல்லது “அதற்குச் சமாதானத்தை முன்மொழி” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: நெருங்கும்போது
  rationale: இங்கு כִּי காரணத்தை அல்ல, எதிர்பார்க்கப்படும் போர்ச் சூழலை அறிமுகப்படுத்துகிறது; ஆகவே காலப் பொருளுடைய ‘போது’ இயல்பாக உள்ளது.
- source_word: תִקְרַב
  choice: நெருங்கு
  rationale: קרב என்பதன் அடிப்படைப் பொருளான ஓர் இடத்தை அணுகுதல் அல்லது நெருங்குதல் என்பதைக் காக்கிறது.
- source_word: עִיר
  choice: ஒரு நகரம்
  rationale: திட்டவட்டமாகக் குறிப்பிடப்படாத ஒருமை நகரத்தைக் குறிக்கும் சட்டவழிகாட்டல் நடை.
- source_word: לְהִלָּחֵם עָלֶיהָ
  choice: ஒரு நகரத்தோடு போரிட
  rationale: לחם போரில் ஈடுபடுதலைக் குறிக்கிறது. עַל பகைமைச் சூழலில் ‘எதிராக’ எனப் பொருள்பட்டாலும், தமிழில் ‘நகரத்தோடு போரிட’ என்பது இயல்பானதும் தெளிவானதும் ஆகும்.
- source_word: וְקָרָאתָ אֵלֶיהָ
  choice: அதற்கு அழைப்பு விடு
  rationale: קרא என்பதில் உள்ள அழைத்தல் அல்லது அறிவித்தல் என்ற பரப்பை வைத்திருக்கிறது; நகரத்தை நோக்கிய அறிவிப்பை நவீன தமிழில் இயல்பாகத் தெரிவிக்கிறது.
- source_word: לְשָׁלוֹם
  choice: சமாதானத்திற்காக
  rationale: לְ என்ற முன்னொட்டையும் שָׁלוֹם என்பதன் சமாதானப் பொருளையும் நெருக்கமாகக் காக்கிறது; சூழலில் இது சமாதான முன்மொழிவைக் குறிக்கலாம்.
theological_decisions: []
translation_notes:
  register: நவீன தரத் தமிழில், ஒருமை இரண்டாம் நபர் சட்டக் கட்டளையாக மொழிபெயர்க்கப்பட்டுள்ளது. மூலத்தின் சுருக்கமான கட்டமைப்பும் ‘சமாதானம்’ என்ற சொல்லின் முன்மொழிவு/நிபந்தனை சார்ந்த சூழற்பொருளும் பாதுகாக்கப்பட்டுள்ளன.
