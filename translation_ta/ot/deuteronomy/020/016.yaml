- from: ஆனால், உங்கள் கடவுளாகிய யாவே உங்களுக்கு உரிமைச்சொத்தாகக் கொடுக்கிற இந்த மக்களின் நகரங்களில், மூச்சுள்ள எதையும் உயிரோடு விட்டுவைக்காதீர்கள்.[a]
  to: ஆனால், உங்கள் கடவுளாகிய யாவே உங்களுக்குச் சுதந்தரமாகக் கொடுக்கிற இந்த மக்களின் நகரங்களிலிருந்து, மூச்சுவிடும் எதையும்[a] உயிருடன் இருக்க விடாதீர்கள்.
  rationale: மூலத்தின் விதிவிலக்கைக் குறிக்கும் מִן-ஐ ‘நகரங்களிலிருந்து’ என மீட்டெடுத்துள்ளேன். நַחֲלָהவின் மரபுரிமைச் சாயலை ‘சுதந்தரமாக’ எனக் காத்துள்ளேன். கட்டளையின் காரணவினை வலிமையையும், ‘ஒவ்வொரு மூச்சுள்ளதும்’ என்ற விரிவான சொல்லாட்சியையும் விளக்கமின்றி பாதுகாக்கும் வகையில் இறுதிப்பகுதி அமைக்கப்பட்டுள்ளது. அடிக்குறிப்பு குறியீடு அது விளக்கும் தொடருக்கே உடனடியாக இடப்பட்டுள்ளது.
