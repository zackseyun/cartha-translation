  text: But from the cities of these peoples that Yahweh your God is giving you as an inheritance[a], you shall not let any living thing remain alive.
translation:
  language: ta
  text: ஆனால், உங்கள் கடவுளாகிய யாவே உங்களுக்குச் சுதந்தரமாகக் கொடுக்கிற இந்த மக்களின் நகரங்களிலிருந்து, மூச்சுவிடும் எதையும்[a] உயிருடன் இருக்க விடாதீர்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மூச்சுள்ள அனைத்தையும்.” எபிரெயத்தில், “ஒவ்வொரு மூச்சுள்ளதும்.”
    reason: כָּל נְשָׁמָה என்ற எபிரெயச் சொற்றொடரின் மேலும் சொற்சொல்லான மாற்றை வழங்குகிறது.
lexical_decisions:
- source_word: רַק
  choice: ஆனால்
  rationale: முந்தைய வசனத்தில் தொலைதூர நகரங்களுக்குக் கொடுக்கப்பட்ட கட்டளையிலிருந்து இப்போது விதிவிலக்கான நிலைக்குச் செல்லும் எதிர்மறைத் தொடர்பை இயல்பான தமிழில் காட்டுகிறது.
- source_word: מֵעָרֵי הָעַמִּים הָאֵלֶּה
  choice: இந்த மக்களின் நகரங்களில்
  rationale: மִן இங்கு முன்னர் கூறப்பட்ட விதியிலிருந்து விலக்கப்படும் நகரங்களைக் குறிக்கிறது; עַמִּים என்பதற்கு நவீன தேசிய அரசுகளைக் குறிக்கும் சொல்லைவிட ‘மக்கள்’ நேரடியான இணை.
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: உங்கள் கடவுளாகிய யாவே
  rationale: יהוה என்ற தனிப்பெயரை ‘யாவே’ என்று ஒலிபெயர்த்து, אֱלֹהֶיךָ என்பதன் உறவுச் சார்ந்த பொருளையும் இயல்பான தமிழில் காக்கிறது.
- source_word: נֹתֵן לְךָ נַחֲלָה
  choice: உங்களுக்கு உரிமைச்சொத்தாகக் கொடுக்கிற
  rationale: நֹתֵן என்பதன் நிகழ்நிலைச் செயற்பாட்டையும், נַחֲלָה என்பதன் வழிவரும்/உரிமையாக அளிக்கப்படும் சொத்து என்ற உடன்படிக்கை-நிலச் சாயலையும் காக்கிறது.
- source_word: לֹא תְחַיֶּה
  choice: உயிரோடு விட்டுவைக்காதீர்கள்
  rationale: חיה என்பதன் பியேல் வடிவிலுள்ள ‘உயிருடன் இருக்க அனுமதித்தல்/உயிரோடு வைத்தல்’ என்ற காரணவினைத் தன்மையைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: כָּל נְשָׁמָה
  choice: மூச்சுள்ள எதையும்
  rationale: சொல்லின் ‘மூச்சு உடையது’ என்ற உருவகத்தைப் பாதுகாத்து, அது மனிதர்களை மட்டுமே குறிக்கிறது என்று தமிழில் தேவையின்றி வரையறுக்காமல் விடுகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: எபிரெய மூலத்தில் பட்டப்பெயர் அல்ல, நான்கெழுத்து இறைத்தனிப்பெயரே உள்ளது; ஆகவே அதை ஒலிபெயர்ப்பது மூலத்தின் வேறுபாட்டைக் காக்கிறது.
- issue: נַחֲלָה என்பதிலுள்ள உடன்படிக்கை-நிலக் கருத்து
  choice: உரிமைச்சொத்தாக
  alternative: உடைமையாக
  rationale: வெறும் உடைமை என்பதைக் காட்டிலும், கடவுளால் ஒதுக்கி அளிக்கப்படும் பங்கும் நிலையான உரிமையும் என்ற பொருளை இது நன்கு காக்கிறது.
- issue: כָּל נְשָׁמָה என்பதன் வரம்பு
  choice: மூச்சுள்ள எதையும்
  alternative: எந்த மனிதரையும்
  rationale: போர்ச் சூழல் மனிதர்களை முதன்மையாகக் குறிக்கக்கூடும் என்றாலும், எபிரெயச் சொற்றொடர் நேரடியாக ‘ஒவ்வொரு மூச்சுள்ளதையும்’ என உள்ளது; அந்த உண்மையான விரிவையும் பதற்றத்தையும் உரை சுருக்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில் மரியாதைப் பன்மை கட்டளை வடிவம் பயன்படுத்தப்பட்டுள்ளது. வாக்கியம் கடுமையான மூலக் கட்டளையை மென்மைப்படுத்தாமல், அதேவேளை தேவையற்ற விளக்கச் சொற்களைச் சேர்க்காமல் வழங்குகிறது. அடிக்குறிப்பு குறியீடு அது விளக்கும் ‘மூச்சுள்ள எதையும்’ என்ற தொடருக்குரிய வசனத்தின் முடிவில் இடப்பட்டுள்ளது.
