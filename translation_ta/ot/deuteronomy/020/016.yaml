  terminology: யְהוָה-வுக்கு ‘யாவே’ சரியான ஒலிபெயர்ப்பு. ‘கடவுளாகிய’ மற்றும் மரியாதைப் பன்மை வடிவங்கள் ஏற்றவை. ‘சுதந்தரமாக’ நַחֲלָהவின் inheritance கருத்தை ‘உரிமைச்சொத்தாக’ என்பதைக் காட்டிலும் சிறப்பாகப் பாதுகாக்கிறது.
