translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. உரையின் இராணுவச் சூழலும் எபிரெயத்தின் தீவிரமடையும் மூன்று கட்டத் தடையும் பாதுகாக்கப்பட்டுள்ளன; தேவையற்ற சமயப்பிரிவுச் சொற்கள் தவிர்க்கப்பட்டுள்ளன.
