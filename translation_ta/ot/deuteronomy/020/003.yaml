source:
  edition: WLC
  text: וְ/אָמַ֤ר אֲלֵ/הֶם֙ שְׁמַ֣ע יִשְׂרָאֵ֔ל אַתֶּ֨ם קְרֵבִ֥ים הַ/יּ֛וֹם לַ/מִּלְחָמָ֖ה עַל אֹיְבֵי/כֶ֑ם אַל יֵרַ֣ךְ לְבַבְ/כֶ֗ם אַל תִּֽירְא֧וּ וְ/אַֽל תַּחְפְּז֛וּ וְ/אַל תַּֽעַרְצ֖וּ מִ/פְּנֵי/הֶֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/020/003.yaml
  text: 'and say to them[a], ‘Hear, Israel: today you are drawing near to battle against your enemies. Do not let your heart grow faint. Do not fear, or panic[b], or be terrified because of them.’'
translation:
  language: ta
  text: 'அவர்களிடம் இவ்வாறு சொல்ல வேண்டும்: “இஸ்ரவேலே, கேள்! இன்று நீங்கள் உங்கள் பகைவர்களுக்கு எதிராகப் போரிட நெருங்குகிறீர்கள். உங்கள் உள்ளம் தளர வேண்டாம்.[a] அஞ்சாதீர்கள்; பதற்றமடையாதீர்கள்; அவர்களைக் கண்டு திகிலடையாதீர்கள்.[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மனந்தளராதீர்கள்.” எபிரெயச் சொற்றொடரின் நேர்ப்பொருள், “உங்கள் உள்ளம் மென்மையாகவோ தளர்வாகவோ ஆக வேண்டாம்”; இது தைரியம் சரிந்துபோவதைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: 'எபிரெயத்தில் அச்சத்திற்கு எதிரான மூன்று தனித்தனி தடைகள் தொடர்ச்சியாக வந்து கட்டளையின் தீவிரத்தை அதிகரிக்கின்றன: அஞ்சாதீர்கள், பதற்றமடையாதீர்கள், திகிலடையாதீர்கள்.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמַר
  choice: அவர்களிடம் இவ்வாறு சொல்ல வேண்டும்
  rationale: தொடர்ச்சியான நடைமுறை அறிவுறுத்தலின் சூழலில் வரும் வாவ்-முன்னொட்டுப் பூர்த்திவினை வடிவத்தை, முந்தைய வசனத்தின் எழுவாயைத் தமிழில் தேவையின்றி மீண்டும் சேர்க்காமல், இயல்பான விதிமுறைத் தொடராக மொழிபெயர்க்கிறது.
- source_word: שְׁמַע יִשְׂרָאֵל
  choice: இஸ்ரவேலே, கேள்!
  rationale: உபாகமத்தில் காணப்படும் உடன்படிக்கை சார்ந்த அழைப்பைத் தக்கவைத்து, கேட்டுக் கீழ்ப்படிதல் என்ற உட்பொருளையும் சுருக்கமாக உணர்த்துகிறது.
- source_word: קְרֵבִים הַיּוֹם לַמִּלְחָמָה
  choice: இன்று ... போரிட நெருங்குகிறீர்கள்
  rationale: பங்கேற்புவினை உணர்த்தும் உடனடி அணுகுதலைப் பாதுகாக்கிறது; לַמִּלְחָמָה என்பதைக் தமிழில் இயல்பாகச் செயல்நோக்குடன் வெளிப்படுத்துகிறது.
- source_word: עַל אֹיְבֵיכֶם
  choice: உங்கள் பகைவர்களுக்கு எதிராக
  rationale: போர்ச் சூழலில் עַל குறிக்கும் எதிர்நிலையைத் தெளிவாகத் தருகிறது.
- source_word: אַל יֵרַךְ לְבַבְכֶם
  choice: உங்கள் உள்ளம் தளர வேண்டாம்
  rationale: தைரியம் சரிந்துபோவதைக் குறிக்கும் எபிரெய உருவகத்தை இயல்பான நவீன தமிழில் பாதுகாக்கிறது; ஒருமை 'உள்ளம்' மூலத்தின் கூட்டுத்தொகை ஒருமையைப் பிரதிபலிக்கிறது.
- source_word: אַל תִּירְאוּ
  choice: அஞ்சாதீர்கள்
  rationale: ירא என்பதற்கான நேரடியான, கண்ணியமான தமிழ் இணை.
- source_word: וְאַל תַּחְפְּזוּ
  choice: பதற்றமடையாதீர்கள்
  rationale: இங்கு வெறும் அவசரத்தையல்ல, போரில் உண்டாகும் கலக்கத்தையும் பீதியூட்டும் பதற்றத்தையும் குறிக்கிறது.
- source_word: וְאַל תַּעַרְצוּ
  choice: திகிலடையாதீர்கள்
  rationale: எதிரியின் முன்னிலையில் தாக்கும் கடும் அச்சத்தை வெளிப்படுத்தி, மூன்று தடைகளின் தீவிரத் தொடரைத் தக்கவைக்கிறது.
- source_word: מִפְּנֵיהֶם
  choice: அவர்களைக் கண்டு
  rationale: சொல்லுக்கு சொல் 'அவர்களுக்கு முன்பாக/அவர்களின் முன்னிலையில்' என்ற பொருளை, தமிழில் இயல்பான காரண-எதிர்நிலைச் சொல்லாக்கமாக அளிக்கிறது.
