  text: וּ/נְתָנָ֛/הּ יְהוָ֥ה אֱלֹהֶ֖י/ךָ בְּ/יָדֶ֑/ךָ וְ/הִכִּיתָ֥ אֶת כָּל זְכוּרָ֖/הּ לְ/פִי חָֽרֶב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/020/013.yaml
  text: And Yahweh your God will give it into your hand[a], and you shall strike down all its males with the edge of the sword.
translation:
  language: ta
  text: உன் கடவுளாகிய யாவே அதை உன் கையில் ஒப்புக்கொடுப்பார்; அப்போது நீ அதிலுள்ள ஆண்கள் அனைவரையும்[a] வாளின் கூரிய விளிம்பால் கொல்ல வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயில் ‘அதிலுள்ள ஆண்கள் அனைவரையும்’; இச்சொல் ‘மனிதர்கள்’ அல்லது ‘ஆட்கள்’ போன்ற பொதுச் சொல்லைப் பயன்படுத்தாமல், ஆண்பாலினரையே குறிப்பாகச் சுட்டுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּנְתָנָהּ
  choice: அதை ... ஒப்புக்கொடுப்பார்
  rationale: נתן வினையோடு சேர்ந்துள்ள மூன்றாம் நபர் பெண்பால் ஒருமை பின்னொட்டு நகரத்தைக் குறிக்கிறது. நகரை ஒருவரின் அதிகாரத்துக்குள் ஒப்படைக்கும் கருத்தை இயல்பான தமிழில் ‘ஒப்புக்கொடுப்பார்’ எனத் தருகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைப்பெயரான நான்கு எழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் இயல்பாக ஒலிபெயர்க்கிறது.
- source_word: אֱלֹהֶיךָ
  choice: உன் கடவுள்
  rationale: இரண்டாம் நபர் ஆண்பால் ஒருமைப் பின்னொட்டுடன் உள்ள உடன்படிக்கைச் சொற்றொடரை நேரடியாகத் தருகிறது.
- source_word: בְּיָדֶךָ
  choice: உன் கையில்
  rationale: ஒருவரின் கட்டுப்பாட்டுக்குள் ஒப்படைத்தல் என்னும் எபிரெய உருவகத்தைத் தமிழிலும் தக்கவைக்கிறது.
- source_word: וְהִכִּיתָ
  choice: வெட்டி வீழ்த்த வேண்டும்
  rationale: போர்ச் சூழலில் נכה என்பதன் உயிர்க்கொல்லும் வலிமையை மறைக்காமல், இயல்பான தமிழில் கட்டளையாக வழங்குகிறது.
- source_word: כָּל
  choice: அனைவரையும்
  rationale: கட்டளையின் முழுமையான, விதிவிலக்கற்ற பரப்பைத் தக்கவைக்கிறது.
- source_word: זְכוּרָהּ
  choice: அதிலுள்ள ஆண்பாலார்
  rationale: இந்தச் சொல் பொதுவாக மனிதர்களையோ படைவீரர்களையோ அல்ல, ஆண்பாலினரைச் சுட்டுகிறது; நகரத்தைக் குறிக்கும் பின்னொட்டையும் ‘அதிலுள்ள’ என்பதால் வெளிப்படுத்துகிறது.
- source_word: לְפִי חָרֶב
  choice: வாளின் கூர்முனையால்
  rationale: சொல்லுக்கு சொல் ‘வாளின் வாயால்’ எனும் எபிரெய உருவகத்தை, தமிழில் புரியக்கூடிய வாளின் கூரிய பகுதியைக் குறிக்கும் சொற்றொடராகத் தருகிறது.
theological_decisions:
- issue: கடவுளால் அனுமதிக்கப்பட்ட போர்க்கட்டளையின் கடுமையை மென்மைப்படுத்தாமல் மொழிபெயர்த்தல்
  choice: நகரம் யாவேயால் ஒப்புக்கொடுக்கப்படுவதையும், அதிலுள்ள ஆண்பாலார் அனைவரையும் கொல்லும் கட்டளையையும் நேரடியாகத் தருதல்
  alternative: ‘தோற்கடிக்க வேண்டும்’ போன்ற மென்மையான சொல்லைப் பயன்படுத்துதல் அல்லது தீர்ப்பு/புனிதப் போர் பற்றிய விளக்கத்தை வசனத்துக்குள் சேர்த்தல்
  rationale: எபிரெய உரை நகரம் யாவேயால் கையில் கொடுக்கப்படுவதையும் ஆண்பாலார் அனைவர்மீதும் உயிர்க்கொல்லும் நடவடிக்கையையும் வெளிப்படையாகக் கூறுகிறது. மொழிபெயர்ப்பு அதை மறைக்கவோ, உரையில் இல்லாத இறையியல் விளக்கத்தைச் சேர்க்கவோ கூடாது.
translation_notes:
  register: நவீனத் தரத்தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையைப் பயன்படுத்துகிறது. ‘ஆண்பாலார்’ என்பது சற்றே முறையான சொல்லாயினும், மூலத்தின் பாலினக் குறிப்பை ‘ஆண்கள்’ என்பதைக் காட்டிலும் துல்லியமாகத் தக்கவைக்கிறது. தொடக்க וְ இணைப்பை இயல்பான தமிழ் தொடர்ச்சிக்காக இரண்டு வாக்கியங்களாகவும் ‘அப்போது’ என்பதாலும் வெளிப்படுத்தியுள்ளது.
