    reason: lexical_alternative
  revision_rationale: The revision replaces the technical «ஆண்பாலார்» with idiomatic «ஆண்கள்» while preserving the source's sex-specific wording in the anchored note. It corrects «கூர்முனை» to «கூரிய விளிம்பு» for the sword-edge idiom and uses explicit lethal language suitable to the Hebrew military context. The sequential sense is retained with «அப்போது» and an explicit second-person command.
