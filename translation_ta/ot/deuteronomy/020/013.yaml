revisions:
- from: உன் கடவுளாகிய யாவே அதை உன் கையில் ஒப்புக்கொடுப்பார். அப்போது, அதிலுள்ள ஆண்பாலார் அனைவரையும்[a] வாளின் கூர்முனையால் வெட்டி வீழ்த்த வேண்டும்.
  to: உன் கடவுளாகிய யாவே அதை உன் கையில் ஒப்புக்கொடுப்பார்; அப்போது நீ அதிலுள்ள ஆண்கள் அனைவரையும்[a] வாளின் கூரிய விளிம்பால் கொல்ல வேண்டும்.
  rationale: The revision replaces the technical «ஆண்பாலார்» with idiomatic «ஆண்கள்» while preserving the source's sex-specific wording in the anchored note. It corrects «கூர்முனை» to «கூரிய விளிம்பு» for the sword-edge idiom and uses explicit lethal language suitable to the Hebrew military context. The sequential sense is retained with «அப்போது» and an explicit second-person command.
  reviewer_model: gpt-5.6-terra
