  source_fidelity: மூல எபிரேயத்தின் வாக்கிய அமைப்பும் சட்டமுறை அறிவுறுத்தல் வலிமையும் நன்றாகப் பாதுகாக்கப்பட்டுள்ளன. הַשֹּׁטְרִים ‘அதிகாரிகள்,’ הָעָם ‘மக்கள்,’ புதிய வீட்டைக் கட்டுதல், வீட்டை חנך செய்தல், போரில் இறத்தல், மற்றொருவன் அதைச் செய்வது ஆகிய அனைத்தும் துல்லியமாகத் தரப்பட்டுள்ளன. פֶּן-ன் தடுப்பு/தவிர்ப்பு நுணுக்கம் ‘நேரிடாதபடி’ என்பதனால் இயல்பாக வெளிப்படுகிறது.
