  text: וְ/דִבְּר֣וּ הַ/שֹּֽׁטְרִים֮ אֶל הָ/עָ֣ם לֵ/אמֹר֒ מִֽי הָ/אִ֞ישׁ אֲשֶׁ֨ר בָּנָ֤ה בַֽיִת חָדָשׁ֙ וְ/לֹ֣א חֲנָכ֔/וֹ יֵלֵ֖ךְ וְ/יָשֹׁ֣ב לְ/בֵית֑/וֹ פֶּן יָמוּת֙ בַּ/מִּלְחָמָ֔ה וְ/אִ֥ישׁ אַחֵ֖ר יַחְנְכֶֽ/נּוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/020/005.yaml
  text: Then the officers shall speak to the people[a], saying, ‘Who is the man who has built a new house and has not dedicated it? Let him go and return to his house, lest he die in the battle and another man dedicate it.’
translation:
  language: ta
  text: 'அப்போது அதிகாரிகள் மக்களிடம் இவ்வாறு சொல்ல வேண்டும்: “புதிய வீடு ஒன்றைக் கட்டி, அதை இன்னும் அர்ப்பணிக்காதவன்[a] யார்? அவன் போரில் இறந்து, வேறொருவன் அதை அர்ப்பணிக்க நேரிடாதபடி, அவன் புறப்பட்டுத் தன் வீட்டுக்குத் திரும்பிப் போகட்டும்.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அதை முறைப்படி பயன்பாட்டுக்குத் தொடங்கிவைக்காதவன்.” எபிரேய வினைச்சொல் புதிய வீட்டின் பயன்பாட்டை முறைப்படி ஆரம்பிப்பதைக் குறிக்கிறது; அதில் அர்ப்பணிப்பு என்ற நிழற்பொருளும் இருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשֹּׁטְרִים
  choice: அதிகாரிகள்
  rationale: இராணுவ மற்றும் குடிமை நிர்வாகச் சூழலில் நியமிக்கப்பட்ட பொறுப்பாளர்களைக் குறிக்கிறது; ‘அதிகாரிகள்’ என்பது இயல்பான, அளவுக்கு மீறிக் குறிப்பாக்காத மொழிபெயர்ப்பு.
- source_word: הָעָם
  choice: மக்கள்
  rationale: எபிரேயச் சொல்லின் நேரடிப் பொருளைப் பாதுகாக்கிறது; சூழலில் போருக்காகக் கூடியிருந்த மக்களை இது குறிக்கிறது.
- source_word: מִי הָאִישׁ
  choice: …வன் யார்?
  rationale: போருக்குத் தகுதியான தனிப்பட்ட ஆணைச் சுட்டும் ஒருமை ஆண்பால் வடிவம் தமிழில் இயல்பாகப் பாதுகாக்கப்பட்டுள்ளது.
- source_word: בָּנָה בַיִת חָדָשׁ
  choice: புதிய வீடு ஒன்றைக் கட்டி
  rationale: בַיִת என்பதன் நேரடிப் பொருளான ‘வீடு’ என்பதைக் காக்கிறது; எபிரேய வாக்கியத் தொடர்பை இயல்பான தமிழில் தருகிறது.
- source_word: וְלֹא חֲנָכוֹ
  choice: அதை இன்னும் அர்ப்பணிக்காதவன்
  rationale: חנך என்பது புதிய வீட்டை அர்ப்பணித்து அல்லது முறைப்படி தொடங்கிவைத்து அதன் பயன்பாட்டை ஆரம்பிப்பதைக் குறிக்கலாம். ‘அர்ப்பணிக்க’ என்பது அதன் அர்ப்பணிப்பு நிழற்பொருளைக் காக்கிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: יֵלֵךְ וְיָשֹׁב לְבֵיתוֹ
  choice: அவன் புறப்பட்டுத் தன் வீட்டுக்குத் திரும்பிப் போகட்டும்
  rationale: சட்டமுறை அறிவுறுத்தலாக வரும் வினைகளின் கட்டளை/அனுமதி வலிமையை ‘போகட்டும்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: פֶּן
  choice: …நேரிடாதபடி
  rationale: தவிர்க்கப்பட வேண்டிய சாத்திய விளைவைச் சுட்டும் פֶּן என்பதன் தடுப்பு நுண்பொருளை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: יָמוּת בַּמִּלְחָמָה
  choice: அவன் போரில் இறந்து
  rationale: குறிப்பிட்ட போர்ச் சூழலில் அவன் இறப்பதைச் சுருக்கமாகவும் நேரடியாகவும் தெரிவிக்கிறது.
- source_word: וְאִישׁ אַחֵר
  choice: வேறொருவன்
  rationale: ‘வேறொரு மனிதன்’ என்ற ஒருமை ஆண்பால் பொருளை இயல்பான தமிழில் பாதுகாக்கிறது.
- source_word: יַחְנְכֶנּוּ
  choice: அதை அர்ப்பணிக்க
  rationale: முந்தைய חנך வினையுடன் உள்ள சொல் மறுபயன்பாட்டைத் தமிழிலும் ஒரே வினையால் பாதுகாக்கிறது.
theological_decisions:
- issue: חנך என்பதன் அர்ப்பணிப்பு அல்லது முறைப்படியான பயன்பாட்டுத் தொடக்கம் என்ற பொருள் வரம்பு
  choice: முதன்மை உரையில் ‘அர்ப்பணிக்க’ என்று வைத்து, மாற்றுப் பொருளை அடிக்குறிப்பில் தருதல்
  alternative: ‘முறைப்படி பயன்பாட்டுக்குத் தொடங்கிவைக்க’
  rationale: வீட்டை அர்ப்பணித்தல் என்ற சாத்தியமான சடங்கு நிழற்பொருளை அகற்றாமலும், அது கட்டாயம் மதச்சடங்கு மட்டுமே என்று தீர்மானிக்காமலும் எபிரேயச் சொல்லின் பொருள் விரிவைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத்தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் வகையிலும் வேதாகம உரைக்குரிய கண்ணியத்துடனும் வடிவமைக்கப்பட்டது. மூலத்தின் நேரடி கேள்வி அமைப்பும், போரில் இறப்பதற்கும் வேறொருவன் வீட்டை அர்ப்பணிப்பதற்கும் இடையிலான காரணத் தொடர்பும் பாதுகாக்கப்பட்டுள்ளன.
