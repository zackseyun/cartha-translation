base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/020/015.yaml
  text: Thus you shall do to all the cities that are very far from you[b][a], which are not among the cities of these nations.
translation:
  language: ta
  text: இந்த நாடுகளின் நகரங்களுள் சேராத[b], உன்னிடமிருந்து மிகவும் தொலைவில் இருக்கும் எல்லா நகரங்களுக்கும் நீ இவ்வாறே[a] செய்ய வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘இவ்விதமே’ அல்லது ‘இந்த முறையிலேயே’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெய மொழியில், ‘இந்த நாடுகளின் நகரங்களிலிருந்து அல்லாதவை’ என்று உள்ளது; இந்நகரங்கள் முன்பு குறிப்பிடப்பட்ட இந்த நாடுகளின் நகரங்களுள் சேராதவை என்பதே பொருள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֵּן
  choice: இவ்வாறே
  rationale: முந்தைய வசனங்களில் விவரிக்கப்பட்ட முறையைச் சுட்டுகிறது. ‘இவ்வாறே’ என்பது சட்ட அறிவுறுத்தலின் தொடர்பையும் வலியுறுத்தலையும் இயல்பாகப் பாதுகாக்கிறது.
- source_word: תַּעֲשֶׂה
  choice: நீ ... செய்ய வேண்டும்
  rationale: Qal imperfect இரண்டாம் நபர் ஆண்பால் ஒருமை வடிவம் இங்கு கட்டளையிடும் சட்டப் பொருளைக் கொண்டுள்ளது. ‘செய்ய வேண்டும்’ நவீனத் தமிழில் அந்தக் கடமைத் தொனியைத் தெளிவாக வழங்குகிறது.
- source_word: לְכָל הֶעָרִים
  choice: எல்லா நகரங்களுக்கும்
  rationale: לְ முன்னிடைச்சொல் இங்கு செயல் செலுத்தப்படும் பொருளைக் குறிக்கிறது; ‘நகரங்களுக்கும்’ என்பது தமிழில் இயல்பான இணைவு.
- source_word: הָרְחֹקֹת מִמְּךָ מְאֹד
  choice: உன்னிடமிருந்து மிகவும் தொலைவில் உள்ள
  rationale: מִמְּךָ என்பதன் ஒப்புமை/தொலைவு உறவையும் מְאֹד என்பதன் தீவிரத்தையும் நேரடியாகப் பாதுகாக்கிறது.
- source_word: אֲשֶׁר לֹא מֵעָרֵי
  choice: நகரங்களில் அடங்காத
  rationale: מִן இங்கு பகுதியிலிருந்து விலக்கப்படுதலைக் குறிக்கிறது. ‘அடங்காத’ என்பது அந்த நகரங்கள் குறிப்பிடப்பட்ட நாடுகளின் நகரத் தொகுதிக்குள் இல்லை என்ற பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: הַגּוֹיִם הָאֵלֶּה
  choice: இந்த நாடுகள்
  rationale: גּוֹיִם இச்சூழலில் அரசியல்-மக்கள் குழுக்களான நாடுகளைக் குறிக்கிறது. ‘நாடுகள்’ என்பது பின்னாளைய ‘புறஜாதியார்’ என்ற சமய நுணுக்கத்தைத் திணிக்காமல் பொருளை வழங்குகிறது.
- source_word: הֵנָּה
  choice: இந்த என்பதில் உட்படுத்தப்பட்டது
  rationale: பெண்பால் பன்மைச் சுட்டுப்பெயர் அருகாமை அல்லது வலியுறுத்தலைக் கூட்டுகிறது; தமிழில் ‘இந்த நாடுகள்’ என்பதே அதன் இயல்பான செயல்பாட்டை ஏற்கிறது.
theological_decisions:
- issue: தொலைதூர நகரங்களுக்கும் குறிப்பிடப்பட்ட நாடுகளின் நகரங்களுக்கும் இடையிலான சட்ட வரம்பு
  choice: முந்தைய போர் அறிவுறுத்தல்கள் தொலைதூர நகரங்களுக்கு உரியவை என்றும், இங்கு குறிப்பிடப்பட்ட நாடுகளின் நகரங்கள் அந்த வகையில் அடங்காது என்றும் உரை கூறும் வேறுபாட்டைத் தெளிவாக வைத்தல்.
  alternative: முந்தைய முற்றுகை நிபந்தனைகளை இவ்வசனத்துக்குள் விளக்கமாகச் சேர்த்தல் அல்லது இதை பொதுவான வெளிநாட்டு நகரங்கள் குறித்த கூற்றாக மென்மைப்படுத்தல்.
  rationale: இந்த வசனம் சுற்றியுள்ள சட்டப்பகுதியில் ஒரு வரம்புக் குறியீடாகச் செயல்படுகிறது. அதன் இராணுவ-நீதித்துறைத் தொனியை மென்மைப்படுத்தாமலும், அடுத்தடுத்த வசனங்களின் விளக்கத்தை இங்கே சேர்க்காமலும் மூலத்தின் வேறுபாட்டைப் பாதுகாக்க வேண்டும்.
translation_notes:
  register: நவீன நிலையான தமிழில், சட்ட அறிவுறுத்தலுக்கேற்ற கண்ணியமான ஆனால் எளிதில் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. இரண்டாம் நபர் ஒருமை ‘நீ’ வெளிப்படையாகக் கொடுக்கப்பட்டுள்ளது; நீண்ட எபிரெய உறவுத்தொடர் தமிழில் இயல்பாக முன்பெயரடைத் தொடராக அமைக்கப்பட்டுள்ளது.
