translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய மொழியின் சட்ட அறிவுறுத்தல் நயம் தக்கவைக்கப்பட்டுள்ளது; חלל என்ற சொல்லின் அபூர்வமான சூழல்சார் பொருள் பிரதான உரையில் தெளிவாக்கப்பட்டு, அதன் நேரடியான மாற்றுகள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளன.
