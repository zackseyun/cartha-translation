base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/020/006.yaml
  text: And who is the man who has planted a vineyard and has not yet enjoyed its fruit? Let him go and return to his house[a], lest he die in the battle and another man enjoy its fruit.
translation:
  language: ta
  text: திராட்சைத்தோட்டம் ஒன்றை நட்டு, அதன் கனியை இன்னும் அனுபவிக்காதவன்[a] யார்? அவன் புறப்பட்டுத் தன் வீட்டுக்குத் திரும்பட்டும். இல்லையெனில், அவன் போரில் இறந்துபோகவும் வேறொருவன் அதன் கனியை அனுபவிக்கவும் நேரிடலாம்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இதனை இன்னும் நேரடியாக, “அதை இன்னும் சாதாரணப் பயன்பாட்டிற்குக் கொண்டுவராதவன்” அல்லது “அதைப் பயன்படுத்தத் தொடங்காதவன்” என்றும் மொழிபெயர்க்கலாம். இங்குள்ள எபிரெய வினைச்சொல், திராட்சைத்தோட்டத்தை முதன்முறையாகச் சாதாரணப் பயன்பாட்டிற்குக் கொண்டுவருவதைக் குறிக்கிறது; ஆரம்ப ஆண்டுகளின் கட்டுப்பாடு முடிந்தபின் அதன் விளைச்சலை அனுபவிப்பது இதில் அடங்கியிருக்கலாம் (லேவியராகமம் 19:23–25-ஐ ஒப்பிடுக).
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִי הָאִישׁ
  choice: யார்?
  rationale: இது படைச்சேவையிலிருந்து விலக்கு பெறும் ஆணைப் பற்றிய வினாவாகும். அடுத்துள்ள ஒருமை ஆண்பால் வடிவமான ‘அவன்’ மூலம் ஆண் போர்வீரன் என்பது தெளிவாகிறது; தமிழில் இயல்பான வினா அமைப்புக்காக ‘யார்?’ இறுதியில் வைக்கப்பட்டுள்ளது.
- source_word: נָטַע כֶּרֶם
  choice: திராட்சைத்தோட்டம் ஒன்றை நட்டு
  rationale: முன்பே செய்து முடிக்கப்பட்டும் தற்போது பொருத்தமுடையதுமான செயலைத் தமிழில் இயல்பாகக் காட்டுகிறது.
- source_word: וְלֹא חִלְּלוֹ
  choice: அதன் கனியை இன்னும் அனுபவிக்காதவன்
  rationale: இங்கு חלל என்பது ‘தீட்டுப்படுத்துதல்’ என்ற வழக்கமான பொருளில் அல்ல; திராட்சைத்தோட்டத்தை முதன்முறையாகச் சாதாரணப் பயன்பாட்டுக்குக் கொண்டுவந்து அதன் பயனை அனுபவிப்பதைக் குறிக்கிறது. ‘கனியை அனுபவித்தல்’ இந்தச் சூழலின் நடைமுறைப் பொருளை இயல்பாகத் தெரிவிக்கிறது; ‘இன்னும்’ என்பது எதிர்பார்க்கப்பட்ட முதல் பயன்பாடு நடைபெறவில்லை என்பதை வெளிப்படுத்துகிறது.
- source_word: יֵלֵךְ וְיָשֹׁב לְבֵיתוֹ
  choice: அவன் புறப்பட்டுத் தன் வீட்டுக்குத் திரும்பட்டும்
  rationale: இச்சூழலில் வினைத் தொடர் அனுமதியுடன் கூடிய சட்ட அறிவுறுத்தலாக உள்ளது. ‘திரும்பட்டும்’ அதன் கட்டளை/அனுமதி நயத்தைத் தக்கவைக்கிறது.
- source_word: פֶּן יָמוּת בַּמִּלְחָמָה
  choice: இல்லையெனில், அவன் போரில் இறந்துபோகவும்
  rationale: פן குறிக்கும் தவிர்க்க வேண்டிய சாத்தியத்தைக் ‘இல்லையெனில்’ தெளிவாகக் காட்டுகிறது; தமிழில் இயல்பற்ற ‘அப்படி நடக்காதபடிக்கு’ போன்ற அமைப்பைத் தவிர்க்கிறது.
- source_word: וְאִישׁ אַחֵר יְחַלְּלֶנּוּ
  choice: வேறொருவன் அதன் கனியை அனுபவிக்கவும் நேரிடலாம்
  rationale: ‘வேறொருவன்’ என்பதில் אישׁ אַחֵר என்பதன் ஆண்பால் ஒருமை நிலைக்கிறது. முந்தைய חלל என்பதற்குக் கொடுக்கப்பட்ட சூழல்சார் பொருளே இங்கும் சீராகப் பயன்படுத்தப்படுகிறது; ‘நேரிடலாம்’ முழு எச்சரிக்கையையும் இயல்பான தமிழில் இணைக்கிறது.
