  source_fidelity: 'முதன்மை உரை எபிரெய வினைச்சொல் חִלְּלוֹ / יְחַלְּלֶנּוּ என்பதன் இச்சூழல்சார் பொருளைத் துல்லியமாக வெளிப்படுத்துகிறது: நட்ட திராட்சைத்தோட்டத்தின் பயனை இன்னும் அனுபவிக்காத ஆண், போருக்குச் செல்லாமல் வீட்டுக்குத் திரும்ப அனுமதிக்கப்படுகிறான்; அவன் இறந்து வேறொருவன் அதன் பயனை அனுபவிக்கக் கூடாது என்பதே காரணம். ‘கனி’ என்பது மூலத்தில் வெளிப்படையாக இல்லாவிட்டாலும், திராட்சைத்தோட்டம் பற்றிய இம்மரபுத்தொடரின் பொருளை இயல்பாகத் தெளிவாக்கும் பாதுகாப்பான விளக்கமாகும்.'
