  - severity: low
    issue: The final temporal phrase can be smoother in Tamil.
    rationale: ‘முற்றுகையின்போது உனக்கு எதிராக வர’ naturally conveys ‘come before/against you in the siege’ and preserves the rhetorical-question reading.
