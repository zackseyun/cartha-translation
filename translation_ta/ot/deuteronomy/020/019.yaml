  terminology: ‘முற்றுகையிடு,’ ‘கைப்பற்று,’ ‘கோடரி,’ and ‘வெட்டிச் சாய்’ are appropriate. The difficult final clause remains explicitly marked by a footnote, preserving legitimate interpretive ambiguity without presenting an alternative as certain.
