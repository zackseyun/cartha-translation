base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/020/019.yaml
  text: When you besiege a city for many days[a], fighting against it to capture it, you shall not destroy its trees by swinging an axe against them, for you may eat from them, and you shall not cut them down. For is the tree of the field a man, that it should come before you in the siege?
translation:
  language: ta
  text: பல நாட்கள் ஒரு நகரை முற்றுகையிட்டு, அதைக் கைப்பற்ற அதற்கு எதிராகப் போரிடும்போது, கோடரியால் அதன் மரங்களை அழிக்காதே. அவற்றிலிருந்து நீ உண்ணலாம்; அவற்றை வெட்டிச் சாய்க்காதே. முற்றுகையின்போது உனக்கு எதிராக வருவதற்கு வயல்வெளியின் மரம் மனிதனா?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மனிதன் வயல்வெளியின் மரம்,” அல்லது, “வயல்வெளியின் மரம் மனிதனுக்கு உணவு.” இறுதிக் கூறின் எபிரெய வாசகம் கடினமானது; முதன்மை உரை, மரத்தை மனிதப் பகைவனிலிருந்து வேறுபடுத்தும் வினாவாக அதை எடுத்துக்கொள்கிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: תָצוּר
  choice: முற்றுகையிடும்போது
  rationale: צור என்பதன் இராணுவச் சூழலிலான பொருளை இயல்பான நவீனத் தமிழில் நேரடியாகத் தருகிறது.
- source_word: יָמִים רַבִּים
  choice: பல நாட்கள்
  rationale: எபிரெயக் காலக் குறிப்பைச் சுருக்கமின்றி, இயல்பாகப் பாதுகாக்கிறது.
- source_word: לְהִלָּחֵם עָלֶיהָ לְתָפְשָׂהּ
  choice: அதற்கு எதிராகப் போரிட்டு ... கைப்பற்றுவதற்காக
  rationale: போரிடுவதையும் நகரைக் கைப்பற்றும் நோக்கத்தையும் தெளிவாகப் பிரித்துக் காட்டுகிறது.
- source_word: לֹא תַשְׁחִית אֶת עֵצָהּ
  choice: அதன் மரங்களை அழிக்காதே
  rationale: שׁחת என்ற வலுவான வினையின் ‘அழித்தல்’ என்ற பொருளைக் காக்கிறது; ஒருமை வடிவிலுள்ள ‘மரம்’ இங்கு தொகுப்புப் பொருளில் வருவதால் தமிழில் பன்மை இயல்பானது.
- source_word: לִנְדֹּחַ עָלָיו גַּרְזֶן
  choice: கோடரியை ஓங்கி
  rationale: ஒரு மரத்துக்கு எதிராகக் கோடரியைப் பயன்படுத்தும் எபிரெய மரபுத்தொடரை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: כִּי מִמֶּנּוּ תֹאכֵל
  choice: அவற்றிலிருந்து நீ உண்ணலாம்
  rationale: மரங்கள் உணவு தருவதால் அவற்றைக் காக்க வேண்டும் என்ற காரணத்தை வெளிப்படுத்துகிறது; மூலத்தில் இல்லாத ‘கனி’ என்ற சொல்லை முதன்மை உரையில் சேர்க்கவில்லை.
- source_word: וְאֹתוֹ לֹא תִכְרֹת
  choice: ஆகவே அவற்றை வெட்டிச் சாய்க்காதே
  rationale: மரங்களை כרת செய்வதன் வழக்கமான பொருளான ‘வெட்டிச் சாய்த்தல்’ என்பதைத் தெளிவாகத் தருகிறது; וְ இங்கு சூழலுக்கு ஏற்ற விளைவுத் தொடர்பாக ‘ஆகவே’ என வழங்கப்பட்டுள்ளது.
- source_word: הָאָדָם
  choice: மனிதன்
  rationale: இங்கு மரத்தையும் மனிதப் போராளியையும் வேறுபடுத்தும் பொதுவான மனிதக் குறிப்பாக இருப்பதால், பாலினத்தைத் தேவையின்றி வரையறுக்காத ‘மனிதன்’ பொருத்தமானது.
- source_word: עֵץ הַשָּׂדֶה
  choice: வயல்வெளியின் மரம்
  rationale: எபிரெயக் கூட்டுச்சொல் அமைப்பையும் அதன் பழமொழி போன்ற ஒலியையும் நெருக்கமாகக் காக்கிறது.
- source_word: לָבֹא מִפָּנֶיךָ בַּמָּצוֹר
  choice: முற்றுகையில் உனக்கு எதிராக வருவதற்கு
  rationale: கடினமான சொற்றொடரை மனித எதிரியுடன் மரத்தை ஒப்பிடும் வினாவாகப் புரிந்துகொண்டு, தமிழில் புரியத்தக்கதாகவும் மூலத்துக்கு நெருக்கமாகவும் தருகிறது.
theological_decisions:
- issue: כִּי הָאָדָם עֵץ הַשָּׂדֶה לָבֹא מִפָּנֶיךָ בַּמָּצוֹר என்ற கடினமான இறுதிக் கூறின் விளக்கம்
  choice: 'மனித எதிரியையும் வயல்வெளியின் மரத்தையும் வேறுபடுத்தும் வினாவாக: ‘முற்றுகையில் உனக்கு எதிராக வருவதற்கு வயல்வெளியின் மரம் மனிதனா?’'
  alternative: ‘மனிதன் வயல்வெளியின் மரம்’ அல்லது ‘வயல்வெளியின் மரம் மனிதனுடைய உணவு’ என்ற அறிவிப்புக் கூற்றுகள்
  rationale: எபிரெயத் தொடரின் தொடரியல் உண்மையிலேயே தெளிவற்றது. சூழலில் உணவு தரும் மரங்களை அழிக்கத் தடை விதிக்கப்படுவதால், முதன்மை உரை இதை மனிதப் பகைவனுக்கும் மரத்துக்கும் இடையிலான வேறுபாட்டைக் காட்டும் வினாவாக வழங்குகிறது; மற்ற சாத்தியமான வாசிப்புகள் அடிக்குறிப்பில் பாதுகாக்கப்படுகின்றன.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘முற்றுகையிடு,’ ‘வெட்டிச் சாய்’ போன்ற சொற்கள் இராணுவ மற்றும் மரவெட்டுச் சூழலைத் தெளிவாகக் காட்டுகின்றன. மூலத்தின் இறுதிக் கூறிலுள்ள தெளிவின்மை அடிக்குறிப்பில் வெளிப்படையாகப் பாதுகாக்கப்பட்டுள்ளது.
