source:
  edition: WLC
  text: וְ/הָיָ֕ה כְּ/קָֽרָבְ/כֶ֖ם אֶל הַ/מִּלְחָמָ֑ה וְ/נִגַּ֥שׁ הַ/כֹּהֵ֖ן וְ/דִבֶּ֥ר אֶל הָ/עָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/020/002.yaml
  text: And when you draw near to the battle[a], the priest shall come forward and speak to the people[b],
translation:
  language: ta
  text: நீங்கள் போருக்கு[a] நெருங்கிச் செல்லும்போது, ஆசாரியன் முன்வந்து மக்களிடம்[b] பேச வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘போர்மோதலுக்கு.’ எபிரெயச் சொல் போரைப் பொதுவாகவோ ஒரு குறிப்பிட்ட போர்மோதலையோ குறிக்கலாம்; இங்கே உடனடி மோதலை அணுகுவது சூழலாக உள்ளது.
    reason: lexical_alternative
  - marker: b
    text: இங்கே ‘மக்கள்’ என்பது திரண்டிருந்த இஸ்ரவேல் போர்வீரர்களைக் குறிக்கிறது. எனினும், எபிரெயம் ‘படைவீரர்கள்’ போன்ற குறுகிய இராணுவச் சொல்லுக்குப் பதிலாகப் பரந்த பொருளுள்ள ‘மக்கள்’ என்ற சொல்லையே பயன்படுத்துகிறது.
    reason: cultural_note
lexical_decisions:
- source_word: וְהָיָה כְּקָרָבְכֶם
  choice: நீங்கள் ... நெருங்கிச் செல்லும்போது
  rationale: וְהָיָה என்பதுடன் வரும் காலத்தைக் குறிக்கும் infinitive அமைப்பு எதிர்காலச் சூழலை அறிமுகப்படுத்துகிறது. தமிழில் இயல்பாகவும் மூலத்தின் அணுகிச் செல்லும் இயக்கத்தைக் காக்கவும் இவ்வாறு மொழிபெயர்க்கப்பட்டது.
- source_word: אֶל הַמִּלְחָמָה
  choice: போருக்கு
  rationale: מִלְחָמָה என்பது போர் பொதுவாகவோ குறிப்பிட்ட போர்மோதலாகவோ அமையலாம். உடனடி மோதலை அணுகும் சூழலில் ‘போருக்கு’ இயல்பானது; அதன் பொருள் விரிவை அடிக்குறிப்பு காக்கிறது.
- source_word: וְנִגַּשׁ
  choice: முன்வந்து
  rationale: נגשׁ என்பதன் அடிப்படைப் பொருள் ‘அணுகுதல்/நெருங்குதல்.’ மக்களிடம் உரையாற்ற ஆசாரியன் முன்னே வருவதை ‘முன்வந்து’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: הַכֹּהֵן
  choice: ஆசாரியன்
  rationale: மூலத்தில் உள்ள குறிப்பிட்ட ஒருமைப் பெயர்ச்சொல்லை விரிவாக்கமின்றி நேரடியாகக் கொடுக்கிறது.
- source_word: וְדִבֶּר
  choice: பேச வேண்டும்
  rationale: Piel வடிவிலுள்ள דבר என்பதன் இயல்பான பொருள் ‘பேசுதல்.’ எபிரெய எதிர்காலச் சட்டச் சூழலை நவீன தமிழில் ‘வேண்டும்’ எனத் தெளிவாகக் கொடுக்கிறது.
- source_word: אֶל הָעָם
  choice: மக்களிடம்
  rationale: הָעָם என்பதன் பரந்த பொருளான ‘மக்கள்’ என்பதைக் காக்கிறது; சூழலில் அது திரண்டுள்ள இஸ்ரவேல் போர்வீரர்களைக் குறித்தாலும் ‘படைவீரர்கள்’ என்று குறுக்கப்படவில்லை.
