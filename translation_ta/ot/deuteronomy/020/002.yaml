translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான நடையைப் பயன்படுத்துகிறது. ‘போருக்கு நெருங்கிச் செல்லும்போது’ என்பது மூலத்தின் இயக்கத்தை காக்கிறது; ‘மக்கள்’ என்பது எபிரெயச் சொல்லின் பரந்த உடன்படிக்கைச் சமூகச் சாயலைச் சுருக்காமல் வைக்கிறது.
