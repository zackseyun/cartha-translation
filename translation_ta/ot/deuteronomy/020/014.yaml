base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/020/014.yaml
  text: Only the women[a], the little children, the livestock, and everything that is in the city—all its spoil—you may take as plunder for yourself; and you may eat the spoil of your enemies, which Yahweh your God has given you.
translation:
  language: ta
  text: பெண்களையும் சிறு குழந்தைகளையும் கால்நடைகளையும் நகரத்தில் உள்ள அனைத்தையும்—அதன் கொள்ளைப்பொருள் முழுவதையும்—மட்டுமே நீ உனக்காகக் கொள்ளைப் பொருளாக எடுத்துக்கொள்ளலாம். உன் தேவனாகிய யாவே உனக்குக் கொடுத்த உன் பகைவர்களின் கொள்ளைப்பொருளை நீ உண்ணலாம்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உன் பகைவர்களின் கொள்ளைப்பொருளை நீ பயன்படுத்திக்கொள்ளலாம்.” எபிரெய வினைச்சொல்லின் நேரடிப் பொருள் “உண்”; இங்கு அது கைப்பற்றப்பட்டதைப் பயன்படுத்துவதையோ நுகர்வதையோ விரிவாகக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: רַק
  choice: மட்டும்
  rationale: முந்தைய கட்டளைக்கு விதிவிலக்காக இங்கு அனுமதிக்கப்படுவதை வரையறுக்கும் எபிரெயச் சொல்லின் கட்டுப்படுத்தும் பொருளைப் பாதுகாக்கிறது.
- source_word: הַנָּשִׁים
  choice: பெண்கள்
  rationale: பெண்களைத் தெளிவாகக் குறிக்கும் பன்மைப் பெயர்ச்சொல்லின் நேரடியான மொழிபெயர்ப்பு.
- source_word: הַטַּף
  choice: சிறு குழந்தைகள்
  rationale: טַף பொதுவாக இளம் குழந்தைகளையோ குடும்பத்தைச் சார்ந்த சிறியவர்களையோ குறிக்கிறது; இங்கு வயதுச் சிறுமையைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: הַבְּהֵמָה
  choice: கால்நடைகள்
  rationale: போர்க் கொள்ளையின் சூழலில் உடைமையாகக் கருதப்பட்ட வீட்டுவளர்ப்பு விலங்குகளை இயல்பாகக் குறிக்கிறது.
- source_word: וְכֹל אֲשֶׁר יִהְיֶה בָעִיר
  choice: நகரத்தில் உள்ள அனைத்தும்
  rationale: நகரத்தில் எஞ்சியுள்ள பொருட்கள் அனைத்தையும் உள்ளடக்கும் விரிவான சொற்றொடரைப் பாதுகாக்கிறது.
- source_word: כָּל שְׁלָלָהּ
  choice: அதன் கொள்ளைப்பொருள் முழுவதும்
  rationale: שָׁלָל என்பது போரில் கைப்பற்றப்படும் பொருட்களைக் குறிக்கிறது; ‘முழுவதும்’ என்பது כָּל என்பதன் முழுமையான அளவை வெளிப்படுத்துகிறது.
- source_word: תָּבֹז לָךְ
  choice: நீ உனக்காகக் கொள்ளையிட்டுக்கொள்ளலாம்
  rationale: בָּזַז என்பதன் ‘கொள்ளையிடு’ என்ற பொருளையும் לָךְ என்பதன் தனக்கான பயன் உணர்வையும் பாதுகாக்கிறது; சட்ட அறிவுறுத்தல் சூழலில் ‘லாம்’ அனுமதியை வெளிப்படுத்துகிறது.
- source_word: וְאָכַלְתָּ אֶת שְׁלַל אֹיְבֶיךָ
  choice: உன் பகைவர்களின் கொள்ளைப்பொருளை நீ உண்ணலாம்
  rationale: אָכַל என்பதன் நேரடியான ‘உண்’ என்ற உருவகச் சொல்லைத் தக்கவைக்கிறது; சூழலில் அது கைப்பற்றியவற்றைப் பயன்படுத்துவதையும் அனுபவிப்பதையும் விரிவாகக் குறிக்கக்கூடும்.
- source_word: יְהוָה
  choice: யாவே
  rationale: திருநான்கெழுத்துப் பெயரைப் பொதுப்பட்டமாக மாற்றாமல், தமிழில் அறியப்பட்ட ஒலிபெயர்ப்பால் தனிப்பெயராக வழங்குகிறது.
- source_word: אֱלֹהֶיךָ
  choice: உன் தேவன்
  rationale: இரண்டாம் நபர் ஒருமை உடைமைத் தொடர்புடன் வரும் உடன்படிக்கைச் சொற்றொடரை இயல்பான தமிழில் தருகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழியாக்கம்
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலத்தில் பொதுப்பட்டம் அல்லாமல் இறைவனின் தனிப்பெயர் நேரடியாக உள்ளது; ஆகவே அதைத் தமிழில் ஒலிபெயர்த்துப் பாதுகாக்கிறது.
- issue: சட்ட அறிவுறுத்தலில் இரண்டாம் நபர் வினைகளின் வலிமை
  choice: அனுமதியைக் காட்டும் ‘கொள்ளையிட்டுக்கொள்ளலாம்’ மற்றும் ‘உண்ணலாம்’
  alternative: கட்டளையைக் காட்டும் ‘கொள்ளையிட்டுக்கொள்’ மற்றும் ‘உண்’
  rationale: இச்சூழலில் வினைகள் போர்க் கொள்ளையை எடுத்துக்கொள்ள அதிகாரம் அளிக்கின்றன; அவற்றை கட்டாயக் கட்டளைகளாக மிகைப்படுத்தாமல் அனுமதிப் பொருளில் தருவது பொருத்தமானது.
translation_notes:
  register: நவீனத் தரத் தமிழில், ஒருமை நேரடி அழைப்பையும் சட்ட அறிவுறுத்தலின் கண்ணியமான நடையையும் காக்கிறது. ‘உண்ணலாம்’ என்பது மூல உருவகத்தைத் தக்கவைக்கிறது; அதன் விரிவான பொருள் அடிக்குறிப்பில் வழங்கப்பட்டுள்ளது. ஆங்கில ஆலோசனை உரையில் அடிக்குறி பெண்கள் என்பதற்குப் பின் இருந்தாலும், அதன் உள்ளடக்கம் אָכַל என்ற வினையைப் பற்றியது என்பதால் தமிழில் உரிய இடமான ‘உண்ணலாம்’ என்பதற்குப் பின் வைக்கப்பட்டுள்ளது.
