  to: பெண்களையும் சிறு குழந்தைகளையும் கால்நடைகளையும் நகரத்தில் உள்ள அனைத்தையும்—அதன் கொள்ளைப்பொருள் முழுவதையும்—மட்டுமே நீ உனக்காகக் கொள்ளைப் பொருளாக எடுத்துக்கொள்ளலாம். உன் தேவனாகிய யாவே உனக்குக் கொடுத்த உன் பகைவர்களின் கொள்ளைப்பொருளை நீ உண்ணலாம்[a].
  rationale: The revision preserves the Hebrew's restrictive exception, comprehensive reference to the city's spoil, permissive instructional force, and literal ‘eat.’ It improves modern Tamil word order and replaces a redundant plundering expression with an idiomatic equivalent without changing the passage's meaning. The footnote remains attached to ‘உண்ணலாம்,’ the term it explains.
