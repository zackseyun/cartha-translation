source:
  edition: WLC
  text: וְ/הָיָ֛ה כְּ/כַלֹּ֥ת הַ/שֹּׁטְרִ֖ים לְ/דַבֵּ֣ר אֶל הָ/עָ֑ם וּ/פָֽקְד֛וּ שָׂרֵ֥י צְבָא֖וֹת בְּ/רֹ֥אשׁ הָ/עָֽם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/020/009.yaml
  text: And when the officers have finished speaking to the people[a], they shall appoint commanders of armies at the head of the people.
translation:
  language: ta
  text: அதிகாரிகள் மக்களிடம் பேசி முடித்ததும், அவர்கள் படைகளின் தளபதிகளை மக்களின் தலைவர்களாக நியமிக்க வேண்டும்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘படைகளின் தளபதிகளை மக்கள்மேல் பொறுப்பில் அமர்த்த வேண்டும்’ என்றும் மொழிபெயர்க்கலாம். இங்குள்ள எபிரெய வினைச்சொல், சூழலுக்கேற்ப நியமித்தல், அணிதிரட்டுதல் அல்லது பொறுப்பில் அமர்த்துதல் ஆகிய பொருள்களைத் தரலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה כְּכַלֹּת
  choice: பேசி முடித்ததும்
  rationale: וְהָיָה என்பதுடன் כְּ + כלה வினையெச்சம் இணைந்து, முதல் செயல் முடிந்ததும் அடுத்த செயல் நடைபெறுவதைச் சுட்டுகிறது. நவீன தமிழில் ‘முடித்ததும்’ இதை இயல்பாகத் தெரிவிக்கிறது.
- source_word: הַשֹּׁטְרִים
  choice: அதிகாரிகள்
  rationale: உபாகமத்தின் சூழலில் இவர்கள் மக்களிடம் அறிவித்து அவர்களை ஒழுங்குபடுத்தும் நிர்வாகப் பொறுப்பாளர்கள். ‘எழுத்தர்கள்’ என்பது பொருளைத் தேவையின்றிக் குறுக்கிவிடும்.
- source_word: לְדַבֵּר אֶל־הָעָם
  choice: மக்களிடம் பேசி
  rationale: עָם என்பதற்கு ‘மக்கள்’ என்ற பொதுவான பொருளையே தக்கவைக்கிறது; இராணுவச் சூழல் இருந்தாலும் ‘படைவீரர்கள்’ என்று மிகையாகக் குறிப்பாக்கவில்லை.
- source_word: וּפָקְדוּ
  choice: அவர்கள் ... நியமிக்க வேண்டும்
  rationale: פקד என்பதற்குப் பல பொருள்கள் இருந்தாலும், தளபதிகளையும் அவர்களுடைய தலைமை நிலையையும் குறிக்கும் இச்சூழலில் ‘நியமிக்க’ என்பது முதன்மைப் பொருளைத் தெளிவாகத் தருகிறது. மூன்றாம் நபர் பன்மை வடிவம் ‘அவர்கள்’ என்று வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: שָׂרֵי צְבָאוֹת
  choice: படைகளின் தளபதிகளை
  rationale: שָׂרֵי என்பது தலைவர்கள் அல்லது தளபதிகள் என்றும், צְבָאוֹת இங்கு படைப் பிரிவுகள் அல்லது படைகள் என்றும் பொருள்படும். இந்தத் தமிழ் சொற்றொடர் இரு கூறுகளையும் காக்கிறது.
- source_word: בְּרֹאשׁ הָעָם
  choice: மக்களுக்குத் தலைமை தாங்கும்படி
  rationale: எழுத்துப்படி ‘மக்களின் தலையில்/முன்னிலையில்’ எனும் எபிரெய உருவகம் தலைமைப் பொறுப்பைக் குறிக்கிறது. ‘தலைமை தாங்கும்படி’ அதன் செயல்பாட்டை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
