translation_notes:
  register: நவீனத் தரத்தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையில் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. இராணுவச் சூழலைத் தெளிவாக வைத்தபோதும், எபிரெய עָם என்பதைக் ‘படைவீரர்கள்’ என்று குறிப்பாக்காமல் ‘மக்கள்’ என்றே வழங்குகிறது.
