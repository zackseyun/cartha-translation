- from: அதிகாரிகள் மக்களிடம் பேசி முடித்ததும், அவர்கள் படைகளின் தளபதிகளை மக்களுக்குத் தலைமை தாங்கும்படி நியமிக்க வேண்டும்.[a]
  to: அதிகாரிகள் மக்களிடம் பேசி முடித்ததும், அவர்கள் படைகளின் தளபதிகளை மக்களின் தலைவர்களாக நியமிக்க வேண்டும்.[a]
