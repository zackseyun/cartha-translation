revisions:
- from: அது உனக்குச் சமாதானம் என்று பதிலளித்து[a], உனக்குத் திறந்தால், அதில் காணப்படும் மக்கள் அனைவரும் உனக்குக் கட்டாய உழைப்பு செய்ய வேண்டியவர்களாகி[b], உனக்குப் பணிசெய்வார்கள்.
  to: அது உனக்குச் சமாதானமாகப் பதிலளித்து[a], உனக்குத் திறந்தால், அதில் காணப்படும் மக்கள் அனைவரும் உனக்குக் கட்டாய உழைப்பு செய்ய வேண்டியவர்களாகி[b], உனக்குப் பணிசெய்வார்கள்.
  rationale: The revision preserves the draft’s faithful treatment of the ancient warfare-law context and its explicit compulsory service. It makes the peace-response idiom more exact in Tamil and removes an unsupported governmental qualification from the lexical footnote. Footnote anchors remain attached to the respective expressions they explain.
