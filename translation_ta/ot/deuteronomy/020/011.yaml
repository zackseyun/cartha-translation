  text: וְ/הָיָה֙ אִם שָׁל֣וֹם תַּֽעַנְ/ךָ֔ וּ/פָתְחָ֖ה לָ֑/ךְ וְ/הָיָ֞ה כָּל הָ/עָ֣ם הַ/נִּמְצָא בָ֗/הּ יִהְי֥וּ לְ/ךָ֛ לָ/מַ֖ס וַ/עֲבָדֽוּ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/020/011.yaml
  text: And if it answers you with peace and opens to you[b][a], then all the people found in it shall become forced labor for you and shall serve you.
translation:
  language: ta
  text: அது உனக்குச் சமாதானமாகப் பதிலளித்து[a], உனக்குத் திறந்தால், அதில் காணப்படும் மக்கள் அனைவரும் உனக்குக் கட்டாய உழைப்பு செய்ய வேண்டியவர்களாகி[b], உனக்குப் பணிசெய்வார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘சமாதான நிபந்தனைகளுடன் உனக்குப் பதிலளித்து.’
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘உனக்குத் திறை உழைப்பு செய்யக் கடமைப்பட்டவர்களாகி.’ எபிரெயச் சொல் מַס என்பது வரி, திறை அல்லது கட்டாய உழைப்பைக் குறிக்கலாம்; இச்சூழலில் கட்டாய உழைப்புச் சேவை என்பது பொருத்தமாகத் தெரிகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁלוֹם
  choice: சமாதானம்
  rationale: இச்சொல் அடிப்படையில் ‘சமாதானம், நல்வாழ்வு’ என்பதைக் குறிக்கிறது. போர்ச் சூழலில் முன்வைக்கப்பட்ட சமாதான அழைப்பை ஏற்கும் பதிலை இங்கு குறிக்கிறது; பெயர்ச்சொல் வடிவம் தமிழிலும் தக்கவைக்கப்பட்டுள்ளது.
- source_word: תַּעַנְךָ
  choice: உனக்குப் பதிலளித்து
  rationale: ענה என்பதன் நேரடியான பொருள் ‘பதிலளி’. நகரம் ஒருமை எழுவாயாகச் சித்தரிக்கப்படுவதையும் இத்தேர்வு காக்கிறது.
- source_word: וּפָתְחָה לָךְ
  choice: உனக்குத் திறந்தால்
  rationale: எபிரெய வினைச்சொல் வெறுமனே ‘திற’ என்றே கூறுகிறது. நகரவாசல்கள் கருத்தில் இருக்கலாம்; ஆனால் அவை மூலத்தில் வெளிப்படையாகக் குறிப்பிடப்படாததால் மொழிபெயர்ப்பிலும் சேர்க்கப்படவில்லை.
- source_word: הָעָם הַנִּמְצָא בָהּ
  choice: அதில் காணப்படும் மக்கள் அனைவரும்
  rationale: נמצא என்ற பங்கெச்சத்தின் ‘காணப்படுகிற’ என்ற வடிவத்தை இயல்பான நவீனத் தமிழில் தக்கவைக்கிறது.
- source_word: לָמַס
  choice: கட்டாய உழைப்பு செய்ய வேண்டியவர்களாகி
  rationale: מַס என்பது வரி, திறை அல்லது அரசுக்கான கட்டாய உழைப்பைக் குறிக்கலாம். தொடர்ந்து வரும் ‘பணிசெய்வார்கள்’ என்பதும் இங்கு கட்டாய உழைப்புச் சேவையைக் குறிப்பதை ஆதரிக்கிறது; தமிழில் அதன் நிர்ப்பந்தத் தன்மை தெளிவாகத் தெரிவிக்கப்படுகிறது.
- source_word: וַעֲבָדוּךָ
  choice: உனக்குப் பணிசெய்வார்கள்
  rationale: עבד என்பதன் பொதுவான பொருள் ‘பணிசெய், சேவைசெய்’. மூலத்தில் இல்லாத குறிப்பிட்ட அடிமை நிறுவனத்தைச் சேர்க்காமல் கீழ்ப்பட்ட சேவை உறவை இது வெளிப்படுத்துகிறது.
theological_decisions:
- issue: போர்ச் சட்டத்தில் கீழ்ப்படுத்துதலைக் குறிக்கும் மொழி
  choice: கட்டாய உழைப்பின் நேரடியான பொருளைத் தக்கவைத்தல்
  alternative: ‘உனக்குத் திறை செலுத்திப் பணிசெய்வார்கள்’ என்று மொழிபெயர்த்தல்
  rationale: சமாதானத்தை ஏற்றுக்கொள்ளும் நகரத்தார்மீதும் திணிக்கப்படும் உழைப்பை வசனம் விவரிக்கிறது. מַס என்பதின் நிர்ப்பந்தத் தன்மையை மென்மையாக்காமலும், மூலத்தைவிட மிகக் குறிப்பான சமூக நிறுவனத்தைப் புகுத்தாமலும் மொழிபெயர்க்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டுள்ளது. ‘சமாதானம்’, ‘திறந்தால்’ ஆகியவை மூலத்தின் சுருக்கத்தையும் பொருள் திறப்பையும் காக்கின்றன; ‘கட்டாய உழைப்பு’ போர்ச் சூழலின் கடுமையை மறைக்காமல் தெரிவிக்கிறது.
