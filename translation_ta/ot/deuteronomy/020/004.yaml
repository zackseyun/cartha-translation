base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/020/004.yaml
  text: For Yahweh your God is the one who goes with you to fight for you against your enemies[a], to save you.
translation:
  language: ta
  text: ஏனெனில், உங்கள் கடவுளாகிய யாவே உங்களோடு சென்று, உங்கள் பகைவர்களுக்கு எதிராக உங்களுக்காகப் போரிட்டு உங்களை மீட்பவரே.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உங்களைக் காப்பாற்றுபவரே” அல்லது “உங்களுக்கு வெற்றி அளிப்பவரே.” எபிரேய வினை மீட்பு அல்லது விடுதலையைக் குறிக்கலாம்; இங்கு அது போர்ச் சூழலில் வருகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய அறிவுறுத்தலுக்கான காரணத்தை அறிமுகப்படுத்துவதால், விளக்கக் காரணப் பொருளை இயல்பாகக் காட்டுகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இது இஸ்ரவேலின் கடவுளுடைய தனிப்பெயராகிய நான்கெழுத்துத் திருப்பெயர்; பட்டப்பெயராக மாற்றாமல் ஒலிபெயர்க்கப்படுகிறது.
- source_word: אֱלֹהֵיכֶם
  choice: உங்கள் கடவுளாகிய
  rationale: இரண்டாம் நபர் பன்மை உடைமை விகுதியுடன் உள்ள இணைப்புநிலையைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: הַהֹלֵךְ עִמָּכֶם
  choice: உங்களோடு செல்கிறார்
  rationale: எபிரேய நிகழ்காலப் பங்கேற்பு வடிவத்தின் தொடரும்/விளக்கப் பொருளை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: לְהִלָּחֵם לָכֶם
  choice: உங்களுக்காகப் போரிட்டு
  rationale: போரிடுதல் மற்றும் பயனாளிப் பொருளைக் குறிக்கும் ‘உங்களுக்காக’ ஆகிய இரண்டையும் தெளிவாகக் காக்கிறது.
- source_word: עִם אֹיְבֵיכֶם
  choice: உங்கள் பகைவர்களுக்கு எதிராக
  rationale: போர் சூழலில் עִם எதிர்ப்பைக் குறிக்கிறது; தமிழில் ‘எதிராக’ என்பதே பொருளைத் தெளிவாக்குகிறது.
- source_word: לְהוֹשִׁיעַ אֶתְכֶם
  choice: உங்களை மீட்பதற்காக
  rationale: ישׁע வினையின் காப்பாற்றுதல்/விடுவித்தல் என்ற பரந்த பொருளையும் இங்குள்ள போர்ச் சூழலையும் இயல்பாக இணைக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலத்தில் பட்டப்பெயர் அல்ல, கடவுளுடைய தனிப்பெயர் நேரடியாக உள்ளது; ஆகவே அதைத் தமிழ் ஒலியமைப்புக்கு ஏற்ப ‘யாவே’ என்று ஒலிபெயர்ப்பது மூல வேறுபாட்டைக் காக்கிறது.
- issue: போர்ச் சூழலில் לְהוֹשִׁיעַ என்பதன் பரப்பு
  choice: உங்களை மீட்பதற்காக
  alternative: உங்களைக் காப்பாற்றுவதற்காக / உங்களுக்கு வெற்றி அளிப்பதற்காக
  rationale: வினை வெற்றியை மட்டும் அல்லாமல் ஆபத்திலிருந்து விடுவித்தல், காப்பாற்றுதல் ஆகியவற்றையும் குறிக்கக்கூடும். ‘மீட்பது’ அந்தப் பரந்த பொருளையும் இறையியல் எதிரொலியையும் காக்கிறது; அடிக்குறிப்பு போர்ச் சூழலிலுள்ள மாற்றுப் பொருள்களைத் தருகிறது.
translation_notes:
  register: நவீன செந்தமிழ் சார்ந்த, பொதுவாசகர்களுக்குப் புரியும் மரியாதையான நடை. எபிரேயப் பங்கேற்பின் விளக்கத் தன்மையை ‘செல்கிறார்’ என்றும், நோக்கத்தைக் காட்டும் இரு தொடர்களையும் தமிழில் இயல்பான வரிசையில் அமைத்தும் வழங்கப்பட்டுள்ளது.
