revisions:
- from: மாறாக, ஏத்தியர், எமோரியர், கானானியர், பெரிசியர், ஏவியர், எபூசியர் ஆகிய அவர்களை முற்றிலும் அழிவுக்கென்று ஒப்புக்கொடுத்துவிட வேண்டும்[a]; உங்கள் கடவுளாகிய யாவே உங்களுக்குக் கட்டளையிட்டபடியே செய்ய வேண்டும்.
  to: மாறாக, உங்கள் கடவுளாகிய யாவே உங்களுக்குக் கட்டளையிட்டபடியே, ஏத்தியர், எமோரியர், கானானியர், பெரிசியர், ஏவியர், எபூசியர் ஆகிய அவர்களை அழிவுக்கென்று முற்றாக ஒப்புக்கொடுக்க வேண்டும்[a].
