base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/020/017.yaml
  text: Instead[a], you must utterly destroy them—the Hittites, the Amorites, the Canaanites, the Perizzites, the Hivites, and the Jebusites—as Yahweh your God has commanded you.
translation:
  language: ta
  text: மாறாக, உங்கள் கடவுளாகிய யாவே உங்களுக்குக் கட்டளையிட்டபடியே, ஏத்தியர், எமோரியர், கானானியர், பெரிசியர், ஏவியர், எபூசியர் ஆகிய அவர்களை அழிவுக்கென்று முற்றாக ஒப்புக்கொடுக்க வேண்டும்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “அவர்களை முற்றாக அழிவுக்கென ஒதுக்கிவிட வேண்டும்.” இந்த வினைச்சொல் அவர்களை முழுமையாக அழிவுக்கென அர்ப்பணிப்பதைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: மாறாக
  rationale: முந்தைய வசனத்தில் தொலைதூர நகரங்களுக்கு வழங்கப்பட்ட விதிக்கு மாறான கட்டளையை இங்கு அறிமுகப்படுத்துவதால், எதிர்மறைத் தொடர்பை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: הַחֲרֵם תַּחֲרִימֵם
  choice: அவர்களை முற்றிலும் அழிவுக்கென்று ஒப்புக்கொடுத்துவிட வேண்டும்
  rationale: வினையெச்சத்தின் மூலவடிவமும் வரையறுக்கப்பட்ட வினையும் சேர்ந்த அமைப்பு கட்டளையை வலுப்படுத்துகிறது. חרם என்பது சாதாரணமாகக் கொல்வதை மட்டும் அல்லாமல், தெய்வீகத் தடையின் கீழ் முழுமையாக அழிவுக்கு அர்ப்பணிப்பதையும் குறிக்கிறது.
- source_word: הַחִתִּי
  choice: ஏத்தியர்
  rationale: இந்த இனக்குழுவுக்கான தமிழில் வழக்கிலுள்ள பெயர்.
- source_word: וְהָאֱמֹרִי
  choice: எமோரியர்
  rationale: இந்த இனக்குழுவுக்கான தமிழில் வழக்கிலுள்ள பெயர்.
- source_word: הַכְּנַעֲנִי
  choice: கானானியர்
  rationale: இந்த இனக்குழுவுக்கான தமிழில் வழக்கிலுள்ள பெயர்.
- source_word: וְהַפְּרִזִּי
  choice: பெரிசியர்
  rationale: இந்த இனக்குழுவுக்கான தமிழில் வழக்கிலுள்ள பெயர்.
- source_word: הַחִוִּי
  choice: ஏவியர்
  rationale: இந்த இனக்குழுவுக்கான தமிழில் வழக்கிலுள்ள பெயர்.
- source_word: וְהַיְבוּסִי
  choice: எபூசியர்
  rationale: இந்த இனக்குழுவுக்கான தமிழில் வழக்கிலுள்ள பெயர்.
- source_word: כַּאֲשֶׁר
  choice: கட்டளையிட்டபடியே
  rationale: ஒப்புமையையும் கொடுக்கப்பட்ட கட்டளைக்கு இணங்கச் செய்வதையும் இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: צִוְּךָ
  choice: உங்களுக்குக் கட்டளையிட்ட
  rationale: முன்னரே வழங்கப்பட்டு இப்போதும் அதிகாரமுள்ள கட்டளையைத் தெளிவாகக் குறிக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரை ஒரு பட்டப்பெயரால் மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: אֱלֹהֶיךָ
  choice: உங்கள் கடவுளாகிய
  rationale: உடன்படிக்கைச் சார்ந்த இரண்டாம் நபர் ஒருமைத் தொடர்பை மரியாதைமிக்க இயல்பான தமிழில் தருகிறது.
theological_decisions:
- issue: போர்க்கட்டளையில் חרם என்பதன் பொருள்
  choice: முற்றிலும் அழிவுக்கென்று ஒப்புக்கொடுத்துவிட வேண்டும்
  alternative: முற்றிலும் அழித்துவிட வேண்டும்
  rationale: எபிரெயச் சொல் முழுமையான அழிவை மட்டுமல்லாமல், கடவுளின் கட்டளையின்படி தடைக்குள் வைத்து அழிவுக்கு அர்ப்பணிக்கும் சட்ட-வழிபாட்டுச் சார்ந்த நுணுக்கத்தையும் கொண்டுள்ளது. முதன்மை உரை அந்த நுணுக்கத்தைப் பாதுகாக்கிறது; அடிக்குறிப்பு நேரடியான மாற்றை விளக்குகிறது.
- issue: יְהוָה என்ற தெய்வீகப் பெயர்
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூலத்தில் உள்ள தனிப்பட்ட உடன்படிக்கைப் பெயரைப் பட்டப்பெயராக மாற்றாமல் ஒலிபெயர்த்து வழங்குகிறது.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. இனப்பெயர்கள் தமிழில் நிலைபெற்ற வேதாகம வடிவங்களில் தரப்பட்டுள்ளன. மூலத்தின் இரண்டாம் நபர் ஒருமை தமிழில் மரியாதைப் பன்மையாக வெளிப்படுத்தப்பட்டுள்ளது; கட்டளையின் தீவிரமும் חרם என்பதன் சட்ட-வழிபாட்டுச் சார்ந்த நுணுக்கமும் பாதுகாக்கப்பட்டுள்ளன.
