base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/020.yaml
  text: You shall fear Yahweh your God[a]; him you shall serve, to him you shall cling[b], and by his name you shall swear.
translation:
  language: ta
  text: உன் கடவுளாகிய யாவேக்கு நீ அஞ்ச வேண்டும்[a]. அவரையே நீ சேவிக்க வேண்டும்; அவரைப் பற்றிக்கொண்டிருக்க வேண்டும்[b]; அவருடைய பெயரால் சத்தியம் செய்ய வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘பயபக்தியுடன் அஞ்ச வேண்டும்.’ உடன்படிக்கைச் சூழலில் எபிரெய வினை அச்சத்தோடு கலந்த மரியாதையையும் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘அவரோடு உறுதியாக இணைந்திருக்க வேண்டும்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: யாவே
  rationale: இது இஸ்ரவேலின் கடவுளுடைய தனிப்பட்ட பெயரின் தமிழொலிபெயர்ப்பு; ‘ஆண்டவர்’ என்ற பட்டத்தால் அதை மாற்றவில்லை.
- source_word: אֱלֹהֶיךָ
  choice: உன் கடவுள்
  rationale: இரண்டாம் நபர் ஆண்பால் ஒருமை பின்னொட்டுடன் வரும் உடன்படிக்கைச் சொல்லை நேரடியாகவும் இயல்பாகவும் தருகிறது.
- source_word: תִּירָא
  choice: நீ அஞ்ச வேண்டும்
  rationale: ירא என்பதன் அடிப்படைப் பொருளான அச்சத்தைத் தக்கவைக்கிறது; இச்சூழலில் அதில் பயபக்தியும் அடங்குவதால் அதைக் காலடிக்குறிப்பில் சுட்டுகிறது.
- source_word: אֹתוֹ תַעֲבֹד
  choice: அவரையே நீ சேவிக்க வேண்டும்
  rationale: முன்னிலைப்படுத்தப்பட்ட நேரடிச் செயப்படுபொருளின் வலியுறுத்தலை ‘அவரையே’ என்பதும், עבד என்பதன் முதன்மைப் பொருளை ‘சேவிக்க’ என்பதும் காக்கின்றன.
- source_word: וּבוֹ תִדְבָּק
  choice: அவரைப் பற்றிக்கொண்டிருக்க வேண்டும்
  rationale: דבק உடன் வரும் ב ஒருவரோடு நெருக்கமாக இணைந்திருப்பதையும் உண்மையோடு நிலைத்திருப்பதையும் குறிக்கிறது; தமிழ் மரபில் இயல்பான உருவகத்தை இச்சொற்றொடர் காக்கிறது.
- source_word: וּבִשְׁמוֹ תִּשָּׁבֵעַ
  choice: அவருடைய பெயரால் நீ ஆணையிட வேண்டும்
  rationale: நிபால் வடிவிலுள்ள שבע உடன் வரும் இந்த எபிரெய மரபுத்தொடர் ஒருவருடைய பெயரை முன்வைத்து உறுதிமொழி கூறுவதைக் குறிக்கிறது.
theological_decisions:
- issue: உடன்படிக்கை சார்ந்த கட்டளைகளாக வரும் எபிரெய முற்றுப்பெறா வினைகள்
  choice: ‘நீ ... வேண்டும்’ என்ற கட்டளை வலுவுள்ள அமைப்பைத் தொடர்ச்சியாகப் பயன்படுத்துதல்
  alternative: ‘அஞ்சு; சேவை செய்; பற்றிக்கொள்; ஆணையிடு’ என்ற நேரடி ஏவல் வடிவம்
  rationale: சட்டப்பூர்வமான அறிவுறுத்தலின் கட்டளை வலிமையையும், ஒருமை நபருக்கான உடன்படிக்கை அழைப்பையும் இயல்பான நவீன தமிழில் தக்கவைக்கிறது.
- issue: ירא என்பதில் அச்சமும் பயபக்தியும் இணைந்திருத்தல்
  choice: முதன்மை உரையில் ‘அஞ்ச’ என்று வைத்து, பயபக்தி நுணுக்கத்தைக் காலடிக்குறிப்பில் காட்டுதல்
  alternative: முதன்மை உரையிலேயே ‘பயபக்தி கொள்ள’ என்று மொழிபெயர்த்தல்
  rationale: மூலச்சொல்லின் உண்மையான அர்த்த இழுப்பை மென்மையாக்காமல், உடன்படிக்கைச் சூழலின் பயபக்தி நுணுக்கத்தையும் வாசகருக்குத் தெரிவிக்கிறது.
translation_notes:
  register: நவீனத் தரமான, மரியாதைமிக்க, பொதுவாசகருக்குப் புரியும் தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘அவரையே’ என்பது எபிரெயச் சொல்லொழுங்கின் வலியுறுத்தலைக் காக்கிறது; குறுங்கூற்றுகளும் அரைப்புள்ளிகளும் மூலத்தின் தொடர்ச்சியான உடன்படிக்கைக் கட்டளைகளைத் தெளிவாக்குகின்றன.
