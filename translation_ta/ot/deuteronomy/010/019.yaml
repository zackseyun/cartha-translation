revisions:
- from: ஆகவே, அந்நியரிடம்[a] அன்புகூருங்கள்; ஏனெனில், நீங்களும் எகிப்து நாட்டில் அந்நியர்களாக இருந்தீர்கள்.
  to: ஆகவே அந்நியரை அன்புகூருங்கள்; ஏனெனில் நீங்களும் எகிப்து நாட்டில் அந்நியர்களாக இருந்தீர்கள்.
  rationale: The revision makes the commanded person a direct object, matching the Hebrew construction more closely while preserving fluent modern Tamil. The footnote is clarified to identify ger as a non-Israelite living among Israel. No doctrinal interpretation is added, and the causal historical motivation remains intact.
