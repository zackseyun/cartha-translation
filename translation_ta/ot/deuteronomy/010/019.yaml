source:
  edition: WLC
  text: וַ/אֲהַבְתֶּ֖ם אֶת הַ/גֵּ֑ר כִּֽי גֵרִ֥ים הֱיִיתֶ֖ם בְּ/אֶ֥רֶץ מִצְרָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/019.yaml
  text: So love the foreigner[a], because you were foreigners in the land of Egypt.
translation:
  language: ta
  text: ஆகவே அந்நியரை அன்புகூருங்கள்; ஏனெனில் நீங்களும் எகிப்து நாட்டில் அந்நியர்களாக இருந்தீர்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַ/אֲהַבְתֶּם
  choice: ஆகவே ... அன்புகூருங்கள்
  rationale: אהב என்பதன் பொருள் ‘அன்புகூர்.’ முன் வசனத்தில் அந்நியர்மீது கடவுள் காட்டும் அன்பிலிருந்து இந்தக் கட்டளை தொடர்வதால், வாவ் இணைப்பின் தொடர்ச்சியையும் முடிவுரைத் தன்மையையும் ‘ஆகவே’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: הַ/גֵּר
  choice: அந்நியரிடம்
  rationale: גֵּר என்பது இஸ்ரவேலரிடையே குடியிருந்த, அந்த நாட்டைச் சாராத சமூக ரீதியாகப் பாதுகாப்பற்ற ஒருவரைக் குறிக்கிறது. ‘அந்நியர்’ என்பது நவீன தமிழில் வெளிநாட்டவர்/வெளியார் என்ற நிலையைத் தெளிவாகச் சொல்கிறது; வெறும் வழிப்போக்கர் என்ற பொருளைக் கட்டாயப்படுத்தாது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: கட்டளைக்கான காரணத்தை அறிமுகப்படுத்தும் காரண இணைப்பாக כִּי இங்கு வருகிறது.
- source_word: גֵרִים
  choice: அந்நியர்களாக
  rationale: முன்னர் வந்த גֵּר என்ற சொல்லோடு சொற்பொருள் ஒற்றுமையைப் பேணுவதற்காக அதன் பன்மையும் ‘அந்நியர்கள்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: הֱיִיתֶם
  choice: இருந்தீர்கள்
  rationale: היה இங்கு கடந்தகால இருப்புநிலையைச் சுட்டுகிறது; ‘ஆனீர்கள்’ என்பதைவிட ‘இருந்தீர்கள்’ சூழலுக்குப் பொருத்தமானது.
- source_word: בְּ/אֶרֶץ מִצְרָיִם
  choice: எகிப்து நாட்டில்
  rationale: אֶרֶץ (‘நாடு/நிலம்’) என்பதை விடாமல், இயல்பான தமிழில் எபிரேயச் சொற்றொடரைப் பேணுகிறது.
theological_decisions:
- issue: உடன்படிக்கைச் சட்டத்தில் גֵּר குறிக்கும் சமூக அடையாளம்
  choice: அந்நியர்
  alternative: குடியேறிய அயல்நாட்டவர்; பரதேசி; அயலார்
  rationale: இந்தக் கட்டளை, இஸ்ரவேலர் எகிப்தில் நாட்டைச் சாராதவர்களாக வாழ்ந்த தங்கள் சொந்த அனுபவத்தை அடிப்படையாகக் கொண்டது. ‘அந்நியர்’ அந்த வெளியார் நிலையைக் காக்கிறது; அதேவேளை பிற்காலச் சட்ட அல்லது குடியுரிமைப் பிரிவுகளை வசனத்திற்குள் திணிப்பதில்லை. குடியிருந்து வாழும் நுட்பம் அடிக்குறிப்பில் விளக்கப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் தெளிவும் கண்ணியமும் பேணப்பட்டுள்ளன. ‘அன்புகூருங்கள்’ என்பது கட்டளையின் வலிமையையும் வேதாகமச் சூழலுக்குரிய உயர்ந்த நடையையும் காக்கிறது. ‘நீங்களும்’ என்பதில் உள்ள ‘-உம்,’ அந்நியரை நேசிக்க வேண்டியதற்கும் இஸ்ரவேலரின் முந்தைய அந்நிய அனுபவத்திற்கும் இடையிலான ஒப்புமையை இயல்பான தமிழில் தெளிவாக்குகிறது.
