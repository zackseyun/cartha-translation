  text: וְ/עַתָּה֙ יִשְׂרָאֵ֔ל מָ֚ה יְהוָ֣ה אֱלֹהֶ֔י/ךָ שֹׁאֵ֖ל מֵ/עִמָּ֑/ךְ כִּ֣י אִם לְ֠/יִרְאָה אֶת יְהוָ֨ה אֱלֹהֶ֜י/ךָ לָ/לֶ֤כֶת בְּ/כָל דְּרָכָי/ו֙ וּ/לְ/אַהֲבָ֣ה אֹת֔/וֹ וְ/לַֽ/עֲבֹד֙ אֶת יְהוָ֣ה אֱלֹהֶ֔י/ךָ בְּ/כָל לְבָבְ/ךָ֖ וּ/בְ/כָל נַפְשֶֽׁ/ךָ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/012.yaml
  text: And now[a], Israel, what does Yahweh your God ask of you, except to fear Yahweh your God, to walk in all his ways, to love him[c][b], and to serve Yahweh your God with all your heart and with all your soul?
translation:
  language: ta
  text: இப்போது, இஸ்ரவேலே, உன் இறைவனாகிய யாவே உன்னிடமிருந்து கேட்பது என்ன? உன் இறைவனாகிய யாவேக்கு அஞ்சவும்[b], அவருடைய எல்லா வழிகளிலும் நடக்கவும், அவரை நேசிக்கவும், உன் முழு இதயத்தோடும் உன் முழு உயிரோடும்[c] உன் இறைவனாகிய யாவேக்கு சேவை செய்யவும் அல்லவா?
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: இங்கு “அஞ்சுதல்” என்பது வெறும் பயத்தை மட்டுமல்ல; பயபக்தி, வியப்பு, கீழ்ப்படிதலுடன் கூடிய அர்ப்பணிப்பு ஆகியவற்றையும் உள்ளடக்குகிறது.
    reason: lexical_alternative
  - marker: c
    text: எபிரெய நெஃபெஷ் என்ற சொல் சூழலுக்கேற்ப “உயிர்,” “ஆத்துமா,” அல்லது “தன்முழுமை” எனப் பொருள்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: இப்போது
  rationale: மோசேயின் அறிவுறுத்தலில் ஒரு புதிய முடிவுரைப் பகுதிக்கான மாற்றத்தைக் குறிக்கும் இயல்பான நவீனத் தமிழ் சொல்; எபிரெய இணைப்பின் தாக்கம் உரையோட்டத்தில் வெளிப்படுகிறது.
- source_word: מָה ... שֹׁאֵל מֵעִמָּךְ
  choice: உன்னிடம் கேட்பது என்ன?
  rationale: שׁאל என்பது இங்கு வேண்டுகோளோடு கடமையையும் உட்பொருளாகக் கொண்டுள்ளது. ‘கேட்பது’ வினாவடிவத்தைப் பாதுகாக்கிறது; கட்டாயத்தின் நிழற்பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இது ஒரு பட்டப்பெயர் அல்ல, இஸ்ரவேலின் இறைவனுடைய தனிப்பெயரைக் குறிக்கும் நான்கெழுத்துத் திருப்பெயர்; தமிழில் ‘யாவே’ என ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: אֱלֹהֶיךָ
  choice: உன் இறைவன்
  rationale: இரண்டாம் நபர் ஒருமை உடைமை விகுதியைத் துல்லியமாகக் காட்டுகிறது; இஸ்ரவேல் ஒருமையில் நேரடியாக அழைக்கப்படுகிறது.
- source_word: כִּי אִם
  choice: அல்லாமல் வேறென்ன?
  rationale: 'கேள்வியின் வரையறுக்கும் வலிமையை இயல்பான தமிழில் தருகிறது: யாவே கேட்பவை பின்னர் பட்டியலிடப்படுகின்றன.'
- source_word: לְיִרְאָה
  choice: அஞ்சவும்
  rationale: ירא என்பதிலுள்ள அச்சம், பயபக்தி, கீழ்ப்படிதலுடன் கூடிய மரியாதை ஆகிய பதற்றங்களை மென்மைப்படுத்தாமல் பாதுகாக்கிறது.
- source_word: לָלֶכֶת בְּכָל דְּרָכָיו
  choice: அவருடைய வழிகளிலெல்லாம் நடக்கவும்
  rationale: வாழ்க்கை நடத்தையைச் சுட்டும் எபிரெய ‘நடத்தல்’ உருவகத்தைத் தமிழிலும் பாதுகாக்கிறது.
- source_word: וּלְאַהֲבָה אֹתוֹ
  choice: அவரை நேசிக்கவும்
  rationale: இறைவனை நோக்கிய உடன்படிக்கை சார்ந்த அன்பையும் தனிப்பட்ட பற்றையும் நேரடியாகக் காட்டுகிறது.
- source_word: וְלַעֲבֹד
  choice: பணிசெய்யவும்
  rationale: עבד என்பதிலுள்ள வழிபாடு, கீழ்ப்படிதல், சேவை ஆகிய பரந்த கருத்துகளை ‘வழிபடுதல்’ என்று குறுக்காமல் தருகிறது.
- source_word: בְּכָל לְבָבְךָ
  choice: உன் முழு இதயத்தோடும்
  rationale: לֵבָב குறிக்கும் சிந்தனை, விருப்பம், மனவுறுதி ஆகியவற்றை உள்ளடக்கும் மரபான மனித உள்மைய உருவகத்தைப் பாதுகாக்கிறது.
- source_word: וּבְכָל נַפְשֶׁךָ
  choice: உன் முழு உயிரோடும்
  rationale: נֶפֶשׁ இங்கு உயிர், தன்முழுமை, ஒருவர் தாமே ஆகிய பொருள் எல்லைகளைக் கொண்டது; நவீனத் தமிழில் ‘உயிர்’ இயல்பாக இருந்து முழுமையான அர்ப்பணிப்பைக் காட்டுகிறது.
theological_decisions:
- issue: יְהוָה என்ற திருப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: ஆண்டவர் / யெகோவா
  rationale: மூலத்தில் பட்டப்பெயருக்குப் பதிலாக இறைவனுடைய தனிப்பெயர் நேரடியாக உள்ளது. ஆகவே அதை பட்டப்பெயராக மாற்றாமல் ஒலிபெயர்த்தது.
- issue: உடன்படிக்கை அறிவுறுத்தலில் ירא என்பதன் வலிமை
  choice: அஞ்சவும்
  alternative: பயபக்தி கொள்ளவும் / ஆழ்ந்து மதிக்கவும்
  rationale: ‘அஞ்சவும்’ என்பது அச்சம், வியப்பு, பயபக்தி, கீழ்ப்படிதல் ஆகியவற்றுக்கிடையிலான மூலமொழியின் இறையியல் பதற்றத்தைத் தக்கவைக்கிறது.
- issue: נֶפֶשׁ என்பதன் மனிதவியல் பரப்பு
  choice: முழு உயிரோடும்
  alternative: முழு ஆத்துமாவோடும் / உன் முழுத் தன்மையோடும்
  rationale: ஒரு தனிப் பிரிக்கப்பட்ட ஆன்மீகக் கூறை மட்டும் குறிப்பதாக உரையை முடிவுசெய்யாமல், உயிரும் தன்முழுமையும் அடங்கிய மூலச்சொல்லின் பரப்பை பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளக்கூடிய அதேவேளையில் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ஒருமையில் அழைக்கப்படும் ‘இஸ்ரவேலே’ மற்றும் அதைத் தொடரும் ‘உன்’ வடிவங்கள் மூலத்தின் உடன்படிக்கைச் சொற்பொழிவு அமைப்பைப் பாதுகாக்கின்றன. ‘வழிகளில் நடக்க’ என்ற வேதாகம உருவகம் திட்டமிட்டு தக்கவைக்கப்பட்டுள்ளது.
