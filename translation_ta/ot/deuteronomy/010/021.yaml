source:
  edition: WLC
  text: ה֥וּא תְהִלָּתְ/ךָ֖ וְ/ה֣וּא אֱלֹהֶ֑י/ךָ אֲשֶׁר עָשָׂ֣ה אִתְּ/ךָ֗ אֶת הַ/גְּדֹלֹ֤ת וְ/אֶת הַ/נּֽוֹרָאֹת֙ הָ/אֵ֔לֶּה אֲשֶׁ֥ר רָא֖וּ עֵינֶֽי/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/021.yaml
  text: He is your praise[a], and he is your God[b], who has done for you these great and awe-inspiring things that your eyes have seen.
translation:
  language: ta
  text: அவரே உன் புகழ்[a]; அவரே உன் கடவுள். உன் கண்கள் கண்ட இந்தப் பெரிய செயல்களையும் அச்சமும் வியப்பும் ஊட்டும் செயல்களையும்[b] உனக்காகச் செய்தவர் அவரே.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நீ புகழ்கிறவர் அவரே” அல்லது “நீ பெருமைப்படுவதற்குக் காரணம் அவரே.” எபிரெய மொழியில் சொற்சொல்லாக, “அவரே உன் புகழ்” என்று உள்ளது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “பேரச்சமூட்டும் செயல்கள்” அல்லது “திகிலூட்டும் செயல்கள்.” எபிரெயச் சொல் பயத்தையும் பயபக்தியுடன் கூடிய வியப்பையும் ஏற்படுத்தும் செயல்களைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוּא ... וְהוּא
  choice: அவரே ... அவரே
  rationale: திரும்பத் திரும்ப வரும் எபிரெயச் சுட்டுப்பெயரின் வலியுறுத்தலைத் தமிழில் “அவரே” என்று இயல்பாகப் பாதுகாக்கிறது; மூலத்தில் வெளிப்படையாக இல்லாத தனித்தன்மைக் கருத்தைச் சேர்ப்பதில்லை.
- source_word: תְהִלָּתְךָ
  choice: உன் புகழ்
  rationale: “புகழ்” என்ற பெயர்ச்சொல் மூலத்தின் சுருக்கமான பயனிலை அமைப்பைப் பாதுகாக்கிறது. கடவுளே இஸ்ரவேலின் புகழ்ச்சிக்குரியவரும் அதன் அடிப்படையுமாக இருக்கிறார் என்ற இருபொருள் செறிவை விளக்கிச் சுருக்காமல் விடுகிறது.
- source_word: אֱלֹהֶיךָ
  choice: உன் கடவுள்
  rationale: இரண்டாம் நபர் ஒருமையில் இஸ்ரவேலைக் கூட்டாக நேரடியாக அழைக்கும் உடன்படிக்கை மொழியைப் பாதுகாக்கும் இயல்பான தமிழ்.
- source_word: עָשָׂה אִתְּךָ
  choice: உனக்காகச் செய்தவர்
  rationale: இச்சூழலில் எபிரெய மரபுத்தொடர் இஸ்ரவேலின் நன்மைக்காகச் செய்யப்பட்ட செயல்களைக் குறிக்கிறது; தமிழில் பயனாளிப் பொருளை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: הַגְּדֹלֹת
  choice: பெரிய செயல்கள்
  rationale: பெயர்ச்சொல்லாகப் பயன்படும் பெயரடை “பெரியவை” எனப் பொருள்படும். இங்கு “செயல்கள்” என்பதை வெளிப்படுத்துவது தமிழில் தெளிவாகவும் இயல்பாகவும் உள்ளது; வல்லமை என்ற ஒரே நுணுக்கத்துக்குள் பொருளைக் குறுக்குவதில்லை.
- source_word: הַנּוֹרָאוֹת
  choice: அச்சமும் வியப்பும் ஊட்டும் செயல்கள்
  rationale: இந்தச் சொல் பயம், பேரச்சம், வியப்பு ஆகியவற்றைத் தூண்டும் செயல்களைக் குறிக்கலாம். தமிழாக்கம் எதிர்மறையான திகிலை மட்டும் உணர்த்தாமல், மூலத்திலுள்ள அச்சத்தின் தீவிரத்தையும் பயபக்திக்குரிய வியப்பையும் இணைத்துப் பாதுகாக்கிறது.
- source_word: הָאֵלֶּה
  choice: இந்த
  rationale: பேசுபவரும் கேட்பவரும் அறிந்த, இப்போதுதான் குறிப்பிடப்பட்ட செயல்களைச் சுட்டும் எபிரெய அண்மைக் காட்டுச்சொல்லை இயல்பாகக் கொடுக்கிறது.
- source_word: רָאוּ עֵינֶיךָ
  choice: உன் கண்கள் கண்ட
  rationale: நேரில் கண்ட அனுபவத்தையும் சாட்சியத்தின் வலிமையையும் எடுத்துரைக்கும் எபிரெய உருவகத்தை அப்படியே இயல்பான தமிழில் பாதுகாக்கிறது.
theological_decisions:
- issue: הוּא תְהִלָּתְךָ என்ற பயனிலைத் தொடரின் பொருள்
  choice: அவரே உன் புகழ்
  alternative: நீ புகழ்கிறவர் அவரே / நீ பெருமைப்படுவதற்குக் காரணம் அவரே
  rationale: 'மூலத்தின் செறிவையும் மெய்யியல் அழுத்தத்தையும் இத்தேர்வு பாதுகாக்கிறது: கடவுள் புகழ்ச்சியின் பொருளாகவும் இஸ்ரவேலின் பெருமைக்கான அடிப்படையாகவும் புரிந்துகொள்ளப்படலாம். விளக்கமான ஒரே பொருளைத் திணிக்கவில்லை.'
- issue: הַנּוֹרָאוֹת என்பதிலுள்ள பயம் மற்றும் வியப்பு
  choice: அச்சமும் வியப்பும் ஊட்டும் செயல்கள்
  alternative: பேரச்சமூட்டும் செயல்கள் / திகிலூட்டும் செயல்கள்
  rationale: கடவுளின் செயல்கள் பயத்தையும் பயபக்தியுடன் கூடிய வியப்பையும் ஏற்படுத்தும் என்ற மூலத்தின் பரப்பை இது காக்கிறது. வெறும் அழிவூட்டும் திகில் என்று குறுக்கவும் இல்லை; அச்சத்தின் நுணுக்கத்தை மென்மைப்படுத்தவும் இல்லை.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் dignified நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ஒருமை அழைப்பான “உன்” என்பதும், “அவரே” என்ற வலியுறுத்தலும், நேரில் கண்டதைக் காட்டும் “உன் கண்கள் கண்ட” என்ற உருவகமும் பாதுகாக்கப்பட்டுள்ளன.
