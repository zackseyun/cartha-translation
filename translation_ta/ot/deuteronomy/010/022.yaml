base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/022.yaml
  text: Your fathers went down to Egypt with seventy persons[c][b][a], and now Yahweh your God has made you as numerous as the stars of the heavens.
translation:
  language: ta
  text: உன் தந்தையர் எழுபது பேராக எகிப்துக்குச் சென்றார்கள்[a][b]; இப்போதோ, உன் கடவுளாகிய யாவே உன்னை வானத்தின் நட்சத்திரங்களைப் போல ஏராளமாக்கியிருக்கிறார்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'சொல்லுக்குச் சொல்: ‘எழுபது உயிர்களாக.’ இங்கு ‘உயிர்’ என்பதற்கான எபிரெயச் சொல் மனிதர்களை எண்ணும் மரபுத்தொடரில் ‘நபர்’ என்று பொருள்படுகிறது.'
    reason: lexical_alternative
  - marker: b
    text: ‘உன் முன்னோர்கள்’ என்றும் பொருள் கொள்ளலாம்; எபிரெய மூலம் குறிப்பாக ‘உன் தந்தையர்’ என்று கூறுகிறது.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, ‘வானத்தின் நட்சத்திரங்களைப் போல மிகுதியாக.’ இவ்வொப்புமை எண்ணிக்கையின் பெருக்கத்தைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּשִׁבְעִים נֶפֶשׁ
  choice: எழுபது பேராக
  rationale: נֶפֶשׁ இங்கு மனிதர்களை எண்ணும் மரபுத்தொடரில் ‘நபர்’ என்ற பொருளில் வருகிறது. ‘எழுபது பேராக’ என்பது எண்ணிக்கையையும் கூட்டாகச் சென்ற நிலையையும் இயல்பான தமிழில் தருகிறது.
- source_word: יָרְדוּ
  choice: சென்றார்கள்
  rationale: ירד என்பதன் நேரடிப் பொருள் ‘இறங்கிச் செல்’ என்றாலும், எகிப்துக்குப் பயணம் செய்வதைக் குறிக்கும் எபிரெய வழக்கைத் தமிழில் ‘சென்றார்கள்’ என்று இயல்பாக வழங்குவது பொருத்தமானது.
- source_word: אֲבֹתֶיךָ
  choice: உன் தந்தையர்
  rationale: மூலத்தில் ஆண்பால் பன்மையான ‘உன் தந்தையர்’ என்றே உள்ளது. முன்னோர்களைக் குறிக்கும் சூழலிலும் அந்தப் பாலின வடிவம் பிரதான உரையில் காக்கப்படுகிறது.
- source_word: מִצְרָיְמָה
  choice: எகிப்துக்கு
  rationale: திசையைக் குறிக்கும் இறுதியொட்டு எகிப்தை நோக்கிய இயக்கத்தைச் சுட்டுகிறது; தமிழில் ‘எகிப்துக்கு’ இயல்பானது.
- source_word: וְעַתָּה
  choice: இப்போதோ
  rationale: ஆரம்பத்திலிருந்த சிறிய எண்ணிக்கைக்கும் தற்போதைய பெருக்கத்திற்கும் இடையிலான மிதமான முரணை ‘இப்போதோ’ தெளிவாக வெளிப்படுத்துகிறது.
- source_word: שָׂמְךָ
  choice: உன்னை ... ஏராளமாக்கியிருக்கிறார்
  rationale: שׂים என்பதற்கு அடிப்படையில் ‘வை/நிறுத்து’ என்று பொருள்; இச்சூழலில் ஏற்பட்டுள்ள பெருக்கத்தின் விளைவைத் தமிழில் ‘ஏராளமாக்கியிருக்கிறார்’ தெளிவாகத் தருகிறது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: நான்கெழுத்துத் திருப்பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் நன்கு நிலைபெற்ற தனிப்பெயர் வடிவமான ‘யெகோவா’ என்று ஒலிபெயர்க்கிறது.
- source_word: אֱלֹהֶיךָ
  choice: உன் கடவுளாகிய
  rationale: இரண்டாம் நபர் ஒருமை உடைமைப் பின்னொட்டுடன் உள்ள அமைப்பைத் தமிழில் ‘உன் கடவுளாகிய’ என்று இயல்பாக இணைக்கிறது.
- source_word: כְּכוֹכְבֵי הַשָּׁמַיִם ... לָרֹב
  choice: வானத்தின் நட்சத்திரங்களைப் போல ஏராளமாக
  rationale: ஒப்புமையின் நோக்கம் தோற்ற ஒற்றுமையல்ல, எண்ணிக்கையின் மிகுதி. நட்சத்திர உருவகத்தையும் לָרֹב குறிக்கும் பெருக்கத்தையும் இவ்வடிவம் இரண்டையும் காக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யெகோவா
  alternative: யாவே
  rationale: மூலத்தில் இறைவனின் தனிப்பெயர் நேரடியாக உள்ளது. அதை ‘ஆண்டவர்’ போன்ற பட்டமாக மாற்றாமல் தனிப்பெயராகவே காக்கப்படுகிறது; ‘யெகோவா’ என்பது தமிழில் அறியப்பட்ட ஒலிபெயர்ப்பு வடிவம்.
- issue: אֲבֹתֶיךָ என்ற பாலினம் குறிக்கப்பட்ட மூதாதையர் சொல்
  choice: உன் தந்தையர்
  alternative: உன் முன்னோர்கள்
  rationale: எபிரெயச் சொல் ஆண்பால் பன்மையில் குறிப்பாக ‘தந்தையர்’ என்று கூறுவதால் அதை பொதுப்பாலாக்காமல் பிரதான உரையில் காக்கிறது; பரந்த குறிப்பு அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், மரியாதையும் எளிய வாசிப்புத்தன்மையும் இணைந்த நடை. ஒருமை இரண்டாம் நபர் வடிவம் மூலத்துக்கு ஏற்ப காக்கப்பட்டது. ‘இறங்கிச் சென்றார்கள்’ என்ற சொற்படி வடிவத்தைவிட இயல்பான ‘சென்றார்கள்’ தேர்ந்தெடுக்கப்பட்டது; எண்ணிக்கையின் பெருக்கம் தெளிவாகச் சொல்லப்பட்டது.
