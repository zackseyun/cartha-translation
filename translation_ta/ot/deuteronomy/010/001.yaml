source:
  edition: WLC
  text: בָּ/עֵ֨ת הַ/הִ֜וא אָמַ֧ר יְהוָ֣ה אֵלַ֗/י פְּסָל לְ/ךָ֞ שְׁנֵֽי לֻוחֹ֤ת אֲבָנִים֙ כָּ/רִ֣אשֹׁנִ֔ים וַ/עֲלֵ֥ה אֵלַ֖/י הָ/הָ֑רָ/ה וְ/עָשִׂ֥יתָ לְּ/ךָ֖ אֲר֥וֹן עֵֽץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/001.yaml
  text: At that time Yahweh said to me[a], ‘Carve for yourself two stone tablets like the first ones, and come up to me on the mountain[b], and make for yourself a wooden ark.’
translation:
  language: ta
  text: அப்போது யாவே என்னிடம், “முதலில் இருந்த பலகைகளைப் போன்ற இரண்டு கற்பலகைகளை உனக்காகச் செதுக்கு. மலைக்கு என்னிடம் ஏறி வா; உனக்காக ஒரு மரப் பேழையைச் செய்” என்றார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בָּעֵת הַהִוא
  choice: அப்போது
  rationale: கதை நிகழும் காலத்தைச் சுட்டும் எபிரெயச் சொற்றொடரை இயல்பான நவீனத் தமிழில் சுருக்கமாகத் தருகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைவனின் தனிப்பட்ட உடன்படிக்கைப் பெயரான நான்கெழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: פְּסָל לְךָ
  choice: உனக்காகச் செதுக்கு
  rationale: פסל என்பதன் கல்லை வடிவமைக்கும் செயற்பொருளையும், לְךָ என்பதன் பயனாளிப் பொருளையும் தெளிவாகப் பாதுகாக்கிறது.
- source_word: שְׁנֵי לֻוחֹת אֲבָנִים כָּרִאשֹׁנִים
  choice: முதலில் இருந்தவற்றைப் போன்ற இரண்டு கற்பலகைகள்
  rationale: முன்னிருந்த இரு பலகைகளைக் குறிக்கும் ஒப்பீட்டைத் தெளிவாக வைத்துக் கொண்டு, இயல்பான தமிழ்ச் சொல்லமைப்பைப் பயன்படுத்துகிறது.
- source_word: וַעֲלֵה אֵלַי הָהָרָה
  choice: மலைமேல் என்னிடம் ஏறிவா
  rationale: மேல்நோக்கிய இயக்கம், மலை இலக்கு, யாவேயிடம் வருதல் ஆகிய மூன்றையும் சுருக்கமான இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: וְעָשִׂיתָ לְּךָ אֲרוֹן עֵץ
  choice: மரத்தால் ஒரு பேழையையும் உனக்காகச் செய்
  rationale: אֲרוֹן என்பதைக் உடன்படிக்கைப் பலகைகளை வைக்கும் பேழையாகவும், עֵץ என்பதைக் அதன் பொருளாகவும், לְךָ என்பதைக் பயனாளிப் பொருளாகவும் தருகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: ஆண்டவர் / யெகோவா
  rationale: மூலத்தில் ஒரு பொதுப் பட்டம் அல்லாமல் தனிப்பட்ட இறைப்பெயர் நேரடியாக உள்ளது; ஆகவே அதைத் தமிழில் ஒலிபெயர்த்து அதன் தனிப்பெயர்த் தன்மையைப் பாதுகாக்கிறது.
- issue: אֲרוֹן என்பதன் பொருள்
  choice: பேழை
  alternative: பெட்டி
  rationale: சொல் பொதுவாகப் பெட்டியைக் குறிக்கக்கூடியதாயினும், இச்சூழலில் உடன்படிக்கைப் பலகைகளுக்கான புனிதப் பேழையைக் குறிக்கிறது; ‘பேழை’ அந்தச் சூழற்பொருளைத் தருகிறது, அதேவேளை பொருளில் தேவையற்ற விளக்கத்தைச் சேர்ப்பதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியக்கூடியதாயும் மரியாதைமிக்கதாயும் வடிவமைக்கப்பட்டது. கட்டளைகளின் நேரடித் தன்மை பாதுகாக்கப்பட்டுள்ளது. ஆங்கில ஆலோசனை உரையிலுள்ள அடிக்குறிப்பு குறியீடுகள் அவை விளக்கும் சொற்றொடர்களோடு பொருந்தாததால் சேர்க்கப்படவில்லை; மூல எபிரெயில் இவ்வசனத்திற்கு அவசியமான உரைமாற்று அல்லது பொருள் ஐயம் இல்லை.
