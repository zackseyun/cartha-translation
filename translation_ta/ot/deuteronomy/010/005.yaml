reference: Deuteronomy 10:5
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וָ/אֵ֗פֶן וָֽ/אֵרֵד֙ מִן הָ/הָ֔ר וָֽ/אָשִׂם֙ אֶת הַ/לֻּחֹ֔ת בָּ/אָר֖וֹן אֲשֶׁ֣ר עָשִׂ֑יתִי וַ/יִּ֣הְיוּ שָׁ֔ם כַּ/אֲשֶׁ֥ר צִוַּ֖/נִי יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/005.yaml
  text: Then I turned and came down from the mountain[a], and I put the tablets in the ark that I had made; and they are there, just as Yahweh commanded me.
translation:
  language: ta
  text: பின்பு நான் திரும்பி மலையிலிருந்து இறங்கி வந்து, நான் செய்திருந்த பேழையில் அந்தப் பலகைகளை வைத்தேன். யாவே எனக்குக் கட்டளையிட்டபடியே அவை அங்கே இருந்தன[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயில், “அவை அங்கே இருந்தன.” இந்தச் சொற்றொடர், பேசப்பட்ட காலம்வரை அவை அங்கேயே தொடர்ந்து இருந்தன என்றும் குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֵפֶן
  choice: பின்பு நான் திரும்பி
  rationale: פנה என்பதன் அடிப்படைப் பொருளான ‘திரும்புதல்’ என்பதையும், தொடர்கதை அமைப்பிலுள்ள வாவ் வடிவின் காலவரிசைத் தன்மையையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: וָאֵרֵד מִן הָהָר
  choice: மலையிலிருந்து இறங்கி வந்து
  rationale: ירד என்பது ‘கீழே இறங்குதல்’ என்று பொருள் தருகிறது. מן הָהָר என்பதிலுள்ள குறிப்பிட்ட மலையை ‘மலையிலிருந்து’ என்று காட்டுகிறது; ‘இறங்கி வந்து’ என்பது தமிழ்க் கதைநடையில் இயல்பான இயக்கவிளக்கம்.
- source_word: וָאָשִׂם
  choice: வைத்தேன்
  rationale: שׂים என்பதன் பொதுவான ‘வை, இடு’ என்ற பொருளை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: הַלֻּחֹת
  choice: அந்தப் பலகைகள்
  rationale: לֻחוֹת என்பது எழுதுவதற்குரிய பலகைகளைக் குறிக்கிறது. அருகிலுள்ள சூழலில் முன்பே அறிமுகமான பலகைகள் என்பதால் சுட்டுப்பொருளைத் தெளிவாக்க ‘அந்தப்’ பயன்படுத்தப்பட்டுள்ளது; இவ்வசனத்தில் இல்லாத ‘கல்’ என்ற விவரம் சேர்க்கப்படவில்லை.
- source_word: בָּאָרוֹן
  choice: பேழையில்
  rationale: אָרוֹן என்பது பெட்டி அல்லது பேழையைக் குறிக்கும். உடன்படிக்கைச் சூழலில் ‘பேழை’ மரியாதையானதும் தமிழ்வேதாகமப் பயன்பாட்டில் அறியப்பட்டதுமான சொல்; இங்கு இயக்கத்தின் முடிவிடத்தைத் தமிழ் வேற்றுமை இயல்பாகக் காட்டுகிறது.
- source_word: אֲשֶׁר עָשִׂיתִי
  choice: நான் செய்திருந்த
  rationale: பேழையை மோசே முன்னரே செய்திருந்தார் என்பதைத் தமிழில் இயல்பாகத் தெளிவுபடுத்துகிறது; எபிரெய நிறைவினைச் சூழலுக்கேற்ற முறையில் முன்நிகழ்வாகக் காட்டுகிறது.
- source_word: וַיִּהְיוּ שָׁם
  choice: அவை அங்கே இருந்தன[a]
  rationale: היה உடன் שׁם வரும் சொற்றொடரின் நேரடியான நிலைப்பொருளைத் தக்கவைக்கிறது. இது வெறுமனே அப்போது இருந்ததையும் தொடர்ந்து அங்கேயே இருந்ததையும் குறிக்கக்கூடியதால், அந்த நுட்பம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: כַּאֲשֶׁר צִוַּנִי יְהוָה
  choice: யாவே எனக்குக் கட்டளையிட்டபடியே
  rationale: כַּאֲשֶׁר குறிக்கும் ஒத்திசைவை ‘கட்டளையிட்டபடியே’ இயல்பாக வெளிப்படுத்துகிறது; צִוַּנִי என்பதிலுள்ள முதலாம் நபர் செயப்படுபொருளும் தெளிவாகப் பாதுகாக்கப்படுகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெயத் தெய்வீகப் பெயரான יהוה-வை ஒரு பட்டப்பெயரால் மாற்றாமல், தமிழில் உச்சரிப்புக்கு ஏற்ற ஒலிபெயர்ப்பாக வழங்குகிறது.
theological_decisions:
- issue: יהוה என்ற தெய்வீகப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலத்தில் தனிப்பட்ட உடன்படிக்கைப் பெயர் நேரடியாக உள்ளது. ஆகவே பட்டப்பெயரான ‘கர்த்தர்’ என்பதைக் கொண்டு மாற்றாமல், ‘யாவே’ என்று ஒலிபெயர்த்து பெயரின் தன்மையைப் பாதுகாக்கிறது.
- issue: וַיִּהְיוּ שָׁם என்பதன் காலநிலை நுட்பம்
  choice: அவை அங்கே இருந்தன
  alternative: அவை அங்கேயே தொடர்ந்து இருந்தன
  rationale: எபிரெயச் சொற்றொடர் நேரடியாக ‘அவை அங்கே இருந்தன’ என்று கூறுகிறது; பேசும் காலம்வரை அவை அங்கே நிலைத்திருந்தன என்ற உட்குறிப்பு இருக்கலாம். முதன்மை உரையில் அதைத் தீர்மானமாக்காமல், அடிக்குறிப்பில் சாத்தியத்தைத் தெரிவிக்கிறது.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘பேழை’ என்ற சொல் உடன்படிக்கைச் சூழலுக்கேற்ற மரியாதையான மரபுச் சொல்லாக வைக்கப்பட்டுள்ளது; மற்ற வாக்கிய அமைப்பு இயல்பான நவீன நடையில் உள்ளது.
