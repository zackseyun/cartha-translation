  source_fidelity: 'மூல எபிரெயத்தின் நிகழ்வுவரிசையும் கூறுகளும் துல்லியமாகப் பாதுகாக்கப்பட்டுள்ளன: மோசே திரும்பி மலையிலிருந்து இறங்குதல், தான் செய்த பேழையில் பலகைகளை வைத்தல், யாவே கட்டளையிட்டபடியே அவை அங்கே இருந்தமை ஆகியவை அனைத்தும் தெளிவாக உள்ளன. וַיִּהְיוּ שָׁם என்பதற்கான இறந்தகால நிலைக்கூற்று ‘அவை அங்கே இருந்தன’ என்பது பாதுகாப்பான நேரடி மொழிபெயர்ப்பு.'
