revisions:
- from: 'அக்காலத்தில் யாவே லேவி கோத்திரத்தாரைத் தனியே பிரித்தெடுத்தார்: யாவேயின் உடன்படிக்கைப் பெட்டியைச் சுமப்பதற்கும், யாவேயின் முன்னிலையில் நின்று அவருக்குப் பணிவிடை செய்வதற்கும், அவருடைய பெயரில் ஆசீர்வதிப்பதற்கும் அவர்களை நியமித்தார். இன்றுவரை அவர்கள் இப்பணிகளைச் செய்துவருகிறார்கள்.[a]'
  to: அக்காலத்தில், யாவே லேவி கோத்திரத்தை யாவேயின் உடன்படிக்கைப் பெட்டியைச் சுமக்கவும், யாவேயின் முன்னிலையில் நின்று அவருக்குப் பணிவிடை செய்யவும், அவருடைய நாமத்தில் ஆசீர்வதிக்கவும் தனியாகப் பிரித்தெடுத்தார். அந்த நியமனம் இன்றுவரை தொடர்கிறது.[a]
  rationale: மூலத்தின் ஒரே முதன்மை வினையான ‘பிரித்தெடுத்தார்’ என்பதையும் அதன் மூன்று நோக்கத் தொடர்களையும் நேரடியாக வைத்துள்ளோம். மூலத்தில் இல்லாத ‘நியமித்தார்’ மற்றும் ‘அவர்கள் இப்பணிகளைச் செய்துவருகிறார்கள்’ ஆகிய விரிவாக்கங்கள் நீக்கப்பட்டன. தமிழில் இறுதி வினைநிறைவு தேவைப்படுவதால் நியமனத்தின் தொடர்ச்சியைச் சொல்லும் குறைந்தபட்ச விளக்கம் தரப்பட்டு, அதன் உரைநிலை அடிக்குறிப்பில் வெளிப்படுத்தப்பட்டுள்ளது.
