  source_fidelity: திருத்தம் தேவை. மூல எபிரெயத்தில் யாவே லேவி கோத்திரத்தைப் பிரித்தெடுத்ததன் நோக்கங்களாக மூன்று முடிவிலி வினைத்தொடர்கள் வருகின்றன. வரைவில் உள்ள “அவர்களை நியமித்தார்” என்பது ஏற்கெனவே ‘தனியே பிரித்தெடுத்தார்’ என்பதில் அடங்கிய கருத்தை மீண்டும் சேர்க்கிறது; மேலும் “அவர்கள் இப்பணிகளைச் செய்துவருகிறார்கள்” என்பது மூலத்தில் வெளிப்படையாகக் கூறப்படாத செயற்பாட்டு வினையைச் சேர்க்கிறது. இறுதி ‘இன்றுவரை’யின் தொடர்பு சற்றே திறந்ததாகவே உள்ளது.
