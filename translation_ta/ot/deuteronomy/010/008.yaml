base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/008.yaml
  text: At that time Yahweh set apart the tribe of Levi to carry the ark of the covenant of Yahweh, to stand before Yahweh to minister to him, and to bless in his name, to this day.
translation:
  language: ta
  text: அக்காலத்தில், யாவே லேவி கோத்திரத்தை யாவேயின் உடன்படிக்கைப் பெட்டியைச் சுமக்கவும், யாவேயின் முன்னிலையில் நின்று அவருக்குப் பணிவிடை செய்யவும், அவருடைய நாமத்தில் ஆசீர்வதிக்கவும் தனியாகப் பிரித்தெடுத்தார். அந்த நியமனம் இன்றுவரை தொடர்கிறது.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் இறுதியில் “இன்றுவரை” என்று மட்டுமே உள்ளது. அது முன்வரும் நியமனத்தையோ அதனுடன் தொடர்புடைய நிலைமையையோ குறிக்கலாம்; “அந்த நியமனம் ... தொடர்கிறது” என்பது தமிழில் முழுமையான வாக்கியமாக்குவதற்கான விளக்கம்.
    reason: இறுதிச் சொற்றொடரின் தொடர்பில் உள்ள மூலத்தின் சுருக்கத்தையும் சிறிய தெளிவின்மையையும் பாதுகாக்கிறது; பணிகள் ஒவ்வொன்றும் இடையறாது நடைபெறுகின்றன என்ற தேவையற்ற உறுதியைத் தவிர்க்கிறது.
lexical_decisions:
- source_word: הִבְדִּיל
  choice: தனியே பிரித்தெடுத்தார்
  rationale: ஒரு குறிப்பிட்ட பணிக்காக மற்றவர்களிடமிருந்து வேறுபடுத்தி நியமித்தல் என்ற பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைத் திருப்பெயரான நான்கு எழுத்துப் பெயரை ஒரு பொதுப் பட்டமாக மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: שֵׁבֶט הַלֵּוִי
  choice: லேவி கோத்திரத்தாரை
  rationale: கோத்திரத்தின் பெயரையும், இங்கு பணிகளின் செய்பவர்களாகக் குறிக்கப்படும் அதன் மக்களையும் இயல்பான தமிழில் காட்டுகிறது.
- source_word: לָשֵׂאת
  choice: சுமப்பதற்கும்
  rationale: பெட்டியைத் தூக்கிச் செல்லும் லேவியரின் கடமையைத் தெளிவாகக் குறிக்கிறது.
- source_word: אֲרוֹן בְּרִית יְהוָה
  choice: யாவேயின் உடன்படிக்கைப் பெட்டியை
  rationale: எபிரெயக் கட்டமைப்பின் உறவைக் காக்கும் அதேவேளையில் இயல்பான தமிழ் உடைமைத் தொடரைப் பயன்படுத்துகிறது.
- source_word: לַעֲמֹד לִפְנֵי יְהוָה
  choice: யாவேயின் முன்னிலையில் நின்று
  rationale: திருப்பணியுடன் தொடர்புடைய 'முன் நிற்றல்' என்னும் மூலமொழி உருவகத்தைத் தக்கவைக்கிறது.
- source_word: לְשָׁרְתוֹ
  choice: அவருக்குப் பணிவிடை செய்வதற்கும்
  rationale: பொதுவான சேவையைவிட இச்சூழலின் பரிசுத்தப் பணியை உணர்த்துகிறது; ஆண்பால் ஒருமை பின்னொட்டையும் 'அவருக்கு' என வெளிப்படுத்துகிறது.
- source_word: וּלְבָרֵךְ בִּשְׁמוֹ
  choice: அவருடைய பெயரில் ஆசீர்வதிப்பதற்கும்
  rationale: இறை அதிகாரத்தின் பேரில் ஆசீர்வாதம் வழங்குதல் என்ற கருத்தை அதிக விளக்கமின்றி நேரடியாகத் தருகிறது.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: இன்றுவரை
  rationale: விவரிப்பவரின் காலம் வரை தொடரும் நிலையைச் சுருக்கமாகவும் இயல்பாகவும் காட்டுகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரின் மொழியாக்கம்
  choice: யாவே
  alternative: ஆண்டவர்; யெகோவா
  rationale: மூலத்தில் வரும் தனிப்பட்ட உடன்படிக்கைப் பெயரை ஒரு பட்டத்தால் மாற்றாமல் ஒலிபெயர்க்கிறது.
- issue: לַעֲמֹד ... לְשָׁרְתוֹ என்பதில் லேவியரின் திருப்பணி
  choice: யாவேயின் முன்னிலையில் நின்று அவருக்குப் பணிவிடை செய்வது
  alternative: யாவேயின் முன்னிலையில் நின்று அவருக்குச் சேவை செய்வது
  rationale: '''நிற்றல்'' என்ற மூல உருவகத்தையும் பரிசுத்தப் பணியின் நுண்ணுணர்வையும் காக்கிறது; பிற்காலச் சமய அமைப்புகளை உரையில் இறக்குமதி செய்யவில்லை.'
- issue: עַד הַיּוֹם הַזֶּה எதனுடன் தொடர்புடையது
  choice: முன்னர் பட்டியலிடப்பட்ட பணிகள் இன்றுவரை தொடர்வதாகத் தெளிவாக்கப்பட்டது
  alternative: இன்றுவரை என்ற சொற்றொடரை மட்டும் இறுதியில் வைத்தல்
  rationale: எபிரெயத்தில் இது முழு நியமனத்துக்கும் பணிகளுக்கும் பொருந்தலாம்; தமிழில் தொங்கும் தொடராகாமல் பொருளை இயல்பாக்குகிறது. ஆனால் இது மூலத்தில் வெளிப்படையாக இல்லாத வினைநிறைவைச் சேர்ப்பதால் அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. 'பணிவிடை' திருப்பணிச் சூழலை உணர்த்துகிறது; 'கோத்திரத்தார்' குழுவைச் செயற்பாட்டாளர்களாக இயல்பாகக் குறிக்கிறது. வாக்கியம் வாசிப்புக்கு ஏற்றவாறு இரண்டு பகுதிகளாக அமைக்கப்பட்டுள்ளது.
