base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/016.yaml
  text: So circumcise the foreskin of your heart[c][b][a], and do not stiffen your neck any longer.
translation:
  language: ta
  text: ஆகவே[a], உங்கள் இதயத்தின் நுனித்தோலை விருத்தசேதனம் செய்யுங்கள்[b]; இனி உங்கள் கழுத்தை விறைப்பாக்காதீர்கள்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘மேலும்’ அல்லது ‘எனவே’ என்றும் மொழிபெயர்க்கலாம். இணைப்புச்சொல் சாதாரண தொடர்ச்சியைக் குறிக்கலாம்; சூழலில் முடிவை உணர்த்தும் பொருளும் உண்டு.
    reason: lexical_alternative
  - marker: b
    text: எபிரேய மொழி உருவகத்தைச் சொற்சொல்லாக, ‘உங்கள் இதயத்தின் நுனித்தோல்’ என்று வைத்திருக்கிறது. இது கடவுளுக்கு எதிரான உள்ளார்ந்த எதிர்ப்பை அகற்றுவதைக் குறிக்கும் உருவகம்.
    reason: cultural_note
  - marker: c
    text: ‘இனி உங்கள் கழுத்தைக் கடினப்படுத்தாதீர்கள்’ அல்லது ‘இனி பிடிவாதமாக இருக்காதீர்கள்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמַלְתֶּם
  choice: ஆகவே ... விருத்தசேதனம் செய்யுங்கள்
  rationale: முன்னுள்ள உரையிலிருந்து வரும் முடிவை וּ இங்கு உணர்த்த முடிவதால் ‘ஆகவே’ என மொழிபெயர்க்கப்பட்டுள்ளது. Qal perfect இரண்டாம் நபர் ஆண்பால் பன்மை வடிவம் இந்த அறிவுறுத்தல் சூழலில் கட்டளையின் வலிமையுடன் இயங்குவதால் இயல்பான தமிழ் கட்டளை வடிவம் பயன்படுத்தப்பட்டுள்ளது.
- source_word: עָרְלַת לְבַבְכֶם
  choice: உங்கள் இதயத்தின் நுனித்தோலை
  rationale: ‘உங்கள் இதயத்தின் நுனித்தோல்’ என்ற எபிரெய மொழியின் உறுதியான உருவகத்தை நேரடியாகப் பேணுகிறது; அதை ‘உள்ளத்தின் பிடிவாதம்’ போன்ற விளக்கவுரையாக மாற்றவில்லை.
- source_word: לְבַבְכֶם
  choice: உங்கள் இதயம்
  rationale: לֵבָב என்பது சித்தம், அறிவு உள்ளிட்ட உள்ளான மனிதரைச் சுட்டலாம். இங்கு விருத்தசேதன உருவகத்தோடு இணைந்திருப்பதால் ‘இதயம்’ என்பது தெளிவானதும் மரபாகப் புரிந்துகொள்ளக்கூடியதுமான இணைச்சொல்.
- source_word: וְעָרְפְּכֶם
  choice: உங்கள் கழுத்தை
  rationale: עֹרֶף என்பது கழுத்து அல்லது பிடரியைக் குறிக்கிறது. பிடிவாதத்தைக் குறிக்கும் இந்த உருவகத்தில் ‘கழுத்து’ இயல்பாகவும் மூல உருவகத்திற்கு நெருக்கமாகவும் உள்ளது.
- source_word: לֹא תַקְשׁוּ עוֹד
  choice: இனி ... விறைக்கச் செய்யாதீர்கள்
  rationale: קשׁה என்பதன் Hiphil வடிவம் ‘கடினமாக்கு/விறைக்கச் செய்’ என்று பொருள்படுகிறது. עוֹד உடன் வரும் தடைக் கட்டளையை ‘இனி ... செய்யாதீர்கள்’ இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: உள்ளான விருத்தசேதனத்தைக் குறிக்கும் உடன்படிக்கை உருவகம்
  choice: ‘உங்கள் இதயத்தின் நுனித்தோலை விருத்தசேதனம் செய்யுங்கள்’ என்று உருவகத்தை வெளிப்படையாகப் பேணுதல்
  alternative: ‘உங்கள் இதயத்தைத் தூய்மைப்படுத்துங்கள்’ அல்லது ‘உங்கள் இதயத்தின் பிடிவாதத்தை அகற்றுங்கள்’
  rationale: வசனம் வெளிப்புற உடன்படிக்கை அடையாளமான விருத்தசேதனத்தை உள்ளார்ந்த ஒழுக்க மறுமொழிக்கான உருவகமாகப் பயன்படுத்துகிறது. அதை அப்படியே பேணுவது வெளிப்புற அடையாளத்துக்கும் உள்ளார்ந்த கீழ்ப்படிதலுக்கும் இடையிலான இறையியல் அழுத்தத்தைத் தக்கவைக்கிறது; குறிப்பிட்ட கோட்பாட்டு விளக்கத்தை உரைக்குள் புகுத்துவதையும் தவிர்க்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் நேரடியான, கண்ணியமான கட்டளைநடை பயன்படுத்தப்பட்டுள்ளது. ‘நுனித்தோல்,’ ‘விருத்தசேதனம்,’ ‘கழுத்தை விறைக்கச் செய்தல்’ ஆகிய மூல உருவகங்கள் விளக்கவுரையாகத் தளர்த்தப்படாமல் பேணப்பட்டுள்ளன; மாற்று வாசிப்புகள் அடிக்குறிப்புகளில் தரப்பட்டுள்ளன.
