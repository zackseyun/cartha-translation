translation_notes:
  register: நவீனத் தரத்தமிழில், பயணப் பட்டியலின் சுருக்கமான நடையைப் பேணியுள்ளோம். இரண்டாவது பயண வினை எபிரெயத்தில் விடுபட்டிருந்தாலும், தமிழில் பொருள் தெளிவாக இருக்க ‘சென்றார்கள்’ என்று இயல்பாக நிறைவு செய்யப்பட்டுள்ளது. இடப்பெயர்கள் மொழிபெயர்க்கப்படாமல் ஒலிபெயர்க்கப்பட்டுள்ளன.
