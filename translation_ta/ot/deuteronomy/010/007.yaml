revisions:
- from: அங்கிருந்து அவர்கள் குத்கோதாவுக்குப் புறப்பட்டுச் சென்றார்கள்; குத்கோதாவிலிருந்து யோத்பாத்தாவுக்குச் சென்றார்கள். அது நீரோடைகள் நிறைந்த நிலம்.[a]
  to: அங்கிருந்து அவர்கள் குத்கோதாவுக்குப் புறப்பட்டுச் சென்றார்கள்; குத்கோதாவிலிருந்து யோத்பாத்தாவுக்குச் சென்றார்கள்—அது நீரோடைகளின் நிலம்.[a]
  rationale: The revision removes the unsupported intensifier “நிறைந்த,” retains the itinerary’s compact style, and marks the final phrase as an appositional description of Yotbathah. The revised note preserves the viable watercourse/wadi alternatives without restricting the Hebrew to valleys.
