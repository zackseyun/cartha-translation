base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/007.yaml
  text: From there they set out for Gudgodah[a], and from Gudgodah to Jotbathah, a land of streams of water.
translation:
  language: ta
  text: அங்கிருந்து அவர்கள் குத்கோதாவுக்குப் புறப்பட்டுச் சென்றார்கள்; குத்கோதாவிலிருந்து யோத்பாத்தாவுக்குச் சென்றார்கள்—அது நீரோடைகளின் நிலம்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நீர்ப்பாதைகளைக் கொண்ட நிலம்,” அல்லது “தண்ணீரின் வாடிகள் (பருவகால நீரோடைகளின் படுகைகள்) உள்ள நிலம்.” எபிரெயச் சொற்றொடர் ஓடும் நீர்ப்பாதைகளையோ நீரோடைகளையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשָּׁם
  choice: அங்கிருந்து
  rationale: முந்தைய இடத்திலிருந்து புறப்பட்டதைச் சுருக்கமாகவும் இயல்பாகவும் குறிக்கிறது.
- source_word: נָסְעוּ
  choice: புறப்பட்டுச் சென்றார்கள்
  rationale: வனாந்தரப் பயணச் சூழலில் முகாமை விட்டுப் பயணத்தைத் தொடங்கும் நுணுக்கத்தை נסע கொண்டிருப்பதால், வெறும் ‘பயணம் செய்தார்கள்’ என்பதைவிட இது பொருத்தமானது.
- source_word: הַגֻּדְגֹּדָה
  choice: குத்கோதாவுக்கு
  rationale: இடப்பெயரைத் தமிழில் ஒலிபெயர்த்து, இறுதியில் உள்ள திசைகாட்டும் ־ָה-வை ‘-வுக்கு’ என்ற வேற்றுமை உருபால் வெளிப்படுத்துகிறது.
- source_word: וּמִן הַגֻּדְגֻּדָה
  choice: குத்கோதாவிலிருந்து
  rationale: பயணத்தின் அடுத்த புறப்பாட்டு இடத்தை இயல்பான தமிழில் காட்டுகிறது; வாவ் இணைப்பின் தொடர்ச்சி அரைப்புள்ளியால் தெளிவாகிறது.
- source_word: יָטְבָתָה
  choice: யோத்பாத்தாவுக்கு
  rationale: இடப்பெயரை எபிரெய ஒலிக்கு அண்மையாகத் தமிழில் ஒலிபெயர்த்து, திசைகாட்டும் முடிவை ‘-வுக்கு’ மூலம் வெளிப்படுத்துகிறது.
- source_word: אֶרֶץ
  choice: நிலம்
  rationale: இங்கு யோத்பாத்தாவை விளக்கும் புவியியல் வருணனையாக வருவதால், அரசியல் பொருளுள்ள ‘நாடு’ என்பதைவிட ‘நிலம்’ பொருத்தமானது.
- source_word: נַחֲלֵי מָיִם
  choice: நீரோடைகள் நிறைந்த
  rationale: தண்ணீர் பாயும் ஓடைகள் அல்லது நீர்ப்பாதைகள் என்ற பொருளை சாதாரண வாசகருக்குத் தெளிவாகத் தருகிறது; ‘நிறைந்த’ என்பது அந்த இடத்தின் சிறப்பியல்பை இயல்பான தமிழில் கூறுகிறது.
