  text: וְ/אָנֹכִ֞י עָמַ֣דְתִּי בָ/הָ֗ר כַּ/יָּמִים֙ הָ/רִ֣אשֹׁנִ֔ים אַרְבָּעִ֣ים י֔וֹם וְ/אַרְבָּעִ֖ים לָ֑יְלָה וַ/יִּשְׁמַ֨ע יְהוָ֜ה אֵלַ֗/י גַּ֚ם בַּ/פַּ֣עַם הַ/הִ֔וא לֹא אָבָ֥ה יְהוָ֖ה הַשְׁחִיתֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/010.yaml
  text: As for me[a], I stood on the mountain as at the first time, forty days and forty nights, and Yahweh listened to me that time also; Yahweh was not willing to destroy you.
translation:
  language: ta
  text: நானோ, முந்தைய நாட்களைப் போல நாற்பது நாட்களும் நாற்பது இரவுகளும் மலையில் நின்றிருந்தேன். அந்த முறையும் யாவே எனக்குச் செவிகொடுத்தார்[a]; உன்னை அழிக்க யாவே விரும்பவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “யாவே எனக்குச் செவிசாய்த்தார்” என்றும் மொழிபெயர்க்கலாம். எபிரெய வினைச்சொல் வெறுமனே கேட்டல் என்பதையும், சாதகமாகச் செவிகொடுத்துப் பதிலளித்தல் என்பதையும் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָנֹכִי
  choice: நானோ
  rationale: இணைப்புச்சொல்லுடன் வரும் தனிப்பட்ட பதிலிப்பெயரின் மெதுவான தலைப்புவலியுறுத்தலை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: עָמַדְתִּי
  choice: தங்கியிருந்தேன்
  rationale: அடிப்படைப் பொருள் ‘நின்றேன்’ என்றாலும், நாற்பது பகலும் இரவும் மலையில் தொடர்ந்து இருந்ததைக் குறிக்கும் சூழல்சார் பொருளை இயல்பாகத் தருகிறது.
- source_word: כַיָּמִים הָרִאשֹׁנִים
  choice: முதல்முறையைப் போலவே
  rationale: முந்தைய நாற்பது நாள் காலப்பகுதியை ஒப்பிடும் சொற்றொடரைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: אַרְבָּעִים יוֹם וְאַרְבָּעִים לָיְלָה
  choice: நாற்பது பகலும் நாற்பது இரவும்
  rationale: கால அளவைக் குறிக்கும் எபிரெய இணைச்சொற்றொடரைத் துல்லியமாகவும் தமிழில் வழக்கமான முறையிலும் தருகிறது.
- source_word: וַיִּשְׁמַע יְהוָה אֵלַי
  choice: யாவே எனக்குச் செவிகொடுத்தார்[a]
  rationale: שׁמע என்பதன் கேட்டல் மற்றும் சாதகமாக ஏற்றுப் பதிலளித்தல் ஆகிய நுண்பொருள்களை ‘செவிகொடுத்தார்’ பாதுகாக்கிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: திருநான்கெழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், அதன் பரவலான தமிழ் ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: גַּם בַּפַּעַם הַהִוא
  choice: அந்த முறையும்
  rationale: அதேபோன்ற இறைச்செயல் அந்தச் சந்தர்ப்பத்திலும் நிகழ்ந்தது என்ற மீள்நிகழ்வு நுண்பொருளைச் சுருக்கமாகத் தருகிறது.
- source_word: לֹא אָבָה
  choice: விரும்பவில்லை
  rationale: செய்ய மனமோ சம்மதமோ இல்லாததைக் குறிக்கும் வினைச்சொல்லின் விருப்ப நுண்பொருளைப் பாதுகாக்கிறது.
- source_word: הַשְׁחִיתֶךָ
  choice: உன்னை அழிக்க
  rationale: இஸ்ரவேலை ஒருமை வடிவில் கூட்டாக விளிக்கும் எபிரெய இரண்டாம் நபர் ஒருமையையும், அழிவுத் தீர்ப்பின் வலிமையையும் பாதுகாக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழியாக்கம்
  choice: யாவே
  alternative: ஆண்டவர்; யெகோவா
  rationale: மூலத்தில் நேரடியாக வரும் உடன்படிக்கைப் பெயரைப் பட்டமாக மாற்றாமல் ஒலிபெயர்க்கிறது.
- issue: וַיִּשְׁמַע יְהוָה אֵלַי என்பதில் இறைவனின் பதிலின் நுண்பொருள்
  choice: யாவே எனக்குச் செவிகொடுத்தார்
  alternative: யாவே என் குரலைக் கேட்டார்
  rationale: மோசேயின் பரிந்துரையை வெறுமனே கேட்டதைவிடச் சாதகமாக ஏற்றுக்கொண்ட நுண்பொருளைத் தருகிறது; அதேவேளையில் பதிலின் தன்மையை அளவுக்கு மீறி விளக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில் கண்ணியமான, பொதுவாசகர்களுக்கு எளிதில் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. இஸ்ரவேலைக் கூட்டாகக் குறிக்கும் எபிரெய ஒருமை ‘உன்னை’ என்று பாதுகாக்கப்பட்டுள்ளது.
