  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: לִ/שְׁמֹ֞ר אֶת מִצְוֺ֤ת יְהוָה֙ וְ/אֶת חֻקֹּתָ֔י/ו אֲשֶׁ֛ר אָנֹכִ֥י מְצַוְּ/ךָ֖ הַ/יּ֑וֹם לְ/ט֖וֹב לָֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/013.yaml
  text: to keep the commandments of Yahweh and his statutes that I am commanding you today for your good?[a]
translation:
  language: ta
  text: உன் நன்மைக்காக இன்று நான் உனக்குக் கட்டளையிடும் யாவேயின் கட்டளைகளையும் அவருடைய நியமங்களையும் கடைப்பிடிப்பதும்தானே?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘கடைப்பிடிப்பது’ என்பதை ‘கைக்கொள்வது’ அல்லது ‘காத்துக்கொள்வது’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִשְׁמֹר
  choice: கடைப்பிடிப்பது
  rationale: לְ உடன் வரும் வினையெச்சப் பெயர்ச்சொல் வடிவம், முந்தைய வசனத்தில் யாவே கோருவது என்ன என்பதன் தொடர்ச்சியான உள்ளடக்கத்தைத் தெரிவிக்கிறது. ‘கடைப்பிடிப்பது’ என்பது கட்டளைகளுக்குக் கீழ்ப்படிந்து அவற்றின்படி நடப்பதை இயல்பான நவீன தமிழில் தருகிறது; ‘கைக்கொள்வது’, ‘காத்துக்கொள்வது’ என்ற நிழற்பொருள்களும் அடிக்குறிப்பில் வைக்கப்பட்டுள்ளன.
- source_word: מִצְוֺת
  choice: கட்டளைகள்
  rationale: இந்தப் பன்மைச் சொல் யாவே விதித்த கடமைகளைக் குறிக்கிறது. ‘கட்டளைகள்’ என்பது தமிழில் தெளிவாகவும் உடன்படிக்கை-சட்டச் சூழலுக்கு ஏற்றவாறும் உள்ளது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய மூலத்தில் வரும் தேவனுடைய தனிப்பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் பரவலாகப் புரிந்துகொள்ளக்கூடிய ஒலிபெயர்ப்பாகத் தருகிறது.
- source_word: חֻקֹּתָיו
  choice: அவருடைய நியமங்கள்
  rationale: חֻקִּים என்பது நிர்ணயிக்கப்பட்ட சட்ட விதிமுறைகளைக் குறிக்கிறது. ‘நியமங்கள்’ சட்ட-உடன்படிக்கைப் பதிவைத் தக்கவைத்து, ‘கட்டளைகள்’ என்பதுடன் இயல்பாக இணைகிறது.
- source_word: אֲשֶׁר אָנֹכִי מְצַוְּךָ הַיּוֹם
  choice: இன்று நான் உனக்குக் கட்டளையிடும்
  rationale: இந்த உறவுப்பெயர் தொடர் ‘கட்டளைகள்’, ‘நியமங்கள்’ இரண்டையும் விளக்குகிறது. எபிரெய நிகழ்காலச் செயற்பாங்கையும் ‘இன்று’ என்பதன் உடனடித் தன்மையையும் இயல்பான தமிழில் காக்கிறது.
- source_word: לְטוֹב לָךְ
  choice: உன் நன்மைக்காக
  rationale: இந்தச் சொற்றொடர் இக்கட்டளைகள் இஸ்ரவேலரின் நன்மை அல்லது பயனை நோக்கமாகக் கொண்டவை என்பதைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற தேவப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: யெகோவா; கர்த்தர்
  rationale: மூலவசனம் நான்கெழுத்துத் தேவப்பெயரை நேரடியாகப் பயன்படுத்துகிறது. அதனைப் பொதுப்பட்டமான ‘கர்த்தர்’ என்று மாற்றாமல் ‘யாவே’ என ஒலிபெயர்ப்பது உடன்படிக்கையின் தனிப்பெயரைத் தக்கவைக்கிறது.
- issue: לְטוֹב לָךְ என்பதன் நோக்கம் அல்லது விளைவு
  choice: உன் நன்மைக்காக
  alternative: உனக்கு நன்மை உண்டாகும்படி
  rationale: எபிரெயச் சொற்றொடர் பயனளிக்கும் நோக்கத்தையோ விளைவையோ குறிக்கக்கூடும். ‘உன் நன்மைக்காக’ இந்த இரண்டையும் தேவையின்றி பிரித்துத் தீர்மானிக்காமல் வைத்திருக்கிறது.
translation_notes:
  register: முந்தைய வசனத்தில் தொடங்கும் வினாவைத் தொடரும் துணை வாக்கியமாகவே மொழிபெயர்க்கப்பட்டுள்ளது; ஆகவே இறுதியில் வினாக்குறியும் ‘-தும்தானே’ என்ற தொடர்ச்சி வடிவமும் பயன்படுத்தப்பட்டுள்ளன. நடை நவீனமானதும், கண்ணியமானதும், சட்ட-உடன்படிக்கைச் சொற்களின் தன்மையைத் தக்கவைத்ததுமாகும்.
