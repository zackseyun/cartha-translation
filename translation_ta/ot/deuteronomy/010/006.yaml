  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்கு எளிதில் புரியும், அதேவேளை கண்ணியமான வேதாகம நடையைக் கடைப்பிடிக்கிறது. இடப்பெயர்கள் ஒலிபெயர்க்கப்பட்டுள்ளன; மூலத்தின் இடக் குறிப்பின் மறுபதிப்பு மற்றும் செயப்பாட்டு அமைப்பு பாதுகாக்கப்பட்டுள்ளன.
