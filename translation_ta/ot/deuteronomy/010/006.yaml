source:
  edition: WLC
  text: וּ/בְנֵ֣י יִשְׂרָאֵ֗ל נָֽסְע֛וּ מִ/בְּאֵרֹ֥ת בְּנֵי יַעֲקָ֖ן מוֹסֵרָ֑ה שָׁ֣ם מֵ֤ת אַהֲרֹן֙ וַ/יִּקָּבֵ֣ר שָׁ֔ם וַ/יְכַהֵ֛ן אֶלְעָזָ֥ר בְּנ֖/וֹ תַּחְתָּֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/006.yaml
  text: The sons of Israel journeyed from Beeroth Bene-jaakan to Moserah[a]. There Aaron died, and there he was buried[b]; and Eleazar his son served as priest in his place.
translation:
  language: ta
  text: இஸ்ரவேலின் மக்கள் பெயேரோத்-பெனே-யாக்கானிலிருந்து மோசேராவுக்குப் புறப்பட்டுச் சென்றார்கள்.[a] அங்கே ஆரோன் இறந்தார்; அங்கேயே அவர் அடக்கம் செய்யப்பட்டார். அவருக்குப் பதிலாக அவருடைய மகன் எலெயாசார் ஆசாரியராகப் பணியாற்றினார்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “பெயேரோத்-பெனே-யாக்கான்” என்பதற்கு சொல்லுக்குச் சொல் “யாக்கானின் மக்களுடைய கிணறுகள்” என்று பொருள் கொள்ளலாம்; இங்கே அது ஓர் இடப்பெயராக ஒலிபெயர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அவருக்குப் பின் அவருடைய மகன் எலெயாசார் ஆசாரியராகப் பணியாற்றினார்.” எபிரெய மூலத்தில் சொல்லுக்குச் சொல் “அவருடைய இடத்தில்” என்று உள்ளது; இது பதவிவழி தொடர்ச்சியைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בְנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் மக்கள்
  rationale: எபிரெய மொழியின் ‘இஸ்ரவேலின் மகன்கள்’ என்ற தேசிய-வம்சவழிச் சொல்லாட்சியை, நவீன தமிழில் இயல்பாகவும் அனைவரையும் உள்ளடக்கும் வகையிலும் ‘இஸ்ரவேலின் மக்கள்’ என வழங்குகிறது. தொடக்க וּ தனியாக ‘இப்போது’ என்ற காலப்பொருளைத் தராததால் கூடுதல் காலச்சொல் சேர்க்கப்படவில்லை.
- source_word: נָסְעוּ
  choice: புறப்பட்டுச் சென்றார்கள்
  rationale: נסע என்பது பயணச் சூழலில் முகாமைக் கலைத்துப் புறப்படுதல் அல்லது அடுத்த இடத்தை நோக்கிச் செல்லுதல் என்பதைக் குறிக்கிறது; ‘புறப்பட்டுச் சென்றார்கள்’ அந்தப் பயண உணர்வை இயல்பான தமிழில் தருகிறது.
- source_word: מִ/בְּאֵרֹת בְּנֵי יַעֲקָן
  choice: பெயேரோத்-பெனே-யாக்கானிலிருந்து
  rationale: இது வனாந்தரப் பயணப் பட்டியலிலுள்ள இடப்பெயராக இருப்பதால் மொழிபெயர்க்காமல் ஒலிபெயர்க்கப்பட்டுள்ளது; מִן பின்னொட்டு ‘-இலிருந்து’ என வழங்கப்பட்டுள்ளது.
- source_word: מוֹסֵרָה
  choice: மோசேராவுக்கு
  rationale: பெயருக்கு முன் தனிப் பயண முன்னிடைச்சொல் இல்லாவிட்டாலும், ‘இலிருந்து புறப்பட்டுச் சென்றார்கள்’ என்ற அமைப்பு இலக்கை உணர்த்துவதால் தமிழில் ‘-வுக்கு’ சேர்க்கப்பட்டுள்ளது.
- source_word: שָׁם
  choice: அங்கே / அங்கேயே
  rationale: மூலத்தில் இருமுறை வரும் இடக் குறிப்பைத் தக்கவைத்து, இரண்டாவது இடத்தில் வலியுறுத்தும் இயல்பான தமிழ் வடிவமான ‘அங்கேயே’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: וַ/יִּקָּבֵר
  choice: அவர் அடக்கம் செய்யப்பட்டார்
  rationale: நிஃபால் வினை வடிவத்தின் செயப்பாட்டு பொருளைத் தக்கவைக்கிறது; மூலத்தில் இல்லாத அடக்கம் செய்தவர்களைச் சேர்க்கவில்லை.
- source_word: וַ/יְכַהֵן
  choice: ஆசாரியராகப் பணியாற்றினார்
  rationale: כהן என்ற வினை ஆசாரியராகச் செயல்படுதல் அல்லது பணியாற்றுதல் எனப் பொருள்படும்; வெறுமனே பதவியேற்றார் என்பதைக் காட்டிலும் பணிச் செயல்பாட்டை இது தெளிவாகக் காட்டுகிறது.
- source_word: אֶלְעָזָר בְּנוֹ תַּחְתָּיו
  choice: அவருக்குப் பதிலாக அவருடைய மகன் எலெயாசார்
  rationale: תַּחְתָּיו என்பதன் ‘அவருடைய இடத்தில்/அவருக்குப் பதிலாக’ என்ற வாரிசுரிமைப் பொருளை இயல்பான தமிழில் தக்கவைக்கிறது.
