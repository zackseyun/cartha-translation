language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: הֵ֚ן לַ/יהוָ֣ה אֱלֹהֶ֔י/ךָ הַ/שָּׁמַ֖יִם וּ/שְׁמֵ֣י הַ/שָּׁמָ֑יִם הָ/אָ֖רֶץ וְ/כָל אֲשֶׁר בָּֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/014.yaml
  text: Behold[a], to Yahweh your God belong the heavens, even the highest heavens, the earth, and all that is in it.
translation:
  language: ta
  text: இதோ, வானங்களும், மிக உயர்ந்த வானங்களும்[a], பூமியும் அதிலுள்ள அனைத்தும் உன் கடவுளாகிய யாவேக்கே உரியவை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொற்படி, “வானங்களின் வானங்கள்.”
    reason: எபிரெய மொழியின் தீவிரப்படுத்தும் அமைப்பைச் சொற்படி பதிவு செய்வதற்காக.
lexical_decisions:
- source_word: הֵן
  choice: இதோ
  rationale: கவனத்தை ஈர்த்து, கூற்றுக்கு வலியுறுத்தலை அளிக்கும் உரையாடல் துகள்; வசனத்தின் கம்பீரமான அறிவிப்புத் தொனியை இயல்பான தமிழில் காக்கிறது.
- source_word: לַיהוָה אֱלֹהֶיךָ
  choice: உன் கடவுளாகிய யாவேக்கே உரியவை
  rationale: לְ குறிக்கும் உடைமை உறவைத் தமிழில் ‘உரியவை’ எனத் தெளிவாக வெளிப்படுத்துகிறது; இரண்டாம் நபர் ஒருமை அழைப்பான ‘உன் கடவுள்’ என்பதையும் காக்கிறது.
- source_word: הַשָּׁמַיִם
  choice: வானங்கள்
  rationale: எபிரெயச் சொல்லின் பன்மை வடிவத்தையும், இச்சூழலின் பரந்த அண்டவியல் பொருளையும் காக்கிறது.
- source_word: וּשְׁמֵי הַשָּׁמָיִם
  choice: மிக உயர்ந்த வானங்கள்
  rationale: ‘வானங்களின் வானங்கள்’ என்ற எபிரெய தீவிரப்படுத்தும் அமைப்பின் பொருளைத் தெளிவான நவீன தமிழில் தெரிவிக்கிறது; சொற்படி வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: הָאָרֶץ
  choice: பூமி
  rationale: ‘வானங்கள்’ என்பதற்கு இணையாகவும், அதிலுள்ள அனைத்தையும் உள்ளடக்கும் அண்டவியல் சூழலிலும் வருவதால் ‘நாடு’ என்பதற்குப் பதிலாக ‘பூமி’ பொருத்தமானது.
- source_word: וְכָל אֲשֶׁר בָּהּ
  choice: அதிலுள்ள அனைத்தும்
  rationale: பூமிக்குள் அல்லது அதில் உள்ள முழுத் தொகுதியையும் சுருக்கமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் நான்கெழுத்து இறைப் பெயர் நேரடியாக வருகிறது; அதனை ஒரு பட்டமாக மாற்றாமல் உடன்படிக்கையின் தனிப்பெயராகப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன பொதுத்தரத் தமிழில், கம்பீரமான வேதாகமத் தொனியுடன் வடிவமைக்கப்பட்டது. இயல்பான தமிழ் வாக்கிய அமைப்புக்காக உடைமையைக் குறிக்கும் ‘உரியவை’ இறுதியில் வைக்கப்பட்டுள்ளது; மூலத்தின் பரந்த அண்டவியல் இணைவரிசை காக்கப்பட்டுள்ளது.
