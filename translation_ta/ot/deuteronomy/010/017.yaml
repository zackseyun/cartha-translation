  text: כִּ֚י יְהוָ֣ה אֱלֹֽהֵי/כֶ֔ם ה֚וּא אֱלֹהֵ֣י הָֽ/אֱלֹהִ֔ים וַ/אֲדֹנֵ֖י הָ/אֲדֹנִ֑ים הָ/אֵ֨ל הַ/גָּדֹ֤ל הַ/גִּבֹּר֙ וְ/הַ/נּוֹרָ֔א אֲשֶׁר֙ לֹא יִשָּׂ֣א פָנִ֔ים וְ/לֹ֥א יִקַּ֖ח שֹֽׁחַד־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/017.yaml
  text: For Yahweh your God is God of gods and Lord of lords[a], the great, mighty, and awesome God, who shows no partiality and takes no bribe.
translation:
  language: ta
  text: ஏனெனில், உங்கள் கடவுளாகிய யாவே தெய்வங்களின் கடவுளும் ஆண்டவர்களின் ஆண்டவரும் ஆவார்; அவரே மகத்தானவரும் வல்லமையுள்ளவரும் அஞ்சத்தக்கவருமான[a] கடவுள். அவர் பாரபட்சம் காட்டுவதில்லை; கையூட்டு வாங்குவதுமில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது: “பயபக்தியைத் தூண்டுகிறவர்” அல்லது “பிரமிப்பூட்டுகிறவர்.” எபிரெயத்தில், “அஞ்சப்படுகிறவர்”; அதாவது, பயபக்தியைத் தூண்டும் கடவுள்.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய அறிவுறுத்தலுக்கான காரணத்தை அறிமுகப்படுத்தும் எபிரெய இணைப்புச்சொல்லின் காரணப் பொருளை இயல்பான தமிழில் காக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைப்பட்டத்தால் மாற்றாமல், எபிரெய நான்கெழுத்துத் திருப்பெயரை நவீன தமிழில் ஒலிபெயர்க்கிறது.
- source_word: אֱלֹהֵיכֶם
  choice: உங்கள் கடவுள்
  rationale: இஸ்ரவேலரை நோக்கிய இரண்டாம் நபர் பன்மை உடைமை வடிவையும், இச்சூழலில் தேவைப்படும் ஒருமைப் பொருளையும் தெரிவிக்கிறது.
- source_word: אֱלֹהֵי הָאֱלֹהִים
  choice: தெய்வங்களின் கடவுள்
  rationale: மற்ற தெய்வங்களின் இயல்பைப் பற்றி வசனம் கூறாத ஒன்றைச் சேர்க்காமல், எபிரெய கட்டமைப்பையும் மேலாதிக்க வலியுறுத்தலையும் காக்கிறது.
- source_word: וַאֲדֹנֵי הָאֲדֹנִים
  choice: ஆண்டவர்களின் ஆண்டவர்
  rationale: இணையான எபிரெய சிறப்புப்பெயரை அதன் உயரிய நடையுடன் இயல்பான தமிழில் தருகிறது.
- source_word: הָאֵל הַגָּדֹל הַגִּבֹּר
  choice: மகத்துவமுள்ளவரும் வல்லமையுள்ளவருமான கடவுள்
  rationale: אֵל என்பதை இறைப்பட்டமாகவும், தொடரும் பெயரடைகளை அவரது மகத்துவத்தையும் வல்லமையையும் குறிக்கும் பண்புகளாகவும் மொழிபெயர்க்கிறது.
- source_word: וְהַנּוֹרָא
  choice: பயபக்தியைத் தூண்டுகிறவர்
  rationale: ירא வேரிலிருந்து வரும் சொல் ஏற்படுத்தும் அச்சம், பிரமிப்பு, பயபக்தி ஆகிய அர்த்தவட்டத்தை, வெறும் பயங்கரத்தன்மையாகக் குறுக்காமல் வெளிப்படுத்துகிறது.
- source_word: אֲשֶׁר לֹא יִשָּׂא פָנִים
  choice: அவர் பாரபட்சம் காட்டுவதில்லை
  rationale: சொல்லுக்குச் சொல் ‘முகங்களை உயர்த்துவதில்லை’ என்ற எபிரெய மரபுத்தொடரின் நீதித்துறை சார்ந்த பொருளைத் தெளிவான தமிழில் தருகிறது.
- source_word: וְלֹא יִקַּח שֹׁחַד
  choice: கையூட்டு வாங்குவதுமில்லை
  rationale: லஞ்சத்தை ஏற்றுக்கொள்ளாமையைக் குறிக்கும் சட்ட-அறப் பொருளை சாதாரண நவீன வாசகருக்கு நேரடியாகத் தெரிவிக்கிறது.
theological_decisions:
- issue: ‘தெய்வங்களின் கடவுள், ஆண்டவர்களின் ஆண்டவர்’ என்ற தொடர் மற்ற தெய்வங்களை அங்கீகரிக்கிறதா என்ற கேள்வி
  choice: எபிரெய மேலாதிக்கச் சூத்திரத்தை நேரடியாகத் தக்கவைத்தல்
  alternative: எல்லா தெய்வங்களுக்கும் மேலான கடவுளும் எல்லா ஆண்டவர்களுக்கும் மேலான ஆண்டவரும்
  rationale: மூலத்தின் திட்டமிட்ட கட்டமைப்பையும் ஒப்பற்ற இறையாட்சியையும் காக்கிறது; மற்ற ‘தெய்வங்களின்’ இருப்பியல் நிலையை வசனத்திற்குப் புறம்பாகத் தீர்மானிப்பதில்லை.
- issue: יְהוָה என்ற திருப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: பொதுப்பட்டத்தால் மாற்றாமல் தனிப்பட்ட திருப்பெயரை ஒலிபெயர்க்கிறது; ‘Yahweh’ என்ற மூல ஆதாரத் தீர்மானத்துடன் ஒத்துள்ளது.
- issue: הַנּוֹרָא என்பதிலுள்ள அச்சமும் பயபக்தியும்
  choice: பயபக்தியைத் தூண்டுகிறவர்
  alternative: அஞ்சத்தக்கவர்; பிரமிப்பூட்டுகிறவர்
  rationale: தெய்வீக வல்லமையால் எழும் அச்சத்தை நீக்காமலும், அதை வெறும் பயங்கரத்தன்மையாக மாற்றாமலும் மூலத்திலுள்ள அர்த்தத் திணறலைக் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகருக்கு எளிதில் புரியும் அதேவேளையில் உயரிய வேதநடையைத் தக்கவைக்கும் சொற்கள் பயன்படுத்தப்பட்டுள்ளன. நீண்ட எபிரெய அடைமொழித் தொடரைத் தமிழில் தெளிவுபடுத்த இரண்டு வாக்கியங்களாக அமைத்துள்ளோம்; இணையான பட்டங்களும் இறுதி நீதிசார் மறுப்புகளும் பாதுகாக்கப்பட்டுள்ளன.
