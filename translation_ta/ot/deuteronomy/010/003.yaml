source:
  edition: WLC
  text: וָ/אַ֤עַשׂ אֲרוֹן֙ עֲצֵ֣י שִׁטִּ֔ים וָ/אֶפְסֹ֛ל שְׁנֵי לֻחֹ֥ת אֲבָנִ֖ים כָּ/רִאשֹׁנִ֑ים וָ/אַ֣עַל הָ/הָ֔רָ/ה וּ/שְׁנֵ֥י הַ/לֻּחֹ֖ת בְּ/יָדִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/003.yaml
  text: So I made an ark of acacia wood and cut two stone tablets like the first ones[a], and I went up the mountain with the two tablets in my hand.
translation:
  language: ta
  text: ஆகவே, நான் அகேசியா மரத்தால் ஒரு பேழையைச் செய்து, முதல் பலகைகளைப் போன்ற இரண்டு கற்பலகைகளைச் செதுக்கினேன்[a]. அந்த இரண்டு கற்பலகைகளையும் என் கையில் வைத்துக்கொண்டு மலையில் ஏறினேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “வெட்டி வடிவமைத்தேன்.”
    reason: פסל என்ற வினை கல்லை வெட்டிச் செதுக்கி வடிவமைக்கும் செயலைக் குறிக்கலாம்.
lexical_decisions:
- source_word: אֲרוֹן
  choice: பேழை
  rationale: இந்தச் சொல் பொதுவாகப் பெட்டி அல்லது பேழையைக் குறிக்கும். இங்கே கற்பலகைகளை வைப்பதற்குரிய புனிதப் பெட்டி என்பதால், கூடுதல் விளக்கம் சேர்க்காமல் சூழலுக்கு ஏற்ற கண்ணியமான சொலாக ‘பேழை’ பயன்படுத்தப்பட்டது.
- source_word: עֲצֵי שִׁטִּים
  choice: அகேசியா மரம்
  rationale: குறிப்பிட்ட மரவகையைப் பாதுகாத்து, பழைய ஒலிபெயர்ப்பைவிட நவீன வாசகருக்குத் தெளிவாக இருக்க ‘அகேசியா மரம்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: וָאֶפְסֹל
  choice: செதுக்கினேன்
  rationale: פסל இங்கு கல்லை வெட்டி வடிவமைப்பதைக் குறிக்கிறது. ‘செதுக்கினேன்’ என்பது செயலை இயல்பாகத் தெரிவிக்கிறது; ‘வெட்டி வடிவமைத்தேன்’ என்ற சொல்லாக்கம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: לֻחֹת אֲבָנִים
  choice: கற்பலகைகள்
  rationale: கல்லால் செய்யப்பட்ட எழுதும் பலகைகள் என்ற பொருளைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: כָּרִאשֹׁנִים
  choice: முந்தையவற்றைப் போன்ற
  rationale: மோசே முன்பு பெற்ற பலகைகளோடு இவை ஒத்திருந்ததைத் தெரிவிக்கிறது; ‘முதல்’ என்பதைக் காட்டிலும் இச்சூழலில் ‘முந்தைய’ என்பது இயல்பானது.
- source_word: וָאַעַל הָהָרָה
  choice: மலையில் ஏறினேன்
  rationale: திசைச்சுட்டு வடிவம் மலையை நோக்கிச் சென்றதையே அல்லாமல் அதில் மேலே ஏறியதையும் குறிக்கிறது.
- source_word: בְּיָדִי
  choice: என் கையில் எடுத்துக்கொண்டு
  rationale: எபிரெய மூலத்தின் ஒருமையான ‘என் கையில்’ என்பதைப் பாதுகாத்து, தமிழில் சுமந்து சென்ற செயலை இயல்பாகக் கூறுகிறது.
- source_word: וָאַעַשׂ
  choice: செய்து
  rationale: עשה என்பதன் நேரடியான ‘செய்/உருவாக்கு’ பொருளைச் செயல்வரிசைக்கு ஏற்றவாறு ‘செய்து’ எனத் தருகிறது.
theological_decisions:
- issue: உடன்படிக்கைக் கற்பலகைகளுக்குரிய புனிதப் பெட்டியின் பெயர்
  choice: பேழை
  alternative: பெட்டி
  rationale: ‘பேழை’ என்பது אֲרוֹן என்பதன் பெட்டி போன்ற பொருளையும் இச்சூழலின் புனிதப் பயன்பாட்டையும் காக்கிறது; அதேவேளையில் மூலத்தில் இல்லாத ‘உடன்படிக்கை’ போன்ற விளக்கச் சொல்லை வசனத்திற்குள் சேர்ப்பதில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகருக்குப் புரியும் வகையிலும் வேதாகமச் சூழலுக்கேற்ற கண்ணியத்துடனும் மொழிபெயர்க்கப்பட்டது. எபிரெய உரையின் செயல்வரிசையும் ‘என் கையில்’ என்ற ஒருமையும் பாதுகாக்கப்பட்டுள்ளன.
