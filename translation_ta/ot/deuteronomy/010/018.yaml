source:
  edition: WLC
  text: עֹשֶׂ֛ה מִשְׁפַּ֥ט יָת֖וֹם וְ/אַלְמָנָ֑ה וְ/אֹהֵ֣ב גֵּ֔ר לָ֥/תֶת ל֖/וֹ לֶ֥חֶם וְ/שִׂמְלָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/018.yaml
  text: He executes justice for the fatherless and the widow[a], and loves the sojourner[c][b], giving him food and clothing.
translation:
  language: ta
  text: அவர் தந்தையற்றவருக்கும்[a] விதவைக்கும் நீதி வழங்குகிறார்; குடியிருக்கும் அந்நியரை[b] நேசித்து, அவருக்கு உணவும் உடையும்[c] அளிக்கிறார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அநாதை.’ எபிரெயச் சொல் יָתוֹם குறிப்பாகத் தந்தையை இழந்த அல்லது தந்தையின் பாதுகாப்பின்றி இருக்கும் ஒருவரைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘குடியேறிய அந்நியர்’ அல்லது ‘அந்நியர்.’ எபிரெயச் சொல் גֵּר, வெறுமனே வழியாகச் செல்பவரை அல்ல, இஸ்ரவேலரிடையே குடியிருக்கும் பிறநாட்டவரைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: c
    text: சொல்லளவில், ‘அப்பமும் உடையும்.’ இங்கு ‘அப்பம்’ அடிப்படை உணவைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֹשֶׂה מִשְׁפַּט
  choice: நீதி வழங்குகிறார்
  rationale: מִשְׁפַּט என்பதுடன் עֹשֶׂה சேர்ந்து, பொதுவாக ‘செய்கிறார்’ என்பதைக் காட்டிலும் நீதியை நடைமுறைப்படுத்துதல் அல்லது உரிய நீதியை வழங்குதல் என்ற பொருளைத் தருகிறது.
- source_word: יָתוֹם
  choice: தந்தையற்றவர்
  rationale: எபிரெயச் சொல் குறிப்பாகத் தந்தையை இழந்த அல்லது தந்தையின் பாதுகாப்பின்றி இருக்கும் ஒருவரைக் குறிக்கிறது; ஆகவே ‘அநாதை’ என்பதைவிட ‘தந்தையற்றவர்’ அதன் சட்ட-சமூக நுட்பத்தைத் தெளிவாகக் காக்கிறது.
- source_word: אַלְמָנָה
  choice: விதவை
  rationale: மூலத்தில் குறிப்பிடப்படும் சமூகப் பிரிவுக்கான இயல்பான, துல்லியமான நவீனத் தமிழ்ச் சொல்.
- source_word: אֹהֵב
  choice: நேசித்து
  rationale: இது அந்நியராகக் குடியிருப்பவர்மீது கடவுள் கொண்டுள்ள செயற்படும் அன்பை நேரடியாக வெளிப்படுத்துகிறது; தொடர்ந்து வரும் அளித்தலை அந்த அன்பின் வெளிப்பாடாக இயல்பாக இணைக்கிறது.
- source_word: גֵּר
  choice: அந்நியராகக் குடியிருப்பவர்
  rationale: இச்சொல் வழிப்போக்கரை அல்ல, இஸ்ரவேலரிடையே வாழும் பிறநாட்டைச் சேர்ந்த குடியிருப்பாளரைக் குறிக்கிறது. இந்த மொழிபெயர்ப்பு அந்நியர் என்ற நிலையையும் குடியிருக்கும் தன்மையையும் காக்கிறது.
- source_word: לָתֶת לוֹ
  choice: அவருக்கு ... அளிக்கிறார்
  rationale: அன்பு எவ்வாறு செயலாக வெளிப்படுகிறது என்பதை நோக்கத்துடனும் விளைவுடனும் காட்டும் எபிரெய முடிவிலியை இயல்பான தமிழில் தொடர்வினையாக வழங்குகிறது.
- source_word: לֶחֶם
  choice: உணவு
  rationale: சொல்லளவில் ‘அப்பம்’ என்றாலும், உடையுடன் இணையும் இச்சூழலில் அடிப்படை வாழ்வாதாரமான உணவைக் குறிக்கும் ஆகுபெயராக உள்ளது.
- source_word: שִׂמְלָה
  choice: உடை
  rationale: ஆடை அல்லது உடுப்பைக் குறிக்கும் பொதுச்சொல்; உணவுடன் சேர்ந்து அடிப்படைத் தேவையை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: சமூகத்தில் பாதுகாப்பற்றவர்கள்மீது கடவுளின் அக்கறை
  choice: கடவுள் அவர்களுக்குரிய நீதியை வழங்குவதையும், அந்நியராகக் குடியிருப்பவரை நேசித்து அவரது அடிப்படைத் தேவைகளை அளிப்பதையும் இணைத்துக் கூறுதல்
  alternative: சட்டரீதியான பாதுகாப்பை மட்டும் அல்லது உணர்வுபூர்வமான இரக்கத்தை மட்டும் வலியுறுத்துதல்
  rationale: மூல எபிரெயம் நீதிச் செயல், அன்பு, பொருளாதாரப் பராமரிப்பு ஆகிய அனைத்தையும் ஒன்றாக முன்வைக்கிறது. மொழிபெயர்ப்பு இவற்றில் ஒன்றை மற்றொன்றாகச் சுருக்காமல் அந்த இறையியல் அழுத்தத்தைப் பேணுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் மரியாதையான நடை பயன்படுத்தப்பட்டுள்ளது. ‘நீதி வழங்குகிறார்’ என்பது நீதிசார் செயற்பாட்டைத் தெளிவாக்குகிறது; ‘அந்நியராகக் குடியிருப்பவர்’ என்பது גֵּר என்பதன் சமூக-சட்ட நுட்பத்தை மிகப் பழமையான சொற்கள் இன்றி காக்கிறது. ஒருமைச் சமூகப் பிரிவுகளுக்கு மரியாதைப் பன்மை வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன.
