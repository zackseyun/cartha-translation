base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/011.yaml
  text: And Yahweh said to me[a], “Arise, go before the people for the journey[c][b], so that they may go in and take possession of the land that I swore to their fathers to give to them.”
translation:
  language: ta
  text: யாவே என்னிடம், “எழுந்து, மக்களுக்கு முன்பாகப் பயணிக்கப் புறப்படு; அவர்கள் சென்று, அவர்களுடைய தந்தையருக்குக் கொடுப்பதாக நான் சத்தியம் செய்த அந்த நாட்டை உடைமையாக்கிக்கொள்ளும்படி” என்றார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “தந்தையர்” என்பது இங்கு அவர்களுடைய முற்பிதாக்களைக் குறிக்கிறது.
    reason: lexical_clarification
lexical_decisions:
- source_word: יְהוָה
  choice: யெகோவா
  rationale: தமிழ் வேதாகம மரபில் பரவலாக அறியப்படும் வடிவில் இறைப்பெயரைத் தலைப்பாக மாற்றாமல் தனிப்பெயராக வழங்குகிறது.
- source_word: קוּם לֵךְ לְמַסַּע לִפְנֵי הָעָם
  choice: எழுந்து, மக்களுக்கு முன்பாகப் பயணத்தைத் தொடங்கு
  rationale: இரு கட்டளைகளையும் பயணச் சூழலையும் இயல்பான நவீனத் தமிழில் இணைக்கிறது; לִפְנֵי என்பதன் இடம் மற்றும் தலைமை சார்ந்த நுணுக்கங்களையும் காக்கிறது.
- source_word: וְיָבֹאוּ וְיִרְשׁוּ
  choice: அவர்கள் சென்று, அதைத் தங்கள் உடைமையாக்கிக்கொள்ளட்டும்
  rationale: நாட்டிற்குள் நுழைவதையும் அதைக் கைப்பற்றி உடைமையாக்குவதையும் தொடர்ச்சியான செயல்களாக வெளிப்படுத்துகிறது; எபிரெய வினை வடிவங்களின் கட்டளை சார்ந்த விளைவு நுணுக்கத்தை ‘கொள்ளட்டும்’ காட்டுகிறது.
- source_word: הָאָרֶץ
  choice: அந்த நாடு
  rationale: இங்கு வாக்குறுதி அளிக்கப்பட்ட குறிப்பிட்ட நிலப்பரப்பைக் குறிக்கிறது; தமிழில் ‘நாடு’ இயல்பாகவும் சூழலுக்குப் பொருத்தமாகவும் உள்ளது.
- source_word: נִשְׁבַּעְתִּי
  choice: நான் ... ஆணையிட்ட
  rationale: இறைவன் உறுதிமொழி செய்ததைக் குறிக்கும் உடன்படிக்கை சார்ந்த சத்திய மொழியைச் சுருக்கமாகவும் கண்ணியமாகவும் வெளிப்படுத்துகிறது.
- source_word: לַאֲבֹתָם
  choice: அவர்களுடைய தந்தையருக்கு
  rationale: வரலாற்றில் குறிப்பிட்ட முற்பிதாக்களைக் குறிக்கும் மூலத்தின் ஆண்பால் பன்மையைத் தக்கவைக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யெகோவா
  alternative: யாவே
  rationale: இறைப்பெயரை ‘கர்த்தர்’ என்ற பட்டத்தால் மாற்றாமல் தனிப்பெயராகவே வைக்கிறது; ‘யெகோவா’ தமிழ் வாசகர்களிடையே நிலைபெற்ற வடிவம், ஆனால் ‘யாவே’ மூல உச்சரிப்பை மீட்டமைக்க முயலும் மாற்று வடிவமாகும்.
- issue: לַאֲבֹתָם என்பதன் பாலினம் மற்றும் வரலாற்றுக் குறிப்பு
  choice: அவர்களுடைய தந்தையருக்கு
  alternative: அவர்களுடைய மூதாதையருக்கு
  rationale: மூலத்தில் உள்ள ஆண்பால் சொல்லையும், வாக்குறுதியைப் பெற்ற முற்பிதாக்களைப் பற்றிய வரலாற்றுச் சிறப்பையும் தக்கவைக்கிறது.
- issue: וְיָבֹאוּ וְיִרְשׁוּ என்பதன் தொடர்பு
  choice: அவர்கள் ... கொள்ளட்டும்
  alternative: அவர்கள் ... கொள்வார்கள்
  rationale: முன்னுள்ள கட்டளையுடன் தொடர்புடைய நோக்கம் அல்லது எதிர்பார்க்கப்பட்ட விளைவு என்ற நுணுக்கத்தைத் தக்கவைக்கிறது; வெறும் எதிர்கால அறிவிப்பாக மட்டும் தீர்மானிக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. நேரடிப் பேச்சின் கட்டளைத் தன்மையும் வாக்குறுதியின் உறுதிமொழி மொழியும் பாதுகாக்கப்பட்டுள்ளன.
