revisions:
- from: யெகோவா என்னிடம், “எழுந்து, மக்களுக்கு முன்பாகப் பயணத்தைத் தொடங்கு[a]. நான் அவர்களுடைய தந்தையருக்குக் கொடுப்பதாக ஆணையிட்ட அந்த நாட்டிற்குள் அவர்கள் சென்று, அதைத் தங்கள் உடைமையாக்கிக்கொள்ளட்டும்[b]” என்றார்.
  to: யாவே என்னிடம், “எழுந்து, மக்களுக்கு முன்பாகப் பயணிக்கப் புறப்படு; அவர்கள் சென்று, அவர்களுடைய தந்தையருக்குக் கொடுப்பதாக நான் சத்தியம் செய்த அந்த நாட்டை உடைமையாக்கிக்கொள்ளும்படி” என்றார்.[a]
  rationale: The revision corrects the oath terminology, aligns the divine name with the source-based POB decision, and uses idiomatic modern Tamil while preserving the command to Moses to lead the people on the journey and the purpose that they enter and possess the promised land. The footnote is anchored to ‘தந்தையர்’ in the revised text.
