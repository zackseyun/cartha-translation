base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/004.yaml
  text: And he wrote on the tablets[a], like the first writing, the Ten Words that Yahweh had spoken to you on the mountain from the midst of the fire on the day of the assembly; and Yahweh gave them to me.
translation:
  language: ta
  text: அவர் அந்தப் பலகைகளில், முதலில் எழுதப்பட்டதுபோலவே, சபை கூடிய நாளில் மலையில் நெருப்பின் நடுவிலிருந்து யாவே உங்களிடம் பேசிய பத்துச் சொற்களை[a] எழுதினார்; யாவே அவற்றை என்னிடம் கொடுத்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'மரபாக, “பத்துக் கட்டளைகள்” என்றும் மொழிபெயர்க்கப்படுகிறது. எபிரெயத்தில்: “பத்துச் சொற்கள்.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּכְתֹּב
  choice: எழுதினார்
  rationale: כתב என்பதன் இயல்பான பொருளைத் தருகிறது; கற்பலகைகளில் பொறித்தல் சூழலால் சாத்தியமானாலும், மூலத்தில் உள்ள ‘எழுத்து’ என்ற தொடர்பையும் காக்கிறது.
- source_word: הַלֻּחֹת
  choice: அந்தப் பலகைகள்
  rationale: உடன்படிக்கையின் முன்பே குறிப்பிடப்பட்ட பலகைகளைச் சுட்டுகிறது; இவ்வசனத்தில் வெளிப்படையாக இல்லாத ‘கல்’ என்பதைச் சேர்க்கவில்லை.
- source_word: כַּמִּכְתָּב הָרִאשׁוֹן
  choice: முதல் எழுத்தைப் போலவே
  rationale: כְּ என்பதன் ஒப்பீட்டுப் பொருளையும், מִכְתָּב என்பதன் ‘எழுத்து/எழுதப்பட்டது’ என்ற பொருளையும் தேவையற்ற விளக்கமின்றிக் காக்கிறது.
- source_word: עֲשֶׂרֶת הַדְּבָרִים
  choice: பத்துச் சொற்கள்
  rationale: எபிரெய வெளிப்பாட்டின் நேரடியான பொருள் ‘பத்து சொற்கள்’; மரபான ‘பத்துக் கட்டளைகள்’ அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீக உடன்படிக்கைப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் இயல்பான ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: מִתּוֹךְ הָאֵשׁ
  choice: நெருப்பின் நடுவிலிருந்து
  rationale: தெய்வீகப் பேச்சு நெருப்பின் உள்ளிருந்து வந்தது என்ற மூலத்தின் உயிரோட்டமான படிமத்தைக் காக்கிறது.
- source_word: בְּיוֹם הַקָּהָל
  choice: சபை கூடிய நாளில்
  rationale: கָהָל குறிக்கும் இஸ்ரவேலின் ஒன்றுகூடிய சபையையும், குறிப்பிட்ட நிகழ்வு நாளையும் தெளிவாகத் தருகிறது.
- source_word: וַיִּתְּנֵם ... אֵלָי
  choice: யாவே அவற்றை என்னிடம் கொடுத்தார்
  rationale: נתן வினையின் நேரடியான பொருளையும், பன்மைச் சுட்டுப்பெயரையும், முதல் நபர் பெறுபவரையும் காக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற உடன்படிக்கைப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலத்தில் தனிப்பெயர் நேரடியாக இருப்பதால், அதை பொதுப் பட்டமாக மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
- issue: עֲשֶׂרֶת הַדְּבָרִים என்ற உடன்படிக்கைச் சொல்லாட்சி
  choice: பத்துச் சொற்கள்
  alternative: பத்துக் கட்டளைகள்
  rationale: ‘பத்துச் சொற்கள்’ என்பது எபிரெயச் சொல்லாட்சியை நேரடியாகக் காக்கிறது; பரவலாக அறியப்பட்ட மரபு மொழிபெயர்ப்பு அடிக்குறிப்பில் விடப்படுகிறது.
- issue: וַיִּכְתֹּב என்பதிலுள்ள மறைமுக எழுவாய்
  choice: அவர்
  alternative: யாவே
  rationale: மூல எபிரெயில் எழுவாய் பெயரால் மீண்டும் குறிப்பிடப்படாமல் மூன்றாம் நபர் ஒருமையில் உள்ளது; ஆகவே சூழல் காட்டும் எழுவாயை வெளிப்படையாகச் சேர்த்து ambiguity-ஐ நீக்கவில்லை.
