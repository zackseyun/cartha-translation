  register: நவீனத் தரத் தமிழில் இயல்பாகவும் மரியாதைமிக்க நடையிலும் வடிவமைக்கப்பட்டது. ‘பத்துச் சொற்கள்’ மற்றும் ‘நெருப்பின் நடுவிலிருந்து’ போன்ற மூலத்தின் முக்கிய சொல்லாட்சிகள் பாதுகாக்கப்பட்டுள்ளன; தேவையற்ற விளக்கச் சேர்க்கைகள் தவிர்க்கப்பட்டுள்ளன.
