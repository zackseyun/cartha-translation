source:
  edition: WLC
  text: עַל כֵּ֞ן לֹֽא הָיָ֧ה לְ/לֵוִ֛י חֵ֥לֶק וְ/נַחֲלָ֖ה עִם אֶחָ֑י/ו יְהוָה֙ ה֣וּא נַחֲלָת֔/וֹ כַּ/אֲשֶׁ֥ר דִּבֶּ֛ר יְהוָ֥ה אֱלֹהֶ֖י/ךָ לֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/009.yaml
  text: Therefore Levi has no portion or inheritance with his brothers[a]; Yahweh is his inheritance[b], just as Yahweh your God spoke to him.
translation:
  language: ta
  text: ஆகையால், லேவிக்குத் தன் சகோதரர்களோடு பங்கும் சுதந்தரமும் இல்லை[a]; உன் கடவுளாகிய யாவே அவனிடம் கூறியபடியே, யாவே அவனுடைய சுதந்தரம்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “தன் சகோதரர்களோடு.” ஒருமையில் வரும் “லேவி” என்பது மற்ற இஸ்ரவேல் கோத்திரங்களிலிருந்து வேறுபட்ட லேவி கோத்திரத்தைப் பிரதிநிதித்துவப்படுத்துகிறது.
    reason: cultural_note
  - marker: b
    text: அல்லது, “யாவே அவனுடைய பங்கு.” லேவியின் பங்கு நிலம் அல்ல, யாவே என்பதைக் வலியுறுத்த எபிரெயம் “சுதந்தரம்” என்ற சொல்லை மீண்டும் பயன்படுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל כֵּן
  choice: ஆகையால்
  rationale: முந்தைய சூழலிலிருந்து வரும் முடிவை இயல்பான நவீன தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: לְלֵוִי
  choice: லேவிக்கு
  rationale: எபிரெய மூலத்திலுள்ள ஒருமைப் பெயரைத் தக்கவைக்கிறது; இங்கு லேவி தன் கோத்திரத்தைப் பிரதிநிதித்துவப்படுத்துகிறான்.
- source_word: חֵלֶק וְנַחֲלָה
  choice: பங்கும் சுதந்தரமும்
  rationale: இரு தனித்த எபிரெயப் பெயர்ச்சொற்களையும் காத்து, நிலப் பங்கீடும் பரம்பரை உரிமையும் சார்ந்த பொருளை வெளிப்படுத்துகிறது.
- source_word: עִם אֶחָיו
  choice: தன் சகோதரர்களோடு
  rationale: மூலத்தின் ஆண்பால் பன்மை உறவுச் சொல்லை நேரடியாகத் தக்கவைக்கிறது; இவர்கள் மற்ற இஸ்ரவேல் கோத்திரங்களைக் குறிக்கின்றனர்.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: தெய்வீகப் பெயரை ஒரு பட்டமாக மாற்றாமல், தமிழில் நிலைபெற்ற ஒலிபெயர்ப்பு வடிவில் வழங்குகிறது.
- source_word: הוּא נַחֲלָתוֹ
  choice: அவனுடைய சுதந்தரம்
  rationale: முன்னர் வந்த נַחֲלָה என்ற சொல்லையே மீண்டும் பயன்படுத்தி, லேவிக்கு நிலச் சுதந்தரம் இல்லை என்றாலும் யெகோவாவே அவன் சுதந்தரம் என்ற அழுத்தத்தைப் பாதுகாக்கிறது.
- source_word: כַּאֲשֶׁר דִּבֶּר
  choice: கூறியபடியே
  rationale: வினைச்சொல்லை ‘வாக்குறுதி அளித்தார்’ என விளக்கமாக்காமல், ‘பேசினார்/கூறினார்’ என்ற மூலப் பொருளில் வைத்திருக்கிறது.
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: உன் கடவுளாகிய யெகோவா
  rationale: இரண்டாம் நபர் ஒருமை உரையைப் பாதுகாத்து, தமிழில் இயல்பான உடன்படிக்கைச் சொற்றொடராக அமைகிறது.
- source_word: לוֹ
  choice: அவனிடம்
  rationale: ஒருமைப் பிரதிப்பெயரை நேரடியாக வழங்கி, அது லேவியைக் குறிப்பதைத் தக்கவைக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரின் மொழிபெயர்ப்பு
  choice: யெகோவா
  alternative: கர்த்தர் / யாவே
  rationale: மூலத்தில் தனிப்பெயர் இருப்பதால் அதை பட்டப்பெயராக மாற்றாமல் ஒலிபெயர்க்கப்படுகிறது; ‘யெகோவா’ என்பது தமிழில் பரவலாக அறியப்படும் வடிவம்.
- issue: אֶחָיו என்ற ஆண்பால் உறவுச் சொல்
  choice: தன் சகோதரர்களோடு
  alternative: தன் உறவினரோடு / மற்ற இஸ்ரவேலரோடு
  rationale: மூலத்தின் ஆண்பால் பன்மையைத் தக்கவைக்கிறது; கோத்திரப் பொருள் அடிக்குறிப்பில் விளக்கப்படுகிறது.
- issue: லேவி கோத்திரத்தைப் பிரதிநிதித்துவப்படுத்தும் ஒருமைப் பெயர்
  choice: லேவிக்கு
  alternative: லேவி கோத்திரத்துக்கு
  rationale: மூலத்தின் ஒருமை வடிவத்தைப் பாதுகாத்து, அதன் பிரதிநிதித்துவப் பொருளை அடிக்குறிப்பில் தெளிவுபடுத்துகிறது.
- issue: யெகோவா லேவியின் சுதந்தரம் என்பதன் பொருள்
  choice: யெகோவாவே அவனுடைய சுதந்தரம்
  alternative: யெகோவாவே அவனுடைய பங்கு
  rationale: נַחֲלָה என்ற சொல்லின் மறுபயன்பாட்டைத் தக்கவைத்து, நிலத்துக்குப் பதிலாக யெகோவாவே லேவியின் சுதந்தரம் என்ற மூலத்தின் இறையியல் அழுத்தத்தைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘பங்கு—சுதந்தரம்’ என்ற மூலச் சொல் வேறுபாடும், ‘சுதந்தரம்’ என்ற மறுபயன்பாடும் பாதுகாக்கப்பட்டுள்ளன; வாக்கியத்தின் உடன்படிக்கைச் செறிவு எளிமைப்படுத்தப்படவில்லை.
