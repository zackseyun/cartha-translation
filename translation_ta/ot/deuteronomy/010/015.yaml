revisions:
- from: ஆயினும், உங்கள் மூதாதையர்மேல் அன்புகூர யாவே அவர்களிடம் பற்றுக்கொண்டார்; அவர்களுக்குப் பின் வந்த அவர்களுடைய சந்ததியினராகிய உங்களை, எல்லா மக்களினங்களிலிருந்தும் அவர் தேர்ந்தெடுத்தார்—இன்றுவரை அப்படியே உள்ளது.[a]
  to: யாவே உங்கள் மூதாதையர்மேல் அன்புகூர்வதற்காக மட்டுமே அவர்களிடம் பற்று கொண்டார்[a]; அவர்களுக்குப் பின் வந்த அவர்களுடைய சந்ததியினராகிய உங்களை எல்லா மக்களினங்களிலிருந்தும் அவர் தேர்ந்தெடுத்தார்—இன்று இருப்பதுபோலவே.
  rationale: The revision places ‘மட்டுமே’ in the main text to preserve רַק’s restrictive emphasis, retains the purposeful ‘அன்புகூர்வதற்காக’ and the relational force of חָשַׁק, and replaces the durative-sounding ‘இன்றுவரை’ with a present demonstrative expression for כַּיּוֹם הַזֶּה. The footnote anchor is moved to the restrictive/attachment clause it explicates.
  reviewer_model: gpt-5.6-terra
