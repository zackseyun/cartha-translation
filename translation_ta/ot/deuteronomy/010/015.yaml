source:
  edition: WLC
  text: רַ֧ק בַּ/אֲבֹתֶ֛י/ךָ חָשַׁ֥ק יְהוָ֖ה לְ/אַהֲבָ֣ה אוֹתָ֑/ם וַ/יִּבְחַ֞ר בְּ/זַרְעָ֣/ם אַחֲרֵי/הֶ֗ם בָּ/כֶ֛ם מִ/כָּל הָ/עַמִּ֖ים כַּ/יּ֥וֹם הַ/זֶּה־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/015.yaml
  text: Yet Yahweh set his affection on your fathers[a], to love them, and he chose their offspring after them—you—from all the peoples, as it is this day.
translation:
  language: ta
  text: யாவே உங்கள் மூதாதையர்மேல் அன்புகூர்வதற்காக மட்டுமே அவர்களிடம் பற்று கொண்டார்[a]; அவர்களுக்குப் பின் வந்த அவர்களுடைய சந்ததியினராகிய உங்களை எல்லா மக்களினங்களிலிருந்தும் அவர் தேர்ந்தெடுத்தார்—இன்று இருப்பதுபோலவே.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது: “யாவே உங்கள் மூதாதையர்மேல் அன்புகூர அவர்களிடத்தில் விருப்பம் கொண்டார்.”'
    reason: רַק என்பதன் வலியுறுத்தும்/கட்டுப்படுத்தும் நுணுக்கத்தையும் חָשַׁק என்பதற்கான ‘விருப்பம் கொள்’ என்ற சொற்பொருள் மாற்றையும் காட்டுகிறது.
lexical_decisions:
- source_word: רַק
  choice: ஆயினும்
  rationale: முந்தைய வசனத்தில் வானமும் பூமியும் யாவேக்குரியவை என்ற கூற்றுக்கும், இங்கு கூறப்படும் அவருடைய குறிப்பிட்ட தேர்வுக்கும் இடையிலான வலியுறுத்தப்பட்ட முரண்பாட்டை இயல்பான தமிழில் காட்டுகிறது. ‘மட்டுமே’ என்பதும் சாத்தியம்; அது அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: בַּאֲבֹתֶיךָ חָשַׁק יְהוָה
  choice: உங்கள் மூதாதையரிடம் பற்றுக்கொண்டார்
  rationale: חָשַׁק என்பது வலுவான பற்று அல்லது விருப்பமுள்ள இணைப்பைக் குறிக்கிறது; ב அந்தப் பற்றின் இலக்கைக் குறிக்கிறது. ‘பற்றுக்கொண்டார்’ என்பது இதை இயல்பாகவும் கண்ணியமாகவும் எடுத்துரைக்கிறது.
- source_word: לְאַהֲבָה אֹתָם
  choice: அவர்கள்மேல் அன்புகூர
  rationale: இந்த நோக்கவினையெச்சம் חָשַׁק உடன் நெருக்கமாக இணைந்து நோக்கம் அல்லது விளைவைத் தெரிவிக்கிறது; எபிரெயச் சொல்லின் ‘அன்பு’ பொருள் நேரடியாகப் பாதுகாக்கப்படுகிறது.
- source_word: וַיִּבְחַר
  choice: அவர் தேர்ந்தெடுத்தார்
  rationale: בחר என்பதன் தெளிவான தெய்வீகத் தேர்வு மொழியை மென்மைப்படுத்தாமல் தருகிறது.
- source_word: בְּזַרְעָם אַחֲרֵיהֶם בָּכֶם
  choice: அவர்களுக்குப் பின் வந்த அவர்களுடைய சந்ததியினராகிய உங்களை
  rationale: זֶרַע இங்கு கூட்டுப் பொருளில் சந்ததியைக் குறிக்கிறது; בָּכֶם அந்தச் சந்ததி தற்போதைய கேட்போராகிய ‘உங்கள்’ என்பதை விளக்கமாக அடையாளப்படுத்துகிறது.
- source_word: מִכָּל הָעַמִּים
  choice: எல்லா மக்களினங்களிலிருந்தும்
  rationale: עַמִּים என்பது அரசியல் நாடுகளை மட்டும் அல்லாமல் பல மக்களினங்களைக் குறிக்கிறது; מן என்பதன் பிரித்துத் தேர்வு செய்யும் பொருளும் பாதுகாக்கப்படுகிறது.
- source_word: כַּיּוֹם הַזֶּה
  choice: இன்றுவரை அப்படியே உள்ளது
  rationale: தற்போது காணப்படும் நிலை முந்தைய கூற்றை உறுதிப்படுத்துகிறது என்ற எபிரெய மரபுத்தொடரின் செயல்பாட்டை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: திருநாமத்தை ஒரு பட்டத்தால் மாற்றாமல், எபிரெய தனிப்பெயரின் தமிழாக்கமாக வழங்குகிறது.
theological_decisions:
- issue: தெய்வீகத் தேர்வின் மொழி
  choice: யாவேயின் பற்று, அன்பு, தேர்வு ஆகிய மூன்றையும் வெளிப்படையாகத் தக்கவைத்தல்
  alternative: இதை வெறும் வரலாற்று முன்னுரிமையாக மென்மைப்படுத்துதல் அல்லது பிற்காலத் தேர்தல் கோட்பாட்டை வசனத்தில் விரிவாகச் சேர்த்தல்
  rationale: எபிரெய உரை மூதாதையர்மீதான யாவேயின் பற்று மற்றும் அன்பையும், அவர்களுடைய சந்ததியின் தேர்வையும் நேரடியாகக் கூறுகிறது. எந்தக் குறிப்பிட்ட பிற்காலக் கோட்பாட்டு அமைப்பையும் புகுத்தாமல் அந்த இறையியல் அழுத்தம் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. ‘மூதாதையர்’, ‘சந்ததி’, ‘மக்களினங்கள்’ ஆகியவை வேதாகமச் சூழலின் துல்லியத்தைத் தக்கவைத்தாலும் பழமையான நடையைத் தவிர்க்கின்றன. அடிக்குறிப்பு குறியீடு தொடர்புடைய இறுதி கூற்றின் பின்னர் இடப்பட்டுள்ளது.
