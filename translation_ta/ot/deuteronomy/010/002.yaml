  text: וְ/אֶכְתֹּב֙ עַל הַ/לֻּחֹ֔ת אֶת הַ/דְּבָרִ֔ים אֲשֶׁ֥ר הָי֛וּ עַל הַ/לֻּחֹ֥ת הָ/רִאשֹׁנִ֖ים אֲשֶׁ֣ר שִׁבַּ֑רְתָּ וְ/שַׂמְתָּ֖/ם בָּ/אָרֽוֹן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/002.yaml
  text: And I will write on the tablets the words that were on the first tablets[a], which you broke, and you shall put them in the ark.
translation:
  language: ta
  text: நீ உடைத்த முதல் பலகைகளில் இருந்த வார்த்தைகளை[a] நான் இந்தப் பலகைகளில் எழுதுவேன். நீ அவற்றைப் பெட்டகத்தில் வைப்பாய்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘கட்டளைகளை’; எபிரெயத்தில், ‘வார்த்தைகளை.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶכְתֹּב
  choice: நான் எழுதுவேன்
  rationale: כתב என்பதன் Qal முற்றுப்பெறாத முதலாம் நபர் ஒருமை வடிவம்; இங்கு இறைவன் செய்யவிருப்பதைக் குறிக்கும் இயல்பான எதிர்கால வினையாக மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: הַלֻּחֹת
  choice: பலகைகள்
  rationale: לוח என்பது எழுதுவதற்குரிய பலகையைக் குறிக்கிறது. இவ்வசனத்தில் ‘கல்’ மீண்டும் நேரடியாகக் கூறப்படாததால் அதைச் சேர்க்கவில்லை.
- source_word: הַדְּבָרִים
  choice: வார்த்தைகள்
  rationale: דבר இங்கு உடன்படிக்கையின் பொறிக்கப்பட்ட சொற்களைக் குறிக்கிறது; ‘கட்டளைகள்’ என்பது பொருத்தமான விளக்க மாற்றாக இருந்தாலும், மூலச்சொல்லின் அகலத்தன்மையைப் பாதுகாக்க ‘வார்த்தைகள்’ முதன்மை உரையில் வைக்கப்பட்டுள்ளது.
- source_word: אֲשֶׁר הָיוּ
  choice: இருந்த
  rationale: היה உடன் வரும் தொடர்புச் சொற்றொடரை நவீன தமிழில் இயல்பாகத் தெரிவிக்கிறது.
- source_word: הָרִאשֹׁנִים
  choice: முந்தைய
  rationale: மாற்றாக வழங்கப்படும் பலகைகளிலிருந்து முன்பிருந்த தொகுப்பை வேறுபடுத்துகிறது; தமிழில் ‘முதல் பலகைகள்’ என்பதைக் காட்டிலும் இச்சூழலில் ‘முந்தைய பலகைகள்’ இயல்பாக உள்ளது.
- source_word: שִׁבַּרְתָּ
  choice: நீ உடைத்துப்போட்ட
  rationale: שבר என்பதன் Piel நிறைவுவடிவம்; பலகைகள் உடைக்கப்பட்ட செயலைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: וְשַׂמְתָּם
  choice: நீ அவற்றை வைக்க வேண்டும்
  rationale: שים என்பது வைப்பதைக் குறிக்கும் பொதுவான வினை; இணைப்புப் பின்னொட்டு ஆண்பால் பன்மை. சூழலின்படி ‘அவற்றை’ என்பது பலகைகளைக் குறிக்கிறது.
- source_word: בָּאָרוֹן
  choice: பெட்டிக்குள்
  rationale: ארון இங்கு மோசே செய்ய வேண்டிய புனிதப் பெட்டியைக் குறிக்கிறது. ‘பெட்டி’ நவீன வாசகருக்கு நேரடியான பொருளைத் தருகிறது; בְ இயக்கத்தின் இலக்கை இச்சூழலில் ‘-க்குள்’ என இயல்பாகக் காட்டுகிறது.
theological_decisions:
- issue: וְשַׂמְתָּם என்பதிலுள்ள பன்மைப் பின்னொட்டின் குறிப்பு
  choice: ‘அவற்றை’ என்பது பலகைகளைக் குறிக்கிறது.
  alternative: அது பலகைகளில் எழுதப்பட்ட வார்த்தைகள் அல்லது கட்டளைகளைக் குறிக்கலாம்.
  rationale: இலக்கணப்படி அருகிலுள்ள இரு ஆண்பால் பன்மைப் பெயர்களுக்கும் பின்னொட்டு பொருந்தக்கூடும். ஆனால் பெட்டிக்குள் பொருள்களை வைக்கும் செயலும் உபாகமம் 10:1–5 சூழலும் பலகைகளே நோக்கப்பட்டவை என்பதை வலுவாகக் காட்டுகின்றன.
translation_notes:
  register: நவீன பொதுத் தமிழில், மரியாதையும் நேர்த்தியும் கொண்ட நடை பயன்படுத்தப்பட்டுள்ளது. எபிரெயச் சொல்வரிசையை அப்படியே பின்பற்றாமல், தொடர்புடைய ‘நீ உடைத்துப்போட்ட’ என்ற பகுதி ‘முந்தைய பலகைகள்’ என்பதோடு தெளிவாக இணையுமாறு அமைக்கப்பட்டுள்ளது. ‘அவற்றை’ என்ற வடிவம் மூலத்தின் இலக்கணச் சாத்தியத்தை வைத்திருந்தாலும், சூழலில் பலகைகளைச் சுட்டுகிறது.
