source:
  edition: WLC
  text: אָר֣וּר הָ/אִ֡ישׁ אֲשֶׁ֣ר יַעֲשֶׂה֩ פֶ֨סֶל וּ/מַסֵּכָ֜ה תּוֹעֲבַ֣ת יְהוָ֗ה מַעֲשֵׂ֛ה יְדֵ֥י חָרָ֖שׁ וְ/שָׂ֣ם בַּ/סָּ֑תֶר וְ/עָנ֧וּ כָל הָ/עָ֛ם וְ/אָמְר֖וּ אָמֵֽן־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/015.yaml
  text: Cursed is the man who makes a carved image or a cast image—an abomination to Yahweh[a], the work of the hands of a craftsman—and sets it up in secret. And all the people shall answer and say[b], “Amen.”
translation:
  language: ta
  text: “செதுக்கிய உருவத்தையோ வார்த்த உருவத்தையோ—யாவேக்கு அருவருப்பானதும் கைவினைஞனின் கைகளின் வேலைப்பாடுமான ஒன்றை—செய்து, அதை மறைவான இடத்தில் வைக்கும் மனிதன்[a] சபிக்கப்பட்டவன்.” மக்கள் அனைவரும் மறுமொழியாக, “ஆமென்” என்று சொல்ல வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மொழியில் ‘மனிதன்’ என்பது ஆண்பால் ஒருமையில் உள்ளது; இங்கு அது சட்டச் சூத்திரத்தில் பொதுவாக ஒருவரைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָרוּר
  choice: சபிக்கப்பட்டவன்
  rationale: உடன்படிக்கைச் சாபத்தை அறிவிக்கும் எபிரெய முன்னிலைப் பயனிலையின் வலிமையைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: הָאִישׁ
  choice: மனிதன்
  rationale: எபிரெய மொழியில் உள்ள ஆண்பால் ஒருமை சட்டச் சூத்திரத்தைப் பாதுகாக்கிறது; இங்கு அது பிரதிநிதித்துவப் பொதுப்பொருளில் வருகிறது.
- source_word: פֶסֶל
  choice: செதுக்கிய உருவம்
  rationale: செதுக்கி வடிவமைக்கப்பட்ட உருவம் என்ற குறிப்பான பொருளைத் தருகிறது; பொதுவான ‘சிலை’ அல்லது ‘விக்கிரகம்’ என்பதைக் காட்டிலும் மூலச்சொல்லுக்கு நெருக்கமானது.
- source_word: מַסֵּכָה
  choice: வார்த்த உருவம்
  rationale: உருக்கி வார்க்கும் முறையில் செய்யப்பட்ட உருவத்தைக் குறிக்கிறது; மூலத்தில் வெளிப்படையாக இல்லாத ‘உலோகம்’ என்பதை முதன்மை உரையில் சேர்க்கவில்லை.
- source_word: תּוֹעֲבַת יְהוָה
  choice: யாவே அருவருக்கும்
  rationale: யாவேக்கு அருவருப்பானது என்ற வலிமையான உடன்படிக்கை மற்றும் ஒழுக்க மதிப்பீட்டை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைப்பட்டத்தை மாற்றாக இடாமல், எபிரெய வேதாகமத்தின் தனிப்பட்ட இறைப்பெயரை ஒலிபெயர்க்கிறது.
- source_word: מַעֲשֵׂה יְדֵי חָרָשׁ
  choice: கைவினைஞனின் கைகளால் செய்யப்பட்ட ஒன்று
  rationale: அந்த உருவம் மனிதக் கைவினையின் விளைவு என்பதைக் காட்டும் மூலத்தின் வலியுறுத்தலைப் பாதுகாக்கிறது.
- source_word: וְשָׂם בַּסָּתֶר
  choice: அதை மறைவில் வைக்கும்
  rationale: உருவத்தை இரகசியமாக அல்லது பிறர் பார்வையிலிருந்து மறைத்து வைப்பதைக் குறிக்கும் மூலத்தின் பொதுவான பொருளைத் தக்கவைக்கிறது; ‘நிறுவும்’ என்று தேவையின்றிக் குறிப்பாக்கவில்லை.
- source_word: וְעָנוּ כָל הָעָם וְאָמְרוּ
  choice: மக்கள் அனைவரும் மறுமொழியாக ... என்று சொல்ல வேண்டும்
  rationale: வழிபாட்டு மற்றும் சட்டச் சூழலிலுள்ள கூட்டுப் பதிலுரையையும் கட்டளையுரிய எதிர்கால வலிமையையும் இயல்பான தமிழில் தருகிறது.
- source_word: אָמֵן
  choice: ஆமென்
  rationale: அங்கீகாரத்தையும் உறுதிப்படுத்தலையும் குறிக்கும் பரிச்சயமான உடன்படிக்கை வழிபாட்டு மறுமொழியை ஒலிபெயர்த்தே வைத்திருக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் இறைவனின் தனிப்பட்ட உடன்படிக்கைப் பெயர் நேரடியாக உள்ளது; ஆகவே அதை ஒரு பட்டத்தால் மாற்றாமல் ஒலிபெயர்த்துள்ளது.
- issue: உடன்படிக்கைச் சாபச் சூத்திரத்திலுள்ள பொதுப்பொருள் ஆண்பால் ஒருமை
  choice: மனிதன்
  alternative: ஒருவர் / எவரும்
  rationale: மூலத்தின் இலக்கண ஆண்பால் ஒருமையை மறைக்காமல் வைத்திருக்கிறது; அதேவேளை இது சட்டச் சூத்திரத்தில் பிரதிநிதித்துவப் பொதுப்பொருளைக் கொண்டது என்பதை அடிக்குறிப்பு தெளிவுபடுத்துகிறது.
- issue: תּוֹעֵבָה என்பதன் வலிமை
  choice: அருவருக்கும்
  alternative: விரும்பாத / வெறுக்கும்
  rationale: விக்கிரக உருவம் யாவேக்கு உடன்படிக்கை ரீதியாக அருவருப்பானது என்ற மூலத்தின் தீவிர மதிப்பீட்டை மங்கச் செய்யாமல் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், உடன்படிக்கைச் சாப அறிவிப்புக்கேற்ற கண்ணியமான சட்ட-வழிபாட்டு நடையைப் பயன்படுத்துகிறது. நீண்ட எபிரெய தொடரின் அடுக்கை கோடுகளால் தெளிவுபடுத்தி, உருவம் மனிதக் கைவினை என்பதையும் யாவே அதனை அருவருப்பதையும் ஒரே தொடர்பில் வைத்துள்ளது.
