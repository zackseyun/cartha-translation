  text: אֲבָנִ֤ים שְׁלֵמוֹת֙ תִּבְנֶ֔ה אֶת מִזְבַּ֖ח יְהוָ֣ה אֱלֹהֶ֑י/ךָ וְ/הַעֲלִ֤יתָ עָלָי/ו֙ עוֹלֹ֔ת לַ/יהוָ֖ה אֱלֹהֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/006.yaml
  text: You shall build the altar of Yahweh your God with whole stones[a], and you shall offer burnt offerings on it to Yahweh your God.
translation:
  language: ta
  text: முழுமையான கற்களால்[a] உன் கடவுளாகிய யாவேக்கு பலிபீடத்தைக் கட்ட வேண்டும். அதன்மேல் உன் கடவுளாகிய யாவேக்கு தகனபலிகளைச் செலுத்த வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘செதுக்கப்படாத கற்களால்.’ எபிரெய உரை நேரடியாக ‘முழுமையான கற்கள்’ என்கிறது; அவற்றின்மேல் இரும்புக் கருவியைப் பயன்படுத்தக் கூடாது என்ற முந்தைய வசனத்தின் அறிவுறுத்தலை (வச. 5) ‘செதுக்கப்படாத’ என்பது பிரதிபலிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲבָנִים שְׁלֵמוֹת
  choice: முழுமையான கற்கள்
  rationale: שְׁלֵמוֹת என்பதன் நேரடிப் பொருள் ‘முழுமையான/குறைவில்லாத’ என்பதாகும். முந்தைய வசனத்தில் இரும்புக் கருவி பயன்படுத்தக் கூடாது எனக் கூறப்படுவதால் ‘செதுக்கப்படாத கற்கள்’ என்பது சூழலுக்கேற்ற விளக்கம்; எனினும் அது அடைமொழியின் நேரடிப் பொருள் அல்ல என்பதால் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: תִּבְנֶה
  choice: கட்ட வேண்டும்
  rationale: சட்டவழி அறிவுறுத்தல் சூழலில் இச்செயற்பாட்டு வடிவம் கட்டளைப் பொருள் தருகிறது; நவீனத் தமிழில் ‘கட்ட வேண்டும்’ இயல்பாகவும் கண்ணியமாகவும் உள்ளது.
- source_word: מִזְבַּח
  choice: பலிபீடம்
  rationale: பலிகள் செலுத்தப்படும் அமைப்பைக் குறிக்கும் வழக்கமான, துல்லியமான தமிழ்ச் சொல்.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய மூலத்தில் வரும் இறைத் திருப்பெயரை ஒரு பட்டத்தால் மாற்றாமல் பெயராகவே ஒலிபெயர்க்கிறது.
- source_word: אֱלֹהֶיךָ
  choice: உன் கடவுள்
  rationale: இரண்டாம் நபர் ஆண்பால் ஒருமை உடைமை விகுதியின் நேரடியான உடன்படிக்கைச் சார்ந்த பொருளைப் பாதுகாக்கிறது.
- source_word: וְהַעֲלִיתָ עָלָיו
  choice: அதன்மேல் ... செலுத்த வேண்டும்
  rationale: עלה என்பதன் ஹிபில் வடிவம் பலிச் சூழலில் பலியை ஏறச்செய்தல், அதாவது செலுத்துதல் எனப் பொருள்படும்; தமிழ் வழக்கில் ‘பலிகளைச் செலுத்துதல்’ இயல்பானது.
- source_word: עוֹלֹת
  choice: தகனபலிகள்
  rationale: முழுவதும் எரிக்கப்படும் பலிவகையைக் குறிக்கும் நிலையான தமிழ்ச் சமயச் சொல்; வெறும் சொற்பிறப்பியல் சார்ந்த ‘ஏறும் பலிகள்’ என்ற மொழிபெயர்ப்பைத் தவிர்க்கிறது.
- source_word: לַיהוָה
  choice: யாவேக்கு
  rationale: ל முன்னொட்டு இங்கு பலியின் நோக்குநர் அல்லது அர்ப்பணிக்கப்படுபவரைக் குறிக்கிறது; தமிழில் நான்காம் வேற்றுமை இதை இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைத் திருப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலத்தில் தனிப்பட்ட உடன்படிக்கைப் பெயர் நேரடியாக உள்ளது. அதை பொதுப் பட்டமாக மாற்றாமல் ‘யாவே’ என ஒலிபெயர்ப்பது மூலமொழிச் சான்றைப் பாதுகாக்கிறது.
- issue: שְׁלֵמוֹת என்பதை விளக்கமாக ‘செதுக்கப்படாத’ என்று மொழிபெயர்ப்பதா
  choice: முழுமையான கற்கள்
  alternative: செதுக்கப்படாத கற்கள்
  rationale: அடைமொழியின் நேரடிப் பொருள் ‘முழுமையானவை’ என்பதாகும். இரும்புக் கருவி பயன்படுத்தக் கூடாது என்ற 5ஆம் வசனத்தின் சூழல் ‘செதுக்கப்படாதவை’ என்ற புரிதலை ஆதரித்தாலும், அந்த விளக்கத்தை முதன்மை உரைக்குள் திணிக்காமல் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், ஒருமை இரண்டாம் நபருக்கான ‘உன்’ வடிவத்தையும் சட்டவழி கட்டளைக்கான ‘வேண்டும்’ அமைப்பையும் பயன்படுத்துகிறது. பலிச் சொற்களில் கண்ணியமும் பொதுப் புரிதலும் காக்கப்பட்டுள்ளன; இறைத் திருப்பெயர் ‘யாவே’ என நேரடியாக ஒலிபெயர்க்கப்பட்டுள்ளது.
