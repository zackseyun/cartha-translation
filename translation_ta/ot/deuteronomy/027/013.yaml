base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/013.yaml
  text: 'And these shall stand for the curse on Mount Ebal: Reuben[a], Gad, Asher, Zebulun, Dan, and Naphtali.'
translation:
  language: ta
  text: 'சாபத்திற்காக[a] ஏபால் மலையில் நிற்க வேண்டியவர்கள் இவர்கள்: ரூபன், காத், ஆசேர், செபுலோன், தாண், நப்தலி.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சாபத்தை அறிவிப்பதற்காக” அல்லது “சபிப்பதற்காக.”
    reason: עַל הַקְּלָלָה என்ற சொற்றொடர் சாபத்துடன் தொடர்புடைய நியமிப்பையோ, சாபத்தை அறிவிக்கும் செயலையோ, சபிக்கும் செயலையோ குறிக்கலாம்.
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: இவர்களே
  rationale: முந்தைய வசனத்தில் கூறப்பட்ட குழுவுக்கு இணையாகவும் மாறுபட்டதாகவும் இக்குழுவை அறிமுகப்படுத்துகிறது. தமிழ் வாக்கிய இணைப்பில் தனி ‘மற்றும்’ அவசியமில்லை; ‘இவர்களே’ எதிரிணையைக் தெளிவுபடுத்துகிறது.
- source_word: יַעַמְדוּ
  choice: நிற்கவேண்டியவர்கள்
  rationale: இங்கு imperfect வடிவம் மோசேயின் வருங்காலச் சடங்கு அறிவுறுத்தலைக் குறிக்கிறது; ‘நிற்கவேண்டியவர்கள்’ கட்டளையின் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: עַל הַקְּלָלָה
  choice: சாபத்திற்காக
  rationale: சாபத்தோடு தொடர்புடைய சடங்குப் பொறுப்பு அல்லது நியமிப்பைச் சுருக்கமாகக் காட்டுகிறது; எபிரெயத்தில் வெளிப்படையாக இல்லாத ‘அறிவிக்க’ என்ற வினையை முதன்மை உரையில் சேர்க்கவில்லை.
- source_word: בְּהַר עֵיבָל
  choice: ஏபால் மலையில்
  rationale: மலையின் மேல் அல்லது மலைப்பகுதியில் நிற்கும் இடத்தைக் குறிக்கும் இயல்பான நவீனத் தமிழ் வடிவம்.
- source_word: רְאוּבֵן
  choice: ரூபன்
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் பரவலாக அறியப்படும் கோத்திரப் பெயர் வடிவம்.
- source_word: גָּד
  choice: காத்
  rationale: எபிரெயப் பெயரின் இறுதி மெய்யைத் தெளிவாகக் காட்டும் வழக்கமான தமிழ் வேதாகம வடிவம்.
- source_word: אָשֵׁר
  choice: ஆசேர்
  rationale: எபிரெயப் பெயருக்குச் சமீபமான, தமிழில் அறியப்பட்ட ஒலிபெயர்ப்பு.
- source_word: זְבוּלֻן
  choice: செபுலோன்
  rationale: தமிழ் வாசகர்களுக்கு அறிமுகமான வேதாகமப் பெயர் வடிவத்தைப் பயன்படுத்துகிறது.
- source_word: דָּן
  choice: தாண்
  rationale: தமிழ் வேதாகம மரபில் அறியப்பட்ட கோத்திரப் பெயர் வடிவம்.
- source_word: נַפְתָּלִי
  choice: நப்தலி
  rationale: எபிரெயப் பெயருக்கு நெருக்கமானதும் தமிழில் எளிதாக வாசிக்கக்கூடியதுமான வடிவம்.
theological_decisions:
- issue: சாபத்துடன் தொடர்புடைய கோத்திரங்களின் சடங்குப் பங்கு
  choice: சாபத்திற்காக
  alternative: சாபத்தை அறிவிப்பதற்காக; சபிப்பதற்காக
  rationale: எபிரெய உரை ‘அறிவிப்பார்கள்’ போன்ற வினையை வெளிப்படையாகக் கூறவில்லை. முந்தைய வசனத்தின் ஆசீர்வாதம்–சாபம் இணை அமைப்பு சடங்குப் பங்கைக் காட்டினாலும், அந்தச் செயலை முதன்மை உரையில் மிகத் துல்லியமாக நிர்ணயிக்காமல் மூலத்தின் சுருக்கத்தையும் பொருள் அகலத்தையும் காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. சடங்கு மொழியின் சுருக்கம் காக்கப்பட்டுள்ளது; பெயர்களுக்கு பரவலாக அறியப்பட்ட தமிழ் வேதாகம வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன.
