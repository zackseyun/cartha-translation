source:
  edition: WLC
  text: אָר֗וּר אֲשֶׁ֧ר לֹא יָקִ֛ים אֶת דִּבְרֵ֥י הַ/תּוֹרָֽה הַ/זֹּ֖את לַ/עֲשׂ֣וֹת אוֹתָ֑/ם וְ/אָמַ֥ר כָּל הָ/עָ֖ם אָמֵֽן־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/026.yaml
  text: Cursed is the one who does not uphold the words of this law by doing them. And all the people shall say[a], “Amen.”
translation:
  language: ta
  text: “இந்தத் திருச்சட்டத்தின் வார்த்தைகளை அவற்றின்படி நடப்பதன் மூலம் நிலைநிறுத்தாதவன்[a] சபிக்கப்பட்டவன்.” அப்போது மக்கள் அனைவரும், “ஆமென்” என்று சொல்ல வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “நிலைநிறுத்தாதவன்” என்பதற்கு “உறுதிப்படுத்தாதவன்” அல்லது “நிலைப்படுத்தாதவன்” என்றும் மொழிபெயர்க்கலாம். இங்குள்ள எபிரெய வினைச்சொல், திருச்சட்டத்தின் அதிகாரத்தைப் பேணுதல் அல்லது உறுதிப்படுத்துதல் என்ற பொருளைக் கொண்டிருக்கலாம்; இங்கு அது அவற்றின்படி நடப்பதான கீழ்ப்படிதலுடன் இணைக்கப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָרוּר
  choice: சபிக்கப்பட்டவன்
  rationale: உடன்படிக்கைச் சாப அறிவிப்பைத் தெளிவாகவும் இயல்பான நவீனத் தமிழிலும் தெரிவிக்கிறது.
- source_word: אֲשֶׁר
  choice: …அவன்
  rationale: எபிரெய ஒருமை ஆண்பால் வடிவத்தின் பொதுப்பொருளைத் தமிழில் இயல்பாகக் குறிக்கிறது; இது ஆண்களை மட்டும் குறிப்பதாக அல்ல.
- source_word: לֹא יָקִים
  choice: நிலைநிறுத்தாதவன்
  rationale: קום என்பதன் ஹிஃபீல் வடிவம் இங்கு சட்டத்தை உறுதிப்படுத்துதல், அதன் அதிகாரத்தை நிலைநாட்டுதல் அல்லது நடைமுறையில் பேணுதல் என்ற பரப்பைக் கொண்டது. அடுத்து வரும் ‘செயல்படுத்துவதன் மூலம்’ என்பதுடன் வேறுபாட்டையும் தொடர்பையும் காக்கிறது.
- source_word: דִּבְרֵי הַתּוֹרָה הַזֹּאת
  choice: இந்தத் திருச்சட்டத்தின் வார்த்தைகளை
  rationale: דִּבְרֵי என்பதன் ‘வார்த்தைகள்’ என்ற வடிவத்தையும், உபாகமத்தின் உடன்படிக்கைச் சூழலில் תּוֹרָה என்பதன் சட்டப் பொருளையும் காக்கிறது. ‘திருச்சட்டம்’ என்பது தேவனால் அளிக்கப்பட்ட சட்டத்தை இயல்பாகக் குறிக்கிறது.
- source_word: לַעֲשׂוֹת אֹתָם
  choice: அவற்றைச் செயல்படுத்துவதன் மூலம்
  rationale: சட்டத்தை நிலைநிறுத்துவது நடைமுறை கீழ்ப்படிதலால் நிகழ வேண்டும் என்ற தொடர்பை வெளிப்படுத்துகிறது; ‘அவற்றை’ என்பது பன்மையான ‘வார்த்தைகளை’ச் சுட்டுகிறது.
- source_word: וְאָמַר כָּל הָעָם
  choice: அப்போது மக்கள் அனைவரும் … என்று சொல்ல வேண்டும்
  rationale: வழிபாட்டு/சட்ட ஏற்பாட்டிலுள்ள கட்டளையுரிய எதிர்காலப் பொருளைத் தமிழில் தெளிவாகத் தருகிறது.
- source_word: אָמֵן
  choice: ஆமென்
  rationale: கூட்டத்தாரின் முறைசார் உறுதிப்பாட்டைத் தொடர்ச்சியாகக் காக்கும் வழக்கமான தமிழ் வேதாகமச் சொல்.
theological_decisions:
- issue: יָקִים ... לַעֲשׂוֹת אֹתָם என்பதில் உடன்படிக்கைக் கடமையின் பொருள்
  choice: திருச்சட்டத்தை நடைமுறை கீழ்ப்படிதலால் நிலைநிறுத்தத் தவறுகிறவன் மீது சாபம் அறிவிக்கப்படுகிறது.
  alternative: திருச்சட்டத்தைப் பொதுவாக உறுதிசெய்ய அல்லது ஒப்புதல் அளிக்கத் தவறுகிறவன் மீது மட்டும் சாபம் அறிவிக்கப்படுகிறது.
  rationale: எபிரெய உரை ‘நிலைநிறுத்துதல்’ என்பதையும் ‘அவற்றைச் செய்தல்’ என்பதையும் இணைப்பதால், வெறும் வாய்மொழி ஒப்புதல் அல்ல, செயலில் கீழ்ப்படிதலும் கருத்தில் உள்ளது. இரு கூறுகளும் மொழிபெயர்ப்பில் தனித்தனியாகக் காக்கப்பட்டுள்ளன.
- issue: אֲשֶׁר என்பதன் பொதுவான குறிப்பு
  choice: …அவன்
  alternative: எவனோ அவன் / யார்
  rationale: எபிரெய ஒருமை வடிவத்தைச் சுருக்கமாகக் காக்கும் தமிழ் கட்டமைப்பு; சூழலில் இது மனிதர் எவருக்கும் பொதுவான பிரதிநிதித்துவ ஒருமை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுமக்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. ‘நிலைநிறுத்துதல்’ மற்றும் ‘செயல்படுத்துதல்’ ஆகிய இரு கூறுகளும் மூலத்தின் பொருள் வேறுபாட்டையும் தொடர்பையும் காக்கின்றன. அடிக்குறிப்பு குறியீடு தொடர்புடைய முழு வாக்கியத்திற்குப் பின் வைக்கப்பட்டுள்ளது.
