source:
  edition: WLC
  text: אָר֕וּר שֹׁכֵ֖ב עִם חֹֽתַנְתּ֑/וֹ וְ/אָמַ֥ר כָּל הָ/עָ֖ם אָמֵֽן־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/023.yaml
  text: Cursed is he who lies with his mother-in-law. And all the people shall say[a], “Amen.”
translation:
  language: ta
  text: “தன் மாமியாருடன் படுக்கிறவன்[a] சபிக்கப்பட்டவன்.” மக்கள் அனைவரும், “ஆமென்” என்று சொல்ல வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அதாவது, இன்னும் வெளிப்படையாக, “தன் மாமியாருடன் பாலுறவு கொள்கிறவன்.” எபிரெய மொழியில் “உடன் படுக்குதல்” என்ற மரபுத்தொடர் பயன்படுத்தப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָרוּר
  choice: சபிக்கப்பட்டவன்
  rationale: உடன்படிக்கைச் சாபத்தை அறிவிக்கும் பயனிலைச் சொல்லாக உள்ளது. ‘சபிக்கப்பட்டவன்’ என்பது நவீனத் தமிழில் தெளிவாகவும் சட்ட-வழிபாட்டுச் சூழலுக்கு ஏற்றவாறும் உள்ளது.
- source_word: שֹׁכֵב עִם
  choice: உடன் படுக்கிறவன்
  rationale: இச்சூழலில் இந்த எபிரெய மரபுத்தொடர் பாலுறவைக் குறிக்கும் நாகரிக மறைமுகச் சொல்லாடல். ‘உடன் படுக்கிறவன்’ மூலத்தின் உருவகத்தைப் பாதுகாக்கிறது; பொருளை அடிக்குறிப்பு வெளிப்படையாகத் தருகிறது.
- source_word: חֹתַנְתּוֹ
  choice: தன் மாமியார்
  rationale: חֹתֶנֶת என்பதற்கு ‘மாமியார்’ என்பது நேரடியான இயல்பான தமிழ்ச் சொல்; மூன்றாம் ஆண்பால் ஒருமை உடைமைப் பின்னொட்டை ‘தன்’ வெளிப்படுத்துகிறது.
- source_word: וְאָמַר כָּל הָעָם
  choice: மக்கள் அனைவரும் ... சொல்ல வேண்டும்
  rationale: கூட்டான வழிபாட்டு மறுமொழிக்கான விதிப்பூர்வ வலிமையை ‘சொல்ல வேண்டும்’ இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது; மூலத்தில் இல்லாத ‘இஸ்ரவேல்’ சேர்க்கப்படவில்லை.
- source_word: אָמֵן
  choice: ஆமென்
  rationale: எபிரெய வழிபாட்டு மறுமொழி தமிழ்க் கிறிஸ்தவப் பயன்பாட்டில் பரவலாக அறியப்பட்ட ஒலிபெயர்ப்பாகப் பாதுகாக்கப்படுகிறது.
theological_decisions:
- issue: பாலுறவைக் குறிக்கும் நாகரிக மறைமுகச் சொல்லாடல்
  choice: ‘உடன் படுக்கிறவன்’ என்று மூல மரபுத்தொடரைப் பாதுகாத்தல்
  alternative: ‘பாலுறவு கொள்கிறவன்’ என்று வெளிப்படையாக மொழிபெயர்த்தல்
  rationale: மூலத்தின் நாகரிக மறைமுக நடையைப் பாதுகாத்தபடியே, சட்டப்பொருள் மறைந்துவிடாதவாறு அடிக்குறிப்பில் வெளிப்படையாக விளக்கப்படுகிறது.
- issue: ஆண்பால் ஒருமைச் செய்பவர்
  choice: ‘படுக்கிறவன் ... சபிக்கப்பட்டவன்’ என்று ஆண்பால் ஒருமையைப் பிரதிபலித்தல்
  alternative: ‘படுப்பவர் ... சபிக்கப்பட்டவர்’ எனப் பாலினத்தைப் பொதுமைப்படுத்தல்
  rationale: எபிரெயப் பங்கேற்புச் சொல் இலக்கண ரீதியாக ஆண்பால் ஒருமையில் உள்ளது; உறவுமுறைச் சூழலும் ஆண் செய்பவரைக் குறிக்கிறது. ஆகவே மூல வடிவம் தமிழிலும் காக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சட்ட-வழிபாட்டு அறிவிப்புக்கேற்ற கண்ணியமான நடையும் பொதுமக்கள் எளிதில் புரிந்துகொள்ளும் சொற்களும் பயன்படுத்தப்பட்டுள்ளன. ‘மாமியார்’ என்ற மரியாதைப் பன்மை வடிவத்துடன் இயல்பாக அமைய ‘தன்’ பயன்படுத்தப்பட்டுள்ளது.
