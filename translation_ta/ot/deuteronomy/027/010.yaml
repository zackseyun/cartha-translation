base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/010.yaml
  text: So you shall listen to the voice of Yahweh your God and do his commandments and his statutes that I am commanding you today[a].
translation:
  language: ta
  text: ஆகவே, நீ உன் கடவுளாகிய யாவேயின் குரலுக்குச் செவிகொடுத்து,[a] இன்று நான் உனக்குக் கட்டளையிடுகிற அவருடைய கட்டளைகளையும் சட்டங்களையும் நிறைவேற்று.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உன் கடவுளாகிய யாவேயின் குரலுக்குக் கீழ்ப்படி.” “குரலுக்குச் செவிகொடு” என்ற எபிரெய மரபுத்தொடர் பெரும்பாலும் கீழ்ப்படிதலையும் உள்ளடக்குகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁמַעְתָּ בְּקוֹל
  choice: குரலுக்குச் செவிகொடுத்து
  rationale: שׁמע בקול என்ற எபிரெய மரபுத்தொடர் கவனமாகக் கேட்டு இணங்குவதைக் குறிக்கிறது. ‘செவிகொடுத்து’ என்பது கீழ்ப்படிதல் என்ற உட்கருத்தைத் தக்கவைக்கும் அதேவேளையில், அடுத்துவரும் ‘நடக்க வேண்டும்’ என்பதோடு தேவையற்ற மறுகூறலைத் தவிர்க்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: திருப்பெயராகிய יהוה என்பதை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் பரவலாகப் புரிந்துகொள்ளத்தக்க ஒலிபெயர்ப்பாகத் தருகிறது.
- source_word: אֱלֹהֶיךָ
  choice: உங்கள் கடவுளாகிய
  rationale: இஸ்ரயேலுடன் உள்ள உடன்படிக்கை உறவைக் காட்டும் இரண்டாம் நபர் ஒருமை உடைமை வடிவை, கூட்டத்தினரிடம் மரியாதையாக உரையாடும் இயல்பான தமிழில் வழங்குகிறது.
- source_word: וְעָשִׂיתָ
  choice: நடக்க வேண்டும்
  rationale: עשה என்பதன் அடிப்படைப் பொருள் ‘செய்/நிறைவேற்று.’ கட்டளைகள் மற்றும் சட்டங்களோடு தமிழில் ‘அவற்றின்படி நட’ என்பது இயல்பாகவும் தெளிவாகவும் அவற்றை நடைமுறைப்படுத்தும் கருத்தை வழங்குகிறது.
- source_word: מִצְוֺתָיו
  choice: அவருடைய கட்டளைகள்
  rationale: מִצְוָה என்பதன் அதிகாரபூர்வமான கட்டளைப் பொருளை நேரடியாகத் தக்கவைக்கிறது.
- source_word: חֻקָּיו
  choice: சட்டங்கள்
  rationale: חֹק என்பதன் நிர்ணயிக்கப்பட்ட விதிமுறை அல்லது சட்டம் என்ற பொருளைத் தருகிறது; முந்தைய ‘கட்டளைகள்’ என்பதிலிருந்து சொல்லியல் வேறுபாட்டையும் காக்கிறது.
- source_word: אֲשֶׁר אָנֹכִי מְצַוְּךָ
  choice: நான் உங்களுக்குக் கட்டளையிடுகிற
  rationale: பேச்சின் நிகழ்கால உடனடித்தன்மையை எபிரெயப் பங்கேற்புவினைக்கு ஏற்றவாறு வெளிப்படுத்துகிறது.
- source_word: הַיּוֹם
  choice: இன்று
  rationale: உடன்படிக்கையின் தற்போதைய தருணத்தை வலியுறுத்தும் இயல்பான நவீனத் தமிழ் வடிவம்.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் தனிப்பட்ட உடன்படிக்கைப் பெயர் நேரடியாக இருப்பதால், அதை ஒரு பட்டமாக மாற்றாமல் ஒலிபெயர்க்கிறது.
- issue: שׁמע בקול என்பதில் கேட்பதும் கீழ்ப்படிவதும் இடையிலான உறவு
  choice: குரலுக்குச் செவிகொடுத்து
  alternative: குரலுக்குக் கீழ்ப்படிந்து
  rationale: எபிரெயச் சொல்லின் நேரடியான ‘கேள்’ என்ற படிமத்தையும் அதில் உட்பொருளாக உள்ள கீழ்ப்படிதலையும் தக்கவைக்கிறது; கீழ்ப்படிதல் என்ற பொருளை மட்டும் வைத்து சொல்லின் நுட்பத்தைச் சுருக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுமக்கள் எளிதில் புரிந்துகொள்ளும் மரியாதையான பன்மை உரையாடல் வடிவம் பயன்படுத்தப்பட்டுள்ளது. சட்ட மொழியின் கண்ணியத்தைத் தக்கவைத்தபடி வாக்கியம் இயல்பான தமிழ்ச் சொல்லோட்டத்தில் அமைக்கப்பட்டுள்ளது.
