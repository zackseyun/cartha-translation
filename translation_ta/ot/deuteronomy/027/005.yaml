- from: அங்கே உங்கள் கடவுளாகிய யாவேக்கு[a] கற்களால் ஒரு பலிபீடத்தைக் கட்ட வேண்டும்; அந்தக் கற்களின்மேல் இரும்பைச் செலுத்தக் கூடாது.[b]
  to: அங்கே உன் கடவுளாகிய யாவேக்கு[a] கற்களால் ஒரு பலிபீடத்தைக் கட்ட வேண்டும்; அந்தக் கற்களின்மேல் இரும்புக் கருவியைப் பயன்படுத்தக் கூடாது.[b]
  rationale: திருத்தம் எபிரெய இரண்டாம் நபர் ஒருமையை «உன்» எனப் பாதுகாக்கிறது. மேலும், தமிழில் இயல்பாகப் புரியும்படி இரும்புக் கருவியைப் பயன்படுத்துவதற்கான தடை முதன்மை உரையில் வெளிப்படுத்தப்படுகிறது; மூலத்தில் «கருவி» வெளிப்படையாக இல்லை என்பதையும் «உயர்த்துதல்» என்ற சொற்படியான வெளிப்பாட்டையும் அடிக்குறிப்பு பாதுகாக்கிறது.
