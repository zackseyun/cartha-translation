review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys the altar, its stone construction, and the prohibition on applying iron to the stones. However, the Hebrew suffix in אֱלֹהֶיךָ is second-person singular. Rendering it as «உங்கள்» introduces a plural/honorific form not marked in the source; «உன்» more directly preserves the singular address. The prohibition is contextually about an iron implement, so making «கருவி» explicit in the text is a natural Tamil rendering, while the footnote retains the Hebrew's compressed wording.
  naturalness: «இரும்பைச் செலுத்தக் கூடாது» is understandable but is not the most idiomatic modern Tamil expression for using a tool on stone. «இரும்புக் கருவியைப் பயன்படுத்தக் கூடாது» is clearer and more natural in this constructional instruction.
  terminology: «யாவே», «கடவுள்», and «பலிபீடம்» are appropriate. «யாவேக்கு» correctly expresses dedication to Yahweh. The divine-name footnote is retained; the lexical note is revised so that it accurately distinguishes the interpretive explicitness of «இரும்புக் கருவி» from the Hebrew wording.
  issues:
  - severity: medium
    issue: Second-person number differs from the Hebrew
    rationale: The source reads «your God» with a 2ms suffix. «உங்கள் கடவுளாகிய» is plural/honorific, whereas «உன் கடவுளாகிய» preserves the source's singular form without loss of clarity.
  - severity: low
    issue: The expression «இரும்பைச் செலுத்துதல்» is awkward in this context
    rationale: The Hebrew idiom concerns raising/wielding iron on the stones, understood as using an iron tool. Explicitly saying «இரும்புக் கருவியைப் பயன்படுத்துதல்» is idiomatic Tamil; a footnote preserves the literal compact expression.
