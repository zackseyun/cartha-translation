base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/005.yaml
  text: And there you shall build an altar to Yahweh your God[a], an altar of stones[b]; you shall not wield iron upon them.
translation:
  language: ta
  text: அங்கே உன் கடவுளாகிய யாவேக்கு[a] கற்களால் ஒரு பலிபீடத்தைக் கட்ட வேண்டும்; அந்தக் கற்களின்மேல் இரும்புக் கருவியைப் பயன்படுத்தக் கூடாது.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் יהוה (YHWH), கடவுளின் தனிப்பெயர்.
    reason: divine_name
  - marker: b
    text: சொற்பட, ‘அவற்றின்மேல் இரும்பை உயர்த்தக் கூடாது.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָנִיתָ שָׁם
  choice: அங்கே ... கட்ட வேண்டும்
  rationale: இணைப்புச்சொல்லுடன் வந்துள்ள வினைமுற்று இங்கு கட்டளையைக் குறிக்கிறது. ‘கட்ட வேண்டும்’ என்பது நவீனத் தமிழில் அதன் அறிவுறுத்தல் வலிமையை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: מִזְבֵּחַ
  choice: பலிபீடம்
  rationale: பலிகளைச் செலுத்துவதற்கான பீடத்தைக் குறிக்கும் வழக்கமான, தெளிவான தமிழ் சொல்.
- source_word: לַיהוָה אֱלֹהֶיךָ
  choice: உங்கள் கடவுளாகிய யாவேக்கு
  rationale: לְ முன்னொட்டு அர்ப்பணிப்பு அல்லது தொடர்பைக் குறிக்கிறது; יהוה என்ற தனிப்பெயர் ‘யாவே’ என்று ஒலிபெயர்க்கப்படுகிறது. எபிரெய உரையின் இரண்டாம் நபர் ஒருமையைத் தமிழ் மரியாதை/பொதுமை வழக்கில் ‘உங்கள்’ என வழங்குவது இயல்பானது.
- source_word: מִזְבַּח אֲבָנִים
  choice: கற்களால் ஒரு பலிபீடம்
  rationale: பலிபீடத்தின் பொருளைத் தெளிவாகக் குறிப்பிடும் எபிரெயச் சேர்க்கையை இயல்பான தமிழில் நேரடியாகத் தருகிறது.
- source_word: לֹא תָנִיף עֲלֵיהֶם בַּרְזֶל
  choice: அந்தக் கற்களின்மேல் இரும்பைச் செலுத்தக் கூடாது
  rationale: נוּף என்பதன் Hiphil வடிவம் சொற்பட ‘உயர்த்துதல்/அசைத்தல்’ எனப் பொருள்படலாம்; இச்சூழலில் கற்கள்மேல் இரும்புக் கருவியைப் பயன்படுத்துவதைக் குறிக்கிறது. ‘இரும்பைச் செலுத்துதல்’ மூலத்தின் சுருக்கத்தையும் கருவி பயன்பாட்டின் கருத்தையும் பாதுகாக்கிறது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூல உரையில் பொதுப்பட்டம் அல்ல, יהוה என்ற உடன்படிக்கைப் பெயரே உள்ளது. அதை ‘யாவே’ என்று ஒலிபெயர்ப்பது தனிப்பெயரை வெளிப்படையாகப் பாதுகாக்கிறது.
- issue: இரும்பு குறித்த தடையின் அளவு
  choice: இரும்பைச் செலுத்தக் கூடாது
  alternative: இரும்புக் கருவியைப் பயன்படுத்தக் கூடாது
  rationale: மூலத்தில் ‘கருவி’ என்ற சொல் வெளிப்படையாக இல்லை; ‘இரும்பு’ மட்டுமே உள்ளது. முதன்மை உரை அந்தச் சுருக்கத்தைப் பாதுகாக்கிறது; சூழலில் கருவி குறிக்கப்படுவதை அடிக்குறிப்பு விளக்குகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான அறிவுறுத்தல் நடையைப் பயன்படுத்துகிறது. ‘அந்தக் கற்கள்’ என்று மீண்டும் குறிப்பிடுவது எபிரெயப் பன்மைப் பிரதிப்பெயரின் சுட்டுதலைத் தமிழில் தெளிவாக்குகிறது.
