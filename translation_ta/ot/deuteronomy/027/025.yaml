source:
  edition: WLC
  text: אָרוּר֙ לֹקֵ֣חַ שֹׁ֔חַד לְ/הַכּ֥וֹת נֶ֖פֶשׁ דָּ֣ם נָקִ֑י וְ/אָמַ֥ר כָּל הָ/עָ֖ם אָמֵֽן־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/025.yaml
  text: Cursed is the one who takes a bribe to strike down an innocent person[a], and all the people shall say, ‘Amen.’
translation:
  language: ta
  text: குற்றமற்ற ஒருவரைக் கொல்வதற்காகக் கையூட்டு வாங்குகிறவன் சபிக்கப்பட்டவன்[a]. மக்கள் அனைவரும், ‘ஆமென்’ என்று சொல்ல வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'சொல்லுக்குச் சொல்: “குற்றமற்ற இரத்தத்தை வீழ்த்துவதற்காக.” இந்த எபிரெய மரபுத்தொடர் குற்றமற்ற ஒருவரைக் கொல்வதைக் குறிக்கிறது.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָרוּר
  choice: சபிக்கப்பட்டவன்
  rationale: உடன்படிக்கைச் சாப அறிவிப்பை இயல்பான, கண்ணியமான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: לֹקֵחַ שֹׁחַד
  choice: கையூட்டு வாங்குகிறவன்
  rationale: பெயர்ச்சொல் தன்மையில் வரும் எபிரெயப் பங்கேற்புவினையின் பொதுமை ஒருமையையும், நீதியைப் புரட்டும் சட்டவிரோதப் பணத்தின் பொருளையும் தெளிவாகக் காக்கிறது.
- source_word: לְהַכּוֹת
  choice: கொல்வதற்காக
  rationale: נֶפֶשׁ דָּם נָקִי என்ற சூழலில் נכה உயிரைப் பறிக்கும் வன்முறையைக் குறிக்கிறது; தமிழில் ‘கொல்வது’ முடிவைத் தெளிவாகத் தெரிவிக்கிறது.
- source_word: נֶפֶשׁ דָּם נָקִי
  choice: குற்றமற்ற ஒருவரை
  rationale: சொல்லுக்குச் சொல் வடிவமான ‘குற்றமற்ற இரத்தம்’ என்பதன் எபிரெய வழக்குப் பொருள், மரணத்திற்குரிய குற்றமற்ற மனிதர் என்பதாகும்; நவீனத் தமிழில் மனிதரைக் குறிப்பது தெளிவானது.
- source_word: וְאָמַר כָּל הָעָם
  choice: மக்கள் அனைவரும் … என்று சொல்ல வேண்டும்
  rationale: வழிபாட்டு-சட்டச் சூழலில் விதிக்கப்பட்ட பொதுமக்கள் பதிலுரையின் கட்டாயத் தன்மையை இயல்பான தமிழில் காட்டுகிறது.
- source_word: אָמֵן
  choice: ஆமென்
  rationale: உடன்படிக்கை உறுதிமொழியாக நிலைபெற்ற வழிபாட்டுச் சொல்லை ஒலிபெயர்த்து வைத்திருக்கிறது.
theological_decisions:
- issue: உடன்படிக்கைச் சாபச் சூத்திரத்தின் மொழிபெயர்ப்பு
  choice: குற்றமற்ற ஒருவரைக் கொல்வதற்காகக் கையூட்டு வாங்குகிறவன் சபிக்கப்பட்டவன்
  alternative: குற்றமற்ற இரத்தத்தை வீழ்த்துவதற்காகக் கையூட்டு வாங்குகிறவன் சபிக்கப்பட்டவன்
  rationale: முதன்மை உரை சட்ட மற்றும் உடன்படிக்கை வலிமையைத் தக்கவைத்தபடி எபிரெய மரபுத்தொடரின் பொருளை வாசகருக்குத் தெளிவாக்குகிறது; சொல்லுக்குச் சொல் வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும் வகையில் கண்ணியமான சட்ட-வழிபாட்டு நடை பயன்படுத்தப்பட்டுள்ளது. ‘கையூட்டு’ என்பது தெளிவான நவீன சட்டச் சொல்; ‘ஆமென்’ வழிபாட்டு மறுமொழியாகத் தக்கவைக்கப்பட்டுள்ளது.
