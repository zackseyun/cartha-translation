  text: אָר֗וּר מַטֶּ֛ה מִשְׁפַּ֥ט גֵּר יָת֖וֹם וְ/אַלְמָנָ֑ה וְ/אָמַ֥ר כָּל הָ/עָ֖ם אָמֵֽן־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/019.yaml
  text: Cursed is the one who perverts the justice due to the sojourner[a], the fatherless, and the widow. And all the people shall say[c][b], “Amen.”
translation:
  language: ta
  text: தங்களிடையே வாழும் அந்நியர்[b], தந்தையற்றவர்[c], விதவை ஆகியோருக்குரிய நீதியைத் திசைதிருப்புகிறவன்[a] சபிக்கப்பட்டவன். மக்கள் அனைவரும், “ஆமென்” என்று சொல்ல வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நியாயத்தைப் புரட்டுகிறவன்.”
    reason: lexical_alternative
  - marker: b
    text: இங்கு “அந்நியர்” என்பது இஸ்ரவேலரைச் சேர்ந்தவரல்லாதபோதும் அவர்களிடையே குடியிருந்த ஒருவரைக் குறிக்கிறது.
    reason: cultural_note
  - marker: c
    text: “தந்தையற்றவர்” என்பதை “அனாதை” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָרוּר
  choice: சபிக்கப்பட்டவன்
  rationale: உடன்படிக்கைச் சாபத்தை அறிவிக்கும் எபிரெய முன்வைப்புச் சொல்லின் வலிமையையும், ஒருவர்மீது சாபம் அறிவிக்கப்படும் நிலையையும் நேரடியாகக் காக்கிறது.
- source_word: מַטֶּה
  choice: புரட்டுகிறவன்
  rationale: נטה என்ற வேர்ச்சொல்லின் Hifil வடிவம் இங்கு நீதியை நேரான வழியிலிருந்து திருப்புதல் அல்லது சீர்குலைத்தல் என்ற சட்டப் பொருளைக் கொண்டது; ‘நீதியைப் புரட்டுதல்’ என்பது தமிழில் இயல்பான சட்ட-ஒழுக்கச் சொல்லாக்கம்.
- source_word: מִשְׁפַּט
  choice: கிடைக்க வேண்டிய நீதி
  rationale: מִשְׁפָּט இங்கு பொதுவான நீதி என்ற கருத்தை மட்டும் அல்லாமல், பாதிப்புக்குள்ளாகக்கூடியவர்களுக்குரிய சட்டநியாயத்தையும் குறிக்கிறது.
- source_word: גֵּר
  choice: தங்களிடையே குடியிருக்கும் அந்நியர்
  rationale: இஸ்ரவேலரிடையே வாழ்ந்தாலும் அந்த நாட்டைச் சேர்ந்திராத, சமூக ரீதியாகப் பாதுகாப்பற்ற குடியிருப்பாளரைத் தெளிவாகக் குறிக்கிறது; ‘அந்நியர்’ மட்டும் தரக்கூடிய வழிப்போக்கர் என்ற தவறான எண்ணத்தைத் தவிர்க்கிறது.
- source_word: יָתוֹם
  choice: தந்தையற்றவர்
  rationale: தந்தையின் பாதுகாப்பை இழந்தவரைக் குறிக்கும் எபிரெயச் சமூக-சட்டப் பிரிவை நெருக்கமாகப் பிரதிபலிக்கிறது; ‘அனாதை’ என்பதும் சாத்தியமான மாற்று.
- source_word: אַלְמָנָה
  choice: விதவை
  rationale: எபிரெயச் சொல்லின் சமூக-சட்டப் பொருளை நேரடியாகவும் இயல்பாகவும் தருகிறது.
- source_word: וְאָמַר כָּל הָעָם
  choice: மக்கள் அனைவரும் ... சொல்ல வேண்டும்
  rationale: சடங்கு வரிசையில் வரும் இவ்வினை வடிவத்தை, மக்களுக்கு வழங்கப்படும் முறையான பதிலுரைக் கட்டளையாகத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: אָמֵן
  choice: ஆமென்
  rationale: உடன்படிக்கைச் சாபத்தை மக்கள் உறுதிப்படுத்தும் நிலையான வழிபாட்டு மறுமொழியாக இருப்பதால் ஒலிபெயர்ப்பாகவே காக்கப்பட்டுள்ளது.
theological_decisions:
- issue: பாதுகாப்பற்ற மூன்று சமூகப் பிரிவுகளை நவீன அரசியல் வகைப்பாடுகளாக மாற்றாமல் மொழிபெயர்த்தல்
  choice: தங்களிடையே குடியிருக்கும் அந்நியர், தந்தையற்றவர், விதவை
  alternative: வெளிநாட்டவர், அனாதை, விதவை
  rationale: தேர்ந்தெடுக்கப்பட்ட சொற்கள், இஸ்ரவேலின் உடன்படிக்கைச் சட்டச் சூழலில் இருந்த வரலாற்றுச் சமூகப் பிரிவுகளையும் அவர்களின் பாதுகாப்பற்ற நிலையையும் காக்கின்றன; அதேவேளை அவற்றைத் தற்காலக் குடியேற்றக் கொள்கைச் சொற்களோடு ஒன்றாக்குவதில்லை.
- issue: מַטֶּה מִשְׁפַּט என்பதன் சட்டப் பொருள்
  choice: கிடைக்க வேண்டிய நீதியைப் புரட்டுகிறவன்
  alternative: நியாயத்தைத் திசைதிருப்புகிறவன்
  rationale: இது தவறான தனிப்பட்ட தீர்ப்பை மட்டும் அல்லாமல், குறிப்பிடப்பட்டவர்களுக்குரிய சட்டநியாயத்தை மறுப்பதையும் சீர்குலைப்பதையும் குறிக்கிறது. மாற்று சொல்லாக்கமும் சாத்தியம் என்பதால் குறிப்பில் தரப்பட்டுள்ளது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் உடன்படிக்கைச் சாப அறிவிப்பின் முறையான, கண்ணியமான தொனியைத் தக்கவைத்தும் மொழிபெயர்க்கப்பட்டுள்ளது. ‘அனைவரும்’ மற்றும் ‘சொல்ல வேண்டும்’ ஆகியவை சடங்கு வழிமுறையை இயல்பான தமிழில் வெளிப்படுத்துகின்றன.
