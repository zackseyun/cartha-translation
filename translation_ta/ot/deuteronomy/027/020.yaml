base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/020.yaml
  text: Cursed is the one who lies with his father's wife[a], because he has uncovered his father's skirt. And all the people shall say[b], ‘Amen.’
translation:
  language: ta
  text: தன் தந்தையின் மனைவியுடன்[a] பாலுறவு கொள்கிறவன் சபிக்கப்பட்டவன்; ஏனெனில் அவன் தன் தந்தையின் ஆடை ஓரத்தை வெளிப்படுத்தியிருக்கிறான்[b]. மக்கள் அனைவரும், “ஆமென்” என்று சொல்ல வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “தந்தையின் மனைவி” என்பது இந்தச் சூழலில் மாற்றாந்தாயைக் குறிக்கலாம்; ஆனால் எபிரெய மூலத்தில் “மாற்றாந்தாய்” என்ற உறவுமுறைச் சொல் வெளிப்படையாக இல்லை.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில் நேரடியாக, “தன் தந்தையின் ஆடை ஓரத்தை வெளிப்படுத்தியிருக்கிறான்.” இது பாலுறவைக் குறிக்கும் மறைமொழி; “தன் தந்தையின் நிர்வாணத்தை வெளிப்படுத்தியிருக்கிறான்” என்றும் பொருள் விளக்கலாம். லேவியராகமம் 18:8; 20:11 ஆகியவற்றின் மொழியுடன் இது தொடர்புடையது.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָרוּר
  choice: சபிக்கப்பட்டவன்
  rationale: உடன்படிக்கைச் சாபத்தை அறிவிக்கும் பயனிலை வடிவைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: שֹׁכֵב עִם
  choice: பாலுறவு கொள்கிறவன்
  rationale: இது பாலுறவைக் குறிக்கும் எபிரெய மரபுத்தொடர். தமிழில் ‘படுக்கிறவன்’ என்பது வெறும் உறக்கமாகப் புரிந்துகொள்ளப்படக்கூடும் என்பதால், சட்டப் பின்னணியில் பொருளைத் தெளிவாகக் கூறுகிறது.
- source_word: אֵשֶׁת אָבִיו
  choice: தன் தந்தையின் மனைவி
  rationale: மூலத்தின் உறவுமுறைச் சொற்றொடரைப் பாதுகாக்கிறது; ‘மாற்றாந்தாய்’ என்று மூலத்தில் இல்லாத அளவுக்குக் குறிப்பாக்கவில்லை.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: சாபத்திற்கான காரணத்தை அறிமுகப்படுத்தும் காரணப் பொருளைத் தக்கவைக்கிறது.
- source_word: גִלָּה כְּנַף אָבִיו
  choice: தன் தந்தையின் ஆடை ஓரத்தை விலக்கியிருக்கிறான்
  rationale: כָּנָף என்பதன் ‘ஓரம்/ஆடை ஓரம்’ என்ற உருவகத்தைப் பாதுகாத்து, பாலியல் மறைமொழியை விளக்கவுரையாக மாற்றாமல் வைக்கிறது.
- source_word: וְאָמַר כָּל הָעָם
  choice: மக்கள் அனைவரும் … என்று சொல்ல வேண்டும்
  rationale: உடன்படிக்கைச் சடங்கில் மக்கள் அளிக்க வேண்டிய கூட்டு மறுமொழியை இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: אָמֵן
  choice: ஆமென்
  rationale: எபிரெய வழிபாட்டு மறுமொழியின் வழக்கமான தமிழ் ஒலிபெயர்ப்பைப் பயன்படுத்துகிறது.
theological_decisions:
- issue: பாலியல் குற்றத்தைக் குறிக்கும் மறைமொழியை எவ்வாறு மொழிபெயர்ப்பது
  choice: ‘தன் தந்தையின் ஆடை ஓரத்தை விலக்கியிருக்கிறான்’ என்ற மூல உருவகத்தை முதன்மை உரையில் வைத்தல்
  alternative: ‘தன் தந்தையின் நிர்வாணத்தை வெளிப்படுத்தியிருக்கிறான்’ அல்லது ‘தன் தந்தையின் மணவுறவை மீறியிருக்கிறான்’
  rationale: இந்தச் சொற்றொடர் லேவியராகமத்தின் பாலியல் தடைகளில் வரும் மொழியை நினைவூட்டுகிறது; அதேவேளை இங்கு உள்ள כָּנָף என்ற பெயர்ச்சொல் நேரடியாக ‘நிர்வாணம்’ என்று பொருள்படாது. ஆகவே தந்தையின் மணவுரிமை அல்லது கௌரவம் குறித்த நுட்பத்தைத் தீர்மானித்து விடாமல், மூல உருவகத்தை வைத்துப் பொருளை அடிக்குறிப்பில் விளக்குகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சட்டமும் உடன்படிக்கைச் சடங்கும் சார்ந்த கண்ணியமான தொனி பயன்படுத்தப்பட்டுள்ளது. பாலியல் செயல் தெளிவாகச் சொல்லப்பட்டாலும் அநாகரிகச் சொற்கள் தவிர்க்கப்பட்டுள்ளன; மூலத்தின் ஆடை-ஓர உருவகம் முதன்மை உரையில் பாதுகாக்கப்பட்டுள்ளது.
