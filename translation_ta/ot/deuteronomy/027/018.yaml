  text: אָר֕וּר מַשְׁגֶּ֥ה עִוֵּ֖ר בַּ/דָּ֑רֶךְ וְ/אָמַ֥ר כָּל הָ/עָ֖ם אָמֵֽן־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/018.yaml
  text: Cursed is the one who misleads a blind man on the road. And all the people shall say[a], ‘Amen.’
translation:
  language: ta
  text: பார்வையற்ற ஒருவனை வழியில் வழிதவறச் செய்கிறவன் சபிக்கப்பட்டவன். மக்கள் அனைவரும், “ஆமென்” என்று சொல்ல வேண்டும்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אָרוּר
  choice: சபிக்கப்பட்டவன்
  rationale: உடன்படிக்கைச் சாபத்தை அறிவிக்கும் பயனிலைப் பெயரடையின் வலிமையை இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: מַשְׁגֶּה
  choice: தவறாக வழிநடத்துகிறவன்
  rationale: ஹிஃபில் வினையெச்சத்தின் பிறரை வழிதவறச் செய்யும் காரணவினைப் பொருளைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: עִוֵּר
  choice: பார்வையற்ற ஒருவனை
  rationale: தனிநபரைக் குறிக்கும் எபிரெய ஆண்பால் ஒருமை வடிவைத் தமிழில் இயல்பாகவும் மரியாதையாகவும் காட்டுகிறது.
- source_word: בַּדָּרֶךְ
  choice: வழியில்
  rationale: இங்கு காணப்படும் நேரடியான இடஞ்சார்ந்த பொருளைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: וְאָמַר
  choice: என்று சொல்ல வேண்டும்
  rationale: சட்ட-வழிபாட்டு வரிசையில் எதிர்பார்க்கப்படும் கட்டளையார்ந்த சமூகப் பதிலை நவீன தமிழில் காட்டுகிறது.
- source_word: כָּל הָעָם
  choice: மக்கள் அனைவரும்
  rationale: மூலத்தில் உள்ள ‘மக்கள் அனைவரும்’ என்ற அளவைக் கூடுதல் விளக்கமின்றித் தக்கவைக்கிறது.
- source_word: אָמֵן
  choice: ஆமென்
  rationale: உடன்படிக்கை மற்றும் வழிபாட்டுச் சூழலில் நிலைபெற்ற ஒலிபெயர்ப்பைப் பாதுகாக்கிறது.
theological_decisions:
- issue: சாப அறிவிப்பின் இயல்பு
  choice: சபிக்கப்பட்டவன்
  alternative: சபிக்கப்படக்கடவன்
  rationale: எபிரெய உரை விருப்பத்தையோ வேண்டுதலையோ அல்லாமல் அறிவிப்புத் தன்மையுள்ள உடன்படிக்கைச் சாபச் சூத்திரத்தை வழங்குகிறது.
- issue: עִוֵּר என்ற பெயர்ச்சொல்லாகப் பயன்படும் பெயரடையின் பாலின வெளிப்பாடு
  choice: பார்வையற்ற ஒருவனை
  alternative: பார்வையற்ற ஒருவரை
  rationale: சட்டமுறைத் தனிநபர் எடுத்துக்காட்டில் உள்ள எபிரெய ஆண்பால் ஒருமை வடிவைத் தமிழின் இயல்புக்கு உட்பட்டு வெளிப்படுத்துகிறது; இதை ஒரு பொதுவகுப்பாக மாற்றவில்லை.
translation_notes:
  register: நவீன தரமான தமிழ்; dignified சட்ட-வழிபாட்டு நடை. ‘குருடன்’ என்பதற்குப் பதிலாக மரியாதையான ‘பார்வையற்ற’ பயன்படுத்தப்பட்டது. மூலத்தில் உண்மையான உரைமாற்றுக் குழப்பம் இல்லாததால் அடிக்குறிப்பு சேர்க்கப்படவில்லை; வழங்கப்பட்ட ஆங்கில அடிக்குறிப்பு உண்மையில் பிரதான சொற்றொடரின் மாற்று மொழிபெயர்ப்பைச் சொல்கிறது.
