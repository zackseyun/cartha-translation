source:
  edition: WLC
  text: וְ/הָיָה֮ בְּ/עָבְרְ/כֶ֣ם אֶת הַ/יַּרְדֵּן֒ תָּקִ֜ימוּ אֶת הָ/אֲבָנִ֣ים הָ/אֵ֗לֶּה אֲשֶׁ֨ר אָנֹכִ֜י מְצַוֶּ֥ה אֶתְ/כֶ֛ם הַ/יּ֖וֹם בְּ/הַ֣ר עֵיבָ֑ל וְ/שַׂדְתָּ֥ אוֹתָ֖/ם בַּ/שִּֽׂיד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/004.yaml
  text: And when you cross the Jordan[a], you shall set up these stones, which I am commanding you today, on Mount Ebal, and you shall plaster them with lime.
translation:
  language: ta
  text: நீங்கள் யோர்தானைக் கடக்கும்போது, இன்று நான் உங்களுக்குக் கட்டளையிடுகிற இந்தக் கற்களை ஏபால் மலையில்[a] நிறுத்த வேண்டும்; அவற்றின் மேல் சுண்ணாம்பைப் பூச வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சில உரைமரபுகள், குறிப்பாக சமாரிய ஐந்தாகமம், “ஏபால் மலை” என்பதற்குப் பதிலாக “கெரிசீம் மலை” என்று வாசிக்கின்றன.
    reason: textual_variant
lexical_decisions:
- source_word: וְהָיָה בְּעָבְרְכֶם
  choice: நீங்கள் ... கடந்ததும்
  rationale: வְהָיָה என்பதும் ב + தொழிற்பெயர் அமைப்பும் சேர்ந்து எதிர்கால காலச்சூழலைக் குறிக்கின்றன. ‘கடந்ததும்’ என்பது தமிழில் இயல்பாக அந்தக் காலத் தொடர்பை வெளிப்படுத்துகிறது.
- source_word: אֶת הַיַּרְדֵּן
  choice: யோர்தானைக்
  rationale: இது யோர்தான் ஆற்றைக் குறிக்கும் இடப்பெயர். சூழலில் ‘ஆறு’ என்பதைச் சேர்க்காமலேயே பொருள் தெளிவாக உள்ளது.
- source_word: תָּקִימוּ
  choice: நாட்டி
  rationale: קום என்பதன் ஹிஃபில் வடிவம் இங்கு கற்களை நிலைநிறுத்துதல் அல்லது எழுப்புதல் என்று பொருள். கற்களை அமைக்கும் செயலுக்கு ‘நாட்டி’ என்பது சுருக்கமான, இயல்பான தமிழ்.
- source_word: הָאֲבָנִים הָאֵלֶּה
  choice: இந்தக் கற்களை
  rationale: மூலத்தின் சுட்டுப்பெயருடன் கூடிய எளிய பொருளை நேரடியாகக் காக்கிறது; ‘நினைவுச்சின்னங்கள்’ என்று விளக்கமாக விரிவுபடுத்தவில்லை.
- source_word: אֲשֶׁר אָנֹכִי מְצַוֶּה אֶתְכֶם הַיּוֹם
  choice: இன்று நான் உங்களுக்குக் கட்டளையிடுகிற
  rationale: מְצַוֶּה என்ற நிகழ்காலப் பங்கேற்புவினையின் தொடர்ச்சியான நிகழ்கால வலிமையை இயல்பான தமிழில் காக்கிறது.
- source_word: בְּהַר עֵיבָל
  choice: ஏபால் மலையில்
  rationale: மலைப்பெயருடன் வரும் בְּ என்பதற்கு இங்கு ‘மலையில்’ பொருத்தமானது. WLC/மசோரா வாசகத்தின் ஏபால் என்ற பெயர் முதன்மை உரையில் காக்கப்பட்டுள்ளது.
- source_word: וְשַׂדְתָּ אֹתָם בַּשִּׂיד
  choice: அவற்றுக்குச் சுண்ணாம்புப் பூச வேண்டும்
  rationale: שׂוד என்பது பூசுதல் அல்லது மேற்பூச்சிடுதல்; שׂיד என்பது சுண்ணாம்பு சார்ந்த பூச்சுப் பொருள். தமிழில் ‘சுண்ணாம்புப் பூச’ என்பது செயலும் பொருளும் தெளிவாகத் தெரிவிக்கும் இயல்பான இணைச்சொல்.
theological_decisions:
- issue: உபாகமம் 27:4-இல் மலையின் பெயரைப் பற்றிய பாடவேறுபாடு
  choice: ஏபால் மலை
  alternative: கெரிசீம் மலை
  rationale: வழங்கப்பட்ட WLC மசோரா மூல உரை ‘ஏபால்’ என்று வாசிப்பதால் அது முதன்மை உரையில் பின்பற்றப்படுகிறது. சமாரிய ஐந்நூலில் காணப்படும் முக்கியமான ‘கெரிசீம்’ வாசகம் அடிக்குறிப்பில் வெளிப்படையாகப் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் வேதாகம உரைக்கு ஏற்ற கண்ணியத்துடனும் மொழிபெயர்க்கப்பட்டது. பன்மை இரண்டாம் நபர் ‘நீங்கள்/உங்கள்’ வடிவங்கள் காக்கப்பட்டுள்ளன; கட்டளைத் தன்மை ‘வேண்டும்’ என்பதால் வெளிப்படுத்தப்பட்டுள்ளது.
