    rationale: ‘நாட்டி ... பூச வேண்டும்’ என்ற தொடர் சாத்தியமானது; ஆனால் ‘நிறுத்த வேண்டும்; ... பூச வேண்டும்’ இரு செயல்களையும் தனித்த கட்டளைகளாகத் தெளிவுபடுத்துகிறது.
