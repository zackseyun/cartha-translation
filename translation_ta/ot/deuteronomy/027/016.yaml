source:
  edition: WLC
  text: אָר֕וּר מַקְלֶ֥ה אָבִ֖י/ו וְ/אִמּ֑/וֹ וְ/אָמַ֥ר כָּל הָ/עָ֖ם אָמֵֽן־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/016.yaml
  text: Cursed is the one who dishonors his father or his mother. And all the people shall say[a], “Amen.”
translation:
  language: ta
  text: “தன் தந்தையையோ தாயையையோ அவமதிக்கிறவன்[a] சபிக்கப்பட்டவன்.” மக்கள் அனைவரும், “ஆமென்” என்று சொல்ல வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அற்பமாகக் கருதுகிறவன்,” “இகழ்கிறவன்,” அல்லது “மதிப்பில்லாதவராகக் கருதுகிறவன்.” ஒருவரை முக்கியமற்றவராகவோ இகழத்தக்கவராகவோ கருதி நடத்துவதை எபிரேய வினை குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָרוּר
  choice: சபிக்கப்பட்டவன்
  rationale: உடன்படிக்கைச் சாபத்தை அறிவிக்கும் எபிரேயச் செயலெச்சப் பெயரடை வடிவத்தைத் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: מַקְלֶה
  choice: அவமதிக்கிறவன்
  rationale: ஒருவரை மதிப்பற்றவராக அல்லது அற்பமானவராகக் கருதி நடத்துதல் என்ற எபிரேய வினையின் சமூக-ஒழுக்க வலிமையை இயல்பான தமிழில் வெளிப்படுத்துகிறது; வெறும் மனநிலையாக மட்டும் குறுக்கவில்லை.
- source_word: אָבִיו וְאִמּוֹ
  choice: தன் தந்தையையோ தாயையையையோ
  rationale: மூன்றாம் நபர் ஆண்பால் ஒருமை உடைமைப் பின்னொட்டை ‘தன்’ என இயல்பாகக் காட்டுகிறது. எபிரேயத்தில் இணைப்புச் சொல் ‘மற்றும்’ என்றாலும், பெற்றோரில் எவரை அவமதித்தாலும் இச்சாபம் பொருந்தும் பகிர்நிலைப் பொருளைத் தமிழின் ‘-ஓ ... -ஓ’ அமைப்பு தெளிவாகத் தருகிறது.
- source_word: וְאָמַר כָּל הָעָם
  choice: மக்கள் அனைவரும் ... என்று சொல்ல வேண்டும்
  rationale: வழிபாட்டு முறையிலான கூட்டுப் பதிலை இயல்பான நவீனத் தமிழில் தருகிறது; மூலத்தில் இல்லாத ‘இஸ்ரவேல்’ என்பதைச் சேர்க்கவில்லை.
- source_word: אָמֵן
  choice: ஆமென்
  rationale: உடன்படிக்கை சார்ந்த ஆழ்ந்த உறுதிப்பாட்டை நிலைபெற்ற தமிழ் ஒலிபெயர்ப்பில் பாதுகாக்கிறது.
theological_decisions:
- issue: பெற்றோருக்கு எதிரான குற்றத்தின் இயல்பு
  choice: ‘அவமதிக்கிறவன்’ என்று மொழிபெயர்க்கப்பட்டது; இது பெற்றோரை மதிப்பற்றவராகக் கருதி நடத்துவதை உள்ளடக்குகிறது.
  alternative: ‘அற்பமாகக் கருதுகிறவன்’ அல்லது ‘இகழ்கிறவன்’
  rationale: மூல வினை ‘இலகுவாக/அற்பமாகக் கருதுதல்’ என்ற உருவகத்திலிருந்து அவமதிப்பைக் குறிக்கிறது. ‘அவமதிக்கிறவன்’ என்பது பெற்றோரைக் கனம்பண்ணும் கட்டளையுடனான தொடர்பைத் தக்கவைத்தபடி, குற்றத்தை வெறும் உணர்ச்சி அல்லது வாய்ச்சொல் எனக் குறுக்காமல் விடுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் வகையிலும் சட்ட-வழிபாட்டு சூழலுக்கேற்ற கண்ணியமான நடையிலும் மொழிபெயர்க்கப்பட்டது. ‘சொல்ல வேண்டும்’ என்பது கூட்டத்தாரின் கட்டாயமான உடன்படிக்கைப் பதிலை இயல்பாக வெளிப்படுத்துகிறது.
