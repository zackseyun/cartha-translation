base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/003.yaml
  text: And you shall write on them all the words of this law when you cross over[a], so that you may enter the land that Yahweh your God is giving you, a land flowing with milk and honey, just as Yahweh, the God of your fathers[b], spoke to you.
translation:
  language: ta
  text: நீ கடந்து செல்லும்போது, இந்தச் சட்டத்தின்[a] எல்லா வார்த்தைகளையும் அவற்றின்மேல் எழுத வேண்டும்; உன் தந்தையரின்[b] கடவுளாகிய யாவே உனக்குச் சொன்னபடியே, உன் கடவுளாகிய யாவே உனக்குக் கொடுக்கிற பாலும் தேனும் ஓடுகிற நாட்டிற்குள் நீ நுழைவதற்காகவே எழுத வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘இந்தப் போதனையின் எல்லா வார்த்தைகளையும்.’ எபிரெய மொழியிலுள்ள ‘தோரா’ என்ற சொல் ‘சட்டம்’ என்றும் ‘போதனை’ என்றும் பொருள்படலாம்; இங்கு உடன்படிக்கைச் சூழலுக்கு ‘சட்டம்’ பொருத்தமாக உள்ளது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘உன் மூதாதையரின்.’ எபிரெய மூலத்தில் ‘உன் தந்தையர்’ என்று உள்ளது; இது உபாகமம் முழுவதும் பயன்படுத்தப்படும் உடன்படிக்கைச் சொல்லாட்சியைப் பாதுகாக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָתַבְתָּ
  choice: எழுத வேண்டும்
  rationale: இணைப்புடன் வரும் நிறைவுவினை இங்கு கட்டளையாகச் செயல்படுகிறது; ‘வேண்டும்’ என்பது நவீன தமிழில் அதன் சட்டக் கட்டளைத் தொனியை இயல்பாகத் தருகிறது.
- source_word: עֲלֵיהֶן
  choice: அவற்றின்மேல்
  rationale: முந்தைய வசனத்தில் கூறப்பட்ட கற்களையே பெண்பால் பன்மைப் பின்னொட்டு சுட்டுகிறது.
- source_word: כָּל דִּבְרֵי הַתּוֹרָה הַזֹּאת
  choice: இந்தச் சட்டத்தின் வார்த்தைகள் அனைத்தையும்
  rationale: דִּבְרֵי என்பதன் ‘வார்த்தைகள்’ என்ற வடிவத்தையும், உபாகமத்தின் உடன்படிக்கைச் சூழலில் תּוֹרָה என்பதன் சட்டப் பொருளையும் காக்கிறது; ‘போதனை’ என்ற உண்மையான மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: בְּעָבְרֶךָ
  choice: நீ கடந்து செல்லும்போது
  rationale: முன்னிடைச்சொல்லுடன் கூடிய வினையெச்ச அமைப்பின் காலப் பொருளை வெளிப்படுத்துகிறது; யோர்தானைக் கடப்பது சூழலால் விளங்குகிறது.
- source_word: לְמַעַן אֲשֶׁר תָּבֹא
  choice: அப்போது ... நாட்டிற்குள் நீ செல்லலாம்
  rationale: நோக்கம் அல்லது விளைவைச் சுட்டும் எபிரெய அமைப்பை இயல்பான தமிழில் தருகிறது; எழுதுதலுக்கும் நாட்டிற்குள் செல்லுதலுக்கும் இடையிலான மூலவாக்கியத் தொடர்பை முற்றிலும் நீக்கவில்லை.
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: உன் கடவுளாகிய யாவே
  rationale: இறைபெயரைப் பட்டப்பெயராக மாற்றாமல் ‘யாவே’ என ஒலிபெயர்த்து, உடைமைத் தொடர்பையும் தெளிவாகக் காட்டுகிறது.
- source_word: נֹתֵן לְךָ
  choice: உனக்குக் கொடுக்கிற
  rationale: நிகழ்காலப் பெயரெச்சத்தின் தொடரும் அல்லது உறுதியான கொடை உணர்வைத் தக்கவைக்கிறது.
- source_word: אֶרֶץ זָבַת חָלָב וּדְבַשׁ
  choice: பாலும் தேனும் ஓடுகிற நாடு
  rationale: செழிப்பைக் குறிக்கும் மூல உருவகத்தைத் தமிழில் நேரடியாகவும் புரியத்தக்கவாறும் காக்கிறது.
- source_word: כַּאֲשֶׁר דִּבֶּר
  choice: சொன்னபடியே
  rationale: ‘வாக்குறுதி அளித்தார்’ என்று சூழற்பொருளைச் சேர்க்காமல், דִּבֶּר என்பதன் நேரடியான ‘சொன்னார்/பேசினார்’ பொருளைத் தக்கவைக்கிறது.
- source_word: אֱלֹהֵי אֲבֹתֶיךָ
  choice: உன் தந்தையரின் கடவுள்
  rationale: மூலத்தின் ஆண்பால் பன்மையையும் உபாகமத்தில் வரும் உடன்படிக்கைச் சூத்திரத்தையும் காக்கிறது; ‘மூதாதையர்’ மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைபெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் நேரடியாக வரும் உடன்படிக்கைப் பெயரை ஒரு பட்டப்பெயரால் மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
- issue: אֲבֹתֶיךָ என்பதன் பாலினமும் உடன்படிக்கைச் சொல்லாட்சியும்
  choice: உன் தந்தையர்
  alternative: உன் மூதாதையர்
  rationale: எபிரெயச் சொல்லின் வெளிப்படையான ஆண்பால் பன்மையையும் உபாகமத்தின் வழக்கமான உடன்படிக்கைச் சூத்திரத்தையும் முதன்மை உரையில் பாதுகாக்கிறது.
translation_notes:
  register: நவீன, கண்ணியமான, பொதுவாகப் புரியும் தமிழ்நடை பயன்படுத்தப்பட்டுள்ளது. எபிரெயத்தில் இஸ்ரவேல் ஒரே கூட்டுச் சமூகமாக இரண்டாம் நபர் ஒருமையில் அழைக்கப்படுவதால் ‘நீ/உன்/உனக்கு’ வடிவங்கள் காக்கப்பட்டுள்ளன. ‘யாவே’ என்ற இறைபெயரும் ‘பாலும் தேனும் ஓடுகிற நாடு’ என்ற மூல உருவகமும் வெளிப்படையாகத் தக்கவைக்கப்பட்டுள்ளன.
