  text: 'These shall stand on Mount Gerizim to bless the people when you cross the Jordan: Simeon[a], Levi, Judah, Issachar, Joseph, and Benjamin.'
translation:
  language: ta
  text: 'நீங்கள் யோர்தானைக் கடக்கும்போது, மக்களை ஆசீர்வதிப்பதற்காகக் கெரிசீம் மலையில் நிற்க வேண்டியவர்கள் இவர்கள்: சிமியோன், லேவி, யூதா, இசக்கார், யோசேப்பு[a], பென்யமீன்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இந்தக் கோத்திரப் பட்டியலில் யோசேப்பு என்பது அவரிடமிருந்து வந்த எப்பிராயீம், மனாசே கோத்திரங்களைக் குறிக்கிறது.
    reason: cross_reference
lexical_decisions:
- source_word: אֵלֶּה
  choice: இவர்களே
  rationale: குறிப்பிட்ட கோத்திரங்களை அறிமுகப்படுத்தும் பன்மைச் சுட்டுப்பெயர்; ‘இவர்களே’ என்பது வலியுறுத்தலையும் இயல்பான தமிழையும் காக்கிறது.
- source_word: יַעַמְדוּ
  choice: நிற்கவேண்டியவர்கள்
  rationale: சட்ட/அறிவுறுத்தல் சூழலில் வரும் Qal imperfect வடிவத்தின் கட்டளை சார்ந்த பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: לְבָרֵךְ אֶת־הָעָם
  choice: மக்களை ஆசீர்வதிப்பதற்காக
  rationale: לְ உடன் வரும் infinitive construct நோக்கத்தைக் குறிக்கிறது; ‘ஆசீர்வதிப்பதற்காக’ அந்த நோக்கத்தைத் தெளிவாகக் காட்டுகிறது.
- source_word: עַל הַר גְּרִזִים
  choice: கெரிசீம் மலையில்
  rationale: மலைமேல்/மலையில் நிற்பதைக் குறிக்கும் இயல்பான நவீனத் தமிழ்; இடப்பெயர் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: בְּעָבְרְכֶם אֶת־הַיַּרְדֵּן
  choice: நீங்கள் யோர்தானைக் கடக்கும்போது
  rationale: בְּ உடன் வரும் infinitive construct-இன் காலப் பொருளை ‘கடக்கும்போது’ இயல்பாக வழங்குகிறது; ‘கடந்தபின்’ என்று நிகழ்வுகளின் வரிசையை அளவுக்கு மீறித் தீர்மானிக்கவில்லை.
- source_word: שִׁמְעוֹן וְלֵוִי וִיהוּדָה וְיִשָּׂשכָר וְיוֹסֵף וּבִנְיָמִן
  choice: சிமியோன், லேவி, யூதா, இசக்கார், யோசேப்பு, பென்யமீன்
  rationale: தமிழில் பரவலாக அறியப்படும் வேதாகமப் பெயர் வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன; எபிரெய உரையின் பட்டியல் அப்படியே காக்கப்பட்டுள்ளது.
theological_decisions:
- issue: கோத்திரங்கள் நிற்பது முன்னறிவிப்பா அல்லது அறிவுறுத்தலா
  choice: ‘நிற்கவேண்டியவர்கள்’ என்று அறிவுறுத்தல் பொருளில் மொழிபெயர்க்கப்பட்டது.
  alternative: ‘நிற்பார்கள்’ என்று முன்னறிவிப்பாக மொழிபெயர்த்தல்.
  rationale: இது மோசே வழங்கும் உடன்படிக்கைச் சடங்கு குறித்த வழிமுறை; ஆகவே கட்டளை சார்ந்த வலிமையை வெளிப்படுத்துவது சூழலுக்கு ஏற்றது.
- issue: கோத்திரப் பட்டியலில் ‘யோசேப்பு’ என்பதன் பிரதிநிதித்துவப் பொருள்
  choice: மூல உரையைப் பின்பற்றி முதன்மை உரையில் ‘யோசேப்பு’ என்றே வைக்கப்பட்டது.
  alternative: ‘யோசேப்பின் கோத்திரங்கள்’ அல்லது ‘எப்பிராயீமும் மனாசேயும்’ என்று விரிவாக்குதல்.
  rationale: எபிரெய உரை யோசேப்பையே நேரடியாகப் பெயரிடுகிறது. விளக்கத்தை முதன்மை உரைக்குள் சேர்க்காமல் அடிக்குறிப்பில் தருவது மூலத்துக்கு உண்மையாக உள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. பட்டியலின் முறையான தொனி காக்கப்பட்டுள்ளது; தேவையற்ற பழந்தமிழ் வினை வடிவங்கள் தவிர்க்கப்பட்டுள்ளன.
