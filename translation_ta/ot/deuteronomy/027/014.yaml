  text: And the Levites shall answer and say to every man of Israel with a loud voice:[a]
translation:
  language: ta
  text: லேவியர்கள் இஸ்ரவேலின் ஒவ்வொரு மனிதனிடமும் உரத்த குரலில் பதிலுரைத்துச் சொல்ல வேண்டும்:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஒவ்வொரு இஸ்ரவேலரிடமும்.” எபிரெய மூலத்தில், பிரதிநிதித்துவக் கூட்டுப்பொருளுடன் ஆண்பால் ஒருமை வடிவில், “இஸ்ரவேலின் ஒவ்வொரு மனிதனிடமும்” என்று உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָנוּ
  choice: மறுமொழியாகச் சொல்ல வேண்டியது
  rationale: ענה இங்கு ஒரு முறையான பதிலுரையையோ பிரகடனத்தையோ அறிமுகப்படுத்துகிறது. அடுத்துள்ள וְאָמְרוּ என்பதுடன் தமிழில் இயல்பாக இணைக்க ‘மறுமொழியாகச் சொல்ல’ என மொழிபெயர்க்கப்பட்டது; அறிவுறுத்தல் சூழலை ‘வேண்டியது’ வெளிப்படுத்துகிறது.
- source_word: הַלְוִיִּם
  choice: லேவியர்கள்
  rationale: எபிரெய உரை ‘ஆசாரியர்கள்’ என்று அல்லாமல் நேரடியாக ‘லேவியர்கள்’ என்கிறது; ஆகவே உரையின் துல்லியமான சொல் பாதுகாக்கப்பட்டது.
- source_word: וְאָמְרוּ
  choice: சொல்ல
  rationale: אמר என்பதன் பொதுவான பொருள் ‘சொல்’. וְעָנוּ உடன் சேர்ந்துள்ள இரட்டை வினை அமைப்பு தமிழில் தேவையற்ற மீளுரையின்றி ‘மறுமொழியாகச் சொல்ல’ என இயல்பாக வெளிப்படுத்தப்பட்டது.
- source_word: אֶל כָּל אִישׁ יִשְׂרָאֵל
  choice: இஸ்ரவேலின் ஒவ்வொரு மனிதனிடமும்
  rationale: אִישׁ என்பது ஆண்பால் ஒருமையான ‘மனிதன்/ஆண்’; இங்கு பிரதிநிதித்துவக் கூட்டுப்பொருளில் வருகிறது. மூலத்தின் ஆண்பால் ஒருமை வடிவத்தை மறைக்காமல் தமிழில் தெளிவாகக் கொடுக்கப்பட்டது.
- source_word: קוֹל רָם
  choice: உரத்த குரலில்
  rationale: பொதுவாக அனைவரும் கேட்கும்படி செய்யப்படும் பிரகடனத்தைக் குறிக்கும் இயல்பான எபிரெயச் சொற்றொடர்; ‘உரத்த குரலில்’ என்பது நவீனத் தமிழில் தெளிவும் கண்ணியமும் உடைய இணைச்சொல்.
theological_decisions:
- issue: אִישׁ என்பதிலுள்ள ஆண்பால் பிரதிநிதித்துவ மொழி
  choice: இஸ்ரவேலின் ஒவ்வொரு மனிதனிடமும்
  alternative: ஒவ்வொரு இஸ்ரவேலரிடமும்
  rationale: எபிரெயில் ஆண்பால் ஒருமையான אִישׁ கூட்டத்தைப் பிரதிநிதித்துவப்படுத்தும் வலிமையுடன் உள்ளது. பாலினச் சுட்டலை முற்றிலும் சமப்படுத்தாமல் மூல வடிவத்தை முதன்மை உரையில் காக்கவும், இயல்பான மாற்றை அடிக்குறிப்பில் தரவும் இந்த வாசகம் தேர்ந்தெடுக்கப்பட்டது.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுமக்கள் புரிந்துகொள்ளும் கண்ணியமான வேதாகம நடை. வசனம் அடுத்துவரும் பிரகடனத்தை அறிமுகப்படுத்துவதால் இறுதியில் முக்காற்புள்ளி பயன்படுத்தப்பட்டுள்ளது.
