  text: וַ/יְצַ֤ו מֹשֶׁה֙ וְ/זִקְנֵ֣י יִשְׂרָאֵ֔ל אֶת הָ/עָ֖ם לֵ/אמֹ֑ר שָׁמֹר֙ אֶת כָּל הַ/מִּצְוָ֔ה אֲשֶׁ֧ר אָנֹכִ֛י מְצַוֶּ֥ה אֶתְ/כֶ֖ם הַ/יּֽוֹם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/001.yaml
  text: Then Moses and the elders of Israel commanded the people[a], saying, “Keep all the commandment that I am commanding you today.”
translation:
  language: ta
  text: 'மோசேயும் இஸ்ரவேலின் மூப்பர்களும் மக்களுக்குக் கட்டளையிட்டுக் கூறினார்கள்: “இன்று நான் உங்களுக்குக் கட்டளையிடும் கட்டளை முழுவதையும் கடைப்பிடியுங்கள்.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “முழுக் கட்டளையையும்”; எபிரெயத்தில் ‘கட்டளை’ என்பது ஒருமையில் வந்து, கூட்டுப்பொருளில் பயன்படுத்தப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו
  choice: கட்டளையிட்டுச் சொன்னது
  rationale: צוה அதிகாரபூர்வமாகக் கட்டளையிடுவதைக் குறிக்கிறது. அடுத்து வரும் לֵאמֹר என்பதையும் இயல்பான தமிழில் இணைத்துக் காட்ட இந்த வடிவம் பயன்படுத்தப்பட்டது.
- source_word: וְזִקְנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் மூப்பர்களும்
  rationale: எபிரெய உரை மோசேயையும் மூப்பர்களையும் வினையின் இணை எழுவாய்களாகக் காட்டுகிறது; ‘உடன்’ என்று மாற்றாமல் ‘-உம்’ இணைப்பு இதைப் பேணுகிறது.
- source_word: הָעָם
  choice: மக்களுக்கு
  rationale: உடன்படிக்கைச் சூழலில் עָם என்பது பொதுவாக மக்களைக் குறிக்கிறது; தமிழில் வேற்றுமை உருபுடன் இயல்பாக வழங்கப்பட்டது.
- source_word: לֵאמֹר
  choice: சொன்னது
  rationale: மேற்கோளை அறிமுகப்படுத்தும் எபிரெய வடிவம். கூட்டு எழுவாயைத் தொடர்ந்து வரும் ஒருமை வினைமுற்று, இரு தரப்பும் ஒன்றிணைந்து பிறப்பித்த கட்டளையை இயல்பான தமிழில் உணர்த்துகிறது.
- source_word: שָׁמֹר
  choice: கடைப்பிடியுங்கள்
  rationale: கட்டளைச் சூழலில் שׁמר என்பது கவனமாகப் பேணி கீழ்ப்படிவதைக் குறிக்கிறது; ‘கடைப்பிடியுங்கள்’ நவீனத் தமிழில் தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: כָּל הַמִּצְוָה
  choice: இந்தக் கட்டளை முழுவதையும்
  rationale: மூலத்தில் மִצְוָה ஒருமையில் உள்ளது. ‘கட்டளைகள் அனைத்தையும்’ என்று பன்மையாக்காமல், כָּל + ஒருமையின் முழுமை உணர்வை இயல்பான தமிழில் பேணுகிறது.
- source_word: אֲשֶׁר אָנֹכִי מְצַוֶּה אֶתְכֶם
  choice: நான் உங்களுக்குக் கட்டளையிடும்
  rationale: மְצַוֶּה என்னும் பங்கேற்பு வடிவத்தின் நிகழ்கால அல்லது உடனடி நிகழ்வு உணர்வைத் தமிழ் தொடர்பெச்ச வடிவம் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: הַיּוֹם
  choice: இன்று
  rationale: கால வலியுறுத்தலை நவீனத் தமிழில் நேரடியாகவும் தெளிவாகவும் வழங்குகிறது.
theological_decisions:
- issue: உடன்படிக்கை அறிவுறுத்தலில் מִצְוָה என்பதன் எண்
  choice: 'ஒருமைக் கூட்டுப்பொருள்: ‘இந்தக் கட்டளை முழுவதையும்’'
  alternative: பன்மையாக ‘கட்டளைகள் அனைத்தையும்’
  rationale: எபிரெயப் பெயர்ச்சொல் ஒருமையில் உள்ளது. ஒருமையைத் தக்கவைத்தல், உபாகமத்தில் உடன்படிக்கையின் மொத்தக் கடப்பாட்டை ஒரே ‘கட்டளை’ எனக் குறிப்பிடும் மொழிநடையைப் பேணுகிறது; பன்மையைத் தேவையின்றி இறக்குமதி செய்வதையும் தவிர்க்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்கு விளங்கும் மரியாதையான வேதாகம நடை. மூலத்தின் இணை எழுவாயும், ‘கட்டளை’ என்ற ஒருமைக் கூட்டுப்பொருளும் பேணப்பட்டுள்ளன.
