source:
  edition: WLC
  text: אָר֗וּר שֹׁכֵב֙ עִם אֲחֹת֔/וֹ בַּת אָבִ֖י/ו א֣וֹ בַת אִמּ֑/וֹ וְ/אָמַ֥ר כָּל הָ/עָ֖ם אָמֵֽן־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/022.yaml
  text: Cursed is the one who lies with his sister[a], the daughter of his father or the daughter of his mother. And all the people shall say, “Amen.”
translation:
  language: ta
  text: தன் தந்தையின் மகளாகவோ தன் தாயின் மகளாகவோ இருக்கும் தன் சகோதரியுடன் உடலுறவு கொள்கிறவன் சபிக்கப்பட்டவன். மக்கள் அனைவரும், “ஆமென்” என்று சொல்ல வேண்டும்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אָרוּר
  choice: சபிக்கப்பட்டவன்
  rationale: உடன்படிக்கைச் சாபத்தை அறிவிக்கும் எபிரெயப் பெயரடைச் சூத்திரத்தின் வலிமையை இயல்பான நவீனத் தமிழில் காக்கிறது.
- source_word: שֹׁכֵב עִם
  choice: உடலுறவு கொள்கிறவன்
  rationale: இச்சூழலில் இந்த எபிரெய மரபுத்தொடர் பாலுறவைக் குறிக்கிறது; சொற்படியான ‘படுத்துக்கொள்கிறவன்’ தமிழில் தெளிவற்றதாக இருப்பதால் பொருளை நேரடியாகத் தருகிறது.
- source_word: אֲחֹתוֹ
  choice: தன் சகோதரியோடு
  rationale: மூன்றாம் நபர் ஆண்பால் ஒருமை உடைமைப் பின்னொட்டுடன் வரும் நேரடியான உறவுமுறைச் சொல்லைத் துல்லியமாக வழங்குகிறது.
- source_word: בַּת אָבִיו
  choice: தன் தந்தையின் மகளோடு
  rationale: ‘சகோதரி’ என்பதற்கான தந்தைவழி உறவைக் குறிப்பிடும் சட்டரீதியான இணைவிளக்கத்தை எபிரெய அமைப்புக்கு நெருக்கமாகக் காக்கிறது.
- source_word: אוֹ
  choice: அல்லது
  rationale: தந்தைவழி அல்லது தாய்வழி உறவு என்ற மாற்றைச் சுட்டும் எளிய பிரிப்பிடைச்சொல்.
- source_word: בַת אִמּוֹ
  choice: தன் தாயின் மகளோடு
  rationale: தாய்வழி உறவைக் குறிப்பிடும் இணையான சட்ட வடிவத்தை வெளிப்படையாகக் காக்கிறது.
- source_word: וְאָמַר
  choice: என்று சொல்ல வேண்டும்
  rationale: சாபப் பட்டியலின் வழிபாட்டு முறையில் விதிக்கப்பட்ட மக்கள் மறுமொழியை இயல்பான தமிழில் கட்டளையுணர்வுடன் வழங்குகிறது.
- source_word: כָּל הָעָם
  choice: மக்கள் அனைவரும்
  rationale: ‘எல்லா மக்களும்’ என்ற பொருளைச் சேர்த்தல் அல்லது குறைத்தல் இன்றி இயல்பான தமிழ் சொல்வரிசையில் தருகிறது.
- source_word: אָמֵן
  choice: ஆமென்
  rationale: எபிரெய வழிபாட்டு உறுதிமொழியின் தமிழில் நிலைபெற்ற ஒலிபெயர்ப்பைத் தக்கவைக்கிறது.
theological_decisions:
- issue: தகாத குடும்பப் பாலுறவுத் தடையின் வரம்பும் வடிவமும்
  choice: சகோதரி என்பதைத் தந்தையின் மகள் அல்லது தாயின் மகள் என வசனம் விளக்கும் வடிவத்திலேயே மொழிபெயர்த்தல்
  alternative: இதை ஒன்றுவிட்ட சகோதரிக்கு மட்டும் வரையறுத்தல் அல்லது பொதுவாக நெருங்கிய பெண் உறவினர் என விரிவாக்குதல்
  rationale: எபிரெய உரை தந்தைவழி அல்லது தாய்வழி வம்ச உறவை வெளிப்படையாகக் குறிப்பிடுகிறது; மொழிபெயர்ப்பு முழுச் சகோதரி/ஒன்றுவிட்ட சகோதரி என்ற வரம்பைத் தனியாகத் தீர்மானிக்காமல் உரையின் சட்ட வடிவத்தைக் காக்கிறது.
- issue: சட்டச் சூத்திரத்தில் ஆண்பால் ஒருமை நபர்
  choice: ‘உடலுறவு கொள்கிறவன்’ மற்றும் ‘தன் சகோதரி’ என மூலத்தின் ஆண்பால் ஒருமை வடிவத்தைப் பேணுதல்
  alternative: பாலினப் பொதுமைப்படுத்தப்பட்ட ‘ஒருவர்’ என்ற வடிவம்
  rationale: எபிரெயப் பங்கேற்புப் பெயரும் உடைமைப் பின்னொட்டுகளும் ஆண்பால் ஒருமையில் உள்ளன; தமிழ் வடிவம் இதைத் தெளிவாகவும் இயல்பாகவும் பிரதிபலிக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; சட்ட மற்றும் வழிபாட்டு சூழலுக்கேற்ற கண்ணியமான, தெளிவான நடை. ‘படுத்துக்கொள்ளுதல்’ என்ற தெளிவற்ற சொற்படியான வடிவத்திற்குப் பதிலாக ‘உடலுறவு கொள்ளுதல்’ பயன்படுத்தப்பட்டது. எபிரெய உரையில் ‘சகோதரி’ என்பதற்குப் பின் வரும் பெற்றோர்வழி விளக்கம் முதன்மை உரையிலேயே பாதுகாக்கப்பட்டதால் அடிக்குறிப்பு தேவையில்லை.
