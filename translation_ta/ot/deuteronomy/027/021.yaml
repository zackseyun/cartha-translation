source:
  edition: WLC
  text: אָר֕וּר שֹׁכֵ֖ב עִם כָּל בְּהֵמָ֑ה וְ/אָמַ֥ר כָּל הָ/עָ֖ם אָמֵֽן־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/021.yaml
  text: Cursed is he who lies with any animal. And all the people shall say[a], ‘Amen.’
translation:
  language: ta
  text: 'எந்த விலங்குடனும் உடலுறவு கொள்கிறவன்[a] சபிக்கப்பட்டவன். மக்கள் அனைவரும், “ஆமென்” என்று சொல்ல வேண்டும்.


    [a] அல்லது, “எந்த விலங்குடனும் உடலுறவு கொள்பவர்.” எபிரெய மொழியில் ஆண்பால் ஒருமை வடிவம் பயன்படுத்தப்பட்டுள்ளது.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எந்த விலங்குடனும் உடலுறவு கொள்பவர்.” எபிரெய மொழியில் ஆண்பால் ஒருமை வடிவம் பயன்படுத்தப்பட்டுள்ளது.
    reason: ஆண்பால் ஒருமை வடிவத்தையும் சட்டவாக்கியத்தின் பொதுப்படையான பயன்பாட்டையும் சுட்டுகிறது.
lexical_decisions:
- source_word: אָרוּר
  choice: சபிக்கப்பட்டவன்
  rationale: உடன்படிக்கைச் சாபத்தை அறிவிக்கும் பயனிலைச் சொல்லின் கடுமையையும் அறிவிப்புத் தன்மையையும் இயல்பான நவீனத் தமிழில் காக்கிறது.
- source_word: שֹׁכֵב
  choice: படுக்கிறவன்
  rationale: சட்டச் சூழலில் பாலுறவைக் குறிக்கும் எபிரெய மறைமுகச் சொல்லாட்சியை, தேவையின்றி வெளிப்படையாக்காமல் தமிழிலும் காக்கிறது; ஆண்பால் ஒருமை வடிவத்தையும் பிரதிபலிக்கிறது.
- source_word: עִם
  choice: உடன்
  rationale: ‘ஒருவருடன் படுத்தல்’ என்ற சொற்றொடரில் உறவைக் குறிக்கும் இயல்பான தமிழ் உருபாக இணைக்கப்பட்டுள்ளது.
- source_word: כָּל
  choice: எந்த … ஆவது
  rationale: ஒருமை பெயர்ச்சொல்லுடன் வரும் பகிர்வு சார்ந்த பொருளைத் தமிழ் சட்டநடைச் சொல்லாட்சியில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: בְּהֵמָה
  choice: விலங்கு
  rationale: குறிப்பிட்ட கால்நடை வகைக்குள் சுருக்காமல், இச்சூழலில் நோக்கப்படும் பரந்த உயிரின வகையை நவீனத் தமிழில் தெளிவாகக் குறிக்கிறது.
- source_word: וְאָמַר
  choice: சொல்ல வேண்டும்
  rationale: உடன்படிக்கைச் சடங்கில் மக்கள் அளிக்க வேண்டிய கட்டாயமான பதிலை நவீன, கண்ணியமான தமிழில் வெளிப்படுத்துகிறது.
- source_word: כָּל הָעָם
  choice: மக்கள் அனைவரும்
  rationale: ‘மக்கள் எல்லாரும்’ என்ற எபிரெய சொற்றொடரைச் சூழலிலிருந்து கூடுதல் அடையாளத்தைச் சேர்க்காமல் நேரடியாக மொழிபெயர்க்கிறது.
- source_word: אָמֵן
  choice: ஆமென்
  rationale: உடன்படிக்கைச் சடங்கின் ஏற்றுக்கொள்ளும் பதிலை அதன் பரவலாக அறியப்பட்ட வழிபாட்டு வடிவிலேயே காக்கிறது.
theological_decisions:
- issue: சட்டச் சாபச் சூத்திரத்தில் ஆண்பால் ஒருமை வினையெச்சம்
  choice: படுக்கிறவன்
  alternative: படுப்பவர்
  rationale: எபிரெயச் சொல் ஆண்பால் ஒருமையில் இருப்பதால் அதை முதன்மை உரையில் காக்கிறது. அதே நேரத்தில், சட்டவாக்கியத்தைப் பொதுப்படையாகப் புரிந்துகொள்ளும் வாய்ப்பை அடிக்குறிப்பு மாற்று மொழிபெயர்ப்பாகப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன, தெளிவான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. பாலுறவைக் குறிக்கும் மூலத்தின் மறைமுகச் சொல்லாட்சி ‘படுக்கிறவன்’ என்பதன் மூலம் காக்கப்பட்டுள்ளது; சாப அறிவிப்பின் சடங்கு சார்ந்த தீவிரமும் ‘ஆமென்’ என்ற பதிலும் நேரடியாகப் பாதுகாக்கப்பட்டுள்ளன.
