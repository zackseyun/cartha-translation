  text: וְ/הָיָ֗ה בַּ/יּוֹם֮ אֲשֶׁ֣ר תַּעַבְר֣וּ אֶת הַ/יַּרְדֵּן֒ אֶל הָ/אָ֕רֶץ אֲשֶׁר יְהוָ֥ה אֱלֹהֶ֖י/ךָ נֹתֵ֣ן לָ֑/ךְ וַ/הֲקֵמֹתָ֤ לְ/ךָ֙ אֲבָנִ֣ים גְּדֹל֔וֹת וְ/שַׂדְתָּ֥ אֹתָ֖/ם בַּ/שִּֽׂיד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/002.yaml
  text: And on the day when you cross over the Jordan into the land that Yahweh your God is giving you[a], you shall set up for yourself large stones and plaster them with lime.
translation:
  language: ta
  text: நீங்கள் யோர்தானைக் கடந்து, உங்கள் கடவுளாகிய யாவே உங்களுக்குக் கொடுக்கிற நாட்டிற்குள் செல்லும் நாளில், உங்களுக்காகப் பெரிய கற்களை நிறுத்தி, அவற்றின்மேல் சுண்ணாம்புப் பூச வேண்டும்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “சுண்ணாம்புச் சாந்தால் பூச வேண்டும்” என்றும் மொழிபெயர்க்கலாம்; எபிரேயச் சொல் பூச்சாகப் பயன்படுத்தப்படும் சுண்ணாம்பையோ சாந்தையோ குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה בַּיּוֹם אֲשֶׁר
  choice: செல்லும் நாளில்
  rationale: எதிர்காலச் சூழலை அறிமுகப்படுத்தும் எபிரேய மரபுத்தொடரை, இயல்பான நவீனத் தமிழில் காலச் சார்புத்தொடராக வழங்குகிறது.
- source_word: תַּעַבְרוּ אֶת הַיַּרְדֵּן
  choice: நீங்கள் யோர்தானைக் கடந்து
  rationale: עבר என்ற வினையின் ஆற்றைக் கடக்கும் பொருளையும், யோர்தான் என்ற இடப்பெயரையும் தெளிவாகப் பாதுகாக்கிறது.
- source_word: הָאָרֶץ
  choice: நாடு
  rationale: இங்கு இஸ்ரவேலருக்குக் கொடுக்கப்படும் நிலப்பரப்பைக் குறிக்கிறது; நவீனத் தமிழில் ‘நாடு’ இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைப்பெயரான நான்கெழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: נֹתֵן לָךְ
  choice: உங்களுக்குக் கொடுக்கிற
  rationale: எபிரேய நிகழ்காலப் பங்கேற்பு வடிவின் நடைபெறும் அல்லது உறுதியான கொடை என்ற நுணுக்கத்தைப் பாதுகாக்கிறது.
- source_word: וַהֲקֵמֹתָ לְךָ
  choice: உங்களுக்காகப் ... நாட்டி
  rationale: கற்களை நிலைநிறுத்துதல் என்ற causative பொருளை ‘நாட்டி’ இயல்பாகத் தருகிறது. எபிரேய வடிவம் இலக்கணத்தில் ஒருமையாக இருந்தாலும், மோசே இஸ்ரவேல் மக்களை ஒருங்கிணைந்த சமூகமாக நோக்கிப் பேசுவதால் தமிழில் மரியாதை/கூட்டுப் பன்மை பயன்படுத்தப்பட்டுள்ளது.
- source_word: אֲבָנִים גְּדֹלוֹת
  choice: பெரிய கற்கள்
  rationale: அளவைக் குறிக்கும் நேரடியானதும் இயல்பானதுமான தமிழ் மொழிபெயர்ப்பு.
- source_word: וְשַׂדְתָּ אֹתָם בַּשִּׂיד
  choice: அவற்றுக்குச் சுண்ணாம்புப் பூச வேண்டும்
  rationale: கற்களின் மேல் שִׂיד என்னும் சுண்ணாம்பு அல்லது சாந்துப் பொருளைப் பூசும் செயலை இயல்பான தமிழில் தெரிவிக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலத்தில் தனிப்பட்ட உடன்படிக்கைப் பெயர் நேரடியாக இருப்பதால், அதை பொதுப் பட்டமாக மாற்றாமல் ஒலிபெயர்க்கிறது.
- issue: לְךָ என்ற ஒருமை வடிவமும் உரையாடப்படும் சமூகமும்
  choice: உங்களுக்காக
  alternative: உனக்காக
  rationale: எபிரேயத்தில் இலக்கண ஒருமை இஸ்ரவேலை ஒருங்கிணைந்த மக்களாகக் குறிக்கிறது. தமிழில் வசனத்தின் ‘நீங்கள்’ என்ற சமூக நோக்கைத் தொடர்ந்து பன்மையைப் பயன்படுத்துவது இயல்பானது; ஒருங்கிணைந்த ஒருமையின் நுணுக்கம் விளக்கத்தில் பதிவு செய்யப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; சாதாரண வாசகர்களுக்குப் புரியும் வகையில் இயல்பான, கண்ணியமான நடை. ‘யாவே’ என்பது இறைப்பெயரின் நேரடி ஒலிபெயர்ப்பு. கட்டளையின் வலிமையை ‘வேண்டும்’ வெளிப்படுத்துகிறது.
