  source_fidelity: மூல எபிரெயத்தின் கட்டளையியல் வினைத் தொடரும், குறிப்பிட்ட கற்களின்மேல் எழுதப்பட வேண்டிய பொருளும், “இந்தச் சட்டத்தின் வார்த்தைகள் அனைத்தும்” என்பதும், בַּאֵר הֵיטֵב-இன் வலியுறுத்தப்பட்ட தெளிவுத் தன்மையும் துல்லியமாகப் பிரதிபலிக்கப்படுகின்றன. “அந்தக் கற்கள்” என்பது முந்தைய சூழலில் சுட்டப்பட்ட கற்களைக் குறிக்கும் இயல்பான தமிழ் வெளிப்பாடு; இவ்வசனத்தில் புதிதாக வேறு பொருளைச் சேர்ப்பதில்லை.
  naturalness: “அந்தக் கற்களின்மேல் இந்தச் சட்டத்தின் வார்த்தைகள் அனைத்தையும் மிகத் தெளிவாக நீ எழுத வேண்டும்” என்பது நவீன நிலையான தமிழில் தெளிவான, கண்ணியமான கட்டளைநடை. இரண்டாம் நபர் ஒருமை “நீ” மூலத்தின் முகவரியைப் பாதுகாக்கிறது.
