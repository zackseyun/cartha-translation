translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்கள் புரிந்துகொள்ளக்கூடிய கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. எபிரெய மூலத்தின் இரண்டாம் நபர் ஒருமை முகவரி “நீ” என்பதால் வெளிப்படையாக வைக்கப்பட்டுள்ளது; “மிகத் தெளிவாக” என்பதிலுள்ள பொருள் நுணுக்கம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
