source:
  edition: WLC
  text: וְ/כָתַבְתָּ֣ עַל הָ/אֲבָנִ֗ים אֶֽת כָּל דִּבְרֵ֛י הַ/תּוֹרָ֥ה הַ/זֹּ֖את בַּאֵ֥ר הֵיטֵֽב־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/008.yaml
  text: And you shall write on the stones all the words of this law very clearly[a].
translation:
  language: ta
  text: அந்தக் கற்களின்மேல் இந்தச் சட்டத்தின் வார்த்தைகள் அனைத்தையும் மிகத் தெளிவாக[a] நீ எழுத வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “தெளிவாக” அல்லது “அவற்றைத் தெளிவாகப் புரிந்துகொள்ளும் வகையில்” என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொற்றொடரில் ‘தெளிவாக்கு/விளக்கு’ என்று பொருள்படும் ஒரு வினைச்சொல்லுடன் அதை வலியுறுத்தும் சொல் இணைந்துள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָתַבְתָּ
  choice: நீ எழுத வேண்டும்
  rationale: இணைப்பிடைச்சொல்லுடன் வரும் கால் வினையின் இரண்டாம் நபர் ஆண்பால் ஒருமை வடிவம், இக்கட்டளைத் தொடரில் கட்டளைக்குரிய வலிமையைக் கொண்டுள்ளது. “நீ எழுத வேண்டும்” என்பது ஒருமை முன்னிலையை வெளிப்படையாகக் காத்து, நவீனத் தமிழில் இயல்பாக உள்ளது.
- source_word: עַל הָאֲבָנִים
  choice: அந்தக் கற்களின்மேல்
  rationale: עַל என்பது ‘மேல்’ எனப் பொருள்படும்; குறிப்பிட்ட சுட்டுக் கற்கள் முன்சூழலில் ஏற்கெனவே சொல்லப்பட்டிருப்பதால், தமிழில் “அந்தக் கற்கள்” என்பது அதன் வரையறுத்த தன்மையை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: אֵת כָּל דִּבְרֵי
  choice: வார்த்தைகள் அனைத்தையும்
  rationale: כָּל דִּבְרֵי என்பதன் வடிவமைப்பை “வார்த்தைகள் அனைத்தும்” என நெருக்கமாகக் காக்கிறது; אֵת குறிக்கும் நேரடிச் செயப்படுபொருள் தமிழில் “-ஐ” உருபால் வெளிப்படுகிறது.
- source_word: הַתּוֹרָה הַזֹּאת
  choice: இந்தச் சட்டத்தின்
  rationale: תּוֹרָה என்பதற்கு ‘போதனை’ என்ற விரிந்த பொருள் இருக்கலாம்; ஆனால் உபாகமத்தின் உடன்படிக்கை மற்றும் சட்டச் சூழலில் “சட்டம்” இயல்பான இணைச்சொல். הַזֹּאת என்பதன் சுட்டுப்பொருள் “இந்த” எனக் காக்கப்படுகிறது.
- source_word: בַּאֵר הֵיטֵב
  choice: மிகத் தெளிவாக
  rationale: באר என்பதன் தெளிவாக்குதல் அல்லது விளங்கச்செய்தல் என்ற கருத்தையும், הֵיטֵב தரும் வலியுறுத்தலையும் சேர்த்து “மிகத் தெளிவாக” வெளிப்படுத்துகிறது. கற்களில் எழுதும் சூழலில், எழுத்து தெளிவாக அமைக்கப்பட வேண்டும் என்ற முறையைக் குறிக்கிறது.
