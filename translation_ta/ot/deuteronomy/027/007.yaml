  text: וְ/זָבַחְתָּ֥ שְׁלָמִ֖ים וְ/אָכַ֣לְתָּ שָּׁ֑ם וְ/שָׂ֣מַחְתָּ֔ לִ/פְנֵ֖י יְהוָ֥ה אֱלֹהֶֽי/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/007.yaml
  text: And you shall sacrifice peace offerings[a], and you shall eat there, and you shall rejoice before Yahweh your God.
translation:
  language: ta
  text: நீ சமாதானப் பலிகளை[a]ச் செலுத்துவாயாக; அங்கே உண்பாயாக; உன் கடவுளான யாவேவின் முன்னிலையில் மகிழ்வாயாக.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘உறவுப் பலிகள்’ அல்லது ‘நல்வாழ்வுப் பலிகள்’.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזָבַחְתָּ
  choice: செலுத்தி
  rationale: பலியிடும் சூழலில் זבח என்பது பலியைச் செலுத்துவதைக் குறிக்கிறது. ‘பலிகளைச் செலுத்தி’ என்பது இயல்பான, மரியாதையான நவீனத் தமிழ் வழக்கு.
- source_word: שְׁלָמִים
  choice: சமாதானப் பலிகள்
  rationale: இது பகிர்ந்து உண்ணப்படும் பலிவிருந்துடனும் நலன், சமாதானம், உறவு ஆகிய கருத்துகளுடனும் தொடர்புடைய ஒரு குறிப்பிட்ட பலிவகையைக் குறிக்கிறது. தமிழில் அறியப்பட்ட சொல்லாக இருப்பதால் முதன்மை உரையில் இதுவே பயன்படுத்தப்பட்டது; பிற சாத்தியங்கள் அடிக்குறிப்பில் தரப்பட்டுள்ளன.
- source_word: וְאָכַלְתָּ שָּׁם
  choice: அங்கே உண்டு
  rationale: אָכַל என்பதன் நேரடிப் பொருள் ‘உண்’; שָׁם இடத்தைச் சுட்டும் ‘அங்கே’. எபிரெய வினைத்தொடரின் ஓட்டத்தைத் தமிழில் இயல்பாகப் பேணுகிறது.
- source_word: וְשָׂמַחְתָּ
  choice: மகிழ்வாயாக
  rationale: שׂמח வழிபாட்டு மற்றும் உடன்படிக்கைச் சூழலில் கொண்டாட்டத்துடன் மகிழ்வதைக் குறிக்கிறது. ‘மகிழ்வாயாக’ அறிவுறுத்தல் தன்மையையும் விழாக்காலத் தொனியையும் பேணுகிறது.
- source_word: לִפְנֵי
  choice: முன்பாக
  rationale: வழிபாட்டுச் சூழலில் கடவுளின் சந்நிதியில் இருப்பதைக் குறிக்கும் எளிய, நேரடியான இணைச்சொல்.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய உரையிலுள்ள இறைப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் இயல்பான ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: אֱלֹהֶיךָ
  choice: உன் கடவுளாகிய
  rationale: எபிரெய மொழியிலுள்ள இரண்டாம் நபர் ஒருமை உடைமை விகுதியைத் தெளிவாகப் பேணி, ‘யாவே’யுடன் இயல்பாக இணைக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: யெகோவா
  rationale: மூல உரை இறைவனின் தனிப்பட்ட உடன்படிக்கைப் பெயரை நேரடியாகப் பயன்படுத்துகிறது. அதை ‘ஆண்டவர்’ போன்ற பட்டமாக மாற்றாமல் ஒலிபெயர்ப்பது மூலத்தின் வேறுபாட்டைப் பேணுகிறது; ‘யாவே’ என்பது ஏற்றுக்கொள்ளப்பட்ட நவீன ஒலிபெயர்ப்பு.
- issue: שְׁלָמִים என்ற பலிவகையை மொழிபெயர்த்தல்
  choice: சமாதானப் பலிகள்
  alternative: ஐக்கியப் பலிகள்; நல்வாழ்வுப் பலிகள்
  rationale: இச்சொல் உள்ளார்ந்த அமைதியைப் பற்றிய தனிக் கூற்றல்ல; பகிர்ந்து உண்ணும் விருந்துடன் தொடர்புடைய ஒரு பலிவகையின் பெயர். பரவலாக அறியப்பட்ட ‘சமாதானப் பலிகள்’ முதன்மை உரையில் வைக்கப்பட்டு, சொல்லின் உறவு மற்றும் நல்வாழ்வு நிழற்பொருள்கள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளன.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையும் வழிபாட்டுத் தொனியும் கொண்ட எளிய நடை பயன்படுத்தப்பட்டுள்ளது. ஒருமையில் இஸ்ரவேலரிடம் உரையாடும் எபிரெய வடிவம் ‘நீ’, ‘உன்’ என்பவற்றால் பேணப்பட்டுள்ளது; தொடர்ச்சியான வினைகள் தமிழில் இயல்பான வினையெச்சங்களாக அமைக்கப்பட்டு, இறுதி அறிவுறுத்தல் ‘மகிழ்வாயாக’ எனத் தரப்பட்டுள்ளது.
