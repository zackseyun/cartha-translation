source:
  edition: WLC
  text: אָר֕וּר מַכֵּ֥ה רֵעֵ֖/הוּ בַּ/סָּ֑תֶר וְ/אָמַ֥ר כָּל הָ/עָ֖ם אָמֵֽן־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/024.yaml
  text: Cursed is the one who strikes down his neighbor in secret. And all the people shall say[a], “Amen.”
translation:
  language: ta
  text: “மறைவாகத் தன் அயலானைத் தாக்குகிறவன் சபிக்கப்பட்டவன்.” அதற்கு மக்கள் அனைவரும்[a], “ஆமென்” என்று சொல்ல வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “தாக்குகிறவன்” என்பதற்கு “அடிக்கிறவன்” அல்லது “கொல்கிறவன்” என்றும் மொழிபெயர்க்கலாம்; எபிரெய வினைச்சொல் அடிப்பது முதல் உயிரைப் பறிக்கும் வன்முறை வரை பல பொருள்களைக் குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָרוּר
  choice: சபிக்கப்பட்டவன்
  rationale: உடன்படிக்கைச் சாபத்தை அறிவிக்கும் செயல்பாட்டைக் கொண்ட பெயரெச்ச வடிவம். நவீனத் தமிழில் தெளிவாகவும் வழிபாட்டுச் சூழலுக்கு ஏற்றவாறும் உள்ளது.
- source_word: מַכֵּה
  choice: தாக்கி வீழ்த்துகிறவன்
  rationale: נכה என்பது அடிப்பது முதல் உயிரைப் பறிக்கும் வன்முறை வரை குறிக்கக்கூடும். ‘தாக்கி வீழ்த்துகிறவன்’ செயலின் கடுமையை வெளிப்படுத்துகிறது; ஆனால் அதைத் திட்டவட்டமாகக் கொலை என்று மட்டும் வரையறுக்கவில்லை.
- source_word: רֵעֵהוּ
  choice: தன் அயலானை
  rationale: சமூகத்தில் ஒருவரோடு தொடர்புடைய சக மனிதனை רֵעַ குறிக்கிறது. ‘தன் அயலான்’ என்பது இயல்பானதும் வேதாகமப் பயன்பாட்டில் அறிமுகமானதும் ஆகும்.
- source_word: בַּסָּתֶר
  choice: மறைவாக
  rationale: பிறர் பார்வையிலிருந்து மறைக்கப்பட்ட விதத்தில் செயல் நடப்பதை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: וְאָמַר
  choice: அப்போது ... சொல்ல வேண்டும்
  rationale: இந்தச் சடங்குமுறைத் தொடரில் வாவ் + நிறைவுவினை வடிவம் மக்களின் நிர்ணயிக்கப்பட்ட பதிலைச் சுட்டுகிறது. தமிழில் ‘சொல்ல வேண்டும்’ அதன் நடைமுறை சார்ந்த கட்டாயத்தைக் காட்டுகிறது.
- source_word: כָּל הָעָם
  choice: மக்கள் அனைவரும்
  rationale: எபிரெய உரையில் உள்ள ‘எல்லா மக்களும்’ என்பதையே இயல்பான தமிழ் சொல் வரிசையில் தருகிறது; உரையில் இல்லாத ‘இஸ்ரவேலர்’ என்பதைச் சேர்க்கவில்லை.
- source_word: אָמֵן
  choice: ஆமென்
  rationale: உடன்படிக்கை அறிவிப்பை ஏற்றுக்கொள்ளும் வழிபாட்டு மறுமொழியாகத் தமிழில் நிலைபெற்ற ஒலிபெயர்ப்பு.
theological_decisions:
- issue: מַכֵּה என்பதில் வன்முறையின் அளவு
  choice: ‘தாக்கி வீழ்த்துகிறவன்’ என்று மொழிபெயர்க்கப்பட்டது.
  alternative: ‘அடிக்கிறவன்’ அல்லது ‘கொல்கிறவன்’
  rationale: எபிரெய வினைச்சொல் சாதாரண அடியிலிருந்து உயிரைப் பறிக்கும் தாக்குதல் வரை பரந்த பொருளைக் கொண்டுள்ளது. மறைவாகச் செய்யப்படும் செயலும் அடுத்த வசனத்தின் தொடர்பும் கடுமையான வன்முறையைக் காட்டுகின்றன; இருப்பினும் மூலவசனம் இங்கு கொலையை மட்டும் வெளிப்படையாகக் குறிப்பிடாததால் அந்தப் பொருளுக்கு மொழிபெயர்ப்பு குறுக்கப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும் இயல்பான, கண்ணியமான நடை. சாப அறிவிப்பின் சடங்குமுறைத் தொனியைப் பேணுகிறது. அடிக்குறி குறியீடு தொடர்புடைய சொல்லுக்குப் பதிலாக மக்கள் மறுமொழியின் அருகே கொடுக்கப்பட்டுள்ளது; வழங்கப்பட்ட ஆலோசனை உரையின் குறியீட்டு அமைப்பை இதனால் பாதுகாக்கிறது.
