  text: וַ/יְדַבֵּ֤ר מֹשֶׁה֙ וְ/הַ/כֹּהֲנִ֣ים הַ/לְוִיִּ֔ם אֶ֥ל כָּל יִשְׂרָאֵ֖ל לֵ/אמֹ֑ר הַסְכֵּ֤ת וּ/שְׁמַע֙ יִשְׂרָאֵ֔ל הַ/יּ֤וֹם הַ/זֶּה֙ נִהְיֵ֣יתָֽ לְ/עָ֔ם לַ/יהוָ֖ה אֱלֹהֶֽי/ךָ־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/009.yaml
  text: 'Then Moses and the Levitical priests spoke to all Israel[a], saying, “Be silent and listen[b], Israel: today you have become a people for Yahweh your God.”'
translation:
  language: ta
  text: 'பின்பு மோசேயும் லேவிய ஆசாரியர்களும் இஸ்ரவேலர் அனைவரிடமும் இவ்வாறு சொன்னார்கள்: “இஸ்ரவேலே, அமைதியாக இருந்து கேள்![a] இன்று நீ உன் கடவுளாகிய யாவேக்கு உரிய மக்களாக ஆனாய்.[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கவனமாயிருந்து கேள்.” எபிரெயக் கட்டளை அமைதியாக இருப்பதையோ ஒருமுகக் கவனம் செலுத்துவதையோ வலியுறுத்தலாம்.
    reason: lexical_alternative
  - marker: b
    text: இன்னும் சொற்சார்ந்து, “இன்று நீ உன் கடவுளாகிய யாவேக்கு மக்களாக ஆனாய்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: பின்பு ... சொன்னார்கள்
  rationale: வாவ் தொடர்வினை கதைநடையை முன்னெடுத்துச் செல்கிறது. தமிழில் ‘பின்பு’ அந்தத் தொடர்ச்சியை இயல்பாகக் காட்டுகிறது; பன்மை எழுவாயான மோசேயும் ஆசாரியர்களும் என்பதற்கு ஏற்ப வினை பன்மையில் தரப்பட்டுள்ளது.
- source_word: הַכֹּהֲנִים הַלְוִיִּם
  choice: லேவிய ஆசாரியர்கள்
  rationale: ஆசாரியர்கள் லேவியர்களாக அடையாளப்படுத்தப்படும் நெருக்கமான பெயரொட்டுத் தொடர்பை இயல்பான தமிழில் சுருக்கமாகப் பாதுகாக்கிறது.
- source_word: כָּל יִשְׂרָאֵל
  choice: இஸ்ரவேலர் அனைவரும்
  rationale: இஸ்ரவேல் முழுச் சமூகத்தையும் குறிக்கும் கூட்டு அழைப்பைத் தெளிவாகத் தருகிறது.
- source_word: הַסְכֵּת וּשְׁמַע
  choice: அமைதியாக இருந்து கேள்
  rationale: סכת என்பதிலுள்ள அமைதியாகி கவனிக்கும் அழைப்பையும், שמע என்பதிலுள்ள செவிகொடுத்துக் கேட்கும் கட்டளையையும் இயல்பான தமிழில் இணைக்கிறது; ‘கவனமாயிருந்து கேள்’ என்ற சாத்தியமும் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: הַיּוֹם הַזֶּה
  choice: இன்று
  rationale: ‘இந்த நாள்’ என்ற எபிரெயச் சுட்டுத்தொடரின் இயல்பான நவீனத் தமிழ் இணை.
- source_word: נִהְיֵיתָ לְעָם
  choice: மக்களாக ஆனாய்
  rationale: இஸ்ரவேலை ஒரே கூட்டு அலகாக முன்னிறுத்தும் இரண்டாம் நபர் ஒருமையைப் பாதுகாக்கிறது. עם என்பதற்கு அரசியல் நிறமுள்ள ‘தேசம்’ என்பதற்குப் பதிலாக உடன்படிக்கைச் சமூகத்தைக் காட்டும் ‘மக்கள்’ தேர்ந்தெடுக்கப்பட்டுள்ளது.
- source_word: לַיהוָה אֱלֹהֶיךָ
  choice: உன் கடவுளாகிய யாவேக்கு உரிய
  rationale: יהוה என்ற தனிப்பெயர் ‘யாவே’ என ஒலிபெயர்க்கப்பட்டுள்ளது. היה + לְ கட்டமைப்பில் உள்ள உறவையும் உரிமை/சேர்ந்திருத்தல் நுணுக்கத்தையும் ‘உரிய’ இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: ஆண்டவர்; யெகோவா
  rationale: மூலத்தில் நான்கெழுத்து இறைப் பெயர் நேரடியாக உள்ளது. அதை ஒரு பட்டப்பெயராக மாற்றாமல், அதன் பொதுவாக ஏற்றுக்கொள்ளப்படும் ஒலிப்பைத் தமிழில் தருகிறது.
- issue: இஸ்ரவேலுக்கான கூட்டு ஒருமை அழைப்பு
  choice: இஸ்ரவேலே ... கேள் ... நீ ... ஆனாய்
  alternative: இஸ்ரவேலர்களே ... கேளுங்கள் ... நீங்கள் ... ஆனீர்கள்
  rationale: எபிரெய மூலத்தின் இரண்டாம் நபர் ஆண்பால் ஒருமை வடிவங்கள் இஸ்ரவேலை ஒரே உடன்படிக்கைச் சமூகமாக நோக்குகின்றன. தமிழ் ஒருமை வடிவம் அந்தச் சொல்லாட்சியைப் பாதுகாக்கிறது.
- issue: לַיהוָה என்பதிலுள்ள உறவு
  choice: யாவேக்கு உரிய மக்களாக
  alternative: யாவேக்காக ஒரு மக்களாக; யாவேக்கு மக்களாக
  rationale: לְ என்பதன் நோக்கம்/உறவு மற்றும் சேர்ந்திருத்தல் ஆகிய நுணுக்கங்களில், இச்சூழலில் உடன்படிக்கைச் சேர்ந்திருத்தலை ‘உரிய’ தெளிவாக்குகிறது; மேலும் சொற்சார்ந்த மாற்று அடிக்குறிப்பில் தரப்பட்டுள்ளது.
translation_notes:
  register: நவீன செந்தமிழுக்கு அணுக்கமான, பொதுமக்கள் எளிதில் புரிந்துகொள்ளக்கூடிய கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘ஆசாரியர்’ என்பது பரவலாக அறியப்பட்ட வேதாகமச் சொல் என்பதால் வைக்கப்பட்டது. கூட்டு ஒருமை அழைப்பு திட்டமிட்டு நிலைநிறுத்தப்பட்டுள்ளது; அனைத்து அடிக்குறிப்பு குறிகளும் உரையில் உரிய இடங்களில் இடம்பெற்றுள்ளன.
