  text: And on that day Moses commanded the people, saying,
translation:
  language: ta
  text: 'அந்நாளில் மோசே மக்களுக்குக் கட்டளையிட்டு, இவ்வாறு கூறினார்:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְצַו
  choice: கட்டளையிட்டார்
  rationale: צוה என்பது அதிகாரத்துடன் கட்டளையிடுதல் அல்லது பொறுப்பளித்தல் என்பதைக் குறிக்கிறது. ‘கட்டளையிட்டார்’ அதன் அதிகாரத் தன்மையை இயல்பான தமிழில் தெளிவாகப் பாதுகாக்கிறது.
- source_word: מֹשֶׁה
  choice: மோசே
  rationale: משה என்ற பெயருக்கான தமிழ் வேதாகம மரபில் பரவலாக அறியப்பட்ட ஒலிபெயர்ப்பு.
- source_word: אֶת הָעָם
  choice: மக்களுக்கு
  rationale: עָם இங்கு இஸ்ரவேல் மக்களை ஒட்டுமொத்தமாகக் குறிக்கிறது. தமிழ் வாக்கிய அமைப்பில் ‘கட்டளையிட்டார்’ என்பதுடன் ‘மக்களுக்கு’ இயல்பாக அமைகிறது.
- source_word: בַּיּוֹם הַהוּא
  choice: அந்நாளில்
  rationale: בְּ என்ற காலப்பொருள் முன்னொட்டையும் ‘அந்த நாள்’ என்ற குறிப்பையும் சுருக்கமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: לֵאמֹר
  choice: 'கூறியது:'
  rationale: இந்த வடிவம் அடுத்த வசனத்தில் வரும் கட்டளையின் உள்ளடக்கத்தை அறிமுகப்படுத்துகிறது. ‘கூறியது:’ என்பது தமிழ் உரைநடையில் தொடரும் நேரடி உரையை இயல்பாகச் சுட்டுகிறது.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழில், கண்ணியமான வேதாகம உரைநடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய மூலத்தின் காலக் குறிப்பும் கட்டளையின் அதிகாரத் தன்மையும் பாதுகாக்கப்பட்டுள்ளன; அடுத்த வசனத்துடன் தொடர்வதை முக்காற்புள்ளி உணர்த்துகிறது.
