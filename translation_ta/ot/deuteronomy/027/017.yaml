  text: אָר֕וּר מַסִּ֖יג גְּב֣וּל רֵעֵ֑/הוּ וְ/אָמַ֥ר כָּל הָ/עָ֖ם אָמֵֽן־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/017.yaml
  text: Cursed is the one who moves his neighbor’s boundary marker. And all the people shall say[a], “Amen.”
translation:
  language: ta
  text: தன் அயலானின் எல்லைக் குறியை[a] நகர்த்துகிறவன் சபிக்கப்பட்டவன். மக்கள் அனைவரும், “ஆமென்” என்று சொல்ல வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எல்லை.” எபிரெயச் சொல் சொத்து எல்லையையோ அதைச் சுட்டிக்காட்டும் குறியையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָרוּר
  choice: சபிக்கப்பட்டவன்
  rationale: உடன்படிக்கைச் சூழலில் கூறப்படும் முறைப்படியான சாபத் தீர்ப்பின் வலிமையை, இயல்பான நவீனத் தமிழில் இது தக்கவைக்கிறது.
- source_word: מַסִּיג
  choice: நகர்த்துகிறவன்
  rationale: இது அந்தச் செயலைச் செய்கிற ஒருவனைக் குறிக்கும் வினையெச்ச வடிவம். எல்லையை மோசடியாக மாற்றும் சூழலில், அகற்றுவதை மட்டும் அல்லாமல் இடம் மாற்றுவதையும் ‘நகர்த்துகிறவன்’ தெளிவாகக் குறிக்கிறது.
- source_word: גְּבוּל
  choice: எல்லைக் கல்
  rationale: இந்த நிலவுரிமைச் சட்டச் சூழலில், சொத்தின் எல்லையைக் குறிக்கும் அடையாளக் கல்லை இது குறிக்கிறது. ‘எல்லை’ என்பதைவிட ‘எல்லைக் கல்’ செயல் எவ்வாறு நடந்தது என்பதைத் தெளிவுபடுத்துகிறது.
- source_word: רֵעֵהוּ
  choice: தன் அயலானின்
  rationale: சமூகத்திலுள்ள சக மனிதரை அல்லது அயலாரைக் குறிக்கும் சொல்லுக்கு, சட்ட மற்றும் சமூக உறவுச் சூழலில் ‘அயலான்’ இயல்பான இணைச்சொல்; எபிரெயப் பின்னொட்டின் ஒருமை உடைமை உறவும் ‘தன்’ என்பதால் காக்கப்படுகிறது.
- source_word: וְאָמַר
  choice: என்று சொல்ல வேண்டும்
  rationale: மக்கள் அளிக்கும் முறைப்படியான உடன்படிக்கைப் பதிலை நவீனத் தமிழில் கட்டளை/கடமை உணர்வுடன் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: כָּל הָעָם
  choice: மக்கள் அனைவரும்
  rationale: மூலத்தில் உள்ள ‘எல்லா மக்களும்’ என்ற பொருளை, ‘இஸ்ரவேல்’ போன்ற விளக்கச் சேர்க்கையின்றி இயல்பான தமிழில் தருகிறது.
- source_word: אָמֵן
  choice: ஆமென்
  rationale: எபிரெயச் சொல்லின் வழிபாட்டு மற்றும் சமூக உறுதிப்பாட்டு வலிமையைத் தக்கவைக்கும், தமிழில் நிலைபெற்ற வடிவம்.
theological_decisions:
- issue: உடன்படிக்கைச் சட்டச் சூழலிலுள்ள சாப வாய்பாடு
  choice: தன் அயலானின் எல்லைக் கல்லை நகர்த்துகிறவன் சபிக்கப்பட்டவன்
  alternative: தன் அயலானின் எல்லையை மாற்றுகிறவன் சபிக்கப்பட்டவன்
  rationale: இந்த வசனம் நில எல்லையை மோசடியாக மாற்றுகிறவன்மீது முறைப்படியான உடன்படிக்கைச் சாபத்தை அறிவிக்கிறது. ‘எல்லைக் கல்’ பண்டைய நிலவுரிமைச் சூழலைத் தெளிவாக்குகிறது; சாபத்தின் சட்ட மற்றும் சமூக தீவிரத்தையும் மொழிபெயர்ப்பு காக்கிறது.
- issue: ஆண்பால் ஒருமை வினையெச்சத்தின் பிரதிநிதித்துவப் பயன்பாடு
  choice: நகர்த்துகிறவன்
  alternative: நகர்த்துகிறவர் எவரும்
  rationale: எபிரெயத்தில் ஆண்பால் ஒருமை வடிவம் ஒரு பிரதிநிதித்துவ சட்ட வழக்கை முன்வைக்கிறது. தமிழில் ‘-வன்’ அந்த வடிவத்தையும் வசனத்தின் நேரடியான தீர்ப்பு நடையையும் காக்கிறது; பன்மைப்படுத்தவோ பொதுமைப்படுத்தவோ இல்லை.
translation_notes:
  register: நவீன செந்தமிழ் சார்ந்த, எளிதில் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தில் இல்லாத விளக்கங்கள் சேர்க்கப்படவில்லை. ‘எல்லைக் கல்’ என்பது சொத்து எல்லையைக் குறிக்கும் கல்லை நேரடியாகவும் இயல்பாகவும் தெரிவிப்பதால் அடிக்குறிப்பு தேவையில்லை.
