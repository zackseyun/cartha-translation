base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/030/013.yaml
  text: And it is not beyond the sea[a], that you should say, ‘Who will cross over to the other side of the sea for us and get it for us and make us hear it[c][b], so that we may do it?’
translation:
  language: ta
  text: அது கடலுக்கு அப்பாலும்[a] இல்லை; ‘நமக்காகக் கடலைக் கடந்து அதன் மறுபக்கத்திற்குச் சென்று, அதை நமக்காகப் பெற்று வந்து[b], நாம் அதைச் செய்யும்படி நமக்கு அதைக் கேட்கச் செய்வார்[c] யார்?’ என்று நீங்கள் சொல்ல வேண்டியதில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘கடலுக்கு மறுபுறத்தில்’ / ‘கடலின் மறுபக்கத்தில்.’
    reason: lexical_alternative
  - marker: b
    text: எபிரேய வினைச்சொல்லின் நேரடிப் பொருள் ‘எடுத்தல்.’ இச்சூழலில், அதைப் பெற்று நம்மிடம் கொண்டுவருதல் என்பது பொருள்.
    reason: lexical_alternative
  - marker: c
    text: சொல்லர்த்தமாக, ‘நமக்கு அதைக் கேட்கச் செய்வார்.’ இது ஒருவர் கேட்கும்படி அறிவிப்பதையோ விளக்குவதையோ குறிக்கக்கூடிய காரணவினைத் தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵעֵבֶר לַיָּם
  choice: கடலுக்கு அப்பால்
  rationale: இந்த எபிரேயச் சொற்றொடர் கடலின் மறுபக்கத்தில் உள்ள இடத்தைக் குறிக்கிறது. ‘கடலுக்கு அப்பால்’ என்பது இடஞ்சார்ந்த உருவகத்தைத் தக்கவைக்கும் இயல்பான நவீனத் தமிழ்.
- source_word: הִוא
  choice: அது
  rationale: பெண்பால் ஒருமைப் பிரதிப்பெயர் முந்தைய சூழலில் உள்ள ‘கட்டளை’ அல்லது ‘வார்த்தை’ என்பதைக் குறிக்கிறது; தமிழில் பால்வேறுபாடில்லாத ‘அது’ பொருத்தமானது.
- source_word: לֵאמֹר
  choice: என்று நீங்கள் சொல்ல
  rationale: கற்பனையான எதிர்வினையின் உள்ளடக்கத்தை அறிமுகப்படுத்துகிறது. தமிழில் மேற்கோளுடன் ‘என்று நீங்கள் சொல்ல’ என்பது இயல்பான அமைப்பு.
- source_word: יַעֲבָר לָנוּ אֶל עֵבֶר הַיָּם
  choice: நமக்காகக் கடலின் மறுபக்கத்திற்குக் கடந்து சென்று
  rationale: ‘கடத்தல்’ என்ற வினையின் இயக்கத்தையும், ‘கடலின் மறுபக்கம்’ என்ற இலக்கையும் முழுமையாக வெளிப்படுத்துகிறது.
- source_word: וְיִקָּחֶהָ לָּנוּ
  choice: அதை நமக்குக் கொண்டுவந்து
  rationale: לקח என்பதன் அடிப்படைப் பொருள் ‘எடுத்தல்’; இச்சூழலில் தொலைவில் இருப்பதைப் பெற்று அணுகத்தக்கவாறு கொண்டுவருதல் உட்கருத்தாக உள்ளது.
- source_word: וְיַשְׁמִעֵנוּ אֹתָהּ
  choice: நாம் அதைக் கேட்கும்படி செய்வார்
  rationale: שׁמע என்பதன் ஹிஃபீல் வடிவிலுள்ள காரணவினைப் பொருளைத் தமிழில் நேரடியாகப் பாதுகாக்கிறது; ‘அறிவிப்பார்’ என்று விளக்கமாக மட்டும் மாற்றவில்லை.
- source_word: וְנַעֲשֶׂנָּה
  choice: அப்போது நாம் அதைச் செய்வோம்
  rationale: கேட்டறிதலைத் தொடர்ந்து கட்டளையைச் செயல்படுத்துவதைத் தெளிவாகவும் இயல்பாகவும் கூறுகிறது; ‘அதைச் செய்வோம்’ என்பது மூலத்தின் நேரடியான செயற்பொருளைத் தக்கவைக்கிறது.
