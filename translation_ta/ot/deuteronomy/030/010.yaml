base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/030/010.yaml
  text: if you obey the voice of Yahweh your God[a], keeping his commandments and his statutes that are written in this book of the law[b], if you return to Yahweh your God with all your heart and with all your soul.
translation:
  language: ta
  text: நீ உன் கடவுளாகிய யாவேயின் குரலுக்குச் செவிசாய்த்து[a], இந்தச் சட்ட நூலில் எழுதப்பட்டுள்ள அவருடைய கட்டளைகளையும் விதிமுறைகளையும் கடைப்பிடித்து, உன் முழு இருதயத்தோடும் உன் முழு உயிரோடும் உன் கடவுளாகிய யாவேயிடம் திரும்பினால்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “குரலுக்குச் செவிசாய்த்து” என்பது அவர் சொல்வதைக் கேட்டு அதன்படி நடப்பதைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: “திரும்பினால்” என்பதை “மீண்டும் அவரிடம் திரும்பினால்” அல்லது சூழலுக்கேற்ப “மனந்திரும்பினால்” என்றும் புரிந்துகொள்ளலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: …த்தால் / …திரும்பினால்
  rationale: இரு இடங்களிலும் நிபந்தனையை அறிமுகப்படுத்தும் சொல்லாக இருப்பதால், தமிழில் இயல்பான நிபந்தனை வினைமுற்றுகளால் மொழிபெயர்க்கப்பட்டது.
- source_word: תִשְׁמַע בְּקוֹל
  choice: குரலுக்குச் செவிசாய்த்து
  rationale: வெறுமனே ஒலியைக் கேட்பதல்ல, சொல்லப்படுவதைக் கவனித்து அதன்படி நடப்பது என்ற எபிரெய மரபுத்தொடரின் பொருளைப் பாதுகாக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைப்பெயரை ஒரு பட்டப்பெயரால் மாற்றாமல், எபிரெய தனிப்பெயரின் தமிழாக்க ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: לִשְׁמֹר
  choice: கடைப்பிடித்தால்
  rationale: கட்டளைகளையும் விதிமுறைகளையும் கவனமாகக் காத்து நடைமுறைப்படுத்துதல் என்ற கருத்தை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: מִצְוֺתָיו
  choice: அவரது கட்டளைகள்
  rationale: உடன்படிக்கைச் சட்டச் சூழலில் מִצְוָה என்பதற்குரிய தெளிவான, வழக்கமான இணைச்சொல்.
- source_word: חֻקֹּתָיו
  choice: அவரது விதிமுறைகள்
  rationale: கட்டளைகள் என்பதிலிருந்து வேறுபாட்டைத் தக்கவைத்தபடி, நிர்ணயிக்கப்பட்ட சட்ட விதிகள் என்ற பொருளை நவீன தமிழில் தெரிவிக்கிறது.
- source_word: בְּסֵפֶר הַתּוֹרָה הַזֶּה
  choice: இந்தச் சட்ட நூலில்
  rationale: சட்டம் அடங்கிய உடன்படிக்கை ஆவணம் என்ற பொருளைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: תָשׁוּב אֶל
  choice: …யிடம் திரும்பினால்
  rationale: உடன்படிக்கை உறவுக்குத் திரும்புதல் என்ற உருவகத்தையும் மனந்திரும்புதலின் உட்பொருளையும், அதை ஒரே விளக்கச் சொல்லாகச் சுருக்காமல் பாதுகாக்கிறது.
- source_word: בְּכָל לְבָבְךָ
  choice: உன் முழு இருதயத்தோடும்
  rationale: சிந்தனை, விருப்பம், பற்றுறுதி ஆகியவற்றை உள்ளடக்கும் எபிரெய மனிதவியல் மரபுத்தொடரைக் கண்ணியமான தமிழில் வழங்குகிறது.
- source_word: וּבְכָל נַפְשֶׁךָ
  choice: உன் முழு உயிரோடும்
  rationale: נֶפֶשׁ என்பதை தனியே பிரிந்த ஓர் ஆன்மீகக் கூறாகக் குறுக்காமல், உயிர் மற்றும் முழு நபர் என்ற எபிரெயக் கருத்துக்கு இடமளிக்கிறது.
theological_decisions:
- issue: உடன்படிக்கைச் சூழலில் שׁוּב என்பதன் மொழிபெயர்ப்பு
  choice: திரும்பு
  alternative: மனந்திரும்பு
  rationale: மூல வினையின் திரும்புதல் என்ற உருவகத்தையும், அதிலுள்ள மனமாற்றம் மற்றும் உடன்படிக்கைப் புதுப்பிப்பு ஆகிய இறையியல் ஒலிப்புகளையும் விளக்கித் தீர்த்துவிடாமல் தக்கவைக்கிறது.
- issue: נֶפֶשׁ என்பதன் மனிதவியல் பொருள்
  choice: உயிர்
  alternative: ஆத்துமா
  rationale: இங்கு முழு நபரையும் உயிரையும் குறிக்கக்கூடிய எபிரெயச் சொல்லை, பின்னாளைய உடல்–ஆத்துமா பிரிவாக அவசியமின்றி வாசிப்பதைத் தவிர்க்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியக்கூடிய கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. வசனம் முந்தைய வாக்கியத்தை நிறைவு செய்யும் நிபந்தனைத் துணைவாக்கியமாக இருப்பதால் இறுதியில் முற்றுப்புள்ளி இருந்தாலும் அதன் தொடக்க அமைப்பு நிபந்தனையாகவே வைக்கப்பட்டுள்ளது.
