  text: הִגַּ֤דְתִּי לָ/כֶם֙ הַ/יּ֔וֹם כִּ֥י אָבֹ֖ד תֹּאבֵד֑וּ/ן לֹא תַאֲרִיכֻ֤/ן יָמִים֙ עַל הָ֣/אֲדָמָ֔ה אֲשֶׁ֨ר אַתָּ֤ה עֹבֵר֙ אֶת הַ/יַּרְדֵּ֔ן לָ/בֹ֥א שָׁ֖מָּ/ה לְ/רִשְׁתָּֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/030/018.yaml
  text: I declare to you today that you will surely perish[c][b][a]; you will not prolong your days on the land that you are crossing the Jordan to enter there and possess it.
translation:
  language: ta
  text: 'இன்று நான் உங்களிடம் அறிவிக்கிறேன்: நீங்கள் நிச்சயமாக அழிந்துபோவீர்கள்[a]; நீ[c] யோர்தானைக் கடந்து, அங்கே சென்று, அதை உரிமையாக்கிக்கொள்ளும் அந்த நிலத்தில் நீங்கள் நீண்ட நாள் வாழமாட்டீர்கள்[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொல்லுக்குச் சொல், “அழிந்துபோக, நீங்கள் அழிந்துபோவீர்கள்.” இந்த அமைப்பு அழிவு நிச்சயம் என்பதை வலியுறுத்துகிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அந்த நிலத்தில் உங்கள் நாட்களை நீட்டிக்கமாட்டீர்கள்.”
    reason: lexical_alternative
  - marker: c
    text: இங்கு எபிரெயம் ‘நீ’ என்ற ஒருமையைப் பயன்படுத்தி, இஸ்ரவேல் தேசத்தை ஒரே மக்களாக நோக்கிப் பேசுகிறது; வசனத்தின் மற்ற பகுதிகளில் ‘உங்கள்/நீங்கள்’ என்ற பன்மை உள்ளது.
    reason: cultural_note
lexical_decisions:
- source_word: הִגַּדְתִּי
  choice: அறிவிக்கிறேன்
  rationale: நגד என்பதன் ஹிஃபில் வடிவம் ஒன்றைத் தெரியப்படுத்துதல் அல்லது அறிவித்தல் என்ற பொருளைத் தருகிறது. இங்குள்ள solemn warning force-ஐ இயல்பான நவீன தமிழில் ‘அறிவிக்கிறேன்’ வெளிப்படுத்துகிறது.
- source_word: לָכֶם
  choice: உங்களிடம்
  rationale: இது இரண்டாம் நபர் ஆண்பால் பன்மை வடிவம்; மோசே இஸ்ரவேல் மக்களிடம் பேசுவதைப் பன்மையில் காட்டுகிறது.
- source_word: הַיּוֹם
  choice: இன்று
  rationale: காலத்தைக் குறிக்கும் சொல்லை நேரடியாகவும் இயல்பாகவும் மொழிபெயர்க்கிறது.
- source_word: אָבֹד תֹּאבֵדוּן
  choice: நீங்கள் நிச்சயமாக அழிந்துபோவீர்கள்
  rationale: வினையெச்ச முழுமை வடிவமும் முடிவுற்ற வினையும் இணையும் எபிரெய வலியுறுத்தலை ‘நிச்சயமாக’ என்பதன் மூலம் இயல்பான தமிழில் காக்கிறது.
- source_word: לֹא תַאֲרִיכֻן יָמִים
  choice: நீங்கள் நீண்ட நாள் வாழமாட்டீர்கள்
  rationale: சொல்லுக்குச் சொல் ‘நாட்களை நீட்டிக்கமாட்டீர்கள்’ என்றாலும், அதன் பொருளைத் தெளிவாகவும் இயல்பாகவும் ‘நீண்ட நாள் வாழமாட்டீர்கள்’ என வழங்குகிறது.
- source_word: עַל הָאֲדָמָה
  choice: அந்த நிலத்தில்
  rationale: இந்தச் சூழலில் אֲדָמָה மண்ணை மட்டும் அல்லாமல் யோர்தானுக்கு அப்பாலுள்ள வாக்குத்தத்த நிலப்பரப்பைக் குறிக்கிறது.
- source_word: אֲשֶׁר אַתָּה עֹבֵר אֶת־הַיַּרְדֵּן
  choice: நீ யோர்தானைக் கடந்து
  rationale: இங்கு எபிரெயம் பன்மையிலிருந்து ஒருமைக்கு மாறி இஸ்ரவேலை ஒரே மக்களாக நோக்கிப் பேசுகிறது; அந்த உரைநடைக் மாற்றத்தைத் தமிழிலும் காக்கிறது.
- source_word: לָבֹא שָׁמָּה
  choice: அங்கே சென்று
  rationale: בוא இயக்கத்தைச் சுட்டுகிறது; שָׁמָּה அங்கே என்ற இடச்சுட்டை வெளிப்படையாகக் கொண்டுள்ளது. தமிழில் ‘அங்கே சென்று’ இயல்பாக உள்ளது.
- source_word: לְרִשְׁתָּהּ
  choice: அதை உரிமையாக்கிக்கொள்ள
  rationale: ירש இங்கு நிலத்தைக் கைப்பற்றி உடைமையாக்கிக்கொள்வதைக் குறிக்கிறது; பெண்பால் ஒருமை பின்னொட்டு நிலத்தையே சுட்டுவதால் ‘அதை’ வெளிப்படையாக வைக்கப்பட்டுள்ளது.
theological_decisions:
- issue: இஸ்ரவேலைப் பன்மையிலும் கூட்டு ஒருமையிலும் அழைத்தல்
  choice: வசனத்தின் தொடக்கத்தில் ‘உங்கள்/நீங்கள்’ என்றும், யோர்தானைக் கடக்கும் தொடர்புச் சொல்லாட்சியில் ‘நீ’ என்றும் மொழிபெயர்த்தல்
  alternative: வசனம் முழுவதும் ‘நீங்கள்’ என்று ஒரே எண்ணைப் பயன்படுத்துதல்
  rationale: எபிரெய மூலத்தில் לָכֶם, תֹּאבֵדוּן, תַאֲרִיכֻן ஆகியவை பன்மை; אַתָּה மட்டும் ஒருமை. இந்த மாற்றம் இஸ்ரவேலைப் பலரான மக்களாகவும் ஒரே உடன்படிக்கைச் சமூகமாகவும் ஒருங்கே அணுகும் உரைநடையை வெளிப்படுத்துகிறது.
- issue: வாக்குத்தத்த நிலத்தைக் குறிக்கும் சொல்
  choice: הָאֲדָמָה என்பதை ‘அந்த நிலம்’ என வழங்குதல்
  alternative: ‘அந்த மண்’ அல்லது ‘அந்தத் தரை’
  rationale: யோர்தானைக் கடந்து சென்று உரிமையாக்கிக்கொள்ளும் பிரதேசமே இங்கு குறிக்கப்படுவதால் ‘நிலம்’ சூழலுக்கும் உடன்படிக்கைத் தொடர்புக்கும் பொருத்தமானது.
translation_notes:
  register: நவீன பொதுத்தமிழில் புரியக்கூடிய, ஆனால் உடன்படிக்கை எச்சரிக்கையின் கண்ணியமும் தீவிரமும் காக்கப்படும் நடை பயன்படுத்தப்பட்டுள்ளது. எபிரெயத்தின் பன்மை–கூட்டு ஒருமை மாற்றம் நோக்கத்துடன் நிலைநிறுத்தப்பட்டு அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது.
