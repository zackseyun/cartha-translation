source:
  edition: WLC
  text: כִּֽי קָר֥וֹב אֵלֶ֛י/ךָ הַ/דָּבָ֖ר מְאֹ֑ד בְּ/פִ֥י/ךָ וּ/בִֽ/לְבָבְ/ךָ֖ לַ/עֲשֹׂתֽ/וֹ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/030/014.yaml
  text: For the word is very near you[a], in your mouth and in your heart, so that you may do it.
translation:
  language: ta
  text: ஏனெனில், அந்த வார்த்தை[a] உனக்கு மிகவும் அருகில் உள்ளது; அதை நீ செய்வதற்காக அது உன் வாயிலும் உன் உள்ளத்திலும் உள்ளது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘வார்த்தை’ என்பதற்குப் பதிலாக ‘காரியம்’ அல்லது ‘கட்டளை’ என்றும் மொழிபெயர்க்கலாம். எபிரெய மொழியின் דָּבָר (தாவார்) என்ற சொல் சூழலுக்கேற்ப வார்த்தை, காரியம், அல்லது கட்டளை என்பதைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய கூற்றுக்கான காரணத்தை அல்லது விளக்கத்தை அறிமுகப்படுத்துவதால், தமிழில் இயல்பான தர்க்கத் தொடர்பை ‘ஏனெனில்’ வெளிப்படுத்துகிறது.
- source_word: קָרוֹב אֵלֶיךָ
  choice: உனக்கு மிகவும் அருகில் இருக்கிறது
  rationale: ‘உனக்கு அருகில்’ என்பது எபிரெயச் சொல்லமைப்பின் தொடர்பைத் தெளிவாகவும் இயல்பான தமிழிலும் தருகிறது.
- source_word: הַדָּבָר
  choice: இந்த வார்த்தை
  rationale: דָּבָר என்பதன் ‘வார்த்தை’ என்ற அடிப்படைப் பொருளைப் பாதுகாக்கிறது; சூழலில் இது முன்பு கூறப்பட்ட கட்டளையைச் சுட்டுவதால் ‘இந்த’ என்பது தமிழ் உரையில் அந்தத் தொடர்பை இயல்பாக்குகிறது. ‘காரியம்’ அல்லது ‘கட்டளை’ என்பதும் சாத்தியம் என்பதால் அடிக்குறிப்பு தரப்படுகிறது.
- source_word: מְאֹד
  choice: மிகவும்
  rationale: அருகாமையை வலுப்படுத்தும் வினையடையின் நேரடியான, இயல்பான தமிழ் வடிவம்.
- source_word: בְּפִיךָ
  choice: உன் வாயிலும்
  rationale: பேச்சுடன் தொடர்புடைய உடல்சார் உருவகத்தை நேரடியாகப் பாதுகாக்கிறது; ‘உன் உதடுகளிலும்’ என்பதைவிட மூலத்துக்கு நெருக்கமானது.
- source_word: וּבִלְבָבְךָ
  choice: உன் உள்ளத்திலும்
  rationale: לֵבָב என்பது உணர்ச்சியை மட்டும் அல்லாமல் சிந்தனை, விருப்பம், மனவுறுதி ஆகியவற்றை உள்ளடக்கிய அகமனிதனைச் சுட்டலாம். நவீன தமிழில் ‘உள்ளம்’ இந்த விரிவை ‘இதயம்’ என்பதைவிட இயல்பாக வெளிப்படுத்தி, வாய்–உள்ளம் இணைப்பையும் காக்கிறது.
- source_word: לַעֲשֹׂתוֹ
  choice: நீ அதன்படி நடப்பதற்காக
  rationale: சொற்படி ‘அதைச் செய்வதற்கு’ எனலாம். இங்கு வார்த்தை அல்லது கட்டளைக்குக் கீழ்ப்படிந்து செயல்படுதல் குறிக்கப்படுவதால், ‘அதன்படி நடப்பது’ தமிழில் தெளிவாகவும் இயல்பாகவும் அமைகிறது; நோக்கப் பொருளை ‘-ற்காக’ காக்கிறது.
theological_decisions:
- issue: ‘வார்த்தை’ என்பதன் குறிப்பு
  choice: முதன்மை உரையில் ‘இந்த வார்த்தை’ என்று பொதுவாக வைக்கப்பட்டது.
  alternative: ‘இந்தக் கட்டளை’ அல்லது ‘இந்தக் காரியம்’
  rationale: உடனடியான சூழல் தேவனுடைய கட்டளையைப் பற்றியது என்றாலும், எபிரெய דָּבָר விரிவான பொருளுடையது. ஆகவே மூலத்தில் இருப்பதைவிடக் குறுகலாக விளக்காமல் அதன் பொருள் விரிவும் இறையியல் அழுத்தமும் பாதுகாக்கப்படுகின்றன.
- issue: לַעֲשֹׂתוֹ என்பதன் நோக்க அல்லது விளைவுப் பொருள்
  choice: ‘நீ அதன்படி நடப்பதற்காக’ என்று நோக்கப் பொருளுடன் மொழிபெயர்க்கப்பட்டது.
  alternative: ‘நீ அதன்படி நடக்கும்படி’ அல்லது ‘அதைச் செய்வதற்கு’
  rationale: לְ உடன் வரும் வினையெச்சம் இங்கு நோக்கம் அல்லது விளைவு என இருவித நிழற்பொருளையும் ஏற்கக்கூடும். தமிழ் வாசகத்தில் நோக்கத்தைத் தெளிவாக்கினாலும், மனிதத் திறனைப் பற்றிய கூடுதல் கோட்பாட்டுக் கருத்தைச் சேர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், ஒருமை இரண்டாம் நபர் வடிவம் மூலத்தின்படி காக்கப்பட்டது. மொழிநடை கண்ணியமானதும் பொதுவாசகர்களுக்குப் புரியத்தக்கதுமானது. ‘வாய்’ என்ற மூல உருவகம் பாதுகாக்கப்பட்டு, לֵבָב என்பதற்கு அகமனிதனின் சிந்தனை மற்றும் விருப்பத்தையும் உள்ளடக்கும் ‘உள்ளம்’ தேர்ந்தெடுக்கப்பட்டது.
