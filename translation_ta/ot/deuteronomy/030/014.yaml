revisions:
- from: ஏனெனில், இந்த வார்த்தை உனக்கு மிகவும் அருகில் இருக்கிறது[a]—அது உன் வாயிலும் உன் உள்ளத்திலும் இருக்கிறது; நீ அதன்படி நடப்பதற்காகவே இவ்வாறு இருக்கிறது.
  to: ஏனெனில், அந்த வார்த்தை[a] உனக்கு மிகவும் அருகில் உள்ளது; அதை நீ செய்வதற்காக அது உன் வாயிலும் உன் உள்ளத்திலும் உள்ளது.
  rationale: The revision removes the added expression “இவ்வாறு இருக்கிறது” and replaces the interpretive “அதன்படி நடப்பது” with the source-nearer “அதைச் செய்வது.” It also places the lexical footnote marker on the translated word to which it pertains. “அந்த” reflects the definite, contextually identified ‘word/matter’ without forcing the narrower reading ‘command.’
