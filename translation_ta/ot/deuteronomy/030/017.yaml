  text: וְ/אִם יִפְנֶ֥ה לְבָבְ/ךָ֖ וְ/לֹ֣א תִשְׁמָ֑ע וְ/נִדַּחְתָּ֗ וְ/הִֽשְׁתַּחֲוִ֛יתָ לֵ/אלֹהִ֥ים אֲחֵרִ֖ים וַ/עֲבַדְתָּֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/030/017.yaml
  text: But if your heart turns away[a], and you do not listen, and you are drawn away and bow down to other gods and serve them[b],
translation:
  language: ta
  text: ஆனால் உன் இருதயம் விலகி, நீ செவிகொடாமல், வழிவிலக்கப்பட்டு[a], வேறு தெய்வங்களைப் பணிந்து அவற்றுக்குச் சேவை செய்தால்—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “வழிவிலக்கப்பட்டு” என்பதை “இழுத்துச் செல்லப்பட்டு” அல்லது “துரத்தப்பட்டு” என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் உரிய பற்றுறுதியிலிருந்து ஒருவரை விலக்கிச் செலுத்தும் பொருளைக் கொண்டிருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: ஆனால் ... செய்தால்
  rationale: முந்தைய நேர்மறை அழைப்புக்கு மாறான நிபந்தனையை இயல்பான தமிழில் காட்டுகிறது; எபிரெய இணைப்புச்சொல்லின் எதிர்மறைத் தொடர்பையும் தக்கவைக்கிறது.
- source_word: יִפְנֶה לְבָבְךָ
  choice: உன் இருதயம் விலகி
  rationale: פנה என்பதன் ‘திரும்புதல்/விலகுதல்’ என்ற இயக்கத்தையும், ஆண்டவரிடமிருந்து உள்ளார்ந்த பற்றுறுதி விலகுவதையும் சுருக்கமாக வெளிப்படுத்துகிறது.
- source_word: וְלֹא תִשְׁמָע
  choice: நீ செவிகொடாமல்
  rationale: שׁמע என்பதிலுள்ள கேட்பது மற்றும் கேட்டுக் கீழ்ப்படிவது ஆகிய இரு நிழற்பொருள்களையும் இயல்பான உடன்படிக்கைச் சூழல் தமிழில் தக்கவைக்கிறது.
- source_word: וְנִדַּחְתָּ
  choice: வழிவிலக்கப்பட்டு
  rationale: נדח என்ற நிஃபால் வடிவத்தின் செயல்பாட்டைப் பெறும் தன்மையையும், உரிய பற்றுறுதியிலிருந்து இழுக்கப்படுதல் அல்லது துரத்தப்படுதல் என்ற பொருள் விரிவையும் பிரதிபலிக்கிறது.
- source_word: וְהִשְׁתַּחֲוִיתָ
  choice: பணிந்து
  rationale: உடலைத் தாழ்த்தி வணங்கும் செயலைக் குறிக்கிறது; சூழலில் அது வழிபாடாக அமைகிறது, ஆனால் பொதுவான ‘வழிபடு’ என்ற சொல்லால் உடல் செயலை மறைக்கவில்லை.
- source_word: לֵאלֹהִים אֲחֵרִים
  choice: வேறு தெய்வங்களை
  rationale: உபாகமத்தில் வரும் போட்டித் தெய்வங்களைக் குறிக்கும் நிலையான சொற்றொடரின் நேரடியான தமிழ் வடிவம்.
- source_word: וַעֲבַדְתָּם
  choice: அவற்றுக்குச் சேவை செய்தால்
  rationale: עבד என்பதன் ‘சேவை செய்’ என்ற அடிப்படைப் பொருளைத் தக்கவைத்து, சூழல் வழிபாட்டுச் சேவையைத் தெளிவாக்க அனுமதிக்கிறது.
theological_decisions:
- issue: உடன்படிக்கையிலிருந்து விலகும் நிகழ்வுகளின் தொடர்ச்சி
  choice: இருதயம் விலகுதல், செவிகொடாமை, வழிவிலக்கப்படுதல், வேறு தெய்வங்களைப் பணிதல், அவற்றுக்குச் சேவை செய்தல் என்ற தொடர்ச்சியாக மொழிபெயர்க்கப்பட்டது.
  alternative: ‘வழிவிலக்கப்பட்டு’ என்பதைத் தன்னிச்சையான செயலாக ‘விலகிச் சென்று’ என மொழிபெயர்ப்பது; அல்லது ‘செவிகொடாமல்’ என்பதை ‘கீழ்ப்படியாமல்’ என வெளிப்படையாகக் கூறுவது.
  rationale: எபிரெய உரை உடன்படிக்கைத் துரோகத்தின் படிப்படியான நகர்வை அளிக்கிறது. செயல்பாட்டைப் பெறும் வினைவடிவத்தையும் שׁמע என்பதன் கேட்பு/கீழ்ப்படிதல் பதற்றத்தையும் தீர்த்துவிடாமல் மொழிபெயர்ப்பு காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் கண்ணியமான, பொதுவாசகருக்கு எளிதில் புரியும் நடை. ஒருமை இரண்டாம் நபர் ‘உன்/நீ’ மூலத்தின் எண்ணைத் தக்கவைக்கிறது. வசனம் நிபந்தனைத் துணைவாக்கியமாக இருப்பதால் இறுதியில் நீண்ட கோடு இடப்பட்டு அடுத்த வசனத்தில் வரும் விளைவுக்குத் திறந்தவாறு வைக்கப்பட்டுள்ளது.
