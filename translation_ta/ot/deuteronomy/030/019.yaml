  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் வேதாகம உரைக்கு ஏற்ற கண்ணியத்துடனும் மொழியாக்கம் செய்யப்பட்டது. ‘சாட்சி’, ‘ஆசீர்வாதம்’, ‘சாபம்’, ‘சந்ததி’ ஆகிய பரவலாக அறியப்படும் சொற்கள் துல்லியத்திற்காகப் பயன்படுத்தப்பட்டன; தேவையற்ற சமயப் பிரிவுசார் சொல்லாக்கம் தவிர்க்கப்பட்டது.
