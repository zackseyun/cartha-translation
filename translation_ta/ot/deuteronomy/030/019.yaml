  rationale: הפעיל வடிவமும் בָכֶם என்பதும் உடன்படிக்கை சார்ந்த நீதிமன்றச் சூழலில் சாட்சிகளை ஒருவருக்கு எதிராக அழைப்பதைக் குறிக்கின்றன; வெறும் ‘எச்சரிக்கிறேன்’ என்று தட்டையாக்காமல் அந்தச் சட்ட நயத்தைப் பேணுகிறது.
