- source_word: אַתָּה וְזַרְעֶךָ
  choice: நீயும் உன் சந்ததியும்
  rationale: זֶרַע என்பதன் குடும்பத் தொடர்ச்சிப் பொருளை ‘விதை’ என்ற கடினமான சொல்லாக்கமின்றி இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: உடன்படிக்கைச் சாட்சி மற்றும் நீதிமன்றச் சட்டகம்
  choice: வானமும் பூமியும் கேட்போர் அல்ல, உனக்கு எதிராக அழைக்கப்படும் சாட்சிகள் என மொழிபெயர்க்கப்பட்டது.
  alternative: ‘வானத்தையும் பூமியையும் வைத்து உனக்குச் சாட்சி சொல்கிறேன்’ அல்லது ‘உன்னை எச்சரிக்கிறேன்’
  rationale: எபிரெய வினையும் בָכֶם என்பதும் உடன்படிக்கை வழக்கின் நீதிமன்ற நயத்தைத் தருகின்றன. அதைத் தக்கவைத்தல் வசனத்தின் தீவிரத்தைப் பேணுகிறது; அதேவேளை பிற்காலக் கோட்பாட்டைச் சேர்ப்பதில்லை.
- issue: இரண்டாம் நபர் ஆண்பால் ஒருமையின் பிரதிநிதித்துவப் பயன்பாடு
  choice: இஸ்ரவேலை ஒருமையில் நோக்கும் மூல வடிவத்துக்கு ஏற்ப ‘உன்/நீ’ பயன்படுத்தப்பட்டது; தலைமுறைத் தொடர்ச்சி ‘உன் சந்ததி’ எனப் பேணப்பட்டது.
  alternative: ‘நீங்கள்’ அல்லது ‘இஸ்ரவேலும் அதன் சந்ததியும்’
  rationale: எபிரெயம் உடன்படிக்கைப் பங்காளியான இஸ்ரவேலை பிரதிநிதித்துவ ஒருமையில் அழைக்கிறது. தமிழ் ஒருமை வடிவம் இந்தச் சிறப்பைத் தெளிவாகப் பாதுகாக்கிறது.
- issue: לְמַעַן என்பதிலுள்ள நோக்கம்/விளைவு நுணுக்கம்
  choice: ‘வாழும்படி’
  alternative: ‘வாழ்வதற்காக’ அல்லது ‘அதனால் வாழ்வாய்’
  rationale: மூலத்தில் நோக்கமும் எதிர்பார்க்கப்படும் விளைவும் ஒன்றோடொன்று நெருங்கியுள்ளன; ‘வாழும்படி’ அந்தத் திறந்த நுணுக்கத்தைத் தீர்மானமாக ஒருபக்கம் சாய்க்காமல் வைத்திருக்கிறது.
