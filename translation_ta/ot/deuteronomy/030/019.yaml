  text: 'I call heaven and earth to witness against you today: I have set before you life and death[a], blessing and curse. Choose life, so that you and your offspring may live[c][b],'
translation:
  language: ta
  text: இன்று வானத்தையும் பூமியையும் உனக்கு எதிராகச் சாட்சிகளாக அழைக்கிறேன்:[a] வாழ்வையும் சாவையும், ஆசீர்வாதத்தையும் சாபத்தையும் உன் முன் வைத்திருக்கிறேன். நீயும் உன் சந்ததியும் வாழும்படி, வாழ்வைத் தேர்ந்தெடு.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'இது உடன்படிக்கைச் சூழலிலுள்ள சட்ட மொழி: வானமும் பூமியும் உனக்கு எதிரான சாட்சிகளாக அழைக்கப்படுகின்றன.'
    reason: cultural_note
  - marker: b
    text: ‘சந்ததி’ என்பதற்கான எபிரெயச் சொல் சொல்லுக்குச் சொல் முறையில் ‘விதை’; அது பிள்ளைகளையோ வழித்தோன்றல்களையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
