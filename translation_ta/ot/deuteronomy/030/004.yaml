    text: “வானத்தின் கடைக்கோடி” என்பது எட்டக்கூடிய மிகத் தொலைவான இடத்தைக் குறிக்கும் எபிரெய மரபுத்தொடர்.
    reason: cultural_note
  revision_rationale: The revision uses a simple Tamil conditional for אִם, expresses the corporate singular addressee as scattered without adding a mechanism of expulsion, retains both occurrences of ‘from there,’ and renders לקח with the semantically open ‘எடுத்துக்கொள்வார்.’ The existing idiom footnote remains correctly anchored and adequate.
