  text: אִם יִהְיֶ֥ה נִֽדַּחֲ/ךָ֖ בִּ/קְצֵ֣ה הַ/שָּׁמָ֑יִם מִ/שָּׁ֗ם יְקַבֶּצְ/ךָ֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ וּ/מִ/שָּׁ֖ם יִקָּחֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/030/004.yaml
  text: If your outcasts are at the end of the heavens[a], from there Yahweh your God will gather you[c][b], and from there he will take you.
translation:
  language: ta
  text: நீ வானத்தின் கடைக்கோடியில் சிதறிப்போயிருந்தால்[a], அங்கிருந்து உன் கடவுளாகிய யாவே உன்னை ஒன்றுகூட்டுவார்; அங்கிருந்து உன்னை எடுத்துக்கொள்வார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “வானத்தின் கடைக்கோடி” என்பது எட்டக்கூடிய மிகத் தொலைவான இடத்தைக் குறிக்கும் எபிரெய மரபுத்தொடர்.
    reason: cultural_note
lexical_decisions:
- source_word: אִם יִהְיֶה נִדַּחֲךָ
  choice: நீ துரத்தப்பட்டு ... இருந்தாலும்
  rationale: எபிரெய நிபந்தனையைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது. נִדַּחֲךָ என்பதன் ஒருமை வடிவத்தையும் இஸ்ரவேலை நோக்கிய கூட்டு ஒருமை அழைப்பையும் காக்கிறது; சூழலில் உள்ள வலியுறுத்தலைக் கருத்தில் கொண்டு ‘இருந்தாலும்’ பயன்படுத்தப்பட்டது.
- source_word: בִּקְצֵה הַשָּׁמָיִם
  choice: வானத்தின் கடைக்கோடியில்
  rationale: சொல்லாட்சியின் உயர்ந்த நடையையும், எட்டக்கூடிய மிகத் தொலைவான இடம் என்ற எபிரெய மரபுத்தொடரின் பொருளையும் இயல்பான தமிழில் காக்கிறது.
- source_word: מִשָּׁם
  choice: அங்கிருந்தும்
  rationale: மூலத்தில் இருமுறை வரும் இடச்சுட்டியையும் அதன் வலியுறுத்தலையும் இரு இடங்களிலும் தக்கவைக்கிறது.
- source_word: יְקַבֶּצְךָ
  choice: உன்னை ஒன்றுகூட்டுவார்
  rationale: קבץ என்பதன் ‘சிதறியிருப்பவர்களை ஒன்றாகச் சேர்த்தல்’ என்ற பொருளை வெளிப்படுத்துகிறது; மூலத்தில் இல்லாத ‘திரும்ப’ என்பதைச் சேர்க்கவில்லை.
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: உன் கடவுளாகிய யாவே
  rationale: திருப்பெயரான יהוה என்பதை ‘யாவே’ என ஒலிபெயர்த்து, אֱלֹהֶיךָ என்பதிலுள்ள உடன்படிக்கை உறவைக் ‘உன் கடவுளாகிய’ எனக் காக்கிறது.
- source_word: וּמִשָּׁם יִקָּחֶךָ
  choice: அங்கிருந்தும் உன்னை அழைத்துக்கொள்வார்
  rationale: לקח என்பதன் அடிப்படை ‘எடுத்துக்கொள்’ என்ற பொருளை, இச்சூழலில் தமிழில் இயல்பான தனிப்பட்ட ஏற்றுக்கொள்ளல்/கொண்டுசெல்லல் நுணுக்கத்துடன் தருகிறது; அடுத்த வசனத்தின் இலக்கை முன்கூட்டியே சேர்க்கவில்லை.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலத்தில் பட்டப்பெயர் அல்ல, தனிப்பட்ட உடன்படிக்கைப் பெயரே உள்ளது. ஆகவே அதனைப் பட்டப்பெயரால் மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
- issue: இஸ்ரவேலை நோக்கிய கூட்டு ஒருமை
  choice: ‘நீ/உன்/உன்னை’ என்ற ஒருமையைத் தக்கவைத்தல்
  alternative: ‘நீங்கள்/உங்கள்’ எனப் பன்மைப்படுத்தல் அல்லது ‘உன் நாடுகடத்தப்பட்டவர்கள்’ என விரித்தல்
  rationale: எபிரெயம் இஸ்ரவேலை ஒரே உடன்படிக்கை மக்களாக ஒருமையில் அழைக்கிறது. தமிழ் ஒருமை வடிவம் அந்த இறையியல் மற்றும் இலக்கணத் தன்மையைப் பாதுகாக்கிறது.
- issue: לקח என்பதன் இயக்க நுணுக்கம்
  choice: அழைத்துக்கொள்வார்
  alternative: எடுத்துக்கொள்வார்; கொண்டுவருவார்
  rationale: வினையின் பரந்த ‘எடுத்தல்/கொண்டுசெல்லல்’ பொருளைச் சூழலுக்கேற்ற தமிழில் தருகிறது; ‘கொண்டுவருவார்’ என்று இலக்கைத் தெளிவுபடுத்தி மூலத்தின் திறந்த நுணுக்கத்தைச் சுருக்கவில்லை.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. எபிரெயத்தின் கூட்டு ஒருமை, ‘அங்கிருந்தும்’ என்ற இரட்டிப்பு, தொலைதூரத்தைக் குறிக்கும் உருவகம் ஆகியவை தக்கவைக்கப்பட்டுள்ளன.
