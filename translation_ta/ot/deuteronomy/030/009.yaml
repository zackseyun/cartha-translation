source:
  edition: WLC
  text: וְ/הוֹתִֽירְ/ךָ֩ יְהוָ֨ה אֱלֹהֶ֜י/ךָ בְּ/כֹ֣ל מַעֲשֵׂ֣ה יָדֶ֗/ךָ בִּ/פְרִ֨י בִטְנְ/ךָ֜ וּ/בִ/פְרִ֧י בְהֶמְתְּ/ךָ֛ וּ/בִ/פְרִ֥י אַדְמָתְ/ךָ֖ לְ/טוֹבָ֑ה כִּ֣י יָשׁ֣וּב יְהוָ֗ה לָ/שׂ֤וּשׂ עָלֶ֨י/ךָ֙ לְ/ט֔וֹב כַּ/אֲשֶׁר שָׂ֖שׂ עַל אֲבֹתֶֽי/ךָ׀׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/030/009.yaml
  text: And Yahweh your God will make you abound in all the work of your hand[a], in the fruit of your womb, in the fruit of your livestock, and in the fruit of your ground, for good; for Yahweh will again rejoice over you for good[b], just as he rejoiced over your fathers.
translation:
  language: ta
  text: உன் தேவனாகிய யாவே, உன் கையின் எல்லாச் செயல்களிலும், உன் கருப்பையின் கனியிலும், உன் கால்நடைகளின் கனியிலும், உன் நிலத்தின் கனியிலும் உன்னைச் செழிக்கச் செய்வார்[a]. ஏனெனில், உன் தந்தையர்மேல் மகிழ்ந்ததுபோல, உனக்கு நன்மை உண்டாகும்படி யாவே உன்னைக் குறித்து மீண்டும் மகிழ்வார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘உனக்கு ஏராளமாக அளிப்பார்’ அல்லது ‘உன்னை மிகுதியாக்குவார்’ என்றும் மொழிபெயர்க்கலாம்; எபிரெய வினை ஒருவருக்கு மிகுதி அல்லது உபரி உண்டாகச் செய்வதைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוֹתִירְךָ
  choice: உனக்கு மிகுதியை உண்டாக்குவார்
  rationale: הותיר என்பதன் ஹிஃபில் வடிவம் மிகுதி அல்லது உபரியை ஒருவருக்கு உண்டாக்குவதைக் குறிக்கிறது. தமிழில் காரணவினைத் தன்மையையும் தொடர்ந்து வரும் தெளிவான ஆசீர்வாதங்களையும் இச்சொற்றொடர் காக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய தனிப்பெயரான יהוה-ஐ ஒரு பட்டமாக மாற்றாமல், தமிழில் இயல்பான ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: בְּכֹל מַעֲשֵׂה יָדֶךָ
  choice: உன் கையின் செயல்கள் அனைத்திலும்
  rationale: ‘கையின் செயல்’ என்ற எபிரெய உருவகத்தைத் தக்கவைத்து, ஒருவரின் உழைப்பு மற்றும் முயற்சிகள் அனைத்தையும் குறிக்கும் இயல்பான தமிழை வழங்குகிறது.
- source_word: בִּפְרִי בִטְנְךָ
  choice: உன் கருப்பையின் கனியில்
  rationale: பிள்ளைகள் அல்லது சந்ததியைக் குறிக்கும் மூலமொழியின் ‘கருப்பையின் கனி’ உருவகத்தைப் பாதுகாக்கிறது.
- source_word: בִפְרִי בְהֶמְתְּךָ
  choice: உன் கால்நடைகளின் கனியில்
  rationale: בהמה இங்கு வளர்ப்பு விலங்குகளைப் பொதுவாகக் குறிக்கிறது; ‘கனி’ என்பதை மீண்டும் பயன்படுத்துவது மூலத்தின் மூவகை இணை அமைப்பைத் தக்கவைக்கிறது.
- source_word: בִפְרִי אַדְמָתְךָ
  choice: உன் நிலத்தின் கனியில்
  rationale: אדמה இங்கு விளைச்சல் தரும் மண்ணையோ பயிர்நிலத்தையோ குறிக்கிறது; ‘நிலத்தின் கனி’ என்பது வேளாண்மைச் சூழலைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: לְטוֹבָה / לְטוֹב
  choice: உன் நன்மைக்காக / உனக்கு நன்மை உண்டாகும்படி
  rationale: இரு இடங்களிலும் வரும் לְטוֹב என்ற பயனைக் குறிக்கும் சொல்லை, தமிழில் அந்தந்த வாக்கிய அமைப்புக்கு ஏற்றவாறு நன்மையான விளைவு என்று வழங்குகிறது.
- source_word: יָשׁוּב ... לָשׂוּשׂ עָלֶיךָ
  choice: உன்னில் மீண்டும் மகிழ்வார்
  rationale: ‘திரும்பி மகிழ்வார்’ என்ற சொற்படியான அமைப்பு இங்கு ஒரு செயல் மறுபடியும் நிகழ்வதைக் குறிக்கிறது; ‘மீண்டும்’ என்பது அந்தப் பொருளை இயல்பாக வெளிப்படுத்துகிறது. ‘உன்னில் மகிழ்வார்’ என்பது עליך-இன் உறவுசார் பொருளைக் காக்கிறது.
- source_word: אֲבֹתֶיךָ
  choice: உன் முன்னோர்கள்
  rationale: சொற்படியாக ‘உன் தந்தையர்’ என்றாலும், இச்சூழலில் இஸ்ரவேலின் முந்தைய தலைமுறையினரையோ மூதாதையரையோ குறிக்கிறது; ‘முன்னோர்கள்’ நவீன தமிழில் அந்தக் கூட்டுப் பொருளைத் தெளிவாகத் தருகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரை வழங்குதல்
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலத்தில் ஒரு பொதுப்பட்டம் அல்ல, உடன்படிக்கையின் தனிப்பெயரே நேரடியாக உள்ளது; ஆகவே அதைத் தமிழில் ஒலிபெயர்த்து வழங்கப்பட்டுள்ளது.
- issue: אֲבֹתֶיךָ என்பதன் பாலினம் மற்றும் வரலாற்றுக் குறிப்பு
  choice: உன் முன்னோர்கள்
  alternative: உன் தந்தையர்
  rationale: எபிரெயச் சொல் ஆண்பால் பன்மையாக இருந்தாலும், இங்கு இஸ்ரவேலின் முந்தைய தலைமுறையினரைச் சுட்டுகிறது. இயல்பான கூட்டுப் பொருள் முதன்மை உரையில் தரப்பட்டு, சொற்படியான வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
- issue: இறைவன் மகிழ்வதும் நன்மை செய்வதும் இடையிலான தொடர்பு
  choice: உனக்கு நன்மை உண்டாகும்படி உன்னில் மீண்டும் மகிழ்வார்
  alternative: உன்மேல் நன்மைக்காக மீண்டும் மகிழ்வார்
  rationale: לְטוֹב என்பதன் பயன் அல்லது நன்மையான நோக்கத்தை வெளிப்படுத்துகிறது; அதே நேரத்தில் மகிழ்ச்சியையும் பொருளாதாரச் செழிப்பையும் ஒன்றாகக் கலக்காமல் மூலத்தின் தொடர்பைத் தக்கவைக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில், மரியாதையும் வாசிப்புத் தெளிவும் கொண்ட நடை பயன்படுத்தப்பட்டுள்ளது. ‘கருப்பையின் கனி’, ‘கால்நடைகளின் கனி’, ‘நிலத்தின் கனி’ என்ற மூலமொழியின் இணை உருவகங்கள் பாதுகாக்கப்பட்டுள்ளன; நீண்ட எபிரெய வாக்கியத்தின் பட்டியல் தமிழில் தெளிவாகப் படிக்க இடைக்கோடுகளால் பிரிக்கப்பட்டுள்ளது.
