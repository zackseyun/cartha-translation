base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/030/016.yaml
  text: 'which I am commanding you today: to love Yahweh your God[a], to walk in his ways, and to keep his commandments, his statutes, and his judgments, so that you may live and multiply[d][c][b], and Yahweh your God may bless you in the land that you are entering there to possess it.'
translation:
  language: ta
  text: 'இன்று நான் உனக்குக் கட்டளையிடுவது இதுவே: உன் கடவுளாகிய யாவேவை நேசித்து, அவருடைய வழிகளில் நடந்து, அவருடைய கட்டளைகளையும் சட்டங்களையும் நீதிமுறைகளையும்[a] கடைப்பிடி. அப்போது நீ வாழ்ந்து பெருகுவாய்[b]; அதனை உரிமையாக்கிக்கொள்ள நீ அங்கே நுழையும் நாட்டில் உன் கடவுளாகிய யாவே உன்னை ஆசீர்வதிப்பார்[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “நீதிமுறைகள்” என்பதற்கு “நீதித்தீர்ப்புகள்” அல்லது “ஒழுங்குமுறைகள்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெய வினைத்தொடரை, “நீ வாழ்ந்து பெருகும்படிக்கும், யாவே ... உன்னை ஆசீர்வதிக்கும்படிக்கும்” என்ற நோக்கம் அல்லது விளைவைக் குறிக்கும் தொடராகவும் புரிந்துகொள்ளலாம்.
    reason: alternative_reading
  - marker: c
    text: “உரிமையாக்கிக்கொள்ள” என்பதற்கு, குறிப்பாக வாக்குத்தத்த நாட்டின் சூழலில், “சுதந்தரித்துக்கொள்ள” என்றும் மொழிபெயர்க்கலாம். எபிரெயத்தில் சொல்லுக்கு சொல், “அதை உரிமையாக்கிக்கொள்ள நீ அங்கே நுழையும் நாட்டில்” என்று உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְצַוְּךָ הַיּוֹם
  choice: இன்று நான் உனக்குக் கட்டளையிடுவது
  rationale: எபிரெயப் பங்கேற்புவினையின் உடனடியான, நிகழ்கால வலியுறுத்தலை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரை ஒரு பொதுப்பட்டத்தால் மாற்றாமல், எபிரெய நான்கெழுத்துப் பெயரின் பரவலான தமிழ் ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: לָלֶכֶת בִּדְרָכָיו
  choice: அவருடைய வழிகளில் நடந்து
  rationale: வாழ்க்கை நடத்தையைக் குறிக்கும் எபிரெய உருவகத்தைத் தமிழிலும் காக்கிறது.
- source_word: לִשְׁמֹר
  choice: கடைப்பிடி
  rationale: உடன்படிக்கை மற்றும் சட்டச் சூழலில் கீழ்ப்படிந்து அனுசரித்தல் என்ற பொருளை இயல்பாகத் தருகிறது.
- source_word: מִצְוֺתָיו וְחֻקֹּתָיו וּמִשְׁפָּטָיו
  choice: அவருடைய கட்டளைகளையும் சட்டங்களையும் நீதிமுறைகளையும்
  rationale: மூன்று சட்டவியல் சொற்களுக்கும் இடையிலான வேறுபாட்டை முடிந்தவரை காக்கிறது; מִשְׁפָּטִים என்பதிலுள்ள நீதி/தீர்ப்பு நுணுக்கத்தை ‘நீதிமுறைகள்’ வெளிப்படுத்துகிறது.
- source_word: וְחָיִיתָ וְרָבִיתָ
  choice: அப்போது நீ வாழ்ந்து பெருகுவாய்
  rationale: முந்திய கட்டளைக்குப் பின்வரும் விளைவு அல்லது வாக்குறுதி என்ற தொடரைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: לְרִשְׁתָּהּ
  choice: உரிமையாக்கிக்கொள்ள
  rationale: நாட்டைக் கைப்பற்றி உடைமையாக்கும் அடிப்படைப் பொருளைக் காக்கிறது; வாக்குத்தத்த நாட்டுச் சூழலில் ‘சுதந்தரித்துக்கொள்ள’ என்பதும் சாத்தியம்.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: ஆண்டவர் / யெகோவா
  rationale: மூலத்தில் தனிப்பட்ட உடன்படிக்கைப் பெயர் நேரடியாக உள்ளது. எனவே அதை ஒரு பட்டமாக மாற்றாமல் ஒலிபெயர்க்கிறது; குறிப்பிட்ட சமயக்குழுவின் தனிப்பட்ட வழக்கைத் திணிக்கவில்லை.
- issue: கீழ்ப்படிதலைத் தொடர்ந்து வரும் வினைத்தொடரின் தன்மை
  choice: விளைவு அல்லது வாக்குறுதியாக ‘அப்போது ... பெருகுவாய்; ... ஆசீர்வதிப்பார்’
  alternative: நோக்காக ‘நீ வாழ்ந்து பெருகும்படிக்கும் ... ஆசீர்வதிக்கும்படிக்கும்’
  rationale: எபிரெய வினைத்தொடர் விளைவாகவும் வாக்குறுதியாகவும் புரிந்துகொள்ளப்படலாம். முதன்மை உரை இயல்பான வாக்குறுதி வடிவத்தைத் தேர்ந்தெடுக்கிறது; மாற்றுப் புரிதல் அடிக்குறிப்பில் காக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், ஒருமை இரண்டாம் நபர் முகவரியையும் கண்ணியமான வேதாகம நடையையும் காக்கிறது. மூலத்தின் நீண்ட தொடரை வாசிப்புத் தெளிவுக்காக இரண்டு வாக்கியங்களாகப் பிரித்துள்ளது; ‘அங்கே’ என்ற திசைச்சொல் தமிழில் தேவையற்ற மீளுருவாக்கமாக இருப்பதால் முதன்மை உரையில் இயல்பாக்கப்பட்டு, அடிக்குறிப்பில் வெளிப்படுத்தப்பட்டுள்ளது.
