  rationale: The revision restores the source’s explicit ‘entering’ action in the final relative clause and preserves the directional ‘there’ and object ‘it’ in natural, intelligible Tamil. No doctrinal or interpretive change is introduced; the existing ambiguity concerning the consequential/promise force of the verbal sequence remains documented in footnote b.
