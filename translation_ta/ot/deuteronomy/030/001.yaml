  text: וְ/הָיָה֩ כִֽי יָבֹ֨אוּ עָלֶ֜י/ךָ כָּל הַ/דְּבָרִ֣ים הָ/אֵ֗לֶּה הַ/בְּרָכָה֙ וְ/הַ/קְּלָלָ֔ה אֲשֶׁ֥ר נָתַ֖תִּי לְ/פָנֶ֑י/ךָ וַ/הֲשֵׁבֹתָ֙ אֶל לְבָבֶ֔/ךָ בְּ/כָל הַ/גּוֹיִ֔ם אֲשֶׁ֧ר הִדִּיחֲ/ךָ֛ יְהוָ֥ה אֱלֹהֶ֖י/ךָ שָֽׁמָּ/ה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/030/001.yaml
  text: And when all these things come upon you—the blessing and the curse that I have set before you—and you take them to heart among all the nations where Yahweh your God has driven you,[a]
translation:
  language: ta
  text: நான் உனக்கு முன்பாக வைத்த ஆசீர்வாதமும் சாபமும் ஆகிய இவையெல்லாம் உனக்கு நேரிடும்போது, உன் கடவுளாகிய யாவே உன்னைத் துரத்திய எல்லா மக்களினங்களிடையிலும் நீ அவற்றை உன் மனதில் நினைவுகூரும்போது,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'சொல்லுக்குச் சொல்: “நீ அவற்றை உன் இதயத்திற்குள் மீண்டும் கொண்டுவரும்போது.”'
    reason: எபிரெய வினைச்சொல்லின் நேரடியான ‘இதயத்திற்குத் திரும்பக் கொண்டுவருதல்’ உருவகத்தைப் பாதுகாக்கிறது; முதன்மை உரையில் அதன் பொருள் ‘மனதில் நினைவுகூருதல்’ என வழங்கப்பட்டுள்ளது.
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: நேரிட்டு … ஏற்றுக்கொள்ளும்போது
  rationale: எதிர்காலச் சூழலை அறிமுகப்படுத்தும் எபிரெயக் கட்டமைப்பை, அடுத்த வசனத்திற்குத் தொடரும் இயல்பான தமிழ் நிபந்தனை-கால வாக்கியமாக வழங்குகிறது.
- source_word: כָּל הַדְּבָרִים הָאֵלֶּה
  choice: இவையெல்லாம்
  rationale: דברים இங்கு தனித்தனி ‘வார்த்தைகள்’ என்பதைக் காட்டிலும், முன்வைக்கப்பட்ட உடன்படிக்கை விளைவுகள் அனைத்தையும் குறிக்கிறது.
- source_word: הַבְּרָכָה וְהַקְּלָלָה
  choice: ஆசீர்வாதமும் சாபமும்
  rationale: எதிரெதிரான உடன்படிக்கை விளைவுகளைத் தெளிவாகவும் மரபான தமிழிலும் வெளிப்படுத்துகிறது.
- source_word: אֲשֶׁר נָתַתִּי לְפָנֶיךָ
  choice: நான் உனக்கு முன்பாக வைத்த
  rationale: נתן என்பதன் அடிப்படைப் பொருள் ‘கொடு’ என்றாலும், ‘முன்பாக’ என்பதுடன் இங்கு ‘முன்வை/வைத்திரு’ என்ற சொற்றொடர்ப் பொருள் இயல்பானது.
- source_word: וַהֲשֵׁבֹתָ אֶל לְבָבֶךָ
  choice: நீ அவற்றை மனத்தில் ஏற்றுக்கொள்ளும்போது
  rationale: சொல்லுக்குச் சொல் ‘உன் இதயத்திற்குத் திரும்பக் கொண்டுவருதல்’ என்ற உருவகத்தை, நினைவுகூர்ந்து உள்ளார்ந்து கவனிப்பது என்ற பொருளுடன் இயல்பான தமிழில் தருகிறது; நேரடி உருவகம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: בְּכָל הַגּוֹיִם
  choice: எல்லா நாடுகளிலும்
  rationale: சிதறடிக்கப்பட்ட மக்கள் வாழும் அந்நிய தேசங்களின் பரப்பை இயல்பாகக் குறிக்கிறது.
- source_word: הִדִּיחֲךָ
  choice: உன்னைத் துரத்திவிட்ட
  rationale: வலுக்கட்டாயமாக அகற்றுதல் அல்லது விரட்டிவிடுதல் என்ற வினையின் வலிமையைத் தக்கவைக்கிறது; பொதுவான ‘சிதறடித்தல்’ என்ற பொருளை மட்டும் இறக்குமதி செய்யவில்லை.
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: உன் கடவுளாகிய யாவே
  rationale: திருப்பெயரான יהוה என்பதை ‘யாவே’ என்று ஒலிபெயர்த்து, உடன்படிக்கைப் பெயரை வெளிப்படையாகப் பாதுகாக்கிறது.
- source_word: שָׁמָּה
  choice: எல்லா நாடுகளிலும்
  rationale: ‘அங்கே’ என்ற இடப்பொருள் தமிழில் தொடர்புச் சொற்றொடருக்குள் இயல்பாக இணைக்கப்பட்டுள்ளது; தனியே மீண்டும் கூறுவது தேவையற்றது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூலத்தில் பொதுப்பட்டப் பெயர் அல்ல, நான்கெழுத்துத் திருப்பெயர் நேரடியாக உள்ளது; ஆகவே அதை மறைக்காமல் ஒலிபெயர்க்கிறது.
- issue: மோசே உரையாடும் இரண்டாம் நபர் ஒருமை
  choice: உன் / உன்னை / நீ
  alternative: உங்கள் / உங்களை / நீங்கள்
  rationale: எபிரெய மூலத்தின் ஆண்பால் ஒருமை வடிவத்தைப் பாதுகாக்கிறது; அது உடன்படிக்கை மக்களை ஒருங்கிணைந்த ஒருவராக நோக்கினாலும், தமிழில் பன்மையாக்கி அந்த இலக்கணத் தன்மையை மறைக்கவில்லை.
translation_notes:
  register: நவீன, மரியாதைமிக்க, பொதுவாசகர்களுக்குப் புரியும் தமிழ் பயன்படுத்தப்பட்டுள்ளது. வசனம் 2ஆம் வசனத்தில் நிறைவடையும் நீண்ட நிபந்தனை வாக்கியத்தின் தொடக்கம் என்பதால் இறுதியில் காற்புள்ளி வைக்கப்பட்டுள்ளது.
