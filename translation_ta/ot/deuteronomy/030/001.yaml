    reason: எபிரெய வினைச்சொல்லின் நேரடியான ‘இதயத்திற்குத் திரும்பக் கொண்டுவருதல்’ உருவகத்தைப் பாதுகாக்கிறது; முதன்மை உரையில் அதன் பொருள் ‘மனதில் நினைவுகூருதல்’ என வழங்கப்பட்டுள்ளது.
