revisions:
- from: அது வானத்தில்[a] இல்லை. ஆகவே, “நமக்காக வானத்திற்கு ஏறி, அதை நமக்குக் கொண்டுவந்து, அதை நாம் கேட்கச் செய்வது யார்? அப்படிச் செய்தால் நாம் அதைக் கடைப்பிடிப்போம்” என்று நீ சொல்ல வேண்டியதில்லை.
  to: “நாம் அதைக் கடைப்பிடிப்பதற்காக, நமக்காக வானத்திற்கு ஏறி, அதை நமக்காக எடுத்துக்கொண்டு வந்து, நமக்குக் கேட்பிப்பவர் யார்?” என்று நீ சொல்ல வேண்டியபடி அது வானத்தில்[a] இல்லை.
  rationale: The revision removes the added inferential ‘ஆகவே’ and recasts the conditional-future ending as a purpose clause. It also places the purpose naturally within the Tamil rhetorical question while preserving the source sequence of ascent, taking/bringing, and causing the people to hear.
