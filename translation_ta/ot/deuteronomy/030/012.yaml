  text: לֹ֥א בַ/שָּׁמַ֖יִם הִ֑וא לֵ/אמֹ֗ר מִ֣י יַעֲלֶה לָּ֤/נוּ הַ/שָּׁמַ֨יְמָ/ה֙ וְ/יִקָּחֶ֣/הָ לָּ֔/נוּ וְ/יַשְׁמִעֵ֥/נוּ אֹתָ֖/הּ וְ/נַעֲשֶֽׂ/נָּה־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/030/012.yaml
  text: It is not in heaven[a], that you should say, ‘Who will go up to heaven for us and get it for us and make us hear it, so that we may do it?’
translation:
  language: ta
  text: “நாம் அதைக் கடைப்பிடிப்பதற்காக, நமக்காக வானத்திற்கு ஏறி, அதை நமக்காக எடுத்துக்கொண்டு வந்து, நமக்குக் கேட்பிப்பவர் யார்?” என்று நீ சொல்ல வேண்டியபடி அது வானத்தில்[a] இல்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மொழியில் இச்சொல் வடிவில் பன்மையாக உள்ளது; “வானங்களில்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַשָּׁמַיִם
  choice: வானத்தில்
  rationale: எபிரெயச் சொல் வடிவில் பன்மையாக இருந்தாலும், இங்கு எட்ட முடியாத மேலுலகைக் குறிக்கிறது; நவீனத் தமிழில் ஒருமை வடிவான ‘வானத்தில்’ இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: הִוא
  choice: அது
  rationale: பெண்பால் ஒருமைப் பெயர்ச்சுட்டு முந்தைய சூழலில் உள்ள கட்டளை அல்லது வார்த்தையைக் குறிக்கிறது; தமிழில் ‘அது’ இயல்பான சுட்டுப்பெயர்.
- source_word: לֵאמֹר
  choice: என்று நீ சொல்ல வேண்டியதில்லை
  rationale: ஒரு கற்பனையான எதிர்வினையின் உள்ளடக்கத்தை அறிமுகப்படுத்துகிறது; எதிர்மறை முதன்மை வாக்கியத்துடன் இணைத்து தமிழில் இயல்பாக வழங்கப்பட்டுள்ளது.
- source_word: מִי יַעֲלֶה לָּנוּ
  choice: நமக்காக ... ஏறி ... செய்வது யார்?
  rationale: עלה என்பதன் மேல்நோக்கிய இயக்கத்தையும் לָנוּ என்பதன் நன்மை/சார்பு பொருளையும் பாதுகாக்கிறது.
- source_word: הַשָּׁמַיְמָה
  choice: வானத்திற்கு
  rationale: திசை குறிக்கும் எபிரெய முடிவை ‘வானத்திற்கு’ என்ற இயக்க இலக்கு தெளிவாகக் காட்டுகிறது.
- source_word: וְיִקָּחֶהָ לָּנוּ
  choice: அதை நமக்குக் கொண்டுவந்து
  rationale: לקח என்பதன் அடிப்படைப் பொருள் ‘எடுத்தல்’; இச்சூழலில் வானத்திலிருந்து மக்களுக்காகப் பெற்றுக் கொண்டுவருதல் என்பதே இயல்பான தமிழ் பொருள்.
- source_word: וְיַשְׁמִעֵנוּ אֹתָהּ
  choice: அதை நாம் கேட்கச் செய்து
  rationale: שמע என்பதன் ஹிஃபில் வடிவிலுள்ள காரணவினைப் பொருளான ‘நம்மைக் கேட்கச் செய்தல்’ பாதுகாக்கப்படுகிறது.
- source_word: וְנַעֲשֶׂנָּה
  choice: நாம் அதைக் கடைப்பிடிப்போம்
  rationale: עשה இங்கு கட்டளையை வெறுமனே ‘செய்தல்’ அல்ல, அதன்படி செயல்பட்டு கடைப்பிடித்தலைக் குறிக்கிறது; தொடரின் நோக்கம்/விளைவு தமிழில் தெளிவாக வெளிப்படுகிறது.
theological_decisions:
- issue: ‘அது’ என்பதன் குறிப்பிடம்
  choice: கட்டளை அல்லது வார்த்தையைக் குறிக்கும் நடுநிலைச் சுட்டுப்பெயராகவே வைத்தல்
  alternative: ‘கட்டளை’ என்று வசனத்திற்குள் வெளிப்படையாகச் சேர்த்தல்
  rationale: எபிரெய மூலத்தில் குறிப்பிடம் சூழலால் அறியப்படுகிறது; அதை வசனத்திற்குள் நிரப்பாமல் மூலத்தின் இணைப்பையும் சிறிய அளவிலான தெளிவின்மையையும் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. நீண்ட எபிரெயக் கேள்வித் தொடரை தமிழில் தெளிவாக்க இரண்டு வாக்கியங்களாகப் பிரித்தாலும், அதன் கற்பனைக் கேள்வி, கேட்பித்தல், கடைப்பிடித்தல் ஆகிய தொடர்புகள் பாதுகாக்கப்பட்டுள்ளன.
