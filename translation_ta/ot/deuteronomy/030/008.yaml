  text: וְ/אַתָּ֣ה תָשׁ֔וּב וְ/שָׁמַעְתָּ֖ בְּ/ק֣וֹל יְהוָ֑ה וְ/עָשִׂ֨יתָ֙ אֶת כָּל מִצְוֺתָ֔י/ו אֲשֶׁ֛ר אָנֹכִ֥י מְצַוְּ/ךָ֖ הַ/יּֽוֹם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/030/008.yaml
  text: And you shall return and obey the voice of Yahweh[b][a], and you shall do all his commandments that I am commanding you today.
translation:
  language: ta
  text: நீயோ திரும்புவாய்; யாவேயின் குரலுக்குச் செவிகொடுப்பாய்[b][a]; இன்று நான் உனக்குக் கட்டளையிடுகிற அவருடைய எல்லாக் கட்டளைகளையும் கடைப்பிடிப்பாய்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “திரும்பிச் செல்வாய்”; இச்சூழலில் இது உடன்படிக்கையின்படி மனந்திரும்புவதையும் குறிக்கக்கூடும்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில், “யாவேயின் குரலுக்குச் செவிகொடு”; இந்த மரபுத்தொடர் பெரும்பாலும் கீழ்ப்படிதலை உட்குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: תָשׁוּב
  choice: திரும்பி வந்து
  rationale: שׁוּב என்பதன் அடிப்படைப் பொருளான ‘திரும்புதல்’ என்பதைத் தக்கவைக்கிறது; இச்சூழலில் உள்ள உடல்சார் மீள்வருகை, உடன்படிக்கைசார் திரும்புதல், மனந்திரும்புதல் ஆகிய சாத்தியங்களை ஒன்றாகக் குறுக்காமல் விடுகிறது.
- source_word: וְשָׁמַעְתָּ בְּקוֹל יְהוָה
  choice: யெகோவாவின் குரலுக்குச் செவிகொடுப்பாய்
  rationale: ‘குரலுக்குச் செவிகொடு’ என்ற எபிரெய மரபுத்தொடரை இயல்பான தமிழில் பாதுகாக்கிறது; இது வெறுமனே கேட்பதை அல்ல, கீழ்ப்படிதலையும் உட்குறிக்கிறது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: இறைநாமத்தை ஒரு பட்டப்பெயரால் மாற்றாமல், தமிழில் பரவலாக அறியப்பட்ட ஒலிபெயர்ப்பால் தருகிறது.
- source_word: וְעָשִׂיתָ
  choice: நடப்பாய்
  rationale: கட்டளைகள் பொருளாக வரும்போது עשה என்பதன் ‘செயல்படுத்துதல்/கடைப்பிடித்தல்’ பொருளை இயல்பான தமிழில் தெரிவிக்கிறது; ‘எல்லாக் கட்டளைகளின்படியும்’ என்பதுடன் இணைந்து செயற்பாட்டுக் கீழ்ப்படிதலைத் தெளிவாக்குகிறது.
- source_word: כָּל מִצְוֺתָיו
  choice: அவருடைய எல்லாக் கட்டளைகளின்படியும்
  rationale: மூன்றாம் ஆண்பால் ஒருமை பின்னொட்டை ‘அவருடைய’ என்று வெளிப்படுத்தி, דברים நூலுக்குரிய உடன்படிக்கை மற்றும் சட்ட மொழிநடையைப் பேணுகிறது.
- source_word: אֲשֶׁר אָנֹכִי מְצַוְּךָ הַיּוֹם
  choice: இன்று நான் உனக்குக் கட்டளையிடுகிற
  rationale: எபிரெயப் பங்கேற்புவினையின் நிகழ்கால உடனடித் தன்மையையும் ‘இன்று’ என்ற முக்கிய உடன்படிக்கைச் சுட்டையும் தக்கவைக்கிறது.
- source_word: וְאַתָּה
  choice: நீயோ
  rationale: வெளிப்படையாக வந்துள்ள வலியுறுத்தப்பட்ட முன்னிலைப் பெயரை ‘நீயோ’ எனக் காட்டுகிறது; தேவையற்ற வலுவான எதிர்மறைத் தொடர்பைச் சேர்ப்பதில்லை.
theological_decisions:
- issue: שׁוּב என்பதை வெளிப்படையாக ‘மனந்திரும்பு’ என்று மொழிபெயர்ப்பதா
  choice: திரும்பி வந்து
  alternative: மனந்திரும்பி
  rationale: இச்சொல் உடன்படிக்கைசார் மனந்திரும்புதலைக் குறிக்கக்கூடும்; ஆனால் அதில் மட்டும் பொருளைக் குறுக்காமல், மீள்வருகை மற்றும் தேவனிடம் திரும்புதல் ஆகிய அடுக்குகளையும் திறந்துவைக்கிறது.
- issue: שׁמע בְּקוֹל என்பதை நேரடியாக ‘கீழ்ப்படி’ என்று மொழிபெயர்ப்பதா
  choice: குரலுக்குச் செவிகொடு
  alternative: கீழ்ப்படி
  rationale: இந்த மரபுத்தொடர் கீழ்ப்படிதலை உட்குறித்தாலும், அடுத்த கூறு கட்டளைகளின்படி நடப்பதைத் தனியே சொல்கிறது. எனவே கேட்பதும் செய்வதும் என்ற தொடர்புடைய இரு கூறுகளையும் ஒன்றாகச் சுருக்காமல் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான வேதாகம மொழிநடை பயன்படுத்தப்பட்டுள்ளது. ஒருமை ‘நீ’ வடிவங்கள் எபிரெய மூலத்தின் ஒருமையைப் பேணுகின்றன. அடிக்குறிக் குறிகள் ஆங்கில ஆலோசனை உரையில் காணப்படும் வரிசைப்படியே [b][a] என முதன்மை உரையில் வைக்கப்பட்டுள்ளன.
