  text: וְ/שָׁ֨ב יְהוָ֧ה אֱלֹהֶ֛י/ךָ אֶת שְׁבוּתְ/ךָ֖ וְ/רִחֲמֶ֑/ךָ וְ/שָׁ֗ב וְ/קִבֶּצְ/ךָ֙ מִ/כָּל הָ֣/עַמִּ֔ים אֲשֶׁ֧ר הֱפִֽיצְ/ךָ֛ יְהוָ֥ה אֱלֹהֶ֖י/ךָ שָֽׁמָּ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/030/003.yaml
  text: then Yahweh your God will restore your fortunes and have compassion on you[c][b][a], and he will gather you again from all the peoples where Yahweh your God has scattered you.
translation:
  language: ta
  text: அப்போது உன் கடவுளாகிய யாவே உன் வாழ்நிலையை மீண்டும் சீராக்குவார்[a]; உன்மேல் இரக்கம் காட்டுவார். உன் கடவுளாகிய யாவே உன்னைச் சிதறடித்த எல்லா மக்களினங்களிலிருந்தும்[b] உன்னை மறுபடியும் கூட்டிச் சேர்ப்பார்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இன்னும் நேரடியாக, “உன் சிறையிருப்பை மீட்டளிப்பார்” எனலாம். இந்த எபிரெய மரபுத்தொடர், துன்பம் அல்லது நாடுகடத்தல் நிலையிலிருந்து ஒருவரை மீட்டு அவரது நிலையைச் சீராக்குவதைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “எல்லா நாடுகளிலிருந்தும்.”
    reason: lexical_alternative
  - marker: c
    text: அல்லது, “அவர் திரும்பி உன்னைக் கூட்டிச் சேர்ப்பார்.”
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: யாவே
  rationale: தேவனுடைய உடன்படிக்கைப் பெயரை பொதுப்பட்டப் பெயராக மாற்றாமல், எபிரெயப் பெயரின் வழக்கமான தமிழாக்கமாக வழங்குகிறது.
- source_word: שָׁב ... אֶת שְׁבוּתְךָ
  choice: உன் வாழ்நிலையை மீண்டும் சீராக்கி
  rationale: இந்த எபிரெய மரபுத்தொடர் சிறையிருப்பை மட்டும் அல்லாமல், துன்ப நிலையிலிருந்து வாழ்வை மீட்டுச் சீராக்குவதையும் குறிக்கக்கூடும். அடுத்த பகுதியில் நாடுகளிலிருந்து கூட்டிச் சேர்ப்பது தனியாகக் கூறப்படுவதால், இங்கு விரிந்த மறுசீரமைப்புப் பொருள் இயல்பானது.
- source_word: וְרִחֲמֶךָ
  choice: உன்மேல் இரக்கம் காட்டுவார்
  rationale: רחם என்பதிலுள்ள கனிவும் இரக்கமுள்ள செயல்பாடும் நவீன தமிழில் தெளிவாக வெளிப்படுகிறது.
- source_word: וְשָׁב וְקִבֶּצְךָ
  choice: உன்னை மறுபடியும் கூட்டிச் சேர்ப்பார்
  rationale: இரண்டாவது שָׁב என்பதை ‘மறுபடியும்’ என்ற வினையடைப் பொருளில் கொண்டு, சிதறிய மக்களை மீண்டும் ஒன்றுசேர்க்கும் கருத்தை இயல்பான தமிழில் தருகிறது; தனி வினையாகப் புரிந்துகொள்ளும் வாய்ப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: מִכָּל הָעַמִּים
  choice: எல்லா மக்களினங்களிலிருந்தும்
  rationale: עַמִּים என்பது அரசியல் நாடுகளை மட்டுமல்ல, பல்வேறு மக்கள் குழுக்களையும் குறிக்கலாம்; ‘மக்களினங்கள்’ அந்தப் பன்மை உணர்வைத் தக்கவைக்கிறது.
- source_word: הֱפִיצְךָ
  choice: உன்னைச் சிதறடித்த
  rationale: Hiphil வடிவின் காரணவினைப் பொருளையும் நாடுகடத்தலின் வலிமையான படிமத்தையும் தக்கவைக்கிறது.
- source_word: שָׁמָּה
  choice: -இலிருந்தும்
  rationale: சொல்லுக்கு நேரடியாக ‘அங்கே’ என்று பொருள் இருந்தாலும், தொடர்புச் சொற்றொடரில் சிதறடிக்கப்பட்ட இடங்களிலிருந்து கூட்டிச் சேர்த்தல் எனத் தமிழில் இயல்பாக வெளிப்படுத்தப்பட்டுள்ளது.
theological_decisions:
- issue: שׁוּב אֶת־שְׁבוּת என்ற மரபுத்தொடரின் பொருள்
  choice: உன் வாழ்நிலையை மீண்டும் சீராக்கி
  alternative: உன் சிறையிருப்பைத் திருப்பி
  rationale: இந்தத் தொடர் ஒருவரின் துன்பநிலையை மாற்றி நல்வாழ்வை மீட்டளிப்பதைக் குறிக்கும் எபிரெய மரபுத்தொடராகப் பயன்படுகிறது. ‘சிறையிருப்பு’ என்ற சொல் மட்டும் பயன்படுத்தினால் பொருள் தேவையின்றிக் குறுகிவிடலாம்; எனினும் அதன் நேரடியான வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
- issue: இரண்டாவது וְשָׁב என்பதன் இலக்கண வலிமை
  choice: மறுபடியும் கூட்டிச் சேர்ப்பார்
  alternative: அவர் திரும்பி வந்து உன்னைக் கூட்டிச் சேர்ப்பார்
  rationale: இச்சொல் அடுத்த வினையுடன் சேர்ந்து ‘மீண்டும்’ எனப் பொருள்படலாம்; அல்லது தனி வினையாக ‘திரும்பி’ என்றும் கொள்ளலாம். முதன்மை உரை இயல்பான தமிழைத் தேர்ந்தெடுக்கிறது; மாற்றுப் புரிதலை அடிக்குறிப்பு வெளிப்படையாகப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய மூலத்தின் இரண்டாம் நபர் ஒருமையைத் தக்கவைக்க ‘உன்/உன்னை’ பயன்படுத்தப்பட்டுள்ளது. வசனத்தின் நீண்ட எபிரெய வாக்கிய அமைப்பு தமிழில் தெளிவுக்காக இரண்டு வாக்கியங்களாகப் பிரிக்கப்பட்டுள்ளது.
