  terminology: ‘வாழ்வு,’ ‘நன்மை,’ ‘சாவு,’ and ‘தீமை’ maintain the Hebrew parallelism and use accessible contemporary Tamil rather than unnecessarily sectarian register. The footnote responsibly identifies lexical alternatives for both the presentation verb and ‘தீமை.’
