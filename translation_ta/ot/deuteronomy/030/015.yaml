  source_fidelity: 'The translation accurately represents the Hebrew discourse imperative, first-person perfect presentation formula, temporal adverb, and the two balanced pairs: life/good and death/evil. ‘தீமை’ suitably preserves the breadth and deliberate antithesis of הָרָע without forcing it into either exclusively moral evil or calamity.'
