id: DEU.30.15
reference: Deuteronomy 30:15
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: רְאֵ֨ה נָתַ֤תִּי לְ/פָנֶ֨י/ךָ֙ הַ/יּ֔וֹם אֶת הַֽ/חַיִּ֖ים וְ/אֶת הַ/טּ֑וֹב וְ/אֶת הַ/מָּ֖וֶת וְ/אֶת הָ/רָֽע־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/030/015.yaml
  text: See[a], I have set before you today life and good[b], and death and evil.
translation:
  language: ta
  text: பார்[a], இன்று நான் உனக்கு முன்பாக வாழ்வையும் நன்மையையும், சாவையும் தீமையையும் வைத்திருக்கிறேன்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கவனி.”
    reason: lexical_alternative
  - marker: b
    text: “வைத்திருக்கிறேன்” என்பதற்கு “கொடுத்திருக்கிறேன்” அல்லது “முன்வைத்திருக்கிறேன்” என்றும் மொழிபெயர்க்கலாம். “தீமை” என்பது சில சூழல்களில் “கேடு” அல்லது “பேரிடர்” என்றும் பொருள்படும்; இங்கு அது “நன்மை”க்கு நேரெதிராக வைக்கப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: רְאֵה
  choice: பார்
  rationale: ראה என்பதன் ஒருமை ஆண்பால் கட்டளை வடிவம்; உரையாடலில் கவனத்தை ஈர்க்கும் நேரடியான அழைப்பை இயல்பான நவீன தமிழில் ‘பார்’ தக்கவைக்கிறது.
- source_word: נָתַתִּי
  choice: வைத்திருக்கிறேன்
  rationale: נתן என்பதற்கு ‘கொடு/வை/அமை’ என்ற பொருள்கள் உண்டு. לְפָנֶיךָ உடன் வரும்போது, தேர்வுக்குரியவற்றை ஒருவருக்கு முன் வைப்பதைக் குறிக்கும்; தமிழில் ‘உனக்கு முன்பாக ... வைத்திருக்கிறேன்’ இயல்பான இணைச்சொல்.
- source_word: לְפָנֶיךָ
  choice: உனக்கு முன்பாக
  rationale: ஒருவரின் தேர்வுக்காக அவருக்கு முன் விருப்பங்களை வைக்கும் எபிரெய மரபுத்தொடரைத் தெளிவாகக் காட்டுகிறது.
- source_word: הַיּוֹם
  choice: இன்று
  rationale: காலத்தைக் குறிக்கும் சொல்லின் நேரடியான, நவீனத் தமிழ் இணை.
- source_word: הַחַיִּים
  choice: வாழ்வு
  rationale: வடிவில் பன்மையாக இருந்தாலும் חַיִּים இங்கு ‘வாழ்வு’ என்னும் கருத்துப்பெயராகச் செயல்படுகிறது.
- source_word: הַטּוֹב
  choice: நன்மை
  rationale: טוֹב என்பதன் பரந்த பொருளைத் தக்கவைத்து, வாழ்வு/நன்மை மற்றும் சாவு/தீமை என்ற இணை எதிர்மறை அமைப்பைப் பாதுகாக்கிறது.
- source_word: הַמָּוֶת
  choice: சாவு
  rationale: வாழ்வுக்கு நேரெதிராக வரும் מָוֶת என்பதன் தெளிவான தமிழ் இணை; ‘வாழ்வு—சாவு’ என்பது இயல்பான நேரெதிர் இணை.
- source_word: הָרָע
  choice: தீமை
  rationale: רַע என்பது சூழலின்படி ஒழுக்கத் தீமை, கேடு, துன்பம் ஆகியவற்றைக் குறிக்கலாம். இங்கு ‘நன்மை’க்கு நேரெதிராக ‘தீமை’ என்பது சொல்லின் பரப்பையும் உடன்படிக்கைச் சூழலின் தீவிரத்தையும் தக்கவைக்கிறது.
theological_decisions:
- issue: உடன்படிக்கை சார்ந்த எதிர்மறை இணையில் הָרָע என்பதன் மொழிபெயர்ப்பு
  choice: தீமை
  alternative: கேடு அல்லது பேரிடர்
  rationale: வசனம் வாழ்வு/நன்மை மற்றும் சாவு/தீமை என்ற முழுமையான தேர்வை முன்வைக்கிறது. ‘தீமை’ என்பது ஒழுக்க மற்றும் வாழ்வியல் பரிமாணங்களைச் சுருக்காமல் காக்கிறது; அதேவேளை எபிரெயச் சொல் தீங்கான விளைவுகளையும் குறிக்கக்கூடும் என்பதை அடிக்குறிப்பு தெரிவிக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், ஒருமை இரண்டாம் நபர் உரையாடலைத் தக்கவைத்து, எபிரெய மூலத்தின் சுருக்கமான கட்டளைத் தொனியும் இணை எதிர்மறை அமைப்பும் பாதுகாக்கப்பட்டுள்ளன. ‘ஜீவன்’ போன்ற சமயப் பதிவுச் சொல்லுக்கு மாற்றாக பொதுவாக விளங்கும் ‘வாழ்வு’ பயன்படுத்தப்பட்டது.
