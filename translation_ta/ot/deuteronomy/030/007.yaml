  text: וְ/נָתַן֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ אֵ֥ת כָּל הָ/אָל֖וֹת הָ/אֵ֑לֶּה עַל אֹיְבֶ֥י/ךָ וְ/עַל שֹׂנְאֶ֖י/ךָ אֲשֶׁ֥ר רְדָפֽוּ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/030/007.yaml
  text: And Yahweh your God will put all these curses on your enemies and on those who hate you[a], who pursued you.
translation:
  language: ta
  text: உன் கடவுளாகிய யாவே, இந்தச் சாபங்கள் அனைத்தையும் உன் பகைவர்கள்மேலும் உன்னை வெறுத்துத் துரத்தியவர்கள்மேலும் சுமத்துவார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இந்தச் சத்திய உறுதிமொழிகள் அனைத்தையும்.” உபாகமத்தில் இச்சொல் பொதுவாக உடன்படிக்கையின் சாபங்களையோ தண்டனை அறிவிப்புகளையோ குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַן
  choice: சுமத்துவார்
  rationale: נתן என்பதற்கு ‘கொடு, வை, ஏற்படுத்து’ என்ற பரந்த பொருள் உண்டு. சாபங்கள் ஒருவர்மேல் வரச் செய்வதைத் தமிழில் இயல்பாகவும் சூழலுக்கு ஏற்றவாறும் ‘சுமத்துவார்’ எனக் கூறலாம்.
- source_word: יְהוָה
  choice: யாவே
  rationale: இது தேவனுடைய தனிப்பெயரான நான்கெழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: אֱלֹהֶיךָ
  choice: உன் கடவுளாகிய
  rationale: இரண்டாம் நபர் ஒருமை உடைமைப் பின்னொட்டைக் கொண்ட ‘உன் கடவுள்’ என்ற பொருளை, யாவே என்ற பெயருடன் இயல்பான தமிழ் தொடராகத் தருகிறது.
- source_word: כָּל הָאָלֹות הָאֵלֶּה
  choice: இந்தச் சாபங்கள் அனைத்தையும்
  rationale: உபாகமத்தின் உடன்படிக்கைச் சூழலில் אָלָה என்பது பொதுவாக உடன்படிக்கை மீறலுக்கான சாபங்களையோ தண்டனை அறிவிப்புகளையோ குறிக்கிறது; சொல் வரிசை தமிழின் இயல்புக்கு ஏற்ப அமைக்கப்பட்டுள்ளது.
- source_word: עַל אֹיְבֶיךָ
  choice: உன் பகைவர்கள்மேலும்
  rationale: עַל இங்கு சாபங்கள் எந்த நபர்கள்மேல் சுமத்தப்படுகின்றன என்பதைக் குறிக்கிறது; אֹיְבֶיךָ என்பதற்கான நேரான தமிழ் ‘உன் பகைவர்கள்’ ஆகும்.
- source_word: וְעַל שֹׂנְאֶיךָ
  choice: உன்னை வெறுத்து…வர்கள்மேலும்
  rationale: எபிரெயப் பங்கேற்புவினையின் ‘உன்னை வெறுப்பவர்கள்’ என்ற பொருளை அடுத்த உறவுநிலை வாக்கியத்துடன் இயல்பாக இணைக்கிறது.
- source_word: אֲשֶׁר רְדָפוּךָ
  choice: துரத்திய
  rationale: רדף என்பதன் அடிப்படைப் பொருளான ‘பின்தொடர், துரத்து’ என்பதைக் காக்கிறது; ‘துன்புறுத்தினர்’ என்று பொருளை மிகையாகக் குறிப்பாக்கவில்லை.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலத்தில் ஒரு பட்டம் அல்ல, தேவனுடைய தனிப்பெயரே உள்ளது. ஆகவே அதைத் தமிழில் ஒலிபெயர்த்து, பட்டத்தால் மாற்றாமல் காக்கிறது.
- issue: אָלֹות என்பதன் உடன்படிக்கைச் சூழலிலான பொருள்
  choice: சாபங்கள்
  alternative: ஆணைகள் / சத்தியங்கள்
  rationale: உபாகமம் 30-ன் உடனடிச் சூழலில் முன்பு அறிவிக்கப்பட்ட உடன்படிக்கைத் தண்டனைகளே குறிக்கப்படுகின்றன. இருப்பினும் சொல்லின் விரிவான பொருளை அடிக்குறிப்பு பதிவு செய்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. ‘சுமத்துவார்’ என்பது சாபங்கள் பகைவர்கள்மேல் வரச் செய்வதை இயல்பாக வெளிப்படுத்துகிறது; ‘வெறுத்துத் துரத்தியவர்கள்’ என்பது எபிரெய உரையின் தொடர்பையும் சுருக்கத்தையும் காக்கிறது. அடிக்குறிப்பு குறியீடு முழு கூற்றுக்குப் பின் வைக்கப்பட்டுள்ளது.
