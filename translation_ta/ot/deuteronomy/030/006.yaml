base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/030/006.yaml
  text: And Yahweh your God will circumcise your heart and the heart of your offspring[a], so that you may love Yahweh your God with all your heart and with all your soul[c][b], so that you may live.
translation:
  language: ta
  text: உன் கடவுளாகிய யாவே, நீ உன் முழு இதயத்தோடும் உன் முழு உயிரோடும்[b] உன் கடவுளாகிய யாவேவை நேசித்து வாழும்படியாக, உன் இதயத்தையும் உன் சந்ததியின் இதயத்தையும் விருத்தசேதனம் செய்வார்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “இதயத்தை விருத்தசேதனம் செய்வார்” என்பது உள்ளார்ந்த மாற்றத்தையும் உடன்படிக்கைக்குரிய பற்றுறுதியையும் குறிக்கும் உருவகம்.
    reason: cultural_note
  - marker: b
    text: “உயிர்” என்பதற்கான எபிரெயச் சொல் முழு மனிதரையும், அதாவது “முழு ஆளுமை” என்பதையும் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמָל
  choice: விருத்தசேதனம் செய்வார்
  rationale: மூல வினைச்சொல் நேரடியாக விருத்தசேதனத்தைக் குறிக்கிறது. இதயம் அதன் பொருளாக வருவதால் இது உருவகப் பயன்பாடு; உடன்படிக்கை அடையாளத்துடனான தொடர்பைப் பாதுகாக்க உருவகம் முதன்மை உரையில் தக்கவைக்கப்பட்டது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைத் திருப்பெயரை ஒரு பட்டத்தால் மாற்றாமல், எபிரெய தனிப்பெயரின் தமிழாக்க ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: אֱלֹהֶיךָ
  choice: உன் கடவுள்
  rationale: இரண்டாம் நபர் ஒருமை உடைமை விகுதியுடனான உடன்படிக்கைச் சொல்லாட்சியை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: לְבָבְךָ
  choice: உன் இதயம்
  rationale: இங்கு இதயம் என்பது உள்ளார்ந்த மனிதர், விருப்பம், பற்றுறுதி ஆகியவற்றை உள்ளடக்கும்; மூல உருவகத்தையும் பரந்த பொருளையும் காக்கிறது.
- source_word: לְבַב זַרְעֶךָ
  choice: உன் சந்ததியினரின் இதயம்
  rationale: זֶרַע என்பது விதை, வழித்தோன்றல், சந்ததி என்று பொருள்படலாம். சூழலில் பல தலைமுறைகளைக் குறிக்கும் கூட்டுப் பொருளை 'சந்ததியினர்' இயல்பாக வெளிப்படுத்துகிறது.
- source_word: לְאַהֲבָה
  choice: நேசித்து
  rationale: לְ உடனான வினையெச்ச வடிவம் இங்கு நோக்கம் அல்லது விளைவைச் சுட்டுகிறது. முந்தைய தெய்வீகச் செயலின் விளைவாக அடுத்த செயல் நிகழ்வதைத் தமிழில் இயல்பாகக் காட்டுகிறது.
- source_word: בְּכָל לְבָבְךָ
  choice: உன் முழு இதயத்தோடும்
  rationale: முழுமையான உடன்படிக்கைப் பற்றுறுதியைக் குறிக்கும் சொல்லாட்சியைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: וּבְכָל נַפְשְׁךָ
  choice: உன் முழு ஆத்துமாவோடும்
  rationale: נֶפֶשׁ உயிர், தன் முழு ஆளுமை, ஆத்துமா எனப் பொருள்படலாம். இணைச் சொல்லாட்சியின் பாரம்பரிய ஒலியையும் மூலத்தின் பரப்பையும் காக்க 'ஆத்துமா' பயன்படுத்தப்பட்டு, மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்பட்டது.
- source_word: לְמַעַן חַיֶּיךָ
  choice: வாழ்வாய்
  rationale: לְמַעַן நோக்கம் அல்லது விளைவைக் குறிக்கிறது; 'நீ வாழும்படி' என்ற அர்த்தத்தைச் சுருக்கமான இயல்பான தமிழில் தருகிறது.
theological_decisions:
- issue: இதய விருத்தசேதனம் என்ற உடன்படிக்கை உருவகம்
  choice: '''உன் இதயத்தை ... விருத்தசேதனம் செய்வார்'' என்ற உருவகம் தக்கவைக்கப்பட்டது.'
  alternative: '''உன் இதயத்தை மாற்றுவார்'' அல்லது ''தூய்மைப்படுத்துவார்'''
  rationale: உடன்படிக்கையின் உடல் அடையாளத்தையும் கடவுள் நிகழ்த்தும் உள்ளார்ந்த மாற்றத்தையும் மூல உரை திட்டமிட்டு இணைக்கிறது. அதை விளக்கவுரையாக மாற்றாமல் அந்த இறையியல் நெருக்கடியும் உருவகமும் பாதுகாக்கப்படுகின்றன.
- issue: נֶפֶשׁ என்பதன் பொருள்
  choice: முதன்மை உரையில் 'ஆத்துமா'
  alternative: '''உயிர்'' அல்லது ''முழு ஆளுமை'''
  rationale: இச்சொல் தனித்த உடலற்ற கூறை மட்டும் அவசியமாகக் குறிக்காது; வாழும் முழு மனிதரையும் குறிக்கலாம். பரிச்சயமான கட்டளைக் கூறைத் தக்கவைத்தபடியே அதன் பரந்த பொருள் அடிக்குறிப்பில் தெரிவிக்கப்பட்டது.
- issue: לְמַעַן חַיֶּיךָ என்பதிலுள்ள நோக்கம்/விளைவு உறவு
  choice: '''நேசித்து வாழ்வாய்'''
  alternative: '''நீ வாழும்படி ... நேசிப்பாய்'''
  rationale: எபிரெயத்தில் நோக்கமும் விளைவும் நெருக்கமாக உள்ளன. தமிழ் வடிவம் வாழ்வை அந்த உள்ளார்ந்த புதுப்பிப்பும் முழுமையான அன்பும் தரும் விளைவாகக் காட்டுகிறது; ஒரே ஒரு முறையான காரணவியல் விளக்கத்தைத் திணிக்கவில்லை.
translation_notes:
  register: நவீன தரத் தமிழில், ஒருமை அழைப்பைத் தெளிவாகக் காட்ட 'உன்' பயன்படுத்தப்பட்டது. இறைத் திருப்பெயர் 'யாவே' என ஒலிபெயர்க்கப்பட்டது. 'விருத்தசேதனம்' பொதுவாக அறியப்பட்ட வேதாகமச் சொல்லாக இருப்பதுடன், மூலத்தின் வலுவான உடன்படிக்கை உருவகத்தையும் தக்கவைக்கிறது.
