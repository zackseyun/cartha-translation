revisions:
- from: உன் கடவுளாகிய யாவே உன் இதயத்தையும் உன் சந்ததியினரின் இதயத்தையும் விருத்தசேதனம் செய்வார்[a]. அப்போது நீ உன் முழு இதயத்தோடும் உன் முழு ஆத்துமாவோடும்[b] உன் கடவுளாகிய யாவேவை நேசித்து வாழ்வாய்.
  to: உன் கடவுளாகிய யாவே, நீ உன் முழு இதயத்தோடும் உன் முழு உயிரோடும்[b] உன் கடவுளாகிய யாவேவை நேசித்து வாழும்படியாக, உன் இதயத்தையும் உன் சந்ததியின் இதயத்தையும் விருத்தசேதனம் செய்வார்[a].
  rationale: The revision preserves the metaphor rather than paraphrasing it, retains the collective sense of ‘offspring,’ and makes the Hebrew purposive progression explicit without imposing a doctrinal interpretation. The footnote anchors remain attached to the relevant expressions.
