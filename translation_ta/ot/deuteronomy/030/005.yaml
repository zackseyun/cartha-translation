  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וֶ/הֱבִֽיאֲ/ךָ֞ יְהוָ֣ה אֱלֹהֶ֗י/ךָ אֶל הָ/אָ֛רֶץ אֲשֶׁר יָרְשׁ֥וּ אֲבֹתֶ֖י/ךָ וִֽ/ירִשְׁתָּ֑/הּ וְ/הֵיטִֽבְ/ךָ֥ וְ/הִרְבְּ/ךָ֖ מֵ/אֲבֹתֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/030/005.yaml
  text: And Yahweh your God will bring you into the land that your fathers possessed[a], and you will possess it[b]; and he will prosper you and multiply you more than your fathers.
translation:
  language: ta
  text: உன் கடவுளாகிய யாவே, உன் தந்தையர் உரிமையாக்கிக்கொண்ட நாட்டிற்கு உன்னைக் கொண்டுவருவார்; நீயும் அதை உரிமையாக்கிக்கொள்வாய். அவர் உன் தந்தையரைவிட உனக்கு நன்மை செய்து[a], உன்னை எண்ணிக்கையில் பெருகச் செய்வார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உன்னைச் செழிக்கச் செய்து.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וֶהֱבִיאֲךָ
  choice: உன்னைக் கொண்டுவருவார்
  rationale: בוא என்பதன் ஹிஃபில் வடிவம் ‘உள்ளே கொண்டுவருதல்’ எனப் பொருள்படும். சூழலில் திரும்பக் கொண்டுவருதல் உட்குறிப்பாக இருந்தாலும், ‘திரும்ப’ என்பது இவ்வினைச்சொல்லில் வெளிப்படையாக இல்லை.
- source_word: יְהוָה
  choice: யாவே
  rationale: திருநான்கெழுத்தாகிய இறைப்பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் இயல்பான ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: אֱלֹהֶיךָ
  choice: உன் கடவுளாகிய
  rationale: இரண்டாம் நபர் ஒருமை உரிமை விகுதியுடன் உள்ள ‘உன் கடவுள்’ என்ற நேரடிப் பொருளை, யாவே என்னும் பெயருடன் இயல்பாக இணைக்கிறது.
- source_word: הָאָרֶץ
  choice: நாட்டிற்கு
  rationale: இங்கு இஸ்ரவேலின் முன்னோர் உரிமையாக்கிக்கொண்ட வாக்குத்தத்தப் பிரதேசம் குறிக்கப்படுகிறது; ‘நாடு’ நவீன தமிழில் இயல்பாகவும் புவியியல் பொருளைத் தெளிவாகவும் தருகிறது.
- source_word: אֲשֶׁר יָרְשׁוּ אֲבֹתֶיךָ
  choice: உன் தந்தையர் உரிமையாக்கிக்கொண்ட
  rationale: ירשׁ என்பதில் மரபுரிமை பெறுதல் மற்றும் உடைமையாக்குதல் ஆகிய இரு நிழற்பொருள்களும் உள்ளன. இச்சூழலில் முன்னோர் நாட்டைக் கைப்பற்றி உடைமையாக்கிய செயற்பாட்டுப் பொருளை ‘உரிமையாக்கிக்கொண்ட’ காக்கிறது.
- source_word: וִירִשְׁתָּהּ
  choice: நீயும் அதை உரிமையாக்கிக்கொள்வாய்
  rationale: முந்தைய ירשׁ வினையுடனான சொல்லியல் இணைப்பைக் காத்து, நாட்டை உடைமையாக்கும் செயற்பாட்டை இயல்பான தமிழில் தருகிறது.
- source_word: וְהֵיטִבְךָ
  choice: அவர் உனக்கு நன்மை செய்து
  rationale: יטב என்பதன் ஹிஃபில் வடிவத்தின் அடிப்படைப் பொருள் ‘ஒருவருக்கு நன்மை செய்தல்.’ ‘செழிக்கச் செய்தல்’ என்ற சூழல்சார் பொருளை மட்டும் தேர்ந்தெடுக்காமல் விரிவான எபிரெயப் பொருளைக் காக்கிறது.
- source_word: וְהִרְבְּךָ
  choice: உன்னைப் பெருகச் செய்வார்
  rationale: רבה என்பதன் ஹிஃபில் வடிவம் ‘பெருகச் செய்தல்/எண்ணிக்கையில் அதிகரிக்கச் செய்தல்’ எனப் பொருள்படும்; முற்பிதாக்களுக்கான பெருக்க வாக்குறுதியின் எதிரொலியையும் இது காக்கிறது.
- source_word: מֵאֲבֹתֶיךָ
  choice: உன் தந்தையரைவிட
  rationale: ஒப்பீட்டைக் குறிக்கும் מן என்பதை நேரடியாகத் தருகிறது; אבות என்ற ஆண்பால் பன்மை உறவுச் சொல்லையும் காக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலத்தில் தனிப்பட்ட உடன்படிக்கைப் பெயர் நேரடியாக உள்ளது. அதைப் பட்டமாக மாற்றாமல் ஒலிபெயர்ப்பது மூலத்தின் வேறுபாட்டைக் காக்கிறது.
- issue: אֲבֹתֶיךָ என்ற பாலினம் குறித்த உறவுச் சொல்
  choice: உன் தந்தையர்
  alternative: உன் முன்னோர்
  rationale: மூலம் வெளிப்படையாக ஆண்பால் பன்மைச் சொல்லைப் பயன்படுத்துவதால் அதை முதன்மை உரையில் காக்கிறது; இங்கு அது இஸ்ரவேலின் முற்பிதாக்களைக் குறிக்கிறது.
- issue: וְהֵיטִבְךָ என்பதன் ஆசீர்வாதப் பொருள்
  choice: உனக்கு நன்மை செய்து
  alternative: உன்னைச் செழிக்கச் செய்து
  rationale: எபிரெய வினையின் விரிவான ‘நன்மை செய்தல்’ என்ற பொருளைத் தேர்ந்தெடுத்து, அதை பொருளாதாரச் செழிப்பாக மட்டும் சுருக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், ஒருமை இரண்டாம் நபரைக் காத்து, மரியாதையும் வாசிப்புத் தெளிவும் உள்ள நடையில் மொழிபெயர்க்கப்பட்டது. ‘உரிமையாக்கிக்கொள்’ என்பது ירשׁ வினையின் மரபுரிமை/உடைமை நிழற்பொருள்களையும் இரு இடங்களிலுள்ள சொல்லியல் இணைப்பையும் இயன்றவரை காக்கிறது.
