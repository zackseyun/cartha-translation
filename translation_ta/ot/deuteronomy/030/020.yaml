  source_fidelity: திருத்தம் தேவை. נִשְׁבַּע என்பது ‘சத்தியம் செய்தார்/ஆணையிட்டு உறுதிமொழி செய்தார்’ என்பதே; வரைவின் ‘ஆணையிட்ட’ என்பது ‘கட்டளையிட்டார்’ எனப் பொருள்பட்டு மூலத்தின் உறுதிமொழிச் செயலை மாற்றுகிறது. இறுதி לָתֵת לָהֶם (‘அவர்களுக்குக் கொடுப்பதற்கு’) என்பதும் தெளிவாக யாவே செய்த சத்தியத்தின் உள்ளடக்கமாக இணைக்கப்பட வேண்டும்.
