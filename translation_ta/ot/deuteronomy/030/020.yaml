base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/030/020.yaml
  text: by loving Yahweh your God[a], by listening to his voice, and by holding fast to him; for he is your life and the length of your days, that you may dwell on the land that Yahweh swore to your fathers, to Abraham, to Isaac, and to Jacob[c][b], to give to them.
translation:
  language: ta
  text: உன் கடவுளாகிய யாவேவை நேசிப்பதன் மூலமும், அவருடைய குரலுக்குச் செவிகொடுப்பதன் மூலமும்[a], அவரைப் பற்றிக்கொள்வதன் மூலமும்[b]; ஏனெனில், அவரே உன் வாழ்வும் உன் நாட்களின் நீளமும் ஆவார்; யாவே உன் தந்தையரான[c] ஆபிரகாம், ஈசாக்கு, யாக்கோபு ஆகியோருக்குக் கொடுப்பதாகச் சத்தியம் செய்த நாட்டில் நீ குடியிருப்பதற்காக.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவருடைய குரலுக்குக் கீழ்ப்படிவதன் மூலமும்.” “குரலுக்குச் செவிகொடு” என்ற எபிரெய மரபுத்தொடர், கேட்டுப் பின்பற்றுவதையும் கீழ்ப்படிவதையும் அடிக்கடி குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அவரோடு நெருக்கமாக இணைந்திருப்பதன் மூலமும்.”
    reason: lexical_alternative
  - marker: c
    text: அல்லது, “உன் முன்னோர்களான.” எபிரெயத்தில் “தந்தையர்” என்ற சொல்லே உள்ளது; அதைத் தொடர்ந்து ஆபிரகாம், ஈசாக்கு, யாக்கோபு என்ற பெயர்கள் வருகின்றன.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְאַהֲבָה אֶת יְהוָה אֱלֹהֶיךָ
  choice: உன் கடவுளாகிய யெகோவாவை நேசித்து
  rationale: לְ prefixed infinitive forms continue the preceding exhortation and describe how choosing life is enacted. Tamil coordinated participles naturally preserve that flow. The divine name is transliterated rather than replaced by a title.
- source_word: לִשְׁמֹעַ בְּקֹלוֹ
  choice: அவருடைய குரலுக்குச் செவிகொடுத்து
  rationale: The concrete Hebrew idiom is retained in natural Tamil; its contextual sense of heeding or obeying is noted without replacing the image in the main text.
- source_word: וּלְדָבְקָה בוֹ
  choice: அவரைப் பற்றிக்கொண்டிரு
  rationale: דבק denotes close, continuing attachment and covenant loyalty. This Tamil expression is current and vivid without being archaic.
- source_word: כִּי הוּא חַיֶּיךָ וְאֹרֶךְ יָמֶיךָ
  choice: ஏனெனில், அவரே உன் வாழ்வும் உன் நீண்ட ஆயுளுமாய் இருக்கிறார்
  rationale: הוּא is read most naturally as referring to Yahweh. ‘உன் நீண்ட ஆயுள்’ communicates the Hebrew idiom ‘length of your days’ naturally while preserving its duration-of-life sense.
- source_word: לָשֶׁבֶת עַל הָאֲדָמָה
  choice: நாட்டில் நீ குடியிருப்பாய்
  rationale: In this covenantal context אֲדָמָה denotes the promised land, and ישׁב denotes settled residence. The Tamil clause expresses the purpose/result relation idiomatically.
- source_word: אֲשֶׁר נִשְׁבַּע יְהוָה ... לָתֵת לָהֶם
  choice: கொடுப்பதாக யெகோவா ஆணையிட்ட
  rationale: נשבע is explicitly oath language; ‘ஆணையிட்ட’ preserves that stronger covenantal force rather than reducing it to an ordinary promise.
- source_word: לַאֲבֹתֶיךָ לְאַבְרָהָם לְיִצְחָק וּלְיַעֲקֹב
  choice: உன் தந்தையரான ஆபிரகாமுக்கும் ஈசாக்குக்கும் யாக்கோபுக்கும்
  rationale: ‘தந்தையர்’ retains the masculine source term and is immediately clarified by the named patriarchs.
theological_decisions:
- issue: Referent of הוּא in ‘for he is your life’
  choice: 'யெகோவாவையே குறிக்கும் தனிப்பட்ட ஆண்பால் சுட்டுப்பெயர்: ‘அவரே உன் வாழ்வு’'
  alternative: முன்னர் கூறப்பட்ட உடன்படிக்கைக் கீழ்ப்படிதலின் வழியை ஒட்டுமொத்தமாகக் குறிக்கிறது
  rationale: The nearest and most salient antecedent is Yahweh, and the masculine singular pronoun favors the personal referent, though the broader covenant-obedience association remains conceptually present.
- issue: Relationship of the final infinitive לָתֵת to the oath and the ancestors
  choice: யெகோவா அந்த நாட்டை ஆபிரகாம், ஈசாக்கு, யாக்கோபு ஆகியோருக்குக் கொடுப்பதாக ஆணையிட்டார்
  alternative: அவர்களின் சந்ததியினருக்கு மட்டும் கொடுப்பதாக வாக்குறுதி அளித்தார்
  rationale: The Hebrew explicitly says ‘to give to them.’ The translation retains the named ancestors as the grammatical recipients and does not silently substitute their descendants.
translation_notes:
  register: நவீனத் தரத் தமிழில், ஒருமை இரண்டாம் நபர் வடிவங்கள் மூலத்தின் 2ms முகவரியைப் பாதுகாக்கின்றன. யெகோவாவைக் குறிப்பிடும் இடங்களில் மரியாதைப் பன்மை பயன்படுத்தப்பட்டுள்ளது. நடை கண்ணியமானதும் பொதுவாசகர்களுக்கு இயல்பானதும் ஆகும்; எபிரெய உருவகங்களான ‘குரலுக்குச் செவிகொடுத்தல்’ மற்றும் ‘பற்றிக்கொள்ளுதல்’ இயன்றவரை பாதுகாக்கப்பட்டுள்ளன.
