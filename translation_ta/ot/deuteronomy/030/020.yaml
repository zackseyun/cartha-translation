revisions:
- from: உன் கடவுளாகிய யெகோவாவை நேசித்து, அவருடைய குரலுக்குச் செவிகொடுத்து[a], அவரைப் பற்றிக்கொண்டிரு[b]. ஏனெனில், அவரே உன் வாழ்வும் உன் நீண்ட ஆயுளுமாய் இருக்கிறார். இவ்வாறு, உன் தந்தையரான ஆபிரகாமுக்கும் ஈசாக்குக்கும் யாக்கோபுக்கும் கொடுப்பதாக யெகோவா ஆணையிட்ட நாட்டில் நீ குடியிருப்பாய்[c].
  to: உன் கடவுளாகிய யாவேவை நேசிப்பதன் மூலமும், அவருடைய குரலுக்குச் செவிகொடுப்பதன் மூலமும்[a], அவரைப் பற்றிக்கொள்வதன் மூலமும்[b]; ஏனெனில், அவரே உன் வாழ்வும் உன் நாட்களின் நீளமும் ஆவார்; யாவே உன் தந்தையரான[c] ஆபிரகாம், ஈசாக்கு, யாக்கோபு ஆகியோருக்குக் கொடுப்பதாகச் சத்தியம் செய்த நாட்டில் நீ குடியிருப்பதற்காக.
  rationale: மூல எபிரெயத்தின் உறுதிமொழி வினை நம்பகமாக ‘சத்தியம் செய்த’ எனத் திருத்தப்பட்டுள்ளது. மூன்று இணையான infinitive-களும் தமிழில் இணையான ‘...மூலமும்’ வடிவங்களில் தரப்பட்டுள்ளன. இறுதி நாட்டுவாக்குறுதி, பெயரிடப்பட்ட தந்தையருக்குக் கொடுப்பதாக யாவே செய்த சத்தியம் என இலக்கணரீதியாகத் தெளிவுபடுத்தப்பட்டுள்ளது; நோக்கம்/விளைவு உறவு ‘குடியிருப்பதற்காக’ என்பதில் பாதுகாக்கப்படுகிறது. அடிக்குறிப்பு c இப்போது மூலத்தில் உள்ள ‘தந்தையர்’ சொல்லின் இடத்தில் சரியாக இணைக்கப்பட்டுள்ளது.
