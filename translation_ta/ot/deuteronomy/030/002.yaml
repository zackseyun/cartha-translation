base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/030/002.yaml
  text: and you return to Yahweh your God and obey his voice[a], according to all that I am commanding you today, you and your children, with all your heart and with all your soul[c][b],
translation:
  language: ta
  text: நீ உன் இறைவனாகிய யாவேவிடம் திரும்பி, நீயும் உன் பிள்ளைகளும் இன்று நான் உனக்குக் கட்டளையிடுகிற அனைத்தின்படியும், உங்கள் முழு இதயத்தோடும் உங்கள் முழு உயிரோடும் அவருடைய குரலுக்குக் கீழ்ப்படிவீர்கள்[a][b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவருடைய குரலுக்குச் செவிகொடுப்பீர்கள்.” எபிரேயச் சொற்றொடர் பொதுவாகக் கேட்டுக் கீழ்ப்படிதல் என்ற வலுவான பொருளைக் கொண்டது.
    reason: lexical_alternative
  - marker: b
    text: எபிரேயத்தில், “உன் மகன்கள்.” இவ்வுடன்படிக்கைச் சூழலில் இச்சொல் பொதுவாகச் சந்ததியாரைக் குறிக்கக்கூடும் என்பதால், “உன் பிள்ளைகள்” என்று மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, “உங்கள் முழு வாழ்வோடும்” அல்லது “உங்கள் முழு ஆளுமையோடும்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׁבְתָּ עַד
  choice: திரும்பி ... இடம்
  rationale: שׁוּב என்பதன் அடிப்படைப் பொருளான ‘திரும்புதல்’ என்பதைப் பேணி, மனந்திரும்புதல் என்ற இறையியல் சொல்லை நேரடியாகப் புகுத்தாமல் உடன்படிக்கைச் சூழலின் வலிமையைத் தக்கவைக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: திருநான்கெழுத்தான இறைப்பெயரை ஒரு பட்டப்பெயரால் மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: וְשָׁמַעְתָּ בְקֹלוֹ
  choice: அவருடைய குரலுக்குக் கீழ்ப்படிவாய்
  rationale: שׁמע בקול என்பது வெறுமனே கேட்பதைவிட செவிகொடுத்துக் கீழ்ப்படிதலைக் குறிக்கும்; அதேவேளை ‘குரல்’ என்ற எபிரேய உருவகத்தையும் பேணுகிறது.
- source_word: כְּכֹל אֲשֶׁר אָנֹכִי מְצַוְּךָ הַיּוֹם
  choice: இன்று நான் உனக்குக் கட்டளையிடும் எல்லாவற்றின்படியும்
  rationale: கட்டளையின் முழு வரம்புக்கும் இணங்குதல் என்ற பொருளையும் ‘இன்று’ என்ற காலக் குறிப்பையும் இயல்பான தமிழில் தருகிறது.
- source_word: אַתָּה וּבָנֶיךָ
  choice: நீயும் உன் பிள்ளைகளும்
  rationale: בנים என்பதன் ஆண்பால் வடிவம் இவ்வுடன்படிக்கைச் சூழலில் சந்ததியாரை பொதுவாகக் குறிக்கக்கூடும்; ‘பிள்ளைகள்’ அந்த விரிவைத் துல்லியமாக வெளிப்படுத்துகிறது.
- source_word: בְּכָל לְבָבְךָ
  choice: உன் முழு இதயத்தோடும்
  rationale: ‘இதயம்’ என்பது சித்தம் மற்றும் உள்ளார்ந்த மனிதரை உள்ளடக்கும் எபிரேயப் பயன்பாட்டை அறிமுகமான தமிழ்ச் சொற்றொடரில் பேணுகிறது.
- source_word: וּבְכָל נַפְשֶׁךָ
  choice: உன் முழு உயிரோடும்
  rationale: נפשׁ இங்கு உயிர், தன்னையே, முழு ஆளுமை ஆகிய பொருள் நிழல்களைக் கொண்டது; ‘உயிர்’ தமிழில் இயல்பாக இருந்து மனிதரின் முழுமையான ஈடுபாட்டை உணர்த்துகிறது.
theological_decisions:
- issue: יְהוָה என்ற உடன்படிக்கைப் பெயரின் மொழியாக்கம்
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலத்தில் வரும் தனிப்பட்ட இறைப்பெயரைப் பட்டப்பெயராக மாற்றாமல் ஒலிபெயர்ப்பது உரைச் சான்றை நேரடியாகப் பேணுகிறது.
- issue: בָנֶיךָ என்பதன் வரம்பு
  choice: உன் பிள்ளைகள்
  alternative: உன் மகன்கள்
  rationale: எபிரேய ஆண்பால் பன்மை இங்கு சந்ததியார் அனைவரையும் பொதுவாகக் குறிக்க வாய்ப்புள்ளதால் தேவையற்ற ஆண்-மட்டும் பொருளைத் தவிர்க்கிறது.
- issue: נֶפֶשׁ என்பதன் மனிதவியல் பொருள்
  choice: உயிர்
  alternative: ஆத்துமா / முழு ஆளுமை
  rationale: நפשׁ என்பதை உடலிலிருந்து பிரிந்த ஓர் அம்சமாக மட்டும் வரையறுக்காமல், உயிர் அல்லது முழுத் தன்னைச் சுட்டும் மூலமொழியின் பொருள் விரிவைத் தக்கவைக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் ஒருமை இரண்டாம் நபரைத் தக்கவைத்து, கண்ணியமான வேதாகம நடையைப் பயன்படுத்துகிறது. வாக்கிய ஓட்டத்தை இயல்பாக்கினாலும் மூலத்தின் தொடர் அமைப்பும் ‘குரல்’, ‘இதயம்’, ‘உயிர்’ ஆகிய உருவகங்களும் பாதுகாக்கப்பட்டுள்ளன.
