source:
  edition: WLC
  text: כִּ֚י הַ/מִּצְוָ֣ה הַ/זֹּ֔את אֲשֶׁ֛ר אָנֹכִ֥י מְצַוְּ/ךָ֖ הַ/יּ֑וֹם לֹֽא נִפְלֵ֥את הִוא֙ מִמְּ/ךָ֔ וְ/לֹ֥א רְחֹקָ֖ה הִֽוא־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/030/011.yaml
  text: For this commandment that I am commanding you today is not too difficult for you[a], nor is it far away.
translation:
  language: ta
  text: ஏனெனில், இன்று நான் உனக்குக் கட்டளையிடும் இந்தக் கட்டளை உனக்கு எட்டாதது அல்ல[a]; அது தொலைவிலும் இல்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உனக்கு மிகவும் கடினமானது அல்ல” அல்லது “உனக்கு மறைக்கப்பட்டதல்ல.” எபிரெய வினைச்சொல், அசாதாரணமானது, அணுக முடியாதது, அல்லது ஒருவரின் புரிதலுக்கு அப்பாற்பட்டது என்ற பொருள்களையும் தரக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய அறிவுறுத்தலுக்கான விளக்கத்தை அறிமுகப்படுத்தும் இணைப்புச் சொல்லாக இருப்பதால், உரையோட்டத்தில் இயல்பாக அமைகிறது.
- source_word: הַמִּצְוָה הַזֹּאת
  choice: இந்தக் கட்டளை
  rationale: מִצְוָה என்பதன் சட்ட மற்றும் உடன்படிக்கைச் சூழலைத் தெளிவாகவும் இயல்பான நவீன தமிழிலும் வெளிப்படுத்துகிறது.
- source_word: אֲשֶׁר אָנֹכִי מְצַוְּךָ הַיּוֹם
  choice: இன்று நான் உனக்குக் கட்டளையிடும்
  rationale: மோசே இப்போது நேரடியாக உரையாற்றும் உடனடித் தன்மையையும், எபிரெய உரையின் ஒருமை முன்னிலையையும் காக்கிறது.
- source_word: לֹא נִפְלֵאת הִוא מִמְּךָ
  choice: உனக்கு எட்டாதது அல்ல
  rationale: פלא என்பதிலுள்ள அசாதாரணமானது, அணுக முடியாதது, ஒருவரின் புரிதல் அல்லது ஆற்றலுக்கு அப்பாற்பட்டது ஆகிய பொருள் வாய்ப்புகளை ஒரே குறுகிய தமிழ்ச் சொற்றொடரில் ஓரளவு தக்கவைக்கிறது; வெறும் சிரமம் என்ற பொருளுக்குள் அதைச் சுருக்கவில்லை.
- source_word: וְלֹא רְחֹקָה הִוא
  choice: அது தொலைவிலும் இல்லை
  rationale: רָחוֹק குறிக்கும் இட அல்லது உருவகத் தொலைவை இயல்பான தமிழில் காத்து, அடுத்த வசனங்களில் விரிவாகும் அணுகத்தக்க தன்மை என்ற உருவகத்தையும் நிலைநிறுத்துகிறது.
theological_decisions:
- issue: நִפְלֵאת என்பது மனித ஆற்றலையும் உடன்படிக்கைக் கீழ்ப்படிதலையும் குறித்து உணர்த்தும் பொருள்
  choice: கட்டளை ‘உனக்கு எட்டாதது அல்ல’ என்று மொழிபெயர்க்கப்பட்டது.
  alternative: ‘உனக்கு மிகவும் கடினமானது அல்ல’ அல்லது ‘உனக்கு மறைக்கப்பட்டதல்ல’
  rationale: உடனடி உடன்படிக்கைச் சூழலில் கட்டளை அணுக முடியாததாகவோ புரிந்துகொள்ள முடியாததாகவோ இல்லை என்பதே வலியுறுத்தப்படுகிறது. இந்த மொழிபெயர்ப்பு, மனிதன் உதவியின்றியே ஒழுக்க ரீதியாக அனைத்தையும் செய்ய வல்லவன் என்ற விரிவான கோட்பாட்டுக் கூற்றைச் சேர்க்காமல், மூல உரையின் இறையியல் இழுபறியைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியும் ஆனால் கண்ணியமான நடையில் அமைக்கப்பட்டுள்ளது. ‘நீ’ என்ற ஒருமை வடிவம் மூல உரையின் இரண்டாம் நபர் ஒருமையைப் பாதுகாக்கிறது; ‘கட்டளை’ என்பது உபாகமத்தின் உடன்படிக்கை மற்றும் சட்டப் பதிவுக்கு ஏற்றதாகும்.
