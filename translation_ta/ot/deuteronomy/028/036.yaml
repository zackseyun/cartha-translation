base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/036.yaml
  text: Yahweh will bring you and the king whom you set over yourself to a nation that neither you nor your fathers have known[a], and there you will serve other gods[b], wood and stone.
translation:
  language: ta
  text: யாவே உன்னையும், உனக்குமேல் நீ நியமிக்கும் அரசனையும், நீயும் உன் தந்தையரும் அறியாத ஒரு நாட்டுக்குக் கொண்டுபோவார்; அங்கே நீ மரமும் கல்லுமான வேறு தெய்வங்களுக்குப் பணிசெய்வாய்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “பணிசெய்வாய்” என்பதை “வழிபடுவாய்” என்றும் மொழிபெயர்க்கலாம்; எபிரெய வினைச்சொல்லின் நேர்ப்பொருள் “சேவைசெய்” அல்லது “பணிசெய்” என்பதாகும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: יוֹלֵךְ
  choice: கொண்டுபோவார்
  rationale: הלך என்பதன் ஹிஃபில் வடிவம் ‘போகச் செய்வார்’ என்ற காரணவினைப் பொருளைக் கொண்டது. சாபத்தின் சூழலில் ‘கொண்டுபோவார்’ இயல்பாகவும், நாடுகடத்தல் என்பதை மூலத்தைவிட மிகைப்படுத்தாமலும் உள்ளது.
- source_word: יְהוָה
  choice: யாவே
  rationale: திருப்பெயரான יהוה-ஐ ஒரு பட்டப்பெயரால் மாற்றாமல், அதன் பொதுவான தமிழ் ஒலிபெயர்ப்பான ‘யாவே’ என்று வழங்குகிறது.
- source_word: מַלְכְּךָ אֲשֶׁר תָּקִים עָלֶיךָ
  choice: நீ உன்மேல் ஏற்படுத்தும் அரசன்
  rationale: קום என்பதன் ஹிஃபில் வடிவம் இங்கு ஓர் அரசனை நிறுவுதல் அல்லது நியமித்தலைக் குறிக்கிறது; עָלֶיךָ என்பதையும் ‘உன்மேல்’ எனத் தக்கவைக்கிறது.
- source_word: גּוֹי
  choice: ஒரு நாடு
  rationale: גוי இங்கு அந்நிய அரசியல்-மக்கள் அமைப்பைக் குறிப்பதால் ‘நாடு’ பொருத்தமானது.
- source_word: אֲשֶׁר לֹא יָדַעְתָּ אַתָּה וַאֲבֹתֶיךָ
  choice: நீயும் உன் தந்தையரும் அறியாத
  rationale: எபிரெய வாக்கியத்தின் கூட்டு மறுப்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது; אבותיך என்ற ஆண்பால் உறவுச் சொல்லை ‘தந்தையர்’ எனப் பாதுகாக்கிறது.
- source_word: וְעָבַדְתָּ שָׁם
  choice: அங்கே நீ … பணிசெய்வாய்
  rationale: עבד என்பதன் அடிப்படை ‘பணிசெய்/சேவைசெய்’ பொருளைப் பாதுகாக்கிறது; தெய்வங்கள் என்ற பொருள் மதவழிபாட்டுச் சூழலைத் தெளிவாக்குகிறது.
- source_word: אֱלֹהִים אֲחֵרִים
  choice: வேறு தெய்வங்கள்
  rationale: உடன்படிக்கைச் சூழலின் நிலையான சொற்றொடரை நேரடியாக வழங்குகிறது.
- source_word: עֵץ וָאָבֶן
  choice: மரமும் கல்லுமான
  rationale: தெய்வங்களாகச் சேவிக்கப்படும் உருவங்களின் பொருட்தன்மையைத் தமிழில் தெளிவாகக் காட்டுகிறது; ‘மரமும் கல்லும்’ என்ற எபிரெய இணைப்பையும் தக்கவைக்கிறது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் தனிப்பட்ட உடன்படிக்கைப் பெயர் நேரடியாக இருப்பதால், அதை ஒரு பட்டப்பெயராக மாற்றாமல் ஒலிபெயர்க்கிறது.
- issue: וַאֲבֹתֶיךָ என்ற பாலினம் குறிக்கப்பட்ட உறவுச்சொல்
  choice: உன் தந்தையர்
  alternative: உன் முன்னோர்
  rationale: மூலத்தின் ஆண்பால் சொல்லை பொதுப்பாலாக்காமல் துல்லியமாகப் பாதுகாக்கிறது.
- issue: עבד என்பதன் மதச்சூழல் பொருள்
  choice: பணிசெய்வாய்
  alternative: வழிபடுவாய்
  rationale: ‘வழிபடு’ என்பது சூழலுக்குச் சரியான விளக்கப் பொருள் என்றாலும், ‘பணிசெய்’ மூலவினையின் அகன்ற பொருளையும் அதன் இறையியல் பதற்றத்தையும் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான தமிழ். ஒருமை இரண்டாம் நபர் வடிவங்கள் மூலத்தின் இலக்கணத்தைப் பாதுகாக்கின்றன. ‘உன்மேல் ஏற்படுத்தும்’ என்பது சற்றே முறையான நடை என்றாலும் அரசனை நிறுவும் மூலக் கட்டமைப்பைத் தெளிவாகக் காக்கிறது.
