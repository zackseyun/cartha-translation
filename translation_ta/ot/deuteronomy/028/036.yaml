revisions:
- from: யாவே உன்னையும், நீ உன்மேல் ஏற்படுத்தும் அரசனையும், நீயும் உன் தந்தையரும் அறியாத ஒரு நாட்டுக்குக் கொண்டுபோவார்; அங்கே நீ மரமும் கல்லுமான வேறு தெய்வங்களுக்குப் பணிசெய்வாய்.[a]
  to: யாவே உன்னையும், உனக்குமேல் நீ நியமிக்கும் அரசனையும், நீயும் உன் தந்தையரும் அறியாத ஒரு நாட்டுக்குக் கொண்டுபோவார்; அங்கே நீ மரமும் கல்லுமான வேறு தெய்வங்களுக்குப் பணிசெய்வாய்[a].
  rationale: A limited stylistic revision makes the king-installation clause idiomatic modern Tamil without altering its source-based sense. The wording for divine name, kinship term, service to other gods, and the wood-and-stone characterization is retained. The footnote is re-anchored to its lexical referent.
