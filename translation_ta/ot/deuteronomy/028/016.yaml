  text: Cursed are you in the city[a], and cursed are you in the field.
translation:
  language: ta
  text: நகரத்தில் நீ சபிக்கப்பட்டவன்[a]; வயல்வெளியிலும் நீ சபிக்கப்பட்டவன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சாபத்தின்கீழ் உள்ளவன்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אָרוּר
  choice: சபிக்கப்பட்டவன்
  rationale: உடன்படிக்கைத் தண்டனைத் தீர்ப்பின்கீழ் உள்ள அறிவிக்கப்பட்ட நிலையைக் குறிக்கும் செயல்பாட்டு பெயரெச்சத்தை நேரடியாகவும் சுருக்கமாகவும் எடுத்துரைக்கிறது.
- source_word: אַתָּה
  choice: நீ
  rationale: எபிரெயத்தில் வெளிப்படையாக உள்ள இரண்டாம் நபர் ஒருமை ஆண்பால் சுட்டுப்பெயரைப் பாதுகாக்கிறது.
- source_word: בָּעִיר
  choice: நகரத்தில்
  rationale: இடத்தைக் குறிக்கும் முன்னொட்டையும் நகர்ப்புற வாழ்விடத்தையும் இயல்பான நவீன தமிழில் நேரடியாகத் தருகிறது.
- source_word: וְ
  choice: இலும்
  rationale: இணையான இரு கூறுகளையும் இணைத்து, நகரம் மற்றும் வயல்வெளி ஆகிய இரு வாழ்வுச் சூழல்களிலும் சாபத்தின் விரிவைத் தெரிவிக்கிறது.
- source_word: בַּשָּׂדֶה
  choice: வயல்வெளியில்
  rationale: நகரத்திற்கு எதிரிணையான வேளாண்மை சார்ந்த திறந்த வெளியைத் தெளிவாகவும் இயல்பாகவும் குறிக்கிறது.
theological_decisions:
- issue: உடன்படிக்கைச் சாப அறிவிப்பின் வடிவமும் காலப்பொருளும்
  choice: இரு கூறுகளிலும் “நீ சபிக்கப்பட்டவன்” என்ற நேரடி நிலை அறிவிப்பைத் தக்கவைத்தல்
  alternative: “நீ சபிக்கப்படுவாய்” அல்லது “நீ சபிக்கப்படுவாயாக”
  rationale: எபிரெயம் எதிர்கால வினையையோ விருப்ப வினையையோ பயன்படுத்தாமல், செயல்பாட்டு பெயரெச்சத்தையும் சுட்டுப்பெயரையும் கொண்ட வினையில்லா பயனிலை அமைப்பைப் பயன்படுத்துகிறது. ஆகவே, நேரடி அறிவிப்பு உடன்படிக்கைத் தண்டனையின் நீதித் தீர்ப்பு வலிமையைச் சிறப்பாகப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. “நகரத்தில் … வயல்வெளியிலும்” என்ற இணை அமைப்பு மூலத்தின் நகரம்–வயல் எதிரிணையையும் முழு வாழ்வுச் சூழலைக் குறிக்கும் பரப்பையும் காக்கிறது.
