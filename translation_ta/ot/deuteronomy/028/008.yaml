base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/008.yaml
  text: Yahweh will command the blessing on you in your storehouses and in all the work of your hand[c][b][a], and he will bless you in the land that Yahweh your God is giving you.
translation:
  language: ta
  text: யாவே உன் களஞ்சியங்களிலும்[a] உன் கைகள் செய்யும் எல்லாவற்றிலும்[b] உன்மேல் ஆசீர்வாதம் வரும்படி கட்டளையிடுவார். உன் கடவுளாகிய யாவே உனக்குக் கொடுக்கிற[c] நாட்டில் அவர் உன்னை ஆசீர்வதிப்பார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது: “உன் பண்டகசாலைகளில்” அல்லது “உன் தானியக் களஞ்சியங்களில்.”'
    reason: lexical_alternative
  - marker: b
    text: 'எபிரெயத்தில் சொல்லுக்குச் சொல்: “உன் கையை அனுப்பும் அனைத்திலும்”; இது உன் வேலைகள் அல்லது நீ மேற்கொள்ளும் முயற்சிகள் அனைத்தையும் குறிக்கும் மரபுத்தொடர்.'
    reason: lexical_alternative
  - marker: c
    text: 'அல்லது: “கொடுக்கிறார்” அல்லது “கொடுப்பார்.” இங்குள்ள எபிரெயப் பங்கேற்பு வடிவத்தை ஒன்றுக்கு மேற்பட்ட விதங்களில் மொழிபெயர்க்கலாம்.'
    reason: alternative_reading
lexical_decisions:
- source_word: יְצַו
  choice: கட்டளையிடுவார்
  rationale: צוה என்பதன் பியேல் வடிவம் பொதுவாக ‘கட்டளையிடு’ என்று பொருள்படும். ஆசீர்வாதம் இஸ்ரவேல்மேல் வரும்படி யாவே ஆணையிடுகிறார் என்ற எபிரெய மொழியின் வலுவான உருவகத்தை இது தக்கவைக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைத் திருப்பெயரான יהוה-ஐ ஒரு பொதுப் பட்டத்தால் மாற்றாமல், தமிழில் அறியப்பட்ட ஒலிபெயர்ப்பு வடிவில் தருகிறது.
- source_word: אִתְּךָ אֶת הַבְּרָכָה
  choice: உன்மேல் ஆசீர்வாதத்தை
  rationale: צוה என்பதுடன் வரும் இத்தொடர், ஆசீர்வாதம் ஒருவர்மேல் செலுத்தப்படுவதைக் குறிக்கிறது. ‘உன்மேல்’ என்பது சூழலின் பயனுறு பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: בַּאֲסָמֶיךָ
  choice: உன் களஞ்சியங்களில்
  rationale: אָסָם என்பது சேமிப்பிடம் அல்லது தானியக் களஞ்சியத்தைக் குறிக்கும். ‘களஞ்சியம்’ வேளாண்மைச் சூழலுக்கும் பொதுவான சேமிப்பிடத்துக்கும் பொருந்தும்.
- source_word: וּבְכֹל מִשְׁלַח יָדֶךָ
  choice: உன் கையின் எல்லா வேலையிலும்
  rationale: சொல்லுக்குச் சொல் ‘உன் கையை அனுப்பும் அனைத்திலும்’ எனும் எபிரெய மரபுத்தொடர், ஒருவரின் வேலைகளையும் முயற்சிகளையும் குறிக்கிறது. ‘உன் கையின் எல்லா வேலையிலும்’ என்பது கை என்னும் உருவகத்தைத் தக்கவைத்தபடி தெளிவாக உள்ளது.
- source_word: וּבֵרַכְךָ
  choice: அவர் உன்னை ஆசீர்வதிப்பார்
  rationale: முந்தைய எதிர்கால வினையின் காலப்பொருளைத் தொடர்ந்து வரும் இவ்வினை, யாவேதான் செய்பவர் என்பதைத் தெளிவாகக் காட்டுகிறது.
- source_word: בָּאָרֶץ
  choice: நாட்டில்
  rationale: דברים நூலின் உடன்படிக்கைச் சூழலில் אֶרֶץ என்பது இஸ்ரவேலுக்குக் கொடுக்கப்படும் நாட்டைக் குறிக்கிறது; ‘நாடு’ தமிழில் இயல்பாகவும் அந்தப் பொருளைத் தக்கவைத்தும் உள்ளது.
- source_word: נֹתֵן לָךְ
  choice: உனக்கு நல்கிக்கொண்டிருக்கிற
  rationale: நிகழ்காலப் பங்கேற்பு வடிவம் தொடரும் அல்லது உடனடியாக நிகழவிருக்கும் கொடையைக் குறிக்கலாம். ‘நல்கிக்கொண்டிருக்கிற’ என்பது அதன் தொடர்நிலை அம்சத்தை வெளிப்படுத்துகிறது.
theological_decisions:
- issue: יהוה என்ற இறைத் திருப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: உடன்படிக்கையின் இறைவன் எழுத்தில் தனிப்பட்ட பெயரால் குறிப்பிடப்படுகிறார். அந்தப் பெயரை ஒரு பட்டமாக மாற்றாமல் ஒலிபெயர்ப்பது மூலத்தின் வேறுபாட்டைத் தக்கவைக்கிறது.
- issue: הָאָרֶץ என்பதன் உடன்படிக்கைச் சார்பு
  choice: நாடு
  alternative: தேசம்
  rationale: இங்கு பொதுவான நிலப்பரப்பு மட்டுமல்லாமல் யாவே இஸ்ரவேலுக்குக் கொடுக்கும் நாடும் குறிக்கப்படுகிறது. ‘நாடு’ இதை இயல்பாக வெளிப்படுத்துகிறது; ‘வாக்குத்தத்த நாடு’ என்று வெளிப்படையாகச் சேர்த்து விளக்கவில்லை.
- issue: נֹתֵן என்ற பங்கேற்பு வடிவத்தின் காலப்பொருள்
  choice: நல்கிக்கொண்டிருக்கிற
  alternative: நல்குகிற / நல்கப்போகிற
  rationale: எபிரெய பங்கேற்பு வடிவம் நிகழும், வழக்கமான, அல்லது நெருங்கிய எதிர்காலச் செயலைக் குறிக்கக்கூடும். முதன்மை உரையில் தொடர்நிலையைத் தேர்ந்தெடுத்து, பிற சாத்தியங்களை அடிக்குறிப்பில் பாதுகாத்துள்ளோம்.
translation_notes:
  register: நவீனத் தரத் தமிழில், ஒருமை முன்னிலையைத் தொடர்ந்து பயன்படுத்தியுள்ளோம். நடையும் கண்ணியமானதாகவும் பொதுவாசகர்களுக்குத் தெளிவானதாகவும் வைக்கப்பட்டுள்ளது. ‘கட்டளையிடுவார்’ மற்றும் ‘உன் கையின் வேலை’ போன்ற மூல உருவகங்கள் இயன்றவரை தக்கவைக்கப்பட்டுள்ளன; இயல்பான தமிழ் தேவைப்படும் இடங்களில் மட்டும் மிதமான வடிவமாற்றம் செய்யப்பட்டுள்ளது.
