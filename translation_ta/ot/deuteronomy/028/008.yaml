  source_fidelity: 'மூலத்தின் முக்கிய கூறுகள் அனைத்தும் உள்ளன: யாவே, ஆசீர்வாதம், களஞ்சியங்கள், கையின் அனைத்து முயற்சிகள், கொடுக்கப்படும் நாடு. ஆனால் “உன்மேல் ஆசீர்வாதத்தைக் கட்டளையிடுவார்” என்பது தமிழில் இயல்பற்ற இணைப்பு; எபிரெயத்தின் வலுவான உருவகத்தைத் தக்கவைத்தபடி ஆசீர்வாதம் வருமாறு கட்டளையிடுதல் எனத் தெளிவுபடுத்துவது பாதுகாப்பானது. נֹתֵן என்பதற்கு “நல்கிக்கொண்டிருக்கிற” தேவையற்ற தொடர்நிலைப் பொருளை வலியுறுத்துகிறது; “கொடுக்கிற” பங்கேற்பின் திறந்த காலப்பொருளைச் சிறப்பாகக் காக்கிறது.'
