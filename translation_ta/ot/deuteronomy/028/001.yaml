revisions:
- from: நீ உன் கடவுளாகிய யாவேயின் குரலுக்கு மிகவும் கவனமாகக் கீழ்ப்படிந்து,[a] இன்று நான் உனக்குக் கட்டளையிடுகிற அவருடைய எல்லாக் கட்டளைகளையும் கவனத்துடன் கடைப்பிடித்தால், உன் கடவுளாகிய யாவே உன்னைப் பூமியிலுள்ள எல்லா இனத்தாருக்கும் மேலாக உயர்த்துவார்.
