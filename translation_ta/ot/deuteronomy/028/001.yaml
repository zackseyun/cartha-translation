  text: וְ/הָיָ֗ה אִם שָׁמ֤וֹעַ תִּשְׁמַע֙ בְּ/קוֹל֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ לִ/שְׁמֹ֤ר לַ/עֲשׂוֹת֙ אֶת כָּל מִצְוֺתָ֔י/ו אֲשֶׁ֛ר אָנֹכִ֥י מְצַוְּ/ךָ֖ הַ/יּ֑וֹם וּ/נְתָ֨נְ/ךָ֜ יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ עֶלְי֔וֹן עַ֖ל כָּל גּוֹיֵ֥י הָ/אָֽרֶץ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/001.yaml
  text: And it shall be[a], if you diligently obey the voice of Yahweh your God, being careful to do all his commandments that I am commanding you today, then Yahweh your God will set you high above all the nations of the earth.
translation:
  language: ta
  text: நீ உன் கடவுளாகிய யாவேயின் குரலுக்குக் கவனமாகக் கீழ்ப்படிந்து, இன்று நான் உனக்குக் கட்டளையிடுகிற அவருடைய எல்லாக் கட்டளைகளையும் கடைப்பிடிக்கக் கவனமாயிருந்தால், உன் கடவுளாகிய யாவே உன்னைப் பூமியிலுள்ள எல்லா இனங்களுக்கும் மேலாக உயர்த்துவார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהָיָה
  choice: — (தமிழ் நிபந்தனை வாக்கிய அமைப்பில் இயல்பாக வெளிப்படுத்தப்பட்டது)
  rationale: எபிரெய தொடக்கச் சூத்திரத்தின் எதிர்கால நிபந்தனைப் பொருள், தமிழில் தனியாக ‘அது நிகழும்’ என்று சேர்க்காமல் ‘...கடைப்பிடித்தால் ... உயர்த்துவார்’ என்ற அமைப்பில் தெளிவாக வருகிறது.
- source_word: אִם שָׁמוֹעַ תִּשְׁמַע בְּקוֹל
  choice: குரலுக்கு மிகவும் கவனமாகக் கீழ்ப்படிந்து
  rationale: வினையெச்ச முற்றுருவும் வினையும் சேர்ந்த தீவிரப்படுத்தலை ‘மிகவும் கவனமாக’ என்பதும், கேட்பதைச் சார்ந்த உடன்படிக்கை வழக்கின் கீழ்ப்படிதல் பொருளை ‘கீழ்ப்படிந்து’ என்பதும் வெளிப்படுத்துகின்றன; ‘குரல்’ என்ற மூல உருவகமும் காக்கப்படுகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: திருநாம எழுத்துகளான יהוה-ஐ பொதுவான பட்டப்பெயராக மாற்றாமல் தனிப்பெயராக ஒலிபெயர்க்கிறது.
- source_word: אֱלֹהֶיךָ
  choice: உன் கடவுளாகிய
  rationale: இரண்டாம் நபர் ஒருமை உடைமைத் தொடர்பையும் உடன்படிக்கை உறவையும் நேரடியாகக் காக்கிறது.
- source_word: לִשְׁמֹר לַעֲשׂוֹת
  choice: கவனத்துடன் கடைப்பிடித்தால்
  rationale: ‘காத்து/கவனித்து செய்வது’ என்ற இணைந்த கருத்தை இயல்பான நவீனத் தமிழில் செயற்பாட்டுடனான கீழ்ப்படிதலாகத் தருகிறது.
- source_word: כָּל מִצְוֺתָיו
  choice: அவருடைய எல்லாக் கட்டளைகளையும்
  rationale: சட்ட-உடன்படிக்கைச் சொல்லாட்சியை ‘கட்டளைகள்’ எனக் காத்து, כָּל என்பதன் முழுமையையும் வெளிப்படுத்துகிறது.
- source_word: אֲשֶׁר אָנֹכִי מְצַוְּךָ הַיּוֹם
  choice: இன்று நான் உனக்குக் கட்டளையிடுகிற
  rationale: மோசேயின் நிகழ்கால உரையின் உடனடித்தன்மையையும் இரண்டாம் நபர் ஒருமையையும் காக்கிறது.
- source_word: וּנְתָנְךָ ... עֶלְיוֹן
  choice: உன்னை ... மேலாக உயர்த்துவார்
  rationale: נתן உடன் வரும் עֶלְיוֹן இங்கு கொடுத்தலை அல்ல, உயர்ந்த நிலையில் வைப்பதைக் குறிக்கிறது; தமிழ் வாக்கியம் அதன் விளைவை இயல்பாகத் தருகிறது.
- source_word: עַל כָּל גּוֹיֵי הָאָרֶץ
  choice: பூமியிலுள்ள எல்லா இனத்தாருக்கும் மேலாக
  rationale: גּוֹיִם என்பதன் மக்கள்-குழு பொருளை ‘இனத்தார்’ என்றும், இச்சூழலில் הָאָרֶץ என்பதன் பரந்த உலகளாவிய குறிப்பை ‘பூமி’ என்றும் வழங்குகிறது.
theological_decisions:
- issue: יהוה என்ற இறைத் திருநாமத்தின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் பொதுப்பட்டம் அல்ல, உடன்படிக்கைத் திருநாமமே நேரடியாக உள்ளது; ஆகவே அதைத் தனிப்பெயராகப் பாதுகாக்கிறது.
- issue: שָׁמוֹעַ תִּשְׁמַע בְּקוֹל என்ற உடன்படிக்கை வழக்கு
  choice: குரலுக்கு மிகவும் கவனமாகக் கீழ்ப்படிந்து
  alternative: குரலைக் கவனமாகக் கேட்டு
  rationale: எபிரெயச் சொல்லாட்சி கேட்டலையும் கீழ்ப்படிதலையும் ஒன்றிணைக்கிறது. ‘கீழ்ப்படிந்து’ அதன் கட்டுப்பாட்டு வலிமையைத் தருகிறது; ‘குரல்’ மூலத்தின் உருவகத்தைத் தக்கவைக்கிறது.
- issue: வாக்குறுதியின் நிபந்தனைத் தொடர்பு
  choice: '...கடைப்பிடித்தால், ... உயர்த்துவார்'
  alternative: 'அது நிகழும்: நீ ... என்றால், ...'
  rationale: மூலத்தின் நிபந்தனை-விளைவு அமைப்பைத் தெளிவாகக் காக்கிறது; அதேவேளை தமிழில் செயற்கையான தொடக்கச் சூத்திரத்தைத் தவிர்க்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதைமிக்க ஆனால் பொதுவாசகருக்குப் புரியும் நடை. ஒருமை ‘நீ/உன்’ மூலம் எபிரெயின் இரண்டாம் நபர் ஒருமை காக்கப்பட்டுள்ளது. ‘யாவே’ திருநாமமாகவும் ‘கடவுள்’ பொதுப்பெயராகவும் வேறுபடுத்தப்பட்டுள்ளன.
