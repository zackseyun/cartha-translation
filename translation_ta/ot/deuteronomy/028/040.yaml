base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/040.yaml
  text: You will have olive trees throughout all your territory[a], but you will not anoint yourself with oil, because your olives will fall off.
translation:
  language: ta
  text: உன் நாடெங்கும் ஒலிவ மரங்கள் இருக்கும்; ஆனால் நீ எண்ணெயைப் பூசிக்கொள்ள மாட்டாய். ஏனெனில் உன் ஒலிவக் காய்கள் உதிர்ந்துவிடும்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உன் ஒலிவ விளைச்சல் உதிர்ந்துவிடும்,” அல்லது “உன் ஒலிவ மரம் தன் காய்களை உதிர்த்துவிடும்.” எபிரெய மொழியில் “உன் ஒலிவம்” என்பது ஒருமை வடிவில் தொகுப்புப் பொருளில் பயன்படுத்தப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֵיתִים
  choice: ஒலிவ மரங்கள்
  rationale: இச்சொல் ஒலிவக் காய்களையோ மரங்களையோ குறிக்கலாம். நாடெங்கும் அவை இருக்கும் என்ற சூழலில் மரங்களே இயல்பான பொருள்.
- source_word: יִהְיוּ לְךָ
  choice: உனக்கு ... இருக்கும்
  rationale: உடைமை அல்லது ஒருவருக்குக் கிடைக்கும் சூழ்நிலையைச் சுட்டும் எபிரெய மரபுத்தொடரை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: בְּכָל גְּבוּלֶךָ
  choice: உன் நாடெங்கும்
  rationale: גְּבוּל என்பது எல்லை, எல்லைக்குட்பட்ட பகுதி அல்லது நாட்டுப்பரப்பு எனப் பொருள்படும்; இங்கு முழு நிலப்பரப்பையும் இயல்பாகக் குறிக்கிறது.
- source_word: וְשֶׁמֶן
  choice: எண்ணெய்
  rationale: சூழலில் இது ஒலிவ எண்ணெய் என்றாலும், மூலத்தில் பொதுவாக ‘எண்ணெய்’ என்றே இருப்பதால் அதையே வைத்திருக்கிறது.
- source_word: לֹא תָסוּךְ
  choice: நீ எண்ணெயைப் பூசிக்கொள்ள மாட்டாய்
  rationale: உடலில் எண்ணெய் தடவும் அன்றாடப் பழக்கத்தைக் குறிக்கிறது; சடங்குசார் அபிஷேகம் என்ற தேவையற்ற உட்பொருளைத் தவிர்க்கிறது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: எண்ணெயைப் பயன்படுத்த முடியாததற்கான காரணத்தைத் தெளிவாக அறிமுகப்படுத்துகிறது.
- source_word: יִשַּׁל
  choice: உதிர்ந்துவிடும்
  rationale: மரத்திலிருந்து காய்கள் விழுவதையோ மரம் அவற்றை உதிர்ப்பதையோ இயல்பான தமிழில் குறிக்கிறது.
- source_word: זֵיתֶךָ
  choice: உன் ஒலிவக் காய்கள்
  rationale: மூலத்தில் ஒருமை வடிவம் தொகுப்புப் பொருளில் வருகிறது. இங்கு உதிர்வது ஒலிவ விளைச்சல் அல்லது காய்கள் என்பதைக் கருத்தில் கொண்டு பன்மையாக மொழிபெயர்க்கப்பட்டுள்ளது; மூலத்தின் மாற்றுப் புரிதல்கள் அடிக்குறிப்பில் பாதுகாக்கப்படுகின்றன.
