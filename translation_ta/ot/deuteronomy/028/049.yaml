id: DEU.28.49
reference: Deuteronomy 28:49
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: יִשָּׂ֣א יְהוָה֩ עָלֶ֨י/ךָ גּ֤וֹי מֵ/רָחוֹק֙ מִ/קְצֵ֣ה הָ/אָ֔רֶץ כַּ/אֲשֶׁ֥ר יִדְאֶ֖ה הַ/נָּ֑שֶׁר גּ֕וֹי אֲשֶׁ֥ר לֹא תִשְׁמַ֖ע לְשֹׁנֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/049.yaml
  text: Yahweh will raise up against you a nation from far away[a], from the end of the earth[b], as the eagle swoops down—a nation whose language you will not understand.
translation:
  language: ta
  text: தொலைவிலிருந்து, பூமியின் கடைக்கோடியிலிருந்து, கழுகு பாய்ந்து வருவதுபோல்[a], யாவே ஒரு நாட்டை உனக்கு எதிராகக் கொண்டுவருவார். அந்த நாட்டின் மொழி உனக்குப் புரியாது[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “கழுகு பறப்பதுபோல்” அல்லது “கழுகு வேகமாகப் பாய்வதுபோல்” என்றும் மொழிபெயர்க்கலாம். எபிரெய வினைச்சொல் விரைவான அசைவை வலியுறுத்துகிறது.
    reason: lexical_alternative
  - marker: b
    text: சொல்லுக்கு சொல், “அதன் நாவை நீ கேட்கமாட்டாய்.” இங்கு அந்த நாட்டின் மொழியைப் புரிந்துகொள்ள முடியாது என்பதே பொருள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשָּׂא ... עָלֶיךָ
  choice: உனக்கு எதிராகக் கொண்டுவருவார்
  rationale: נשא என்பதன் அடிப்படைப் பொருள் ‘தூக்குதல்/சுமத்தல்’ என்றாலும், இங்கு עַל உடன் வரும் அமைப்பு ஒரு நாட்டை ஒருவருக்கு எதிராக வரச் செய்வதைக் குறிக்கிறது. இத்தமிழாக்கம் இறைச் செயலையும் எதிர்த்துவரும் பொருளையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய மூலத்தில் இறைவனின் தனிப்பெயரான நான்கெழுத்துப் பெயர் நேரடியாக உள்ளது; அதனை ஒரு பட்டப்பெயரால் மாற்றாமல் தமிழில் ‘யாவே’ என்று ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: גּוֹי
  choice: நாடு
  rationale: உடன்படிக்கைச் சாபத்தின் சூழலில் இது படையெடுத்து வரும் அயல்நாட்டு அரசியல் மக்களமைப்பைக் குறிக்கிறது; ‘நாடு’ அதற்கு இயல்பான தமிழ் இணை.
- source_word: מֵרָחוֹק
  choice: தொலைவிலிருந்து
  rationale: மிகுந்த தூரத்திலிருந்து வருவதைக் குறிக்கும் எளிய, நவீனத் தமிழ்.
- source_word: מִקְצֵה הָאָרֶץ
  choice: பூமியின் கடைக்கோடியிலிருந்து
  rationale: சொல்லாட்சியின் தொலைதூர எல்லை என்ற உருவகத்தைத் தக்கவைக்கிறது; இங்கு ‘பூமி’ உலகின் வெகுதொலைவைக் காட்டுகிறது.
- source_word: כַּאֲשֶׁר יִדְאֶה הַנָּשֶׁר
  choice: கழுகு பாய்ந்து வருவதுபோல்
  rationale: יִדְאֶה வேகமான பறத்தல் அல்லது பாய்தலைக் குறிக்கிறது. ‘பாய்ந்து வருதல்’ உவமையின் வேகத்தையும் அச்சுறுத்தலையும் தக்கவைக்கிறது; נשר என்பதற்கு ‘கழுகு’ என்ற மரபான பொருள் தேர்ந்தெடுக்கப்பட்டது.
- source_word: לֹא תִשְׁמַע לְשֹׁנוֹ
  choice: அந்த நாட்டின் மொழி உனக்குப் புரியாது
  rationale: சொல்லுக்கு சொல் ‘அதன் நாவை நீ கேட்கமாட்டாய்’ என்றாலும், மொழியுடன் வரும் שמע இங்கு பேச்சைப் புரிந்துகொள்ளாததைக் குறிக்கிறது. தமிழ் வாக்கியம் அந்தச் சூழற்பொருளைத் தெளிவாகக் கூறுகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூலவசனம் இறைவனின் உடன்படிக்கைத் தனிப்பெயரைப் பயன்படுத்துகிறது. ஒரு பட்டப்பெயரை மாற்றீடாக இடாமல் தனிப்பெயரை ஒலிபெயர்ப்பது மூலத்தின் வேறுபாட்டைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான நடையில் அமைக்கப்பட்டது. ஒருமை இரண்டாம் நபரைக் காட்ட ‘உனக்கு’ பயன்படுத்தப்பட்டுள்ளது. உவமையின் வேகமும் அச்சுறுத்தலும் தக்கவைக்கப்பட்டுள்ளன; மூலத்தில் இல்லாத சமயப் பிரிவு சார்ந்த விளக்கங்கள் சேர்க்கப்படவில்லை.
