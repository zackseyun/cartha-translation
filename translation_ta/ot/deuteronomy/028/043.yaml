  text: הַ/גֵּר֙ אֲשֶׁ֣ר בְּ/קִרְבְּ/ךָ֔ יַעֲלֶ֥ה עָלֶ֖י/ךָ מַ֣עְלָ/ה מָּ֑עְלָ/ה וְ/אַתָּ֥ה תֵרֵ֖ד מַ֥טָּה מָּֽטָּה׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/043.yaml
  text: The foreigner who is among you will rise higher and higher above you[a], and you will go down lower and lower.
translation:
  language: ta
  text: உன் நடுவில் குடியிருக்கும் அந்நியன்[a] உன்னைவிட மேலும் மேலும் உயர்வான்; நீயோ மேலும் மேலும் தாழ்ந்துபோவாய்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அந்நியக் குடியிருப்பாளன்.” எபிரெயச் சொல் இஸ்ரவேலரிடையே வாழும், அந்நாட்டைச் சாராத ஒருவரைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַגֵּר
  choice: குடியிருக்கும் அந்நியன்
  rationale: גֵּר என்பது இஸ்ரவேலரிடையே வாழும், அந்நாட்டைச் சாராத ஒருவரைக் குறிக்கிறது. ‘குடியிருக்கும் அந்நியன்’ என்பது அவரது அந்நிய நிலையையும் சமூகத்தின் நடுவே அவர் வசிப்பதையும் இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: אֲשֶׁר בְּקִרְבְּךָ
  choice: உன் நடுவில் குடியிருக்கும்
  rationale: இந்த உறவுத்தொடர் அந்த அந்நியர் இஸ்ரவேல் சமூகத்திற்குள் வசிப்பதைச் சுட்டுகிறது. தமிழில் பெயருடன் இணைத்து வழங்குவது இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: יַעֲלֶה עָלֶיךָ
  choice: உன்னைவிட ... உயர்வான்
  rationale: עלה + על இங்கு அந்தஸ்தில் மேலோங்குவதை உருவகமாகக் குறிக்கிறது. ‘உன்னைவிட உயர்வான்’ என்பது ஒப்பீட்டையும் நிலைமாற்றத்தையும் தெளிவாகக் காட்டுகிறது; பொருளாதாரம் அல்லது அரசியல் என்ற ஒரே துறைக்குள் பொருளைச் சுருக்கவில்லை.
- source_word: מַעְלָה מָּעְלָה
  choice: மேலும் மேலும்
  rationale: இரட்டிக்கப்பட்ட எபிரெய வினையடை தொடர்ந்து அதிகரிக்கும் உயர்வை வலியுறுத்துகிறது. ‘மேலும் மேலும்’ அந்தத் திரும்பச்சொல்லின் தீவிரத்தையும் இயல்பான தமிழ் நடையையும் காக்கிறது.
- source_word: וְאַתָּה
  choice: நீயோ
  rationale: எபிரெய இணைப்புச்சொல் எளிய வாவாக இருந்தாலும், சூழலில் தெளிவான எதிர்மறை ஒப்பீடு உள்ளது. ‘நீயோ’ அந்த வேறுபாட்டை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: תֵרֵד
  choice: தாழ்ந்துபோவாய்
  rationale: ירד என்பது עלה என்பதற்கு எதிரான கீழ்நோக்கிய இயக்கத்தைச் சொல்கிறது. இங்கு உருவகமான அந்தஸ்துச் சரிவைக் குறிக்க ‘தாழ்ந்துபோவாய்’ இயல்பாகவும் விரிவைத் திறந்துவைத்தும் உள்ளது.
- source_word: מַטָּה מָּטָּה
  choice: மேலும் மேலும்
  rationale: இரட்டிக்கப்பட்ட வினையடை தொடர்ந்து அதிகரிக்கும் தாழ்வை வலியுறுத்துகிறது. ‘மேலும் மேலும் தாழ்ந்துபோவாய்’ என்பது எபிரெய இணை அமைப்பையும் முன்னேறும் வீழ்ச்சியையும் தமிழில் தெளிவாகக் காக்கிறது.
theological_decisions:
- issue: சாபச் சூழலில் சமூக மற்றும் உடன்படிக்கைசார் நிலைமாற்றம்
  choice: இஸ்ரவேலரிடையே வாழும் அந்நியர் அவர்களைவிட உயர்ந்து, இஸ்ரவேலர் தாழும் பரந்த நிலைமாற்றமாக மொழிபெயர்க்கப்பட்டது.
  alternative: இதைப் பொருளாதார உயர்வு மற்றும் வீழ்ச்சி அல்லது அரசியல் ஆதிக்கம் என்று மட்டும் குறுக்கிப் பொருள்படுத்துதல்.
  rationale: உயர்தல், இறங்குதல் என்ற எபிரெய உருவகம் உபாகமம் 28-இன் சாபச் சூழலில் விரிவான தலைகீழ் நிலைமாற்றத்தைச் சுட்டுகிறது. மூலவசனம் குறிப்பிடாத ஒரு குறிப்பிட்ட துறைக்குள் மொழிபெயர்ப்பு பொருளைச் சுருக்கவில்லை.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘உன்/உன்னை/நீ’ என்ற ஒருமை வடிவங்கள் எபிரெய மூலத்தின் ஒருமையைப் பேணுகின்றன. உயர்வு–தாழ்வு என்ற இணையான உருவகமும் தொடர்ச்சியை வலியுறுத்தும் இரட்டிப்பும் பாதுகாக்கப்பட்டுள்ளன.
