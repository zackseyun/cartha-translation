  text: שׁוֹרְ/ךָ֞ טָב֣וּחַ לְ/עֵינֶ֗י/ךָ וְ/לֹ֣א תֹאכַל֮ מִמֶּ/נּוּ֒ חֲמֹֽרְ/ךָ֙ גָּז֣וּל מִ/לְּ/פָנֶ֔י/ךָ וְ/לֹ֥א יָשׁ֖וּב לָ֑/ךְ צֹֽאנְ/ךָ֙ נְתֻנ֣וֹת לְ/אֹיְבֶ֔י/ךָ וְ/אֵ֥ין לְ/ךָ֖ מוֹשִֽׁיעַ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/031.yaml
  text: Your ox will be slaughtered before your eyes[a], but you will not eat any of it; your donkey will be seized from before you and will not be returned to you; your flock will be given to your enemies[b], and there will be no one to save you.
translation:
  language: ta
  text: உன் எருது உன் கண்முன்னே வெட்டப்படும்; ஆனால் அதில் எதையும் நீ சாப்பிடமாட்டாய். உன் கழுதை உன் கண்முன்னிருந்து பறித்துக்கொள்ளப்படும்[a]; அது உன்னிடம் திரும்பிவராது. உன் மந்தை உன் பகைவர்களிடம் ஒப்படைக்கப்படும்; உன்னைக் காப்பாற்றுபவர் எவரும் இருக்கமாட்டார்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கொள்ளையடிக்கப்படும்.” எபிரெயச் சொல் வன்முறையாகப் பறித்தல் அல்லது கொள்ளையிடுதல் என்ற கருத்தைக் கொண்டுள்ளது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “உனக்கு மீட்பவர் எவரும் இருக்கமாட்டார்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: שׁוֹרְךָ
  choice: உன் எருது
  rationale: שׁוֹר என்பது பொதுவாக உழைப்புக்குப் பயன்படும் மாட்டின விலங்கைக் குறிக்கிறது; ஒருமை வடிவத்தையும் சூழலையும் ‘எருது’ இயல்பாகப் பாதுகாக்கிறது.
- source_word: טָבוּחַ
  choice: வெட்டப்படும்
  rationale: טבח விலங்கை உணவுக்காக வெட்டுவதைக் குறிக்கிறது; பொதுவான ‘கொல்லப்படும்’ என்பதைவிட ‘வெட்டப்படும்’ இங்கு துல்லியமானது. எபிரெயச் செயலெச்சத்தின் சாபவாக்கிய எதிர்கால வலிமையும் காக்கப்படுகிறது.
- source_word: לְעֵינֶיךָ
  choice: உன் கண்முன்னே
  rationale: நிகழ்வு ஒருவரது பார்வையிலேயே வெளிப்படையாக நடப்பதைக் குறிக்கும் இயல்பான தமிழ் மரபுத்தொடர்.
- source_word: מִמֶּנּוּ
  choice: அதில் எதையும்
  rationale: சொல்லுக்கு சொல் ‘அதிலிருந்து’ என்றாலும், உண்பதைக் குறிக்கும் சூழலில் அந்த விலங்கின் இறைச்சியில் எதுவும் உரிமையாளருக்குக் கிடைக்காது என்பதை இவ்வடிவம் தெளிவாகக் காட்டுகிறது.
- source_word: חֲמֹרְךָ
  choice: உன் கழுதை
  rationale: நவீனத் தமிழில் நேரடியானதும் பொதுவாகப் புரியக்கூடியதுமான பெயர்.
- source_word: גָּזוּל
  choice: பறித்துக்கொள்ளப்படும்
  rationale: גזל வன்முறையாக அல்லது அநியாயமாக அபகரிப்பதைக் குறிக்கிறது. ‘பறித்துக்கொள்ளப்படும்’ என்பது வெறும் மறைமுகத் திருட்டைவிட வலுக்கட்டாய இழப்பை நன்றாக வெளிப்படுத்துகிறது.
- source_word: מִלְּפָנֶיךָ
  choice: உன் கண்முன்னிருந்து
  rationale: சொற்பொருளான ‘உன் முகத்திற்கு முன்பிருந்து’ என்பதன் காட்சித்தன்மையை இயல்பான தமிழில் பாதுகாக்கிறது.
- source_word: יָשׁוּב לָךְ
  choice: அது உன்னிடம் திரும்பிவராது
  rationale: எபிரெய மூலத்தில் வினை செய்பாட்டு வடிவில் இருப்பதால், கழுதையே திரும்பிவராது என்ற அமைப்பு தமிழிலும் நேரடியாக வைக்கப்படுகிறது.
- source_word: צֹאנְךָ
  choice: உன் மந்தை
  rationale: צֹאן செம்மறியாடுகளையும் வெள்ளாடுகளையும் உள்ளடக்கக்கூடும்; ‘மந்தை’ ஒரு வகையை மட்டும் தேவையின்றிக் குறிப்பிடாமல் கூட்டுப்பொருளைப் பாதுகாக்கிறது.
- source_word: נְתֻנוֹת
  choice: ஒப்படைக்கப்படும்
  rationale: נתן என்பதன் செயலப்பாட்டு கருத்தைத் தருவதோடு, பகைவர்களின் வசமாகச் செல்லும் அச்சுறுத்தலையும் இயல்பாக உணர்த்துகிறது.
- source_word: לְאֹיְבֶיךָ
  choice: உன் பகைவர்களிடம்
  rationale: உடைமை அல்லது கட்டுப்பாடு பகைவர்களிடம் செல்லும் கருத்தை இலக்கு வேற்றுமையுடன் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וְאֵין לְךָ מוֹשִׁיעַ
  choice: உன்னைக் காப்பாற்றுபவர் எவரும் இருக்கமாட்டார்
  rationale: מוֹשִׁיעַ என்பது காப்பவர் அல்லது விடுவிப்பவர் என்ற முகவர் பொருளைக் கொண்டது. இங்கு உடனடியான பேரிடரிலிருந்து மீட்பதே சூழல்; நித்திய இரட்சிப்பைத் தனியே வரையறுப்பதில்லை.
theological_decisions:
- issue: இறுதிக் கூறிலுள்ள ישׁע வேர்ச்சொல்லின் மீட்பு மொழி
  choice: உன்னைக் காப்பாற்றுபவர் எவரும் இருக்கமாட்டார்
  alternative: உனக்கு மீட்பவர் எவரும் இருக்கமாட்டார்
  rationale: இச்சூழல் உடைமைகள் வலுக்கட்டாயமாகப் பறிக்கப்படுவதிலிருந்து விடுவிப்பவரில்லாத நிலையைச் சொல்கிறது. ‘காப்பாற்றுபவர்’ மூலச்சொல்லின் மீட்புப் பொருளைக் காக்கிறது; அதேவேளை அதை நித்திய இரட்சிப்புக்கான தொழில்நுட்பச் சொல்லாக மட்டும் சுருக்குவதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையுடன் மொழிபெயர்க்கப்பட்டுள்ளது. எபிரெய மூலத்தின் நேரடி இரண்டாம் நபர் ஒருமை அழைப்பும், தொடர்ச்சியான உடைமை இழப்புகளின் தீவிரமும் பாதுகாக்கப்பட்டுள்ளன. அடிக்குறிப்பு [a] அதற்குரிய גָּזוּל சொல்லுக்குப் பின்னரும், [b] இறுதி மீட்புக் கூறுக்குப் பின்னரும் பொருத்தப்பட்டுள்ளன.
