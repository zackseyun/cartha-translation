base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/054.yaml
  text: The man who is tender among you and very delicate—his eye will be hostile toward his brother[a], toward the wife of his bosom[b], and toward the rest of his children whom he has left.
translation:
  language: ta
  text: உங்களிடையே மென்மையானவனும் மிகவும் நாசுக்கானவனுமான மனிதன், தன் சகோதரனையும்[a], தன் மார்போடு அணைத்த மனைவியையும், தனக்கு எஞ்சியிருக்கும் பிள்ளைகளையும்[b] பகைமைக் கண்ணோடு பார்ப்பான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “பகைமைக் கண்ணோடு பார்ப்பான்” என்பது சொல்லுக்குச் சொல் “அவனுடைய கண் தீயதாகும்” என்ற எபிரேய மரபுத்தொடர். இங்கு அது பகைமை, கொடுக்க மனமின்மை, அல்லது பகிர மறுத்தல் ஆகியவற்றைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அவன் எஞ்சவைத்திருக்கும் பிள்ளைகள்.”
    reason: alternative_reading
lexical_decisions:
- source_word: הָאִישׁ
  choice: மனிதன்
  rationale: இங்கு ஆண்பால் ஒருமை குறிப்பாக உள்ளது; அடுத்த வசனத்தில் பெண்ணைப் பற்றிய இணையான விளக்கம் வருவதால் ஆண் நபரைக் குறிக்கும் சொல்லே பயன்படுத்தப்பட்டது.
- source_word: הָרַךְ
  choice: மென்மையானவன்
  rationale: உடல் அல்லது வாழ்க்கை முறையின் மென்மையைச் சுட்டும் அடிப்படைப் பொருளைத் தக்கவைக்கிறது.
- source_word: וְהֶעָנֹג מְאֹד
  choice: மிகவும் நாசுக்கானவன்
  rationale: சுகவாழ்வுக்குப் பழகிய, கடினத்தைத் தாங்காத நிலையைக் காட்டுகிறது; ‘செல்லமாக வளர்க்கப்பட்டவன்’ என்பது தேவைக்கு அதிகமான விளக்கமாகிவிடும்.
- source_word: תֵּרַע עֵינוֹ
  choice: பகைமைக் கண்ணோடு பார்ப்பான்
  rationale: ‘அவனுடைய கண் தீயதாகும்’ என்ற எபிரேய மரபுத்தொடரின் பார்வை உருவகத்தை இயல்பான தமிழில் தக்கவைத்து, சூழலில் உள்ள பகைமை மற்றும் பகிர மறுக்கும் மனப்பான்மையையும் உணர்த்துகிறது.
- source_word: בְאָחִיו
  choice: தன் சகோதரனை
  rationale: אָח என்பதன் சாதாரண, நேரடியான பொருள் ‘சகோதரன்’; விரிவான ‘உறவினன்’ என்ற பொருள் இங்கு அவசியமில்லை.
- source_word: אֵשֶׁת חֵיקוֹ
  choice: தன் மார்போடு அணைத்த மனைவி
  rationale: ‘தன் மார்பின் மனைவி’ என்ற நெருக்கத்தைக் குறிக்கும் உருவகத்தை இயல்பான தமிழில் காக்கிறது.
- source_word: יֶתֶר בָּנָיו
  choice: பிள்ளைகள்
  rationale: בנים என்பது இங்கு மகன்களை மட்டும் அல்லாமல் சந்ததியினரை உள்ளடக்கக்கூடும்; ‘பிள்ளைகள்’ இயல்பாகவும் உள்ளடக்கமாகவும் உள்ளது.
- source_word: אֲשֶׁר יוֹתִיר
  choice: தனக்கு எஞ்சியிருக்கும்
  rationale: ‘மீதியாக விடுதல்/எஞ்சியிருக்கச் செய்தல்’ என்ற வினையின் பொருளை முற்றுகைக்குப் பின் இன்னும் உயிரோடு அல்லது உடன் இருக்கும் பிள்ளைகளைக் குறிக்கும் வகையில் அளிக்கிறது; ‘அவன் காப்பாற்றிய’ என்பது மிகையான விளக்கம்.
