translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான உரைநடை பயன்படுத்தப்பட்டுள்ளது. ‘நாசுக்கானவன்’ சுகவாழ்வுக்குப் பழகிய மென்மையை இயல்பாகக் காட்டுகிறது. எபிரேயத்தின் கண் உருவகம் ‘பகைமைக் கண்ணோடு’ எனத் தக்கவைக்கப்பட்டு, அதன் பரந்த பொருள் அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது.
