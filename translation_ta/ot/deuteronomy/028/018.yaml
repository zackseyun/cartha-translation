base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/018.yaml
  text: Cursed shall be the fruit of your womb[a], and the fruit of your ground[b], the offspring of your herds and the young of your flocks.
translation:
  language: ta
  text: உன் கருப்பையின் கனியும், உன் நிலத்தின் கனியும்[a], உன் மாட்டினத்தின் கன்றுகளும், உன் ஆட்டு மந்தைகளின் குட்டிகளும்[b] சபிக்கப்பட்டதாகும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘உன் நிலத்தின் விளைச்சல்’ என்றும் மொழிபெயர்க்கலாம். எபிரெயத்தில் சொல்லுக்கு சொல் ‘உன் நிலத்தின் கனி’ என்று உள்ளது; இது ‘உன் கருப்பையின் கனி’ என்பதுடனான இணைநிலையைப் பாதுகாக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: 'இங்குள்ள எபிரெயச் சொற்றொடர்கள் கால்நடைகளின் குட்டிகள் அல்லது அவற்றின் பெருக்கத்தைக் குறிப்பாகச் சுட்டுகின்றன: மாட்டினமும், செம்மறியாடு மற்றும் வெள்ளாடு உள்ளிட்ட சிறுகால்நடைகளும்.'
    reason: cultural_note
lexical_decisions:
- source_word: אָרוּר
  choice: சபிக்கப்பட்டிருக்கும்
  rationale: உடன்படிக்கைச் சாபத்தை அறிவிக்கும் எபிரெயச் சூத்திரத்தின் தீர்ப்புரைக் cadence-ஐ இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: פְּרִי בִטְנְךָ
  choice: உன் கருப்பையின் கனி
  rationale: பிள்ளைகள் அல்லது சந்ததியைக் குறிக்கும் எபிரெய உருவகத்தைத் தமிழிலும் தெளிவாகப் பாதுகாக்கிறது.
- source_word: וּפְרִי אַדְמָתֶךָ
  choice: உன் நிலத்தின் கனி
  rationale: אַדָמָה என்பதன் நிலம்/மண் என்ற பொருளையும், கருப்பையின் ‘கனி’ என்பதுடனான திட்டமிட்ட இணைநிலையையும் பாதுகாக்கிறது.
- source_word: שְׁגַר אֲלָפֶיךָ
  choice: உன் மாடுகளின் கன்றுகள்
  rationale: மாட்டினம் ஈன்ற இளம் விலங்குகள் அல்லது அதன் பெருக்கத்தைக் குறிக்கும் சொற்றொடரை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: וְעַשְׁתְּרֹת צֹאנֶךָ
  choice: உன் ஆட்டு மந்தைகளின் குட்டிகள்
  rationale: செம்மறியாடுகள் மற்றும் வெள்ளாடுகள் உள்ளிட்ட சிறுகால்நடை மந்தைகளின் குட்டிகள்/பெருக்கத்தைக் குறிக்கும் எபிரெய வழக்கைத் தெளிவாக வெளிப்படுத்துகிறது.
