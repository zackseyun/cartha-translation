  register: நவீன நிலையான தமிழ்; உடன்படிக்கைச் சாபத்தின் கண்ணியமான, அறிவிப்புத் தொனியைப் பேணுகிறது. ‘கனி’ என்ற உருவகம் இரு இணையான சொற்றொடர்களிலும் விடாமல் வைக்கப்பட்டுள்ளது; கால்நடைச் சொற்கள் பொதுவாசகர்களுக்குத் தெளிவாக மாற்றப்பட்டுள்ளன.
