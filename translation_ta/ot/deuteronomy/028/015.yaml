  text: וְ/הָיָ֗ה אִם לֹ֤א תִשְׁמַע֙ בְּ/קוֹל֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ לִ/שְׁמֹ֤ר לַ/עֲשׂוֹת֙ אֶת כָּל מִצְוֺתָ֣י/ו וְ/חֻקֹּתָ֔י/ו אֲשֶׁ֛ר אָנֹכִ֥י מְצַוְּ/ךָ֖ הַ/יּ֑וֹם וּ/בָ֧אוּ עָלֶ֛י/ךָ כָּל הַ/קְּלָל֥וֹת הָ/אֵ֖לֶּה וְ/הִשִּׂיגֽוּ/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/015.yaml
  text: But if you do not listen to the voice of Yahweh your God[a], to keep and to do all his commandments and his statutes that I am commanding you today[b], then all these curses will come upon you and overtake you.
translation:
  language: ta
  text: ஆனால், உன் கடவுளாகிய யாவேவின் குரலுக்குச் செவிகொடுத்து[a], இன்று நான் உனக்குக் கட்டளையிடுகிற அவருடைய எல்லாக் கட்டளைகளையும் சட்டங்களையும் கடைப்பிடித்து நிறைவேற்றாவிட்டால்[b], இந்தச் சாபங்கள் அனைத்தும் உன்மேல் வந்து உன்னை எட்டிப்பிடிக்கும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரேயத்தில், “குரலுக்குச் செவிகொடு.” இந்த மரபுத்தொடர் கீழ்ப்படிந்து கேட்பதையும் குறிக்கிறது; “கீழ்ப்படியாவிட்டால்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “அவருடைய எல்லாக் கட்டளைகளையும் சட்டங்களையும் கடைப்பிடித்து நிறைவேற்ற” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה אִם לֹא
  choice: ஆனால் ... செவிகொடுக்காவிட்டால்
  rationale: முந்தைய ஆசீர்வாதப் பகுதிக்கு மாறான நிபந்தனையை அறிமுகப்படுத்தும் தொடரை இயல்பான தமிழில் காட்டுகிறது.
- source_word: תִשְׁמַע בְּקוֹל
  choice: குரலுக்கு ... செவிகொடு
  rationale: கேட்டலோடு கீழ்ப்படிதலையும் உள்ளடக்கும் எபிரேய மரபுத்தொடரின் செவிவழி உருவகத்தைத் தக்கவைக்கிறது.
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: உன் கடவுளாகிய யாவே
  rationale: இறைவனின் உடன்படிக்கைப் பெயரையும் இரண்டாம் நபர் ஒருமை உறவையும் நேரடியாகக் காட்டுகிறது.
- source_word: לִשְׁמֹר לַעֲשׂוֹת
  choice: கடைப்பிடித்து நிறைவேற்றும்படி
  rationale: ‘காத்தல்/கடைப்பிடித்தல்’ மற்றும் ‘செய்தல்’ என்ற இரு வினையெச்சங்களின் வேறுபாட்டைப் பாதுகாத்து இயல்பான தமிழில் தருகிறது.
- source_word: כָּל מִצְוֺתָיו וְחֻקֹּתָיו
  choice: அவருடைய எல்லாக் கட்டளைகளையும் சட்டங்களையும்
  rationale: மִצְוָה மற்றும் חֹק என்ற சட்டவியல் சொற்களுக்கிடையிலான வேறுபாட்டைத் தக்கவைக்கிறது.
- source_word: אֲשֶׁר אָנֹכִי מְצַוְּךָ הַיּוֹם
  choice: இன்று நான் உனக்குக் கட்டளையிடுகிற
  rationale: பேச்சின் நிகழ்கால உடனடித்தன்மையையும் ஒருமை முகவரியையும் காட்டுகிறது.
- source_word: וּבָאוּ עָלֶיךָ כָּל הַקְּלָלוֹת הָאֵלֶּה
  choice: இந்தச் சாபங்கள் அனைத்தும் உன்மேல் வந்து
  rationale: சாபங்கள் ஒருவர்மேல் வந்து சேரும் மூலமொழி உருவகத்தை நேரடியாகப் பாதுகாக்கிறது.
- source_word: וְהִשִּׂיגוּךָ
  choice: உன்னைப் பிடித்துக்கொள்ளும்
  rationale: பின்தொடர்ந்து எட்டிப்பிடிக்கும் உயிரோட்டமான உருவகத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: יְהוָה என்ற உடன்படிக்கைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் பட்டம் அல்ல, தனிப்பட்ட இறைப்பெயர் நேரடியாக இடம்பெறுவதால் அதை ஒலிபெயர்த்து வழங்குகிறது.
- issue: கேட்டல்–கீழ்ப்படிதல் மரபுத்தொடரின் வெளிப்படைத்தன்மை
  choice: யாவேவின் குரலுக்கு ... செவிகொடுக்காவிட்டால்
  alternative: யாவேவுக்குக் கீழ்ப்படியாவிட்டால்
  rationale: கீழ்ப்படிதல் உட்பொருளாக இருந்தாலும், மூலத்தின் ‘குரலுக்குச் செவிகொடுத்தல்’ என்ற உடன்படிக்கைச் சார்ந்த உருவகத்தையும் அதன் நுணுக்கத்தையும் தக்கவைக்கிறது.
- issue: לִשְׁמֹר לַעֲשׂוֹת என்ற இணையின் பொருள்
  choice: கடைப்பிடித்து நிறைவேற்றும்படி
  alternative: கவனமாகச் செய்யும்படி
  rationale: மூலத்தில் வெளிப்படையாக இல்லாத ‘கவனமாக’ என்பதைச் சேர்க்காமல், இரு வினைகளையும் தனித்தனியாகப் பிரதிபலிக்கிறது.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. ஒருமை ஆண்பால் முகவரி தமிழில் இயல்பாக ‘நீ/உன்’ என வழங்கப்பட்டுள்ளது. ‘கட்டளைகள்’ மற்றும் ‘சட்டங்கள்’ என்ற சட்டவியல் வேறுபாடு பாதுகாக்கப்பட்டுள்ளது; யாவே என்ற இறைப்பெயர் ஒலிபெயர்க்கப்பட்டுள்ளது.
