  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וְ/הֵשִׁ֣יב בְּ/ךָ֗ אֵ֚ת כָּל מַדְוֵ֣ה מִצְרַ֔יִם אֲשֶׁ֥ר יָגֹ֖רְתָּ מִ/פְּנֵי/הֶ֑ם וְ/דָבְק֖וּ בָּֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/060.yaml
  text: And he will bring back upon you all the diseases of Egypt that you dreaded[c][b][a], and they will cling to you.
translation:
  language: ta
  text: நீ அஞ்சிய[b] எகிப்தின் எல்லா நோய்களையும்[a] அவர் மீண்டும் உன்மேல் கொண்டுவருவார்; அவை உன்னைப் பற்றிக்கொள்ளும்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “நோய்கள்” என்பதற்கு “பிணிகள்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “அஞ்சிய” என்பதற்கு “பயந்த” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: “பற்றிக்கொள்ளும்” என்பதற்கு “ஒட்டிக்கொள்ளும்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵשִׁיב
  choice: மீண்டும் கொண்டுவருவார்
  rationale: שׁוב என்பதன் ஹிஃபில் வடிவம் ‘திரும்பச் செய்வது/மீண்டும் கொண்டுவருவது’ என்ற காரணவினைப் பொருளைத் தருகிறது. உடன்படிக்கைச் சாபங்களின் சூழலில், முன்பு அறியப்பட்ட நோய்களை மறுபடியும் வரச் செய்வதை இது இயல்பாக வெளிப்படுத்துகிறது.
- source_word: בְּךָ
  choice: உன்மேல்
  rationale: நோய்கள் ஒருவர்மேல் கொண்டுவரப்படுவதைத் தமிழில் இயல்பாகவும் மூலத்தின் בְּ முன்னிடைச்சொல்லின் பொருளுக்கு நெருக்கமாகவும் காட்டுகிறது.
- source_word: כָּל מַדְוֵה מִצְרַיִם
  choice: எகிப்தின் எல்லா நோய்களையும்
  rationale: מַדְוֶה என்பது நோய் அல்லது பிணியைக் குறிக்கிறது. ‘எல்லா நோய்களையும்’ என்பது כָּל என்பதையும் கூட்டுப் பொருளையும் தெளிவாகத் தக்கவைக்கிறது.
- source_word: אֲשֶׁר יָגֹרְתָּ מִפְּנֵיהֶם
  choice: நீ அஞ்சிய
  rationale: יגר என்பது அச்சம் அல்லது பீதியைக் குறிக்கிறது. நோய்களைக் குறிக்கும் பன்மைச் சுட்டைத் தமிழில் தொடர்புப்பெயரெச்ச அமைப்பு இயல்பாக உள்ளடக்குகிறது.
- source_word: וְדָבְקוּ בָּךְ
  choice: அவை உன்னைப் பற்றிக்கொள்ளும்
  rationale: דבק என்பதன் ‘பற்றிக்கொள்/ஒட்டிக்கொள்’ என்ற வலுவான, நீடித்த இணைப்புப் படிமத்தை ‘பற்றிக்கொள்ளும்’ தெளிவாகவும் dignified modern Tamil register-இலும் தருகிறது.
theological_decisions:
- issue: வினையின் மறைமுக எழுவாய்
  choice: அவர்
  alternative: கர்த்தர்
  rationale: இந்த வசனத்தின் எபிரெய உரையில் இறைநாமம் வெளிப்படையாக இல்லை; வினைச்சொல்லின் ஆண்பால் ஒருமை எழுவாய் முந்தைய சூழலிலிருந்து புரிந்துகொள்ளப்படுகிறது. ‘அவர்’ என்பது அந்தத் தொடர்பைத் தக்கவைத்து, மூலத்தில் இல்லாத இறைநாமத்தை இவ்வசனத்திற்குள் சேர்ப்பதைத் தவிர்க்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் வகையிலும் மரியாதைமிக்க வேதாகம நடையிலும் மொழிபெயர்க்கப்பட்டுள்ளது. எபிரெயச் சொல் வரிசையை இயந்திரமாகப் பின்பற்றாமல், ‘நீ அஞ்சிய எகிப்தின் எல்லா நோய்களையும்’ என்று தமிழுக்குரிய இயல்பான தொடர்புப்பெயரெச்ச அமைப்பு பயன்படுத்தப்பட்டுள்ளது.
