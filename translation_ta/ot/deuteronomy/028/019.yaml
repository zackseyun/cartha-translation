revisions:
- from: நீ உள்ளே வரும்போதும் சபிக்கப்பட்டிருப்பாய்[a]; நீ வெளியே போகும்போதும் சபிக்கப்பட்டிருப்பாய்.
  to: நீ உள்ளே வரும்போது சபிக்கப்பட்டிருப்பாய்[a]; நீ வெளியே போகும்போது சபிக்கப்பட்டிருப்பாய்.
