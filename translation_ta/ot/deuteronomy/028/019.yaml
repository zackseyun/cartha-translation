review_pass:
  verdict: revise
  source_fidelity: The draft accurately renders the repeated Hebrew curse formula, the singular direct address, and the paired ‘coming in/going out’ expression. However, Tamil ‘-போதும்’ can carry the concessive sense ‘even when’; the Hebrew temporal preposition is more directly represented by ‘-போது.’
  naturalness: The main wording is clear and suitably solemn in modern standard Tamil. Replacing ‘வரும்போதும்/போகும்போதும்’ with ‘வரும்போது/போகும்போது’ is more precise and idiomatic for the plain temporal sense. The footnote’s ‘வருதலில்/போதலில்’ is less natural than ‘வருகையிலும்/போகையிலும்.’
  terminology: ‘சபிக்கப்பட்டிருப்பாய்’ appropriately conveys אָרוּר in this covenant-curse context and retains the repeated formal force without imposing an interpretation. ‘உள்ளே வருதல்’ and ‘வெளியே போதல்’ preserve the Hebrew paired idiom.
  issues:
  - severity: low
    issue: Potential concessive nuance in ‘-போதும்’
    rationale: In modern Tamil, ‘வரும்போதும்’ may be understood as ‘even when one comes.’ The Hebrew בְּ plus infinitive construct is temporal (‘when/in one’s coming’), so ‘வரும்போது’ is preferable.
  - severity: low
    issue: Footnote literal wording is not fully natural Tamil
    rationale: ‘உன் உள்ளே வருதலில் ... உன் வெளியே போதலில்’ is understandable but stiff. ‘உன் உள்ளே வருகையிலும் ... உன் வெளியே போகையிலும்’ is both closer to the nominal Hebrew construction and more natural.
  revised_text: நீ உள்ளே வரும்போது சபிக்கப்பட்டிருப்பாய்[a]; நீ வெளியே போகும்போது சபிக்கப்பட்டிருப்பாய்.
  revised_footnotes:
