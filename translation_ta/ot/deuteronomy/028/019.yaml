reference: Deuteronomy 28:19
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: אָר֥וּר אַתָּ֖ה בְּ/בֹאֶ֑/ךָ וְ/אָר֥וּר אַתָּ֖ה בְּ/צֵאתֶֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/019.yaml
  text: Cursed shall you be when you come in[a], and cursed shall you be when you go out.
translation:
  language: ta
  text: நீ உள்ளே வரும்போது சபிக்கப்பட்டிருப்பாய்[a]; நீ வெளியே போகும்போது சபிக்கப்பட்டிருப்பாய்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லர்த்தமாக, “உன் உள்ளே வருகையிலும் ... உன் வெளியே போகையிலும்.” இது அன்றாட வாழ்வின் முழுப் போக்கையும் குறிக்கும் எபிரெய மரபுத்தொடர்.
    reason: cultural_note
lexical_decisions:
- source_word: אָרוּר
  choice: சபிக்கப்பட்டிருப்பாய்
  rationale: ‘சபிக்கப்பட்ட’ என்ற பொருளுடைய எபிரெயப் பெயரெச்ச வடிவம். முன்னிலைப்படுத்தப்பட்ட சாபநிலையையும் உடன்படிக்கைச் சாபத்தின் கடுமையையும் இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: אַתָּה
  choice: நீ
  rationale: இரண்டாம் நபர் ஆண்பால் ஒருமைச் சுட்டுப்பெயர். உடன்படிக்கை முறையில் இஸ்ரவேலை ஒருமையில் நேரடியாக விளிக்கும் அமைப்பைத் தமிழிலும் காக்கிறது.
- source_word: בְּבֹאֶךָ
  choice: நீ உள்ளே வரும்போதும்
  rationale: சொல்லர்த்தமாக ‘உன் உள்ளே வருதலில்.’ இணையான அடுத்த தொடருடன் சேர்ந்து அன்றாட வாழ்வின் முழுப் போக்கையும் குறிக்கும் எபிரெய மரபுத்தொடரை இயல்பாக எடுத்துரைக்கிறது. ‘-உம்’ இணைப்புப் பொருளை ஏற்று இரு நிலைகளையும் உள்ளடக்குகிறது.
- source_word: וְ
  choice: ;
  rationale: எபிரெய இணைப்புச் சொல்லின் தொடர்பு, தமிழில் இணையான இரு முழுக் கூறுகளைப் பிரிக்கும் அரைப்புள்ளியாலும் இரண்டாம் கூறிலுள்ள ‘-உம்’ விகுதியாலும் இயல்பாக வெளிப்படுகிறது.
- source_word: בְּצֵאתֶךָ
  choice: நீ வெளியே போகும்போதும்
  rationale: சொல்லர்த்தமாக ‘உன் வெளியே போதலில்.’ ‘உள்ளே வருதல்’ என்பதுடன் அமைந்த எதிரிணையைப் பாதுகாத்து, அன்றாடச் செயல்களின் முழுப் பரப்பைக் குறிக்கிறது.
theological_decisions:
- issue: உடன்படிக்கைச் சாபச் சூத்திரத்தின் வலியுறுத்தலையும் இயல்பான தமிழ் நடையையும் ஒருங்கிணைத்தல்
  choice: நீ உள்ளே வரும்போதும் சபிக்கப்பட்டிருப்பாய்; நீ வெளியே போகும்போதும் சபிக்கப்பட்டிருப்பாய்.
  alternative: உள்ளே வருகையிலும் நீ சபிக்கப்பட்டவன்; வெளியே போகையிலும் நீ சபிக்கப்பட்டவன்.
  rationale: எபிரெயத்தில் ‘சபிக்கப்பட்ட’ என்பது இரு கூறுகளிலும் வலியுறுத்தப்பட்டாலும், அதைத் தமிழில் தொடக்கத்தில் வைப்பது செயற்கையாக ஒலிக்கலாம். தேர்ந்த வடிவம் இரு கூறுகளிலும் சொல்லைத் திரும்பக் கூறி அதன் முறைமைச் செறிவையும் சாபநிலையையும் காக்கிறது; அதேவேளை இதை வெறும் தனிப்பட்ட வருகை அல்லது புறப்பாட்டுக்குள் மட்டுப்படுத்தவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழ்; எளிதில் புரியக்கூடியதாயும் உடன்படிக்கைச் சாபத்திற்குரிய கண்ணியமான, கடுமையான தொனியுடனும் அமைந்துள்ளது. ஒருமை நேரடி விளிப்பு பாதுகாக்கப்பட்டுள்ளது.
