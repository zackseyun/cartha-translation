base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/030.yaml
  text: You will become engaged to a wife[a], but another man will lie with her; you will build a house, but you will not live in it; you will plant a vineyard[c][b], but you will not begin to use its fruit.
translation:
  language: ta
  text: நீ ஒரு பெண்ணை மணக்க நிச்சயித்துக்கொள்வாய்[a]; ஆனால் வேறொருவன் அவளுடன் பாலுறவு கொள்வான்[b]. நீ ஒரு வீட்டைக் கட்டுவாய்; ஆனால் அதில் குடியிருக்கமாட்டாய். நீ ஒரு திராட்சைத்தோட்டத்தை நடுவாய்; ஆனால் அதன் பழங்களைப் பயன்படுத்தத் தொடங்கமாட்டாய்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இன்னும் சொல்லுக்குச் சொல்லாக, “ஒரு பெண்ணை உனக்காக நிச்சயித்துக்கொள்வாய்.”
    reason: lexical_alternative
  - marker: b
    text: “பாலுறவு கொள்வான்” என்பதற்கான எபிரெய வினை பாலுறவைக் குறிக்கும் கடுமையான, கொச்சையான சொல். சில மொழிபெயர்ப்புகள் “அவளை வன்புணர்வான்” என்று வலுவாக மொழிபெயர்க்கின்றன; ஆனால் இங்குள்ள வினை வடிவம் தனியாக வற்புறுத்தலை வெளிப்படையாகக் குறிப்பிடாததால், இம்மொழிபெயர்ப்பு அதைச் சேர்க்கவில்லை.
    reason: lexical_alternative
  - marker: c
    text: சொல்லுக்குச் சொல்லாக, “அதைத் தீட்டுப்படுத்தமாட்டாய்/பொதுவானதாக்கமாட்டாய்.” திராட்சைத்தோட்டத்தின் பழங்களை வழக்கமான உணவுப் பயன்பாட்டிற்குக் கொண்டுவரத் தொடங்குவதைக் குறிக்கும் மரபுத்தொடர் இது.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְאָרֵשׂ
  choice: மணமுடிக்க நிச்சயம் செய்வாய்
  rationale: திருமணத்தை நோக்கிய சட்டப்பூர்வ நிச்சயத்தைச் சுட்டும் எபிரெய வினையின் பொருளை, நவீனத் தமிழில் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: אִשָּׁה
  choice: ஒரு பெண்ணை
  rationale: இங்கு திருமண நிச்சயத்தின் சூழல் prospective wife என்ற பொருளை அளிக்கிறது; தமிழில் ‘ஒரு பெண்ணை மணமுடிக்க நிச்சயம் செய்வாய்’ என்பது இயல்பாக அந்த உறவைத் தெரிவிக்கிறது.
- source_word: אִישׁ אַחֵר
  choice: வேறொருவன்
  rationale: முகவரியிடப்பட்ட நபருக்கு மாறான மற்றொரு ஆணைச் சுருக்கமாகவும் நேரடியாகவும் குறிக்கிறது.
- source_word: ישגלנה
  choice: அவளுடன் உடலுறவு கொள்வான்
  rationale: இது பாலுறவைக் குறிக்கும் கடுமையான, கொச்சையான எபிரெயச் சொல். தமிழ் மொழிபெயர்ப்பு செயலைத் தெளிவாகச் சொல்கிறது; ஆனால் வினை வடிவில் வெளிப்படையாக இல்லாத வற்புறுத்தலைத் தானாகச் சேர்க்கவில்லை.
- source_word: תֵשֵׁב בּוֹ
  choice: அதில் குடியிருக்கமாட்டாய்
  rationale: வீட்டைச் சார்ந்த ישב என்பதன் இயல்பான பொருள் அங்கே வசிப்பதாகும்; ‘குடியிரு’ நவீனத் தமிழில் துல்லியமானது.
- source_word: כֶּרֶם
  choice: திராட்சைத்தோட்டம்
  rationale: כרם என்பதற்கான வழக்கமான, தெளிவான தமிழ் இணைச்சொல்.
- source_word: תְחַלְּלֶּנּוּ
  choice: அதன் பழங்களைப் பொதுப் பயன்பாட்டிற்குக் கொண்டுவரமாட்டாய்
  rationale: திராட்சைத்தோட்டத்தின் விளைச்சலை வழக்கமான உபயோகத்திற்கு முதன்முறையாகத் திறப்பதைக் குறிக்கும் தொழில்நுட்பப் பயன்பாட்டை வெளிப்படுத்துகிறது; ‘தீட்டுப்படுத்து’ என்ற சொற்பொருள் இச்சூழலில் தவறாகப் புரியலாம்.
