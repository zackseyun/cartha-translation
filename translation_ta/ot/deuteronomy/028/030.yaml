translation_notes:
  register: நவீன நிலையான தமிழில், ஒருமை முகவரியைக் காத்து, சாபவாக்கின் நேரடியான மற்றும் கண்ணியமான தொனி பேணப்பட்டுள்ளது. பாலியல் வினையின் கடுமை மறைக்கப்படவில்லை; அதேவேளை மூல வடிவம் வெளிப்படையாகக் கூறாத வன்முறை சேர்க்கப்படவில்லை. இறுதி கூறின் வேளாண்-சடங்கியல் மரபுத்தொடர் வாசகருக்குப் புரியும் வகையில் உரையிலும் அடிக்குறிப்பிலும் விளக்கப்பட்டுள்ளது.
