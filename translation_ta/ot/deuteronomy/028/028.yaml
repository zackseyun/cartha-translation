source:
  edition: WLC
  text: יַכְּ/כָ֣ה יְהוָ֔ה בְּ/שִׁגָּע֖וֹן וּ/בְ/עִוָּר֑וֹן וּ/בְ/תִמְה֖וֹן לֵבָֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/028.yaml
  text: Yahweh will strike you with madness and blindness and confusion of heart[a].
translation:
  language: ta
  text: யாவே உன்னை மனப்பிறழ்வினாலும் குருட்டுத்தன்மையினாலும் உள்ளக் குழப்பத்தினாலும்[a] தாக்குவார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘உள்ளத் திகைப்பு’ அல்லது ‘உள்ளக் கலக்கம்.’
    reason: תִּמְהוֹן לֵבָב என்பதன் பொருள் குழப்பம், திகைப்பு, கலக்கம் ஆகிய நெருங்கிய உணர்வுகளை உள்ளடக்கலாம்.
lexical_decisions:
- source_word: יַכְּכָה
  choice: உன்னைத் தாக்குவார்
  rationale: נכה என்பதன் ஹிஃபில் வடிவம் தாக்குதல் அல்லது பேரிடரால் வாதித்தல் என்ற வலிமையான பொருளைக் கொண்டுள்ளது. ‘தாக்குவார்’ என்பது உடன்படிக்கைச் சாபத்தின் தீவிரத்தைத் தக்கவைக்கும் இயல்பான நவீனத் தமிழ்.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைப்பட்டமான ‘ஆண்டவர்’ என்று மாற்றாமல், நான்கெழுத்து இறைப்பெயரைத் தமிழில் ஒலிபெயர்த்துள்ளது.
- source_word: בְּשִׁגָּעוֹן
  choice: மனப்பிறழ்வினால்
  rationale: שִׁגָּעוֹן மனநிலை பிறழ்வைக் குறிக்கிறது. ‘மனப்பிறழ்வு’ நேரடியானதும் நவீனத் தமிழில் கண்ணியமானதும் ஆகும்.
- source_word: וּבְעִוָּרוֹן
  choice: குருட்டுத்தன்மையினால்
  rationale: עִוָּרוֹן என்பதன் அடிப்படைப் பொருளான குருட்டுத்தன்மையை விளக்க விரிவாக்கம் செய்யாமல் தக்கவைக்கிறது.
- source_word: וּבְתִמְהוֹן לֵבָב
  choice: உள்ளக் குழப்பத்தினால்
  rationale: תִּמְהוֹן என்பது குழப்பம், திகைப்பு அல்லது கலக்கம் என்பவற்றைக் குறிக்கலாம்; לֵבָב குறிக்கும் அக உள்ளத்தை ‘உள்ளம்’ என இயல்பாக வெளிப்படுத்துகிறது.
- source_word: לֵבָב
  choice: உள்ளம்
  rationale: இச்சொல் இதயம் மட்டுமன்றி சிந்தனை, மனவுறுதி ஆகியவற்றின் அக மையத்தையும் குறிக்கிறது. ‘உள்ளம்’ எபிரேய உருவகத்தை இயல்பான தமிழில் காக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: ஆண்டவர்; யெகோவா
  rationale: மூலவசனம் இறைப்பட்டமல்ல, தனிப்பட்ட உடன்படிக்கைப் பெயரையே பயன்படுத்துகிறது. ஆகவே அதை ஒரு பட்டத்தால் மாற்றாமல் ஒலிபெயர்த்துள்ளது.
translation_notes:
  register: நவீன, பொதுவாகப் புரியும், கண்ணியமான இலக்கியத் தமிழ். மூலத்தின் மூன்று இணையான கருவிப்பொருள் தொடர்களும் இறுதியில் வரும் வலிமையான ‘தாக்குவார்’ என்ற வினையும் பாதுகாக்கப்பட்டுள்ளன.
