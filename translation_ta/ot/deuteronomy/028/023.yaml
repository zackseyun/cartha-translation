source:
  edition: WLC
  text: וְ/הָי֥וּ שָׁמֶ֛י/ךָ אֲשֶׁ֥ר עַל רֹאשְׁ/ךָ֖ נְחֹ֑שֶׁת וְ/הָ/אָ֥רֶץ אֲשֶׁר תַּחְתֶּ֖י/ךָ בַּרְזֶֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/023.yaml
  text: And the heavens above your head shall be bronze[a], and the earth beneath you iron.
translation:
  language: ta
  text: உன் தலைக்கு மேலுள்ள வானம் வெண்கலமாகவும்[a], உனக்குக் கீழுள்ள நிலம் இரும்பாகவும் இருக்கும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘உன் தலைக்கு மேலுள்ள ஆகாயம் செம்பாகவும், உனக்குக் கீழுள்ள தரை இரும்பாகவும் இருக்கும்.’
    reason: נְחֹשֶׁת என்பதற்கு ‘செம்பு’ என்றும், שָׁמַיִם மற்றும் אֶרֶץ என்பவற்றுக்கு இச்சூழலில் ‘ஆகாயம்’, ‘தரை’ என்றும் மொழிபெயர்க்கலாம்.
lexical_decisions:
- source_word: וְהָיוּ
  choice: இருக்கும்
  rationale: சாப அறிவிப்பின் சூழலில் இணைப்புடன் வந்த கால் நிறைவுவினை எதிர்காலப் பொருளைத் தருகிறது; தமிழ் இயல்புக்கு ஏற்றவாறு இறுதியில் ஒரே எதிர்கால வினை பயன்படுத்தப்பட்டுள்ளது.
- source_word: שָׁמֶיךָ אֲשֶׁר עַל רֹאשְׁךָ
  choice: உன் தலைக்கு மேலுள்ள வானம்
  rationale: שָׁמַיִם என்பது ‘வானங்கள்’ அல்லது ‘வானம்/ஆகாயம்’ எனப் பொருள்படலாம். இங்கு வானிலை சார்ந்த உருவகம் என்பதால் ஒருமை வடிவான ‘வானம்’ இயல்பானது; ‘உன் தலைக்கு மேலுள்ள’ என்பது எபிரெயச் சார்புத்தொடரையும் செங்குத்தான காட்சியையும் காக்கிறது.
- source_word: נְחֹשֶׁת
  choice: வெண்கலம்
  rationale: இச்சொல் செம்பையோ வெண்கலத்தையோ குறிக்கலாம். இரும்புடன் இணையும் கடினத்தன்மை உருவகத்தில் ‘வெண்கலம்’ பொருத்தமான முதன்மைத் தேர்வு; ‘செம்பு’ அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: וְהָאָרֶץ אֲשֶׁר תַּחְתֶּיךָ
  choice: உனக்குக் கீழுள்ள நிலம்
  rationale: אֶרֶץ என்பது ‘பூமி’ அல்லது ‘நிலம்’ என வரலாம். வானத்துடன் உள்ள எதிரிணையையும் காலடிக்குக் கீழுள்ள கடினமான தரை என்ற காட்சியையும் தமிழில் இயல்பாக வெளிப்படுத்த ‘நிலம்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: בַּרְזֶל
  choice: இரும்பு
  rationale: உலோகத்திற்கான நேரான, வழக்கமான தமிழ் இணைச்சொல்; விளைச்சல் தராத கடின நிலத்தின் உருவகத்தை நிறைவு செய்கிறது.
theological_decisions:
- issue: சாபத்தின் உலோக உருவகம்
  choice: ‘வெண்கலம்’, ‘இரும்பு’ என்ற நேரடி உலோக உருவகத்தை அப்படியே வைத்தல்
  alternative: வறட்சியால் மூடிய வானம், கடினமான நிலம் என்று விளக்கிப் பரிமாற்றுதல்
  rationale: மூல எபிரெயம் வறட்சியையும் விளைச்சலின்மையையும் நேரடியாக விளக்காமல் தீவிரமான உடன்படிக்கைச் சாப உருவகமாக முன்வைக்கிறது. அந்தத் தெய்வவியல் அழுத்தத்தையும் உண்மையான உருவகத்தையும் வாசகர் உணரும்படி அப்படியே காக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான, பொதுவாசகர்களுக்கு எளிதில் புரியும் தமிழ். மூலத்தின் இணையான ‘மேல்/கீழ்’ அமைப்பும் உலோக உருவகமும் காக்கப்பட்டுள்ளன; தமிழில் இயல்பாக இருக்க ஒரே இறுதி வினை இரு கூறுகளுக்கும் பொருந்துமாறு அமைக்கப்பட்டுள்ளது.
