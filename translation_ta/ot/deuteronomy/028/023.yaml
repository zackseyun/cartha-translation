  source_fidelity: மூல எபிரெயத்தின் எதிர்காலச் சாப அறிவிப்பும், ‘தலைக்கு மேல்/கீழ்’ என்ற இணையான அமைப்பும், வானம்–நிலம் மற்றும் வெண்கலம்–இரும்பு என்ற உலோக உருவகங்களும் துல்லியமாகக் காக்கப்பட்டுள்ளன. ‘வெண்கலம்’ என்பது נְחֹשֶׁת-க்கு சூழலுக்கு ஏற்ற முதன்மைத் தேர்வு; மாற்றான ‘செம்பு’ அடிக்குறிப்பில் சரியாகக் கொடுக்கப்பட்டுள்ளது.
  naturalness: உரை நவீனத் தரமான தமிழில் இயல்பாகவும் கண்ணியமாகவும் உள்ளது. ‘வெண்கலமாகவும் … இரும்பாகவும் இருக்கும்’ என்ற ஒரே இறுதி வினை இரு இணைக் கூறுகளுக்கும் இயல்பாகப் பொருந்துகிறது.
  terminology: ‘வானம்,’ ‘நிலம்,’ ‘வெண்கலம்,’ ‘இரும்பு’ ஆகியவை தெளிவான, பரவலாகப் புரியக்கூடிய சொற்கள். ‘நிலம்’ இங்கு கீழுள்ள பூமி/தரையைக் குறிக்கும் வகையில் பொருத்தமானது; மூலத்தின் பரந்த அண்டவியல் எதிரிணையைத் தகுந்த அளவு காக்கிறது. அடிக்குறிப்பு மாற்று மொழிபெயர்ப்புகளையும் அவற்றின் சொற்தொடர்பான காரணத்தையும் வழங்குகிறது.
