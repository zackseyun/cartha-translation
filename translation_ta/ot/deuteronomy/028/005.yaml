lexical_decisions:
- source_word: בָּרוּךְ
  choice: ஆசீர்வதிக்கப்பட்டிருக்கும்
  rationale: இது ברך என்பதன் செயப்பாட்டு வினையெச்ச வடிவம்; உடன்படிக்கை ஆசீர்வாதங்களின் தொடரில் விருப்ப வேண்டுதலாக அல்லாமல் உறுதியான அறிவிப்பாக அமைவதால், எதிர்கால அறிவிப்பு வலிமையைத் தமிழில் இயல்பாகத் தருகிறது.
- source_word: טַנְאֲךָ
  choice: உன் கூடை
  rationale: טֶנֶא என்பது, குறிப்பாக விளைபொருட்களைச் சுமக்கப் பயன்படும் ஒரு கூடையைக் குறிக்கிறது. எபிரெயத்தில் இல்லாத கூடுதல் குறிப்பைச் சேர்க்காமல் ‘கூடை’ என்பது இயல்பாகவும் போதுமான துல்லியத்துடனும் உள்ளது.
- source_word: וּמִשְׁאַרְתֶּךָ
  choice: உன் மாவு பிசையும் பாத்திரம்
  rationale: מִשְׁאֶרֶת என்பது மாவைப் பிசைத்துத் தயாரிக்கப் பயன்படும் பாத்திரத்தைக் குறிக்கிறது. ‘மாவு பிசையும் பாத்திரம்’ என்பது இன்றைய வாசகர்களுக்கு விளங்கும் இயல்பான சொல்லாக்கம்; அதன் வடிவத்தை எபிரெயம் துல்லியமாகக் குறிப்பிடாததால் ‘தொட்டி’ அல்லது ‘கிண்ணம்’ என்று கட்டுப்படுத்தவில்லை.
