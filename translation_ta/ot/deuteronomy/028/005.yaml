    text: அல்லது, “மாவு பிசையும் தொட்டி.” எபிரெயச் சொல் மாவைப் பிசைத்துத் தயாரிக்கப் பயன்படுத்திய ஒரு பாத்திரத்தைக் குறிக்கிறது.
