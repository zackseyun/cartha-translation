base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/064.yaml
  text: And Yahweh will scatter you among all the peoples[a], from one end of the earth to the other end of the earth[b], and there you will serve other gods that neither you nor your fathers have known—wood and stone.
translation:
  language: ta
  text: யாவே உன்னை எல்லா மக்களினங்களுக்கிடையிலும், பூமியின் ஒரு முனையிலிருந்து பூமியின் மறுமுனைவரை சிதறடிப்பார்.[a] அங்கே நீயும் உன் முன்னோர்களும் அறிந்திராத வேறு தெய்வங்களை—மரமும் கல்லுமான தெய்வங்களை—நீ சேவிப்பாய்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘பூமியின் ஒரு முனையிலிருந்து பூமியின் மறுமுனைவரை’ என்பதற்கு ‘நாட்டின் ஒரு முனையிலிருந்து நாட்டின் மறுமுனைவரை’ என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் אֶרֶץ என்பது ‘நாடு’ அல்லது ‘பூமி’ என்று பொருள்படலாம்; எல்லா மக்களினங்களுக்கிடையிலும் சிதறடிக்கப்படுவது இங்கு கூறப்படுவதால் ‘பூமி’ எனத் தரப்பட்டுள்ளது.
    reason: lexical_alternative
  - marker: b
    text: ‘மரமும் கல்லுமான தெய்வங்கள்’ என்பது மரம் மற்றும் கல் ஆகிய பொருட்களால் செய்யப்பட்ட சிலைகளைக் குறிக்கிறது.
    reason: cultural_note
lexical_decisions:
- source_word: וֶהֱפִיצְךָ
  choice: உன்னைச் சிதறடிப்பார்
  rationale: פוץ என்பதன் ஹிஃபில் வடிவம் ஒருவரைச் சிதறிப்போகச் செய்வதைக் குறிக்கிறது. உடன்படிக்கைச் சாபத்தின் வலிமையையும் இயல்பான நவீனத் தமிழையும் இது காக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய தனிப்பெயரான יהוה-ஐ ஒரு பட்டப்பெயரால் மாற்றாமல், தமிழில் வழக்கமான ஒலிபெயர்ப்பாகத் தருகிறது.
- source_word: בְּכָל הָעַמִּים
  choice: எல்லா மக்களினங்களுக்கிடையிலும்
  rationale: עַמִּים என்பது அரசியல் நாடுகளை மட்டும் அல்லாமல் பல்வேறு மக்கள் கூட்டங்களைக் குறிக்கிறது; ‘மக்களினங்கள்’ அந்தப் பொருளைத் தெளிவாகக் காக்கிறது.
- source_word: מִקְצֵה הָאָרֶץ וְעַד קְצֵה הָאָרֶץ
  choice: பூமியின் ஒரு முனையிலிருந்து பூமியின் மறுமுனைவரை
  rationale: முழு புவியியல் பரப்பையும் குறிக்கும் சொற்றொடர். சூழலில் எல்லா மக்களினங்களிடையிலும் சிதறடிக்கப்படுவது கூறப்படுவதால் ‘பூமி’ முதன்மையாகத் தேர்ந்தெடுக்கப்பட்டது; எபிரெயத்தின் மறுபடியுரைத்தலும் காக்கப்பட்டது.
- source_word: וְעָבַדְתָּ
  choice: நீ சேவிப்பாய்
  rationale: עבד என்பது தெய்வங்களைப் பொருளாகக் கொள்ளும்போது வழிபாட்டுச் சார்ந்த பணிவையும் பற்றுறுதியையும் குறிக்கலாம். ‘சேவிப்பாய்’ மூல வினையின் பரப்பைச் சுருக்காமல் காக்கிறது.
- source_word: אֱלֹהִים אֲחֵרִים
  choice: வேறு தெய்வங்கள்
  rationale: யாவே அல்லாத தெய்வங்களைக் குறிக்கும் உடன்படிக்கைச் சூழலிலான நேரடியான மொழிபெயர்ப்பு.
- source_word: אֲשֶׁר לֹא יָדַעְתָּ אַתָּה וַאֲבֹתֶיךָ
  choice: நீயும் உன் முன்னோர்களும் அறிந்திராத
  rationale: ידע வினையை மிகைவிளக்கம் இன்றி ‘அறிந்திராத’ எனக் காக்கிறது; ‘நீயும் உன் முன்னோர்களும்’ என்ற இணைப்பு இரு தரப்பையும் உள்ளடக்குகிறது.
- source_word: עֵץ וָאָבֶן
  choice: மரத்தையும் கல்லையும்
  rationale: வேறு தெய்வங்கள் எனப்படும் சிலைகளின் பொருட்களை அடையாளப்படுத்தும் இணைப்புச் சொற்களாக மூலத்தின் சுருக்கத்தையும் வலிமையையும் காக்கிறது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் தனிப்பெயர் நேரடியாக இருப்பதால், அதை பொதுவான பட்டப்பெயராக மாற்றாமல் ஒலிபெயர்த்து வழங்கப்படுகிறது.
- issue: הָאָרֶץ என்பதன் பரப்பு
  choice: பூமி
  alternative: நாடு
  rationale: אֶרֶץ என்பதற்கு ‘நாடு’ அல்லது ‘பூமி’ என்ற இரு பொருள்களும் இருக்கலாம். ஆனால் ‘எல்லா மக்களினங்களுக்கிடையிலும்’ சிதறடிக்கப்படுதல் என்ற உடனடிச் சூழல் விரிந்த புவியியல் பொருளை ஆதரிக்கிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் காக்கப்படுகிறது.
- issue: வேறு தெய்வங்களைச் ‘சேவித்தல்’
  choice: சேவிப்பாய்
  alternative: வழிபடுவாய்
  rationale: தெய்வங்களைச் சேவிப்பது வழிபாட்டையும் பற்றுறுதியையும் உட்படுத்தினாலும், עבד என்ற மூல வினையின் திட்டமிட்ட பரந்த பொருளை ‘சேவிப்பாய்’ காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. தீர்க்கதரிசனச் சாபத்தின் தீவிரத்தை ‘சிதறடிப்பார்’ காக்கிறது. ‘மக்களினங்கள்’ என்பது ‘நாடுகள்’ என்பதைக் காட்டிலும் எபிரெயச் சொல்லின் மக்கள்-கூட்டப் பொருளை நெருக்கமாக வெளிப்படுத்துகிறது. மூலத்தின் இறுதி ‘மரமும் கல்லும்’ என்ற வலுவான இணைப்பை இடைக்கோடுகள் மூலம் தனிப்படுத்தப்பட்டுள்ளது.
