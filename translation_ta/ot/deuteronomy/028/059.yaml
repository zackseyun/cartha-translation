base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/059.yaml
  text: then Yahweh will make your plagues and the plagues of your offspring extraordinary—great and lasting plagues[b][a], and severe and lasting sicknesses.
translation:
  language: ta
  text: அப்போது யாவே உன் வாதைகளையும் உன் சந்ததியின் வாதைகளையும் அசாதாரணமானவையாக்குவார்[a]—பெரியதும் நீடித்ததுமான வாதைகளையும்[b], கடுமையானதும் நீடித்ததுமான நோய்களையும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “வியக்கத்தக்கவையாக.” இங்குள்ள எபிரேய வினைச்சொல் ஒன்றை வழக்கத்திற்கு அப்பாற்பட்டதாக அல்லது குறிப்பிடத்தக்கதாக ஆக்குவதைக் குறிக்கலாம்; இச்சூழலில் அது தீர்ப்பின் விதிவிலக்கான தீவிரத்தை விவரிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: “நீடித்ததுமான” என்று மொழிபெயர்க்கப்பட்ட எபிரேயச் சொல் உறுதியான, நிலைத்த அல்லது தொடர்ந்து நீடிக்கும் என்ற பொருளுடையது. வாதைகளையும் நோய்களையும் விவரிக்க மூலத்தில் இதே சொல் பயன்படுத்தப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִפְלָא
  choice: அசாதாரணமானவையாக ஆக்குவார்
  rationale: פלא என்பதன் ஹிஃபில் வடிவம் இங்கு வாதைகளை வழக்கத்திற்கு அப்பாற்பட்ட, வியக்கத்தக்க அளவுடையவையாக ஆக்குதல் என்று பொருள்படுகிறது. தீர்ப்பின் சூழலில் நேர்மறையான ‘அற்புதம்’ என்ற எண்ணத்தைத் தவிர்க்க இந்தச் சொற்றொடர் தேர்ந்தெடுக்கப்பட்டது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இது பட்டப்பெயரால் மாற்றப்படாமல், எபிரேய இறைப்பெயரின் தமிழில் இயல்பான ஒலிபெயர்ப்பாக வழங்கப்படுகிறது.
- source_word: מַכֹּתְךָ / מַכּוֹת
  choice: உனக்கு வரும் வாதைகள் / வாதைகள்
  rationale: מכה என்பது அடி, தாக்குதல் அல்லது வாதை எனப் பொருள்படும். உடன்படிக்கைச் சாபங்களின் சூழலிலும் நோய்களுடன் உள்ள இணைப்பிலும் ‘வாதைகள்’ பொருத்தமானது.
- source_word: זַרְעֶךָ
  choice: உன் சந்ததி
  rationale: זרע என்பதன் கூட்டுப்பொருளை நவீன தமிழில் இயல்பாகத் தெரிவிக்கிறது.
- source_word: גְּדֹלוֹת
  choice: பெரிதும்
  rationale: அளவு அல்லது தீவிரத்தைச் சுட்டும் ‘பெரிய’ என்ற அடிப்படைப் பொருளை, தமிழ் வாக்கியத்தில் இயல்பான வினையடை வடிவில் தெரிவிக்கிறது.
- source_word: נֶאֱמָנוֹת / נֶאֱמָנִים
  choice: நீடித்தும் இருக்கும் / நீடித்திருப்பதுமான
  rationale: אמן வேரின் இங்குள்ள பொருள் உறுதியாக நிலைத்திருப்பது அல்லது தொடர்ந்து நீடிப்பது. வாதைகளுக்கும் நோய்களுக்கும் ஒரே சொல்லை மீண்டும் பயன்படுத்திய எபிரேய அமைப்பு தமிழிலும் ஒரே கருத்தால் காக்கப்படுகிறது.
- source_word: חֳלָיִם
  choice: நோய்கள்
  rationale: சுகவீனம் அல்லது நோய் என்பதைக் குறிக்கும் பன்மைச் சொல்; நவீன தமிழில் தெளிவானதும் இயல்பானதும்.
- source_word: רָעִים
  choice: கடுமையான
  rationale: அடிப்படையில் ‘தீய/மோசமான’ எனினும் நோய்களைச் சார்ந்த இச்சூழலில் அவற்றின் கொடுமையையும் தீவிரத்தையும் ‘கடுமையான’ தெளிவாகக் காட்டுகிறது.
theological_decisions:
- issue: יְהוָה என்ற உடன்படிக்கைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலத்தில் உள்ள தனிப்பட்ட இறைப்பெயரை ஒரு பட்டப்பெயரால் மாற்றாமல் ஒலிபெயர்த்து வழங்குகிறது; குறிப்பிட்ட சமய மரபின் தனித்துவத்தைத் திணிக்காது.
- issue: தீர்ப்புச் சூழலில் פלא என்பதன் வலிமை
  choice: அசாதாரணமானவையாக ஆக்குவார்
  alternative: வியக்கத்தக்கவையாக ஆக்குவார் / அற்புதமானவையாக ஆக்குவார்
  rationale: இச்சொல் வழக்கத்திற்கு அப்பாற்பட்ட தன்மையைச் சுட்டுகிறது. ‘அற்புதமான’ என்பதில் தோன்றக்கூடிய நேர்மறை நிழற்பொருளைத் தவிர்த்து, தீர்ப்பின் விதிவிலக்கான தீவிரத்தை வெளிப்படுத்துகிறது.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியக்கூடிய கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. எபிரேய வாக்கியத்தின் தீவிரமும், வாதைகள் மற்றும் நோய்கள் இடையிலான இணை அமைப்பும், ‘நீடித்த’ என்ற கருத்தின் மறுபயன்பாடும் காக்கப்பட்டுள்ளன. அடிக்குறிப்பு குறிகள் உரையில் [a], [b] என இடம்பெற்றுள்ளன.
