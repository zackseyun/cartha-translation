revisions:
- from: அப்போது யாவே உனக்கும் உன் சந்ததிக்கும் வரும் வாதைகளை அசாதாரணமானவையாக[a] ஆக்குவார்—அவை பெரிதும் நீடித்தும் இருக்கும் வாதைகள்[b]; மேலும், கடுமையானதும் நீடித்திருப்பதுமான நோய்களை வரச்செய்வார்.
  to: அப்போது யாவே உன் வாதைகளையும் உன் சந்ததியின் வாதைகளையும் அசாதாரணமானவையாக்குவார்[a]—பெரியதும் நீடித்ததுமான வாதைகளையும்[b], கடுமையானதும் நீடித்ததுமான நோய்களையும்.
  rationale: The revision retains the Hebrew's single governing verb for the plagues and sicknesses, preserves the appositional structure and repeated 'enduring' terminology, and improves Tamil flow without adding the idea that the sicknesses are separately caused to come.
