lexical_decisions:
- source_word: אָרוּר
  choice: சபிக்கப்பட்டிருக்கும்
  rationale: எபிரெய மொழியின் செயப்படுபொருள் பங்கேற்பு வடிவிலான சாப அறிவிப்பை, சுற்றியுள்ள உடன்படிக்கைச் சாபங்களுடன் பொருந்தும் இயல்பான தமிழ் எதிர்கால அறிவிப்பாக வழங்குகிறது.
- source_word: טַנְאֲךָ
  choice: உன் கூடை
  rationale: இச்சொல் பொதுவாக விளைபொருட்களைச் சேகரிக்கும் கூடையைக் குறிக்கிறது; உள்ளடக்கத்தைத் தேவையின்றிக் குறிப்பாக்காமல் பொதுவான பொருளைப் பேணுகிறது.
- source_word: וּמִשְׁאַרְתֶּךָ
  choice: உன் மாவு பிசையும் பாத்திரம்
  rationale: மாவைப் பிசைவதற்குப் பயன்படுத்தப்படும் கொள்கலனைத் தெளிவான நவீன தமிழில் குறிக்கிறது; அதன் வடிவம் அல்லது அளவை மூலத்தைவிட அதிகமாக வரையறுக்கவில்லை.
