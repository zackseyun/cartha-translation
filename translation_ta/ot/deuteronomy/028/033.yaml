base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/033.yaml
  text: A people whom you have not known will eat the fruit of your land and all your labor[b][a], and you will be only oppressed and crushed all your days.
translation:
  language: ta
  text: நீ அறிந்திராத ஓர் இனத்தார் உன் நிலத்தின் கனியையும்[a] உன் உழைப்பின் பயன் அனைத்தையும்[b] உண்பார்கள்; நீயோ உன் வாழ்நாளெல்லாம் ஒடுக்கப்பட்டும் நொறுக்கப்பட்டும் மட்டுமே இருப்பாய்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உன் நிலத்தின் விளைச்சல்.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “உன் உழைப்பு அனைத்தும்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּרִי אַדְמָתְךָ
  choice: உன் நிலத்தின் கனி
  rationale: ‘கனி’ என்பது எபிரேயச் சொல்லின் அடிப்படைப் பொருளையும் வேளாண்மை சார்ந்த உருவகத்தையும் காக்கிறது; இச்சூழலில் அது நிலத்தின் மொத்த விளைச்சலையும் குறிக்கலாம்.
- source_word: יְגִיעֲךָ
  choice: உன் உழைப்பின் பயன் அனைத்தும்
  rationale: இச்சொல் உழைப்பையோ உழைப்பால் கிடைத்த பயனையோ குறிக்கலாம். ‘உண்பார்கள்’ என்ற வினையுடன் இயல்பாக அமைய, உழைப்பின் விளைவை வெளிப்படையாகக் கூறுகிறது.
- source_word: יֹאכַל
  choice: உண்பார்கள்
  rationale: மூலத்தின் சாதாரண ‘உண்’ என்ற வினையைத் தக்கவைத்து, தேவையற்ற தீவிரத்தைச் சேர்க்காமல் பொருளைத் தருகிறது.
- source_word: עַם אֲשֶׁר לֹא יָדָעְתָּ
  choice: நீ அறிந்திராத ஓர் இனத்தார்
  rationale: ஒருமை கூட்டுப்பெயரான עַם வேறொரு மக்கள் இனத்தைக் குறிக்கிறது; ידע இங்கு முன்பு அறிமுகமில்லாத நிலையை உணர்த்துகிறது.
- source_word: רַק עָשׁוּק וְרָצוּץ
  choice: ஒடுக்கப்பட்டும் நொறுக்கப்பட்டும் இருப்பாய்
  rationale: இரு செயல்பாட்டு நிலைகளின் வலிமையையும் காக்கிறது. רַק தரும் விலக்கற்ற, தொடர்ந்த நிலை தமிழில் வாக்கிய அமைப்பாலும் காலக் குறிப்பாலும் வெளிப்படுகிறது.
- source_word: כָּל הַיָּמִים
  choice: உன் வாழ்நாளெல்லாம்
  rationale: தனிப்பட்ட முகவரியையும் நீடித்த காலத்தையும் இயல்பான தமிழில் தெரிவிக்கிறது.
