translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையும் கண்ணியமும் காக்கப்பட்டுள்ளன. ஒருமை கூட்டுப்பெயரான ‘இனம்’ மனிதர்களைக் குறிப்பதால் ‘இனத்தார்’ என்றும் மரியாதைப் பன்மை வினையுடனும் வழங்கப்பட்டுள்ளது; இரண்டாம் நபர் ஒருமை முழுவதும் தக்கவைக்கப்பட்டுள்ளது.
