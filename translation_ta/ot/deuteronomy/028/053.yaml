source:
  edition: WLC
  text: וְ/אָכַלְתָּ֣ פְרִֽי בִטְנְ/ךָ֗ בְּשַׂ֤ר בָּנֶ֨י/ךָ֙ וּ/בְנֹתֶ֔י/ךָ אֲשֶׁ֥ר נָֽתַן לְ/ךָ֖ יְהוָ֣ה אֱלֹהֶ֑י/ךָ בְּ/מָצוֹר֙ וּ/בְ/מָצ֔וֹק אֲשֶׁר יָצִ֥יק לְ/ךָ֖ אֹיְבֶֽ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/053.yaml
  text: And you will eat the fruit of your womb[a], the flesh of your sons and daughters whom Yahweh your God has given you[b], in the siege and in the distress with which your enemy will oppress you.
translation:
  language: ta
  text: உன் கடவுளாகிய யாவே உனக்குக் கொடுத்த உன் மகன்கள் மகள்களின் சதையாகிய உன் கருப்பையின் கனியை[a], உன் பகைவன் உனக்கு உண்டாக்கும் முற்றுகையிலும் நெருக்கடியிலும்[b] நீ உண்பாய்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உன் உடலிலிருந்து பிறந்தவர்கள்” அல்லது “உன் சந்ததி.” எபிரேயத்தில் சொல்லுக்குச் சொல், “உன் கருப்பையின் கனி.”
    reason: lexical_alternative
  - marker: b
    text: “நெருக்கடி” என்பதற்கு “கடுந்துயரம்,” “கடும் நெருக்கம்,” அல்லது “வேதனை” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָכַלְתָּ
  choice: நீ உண்பாய்
  rationale: சாப அறிவிப்பின் சூழலில் இணைப்புடன் வரும் Qal perfect எதிர்காலத்தில் நிகழப்போவதை உறுதியாகக் கூறுகிறது; நவீன தமிழில் “உண்பாய்” இயல்பாக அந்த வலிமையைத் தருகிறது.
- source_word: פְרִי בִטְנְךָ
  choice: உன் கருப்பையின் கனி
  rationale: ஒருவரின் பிள்ளைகளைக் குறிக்கும் எபிரேய உருவகத்தைத் தக்கவைக்கிறது. ஆண் ஒருவரை நோக்கிக் கூறப்பட்டாலும், בֶּטֶן இங்கு அவனிடமிருந்து பிறந்த சந்ததியைச் சுட்டும் மரபுத்தொடர்.
- source_word: בְּשַׂר בָּנֶיךָ וּבְנֹתֶיךָ
  choice: உன் மகன்களையும் மகள்களையும்—அவர்களின் சதையை
  rationale: எபிரேயம் இரு பாலினத்தவரையும் வெளிப்படையாகக் குறிப்பிடுவதோடு மனிதச் சதையை உண்பதன் கொடூரத்தையும் வலியுறுத்துகிறது; “சதை” அந்தக் கடுமையைத் துல்லியமாகக் காக்கிறது.
- source_word: אֲשֶׁר נָתַן לְךָ יְהוָה אֱלֹהֶיךָ
  choice: உன் கடவுளாகிய யெகோவா உனக்குக் கொடுத்த
  rationale: பிள்ளைகள் கடவுள் கொடுத்த வரங்கள் என்ற உடன்படிக்கை சார்ந்த நினைவூட்டலைத் தக்கவைத்து, தீர்ப்பின் கொடுமையை எடுத்துக்காட்டுகிறது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: திருப்பெயரை பொதுப்பட்டமாக மாற்றாமல், தமிழில் பரவலாக அறியப்படும் தனிப்பெயர் வடிவில் வழங்குகிறது.
- source_word: בְּמָצוֹר וּבְמָצוֹק
  choice: முற்றுகையிலும் ... கடுந்துயரிலும்
  rationale: מָצוֹר என்பது முற்றுகை நிலையையும், מָצוֹק என்பது அதனால் உண்டாகும் கடும் நெருக்கடி அல்லது துயரையும் குறிக்கிறது; இரண்டையும் தனித்தனியாகக் காக்கிறது.
- source_word: אֲשֶׁר יָצִיק לְךָ אֹיְבֶךָ
  choice: உன் பகைவன் உன்னை நெருக்குகிற
  rationale: Hiphil வடிவம் பகைவன் ஏற்படுத்தும் அழுத்தம், கட்டுப்பாடு, ஒடுக்குதல் ஆகிய பொருள் பரப்பைக் கொண்டது; “நெருக்குகிற” என்பது முற்றுகைச் சூழலுக்கும் தமிழுக்கும் இயல்பானது.
theological_decisions:
- issue: יְהוָה என்ற திருப்பெயரை மொழிபெயர்த்தல்
  choice: யெகோவா
  alternative: யாவே
  rationale: எபிரேயத்தில் திருப்பெயர் நேரடியாக இடம்பெறுவதால் “ஆண்டவர்” என்ற பட்டமாக மாற்றவில்லை. உயிரெழுத்தாக்கம் உறுதியாகத் தெரியாத நிலையில், நவீன தமிழ்க் கிறிஸ்தவப் பயன்பாட்டில் பரவலாக அறியப்படும் “யெகோவா” வடிவைத் தேர்ந்தெடுத்தோம்; மாற்று ஒலிபெயர்ப்பு அடிக்குறிப்பில் தரப்படுகிறது.
- issue: “உன் கருப்பையின் கனி” என்ற ஆண் முகவரியுடைய உருவகம்
  choice: எபிரேய உருவகத்தைத் தக்கவைத்தல்
  alternative: உன் உடலிலிருந்து பிறந்தவர்கள் / உன் சந்ததி
  rationale: மூலத்தின் திட்டமிட்ட உடல் சார்ந்த உருவகம், அதைத் தொடர்ந்து வரும் “சதை” என்ற சொல்லுடன் சேர்ந்து தீர்ப்பின் அதிர்ச்சியை அதிகரிக்கிறது; விளக்கமான மாற்றை அடிக்குறிப்பில் தருவது ambiguity-ஐப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன தரநிலைத் தமிழில், உடன்படிக்கைச் சாபத்தின் கண்ணியமானதாயினும் அதிர்ச்சியூட்டும் தொனியைப் பேணியுள்ளோம். “சதை” மற்றும் “உண்பாய்” போன்ற நேரடியான சொற்கள் மூலத்தின் கொடூரத்தை மென்மைப்படுத்தாமல் வழங்குகின்றன. வாக்கியத் தெளிவுக்காக appositional கூறு கோடுகளுக்குள் அமைக்கப்பட்டுள்ளது.
