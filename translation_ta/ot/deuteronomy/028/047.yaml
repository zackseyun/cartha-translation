  source_fidelity: 'மூலத்தின் முக்கியக் கூறுகள் பாதுகாக்கப்பட்டுள்ளன: காரணத் தொடர்பு, ஒருமை முகவரி, யாவே என்ற இறைப்பெயர், உடன்படிக்கைச் சேவையைக் குறிக்கும் ‘சேவிக்க’, மகிழ்ச்சி மற்றும் உள்ளார்ந்த நலநிலை ஆகிய இரட்டைக் குறிப்பு ஆகியவை சரியாக உள்ளன. ஆனால் ‘இருந்தபோதும்’ என்பது מֵרֹב כֹּל என்பதில் வெளிப்படையாக இல்லாத வலுவான concessive (‘என்றபோதிலும்’) உறவைச் சேர்க்கிறது. மூலத்தின் கால/சூழ்நிலை அல்லது காரண நிழலைத் திறந்தே வைக்க ‘இருந்தபோது’ ஏற்றது.'
