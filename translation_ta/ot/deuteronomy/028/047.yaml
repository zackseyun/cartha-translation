  text: תַּ֗חַת אֲשֶׁ֤ר לֹא עָבַ֨דְתָּ֙ אֶת יְהוָ֣ה אֱלֹהֶ֔י/ךָ בְּ/שִׂמְחָ֖ה וּ/בְ/ט֣וּב לֵבָ֑ב מֵ/רֹ֖ב כֹּֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/047.yaml
  text: because you did not serve Yahweh your God with joy and with gladness of heart[a], because of the abundance of all things[b],
translation:
  language: ta
  text: நீ உன் கடவுளாகிய யாவேவை மகிழ்ச்சியோடும் மனமகிழ்வோடும்[a] சேவிக்காததால், எல்லாவற்றிலும் மிகுதி இருந்தபோது[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லுக்குச் சொல், “இதயத்தின் நன்மையோடும்.” இது “நல்ல மனதோடும்,” “மனநிறைவோடும்,” அல்லது “உள்ளம் மகிழ்ந்தபடியும்” என்றும் பொருள்படலாம்.
    reason: lexical_alternative
  - marker: b
    text: சொல்லுக்குச் சொல், “எல்லாவற்றின் மிகுதியிலிருந்து” அல்லது “எல்லாவற்றின் மிகுதியினால்.” ஏராளமான வழங்கல் இருந்த சூழ்நிலையையும் இது சுட்டலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּחַת אֲשֶׁר
  choice: சேவிக்காததால்
  rationale: உடன்படிக்கைச் சாபத்திற்கான காரணத்தை அறிமுகப்படுத்தும் இந்த எபிரெயச் சொற்றொடரின் காரணப் பொருளைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: עָבַדְתָּ
  choice: சேவிக்க
  rationale: கடவுளுக்கான கீழ்ப்படிதல், பக்தி, வழிபாடு ஆகியவற்றை உள்ளடக்கும் உடன்படிக்கைப் பணியைச் சுருக்காமல் காட்டுகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தலைப்புப் பெயரால் மாற்றாமல், எபிரெய மூலத்திலுள்ள இறைவனின் தனிப்பெயரைத் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: אֱלֹהֶיךָ
  choice: உன் கடவுளாகிய
  rationale: இரண்டாம் நபர் ஒருமை உடைமைச் சுட்டைத் தக்கவைத்து, தமிழில் யாவே என்ற பெயருடன் இயல்பாக இணைக்கிறது.
- source_word: בְּשִׂמְחָה
  choice: மகிழ்ச்சியோடும்
  rationale: சேவையின் மனப்பாங்கைச் சுட்டும் שִׂמְחָה என்பதன் நேரடியான, இயல்பான தமிழ் வடிவம்.
- source_word: וּבְטוּב לֵבָב
  choice: மனமகிழ்வோடும்
  rationale: சொல்லுக்குச் சொல் ‘இதயத்தின் நன்மை’ என்றிருந்தாலும், இச்சூழலில் உள்ளார்ந்த மகிழ்ச்சியைச் சுட்டும் இயல்பான தமிழ்; மூலத்தின் தனித்துவத்தை அடிக்குறிப்பு பாதுகாக்கிறது.
- source_word: מֵרֹב כֹּל
  choice: எல்லாம் ஏராளமாக இருந்தபோதும்
  rationale: இஸ்ரவேலுக்கு மிகுதியான வழங்கல் இருந்த நிலையிலும் அவர்கள் சேவிக்கத் தவறிய சூழ்நிலைப் பொருளைத் தெளிவாகக் காட்டுகிறது; எபிரெயின் வடிவரீதியான மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: ஆண்டவர்; யெகோவா
  rationale: மூலத்தில் தனிப்பெயர் நேரடியாக வருவதால் அதை ஒரு பட்டப்பெயரால் மாற்றாமல் ஒலிபெயர்க்கப்பட்டுள்ளது.
- issue: עבד என்பதில் உள்ள உடன்படிக்கைச் சேவையின் பரப்பு
  choice: சேவிக்க
  alternative: வழிபட
  rationale: ‘வழிபட’ என்பதைக் காட்டிலும் ‘சேவிக்க’ என்பது பக்தி, கீழ்ப்படிதல், நடைமுறைச் செயல் ஆகிய அனைத்தையும் உள்ளடக்கும் பரந்த பொருளைப் பாதுகாக்கிறது.
- issue: טוּב לֵבָב என்பதன் பொருள்
  choice: மனமகிழ்வோடும்
  alternative: நல்ல மனதோடும்
  rationale: இணையான שמחה மற்றும் இச்சூழல் உள்ளார்ந்த மகிழ்ச்சியை ஆதரிக்கின்றன; ஆயினும் ‘நல்ல இதயம்’ என்ற சொற்பொருளை அடிக்குறிப்பில் விடாமல் பதிவு செய்கிறது.
- issue: מֵרֹב כֹּל என்பதன் தர்க்க உறவு
  choice: எல்லாம் ஏராளமாக இருந்தபோதும்
  alternative: எல்லாவற்றின் மிகுதியினால்
  rationale: மிகுதியே கீழ்ப்படியாமைக்குக் காரணம் என்று தீர்மானிக்காமல், ஏராளமான அருள்வழங்கலின் மத்தியிலும் ஏற்பட்ட தோல்வி என்ற சூழ்நிலைப் பொருளை வெளிப்படுத்துகிறது; மூலத்தின் காரண/மூலநிலை நிழல் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. ஒருமையில் இஸ்ரவேலை நோக்கும் உடன்படிக்கை உரை ‘நீ/உன்’ எனப் பாதுகாக்கப்பட்டுள்ளது. வசனம் அடுத்த பகுதியோடு தொடரும் காரணப்பிரிவு என்பதால் இறுதியில் காற்புள்ளி வைக்கப்பட்டுள்ளது.
