source:
  edition: WLC
  text: וְ/לֹ֣א תָס֗וּר מִ/כָּל הַ/דְּבָרִים֙ אֲשֶׁ֨ר אָנֹכִ֜י מְצַוֶּ֥ה אֶתְ/כֶ֛ם הַ/יּ֖וֹם יָמִ֣ין וּ/שְׂמֹ֑אול לָ/לֶ֗כֶת אַחֲרֵ֛י אֱלֹהִ֥ים אֲחֵרִ֖ים לְ/עָבְדָֽ/ם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/014.yaml
  text: And do not turn aside from any of the words that I am commanding you today[a], to the right or to the left[b], to go after other gods to serve them.
translation:
  language: ta
  text: இன்று நான் உங்களுக்குக் கட்டளையிடுகிற வார்த்தைகளில் எதிலிருந்தும் வலப்புறமோ இடப்புறமோ விலகி, வேறு தெய்வங்களின் பின்னால் சென்று[a] அவற்றைச் சேவிக்க[b] வேண்டாம்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘வேறு தெய்வங்களைப் பின்பற்ற.’ எபிரெயச் சொல்லாட்சி நேரடியாக, ‘வேறு தெய்வங்களின் பின்னால் செல்ல’ என்பதாகும்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘அவற்றை வழிபட.’ இவ்வினை ஒரு தெய்வத்துக்குச் செய்யும் சேவையைக் குறிக்கும்போது வழிபாடு என்ற பொருளையும் கொண்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: תָסוּר
  choice: விலகி
  rationale: இந்த வினை திரும்புதல், வழிவிலகுதல் அல்லது நீங்குதல் என்பதைக் குறிக்கிறது. இங்கு கட்டளையிடப்பட்ட வழியிலிருந்து பிறழ்வது கருத்தாக இருப்பதால், இயல்பான தமிழில் ‘விலகி’ என்று மொழிபெயர்க்கப்பட்டது.
- source_word: מִכָּל הַדְּבָרִים
  choice: வார்த்தைகளில் எதிலிருந்தும்
  rationale: எதிர்மறை வாக்கியத்தில் מִכָּל என்பது கட்டளையிடப்பட்டவற்றில் ஒன்றிலிருந்துகூட விலகக் கூடாது என்ற பொருளைத் தருகிறது. דְּבָרִים என்பதன் நேரடிப் பொருளைத் தக்கவைக்க ‘வார்த்தைகள்’ பயன்படுத்தப்பட்டது.
- source_word: מְצַוֶּה
  choice: கட்டளையிடுகிற
  rationale: எபிரெயப் பங்கேற்புவினை மோசே அப்போது வழங்கிக்கொண்டிருக்கும் கட்டளையின் நிகழ்காலத் தன்மையை வெளிப்படுத்துகிறது.
- source_word: הַיּוֹם
  choice: இன்று
  rationale: உடன்படிக்கைப் புதுப்பிப்பின் உடனடித் தன்மையை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: יָמִין וּשְׂמֹאול
  choice: வலப்புறமோ இடப்புறமோ
  rationale: எந்தத் திசையிலும் வழிவிலகுவதைக் குறிக்கும் எபிரெயச் சொல்லாட்சியின் இடவியல் உருவகம் தெளிவாகத் தக்கவைக்கப்பட்டது.
- source_word: לָלֶכֶת אַחֲרֵי
  choice: பின்னால் சென்று
  rationale: הלך אחרי என்பதன் நேரடி இயக்க உருவகத்தையும், ஒருவரைப் பின்பற்றுதல் என்ற உடன்படிக்கைச் சூழலிலான பொருளையும் இது தக்கவைக்கிறது.
- source_word: אֱלֹהִים אֲחֵרִים
  choice: வேறு தெய்வங்கள்
  rationale: ‘வேறு தெய்வங்கள்’ என்பது எபிரெயச் சொற்றொடரின் நேரான பொருள்; ‘அந்நிய தெய்வங்கள்’ என்று விளக்கமாகக் குறுக்காமல் மூலத்தின் சொல்லாட்சியைப் பேணுகிறது.
- source_word: לְעָבְדָם
  choice: அவற்றைச் சேவிக்க
  rationale: עבד என்பது தெய்வங்களுடன் தொடர்புடையபோது சேவை செய்வதையும் வழிபடுவதையும் குறிக்கலாம். ‘சேவிக்க’ என்பது விரிவான சமயச் சார்பு மற்றும் வழிபாட்டுச் சேவை ஆகிய இரண்டிற்கும் இடமளிக்கிறது.
theological_decisions:
- issue: உடன்படிக்கை எச்சரிக்கையில் பிற தெய்வங்களைக் குறிப்பிடுதல்
  choice: வேறு தெய்வங்கள்
  alternative: அந்நிய தெய்வங்கள்
  rationale: இத்தெய்வங்களின் இருப்பியல் நிலையை வசனம் விளக்கவில்லை. ஆகவே அந்தக் கேள்வியை மொழிபெயர்ப்பில் தீர்மானிக்காமல், உபாகமத்தில் உள்ள வழக்கமான எச்சரிக்கைச் சொல்லாட்சியே தக்கவைக்கப்பட்டது.
- issue: עבד என்பதிலுள்ள சேவை–வழிபாடு பொருள் நெருக்கம்
  choice: அவற்றைச் சேவிக்க
  alternative: அவற்றை வழிபட
  rationale: மூல வினை சமயச் சேவையையும் வழிபாட்டையும் உள்ளடக்கக்கூடும். பிரதான உரையில் பரந்த நேரடிப் பொருள் வைக்கப்பட்டு, சூழலுக்குரிய ‘வழிபட’ என்ற பொருள் அடிக்குறிப்பில் தரப்பட்டது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் dignified நடையில் அமைக்கப்பட்டது. மூலத்தின் ‘வலப்புறம்—இடப்புறம்’ மற்றும் ‘பின்னால் செல்’ உருவகங்கள் தக்கவைக்கப்பட்டுள்ளன; செயற்கையான பழமொழிநடை தவிர்க்கப்பட்டுள்ளது.
