base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/029.yaml
  text: And you will grope at noon as the blind gropes in the darkness[a], and you will not prosper in your ways; and you will be only oppressed and robbed all the days[c][b], with no one to save you.
translation:
  language: ta
  text: நண்பகலில், இருளில் பார்வையற்றவர் தடவித் தேடுவதுபோல், நீ தடவித் தேடுவாய்[a]. உன் வழிகளில் நீ வெற்றிபெற மாட்டாய்[b]. எந்நாளும் நீ ஒடுக்கப்பட்டும் கொள்ளையடிக்கப்பட்டும் மட்டுமே இருப்பாய்; உன்னைக் காப்பாற்ற ஒருவரும் இருக்க மாட்டார்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘கைகளால் தடவித் தேடுவாய்’; பார்க்க முடியாத ஒருவர் தொடுவதன் மூலம் தேடுவதை எபிரெய வினை குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘உன் வழிகளில் நீ செழித்தோங்க மாட்டாய்’ அல்லது ‘உன் காரியங்கள் கைகூடாது.’
    reason: lexical_alternative
  - marker: c
    text: அல்லது, ‘உன்னை மீட்க ஒருவரும் இருக்க மாட்டார்’ அல்லது ‘விடுவிப்பவர் எவரும் இருக்க மாட்டார்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: מְמַשֵּׁשׁ / יְמַשֵּׁשׁ
  choice: தடவித் தேடுவாய் / தடவித் தேடுவதுபோல்
  rationale: பார்க்க இயலாததால் கைகளால் தடவித் தேடும் செயலை இந்த வினை குறிக்கிறது. ‘தடவித் தேடு’ என்பது உடல் செயல் மற்றும் திசைதெரியாமை ஆகிய இரண்டையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: בַּצָּהֳרַיִם
  choice: நண்பகலில்
  rationale: நாளின் மிக வெளிச்சமான நேரத்தைக் குறிக்கிறது; இருளுடனான கூர்மையான முரண்பாட்டைத் தக்கவைக்கிறது.
- source_word: הָעִוֵּר
  choice: பார்வையற்றவர்
  rationale: எபிரெயச் சொல் ஆண்பால் ஒருமையில் பெயர்ச்சொல்லாகப் பயன்படுகிறது. நவீன, கண்ணியமான தமிழில் ஒருமை ஒப்புமையைப் பாதுகாக்க ‘பார்வையற்றவர்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: בָּאֲפֵלָה
  choice: இருளில்
  rationale: ‘இருள்’ அல்லது ‘காரிருள்’ என்ற பொருள்வட்டம் உண்டு. ‘இருளில்’ என்பது நண்பகலின் வெளிச்சத்துடன் உள்ள எதிர்மறை ஒப்புமையைத் தெளிவாகவும் மிகைப்படுத்தாமலும் தருகிறது.
- source_word: תַצְלִיחַ
  choice: வெற்றிபெற மாட்டாய்
  rationale: ஹிஃபில் வடிவம் வெற்றியடைதல், செழித்தோங்குதல் அல்லது காரியம் கைகூடுதல் என்பவற்றைக் குறிக்கலாம். சூழலில் முயற்சிகள் கைகூடாத பரந்த கருத்தை ‘வெற்றிபெற மாட்டாய்’ தெளிவாகத் தருகிறது.
- source_word: אֶת דְּרָכֶיךָ
  choice: உன் வழிகளில்
  rationale: ‘உன் வழிகள்’ என்ற மூல உருவகத்தைப் பாதுகாத்து, வாழ்க்கைப்போக்கும் முயற்சிகளும் அடங்கிய பொருளைத் திறந்தவாறே வைக்கிறது.
- source_word: אַךְ
  choice: மட்டுமே
  rationale: ஒருவரின் நிலை ஒடுக்கப்படுவதற்கும் கொள்ளையடிக்கப்படுவதற்கும் மட்டுமே சுருங்கும் கட்டுப்படுத்தும் வலியுறுத்தலை வெளிப்படுத்துகிறது.
- source_word: עָשׁוּק
  choice: ஒடுக்கப்பட்டு
  rationale: அநீதியான ஒடுக்குமுறை அல்லது சுரண்டலுக்கு உட்படுத்தப்படுவதைச் சுட்டும் செயப்படுபொருள் கருத்தைத் தக்கவைக்கிறது.
- source_word: גָזוּל
  choice: கொள்ளையடிக்கப்படுபவனாக
  rationale: திருட்டு அல்லது பலவந்தப் பறிப்பால் உடைமைகள் பறிக்கப்படும் செயப்படுபொருள் நிலையைத் தெளிவாகக் காட்டுகிறது.
- source_word: כָּל הַיָּמִים
  choice: எந்நாளும்
  rationale: ‘எல்லா நாட்களிலும்’ என்ற தொடர்ச்சியான காலப் பொருளை இயல்பான, கண்ணியமான தமிழில் அளிக்கிறது.
- source_word: וְאֵין מוֹשִׁיעַ
  choice: உன்னைக் காப்பாற்ற ஒருவரும் இருக்க மாட்டார்
  rationale: விடுவிக்கவோ மீட்கவோ யாரும் இல்லாத தனிப்பட்ட அவலநிலையை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: உடன்படிக்கைச் சாபச் சூழலில் מוֹשִׁיעַ என்பதன் பொருள்
  choice: காப்பாற்ற
  alternative: மீட்க / விடுவிக்க
  rationale: יָשַׁע என்ற வேர் பொதுவாக ஆபத்திலிருந்து காப்பாற்றுதல் அல்லது விடுவித்தலைக் குறிக்கலாம். இங்கு பிற்கால மேசியப் பட்டப்பெயர் கருத்தைச் சேர்க்காமல், சாதாரண மீட்பு மொழியாக ‘காப்பாற்ற’ பயன்படுத்தப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. இரண்டாம் நபர் ஒருமையும் எபிரெய இணைவாக்கியங்களின் தீவிர முன்னேற்றமும் பாதுகாக்கப்பட்டுள்ளன. ‘பார்வையற்றவர்’ என்பது ஒப்புமையின் ஒருமையைத் தக்கவைத்தபடி இழிவுபடுத்தாத தற்போதைய சொல்லாட்சியைப் பயன்படுத்துகிறது.
