source:
  edition: WLC
  text: וְ/הֵצַ֨ר לְ/ךָ֜ בְּ/כָל שְׁעָרֶ֗י/ךָ עַ֣ד רֶ֤דֶת חֹמֹתֶ֨י/ךָ֙ הַ/גְּבֹה֣וֹת וְ/הַ/בְּצֻר֔וֹת אֲשֶׁ֥ר אַתָּ֛ה בֹּטֵ֥חַ בָּ/הֵ֖ן בְּ/כָל אַרְצֶ֑/ךָ וְ/הֵצַ֤ר לְ/ךָ֙ בְּ/כָל שְׁעָרֶ֔י/ךָ בְּ/כָ֨ל אַרְצְ/ךָ֔ אֲשֶׁ֥ר נָתַ֛ן יְהוָ֥ה אֱלֹהֶ֖י/ךָ לָֽ/ךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/052.yaml
  text: And he will besiege you in all your gates until your high and fortified walls, in which you trust, come down throughout all your land; and he will besiege you in all your gates throughout all your land that Yahweh your God has given you.
translation:
  language: ta
  text: உன் நாடெங்கும், உன் எல்லா வாசல்களிலும், நீ நம்பியிருக்கும் உயர்ந்தும் அரணமைக்கப்பட்டும் உள்ள உன் மதில்கள் இடிந்துவிழும்வரை அவன் உன்னை முற்றுகையிடுவான். உன் கடவுளாகிய யாவே உனக்குக் கொடுத்த உன் நாடெங்கும், உன் எல்லா வாசல்களிலும் அவன் உன்னை முற்றுகையிடுவான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהֵצַר
  choice: முற்றுகையிடுவான்
  rationale: צור என்பதன் ஹிஃபில் வடிவம் இங்கு வாசல்களும் மதில்களும் இடம்பெறும் போர்ச் சூழலில் வருவதால், பொதுவான ‘நெருக்குவான்’ என்பதற்குப் பதிலாக இராணுவ முற்றுகையைக் குறிக்கும் சொல்லாக மொழிபெயர்க்கப்பட்டது. வசனத்தில் இருமுறை வருவதால் ஒரே விதமாகத் தரப்பட்டது.
- source_word: שְׁעָרֶיךָ
  choice: உன் வாசல்கள் அனைத்தையும்
  rationale: எபிரெயச் சொல்லின் நேரடியான பொருள் ‘உன் வாசல்கள்’. இது நகரங்களை ஆகுபெயராகக் குறிக்கக்கூடியதாயினும், மூலத்தின் முற்றுகைக் காட்சியைப் பாதுகாக்க ‘வாசல்கள்’ தக்கவைக்கப்பட்டது.
- source_word: עַד רֶדֶת
  choice: வீழும்வரை
  rationale: ירד என்பதன் அடிப்படைப் படம் ‘கீழே இறங்குதல்’. மதில்களின் சூழலில் இயல்பான தமிழுக்காக அவை இடிந்து கீழே வருவதை உணர்த்தும் ‘வீழும்வரை’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: חֹמֹתֶיךָ הַגְּבֹהוֹת וְהַבְּצֻרוֹת
  choice: உயரமான, அரணமைக்கப்பட்ட மதில்கள்
  rationale: ‘மதில்கள்’ என்ற பெயர்ச்சொல்லையும் ‘உயரமான’, ‘அரணமைக்கப்பட்ட’ என்ற இரு பண்புகளையும் விடாமல் தக்கவைக்கிறது; בָּצוּר என்பது பாதுகாப்புக்காக வலுப்படுத்தப்பட்ட நிலையைக் குறிக்கிறது.
- source_word: אֲשֶׁר אַתָּה בֹּטֵחַ בָּהֵן
  choice: நீ நம்பியிருக்கும்
  rationale: בטח + ב என்பது ஒன்றின்மீது நம்பிக்கை வைத்து சார்ந்திருப்பதைக் குறிக்கிறது. மதில்களைச் சார்ந்திருந்த தொடர்நிலையை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: בְּכָל אַרְצֶךָ
  choice: உன் நாடெங்கும்
  rationale: בְּכָל என்பதன் முழுப் பரப்பையும் உள்ளடக்கும் பகிர்வுப் பொருளைச் சுருக்கமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரான நான்கெழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், நவீன தமிழில் பரவலாகப் புரிந்துகொள்ளத்தக்க ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: אֲשֶׁר נָתַן יְהוָה אֱלֹהֶיךָ לָךְ
  choice: உன் கடவுளாகிய யாவே உனக்குக் கொடுத்த
  rationale: נתן என்ற நிறைவுற்ற வினையையும், உடன்படிக்கைப் பெயரையும், ‘உன் கடவுள்’ என்ற உறவுக் குறிப்பையும் வெளிப்படையாகத் தக்கவைக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலத்தில் தனிப்பட்ட உடன்படிக்கைப் பெயர் நேரடியாக உள்ளது. அதைப் பட்டமாக மாற்றாமலும், பிற்கால உயிரெழுத்துக் கலப்பை அடிப்படையாகக் கொண்ட வடிவத்தைப் பயன்படுத்தாமலும் ‘யாவே’ என ஒலிபெயர்க்கப்பட்டது.
- issue: மதில்கள்மீது வைக்கப்பட்ட நம்பிக்கையின் மதிப்பீடு
  choice: நீ நம்பியிருக்கும்
  alternative: நீ சார்ந்திருக்கும்
  rationale: மூலம் அந்த நம்பிக்கையை விவரிக்கிறது; இவ்வசனத்திலேயே கூடுதல் இறையியல் மதிப்பீட்டைச் சேர்க்கவில்லை. இதனால் நம்பிக்கை மற்றும் வரவிருக்கும் வீழ்ச்சி இடையிலான பதற்றம் அப்படியே நிற்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகருக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டது. எபிரெய மூலத்தின் இருமுறை வரும் முற்றுகைச் சொல்லாக்கமும் ‘வாசல்கள்’ என்ற தெளிவான போர்க்காட்சியும் தக்கவைக்கப்பட்டுள்ளன. நீண்ட எபிரெய வாக்கியம் வாசிப்புத் தெளிவுக்காக இரண்டு தமிழ் வாக்கியங்களாக அமைக்கப்பட்டது.
