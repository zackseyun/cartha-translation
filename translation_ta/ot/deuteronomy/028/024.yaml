  text: יִתֵּ֧ן יְהוָ֛ה אֶת מְטַ֥ר אַרְצְ/ךָ֖ אָבָ֣ק וְ/עָפָ֑ר מִן הַ/שָּׁמַ֨יִם֙ יֵרֵ֣ד עָלֶ֔י/ךָ עַ֖ד הִשָּׁמְדָֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/024.yaml
  text: Yahweh will make the rain of your land dust and powder[a]; from the heavens it will come down on you until you are destroyed.
translation:
  language: ta
  text: யாவே உன் நாட்டின் மழையைப் புழுதியாகவும் மண்ணாகவும் ஆக்குவார்[a]; நீ அழிந்துபோகும்வரை அது வானத்திலிருந்து உன்மேல் இறங்கும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தூசியாகவும் புழுதியாகவும்.” எபிரேயம் உலர்ந்த நுண்துகள்களைக் குறிக்கும் தொடர்புடைய இரண்டு சொற்களை இணைத்து, மழைக்குப் பதிலாக வறட்சியும் அழிவும் வருவதைத் தீவிரமாகச் சித்தரிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைவனின் தனிப்பெயரான நான்கெழுத்துப் பெயரைப் பட்டத்தால் மாற்றாமல், நவீனத் தமிழில் ஒலிபெயர்த்துள்ளது.
- source_word: יִתֵּן
  choice: ஆக்குவார்
  rationale: அடிப்படைப் பொருள் ‘கொடுப்பார்’ என்றாலும், இச்சூழலில் நாட்டுக்குரிய மழை புழுதியும் மண்ணுமாக மாறும்படி செய்வதை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: מְטַר אַרְצְךָ
  choice: உன் நாட்டின் மழையை
  rationale: எபிரேய இணைப்புத் தொடரின் உறவை நேரடியாகப் பாதுகாக்கும் இயல்பான தமிழ் வடிவம்.
- source_word: אָבָק
  choice: புழுதி
  rationale: காற்றில் பறக்கக்கூடிய நுண்ணிய உலர் துகள்களைக் குறிக்கும் சொல்லாகவும், அடுத்துள்ள עָפָר என்பதிலிருந்து வேறுபடுத்தவும் தேர்ந்தெடுக்கப்பட்டது.
- source_word: וְעָפָר
  choice: மண்ணாகவும்
  rationale: இரண்டு தொடர்புடைய உலர் துகள்ச் சொற்களையும் தனித்தனியாகப் பேணி, வறட்சியையும் அழிவையும் தீவிரப்படுத்தும் படிமத்தை இயல்பான தமிழில் தருகிறது.
- source_word: מִן הַשָּׁמַיִם
  choice: வானத்திலிருந்து
  rationale: எபிரேயச் சொல்லின் வடிவம் பன்மையாக இருந்தாலும், ‘வானத்திலிருந்து’ என்பது நவீனத் தமிழில் இயல்பானதும் மூலப் படிமத்துக்கு உண்மையானதும் ஆகும்.
- source_word: יֵרֵד עָלֶיךָ
  choice: அது உன்மேல் இறங்கும்
  rationale: எபிரேய ஒருமை வினையைப் பேணி, மழைக்குப் பதிலான உலர் துகள்கள் மேலிருந்து விழும் காட்சியைத் தெளிவாகத் தருகிறது.
- source_word: עַד הִשָּׁמְדָךְ
  choice: நீ அழிந்துபோகும்வரை
  rationale: வாக்கியத்தில் வெளிப்படையாகக் கூறப்படாத செய்பவரைச் சேர்க்காமல், சாபத்தின் இறுதி விளைவைத் தெளிவாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: உடன்படிக்கையின் இறைப் பெயரான יְהוָה-வை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: யெகோவா; கர்த்தர்
  rationale: மூலத்தில் உள்ள தனிப்பெயரை ஒரு பட்டத்தால் மாற்றாமல் ஒலிபெயர்க்கிறது; குறிப்பிட்ட சமயப் பிரிவின் விளக்கத்தை இறக்குமதி செய்யாது.
- issue: עַד הִשָּׁמְדָךְ என்பதில் அழிப்பவரை வெளிப்படையாகக் குறிப்பிடுதல்
  choice: செய்பவரைக் குறிப்பிடாமல் ‘நீ அழிந்துபோகும்வரை’
  alternative: ‘அவர் உன்னை அழிக்கும்வரை’
  rationale: எபிரேயத்தின் சுருக்கமான வடிவம் இத்துணைவாக்கியத்தில் செய்பவரை வெளிப்படையாகச் சொல்லாததால், அந்தத் தெளிவின்மையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டது. ஒருமை இரண்டாம் நபர் வடிவம் பேணப்பட்டுள்ளது; ‘புழுதி / மண்’ என்ற இணை மூலத்தின் இருசொல் படிமத்தைத் தக்கவைக்கிறது.
