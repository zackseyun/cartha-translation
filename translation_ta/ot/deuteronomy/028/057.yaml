base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/057.yaml
  text: and toward her afterbirth that comes out from between her legs[a], and toward her children whom she bears, because she will eat them secretly, in the lack of everything[c][b], during the siege and distress with which your enemy will oppress you within your gates.
translation:
  language: ta
  text: அவளுடைய கால்களுக்கு நடுவிலிருந்து வெளிவரும் அவளுடைய நஞ்சுக்கொடியையும்[a], அவள் பெற்றெடுக்கும் தன் பிள்ளைகளையும் பகிர்ந்துகொள்ள மனமற்றவளாக இருப்பாள்; ஏனெனில், உன் பகைவன் உன் நகரங்களுக்குள்[b] உன்னை நெருக்கடிக்கு உள்ளாக்கும் முற்றுகையிலும் துயரத்திலும், எதுவும் இல்லாத நிலையில்[c] அவற்றை மறைவாகத் தின்பாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘பிரசவத்துக்குப் பின் வெளியேறும் பகுதி’ என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் பிரசவத்தின்போது அல்லது அதன் பின் வெளிவரும் நஞ்சுக்கொடியைக் குறிப்பாகக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: சொல்லுக்குச் சொல், ‘உன் வாசல்களுக்குள்.’ இங்கு ‘வாசல்கள்’ என்பது முற்றுகையிடப்பட்ட நகரங்கள் அல்லது ஊர்களைக் குறிக்கிறது.
    reason: cultural_note
  - marker: c
    text: ‘எல்லாவற்றின் பற்றாக்குறையால்’ என்றும் மொழிபெயர்க்கலாம்; இச்சொற்றொடர் முற்றுகையின்போது நிலவும் முழுமையான இல்லாமையைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁלְיָתָהּ
  choice: அவளுடைய நஞ்சுக்கொடி
  rationale: இச்சொல் பிரசவத்துக்குப் பின் வெளிவரும் நஞ்சுக்கொடி அல்லது பிறப்புக்குப் பிந்திய கழிவைக் குறிக்கிறது. நவீனத் தமிழில் ‘நஞ்சுக்கொடி’ இயல்பாகவும் உடற்கூற்றளவில் தெளிவாகவும் உள்ளது.
- source_word: הַיּוֹצֵת מִבֵּין רַגְלֶיהָ
  choice: அவளுடைய கால்களுக்கு நடுவிலிருந்து வெளிவரும்
  rationale: பிரசவத்தை நேரடியான உடல்சார் மொழியில் விவரிக்கும் எபிரெயச் சொற்றொடரின் வலிமையைப் பாதுகாக்கிறது.
- source_word: וּבְבָנֶיהָ אֲשֶׁר תֵּלֵד
  choice: அவள் பெற்றெடுக்கும் தன் பிள்ளைகளையும்
  rationale: בנים இச்சூழலில் ஆண் பிள்ளைகளை மட்டும் அல்லாமல் சந்ததியைக் பொதுவாகக் குறிக்கலாம்; ‘பிள்ளைகள்’ அந்தப் பரப்பைத் தக்கவைக்கிறது.
- source_word: כִּי תֹאכְלֵם
  choice: ஏனெனில் ... அவற்றை ... தின்பாள்
  rationale: כִּי காரணத்தை அறிமுகப்படுத்துகிறது; אכל என்பதன் அதிர்ச்சியூட்டும் நேரடியான பொருளை ‘தின்பாள்’ பாதுகாக்கிறது.
- source_word: בְּחֹסֶר כֹּל
  choice: எல்லாம் இல்லாத வறுமையினால்
  rationale: முற்றுகையால் உண்டாகும் முழுமையான பற்றாக்குறையை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: בַּסָּתֶר
  choice: மறைவாக
  rationale: செயல் பிறருக்குத் தெரியாமல் செய்யப்படுவதைக் குறிக்கும் வினையடைப் பொருளைச் சுருக்கமாகத் தருகிறது.
- source_word: בְּמָצוֹר וּבְמָצוֹק
  choice: முற்றுகையிலும் துயரத்திலும்
  rationale: முதல் சொல் இராணுவ முற்றுகையையும், இரண்டாவது அதனால் ஏற்படும் கடும் நெருக்கடி அல்லது துயரத்தையும் குறிக்கும் இணையைப் பேணுகிறது.
- source_word: אֲשֶׁר יָצִיק לְךָ אֹיִבְךָ
  choice: உன் பகைவன் ... உன்னை நெருக்கடிக்கு உள்ளாக்கும்
  rationale: צוּק என்பதிலுள்ள அழுத்துதல், இடுக்கணுக்குள் கொண்டுவருதல் என்ற முற்றுகைச் சூழலுக்குரிய பொருளைத் தெளிவாகக் காட்டுகிறது.
- source_word: בִּשְׁעָרֶיךָ
  choice: உன் நகரங்களுக்குள்
  rationale: சொல்லுக்குச் சொல் ‘உன் வாசல்களில்’ என்றாலும், இச்சொல்லாட்சி மதில்சூழ்ந்த நகரங்கள் அல்லது குடியிருப்புகளைக் குறிக்கிறது; இலக்கு வாசகருக்குப் பொருள் தெளிவாக ‘நகரங்களுக்குள்’ என வழங்கப்படுகிறது.
theological_decisions:
- issue: வசனம் முந்தைய வசனத்திலிருந்து தொடரும் சார்பு அமைப்பு
  choice: ‘பகிர்ந்துகொள்ள மனமில்லாதவளாவாள்’ என்பதைத் தெளிவுக்காக நிறைவு வினையாக வழங்குதல்
  alternative: ‘...நஞ்சுக்கொடியின்மேலும் ... பிள்ளைகளின்மேலும்’ என்று சார்பு தொடராக மட்டும் விடுதல்
  rationale: எபிரெய உரை 28:56-இல் தொடங்கிய ‘தன் கண்ணைத் தீய நோக்குடன் வைப்பாள்’ என்ற கட்டமைப்பைத் தொடர்கிறது. தனி வசனமாக வாசிக்கும்போது அதன் பொருள் புரிய, முந்தைய சூழலில் உள்ள பகிர மறுக்கும் தீய நோக்கை வெளிப்படையாக அளிக்கிறது; நரமாமிசச் செயலின் கொடூரத்தைத் தணிக்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், கண்ணியமானதாயினும் மூலத்தின் கடுமையையும் உடல்சார் நேர்மையையும் மறைக்காத நடை பயன்படுத்தப்பட்டுள்ளது. வசனம் முந்தைய வசனத்தின் இலக்கணத் தொடராக இருப்பதால், தனித்து வாசிக்கத் தேவையான வினைச் சார்பு வெளிப்படுத்தப்பட்டுள்ளது. ‘தின்பாள்’ மற்றும் ‘நஞ்சுக்கொடி’ போன்ற நேரடியான சொற்கள் நோக்கத்துடன் தக்கவைக்கப்பட்டுள்ளன.
