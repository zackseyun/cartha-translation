review_pass:
  verdict: revise
  source_fidelity: The draft correctly renders Yahweh as the agent, the severe skin affliction, the knees and lower legs, the inability to recover, and the sole-to-crown extent. However, «அவை ... பரவும்» (“they will spread”) introduces an explicit process of spreading that is not stated in the Hebrew. The final phrase gives the bodily extent of the affliction, not its manner of progression.
  naturalness: The Tamil is generally clear and suitably modern. Recasting the final clause as the location/extent of the sores avoids the added implication while retaining a fluent, dignified style.
  terminology: «யாவே» appropriately represents the divine name. «கடுமையான புண்கள்» is a natural modern-Tamil collective rendering for the severe boils/skin sores. «கீழ்க்கால்கள்» is an acceptable main-text rendering for שֹׁקַיִם, with the more specific sense retained in the footnote.
  issues:
  - severity: medium
    issue: The translation says that the sores “will spread.”
    rationale: The Hebrew ends with a sole-to-crown extent expression; it does not explicitly state that the boils spread. This interpretive addition should be removed.
  revised_text: யாவே உன் முழங்கால்களிலும் கீழ்க்கால்களிலும்[a] கடுமையான புண்களால் உன்னைத் தாக்குவார்; அவற்றிலிருந்து உன்னால் குணமடைய முடியாது; உன் பாதத்தின் உள்ளங்கால் முதல் உன் உச்சந்தலை வரை அவை இருக்கும்.
