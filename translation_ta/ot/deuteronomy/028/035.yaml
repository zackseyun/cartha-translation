  text: יַכְּ/כָ֨ה יְהוָ֜ה בִּ/שְׁחִ֣ין רָ֗ע עַל הַ/בִּרְכַּ֨יִם֙ וְ/עַל הַ/שֹּׁקַ֔יִם אֲשֶׁ֥ר לֹא תוּכַ֖ל לְ/הֵרָפֵ֑א מִ/כַּ֥ף רַגְלְ/ךָ֖ וְ/עַ֥ד קָדְקֳדֶֽ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/035.yaml
  text: Yahweh will strike you with severe boils on the knees and on the legs[a], from which you cannot be healed, from the sole of your foot to the crown of your head.
translation:
  language: ta
  text: யாவே உன் முழங்கால்களிலும் கீழ்க்கால்களிலும்[a] கடுமையான புண்களால் உன்னைத் தாக்குவார்; அவற்றிலிருந்து உன்னால் குணமடைய முடியாது; உன் பாதத்தின் உள்ளங்கால் முதல் உன் உச்சந்தலை வரை அவை இருக்கும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘கணைக்கால்களிலும்’; எபிரெயச் சொல் முழங்காலுக்குக் கீழுள்ள கால் பகுதியை இன்னும் குறிப்பாகக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַכְּכָה
  choice: உன்னைத் தாக்குவார்
  rationale: נכה என்பதன் ஹிஃபில் வடிவம் நேரடியாகத் ‘தாக்குதல்’ அல்லது ‘அடித்தல்’ என்ற வலிமையான பொருளைக் கொண்டது; தெய்வீகச் செயலை நவீன தமிழில் இயல்பாகக் கூறுகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைத் திருப்பெயரான நான்கெழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் பரவலாகப் புரிந்துகொள்ளக்கூடிய ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: בִּשְׁחִין רָע
  choice: கொடிய கொப்புளங்களால்
  rationale: שְׁחִין என்பது வீக்கமும் புண்ணும் கொண்ட தோல் வெடிப்பையோ கொப்புளத்தையோ குறிக்கிறது; רָע அதன் கடுமையை வலியுறுத்துவதால் ‘கொடிய’ எனத் தரப்பட்டது.
- source_word: עַל הַבִּרְכַּיִם
  choice: முழங்கால்களிலும்
  rationale: குறிப்பிடப்பட்ட உடற்பகுதியை நேரடியாகவும் இயல்பாகவும் மொழிபெயர்க்கிறது.
- source_word: וְעַל הַשֹּׁקַיִם
  choice: கீழ்க்கால்களிலும்
  rationale: שׁוֹק குறிப்பாக முழங்காலுக்குக் கீழுள்ள கால் பகுதியைக் குறிக்கக்கூடும்; பொதுவான ‘கால்கள்’ என்பதைக் காட்டிலும் மூலத்தின் உடற்கூறு துல்லியத்தைப் பாதுகாக்கிறது.
- source_word: אֲשֶׁר לֹא תוּכַל לְהֵרָפֵא
  choice: அவற்றிலிருந்து உன்னால் குணமடைய முடியாது
  rationale: நோய் தீராத தன்மையையும், இரண்டாம் நபர் ஒருமை அமைப்பையும் தெளிவாகப் பாதுகாக்கிறது.
- source_word: מִכַּף רַגְלְךָ
  choice: உன் உள்ளங்கால் தொடங்கி
  rationale: כַּף רֶגֶל என்பது பாதத்தின் அடிப்பகுதியான உள்ளங்காலைச் சுட்டும் இயல்பான உடற்கூறு மரபுத்தொடர்.
- source_word: וְעַד קָדְקֳדֶךָ
  choice: உன் உச்சந்தலை வரை
  rationale: קָדְקֹד தலையின் உச்சிப் பகுதியைக் குறிக்கிறது; உடல் முழுவதையும் உள்ளடக்கும் சொல்லோவியத்தைச் சுருக்கமாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைத் திருப்பெயரை வழங்குதல்
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலத்தில் உள்ள தனிப்பட்ட இறைப் பெயரை ஒரு பட்டமாக மாற்றாமல் ஒலிபெயர்க்கிறது; ‘யெகோவா’ என்ற மாற்று உச்சரிப்பையும் உரைக்குள் திணிக்கவில்லை.
- issue: துன்பத்தின் நேரடிச் செயற்பாட்டாளர்
  choice: யாவே ... உன்னைத் தாக்குவார்
  alternative: நீ கொப்புளங்களால் வாதிக்கப்படுவாய்
  rationale: எபிரெய வாக்கியத்தில் யாவே எழுவாயாக இருப்பதையும், நכה வினையின் நேரடியான தெய்வீகச் செயற்பாட்டையும் மறைக்காமல் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான நடையைப் பயன்படுத்துகிறது. ‘கீழ்க்கால்’, ‘உள்ளங்கால்’, ‘உச்சந்தலை’ ஆகியவை மூலத்தின் உடற்கூறு வரிசையைத் தெளிவாகக் காக்கின்றன. கடைசி உறுப்பில் எபிரெய மொழியில் வெளிப்படையாக மீண்டும் சொல்லப்படாத கொப்புளங்களின் பரவல் தமிழில் புரிதலுக்காக ‘அவை ... பரவும்’ எனத் தெளிவாக்கப்பட்டுள்ளது.
