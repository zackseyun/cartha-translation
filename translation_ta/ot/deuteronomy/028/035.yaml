revisions:
- from: யாவே உன் முழங்கால்களிலும் கீழ்க்கால்களிலும்[a] கொடிய கொப்புளங்களால் உன்னைத் தாக்குவார். அவற்றிலிருந்து உன்னால் குணமடைய முடியாது; அவை உன் உள்ளங்கால் தொடங்கி உன் உச்சந்தலை வரை பரவும்.
  to: யாவே உன் முழங்கால்களிலும் கீழ்க்கால்களிலும்[a] கடுமையான புண்களால் உன்னைத் தாக்குவார்; அவற்றிலிருந்து உன்னால் குணமடைய முடியாது; உன் பாதத்தின் உள்ளங்கால் முதல் உன் உச்சந்தலை வரை அவை இருக்கும்.
  rationale: The revision preserves the Hebrew’s direct divine agency and its full-body extent while removing the unsupported assertion that the sores spread. The footnote continues to preserve the narrower lower-leg sense of the Hebrew anatomical term.
