source:
  edition: WLC
  text: יִתֵּ֨ן יְהוָ֤ה אֶת אֹיְבֶ֨י/ךָ֙ הַ/קָּמִ֣ים עָלֶ֔י/ךָ נִגָּפִ֖ים לְ/פָנֶ֑י/ךָ בְּ/דֶ֤רֶךְ אֶחָד֙ יֵצְא֣וּ אֵלֶ֔י/ךָ וּ/בְ/שִׁבְעָ֥ה דְרָכִ֖ים יָנ֥וּסוּ לְ/פָנֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/007.yaml
  text: Yahweh will give your enemies who rise up against you defeated before you[a]. By one way they will come out against you[b], and by seven ways they will flee before you.
translation:
  language: ta
  text: உனக்கு எதிராக எழும்பும் உன் பகைவர்களை யாவே உனக்கு முன்பாகத் தோற்கடிக்கப்பட்டவர்களாக உன்னிடம் ஒப்புவிப்பார்[a]. அவர்கள் ஒரே வழியில் உனக்கு எதிராக வருவார்கள்; ஆனால் ஏழு வழிகளில் உனக்கு முன்பாக ஓடிப்போவார்கள்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உனக்கு எதிராக எழும்பும் உன் பகைவர்களை யாவே உனக்கு முன்பாகத் தோற்றவர்களாக உன்னிடம் ஒப்புவிப்பார்.”
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில், “ஒரே வழியில் ... ஏழு வழிகளில்.” பகைவர்கள் ஒன்றுபட்டு வருவதையும், தோற்றபின் பல திசைகளில் சிதறி ஓடுவதையும் இது சித்தரிக்கிறது.
    reason: cultural_note
lexical_decisions:
- source_word: יִתֵּן
  choice: ஒப்புவிப்பார்
  rationale: נתן என்பதன் அடிப்படைப் பொருள் ‘கொடு’; இங்கு போர்ச் சூழலில் எதிரிகளை ஒருவரின் கையில் ஒப்புவித்தல் என்ற பொருளைக் கொண்டுள்ளது. இயல்பான தமிழில் அந்தச் சூழற்பொருளை ‘ஒப்புவிப்பார்’ தெளிவாக வெளிப்படுத்துகிறது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: எபிரெய தனிப்பெயரான יהוה-ஐ ஒரு பட்டப்பெயராக மாற்றாமல், தமிழில் பரவலாக அறியப்பட்ட ஒலிபெயர்ப்பான ‘யெகோவா’ என்று வழங்குகிறது.
- source_word: אֹיְבֶיךָ
  choice: உன் பகைவர்களை
  rationale: இரண்டாம் நபர் ஒருமை உடைமைப் பின்னொட்டுடன் உள்ள பன்மைச் சொல்லுக்கு நேரான, இயல்பான தமிழ் இணை.
- source_word: הַקָּמִים עָלֶיךָ
  choice: உனக்கு எதிராக எழும்பும்
  rationale: קום + על பகைமையான சூழலில் ஒருவருக்கு எதிராக எழும்புதல் அல்லது நிற்றல் என்பதைக் குறிக்கிறது; மூல உருவகத்தையும் பகைமையையும் காக்கிறது.
- source_word: נִגָּפִים
  choice: தோற்கடித்து
  rationale: இந்த நிஃபால் வடிவம் தாக்கப்பட்ட அல்லது தோற்கடிக்கப்பட்ட நிலையைச் சுட்டுகிறது. ‘தோற்கடித்து ... ஒப்புவிப்பார்’ என்பது தமிழில் விளைவுநிலையை இயல்பாகத் தருகிறது; குறிப்பாகக் கொல்லப்பட்டதாகப் பொருளைக் குறுக்காது.
- source_word: לְפָנֶיךָ
  choice: உனக்கு முன்பாக
  rationale: ‘உன் முகத்திற்கு முன்’ என்ற எபிரெய வழக்கின் சுருக்கமான, மரியாதையான தமிழ் வடிவம்; இங்கு உன் முன்னிலையில் அல்லது உன்னை எதிர்கொள்ள முடியாமல் என்ற சூழற்பொருளைத் தாங்குகிறது.
- source_word: בְּדֶרֶךְ אֶחָד
  choice: ஒரே வழியில்
  rationale: ‘ஒரு வழியில்’ என்ற நேரடியான உருவகத்தைப் பாதுகாத்து, பின்னுள்ள ‘ஏழு வழிகளில்’ என்பதுடன் உள்ள எதிரிணையைத் தெளிவாக்குகிறது.
- source_word: יֵצְאוּ אֵלֶיךָ
  choice: உனக்கு எதிராக வருவார்கள்
  rationale: போர்ச் சூழலில் יצא + אל எதிர்த்துப் புறப்பட்டு வருவதைக் குறிக்கிறது. தமிழில் ‘எதிராக வருவார்கள்’ இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: וּבְשִׁבְעָה דְרָכִים
  choice: ஆனால் ஏழு வழிகளில்
  rationale: எபிரெய எண்ணையும் வழி உருவகத்தையும் காக்கிறது. வெளிப்படையான எதிரிணையைத் தமிழில் இயல்பாக்க ‘ஆனால்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: יָנוּסוּ
  choice: ஓடிப்போவார்கள்
  rationale: נוס என்பது அச்சத்தால் தப்பி ஓடுதலைக் குறிக்கும் வழக்கமான வினை; வெறும் ஒழுங்கான பின்வாங்குதலைவிட ‘ஓடிப்போவார்கள்’ அதன் வலிமையை நன்றாகத் தருகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யெகோவா
  alternative: யாவே
  rationale: மூலத்தில் ஒரு பட்டப்பெயர் அல்ல, நான்கு எழுத்துகளைக் கொண்ட இறைத்தனிப்பெயர் உள்ளது. தமிழில் நீண்டகாலமாக அறியப்பட்ட நேரடி ஒலிபெயர்ப்பான ‘யெகோவா’ பயன்படுத்தப்பட்டு, ‘கர்த்தர்’ போன்ற மாற்றுப் பட்டப்பெயர் தவிர்க்கப்பட்டுள்ளது; ‘யாவே’ என்பது அறிஞர்கள் பொதுவாக மறுவடிவமைக்கும் உச்சரிப்பு.
translation_notes:
  register: நவீன நிலையான தமிழ்; ஒருமை இரண்டாம் நபருக்கான ‘உன்/உனக்கு’ வடிவங்கள் மூல இலக்கணத்தைப் பின்பற்றுகின்றன. நடை கண்ணியமானதும் பொதுவாசகர்களுக்கு எளிதானதும் ஆகும். ‘ஒரே வழி/ஏழு வழிகள்’ என்ற எபிரெய இணைமுரண் முதன்மை உரையில் காக்கப்பட்டுள்ளது.
