  text: בָּר֥וּךְ אַתָּ֖ה בָּ/עִ֑יר וּ/בָר֥וּךְ אַתָּ֖ה בַּ/שָּׂדֶֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/003.yaml
  text: Blessed shall you be in the city[a], and blessed shall you be in the field.
translation:
  language: ta
  text: நீ நகரத்தில் ஆசீர்வதிக்கப்படுவாய்[a]; வயல்வெளியிலும் ஆசீர்வதிக்கப்படுவாய்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நீ நகரத்தில் ஆசீர்வதிக்கப்பட்டவன்; வயல்வெளியிலும் ஆசீர்வதிக்கப்பட்டவன்.”
    reason: எபிரெய மூலத்தில் வெளிப்படையான வினைச்சொல் இல்லாததால், இதை எதிர்கால வாக்குறுதியாகவோ நிகழ்நிலை அறிவிப்பாகவோ மொழிபெயர்க்கலாம்.
lexical_decisions:
- source_word: בָּרוּךְ
  choice: ஆசீர்வதிக்கப்பட்டிருப்பாய்
  rationale: ברך என்பதன் செயப்பாட்டு வினையெச்சப் பெயரடை வடிவம் உடன்படிக்கை ஆசீர்வாதத்தை அறிவிக்கிறது. தமிழில் இயல்பாகவும், சூழலின் வாக்குறுதித் தன்மையையும் காக்கவும், எதிர்கால நிலையைக் குறிக்கும் ‘ஆசீர்வதிக்கப்பட்டிருப்பாய்’ பயன்படுத்தப்பட்டது.
- source_word: אַתָּה
  choice: நீ
  rationale: இது இரண்டாம் நபர் ஆண்பால் ஒருமைச் சுட்டுப்பெயர்; இஸ்ரவேலை உடன்படிக்கையின் ஒருமை முகவரியாக விளிக்கிறது. தமிழ் ‘நீ’ அந்த ஒருமை விளிப்பை நேரடியாகத் தருகிறது.
- source_word: בָּעִיר
  choice: நகரத்தில்
  rationale: ב முன்னொட்டும் עִיר என்பதும் சேர்ந்து நகரத்திற்குள் உள்ள இடநிலையைக் குறிக்கின்றன. ‘நகரத்தில்’ என்பது நேரடியான, இயல்பான மொழிபெயர்ப்பு.
- source_word: וּבָרוּךְ
  choice: வயல்வெளியிலும் நீ ஆசீர்வதிக்கப்பட்டிருப்பாய்
  rationale: וּ இணைப்பையும் மீண்டும் வரும் ஆசீர்வாதப் பயனிலையையும் தமிழில் ‘-இலும்’ மற்றும் முழுப் பயனிலை மீளுரைப்பின் மூலம் தக்கவைத்துள்ளது; இதனால் நகரம்–வயல்வெளி இணை அமைப்பு பாதுகாக்கப்படுகிறது.
- source_word: בַּשָּׂדֶה
  choice: வயல்வெளியில்
  rationale: שָׂדֶה என்பது வயல், திறந்த நிலம் அல்லது வேளாண் நிலப்பரப்பைக் குறிக்கலாம். ‘வயல்வெளி’ நகரத்திற்கு எதிரான ஊரக/வேளாண் வாழ்க்கைத் தளத்தை இயல்பாகவும் தெளிவாகவும் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: வினைச்சொல் இல்லாத ஆசீர்வாதச் சூத்திரத்தை மொழிபெயர்த்தல்
  choice: ஆசீர்வதிக்கப்பட்டிருப்பாய்
  alternative: ஆசீர்வதிக்கப்பட்டவன் நீ
  rationale: எபிரெயத்தில் வெளிப்படையான வினைச்சொல் இல்லாவிட்டாலும், உபாகமம் 28-இன் உடன்படிக்கை ஆசீர்வாதச் சூழல் வாக்குறுதி சார்ந்த முன்னோக்கிய வலிமையைக் கொண்டுள்ளது. ‘ஆசீர்வதிக்கப்பட்டிருப்பாய்’ அதை தமிழில் இயல்பாக வெளிப்படுத்துகிறது; இருப்பினும் நிகழ்நிலை அறிவிப்பாகப் புரிந்துகொள்ளும் வாய்ப்பை அடிக்குறிப்பு பாதுகாக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில் எளிமையான, கண்ணியமான நடையைக் கடைப்பிடிக்கிறது. மூலத்தின் நகரம்–வயல்வெளி இணைநிலையும், இருமுறை வரும் ஆசீர்வாத அறிவிப்பும் பாதுகாக்கப்பட்டுள்ளன.
