- from: நகரத்தில் நீ ஆசீர்வதிக்கப்பட்டிருப்பாய்[a]; வயல்வெளியிலும் நீ ஆசீர்வதிக்கப்பட்டிருப்பாய்.
  to: நீ நகரத்தில் ஆசீர்வதிக்கப்படுவாய்[a]; வயல்வெளியிலும் ஆசீர்வதிக்கப்படுவாய்.
