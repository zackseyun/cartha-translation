  text: יִתֶּנְ/ךָ֨ יְהוָ֥ה נִגָּף֮ לִ/פְנֵ֣י אֹיְבֶי/ךָ֒ בְּ/דֶ֤רֶךְ אֶחָד֙ תֵּצֵ֣א אֵלָ֔י/ו וּ/בְ/שִׁבְעָ֥ה דְרָכִ֖ים תָּנ֣וּס לְ/פָנָ֑י/ו וְ/הָיִ֣יתָ לְ/זַעֲוָ֔ה לְ/כֹ֖ל מַמְלְכ֥וֹת הָ/אָֽרֶץ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/025.yaml
  text: Yahweh will give you over as defeated before your enemies. You will go out against them by one way[a], and by seven ways you will flee before them, and you will become a horror to all the kingdoms of the earth.
translation:
  language: ta
  text: உன் எதிரிகளின் முன்னிலையில் நீ தோற்கடிக்கப்படும்படி யாவே உன்னை ஒப்புக்கொடுப்பார். ஒரே வழியில் அவர்களுக்கு எதிராகப் புறப்படுவாய்; ஆனால் ஏழு வழிகளில் அவர்களுக்கு முன்பாகத் தப்பியோடுவாய். பூமியிலுள்ள எல்லா அரசுகளுக்கும் திகிலாகிவிடுவாய்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘திகிலூட்டும் ஒன்றாக.’ எபிரெயச் சொல் திகில் அல்லது அச்சத்தை ஏற்படுத்தும் ஒன்றைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִתֶּנְךָ נִגָּף
  choice: நீ தோற்கடிக்கப்படும்படி ... உன்னை ஒப்புக்கொடுப்பார்
  rationale: נתן என்பதன் ‘கொடுத்தல்/ஒப்புக்கொடுத்தல்’ என்ற வினைவலிமையையும், נִגָּף குறிக்கும் போர்த் தோல்வி நிலையையும் இயல்பான தமிழில் இணைக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைத் திருப்பெயரான நான்கெழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், நவீன தமிழில் பரவலாகப் புரிந்துகொள்ளப்படும் ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: לִפְנֵי אֹיְבֶיךָ
  choice: உன் எதிரிகளுக்கு முன்பாக
  rationale: ‘எதிரிகளின் முன்னிலையில்’ என்ற எபிரெயப் படிமத்தையும் போர்க்களச் சூழலையும் காக்கிறது.
- source_word: בְּדֶרֶךְ אֶחָד ... וּבְשִׁבְעָה דְרָכִים
  choice: ஒரே வழியில் ... ஏழு வழிகளில்
  rationale: ஒன்றுபட்டுப் படையெடுத்துச் சென்று பின்னர் முற்றிலும் சிதறியோடும் எதிர்மறை இணைப்பையும், ஒன்று–ஏழு என்ற மூலப்படிமத்தையும் பாதுகாக்கிறது.
- source_word: תֵּצֵא אֵלָיו
  choice: அவர்களுக்கு எதிராகப் புறப்படுவாய்
  rationale: இது போருக்குப் புறப்படுவதைக் குறிக்கும் சூழல் சார்ந்த பொருள். எபிரெயில் ஒருமைச் சுட்டுப்பெயர் கூட்டுப்பொருளில் வரும் நிலையில், தமிழில் ‘எதிரிகள்’ என்பதற்கு இயல்பாகப் பன்மை பயன்படுத்தப்படுகிறது.
- source_word: תָּנוּס לְפָנָיו
  choice: அவர்களுக்கு முன்பாகத் தப்பியோடுவாய்
  rationale: נוס என்பதன் ‘தப்பியோடு’ என்ற பொருளையும் לפניו என்பதன் ‘அவர்களுக்கு முன்பாக’ என்ற போர்க்களப் படிமத்தையும் காக்கிறது.
- source_word: לְזַעֲוָה
  choice: திகிலாக
  rationale: זַעֲוָה குறிக்கும் திகில், அச்சம், பிறரை அதிர்ச்சிக்குள்ளாக்கும் பொருள் ஆகியவற்றைச் சுருக்கமாகத் தெரிவிக்கிறது; சொல்லின் மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: לְכֹל מַמְלְכוֹת הָאָרֶץ
  choice: பூமியிலுள்ள எல்லா அரசுகளுக்கும்
  rationale: இந்த உடன்படிக்கைச் சாபத்தின் உலகளாவிய பொதுக் காட்சியை வெளிப்படுத்துகிறது; מַמְלָכוֹת என்பதை நவீன தமிழில் இயல்பான ‘அரசுகள்’ என வழங்குகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைத் திருப்பெயரின் மொழியாக்கம்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் நேரடியாக வரும் தனிப்பெயரை ஒரு பட்டப்பெயரால் மாற்றாமல் பாதுகாக்கிறது.
- issue: לְזַעֲוָה என்ற சாபப் படிமத்தின் வலிமை
  choice: திகிலாக
  alternative: திகிலூட்டும் ஒன்றாக
  rationale: இஸ்ரவேல் பிற அரசுகளுக்கு அச்சமூட்டும், அதிர்ச்சியளிக்கும் காட்சியாக மாறும் பொருளை எந்தப் பிற்கால இறையியல் விளக்கத்தையும் சேர்க்காமல் தருகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ஒன்று–ஏழு என்ற எபிரெய இணைநிலைப் படிமம் காக்கப்பட்டுள்ளது; கூட்டுப்பொருளில் வரும் எபிரெய ஒருமைச் சுட்டுப்பெயர்கள் தமிழில் இயல்பான பன்மையாக வழங்கப்பட்டுள்ளன.
