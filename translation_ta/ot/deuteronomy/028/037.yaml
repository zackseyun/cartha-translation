base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/037.yaml
  text: And you shall become an object of horror[a], a proverb[c][b], and a taunt among all the peoples where Yahweh will drive you.
translation:
  language: ta
  text: யாவே உன்னை எல்லா மக்களினங்களிடையிலும் துரத்திவிடுவார்; அங்கே நீ திகிலூட்டும் ஒன்றாகவும்,[a] பழமொழியாகவும், ஏளனச் சொல்லாகவும்[b] ஆவாய்.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “வியப்பூட்டும் ஒன்றாக.” எபிரெயச் சொல், பேரழிவுக்குள்ளாகி திகிலையோ வியப்பையோ ஏற்படுத்தும் ஒன்றைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “பழமொழி” மற்றும் “ஏளனச் சொல்” ஆகிய இரண்டையும் “இழிவுப் பேச்சாக” என்றும் மொழிபெயர்க்கலாம்; எபிரெயம் பொதுவான இகழ்ச்சியைக் குறிக்கும் தொடர்புடைய, ஆனால் வேறுபட்ட இரு சொற்களைப் பயன்படுத்துகிறது.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, “யாவே உன்னை வழிநடத்திச் செல்லும்.” எபிரெய வினைச்சொல் ‘வழிநடத்துதல்’ அல்லது ‘துரத்துதல்’ எனப் பொருள்படலாம்; இங்குள்ள சாபம் மற்றும் நாடுகடத்தல் சூழலால் ‘துரத்திவிடுவார்’ என்று மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיִיתָ
  choice: நீ ... ஆவாய்
  rationale: சாபங்களின் தொடரில் வரும் இந்த வினை எதிர்கால விளைவைக் குறிக்கிறது; தமிழில் ‘ஆவாய்’ இயல்பாகவும் மூலத்திற்கு நெருக்கமாகவும் உள்ளது.
- source_word: לְשַׁמָּה
  choice: திகிலூட்டும் காட்சியாக
  rationale: שַׁמָּה என்பது பேரழிவைக் கண்டு பிறர் திகிலடையவோ வியப்படையவோ காரணமான ஒன்றைக் குறிக்கிறது; மனிதர்கள் எதிர்வினையாற்றும் பொருளாக இஸ்ரவேல் மாறுவதை இச்சொற்றொடர் தெளிவாக்குகிறது.
- source_word: לְמָשָׁל
  choice: பழமொழியாக
  rationale: מָשָׁל என்பதன் நேரடியான பொருள் ‘பழமொழி’; இங்கு அதன் இழிவான நுண்பொருளை சாபச் சூழலும் அடுத்த சொல்லும் வெளிப்படுத்துகின்றன.
- source_word: וְלִשְׁנִינָה
  choice: ஏளனச் சொல்லாக
  rationale: שְׁנִינָה என்பது குத்தலான, இகழ்ச்சியான சொல் அல்லது வசையைக் குறிக்கிறது; ‘ஏளனச் சொல்’ அதன் பகைமையான பேச்சுச் சாயலைக் காக்கிறது, முந்தைய מָשָׁל உடன் ஒன்றாக்குவதில்லை.
- source_word: בְּכֹל הָעַמִּים
  choice: எல்லா மக்களினங்களின் நடுவிலும்
  rationale: עַמִּים என்பது ‘மக்களினங்கள்’ எனும் பன்மை; ‘நடுவிலும்’ என்பது בְּ முன்னிடைச்சொல்லின் சமூகச் சூழலை இயல்பான தமிழில் தருகிறது.
- source_word: אֲשֶׁר יְנַהֶגְךָ
  choice: யாவே உன்னைத் துரத்திவிடும்
  rationale: נהג என்பதற்கு நடத்துதல் அல்லது ஓட்டுதல் என்ற பொருள்கள் உண்டு; நாடுகடத்தலைக் குறிக்கும் சாபச் சூழலில் கட்டாயமாக அகற்றும் பொருளை ‘துரத்திவிடும்’ வெளிப்படுத்துகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: திருநான்கெழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தேவனுடைய தனிப்பெயராகத் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: שָׁמָּה
  choice: வாக்கியத்தில் தனியே மொழிபெயர்க்கப்படவில்லை
  rationale: இவ்விடவினையடை ‘அங்கே’ எனப் பொருள்படும்; தமிழில் ‘யாவே உன்னைத் துரத்திவிடும் எல்லா மக்களினங்களின் நடுவிலும்’ என்ற தொடர்புத் தொடரிலேயே சென்றடையும் இடம் இயல்பாக அடங்குகிறது.
theological_decisions:
- issue: יְהוָה என்னும் இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: எபிரெய உரை தேவனுடைய தனிப்பெயரை நேரடியாகப் பயன்படுத்துகிறது. ‘யாவே’ என்பது அதை ஒரு பட்டத்தால் மாற்றாமல் காத்து, பரவலாக ஏற்கப்பட்ட ஒலிப்பைத் தமிழில் தருகிறது.
- issue: நாடுகடத்தலில் தேவனுடைய செயலின் வலிமை
  choice: துரத்திவிடும்
  alternative: வழிநடத்தும்
  rationale: נהג இரு பொருள்களையும் ஏற்கக்கூடியது; எனினும் உடன்படிக்கைச் சாபம் மற்றும் கட்டாயச் சிதறடிப்பு சூழல் வலுக்கட்டாய அகற்றலை ஆதரிக்கிறது. மாற்றுப் பொருள் அடிக்குறிப்பில் காக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையில் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘திகிலூட்டும் காட்சி,’ ‘பழமொழி,’ ‘ஏளனச் சொல்’ என்ற மூன்று இணைநிலைப் பெயர்த்தொடர்கள் எபிரெய உரையின் சொற்பொருள் வேறுபாடுகளையும் ஓசை அமைப்பையும் காக்கின்றன. அடிக்குறிப்பு குறிகள் தொடர்புடைய சொற்களுக்குப் பின்பே வைக்கப்பட்டுள்ளன.
