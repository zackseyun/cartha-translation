revisions:
- from: யாவே உன்னைத் துரத்திவிடும் எல்லா மக்களினங்களின் நடுவிலும் நீ திகிலூட்டும் காட்சியாகவும்,[a] பழமொழியாகவும், ஏளனச் சொல்லாகவும்[b] ஆவாய்.[c]
  to: யாவே உன்னை எல்லா மக்களினங்களிடையிலும் துரத்திவிடுவார்; அங்கே நீ திகிலூட்டும் ஒன்றாகவும்,[a] பழமொழியாகவும், ஏளனச் சொல்லாகவும்[b] ஆவாய்.[c]
  rationale: The revised wording removes an unnecessary visual implication, clarifies that Yahweh drives the addressee among the peoples, and explicitly renders the final Hebrew locative adverb as ‘அங்கே.’ It preserves the source’s lexical distinctions and the supplied alternative for the ambiguous verb.
