base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/041.yaml
  text: You will father sons and daughters[a], but they will not remain yours[b], because they will go into captivity.
translation:
  language: ta
  text: நீ மகன்களையும் மகள்களையும் பெறுவாய்; ஆனால் அவர்கள் உனக்குரியவர்களாக இருக்கமாட்டார்கள்[a]. ஏனெனில் அவர்கள் சிறைப்பட்டவர்களாகப் போவார்கள்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இன்னும் சொல்லுக்கு நெருக்கமாக, “அவர்கள் உனக்கு இருக்கமாட்டார்கள்.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அவர்கள் சிறையிருப்புக்குள் போவார்கள்.” எபிரெயச் சொல் குறிப்பாகச் சிறைப்பட்ட நிலையைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּנִים וּבָנוֹת
  choice: மகன்களையும் மகள்களையும்
  rationale: எபிரெய உரை ஆண், பெண் பிள்ளைகளைத் தனித்தனியாகக் குறிப்பிடுவதால், பொதுவான ‘பிள்ளைகள்’ என்பதற்குப் பதிலாக அந்த இணை பாதுகாக்கப்படுகிறது.
- source_word: תּוֹלִיד
  choice: பெறுவாய்
  rationale: இது ילד என்பதன் ஹிஃபில் இரண்டாம் நபர் ஆண்பால் ஒருமை வடிவம். தமிழில் ‘மகன்களையும் மகள்களையும் பெறுவாய்’ என்பது இயல்பாகவும், பிள்ளைகளைப் பிறப்பிக்கச் செய்தல்/பெறுதல் என்ற கருத்தை மரியாதையான நவீன நடையில் தெரிவிப்பதாகவும் உள்ளது.
- source_word: וְלֹא יִהְיוּ לָךְ
  choice: ஆனால் அவர்கள் உனக்குரியவர்களாக இருக்கமாட்டார்கள்
  rationale: சொல்லுக்கு நெருக்கமாக ‘அவர்கள் உனக்கு இருக்கமாட்டார்கள்’ என்பதே அமைப்பு. சிறைபிடித்துச் செல்லப்படுவதால் ஏற்படும் உறவு மற்றும் உடைமை இழப்பை ‘உனக்குரியவர்களாக இருக்கமாட்டார்கள்’ இயல்பாக வெளிப்படுத்துகிறது; ‘தொடர்ந்து’ என்ற கருத்தை உரையில் சேர்க்கவில்லை.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: பிள்ளைகள் ஏன் அவருக்குரியவர்களாக இருக்கமாட்டார்கள் என்பதற்கான காரணத்தை அறிமுகப்படுத்தும் காரண இணைப்பாக உள்ளது.
- source_word: יֵלְכוּ
  choice: போவார்கள்
  rationale: הלך என்பதன் செயப்பாட்டு Qal வடிவம் நேரடியாக ‘போவார்கள்’ என்கிறது. கட்டாயமாகக் கொண்டுசெல்லப்படுதல் சூழலில் உணரப்பட்டாலும், வினையைச் செயப்பாட்டு வடிவமாகவே பாதுகாக்கிறது.
- source_word: בַּשֶּׁבִי
  choice: சிறைப்பட்டு
  rationale: שֶׁבִי போர் சார்ந்த சிறையிருப்பு அல்லது சிறைப்பட்ட நிலையைச் சுட்டுகிறது. ‘சிறைப்பட்டுப் போவார்கள்’ என்பது ‘சிறையிருப்புக்குள் போவார்கள்’ என்பதைவிட இயல்பான தமிழாகவும், ‘நாடுகடத்தல்’ என்பதைக் காட்டிலும் எபிரெயச் சொல்லின் தனிப்பொருளுக்கு நெருக்கமாகவும் உள்ளது.
