translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் இயல்பான ஆனால் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ஒருமை ஆண்பால் முகவரியைத் தமிழின் ‘நீ/உனக்கு’ வடிவம் இயல்பாகக் கொண்டுள்ளது. மூலத்தின் செயப்பாட்டு ‘போவார்கள்’ பாதுகாக்கப்பட்டு, கட்டாய நாடுகடத்தல் என வெளிப்படையாக மாற்றப்படவில்லை; ‘சிறைப்பட்டு’ அதன் போர்/பிடிப்பு சார்ந்த பொருளைக் காட்டுகிறது.
