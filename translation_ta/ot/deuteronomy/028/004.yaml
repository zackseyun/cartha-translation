translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குத் தெளிவான அதேவேளையில் கண்ணியமான ஆசீர்வாத நடையுடன் மொழிபெயர்க்கப்பட்டுள்ளது. மூலத்தின் மூன்று மடங்கு ‘கனி’ இணைநடை, தமிழின் இயல்புக்காக ‘கனி / விளைச்சல் / இனப்பெருக்கம்’ என பொருள்சார் இணைநடையாக மாற்றப்பட்டுள்ளது. இரண்டாம் நபர் ஒருமை ‘உன்’ எனத் தக்கவைக்கப்பட்டுள்ளது.
