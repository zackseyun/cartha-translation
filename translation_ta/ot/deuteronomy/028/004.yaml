base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/004.yaml
  text: Blessed shall be the fruit of your womb[a], and the fruit of your ground, and the fruit of your livestock—the offspring of your herds and the young of your flocks.
translation:
  language: ta
  text: '**உபாகமம் 28:4**


    உன் கர்ப்பத்தின் கனியும், உன் நிலத்தின் விளைச்சலும், உன் கால்நடைகளின் சந்ததியும்—உன் மாடுகளின் கன்றுகளும் உன் ஆட்டுமந்தைகளின் குட்டிகளும்—ஆசீர்வதிக்கப்பட்டிருக்கும்.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “உன் மாடுகளின் பெருக்கமும் உன் ஆட்டுமந்தைகளின் சந்ததியும்” என்றும் மொழிபெயர்க்கலாம். எபிரெயத்தில் שְׁגַר אֲלָפֶיךָ மற்றும் עַשְׁתְּרֹת צֹאנֶךָ என்ற சொற்றொடர்கள் கால்நடைகளின் இனப்பெருக்கத்தைக் குறிக்கும் மரபுவழக்குச் சொற்கள்.
    reason: שְׁגַר אֲלָפֶיךָ மற்றும் עַשְׁתְּרֹת צֹאנֶךָ ஆகிய சொற்றொடர்கள் தனிப்பட்ட இளம் விலங்குகளையோ, கூட்டாகக் கால்நடைப் பெருக்கத்தையோ குறிக்கலாம்.
lexical_decisions:
- source_word: בָּרוּךְ
  choice: ஆசீர்வதிக்கப்பட்டிருக்கும்
  rationale: உடன்படிக்கை ஆசீர்வாதங்களின் தொடரில் வரும் பயனிலைப் பெயரடை. தமிழில் இயல்பாகவும் வரவிருக்கும் ஆசீர்வாத நிலையை உணர்த்துமாறும் எதிர்கால வடிவில் தரப்பட்டுள்ளது.
- source_word: פְּרִי בִטְנְךָ
  choice: உன் கருவின் கனி
  rationale: בטן இச்சூழலில் குழந்தைகளை உருவகமாகக் குறிக்கும் கருவைக் குறிக்கிறது. ‘கனி’ என்ற உருவகம் மூலமொழியின் ஆசீர்வாத நடையைத் தக்கவைக்கிறது.
- source_word: פְּרִי אַדְמָתְךָ
  choice: உன் நிலத்தின் விளைச்சல்
  rationale: אדמה பயிரிடப்படும் மண்ணைச் சுட்டுகிறது. தமிழில் ‘நிலத்தின் விளைச்சல்’ என்பது வேளாண் பொருளைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: פְּרִי בְהֶמְתֶּךָ
  choice: உன் கால்நடைகளின் இனப்பெருக்கம்
  rationale: בהמה என்பது வளர்ப்பு விலங்குகளைப் பொதுவாகக் குறிக்கிறது. இங்கு ‘கனி’ என்பதை சொற்படியாக மீண்டும் கூறுவது தமிழில் தெளிவற்றதாக இருப்பதால், அதன் சூழல்சார் பொருளான இனப்பெருக்கம் பயன்படுத்தப்பட்டுள்ளது.
- source_word: שְׁגַר אֲלָפֶיךָ
  choice: உன் மாட்டுமந்தைகளின் கன்றுகள்
  rationale: மாடுகள் ஈன்ற சந்ததியைச் சுட்டும் மரபுவழக்குச் சேர்க்கை. ‘கன்றுகள்’ என்பது தமிழில் இயல்பான, தெளிவான இணைச்சொல்.
- source_word: עַשְׁתְּרֹת צֹאנֶךָ
  choice: உன் ஆட்டுமந்தைகளின் குட்டிகள்
  rationale: צאן என்பது செம்மறியாடுகளையும் வெள்ளாடுகளையும் உள்ளடக்கக்கூடிய சிறுகால்நடை மந்தையைக் குறிக்கும்; இச்சேர்க்கை அவற்றின் இளம் சந்ததி அல்லது பெருக்கத்தைச் சுட்டுகிறது. பொதுவான தமிழில் ‘ஆட்டுமந்தைகளின் குட்டிகள்’ இயல்பாகப் புரியும்.
