translation_notes:
  register: நவீனத் தரத் தமிழில், நேரடியான ஒருமை முன்னிலையான ‘உன்/நீ’ பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் தீவிரமான உருவகம் காக்கப்பட்டு, இறுதி மரபுத்தொடர் சாதாரண வாசகர்களுக்குத் தெளிவாக இயல்பாக்கப்பட்டுள்ளது.
