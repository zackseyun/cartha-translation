source:
  edition: WLC
  text: וְ/הָי֣וּ חַיֶּ֔י/ךָ תְּלֻאִ֥ים לְ/ךָ֖ מִ/נֶּ֑גֶד וּ/פָֽחַדְתָּ֙ לַ֣יְלָה וְ/יוֹמָ֔ם וְ/לֹ֥א תַאֲמִ֖ין בְּ/חַיֶּֽי/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/066.yaml
  text: Your life will hang in doubt before you[a]; you will fear night and day[b], and you will have no assurance of your life.
translation:
  language: ta
  text: உன் உயிர் உன் கண்முன் தொங்கிக்கொண்டிருக்கும்[a]; இரவும் பகலும் நீ அஞ்சுவாய்; உன் உயிர் நிலைக்கும் என்ற உறுதி உனக்கு இருக்காது[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உன் உயிர் உன் முன்னே தொங்கும்.” எபிரெய உருவகம் உயிர் ஆபத்தான நிலையில் தொங்குவதுபோலக் காட்டி, உயிர்வாழ்வது குறித்த தொடர்ந்த நிச்சயமின்மையை வெளிப்படுத்துகிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “உன் உயிரைக் குறித்து நீ நிச்சயமாக இருக்கமாட்டாய்” அல்லது “உன் உயிர்மீது உனக்கு நம்பிக்கை இருக்காது.”
    reason: lexical_alternative
lexical_decisions:
- source_word: חַיֶּיךָ
  choice: உன் உயிர்
  rationale: எபிரெயில் வடிவம் பன்மையாக இருந்தாலும், இங்கு ஒருவரின் உயிர்வாழ்வையும் தொடர்ந்து வாழும் நிலையையும் குறிக்கும் மரபுத்தொடர் என்பதால் தமிழில் இயல்பான ஒருமை பயன்படுத்தப்பட்டது.
- source_word: תְּלֻאִים
  choice: தொங்கிக்கொண்டிருக்கும்
  rationale: תלה (‘தொங்கு’) என்ற வினையின் உருவகத்தை நேரடியாகத் தக்கவைக்கிறது; சூழலில் உயிர் எந்நேரமும் பறிபோகக்கூடிய நிலையையும் நிச்சயமின்மையையும் இது உணர்த்துகிறது.
- source_word: לְךָ מִנֶּגֶד
  choice: உன் கண்முன்
  rationale: ‘உனக்கு முன்பாக/உன் முன்னே’ என்ற இடவியல் உருவகத்தை இயல்பான நவீனத் தமிழில் வெளிப்படுத்தி, உயிருக்கு நேரும் ஆபத்து எப்போதும் எதிரே நிற்பதை உணர்த்துகிறது.
- source_word: וּפָחַדְתָּ
  choice: நீ அஞ்சுவாய்
  rationale: פחד குறிக்கும் பயம் அல்லது திகிலை மிகைப்படுத்தாமல் நேரடியாகத் தருகிறது.
- source_word: לַיְלָה וְיוֹמָם
  choice: இரவும் பகலும்
  rationale: மூலத்தின் சொல் வரிசையைத் தக்கவைத்து, இடைவிடாத அச்சத்தைத் தெரிவிக்கிறது.
- source_word: לֹא תַאֲמִין בְּחַיֶּיךָ
  choice: உன் உயிர் நிலைக்கும் என்ற உறுதி உனக்கு இருக்காது
  rationale: אמן என்பதன் இச்சூழலுக்குரிய ‘நம்பிக்கையுடன் இரு/உறுதியாக இரு’ என்ற பொருளை எடுத்துரைக்கிறது. இங்கு இறையியல் நம்பிக்கை அல்ல, தொடர்ந்து உயிர்வாழ்வது குறித்த நிச்சயமின்மையே கருத்து.
