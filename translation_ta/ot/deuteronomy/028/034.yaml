  text: And you will be driven mad by the sight your eyes see[a].
translation:
  language: ta
  text: உன் கண்கள் காணும் காட்சியால் நீ பித்துப்பிடிப்பாய்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'இன்னும் சொற்சொல்லாக: “உன் கண்கள் காணும் காட்சியினால் நீ பித்துப்பிடிப்பாய்.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיִיתָ
  choice: நீ ... ஆவாய்
  rationale: சாபங்களின் எதிர்கால விளைவைக் குறிக்கும் தொடரில், இணைப்புடன் வரும் வினைவடிவத்தின் வருங்கால/விளைவு நுட்பத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: מְשֻׁגָּע
  choice: பித்துப்பிடித்தவனாவாய்
  rationale: שׁגע என்பதன் செயலுக்கு உட்பட்ட அல்லது விளைவுநிலையான பொருளை, வெறும் ‘பைத்தியமாக இருப்பாய்’ என்பதைவிடத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: מִמַּרְאֵה
  choice: காட்சியால்
  rationale: מִן இங்கு காரணத்தைக் குறிக்கிறது; கண்முன் காணப்படும் காட்சியே மனப்பிறழ்வுக்குக் காரணம் என்ற தொடர்பைச் சுருக்கமாகக் காட்டுகிறது.
- source_word: עֵינֶיךָ
  choice: உன் கண்கள்
  rationale: எபிரேயத்தின் நேரடியான புலனுணர்வு வலியுறுத்தலைப் பாதுகாக்கிறது.
- source_word: אֲשֶׁר תִּרְאֶה
  choice: காணும்
  rationale: ‘கண்கள்’ மற்றும் ‘காணுதல்’ என்ற எபிரேயத்தின் திட்டமிட்ட மறுபயன்பாட்டைப் பாதுகாத்தபடி தமிழில் இயல்பாக அமைகிறது.
