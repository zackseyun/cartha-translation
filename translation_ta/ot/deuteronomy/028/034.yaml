translation_notes:
  register: நவீன நிலையான தமிழில், ஒருமை இரண்டாம் நபர் உரையாடலைப் பேணி, சாபவாக்கியத்திற்கேற்ற நேரடியானவும் கண்ணியமானவும் நடையில் மொழிபெயர்க்கப்பட்டது. மூலத்தின் ‘கண்கள்—காணுதல்—காட்சி’ என்ற செறிவான மீளுருவாக்கம் இயன்றவரை பாதுகாக்கப்பட்டுள்ளது.
