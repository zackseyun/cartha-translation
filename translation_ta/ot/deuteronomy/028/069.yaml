base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/069.yaml
  text: These are the words of the covenant that Yahweh commanded Moses to make with the sons of Israel in the land of Moab[a], besides the covenant that he made with them at Horeb.
translation:
  language: ta
  text: ஓரேபில் அவர்களோடு அவர் செய்த உடன்படிக்கைக்கு அப்பாற்பட்டு, மோவாப் நாட்டில் இஸ்ரவேல் மக்களோடு உடன்படிக்கை செய்யும்படி[a] யாவே மோசேக்குக் கட்டளையிட்ட உடன்படிக்கையின் வார்த்தைகள் இவையே.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொல்லுக்குச் சொல், “உடன்படிக்கையை வெட்டும்படி”; அதேபோல், “அவர்களோடு அவர் வெட்டிய உடன்படிக்கை.” இது உடன்படிக்கை செய்வதற்கான எபிரெய மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה דִבְרֵי הַבְּרִית
  choice: உடன்படிக்கையின் வார்த்தைகள் இவையே
  rationale: எபிரெயத் தொடக்கத்தின் சுட்டும், தலைப்புப்போன்ற தன்மையையும் காக்கிறது; இயல்பான தமிழ் வாக்கிய அமைப்புக்காக இறுதியில் வைக்கப்பட்டுள்ளது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், எபிரெய நான்கெழுத்துப் பெயரின் பரவலான தமிழ் ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: לִכְרֹת ... הַבְּרִית / כָּרַת
  choice: உடன்படிக்கை செய்யும்படி / செய்த உடன்படிக்கை
  rationale: ‘வெட்டு’ என்ற எபிரெய மரபுத்தொடரின் பொருளை இயல்பான நவீன தமிழில் தெரிவிக்கிறது; நேரடிச் சொற்பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்கள்
  rationale: சொல்லுக்குச் சொல் ‘இஸ்ரவேலின் மகன்கள்’ என்றாலும், இச்சூழலில் அது உடன்படிக்கையில் பங்குபெறும் இஸ்ரவேல் சமூகத்தை மொத்தமாகக் குறிக்கிறது; ‘மக்கள்’ அந்தக் கூட்டு அர்த்தத்தை இயல்பாகத் தருகிறது.
- source_word: בְּאֶרֶץ מוֹאָב
  choice: மோவாப் நாட்டில்
  rationale: אֶרֶץ என்பதையும் உடன்படிக்கை செய்யப்பட்ட புவியியல் சூழலையும் தெளிவாகப் பாதுகாக்கிறது.
- source_word: מִלְּבַד
  choice: அப்பாற்பட்டு
  rationale: மோவாபில் செய்யப்பட்ட உடன்படிக்கையை ஓரேபில் செய்யப்பட்ட உடன்படிக்கையிலிருந்து வேறுபடுத்துகிறது; முந்தைய உடன்படிக்கை நீக்கப்பட்டது என்ற தேவையற்ற பொருளைச் சேர்க்கவில்லை.
- source_word: בְּחֹרֵב
  choice: ஓரேபில்
  rationale: எபிரெய இடப்பெயரான ஓரேபை சீனாய் என்று ஒத்திசைக்காமல் அப்படியே வைத்திருக்கிறது.
theological_decisions:
- issue: இஸ்ரவேல் சமூகத்தைக் குறிக்கும் பாலின வடிவம்
  choice: இஸ்ரவேல் மக்கள்
  alternative: இஸ்ரவேலின் மகன்கள்
  rationale: בְּנֵי יִשְׂרָאֵל என்பது வடிவில் ‘இஸ்ரவேலின் மகன்கள்’ என்றாலும், இங்கு முழு உடன்படிக்கைச் சமூகத்தைக் குறிக்கும் நிலையான கூட்டு மரபுத்தொடர். நவீன தமிழில் ‘மக்கள்’ அதன் சூழல்சார் அர்த்தத்தைத் தவறான ஆண்-மட்டும் வரம்பின்றி தருகிறது.
- issue: יְהוָה என்ற தெய்வீகப் பெயர்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் தனிப்பட்ட உடன்படிக்கைப் பெயர் நேரடியாக இருப்பதால், அதை ஒரு பட்டமாக மாற்றாமல் ஒலிபெயர்க்கிறது.
- issue: மோவாப் உடன்படிக்கைக்கும் ஓரேப் உடன்படிக்கைக்கும் உள்ள தொடர்பு
  choice: உடன்படிக்கைக்கு அப்பாற்பட்டு
  alternative: உடன்படிக்கையோடு கூடுதலாக
  rationale: מִלְּבַד இரண்டையும் வேறுபடுத்துகிறது; அவற்றின் துல்லியமான இறையியல் உறவை—முற்றிலும் தனித்த உடன்படிக்கைகளா அல்லது ஒரே உடன்படிக்கையின் புதுப்பிப்பா என்பதை—தமிழாக்கம் தீர்மானிக்காமல் விடுகிறது.
translation_notes:
  register: நவீன, கண்ணியமான பொதுத்தமிழ் பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் தலைப்புப்போன்ற வலியுறுத்தலை ‘இவையே’ காக்கிறது; நீண்ட எபிரெய வாக்கியம் தமிழில் தெளிவாகப் படிக்கும்படி கூறுகள் மறுவரிசைப்படுத்தப்பட்டுள்ளன.
