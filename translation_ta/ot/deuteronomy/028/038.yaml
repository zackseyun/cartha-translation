translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் கண்ணியமான நடையிலும் மொழிபெயர்க்கப்பட்டுள்ளது. முதன்மை உரை எபிரெயச் சொற்றோற்றத்தை நெருக்கமாகப் பாதுகாக்கிறது; இயல்பான வேளாண் பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
