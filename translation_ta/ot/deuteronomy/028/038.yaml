  text: זֶ֥רַע רַ֖ב תּוֹצִ֣יא הַ/שָּׂדֶ֑ה וּ/מְעַ֣ט תֶּאֱסֹ֔ף כִּ֥י יַחְסְלֶ֖/נּוּ הָ/אַרְבֶּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/038.yaml
  text: You will carry much seed out to the field[a], but you will gather in little, because the locust will consume it.
translation:
  language: ta
  text: நீ ஏராளமான விதையை வயலுக்கு எடுத்துச் செல்வாய்[a]; ஆனால் சிறிதளவே சேகரிப்பாய்; ஏனெனில் வெட்டுக்கிளி அதைத் தின்றுவிடும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நீ வயலில் ஏராளமான விதையை விதைப்பாய்; ஆனால் சிறிதளவே அறுவடை செய்வாய்.” எபிரெய மொழியில் இன்னும் சொல்லுக்குச் சொல்லாக, “ஏராளமான விதையை வயலுக்கு எடுத்துச் செல்வாய்” என்றும் “சிறிதளவே சேகரிப்பாய்” என்றும் உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֶרַע רַב
  choice: மிகுதியான விதை
  rationale: זֶרַע என்பது விதையைச் சுட்டுகிறது; רַב அதன் பெருமளவைக் குறிக்கிறது. இந்தத் தேர்வு மூலத்தின் தெளிவான வேளாண் உருவகத்தைப் பாதுகாக்கிறது.
- source_word: תּוֹצִיא
  choice: எடுத்துச் செல்வாய்
  rationale: יצא என்பதன் ஹிஃபில் வடிவம் நேரடியாக ‘வெளியே கொண்டுபோ’ என்ற பொருளைக் கொண்டது. இங்கு விதைப்பதற்காக விதையை வயலுக்குக் கொண்டுசெல்வதைக் குறிக்கிறது; ‘விதைப்பாய்’ என்று விளக்கமாக மாற்றாமல் எபிரெய உருவகத்தைப் பாதுகாக்கிறது.
- source_word: הַשָּׂדֶה
  choice: வயலுக்கு
  rationale: שׂדה என்பதற்கான இயல்பான நவீனத் தமிழ் இணை ‘வயல்.’ திசை/இலக்கைச் சூழலுக்கேற்ற நான்காம் வேற்றுமை வெளிப்படுத்துகிறது.
- source_word: וּמְעַט תֶּאֱסֹף
  choice: ஆனால் சிறிதளவே சேர்ப்பாய்
  rationale: אָסַף என்பதன் அடிப்படைப் பொருள் ‘சேர்/திரட்டு.’ வேளாண் சூழலில் இது அறுவடையை உணர்த்தினாலும், ‘அறுவடை செய்வாய்’ என்று விளக்கமாக்காமல் மூல வினைச்சொல்லின் பரப்பை இந்த மொழிபெயர்ப்பு காக்கிறது. ‘சிறிதளவே’ என்பது רַב என்பதுடனான முரண்பாட்டைத் தெளிவாக்குகிறது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: இங்கு כִּי குறைவான விளைச்சலுக்கான காரணத்தை அறிமுகப்படுத்துகிறது; ‘ஏனெனில்’ என்பது தெளிவான காரண இணைப்புச்சொல்.
- source_word: יַחְסְלֶנּוּ
  choice: அதைத் தின்றுவிடும்
  rationale: חסל முழுமையாக உண்டு தீர்த்தல் அல்லது அழித்தலைக் குறிக்கிறது. ‘தின்றுவிடும்’ என்பது வெட்டுக்கிளியின் செயலை இயல்பாகவும் வலிமையாகவும் தெரிவிக்கிறது; ‘அதை’ என்பதன் சுட்டல் மூலத்திலுள்ள அளவுக்கே திறந்ததாக வைக்கப்படுகிறது.
- source_word: הָאַרְבֶּה
  choice: வெட்டுக்கிளி
  rationale: אַרְבֶּה என்பதற்கான வழக்கமான பொருள் ‘வெட்டுக்கிளி.’ எபிரெய ஒருமை இங்கு இனத்தையோ கூட்டத்தையோ பொதுப்படையாகக் குறிக்கலாம்; தமிழ் ஒருமையும் அதே பொதுப்படையான பயன்பாட்டை ஏற்கிறது.
