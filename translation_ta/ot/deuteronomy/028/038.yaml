review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the contrast between taking out much seed and obtaining little, as well as the causal statement that the locust consumes it. However, சேர்ப்பாய் normally means ‘will add/place together’ and does not naturally communicate the agricultural gathering intended by תֶּאֱסֹף. சேகரிப்பாய் preserves the broad ‘gather’ sense without prematurely narrowing it to ‘harvest.’
  naturalness: The sentence is clear and appropriately dignified in modern standard Tamil. Replacing மிகுதியான with ஏராளமான gives a more idiomatic expression for a large quantity of seed, and replacing சேர்ப்பாய் with சேகரிப்பாய் removes an unnatural agricultural collocation.
  terminology: வயலுக்கு எடுத்துச் செல்வாய் appropriately retains the concrete force of the Hiphil ‘bring/carry out’ while the note supplies ‘sow’ as an interpretive alternative. வெட்டுக்கிளி is a suitable generic singular for אַרְבֶּה. No theological terminology is involved.
  issues:
  - severity: medium
    issue: சேர்ப்பாய் is not a natural rendering of the agricultural ‘gather in’ action.
    rationale: In current Tamil, சேர்/சேர்ப்பது primarily expresses joining, adding, or causing to accumulate. சேகரிப்பது naturally renders אָסַף (‘gather/collect’) and retains the source verb’s breadth.
  - severity: low
    issue: மிகுதியான விதை is less idiomatic than ஏராளமான விதை in this quantity expression.
    rationale: மிகுதியான can suggest ‘excessive’; ஏராளமான naturally means ‘much/a large amount of’ while preserving רַב.
  revised_text: நீ ஏராளமான விதையை வயலுக்கு எடுத்துச் செல்வாய்[a]; ஆனால் சிறிதளவே சேகரிப்பாய்; ஏனெனில் வெட்டுக்கிளி அதைத் தின்றுவிடும்.
  revised_footnotes:
  - marker: a
    text: அல்லது, “நீ வயலில் ஏராளமான விதையை விதைப்பாய்; ஆனால் சிறிதளவே அறுவடை செய்வாய்.” எபிரெய மொழியில் இன்னும் சொல்லுக்குச் சொல்லாக, “ஏராளமான விதையை வயலுக்கு எடுத்துச் செல்வாய்” என்றும் “சிறிதளவே சேகரிப்பாய்” என்றும் உள்ளது.
    reason: lexical_alternative
