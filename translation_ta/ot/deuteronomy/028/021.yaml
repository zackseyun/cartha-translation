base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/021.yaml
  text: Yahweh will make the plague cling to you until he has wiped you out from the land that you are entering to possess[a][b].
translation:
  language: ta
  text: யாவே கொள்ளைநோய் உன்னைப் பற்றிக்கொள்ளச் செய்வார்; நீ உரிமையாகக் கொள்ள நுழைகிற நாட்டிலிருந்து அவர் உன்னை முற்றிலும் அழித்துப்போடும்வரை.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘பெருந்தொற்றுநோயை.’ எபிரெயச் சொல் நியாயத்தீர்ப்பாக அனுப்பப்படும் கொடிய தொற்றுநோயைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘அது உன்னை முற்றிலும் அழித்துப்போடும்வரை’; இவ்வாசிப்பில் ‘கொள்ளைநோய்’ இறுதிச் சொற்றொடரின் மறைமுக எழுவாயாகும்.
    reason: alternative_reading
lexical_decisions:
- source_word: יַדְבֵּק
  choice: ஒட்டிக்கொண்டிருக்கச் செய்வார்
  rationale: דבק என்பதன் ஹிஃபீல் வடிவம் ‘ஒட்டிக்கொள்ளச் செய்’ என்ற காரணவினைப் பொருளைத் தருகிறது. நோய் விடாமல் பற்றிக்கொள்ளும் உயிரோட்டமான உருவகத்தையும் தமிழில் இயல்பாகப் பாதுகாக்கிறது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: இறைவனின் தனிப்பெயரான நான்கு எழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் பரவலாக அறியப்பட்ட ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: בְּךָ
  choice: உன்னோடு
  rationale: דבק உடன் வரும் בְ நெருக்கமாகப் பற்றியிருப்பதைக் குறிக்கிறது; ‘உன்னோடு ஒட்டிக்கொண்டிருக்க’ என்பது தமிழில் இயல்பாக அந்த உறவை வெளிப்படுத்துகிறது.
- source_word: הַדָּבֶר
  choice: கொள்ளைநோய்
  rationale: உடன்படிக்கைச் சாபச் சூழலில் דֶּבֶר கொடிய தொற்றுநோய் அல்லது கொள்ளைநோயைக் குறிக்கிறது. ‘கொள்ளைநோய்’ அதன் பெருமளவிலான உயிர்க்கொல்லித் தன்மையைத் தெளிவாகத் தருகிறது.
- source_word: עַד כַּלֹּתוֹ אֹתְךָ
  choice: அவர் உன்னை முற்றிலும் அழித்துப்போடும்வரை
  rationale: כלה இங்கு முடிவுக்குக் கொண்டுவருதல் அல்லது முற்றாக அழித்தல் என்ற பொருளுடையது. முன்னுள்ள வாக்கியத்தின் எழுவாயான யெகோவாவையே மறைமுக எழுவாயாகக் கொண்டு மொழிபெயர்க்கப்பட்டுள்ளது; மாற்று இலக்கணப் புரிதல் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: מֵעַל הָאֲדָמָה
  choice: அந்த நாட்டிலிருந்து
  rationale: אֲדָמָה அடிப்படையில் நிலம் அல்லது மண் என்றாலும், இங்கு கைப்பற்றப்படவிருக்கும் நாட்டைப் பற்றிய உபாகமச் சூழலால் ‘நாடு’ பொருத்தமானது.
- source_word: אֲשֶׁר אַתָּה בָא שָׁמָּה
  choice: நுழைகிற அந்த
  rationale: בוא + שמה என்பது அங்கே செல்வது அல்லது நுழைவது என்ற இயல்பான எபிரெய வழக்கு. நிகழவிருக்கும் நுழைவை நிகழ்கால வடிவில் பாதுகாக்கிறது.
- source_word: לְרִשְׁתָּהּ
  choice: கைப்பற்றுவதற்காக
  rationale: ירש இங்கு நாட்டை உரிமையாக்கிக் கைப்பற்றுவதைக் குறிக்கிறது; ‘கைப்பற்றுவதற்காக’ நவீன தமிழில் தெளிவாகவும் சூழலுக்கேற்றவாறும் உள்ளது.
theological_decisions:
- issue: உடன்படிக்கைச் சாபத்தில் வரும் דֶּבֶר என்ற நோய்ச் சொல்
  choice: கொள்ளைநோய்
  alternative: பெருந்தொற்று / கொடிய தொற்றுநோய்
  rationale: நியாயத்தீர்ப்பாக வரும் கொடிய பரவல்நோயை ‘கொள்ளைநோய்’ சுருக்கமாகவும் மரியாதையான நடையிலும் தெரிவிக்கிறது; குறிப்பிட்ட ஒரே மருத்துவ நோயாக தேவையின்றி குறுக்குவதில்லை.
- issue: כַּלֹּתוֹ என்பதன் மறைமுக எழுவாய்
  choice: யெகோவா—‘அவர் உன்னை முற்றிலும் அழித்துப்போடும்வரை’
  alternative: கொள்ளைநோய்—‘அது உன்னை முற்றிலும் அழித்துப்போடும்வரை’
  rationale: முதன்மை வாக்கியத்தின் எழுவாயான யெகோவாவைத் தொடர்வது சூழலில் இயல்பான வாசிப்பு. எனினும், கொள்ளைநோயை எழுவாயாகக் கொள்ளும் உண்மையான இலக்கண வாய்ப்பு அடிக்குறிப்பில் வெளிப்படையாக வைக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகருக்குப் புரியும் கண்ணியமான நடை. எபிரெய காரணவினை உருவகத்தைப் பாதுகாக்க முதன்மை உரையில் ‘ஒட்டிக்கொண்டிருக்கச் செய்வார்’ பயன்படுத்தப்பட்டுள்ளது; உடனடித் தெளிவுக்காக ‘அது உன்னை விட்டு நீங்காது’ சேர்க்கப்பட்டுள்ளது. இறைப்பெயர் பட்டமாக மாற்றப்படாமல் ‘யெகோவா’ என ஒலிபெயர்க்கப்பட்டுள்ளது.
