base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/063.yaml
  text: And it shall be that[a], just as Yahweh rejoiced over you to do you good and to multiply you, so Yahweh will rejoice over you to destroy you and to wipe you out[b]; and you will be torn away from upon the land that you are entering there to possess it.
translation:
  language: ta
  text: யாவே உங்களுக்கு நன்மை செய்வதிலும் உங்களைப் பெருகச் செய்வதிலும் மகிழ்ந்ததுபோலவே, உங்களை அழிப்பதிலும் முற்றிலும் ஒழித்துப்போடுவதிலும் யாவே மகிழ்வார்; நீங்கள் நீ அங்கே உரிமையாக்கிக்கொள்ள நுழைகிற[b] அந்த நிலத்திலிருந்து வலுக்கட்டாயமாக அகற்றப்படுவீர்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அந்த நிலத்திலிருந்து வேரோடு பிடுங்கப்படுவீர்கள்.’
    reason: lexical_alternative
  - marker: b
    text: ‘நீ ... நுழைகிற’ என்பது எபிரெயத்தில் ஒருமையில் உள்ளது; இஸ்ரவேலை ஒரே மக்களாக அழைக்கிறது.
    reason: cultural_note
lexical_decisions:
- source_word: וְהָיָה
  choice: (தனி தொடக்கச் சொற்றொடராக மொழிபெயர்க்காமல் விளைவை நேரடியாகத் தொடங்குதல்)
  rationale: எபிரெயச் சொல் விளைவு அல்லது எதிர்கால நிகழ்வை அறிமுகப்படுத்துகிறது. தமிழில் தனியே ‘அப்போது நிகழ்வது என்னவென்றால்’ எனச் சேர்ப்பது கனமாக இருப்பதால், எதிர்கால வினை வடிவங்களால் அதன் பொருள் இயல்பாக வெளிப்படுகிறது.
- source_word: שָׂשׂ / יָשִׂישׂ
  choice: மகிழ்ந்ததுபோலவே / மகிழ்வார்
  rationale: இரு வடிவங்களுக்கும் ஒரே தமிழ் வேர்ச்சொல்லைப் பயன்படுத்தி, ஆசீர்வாதத்திலும் நியாயத்தீர்ப்பிலும் யாவே மகிழ்வதாகக் கூறும் திட்டமிட்ட இணை அமைப்பைப் பாதுகாக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: உடன்படிக்கையின் இறைப் பெயரைத் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: לְהֵיטִיב אֶתְכֶם
  choice: உங்களுக்கு நன்மை செய்து
  rationale: இது பொருளாதாரச் செழிப்புக்கு மட்டும் சுருக்காமல், பரந்த பொருளில் நன்மை செய்வதைக் குறிக்கிறது.
- source_word: וּלְהַרְבּוֹת אֶתְכֶם
  choice: உங்களைப் பெருகச் செய்வதில்
  rationale: ஐந்நூலின் உடன்படிக்கை ஆசீர்வாத மொழிநடையைப் பாதுகாக்கிறது.
- source_word: לְהַאֲבִיד אֶתְכֶם
  choice: உங்களை அழித்து
  rationale: காரணவினையின் வலிமையையும் உடன்படிக்கைச் சாபத்தின் கடுமையையும் இயல்பான தமிழில் தருகிறது.
- source_word: וּלְהַשְׁמִיד אֶתְכֶם
  choice: உங்களை முற்றிலும் ஒழித்துப்போடுவதிலும்
  rationale: முந்தைய ‘அழித்து’ என்பதிலிருந்து வேறுபடுத்தி, முழுமையான அழிவைக் குறிக்கும் இரண்டாம் வினையின் தீவிரத்தை வெளிப்படுத்துகிறது.
- source_word: וְנִסַּחְתֶּם מֵעַל הָאֲדָמָה
  choice: அந்த நிலத்திலிருந்து வலுக்கட்டாயமாக அகற்றப்படுவீர்கள்
  rationale: வினையின் வன்மையான அகற்றுதல் என்ற கருத்தையும் מֵעַל குறிக்கும் நிலத்தின் மேலிருந்து நீக்கப்படுதலையும் இயல்பான தமிழில் இணைக்கிறது; ‘வேரோடு பிடுங்கப்படுவீர்கள்’ என்பதும் சாத்தியம்.
- source_word: אֲשֶׁר אַתָּה בָא שָׁמָּה לְרִשְׁתָּהּ
  choice: நீ அங்கே குடியிருப்பதற்காக நுழைகிறாய்
  rationale: எபிரெயத்தில் இங்கு திடீரென வரும் ஒருமை ‘நீ’ என்பதையும் שָׁמָּה என்ற ‘அங்கே’ என்பதையும் வெளிப்படையாகப் பாதுகாக்கிறது. ירשׁ என்பதற்கு இச்சூழலில் நிலத்தை உரிமையாக்கிக் குடியிருத்தல் என்ற பொருள் உள்ளது.
theological_decisions:
- issue: நியாயத்தீர்ப்பில் யாவே மகிழ்தல்
  choice: ‘உங்களை ... ஒழித்துப்போடுவதிலும் யாவே மகிழ்வார்’ என்ற வெளிப்படையான கூற்றைத் தக்கவைத்தல்
  alternative: ‘யாவே உங்களை அழிப்பார்’ என்று மகிழ்தலை மென்மைப்படுத்துதல் அல்லது விடுதல்
  rationale: மூல உரை நன்மை செய்வதில் மகிழ்ந்ததையும் அழிப்பதில் மகிழ்வதையும் திட்டமிட்டு இணைக்கிறது. கடினமான இறையியல் பதற்றத்தை மொழிபெயர்ப்பு தீர்த்துவிடாமல் அப்படியே வைக்கிறது.
- issue: இறைப் பெயர் יְהוָה
  choice: யாவே
  alternative: கர்த்தர்
  rationale: பொதுப்பட்டத்துக்குப் பதிலாக மூலத்திலுள்ள உடன்படிக்கைப் பெயரை ஒலிபெயர்த்து வெளிப்படுத்துகிறது.
- issue: பன்மையிலிருந்து ஒருமைக்கு மாறும் இஸ்ரவேலுக்கான உரை
  choice: முதல் வாக்கியத்தில் ‘நீங்கள்’; இறுதியில் ‘நீ’
  alternative: முழுவதும் ‘நீங்கள்’ என்று ஒரே எண்ணைப் பயன்படுத்துதல்
  rationale: மூல எபிரெயம் இறுதித் தொடர்புச் சொல்லாக்கத்தில் இஸ்ரவேலை ஒரே மக்களாக ஒருமையில் அழைக்கிறது; தமிழில் இவ்வேறுபாட்டைத் தெளிவாகக் காட்ட முடியும்.
translation_notes:
  register: நவீன தரத் தமிழில், சாதாரண வாசகருக்குப் புரியும் அதேவேளையில் கண்ணியமும் உடன்படிக்கைச் சாபத்தின் கடுமையும் காக்கப்பட்டுள்ளன. மூலத்தில் பன்மையிலிருந்து ஒருமைக்கு நிகழும் மாற்றத்தைத் தெளிவாக்க இறுதி எபிரெயத் துணைவாக்கியம் தனி தமிழ் வாக்கியமாக அமைக்கப்பட்டுள்ளது.
