  terminology: யாவே, நன்மை செய்தல், பெருகச் செய்தல், அழித்தல், முற்றிலும் ஒழித்துப்போடுதல் ஆகியவை பொருத்தமானவை. ‘உரிமையாக்கிக்கொள்ள’ என்பது ירשׁ-இன் இச்சூழல் பொருளை ‘குடியிருத்தல்’ என்பதைக் காட்டிலும் துல்லியமாகத் தருகிறது. ஒருமை எபிரெய அழைப்பு உரையிலேயே ‘நீ’ என்று பாதுகாக்கப்பட்டு, அதற்கான குறிப்பு சரியான இடத்தில் இணைக்கப்பட்டுள்ளது.
