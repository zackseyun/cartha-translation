revisions:
- from: யாவே உங்களுக்கு நன்மை செய்து, உங்களைப் பெருகச் செய்வதில் மகிழ்ந்ததுபோலவே, உங்களை அழித்து, உங்களை முற்றிலும் ஒழித்துப்போடுவதிலும் யாவே மகிழ்வார். நீங்கள் குடியிருப்பதற்காக நுழைகிற அந்த நிலத்திலிருந்து வலுக்கட்டாயமாக அகற்றப்படுவீர்கள்.[a] நீ அங்கே குடியிருப்பதற்காக நுழைகிறாய்.[b]
  to: யாவே உங்களுக்கு நன்மை செய்வதிலும் உங்களைப் பெருகச் செய்வதிலும் மகிழ்ந்ததுபோலவே, உங்களை அழிப்பதிலும் முற்றிலும் ஒழித்துப்போடுவதிலும் யாவே மகிழ்வார்; நீங்கள் நீ அங்கே உரிமையாக்கிக்கொள்ள நுழைகிற[b] அந்த நிலத்திலிருந்து வலுக்கட்டாயமாக அகற்றப்படுவீர்கள்.[a]
  rationale: மூலத்தின் இறுதி தொடர்புத்துணைவாக்கியம் ‘நிலம்’ என்பதோடு மீண்டும் இணைக்கப்பட்டது; இதனால் உரையின் பொருளும் தொடரியலும் மீட்கப்படுகின்றன. ירשׁ-இன் பொருளுக்கு ‘உரிமையாக்கிக்கொள்ள’ பயன்படுத்தப்பட்டுள்ளது. மூலத்தில் உள்ள பன்மை (‘நீங்கள்’) முதல் ஒருமை (‘நீ’) மாற்றம், விளக்கமின்றி ஒருமைப்படுத்தப்படாமல் உரையிலும் அடிக்குறிப்பிலும் காக்கப்பட்டுள்ளது. வலுக்கட்டாய அகற்றுதல், ‘நிலத்திலிருந்து’ நீக்கப்படுதல், மற்றும் அழிவில் யாவே மகிழ்வார் என்ற பதற்றமான இணை அமைப்பு தக்கவைக்கப்பட்டுள்ளன.
