  source_fidelity: முதல் வாக்கியத்தில் ஆசீர்வாதம் மற்றும் அழிவு குறித்த இணை அமைப்பும், யாவே நியாயத்தீர்ப்பில் மகிழ்வார் என்ற கடினமான கூற்றும் பெரும்பாலும் உண்மையாகத் தரப்பட்டுள்ளன. ஆனால் இறுதி எபிரெயத் தொடர்புத்துணைவாக்கியம் (‘நீ அங்கே ... நுழைகிற அந்த நிலம்’) முதன்மை வாக்கியத்திலிருந்து பிரிக்கப்பட்டு, தனி வாக்கியமாகத் தவறாக மீண்டும் கொடுக்கப்பட்டுள்ளது. மேலும் לְרִשְׁתָּהּ என்பது ‘குடியிருப்பதற்காக’ என்பதைவிட ‘உரிமையாக்கிக்கொள்ள/சுதந்தரித்துக்கொள்ள’ என்பதாகும்.
