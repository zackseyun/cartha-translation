  text: וְ֠/אָכַל פְּרִ֨י בְהֶמְתְּ/ךָ֥ וּ/פְרִֽי אַדְמָתְ/ךָ֮ עַ֣ד הִשָּֽׁמְדָ/ךְ֒ אֲשֶׁ֨ר לֹֽא יַשְׁאִ֜יר לְ/ךָ֗ דָּגָן֙ תִּיר֣וֹשׁ וְ/יִצְהָ֔ר שְׁגַ֥ר אֲלָפֶ֖י/ךָ וְ/עַשְׁתְּרֹ֣ת צֹאנֶ֑/ךָ עַ֥ד הַאֲבִיד֖/וֹ אֹתָֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/051.yaml
  text: It will consume the offspring of your livestock and the produce of your land until you are destroyed; it will leave you no grain[a], new wine, or oil, no calves of your herd or lambs of your flock, until it has destroyed you.
translation:
  language: ta
  text: அது உன் கால்நடைகளின் குட்டிகளையும் உன் நிலத்தின் விளைச்சலையும் நீ அழிக்கப்படும்வரை தின்றுவிடும். அது உன்னை அழித்துத் தீரும்வரை, உனக்குத் தானியத்தையோ புதுத் திராட்சரசத்தையோ எண்ணெயையோ, உன் மாட்டுமந்தையின் கன்றுகளையோ உன் ஆட்டு மந்தையின் குட்டிகளையோ[a] விட்டுவைக்காது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உன் ஆட்டு மந்தையின் பெருக்கம்.” எபிரெயச் சொற்றொடர் மந்தையின் இனப்பெருக்கப் பலனை அல்லது அதன் குட்டிகளைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָכַל
  choice: தின்றுவிடும்
  rationale: אכל என்பதன் அடிப்படைப் பொருள் ‘சாப்பிடுதல்/தின்னுதல்.’ படையெடுக்கும் நாடு வளங்களை முற்றிலும் தீர்த்துவிடும் சூழலில், ‘தின்றுவிடும்’ என்பது உருவகத்தின் வலிமையையும் இயல்பான தமிழையும் காக்கிறது.
- source_word: פְּרִי בְהֶמְתְּךָ
  choice: உன் கால்நடைகளின் குட்டிகள்
  rationale: விலங்குகளோடு வரும் פְּרִי என்பது சொல்லாட்சியாக அவற்றின் சந்ததியைக் குறிக்கிறது; בְהֵמָה பொதுவாக வளர்ப்பு கால்நடைகளைக் குறிக்கிறது.
- source_word: וּפְרִי אַדְמָתְךָ
  choice: உன் நிலத்தின் விளைச்சல்
  rationale: நிலத்தோடு வரும் ‘கனி’ என்ற உருவகம் வேளாண் விளைபொருளைக் குறிக்கிறது; ‘விளைச்சல்’ நவீனத் தமிழில் இயல்பானதும் துல்லியமானதும் ஆகும்.
- source_word: עַד הִשָּׁמְדָךְ
  choice: நீ அழிக்கப்படும்வரை
  rationale: இந்த வடிவம் அழிவு நிறைவடையும் எல்லையைக் குறிக்கிறது. எபிரெயச் செயலின் தீவிரத்தை அதிகப்படுத்தாமல், செயப்பாட்டு வடிவில் தெளிவாக வழங்கப்பட்டுள்ளது.
- source_word: דָּגָן תִּירוֹשׁ וְיִצְהָר
  choice: தானியம், புதுத் திராட்சரசம், எண்ணெய்
  rationale: இது உடன்படிக்கைச் சாபங்களில் வரும் வழக்கமான வேளாண் முத்தொகை. תִּירוֹשׁ புதிய திராட்சரசத்தையும் יִצְהָר இச்சூழலில் எண்ணெயையும் குறிக்கின்றன.
- source_word: שְׁגַר אֲלָפֶיךָ
  choice: உன் மாட்டுமந்தையின் கன்றுகள்
  rationale: שְׁגַר மாடுகளின் ஈன்ற குட்டிகளைக் குறிக்கிறது; தமிழில் ‘கன்றுகள்’ இயல்பாகவும் சூழலுக்கேற்ற துல்லியத்துடனும் உள்ளது.
- source_word: וְעַשְׁתְּרֹת צֹאנֶךָ
  choice: உன் ஆட்டு மந்தையின் குட்டிகள்
  rationale: இந்த அரிய சொல்லின் நுண்பொருள் விவாதத்திற்குரியது; இணையான கால்நடைச் சொல்லுடன் வரும் இச்சூழலில் மந்தையின் சந்ததி அல்லது இனப்பெருக்கப் பலனைக் குறிக்கிறது. முதன்மை உரை இயல்பான பொருளை வழங்குகிறது; பரந்த மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: עַד הַאֲבִידוֹ אֹתָךְ
  choice: அது உன்னை அழித்துத் தீரும்வரை
  rationale: אבד என்பதன் ஹிஃபில் வடிவம் ‘அழியச் செய்தல்’ என்ற காரணவினைப் பொருளைக் கொண்டது. ‘அழித்துத் தீரும்’ என்பது முழுமையான அழிவை இயல்பான தமிழில் தெரிவிக்கிறது.
