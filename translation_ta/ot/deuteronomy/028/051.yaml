  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. எபிரெய உரையின் இரு ‘அழிவு வரை’ கூறுகளும் அவற்றின் வலிமையான இணை அமைப்பும் காக்கப்பட்டுள்ளன; அரிய கால்நடைச் சொல்லின் பொருள் அடிக்குறிப்பில் திறந்தவாறு வைக்கப்பட்டுள்ளது.
