base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/055.yaml
  text: so that he will not give to any of them any of the flesh of his sons that he is eating[a], because he has nothing left[b], in the siege and in the distress with which your enemy will oppress you within all your gates.
translation:
  language: ta
  text: அவன் உண்ணும் தன் மகன்களின் இறைச்சியில் எதையும் அவர்களில் ஒருவருக்கும் கொடுக்கமாட்டான்; ஏனெனில், உன் எதிரி உன் நகரங்கள் அனைத்திலும் உனக்குக் கொண்டுவரும் முற்றுகையிலும் நெருக்கடியிலும், அவனுக்கு எதுவும் மீதியாக இருக்காது.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மொழியில், “உன் வாசல்கள் அனைத்திலும்”; இங்கு “வாசல்கள்” என்பது நகரங்களைக் குறிக்கும் ஆகுபெயர்.
    reason: cultural_note
lexical_decisions:
- source_word: מִתֵּת לְאַחַד מֵהֶם
  choice: அவர்களில் எவருக்கும் கொடுக்கமாட்டான்
  rationale: முந்தைய வசனத்திலிருந்து தொடரும் இத்தொடர், பகிராமல் மறுப்பதைச் சுட்டுகிறது. தமிழில் எதிர்மறை வினை வடிவம் இதை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: מִבְּשַׂר בָּנָיו
  choice: தன் மகன்களின் இறைச்சியில் சிறிதளவுகூட
  rationale: בָּשָׂר என்பதன் நேரடியான, அதிர்ச்சியூட்டும் பொருளான ‘இறைச்சி’ பாதுகாக்கப்படுகிறது; בָּנָיו குறிப்பாக ஆண்பால் பன்மையான ‘மகன்கள்’ என்பதால் பொதுவான ‘பிள்ளைகள்’ பயன்படுத்தப்படவில்லை. பகுதியைக் குறிக்கும் מִן தமிழில் ‘சிறிதளவுகூட’ என இயல்பாக வெளிப்படுகிறது.
- source_word: אֲשֶׁר יֹאכֵל
  choice: அவன் உண்ணும்
  rationale: முற்றுகைச் சூழலில் நிகழும் செயலை உயிரோட்டமாகவும், எபிரெய வினையின் காலத் திறப்பை மிகையாகத் தீர்மானிக்காமலும் காட்டுகிறது.
- source_word: מִבְּלִי הִשְׁאִיר לוֹ כֹּל
  choice: அவனுக்கு எதுவுமே மீந்திருக்காது
  rationale: ஒன்றும் எஞ்சாத முழுமையான பற்றாக்குறையை இயல்பான தமிழில் தெரிவிக்கிறது. சூழலில் காரணப் பொருள் இருப்பதால் ‘ஏனெனில்’ சேர்க்கப்பட்டுள்ளது.
- source_word: בְּמָצוֹר וּבְמָצוֹק
  choice: முற்றுகையிட்டு உன்னை நெருக்கும்போது
  rationale: מָצוֹר என்பதற்கு ‘முற்றுகை’ என்றும், מָצוֹק மற்றும் அடுத்துள்ள causative வினை தரும் கடும் நெருக்குதலை ‘நெருக்கு’ என்றும் ஒருங்கிணைத்து இயல்பான தமிழில் வழங்குகிறது.
- source_word: אֲשֶׁר יָצִיק לְךָ אֹיִבְךָ
  choice: உன் எதிரி ... உன்னை நெருக்கும்போது
  rationale: צוּק என்பதன் ‘கடும் நெருக்கத்துக்குள்ளாக்குதல்/அழுத்துதல்’ என்ற பகைமைச் செயலை முற்றுகைச் சூழலுக்கு ஏற்றபடி காட்டுகிறது.
- source_word: בְּכָל שְׁעָרֶיךָ
  choice: உன் நகரங்கள் அனைத்தையும்
  rationale: ‘உன் வாசல்கள் அனைத்திலும்’ என்பது சொற்சொல் வடிவம்; இங்கு ‘வாசல்கள்’ குடியிருப்புள்ள அரண்சூழ் நகரங்களை ஆகுபெயராகக் குறிக்கிறது. நவீன தமிழில் நோக்குப் பொருள் தெளிவாக இருக்க ‘நகரங்கள்’ முதன்மை உரையில் பயன்படுத்தப்படுகிறது.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழில், சாபப்பகுதியின் கடுமையையும் உடல் சார்ந்த அதிர்ச்சியையும் மென்மைப்படுத்தாமல், அதேவேளையில் வாசிக்க இயல்பான வாக்கிய அமைப்பில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘மகன்கள்’ என்ற மூலத்தின் குறிப்பான ஆண்பால் சொல்லாட்சி பாதுகாக்கப்பட்டுள்ளது.
