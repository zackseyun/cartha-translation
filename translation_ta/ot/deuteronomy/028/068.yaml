base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/068.yaml
  text: And Yahweh will bring you back to Egypt in ships[a], by the way of which I said to you, ‘You shall never see it again.’ And there you will offer yourselves for sale to your enemies as male servants and female servants, but there will be no buyer.
translation:
  language: ta
  text: யாவே உன்னை கப்பல்களில் எகிப்துக்குத் திரும்பக் கொண்டுபோவார்; ‘நீ இனி அதை ஒருபோதும் காணமாட்டாய்’ என்று நான் உனக்குச் சொன்ன வழியாகவே அவர் உன்னைக் கொண்டுபோவார். அங்கே நீங்கள் ஆண் அடிமைகளாகவும் பெண் அடிமைகளாகவும் உங்கள் பகைவர்களிடம் உங்களையே விற்பனைக்கு வைப்பீர்கள்[a]; ஆனால் உங்களை வாங்க யாரும் இருக்கமாட்டார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அங்கே உங்கள் பகைவர்களிடம் ஆண், பெண் அடிமைகளாக விற்கப்படுவீர்கள்.” எபிரெய வினைச்சொல்லைத் தற்சுட்டுப் பொருளில் “உங்களையே விற்க முன்வைப்பீர்கள்” என்றும், பொதுவாக அடிமைநிலைக்குள் கொண்டுவரப்படுவீர்கள் என்றும் புரிந்துகொள்ளலாம்.
    reason: lexical_alternative
lexical_decisions:
