  choice: உன்னைத் திரும்பக் கொண்டுபோவார்
  rationale: שוב என்பதன் ஹிஃபீல் வடிவம் காரணவினைப் பொருளைக் கொண்டது; யெகோவா மக்களைத் திரும்பச் செல்லச் செய்வதை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: தெய்வீகப் பெயரான நான்கெழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் வழக்கிலுள்ள ஒலிபெயர்ப்பாக அளிக்கிறது.
- source_word: מִצְרַיִם
  choice: எகிப்து
  rationale: இடப்பெயரின் நிலையான தமிழ் வடிவம்.
- source_word: בָּאֳנִיּוֹת
  choice: கப்பல்களில்
  rationale: ב முன்னிடைச்சொல்லுடன் வரும் பன்மைச் சொல்லை நேரடியாகவும் இயல்பாகவும் மொழிபெயர்த்து, கடல்வழிப் போக்குவரத்தைக் காட்டுகிறது.
- source_word: בַּדֶּרֶךְ אֲשֶׁר אָמַרְתִּי לְךָ
  choice: அதைப் பற்றி ... நான் உனக்குச் சொன்ன அந்த வழியாகவே
  rationale: דֶּרֶךְ என்பது வழி அல்லது பாதையைக் குறிக்கிறது; தொடர்புச் சொற்றொடரைத் தெளிவான நவீன தமிழ்ச் சொல் வரிசையில் தருகிறது.
- source_word: לֹא תֹסִיף עוֹד לִרְאֹתָהּ
  choice: நீ இனி ஒருபோதும் அதைக் காணமாட்டாய்
  rationale: יסף + עוד என்ற மரபுத்தொடர் ஒரு செயல் மீண்டும் நிகழாது என்பதை வலியுறுத்துகிறது.
- source_word: וְהִתְמַכַּרְתֶּם
  choice: உங்களையே விற்பனைக்கு நிறுத்துவீர்கள்
  rationale: ஹித்பயேல் வடிவத்தின் தற்சுட்டு/இடைநிலைப் பொருளைப் பாதுகாக்கிறது; அடுத்துள்ள ‘வாங்க யாரும் இல்லை’ என்பதோடு முரண்படுமாறு விற்பனை முடிந்துவிட்டதாகக் கூறாது.
- source_word: לְאֹיְבֶיךָ
  choice: உங்கள் பகைவர்களிடம்
  rationale: லாமேத் குறிக்கும் விற்பனை நோக்கப்பட்ட தரப்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: לַעֲבָדִים וְלִשְׁפָחוֹת
  choice: ஆண் அடிமைகளாகவும் பெண் அடிமைகளாகவும்
  rationale: எபிரெயச் சொற்களில் உள்ள ஆண்-பெண் இணைப்பையும் அடிமைத்தனத்தின் சமூக உண்மையையும் தெளிவாகப் பாதுகாக்கிறது.
- source_word: וְאֵין קֹנֶה
  choice: ஆனால் உங்களை வாங்க யாரும் இருக்கமாட்டார்கள்
  rationale: சொற்பொருளான ‘வாங்குபவர் இல்லை’ என்பதைச் சூழலுக்கு ஏற்ற இயல்பான தமிழில் வழங்கி, முந்தைய விற்பனை உருவகத்தைப் பாதுகாக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரின் மொழிபெயர்ப்பு
  choice: யெகோவா
  alternative: கர்த்தர்
  rationale: மூலத்தில் தனிப்பட்ட தெய்வீகப் பெயர் நேரடியாக உள்ளது; அதை ஒரு பட்டமாக மாற்றாமல் தமிழில் பரவலாக அறியப்பட்ட பெயர் வடிவத்தில் வழங்குகிறது.
- issue: וְהִתְמַכַּרְתֶּם என்பதன் தற்சுட்டு/இடைநிலைப் பொருள்
  choice: உங்களையே விற்பனைக்கு நிறுத்துவீர்கள்
  alternative: நீங்கள் விற்கப்படுவீர்கள்
  rationale: வினையின் வடிவத்தில் உள்ள உண்மையான தெளிவின்மையை முதன்மை உரையில் தற்சுட்டாகக் காட்டி, பொதுவான அடிமைநிலைக்கு உட்படுதல் அல்லது செயப்பாட்டு வாசிப்பை அடிக்குறிப்பில் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையும் தெளிவும் கொண்ட நடையில் மொழிபெயர்க்கப்பட்டது. வசனத்தின் தொடக்கத்தில் உள்ள ஒருமை ‘உன்னை’ என்பதும், பின்னர் வரும் பன்மை ‘நீங்கள்’ என்பதும் எபிரெய மூலத்தின் எண்ணிக்கை மாற்றத்தைப் பாதுகாக்கின்றன. ‘விற்பனைக்கு நிறுத்துவீர்கள்’ என்பது வாங்குபவர் இல்லாத நிலையுடன் இயல்பாக இணைகிறது.
