  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் இயல்பான ஆனால் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் காலை–மாலை இணை அமைப்பும், அச்சம்–அஞ்சுதல் மற்றும் கண்கள்–காணுதல் ஆகிய சொல் எதிரொலிகளும் முடிந்தவரை பாதுகாக்கப்பட்டுள்ளன.
