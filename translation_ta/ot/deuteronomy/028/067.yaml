  text: בַּ/בֹּ֤קֶר תֹּאמַר֙ מִֽי יִתֵּ֣ן עֶ֔רֶב וּ/בָ/עֶ֥רֶב תֹּאמַ֖ר מִֽי יִתֵּ֣ן בֹּ֑קֶר מִ/פַּ֤חַד לְבָֽבְ/ךָ֙ אֲשֶׁ֣ר תִּפְחָ֔ד וּ/מִ/מַּרְאֵ֥ה עֵינֶ֖י/ךָ אֲשֶׁ֥ר תִּרְאֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/067.yaml
  text: In the morning you will say[a], “If only it were evening!” and in the evening you will say, “If only it were morning!” because of the dread of your heart that you will dread[b], and because of the sight your eyes will see.
translation:
  language: ta
  text: காலையில், “மாலை வந்தால் எவ்வளவு நன்றாயிருக்கும்!” என்று சொல்வாய்[a]; மாலையில், “காலை வந்தால் எவ்வளவு நன்றாயிருக்கும்!” என்று சொல்வாய். உன் இதயம் அஞ்சும் அச்சத்தினாலும்[b], உன் கண்கள் காணும் காட்சியினாலும் இப்படிச் சொல்வாய்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரெயத்தில் சொல்லுக்குச் சொல்: ‘மாலையை/காலையைக் கொடுப்பவர் யார்?’ இது ஏக்கத்தை வெளிப்படுத்தும் மரபுத்தொடர்; ஆகவே, ‘மாலை/காலை வந்தால் எவ்வளவு நன்றாயிருக்கும்!’ என்று மொழிபெயர்க்கப்பட்டுள்ளது.'
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘உன் இதயத்தில் எழும் அச்சத்தினாலும்’.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּבֹּקֶר
  choice: காலையில்
  rationale: குறிப்பிட்ட காலப்பகுதியைக் குறிக்கும் எபிரெய காலச் சொற்றொடரை இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: תֹּאמַר
  choice: சொல்வாய்
  rationale: சாபங்களின் சூழலில் உள்ள இரண்டாம் நபர் ஒருமை வினைமுற்றை எதிர்கால முன்னறிவிப்பாக மொழிபெயர்க்கிறது.
- source_word: מִי יִתֵּן
  choice: வந்தால் எவ்வளவு நன்றாயிருக்கும்
  rationale: சொல்லுக்குச் சொல் பொருளான ‘யார் கொடுப்பார்?’ என்பது இங்கு நேரடியான கேள்வி அல்ல; ஒரு காலப்பகுதி விரைவில் வர வேண்டும் என்ற தீவிர ஏக்கத்தைத் தெரிவிக்கும் எபிரெய மரபுத்தொடர். தமிழில் ஏக்கத்தின் வலிமையை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: עֶרֶב
  choice: மாலை
  rationale: காலையுடன் எதிரிணையாக வரும் வழக்கமான காலப்பெயர்.
- source_word: וּבָעֶרֶב
  choice: மாலையில்
  rationale: முதல் வாக்கியப் பகுதியின் ‘காலையில்’ என்பதற்கு இணையான காலச் சொற்றொடர்.
- source_word: מִפַּחַד לְבָבְךָ אֲשֶׁר תִּפְחָד
  choice: உன் இதயம் அஞ்சும் அச்சத்தினாலும்
  rationale: מִן என்பதன் காரணப் பொருளையும், ‘அச்சம்/அஞ்சுதல்’ என்ற எபிரெயச் சொல் எதிரொலியையும், இதயத்தை மையப்படுத்தும் படிமத்தையும் காக்கிறது.
- source_word: וּמִמַּרְאֵה עֵינֶיךָ אֲשֶׁר תִּרְאֶה
  choice: உன் கண்கள் காணும் காட்சியினாலும்
  rationale: கண், காணுதல், காட்சி ஆகிய எபிரெயப் படிமத்தைத் தெளிவாகவும் தமிழில் இயல்பாகவும் காக்கிறது.
