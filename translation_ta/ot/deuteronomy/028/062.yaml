base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/062.yaml
  text: And you will be left few in number[a], though you had become as numerous as the stars of the heavens[c][b], because you did not listen to the voice of Yahweh your God.
translation:
  language: ta
  text: நீங்கள் எண்ணிக்கையில் மிகக் குறைவாக எஞ்சியிருப்பீர்கள்[a], வானத்தின் விண்மீன்களைப்போல் பெருகியிருந்தபோதிலும்; ஏனெனில், உங்கள் கடவுளாகிய யாவேவின் குரலுக்குச் செவிகொடுக்கவில்லை[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், ‘எண்ணிக்கையில் சிலர்’ என்பதைக் குறிக்கும் மரபுத்தொடர் பயன்படுத்தப்பட்டுள்ளது; அதன் பொருள் எண்ணிக்கையில் மிகக் குறைவாக இருப்பதாகும்.
    reason: lexical_alternative
  - marker: b
    text: ‘யாவேவின் குரலுக்குச் செவிகொடுக்கவில்லை’ என்ற எபிரெய உடன்படிக்கைச் சொல்லாட்சி, அவருக்குக் கீழ்ப்படியவில்லை என்ற பொருளையும் உட்கொண்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנִשְׁאַרְתֶּם
  choice: எஞ்சியிருப்பீர்கள்
  rationale: שׁאר என்பதன் நிஃபால் வடிவம் இழப்பு அல்லது நியாயத்தீர்ப்புக்குப் பின் மீந்திருக்கிற விளைவு நிலையைக் குறிக்கிறது; ‘எஞ்சியிருப்பீர்கள்’ அந்தப் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: בִּמְתֵי מְעָט
  choice: மிகச் சிலரே
  rationale: ‘குறைவான எண்ணிக்கையிலுள்ள நபர்கள்’ என்னும் எபிரெய மரபுத்தொடரின் எண்ணிக்கைச் சிறுமையை இயல்பாகக் காட்டுகிறது; ஆண்களை மட்டும் குறிப்பதாகத் தவறாக உணர்த்துவதில்லை.
- source_word: תַּחַת אֲשֶׁר
  choice: ஆகியிருந்தபோதிலும்
  rationale: முன்னிருந்த பெருக்கத்திற்கும் வரவிருக்கும் கடும் குறைவிற்கும் இடையிலான முரண்பாட்டை இச்சூழலில் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: הֱיִיתֶם
  choice: ஆகியிருந்த
  rationale: இஸ்ரவேல் பெருகி அடைந்திருந்த முந்தைய நிலையை, வெறுமனே ‘இருந்தீர்கள்’ என்பதைக் காட்டிலும் துல்லியமாகக் குறிக்கிறது.
- source_word: כְּכוֹכְבֵי הַשָּׁמַיִם לָרֹב
  choice: வானத்தின் விண்மீன்களைப்போல் எண்ணற்றவர்களாக
  rationale: விண்மீன் ஒப்புமையையும் மிகுதியான எண்ணிக்கை என்ற לָרֹב-இன் வலியுறுத்தலையும் இயல்பான தமிழில் ஒருங்கிணைக்கிறது.
- source_word: כִּי לֹא שָׁמַעְתָּ בְּקוֹל
  choice: ஏனெனில் ... குரலுக்கு நீங்கள் செவிகொடுக்கவில்லை
  rationale: ‘குரலுக்குச் செவிகொடுத்தல்’ என்ற உடன்படிக்கைச் சொல்லாட்சியைப் பாதுகாத்து, கேட்டல் மட்டுமல்ல கீழ்ப்படிதலும் உட்பொருளாக இருக்க இடமளிக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: திருநான்கெழுத்துப் பெயரை ஒரு பட்டப்பெயரால் மாற்றாமல், எபிரெய இறைப்பெயரின் வழக்கமான தமிழ் ஒலிபெயர்ப்பாகத் தருகிறது.
- source_word: אֱלֹהֶיךָ
  choice: உங்கள் கடவுளாகிய
  rationale: கூட்டாகிய இஸ்ரவேலை நோக்கிய இரண்டாம் நபர் ஒருமை எபிரெய வடிவத்தைத் தமிழின் மரியாதை/கூட்டுப் பயன்பாட்டில் இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலத்தில் தனிப்பட்ட உடன்படிக்கைப் பெயர் நேரடியாக உள்ளது; அதை ஒரு பட்டப்பெயராக மாற்றாமல் ஒலிபெயர்ப்பது மூலச் சான்றுக்கு நெருக்கமானது.
- issue: பன்மை முகவரியிலிருந்து שָׁמַעְתָּ என்ற ஒருமைக்கு ஏற்படும் மாற்றம்
  choice: தமிழில் ‘நீங்கள்’ என்பதையே வைத்துக் கூட்டாகிய இஸ்ரவேலை நோக்கிய முகவரியாக மொழிபெயர்த்தல்
  alternative: எண்ணிக்கை மாற்றத்தை அடிக்குறிப்பில் தனியே சுட்டுதல்
  rationale: தமிழில் ‘நீங்கள்’ ஒருவருக்கான மரியாதை வடிவமாகவும் பலருக்கான வடிவமாகவும் இருப்பதால் எபிரெயத்தின் கூட்டொருமைப் பொருளை இயல்பாகத் தாங்குகிறது; செயற்கையான எண்ணிக்கை மாற்றம் தேவையில்லை.
- issue: שׁמע בְּקוֹל என்பதிலுள்ள கேட்டல்–கீழ்ப்படிதல் பொருள்
  choice: குரலுக்கு செவிகொடுக்கவில்லை
  alternative: கீழ்ப்படியவில்லை
  rationale: மூலத்தின் ‘குரல்’ உருவகத்தைப் பாதுகாக்கிறது; அதே நேரத்தில் உடன்படிக்கைச் சூழலில் கீழ்ப்படியாமை என்ற உட்பொருளையும் மறைக்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் வேதாகமத்துக்குரிய கண்ணியமான நடையிலும் வடிவமைக்கப்பட்டது. ‘வானத்தின் விண்மீன்கள்’, ‘குரலுக்கு செவிகொடுத்தல்’ ஆகிய மூல உருவகங்கள் பாதுகாக்கப்பட்டன; தேவையற்ற ஆண்பால் வரையறை தவிர்க்கப்பட்டது.
