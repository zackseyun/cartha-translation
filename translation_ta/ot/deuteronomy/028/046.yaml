source:
  edition: WLC
  text: וְ/הָי֣וּ בְ/ךָ֔ לְ/א֖וֹת וּ/לְ/מוֹפֵ֑ת וּֽ/בְ/זַרְעֲ/ךָ֖ עַד עוֹלָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/046.yaml
  text: And they will be on you and on your offspring as a sign and a wonder forever[a][b].
translation:
  language: ta
  text: அவை உன்மேலும் உன் சந்ததியின்மேலும் அடையாளமாகவும் அதிசயமாகவும் என்றென்றும் இருக்கும்.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உன் வழித்தோன்றல்களின்மேலும்”; “விதை” என்பதற்கான எபிரெயச் சொல் ஒருவரின் சந்ததியையோ பின்வரும் தலைமுறையினரையோ மொத்தமாகக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “அவை” என்பது சுற்றியுள்ள வசனங்களில் விவரிக்கப்பட்ட சாபங்களைக் குறிக்கிறது.
    reason: cross_reference
lexical_decisions:
- source_word: וְהָיוּ
  choice: அவை ... இருக்கும்
  rationale: இணைப்புடன் வந்த நிறைவுவினை, முந்தைய சாபங்களின் எதிர்கால விளைவைத் தொடர்கிறது. தமிழில் பன்மைச் சுட்டுப்பெயருடன் எதிர்கால வினை இயல்பாக உள்ளது.
- source_word: בְּךָ
  choice: உன்மேல்
  rationale: முந்தைய சாபங்கள் ஒருவர்மேல் வந்து நிலைப்பதைக் குறிக்கும் எபிரெய முன்னிடைச்சொல்லின் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: לְאוֹת
  choice: அடையாளமாக
  rationale: אוֹת என்பது அடையாளம் அல்லது குறியைக் குறிக்கிறது; இங்கு சாபங்களின் சான்றுறுத்தும் தன்மையை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וּלְמוֹפֵת
  choice: அதிசயமாகவும்
  rationale: מוֹפֵת என்பதற்கு அதிசயம், வியப்புக்குரிய நிகழ்வு, முன்னறிகுறி ஆகிய பொருள்கள் இருக்கலாம். ‘அதிசயம்’ என்பது ‘அடையாளம்’ என்பதுடன் இணையும் வழக்கமான, எளிதில் புரியும் தேர்வு; அச்சுறுத்தும் முன்னறிகுறி என்ற பொருளைத் தேவையின்றி திணிக்கவில்லை.
- source_word: וּבְזַרְעֲךָ
  choice: உன் சந்ததியின்மேலும்
  rationale: זֶרַע இங்கு ஒருவரின் பின்வரும் தலைமுறையினரை மொத்தமாகக் குறிக்கிறது. ‘சந்ததி’ கூட்டு ஒருமைப் பொருளையும் இயல்பான மரியாதைமிக்க நடையையும் காக்கிறது; திரும்ப வரும் முன்னிடைச்சொல் ‘மேலும்’ எனத் தெளிவாக மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: עַד עוֹלָם
  choice: என்றென்றும்
  rationale: நீடித்த காலத்தைக் குறிக்கும் எபிரெய சொற்றொடருக்கு இயல்பான தமிழ் இணை. இது வசனம் கூறுவதைக் கடந்து தத்துவார்த்த முடிவைச் சேர்க்காது.
theological_decisions:
- issue: ‘அவை’ என்பதன் சுட்டுப்பொருள்
  choice: முந்தைய சூழலில் விவரிக்கப்பட்ட சாபங்கள் அல்லது நியாயத்தீர்ப்புகளைச் சுட்டுகிறது; ஆயினும் மூலத்தைப் போலவே பிரதிப்பெயர் முதன்மை உரையில் வைக்கப்பட்டுள்ளது.
  alternative: ‘இந்தச் சாபங்கள்’ என்று வெளிப்படையாக மொழிபெயர்த்தல்; அல்லது உடன்படிக்கையின் தண்டனைகள் அனைத்தையும் பொதுவாகக் குறிப்பதாக எடுத்தல்.
  rationale: இந்த வசனத்தில் எழுவாய் பெயர்ச்சொல் வெளிப்படையாக இல்லை. உடனடிச் சூழல் சாபங்களைப் பட்டியலிடுவதால் சுட்டுப்பொருள் தெளிவாக இருந்தாலும், அதை முதன்மை உரையில் விரித்து எழுதுவது மூலத்தைவிட அதிகமாக விளக்கிவிடும்.
- issue: עַד עוֹלָם என்பதன் கால வலிமை
  choice: ‘என்றென்றும்’ என்று மொழிபெயர்த்து, அதன் கால அளவைக் குறித்து மேலதிகத் தத்துவ விளக்கம் சேர்க்கப்படவில்லை.
  alternative: ‘எல்லாக் காலமும்’, ‘தலைமுறைதோறும்’, அல்லது ‘நிரந்தரமாக’.
  rationale: உடன்படிக்கைச் சூழலில் இச்சொற்றொடர் தொடர்ந்த நீடிப்பைக் குறிக்கிறது. வழக்கமான இணைச்சொல் காக்கப்படுகிறது; அது அவசியம் தத்துவார்த்தமான முடிவில்லாத காலத்தையே குறிக்கும் என்று உரை தீர்மானிக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிமையும் கண்ணியமும் கொண்ட நடை பயன்படுத்தப்பட்டுள்ளது. ‘அடையாளம்—அதிசயம்’ என்ற இணை பாதுகாக்கப்பட்டுள்ளது. எபிரெயத்தின் தெளிவற்ற பன்மை எழுவாய் ‘அவை’ என்று முதன்மை உரையில் காக்கப்பட்டு, அதன் சூழல்சார் சுட்டுப்பொருள் அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது.
