base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/002.yaml
  text: And all these blessings will come upon you and overtake you[a], if you obey the voice of Yahweh your God.
translation:
  language: ta
  text: இந்த ஆசீர்வாதங்கள் அனைத்தும் உன்மேல் வந்து உன்னை எட்டிப்பிடிக்கும்; உன் கடவுளாகிய யாவேவின் குரலுக்கு நீ செவிகொடுத்தால்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “உன் கடவுளாகிய யாவேவின் குரலுக்கு நீ கீழ்ப்படிந்தால்” என்றும் மொழிபெயர்க்கலாம். “குரலுக்குச் செவிகொடுத்தல்” என்ற எபிரெய மொழிவழக்கு, கேட்டதற்கு இணங்கிக் கீழ்ப்படிவதையும் பொதுவாகக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָאוּ עָלֶיךָ
  choice: உன்மேல் வந்து
  rationale: בוא (‘வருதல்’) மற்றும் עַל (‘மேல்’) ஆகியவற்றின் இயக்கத்தையும் நேரடியான படிமத்தையும் இயல்பான தமிழில் காக்கிறது.
- source_word: כָּל הַבְּרָכוֹת הָאֵלֶּה
  choice: இந்த ஆசீர்வாதங்கள் அனைத்தும்
  rationale: குறிப்புச் சுட்டையும் முழுமையைக் குறிக்கும் כָּל என்பதையும் தெளிவாக வெளிப்படுத்துகிறது; ‘ஆசீர்வாதங்கள்’ உடன்படிக்கைச் சூழலுக்கு ஏற்ற பரவலாகப் புரியும் சொல்.
- source_word: וְהִשִּׂיגֻךָ
  choice: உன்னை எட்டிப்பிடிக்கும்
  rationale: נשׂג என்பதன் ‘பின்தொடர்ந்து வந்து எட்டுதல்/முந்திப் பிடித்தல்’ என்ற உயிரோட்டமான படிமத்தை இயல்பான தமிழில் தருகிறது.
- source_word: כִּי
  choice: -ஆல் (செவிகொடுத்தால்)
  rationale: இச்சூழலில் ஆசீர்வாதத்திற்கான நிபந்தனையைத் தமிழின் நிபந்தனை விகுதி தெளிவாக வெளிப்படுத்துகிறது.
- source_word: תִשְׁמַע בְּקוֹל
  choice: குரலுக்கு நீ செவிகொடுத்தால்
  rationale: ‘குரலைக் கேட்பது’ என்ற எபிரெய மொழிவழக்கின் வடிவத்தையும், அதில் அடங்கிய கவனித்து இணங்கும் கருத்தையும் காக்கிறது; வெறும் ஒலி கேட்டலை மட்டும் குறிக்காதவாறு ‘செவிகொடு’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், எபிரெய நான்கெழுத்துப் பெயரின் ஏற்ற தமிழாக்க ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: אֱלֹהֶיךָ
  choice: உன் கடவுள்
  rationale: இரண்டாம் நபர் ஒருமை உடைமைப் பின்னொட்டை நேரடியாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலத்தில் தனிப்பட்ட உடன்படிக்கைப் பெயர் நேரடியாக இருப்பதால், அதை ஒரு பட்டமாக மாற்றாமல் ஒலிபெயர்ப்பது தேர்ந்தெடுக்கப்பட்டது.
- issue: שׁמע בְּקוֹל என்பதன் பொருள் வலிமை
  choice: குரலுக்கு நீ செவிகொடுத்தால்
  alternative: குரலுக்கு நீ கீழ்ப்படிந்தால்
  rationale: எபிரெய மொழிவழக்கில் கேட்டலும் அதற்கேற்ற கீழ்ப்படிதலும் இணைந்துள்ளன. முதன்மை உரை அந்த உருவகத்தையும் பொருள் நெருக்கடியையும் காக்கிறது; கீழ்ப்படிதல் என்ற வெளிப்படையான மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- issue: כִּי என்பதன் தொடர்பு
  choice: நிபந்தனை — ‘செவிகொடுத்தால்’
  alternative: காரணம் — ‘செவிகொடுப்பதால்’
  rationale: முந்தைய வசனத்திலிருந்து தொடரும் உடன்படிக்கை ஆசீர்வாதச் சூழலில் இது நிபந்தனையை அறிமுகப்படுத்துவதாகப் புரிந்துகொள்ளப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், மரியாதையும் உடன்படிக்கை உரையின் உயர்ந்த தொனியும் காக்கப்பட்டுள்ளன. ஒருமை முன்னிலை உருபான ‘உன்/நீ/உன்னை’ தொடர்ந்து பயன்படுத்தப்பட்டுள்ளது. ‘எட்டிப்பிடிக்கும்’ என்பது ஆசீர்வாதங்கள் பின்தொடர்ந்து வந்து சேரும் மூலப் படிமத்தைத் தெளிவாகவும் உயிரோட்டமாகவும் வழங்குகிறது.
