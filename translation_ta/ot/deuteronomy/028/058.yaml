  language: en
  yaml_path: translation/ot/deuteronomy/028/058.yaml
  text: If you are not careful to do all the words of this law that are written in this book[c][b][a], to fear this glorious and awesome name—Yahweh your God—
translation:
  language: ta
  text: இந்தப் புத்தகத்தில்[a] எழுதப்பட்டுள்ள இந்தச் சட்டத்தின் எல்லா வார்த்தைகளையும் கடைப்பிடிக்கவும், மகிமைமிக்கதும் அச்சத்திற்குரியதுமான இந்தப் பெயருக்கு—உன் கடவுளாகிய யாவேக்கு[c]—பயப்படவும்[b] நீ கவனமாயிருக்காவிட்டால்,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘புத்தகம்’ என்பதற்குப் பதிலாக ‘சுருள்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘பயப்படவும்’ என்பது இங்கு பயபக்தியுடன் மதிப்பதையும் அச்சப்படுவதையும் உள்ளடக்குகிறது.
    reason: lexical_alternative
  - marker: c
    text: எபிரெயத்தில் ‘YHWH’; இது மரபாக ‘கர்த்தர்’ என்று மொழிபெயர்க்கப்படுகிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: תִשְׁמֹר לַעֲשׂוֹת
  choice: கவனமாகக் கடைப்பிடித்து
  rationale: שׁמר + עשׂה என்ற உடன்படிக்கைச் சொற்றொடர் கவனத்துடன் காத்து நடைமுறைப்படுத்துவதைக் குறிக்கிறது; இயல்பான தமிழில் இரு கூறுகளையும் இது எடுத்துரைக்கிறது.
- source_word: כָּל דִּבְרֵי הַתּוֹרָה הַזֹּאת
  choice: இந்தச் சட்டத்தின் வார்த்தைகள் அனைத்தையும்
  rationale: דִּבְרֵי என்பதன் 'வார்த்தைகள்' என்ற வடிவத்தையும், உபாகமத்தின் உடன்படிக்கைச் சட்டச் சூழலில் תּוֹרָה என்பதன் சட்டப் பொருளையும் காக்கிறது.
- source_word: הַכְּתוּבִים בַּסֵּפֶר הַזֶּה
  choice: இந்தப் புத்தகத்தில் எழுதப்பட்டுள்ள
  rationale: எழுத்தில் பதிவான உடன்படிக்கை உரையை நேரடியாகத் தெரிவிக்கிறது; סֵפֶר என்பதற்கு இங்கு இயல்பான நவீனத் தமிழ் 'புத்தகம்'.
- source_word: לְיִרְאָה
  choice: பயப்பட
  rationale: இறைபக்தியையும் அச்சத்தையும் உள்ளடக்கும் ירא என்பதன் வலிமையையும், நோக்கம்/விளைவு சார்ந்த infinitive அமைப்பையும் காக்கிறது.
- source_word: הַשֵּׁם
  choice: இந்தப் பெயருக்கு
  rationale: கடவுளின் வெளிப்படுத்தப்பட்ட அடையாளத்தைக் குறிக்கும் 'பெயர்' என்ற எபிரெய உருவகத்தை மாற்றாமல் காக்கிறது.
- source_word: הַנִּכְבָּד וְהַנּוֹרָא
  choice: மகிமையும் அச்சத்திற்குரியதுமான
  rationale: נכבד-இன் மகிமை/கனம் மற்றும் נורא-வின் அச்சமூட்டும் மேன்மை ஆகிய இரண்டையும் இயல்பான, கண்ணியமான தமிழில் தருகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: திருநான்கெழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் பரவலாகப் புரியக்கூடிய ஒலிபெயர்ப்பாகத் தருகிறது.
- source_word: אֱלֹהֶיךָ
  choice: உன் கடவுளாகிய
  rationale: இரண்டாம் நபர் ஒருமை உரிமை விகுதியையும் உடன்படிக்கை உறவையும் நேரடியாகக் காக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூல உரை பட்டத்தை அல்ல, இறைவனின் தனிப்பெயரையே பயன்படுத்துகிறது; ஆகவே அதை ஒலிபெயர்த்து தனிப்பெயராகக் காக்கிறது.
- issue: ירא என்பதைக் ‘மதித்தல்’ என மென்மைப்படுத்தலாமா
  choice: பயப்பட
  alternative: பயபக்தியுடன் மதிக்க
  rationale: இச்சொல் பயபக்தி மற்றும் அச்சம் இரண்டையும் தாங்குகிறது. ‘பயப்பட’ என்பது உரையின் இறையியல் அழுத்தத்தையும் பதற்றத்தையும் மென்மைப்படுத்தாமல் காக்கிறது.
- issue: வசனத்தின் முடிவிலுள்ள நிபந்தனைத் தொடர்ச்சி
  choice: முடிவில் காற்புள்ளி வைத்து அடுத்த வசனத்திற்குத் தொடரும் அமைப்பு
  alternative: முழுமையான தனி வாக்கியமாக முடித்தல்
  rationale: எபிரெய உரையில் இது ‘என்றால்’ என்ற நிபந்தனையின் முன்னுரையாக இருந்து, அதன் விளைவு அடுத்த வசனத்தில் தொடர்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்கள் புரிந்துகொள்ளும் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. மூலத்தின் நிபந்தனை அமைப்பும் அடுத்த வசனத்திற்கான தொடர்ச்சியும் காக்கப்பட்டுள்ளன; ‘பயம்/பயபக்தி’ என்ற உண்மையான பொருள் நெருக்கடி அடிக்குறிப்பில் தெளிவாக்கப்பட்டுள்ளது.
