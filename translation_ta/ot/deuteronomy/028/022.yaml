base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/022.yaml
  text: Yahweh will strike you with wasting disease[a], with fever, with inflammation, with burning heat, with the sword, with blight, and with mildew[b]; and they will pursue you until you perish.
translation:
  language: ta
  text: யாவே உடலை மெலியச் செய்யும் நோயாலும்[a], காய்ச்சலாலும், அழற்சியாலும், கொளுத்தும் வெப்பத்தாலும், வாளாலும், பயிர்க் கருகலாலும், பூஞ்சணத்தாலும் உன்னைத் தாக்குவார்; நீ அழிந்துபோகும்வரை அவை[b] உன்னைத் துரத்தும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘உடலை மெலியச் செய்யும் நோய்’ என்பதற்கு ‘தேய்வு நோய்’ என்றும் மொழிபெயர்க்கலாம்; எபிரெயச் சொல் உடலை வலுவிழக்கச் செய்யும் கடுமையான நோயைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில் ‘துரத்தும்’ என்ற வினை பன்மையில் உள்ளது; அது முன்பு பட்டியலிடப்பட்ட துன்பங்களைக் குறிக்கிறது.
    reason: grammatical_clarification
lexical_decisions:
- source_word: יַכְּכָה
  choice: உன்னைத் தாக்குவார்
  rationale: נכה என்பதன் ஹிஃபில் வடிவம் நேரடியாக ‘தாக்குதல்’ என்ற தண்டனைச் செயலைக் குறிக்கிறது; நவீன தமிழில் இயல்பாகவும் வலிமையாகவும் உள்ளது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைத் திருப்பெயரான நான்கெழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் வழக்கமான ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: שַׁחֶפֶת
  choice: உடலை மெலியச் செய்யும் நோய்
  rationale: உடலைத் தேய்த்து வலுவிழக்கச் செய்யும் நோயைக் குறிக்கிறது; குறிப்பிட்ட நவீன மருத்துவ நோயாக அளவுக்கு மீறித் துல்லியப்படுத்தாமல் பொருளைத் தெளிவாக்குகிறது.
- source_word: קַּדַּחַת
  choice: காய்ச்சல்
  rationale: காய்ச்சல் நோயைக் குறிக்கும் சொல்லுக்கு இயல்பான நவீனத் தமிழ் இணை.
- source_word: דַּלֶּקֶת
  choice: அழற்சி
  rationale: எரிச்சல் அல்லது அழற்சி சார்ந்த நோய்நிலையை அடுத்துள்ள வெப்பச் சொற்களிலிருந்து வேறுபடுத்திக் காட்டுகிறது.
- source_word: חַרְחֻר
  choice: கொளுத்தும் வெப்பம்
  rationale: அரிதான இச்சொல்லின் எரிக்கும் அல்லது சுட்டெரிக்கும் வெப்பப் பொருளைப் பாதுகாக்கிறது.
- source_word: חֶרֶב
  choice: வாள்
  rationale: அடிப்படைப் பொருளான ‘வாள்’ என்பதைக் காத்து, போர் அல்லது வன்முறை மரணம் என்ற விரிவான உட்பொருளை வாசகர் உணர இடமளிக்கிறது.
- source_word: שִׁדָּפוֹן
  choice: பயிர்க்கருகல் நோய்
  rationale: வெப்பம் அல்லது வறட்சியால் பயிர் கருகி அழியும் வேளாண் பேரிடரைத் தெளிவாகக் குறிக்கிறது.
- source_word: יֵרָקוֹן
  choice: பூஞ்சண நோய்
  rationale: பயிர்களின் நிறமாற்றத்தையும் சிதைவையும் உண்டாக்கும் வேளாண் நோயைச் சூழலுக்கேற்ற பொதுவான சொல்லால் வழங்குகிறது; ‘மஞ்சளாதல்’ என்பதும் சாத்தியம்.
- source_word: וּרְדָפוּךָ
  choice: அவை உன்னைத் துரத்தும்
  rationale: எபிரெய வினை பன்மையில் இருப்பதைப் பாதுகாத்து, முன் பட்டியலிடப்பட்ட நோய்களும் பேரிடர்களும் அதன் எழுவாய் என்பதை வெளிப்படுத்துகிறது.
- source_word: עַד אָבְדֶךָ
  choice: நீ அழிந்துபோகும்வரை
  rationale: אבד என்பதன் அழிவு அல்லது முற்றான நாசம் என்ற வலிமையையும் இரண்டாம் நபர் ஒருமை நேரடி அழைப்பையும் காக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைத் திருப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூலத்தில் தனிப்பட்ட உடன்படிக்கைப் பெயர் நேரடியாக இருப்பதால், அதை ஒரு பொதுப் பட்டமாக மாற்றாமல் ஒலிபெயர்க்கிறது.
- issue: துரத்தும் செயலின் எழுவாய்
  choice: முன் சொல்லப்பட்ட துன்பங்கள் அனைத்தையும் குறிக்கும் பன்மை ‘அவை’
  alternative: ஒருமை எழுவாயாக இறைவனின் தண்டனை
  rationale: וּרְדָפוּךָ என்ற வினை பன்மையில் உள்ளது; ஆகவே மூலத்தின் இலக்கணத்தையும் துன்பங்கள் மனிதரைத் தொடர்ந்து வருவது போன்ற உருவகத் தீவிரத்தையும் காக்கிறது.
translation_notes:
  register: நவீன தரநிலைத் தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. ஏழு துன்பங்களின் பட்டியல் இணையான ‘-ஆலும்’ அமைப்பில் வைக்கப்பட்டு மூலத்தின் திரட்டிய தாக்கம் காக்கப்பட்டுள்ளது; மருத்துவ மற்றும் வேளாண் சொற்களில் தேவையற்ற நவீனத் துல்லியம் தவிர்க்கப்பட்டுள்ளது.
