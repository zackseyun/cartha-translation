base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/044.yaml
  text: He will lend to you[a], but you will not lend to him; he will be the head[b], and you will be the tail.
translation:
  language: ta
  text: அவன்[a] உனக்குக் கடன் கொடுப்பான்; ஆனால் நீ அவனுக்குக் கடன் கொடுக்கமாட்டாய். அவன் தலையாக இருப்பான்; நீ வாலாக இருப்பாய்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அதாவது, முந்தைய வசனத்தில் குறிப்பிடப்பட்ட அந்நியன்.
    reason: cross_reference
lexical_decisions:
- source_word: יַלְוְךָ / תַלְוֶנּוּ (לוה, Hiphil)
  choice: உனக்குக் கடன் கொடுப்பான் / அவனுக்குக் கடன் கொடுக்கமாட்டாய்
  rationale: இச்சூழலில் Hiphil வடிவம் ‘கடன் கொடு’ என்பதைக் குறிக்கிறது. இரு இணை வாக்கியங்களிலும் அதே சொல்லாட்சியைப் பேணுவது, கடன் கொடுப்பவர்–கடன் பெறுபவர் என்ற பொருளாதார சார்புநிலையின் தலைகீழ் மாற்றத்தைத் தெளிவாக்குகிறது.
- source_word: הוּא
  choice: அவன்
  rationale: இந்த ஆண்பால் ஒருமைச் சுட்டுப்பெயர் முந்தைய வசனத்தில் குறிப்பிடப்பட்ட அந்நியனைச் சுட்டுகிறது; எபிரெய மூலத்தின் ஒருமை வடிவம் பேணப்படுகிறது.
- source_word: לְרֹאשׁ
  choice: தலையாக
  rationale: மேலாதிக்கம் அல்லது உயர்நிலையைக் குறிக்கும் எபிரெய உருவகத்தை நேரடியாகவும் இயல்பாகவும் பேணுகிறது.
- source_word: לְזָנָב
  choice: வாலாக
  rationale: ‘தலை’ என்பதற்கு எதிரான தாழ்நிலை உருவகத்தை அப்படியே பேணி, வசனத்தின் கூர்மையான முரண்பாட்டை வெளிப்படுத்துகிறது.
- source_word: יִהְיֶה / תִּהְיֶה
  choice: இருப்பான் / இருப்பாய்
  rationale: உடன்படிக்கைச் சாபத்தால் விளையும் வருங்கால நிலையை, தேவையற்ற விளக்கத்தைச் சேர்க்காமல் இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: וְאַתָּה
  choice: ஆனால் நீ / நீ
  rationale: முதல் இடத்தில் எதிர்மறை வேறுபாட்டை ‘ஆனால்’ தெளிவாக்குகிறது; இரண்டாம் இடத்தில் தமிழின் இயல்பான இணை அமைப்பு போதுமான முரண்பாட்டைத் தருகிறது.
theological_decisions:
- issue: பாலினத்தைக் காட்டும் ஒருமைச் சுட்டல்
  choice: ‘அவன்’, ‘நீ’ என்ற ஒருமை வடிவங்களைப் பயன்படுத்துதல்
  alternative: ‘அவர்கள்’ என்ற பன்மையைப் பயன்படுத்துதல் அல்லது முதன்மை உரையிலேயே ‘அந்நியன்’ என்று மீண்டும் கூறுதல்
  rationale: எபிரெய உரை இலக்கண ரீதியாக ஆண்பால் ஒருமையில் இருந்து, முந்தைய வசனத்தின் அந்நியனைப் பிரதிநிதித்துவ ஒருமையாகச் சுட்டுகிறது. அதனைப் பன்மையாக்காமல் மூலத்தின் வடிவத்தையும் பதற்றத்தையும் பேணுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘கடன் கொடு’ என்பது பொருளாதார உறவைத் தெளிவாகச் சொல்கிறது; ‘தலை/வால்’ உருவகம் விளக்கமாக மாற்றப்படாமல் பேணப்பட்டுள்ளது. ஆங்கில ஆலோசனை உரையின் b அடிக்குறிப்பு அதன் குறியிடப்பட்ட இடத்துடனும் உள்ளடக்கத்துடனும் ஒத்துப்போகவில்லை; எபிரெய மூலத்தில் தேவையான தனி மாற்றுப் பொருள் இல்லாததால் அது சேர்க்கப்படவில்லை.
