base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/026.yaml
  text: Your carcass will become food for every bird of the sky and for the beasts of the earth[c][b][a], and there will be no one to frighten them away.
translation:
  language: ta
  text: உன் பிணம்[a] வானத்துப் பறவைகள் அனைத்துக்கும் பூமியின் விலங்குகளுக்கும்[b] உணவாகும்; அவற்றை விரட்ட யாரும் இருக்கமாட்டார்கள்.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘உன் சடலம்’ அல்லது ‘உன் இறந்த உடல்’ என்றும் மொழிபெயர்க்கலாம். இங்கு வரும் எபிரெயச் சொல், இந்த நியாயத்தீர்ப்புச் சூழலில் இழிவான உணர்வையும் கொண்டுள்ளது.
    reason: lexical_alternative
  - marker: b
    text: சொல்லுக்குச் சொல் முறையில், ‘வானத்தின் பறவை’ என்றும் ‘பூமியின் விலங்குகள்’ என்றும் உள்ளது. வானம்–பூமி என்ற இந்த இணைப்பு, உடல் முற்றிலும் பாதுகாப்பின்றி விடப்படுவதையும் அதனால் வரும் அவமானத்தையும் வலியுறுத்துகிறது.
    reason: cultural_note
  - marker: c
    text: அதாவது, பிணத்தைத் தின்னும் பறவைகளையும் விலங்குகளையும் அச்சுறுத்தி விரட்ட யாரும் இருக்கமாட்டார்கள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיְתָה
  choice: உணவாகும்
  rationale: சாபங்களின் தொடரில் இது வருங்கால விளைவைக் குறிக்கிறது. தமிழில் ‘உணவாகும்’ என்பது לְמַאֲכָל உடனான விளைவுநிலையை இயல்பாகத் தெரிவிக்கிறது.
- source_word: נִבְלָתְךָ
  choice: உன் பிணம்
  rationale: நְבֵלָה என்பது இறந்த உடலைக் குறிக்கிறது; இந்த நியாயத்தீர்ப்புச் சூழலில் உள்ள இழிவையும் கொடுமையையும் ‘பிணம்’ நேரடியாகத் தக்கவைக்கிறது.
- source_word: לְמַאֲכָל
  choice: உணவாகும்
  rationale: இச்சொல் உணவு அல்லது உண்ணப்படும் ஒன்றைக் குறிக்கிறது. தமிழில் ‘உணவாகும்’ என்பது விளைவைத் தெளிவாகவும் இயல்பாகவும் காட்டுகிறது.
- source_word: לְכָל עוֹף הַשָּׁמַיִם
  choice: வானத்துப் பறவைகள் அனைத்துக்கும்
  rationale: עוֹף என்பது கூட்டுப்பொருளில் பறக்கும் உயிரினங்களைக் குறிக்கலாம்; இங்கு ‘பறவைகள்’ இயல்பான பொருத்தம். ‘வானத்து’ என்பது שָּׁמַיִם தரும் காட்சியை நவீன தமிழில் தெளிவாகப் பாதுகாக்கிறது.
- source_word: וּלְבֶהֱמַת הָאָרֶץ
  choice: பூமியின் விலங்குகளுக்கும்
  rationale: בְּהֵמָה இங்கு நிலவாழ் விலங்குகளை கூட்டுப்பொருளில் குறிக்கிறது. ‘பூமியின் விலங்குகள்’ என்பது வானம்–பூமி இணைப்பைப் பாதுகாக்கிறது; மூலத்தில் இல்லாத ‘காட்டு’ என்ற வரையறையைச் சேர்ப்பதையும் தவிர்க்கிறது.
- source_word: וְאֵין מַחֲרִיד
  choice: அவற்றை அங்கிருந்து விரட்ட யாரும் இருக்கமாட்டார்கள்
  rationale: חרד என்பதன் ஹிஃபில் வடிவம் அச்சுறுத்தி அகற்றுவதை இச்சூழலில் குறிக்கிறது. எபிரெயத்தில் மறைமுகமாக உள்ள பறவைகளையும் விலங்குகளையும் ‘அவற்றை’ என்று வெளிப்படுத்துவது தமிழில் பொருளைத் தெளிவாக்குகிறது.
