translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும், சாபத்தின் கடுமையையும் அவமானத்தையும் மங்கச் செய்யாமலும் வடிவமைக்கப்பட்டது. ‘பிணம்’ நேரடியானதும் கடுமையானதும்; ‘சடலம்’ என்பதைக் காட்டிலும் சாதாரண வாசகருக்கு உடனடியாகப் புரியும். வாக்கியத்தின் இரு பகுதிகளையும் அரைப்புள்ளி இணைத்து, விளைவும் பாதுகாப்பின்மையும் தெளிவாகக் காட்டப்பட்டுள்ளன.
