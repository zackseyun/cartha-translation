base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/011.yaml
  text: And Yahweh will make you abound in prosperity[a], in the fruit of your womb, in the fruit of your livestock, and in the fruit of your ground[c][b], on the land that Yahweh swore to your fathers to give you.
translation:
  language: ta
  text: 'உங்கள் மூதாதையரிடம் உங்களுக்குக் கொடுப்பதாக யாவே சத்தியம் செய்து வாக்களித்த தேசத்தில், யாவே உங்களுக்கு நன்மையாக மிகுதியை அளிப்பார்: உங்கள் கருப்பையின் கனியிலும்[b], உங்கள் கால்நடைகளின் குட்டிகளிலும், உங்கள் நிலத்தின் விளைச்சலிலும்[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: “கருப்பையின் கனி” என்பது பிள்ளைகள் அல்லது சந்ததியைக் குறிக்கும் எபிரெய மரபுத்தொடர்.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, “உங்கள் மண்ணின் பலன்” அல்லது “உங்கள் நிலத்தின் மகசூல்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוֹתִרְךָ
  choice: உங்களுக்கு ... பெருகச் செய்வார்
  rationale: יתר என்பதன் ஹிஃபில் வடிவம், ஒருவருக்கு மிகுதியையோ உபரியையோ உண்டாக்கும் காரணவினைப் பொருளைக் கொண்டது. தமிழில் ‘பெருகச் செய்வார்’ என்பது அந்தக் காரணவினைத் தன்மையையும் ஆசீர்வாதத்தின் அதிகரிப்பையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: לְטוֹבָה
  choice: நன்மை
  rationale: சொல்லுக்குச் சொல் பொருள் ‘நன்மைக்காக’ என்பதாகும். இங்கு வளம், நலன், பலன் ஆகியவற்றை உள்ளடக்கிய ஆசீர்வாதச் சூழலில் ‘நன்மை’ என்பது எபிரெயச் சொல்லின் விரிவைத் தேவையின்றிக் குறுக்காமல் காக்கிறது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: திருநாமத்தை ஒரு பட்டப்பெயரால் மாற்றாமல் தமிழில் நிலைபெற்ற நேரடி பெயர்வடிவமான ‘யெகோவா’ என்று வழங்குவது, மூலத்தில் உள்ள தனிப்பட்ட உடன்படிக்கைப் பெயரைப் பாதுகாக்கிறது.
- source_word: בִּפְרִי בִטְנְךָ
  choice: உங்கள் கருப்பையின் கனி
  rationale: மக்கள் அல்லது சந்ததியைக் குறிக்கும் எபிரெய மரபுத்தொடரைத் தக்கவைத்து, வசனத்திலுள்ள ‘கனி’ என்ற மும்முறை அமைப்பை இயன்றவரை பாதுகாக்கிறது.
- source_word: וּבִפְרִי בְהַמְתְּךָ
  choice: உங்கள் கால்நடைகளின் குட்டிகள்
  rationale: விலங்குகளுக்கான ‘கனி’ என்பது தமிழில் செயற்கையாக ஒலிக்கக்கூடும்; ‘குட்டிகள்’ அதன் இயல்பான பொருளான கால்நடை இனப்பெருக்கத்தைத் தெளிவாகச் சொல்கிறது.
- source_word: וּבִפְרִי אַדְמָתֶךָ
  choice: உங்கள் நிலத்தின் விளைச்சல்
  rationale: אֲדָמָה இங்கு பயிரிடப்படும் மண் அல்லது நிலத்தைக் குறிக்கிறது. ‘நிலத்தின் விளைச்சல்’ என்பது வேளாண் பொருளை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: עַל הָאֲדָמָה
  choice: தேசத்தில்
  rationale: இங்கு அதே சொல் வாக்குத்தத்தம் செய்யப்பட்ட பிரதேசத்தைக் குறிக்கிறது; ஆகவே பயிர்நிலத்திலிருந்து வேறுபடுத்த ‘தேசத்தில்’ என வழங்கப்பட்டுள்ளது.
- source_word: אֲשֶׁר נִשְׁבַּע יְהוָה לַאֲבֹתֶיךָ לָתֶת לָךְ
  choice: யெகோவா உங்கள் மூதாதையருக்கு ஆணையிட்டு உங்களுக்குக் கொடுப்பதாகச் சொன்ன
  rationale: தேசத்தை மாற்றிச் சொல்லும் உறவுத்தொடரையும், மூதாதையரிடம் செய்யப்பட்ட ஆணையையும், தற்போதைய மக்களுக்கான கொடையையும் தெளிவாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற உடன்படிக்கைப் பெயரின் மொழிபெயர்ப்பு
  choice: யெகோவா
  alternative: கர்த்தர்; யாவே
  rationale: மூலத்தில் பட்டப்பெயர் அல்லாமல் திருநாமமே இருப்பதால் அதை மறைக்காமல் பெயராக வழங்கப்பட்டுள்ளது. ‘யெகோவா’ என்பது நவீன தமிழ் வேதாகமப் பயன்பாட்டில் பரவலாக அறியப்படும் வடிவம்; இது குறிப்பிட்ட பிரிவுசார் விளக்கத்தை வசனத்துக்குள் சேர்ப்பதில்லை.
- issue: ‘கருப்பையின் கனி’ என்பதை ‘பிள்ளைகள்’ என்று விளக்கமாக மாற்றலாமா
  choice: மரபுத்தொடரைத் தக்கவைத்து ‘உங்கள் கருப்பையின் கனி’
  alternative: உங்கள் பிள்ளைகள்; உங்கள் சந்ததி
  rationale: மூலத்தின் உருவகத்தையும் மனிதர், கால்நடை, நிலம் ஆகிய மூன்று துறைகளையும் இணைக்கும் ‘கனி’ அமைப்பையும் பாதுகாக்கிறது; அடிக்குறிப்பு அதன் மரபுத்தொடர்ப் பொருளைத் தெளிவாக்குகிறது.
- issue: லְטוֹבָה என்பதன் வளம்/நன்மை நுணுக்கம்
  choice: நன்மை
  alternative: செழிப்பு; நல்வாழ்வு
  rationale: எபிரெயச் சொல் பொருளாதாரச் செழிப்பை மட்டும் குறுக்காமல் நன்மை மற்றும் நலனையும் உள்ளடக்கக்கூடும். எனவே பொதுவான சொல்லை முதன்மை உரையில் வைத்து மாற்றுப் பொருள்களை அடிக்குறிப்பில் தருவது தெளிவின்மையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் மரியாதை ஒருமை/கூட்டு மக்களை நோக்கும் ‘நீங்கள்’ வடிவம் பயன்படுத்தப்பட்டுள்ளது. வாக்கியத்தின் நீண்ட எபிரெய அமைப்பு தமிழில் தெளிவாகப் படிக்க முன்னிலைப்படுத்தப்பட்ட இடவுரையுடனும் இடைக்கோட்டுடனும் சீரமைக்கப்பட்டுள்ளது. ‘கருப்பையின் கனி’ என்ற கவித்துவ உடன்படிக்கை மொழி தக்கவைக்கப்பட்டாலும், கால்நடைகள் மற்றும் பயிர்களுக்கு இயல்பான தமிழ்ச் சொற்கள் தேர்ந்தெடுக்கப்பட்டுள்ளன.
