- from: யெகோவா உங்கள் மூதாதையருக்கு ஆணையிட்டு உங்களுக்குக் கொடுப்பதாகச் சொன்ன தேசத்தில், அவர் உங்களுக்கு நன்மை பெருகச் செய்வார்[a]—உங்கள் கருப்பையின் கனியிலும்[b], உங்கள் கால்நடைகளின் குட்டிகளிலும், உங்கள் நிலத்தின் விளைச்சலிலும்[c] பெருகச் செய்வார்.
