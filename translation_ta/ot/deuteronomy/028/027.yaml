  source_fidelity: 'மூல எபிரெய வாக்கியத்தின் நேரடியான அமைப்பும் பொருளும் நன்றாகப் பாதுகாக்கப்பட்டுள்ளன: யாவே வெளிப்படையான செய்பவராகவும், நோய்களின் பட்டியல் கருவிவேற்றுமையுடனும், இறுதியில் குணமடைய இயலாமையும் தெளிவாகவும் உள்ளது. בִּשְׁחִין מִצְרַיִם என்பதற்கான “எகிப்தின் கொப்புளங்கள்,” עֳפָלִים என்பதற்கான பரந்த “கட்டிகள்,” மற்றும் உறுதியற்ற சொல்லுக்கான அடிக்குறிப்பும் பாதுகாப்பானவை.'
