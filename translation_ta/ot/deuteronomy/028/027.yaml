  text: יַכְּ/כָ֨ה יְהוָ֜ה בִּ/שְׁחִ֤ין מִצְרַ֨יִם֙ ו/ב/עפלים וּ/בַ/גָּרָ֖ב וּ/בֶ/חָ֑רֶס אֲשֶׁ֥ר לֹא תוּכַ֖ל לְ/הֵרָפֵֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/027.yaml
  text: Yahweh will strike you with the boils of Egypt[a], and with tumors, and with scabs, and with itch, from which you cannot be healed.
translation:
  language: ta
  text: யாவே உன்னை எகிப்தின் கொப்புளங்களாலும், கட்டிகளாலும்[a], பொருக்குகளாலும், அரிப்பாலும் தாக்குவார்; இவற்றிலிருந்து உன்னால் குணமடைய முடியாது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மூலக்கட்டிகளாலும்.” இதற்கான எபிரெயச் சொல் உறுதியற்றது; அது குறிப்பாக ஆசனவாய்ப் பகுதியில் ஏற்படும் வீக்கங்களைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַכְּכָה
  choice: உன்னைத் தாக்குவார்
  rationale: נכה என்பதன் ஹிஃபில் வடிவம் நேரடியாகத் ‘தாக்குதல்’ அல்லது ‘அடித்தல்’ என்ற வலுவான பொருளைக் கொண்டது. இறைவனே இத்துன்பத்தை வரச்செய்வதாக உள்ள மூலமொழியின் வலிமையை இது காக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைத் திருப்பெயரான நான்கு எழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் அதன் ஒலிப்புக்கு அண்மையாக வழங்குகிறது.
- source_word: בִּשְׁחִין מִצְרַיִם
  choice: எகிப்தின் கொப்புளங்களால்
  rationale: שְׁחִין என்பது வீக்கமும் அழற்சியும் கொண்ட தோல் கொப்புளங்களைக் குறிக்கிறது. எபிரெயில் ஒருமையாக இருந்தாலும் நோய்வகையைக் குறிக்கும் இயல்பான தமிழுக்காகப் பன்மை பயன்படுத்தப்பட்டுள்ளது; ‘எகிப்தின்’ என்பது மூலத்திலுள்ள தொடர்பையும் முந்தைய வாதையின் எதிரொலியையும் காக்கிறது.
- source_word: וּבְעפלים
  choice: கட்டிகளால்
  rationale: இச்சொல்லின் துல்லியமான உடற்கூறு குறிப்பு உறுதியற்றது. ‘கட்டிகள்’ என்பது அளவுக்கு மீறி குறிப்பாக்காத பரந்த தமிழ்ச் சொல்; ‘மூலக்கட்டிகள்’ என்ற சாத்தியம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: וּבַגָּרָב
  choice: பொருக்குகளால்
  rationale: גָּרָב பொருக்கேறிய தோல் நோயையோ வெடிப்பையோ குறிக்கிறது. ‘பொருக்குகள்’ அதன் காணக்கூடிய விளைவைத் தெளிவாகவும் சுருக்கமாகவும் கூறுகிறது.
- source_word: וּבֶחָרֶס
  choice: அரிப்பால்
  rationale: חֶרֶס அரிப்பை உண்டாக்கும் தோல் நிலையைக் குறிக்கலாம். நவீன மருத்துவப் பெயரை ஊகிக்காமல் ‘அரிப்பு’ என வழங்கப்பட்டுள்ளது.
- source_word: אֲשֶׁר לֹא תוּכַל לְהֵרָפֵא
  choice: இவற்றிலிருந்து உன்னால் குணமடைய முடியாது
  rationale: Niphal வடிவின் செயப்படுபொருள் உணர்வையும் குணமாக இயலாத நிலையையும் இயல்பான தமிழில் காக்கிறது. பட்டியலிலுள்ள துன்பங்கள் அனைத்தையும் சுட்டுவதற்காக ‘இவற்றிலிருந்து’ பயன்படுத்தப்பட்டுள்ளது.
theological_decisions:
- issue: YHWH என்ற இறைத் திருப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூலத்தில் உள்ள தனிப்பட்ட உடன்படிக்கைப் பெயரைப் பட்டமாக மாற்றாமல் பாதுகாக்கிறது; குறிப்பிட்ட சமய மரபின் மாற்றீட்டைத் திணிப்பதையும் தவிர்க்கிறது.
- issue: தண்டனையின் நேரடி செய்பவர்
  choice: யாவே ... தாக்குவார்
  alternative: யாவேயால் நீ வாதிக்கப்படுவாய்
  rationale: எபிரெய வாக்கியத்தில் இறைவன் வெளிப்படையான எழுவாயாக இருப்பதால், அந்த நேரடித் தொடர்பையும் வசனத்தின் இறையியல் பதற்றத்தையும் மென்மையாக்காமல் வைத்திருக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் அதேவேளையில் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. நோய்களுக்கு உறுதியற்ற நவீன மருத்துவப் பெயர்கள் இடப்படவில்லை. அடிக்குறி அது விளக்கும் ‘கட்டிகளாலும்’ என்ற சொல்லுக்குப் பின்பே வைக்கப்பட்டுள்ளது.
