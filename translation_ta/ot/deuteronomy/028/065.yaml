  text: וּ/בַ/גּוֹיִ֤ם הָ/הֵם֙ לֹ֣א תַרְגִּ֔יעַ וְ/לֹא יִהְיֶ֥ה מָנ֖וֹחַ לְ/כַף רַגְלֶ֑/ךָ וְ/נָתַן֩ יְהוָ֨ה לְ/ךָ֥ שָׁם֙ לֵ֣ב רַגָּ֔ז וְ/כִלְי֥וֹן עֵינַ֖יִם וְ/דַֽאֲב֥וֹן נָֽפֶשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/065.yaml
  text: And among those nations you will find no rest[a], and there will be no resting place for the sole of your foot; and there Yahweh will give you a trembling heart, failing eyes[c][b], and anguish of soul.
translation:
  language: ta
  text: அந்த நாடுகளின் நடுவில் நீ இளைப்பாற மாட்டாய்[a]; உன் உள்ளங்காலுக்கு ஓய்விடம் இருக்காது. அங்கே யாவே உனக்கு நடுங்கும் இதயத்தையும், சோர்வுறும் கண்களையும்[b], உயிரின் துயரத்தையும்[c] கொடுப்பார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘நீ நிம்மதியாக இருக்க மாட்டாய்.’
    reason: lexical_alternative
  - marker: b
    text: சொல்லர்த்தமாக, ‘கண்கள் தேய்ந்துபோதல்’; அல்லது, ‘செயலிழக்கும் கண்கள்.’
    reason: lexical_alternative
  - marker: c
    text: அல்லது, ‘உயிரின் வேதனை’ அல்லது ‘உள்ளத்தின் வலி.’
    reason: lexical_alternative
lexical_decisions:
- source_word: תַרְגִּיעַ
  choice: நீ இளைப்பாற மாட்டாய்
  rationale: இங்கு ஹிஃபில் வடிவம் நிலைகொண்டு ஓய்வடைவதையோ நிம்மதியாக இருப்பதையோ குறிக்கிறது. ‘இளைப்பாற மாட்டாய்’ என்பது சூழலுக்கு ஏற்ற இயல்பான தமிழ்.
- source_word: מָנוֹחַ
  choice: ஓய்விடம்
  rationale: ‘ஓய்வு’ என்ற நிலையையும் ‘ஓய்வெடுக்கும் இடம்’ என்ற பொருளையும் இச்சொல் தரலாம்; ‘உள்ளங்காலுக்கு’ என்பதுடன் இடப்பொருள் சிறப்பாகப் பொருந்துகிறது.
- source_word: לְכַף רַגְלֶךָ
  choice: உன் உள்ளங்காலுக்கு
  rationale: כַּף רֶגֶל என்பது பாதத்தின் அடிப்பகுதியைத் துல்லியமாகக் குறிக்கிறது; ‘உள்ளங்கால்’ நவீனத் தமிழில் இயல்பான சொல்.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய மூலத்தில் வரும் தனிப்பெயரான நான்கெழுத்துத் திருப்பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் ஒலிபெயர்த்து வழங்குகிறது.
- source_word: לֵב רַגָּז
  choice: நடுங்கும் இதயம்
  rationale: உடல்சார் நடுக்கத்தையும் உள்ளார்ந்த கலக்கத்தையும் கொண்ட மூல உருவகத்தைப் பாதுகாக்கிறது.
- source_word: כִּלְיוֹן עֵינַיִם
  choice: மங்கிப்போகும் கண்கள்
  rationale: கண்கள் சோர்ந்து செயலிழப்பதையோ ஏக்கத்தால் மங்குவதையோ குறிக்கும் சொற்றொடரின் படிமத்தை இயல்பான தமிழில் தருகிறது; அதன் பரப்பு அடிக்குறிப்பில் சுட்டப்படுகிறது.
- source_word: דַּאֲבוֹן נָפֶשׁ
  choice: உள்ளத்தின் வேதனை
  rationale: דַּאֲבוֹן என்பதன் வலி/துயரம் என்ற தீவிரத்தையும், נֶפֶשׁ இங்கு மனிதனின் உள்ளார்ந்த உயிர் மற்றும் உணர்வுநிலையைக் குறிக்கும் தன்மையையும் இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூல உரை இறைவனின் தனிப்பெயரை நேரடியாகக் கொண்டுள்ளது. அதனைப் பட்டமாக மாற்றாமல் ஒலிபெயர்ப்பது மூலத்தின் தன்மையைப் பாதுகாக்கிறது.
- issue: נֶפֶשׁ என்பதன் பொருள்
  choice: உள்ளம்
  alternative: ஆத்துமா / உயிர்
  rationale: இந்தச் சூழலில் மனவேதனையால் பாதிக்கப்படும் முழு உள்ளார்ந்த நபரைக் குறிக்கிறது. ‘உள்ளம்’ இயல்பான தமிழாக இருந்தாலும், சொல்லின் விரிந்த பொருளை முற்றிலும் ஒரு கோட்பாட்டு ‘ஆத்துமா’ கருத்தாகச் சுருக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகருக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டது. எபிரெய இணை அமைப்பும் படிமங்களும் இயன்றவரை காக்கப்பட்டுள்ளன; தமிழில் செயற்கையாகத் தோன்றும் இடங்களில் அளவான இயல்பாக்கம் செய்யப்பட்டது.
