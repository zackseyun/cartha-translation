revisions:
- from: உன் கடவுளாகிய யாவேவின் கட்டளைகளைக் கடைப்பிடித்து, அவருடைய வழிகளில் நீ நடந்தால், யாவே உனக்கு ஆணையிட்டபடியே உன்னைத் தமக்கெனப் பரிசுத்த மக்களாக நிலைநிறுத்துவார்.[a]
