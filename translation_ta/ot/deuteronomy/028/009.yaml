base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/009.yaml
  text: Yahweh will establish you for himself as a holy people[a], just as he swore to you, if you keep the commandments of Yahweh your God and walk in his ways.
translation:
  language: ta
  text: உன் கடவுளாகிய யாவேவின் கட்டளைகளைக் கடைப்பிடித்து, அவருடைய வழிகளில் நீ நடந்தால், உனக்குச் சத்தியம் செய்தபடியே யாவே உன்னைத் தமக்கெனப் பரிசுத்த மக்களாக நிலைநிறுத்துவார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உன் கடவுளாகிய யாவேவின் கட்டளைகளை நீ கடைப்பிடித்து, அவருடைய வழிகளில் நடப்பதால்.” எபிரெய இணைப்புச்சொல் சில வேளைகளில் காரணப் பொருளிலும் புரிந்துகொள்ளப்படலாம்; ஆனால் இங்குள்ள சூழல் “நடந்தால்” என்ற நிபந்தனைப் பொருளையே அதிகம் ஆதரிக்கிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: יְקִימְךָ
  choice: உன்னை... நிலைநிறுத்துவார்
  rationale: קום என்பதன் ஹிப்ஃபில் வடிவம் இங்கு உடல்ரீதியாக எழுப்புவதை அல்ல, உடன்படிக்கை சார்ந்த நிலையில் உறுதியாக ஏற்படுத்துவதைச் சுட்டுகிறது.
- source_word: לּוֹ
  choice: தமக்கென
  rationale: யாவே இஸ்ரவேலைத் தமக்குச் சொந்தமான மக்களாக வேறுபடுத்தி ஏற்படுத்துகிறார் என்ற உறவு மற்றும் உடைமைப் பொருளைப் பாதுகாக்கிறது.
- source_word: לְעַם קָדוֹשׁ
  choice: பரிசுத்த மக்களாக
  rationale: விளைவாக அமையும் மக்களின் நிலையை இயல்பான தமிழில் வெளிப்படுத்துவதோடு, உடன்படிக்கை அடையாளத்தையும் காக்கிறது.
- source_word: כַּאֲשֶׁר נִשְׁבַּע לָךְ
  choice: உனக்கு ஆணையிட்டபடியே
  rationale: முன்பு செய்த ஆணைக்கும் இப்போதைய வாக்குறுதிக்கும் உள்ள ஒத்திசைவைத் தெளிவாகக் காட்டுகிறது.
- source_word: כִּי
  choice: நடந்தால்
  rationale: இந்த ஆசீர்வாதச் சூழலில் כִּי கீழ்ப்படிதலை நிபந்தனையாக அறிமுகப்படுத்துகிறது; தமிழில் ‘-ஆல்’ நிபந்தனை அமைப்பு இயல்பானது.
- source_word: תִשְׁמֹר
  choice: கட்டளைகளைக் கடைப்பிடித்து
  rationale: கட்டளைகளோடு வரும் שׁמר அவற்றைக் கவனமாகக் கைக்கொள்வது அல்லது கடைப்பிடிப்பது என்ற பொருளைத் தருகிறது.
- source_word: מִצְוֺת
  choice: கட்டளைகள்
  rationale: சொல்லின் உடன்படிக்கை மற்றும் சட்டம் சார்ந்த முறையான தொனியைப் பாதுகாக்கிறது.
- source_word: וְהָלַכְתָּ בִּדְרָכָיו
  choice: அவருடைய வழிகளில் நீ நடந்தால்
  rationale: கடவுளின் வெளிப்படுத்தப்பட்ட சித்தத்துக்கேற்ப வாழ்வதைக் குறிக்கும் எபிரெய உருவகத்தைத் தமிழிலும் தெளிவாகப் பாதுகாக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரான நான்கெழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் ஒலிபெயர்த்துக் கொடுக்கிறது.
- source_word: אֱלֹהֶיךָ
  choice: உன் கடவுள்
  rationale: இரண்டாம் நபர் ஒருமை உடைமைத் தொடர்பையும் உடன்படிக்கை உறவையும் நேரடியாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: ஆசீர்வாத வாக்கியத்தில் כִּי என்பதன் நிபந்தனைப் பொருள்
  choice: ‘...நடந்தால்’ என்று நிபந்தனையாக மொழிபெயர்க்கப்பட்டது.
  alternative: ‘...கடைப்பிடிப்பதால்’ அல்லது ‘ஏனெனில் நீ கடைப்பிடிக்கிறாய்’ என்ற காரணப் பொருள் சாத்தியம்.
  rationale: உபாகமத்தின் ஆசீர்வாதம்–சாபம் என்ற விரிந்த சூழலும் வாக்கிய அமைப்பும் உண்மையான நிபந்தனைப் பொருளை ஆதரிக்கின்றன; இருப்பினும் எபிரெய இணைப்புச்சொல்லின் காரணப் பொருள் சாத்தியத்தை அடிக்குறிப்பு பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘பரிசுத்த மக்கள்,’ ‘கட்டளைகள்,’ ‘வழிகளில் நட’ ஆகியவை மூலத்தின் உடன்படிக்கைச் சார்ந்த சொற்களையும் உருவகத்தையும் காக்கின்றன. ஒருமை இரண்டாம் நபர் வடிவம் மூலத்திற்கேற்ப தொடரப்பட்டுள்ளது.
