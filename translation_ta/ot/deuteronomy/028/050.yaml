- source_word: אֲשֶׁר
  choice: அது
  rationale: முன்னுள்ள ‘தேசம்’ என்பதைத் தொடர்ந்து விவரிக்கும் சார்பு வாக்கியத்தைத் தமிழில் இயல்பாக இணைக்கிறது.
- source_word: לֹא יִשָּׂא פָנִים לְזָקֵן
  choice: முதியவரை மதிக்காது
