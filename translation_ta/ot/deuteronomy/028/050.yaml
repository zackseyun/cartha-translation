- source_word: זָקֵן
  choice: முதியவர்
  rationale: ஒருமை வடிவம் ஒரு வகுப்பினரைப் பொதுவாகக் குறிக்கிறது; ‘முதியவர்’ பாலினத்தைத் தேவையின்றிக் குறிப்பாக்காமல் மரியாதையான தமிழை வழங்குகிறது.
- source_word: וְנַעַר
  choice: இளைஞர்
  rationale: נַעַר என்பது சிறுவன் முதல் இளைஞன் வரை பொருள்படலாம்; זָקֵן என்பதற்கு எதிரிணையாக இங்கு ‘இளைஞர்’ வயது வேறுபாட்டை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: לֹא יָחֹן
  choice: தயவு காட்டாது
  rationale: חנן என்பதன் ‘தயவு/அருள் காட்டுதல்’ என்ற அடிப்படைப் பொருளைத் தக்கவைக்கிறது; ‘இரக்கம் கொள்ளாது’ என்பதும் சாத்தியம் என்பதால் அது அடிக்குறிப்பில் தரப்படுகிறது.
