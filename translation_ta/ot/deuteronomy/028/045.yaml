  text: וּ/בָ֨אוּ עָלֶ֜י/ךָ כָּל הַ/קְּלָל֣וֹת הָ/אֵ֗לֶּה וּ/רְדָפ֨וּ/ךָ֙ וְ/הִשִּׂיג֔וּ/ךָ עַ֖ד הִשָּֽׁמְדָ֑/ךְ כִּי לֹ֣א שָׁמַ֗עְתָּ בְּ/קוֹל֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ לִ/שְׁמֹ֛ר מִצְוֺתָ֥י/ו וְ/חֻקֹּתָ֖י/ו אֲשֶׁ֥ר צִוָּֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/045.yaml
  text: And all these curses will come upon you and pursue you and overtake you[a], until you are destroyed, because you did not listen to the voice of Yahweh your God, to keep his commandments and his statutes that he commanded you.
translation:
  language: ta
  text: இந்தச் சாபங்கள் அனைத்தும் உன்மேல் வந்து, உன்னைத் துரத்தி, உன்னை அடையும்; நீ அழிக்கப்படும்வரை. ஏனெனில், உன் கடவுளாகிய யாவே உனக்குக் கட்டளையிட்ட அவருடைய கட்டளைகளையும் நியமங்களையும் கடைப்பிடிக்க, நீ அவருடைய குரலுக்குச் செவிகொடுக்கவில்லை.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבָאוּ עָלֶיךָ
  choice: உன்மேல் வந்து
  rationale: உடன்படிக்கை எச்சரிக்கையின் வருங்கால விளைவைத் தமிழ் வினைத்தொடர் இயல்பாக உணர்த்துகிறது; עַל என்பதன் திசைசார் வலிமையும் காக்கப்படுகிறது.
- source_word: כָּל הַקְּלָלוֹת הָאֵלֶּה
  choice: இந்தச் சாபங்கள் அனைத்தும்
  rationale: ஆசீர்வாதங்கள்–சாபங்கள் சூழலில் קְלָלוֹת என்பதற்கு இயல்பான, நேரடியான இணைச்சொல் ‘சாபங்கள்’.
- source_word: וּרְדָפוּךָ וְהִשִּׂיגוּךָ
  choice: உன்னைத் துரத்தி, உன்னைப் பிடிக்கும்
  rationale: ‘துரத்துதல்–பிடித்தல்’ என்ற தொடர் மூலத்தின் இயக்கத்தையும் தவிர்க்க இயலாத விளைவையும் இயல்பான தமிழில் காக்கிறது.
- source_word: עַד הִשָּׁמְדָךְ
  choice: நீ அழிக்கப்படும்வரை
  rationale: இறுதி எல்லை அல்லது விளைவைச் சுட்டும் עַד கட்டமைப்பையும், வெளிப்படையாகச் செய்பவரைக் குறிப்பிடாத மூலத்தின் தன்மையையும் காக்கிறது.
- source_word: כִּי לֹא שָׁמַעְתָּ בְּקוֹל
  choice: ஏனெனில் ... நீ அவரது குரலுக்குச் செவிகொடுக்கவில்லை
  rationale: שׁמע בקול கீழ்ப்படிதலைக் குறித்தாலும், மூலத்தின் செவிசாய்க்கும் உருவகத்தை அழிக்காமல் தமிழில் இயல்பாக வழங்குகிறது.
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: உன் கடவுளாகிய யாவே
  rationale: திருநாமத்தை ஒலிபெயர்த்து, உடன்படிக்கைப் பெயரின் தனித்தன்மையைப் பாதுகாக்கிறது.
- source_word: לִשְׁמֹר מִצְוֺתָיו וְחֻקֹּתָיו
  choice: அவரது கட்டளைகளையும் நியமங்களையும் கடைப்பிடிக்கும்படி
  rationale: לִשְׁמֹר என்பதன் நோக்கம்/நடைமுறை உள்ளடக்கத்தைத் திறந்தவாறே வைத்துக் கொண்டு, מִצְוֺת மற்றும் חֻקֹּת ஆகிய இரு சட்டச் சொற்களையும் வேறுபடுத்துகிறது.
- source_word: אֲשֶׁר צִוָּךְ
  choice: உனக்குக் கட்டளையிட்ட
  rationale: உறவுப்பெயர் வாக்கியத்தைச் சுருக்கமான இயல்பான தமிழில் வழங்கி, கட்டளையின் தெய்வீக மூலத்தைத் தெளிவாக வைத்திருக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற திருநாமத்தின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் வரும் உடன்படிக்கைத் திருநாமத்தைப் பொதுப்பட்டப் பெயராக மாற்றாமல் ஒலிபெயர்த்து வழங்குகிறது.
- issue: שָׁמַע בְּקוֹל என்பதை ‘கீழ்ப்படியவில்லை’ எனப் பொருளாக்கலாமா அல்லது செவிசாய்க்கும் உருவகத்தைக் காக்கலாமா
  choice: அவரது குரலுக்குச் செவிகொடுக்கவில்லை
  alternative: அவருக்குக் கீழ்ப்படியவில்லை
  rationale: இச்சொற்றொடர் கீழ்ப்படிதலை உட்பொருளாகக் கொண்டிருந்தாலும், மூலத்தின் ‘குரலைக் கேட்பது’ என்ற உடன்படிக்கை உருவகத்தையும் அதன் இறையியல் ஒலியையும் காக்கிறது.
- issue: לִשְׁמֹר என்பதன் தொடர்பு
  choice: கடைப்பிடிக்கும்படி
  alternative: கடைப்பிடித்ததன் மூலம்
  rationale: எபிரெய infinitive நோக்கம் அல்லது கேட்பதன் நடைமுறை உள்ளடக்கம் என இருவிதமாக நெருங்கக்கூடும்; பிரதான உரை நோக்கச் சாயலைக் காக்கிறது, மாற்று விளக்கம் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளும் கண்ணியமான உடன்படிக்கைச் சட்ட நடையில் வடிவமைக்கப்பட்டது. ஒருமை ஆண்பால் இரண்டாம் நபர் தமிழில் இயல்பாக ‘நீ/உன்’ என வழங்கப்பட்டது; ‘கட்டளைகள்’ மற்றும் ‘நியமங்கள்’ என்ற சட்டச் சொல் வேறுபாடு காக்கப்பட்டது.
