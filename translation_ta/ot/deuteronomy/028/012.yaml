source:
  edition: WLC
  text: יִפְתַּ֣ח יְהוָ֣ה לְ֠/ךָ אֶת אוֹצָר֨/וֹ הַ/טּ֜וֹב אֶת הַ/שָּׁמַ֗יִם לָ/תֵ֤ת מְטַֽר אַרְצְ/ךָ֙ בְּ/עִתּ֔/וֹ וּ/לְ/בָרֵ֕ךְ אֵ֖ת כָּל מַעֲשֵׂ֣ה יָדֶ֑/ךָ וְ/הִלְוִ֨יתָ֙ גּוֹיִ֣ם רַבִּ֔ים וְ/אַתָּ֖ה לֹ֥א תִלְוֶֽה׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/012.yaml
  text: Yahweh will open to you his good storehouse[a], the heavens, to give the rain of your land in its season and to bless all the work of your hand. You will lend to many nations, but you will not borrow.
translation:
  language: ta
  text: யாவே உனக்குத் தமது நல்ல களஞ்சியமாகிய வானத்தைத் திறந்து, உரிய காலத்தில் உன் நாட்டிற்கு மழை கொடுத்து, உன் கைகளின் எல்லா வேலைகளையும் ஆசீர்வதிப்பார். நீ பல நாடுகளுக்குக் கடன் கொடுப்பாய்; ஆனால் நீ கடன் வாங்கமாட்டாய்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: யாவே
  rationale: உடன்படிக்கையின் இறைப் பெயரைப் பொதுப்பட்டமாக மாற்றாமல், எபிரெய வடிவுக்கு நெருக்கமான தமிழ்ப் பெயர்ப்பாகத் தருகிறது.
- source_word: יִפְתַּח
  choice: திறந்து
  rationale: ஆசீர்வாதச் சூழலில் எதிர்காலச் செயலைக் குறிக்கும் வினையை, தொடர்ந்துவரும் நோக்கச் செயல்களுடன் இயல்பான தமிழில் இணைக்கிறது.
- source_word: אוֹצָרוֹ הַטּוֹב אֶת הַשָּׁמַיִם
  choice: தமது நல்ல களஞ்சியமாகிய வானத்தை
  rationale: ‘வானம்’ என்பது ‘நல்ல களஞ்சியம்’ என்பதை விளக்கும் எபிரெய ஒட்டுநிலை அமைப்பைப் பாதுகாக்கிறது; மழைச் சூழலுக்கு ‘களஞ்சியம்’ இயல்பாகப் பொருந்துகிறது.
- source_word: לָתֵת מְטַר אַרְצְךָ בְּעִתּוֹ
  choice: உரிய காலத்தில் உன் நாட்டிற்கு மழை கொடுத்து
  rationale: மழை அதற்குரிய காலத்தில் வழங்கப்படுவதைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: כָּל מַעֲשֵׂה יָדֶךָ
  choice: உன் கை செய்யும் எல்லா வேலையையும்
  rationale: ‘கையின் வேலை’ என்ற மூலமொழி உருவகத்தைப் பேணியபடியே தமிழில் புரியத்தக்கவாறு வழங்குகிறது.
- source_word: וְהִלְוִיתָ גּוֹיִם רַבִּים
  choice: நீ பல நாடுகளுக்குக் கடன் கொடுப்பாய்
  rationale: லוה என்பதன் ஹிஃபில் வடிவிலுள்ள ‘கடன் கொடு’ என்ற பொருளையும், גּוֹיִם என்பதன் தேசியச் சூழலையும் தக்கவைக்கிறது.
- source_word: וְאַתָּה לֹא תִלְוֶה
  choice: ஆனால் நீ கடன் வாங்கமாட்டாய்
  rationale: கால் வடிவிலுள்ள ‘கடன் வாங்கு’ என்ற பொருளைத் தருகிறது; இணைப்புச் சொல்லின் எதிர்மறை வேறுபாட்டை ‘ஆனால்’ இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் நேரடியாக வரும் உடன்படிக்கைப் பெயரைப் பொதுப்பட்டமாக மாற்றாமல் பெயராகவே பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழ்; மரியாதையுள்ள வேதாகம நடையுடன், சாதாரண வாசகர்களுக்குப் புரியும் சொற்கள் பயன்படுத்தப்பட்டுள்ளன. ஒருமை இரண்டாம் நபர் வடிவங்கள் மூலத்தின் இஸ்ரவேலை ஒருமையாகச் சுட்டும் அமைப்பைப் பேணுகின்றன.
