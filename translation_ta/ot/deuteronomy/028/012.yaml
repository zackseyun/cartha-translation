    text: அல்லது, “தமது நல்ல பொக்கிஷம்.” எபிரெயச் சொல் களஞ்சியம் அல்லது பொக்கிஷம் என்பதைக் குறிக்கலாம்; மழை மற்றும் விளைச்சல் சூழலுக்கு “களஞ்சியம்” பொருத்தமாக உள்ளது.
    reason: lexical_alternative
