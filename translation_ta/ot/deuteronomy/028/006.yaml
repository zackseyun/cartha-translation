  yaml_path: translation/ot/deuteronomy/028/006.yaml
  text: Blessed shall you be when you come in[b][a], and blessed shall you be when you go out.
translation:
  language: ta
  text: நீ உள்ளே வரும்போதும் ஆசீர்வதிக்கப்படுவாய்[b][a]; நீ வெளியே போகும்போதும் ஆசீர்வதிக்கப்படுவாய்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் ‘நீ’ என்பது ஒருமை; இஸ்ரவேல் மக்கள் ஒரு கூட்டுமக்களாக ஒருமையில் விளிக்கப்படுகிறார்கள்.
    reason: cultural_note
  - marker: b
    text: அல்லது, ‘நீ உள்ளே வருவதிலும் … நீ வெளியே போவதிலும்’; இந்த இணைச்சொல் வாழ்க்கை மற்றும் செயல்பாடுகளின் முழுப் போக்கையும் குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּרוּךְ
  choice: ஆசீர்வதிக்கப்பட்டிருப்பாய்
  rationale: ברך என்பதன் செயல்பாட்டு வினையெச்சம் உடன்படிக்கை ஆசீர்வாதச் சூழலில் பயனிலைப் பொருளில் வருகிறது. சுற்றியுள்ள பகுதி எதிர்கால உடன்படிக்கை விளைவுகளை அறிவிப்பதால், தமிழில் எதிர்காலத் தன்மையுள்ள இவ்வடிவம் பொருத்தமானது.
- source_word: אַתָּה
  choice: நீ
  rationale: இது இரண்டாம் நபர் ஆண்பால் ஒருமைச் சுட்டுப்பெயர். உடன்படிக்கை மக்களாகிய இஸ்ரவேலைக் கூட்டாக ஒருமையில் விளிப்பதைத் தமிழின் இயல்பான ஒருமை வடிவமான ‘நீ’ தக்கவைக்கிறது.
- source_word: בְּבֹאֶךָ
  choice: நீ உள்ளே வரும்போது
  rationale: ב முன்னொட்டும் בוא வேரின் infinitive construct வடிவமும் இரண்டாம் நபர் ஒருமை பின்னொட்டும் சேர்ந்த தொடர். ‘உள்ளே வரும்போது’ என்பது நவீனத் தமிழில் இயல்பாகவும் எபிரெய இயக்கப் பொருளுக்கு நெருக்கமாகவும் உள்ளது.
- source_word: וּבָרוּךְ
  choice: ஆசீர்வதிக்கப்பட்டிருப்பாய்
  rationale: இணைப்புச் சொல்லோடு ஆசீர்வாத வாய்பாடு மீண்டும் வருகிறது. இரண்டாம் அரையடியில் முழு பயனிலையை மீண்டும் கூறுவது எபிரெய இணைநிலையையும் சொற்பொழிவு சமநிலையையும் காக்கிறது.
- source_word: בְּצֵאתֶךָ
  choice: நீ வெளியே போகும்போது
  rationale: ב முன்னொட்டும் יצא வேரின் infinitive construct வடிவமும் இரண்டாம் நபர் ஒருமை பின்னொட்டும் சேர்ந்த தொடர். ‘உள்ளே வருதல் / வெளியே போதல்’ என்ற இணை அன்றாட வாழ்வு மற்றும் செயல்பாடுகளின் முழுமையையும் குறிக்கக்கூடும்; இந்த மொழிபெயர்ப்பு நேரடி இயக்கப் பொருளையும் அந்த விரிந்த பொருளையும் திறந்தவையாக வைக்கிறது.
theological_decisions:
- issue: இஸ்ரவேலைக் குறிக்கும் பிரதிநிதித்துவ ஒருமை விளிப்பு
  choice: ‘நீ’ என்ற ஒருமையை விளக்கமளிக்கும் விரிவாக்கமின்றித் தக்கவைத்தல்
  alternative: ‘நீங்கள் எல்லாரும்’ அல்லது ‘இஸ்ரவேல்’ என்று வெளிப்படையாக விரித்துரைத்தல்
  rationale: எபிரெயம் இரண்டாம் நபர் ஆண்பால் ஒருமையைப் பயன்படுத்தி, உடன்படிக்கை மக்களாகிய இஸ்ரவேலைக் கூட்டாக ஒருமையில் விளிக்கிறது. ‘நீ’ என்பது மூலத்தின் இலக்கண வடிவத்தைப் பாதுகாத்து, விளக்கத்தை முதன்மை உரைக்குள் இறக்குமதி செய்வதைத் தவிர்க்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான நடையைப் பயன்படுத்துகிறது. ‘ஆசீர்வதிக்கப்பட்டிருப்பாய்’ என்ற மீளுரை உடன்படிக்கை ஆசீர்வாதத்தின் எதிர்காலத் தன்மையையும் எபிரெய இணைநிலையையும் காக்கிறது. அடிக்குறிப்புக் குறிகள் ஆங்கில ஆலோசனை உரையின் வரிசைப்படி முதல் தொடருக்குப் பின் [b][a] என வைக்கப்பட்டுள்ளன.
