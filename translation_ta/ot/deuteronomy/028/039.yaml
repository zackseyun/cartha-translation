translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதாகவும் மதிப்புமிக்க நடையிலும் மொழிபெயர்க்கப்பட்டது. எபிரெய மூலத்தில் ‘திராட்சரசம்’ என்பதே குடித்தல் மற்றும் சேர்த்துவைத்தல் ஆகிய இரு வினைகளுடனும் தொடர்புபடுவதால், அந்த அமைப்பு விளக்கமாக மாற்றப்படாமல் காக்கப்பட்டுள்ளது.
