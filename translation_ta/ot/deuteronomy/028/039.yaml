source:
  edition: WLC
  text: כְּרָמִ֥ים תִּטַּ֖ע וְ/עָבָ֑דְתָּ וְ/יַ֤יִן לֹֽא תִשְׁתֶּה֙ וְ/לֹ֣א תֶאֱגֹ֔ר כִּ֥י תֹאכְלֶ֖/נּוּ הַ/תֹּלָֽעַת־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/039.yaml
  text: You will plant vineyards and cultivate them[a], but you will not drink the wine or gather it, because the worm will eat it.
translation:
  language: ta
  text: நீ திராட்சைத் தோட்டங்களை நட்டு அவற்றைப் பண்படுத்துவாய்; ஆனால் திராட்சரசத்தைக் குடிக்கவோ, அதைச் சேர்த்துவைக்கவோ[a] மாட்டாய்; ஏனெனில் புழு அதைத் தின்றுவிடும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அதைச் சேகரிக்கவோ.’ எபிரெய வினைச்சொல்லுக்குச் சேகரித்தல், ஒன்றுசேர்த்தல், அல்லது சேமித்துவைத்தல் என்று பொருள் கொள்ளலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּרָמִים
  choice: திராட்சைத் தோட்டங்கள்
  rationale: பன்மையில் வரும் எபிரெயச் சொல் திராட்சை பயிரிடப்படும் தோட்டங்களைக் குறிக்கிறது.
- source_word: תִּטַּע
  choice: நட்டு
  rationale: נטע என்பதன் நேரடிப் பொருள் ‘நடுதல்’; சாபங்களின் வரிசையில் எதிர்கால விளைவாக இயல்பாகத் தரப்பட்டுள்ளது.
- source_word: וְעָבָדְתָּ
  choice: அவற்றைப் பண்படுத்துவாய்
  rationale: வேளாண்மைச் சூழலில் עבד என்பது நிலத்தையோ தோட்டத்தையோ உழைத்துப் பராமரிப்பதைக் குறிக்கிறது; தமிழில் ‘பண்படுத்து’ இப்பொருளை இயல்பாகத் தெரிவிக்கிறது.
- source_word: יַיִן
  choice: திராட்சரசம்
  rationale: திராட்சைத் தோட்டத்தின் விளைபொருளான மதுவைக் குறிக்கும் பொதுவான எபிரெயச் சொல்; நவீனத் தமிழில் தெளிவான, வழக்கமான வேதாகமச் சொல்.
- source_word: לֹא תִשְׁתֶּה
  choice: குடிக்கவோ மாட்டாய்
  rationale: மறுக்கப்பட்ட நிறைவுறா வினை covenant curse தொடரில் நிகழவிருக்கும் விளைவைக் குறிக்கிறது.
- source_word: וְלֹא תֶאֱגֹר
  choice: அதைச் சேர்த்துவைக்கவோ மாட்டாய்
  rationale: אגר என்பதற்கு சேகரித்தல், ஒன்றுசேர்த்தல், சேமித்துவைத்தல் ஆகிய பொருள்கள் உண்டு. ‘சேர்த்துவை’ என்பது அறுவடைப் பொருளைத் திரட்டி வைத்துக்கொள்ள முடியாமையை இயல்பாகக் காட்டி, சொல்லின் பரப்பையும் காக்கிறது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய இழப்பிற்கான காரணத்தை அறிமுகப்படுத்துகிறது.
- source_word: תֹאכְלֶנּוּ
  choice: அதைத் தின்றுவிடும்
  rationale: ‘அதைத் தின்னும்’ என்பது நேரடிப் பொருள்; ‘விடும்’ அழிவின் நிறைவை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: הַתֹּלָעַת
  choice: புழு
  rationale: இச்சொல் புழு அல்லது அழிவுண்டாக்கும் இளம்பூச்சியைக் குறிக்கலாம்; உயிரினத்தின் வகையை மூலத்தைவிடக் குறிப்பாக்காமல் ‘புழு’ எனத் தரப்பட்டுள்ளது.
