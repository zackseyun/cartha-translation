  naturalness: “வேறொரு மக்களினத்தாரிடம்” என்பதைவிட “வேறொரு மக்களிடம்” நவீன பொதுத்தமிழில் இயல்பாகவும் நேரடியாகவும் உள்ளது. “உன் கண்கள் ... ஏங்கி மங்கும்” என்பது கண்கள் தேய்ந்து போகும் மூலப் படிமத்தை இயல்பாகத் தருகிறது.
