  text: בָּנֶ֨י/ךָ וּ/בְנֹתֶ֜י/ךָ נְתֻנִ֨ים לְ/עַ֤ם אַחֵר֙ וְ/עֵינֶ֣י/ךָ רֹא֔וֹת וְ/כָל֥וֹת אֲלֵי/הֶ֖ם כָּל הַ/יּ֑וֹם וְ/אֵ֥ין לְ/אֵ֖ל יָדֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/032.yaml
  text: Your sons and your daughters will be given to another people[a], while your eyes look on and fail with longing for them all day long, but your hand will be powerless.
translation:
  language: ta
  text: உன் மகன்களும் மகள்களும் வேறொரு மக்களிடம் ஒப்படைக்கப்படுவார்கள். உன் கண்கள் நாள் முழுவதும் அவர்களைப் பார்த்து ஏங்கி மங்கும்; ஆனால் உன் கையில் வலிமை இருக்காது.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அது உன் அதிகாரத்தில் இருக்காது.” எபிரெய மரபுத்தொடர் சொல்லுக்குச் சொல், உன் கையில் வலிமை இல்லாதிருப்பதைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּנֶיךָ וּבְנֹתֶיךָ
  choice: உன் மகன்களும் மகள்களும்
  rationale: எபிரெய உரை ஆண், பெண் பிள்ளைகளைத் தனித்தனியாகக் குறிப்பிடுவதால் அதே வெளிப்படைத்தன்மை காக்கப்படுகிறது.
- source_word: נְתֻנִים
  choice: ஒப்படைக்கப்படுவார்கள்
  rationale: சாபங்களின் எதிர்காலச் சூழலில் வரும் செயல்பாட்டு இடைநிலை இது; பகைமையான சூழலை உணர்த்தும் இயல்பான தமிழ் செயப்பாட்டு வடிவம் தேர்ந்தெடுக்கப்பட்டது.
- source_word: לְעַם אַחֵר
  choice: வேறொரு மக்களினத்தாரிடம்
  rationale: עַם என்பது இங்கு வேறொரு மக்கள் சமூகத்தைக் குறிக்கிறது; ‘தேசம்’ என்ற அரசியல் நுண்பொருளைச் சேர்க்காமல் மக்கள் குழுவைத் தெளிவுபடுத்துகிறது.
- source_word: וְעֵינֶיךָ רֹאוֹת וְכָלוֹת אֲלֵיהֶם
  choice: உன் கண்கள் ... அவர்களைப் பார்த்து ஏங்கி மங்கிப்போகும்
  rationale: பெற்றோர் தங்கள் பிள்ளைகளின் நிலையை உதவியற்றுப் பார்த்துக்கொண்டே ஏக்கத்தால் கண்கள் சோர்ந்து மங்கும் உயிரோட்டமான படிமத்தைத் தக்கவைக்கிறது.
- source_word: כָּל הַיּוֹם
  choice: நாள் முழுவதும்
  rationale: கால நீட்சியை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: וְאֵין לְאֵל יָדֶךָ
  choice: அவர்களை மீட்க உன் கைக்கு வலிமை இருக்காது
  rationale: கையில் ஆற்றல் இல்லாதிருப்பதைக் குறிக்கும் எபிரெய மரபுத்தொடரைத் தக்கவைத்து, சூழலில் குறிப்பான இயலாமையைத் தெளிவுபடுத்துகிறது.
theological_decisions:
- issue: וְאֵין לְאֵל יָדֶךָ என்ற மரபுத்தொடரின் பொருள்
  choice: அவர்களை மீட்க உன் கைக்கு வலிமை இருக்காது
  alternative: அது உன் அதிகாரத்தில் இருக்காது
  rationale: இது தெய்வத்தைக் குறிக்கும் கூற்று அல்ல; செயல் ஆற்ற இயலாமையைக் குறிக்கும் எபிரெய மரபுத்தொடர். ‘கை’ என்ற மூலப் படிமத்தையும் நடைமுறைப் பொருளையும் மொழிபெயர்ப்பு காக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், கண்ணியமான நேரடி நடையில் மொழிபெயர்க்கப்பட்டது. ஒருமை இரண்டாம் நபர் வடிவம் காக்கப்பட்டுள்ளது; ‘கண்கள் மங்கிப்போகும்’ என்பது மூலத்தின் உடல் மற்றும் உணர்ச்சி சார்ந்த தேய்வுப் படிமத்தை இயல்பாகத் தருகிறது.
