revisions:
- from: உன் மரங்கள் அனைத்தையும் உன் நிலத்தின் விளைச்சலையும் இரைச்சலிடும் பூச்சி[a] கைப்பற்றிக்கொள்ளும்.
  to: உன் எல்லா மரங்களையும் உன் நிலத்தின் விளைச்சலையும் கிரிக்கெட் பூச்சி[a] கைப்பற்றிக்கொள்ளும்.
  rationale: The revision makes the main insect term natural and identifiable in modern Tamil while retaining the English audit trail’s chosen ‘cricket’ sense. The note continues to mark the Hebrew zoological identification as uncertain and supplies alternatives without overstating certainty. The agricultural scope and the metaphorical force of ‘take possession’ are unchanged.
