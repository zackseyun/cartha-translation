base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/042.yaml
  text: The cricket shall take possession of all your trees and the fruit of your ground[a].
translation:
  language: ta
  text: உன் எல்லா மரங்களையும் உன் நிலத்தின் விளைச்சலையும் கிரிக்கெட் பூச்சி[a] கைப்பற்றிக்கொள்ளும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது “வெட்டுக்கிளி,” “புல்வெட்டுக்கிளி,” அல்லது பொதுவாக “ரீங்காரமிடும் பூச்சி”; எபிரெயச் சொல்லான צְלָצַל எந்தப் பூச்சியைத் துல்லியமாகக் குறிக்கிறது என்பது உறுதியில்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל עֵצְךָ
  choice: உன் மரங்கள் அனைத்தையும்
  rationale: כָּל முழுமையைக் குறிக்கிறது; வேளாண்மைச் சூழலில் עֵץ மரங்களைக் குறிக்கும் கூட்டுப்பொருளில் வருகிறது.
- source_word: וּפְרִי אַדְמָתֶךָ
  choice: உன் நிலத்தின் விளைச்சலையும்
  rationale: פְרִי என்பது பழம் அல்லது விளைச்சல்; אֲדָמָה என்பது நிலம் அல்லது மண். இங்கு நிலத்தில் விளையும் அனைத்தையும் இயல்பான தமிழில் குறிக்க ‘நிலத்தின் விளைச்சல்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: יְיָרֵשׁ
  choice: கைப்பற்றிக்கொள்ளும்
  rationale: ירשׁ என்பதன் அடிப்படைப் பொருளான உடைமையாக்குதல் அல்லது கைப்பற்றுதல் என்பதைக் காக்கிறது; பூச்சி ஏற்படுத்தும் அழிவு சூழலால் உணரப்படுகிறது, ஆனால் ‘தின்றுவிடும்’ எனப் பொருள் குறுக்கப்படவில்லை.
- source_word: הַצְּלָצַל
  choice: இரைச்சலிடும் பூச்சி
  rationale: இந்த எபிரெயப் பூச்சிப்பெயரின் துல்லியமான உயிரியல் அடையாளம் உறுதியில்லை. சொல்லின் ஒலிசார் தொடர்பையும் அடையாளத்தின் பொதுமையையும் காக்கும் வகையில் இத்தேர்வு செய்யப்பட்டது.
theological_decisions: []
translation_notes:
  register: நவீனத் தரத் தமிழில், எளிதில் புரியக்கூடிய ஆனால் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. மூலத்தின் ‘கைப்பற்றுதல்’ உருவகம் பாதுகாக்கப்பட்டதுடன், நிச்சயமற்ற பூச்சி அடையாளம் அடிக்குறிப்பில் வெளிப்படையாகத் தரப்பட்டுள்ளது.
