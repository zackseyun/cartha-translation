base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/013.yaml
  text: And Yahweh will make you the head and not the tail[a], and you will be only above, and you will not be beneath, if you listen to the commandments of Yahweh your God that I am commanding you today, to keep and to do them.
translation:
  language: ta
  text: யாவே உன்னைத் தலையாக ஆக்குவார்; வாலாக அல்ல. நீ மேலே மட்டுமே இருப்பாய்; கீழே இருக்கமாட்டாய். நான் இன்று உனக்குக் கட்டளையிடுகிற உன் இறைவனாகிய யாவேவின் கட்டளைகளுக்குச் செவிகொடுத்து, அவற்றைக் கடைப்பிடித்துச் செயல்பட்டால்[a] இது நிகழும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உன் இறைவனாகிய யாவேவின் கட்டளைகளுக்குக் கீழ்ப்படிந்தால்.” எபிரேயத்தில் சொற்படியாக “செவிகொடுத்தால்” என்று உள்ளது; இவ்வுடன்படிக்கைச் சூழலில் அது கீழ்ப்படிந்து கேட்பதையும் உள்ளடக்குகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּנְתָנְךָ יְהוָה
  choice: யாவே உன்னை ... ஆக்குவார்
  rationale: נתן என்பதன் அடிப்படைப் பொருள் ‘கொடு/வை’ என்றாலும், ‘தலை, வால்’ போன்ற பயனிலை நிறைவுகளுடன் இங்கு ஒருவரை ஒரு நிலைக்கு ஆக்குதல் என்ற காரணவினைப் பொருள் இயல்பாக அமைகிறது.
- source_word: לְרֹאשׁ וְלֹא לְזָנָב
  choice: வாலாக அல்ல, தலையாக
  rationale: முக்கியத்துவத்தையும் முன்னிலையையும் குறிக்கும் ‘தலை’, தாழ்ந்த நிலையைக் குறிக்கும் ‘வால்’ என்ற எபிரேய உருவகங்கள் அப்படியே பாதுகாக்கப்படுகின்றன. தமிழ் எதிர்மறை–நேர்மறை அமைப்பில் இயல்பாக ஒலிக்க சொல்வரிசை மாற்றப்பட்டுள்ளது.
- source_word: וְהָיִיתָ רַק לְמַעְלָה וְלֹא תִהְיֶה לְמָטָּה
  choice: நீ கீழே இருக்காமல், மேலே மட்டுமே இருப்பாய்
  rationale: למעלה/למטה ஆகிய இடவியல் எதிர்மறை உருவகங்கள் ‘மேலே/கீழே’ எனப் பாதுகாக்கப்பட்டுள்ளன; רק என்பதன் வலியுறுத்தல் ‘மட்டுமே’ எனத் தரப்பட்டுள்ளது.
- source_word: כִּי תִשְׁמַע אֶל
  choice: '... கட்டளைகளுக்குச் செவிகொடுத்தால்'
  rationale: כִּי இங்கு உடன்படிக்கை ஆசீர்வாதத்தின் நிபந்தனையை அறிமுகப்படுத்துவதால் ‘-ஆல்’ என மொழிபெயர்க்கப்பட்டுள்ளது. שמע אל என்பதன் கேட்பது சார்ந்த உருவம் ‘செவிகொடு’ என்பதில் நீடிக்கிறது; சூழலில் கீழ்ப்படிதலும் உட்பொருளாக உள்ளது.
- source_word: מִצְוֺת
  choice: கட்டளைகள்
  rationale: உடன்படிக்கை விதிகளைச் சுட்டும் מצוה என்பதற்கான தெளிவான, நவீனத் தமிழ்ச் சொல்.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரான நான்கு எழுத்துப் பெயரை ஒரு பொதுப் பட்டத்தால் மாற்றாமல், அதன் தனிப்பெயர் தன்மையைப் பாதுகாக்கும் தமிழாக்கம்.
- source_word: אֱלֹהֶיךָ
  choice: உன் இறைவன்
  rationale: உடன்படிக்கை உறவைச் சுட்டும் இயல்பான தமிழ்ச் சேர்க்கை; ‘உன் இறைவனாகிய யாவே’ எனப் பெயருடன் இணைக்கப்பட்டுள்ளது.
- source_word: אֲשֶׁר אָנֹכִי מְצַוְּךָ הַיּוֹם
  choice: நான் ... இன்று உனக்குக் கட்டளையிடுகிற
  rationale: מְצַוְּךָ என்பதன் நிகழ்கால உரையாடல் வலிமையும், דברים நூலில் முக்கியமான ‘இன்று’ என்பதும் பாதுகாக்கப்படுகின்றன.
- source_word: לִשְׁמֹר וְלַעֲשׂוֹת
  choice: கடைப்பிடித்துச் செயல்படும்படி
  rationale: שמר மற்றும் עשה ஆகிய இரு வினைகளும் முறையே கட்டளைகளைப் பேணிக் கடைப்பிடித்தல், அவற்றின்படி செயல்படுதல் எனத் தனித்த பொருளுடன் இயல்பான தமிழில் வழங்கப்படுகின்றன.
theological_decisions:
- issue: כִּי அறிமுகப்படுத்தும் உடன்படிக்கை நிபந்தனை
  choice: '... செவிகொடுத்தால்'
  alternative: '... செவிகொடுப்பதால் / ஏனெனில் நீ செவிகொடுப்பாய்'
  rationale: ஆசீர்வாதப் பட்டியலின் சூழலில் כִּי வாக்குறுதி நிறைவேறும் நிபந்தனையைச் சுட்டுகிறது. ‘-ஆல்’ என்பது உரையின் உடன்படிக்கைத் தர்க்கத்தை வெளிப்படுத்துகிறது; அதற்கு அப்பாற்பட்ட தகுதி அல்லது காரணவியல் கருத்தைச் சேர்ப்பதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகருக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘தலை/வால்’, ‘மேலே/கீழே’ ஆகிய மூல உருவகங்கள் தட்டையாக்கப்படாமல் பாதுகாக்கப்பட்டுள்ளன; நிபந்தனைத் தொடர் தமிழில் தெளிவாக அமைய வாக்கியத்தின் தொடக்கத்துக்கு நகர்த்தப்பட்டுள்ளது.
