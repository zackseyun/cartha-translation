revisions:
- from: நீ இன்று கடைப்பிடித்துச் செயல்படும்படி நான் உனக்குக் கட்டளையிடுகிற உன் இறைவனாகிய யாவேவின் கட்டளைகளுக்குச் செவிகொடுத்தால்[a], யாவே உன்னை வாலாக அல்ல, தலையாக ஆக்குவார்; நீ கீழே இருக்காமல், மேலே மட்டுமே இருப்பாய்.
  to: யாவே உன்னைத் தலையாக ஆக்குவார்; வாலாக அல்ல. நீ மேலே மட்டுமே இருப்பாய்; கீழே இருக்கமாட்டாய். நான் இன்று உனக்குக் கட்டளையிடுகிற உன் இறைவனாகிய யாவேவின் கட்டளைகளுக்குச் செவிகொடுத்து, அவற்றைக் கடைப்பிடித்துச் செயல்பட்டால்[a] இது நிகழும்.
  rationale: The revision restores the Hebrew order of the promise and the condition, makes the negative future explicit, and represents the paired “keep and do” actions without a purposive reformulation. The supplied Tamil phrase “இது நிகழும்” completes the conditional syntax naturally; it refers only to the preceding promises and introduces no additional theological claim.
