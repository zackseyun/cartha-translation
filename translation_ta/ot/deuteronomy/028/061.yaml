base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/061.yaml
  text: Also every sickness and every affliction that is not written in the book of this law[a], Yahweh will bring upon you until you are destroyed.
translation:
  language: ta
  text: மேலும், இந்தச் சட்ட நூலில் எழுதப்படாத எல்லா நோய்களையும் எல்லா வாதைகளையும்[a] நீ அழிந்துபோகும்வரை யாவே உன்மேல் கொண்டு வருவார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘வாதைகள்’ என்பதற்கு ‘அடிகள்,’ ‘காயங்கள்,’ ‘கொள்ளைநோய்கள்,’ அல்லது தாக்கும் பேரிடர்கள் என்றும் மொழிபெயர்க்கலாம்; எபிரெயச் சொல் அடி, காயம், கொள்ளைநோய் அல்லது தாக்கும் பேரிடரைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: மேலும்
  rationale: சாபங்களின் பட்டியலில் இன்னொன்றைச் சேர்க்கும் பொருளை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: כָּל חֳלִי
  choice: எல்லா நோயையும்
  rationale: חֳלִי என்பது நோய் அல்லது உடல்நலக்குறைவைக் குறிக்கிறது; ‘நோய்’ பரந்ததும் பொதுவாகப் புரிந்துகொள்ளக்கூடியதுமான சொல்.
- source_word: וְכָל מַכָּה
  choice: எல்லா வாதையையும்
  rationale: מַכָּה என்பது அடி, காயம், கொள்ளைநோய் அல்லது தாக்கும் பேரிடர் எனப் பல பொருள்களை உடையது. ‘வாதை’ இங்கு தண்டனையாக வரும் துன்பத்தைப் பரந்த வகையில் சுட்டுகிறது; பொருளை ஒரு குறிப்பிட்ட நோயாக மட்டும் குறுக்கவில்லை.
- source_word: אֲשֶׁר לֹא כָתוּב
  choice: எழுதப்படாத
  rationale: எபிரெயச் செயல்பாட்டு வடிவத்தின் எதிர்மறைப் பொருளைச் சுருக்கமாகவும் நேரடியாகவும் பாதுகாக்கிறது.
- source_word: בְּסֵפֶר הַתּוֹרָה הַזֹּאת
  choice: இந்தத் திருச்சட்ட நூலில்
  rationale: סֵפֶר என்பதன் நூல்/சுருள் கருத்தையும் הַתּוֹרָה என்பதன் உடன்படிக்கைச் சட்டக் கருத்தையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: יַעְלֵם
  choice: வரச் செய்வார்
  rationale: עלה என்பதன் ஹிஃபீல் வடிவம் இங்கு அவற்றை ஒருவர்மேல் கொண்டுவருவதைக் குறிக்கிறது. ‘உன்மேல் வரச் செய்வார்’ என்பது அந்தக் காரணவினைப் பொருளை இயல்பாகத் தருகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைத் திருப்பெயரான நான்கெழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் ஒலிபெயர்த்துக் காட்டுகிறது.
- source_word: עָלֶיךָ
  choice: உன்மேல்
  rationale: தீர்ப்பாக ஒருவர்மேல் கொண்டுவரப்படும் செயலைத் தெளிவாகக் காட்டுகிறது; எபிரெய மூலத்தின் இரண்டாம் நபர் ஒருமையையும் காக்கிறது.
- source_word: עַד הִשָּׁמְדָךְ
  choice: நீ அழிந்துபோகும்வரை
  rationale: தீர்ப்பின் இறுதி எல்லையைச் சுட்டும் எபிரெயச் சொற்றொடரை இயல்பான தமிழில் கடுமை குறையாமல் மொழிபெயர்க்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைத் திருப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூலவசனம் பொதுப் பட்டத்தை அல்ல, உடன்படிக்கையின் தனிப்பட்ட இறைத் திருப்பெயரையே பயன்படுத்துகிறது. எனவே அதைப் பட்டத்தால் மாற்றாமல் ஒலிபெயர்ப்பது மூலத்தின் வேறுபாட்டைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் திருவிவிலிய உரைக்கு ஏற்ற கண்ணியத்துடனும் அமைக்கப்பட்டது. இரண்டாம் நபர் ஒருமை ‘நீ/உன்’ எனக் காக்கப்பட்டுள்ளது; மַכָּה என்பதின் பரந்த பொருள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
