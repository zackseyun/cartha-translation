- from: மேலும், இந்தத் திருச்சட்ட நூலில் எழுதப்படாத எல்லா நோயையும் எல்லா வாதையையும்[a] நீ அழிந்துபோகும்வரை யாவே உன்மேல் வரச் செய்வார்.
  to: மேலும், இந்தச் சட்ட நூலில் எழுதப்படாத எல்லா நோய்களையும் எல்லா வாதைகளையும்[a] நீ அழிந்துபோகும்வரை யாவே உன்மேல் கொண்டு வருவார்.
  rationale: The revised text removes the added sacredness implication from ‘திருச்சட்ட,’ renders the causative ‘bring upon’ idiom more directly, and retains the source’s broad pairing of illnesses and striking afflictions. The footnote clarifies the semantic range of מַכָּה without forcing one disputed or narrow sense into the main text.
