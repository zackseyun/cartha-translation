source:
  edition: WLC
  text: וְ/עָבַדְתָּ֣ אֶת אֹיְבֶ֗י/ךָ אֲשֶׁ֨ר יְשַׁלְּחֶ֤/נּוּ יְהוָה֙ בָּ֔/ךְ בְּ/רָעָ֧ב וּ/בְ/צָמָ֛א וּ/בְ/עֵירֹ֖ם וּ/בְ/חֹ֣סֶר כֹּ֑ל וְ/נָתַ֞ן עֹ֤ל בַּרְזֶל֙ עַל צַוָּארֶ֔/ךָ עַ֥ד הִשְׁמִיד֖/וֹ אֹתָֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/048.yaml
  text: And you shall serve your enemies[a], whom Yahweh will send against you, in hunger and in thirst and in nakedness and in lack of everything[b]; and he will put an iron yoke on your neck until he has destroyed you.
translation:
  language: ta
  text: யாவே உனக்கு எதிராக அனுப்பும் உன் பகைவர்களுக்கு நீ பசியிலும் தாகத்திலும் நிர்வாணத்திலும் எல்லாவற்றின் பற்றாக்குறையிலும் பணி செய்வாய். அவர்[a] உன்னை அழித்தொழிக்கும்வரை உன் கழுத்தின்மேல் இரும்பு நுகத்தை வைப்பார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “வைப்பார்,” “அழித்தொழிக்கும்வரை” ஆகியவற்றின் எழுவாய் யாவே என்று முதன்மை உரை கொள்கிறது. எபிரெயத்தைப் பகைவனே இவ்வினைகளின் எழுவாய் என்றும் புரிந்துகொள்ளலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: וְעָבַדְתָּ
  choice: பணிசெய்வாய்
  rationale: இங்கு עבד வழிபாட்டை அல்ல, பகைவர்களுக்குக் கட்டாயமாகப் பணிபுரிவதைக் குறிக்கிறது; எதிர்கால உடன்படிக்கைச் சாபத்தின் தொனியும் காக்கப்படுகிறது.
- source_word: אֹיְבֶיךָ
  choice: உன் பகைவர்கள்
  rationale: ‘பகைவர்கள்/எதிரிகள்’ என்பதே சொல்லின் நேரடியான பொருள்; இச்சூழலில் ‘பகைவர்கள்’ இயல்பான தமிழ்.
- source_word: אֲשֶׁר יְשַׁלְּחֶנּוּ יְהוָה בָּךְ
  choice: யாவே உனக்கு எதிராக அனுப்பும்
  rationale: בָּךְ என்பதன் பகைமை நோக்கம் தமிழில் ‘உனக்கு எதிராக’ என்று தெளிவாகவும் இயல்பாகவும் வெளிப்படுகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய மூலத்தில் உள்ள இறைத் திருப்பெயர் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: בְּרָעָב וּבְצָמָא וּבְעֵירֹם
  choice: பசியிலும் தாகத்திலும் நிர்வாணத்திலும்
  rationale: בְּ முன்னொட்டு பணிசெய்யும் துயர்நிலைகளைச் சுட்டுகிறது; மூலத்தின் தொடர்ச்சியான, கடுமையான பட்டியல் அமைப்பு காக்கப்படுகிறது.
- source_word: וּבְחֹסֶר כֹּל
  choice: எல்லாவற்றுக்கும் பற்றாக்குறையிலும்
  rationale: חֹסֶר என்பது பற்றாக்குறையையும் כֹּל அதன் முழுமையையும் குறிக்கிறது; முற்றிலும் எதுவும் இல்லாத வறிய நிலை நேரடியாகத் தெரிவிக்கப்படுகிறது.
- source_word: וְנָתַן
  choice: வைப்பார்
  rationale: முதன்மை வாசிப்பில் யாவேதான் தொடரும் எழுவாய்; ‘நுகத்தை வைப்பார்’ என்பது இயல்பான தமிழ் இணைவு.
- source_word: עֹל בַּרְזֶל
  choice: இரும்பு நுகம்
  rationale: இரும்பால் ஆன நுகத்தையும் அதன் வழியாகக் கடுமையான அடிமைத்தனத்தையும் குறிக்கும் உருவகம் நேரடியாகக் காக்கப்படுகிறது.
- source_word: עַל צַוָּארֶךָ
  choice: உன் கழுத்தின்மேல்
  rationale: அடக்குமுறையைக் காட்டும் உடல்சார் உருவகத்தை நேரடியாக மொழிபெயர்க்கிறது.
- source_word: עַד הִשְׁמִידוֹ אֹתָךְ
  choice: உன்னை அழித்தொழிக்கும்வரை
  rationale: שׁמד என்பதன் Hiphil வடிவம் முற்றாக அழிப்பதைக் குறிக்கிறது; ‘அழித்தொழி’ அதன் தீவிரத்தை மிகைப்படுத்தாமல் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைத் திருப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் பொதுப்பட்டப் பெயர் அல்ல, நான்கு எழுத்துகளைக் கொண்ட இறைத் திருப்பெயரே நேரடியாக இடம்பெறுவதால் அது ஒலிபெயர்க்கப்படுகிறது.
- issue: וְנָתַן ... עַד הִשְׁמִידוֹ என்ற வினைகளின் எழுவாய்
  choice: 'யாவே தொடர்ந்து எழுவாயாக இருக்கிறார்: ‘அவர் ... வைப்பார் ... அழித்தொழிக்கும்வரை.’'
  alternative: 'பகைவனே எழுவாய்: ‘அவன் ... வைப்பான் ... அழித்தொழிக்கும்வரை.’'
  rationale: இதற்கு முன் வெளிப்படையாகக் குறிப்பிடப்பட்ட ஒருமை எழுவாய் יְהוָה; எனவே ஒருமை வினைகளில் அவரே தொடர்வது இயல்பான முதன்மை வாசிப்பு. இருப்பினும் பகைவனை எழுவாயாகக் கொள்ளும் இலக்கண வாய்ப்பும் அடிக்குறிப்பில் காக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், உடன்படிக்கைச் சாபத்திற்குரிய கடுமையும் கண்ணியமும் காக்கப்பட்டுள்ளன. ‘பணிசெய்வாய்’ கட்டாய சேவையைத் தெளிவாக்குகிறது; ‘இரும்பு நுகம்’ என்ற மூல உருவகம் மாற்றமின்றி வைக்கப்பட்டுள்ளது. ஒருமை இரண்டாம் நபர் வடிவங்கள் ‘உன்/உன்னை’ என்று தொடர்ச்சியாகப் பேணப்பட்டுள்ளன.
