translation_notes:
  register: நவீன நிலையான தமிழில் கண்ணியமான, பொதுவாசகர்களுக்கு எளிதில் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் தீவிரமான முரண்பாடும், வசனம் அடுத்த வசனத்தில் தொடர்வதைக் காட்டும் இறுதி நீள்கோடும் தக்கவைக்கப்பட்டுள்ளன. அனைத்து அடிக்குறிப்பு குறிகளும் உரையில் இணைக்கப்பட்டுள்ளன.
