base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/056.yaml
  text: The tender and delicate woman among you[a], who has not ventured to set the sole of her foot on the ground because of delicacy and tenderness, her eye will be evil toward the husband of her embrace[b], and toward her son and her daughter—
translation:
  language: ta
  text: உங்களிடையே இருக்கும் மென்மையான, நாசுக்கான பெண்—தன் நாசுக்கினாலும் மென்மையினாலும் தன் உள்ளங்காலைத் தரையில் வைக்கக்கூடத் துணியாதவள்—தன் மார்போடு அணைத்துக்கொள்ளும் கணவனையும்[a], தன் மகனையும் தன் மகளையும் பகைமையோடு பார்ப்பாள்[b]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லர்த்தமாக, “தன் மடியின் ஆண்”; இது அவளுடைய கணவனைக் குறிக்கும் நெருக்கமான மரபுத்தொடர்.
    reason: lexical_alternative
  - marker: b
    text: சொல்லர்த்தமாக, “அவளுடைய கண் தீயதாகும்.” இம்மரபுத்தொடர் பகைமையுடன் பார்ப்பதையோ, பிறருக்குக் கொடுக்க மனமில்லாமல் சுயநலத்துடன் தடுப்பதையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרַכָּה וְהָעֲנֻגָּה
  choice: மென்மையான, நாசுக்கான பெண்
  rationale: רך உடல் அல்லது வாழ்வியல் மென்மையையும், ענג நாசுக்காக வளர்க்கப்பட்ட நிலையையும் குறிக்கின்றன. இரண்டின் வேறுபாட்டை இயல்பான நவீன தமிழில் தக்கவைக்க இச்சொற்கள் பயன்படுத்தப்பட்டன.
- source_word: אֲשֶׁר לֹא נִסְּתָה כַף רַגְלָהּ הַצֵּג עַל הָאָרֶץ
  choice: தன் உள்ளங்காலைத் தரையில் வைக்கக்கூடத் துணியாதவள்
  rationale: נִסְּתָה என்பது முயன்றதில்லை அல்லது துணிந்ததில்லை என்ற நுணுக்கத்தைக் கொண்டிருக்கலாம். சூழலில் வர்ணிக்கப்படும் அளவுகடந்த நாசுக்கைத் தெளிவாகக் காட்ட ‘துணியாதவள்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: מֵהִתְעַנֵּג וּמֵרֹךְ
  choice: தன் நாசுக்கினாலும் மென்மையினாலும்
  rationale: מִן இங்கு காரணத்தைக் குறிக்கிறது. தொடக்கத்திலுள்ள இணைச் சொற்களின் எதிரொலியைப் பாதுகாத்து, காரண உறவும் வெளிப்படுத்தப்பட்டது.
- source_word: תֵּרַע עֵינָהּ
  choice: பகைமையோடு பார்ப்பாள்
  rationale: சொல்லுக்குச் சொல் ‘அவளுடைய கண் தீயதாகும்’ என்பது தமிழில் பொருளை மறைக்கக்கூடும். இச்சூழலில் உள்ள விரோதப் பார்வையை இயல்பாகத் தெரிவிக்கிறது; பேராசை அல்லது கொடுக்க மனமின்மை என்ற உட்பொருள் முற்றிலும் தீர்மானிக்கப்படாமல் அடிக்குறிப்பில் குறிப்பிடப்படுகிறது.
- source_word: בְּאִישׁ חֵיקָהּ
  choice: தன் அரவணைப்புக்குரிய கணவன்
  rationale: சொல்லர்த்தமான ‘அவளுடைய மடியின் ஆண்’ என்பது கணவனுடனான நெருக்கத்தை உணர்த்தும் எபிரெய மரபுத்தொடர். தமிழில் நெருக்கத்தையும் திருமண உறவையும் இயல்பாகத் தக்கவைக்கும் வடிவம் தேர்ந்தெடுக்கப்பட்டது.
- source_word: וּבִבְנָהּ וּבְבִתָּהּ
  choice: தன் மகனையும் தன் மகளையும்
  rationale: மூலத்தில் மகனும் மகளும் தனித்தனியாகக் குறிப்பிடப்படுவதால் பொதுவான ‘பிள்ளைகள்’ என்று சுருக்கப்படவில்லை.
