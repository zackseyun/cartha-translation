source:
  edition: WLC
  text: יְשַׁלַּ֣ח יְהוָ֣ה בְּ֠/ךָ אֶת הַ/מְּאֵרָ֤ה אֶת הַ/מְּהוּמָה֙ וְ/אֶת הַ/מִּגְעֶ֔רֶת בְּ/כָל מִשְׁלַ֥ח יָדְ/ךָ֖ אֲשֶׁ֣ר תַּעֲשֶׂ֑ה עַ֣ד הִשָּֽׁמֶדְ/ךָ֤ וְ/עַד אֲבָדְ/ךָ֙ מַהֵ֔ר מִ/פְּנֵ֛י רֹ֥עַ מַֽעֲלָלֶ֖י/ךָ אֲשֶׁ֥ר עֲזַבְתָּֽ/נִי׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/020.yaml
  text: Yahweh will send on you the curse[a], the confusion, and the rebuke in every undertaking of your hand that you do, until you are destroyed and until you perish quickly, because of the evil of your deeds by which you have forsaken me.
translation:
  language: ta
  text: யாவே உன்மேல் சாபத்தையும், குழப்பத்தையும், கடிந்துரைத்தலையும் நீ கையிடும் ஒவ்வொரு காரியத்திலும்[a] அனுப்புவார்; நீ என்னைக் கைவிட்ட உன் தீய செயல்களினால், நீ அழிக்கப்படும் வரையும் விரைவில் அழிந்துபோகும் வரையும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரெயத்தில்: “உன் கையை நீட்டும் எல்லாவற்றிலும்”; அதாவது, நீ செய்யக் கையிடும் அனைத்திலும்.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְשַׁלַּח
  choice: அனுப்புவார்
  rationale: பியேல் வினை வடிவம் யாவே உடன்படிக்கைத் தண்டனைகளை நேரடியாக வரச்செய்வதைத் தெரிவிக்கிறது; ‘அனுப்புவார்’ இயல்பாகவும் வலிமையாகவும் உள்ளது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைப்பட்டத்தால் மாற்றாமல், எபிரெய இறைப்பெயரான יהוה என்பதன் ஒலிபெயர்ப்பைப் பாதுகாக்கிறது.
- source_word: בְּךָ
  choice: உன்மேல்
  rationale: அனுப்பப்படும் தண்டனைகள் வந்து சேரும் இலக்கை இந்த முன்னிடைச்சொல் குறிக்கிறது.
- source_word: הַמְּאֵרָה
  choice: சாபம்
  rationale: உடன்படிக்கையை மீறுவதற்கான குறிப்பிட்ட தண்டனையாக வரும் சாபத்தைக் குறிக்கிறது.
- source_word: הַמְּהוּמָה
  choice: குழப்பம்
  rationale: இந்தச் சொல் குழப்பம், கலக்கம், பீதி என்ற பொருள் வரம்பைக் கொண்டது; எல்லா முயற்சிகளையும் சீர்குலைக்கும் சூழலில் ‘குழப்பம்’ விரிவான பொருளைப் பாதுகாக்கிறது.
- source_word: הַמִּגְעֶרֶת
  choice: கடிந்துரைத்தல்
  rationale: גער வேரிலிருந்து வரும் வலிமையான இறைக் கடிந்துரைத்தலைத் தனிப்பட்ட, நீதிசார் செயலாகப் பாதுகாக்கிறது.
- source_word: בְּכָל מִשְׁלַח יָדְךָ
  choice: உன் கையின் ஒவ்வொரு முயற்சியிலும்
  rationale: ஒருவர் செய்யக் கையிடும் அனைத்தையும் குறிக்கும் எபிரெய மரபுத்தொடரின் கை உருவகத்தை வாசிக்கத்தக்க தமிழில் பாதுகாக்கிறது; இன்னும் நேரடியான வடிவம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: עַד הִשָּׁמֶדְךָ וְעַד אֲבָדְךָ מַהֵר
  choice: நீ அழிக்கப்பட்டு விரைவில் ஒழிந்துபோகும்வரை
  rationale: இரு இணையான அழிவு வினைகளின் வேறுபாட்டை ‘அழிக்கப்படுதல்’ மற்றும் ‘ஒழிந்துபோதல்’ என்று பாதுகாத்து, מַהֵר குறிப்பிடும் விரைவையும் வெளிப்படுத்துகிறது.
- source_word: מִפְּנֵי רֹעַ מַעֲלָלֶיךָ
  choice: உன் செயல்களின் தீமையின் காரணமாக
  rationale: தீர்ப்பிற்கான காரணத்தை நேரடியாகக் கூறி, ‘செயல்கள்’ மற்றும் அவற்றின் ‘தீமை’ என்ற மூலமொழி அமைப்பையும் காக்கிறது.
- source_word: אֲשֶׁר עֲזַבְתָּנִי
  choice: நீ என்னைக் கைவிட்ட
  rationale: எபிரெய உரையில் திடீரென வரும் முதலாம் நபர் ‘என்னை’ என்பதை மாற்றாமலும் விளக்கிச் சமனாக்காமலும் பாதுகாக்கிறது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூல உரை இறைப்பட்டத்தை அல்ல, நான்கு எழுத்துகளைக் கொண்ட தனிப்பட்ட உடன்படிக்கைப் பெயரை நேரடியாகப் பயன்படுத்துகிறது; எனவே பெயர் ஒலிபெயர்க்கப்படுகிறது.
- issue: உடன்படிக்கைத் தீர்ப்பின் செயற்பாட்டாளர்
  choice: யாவே நேரடியாக அனுப்புவார்
  alternative: சாபம் தானாக வந்தடையும்
  rationale: יְשַׁלַּח என்ற வினைக்கு யாவே வெளிப்படையான எழுவாய்; ஆகவே இறைச் செயலாற்றலை மென்மைப்படுத்தாமல் மொழிபெயர்க்கிறது.
- issue: ‘என்னைக் கைவிட்ட’ என்ற முதலாம் நபர் மாற்றம்
  choice: முதலாம் நபரை அப்படியே பாதுகாத்தல்
  alternative: ‘யாவேயைக் கைவிட்ட’ என்று மூன்றாம் நபராக விளக்குதல்
  rationale: வசனத்தின் தொடக்கத்தில் யாவே மூன்றாம் நபராக இருந்தாலும், முடிவில் மூல உரை ‘என்னை’ என்று கூறுகிறது. அந்த உரைத்தள மாறுதலை மொழிபெயர்ப்பு தீர்த்து மாற்றாமல் பாதுகாக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் மரியாதையும் வேதவாக்கியத்தின் எச்சரிக்கைத் தீவிரமும் காக்கப்பட்டுள்ளன. ஒருமை இரண்டாம் நபர் வடிவங்கள் தொடர்ந்து பயன்படுத்தப்பட்டுள்ளன. ‘கை’ என்ற எபிரெய உருவகம் முதன்மை உரையிலும் நேரடி வடிவில் அடிக்குறிப்பிலும் பாதுகாக்கப்பட்டுள்ளது.
