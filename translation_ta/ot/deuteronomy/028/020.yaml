revisions:
- from: 'நீ செய்யும் உன் கையின் ஒவ்வொரு முயற்சியிலும்[a] யாவே உன்மேல் சாபத்தையும், குழப்பத்தையும், கடிந்துரைத்தலையும் அனுப்புவார்; நீ என்னைக் கைவிட்ட உன் செயல்களின் தீமையின் காரணமாக, நீ அழிக்கப்பட்டு விரைவில் ஒழிந்துபோகும்வரை இவை உன்மேல் வரும்.


    [a] எபிரெயத்தில்: “உன் கையை நீட்டும் எல்லாவற்றிலும்”; அதாவது, நீ செய்ய முற்படும் அனைத்திலும்.'
  to: யாவே உன்மேல் சாபத்தையும், குழப்பத்தையும், கடிந்துரைத்தலையும் நீ கையிடும் ஒவ்வொரு காரியத்திலும்[a] அனுப்புவார்; நீ என்னைக் கைவிட்ட உன் தீய செயல்களினால், நீ அழிக்கப்படும் வரையும் விரைவில் அழிந்துபோகும் வரையும்.
  rationale: 'வாக்கியத்தை மூலத்தின் வரிசை மற்றும் செயற்பாட்டு அமைப்புக்கு நெருக்கமாக மாற்றியுள்ளேன்: யாவே அனுப்புகிறார்; அந்தத் தண்டனைகள் எல்லாச் செயல்களிலும் நிகழ்கின்றன; அழிவின் இரட்டை இணைத் தொடரும் காக்கப்படுகிறது. மூலத்தில் இல்லாத ‘இவை உன்மேல் வரும்’ நீக்கப்பட்டுள்ளது. அடிக்குறிப்பு எபிரெய ‘கை’ உருவகத்தையும் அதன் பொருளையும் தக்கவைக்கிறது.'
