  source_fidelity: மூலத்தின் எதிர்கால விளைவு, ‘பூமி’ என்ற பரந்த குறிப்பு, ஒருமை இரண்டாம் நபர், மற்றும் பயத்தின் பொருள் ஆகியவை வரைவில் சரியாகக் காக்கப்பட்டுள்ளன. ஆனால் נִקְרָא עָלֶיךָ என்பதிலுள்ள ‘பெயர் உன்மேல் அழைக்கப்படுதல்’ என்ற தனித்த உருவகத்தை ‘உன்மேல் சூட்டப்பட்டிருப்பது’ ஓரளவு விளக்கமாக மாற்றுகிறது; பெயர் ஒருவர்மேல் ‘சூட்டப்படுதல்’ தமிழில் இயல்பான இணைப்பு அல்ல.
