source:
  edition: WLC
  text: וְ/רָאוּ֙ כָּל עַמֵּ֣י הָ/אָ֔רֶץ כִּ֛י שֵׁ֥ם יְהוָ֖ה נִקְרָ֣א עָלֶ֑י/ךָ וְ/יָֽרְא֖וּ מִמֶּֽ/ךָּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/010.yaml
  text: Then all the peoples of the earth will see that the name of Yahweh is called upon you[a], and they will fear you.
translation:
  language: ta
  text: அப்போது, பூமியிலுள்ள எல்லா மக்களும் யாவேயின் பெயர் உன்மேல் அழைக்கப்பட்டிருப்பதைக் கண்டு, உனக்குப் பயப்படுவார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְרָאוּ
  choice: அப்போது ... கண்டு
  rationale: ஆசீர்வாதங்களின் தொடரில் வரும் விளைவைக் காட்ட எதிர்காலப் பொருளுடன் இயல்பான தமிழில் மொழிபெயர்க்கப்பட்டது; வாவ் இணைப்பின் தொடர்ச்சியும் காக்கப்படுகிறது.
- source_word: כָּל עַמֵּי הָאָרֶץ
  choice: பூமியின் மக்கள் அனைவரும்
  rationale: பல்வேறு இன மக்களைக் குறிக்கும் עַמֵּי என்பதையும், சர்வதேசச் சூழலில் הָאָרֶץ என்பதன் ‘பூமி’ என்ற பரந்த பொருளையும் வெளிப்படுத்துகிறது.
- source_word: שֵׁם יְהוָה
  choice: யாவேயின் பெயர்
  rationale: உடன்படிக்கையின் தெய்வீகப் பெயரான יהוה என்பதை ‘யாவே’ என்று நேரடியாகக் கொடுத்து, எபிரெயக் கட்டமைப்பையும் இயல்பான தமிழில் காக்கிறது.
- source_word: נִקְרָא עָלֶיךָ
  choice: உன்மேல் சூட்டப்பட்டிருப்பதை
  rationale: ‘பெயர் உன்மேல் அழைக்கப்பட்டுள்ளது’ என்ற எபிரெய மரபுத்தொடர், ஒருவர்மேல் பெயர் சூட்டப்பட்டு அவர் அந்தப் பெயருக்குரியவராக அடையாளப்படுத்தப்படுவதைச் சொல்கிறது. ‘சூட்டப்பட்டிருப்பது’ இந்தப் புறவயமான உடன்படிக்கை அடையாளத்தை இயல்பான தமிழில் காக்கிறது.
- source_word: וְיָרְאוּ מִמֶּךָּ
  choice: உனக்குப் பயப்படுவார்கள்
  rationale: ירא என்பதன் அச்சம் மற்றும் மரியாதை கலந்த பரப்பை ‘பயப்படு’ காக்கிறது; מן உடன் வரும் அச்சத்தின் இலக்கு தமிழில் ‘உனக்குப்’ என இயல்பாக வெளிப்படுகிறது.
theological_decisions:
- issue: יהוה என்ற தெய்வீகப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலத்தில் உடன்படிக்கைப் பெயர் நேரடியாக உள்ளது. அதை பொதுப்பட்டமாக மாற்றாமல் ‘யாவே’ என ஒலிபெயர்ப்பது மூலத்தின் தனிப்பெயரைக் காக்கிறது.
- issue: נִקְרָא עָלֶיךָ என்ற மரபுத்தொடரின் பொருள்
  choice: யாவேயின் பெயர் உன்மேல் சூட்டப்பட்டிருப்பது
  alternative: நீ யாவேயின் பெயரால் அழைக்கப்படுவது; யாவேயின் பெயர் உன்மேல் அறிவிக்கப்படுவது
  rationale: இந்த மரபுத்தொடர் இஸ்ரவேல் யாவேக்குரியதாகப் பொதுவில் அடையாளப்படுத்தப்படுவதை உணர்த்துகிறது. தேர்ந்த வடிவம் ‘உன்மேல்’ என்ற மூல உருவகத்தையும் உடைமை/அடையாளப் பொருளையும் காக்கிறது; மாற்று வாசிப்பை அடிக்குறிப்பு பதிவு செய்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் புரியக்கூடிய, ஆனால் வேதாகம உரைக்கு ஏற்ற கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ஒருமை இரண்டாம் நபர் ‘உன்/உனக்கு’ மூலம் இஸ்ரவேலை ஒருங்கிணைந்த உடன்படிக்கை மக்களாகக் குறிக்கும் மூல இலக்கணம் காக்கப்பட்டுள்ளது.
