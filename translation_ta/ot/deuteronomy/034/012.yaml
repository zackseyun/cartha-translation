base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/034/012.yaml
  text: and for all the mighty hand and for all the great awe that Moses did before the eyes of all Israel[a][b][c][d].
translation:
  language: ta
  text: மேலும், மோசே இஸ்ரவேலர் அனைவரின் கண்முன்பாக[d] செய்த வல்லமைமிக்க செயல்கள் அனைத்திலும்[a][b], பெரும் அச்சத்தை ஏற்படுத்திய செயல்கள் அனைத்திலும்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லுக்குச் சொல், ‘வலிமையான கரம்.’
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘வல்லமையான கரம்.’
    reason: lexical_alternative
  - marker: c
    text: அல்லது, ‘பெரும் பயங்கரம்’ அல்லது ‘பயமுறுத்தும் செயல்கள்.’
    reason: lexical_alternative
  - marker: d
    text: சொல்லுக்குச் சொல், ‘இஸ்ரவேல் அனைவரின் கண்களுக்கு முன்பாக’; அதாவது, தேசத்தார் அனைவரும் காணும்படி பொதுவில்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְכֹל
  choice: மேலும் ... அனைத்திலும்
  rationale: முந்தைய வசனத்தின் முடிவுரையைத் தொடரும் இணைப்பையும், כֹל என்பதன் முழுமையான பரப்பையும் காட்டுகிறது. தமிழில் தொடர்ச்சியான பட்டியலுக்கு இயல்பாக இருக்க לְ முன்னொட்டு ‘-இலும்’ என வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: הַיָּד הַחֲזָקָה
  choice: வல்லமைமிக்க செயல்கள்
  rationale: சொல்லுக்குச் சொல் ‘வலிமையான கை/கரம்.’ எபிரெய மொழியில் ‘கை’ ஆற்றலையும் செயலாற்றலையும் குறிக்கும் மரபுத்தொடர். மோசே செய்தவற்றைப் பற்றிய இச்சூழலில், இயல்பான தமிழில் அதன் பொருளை ‘வல்லமைமிக்க செயல்கள்’ எனத் தருகிறது; நேரடி உருவகம் அடிக்குறிப்புகளில் பாதுகாக்கப்படுகிறது.
- source_word: הַמּוֹרָא הַגָּדוֹל
  choice: பெரும் அச்சமூட்டிய செயல்கள்
  rationale: מוֹרָא என்பது அச்சம், பயங்கரம் அல்லது அச்சத்தை உண்டாக்கும் காட்சியைக் குறிக்கலாம். இங்கு மோசேயின் செயல்களைத் தொகுத்துச் சொல்வதால், பொருள் சார்ந்த ‘அச்சமூட்டிய செயல்கள்’ என்பது இயல்பானது; ‘பயங்கரம்’ என்ற கடுமையான ஒரே பொருளுக்குள் சொல்லைச் சுருக்கவில்லை.
- source_word: אֲשֶׁר עָשָׂה
  choice: செய்த
  rationale: עָשָׂה என்பதன் பரந்த அடிப்படைப் பொருளான ‘செய்’ என்பதை நேரடியாகவும் இயல்பாகவும் தக்கவைக்கிறது.
- source_word: מֹשֶׁה
  choice: மோசே
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் நிலைபெற்ற பெயர்வடிவம்.
- source_word: לְעֵינֵי
  choice: கண்முன்பாக
  rationale: ‘கண்களுக்கு முன்பாக’ என்ற எபிரெய உருவகத்தையும், எல்லாரும் காணும்படி பொதுவில் நடந்தது என்ற பொருளையும் சுருக்கமாகத் தக்கவைக்கிறது.
- source_word: כָּל יִשְׂרָאֵל
  choice: இஸ்ரவேலர் அனைவரின்
  rationale: இஸ்ரவேல் மக்கள் முழுவதையும் குறிக்கும் கூட்டு தேசியப் பொருளை இயல்பான தமிழில் வழங்குகிறது.
theological_decisions:
- issue: மோசேயின் இறுதி பாராட்டில் குறிப்பிடப்படும் செயல்களின் இயல்பு
  choice: இஸ்ரவேலர் அனைவரும் காணும்படி மோசே செய்த வல்லமைமிக்க, அச்சமூட்டிய செயல்களின் சுருக்கமாக மொழிபெயர்க்கப்பட்டது.
  alternative: ‘வலிமையான கரம்’ என்றும் ‘பெரும் பயங்கரம்’ என்றும் சொல்லுக்குச் சொல் மொழிபெயர்க்கலாம்.
  rationale: இறையியல் விளக்கத்தைப் புதிதாகச் சேர்க்காமல், எபிரெய மரபுத்தொடரின் பொருளையும் உரையின் பிரமாண்டத்தையும் தெரிவிக்கிறது. ‘அச்சமூட்டிய’ என்பது பயம், திகைப்பு, பிரமிப்பு ஆகியவற்றுக்கிடையேயுள்ள மூலச்சொல்லின் பொருள் விரிவை தேவையின்றி முடிவு செய்யாமல் விடுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. இந்த வசனம் முந்தைய வசனங்களின் வாக்கியத்தைத் தொடர்வதால், அதன் தொடக்கத் தொடர்பை ‘மேலும்’ என்றும் பட்டியல் அமைப்பை ‘-இலும்’ என்றும் பாதுகாக்கிறது. ‘கரம்’ என்ற எபிரெய உருவகத்தின் நேரடி வடிவங்கள் அடிக்குறிப்புகளில் தரப்பட்டுள்ளன.
