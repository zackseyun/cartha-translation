- from: மேலும், மோசே இஸ்ரவேலர் அனைவரின் கண்முன்பாக[d] செய்த வல்லமைமிக்க செயல்கள் அனைத்திலும்[a][b], பெரும் அச்சமூட்டிய செயல்கள் அனைத்திலும்[c].
