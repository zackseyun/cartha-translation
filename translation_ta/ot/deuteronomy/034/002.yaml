  text: וְ/אֵת֙ כָּל נַפְתָּלִ֔י וְ/אֶת אֶ֥רֶץ אֶפְרַ֖יִם וּ/מְנַשֶּׁ֑ה וְ/אֵת֙ כָּל אֶ֣רֶץ יְהוּדָ֔ה עַ֖ד הַ/יָּ֥ם הָ/אַחֲרֽוֹן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/034/002.yaml
  text: and all Naphtali[a], and the land of Ephraim and Manasseh, and all the land of Judah as far as the western sea,
translation:
  language: ta
  text: நப்தலி முழுவதையும், எப்பிராயீம் மற்றும் மனாசேயின் நிலப்பகுதியையும், யூதாவின் நிலம் முழுவதையும் மேற்குக் கடல்[a] வரை காண்பித்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லுக்குச் சொல், “கடைசிக் கடல்” அல்லது “பின்புறக் கடல்.” இது மேற்கிலுள்ள கடலை, அதாவது மத்தியதரைக் கடலைக் குறிக்கும் எபிரெய மொழிவழக்கு.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל נַפְתָּלִי
  choice: நப்தலி முழுவதையும்
  rationale: כָּל என்பதன் முழுமை வலியுறுத்தப்படுகிறது; இங்கு கோத்திரப் பெயர் அதன் நிலப்பகுதியைக் குறிக்கும் புவியியல் பயன்பாட்டில் இருப்பதால், தமிழில் தேவையின்றி விளக்கச் சொல் சேர்க்காமல் இயல்பாக மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: אֶרֶץ אֶפְרַיִם וּמְנַשֶּׁה
  choice: எப்பிராயீம் மற்றும் மனாசேயின் நிலப்பகுதியையும்
  rationale: אֶרֶץ என்பது இச்சூழலில் நாடு அல்லது நிலப்பரப்பைக் குறிக்கிறது. இணைக்கப்பட்ட இரு கோத்திரப் பெயர்களும் ஒரே புவியியல் தொடராகத் தெளிவாகத் தரப்பட்டுள்ளன.
- source_word: כָּל אֶרֶץ יְהוּדָה
  choice: யூதாவின் நிலம் முழுவதையும்
  rationale: மூலத்தில் வெளிப்படையாக உள்ள אֶרֶץ (‘நிலம்’) தக்கவைக்கப்பட்டு, כָּל குறிக்கும் முழுமையும் இயல்பான தமிழ் சொல் வரிசையில் வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: עַד
  choice: வரையிலான
  rationale: பார்வைக்கு எட்டிய புவியியல் எல்லையை அல்லது பரப்பை עַד குறிக்கிறது; ‘வரையிலான’ என்பது இதை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: הַיָּם הָאַחֲרוֹן
  choice: மேற்குக் கடல்
  rationale: சொல்லுக்குச் சொல் ‘பின்புறக் கடல்’ அல்லது ‘கடைசிக் கடல்’ என்றாலும், இது மேற்குத் திசையிலுள்ள கடலைக் குறிக்கும் எபிரெய திசைமுறைச் சொற்றொடர். ‘மேற்குக் கடல்’ அதன் பொருளைத் தெளிவாகத் தருகிறது; ‘மத்தியதரைக் கடல்’ என்ற அடையாளம் முதன்மை உரையில் சேர்க்கப்படவில்லை.
