translation_notes:
  register: நவீனத் தரத் தமிழில், மரியாதையும் வாசிப்பின் இயல்பும் காக்கப்பட்டுள்ளன. இந்த வசனம் முந்தைய வசனத்தில் தொடங்கும் வாக்கியத்தின் தொடராக இருந்தாலும், வழங்கப்பட்ட தனி வசனம் தமிழில் முழுமையாகப் புரிய ‘அவர் காண்பித்தார்’ என்பது சூழலிலிருந்து நிறைவு வினையாகச் சேர்க்கப்பட்டுள்ளது.
