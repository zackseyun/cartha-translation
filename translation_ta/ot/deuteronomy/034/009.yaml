  text: וִֽ/יהוֹשֻׁ֣עַ בִּן נ֗וּן מָלֵא֙ ר֣וּחַ חָכְמָ֔ה כִּֽי סָמַ֥ךְ מֹשֶׁ֛ה אֶת יָדָ֖י/ו עָלָ֑י/ו וַ/יִּשְׁמְע֨וּ אֵלָ֤י/ו בְּנֵֽי יִשְׂרָאֵל֙ וַֽ/יַּעֲשׂ֔וּ כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/034/009.yaml
  text: And Joshua son of Nun was full of the spirit of wisdom[a], because Moses had laid his hands on him[b]. So the sons of Israel listened to him and did as Yahweh had commanded Moses.
translation:
  language: ta
  text: நூனின் மகனான யோசுவா ஞானத்தின் ஆவியால் நிறைந்திருந்தார்[a]; ஏனெனில் மோசே தம் கைகளை அவர்மேல் வைத்திருந்தார். ஆகவே இஸ்ரவேலின் மகன்கள்[b] அவருக்குச் செவிகொடுத்து, யாவே மோசேக்குக் கட்டளையிட்டபடியே செய்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஞானத்தின் ஆவியால் நிரப்பப்பட்டிருந்தார்.” எபிரெயச் சொற்றொடரைப் பொதுவாக “ஞானத்தின் ஓர் ஆவி” என்றும், குறிப்பாக இறைவன் அளித்த வல்லமை என்றும் புரிந்துகொள்ளலாம்.
    reason: alternative_reading
  - marker: b
    text: 'அல்லது, “இஸ்ரவேலர்,” “இஸ்ரவேல் மக்கள்,” அல்லது “இஸ்ரவேலின் பிள்ளைகள்.” சொல்லுக்குச் சொல்: “இஸ்ரவேலின் மகன்கள்.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: מָלֵא רוּחַ חָכְמָה
  choice: ஞானத்தின் ஆவியால் நிறைந்திருந்தார்
  rationale: מָלֵא என்ற நிலைவிளக்குச் சொல்லின் இயல்பான பொருளையும், רוּחַ חָכְמָה என்ற எபிரெயக் கட்டமைப்பின் இறையியல் ஒலிப்பையும் காக்கிறது. இது பரிசுத்த ஆவியை நேரடியாகக் குறிக்கிறதா அல்லது ஞானத்தை அளிக்கும் ஆவிக்குரிய அருளாற்றலைக் குறிக்கிறதா என்பதை உரையைவிட அதிகமாகத் தீர்மானிப்பதில்லை.
- source_word: רוּחַ
  choice: ஆவி
  rationale: இச்சூழலில் ஞானத்துடன் தொடர்புடைய உயிரூட்டும் அல்லது அருளளிக்கும் ஆற்றலைக் குறிக்கிறது. தமிழில் பெரிய/சிறிய எழுத்து வேறுபாடு இல்லாததால், அதன் குறிப்பான அடையாளம் அடிக்குறிப்பில் திறந்தவாறு வைக்கப்படுகிறது.
- source_word: סָמַךְ ... אֶת יָדָיו עָלָיו
  choice: தன் கைகளை அவர்மேல் வைத்திருந்தார்
  rationale: அதிகாரப்பூர்வமாகக் கைகளை வைக்கும் செயலை இயல்பான நவீன தமிழில் தெரிவிக்கிறது; எபிரெயில் உள்ள பன்மையான ‘கைகள்’ என்பதையும் காக்கிறது.
- source_word: וַיִּשְׁמְעוּ אֵלָיו
  choice: அவருக்குச் செவிகொடுத்து
  rationale: שׁמע உடன் אֶל வரும்போது கவனமாகக் கேட்பதையும் கீழ்ப்படிதலையும் உணர்த்தலாம். அடுத்துள்ள ‘செய்தார்கள்’ என்ற வினை கீழ்ப்படிதலை வெளிப்படையாகச் சொல்வதால், இங்கு கேட்டு ஏற்றுக்கொண்டதன் நுணுக்கம் காக்கப்படுகிறது.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் மகன்கள்
  rationale: எபிரெயின் ஆண்பால் பன்மை குடும்பமுறை மொழியை நேரடியாகக் காத்து, உடன்படிக்கைச் சமூகத்தின் மரபுவழித் தொடர்பையும் வெளிப்படுத்துகிறது.
- source_word: וַיַּעֲשׂוּ כַּאֲשֶׁר צִוָּה יְהוָה אֶת מֹשֶׁה
  choice: யாவே மோசேக்குக் கட்டளையிட்டபடியே செய்தார்கள்
  rationale: இஸ்ரவேலர் முன்பு மோசேக்கு அளிக்கப்பட்ட யாவேயின் கட்டளைக்கிணங்கச் செயல்பட்டார்கள் என்ற பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெயின் தனிப்பட்ட இறைப்பெயரை பட்டப்பெயராக மாற்றாமல், தமிழில் பரவலாக அறியத்தக்க ஒலிபெயர்ப்பில் வழங்குகிறது.
theological_decisions:
- issue: ‘ஞானத்தின் ஆவி’ என்பது பரிசுத்த ஆவியை நேரடியாகக் குறிக்கிறதா
  choice: ‘ஞானத்தின் ஆவி’ என்று குறிப்பான அடையாளத்தைத் தீர்மானிக்காமல் மொழிபெயர்த்தல்
  alternative: ‘ஞானத்தை அருளும் பரிசுத்த ஆவி’ என்று வெளிப்படையாக அடையாளப்படுத்துதல்
  rationale: யோசுவா இறைவனால் ஞானத்துக்காக அருள்பெற்றவர் என்பதைச் சூழல் உணர்த்தினாலும், רוּחַ חָכְמָה என்ற சொற்றொடர் மட்டும் ‘பரிசுத்த ஆவி’ என்ற முழுமையான அடையாளத்தை கட்டாயப்படுத்தவில்லை. ஆகவே மூலத்தின் இறையியல் திறந்தநிலை காக்கப்படுகிறது.
- issue: בְּנֵי יִשְׂרָאֵל என்பதிலுள்ள பாலின மற்றும் குடும்பமுறை மொழி
  choice: இஸ்ரவேலின் மகன்கள்
  alternative: இஸ்ரவேலர் / இஸ்ரவேல் மக்கள் / இஸ்ரவேலின் பிள்ளைகள்
  rationale: மூலத்தில் உள்ள ஆண்பால் பன்மை குடும்பமுறைச் சொல்லாட்சியை மறைக்காமல் காக்கிறது; பொதுவான மாற்று வாசிப்புகள் அடிக்குறிப்பில் தரப்படுகின்றன.
translation_notes:
  register: நவீன தரத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. யோசுவாவையும் மோசேயையும் குறிக்க மரியாதைப் பன்மை பயன்படுத்தப்பட்டுள்ளது. ‘செவிகொடுத்து’ என்பது கவனமாகக் கேட்டு ஏற்றுக்கொள்வதையும், அடுத்த வாக்கியப்பகுதி கீழ்ப்படிந்து செயல்பட்டதையும் தெளிவுபடுத்துகிறது.
