  text: וּ/מֹשֶׁ֗ה בֶּן מֵאָ֧ה וְ/עֶשְׂרִ֛ים שָׁנָ֖ה בְּ/מֹת֑/וֹ לֹֽא כָהֲתָ֥ה עֵינ֖/וֹ וְ/לֹא נָ֥ס לֵחֹֽ/ה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/034/007.yaml
  text: Moses was one hundred twenty years old when he died[a]; his eye had not grown dim[b], and his vigor had not fled.
translation:
  language: ta
  text: மோசே இறந்தபோது அவருக்கு நூற்று இருபது வயது. அவருடைய கண்பார்வை மங்கவில்லை[a]; அவருடைய உடல் வலிமையும் குறையவில்லை.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: நேரடியாக, “அவருடைய கண் மங்கவில்லை.” எபிரெயத்தில் ஒருமையில் வரும் “கண்,” இங்கு கண்பார்வையைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: நேரடியாக, “அவருடைய புத்துணர்ச்சி ஓடிப்போகவில்லை.” இது அவருடைய இயல்பான உடல் ஆற்றல் அல்லது வீரியம் குறையவில்லை என்றும் பொருள்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמֹשֶׁה
  choice: மோசே
  rationale: வாவ் இணைப்புச்சொல் கதையின் தொடர்ச்சியைக் குறிக்கிறது; தமிழில் வசனத் தொடக்கத்தில் தனியே ‘மேலும்’ என்று இடுவது செயற்கையாக இருப்பதால் சூழலின் தொடர்ச்சிக்கே விடப்பட்டுள்ளது.
- source_word: בֶּן מֵאָה וְעֶשְׂרִים שָׁנָה
  choice: அவருக்கு நூற்று இருபது வயது
  rationale: ‘நூற்று இருபது ஆண்டுகளின் மகன்’ என்ற எபிரெய வயதைக் குறிக்கும் மரபுத்தொடரை இயல்பான நவீன தமிழில் பொருளுக்கு நெருக்கமாக வழங்குகிறது.
- source_word: בְּמֹתוֹ
  choice: இறந்தபோது
  rationale: முன்னொட்டும் பெயர்ச்சொல்லும் உடைமைப் பின்னொட்டும் சேர்ந்த தொடர் காலப் பொருளில் ‘அவர் இறந்தபோது’ என்பதைக் குறிக்கிறது.
- source_word: לֹא כָהֲתָה עֵינוֹ
  choice: அவருடைய கண்பார்வை மங்கவில்லை
  rationale: எபிரெயத்தில் ‘அவருடைய கண் மங்கவில்லை’ என்று ஒருமையில் இருந்தாலும், அது பார்வைத்திறனைக் குறிக்கும் மரபுத்தொடர்; தமிழில் ‘கண்பார்வை’ தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: וְלֹא נָס לֵחֹה
  choice: அவருடைய உடல் வலிமையும் குறையவில்லை
  rationale: לֵחֹה என்பது உடலின் புத்துணர்ச்சி, இயல்பான ஆற்றல் அல்லது வீரியத்தைக் குறிக்கலாம்; נָס என்பதன் நேரடிப் பொருள் ‘ஓடிப்போனது’. தமிழில் பொருளைத் தெளிவாகத் தர ‘உடல் வலிமை குறையவில்லை’ என வழங்கி, சொல்லுருவகத்தையும் பரந்த பொருள் வாய்ப்பையும் அடிக்குறிப்பில் பதிவு செய்கிறது.
theological_decisions:
- issue: לֵחֹה என்பதன் பொருள் வரம்பு
  choice: உடல் வலிமை
  alternative: புத்துணர்ச்சி / இயல்பான ஆற்றல் / வீரியம்
  rationale: அரிய எபிரெயச் சொல்லின் துல்லியமான உடல்சார் நுண்பொருள் உறுதியற்றது. முதன்மை உரையில் பொதுவாகப் புரியும் சொல் தேர்ந்தெடுக்கப்பட்டு, மாற்றுப் பொருள்கள் அடிக்குறிப்பில் பாதுகாக்கப்படுகின்றன; பாலியல் வீரியம் போன்ற குறுகிய விளக்கம் உரைக்குள் திணிக்கப்படவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான நடை. எபிரெய ஒருமை ‘கண்’ தமிழில் தெளிவுக்காக ‘கண்பார்வை’ எனப் பொருளாக்கப்பட்டுள்ளது. இறுதி அரிய மரபுத்தொடரின் உருவகமும் பொருள் நிச்சயமின்மையும் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளன.
