  text: וְ/לֹֽא קָ֨ם נָבִ֥יא ע֛וֹד בְּ/יִשְׂרָאֵ֖ל כְּ/מֹשֶׁ֑ה אֲשֶׁר֙ יְדָע֣/וֹ יְהוָ֔ה פָּנִ֖ים אֶל פָּנִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/034/010.yaml
  text: And no prophet has arisen again in Israel like Moses[a], whom Yahweh knew face to face.
translation:
  language: ta
  text: மோசேயைப் போன்ற ஓர் இறைவாக்கினர் அதன்பின்[a] இஸ்ரவேலில் எழும்பவில்லை; அவரை யாவே முகமுகமாய் அறிந்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இதுவரை.” இங்குள்ள எபிரெய வினையடை, மோசேக்குப் பிறகு அவரைப் போன்ற இறைவாக்கினர் எழவில்லை என்பதையோ, கதைசொல்லியின் காலம் வரையில் அப்படிப்பட்டவர் இன்னும் எழவில்லை என்பதையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלֹא קָם
  choice: எழும்பவில்லை
  rationale: קום என்பது இங்கு ஓர் இறைவாக்கினர் தோன்றுவதை அல்லது எழுவதைச் சுட்டுகிறது. தமிழ் வேதாகம நடைக்கும் இயல்பான நவீன மொழிக்கும் ஏற்றவாறு ‘எழும்பவில்லை’ என மொழிபெயர்க்கப்பட்டுள்ளது; தொடக்க இணைப்பான וְ தமிழில் தனியே வெளிப்படுத்தப்படாவிட்டாலும் தொடர்ச்சிப் பொருள் வாக்கிய அமைப்பில் நிலைக்கிறது.
- source_word: נָבִיא
  choice: இறைவாக்கினர்
  rationale: இறைவனிடமிருந்து செய்தியைப் பெற்று அறிவிப்பவரைக் குறிக்கும் நவீன, கண்ணியமான பொதுத்தமிழ்ச் சொல்.
- source_word: עוֹד
  choice: அதன்பின்
  rationale: மோசேக்குப் பிற்பட்ட காலத்தில் அவரைப் போன்ற வேறோர் இறைவாக்கினர் எழவில்லை என்ற பின்னோக்குச் சுருக்கத்தை இயல்பான தமிழில் தெரிவிக்கிறது. ‘இதுவரை’ என்ற காலநிலைக் கருத்தும் எபிரெயச் சொல்லில் சாத்தியமுள்ளதால் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: בְּיִשְׂרָאֵל
  choice: இஸ்ரவேலில்
  rationale: ஒப்பிடத்தக்க இறைவாக்கினர் எழாத வட்டாரத்தை בְּ குறிக்கிறது; ‘இஸ்ரவேலில்’ என்பது நேரான, இயல்பான மொழிபெயர்ப்பு.
- source_word: כְּמֹשֶׁה
  choice: மோசேயைப் போன்ற
  rationale: כְּ குறிக்கும் எளிய ஒப்பீட்டைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: אֲשֶׁר יְדָעוֹ יְהוָה
  choice: அவரை யாவே அறிந்திருந்தார்
  rationale: מֹשֶׁה என்பவரையே ידע வினையின் பொருளாகத் தொடர்புப்பெயர் சுட்டுகிறது. நிறைவுற்ற பின்னோக்குப் பார்வையைத் தமிழில் ‘அறிந்திருந்தார்’ இயல்பாக வெளிப்படுத்துகிறது; ידע என்பதன் உறவுசார் ஆழத்தை அடுத்த சொற்றொடர் விளக்குகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய இறைப்பெயரான நான்கு எழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் பொதுவாகப் புரியக்கூடிய ஒலிபெயர்ப்பாகத் தருகிறது.
- source_word: פָּנִים אֶל פָּנִים
  choice: முகமுகமாக
  rationale: நேரடியான தனிப்பட்ட சந்திப்பைக் குறிக்கும் எபிரெய உருவகத்தையும் அதன் வேதாகம இடையொலியையும் சுருக்காமல் பாதுகாக்கிறது.
theological_decisions:
- issue: யாவே மோசேயை அறிந்த விதத்தை விவரிக்கும் மனித உருவக மொழி
  choice: ‘முகமுகமாக’ என்ற உருவகத்தை அப்படியே வைத்தல்
  alternative: ‘நேரடியாக’ அல்லது ‘தனிப்பட்ட முறையில்’ என்று பொருளாக்குதல்
  rationale: மூல எபிரெயம் உறுதியான உருவக மொழியைப் பயன்படுத்துகிறது. அதை அருவமான விளக்கமாக மாற்றாமல் வைத்திருப்பது, மோசே பெற்ற வெளிப்பாட்டின் தனித்துவமான நேரடித்தன்மையையும் உரையின் இறையியல் அழுத்தத்தையும் பாதுகாக்கிறது; அதேவேளையில் கடவுளின் உடலமைப்பைப் பற்றிய ஒரு குறிப்பிட்ட கோட்பாட்டை மொழிபெயர்ப்பு திணிப்பதில்லை.
translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான வேதாகம நடையைப் பேணுகிறது. ‘இறைவாக்கினர்’ என்பது எளிதில் புரியும் சமகாலச் சொல்; ‘முகமுகமாக’ என்பது மூலத்தின் செறிவான உருவகத்தைப் பாதுகாக்கிறது. எபிரெயச் சொல் ஒழுங்கை அப்படியே பின்பற்றாமல், தமிழில் இயல்பான வாக்கிய ஓட்டத்திற்காக ஒப்பீட்டுத் தொடர் முன்னிலைப்படுத்தப்பட்டுள்ளது.
