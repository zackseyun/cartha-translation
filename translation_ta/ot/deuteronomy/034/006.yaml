  text: וַ/יִּקְבֹּ֨ר אֹת֤/וֹ בַ/גַּיְ֙ בְּ/אֶ֣רֶץ מוֹאָ֔ב מ֖וּל בֵּ֣ית פְּע֑וֹר וְ/לֹֽא יָדַ֥ע אִישׁ֙ אֶת קְבֻ֣רָת֔/וֹ עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/034/006.yaml
  text: And he buried him in the valley in the land of Moab[a], opposite Beth-peor[b], and no one knows his burial place to this day.
translation:
  language: ta
  text: அவர் அவரை மோவாப் நாட்டிலுள்ள பள்ளத்தாக்கில், பெத்-பெயோருக்கு எதிரே அடக்கம் செய்தார்.[a] அவருடைய அடக்க இடம் எங்கே உள்ளது என்பது இன்றுவரை ஒருவருக்கும் தெரியாது.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அடக்கம் செய்தார்” என்பதன் எழுவாய் இந்த வசனத்தில் பெயரிடப்படவில்லை; முந்தைய வசனத்தின் சூழல் கர்த்தரைக் குறிக்கிறது.
    reason: alternative_reading
  - marker: b
    text: எபிரெயத்தில் சொல்லுக்குச் சொல், “ஒரு மனிதனும் அறியவில்லை”; இங்கு இது பொதுப்பொருளில் எவரையும் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְבֹּר אֹתוֹ
  choice: அவர் அவரை அடக்கம் செய்தார்
  rationale: Qal மூன்றாம் நபர் ஆண்பால் ஒருமை வினைச்சொல்லின் செயப்பாட்டு வடிவைத் தக்கவைக்கிறது. செய்பவர் வசனத்திலேயே பெயரிடப்படாததால், சூழலால் அறியக்கூடிய மரியாதை ஒருமையான ‘அவர்’ பயன்படுத்தப்படுகிறது.
- source_word: בַגַּיְ
  choice: பள்ளத்தாக்கில்
  rationale: גַּיְ என்பதன் பள்ளத்தாக்கு/பள்ளம் என்ற இடவியல் பொருளை இயல்பான பொதுத் தமிழில் தருகிறது.
- source_word: בְּאֶרֶץ מוֹאָב
  choice: மோவாப் நாட்டிலுள்ள
  rationale: ‘மோவாபின் நாட்டில்’ என்ற எபிரெயக் கூறின் தெளிவையும் இயல்பான தமிழ் தொடரமைப்பையும் பேணுகிறது.
- source_word: מוּל בֵּית פְּעוֹר
  choice: பெத்-பெயோருக்கு எதிரே
  rationale: מוּל குறிக்கும் எதிர்நோக்கிய இடநிலையைத் துல்லியமாகத் தருகிறது; இடப்பெயர் ஒலிபெயர்க்கப்படுகிறது.
- source_word: וְלֹא יָדַע אִישׁ
  choice: ஒருவருக்கும் தெரியாது
  rationale: אִישׁ இங்கு பொதுப்பொருளில் ‘எவரும் இல்லை’ எனப் பயன்படுகிறது. ‘ஒருவருக்கும் தெரியாது’ என்பது பாலினத்தைக் குறிப்பாக்காமல் மூலத்தின் பொதுவான மறுப்பை இயல்பான நவீன தமிழில் வழங்குகிறது.
- source_word: קְבֻרָתוֹ
  choice: அவருடைய கல்லறை எங்கே இருக்கிறது
  rationale: இச்சூழலில் பெயர்ச்சொல் அடக்கப்பட்ட இடத்தைக் குறிக்கிறது. இருப்பிடமே அறியப்படவில்லை என்பதைத் தமிழில் தெளிவாக்குகிறது.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: இன்றுவரை
  rationale: கதைசொல்லியின் காலம்வரை நீடிக்கும் நிலையைச் சுருக்கமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: ‘அடக்கம் செய்தார்’ என்பதன் எழுவாய் யார்?
  choice: பெயரைச் சேர்க்காமல் ‘அவர்’ என்று மூலத்தின் மறைமுக எழுவாயைத் தக்கவைத்தல்
  alternative: முந்தைய வசனத்தின் அடிப்படையில் ‘கர்த்தர் அவரை அடக்கம் செய்தார்’ என்று வெளிப்படையாகக் குறிப்பிடுதல்; அல்லது ‘அவர் அடக்கம் செய்யப்பட்டார்’ என்று செய்வினையைச் செயப்பாட்டுவினையாக மாற்றுதல்
  rationale: முந்தைய வசனம் எழுவாய் கர்த்தர் என்பதை வலுவாகச் சுட்டினாலும், இவ்வசனத்தின் எபிரெய உரை எழுவாயைத் தனியே பெயரிடவில்லை. ஆகவே விளக்கத்தை முதன்மை உரைக்குள் கட்டாயப்படுத்தாமல் உண்மையான இலக்கண மறைமுகத்தன்மை பேணப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டது. ‘ஒருவருக்கும் தெரியாது’ என்பது אִישׁ என்பதன் இங்குள்ள பொதுப்பொருளை இயல்பாக வழங்குகிறது. அனைத்து அடிக்குறிப்பு குறியீடுகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
