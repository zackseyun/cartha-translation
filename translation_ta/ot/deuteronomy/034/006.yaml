revisions:
- from: அவர் மோவாப் நாட்டிலுள்ள பள்ளத்தாக்கில், பெத்-பெயோருக்கு எதிரே, அவரை அடக்கம் செய்தார்.[a] அவருடைய கல்லறை எங்கே இருக்கிறது என்பது இன்றுவரை ஒருவருக்கும் தெரியாது.
  to: அவர் அவரை மோவாப் நாட்டிலுள்ள பள்ளத்தாக்கில், பெத்-பெயோருக்கு எதிரே அடக்கம் செய்தார்.[a] அவருடைய அடக்க இடம் எங்கே உள்ளது என்பது இன்றுவரை ஒருவருக்கும் தெரியாது.[b]
  rationale: The revision retains the Hebrew's active but unnamed singular subject and the place-name transliteration. It replaces the potentially over-specific ‘கல்லறை’ with ‘அடக்க இடம்’ and adds an appropriately placed note for the generic expression אִישׁ. No doctrinal identification has been inserted into the main text.
