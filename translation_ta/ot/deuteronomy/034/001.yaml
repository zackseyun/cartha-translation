source:
  edition: WLC
  text: וַ/יַּ֨עַל מֹשֶׁ֜ה מֵֽ/עַרְבֹ֤ת מוֹאָב֙ אֶל הַ֣ר נְב֔וֹ רֹ֚אשׁ הַ/פִּסְגָּ֔ה אֲשֶׁ֖ר עַל פְּנֵ֣י יְרֵח֑וֹ וַ/יַּרְאֵ֨/הוּ יְהוָ֧ה אֶת כָּל הָ/אָ֛רֶץ אֶת הַ/גִּלְעָ֖ד עַד דָּֽן־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/034/001.yaml
  text: 'Then Moses went up from the plains of Moab to Mount Nebo[a], to the top of Pisgah, which is opposite Jericho. And Yahweh showed him all the land: Gilead as far as Dan.'
translation:
  language: ta
  text: 'பின்பு மோசே மோவாபின் சமவெளிகளிலிருந்து நேபோ மலைக்கு, அதாவது எரிகோவுக்கு எதிரே உள்ள பிஸ்காவின் உச்சிக்கு, ஏறிச் சென்றார். யாவே அவருக்கு நாடு முழுவதையும் காண்பித்தார்: தாண் வரையிலான கிலேயாத்தை.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யாவே அவரை நாடு முழுவதையும் காணும்படி செய்தார்.”
    reason: ראה வினையின் ஹிஃபில் காரணவினை வடிவத்தை இன்னும் வெளிப்படையாகக் காட்டும் மாற்று மொழியாக்கம்.
lexical_decisions:
- source_word: וַיַּעַל
  choice: ஏறிச் சென்றார்
  rationale: עלה மேல்நோக்கிய இயக்கத்தைக் குறிக்கிறது. ‘ஏறிச் சென்றார்’ என்பது திசை உணர்வைப் பாதுகாக்கும் இயல்பான நவீனத் தமிழ் நடை.
- source_word: מֵעַרְבֹת מוֹאָב
  choice: மோவாபின் சமவெளிகளிலிருந்து
  rationale: עַרְבוֹת என்பது சமவெளி அல்லது புல்வெளிப் பகுதியைக் குறிக்கிறது; இப்புவியியல் சூழலில் ‘சமவெளிகள்’ தெளிவான மொழிபெயர்ப்பு.
- source_word: הַר נְבוֹ
  choice: நேபோ மலை
  rationale: הר என்பதன் பொருள் ‘மலை’; இடப்பெயருடன் தமிழில் இயல்பாக ‘நேபோ மலை’ என வழங்கப்படுகிறது.
- source_word: רֹאשׁ הַפִּסְגָּה
  choice: பிஸ்காவின் உச்சி
  rationale: רֹאשׁ என்பதன் அடிப்படைப் பொருள் ‘தலை’; இங்கு மலையின் மேல்பகுதியைக் குறிக்கும் மரபுத்தொடராக இருப்பதால் ‘உச்சி’ என்று மொழிபெயர்க்கப்பட்டது.
- source_word: אֲשֶׁר עַל פְּנֵי יְרֵחוֹ
  choice: எரிகோவுக்கு எதிரே அமைந்த
  rationale: புவியியல் விளக்கத்தில் עַל־פְּנֵי என்பது ‘எதிரே’ அல்லது ‘நோக்கியவாறு’ என்ற பொருளைத் தருகிறது; ‘எதிரே அமைந்த’ என்பது தமிழில் தெளிவாக உள்ளது.
- source_word: וַיַּרְאֵהוּ יְהוָה
  choice: யாவே அவருக்கு … காண்பித்தார்
  rationale: ראה வினையின் ஹிஃபில் வடிவம் ‘காணும்படி செய்தார்/காண்பித்தார்’ என்ற காரணவினைப் பொருளுடையது. ‘காண்பித்தார்’ இயல்பாகவும் சுருக்கமாகவும் அதைப் பாதுகாக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இது இறைப்பட்டம் அல்ல, நான்கெழுத்து இறைப்பெயர். தனிப்பட்ட உடன்படிக்கைப் பெயரைப் பாதுகாக்க ‘யாவே’ என ஒலிபெயர்க்கப்பட்டது.
- source_word: כָּל הָאָרֶץ
  choice: நாடு முழுவதையும்
  rationale: הָאָרֶץ இங்கு முழு உலகத்தைக் குறிக்காமல் பார்வைக்குக் காட்டப்பட்ட நாட்டைக் குறிக்கிறது; ‘நாடு முழுவதையும்’ சூழலுக்கேற்றது.
- source_word: אֶת הַגִּלְעָד עַד דָּן
  choice: தாண் வரையிலான கிலேயாத்தை
  rationale: עַד எல்லை அல்லது விரிவைக் குறிக்கிறது. இந்தச் சொற்றொடர் மோசே கண்ட நாட்டின் பகுதிகளை விவரிக்கத் தொடங்குவதால், மூலத்தின் பெயர்ச்சொல் அமைப்பை நெருக்கமாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழியாக்கம்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூல வசனம் நான்கெழுத்து இறைப்பெயரை நேரடியாகப் பயன்படுத்துகிறது. அதை ஒரு பட்டமாக மாற்றாமல் தனிப்பட்ட பெயராக ஒலிபெயர்ப்பது மூலத்தின் வேறுபாட்டைப் பாதுகாக்கிறது.
- issue: וַיַּרְאֵהוּ என்ற காரணவினையின் நுட்பம்
  choice: அவருக்கு … காண்பித்தார்
  alternative: அவரை … காணும்படி செய்தார்
  rationale: இரண்டும் ஹிஃபில் காரணவினைப் பொருளை வெளிப்படுத்துகின்றன. முதன்மை உரையில் இயல்பான ‘காண்பித்தார்’ பயன்படுத்தப்பட்டு, அதிக வடிவச்சார்பான மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், மரியாதையும் வேதாகம உரைக்குரிய கண்ணியமும் காக்கப்பட்டுள்ளன. புவியியல் பெயர்கள் பொதுவாக அறியப்படும் தமிழ் ஒலிபெயர்ப்பில் தரப்பட்டுள்ளன; மூலத்தின் பட்டியல் தொடக்கத்தை உணர்த்த இடைக்கோடுகள் பயன்படுத்தப்பட்டுள்ளன.
