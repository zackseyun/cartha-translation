revisions:
- from: பின்பு மோசே மோவாபின் சமவெளிகளிலிருந்து நேபோ மலையிலுள்ள, எரிகோவுக்கு எதிரே அமைந்த பிஸ்காவின் உச்சிக்கு ஏறிச் சென்றார். யாவே அவருக்கு நாடு முழுவதையும்—தாண் வரையிலான கிலேயாத்தை—காண்பித்தார்.[a]
