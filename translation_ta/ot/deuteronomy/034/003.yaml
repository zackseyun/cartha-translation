translation_notes:
  register: நவீன நிலையான தமிழில், கண்ணியமான ஆனால் எளிதில் புரியும் நடையுடன் மொழிபெயர்க்கப்பட்டது. இவ்வசனம் முந்தைய வசனத்தின் வினையைத் தொடரும் பட்டியலாக இருந்தாலும், தமிழில் வசனம் தனியாகவும் புரியுமாறு சூழலிலிருந்து பெறப்படும் ‘காட்டினார்’ சேர்க்கப்பட்டது; இடைச்செருகல் போன்ற விளக்க விரிவாக்கம் தவிர்க்கப்பட்டது. சமவெளி–எரிகோ பள்ளத்தாக்கு–பனைமரங்களின் நகரம் ஆகியவை ஒரே புவியியல் தொடரை விளக்கும் வகையில் நீள்கோடுகள் பயன்படுத்தப்பட்டன.
