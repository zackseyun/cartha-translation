base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/034/003.yaml
  text: and the Negev[a], and the plain, the valley of Jericho, the city of palm trees[b], as far as Zoar.
translation:
  language: ta
  text: நெகேபையும்[a], பனைமரங்களின் நகரமான எரிகோவின் பள்ளத்தாக்குச் சமவெளியையும்[b], சோவார் வரையிலும் காட்டினார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘தெற்குப்பகுதி.’ எபிரெயச் சொல் ஓர் இடப்பெயராகவும் திசை அல்லது புவியியல் பகுதியைக் குறிக்கும் சொல்லாகவும் பயன்படலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘எரிகோவின் பள்ளத்தாக்குச் சமவெளி’ என்பதிலுள்ள ‘பள்ளத்தாக்கு’ என்பதற்குப் பதிலாக ‘சமவெளி’; எபிரெயச் சொல் அகன்ற பள்ளத்தாக்கையோ சமவெளியையோ குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנֶּגֶב
  choice: நெகேப்
  rationale: இங்கு இது மோசேக்குக் காட்டப்பட்ட நிலப்பகுதிகளின் பட்டியலில் வரும் அங்கீகரிக்கப்பட்ட புவியியல் பெயராகச் செயல்படுகிறது. எனவே பொதுவான ‘தெற்குப்பகுதி’ என்பதற்குப் பதிலாக இடப்பெயரின் தன்மையைப் பாதுகாக்க ஒலிபெயர்ப்பு பயன்படுத்தப்பட்டது.
- source_word: הַכִּכָּר
  choice: சமவெளி
  rationale: இந்தச் சொல் அடிப்படையில் வட்டமான பரப்பைக் குறிக்கக்கூடியதாயினும், இங்கு யோர்தான் பள்ளத்தாக்குப் பகுதியின் சமவெளியைச் சுட்டும் புவியியல் சொல்லாக உள்ளது.
- source_word: בִּקְעַת יְרֵחוֹ
  choice: எரிகோவின் பள்ளத்தாக்கு
  rationale: בִּקְעָה என்பது அகன்ற பள்ளத்தாக்கு அல்லது சமவெளியைக் குறிக்கும். முந்தைய הַכִּכָּר என்பதற்கு ‘சமவெளி’ பயன்படுத்தப்பட்டுள்ளதால், நில அமைப்பின் பொருளைப் பேணியபடி இங்கு ‘பள்ளத்தாக்கு’ என வேறுபடுத்தப்பட்டது.
- source_word: עִיר הַתְּמָרִים
  choice: பனைமரங்களின் நகரம்
  rationale: இது எரிகோவுக்குரிய அறியப்பட்ட அடைமொழி; எபிரெய உருவகத்தை இயல்பான தமிழில் நேரடியாகப் பாதுகாக்கிறது.
- source_word: עַד צֹעַר
  choice: சோவார் வரையிலும்
  rationale: עַד குறிக்கும் எல்லை அல்லது பரப்பின் முடிவைத் தமிழில் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: וְאֶת ... וְאֶת
  choice: …ஐயும், …ஐயும்
  rationale: இணைப்புச் சொல்லுடன் மீண்டும் வரும் நேரடிச் செயப்படுபொருள் குறிகளை, முந்தைய வசனத்திலிருந்து தொடரும் சேர்க்கைப் பட்டியல் நடையைப் பேணும் இயல்பான தமிழ் அமைப்பில் வழங்குகிறது.
