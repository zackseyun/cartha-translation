  edition: WLC
  text: לְ/כָל הָ֨/אֹת֜וֹת וְ/הַ/מּוֹפְתִ֗ים אֲשֶׁ֤ר שְׁלָח/וֹ֙ יְהוָ֔ה לַ/עֲשׂ֖וֹת בְּ/אֶ֣רֶץ מִצְרָ֑יִם לְ/פַרְעֹ֥ה וּ/לְ/כָל עֲבָדָ֖י/ו וּ/לְ/כָל אַרְצֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/034/011.yaml
  text: for all the signs and the wonders that Yahweh sent him to do in the land of Egypt[a], to Pharaoh and to all his servants and to all his land,
translation:
  language: ta
  text: எல்லா அடையாளங்களையும் அற்புதங்களையும் பொறுத்தவரையிலும்—அவற்றை எகிப்து நாட்டில் பார்வோனுக்கும், அவனுடைய ஊழியர்கள் அனைவருக்கும், அவனுடைய நாடு முழுவதற்கும்[a] செய்யும்படி யாவே அவரை அனுப்பினார்—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவனுடைய நாடு முழுவதற்கும் எதிராக” அல்லது “அவனுடைய நாடு முழுவதிலும்.” இங்குள்ள எபிரெய முன்னிடைச்சொல் வெவ்வேறு தொடர்புப் பொருள்களில் புரிந்துகொள்ளப்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְכָל הָאֹתוֹת וְהַמּוֹפְתִים
  choice: எல்லா அடையாளங்களையும் அற்புதங்களையும் பொறுத்தவரையிலும்
  rationale: முந்தைய வசனத்தைச் சார்ந்து, மோசே ஒப்பற்றவராக விளங்கிய துறையை לְ குறிக்கிறது. ‘பொறுத்தவரையிலும்’ என்பது அந்தத் தொடர்ச்சியை இயல்பான தமிழில் வெளிப்படுத்துகிறது; אוֹת–מוֹפֵת என்ற இணை ‘அடையாளங்கள்—அற்புதங்கள்’ என வேறுபடுத்தப்படுகிறது.
- source_word: אֲשֶׁר שְׁלָחוֹ יְהוָה לַעֲשׂוֹת
  choice: அவற்றைச் செய்யும்படி யாவே அவரை அனுப்பினார்
  rationale: שׁלח என்பதன் நேரடியான ‘அனுப்பினார்’ என்ற பொருளையும், לַעֲשׂוֹת என்பதன் நோக்கத்தையும் காக்கிறது. ஆண்பால் ஒருமை பின்னொட்டு சூழலிலுள்ள மோசேயைக் குறிக்கிறது; மரியாதை ஒருமை தமிழில் இயல்பாக உள்ளது.
- source_word: יְהוָה
  choice: யாவே
  rationale: திருநான்கெழுத்தான தனிப்பெயரை ஒரு பட்டப்பெயரால் மாற்றாமல், நவீனத் தமிழில் பரவலாக அறியப்படும் ஒலிபெயர்ப்பால் தருகிறது.
- source_word: בְּאֶרֶץ מִצְרָיִם
  choice: எகிப்து நாட்டில்
  rationale: אֶרֶץ என்பதையும் இடத்தைக் குறிக்கும் בְּ என்பதையும் சுருக்கமின்றி இயல்பாக வெளிப்படுத்துகிறது.
- source_word: לְפַרְעֹה וּלְכָל עֲבָדָיו
  choice: பார்வோனுக்கும், அவனுடைய பணியாளர்கள் அனைவருக்கும்
  rationale: לְ என்பதன் தொடர்பு அல்லது திசை சார்ந்த பொருளை ‘-க்கும்’ காக்கிறது. עֲבָדִים என்பதற்கு அரசவையினரையும் பொதுவான சேவகர்களையும் உள்ளடக்கக்கூடிய ‘பணியாளர்கள்’ தேர்ந்தெடுக்கப்பட்டுள்ளது.
- source_word: וּלְכָל אַרְצוֹ
  choice: அவனுடைய நாடு முழுவதற்கும்
  rationale: כָל என்பதன் முழுமையை இயல்பான தமிழில் தெரிவிக்கிறது. לְ இங்கே ‘நோக்கி/மீது/முழுவதும்’ என்ற பல தொடர்புப் பொருள்களைத் தரக்கூடும் என்பதால் மாற்றுப் புரிதல்கள் அடிக்குறிப்பில் பாதுகாக்கப்படுகின்றன.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழியாக்கம்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலத்தில் தனிப்பெயரான திருநான்கெழுத்தே உள்ளது. அதை ஒரு பொதுப் பட்டப்பெயராக மாற்றாமல் ஒலிபெயர்ப்பது மூலத்தின் தன்மையைப் பாதுகாக்கிறது; குறிப்பிட்ட சமய மரபின் மாற்றீட்டைத் திணிப்பதையும் தவிர்க்கிறது.
- issue: பார்வோனுக்கும் அவன் நாட்டுக்கும் உரிய לְ முன்னிடைச்சொல்லின் வலிமை
  choice: -க்கும்
  alternative: எதிராக; நாடு முழுவதும்
  rationale: எபிரெய முன்னிடைச்சொல் இங்கு இலக்கு, பாதிப்பு, அல்லது பரவல் ஆகிய தொடர்புகளைத் தாங்கக்கூடும். முதன்மை உரை வடிவ ஒற்றுமையைப் பேணுகிறது; தீங்கு சார்ந்த பொருளை மட்டும் இறையியல் ரீதியாகத் தீர்மானித்து விடாமல் மாற்றுகள் அடிக்குறிப்பில் தரப்படுகின்றன.
translation_notes:
  register: நவீனத் தரத் தமிழில் கண்ணியமான, வாசிக்க எளிய நடை பயன்படுத்தப்பட்டுள்ளது. இவ்வசனம் முந்தைய வாக்கியத்தைத் தொடரும் சார்பு அமைப்பாக இருப்பதால், அதன் தொடக்கமும் முடிவும் நீள்கோடுகளால் இணைப்புத் தன்மையுடன் வைக்கப்பட்டுள்ளன. ‘அற்புதங்கள்’ என்பது வியப்பூட்டும் செயல்கள் என்ற பொருளிலும், ‘அடையாளங்கள்’ என்பது அவற்றின் சுட்டும் தன்மையிலும் வேறுபாட்டைத் தக்கவைக்கிறது.
