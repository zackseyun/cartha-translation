source:
  edition: WLC
  text: וַ/יָּ֨מָת שָׁ֜ם מֹשֶׁ֧ה עֶֽבֶד יְהוָ֛ה בְּ/אֶ֥רֶץ מוֹאָ֖ב עַל פִּ֥י יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/034/005.yaml
  text: So Moses the servant of Yahweh died there in the land of Moab[a], according to the word of Yahweh.
translation:
  language: ta
  text: யாவேயின் ஊழியரான மோசே அங்கே, மோவாப் நாட்டில், யாவேயின் வார்த்தையின்படி[a] இறந்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லுக்கு சொல், “யாவேயின் வாயின்படி”; இதை “யாவேயின் கட்டளைப்படி” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת
  choice: இறந்தார்
  rationale: מות என்பதன் தொடர்நிகழ்வு வடிவம் அடுத்த சம்பவத்தை எடுத்துரைக்கிறது. தமிழில் இயல்பான இறந்தகால வினையால் அதன் மையப் பொருள் தெளிவாக வெளிப்படுகிறது; தனியாக ஒரு இணைப்புச் சொல்லைச் சேர்ப்பது அவசியமில்லை.
- source_word: שָׁם
  choice: அங்கே
  rationale: முன்னர் குறிப்பிடப்பட்ட இடத்தைச் சுட்டும் இடவினையுரிச்சொல்லின் சுட்டுப் பொருளைப் பாதுகாக்கிறது.
- source_word: מֹשֶׁה
  choice: மோசே
  rationale: தமிழில் வழக்கிலுள்ள இப்பெயரின் வடிவம்.
- source_word: עֶבֶד יְהוָה
  choice: யாவேயின் ஊழியர்
  rationale: עֶבֶד என்பதற்கு அடிமை என்றும் பொருள் வரலாம்; ஆனால் இங்கு அது மோசேயின் மதிப்புக்குரிய உடன்படிக்கைப் பணியாளர் என்ற பட்டமாக வருகிறது. ‘ஊழியர்’ அந்த உறவையும் மரியாதையையும் இயல்பாகக் காட்டுகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெயத் தெய்வீகப் பெயரான நான்கு எழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் ஒலிபெயர்த்து வழங்குகிறது.
- source_word: בְּאֶרֶץ מוֹאָב
  choice: மோவாப் நாட்டில்
  rationale: ‘மோவாபின் நாட்டில்’ என்ற எபிரெயச் சொல்லமைப்பின் புவியியல் வலியுறுத்தலை இயல்பான தமிழில் பாதுகாக்கிறது.
- source_word: עַל פִּי יְהוָה
  choice: யாவேயின் வார்த்தையின்படி
  rationale: சொல்லுக்கு சொல் ‘யாவேயின் வாயின்படி’ எனும் எபிரெய மரபுத்தொடர், யாவேயின் சொல் அல்லது கட்டளைக்கு இணங்க என்பதைக் குறிக்கிறது. தேர்ந்த வடிவம் பொருளையும் ‘வார்த்தை’ என்ற கூறையும் பாதுகாக்கிறது; மாற்று வாசிப்பு அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலவசனம் தனிப்பட்ட தெய்வீகப் பெயரையே பயன்படுத்துகிறது. அதை ஒரு பட்டமாக மாற்றாமல் ‘யாவே’ என்று ஒலிபெயர்ப்பது மூலத்தின் வேறுபாட்டைப் பாதுகாக்கிறது.
- issue: மோசேயின் பட்டத்தில் עֶבֶד என்பதன் நுண்பொருள்
  choice: ஊழியர்
  alternative: அடிமை
  rationale: இச்சூழலில் இந்தச் சொல் கட்டுண்ட அடிமை நிலையைக் காட்டுவதைவிட, யாவேக்கு நியமிக்கப்பட்டு உண்மையுடன் பணியாற்றிய மோசேயின் மதிப்புக்குரிய பட்டமாகச் செயல்படுகிறது.
- issue: עַל פִּי יְהוָה என்ற மரபுத்தொடரின் பொருள்
  choice: யாவேயின் வார்த்தையின்படி
  alternative: யாவேயின் கட்டளைப்படி; சொல்லுக்கு சொல், யாவேயின் வாயின்படி
  rationale: மரபுத்தொடரின் வழக்குப் பொருளைத் தெளிவாக்கியபோதும், ‘வாய்/வார்த்தை’ தொடர்பை முற்றிலும் மறைக்காமல் வைத்திருக்கிறது. அதன் நேரடி உருவகமும் கட்டளை என்ற மாற்றுப் பொருளும் அடிக்குறிப்பில் பாதுகாக்கப்படுகின்றன.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியும் ஆனால் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய வாக்கியத்தின் நிகழ்வுவரிசை தமிழில் இயல்பான வினைமுற்றால் தரப்பட்டுள்ளது; தேவையற்ற சமயக்குழுச் சார்ந்த சொற்கள் தவிர்க்கப்பட்டுள்ளன.
