base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/034/008.yaml
  text: And the sons of Israel wept for Moses in the plains of Moab thirty days; then the days of weeping[a] for the mourning of Moses were completed.
translation:
  language: ta
  text: இஸ்ரவேல் மக்கள் மோவாபின் சமவெளிகளில் மோசேயுக்காக முப்பது நாட்கள் அழுதார்கள். அதன்பின், மோசேயுக்காகத் துக்கம் அனுசரித்து அழுத நாட்கள் முடிவடைந்தன.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய அமைப்பை இன்னும் நெருக்கமாகப் பின்பற்றி, “மோசேயின் துக்க அழுகை நாட்கள் முடிவடைந்தன” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבְכּוּ
  choice: அழுதார்கள்
  rationale: בכה என்பது கண்ணீர்விட்டு அழுவதைக் குறிக்கிறது. பின்னர் வரும் விரிவான துக்க அனுசரிப்பிலிருந்து இதை வேறுபடுத்தி, இயல்பான தமிழில் ‘அழுதார்கள்’ என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்கள்
  rationale: சொல்லர்த்தமாக ‘இஸ்ரவேலின் மகன்கள்’ என்றாலும், இங்கு முழு இஸ்ரவேல் சமூகத்தைக் குறிக்கும் எபிரெய மரபுத்தொடர். நவீனத் தமிழில் இயல்பாகவும் அனைவரையும் உள்ளடக்கும் வகையிலும் ‘இஸ்ரவேல் மக்கள்’ என வழங்கப்பட்டுள்ளது.
- source_word: אֶת מֹשֶׁה
  choice: மோசேயுக்காக
  rationale: בכה என்ற வினையோடு வரும் אֵת, யாருடைய மரணத்திற்காக அழுகிறார்கள் என்பதைக் காட்டுகிறது; தமிழில் ‘மோசேயுக்காக’ என்பது இயல்பான தொடர்பு.
- source_word: בְּעַרְבֹת מוֹאָב
  choice: மோவாபின் சமவெளிகளில்
  rationale: עַרְבוֹת என்பது சமவெளி அல்லது புல்வெளிப் பிரதேசத்தைக் குறிக்கிறது. நிலவியல் பொருளைத் தெளிவாகக் காக்க ‘சமவெளிகளில்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: שְׁלֹשִׁים יוֹם
  choice: முப்பது நாட்கள்
  rationale: எண்ணும் காலஅளவும் நேரடியாக மொழிபெயர்க்கப்பட்டுள்ளன.
- source_word: וַיִּתְּמוּ
  choice: முடிவடைந்தன
  rationale: תם இங்கு குறிப்பிட்ட காலம் நிறைவுற்றதைக் குறிக்கிறது. தமிழில் இயல்பாகவும் அதன் நிறைவு உணர்வைக் காக்கவும் ‘முடிவடைந்தன’ என வழங்கப்பட்டுள்ளது.
- source_word: יְמֵי בְכִי אֵבֶל מֹשֶׁה
  choice: மோசேயுக்காகத் துக்கம் அனுசரித்து அழுத நாட்கள்
  rationale: அடுக்காக அமைந்துள்ள எபிரெய பெயர்ச்சொற்கள் அழுகை, துக்கம், மோசே ஆகியவற்றை நெருக்கமாக இணைக்கின்றன. தமிழில் புரியும்படி அவற்றின் உறவு வெளிப்படுத்தப்பட்டுள்ளது; அழுகையும் துக்க அனுசரிப்பும் இரண்டும் காக்கப்பட்டுள்ளன.
