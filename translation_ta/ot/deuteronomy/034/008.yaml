  to: இஸ்ரவேல் மக்கள் மோவாபின் சமவெளிகளில் மோசேயுக்காக முப்பது நாட்கள் அழுதார்கள். அதன்பின், மோசேயுக்காகத் துக்கம் அனுசரித்து அழுத நாட்கள் முடிவடைந்தன.[a]
  rationale: 'முதன்மை உரையில் மாற்றம் தேவையில்லை. அடிக்குறிப்பு மட்டும் திருத்தப்பட்டுள்ளது: புதிய வடிவம் எபிரெயத்தின் நெருக்கமான பெயர்ச்சொல் அடுக்கைக் காட்டுகிறது; அதேவேளை தற்போதைய அடிக்குறிப்பின் குழப்பமான ‘துக்கத்திற்கான அழுகை’ என்ற உறவுமுறையைத் தவிர்க்கிறது. மூலத்தில் உள்ள ‘மோசேயின்/மோசே தொடர்பான’ என்ற கட்டமைப்பு-அளவிலான சுருக்கமும் பாதுகாக்கப்படுகிறது.'
