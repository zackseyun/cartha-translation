translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான நடையுடன் மொழிபெயர்க்கப்பட்டுள்ளது. எபிரெய மரபுத்தொடரான ‘இஸ்ரவேலின் மகன்கள்’ என்பதற்குப் பொருளைத் தெளிவாகக் காட்டும் ‘இஸ்ரவேல் மக்கள்’ பயன்படுத்தப்பட்டுள்ளது; இறுதி பெயர்ச்சொல் அடுக்கின் உறவு இயல்பான தமிழில் வெளிப்படுத்தப்பட்டு, அதன் சொல்லர்த்த வடிவம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
