source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֵלָ֗י/ו זֹ֤את הָ/אָ֨רֶץ֙ אֲשֶׁ֣ר נִ֠שְׁבַּעְתִּי לְ/אַבְרָהָ֨ם לְ/יִצְחָ֤ק וּֽ/לְ/יַעֲקֹב֙ לֵ/אמֹ֔ר לְ/זַרְעֲ/ךָ֖ אֶתְּנֶ֑נָּ/ה הֶרְאִיתִ֣י/ךָ בְ/עֵינֶ֔י/ךָ וְ/שָׁ֖מָּ/ה לֹ֥א תַעֲבֹֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/034/004.yaml
  text: And Yahweh said to him[a], “This is the land that I swore to Abraham, to Isaac, and to Jacob, saying, ‘I will give it to your offspring.’ I have let you see it with your own eyes, but you will not cross over there.”
translation:
  language: ta
  text: யாவே அவனிடம், “ஆபிரகாமுக்கும் ஈசாக்குக்கும் யாக்கோபுக்கும், ‘உன் சந்ததிக்கு[a] இதைக் கொடுப்பேன்’ என்று நான் சத்தியம் செய்து வாக்களித்த தேசம் இதுவே. உன் சொந்தக் கண்களால் இதைக் காணச் செய்தேன்; ஆனால் நீ அங்கே கடந்து செல்லமாட்டாய்” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உன் வித்துக்கு.” எபிரேயத்தில் ஒருமை வடிவிலுள்ள ஒரு கூட்டுப்பெயர் பயன்படுத்தப்பட்டுள்ளது.
    reason: זֶרַע என்பதன் நேரடி உருவகப் பொருளையும் அதன் ஒருமை-கூட்டுப் பண்பையும் பதிவு செய்கிறது.
lexical_decisions:
- source_word: יְהוָה
  choice: யாவே
  rationale: தேவனுடைய உடன்படிக்கைப் பெயரைப் பொதுப்பட்டமாக மாற்றாமல், எபிரேய வடிவத்துக்கு நெருக்கமானதும் தமிழில் வாசிக்க இயல்பானதுமான பெயர்ப்பாக வழங்குகிறது.
- source_word: זֹאת הָאָרֶץ
  choice: தேசம் இதுவே
  rationale: இங்கு הָאָרֶץ பொதுவான நிலப்பரப்பை அல்ல, முற்பிதாக்களுக்கு வாக்களிக்கப்பட்ட தேசத்தைக் குறிக்கிறது; வாக்கியத்தின் சுட்டும் வலியுறுத்தலும் காக்கப்படுகின்றன.
- source_word: נִשְׁבַּעְתִּי
  choice: நான் ஆணையிட்ட
  rationale: வினைச்சொல்லின் உறுதிமொழி மற்றும் உடன்படிக்கை சார்ந்த ஆணையின் வலிமையை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: לְאַבְרָהָם לְיִצְחָק וּלְיַעֲקֹב
  choice: ஆபிரகாமுக்கும் ஈசாக்குக்கும் யாக்கோபுக்கும்
  rationale: ஒவ்வொரு பெயருடனும் திரும்ப வரும் எபிரேய முன்னிடைச்சொல்லின் ஓசையையும் வலியுறுத்தலையும் தமிழ் வேற்றுமை உருபின் மறுபடிவால் காக்கிறது.
- source_word: לְזַרְעֲךָ
  choice: உன் சந்ததிக்கு
  rationale: זֶרַע ஒருமை வடிவிலுள்ள கூட்டுப்பெயர். “சந்ததி” அந்தக் கூட்டுப் பொருளை இயல்பாகத் தருவதோடு, தேவையின்றிப் பன்மையைத் திணிப்பதையும் தவிர்க்கிறது.
- source_word: אֶתְּנֶנָּה
  choice: இதைக் கொடுப்பேன்
  rationale: வாக்களிக்கப்பட்ட தேசத்தைச் சுட்டும் பெண்பால் பின்னொட்டைத் தமிழில் இயல்பான சுட்டுப்பெயரால் வெளிப்படுத்தி, வாக்குறுதியின் எதிர்காலத் தன்மையைக் காக்கிறது.
- source_word: הֶרְאִיתִיךָ
  choice: காணும்படி செய்தேன்
  rationale: ראה என்பதன் ஹிஃபில் காரணவினை வடிவத்தை, வெறுமனே “காட்டினேன்” என்று தட்டையாக்காமல் வெளிப்படுத்துகிறது.
- source_word: בְּעֵינֶיךָ
  choice: உன் சொந்தக் கண்களால்
  rationale: மோசே நேரடியாகத் தானே கண்டதை வலியுறுத்தும் எபிரேய மரபுத்தொடரை இயல்பான தமிழில் தருகிறது.
- source_word: וְשָׁמָּה לֹא תַעֲבֹר
  choice: ஆனால் நீ அங்கே கடந்து செல்லமாட்டாய்
  rationale: தேசத்துக்குள் நுழைவதை மட்டும் விளக்கமாகச் சொல்லாமல், עבר என்பதிலுள்ள “கடந்து செல்லுதல்” என்ற இடவியல் உருவகத்தையும் முந்தைய கூற்றுடனான முரண்பாட்டையும் காக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: யெகோவா; கர்த்தர்
  rationale: மூலத்தில் நான்கெழுத்து இறைப்பெயர் நேரடியாக உள்ளது. அதைப் பொதுப்பட்டமாக மாற்றாமல் உடன்படிக்கைப் பெயராகப் பாதுகாக்கிறது.
- issue: முற்பிதாக்களுக்கான வாக்குறுதியில் זֶרַע என்பதன் பொருள்
  choice: சந்ததி
  alternative: வித்து; சந்ததியினர்
  rationale: எபிரேயச் சொல் இலக்கணத்தில் ஒருமையாகவும் பொருளில் கூட்டாகவும் உள்ளது. “சந்ததி” அந்தத் திறந்த தன்மையைக் காத்து, ஒருவரையோ பலரையோ தேவையின்றி மிகத் துல்லியமாக நிர்ணயிப்பதைத் தவிர்க்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், ஆனால் வேதாகம வாசிப்புக்கேற்ற கண்ணியமான நடையில் அமைக்கப்பட்டுள்ளது. “ஆணையிட்ட,” “தேசம்,” “கடந்து செல்லமாட்டாய்” ஆகிய சொற்கள் மூலத்தின் உடன்படிக்கைத் தீவிரத்தையும் இடவியல் படிமத்தையும் காக்கின்றன; தேவையற்ற பழமொழிநடை தவிர்க்கப்பட்டுள்ளது.
