base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/016.yaml
  text: And you shall consume all the peoples whom Yahweh your God is giving to you[a]. Your eye shall not spare them, and you shall not serve their gods[c][b], for that would be a snare to you.
translation:
  language: ta
  text: உன் கடவுளாகிய யாவே உன்னிடம் ஒப்புக்கொடுக்கும் எல்லா மக்களையும் நீ முற்றிலும் அழித்துவிட வேண்டும்.[a] உன் கண் அவர்கள்மேல் இரக்கம் காட்டக் கூடாது.[b] அவர்களுடைய தெய்வங்களுக்கு நீ பணிவிடை செய்யக் கூடாது; ஏனெனில் அது உனக்குக் கண்ணியாக இருக்கும்.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: நேர்ச்சொல்லாக, “நீ உண்டுவிட வேண்டும்” அல்லது “விழுங்கிவிட வேண்டும்”; இங்கு முழுமையாகத் தோற்கடித்து அழிப்பதைக் குறிக்கும் போர் மரபுத்தொடர்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “நீ அவர்களுக்கு இரக்கம் காட்டக் கூடாது.” நேர்ச்சொல்லாக, “உன் கண் அவர்கள்மேல் இரக்கம் கொள்ளக்கூடாது.”
    reason: lexical_alternative
  - marker: c
    text: “அது” என்பது மிக அருகில் கூறப்பட்ட அவர்களுடைய தெய்வங்களுக்குப் பணிவிடை செய்வதைக் குறிக்கலாம்; அல்லது விக்கிரகாராதனை சார்ந்த நிலையைப் பொதுவாகக் குறிக்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: וְאָכַלְתָּ
  choice: முற்றிலும் அழித்துவிட வேண்டும்
  rationale: אכל என்பதன் நேர்ப்பொருள் ‘உண்/விழுங்கு’; போர் சூழலில் அது முழுமையாகத் தோற்கடித்து அழிப்பதைக் குறிக்கும் மரபுத்தொடராக வருகிறது. தமிழ் வாசகர்களுக்கு தவறான நேர்ப்பொருள் ஏற்படாமல், அதன் விளைவை இயல்பாகத் தெரிவிக்க இவ்வாறு மொழிபெயர்க்கப்பட்டது; உருவகத்தின் நேர்ப்பொருள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
- source_word: כָּל הָעַמִּים
  choice: எல்லா மக்களையும்
  rationale: עַמִּים என்பது தனித்தனி மக்கள் குழுக்களைக் குறிக்கும் பன்மை. ‘மக்கள் இனங்கள்’ என்பதைக் காட்டிலும் ‘மக்கள்’ இங்கு இயல்பாகவும் சூழலுக்கேற்றவாறும் உள்ளது.
- source_word: אֲשֶׁר יְהוָה אֱלֹהֶיךָ נֹתֵן לָךְ
  choice: உன் கடவுளாகிய யாவே உன்னிடம் ஒப்புக்கொடுக்கும்
  rationale: נֹתֵן என்ற பங்கேற்புவினை நடந்துகொண்டிருக்கும் அல்லது விரைவில் நடைபெறவிருக்கும் செயலைக் காட்டுகிறது. போர்ச் சூழலில் ‘கையில் ஒப்புக்கொடுத்தல்’ என்ற உட்பொருளை இயல்பான தமிழில் ‘உன்னிடம் ஒப்புக்கொடுக்கும்’ என வழங்குகிறது. יהוה தனிப்பெயராக ‘யாவே’ என்று ஒலிபெயர்க்கப்பட்டது.
- source_word: לֹא תָחֹס עֵינְךָ עֲלֵיהֶם
  choice: உன் கண் அவர்கள்மேல் இரக்கம் காட்டக் கூடாது
  rationale: எபிரெய மொழியின் ‘உன் கண் இரங்க/விட்டுவைக்க வேண்டாம்’ என்ற உடல்-உருவகத்தைத் தமிழிலும் புரியத்தக்க வகையில் பாதுகாக்கிறது.
- source_word: וְלֹא תַעֲבֹד אֶת אֱלֹהֵיהֶם
  choice: அவர்களுடைய தெய்வங்களுக்கு நீ பணிவிடை செய்யக் கூடாது
  rationale: עבד என்பது தெய்வங்களைச் சார்ந்து வரும்போது வழிபாட்டு விசுவாசத்துடன் சேவை செய்வதைக் குறிக்கிறது. ‘பணிவிடை செய்’ என்பது ‘வழிபடு’ என்பதைவிட எபிரெயச் சொல்லின் பரந்த உடன்படிக்கை சார்ந்த பொருளைத் தக்கவைக்கிறது.
- source_word: כִּי מוֹקֵשׁ הוּא לָךְ
  choice: ஏனெனில் அது உனக்குக் கண்ணியாக இருக்கும்
  rationale: מוֹקֵשׁ என்பது விலங்கு அல்லது ஒருவரைப் பிடிக்கும் கண்ணி. הוּא என்ற சுட்டுப்பெயரின் பொருள் எதைக் குறிக்கிறது என்பதை உரையில் திட்டவட்டமாக விரித்துரைக்காமல் ‘அது’ என வைத்து மூலத்தின் தெளிவின்மையைப் பாதுகாக்கிறது.
theological_decisions:
- issue: כִּי מוֹקֵשׁ הוּא לָךְ என்பதில் הוּא குறிக்கும் பொருள்
  choice: ‘அது உனக்குக் கண்ணியாக இருக்கும்’ என்று தெளிவின்மையைத் தக்கவைத்தல்
  alternative: அவர்களுடைய தெய்வங்களுக்குப் பணிவிடை செய்வது உனக்குக் கண்ணியாக இருக்கும்
  rationale: உடனடி சூழலில் தெய்வங்களுக்குப் பணிவிடை செய்வதே பெரும்பாலும் குறிக்கப்படலாம். ஆயினும் ஒருமைச் சுட்டுப்பெயர் அந்தச் செயலை, விக்கிரகாராதனை நிலையை, அல்லது தெய்வங்களை விரிவாகக் குறிக்கக்கூடும்; ஆகவே மூலத்தில் இல்லாத தீர்மானத்தை முதன்மை உரையில் சேர்க்காமல் அடிக்குறிப்பில் விளக்கப்பட்டது.
translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான, நேரடியான நடை பயன்படுத்தப்பட்டுள்ளது. வசனத்தின் கடுமை மென்மைப்படுத்தப்படவில்லை; அதே நேரத்தில் אכל என்பதன் போர் மரபுத்தொடர் பொருள் இயல்பான தமிழில் தரப்பட்டு, நேரடி உருவகம் அடிக்குறிப்பில் வைக்கப்பட்டுள்ளது. ஒருமை இரண்டாம் நபர் வடிவங்கள் பாதுகாக்கப்பட்டுள்ளன.
