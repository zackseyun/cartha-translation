  edition: WLC
  text: לֹ֥א תַעֲרֹ֖ץ מִ/פְּנֵי/הֶ֑ם כִּֽי יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ בְּ/קִרְבֶּ֔/ךָ אֵ֥ל גָּד֖וֹל וְ/נוֹרָֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/021.yaml
  text: Do not dread them[a], for Yahweh your God is in your midst[c][b], a great and fearsome God.
translation:
  language: ta
  text: அவர்களைக் கண்டு திகிலடையாதே[a]; ஏனெனில் உன் கடவுளான யாவே உன் நடுவில்[b] இருக்கிறார்; அவர் மகத்துவமிக்கவரும் அஞ்சத்தக்கவருமான[c] கடவுள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்களால் திகிலடையாதே.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “உன் மத்தியில்.” எபிரெயச் சொல் இஸ்ரவேல் சமூகத்தின் மத்தியில் இருப்பதைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, “பயபக்தியைத் தூண்டுகிறவர்.” எபிரெயச் சொல் அச்சத்தையும் பயபக்தியையும் எழுப்புபவரைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַעֲרֹץ מִפְּנֵיהֶם
  choice: அவர்களைக் கண்டு திகிலடையாதே
  rationale: ערץ என்பதன் தீவிரமான அச்சம் அல்லது திகில் என்ற பொருளையும், מִפְּנֵיהֶם என்பதன் ‘அவர்களை எதிர்கொள்ளும்போது/அவர்களால்’ என்ற இடைச்சொல் வலிமையையும் இயல்பான தமிழில் ஒன்றாகத் தருகிறது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: எபிரெய தனிப்பெயரான יהוה-வை ஒரு பட்டப்பெயராக மாற்றாமல், தமிழில் வழக்கிலுள்ள ஒலிபெயர்ப்பால் தருகிறது.
- source_word: אֱלֹהֶיךָ
  choice: உன் கடவுளாகிய
  rationale: இரண்டாம் நபர் ஒருமை உடைமையையும், உடன்படிக்கை உறவைக் குறிக்கும் ‘உன் கடவுள்’ என்பதையும் வெளிப்படையாகப் பாதுகாக்கிறது.
- source_word: בְּקִרְבְּךָ
  choice: உன் நடுவில்
  rationale: சமூகத்தின் மத்தியில் கடவுள் இருப்பதைச் சுட்டுகிறது; தனிநபரின் உள்ளார்ந்த அனுபவம் என்று தவறாகப் புரியக்கூடிய ‘உனக்குள்’ என்பதைத் தவிர்க்கிறது.
- source_word: אֵל גָּדוֹל
  choice: மகத்துவமுள்ள கடவுள்
  rationale: אֵל-ஐ ‘கடவுள்’ என்றும் גָּדוֹל-ஐ ‘மகத்துவமுள்ள’ என்றும் மொழிபெயர்த்து, பெயர்ச்சொல் மற்றும் பெயரடை இரண்டின் வலிமையையும் காக்கிறது.
- source_word: וְנוֹרָא
  choice: அச்சத்திற்குரியவர்
  rationale: இந்த வடிவம் அச்சத்தையும் பயபக்தியையும் எழுப்புபவர் என்ற பொருளைக் கொண்டது; சாதாரண ‘அற்புதமானவர்’ என்ற சொல்லால் அதன் தீவிரத்தைத் தணிக்கவில்லை.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யெகோவா
  alternative: யாவே; கர்த்தர்
  rationale: மூலத்தில் தனிப்பட்ட உடன்படிக்கைப் பெயர் நேரடியாக இருப்பதால், அதை ‘கர்த்தர்’ என்ற பட்டப்பெயரால் மாற்றாமல் ஒலிபெயர்க்கப்பட்டுள்ளது. தமிழ் வாசகர்களிடையே நிலைபெற்ற ‘யெகோவா’ வடிவம் தேர்ந்தெடுக்கப்பட்டது; ‘யாவே’ என்பது மற்றொரு சாத்தியமான ஒலிபெயர்ப்பு.
- issue: נוֹרָא என்பதன் தெய்வவியல் நுணுக்கம்
  choice: அச்சத்திற்குரியவர்
  alternative: பயபக்தியைத் தூண்டுகிறவர்; திகிலூட்டுகிறவர்
  rationale: இச்சொல் கடவுள் வெறும் பயங்கரமானவர் என்று மட்டும் கூறாமல், அவரது மகத்துவம் அச்சமும் பயபக்தியும் உண்டாக்குகிறது என்ற பதற்றத்தைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், ஒருமை முகவரியைப் பாதுகாத்து, கண்ணியமான வேதாகம நடையில் அமைக்கப்பட்டது. ‘திகிலடையாதே’ மூல வினையின் தீவிரத்தையும், ‘உன் நடுவில்’ சமூக மையிலான தெய்வீக இருப்பையும் தெளிவுபடுத்துகின்றன.
