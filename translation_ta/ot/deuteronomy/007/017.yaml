source:
  edition: WLC
  text: כִּ֤י תֹאמַר֙ בִּ/לְבָ֣בְ/ךָ֔ רַבִּ֛ים הַ/גּוֹיִ֥ם הָ/אֵ֖לֶּה מִמֶּ֑/נִּי אֵיכָ֥ה אוּכַ֖ל לְ/הוֹרִישָֽׁ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/017.yaml
  text: If you say in your heart[a], ‘These nations are more numerous than I; how can I dispossess them?’
translation:
  language: ta
  text: நீ உன் உள்ளத்தில்[a], “இந்த நாடுகள் எண்ணிக்கையில் என்னைவிட மிகுதியானவை; அவர்களை நான் எப்படி வெளியேற்ற முடியும்?” என்று சொன்னால்,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உன் இதயத்தில்.” எபிரெயச் சொற்றொடர் உள்ளான சிந்தனையையோ தனக்குள் பேசிக்கொள்வதையோ குறிக்கிறது.
    reason: idiomatic_expression
lexical_decisions:
- source_word: כִּי
  choice: '-ஆல் (நிபந்தனை: சொல்லிக்கொண்டால்)'
  rationale: இங்கு כִּי அடுத்த வசனத்தின் ஆறுதலுக்கு வழிவகுக்கும் நிபந்தனைச் சூழலை அறிமுகப்படுத்துகிறது.
- source_word: תֹאמַר בִּלְבָבְךָ
  choice: நீ உன் உள்ளத்தில் சொல்லிக்கொண்டால்
  rationale: אמר என்பதன் அடிப்படைப் பொருளான ‘சொல்’ என்பதையும், בִּלְבָבְךָ குறிக்கும் அகநிலைச் சிந்தனை அல்லது தனக்குள் பேசுதலையும் இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: רַבִּים ... מִמֶּנִּי
  choice: என்னைவிட எண்ணிக்கையில் மிகுதியானவை
  rationale: முதல் நபர் ஒருமையுடன் செய்யப்படும் எண்ணிக்கை ஒப்பீட்டை வெளிப்படையாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: הַגּוֹיִם הָאֵלֶּה
  choice: இந்த நாடுகள்
  rationale: உபாகமத்தின் நிலம் மற்றும் மக்கள் குழுக்கள் சார்ந்த சூழலில் גּוֹיִם என்பதற்கான வழக்கமான, தெளிவான இணைச்சொல்.
- source_word: אֵיכָה אוּכַל
  choice: நான் எப்படி ... முடியும்?
  rationale: சாத்தியத்திறனைப் பற்றிய வினாவை நவீனத் தமிழில் நேரடியாகத் தெரிவிக்கிறது.
- source_word: לְהוֹרִישָׁם
  choice: அவர்களை அவர்களுடைய நிலத்திலிருந்து அகற்ற
  rationale: Hiphil வடிவம் அவர்கள் நிலத்தின் உடைமையை இழக்கச் செய்வதை உணர்த்துகிறது; ‘அகற்ற’ என்பதுடன் நிலத்தைக் குறிப்பதால் உடைமையிழக்கச் செய்யும் நுணுக்கம் தெளிவாகிறது.
theological_decisions: []
translation_notes:
  register: நவீன தரத் தமிழில், மரியாதையும் எளிமையும் கொண்ட நடை. ‘உன் உள்ளத்தில் சொல்லிக்கொண்டால்’ என்ற தொடர் எபிரெய உருவகத்தையும் அகச்சிந்தனை என்ற பொருளையும் காக்கிறது. அடிக்குறி குறியீடு தொடர்புடைய வாக்கியத்தின் முடிவில் வைக்கப்பட்டுள்ளது.
