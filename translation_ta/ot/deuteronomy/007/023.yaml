source:
  edition: WLC
  text: וּ/נְתָנָ֛/ם יְהוָ֥ה אֱלֹהֶ֖י/ךָ לְ/פָנֶ֑י/ךָ וְ/הָמָ/ם֙ מְהוּמָ֣ה גְדֹלָ֔ה עַ֖ד הִשָּׁמְדָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/023.yaml
  text: But Yahweh your God will give them over to you and throw them into great confusion until they are destroyed[a][b].
translation:
  language: ta
  text: ஆனால் உன் கடவுளாகிய யாவே அவர்களை உன்னிடம் ஒப்படைத்து[a], அவர்கள் அழிக்கப்படும்வரை அவர்களைப் பெரும் குழப்பத்தில்[b] ஆழ்த்துவார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: நேரடியாக, “உனக்கு முன்பாக.” இச்சூழலில், எதிரிகளை உன் அதிகாரத்திற்குள் ஒப்படைப்பது என்று பொருள்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “பெரும் பீதியில்” அல்லது “பெரும் அமளியில்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּנְתָנָם ... לְפָנֶיךָ
  choice: அவர்களை உன்னிடம் ஒப்படைத்து
  rationale: נתן என்பதுடன் ‘உனக்கு முன்பாக’ என்ற சொற்றொடர் சேரும் இந்தப் போர்ச் சூழலில், எதிரிகளை ஒருவரின் அதிகாரத்திற்குள் ஒப்படைப்பதைக் குறிக்கிறது. ‘உன்னிடம் ஒப்படைத்து’ என்பது அந்தப் பொருளை இயல்பான தமிழில் தருகிறது; நேரடிப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய உரையில் வரும் கடவுளின் தனிப்பெயரான יהוה என்பதை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் பரவலாக அறியப்படும் ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: אֱלֹהֶיךָ
  choice: உன் கடவுள்
  rationale: இது இரண்டாம் நபர் ஆண்பால் ஒருமை பின்னொட்டுடன் அமைந்த வடிவம். இஸ்ரவேலை ஒருமையாக நேரடியாக அழைக்கும் மூலத்தின் இலக்கணத்தை ‘உன்’ என்பதால் காக்கிறது.
- source_word: וְהָמָם מְהוּמָה גְדֹלָה
  choice: அவர்களைப் பெரும் குழப்பத்தில் ஆழ்த்துவார்
  rationale: המם என்பது குறிப்பாகப் போரில் திகைப்பு, பீதி, குழப்பம் அல்லது சிதறலை உண்டாக்குவதைக் குறிக்கும்; מְהוּמָה גְדֹלָה அதன் தீவிரத்தை வலியுறுத்துகிறது. தேர்ந்த தமிழ் நடை காரணவினை வலிமையையும் பெரும் சீர்குலைவையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: עַד הִשָּׁמְדָם
  choice: அவர்கள் அழிக்கப்படும்வரை
  rationale: עַד உடன் வரும் שׁמד வினையின் பெயரெச்ச வடிவமும் பன்மை பின்னொட்டும் செயலின் இறுதி எல்லையாக அவர்களுடைய அழிவைக் காட்டுகின்றன. செயப்பாட்டு வடிவம் மூலத்தின் விளைவு சார்ந்த பொருளைக் காக்கிறது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: ஆண்டவர்; யெகோவா
  rationale: இங்கு மூல உரை ஒரு பொதுப் பட்டத்தை அல்ல, יהוה என்ற தனிப்பெயரையே பயன்படுத்துகிறது. ஆகவே அதை ‘ஆண்டவர்’ என்று மாற்றாமல் ஒலிபெயர்ப்பது மூலத்தின் பெயரியல் தன்மையைப் பாதுகாக்கிறது; ‘யாவே’ என்பது எபிரெயப் பெயரின் ஏற்றுக்கொள்ளப்பட்ட நவீன ஒலிப்புக்கு அண்மையான தமிழ் வடிவம்.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகருக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. இஸ்ரவேலை ஒருமையாக அழைக்கும் எபிரெய இலக்கணத்தைப் பாதுகாக்க ‘உன்/உன்னிடம்’ பயன்படுத்தப்பட்டுள்ளது. போர்ச் சூழலின் காரணவினை வலிமையைத் தக்கவைத்தபடியே தேவையற்ற பழமையான சொற்கள் தவிர்க்கப்பட்டுள்ளன.
