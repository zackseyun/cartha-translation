  yaml_path: translation/ot/deuteronomy/007/001.yaml
  text: When Yahweh your God brings you into the land that you are entering to possess[a], and drives out before you many nations—the Hittites, the Girgashites, the Amorites, the Canaanites, the Perizzites, the Hivites, and the Jebusites—seven nations greater and mightier than you[b],
translation:
  language: ta
  text: உன் கடவுளாகிய யாவே, நீ உரிமையாக்கிக்கொள்ள நுழைகிற நாட்டுக்குள் உன்னைக் கொண்டுவந்து, உன் முன்னிலையிலிருந்து பல இனத்தாரைத் துரத்திவிடும்போது[a]—இத்தியர், கிர்காசியர், எமோரியர், கானானியர், பெரிசியர், ஏவியர், எபூசியர் ஆகிய உன்னைவிடப் பெரியவர்களும் வலிமைமிக்கவர்களுமான ஏழு இனத்தாரை[b]—,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உன் முன்னிலையிலிருந்து பல இனத்தாரை உரிமையிழக்கச் செய்யும்போது.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “உன்னைவிட எண்ணிக்கையில் அதிகமானவர்களும் பலமானவர்களுமான.”
    reason: lexical_alternative
lexical_decisions:
