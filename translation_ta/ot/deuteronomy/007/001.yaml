- source_word: יְבִיאֲךָ
  choice: உன்னைக் கொண்டுவந்து
  rationale: בוא என்பதன் ஹிஃபில் வடிவிலுள்ள காரணவினைப் பொருளை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய மூலத்தில் உள்ள இறைத் திருப்பெயரைப் பட்டப்பெயராக மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: אֱלֹהֶיךָ
  choice: உன் கடவுளாகிய
  rationale: இரண்டாம் நபர் ஒருமை உரிமையையும் உடன்படிக்கை சார்ந்த அடையாளத்தையும் தெளிவாகக் காக்கிறது.
- source_word: הָאָרֶץ
  choice: நாடு
  rationale: இங்கு இஸ்ரவேலர் கைப்பற்றவிருக்கும் குறிப்பிட்ட நிலப்பரப்பைக் குறிக்கும் இயல்பான நவீனத் தமிழ் சொல்.
- source_word: אֲשֶׁר אַתָּה בָא שָׁמָּה
  choice: நுழைகிற
  rationale: இஸ்ரவேலரின் உடனடி நுழைவைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது; எபிரெயத்தின் ‘அங்கே’ என்பதைத் தமிழில் தனியே கூறத் தேவையில்லை.
- source_word: לְרִשְׁתָּהּ
  choice: உரிமையாக்கிக்கொள்ள
  rationale: ירשׁ என்பதிலுள்ள கைப்பற்றி உடைமையாக்கும் செயற்பொருளைக் காக்கிறது; ‘சுதந்தரித்துக்கொள்ள’ என்பதைக் காட்டிலும் இச்சூழலில் தெளிவானது.
- source_word: וְנָשַׁל
  choice: துரத்திவிடும்போது
  rationale: மக்களை நிலத்திலிருந்து அகற்றுதல் அல்லது உரிமையிழக்கச் செய்தல் என்ற வினையின் பொருளை வாசிக்க எளிய தமிழில் தருகிறது.
- source_word: גּוֹיִם רַבִּים
  choice: பல இனத்தார்
  rationale: கானானில் வாழ்ந்த தனித்தனி இனக்குழுக்களை இங்கு குறிக்கிறது; நவீன தமிழில் ‘தேசங்கள்’ என்பதைவிட ‘இனத்தார்’ தெளிவானது.
- source_word: מִפָּנֶיךָ
  choice: உன் முன்னிலையிலிருந்து
  rationale: ஒருவரின் முகத்திற்கு முன்பிருந்து அகற்றப்படுதல் என்ற எபிரெய மரபுத்தொடரின் பொருளைத் தெளிவாகக் காக்கிறது.
- source_word: הַחִתִּי ... הַיְבוּסִי
  choice: இத்தியர், கிர்காசியர், எமோரியர், கானானியர், பெரிசியர், ஏவியர், எபூசியர்
  rationale: எபிரெய ஒருமை இனப்பெயர்கள் கூட்டாகச் சுட்டுவதால், தமிழில் வழக்கமான பன்மை இனப்பெயர்களாகத் தரப்பட்டுள்ளன.
- source_word: שִׁבְעָה גוֹיִם
  choice: ஏழு இனத்தார்
  rationale: முன்பு பட்டியலிடப்பட்ட குழுக்களின் எண்ணிக்கையைச் சுருக்கிக் கூறும் தொடராக மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: רַבִּים וַעֲצוּמִים מִמֶּךָּ
  choice: உன்னைவிடப் பெரியவர்களும் வலிமைமிக்கவர்களுமான
  rationale: ஒப்பீட்டுத் தொடரின் ‘greater/more numerous’ மற்றும் ‘mightier’ என்ற இரு கூறுகளையும் காக்கிறது; רַבִּים என்பதன் எண்ணிக்கை சார்ந்த மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைத் திருப்பெயரின் மொழியாக்கம்
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூல எபிரெயம் திருப்பெயரையே நேரடியாகப் பயன்படுத்துவதால், அதை ஒரு பட்டப்பெயரால் மாற்றாமல் பரவலாக ஏற்றுக்கொள்ளப்படும் தமிழாக்க ஒலிவடிவில் தருகிறது.
- issue: ירשׁ என்பதின் உடைமை மற்றும் கைப்பற்றுதல் சார்ந்த பொருள்
  choice: உரிமையாக்கிக்கொள்ள
  alternative: சுதந்தரித்துக்கொள்ள
  rationale: வாக்குத்தத்த நிலம் என்ற இறையியல் பின்னணியை மறுக்காமல், இவ்வசனத்தின் நுழைவு மற்றும் மக்களை அகற்றுதல் சார்ந்த செயற்பொருளைத் தெளிவாக வைத்திருக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையும் வாசிப்புத் தெளிவும் கொண்ட நடை பயன்படுத்தப்பட்டுள்ளது. எபிரெயத்தில் முழு வாக்கியம் அடுத்த வசனத்திற்குத் தொடர்வதால் இறுதியில் காற்புள்ளி வைக்கப்பட்டுள்ளது. இரண்டாம் நபர் ஆண்பால் ஒருமை தமிழில் இயல்பான ‘உன்/நீ’ வடிவில் தரப்பட்டுள்ளது.
