source:
  edition: WLC
  text: וְ/לֹ֥א תִתְחַתֵּ֖ן בָּ֑/ם בִּתְּ/ךָ֙ לֹא תִתֵּ֣ן לִ/בְנ֔/וֹ וּ/בִתּ֖/וֹ לֹא תִקַּ֥ח לִ/בְנֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/003.yaml
  text: 'And you shall not intermarry with them: you shall not give your daughter to his son[a], and you shall not take his daughter for your son.'
translation:
  language: ta
  text: அவர்களுடன் திருமண உறவு ஏற்படுத்திக்கொள்ளாதே[a]. உன் மகளை அவனுடைய மகனுக்குக் கொடுக்காதே; அவனுடைய மகளை உன் மகனுக்காக எடுத்துக்கொள்ளாதே.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'இன்னும் சொற்சார்ந்த வகையில்: “அவர்களுடன் திருமணச் சம்பந்தங்களை ஏற்படுத்தாதே.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִתְחַתֵּן
  choice: திருமண உறவு ஏற்படுத்திக்கொள்ளாதே
  rationale: התחתן என்பதன் ஹித்பயேல் வடிவம், முன்பு குறிப்பிடப்பட்ட மக்களுடன் பரஸ்பரமாகத் திருமணத் தொடர்புகளை ஏற்படுத்துவதைச் சுட்டுகிறது. நவீனத் தமிழில் இயல்பாகவும் சமூக உறவின் பொருளைத் தெளிவாகவும் தெரிவிக்க இந்தச் சொற்றொடர் தேர்ந்தெடுக்கப்பட்டது.
- source_word: בָּם
  choice: அவர்களுடன்
  rationale: மூன்றாம் நபர் ஆண்பால் பன்மை பின்னொட்டு முந்தைய வசனங்களில் குறிப்பிடப்பட்ட மக்களைச் சுட்டுகிறது; உடனிணைவு சார்ந்த ב முன்னிடைச்சொல்லை ‘அவர்களுடன்’ இயல்பாக வழங்குகிறது.
- source_word: בִּתְּךָ
  choice: உன் மகளை
  rationale: இரண்டாம் நபர் ஆண்பால் ஒருமை உடைமைப் பின்னொட்டுடன் உள்ள ‘மகள்’ என்ற சொல்லின் நேரடியான மொழிபெயர்ப்பு.
- source_word: תִתֵּן
  choice: கொடுக்காதே
  rationale: எபிரெய வினை நேரடியாக ‘கொடு’ எனப் பொருள்படும். திருமணச் சூழல் பொருளைத் தெளிவாக்குவதால், தேவையற்ற விளக்கத்தை வினைக்குள் சேர்க்கவில்லை.
- source_word: לִבְנוֹ
  choice: அவனுடைய மகனுக்கு
  rationale: ל முன்னிடைச்சொல் மறைமுகப் பெறுநரைக் குறிக்கிறது; தமிழில் நான்காம் வேற்றுமை இதைத் தெளிவாகக் காட்டுகிறது.
- source_word: וּבִתּוֹ
  choice: அவனுடைய மகளை
  rationale: மூன்றாம் நபர் ஆண்பால் ஒருமை உடைமைப் பின்னொட்டுடன் உள்ள பெயர்ச்சொல்லை நேரடியாக மொழிபெயர்க்கிறது.
- source_word: תִקַּח
  choice: எடுத்துக்கொள்ளாதே
  rationale: எபிரெய வினையின் அடிப்படைப் பொருளான ‘எடு’ என்பதைக் காக்கிறது; திருமணச் சூழலில் ஒருவரை மகனுக்கான மணமகளாக ஏற்றுக்கொள்வது குறிக்கப்படுகிறது.
- source_word: לִבְנֶךָ
  choice: உன் மகனுக்காக
  rationale: இங்கு ל உறவைத் தமிழில் நோக்கம் அல்லது சார்பைக் குறிக்கும் ‘-க்காக’ இயல்பாக வெளிப்படுத்துகிறது; மகனுக்காக மணமகளை எடுத்துக்கொள்வதே கருத்து.
theological_decisions:
- issue: தடையின் வரம்பு
  choice: முன்னர் குறிப்பிடப்பட்ட மக்களுடனான திருமண உறவுகளுக்கான தடை என உரையை வழங்குதல்; அடுத்த வசனத்திலுள்ள காரணத்தை இங்கே சேர்க்காதிருத்தல்.
  alternative: எல்லா அந்நிய மக்களுடனான திருமணங்களுக்கும் பொதுவான தடை என விரிவுபடுத்துதல்.
  rationale: בָּם (‘அவர்களுடன்’) என்பது உடனடியான முந்தைய சூழலில் பெயரிடப்பட்ட மக்களையே சுட்டுகிறது. இந்த வசனம் கூறாத விரிவான இன அல்லது இறையியல் முடிவை மொழிபெயர்ப்பில் சேர்க்காமல், அதன் உடனடி சுட்டுதலைக் காக்கிறது.
- issue: பாலினம் குறிக்கும் குடும்பச் சொற்கள்
  choice: எபிரெய மூலத்தில் உள்ளதுபோல ‘மகள்’, ‘மகன்’ என்ற ஒருமைச் சொற்களைத் தக்கவைத்தல்.
  alternative: ‘பிள்ளைகள்’ போன்ற பாலினப் பொதுமைப்படுத்தப்பட்ட மொழியைப் பயன்படுத்துதல்.
  rationale: சட்ட வடிவிலான இவ்வாக்கியத்தில் எபிரெயம் பாலினம் குறிப்பிட்ட ஒருமை உறவுச் சொற்களைப் பயன்படுத்துகிறது; அவற்றைப் பொதுமைப்படுத்துவது மூலத்தின் வடிவத்தையும் குறிப்பையும் இழக்கச் செய்யும்.
translation_notes:
  register: நவீன நிலையான தமிழில், ஒருமை இரண்டாம் நபரை நோக்கிய சட்டக் கட்டளையின் நேரடித் தொனியைப் பேணுகிறது. ‘திருமண உறவு’ என்பது பரஸ்பரமான திருமணச் சம்பந்தத்தை இயல்பாக எடுத்துரைக்கிறது; ‘கொடு/எடுத்துக்கொள்’ என்ற இணையான வினை அமைப்பு எபிரெய வாக்கியத்தின் சமநிலையைத் தக்கவைக்கிறது.
