base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/011.yaml
  text: So you shall keep the commandment and the statutes and the judgments that I am commanding you today[b][a], to do them.
translation:
  language: ta
  text: ஆகவே[a], இன்று நான் உனக்குக் கட்டளையிடுகிற கட்டளையையும் நியமங்களையும் நீதித்தீர்ப்புகளையும்[b] நீ கைக்கொண்டு, அவற்றை நிறைவேற்றுவாயாக.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘மேலும்’ அல்லது ‘எனவே’ என்றும் மொழிபெயர்க்கலாம்; எபிரெய இணைப்புச்சொல் முந்தைய கருத்துடன் சாதாரணமாக இணைக்கவும், அதிலிருந்து ஒரு முடிவை எடுத்துக்காட்டவும் முடியும்.
    reason: lexical_alternative
  - marker: b
    text: ‘நீதித்தீர்ப்புகள்’ என்பதை ‘சட்டத் தீர்மானங்கள்’, ‘நீதிநியமங்கள்’ அல்லது ‘விதிமுறைகள்’ என்றும் மொழிபெயர்க்கலாம்; எபிரெயச் சொல் சட்டப்படி வழங்கப்படும் தீர்ப்புகளையோ நிர்ணயிக்கப்பட்ட சட்ட ஒழுங்குகளையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁמַרְתָּ
  choice: ஆகவே ... கடைப்பிடித்து
  rationale: שׁמר என்பது உடன்படிக்கை மற்றும் சட்டச் சூழலில் ‘கடைப்பிடி/பேணிக் கைக்கொள்’ என்று பொருள்படும். முன்னுள்ள வசனங்களிலிருந்து வரும் முடிவுறுத்தும் தொடர்பை וְ இங்கு காட்டுவதால் ‘ஆகவே’ என மொழிபெயர்க்கப்பட்டது; அதன் வேறு சாத்தியங்கள் அடிக்குறிப்பில் தரப்பட்டுள்ளன.
- source_word: הַמִּצְוָה
  choice: கட்டளையை
  rationale: எபிரெயச் சொல் ஒருமையில் இருப்பதால் தமிழிலும் ஒருமை காக்கப்பட்டது. தொடர்ந்து வரும் பன்மைச் சட்டப் பிரிவுகளிலிருந்து இதை வேறுபடுத்த ‘கட்டளை’ பயன்படுத்தப்பட்டது.
- source_word: הַחֻקִּים
  choice: நியமங்களை
  rationale: חֻקִּים என்பது நிர்ணயிக்கப்பட்ட சட்டவிதிகளைக் குறிக்கிறது. ‘நியமங்கள்’ என்பது இன்றைய தமிழில் புரிந்துகொள்ளக்கூடியதாயும், அடுத்த சட்டச்சொல்லிலிருந்து வேறுபட்டதாயும் உள்ளது.
- source_word: הַמִּשְׁפָּטִים
  choice: நீதிநியமங்களை
  rationale: מִשְׁפָּטִים என்பது நீதித்தீர்ப்புகள், சட்டத் தீர்மானங்கள் அல்லது விதிக்கப்பட்ட ஒழுங்குகள் எனப் பொருள்படலாம். ‘நீதிநியமங்கள்’ அதன் சட்ட-நீதி சார்ந்த தன்மையைப் பேணுகிறது; மாற்றுப் பொருள்கள் அடிக்குறிப்பில் குறிப்பிடப்படுகின்றன.
- source_word: אֲשֶׁר אָנֹכִי מְצַוְּךָ הַיּוֹם
  choice: இன்று நான் உனக்குக் கட்டளையிடுகிற
  rationale: מְצַוֶּה என்ற பங்கேற்புவினை தற்போதைய கட்டளையிடும் செயலைக் காட்டுகிறது. ‘இன்று’ என்ற உபாகமத்துக்குரிய உடன்படிக்கைச் சூழல் வலியுறுத்தலும் தக்கவைக்கப்பட்டது.
- source_word: לַעֲשׂוֹתָם
  choice: அவற்றை நிறைவேற்றுவாயாக
  rationale: עשה என்பதன் செயற்பாட்டு கீழ்ப்படிதல் உணர்வை ‘நிறைவேற்று’ இயல்பான தமிழில் வெளிப்படுத்துகிறது. 3ஆம் நபர் ஆண்பால் பன்மை பின்னொட்டு ‘அவற்றை’ என வெளிப்படையாகத் தரப்பட்டுள்ளது.
theological_decisions:
- issue: உடன்படிக்கைச் சட்டத்தைக் குறிக்கும் மூன்று சொற்களையும் தனித்தனியாக மொழிபெயர்த்தல்
  choice: கட்டளை, நியமங்கள், நீதிநியமங்கள்
  alternative: கட்டளை, சட்டங்கள், விதிமுறைகள்
  rationale: மூலத்தில் ஒத்த பொருள் வட்டம் கொண்ட மூன்று சட்டச்சொற்கள் தொடராக வந்து உடன்படிக்கைக் கீழ்ப்படிதலை வலியுறுத்துகின்றன. அவற்றை ஒரே பொதுச்சொல்லாகச் சுருக்காமல், தமிழிலும் வேறுபடுத்திக் காட்டுவது மூலத்தின் சட்ட-உடன்படிக்கை அமைப்பைப் பேணுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான சட்ட-உடன்படிக்கை நடை பயன்படுத்தப்பட்டுள்ளது. ஒருமை ‘நீ/உனக்கு’ காக்கப்பட்டுள்ளது. ‘நிறைவேற்றுவாயாக’ என்பது கட்டளையின் வலிமையையும் மரியாதையான வேதாகம நடையையும் இணைக்கிறது.
