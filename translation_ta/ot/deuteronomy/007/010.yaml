source:
  edition: WLC
  text: וּ/מְשַׁלֵּ֧ם לְ/שֹׂנְאָ֛י/ו אֶל פָּנָ֖י/ו לְ/הַאֲבִיד֑/וֹ לֹ֤א יְאַחֵר֙ לְ/שֹׂ֣נְא֔/וֹ אֶל פָּנָ֖י/ו יְשַׁלֶּם לֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/010.yaml
  text: and repays those who hate him to their face[a], to destroy them. He does not delay with the one who hates him; he will repay him to his face.
translation:
  language: ta
  text: தம்மை வெறுப்பவர்களுக்கு அவர்களுடைய முகத்துக்கு நேராகவே[a] அவர்களை அழிப்பதற்காகக் கைம்மாறு செய்கிறார். தம்மை வெறுப்பவனிடம் அவர் தாமதிப்பதில்லை; அவனுடைய முகத்துக்கு நேராகவே அவனுக்குக் கைம்மாறு செய்வார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எழுத்துப்படி, ‘அவருடைய/அவர்களுடைய முகத்தை நோக்கி.’ இந்த மரபுத்தொடரை ‘அவருடைய/அவர்களுடைய முன்னிலையில்’ அல்லது ‘கண்முன்னே’ என்றும் புரிந்துகொள்ளலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמְשַׁלֵּם / יְשַׁלֶּם
  choice: கைம்மாறு செய்து / கைம்மாறு செய்வார்
  rationale: שׁלם என்பதன் பியேல் வடிவம் இங்கு ஒருவருடைய செயலுக்கேற்ற பதிலைத் திருப்பிக் கொடுப்பதைக் குறிக்கிறது. ‘கைம்மாறு’ என்பது நீதித் தீர்ப்பின் பரஸ்பரத் தன்மையைப் பாதுகாக்கிறது; வெறும் பொதுவான ‘தண்டனை’ என்ற பொருளாகச் சுருக்குவதில்லை.
- source_word: לְשֹׂנְאָיו / לְשֹׂנְאוֹ
  choice: தம்மை வெறுப்பவர்களுக்கு / தம்மை வெறுப்பவனிடம்
  rationale: שׂנא வினையின் பெயரெச்ச வடிவம் அவரை வெறுப்பவர்களைக் குறிக்கிறது. முதல் வடிவத்தின் பன்மையையும் இரண்டாம் வடிவத்தின் ஒருமையையும் தமிழில் தெளிவாகப் பாதுகாக்கிறது.
- source_word: אֶל־פָּנָיו
  choice: அவர்களுடைய முகத்துக்கு நேராகவே / அவனுடைய முகத்துக்கு நேராகவே
  rationale: எபிரெயச் சொற்றொடரின் முகம் சார்ந்த உருவகத்தைத் தக்கவைத்து, கைம்மாறு நேரடியாகவும் அந்த நபரின் முன்னிலையிலும் நிகழ்வதை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: לְהַאֲבִידוֹ
  choice: அவர்களை அழிக்கிறார்
  rationale: אבד என்பதன் ஹிஃபில் வினையெச்சம் அழிவை ஏற்படுத்துவதைச் சொல்கிறது. முன்னுள்ள பன்மையான ‘வெறுப்பவர்கள்’ என்பதோடு தமிழில் இயல்பாகப் பொருந்துமாறு பன்மை பயன்படுத்தப்பட்டுள்ளது.
- source_word: לֹא יְאַחֵר
  choice: அவர் தாமதிப்பதில்லை
  rationale: אחר என்பதன் பியேல் வடிவம் தீர்ப்பைத் தள்ளிப்போடுதல் அல்லது தாமதித்தலைக் குறிக்கிறது. நிகழ்காலப் பொதுக்கூற்று எபிரெய வசனத்தின் உறுதியான தன்மையைத் தருகிறது.
theological_decisions:
- issue: தெய்வீகத் தீர்ப்பில் தேவனுடைய நேரடி செயல்பாடு
  choice: வெறுப்பவர்களுக்கு அவர் நேரடியாகக் கைம்மாறு செய்து அவர்களை அழிக்கிறார்
  alternative: அவர்களுடைய செயல்களின் விளைவாக அவர்கள் அழிகிறார்கள்
  rationale: எபிரெய உரையில் கைம்மாறு செய்பவரும் அழிப்பவரும் தேவனே. இதை ஆளற்ற விளைவாக மென்மைப்படுத்தாமல், மூலத்தின் இறையியல் அழுத்தத்தைப் பாதுகாக்கிறது.
- issue: முதல் கூறின் பன்மைக்கும் இரண்டாம் கூறின் ஒருமைக்கும் இடையிலான மாற்றம்
  choice: ‘வெறுப்பவர்கள்’ என்ற பன்மையிலிருந்து ‘வெறுப்பவன்’ என்ற ஒருமைக்கு மாறுதல் பாதுகாக்கப்பட்டது
  alternative: வசனம் முழுவதிலும் பன்மையை ஒரேமாதிரியாக்குதல்
  rationale: மூல உரை பொதுக் குழுவிலிருந்து ஒவ்வொரு தனிநபரையும் நோக்கும் ஒருமைக்குத் திரும்புகிறது; அந்த வலியுறுத்தலை மொழிபெயர்ப்பு மறைக்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. தேவனைக் குறிக்கும் இடத்தில் மரியாதை ஒருமை பயன்படுத்தப்பட்டுள்ளது; வெறுப்பவரைக் குறிக்கும் ஒருமை ‘அவன்’ எனத் தெளிவுபடுத்தப்பட்டுள்ளது. ‘முகத்துக்கு நேராகவே’ என்பது மூல உருவகத்தையும் நேரடியான கைம்மாற்றின் வலிமையையும் தக்கவைக்கிறது.
