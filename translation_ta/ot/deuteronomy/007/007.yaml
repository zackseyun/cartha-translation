  text: לֹ֣א מֵֽ/רֻבְּ/כֶ֞ם מִ/כָּל הָֽ/עַמִּ֗ים חָשַׁ֧ק יְהוָ֛ה בָּ/כֶ֖ם וַ/יִּבְחַ֣ר בָּ/כֶ֑ם כִּֽי אַתֶּ֥ם הַ/מְעַ֖ט מִ/כָּל הָ/עַמִּֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/007.yaml
  text: It was not because you were more numerous than all the peoples that Yahweh set his affection on you and chose you[a], for you were the fewest of all the peoples.
translation:
  language: ta
  text: நீங்கள் மற்ற எல்லா மக்களினங்களையும்விட எண்ணிக்கையில் மிகுந்தவர்களாக இருந்ததால் யாவே உங்கள்மீது பற்றுக்கொண்டு[a] உங்களைத் தேர்ந்தெடுக்கவில்லை; ஏனெனில், எல்லா மக்களினங்களிலும் நீங்களே எண்ணிக்கையில் மிகக் குறைந்தவர்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உங்கள்மீது அன்புவைத்து.” எபிரெய வினைச்சொல் ஆழ்ந்த பற்றை அல்லது பாசத்தை உணர்த்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵרֻבְּכֶם מִכָּל הָעַמִּים
  choice: நீங்கள் மற்ற எல்லா மக்களினங்களையும்விட எண்ணிக்கையில் மிகுந்தவர்களாக இருந்ததால்
  rationale: מִן உடன் வரும் ஒப்பீட்டையும், மறுப்புச் சொல்லால் உருவாகும் காரணப் பொருளையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது. ‘எண்ணிக்கையில்’ என்பது இங்கு பேசப்படுவது மக்கள்தொகை என்பதைத் தெளிவாக்குகிறது.
- source_word: הָעַמִּים
  choice: மக்களினங்கள்
  rationale: עַמִּים என்பது இச்சூழலில் தனித்தனி இன அல்லது மக்கள் குழுக்களைக் குறிக்கிறது. ‘நாடுகள்’ என்று மொழிபெயர்த்து அரசியல் பொருளைச் சேர்க்காமல், கூட்டுத் தன்மையை ‘மக்களினங்கள்’ காக்கிறது.
- source_word: חָשַׁק
  choice: பற்றுக்கொண்டு
  rationale: இந்த வினைச்சொல் ஆழ்ந்த பற்று, பாசம் அல்லது ஒருவரோடு தம்மை இணைத்துக்கொள்ளும் மனநிலையை உணர்த்துகிறது. ‘பற்றுக்கொண்டு’ என்பது அந்த வலுவான உறவுப் பொருளைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: திருப்பெயரை ஒரு பட்டப்பெயரால் மாற்றாமல், எபிரெய மெய்யெழுத்துப் பெயரின் பரவலான ஒலிபெயர்ப்பைத் தமிழில் வழங்குகிறது.
- source_word: וַיִּבְחַר
  choice: உங்களைத் தேர்ந்தெடுக்கவில்லை
  rationale: בחר என்பதன் வழக்கமான ‘தேர்ந்தெடு’ என்ற பொருளைக் காக்கிறது. எபிரெய வாக்கியத்தின் தொடக்க மறுப்பு, பற்றுக்கொள்வதற்கும் தேர்ந்தெடுப்பதற்குமான காரணம் எண்ணிக்கை அல்ல என்பதைக் குறிக்கிறது; தமிழில் வாக்கிய இறுதி மறுப்பு அதை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய மறுப்புக்கான விளக்கத்தை அறிமுகப்படுத்தும் தொடர்பைத் தெளிவாகக் காட்டுகிறது.
- source_word: הַמְעַט מִכָּל הָעַמִּים
  choice: எல்லா மக்களினங்களிலும் நீங்களே எண்ணிக்கையில் மிகக் குறைந்தவர்கள்
  rationale: இஸ்ரவேலின் ஒப்பீட்டு எண்ணிக்கைச் சிறுமையைத் தெளிவாகக் கூறுகிறது. ‘சிறியவர்கள்’ என்பதால் ஏற்படக்கூடிய நிலப்பரப்பு அல்லது மதிப்பு சார்ந்த தவறான புரிதலை ‘எண்ணிக்கையில்’ தவிர்க்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலத்தில் தனிப்பட்ட இறைப்பெயர் நேரடியாக உள்ளது. அதை ஒரு பட்டப்பெயராக மாற்றாமல் ஒலிபெயர்ப்பது மூலத்தின் தன்மையைக் காக்கிறது.
- issue: இறைத் தேர்ந்தெடுப்பின் பொருளை அளவுக்கு மீறி விளக்குதல்
  choice: உங்களைத் தேர்ந்தெடுக்கவில்லை
  alternative: உங்களைத் தமது மக்களாகத் தேர்ந்தெடுக்கவில்லை
  rationale: மூலம் ‘தேர்ந்தெடுத்தார்’ என்று மட்டுமே கூறுகிறது; தேர்வின் நோக்கத்தை இந்த வசனத்துக்குள் கூடுதலாகச் சேர்க்காமல், உடன்படிக்கைச் சூழலின் இறைத் தேர்வை அப்படியே விடுகிறது.
- issue: இறைவன் பற்றுக்கொண்டதற்கும் தேர்ந்தெடுத்ததற்குமான காரணம்
  choice: அவர்களின் எண்ணிக்கை காரணமல்ல என்ற மறுப்பைப் பாதுகாத்தல்
  alternative: அவர்களின் சிறிய எண்ணிக்கையே தேர்வுக்குக் காரணம் என்று வாசித்தல்
  rationale: כִּי அடுத்த விளக்கத்தை அறிமுகப்படுத்தினாலும், வசனத்தின் மையக் கூற்று எண்ணிக்கை மிகுதியை காரணமாக மறுக்கிறது. ‘நீங்கள் மிகக் குறைந்தவர்கள்’ என்பது அந்த மறுப்பை வலுப்படுத்துகிறது; சிறிய எண்ணிக்கையே நேர்மறையான காரணம் என்று உரை வெளிப்படையாகக் கூறவில்லை.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. ஒப்பீட்டையும் எண்ணிக்கை சார்ந்த பொருளையும் தெளிவாக்க ‘மற்ற எல்லா மக்களினங்களையும்விட’ மற்றும் ‘எண்ணிக்கையில்’ பயன்படுத்தப்பட்டுள்ளன. வாக்கிய அமைப்பு எபிரெய மறுப்பின் நோக்கத்தைத் தக்கவைத்தபடியே இயல்பான தமிழாக வடிவமைக்கப்பட்டுள்ளது.
