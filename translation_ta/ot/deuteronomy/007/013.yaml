  source_fidelity: மூல எபிரெயத்தின் எதிர்கால ஆசீர்வாதத் தொடரும், வயிற்றின் கனி, நிலத்தின் விளைச்சல், தானியம், புதுத் திராட்சரசம், எண்ணெய், கால்நடைகளின் பெருக்கு, வாக்குத்தத்த நாடு ஆகிய கூறுகளும் பெரும்பாலும் சரியாகத் தரப்பட்டுள்ளன. ஆனால் இறுதியில் சேர்க்கப்பட்டுள்ள “இவ்வாறு செய்வார்” என்பதற்கு மூலத்தில் இணையான சொல் இல்லை; அது தேவையற்ற கூடுதலாகும்.
  naturalness: நடை பொதுவாக நவீன தரத் தமிழுக்கு ஏற்றது. இருப்பினும், “உன் நிலத்தின் விளைச்சலாகிய உன் தானியம்...” என்ற பட்டியலை வேற்றுமை உருபுகளுடன் இணைப்பதும், நாட்டைக் குறிக்கும் தொடரை ஆசீர்வாத வினையோடு நேரடியாக இணைப்பதும் தெளிவாகவும் இயல்பாகவும் அமையும்.
