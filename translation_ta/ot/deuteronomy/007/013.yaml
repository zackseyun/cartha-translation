base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/013.yaml
  text: He will love you[a], bless you, and multiply you. He will bless the fruit of your womb and the fruit of your ground—your grain, your new wine, and your oil, the offspring of your herds and the young of your flock—in the land that he swore to your fathers to give you.
translation:
  language: ta
  text: 'அவர் உன்மேல் அன்புகூர்ந்து, உன்னை ஆசீர்வதித்து, உன்னைப் பெருகச் செய்வார். உனக்குக் கொடுப்பதாக உன் தந்தையருக்கு[a] அவர் சத்தியம் செய்த நாட்டில், அவர் உன் வயிற்றின் கனியையும், உன் நிலத்தின் விளைச்சலாகிய உன் தானியத்தையும், உன் புதுத் திராட்சரசத்தையும், உன் எண்ணெயையும், உன் மாட்டு மந்தைகளின் கன்றுகளையும், உன் ஆட்டு மந்தையின் குட்டிகளையும் ஆசீர்வதிப்பார்.


    [a] அல்லது, “உன் மூதாதையருக்கு.” எபிரெயில், “உன் தந்தையருக்கு.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உன் மூதாதையருக்கு.” எபிரெயில், “உன் தந்தையருக்கு.”
    reason: לַאֲבֹתֶיךָ என்ற ஆண்பால் பன்மையின் நேரடி வடிவத்தையும் அதன் பரந்த வம்சவழிப் பொருளையும் ஒன்றாகக் காட்டும் சொற்பொருள் மாற்று.
lexical_decisions:
- source_word: וַאֲהֵבְךָ
  choice: அவர் உன்னிடம் அன்புகூர்ந்து
  rationale: சூழலில் இது உடன்படிக்கையின் ஆசீர்வாதங்களை எதிர்கால நோக்கில் தொடர்கிறது. ‘அன்புகூர்ந்து’ என்பது உடன்படிக்கை சார்ந்த அன்பை விளக்கவுரையாக்காமல் காக்கிறது.
- source_word: וּבֵרַכְךָ
  choice: உன்னை ஆசீர்வதித்து
  rationale: ברך என்பதற்கான இயல்பான, நிலைபெற்ற தமிழ் இணை; நேரடியான இரண்டாம் நபர் ஒருமை வடிவத்தைக் காக்கிறது.
- source_word: וְהִרְבֶּךָ
  choice: உன்னைப் பெருகச் செய்வார்
  rationale: மக்கள்தொகையிலும் சந்ததியிலும் உண்டாகும் அதிகரிப்பைச் சுட்டும் எபிரெய வினையின் காரணவினைப் பொருளைத் தெளிவாகத் தருகிறது.
- source_word: פְּרִי בִטְנְךָ
  choice: உன் வயிற்றின் கனி
  rationale: சந்ததியையும் கருவளத்தையும் குறிக்கும் மூலமொழியின் உருவகத்தைத் தமிழில் காக்கிறது; பாலினத்தை தேவையின்றி குறுக்கவில்லை.
- source_word: וּפְרִי אַדְמָתֶךָ
  choice: உன் நிலத்தின் விளைச்சல்
  rationale: வேளாண் சூழலில் இயல்பான தமிழைத் தருகிறது. முன்னுள்ள ‘கனி’ என்ற உருவகத்துடன் தொடர்பு இருந்தாலும், நிலத்தைக் குறித்து ‘விளைச்சல்’ என்பது தெளிவான நவீன வழக்கு.
- source_word: דְּגָנְךָ
  choice: உன் தானியம்
  rationale: அறுவடை செய்யப்பட்ட தானிய வகைகளைப் பொதுவாகவும் தெளிவாகவும் குறிக்கிறது.
- source_word: תִירֹשְׁךָ
  choice: புதுத் திராட்சரசம்
  rationale: תירוש பொதுவாகப் புதிய திராட்சரசத்தையோ புதிதாகப் பிழியப்பட்ட திராட்சைச் சாற்றையோ குறிக்கக்கூடியதால், ‘புது’ என்ற வேறுபாட்டைக் காக்கிறது; ‘திராட்சரசம்’ வேளாண் மூன்றிணையின் சூழலைத் தெளிவாக்குகிறது.
- source_word: יִצְהָרֶךָ
  choice: எண்ணெய்
  rationale: இது பொதுவாக ஒலிவ எண்ணெயைக் குறித்தாலும், மூலத்தில் மரவகை வெளிப்படையாக இல்லை; ஆகவே முதன்மை உரையில் பொதுப்பெயர் காக்கப்படுகிறது.
- source_word: שְׁגַר אֲלָפֶיךָ
  choice: உன் மாட்டு மந்தைகளின் கன்றுகள்
  rationale: பன்மையிலுள்ள கால்நடை/மாட்டு மந்தைகளின் பிறப்புகளைத் தெளிவாகக் குறிக்கிறது; மூலத்தின் பன்மையும் காக்கப்படுகிறது.
- source_word: עַשְׁתְּרֹת צֹאנֶךָ
  choice: உன் ஆட்டு மந்தையின் குட்டிகள்
  rationale: அரிதான பெயர்ச்சொல் இச்சேர்க்கையில் சிறுகால்நடை மந்தையின் பெருக்கைக் குறிக்கிறது. தேவியின் பெயராகத் தவறாக எடுத்துரைக்காமல் சூழல்சார் பொருளை வழங்குகிறது.
- source_word: עַל הָאֲדָמָה
  choice: நாட்டில்
  rationale: இங்கு வாக்குத்தத்தம் செய்யப்பட்ட பிரதேசமே குறிக்கப்படுவதால், ‘நாட்டில்’ என்பது இயல்பான இடவியல் மொழிபெயர்ப்பு.
- source_word: אֲשֶׁר נִשְׁבַּע לַאֲבֹתֶיךָ לָתֶת לָךְ
  choice: உனக்குக் கொடுப்பதாக உன் தந்தையருக்கு அவர் சத்தியம் செய்த
  rationale: உறுதிமொழிச் சூத்திரத்தையும் இரண்டாம் நபர் ஒருமையையும் காக்கிறது. אָבוֹת என்பதன் வெளிப்படையான ஆண்பால் பன்மையை ‘தந்தையர்’ எனத் தருகிறது.
theological_decisions:
- issue: לַאֲבֹתֶיךָ என்பதன் மொழிபெயர்ப்பு
  choice: உன் தந்தையருக்கு
  alternative: உன் மூதாதையருக்கு
  rationale: எபிரெயச் சொல் ஆண்பால் பன்மையில் ‘தந்தையர்’ என்று உள்ளது. பாலினத்தைப் பொதுமைப்படுத்தாமல் மூல வடிவத்தை முதன்மை உரையில் காத்து, பரந்த வம்சவழிப் பொருளான ‘மூதாதையர்’ என்பதை அடிக்குறிப்பில் வழங்குகிறது.
- issue: ஆசீர்வாத வினைகளின் காலநிலை
  choice: எதிர்கால ஆசீர்வாதங்களாக மொழிபெயர்த்தல்
  alternative: கடந்தகாலச் செயல்களாக மொழிபெயர்த்தல்
  rationale: முன்னொட்டுடன் வரும் வினைவடிவம் தனியே பார்க்கையில் வேறு காலநிலையை அனுமதிக்கக்கூடியதாயினும், உபாகமம் 7:12–13 இன் நிபந்தனை-வாக்குறுதி தொடரில் இவை எதிர்கால விளைவுகளாகச் செயல்படுகின்றன.
translation_notes:
  register: நவீன தரத் தமிழில், ஒருமை ‘நீ’ முகவரியைத் தொடர்ந்து ‘உன்/உன்னை’ வடிவங்கள் காக்கப்பட்டுள்ளன. வேளாண் சொற்கள் சாதாரண வாசகருக்குப் புரியும் வகையில் தேர்ந்தெடுக்கப்பட்டுள்ளன; அதேவேளை ‘வயிற்றின் கனி,’ ‘சத்தியம் செய்த’ போன்ற மூல உருவகங்களும் உடன்படிக்கை மொழிநடையும் dignified biblical register-இல் பாதுகாக்கப்பட்டுள்ளன.
