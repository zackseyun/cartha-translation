  revised_text: 'அவர் உன்மேல் அன்புகூர்ந்து, உன்னை ஆசீர்வதித்து, உன்னைப் பெருகச் செய்வார். உனக்குக் கொடுப்பதாக உன் தந்தையருக்கு[a] அவர் சத்தியம் செய்த நாட்டில், அவர் உன் வயிற்றின் கனியையும், உன் நிலத்தின் விளைச்சலாகிய உன் தானியத்தையும், உன் புதுத் திராட்சரசத்தையும், உன் எண்ணெயையும், உன் மாட்டு மந்தைகளின் கன்றுகளையும், உன் ஆட்டு மந்தையின் குட்டிகளையும் ஆசீர்வதிப்பார்.


    [a] அல்லது, “உன் மூதாதையருக்கு.” எபிரெயில், “உன் தந்தையருக்கு.”'
