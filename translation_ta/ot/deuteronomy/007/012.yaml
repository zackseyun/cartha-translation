  text: וְ/הָיָ֣ה עֵ֣קֶב תִּשְׁמְע֗וּ/ן אֵ֤ת הַ/מִּשְׁפָּטִים֙ הָ/אֵ֔לֶּה וּ/שְׁמַרְתֶּ֥ם וַ/עֲשִׂיתֶ֖ם אֹתָ֑/ם וְ/שָׁמַר֩ יְהוָ֨ה אֱלֹהֶ֜י/ךָ לְ/ךָ֗ אֶֽת הַ/בְּרִית֙ וְ/אֶת הַ/חֶ֔סֶד אֲשֶׁ֥ר נִשְׁבַּ֖ע לַ/אֲבֹתֶֽי/ךָ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/012.yaml
  text: And because you listen to these judgments[a], and keep and do them[c][b], Yahweh your God will keep for you the covenant and the steadfast love that he swore to your fathers.
translation:
  language: ta
  text: நீங்கள் இந்த நீதிநியமங்களுக்குச்[a] செவிகொடுத்து, அவற்றைக் கைக்கொண்டு செயல்படுத்தினால், உன் கடவுளாகிய யாவே உன் தந்தையருக்கு[c] சத்தியம் செய்து வாக்களித்த உடன்படிக்கையையும் மாறாத அன்பையும்[b] உனக்காகக் காப்பார்.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘நீதிநியமங்கள்’ என்பதற்கு ‘சட்டத்தீர்ப்புகள்’ அல்லது ‘சட்டவிதிகள்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘மாறாத அன்பு’ என்பது எபிரேய மொழியின் חֶסֶד (ஹெசெத்) என்ற சொல்லை மொழிபெயர்க்கிறது. இது உடன்படிக்கை உறவில் காட்டப்படும் நிலையான, உண்மையுள்ள அன்பைக் குறிக்கிறது; ‘உடன்படிக்கை விசுவாசம்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: ‘தந்தையர்’ என்பதற்கு ‘முன்னோர்கள்’ என்றும் மொழிபெயர்க்கலாம்; எபிரேய மூலம் குறிப்பாக ஆண்பால் வடிவைப் பயன்படுத்துகிறது.
    reason: lexical_alternative
  - marker: d
    text: மூல எபிரேயத்தில் முதலில் ‘நீங்கள்’ என்ற பன்மையும், பின்னர் ‘உன்/உனக்கு’ என்ற ஒருமையும் வருகிறது. இஸ்ரவேல் மக்கள் பலராகவும் ஒரே உடன்படிக்கைச் சமூகமாகவும் அழைக்கப்படுவதை இந்த மொழிபெயர்ப்பு தக்கவைக்கிறது.
    reason: source_structure
lexical_decisions:
- source_word: וְהָיָה עֵקֶב
  choice: செயல்படுத்துவதன் விளைவாக
  rationale: இந்த எபிரேயச் சொற்றொடர், தொடர்ந்து கூறப்படும் கீழ்ப்படிதலின் விளைவை அறிமுகப்படுத்துகிறது. தமிழில் இயல்பாகவும் காரண–விளைவு தொடர்பைத் தெளிவாகவும் காட்ட இந்த வடிவம் தேர்ந்தெடுக்கப்பட்டது.
- source_word: תִּשְׁמְעוּן
  choice: செவிகொடுத்து
  rationale: שׁמע என்பது வெறுமனே ஒலியைக் கேட்பதை அல்லாமல், கீழ்ப்படிதலுக்கு வழிவகுக்கும் கவனமான கேட்டலைக் குறிக்கலாம். அடுத்ததாக ‘கைக்கொண்டு செயல்படுத்துதல்’ வருவதால், ‘கீழ்ப்படிந்து’ என்று மொழிபெயர்த்து கருத்தை இரட்டிப்பாக்காமல் ‘செவிகொடுத்து’ என வழங்கப்பட்டது.
- source_word: הַמִּשְׁפָּטִים הָאֵלֶּה
  choice: இந்த நீதிநியமங்கள்
  rationale: מִשְׁפָּטִים என்பதிலுள்ள நீதி மற்றும் சட்ட ஒழுங்கு ஆகிய இரு கூறுகளையும் தக்கவைக்க ‘நீதிநியமங்கள்’ பயன்படுத்தப்பட்டது; ‘விதிகள்’ என்பது அதன் சட்ட–நீதிசார் நிறையைச் சற்றுக் குறைக்கலாம்.
- source_word: וּשְׁמַרְתֶּם וַעֲשִׂיתֶם אֹתָם
  choice: அவற்றைக் கைக்கொண்டு செயல்படுத்தி
  rationale: மூலத்தில் ‘காத்தல்/கைக்கொள்ளுதல்’ மற்றும் ‘செய்தல்’ என இரண்டு வினைகள் உள்ளன. அவற்றை ஒன்றாகச் சுருக்காமல் இரண்டையும் தமிழில் தக்கவைக்கிறது.
- source_word: וְשָׁמַר
  choice: காத்தருளுவார்
  rationale: யாவே உடன்படிக்கையையும் மாறாத அன்பையும் உண்மையுடன் காப்பார் என்ற பொருளைத் தருகிறது. மரியாதைக்குரிய தமிழ் இறைவினை வடிவமான ‘அருள்’ இணைப்பு, மூலத்தில் இல்லாத புதிய செயலைச் சேர்க்காமல் தமிழ் வேதாகம நடையின் கண்ணியத்தைப் பேணுகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இது பட்டப்பெயர் அல்ல, இஸ்ரவேலுக்கு வெளிப்படுத்தப்பட்ட தெய்வீகத் திருப்பெயர்; எனவே ‘ஆண்டவர்’ என்று மாற்றாமல் ஒலிபெயர்க்கப்பட்டது.
- source_word: אֱלֹהֶיךָ
  choice: உன் கடவுள்
  rationale: எபிரேய மூலத்தின் இரண்டாம் நபர் ஒருமையையும் உடன்படிக்கை உறவையும் தக்கவைக்கிறது.
- source_word: לְךָ
  choice: உனக்காக
  rationale: யாவேயின் உடன்படிக்கைக் காத்தல் யாருடைய நலனுக்காக என்பது இங்கு குறிக்கப்படுகிறது.
- source_word: הַבְּרִית
  choice: உடன்படிக்கை
  rationale: בְּרִית என்பதற்கான நிலையான, மையமான உடன்படிக்கைச் சொல்லைத் தக்கவைக்கிறது.
- source_word: הַחֶסֶד
  choice: மாறாத அன்பு
  rationale: חֶסֶד என்பதில் அன்பு, நிலைத்தன்மை, உறவுசார் விசுவாசம் ஆகியவை ஒன்றிணைந்துள்ளன. ‘மாறாத அன்பு’ இவற்றை இயல்பான தமிழில் வெளிப்படுத்துகிறது; சொல்லை வெறும் இரக்கம் அல்லது சட்டப்பூர்வ விசுவாசம் எனக் குறுக்கவில்லை.
- source_word: אֲשֶׁר נִשְׁבַּע
  choice: ஆணையிட்ட
  rationale: שׁבע இங்கு சத்தியம் செய்து உறுதியளிப்பதைக் குறிக்கிறது. ‘ஆணையிட்ட’ என்பது அதன் உறுதிமொழித் தன்மையைச் சுருக்கமாகக் காட்டுகிறது.
- source_word: לַאֲבֹתֶיךָ
  choice: உன் தந்தையருக்கு
  rationale: மூலத்தின் ஆண்பால் பன்மையைப் பொதுவான ‘முன்னோர்கள்’ என்று மாற்றாமல், முற்பிதாக்களைக் குறிக்கும் சொல்லாகத் தக்கவைக்கிறது.
theological_decisions:
- issue: உடன்படிக்கைச் சூழலில் חֶסֶד என்பதன் மொழிபெயர்ப்பு
  choice: மாறாத அன்பு
  alternative: உடன்படிக்கை விசுவாசம்; பேரிரக்கம்; நிலையான அன்பு
  rationale: இந்தச் சொல் அருளார்ந்த அன்பையும் உறவுக்கு உண்மையாக நிலைத்திருப்பதையும் ஒருங்கே சுமக்கிறது. ‘மாறாத அன்பு’ அந்தத் தெய்வீக அன்பை வெறும் உணர்ச்சியாகவோ வெறும் சட்டக் கடமையாகவோ குறுக்காமல் விடுகிறது.
- issue: לַאֲבֹתֶיךָ என்பதிலுள்ள பாலினக் குறிப்பு
  choice: உன் தந்தையருக்கு
  alternative: உன் முன்னோர்களுக்கு
  rationale: மூலம் தந்தையர் அல்லது முற்பிதாக்கள் எனத் தெளிவாக ஆண்பால் வடிவைப் பயன்படுத்துவதால் அது பொதுமைப்படுத்தப்படவில்லை.
- issue: இரண்டாம் நபர் பன்மையிலிருந்து ஒருமைக்கு மாறுதல்
  choice: ‘நீங்கள்’ என்பதையும் பின்னர் ‘உன்/உனக்கு’ என்பதையும் தக்கவைத்தல்
  alternative: வசனம் முழுவதும் ‘நீங்கள்/உங்கள்’ என்று ஒரே எண்ணில் வழங்குதல்
  rationale: மோசே முதலில் மக்களைப் பன்மையில் அழைத்து, பின்னர் இஸ்ரவேலை ஒரே உடன்படிக்கை மக்களாக ஒருமையில் பேசும் மூலத்தின் மாற்றம் பொருள் வாய்ந்ததாக இருக்கக்கூடும்; அதை அமைதியாகச் சமப்படுத்தவில்லை.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகப் புரியும் வகையிலும், உடன்படிக்கை உரைக்கு ஏற்ற கண்ணியத்துடனும் வடிவமைக்கப்பட்டது. ‘செவிகொடுத்து’, ‘கைக்கொண்டு’, ‘செயல்படுத்துதல்’ ஆகியவை கேட்டல் முதல் நடைமுறை கீழ்ப்படிதல் வரை உள்ள நகர்வைத் தெளிவாக்குகின்றன. யாவே என்ற திருப்பெயர் ஒலிபெயர்க்கப்பட்டுள்ளது; மூலத்திலுள்ள பன்மை–ஒருமை மாற்றம் குறிப்புடன் பாதுகாக்கப்பட்டுள்ளது.
