revisions:
- from: நீங்கள் இந்த நீதிநியமங்களுக்குச்[a] செவிகொடுத்து, அவற்றைக் கைக்கொண்டு செயல்படுத்துவதன் விளைவாக, உன் கடவுளாகிய யாவே, உன் தந்தையருக்கு[c] ஆணையிட்ட உடன்படிக்கையையும் மாறாத அன்பையும்[b] உனக்காகக் காத்தருளுவார்.[d]
  to: நீங்கள் இந்த நீதிநியமங்களுக்குச்[a] செவிகொடுத்து, அவற்றைக் கைக்கொண்டு செயல்படுத்தினால், உன் கடவுளாகிய யாவே உன் தந்தையருக்கு[c] சத்தியம் செய்து வாக்களித்த உடன்படிக்கையையும் மாறாத அன்பையும்[b] உனக்காகக் காப்பார்.[d]
  rationale: 'The revision corrects the oath verb: Yahweh did not merely command the fathers but swore an oath to them. It also uses a natural Tamil conditional construction for the Hebrew consequence and removes the non-source addition in ‘காத்தருளுவார்,’ retaining the important keep/keep verbal linkage as closely as Tamil permits. All original footnote anchors remain present and correctly placed.'
  reviewer_model: gpt-5.6-terra
