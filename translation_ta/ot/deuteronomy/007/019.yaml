base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/019.yaml
  text: the great trials that your eyes saw[a], and the signs, and the wonders, and the mighty hand[b], and the outstretched arm by which Yahweh your God brought you out—so Yahweh your God will do to all the peoples of whom you are afraid.
translation:
  language: ta
  text: உன் கண்கள் கண்ட பெரும் சோதனைகளையும்[a], அடையாளங்களையும், அற்புதங்களையும், வல்லமையான கையாலும் நீட்டிய புயத்தாலும் உன் கடவுளாகிய யாவே உன்னை வெளியே கொண்டுவந்ததையும் போலவே, நீ அஞ்சுகிற எல்லா மக்களினங்களுக்கும்[b] உன் கடவுளாகிய யாவே செய்வார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘பெரும் சோதித்தல்களையும்.’ எபிரெயச் சொல் கடுமையான சோதனைகளையோ சோதித்தல்களையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘எல்லா தேசங்களுக்கும்.’ ‘மக்களினங்கள்’ என்பது எபிரெயச் சொல்லை இன்னும் நேரடியாகப் பிரதிபலிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּסֹּת הַגְּדֹלֹת
  choice: பெரும் சோதனைகள்
  rationale: மַסּוֹת என்பது கடுமையான சோதித்தல்களையோ சோதனைகளையோ குறிக்கலாம். இங்கு எகிப்தில் காணப்பட்ட கடவுளின் வல்ல செயல்களைச் சுட்டுவதால், மூலத்தின் பொருள் விரிவைத் தக்கவைக்கும் இயல்பான தமிழ் சொல்லாக இது அமைகிறது.
- source_word: רָאוּ עֵינֶיךָ
  choice: உன் கண்கள் கண்ட
  rationale: எபிரெயத்தில் ‘உன் கண்கள்’ என்பது வெளிப்படையாக இருப்பதால், நேரில் கண்ட அனுபவத்திற்குக் கொடுக்கப்படும் வலியுறுத்தலைத் தமிழிலும் தக்கவைக்கிறது.
- source_word: הָאֹתֹת
  choice: அடையாளங்கள்
  rationale: אוֹת என்பதன் வழக்கமான பொருளான ‘அடையாளம்’ என்பதைத் தெளிவாகப் பிரதிபலிக்கிறது.
- source_word: הַמֹּפְתִים
  choice: அற்புதங்கள்
  rationale: מוֹפְתִים என்பது வியப்பூட்டும் அசாதாரண செயல்களைக் குறிக்கிறது; ‘அடையாளங்கள்’ என்பதுடன் இயல்பாக இணைகிறது.
- source_word: הַיָּד הַחֲזָקָה
  choice: வல்லமையான கை
  rationale: தெய்வீக வல்லமையுள்ள செயலைக் குறிக்கும் எபிரெய உருவகத்தைத் தக்கவைக்கிறது.
- source_word: הַזְּרֹעַ הַנְּטוּיָה
  choice: ஓங்கிய புயம்
  rationale: விடுதலையிலும் நியாயத்தீர்ப்பிலும் செயல்படும் கடவுளின் ஆற்றலைக் குறிக்கும் நிலையான உருவகத்தை இயல்பான, உயர்ந்த தமிழில் வழங்குகிறது.
- source_word: אֲשֶׁר הוֹצִאֲךָ
  choice: கொண்டு ... உன்னை வெளியே அழைத்துவந்தார்
  rationale: முன் குறிப்பிடப்பட்ட வல்லமையான செயல்களையும் குறிப்பாக கை, புயம் என்ற உருவகங்களையும் விடுதலையின் கருவிகளாக இணைக்கிறது; ஹிபில் வடிவின் காரணவினைப் பொருளையும் தருகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: திருநாமத்தை ஒரு பட்டப்பெயரால் மாற்றாமல், தமிழில் பரவலாகப் புரிந்துகொள்ளப்படும் ஒலிபெயர்ப்பால் வழங்குகிறது.
- source_word: כֵּן יַעֲשֶׂה
  choice: அவ்வாறே ... செய்வார்
  rationale: முந்தைய விடுதலைச் செயல்களுக்கும் இனி செய்யப்போகும் செயலுக்கும் இடையிலான ஒப்புமையைத் தெளிவாகக் காட்டுகிறது.
- source_word: לְכָל הָעַמִּים
  choice: எல்லா மக்களினங்களுக்கும்
  rationale: עַמִּים என்பதன் பன்மை வடிவை ‘நாடுகள்’ என்று அரசியல் அலகுகளாகக் குறுக்காமல், தனித்தனி மக்கள் கூட்டங்களாகப் பிரதிபலிக்கிறது.
- source_word: אֲשֶׁר אַתָּה יָרֵא מִפְּנֵיהֶם
  choice: நீ அஞ்சுகிற
  rationale: ‘அவர்களுக்கு முன்பாக/அவர்களால் அஞ்சுதல்’ என்ற எபிரெய மரபுத்தொடரின் இயல்பான தமிழ் பொருளைச் சுருக்கமாக வழங்குகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைநாமத்தை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலத்தில் தனிப்பட்ட உடன்படிக்கைப் பெயர் நேரடியாக இடம்பெறுவதால், அதை ஒரு பட்டப்பெயரால் மாற்றாமல் ஒலிபெயர்ப்பது பொருத்தமானது.
translation_notes:
  register: நவீன தரநிலைத் தமிழில், ஒருமை இரண்டாம் நபர் உரையைத் தக்கவைத்து, dignified ஆனால் பொதுவாசகர்களுக்கு எளிதில் புரியும் நடையில் வடிவமைக்கப்பட்டது. நீண்ட எபிரெய வாக்கியம் தமிழின் இயல்புக்காக இரண்டு வாக்கியங்களாகப் பிரிக்கப்பட்டது; பட்டியலின் ஒத்திசைவும் கை/புயம் உருவகங்களும் காக்கப்பட்டன.
