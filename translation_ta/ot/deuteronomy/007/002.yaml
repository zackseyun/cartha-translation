  text: וּ/נְתָנָ֞/ם יְהוָ֧ה אֱלֹהֶ֛י/ךָ לְ/פָנֶ֖י/ךָ וְ/הִכִּיתָ֑/ם הַחֲרֵ֤ם תַּחֲרִים֙ אֹתָ֔/ם לֹא תִכְרֹ֥ת לָ/הֶ֛ם בְּרִ֖ית וְ/לֹ֥א תְחָנֵּֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/002.yaml
  text: And when Yahweh your God gives them over to you before you[a], and you strike them down, you shall utterly devote them to destruction[b]. You shall make no covenant with them and show them no favor.
translation:
  language: ta
  text: உன் கடவுளாகிய யாவே உன் முன்னால் அவர்களை ஒப்புக்கொடுத்து, நீ அவர்களை வீழ்த்தும்போது, அவர்களை அழிவுக்கென்று முற்றிலும் அர்ப்பணித்துவிட வேண்டும்.[a] அவர்களோடு உடன்படிக்கை செய்யாதே; அவர்களுக்குத் தயவு காட்டாதே.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்களை முற்றிலும் அழித்துவிட வேண்டும்.” எபிரேய மொழியில் חרם என்ற வினை தீவிரப்படுத்தும் இலக்கண அமைப்புடன் வருகிறது; அது அழிவுக்கென்று முழுமையாக ஒதுக்கப்படுவதைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அவர்களுக்கு இரக்கம் காட்டாதே.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּנְתָנָם
  choice: அவர்களை உன்னிடம் ஒப்புக்கொடுத்து
  rationale: போர்ச் சூழலில் נתן என்பது ஒருவரை மற்றொருவரின் அதிகாரத்திற்கு ஒப்புக்கொடுப்பதைக் குறிக்கிறது. மூலத்தில் இல்லாத ‘கை’ என்ற உருவகத்தைச் சேர்க்காமல், இறைச் செயலையும் இயல்பான தமிழையும் இச்சொற்றொடர் காக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரான நான்கெழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், நவீனத் தமிழில் பரவலாகப் புரிந்துகொள்ளக்கூடிய ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: לְפָנֶיךָ
  choice: உன்னிடம்
  rationale: சொல்லுக்கு சொல் ‘உன் முன்னால்’ என்றாலும், இப்போர்ச் சூழலில் அவர்கள் இஸ்ரவேலின் முன் ஒப்புக்கொடுக்கப்படுவதையும் அதிகாரத்திற்குள் கொண்டுவரப்படுவதையும் இயல்பான தமிழில் ‘உன்னிடம்’ தெரிவிக்கிறது.
- source_word: וְהִכִּיתָם
  choice: நீ அவர்களை வீழ்த்தும்போது
  rationale: נכה என்பதன் போர்ச் சூழலிலான தாக்கி வீழ்த்துதல் அல்லது தோற்கடித்தல் என்ற வன்மையான பொருளை, பழமையான நடையின்றித் தெளிவாகக் காட்டுகிறது.
- source_word: הַחֲרֵם תַּחֲרִים אֹתָם
  choice: அவர்களை அழிவுக்கென்று முற்றிலும் அர்ப்பணித்துவிட வேண்டும்
  rationale: வினையெச்சப் பெயருடன் வினை மீண்டும் வருவது கட்டளையை வலுப்படுத்துகிறது. חרם சாதாரண அழித்தலை மட்டும் அல்லாமல், அழிவுக்காக முழுமையாக ஒதுக்கப்படுதல் என்ற சமயவியல் வலிமையையும் கொண்டிருப்பதால், ‘அர்ப்பணித்துவிட’ என்ற சொல் அந்த இரு கூறுகளையும் காக்கிறது.
- source_word: לֹא תִכְרֹת לָהֶם בְּרִית
  choice: அவர்களோடு உடன்படிக்கை செய்யாதே
  rationale: כרת ברית என்ற எபிரேய மரபுத்தொடரின் இயல்பான தமிழாக்கம் இது; ‘ஒப்பந்தம்’ என்பதைவிட உறவுசார், முறையான கட்டுப்பாட்டை ‘உடன்படிக்கை’ சிறப்பாகக் காக்கிறது.
- source_word: וְלֹא תְחָנֵּם
  choice: அவர்களுக்குத் தயவு காட்டாதே
  rationale: חנן என்பதன் தயவு அல்லது ஆதரவு காட்டுதல் என்ற அடிப்படைப் பொருளை இது நேரடியாகத் தருகிறது. சூழலுக்கேற்ற ‘இரக்கம் காட்டாதே’ என்ற சாத்தியத்தையும் அடிக்குறிப்பு பாதுகாக்கிறது.
theological_decisions:
- issue: புனிதப் போர்ச் சூழலில் חרם என்பதன் மொழிபெயர்ப்பு
  choice: அழிவுக்கென்று முற்றிலும் அர்ப்பணித்துவிட வேண்டும்
  alternative: முற்றிலும் அழித்துவிட வேண்டும்; தடைக்கு உட்படுத்த வேண்டும்
  rationale: இது வெறும் படை அழிப்பாகப் பொருளைச் சுருக்காமல், முழுமையாக அழிவுக்கென ஒதுக்குதல் என்ற חרם-இன் சமயவியல் கூறையும் தீவிரத்தையும் காக்கிறது.
- issue: תְחָנֵּם என்பதன் மொழிபெயர்ப்பு
  choice: தயவு காட்டாதே
  alternative: இரக்கம் காட்டாதே
  rationale: எபிரேயச் சொல்லின் மையப் பொருள் தயவு அல்லது ஆதரவு காட்டுதல். சூழலில் ‘இரக்கம்’ என்பதும் சாத்தியம் என்பதால் அதனை அடிக்குறிப்பில் தருவது மூலத்தின் பொருள் வரம்பைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், ஒருமை இரண்டாம் நபர் கட்டளை வடிவம் முழுவதும் காக்கப்பட்டுள்ளது. நடை கண்ணியமானதும் பொதுவாசகர்களுக்குப் புரியக்கூடியதுமாக உள்ளது; חרם-இன் இயல்பற்ற ஆனால் முக்கியமான சமயவியல் பதற்றம் எளிமைப்படுத்தப்படவில்லை.
