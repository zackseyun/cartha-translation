  text: וְ/גַם֙ אֶת הַ/צִּרְעָ֔ה יְשַׁלַּ֛ח יְהוָ֥ה אֱלֹהֶ֖י/ךָ בָּ֑/ם עַד אֲבֹ֗ד הַ/נִּשְׁאָרִ֛ים וְ/הַ/נִּסְתָּרִ֖ים מִ/פָּנֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/020.yaml
  text: Moreover[b][a], Yahweh your God will send the hornet among them until even those who remain and those who hide themselves from before you perish.
translation:
  language: ta
  text: மேலும்[b], உன் கடவுளாகிய யாவே அவர்களிடையே குளவியை[a] அனுப்புவார்; எஞ்சியிருப்பவர்களும் உன் முன்னிலையிலிருந்து ஒளிந்துகொள்பவர்களும் அழிந்துபோகும்வரை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அச்சம்” அல்லது “பீதி.” சிலர் “குளவி” என்பதை நேரடியான பூச்சியாக அல்லாமல், கடவுள் அனுப்பும் அச்சத்தைக் குறிக்கும் உருவகமாகப் புரிந்துகொள்கிறார்கள்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அதோடு.”
    reason: previous_rendering
lexical_decisions:
- source_word: וְגַם
  choice: மேலும்
  rationale: முந்தைய வாக்குறுதிகளுடன் இச்செயலை இணைக்கும் சேர்க்கை மற்றும் வலியுறுத்தல் பொருளை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: הַצִּרְעָה
  choice: குளவியை
  rationale: குறிப்பிட்ட இச்சொல்லின் நேரடியான அகராதிப் பொருள் கொட்டும் பூச்சியான குளவி; எபிரெய ஒருமை இங்கு இனப்பெயராகவோ கூட்டுப்பொருளிலோ அமையலாம்.
- source_word: יְשַׁלַּח
  choice: அனுப்புவார்
  rationale: எதிரிகளிடையே இந்தக் கருவியை யாவே செயற்பட அனுப்புவதை நேரடியாகக் காட்டுகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய மூலத்திலுள்ள உடன்படிக்கைப் பெயரை பட்டப்பெயராக மாற்றாமல் ஒலிபெயர்க்கிறது.
- source_word: אֱלֹהֶיךָ
  choice: உன் கடவுளாகிய
  rationale: இரண்டாம் நபர் ஒருமைப் possessive உறவை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: בָּם
  choice: அவர்களிடையே
  rationale: எதிரிகளின் நடுவில் குளவி அனுப்பப்படுவதைக் குறிக்கும் இடப்பொருளைத் தெளிவாகத் தருகிறது.
- source_word: עַד אֲבֹד
  choice: அழிந்துபோகும்வரை
  rationale: செயலின் இறுதி எல்லையைச் சுட்டும் கட்டமைப்பையும், அழிவின் முடிவையும் இயல்பாகக் காக்கிறது.
- source_word: הַנִּשְׁאָרִים
  choice: எஞ்சியவர்கள்
  rationale: முந்தைய தாக்குதலுக்குப் பின் மீதியாயிருப்பவர்களைக் குறிக்கிறது; தேவையற்ற இறையியல் தொழில்சொல்லைத் தவிர்க்கிறது.
- source_word: וְהַנִּסְתָּרִים
  choice: ஒளிந்துகொண்டிருப்பவர்கள்
  rationale: இஸ்ரவேலரிடமிருந்து தங்களை மறைத்துக்கொண்டு இருப்பவர்களைச் சூழலுக்கேற்ற இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: מִפָּנֶיךָ
  choice: உனக்குத் தப்பி
  rationale: சொல்லளவில் ‘உன் முகத்திலிருந்து/உன் முன்னிலையிலிருந்து’ என்றாலும், இங்கு இஸ்ரவேலரின் முன்னேற்றத்திலிருந்து தப்பி ஒளிவதைக் குறிக்கும் சூழற்பொருளை இயல்பான தமிழில் தருகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலத்தில் நேரடியாக வரும் தனிப்பட்ட இறைப்பெயரை பொதுப் பட்டப்பெயரால் மாற்றாமல் பாதுகாக்கிறது.
- issue: הַצִּרְעָה நேரடியான பூச்சியா அல்லது உருவகமான அச்சமா
  choice: முதன்மை உரையில் ‘குளவி’
  alternative: அச்சம் / பீதி
  rationale: சொல்லின் முதன்மையான அகராதிப் பொருள் பூச்சி என்பதால் அது உரையில் வைக்கப்படுகிறது; கடவுள் அனுப்பும் பீதியைக் குறிக்கும் உருவக வாசிப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன தரநிலைத் தமிழில், ஒருமை முகவரியான ‘உன்’ என்பதைக் காத்து, மரியாதைமிக்க ஆனால் பொதுவாசகர்களுக்குப் புரியும் நடையில் வடிவமைக்கப்பட்டது. ‘உனக்குத் தப்பி’ என்பது מִפָּנֶיךָ என்பதன் சூழற்பொருளை முன்னிலைப் படுத்துகிறது; ‘குளவி’ குறித்த நேரடி/உருவக இருமை அடிக்குறிப்பில் காக்கப்பட்டுள்ளது.
