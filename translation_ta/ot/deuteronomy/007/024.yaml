base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/024.yaml
  text: And he will give their kings into your hand[a], and you shall make their name perish from under heaven. No man will stand before you until you have destroyed them.
translation:
  language: ta
  text: அவர்களுடைய அரசர்களை அவர் உன் கையில் ஒப்புக்கொடுப்பார்; அவர்களுடைய பெயரை வானத்தின் கீழிருந்து அழித்துப்போடுவாய். நீ அவர்களை அழித்தொழிக்கும்வரை, ஒருவனும்[a] உனக்கு எதிராக நிலைத்து நிற்கமாட்டான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, பொதுப்பொருளை வெளிப்படையாகக் காட்ட, “யாரும் உனக்கு எதிராக நிலைத்து நிற்கமாட்டார்கள்.” எபிரெயத்தில் “ஆண்/மனிதன்” (אִישׁ) என்ற சொல் ஒருமையில் பிரதிநிதித்துவப் பொருளில் வருகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַן
  choice: அவர் ... ஒப்புக்கொடுப்பார்
  rationale: முன்னுள்ள வாக்குறுதித் தொடரில் இது எதிர்காலச் செயலைக் குறிக்கிறது; எழுவாய் சூழலில் ஆண்டவரைக் குறிக்கிறது. ‘ஒப்புக்கொடுப்பார்’ என்பது ஒருவரை மற்றொருவரின் அதிகாரத்திற்குள் தரும் பொருளை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: מַלְכֵיהֶם
  choice: அவர்களுடைய அரசர்களை
  rationale: பன்மைச் சொல்லுடன் மூன்றாம் நபர் பன்மை உடைமை விகுதி நேரடியாக ‘அவர்களுடைய அரசர்கள்’ என்று பொருள்படுகிறது.
- source_word: בְּיָדֶךָ
  choice: உன் கையில்
  rationale: இது ‘உன் அதிகாரத்திற்குள்’ என்னும் பொருளுடைய எபிரெய உருவகச் சொற்றொடர்; ‘உன் கையில்’ என்பது அந்த உருவகத்தைத் தமிழில் இயல்பாகக் காக்கிறது.
- source_word: וְהַאֲבַדְתָּ אֶת שְׁמָם
  choice: அவர்களுடைய பெயரை ... அழித்துப்போடுவாய்
  rationale: אבד என்பதன் Hiphil வடிவம் காரணவினைப் பொருளைக் கொண்டது; ‘பெயர்’ என்பதே செயப்படுபொருள். எனவே அவர்களுடைய நினைவு அல்லது அடையாளம் இல்லாமல் போவதைக் குறிக்கும் வகையில் மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: מִתַּחַת הַשָּׁמָיִם
  choice: வானத்தின் கீழிருந்து
  rationale: உலகில் மனித வாழ்வின் பரப்பிலிருந்து முழுமையாக நீக்கப்படுவதைச் சுட்டும் எபிரெய மரபுத்தொடரின் உருவகம் காக்கப்பட்டுள்ளது.
- source_word: לֹא יִתְיַצֵּב אִישׁ
  choice: ஒருவனும் ... நிலைத்து நிற்கமாட்டான்
  rationale: יצב என்பதன் reflexive வடிவம் எதிர்த்து நிற்பதை அல்லது தன் நிலையைத் தக்கவைத்து நிற்பதைச் சுட்டுகிறது. אִישׁ ஆண்பால் ஒருமையில் இருந்தாலும் இங்கு பிரதிநிதித்துவப் பொதுப்பொருளில் வருகிறது.
- source_word: בְּפָנֶיךָ
  choice: உனக்கு எதிராக
  rationale: போர்ச் சூழலில் இந்தச் சொற்றொடர் வெறும் முன்னிலையில் இருப்பதை அல்ல, எதிர்த்து நிற்பதைச் சுட்டுகிறது; ‘உனக்கு எதிராக’ தமிழில் சூழற்பொருளைத் தெளிவாக வழங்குகிறது.
- source_word: עַד הִשְׁמִדְךָ אֹתָם
  choice: நீ அவர்களை அழித்தொழிக்கும்வரை
  rationale: עַד உடன் வரும் infinitive construct முடிவுப்புள்ளியைச் சுட்டுகிறது. שׁמד உபாகமப் போர்ச் சூழலில் முழுமையான அழிவைக் குறிக்கும் வலுவான சொல்; ‘அழித்தொழி’ அந்த வலிமையை வெளிப்படுத்துகிறது.
theological_decisions:
- issue: אִישׁ என்ற ஆண்பால் ஒருமையின் பிரதிநிதித்துவப் பொதுப்பொருள்
  choice: ஒருவனும் உனக்கு எதிராக நிலைத்து நிற்கமாட்டான்
  alternative: யாரும் உனக்கு எதிராக நிலைத்து நிற்கமாட்டார்கள்
  rationale: மூலத்தின் ஆண்பால் ஒருமை வடிவத்தை ‘ஒருவனும்’ காக்கிறது; அதே நேரத்தில் அது ஒரே குறிப்பிட்ட ஆணை அல்ல, எதிர்க்கக்கூடிய எவரையும் பொதுவாகக் குறிக்கிறது என்பதை அடிக்குறிப்பு விளக்குகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் மரியாதையும் தெளிவும் காக்கப்பட்டுள்ளன. ‘உன் கையில்’ மற்றும் ‘வானத்தின் கீழிருந்து’ ஆகிய எபிரெய உருவகங்கள் இயல்பாகத் தக்கவைக்கப்பட்டுள்ளன; போர்ச் சூழலின் வலிமையை ‘எதிராக நிலைத்து நிற்க’ மற்றும் ‘அழித்தொழிக்க’ என்பவை வெளிப்படுத்துகின்றன.
