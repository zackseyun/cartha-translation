revisions:
- from: ஏனெனில், நீ உன் இறைவனாகிய யாவேவுக்குப் பரிசுத்தமான மக்கள். பூமியின் முகமெங்கும் உள்ள எல்லா மக்களினங்களிலிருந்தும் உன்னைத் தமக்கே உரிய அருமையான மக்களாக[a] இருக்கும்படி உன் இறைவனாகிய யாவே தேர்ந்தெடுத்திருக்கிறார்.
  to: ஏனெனில், நீ உன் இறைவனாகிய யாவேவுக்குப் பரிசுத்தமான ஒரு மக்களினம். பூமியின் மேற்பரப்பில் உள்ள எல்லா மக்களினங்களிலிருந்தும், தமக்கென மதிப்புமிக்க உடைமையான ஒரு மக்களினமாக இருக்கும்படி உன் இறைவனாகிய யாவே உன்னைத் தேர்ந்தெடுத்திருக்கிறார்.[a]
  rationale: 'The revision resolves the singular/plural mismatch, uses a more natural modern Tamil expression for the earth idiom, and more fully represents the dual sense of לְעַם סְגֻלָּה: Israel is a people and Yahweh''s specially valued possession. The footnote remains an alternative rendering and now accurately explains the Hebrew construction.'
  reviewer_model: gpt-5.6-terra
