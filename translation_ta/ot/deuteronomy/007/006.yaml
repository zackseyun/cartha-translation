source:
  edition: WLC
  text: כִּ֣י עַ֤ם קָדוֹשׁ֙ אַתָּ֔ה לַ/יהוָ֖ה אֱלֹהֶ֑י/ךָ בְּ/ךָ֞ בָּחַ֣ר יְהוָ֣ה אֱלֹהֶ֗י/ךָ לִ/הְי֥וֹת ל/וֹ֙ לְ/עַ֣ם סְגֻלָּ֔ה מִ/כֹּל֙ הָֽ/עַמִּ֔ים אֲשֶׁ֖ר עַל פְּנֵ֥י הָ/אֲדָמָֽה׀־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/006.yaml
  text: For you are a holy people to Yahweh your God. Yahweh your God has chosen you to be a treasured people for himself[a], from all the peoples who are on the face of the earth.
translation:
  language: ta
  text: ஏனெனில், நீ உன் இறைவனாகிய யாவேவுக்குப் பரிசுத்தமான ஒரு மக்களினம். பூமியின் மேற்பரப்பில் உள்ள எல்லா மக்களினங்களிலிருந்தும், தமக்கென மதிப்புமிக்க உடைமையான ஒரு மக்களினமாக இருக்கும்படி உன் இறைவனாகிய யாவே உன்னைத் தேர்ந்தெடுத்திருக்கிறார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தமக்கென மதிப்புமிக்க உடைமையாக.” எபிரெயத்தில், “மதிப்புமிக்க உடைமையின் மக்களினம்” என்ற சொற்றொடர் வருகிறது; இது ஒரு மக்களினம் என்பதையும், சிறப்பாக மதிக்கப்படும் உடைமை என்பதையும் இணைக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய கட்டளைக்கான காரணத்தை அறிமுகப்படுத்தும் இணைப்புச் சொல்லின் விளக்க வலிமையை இயல்பான தமிழில் காக்கிறது.
- source_word: עַם קָדוֹשׁ
  choice: பரிசுத்தமான மக்கள்
  rationale: கடவுளுக்கெனப் பிரித்துவைக்கப்பட்ட மக்களைக் குறிக்கும் உடன்படிக்கை மற்றும் இறையியல் நிறையைப் பாதுகாக்கிறது.
- source_word: לַיהוָה אֱלֹהֶיךָ
  choice: உன் இறைவனாகிய யாவேவுக்கு
  rationale: ל குறிக்கும் உறவு அல்லது உரிமை சார்ந்த பொருளைத் தமிழ் வேற்றுமையுருபின் மூலம் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய மூலத்தில் நேரடியாக வரும் உடன்படிக்கைப் பெயரைப் பெயராகவே ஒலிபெயர்க்கிறது.
- source_word: בְּךָ בָּחַר
  choice: உன்னைத் ... தேர்ந்தெடுத்திருக்கிறார்
  rationale: தெய்வீகத் தேர்வையும், அந்தத் தேர்வின் தொடரும் விளைவையும் தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: לִהְיוֹת לוֹ
  choice: தமக்கே உரிய ... இருக்கும்படி
  rationale: நோக்கத்தையும் கடவுளுக்குரிய உடைமை அல்லது தனிப்பட்ட உறவையும் வெளிப்படுத்துகிறது; மரியாதைப் பன்மை தமிழ் நடைக்கு ஏற்றது.
- source_word: לְעַם סְגֻלָּה
  choice: அருமையான மக்களாக
  rationale: עַם என்பதிலுள்ள ‘மக்கள்’ கருத்தையும், סְגֻלָּה என்பதிலுள்ள சிறப்பாக மதிக்கப்படும் உடைமை என்ற கருத்தையும் இணைக்கிறது.
- source_word: מִכֹּל הָעַמִּים
  choice: எல்லா மக்களினங்களிலிருந்தும்
  rationale: மற்ற மக்களினங்களின் நடுவிலிருந்து செய்யப்பட்ட தேர்வைக் குறிக்கிறது; அவர்களைவிட மேலானவர்கள் என்ற கூடுதல் கருத்தைச் சேர்க்கவில்லை.
- source_word: אֲשֶׁר עַל פְּנֵי הָאֲדָמָה
  choice: பூமியின் முகமெங்கும் உள்ள
  rationale: எபிரெய மொழியின் ‘நிலத்தின் முகத்தின்மேல்’ என்ற உருவகத்தைத் தக்கவைத்தபடி, உலகெங்கும் வாழும் மக்களைக் குறிக்கும் இயல்பான தமிழை வழங்குகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூலத்தில் உள்ள தனிப்பட்ட உடன்படிக்கைப் பெயரை பொதுப் பட்டமாக மாற்றாமல் பாதுகாக்கிறது.
- issue: מִכֹּל הָעַמִּים என்பதில் இஸ்ரவேலின் தேர்வுக்குரிய பொருள்
  choice: எல்லா மக்களினங்களிலிருந்தும்
  alternative: எல்லா மக்களினங்களுக்கும் மேலாக
  rationale: எபிரெய מן இங்கு ஒரு பெரிய தொகுதியிலிருந்து தேர்ந்தெடுப்பதை இயல்பாகக் குறிக்கிறது; இயல்பான மேன்மை என்ற இறையியல் முடிவை மொழிபெயர்ப்பில் சேர்க்கவில்லை.
- issue: סְגֻלָּה என்பதிலுள்ள மக்கள் மற்றும் பொக்கிஷ உடைமை ஆகிய இரு கருத்துகள்
  choice: அருமையான மக்களாக
  alternative: தமக்குரிய அருமையான உடைமையாக
  rationale: மூலத்தில் வெளிப்படையாக உள்ள עַם (‘மக்கள்’) என்பதைக் காக்கிறது; ‘சிறப்பாக மதிக்கப்படும் உடைமை’ என்ற நுணுக்கத்தை அடிக்குறிப்பில் தெளிவுபடுத்துகிறது.
translation_notes:
  register: நவீன செந்தமிழில் இயல்பாகவும் கண்ணியமாகவும் வடிவமைக்கப்பட்டது. ‘பரிசுத்தமான’ என்பது பரவலாக அறியப்படும் வேதாகமச் சொல்லாக இருப்பதால் தக்கவைக்கப்பட்டது. யாவேவைக் குறிக்கும் சுட்டுப்பெயர் மற்றும் வினைமுற்றில் மரியாதைப் பன்மை பயன்படுத்தப்பட்டுள்ளது; மக்களினத்தைக் குறிக்கும் ‘நீ’ மூலத்தின் ஒருமை வடிவத்தைப் பாதுகாக்கிறது.
