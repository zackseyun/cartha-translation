base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/009.yaml
  text: Know[a], therefore, that Yahweh your God, he is God, the faithful God, keeping the covenant and the steadfast love for those who love him and for those who keep his commandments[d][c][b], to a thousand generations.
translation:
  language: ta
  text: ஆகையால், உன் கடவுளாகிய யாவே, அவரே கடவுள் என்பதை அறிந்துகொள்.[a] அவர் உண்மையுள்ள கடவுள்; தம்மை நேசித்து, தமது கட்டளைகளைக் கைக்கொள்கிறவர்களுக்காக ஆயிரம் தலைமுறைகள்வரை உடன்படிக்கையையும் மாறாத அன்பையும்[b] காத்துவருகிறார்.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அறிந்துகொள்” என்பதற்கு “மேலும் அறிந்துகொள்” அல்லது “எனவே அறிந்துகொள்” என்றும் பொருள் கொள்ளலாம்; எபிரெய இணைப்புச்சொல் முந்தைய கருத்தின் தொடர்ச்சியையோ அதிலிருந்து வரும் முடிவையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயில் חֶסֶד (ஹெசெத்); இதற்கு “உறுதியான அன்பு,” “உடன்படிக்கைப் பற்றுறுதி,” அல்லது “இரக்கம்” என்ற நுணுக்கங்களும் உண்டு.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, “ஆயிரம் தலைமுறைகளுக்கு.” இந்தத் தொடர் உடன்படிக்கையில் நிலைத்திருக்கும் உண்மையை அளவிட முடியாத நீண்ட காலத்துக்கு வலியுறுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָדַעְתָּ
  choice: ஆகையால் ... அறிந்துகொள்
  rationale: முன்னுள்ள கருத்திலிருந்து வரும் முடிவை וְ உணர்த்துகிறது; Qal perfect 2ms இச்சூழலில் அறிவுறுத்தும் வலிமை கொண்டிருப்பதால் இயல்பான தமிழ் ஏவல் வடிவம் பயன்படுத்தப்பட்டது.
- source_word: יְהוָה
  choice: யாவே
  rationale: உடன்படிக்கைக்குரிய தனிப்பெயரை பொதுப்பட்டமாக மாற்றாமல் ஒலிபெயர்க்கிறது.
- source_word: אֱלֹהֶיךָ הוּא הָאֱלֹהִים
  choice: உன் கடவுளாகிய யாவேதான் கடவுள்
  rationale: הוּא தரும் வலியுறுத்தலையும், predicative הָאֱלֹהִים கூறும் தனித்துவமான அறிக்கையையும் இயல்பான தமிழில் காக்கிறது.
- source_word: הָאֵל הַנֶּאֱמָן
  choice: அவர் நம்பிக்கைக்குரிய கடவுள்
  rationale: נֶאֱמָן என்பதன் உறுதி, நம்பகத்தன்மை, உடன்படிக்கை விசுவாசம் ஆகிய நுணுக்கங்களை ‘நம்பிக்கைக்குரிய’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: שֹׁמֵר הַבְּרִית
  choice: உடன்படிக்கையைக் ... காத்துவருகிறவர்
  rationale: பங்கேற்புவினை காட்டும் தொடர்ச்சியான செயலை ‘காத்துவருகிறவர்’ வெளிப்படுத்துகிறது; உடன்படிக்கையை நிலைநிறுத்தும் பொருளும் காக்கப்படுகிறது.
- source_word: וְהַחֶסֶד
  choice: மாறாத அன்பையும்
  rationale: חֶסֶד குறிக்கும் அன்பு, உறுதியான பற்றுறுதி, இரக்கம் ஆகியவற்றில் உடன்படிக்கைச் சூழலுக்குரிய நிலைத்த அன்பைச் சுருக்கமாக வெளிப்படுத்துகிறது.
- source_word: לְאֹהֲבָיו וּלְשֹׁמְרֵי מִצְוֹתָו
  choice: தம்மை நேசித்து, தமது கட்டளைகளைக் கடைப்பிடிப்பவர்களுக்கு
  rationale: இரண்டு இணையான பங்கேற்புச் சொற்றொடர்களையும் ஒரே மக்களைக் குறிக்கும் இயல்பான தமிழ் தொடராக அமைத்து, நேசமும் கீழ்ப்படிதலும் இணைந்திருப்பதைப் பேணுகிறது.
- source_word: לְאֶלֶף דּוֹר
  choice: ஆயிரம் தலைமுறைகள்வரை
  rationale: לְ இங்கு கால எல்லையைக் குறிக்கிறது; அளவற்ற நீடித்த உடன்படிக்கை உண்மையைச் சுட்டும் எபிரெய உருவக எண்ணை அப்படியே காக்கிறது.
theological_decisions:
- issue: மனிதரின் அன்பும் கீழ்ப்படிதலும் தொடர்பாகக் கடவுளின் உடன்படிக்கை உண்மை
  choice: கடவுள் தம்மை நேசித்துத் தமது கட்டளைகளைக் கடைப்பிடிப்பவர்களுக்கு உடன்படிக்கையையும் மாறாத அன்பையும் காத்துவருகிறார்
  alternative: கடவுள் தம்மை நேசிப்பவர்களுக்கு இரக்கம் காட்டுகிறார்
  rationale: மூலவசனம் בְּרִית மற்றும் חֶסֶד இரண்டையும் இணைத்து, அதன் பயனாளிகளை நேசித்து கட்டளைகளைக் காப்பவர்கள் எனக் கூறுகிறது. அந்த உடன்படிக்கை சார்ந்த நிபந்தனைத் தன்மையைத் தளர்த்தாமலும் பின்னாளைய இறையியல் அமைப்புகளைச் சேர்க்காமலும் மொழிபெயர்க்கப்பட்டது.
- issue: ‘ஆயிரம் தலைமுறைகள்’ என்பதன் தொடர்பு
  choice: உடன்படிக்கையையும் மாறாத அன்பையும் காத்துவரும் காலநீட்சியுடன் இணைக்கப்பட்டது
  alternative: தம்மை நேசித்துக் கட்டளைகளைக் காப்போரின் ‘ஆயிரம் தலைமுறைகளுக்கு’ என நேரடியாக இணைத்தல்
  rationale: எபிரெய தொடரமைப்பு இரு தொடர்புகளுக்கும் இடமளிக்கலாம். தமிழ் முதன்மை உரை நீடித்த காலத்தைச் செயலுடன் இணைக்கிறது; மாற்று தொடரமைப்பு அடிக்குறிப்பில் பதிவு செய்யப்படுகிறது.
