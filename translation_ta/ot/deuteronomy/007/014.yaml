source:
  edition: WLC
  text: בָּר֥וּךְ תִּֽהְיֶ֖ה מִ/כָּל הָ/עַמִּ֑ים לֹא יִהְיֶ֥ה בְ/ךָ֛ עָקָ֥ר וַֽ/עֲקָרָ֖ה וּ/בִ/בְהֶמְתֶּֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/014.yaml
  text: You will be blessed above all peoples[a]; there will not be among you a barren man or woman[b], or among your livestock.
translation:
  language: ta
  text: எல்லா மக்களையும்விட நீ ஆசீர்வதிக்கப்பட்டிருப்பாய்[a]. உன்னிடையே பிள்ளைப்பேறற்ற ஆணோ பெண்ணோ இருக்கமாட்டார்கள்[b]; உன் கால்நடைகளிலும் மலடானவை இருக்காது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எல்லா மக்களுக்கும் மேலாக.” இங்குள்ள எபிரெய முன்னிடைச்சொல் ஒப்பீட்டைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: 'எபிரெயம் ஆண்பால், பெண்பால் ஆகிய இரு வடிவங்களையும் வெளிப்படையாகப் பயன்படுத்துகிறது: “பிள்ளைப்பேறற்ற ஆணோ பெண்ணோ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּרוּךְ תִּהְיֶה
  choice: நீ ஆசீர்வதிக்கப்பட்டிருப்பாய்
  rationale: ברך என்பதன் செயல்பாட்டு பெயரடை நிலையையும் היה வினையின் எதிர்கால உடன்படிக்கைச் சாயலையும் இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: מִכָּל הָעַמִּים
  choice: எல்லா மக்களையும்விட
  rationale: מן இங்கு ஒப்பீட்டுப் பொருளைத் தருகிறது. ‘மக்களையும்விட’ என்பது அந்த ஒப்பீட்டைத் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: לֹא יִהְיֶה בְךָ
  choice: உன்னிடையே ... இருக்கமாட்டார்கள்
  rationale: היה + בְּ அமைப்பு சமூகத்தின் மத்தியில் இல்லாமையைச் சுட்டுகிறது; ஒருமை ‘நீ’ இஸ்ரவேலைக் கூட்டாகக் குறிக்கிறது.
- source_word: עָקָר וַעֲקָרָה
  choice: பிள்ளைப்பேறற்ற ஆணோ பெண்ணோ
  rationale: எபிரெயத்தில் உள்ள ஆண்பால், பெண்பால் வடிவங்கள் இரண்டையும் வெளிப்படையாகப் பேணுகிறது; ‘பிள்ளைப்பேறற்ற’ என்பது அளவுக்கு மீறிய மருத்துவ மொழியின்றி கருத்தைத் தெரிவிக்கிறது.
- source_word: וּבִבְהֶמְתֶּךָ
  choice: உன் கால்நடைகளிலும்
  rationale: בְּהֵמָה வளர்ப்பு விலங்குகளைத் தொகுப்பாகக் குறிக்கிறது; ‘கால்நடைகள்’ என்பது நவீனத் தமிழில் இயல்பான விரிவான சொல்.
theological_decisions:
- issue: உடன்படிக்கை ஆசீர்வாதத்தின் ஒப்பீட்டு அளவு
  choice: எல்லா மக்களையும்விட
  alternative: எல்லா மக்களுக்கும் மேலாக
  rationale: מן என்பதன் ஒப்பீட்டுப் பொருளைத் தீர்மானமாகக் காட்டினாலும், ‘மேலாக’ என்ற தரநிலை/அந்தஸ்துச் சாயலைக் கட்டாயப்படுத்தாமல் அளவின் ஒப்பீட்டை பேணுகிறது.
- issue: மலட்டுத்தன்மைக்கான ஆண்பால் மற்றும் பெண்பால் வடிவங்கள்
  choice: பிள்ளைப்பேறற்ற ஆணோ பெண்ணோ
  alternative: பிள்ளைப்பேறற்றவர் எவரும்
  rationale: மூலத்தில் வேண்டுமென்றே இடம்பெறும் ஆண்பால் மற்றும் பெண்பால் இணையை பொதுப்படுத்தாமல் காக்கிறது.
- issue: இஸ்ரவேலை நோக்கிய கூட்டுப் பொருளுடைய ஒருமை அழைப்பு
  choice: நீ / உன்
  alternative: நீங்கள் / உங்கள்
  rationale: எபிரெயத்தின் இரண்டாம் நபர் ஆண்பால் ஒருமை வடிவத்தைப் பேணி, இஸ்ரவேலை ஒரே உடன்படிக்கை மக்களாக நோக்கும் வடிவத்தைத் தக்கவைக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; dignified but accessible covenant language. ஒருமை முன்னிலைகள் மூலத்தின் கூட்டுப் பொருளுடைய ஒருமையைப் பேணுகின்றன. கடைசி கூறில் தமிழுக்குத் தேவையான ‘அப்படி இருக்காது’ சேர்க்கப்பட்டு, மனிதர்களைப் பற்றிய மலட்டுத்தன்மை கால்நடைகளுக்கும் பொருந்துவதை இயல்பாகத் தெரிவிக்கிறது.
