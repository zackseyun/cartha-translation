  text: כִּֽי יָסִ֤יר אֶת בִּנְ/ךָ֙ מֵֽ/אַחֲרַ֔/י וְ/עָבְד֖וּ אֱלֹהִ֣ים אֲחֵרִ֑ים וְ/חָרָ֤ה אַף יְהוָה֙ בָּ/כֶ֔ם וְ/הִשְׁמִידְ/ךָ֖ מַהֵֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/004.yaml
  text: For he will turn your son away from following me[a], and they will serve other gods; then the anger of Yahweh will burn against you[c][b], and he will quickly destroy you.
translation:
  language: ta
  text: ஏனெனில், அவன் உன் மகனை என்னைப் பின்பற்றுவதிலிருந்து விலகச் செய்வான்[a]; அவர்கள் வேறு தெய்வங்களை வழிபடுவார்கள்[b]. அப்பொழுது யாவேயின் கோபம் உங்களுக்கு எதிராகப் பற்றியெரியும்[c]; அவர் உன்னை விரைவில் அழித்துவிடுவார்[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொல்லுக்கு சொல், “எனக்குப் பின்னாலிருந்து”; இது “என்னைப் பின்பற்றுவதிலிருந்து” என்று பொருள்படும் மரபுத்தொடர்.
    reason: lexical_alternative
  - marker: b
    text: “அவன் வேறு தெய்வங்களை வழிபடுவான்” என்றும் வாசிக்கப்படலாம். எபிரெயம் “உன் மகன்” என்ற ஒருமையிலிருந்து “அவர்கள் வழிபடுவார்கள்” என்ற பன்மைக்கு மாறுகிறது; எச்சரிக்கை குடும்பத்தையோ பரந்த சமூகத்தையோ உள்ளடக்குவதாக இது இருக்கலாம்.
    reason: alternative_reading
  - marker: c
    text: “யாவே” என்பது எபிரெய இறைப்பெயரான YHWH-ன் ஒலிபெயர்ப்பு; இது மரபாக “கர்த்தர்” என்று மொழிபெயர்க்கப்படுகிறது.
    reason: alternative_reading
  - marker: d
    text: எபிரெயத்தில் “உங்களுக்கு எதிராக” என்பது பன்மை; “உன்னை அழித்துவிடுவார்” என்பது ஒருமை. இந்த எண்ணிக்கை மாற்றம் மூலத்தில் உள்ளபடியே காக்கப்பட்டுள்ளது.
    reason: source_ambiguity
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய வசனத்திலுள்ள தடைக்கான காரணத்தை அறிமுகப்படுத்துகிறது; எபிரெயச் சொற்றொடரின் விளக்கத் தொடர்பை இயல்பான தமிழில் காக்கிறது.
- source_word: יָסִיר
  choice: விலகச் செய்வான்
  rationale: סור என்பதன் ஹிஃபில் வடிவம் காரணவினைப் பொருளுடையது; ஒருவர் மகனை யாவேயைப் பின்பற்றுவதிலிருந்து விலகச் செய்வதைத் தெளிவாகக் காட்டுகிறது.
- source_word: בִּנְךָ
  choice: உன் மகனை
  rationale: எபிரெயத்தில் ஆண்பால் ஒருமை உள்ளது; முந்தைய வசனத்தில் குறிப்பிடப்பட்ட மகனைப் பற்றிய குறிப்புடன் பொருந்துவதால் அதைப் பொதுமைப்படுத்தாமல் காக்கிறது.
- source_word: מֵאַחֲרַי
  choice: என்னைப் பின்பற்றுவதிலிருந்து
  rationale: சொல்லுக்கு சொல் ‘எனக்குப் பின்னாலிருந்து’ என்றாலும், இது ஒருவரைப் பின்பற்றுவதை நிறுத்துதல் என்ற எபிரெய மரபுத்தொடர்; இயல்பான தமிழில் அதன் உடன்படிக்கைச் சார்ந்த விசுவாசப் பொருளைத் தருகிறது.
- source_word: וְעָבְדוּ
  choice: அவர்கள் ... வழிபடுவார்கள்
  rationale: வினைச்சொல் பன்மையில் உள்ளது. தமிழில் ‘தெய்வங்களை வழிபடுதல்’ என்பது இயல்பாகவும் தெளிவாகவும் இருப்பதோடு, எபிரெய எண்ணின் மாற்றத்தையும் காக்கிறது.
- source_word: אֱלֹהִים אֲחֵרִים
  choice: வேறு தெய்வங்களை
  rationale: யாவேக்கு மட்டுமே உரிய பற்றுறுதிக்கு எதிரான பிற தெய்வங்களைக் குறிக்கும் நேரடியான, வழக்கமான தமிழ் மொழிபெயர்ப்பு.
- source_word: וְחָרָה אַף יְהוָה
  choice: யாவேயின் கோபம் ... பற்றியெரியும்
  rationale: கோபம் எரிவதாகக் கூறும் எபிரெய உருவகத்தை வலிமையான, இயல்பான தமிழில் காக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தலைப்புப் பெயரால் மாற்றாமல், இஸ்ரவேலின் தேவனுடைய தனிப்பெயரான YHWH-ஐ தமிழில் ஒலிபெயர்க்கிறது.
- source_word: בָּכֶם
  choice: உங்களுக்கு எதிராக
  rationale: חרה אף என்பதுடன் வரும் முன்னிடைச்சொல் கோபம் செலுத்தப்படும் இலக்கைக் குறிக்கிறது; இங்குள்ள பன்மையையும் காக்கிறது.
- source_word: וְהִשְׁמִידְךָ
  choice: அவர் உன்னை ... அழித்துவிடுவார்
  rationale: שׁמד என்பதன் ஹிஃபில் வடிவம் முழுமையான அழிவைக் குறிக்கிறது. ‘அழித்துவிடுவார்’ அதன் கடுமையையும் இங்குள்ள ஒருமையையும் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: מַהֵר
  choice: விரைவில்
  rationale: நியாயத்தீர்ப்பு தாமதமின்றி வருவதைக் குறிக்கும் வினையடைப் பொருளை இயல்பான தமிழில் தருகிறது.
theological_decisions:
- issue: எச்சரிக்கைக் கூற்றிலுள்ள ஒருமை–பன்மை மாற்றம்
  choice: ‘உன் மகன்’ என்ற ஒருமையையும் ‘அவர்கள் வழிபடுவார்கள்’ என்ற பன்மையையும் அப்படியே காத்தல்
  alternative: ‘அவன் வேறு தெய்வங்களை வழிபடுவான்’ என்று முழுவதையும் ஒருமையாக்குதல்
  rationale: மசோரா எபிரெய உரை ஒருமையிலிருந்து பன்மைக்கு மாறுகிறது. இது ஒரு மகனிலிருந்து குடும்பம் அல்லது சமூகத்துக்குப் பரவும் விளைவைக் குறிக்கக்கூடும்; ஆனால் அதைக் கட்டாயமாகத் தீர்மானிக்காமல் இலக்கணத் தளர்வை மொழிபெயர்ப்பு காக்கிறது.
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் உள்ள தனிப்பெயரை வெளிப்படையாக ஒலிபெயர்க்கிறது; மரபுவழி தலைப்புப் பெயரான ‘கர்த்தர்’ என்பதையும் அடிக்குறிப்பு தெரிவிக்கிறது.
- issue: ‘உங்களுக்கு’ என்ற பன்மையிலிருந்து ‘உன்னை’ என்ற ஒருமைக்கு மாறுதல்
  choice: இரு எண்ணிக்கைகளையும் உரையில் காத்தல்
  alternative: இரண்டையும் ‘உங்களை’ என்று பன்மையாக்குதல்
  rationale: בָּכֶם பன்மையாகவும் וְהִשְׁמִידְךָ ஒருமையாகவும் உள்ளன. இது மக்களைக் கூட்டாகவும் ஒரே உடன்படிக்கைச் சமூகமாகவும் நோக்கும் சொல்லாக்கமாக இருக்கலாம்; தெளிவில்லாத இம்மாற்றத்தைச் சீராக்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில் தெளிவான, கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘பற்றியெரியும்’ என்ற சொல் எபிரெய உருவகத்தின் தீவிரத்தைக் காக்கிறது. ஒருமை–பன்மை மாற்றங்கள் இயல்பற்றதாகத் தோன்றினாலும், மூல உரையின் உண்மையான இலக்கணத் தளர்வை மறைக்காமல் அடிக்குறிப்புகளுடன் பாதுகாக்கப்பட்டுள்ளன.
