  text: וְ/לֹא תָבִ֤יא תֽוֹעֵבָה֙ אֶל בֵּיתֶ֔/ךָ וְ/הָיִ֥יתָ חֵ֖רֶם כָּמֹ֑/הוּ שַׁקֵּ֧ץ תְּשַׁקְּצֶ֛/נּוּ וְ/תַעֵ֥ב תְּֽתַעֲבֶ֖/נּוּ כִּי חֵ֥רֶם הֽוּא־־׀׀־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/026.yaml
  text: And you shall not bring an abomination into your house[a], or you will become devoted to destruction like it. You shall utterly detest it and utterly abhor it, for it is devoted to destruction.
translation:
  language: ta
  text: அருவருப்பான எந்தப் பொருளையும் உன் வீட்டுக்குள் கொண்டுவராதே; கொண்டுவந்தால், அதைப் போலவே நீயும் அழிவுக்கென்று ஒதுக்கப்பட்டவனாவாய்.[a] அதை முற்றிலும் அருவருத்து, முற்றிலும் வெறு; ஏனெனில், அது அழிவுக்கென்று ஒதுக்கப்பட்டது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அழிவுக்கென்று ஒதுக்கப்பட்டது” என்பதற்கு “தடைக்குள்ளானது” அல்லது மரபுவழியாக “சபிக்கப்பட்டது” என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல், தெய்வீகத் தீர்ப்பின்கீழ் அழிவுக்காக ஒதுக்கப்பட்ட ஒன்றைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: תָבִיא
  choice: கொண்டுவராதே
  rationale: בוא என்பதன் ஹிஃபில் வடிவம் ‘உள்ளே வரச் செய்தல்’ என்ற பொருளைத் தருகிறது. வீட்டுக்குள் ஒரு பொருளைக் கொண்டுவருவதைத் தமிழில் இயல்பாகவும் நேரடியாகவும் தெரிவிக்கிறது.
- source_word: תּוֹעֵבָה
  choice: அருவருப்பான பொருள்
  rationale: உபாகமச் சூழலில் இச்சொல், குறிப்பாக விக்கிரக வழிபாட்டுடன் தொடர்புடைய, சமயரீதியிலும் ஒழுக்கரீதியிலும் வெறுக்கத்தக்க பொருளைக் குறிக்கிறது. ‘அருவருப்பு’ மட்டும் என்பதைக் காட்டிலும் ‘அருவருப்பான பொருள்’ இங்கு குறிப்பிடப்படுவது ஒரு பொருள் என்பதைத் தெளிவாக்குகிறது.
- source_word: בֵּיתֶךָ
  choice: உன் வீட்டுக்குள்
  rationale: எபிரெயச் சொல் நேரடியாக ‘உன் வீடு’ எனப் பொருள்படும். אֶל என்ற முன்னிடைச்சொல்லுடன் சேர்ந்து வீட்டின் உள்ளே கொண்டுவருதல் என்ற concrete image-ஐ இயல்பான தமிழில் தருகிறது.
- source_word: וְהָיִיתָ חֵרֶם כָּמֹהוּ
  choice: கொண்டுவந்தால், அதைப் போலவே நீயும் அழிவுக்கென்று ஒதுக்கப்பட்டவனாவாய்
  rationale: வாவ் இங்கு விளைவைக் குறிக்கும் எச்சரிக்கையாகப் புரிந்துகொள்ளப்படுகிறது. חֵרֶם என்பது தெய்வீகத் தீர்ப்பின்கீழ் அழிக்கப்படுவதற்காக ஒதுக்கப்பட்ட நிலையைச் சுட்டுகிறது; மனிதரைச் சுட்டுவதால் ‘ஒதுக்கப்பட்டவனாவாய்’ எனப் பாலினத்துக்கு ஏற்ப அமைக்கப்பட்டுள்ளது.
- source_word: שַׁקֵּץ תְּשַׁקְּצֶנּוּ
  choice: அதை முற்றிலும் அருவருத்து
  rationale: முற்றுவினையெச்சம் மற்றும் finite verb ஆகியவற்றின் இணைவு கட்டளையை வலுப்படுத்துகிறது. ‘முற்றிலும்’ அந்த வலியுறுத்தலைத் தெரிவிக்கிறது; ‘அருவருத்து’ தூய்மையற்றதும் வெறுக்கத்தக்கதுமாகக் கருதும் பொருளைப் பாதுகாக்கிறது.
- source_word: וְתַעֵב תְּתַעֲבֶנּוּ
  choice: முற்றிலும் வெறுத்தொதுக்கு
  rationale: இரண்டாவது வலியுறுத்தப்பட்ட வினையை முதலாவதுடன் ஒன்றாக்காமல் தனியே வைத்திருக்கிறது. ‘வெறுத்தொதுக்கு’ உள்ளார்ந்த வெறுப்பையும் நடைமுறை நிராகரிப்பையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: כִּי חֵרֶם הוּא
  choice: ஏனெனில், அது அழிவுக்கென்று ஒதுக்கப்பட்டது
  rationale: காரண வாக்கியத்தின் தொடர்பைத் தெளிவாகக் காட்டுகிறது. முன்பு வந்த חֵרֶם என்பதுடன் சொல் தொடர்பைப் பேணுவதற்காக அதே ‘அழிவுக்கென்று ஒதுக்கப்பட்ட’ மொழி மீண்டும் பயன்படுத்தப்படுகிறது.
theological_decisions:
- issue: உடன்படிக்கைத் தீர்ப்பின் சூழலில் חֵרֶם என்பதன் மொழிபெயர்ப்பு
  choice: அழிவுக்கென்று ஒதுக்கப்பட்டது
  alternative: தடைக்குள்ளானது; சபிக்கப்பட்டது
  rationale: இச்சொல் வெறும் சாபத்தையோ சமூகத் தடையையோ மட்டும் குறிக்காமல், தெய்வீகத் தீர்ப்பின்கீழ் அழிக்கப்படுவதற்காக ஒதுக்கப்பட்ட நிலையைக் குறிக்கிறது. தேர்ந்தெடுக்கப்பட்ட மொழிபெயர்ப்பு அந்தத் தெய்வீகத் தீர்ப்பு சார்ந்த கருத்தைத் தெளிவாகவும் பிரிவுசார் விளக்கமின்றியும் காக்கிறது.
- issue: וְהָיִיתָ என்பதிலுள்ள வாவ் இணைப்பின் பொருள்
  choice: கொண்டுவந்தால் ... ஆவாய் என்ற விளைவு
  alternative: அப்படி ஆகாதபடி என்ற நோக்க/எச்சரிக்கை வடிவம்
  rationale: தடைசெய்யப்பட்ட பொருளை வீட்டுக்குள் கொண்டுவருவதன் விளைவை வாவ் தொடர்ச்சியாகக் கூறுகிறது. தமிழில் நிபந்தனை–விளைவு அமைப்பு இந்தத் தொடர்பை இயல்பாக வெளிப்படுத்துகிறது; எபிரெயத்தில் உள்ள எச்சரிக்கைத் தன்மையும் நீடிக்கிறது.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. ஒருமை இரண்டாம் நபர் கட்டளைப் பாங்கு பேணப்பட்டுள்ளது. எபிரெயத்தின் இரு வலியுறுத்தப்பட்ட வினைகளும் தனித்தனியாகத் தரப்பட்டுள்ளன; חֵרֶם என்ற முக்கியச் சொல் இரு இடங்களிலும் ஒரே கருத்துடன் மொழிபெயர்க்கப்பட்டுள்ளது.
