  naturalness: நடை நவீனத் தரத் தமிழில் தெளிவாகவும் கட்டளைத் தொனிக்கு ஏற்றதாகவும் உள்ளது. அரைப்புள்ளிகளால் இணைச் செயல்கள் பிரிக்கப்படுவது வாசிப்புக்கும் மூலத்தின் பட்டியல் அமைப்புக்கும் பொருத்தமானது.
  terminology: ‘வழிபாட்டுத் தூண்கள்’ மַצֵּבוֹת என்பதன் வழிபாட்டுச் சூழலைச் சரியாகத் தெரிவிக்கிறது; அடிக்குறிப்பு கல் தூண்கள்/நட்டுவைக்கப்பட்ட கற்கள் என்ற மாற்றுப்பொருளை வழங்குகிறது. ‘அசேரா கம்பங்கள்’ அֲשֵׁרִים என்பதைப் பொதுவான சிலைகளாகக் குறுக்காமல் உரிய வரலாற்று-சமயக் குறிப்புடன் தருகிறது. ‘செதுக்கப்பட்ட உருவங்கள்’ פְּסִילִים என்பதன் குறிப்பிட்ட சொல்லியல் பொருளைக் காக்கிறது.
