base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/005.yaml
  text: 'But this is what you shall do to them: you shall tear down their altars[a], shatter their pillars, cut down their Asherah poles[c][b], and burn their carved images with fire.'
translation:
  language: ta
  text: 'மாறாக, நீங்கள் அவர்களுக்கு இவ்வாறே செய்யுங்கள்: அவர்களுடைய பலிபீடங்களை இடித்துத் தள்ளுங்கள்; அவர்களுடைய வழிபாட்டுத் தூண்களை[a] நொறுக்குங்கள்; அவர்களுடைய அசேரா கம்பங்களை[b] வெட்டி வீழ்த்துங்கள்; அவர்களுடைய செதுக்கப்பட்ட உருவங்களை[c] நெருப்பில் எரித்துவிடுங்கள்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயச் சொல் வழிபாட்டுக்காக நட்டுவைக்கப்பட்ட கற்களையோ கல் தூண்களையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில் ‘அசேரீம்’; அசேரா என்ற பெண் தெய்வத்துடன் தொடர்புடைய, பெரும்பாலும் மரத்தாலான வழிபாட்டுப் பொருட்கள் எனக் கருதப்படுகின்றன.
    reason: cultural_note
  - marker: c
    text: அல்லது ‘செதுக்கப்பட்ட சிலைகள்.’ எபிரெயச் சொல் செதுக்கி உருவாக்கப்பட்ட வழிபாட்டு உருவங்களைக் குறிப்பாகக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם כֹּה תַעֲשׂוּ לָהֶם
  choice: மாறாக, நீங்கள் அவர்களுக்கு இவ்வாறே செய்யுங்கள்
  rationale: כִּי אִם முந்தைய தடைக்கு வலுவான எதிர்மறை மாற்றைக் குறிக்கிறது; כֹּה அடுத்து சொல்லப்படும் செயல்களைச் சுட்டுகிறது. கட்டளையின் நேரடியான வலிமையைப் பன்மை ஏவல் வடிவம் இயல்பான தமிழில் காக்கிறது.
- source_word: מִזְבְּחֹתֵיהֶם תִּתֹּצוּ
  choice: அவர்களுடைய பலிபீடங்களை இடித்துத் தள்ளுங்கள்
  rationale: נתץ என்பது கட்டமைப்பை இடித்தழிப்பதைக் குறிக்கிறது; ‘இடித்துத் தள்ளுங்கள்’ பலிபீடங்களுக்கு இயல்பாகவும் வலிமையாகவும் உள்ளது.
- source_word: מַצֵּבֹתָם תְּשַׁבֵּרוּ
  choice: அவர்களுடைய வழிபாட்டுத் தூண்களை நொறுக்குங்கள்
  rationale: מַצֵּבָה இங்கு வழிபாட்டில் பயன்படுத்தப்பட்ட நட்டுவைக்கப்பட்ட கல் அல்லது தூணைக் குறிக்கிறது; שׁבר என்பதன் தீவிரச் செயலை ‘நொறுக்குங்கள்’ வெளிப்படுத்துகிறது.
- source_word: אֲשֵׁירֵיהֶם תְּגַדֵּעוּן
  choice: அவர்களுடைய அசேரா கம்பங்களை வெட்டி வீழ்த்துங்கள்
  rationale: אֲשֵׁרִים என்பது அசேராவுடன் தொடர்புடைய, பெரும்பாலும் மரத்தாலான வழிபாட்டுப் பொருட்களைக் குறிக்கிறது. גדע அவற்றை வெட்டி வீழ்த்தும் செயலைக் குறிக்கிறது.
- source_word: פְסִילֵיהֶם תִּשְׂרְפוּן בָּאֵשׁ
  choice: அவர்களுடைய செதுக்கப்பட்ட உருவங்களை நெருப்பில் எரித்துவிடுங்கள்
  rationale: פֶּסֶל என்பதன் செதுக்கி உருவாக்கப்பட்ட பொருள் என்ற குறிப்பிட்ட பொருளை ‘செதுக்கப்பட்ட உருவங்கள்’ காக்கிறது; בָּאֵשׁ வெளிப்படையாக ‘நெருப்பில்’ என மொழிபெயர்க்கப்படுகிறது.
theological_decisions:
- issue: אֲשֵׁרִים என்பதைப் பொதுவான சிலைகள் என்று மொழிபெயர்ப்பதா, குறிப்பிட்ட அசேரா வழிபாட்டுப் பொருட்கள் என்று மொழிபெயர்ப்பதா
  choice: அசேரா கம்பங்கள்
  alternative: அசேராக்கள்; அசேரா உருவங்கள்
  rationale: வசனம் கானானிய வழிபாட்டுப் பொருட்களின் வெவ்வேறு வகைகளைத் தனித்தனியாகக் குறிப்பிடுகிறது. ‘அசேரா கம்பங்கள்’ வரலாற்று மற்றும் சமயச் சிறப்பைத் தக்கவைத்து, பொதுவான ‘சிலைகள்’ என்ற சொல்லால் வேறுபாட்டை அழிக்காமல் காக்கிறது.
- issue: வேற்று வழிபாட்டுத் தலங்களையும் பொருட்களையும் அழிக்கும்படி கொடுக்கப்பட்ட கட்டளையின் வலிமை
  choice: நேரடியான, வலிமையான பன்மை ஏவல் வினைகள்
  alternative: அவற்றை அகற்றிவிடுங்கள் போன்ற மென்மையான பொதுப்படுத்தல்
  rationale: எபிரெய மூலத்தில் செயல்கள் திட்டவட்டமாகவும் வலிமையாகவும் கட்டளையிடப்படுகின்றன. மொழிபெயர்ப்பு அவற்றை மென்மைப்படுத்தாமலும், வசனத்தில் இல்லாத தத்துவ விளக்கத்தைச் சேர்க்காமலும் வழங்குகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கட்டளைநடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் நான்கு இணை அழிப்பு ஆணைகளும் அரைப்புள்ளிகளால் தெளிவாகப் பிரிக்கப்பட்டு, அவற்றின் வலிமையும் ஓசைநயமும் காக்கப்பட்டுள்ளன.
