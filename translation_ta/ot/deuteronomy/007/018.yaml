  text: לֹ֥א תִירָ֖א מֵ/הֶ֑ם זָכֹ֣ר תִּזְכֹּ֗ר אֵ֤ת אֲשֶׁר עָשָׂה֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ לְ/פַרְעֹ֖ה וּ/לְ/כָל מִצְרָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/018.yaml
  text: You shall not fear them[a]; you shall surely remember what Yahweh your God did to Pharaoh and to all Egypt.
translation:
  language: ta
  text: அவர்களுக்குப் பயப்படாதே. உன் கடவுளாகிய யாவே பார்வோனுக்கும் எகிப்து முழுவதற்கும் என்ன செய்தார் என்பதை நிச்சயமாக நினைவுகொள்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “நினை, நீ நினைவுகூருவாய்” என்று வினை இருமுறை அமைந்து வலியுறுத்தப்படுகிறது; இதன் பொருள் “நிச்சயமாக நினைவுகொள்” அல்லது “நன்றாக நினைவில் வைத்துக்கொள்” என்பதாகும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא תִירָא מֵהֶם
  choice: அவர்களுக்கு நீ பயப்படாதே
  rationale: לֹא உடன் வரும் இரண்டாம் நபர் ஒருமை வினை இச்சூழலில் தடைக் கட்டளையாக உள்ளது. ירא உடன் வரும் מִן பயத்தின் பொருளைக் குறிக்கிறது; எனவே இயல்பான தமிழில் ‘அவர்களுக்குப் பயப்படாதே’ என வழங்கப்பட்டுள்ளது.
- source_word: זָכֹר תִּזְכֹּר
  choice: நீ நிச்சயமாக நினைவுகொள்
  rationale: வினையெச்ச முழுவடிவமும் முற்றாத வினையும் இணையும் எபிரெய வலியுறுத்தல் அமைப்பை ‘நிச்சயமாக’ என்பதன் மூலம் வெளிப்படுத்துகிறது; நினைவுகூர்வதற்கான கட்டளைத் தன்மையும் காக்கப்படுகிறது.
- source_word: אֵת אֲשֶׁר עָשָׂה
  choice: செய்ததை
  rationale: இது முடிவுற்ற வரலாற்றுச் செயலைக் குறிக்கிறது; தமிழில் தொடர்புவினை வடிவமான ‘செய்ததை’ இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இது இறைவனின் தனிப்பெயரான நான்கெழுத்துப் பெயர்; ஒரு பட்டப்பெயரால் மாற்றாமல், Yahweh என்பதற்கான தமிழ் ஒலிபெயர்ப்பாக ‘யாவே’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: אֱלֹהֶיךָ
  choice: உன் கடவுளாகிய
  rationale: பின்னொட்டு இரண்டாம் நபர் ஆண்பால் ஒருமையாக இருப்பதால் ‘உன்’ என்று வழங்கப்பட்டுள்ளது; இஸ்ரவேலை ஒருமையில் நேரடியாக அழைக்கும் மூல அமைப்பு காக்கப்படுகிறது.
- source_word: לְפַרְעֹה
  choice: பார்வோனுக்கும்
  rationale: עשה உடன் לְ செயல் யார்மீது நிகழ்ந்தது என்பதைக் குறிக்கிறது. அடுத்த இணைத் தொடருடன் இயல்பாக அமைய ‘பார்வோனுக்கும்’ என வழங்கப்பட்டுள்ளது.
- source_word: וּלְכָל מִצְרָיִם
  choice: எகிப்து முழுவதற்கும்
  rationale: மூலம் எகிப்திய மக்களை மட்டும் அல்லாமல் எகிப்தை ஒட்டுமொத்தமாகக் குறிப்பிடுகிறது; ‘எகிப்து முழுவதற்கும்’ அந்தக் கூட்டுப்பொருளையும் செயலின் பரப்பையும் காக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைபெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலத்தில் தனிப்பெயரான יהוה நேரடியாக உள்ளது. அதை ஒரு பட்டப்பெயராக மாற்றாமல், Yahweh என்ற வாசிப்பைத் தமிழ் ஒலிப்புக்கு ஏற்ப ‘யாவே’ என வழங்குவது உடன்படிக்கைப் பெயரைக் காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், ஒருமை நேரடி அழைப்பையும் கட்டளைத் தொனியையும் காக்கும் வகையில் எழுதப்பட்டுள்ளது. ‘பயப்படாதே’ மற்றும் ‘நினைவுகொள்’ என்பவை எளிதில் புரியும், ஆனால் கண்ணியமான நடையில் உள்ளன. அடிக்குறி குறியீடு அது விளக்கும் வலியுறுத்தப்பட்ட நினைவுகூரல் தொடருக்குப் பின்னர் வைக்கப்பட்டுள்ளது.
