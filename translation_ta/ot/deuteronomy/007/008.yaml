  text: כִּי֩ מֵֽ/אַהֲבַ֨ת יְהוָ֜ה אֶתְ/כֶ֗ם וּ/מִ/שָּׁמְר֤/וּ אֶת הַ/שְּׁבֻעָה֙ אֲשֶׁ֤ר נִשְׁבַּע֙ לַ/אֲבֹ֣תֵי/כֶ֔ם הוֹצִ֧יא יְהוָ֛ה אֶתְ/כֶ֖ם בְּ/יָ֣ד חֲזָקָ֑ה וַֽ/יִּפְדְּ/ךָ֙ מִ/בֵּ֣ית עֲבָדִ֔ים מִ/יַּ֖ד פַּרְעֹ֥ה מֶֽלֶךְ מִצְרָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/008.yaml
  text: but because Yahweh loves you and because he is keeping the oath that he swore to your fathers[a], Yahweh brought you out with a mighty hand and redeemed you from the house of servants[b], from the hand of Pharaoh king of Egypt.
translation:
  language: ta
  text: ஆனால் யாவே உங்களை நேசிப்பதாலும், உங்கள் தந்தையருக்கு அவர் செய்த சத்தியத்தைக் காத்துக்கொள்வதாலும், யாவே உங்களை வல்லமையான கரத்தால் வெளியே கொண்டுவந்து, அடிமைகளின் வீட்டிலிருந்து—எகிப்தின் அரசனாகிய பார்வோனின் கையிலிருந்து—உங்களை மீட்டார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: ஆனால் ... தாலும்
  rationale: முந்தைய வசனத்தின் மறுப்புடன் உள்ள எதிர்மறைத் தொடர்பையும், இவ்வசனத்தின் காரண விளக்கத்தையும் ஒன்றாக வெளிப்படுத்துகிறது.
- source_word: מֵאַהֲבַת יְהוָה אֶתְכֶם
  choice: யாவே உங்களை நேசிப்பதாலும்
  rationale: காரணத்தைக் குறிக்கும் எபிரெயக் கட்டமைப்பை இயல்பான தமிழ் வினைச்சொல் வடிவில் தருகிறது; தெய்வீகப் பெயரைப் பெயராகவே காக்கிறது.
- source_word: וּמִשָּׁמְרוֹ אֶת הַשְּׁבֻעָה
  choice: அவர் ஆணையிட்ட ஆணையை நிறைவேற்றுவதாலும்
  rationale: שׁמר என்பதன் ‘கடைப்பிடித்தல்/நிறைவேற்றுதல்’ என்ற உடன்படிக்கைச் சார்ந்த செயற்பொருளையும், שְׁבֻעָה என்பதன் சத்திய ஆணைத் தன்மையையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: אֲשֶׁר נִשְׁבַּע לַאֲבֹתֵיכֶם
  choice: உங்கள் தந்தையருக்கு அவர் ஆணையிட்ட
  rationale: மூதாதையராகிய பிதாக்களைச் சுட்டும் ஆண்பால் வரலாற்றுத் தனித்தன்மையைத் தக்கவைக்கிறது.
- source_word: בְּיָד חֲזָקָה
  choice: வலிமைமிக்க கரத்தால்
  rationale: ‘வலிமையான கரம்’ என்ற எபிரெய உருவகத்தையும் வல்லமையான விடுதலை என்ற பொருளையும் காக்கிறது.
- source_word: וַיִּפְדְּךָ
  choice: உங்களை மீட்டார்
  rationale: அடிமைத்தனத்திலிருந்து விலை கொடுத்து விடுவித்தல்/மீட்டல் என்ற פדה சொல்லின் கனத்தைத் தக்கவைக்கிறது.
- source_word: מִבֵּית עֲבָדִים
  choice: அடிமைகளின் வீட்டிலிருந்து
  rationale: ‘அடிமைகளின் வீடு’ என்ற மூலத்தின் திடமான உருவகத்தைச் சீராக்காமல் காக்கிறது.
- source_word: מִיַּד פַּרְעֹה
  choice: பார்வோனின் கையிலிருந்து
  rationale: அதிகாரம் அல்லது பிடியைக் குறிக்கும் ‘கை’ உருவகத்தைத் தக்கவைக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயர்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் வரும் தனிப்பட்ட உடன்படிக்கைப் பெயரை ஒரு பட்டத்தால் மாற்றாமல் ஒலிபெயர்க்கிறது.
- issue: אֲבֹתֵיכֶם என்ற உடன்படிக்கை முன்னோர் சொல்
  choice: உங்கள் தந்தையர்
  alternative: உங்கள் மூதாதையர்
  rationale: எபிரெயச் சொல்லின் ஆண்பால் வடிவத்தையும் பிதாக்களைச் சுட்டும் வரலாற்றுக் குறிப்பையும் காக்கிறது.
- issue: עֲבָדִים என்ற அடிமைத்தன மொழி
  choice: அடிமைகள்
  alternative: பணியாளர்கள்
  rationale: எகிப்திய ஒடுக்குமுறையின் கட்டாய அடிமைத்தன்மையை மங்கச் செய்யாமல் வெளிப்படுத்துகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழ்; பொதுவாசகர்களுக்குப் புரியும் dignified நடை. ‘ஆணையிட்ட ஆணை’ என்பது எபிரெயில் உள்ள ‘ஆணையிடுதல்/ஆணை’ என்ற சொல்வேர் தொடர்பைத் தமிழிலும் ஓரளவு பிரதிபலிக்கிறது. ஒருமை முகவரியைத் தமிழ் மரியாதை/கூட்டுச் சூழலுக்கேற்ற ‘உங்கள்/உங்களை’ வடிவில் வழங்கியுள்ளது.
