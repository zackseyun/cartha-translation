base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/022.yaml
  text: And Yahweh your God will drive out these nations before you little by little[a]. You will not be able to finish them off quickly[b], lest the wild animals become too numerous against you.
translation:
  language: ta
  text: உன் கடவுளாகிய யாவே இந்த மக்களினங்களை உன் முன்னிலையிலிருந்து சிறிது சிறிதாக அகற்றிவிடுவார்[a]. அவர்களை நீ விரைவாக முற்றிலும் அழித்துவிட முடியாது; இல்லையெனில் காட்டு விலங்குகள் உனக்கு எதிராகப் பெருகிவிடும்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘உன் முன்னிலையிலிருந்து இந்த மக்களினங்களைச் சிறிது சிறிதாக உடைமையிழக்கச் செய்வார்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: 'சொல்லுக்கு சொல்: ‘வயல்வெளியின் விலங்குகள்.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָשַׁל
  choice: அகற்றிவிடுவார்
  rationale: நிலத்திலிருந்து பிற இனத்தாரை நீக்கச் செய்வதைக் குறிக்கும் வினை. ‘அகற்றிவிடுவார்’ என்பது வெளியேற்றுதல், உடைமையிழக்கச் செய்தல் ஆகிய பொருள் நிழல்களைத் தேவையின்றி ஒன்றாக மட்டுப்படுத்தாமல் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய தனிப்பெயரான நான்கெழுத்துத் திருப்பெயரை ஒரு பட்டப்பெயரால் மாற்றாமல், தமிழில் அதன் பரவலான ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: הַגּוֹיִם הָאֵל
  choice: இந்த இனத்தாரை
  rationale: இங்கு ‘தேசங்கள்’ என்பது நிலப்பரப்புகளைவிட கானானிய மக்களைக் குறிக்கிறது. ‘இனத்தார்’ மனிதக் குழுக்களையே தெளிவாகச் சுட்டி, தமிழ் வாக்கியத்தில் இயல்பாக அமைகிறது.
- source_word: מִפָּנֶיךָ
  choice: உன் முன்னிலையிலிருந்து
  rationale: ‘உன் முகத்திற்கு முன்பிருந்து’ என்ற இடம்சார் எபிரெய மரபுத்தொடரின் நீக்கப் பொருளைத் தக்கவைக்கிறது.
- source_word: מְעַט מְעָט
  choice: கொஞ்சம் கொஞ்சமாக
  rationale: எபிரெயச் சொல்லின் இரட்டிப்பையும் படிப்படியான செயலின் வலியுறுத்தலையும் இயல்பான தமிழில் பாதுகாக்கிறது.
- source_word: לֹא תוּכַל
  choice: நீ ... முடியாது
  rationale: கட்டளையாக மாற்றாமல், மூலத்தில் உள்ள இயலாமை அல்லது சாத்தியமின்மையின் வடிவத்தை நேரடியாகத் தருகிறது.
- source_word: כַּלֹּתָם
  choice: அவர்களை ... முற்றிலும் அழித்துவிட
  rationale: அவர்களை முழுமையாக முடிவுக்குக் கொண்டுவருதல் என்ற வலுவான பொருளை ‘முற்றிலும்’ தெளிவாக்குகிறது.
- source_word: מַהֵר
  choice: விரைவாக
  rationale: செயலின் வேகத்தைச் சுட்டும் எளிய, தற்போதைய தமிழ் இணைச்சொல்.
- source_word: פֶּן
  choice: அப்படிச் செய்தால்
  rationale: எச்சரிக்கப்படும் விரும்பத்தகாத விளைவை இயல்பான தமிழில் அறிமுகப்படுத்துகிறது; ‘இல்லையெனில்’ என்பதைக் காட்டிலும் முந்தைய செயலைத் தெளிவாகத் தொடர்புபடுத்துகிறது.
- source_word: תִּרְבֶּה
  choice: பெருகிவிடும்
  rationale: எண்ணிக்கையில் அதிகரிப்பதையும் அது ஆபத்தான விளைவாக மாறுவதையும் வினைமுற்று இயல்பாகக் காட்டுகிறது.
- source_word: חַיַּת הַשָּׂדֶה
  choice: காட்டு விலங்குகள்
  rationale: திறந்த வெளியில் வாழும், வீட்டுவிலங்குகள் அல்லாத விலங்குகள் என்ற பொருளைத் தெளிவான நவீன தமிழில் தருகிறது.
- source_word: עָלֶיךָ
  choice: உனக்கு எதிராக
  rationale: இச்சூழலில் இஸ்ரவேலுக்கு ஆபத்தை ஏற்படுத்தும் எதிர்மறைத் தொடர்பை வெளிப்படுத்துகிறது; வெறும் ‘உன்மேல்’ என்பதைவிட தமிழில் தெளிவானது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: யெகோவா; ஆண்டவர்
  rationale: மூலத்தில் ஒரு தனிப்பெயர் நேரடியாக இடம்பெறுவதால், அதை ‘ஆண்டவர்’ என்ற பட்டப்பெயரால் மாற்றாமல் ஒலிபெயர்க்கிறது. ‘யாவே’ என்பது எபிரெயப் பெயரின் கல்வியியல் மறுகட்டமைப்புக்கு நெருக்கமான தமிழ் வடிவம்.
- issue: לֹא תוּכַל என்பதன் இயலாமை மற்றும் மறைமுகத் தடையின் பதற்றம்
  choice: நீ ... முடியாது
  alternative: நீ ... கூடாது
  rationale: இலக்கண வடிவம் முதன்மையாக ‘உன்னால் இயலாது’ என்பதைக் கூறுகிறது. சூழலில் எச்சரிக்கையோ தெய்வீகத் திட்டமோ உள்ளதாக வாசிக்க முடிந்தாலும், அதை நேரடிக் கட்டளையாக மாற்றாமல் மூலத்தின் பதற்றத்தைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், ஒருமை இரண்டாம் நபரை மூலத்தைப் பின்பற்றி வைத்துள்ளோம். நடை இயல்பாகவும் கண்ணியமாகவும் உள்ளது; ‘கொஞ்சம் கொஞ்சமாக’ என்பது பேசுவழக்குச் சாயல் கொண்டிருந்தாலும் தரத் தமிழிலும் பரவலாகப் புரியும் படிப்படியான செயலைத் துல்லியமாகக் காட்டுகிறது. மனிதக் குழுக்களைச் சுட்டுவதால் ‘நாடுகள்’ என்பதற்குப் பதில் ‘இனத்தார்’ தேர்ந்தெடுக்கப்பட்டது.
