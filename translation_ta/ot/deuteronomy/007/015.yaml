  rationale: வசனம் நோய்களையும் எகிப்தின் நோய்களையும் நேரடியாகக் குறிப்பிடுகிறது. ஆனால் இந்த ஒரு வசனத்தை அதன் உடன்படிக்கைச் சூழலைத் தாண்டிய உலகளாவிய கோட்பாடாக மொழிபெயர்ப்பது உரையில் இல்லாத கருத்தைச் சேர்த்துவிடும்.
- issue: הָרָעִים என்பதன் நிழற்பொருள்
  choice: கொடிய
  alternative: தீய; தீங்கான; கடுமையான
  rationale: רַע பல பொருள் நிழல்களைக் கொண்டது. நோய்களின் சூழலில் ‘கொடிய’ என்பது அவற்றின் தீங்கு மற்றும் கடுமையை இயல்பாகக் காட்டுகிறது; ‘தீய’ என்பது தமிழில் ஒழுக்கத் தீமையாகத் தவறாகப் புரியக்கூடும்.
