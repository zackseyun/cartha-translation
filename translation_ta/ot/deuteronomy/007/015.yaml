base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/015.yaml
  text: And Yahweh will remove from you all sickness[a], and none of the evil diseases of Egypt that you have known[b] will he put on you; instead, he will put them on all who hate you.
translation:
  language: ta
  text: யாவே உன்னிடமிருந்து எல்லா நோயையும் அகற்றுவார். நீ அறிந்த[b] எகிப்தின் கொடிய[a] நோய்களில் எதையும் அவர் உன்மேல் வைக்கமாட்டார்; அவற்றை உன்னை வெறுக்கிற எல்லார்மேலும் வைப்பார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘தீங்கான’ அல்லது ‘கடுமையான’ என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் தீயது, தீங்கானது, கடுமையானது அல்லது கொடியது என்பவற்றைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘அனுபவித்த’. இங்கு ‘அறிந்த’ என்பதற்கான எபிரெயச் சொல் அனுபவத்தால் அறிந்ததைக் குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵסִיר
  choice: அகற்றுவார்
  rationale: סור என்பதன் ஹிப்இல் வடிவம் ஒன்றை விலகச் செய்வதையோ அகற்றுவதையோ குறிக்கிறது; ‘அகற்றுவார்’ காரணவினைப் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய மூலத்தில் இடம்பெறும் தேவனுடைய தனிப்பெயரை ஒரு பட்டப்பெயரால் மாற்றாமல், நவீன தமிழில் தெளிவான ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: מִמְּךָ
  choice: உன்னிடமிருந்து
  rationale: מן முன்னொட்டின் பிரிதல் அல்லது நீக்கப்படுதல் சார்ந்த பொருளைத் துல்லியமாக வெளிப்படுத்துகிறது.
- source_word: כָּל חֹלִי
  choice: எல்லா நோயையும்
  rationale: חֹלִי என்பது நோய் அல்லது உடல்நலக்குறைவைக் குறிக்கிறது; ஒருமை வடிவத்தைத் தமிழில் தொகுப்புப் பொருளுடன் இயல்பாகப் பிரதிபலிக்கிறது.
- source_word: מַדְוֵי מִצְרַיִם הָרָעִים
  choice: எகிப்தின் கொடிய நோய்கள்
  rationale: מַדְוֶה என்பது நோயைக் குறிக்கிறது; רַע இங்கு தீங்கான, கடுமையான அல்லது கொடிய என்ற பொருளைக் கொள்ளலாம். நோய்களுக்கு ஒழுக்கத் தீமையைச் சுமத்தாமல் அவற்றின் தீவிரத்தைக் காட்ட ‘கொடிய’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: אֲשֶׁר יָדַעְתָּ
  choice: நீ அறிந்த
  rationale: ידע என்பதன் அடிப்படை ‘அறிதல்’ என்ற சொல்லாட்சியைப் பாதுகாக்கிறது; சூழலில் அனுபவத்தால் அறிதல் என்ற நிழற்பொருளும் இருக்கலாம் என்பதால் அது அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: לֹא יְשִׂימָם בָּךְ
  choice: எதையும் அவர் உன்மேல் வைக்கமாட்டார்
  rationale: שׂים உடன் בְּ வருவது ஒருவர்மேல் ஒன்றை வைப்பதைக் குறிக்கிறது. எதிர்மறை வாக்கியத்தில் ‘எதையும் ... வைக்கமாட்டார்’ என்பது தமிழில் தெளிவாகவும் மூலத்திற்கு நெருக்கமாகவும் உள்ளது.
- source_word: וּנְתָנָם
  choice: அவற்றை ... வைப்பார்
  rationale: נתן அடிப்படையில் ‘கொடு’ என்றாலும், நோயை ஒருவர்மேல் இடும் சூழலில் ‘வைப்பார்’ என்பது இயல்பானது; முந்தைய வினையுடன் உள்ள கருத்துத் தொடர்பையும் காக்கிறது.
- source_word: בְּכָל שֹׂנְאֶיךָ
  choice: உன்னை வெறுக்கிற எல்லார்மேலும்
  rationale: שֹׂנְאֶיךָ என்பது பொதுவான ‘எதிரிகள்’ என்பதைவிடத் துல்லியமாக ‘உன்னை வெறுப்பவர்கள்’ என்று பொருள்படும்; כָּל முழுமையைச் சுட்டுகிறது.
