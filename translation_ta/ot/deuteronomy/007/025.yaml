base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/025.yaml
  text: You shall burn the carved images of their gods with fire[a]. You shall not covet the silver or gold that is on them and take it for yourself, lest you be ensnared by it[b], for it is an abomination to Yahweh your God.
translation:
  language: ta
  text: அவர்களுடைய தெய்வங்களின் செதுக்கப்பட்ட உருவங்களை நெருப்பில் எரித்துவிடுங்கள். அவற்றின்மேல் இருக்கும் வெள்ளியையும் தங்கத்தையும் இச்சித்து, உங்களுக்காக எடுத்துக்கொள்ளாதீர்கள்; இல்லையெனில், அதனால் நீங்கள் கண்ணியில் சிக்கிக்கொள்வீர்கள்[a]. ஏனெனில், அது உங்கள் கடவுளாகிய யாவேக்கு அருவருப்பானது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அதனால் நீங்கள் பொறியில் அகப்பட்டுக்கொள்வீர்கள்’ என்றும் மொழிபெயர்க்கலாம். எபிரேய வினை கண்ணி அல்லது பொறியில் சிக்குவதை உருவகமாகக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּסִילֵי
  choice: செதுக்கப்பட்ட உருவங்கள்
  rationale: פֶּסֶל என்பதன் செதுக்கப்பட்ட அல்லது வடிக்கப்பட்ட உருவம் என்ற தெளிவான பொருளைத் தக்கவைக்கிறது; ‘விக்கிரகங்கள்’ என்பதைவிட மூலத்தின் உருவாக்க முறையை நேரடியாக வெளிப்படுத்துகிறது.
- source_word: אֱלֹהֵיהֶם
  choice: அவர்களுடைய தெய்வங்கள்
  rationale: பன்மைத் தொகைநிலையையும் மூன்றாம் நபர் பன்மை உரிமையையும் இயல்பான தமிழில் தருகிறது.
- source_word: תִּשְׂרְפוּן בָּאֵשׁ
  choice: நெருப்பில் எரித்துவிடுங்கள்
  rationale: எரித்தல் என்ற வினையையும் நெருப்பே அதன் சாதனம் என்பதையும் இயல்பாகக் கூறுகிறது; ‘விடு’ முழுமையான அழிப்பைச் சூழலுக்கேற்ப உணர்த்துகிறது.
- source_word: לֹא תַחְמֹד
  choice: இச்சித்து ... எடுத்துக்கொள்ளாதீர்கள்
  rationale: חמד என்பதிலுள்ள விரும்பிக் கைப்பற்ற நினைக்கும் பொருளாசையை ‘இச்சி’ தக்கவைக்கிறது; அடுத்த வினையோடு ஒரே தடையாக இயல்பாக இணைக்கப்பட்டுள்ளது.
- source_word: כֶּסֶף וְזָהָב עֲלֵיהֶם
  choice: அவற்றின்மேல் இருக்கும் வெள்ளியையும் தங்கத்தையும்
  rationale: எபிரேய ‘மற்றும்’ இணைப்பையும், உலோகங்கள் உருவங்களின்மேல் பொருத்தப்பட்டுள்ள அல்லது பூசப்பட்டுள்ள உறவையும் தெளிவாகத் தருகிறது.
- source_word: וְלָקַחְתָּ לָךְ
  choice: உங்களுக்காக எடுத்துக்கொள்ளாதீர்கள்
  rationale: לָךְ குறிக்கும் தனக்கான பயனை இயல்பான தமிழில் வெளிப்படுத்தி, முன் வரும் மறுப்புக் கட்டளையின் ஆட்சிக்குள் வினையை வைக்கிறது.
- source_word: פֶּן תִּוָּקֵשׁ בּוֹ
  choice: இல்லையெனில், அதனால் நீங்கள் கண்ணியில் சிக்கிக்கொள்வீர்கள்
  rationale: Niphal வடிவின் சிக்கிக்கொள்ளுதல் என்ற பொருளையும் יקשׁ வேரின் கண்ணி உருவகத்தையும் காக்கிறது. בּוֹ-வின் துல்லியமான சுட்டுப் பொருளை விரிவாக நிர்ணயிக்காமல் ‘அதனால்’ எனத் தருகிறது.
- source_word: תּוֹעֲבַת יְהוָה אֱלֹהֶיךָ
  choice: உங்கள் கடவுளாகிய யாவே அருவருப்பது
  rationale: תּוֹעֵבָה-வின் கடுமையான வெறுப்புக்குரிய தன்மையை இயல்பான தமிழில் உறவுக் கட்டமைப்பாகத் தருகிறது; יְהוָה தனிப்பெயராக ‘யாவே’ என ஒலிபெயர்க்கப்படுகிறது.
theological_decisions:
- issue: இறுதி הוּא சுட்டுப்பெயரின் குறிப்பு
  choice: ‘அது’ என்று பொதுவாக வைத்து, தடைசெய்யப்பட்ட பொருள்/சிலை சார்ந்த முழுத் தொகுதியைச் சுட்ட அனுமதித்தல்
  alternative: செதுக்கப்பட்ட உருவமே குறிப்பாக அருவருப்பானது எனத் தெளிவுபடுத்துதல்; அல்லது வெள்ளி தங்கத்தை எடுத்துக்கொள்ளும் செயலே அருவருப்பானது எனக் கூறுதல்
  rationale: உடனடிச் சூழல் சிலைகளிலுள்ள உலோகத்தை இச்சித்து எடுத்துக்கொள்வதைப் பற்றினாலும், முழு சிலைச் சார்பும் பார்வையில் உள்ளது. ‘அது’ மூலத்தின் உண்மையான தெளிவின்மையைத் தீர்க்காமல் காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் நேரடியான பன்மை கட்டளைநடை பயன்படுத்தப்பட்டுள்ளது. ‘செதுக்கப்பட்ட உருவங்கள்’ மூலத்தின் காட்சிப்பூர்வமான பொருளைக் காக்கிறது; ‘யாவே’ தெய்வீகத் தனிப்பெயராக வழங்கப்பட்டுள்ளது. ஒருமை எபிரேய உரையில் இஸ்ரவேலைக் கூட்டாக நோக்கியிருந்தாலும், தமிழில் மரியாதை/கூட்டுப் பன்மை கட்டளை இயல்பாகப் பயன்படுகிறது.
