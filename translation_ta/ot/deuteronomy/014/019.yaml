translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியும் ஆனால் கண்ணியமான சட்டநடை பயன்படுத்தப்பட்டுள்ளது. ‘பறக்கும் சிற்றுயிர்’ என்ற மொழிபெயர்ப்பு மூலத்தின் வகைப்பாட்டு நெகிழ்வைத் தக்கவைக்கிறது; ‘பூச்சி’ என்று பிரதான உரையிலேயே குறுக்கமாக வரையறுக்கவில்லை. ஒருமை ‘ஒவ்வொன்றும்’ என்பதற்குப் பின் வரும் எபிரெயப் பன்மையை ‘அவை’ என்று பாதுகாத்துள்ளோம்.
