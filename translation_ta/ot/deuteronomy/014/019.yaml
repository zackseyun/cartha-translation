  source_fidelity: மூல எபிரெயத்தின் כֹל என்ற முழுமைச் சுட்டல், שֶׁרֶץ הָעוֹף என்ற பறக்கும் சிற்றுயிரின வகைப்பாடு, טָמֵא என்ற சடங்குசார் ‘தீட்டு’ வகை, மற்றும் பன்மைச் செயலப்பாட்டு மறுப்பு ஆகியவை உரையில் நன்றாகப் பாதுகாக்கப்பட்டுள்ளன. ‘பறக்கும் சிற்றுயிர்’ என்பது ‘பறவை’ என்று தேவையின்றி வரையறுக்காமல், இச்சூழலில் முக்கியமாகப் பறக்கும் பூச்சிகளைக் குறிக்கும் சொற்றொடரின் பரப்பை இயல்பாகத் தருகிறது.
  naturalness: ‘பறக்கும் சிற்றுயிர் ஒவ்வொன்றும் உங்களுக்குத் தீட்டானது; அவை உண்ணப்படக் கூடாது’ என்பது நவீன நிலையான தமிழில் தெளிவான, கண்ணியமான சட்டநடையாக உள்ளது. ஒவ்வொன்றும் என்ற பகிர்ந்தளிக்கும் ஒருமைக்குப் பின்னர் மூலத்தின் பன்மைச் செயலப்பாட்டைத் தொடர்ந்து ‘அவை’ என வருவது இயல்பாகவும் பொருத்தமாகவும் உள்ளது.
