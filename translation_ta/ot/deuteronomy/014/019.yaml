  text: וְ/כֹל֙ שֶׁ֣רֶץ הָ/ע֔וֹף טָמֵ֥א ה֖וּא לָ/כֶ֑ם לֹ֖א יֵאָכֵֽלוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/014/019.yaml
  text: And every swarming thing of the birds is unclean for you[a]; they shall not be eaten.
translation:
  language: ta
  text: பறக்கும் சிற்றுயிர் ஒவ்வொன்றும் உங்களுக்குத் தீட்டானது[a]; அவை உண்ணப்படக் கூடாது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சிறகுள்ள சிற்றுயிர் ஒவ்வொன்றும்.” எபிரெயச் சொற்றொடர் “திரண்டு அல்லது ஊர்ந்து இயங்கும் சிற்றுயிர்” என்பதற்கான சொல்லையும் “பறக்கும் உயிரினம், பறவை” என்பதற்கான சொல்லையும் இணைக்கிறது. இங்கு பொதுவாகப் பறவைகளைவிட, குறிப்பாகப் பறக்கும் பூச்சிகளையே இது குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כֹל
  choice: ஒவ்வொன்றும்
  rationale: כֹל என்பதன் முழுமையான, பகிர்ந்தளிக்கும் பொருளை ‘ஒவ்வொன்றும்’ இயல்பாக வெளிப்படுத்துகிறது; வாக்கிய இணைப்பு தமிழில் தனியே ‘மேலும்’ சேர்க்காமலேயே சூழலால் தெளிவாகிறது.
- source_word: שֶׁרֶץ הָעוֹף
  choice: பறக்கும் சிற்றுயிர்
  rationale: שֶׁרֶץ சிறிய, திரண்டு அல்லது ஊர்ந்து இயங்கும் உயிரினத்தைக் குறிக்கிறது; עוֹף பறக்கும் உயிரினம் அல்லது பறவை என்ற பரந்த பொருளுடையது. இணைந்த சொற்றொடர் இங்கு குறிப்பாகப் பறக்கும் பூச்சி வகைகளைச் சுட்டுவதால், ‘பறக்கும் சிற்றுயிர்’ இயல்பாகவும் தேவையற்ற குறுக்கீடின்றியும் பொருளைத் தருகிறது.
- source_word: טָמֵא
  choice: தீட்டானது
  rationale: உணவு மற்றும் சடங்குசார் தூய்மை விதிகளின் உடன்படிக்கைச் சூழலில் טָמֵא குறிக்கும் வகைப்பாட்டை ‘தீட்டு’ துல்லியமாகப் பாதுகாக்கிறது.
- source_word: לָכֶם
  choice: உங்களுக்குத்
  rationale: இந்த உணவுவிதி இஸ்ரவேலருக்குரியதாக விதிக்கப்படுவதை எபிரெய தத்துவுருபின் உறவுப்பொருளோடு வெளிப்படுத்துகிறது.
- source_word: לֹא יֵאָכֵלוּ
  choice: அவை உண்ணப்படக் கூடாது
  rationale: எபிரெய மொழியிலுள்ள மூன்றாம் நபர் பன்மைச் செயலப்பாட்டு வடிவத்தைப் பன்மைச் சுட்டுப்பெயருடனும் செயப்பாட்டு அமைப்புடனும் காக்கிறது; தமிழில் சட்டத் தடையை ‘கூடாது’ இயல்பாகத் தெரிவிக்கிறது.
