lexical_decisions:
- source_word: לֹא תֹאכַל
  choice: சாப்பிடக் கூடாது
  rationale: לֹא உடன் வரும் இரண்டாம் நபர் ஒருமை Qal imperfect இச்சட்டச் சூழலில் நேரடியான தடையைத் தெரிவிக்கிறது. நவீனத் தமிழில் ‘சாப்பிடக் கூடாது’ என்பது அதன் கட்டளை வலிமையை இயல்பாகக் காக்கிறது.
- source_word: כָּל
  choice: எதையும்
  rationale: எதிர்மறை வாக்கியத்தில் ஒருமை பெயர்ச்சொல்லுடன் வரும் כָּל முழுமையான தடையைச் சுட்டுகிறது; தமிழில் ‘எதையும் ... கூடாது’ என்பது இயல்பானதும் துல்லியமானதும் ஆகும்.
- source_word: תּוֹעֵבָה
  choice: அருவருப்பான
  rationale: இச்சொல் வெறுக்கத்தக்க அல்லது ஏற்கத்தகாத ஒன்றைக் குறிக்கிறது. தொடர்ந்து வரும் தடைசெய்யப்பட்ட உணவுகளின் பட்டியலை அறிமுகப்படுத்தும் இச்சூழலில், ‘அருவருப்பான எதையும்’ என்பது பொருளை முன்கூட்டியே ‘தீட்டானது’ என்று குறுக்காமல் அதன் வலுவான எதிர்மறை உணர்வைக் காக்கிறது.
theological_decisions:
- issue: உடன்படிக்கைச் சட்டத்தில் தடையின் வலிமை
  choice: ‘அருவருப்பான எதையும் நீ சாப்பிடக் கூடாது.’ என்ற நேரடியான சட்டத் தடை
  alternative: ‘அருவருப்பான எதையும் நீ சாப்பிடுவதில்லை’ என்ற பொதுவான கூற்று
  rationale: לֹא + imperfect என்னும் அமைப்பு இச்சட்டச் சூழலில் முன்னறிவிப்பையோ வழக்கத்தைப் பற்றிய கூற்றையோ அல்ல, கட்டாயமான தடையையே தெரிவிக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் நேரடியான சட்டநடை பயன்படுத்தப்பட்டுள்ளது. ‘உண்ணக் கூடாது’ என்பதைக் காட்டிலும் அன்றாடத்தில் இயல்பான ‘சாப்பிடக் கூடாது’ தேர்ந்தெடுக்கப்பட்டுள்ளது; அதேவேளையில் வசனத்தின் கண்ணியமும் தடையின் வலிமையும் காக்கப்பட்டுள்ளன.
