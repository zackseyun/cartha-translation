  source_fidelity: ‘அருவருப்பான எதையும் நீ சாப்பிடக் கூடாது’ என்பது לֹא תֹאכַל என்ற சட்டத் தடையையும், כָּל உடனான முழுமையான மறுப்பின் பரப்பையும், תּוֹעֵבָה என்பதன் வலுவான வெறுப்புக்குரிய/அருவருப்பான பொருளையும் துல்லியமாகக் காக்கிறது. மூலத்தில் வெளிப்படையாக இல்லாத ‘நீ’ தமிழ் இரண்டாம் நபர் கட்டளைநடைக்கு இயல்பான வெளிப்பாடாகும்; பொருளைச் சேர்ப்பதில்லை.
  naturalness: நவீன நிலையான தமிழில் வாக்கியம் தெளிவாகவும் இயல்பாகவும் உள்ளது. ‘சாப்பிடக் கூடாது’ நேரடியான தடையைச் சாதாரண வாசகருக்குப் புரியும் வகையில் வெளிப்படுத்துகிறது. வசனத்திற்கேற்ற அளவு நேர்மையான நடை காக்கப்பட்டுள்ளது.
  terminology: ‘அருவருப்பான’ என்பது תּוֹעֵבָה-வின் சூழல்சார்ந்த வலுவான எதிர்மறை மதிப்பீட்டைத் தருகிறது; அதை ‘தீட்டான’ என்று முன்கூட்டியே விளக்கவில்லை. அடிக்குறிப்பில் உள்ள ‘அருவருப்புக்குரிய’ மற்றும் ‘வெறுக்கத்தக்க’ மாற்றுகள் பொருத்தமானவை; தொடர்ந்து வரும் தடைசெய்யப்பட்ட உணவுப் பட்டியலைக் குறித்த விளக்கமும் இச்சூழலுக்கு ஏற்றது.
