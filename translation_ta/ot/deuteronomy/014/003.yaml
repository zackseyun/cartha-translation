  text: You shall not eat any detestable thing[a].
translation:
  language: ta
  text: அருவருப்பான எதையும் நீ சாப்பிடக் கூடாது.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அருவருப்புக்குரிய எதையும்.’ எபிரெயச் சொல் வெறுக்கத்தக்க அல்லது அருவருப்புக்குரிய ஒன்றைக் குறிக்கிறது; இங்கே அது தொடர்ந்து வரும் தடைசெய்யப்பட்ட உணவுகளின் பட்டியலை அறிமுகப்படுத்துகிறது.
