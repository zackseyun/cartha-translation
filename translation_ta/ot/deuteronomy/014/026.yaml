base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/014/026.yaml
  text: 'and spend the silver on whatever your appetite desires: cattle[a], sheep, wine, strong drink, or whatever your appetite asks for. And you shall eat there before Yahweh your God and rejoice[c][b], you and your household.'
translation:
  language: ta
  text: அந்தப் பணத்தை[a] உன் உள்ளம் விரும்பும் எதற்காகவும்—மாடுகளுக்காகவோ, ஆடுகளுக்காகவோ[c], திராட்சமதுவுக்காகவோ, வேறொரு போதையூட்டும் பானத்திற்காகவோ[d], உன் உள்ளம் கேட்கும் வேறு எதற்காகவுமோ[b]—செலவிடு. அங்கே உன் கடவுளாகிய யாவே முன்னிலையில் உண்ணு; நீயும் உன் வீட்டாரும் மகிழுங்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரேயத்தில் ‘அந்த வெள்ளி’; இங்கு அது பணத்தைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: எபிரேயத்தில் ‘உன் உயிர்/ஆத்துமா’; இங்கு அது ஒருவரின் தனிப்பட்ட விருப்பம் அல்லது ஆசையைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: c
    text: ‘ஆடுகள்’ என்பதற்கான எபிரேயச் சொல் செம்மறியாடுகளையும் வெள்ளாடுகளையும் உள்ளடக்கலாம்.
    reason: lexical_alternative
  - marker: d
    text: இது திராட்சமதுவிலிருந்து வேறான போதையூட்டும் மதுபானத்தைக் குறிக்கிறது.
    reason: cultural_note
lexical_decisions:
- source_word: וְנָתַתָּה הַכֶּסֶף
  choice: அந்தப் பணத்தை ... செலவிடு
  rationale: வினைச்சொல்லின் அடிப்படைப் பொருள் ‘கொடு’ என்றாலும், பொருட்களைப் பெறுவதற்காக வெள்ளியை வழங்கும் இந்த வணிகச் சூழலில் ‘பணத்தைச் செலவிடு’ என்பதே இயல்பான பொருள்.
- source_word: תְּאַוֶּה נַפְשְׁךָ / תִּשְׁאָלְךָ נַפְשֶׁךָ
  choice: உன் உள்ளம் விரும்பும் / உன் உள்ளம் கேட்கும்
  rationale: נֶפֶשׁ என்பதை வெறும் உடல் பசியாகக் குறுக்காமல், ஒருவரின் விருப்பத்தைக் குறிக்கும் எபிரேய உருவகத்தை ‘உள்ளம்’ எனப் பாதுகாக்கிறது; இரண்டு வினைகளின் வேறுபாடும் தக்கவைக்கப்படுகிறது.
- source_word: בַּבָּקָר
  choice: மாடுகள்
  rationale: மாட்டினத்தைத் தொகுதியாகக் குறிக்கும் בקר என்பதற்கான இயல்பான தமிழ்ச் சொல்.
- source_word: וּבַצֹּאן
  choice: ஆடுகள்
  rationale: צאן என்பது செம்மறியாடுகளையும் வெள்ளாடுகளையும் உள்ளடக்கக்கூடிய மந்தை விலங்குகளைக் குறிக்கிறது; பொதுவான தமிழில் ‘ஆடுகள்’ இயல்பாக உள்ளது, அதன் பரந்த பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: וּבַיַּיִן וּבַשֵּׁכָר
  choice: திராட்சமது ... வேறு மதுபானம்
  rationale: יַיִן என்பது திராட்சமதுவையும், שֵׁכָר என்பது அதிலிருந்து வேறான போதையூட்டும் பானத்தையும் குறிக்கிறது. மூலத்தின் இரு தனிப்பட்ட பான வகைகளும் மறைக்கப்படாமல் காட்டப்படுகின்றன.
- source_word: לִפְנֵי יְהוָה אֱלֹהֶיךָ
  choice: உன் கடவுளாகிய யாவே முன்னிலையில்
  rationale: לִפְנֵי என்பதன் ‘முன்னிலையில்’ என்ற பொருளையும், יהוה என்ற உடன்படிக்கைப் பெயரையும் நேரடியாகப் பாதுகாக்கிறது.
- source_word: וְשָׂמַחְתָּ אַתָּה וּבֵיתֶךָ
  choice: நீயும் உன் வீட்டாரும் மகிழுங்கள்
  rationale: ‘வீடு’ இங்கு கட்டடத்தை அல்ல, குடும்பத்தாரை அல்லது வீட்டாரைக் குறிக்கிறது. தமிழில் கூட்டு எழுவாய்க்கேற்ற பன்மை வினை இயல்பாகப் பயன்படுத்தப்படுகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூலத்தில் வரும் தனிப்பட்ட உடன்படிக்கைப் பெயரை பொதுப் பட்டமாக மாற்றாமல் ஒலிபெயர்க்கிறது.
- issue: மது பானங்களை வெளிப்படையாகக் குறிப்பிடுதல்
  choice: திராட்சமது, வேறு மதுபானம்
  alternative: திராட்சரசம், உற்சாகப் பானம்
  rationale: மூலம் போதையூட்டும் இரண்டு பான வகைகளைத் தெளிவாகக் குறிப்பிடுகிறது; கோட்பாட்டு காரணத்தால் அந்தக் குறிப்பை மென்மைப்படுத்தவோ மறைக்கவோ கூடாது.
- issue: נֶפֶשׁ என்பதன் பொருள்
  choice: உள்ளம்
  alternative: ஆத்துமா; பசி
  rationale: இங்கு அது உடலிலிருந்து பிரிந்த ஓர் ஆன்மீகப் பகுதியைத் தொழில்நுட்பமாகக் குறிக்கவில்லை; மனிதரின் விருப்பத்தைச் சுட்டுகிறது. அதேவேளை ‘பசி’ என மொழிபெயர்ப்பது பொருளை உணவாசைக்குள் மட்டும் குறுக்கிவிடும்.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும், வழிபாட்டு வாசிப்புக்கு ஏற்ற கண்ணியத்துடனும் அமைக்கப்பட்டுள்ளது. தொடர் இரண்டாம் நபர் அறிவுறுத்தல்கள் ஒருமையில் தொடங்கினாலும், இறுதியில் ‘நீயும் உன் வீட்டாரும்’ என்ற கூட்டு எழுவாய்க்கேற்ப ‘மகிழுங்கள்’ பயன்படுத்தப்பட்டுள்ளது.
