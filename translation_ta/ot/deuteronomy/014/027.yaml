  source_fidelity: 'மூல எபிரெயத்தின் கூறுகள் துல்லியமாகக் காக்கப்பட்டுள்ளன: திட்டவட்டமான ‘லேவியன்,’ ‘உன் வாசல்களுக்குள்’ என்ற நகரம்/உள்ளூர்ச் சமூகக் குறியீடு, அவனைப் புறக்கணிக்க வேண்டாமென்ற கட்டளை, மற்றும் அவனுக்கு இல்லாத பங்கு-பரம்பரை உரிமை ஆகியவை அனைத்தும் பொருத்தமாகத் தரப்பட்டுள்ளன. ‘உன் ஊர்களில் வாழும்’ என்பது בִּשְׁעָרֶיךָ என்ற மரபுத்தொடரின் பொருள்சார்ந்த நவீன மொழிபெயர்ப்பாகும். ‘பங்கும் உரிமைச்சொத்தும்’ என்பது חֵלֶק וְנַחֲלָה என்ற இணையைச் சரிவர வெளிப்படுத்துகிறது.'
  naturalness: உரை நவீன தரமான தமிழில் இயல்பாகவும் கண்ணியமான வேதாகம நடையுடனும் உள்ளது. ‘புறக்கணிக்காதே’ இச்சூழலில் தேவையான சமூகப் பராமரிப்பை மறுக்காதிருத்தல் என்ற நடைமுறை நுணுக்கத்தைச் சரியாகத் தெரிவிக்கிறது. ஒருமை இரண்டாம் நபர் வடிவங்களும் மூலத்துடன் ஒத்திருக்கின்றன.
  terminology: ‘லேவியன்’ துல்லியமான நிலையான சொல்; தேவையின்றி ‘ஆசாரியன்’ என விரிவுபடுத்தப்படவில்லை. ‘உரிமைச்சொத்து’ நַחֲלָהவின் பரம்பரை/நிலஉரிமைப் பின்னணியைத் தக்கவைக்கிறது. அடிக்குறிப்பு இஸ்ரவேலின் வழக்கமான கோத்திர நிலப்பங்கைக் குறிப்பதன் மூலம் உரையில் இல்லாத விளக்கத்தை முதன்மை உரைக்குள் திணிக்காமல் தேவையான வரலாற்றுப் பின்னணியை வழங்குகிறது.
