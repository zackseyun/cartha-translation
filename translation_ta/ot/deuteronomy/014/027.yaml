source:
  edition: WLC
  text: וְ/הַ/לֵּוִ֥י אֲשֶׁר בִּ/שְׁעָרֶ֖י/ךָ לֹ֣א תַֽעַזְבֶ֑/נּוּ כִּ֣י אֵ֥ין ל֛/וֹ חֵ֥לֶק וְ/נַחֲלָ֖ה עִמָּֽ/ךְ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/014/027.yaml
  text: And you shall not neglect the Levite who is within your gates[c][b][a], because he has no portion or inheritance with you.
translation:
  language: ta
  text: உன் ஊர்களில் வாழும் லேவியனைப் புறக்கணிக்காதே; ஏனெனில் உன்னோடு அவனுக்குப் பங்கும் உரிமைச்சொத்தும் இல்லை.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘உன் ஊர்களில்’ என்பது சொல்லுக்குச் சொல் ‘உன் வாசல்களுக்குள்.’ இது ஒருவருடைய நகரங்கள் அல்லது உள்ளூர்ச் சமூகங்களைக் குறிக்கும் எபிரெய மரபுத்தொடர்.
    reason: cultural_note
  - marker: b
    text: அதாவது, இஸ்ரவேலில் மற்ற கோத்திரங்களுக்கு இருந்ததுபோன்ற வழக்கமான நிலப் பங்கு லேவியனுக்கு இல்லை.
    reason: cross_reference
lexical_decisions:
- source_word: וְהַלֵּוִי
  choice: லேவியனை
  rationale: திட்டவட்ட ஒருமை பெயர்ச்சொல் இங்கு லேவியர் வகுப்பைச் சேர்ந்த ஒருவரைப் பிரதிநிதியாகக் குறிக்கிறது. ‘லேவியன்’ என்பது துல்லியமான வழக்குச் சொல்; ‘ஆசாரியன்’ என்று மொழிபெயர்த்தால் மூலத்தில் இல்லாத குறிப்பைச் சேர்த்துவிடும்.
- source_word: אֲשֶׁר בִּשְׁעָרֶיךָ
  choice: உன் ஊர்களில் வாழும்
  rationale: சொல்லுக்குச் சொல் ‘உன் வாசல்களுக்குள்’ என்றாலும், எபிரெய வழக்கில் இது ஒருவருடைய நகரங்கள் அல்லது உள்ளூர்ச் சமூகங்களைக் குறிக்கிறது. நவீன தமிழில் இயல்பாகவும் தெளிவாகவும் இருக்க ‘உன் ஊர்களில் வாழும்’ என வழங்கப்பட்டுள்ளது.
- source_word: לֹא תַעַזְבֶנּוּ
  choice: புறக்கணிக்காதே
  rationale: עזב என்பதற்கு விட்டுவிடுதல், கைவிடுதல் என்ற பொருள்கள் உண்டு. லேவியருக்கான வாழ்வாதார ஆதரவைப் பற்றிய இச்சூழலில், அவரைக் கவனியாமல் விட்டுவிடக் கூடாது என்ற நடைமுறைப் பொருளை ‘புறக்கணிக்காதே’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய கட்டளைக்கான காரணத்தை அறிமுகப்படுத்துகிறது; நவீன தரமான தமிழில் கண்ணியமான, தெளிவான இணைப்புச் சொல்.
- source_word: אֵין לוֹ
  choice: அவனுக்கு ... இல்லை
  rationale: எபிரெய இருப்பின்மை அமைப்பை இயல்பான தமிழ் உடைமை அமைப்பாக வழங்குகிறது.
- source_word: חֵלֶק וְנַחֲלָה
  choice: பங்கும் உரிமைச்சொத்தும்
  rationale: எபிரெயில் இரு சொற்களும் וְ (‘மற்றும்’) என்பதால் இணைக்கப்பட்டுள்ளன. חֵלֶק என்பது பங்கு; נַחֲלָה என்பது தலைமுறை உரிமையாகப் பெறும் நிலம் அல்லது சொத்து. ‘உரிமைச்சொத்து’ நில ஒதுக்கீட்டுப் பின்னணியைச் சுருக்கமாகத் தக்கவைக்கிறது.
- source_word: עִמָּךְ
  choice: உன்னோடு
  rationale: 'மூலத்திலுள்ள உறவுசார் ஒப்பீட்டை நேரடியாகக் காக்கிறது: மற்ற இஸ்ரவேலரோடு சேர்ந்து லேவியனுக்கு அத்தகைய பங்கோ உரிமைச்சொத்தோ இல்லை.'
theological_decisions:
- issue: லேவியனுக்கு இல்லாத ‘பங்கும் உரிமைச்சொத்தும்’ எதைக் குறிக்கிறது?
  choice: இஸ்ரவேலின் மற்ற கோத்திரங்களுக்கு இருந்ததுபோன்ற வழக்கமான கோத்திர நிலப் பங்கு லேவியனுக்கு இல்லை.
  alternative: பொதுவான சமூக ஒதுக்கப்படுதலை மட்டும் குறிக்கிறது.
  rationale: உபாகமத்தின் சூழலில் חֵלֶק וְנַחֲלָה என்ற சொற்றொடர் குறிப்பாக நில ஒதுக்கீடு மற்றும் பரம்பரை உரிமையைச் சுட்டுகிறது. முதன்மை உரை இதை விளக்கிச் சேர்க்காமல் சொற்களின் இறுக்கத்தைக் காக்கிறது; அடிக்குறிப்பு பின்னணியைத் தெளிவுபடுத்துகிறது.
translation_notes:
  register: நவீன தரமான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. ஒருமை இரண்டாம் நபர் வடிவங்களான ‘உன்’, ‘உன்னோடு’, ‘புறக்கணிக்காதே’ என்பவை எபிரெய மூலத்தின் ஒருமையைத் தக்கவைக்கின்றன. மூலத்தில் உள்ள ‘வாசல்கள்’ என்ற உருவகத்தை முதன்மை உரையில் நேரடியாக வைத்தால் நவீன வாசகருக்கு தவறான இடவியல் பொருள் தோன்றலாம் என்பதால் ‘ஊர்கள்’ என இயல்பாக்கி, சொற்படிவம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
