base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/014/002.yaml
  text: For you are a holy people to Yahweh your God[a], and Yahweh has chosen you to be a treasured people for himself out of all the peoples who are on the face of the earth.
translation:
  language: ta
  text: ஏனெனில், நீ உன் கடவுளாகிய யாவேக்குப் பரிசுத்தமான மக்கள். பூமியெங்கும் உள்ள எல்லா மக்களினங்களிலிருந்தும், தமக்கே உரிய அருமைமிக்க மக்களாக[a] இருக்கும்படி யாவே உன்னைத் தேர்ந்தெடுத்திருக்கிறார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தமக்குச் சிறப்புச் சொத்தாகிய மக்களாக.” எபிரெயச் சொல் סְגֻלָּה தனிப்பட்ட விதத்தில் மதிக்கப்படும் உடைமையைக் குறிக்கிறது.
    reason: சொற்பொருள் மாற்று
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய தடைக்கான காரணத்தை அறிமுகப்படுத்தும் விளக்கத் தொடர்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: עַם קָדוֹשׁ
  choice: பரிசுத்தமான மக்கள்
  rationale: உடன்படிக்கைச் சமூகத்தின் தூய்மையையும் கடவுளுக்கெனப் பிரித்தெடுக்கப்பட்ட நிலையையும் ஒருங்கே தக்கவைக்கிறது.
- source_word: לַיהוָה אֱלֹהֶיךָ
  choice: உன் கடவுளாகிய யாவேக்கு
  rationale: ל குறிக்கும் உறவு மற்றும் உரிமை சார்ந்த பொருளைத் தமிழில் சுருக்கமாகக் காட்டுகிறது; கடவுளின் தனிப்பெயர் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: וּבְךָ בָּחַר
  choice: உன்னைத் தேர்ந்தெடுத்து
  rationale: בחר உடன் வரும் ב என்பது ஒருவரைத் தேர்ந்தெடுத்தல் என்ற எபிரெய வழக்காக இருப்பதால், தமிழில் நேரடிச் செயப்படுபொருளாக மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: לִהְיוֹת לוֹ
  choice: தமக்கே ... இருக்கும்படி செய்திருக்கிறார்
  rationale: தேர்ந்தெடுத்ததன் நோக்கம் அல்லது விளைவையும், கடவுளுக்குரிய சொந்தத் தொடர்பையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: לְעַם סְגֻלָּה
  choice: தமக்கே உரிய அருமைமிக்க மக்களாக
  rationale: עַם என்ற ‘மக்கள்’ என்பதையும், סְגֻלָּה குறிக்கும் தனிப்பட்ட மதிப்புடைய உடைமை என்ற கருத்தையும் தக்கவைக்கிறது.
- source_word: מִכֹּל הָעַמִּים
  choice: எல்லா மக்களினங்களிலிருந்தும்
  rationale: மற்ற மக்களைவிட மேலானவர்கள் என்று சேர்த்துரைக்காமல், அவர்களிடையிலிருந்து தேர்வு செய்யப்பட்டதைக் காட்டுகிறது.
- source_word: אֲשֶׁר עַל פְּנֵי הָאֲדָמָה
  choice: பூமியெங்கும் உள்ள
  rationale: ‘பூமியின் முகத்தின்மேல்’ என்ற எபிரெய மரபுத்தொடரின் உலகளாவிய பொருளை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: உடன்படிக்கைப் பயன்பாட்டிலுள்ள கடவுளின் தனிப்பெயரைப் பொதுப்பட்டத்தால் மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
theological_decisions:
- issue: இஸ்ரவேலின் தேர்ந்தெடுக்கப்பட்ட நிலையின் தன்மை
  choice: கடவுளுக்குரிய பரிசுத்தமான, அருமைமிக்க மக்களாக இருப்பதற்கான உடன்படிக்கைத் தேர்வாக மொழிபெயர்க்கப்பட்டது.
  alternative: מִכֹּל என்பதைக் ‘எல்லா மக்களுக்கும் மேலாக’ என்று மொழிபெயர்த்து மேன்மையை வலியுறுத்துதல்.
  rationale: எபிரெய உரை எல்லா மக்களினங்களிலிருந்தும் தேர்ந்தெடுக்கப்பட்டதையும் கடவுளுக்குரிய தனிச்சிறப்பான நிலையையும் கூறுகிறது; இன மேன்மையையோ பிற்காலத் தேர்தல் கோட்பாடுகளையோ உரைக்குள் சேர்க்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியக்கூடிய கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. எபிரெயத்தில் இஸ்ரவேல் ஒருமையில் நேரடியாக அழைக்கப்படுவதால் ‘நீ/உன்/உன்னை’ தக்கவைக்கப்பட்டுள்ளது; ‘மக்கள்’ என்பது கூட்டுப் பெயராக வருகிறது.
