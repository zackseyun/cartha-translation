base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/014/011.yaml
  text: You may eat any clean bird[a].
translation:
  language: ta
  text: சுத்தமான எந்தப் பறவையையும் நீங்கள் உண்ணலாம்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'இன்னும் சொல்லுக்குச் சொல் முறையில்: “சுத்தமான ஒவ்வொரு பறவையையும் நீங்கள் உண்ணலாம்” அல்லது “சுத்தமான எல்லாப் பறவைகளையும் நீங்கள் உண்ணலாம்.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל
  choice: எந்தப் ... யையும்
  rationale: כָּל இங்கு அனுமதிக்கப்பட்ட வகைக்குள் முழுமையான, தடையற்ற அனுமதியைக் குறிக்கிறது. ஒருமைச் சொல்லுடன் தமிழில் ‘எந்தப் பறவையையும்’ என்பது இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: צִפּוֹר
  choice: பறவை
  rationale: உணவுச் சட்டச் சூழலில் இந்த எபிரெயச் சொல் பொதுவாகப் பறவையைக் குறிக்கிறது; ‘பறக்கும் உயிரினம்’ போன்ற விரிவான சொற்களைவிட ‘பறவை’ துல்லியமும் இயல்பும் உடையது.
- source_word: טְהֹרָה
  choice: சுத்தமான
  rationale: இது உபாகம உணவுச் சட்டங்களில் அனுமதிக்கப்பட்ட சடங்கு/சட்ட வகைப்பாட்டைக் குறிக்கிறது. ‘தூய்மையான’ என்பதைக் காட்டிலும் ‘சுத்தமான’ என்பது எதிர்வரும் ‘அசுத்தமான’ வகைப்பாட்டுடன் தெளிவாகப் பொருந்துகிறது.
- source_word: תֹּאכֵלוּ
  choice: நீங்கள் உண்ணலாம்
  rationale: இரண்டாம் நபர் பன்மை imperfect வடிவம் இங்கு சட்டரீதியான அனுமதியை வெளிப்படுத்துகிறது. ‘உண்ண வேண்டும்’ என்று கட்டளையாக மாற்றாமல், ‘உண்ணலாம்’ அனுமதிப் பொருளைப் பாதுகாக்கிறது.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழில், எளிமையானதாயினும் கண்ணியமான சட்டநடை பயன்படுத்தப்பட்டுள்ளது. ‘உண்ணலாம்’ அனுமதியைத் தெளிவாகக் காட்டுகிறது; ‘சுத்தமான’ என்பது உணவுச் சட்டத்தின் வகைப்பாட்டுச் சொல்லாக வைக்கப்பட்டுள்ளது.
