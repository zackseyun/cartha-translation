lexical_decisions:
- source_word: כּוֹס
  choice: கோஸ்
  rationale: இது ஓர் ஆந்தை வகையாக இருக்கலாம்; ஆனால் துல்லியமான பறவையின அடையாளம் உறுதியற்றது. ஊகமான இனப்பெயரை முதன்மை உரையில் தராமல் எபிரெயப் பெயரை ஒலிபெயர்த்துள்ளது.
- source_word: יַנְשׁוּף
  choice: யான்ஷூஃப்
  rationale: இது இரவுப் பறவையைக் குறிக்கலாம்; ஆந்தை அல்லது வேறு பறவை என அடையாளப்படுத்துவதில் கருத்து வேறுபாடு உள்ளதால் ஒலிபெயர்ப்பு பயன்படுத்தப்பட்டுள்ளது.
- source_word: תִּנְשָׁמֶת
  choice: தின்ஷாமெத்
  rationale: இச்சூழலில் இது ஒரு பறவையைக் குறிக்கிறது; துல்லியமான இனம் தெரியாததாலும் இதே எபிரெயச் சொல் வேறு சூழலில் வேறொரு உயிரினத்தைக் குறிக்கக்கூடும் என்பதாலும் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: אֶת
  choice: '[மொழிபெயர்க்கப்படவில்லை]'
  rationale: நேரடிச் செயப்படுபொருளைக் குறிக்கும் இலக்கண உருபு; தமிழில் தனிச் சொல்லாகத் தேவையில்லை.
- source_word: וְ
  choice: ஆகிய
  rationale: பட்டியலிலுள்ள மூன்று பெயர்களையும் இயல்பான தமிழில் இணைக்கிறது.
- source_word: הַ
  choice: '[தனியாக மொழிபெயர்க்கப்படவில்லை]'
  rationale: எபிரெய definite article; இங்கு பறவை வகைகளைப் பட்டியலிடும் தமிழ் அமைப்பில் தனி இணைச்சொல் தேவையில்லை.
