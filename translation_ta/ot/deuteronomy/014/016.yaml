    text: இந்த எபிரெயப் பறவைப் பெயர்களின் துல்லியமான அடையாளம் உறுதியற்றது. மரபுவழி மற்றும் நவீன மொழிபெயர்ப்புகள் இவற்றைப் பல்வேறு ஆந்தை வகைகளாகவும், சில வேறு பறவைகளாகவும் மொழிபெயர்க்கின்றன.
