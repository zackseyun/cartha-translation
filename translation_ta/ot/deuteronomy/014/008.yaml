source:
  edition: WLC
  text: וְ/אֶת הַ֠/חֲזִיר כִּֽי מַפְרִ֨יס פַּרְסָ֥ה הוּא֙ וְ/לֹ֣א גֵרָ֔ה טָמֵ֥א ה֖וּא לָ/כֶ֑ם מִ/בְּשָׂרָ/ם֙ לֹ֣א תֹאכֵ֔לוּ וּ/בְ/נִבְלָתָ֖/ם לֹ֥א תִגָּֽעוּ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/014/008.yaml
  text: And the pig[a], because it has a split hoof but does not chew the cud, is unclean for you. You shall not eat any of its flesh[b], and you shall not touch its carcass.
translation:
  language: ta
  text: பன்றிக்குக் குளம்பு பிளவுபட்டிருந்தும் அது அசைபோடாததால், அது உங்களுக்குத் தீட்டானது. அவற்றின் இறைச்சியை எதையும் நீங்கள் உண்ணக் கூடாது; அவற்றின் பிணங்களைத் தொடவும் கூடாது.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַחֲזִיר
  choice: பன்றி
  rationale: இந்த எபிரெயச் சொல் பன்றி இன விலங்கைக் குறிக்கிறது. நவீனத் தமிழில் பொதுவாகவும் இயல்பாகவும் புரியும் சொல் ‘பன்றி’.
- source_word: מַפְרִיס פַּרְסָה
  choice: குளம்பு பிளவுபட்டதாக
  rationale: குளம்பு இரண்டாகப் பிரிந்திருக்கும் உடலமைப்புக் கூறை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: וְלֹא גֵרָה
  choice: அசைபோடுவதில்லை
  rationale: மீண்டும் வாய்க்குக் கொண்டுவரப்பட்ட இரையை மெல்வதைக் குறிக்கும் வழக்கமான தமிழ்ச் சொல் ‘அசைபோடுதல்’; எபிரெயத்தின் சுருக்கமான விலங்கியல் அளவுகோலைப் பாதுகாக்கிறது.
- source_word: טָמֵא
  choice: தீட்டானது
  rationale: திருச்சட்டத்தின் உணவு மற்றும் சடங்குசார் வகைப்பாட்டைக் குறிக்கிறது; ஒழுக்கத் தீமை என்ற கூடுதல் கருத்தைச் சேர்க்கவில்லை.
- source_word: מִבְּשָׂרָם
  choice: அவற்றின் இறைச்சியில் எதையும்
  rationale: מִן என்பதன் பகுதிப்பொருளை ‘எதையும்’ என வெளிப்படுத்தி, எபிரெயத்தில் உள்ள பன்மை விகுதியையும் பாதுகாக்கிறது.
- source_word: נִבְלָתָם
  choice: அவற்றின் பிணங்களை
  rationale: இறந்த விலங்குகளின் உடல்களைக் குறிக்கும் சொல்லை விலங்குகளுக்கேற்ற இயல்பான தமிழில் தருகிறது; மூலத்தின் பன்மையையும் காக்கிறது.
- source_word: תִגָּעוּ
  choice: தொடவும் கூடாது
  rationale: ‘தொடுதல்’ என்ற வினையின் நேரடிப் பொருளையும் தடையின் வலிமையையும் விரிவாக்கமின்றிப் பாதுகாக்கிறது.
theological_decisions:
- issue: திருச்சட்ட உணவு விதியில் ‘தீட்டு’ என்பதன் இயல்பு
  choice: சடங்கு மற்றும் உடன்படிக்கைச் சட்ட வகைப்பாடாக ‘தீட்டானது’ என்று மொழிபெயர்த்தல்
  alternative: அசுத்தமானது; மாசானது
  rationale: வசனம் ஒழுக்கத் தீமையை அறிவிப்பதில்லை; இஸ்ரவேலருக்கான உணவு மற்றும் சடங்குசார் நிலையைச் சொல்கிறது. ஆகவே பின்னைய இறையியல் விளக்கத்தைச் சேர்க்காமல் சட்டப் பிரிவை மட்டும் மொழிபெயர்க்கிறது.
- issue: பிணத்தைத் தொடுவதற்கான தடையின் வலிமை
  choice: ‘தொடவும் கூடாது’ என்ற நேரடித் தடை
  alternative: கையாளக் கூடாது; அருகில் செல்லக் கூடாது
  rationale: נגע என்பது நேரடியாக ‘தொடு’ என்று பொருள்படும். ‘கையாளுதல்’ என்பது தடையைச் சுருக்கவும், ‘அருகில் செல்லுதல்’ என்பது அதை விரிவாக்கவும் செய்யலாம்.
- issue: ஒருமையான ‘பன்றி’ என்பதிலிருந்து பன்மை விகுதிகளுக்கு மாறுதல்
  choice: மூலத்தில் உள்ள பன்மையை ‘அவற்றின்’ என்று பாதுகாத்தல்
  alternative: ‘அதன் இறைச்சி; அதன் பிணம்’ என்று ஒருமைப்படுத்தல்
  rationale: மִבְּשָׂרָם, נִבְלָתָם ஆகிய இரண்டிலும் பன்மை விகுதி உள்ளது. அது இவ்வகை விலங்குகளைப் பொதுவாகச் சுட்டக்கூடும்; ஒருமைப்படுத்துவது மூலத்தின் எண்ணியல் மாறுதலை மறைத்துவிடும்.
translation_notes:
  register: நவீன நிலையான தமிழில், சட்டவசனத்துக்கேற்ற கண்ணியமான மற்றும் நேரடியான நடை பயன்படுத்தப்பட்டுள்ளது. ‘அசைபோடுதல்’, ‘குளம்பு’, ‘தீட்டானது’ ஆகியவை துல்லியமானதுடன் பொதுவாகப் புரிந்துகொள்ளக்கூடிய சொற்கள். ஆங்கில ஆலோசனை உரையில் இறைச்சிக்குப் பின் தரப்பட்டிருந்த ‘Literally, does not chew cud’ என்ற அடிக்குறிப்பு மூலவசனத்தின் அந்த இடத்துடன் பொருந்தாததால் சேர்க்கப்படவில்லை. எபிரெயப் பன்மை விகுதிகள் தமிழில் பாதுகாக்கப்பட்டுள்ளன.
