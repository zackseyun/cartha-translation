translation_notes:
  register: நவீனத் தரமான தமிழில், விலங்குகளின் பட்டியல் இயல்பாக ஒலிக்கும்படி அமைக்கப்பட்டது. எபிரெய விலங்குப்பெயர்களின் உண்மையான இனவியல் நிச்சயமின்மை ஒரே அடிக்குறிப்பில் வெளிப்படையாகப் பாதுகாக்கப்பட்டுள்ளது; 'உண்ணலாம்' என்பது சூழலில் முன்வைக்கப்பட்ட உண்ணத்தக்க விலங்குகளின் பட்டியலை நிறைவு செய்கிறது.
