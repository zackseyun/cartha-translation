  text: the deer[a], the gazelle, the roebuck, the wild goat, the ibex, the antelope, and the mountain sheep.
translation:
  language: ta
  text: மான்[a], வெளிமான், கலைமான், காட்டாடு, வரையாடு, மறிமான், மலைச் செம்மறியாடு ஆகியவை உட்பட.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இந்த வசனத்திலுள்ள பல விலங்குப் பெயர்களின் துல்லியமான அடையாளம் உறுதியற்றது. “கலைமான்” என்பது ஃபாலோ மான் அல்லது சிவப்பு மான் என்றும், “காட்டாடு” என்பது வரையாடு என்றும், “வரையாடு” என்பது அடாக்ஸ் என்னும் ஒருவகை மறிமான் அல்லது காட்டாடு என்றும், “மறிமான்” என்பது காட்டெருது அல்லது ஆரோக்கஸ் (அழிந்துபோன காட்டெருது) என்றும், “மலைச் செம்மறியாடு” என்பது மலைமான் அல்லது மலைக்காட்டாடு என்றும் பொருள்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַיָּל
  choice: மான்
  rationale: மானினத்தைச் சேர்ந்த விலங்கைக் குறிக்கும் பொதுவான, இயல்பான நவீனத் தமிழ்ச் சொல்.
- source_word: צְבִי
  choice: வெளிமான்
  rationale: இச்சொல் பொதுவாக gazelle என அடையாளப்படுத்தப்படுகிறது; அதற்கான தமிழ்ப் பெயராக 'வெளிமான்' பயன்படுத்தப்படுகிறது.
- source_word: יַחְמוּר
  choice: கலைமான்
  rationale: குறிப்பிட்ட இனம் உறுதியற்றது; deer வகையைத் தெளிவாக உணர்த்தும் தமிழ் விலங்குப்பெயராகத் தேர்ந்தெடுக்கப்பட்டது, மாற்று அடையாளங்கள் அடிக்குறிப்பில் தரப்பட்டுள்ளன.
- source_word: אַקּוֹ
  choice: காட்டாடு
  rationale: ஒரு காட்டு ஆட்டின விலங்கைக் குறிக்கலாம்; தொழில்நுட்பமான இனப்பெயரை விட சாதாரண வாசகருக்குத் தெளிவான சொல்.
- source_word: דִישֹׁן
  choice: வரையாடு
  rationale: இனம் விவாதத்திற்குரியது; ibex எனும் மலைவாழ் காட்டு ஆட்டைக் குறிக்க இயல்பான தமிழ் இணையாகப் பயன்படுத்தப்பட்டது.
- source_word: תְּאוֹ
  choice: மறிமான்
  rationale: துல்லியமான விலங்கு உறுதியற்றது; antelope வகையைச் சுட்டும் வாசிக்க எளிய தமிழ்ப் பெயர், bovine அடையாளங்களும் அடிக்குறிப்பில் பாதுகாக்கப்படுகின்றன.
- source_word: זָמֶר
  choice: மலைச் செம்மறியாடு
  rationale: துல்லியமான இனம் தெரியவில்லை; மலைவாழ் sheep வகை என்ற சாத்தியத்தை சாதாரண வாசகருக்குப் புரியும் வகையில் வெளிப்படுத்துகிறது.
