  choice: வெள்ளாட்டுக் குட்டி
  rationale: இன்றைய தமிழில் விலங்கைக் குழப்பமின்றித் தெளிவாகக் குறிக்கிறது.
- source_word: תְבַשֵּׁל
  choice: வேகவைக்க
  rationale: திரவத்தில் கொதிக்கவைத்து சமைப்பதைக் குறிக்கும் வினை; தமிழில் ‘வேகவைக்க’ இயல்பாகவும் போதிய துல்லியத்துடனும் உள்ளது.
- source_word: בַּחֲלֵב אִמּוֹ
  choice: அதன் தாயின் பாலில்
  rationale: மூலத்தின் உறவையும் தெளிவான உருவகத்தையும் நேரடியாகக் காக்கும் இயல்பான தமிழ் அமைப்பு.
