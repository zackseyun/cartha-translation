translation_notes:
  register: நவீன நிலையான தமிழ்; சட்ட உரைக்கேற்ற கண்ணியமான, நேரடியான நடை. ‘அந்நியக் குடியிருப்பாளர்’ மற்றும் ‘வேறுநாட்டு அந்நியர்’ என்ற வேறுபாடு திட்டமிட்டு காக்கப்பட்டது. மூல வசனத்தின் இறுதி தடை தனி வாக்கியமாகவும் அதன் திடமான கட்டளைநயத்துடனும் வைக்கப்பட்டது.
