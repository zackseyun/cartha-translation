base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/014/021.yaml
  text: You shall not eat any carcass[a]. You may give it to the sojourner who is within your gates, and he may eat it; or you may sell it to a foreigner. For you are a holy people to Yahweh your God[e][d][c][b]. You shall not boil a young goat in its mother's milk.
translation:
  language: ta
  text: இறந்த எந்த விலங்கையும்[a] நீங்கள் சாப்பிடக் கூடாது. உங்கள் ஊர்களில் வாழும் அந்நியக் குடியிருப்பாளருக்கு[b][c] அதை நீங்கள் கொடுக்கலாம்; அவர் அதைச் சாப்பிடலாம். அல்லது வேறுநாட்டு அந்நியருக்கு அதை விற்கலாம்.[d] ஏனெனில், நீங்கள் உங்கள் கடவுளாகிய யாவேக்குப் பரிசுத்தமான மக்கள். வெள்ளாட்டுக் குட்டியை அதன் தாயின் பாலில் கொதிக்கவைத்து சமைக்கக் கூடாது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “விலங்கின் சடலம்.” எபிரேயச் சொல், அனுமதிக்கப்பட்ட முறையில் அறுக்கப்படாமல் இறந்த விலங்கின் சடலத்தைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: “அந்நியக் குடியிருப்பாளர்” என்பது இஸ்ரவேலரிடையே வாழும் இஸ்ரவேலர் அல்லாத குடியிருப்பாளரைக் குறிக்கிறது; அடுத்துவரும் “வேறுநாட்டு அந்நியர்” என்பவரிடமிருந்து இவர் வேறுபட்டவர்.
    reason: lexical_alternative
  - marker: c
    text: சொல்லுக்குச் சொல், “உங்கள் வாசல்களுக்குள்”; இது உங்கள் ஊர்களில் அல்லது சமூகத்தின் அதிகார எல்லைக்குள் வாழ்வதைக் குறிக்கும் எபிரேய மரபுத்தொடர்.
    reason: cultural_note
  - marker: d
    text: சட்டநடையில், “அதை அவருக்குக் கொடுங்கள்; அவர் அதைச் சாப்பிடட்டும்; அல்லது வேறுநாட்டு அந்நியருக்கு அதை விற்குங்கள்” என்றும் மொழிபெயர்க்கலாம். இங்கு எபிரேய வடிவங்களை அனுமதியாகவோ அறிவுறுத்தலாகவோ புரிந்துகொள்ள முடியும்.
    reason: alternative_reading
lexical_decisions:
- source_word: נְבֵלָה
  choice: தானாகச் செத்த எந்த விலங்கின் இறைச்சி
  rationale: அனுமதிக்கப்பட்ட முறையில் அறுக்கப்படாமல் செத்த விலங்கைக் குறிக்கிறது. தமிழில் வெறும் ‘பிணம்’ என்பது மனித உடலையும் நினைவூட்டுவதால், உணவுச் சட்டத்தின் பொருளை இயல்பாகத் தெளிவுபடுத்துகிறது.
- source_word: גֵּר
  choice: அந்நியக் குடியிருப்பாளர்
  rationale: இஸ்ரவேலரிடையே நிரந்தரமாக வசிக்கும், இஸ்ரவேலர் அல்லாத ஒருவரின் அங்கீகரிக்கப்பட்ட சமூக நிலையைக் குறிக்கிறது; அடுத்துவரும் נָכְרִי என்பதிலிருந்து வேறுபடுத்துகிறது.
- source_word: בִּשְׁעָרֶיךָ
  choice: உங்கள் ஊர்களில்
  rationale: சொல்லுக்குச் சொல் ‘உங்கள் வாசல்களுக்குள்’; நகர வாசல்களின் அதிகார எல்லைக்குள், அதாவது சமூகத்தின் ஊர்களில் வாழ்வதைக் குறிக்கும் எபிரேய மரபுத்தொடர்.
- source_word: תִּתְּנֶנָּה וַאֲכָלָהּ
  choice: கொடுக்கலாம்; அவர் அதைச் சாப்பிடலாம்
  rationale: இச்சட்டச் சூழலில் வடிவங்கள் கட்டாயக் கட்டளையைவிட அனுமதிக்கப்பட்ட நடவடிக்கையைச் சுட்டுகின்றன; தமிழில் ‘லாம்’ இதை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: נָכְרִי
  choice: வேறுநாட்டு அந்நியர்
  rationale: இஸ்ரவேலுக்குள் குடியிருக்கும் גֵּר என்பவரிலிருந்து வேறுபட்ட, அதே குடியிருப்பு நிலை இல்லாத வெளிநாட்டவரைக் குறிக்கிறது.
- source_word: עַם קָדוֹשׁ
  choice: பரிசுத்தமான மக்கள்
  rationale: கடவுளுக்கெனப் பிரித்தெடுக்கப்பட்ட உடன்படிக்கை மக்களைக் குறிக்கும் வழக்கமான வேதாகமச் சொற்றொடர்.
- source_word: לַיהוָה
  choice: யாவேக்கு
  rationale: எபிரேய மூலத்தில் வரும் தனிப்பட்ட உடன்படிக்கைப் பெயரை ஒலிபெயர்த்து, לְ முன்னிடைச்சொல் காட்டும் அர்ப்பணிப்பு/உரிமை உறவையும் ‘-க்கு’ மூலம் காக்கிறது.
