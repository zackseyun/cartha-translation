  yaml_path: translation/ot/deuteronomy/014/004.yaml
  text: 'These are the animals that you may eat: the ox[a], the sheep, and the goat.'
translation:
  language: ta
  text: 'நீங்கள் உண்ணக்கூடிய விலங்குகள் இவையே: மாடு[a], செம்மறியாடு, வெள்ளாடு.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொல்லுக்குச் சொல், “நீங்கள் உண்ணக்கூடிய விலங்கு இதுவே.” தொடர்ந்து எடுத்துக்காட்டுகளைப் பட்டியலிடுவதற்கு முன், ஒரு கூட்டு வகையை அறிமுகப்படுத்த ஒருமை வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹאת הַבְּהֵמָה
  choice: விலங்குகள் இவையே
  rationale: எபிரெயத்தில் சுட்டுப்பெயரும் ‘விலங்கு’ என்ற பெயர்ச்சொல்லும் ஒருமையில் இருந்தாலும், அவை தொடர்ந்து வரும் அனுமதிக்கப்பட்ட விலங்கு வகைகளின் பட்டியலைக் கூட்டாக அறிமுகப்படுத்துகின்றன. இயல்பான நவீன தமிழில் பன்மை இதைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: אֲשֶׁר תֹּאכֵלוּ
  choice: நீங்கள் உண்ணக்கூடிய
  rationale: இது உண்ண அனுமதிக்கப்பட்ட விலங்குகளை அடையாளப்படுத்துகிறது; கட்டாயக் கட்டளையாக மாற்றாமல் அனுமதிப் பொருளைத் தெரிவிக்க ‘உண்ணக்கூடிய’ என மொழிபெயர்க்கப்பட்டது.
- source_word: שׁוֹר
  choice: மாடு
  rationale: இச்சொல் மாட்டினத்தைச் சேர்ந்த விலங்கைக் குறிக்கலாம். பாலினத்தையோ பயன்பாட்டையோ தேவையின்றிக் குறுக்காத இயல்பான தமிழ் வகைப்பெயராக ‘மாடு’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: שֵׂה כְשָׂבִים
  choice: செம்மறியாடு
  rationale: שֵׂה என்பது மந்தையைச் சேர்ந்த சிறுகால்நடை; כְשָׂבִים அது செம்மறியாட்டு வகை என்பதைத் தெளிவுபடுத்துகிறது. வயதைக் குறிப்பதில்லை என்பதால் ‘ஆட்டுக்குட்டி’ தவிர்க்கப்பட்டது.
- source_word: וְשֵׂה עִזִּים
  choice: வெள்ளாடு
  rationale: முந்தைய தொடருக்கு இணையாக, עִזִּים இங்கு வெள்ளாட்டு வகையைச் சுட்டுகிறது. வயதைக் குறிப்பதில்லை என்பதால் வகைப்பெயரான ‘வெள்ளாடு’ பயன்படுத்தப்பட்டது.
