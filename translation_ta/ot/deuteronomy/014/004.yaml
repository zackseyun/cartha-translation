translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் அதேவேளையில் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. ‘மாடு, செம்மறியாடு, வெள்ளாடு’ என்ற வழக்கமான வகைப்பெயர்கள் பயன்படுத்தப்பட்டுள்ளன; எபிரெய ஒருமையின் கூட்டு பயன்பாடு அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
