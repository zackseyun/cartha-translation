base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/014/023.yaml
  text: And you shall eat before Yahweh your God[a], in the place that he will choose for his name to dwell there, the tithe of your grain, your new wine, and your oil, and the firstborn of your herd and your flock, so that you may learn to fear Yahweh your God all your days.
translation:
  language: ta
  text: உன் கடவுளாகிய யாவே தமது பெயரை அங்கே குடியிருக்கச் செய்வதற்காகத் தேர்ந்தெடுக்கும் இடத்தில், உன் கடவுளாகிய யாவேக்கு முன்பாக உன் தானியம், உன் புதுத் திராட்சைரசம், உன் எண்ணெய் ஆகியவற்றின் பத்திலொரு பங்கையும், உன் மாட்டுமந்தை மற்றும் சிறுமந்தையின் முதற்பேறுகளையும் நீ உண்பாயாக.[a] அவ்வாறு, உன் கடவுளாகிய யாவேக்கு எந்நாளும் அஞ்சக் கற்றுக்கொள்வாய்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “தமது பெயர் அங்கே குடியிருப்பதற்காக” அல்லது “தமது பெயரை அங்கே நிலைநாட்டுவதற்காக” என்றும் மொழிபெயர்க்கலாம். எபிரெயத்தில், யாவே தேர்ந்தெடுக்கப்பட்ட இடத்தில் தமது பெயரை குடியிருக்கச் செய்வார் என்ற மரபுத்தொடர் உள்ளது. ‘சிறுமந்தை’ என்பது செம்மறியாடுகளையும் ஆடுகளையும் உள்ளடக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָכַלְתָּ
  choice: நீ உண்பாயாக
  rationale: சட்ட அறிவுறுத்தலின் சூழலில் இணைப்புடன் வரும் நிறைவுவினை கட்டளை/எதிர்கால வலிமை பெறுகிறது; ‘உண்பாயாக’ இதைத் தெளிவாகவும் கண்ணியமாகவும் தருகிறது.
- source_word: לִפְנֵי יְהוָה אֱלֹהֶיךָ
  choice: உன் கடவுளாகிய யாவே ... முன்னிலையில்
  rationale: לִפְנֵי என்பதன் ‘முன்னிலையில்’ என்ற இடவியல் மற்றும் வழிபாட்டுச் சார்ந்த பொருளை இயல்பான தமிழில் காக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தலைப்பாக மாற்றாமல் எபிரெயத் தனிப்பெயரைத் தமிழில் ஒலிபெயர்த்து வழங்குகிறது.
- source_word: בַּמָּקוֹם אֲשֶׁר יִבְחַר
  choice: தேர்ந்தெடுக்கும் இடத்தில்
  rationale: தேவன் தேர்ந்தெடுக்கும் வழிபாட்டு இடத்தைக் குறிக்கும் உபாகமச் சூத்திரத்தை இயல்பான தமிழில் தருகிறது; சூழலின் எதிர்நோக்குப் பொருள் வினைச்சூழலில் நிலைக்கிறது.
- source_word: לְשַׁכֵּן שְׁמוֹ שָׁם
  choice: தமது பெயரை அங்கே தங்கச்செய்வதற்காக
  rationale: שׁכן என்பதன் Hiphil காரணவினை வடிவத்தை வெளிப்படையாகக் காத்து, தேவனுடைய பெயர் தேர்ந்தெடுக்கப்பட்ட இடத்தில் தங்கும் எபிரெய உருவகத்தையும் பாதுகாக்கிறது.
- source_word: מַעְשַׂר
  choice: பத்திலொரு பங்கு
  rationale: வழிபாட்டு நோக்கில் ஒதுக்கப்படும் பத்தாம் பங்கைச் சாதாரண வாசகருக்குத் தெளிவாகக் குறிக்கிறது.
- source_word: דְּגָנְךָ תִּירֹשְׁךָ וְיִצְהָרֶךָ
  choice: உன் தானியம், உன் புதுத் திராட்சைரசம், உன் எண்ணெய்
  rationale: வேளாண்மை மும்மையைத் துல்லியமாகக் காக்கிறது; תירוש என்பதன் புதிய/புதிதான திராட்சைரசப் பொருளையும் வெளிப்படுத்துகிறது.
- source_word: וּבְכֹרֹת בְּקָרְךָ וְצֹאנֶךָ
  choice: உன் மாட்டு மந்தையிலும் ஆட்டு மந்தையிலும் பிறக்கும் முதற்பேறுகள்
  rationale: பெரிய மற்றும் சிறிய கால்நடைகளின் முதலில் பிறந்த குட்டிகள் என்பதைக் குழப்பமின்றி இயல்பான தமிழில் விளக்குகிறது.
- source_word: לְמַעַן תִּלְמַד לְיִרְאָה
  choice: இவ்வாறு ... அஞ்சியிருக்க நீ கற்றுக்கொள்வாய்
  rationale: லְמַעַן குறிக்கும் நோக்கத்தையும், தொடர்ச்சியான பயபக்தியைப் பயிலுதல் என்ற கருத்தையும் வாசிக்க எளிதான தமிழில் தருகிறது.
- source_word: כָּל־הַיָּמִים
  choice: எந்நாளும்
  rationale: ‘எல்லா நாட்களிலும்’ என்ற தொடர்ச்சியான காலப்பொருளைச் சுருக்கமாகவும் இயல்பாகவும் வழங்குகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைபெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: எபிரெய மூலத்தில் உள்ள தனிப்பெயரை ஒரு பட்டப்பெயராக மாற்றாமல் பாதுகாக்கிறது; குறிப்பிட்ட சமய மரபின் மாற்றீட்டைத் திணிப்பதையும் தவிர்க்கிறது.
- issue: לְשַׁכֵּן שְׁמוֹ שָׁם என்ற திருத்தலச் சூத்திரம்
  choice: தமது பெயரை அங்கே தங்கச்செய்வதற்காக
  alternative: தமது பெயர் அங்கே தங்குவதற்காக / தமது பெயரை அங்கே நிலைநாட்டுவதற்காக
  rationale: Hiphil வடிவத்தின் காரணவினைப் பொருளையும் ‘பெயர் தங்குதல்’ என்ற மூல உருவகத்தையும் காக்கிறது; தேவனுடைய பரத்துவத்துக்கும் உடன்படிக்கைச் சந்நிதிக்கும் இடையிலான இறையியல் அழுத்தத்தைத் தட்டையாக்கவில்லை.
- issue: לְיִרְאָה என்பதன் பொருள்
  choice: அஞ்சியிருக்க
  alternative: பயபக்தியுடன் இருக்க
  rationale: ‘அஞ்சுதல்’ என்ற நேரடியான எபிரெயப் பொருளை மென்மையாக்காமல் காக்கிறது; அதேவேளை சூழல் இதை உடன்படிக்கை சார்ந்த நிலையான மனப்பாங்காக விளங்கச் செய்கிறது.
translation_notes:
  register: நவீன செந்தமிழ் சார்ந்த, பொதுவாசகருக்குப் புரியும் கண்ணியமான நடை. ஒருமை இரண்டாம் நபர் சட்ட அறிவுறுத்தல் காக்கப்பட்டுள்ளது. இறைமரியாதைக்காக ‘தமது/அவர்’ பயன்படுத்தப்பட்டாலும் மூலத்தின் நேரடி கட்டமைப்பும் இறையியல் உருவகமும் பாதுகாக்கப்பட்டுள்ளன.
