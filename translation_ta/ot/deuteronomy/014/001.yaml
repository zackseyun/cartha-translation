base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/014/001.yaml
  text: You are sons of Yahweh your God[a]. Do not cut yourselves[b], and do not make a bald spot between your eyes for the dead.
translation:
  language: ta
  text: நீங்கள் உங்கள் தேவனாகிய யாவேயின் மகன்கள்[a]. உங்களைக் கீறிக்கொள்ளாதீர்கள்; இறந்தவருக்காக உங்கள் கண்களுக்கு நடுவே வழுக்கைப் பகுதியை உண்டாக்காதீர்கள்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நீங்கள் உங்கள் தேவனாகிய யாவேயின் பிள்ளைகள்.” எபிரெயத்தில் ஆண்பால் பன்மையாக, சொல்லுக்குச் சொல் “மகன்கள்” என்று உள்ளது.
    reason: lexical_alternative
  - marker: b
    text: சொல்லுக்குச் சொல், “உங்கள் கண்களுக்கு நடுவே”; இது நெற்றிப் பகுதியைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּנִים
  choice: மகன்கள்
  rationale: எபிரெயச் சொல் ஆண்பால் பன்மையில் நேரடியாக ‘மகன்கள்’ என்று பொருள்படுகிறது. உடன்படிக்கை அடையாளத்தைச் சொல்லும் மூல வடிவம் முதன்மை உரையில் பாதுகாக்கப்படுகிறது; உள்ளடக்கப் பொருளான ‘பிள்ளைகள்’ அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: לַיהוָה אֱלֹהֵיכֶם
  choice: உங்கள் இறைவனாகிய யெகோவாவின்
  rationale: לְ இங்கு உறவு அல்லது உடைமையைக் குறிக்கிறது. יהוה என்பது தனிப்பெயராக ‘யெகோவா’ என்றும், אֱלֹהֵיכֶם இயல்பான தமிழில் ‘உங்கள் இறைவன்’ என்றும் வழங்கப்படுகிறது.
- source_word: תִתְגֹּדְדוּ
  choice: உங்களைக் கீறிக்கொள்ளாதீர்கள்
  rationale: துக்கச் சடங்கில் ஒருவர் தம்மையே வெட்டிக் காயப்படுத்துவதை இவ்வினையின் தற்சுட்டு வடிவம் குறிக்கிறது. ‘கீறிக்கொள்ளாதீர்கள்’ என்பது தெளிவான, இயல்பான நவீனத் தமிழ்.
- source_word: תָשִׂימוּ קָרְחָה
  choice: மொட்டை அடித்துக்கொள்ளாதீர்கள்
  rationale: சொற்றொடர் தலைமுடியைச் சிரைத்து வழுக்கையான பகுதியை உண்டாக்குவதைக் குறிக்கிறது. தமிழில் ‘மொட்டை அடித்துக்கொள்ளுதல்’ அந்தச் செயலை இயல்பாக எடுத்துரைக்கிறது.
- source_word: בֵּין עֵינֵיכֶם
  choice: உங்கள் கண்களுக்கு நடுவே
  rationale: மூலத்தின் உருவக உடற்கூற்றுச் சொல்லாக்கம் நேரடியாகப் பாதுகாக்கப்படுகிறது; அது நெற்றிப் பகுதியைக் குறிக்கும் என்பது அடிக்குறிப்பில் விளக்கப்படுகிறது.
- source_word: לָמֵת
  choice: இறந்தவருக்காக
  rationale: இறந்த ஒருவரை முன்னிட்டு மேற்கொள்ளப்படும் துக்கச் செயலை לְ குறிக்கிறது. ஒருமை வடிவத்தையும் சூழலையும் இத்தேர்வு காக்கிறது.
theological_decisions:
- issue: உடன்படிக்கை அடையாளத்தில் பாலினம் குறிக்கப்பட்ட பெயர்ச்சொல்
  choice: மகன்கள்
  alternative: பிள்ளைகள்
  rationale: בָּנִים என்பது இலக்கணரீதியாக ஆண்பால் பன்மை. மூலத்தின் வடிவத்தை முதன்மை உரை காக்கிறது; இது உடன்படிக்கைச் சமூகத்தில் பெண்கள் இல்லை என்று கூறுவதாகப் புரிந்துகொள்ள வேண்டியதில்லை. உள்ளடக்கமிக்க மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- issue: יהוה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யெகோவா
  alternative: ஆண்டவர்
  rationale: மூலத்தில் பொதுப் பட்டப்பெயர் அல்ல, நான்கெழுத்து உடன்படிக்கைப் பெயர் நேரடியாக உள்ளது. தமிழில் பரவலாக அறியப்பட்ட தனிப்பெயர் வடிவமான ‘யெகோவா’ பயன்படுத்தப்பட்டு, பெயரின் தன்மை பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. மூலத்தின் ‘மகன்கள்’ மற்றும் ‘கண்களுக்கு நடுவே’ என்ற வடிவங்கள் உரையில் காக்கப்பட்டு, தேவையான விளக்கங்கள் அடிக்குறிப்புகளில் வழங்கப்பட்டுள்ளன.
