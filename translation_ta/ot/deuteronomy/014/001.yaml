revisions:
- from: நீங்கள் உங்கள் இறைவனாகிய யெகோவாவின் மகன்கள்[a]. இறந்தவருக்காக உங்களைக் கீறிக்கொள்ளாதீர்கள்; உங்கள் கண்களுக்கு நடுவே மொட்டை அடித்துக்கொள்ளாதீர்கள்[b].
  to: நீங்கள் உங்கள் தேவனாகிய யாவேயின் மகன்கள்[a]. உங்களைக் கீறிக்கொள்ளாதீர்கள்; இறந்தவருக்காக உங்கள் கண்களுக்கு நடுவே வழுக்கைப் பகுதியை உண்டாக்காதீர்கள்[b].
  rationale: The revision restores the Hebrew clause relationship by associating ‘for the dead’ with the making of the bald patch, replaces an overbroad idiom for full head-shaving with wording for a bald patch, and aligns the Tamil divine-name form with the supplied POB decision for Yahweh. It otherwise retains the draft’s source-sensitive masculine plural and literal anatomical expression.
