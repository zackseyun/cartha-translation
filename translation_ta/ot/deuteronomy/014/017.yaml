translation_notes:
  register: நவீன நிலையான தமிழில், வேதாகமப் பட்டியலுக்கேற்ற சுருக்கமான மற்றும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. தமிழ் பட்டியல் அமைப்பில் இணைப்பை இயல்பாக்க ஒவ்வொரு பெயருக்கும் ‘-உம்’ சேர்க்கப்பட்டுள்ளது. மூன்று பறவைகளின் இன அடையாளங்களிலும் உள்ள உண்மையான சொல்லியல் நிச்சயமின்மை அடிக்குறிப்புகளில் வெளிப்படையாகப் பாதுகாக்கப்பட்டுள்ளது.
