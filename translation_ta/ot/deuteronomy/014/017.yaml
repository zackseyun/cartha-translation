  text: கூழைக்கடாவும்[a], பிணந்தின்னிக் கழுகும்[b], நீர்க்காகமும்[c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இவ்வசனத்திலுள்ள எபிரெயப் பறவைப்பெயர்களின் அடையாளம் உறுதியில்லை. ‘கூழைக்கடா’ என்பதற்குப் பதிலாக ‘பாலைநில ஆந்தை’ அல்லது பொதுவாக ‘ஆந்தை’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது ‘கழுகு’; பழைய ஆங்கில மொழிபெயர்ப்புகளில் ‘கியர் கழுகு’ என்று உள்ளது.
    reason: lexical_alternative
  - marker: c
    text: இந்த எபிரெயச் சொல் கூழைக்கடா அல்லது மீன்பிடி ஆந்தை போன்ற வேறொரு பறவையையும் குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַקָּאָת
  choice: கூழைக்கடா
  rationale: இந்த எபிரெயப் பறவைப்பெயரின் துல்லியமான அடையாளம் உறுதியில்லை. பறவைகளின் பட்டியலில் நீண்டகாலமாக வழங்கப்படும் ‘pelican’ என்ற அடையாளத்திற்கு இயல்பான நவீனத் தமிழ்ச் சொல்லாக ‘கூழைக்கடா’ தேர்ந்தெடுக்கப்பட்டது; வேறு சாத்தியங்கள் அடிக்குறிப்பில் தரப்பட்டுள்ளன.
- source_word: הָרָחָמָה
  choice: பிணந்தின்னிக் கழுகு
  rationale: இச்சொல் இரையை அல்லது பிணத்தைத் தின்னும் கழுகினப் பறவையைக் குறிப்பதாகத் தெரிகிறது. இனத்தை அளவுக்கு மீறித் துல்லியப்படுத்தாமல், அதன் சாத்தியமான தன்மையைத் தெளிவாகக் காட்டும் பொதுவான தமிழ்ப் பெயர் தேர்ந்தெடுக்கப்பட்டது.
- source_word: הַשָּׁלָךְ
  choice: நீர்க்காகம்
  rationale: துல்லியமான இனம் விவாதத்திற்குரியது; மீன் உண்ணும் நீர்ப்பறவை என்ற சாத்தியத்திற்கும் பரவலான ‘cormorant’ அடையாளத்திற்கும் ஏற்ற இயல்பான தமிழ்ச் சொல் ‘நீர்க்காகம்’ ஆகும். மாற்று அடையாளங்கள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளன.
- source_word: וְ / וְאֶת
  choice: -உம் / [நேரடிச் செயப்படுபொருள் உருபு தனியாக மொழிபெயர்க்கப்படவில்லை]
  rationale: וְ என்ற இணைப்புச் சொல் பட்டியலிலுள்ள ஒவ்வொரு பறவையையும் இணைக்கும் ‘-உம்’ என வழங்கப்பட்டது. אֵת என்பதற்குத் தமிழில் தனியான இணைச்சொல் தேவையில்லை.
