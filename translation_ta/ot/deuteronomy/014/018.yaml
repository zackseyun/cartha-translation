translation_notes:
  register: நவீனத் தரத் தமிழில், பட்டியலின் தொடர்ச்சியைப் பேணும் சுருக்கமான மற்றும் கண்ணியமான நடை. அரிய பறவைப்பெயர்களின் உறுதியின்மை முதன்மை உரையைச் சுமையாக்காமல் அடிக்குறிப்புகளில் பாதுகாக்கப்பட்டுள்ளது.
