source:
  edition: WLC
  text: וְ/הַ֣/חֲסִידָ֔ה וְ/הָ/אֲנָפָ֖ה לְ/מִינָ֑/הּ וְ/הַ/דּוּכִיפַ֖ת וְ/הָ/עֲטַלֵּֽף׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/014/018.yaml
  text: the stork[a], and the heron according to its kind, and the hoopoe[c][b], and the bat.
translation:
  language: ta
  text: நாரை[a], கொக்கு வகைகள்[b], கொண்டலாத்தி[c], வௌவால் ஆகியவையும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘கொக்கு.’ இந்த வசனத்திலுள்ள பல பறவைகளின் துல்லியமான அடையாளம் உறுதியில்லை.
    reason: lexical_alternative
  - marker: b
    text: ‘கொக்கு’ என்பதற்குப் பதிலாக ‘அரிவாள்மூக்கன்’ அல்லது ‘உள்ளான்’ என்றும் இருக்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: பழைய ஆங்கில மொழிபெயர்ப்பு மரபுகளில் ‘லாப்விங்’ என்று வழங்கப்பட்டுள்ளது; எபிரெயச் சொல் பெரும்பாலும் கொண்டலாத்தியையே குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחֲסִידָה
  choice: நாரை
  rationale: இந்த எபிரெயப் பறவைப்பெயர் பொதுவாக stork என அடையாளப்படுத்தப்படுகிறது; நவீன தமிழில் அதற்கான வழக்கமான பொதுப்பெயராக ‘நாரை’ பயன்படுத்தப்படுகிறது. துல்லியமான இன அடையாளம் உறுதியற்றதால் அடிக்குறிப்பு சேர்க்கப்பட்டுள்ளது.
- source_word: הָאֲנָפָה
  choice: கொக்கு
  rationale: இச்சொல்லின் துல்லியமான பறவை அடையாளம் உறுதியில்லை. நீர்நிலப் பறவையைக் குறிக்கும் இயல்பான தமிழ்ச் சொல்லாக ‘கொக்கு’ தேர்ந்தெடுக்கப்பட்டது; மாற்று அடையாளங்கள் அடிக்குறிப்பில் தரப்பட்டுள்ளன.
- source_word: לְמִינָהּ
  choice: அதன் இனவகைகள் அனைத்தையும் சேர்ந்த
  rationale: உணவுச் சட்டப் பட்டியல்களில் இச்சொற்றொடர் ஒரே தனி இனத்தை மட்டும் அல்லாமல் அதனுடன் தொடர்புடைய வகைகளையும் உள்ளடக்குகிறது. தமிழ் வாக்கியத்தில் இந்தக் குழுவாக்கப் பொருளைத் தெளிவாக வெளிப்படுத்த இவ்வாறு மொழிபெயர்க்கப்பட்டது.
- source_word: הַדּוּכִיפַת
  choice: கொண்டலாத்தி
  rationale: நவீன ஆய்வில் இச்சொல் hoopoe பறவையையே பெரும்பாலும் குறிக்கிறது. அதற்கான தமிழ்ப் பெயராக ‘கொண்டலாத்தி’ தேர்ந்தெடுக்கப்பட்டது; பழைய மொழிபெயர்ப்பு மரபிலுள்ள மாற்று அடையாளம் அடிக்குறிப்பில் குறிப்பிடப்பட்டுள்ளது.
- source_word: הָעֲטַלֵּף
  choice: வௌவால்
  rationale: எபிரெயச் சொல் தெளிவாக வௌவாலைக் குறிக்கிறது. நவீன உயிரியல் வகைப்பாட்டில் அது பறவை அல்ல என்றாலும், இப்பட்டியலில் பறக்கும் உயிரினங்களுடன் சேர்க்கப்பட்டுள்ளதை மாற்றாமல் நேரடியாக மொழிபெயர்க்கப்பட்டது.
