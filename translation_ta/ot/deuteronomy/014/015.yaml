  yaml_path: translation/ot/deuteronomy/014/015.yaml
  text: the ostrich[a], the hawk, the gull, and the falcon according to its kind[b],
translation:
  language: ta
  text: நெருப்புக்கோழி[a], பருந்து, கடற்காக்கை, வல்லூறும் அதன் இனவகைகள் அனைத்தும்[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொல்லுக்கு சொல், ‘யஅனாவின் மகள்.’ இது நெருப்புக்கோழியைக் குறிக்கும் மரபுத்தொடரான இனப்பெயர். சில பழைய மொழிபெயர்ப்புகள் இதை ஆந்தை வகையாகக் கொண்டுள்ளன.
    reason: cultural_note
  - marker: b
    text: இவ்வசனத்தில் வரும் சில பறவைகளைத் துல்லியமாக அடையாளம் காண்பது உறுதியற்றது. ‘பருந்து’ என்று மொழிபெயர்க்கப்பட்ட எபிரெயச் சொல் ஆந்தையையோ வேறொரு பறவையையோ குறிக்கலாம்; ‘கடற்காக்கை’ என்று மொழிபெயர்க்கப்பட்ட சொல் ‘குயில்’ என்றும், ‘வல்லூறு’ என்று மொழிபெயர்க்கப்பட்ட சொல் ‘பருந்து’ என்றும் மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּת הַיַּעֲנָה
  choice: நெருப்புக்கோழி
  rationale: எபிரெயச் சொற்றொடர் சொல்லுக்கு சொல் ‘யஅனாவின் மகள்’ என இருந்தாலும், விலங்குப் பட்டியலில் இது ஒரு பறவையினப் பெயராக வருகிறது. பாலைவனத்துடன் தொடர்புடைய நெருப்புக்கோழி என்பதே சூழலுக்கும் தற்போதைய அகராதிச் சான்றுகளுக்கும் பொருத்தமானது.
- source_word: הַתַּחְמָס
  choice: பருந்து
  rationale: குறிப்பிடப்படும் பறவையைத் துல்லியமாக அடையாளம் காண இயலவில்லை. இரைகொல்லிப் பறவையைக் குறிக்கும் சாத்தியமான இயல்பான தமிழ்ச் சொல்லாக ‘பருந்து’ தேர்ந்தெடுக்கப்பட்டது; நிச்சயமின்மை அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: הַשָּׁחַף
  choice: கடற்காக்கை
  rationale: இச்சொல் உறுதியாக அடையாளம் காணப்படாதபோதும், நவீன அகராதிகள் பொதுவாகக் கடற்காக்கை அல்லது அதுபோன்ற கடற்பறவையுடன் இதை இணைக்கின்றன.
- source_word: הַנֵּץ
  choice: வல்லூறு
  rationale: இது ஓர் இரைகொல்லிப் பறவையைக் குறிக்கிறது; ‘பருந்து’ என்றும் மொழிபெயர்க்கலாம். இதே வசனத்திலுள்ள תַּחְמָס என்பதிலிருந்து வேறுபடுத்திக் காட்ட ‘வல்லூறு’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: לְמִינֵהוּ
  choice: அதன் எல்லா இனவகைகளும்
  rationale: ஒரு பறவையையும் அதனுடன் தொடர்புடைய பல்வேறு இனவகைகளையும் உள்ளடக்கும் எபிரெய வகைப்பாட்டு வாய்பாட்டை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
