translation_notes:
  register: நவீனத் தரத் தமிழில், பட்டியல் நடையைத் தெளிவாகவும் கண்ணியமாகவும் வைத்துள்ளது. அரிதான எபிரெயப் பறவைப்பெயர்களின் அடையாளம் உறுதியற்றதால், வாசிக்க எளிய பொதுப் பெயர்கள் மூல உரையில் தரப்பட்டு மாற்றுச் சாத்தியங்கள் அடிக்குறிப்பில் குறிப்பிடப்பட்டுள்ளன. ‘அதன்’ என்ற ஒருமை, எபிரெய לְמִינֵהוּ என்பதின் ஒருமை வடிவத்தைப் பாதுகாத்து, உடனடியாக முன்வரும் வல்லூற்றையும் அதன் இனவகைகளையும் குறிக்கிறது.
