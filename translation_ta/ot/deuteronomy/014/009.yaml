reference: Deuteronomy 14:9
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: אֶת זֶה֙ תֹּֽאכְל֔וּ מִ/כֹּ֖ל אֲשֶׁ֣ר בַּ/מָּ֑יִם כֹּ֧ל אֲשֶׁר ל֛/וֹ סְנַפִּ֥יר וְ/קַשְׂקֶ֖שֶׂת תֹּאכֵֽלוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/014/009.yaml
  text: 'You may eat this from all that are in the waters: everything that has fins and scales you may eat.'
translation:
  language: ta
  text: 'நீரில் உள்ள எல்லாவற்றிலிருந்து நீங்கள் உண்ணத்தக்கவை இவை: துடுப்புகளும் செதில்களும் உள்ள அனைத்தையும் நீங்கள் உண்ணலாம்.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: סְנַפִּיר
  choice: துடுப்புகள்
  rationale: நீர்வாழ் உயிரினங்களின் fins என்பதற்கான இயல்பான நவீனத் தமிழ் சொல்; எபிரேய ஒருமை வடிவம் இங்கு வகைப்பண்பைக் குறிப்பதால் தமிழில் பன்மை இயல்பாகிறது.
- source_word: קַשְׂקֶשֶׂת
  choice: செதில்கள்
  rationale: மீன்களின் scales என்பதற்கான பொதுவாகப் புரியும் துல்லியமான தமிழ் சொல்; வகைப்பண்பை இயல்பாகக் காட்டப் பன்மை பயன்படுத்தப்பட்டது.
- source_word: בַּמָּיִם
  choice: நீரில் வாழ்பவற்றில்
  rationale: சொல்லடியாக 'நீரில் உள்ளவற்றில்'; தமிழில் பொருளைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்க 'வாழ்பவற்றில்' என வழங்கப்பட்டது.
- source_word: תֹּאכְלוּ / תֹּאכֵלוּן
  choice: நீங்கள் உண்ணத்தக்கவை / நீங்கள் உண்ணலாம்
  rationale: சூழலில் இது உணவுச் சட்டத்தின் அனுமதியைத் தெரிவிக்கிறது; முதல் கூறின் முன்னறிவிப்பை இயல்பாக்கியும் இரண்டாம் கூறின் அனுமதிப் பொருளைப் பாதுகாத்தும் மொழிபெயர்க்கப்பட்டது.
theological_decisions:
- issue: உணவுச் சட்டத்தின் அனுமதித் தன்மை
  choice: '''உண்ணலாம்'' மற்றும் ''உண்ணத்தக்கவை'' என அனுமதிப் பொருளுடன் வழங்கப்பட்டது.'
  alternative: '''உண்ணுங்கள்'' என்ற கட்டளை வடிவம்'
  rationale: எபிரேய imperfect வடிவங்கள் இச்சட்டச் சூழலில் அனுமதிக்கப்பட்ட வகையை வரையறுக்கின்றன; கட்டாயமாக உண்ணும்படி கட்டளையிடுவதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும், கண்ணியமான நடையில், எபிரேய வசனத்தின் 'இவை ... அனைத்தையும்' என்ற பொதுவிலிருந்து குறிப்புக்குச் செல்லும் அமைப்பு பாதுகாக்கப்பட்டது.
