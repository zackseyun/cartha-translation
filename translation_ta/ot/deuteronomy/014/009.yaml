  to: 'நீரில் உள்ள எல்லாவற்றிலிருந்து நீங்கள் உண்ணத்தக்கவை இவை: துடுப்புகளும் செதில்களும் உள்ள அனைத்தையும் நீங்கள் உண்ணலாம்.'
