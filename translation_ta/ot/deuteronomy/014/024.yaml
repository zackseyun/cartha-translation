base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/014/024.yaml
  text: And if the journey is too long for you[a], so that you are not able to carry it, because the place that Yahweh your God will choose to put his name there is too far from you, when Yahweh your God blesses you,
translation:
  language: ta
  text: உனக்குப் பயணம் மிக நீண்டதாகி, அதை உன்னால் கொண்டு செல்ல முடியாதபடி, உன் கடவுளாகிய யாவே தம் பெயரை அங்கே வைப்பதற்காகத் தேர்ந்தெடுக்கும் இடம் உன்னிடமிருந்து தொலைவில் இருந்தால், உன் கடவுளாகிய யாவே உன்னை ஆசீர்வதிக்கும்போது[a]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உன் கடவுளாகிய யாவே உன்னை ஆசீர்வதிப்பதால்.” இங்குள்ள எபிரேய இணைப்புச்சொல் காலப் பொருளிலும் காரணப் பொருளிலும் புரிந்துகொள்ளப்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  choice: …போனால்
  rationale: முந்தைய கட்டளையைத் தொடரும் நிபந்தனையை இயல்பான தமிழ் வாக்கிய அமைப்பில் இறுதியில் வரும் நிபந்தனை வினையால் வெளிப்படுத்துகிறது.
- source_word: יִרְבֶּה מִמְּךָ הַדֶּרֶךְ
  choice: பயணம் உனக்கு மிக நீண்டதாக இருந்து
  rationale: பாதை ஒருவரால் சமாளிக்க முடியாத அளவுக்கு நீளமாக இருப்பதைக் குறிக்கும் எபிரேய மரபுத்தொடரின் நடைமுறைப் பொருளைத் தெளிவாகத் தருகிறது.
- source_word: לֹא תוּכַל שְׂאֵתוֹ
  choice: உன்னால் அதைக் கொண்டு செல்ல முடியாமல்
  rationale: சூழலில் குறிப்பிடப்படும் பத்தில் ஒரு பங்கை உடலால் எடுத்துச் செல்வதையே שׂא குறிக்கிறது; ‘கொண்டு செல்ல’ என்பது தமிழில் இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: יִרְחַק מִמְּךָ הַמָּקוֹם
  choice: இடம் உன்னிடமிருந்து மிகவும் தொலைவில் இருப்பதால்
  rationale: רחק என்பதன் இடஞ்சார்ந்த பொருளையும் உபாகமத்தில் ‘அந்த இடம்’ பெறும் முக்கியத்துவத்தையும் காக்கிறது.
- source_word: אֲשֶׁר יִבְחַר יְהוָה אֱלֹהֶיךָ
  choice: உன் கடவுளாகிய யாவே … தேர்ந்தெடுக்கும்
  rationale: சட்டச் சூழலில் யாவே பின்னர் குறிக்கவிருக்கும் வழிபாட்டு இடத்தைக் கூறுகிறது; தமிழில் நிகழ்கால வடிவம் எதிர்கால நோக்கையும் இயல்பாகத் தாங்குகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரேய உடன்படிக்கைப் பெயரான יהוה என்பதை பட்டப்பெயராக மாற்றாமல் ஒலிபெயர்க்கிறது.
- source_word: לָשׂוּם שְׁמוֹ שָׁם
  choice: தமது பெயரை அங்கே வைப்பதற்காக
  rationale: உபாகமத்தில் மீண்டும் வரும் உடன்படிக்கைச் சொல்லாட்சியை விளக்கவுரையாக்காமல் நேரடியாகக் காக்கிறது.
- source_word: כִּי יְבָרֶכְךָ יְהוָה אֱלֹהֶיךָ
  choice: உன் கடவுளாகிய யாவே உன்னை ஆசீர்வதிக்கும்போது
  rationale: அதிகமான விளைச்சலை எடுத்துச் செல்வதில் சிக்கல் ஏற்படும் காலச்சூழலை இயல்பாக வெளிப்படுத்துகிறது; כִּי என்பதன் காரணப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலவசனம் உடன்படிக்கைப் பெயரை நேரடியாகப் பயன்படுத்துவதால், அதை பொதுவான பட்டப்பெயரால் மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
- issue: இறுதி כִּי-யின் கால அல்லது காரண உறவு
  choice: ஆசீர்வதிக்கும்போது
  alternative: ஆசீர்வதிப்பதால்
  rationale: சட்டத்தின் ஓட்டத்தில் இறை ஆசீர்வாதத்தால் பெருகிய பொருட்களை எடுத்துச் செல்ல வேண்டிய சூழலைக் காலத் தொடர்பாக வாசிப்பது இயல்பானது; எனினும் காரண வாசிப்பும் எபிரேயத்தில் உண்மையான சாத்தியம் என்பதால் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் மரியாதையும் சட்டவழக்கின் தீவிரமும் காக்கப்பட்டுள்ளன. வசனம் அடுத்த வசனத்தில் தொடரும் நிபந்தனை வாக்கியத்தின் முதல் பகுதி என்பதால் இறுதியில் நீள்கோடும் காற்புள்ளியும் பயன்படுத்தப்பட்டுள்ளன; ஒருமை இரண்டாம் நபர் வடிவம் முழுவதும் காக்கப்பட்டுள்ளது.
