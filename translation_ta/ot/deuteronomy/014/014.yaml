  text: and every raven according to its kind,[a]
translation:
  language: ta
  text: மேலும், காக்கை இனத்தைச் சேர்ந்த அனைத்துப் பறவைகளும்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அண்டங்காக்கை இனத்தைச் சேர்ந்த அனைத்துப் பறவைகளும்.” எபிரெயச் சொல் காக்கை–அண்டங்காக்கை குடும்பத்தைப் பரவலாகக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵת
  choice: உம்
  rationale: וְ என்பது முந்தைய தடைசெய்யப்பட்ட பறவைகளின் பட்டியலுடன் இதையும் இணைக்கிறது. אֵת என்பது நேரடி தமிழ் இணை இல்லாத வேற்றுமை உருபுக் குறி; எனவே தனியாக மொழிபெயர்க்கப்படவில்லை.
- source_word: כָּל
  choice: அனைத்தும்
  rationale: ஒருமை வகைப்பெயருடன் வரும் כָּל, அந்த வகுப்பில் அடங்கிய அனைத்தையும் உள்ளடக்கும் பொருளில் உள்ளது.
- source_word: עֹרֵב
  choice: காக்கை
  rationale: எபிரெயச் சொல் காக்கை–அண்டங்காக்கை குடும்பத்தைப் பரவலாகக் குறிக்கலாம். நவீனத் தமிழில் வகைக்கான இயல்பான பொதுப்பெயராக ‘காக்கை’ தேர்ந்தெடுக்கப்பட்டது; மாற்று அடையாளம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: לְמִינוֹ
  choice: இனத்தைச் சேர்ந்த
  rationale: இந்தச் சொற்றொடர் வகை அல்லது இன அடிப்படையிலான வகைப்பாட்டைக் குறிக்கிறது. ‘இனத்தைச் சேர்ந்த’ என்பது இயல்பான தமிழில் அந்த வகைப்பாட்டு உறவைத் தெளிவாக வெளிப்படுத்துகிறது.
theological_decisions: []
