reference: Deuteronomy 14:10
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וְ/כֹ֨ל אֲשֶׁ֧ר אֵֽין ל֛/וֹ סְנַפִּ֥יר וְ/קַשְׂקֶ֖שֶׂת לֹ֣א תֹאכֵ֑לוּ טָמֵ֥א ה֖וּא לָ/כֶֽם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/014/010.yaml
  text: But anything that does not have fins and scales, you shall not eat; it is unclean for you.
translation:
  language: ta
  text: ஆனால் துடுப்புகளும் செதில்களும் இல்லாத எதையும் நீங்கள் உண்ணக்கூடாது; அது உங்களுக்குத் தீட்டானது.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/כֹל
  choice: ஆனால் ... எதையும்
  rationale: כֹל என்பதன் முழுமையான பொருளை ‘எதையும்’ இயல்பாக வெளிப்படுத்துகிறது; முந்தைய அனுமதிக்கு மாறான தடையை அறிமுகப்படுத்தும் ו என்பதற்கு ‘ஆனால்’ பொருத்தமானது.
- source_word: אֲשֶׁר אֵין לוֹ
  choice: இல்லாத
  rationale: אֵין + לְ அமைப்பு உடைமையின்மையைச் சுட்டுகிறது; தமிழில் தொடர்பெயரெச்சமான ‘இல்லாத’ இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: סְנַפִּיר
  choice: துடுப்புகள்
  rationale: மீனின் இயக்க உறுப்பைக் குறிக்கும் சொல்லுக்கு நவீன பொதுத் தமிழில் ‘துடுப்பு’ தெளிவானது; வகைப்பாட்டு விதியில் பன்மை இயல்பானது.
- source_word: וְ/קַשְׂקֶשֶׂת
  choice: செதில்களும்
  rationale: மீனின் உடலை மூடும் scales என்பதற்கு ‘செதில்கள்’ வழக்கமான துல்லியச் சொல்; இணைப்பும் ‘-உம்’ மூலம் காக்கப்படுகிறது.
- source_word: לֹא תֹאכֵלוּ
  choice: நீங்கள் உண்ணக்கூடாது
  rationale: பன்மை இரண்டாம் நபருக்கான சட்டத் தடையை நவீன, கண்ணியமான தமிழில் நேரடியாக வெளிப்படுத்துகிறது.
- source_word: טָמֵא
  choice: தீட்டானது
  rationale: திருச்சட்டத் தூய்மைச் சூழலில் טָמֵא குறிக்கும் சடங்குசார் அசுத்த நிலையை ‘தீட்டு’ தெளிவாக வேறுபடுத்திக் காட்டுகிறது.
- source_word: הוּא לָכֶם
  choice: அது உங்களுக்குத் தீட்டானது
  rationale: இஸ்ரவேலருடன் தொடர்புடைய அதன் நிலையை לָכֶם குறிக்கிறது; ‘உங்களுக்குத்’ அந்த உறவுசார் வலிமையை இயல்பாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: טָמֵא என்பதன் சடங்குசார் நிலை
  choice: தீட்டானது
  alternative: அசுத்தமானது
  rationale: இச்சூழல் சாதாரண அழுக்கு அல்லது சுகாதாரக் குறையை அல்ல, உடன்படிக்கைச் சட்டத்திலுள்ள தூய்மை வகைப்பாட்டைக் குறிக்கிறது; ‘தீட்டானது’ அந்த வேறுபாட்டைக் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சட்ட உரைக்கு ஏற்ற கண்ணியமான ஆனால் எளிதில் புரியும் நடை. எபிரெய மூலத்தின் முரண்பாட்டு இணைப்பு, முழுமையான தடை, மற்றும் தூய்மை வகைப்பாடு பாதுகாக்கப்பட்டுள்ளன.
