  terminology: “துடுப்புகள்” and “செதில்கள்” are accurate contemporary terms for fins and scales. “தீட்டானது” suitably conveys טָמֵא as a ritual/cultic classification rather than ordinary dirtiness, without adding doctrinal interpretation.
