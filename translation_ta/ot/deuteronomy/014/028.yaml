base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/014/028.yaml
  text: At the end of every three years[b][a], you shall bring out all the tithe of your produce in that year and lay it up within your gates.
translation:
  language: ta
  text: மூன்று ஆண்டுகளின் முடிவில்[a], அந்த ஆண்டில் கிடைத்த உன் விளைச்சலின் பத்தில் ஒரு பங்கு முழுவதையும் வெளியே கொண்டுவந்து, அதை உன் ஊர்களில்[b] சேமித்து வை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஒவ்வொரு மூன்றாம் ஆண்டிலும்.”
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில், “உன் வாசல்களுக்குள்”; இது உன் அதிகார வரம்புக்குட்பட்ட உள்ளூர் ஊர்களையோ குடியிருப்புகளையோ குறிக்கிறது.
    reason: cultural_note
lexical_decisions:
- source_word: מִקְצֵה
  choice: முடிவில்
  rationale: குறிப்பிட்ட காலத்தின் இறுதிப் புள்ளியை இயல்பான தமிழில் குறிக்கிறது; ‘கழித்து’ என்பதைக் காட்டிலும் எபிரெய கால வெளிப்பாட்டை நெருக்கமாகப் பேணுகிறது.
- source_word: שָׁלֹשׁ שָׁנִים
  choice: மூன்று ஆண்டுகளின்
  rationale: சொற்றொடரின் நேரடியான கால அளவைப் பேணுகிறது; சூழலில் இது மீண்டும் நிகழும் மூன்றாண்டு நடைமுறையைக் குறிக்கலாம் என்பதால் மாற்று விளக்கம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: תּוֹצִיא
  choice: வெளியே கொண்டுவந்து
  rationale: יצא என்பதன் ஹிஃபில் வடிவிலுள்ள ‘வெளியே வரச் செய்’ என்ற திடமான பொருளைப் பேணுகிறது.
- source_word: כָּל מַעְשַׂר
  choice: பத்தில் ஒரு பங்கு முழுவதையும்
  rationale: מַעְשֵׂר என்பது பத்தில் ஒரு பங்கு; כָּל அந்தப் பங்கு முழுவதையும் வலியுறுத்துகிறது.
- source_word: תְּבוּאָתְךָ
  choice: உன் விளைச்சலின்
  rationale: நிலத்திலிருந்து கிடைக்கும் வேளாண் உற்பத்தி அல்லது மகசூலைக் குறிக்கும் பரந்த, இயல்பான தமிழ் சொல்.
- source_word: בַּשָּׁנָה הַהִוא
  choice: அந்த ஆண்டில் கிடைத்த
  rationale: பத்தில் ஒரு பங்கு அந்த ஆண்டைச் சேர்ந்த விளைச்சலிலிருந்து எடுக்கப்படுவதைத் தமிழில் தெளிவாக இணைக்கிறது.
- source_word: וְהִנַּחְתָּ
  choice: சேமித்து வை
  rationale: இங்கு பொருளை உள்ளூரில் வைத்து இருப்பில் வைக்கும் சூழலை இயல்பாக வெளிப்படுத்துகிறது; வெறும் ‘கீழே வை’ என்று குறுக்கவில்லை.
- source_word: בִּשְׁעָרֶיךָ
  choice: உன் ஊர்களில்
  rationale: சொல்லுக்குச் சொல் ‘உன் வாசல்களுக்குள்’; எபிரெய வழக்கில் அதிகார வரம்புக்குட்பட்ட உள்ளூர் ஊர்கள் அல்லது குடியிருப்புகளைக் குறிக்கும் என்பதால் பொருளை நேரடியாகத் தமிழாக்குகிறது.
