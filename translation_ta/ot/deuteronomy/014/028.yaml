translation_notes:
  register: நவீன செந்தமிழ் நடையில், பொதுவாசகர்களுக்கு எளிதாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. எபிரெய உரையின் ஒருமை இரண்டாம் நபர் ‘உன்’ எனப் பேணப்பட்டுள்ளது. ‘வாசல்கள்’ என்ற மூல உருவகம் முதன்மை உரையில் அசட்டாக ஒலிக்காதபடி அதன் வழக்குப்பொருளான ‘ஊர்கள்’ பயன்படுத்தப்பட்டு, நேரடி வடிவம் அடிக்குறிப்பில் பதிவு செய்யப்பட்டுள்ளது.
