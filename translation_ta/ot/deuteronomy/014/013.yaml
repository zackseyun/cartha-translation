  text: the glede[a], and the falcon, and the kite according to its kind,
translation:
  language: ta
  text: சிவப்புப் பருந்தையும், வல்லூற்றையும், பருந்தின் எல்லா இனங்களையும்;
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָרָאָה
  choice: சிவப்புப் பருந்து
  rationale: இப்பறவையின் துல்லியமான அடையாளம் உறுதியற்றது; பல நவீன அகராதிகள் இதை red kite என அடையாளப்படுத்துவதால், தமிழில் பொதுவாகப் புரியக்கூடிய ‘சிவப்புப் பருந்து’ பயன்படுத்தப்பட்டது.
- source_word: הָאַיָּה
  choice: வல்லூறு
  rationale: இது ஒரு வேட்டைப் பறவையைக் குறிக்கிறது; அருகிலுள்ள மற்ற இரு எபிரெயப் பெயர்களிலிருந்து வேறுபடுத்தும் இயல்பான தமிழ்ச் சொல்லாக ‘வல்லூறு’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: הַדַּיָּה
  choice: பருந்து
  rationale: இந்த வேட்டைப் பறவையின் துல்லியமான வகை விவாதத்திற்குரியது; kite என்பதற்கான தெளிவான, பொதுவாகப் புரியும் தமிழ்ச் சொல்லாக ‘பருந்து’ பயன்படுத்தப்பட்டது.
- source_word: לְמִינָהּ
  choice: பருந்தின் இனங்கள் அனைத்தையும்
  rationale: எபிரெய மொழியில் பெண்பால் ஒருமை பின்னொட்டு உடனடியாக முன்வரும் הַדַּיָּה என்பதைக் குறிக்கிறது. பட்டியலின் உணவுச் சட்டச் சூழலில், அந்தப் பறவையைச் சேர்ந்த எல்லா வகைகளையும் உள்ளடக்கும் பொருள் இயல்பான தமிழில் வெளிப்படுத்தப்பட்டது.
- source_word: וְאֶת
  choice: ஆகியவற்றையும்
  rationale: வாவ் இணைப்புச்சொல்லும் நேரடி செயப்படுபொருள் குறியீடும் முந்தைய வசனத்தில் தொடங்கிய பட்டியலைத் தொடர்கின்றன; தமிழில் வேற்றுமை உருபும் இணைப்பும் சேர்த்து வெளிப்படுத்தப்பட்டன.
