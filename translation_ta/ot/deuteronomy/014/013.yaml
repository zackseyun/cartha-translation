translation_notes:
  register: நவீன, கண்ணியமான, பொதுமக்களுக்குப் புரியும் தமிழ்நடை பயன்படுத்தப்பட்டது. இது முந்தைய வசனத்திலிருந்து தொடரும் பட்டியல் என்பதால், செயப்படுபொருள் வேற்றுமை உருபான ‘-ஐ/-ஐயும்’ தொடர்ச்சியாக வைக்கப்பட்டுள்ளது. பறவையியல் அடையாளங்களில் உள்ள உண்மையான ஐயம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
