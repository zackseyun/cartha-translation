  text: וְ/כָל בְּהֵמָ֞ה מַפְרֶ֣סֶת פַּרְסָ֗ה וְ/שֹׁסַ֤עַת שֶׁ֨סַע֙ שְׁתֵּ֣י פְרָס֔וֹת מַעֲלַ֥ת גֵּרָ֖ה בַּ/בְּהֵמָ֑ה אֹתָ֖/הּ תֹּאכֵֽלוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/014/006.yaml
  text: You may eat any animal that has a split hoof[a], divided into two hoof-parts, and that chews the cud among the animals.
translation:
  language: ta
  text: விலங்குகளில், குளம்பு பிளவுபட்டு, அதன் பிளவு இரண்டு குளம்புப் பகுதிகளாகப் பிரிந்து, அசைபோடும் எந்த விலங்கையும் நீங்கள் உண்ணலாம்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְכָל
  choice: எந்த ... விலங்கையும்
  rationale: அனுமதியைக் குறிக்கும் தமிழ் வாக்கியத்தில், எபிரேய மொழியின் பகிர்ந்தளிக்கும் ‘ஒவ்வொரு/எல்லா’ என்ற பொருளை ‘எந்த ... விலங்கையும்’ என்பது இயல்பாக வெளிப்படுத்துகிறது.
- source_word: בְּהֵמָה
  choice: விலங்கு
  rationale: இங்கு இது வீட்டுவிலங்குகளை மட்டும் அல்லாமல் உணவுச் சட்டத்தின் கீழ் வரும் நிலவாழ் விலங்குகளைப் பொதுவாகக் குறிக்கிறது.
- source_word: מַפְרֶסֶת פַּרְסָה
  choice: குளம்பு பிளந்து
  rationale: விலங்கின் குளம்பு பிளவுபட்டிருப்பதைச் சுருக்கமாகவும் தெளிவாகவும் காட்டும் இயல்பான தமிழ் சொற்றொடர்.
- source_word: וְשֹׁסַעַת שֶׁסַע שְׁתֵּי פְרָסוֹת
  choice: அந்தப் பிளவு இரண்டு குளம்புப் பகுதிகளாகப் பிரிந்திருந்து
  rationale: பிளவு இரண்டு தெளிவான பகுதிகளை உருவாக்குவதாக எபிரேய உரை வலியுறுத்துவதைப் பாதுகாக்கிறது; ‘குளம்புப் பகுதிகள்’ என்பது தமிழில் பொருளைத் தெளிவாக்குகிறது.
- source_word: מַעֲלַת גֵּרָה
  choice: அசைபோடும்
  rationale: மீண்டும் வாய்க்குக் கொண்டுவரப்பட்ட உணவை மெல்லும் செயலைக் குறிக்கும் நிலையான, சுருக்கமான தமிழ் வழக்கு.
- source_word: בַּבְּהֵמָה
  choice: விலங்குகளில்
  rationale: தகுதிகளைப் பெறும் விலங்கு, விவாதிக்கப்படும் விலங்குகளின் வகுப்பிற்குள் இருப்பதை இயல்பான தமிழில் காட்டுகிறது.
- source_word: אֹתָהּ תֹּאכֵלוּ
  choice: நீங்கள் உண்ணலாம்
  rationale: இந்தச் சட்டச் சூழலில் வினைச்சொல் உண்ண வேண்டுமென்ற கட்டளையைவிட உண்ண அனுமதிக்கப்பட்டதைச் சுட்டுகிறது.
