  yaml_path: translation/ot/deuteronomy/014/022.yaml
  text: You shall surely tithe all the produce of your seed that comes out of the field[a], year by year.
translation:
  language: ta
  text: வயலிலிருந்து ஆண்டுதோறும் கிடைக்கும் உன் விதைப்பின் எல்லா விளைச்சலிலும் பத்தில் ஒரு பங்கைத் தவறாமல் கொடுக்க வேண்டும்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது, இயல்பான சொல்லாட்சியில்: “ஒவ்வோர் ஆண்டும் உன் வயல் தரும் எல்லா விளைச்சலிலும் பத்தில் ஒரு பங்கைக் கொடுக்க வேண்டும்.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַשֵּׂר תְּעַשֵּׂר
  choice: பத்தில் ஒரு பங்கைத் தவறாமல் கொடுக்க வேண்டும்
  rationale: எபிரெயத்தில் ஒரே வேர்ச்சொல்லின் வலியுறுத்தும் இரட்டிப்பு கட்டளையின் உறுதியைக் காட்டுகிறது. தமிழில் இயல்பாகவும் தெளிவாகவும் இருக்க, ‘தவறாமல்’ என்பதால் அந்த வலியுறுத்தல் வெளிப்படுத்தப்படுகிறது; ‘பத்தில் ஒரு பங்கு’ என்பது செயலைப் பொதுவாசகர்களுக்குத் தெளிவாக்குகிறது.
- source_word: תְּבוּאַת
  choice: விளைச்சல்
  rationale: இச்சொல் நிலத்திலிருந்து கிடைக்கும் விவசாய உற்பத்தி அல்லது மகசூலைக் குறிக்கிறது. ‘விளைச்சல்’ என்பது நவீன தமிழில் இயல்பானதும் போதுமான அளவு பரந்ததுமான சொல்.
- source_word: זַרְעֶךָ
  choice: உன் விதைப்பின்
  rationale: மூலத்தில் ‘உன் விதை’ என்று இருந்தாலும், இச்சூழலில் அது விதைக்கப்பட்டதிலிருந்து வரும் பயிர் விளைவைச் சுட்டுகிறது. ‘உன் விதைப்பின் விளைச்சல்’ என்பது மூல உருவகத்தை ஓரளவு காத்து, தமிழில் தவறான புரிதலைத் தவிர்க்கிறது.
- source_word: הַיֹּצֵא הַשָּׂדֶה
  choice: வயலிலிருந்து ... கிடைக்கும்
  rationale: சொல்லாட்சிப்படி ‘வயலிலிருந்து வெளியே வருவது’ என்ற கருத்தை இயல்பான தமிழில் ‘வயலிலிருந்து கிடைக்கும்’ என வழங்குகிறது. வயலே விளைவிக்கிறது என்ற இயக்கமான மாற்றத்தையும் குறிப்பில் தருகிறது.
- source_word: שָׁנָה שָׁנָה
  choice: ஆண்டுதோறும்
  rationale: சொல் இரட்டிப்பு ஒவ்வொரு ஆண்டும் தொடர்ச்சியாகச் செய்யப்பட வேண்டியதைக் குறிக்கிறது. ‘ஆண்டுதோறும்’ அந்தப் பகிர்வுப் பொருளை இயல்பாகத் தருகிறது.
