  text: וְ/זֶ֕ה אֲשֶׁ֥ר לֹֽא תֹאכְל֖וּ מֵ/הֶ֑ם הַ/נֶּ֥שֶׁר וְ/הַ/פֶּ֖רֶס וְ/הָֽ/עָזְנִיָּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/014/012.yaml
  text: 'And these are the ones that you shall not eat from among them: the eagle[a], the bearded vulture, and the black vulture.'
translation:
  language: ta
  text: 'அவற்றில் நீங்கள் உண்ணக்கூடாதவை இவையே: கழுகு[a], தாடிக் கழுகு, கருங்கழுகு.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இந்த வசனத்திலுள்ள எபிரெயப் பறவைப் பெயர்கள் எந்த இனங்களைக் குறிக்கின்றன என்பது உறுதியில்லை. “கழுகு” என்பது பெரிய பிணந்தின்னிக் கழுகைக் குறிக்கக்கூடும்; “தாடிக் கழுகு” என்பது பாரம்பரிய மொழிபெயர்ப்புகளில் எலும்பை உடைக்கும் கழுகு என வழங்கப்பட்டுள்ளது; “கருங்கழுகு” என்பதைச் சிலர் மீன்பிடிக் கழுகு அல்லது கடற்கழுகு என்றும் மொழிபெயர்க்கிறார்கள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזֶה
  choice: இவையே
  rationale: எபிரெயத்தில் ஒருமை வடிவம் இருந்தாலும், தொடர்ந்து வரும் பட்டியலை இயல்பான நவீனத் தமிழில் பன்மையாக அறிமுகப்படுத்துகிறது; வலியுறுத்தும் தன்மையையும் காக்கிறது.
- source_word: אֲשֶׁר לֹא תֹאכְלוּ מֵהֶם
  choice: அவற்றில் நீங்கள் உண்ணக்கூடாதவை
  rationale: לֹא תֹאכְלוּ என்பதன் நேரடியான தடையையும், מֵהֶם என்பதன் ‘அவற்றிலிருந்து/அவற்றுள்’ என்ற பகுதிப்பொருளையும் இயல்பான தமிழில் தருகிறது.
- source_word: הַנֶּשֶׁר
  choice: கழுகு
  rationale: பாரம்பரியமாகவும் பொதுவாகவும் அறியப்பட்ட இணைச்சொல்; இது பெரிய பிணந்தின்னிக் கழுகைக் குறிக்கக்கூடும் என்பதால் ஐயம் அடிக்குறிப்பில் காக்கப்படுகிறது.
- source_word: הַפֶּרֶס
  choice: தாடிக் கழுகு
  rationale: எலும்புகளை உடைத்துத் தின்னும் bearded vulture/lammergeier எனக் கருதப்படும் பறவைக்கான தெளிவான நவீனத் தமிழ்ப் பெயர்.
- source_word: הָעָזְנִיָּה
  choice: கருங்கழுகு
  rationale: இன அடையாளம் உறுதியற்றிருந்தாலும், இங்கு ஏற்றுக்கொள்ளப்பட்ட நவீன அடையாளத்தைச் சுருக்கமாகத் தருகிறது; வேறு முன்மொழிவுகள் அடிக்குறிப்பில் குறிப்பிடப்படுகின்றன.
