translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் dignified நடை பயன்படுத்தப்பட்டுள்ளது. பறவை இனங்களின் உறுதியற்ற அடையாளம் முதன்மை உரையில் மிகையாக விளக்கப்படாமல், [a] அடிக்குறிப்பில் வெளிப்படையாகப் பாதுகாக்கப்பட்டுள்ளது.
