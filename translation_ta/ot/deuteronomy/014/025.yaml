  text: וְ/נָתַתָּ֖ה בַּ/כָּ֑סֶף וְ/צַרְתָּ֤ הַ/כֶּ֨סֶף֙ בְּ/יָ֣דְ/ךָ֔ וְ/הָֽלַכְתָּ֙ אֶל הַ/מָּק֔וֹם אֲשֶׁ֥ר יִבְחַ֛ר יְהוָ֥ה אֱלֹהֶ֖י/ךָ בּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/014/025.yaml
  text: then you shall turn it into silver[a], bind the silver in your hand[b], and go to the place that Yahweh your God will choose.
translation:
  language: ta
  text: அதை வெள்ளிக்கு மாற்றி[a], அந்த வெள்ளியை உன் கையில் கட்டிக்கொண்டு[b], உன் கடவுளாகிய யாவே தேர்ந்தெடுக்கும் இடத்திற்குப் போக வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அதைப் பணமாக மாற்றி.” எபிரெயச் சொல்லின் நேர்ப்பொருள் “வெள்ளி”; இச்சூழலில் அது பணமாகப் பயன்படுகிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அந்த வெள்ளியைப் பொதிந்து உன் கையில் எடுத்துக்கொண்டு”; அதாவது, பயணத்திற்காக அதை உன்னிடம் பாதுகாப்பாக வைத்துக்கொண்டு.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתָּה בַּכָּסֶף
  choice: அதை வெள்ளியாக மாற்றி
  rationale: இங்கு முந்தைய வசனத்தில் குறிப்பிடப்பட்ட பொருளை வெள்ளிக்கு விற்று அல்லது மாற்றிப் பணமாக்குவது பொருள். כֶּסֶף என்பதன் நேர்ப்பொருளான ‘வெள்ளி’ தக்கவைக்கப்பட்டுள்ளது; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: וְצַרְתָּ הַכֶּסֶף בְּיָדְךָ
  choice: அந்த வெள்ளியைப் பொதிந்து உன் கையில் எடுத்துக்கொண்டு
  rationale: צָרַר என்பது கட்டுதல் அல்லது பொதிதல் என்று பொருள்படும். பயணத்திற்காக வெள்ளியைப் பாதுகாப்பாகப் பொதிந்து கையில் எடுத்துச் செல்லும் concrete image இயல்பான தமிழில் தரப்பட்டுள்ளது.
- source_word: בְּיָדְךָ
  choice: உன் கையில் எடுத்துக்கொண்டு
  rationale: ‘உன் கையில்’ என்ற மூலத்தின் concrete expression தக்கவைக்கப்பட்டுள்ளது; தமிழில் செயல் இயல்பாக அமைய ‘எடுத்துக்கொண்டு’ சேர்க்கப்பட்டுள்ளது.
- source_word: וְהָלַכְתָּ אֶל הַמָּקוֹם
  choice: இடத்திற்குப் போக வேண்டும்
  rationale: הלך என்பதன் சாதாரண பொருள் ‘போ’. சட்ட அறிவுறுத்தலின் கட்டாயத் தன்மையை நவீன தமிழில் ‘போக வேண்டும்’ தெளிவாக வெளிப்படுத்துகிறது.
- source_word: אֲשֶׁר יִבְחַר
  choice: தேர்ந்தெடுக்கும்
  rationale: எபிரெய imperfect இங்கு எதிர்நோக்கப்படும் தேர்வைக் குறிக்கிறது. தமிழின் தொடர்பெயர் வடிவம் காலத்தை தேவையின்றி மிகத் துல்லியமாக நிர்ணயிக்காமல் இயல்பாக அந்த எதிர்நோக்கை வெளிப்படுத்துகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: திருப்பெயரான நான்கு மெய்யெழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் பரவலாகப் புரியக்கூடிய ஒலிபெயர்ப்பாகத் தருகிறது.
- source_word: אֱלֹהֶיךָ
  choice: உன் கடவுளாகிய
  rationale: இரண்டாம் நபர் ஒருமை உடைமைத் தொடர்புடன் வரும் உடன்படிக்கைச் சொல்லாட்சியை இயல்பான நவீன தமிழில் தருகிறது.
theological_decisions:
- issue: יְהוָה என்ற திருப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர் அல்லது யெகோவா
  rationale: மூலத்தில் தனிப்பட்ட திருப்பெயர் நேரடியாக உள்ளது. அதை ஒரு பட்டமாக மாற்றாமல் ஒலிபெயர்ப்பது மூல வேறுபாட்டைப் பாதுகாக்கிறது; ‘யாவே’ நவீன தமிழில் இயல்பான வடிவமாகும்.
translation_notes:
  register: நவீன பொதுத்தமிழில், ஒருமை இரண்டாம் நபருக்கான சட்ட அறிவுறுத்தலாக மொழிபெயர்க்கப்பட்டுள்ளது. மூலத்தின் ‘வெள்ளி’ மற்றும் ‘கை’ உருவகங்கள் தக்கவைக்கப்பட்டுள்ளன; தமிழில் கடினமாக ஒலிக்கக்கூடிய கட்டுதல்/பொதிதல் சொல்லாட்சிக்கு அடிக்குறிப்பு வழங்கப்பட்டுள்ளது.
