base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/014/029.yaml
  text: And the Levite shall come[a], because he has no portion or inheritance with you, and the sojourner, the fatherless, and the widow who are within your gates, and they shall eat and be satisfied[b], so that Yahweh your God may bless you in all the work of your hands that you do.
translation:
  language: ta
  text: உன்னோடு பங்கோ பரம்பரை உரிமையோ இல்லாத லேவியரும், உன் ஊர்களில்[b] வாழும் அந்நியக் குடியிருப்பாளரும்[a], தந்தையற்றவரும், விதவையும் வந்து உண்டு திருப்தியடைவார்கள். இதனால், நீ செய்யும் எல்லா வேலையிலும் உன் கடவுளாகிய யாவே உன்னை ஆசீர்வதிப்பார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அந்நியக் குடியிருப்பாளர்’ என்பது இஸ்ரவேலரல்லாதவராக இருந்தும் இஸ்ரவேலரிடையே வாழ்ந்த ஒருவரைக் குறிக்கும்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில் சொல்லர்த்தமாக ‘உன் வாயில்களுக்குள்.’ இது ஒருவருடைய ஊர்கள் அல்லது உள்ளூர் சமூகங்களைக் குறிக்கும் மரபுத்தொடர்.
    reason: cultural_note
lexical_decisions:
- source_word: וּבָא
  choice: வந்து
  rationale: சட்ட அறிவுறுத்தலின் தொடர்ச்சியில் எதிர்பார்க்கப்படும் செயலைக் குறிக்கிறது. பின்னர் வரும் பன்மை எழுவாய்களோடும் வினைகளோடும் இயல்பாக இணைய, தமிழில் ‘வந்து’ என வழங்கப்பட்டது.
- source_word: הַלֵּוִי
  choice: லேவியர்
  rationale: எபிரெயச் சொல் லேவி குலத்தைச் சேர்ந்தவரைக் குறிக்கிறது; ‘ஆசாரியர்’ என்ற கூடுதல் அடையாளத்தை மூலவசனம் கூறாததால் அது சேர்க்கப்படவில்லை.
- source_word: חֵלֶק וְנַחֲלָה
  choice: பங்கோ உரிமைச்சொத்தோ
  rationale: இணைச்சொற்கள் ஒதுக்கப்பட்ட பங்கையும் பரம்பரை நிலவுடைமையையும் குறிக்கின்றன. தமிழில் சட்ட-பொருளாதார நுணுக்கம் தெளிவாகத் தெரிய இவ்விரு சொற்களும் வைக்கப்பட்டன.
- source_word: הַגֵּר
  choice: அந்நியக் குடியிருப்பாளர்
  rationale: இஸ்ரவேலரிடையே நிரந்தரமாக அல்லது நீண்டகாலம் வாழும் இஸ்ரவேலரல்லாத நபரைக் குறிக்கிறது. வெறும் ‘அந்நியர்’ என்பதைவிட குடியிருப்பு நிலையையும் இச்சொல் வெளிப்படுத்துகிறது.
- source_word: הַיָּתוֹם
  choice: தந்தையற்றவர்
  rationale: பண்டைய சமூகத்தில் தந்தையின் பாதுகாப்பை இழந்த நிலையைக் குறிப்பாகக் காட்டும் எபிரெயச் சமூகப் பிரிவை நேரடியாகப் பிரதிபலிக்கிறது.
- source_word: הָאַלְמָנָה
  choice: விதவை
  rationale: மூலச்சொல்லின் சமூகப் பிரிவை நேராகவும் இயல்பாகவும் வழங்குகிறது.
- source_word: אֲשֶׁר בִּשְׁעָרֶיךָ
  choice: உன் ஊர்களில் வாழும்
  rationale: ‘உன் வாயில்களுக்குள்’ என்பது நகரங்களையும் அவற்றின் உள்ளூர் சமூகத்தையும் குறிக்கும் எபிரெய மரபுத்தொடர். நவீன தமிழில் பொருள் தெளிவாக ‘உன் ஊர்களில் வாழும்’ என வழங்கப்பட்டது.
- source_word: וְאָכְלוּ וְשָׂבֵעוּ
  choice: உண்டு நிறைவடையட்டும்
  rationale: சேமிக்கப்பட்ட பத்தில் இருந்து அவர்கள் போதுமான உணவு பெற வேண்டும் என்ற நோக்கத்தை இது தெரிவிக்கிறது. அறிவுறுத்தல் சார்ந்த வலிமையும் உணவுப் போதுமையும் காக்கப்பட்டன.
- source_word: לְמַעַן יְבָרֶכְךָ
  choice: அப்போது ... உன்னை ஆசீர்வதிப்பார்
  rationale: לְמַעַן நோக்கம் அல்லது எதிர்பார்க்கப்படும் விளைவைக் குறிக்கிறது. தமிழில் வாக்கியம் இயல்பாக இருக்க ‘அப்போது’ பயன்படுத்தப்பட்டுள்ளது; இது முற்றிலும் நிபந்தனையற்ற முன்னறிவிப்பாக அல்லாமல் முந்தைய கட்டளையோடு ஆசீர்வாதத்தை இணைக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இது கடவுளின் தனிப்பெயரைக் குறிக்கும் நான்கெழுத்துப் பெயர்; ஒரு பட்டமான ‘ஆண்டவர்’ என்பதற்குப் பதிலாக பெயர் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: בְּכָל מַעֲשֵׂה יָדְךָ אֲשֶׁר תַּעֲשֶׂה
  choice: நீ செய்யும் எல்லா வேலையிலும்
  rationale: ‘உன் கையின் செயல்’ என்ற எபிரெய மரபுத்தொடர் ஒருவரின் உழைப்பையும் செயல்களையும் குறிக்கிறது. அதன் பொருளை இயல்பான நவீன தமிழில் வழங்குகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை வழங்குதல்
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூலவசனம் ஒரு பொதுப் பட்டத்தை அல்ல, இஸ்ரவேலரின் கடவுளுடைய தனிப்பெயரான יהוה என்பதைப் பயன்படுத்துகிறது. எனவே அந்த வேறுபாட்டைத் தக்கவைக்க ‘யாவே’ என ஒலிபெயர்க்கப்பட்டது.
- issue: ஆசீர்வாதத்தின் நோக்கம் அல்லது விளைவு
  choice: முந்தைய அறிவுறுத்தலோடு தொடர்புடைய எதிர்பார்க்கப்படும் ஆசீர்வாதம்
  alternative: எந்த நிபந்தனையும் இல்லாத உறுதியான முன்னறிவிப்பு
  rationale: לְמַעַן தொடரமைப்பு நோக்கம் அல்லது விளைவைக் காட்டுகிறது. ஆகவே ஆசீர்வாதம் முந்தைய பராமரிப்புச் செயலோடு தொடர்புபடுத்தப்பட்டுள்ளது; ஆனால் அதன் துல்லியமான நோக்கம்-விளைவு நுணுக்கம் கடுமையாக ஒரே வகையில் தீர்மானிக்கப்படவில்லை.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குத் தெளிவாகவும் வேதாகமச் சட்டப்பகுதிக்கு ஏற்ற கண்ணியமான நடையிலும் மொழிபெயர்க்கப்பட்டது. சமூகப் பிரிவுகளும் இறைப்பெயரும் மூலமொழிக்கு நெருக்கமாக வைக்கப்பட்டுள்ளன; ‘வாயில்களுக்குள்’ போன்ற மரபுத்தொடர் முதன்மை உரையில் இயல்பாக்கப்பட்டு அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது.
