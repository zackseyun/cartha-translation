source:
  edition: WLC
  text: אַ֣ךְ אֶת זֶ֞ה לֹ֤א תֹֽאכְלוּ֙ מִ/מַּֽעֲלֵ֣י הַ/גֵּרָ֔ה וּ/מִ/מַּפְרִיסֵ֥י הַ/פַּרְסָ֖ה הַ/שְּׁסוּעָ֑ה אֶֽת הַ֠/גָּמָל וְ/אֶת הָ/אַרְנֶ֨בֶת וְ/אֶת הַ/שָּׁפָ֜ן כִּֽי מַעֲלֵ֧ה גֵרָ֣ה הֵ֗מָּה וּ/פַרְסָה֙ לֹ֣א הִפְרִ֔יסוּ טְמֵאִ֥ים הֵ֖ם לָ/כֶֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/014/007.yaml
  text: 'However[a], these you shall not eat from among those that chew the cud or from among those that have a divided hoof: the camel, the hare, and the rock badger; because they chew the cud but do not divide the hoof[b]. They are unclean for you.'
translation:
  language: ta
  text: 'ஆனால், அசைபோடும் விலங்குகளிலும் அல்லது பிளவுபட்ட குளம்புடைய விலங்குகளிலும் இவற்றை நீங்கள் சாப்பிடக் கூடாது: ஒட்டகம், முயல்[a], குழிமுயல்[b] ஆகியவை அசைபோடுகின்றன; ஆனால் அவற்றுக்குப் பிளவுபட்ட குளம்பு இல்லை. அவை உங்களுக்குத் தீட்டானவை.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இங்கு வரும் எபிரெய விலங்குப் பெயர் பெரும்பாலும் காட்டுமுயலைக் குறிக்கிறது; அதன் துல்லியமான உயிரியல் அடையாளம் குறித்து கருத்து வேறுபாடு உள்ளது.
    reason: lexical_alternative
  - marker: b
    text: அதாவது, பாறைகளில் வாழும் ஹைராக்ஸ் என்னும் சிறிய பாலூட்டி. இதை ‘பாறைக் குழிமுயல்’ என்றும் கூறலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: ஆனால்
  rationale: முந்தைய வசனத்தின் பொதுவிதிக்கு விதிவிலக்கை அறிமுகப்படுத்தும் எதிர்மறை/வரையறுக்கும் வலிமையை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: מִמַּעֲלֵי הַגֵּרָה
  choice: அசைபோடும் விலங்குகளிலும்
  rationale: இரை மீட்டு மெல்லும் நடத்தையைக் குறிக்கும் எபிரெயச் சொற்றொடருக்கான வழக்கமான, புரியத்தக்க தமிழ்ச் சொல் ‘அசைபோடு’.
- source_word: וּמִמַּפְרִיסֵי הַפַּרְסָה הַשְּׁסוּעָה
  choice: குளம்பு பிளவுபட்ட விலங்குகளிலும்
  rationale: குளம்பு இரண்டாகப் பிரிந்திருப்பதைத் தெளிவாகவும் இயல்பாகவும் கூறுகிறது; பின்னுள்ள விளக்க வாக்கியத்துடனும் ஒத்திசைகிறது.
- source_word: הַגָּמָל
  choice: ஒட்டகம்
  rationale: விலங்குப் பெயரின் நேரான, பொதுவான தமிழ் இணை.
- source_word: הָאַרְנֶבֶת
  choice: முயல்
  rationale: எபிரெயச் சொல் பெரும்பாலும் hare என அடையாளப்படுத்தப்படுகிறது; தமிழில் பொதுவாகப் புரியும் ‘முயல்’ பயன்படுத்தப்பட்டு, உயிரியல் துல்லியத்தின் ஐயம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: הַשָּׁפָן
  choice: குழிமுயல்
  rationale: பாறைப்பகுதியில் வாழும் hyrax-ஐக் குறிக்கும் பாரம்பரியமான தமிழ் வேதாகமப் பெயரைப் பயன்படுத்துகிறது; துல்லியமான உயிரியல் அடையாளம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: כִּי מַעֲלֵה גֵרָה הֵמָּה
  choice: அவை அசைபோடுகின்றன
  rationale: முன்னர் பயன்படுத்திய சொற்றொடரைச் சீராக மீண்டும் வழங்கி, விலங்குகள் இவ்வகையில் சேர்க்கப்படுவதற்கான காரணத்தை வெளிப்படுத்துகிறது.
- source_word: וּפַרְסָה לֹא הִפְרִיסוּ
  choice: ஆனால் அவற்றின் குளம்பு பிளவுபடவில்லை
  rationale: எபிரெய மூலத்தின் வடிவம் இறந்தகாலமாக இருந்தாலும், விலங்குகளின் நிலையான இயல்பைக் கூறும் தமிழில் இயல்பான பொதுநிலை வடிவம் பயன்படுத்தப்பட்டுள்ளது.
- source_word: טְמֵאִים הֵם לָכֶם
  choice: அவை உங்களுக்குத் தீட்டானவை
  rationale: உணவுச் சட்டச் சூழலில் טָמֵא என்பதற்கான நிலைபெற்ற வேதாகமத் தமிழ் இணை; ‘சடங்குமுறைத் தீட்டு’ என்று விளக்கத்தை மூலத்தில் சேர்க்காமல் விடுகிறது.
theological_decisions:
- issue: உணவுச் சட்டத்தில் தீட்டின் இயல்பு
  choice: தீட்டானவை
  alternative: சடங்குமுறைப்படி தீட்டானவை
  rationale: טָמֵא என்பது உடன்படிக்கைச் சூழலிலான தூய்மை வகையைச் சார்ந்தாலும், மூலவசனம் ‘சடங்குமுறை’ என்று குறிப்பிடவில்லை. ஆகவே பரந்த வேதாகமச் சொல்லே முதன்மை உரையில் வைக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; சட்ட உரைக்கேற்ற கண்ணியமும் தெளிவும் பேணப்பட்டுள்ளன. ‘சாப்பிடக் கூடாது’ என்பது இயல்பான தடை வடிவம். தொழில்நுட்ப விலங்கியல் சொற்கள் முதன்மை உரையைச் சுமையாக்காமல் அடிக்குறிப்புகளில் விளக்கப்பட்டுள்ளன.
