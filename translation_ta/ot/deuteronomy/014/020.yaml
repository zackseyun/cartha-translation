  - marker: a
    text: சொல்லுக்கு நெருக்கமாக, “தீட்டில்லாத எல்லாப் பறவைகளையும் நீங்கள் உண்ணலாம்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל
  choice: எந்தப் ...யையும்
  rationale: குறிப்பிட்ட வகைக்குள் விதிவிலக்கில்லாத அனுமதியை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது; ‘எல்லா’ என்பதும் நேரடியான மாற்றாகும்.
- source_word: עוֹף
  choice: பறவை
  rationale: இந்த உணவுச் சட்டச் சூழலில் பறவைகளே குறிப்பிடப்படுவதால், பொதுவாகப் பறக்கும் உயிரினம் என்பதைக் காட்டிலும் ‘பறவை’ தெளிவானது.
- source_word: טָהוֹר
  choice: தீட்டில்லாத
  rationale: இங்கு சொல்லப்படுவது உடல் தூய்மையையோ ஒழுக்கத் தூய்மையையோ அல்ல, உணவுச் சட்டத்தின் சடங்குசார் வகைப்பாட்டையே; ‘தீட்டில்லாத’ என்பது இதைத் தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: תֹּאכֵלוּ
  choice: நீங்கள் உண்ணலாம்
  rationale: தடைசெய்யப்பட்டவற்றுக்கு மாறாக அனுமதிக்கப்பட்ட உணவைச் சுட்டும் சட்டச் சூழலில், எபிரெய வினையின் அனுமதிப் பொருளை இயல்பாகத் தருகிறது.
