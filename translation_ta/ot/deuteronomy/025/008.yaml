base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/025/008.yaml
  text: Then the elders of his city shall call him and speak to him[a], and if he stands and says, “I do not desire to take her,”
translation:
  language: ta
  text: அப்போது அவனுடைய நகர மூப்பர்கள் அவனை அழைத்து, அவனிடம் பேச வேண்டும். அவன் நின்று, “அவளை எடுத்துக்கொள்ள எனக்கு விருப்பமில்லை[a]” என்று சொன்னால்,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இச்சூழலில், இன்னும் வெளிப்படையாக, “அவளைத் திருமணம் செய்துகொள்ள எனக்கு விருப்பமில்லை” என்றும் மொழிபெயர்க்கலாம். எபிரெய மொழியில் சொல்லுக்குச் சொல் “அவளை எடுத்துக்கொள்ள” என்று உள்ளது; ஒரு பெண்ணைத் திருமணம் செய்துகொள்வதைக் குறிக்கும் வழக்கமான சொல்லாட்சி இது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְקָרְאוּ לוֹ
  choice: அவனை அழைத்து
  rationale: சட்ட நடைமுறையின் தொடர்ச்சியை இயல்பான தமிழில் காட்டுகிறது; இங்கு அழைப்பது மூப்பர்களின் அதிகாரப்பூர்வ நடவடிக்கை.
- source_word: זִקְנֵי עִירוֹ
  choice: அவனுடைய நகரத்தின் மூப்பர்கள்
  rationale: זִקְנֵי என்பது சமூகத்தின் அங்கீகரிக்கப்பட்ட தலைவர்களையும், עִירוֹ என்பது அவனுடைய நகரம் அல்லது ஊரையும் குறிக்கிறது; ‘நகரத்தின் மூப்பர்கள்’ தமிழில் தெளிவான மரியாதைமிக்க நடை.
- source_word: וְדִבְּרוּ אֵלָיו
  choice: அவனிடம் பேச வேண்டும்
  rationale: אֶל உடன் வரும் דבר நேரடியாக ஒருவரிடம் பேசுவதைக் குறிக்கிறது; சட்டக் கட்டளையின் வலிமையை ‘வேண்டும்’ வெளிப்படுத்துகிறது.
- source_word: וְעָמַד
  choice: அவன் தன் முடிவில் உறுதியாக நின்று
  rationale: சொல்லுக்குச் சொல் ‘அவன் நின்று’; இச்சூழலில் மூப்பர்கள் பேசிய பின்னும் தனது மறுப்பில் நிலைத்திருப்பதைச் சுட்டும் சொல்லாட்சியாக இருப்பதால், உருவகத்தையும் சூழ்நிலைப் பொருளையும் இணைத்து வழங்கப்பட்டுள்ளது.
- source_word: לֹא חָפַצְתִּי
  choice: எனக்கு விருப்பமில்லை
  rationale: חפץ விருப்பம், ஆசை அல்லது மனப்பூர்வ சம்மதத்தைக் குறிக்கிறது; நவீன தமிழில் ‘விருப்பமில்லை’ இயல்பாகவும் பொருள் மிகைப்படுத்தாமலும் உள்ளது.
- source_word: לְקַחְתָּהּ
  choice: அவளை ஏற்றுக்கொள்ள
  rationale: לקח என்பதன் அடிப்படைப் பொருள் ‘எடுத்துக்கொள்’; பெண்ணைப் பற்றிய இச்சூழலில் திருமண உறவுக்குள் ஏற்றுக்கொள்வது என்று பொருள். ‘ஏற்றுக்கொள்ள’ எபிரெயச் சொல்லாட்சியின் பரப்பைத் தக்கவைக்கிறது; திருமணப் பொருள் அடிக்குறிப்பில் தெளிவாக்கப்படுகிறது.
