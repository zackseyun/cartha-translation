revisions:
- from: அப்போது அவனுடைய நகரத்தின் மூப்பர்கள் அவனை அழைத்து, அவனிடம் பேச வேண்டும். அவன் தன் முடிவில் உறுதியாக நின்று, “அவளை ஏற்றுக்கொள்ள எனக்கு விருப்பமில்லை[a]” என்று சொன்னால்,
  to: அப்போது அவனுடைய நகர மூப்பர்கள் அவனை அழைத்து, அவனிடம் பேச வேண்டும். அவன் நின்று, “அவளை எடுத்துக்கொள்ள எனக்கு விருப்பமில்லை[a]” என்று சொன்னால்,
  rationale: The revision removes an interpretive expansion of “stands,” retaining the Hebrew expression in a natural Tamil conditional sequence. It also replaces the paraphrastic “ஏற்றுக்கொள்ள” with “எடுத்துக்கொள்ள,” matching the source wording and allowing the footnote to clarify its customary marriage sense. The final comma is retained because the source verse continues into the next procedural clause.
