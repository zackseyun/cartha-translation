translation_notes:
  register: நவீன தரத் தமிழில், சட்ட நடைமுறையின் கண்ணியமான தொனியுடன் மொழிபெயர்க்கப்பட்டுள்ளது. ‘தன் முடிவில் உறுதியாக நின்று’ என்பது எபிரெய உருவகத்தையும் சூழலில் உள்ள தொடர்ந்த மறுப்பையும் காக்கிறது. அடிக்குறிப்பு குறியீடு தொடர்புடைய மறுப்புக் கூற்றுக்குப் பின் இடப்பட்டுள்ளது.
