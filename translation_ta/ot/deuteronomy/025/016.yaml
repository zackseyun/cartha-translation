  yaml_path: translation/ot/deuteronomy/025/016.yaml
  text: For everyone who does these things[a], everyone who does injustice, is an abomination to Yahweh your God.
translation:
  language: ta
  text: ஏனெனில், இவற்றைச் செய்கிற ஒவ்வொருவரும்—அநியாயம்[a] செய்கிற ஒவ்வொருவரும்—உன் கடவுளாகிய யாவேக்கு அருவருப்புக்குரியவராவார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அநியாயம்” என்பதற்கான எபிரெயச் சொல் ‘தவறு,’ ‘அநீதி,’ அல்லது ‘நீதியின்மை’ என்றும் பொருள்படலாம்; இங்கு அது குறிப்பாக மோசடியான வாணிக நடைமுறைகளைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய கட்டளைக்கான காரணத்தை அறிமுகப்படுத்தும் இணைப்புச் சொல்லின் விளக்க வலிமையை இயல்பான தமிழில் காக்கிறது.
- source_word: תוֹעֲבַת
  choice: அருவருப்பானவர்
  rationale: கடவுளின் பார்வையில் வெறுக்கத்தக்கவராக இருப்பதைக் குறிக்கும் வலுவான ஒழுக்க மற்றும் உடன்படிக்கைச் சொல்லாக்கத்தைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய மூலத்தில் உள்ள கடவுளின் தனிப்பெயரை ஒரு பட்டத்தால் மாற்றாமல் ஒலிபெயர்க்கிறது.
- source_word: אֱלֹהֶיךָ
  choice: உன் கடவுளாகிய
  rationale: இரண்டாம் நபர் ஒருமை உரிமை விகுதியையும் உடன்படிக்கை உறவையும் தெளிவான தமிழில் தருகிறது.
- source_word: כָּל עֹשֵׂה אֵלֶּה
  choice: இவற்றைச் செய்கிற ஒவ்வொருவரும்
  rationale: பங்கேற்புவினை அமைப்பின் பொதுவான, பகிர்ந்தளிக்கும் பொருளையும் כָּל என்பதன் ‘ஒவ்வொருவரும்’ என்ற வலிமையையும் காக்கிறது.
- source_word: כֹּל עֹשֵׂה עָוֶל
  choice: அநியாயம் செய்கிற ஒவ்வொருவரும்
  rationale: மூலத்தின் மீளுரைப்பையும் ‘செய்கிற’ என்ற வினையையும் காக்கிறது; இங்கு עָוֶל குறிப்பாக நேர்மையற்ற வாணிகத்தைக் குறித்தாலும், அதன் பரந்த ‘அநியாயம்’ என்ற பொருளைச் சுருக்காமல் விடுகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூல உரை இறைவனின் தனிப்பெயரை நேரடியாகப் பயன்படுத்துவதால், அதை ஒரு பட்டமாக மாற்றாமல் தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளது.
- issue: תוֹעֲבַת என்பதன் இலக்கண மற்றும் ஒழுக்க வலிமை
  choice: யாவேக்கு அருவருப்பானவர்
  alternative: யாவே வெறுக்கிறார்
  rationale: ‘வெறுக்கிறார்’ என வினையாக மாற்றாமல், மூலத்தின் பெயர்ச்சொல் சார்ந்த கூறையும் கடுமையான தெய்வீக மதிப்பீட்டையும் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியும் அதேவேளையில் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. எபிரெயத்தின் இருமுறை வரும் ‘ஒவ்வொருவரும் … செய்கிற’ என்ற அமைப்பு வலியுறுத்தலுக்காக நீள்கோடுகளுடன் காக்கப்பட்டுள்ளது; ஒருமை ‘உன்’ என்பதும் பாதுகாக்கப்பட்டுள்ளது.
