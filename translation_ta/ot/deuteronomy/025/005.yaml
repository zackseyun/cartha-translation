  yaml_path: translation/ot/deuteronomy/025/005.yaml
  text: If brothers dwell together[a], and one of them dies and has no son, the wife of the dead man shall not be married outside the family to a stranger[d][c][b]. Her husband's brother shall go in to her and take her as his wife and perform the duty of a brother-in-law to her.
translation:
  language: ta
  text: சகோதரர்கள் ஒன்றாகக் குடியிருக்கும்போது, அவர்களில் ஒருவன் மகன் இல்லாமல் இறந்துவிட்டால், இறந்தவனின் மனைவி குடும்பத்திற்கு வெளியேயுள்ள அந்நியனுக்கு மனைவியாகக் கூடாது.[a] அவளுடைய கணவனின் சகோதரன் அவளுடன் தாம்பத்திய உறவுகொண்டு,[b] அவளைத் தனக்கு மனைவியாக ஏற்றுக்கொண்டு, அவளுக்குக் கணவனின் சகோதரனுக்குரிய கடமையை நிறைவேற்ற வேண்டும்.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் ‘மகன் இல்லாமல்’ என்றே உள்ளது; இதைச் சிலர் அதன் சட்டப் பொருள்படி ‘குழந்தை இல்லாமல்’ என விரிவாகப் புரிந்துகொள்கிறார்கள். ‘அந்நியன்’ என்பது இங்கு வேறு இனத்தவனை அவசியம் குறிக்காமல், இந்தக் குடும்பக் கடமைக்கு வெளியேயுள்ள ஆணைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: சொல்லுக்கு சொல், ‘அவளிடம் செல்ல வேண்டும்’; இது தாம்பத்தியப் பாலுறவைக் குறிக்கும் எபிரெய மறைமொழி.
    reason: lexical_alternative
  - marker: c
    text: இறந்த கணவனின் சகோதரன் விதவையை மணந்து குடும்ப வம்சத்தைத் தொடரச் செய்யும் இந்தக் கடமை பிற்காலத்தில் ‘லெவிரேட் திருமணம்’ என அழைக்கப்பட்டது.
    reason: cultural_note
lexical_decisions:
- source_word: אַחִים יַחְדָּו
  choice: சகோதரர்கள் ஒன்றாகக் குடியிருக்கும்போது
  rationale: אַחִים என்பது இச்சட்டச் சூழலில் ஆண் சகோதரர்களைக் குறிக்கிறது; יַחְדָּו பகிர்ந்த குடியிருப்பு அல்லது நெருங்கிய குடும்ப வாழ்வைச் சுட்டுகிறது. ‘ஒன்றாகக் குடியிருக்கும்போது’ என்பது மூலத்தின் நிபந்தனையை இயல்பான தமிழில் காக்கிறது.
- source_word: וּבֵן אֵין לוֹ
  choice: மகன் இல்லாமல்
  rationale: בֵּן என்பதன் நேரடிப் பொருள் ‘மகன்’; ‘குழந்தை’ என்று பொதுமைப்படுத்தாமல் மூலத்தின் குறிப்பிட்ட சொல்லைத் தக்கவைத்துள்ளது.
- source_word: אֵשֶׁת הַמֵּת
  choice: இறந்தவனின் மனைவி
  rationale: எபிரெயக் கட்டமைப்பை நெருக்கமாகப் பின்பற்றுகிறது; ‘விதவை’ என்பது பொருளில் சரியானதாயினும் மூலத்தில் அந்தச் சொல் இல்லை.
- source_word: הַחוּצָה לְאִישׁ זָר
  choice: குடும்பத்திற்கு வெளியேயுள்ள அந்நியனுக்கு
  rationale: הַחוּצָה என்பதிலுள்ள ‘வெளியே’ என்ற எதிர்மறைத் திசையையும், זָר என்பதிலுள்ள குடும்பக் கடமைக்கு உட்படாத வெளியாளன் என்ற சமூக-சட்டப் பொருளையும் தெளிவாக்குகிறது; இனத்தால் அந்நியன் என்று பொருள் கொள்ளவில்லை.
- source_word: יְבָמָהּ
  choice: அவளுடைய கணவனின் சகோதரன்
  rationale: இந்தச் சட்ட அமைப்பில் இறந்த கணவனின் சகோதரனையே குறிப்பாகக் குறிக்கிறது. ‘மைத்துனன்’ என்பதற்கு தமிழில் பல உறவுப் பொருள்கள் இருக்கக்கூடும் என்பதால் உறவை வெளிப்படையாகச் சொல்கிறது.
- source_word: יָבֹא עָלֶיהָ
  choice: அவளுடன் தாம்பத்திய உறவுகொண்டு
  rationale: சொல்லுக்கு சொல் ‘அவளிடம் செல்லுதல்’ என்ற எபிரெய மறைமொழி இங்கு திருமணப் பாலுறவைக் குறிக்கிறது. நேரடி தமிழாக்கம் தவறாகப் புரியக்கூடும் என்பதால் கண்ணியமான, தெளிவான தமிழ் பயன்படுத்தப்பட்டுள்ளது.
- source_word: וּלְקָחָהּ לוֹ לְאִשָּׁה
  choice: அவளைத் தனக்கு மனைவியாக ஏற்றுக்கொண்டு
  rationale: ‘அவளைத் தனக்கு மனைவியாக எடுத்துக்கொள்ளுதல்’ என்ற மூலப் பொருளை இயல்பான நவீனத் தமிழில் வழங்குகிறது.
- source_word: וְיִבְּמָהּ
  choice: அவளுக்குக் கணவனின் சகோதரனுக்குரிய கடமையை நிறைவேற்ற வேண்டும்
  rationale: சிறப்புச் சட்ட வினைச்சொல்லின் கடமைப் பொருளைத் தொழில்நுட்பச் சொல் இன்றி தெளிவாகக் கூறுகிறது.
theological_decisions:
- issue: ‘மகன் இல்லாமல்’ என்ற நிபந்தனையின் வரம்பு
  choice: மூலத்தில் உள்ள குறிப்பிட்ட ‘மகன்’ என்ற சொல்லை முதன்மை உரையில் தக்கவைத்தல்
  alternative: ‘குழந்தை இல்லாமல்’ என்று பொதுவாக மொழிபெயர்த்தல்
  rationale: எபிரெயம் வெளிப்படையாக בֵּן (‘மகன்’) என்கிறது. சட்டத்தின் பரந்த பயன்பாடு குறித்த விளக்கக் கேள்வியை மொழிபெயர்ப்பே தீர்மானிக்காமல், மூலத்தின் உண்மையான குறிப்பைத் தக்கவைக்கிறது.
- issue: கணவனின் சகோதரன் செய்யும் திருமணக் கடமைக்கான சிறப்புச் சொல்லாக்கம்
  choice: எளிதில் புரியும் உறவு மற்றும் கடமை மொழியைப் பயன்படுத்துதல்
  alternative: ‘லெவிரேட் திருமணம்’ போன்ற தொழில்நுட்பச் சொல்லைப் பயன்படுத்துதல்
  rationale: மூலத்தின் சட்ட வலிமையைப் பாதுகாத்தபடியே சாதாரண தமிழ் வாசகருக்குப் புரியும் வகையில் வழங்குகிறது; பிற்கால தொழில்நுட்பப் பெயரை முதன்மை உரைக்குள் இறக்குமதி செய்யவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழ்; சட்ட உரைக்கேற்ற கண்ணியமும் கட்டாயத் தொனியும் பேணப்பட்டுள்ளன. புரியாத தொழில்நுட்பச் சொற்கள் முதன்மை உரையில் தவிர்க்கப்பட்டு, எபிரெய மறைமொழி கண்ணியமான வெளிப்படையான தமிழில் தரப்பட்டுள்ளது. அனைத்து அடிக்குறிப்பு குறிகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
