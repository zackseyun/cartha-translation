  text: וְ/הָיָ֗ה הַ/בְּכוֹר֙ אֲשֶׁ֣ר תֵּלֵ֔ד יָק֕וּם עַל שֵׁ֥ם אָחִ֖י/ו הַ/מֵּ֑ת וְ/לֹֽא יִמָּחֶ֥ה שְׁמ֖/וֹ מִ/יִּשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/025/006.yaml
  text: And it shall be that the firstborn whom she bears shall rise up in the name of his dead brother[a], so that his name may not be blotted out from Israel.
translation:
  language: ta
  text: அவள் பெற்றெடுக்கும் முதலில் பிறக்கும் மகன், இறந்துபோன சகோதரனின் பெயரைத் தொடர்ந்து நிலைநிறுத்துவான்[a]. இவ்வாறு இறந்துபோன சகோதரனின் பெயர் இஸ்ரவேலிலிருந்து அழிக்கப்படாது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இன்னும் நேரடியாகச் சொன்னால், “இறந்துபோன சகோதரனின் பெயரின்மேல் எழுந்து நிற்பான்.” அதாவது, இஸ்ரவேலில் அந்தச் சகோதரனின் குடும்ப வழியும் நிலையும் தொடரும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבְּכוֹר
  choice: முதற்பேறான மகன்
  rationale: בכור என்பது இங்கு முதலில் பிறக்கும் ஆண் குழந்தையைக் குறிக்கிறது. ‘முதற்பேறான மகன்’ என்பது குடும்ப மற்றும் சட்ட முக்கியத்துவத்தைத் தெளிவாகத் தக்கவைக்கிறது.
- source_word: תֵּלֵד
  choice: அவள் பெற்றெடுக்கும்
  rationale: பெண்பால் ஒருமை வினைச்சொல் விதவையைக் குறிக்கிறது; ‘அவள் பெற்றெடுக்கும்’ என்பது தாயைச் செய்பொருளாகத் தெளிவாகவும் இயல்பாகவும் காட்டுகிறது.
- source_word: יָקוּם עַל שֵׁם
  choice: பெயரைத் தொடர்ந்து நிலைநாட்டுவான்
  rationale: இந்தச் சட்டச் சூழலில் இச்சொற்றொடர் இறந்தவரின் தனிப்பட்ட பெயரை மட்டும் குழந்தைக்குச் சூட்டுவதைக் காட்டிலும், அவரது பெயர், குடும்ப வழி, சமூக நிலை ஆகியவை தொடர்வதைக் குறிக்கிறது. தமிழ் வாசகருக்கு இந்தச் சட்ட-குடும்பப் பொருளை இயல்பாக எடுத்துரைக்க இவ்வாறு மொழிபெயர்க்கப்பட்டுள்ளது; நேரடியான உருவகம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: אָחִיו הַמֵּת
  choice: இறந்துபோன சகோதரன்
  rationale: முந்தைய வசனத்தின் சூழலில் இது விதவையை மணந்தவனுடைய இறந்த சகோதரனைக் குறிக்கிறது. தமிழில் தேவையற்ற விளக்கச் சேர்க்கை இல்லாமல் சூழல் உறவைத் தக்கவைக்கிறது.
- source_word: יִמָּחֶה
  choice: அழிக்கப்படாது
  rationale: מחה என்பதன் நிபால் வடிவம் பெயர் அல்லது நினைவு நீக்கப்படுதல், அழிக்கப்படுதல் என்ற பொருளைக் கொண்டது. ‘அழிக்கப்படாது’ என்பது தமிழில் இயல்பாகவும் வேதாகமச் சட்டத் தொனிக்கு ஏற்றவாறும் உள்ளது.
- source_word: מִיִּשְׂרָאֵל
  choice: இஸ்ரவேலிலிருந்து
  rationale: מן இங்கு இஸ்ரவேல் மக்கள் சமூகத்திலிருந்து நீக்கப்படுதலைக் குறிக்கிறது; ‘இஸ்ரவேலிலிருந்து’ என்பது நேரடியான மொழிபெயர்ப்பு.
theological_decisions:
- issue: יָקוּם עַל שֵׁם என்ற சகோதர முறைத் திருமணச் சட்டச் சொற்றொடரின் பொருள்
  choice: குழந்தை இறந்த சகோதரனின் பெயரையும் குடும்ப வழியையும் தொடர்ந்து நிலைநாட்டுவதாக மொழிபெயர்க்கப்பட்டது.
  alternative: குழந்தைக்கு இறந்த சகோதரனின் அதே தனிப்பட்ட பெயர் சூட்டப்படும் என்று மொழிபெயர்த்தல்.
  rationale: עַל שֵׁם என்ற சொற்றொடர் இச்சட்டச் சூழலில் இறந்தவரின் குடும்ப வழி, உரிமை நிலை, நினைவு ஆகியவை இஸ்ரவேலில் தொடர்வதைச் சுட்டுகிறது. அதே தனிப்பட்ட பெயரைச் சூட்டுதல் என்று மட்டும் கூறுவது அதன் சட்ட-சமூக வலிமையைக் குறைத்துவிடும்.
translation_notes:
  register: நவீன பொதுத்தமிழில், சட்ட உரைக்கு ஏற்ற கண்ணியமான தொனி பயன்படுத்தப்பட்டுள்ளது. ‘பெயரைத் தொடர்ந்து நிலைநாட்டுவான்’ என்பது எளிதில் புரியும்படி பொருளை வெளிப்படுத்துகிறது; எபிரெய உருவகத்தின் நெருக்கமான வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
