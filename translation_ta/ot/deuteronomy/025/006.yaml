revisions:
- from: அவள் பெற்றெடுக்கும் முதற்பேறான மகன், இறந்துபோன சகோதரனின் பெயரைத் தொடர்ந்து நிலைநாட்டுவான்[a]. இவ்வாறு அவனுடைய பெயர் இஸ்ரவேலிலிருந்து அழிக்கப்படாது.
  to: அவள் பெற்றெடுக்கும் முதலில் பிறக்கும் மகன், இறந்துபோன சகோதரனின் பெயரைத் தொடர்ந்து நிலைநிறுத்துவான்[a]. இவ்வாறு இறந்துபோன சகோதரனின் பெயர் இஸ்ரவேலிலிருந்து அழிக்கப்படாது.
