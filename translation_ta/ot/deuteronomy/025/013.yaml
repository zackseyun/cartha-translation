translation_notes:
  register: நவீன நிலையான தமிழில், சட்டத் தடையின் வலிமையை ‘இருக்கக் கூடாது’ எனத் தெளிவாகக் காட்டுகிறது. மூலத்தின் ‘பெரியது—சிறியது’ என்ற எதிரிணை பாதுகாக்கப்பட்டுள்ளது; நேரடியாகக் கூறப்படாத மோசடி நோக்கம் வசனத்திற்குள் சேர்க்கப்படவில்லை.
