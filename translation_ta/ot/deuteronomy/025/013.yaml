base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/025/013.yaml
  text: You shall not have in your bag differing weights[a], a large and a small.
translation:
  language: ta
  text: உன் பையில் பெரியதும் சிறியதுமான வெவ்வேறு எடைக்கற்கள்[a] இருக்கக் கூடாது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மொழியில் சொல்லுக்கு சொல், ‘ஒரு கல்லும் ஒரு கல்லும்’; வணிகத்தில் அளவிடப் பயன்படுத்தப்பட்ட கல் எடைகளை இது குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא יִהְיֶה לְךָ
  choice: உனக்கு … இருக்கக் கூடாது
  rationale: எபிரெய மொழியில் இருப்பை மறுக்கும் இந்தச் சட்டக் கட்டமைப்பு, தமிழில் தடையை இயல்பாகவும் தெளிவாகவும் தெரிவிக்க இவ்வாறு மொழிபெயர்க்கப்படுகிறது.
- source_word: בְּכִיסְךָ
  choice: உன் பையில்
  rationale: כִּיס என்பது பணம் அல்லது எடைக்கற்களை வைத்திருக்கும் பை அல்லது சிறு பையைக் குறிக்கலாம்; வணிகச் சூழலில் பொதுவாகப் புரியும் சொல்லாக ‘பை’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: אֶבֶן וָאָבֶן
  choice: வெவ்வேறு எடைக்கற்கள்
  rationale: சொல்லுக்கு சொல் ‘ஒரு கல்லும் ஒரு கல்லும்’ என்றாலும், இங்கு வணிகத்தில் அளவிடப் பயன்படுத்தப்பட்ட கல் எடைகளைக் குறிக்கும். வேறுபட்ட இரண்டு எடைகள் என்ற கருத்தை இயல்பான தமிழில் இது தெரிவிக்கிறது.
- source_word: גְּדוֹלָה וּקְטַנָּה
  choice: பெரியதும் சிறியதுமான
  rationale: மூலத்தில் உள்ள பெரியது–சிறியது என்ற நேரடியான முரண்பாட்டைப் பாதுகாத்து, அவை எடைக்கற்களை விவரிப்பதைத் தமிழில் தெளிவாக்குகிறது.
