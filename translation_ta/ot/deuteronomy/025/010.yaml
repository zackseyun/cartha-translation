  source_fidelity: 'The Tamil accurately represents the Hebrew naming formula: passive future naming (''அழைக்கப்படும்''), the public sphere (''இஸ்ரவேலில்''), and the ritual shame-title. ''குடும்பம்'' appropriately conveys בֵּית here as a household/family identity rather than merely a physical structure. ''செருப்பு கழற்றப்பட்டவன்'' correctly identifies the man whose sandal was removed without making an unwarranted possessive explicit.'
