language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וְ/נִקְרָ֥א שְׁמ֖/וֹ בְּ/יִשְׂרָאֵ֑ל בֵּ֖ית חֲל֥וּץ הַ/נָּֽעַל׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/025/010.yaml
  text: And his name shall be called in Israel[a], ‘The house of him whose sandal was removed.’
translation:
  language: ta
  text: இஸ்ரவேலில் அவனுடைய பெயர்[a], “செருப்பு கழற்றப்பட்டவனின் குடும்பம்” என்று அழைக்கப்படும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'இன்னும் சொற்சொல்லான மொழிபெயர்ப்பு: “கழற்றப்பட்ட செருப்பின் வீடு.” எபிரெய மொழி, சடங்கினால் ஏற்பட்ட அவமானத்தைக் குறிக்கும் இந்தப் பெயரைச் சுருக்கமான சொற்றொடராக வழங்குகிறது.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנִקְרָא
  choice: அழைக்கப்படும்
  rationale: קרא என்பதன் நிஃபால் வடிவம் இங்கு பெயரிடுதலைக் குறிக்கும் செயப்பாட்டு வடிவமாக உள்ளது; சட்டநடைத் தொனியையும் எதிர்காலப் பொருளையும் தமிழில் இயல்பாகத் தருகிறது.
- source_word: שְׁמוֹ
  choice: அவனுடைய பெயர்
  rationale: மூன்றாம் நபர் ஆண்பால் ஒருமை உடைமைப் பின்னொட்டை நேரடியாகக் காட்டி, பொதுவான பெயர் அல்லது சமூகப் புகழ்பெயர் என்ற கருத்தைத் தக்கவைக்கிறது.
- source_word: בְּיִשְׂרָאֵל
  choice: இஸ்ரவேலில்
  rationale: இந்தப் பெயர் பயன்படுத்தப்படும் சமூக வட்டத்தை בְּ குறிக்கிறது; “இஸ்ரவேலில்” என்பது தமிழில் தெளிவானதும் மரபானதும் ஆகும்.
- source_word: בֵּית
  choice: குடும்பம்
  rationale: இங்கு בֵּית என்பது கட்டடத்தை மட்டும் அல்லாமல் அவனுடைய குடும்பத்தையும் குடும்ப வழியையும் குறிக்கும்; பொதுவாசகருக்கு அந்த சமூகப் பொருளைத் தெளிவாகக் காட்ட “குடும்பம்” தேர்ந்தெடுக்கப்பட்டது.
- source_word: חֲלוּץ הַנָּעַל
  choice: செருப்பு கழற்றப்பட்டவன்
  rationale: חלץ என்பதன் செயப்பாட்டு எச்ச வடிவமும் “செருப்பு” என்ற பெயர்ச்சொல்லும் சேர்ந்து, மறுமணம் சார்ந்த கடமையை மறுத்ததற்கான சடங்கில் செருப்பு அகற்றப்பட்ட மனிதனைக் குறிக்கின்றன. தமிழில் இந்தத் தொடர்பை இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions: []
translation_notes:
  register: நவீனத் தரமான தமிழில், சட்டநடைத் தொனியையும் பொது அவமானத்தைக் குறிக்கும் நிலையான குடும்பப் பெயரின் தன்மையையும் காக்கும் வகையில் மொழிபெயர்க்கப்பட்டது. மேற்கோள் பகுதி ஒரு பட்டப்பெயராகத் தெளிவாக அமைக்கப்பட்டுள்ளது.
