base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/025/003.yaml
  text: He may strike him forty times[a], but no more[b], lest he go on to strike him with many more blows than these and your brother be degraded before your eyes.
translation:
  language: ta
  text: அவனை நாற்பது முறை அடிக்கலாம்[a]; அதற்கு மேல் அடிக்கக் கூடாது. இவற்றைவிட அதிகமான அடிகளால் அவனை மேலும் அடித்தால், உன் சகோதரன் உன் கண்முன் இழிவுபடுத்தப்படுவான்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “நாற்பது அடிகள்” என்றும் மொழிபெயர்க்கலாம். எபிரெய உரை நாற்பது என்ற எண்ணிக்கையைக் குறிப்பிடுகிறது; எதனால் அல்லது துல்லியமாக எந்த முறையில் அடிக்க வேண்டும் என்று இங்கு கூறவில்லை.
    reason: lexical_alternative
  - marker: b
    text: “உன் சகோதரன்” என்பது இங்கு உடன்படிக்கைச் சமூகத்தைச் சேர்ந்த சக உறுப்பினரைக் குறிக்கிறது. தண்டனை பெற்ற பின்னரும் அவனை இழிவானவனாக நடத்தக் கூடாது என்பதற்காகச் சட்டம் தண்டனையின் அளவைக் கட்டுப்படுத்துகிறது.
    reason: cultural_note
lexical_decisions:
- source_word: אַרְבָּעִים יַכֶּנּוּ
  choice: அவனை நாற்பது முறை அடிக்கலாம்
  rationale: நாற்பது என்பது உடல் தண்டனையின் அதிகபட்ச எண்ணிக்கையைக் குறிக்கிறது. எந்தக் கருவியால் அல்லது எந்த வடிவில் அடிக்க வேண்டும் என்று எபிரெய உரை கூறாததால், ‘முறை’ என்பது தேவையற்ற விவரத்தைச் சேர்க்காமல் எண்ணிக்கையைத் தெளிவாகக் காட்டுகிறது. சட்டச் சூழலில் அனுமதிக்கப்பட்ட உச்சவரம்பை ‘அடிக்கலாம்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: לֹא יֹסִיף
  choice: அதற்கு மேல் அடிக்கக் கூடாது
  rationale: יֹסִיף என்பதன் அடிப்படைப் பொருள் ‘கூட்டுதல்’; இங்கு நாற்பது என்ற வரம்பை மீறுவதற்கான நேரடியான தடையாக இருப்பதால் இவ்வாறு மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: פֶּן יֹסִיף לְהַכֹּתוֹ עַל אֵלֶּה מַכָּה רַבָּה
  choice: இதையும் தாண்டி அவனை இன்னும் மிகுதியாக அடித்தால்
  rationale: פֶּן எச்சரிக்கப்படும் விளைவை அறிமுகப்படுத்துகிறது; יסף + infinitive செயலை மேலும் தொடர்வதைக் குறிக்கிறது. மַכָּה רַבָּה இலக்கணத்தில் ஒருமையாக இருந்தாலும் இங்கு அளவுக்கு மீறிய அடித்தலைக் கூட்டாகக் குறிக்கிறது.
- source_word: וְנִקְלָה
  choice: இழிவுபடுத்தப்படுவான்
  rationale: קלה என்ற வேரின் நிஃபால் வடிவம் ஒருவன் தாழ்வாக அல்லது அருவருப்புக்குரியவனாகக் கருதப்படும் நிலைக்குக் கொண்டுவரப்படுவதைச் சுட்டுகிறது. இத்தேர்வு உள்ளார்ந்த அவமான உணர்வை மட்டும் அல்லாமல், தண்டனையால் ஏற்படும் பொதுவான மனிதத் தாழ்வையும் காட்டுகிறது.
- source_word: אָחִיךָ
  choice: உன் சகோதரன்
  rationale: எபிரெயச் சொல்லின் குடும்ப உறவுப் படிமத்தை நேரடியாகத் தக்கவைக்கிறது; உபாகமச் சட்டச் சூழலில் குற்றவாளியும் உடன்படிக்கைச் சமூகத்தைச் சேர்ந்த ஒருவனாகவே தொடர்ந்து கருதப்படுகிறான் என்பதைக் காட்டுகிறது.
- source_word: לְעֵינֶיךָ
  choice: உன் கண்முன்
  rationale: ‘உன் கண்களுக்கு முன்பாக’ என்ற எபிரெயச் சொற்றொடரின் நேரடியான, இயல்பான தமிழ் வடிவம்; இழிவுபடுத்துதல் வெளிப்படையாக நிகழ்வதை வலியுறுத்துகிறது.
theological_decisions:
- issue: சட்டச் சூழலில் உடன்படிக்கைச் சமூக உறவைக் குறிக்கும் אָחִיךָ
  choice: உன் சகோதரன்
  alternative: உன் சக இஸ்ரவேலன்; உன் சமூகத்தைச் சேர்ந்தவன்
  rationale: குற்றம் செய்தவனின் சமூக உறுப்பினர் என்ற நிலையையும் மனித மாண்பையும் தண்டனை அழித்துவிடக் கூடாது என்பது வசனத்தின் நெறிசார் அழுத்தம். குடும்ப உறவுச் சொல்லைத் தக்கவைப்பது இந்த அழுத்தத்தைப் பாதுகாக்கிறது; அதை ஒரு பொதுவான சமூகப் பெயராக மாற்றவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், சட்டத்தின் கட்டுப்பாட்டையும் மனித மாண்பைப் பாதுகாக்கும் அதன் நோக்கத்தையும் தெளிவாகக் காட்டும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய உரையில் குறிப்பிடப்படாத ‘சவுக்கு’ போன்ற கருவிசார் விவரம் சேர்க்கப்படவில்லை; ‘சகோதரன்’ என்ற உடன்படிக்கை உறவுச் சொல் தக்கவைக்கப்பட்டுள்ளது.
