  text: אֲשֶׁ֨ר קָֽרְ/ךָ֜ בַּ/דֶּ֗רֶךְ וַ/יְזַנֵּ֤ב בְּ/ךָ֙ כָּל הַ/נֶּחֱשָׁלִ֣ים אַֽחַרֶ֔י/ךָ וְ/אַתָּ֖ה עָיֵ֣ף וְ/יָגֵ֑עַ וְ/לֹ֥א יָרֵ֖א אֱלֹהִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/025/018.yaml
  text: how he met you on the way and attacked all the stragglers behind you, when you were weary and worn out; and he did not fear God.
translation:
  language: ta
  text: அவன் வழியில் உன்னை எதிர்கொண்டு, நீ களைத்துச் சோர்ந்திருந்தபோது உனக்குப் பின்னால் தளர்ந்து பின்தங்கியிருந்த அனைவரையும் தாக்கினான்; அவன் கடவுளுக்குப் பயப்படவில்லை.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קָרְךָ
  choice: உன்னை எதிர்கொண்டு
  rationale: வழியில் சந்தித்தல் அல்லது எதிர்கொள்ளுதல் என்ற பொருளைச் சூழலுக்கேற்ற இயல்பான தமிழில் தருகிறது; தாக்குதலின் செயல் அடுத்த வினைச்சொல்லில் வெளிப்படுகிறது.
- source_word: וַיְזַנֵּב
  choice: தாக்கினான்
  rationale: அடிப்படை உருவகம் பின்புறத்தை வெட்டுதல் அல்லது பின்தொடர்பவர்களைத் தாக்குதல் என்பதாகும். சூழலில் பின்தங்கியவர்களைத் தாக்கிய செயலைத் தெளிவாகவும், கொன்றான் என்று மிகைப்படுத்தாமலும் தருகிறது.
- source_word: הַנֶּחֱשָׁלִים
  choice: தளர்ந்து பின்தங்கியிருந்த அனைவரையும்
  rationale: சொல் பலவீனமடைந்து பின்னால் தங்கியவர்களைக் குறிக்கிறது; உடல் நிலையும் அணிவகுப்பிலான இடமும் தமிழில் வெளிப்படுகின்றன.
- source_word: עָיֵף וְיָגֵעַ
  choice: களைத்துச் சோர்ந்திருந்தபோது
  rationale: இணையான இரு எபிரெயச் சொற்களின் தீவிரத்தை இயல்பான தமிழ் இரட்டைப் பயன்பாட்டால் காக்கிறது.
- source_word: וְלֹא יָרֵא אֱלֹהִים
  choice: அவன் கடவுளுக்குப் பயப்படவில்லை
  rationale: எபிரெய உரையின் நேரடியான இறையியல் மதிப்பீட்டைத் தெளிவாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: இறுதி வாக்கியத்தின் எழுவாய்
  choice: அவன் கடவுளுக்குப் பயப்படவில்லை
  alternative: நீ கடவுளுக்குப் பயப்படவில்லை
  rationale: அருகிலுள்ள ஆண்பால் ஒருமைச் செய்பவரும் முந்தைய வசனத்தில் குறிப்பிடப்படும் அமாலேக்கும் இயல்பான எழுவாய். இஸ்ரவேலைக் குறிக்கும் இரண்டாம் நபர் ஒருமையிலிருந்து மூன்றாம் நபர் ஒருமைக்கான மாற்றமும் இதை ஆதரிக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியக்கூடிய, மரியாதைமிக்க உரைநடை. எபிரெய வாக்கியத்தின் தொடர்ச்சியையும் தாக்குதலின் தீவிரத்தையும் காக்கிறது; மூலத்தில் வெளிப்படையாக இல்லாத ‘கொன்றான்’ போன்ற முடிவைச் சேர்க்கவில்லை.
