  source_fidelity: 'எபிரெய உரையின் தொடர்ச்சியைத் துல்லியமாகக் காக்கிறது: வழியில் சந்தித்தல், பின்தங்கி பலவீனமடைந்தவர்களைத் தாக்குதல், இஸ்ரவேலரின் களைப்பு மற்றும் சோர்வு, அமாலேக்கருக்குரிய ‘கடவுளுக்குப் பயப்படவில்லை’ என்ற மதிப்பீடு ஆகியவை அனைத்தும் இடம்பெற்றுள்ளன. וַיְזַנֵּב என்பதற்கு ‘தாக்கினான்’ என்பது ஆங்கில POB audit trail-உடனும் ஒத்துப்போகிறது; மூலத்தில் உறுதியாகச் சொல்லப்படாத ‘கொன்றான்’ என்பதைக் கூடுதலாகச் சேர்ப்பதில்லை.'
