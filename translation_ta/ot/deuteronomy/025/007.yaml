  text: וְ/אִם לֹ֤א יַחְפֹּץ֙ הָ/אִ֔ישׁ לָ/קַ֖חַת אֶת יְבִמְתּ֑/וֹ וְ/עָלְתָה֩ יְבִמְתּ֨/וֹ הַ/שַּׁ֜עְרָ/ה אֶל הַ/זְּקֵנִ֗ים וְ/אָֽמְרָה֙ מֵאֵ֨ין יְבָמִ֜/י לְ/הָקִ֨ים לְ/אָחִ֥י/ו שֵׁם֙ בְּ/יִשְׂרָאֵ֔ל לֹ֥א אָבָ֖ה יַבְּמִֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/025/007.yaml
  text: But if the man does not want to take his brother’s widow[a], then his brother’s widow shall go up to the gate, to the elders, and say, ‘My brother-in-law refuses to raise up a name for his brother in Israel[b]; he is not willing to perform the duty of a brother-in-law to me.’
translation:
  language: ta
  text: ஆனால் அந்த மனிதன் தன் சகோதரனின் விதவையைத் திருமணம் செய்துகொள்ள விரும்பாவிட்டால், அவள் நகரவாசலில் இருக்கும் மூப்பர்களிடம் சென்று, “என் மைத்துனன் இஸ்ரயேலில் தன் சகோதரனின் பெயர் நிலைத்திருக்கச் செய்ய மறுக்கிறான்[a]; மைத்துனனுக்குரிய கடமையை எனக்குச் செய்ய அவனுக்கு விருப்பமில்லை[b]” என்று சொல்ல வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: நேர்ச்சொல்லாக, “தன் சகோதரனுக்காக இஸ்ரயேலில் ஒரு பெயரை எழுப்ப மறுக்கிறான்.” இறந்த சகோதரனின் குடும்ப வழியும் சமூகப் பெயரும் தொடரச் செய்வதை இந்த மரபுத்தொடர் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: “மைத்துனனுக்குரிய கடமையைச் செய்” என்பதற்கு எபிரெயத்தில் ஒரு தொழில்நுட்ப வினைச்சொல் உள்ளது. அது இறந்த சகோதரனின் விதவையை மணந்து அந்தச் சகோதரனின் குடும்ப வழியைத் தொடரும் கடமையை நிறைவேற்றுவதைக் குறிக்கிறது.
    reason: cultural_note
lexical_decisions:
- source_word: יַחְפֹּץ
  choice: விரும்பாவிட்டால்
  rationale: חפץ என்பது விருப்பம் அல்லது மனப்பூர்வமான சம்மதத்தைக் குறிக்கிறது; சட்டச் சூழலில் ‘விரும்பாவிட்டால்’ என்பது இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: לָקַחַת
  choice: திருமணம் செய்துகொள்ள
  rationale: அடிப்படைப் பொருள் ‘எடுத்துக்கொள்ளுதல்’ என்றாலும், இங்கு இறந்த சகோதரனின் விதவையை மணப்பதையே சூழல் தெளிவாகக் குறிக்கிறது. சொற்பொருளான ‘எடுத்துக்கொள்ள’ என்பது நவீன தமிழில் தவறாகப் புரியக்கூடும்.
- source_word: יְבִמְתּוֹ
  choice: தன் சகோதரனின் விதவை
  rationale: இந்தச் சொல் பொதுவாக எந்த மைத்துனியையும் அல்ல, இறந்த சகோதரனின் விதவையை இந்தச் சட்டச் சூழலில் குறிப்பாகக் குறிக்கிறது.
- source_word: וְעָלְתָה ... הַשַּׁעְרָה
  choice: நகரவாசலில் இருக்கும் மூப்பர்களிடம் சென்று
  rationale: ‘வாசலுக்கு மேலே செல்லுதல்’ என்ற எபிரெய வடிவம் உள்ளூர் நீதி விசாரணை நடைபெறும் இடத்திற்குச் செல்வதைக் குறிக்கிறது. தமிழில் இடமும் அதிகாரிகளும் இயல்பாக இணைக்கப்பட்டுள்ளன.
- source_word: הַזְּקֵנִים
  choice: மூப்பர்கள்
  rationale: நகரவாசலில் தீர்ப்பு வழங்கும் அங்கீகரிக்கப்பட்ட உள்ளூர் தலைவர்களைக் குறிக்கும் வழக்கமான வேதாகமச் சொல்.
- source_word: מֵאֵין
  choice: மறுக்கிறான்
  rationale: இது வெறும் விருப்பமின்மையைவிட வெளிப்படையான மறுப்பைக் குறிக்கிறது; சட்டரீதியான புகாரின் வலிமையை ‘மறுக்கிறான்’ காக்கிறது.
- source_word: לְהָקִים ... שֵׁם
  choice: பெயர் நிலைத்திருக்கச் செய்ய
  rationale: இறந்த சகோதரனின் குடும்ப வழியும் சமூக நிலையும் தொடரச் செய்வதைக் குறிக்கும் எபிரெய மரபுத்தொடரை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: בְּיִשְׂרָאֵל
  choice: இஸ்ரயேலில்
  rationale: இடத்தையும் உடன்படிக்கைச் சமூகத்தையும் நேரடியாகக் குறிக்கும் சொற்றொடர்.
- source_word: לֹא אָבָה
  choice: அவனுக்கு விருப்பமில்லை
  rationale: אבה சம்மதிக்க அல்லது மனம்கொள்ள விரும்புதலைக் குறிக்கிறது. முந்தைய ‘மறுக்கிறான்’ என்பதிலிருந்து வேறுபடுத்தி, மூலத்தின் இரு வினைச்சொல் அமைப்பையும் காக்கிறது.
- source_word: יַבְּמִי
  choice: மைத்துனனுக்குரிய கடமையை எனக்குச் செய்ய
  rationale: יבם என்பது இறந்த சகோதரனின் விதவையை மணந்து சகோதரனின் குடும்ப வழியைத் தொடரும் கடமையை நிறைவேற்றுவதற்கான தொழில்நுட்ப வினைச்சொல். தமிழில் தனி இணையான வினைச்சொல் இல்லாததால் பொருள் வெளிப்படையாக மொழிபெயர்க்கப்பட்டுள்ளது.
theological_decisions:
- issue: இறந்த சகோதரனின் விதவையை மணக்கும் கடமைக்கான சொற்பயன்பாடு
  choice: ‘சகோதரனின் விதவை’ என்றும் ‘மைத்துனனுக்குரிய கடமை’ என்றும் தெளிவான உறவு மற்றும் சட்ட மொழியைப் பயன்படுத்துதல்
  alternative: ‘லெவிரேட் திருமணம்’ போன்ற கல்விசார் சொல்லைப் பயன்படுத்துதல் அல்லது ‘மைத்துனி’ என்று மட்டும் மொழிபெயர்த்தல்
  rationale: மூலத்தின் குறிப்பிட்ட குடும்ப உறவையும் சட்டக் கடமையையும் சாதாரண வாசகர்கள் புரிந்துகொள்ளும் வகையில் இது தெரிவிக்கிறது; அதே நேரத்தில் எந்தச் சமயப்பிரிவு சார்ந்த விளக்கத்தையும் சேர்ப்பதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், சட்ட உரைக்கு ஏற்ற கண்ணியமான ஆனால் எளிதில் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. ‘திருமணம் செய்துகொள்ள’ என்பது சூழலில் לָקַחַת என்பதன் நோக்கத்தைத் தெளிவாக்குகிறது; ‘பெயர் நிலைத்திருக்கச் செய்ய’ என்பது எபிரெய மரபுத்தொடரின் கருத்தை இயல்பாகக் காக்கிறது. அடிக்குறிப்பு குறியீடுகள் அவை விளக்கும் சொற்றொடர்களோடு பொருத்தமாக வைக்கப்பட்டுள்ளன.
