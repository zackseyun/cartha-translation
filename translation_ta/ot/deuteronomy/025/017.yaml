  source_fidelity: மூல எபிரேயத்தின் கட்டளைத் தொனி, அமலேக்கு இஸ்ரவேலுக்குச் செய்த செயலை நினைவுகூர வேண்டிய பொருள், பயணச் சூழல், எகிப்திலிருந்து புறப்பட்ட காலக் குறிப்பு ஆகியவை துல்லியமாகப் பிரதிபலிக்கப்படுகின்றன. எபிரேய ஒருமை கட்டளை கூட்டாகிய இஸ்ரவேலை நோக்குவதால் தமிழில் மரியாதைப் பன்மையாக அமைத்தல் பொருத்தமானது.
