translation_notes:
  register: நவீனத் தரத் தமிழ்; பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. எபிரேய ஒருமை கட்டளை, கூட்டாகிய இஸ்ரவேலை நோக்குவதால் தமிழில் ‘நீங்கள்/கொள்ளுங்கள்’ என இயல்பாக்கப்பட்டுள்ளது. வசனத்தின் இறுதியில் அடுத்த வசனத்துக்குத் தொடரும் நிறுத்தக்குறியைச் சேர்க்காமல் முழுப்புள்ளி பயன்படுத்தப்பட்டுள்ளது.
