  terminology: “அமலேக்கு” என்பது நிலையான தமிழ் ஒலிபெயர்ப்பாகப் பயன்படுத்தத்தக்கது. “நினைவில் கொள்ளுங்கள்” கட்டளையின் பொருளைச் சரியாகக் கொடுக்கிறது. “உங்களுக்குச் செய்ததை” மூலத்தின் சுருக்கமான சொல்லமைப்பைப் பேணுகிறது; பகைமைச் சூழலை இவ்வசனத்திலேயே தேவையின்றி வெளிப்படையாகச் சேர்ப்பதில்லை.
