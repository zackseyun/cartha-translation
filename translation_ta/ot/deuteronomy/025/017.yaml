source:
  edition: WLC
  text: זָכ֕וֹר אֵ֛ת אֲשֶׁר עָשָׂ֥ה לְ/ךָ֖ עֲמָלֵ֑ק בַּ/דֶּ֖רֶךְ בְּ/צֵאתְ/כֶ֥ם מִ/מִּצְרָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/025/017.yaml
  text: Remember what Amalek did to you on the way when you came out from Egypt:[a]
translation:
  language: ta
  text: நீங்கள் எகிப்திலிருந்து புறப்பட்டபோது, வழியில் அமலேக்கு உங்களுக்குச் செய்ததை நினைவில் கொள்ளுங்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: זָכוֹר
  choice: நினைவில் கொள்ளுங்கள்
  rationale: זכר என்பதன் Qal கட்டளை வடிவம் ஒருமையில் இருந்தாலும், இஸ்ரவேல் மக்களை ஒட்டுமொத்தமாக முன்னிலைப்படுத்துகிறது. நவீனத் தமிழில் மரியாதைப் பன்மை வடிவம் இயல்பாகவும் கட்டளையின் வலிமையைத் தக்கவைத்தும் உள்ளது.
- source_word: אֵת אֲשֶׁר
  choice: செய்ததை
  rationale: நேரடிப் பொருள் குறியீடும் தொடர்புச் சொல்லும் நினைவுகூர வேண்டிய நிகழ்வை அறிமுகப்படுத்துகின்றன; தமிழில் வினையெச்சப் பெயராக்கமான ‘செய்ததை’ இயல்பானது.
- source_word: עָשָׂה לְךָ
  choice: உங்களுக்குச் செய்ததை
  rationale: עשה + ל இங்கு இஸ்ரவேலை நோக்கிச் செய்யப்பட்ட பகைமையான செயலைக் குறிக்கிறது. ‘உங்களுக்குச் செய்ததை’ சூழலால் எதிர்மறை பொருளைத் தெளிவாக ஏந்துகிறது; ‘உங்களுக்கு எதிராக’ என்பதைச் சேர்த்து மூலத்தின் சொற்றொடரை மிகுதியாக விளக்கவில்லை.
- source_word: עֲמָלֵק
  choice: அமலேக்கு
  rationale: எபிரேயப் பெயர் தமிழில் ஒலிபெயர்க்கப்பட்டது; எழுவாய் வேற்றுமையில் இறுதி ‘-க்கு’ பெயரின் ஒலிவடிவத்தின் பகுதியாக உள்ளது.
- source_word: בַּדֶּרֶךְ
  choice: வழியில்
  rationale: ב + דרך பயணத்தின் வழியையோ பயணச் சூழலையோ குறிக்கிறது; ‘வழியில்’ சுருக்கமாகவும் இயல்பாகவும் உள்ளது.
- source_word: בְּצֵאתְכֶם
  choice: நீங்கள் ... புறப்பட்டபோது
  rationale: ב உடன் வரும் יצא வினையின் infinitive construct காலச் சூழலைக் குறிக்கிறது. ‘புறப்பட்டபோது’ எகிப்தைவிட்டு வெளியேறிய நிகழ்வை நவீனத் தமிழில் இயல்பாகத் தெரிவிக்கிறது.
- source_word: מִמִּצְרַיִם
  choice: எகிப்திலிருந்து
  rationale: מן மூல இடத்தைக் குறிக்கிறது. ‘எகிப்திலிருந்து’ தமிழில் தெளிவான, நேரடியான வடிவம்; வெளியேறும் கருத்து ‘புறப்பட்டபோது’ என்பதில் ஏற்கெனவே வெளிப்படுகிறது.
