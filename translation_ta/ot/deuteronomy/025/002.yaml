  source_fidelity: மூல எபிரேயத்தின் சட்டநடை மற்றும் பொருள் நன்றாகக் காக்கப்பட்டுள்ளன. בִּן־הַכּוֹת என்பதன் சட்டமரபுத் தொடருக்கு “அடிக்கப்படத் தகுதியானவன்” இயல்பானதும் துல்லியமானதும். הִפִּילוֹ மற்றும் הִכָּהוּ ஆகியவை நீதிபதியின் உத்தரவு/மேற்பார்வைச் செயலைக் காட்டும் வகையில் “படுக்கச் செய்து ... அடிக்கச் செய்ய வேண்டும்” எனச் சரியாகத் தரப்பட்டுள்ளன. לְפָנָיו-வின் குறிப்பும் “தன் முன்னிலையில்” என்பதில் தெளிவாக உள்ளது. “குற்றத்திற்குத் தக்க எண்ணிக்கையில்” என்பது விகிதாசாரத்தையும் எண்ணப்பட்ட அடிகளையும் காக்கிறது.
