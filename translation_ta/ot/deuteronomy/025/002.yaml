  text: then[a], if the wicked man deserves to be beaten, the judge shall make him lie down and have him beaten before him, according to his wickedness, by number.
translation:
  language: ta
  text: அந்தத் தீயவன் அடிக்கப்படத் தகுதியானவன் என்றால், நீதிபதி அவனைக் கீழே படுக்கச் செய்து, அவனுடைய குற்றத்திற்குத் தக்க எண்ணிக்கையில்[a] தன் முன்னிலையில் அவனை அடிக்கச் செய்ய வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “குறிப்பிட்ட எண்ணிக்கையின்படி”; அதாவது, குற்றத்தின் அளவுக்கு ஏற்றவாறு எண்ணிக் கொடுக்கப்படும் அடிகள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּן הַכּוֹת
  choice: அடிக்கப்படத் தகுதியானவன்
  rationale: ‘அடிக்கு உரியவன்’ என்ற எபிரேய சட்ட மரபுத்தொடரின் பொருளை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: הָרָשָׁע
  choice: அந்தத் தீயவன்
  rationale: ஆண்பால் ஒருமையையும், நீதித்துறைச் சூழலில் உள்ள ஒழுக்க-சட்டக் குற்றத்தன்மையையும் காக்கிறது.
- source_word: וְהִפִּילוֹ
  choice: அவனைக் கீழே படுக்கச் செய்து
  rationale: נפל என்பதன் ஹிஃபில் வடிவிலுள்ள ‘கீழே கிடக்கச் செய்தல்’ என்ற செயப்படுத்தும் பொருளைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: הַשֹּׁפֵט
  choice: நீதிபதி
  rationale: நீதித்துறை அதிகாரிக்கான இயல்பான நவீனத் தமிழ்ச் சொல்.
- source_word: וְהִכָּהוּ
  choice: அவனை அடிக்கச் செய்ய வேண்டும்
  rationale: சொல்லின் ‘அடித்தல்’ என்ற பொருளையும், நீதிபதி தண்டனையை நிறைவேற்றச் செய்கிற நடைமுறைப் பங்கையும் தமிழில் இயல்பாகக் காட்டுகிறது.
- source_word: לְפָנָיו
  choice: தன் முன்னிலையில்
  rationale: தண்டனை நீதிபதியின் கண்காணிப்பில், அவருக்கு முன்பாக நடைபெறுவதைத் தெரிவிக்கிறது; பிரதிபெயரின் தொடர்பையும் தெளிவாக்குகிறது.
- source_word: כְּדֵי רִשְׁעָתוֹ
  choice: அவனுடைய குற்றத்திற்குத் தக்க
  rationale: רִשְׁעָה என்பதன் சட்டச் சூழலிலான ‘குற்றம்/தீச்செயல்’ பொருளையும், தண்டனையின் விகிதாசாரத்தையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: בְּמִסְפָּר
  choice: எண்ணிக்கையில்
  rationale: அடிகள் எண்ணப்பட்டு வரையறுக்கப்பட வேண்டும் என்ற சுருக்கமான எபிரேய சொற்றொடரைப் பாதுகாக்கிறது; அதன் தொடர்பு அடிக்குறிப்பில் தெளிவாக்கப்படுகிறது.
