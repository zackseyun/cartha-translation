  text: you shall cut off her hand[b][a]; your eye shall not pity.
translation:
  language: ta
  text: நீ அவளுடைய கையை[a] வெட்டிவிட வேண்டும்; உன் கண் அவள்மேல் இரக்கம் காட்டக்கூடாது.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அவளுடைய உள்ளங்கையை.’ எபிரெயச் சொல் குறிப்பாக உள்ளங்கையைக் குறிக்கவும் முடியும்; இச்சூழலில் ‘கை’ என்பது தமிழில் இயல்பான வாசிப்பு.
    reason: lexical_alternative
  - marker: b
    text: சொல்லுக்கு நெருக்கமாக, ‘உன் கண் இரக்கம் காட்டக்கூடாது.’ கண் இரக்கம் காட்டாதிருப்பதாகக் கூறுவது, இரக்கத்தினால் விட்டுவைக்க வேண்டாம் என்பதைத் தெரிவிக்கும் எபிரெய மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְקַצֹּתָה
  choice: வெட்டிவிட வேண்டும்
  rationale: קצץ என்பதன் பொருள் வெட்டித் துண்டித்தல் அல்லது வெட்டி அகற்றுதல். சட்டக் கட்டளையின் நேரடியான தன்மையையும் தண்டனையின் கடுமையையும் மென்மைப்படுத்தாமல், இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: אֶת
  choice: '[நேரடி செயப்படுபொருள் குறியீடு; தனியாக மொழிபெயர்க்கப்படவில்லை]'
  rationale: இந்த எபிரெய நேரடி செயப்படுபொருள் குறியீட்டிற்குத் தமிழில் தனியான சொல் இணை இல்லை.
- source_word: כַּפָּהּ
  choice: அவளுடைய கையை
  rationale: כַּף என்பது உள்ளங்கை அல்லது கை எனப் பொருள்படலாம். வெட்டிவிடுதல் என்ற வினையுடன் இந்தச் சட்டச் சூழலில் ‘கை’ என்பது இயல்பான தமிழ்; ‘உள்ளங்கை’ என்ற சாத்தியம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: לֹא
  choice: கூடாது
  rationale: எதிர்மறை சட்டக் கட்டளையை இயல்பான தமிழில் தெளிவாகத் தெரிவிக்கிறது.
- source_word: תָחוֹס
  choice: இரக்கம் காட்ட
  rationale: חוס என்பது இரங்குதல், இரக்கம் காட்டுதல் அல்லது விட்டுவைத்தல் எனப் பொருள்படும். ‘இரக்கம் காட்ட’ என்பது கண் பற்றிய எபிரெய மரபுத்தொடருடன் பொருந்தி அதன் கருணை சார்ந்த பொருளைப் பாதுகாக்கிறது.
- source_word: עֵינֶךָ
  choice: உன் கண்
  rationale: எபிரெய உரை நேரடியாக ‘உன் கண்’ என்கிறது. அதை ‘நீ’ என்று தட்டையாக்காமல் வைத்திருப்பது உபாகமத்தில் மீண்டும் வரும் உயிரோட்டமான சட்ட மரபுத்தொடரைப் பாதுகாக்கிறது.
theological_decisions:
- issue: தண்டனைச் சூத்திரத்தின் நேரடித்தன்மை
  choice: ‘அவளுடைய கையை வெட்டிவிட வேண்டும்’ என்பதையும் ‘உன் கண் ... இரக்கம் காட்டக்கூடாது’ என்ற மரபுத்தொடரையும் நேரடியாகத் தக்கவைத்தல்
  alternative: ‘அவளுடைய கையை வெட்டியபின் அவளுக்கு இரக்கம் காட்டாதே’ என்று கருத்தை மட்டும் இயல்பாக்குதல்
  rationale: இது இஸ்ரவேலின் சட்டத் தொகுப்பிலுள்ள நேரடியான கட்டளை. கருத்தை மட்டும் கூறும் மொழிபெயர்ப்பு மூலத்தின் கடுமையையும் ‘கண்’ என்ற சட்ட மரபுத்தொடரையும் மறைத்துவிடும். ஆகவே உரையின் பதற்றமும் நேரடித்தன்மையும் மென்மைப்படுத்தப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், சட்டக் கட்டளைக்குரிய கண்ணியமானதும் நேரடியானதுமான நடை பயன்படுத்தப்பட்டுள்ளது. ஒருமை இரண்டாம் நபர் ‘நீ/உன்’ பாதுகாக்கப்பட்டுள்ளது; மூலத்தின் கடுமை மென்மைப்படுத்தப்படவில்லை.
