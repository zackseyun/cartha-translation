revisions:
- from: உன் வீட்டில் பெரியதும் சிறியதுமான இரண்டு வெவ்வேறு எப்பா அளவைகள்[a] இருக்கக்கூடாது.
  to: உன் வீட்டில் ஒரு பெரிய எப்பா அளவையும் ஒரு சிறிய எப்பா அளவையும் வைத்திருக்கக்கூடாது.[a]
