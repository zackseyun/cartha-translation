  text: לֹא יִהְיֶ֥ה לְ/ךָ֛ בְּ/בֵיתְ/ךָ֖ אֵיפָ֣ה וְ/אֵיפָ֑ה גְּדוֹלָ֖ה וּ/קְטַנָּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/025/014.yaml
  text: You shall not have in your house an ephah and an ephah[a], a large and a small.
translation:
  language: ta
  text: உன் வீட்டில் ஒரு பெரிய எப்பா அளவையும் ஒரு சிறிய எப்பா அளவையும் வைத்திருக்கக்கூடாது.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எப்பா என்பது உலர் பொருட்களை அளக்கப் பயன்படுத்தப்பட்ட பண்டைய எபிரெய அளவையலகு.
    reason: cultural_note
lexical_decisions:
- source_word: לֹא יִהְיֶה לְךָ
  choice: உனக்கு ... இருக்கக்கூடாது
  rationale: எதிர்மறை imperfect உடன் வரும் தத்திவுச் சொற்றொடர் உடைமையைத் தடைசெய்கிறது. தமிழில் ‘இருக்கக்கூடாது’ என்பது சட்டப்பாங்கான தடையை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: בְּבֵיתְךָ
  choice: உன் வீட்டில்
  rationale: בַּיִת இங்கு அளவைகள் வைக்கப்படும் உடல்சார்ந்த வீட்டைக் குறிக்கிறது; ஆகவே ‘குடும்பத்தில்’ என்பதைக் காட்டிலும் ‘வீட்டில்’ துல்லியமானது.
- source_word: אֵיפָה וְאֵיפָה
  choice: இரண்டு வெவ்வேறு எப்பா அளவைகள்
  rationale: எப்பா என்பது உலர் பொருட்களுக்கான பண்டைய எபிரெய அளவை. சொற்படியான மறுபதிப்பு தமிழில் இயல்பற்றதாக இருப்பதால், நேர்மையற்ற இரட்டை அளவுகோலை உணர்த்தும் மறுபதிப்பின் பொருள் ‘இரண்டு வெவ்வேறு’ என வெளிப்படுத்தப்படுகிறது; குறிப்பிட்ட பண்டைய அலகின் பெயரும் தக்கவைக்கப்படுகிறது.
- source_word: גְּדוֹלָה וּקְטַנָּה
  choice: பெரியதும் சிறியதுமான
  rationale: பெண்பால் பெயர்ச்சொல்லான אֵיפָה-வுடன் இயையும் இவ்வுரிச்சொற்கள், அளவில் வேறுபடும் இரண்டு பாத்திரங்களைச் சுருக்கமாகக் குறிக்கின்றன.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழில், சட்டப்பாங்கின் கண்ணியத்தையும் தெளிவையும் காக்கும் இயல்பான நடை. ‘எப்பா’ என்ற பண்பாட்டுச் சிறப்புடைய அலகு விளக்கக் குறிப்புடன் தக்கவைக்கப்பட்டுள்ளது.
