  text: אֶ֣בֶן שְׁלֵמָ֤ה וָ/צֶ֨דֶק֙ יִֽהְיֶה לָּ֔/ךְ אֵיפָ֧ה שְׁלֵמָ֛ה וָ/צֶ֖דֶק יִֽהְיֶה לָּ֑/ךְ לְמַ֨עַן֙ יַאֲרִ֣יכוּ יָמֶ֔י/ךָ עַ֚ל הָֽ/אֲדָמָ֔ה אֲשֶׁר יְהוָ֥ה אֱלֹהֶ֖י/ךָ נֹתֵ֥ן לָֽ/ךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/025/015.yaml
  text: You shall have a full and just weight; you shall have a full and just ephah[a], so that your days may be long on the land that Yahweh your God is giving you.
translation:
  language: ta
  text: முழுமையானதும் நியாயமானதுமான எடைக்கல்[a] உன்னிடம் இருக்க வேண்டும்; முழுமையானதும் நியாயமானதுமான ஏப்பா அளவு[b] உன்னிடம் இருக்க வேண்டும்; உன் கடவுளாகிய யாவே உனக்குக் கொடுக்கிற நிலத்தில் உன் நாட்கள் நீடிப்பதற்காக.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயில் நேரடியாக ‘கல்’; வணிகத்தில் பயன்படுத்தப்பட்ட கல் எடைக்கல்.
    reason: lexical_alternative
  - marker: b
    text: ஏப்பா என்பது பண்டைய உலர் கொள்ளளவு அலகு.
    reason: historical_measure
lexical_decisions:
- source_word: אֶבֶן
  choice: எடைக்கல்
  rationale: இதன் நேரடிப் பொருள் ‘கல்.’ வணிகச் சூழலில் எடையை நிர்ணயிக்கப் பயன்படுத்தப்பட்ட கல்லைக் குறிப்பதால், concrete image-ஐயும் செயல்பாட்டையும் ‘எடைக்கல்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: שְׁלֵמָה
  choice: முழுமையான
  rationale: குறையற்ற, முழு தரத்தையுடைய அளவு அல்லது எடை என்பதைக் குறிக்கிறது; மூலத்தின் ‘முழுமை’ கருத்தைப் பாதுகாக்கிறது.
- source_word: וָצֶדֶק
  choice: நியாயமான
  rationale: வணிக அளவுகளில் சரியான தரத்தோடு ஒழுக்கரீதியான நேர்மையையும் குறிக்கிறது. ‘துல்லியமான’ என்பதைவிட மூலத்தின் நீதிசார் பரிமாணத்தைச் சிறப்பாகப் பாதுகாக்கிறது.
- source_word: יִהְיֶה לָּךְ
  choice: உன்னிடம் இருக்க வேண்டும்
  rationale: ‘உனக்கு/உன்னிடம் இருக்கட்டும்’ என்ற எபிரெயச் சட்ட வடிவத்தின் கட்டாயத் தன்மையை நவீன தமிழில் தெளிவாக வழங்குகிறது.
- source_word: אֵיפָה
  choice: ஏப்பா அளவை
  rationale: இது குறிப்பிட்ட பண்டைய உலர் கொள்ளளவு அலகு. பெயரை ஒலிபெயர்த்து, அது ஓர் அளவை என்பதைத் தெளிவுபடுத்த ‘அளவை’ சேர்க்கப்பட்டுள்ளது.
- source_word: לְמַעַן
  choice: …நீடிப்பதற்காக
  rationale: கட்டளைக்கும் நிலத்தில் நீண்ட வாழ்வுக்கும் இடையிலான நோக்கம்/விளைவு உறவைப் பாதுகாக்கிறது.
- source_word: יַאֲרִיכוּ יָמֶיךָ
  choice: உன் நாட்கள் நீடிக்க
  rationale: ‘உன் நாட்கள் நீளுதல்’ என்ற எபிரெய உருவகத்தைப் பாதுகாத்தபடி இயல்பான தமிழில் வழங்குகிறது.
- source_word: עַל הָאֲדָמָה
  choice: நிலத்தில்
  rationale: உபாகமச் சூழலில் இது கடவுள் அளிக்கும் உடன்படிக்கை நிலத்தைக் குறிக்கிறது; தமிழில் ‘நிலத்தில்’ இயல்பான இடவியல் வடிவம்.
- source_word: יְהוָה
  choice: யாவே
  rationale: திருநாமமான நான்கெழுத்துப் பெயரை பொதுப் பட்டமாக மாற்றாமல், தமிழில் தெளிவான ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: נֹתֵן לָךְ
  choice: உனக்குக் கொடுக்கிற
  rationale: எபிரெயப் பங்கேற்பு வடிவத்தின் நிகழ்கால/நெருங்கிய நிறைவேற்ற உணர்வைப் பாதுகாக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைத் திருநாமத்தின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூல உரை பொதுப் பட்டத்தை அல்ல, இறைத் திருநாமத்தையே பயன்படுத்துகிறது. ஆகவே திருநாமம் ஒலிபெயர்க்கப்படுகிறது.
- issue: கீழ்ப்படிதலுக்கும் நீண்ட வாழ்வுக்கும் உள்ள தொடர்பு
  choice: நோக்கம்/விளைவு உறவை வெளிப்படையாக வைத்தல்
  alternative: நிபந்தனையை வலுப்படுத்தும் ‘அப்போதுதான்’
  rationale: לְמַעַן நோக்கம் அல்லது விளைவை அறிமுகப்படுத்துகிறது; மூலத்தில் இல்லாத கடுமையான ‘அப்போதுதான்’ என்ற நிபந்தனைச் சாயலைச் சேர்க்காமல் உறவு பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், சட்டக் கட்டளைக்கேற்ற கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘எடைக்கல்’ concrete வணிகப் பின்னணியைத் தக்கவைக்கிறது; ‘ஏப்பா’ என்ற பண்டைய அலகு விளக்கக் குறிப்புடன் பாதுகாக்கப்பட்டுள்ளது.
