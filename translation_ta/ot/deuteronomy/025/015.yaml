  terminology: ‘யாவே,’ ‘எடைக்கல்,’ and transliterated ‘ஏப்பா’ are suitable. ‘முழுமையானதும் நியாயமானதுமான’ preserves the completeness and justice/fairness of the Hebrew, though it is formal in an appropriately legal register.
