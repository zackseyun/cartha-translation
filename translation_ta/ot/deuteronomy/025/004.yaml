lexical_decisions:
- source_word: לֹא תַחְסֹם
  choice: வாயைக் கட்டாதே
  rationale: எபிரெயச் சட்டத் தடையைத் தமிழில் இயல்பான ஒருமை கட்டளை வடிவில் தருகிறது. חסם என்பது விலங்கு உண்ண முடியாதபடி அதன் வாயை அடைப்பதையோ கட்டுவதையோ குறிக்கிறது.
- source_word: שׁוֹר
  choice: மாடு
  rationale: வேளாண் உழைப்பில் பயன்படுத்தப்படும் bovine விலங்கை இங்கு குறிக்கிறது. நவீன பொதுத் தமிழில் ‘மாடு’ தெளிவாகவும் இயல்பாகவும் உள்ளது; ‘எருது’ எனக் குறிப்பிட்டால் எபிரெயச் சொல்லின் பொதுவான பரப்பைத் தேவையின்றிக் குறுக்கலாம்.
- source_word: בְּדִישׁוֹ
  choice: கதிரடித்துக்கொண்டிருக்கும்
  rationale: ‘அது கதிரடிக்கும்போது’ என்ற காலச் சூழலை இயல்பான தமிழில் தெரிவிக்கிறது. எபிரெயம் சொற்பட ‘அதன் கதிரடிப்பில்’ என இருந்தாலும், செயல் நடந்துகொண்டிருப்பதை இவ்வடிவம் தெளிவாகக் காட்டுகிறது.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழில் சுருக்கமான சட்டத் தடை வடிவம் பயன்படுத்தப்பட்டுள்ளது. ‘வாயைக் கட்டாதே’ என்பது அன்றாட வாசகருக்குப் புரியக்கூடியதாக இருந்து, விலங்கு உண்ண முடியாதபடி வாயை அடைக்கும் பொருளைச் சூழலில் வெளிப்படுத்துகிறது. அடிக்குறிப்பு குறி முதன்மை உரையில் சேர்க்கப்பட்டுள்ளது.
