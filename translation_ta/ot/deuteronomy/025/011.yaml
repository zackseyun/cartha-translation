base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/025/011.yaml
  text: If men are fighting together[a], a man and his brother, and the wife of one comes near to rescue her husband from the hand of the one striking him, and she reaches out her hand and seizes his genitals[d][c][b],
translation:
  language: ta
  text: ஆண்கள், அதாவது ஒருவனும் அவன் சகோதரனும்,[b] ஒருவரோடொருவர் சண்டையிட்டால்,[a] அவர்களில் ஒருவனுடைய மனைவி தன் கணவனை அவனை அடிக்கிறவனுடைய கையிலிருந்து[c] காப்பாற்ற அருகில் வந்து, தன் கையை நீட்டி அவனை அடிக்கிறவனுடைய மறைவுறுப்புகளைப்[d] பிடித்துக்கொண்டால்,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஆண்கள் ஒருவரோடொருவர் சண்டையிடும்போது.”
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில், “ஒருவனும் அவன் சகோதரனும்.” இங்கு “சகோதரன்” என்பது உடன்பிறந்தவனை மட்டுமல்லாமல், சக மனிதனையோ ஒரே சமூகத்தைச் சேர்ந்தவனையோ குறிக்கலாம்.
    reason: cultural_note
  - marker: c
    text: அல்லது, “தன்னைத் தாக்குகிறவனிடமிருந்து.”
    reason: lexical_alternative
  - marker: d
    text: எபிரெயத்தில் ஆணின் பிறப்புறுப்புகளைக் குறிக்கும் நயச்சொல் பயன்படுத்தப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי יִנָּצוּ
  choice: சண்டையிட்டால்
  rationale: இது ஒரு சட்ட வழக்குச் சூழலை நிபந்தனையாக அறிமுகப்படுத்துகிறது. நிபால் வினை உடல் ரீதியான சண்டையைக் குறிக்கிறது; ‘சண்டையிட்டால்’ என்பது இயல்பான நவீனத் தமிழில் இரண்டையும் வெளிப்படுத்துகிறது.
- source_word: אֲנָשִׁים יַחְדָּו
  choice: ஆண்கள் ஒருவரோடொருவர்
  rationale: אֲנָשִׁים இங்கு ஆண்களைக் குறிக்கிறது; יַחְדָּו பரஸ்பர மோதலைச் சுட்டுவதால் ‘ஒருவரோடொருவர்’ எனத் தரப்பட்டது.
- source_word: אִישׁ וְאָחִיו
  choice: ஒருவனும் அவன் சகோதரனும்
  rationale: எபிரெயச் சொற்றொடரின் வடிவத்தைப் பாதுகாக்கிறது. இங்கு ‘சகோதரன்’ என்பது உடன்பிறந்தவனை மட்டுமல்லாமல், சக மனிதன் அல்லது ஒரே சமூகத்தைச் சேர்ந்தவனையும் குறிக்கலாம்.
- source_word: וְקָרְבָה
  choice: அருகில் வந்து
  rationale: காட்சியில் அந்தப் பெண் நெருங்கி வருவதை எளிமையாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: אֵשֶׁת הָאֶחָד
  choice: அவர்களில் ஒருவனுடைய மனைவி
  rationale: சண்டையிடும் இருவரில் ஒருவனுடைய மனைவி என்பதைக் குழப்பமின்றி வெளிப்படுத்துகிறது.
- source_word: לְהַצִּיל אֶת אִישָׁהּ
  choice: தன் கணவனை ... காப்பாற்ற
  rationale: אִישָׁהּ சொல்லுக்கு நேரடியாக ‘அவளுடைய மனிதன்’ என்ற பொருள் இருந்தாலும், இம்மணவுறவுச் சூழலில் ‘தன் கணவன்’ என்பதே தெளிவான இணை.
- source_word: מִיַּד מַכֵּהוּ
  choice: அடிக்கிறவனுடைய கையிலிருந்து
  rationale: ‘அவனை அடிக்கிறவனின் கையிலிருந்து’ என்ற மூலத்தின் தெளிவான, உயிரோட்டமுள்ள படிமத்தைப் பாதுகாக்கிறது.
- source_word: וְשָׁלְחָה יָדָהּ
  choice: தன் கையை நீட்டி
  rationale: கையை முன்னே நீட்டுவதைக் குறிக்கும் பொதுவான எபிரெயச் சொற்றொடருக்கு இயல்பான தமிழாக்கம்.
- source_word: וְהֶחֱזִיקָה
  choice: பிடித்துக்கொண்டால்
  rationale: உறுதியாகப் பற்றிக்கொள்ளும் வலுவான செயலை நவீனத் தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: בִּמְבֻשָׁיו
  choice: அந்த மனிதனுடைய மறைவுறுப்புகளை
  rationale: ஆணின் பிறப்புறுப்புகளைக் குறிக்கும் எபிரெய நயச்சொல்லின் மறைமுகத்தன்மையையும் கண்ணியமான நடையையும் பாதுகாக்கிறது; ‘அந்த மனிதன்’ என்பது தாக்குகிறவனே குறிக்கப்படுகிறான் என்பதைத் தெளிவாக்குகிறது.
