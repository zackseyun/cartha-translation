source:
  edition: WLC
  text: וְ/הָיָ֡ה בְּ/הָנִ֣יחַ יְהוָ֣ה אֱלֹהֶ֣י/ךָ לְ֠/ךָ מִ/כָּל אֹ֨יְבֶ֜י/ךָ מִ/סָּבִ֗יב בָּ/אָ֨רֶץ֙ אֲשֶׁ֣ר יְהוָֽה אֱ֠לֹהֶי/ךָ נֹתֵ֨ן לְ/ךָ֤ נַחֲלָה֙ לְ/רִשְׁתָּ֔/הּ תִּמְחֶה֙ אֶת זֵ֣כֶר עֲמָלֵ֔ק מִ/תַּ֖חַת הַ/שָּׁמָ֑יִם לֹ֖א תִּשְׁכָּֽח׀־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/025/019.yaml
  text: And when Yahweh your God gives you rest from all your enemies around you[a], in the land that Yahweh your God is giving you as an inheritance to possess, you shall blot out the remembrance of Amalek from under heaven. Do not forget.
translation:
  language: ta
  text: உன்னைச் சுற்றியுள்ள உன் எல்லா எதிரிகளிடமிருந்தும் உன் கடவுளாகிய யாவே உனக்கு ஓய்வு அளிக்கும்போது, அதை உரிமையாக்கிக்கொள்ள உன் கடவுளாகிய யாவே உனக்கு மரபுரிமையாகக் கொடுக்கிற நாட்டில், அமலேக்கைப் பற்றிய நினைவை[a] வானத்தின் கீழிருந்து துடைத்தழித்துவிடு. மறந்துவிடாதே.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அமலேக்கின் நினைவு.”
    reason: זֵכֶר என்பதற்கு ‘நினைவு’ அல்லது ‘நினைவுகூரல்’ என்ற பொருள் உண்டு; மூலத்தின் நினைவு/நினைவுகூரல் நுட்பத்தைப் பேணுகிறது.
lexical_decisions:
- source_word: וְהָיָה בְּהָנִיחַ
  choice: இளைப்பாறுதல் அளிக்கும்போது
  rationale: எதிர்காலத்தில் நிகழும் சூழலைக் குறிக்கும் எபிரெய கால அமைப்பையும், נוח என்பதன் காரணவினைப் பொருளையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இது பட்டப்பெயர் அல்ல, தேவனுடைய தனிப்பெயரான நான்கெழுத்துப் பெயர்; ஆகவே தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: מִכָּל אֹיְבֶיךָ מִסָּבִיב
  choice: உன்னைச் சுற்றியுள்ள உன் எதிரிகள் அனைவரிடமிருந்தும்
  rationale: ‘அனைவரும்’ என்ற முழுமையையும் ‘சுற்றிலும்’ என்ற இடவியல் கருத்தையும் தெளிவாகப் பேணுகிறது.
- source_word: נַחֲלָה
  choice: உரிமைச்சொத்தாக
  rationale: உடன்படிக்கைச் சூழலில் வழங்கப்படும் நிலத்தைக் குறிக்கும் வாரிசுரிமை/உரிமைச்சொத்து கருத்தை இயல்பான தமிழில் தருகிறது.
- source_word: לְרִשְׁתָּהּ
  choice: நீ உரிமையாக்கிக்கொள்வதற்காக
  rationale: நிலத்தைக் கைப்பற்றி நிலையான உடைமையாக்கிக்கொள்ளும் ירשׁ வினையின் பொருளைப் பேணுகிறது.
- source_word: תִּמְחֶה
  choice: அழித்துவிடு
  rationale: முற்றிலும் துடைத்தொழித்தல் அல்லது இல்லாமற்போகச் செய்தல் என்ற מחה வினையின் கட்டளை வலிமையை இயல்பான தமிழில் தருகிறது.
- source_word: זֵכֶר
  choice: நினைவு
  rationale: ஒருவரைப் பற்றிய நினைவு அல்லது நினைவுச் சுவடு என்ற சொல்லின் முதன்மைப் பொருளைத் தருகிறது; மாற்று நுட்பம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
- source_word: מִתַּחַת הַשָּׁמָיִם
  choice: வானத்தின் கீழிருந்து
  rationale: எபிரெய மொழியின் உருவகத்தையும் அதன் பரந்த எல்லையையும் சுருக்காமல் பேணுகிறது.
- source_word: לֹא תִּשְׁכָּח
  choice: மறந்துவிடாதே
  rationale: தனியொருவரை நோக்கிய நேரடியான எதிர்மறைக் கட்டளையைத் தெளிவாகத் தருகிறது.
theological_decisions:
- issue: יְהוָה என்ற தேவனுடைய பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலத்தில் ஒரு பட்டப்பெயர் அல்லாமல் உடன்படிக்கையின் தனிப்பெயரே நேரடியாக உள்ளது; எனவே அதைப் பட்டப்பெயராக மாற்றாமல் ஒலிபெயர்க்கிறது.
- issue: זֵכֶר עֲמָלֵק என்பதன் பரப்பு
  choice: அமலேக்கின் நினைவு
  alternative: அமலேக்கின் நினைவுச் சுவடு
  rationale: மூலச்சொல் நினைவு, நினைவுகூரல், எஞ்சிய நினைவுச் சுவடு ஆகிய நெருங்கிய கருத்துகளைக் கொண்டிருக்கலாம். முதன்மை உரை ‘நினைவு’ என்பதைப் பேணுகிறது; விரிவான மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், ஒருமை இரண்டாம் நபர் வடிவத்தைத் தொடர்ந்து பயன்படுத்தும் கண்ணியமான கட்டளைநடை. எபிரெய வாக்கியத்தின் காலச் சூழலும் நிலம் குறித்த இடைச்சொற்றொடரும் தெளிவாகப் பேணப்பட்டுள்ளன; தேவனுடைய தனிப்பெயர் ‘யாவே’ என ஒலிபெயர்க்கப்பட்டுள்ளது.
