  source_fidelity: 'வரைவில் சட்டச்சூழல், வழக்குத் தீர்ப்பு, மற்றும் நீதிமன்றப் பொருள் பொதுவாகச் சரியாக உள்ளன. ஆனால் இறுதி இரு நீதித்துறைத் தீர்ப்புகளின் சொற்றொடர் அமைப்பு தமிழில் தவறாக உள்ளது: நீதிமானை/பொல்லாதவனைத் தீர்ப்பளிப்பது அல்ல, அவர்களை முறையே குற்றமற்றவர்/குற்றவாளி என்று அறிவிப்பதே மூலத்தின் பொருள். אֲנָשִׁים என்பதன் ஆண்பால் குறிப்பை ‘ஆண்கள்’ எனக் காக்கப்பட்டுள்ளது.'
