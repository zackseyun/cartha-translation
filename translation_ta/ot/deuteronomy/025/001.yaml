base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/025/001.yaml
  text: If there is a dispute between men[a], and they come to court, and the judges decide between them, then they shall acquit the righteous and condemn the wicked[c][b],
translation:
  language: ta
  text: ஆண்களுக்கிடையே ஒரு வழக்கு எழுந்தால்,[a] அவர்கள் நீதிமன்றத்துக்கு வந்து, நீதிபதிகள் அவர்களை நியாயந்தீர்க்க வேண்டும். நீதிமானைக் குற்றமற்றவர் என்று அறிவித்து, பொல்லாதவனைக் குற்றவாளி என்று அறிவிக்க வேண்டும்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஆண்களுக்கிடையே ஒரு வழக்கு எழும்போது.”
    reason: alternative_reading
  - marker: b
    text: “குற்றமற்றவர் என்று… குற்றவாளி என்று” என்பவை நீதிமன்றத் தீர்ப்பைக் குறிக்கும் சொற்கள்; சொல்லுக்குச் சொல், “நீதிமானென்று… பொல்லாதவனென்று அறிவிக்க வேண்டும்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי יִהְיֶה
  choice: எழுந்தால்
  rationale: நிபந்தனைச் சட்டவாக்கியத்தை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது; ‘ஏற்படும்போது’ என்பதும் சாத்தியம்.
- source_word: רִיב
  choice: வழக்கு
  rationale: இங்கு தனிப்பட்ட சண்டையைவிட நீதித்துறை முன் கொண்டுவரப்படும் சர்ச்சை அல்லது வழக்கைக் குறிக்கிறது.
- source_word: בֵּין אֲנָשִׁים
  choice: மனிதர்களுக்கிடையே
  rationale: எபிரெயச் சொற்றொடர் இலக்கண ரீதியில் ஆண்பால் பன்மையாக இருந்தாலும், தமிழில் ‘மனிதர்கள்’ இயல்பாகவும் மூலத்தின் பொதுவான சட்டநடையைத் தக்கவைத்தும் உள்ளது.
- source_word: וְנִגְּשׁוּ אֶל־הַמִּשְׁפָּט
  choice: அவர்கள் நீதிமன்றத்துக்கு வந்து
  rationale: ‘நியாயத்தீர்ப்பிடம் அணுகுதல்’ என்ற சொற்பொருளை, நீதித்துறை நடவடிக்கைக்காக நீதிமன்றத்துக்கு வருதல் எனத் தெளிவாக மொழிபெயர்க்கிறது.
- source_word: וּשְׁפָטוּם
  choice: நீதிபதிகள் அவர்களுடைய வழக்கைத் தீர்க்க வேண்டும்
  rationale: எபிரெயத்தில் உள்ள பன்மை வினையின் மறைமுக எழுவாயைச் சூழலிலிருந்து ‘நீதிபதிகள்’ என வெளிப்படுத்தி, அவர்களுக்கிடையேயான வழக்கைத் தீர்ப்பது என்ற பொருளை இயல்பாகத் தருகிறது.
- source_word: וְהִצְדִּיקוּ אֶת־הַצַּדִּיק
  choice: குற்றமற்றவர் என்று நீதிமானைத் தீர்ப்பளித்து
  rationale: இந்த நீதித்துறைச் சூழலில் ‘நீதிமானாக்குதல்’ அல்ல, வழக்கில் சரியான தரப்பினர் என அறிவித்தல் அல்லது விடுவித்தல் என்பதே பொருள்; பெயர்ச் சொல்லின் இணை அமைப்புக்காக ‘நீதிமான்’ தக்கவைக்கப்பட்டுள்ளது.
- source_word: וְהִרְשִׁיעוּ אֶת־הָרָשָׁע
  choice: குற்றவாளி என்று பொல்லாதவனைத் தீர்ப்பளிக்க வேண்டும்
  rationale: நீதிமன்றத்தில் குற்றமுடையவன் என அறிவிப்பதைக் குறிக்கிறது; மூலத்திலுள்ள நீதிமான்/பொல்லாதவன் என்ற எதிரிணையையும் தக்கவைக்கிறது.
theological_decisions:
- issue: צדק/רשע என்பவற்றின் நீதித்துறைப் பொருளா அல்லது ஒழுக்கநிலைப் பொருளா
  choice: வழக்கில் குற்றமற்றவர் அல்லது குற்றவாளி என்று நீதிமன்றம் அறிவிக்கும் தீர்ப்பு
  alternative: ஒருவரை ஒழுக்க ரீதியாக நீதிமான் அல்லது பொல்லாதவன் என்று மட்டும் வருணித்தல்
  rationale: நீதிமன்றத்துக்கு வருதல் மற்றும் நியாயந்தீர்த்தல் என்ற உடனடிச் சூழல், இவ்வினைச்சொற்கள் ஒருவரின் உள்ளார்ந்த ஒழுக்கநிலையை மாற்றுவதை அல்ல, சட்டரீதியான தீர்ப்பைச் சுட்டுவதை உறுதிப்படுத்துகிறது.
translation_notes:
  register: நவீன, தெளிவான, மரியாதைமிக்க சட்டநடை பயன்படுத்தப்பட்டுள்ளது. ‘நீதிமான்/பொல்லாதவன்’ என்ற மூல எதிரிணை தக்கவைக்கப்பட்டு, அதன் நீதித்துறைப் பொருள் தீர்ப்பு மொழியாலும் அடிக்குறிப்பாலும் தெளிவாக்கப்பட்டுள்ளது.
