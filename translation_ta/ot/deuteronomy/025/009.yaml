  revision_rationale: மறுக்கும் ஆணின் சகோதரனையே ‘அவனுடைய சகோதரன்’ தெளிவாகக் குறிக்கும்படி மேற்கோள் திருத்தப்பட்டது. சட்டச் சூழலுக்கு இயல்பான நவீனத் தமிழ் நடை பயன்படுத்தப்பட்டது; மூலத்தின் ஒருமை, அவமானச் செயல், மற்றும் குடும்ப ‘வீடு கட்டியெழுப்புதல்’ உருவகம் மாற்றப்படவில்லை. மாற்றுப் பொருள் அடிக்குறிப்பு நடுநிலையாகச் சரிசெய்யப்பட்டது.
