  revised_text: 'அப்போது அவனுடைய சகோதரனின் விதவை, மூப்பர்களின் முன்னிலையில் அவனிடம் நெருங்கிவந்து, அவனுடைய காலிலிருந்து அவனுடைய செருப்பைக் கழற்றி, அவன் முகத்தில் துப்பி,[a] இவ்வாறு பதிலளித்துச் சொல்ல வேண்டும்: “அவனுடைய சகோதரனின் வீட்டைக் கட்டியெழுப்பாத மனிதனுக்கு இப்படியே செய்யப்படும்.”[b]'
