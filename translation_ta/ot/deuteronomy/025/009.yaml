base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/025/009.yaml
  text: then his brother’s widow shall come near to him in the sight of the elders[a], remove his sandal from on his foot, spit in his face, and answer and say[b], ‘This is what shall be done to the man who will not build up his brother’s house.’
translation:
  language: ta
  text: 'அப்போது அவனுடைய சகோதரனின் விதவை, மூப்பர்களின் முன்னிலையில் அவனிடம் நெருங்கிவந்து, அவனுடைய காலிலிருந்து அவனுடைய செருப்பைக் கழற்றி, அவன் முகத்தில் துப்பி,[a] இவ்வாறு பதிலளித்துச் சொல்ல வேண்டும்: “அவனுடைய சகோதரனின் வீட்டைக் கட்டியெழுப்பாத மனிதனுக்கு இப்படியே செய்யப்படும்.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவனுக்கு முன்பாகத் துப்பி.” சிலர் எபிரெயச் சொற்றொடரை, அவனுடைய முகத்திலேயே துப்புவதற்குப் பதிலாக அவன் முன்னிலையில் துப்புவதாகப் புரிந்துகொள்கிறார்கள்.
    reason: lexical_alternative
  - marker: b
    text: “சகோதரனின் வீட்டைக் கட்டியெழுப்புதல்” என்பது, இறந்த சகோதரனின் விதவையை மணப்பதன் மூலம் அவனுடைய குடும்ப வழியையும் குடும்பத்தையும் நிலைநாட்டித் தொடரச் செய்வதைக் குறிக்கிறது.
    reason: cultural_note
lexical_decisions:
- source_word: יְבִמְתּוֹ
  choice: அவனுடைய சகோதரனின் விதவை
  rationale: இச்சட்டச் சூழலில் இது பொதுவாக எந்த மைத்துனியையும் குறிக்காமல், இறந்த சகோதரனின் விதவையைக் குறிப்பதால் உறவு தெளிவாக மொழிபெயர்க்கப்பட்டது. சகோதரன் மூத்தவரா இளையவரா என்பதை எபிரெயம் குறிப்பிடாததால் ‘அண்ணன்/தம்பி’ எனத் தீர்மானிக்கவில்லை.
- source_word: לְעֵינֵי הַזְּקֵנִים
  choice: மூப்பர்களின் கண்களுக்கு முன்பாக
  rationale: ‘மூப்பர்களின் கண்களுக்கு’ என்ற மூல உருவகத்தைத் தக்கவைத்து, செயல் அவர்கள் காணும்படி பொதுவாகவும் சாட்சிகளின் முன்னிலையிலும் நடைபெறுவதை வெளிப்படுத்துகிறது.
- source_word: וְחָלְצָה נַעֲלוֹ מֵעַל רַגְלוֹ
  choice: அவனுடைய காலிலிருந்து அவனுடைய செருப்பைக் கழற்றி
  rationale: חָלַץ இங்கு காலணியைக் கழற்றுவதைக் குறிக்கிறது. எபிரெயத்தில் ஒருமை இருப்பதால் ‘செருப்பு’ ஒருமையிலேயே வைக்கப்பட்டது.
- source_word: וְיָרְקָה בְּפָנָיו
  choice: அவன் முகத்தில் துப்பி
  rationale: בְּפָנָיו என்பதன் நேரடியான வாசிப்பு ‘அவன் முகத்தில்’ என்பதாகும்; சடங்கின் அவமானப்படுத்தும் தன்மையை மென்மையாக்காமல் தக்கவைக்கிறது. ‘அவனுக்கு முன்பாக’ என்ற மாற்று வாசிப்பு அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: וְעָנְתָה וְאָמְרָה
  choice: மறுமொழி கூறி, … என்று சொல்ல வேண்டும்
  rationale: ‘மறுமொழி கூறி, சொல்லுதல்’ என்ற இரு வினைகளையும் தக்கவைத்தபடியே, தமிழில் சட்ட அறிவிப்பாக இயல்பாக ஒலிக்கச் செய்கிறது.
- source_word: כָּכָה יֵעָשֶׂה
  choice: இப்படியே செய்யப்படும்
  rationale: செயப்பாட்டு வடிவத்தையும் அதிகாரப்பூர்வ அறிவிப்பின் வலிமையையும் தக்கவைக்கும் இயல்பான நவீனத் தமிழ்.
- source_word: לָאִישׁ
  choice: மனிதனுக்கு
  rationale: இச்சட்டத்தில் குறிப்பிடப்படும் ஆண் உறவினரைக் குறிக்கும் ஒருமை ஆண்பால் பொருள் சூழலால் தெளிவாக இருப்பதால், தமிழில் இயல்பான ‘மனிதன்’ பயன்படுத்தப்பட்டது.
- source_word: לֹא יִבְנֶה אֶת בֵּית אָחִיו
  choice: தன் சகோதரனுடைய வீட்டைக் கட்டியெழுப்பாத
  rationale: குடும்ப வழியையும் குடும்பத்தையும் தொடரச் செய்வதைக் குறிக்கும் எபிரெய உருவகத்தை விளக்கமாக மாற்றிவிடாமல் ‘வீட்டைக் கட்டியெழுப்புதல்’ எனத் தக்கவைக்கிறது.
theological_decisions:
- issue: בְּפָנָיו என்ற அவமானச் செயலை மென்மையாக்குவதா
  choice: அவன் முகத்தில் துப்பி
  alternative: அவனுக்கு முன்பாகத் துப்பி
  rationale: எபிரெயத்தின் மிக நேரடியான பொருள் முதன்மை உரையில் வைக்கப்பட்டது. வேறொரு சாத்தியமான புரிதல் அடிக்குறிப்பில் பதிவு செய்யப்பட்டதால் உண்மையான மொழியியல் மாற்றுவாசிப்பு மறைக்கப்படவில்லை.
- issue: ‘சகோதரனுடைய வீட்டைக் கட்டியெழுப்புதல்’ என்ற உருவகத்தை விளக்கவுரையாக மாற்றுவதா
  choice: உருவகத்தை முதன்மை உரையில் தக்கவைத்தல்
  alternative: சகோதரனின் குடும்ப வழியைத் தொடரச் செய்தல்
  rationale: மூலத்தின் ‘வீடு கட்டுதல்’ உருவகம் குடும்பம், குடும்ப வழி, குடும்பப் பெயர் ஆகியவற்றை ஒருங்கே சுட்டலாம். அவற்றில் ஒன்றை மட்டும் முதன்மைப்படுத்தாமல், பண்பாட்டு பொருள் அடிக்குறிப்பில் விளக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சட்ட உரைக்கு ஏற்ற கண்ணியமானதும் பொதுவாசகர்களுக்குப் புரியக்கூடியதுமான நடை பயன்படுத்தப்பட்டது. ‘சகோதரன்’ என்பது மூத்தவர்/இளையவர் என்ற மூலத்தில் இல்லாத வேறுபாட்டைச் சேர்ப்பதைத் தவிர்க்கிறது. மூலத்தின் மீளுரைத்தல் தன்மை அளவோடு தக்கவைக்கப்பட்டது; ‘வீட்டைக் கட்டியெழுப்புதல்’ என்ற பண்பாட்டு உருவகம் அடிக்குறிப்புடன் பாதுகாக்கப்பட்டது.
