  source_fidelity: மூல எபிரெயத்தின் காலத் தொடர்பான אַחֲרֵי הַכֹּתוֹ (“அவர் வீழ்த்திய பின்பு”) கட்டமைப்பும், சீகோன் மற்றும் ஓக் ஆகிய இரு நேரடிப் பொருள்களும், அவர்களுடைய அரசப் பட்டங்களும் குடியிருப்பு இடங்களும் துல்லியமாகத் தரப்பட்டுள்ளன. “வீழ்த்திய” என்பது נכה வினையின் போர்ச் சூழல் வலிமையைத் தேவையற்ற அளவு குறிப்பாக்காமல் நன்றாகக் காக்கிறது.
  naturalness: நடை நவீனத் தரத் தமிழில் தெளிவாகவும் கண்ணியமாகவும் உள்ளது. “எமோரியரின் அரசன் சீகோன்,” “பாசானின் அரசன் ஓக்” என்ற அமைப்பு இயல்பானது. அஸ்தரோத்–எத்ரேயி இடத் தொடர்பில் உள்ள மூலத்தின் சுருக்கமான தெளிவின்மை, இரு இடவுருபுகளாலும் பாதுகாக்கப்பட்டுள்ளது.
  terminology: சீகோன், எஸ்போன், ஓக், பாசான், அஸ்தரோத், எத்ரேயி ஆகிய பெயர்கள் நிலையான தமிழ் வேதாகம ஒலிபெயர்ப்புக்கு ஏற்ப உள்ளன. “எமோரியர்,” “அரசன்,” “வாழ்ந்த” ஆகியவை பொருள், பதிவு, மற்றும் நவீனப் பயன்பாட்டுக்கு ஏற்றவை.
