source:
  edition: WLC
  text: אַחֲרֵ֣י הַכֹּת֗/וֹ אֵ֚ת סִיחֹן֙ מֶ֣לֶךְ הָֽ/אֱמֹרִ֔י אֲשֶׁ֥ר יוֹשֵׁ֖ב בְּ/חֶשְׁבּ֑וֹן וְ/אֵ֗ת ע֚וֹג מֶ֣לֶךְ הַ/בָּשָׁ֔ן אֲשֶׁר יוֹשֵׁ֥ב בְּ/עַשְׁתָּרֹ֖ת בְּ/אֶדְרֶֽעִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/004.yaml
  text: after he had struck down Sihon king of the Amorites[a], who lived in Heshbon, and Og king of Bashan, who lived in Ashtaroth at Edrei.
translation:
  language: ta
  text: அவர் எஸ்போனில் வாழ்ந்த எமோரியரின் அரசன் சீகோனையும், அஸ்தரோத்தில், எத்ரேயியில் வாழ்ந்த பாசானின் அரசன் ஓகையும் வீழ்த்திய பின்பு.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அஸ்தரோத்திலும் எத்ரேயியிலும் வாழ்ந்த.” எபிரெயத்தில் இரு இடப்பெயர்களுக்கும் முன் “-இல்” என்பது திரும்ப வருகிறது; அந்த இரு இடங்களுக்கிடையிலான துல்லியமான தொடர்பு வெளிப்படையாகக் கூறப்படவில்லை.
    reason: alternative_reading
lexical_decisions:
- source_word: אַחֲרֵי
  choice: பின்பு
  rationale: முந்திய செயலைத் தொடர்ந்து நிகழும் கால உறவை இயல்பான நவீனத் தமிழில் குறிக்கிறது.
- source_word: הַכֹּתוֹ
  choice: அவர் ... வீழ்த்திய
  rationale: נכה என்பதன் வலிமையைத் தக்கவைத்து, வெறுமனே ‘தோற்கடித்தார்’ என்பதைவிட அரசர்களை முறியடித்து வீழ்த்திய செயலை வெளிப்படுத்துகிறது; ஆண்பால் ஒருமை விகுதி மரியாதைத் தமிழில் ‘அவர்’ என வழங்கப்படுகிறது.
- source_word: מֶלֶךְ הָאֱמֹרִי
  choice: எமோரியரின் அரசன்
  rationale: இனக்குழுப் பெயரையும் அரசப் பதவியையும் தெளிவாகத் தக்கவைக்கும் இயல்பான தமிழாக்கம்.
- source_word: אֲשֶׁר יוֹשֵׁב
  choice: வாழ்ந்த
  rationale: இங்கு יָשַׁב என்பது ஓர் இடத்தில் குடியிருத்தல் அல்லது வசித்தலைக் குறிக்கிறது; ‘வாழ்ந்த’ என்பது நவீனமும் இயல்புமான சொல்.
- source_word: בְּחֶשְׁבּוֹן
  choice: எஸ்போனில்
  rationale: בְּ முன்னிடைச்சொல்லின் இடப்பொருளைத் தமிழின் ‘-இல்’ வேற்றுமை உருபால் நேரடியாகக் காட்டுகிறது.
- source_word: מֶלֶךְ הַבָּשָׁן
  choice: பாசானின் அரசன்
  rationale: பாசான் என்னும் பிரதேசத்தின் அரசன் என்ற எபிரெயக் கட்டமைப்பைத் தெளிவாகப் பிரதிபலிக்கிறது.
- source_word: אֲשֶׁר יוֹשֵׁב בְּעַשְׁתָּרֹת בְּאֶדְרֶעִי
  choice: அஸ்தரோத்தில், எத்ரேயியில் வாழ்ந்த
  rationale: இரு இடப்பெயர்களுக்கும் முன் வரும் בְּ என்பதைக் ‘-இல்’ என்று இருமுறையும் வெளிப்படுத்தி, அவற்றுக்கிடையிலான துல்லியமான உறவை உரை தீர்மானிப்பதைத் தவிர்க்கிறது.
- source_word: סִיחֹן / עוֹג
  choice: சீகோன் / ஓக்
  rationale: தனிப்பெயர்கள் மொழிபெயர்க்கப்படாமல், நவீனத் தமிழுக்கு ஏற்ற ஒலிபெயர்ப்பில் தரப்படுகின்றன.
