translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையும் கண்ணியமும் காக்கப்பட்டுள்ளன. ‘குடியிருந்த’ என்பதற்குப் பதில் பொதுவாகப் புரியும் ‘வாழ்ந்த’ என்றும், பழமையான ‘ராஜா’ என்பதற்குப் பதில் ‘அரசன்’ என்றும் பயன்படுத்தப்பட்டுள்ளது. இடப்பெயர்களின் உறவு மூலத்தில் தெளிவாக இல்லாததால் முதன்மை உரையும் அடிக்குறிப்பும் அந்தத் தெளிவின்மையைத் தக்கவைக்கின்றன.
