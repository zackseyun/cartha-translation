base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/045.yaml
  text: Then you returned and wept before Yahweh[a], but Yahweh did not listen to your voice or pay attention to you.
translation:
  language: ta
  text: பின்னர் நீங்கள் திரும்பி, யாவேவின் முன்னிலையில் அழுதீர்கள். ஆனால் யாவே உங்கள் குரலுக்குச் செவிகொடுக்கவில்லை; உங்களுக்குச் செவிசாய்க்கவும் இல்லை.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உங்கள் குரலைக் கேட்கவில்லை; உங்களுக்குச் செவிசாய்க்கவில்லை.” எபிரெயத்தில் கேட்பதைக் குறிக்கும் நெருங்கிய பொருளுடைய இரண்டு வினைச்சொற்கள் இணையாக வருகின்றன; யாவே அவர்களுடைய வேண்டுதலுக்குப் பதிலளிக்கவில்லை என்பதை அவை வலியுறுத்துகின்றன.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּשֻׁבוּ
  choice: பின்பு நீங்கள் திரும்பிவந்து
  rationale: שׁוּב என்பது ‘திரும்புதல்’ என்று பொருள்படும்; தொடர்கதை நகர்வையும் முந்தைய நிகழ்வுக்குப் பிந்தைய திரும்பிவருதலையும் ‘பின்பு’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וַתִּבְכּוּ
  choice: அழுதீர்கள்
  rationale: בכה என்பதன் நேரடியான பொருள் ‘அழுதல்’; எபிரெயத்தில் இல்லாத தீவிரத்தைச் சேர்க்காமல் கண்ணியமான நவீன தமிழில் தருகிறது.
- source_word: לִפְנֵי יְהוָה
  choice: யெகோவாவின் முன்னிலையில்
  rationale: לִפְנֵי என்பது ‘முன்னிலையில்/சந்நிதியில்’ என்பதாகும்; ‘முன்னிலையில்’ என்பது தெளிவான, இயல்பான நவீன தமிழ்.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: தெய்வீகப் பெயரான יהוה-வை ஒரு பட்டப்பெயரால் மாற்றாமல், தமிழில் பரவலாக அறியப்படும் ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: וְלֹא שָׁמַע יְהוָה בְּקֹלְכֶם
  choice: ஆனால் யெகோவா உங்கள் குரலுக்குச் செவிகொடுக்கவும் இல்லை
  rationale: שׁמע בְּקוֹל என்பது வெறுமனே ஒலி கேட்பதைக் காட்டிலும் கேட்டுச் செவிகொடுப்பதைக் குறிக்கலாம்; ‘குரல்’ என்ற மூல உருவகத்தையும் காக்கிறது.
- source_word: וְלֹא הֶאֱזִין אֲלֵיכֶם
  choice: உங்களைக் கவனிக்கவும் இல்லை
  rationale: האזין என்பது கவனமாகக் கேட்டல் அல்லது செவிசாய்த்தலைக் குறிக்கிறது; முந்தைய ‘செவிகொடுக்க’ என்பதுடன் உள்ள நெருங்கிய இணைப்பொருள் அமைப்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: יהוה என்ற தெய்வீகப் பெயரின் மொழிபெயர்ப்பு
  choice: யெகோவா
  alternative: யாவே; கர்த்தர்
  rationale: மூலத்தில் தனிப்பட்ட தெய்வீகப் பெயர் நேரடியாக உள்ளது. அதை ‘கர்த்தர்’ என்ற பட்டப்பெயராக மாற்றாமல் ஒலிபெயர்ப்பது மூல வேறுபாட்டைக் காக்கிறது; ‘யெகோவா’ என்பது சாதாரண தமிழ் வாசகர்களிடையே அறியப்பட்ட வடிவம்.
- issue: யெகோவா அவர்களின் அழுகையைக் ‘கேட்கவில்லை’ என்பதன் பொருள்
  choice: செவிகொடுக்கவும் இல்லை, கவனிக்கவும் இல்லை
  alternative: ஒலியை உணரவே இல்லை
  rationale: இரண்டு நெருங்கிய கேட்புச் சொற்களின் இணை அமைப்பு உடல்ரீதியான கேள்வித்திறன் இல்லாமையை அல்ல, அவர்களின் வேண்டுதலுக்குப் பதிலளிக்காததையே சூழலில் வலியுறுத்துகிறது; இருப்பினும் அந்த இணை அமைப்பு மொழிபெயர்ப்பில் காக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. ‘சந்நிதி’ போன்ற சமயச் சிறப்புச் சொல்லுக்குப் பதில் ‘முன்னிலையில்’ பயன்படுத்தப்பட்டது; எபிரெய இணை அமைப்பும் தெய்வீகப் பெயரும் தெளிவாகக் காக்கப்பட்டன.
