revisions:
- from: பின்பு நீங்கள் திரும்பிவந்து, யெகோவாவின் முன்னிலையில் அழுதீர்கள். ஆனால் யெகோவா உங்கள் குரலுக்குச் செவிகொடுக்கவும் இல்லை, உங்களைக் கவனிக்கவும் இல்லை.[a]
  to: பின்னர் நீங்கள் திரும்பி, யாவேவின் முன்னிலையில் அழுதீர்கள். ஆனால் யாவே உங்கள் குரலுக்குச் செவிகொடுக்கவில்லை; உங்களுக்குச் செவிசாய்க்கவும் இல்லை.[a]
