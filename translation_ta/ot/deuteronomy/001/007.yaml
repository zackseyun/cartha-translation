revisions:
- from: திரும்பிப் புறப்பட்டு, எமோரியரின் மலைநாட்டிற்கும் அதைச் சுற்றியுள்ள எல்லாப் பகுதிகளுக்கும் செல்லுங்கள்—அரபாவிலும், மலைநாட்டிலும், ஷெபெலாவிலும்[a], நெகேவிலும், கடற்கரையிலும் உள்ள கானானியரின் நாட்டிற்கும், லெபனோனுக்கும், பெரிய நதியான யூபிராத்து நதிவரைக்கும் செல்லுங்கள்.
  to: 'திரும்பிப் புறப்பட்டு, எமோரியரின் மலைநாட்டிற்கும் அதன் சுற்றுப்புறங்களாகிய எல்லாப் பகுதிகளுக்கும் செல்லுங்கள்: அரபாவிலும், மலைநாட்டிலும், ஷெபெலாவிலும்[a], நெகேவிலும், கடற்கரையிலுள்ள கானானியரின் நாட்டிலும், லெபனோனிலும், பெரிய நதியான யூபிராத்து நதிவரையிலும் செல்லுங்கள்.'
  rationale: The revision preserves the repeated directional force of the Hebrew command while making the list of adjacent regions readable in Tamil. It also ties “கானானியரின் நாடு” directly to the coastal phrase, avoiding the misleading implication that it modifies the entire preceding sequence. No doctrinal interpretation has been added.
