base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/007.yaml
  text: Turn and set out for yourselves[a], and go to the hill country of the Amorites and to all their neighbors in the Arabah, in the hill country, in the lowland, in the Negev, and on the coast of the sea—the land of the Canaanites—and Lebanon, as far as the great river, the Euphrates River.
translation:
  language: ta
  text: 'திரும்பிப் புறப்பட்டு, எமோரியரின் மலைநாட்டிற்கும் அதன் சுற்றுப்புறங்களாகிய எல்லாப் பகுதிகளுக்கும் செல்லுங்கள்: அரபாவிலும், மலைநாட்டிலும், ஷெபெலாவிலும்[a], நெகேவிலும், கடற்கரையிலுள்ள கானானியரின் நாட்டிலும், லெபனோனிலும், பெரிய நதியான யூபிராத்து நதிவரையிலும் செல்லுங்கள்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தாழ்நிலப் பகுதியில்”; “ஷெபெலா” என்பது மேற்கிலுள்ள தாழ்நில/மலையடிவாரப் பிரதேசத்தின் பெயர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּנוּ
  choice: திரும்பி
  rationale: פנה என்ற கட்டளை வடிவம் பயணத்திற்கு முன் திசையை மாற்றுவதைக் குறிக்கிறது; ‘திரும்பி’ என்பது கட்டளையின் நேரடியான வலிமையை இயல்பான தமிழில் காக்கிறது.
- source_word: וּסְעוּ לָכֶם
  choice: புறப்பட்டு
  rationale: נסע இச்சூழலில் முகாமை விட்டு பயணத்தைத் தொடங்குவதைக் குறிக்கிறது. לָכֶם இங்கு இயல்பான எபிரெய வழக்கு; தமிழில் செயற்கையான ‘உங்களுக்காக’ என்பதைச் சேர்க்காமல் பன்மைக் கட்டளை வடிவத்தில் அதன் தொடர்பு வெளிப்படுகிறது.
- source_word: וּבֹאוּ
  choice: செல்லுங்கள்
  rationale: בוא என்பதற்கு ‘வருதல்/நுழைதல்’ என்ற பொருள்கள் இருந்தாலும், இங்கு இலக்கை நோக்கிய கட்டளைத் தொடரில் ‘செல்லுங்கள்’ இயல்பான தமிழ்.
- source_word: הַר הָאֱמֹרִי
  choice: எமோரியரின் மலைநாடு
  rationale: הַר இங்கு தனி மலையைக் காட்டாமல் உயர்நிலப் பிரதேசத்தைக் குறிக்கிறது; இனப்பெயர் கூட்டுப் பொருளில் இருப்பதால் ‘எமோரியர்’ என வழங்கப்பட்டது.
- source_word: שְׁכֵנָיו
  choice: அதைச் சுற்றியுள்ள எல்லாப் பகுதிகள்
  rationale: சொல்லுக்கு நேராக ‘அதன் அயலார்கள்’ என்றாலும், நிலப்பகுதியைச் சார்ந்த புவியியல் பட்டியலில் அடுத்துள்ள பிரதேசங்கள் என்ற பொருள் தமிழில் தெளிவாகவும் இயல்பாகவும் தரப்படுகிறது.
- source_word: בָּעֲרָבָה
  choice: அரபா
  rationale: இது யோர்தான் பிளவுப் பள்ளத்தாக்குப் பகுதியைக் குறிக்கும் புவியியல் பெயர்; பொதுவான ‘சமவெளி’ என்று மொழிபெயர்க்காமல் பெயரே தக்கவைக்கப்பட்டது.
- source_word: בָהָר
  choice: மலைநாடு
  rationale: இங்கு הַר உயர்நிலப் பகுதியைக் குறிக்கிறது; ‘மலைநாடு’ தமிழில் புவியியல் தன்மையைத் தெளிவாகக் காட்டுகிறது.
- source_word: וּבַשְּׁפֵלָה
  choice: ஷெபெலா
  rationale: שְׁפֵלָה குறிப்பாக மேற்கத்திய தாழ்நில/மலையடிவாரப் பிரதேசத்தின் பெயராக வருவதால் ஒலிபெயர்ப்பு முதன்மை உரையில் வைக்கப்பட்டு, பொருள் அடிக்குறிப்பில் தரப்பட்டது.
- source_word: וּבַנֶּגֶב
  choice: நெகேவ்
  rationale: புவியியல் பகுதிகளின் பட்டியலில் வருவதால் பொதுவான ‘தெற்கு’ என்பதற்குப் பதிலாக குறிப்பிட்ட பிரதேசப் பெயர் தக்கவைக்கப்பட்டது.
- source_word: וּבְחוֹף הַיָּם
  choice: கடற்கரை
  rationale: חוֹף הַיָּם என்பதன் இயல்பான நவீனத் தமிழ் வடிவம் ‘கடற்கரை’; பொருளை மிகைப்படுத்தாமல் சுருக்கமாகத் தருகிறது.
- source_word: אֶרֶץ הַכְּנַעֲנִי
  choice: கானானியரின் நாடு
  rationale: இனப்பெயர் கூட்டுப் பொருளில் உள்ளது; தமிழில் பன்மைச் சமூகத்தைக் குறிக்கும் ‘கானானியர்’ இயல்பானது.
- source_word: וְהַלְּבָנוֹן
  choice: லெபனோன்
  rationale: எபிரெயில் சுட்டுப்பெயரடை இருந்தாலும், தமிழில் நிலையான இடப்பெயராக ‘லெபனோன்’ மட்டும் இயல்பாக உள்ளது.
- source_word: עַד הַנָּהָר הַגָּדֹל נְהַר פְּרָת
  choice: பெரிய நதியான யூபிராத்து நதிவரைக்கும்
  rationale: ‘பெரிய நதி’ என்பதையும் அதற்கான விளக்கப் பெயரான ‘யூபிராத்து நதி’ என்பதையும் மூலத்தின் அமைப்புப்படி தக்கவைக்கிறது.
theological_decisions:
- issue: אֶרֶץ הַכְּנַעֲנִי என்ற சொற்றொடரின் தொடர்பு
  choice: முன்னுள்ள புவியியல் பகுதிகளை விளக்கும் தொடராக அமைத்தல்
  alternative: ‘கானானியரின் நாட்டிற்கும்’ என்று முற்றிலும் தனியான பட்டியல் உறுப்பாக அமைத்தல்
  rationale: எபிரெயில் இச்சொற்றொடர் முன்னுள்ள பிரதேசப்பட்டியலுக்கு இணைப்புரைபோல் நிற்க முடியும். தமிழ் வாக்கியம் அதை ‘உள்ள கானானியரின் நாடு’ என இயல்பாக்குகிறது; இருப்பினும் முழுப் பட்டியலின் எல்லா இடங்களும் ஒரே விதத்தில் வரையறுக்கப்படுகின்றன என்ற தேவையற்ற கோட்பாட்டுத் தீர்மானம் சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையில் மரியாதைமிக்க பன்மைக் கட்டளை நடை பயன்படுத்தப்பட்டது. அரபா, ஷெபெலா, நெகேவ் போன்ற குறிப்பிட்ட புவியியல் பெயர்கள் ஒலிபெயர்க்கப்பட்டன; தேவையான விளக்கம் அடிக்குறிப்பில் வழங்கப்பட்டது.
