translation_notes:
  register: நவீன நிலையான தமிழில், நேரடியான கட்டளைத் தொனியையும் மரியாதைப் பன்மையையும் காக்கும் இயல்பான, கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. அடிக்குறிப்பு குறியீடு அது விளக்கும் ‘செங்கடல்’ என்பதற்குப் பின் வைக்கப்பட்டுள்ளது.
