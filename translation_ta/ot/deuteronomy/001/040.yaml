  text: וְ/אַתֶּ֖ם פְּנ֣וּ לָ/כֶ֑ם וּ/סְע֥וּ הַ/מִּדְבָּ֖רָ/ה דֶּ֥רֶךְ יַם סֽוּף־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/040.yaml
  text: But as for you[a], turn yourselves around and set out for the wilderness by the way of the Red Sea.
translation:
  language: ta
  text: ஆனால் நீங்களோ, திரும்பி, செங்கடல்[a] வழியாகப் பாலைவனத்தை நோக்கிப் புறப்படுங்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, இன்னும் சொல்லுக்குச் சொல்லாக, “நாணல் கடல்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַתֶּם
  choice: ஆனால் நீங்களோ
  rationale: இணைப்புச்சொல்லுடன் வரும் தனிப்பட்ட சுட்டுப்பெயர், முந்தைய தீர்ப்புக்கு மாறாக இப்போது இவர்களுக்குக் கொடுக்கப்படும் கட்டளையை வலியுறுத்துகிறது; ‘நீங்களோ’ அந்த எதிர்மறை ஒப்பீட்டையும் வலியுறுத்தலையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: פְּנוּ לָכֶם
  choice: திரும்பி
  rationale: இச்சொற்றொடர் பயணத் திசையை மாற்றும்படி கட்டளையிடுகிறது. எபிரெய மொழியின் לָכֶם தரும் வலியுறுத்தலைத் தமிழில் தனியாகப் பிரதிபெயர்த்தால் செயற்கையாகிவிடும்; சூழலில் ‘திரும்பி’ என்பதே திசைமாற்றத்தைத் தெளிவாகக் காட்டுகிறது.
- source_word: וּ/סְעוּ
  choice: புறப்படுங்கள்
  rationale: נסע என்பது முகாமிலிருந்து கிளம்பிப் பயணத்தைத் தொடங்குவதைக் குறிக்கிறது; ‘புறப்படுங்கள்’ என்பது நவீனத் தமிழில் இயல்பான பயணக் கட்டளை.
- source_word: הַמִּדְבָּרָה
  choice: பாலைவனத்தை நோக்கி
  rationale: இறுதியில் உள்ள திசைகாட்டும் ה, பாலைவனத்தை நோக்கிய இயக்கத்தைக் குறிக்கிறது; சென்றடைதல் அல்லது உள்ளே நுழைதலை அளவுக்கு மீறி குறிப்பிடாமல் ‘நோக்கி’ அதைப் பாதுகாக்கிறது.
- source_word: דֶּרֶךְ
  choice: வழியாக
  rationale: இங்கு דֶּרֶךְ பயணப் பாதையையோ வழித்தடத்தையோ அறிமுகப்படுத்துகிறது; ‘வழியாக’ அதனைத் தெளிவாகவும் சுருக்கமாகவும் வெளிப்படுத்துகிறது.
- source_word: יַם סוּף
  choice: செங்கடல்
  rationale: இது வழக்கில் நிலைபெற்ற புவியியல் பெயர். எனினும், எபிரெயச் சொற்றொடரின் நேரடியான பொருளான ‘நாணல் கடல்’ அடிக்குறிப்பில் தரப்பட்டுள்ளது.
