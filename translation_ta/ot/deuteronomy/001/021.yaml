- from: பார்! உன் கடவுளாகிய யாவே அந்த நாட்டை உன் முன் வைத்திருக்கிறார். உன் தந்தையரின் கடவுளாகிய யாவே[a] உனக்குச் சொன்னபடியே, மேலே சென்று அதை உரிமையாக்கிக்கொள். பயப்படாதே; கலங்காதே.
  to: பார், உன் கடவுளான யாவே அந்த நாட்டை உன் முன் வைத்திருக்கிறார். உன் தந்தையரின்[a] கடவுளான யாவே உனக்குச் சொன்னபடியே, மேலே சென்று அதைக் கைப்பற்றிக்கொள். பயப்படாதே; கலங்காதே.
  rationale: மாற்று வாசிப்புக்கான அடிக்குறிப்பை அதற்குரிய ‘தந்தையர்’ சொல்லில் நிலைநிறுத்தினோம். மேலும், நாட்டை ירשׁ செய்வதற்கான கட்டளையை நவீனத் தமிழில் இயல்பாக வெளிப்படுத்த ‘உரிமையாக்கிக்கொள்’ என்பதற்குப் பதிலாக ‘கைப்பற்றிக்கொள்’ பயன்படுத்தப்பட்டது. மற்ற எல்லா கூறுகளும் மூலத்திற்கு உண்மையாக உள்ளன.
