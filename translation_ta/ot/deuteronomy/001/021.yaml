base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/021.yaml
  text: See[a], Yahweh your God has set the land before you. Go up, take possession, just as Yahweh, the God of your fathers, has spoken to you. Do not fear or be dismayed.
translation:
  language: ta
  text: பார், உன் கடவுளான யாவே அந்த நாட்டை உன் முன் வைத்திருக்கிறார். உன் தந்தையரின்[a] கடவுளான யாவே உனக்குச் சொன்னபடியே, மேலே சென்று அதைக் கைப்பற்றிக்கொள். பயப்படாதே; கலங்காதே.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உன் முன்னோர்களின் கடவுள்.” எபிரெய மூலத்தில் “உன் தந்தையர்” என்று உள்ளது; இது உடன்படிக்கைச் சூத்திரமாக முதன்மை உரையில் காக்கப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: רְאֵה
  choice: பார்!
  rationale: ראה என்பதன் ஒருமை கட்டளை வடிவம் கவனத்தை ஈர்க்கிறது. ‘பார்!’ என்பது அதன் நேரடியான வலிமையை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய மூலத்தில் வரும் இறைத் திருப்பெயரான יהוה-வை பொதுப்பட்டப் பெயராக மாற்றாமல் ஒலிபெயர்க்கிறது.
- source_word: אֱלֹהֶיךָ
  choice: உன் கடவுள்
  rationale: இரண்டாம் நபர் ஆண்பால் ஒருமை பின்னொட்டைக் கொண்ட உடைமைத் தொடர்; இஸ்ரவேலை ஒருமையில் நேரடியாக அழைக்கும் மூல வடிவம் தமிழிலும் காக்கப்படுகிறது.
- source_word: נָתַן ... לְפָנֶיךָ
  choice: உன் முன் வைத்திருக்கிறார்
  rationale: நிலத்தை நுழைந்து கைப்பற்றுவதற்காக முன்வைத்திருப்பதைச் சுட்டும் எபிரெய மரபுத்தொடரின் பொருளையும் நிறைவுற்ற செயலின் தற்போதைய விளைவையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: הָאָרֶץ
  choice: அந்த நாடு
  rationale: உரையாடலின் சூழலில் ஏற்கெனவே அறியப்பட்ட வாக்குத்தத்தப் பிரதேசத்தை குறிக்கிறது; ‘நாடு’ என்பது நிலப்பரப்பையும் ஆட்சிப் பிரதேசத்தையும் இயல்பாகக் கூறுகிறது.
- source_word: עֲלֵה
  choice: மேலே சென்று
  rationale: அந்த நாட்டின் மலைப்பகுதியை நோக்கி முன்னேறுவதைக் குறிக்கும் கட்டளையின் திசை உணர்வைக் காக்கிறது.
- source_word: רֵשׁ
  choice: அதை உரிமையாக்கிக்கொள்
  rationale: ירשׁ இச்சூழலில் கடவுள் வழங்கும் நாட்டிற்குள் நுழைந்து அதனை உடைமையாக்குவதைக் குறிக்கிறது; செயற்பாட்டு வலிமையும் வழங்கப்பட்ட உரிமையும் இரண்டும் காக்கப்படுகின்றன.
- source_word: כַּאֲשֶׁר דִּבֶּר
  choice: சொன்னபடியே
  rationale: דבר என்பதன் அடிப்படைப் பொருளான ‘சொல்/பேசு’ என்பதைக் காக்கிறது; சூழலில் வாக்குறுதி உட்பொருளாக இருந்தாலும் அதை வெளிப்படையாகச் சேர்க்கவில்லை.
- source_word: אֱלֹהֵי אֲבֹתֶיךָ
  choice: உன் தந்தையரின் கடவுள்
  rationale: ‘தந்தையர்’ என்ற எபிரெய ஆண்பால் பன்மை உடன்படிக்கைச் சூத்திரத்தை முதன்மை உரையில் காக்கிறது; இயல்பான மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: אַל תִּירָא
  choice: பயப்படாதே
  rationale: ירא மீதான நேரடியான ஒருமைத் தடை; தெளிவான நவீன தமிழில் அச்சத்தைக் குறிக்கிறது.
- source_word: וְאַל תֵּחָת
  choice: கலங்காதே
  rationale: חתת இங்கு உள்ளம் உடைந்து தளர்வதையோ திகைப்பதையோ குறிக்கிறது. ‘கலங்காதே’ என்பது முந்தைய ‘பயப்படாதே’ என்பதோடு பொருத்தமாக இருந்தாலும் அதன் பொருளில் முற்றிலும் கரையாமல் தனித்த நுணுக்கத்தைத் தருகிறது.
theological_decisions:
- issue: יהוה என்ற இறைத் திருப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூல உரை பொதுப்பட்டப் பெயரை அல்ல, நான்கு எழுத்துகளைக் கொண்ட உடன்படிக்கைத் திருப்பெயரை நேரடியாகப் பயன்படுத்துகிறது. ஆகவே அந்தப் பெயர் ஒலிபெயர்க்கப்படுகிறது.
- issue: אֱלֹהֵי אֲבֹתֶיךָ என்ற பாலினம் குறிக்கப்பட்ட உடன்படிக்கைச் சூத்திரம்
  choice: உன் தந்தையரின் கடவுள்
  alternative: உன் முன்னோர்களின் கடவுள்
  rationale: எபிரெயச் சொல் இலக்கணத்திலும் சொற்பொருளிலும் ‘தந்தையர்’ என்று ஆண்பால் பன்மையில் உள்ளது. முக்கியமான உடன்படிக்கைச் சூத்திரத்தின் வடிவத்தை முதன்மை உரை காக்கிறது; விரிவான இயல்பான பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் நேரடியான, கண்ணியமான நடையைப் பயன்படுத்துகிறது. எபிரெய மூலத்தின் இரண்டாம் நபர் ஒருமை அழைப்பு ‘உன்/உனக்கு/கொள்/ஆதே’ வடிவங்களில் தொடர்ந்து காக்கப்பட்டுள்ளது. ‘தந்தையர்’ சற்றே உயர்நடை என்றாலும் உடன்படிக்கைச் சூத்திரத்தின் துல்லியத்திற்காக வைக்கப்பட்டு, பொதுவழக்கான ‘முன்னோர்கள்’ அடிக்குறிப்பில் வழங்கப்பட்டுள்ளது.
