source:
  edition: WLC
  text: לֹֽא תַכִּ֨ירוּ פָנִ֜ים בַּ/מִּשְׁפָּ֗ט כַּ/קָּטֹ֤ן כַּ/גָּדֹל֙ תִּשְׁמָע֔וּ/ן לֹ֤א תָג֨וּרוּ֙ מִ/פְּנֵי אִ֔ישׁ כִּ֥י הַ/מִּשְׁפָּ֖ט לֵ/אלֹהִ֣ים ה֑וּא וְ/הַ/דָּבָר֙ אֲשֶׁ֣ר יִקְשֶׁ֣ה מִ/כֶּ֔ם תַּקְרִב֥וּ/ן אֵלַ֖/י וּ/שְׁמַעְתִּֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/017.yaml
  text: You shall not show partiality in judgment[a]; you shall hear the small and the great alike. You shall not be intimidated by any man, for the judgment belongs to God. And the matter that is too difficult for you, you shall bring to me[b], and I will hear it.
translation:
  language: ta
  text: தீர்ப்பு வழங்கும்போது பாரபட்சம் காட்டாதீர்கள்[a]. சிறியவருக்கும் பெரியவருக்கும் ஒரேபோல் செவிகொடுங்கள். எந்த மனிதனுக்கும் அஞ்சி ஒதுங்காதீர்கள்[b]; ஏனெனில் தீர்ப்பு கடவுளுக்குரியது. உங்களுக்கு மிகவும் கடினமான வழக்கை என்னிடம் கொண்டுவாருங்கள்; நான் அதைக் கேட்பேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரேயத்தில் சொல்லர்த்தமாக, ‘தீர்ப்பில் முகங்களை அறியாதீர்கள்’; இது பாரபட்சம் அல்லது பட்சபாதம் காட்டாதிருப்பதைக் குறிக்கும் மரபுத்தொடர்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘எந்த மனிதனுக்கும் பயப்படாதீர்கள்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: תַכִּירוּ פָנִים
  choice: பாரபட்சம் காட்டாதீர்கள்
  rationale: சொல்லர்த்தமாக ‘முகங்களை அறிதல்’ என்றாலும், நீதித்துறைச் சூழலில் சார்பாக அல்லது பட்சமாக நடத்துவதைச் சுட்டும் எபிரேய மரபுத்தொடர். இயல்பான நவீனத் தமிழில் அதன் சட்டநெறி வலிமையை இது தெளிவாக வெளிப்படுத்துகிறது.
- source_word: בַּמִּשְׁפָּט
  choice: தீர்ப்பு வழங்கும்போது
  rationale: இங்கு מִשְׁפָּט என்பது வெறும் கருத்துநிலையான நீதி அல்ல; வழக்கைக் கேட்டு நீதித்தீர்ப்பு வழங்கும் செயல்முறை. தமிழில் சூழலை இயல்பாகத் தெரிவிக்க வினைத்தொடராக மொழிபெயர்க்கப்பட்டது.
- source_word: כַּקָּטֹן כַּגָּדֹל
  choice: சிறியவருக்கும் பெரியவருக்கும் ஒரேபோல்
  rationale: சமூக நிலையில் தாழ்ந்தவரையும் உயர்ந்தவரையும் குறிக்கும் இணைச்சொல்லின் உருவகத்தைப் பாதுகாத்து, ‘ஒரேபோல்’ என்பதால் சமமான விசாரணையைத் தெளிவாக்குகிறது.
- source_word: תִּשְׁמָעוּן
  choice: செவிகொடுங்கள்
  rationale: நீதித்துறைச் சூழலில் ஒரு தரப்பின் வழக்கைக் கேட்பதைக் குறிக்கிறது. ‘செவிகொடுங்கள்’ என்பது அவரவர் தரப்பைக் கவனமாகவும் சமமாகவும் கேட்கும் பொருளை இயல்பாகத் தருகிறது; தீர்ப்பளித்தல் என்ற கூடுதல் பொருளைச் சேர்க்கவில்லை.
- source_word: תָגוּרוּ
  choice: அஞ்சி ஒதுங்காதீர்கள்
  rationale: ஒருவருக்கு முன்பாக அச்சத்தால் பின்வாங்குதல் அல்லது மிரளுதல் என்ற சூழல்சார் பொருளைத் தருகிறது. வினையின் சாத்தியமான அச்சப் பொருளையும் நீதிபதிகள் தங்கள் கடமையிலிருந்து ஒதுங்காதிருப்பதையும் இணைத்து வெளிப்படுத்துகிறது.
- source_word: מִפְּנֵי אִישׁ
  choice: எந்த மனிதனுக்கும்
  rationale: சொல்லர்த்தமாக ‘ஒரு மனிதனின் முன்னிலையில்/காரணமாக’ என்பதாகும். אִישׁ என்பதன் ஆண்பால் ஒருமை வடிவத்தை ‘மனிதன்’ என்று பாதுகாத்து, ‘எந்த’ என்பதால் அதன் பொதுப்பொருள் வெளிப்படுகிறது.
- source_word: כִּי הַמִּשְׁפָּט לֵאלֹהִים הוּא
  choice: ஏனெனில் தீர்ப்பு கடவுளுக்குரியது
  rationale: தீர்ப்பின் உரிமையும் அதிகாரமும் கடவுளுக்குரியவை என்ற நேரடியான இறையியல் கூற்றைப் பாதுகாக்கிறது; கடவுள் நீதிபதிகளைத் தீர்ப்பார் அல்லது இது தெய்வீகச் சட்டம் என்று விரிவுபடுத்தவில்லை.
- source_word: הַדָּבָר אֲשֶׁר יִקְשֶׁה מִכֶּם
  choice: உங்களுக்கு மிகவும் கடினமான வழக்கை
  rationale: சட்டச் சூழலில் דָּבָר என்பது தீர்மானிக்க வேண்டிய விவகாரம் அல்லது வழக்கு. ‘வழக்கு’ சூழலைத் தெளிவாக்குகிறது; יִקְשֶׁה מִכֶּם என்பது நீதிபதிகளால் தீர்க்க மிகவும் கடினமானதாக இருப்பதைக் குறிக்கிறது.
- source_word: תַּקְרִבוּן אֵלַי
  choice: என்னிடம் கொண்டுவாருங்கள்
  rationale: ஹிபீல் வடிவம் ‘அருகே கொண்டுவருதல்/முன்வைத்தல்’ என்று பொருள்படும். மேல்முறையீட்டுப் போன்ற இந்த நீதித்துறைச் சூழலில் ‘என்னிடம் கொண்டுவாருங்கள்’ இயல்பானதும் துல்லியமானதும் ஆகும்.
- source_word: וּשְׁמַעְתִּיו
  choice: நான் அதைக் கேட்பேன்
  rationale: பின்னொட்டு முன்னுள்ள ‘வழக்கு/விவகாரம்’ என்பதைக் குறிப்பதாக எடுத்துக்கொள்ளப்பட்டது. ‘கேட்பேன்’ என்பது முந்தைய שׁמע வினையோடு உள்ள தொடர்பைப் பாதுகாக்கிறது; ‘தீர்ப்பேன்’ எனக் கூடுதல் பொருள் சேர்க்கவில்லை.
theological_decisions:
- issue: ‘தீர்ப்பு கடவுளுக்குரியது’ என்ற கூற்றில் நீதித்துறை அதிகாரத்தின் அடிப்படை
  choice: மனித நீதிபதிகளின் தீர்ப்பு வழங்கும் பணி கடவுளுடைய அதிகாரத்திற்குட்பட்டது என்பதைக் கூற்றின் நேரடி வடிவிலேயே வைத்தல்.
  alternative: கடவுள் நீதிபதிகளையே பின்னர் தீர்ப்பார் என்று விளக்குதல்; அல்லது தீர்ப்பு என்பது மனித விருப்பமல்ல, தெய்வீகச் சட்டம் என்று விரிவாக்குதல்.
  rationale: எபிரேயம் தீர்ப்பு கடவுளுக்குரியது என்று மட்டுமே நேரடியாகக் கூறுகிறது. அதன் இறையியல் அழுத்தத்தையும் திறந்த பரப்பையும் பாதுகாத்து, வசனத்தில் வெளிப்படாத குறிப்பிட்ட கோட்பாட்டால் அதைத் தீர்மானிக்கவில்லை.
- issue: אִישׁ என்ற பொதுப்பொருளுள்ள ஆண்பால் ஒருமை
  choice: ‘எந்த மனிதனுக்கும்’ என்று மொழிபெயர்த்து ஆண்பால் சொல்லுருவையும் பொதுப்பொருளையும் பாதுகாத்தல்.
  alternative: ‘யாருக்கும்’ என்று முழுமையாகப் பால்நடுநிலைப்படுத்துதல்.
  rationale: மூலத்தில் இலக்கண ஆண்பால் ஒருமை உள்ளது; அதேவேளை அதன் பயன்பாடு பொதுவானது. ‘எந்த மனிதனுக்கும்’ இரு அம்சங்களையும் தமிழில் வெளிப்படுத்துகிறது.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான, பொதுவாசகருக்கு எளிதில் புரியும் தமிழ் பயன்படுத்தப்பட்டுள்ளது. சட்டச் சூழலைத் தெளிவாக்க ‘தீர்ப்பு வழங்கும்போது’ மற்றும் ‘வழக்கு’ தேர்ந்தெடுக்கப்பட்டன. ‘சிறியவர்/பெரியவர்’ என்ற மூலத்தின் சமூக உருவகம் பாதுகாக்கப்பட்டது. இரு அடிக்குறிப்பு குறிகளும் உரையில் உரிய இடங்களில் சேர்க்கப்பட்டுள்ளன.
