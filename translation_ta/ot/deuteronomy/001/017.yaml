  source_fidelity: மூல எபிரேயத்தின் சட்டச் சூழலும் கட்டளைகளின் வரிசையும் துல்லியமாகப் பாதுகாக்கப்பட்டுள்ளன. ‘பாரபட்சம் காட்டாதீர்கள்,’ ‘சிறியவருக்கும் பெரியவருக்கும் ஒரேபோல் செவிகொடுங்கள்,’ ‘அஞ்சி ஒதுங்காதீர்கள்,’ ‘தீர்ப்பு கடவுளுக்குரியது,’ மற்றும் கடினமான வழக்கை மோசேயிடம் கொண்டுவருதல் ஆகியவை மூலத்தின் பொருளுடன் ஒத்திருக்கின்றன. וּשְׁמַעְתִּיו என்பதிலுள்ள பொருள்-பின்னொட்டை ‘அதைக் கேட்பேன்’ என வழங்கியது சரியானது.
  naturalness: நடை நவீனத் தரமான தமிழிலும், சட்ட/நீதித்துறைச் சூழலுக்கேற்ற கண்ணியமான பதிவிலும் உள்ளது. ‘தீர்ப்பு வழங்கும்போது’ மற்றும் ‘வழக்கை’ ஆகியவை வாசகனுக்குச் சூழலை இயல்பாகத் தெளிவாக்குகின்றன. ‘அஞ்சி ஒதுங்காதீர்கள்’ என்பது அச்சத்தால் பின்வாங்க வேண்டாம் என்ற சூழல்சார் வலிமையை நன்றாக வெளிப்படுத்துகிறது.
  terminology: ‘பாரபட்சம்,’ ‘தீர்ப்பு,’ ‘வழக்கு,’ ‘கடவுளுக்குரியது’ ஆகிய தெரிவுகள் நிலையானவை மற்றும் துல்லியமானவை. ‘எந்த மனிதனுக்கும்’ என்பது אִישׁ-ன் ஆண்பால் ஒருமை வடிவத்தையும் அதன் பொதுப்பொருளையும் பொருத்தமாகப் பிரதிபலிக்கிறது. அடிக்குறிப்பு a-வில் எபிரேய மரபுத்தொடரின் சொல்லர்த்தமும் பொருளும் சரியாகத் தரப்பட்டுள்ளன; b-அடிக்குறிப்பு பொருத்தமான உரை இடத்தில் இணைக்கப்பட்டுள்ளது.
