base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/042.yaml
  text: 'And Yahweh said to me[a], ‘Tell them: Do not go up or fight, for I am not among you[b], lest you be struck down before your enemies.’'
translation:
  language: ta
  text: 'யாவே என்னிடம், “அவர்களிடம் சொல்: ‘நீங்கள் மேலே போகாதீர்கள்; போரிடாதீர்கள். ஏனெனில் நான் உங்கள் நடுவில் இல்லை; இல்லையெனில், உங்கள் எதிரிகளுக்கு முன்பாக நீங்கள் முறியடிக்கப்படுவீர்கள்’” என்றார்.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இறுதிக் கூற்றைச் சொல்லுக்குச் சொல், “உங்கள் எதிரிகளுக்கு முன்பாக நீங்கள் முறியடிக்கப்படாதிருப்பீர்கள்” என்றும் தரலாம். ஆனால் இச்சூழலில் அது கீழ்ப்படியாமையால் ஏற்படும் தோல்வியை எச்சரிக்கும் தொடராகப் புரிந்துகொள்ளப்படுகிறது.
    reason: எபிரெய எதிர்மறை வினை வடிவத்தின் சொற்சார்ந்த வடிவத்தையும், சூழலால் தெளிவாகும் எச்சரிக்கை விளைவையும் குறிக்கிறது.
lexical_decisions:
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய மெய்யெழுத்துப் பெயரான יהוה-ஐ பட்டப்பெயராக மாற்றாமல், உடன்படிக்கையின் தனிப்பெயராகத் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: וַיֹּאמֶר ... אֵלַי
  choice: என்னிடம் ... சொன்னார்
  rationale: மோசே தேவனுடைய உரையைப் பெற்றவர் என்பதை இயல்பான தமிழில் நேரடியாகத் தெரிவிக்கிறது.
- source_word: אֱמֹר לָהֶם
  choice: நீ அவர்களிடம் சொல்
  rationale: எபிரெய கட்டளையின் நேரடித் தன்மையையும் பன்மை மறைமுகப் பொருளையும் காக்கிறது.
- source_word: לֹא תַעֲלוּ
  choice: நீங்கள் மேலே போகவும் வேண்டாம்
  rationale: עלה என்பதன் நிலவியல் மற்றும் படையெடுப்புச் சூழலிலான ‘மேலே போதல்’ என்ற பொருளைக் காக்கிறது.
- source_word: וְלֹא תִלָּחֲמוּ
  choice: போரிடவும் வேண்டாம்
  rationale: לחם என்பதன் நிபால் வடிவம் இங்கு போரில் ஈடுபடுவதைக் குறிக்கிறது; ‘போரிடுதல்’ தெளிவான நவீனத் தமிழ்.
- source_word: כִּי אֵינֶנִּי בְּקִרְבְּכֶם
  choice: ஏனெனில் நான் உங்கள் நடுவில் இல்லை
  rationale: בקרבכם என்பதன் ‘உங்கள் நடுவில்’ என்ற இடவியல் உருவகத்தையும் யாவேயின் உடனிருப்பைக் குறிக்கும் கருத்தையும் சுருக்கமின்றிக் காக்கிறது.
- source_word: וְלֹא תִּנָּגְפוּ לִפְנֵי אֹיְבֵיכֶם
  choice: உங்கள் எதிரிகளுக்கு முன்பாக நீங்கள் முறியடிக்கப்படாதபடி அங்கே போகாதீர்கள்
  rationale: נגף என்பதன் போர்த் தோல்வி/வீழ்ச்சி உணர்வையும் எபிரெய எதிர்மறை வடிவத்தையும் காக்கும் நோக்கில், தமிழில் தடைச்சொல்லோடு இயல்பாக இணைக்கப்பட்டுள்ளது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலத்தில் பொதுப்பட்டப்பெயர் அல்ல, நான்கு மெய்யெழுத்துகளைக் கொண்ட தனிப்பெயரே உள்ளது. ஆகவே அதைத் தமிழில் ஒலிபெயர்த்து, மூலத்தின் தனிப்பெயர் தன்மையைப் பாதுகாக்கிறது.
- issue: וְלֹא תִּנָּגְפוּ என்ற இறுதிக் கூற்றின் தொடர்பு
  choice: முறியடிக்கப்படாதபடி அங்கே போகாதீர்கள்
  alternative: இல்லையெனில் நீங்கள் முறியடிக்கப்படுவீர்கள்
  rationale: சூழல் கீழ்ப்படியாமையின் விளைவாகத் தோல்வியை எச்சரித்தாலும், எபிரெய வடிவம் நேரடியாக எதிர்மறை வினையைக் கொண்டுள்ளது. தேர்ந்தெடுத்த தமிழ், எச்சரிக்கைப் பொருளைத் தெளிவாக்கியபடியே அந்த எதிர்மறை வடிவத்தைப் பாதுகாக்கிறது; மாற்று வாசிப்பு அதே நடைமுறைப் பொருளை விளைவு வாக்கியமாகச் சொல்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் மதிப்புமிக்க நேரடி உரைநடை பயன்படுத்தப்பட்டுள்ளது. ‘மேலே போ’, ‘உங்கள் நடுவில்’, ‘எதிரிகளுக்கு முன்பாக’ ஆகிய மூல உருவகங்கள் தேவையின்றி விரிவாக்கப்படவில்லை.
