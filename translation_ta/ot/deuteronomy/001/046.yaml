  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டது. மூலத்தின் மீளுரையும் இறுதித் தொடரின் உண்மையான தெளிவின்மையும் அடிக்குறிப்புடன் பாதுகாக்கப்பட்டுள்ளன.
