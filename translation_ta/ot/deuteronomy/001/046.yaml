  yaml_path: translation/ot/deuteronomy/001/046.yaml
  text: So you remained at Kadesh many days[a], according to the days that you remained there.
translation:
  language: ta
  text: அவ்வாறு நீங்கள் காதேசில் பல நாட்கள் தங்கியிருந்தீர்கள்[a]—நீங்கள் அங்கே தங்கியிருந்த நாட்களைப் போலவே.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மொழியில் சொல்லுக்குச் சொல், “பல நாட்கள்—நீங்கள் தங்கியிருந்த நாட்களைப் போல.” இறுதித் தொடர் சுருக்கமாகவும் தெளிவற்றதாகவும் உள்ளது; “நீங்கள் அங்கே தங்கியிருந்த கால அளவுக்கு, நீண்ட காலம்” என்றும் பொருள்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּשְׁבוּ
  choice: இவ்வாறு நீங்கள் … தங்கியிருந்தீர்கள்
  rationale: ישׁב இங்கு ஓரிடத்தில் தொடர்ந்து தங்கியிருப்பதைக் குறிக்கிறது. “தங்கியிருந்தீர்கள்” என்பது சூழலுக்கு இயல்பானது; தொடக்க וַ־ உரையாடலின் தொடர்ச்சியைக் காட்டுவதால் “இவ்வாறு” என வழங்கப்பட்டது.
- source_word: בְקָדֵשׁ
  choice: காதேசில்
  rationale: קָדֵשׁ என்ற இடப்பெயர் தமிழில் ஒலிபெயர்க்கப்பட்டது; இருப்பிடத்தைக் குறிக்கும் בְּ முன்னொட்டு “-இல்” என வழங்கப்பட்டது.
- source_word: יָמִים רַבִּים
  choice: பல நாட்கள்
  rationale: பெயர்ச்சொல்–பெயரடை அமைப்பை நேரடியாகப் பேணி, விளக்கமான “நீண்ட காலம்” என்பதற்குப் பதிலாக எபிரெய வெளிப்பாட்டின் வடிவம் காக்கப்பட்டது.
- source_word: כַּיָּמִים אֲשֶׁר יְשַׁבְתֶּם
  choice: நீங்கள் அங்கே தங்கியிருந்த நாட்களைப் போலவே
  rationale: כְּ ஒப்பீட்டைக் குறிக்கிறது. மூலத்தின் சுருக்கமான, ஓரளவு தெளிவற்ற அமைப்பைத் தீர்மானமாக விரித்துரைக்காமல் பேணுகிறது; “அங்கே” என்பது காதேசைத் தெளிவாகச் சுட்டுவதற்காகச் சேர்க்கப்பட்டது.
