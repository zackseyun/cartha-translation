  text: וַ/יִּשְׁמַ֥ע יְהוָ֖ה אֶת ק֣וֹל דִּבְרֵי/כֶ֑ם וַ/יִּקְצֹ֖ף וַ/יִּשָּׁבַ֥ע לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/034.yaml
  text: And Yahweh heard the sound of your words[a], and he was angry and swore, saying,
translation:
  language: ta
  text: 'யாவே உங்கள் வார்த்தைகளின் ஒலியைக் கேட்டு,[a] கோபமடைந்து, சத்தியம் செய்து கூறினார்:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரேயம்: “உங்கள் வார்த்தைகளின் குரல்.”'
    reason: எபிரேயச் சொற்றொடரில் குֹל (‘குரல்/ஒலி’) என்ற சொல்லின் நேரடி வடிவம் உள்ளது; தமிழில் ‘ஒலி’ என்று இயல்பாக வழங்கப்பட்டுள்ளது.
lexical_decisions:
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைத் திருப்பெயரான நான்கெழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் இயல்பாக ஒலிபெயர்க்கிறது.
- source_word: וַיִּשְׁמַע
  choice: கேட்டு
  rationale: இந்தத் தொடர் நிகழ்வை விவரிக்கும் சூழலில் שׁמע என்பதன் நேரான பொருள் ‘கேட்டார்’; தமிழில் அடுத்த வினைகளோடு இணைக்க வினையெச்சம் இயல்பானது.
- source_word: אֶת קוֹל דִּבְרֵיכֶם
  choice: உங்கள் வார்த்தைகளின் குரலை
  rationale: קוֹל என்பதின் ‘குரல்/ஒலி’ கூறையும் דִּבְרֵיכֶם என்பதின் ‘உங்கள் வார்த்தைகள்’ கூறையும் காக்கும்; எபிரேயச் சொற்றொடரின் தனித்துவத்தையும் பாதுகாக்கிறது.
- source_word: וַיִּקְצֹף
  choice: கோபமடைந்து
  rationale: קצף குறிக்கும் கடும் கோபத்தை தெளிவான, இக்காலத் தமிழில் தருகிறது; நிகழ்வின் முன்னேற்றத்தையும் காட்டுகிறது.
- source_word: וַיִּשָּׁבַע
  choice: ஆணையிட்டு
  rationale: שׁבע என்பதன் நிபால் வடிவம் ஆணையிடுதல் அல்லது சத்தியம் செய்தல் என்பதைக் குறிக்கிறது; இங்கு வரும் அதிகாரமிக்க உறுதிமொழிக்கு ‘ஆணையிட்டார்’ இயல்பானது.
- source_word: לֵאמֹר
  choice: சொன்னார்
  rationale: அடுத்து வரும் நேரடிக் கூற்றை அறிமுகப்படுத்துகிறது; ‘ஆணையிட்டுச் சொன்னார்’ என்பது தமிழ் உரைநடையில் இயல்பான இணைப்பு.
theological_decisions:
- issue: יְהוָה என்ற இறைத் திருப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: யெகோவா; கர்த்தர்
  rationale: மூலத்தில் பட்டம் அல்ல, இறைவனின் தனிப்பெயர் நேரடியாக வருகிறது. ஆகவே பட்டத்தால் மாற்றாமல் ‘யாவே’ என்று ஒலிபெயர்க்கப்படுகிறது.
- issue: கோபத்திற்குப் பின் வரும் வினையின் தன்மை
  choice: ஆணையிட்டார்
  alternative: சத்தியம் செய்தார்
  rationale: וַיִּשָּׁבַע ஓர் உறுதிமொழி அல்லது ஆணையைக் குறிக்கிறது. அடுத்த வசனத்தில் அதன் உள்ளடக்கம் வருவதால், தமிழில் ‘ஆணையிட்டுச் சொன்னார்’ என்று அதன் அதிகாரமிக்க தன்மையைத் தக்கவைக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில் dignified narrative register பயன்படுத்தப்பட்டுள்ளது. எபிரேயத் தொடர் வினைகள் தமிழ் வினையெச்சங்களால் இயல்பாக இணைக்கப்பட்டுள்ளன; அடுத்த வசனத்தில் தொடரும் நேரடிக் கூற்றுக்காக இறுதியில் முக்காற்புள்ளி இடப்பட்டுள்ளது.
