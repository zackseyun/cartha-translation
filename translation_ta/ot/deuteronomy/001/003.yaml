source:
  edition: WLC
  text: וַ/יְהִי֙ בְּ/אַרְבָּעִ֣ים שָׁנָ֔ה בְּ/עַשְׁתֵּֽי עָשָׂ֥ר חֹ֖דֶשׁ בְּ/אֶחָ֣ד לַ/חֹ֑דֶשׁ דִּבֶּ֤ר מֹשֶׁה֙ אֶל בְּנֵ֣י יִשְׂרָאֵ֔ל כְּ֠/כֹל אֲשֶׁ֨ר צִוָּ֧ה יְהוָ֛ה אֹת֖/וֹ אֲלֵ/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/003.yaml
  text: And it happened in the fortieth year[a], in the eleventh month, on the first day of the month[b], that Moses spoke to the sons of Israel according to all that Yahweh had commanded him to them.
translation:
  language: ta
  text: நாற்பதாம் ஆண்டின் பதினொன்றாம் மாதம், அந்த மாதத்தின் முதல் நாளில், யாவே மோசேக்கு அவர்களுக்காகக் கட்டளையிட்ட அனைத்தின்படியும் மோசே இஸ்ரவேலரிடம் பேசினார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: '[தனி வார்த்தையாக மொழிபெயர்க்கப்படவில்லை]'
  rationale: எபிரெயக் கதைநடை வடிவம் இங்கு காலக் குறிப்பை அறிமுகப்படுத்துகிறது. தமிழில் இயல்பான காலவாக்கிய அமைப்பே அதன் பங்கை நிறைவேற்றுவதால், ‘அப்போது நிகழ்ந்ததாவது’ என தேவையற்ற கனத்தைச் சேர்க்கவில்லை.
- source_word: בְּאַרְבָּעִים שָׁנָה
  choice: நாற்பதாம் ஆண்டின்
  rationale: இது நாற்பது ஆண்டுகள் என்ற காலஅளவை அல்ல, ஆண்டின் வரிசை எண்ணைக் குறிக்கும் தேதியிடும் மரபுத்தொடர்.
- source_word: בְּעַשְׁתֵּי עָשָׂר חֹדֶשׁ
  choice: பதினொன்றாம் மாதம்
  rationale: எபிரெய எண்ணமைப்பு இங்கு மாதத்தின் வரிசை எண்ணாகச் செயல்படுகிறது.
- source_word: בְּאֶחָד לַחֹדֶשׁ
  choice: அந்த மாதத்தின் முதல் நாளில்
  rationale: ‘மாதத்தின் ஒன்றில்’ என்ற எபிரெயத் தேதியிடும் மரபுத்தொடரைத் தெளிவான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: דִּבֶּר
  choice: பேசினார்
  rationale: பேச்சுச் செயலின் தன்மையை மேலதிகமாக விளக்காமல், எபிரெய வினையின் பரந்த பொருளைத் தக்கவைக்கிறது.
- source_word: אֶל בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலரிடம்
  rationale: சொல்லுக்குச் சொல் ‘இஸ்ரவேலின் மகன்களிடம்’ என்றாலும், இச்சூழலில் மக்களாகிய இஸ்ரவேலைக் குறிக்கும் இயல்பான, உள்ளடக்கமான தமிழ்ச் சொல் இது.
- source_word: כְּכֹל אֲשֶׁר
  choice: அனைத்தின்படியும்
  rationale: மோசேயின் பேச்சு யெகோவா கட்டளையிட்ட முழுமைக்கும் ஏற்ப இருந்தது என்ற ஒத்திசைவு நுட்பத்தைப் பாதுகாக்கிறது.
- source_word: צִוָּה
  choice: கட்டளையிட்ட
  rationale: யெகோவாவின் கட்டளை மோசேயின் பேச்சுக்கு முன்னதாக இருந்ததைத் தமிழின் பெயரெச்ச அமைப்பு இயல்பாகக் காட்டுகிறது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: தேவனுடைய தனிப்பெயரான நான்கு எழுத்துப் பெயரை பொதுப்பட்டமான ‘கர்த்தர்’ என மாற்றாமல், தமிழில் நீண்டகாலமாக அறியப்பட்ட பெயருருவில் தருகிறது.
- source_word: אֹתוֹ אֲלֵהֶם
  choice: தம்மிடம் இஸ்ரவேலருக்குச் சொல்லும்படி
  rationale: சொல்லுக்குச் சொல் அமைப்பு ‘அவரை அவர்களிடம் கட்டளையிட்டார்’ எனச் சுருக்கமாகவும் தமிழில் தெளிவற்றதாகவும் அமையும். மோசே பெற்ற கட்டளை இஸ்ரவேலரிடம் தெரிவிக்க வேண்டியதென்பதை இந்த மொழியாக்கம் இயல்பாக வெளிப்படுத்துகிறது; மூலத்தின் இலக்கு/தொடர்பு நுட்பமும் காக்கப்படுகிறது.
theological_decisions:
- issue: יְהוָה என்ற தேவப்பெயரின் மொழியாக்கம்
  choice: யெகோவா
  alternative: யாவே; கர்த்தர்
  rationale: மூலத்தில் தனிப்பெயர் நேரடியாக இருப்பதால் பொதுப்பட்டத்தைப் பயன்படுத்தவில்லை. நவீன தமிழ்க் கிறிஸ்தவப் பயன்பாட்டில் பரவலாக அறியப்படும் ஒலிபெயர்ப்பைத் தேர்ந்தெடுத்தோம்; ‘யாவே’ என்பது மூல உச்சரிப்பை மீட்டமைக்க முயலும் மாற்று வடிவம்.
- issue: אֹתוֹ אֲלֵהֶם என்ற சுருக்கமான தொடரின் பொருள்
  choice: தம்மிடம் இஸ்ரவேலருக்குச் சொல்லும்படி கட்டளையிட்ட
  alternative: அவரைப் பற்றி தம்மிடம் கட்டளையிட்ட; அவர்களிடம் அவருக்குக் கட்டளையிட்ட
  rationale: இலக்கணத் தொடரில் ஓரளவு சுருக்கமும் உறவுத் தெளிவின்மையும் இருந்தாலும், உடனடிச் சூழல் மோசே இஸ்ரவேலிடம் தேவனுடைய கட்டளையைச் சொன்னதைச் சுட்டுகிறது. தமிழில் புரியாத சொற்சொல் வடிவத்தை விட அந்தத் தொடர்பை வெளிப்படையாகக் கூறுகிறது; கூடுதல் இறையியல் உள்ளடக்கம் சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீன செந்தமிழுக்கு நெருக்கமான, ஆனால் பொதுவாசகர்களுக்கு எளிதில் புரியும் கண்ணியமான நடை. தேவையற்ற பழமொழிநடை தவிர்க்கப்பட்டுள்ளது. வசனம் ஒரு தொடர்ச்சியான காலவாக்கியமாக அமைக்கப்பட்டு எபிரெய உரையின் தகவல் வரிசை பெரும்பாலும் பாதுகாக்கப்பட்டுள்ளது.
