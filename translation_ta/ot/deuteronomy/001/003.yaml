revisions:
- from: நாற்பதாம் ஆண்டின் பதினொன்றாம் மாதம், அந்த மாதத்தின் முதல் நாளில், யெகோவா தம்மிடம் இஸ்ரவேலருக்குச் சொல்லும்படி கட்டளையிட்ட அனைத்தின்படியும் மோசே அவர்களிடம் பேசினார்.
  to: நாற்பதாம் ஆண்டின் பதினொன்றாம் மாதம், அந்த மாதத்தின் முதல் நாளில், யாவே மோசேக்கு அவர்களுக்காகக் கட்டளையிட்ட அனைத்தின்படியும் மோசே இஸ்ரவேலரிடம் பேசினார்.
  rationale: The revision replaces the denominationally distinct form “யெகோவா” with “யாவே,” corresponding to the required Yahweh rendering. It also removes the interpretively expanded infinitive “சொல்லும்படி” and uses “மோசேக்கு அவர்களுக்காகக் கட்டளையிட்ட,” which is idiomatic Tamil while retaining the Hebrew phrase's compressed, somewhat ambiguous relation. The supplied notes identify the two principal lexical/grammatical alternatives without altering the verse's meaning.
