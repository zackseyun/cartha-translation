  text: יְהוָ֞ה אֱלֹהֵ֣י אֲבֽוֹתֵ/כֶ֗ם יֹסֵ֧ף עֲלֵי/כֶ֛ם כָּ/כֶ֖ם אֶ֣לֶף פְּעָמִ֑ים וִ/יבָרֵ֣ךְ אֶתְ/כֶ֔ם כַּ/אֲשֶׁ֖ר דִּבֶּ֥ר לָ/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/011.yaml
  text: May Yahweh[a], the God of your fathers, make you a thousand times as many as you are, and bless you[b], just as he has promised you.
translation:
  language: ta
  text: உங்கள் தந்தையரின்[a] கடவுளாகிய யாவே, உங்கள் எண்ணிக்கையை இப்போது இருப்பதைவிட ஆயிரம் மடங்காகப் பெருக்குவாராக; உங்களிடம் பேசியபடியே[b] உங்களை ஆசீர்வதிப்பாராக.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உங்கள் முன்னோர்களின்.” எபிரெயில் சொற்சொல்லாக “உங்கள் தந்தையரின்” என்று உள்ளது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “உங்களுக்கு வாக்குறுதி அளித்தபடியே.” எபிரெயில் சொற்சொல்லாக “உங்களிடம் பேசியபடியே” என்று உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: யாவே
  rationale: இஸ்ரவேலின் கடவுளுடைய தனிப்பட்ட உடன்படிக்கைப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் ஒலிபெயர்த்துள்ளது.
- source_word: אֱלֹהֵי אֲבֹתֵיכֶם
  choice: உங்கள் தந்தையரின் கடவுள்
  rationale: எபிரெயச் சொற்றொடரின் ஆண்பால் வடிவத்தையும் முற்பிதாக்களுடனான உடன்படிக்கைத் தொடர்பையும் காக்கிறது; பொதுவான பொருளான ‘முன்னோர்கள்’ அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: יֹסֵף עֲלֵיכֶם כָּכֶם אֶלֶף פְּעָמִים
  choice: உங்கள் எண்ணிக்கையை இப்போது இருப்பதைவிட ஆயிரம் மடங்கு பெருகச் செய்து
  rationale: ‘சேர்க்கட்டும்’ என்ற மூல உருவகத்தைச் சொற்சொல்லாகக் கட்டாயப்படுத்தாமல், மக்களின் தற்போதைய எண்ணிக்கை ஆயிரம் மடங்காக வேண்டும் என்ற வாழ்த்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: וִיבָרֵךְ אֶתְכֶם
  choice: உங்களை ஆசீர்வதிப்பாராக
  rationale: முன்னுள்ள வினையோடு தொடரும் வாழ்த்து அல்லது வேண்டுதல் உணர்வை ‘-ஆராக’ வடிவம் தெளிவாகக் காட்டுகிறது.
- source_word: כַּאֲשֶׁר דִּבֶּר לָכֶם
  choice: உங்களிடம் பேசியபடியே
  rationale: דבר என்பதன் விரிவான ‘பேசு’ பொருளைத் தக்கவைத்து, அதை மறைமுகமாக ‘வாக்குறுதி அளித்தார்’ என்று மட்டும் தீர்மானிக்காமல் ambiguity-ஐ காக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற உடன்படிக்கைப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலத்தில் தனிப்பட்ட இறைப் பெயர் நேரடியாக இருப்பதால், பட்டமாக மாற்றாமல் பொதுவாக ஏற்றுக்கொள்ளப்பட்ட ஒலிபெயர்ப்பு பயன்படுத்தப்படுகிறது.
- issue: אֲבֹתֵיכֶם என்பதிலுள்ள மூதாதையர் குறிப்பு
  choice: உங்கள் தந்தையர்
  alternative: உங்கள் முன்னோர்கள்
  rationale: எபிரெயில் உள்ள சொற்சார்ந்த ஆண்பால் குறிப்பையும் உடன்படிக்கை வரலாற்றுத் தொடர்பையும் முதன்மை உரை காக்கிறது; பரந்த இயல்பான பொருள் அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
- issue: דִּבֶּר என்பதன் சூழல்சார் பொருள்
  choice: பேசியபடியே
  alternative: வாக்குறுதி அளித்தபடியே
  rationale: இங்கு கூறப்பட்டது வாக்குறுதியாகப் புரிந்துகொள்ளப்படலாம்; இருப்பினும் மூல வினை பொதுவாக ‘பேசு’ என்பதால், முதன்மை உரை அதன் அகலத்தையும் இறையியல் நுணுக்கத்தையும் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பானதும் மரியாதைமிக்கதுமான நடை. இறுதி ‘ஆசீர்வதிப்பாராக’ முழு வாக்கியத்தையும் வாழ்த்தாக அமைக்கிறது. ‘எண்ணிக்கை’ என்பது சூழலில் மறைந்திருக்கும் மக்கள் பெருக்கத்தைத் தெளிவாக்கும் குறைந்தளவு விளக்கச் சேர்க்கை.
