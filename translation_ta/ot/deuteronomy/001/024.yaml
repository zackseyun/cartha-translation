translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதாகவும் கண்ணியமாகவும் அமைந்த உரை. எபிரெய நிலவியல் சொல்லின் பொருள் விரிவை அடிக்குறிப்பு பாதுகாக்கிறது.
