source:
  edition: WLC
  text: וַ/יִּפְנוּ֙ וַ/יַּעֲל֣וּ הָ/הָ֔רָ/ה וַ/יָּבֹ֖אוּ עַד נַ֣חַל אֶשְׁכֹּ֑ל וַֽ/יְרַגְּל֖וּ אֹתָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/024.yaml
  text: So they turned and went up into the hill country[a], and came as far as the Valley of Eshcol, and spied it out.
translation:
  language: ta
  text: அவர்கள் திரும்பி மலைநாட்டிற்கு ஏறிச் சென்று, எஷ்கோல் பள்ளத்தாக்கு[a] வரை வந்து, அந்தப் பகுதியை உளவு பார்த்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எஷ்கோல் ஓடைப்பள்ளம்” அல்லது “எஷ்கோல் ஓடை”; எபிரெயச் சொல் பருவகால நீரோடை ஓடும் பள்ளத்தாக்கையும் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְנוּ
  choice: அவர்கள் திரும்பி
  rationale: פנה என்பதன் நேரடியான இயக்கப் பொருளான ‘திரும்புதல்’ என்பதையும் தொடர்கதை ஓட்டத்தையும் காக்கிறது.
- source_word: וַיַּעֲלוּ
  choice: சென்று
  rationale: עלה உயர்நிலத்தை நோக்கிய இயக்கத்தைக் குறிக்கிறது; அடுத்துவரும் ‘மலைநாட்டிற்கு’ என்பதால் தமிழில் இயல்பாக ‘சென்று’ என வழங்கப்படுகிறது; நிலவியல் ஏற்றம் இலக்கால் தெளிவாகிறது.
- source_word: הָהָרָה
  choice: மலைநாட்டிற்கு
  rationale: திசையைக் குறிக்கும் ־ה முடிவையும், தனியொரு மலையைவிட மலைப்பாங்கான பிரதேசத்தைக் குறிக்கும் சூழலையும் வெளிப்படுத்துகிறது.
- source_word: וַיָּבֹאוּ עַד
  choice: வரை வந்து
  rationale: בוא உடன் வரும் עַד, அவர்கள் சென்றடைந்த எல்லைப்புள்ளியைச் சுட்டுவதால் ‘வரை வந்து’ என மொழிபெயர்க்கப்படுகிறது.
- source_word: נַחַל אֶשְׁכֹּל
  choice: எஷ்கோல் பள்ளத்தாக்கு
  rationale: נחל என்பது பள்ளத்தாக்கு, ஓடைப்பள்ளம் அல்லது பருவகால நீரோடை ஆகியவற்றைக் குறிக்கலாம்; முதன்மை உரையில் இயல்பான நிலவியல் சொல்லாக ‘பள்ளத்தாக்கு’ தேர்ந்தெடுக்கப்பட்டு, மாற்றுப் பொருள் அடிக்குறிப்பில் காக்கப்படுகிறது.
- source_word: וַיְרַגְּלוּ
  choice: உளவுபார்த்தார்கள்
  rationale: பியேல் வடிவிலுள்ள רגל வெறுமனே சுற்றிப்பார்ப்பதை அல்ல, உளவு அல்லது நில ஆய்வு செய்வதைக் குறிக்கிறது.
- source_word: אֹתָהּ
  choice: அந்தப் பகுதியை
  rationale: பெண்பால் ஒருமை சுட்டுப்பெயரின் குறிப்பு சூழலில் ஆராயப்பட்ட நிலம் அல்லது பிரதேசம் ஆகும்; தமிழில் தெளிவுக்காக ‘அந்தப் பகுதியை’ என வெளிப்படுத்தப்படுகிறது.
