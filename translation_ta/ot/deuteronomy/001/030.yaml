  text: יְהוָ֤ה אֱלֹֽהֵי/כֶם֙ הַ/הֹלֵ֣ךְ לִ/פְנֵי/כֶ֔ם ה֖וּא יִלָּחֵ֣ם לָ/כֶ֑ם כְּ֠/כֹל אֲשֶׁ֨ר עָשָׂ֧ה אִתְּ/כֶ֛ם בְּ/מִצְרַ֖יִם לְ/עֵינֵי/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/030.yaml
  text: Yahweh your God[a], who goes before you, will himself fight for you, just as he did for you in Egypt before your eyes.
translation:
  language: ta
  text: எகிப்தில் உங்கள் கண்முன்னே அவர் உங்களுக்காகச் செய்ததுபோலவே, உங்களுக்கு முன்பாகச் செல்கிற உங்கள் கடவுளாகிய யாவே தாமே உங்களுக்காகப் போரிடுவார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரெய மொழியில் சொல்லுக்குச் சொல்: “உங்களோடு செய்தது.” இச்சொற்றொடர் எகிப்தில் இஸ்ரவேலருக்காக யாவே செய்தவற்றைக் குறிக்கிறது.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைவனின் தனிப்பெயரான நான்கெழுத்துப் பெயரை ஒரு பட்டப்பெயரால் மாற்றாமல், அதன் பொதுவாக ஏற்றுக்கொள்ளப்பட்ட ஒலிபெயர்ப்பைத் தமிழில் தருகிறது.
- source_word: אֱלֹהֵיכֶם
  choice: உங்கள் கடவுள்
  rationale: இங்கு யாவேயைக் குறிக்கும் ஒருமைப் பொருள் சூழலால் தெளிவாக இருப்பதால், இயல்பான தமிழில் ஒருமையாக மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: הַהֹלֵךְ לִפְנֵיכֶם
  choice: உங்களுக்கு முன்பாகச் செல்கிற
  rationale: பங்கேற்புவினை வடிவம் தொடர்ச்சியான வழிநடத்தலைக் குறிக்கிறது; இத்தமிழாக்கம் அந்தச் செயற்பாட்டை இயல்பாகப் பாதுகாக்கிறது.
- source_word: הוּא
  choice: தாமே
  rationale: தனித்துச் சொல்லப்பட்ட எபிரெயச் சுட்டுப்பெயரின் வலியுறுத்தலை மரியாதையுடனும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: יִלָּחֵם לָכֶם
  choice: உங்களுக்காகப் போரிடுவார்
  rationale: לחם வினையின் நிஃபால் வடிவம் இங்கு இஸ்ரவேலரின் சார்பாகப் போரிடுவதைக் குறிக்கிறது.
- source_word: כְּכֹל אֲשֶׁר
  choice: செய்தது போலவே
  rationale: முந்தைய இறைச்செயலுடன் செய்யப்படும் ஒப்பீட்டைத் தெளிவாகத் தருகிறது.
- source_word: עָשָׂה אִתְּכֶם
  choice: உங்களுக்காகச் செய்தது
  rationale: சொல்லுக்குச் சொல் வடிவம் ‘உங்களோடு செய்தது’ என்றாலும், எகிப்தில் இஸ்ரவேலரின் நலனுக்காக யாவே செயல்பட்டார் என்பதே சூழற்பொருள்; தமிழில் ‘உங்களுக்காக’ என்பது தெளிவும் இயல்பும் உடையது.
- source_word: בְּמִצְרַיִם
  choice: எகிப்தில்
  rationale: இடத்தைக் குறிக்கும் முன்னொட்டின் நேரான, வழக்கமான தமிழாக்கம்.
- source_word: לְעֵינֵיכֶם
  choice: உங்கள் கண்முன்னே
  rationale: இஸ்ரவேலர் நேரில் கண்ட இறைச்செயலை வலியுறுத்தும் எபிரெய மரபுத்தொடரை இயல்பான தமிழில் தருகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: ஆண்டவர்; யெகோவா
  rationale: மூல உரை இறைவனின் தனிப்பெயரை நேரடியாகப் பயன்படுத்துவதால், பட்டப்பெயரால் மாற்றாமல் ‘Yahweh’ என்பதற்குரிய தமிழ் ஒலிபெயர்ப்பு பயன்படுத்தப்பட்டுள்ளது.
- issue: போரிடுபவர் யார் என்பதிலுள்ள வலியுறுத்தல்
  choice: தாமே
  alternative: அவர்
  rationale: הוּא என்ற தனிச் சுட்டுப்பெயர், யாவே தனிப்பட்ட முறையில் இஸ்ரவேலருக்காகப் போரிடுவார் என்பதை வலியுறுத்துகிறது; இதனைத் தமிழில் ‘தாமே’ பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகருக்குப் புரியும் கண்ணியமான நடையைக் கடைப்பிடிக்கிறது. ‘தாமே’ மூலம் மூலத்தின் வலியுறுத்தல் பாதுகாக்கப்படுகிறது. தமிழ் வாக்கிய நிறைவைத் தெளிவாக்குவதற்காக ஒப்பீட்டு உட்பிரிவுக்குப் பின் ‘அவர் செய்வார்’ வெளிப்படையாகச் சேர்க்கப்பட்டுள்ளது; இது புதிய பொருளைச் சேர்ப்பதில்லை.
