  text: Then I said to you, ‘Do not be terrified of them, and do not fear them.’
translation:
  language: ta
  text: அப்போது நான் உங்களிடம், “அவர்களைக் கண்டு திகிலடையாதீர்கள்; அவர்களுக்குப் பயப்படாதீர்கள்” என்றேன்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לֹא תַעַרְצוּן
  choice: திகிலடையாதீர்கள்
  rationale: ערץ என்பதன் தீவிரமான அச்சம் அல்லது திகில் என்ற நுண்பொருளை, இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: וְלֹא תִירְאוּן
  choice: அவர்களுக்குப் பயப்படாதீர்கள்
  rationale: ירא என்பதற்கான பொதுவான ‘பயப்படுதல்’ என்ற பொருளைப் பேணி, முந்தைய வினையிலிருந்து உள்ள சொற்பொருள் வேறுபாட்டையும் காக்கிறது.
- source_word: מֵהֶם
  choice: அவர்களைக் கண்டு / அவர்களுக்குப்
  rationale: இரண்டு இணையான அச்ச வினைகளுக்கும் தொடர்புடைய ‘அவர்களால்/அவர்களை முன்னிட்டு’ என்ற எபிரெயப் பொருளை இயல்பான தமிழ் வேற்றுமை உருபுகளால் தருகிறது.
theological_decisions: []
translation_notes:
  register: மோசே மக்களிடம் நேரடியாகச் சொல்வதற்கேற்ற மரியாதைப் பன்மையும், எளிய ஆனால் கண்ணியமான நவீனத் தமிழ் நடையும் பயன்படுத்தப்பட்டுள்ளன. எபிரெயத்தில் உள்ள இரு வேறுபட்ட அச்சச் சொற்களும் தமிழில் தனித்தனியாகப் பேணப்பட்டுள்ளன.
