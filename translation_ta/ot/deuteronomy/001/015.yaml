base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/015.yaml
  text: 'So I took the heads of your tribes[a], wise and knowledgeable men, and appointed them as heads over you: commanders of thousands, commanders of hundreds, commanders of fifties, commanders of tens, and officers for your tribes.'
translation:
  language: ta
  text: 'ஆகவே, உங்கள் கோத்திரங்களின் தலைவர்களான, ஞானமும் அறிவும் உடைய ஆண்களை[a] நான் எடுத்துக்கொண்டு, அவர்களை உங்கள்மேல் தலைவர்களாக நியமித்தேன்: ஆயிரம் பேருக்குத் தலைவர்கள், நூறு பேருக்குத் தலைவர்கள், ஐம்பது பேருக்குத் தலைவர்கள், பத்துப் பேருக்குத் தலைவர்கள், உங்கள் கோத்திரங்களுக்கான அதிகாரிகள்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அறிவும் உடைய ஆண்கள்” என்பதற்கு “நன்கு அறியப்பட்ட ஆண்கள்” என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் அறிவுடையவர்களையோ, அறியப்பட்டு அங்கீகரிக்கப்பட்டவர்களையோ குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶקַּח
  choice: ஆகவே ... நான் தேர்ந்தெடுத்து
  rationale: வாவ் தொடர்வினை கதைநடப்பின் அடுத்த செயலைக் குறிக்கிறது. לקח என்பதன் அடிப்படைப் பொருள் ‘எடுத்தேன்’ என்றாலும், இங்கு தலைமைப் பொறுப்புக்கான ஆட்களைத் தெரிவுசெய்வதே சூழற்பொருள்; ஆகவே இயல்பான தமிழில் ‘தேர்ந்தெடுத்து’ என வழங்கப்பட்டது.
- source_word: רָאשֵׁי שִׁבְטֵיכֶם
  choice: உங்கள் கோத்திரங்களின் தலைவர்களாகிய
  rationale: רֹאשׁ சமூக அல்லது நிர்வாக அலகின் தலைமை வகிப்பவரைக் குறிக்கிறது. பின்னரும் வரும் רָאשִׁים என்பதோடு சொல்லிணைப்பைத் தக்கவைக்க ‘தலைவர்கள்’ பயன்படுத்தப்பட்டது.
- source_word: אֲנָשִׁים
  choice: ஆண்களை
  rationale: எபிரெயச் சொல் இங்கு ஆண்பாலினரையே இலக்கணத்திலும் சொற்பொருளிலும் சுட்டுகிறது; எனவே பாலினத்தைப் பொதுமைப்படுத்தாமல் ‘ஆண்களை’ என்று மொழிபெயர்க்கப்பட்டது.
- source_word: חֲכָמִים
  choice: ஞானமும் ... உள்ள
  rationale: தலைமைக்கும் நீதித்தீர்ப்புக்கும் ஏற்ற நடைமுறை ஞானத்தை இச்சொல் குறிக்கிறது. ‘ஞானம் உள்ள’ என்பது தெளிவான, மரியாதைமிக்க நவீனத் தமிழ்.
- source_word: וִידֻעִים
  choice: அறிவும் உள்ள
  rationale: ידע வேரிலிருந்து வந்த இவ்வடிவம் அறிவுடையவர்கள் அல்லது அறியப்பட்டு அங்கீகரிக்கப்பட்டவர்கள் எனப் பொருள்படலாம். சூழலில் ‘அறிவும் உள்ள’ என்பது முதன்மைப் பொருளாகத் தேர்ந்தெடுக்கப்பட்டது; உண்மையான மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டது.
- source_word: וָאֶתֵּן אֹתָם רָאשִׁים עֲלֵיכֶם
  choice: அவர்களை உங்கள்மேல் தலைவர்களாக நியமித்தேன்
  rationale: נתן இங்கு ஒருவரைப் பதவியில் அமர்த்துவதைக் குறிக்கிறது. ‘நியமித்தேன்’ நிர்வாகச் செயலை இயல்பாகத் தெரிவிக்கிறது; ‘உங்கள்மேல் தலைவர்களாக’ எபிரெய உருவகத்தையும் அதிகார உறவையும் தக்கவைக்கிறது.
- source_word: שָׂרֵי
  choice: '... பேருக்குத் தலைவர்கள்'
  rationale: שַׂר அதிகாரமுள்ள பொறுப்பாளரைக் குறிக்கிறது. படைத் தளபதிகள் என்று மட்டும் வரையறுக்காமல், இராணுவ-நிர்வாக அமைப்பு என்ற விரிந்த சாத்தியத்தைத் தக்கவைக்க ‘தலைவர்கள்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: אֲלָפִים ... מֵאוֹת ... חֲמִשִּׁים ... עֲשָׂרֹת
  choice: ஆயிரம் பேர் ... நூறு பேர் ... ஐம்பது பேர் ... பத்துப் பேர்
  rationale: இவை படிநிலையான நிர்வாகக் குழுக்களைக் குறிக்கின்றன. தமிழ் வாசகருக்குத் தெளிவாக இருக்க எண்ணிக்கைகளோடு ‘பேர்’ சேர்க்கப்பட்டது.
- source_word: וְשֹׁטְרִים
  choice: அதிகாரிகள்
  rationale: שֹׁטֵר கீழ்நிலை நிர்வாகம், பதிவேடு அல்லது செயலாக்கப் பொறுப்புடைய அலுவலர்களைக் குறிக்கலாம். அவற்றைத் தேவையின்றி ஒன்றாகக் குறுக்காமல் ‘அதிகாரிகள்’ எனப் பொதுவாக வழங்கப்பட்டது.
- source_word: לְשִׁבְטֵיכֶם
  choice: உங்கள் கோத்திரங்களுக்கான
  rationale: לְ இங்கு கோத்திர அமைப்புக்குள் வழங்கப்பட்ட பொறுப்பு அல்லது பணியமர்த்தலைக் குறிக்கிறது. ‘கோத்திரங்களுக்கான’ என்பது இதை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
