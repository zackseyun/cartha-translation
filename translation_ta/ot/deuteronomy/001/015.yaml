translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகருக்குப் புரியும் மரியாதைமிக்க நடையில் மொழிபெயர்க்கப்பட்டது. ‘கோத்திரம்’, ‘ஞானம்’, ‘நியமித்தேன்’ போன்ற பரவலாக அறியப்பட்ட வேதாகம-நிர்வாகச் சொற்கள் தக்கவைக்கப்பட்டன. எண்ணியல் அமைப்பு தெளிவாகப் படிக்க ‘பேர்’ சேர்க்கப்பட்டது; எபிரெயத்தில் உள்ள நிர்வாகத்துக்கும் இராணுவத்துக்கும் இடையிலான தெளிவின்மையை ‘தளபதிகள்’ என்று குறுக்காமல் ‘தலைவர்கள்’ எனப் பாதுகாத்துள்ளது.
