id: DEU.1.37
reference: Deuteronomy 1:37
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: גַּם בִּ/י֙ הִתְאַנַּ֣ף יְהוָ֔ה בִּ/גְלַלְ/כֶ֖ם לֵ/אמֹ֑ר גַּם אַתָּ֖ה לֹא תָבֹ֥א שָֽׁם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/037.yaml
  text: Yahweh was angry with me also because of you[a], saying[b], 'You also shall not enter there.'
translation:
  language: ta
  text: உங்கள் காரணமாக யாவே என்மீதும் கோபமடைந்து, “நீயும்கூட அங்கே நுழையமாட்டாய்” என்று சொன்னார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எண்ணாகமம் 20:12-இல், மோசே நாட்டிற்குள் நுழையாமல் விலக்கப்பட்டமை மெரிபாவில் அவர் செய்த தவறுடன் இணைக்கப்படுகிறது; இங்கே உபாகமம் இந்த நிகழ்வில் மக்களின் பங்கை வலியுறுத்துகிறது.
    reason: cross_reference
lexical_decisions:
- source_word: גַּם
  choice: -உம் / நீயும்கூட
  rationale: இரு இடங்களிலும் சேர்த்தலையும் வலியுறுத்தலையும் குறிக்கிறது; தமிழில் முதல் இடத்தில் ‘என்மீதும்’ என்றும் இரண்டாம் இடத்தில் இயல்பான வலியுறுத்தலுக்காக ‘நீயும்கூட’ என்றும் வழங்கப்பட்டது.
- source_word: בִּי הִתְאַנַּף
  choice: என்மீதும் கோபங்கொண்டு
  rationale: בְּ என்பது கோபத்தின் இலக்கைச் சுட்டுகிறது; வினை கடும் கோபம் கொள்ளுதல் அல்லது கோபமடைதல் என்ற பொருளுடையது. ‘என்மீது கோபங்கொண்டு’ என்பது இயல்பாகவும் போதிய வலிமையுடனும் உள்ளது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: இது பட்டப்பெயர் அல்ல, இறைநாமமாகிய நான்கெழுத்துப் பெயர்; தமிழில் பரவலாக அறியப்படும் தனிப்பெயர் வடிவமான ‘யெகோவா’ பயன்படுத்தப்பட்டது.
- source_word: בִּגְלַלְכֶם
  choice: உங்களால்
  rationale: இச்சொற்றொடர் காரணத்தையோ நிகழ்வுக்கான சந்தர்ப்பத்தையோ குறிக்கிறது. ‘உங்களால்’ மூலத்தின் காரணப் பொருளைச் சுருக்கமாகவும் இயல்பாகவும் காக்கிறது.
- source_word: לֵאמֹר
  choice: என்று சொன்னார்
  rationale: தொடர்ந்து வரும் இறைஉரையின் உள்ளடக்கத்தை அறிமுகப்படுத்துகிறது; தமிழில் நேர்கூற்றுக்குப் பின் ‘என்று சொன்னார்’ என்பது இயல்பான அமைப்பு.
- source_word: גַּם אַתָּה
  choice: நீயும்கூட
  rationale: இரண்டாம் நபர் ஆண்பால் ஒருமை மோசேயைக் குறிக்கிறது; גַּם தரும் சேர்த்தல் மற்றும் வலியுறுத்தலை ‘-உம் கூட’ தெளிவாக வெளிப்படுத்துகிறது.
- source_word: לֹא תָבֹא שָׁם
  choice: அங்கே நுழையமாட்டாய்
  rationale: בוא இச்சூழலில் வாக்குத்தத்த நாட்டிற்குள் செல்வதைக் குறிக்கிறது. ‘நுழையமாட்டாய்’ இலக்கை நோக்கிய அர்த்தத்தையும் எதிர்மறை எதிர்காலத்தையும் தெளிவாகத் தருகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைநாமத்தை வழங்குதல்
  choice: யெகோவா
  alternative: கர்த்தர்
  rationale: மூலத்தில் பொதுப் பட்டப்பெயர் அல்ல, தனிப்பட்ட உடன்படிக்கைப் பெயரே உள்ளது; ஆகவே பட்டப்பெயரால் மாற்றாமல் பெயராகவே வழங்கப்பட்டது.
- issue: மோசே நாட்டிற்குள் நுழையாததற்கான காரணத்தில் மக்களின் பங்கு
  choice: ‘உங்களால்’ என்ற இவ்வசனத்தின் காரணக் கூற்றை அப்படியே வைத்தல்
  alternative: எண்ணாகமம் 20:12-ஐ முன்னிறுத்தி மோசேயின் சொந்தத் தவறை முதன்மை உரையிலேயே விளக்குதல்
  rationale: உபாகமம் 1:37 மக்களின் பங்கை வலியுறுத்துகிறது; எண்ணாகமம் 20:12 மோசேயின் தவறுடன் அவரது விலக்கை இணைக்கிறது. முதன்மை உரை இந்த வேதஇறுக்கத்தைத் தீர்க்காமல் இவ்வசனத்தின் சொற்களைப் பின்பற்றுகிறது; இணைப்பு அடிக்குறிப்பில் சுட்டப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு விளங்கும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. ‘கோபங்கொண்டு’ வேதாகமச் சூழலுக்கேற்ற வலிமையைத் தக்கவைத்தாலும் மிகைப்படுத்தாது; ‘அங்கே நுழையமாட்டாய்’ தற்போதைய தமிழில் தெளிவாக உள்ளது.
