revisions:
- from: உங்களால் யெகோவா என்மீதும் கோபங்கொண்டு, “நீயும்கூட அங்கே நுழையமாட்டாய்” என்று சொன்னார்.[a]
  to: உங்கள் காரணமாக யாவே என்மீதும் கோபமடைந்து, “நீயும்கூட அங்கே நுழையமாட்டாய்” என்று சொன்னார்.[a]
  rationale: 'The revision preserves the verse’s deliberate tension: Yahweh’s anger at Moses is said to be because of the people, without importing an explanation into the main text from Numbers 20. It corrects the rendering of the divine name to the project-standard equivalent of ''Yahweh'' and makes the causal phrase clearer in modern Tamil. The footnote remains a restrained cross-reference and retains its anchor.'
