translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பான, கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. வினையில்லா எபிரெய வாக்கியத்தின் பயணநேரப் பொருள் தமிழில் ‘செல்லப் ... ஆகும்’ என வெளிப்படுத்தப்பட்டுள்ளது; இடப்பெயர்கள் மூலத்துக்கு நெருக்கமாக ஒலிபெயர்க்கப்பட்டுள்ளன.
