  yaml_path: translation/ot/deuteronomy/001/002.yaml
  text: It is eleven days from Horeb by the way of Mount Seir to Kadesh-barnea[a][b].
translation:
  language: ta
  text: ஓரேபிலிருந்து சேயீர் மலை வழியாகக் காதேஸ்-பர்னேயாவுக்குச் செல்லப் பதினொரு நாள் ஆகும்.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பதினொரு நாள் பயணம்.” எபிரெய மொழிநடை, இந்த வழியில் ஓரேபுக்கும் காதேஸ்-பர்னேயாவுக்கும் இடையிலான பயண நேரத்தைக் குறிப்பிடுகிறது.
    reason: lexical_alternative
  - marker: b
    text: எபிரெய மூலத்தில் இங்கு “ஓரேப்” என்ற பெயரே உள்ளது; இது பெரும்பாலும் சீனாயுடன் தொடர்புபடுத்தப்படுகிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: אַחַד עָשָׂר יוֹם
  choice: பதினொரு நாள் ஆகும்
  rationale: எபிரெயச் சொற்றொடர் பயண நேரத்தைக் குறிக்கும். தமிழில் ‘செல்லப் பதினொரு நாள் ஆகும்’ என்பது அந்தப் பொருளை இயல்பாகவும் தெளிவாகவும் தருகிறது.
- source_word: מֵחֹרֵב
  choice: ஓரேபிலிருந்து
  rationale: חֹרֵב என்பது இங்கு வரும் இடப்பெயர்; ‘சீனாய்’ என்று மாற்றாமல் மூலப்பெயர் ஒலிபெயர்க்கப்பட்டது.
- source_word: דֶּרֶךְ
  choice: வழியாக
  rationale: இச்சூழலில் דֶּרֶךְ பயணம் மேற்கொள்ளப்படும் வழித்தடத்தைக் குறிக்கிறது; ‘வழியாக’ என்பது இயல்பான தமிழ் இணை.
- source_word: הַר שֵׂעִיר
  choice: சேயீர் மலை
  rationale: הַר என்பது மலை அல்லது மலைப்பகுதியைக் குறிக்கலாம். வழித்தடப் பெயராகச் சுருக்கமான ‘சேயீர் மலை’ மூலவடிவைக் காக்கிறது.
- source_word: עַד
  choice: -க்கு
  rationale: புவியியல் பயணத்தின் முடிவிடத்தை עַד குறிக்கிறது; ‘காதேஸ்-பர்னேயாவுக்கு’ என்ற வேற்றுமை உருபு தமிழில் அதை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: קָדֵשׁ בַּרְנֵעַ
  choice: காதேஸ்-பர்னேயா
  rationale: இது கூட்டு இடப்பெயர் என்பதால் ஒலிபெயர்க்கப்பட்டு, வாசிப்புத் தெளிவுக்காக இடைக்கோடு இடப்பட்டது.
