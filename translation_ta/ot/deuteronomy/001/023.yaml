translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் கண்ணியமான நடையுடன் மொழிபெயர்க்கப்பட்டுள்ளது. ‘என் பார்வைக்கு’ என்ற மூலமொழிச் சுவை புரியத்தக்க அளவில் பேணப்பட்டுள்ளது; ‘கோத்திரம்’ என்பது வேதாகமச் சூழலில் நிலைபெற்ற தமிழ்ச் சொல்.
