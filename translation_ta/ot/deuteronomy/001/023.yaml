  text: וַ/יִּיטַ֥ב בְּ/עֵינַ֖/י הַ/דָּבָ֑ר וָ/אֶקַּ֤ח מִ/כֶּם֙ שְׁנֵ֣ים עָשָׂ֣ר אֲנָשִׁ֔ים אִ֥ישׁ אֶחָ֖ד לַ/שָּֽׁבֶט׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/023.yaml
  text: And the matter seemed good in my eyes[a], so I took from among you twelve men, one man for each tribe.
translation:
  language: ta
  text: 'அந்தக் காரியம் என் பார்வைக்கு நல்லதாகத் தோன்றியது[a]. ஆகவே உங்களிலிருந்து, ஒவ்வொரு கோத்திரத்திற்கும் ஒருவராகப் பன்னிரண்டு ஆண்களைத் தேர்ந்தெடுத்தேன்.


    [a] அல்லது, “அந்த யோசனை எனக்கு விருப்பமானதாக இருந்தது.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அந்த யோசனை எனக்கு விருப்பமானதாக இருந்தது.”
    reason: ‘நல்லதாகத் தோன்றியது’ என்ற மதிப்பீட்டு மொழிக்கு மாற்றாக, வினைச்சொல்லின் மகிழ்வித்தல் அல்லது ஏற்றுக்கொள்ளத்தக்கதாயிருத்தல் என்ற நுணுக்கத்தையும் ‘காரியம்’ என்பது சூழலில் ‘யோசனை’யைக் குறிப்பதையும் காட்டுகிறது.
lexical_decisions:
- source_word: וַיִּיטַב בְּעֵינַי
  choice: என் பார்வைக்கு நல்லதாகத் தோன்றியது
  rationale: ‘என் கண்களில் நல்லதாக இருந்தது’ என்ற எபிரேய மரபுத்தொடரின் தனிப்பட்ட மதிப்பீட்டு உணர்வை, இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது; ‘விருப்பமானதாக இருந்தது’ என்பதும் சாத்தியமான மாற்று.
- source_word: הַדָּבָר
  choice: அந்தக் காரியம்
  rationale: முந்தைய வசனத்தில் முன்வைக்கப்பட்ட யோசனையைக் குறிக்கிறது. ‘காரியம்’ என்பது மூலத்தின் பரந்த பொருளை வைத்திருக்கிறது; ‘யோசனை’ என்பது சூழலுக்கேற்ற, ஆனால் சற்றே விளக்கமான மாற்று.
- source_word: וָאֶקַּח
  choice: தேர்ந்தெடுத்தேன்
  rationale: לקח என்பதன் அடிப்படைப் பொருள் ‘எடுத்தேன்’ என்றாலும், இச்சூழலில் மக்களிலிருந்து பிரதிநிதிகளைத் தேர்வு செய்த செயலை இயல்பாகவும் தெளிவாகவும் தெரிவிக்கிறது.
- source_word: מִכֶּם
  choice: உங்களிலிருந்து
  rationale: அந்த ஆண்கள் மக்களாகிய ‘உங்களுக்குள் இருந்து’ எடுக்கப்பட்டார்கள் என்ற மூலக் குழுவின் பொருளைத் தெளிவாகக் காட்டுகிறது.
- source_word: שְׁנֵים עָשָׂר אֲנָשִׁים
  choice: பன்னிரண்டு ஆண்கள்
  rationale: இந்தச் சொற்றொடர் பன்னிரண்டு வயதுவந்த ஆண்களைக் குறிப்பதால் பாலினத் துல்லியத்தைப் பேணுகிறது.
- source_word: אִישׁ אֶחָד לַשָּׁבֶט
  choice: ஒவ்வொரு கோத்திரத்திற்கும் ஒருவராக
  rationale: ஒவ்வொரு கோத்திரத்தையும் பிரதிநிதித்துவப்படுத்த ஒருவர் என்ற பகிர்ந்தளிக்கும் பொருளை இயல்பான தமிழில் தெரிவிக்கிறது.
