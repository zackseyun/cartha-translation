  text: זֽוּלָתִ֞י כָּלֵ֤ב בֶּן יְפֻנֶּה֙ ה֣וּא יִרְאֶ֔/נָּה וְ/לֽ/וֹ אֶתֵּ֧ן אֶת הָ/אָ֛רֶץ אֲשֶׁ֥ר דָּֽרַךְ בָּ֖/הּ וּ/לְ/בָנָ֑י/ו יַ֕עַן אֲשֶׁ֥ר מִלֵּ֖א אַחֲרֵ֥י יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/036.yaml
  text: except Caleb son of Jephunneh; he shall see it[a], and to him I will give the land on which he has walked, and to his sons, because he has fully followed Yahweh.
translation:
  language: ta
  text: எப்புன்னேயின் மகன் காலேபைத் தவிர வேறு யாரும் அதைக் காணமாட்டார்கள். அவன் கால்பதித்த நிலத்தை அவனுக்கும் அவன் மகன்களுக்கும் கொடுப்பேன்; ஏனெனில் அவன் யாவேவை முழுமையாகப் பின்பற்றினான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: זֽוּלָתִי
  choice: மட்டும்
  rationale: முந்தைய தீர்ப்பிலிருந்து காலேபை மட்டும் விதிவிலக்காகக் காட்டும் எபிரெயச் சொல்லை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: כָּלֵב בֶּן יְפֻנֶּה
  choice: எப்புன்னேயின் மகன் காலேப்
  rationale: உறவுமுறையை இயல்பான தமிழ் உடைமைத் தொடரில் வழங்கி, பெயர்களை ஒலிபெயர்க்கிறது.
- source_word: יִרְאֶנָּה
  choice: அதைக் காண்பான்
  rationale: பெண்பால் ஒருமை பின்னொட்டு முன் குறிப்பிடப்பட்ட நாட்டைக் குறிக்கிறது; வாக்குறுதி மற்றும் தீர்ப்பின் உறுதியான தொனி காக்கப்படுகிறது.
- source_word: וְלוֹ אֶתֵּן
  choice: அவனுக்கும் ... கொடுப்பேன்
  rationale: காலேபுக்கே வழங்கப்படுவது என்ற பயனாளி வலியுறுத்தலை இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: הָאָרֶץ
  choice: நாடு
  rationale: இச்சூழலில் வாக்குத்தத்தம் செய்யப்பட்ட நிலப்பரப்பைக் குறிக்கும்; நவீன தமிழில் ‘நாடு’ இயல்பாகவும் பரந்த பொருளுடனும் உள்ளது.
- source_word: אֲשֶׁר דָּרַךְ בָּהּ
  choice: அவன் கால்பதித்த
  rationale: ‘மிதித்தல்/நடத்தல்’ என்ற மூலத்தின் கண்முன் நிற்கும் உருவகத்தைச் சுருக்கமான இயல்பான தமிழில் பாதுகாக்கிறது.
- source_word: וּלְבָנָיו
  choice: அவன் மகன்களுக்கும்
  rationale: எபிரெயில் வெளிப்படையாக உள்ள ஆண்பால் பன்மையான ‘மகன்கள்’ என்பதைக் குறுகவோ பாலினநீக்கம் செய்யவோ இல்லாமல் வழங்குகிறது.
- source_word: יַעַן אֲשֶׁר
  choice: ஏனெனில்
  rationale: வாக்குறுதிக்கான காரணத்தைத் தெளிவாக அறிமுகப்படுத்தும் இயல்பான காரண இணைப்புச்சொல்.
- source_word: מִלֵּא אַחֲרֵי יְהוָה
  choice: யாவேவை முழுமையாகப் பின்பற்றினான்
  rationale: சொல்லுக்குச் சொல் ‘பின்னால் நிரப்பினான்’ என்ற மறைமொழியின் பொருளான முழுமையான பற்றுறுதியைப் புரியத்தக்க தமிழில் அளிக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: திருநாமத்தை பொதுப்பட்டமாக மாற்றாமல், எபிரெய உடன்படிக்கைப் பெயரின் பரவலான தமிழ் ஒலிபெயர்ப்பில் வழங்குகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைநாமத்தின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலத்தில் நான்கெழுத்துத் திருநாமம் நேரடியாக உள்ளது; எனவே அதை ஒரு பட்டமாக மாற்றாமல் ஒலிபெயர்த்து, குறிப்பிட்ட இறைநாமம் என்பதைக் காக்கிறது.
- issue: בָּנָיו என்பதன் வரம்பு
  choice: அவன் மகன்கள்
  alternative: அவன் பிள்ளைகள் / அவன் சந்ததியினர்
  rationale: எபிரெயச் சொல் இலக்கணரீதியாக ‘அவனுடைய மகன்கள்’ என்று உள்ளது. சுதந்தரச் சூழலில் அது விரிந்த வழித்தோன்றலைக் குறிக்கக்கூடும் என்றாலும், முதன்மை உரை அதன் வெளிப்படையான பாலின வடிவத்தைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான, கண்ணியமான, பொதுவாசகருக்குப் புரியும் தமிழ். எபிரெய வாக்கியத்தின் விதிவிலக்கு, வாக்குறுதி, காரணம் ஆகிய தொடர்புகள் தெளிவாக வைக்கப்பட்டுள்ளன; தேவையற்ற சமயமரபுச் சொற்கள் தவிர்க்கப்பட்டுள்ளன.
