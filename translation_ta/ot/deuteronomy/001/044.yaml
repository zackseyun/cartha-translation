base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/044.yaml
  text: Then the Amorites who lived in that hill country came out to meet you and pursued you as bees do[b][a], and they struck you down in Seir as far as Hormah.
translation:
  language: ta
  text: அப்போது அந்த மலைப்பகுதியில் குடியிருந்த எமோரியர்கள்[a] உங்களை எதிர்கொள்ளப் புறப்பட்டு வந்து, தேனீக்கள் துரத்துவதுபோல் உங்களைத் துரத்தினார்கள். சேயீரில் ஓர்மாவரை உங்களை அடித்து வீழ்த்தினார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘எமோரியன்.’ எபிரெயத்தில் ஒருமை வடிவம் எமோரிய மக்களை ஒட்டுமொத்தமாகக் குறிக்கிறது; அதைத் தொடர்ந்து வரும் வினைச்சொற்கள் பன்மையில் உள்ளன.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: புறப்பட்டு வந்து
  rationale: יצא என்பது வெளியே புறப்படுதலைக் குறிக்கிறது; எதிரிகள் இஸ்ரவேலரை நோக்கி வந்த காட்சிநிலையையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: הָאֱמֹרִי
  choice: எமோரியர்கள்
  rationale: எபிரெயத்தில் ஒருமை வடிவம் கூட்டுப்பொருளில் வருகிறது; தொடர்ந்து வரும் பன்மை வினைச்சொற்கள் மக்கள்தொகையையே குறிக்கின்றன.
- source_word: הַיֹּשֵׁב בָּהָר הַהוּא
  choice: அந்த மலைப்பகுதியில் குடியிருந்த
  rationale: יֹשֵׁב நிலையான குடியிருப்பைக் குறிக்கிறது; הַר இச்சூழலில் தனி மலையைவிட மலைநாட்டுப் பகுதியைக் குறிக்க இயலும்.
- source_word: לִקְרַאתְכֶם
  choice: உங்களை எதிர்கொள்ள
  rationale: לקראת என்பதன் அடிப்படைப் பொருள் சந்திக்க வருதல்; போர்ச்சூழலில் 'எதிர்கொள்ள' என்பது பகைமையை மிகைப்படுத்தாமல் தெளிவாக்குகிறது.
- source_word: וַיִּרְדְּפוּ אֶתְכֶם
  choice: உங்களைத் துரத்தினார்கள்
  rationale: רדף என்பதன் நேரான ராணுவச் சூழல் பொருள் 'துரத்து' என்பதாகும்.
- source_word: כַּאֲשֶׁר תַּעֲשֶׂינָה הַדְּבֹרִים
  choice: தேனீக்கள் துரத்துவதுபோல்
  rationale: மூலத்தின் உயிரோட்டமான உவமையைத் தக்கவைக்கிறது; எபிரெய வினையின் சூழலார்ந்த செயலை இயல்பான தமிழில் 'துரத்துவது' என வெளிப்படுத்துகிறது.
- source_word: וַיַּכְּתוּ אֶתְכֶם
  choice: உங்களை அடித்து வீழ்த்தினார்கள்
  rationale: כתת வன்மையாகத் தாக்கி முறியடித்தலைக் குறிக்கிறது; 'அடித்து வீழ்த்தினர்' உடல் தாக்குதலையும் தோல்வியையும் அளவுக்கு மீறிய விளக்கமின்றி தெரிவிக்கிறது.
- source_word: בְּשֵׂעִיר
  choice: சேயீரில்
  rationale: ב இங்கு நிகழ்வின் இடத்தைச் சுட்டுகிறது.
- source_word: עַד חָרְמָה
  choice: ஓர்மாவரை
  rationale: עד பின்தொடர்தல் அல்லது தாக்குதலின் புவியியல் எல்லையைக் குறிக்கிறது.
