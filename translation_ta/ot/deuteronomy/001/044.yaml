translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான வரலாற்றுக் கதைநடை பயன்படுத்தப்பட்டுள்ளது. הַר என்பதன் பிராந்தியப் பொருளை 'மலைப்பகுதி' என முதன்மை உரையில் தக்கவைத்ததால் அதற்குத் தனி அடிக்குறிப்பு தேவையில்லை. எல்லா அடிக்குறிப்பு குறியீடுகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
