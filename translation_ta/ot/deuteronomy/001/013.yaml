source:
  edition: WLC
  text: הָב֣וּ לָ֠/כֶם אֲנָשִׁ֨ים חֲכָמִ֧ים וּ/נְבֹנִ֛ים וִ/ידֻעִ֖ים לְ/שִׁבְטֵי/כֶ֑ם וַ/אֲשִׂימֵ֖/ם בְּ/רָאשֵׁי/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/013.yaml
  text: Choose for yourselves wise[a], discerning, and well-known men from your tribes[b], and I will appoint them as your heads.
translation:
  language: ta
  text: ஞானமும் பகுத்தறிவும் உள்ள, உங்கள் கோத்திரங்களில் நன்கு அறியப்பட்ட[a] ஆண்களை உங்களுக்காகத் தேர்ந்தெடுங்கள்; அவர்களை உங்களுக்குத் தலைவர்களாக[b] நியமிப்பேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அறியப்பட்ட” அல்லது “அங்கீகரிக்கப்பட்ட.” எபிரெயச் சொல் கோத்திர மக்களிடையே நிலைபெற்ற நற்பெயரையும் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: சொல்லெழுத்தாக, “தலைகளாக.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הָבוּ
  choice: தேர்ந்தெடுங்கள்
  rationale: இச்சூழலில் மக்கள் தகுதியுள்ள ஆண்களை முன்வைக்க வேண்டும் என்பதே கட்டளையின் பொருள்; உடல்பூர்வமாக ‘கொண்டுவாருங்கள்’ என்பதைக் காட்டிலும் ‘தேர்ந்தெடுங்கள்’ இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: לָכֶם
  choice: உங்களுக்காக
  rationale: மக்கள் தங்கள் சார்பிலும் தங்கள் நலனுக்காகவும் தேர்வு செய்வதைக் குறிக்கும் தன்னிலை சார்ந்த நுணுக்கத்தை இது காக்கிறது.
- source_word: אֲנָשִׁים
  choice: ஆண்களை
  rationale: எபிரெயச் சொல் ஆண்பால் பன்மை; இங்கு இஸ்ரவேலின் கோத்திர அமைப்பில் பொறுப்பு ஏற்கும் ஆண்களைக் குறிக்கிறது.
- source_word: חֲכָמִים
  choice: ஞானம் உள்ள
  rationale: தலைமை மற்றும் நியாயவிசாரணைச் சூழலில் நடைமுறை ஞானத்தையும் நல்ல தீர்ப்புத்திறனையும் குறிக்கிறது.
- source_word: וּנְבֹנִים
  choice: பகுத்தறிவு உள்ள
  rationale: בין என்ற வேரிலிருந்து வரும் இச்சொல் புரிந்துணர்ந்து வேறுபடுத்தி ஆராயும் திறனை வலியுறுத்துகிறது.
- source_word: וִידֻעִים
  choice: நன்கு அறியப்பட்ட
  rationale: செயப்பாட்டு வடிவம் கோத்திர மக்களால் அறியப்பட்ட அல்லது அங்கீகரிக்கப்பட்டவர்களைக் குறிக்கலாம்; ‘நன்கு அறியப்பட்ட’ என்பது அந்தப் பொதுமக்கள் அங்கீகாரத்தை நேரடியாகக் காக்கிறது.
- source_word: לְשִׁבְטֵיכֶם
  choice: உங்கள் கோத்திரங்களிடையே
  rationale: இந்தத் தொடர் தேர்வு கோத்திர வாரியாக நடைபெறுவதையோ, அந்த ஆண்கள் தங்கள் கோத்திரங்களால் அறியப்பட்டிருப்பதையோ சுட்டலாம். அருகிலுள்ள וִידֻעִים உடன் இணைத்து மொழிபெயர்ப்பது எபிரெயச் சொற்றொடரின் இயல்பான வாசிப்பைத் தருகிறது.
- source_word: וַאֲשִׂימֵם
  choice: அவர்களை ... நியமிப்பேன்
  rationale: மக்களின் தேர்வைத் தொடர்ந்து மோசே அவர்களை அதிகாரப்பூர்வப் பொறுப்பில் அமர்த்துவதை இச்சூழலில் குறிக்கிறது.
- source_word: בְּרָאשֵׁיכֶם
  choice: உங்களுக்குத் தலைவர்களாக
  rationale: מֹאשׁ என்பதன் ‘தலை’ உருவகத்தை இயல்பான நவீனத் தமிழில் அதிகாரப் பொறுப்பைக் குறிக்கும் ‘தலைவர்கள்’ என வழங்குகிறது.
theological_decisions:
- issue: אֲנָשִׁים என்ற பாலினக் குறிப்புள்ள தலைமைச் சொல்
  choice: ஆண்களை
  alternative: மனிதர்களை / நபர்களை
  rationale: மூல எபிரெயம் வெளிப்படையாக ஆண்பால் பன்மையில் உள்ளது. கோத்திரத் தலைமைச் சூழலிலுள்ள இந்தக் குறிப்பை பாலினப் பொதுமைப்படுத்தாமல் மொழிபெயர்ப்பு காக்கிறது.
- issue: மக்கள் தேர்வு செய்தல் மற்றும் மோசே நியமித்தல்
  choice: மக்கள் ஆண்களைத் தேர்ந்தெடுக்கிறார்கள்; மோசே அவர்களை நியமிக்கிறார்
  alternative: மோசே ஒருதலைப்பட்சமாகத் தலைவர்களைத் தேர்ந்தெடுக்கிறார்
  rationale: הָבוּ לָכֶם என்ற பன்மைக் கட்டளையையும் வַאֲשִׂימֵם என்ற மோசேயின் அடுத்த செயலைவும் தனித்தனியாகக் காத்து, இரு தரப்பினரின் பங்குகளையும் ஒன்றாகக் கலக்காமல் வழங்குகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் மரியாதைமிக்க நடை பயன்படுத்தப்பட்டுள்ளது. ‘கோத்திரங்கள்,’ ‘ஞானம்,’ ‘பகுத்தறிவு,’ ‘தலைவர்கள்’ ஆகியவை வேதாகமச் சூழலைக் காக்கும் அதே நேரத்தில் இன்றைய தமிழிலும் இயல்பாக உள்ளன. மூலத்தில் பண்புப்பெயர்களின் வரிசை ‘ஞானமுள்ள, பகுத்தறிவுள்ள, அறியப்பட்ட’ என இருந்தாலும், ‘கோத்திரங்களிடையே’ என்பதன் தொடர்பைத் தெளிவாக்கத் தமிழில் ‘நன்கு அறியப்பட்ட’ முதலில் வைக்கப்பட்டுள்ளது.
