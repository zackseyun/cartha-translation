source:
  edition: WLC
  text: וָ/אֹמַ֖ר אֲלֵ/כֶ֑ם בָּאתֶם֙ עַד הַ֣ר הָ/אֱמֹרִ֔י אֲשֶׁר יְהוָ֥ה אֱלֹהֵ֖י/נוּ נֹתֵ֥ן לָֽ/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/020.yaml
  text: And I said to you[a], “You have come to the hill country of the Amorites, which Yahweh our God is giving us.”
translation:
  language: ta
  text: நான் உங்களிடம், “நீங்கள் எமோரியர்களின் மலைநாட்டுக்கு[a] வந்துவிட்டீர்கள்; அதை நம் கடவுளாகிய யாவே நமக்குக் கொடுக்கிறார்” என்றேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எமோரியர்களின் மலைக்கு.” எபிரெயச் சொல் ஒரு தனி மலையையோ, விரிவான மலைப்பாங்கான பகுதியையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֹמַר אֲלֵכֶם
  choice: நான் உங்களிடம் … என்றேன்
  rationale: வழக்கமான தமிழ் நேர்கூற்று அமைப்பில் வாக்கியத்தை இயல்பாக வழங்குகிறது; ו־ இங்குக் கதைத் தொடர்ச்சியைக் குறிக்கிறது, அதைத் தனியே ‘மேலும்’ என்று மொழிபெயர்ப்பது தேவையில்லை. ‘உங்களிடம்’ என்பது பன்மையைச் சூழலில் தெளிவாகத் தருகிறது.
- source_word: בָּאתֶם
  choice: நீங்கள் … வந்துவிட்டீர்கள்
  rationale: Qal perfect 2mp குறிக்கும் நிறைவுற்ற வருகையையும் அதன் தற்போதைய பொருத்தத்தையும் ‘வந்துவிட்டீர்கள்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: עַד הַר הָאֱמֹרִי
  choice: எமோரியர்களின் மலைநாட்டுக்கு
  rationale: עַד இயக்கத்தின் சென்றடைந்த எல்லையைக் குறிக்கிறது. உபாகமத்தின் புவியியல் சூழலில் הַר என்பது ஒரு தனி மலையைவிட மலைப்பாங்கான பிரதேசத்தைக் குறிக்கக்கூடும்; ‘மலைநாடு’ அந்தப் பொருளைத் தருகிறது. எபிரெயச் சமூக ஒருமைத் தேசியப் பெயர் தமிழில் இயல்பான பன்மையாக வழங்கப்பட்டுள்ளது.
- source_word: יְהוָה אֱלֹהֵינוּ
  choice: நம் கடவுளாகிய யாவே
  rationale: தெய்வீகப் பெயரான יהוה ‘யாவே’ என்று ஒலிபெயர்க்கப்படுகிறது; אֱלֹהֵינוּ என்பதன் முதலாம் நபர் பன்மை உடைமைப் பொருள் ‘நம் கடவுள்’ எனப் பாதுகாக்கப்படுகிறது.
- source_word: נֹתֵן לָנוּ
  choice: நமக்குக் கொடுத்துக்கொண்டிருக்கிறார்
  rationale: நிகழ்காலப் பங்கேற்புவினை குறிக்கும் நடைபெறும் அல்லது உடனடி கொடைச் செயலைத் தமிழில் தொடர்நிலை வினை வெளிப்படுத்துகிறது; לָנוּ என்பதன் பயனாளிப் பொருளும் ‘நமக்கு’ எனத் தெளிவாக உள்ளது.
theological_decisions:
- issue: יהוה என்ற தெய்வீகப் பெயரின் மொழியாக்கம்
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலத்தில் பட்டப்பெயர் அல்ல, நான்கு எழுத்துத் தெய்வீகப் பெயரே உள்ளது. ஆகவே அதைத் தலைப்பால் மாற்றாமல், பொதுவாக ஏற்கப்படும் ஒலிப்புக்கு அருகில் ‘யாவே’ என வழங்குவது மூல வடிவைத் தெளிவாகப் பாதுகாக்கிறது.
- issue: நிலத்தைக் கொடுக்கும் செயல்வடிவத்தின் காலநிலை
  choice: கொடுத்துக்கொண்டிருக்கிறார்
  alternative: கொடுக்கிறார் / கொடுத்திருக்கிறார்
  rationale: נֹתֵן என்பது பங்கேற்புவினை; இச்சூழலில் நடந்துகொண்டிருக்கும் அல்லது உடனடியாக நிறைவேறவிருக்கும் கொடைச் செயலைக் குறிக்கிறது. நிறைவுற்ற கடந்தகாலமாக மாற்றாமல் அந்த இறுக்கத்தைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையும் எளிய வாசிப்பும் இணைந்த நடையில் மொழிபெயர்க்கப்பட்டது. நேர்கூற்றுக்கான தமிழ் வாக்கிய வரிசை பயன்படுத்தப்பட்டுள்ளது; ‘மலைநாடு’ என்ற சொல் புவியியல் பொருளை இயல்பாகத் தருகிறது.
