source:
  edition: WLC
  text: יְהוָ֧ה אֱלֹהֵ֛י/נוּ דִּבֶּ֥ר אֵלֵ֖י/נוּ בְּ/חֹרֵ֣ב לֵ/אמֹ֑ר רַב לָ/כֶ֥ם שֶׁ֖בֶת בָּ/הָ֥ר הַ/זֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/006.yaml
  text: Yahweh our God spoke to us at Horeb[a], saying[b], “You have stayed at this mountain long enough.”
translation:
  language: ta
  text: 'நம் கடவுளாகிய யாவே ஓரேபில்[a] நம்மிடம் இவ்வாறு கூறினார்: “இந்த மலையில் நீங்கள் நீண்ட காலமாகத் தங்கியிருக்கிறீர்கள்; போதும்.[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரேயத்தில் “ஓரேபு”; சீனாய் என்றும் தொடர்புபடுத்தப்படும் மலைக்கு இங்கே பயன்படுத்தப்பட்ட பெயர்.
    reason: cross_reference
  - marker: b
    text: அல்லது, “உங்களுக்குப் போதும்; இனி இந்த மலையில் தங்க வேண்டாம்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரேய மூலத்தில் உள்ள கடவுளின் தனிப்பெயரைப் பட்டமாக மாற்றாமல், நவீனத் தமிழில் இயல்பான ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: אֱלֹהֵינוּ
  choice: நம் கடவுளாகிய
  rationale: இஸ்ரவேலின் ஒரே கடவுளைக் குறிக்கும் ஒருமைப் பொருளையும், முதல் நபர் பன்மை உடைமைப் பொருளையும் தெளிவாகக் காட்டுகிறது.
- source_word: דִּבֶּר אֵלֵינוּ
  choice: நம்மிடம் ... கூறினார்
  rationale: பேச்சு நம்மை நோக்கி உரைக்கப்பட்டது என்பதைக் காட்டும் இயல்பான தமிழ் அமைப்பு.
- source_word: בְּחֹרֵב
  choice: ஓரேபில்
  rationale: בְ என்பதன் இடப்பொருளைப் பாதுகாத்து, மூலத்தில் உள்ள ஓரேபு என்ற இடப்பெயரை சீனாய் என்று ஒத்திசைக்காமல் வைத்திருக்கிறது.
- source_word: לֵאמֹר
  choice: 'இவ்வாறு கூறினார்:'
  rationale: நேர்க் கூற்றை அறிமுகப்படுத்தும் எபிரேயச் சொல்லாக்கத்திற்கு இயல்பான நவீனத் தமிழ் வடிவம்.
- source_word: רַב לָכֶם שֶׁבֶת
  choice: நீங்கள் தங்கியிருந்தது போதும்
  rationale: ரַב לָכֶם என்பதன் ‘போதும்/போதுமான அளவு’ என்ற பொருளையும், שֶׁבֶת என்பதன் தொடர்ந்து தங்கியிருத்தல் என்ற பொருளையும் சுருக்கமாகத் தருகிறது.
- source_word: בָּהָר הַזֶּה
  choice: இந்த மலையில்
  rationale: הַר என்பதற்கு ‘மலை’ என்றும், בְּ என்பதற்கு இங்கு இயல்பான இடவேற்றுமை ‘-இல்’ என்றும் மொழிபெயர்க்கப்பட்டுள்ளது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூல எபிரேய உரை ஒரு பட்டத்தை அல்ல, நான்கு எழுத்துகளாலான கடவுளின் தனிப்பெயரைப் பயன்படுத்துகிறது. ஆகவே அதைப் பட்டமாக மாற்றாமல் ஒலிபெயர்ப்பது மூலத்தின் வேறுபாட்டைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் அதேவேளையில் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. நேர்க் கூற்று இயல்பாகப் படிக்கச் சொல்லுக்கு சொல் அமைப்பை விட பொருள்-வடிவச் சமநிலை முன்னுரிமைப்படுத்தப்பட்டது.
