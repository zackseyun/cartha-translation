  text: יְהוֹשֻׁ֤עַ בִּן נוּן֙ הָ/עֹמֵ֣ד לְ/פָנֶ֔י/ךָ ה֖וּא יָ֣בֹא שָׁ֑מָּ/ה אֹת֣/וֹ חַזֵּ֔ק כִּי ה֖וּא יַנְחִלֶ֥/נָּה אֶת יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/038.yaml
  text: Joshua son of Nun[a], who stands before you—he will go in there. Strengthen him, for he will cause Israel to inherit it.
translation:
  language: ta
  text: உனக்கு முன்பாக நிற்கும் நூனின் மகன் யோசுவா அங்கே நுழைவான். அவனைப் பலப்படுத்து; ஏனெனில் அவன் இஸ்ரவேலுக்கு அந்த நாட்டை உரிமையாகக் கொடுப்பான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவன் இஸ்ரவேலரை அந்த நாட்டை உரிமையாகப் பெறச் செய்வான்”; அல்லது, “அவன் அந்த நாட்டை இஸ்ரவேலுக்குப் பங்கிட்டுக் கொடுப்பான்.”
    reason: ஹிஃபில் נחל வினைச்சொல் ‘உரிமையாகக் கொடுத்தல்,’ ‘உரிமைபெறச் செய்தல்,’ அல்லது ‘பங்கிட்டுக் கொடுத்தல்’ எனப் பொருள்படலாம்.
lexical_decisions:
- source_word: יְהוֹשֻׁעַ בִּן נוּן
  choice: நூனின் மகன் யோசுவா
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் பரிச்சயமான பெயர்வடிவங்களைக் கொண்டு, எபிரெயப் பிதாவழிப் பெயரமைப்பை இயல்பான தமிழில் வழங்குகிறது.
- source_word: הָעֹמֵד לְפָנֶיךָ
  choice: உனக்கு முன்பாக நிற்கிற
  rationale: சொற்றொடரின் நேரடிப் பொருளையும் நிகழ்காலப் பங்கேற்புவினையின் தொடர்ச்சியான தன்மையையும் காக்கிறது; ‘உனக்குப் பணிவிடை செய்கிற’ என்பது சாத்தியமானாலும் அதிக விளக்கவுரையாகும்.
- source_word: הוּא יָבֹא שָׁמָּה
  choice: அவனே அங்கே நுழைவான்
  rationale: הוּא என்பதன் வலியுறுத்தலை ‘அவனே’ காக்கிறது; בוא மற்றும் திசைச்சொல் שָׁמָּה இணைந்து முன் குறிப்பிடப்பட்ட நாட்டிற்குள் செல்வதைக் குறிப்பதால் ‘நுழைவான்’ இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: אֹתוֹ חַזֵּק
  choice: அவனைப் பலப்படுத்து
  rationale: חזק என்பதிலுள்ள வலிமைப்படுத்துதல் மற்றும் ஊக்கமளித்தல் ஆகிய இரு நிழற்பொருள்களுக்கும் இடமளிக்கும் நேரடியான மொழிபெயர்ப்பு.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய கட்டளைக்கான காரணத்தைத் தெளிவாக அறிமுகப்படுத்துகிறது.
- source_word: הוּא יַנְחִלֶנָּה אֶת יִשְׂרָאֵל
  choice: அவனே இஸ்ரவேலுக்கு அந்த நாட்டை உரிமைச்சொத்தாக வழங்குவான்
  rationale: נחל என்பதன் ஹிஃபில் வடிவத்தை ‘உரிமைச்சொத்தாக வழங்குதல்’ என இயல்பான தமிழில் தருகிறது; பெண்பால் ஒருமை பின்னொட்டின் சூழல்சார் குறிப்பை ‘அந்த நாட்டை’ என வெளிப்படுத்துகிறது.
theological_decisions:
- issue: יַנְחִלֶנָּה என்பதிலுள்ள பெண்பால் ஒருமை பின்னொட்டின் குறிப்பு
  choice: வாக்குறுதி அளிக்கப்பட்ட நாட்டைக் குறிக்கும் வகையில் ‘அந்த நாட்டை’ என்று வெளிப்படையாக மொழிபெயர்த்தல்
  alternative: ‘அவன் இஸ்ரவேலை உரிமைபெறச் செய்வான்’ என்று பொருளை மறைமுகமாக விடுதல்
  rationale: உடனடிச் சூழல் நாட்டிற்குள் நுழைந்து அதை உடைமையாக்குவதைப் பற்றியது. ‘அந்த நாட்டை’ என்பது எபிரெயப் பிரதிப்பெயரின் குறிப்பைத் தெளிவாக்குகிறதே தவிர புதிய இறையியல் கருத்தைச் சேர்ப்பதில்லை.
- issue: נחל ஹிஃபில் வடிவத்தின் செயற்பொருள்
  choice: யோசுவா இஸ்ரவேலுக்கு நாட்டை உரிமைச்சொத்தாக வழங்குவான்
  alternative: யோசுவா இஸ்ரவேலுக்காக நாட்டைப் பங்கிட்டுக் கொடுப்பான்
  rationale: வினைச்சொல் உரிமைபெறச் செய்தல், உரிமைச்சொத்தாக வழங்குதல், அல்லது பங்கிட்டுக் கொடுத்தல் ஆகியவற்றைக் குறிக்கலாம். முதன்மை உரை பரந்த பொருளைத் தக்கவைக்கிறது; குறிப்பான பங்கீட்டு நிழற்பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘உனக்கு’, ‘பலப்படுத்து’ ஆகிய ஒருமை வடிவங்கள் மோசேயிடம் நேரடியாகச் சொல்லப்படும் எபிரெய உரையைப் பாதுகாக்கின்றன; ‘அவனே’ என்பது இருமுறை வரும் הוּא வலியுறுத்தலைக் காட்டுகிறது.
