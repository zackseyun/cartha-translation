revisions:
- from: உனக்கு முன்பாக நிற்கிற நூனின் மகன் யோசுவாவே அங்கே நுழைவான். அவனைப் பலப்படுத்து; ஏனெனில் அவனே இஸ்ரவேலுக்கு அந்த நாட்டை உரிமைச்சொத்தாக வழங்குவான்.[a]
  to: உனக்கு முன்பாக நிற்கும் நூனின் மகன் யோசுவா அங்கே நுழைவான். அவனைப் பலப்படுத்து; ஏனெனில் அவன் இஸ்ரவேலுக்கு அந்த நாட்டை உரிமையாகக் கொடுப்பான்.[a]
