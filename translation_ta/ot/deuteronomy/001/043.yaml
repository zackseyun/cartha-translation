revisions:
- from: ஆகவே நான் உங்களிடம் பேசினேன்; ஆனால் நீங்கள் கேட்கவில்லை. நீங்கள் யெகோவாவின் கட்டளையை மீறிக் கலகம் செய்து, துணிகரமாக மலைநாட்டிற்குச் சென்றீர்கள்.
  to: ஆகவே நான் உங்களிடம் பேசினேன்; ஆனால் நீங்கள் கேட்கவில்லை. நீங்கள் யாவேயின் கட்டளைக்கு எதிராகக் கலகம் செய்து, துணிகரமாக நடந்து, மலைநாட்டிற்குச் சென்றீர்கள்.
  rationale: The revision retains the narrative flow, plural address, and movement into the hill country. It removes the redundant added action, expresses rebellion against Yahweh’s command naturally in modern standard Tamil, and aligns the divine-name rendering with the project policy.
