id: DEU.1.43
reference: Deuteronomy 1:43
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וָ/אֲדַבֵּ֥ר אֲלֵי/כֶ֖ם וְ/לֹ֣א שְׁמַעְתֶּ֑ם וַ/תַּמְרוּ֙ אֶת פִּ֣י יְהוָ֔ה וַ/תָּזִ֖דוּ וַ/תַּעֲל֥וּ הָ/הָֽרָ/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/043.yaml
  text: So I spoke to you[a], but you did not listen; you rebelled against the mouth of Yahweh, acted presumptuously, and went up into the hill country.
translation:
  language: ta
  text: ஆகவே நான் உங்களிடம் பேசினேன்; ஆனால் நீங்கள் கேட்கவில்லை. நீங்கள் யாவேயின் கட்டளைக்கு எதிராகக் கலகம் செய்து, துணிகரமாக நடந்து, மலைநாட்டிற்குச் சென்றீர்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וָאֲדַבֵּר אֲלֵיכֶם
  choice: ஆகவே நான் உங்களிடம் பேசினேன்
  rationale: ו־ முந்தைய வசனத்தின் விளைவுத் தொடர்ச்சியைக் காட்டுவதால் ‘ஆகவே’ என இயல்பாக மொழிபெயர்க்கப்பட்டது; דבר என்பதன் அடிப்படைப் பொருள் ‘பேசுதல்.’
- source_word: וְלֹא שְׁמַעְתֶּם
  choice: ஆனால் நீங்கள் கேட்கவில்லை
  rationale: שׁמע இங்கு ‘கேட்டல்/செவிகொடுத்தல்’ என்ற பொருளைக் கொண்டது. அடுத்த சொற்றொடர் கலகத்தைத் தனியே கூறுவதால் ‘கீழ்ப்படியவில்லை’ என்று பொருளை மிகைப்படுத்தவில்லை.
- source_word: וַתַּמְרוּ אֶת־פִּי יְהוָה
  choice: நீங்கள் யெகோவாவின் கட்டளையை மீறிக் கலகம் செய்து
  rationale: מרה அதிகாரத்திற்கு எதிராகக் கலகம் செய்வதைக் குறிக்கிறது. ‘யெகோவாவின் வாய்’ என்பது அவர் கூறிய கட்டளையைக் குறிக்கும் எபிரெய மரபுத்தொடர்; தமிழில் தெளிவுக்காக ‘கட்டளை’ என வழங்கப்பட்டது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: தெய்வீகத் தனிப்பெயரான יהוה-ஐ ஒரு பட்டப்பெயரால் மாற்றாமல், தமிழில் பரவலாக அறியப்படும் ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: וַתָּזִדוּ
  choice: துணிகரமாக
  rationale: זיד இங்கு எச்சரிக்கையை மீறி அகந்தையுடனும் வரம்புமீறிய துணிவுடனும் செயல்பட்டதைக் குறிக்கிறது; ‘துணிகரமாக’ அந்த அறநெறி நுணுக்கத்தை இயல்பாகத் தருகிறது.
- source_word: וַתַּעֲלוּ הָהָרָה
  choice: மலைநாட்டிற்குச் சென்றீர்கள்
  rationale: עלה மேடான பகுதிக்குச் ‘செல்லுதல்/ஏறிச் செல்லுதல்’ என்பதையும், הָהָרָה மலைப்பாங்கான பிரதேசத்தை நோக்கிய இயக்கத்தையும் குறிக்கின்றன; சூழலில் ஒற்றை மலையைவிட ‘மலைநாடு’ பொருத்தமானது.
theological_decisions:
- issue: אֶת־פִּי יְהוָה என்ற மரபுத்தொடர்
  choice: யெகோவாவின் கட்டளையை மீறி
  alternative: யெகோவாவின் வாய்க்கு எதிராக
  rationale: சொல்லுக்குச் சொல் வடிவம் தமிழில் இயல்பற்றதும் தெளிவற்றதும் ஆகும். சூழலில் இது யெகோவா உரைத்த கட்டளைக்கு எதிராகச் செயல்பட்டதைக் குறிக்கிறது.
- issue: יהוה என்ற தெய்வீகப் பெயர்
  choice: யெகோவா
  alternative: யாவே
  rationale: தலைப்பு அல்லது பொதுப்பெயரைப் பயன்படுத்தாமல் தெய்வீகத் தனிப்பெயரை ஒலிபெயர்க்கிறது; ‘யெகோவா’ என்பது சாதாரண தமிழ் வாசகர்களிடையே பரவலாக அறியப்படும் வடிவம்.
translation_notes:
  register: நவீனத் தரத் தமிழில், மரியாதையும் தெளிவும் கொண்ட உரைநடை. இரண்டாம் நபர் பன்மை வடிவம் காக்கப்பட்டுள்ளது. எபிரெய மொழியின் இணை வினைத்தொடர் தமிழில் இயல்பாகப் பாயுமாறு அமைக்கப்பட்டுள்ளது.
