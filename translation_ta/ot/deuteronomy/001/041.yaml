  text: וַֽ/תַּעֲנ֣וּ וַ/תֹּאמְר֣וּ אֵלַ֗/י חָטָאנוּ֮ לַֽ/יהוָה֒ אֲנַ֤חְנוּ נַעֲלֶה֙ וְ/נִלְחַ֔מְנוּ כְּ/כֹ֥ל אֲשֶׁר צִוָּ֖/נוּ יְהוָ֣ה אֱלֹהֵ֑י/נוּ וַֽ/תַּחְגְּר֗וּ אִ֚ישׁ אֶת כְּלֵ֣י מִלְחַמְתּ֔/וֹ וַ/תָּהִ֖ינוּ לַ/עֲלֹ֥ת הָ/הָֽרָ/ה׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/041.yaml
  text: Then you answered and said to me[a], ‘We have sinned against Yahweh. We ourselves will go up and fight, according to all that Yahweh our God commanded us.’ Then each man strapped on his weapons of war[b], and you presumptuously set out to go up into the hill country.
translation:
  language: ta
  text: அப்போது நீங்கள் எனக்குப் பதிலளித்து, “நாங்கள் யாவேக்கு எதிராகப் பாவம் செய்தோம். எங்கள் கடவுளாகிய யாவே எங்களுக்குக் கட்டளையிட்டபடியெல்லாம் நாங்களே மேலே சென்று போரிடுவோம்” என்றீர்கள். பின்பு நீங்கள் ஒவ்வொருவரும் தத்தம் போர்க்கருவிகளைக் கட்டிக்கொண்டு, துணிச்சலாக[a] மலைப்பகுதிக்கு[b] ஏறிச் செல்லப் புறப்பட்டீர்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அரிதாக வரும் இந்த எபிரெய வினைச்சொல்லை, “அவசரப்பட்டு” அல்லது “அளவுக்கு மீறிய தன்னம்பிக்கையுடன்” என்றும் பொருள்கொள்ளலாம்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில், “மலை.” இச்சூழலில் அது விரிந்த மலைப்பகுதியைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּעֲנוּ וַתֹּאמְרוּ אֵלַי
  choice: நீங்கள் எனக்குப் பதிலளித்து ... என்றீர்கள்
  rationale: மோசேயிடம் மக்கள் அளித்த மறுமொழியை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது; ‘பதிலளித்து’ என்பது ענה என்பதன் உரையாடல் சார்ந்த பொருளைப் பாதுகாக்கிறது.
- source_word: חָטָאנוּ לַיהוָה
  choice: நாங்கள் யாவேக்கு எதிராகப் பாவம் செய்தோம்
  rationale: ל என்பது இங்கு பாவத்தால் புண்படுத்தப்பட்டவரைக் குறிக்கிறது; ‘எதிராக’ என்பது அந்த உறவைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: אֲנַחְנוּ נַעֲלֶה וְנִלְחַמְנוּ
  choice: நாங்களே மேலே சென்று போரிடுவோம்
  rationale: வெளிப்படையாக இடம்பெறும் אֲנַחְנוּ என்பதன் அழுத்தத்தை ‘நாங்களே’ காக்கிறது; עלה என்பதிலுள்ள மேல்நோக்கிய நகர்வும் பாதுகாக்கப்படுகிறது.
- source_word: כְּכֹל אֲשֶׁר צִוָּנוּ
  choice: எங்களுக்குக் கட்டளையிட்டபடியெல்லாம்
  rationale: கட்டளையின் முழுமைக்கும் அதன்படி செயல்படுவதாக மக்கள் கூறியதற்கும் உரிய அழுத்தத்தைச் சுருக்கமாகக் காக்கிறது.
- source_word: וַתַּחְגְּרוּ אִישׁ אֶת כְּלֵי מִלְחַמְתּוֹ
  choice: நீங்கள் ஒவ்வொருவரும் தத்தம் போர்க்கருவிகளைக் கட்டிக்கொண்டு
  rationale: אִישׁ என்பதன் பகிர்ந்தளிக்கும் பொருளை ‘ஒவ்வொருவரும் தத்தம்’ என வழங்குகிறது; כלי מלחמה என்பதைக் குறிப்பிட்ட ஓர் ஆயுதமாகச் சுருக்காமல் போருக்கான கருவிகள் என்ற பரப்பில் வைத்திருக்கிறது.
- source_word: וַתָּהִינוּ
  choice: துணிகரமாக ... புறப்பட்டீர்கள்
  rationale: அரிதான இந்த வினைச்சொல் சூழலில் காட்டும் அளவுக்கு மீறிய தன்னம்பிக்கையையும் பொறுப்பற்ற துணிவையும் தெரிவிக்கிறது; அதன் அரிதான தன்மையால் மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: לַעֲלֹת הָהָרָה
  choice: மலைப்பகுதிக்கு ஏறிச் செல்ல
  rationale: இறுதியில் உள்ள திசைகாட்டும் ה இயக்கத்தைத் தெரிவிக்கிறது. இச்சூழலில் הָהָרָה ஒரு தனி மலையைவிட விரிந்த மலைநாட்டைக் குறிக்கக்கூடும் என்பதால் ‘மலைப்பகுதி’ தேர்ந்தெடுக்கப்பட்டுள்ளது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய மூலத்தில் உள்ள இறைப் பெயரை ஒரு பட்டப்பெயரால் மாற்றாமல், நவீனத் தமிழில் அதன் பரவலான ஒலிபெயர்ப்பாக வழங்குகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலத்தில் தனிப்பட்ட உடன்படிக்கைப் பெயர் நேரடியாக இருப்பதால் அதை பட்டப்பெயராக மாற்றாமல் ஒலிபெயர்க்கிறது; ‘யாவே’ என்பது Yahweh என்பதற்கான இயல்பான தமிழ் வடிவம்.
- issue: וַתָּהִינוּ என்பதில் மக்களின் செயலைப் பற்றிய மதிப்பீடு
  choice: துணிகரமாகப் புறப்பட்டீர்கள்
  alternative: துணிந்து ஏறிச் சென்றீர்கள்; அவசரப்பட்டு ஏறினீர்கள்
  rationale: உடனடி சூழல் அவர்களின் ஏற்றத்தை கீழ்ப்படியாமையும் அளவுக்கு மீறிய தன்னம்பிக்கையும் கொண்ட செயலாகக் காட்டுகிறது. தேர்ந்த சொல் அந்த எதிர்மறை நுணுக்கத்தைப் பாதுகாக்கிறது; ஆனால் அரிதான எபிரெயச் சொல்லின் எல்லா சாத்தியங்களையும் ஒரே பொருளாக முடிவுசெய்யவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் மரியாதைமிக்க நடையில் வடிவமைக்கப்பட்டது. உரையாடலில் பன்மை மரியாதை வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன. ‘நாங்களே’ என்பது மூலத்தின் வலியுறுத்தலைக் காக்கிறது; ‘தத்தம்’ பகிர்ந்தளிக்கும் பொருளை இயல்பாகத் தெரிவிக்கிறது.
