  terminology: யְהוָה-வுக்கு ‘யாவே’ என்பது பெயரைப் பாதுகாக்கும் சரியான தமிழ் ஒலிபெயர்ப்பு. ‘பாவம் செய்தோம்,’ ‘கட்டளையிட்டபடியெல்லாம்,’ ‘போர்க்கருவிகள்’ ஆகியவை பொருத்தமானவை. அடிக்குறிப்புகள் தத்தம் உரையிலுள்ள குறியீட்டு இடங்களில் சரியாக இணைக்கப்பட்டுள்ளன; அரிதான வினைச்சொல் மற்றும் ‘மலை’ என்பதன் பரந்த புவியியல் சாத்தியம் இரண்டையும் தேவையான அளவில் விளக்குகின்றன.
