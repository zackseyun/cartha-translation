source:
  edition: WLC
  text: וַ/תֵּרָגְנ֤וּ בְ/אָהֳלֵי/כֶם֙ וַ/תֹּ֣אמְר֔וּ בְּ/שִׂנְאַ֤ת יְהוָה֙ אֹתָ֔/נוּ הוֹצִיאָ֖/נוּ מֵ/אֶ֣רֶץ מִצְרָ֑יִם לָ/תֵ֥ת אֹתָ֛/נוּ בְּ/יַ֥ד הָ/אֱמֹרִ֖י לְ/הַשְׁמִידֵֽ/נוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/027.yaml
  text: And you grumbled in your tents and said[a], ‘Because Yahweh hates us, he brought us out of the land of Egypt to give us into the hand of the Amorites[b], to destroy us.’
translation:
  language: ta
  text: நீங்கள் உங்கள் கூடாரங்களில் முணுமுணுத்து, “யாவே நம்மை வெறுப்பதால்[a], எமோரியரின் கையில் நம்மை ஒப்படைத்து[b] அழித்துவிடுவதற்காக எகிப்து நாட்டிலிருந்து நம்மை வெளியே கொண்டுவந்தார்” என்று சொன்னீர்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரெயத்தில் சொல்லுக்குச் சொல்: “யாவேயின் நம்மீதான வெறுப்பில்”; இங்கு அது காரணப் பொருளில் “யாவே நம்மை வெறுப்பதால்” என்று மொழிபெயர்க்கப்பட்டுள்ளது.'
    reason: lexical_alternative
  - marker: b
    text: 'அல்லது, “எமோரியரிடம் நம்மைக் கையளித்து”; எபிரெயத்தில் சொல்லுக்குச் சொல்: “எமோரியரின் கையில் நம்மைக் கொடுத்து.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּרָגְנוּ
  choice: முணுமுணுத்து
  rationale: רגן என்பது அதிருப்தியுடன் தாழ்ந்த குரலில் குறைகூறுவதைச் சுட்டுகிறது; ‘முணுமுணுத்து’ இந்த எதிர்மறை நுண்ணுணர்வை இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: בְאָהֳלֵיכֶם
  choice: உங்கள் கூடாரங்களில்
  rationale: வனாந்தரப் பின்னணியிலுள்ள தெளிவான இடக்குறிப்பை விரிவாக்கமின்றி நேரடியாகப் பாதுகாக்கிறது.
- source_word: בְּשִׂנְאַת יְהוָה אֹתָנוּ
  choice: யாவே நம்மை வெறுப்பதால்
  rationale: בְּ + ‘வெறுப்பு’ என்ற கருத்துப்பெயர் இங்கு காரணத்தைக் குறிக்கிறது; இஸ்ரவேலரின் குற்றச்சாட்டை இயல்பான தமிழில் வினைச்சொல் வடிவில் தெரிவிக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைத் திருப்பெயரான יהוה-ஐ ஒரு பட்டப்பெயரால் மாற்றாமல், தமிழில் தெளிவான ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: הוֹצִיאָנוּ מֵאֶרֶץ מִצְרָיִם
  choice: எகிப்து நாட்டிலிருந்து நம்மை வெளியே கொண்டுவந்தார்
  rationale: ‘எகிப்து நாடு’ என்ற மூலத்தின் முழுமையான சொல்லமைப்பையும் வெளியே கொண்டுவருதல் என்ற யாத்திராகமச் சொல்லாட்சியையும் காக்கிறது.
- source_word: לָתֵת אֹתָנוּ בְּיַד הָאֱמֹרִי
  choice: எமோரியரின் கையில் நம்மை ஒப்படைத்து
  rationale: ‘ஒருவரின் கையில் கொடுத்தல்’ என்பது அவருடைய அதிகாரத்திற்குள் ஒப்படைத்தலைக் குறிக்கும்; தமிழ் வாசகருக்குப் புரியும் அளவுக்கு மூல உருவகத்தையும் காக்கிறது.
- source_word: הָאֱמֹרִי
  choice: எமோரியர்
  rationale: எபிரெயத்தில் ஒருமை வடிவம் இருந்தாலும், அது இங்கு ஒரு மக்களினத்தைக் கூட்டாகக் குறிக்கிறது; தமிழில் மரியாதைப் பன்மை போன்ற குழப்பத்தைத் தவிர்க்க இனப்பெயர் வடிவம் பயன்படுத்தப்படுகிறது.
- source_word: לְהַשְׁמִידֵנוּ
  choice: அழித்துவிடுவதற்காக
  rationale: שׁמד என்பதன் தீவிரமான அழித்தல் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது; மூலத்தைவிட குறிப்பாக ‘இனமூலம் அழித்தல்’ போன்ற பொருளைச் சேர்க்கவில்லை.
theological_decisions:
- issue: יהוה என்ற இறைத் திருப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: வசனம் தனிப்பட்ட உடன்படிக்கைத் திருப்பெயரையே பயன்படுத்துவதால், அதை ஒரு பொதுப் பட்டப்பெயராக மாற்றாமல் ஒலிபெயர்க்கிறது.
- issue: בְשִׂנְאַת என்ற சொற்றொடரில் தெரிவிக்கப்படும் குற்றச்சாட்டு
  choice: யாவே நம்மை வெறுப்பதால்
  alternative: யாவேயின் நம்மீதான வெறுப்பினால்
  rationale: இது தேவனுடைய மனநிலையை உரையாசிரியர் உறுதிப்படுத்துவது அல்ல; மக்களின் நேரடி பேச்சில் வரும் குற்றச்சாட்டு. காரணப் பொருளை இயல்பாகக் கொடுத்து, அந்தத் தெய்வவியல் பதற்றத்தை மேற்கோளுக்குள் அப்படியே வைத்திருக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையில் dignified நேரடி நடையில் அமைக்கப்பட்டுள்ளது. ‘முணுமுணுத்து’ என்பது மறைமுகமான அதிருப்திக் குறைகூறலைக் காட்டுகிறது; ‘கையில் ஒப்படைத்து’ மூல உருவகத்தை இயல்பாகப் பாதுகாக்கிறது. மேற்கோளுக்குள் வரும் மக்களின் குற்றச்சாட்டு உரையாசிரியரின் தீர்ப்பாக மாற்றப்படவில்லை.
