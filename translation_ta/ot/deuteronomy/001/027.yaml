  source_fidelity: 'மூல எபிரெயத்தின் எல்லா முக்கிய கூறுகளும் துல்லியமாகக் காக்கப்பட்டுள்ளன: கூடாரங்களில் குறைகூறுதல், யாவே தங்களை வெறுக்கிறார் என்ற மக்களின் குற்றச்சாட்டு, எகிப்திலிருந்து வெளியே கொண்டுவருதல், எமோரியரின் அதிகாரத்தில் ஒப்படைத்தல், மற்றும் அழித்துவிடுதல். காரணப்பொருளிலுள்ள בְּשִׂנְאַת சரியாக மேற்கோளுக்குள் இயல்பாகத் தரப்பட்டுள்ளது.'
  naturalness: நடை நவீன நிலையான தமிழில் தெளிவாகவும் மரியாதையான வேதாகம நடையிலும் உள்ளது. “முணுமுணுத்து,” “கையில் நம்மை ஒப்படைத்து,” “அழித்துவிடுவதற்காக” ஆகியவை பொருளுக்கும் சூழலுக்கும் இயல்பானவை.
  terminology: “யாவே” மூலத் திருப்பெயரைத் தக்கவைக்கிறது. “எமோரியர்” மக்கள் இனத்தைச் சுட்டும் கூட்டுப்பொருளுக்கு ஏற்றவாறு பயன்படுத்தப்பட்டுள்ளது. அழிவு குறிக்கும் வினை மூலத்தைவிடக் கூடுதலான விளக்கத்தைச் சேர்ப்பதில்லை.
