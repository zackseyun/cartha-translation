  yaml_path: translation/ot/deuteronomy/001/018.yaml
  text: And at that time I commanded you all the things that you should do[a].
translation:
  language: ta
  text: அந்த நேரத்தில், நீங்கள் செய்ய வேண்டிய எல்லாக் காரியங்களையும்[a] நான் உங்களுக்குக் கட்டளையிட்டேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எல்லா வார்த்தைகளையும்” அல்லது “எல்லா விஷயங்களையும்.” எபிரெயச் சொல் דְּבָרִים பேசப்பட்ட அறிவுறுத்தல்களையோ, செய்து நிறைவேற்ற வேண்டிய விஷயங்கள் அல்லது செயல்களையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֲצַוֶּה
  choice: நான் ... கட்டளையிட்டேன்
  rationale: צוה என்பதன் அதிகாரபூர்வமான கட்டளை/அறிவுறுத்தல் வலிமையை இயல்பான நவீனத் தமிழில் காக்கிறது.
- source_word: אֶתְכֶם
  choice: உங்களுக்கு
  rationale: இரண்டாம் நபர் ஆண்பால் பன்மை பின்னொட்டைத் தமிழ் சூழலில் இயல்பாகப் பன்மை மரியாதை வடிவம் வெளிப்படுத்துகிறது.
- source_word: בָּעֵת הַהִוא
  choice: அந்த நேரத்தில்
  rationale: எபிரெயத் காலக் குறிப்பின் நேரடியான, இயல்பான தமிழ் வடிவம்.
- source_word: אֵת כָּל הַדְּבָרִים
  choice: எல்லாக் காரியங்களையும்
  rationale: דְּבָרִים என்பது சொற்கள், விஷயங்கள், காரியங்கள் எனப் பொருள்படலாம்; இங்கு செய்து நிறைவேற்ற வேண்டியவற்றைக் குறிக்கும் நடைமுறைப் பொருளுக்கு ‘காரியங்கள்’ பொருத்தமானது; மாற்றுப் பொருள்கள் அடிக்குறிப்பில் காக்கப்படுகின்றன.
- source_word: אֲשֶׁר תַּעֲשׂוּן
  choice: நீங்கள் செய்ய வேண்டிய
  rationale: கட்டளைக்குப் பிந்தைய சார்பு வாக்கியத்தில் உள்ள எதிர்பார்ப்பு/கடமை வலிமையை ‘செய்ய வேண்டிய’ இயல்பாக வெளிப்படுத்துகிறது; ‘செய்தே ஆக வேண்டும்’ என அளவுக்கு மீறி வலுப்படுத்தவில்லை.
theological_decisions: []
