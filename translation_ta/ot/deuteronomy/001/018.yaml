  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. கட்டளையின் அதிகார வலிமையும் דְּבָרִים என்பதன் உண்மையான பொருள் விரிவும் காக்கப்பட்டுள்ளன.
