reference: Deuteronomy 1:26
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וְ/לֹ֥א אֲבִיתֶ֖ם לַ/עֲלֹ֑ת וַ/תַּמְר֕וּ אֶת פִּ֥י יְהוָ֖ה אֱלֹהֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/026.yaml
  text: But you were not willing to go up[a], and you rebelled against the command of Yahweh your God.
translation:
  language: ta
  text: ஆனால் நீங்கள் மேலே செல்ல விரும்பவில்லை; உங்கள் கடவுளாகிய யாவேயின் கட்டளைக்கு எதிராகக் கலகம் செய்தீர்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரேயத்தில் சொற்சொல்லாக, “உங்கள் கடவுளாகிய யாவேயின் வாய்க்கு எதிராகக் கலகம் செய்தீர்கள்.” இது யாவே அளித்த கட்டளையை எதிர்ப்பதைக் குறிக்கும் மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלֹא
  choice: ஆனால் ... இல்லை
  rationale: முந்தைய அறிவுறுத்தலுக்கு முரணான இஸ்ரவேலரின் பதிலை இயல்பான தமிழில் காட்டுகிறது.
- source_word: אֲבִיתֶם
  choice: நீங்கள் ... விரும்பவில்லை
  rationale: אבה என்பதன் விருப்பம் அல்லது சம்மதம் சார்ந்த பொருளைத் தக்கவைக்கிறது; ‘மறுத்தீர்கள்’ என்பதைவிட மூலத்தின் வடிவுக்கு நெருக்கமானது.
- source_word: לַעֲלֹת
  choice: மேலே போக
  rationale: עלה என்பதிலுள்ள திசை சார்ந்த ‘மேலே செல்லுதல்’ என்ற பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: וַתַּמְרוּ
  choice: எதிர்த்துக் கலகம் செய்தீர்கள்
  rationale: מרה குறிக்கும் அதிகாரத்துக்கு எதிரான கீழ்ப்படியாமை மற்றும் கலகத்தைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: אֶת־פִּי
  choice: கட்டளையை எதிர்த்து
  rationale: ‘வாயை எதிர்த்தல்’ என்ற எபிரேய மரபுத்தொடர், ஒருவர் கூறிய கட்டளையை மீறுதல் அல்லது எதிர்த்தல் என்பதைக் குறிக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைத் திருப்பெயரான יהוה-ஐ ஒரு பட்டத்தால் மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: אֱלֹהֵיכֶם
  choice: உங்கள் கடவுளாகிய
  rationale: இரண்டாம் நபர் பன்மை உடைமைப் பின்னொட்டுடன் வரும் உடன்படிக்கைச் சூழலின் ஒருமைப் பொருளைத் தருகிறது.
theological_decisions:
- issue: יהוה என்ற இறைத் திருப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலத்தில் நேரடியாக வரும் நான்கு எழுத்துத் திருப்பெயரைப் பட்டத்தால் மாற்றாமல், நவீன தமிழில் புரியக்கூடிய ஒலிபெயர்ப்பாக வழங்குகிறது.
- issue: אֶת־פִּי என்ற சொற்றொடரின் பொருள்
  choice: கட்டளையை எதிர்த்துக் கலகம் செய்தீர்கள்
  alternative: வாயை எதிர்த்துக் கலகம் செய்தீர்கள்
  rationale: எபிரேய உருவகத்தை சொற்சொல்லாகக் கொடுத்தால் தமிழில் பொருள் தெளிவாகாது; அதிகாரப்பூர்வமாகப் பேசப்பட்ட கட்டளையை எதிர்த்தல் என்ற கருத்தை மொழிபெயர்க்கிறது, சொற்சொல் வடிவத்தை அடிக்குறிப்பில் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. ‘மேலே போக’ என்பது திசை உணர்வைக் காக்கிறது; ‘எதிர்த்துக் கலகம் செய்தீர்கள்’ என்பது מרה-வின் வலிமையை இயல்பாக வெளிப்படுத்துகிறது.
