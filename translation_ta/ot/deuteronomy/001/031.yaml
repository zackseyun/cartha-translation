base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/031.yaml
  text: and in the wilderness[a], where you saw that Yahweh your God carried you, just as a man carries his son[b], all along the way that you traveled until you came to this place.
translation:
  language: ta
  text: நீ பார்த்த பாலைநிலத்திலும்[a], ஒரு மனிதன் தன் மகனைச் சுமப்பதுபோல, நீங்கள் இந்த இடத்துக்கு வந்து சேரும்வரை சென்ற வழி முழுவதிலும் உன் கடவுளாகிய யாவே உன்னைச் சுமந்ததை நீ கண்டாய்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘வனாந்தரம்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: 'எபிரெயத்தில் இரண்டாம் நபர் இங்கு ஒருமையிலிருந்து பன்மைக்கு மாறுகிறது: முதலில் ‘நீ/உன்/உன்னை’; பின்னர் ‘நீங்கள்’.'
    reason: source_ambiguity
lexical_decisions:
- source_word: וּבַמִּדְבָּר
  choice: அந்தப் பாலைநிலத்திலும்
  rationale: מִדְבָּר என்பது குடியிருப்புகள் அரிதான வறண்ட வனாந்தரப் பகுதியைக் குறிக்கிறது. நவீனத் தமிழில் ‘பாலைநிலம்’ இயல்பாகவும் தெளிவாகவும் உள்ளது; இணைப்பான וּ மற்றும் இடச்சுட்டுச் சூழல் முறையே ‘-இலும்’, ‘அந்த’ என்பவற்றால் வெளிப்படுகின்றன.
- source_word: אֲשֶׁר רָאִיתָ
  choice: நீ பார்த்த
  rationale: இரண்டாம் நபர் ஆண்பால் ஒருமை வடிவத்தை ‘நீ பார்த்த’ என நேரடியாகப் பேணுகிறது; இது ‘பாலைநிலம்’ என்பதோடு இலக்கண ரீதியில் இணைகிறது.
- source_word: נְשָׂאֲךָ
  choice: உன்னைச் சுமந்தார்
  rationale: נשא இங்கு அடுத்த உவமையால் தெளிவாக ‘சுமத்தல்/தாங்கிச் செல்லுதல்’ என்ற பொருளைக் கொண்டுள்ளது. தமிழில் தெய்வத்தைக் குறிக்கும் மரியாதை ஒருமை வினைமுற்று பயன்படுத்தப்பட்டது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெயத் தெய்வீகப் பெயரான יהוה-ஐ ஒரு பட்டத்தால் மாற்றாமல், தமிழில் வழக்கமான ஒலிபெயர்ப்பாக ‘யாவே’ என வழங்குகிறது.
- source_word: אֱלֹהֶיךָ
  choice: உன் கடவுளாகிய
  rationale: இரண்டாம் நபர் ஒருமை உடைமையைப் பேணி, தெய்வீகப் பெயருடன் இயல்பாக இணைய ‘உன் கடவுளாகிய’ என மொழிபெயர்க்கப்பட்டது.
- source_word: כַּאֲשֶׁר יִשָּׂא אִישׁ אֶת־בְּנוֹ
  choice: ஒரு மனிதன் தன் மகனைச் சுமப்பதுபோல
  rationale: אִישׁ மற்றும் בְּנוֹ ஆகியவற்றின் ஆண்பால் உருவகத்தை வலுப்படுத்தவோ பாலினப் பொதுமைப்படுத்தவோ செய்யாமல் முறையே ‘ஒரு மனிதன்’, ‘தன் மகன்’ எனப் பேணுகிறது.
- source_word: בְּכָל־הַדֶּרֶךְ
  choice: வழி முழுவதிலும்
  rationale: முழுப் பயண நெடுகிலும் தொடர்ந்த செயலை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: אֲשֶׁר הֲלַכְתֶּם
  choice: நீங்கள் ... சென்ற
  rationale: இங்கு எபிரெயம் பன்மைக்கு மாறுவதால், இஸ்ரவேல் மக்களை நோக்கிய ‘நீங்கள்’ என்பதைக் காக்கிறது. הלך பயணச் சூழலில் ‘சென்ற’ என இயல்பாக மொழிபெயர்க்கப்பட்டது.
- source_word: עַד בֹּאֲכֶם עַד הַמָּקוֹם הַזֶּה
  choice: இந்த இடத்துக்கு வந்து சேரும்வரை
  rationale: இரு עַד கூறுகளின் எல்லை/முடிவுப் பொருளை இயல்பான ஒரே தமிழ்த் தொடரில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: יהוה என்ற தெய்வீகப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலத்தில் தனிப்பட்ட தெய்வீகப் பெயர் நேரடியாக இருப்பதால், அதை ஒரு பட்டமாக மாற்றாமல் தமிழ் ஒலிபெயர்ப்பில் பேணுகிறது.
- issue: சுமக்கும் உவமையின் பாலினக் குறிப்புகள்
  choice: ஒரு மனிதன் தன் மகனைச் சுமப்பதுபோல
  alternative: ஒருவர் தம் குழந்தையைச் சுமப்பதுபோல / ஒரு தந்தை தன் மகனைச் சுமப்பதுபோல
  rationale: மூலத்தின் אִישׁ (‘மனிதன்/ஆண்’) மற்றும் בְּנוֹ (‘அவன் மகன்’) ஆகிய குறிப்புகளைப் பேணுகிறது. ‘தந்தை’ என்பது உறவை வெளிப்படையாகச் சேர்க்கும் விளக்கமாகும்; பாலினப் பொதுமைப்படுத்தலும் மூல உருவகத்தை மங்கச் செய்யும்.
- issue: ஒருமையிலிருந்து பன்மைக்கு மாறும் இரண்டாம் நபர் வடிவங்கள்
  choice: ‘நீ/உன்/உன்னை’ என்பதிலிருந்து ‘நீங்கள்’ என்பதற்கு மாறுதல்
  alternative: முழுவதும் பன்மை அல்லது முழுவதும் ஒருமை
  rationale: רָאִיתָ, נְשָׂאֲךָ, אֱלֹהֶיךָ ஆகியவை ஒருமை; הֲלַכְתֶּם, בֹּאֲכֶם ஆகியவை பன்மை. இஸ்ரவேலை ஒரே சமூகமாகவும் அதன் உறுப்பினர்களைப் பன்மையாகவும் நோக்கும் மூலத்தின் திடீர் எண்ணிக்கை மாற்றத்தைத் தமிழிலும் வெளிப்படையாகப் பேணுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், எளிதில் புரியும் அதேவேளையில் கண்ணியமான நடையில் அமைக்கப்பட்டது. மூலத்தின் நீண்ட வாக்கிய ஓட்டம் கோடால் தெளிவுபடுத்தப்பட்டுள்ளது. தெய்வத்தைக் குறிக்கும் வினைமுற்றில் மரியாதை ஒருமை பயன்படுத்தப்பட்டாலும், எபிரெயத்தின் உரையாடல் எண்ணிக்கை மாற்றம் திட்டமிட்டு பேணப்பட்டுள்ளது.
