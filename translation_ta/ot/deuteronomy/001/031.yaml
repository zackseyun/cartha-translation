- from: நீ பார்த்த அந்தப் பாலைநிலத்திலும்[a], ஒரு மனிதன் தன் மகனைச் சுமப்பதுபோல உன் கடவுளாகிய யாவே உன்னைச் சுமந்தார்[b]—நீங்கள் இந்த இடத்துக்கு வந்து சேரும்வரை சென்ற வழி முழுவதிலும் இதைக் கண்டீர்கள்.
  to: நீ பார்த்த பாலைநிலத்திலும்[a], ஒரு மனிதன் தன் மகனைச் சுமப்பதுபோல, நீங்கள் இந்த இடத்துக்கு வந்து சேரும்வரை சென்ற வழி முழுவதிலும் உன் கடவுளாகிய யாவே உன்னைச் சுமந்ததை நீ கண்டாய்.[b]
  rationale: 'The correction restores the Hebrew syntax and sense: the singular addressee saw, in the wilderness, that Yahweh had carried him, as a man carries his son, throughout the route traveled by the plural community until its arrival at the present place. The number shift and both footnote anchors are retained.'
