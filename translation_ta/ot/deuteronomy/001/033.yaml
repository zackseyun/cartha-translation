  to: உங்களுக்கு முன்பாக வழியில் சென்று, நீங்கள் முகாமிடுவதற்கான ஓர் இடத்தை உங்களுக்காகத் தேடி, நீங்கள் செல்லவேண்டிய வழியை உங்களுக்குக் காட்டுவதற்காக இரவில் நெருப்பிலும் பகலில் மேகத்திலும் சென்றவர்.
