  language: en
  yaml_path: translation/ot/deuteronomy/001/033.yaml
  text: who went before you on the way to search out a place for you to camp[a], in fire by night to show you the way in which you should go[b], and in the cloud by day.
translation:
  language: ta
  text: உங்களுக்கு முன்பாக வழியில் சென்று, நீங்கள் முகாமிடுவதற்கான ஓர் இடத்தை உங்களுக்காகத் தேடி, நீங்கள் செல்லவேண்டிய வழியை உங்களுக்குக் காட்டுவதற்காக இரவில் நெருப்பிலும் பகலில் மேகத்திலும் சென்றவர்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַהֹלֵךְ
  choice: முன்பாக வழியில் சென்று
  rationale: Qal வினையெச்சம் முந்தைய வசனத்தில் குறிப்பிடப்பட்ட ஆண்டவரைத் தொடர்ந்து வர்ணிக்கிறது; தமிழில் இயல்பான இறந்தகாலத் தொடர்பெச்ச வடிவம் பயன்படுத்தப்பட்டது.
- source_word: לִפְנֵיכֶם
  choice: உங்களுக்கு முன்பாக
  rationale: மக்களுக்கு முன்னே வழிகாட்டியாகச் சென்ற இடம்சார் பொருளைத் தெளிவாகக் காட்டுகிறது.
- source_word: לָתוּר
  choice: தேடி
  rationale: தங்குவதற்கு ஏற்ற இடத்தை ஆராய்ந்து கண்டறிதல் என்ற பொருளை, தேவையற்ற இராணுவச் சாயல் இன்றி தருகிறது.
- source_word: מָקוֹם לַחֲנֹתְכֶם
  choice: நீங்கள் முகாமிடுவதற்கான ஓர் இடம்
  rationale: மக்கள் தங்கிப் பாளயமிட ஏற்ற இடம் என்ற நோக்கப் பொருளை நவீனத் தமிழில் இயல்பாக வழங்குகிறது.
- source_word: בָּאֵשׁ לַיְלָה
  choice: இரவில் நெருப்பிலும்
  rationale: இரவில் நெருப்பின் மூலம் நிகழ்ந்த இறை வழிநடத்தலை எபிரெய அமைப்புக்கு நெருக்கமாகப் பாதுகாக்கிறது.
- source_word: לַרְאֹתְכֶם
  choice: உங்களுக்குக் காட்டுவதற்காக
  rationale: ראה என்பதன் Hiphil காரணவினைப் பொருளை தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: בַּדֶּרֶךְ אֲשֶׁר תֵּלְכוּ בָהּ
  choice: நீங்கள் செல்லவேண்டிய வழி
  rationale: கடவுள் காட்டிய பயணப் பாதையைக் குறிக்கிறது; இது வெறும் ஒழுக்கக் கட்டளையாக மட்டும் ஒலிக்காமல் வழிகாட்டுதலின் பொருளைத் தருகிறது.
- source_word: וּבֶעָנָן יוֹמָם
  choice: பகலில் மேகத்திலும்
  rationale: வனாந்தரப் பயணத்தில் அறியப்பட்ட மேகத்தின் மூலம் கிடைத்த பகல்நேர வழிநடத்தலைக் குறிக்கிறது; இணையான தமிழ் அமைப்பு காக்கப்பட்டது.
theological_decisions:
- issue: முந்தைய வசனத்திலிருந்து தொடரும் கர்த்தரே இவ்வசனத்தின் எழுவாய்
  choice: இறுதியில் ‘இருந்தவர்’ என்று தொடர்பை நிறைவு செய்து, கடவுளின் பெயரை மீண்டும் சேர்க்கவில்லை.
  alternative: ‘உங்கள் கடவுளாகிய ஆண்டவர்’ என்பதை விளக்கத்திற்காக இவ்வசனத்திலும் வெளிப்படையாகச் சேர்த்தல்.
  rationale: எபிரெய வசனம் முந்தைய வசனத்தை இலக்கண ரீதியாகச் சார்ந்துள்ளது. மூலத்தில் இல்லாத இறைப்பெயரைச் சேர்க்காமல் அந்தத் தொடர்பைத் தமிழ் வாக்கியம் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; எளிமையானதாயினும் கண்ணியமான வேதாகம நடை. எபிரெய மூலத்தின் தொடர்ச்சியான தொடர்பெச்ச அமைப்பு தமிழில் வாசிக்கத்தக்க ஒரே வாக்கியமாக அமைக்கப்பட்டது.
