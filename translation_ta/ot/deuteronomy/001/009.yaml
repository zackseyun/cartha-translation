  yaml_path: translation/ot/deuteronomy/001/009.yaml
  text: And I said to you at that time, saying, ‘I am not able to bear you by myself.’
translation:
  language: ta
  text: 'அந்த நேரத்தில் நான் உங்களிடம் கூறினேன்: “நான் தனியாக உங்களைச் சுமக்க முடியாது.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בָּעֵת הַהִוא
  choice: அந்த நேரத்தில்
  rationale: குறிப்பிட்ட கடந்தகாலச் சூழலை இயல்பான நவீனத் தமிழில் துல்லியமாகக் குறிக்கிறது.
- source_word: לֵאמֹר
  choice: 'கூறியது:'
  rationale: எபிரெய மொழியின் நேரடி உரையை அறிமுகப்படுத்தும் வடிவத்தைத் தமிழில் இயல்பாகச் சொல்கிறது; தனியாக ‘சொல்லி’ என்று மீளுரைப்பதைத் தவிர்க்கிறது.
- source_word: לֹא אוּכַל
  choice: முடியாது
  rationale: பேசுபவரின் இயலாமையை நேரடியாகப் பாதுகாக்கிறது.
- source_word: לְבַדִּי
  choice: நான் ஒருவனாக
  rationale: மோசே தனியாக இந்தப் பொறுப்பை ஏற்க இயலாது என்பதைக் கவனமாக வெளிப்படுத்துகிறது.
- source_word: שְׂאֵת אֶתְכֶם
  choice: உங்களைச் சுமக்க
  rationale: נשא என்ற வினையின் ‘சுமத்தல்/தாங்குதல்’ உருவகத்தைப் பாதுகாக்கிறது; இங்கு மக்களை வழிநடத்தும் பொறுப்பையும் உட்கொள்கிறது.
theological_decisions:
- issue: ‘உங்களைச் சுமக்க’ என்பதன் பொருள்
  choice: உருவகமான ‘சுமக்க’ என்பதையே முதன்மை உரையில் வைத்தல்
  alternative: ‘உங்களை வழிநடத்தும் பொறுப்பை ஏற்க’
  rationale: மூலத்தின் உருவகத்தையும் அதன் திறந்த பொருள் பரப்பையும் பாதுகாக்கிறது; நிர்வாகப் பொறுப்பு என்ற ஒரே விளக்கத்துக்குள் வசனத்தைச் சுருக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழ்; எளிமையான, கண்ணியமான நேரடி உரை. எபிரெய ‘சொல்லும்படி/சொல்லி’ என்ற மேற்கோள் அறிமுக அமைப்பு தமிழில் இயல்பாக இரட்டிக்காமல், ‘கூறியது:’ என்ற வடிவில் பிரதிபலிக்கப்பட்டுள்ளது.
