  source_fidelity: மூல எபிரெயத்தில் மோசே, அக்காலத்தில் மக்களிடம், தன்னால் அவர்களைத் தனியாகத் தாங்க முடியாது என்று கூறுகிறார். வரைவின் பொருள் இதைச் சரியாகப் பிரதிபலிக்கிறது. எனினும் «நான் உங்களிடம் கூறியது:» என்பது இவ்விடத்தில் முடிவுற்ற வினைச்சொல்லாக இல்லாமல் பெயரெச்சத் தொடராகத் தோன்றுகிறது; மூலத்தின் «நான் சொன்னேன்» என்ற நேரடி கூற்றைத் தெளிவாகக் கொடுக்க «கூறினேன்» தேவைப்படுகிறது. மேற்கோளுக்கு முன் பெருங்குடல் பயன்படுத்தப்படுவதால் לֵאמֹר-ன் மேற்கோள்-அறிமுகப் பணி இயல்பாக வெளிப்படுகிறது.
  naturalness: «அந்த நேரத்தில் நான் உங்களிடம் கூறினேன்:» என்பது நவீன நிலையான தமிழில் தெளிவானதும் இயல்பானதுமாகும். «நான் தனியாக» என்பது «நான் ஒருவனாக» என்பதைக் காட்டிலும் குறைவான பால்வகைச் சுமையுடன், லְבַדִּי என்பதன் ‘என்னால் மட்டுமே/தனியாக’ என்ற பொருளைச் செம்மையாகத் தருகிறது.
  terminology: «உங்களைச் சுமக்க» என்பது שְׂאֵת אֶתְכֶם என்ற உருவகத்தைப் பாதுகாக்கும் சரியான தேர்வு. அதை நிர்வாக அல்லது நீதித்துறைப் பொறுப்பு என்று பிரதான உரையில் விளக்கி வரையறுக்க வேண்டாம். சிறப்புப் பெயர்கள் அல்லது இறையியல் சொற்கள் இவ்வசனத்தில் இல்லை.
