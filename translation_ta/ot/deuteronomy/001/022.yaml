base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/022.yaml
  text: Then all of you came near to me and said[a], ‘Let us send men ahead of us, so that they may explore the land for us and bring us back word of the way by which we should go up into it[b], and of the cities into which we shall come.’
translation:
  language: ta
  text: அப்போது நீங்கள் எல்லாரும் என்னிடம் வந்து, ‘நமக்கு முன்னதாக ஆண்களை அனுப்புவோம். அவர்கள் நமக்காக அந்த நாட்டை ஆராய்ந்து[a], நாம் அதற்குள் எந்த வழியாக ஏறிச் செல்ல வேண்டும் என்பதையும், நாம் செல்லவிருக்கும் நகரங்கள் எவை என்பதையும் பற்றிய அறிக்கையை நம்மிடம் கொண்டுவரட்டும்’ என்று சொன்னீர்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அந்த நாட்டை நமக்காகத் தேடி அறிந்து.’ எபிரெய வினைச்சொல் தேடுதல் அல்லது ஆராய்தல் என்று பொருள்படலாம்; மறைவான உளவுப்பணி என்பது அந்தச் சொல்லில் கட்டாயமாகக் குறிக்கப்படவில்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּקְרְבוּן אֵלַי כֻּלְּכֶם
  choice: நீங்கள் எல்லாரும் என்னிடம் வந்து
  rationale: קָרַב என்பதன் ‘அணுகுதல்/அருகில் வருதல்’ என்ற பொருளை இயல்பான தமிழில் தருகிறது; כֻּלְּכֶם என்பதன் வலியுறுத்தலை ‘எல்லாரும்’ காக்கிறது.
- source_word: נִשְׁלְחָה אֲנָשִׁים
  choice: ஆட்களை அனுப்புவோம்
  rationale: கூட்டு விருப்பத்தைத் தெரிவிக்கும் cohortative வடிவத்தை ‘அனுப்புவோம்’ காட்டுகிறது. சூழலில் தேர்ந்தெடுக்கப்பட்ட ஆண்கள் குறிக்கப்பட்டாலும், நவீன தமிழில் ‘ஆட்கள்’ என்பது இயல்பாகவும் மனிதர்களைக் குறிக்கும் பொருளைத் துல்லியமாகவும் தருகிறது.
- source_word: לְפָנֵינוּ
  choice: நமக்கு முன்னால்
  rationale: முன்னதாகச் செல்வதைக் குறிக்கும் எபிரெயச் சொல்லின் இடவியல் கருத்தைத் தெளிவாகத் தருகிறது.
- source_word: וְיַחְפְּרוּ לָנוּ אֶת הָאָרֶץ
  choice: அவர்கள் நமக்காக அந்த நாட்டை ஆராய்ந்து
  rationale: חָפַר இங்கு நிலத்தைத் தேடி ஆராய்வதைக் குறிக்கிறது. ‘ஆராய்ந்து’ என்பது மறைமுக உளவுப்பணியை தேவையின்றி முன்கூட்டியே குறிப்பதில்லை.
- source_word: וְיָשִׁבוּ אֹתָנוּ דָּבָר
  choice: தகவலை நம்மிடம் கொண்டுவரட்டும்
  rationale: செய்தி அல்லது அறிக்கையைத் திரும்பக் கொண்டுவருதல் என்ற எபிரெய மொழிவழக்கை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: אֶת הַדֶּרֶךְ אֲשֶׁר נַעֲלֶה בָּהּ
  choice: நாம் அதற்குள் எந்த வழியாக ஏறிச் செல்ல வேண்டும்
  rationale: דֶּרֶךְ என்பதற்கு ‘வழி’ என்றும் עָלָה என்பதற்கு ‘ஏறிச் செல்லுதல்’ என்றும் நேர்த்தியாகப் பொருள் தருகிறது; ‘வேண்டும்’ சூழலிலுள்ள ஆலோசனை சார்ந்த நுணுக்கத்தைக் காட்டுகிறது.
- source_word: וְאֵת הֶעָרִים אֲשֶׁר נָבֹא אֲלֵיהֶן
  choice: எந்த நகரங்களுக்குள் செல்ல வேண்டும்
  rationale: சென்றடைய வேண்டிய நகரங்களைப் பற்றிய அறிக்கையை அவர்கள் கோருகின்றனர்; ‘நகரங்களுக்குள்’ என்பது வெறும் அணுகுதலைவிட அவற்றில் நுழைவதைத் தெளிவாக்குகிறது.
