  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் dignified உரைநடை பயன்படுத்தப்பட்டுள்ளது. எபிரெயத்தின் நேரடி மொழிவழக்குகள் இயல்பான தமிழாக்கத்துடன் சமநிலைப்படுத்தப்பட்டுள்ளன; ‘ஏறிச் செல்ல’ என்பது மூலத்தின் நிலவியல்/மொழிவழக்குச் சாயலைக் காக்கிறது.
