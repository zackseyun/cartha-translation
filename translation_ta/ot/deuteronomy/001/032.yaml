  text: וּ/בַ/דָּבָ֖ר הַ/זֶּ֑ה אֵֽינְ/כֶם֙ מַאֲמִינִ֔ם בַּ/יהוָ֖ה אֱלֹהֵי/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/032.yaml
  text: Yet in this matter you did not believe in Yahweh your God[a].
translation:
  language: ta
  text: ஆனாலும், இந்தக் காரியத்தில் உங்கள் கடவுளாகிய ஆண்டவர்மேல் நீங்கள் நம்பிக்கை வைக்கவில்லை.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உங்கள் கடவுளாகிய ஆண்டவரை நீங்கள் நம்பவில்லை.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בַ/דָּבָר הַ/זֶּה
  choice: ஆனாலும், இந்தக் காரியத்தில்
  rationale: דָּבָר இங்கு தனிப்பட்ட ‘சொல்’ என்பதைக் காட்டிலும் முன்பு விவரிக்கப்பட்ட நிகழ்வு அல்லது காரியத்தைக் குறிக்கிறது. וּ சூழலில் மோசேயின் கண்டிப்பைத் தொடரும் மென்மையான எதிர்மறை இணைப்பாக இருப்பதால் ‘ஆனாலும்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: אֵינְ/כֶם מַאֲמִינִם
  choice: நீங்கள் நம்பிக்கை வைக்கவில்லை
  rationale: எதிர்மறைத் துகளுடன் வரும் אמן வினையின் ஹிஃபில் பங்கேற்பு வடிவம், அந்த நிகழ்வில் மக்களின் தொடர்ச்சியான அவநம்பிக்கை நிலையை வெளிப்படுத்துகிறது. நவீன தமிழில் ‘நம்பிக்கை வைக்கவில்லை’ என்பது நம்புதல் மற்றும் சார்ந்திருத்தல் ஆகிய அர்த்தங்களையும் இயல்பாகத் தாங்குகிறது.
- source_word: בַּ/יהוָה
  choice: ஆண்டவர்மேல்
  rationale: ב முன்னொட்டு நம்பிக்கையின் பொருளைக் குறிக்கிறது; தமிழில் ‘மேல் நம்பிக்கை வைத்தல்’ இயல்பான வடிவம். יהוה மரபுப்படி ‘ஆண்டவர்’ என வழங்கப்படுகிறது.
- source_word: אֱלֹהֵי/כֶם
  choice: உங்கள் கடவுளாகிய
  rationale: இரண்டாம் நபர் பன்மை உரிமை விகுதியை நேரடியாகப் பாதுகாத்து, உடன்படிக்கை உறவின் வலியுறுத்தலை வெளிப்படுத்துகிறது.
theological_decisions:
- issue: אמן + ב என்பதன் நம்புதல்/நம்பிக்கை வைத்தல் சார்ந்த பொருள்
  choice: உங்கள் கடவுளாகிய ஆண்டவர்மேல் நீங்கள் நம்பிக்கை வைக்கவில்லை
  alternative: உங்கள் கடவுளாகிய ஆண்டவரை நீங்கள் நம்பவில்லை
  rationale: எபிரெய ב, ஆண்டவர்மீது நம்பிக்கை வைப்பதையும் அவரை நம்புவதையும் குறிக்கக்கூடும். முதன்மை உரை அந்த உறவுசார் நம்பிக்கையை வெளிப்படுத்துகிறது; மாற்று வாசிப்பு, உடனடி சூழலில் அவரது வார்த்தையையும் வாக்குறுதியையும் ஏற்காததைத் தெளிவாக்குகிறது. இரண்டிற்கிடையேயான அர்த்தப் பதற்றம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘காரியம்’ உடனடியான சூழலைச் சுட்டுகிறது; ‘ஆண்டவர்’ தெய்வீகப் பெயரான יהוה-க்கு மரபான தமிழ் வடிவமாகும்.
