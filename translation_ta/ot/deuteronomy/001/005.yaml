  text: בְּ/עֵ֥בֶר הַ/יַּרְדֵּ֖ן בְּ/אֶ֣רֶץ מוֹאָ֑ב הוֹאִ֣יל מֹשֶׁ֔ה בֵּאֵ֛ר אֶת הַ/תּוֹרָ֥ה הַ/זֹּ֖את לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/005.yaml
  text: 'Beyond the Jordan[a], in the land of Moab, Moses began to explain this law[b], saying:'
translation:
  language: ta
  text: 'யோர்தானுக்கு அப்பால்[a], மோவாப் நாட்டில், மோசே இந்தச் சட்டத்தை[b] விளக்கத் தொடங்கினார்:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘யோர்தானுக்கு மறுபுறம்’ அல்லது ‘யோர்தானின் மறுபக்கத்தில்.’ இந்த எபிரெயச் சொற்றொடரின் பொருள் பேசுபவரின் புவியியல் நிலையைச் சார்ந்தது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘இந்தப் போதனையை.’ எபிரெய மொழியிலுள்ள தோரா என்ற சொல் ‘சட்டம்’ என்பதையும், விரிவான பொருளில் ‘போதனை’ அல்லது ‘அறிவுரை’ என்பதையும் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּעֵבֶר הַיַּרְדֵּן
  choice: யோர்தானுக்கு அப்பால்
  rationale: இந்த எபிரெயச் சொற்றொடர், பேசுபவரின் புவியியல் நிலையைக் கொண்டு யோர்தானின் மறுபக்கத்தைக் குறிக்கிறது. ‘யோர்தானுக்கு அப்பால்’ என்பது இயல்பான தமிழாகவும் மூலத்தின் சார்புநிலையையும் காக்கும் வகையிலும் உள்ளது.
- source_word: בְּאֶרֶץ מוֹאָב
  choice: மோவாப் நாட்டில்
  rationale: אֶרֶץ இங்கு புவியியல்-அரசியல் பகுதியைக் குறிக்கிறது; ‘நாடு’ என்பது தெளிவான நவீனத் தமிழ்.
- source_word: הוֹאִיל
  choice: தொடங்கி
  rationale: அடுத்து வரும் செயலை மேற்கொள்ளத் தொடங்கியதைக் குறிக்கும் இந்தச் சூழல்சார் பொருளை ‘தொடங்கி’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: בֵּאֵר
  choice: விளக்க
  rationale: באר என்பது ஒன்றைத் தெளிவாக்குதல் அல்லது விரித்துரைத்தல் என்பதைக் குறிக்கிறது. ‘விளக்க’ என்பது எளிமையான, துல்லியமான நவீனத் தமிழ்.
- source_word: הַתּוֹרָה הַזֹּאת
  choice: இந்தச் சட்டத்தை
  rationale: תּוֹרָה என்பதற்கு விரிவாக ‘போதனை/அறிவுரை’ என்ற பொருள் இருக்கலாம்; ஆனால் உபாகமத்தின் உடன்படிக்கை மற்றும் சட்டச் சூழலில் ‘சட்டம்’ அதன் சட்டப்பூர்வ வலிமையைத் தெளிவாகக் காக்கிறது.
- source_word: לֵאמֹר
  choice: 'சொன்னது:'
  rationale: பின்வரும் உரையை அறிமுகப்படுத்தும் பேச்சுக் குறியீட்டை தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: உடன்படிக்கைச் சூழலில் תּוֹרָה என்பதன் மொழிபெயர்ப்பு
  choice: இந்தச் சட்டத்தை
  alternative: இந்தப் போதனையை
  rationale: இவ்வசனம் மோசே உடன்படிக்கையின் விதிமுறைகளை விரித்துரைப்பதை அறிமுகப்படுத்துகிறது. ‘சட்டம்’ என்பது அதன் சட்ட-உடன்படிக்கைப் பரிமாணத்தைக் காக்கிறது; அதேவேளை ‘போதனை’ என்ற விரிவான பொருளை அடிக்குறிப்பு பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையுடன் மொழிபெயர்க்கப்பட்டது. ‘விளக்கத் தொடங்கிச் சொன்னது’ என்பது எபிரெய வினைத்தொடரையும் அடுத்துவரும் உரைக்கான அறிமுகத்தையும் இயல்பான தமிழில் இணைக்கிறது.
