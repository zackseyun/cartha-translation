  text: וָ/אֲצַוֶּה֙ אֶת שֹׁ֣פְטֵי/כֶ֔ם בָּ/עֵ֥ת הַ/הִ֖וא לֵ/אמֹ֑ר שָׁמֹ֤עַ בֵּין אֲחֵי/כֶם֙ וּ/שְׁפַטְתֶּ֣ם צֶ֔דֶק בֵּֽין אִ֥ישׁ וּ/בֵין אָחִ֖י/ו וּ/בֵ֥ין גֵּרֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/016.yaml
  text: And at that time I commanded your judges[a], saying, ‘Hear the cases between your brothers[c][b], and judge righteously between a man and his brother or the resident foreigner with him.’
translation:
  language: ta
  text: 'அக்காலத்தில் நான் உங்கள் நீதிபதிகளுக்குக் கட்டளையிட்டேன்: “உங்கள் சகோதரர்களுக்கு இடையிலான வழக்குகளைக் கேட்டு, ஒருவனுக்கும் அவனுடைய சகோதரனுக்கும் அல்லது அவனோடு குடியிருக்கும் அந்நியனுக்கும் இடையே நீதியுடன்[a] தீர்ப்பளியுங்கள்.[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “நீதியுடன்” என்பதை “நியாயமாக” என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் சட்டநீதியையும் அறச்செம்மையையும் குறிக்கக்கூடும்.
    reason: lexical_alternative
  - marker: b
    text: “அவனோடு குடியிருக்கும் அந்நியன்” என்பதை “அவனுடைய குடியிருப்புப் பிறநாட்டவர்” என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் גֵּר (கேர்) இஸ்ரவேலரிடையே வாழ்ந்த பிறநாட்டவரைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֲצַוֶּה
  choice: நான் ... கட்டளையிட்டுச் சொன்னது
  rationale: צוה அதிகாரப்பூர்வமான கட்டளையைக் குறிக்கிறது; தொடரும் לֵאמֹר என்பதையும் இயல்பான தமிழில் இணைத்துக் காட்டுகிறது.
- source_word: שֹׁפְטֵיכֶם
  choice: உங்கள் நீதிபதிகள்
  rationale: சட்ட வழக்குகளைக் கேட்டு தீர்ப்பளிக்க நியமிக்கப்பட்டவர்களைத் தெளிவாகக் குறிக்கிறது.
- source_word: שָׁמֹעַ בֵּין אֲחֵיכֶם
  choice: உங்கள் சகோதரர்களுக்கு இடையிலான வழக்குகளைக் கேட்டு
  rationale: שׁמע என்பதன் நீதித்துறைச் சூழலிலான ‘வழக்கை விசாரணைக்கு ஏற்றுக் கேட்பது’ என்ற பொருளைத் தெளிவாக்குகிறது; சகோதரர் என்ற உடன்படிக்கைச் சமூக உறவுமொழியையும் தக்கவைக்கிறது.
- source_word: וּשְׁפַטְתֶּם צֶדֶק
  choice: நீதியுடன் தீர்ப்பளியுங்கள்
  rationale: צֶדֶק இங்கு தீர்ப்பளிக்கும் முறையை விவரிக்கிறது; ‘நீதியுடன்’ என்பது அறநெறி மற்றும் சட்டநீதி ஆகிய இரு நுணுக்கங்களையும் இயல்பான தமிழில் எடுத்துரைக்கிறது.
- source_word: בֵּין אִישׁ וּבֵין אָחִיו
  choice: ஒருவனுக்கும் அவனுடைய சகோதரனுக்கும் இடையே
  rationale: எபிரெய உரையின் ஒருமை மற்றும் உறவுமுறைச் சொல்லாட்சியைப் பாதுகாக்கிறது.
- source_word: גֵּרוֹ
  choice: அவனோடு குடியிருக்கும் அந்நியன்
  rationale: גֵּר என்பது தற்காலிகப் பயணி அல்ல, இஸ்ரவேல் சமூகத்தின் நடுவே வாழும் பிறநாட்டுக் குடியிருப்பாளரைக் குறிக்கிறது; உரிய பிரதிப்பெயர் பின்னொட்டையும் ‘அவனோடு’ என வெளிப்படுத்துகிறது.
theological_decisions:
- issue: אֲחֵיכֶם மற்றும் אָחִיו ஆகிய ஆண்பால் உறவுமுறைச் சொற்கள்
  choice: சகோதரர்கள் / அவனுடைய சகோதரன்
  alternative: சக இஸ்ரவேலர் / சக மனிதன்
  rationale: சட்டத்தின் பயன்பாடு சமூகத்தை விரிவாகச் சார்ந்திருந்தாலும், மூலத்தின் உடன்படிக்கைச் சமூக உறவுமொழியை மறைக்காமல் பாதுகாக்கிறது.
- issue: நீதித்துறைச் சூழலில் צֶדֶק என்பதன் பொருள்
  choice: நீதியுடன்
  alternative: நேர்மையாக / நியாயமாக
  rationale: இச்சொல் நீதியையும் அறச்செம்மையையும் ஒருங்கே சுட்டக்கூடும்; ‘நீதியுடன்’ இச்சூழலில் இரண்டையும் தேவையின்றி பிரிக்காமல் வைத்திருக்கிறது.
- issue: וּבֵין தொடரின் உறவு
  choice: சகோதரனுக்கும் அல்லது குடியிருக்கும் அந்நியனுக்கும்
  alternative: சகோதரனுக்கும் குடியிருக்கும் அந்நியனுக்கும்
  rationale: வழக்கு ஒருவனுக்கும் எதிர்த்தரப்பான அவனுடைய சகோதரன் அல்லது குடியிருக்கும் அந்நியன் ஆகியோரில் ஒருவருக்கும் இடையே இருப்பதாகத் தமிழில் தெளிவுபடுத்துகிறது; எபிரெய இணைப்புச் சொல்லின் பட்டியல் இயல்பை மிகையாகக் கட்டுப்படுத்தவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில் dignified சட்டநடை பயன்படுத்தப்பட்டுள்ளது. ‘வழக்குகளைக் கேட்டு’, ‘தீர்ப்பளியுங்கள்’ ஆகியவை நீதித்துறைச் சூழலை இயல்பாகத் தெரிவிக்கின்றன; ‘சகோதரர்’ என்ற மூல உறவுமொழி பாதுகாக்கப்பட்டுள்ளது.
