base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/019.yaml
  text: Then we set out from Horeb and went through all that great and fearsome wilderness that you saw on the way to the hill country of the Amorites[a], just as Yahweh our God commanded us, and we came as far as Kadesh-barnea.
translation:
  language: ta
  text: பின்பு நாம் ஓரேபிலிருந்து புறப்பட்டு, நமது கடவுளாகிய யாவே நமக்குக் கட்டளையிட்டபடியே, எமோரியரின் மலைநாட்டுக்குச் செல்லும் வழியில் நீங்கள் கண்ட அந்தப் பெரியதும் அச்சமூட்டுவதுமான[a] வனாந்தரம் முழுவதையும் கடந்து, காதேஸ்-பர்னேயாவரை வந்தோம்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பெரியதும் பயங்கரமானதுமான வனாந்தரம்.” எபிரெயப் பெயரடை பயம், பிரமிப்பு அல்லது திகில் எழுப்புவதைச் சுட்டலாம்.
    reason: נוֹרָא என்ற சொல்லின் உண்மையான பொருள் விரிவையும் வலுவான மாற்று மொழிபெயர்ப்பையும் பாதுகாக்கிறது.
lexical_decisions:
- source_word: וַנִּסַּע
  choice: நாம் ... புறப்பட்டு
  rationale: נסע என்பது முகாமைக் கலைத்துப் பயணத்தைத் தொடங்குவதைக் குறிக்கிறது; ‘புறப்பட்டு’ அந்தப் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: מֵחֹרֵב
  choice: ஓரேபிலிருந்து
  rationale: இடப்பெயர் தமிழில் ஒலிபெயர்க்கப்பட்டு, מִן முன்னொட்டு ‘-இலிருந்து’ என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: וַנֵּלֶךְ אֵת כָּל הַמִּדְבָּר
  choice: வனாந்தரம் முழுவதையும் கடந்து
  rationale: הלך என்பதுடன் நேரடிச் செயப்படுபொருளாக வரும் ‘வனாந்தரம் முழுவதும்’ என்ற அமைப்பு, அந்தப் பகுதியை ஊடறுத்துச் சென்றதைக் குறிக்கிறது; தமிழில் ‘கடந்து’ என்பது இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: הַמִּדְבָּר
  choice: வனாந்தரம்
  rationale: இஸ்ரவேலரின் பயணச் சூழலில் மִדְבָּר என்பது வெறும் மணற்பாலை மட்டுமல்லாத, மக்கள் குடியிருப்பு குறைந்த வறண்ட நிலப்பகுதியைக் குறிக்கிறது; ‘வனாந்தரம்’ வேதாகம நடையிலும் பொதுப் புரிதலிலும் பொருத்தமானது.
- source_word: הַגָּדוֹל וְהַנּוֹרָא
  choice: பெரியதும் அச்சமூட்டுவதுமான
  rationale: גָּדוֹל என்பது ‘பெரிய’; נוֹרָא என்பது பயம், திகில் அல்லது பிரமிப்பு எழுப்புவதைச் சுட்டுகிறது. ‘அச்சமூட்டுவதுமான’ என்பது அதன் உணர்வுவலிமையைத் தக்கவைத்து, ஒழுக்கத் தீர்ப்பைச் சேர்க்காமல் மொழிபெயர்க்கிறது.
- source_word: אֲשֶׁר רְאִיתֶם
  choice: நீங்கள் கண்ட
  rationale: கேட்போர் நேரடியாக அனுபவித்ததைக் குறிப்பதான எளிய சார்புத்தொடர்; ‘நீங்கள் கண்ட’ இயல்பான நவீனத் தமிழ்.
- source_word: דֶּרֶךְ הַר הָאֱמֹרִי
  choice: எமோரியரின் மலைநாட்டுக்குச் செல்லும் வழியில்
  rationale: הַר இங்கு தனி மலையைவிட மலைப்பாங்கான பிரதேசத்தைத் தொகுப்பாகக் குறிக்கிறது; דֶּרֶךְ அந்தப் பகுதியை நோக்கிய வழியைச் சுட்டுகிறது.
- source_word: כַּאֲשֶׁר צִוָּה
  choice: கட்டளையிட்டபடியே
  rationale: כַּאֲשֶׁר தெய்வீகக் கட்டளையுடன் நிகழ்ந்த செயல் முழுமையாக ஒத்திருந்ததைத் தெரிவிக்கிறது; ‘-படியே’ அந்த வலியுறுத்தலைப் பாதுகாக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய தனிப்பெயரான יהוה தமிழில் ‘யாவே’ என ஒலிபெயர்க்கப்பட்டுள்ளது; பொதுப்பட்டமான ‘ஆண்டவர்’ என்று மாற்றப்படவில்லை.
- source_word: אֱלֹהֵינוּ
  choice: நமது கடவுள்
  rationale: முதலாம் நபர் பன்மை உடைமைப் பின்னொட்டுடன் வரும் אֱלֹהִים என்பதன் நேரான, இயல்பான தமிழ் மொழிபெயர்ப்பு.
- source_word: עַד קָדֵשׁ בַּרְנֵעַ
  choice: காதேஸ்-பர்னேயாவரை
  rationale: עַד எல்லையையோ சென்றடைந்த இடத்தையோ குறிக்கிறது; ‘-வரை’ அதைத் துல்லியமாகக் காட்டுகிறது, இடப்பெயர் ஒலிபெயர்க்கப்பட்டுள்ளது.
theological_decisions:
- issue: יהוה என்ற தெய்வீகப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: யெகோவா; ஆண்டவர்
  rationale: மூல உரையில் பொதுப்பட்டம் அல்ல, நான்கு எழுத்துகளாலான தனிப்பெயர் நேரடியாக வருகிறது. ஆகவே அதன் பெயர்த்தன்மையைப் பாதுகாக்க ‘யாவே’ என ஒலிபெயர்க்கப்பட்டுள்ளது; ‘ஆண்டவர்’ என்று மாற்றப்படவில்லை.
- issue: נוֹרָא என்பதிலுள்ள பயம், திகில், பிரமிப்பு ஆகிய பொருள் விரிவு
  choice: அச்சமூட்டுவதுமான
  alternative: பயங்கரமானதுமான
  rationale: இந்தச் சொல் அச்சத்தையோ திகிலையோ, சில சூழல்களில் பிரமிப்பையோ எழுப்புவதைச் சுட்டலாம். முதன்மை உரை அந்த அனுபவத் தாக்கத்தைப் பாதுகாக்கிறது; வலுவான மாற்று அடிக்குறிப்பில் தரப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. நீண்ட எபிரெய வாக்கியத்தின் தொடர்ச்சியைத் தக்கவைத்தபோதும், தமிழ் சொல்வரிசை இயல்பாக அமைய கட்டளைத் தொடர் முன்னதாக அமைக்கப்பட்டுள்ளது. இடப்பெயர்களும் தெய்வீகப் பெயரும் ஒலிபெயர்க்கப்பட்டுள்ளன.
