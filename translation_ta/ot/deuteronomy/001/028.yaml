translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டுள்ளது. எபிரெயத்தின் ‘உள்ளம் உருகுதல்’ மற்றும் ‘வானம்வரை அரண்செய்யப்பட்டவை’ என்ற வலுவான படிமங்கள் தட்டையாக்கப்படாமல் பாதுகாக்கப்பட்டுள்ளன; அவற்றின் வழக்குப் பொருள் அடிக்குறிப்புகளில் விளக்கப்பட்டுள்ளது.
