id: DEU.1.28
reference: Deuteronomy 1:28
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: אָנָ֣ה אֲנַ֣חְנוּ עֹלִ֗ים אַחֵי/נוּ֩ הֵמַ֨סּוּ אֶת לְבָבֵ֜/נוּ לֵ/אמֹ֗ר עַ֣ם גָּד֤וֹל וָ/רָם֙ מִמֶּ֔/נּוּ עָרִ֛ים גְּדֹלֹ֥ת וּ/בְצוּרֹ֖ת בַּ/שָּׁמָ֑יִם וְ/גַם בְּנֵ֥י עֲנָקִ֖ים רָאִ֥ינוּ שָֽׁם׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/028.yaml
  text: Where are we going up? Our brothers have melted our hearts[a], saying, ‘The people are greater and taller than we are; the cities are great and fortified up to the heavens; and besides[c][b], we saw the sons of the Anakim there.’
translation:
  language: ta
  text: “நாம் எங்கே ஏறிச் செல்கிறோம்? நம் சகோதரர்கள் நம் உள்ளத்தை உருகச் செய்துவிட்டார்கள்[a]. அவர்கள், ‘அந்த மக்கள் நம்மைவிடப் பெரியவர்களும் உயரமானவர்களுமாய் இருக்கிறார்கள்; அவர்களுடைய நகரங்கள் பெரியவை, வானம்வரை அரண்செய்யப்பட்டவை[b]; அதோடு, ஏனாக்கின் வழிவந்தவர்களையும்[c] அங்கே கண்டோம்’ என்று சொன்னார்கள்.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நம் உள்ளத்தை உருகிப்போகச் செய்துவிட்டார்கள்”; அதாவது, “நம் மன உறுதியைக் குலைத்துவிட்டார்கள்.”
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில், “வானத்தில் அரண்செய்யப்பட்டவை.” இது மிக உயரமான அரண்களைக் குறிக்கும் மிகைப்படுத்திய சொற்றொடர்.
    reason: cultural_note
  - marker: c
    text: அல்லது, “ஏனாக்கியர்”; சொல்லர்த்தமாக, “ஏனாக்கின் மகன்கள்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אָנָה אֲנַחְנוּ עֹלִים
  choice: நாம் எங்கே ஏறிச் செல்கிறோம்?
  rationale: אָנָה செல்லும் இடத்தைப் பற்றிய வினாவாகும்; עֹלִים என்பது மலைநாட்டை நோக்கிச் செல்வதை ‘ஏறிச் செல்லுதல்’ என்ற எபிரெய இயக்கச் சொல்லால் விவரிக்கிறது. தமிழ் மொழியில் இயல்பாகவும் மூலப்படிமத்தைப் பாதுகாக்கும் வகையிலும் மொழிபெயர்க்கப்பட்டது.
- source_word: אַחֵינוּ
  choice: நம் சகோதரர்கள்
  rationale: முதலாம் நபர் பன்மை உடைமை விகுதியுடன் உள்ள ஆண்பால் பன்மையை நேரடியாகப் பிரதிபலிக்கிறது; சூழலில் உடன் இஸ்ரவேலர்களைக் குறிக்கிறது.
- source_word: הֵמַסּוּ אֶת־לְבָבֵנוּ
  choice: நம் உள்ளத்தை உருகச் செய்துவிட்டார்கள்
  rationale: தைரியத்தை இழக்கச் செய்தல் என்ற பொருளுடைய உயிரோட்டமான எபிரெய உருவகத்தைத் தமிழிலும் பாதுகாக்கிறது.
- source_word: עַם גָּדוֹל וָרָם מִמֶּנּוּ
  choice: அந்த மக்கள் நம்மைவிடப் பெரியவர்களும் உயரமானவர்களுமாய் இருக்கிறார்கள்
  rationale: גָּדוֹל அளவு அல்லது பெருமையையும், רָם இச்சூழலில் உயரத்தையும் குறிக்கின்றன; ஒப்பீட்டுப் பொருள் வெளிப்படையாக வைக்கப்பட்டுள்ளது.
- source_word: עָרִים גְּדֹלֹת וּבְצוּרֹת בַּשָּׁמָיִם
  choice: அவர்களுடைய நகரங்கள் பெரியவை, வானம்வரை அரண்செய்யப்பட்டவை
  rationale: நகரங்களின் பெருமையையும் பாதுகாப்பு அரண்களின் அளவுக்கதிகமான உயரத்தையும் கூறும் எபிரெய மிகைப்படுத்தல் படிமத்தைப் பாதுகாக்கிறது.
- source_word: וְגַם
  choice: அதோடு
  rationale: அச்சமூட்டும் இன்னொரு செய்தியைச் சேர்க்கும் தொடர்ச்சிப் பொருளை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: בְּנֵי עֲנָקִים
  choice: ஏனாக்கின் வழிவந்தவர்கள்
  rationale: ‘மகன்கள்’ என்ற செமித்திய மரபுத்தொடரின் வம்சவழிப் பொருளைத் தெளிவான தமிழில் தருகிறது; இனக்குழுப் பெயரின் தொடர்பைத் தக்கவைக்கிறது.
- source_word: רָאִינוּ שָׁם
  choice: அங்கே கண்டோம்
  rationale: முடிவுற்ற கடந்தகால நேரடிச் சாட்சியத்தை இயல்பான தமிழில் தெரிவிக்கிறது.
