  text: אִם יִרְאֶ֥ה אִישׁ֙ בָּ/אֲנָשִׁ֣ים הָ/אֵ֔לֶּה הַ/דּ֥וֹר הָ/רָ֖ע הַ/זֶּ֑ה אֵ֚ת הָ/אָ֣רֶץ הַ/טּוֹבָ֔ה אֲשֶׁ֣ר נִשְׁבַּ֔עְתִּי לָ/תֵ֖ת לַ/אֲבֹתֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/035.yaml
  text: Not one man among these men of this evil generation shall see the good land that I swore to give to your fathers—[a]
translation:
  language: ta
  text: இந்தப் பொல்லாத தலைமுறையைச் சேர்ந்த மனிதர்களில் ஒருவன்கூட, உங்கள் தந்தையருக்குக் கொடுப்பதாக நான் சத்தியம் செய்த அந்த நல்ல நாட்டைக் காணமாட்டான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உங்கள் முன்னோர்களுக்குக் கொடுப்பதாக.” எபிரெயத்தில், “உங்கள் தந்தையருக்குக் கொடுப்பதாக.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: ஒருவன்கூட ... காணமாட்டான்
  rationale: இங்கு אִם ஒரு சாதாரண நிபந்தனையை அல்ல, ஆணையோடு இணைந்த வலியுறுத்தப்பட்ட மறுப்பைக் குறிக்கிறது; தமிழில் எதிர்மறை வாக்கியமாக இயல்பாக வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: יִרְאֶה
  choice: காணமாட்டான்
  rationale: ראה என்பதன் அடிப்படைப் பொருள் ‘காணுதல்’; இச்சூழலில் நல்ல நாட்டிற்குள் சென்று அதை அனுபவிப்பதிலிருந்து விலக்கப்படுவதைக் குறித்தாலும், மூலத்தின் ‘காணுதல்’ உருவகம் தக்கவைக்கப்படுகிறது.
- source_word: אִישׁ בָּאֲנָשִׁים הָאֵלֶּה
  choice: இந்த மனிதர்களில் ஒருவன்கூட
  rationale: בְּ இங்கு பகுதியைக் குறிக்கும் பொருளில் ‘இவர்களில்’ என வருகிறது; אִישׁ என்பதின் ஒருமை மற்றும் வலியுறுத்தல் ‘ஒருவன்கூட’ என்பதில் பாதுகாக்கப்படுகிறது.
- source_word: הַדּוֹר הָרָע הַזֶּה
  choice: இந்தப் பொல்லாத தலைமுறை
  rationale: רַע இங்கு வெறும் ‘கெட்ட’ நிலையை அல்ல, ஒழுக்கரீதியான தீமையைச் சுட்டுவதால் ‘பொல்லாத’ என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: אֶת הָאָרֶץ הַטּוֹבָה
  choice: அந்த நல்ல நாட்டை
  rationale: ‘நல்ல நாடு’ என்பது எபிரெயச் சொல்லின் நேரடியான, உடன்படிக்கை ஆசீர்வாதத் தன்மையையும் தக்கவைக்கும் இயல்பான தமிழ் வடிவம்.
- source_word: אֲשֶׁר נִשְׁבַּעְתִּי לָתֵת
  choice: கொடுப்பதாக நான் ஆணையிட்ட
  rationale: נשבע என்பது ஆணையிடுதல் அல்லது சத்தியம் செய்தலைக் குறிக்கிறது; ‘ஆணையிட்ட’ என்பது தெய்வீக உறுதிமொழியின் வலிமையை இயல்பான தமிழில் தருகிறது.
- source_word: לַאֲבֹתֵיכֶם
  choice: உங்கள் தந்தையருக்கு
  rationale: மூலத்தில் உள்ள ஆண்பால் பன்மையான ‘தந்தையர்’ என்பதைக் காக்கிறது; சூழலில் இது முற்பிதாக்களையோ முன்னோர்களையோ குறிக்கலாம்.
theological_decisions:
- issue: לַאֲבֹתֵיכֶם என்பதன் குறிப்பு
  choice: உங்கள் தந்தையருக்கு
  alternative: உங்கள் முன்னோர்களுக்கு
  rationale: எபிரெயச் சொல் நேரடியாக ‘உங்கள் தந்தையர்’ என்று ஆண்பால் பன்மையில் உள்ளது. அதன் விரிவான சூழற்பொருள் ‘முன்னோர்’ என்றாலும், முதன்மை உரையில் மூல வடிவம் காக்கப்பட்டு மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ஆணைச் சூத்திரத்தின் வலியுறுத்தப்பட்ட மறுப்பு ‘ஒருவன்கூட ... காணமாட்டான்’ என இயல்பாக்கப்பட்டுள்ளது; மூலத்தின் ஆண்பால் குறிப்பும் ‘தந்தையர்’ என்ற சொல்லும் பாதுகாக்கப்பட்டுள்ளன.
