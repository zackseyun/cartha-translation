    text: அல்லது, “உங்கள் முன்னோர்களுக்குக் கொடுப்பதாக.” எபிரெயத்தில், “உங்கள் தந்தையருக்குக் கொடுப்பதாக.”
    reason: lexical_alternative
  revision_rationale: The revision replaces “ஆணையிட்ட” with “சத்தியம் செய்த” to faithfully translate the Hebrew oath verb. It also removes an unnecessary repeated demonstrative for natural modern Tamil, while retaining the distributive exclusion (“ஒருவன்கூட”), the moral force of “பொல்லாத,” and the source-oriented “தந்தையர்.”
