  text: רְאֵ֛ה נָתַ֥תִּי לִ/פְנֵי/כֶ֖ם אֶת הָ/אָ֑רֶץ בֹּ֚אוּ וּ/רְשׁ֣וּ אֶת הָ/אָ֔רֶץ אֲשֶׁ֣ר נִשְׁבַּ֣ע יְ֠הוָה לַ/אֲבֹ֨תֵי/כֶ֜ם לְ/אַבְרָהָ֨ם לְ/יִצְחָ֤ק וּֽ/לְ/יַעֲקֹב֙ לָ/תֵ֣ת לָ/הֶ֔ם וּ/לְ/זַרְעָ֖/ם אַחֲרֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/008.yaml
  text: See[a], I have set the land before you. Go in and take possession of the land that Yahweh swore to your fathers—to Abraham, to Isaac[d][c][b], and to Jacob—to give to them and to their offspring after them.
translation:
  language: ta
  text: இதோ[a], நான் அந்த நிலத்தை உங்கள் முன் வைத்திருக்கிறேன். நீங்கள் உள்ளே சென்று, யாவே உங்கள் தந்தையரான ஆபிரகாமுக்கும் ஈசாக்குக்கும் யாக்கோபுக்கும், அவர்களுக்கும் அவர்களுக்குப் பின் அவர்களுடைய சந்ததிக்கும் கொடுப்பதாகச் சத்தியம் செய்த அந்த நிலத்தை உரிமையாக்கிக்கொள்ளுங்கள்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘பார்’ அல்லது ‘கவனி’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘அந்த நிலத்தை உடைமையாக்கிக்கொள்ளுங்கள்’ அல்லது ‘சுதந்தரித்துக்கொள்ளுங்கள்’ என்றும் மொழிபெயர்க்கலாம்; எபிரெய வினைச்சொல் கைப்பற்றி உரிமைபெறுதல் அல்லது சுதந்தரித்தல் என்ற பொருள்களைக் கொள்ளலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: רְאֵה
  choice: இதோ
  rationale: கவனத்தை வலியுறுத்தும் ஒருமை கட்டளைச்சொல். தமிழில் நேரடியான காட்சிப்பொருளை மட்டும் குறிக்காமல், கேட்போரின் கவனத்தை ஈர்க்கும் இயல்பான தொடக்கமாக ‘இதோ’ அமைகிறது.
- source_word: נָתַתִּי לִפְנֵיכֶם
  choice: நான் ... உங்கள் முன் வைத்திருக்கிறேன்
  rationale: נתן என்பதற்கு பொதுவாக ‘கொடு’ என்ற பொருள் இருந்தாலும், לפני உடனான இவ்வமைப்பு ஒன்றை ஒருவர்முன் வைத்து அவருக்குக் கிடைக்கச் செய்வதைச் சுட்டுகிறது. எபிரெய நிறைவுநிலையின் தற்போதைய விளைவையும் ‘வைத்திருக்கிறேன்’ வெளிப்படுத்துகிறது.
- source_word: הָאָרֶץ
  choice: அந்த நாடு
  rationale: இங்கு אֶרֶץ வாக்குத்தத்தம் செய்யப்பட்ட குறிப்பிட்ட நிலப்பகுதியைக் குறிக்கிறது. நவீன தமிழில் ‘அந்த நாடு’ என்பது சூழலுக்கு இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: בֹּאוּ
  choice: நீங்கள் சென்று
  rationale: இது பன்மைக் கட்டளை. அவர்கள் நாட்டிற்குள் நுழைய வேண்டிய நகர்வைத் தமிழில் இயல்பாகக் காட்ட ‘சென்று’ பயன்படுத்தப்பட்டது.
- source_word: וּרְשׁוּ
  choice: உரிமையாக்கிக்கொள்ளுங்கள்
  rationale: ירשׁ என்பது இச்சூழலில் நுழைந்து உடைமையாக்குதல், உரிமைபெறுதல் என்ற செயற்பொருளைக் கொண்டது. ‘உரிமையாக்கிக்கொள்ளுங்கள்’ வாக்குத்தத்தமான சுதந்தரத்தைப் பெற்றுக்கொள்ளும் செயலைத் தெளிவாக்குகிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: נִשְׁבַּע יְהוָה
  choice: யெகோவா ... ஆணையிட்ட
  rationale: נשבע என்பது உறுதிமொழியாக ஆணையிடுதலைக் குறிக்கிறது. יהוה என்ற உடன்படிக்கைப் பெயர் தமிழில் பரவலாக அறியப்படும் ‘யெகோவா’ என ஒலிபெயர்க்கப்பட்டது.
- source_word: לַאֲבֹתֵיכֶם
  choice: உங்கள் தந்தையரான
  rationale: எபிரெயச் சொல் ஆண்பால் பன்மை; உடனே ஆபிரகாம், ஈசாக்கு, யாக்கோபு என்று குறிப்பாக விளக்கப்படுகிறது. எனவே பாலினத்தைப் பொதுமைப்படுத்தாமல் ‘தந்தையர்’ என வழங்கப்பட்டது.
- source_word: לְאַבְרָהָם לְיִצְחָק וּלְיַעֲקֹב
  choice: ஆபிரகாமுக்கும் ஈசாக்குக்கும் யாக்கோபுக்கும்
  rationale: ஒவ்வொரு பெயருக்கும் முன் வரும் לְ முன்னிடைச்சொல்லின் மீளுருவாக்கத்தையும் எபிரெய ஓசைநயத்தையும் தமிழ் வேற்றுமை உருபின் மீளுருவாக்கம் இயல்பாகப் பாதுகாக்கிறது.
- source_word: לָתֵת לָהֶם וּלְזַרְעָם אַחֲרֵיהֶם
  choice: அவர்களுக்குக் கொடுப்பதாகவும், அவர்களுக்குப் பின் அவர்களுடைய சந்ததிக்கும் கொடுப்பதாகவும்
  rationale: לָתֵת இரு பெறுநர்க் குழுக்களுடனும் பொருந்துவதைத் தமிழில் மீண்டும் ‘கொடுப்பதாகவும்’ என்று கூறுவது தெளிவாக்குகிறது. זרע என்பது கூட்டொருமைப் பொருளுடையதால் ‘சந்ததி’ என மொழிபெயர்க்கப்பட்டது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யெகோவா
  alternative: யாவே; கர்த்தர்
  rationale: மூலத்தில் நான்கு எழுத்துகளாலான தனிப்பட்ட இறைப் பெயர் நேரடியாக உள்ளது. அதை ஒரு பட்டமாக மாற்றாமல், தமிழில் பரவலாக அறியப்படும் ஒலிபெயர்ப்பான ‘யெகோவா’ பயன்படுத்தப்பட்டது; எபிரெய உயிரொலி அமைப்பின் அடிப்படையில் ‘யாவே’ என்பதும் சாத்தியம்.
- issue: אֲבֹתֵיכֶם என்பதிலுள்ள பாலினக் குறிப்பு
  choice: உங்கள் தந்தையரான
  alternative: உங்கள் முன்னோர்களான
  rationale: மூலம் வெளிப்படையாக ஆண்பால் பன்மையைப் பயன்படுத்தி, தொடர்ந்து ஆபிரகாம், ஈசாக்கு, யாக்கோபு ஆகியோரைப் பெயரிடுகிறது. எனவே குறிப்பிட்ட ஆண் மூதாதையரை மறைக்காத வாசகம் தேர்ந்தெடுக்கப்பட்டது.
- issue: வாக்குத்தத்தத்தின் பெறுநர்கள் לָהֶם וּלְזַרְעָם
  choice: அவர்களுக்கும் அவர்களுக்குப் பின் அவர்களுடைய சந்ததிக்கும் கொடுப்பதாக
  alternative: அவர்களுடைய சந்ததிக்கு மட்டும் கொடுப்பதாக
  rationale: எபிரெய வாசகம் ‘அவர்களுக்கு’ என்றும் ‘அவர்களுடைய சந்ததிக்கு’ என்றும் இரு பெறுநர்களையும் இலக்கணரீதியாகக் குறிப்பிடுகிறது. அந்த இறையியல் இழுபறியைச் சுருக்காமல் இரண்டையும் வெளிப்படையாக வைத்துள்ளது.
translation_notes:
  register: நவீனத் தரத் தமிழில், மரியாதையும் வாசிப்புத் தெளிவும் கொண்ட உரை. எபிரெயப் பன்மைக் கட்டளைகள் தமிழில் மரியாதைப் பன்மை வடிவத்துடன் இயல்பாக ஒன்றுபடுகின்றன. நீண்ட தொடர்பெயர் அமைப்பு அர்த்தத் தெளிவுக்காக ஒழுங்குபடுத்தப்பட்டாலும், தந்தையர், அவர்களுக்கே அளிக்கப்படும் வாக்கு, பின்னான சந்ததி ஆகிய மூலக் கூறுகள் பாதுகாக்கப்பட்டுள்ளன.
