base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/039.yaml
  text: And your little ones[a], whom you said would become plunder, and your children, who today do not know good or evil—they shall go in there, and I will give it to them[c][b], and they shall possess it.
translation:
  language: ta
  text: “அவர்கள் கொள்ளைப்பொருளாகிவிடுவார்கள்” என்று நீங்கள் சொன்ன உங்கள் சிறு பிள்ளைகளும்[a], இன்று நன்மை தீமை அறியாத உங்கள் மகன்களும்[b] அங்கே செல்வார்கள். அவர்களுக்கு அந்த நாட்டை நான் கொடுப்பேன்; அவர்கள் அதைச் சுதந்தரிப்பார்கள்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அவர்கள் இரையாவார்கள்’ அல்லது ‘சூறைப்பொருளாவார்கள்.’
    reason: lexical_alternative
  - marker: b
    text: ‘நன்மை தீமை அறியாத’ என்பது முதிர்ந்த பகுத்தறிவு இல்லாத நிலையைக் குறிக்கும் எபிரெயச் சொற்றொடர்.
    reason: cultural_note
  - marker: c
    text: அல்லது, ‘அதை உடைமையாக்கிக்கொள்வார்கள்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: טַפְּכֶם
  choice: உங்கள் சிறு பிள்ளைகள்
  rationale: טַף என்பது பொதுவாகச் சந்ததியினர் அனைவரையும் அல்ல, சிறு பிள்ளைகள் அல்லது சார்ந்திருப்போரைக் குறிக்கிறது. சூழலில் அவர்களுடைய பாதுகாப்பற்ற நிலையையும் பெரியவர்களுடனான வேறுபாட்டையும் இந்தச் சொற்றொடர் வெளிப்படுத்துகிறது.
- source_word: לָבַז יִהְיֶה
  choice: கொள்ளைப்பொருளாகிவிடுவார்கள்
  rationale: בַּז என்பது எதிரியால் கைப்பற்றப்படும் கொள்ளைப்பொருள் அல்லது சூறைப்பொருளைக் குறிக்கிறது. இஸ்ரவேலர் அஞ்சிய எதிர்கால விளைவை இயல்பான தமிழில் இது தெரிவிக்கிறது.
- source_word: בְנֵיכֶם
  choice: உங்கள் பிள்ளைகள்
  rationale: בנים என்பதன் வடிவம் ஆண்பால் பன்மையாக இருந்தாலும், இங்கு அடுத்த தலைமுறையை விரிவாகக் குறிக்கிறது. நவீன தமிழில் ‘பிள்ளைகள்’ என்பது இயல்பாகவும் சூழலுக்குப் பொருத்தமாகவும் உள்ளது.
- source_word: לֹא יָדְעוּ הַיּוֹם טוֹב וָרָע
  choice: இன்று நன்மை தீமை அறியாத
  rationale: எபிரெயச் சொற்றொடரின் வடிவத்தைப் பாதுகாத்து, முதிர்ந்த பகுத்தறிவு இன்னும் இல்லாத நிலையைக் குறிக்கிறது; குற்றமின்மை அல்லது பொறுப்புக்குரிய வயது பற்றிய பிற்காலக் கோட்பாட்டை வசனத்துக்குள் சேர்ப்பதில்லை.
- source_word: שָׁמָּה
  choice: அங்கே செல்வார்கள்
  rationale: முன்னதாகப் பேசப்பட்ட நாட்டை நோக்கிய இயக்கத்தை שָׁמָּה குறிக்கிறது. தமிழில் ‘அங்கே செல்வார்கள்’ இயல்பாக அந்த இயக்கத்தை வெளிப்படுத்துகிறது.
- source_word: אֶתְּנֶנָּה
  choice: அவர்களுக்கு அந்த நாட்டை நான் கொடுப்பேன்
  rationale: பெண்பால் ஒருமை பின்னொட்டு முன்பு குறிப்பிடப்பட்ட நாட்டைக் குறிக்கிறது. தமிழில் சுட்டுப்பெயரின் குறிப்பைத் தெளிவாக்க ‘அந்த நாட்டை’ என்று மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: יִירָשׁוּהָ
  choice: அதை உடைமையாக்கிக்கொள்வார்கள்
  rationale: ירשׁ என்பது சூழலுக்கேற்ப சுதந்தரித்தல், கைப்பற்றுதல் அல்லது உடைமையாக்குதல் எனப் பொருள்படும். இங்கு வாக்குத்தத்த நாட்டைப் பெற்று அதில் குடியிருப்பதை ‘உடைமையாக்கிக்கொள்வார்கள்’ விரிவான பொருளில் தெரிவிக்கிறது.
theological_decisions:
- issue: ‘நன்மை தீமை அறியாத’ என்ற சொற்றொடரில் அடுத்த தலைமுறையின் ஒழுக்கநிலை
  choice: முதிர்ந்த பகுத்தறிவு இல்லாத நிலையைக் குறிக்கும் எபிரெய மரபுத்தொடரை அப்படியே பேணுதல்
  alternative: உடன்படிக்கைப் பொறுப்பிலிருந்து முற்றிலும் விலக்கப்பட்டவர்கள் அல்லது முற்றிலும் குற்றமற்றவர்கள் என்று விளக்குதல்
  rationale: இந்த வசனம் தண்டனை பெற்ற பெரியவர்களையும் அவர்களுடைய பிள்ளைகளையும் வேறுபடுத்துகிறது. ஆனால் பொறுப்புக்குரிய வயது போன்ற பிற்கால இறையியல் கேள்விகளை இந்த எபிரெயச் சொற்றொடர் தானாகத் தீர்மானிப்பதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் அதேவேளையில் வேதாகம உரைக்கு ஏற்ற கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. எபிரெயத்தின் இணை அமைப்பு இயல்பான தமிழ்ச் சொற்றொடராகப் பிரிக்கப்பட்டுள்ளது; ‘அந்த நாட்டை’ என்பது மறைமுகப் பொருளைத் தெளிவாக்குகிறது.
