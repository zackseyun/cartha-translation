  to: “அவர்கள் கொள்ளைப்பொருளாகிவிடுவார்கள்” என்று நீங்கள் சொன்ன உங்கள் சிறு பிள்ளைகளும்[a], இன்று நன்மை தீமை அறியாத உங்கள் மகன்களும்[b] அங்கே செல்வார்கள். அவர்களுக்கு அந்த நாட்டை நான் கொடுப்பேன்; அவர்கள் அதைச் சுதந்தரிப்பார்கள்[c].
