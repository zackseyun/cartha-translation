translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் அதே நேரத்தில் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. மூலத்தின் சொல்லடுக்கை இயல்பான தமிழ் வினா அமைப்புக்கு ஏற்ப மாற்றினாலும், ‘நான் ஒருவனாக’ என்ற வலியுறுத்தலும் மூன்று இணைச் சுமைகளும் பாதுகாக்கப்பட்டுள்ளன.
