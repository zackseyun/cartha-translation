base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/012.yaml
  text: How can I alone bear your trouble[a], your burden, and your disputes?
translation:
  language: ta
  text: உங்கள் தொல்லையையும், உங்கள் பாரத்தையும், உங்கள் வழக்குகளையும்[a] நான் ஒருவனாக எப்படித் தாங்க முடியும்?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சச்சரவுகளையும்” அல்லது “தகராறுகளையும்.”
    reason: רִיב என்ற எபிரெயச் சொல் நீதித்துறை வழக்குகளையும் பொதுவான முரண்பாடுகள் அல்லது தகராறுகளையும் குறிக்கக்கூடும்.
lexical_decisions:
- source_word: אֵיכָה
  choice: எப்படி ... முடியும்?
  rationale: இது வெறும் முறையை விசாரிக்கும் கேள்வி அல்ல; தனியாக இதைச் செய்வதிலுள்ள இயலாமையையும் கடினத்தையும் வெளிப்படுத்தும் வினாவாக இருப்பதால், நவீன தமிழில் இயல்பான வினா வடிவம் பயன்படுத்தப்பட்டது.
- source_word: אֶשָּׂא
  choice: தாங்க
  rationale: נשׂא இங்கு உடல் சுமையைத் தூக்குவதை மட்டும் அல்லாமல் பொறுப்பையும் நெருக்கடியையும் சுமப்பதைக் குறிக்கிறது; தொடர்ந்து வரும் மூன்று கருத்துகளுக்கும் ‘தாங்க’ இயல்பாகப் பொருந்துகிறது.
- source_word: לְבַדִּי
  choice: நான் ஒருவனாக
  rationale: மோசே இந்தப் பொறுப்பைத் தனியாக ஏற்க இயலாது என்ற வலியுறுத்தலைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: טָרְחֲכֶם
  choice: உங்கள் தொல்லை
  rationale: טֹרַח என்பது சிரமம், வருத்தம், களைப்பூட்டும் தொல்லை ஆகிய கருத்துகளைக் கொண்டது. அடுத்துள்ள ‘பாரம்’ என்பதிலிருந்து வேறுபடுத்த ‘தொல்லை’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: מַשַּׂאֲכֶם
  choice: உங்கள் பாரம்
  rationale: מַשָּׂא என்பதன் அடிப்படைக் கருத்தான சுமை அல்லது பாரத்தை இயல்பாகத் தெரிவிக்கிறது; இங்கு மக்கள் தொடர்பான பொறுப்புச் சுமையையும் குறிக்க முடியும்.
- source_word: רִיבְכֶם
  choice: உங்கள் வழக்குகள்
  rationale: רִיב என்பது தகராறு, சச்சரவு அல்லது தீர்ப்புக்குக் கொண்டுவரப்படும் வழக்கு எனப் பொருள்படலாம். மக்களுக்கு நீதி வழங்கும் சூழலில் ‘வழக்குகள்’ அதன் நீதித்துறை சார்ந்த பரிமாணத்தைத் தெளிவாகக் காட்டுகிறது; பிற சாத்தியங்கள் அடிக்குறிப்பில் தரப்பட்டுள்ளன.
