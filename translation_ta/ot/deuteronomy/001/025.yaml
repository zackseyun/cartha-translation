source:
  edition: WLC
  text: וַ/יִּקְח֤וּ בְ/יָדָ/ם֙ מִ/פְּרִ֣י הָ/אָ֔רֶץ וַ/יּוֹרִ֖דוּ אֵלֵ֑י/נוּ וַ/יָּשִׁ֨בוּ אֹתָ֤/נוּ דָבָר֙ וַ/יֹּ֣אמְר֔וּ טוֹבָ֣ה הָ/אָ֔רֶץ אֲשֶׁר יְהוָ֥ה אֱלֹהֵ֖י/נוּ נֹתֵ֥ן לָֽ/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/025.yaml
  text: And they took in their hands some of the fruit of the land and brought it down to us[a], and they brought us back word and said, “The land that Yahweh our God is giving to us is good.”
translation:
  language: ta
  text: அவர்கள் அந்த நாட்டின் கனிகளில் சிலவற்றைத் தங்கள் கைகளில் எடுத்துக்கொண்டு, அவற்றை எங்களிடம் கீழே கொண்டுவந்தார்கள். பின்னர் எங்களுக்குச் செய்தி கொண்டு வந்து[a], “நம் கடவுளாகிய யாவே நமக்குக் கொடுக்கிற நாடு நல்லது” என்று சொன்னார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எங்களுக்குத் தெரிவித்தார்கள்”; எபிரெயத்தில், “எங்களிடம் வார்த்தையைத் திரும்பக் கொண்டுவந்தார்கள்.”
    reason: வַיָּשִׁבוּ אֹתָנוּ דָבָר என்ற எபிரெய அறிக்கை-சொற்றொடரின் நேரடியான படிமத்தையும், இயல்பான முதன்மைத் தமிழையும் இணைத்துப் பாதுகாக்கிறது.
lexical_decisions:
- source_word: וַיִּקְחוּ בְיָדָם
  choice: தங்கள் கைகளில் எடுத்துக்கொண்டு
  rationale: לקח என்பதன் இயல்பான ‘எடுத்தல்’ பொருளையும், בְיָדָם என்பதன் தெளிவான உடல்சார் படிமத்தையும் தமிழில் தக்கவைக்கிறது.
- source_word: מִפְּרִי הָאָרֶץ
  choice: அந்த நாட்டின் கனிகளில் சிலவற்றை
  rationale: பகுதிப்பொருள் தரும் מִן முன்னொட்டை ‘சிலவற்றை’ என வெளிப்படுத்தி, மொத்த விளைச்சல் அல்லாமல் மாதிரிப் பொருட்கள் எடுத்துவரப்பட்டதை உணர்த்துகிறது.
- source_word: וַיּוֹרִדוּ אֵלֵינוּ
  choice: அவற்றை எங்களிடம் கீழே கொண்டுவந்தார்கள்
  rationale: Hiphil வடிவிலுள்ள ירד என்பதன் ‘கீழே கொண்டுவருதல்’ என்ற திசைநுட்பத்தைப் பாதுகாக்கிறது; பன்மையான கனிகளுக்கு ஏற்ப தமிழில் ‘அவற்றை’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: וַיָּשִׁבוּ אֹתָנוּ דָבָר
  choice: எங்களிடம் செய்தி கொண்டுவந்து
  rationale: இது திரும்பக் கொண்டுவரப்பட்ட அறிக்கை என்ற எபிரெய சொற்றொடரின் பொருளை இயல்பான தமிழில் தருகிறது; ‘மீண்டும்’ எனச் சேர்ப்பது தமிழில் தவறாக மறுபடியும் செய்ததாக ஒலிக்கக்கூடும்.
- source_word: טוֹבָה הָאָרֶץ
  choice: நாடு நல்லது
  rationale: טוֹבָה தரும் பரந்த நேர்மறை மதிப்பீட்டை எளிமையாகவும் நேரடியாகவும் தருகிறது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: தமிழில் நீண்டகாலமாக நிலைபெற்றுள்ள தெய்வீகப் பெயரின் வடிவம்; மூலத்தில் உள்ள தனிப்பெயரை பொதுப்பட்டமான ‘கர்த்தர்’ என்று மாற்றாமல் பாதுகாக்கிறது.
- source_word: אֱלֹהֵינוּ
  choice: நம் கடவுள்
  rationale: முதல் நபர் பன்மை உடைமையை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: נֹתֵן לָנוּ
  choice: நமக்குக் கொடுக்கிற
  rationale: நடைபெறும் அல்லது நெருங்கிய செயலைக் குறிக்கும் எபிரெயப் பங்கேற்பு வடிவத்தையும், לָנוּ என்பதன் பயனாளிப் பொருளையும் தக்கவைக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரின் மொழிபெயர்ப்பு
  choice: யெகோவா
  alternative: யாவே / கர்த்தர்
  rationale: மூலத்தில் பொதுப்பட்டம் அல்ல, நான்கெழுத்துத் தெய்வீகத் தனிப்பெயர் உள்ளது. தமிழில் வாசகர்களுக்குப் பரவலாக அறியப்பட்ட தனிப்பெயர் வடிவமான ‘யெகோவா’ பயன்படுத்தப்பட்டு, பெயரின் தன்மை பாதுகாக்கப்படுகிறது.
- issue: கடவுள் நாட்டைக் கொடுக்கும் செயலின் காலநிலை
  choice: நமக்குக் கொடுக்கிற
  alternative: நமக்குக் கொடுப்பார் / நமக்குக் கொடுத்திருக்கிறார்
  rationale: נֹתֵן என்ற பங்கேற்பு வடிவம் நிகழ்கால/நெருங்கிய செயலைத் திறந்தவாறு வைக்கிறது; நிறைவேறியதாகவோ வெறும் எதிர்காலமாகவோ குறிப்பிட்டு இறுக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்கு எளிதில் புரியும் வகையில் இயல்பான தொடரமைப்பு பயன்படுத்தப்பட்டுள்ளது. அதேவேளை ‘தங்கள் கைகளில்’ மற்றும் ‘கீழே’ போன்ற மூலத்தின் தெளிவான படிமங்களும் திசைநுட்பமும் பாதுகாக்கப்பட்டுள்ளன.
