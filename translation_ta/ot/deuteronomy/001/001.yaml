translation_notes:
  register: நவீன நிலையான தமிழில், dignified ஆனால் பொதுவாசகர்களுக்குப் புரியும் நடையில் அமைக்கப்பட்டது. இடப்பெயர்கள் தமிழில் நிலைபெற்ற வேதாகம ஒலிப்புமுறைக்கு நெருக்கமாக வழங்கப்பட்டுள்ளன; மூலத்தின் புவியியல் தெளிவின்மை அடிக்குறிப்புகளில் பாதுகாக்கப்பட்டுள்ளது.
