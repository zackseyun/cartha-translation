  text: אֵ֣לֶּה הַ/דְּבָרִ֗ים אֲשֶׁ֨ר דִּבֶּ֤ר מֹשֶׁה֙ אֶל כָּל יִשְׂרָאֵ֔ל בְּ/עֵ֖בֶר הַ/יַּרְדֵּ֑ן בַּ/מִּדְבָּ֡ר בָּֽ/עֲרָבָה֩ מ֨וֹל ס֜וּף בֵּֽין פָּארָ֧ן וּ/בֵֽין תֹּ֛פֶל וְ/לָבָ֥ן וַ/חֲצֵרֹ֖ת וְ/דִ֥י זָהָֽב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/001.yaml
  text: These are the words that Moses spoke to all Israel beyond the Jordan[a], in the wilderness, in the Arabah opposite Suph, between Paran, Tophel, Laban, Hazeroth[d][c][b], and Dizahab.
translation:
  language: ta
  text: யோர்தானுக்கு அப்பால்[a], பாலைநிலத்தில், அரபாவில்[b], சூப்புக்கு[c] எதிரே, பாரானுக்கும் தோப்பேலுக்கும் லாபானுக்கும் ஹசேரோத்துக்கும் தீசகாபுக்கும் இடையே, மோசே இஸ்ரவேலர் அனைவரிடமும் பேசிய வார்த்தைகள் இவையே.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “யோர்தானைக் கடந்து” அல்லது “யோர்தானின் மறுபக்கத்தில்” என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல்லாட்சி வெவ்வேறு புவியியல் நோக்குநிலைகளிலிருந்து புரிந்துகொள்ளப்படலாம்.
    reason: lexical_alternative
  - marker: b
    text: “அரபா” என்பது பிளவுப் பள்ளத்தாக்கு அல்லது சமவெளிப் பகுதியைக் குறிக்கும் புவியியல் சொல்; மரபாக “சமவெளி” என்றும் மொழிபெயர்க்கப்படுகிறது.
    reason: cultural_note
  - marker: c
    text: எபிரெயத்தில் “சூப்” என்று மட்டுமே உள்ளது. சிலர் இதை ஓர் இடப்பெயராகக் கருதுகின்றனர்; வேறு சிலர் இதை “நாணல் கடல்” என்பதுடன் தொடர்புபடுத்துகின்றனர். ஆனால் இங்கு “கடல்” என்ற சொல் இல்லை.
    reason: alternative_reading
lexical_decisions:
- source_word: אֵלֶּה הַדְּבָרִים
  choice: வார்த்தைகள் இவையே
  rationale: நூலின் தொடக்க அறிமுகத் தன்மையையும், தொடர்ந்து வரும் மோசேயின் உரைகளையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: אֲשֶׁר דִּבֶּר מֹשֶׁה
  choice: மோசே ... பேசிய
  rationale: דבר என்பதன் முறையான உரையாற்றும் பொருளைத் தக்கவைத்தபடி தமிழில் இயல்பாக அமைக்கப்பட்டுள்ளது.
- source_word: אֶל כָּל יִשְׂרָאֵל
  choice: இஸ்ரவேலர் அனைவரிடமும்
  rationale: மக்கள் முழுவதையும் குறிக்கும் כָּל என்பதையும், மனிதக் குழுவைக் குறிக்கும் இயல்பான தமிழ் வடிவத்தையும் காக்கிறது.
- source_word: בְּעֵבֶר הַיַּרְדֵּן
  choice: யோர்தானுக்கு அப்பால்
  rationale: புவியியல் நோக்குநிலையைத் தீர்மானிக்காமல், ஆற்றின் மறுபக்கப் பகுதி என்ற எபிரெயச் சொல்லாட்சியைப் பாதுகாக்கிறது.
- source_word: בַּמִּדְבָּר
  choice: பாலைநிலத்தில்
  rationale: மணல் பாலைவனம் என்று மிகைப்படுத்தாமல், மக்கள் வாழ்வு குறைந்த வறண்ட வெளிப்பகுதியைக் குறிக்கிறது.
- source_word: בָּעֲרָבָה
  choice: அரபாவில்
  rationale: பொதுவான ‘சமவெளி’ என்பதற்குப் பதிலாக இங்கு புவியியல் பெயராக இருக்கக்கூடிய தன்மையைத் தக்கவைக்கிறது.
- source_word: מוֹל סוּף
  choice: சூப்புக்கு எதிரே
  rationale: מוֹל என்பதன் ‘எதிரே’ என்ற இடவியல் பொருளைத் தருகிறது; ים இல்லாததால் סוּף என்பதை ‘நாணல் கடல்’ என்று விரிவாக்கவில்லை.
- source_word: בֵּין פָּארָן וּבֵין תֹּפֶל וְלָבָן וַחֲצֵרֹת וְדִי זָהָב
  choice: பாரான், தோப்பேல், லாபான், ஆசரோத், தீசாகாப் ஆகிய இடங்களுக்கு இடையே
  rationale: எல்லா இடப்பெயர்களையும் காத்து, எபிரெயப் பட்டியலை வாசிக்க இயல்பான நவீனத் தமிழில் வழங்குகிறது.
- source_word: דִי זָהָב
  choice: தீசாகாப்
  rationale: சொற்பொருளாக மொழிபெயர்க்காமல் இடப்பெயராக ஒலிபெயர்க்கப்பட்டுள்ளது.
