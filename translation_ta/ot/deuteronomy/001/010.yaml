source:
  edition: WLC
  text: יְהוָ֥ה אֱלֹהֵי/כֶ֖ם הִרְבָּ֣ה אֶתְ/כֶ֑ם וְ/הִנְּ/כֶ֣ם הַ/יּ֔וֹם כְּ/כוֹכְבֵ֥י הַ/שָּׁמַ֖יִם לָ/רֹֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/010.yaml
  text: Yahweh your God has multiplied you[a], and behold, today you are as numerous as the stars of the heavens.
translation:
  language: ta
  text: உங்கள் கடவுளாகிய யாவே உங்களைப் பெருகச் செய்திருக்கிறார்; இதோ, இன்று நீங்கள் எண்ணிக்கையில் வானத்தின் நட்சத்திரங்களைப்போல் இருக்கிறீர்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லுக்கு நெருக்கமாக, “மிகுதியில் வானத்தின் நட்சத்திரங்களைப்போல் இருக்கிறீர்கள்.”
    reason: לָרֹב என்பதன் எபிரேயச் சொற்றொடரை இன்னும் சொல்லுக்குச் சொல்லாக வழங்கும் மாற்று வாசகம்.
lexical_decisions:
- source_word: יְהוָה
  choice: யாவே
  rationale: இஸ்ரவேலின் கடவுளுடைய தனிப்பட்ட உடன்படிக்கைப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், எபிரேய நான்கெழுத்துப் பெயரின் பொதுவான ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: אֱלֹהֵיכֶם
  choice: உங்கள் கடவுளாகிய
  rationale: உடன்படிக்கைச் சூழலில் אֱלֹהִים ஒருமைப் பொருளான ‘கடவுள்’ என்பதைக் குறிக்கிறது; இரண்டாம் நபர் பன்மை உடைமை விகுதி ‘உங்கள்’ எனக் காட்டப்படுகிறது. ‘யாவே’யுடன் இயல்பாக இணைய ‘கடவுளாகிய’ பயன்படுத்தப்பட்டது.
- source_word: הִרְבָּה אֶתְכֶם
  choice: உங்களைப் பெருகச் செய்திருக்கிறார்
  rationale: רבה என்பதன் ஹிஃபில் வடிவிலுள்ள காரணவினைப் பொருளான ‘எண்ணிக்கையில் அதிகமாக்குதல்’ என்பதைக் காக்கிறது; நிறைவேறிய செயலும் அதன் தற்போதைய விளைவும் தமிழ் வினை வடிவில் வெளிப்படுகின்றன.
- source_word: וְהִנְכֶם
  choice: இதோ
  rationale: மக்களின் தற்போதைய நிலைக்குக் கவனத்தை ஈர்க்கும் எபிரேயச் சுட்டுக் கூறின் சொல்லாட்சிச் சிறப்பை இயல்பான தமிழில் காக்கிறது.
- source_word: הַיּוֹם
  choice: இன்று
  rationale: பேசப்படும் நாளின் உடனடித்தன்மையை நேரடியாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: כְּכוֹכְבֵי הַשָּׁמַיִם
  choice: வானத்தின் நட்சத்திரங்களைப்போல்
  rationale: כְּ என்னும் ஒப்புமை உருபையும் ‘வானத்தின் நட்சத்திரங்கள்’ என்ற எபிரேயத் தொகைநிலையையும் தெளிவாகப் பிரதிபலிக்கிறது.
- source_word: לָרֹב
  choice: எண்ணிக்கையில்
  rationale: ‘மிகுதியாக/பெருந்தொகையில்’ என்ற அளவுப் பொருளை ஒப்புமையுடன் இயல்பாக இணைத்து, இங்கு உடல் தோற்றமல்ல மக்கள் தொகையே ஒப்பிடப்படுகிறது என்பதைத் தெளிவாக்குகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: ஆண்டவர்; யெகோவா
  rationale: மூல உரை ஒரு பொதுப் பட்டத்தை அல்ல, இறைவனின் தனிப்பட்ட உடன்படிக்கைப் பெயரையே பயன்படுத்துகிறது. ஆகவே அதைப் பட்டமாக மாற்றாமல் ‘யாவே’ என்று ஒலிபெயர்க்கப்பட்டது.
- issue: நட்சத்திர ஒப்புமையின் நோக்கம்
  choice: மக்களின் எண்ணிக்கையைக் குறிக்கும் ஒப்புமை
  alternative: பொதுவான ஒற்றுமை அல்லது தோற்ற ஒப்புமை
  rationale: לָרֹב என்பது மிகுதி அல்லது பெருந்தொகையைக் குறிக்கிறது; ஆகவே ஒப்புமை மக்களின் எண்ணிக்கையைப் பற்றியது என உரையில் காட்டப்பட்டது, ஆனால் கணக்கிட இயலாமை போன்ற கூடுதல் கருத்து சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘இதோ’ என்ற கவன ஈர்ப்புச் சொல் மூலத்தின் சொல்லாட்சிச் சக்திக்காகத் தக்கவைக்கப்பட்டுள்ளது; ‘எண்ணிக்கையில்’ என்பது லָרֹב-இன் அளவுப் பொருளை இயல்பாக வெளிப்படுத்துகிறது.
