  source_fidelity: 'மூல எபிரேயத்தின் கூறுகள் அனைத்தும் துல்லியமாகப் பிரதிபலிக்கப்படுகின்றன: יְהוָה ‘யாவே’ எனவும், אֱלֹהֵיכֶם ஒருமைப் பொருளில் ‘உங்கள் கடவுளாகிய’ எனவும், ஹிஃபில் הִרְבָּה ‘உங்களைப் பெருகச் செய்திருக்கிறார்’ எனவும், וְהִנְכֶם-இன் கவன ஈர்ப்பு ‘இதோ’ எனவும், הַיּוֹם ‘இன்று’ எனவும், நட்சத்திர ஒப்புமையும் לָרֹב-இன் எண்ணிக்கை/மிகுதி கருத்தும் வழங்கப்பட்டுள்ளன. பொருள் கூட்டப்படவோ குறைக்கப்படவோ இல்லை.'
