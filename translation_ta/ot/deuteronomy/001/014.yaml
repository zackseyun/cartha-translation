  source_fidelity: வַתַּעֲנוּ … וַתֹּאמְרוּ என்ற இரட்டை மறுமொழி அமைப்பு ‘பதிலளித்து … என்றீர்கள்’ எனத் தக்கவாறு வெளிப்படுத்தப்பட்டுள்ளது. אֹתִי-க்கு ‘எனக்குப்’ என்பது தமிழ் ‘பதிலளி’ வினையின் இயல்பான வேற்றுமைத் தேர்வு. הַדָּבָר, אֲשֶׁר דִּבַּרְתָּ, மற்றும் לַעֲשׂוֹת ஆகியவை முறையே ‘நீர் சொன்ன காரியம்’, ‘நாங்கள் செய்வது’ எனச் சூழலுக்கு உண்மையாக மொழிபெயர்க்கப்பட்டுள்ளன. ‘நாங்கள்’ என்பது மூலத்தில் வெளிப்படையாக இல்லாவிட்டாலும், பேசுவோர் தாங்களே செயல்படுத்துவதாக உள்ள சூழல்-உட்குறிப்பை இயல்பான தமிழில் தெளிவாக்குகிறது.
  naturalness: வாக்கியம் நவீனத் தரத் தமிழில் தெளிவாகவும் கண்ணியமான வேதாகம நடையுடனும் உள்ளது. விவரிப்பில் ‘நீங்கள்’, மோசேயை நோக்கிய நேரடி உரையில் மரியாதை ஒருமையான ‘நீர்’ என்பதும் சூழலுக்கு ஏற்றது. மேற்கோளும் அடிக்குறி இடமும் இயல்பாக அமைந்துள்ளன.
  terminology: ‘காரியம்’ என்பது דבר என்பதன் பரந்த ‘matter/thing’ பொருளைத் தேவையற்ற குறிப்பாக்கமின்றி பேணுகிறது. ‘நல்லது’ טוֹב-க்கு நேரடியானது. அடிக்குறிப்பிலுள்ள ‘திட்டம்’ மற்றும் ‘நிறைவேற்றுவது’ ஆகியவை செல்லத்தக்க சூழலியல் மாற்றுகளாகத் தரப்பட்டுள்ளன; முதன்மை உரையின் பொருளை மாற்றவில்லை.
