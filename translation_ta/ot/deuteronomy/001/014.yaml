translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்கு எளிதாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. மக்களைக் குறிக்கப் பன்மை ‘நீங்கள்’ என்பதும், அவர்கள் மோசேயை நோக்கிப் பேசும் இடத்தில் மரியாதை ஒருமை ‘நீர்’ என்பதும் பயன்படுத்தப்பட்டுள்ளன. எபிரெயத்தில் உள்ள பதிலளித்தல் மற்றும் கூறுதல் ஆகிய இரு வினைகளும் பேணப்பட்டுள்ளன.
