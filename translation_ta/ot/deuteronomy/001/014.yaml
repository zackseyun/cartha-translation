source:
  edition: WLC
  text: וַֽ/תַּעֲנ֖וּ אֹתִ֑/י וַ/תֹּ֣אמְר֔וּ טֽוֹב הַ/דָּבָ֥ר אֲשֶׁר דִּבַּ֖רְתָּ לַ/עֲשֽׂוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/014.yaml
  text: And you answered me and said[a], ‘The thing that you have spoken is good for us to do.’
translation:
  language: ta
  text: நீங்கள் எனக்குப் பதிலளித்து, “நீர் சொன்ன காரியத்தை நாங்கள் செய்வது நல்லது”[a] என்றீர்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நீர் முன்வைத்த திட்டத்தை நிறைவேற்றுவது நல்லது.”
    reason: דבר என்பது இச்சூழலில் மோசே முன்வைத்த ‘திட்டம்’ அல்லது ‘யோசனை’ என்பதையும், לעשות என்பது அதை ‘நிறைவேற்றுதல்’ என்பதையும் குறிக்கலாம்.
lexical_decisions:
- source_word: וַתַּעֲנוּ
  choice: பதிலளித்து
  rationale: ענה என்பது இவ்வுரையாடல் சூழலில் ‘பதிலளித்தல்’ என்று பொருள்படும்; மக்களின் நேரடியான மறுமொழியை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: אֹתִי
  choice: எனக்கு
  rationale: முதலாம் நபர் ஒருமை பின்னொட்டுடன் வரும் குறியீட்டை, ‘பதிலளி’ என்ற தமிழ் வினைக்கேற்ற வேற்றுமையில் ‘எனக்கு’ என்று வழங்குகிறது.
- source_word: וַתֹּאמְרוּ
  choice: என்றீர்கள்
  rationale: மக்கள் கூறிய மறுமொழியின் உள்ளடக்கத்தை அறிமுகப்படுத்தும் אמר என்பதைத் தனியே மொழிபெயர்த்து, எபிரெய உரையிலுள்ள ‘பதிலளித்து … கூறினீர்கள்’ என்ற இரட்டை வினை அமைப்பைப் பேணுகிறது.
- source_word: טוֹב
  choice: நல்லது
  rationale: மோசே கூறிய காரியத்தை மக்கள் சாதகமாக மதிப்பிடுவதை, கூடுதல் விளக்கம் சேர்க்காமல் நேரடியாகக் காட்டுகிறது.
- source_word: הַדָּבָר
  choice: காரியம்
  rationale: דבר இங்கு மோசே முன்பு கூறிய ஏற்பாட்டைக் குறிக்கிறது. ‘காரியம்’ என்பது ‘வார்த்தை’ என்பதைக் காட்டிலும் இச்சூழலுக்கு இயல்பாகவும், ‘திட்டம்’ என்பதைக் காட்டிலும் மூலத்தின் பொருள் விரிவைப் பேணுவதாகவும் உள்ளது.
- source_word: אֲשֶׁר דִּבַּרְתָּ
  choice: நீர் சொன்ன
  rationale: மோசே முன்பு கூறியதைச் சுட்டும் தொடர்புத் தொடரைச் சுருக்கமான, இயல்பான தமிழில் வழங்குகிறது; ஒருமை முகவரியை ‘நீர்’ பேணுகிறது.
- source_word: לַעֲשׂוֹת
  choice: நாங்கள் செய்வது
  rationale: עשה என்பதன் அடிப்படைப் பொருளை ‘செய்’ என்று நேரடியாக வழங்குகிறது. செய்பவர்கள் மக்களே என்பது சூழலில் தெளிவாக இருப்பதால் ‘நாங்கள்’ சேர்க்கப்பட்டு தமிழ் வாக்கியம் இயல்பாக்கப்பட்டுள்ளது.
