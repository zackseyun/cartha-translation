source:
  edition: WLC
  text: לֹ֖א תֹּאכְלֶ֑/נּוּ לְמַ֨עַן יִיטַ֤ב לְ/ךָ֙ וּ/לְ/בָנֶ֣י/ךָ אַחֲרֶ֔י/ךָ כִּֽי תַעֲשֶׂ֥ה הַ/יָּשָׁ֖ר בְּ/עֵינֵ֥י יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/025.yaml
  text: You shall not eat it[a], so that it may go well with you and with your children after you, because you will do what is right in the eyes of Yahweh.
translation:
  language: ta
  text: உனக்கும் உனக்குப் பின் வரும் உன் பிள்ளைகளுக்கும்[a] நன்மை உண்டாகும்படியாக, அதை உண்ணாதே; ஏனெனில் யாவேயின் பார்வையில் சரியானதை நீ செய்வாய்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘உனக்குப் பின் வரும் உன் மகன்கள்’; விரிவாக, ‘உனக்குப் பின் வரும் உன் சந்ததியினர்.’
    reason: בָנֶיךָ என்பது சூழலின்படி மகன்கள், பிள்ளைகள், அல்லது சந்ததியினர் எனக் குறிக்கலாம்.
lexical_decisions:
- source_word: תֹּאכְלֶנּוּ
  choice: அதைச் சாப்பிடாதே
  rationale: אָכַל என்பது ‘சாப்பிடு/உட்கொள்’ என்று பொருள்படும்; ஒருமை ஆண்பால் பின்னொட்டு உடனடியான சூழலில் குறிப்பிடப்படும் இரத்தத்தைக் குறிக்கிறது. தமிழில் நேரடியும் இயல்புமான தடையாக இவ்வாறு வழங்கப்படுகிறது.
- source_word: לְמַעַן
  choice: அப்போது
  rationale: இச்சொல் நோக்கம் அல்லது விளைவை அறிமுகப்படுத்துகிறது. இங்கு தடைக்குக் கீழ்ப்படிவதன் விளைவை இயல்பான தமிழில் இணைக்கிறது; நோக்கம்–விளைவு உறவை அளவுக்கு மீறித் தீர்மானிப்பதில்லை.
- source_word: יִיטַב לְךָ
  choice: உனக்கு நன்மை உண்டாகும்
  rationale: இது உபாகமத்தில் காணப்படும் உடன்படிக்கை சார்ந்த நலவாழ்வு மொழிநடை. ‘செழிப்பாய்’ என்பது பொருளாதார வளமாகக் குறுக்கிவிடக்கூடும்; ‘நன்மை உண்டாகும்’ விரிந்த பொருளைப் பாதுகாக்கிறது.
- source_word: וּלְבָנֶיךָ אַחֲרֶיךָ
  choice: உனக்குப் பின் வரும் உன் பிள்ளைகளுக்கும்
  rationale: בנים என்பது நேரடியாக ‘மகன்கள்’ என்றும், சூழலின்படி ‘பிள்ளைகள்/சந்ததியினர்’ என்றும் பொருள்படலாம். உடன்படிக்கை விளைவு அடுத்த தலைமுறைக்கும் நீள்வதால் ‘பிள்ளைகள்’ குடும்ப உறவை இயல்பாகப் பாதுகாக்கிறது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: வாக்குறுதியான நன்மைக்கான அடிப்படையாகக் கீழ்ப்படிதலை இங்கு முன்வைக்கிறது; காரணத் தொடர்பைத் தெளிவாகக் காட்டுகிறது.
- source_word: תַעֲשֶׂה
  choice: நீ செய்வாய்
  rationale: முற்றுப்பெறாத வினை வடிவம் எதிர்நோக்கப்படும் அல்லது நிபந்தனை சார்ந்த கீழ்ப்படிதலைக் குறிக்க முடியும். ‘செய்வாய்’ மூலத்தின் எதிர்நோக்கும் தன்மையைத் தக்கவைக்கிறது.
- source_word: הַיָּשָׁר
  choice: சரியானதை
  rationale: יָשָׁר என்பது நேரானது, நீதியானது, சரியானது ஆகிய பொருட்களைக் கொண்டது. ‘சரியானதை’ என்பது தெளிவான நவீனத் தமிழ்.
- source_word: בְּעֵינֵי יְהוָה
  choice: யெகோவாவின் பார்வையில்
  rationale: ‘கண்களில்’ என்ற எபிரெய உருவகத்தின் பொருள் தெய்வீக மதிப்பீடு. ‘பார்வையில்’ தமிழில் இயல்பாகவும் உருவகத்தின் கருத்துக்கு நெருக்கமாகவும் உள்ளது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: நான்கெழுத்துத் தெய்வீகப் பெயரை ஒரு பட்டமாக மாற்றாமல், தமிழில் பரவலாக அறியப்படும் தனிப்பெயர் வடிவில் வழங்குகிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரின் மொழிபெயர்ப்பு
  choice: யெகோவா
  alternative: யாவே
  rationale: மூலத்தில் தனிப்பெயர் நேரடியாக உள்ளது. ‘கர்த்தர்’ போன்ற பட்டத்தைப் பதிலிடாமல் பெயராகவே வழங்கப்படுகிறது; தமிழில் நிலைபெற்ற வடிவமாக ‘யெகோவா’ தேர்ந்தெடுக்கப்பட்டது.
- issue: בָנֶיךָ என்பதன் பொருள் வரம்பு
  choice: பிள்ளைகள்
  alternative: மகன்கள்; சந்ததியினர்
  rationale: இலக்கண வடிவம் ஆண்பால் பன்மையாக இருந்தாலும், இவ்வுடன்படிக்கைச் சூழலில் ஒருவரின் பின்வரும் தலைமுறையைப் பிரதிநிதித்துவமாகக் குறிக்கலாம். ‘பிள்ளைகள்’ குடும்ப மொழியைப் பாதுகாத்து, ஆண்களுக்கு மட்டும் தேவையின்றிக் கட்டுப்படுத்துவதைத் தவிர்க்கிறது.
- issue: லְמַעַן காட்டும் நோக்கம் அல்லது விளைவு
  choice: அப்போது
  alternative: அதனால்; அப்படிச் செய்தால்
  rationale: இந்த இணைப்பு கீழ்ப்படிதலுக்கும் நன்மைக்கும் இடையிலான நோக்கம்/விளைவு உறவை இரண்டில் ஒன்றாகக் கடுமையாகச் சுருக்காமல் இயல்பாக வெளிப்படுத்துகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், நேரடியான ஒருமை முன்னிலைச் சொல்லாடலுடன், கண்ணியமும் எளிமையும் பேணப்பட்டுள்ளது. மூலத்தில் இல்லாத விளக்கங்கள் சேர்க்கப்படவில்லை; ‘பிள்ளைகள்’ என்ற சொல் பாலினத்தைக் குறுக்காமல் குடும்பத் தொடர்ச்சியைத் தெரிவிக்கிறது.
