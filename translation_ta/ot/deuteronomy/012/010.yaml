reference: Deuteronomy 12:10
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/עֲבַרְתֶּם֮ אֶת הַ/יַּרְדֵּן֒ וִֽ/ישַׁבְתֶּ֣ם בָּ/אָ֔רֶץ אֲשֶׁר יְהוָ֥ה אֱלֹהֵי/כֶ֖ם מַנְחִ֣יל אֶתְ/כֶ֑ם וְ/הֵנִ֨יחַ לָ/כֶ֧ם מִ/כָּל אֹיְבֵי/כֶ֛ם מִ/סָּבִ֖יב וִֽ/ישַׁבְתֶּם בֶּֽטַח־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/010.yaml
  text: But when you cross the Jordan and live in the land that Yahweh your God is giving you to inherit[a], and he gives you rest from all your enemies around you, then you will live in safety.
translation:
  language: ta
  text: நீங்கள் யோர்தானைக் கடந்து, உங்கள் கடவுளாகிய யாவே உங்களுக்கு உரிமையாகக் கொடுக்கும் நாட்டில் குடியிருப்பீர்கள்; அவர் சுற்றிலும் உள்ள உங்கள் எதிரிகள் அனைவரிடமிருந்தும் உங்களுக்கு ஓய்வு அளிப்பார். அப்போது நீங்கள் பாதுகாப்பாகக் குடியிருப்பீர்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַעֲבַרְתֶּם אֶת־הַיַּרְדֵּן
  choice: நீங்கள் யோர்தானைக் கடந்து
  rationale: எதிர்கால நிகழ்வுகளின் காலச்சூழலைத் தமிழில் இயல்பாகக் காட்டுகிறது; יַרְדֵּן என்ற இடப்பெயரை ‘யோர்தான்’ என ஒலிபெயர்க்கிறது.
- source_word: וִישַׁבְתֶּם בָּאָרֶץ
  choice: நாட்டில் குடியிருக்கும்போது
  rationale: ישׁב இங்கு தற்காலிகமாகத் தங்குவதைவிட நிலையான குடியிருப்பைக் குறிக்கிறது; ארץ என்பது சூழலில் வாக்குறுதியளிக்கப்பட்ட நிலப்பகுதி என்பதால் ‘நாடு’ பொருத்தமானது.
- source_word: יְהוָה אֱלֹהֵיכֶם
  choice: உங்கள் கடவுளாகிய யாவே
  rationale: இறைநாமமான יהוה-வை பட்டப்பெயராக மாற்றாமல் ‘யாவே’ எனவும், אֱלֹהֵיכֶם-ஐ இயல்பான தமிழில் ‘உங்கள் கடவுள்’ எனவும் வழங்குகிறது.
- source_word: מַנְחִיל אֶתְכֶם
  choice: உங்களுக்கு உரிமைச் சொத்தாக அளிக்கும்
  rationale: נחל என்பதன் ஹிஃபில் வடிவிலுள்ள ‘உரிமையாகப் பெறச் செய்தல்’ என்ற இறைச் செயற்பாட்டையும் பரம்பரை உரிமை சார்ந்த நுணுக்கத்தையும் இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: וְהֵנִיחַ לָכֶם
  choice: அவர் உங்களுக்கு இளைப்பாறுதல் அளிப்பார்
  rationale: נוח என்பதன் ஹிஃபில் வடிவம் இங்கு எதிரிகளின் தொல்லையிலிருந்து ஓய்வும் நிம்மதியும் அளிப்பதைக் குறிக்கிறது; ‘இளைப்பாறுதல்’ அந்த மையக் கருத்தைத் தக்கவைக்கிறது.
- source_word: מִכָּל־אֹיְבֵיכֶם מִסָּבִיב
  choice: சுற்றிலும் உள்ள உங்கள் எதிரிகள் அனைவரிடமிருந்தும்
  rationale: מִסָּבִיב என்பதன் இடவியல் பொருளையும் כָּל என்பதன் முழுமையையும் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: וִישַׁבְתֶּם בֶּטַח
  choice: நீங்கள் பாதுகாப்பாகக் குடியிருப்பீர்கள்
  rationale: בטח குறிக்கும் அச்சமற்ற பாதுகாப்பையும் ישׁב குறிக்கும் நிலையான வாழ்வையும் நேரடியாகப் பதிவு செய்கிறது.
theological_decisions:
- issue: יהוה என்ற இறைநாமத்தின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: ஆண்டவர் / யெகோவா
  rationale: மூலத்தில் தனிப்பட்ட உடன்படிக்கைப் பெயர் நேரடியாக உள்ளது; அதை பொதுப் பட்டப்பெயராக மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
- issue: מַנְחִיל என்பதில் இறைச் செயற்பாடும் உரிமைப் பெறுதலும்
  choice: உங்களுக்கு உரிமைச் சொத்தாக அளிக்கும்
  alternative: உங்களை உரிமையாகப் பெறச் செய்யும்
  rationale: நிலமே அளிக்கப்படும் உரிமைச் சொத்து என்பதைத் தமிழில் தெளிவாக்குவதோடு, கடவுளே அதை அளிப்பவர் என்ற மூலத்தின் கருத்தைத் தக்கவைக்கிறது.
- issue: ‘இளைப்பாறுதல்’ மற்றும் ‘பாதுகாப்பு’ ஆகியவற்றின் தொடர்பு
  choice: இரண்டையும் தனித்த கருத்துகளாக மொழிபெயர்த்தல்
  alternative: இரண்டையும் ‘அமைதி’ என்ற ஒரே சொல்லில் இணைத்தல்
  rationale: וְהֵנִיחַ மற்றும் בֶּטַח ஆகியவை தொடர்புடையவையாக இருந்தாலும் வேறுபட்ட சொற்கள்; ஒன்று எதிரிகளிடமிருந்து கிடைக்கும் ஓய்வையும் மற்றொன்று பாதுகாப்பான குடியிருப்பையும் குறிக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் dignified நடை பயன்படுத்தப்பட்டுள்ளது. ‘குடியிரு’, ‘உரிமைச் சொத்து’, ‘இளைப்பாறுதல்’ ஆகிய சொற்கள் முறையே நிலையான வாழ்வு, சுதந்தர உரிமை, எதிரிகளிடமிருந்து கிடைக்கும் ஓய்வு என்ற மூல நுணுக்கங்களைத் தக்கவைக்கின்றன. ஆங்கில ஆலோசனை உரையிலுள்ள [a] குறிப்பு அதன் இடத்துக்கும் குறிப்புரைக்கும் இடையே பொருத்தமின்மை உள்ளதால், மூல எபிரெய உரையில் தனிப்பட்ட உரைவேறுபாடு இல்லாத இவ்வசனத்தில் அது சேர்க்கப்படவில்லை.
