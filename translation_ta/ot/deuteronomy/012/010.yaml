revisions:
- from: நீங்கள் யோர்தானைக் கடந்து, உங்கள் கடவுளாகிய யாவே உங்களுக்கு உரிமைச் சொத்தாக அளிக்கும் நாட்டில் குடியிருக்கும்போது, சுற்றிலும் உள்ள உங்கள் எதிரிகள் அனைவரிடமிருந்தும் அவர் உங்களுக்கு இளைப்பாறுதல் அளிப்பார்; அப்போது நீங்கள் பாதுகாப்பாகக் குடியிருப்பீர்கள்.
