source:
  edition: WLC
  text: לֹא תַעֲשֶׂ֣ה כֵ֔ן לַ/יהוָ֖ה אֱלֹהֶ֑י/ךָ כִּי֩ כָּל תּוֹעֲבַ֨ת יְהוָ֜ה אֲשֶׁ֣ר שָׂנֵ֗א עָשׂוּ֙ לֵ/אלֹ֣הֵי/הֶ֔ם כִּ֣י גַ֤ם אֶת בְּנֵי/הֶם֙ וְ/אֶת בְּנֹ֣תֵי/הֶ֔ם יִשְׂרְפ֥וּ בָ/אֵ֖שׁ לֵֽ/אלֹהֵי/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/031.yaml
  text: You shall not do so to Yahweh your God[a], for they have done for their gods every abomination of Yahweh that he hates, for they even burn their sons and their daughters in the fire for their gods.
translation:
  language: ta
  text: உன் கடவுளாகிய யாவேக்கு நீ அப்படிச் செய்யக் கூடாது. ஏனெனில், யாவேக்கு அருவருப்பான, அவர் வெறுக்கும் எல்லா செயல்களையும்[a] அவர்கள் தங்கள் தெய்வங்களுக்காகச் செய்தார்கள். ஏனெனில், அவர்கள் தங்கள் மகன்களையும் மகள்களையும்கூடத் தங்கள் தெய்வங்களுக்காக நெருப்பில் எரிக்கிறார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: நேரடியாக, “யாவேயின் ஒவ்வோர் அருவருப்பையும்”; இந்த இணைப்பு “யாவேக்கு அருவருப்பான எல்லாவற்றையும்” என்றும் பொருள்படலாம்.
    reason: תּוֹעֲבַת יְהוָה என்ற எபிரெய இணைப்பில் உடைமை மற்றும் தொடர்பு ஆகிய இரு வாசிப்புகளும் இலக்கண ரீதியில் சாத்தியமானவை.
lexical_decisions:
- source_word: לֹא תַעֲשֶׂה כֵן
  choice: நீ அப்படிச் செய்யக் கூடாது
  rationale: முன்னைய வசனத்தில் கூறப்பட்ட பிற இனத்தாரின் வழிபாட்டு முறைகளைப் பின்னோக்கிச் சுட்டும் நேரடியான ஒருமைத் தடை.
- source_word: לַיהוָה אֱלֹהֶיךָ
  choice: உன் கடவுளாகிய யாவேக்கு
  rationale: ל குறிக்கும் தொடர்பு அல்லது வழிபாட்டு நோக்கை இயல்பான தமிழில் வெளிப்படுத்தி, உடன்படிக்கையின் இறைப்பெயரான יהוה என்பதை ‘யாவே’ என்று ஒலிபெயர்க்கிறது.
- source_word: כָּל תּוֹעֲבַת יְהוָה אֲשֶׁר שָׂנֵא
  choice: யாவேக்கு அருவருப்பானதும் அவர் வெறுப்பதுமான எல்லாவற்றையும்
  rationale: תּוֹעֵבָה மற்றும் שָׂנֵא ஆகிய இரண்டின் கடுமையான ஒழுக்க-வழிபாட்டு மதிப்பீட்டையும் தக்கவைத்து, எபிரெயக் கட்டமைப்பின் தொடர்புப் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: עָשׂוּ לֵאלֹהֵיהֶם
  choice: அவர்கள் தங்கள் தெய்வங்களுக்குச் செய்தார்கள்
  rationale: பிற இனத்தார் தங்கள் தெய்வங்களை நோக்கி வழிபாட்டுச் செயல்களாக இவற்றைச் செய்தனர் என்ற பொருளைத் தக்கவைக்கிறது.
- source_word: כִּי גַם
  choice: …கூட
  rationale: அடுத்து வரும் அதிர்ச்சியூட்டும் உச்சமான எடுத்துக்காட்டை வலியுறுத்தும் גַם என்பதன் ஆற்றலைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: אֶת־בְּנֵיהֶם וְאֶת־בְּנֹתֵיהֶם
  choice: தங்கள் மகன்களையும் மகள்களையும்
  rationale: ஆண், பெண் பிள்ளைகள் இருவரையும் மூல உரை தனித்தனியாகக் குறிப்பிடுவதைப் பொதுப்படுத்தாமல் காக்கிறது.
- source_word: יִשְׂרְפוּ בָאֵשׁ לֵאלֹהֵיהֶם
  choice: தங்கள் தெய்வங்களுக்காக நெருப்பில் எரித்தார்கள்
  rationale: உண்மையான நெருப்பில் எரித்த கொடூரச் செயலைத் தெளிவாகக் கூறி, לֵאלֹהֵיהֶם என்பதன் அர்ப்பணிப்பு அல்லது வழிபாட்டு நோக்கை ‘தெய்வங்களுக்காக’ என வெளிப்படுத்துகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூல உரையிலுள்ள உடன்படிக்கையின் தனிப்பெயரைப் பட்டப்பெயராக மாற்றாமல், தமிழில் பரவலாக அறியக்கூடிய ஒலிபெயர்ப்பால் தருகிறது.
- issue: תּוֹעֵבָה மற்றும் שָׂנֵא ஆகியவற்றின் கடுமை
  choice: அருவருப்பானதும் அவர் வெறுப்பதுமான
  alternative: ஏற்காத / விரும்பாத
  rationale: இறை மதிப்பீட்டின் வலிமையை மென்மைப்படுத்தாமல் தக்கவைக்கிறது; அதேவேளை மூல உரைக்கு அப்பாற்பட்ட கோட்பாட்டைச் சேர்ப்பதில்லை.
- issue: תּוֹעֲבַת יְהוָה என்ற இணைப்பின் பொருள்
  choice: யாவேக்கு அருவருப்பான
  alternative: யாவேயின் அருவருப்பு
  rationale: எபிரெயக் construct வடிவம் உடைமையையோ தொடர்பையையோ வெளிப்படுத்தலாம். இச்சூழலில் ‘யாவேக்கு அருவருப்பான’ என்பது இயல்பான தொடர்புப் பொருளைத் தருகிறது; மேலும் அடுத்து வரும் ‘அவர் வெறுப்பதுமான’ என்ற வாக்கியத்தையும் தனியே காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், ஒருமை உடன்படிக்கை அழைப்பை ‘உன்/நீ’ எனக் காத்து, வழிபாட்டுச் சூழலுக்கேற்ற கண்ணியமான ஆனால் நேரடியான நடையைப் பயன்படுத்துகிறது. குழந்தைகளை எரித்த செயலை மூல உரையைப் போலவே மறைக்காமல் கூறுகிறது.
