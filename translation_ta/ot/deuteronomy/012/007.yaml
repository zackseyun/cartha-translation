base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/007.yaml
  text: And there you shall eat before Yahweh your God[a], and you shall rejoice in all the work of your hand, you and your households, with which Yahweh your God has blessed you.
translation:
  language: ta
  text: அங்கே உங்கள் கடவுளாகிய யாவேவின் முன்னிலையில் நீங்கள் உண்பீர்கள். உங்கள் கடவுளாகிய யாவே உன்னை ஆசீர்வதித்த உங்கள் கையால் மேற்கொள்ளும் எல்லா முயற்சிகளிலும்[a] நீங்களும் உங்கள் வீட்டாரும் மகிழ்வீர்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நீங்கள் மேற்கொள்ளும் எல்லாவற்றிலும்.” எபிரெய மரபுத்தொடரின் சொல்லுக்குச் சொல் பொருள், “உங்கள் கையை நீட்டுதல் அனைத்திலும்” என்பதாகும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲכַלְתֶּם
  choice: நீங்கள் உண்பீர்கள்
  rationale: சட்ட அறிவுறுத்தலின் சூழலில் எதிர்காலத்தையும் கடமையையும் உணர்த்தும் வாவ் இணைந்த வினைவடிவத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: שָׁם
  choice: அங்கே
  rationale: முந்தைய சூழலில் யாவே தேர்ந்தெடுக்கவிருக்கும் இடத்தைக் குறிக்கும் சுட்டுத்தன்மையை விரிவாக்கமின்றித் தக்கவைக்கிறது.
- source_word: לִפְנֵי יְהוָה אֱלֹהֵיכֶם
  choice: உங்கள் கடவுளாகிய யாவேவின் முன்னிலையில்
  rationale: லִפְנֵי என்பதன் பிரசன்னத்தைக் குறிக்கும் பொருளையும், தெய்வீகப் பெயரையும் இயல்பான நவீன தமிழில் தருகிறது.
- source_word: וּשְׂמַחְתֶּם
  choice: மகிழ்வீர்கள்
  rationale: உண்பீர்கள் என்பதற்கு இணையான அறிவுறுத்தல்/எதிர்கால வலிமையைப் பேணுகிறது.
- source_word: מִשְׁלַח יֶדְכֶם
  choice: உங்கள் கையின் எல்லா முயற்சிகளிலும்
  rationale: எபிரெயச் சொற்றொடரின் கை என்ற உருவகத்தைத் தக்கவைத்தபடி, ஒருவர் மேற்கொள்ளும் செயல்கள் அல்லது முயற்சிகள் என்ற மரபுத்தொடர்ப் பொருளைத் தெளிவாக்குகிறது.
- source_word: אַתֶּם וּבָתֵּיכֶם
  choice: நீங்களும் உங்கள் வீட்டாரும்
  rationale: கட்டிடங்களையல்ல, குடும்பம் மற்றும் வீட்டைச் சேர்ந்தோரைக் குறிக்கும் கூட்டுப் பொருளை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: אֲשֶׁר בֵּרַכְךָ יְהוָה אֱלֹהֶיךָ
  choice: உங்கள் கடவுளாகிய யாவே உன்னை ஆசீர்வதித்துள்ள
  rationale: தொடர்புச் சொற்றொடரை முயற்சிகளோடு இணைத்தும், இறுதியில் வரும் எபிரெய ஒருமை முன்னிலையை ‘உன்னை’ என்று தக்கவைத்தும் மொழிபெயர்க்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: ஆண்டவர்; யெகோவா
  rationale: மூலத்தில் உள்ள உடன்படிக்கைப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், அதன் பரவலாக ஏற்றுக்கொள்ளப்பட்ட தமிழ் ஒலிபெயர்ப்பைப் பயன்படுத்துகிறது.
- issue: பன்மையிலிருந்து ஒருமைக்கு மாறும் முன்னிலை
  choice: முதலில் ‘நீங்கள்/உங்கள்’; இறுதியில் ‘உன்னை’
  alternative: எல்லா இடங்களிலும் பன்மையைப் பயன்படுத்துதல்
  rationale: உபாகமத்தில் இஸ்ரவேலைப் பன்மையாகவும் ஒரே கூட்டுத் தனிநபராகவும் அழைக்கும் மூல மொழியின் சொல்லாட்சித் திருப்பத்தைத் தட்டையாக்காமல் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘வீட்டார்’ என்பது குடும்ப அலகை இயல்பாகக் குறிக்கிறது. மூலத்தின் பன்மை–ஒருமை மாற்றம் திட்டமிட்டே வெளிப்படையாக வைக்கப்பட்டுள்ளது.
