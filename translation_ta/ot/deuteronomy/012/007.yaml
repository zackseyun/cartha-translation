revisions:
- from: அங்கே உங்கள் கடவுளாகிய யாவேவின் முன்னிலையில் நீங்கள் உண்பீர்கள். உங்கள் கடவுளாகிய யாவே உன்னை ஆசீர்வதித்துள்ள, உங்கள் கையின் எல்லா முயற்சிகளிலும்[a] நீங்களும் உங்கள் வீட்டாரும் மகிழ்வீர்கள்.
  to: அங்கே உங்கள் கடவுளாகிய யாவேவின் முன்னிலையில் நீங்கள் உண்பீர்கள். உங்கள் கடவுளாகிய யாவே உன்னை ஆசீர்வதித்த உங்கள் கையால் மேற்கொள்ளும் எல்லா முயற்சிகளிலும்[a] நீங்களும் உங்கள் வீட்டாரும் மகிழ்வீர்கள்.
  rationale: The revision places the final Hebrew relative clause immediately before the undertakings it modifies, resolving the Tamil syntactic ambiguity. It also uses an idiomatic Tamil expression for the Hebrew hand idiom. The overt shift from plural ‘நீங்கள்/உங்கள்’ to singular ‘உன்னை’ is retained to reflect the Hebrew's corporate-singular address without adding interpretation.
  reviewer_model: gpt-5.6-terra
