  text: כִּ֣י אִם בַּ/מָּק֞וֹם אֲשֶׁר יִבְחַ֤ר יְהוָה֙ בְּ/אַחַ֣ד שְׁבָטֶ֔י/ךָ שָׁ֖ם תַּעֲלֶ֣ה עֹלֹתֶ֑י/ךָ וְ/שָׁ֣ם תַּעֲשֶׂ֔ה כֹּ֛ל אֲשֶׁ֥ר אָנֹכִ֖י מְצַוֶּֽ/ךָּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/014.yaml
  text: but only at the place that Yahweh will choose in one of your tribes—there you shall offer up your burnt offerings[b][a], and there you shall do all that I am commanding you.
translation:
  language: ta
  text: ஆனால், யாவே உன் கோத்திரங்களில் ஒன்றில்[b] தேர்ந்தெடுக்கும் இடத்தில், அங்கே மட்டுமே உன் தகனபலிகளைச் செலுத்த வேண்டும்; அங்கே நான் உனக்குக் கட்டளையிடுகிற அனைத்தையும் செய்ய வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: எபிரெயத்தில், “உன் கோத்திரங்களில் ஒன்றில்”; அதாவது, இஸ்ரவேலின் ஒரு கோத்திரத்துக்குரிய நிலப்பகுதிக்குள்.
    reason: cultural_note
lexical_decisions:
- source_word: כִּי אִם
  choice: ஆனால்… மட்டுமே
  rationale: முந்தைய வசனத்தின் தடைக்கு மாறாக அனுமதிக்கப்பட்ட ஒரே இடத்தைச் சுட்டும் விலக்குறு எதிர்மறைப் பொருளை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: בַּמָּקוֹם
  choice: இடத்தில்
  rationale: யாவே தேர்ந்தெடுக்கும் குறிப்பிட்ட வழிபாட்டிடத்தைத் தெளிவாகக் குறிக்கிறது.
- source_word: אֲשֶׁר יִבְחַר יְהוָה
  choice: யாவே… தேர்ந்தெடுக்கும்
  rationale: יִבְחַר என்பதன் எதிர்நோக்கிய தேர்வுப் பொருளைத் தமிழில் இயல்பாகப் பாதுகாக்கிறது; יְהוָה என்பது தனிப்பெயராக ‘யாவே’ என ஒலிபெயர்க்கப்படுகிறது.
- source_word: בְּאַחַד שְׁבָטֶיךָ
  choice: உங்கள் கோத்திரங்களில் ஒன்றில்
  rationale: எபிரெயச் சொற்றொடரின் வடிவத்தைப் பாதுகாக்கிறது; இது ஒரு கோத்திரத்தின் நிலப்பகுதிக்குள் என்பதைக் குறிப்பில் தெளிவுபடுத்துகிறது.
- source_word: שָׁם
  choice: அங்கேயே
  rationale: குறிப்பிட்ட இடத்தின் தனித்தன்மையை வலியுறுத்தும் எபிரெயச் சொல்லைத் தமிழில் அழுத்தத்துடன் தருகிறது. மூலத்தில் இருமுறை வரும் சொல், முதல் வாக்கியக் கூறில் ‘இடத்தில் மட்டுமே’ என்றும் அடுத்ததில் ‘அங்கேயே’ என்றும் இயல்பாக வெளிப்படுகிறது.
- source_word: תַּעֲלֶה עֹלֹתֶיךָ
  choice: உங்கள் தகனபலிகளைச் செலுத்த வேண்டும்
  rationale: עלה என்பதன் ஹிஃபில் வடிவம் தகனபலியுடன் வரும்போது பலியாக ஏறச்செய்தல்/செலுத்துதல் எனப் பொருள்படும்; ‘தகனபலி செலுத்துதல்’ நவீனத் தமிழில் தெளிவான பலியியல் சொற்றொடர்.
- source_word: תַּעֲשֶׂה
  choice: செய்ய வேண்டும்
  rationale: עשה என்பதன் பரந்த ‘செய்’ பொருளையும் கட்டளையின் கடப்பாட்டையும் இயல்பாகத் தருகிறது.
- source_word: כֹּל אֲשֶׁר אָנֹכִי מְצַוֶּךָּ
  choice: நான் உங்களுக்குக் கட்டளையிடுகிற அனைத்தையும்
  rationale: מְצַוֶּה என்ற நிகழ்காலப் பங்கேற்பு வடிவத்தின் தொடரும் கட்டளைச் செயலைப் பாதுகாக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரின் மொழியாக்கம்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலத்தில் வரும் நான்கெழுத்து இறைப் பெயரைப் பொதுப் பட்டப்பெயராக மாற்றாமல், ‘Yahweh’ என்பதற்கேற்ற தமிழ் ஒலிபெயர்ப்பாக வழங்குகிறது; ‘யெகோவா’ என்பது ‘Jehovah’ என்ற மாற்று வடிவத்துடன் அதிகம் தொடர்புடையது.
- issue: தேர்ந்தெடுக்கப்பட்ட வழிபாட்டிடத்தின் தனித்தன்மை
  choice: இடத்தில் மட்டுமே… அங்கேயே
  alternative: அந்த இடத்தில்
  rationale: כִּי אִם மற்றும் שָׁם ஆகியவற்றின் விலக்குறு வலியுறுத்தலைப் பாதுகாக்கிறது; ஆனால் அந்த இடத்தின் பின்னைய வரலாற்று அடையாளத்தை இவ்வசனத்துக்குள் சேர்ப்பதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையும் எளிய வாசிப்பும் கொண்ட நடை பயன்படுத்தப்பட்டுள்ளது. ஒருமை இரண்டாம் நபர் வடிவங்கள் தமிழில் மரியாதை/கூட்டுப் பொருளுடைய ‘உங்கள், உங்களுக்கு’ என வழங்கப்பட்டுள்ளன. வழிபாட்டு மரபுச் சொல்லான ‘தகனபலி’ துல்லியத்திற்காகத் தக்கவைக்கப்பட்டுள்ளது.
