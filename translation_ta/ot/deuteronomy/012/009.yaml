  text: כִּ֥י לֹא בָּאתֶ֖ם עַד עָ֑תָּה אֶל הַ/מְּנוּחָה֙ וְ/אֶל הַֽ/נַּחֲלָ֔ה אֲשֶׁר יְהוָ֥ה אֱלֹהֶ֖י/ךָ נֹתֵ֥ן לָֽ/ךְ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/009.yaml
  text: For you have not yet come to the resting place and to the inheritance that Yahweh your God is giving you[a].
translation:
  language: ta
  text: ஏனெனில், உங்கள் கடவுளாகிய யாவே உங்களுக்கு அளிக்கும் இளைப்பாறும் இடத்திற்கும்[a] சுதந்தரத்திற்கும் நீங்கள் இன்னும் வந்து சேரவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘இளைப்பாறுதலுக்கு.’ எபிரெயச் சொல் ‘இளைப்பாறுதல்’ என்ற நிலையையோ ‘இளைப்பாறும் இடம்’ என்ற இடத்தையோ குறிக்கலாம்; இங்கு நாட்டைச் சென்றடைவதைப் பற்றிய சூழல் இடத்தைக் குறிக்கும் பொருளுக்கு ஆதரவளிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய கட்டளைக்கான காரணத்தை அறிமுகப்படுத்துகிறது; எபிரெயச் சொல்லின் காரணத் தொடர்பைத் தெளிவாகக் காக்கிறது.
- source_word: לֹא בָּאתֶם עַד עָתָּה
  choice: நீங்கள் இன்னும் வந்து சேரவில்லை
  rationale: எதிர்மறையுடன் வரும் עַד עָתָּה, இதுவரை செயல் நிகழவில்லை என்பதைக் குறிக்கிறது. இலக்கை நோக்கிய בוא என்பதற்கு ‘வந்து சேரவில்லை’ இயல்பான தமிழாகும்.
- source_word: הַמְּנוּחָה
  choice: இளைப்பாறும் இடம்
  rationale: מְנוּחָה என்பது ‘இளைப்பாறுதல்’ என்ற நிலையையோ ‘இளைப்பாறும் இடம்’ என்ற குறிப்பிட்ட இடத்தையோ குறிக்கலாம். இங்கு வாக்குத்தத்த நாட்டை இலக்காகக் கூறும் சூழல், இடத்தைக் குறிக்கும் பொருளுக்கு ஆதரவளிக்கிறது.
- source_word: הַנַּחֲלָה
  choice: உரிமைச் சொத்து
  rationale: נַחֲלָה என்பது கடவுள் அளிக்கும் பங்காகிய நிலவுடைமையைக் குறிக்கிறது. ‘உரிமைச் சொத்து’ அதன் கொடை, ஒதுக்கீடு, நிலையான உடைமை ஆகிய நுணுக்கங்களைத் தக்கவைக்கிறது; ‘சுதந்தரம்’ என்ற சொல்லின் நவீன இருபொருளைத் தவிர்க்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய மூலத்தில் நேரடியாக வரும் உடன்படிக்கைப் பெயரை, பட்டப்பெயராக மாற்றாமல் நவீன தமிழில் அறியப்பட்ட ஒலிபெயர்ப்பால் வழங்குகிறது.
- source_word: נֹתֵן
  choice: கொடுத்துக்கொண்டிருக்கிற
  rationale: நிகழ்காலப் பங்கேற்புவினை, கொடை தற்போது நிறைவேறிவரும் அல்லது உடனடியாக நிறைவேறவிருக்கும் செயலாகக் காட்டுகிறது. ‘கொடுப்பார்’ என வெறும் எதிர்காலமாக மாற்றாமல் இந்த அம்சத்தைப் பாதுகாக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: ஆண்டவர்; யெகோவா
  rationale: மூல உரை இறைவனின் தனிப்பெயரைப் பயன்படுத்துவதால், அதை பொதுவான பட்டப்பெயரால் மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது. ‘யாவே’ என்பது எபிரெயப் பெயரின் பொதுவாக ஏற்றுக்கொள்ளப்படும் மறுகட்டமைக்கப்பட்ட உச்சரிப்பை நெருக்கமாகப் பிரதிபலிக்கிறது.
- issue: מְנוּחָה என்பது நிலையா இடமா
  choice: இளைப்பாறும் இடம்
  alternative: இளைப்பாறுதல்
  rationale: வசனம் சென்றடைய வேண்டிய இலக்கையும் அதனுடன் ‘உரிமைச் சொத்து’ என்பதையும் இணைத்துக் கூறுவதால், இங்கு இடப்பொருள் முன்னிலைப்படுத்தப்படுகிறது. இருப்பினும் நிலையைக் குறிக்கும் பொருளும் உண்மையான சொற்பொருள் வாய்ப்பாக அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியுமாறு கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. ‘உரிமைச் சொத்து’ என்பது நிலப் பங்காகிய நַחֲלָהவைத் தெளிவுபடுத்துகிறது. எபிரெயத்தில் ‘நீங்கள்’ என்ற பன்மையிலிருந்து ‘உன்’ என்ற தொகுதிசார் ஒருமைக்கு மாறும் இலக்கண அமைப்பு உள்ளது; இயல்பான தமிழுக்காக இஸ்ரவேல் மக்களை ஒரே சமூகமாக நோக்கும் ‘உங்கள்/உங்களுக்கு’ வடிவம் தொடர்ச்சியாகப் பயன்படுத்தப்பட்டது.
