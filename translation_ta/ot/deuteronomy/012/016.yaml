source:
  edition: WLC
  text: רַ֥ק הַ/דָּ֖ם לֹ֣א תֹאכֵ֑לוּ עַל הָ/אָ֥רֶץ תִּשְׁפְּכֶ֖/נּוּ כַּ/מָּֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/016.yaml
  text: Only, you shall not eat the blood; you shall pour it out on the ground like water.
translation:
  language: ta
  text: ஆனால், இரத்தத்தை மட்டும் சாப்பிடக் கூடாது; அதைத் தண்ணீரைப் போலத் தரையில் ஊற்ற வேண்டும்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רַק
  choice: ஆனால்
  rationale: முந்தைய அனுமதிக்கு விதிக்கப்படும் கட்டுப்பாட்டை இயல்பான தமிழில் காட்டுகிறது; இங்கு தனியாக ‘மட்டும்’ என்பது இயல்பாக அமையாது.
- source_word: הַדָּם
  choice: இரத்தத்தை
  rationale: குறிப்பிட்ட கொல்லப்பட்ட விலங்கின் இரத்தத்தைக் குறிக்கும் எபிரெயத் திட்டவுருபின் பொருள் சூழலால் தமிழில் தெளிவாகிறது.
- source_word: לֹא תֹאכֵלוּ
  choice: சாப்பிடக் கூடாது
  rationale: சட்டவகைத் தடையை நவீனத் தமிழில் நேரடியாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: עַל הָאָרֶץ
  choice: தரையில்
  rationale: இந்த உடல்சார்ந்த செயலில் אֶרֶץ என்பது நாடு அல்லது பூமியைக் காட்டிலும் தரையைக் குறிக்கிறது.
- source_word: תִּשְׁפְּכֶנּוּ
  choice: அதை ... ஊற்றிவிட வேண்டும்
  rationale: வினையோடு இணைந்த ஒருமைச் சுட்டுப்பெயர் இரத்தத்தைத் திரும்பச் சுட்டுகிறது; ‘ஊற்றிவிட’ என்பது முழுமையாக வெளியேற்றும் செயலை இயல்பாகக் காட்டுகிறது.
- source_word: כַּמָּיִם
  choice: தண்ணீரைப் போல
  rationale: எபிரெய ஒப்புமையை எளிய, தற்போதைய தமிழில் நேரடியாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: உணவுச் சட்டத்தில் இரத்தத்தைக் கையாளுதல்
  choice: இரத்தத்தை உண்ணத் தடை செய்து, அதைத் தரையில் ஊற்றும்படி கூறும் நேரடியான கட்டளையாக மொழிபெயர்த்தல்
  alternative: இரத்தத்திற்கு பிற்கால இறையியல் அல்லது சடங்கியல் விளக்கத்தை மொழிபெயர்ப்பிலேயே சேர்த்தல்
  rationale: வசனம் உறுதியான நடைமுறைக் கட்டளையை மட்டுமே தருகிறது; அதன் வெளிப்படையான பொருளை மீறிய பிற்காலக் கோட்பாடுகளை மொழிபெயர்ப்பில் புகுத்தக் கூடாது.
translation_notes:
  register: நவீன பொதுத்தமிழில், சட்டக் கட்டளைக்குரிய கண்ணியமான நேரடியான நடை பயன்படுத்தப்பட்டுள்ளது. ‘சாப்பிடக் கூடாது’ மற்றும் ‘ஊற்றிவிட வேண்டும்’ என்பவை பன்மை முகவரியைத் தமிழில் எண்ணிக்கை குறிப்பிடாமல் இயல்பாக வெளிப்படுத்துகின்றன.
