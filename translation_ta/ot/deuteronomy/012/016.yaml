review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the prohibition on consuming blood and the instruction to pour it on the ground like water. However, ‘ஆனால்’ primarily renders a simple adversative (‘but’), whereas רַק marks the specific exception/restriction to the preceding permission. The restrictive sense should be explicit.
  naturalness: The wording is clear modern Tamil. ‘சாப்பிடக் கூடாது’ is natural; ‘ஊற்ற வேண்டும்’ is slightly more direct and does not add the mildly emphatic/dispositive nuance of ‘ஊற்றிவிட வேண்டும்.’
  terminology: ‘இரத்தம்,’ ‘தரையில்,’ and ‘தண்ணீரைப் போல’ are appropriate, natural equivalents. No theological terminology has been added.
  issues:
  - severity: medium
    issue: ரַק is rendered only as ‘ஆனால்.’
    rationale: 'The Hebrew introduces an exception or limitation, not merely a contrast. Adding ‘மட்டும்’ preserves the restrictive force: blood alone is excluded from the preceding permission to eat meat.'
  - severity: low
    issue: ‘ஊற்றிவிட வேண்டும்’ slightly strengthens the verbal expression.
    rationale: The Hebrew says simply ‘you shall pour it out.’ ‘ஊற்ற வேண்டும்’ is fully natural Tamil and more closely reflects the source without an added completive/disposal shade.
  revised_text: ஆனால், இரத்தத்தை மட்டும் சாப்பிடக் கூடாது; அதைத் தண்ணீரைப் போலத் தரையில் ஊற்ற வேண்டும்.
  revised_footnotes: []
  revision_rationale: The revision explicitly represents the restrictive force of רַק with ‘மட்டும்’ while retaining the direct legal instruction in modern standard Tamil. It also simplifies the final verb to match the Hebrew command without adding emphasis. No footnote is needed.
