base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/019.yaml
  text: Be careful that you do not forsake the Levite all your days on your land[a][b].
translation:
  language: ta
  text: உன் நிலத்தில் நீ வாழும் நாட்களெல்லாம், லேவியரைக் கைவிடாதபடி கவனமாயிரு[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “லேவியர்களை.” எபிரெயத்தில் “லேவியரை” என்று ஒருமையில் உள்ளது; இது லேவியர் வகுப்பை முழுவதுமாகக் குறிக்கும் பிரதிநிதித்துவ ஒருமையாகப் பயன்படுத்தப்பட்டிருக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: சொல்லுக்கு சொல், “உன் நிலத்தின்மேல்.” இங்கு தமிழில் இயல்பாக “உன் நிலத்தில்” என்று மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִשָּׁמֶר לְךָ
  choice: எச்சரிக்கையாயிரு
  rationale: நிபால் கட்டளை வடிவமும் לְךָ என்பதும் இணைந்து, ஒருவர் தம்மைக் குறித்து எச்சரிக்கையாக இருக்க வேண்டும் என்ற வலுவான அறிவுறுத்தலைத் தருகின்றன. நவீன தமிழில் இது இயல்பாகவும் கண்ணியமாகவும் உள்ளது.
- source_word: פֶּן
  choice: கைவிடாதபடி
  rationale: פֶּן எதிர்மறையான எச்சரிக்கையை அறிமுகப்படுத்துகிறது. தமிழில் வினையுடன் ‘-ஆதபடி’ என இணைப்பது அந்த எச்சரிக்கைத் தொடர்பைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: תַּעֲזֹב
  choice: கைவிடு
  rationale: עזב என்பதன் ‘விட்டுவிடு, கைவிடு’ என்ற பொருளில், லேவியருக்குரிய சமூகப் பொறுப்பைப் புறக்கணிக்காதிருக்க வேண்டிய ஒழுக்க வலிமையை ‘கைவிடு’ இயல்பாகத் தக்கவைக்கிறது.
- source_word: אֶת הַלֵּוִי
  choice: லேவியரை
  rationale: எபிரெயத்தில் ஒருமைத் தீர்மான வடிவம் இருந்தாலும் அது லேவியர் வகுப்பைச் சுட்டும் பிரதிநிதித்துவ ஒருமையாக இருக்கலாம். தமிழில் ‘லேவியரை’ என்பது வடிவத்தில் மரியாதை ஒருமையாகவும் பொருளில் இனத்தாரைக் கூட்டாகவும் வாசிக்கப்படக்கூடியதால் மூலத்தின் நெகிழ்வைத் தக்கவைக்கிறது.
- source_word: כָּל יָמֶיךָ
  choice: வாழும் நாட்களெல்லாம்
  rationale: சொல்லுக்கு சொல் ‘உன் நாட்களெல்லாம்’ என்றாலும், தமிழில் காலவாழ்வைக் குறிக்கும் பொருளை இயல்பாகவும் முழுமையாகவும் ‘வாழும் நாட்களெல்லாம்’ தெரிவிக்கிறது.
- source_word: עַל אַדְמָתֶךָ
  choice: உன் நிலத்தில்
  rationale: עַל என்பதன் அடிப்படைத் திசை ‘மேல்’ என்றாலும், ஒரு நாட்டிலோ நிலப்பகுதியிலோ வாழும் சூழலில் நவீன தமிழின் இயல்பான இடவுருபு ‘-இல்’ ஆகும். אַדְמָה இங்கு ‘நிலம்’ என மொழிபெயர்க்கப்படுகிறது.
theological_decisions:
- issue: லேவியரைச் சுட்டும் பிரதிநிதித்துவ ஒருமை
  choice: லேவியரை
  alternative: லேவியர்களை
  rationale: மூல எபிரெயம் ஒருமையைப் பயன்படுத்துகிறது; அது ஒரு வகுப்பின் ஒவ்வொரு உறுப்பினரையும் பிரதிநிதித்துவமாகக் குறிக்கலாம். தமிழ் வடிவமான ‘லேவியரை’ இந்த ஒருமை/கூட்டுப் பொருள் நெகிழ்வை ஓரளவு காக்கிறது; அடிக்குறிப்பு மாற்று பன்மையைத் தெளிவுபடுத்துகிறது.
translation_notes:
  register: நவீன பொதுத்தரத் தமிழில், நேரடியான ஒருமை அழைப்பையும் கட்டளையின் எச்சரிக்கைத் தொனியையும் காக்கும் கண்ணியமான நடை. ‘உன் நிலத்தில் வாழும் நாட்களெல்லாம்’ என்ற அமைப்பு காலமும் இடமும் ஒரே வாழ்க்கைச் சூழலைக் குறிக்க இயல்பாக இணைக்கிறது.
