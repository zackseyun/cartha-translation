source:
  edition: WLC
  text: רַ֧ק קָֽדָשֶׁ֛י/ךָ אֲשֶׁר יִהְי֥וּ לְ/ךָ֖ וּ/נְדָרֶ֑י/ךָ תִּשָּׂ֣א וּ/בָ֔אתָ אֶל הַ/מָּק֖וֹם אֲשֶׁר יִבְחַ֥ר יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/026.yaml
  text: But only your holy things that belong to you[a], and your vow offerings, you shall carry and come to the place that Yahweh will choose.
translation:
  language: ta
  text: ஆனால், உனக்குரிய பரிசுத்தப் பொருட்களையும் உன் நேர்த்திக்கடன் காணிக்கைகளையும்[a] மட்டும் நீ சுமந்து, யாவே தேர்ந்தெடுக்கும் இடத்திற்கு வர வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “உன் நேர்த்திக்கடன்கள்” என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் நேர்த்திக்கடன்களையே குறிக்கலாம்; இந்தப் பலிச் சூழலில், அவற்றை நிறைவேற்றுவதற்காகக் கொண்டுவரப்படும் காணிக்கைகளையும் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: רַק
  choice: ஆனால்
  rationale: முந்தைய வசனங்களில் உள்ளூர் இறைச்சியறுத்து உண்ண வழங்கப்பட்ட அனுமதிக்கு மாறாக இங்கே விதிக்கப்படும் கட்டுப்பாட்டை இயல்பான தமிழில் குறிக்கிறது; அந்தக் கட்டுப்பாட்டின் வரம்பு தொடர்ந்து வரும் பொருட்களால் தெளிவாகிறது.
- source_word: קָדָשֶׁיךָ אֲשֶׁר יִהְיוּ לְךָ
  choice: உனக்குரிய பரிசுத்தப் பொருட்கள்
  rationale: קָדָשֶׁיךָ என்பது குறிப்பிட்ட ஒரு பலிவகையை மட்டும் அல்லாமல் கடவுளுக்கெனப் பிரித்துவைக்கப்பட்டவற்றை விரிவாகக் குறிக்கிறது; possessive clause-ஐ ‘உனக்குரிய’ என்று இயல்பாக இணைக்கிறது.
- source_word: וּנְדָרֶיךָ
  choice: உன் நேர்த்திக்கடன் காணிக்கைகள்
  rationale: சொல்லுக்கு நேரடியாக ‘உன் நேர்த்திக்கடன்கள்/பொருத்தனைகள்’ என்ற பொருள் இருந்தாலும், இப்பலிச்சூழலில் அவற்றை நிறைவேற்றக் கொண்டுவரப்படும் காணிக்கைகள் குறிப்பாக முன்வருகின்றன; அடிப்படைப் பொருளின் தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: תִּשָּׂא וּבָאתָ
  choice: நீ எடுத்துக்கொண்டு ... செல்ல வேண்டும்
  rationale: தொடர்ச்சியாக வரும் ‘சுமந்து/எடுத்துக்கொண்டு’ மற்றும் ‘வந்து’ என்ற செயல்களை இயல்பான இலக்கு நோக்கிய தமிழில் வெளிப்படுத்துகிறது; எடுத்துச் செல்லும் செயலை அழித்துவிடவில்லை.
- source_word: הַמָּקוֹם
  choice: இடம்
  rationale: உபாகமத்தில் மைய வழிபாட்டுத் தலத்தைக் குறிக்கும் முக்கியமான பொதுப்பெயரை அதிகமாக விளக்காமல் பாதுகாக்கிறது.
- source_word: אֲשֶׁר יִבְחַר יְהוָה
  choice: யாவே தேர்ந்தெடுக்கும்
  rationale: yiqtol வடிவத்தின் எதிர்நோக்கிய/இன்னும் நிர்ணயிக்கப்படவுள்ள தன்மையை தமிழின் தொடர்பெயரெச்ச அமைப்பில் இயல்பாகக் காட்டுகிறது; தெய்வீகப் பெயரை நேரடியாக ஒலிபெயர்க்கிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: எபிரெய மூலத்தில் உடன்படிக்கைப் பெயரான நான்கு எழுத்துப் பெயர் நேரடியாக உள்ளது. அதை ஒரு பட்டப்பெயராக மாற்றாமல், தமிழில் பரவலாகப் புரியக்கூடிய ‘யாவே’ என ஒலிபெயர்க்கிறது.
- issue: וּנְדָרֶיךָ என்பது நேர்த்திக்கடன்களையா அவற்றின் காணிக்கைகளையா குறிக்கிறது
  choice: முதன்மை உரையில் ‘நேர்த்திக்கடன் காணிக்கைகள்’
  alternative: ‘நேர்த்திக்கடன்கள்’
  rationale: பலிகளை மைய வழிபாட்டிடத்திற்குக் கொண்டுசெல்லும் சூழல் concrete offerings-ஐ ஆதரிக்கிறது; எனினும் எபிரெயச் சொல் நேர்த்திக்கடன்களையே குறிக்கவும் முடிவதால் மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன தரநிலைத் தமிழில், ஒருமை இரண்டாம் நபர் வடிவங்களுடன் dignified சட்டநடை பயன்படுத்தப்பட்டுள்ளது. ‘பரிசுத்தப் பொருட்கள்’ என்ற பரந்த வழிபாட்டுச் சொல் காக்கப்பட்டுள்ளது; ‘நேர்த்திக்கடன் காணிக்கைகள்’ சாதாரண வாசகருக்குத் தெளிவாக இருக்கத் தேர்ந்தெடுக்கப்பட்டுள்ளது. வசனத்தின் எபிரெய வாக்கிய வரிசையை இயல்பற்ற முறையில் அப்படியே பின்பற்றாமல், எடுத்துக்கொண்டு இலக்கிற்குச் செல்லும் இயக்கம் தமிழில் தெளிவாக்கப்பட்டுள்ளது.
