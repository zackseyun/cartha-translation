id: DEU.12.20
reference: Deuteronomy 12:20
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: כִּֽי יַרְחִיב֩ יְהוָ֨ה אֱלֹהֶ֥י/ךָ אֶֽת גְּבֽוּלְ/ךָ֮ כַּ/אֲשֶׁ֣ר דִּבֶּר לָ/ךְ֒ וְ/אָמַרְתָּ֙ אֹכְלָ֣ה בָשָׂ֔ר כִּֽי תְאַוֶּ֥ה נַפְשְׁ/ךָ֖ לֶ/אֱכֹ֣ל בָּשָׂ֑ר בְּ/כָל אַוַּ֥ת נַפְשְׁ/ךָ֖ תֹּאכַ֥ל בָּשָֽׂר־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/020.yaml
  text: When the LORD your God enlarges your territory, as he has promised you, and you say, “I want to eat meat,” because you crave to eat meat, you may eat meat according to all the desire of your soul.
translation:
  language: ta
  text: உன் கடவுளாகிய ஆண்டவர் உனக்குச் சொன்னபடியே உன் நிலப்பரப்பை விரிவாக்கும்போது, இறைச்சி சாப்பிட உன் உள்ளம் ஏங்குவதால், “நான் இறைச்சி சாப்பிட விரும்புகிறேன்” என்று நீ சொன்னால், உன் உள்ளம் விரும்புகிற அளவுக்கு இறைச்சி சாப்பிடலாம்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: ஆண்டவர்
  rationale: இறைவனின் தனிப்பெயரைக் குறிக்கும் நான்கு எழுத்துப் பெயருக்கு, நவீனத் தமிழில் கண்ணியமாகவும் பரவலாகப் புரிந்துகொள்ளத்தக்கதாகவும் உள்ள மரபான பிரதிநிதித்துவம்.
- source_word: גְּבוּלְךָ
  choice: உன் நிலப்பரப்பை
  rationale: இங்கு சொல் வெறும் எல்லைக்கோட்டை மட்டுமல்லாமல் அதன் உட்புறப் பிரதேசத்தையும் குறிக்கிறது; அதனால் ‘நிலப்பரப்பு’ சூழலுக்கு இயல்பாக உள்ளது.
- source_word: כַּאֲשֶׁר דִּבֶּר לָךְ
  choice: உனக்குச் சொன்னபடியே
  rationale: எபிரெயச் சொற்றொடரின் நேரடிப் பொருளைப் பாதுகாக்கிறது; சூழலில் அது வாக்குறுதியைக் குறிப்பதாக இருக்கலாம் என்றாலும், ‘வாக்குறுதி அளித்தபடியே’ என்று விளக்கத்தை உரைக்குள் கட்டாயப்படுத்தவில்லை.
- source_word: תְאַוֶּה נַפְשְׁךָ
  choice: உன் உள்ளம் ஏங்குவதால்
  rationale: נפשׁ இங்கு மனிதரின் விருப்பமுள்ள அகநிலையைக் குறிக்கிறது; ‘உள்ளம்’ தமிழ் வழக்கில் இயல்பாக அதைப் தெரிவிக்கிறது, ‘ஏங்குதல்’ தீவிர விருப்பத்தைப் பாதுகாக்கிறது.
- source_word: בְּכָל אַוַּת נַפְשְׁךָ
  choice: உன் உள்ளம் விரும்புகிற அளவுக்கு
  rationale: சொல்லுக்குச் சொல் வடிவத்தை விட எபிரெய மொழிமரபின் அனுமதி சார்ந்த பொருளை இயல்பான தமிழில் தருகிறது; விருப்பத்தின் முழு அளவும் தக்கவைக்கப்படுகிறது.
theological_decisions:
- issue: כַּאֲשֶׁר דִּבֶּר לָךְ என்பதன் வாக்குறுதி சார்ந்த நுணுக்கம்
  choice: உனக்குச் சொன்னபடியே
  alternative: உனக்கு வாக்குறுதி அளித்தபடியே
  rationale: சூழல் வாக்குறுதியை உணர்த்தினாலும், மூலத்தில் உள்ள பொதுவான ‘சொன்னார்’ என்ற வினையின் திறந்த தன்மையைப் பாதுகாக்கிறது.
- issue: נפשׁ என்பதன் மொழிபெயர்ப்பு
  choice: உள்ளம்
  alternative: ஆத்துமா
  rationale: இவ்வசனத்தில் பிரிக்கத்தக்க ஆன்மீகக் கூறைப் பற்றிய கோட்பாட்டை வலியுறுத்தாமல், ஒருவரின் ஆசை அல்லது உயிருள்ள தன்மையைச் சுட்டுகிறது; ‘உள்ளம்’ அந்தச் செயல்பாட்டு பொருளை இயல்பாக வழங்குகிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; சாதாரண வாசகர்களுக்குப் புரியும் இயல்பான சொற்றொடரமைப்பு, அதேவேளை வேதாகம உரைக்கேற்ற கண்ணியமான நடை. மூலத்தின் ‘இறைச்சி’ மற்றும் விருப்பம் சார்ந்த மீளுரைத்தல் கருத்தளவில் பாதுகாக்கப்பட்டுள்ளது.
