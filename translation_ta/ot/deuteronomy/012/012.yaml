  rationale: மூலத்தில் உள்ள ஆண் மற்றும் பெண் அடிமைகள் என்ற வேறுபாடு தெளிவாக்கப்பட்டது; ஒரே பிரதான வினை முழுப் பட்டியலுக்கும் பொருந்துமாறு நடை சீரமைக்கப்பட்டது; «மரபுரிமை» மூலம் נַחֲלָה-வின் குறிப்பான பொருள் காக்கப்பட்டது. அடிக்குறிப்பு குறியீடு லேவியரை விவரிக்கும் சொற்றொடரிலேயே நிலைத்துள்ளது.
