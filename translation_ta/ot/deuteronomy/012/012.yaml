revisions:
- from: உங்கள் கடவுளாகிய யாவேவின் முன்னிலையில் நீங்கள் மகிழுங்கள்—நீங்களும், உங்கள் மகன்களும் மகள்களும், உங்கள் அடிமைகளும் அடிமைப் பெண்களும், உங்கள் ஊர்களில் வாழும் லேவியரும்[a] மகிழுங்கள்; ஏனெனில், உங்களோடு அவருக்குப் பங்கோ உரிமைச்சொத்தோ இல்லை.
