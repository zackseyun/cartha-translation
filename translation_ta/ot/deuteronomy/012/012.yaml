  text: וּ/שְׂמַחְתֶּ֗ם לִ/פְנֵי֮ יְהוָ֣ה אֱלֹֽהֵי/כֶם֒ אַתֶּ֗ם וּ/בְנֵי/כֶם֙ וּ/בְנֹ֣תֵי/כֶ֔ם וְ/עַבְדֵי/כֶ֖ם וְ/אַמְהֹתֵי/כֶ֑ם וְ/הַ/לֵּוִי֙ אֲשֶׁ֣ר בְּ/שַֽׁעֲרֵי/כֶ֔ם כִּ֣י אֵ֥ין ל֛/וֹ חֵ֥לֶק וְ/נַחֲלָ֖ה אִתְּ/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/012.yaml
  text: And you shall rejoice before Yahweh your God—you and your sons and your daughters[a], and your male servants and your female servants, and the Levite who is within your gates, because he has no portion or inheritance with you.
translation:
  language: ta
  text: உங்கள் கடவுளாகிய யாவேவின் முன்னிலையில் நீங்களும், உங்கள் மகன்களும் மகள்களும், உங்கள் ஆண் அடிமைகளும் பெண் அடிமைகளும், உங்கள் ஊர்களில் இருக்கும் லேவியரும்[a] மகிழுங்கள்; ஏனெனில், உங்களோடு அவருக்குப் பங்கோ மரபுரிமையோ இல்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'சொல்லுக்குச் சொல்: “உங்கள் வாசல்களுக்குள் இருக்கும் லேவியர்.” இங்கு “வாசல்கள்” என்பது ஊர்கள் அல்லது குடியிருப்புகளைக் குறிக்கிறது.'
    reason: எபிரெய உருவகச் சொல்லையும் அதன் சூழற்பொருளையும் தெரிவிப்பதற்கான சொற்பொருள் மாற்று.
lexical_decisions:
- source_word: וּשְׂמַחְתֶּם
  choice: நீங்கள் மகிழுங்கள்
  rationale: அறிவுறுத்தல் சூழலில் கட்டளைப் பொருள் தரும் வினையை இயல்பான நவீனத் தமிழில் கட்டளை வடிவில் வழங்குகிறது; வழிபாட்டுச் சார்ந்த மகிழ்ச்சியையும் காக்கிறது.
- source_word: לִפְנֵי יְהוָה אֱלֹהֵיכֶם
  choice: உங்கள் கடவுளாகிய யாவேவின் முன்னிலையில்
  rationale: לִפְנֵי என்பதன் ‘முன்னிலையில்/சந்நிதியில்’ என்ற பொருளை இயல்பாகத் தருகிறது; יְהוָה என்பதைப் பட்டப்பெயரால் மாற்றாமல் யாவே எனப் பெயரெழுத்தாக்குகிறது.
- source_word: וּבְנֵיכֶם וּבְנֹתֵיכֶם
  choice: உங்கள் மகன்களும் மகள்களும்
  rationale: எபிரெயத்தில் வெளிப்படையாக உள்ள ஆண்-பெண் இணையைப் பொதுவான ‘பிள்ளைகள்’ என்று சுருக்காமல் காக்கிறது.
- source_word: וְעַבְדֵיכֶם וְאַמְהֹתֵיכֶם
  choice: உங்கள் அடிமைகளும் அடிமைப் பெண்களும்
  rationale: குடும்பத்தைச் சார்ந்த கட்டுப்பட்ட சமூக நிலையைக் ‘வேலையாட்கள்’ என மென்மைப்படுத்தாமல் காட்டுகிறது; இரு எபிரெயச் சொற்களின் பாலின வேறுபாட்டையும் காக்கிறது.
- source_word: וְהַלֵּוִי
  choice: லேவியரும்
  rationale: லேவி கோத்திரத்தைச் சேர்ந்த ஒருவரைக் குறிக்கும் வழக்கமான தமிழ்ச் சொல்; மரியாதைப் பன்மை தமிழில் இயல்பான மனிதக் குறிப்பாக அமைகிறது.
- source_word: אֲשֶׁר בְּשַׁעֲרֵיכֶם
  choice: உங்கள் ஊர்களில் வாழும்
  rationale: ‘உங்கள் வாசல்களுக்குள்’ என்ற சொற்பொருள் இங்கு நகரங்கள் அல்லது குடியிருப்புகளைக் குறிக்கும் ஆகுபெயர்; நவீன வாசகருக்கு அதன் சூழற்பொருளைத் தெளிவாக வழங்குகிறது.
- source_word: חֵלֶק וְנַחֲלָה
  choice: பங்கோ உரிமைச்சொத்தோ
  rationale: லேவியருக்கு நிலப் பங்கும் பரம்பரை உரிமைச்சொத்தும் இல்லாத நிலையைச் சுருக்கமாகவும் வேறுபாடு குலையாமலும் தருகிறது.
- source_word: אִתְּכֶם
  choice: உங்களோடு
  rationale: மூலத்தின் ‘உங்களுடன்’ என்ற நேரடியான உறவை இயல்பான தமிழில் காக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழியாக்கம்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் வரும் தனிப்பட்ட உடன்படிக்கைப் பெயரை ஒரு பட்டப்பெயரால் மாற்றாமல் தமிழில் பெயரெழுத்தாக்குகிறது.
- issue: עֶבֶד / אָמָה என்பவற்றின் சமூகநிலை
  choice: அடிமைகள் / அடிமைப் பெண்கள்
  alternative: வேலையாட்கள் / வேலைக்காரிகள்
  rationale: சட்ட-சமூகச் சூழலில் உள்ள கட்டுப்பட்ட நிலையைக் மென்மைப்படுத்தாமல் வெளிப்படுத்துகிறது; அதேவேளை மூலத்தில் உள்ள பாலின வேறுபாட்டையும் காக்கிறது.
- issue: லேவியரின் חֵלֶק וְנַחֲלָה இல்லாமை
  choice: பங்கோ உரிமைச்சொத்தோ இல்லை
  alternative: பங்கும் சுதந்தரமும் இல்லை
  rationale: இஸ்ரவேலரிடையே லேவியருக்கு நிலப்பங்கும் பரம்பரை உடைமையும் வழங்கப்படாததைத் தெரிவிக்கிறது; கருத்தை வேறு ஓர் இறையியல் முடிவாக விரிவாக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகருக்குப் புரியும் கண்ணியமான சட்ட-வழிபாட்டு நடை பயன்படுத்தப்பட்டுள்ளது. நீண்ட பட்டியல் தமிழில் தெளிவாக இருக்க வினை இறுதியில் மீண்டும் இடப்பட்டுள்ளது; இது மூலத்தின் பொருளை மாற்றாது. இறைப்பெயர் ‘யாவே’ என்றும், servile-status சொற்கள் ‘அடிமைகள்/அடிமைப் பெண்கள்’ என்றும் வெளிப்படையாக வழங்கப்பட்டுள்ளன.
