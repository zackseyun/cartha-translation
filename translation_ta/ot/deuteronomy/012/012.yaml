  source_fidelity: மூலத்தின் பட்டியல், யாவே என்ற இறைப்பெயர், லேவியருக்கு உரிய பங்கு/மரபுரிமை இல்லாமை ஆகியவை பெரும்பாலும் துல்லியமாக உள்ளன. ஆனால் «அடிமைகள்» என்பது ஆண் அடிமைகளைத் தெளிவாகக் குறிக்கவில்லை; எபிரெயத்தின் ஆண்/பெண் வேறுபாடு வெளிப்பட வேண்டும். மேலும் வினை இருமுறை வருவது மூலத்தில் ஒருமுறை மட்டுமே வரும் பிரதான வினையைத் தேவையின்றி மீளச்செய்கிறது.
  naturalness: «நீங்களும் ... லேவியரும் மகிழுங்கள்» என்ற ஒரே வினைமுற்றுடன் பட்டியலை முடிப்பது நவீன நிலையான தமிழில் இயல்பாகவும் தெளிவாகவும் உள்ளது. «பங்கோ மரபுரிமையோ» என்பது நிலப்பங்கு மற்றும் பரம்பரை உரிமையைத் துல்லியமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
  terminology: «யாவே», «லேவியர்», «ஆண் அடிமைகள்», «பெண் அடிமைகள்» ஆகியவை பொருத்தமானவை. «உங்கள் ஊர்களில் இருக்கும்» என்பது ‘உங்கள் வாசல்களுக்குள்’ என்ற எபிரெய ஆகுபெயரின் இயல்பான சூழற்பொருள்; அடிக்குறிப்பு சொல்லுக்குச்சொல் வடிவத்தைப் பாதுகாக்கிறது.
