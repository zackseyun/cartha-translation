base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/027.yaml
  text: And you shall offer your burnt offerings[a], the flesh and the blood, on the altar of Yahweh your God; and the blood of your sacrifices shall be poured out on the altar of Yahweh your God, and you shall eat the flesh.
translation:
  language: ta
  text: உன் தகனபலிகளை, அவற்றின் இறைச்சியையும் இரத்தத்தையும், உன் கடவுளாகிய யாவேவின் பலிபீடத்தின்மேல் செலுத்த வேண்டும். உன் பலிகளின் இரத்தம் உன் கடவுளாகிய யாவேவின் பலிபீடத்தின்மேல் ஊற்றப்பட வேண்டும்; இறைச்சியை நீ உண்ண வேண்டும்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “இறைச்சியை நீ உண்ணலாம்” என்றும் மொழிபெயர்க்கலாம்.
    reason: எபிரெய வினைவடிவம் நேரடியாகக் கட்டளை அல்லது எதிர்காலக் கூற்றாக வாசிக்கப்படுகிறது; இச்சட்டச் சூழலில் உண்ணுவதற்கான அனுமதியையும் குறிக்கலாம்.
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: செலுத்த வேண்டும்
  rationale: עָשָׂה என்பதன் அடிப்படைப் பொருள் ‘செய்/உண்டாக்கு’ என்றாலும், தகனபலிகளைப் பற்றிய இச்சடங்குச் சூழலில் பலியைச் செலுத்துவதைக் குறிக்கிறது. ‘செலுத்த வேண்டும்’ என்பது இயல்பான நவீனத் தமிழில் கட்டளைத் தன்மையையும் பலியிடும் செய்கையையும் வெளிப்படுத்துகிறது.
- source_word: עֹלֹתֶיךָ
  choice: உன் தகனபலிகள்
  rationale: עֹלָה என்பது முழுவதும் எரிக்கப்படும் பலியைக் குறிக்கும் நிலையான பலியியல் சொல். ‘தகனபலி’ தமிழில் தெளிவான, மரபாக அறியப்பட்ட இணைச்சொல்.
- source_word: הַבָּשָׂר וְהַדָּם
  choice: இறைச்சியையும் இரத்தத்தையும்
  rationale: בָּשָׂר இங்கு பலியிடப்பட்ட விலங்கின் உடல் இறைச்சியைக் குறிக்கிறது. நவீனத் தமிழில் ‘இறைச்சி’ என்பது ‘மாம்சம்’ என்பதைக் காட்டிலும் இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: עַל מִזְבַּח יְהוָה אֱלֹהֶיךָ
  choice: உன் கடவுளாகிய யாவேவின் பலிபீடத்தின்மேல்
  rationale: עַל என்பதன் இடத்தைக் குறிக்கும் பொருளை ‘மேல்’ துல்லியமாக வெளிப்படுத்துகிறது; எபிரெயச் சொல் வரிசையை அப்படியே பின்பற்றாமல் இயல்பான தமிழ் உடைமைத் தொடராக அமைக்கப்பட்டுள்ளது.
- source_word: וְדַם זְבָחֶיךָ
  choice: உன் மற்ற பலிகளின் இரத்தம்
  rationale: זֶבַח இங்கு தகனபலியிலிருந்து வேறுபட்ட, பலியிட்டவர் இறைச்சியை உண்ணக்கூடிய பலிகளைச் சுட்டுகிறது. தமிழில் இந்த எதிர்மறை வேறுபாடு தெளிவாக இருக்க ‘மற்ற’ சேர்க்கப்பட்டுள்ளது; அது புதிய வகைப்பாட்டை உருவாக்காமல் சூழலிலுள்ள வேறுபாட்டை மட்டும் வெளிப்படுத்துகிறது.
- source_word: יִשָּׁפֵךְ
  choice: ஊற்றப்பட வேண்டும்
  rationale: நிபால் வடிவம் இரத்தத்தின்மேல் செய்யப்படும் சடங்குச் செயலைச் செயலப்பாட்டு வடிவில் காட்டுகிறது. ‘ஊற்றப்பட வேண்டும்’ அதன் கட்டளை மற்றும் செயலப்பாட்டுத் தன்மைகளைப் பாதுகாக்கிறது.
- source_word: וְהַבָּשָׂר תֹּאכֵל
  choice: ஆனால் அவற்றின் இறைச்சியை நீ சாப்பிடலாம்
  rationale: முந்தைய இரத்தக் கட்டுப்பாட்டுக்கு எதிராக இறைச்சியை உண்ண அனுமதிப்பதே சூழலின் நோக்கம். ‘ஆனால்’ மறைமுகமான எதிர்மறைத் தொடர்பை வெளிப்படுத்துகிறது; ‘சாப்பிடலாம்’ சட்டரீதியான அனுமதியை இயல்பான தமிழில் தெரிவிக்கிறது. எளிய கட்டளை வாசிப்பு அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
- source_word: יְהוָה
  choice: யாவே
  rationale: திருநாம எழுத்துகளான יהוה ஒரு பட்டமல்ல, தனிப்பட்ட இறைபெயர். தமிழில் பரவலாகப் புரியக்கூடிய ஒலிபெயர்ப்பாக ‘யாவே’ பயன்படுத்தப்பட்டுள்ளது.
theological_decisions:
- issue: יהוה என்ற இறைபெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூலத்தில் பொதுப்பட்டமான ‘ஆண்டவர்’ அல்ல, திருநாமம் நேரடியாக உள்ளது. ஆகவே பெயரின் தன்மையைப் பாதுகாக்க ஒலிபெயர்ப்பு பயன்படுத்தப்பட்டுள்ளது.
- issue: וְהַבָּשָׂר תֹּאכֵל என்பதன் கட்டளை அல்லது அனுமதிப் பொருள்
  choice: ஆனால் அவற்றின் இறைச்சியை நீ சாப்பிடலாம்
  alternative: அவற்றின் இறைச்சியை நீ சாப்பிட வேண்டும்
  rationale: இரத்தம் பலிபீடத்தில் ஊற்றப்பட வேண்டும் என்பதற்கு மாறாக இறைச்சி உண்ணத்தக்கது என்பதே சட்டச் சூழல். அதனால் பிரதான உரையில் அனுமதிப் பொருள் தேர்ந்தெடுக்கப்பட்டுள்ளது; எபிரெய வினையின் நேரடியான கட்டளை வாசிப்பும் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான சட்டநடை பயன்படுத்தப்பட்டுள்ளது. ‘மாம்சம்’ என்பதற்குப் பதில் இயல்பான ‘இறைச்சி’, ‘பலிபீடம்’ போன்ற பரவலாக அறியப்பட்ட வேதாகமச் சொற்களுடன் இணைக்கப்பட்டுள்ளது. மூலத்தின் இரு இணை வாக்கியங்களும் பாதுகாக்கப்பட்டுள்ளன; இறுதி வாக்கியத்தின் அனுமதி/கட்டளை நுட்பம் அடிக்குறிப்பில் வெளிப்படையாக வைக்கப்பட்டுள்ளது.
