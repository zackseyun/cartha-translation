base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/017.yaml
  text: You may not eat within your gates the tithe of your grain[a], your new wine, or your oil, or the firstborn of your herd or your flock, or any of your vows that you vow, or your freewill offerings[c][b], or the contribution of your hand.
translation:
  language: ta
  text: உங்கள் தானியம், புதுத் திராட்சரசம், எண்ணெய் ஆகியவற்றின் பத்திலொரு பங்கையோ, உங்கள் மாட்டு மந்தையிலும் செம்மறியாடு மற்றும் வெள்ளாட்டு மந்தைகளிலும் முதற்பிறந்தவற்றையோ, நீங்கள் நேர்ந்துகொள்ளும் நேர்த்திக்கடன்களையோ[a], உங்கள் விருப்பக் காணிக்கைகளையோ, உங்கள் கையால் அளிக்கும் பங்களிப்பையோ[b] உங்கள் ஊர்களில்[c] நீங்கள் உண்ணக் கூடாது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இது நேர்ந்துகொண்ட வாக்குறுதிகளைக் குறிக்கலாம்; இந்தச் சூழலில் அவற்றை நிறைவேற்ற அளிக்கப்படும் காணிக்கைகளையும் குறிக்க வாய்ப்புள்ளது.
    reason: lexical_alternative
  - marker: b
    text: சொல்லளவில், “உங்கள் கையின் பங்களிப்பு”; மரபாக, “உங்கள் கையின் உயர்த்துப் படைப்பு” என்றும் மொழிபெயர்க்கப்படுகிறது.
    reason: lexical_alternative
  - marker: c
    text: எபிரெயத்தில் சொல்லளவில், “உங்கள் வாயில்களுக்குள்”; இது ஒருவரது உள்ளூர்க் குடியிருப்புகள் அல்லது ஊர்களைக் குறிக்கும் மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא תוּכַל לֶאֱכֹל
  choice: நீங்கள் உண்ணக் கூடாது
  rationale: இயலாமையை மட்டும் அல்லாமல் சட்டரீதியான தடையை வெளிப்படுத்தும் எபிரெயச் சொல்லமைப்பை இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: בִּשְׁעָרֶיךָ
  choice: உங்கள் ஊர்களில்
  rationale: சொல்லளவில் ‘உங்கள் வாயில்களுக்குள்’ என்றாலும், இங்கு குடியிருக்கும் உள்ளூர் ஊர்களைக் குறிக்கும் எபிரெய மரபுத்தொடர்; தமிழில் பொருள் தெளிவாக இருக்க ‘ஊர்களில்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: מַעְשַׂר דְּגָנְךָ
  choice: உங்கள் தானியத்தின் பத்திலொரு பங்கு
  rationale: מַעְשַׂר என்பது செலுத்தப்படும் அல்லது காணிக்கையாக்கப்படும் பத்தில் ஒரு பகுதியைக் குறிக்கிறது; ‘பத்திலொரு பங்கு’ தெளிவான தமிழ்.
- source_word: תִּירֹשְׁךָ
  choice: புதுத் திராட்சரசம்
  rationale: תירוש என்பதன் புதிய அல்லது அண்மையில் தயாரிக்கப்பட்ட திராட்சரசம் என்ற தனித்துவத்தைப் பாதுகாக்கிறது.
- source_word: יִצְהָרֶךָ
  choice: எண்ணெய்
  rationale: பொதுவாக ஒலிவ எண்ணெயைக் குறித்தாலும் மூலத்தில் உள்ள பொதுவான சொல்லளவைத் தக்கவைக்கிறது.
- source_word: בְכֹרֹת בְּקָרְךָ וְצֹאנֶךָ
  choice: உங்கள் மந்தையிலும் ஆட்டு மந்தையிலும் பிறக்கும் முதற்பேறுகள்
  rationale: இரு வகை வளர்ப்பு விலங்குகளின் முதலில் பிறந்தவற்றைக் குறிக்கும் பலவினப் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: כָל נְדָרֶיךָ אֲשֶׁר תִּדֹּר
  choice: நீங்கள் நேர்ந்துகொள்ளும் நேர்த்திக்கடன்கள்
  rationale: நேர்ந்து கொண்டவற்றைக் குறிக்கும் மூலச்சொல்லுக்கு நெருக்கமாக இருந்து, சூழலில் அவை காணிக்கை சார்ந்தவை என்பதைத் தமிழ் வழக்கில் உணர்த்துகிறது; ‘காணிக்கைகள்’ என்பதை பிரதான உரையில் வெளிப்படையாகச் சேர்க்கவில்லை.
- source_word: נִדְבֹתֶיךָ
  choice: உங்கள் விருப்பக் காணிக்கைகள்
  rationale: கடமையினாலோ நேர்த்திக்கடனினாலோ அல்லாமல் மனமுவந்து அளிக்கப்படும் சடங்கு காணிக்கைகளைத் தெளிவாக வேறுபடுத்துகிறது.
- source_word: תְּרוּמַת יָדֶךָ
  choice: உங்கள் கையால் அளிக்கும் பங்களிப்பு
  rationale: ஒதுக்கி அளிக்கப்படும் பங்கு அல்லது காணிக்கையையும் ‘உங்கள் கை’ என்ற மூல உருவகத்தையும் இயல்பான தமிழில் பாதுகாக்கிறது.
theological_decisions:
- issue: நேர்த்திக்கடன்கள் என்பது சொன்ன வாக்குறுதிகளா, அவற்றுடன் தொடர்புடைய காணிக்கைகளா?
  choice: பிரதான உரையில் ‘நேர்த்திக்கடன்கள்’ என மூலத்தின் தெளிவின்மையைத் தக்கவைத்தல்
  alternative: ‘நேர்த்திக்கடன் காணிக்கைகள்’ என்று சடங்கு சார்ந்த பொருளை வெளிப்படையாக்குதல்
  rationale: נדר என்ற சொல் அடிப்படையில் நேர்ந்துகொள்ளப்பட்ட நேர்த்தியைக் குறிக்கிறது; இந்த உணவு மற்றும் காணிக்கைப் பட்டியலின் சூழலில் அதனுடன் தொடர்புடைய காணிக்கைகள் நோக்கமாக இருக்கலாம். பிரதான உரை இதைத் தீர்மானிக்காமல், அடிக்குறிப்பு சூழல்சார் பொருளை விளக்குகிறது.
- issue: சடங்கு காணிக்கை வகைகளின் வேறுபாடு
  choice: ‘விருப்பக் காணிக்கைகள்’ மற்றும் ‘கையால் அளிக்கும் பங்களிப்பு’ என தனித்தனி வகைகளைப் பாதுகாத்தல்
  alternative: அனைத்தையும் பொதுவாக ‘காணிக்கைகள்’ என மொழிபெயர்த்தல்
  rationale: சட்ட-வழிபாட்டு சூழலில் உள்ள தனித்தனி எபிரெயப் பிரிவுகளை ஒன்றாகச் சுருக்காமல் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் நேரடி சட்டநடை பயன்படுத்தப்பட்டுள்ளது. ‘நேர்த்திக்கடன்’, ‘விருப்பக் காணிக்கை’ போன்ற அறியப்பட்ட வழிபாட்டுச் சொற்கள் தக்கவைக்கப்பட்டுள்ளன; அரிதான விவரங்களுக்கு அடிக்குறிப்புகள் தரப்பட்டுள்ளன. எல்லா அடிக்குறிப்பு குறிகளும் பிரதான உரையில் இடம்பெற்றுள்ளன.
