source:
  edition: WLC
  text: הִשָּׁ֣מֶר לְ/ךָ֔ פֶּֽן תַּעֲלֶ֖ה עֹלֹתֶ֑י/ךָ בְּ/כָל מָק֖וֹם אֲשֶׁ֥ר תִּרְאֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/013.yaml
  text: Be careful lest you offer up your burnt offerings in any place that you see;[a]
translation:
  language: ta
  text: நீ காணும் எந்த இடத்திலும் உன் தகனபலிகளைச் செலுத்தாதபடி எச்சரிக்கையாக இரு.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘எந்த இடத்திலும்’ என்பதற்குப் பதிலாக, சொற்படியான முறையில் ‘எல்லா இடங்களிலும்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: בְּכָל מָקוֹם என்பதிலுள்ள כָּל என்பதன் சொற்படியான ‘எல்லா’ என்ற மாற்று மொழிபெயர்ப்பைப் பாதுகாக்கிறது.
lexical_decisions:
- source_word: הִשָּׁמֶר לְךָ
  choice: எச்சரிக்கையாக இரு
  rationale: שׁמר என்பதன் நிஃபால் கட்டளை வடிவமும் இரண்டாம் நபர் சுட்டுப்பெயரும் சேர்ந்து, ஒருவர் தம்மைக் காத்துக்கொள்ள வேண்டும் என்ற வலுவான எச்சரிக்கைத் தொடராக அமைகின்றன. ‘எச்சரிக்கையாக இரு’ என்பது அதன் கட்டளைத் தன்மையை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: פֶּן
  choice: செலுத்திவிடாதபடி
  rationale: פֶּן எதிர்மறையான எச்சரிக்கையை அறிமுகப்படுத்துகிறது. தமிழில் தனிச்சொல்லாக மொழிபெயர்ப்பதைவிட, வினையுடன் இணைந்த ‘-விடாதபடி’ என்ற அமைப்பு தடுப்பு நோக்கத்தையும் அபாய எச்சரிக்கையையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: תַּעֲלֶה
  choice: செலுத்து
  rationale: עלה என்பதன் ஹிஃபில் வடிவம் சொற்பட ‘மேலே எழும்பச் செய்’ என்று பொருள்பட்டாலும், பலியைப் பலிபீடத்தில் அர்ப்பணிப்பதைக் குறிக்கும் வழக்குச் சொல்லாக இங்கு பயன்படுகிறது. ‘செலுத்து’ பலியிடும் செயலைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: עֹלֹתֶיךָ
  choice: உன் தகனபலிகள்
  rationale: עֹלָה என்பது முழுவதும் எரிக்கப்பட்டு புகையாக மேலெழும் பலிக்கான நிலையான எபிரெய வழிபாட்டுச் சொல். ‘தகனபலி’ அதன் தனிப்பட்ட பலிவகையைத் துல்லியமாகக் குறிக்கிறது.
- source_word: בְּכָל מָקוֹם
  choice: எந்த இடத்திலும்
  rationale: எதிர்மறை எச்சரிக்கையின் கீழ் כָּל மָקוֹם என்பது கட்டுப்பாடின்றித் தேர்ந்தெடுக்கப்படும் எந்த இடத்தையும் குறிக்கிறது. ஆகவே ‘எந்த இடத்திலும்’ என்பது தமிழில் தடைப் பொருளைத் தெளிவாகக் காட்டுகிறது; ‘எல்லா இடங்களிலும்’ என்ற சொற்படியான வாய்ப்பும் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: אֲשֶׁר תִּרְאֶה
  choice: நீ காணும்
  rationale: எபிரெயத் தொடர் சொற்பட ‘நீ காணும்’ என்பதாகும். இது ஒருவரது பார்வைக்குத் தோன்றும் அல்லது அவர் தாமாகத் தேர்ந்தெடுக்கும் இடம் என்ற கருத்தை மிகைப்படுத்தாமல் பாதுகாக்கிறது.
theological_decisions:
- issue: வழிபாட்டு இடத்தை மையப்படுத்தும் மொழி
  choice: ஒருவர் தாமாகக் காணும் எந்த இடத்திலும் தகனபலிகளைச் செலுத்துவதற்கு எதிரான எச்சரிக்கையாக நேரடியாக மொழிபெயர்க்கப்பட்டது.
  alternative: மையப் பரிசுத்த இடத்துக்கு வெளியே நடைபெறும் எல்லா வழிபாட்டுக்கும் பொதுவான தடையாக விரிவுபடுத்துதல்.
  rationale: சூழலில் மையப்படுத்தப்பட்ட வழிபாடு பற்றிய கருத்து இருந்தாலும், இவ்வசனத்தின் நேரடி சொற்கள் தகனபலிகளையும் தாமாகத் தேர்ந்தெடுக்கப்படும் இடங்களையுமே குறிப்பிடுகின்றன. மொழிபெயர்ப்பு வசனம் கூறுவதைத் தாண்டி ஒரு விரிவான கொள்கையைச் சேர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கட்டளை நடையைக் கொண்டுள்ளது. ‘தகனபலி’ என்ற நிலையான வேதாகம வழிபாட்டுச் சொல் துல்லியத்திற்காக வைக்கப்பட்டுள்ளது; மற்ற சொற்றொடர்கள் இயல்பான தமிழில் அமைக்கப்பட்டுள்ளன.
