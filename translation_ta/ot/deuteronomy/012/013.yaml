  revision_rationale: The revision removes the unneeded விடு auxiliary while retaining the imperative warning, the contextual force of ‘any place,’ and the established cultic term ‘தகனபலிகள்.’ The footnote continues to document the more literal ‘every/all places’ alternative without altering the verse’s scope.
