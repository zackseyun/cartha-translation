id: DEU.12.24
reference: Deuteronomy 12:24
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: לֹ֖א תֹּאכְלֶ֑/נּוּ עַל הָ/אָ֥רֶץ תִּשְׁפְּכֶ֖/נּוּ כַּ/מָּֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/024.yaml
  text: You shall not eat it[a]; you shall pour it out on the ground like water.
translation:
  language: ta
  text: அதைச் சாப்பிடக் கூடாது[a]; தண்ணீரைப் போல அதைத் தரையில் ஊற்றிவிட வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அதாவது, சுற்றியுள்ள வசனங்களில் குறிப்பிடப்பட்டுள்ள மிருகத்தின் இரத்தம்.
    reason: சூழலில் உள்ள சுட்டுப்பொருளைத் தெளிவுபடுத்தும் குறுக்கு மேற்கோள் விளக்கம்.
lexical_decisions:
- source_word: לֹא תֹּאכְלֶנּוּ
  choice: அதைச் சாப்பிடக் கூடாது
  rationale: எதிர்மறைச் சொல்லும் இரண்டாம் நபர் ஒருமை வினைவடிவமும் சட்டப்பூர்வத் தடையைத் தெரிவிக்கின்றன. ஆண்பால் ஒருமைப் பின்னொட்டைக் ‘அதை’ என்று தக்கவைத்துள்ளது.
- source_word: עַל הָאָרֶץ
  choice: தரையில்
  rationale: இச்சடங்கு வழிமுறையில் אֶרֶץ என்பது பூமி அல்லது நாடு என்பதைக் காட்டிலும் தரையின் மேற்பரப்பைக் குறிக்கிறது.
- source_word: תִּשְׁפְּכֶנּוּ
  choice: அதைத் தரையில் ஊற்றிவிட வேண்டும்
  rationale: שׁפך இங்கு இரத்தத்தை வெளியே ஊற்றும் செயலைக் குறிக்கிறது; ‘ஊற்றிவிட’ என்பது செயலும் முழுமையான அகற்றுதலும் இயல்பாக வெளிப்படச் செய்கிறது.
- source_word: כַּמָּיִם
  choice: தண்ணீரைப் போல
  rationale: ஒப்புமையைத் தெளிவாகவும் இயல்பான நவீன தமிழிலும் தக்கவைக்கிறது.
theological_decisions:
- issue: பின்னொட்டுப் பெயர்ச்சொல்லின் சுட்டுப்பொருள்
  choice: மூல எபிரெயத்தைப் போல முதன்மை உரையில் ‘அதை’ என்று வைத்து, அது இரத்தத்தைக் குறிப்பதை அடிக்குறிப்பில் தெளிவுபடுத்துதல்
  alternative: முதன்மை உரையிலேயே ‘இரத்தத்தை’ என்று வெளிப்படையாகச் சேர்த்தல்
  rationale: எபிரெய உரை பெயர்ச்சொல்லை மீண்டும் கூறாமல் சுட்டுப்பெயர் பின்னொட்டைப் பயன்படுத்துகிறது. ‘அதை’ என்பது மூல அமைப்பையும் சூழலிலுள்ள சுட்டுப்பொருளையும் தக்கவைக்கிறது; ‘இரத்தம்’ என்பதை உரைக்குள் சேர்ப்பது விளக்க விரிவாக்கமாகிவிடும்.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான, பொதுவாசகர்களுக்கு எளிதில் புரியும் தமிழ். ‘கூடாது’ மற்றும் ‘வேண்டும்’ ஆகியவை சட்டவழிமுறையின் தடை மற்றும் கட்டளையை இயல்பாக வெளிப்படுத்துகின்றன.
