base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/003.yaml
  text: You shall tear down their altars[a], shatter their sacred pillars, burn their Asherah poles with fire, cut down the carved images of their gods[c][b], and destroy their name from that place.
translation:
  language: ta
  text: அவர்களுடைய பலிபீடங்களை இடித்துப்போடுங்கள்; அவர்களுடைய வழிபாட்டுத் தூண்களை உடைத்துத் தகருங்கள்; அவர்களுடைய அசேரா கம்பங்களை[a] நெருப்பில் எரித்துவிடுங்கள்; அவர்களுடைய தெய்வங்களின் செதுக்கப்பட்ட உருவங்களை[b] வெட்டி அழித்துவிடுங்கள்; அந்த இடத்திலிருந்து அந்தத் தெய்வங்களின் பெயரை அழித்துவிடுங்கள்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அசேராக்கள்’ அல்லது ‘வழிபாட்டுக் கம்பங்கள்’ என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் அசேராவுடன் தொடர்புடைய வழிபாட்டுப் பொருட்களைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: ‘அவர்களுடைய விக்கிரகங்கள்’ என்றும் மொழிபெயர்க்கலாம். எபிரெய மொழியில், அந்த வழிபாட்டு உருவங்கள் செதுக்கி வடிவமைக்கப்பட்டவை என்பது வலியுறுத்தப்படுகிறது.
    reason: lexical_alternative
  - marker: c
    text: ‘பெயரை அழித்தல்’ என்பது அந்த வழிபாட்டு இடத்திலிருந்து அந்தத் தெய்வங்களின் நினைவையும் வழிபாட்டுடன் தொடர்புடைய இருப்பையும் அகற்றுவதைக் குறிக்கிறது.
    reason: cultural_note
lexical_decisions:
- source_word: נִתַּצְתֶּם אֶת מִזְבּחֹתָם
  choice: அவர்களுடைய பலிபீடங்களை இடித்துப்போடுங்கள்
  rationale: נתץ என்பது கட்டப்பட்ட அமைப்புகளை இடித்தழிப்பதைக் குறிக்கிறது. ‘இடித்துப்போடுங்கள்’ என்பது பலிபீடங்களுக்குப் பொருத்தமான, இயல்பான நவீனத் தமிழ்.
- source_word: וְשִׁבַּרְתֶּם אֶת מַצֵּבֹתָם
  choice: அவர்களுடைய வழிபாட்டுத் தூண்களை உடைத்துத் தகருங்கள்
  rationale: מַצֵּבָה என்பது வழிபாட்டுடன் தொடர்புடைய நிலைக்கல் அல்லது தூண். ‘வழிபாட்டுத் தூண்கள்’ அதன் சமயப் பயன்பாட்டைத் தெளிவாக்குகிறது; שבר-இன் வலிமையை ‘உடைத்துத் தகருங்கள்’ எடுத்துரைக்கிறது.
- source_word: וַאֲשֵׁרֵיהֶם
  choice: அவர்களுடைய அசேரா கம்பங்களை
  rationale: இந்தச் சொல் அசேராவுடன் தொடர்புடைய குறிப்பிட்ட வழிபாட்டுப் பொருட்களைக் குறிக்கிறது. ‘அசேரா கம்பங்கள்’ என்பது இதை பொதுவான தோப்பு அல்லது மரம் என்று மாற்றாமல் அதன் பண்பாட்டுச் சிறப்பைப் பாதுகாக்கிறது.
- source_word: תִּשְׂרְפוּן בָּאֵשׁ
  choice: நெருப்பில் எரித்துவிடுங்கள்
  rationale: ‘நெருப்பில்’ என்பது בָּאֵשׁ என்பதன் தெளிவான பொருளைக் காக்கிறது; ‘எரித்துவிடுங்கள்’ முழுமையான அழிப்பின் வலிமையை இயல்பான தமிழில் தருகிறது.
- source_word: וּפְסִילֵי אֱלֹהֵיהֶם
  choice: அவர்களுடைய தெய்வங்களின் செதுக்கப்பட்ட உருவங்களை
  rationale: פֶּסֶל என்பது மனிதனால் செதுக்கி உருவாக்கப்பட்ட வழிபாட்டு உருவம். ‘சிலைகள்’ அல்லது ‘விக்கிரகங்கள்’ என்பதைக் காட்டிலும், ‘செதுக்கப்பட்ட உருவங்கள்’ மூலச்சொல்லின் உருவாக்கப்பட்ட தன்மையை வெளிப்படையாகக் காக்கிறது.
- source_word: תְּגַדֵּעוּן
  choice: வெட்டிச் சாயுங்கள்
  rationale: גדע என்பது வெட்டி வீழ்த்துதல் அல்லது துண்டித்தல். கம்பம் போன்ற செதுக்கப்பட்ட வழிபாட்டுப் பொருட்களை அழிக்கும் இச்சூழலில் ‘வெட்டிச் சாயுங்கள்’ தெளிவாகவும் வலிமையாகவும் உள்ளது.
- source_word: וְאִבַּדְתֶּם אֶת שְׁמָם
  choice: அவற்றின் பெயரை அழித்துவிடுங்கள்
  rationale: אבד என்பதன் காரணவினை வடிவம் அழித்தல் அல்லது ஒழித்தல் என்று பொருள்படும். ‘பெயரை அழித்தல்’ என்ற எபிரெய மரபுத்தொடரை விளக்கமாக மாற்றாமல் முதன்மை உரையில் வைத்திருக்கிறது.
- source_word: מִן הַמָּקוֹם הַהוּא
  choice: அந்த இடத்திலிருந்து
  rationale: முன்னர் குறிப்பிடப்பட்ட வழிபாட்டு இடத்தைக் குறிக்கும் நேரடியான, இயல்பான மொழிபெயர்ப்பு.
theological_decisions:
- issue: אֲשֵׁרֵיהֶם என்பதன் சமயப் பொருள்
  choice: அசேரா கம்பங்கள்
  alternative: அசேராக்கள்; புனிதக் கம்பங்கள்; வழிபாட்டுக் கம்பங்கள்
  rationale: இந்தச் சொல் அசேரா தேவியுடன் தொடர்புடைய வழிபாட்டுப் பொருளைக் குறிக்கலாம். ‘அசேரா கம்பங்கள்’ அந்தத் தொடர்பைப் பாதுகாக்கிறது; அதேவேளையில் அவை தேவியே என்று தீர்மானித்துவிடுவதில்லை.
- issue: פְסִילֵי אֱלֹהֵיהֶם என்பதன் வடிவமைக்கப்பட்ட தன்மை
  choice: தெய்வங்களின் செதுக்கப்பட்ட உருவங்கள்
  alternative: விக்கிரகங்கள்; சிலைகள்
  rationale: மூலமொழி இந்த வழிபாட்டுப் பொருட்கள் செதுக்கி உருவாக்கப்பட்டவை என்பதை வலியுறுத்துகிறது. பொதுவான இறையியல் பெயர்ச்சொல்லால் அந்தக் குறிப்பைத் தட்டையாக்காமல் பாதுகாக்கப்பட்டுள்ளது.
- issue: ‘அவற்றின் பெயரை அழித்துவிடுங்கள்’ என்ற மரபுத்தொடரின் பொருள்
  choice: மூலமொழியின் ‘பெயரை அழித்தல்’ என்ற உருவகத்தை முதன்மை உரையில் காத்தல்
  alternative: அவற்றின் நினைவையும் வழிபாட்டு இருப்பையும் முற்றிலும் அகற்றுங்கள்
  rationale: ‘பெயர்’ என்பது அந்த இடத்தில் தெய்வங்களின் நினைவு, அழைப்பு, வழிபாட்டு இருப்பு ஆகியவற்றைக் குறிக்கக்கூடும். மூலத்தின் சுருக்கத்தையும் அதன் இயல்பான பலபொருள் வாய்ப்பையும் காக்க, விளக்கம் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், கட்டளையின் வலிமையைத் தக்கவைக்கும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘வழிபாட்டுத் தூண்கள்’ போன்ற சொற்கள் சாதாரண வாசகருக்குப் பொருளைத் தெளிவாக்குகின்றன; ‘அசேரா’ போன்ற பண்பாட்டுக்கே உரிய பெயர் பொதுப்படுத்தப்படாமல் அடிக்குறிப்புடன் வைக்கப்பட்டுள்ளது. ஒவ்வொரு அடிக்குறிப்பு குறியும் தொடர்புடைய சொல்லுக்குப் பின்னரே அமைக்கப்பட்டுள்ளது.
