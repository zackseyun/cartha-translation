review_pass:
  verdict: revise
  source_fidelity: The sequence of five imperatives and the cultic objects is accurately represented. However, ‘வெட்டிச் சாயுங்கள்’ (‘cut down and make fall’) presumes that the carved images were upright objects; גדע more broadly calls for cutting/hewing them down. ‘வெட்டி அழித்துவிடுங்கள்’ preserves the destructive force without adding that assumption. The final possessive is best tied explicitly to the immediately mentioned gods in Tamil.
  naturalness: The Tamil is clear, modern, and appropriately forceful. The revised wording is slightly more idiomatic for destroying carved cult images and removes a potentially unclear pronoun reference in the final clause.
  terminology: ‘பலிபீடங்கள்,’ ‘வழிபாட்டுத் தூண்கள்,’ ‘அசேரா கம்பங்கள்,’ and ‘செதுக்கப்பட்ட உருவங்கள்’ are suitable modern-standard Tamil terms. ‘அசேரா’ is correctly retained as a culturally specific designation, with a useful lexical note.
  issues:
  - severity: medium
    issue: ‘வெட்டிச் சாயுங்கள்’ for תְּגַדֵּעוּן
    rationale: ‘சாயுங்கள்’ specifically suggests causing an upright object to fall. Since ‘carved images’ need not be freestanding or upright, ‘வெட்டி அழித்துவிடுங்கள்’ better conveys גדע without adding a physical-detail assumption.
  - severity: low
    issue: ‘அவற்றின் பெயரை’ has an unclear antecedent
    rationale: In Tamil, ‘அவற்றின்’ can most immediately point to the carved images rather than the gods. ‘அந்தத் தெய்வங்களின் பெயரை’ makes the likely cultic referent clear while the footnote preserves the idiomatic sense.
