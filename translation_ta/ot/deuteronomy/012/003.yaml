revisions:
- from: அவர்களுடைய பலிபீடங்களை இடித்துப்போடுங்கள்; அவர்களுடைய வழிபாட்டுத் தூண்களை உடைத்துத் தகருங்கள்; அவர்களுடைய அசேரா கம்பங்களை[a] நெருப்பில் எரித்துவிடுங்கள்; அவர்களுடைய தெய்வங்களின் செதுக்கப்பட்ட உருவங்களை[b] வெட்டிச் சாயுங்கள்; அந்த இடத்திலிருந்து அவற்றின் பெயரை அழித்துவிடுங்கள்[c].
  to: அவர்களுடைய பலிபீடங்களை இடித்துப்போடுங்கள்; அவர்களுடைய வழிபாட்டுத் தூண்களை உடைத்துத் தகருங்கள்; அவர்களுடைய அசேரா கம்பங்களை[a] நெருப்பில் எரித்துவிடுங்கள்; அவர்களுடைய தெய்வங்களின் செதுக்கப்பட்ட உருவங்களை[b] வெட்டி அழித்துவிடுங்கள்; அந்த இடத்திலிருந்து அந்தத் தெய்வங்களின் பெயரை அழித்துவிடுங்கள்[c].
  rationale: The revision avoids implying that every carved image was an upright object and clarifies the referent of ‘their name’ in idiomatic Tamil. It retains the source’s imperative force, cultic terminology, and concise idiom, with the explanatory scope confined to the footnote.
