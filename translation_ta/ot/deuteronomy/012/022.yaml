base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/022.yaml
  text: But just as the gazelle and the deer are eaten[a], so you may eat it[b]; the unclean and the clean alike may eat it.
translation:
  language: ta
  text: ஆனால், கலைமானும் மானும் உண்ணப்படுவதுபோலவே, இதையும் நீங்கள் உண்ணலாம்; சடங்குமுறைப்படி தீட்டுள்ளவரும் தீட்டற்றவரும் ஒரேபோல இதை உண்ணலாம்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: கலைமான் என்பதற்கு ‘வெளிமான்’ என்றும், மான் என்பதற்கு ‘ஆண் மான்’ என்றும் மொழிபெயர்க்கலாம். இவ்விலங்குகளின் துல்லியமான இன அடையாளம் உறுதியானதல்ல. இங்கு ‘தீட்டுள்ளவர்’ மற்றும் ‘தீட்டற்றவர்’ என்பது சடங்குசார் நிலைகளைக் குறிக்கிறது.
    reason: lexical_alternative; cultural_note
lexical_decisions:
- source_word: אַךְ
  choice: ஆனால்
  rationale: முந்தைய கட்டளையை வரையறுக்கும் அல்லது அதனுடன் ஒரு தகுதிப்பாட்டை இணைக்கும் சொல்லாக இங்கு வருகிறது; நவீன தமிழில் ‘ஆனால்’ இயல்பாக அந்தத் தொடர்பைக் காட்டுகிறது.
- source_word: כַּאֲשֶׁר ... כֵּן
  choice: …போலவே …
  rationale: காட்டு விலங்குகளைச் சாப்பிடுவதற்கும் இங்கு குறிப்பிடப்படும் இறைச்சியைச் சாப்பிடுவதற்கும் இடையிலான ஒப்புமையைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: יֵאָכֵל
  choice: சாப்பிடுவதுபோலவே
  rationale: எபிரெயப் passive வடிவத்தின் பொதுவான உணர்வைத் தமிழ் இயல்புக்கேற்ற பொதுப்படையான வினைத்தொடராக வழங்குகிறது.
- source_word: הַצְּבִי
  choice: கலைமான்
  rationale: צְבִי குறிக்கும் gazelle வகைக் காட்டு விலங்கிற்கு நவீன தமிழில் புரிந்துகொள்ளத்தக்க இணைச்சொல்; இனத்தைக் குறித்த சிறிய நிச்சயமின்மை அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: הָאַיָּל
  choice: மான்
  rationale: אַיָּל என்பது மான், சில சூழல்களில் குறிப்பாக ஆண் மான்; ‘மான்’ தேவையற்ற பாலினக் குறிப்பைச் சேர்க்காமல் பொதுவாகத் துல்லியமாக உள்ளது.
- source_word: תֹּאכְלֶנּוּ
  choice: இதை நீங்கள் சாப்பிடலாம்
  rationale: சட்டச் சூழலில் imperfect அனுமதியைக் குறிக்கிறது; ‘சாப்பிடலாம்’ அந்தப் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: הַטָּמֵא
  choice: சடங்குமுறைப்படி தீட்டுள்ளவர்
  rationale: இது ஒழுக்கத் தீமையை அல்ல, சடங்குசார் நிலையைச் சுட்டுகிறது; தமிழில் தவறாகப் புரிந்துகொள்ளப்படாமல் இருக்க அந்த நுட்பம் வெளிப்படையாகக் கூறப்படுகிறது.
- source_word: הַטָּהוֹר
  choice: சடங்குமுறைப்படி தீட்டில்லாதவர்
  rationale: טָמֵא என்பதற்கான எதிர்நிலையான சடங்குசார் தூய நிலையைத் தெளிவாகவும் இணையாகவும் வழங்குகிறது.
- source_word: יַחְדָּו
  choice: ஒரேபோல
  rationale: இரு தரப்பினரும் ஒரே நேரத்தில் சேர்ந்து சாப்பிடுவதைவிட, இருவருக்கும் சமமாக அனுமதி உண்டு என்பதே இங்கு முக்கியம்.
- source_word: יֹאכְלֶנּוּ
  choice: இதைச் சாப்பிடலாம்
  rationale: முந்தைய வினையைப் போலவே சட்டரீதியான அனுமதியை வெளிப்படுத்துகிறது.
theological_decisions:
- issue: சடங்குசார் தூய்மை நிலையைக் குறிக்கும் சொற்கள்
  choice: சடங்குமுறைப்படி தீட்டுள்ளவரும் தீட்டில்லாதவரும்
  alternative: தீட்டுள்ளவரும் தூயவரும்
  rationale: இந்த எதிரிணை மனிதர்களின் ஒழுக்க குணத்தை அல்ல, சடங்குசார் நிலையைச் சுட்டுகிறது. தமிழில் ‘தீட்டு’ சமூகப் பாகுபாட்டு அர்த்தத்தையும் பெறக்கூடும் என்பதால், ‘சடங்குமுறைப்படி’ என்று வரையறுத்து வேதாகமச் சட்டச் சூழலைத் தெளிவாக்குகிறது.
translation_notes:
  register: நவீன தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் dignified நடையில் மொழிபெயர்க்கப்பட்டது. ‘உண்ணலாம்’ என்பதற்குப் பதிலாக தற்போதைய பொதுப் பயன்பாட்டிலுள்ள ‘சாப்பிடலாம்’ தேர்ந்தெடுக்கப்பட்டது. ‘தீட்டு’ என்ற சொல்லின் சமூகத் தவறுபுரிதலைத் தவிர்க்க ‘சடங்குமுறைப்படி’ வெளிப்படையாகச் சேர்க்கப்பட்டது.
