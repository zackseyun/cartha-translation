- from: ஆனால், கலைமானையும் மானையும் சாப்பிடுவதுபோலவே[a] இதையும் நீங்கள் சாப்பிடலாம்; சடங்குமுறைப்படி தீட்டுள்ளவரும் தீட்டில்லாதவரும் ஒரேபோல இதைச் சாப்பிடலாம்.[b]
  to: ஆனால், கலைமானும் மானும் உண்ணப்படுவதுபோலவே, இதையும் நீங்கள் உண்ணலாம்; சடங்குமுறைப்படி தீட்டுள்ளவரும் தீட்டற்றவரும் ஒரேபோல இதை உண்ணலாம்.[a]
  rationale: மூலத்தின் பொதுவான passive ஒப்புமையைத் தமிழில் வெளிப்படுத்த ‘உண்ணப்படுவதுபோலவே’ என மாற்றப்பட்டுள்ளது. சட்டநடைக்கு ஏற்ற மரியாதையான ‘உண்ணலாம்’ பயன்படுத்தப்பட்டுள்ளது. சடங்குசார் தூய்மை/தீட்டு குறித்த விளக்கமும், விலங்குப் பெயர்களின் மாற்று அடையாளமும் ஒரே அடிக்குறிப்பில் வழங்கப்பட்டதால், உள்ளடக்க அர்த்தம் மாறாமல் வாசக ஓட்டம் எளிமையாகிறது.
