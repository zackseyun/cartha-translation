  source_fidelity: முதன்மை வாசகம் பொருளைச் சரியாகக் கொண்டுசெல்கிறது. எனினும் יֵאָכֵל என்பது ‘உண்ணப்படுவது’ என்ற பொதுவான passive வடிவம்; ‘சாப்பிடுவதுபோல’ என்பது செய்பவர் குறிப்பிடப்படாத பொதுவழக்காகப் புரிந்துகொள்ளப்பட்டாலும், passive ஒப்புமையைத் தெளிவாகக் காட்டலாம். יַחְדָּו இங்கு இரு சடங்குசார் நிலைகளுக்கும் சமமான அனுமதியைக் குறிக்கிறது; ‘ஒரேபோல’ அதற்கு ஏற்றது.
