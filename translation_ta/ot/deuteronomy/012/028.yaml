base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/028.yaml
  text: Be careful to listen to all these words that I am commanding you[a], so that it may go well with you and with your children after you forever[b], because you will do what is good and right in the eyes of Yahweh your God.
translation:
  language: ta
  text: 'நான் உனக்குக் கட்டளையிடுகிற இந்த வார்த்தைகள் அனைத்தையும் கவனமாகக் கேட்டு கடைப்பிடி[a]. அப்போது உனக்கும் உனக்குப் பின் உன் பிள்ளைகளுக்கும்[b] என்றென்றும் நன்மை உண்டாகும்; ஏனெனில் உன் கடவுளாகிய யாவேவின் பார்வையில் நல்லதும் நேர்மையானதுமானதை நீ செய்வாய்.


    [a] எபிரெய மொழியைச் சொற்சொல்லாக மொழிபெயர்த்தால், “காத்து, கேள்” எனலாம். இங்கு கவனமாகக் கேட்பதோடு அதன்படி நடப்பதும் உட்பொருளாக உள்ளது.

    [b] எபிரெய மொழியில் “மகன்கள்”; இங்கு அது பிள்ளைகள் அல்லது வழிவந்தோர் என்ற விரிவான பொருளில் பயன்படுத்தப்பட்டுள்ளது.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மொழியைச் சொற்சொல்லாக மொழிபெயர்த்தால், “காத்து, கேள்” எனலாம். இங்கு கவனமாகக் கேட்பதோடு அதன்படி நடப்பதும் உட்பொருளாக உள்ளது.
    reason: lexical_alternative
  - marker: b
    text: எபிரெய மொழியில் “மகன்கள்”; இங்கு அது பிள்ளைகள் அல்லது வழிவந்தோர் என்ற விரிவான பொருளில் பயன்படுத்தப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁמֹר וְשָׁמַעְתָּ
  choice: கவனமாகக் கேட்டு கடைப்பிடி
  rationale: இரு எபிரெய வினைகளின் கவனித்துக் காத்தல் மற்றும் செவிகொடுத்தல் ஆகிய கருத்துகளை இயல்பான தமிழில் இணைக்கிறது; சூழலில் உள்ள கீழ்ப்படிதலையும் வெளிப்படுத்துகிறது.
- source_word: כָּל הַדְּבָרִים הָאֵלֶּה
  choice: இந்த வார்த்தைகள் அனைத்தையும்
  rationale: דברים என்பதன் நேரடியான ‘வார்த்தைகள்’ என்ற பொருளைப் பேணி, மோசே உரைத்த கட்டளைகளைக் குறிக்கிறது.
- source_word: מְצַוֶּךָּ
  choice: நான் உனக்குக் கட்டளையிடுகிற
  rationale: நிகழ்காலத்தில் வழங்கப்படும் கட்டளையின் தொடர்ச்சியான அல்லது உடனடி தன்மையை இயல்பான தமிழில் காட்டுகிறது.
- source_word: לְמַעַן יִיטַב לְךָ
  choice: அப்போது உனக்கு ... நன்மை உண்டாகும்
  rationale: நோக்கம் அல்லது விளைவைக் குறிக்கும் உடன்படிக்கைச் சொற்றொடரைத் தெளிவான நவீன தமிழில் வழங்குகிறது.
- source_word: וּלְבָנֶיךָ אַחֲרֶיךָ
  choice: உனக்குப் பின் உன் பிள்ளைகளுக்கும்
  rationale: குடும்ப வழிவந்தோரைக் குறிக்கும் உடன்படிக்கைச் சூழலில் בנים என்பதை ஆண் மக்களுக்கு மட்டும் சுருக்காமல் ‘பிள்ளைகள்’ என வழங்குகிறது.
- source_word: עַד עוֹלָם
  choice: என்றென்றும்
  rationale: வரையறுக்கப்படாத நீடித்த எதிர்காலத்தைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: כִּי תַעֲשֶׂה
  choice: ஏனெனில் ... நீ செய்வாய்
  rationale: כִּי என்பதன் காரணத் தொடர்பையும், imperfect வினையின் எதிர்கால நுணுக்கத்தையும் வெளிப்படையாகப் பேணுகிறது.
- source_word: הַטּוֹב וְהַיָּשָׁר
  choice: நல்லதும் நேர்மையானதுமானதை
  rationale: பெயர்ச்சொல் தன்மையில் செயல்படும் இரு பெயரடைகளையும் இயல்பான தமிழில் ஒழுக்க மதிப்பீடுகளாகப் பேணுகிறது.
- source_word: בְּעֵינֵי יְהוָה
  choice: யாவேவின் பார்வையில்
  rationale: தெய்வீக மதிப்பீட்டைக் குறிக்கும் ‘கண்களில்’ என்ற எபிரெய உருவகத்தை தமிழில் வழக்கமான ‘பார்வையில்’ எனத் தருகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: திருப்பெயரை ஒரு பொதுப் பட்டத்தால் மாற்றாமல், எபிரெய நான்கெழுத்துத் தெய்வப் பெயரின் ஏற்ற ஒலிபெயர்ப்பாக வழங்குகிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வப் பெயரின் மொழியாக்கம்
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலத்தில் தனிப்பட்ட உடன்படிக்கைப் பெயர் நேரடியாக இருப்பதால், அதை ஒரு பட்டமாக மாற்றாமல் ஒலிபெயர்க்கிறது.
- issue: בָנֶיךָ என்பதன் பரப்பு
  choice: பிள்ளைகள்
  alternative: மகன்கள் / வழிவந்தோர்
  rationale: வடிவில் ஆண்பால் பன்மை இருந்தாலும், இங்குள்ள உடன்படிக்கை வாக்குறுதிச் சூழல் ஒருவரின் சந்ததியை விரிவாகக் குறிக்கிறது; அடிக்குறிப்பு நேரடி வடிவைத் தெரிவிக்கிறது.
- issue: כִּי תַעֲשֶׂה என்பதிலுள்ள காரணமும் எதிர்காலமும்
  choice: ஏனெனில் ... நீ செய்வாய்
  alternative: நீ செய்வதால் / நீ செய்தால்
  rationale: மூலத்தின் காரணத் தொடர்பையும் எதிர்கால வினை நுணுக்கத்தையும் தீர்த்துவிடாமல் பேணுகிறது; நிபந்தனை என வெளிப்படையாக மாற்றவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் அதேவேளையில் திருவிவிலிய உரைக்கேற்ற கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ஒருமை இரண்டாம் நபர் வடிவங்கள் மூலத்தின் இலக்கண எண்ணைப் பேணுகின்றன; எபிரெய வாக்கியத்தின் காரணவியல் மற்றும் எதிர்காலத் திணறல் விளக்கமாக மாற்றப்படாமல் விடப்பட்டுள்ளது.
