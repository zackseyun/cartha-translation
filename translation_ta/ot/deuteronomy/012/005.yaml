source:
  edition: WLC
  text: כִּ֠י אִֽם אֶל הַ/מָּק֞וֹם אֲשֶׁר יִבְחַ֨ר יְהוָ֤ה אֱלֹֽהֵי/כֶם֙ מִ/כָּל שִׁבְטֵי/כֶ֔ם לָ/שׂ֥וּם אֶת שְׁמ֖/וֹ שָׁ֑ם לְ/שִׁכְנ֥/וֹ תִדְרְשׁ֖וּ וּ/בָ֥אתָ שָֽׁמָּ/ה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/005.yaml
  text: But to the place that Yahweh your God will choose from all your tribes to put his name there[a], for his dwelling, you shall seek, and there you shall go.
translation:
  language: ta
  text: ஆனால், உங்கள் எல்லாக் கோத்திரங்களிலிருந்தும் உங்கள் கடவுளாகிய யாவே தமது பெயரை அங்கே வைப்பதற்காகத் தேர்ந்தெடுக்கும் இடத்தையே—அவரது உறைவிடமாக[a]—நீங்கள் நாடி, அங்கே செல்ல வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தமது பெயரை அங்கே தமது உறைவிடத்திற்காக வைப்பதற்காக.” இங்குள்ள எபிரெயத் தொடர் சுருக்கமாக இருப்பதால், கடவுள் உறைவதையா, அந்த இடம் அவரது உறைவிடமாவதையா, அல்லது இரண்டையுமா வலியுறுத்துகிறது என்பதில் மொழிபெயர்ப்புகள் வேறுபடுகின்றன.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי אִם
  choice: ஆனால் ... இடத்தையே
  rationale: முந்தைய தடைக்கு மாறான நேர்மறை மாற்றை அறிமுகப்படுத்தும் எதிர்மறைத் தொடர்பைத் தமிழில் இயல்பாகக் காட்டுகிறது; ‘-ஏ’ தெரிவின் தனித்தன்மையை வலியுறுத்துகிறது.
- source_word: הַמָּקוֹם
  choice: இடம்
  rationale: கடவுள் தேர்ந்தெடுக்கவிருக்கும், இன்னும் குறிப்பிடப்படாத உறுதியான இடத்தை எளிய நவீன தமிழில் குறிக்கிறது.
- source_word: יִבְחַר
  choice: தேர்ந்தெடுக்கும்
  rationale: எபிரெய வினையின் எதிர்கால நோக்கைச் சூழல் தெளிவாக்குவதால், தமிழில் இயல்பான தொடர்பெயர் வடிவம் பயன்படுத்தப்பட்டுள்ளது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் பரவலாகப் புரிந்துகொள்ளப்படும் ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: אֱלֹהֵיכֶם
  choice: உங்கள் கடவுள்
  rationale: இரண்டாம் நபர் பன்மை உடைமைத் தொடர்பை நேரடியாகப் பாதுகாக்கிறது.
- source_word: מִכָּל שִׁבְטֵיכֶם
  choice: உங்கள் எல்லாக் கோத்திரங்களிலிருந்தும்
  rationale: இஸ்ரவேலின் கோத்திரங்களுக்குள் இருந்து இடம் தெரிவுசெய்யப்படுவதை மூலத்தின் מִן உறவோடு பாதுகாக்கிறது.
- source_word: לָשׂוּם אֶת־שְׁמוֹ שָׁם
  choice: தமது பெயரை அங்கே நிலைநிறுத்துவதற்காக
  rationale: ‘பெயரை வைப்பது’ என்ற எபிரெய மரபுத்தொடரை சொற்பொருள் குழப்பமின்றி, அங்கீகரிக்கப்பட்ட தெய்வீக முன்னிலையின் கருத்தை மிகைப்படுத்தாமல் இயல்பான தமிழில் தருகிறது.
- source_word: לְשִׁכְנוֹ
  choice: அவரது உறைவிடமாக
  rationale: சுருக்கமான எபிரெய அமைப்பை வேண்டுமென்றே முழுமையாகத் தீர்மானிக்காமல், இடத்தையும் தெய்வீக உறைவையும் இணைக்கிறது; மாற்று தொடரமைப்பு அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: תִדְרְשׁוּ
  choice: நீங்கள் நாடி
  rationale: சரியான வழிபாட்டு இடத்தைத் தேடி அணுகும் பொருளைக் கொண்ட דרש என்பதற்கு இயல்பான, கண்ணியமான தமிழ்.
- source_word: וּבָאתָ שָׁמָּה
  choice: அங்கே செல்ல வேண்டும்
  rationale: בוא என்பதன் இயக்கத்தை இலக்கு நோக்கிச் செல்லுதல் என இயல்பான தமிழில் தருகிறது; שָׁמָּה என்பதன் ‘அங்கே’ பாதுகாக்கப்படுகிறது.
theological_decisions:
- issue: தெய்வீகப் பெயர்
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: יהוה என்பது தனிப்பெயர் என்பதால் அதை பட்டமாக மாற்றாமல் ஒலிபெயர்க்கிறது.
- issue: பெயரும் உறைவிடமும் குறித்த மைய வழிபாட்டிட மொழி
  choice: தமது பெயரை அங்கே நிலைநிறுத்துவதற்காக ... அவரது உறைவிடமாக
  alternative: தமது பெயரைத் தமது உறைவிடமாக அங்கே நிலைநிறுத்துவதற்காக
  rationale: வசனம் கடவுளின் பெயரும் உறைவும் தேர்ந்தெடுக்கப்பட்ட இடத்தோடு தொடர்புடையவை எனக் கூறுகிறது. எபிரெய தொடரின் இலக்கணச் சுருக்கத்தால் இவற்றின் துல்லியமான தொடர்பு தெளிவற்றிருப்பதை முதன்மை உரையும் அடிக்குறிப்பும் பாதுகாக்கின்றன; பிற்கால ஆலயக் கோட்பாடுகள் சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும் வகையில் எளிமையும், வேதாகம உரைக்கு ஏற்ற கண்ணியமும் பேணப்பட்டுள்ளன. ‘கோத்திரம்’, ‘உறைவிடம்’ போன்ற சொற்கள் சூழலின் வரலாற்று மற்றும் வழிபாட்டு தன்மையைத் துல்லியமாக வைத்திருக்கின்றன.
