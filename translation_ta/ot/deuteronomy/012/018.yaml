base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/018.yaml
  text: Instead[b][a], you shall eat it before Yahweh your God in the place that Yahweh your God will choose—you and your son and your daughter and your male servant and your female servant and the Levite who is within your gates—and you shall rejoice before Yahweh your God in all to which you put your hand.
translation:
  language: ta
  text: மாறாக, உங்கள் கடவுளாகிய யாவேயின் முன்னிலையில், உங்கள் கடவுளாகிய யாவே தேர்ந்தெடுக்கும் இடத்தில், நீங்களும் உங்கள் மகனும் உங்கள் மகளும் உங்கள் ஆண் பணியாளரும் உங்கள் பெண் பணியாளரும் உங்கள் ஊரில் வாழும் லேவியனும்[a] அதை உண்ண வேண்டும்; உங்கள் கடவுளாகிய யாவேயின் முன்னிலையில், நீங்கள் மேற்கொள்ளும் எல்லாவற்றிலும்[b] மகிழ வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், ‘உங்கள் வாசல்களுக்குள்’ என்பது உங்கள் உள்ளூர் சமூகத்தில் அல்லது ஊரில் வாழ்பவர்களைக் குறிக்கும் மரபுத்தொடர்.
    reason: cultural_note
  - marker: b
    text: எபிரெயத்தில், சொல்லுக்கு சொல் ‘உங்கள் கையின் அனுப்புதல் அனைத்திலும்’; அதாவது நீங்கள் செய்யும் அல்லது மேற்கொள்ளும் அனைத்திலும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  choice: மாறாக
  rationale: முந்தைய வசனத்தின் தடைக்கு எதிராக அனுமதிக்கப்பட்ட ஒரே மாற்றை அறிமுகப்படுத்தும் கட்டுப்படுத்தும் எதிர்மறைப் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: לִפְנֵי יְהוָה אֱלֹהֶיךָ
  choice: உங்கள் கடவுளாகிய யெகோவாவின் முன்னிலையில்
  rationale: לִפְנֵי என்பதன் ‘முன்னிலையில்/சந்நிதியில்’ என்ற பொருளைத் தெளிவாகக் காக்கிறது; יהוה என்பது தனிப்பெயராக ‘யெகோவா’ என ஒலிபெயர்க்கப்படுகிறது.
- source_word: תֹּאכְלֶנּוּ
  choice: அதை உண்ண வேண்டும்
  rationale: இரண்டாம் நபர் ஒருமை ஆண்பால் கட்டளைத் தன்மையையும், முன்பு குறிப்பிடப்பட்ட ஒன்றைக் குறிக்கும் ஒருமை பின்னொட்டையும் காக்கிறது.
- source_word: בַּמָּקוֹם אֲשֶׁר יִבְחַר ... בּוֹ
  choice: தேர்ந்தெடுக்கும் இடத்தில்
  rationale: உபாகமத்தில் திரும்பத் திரும்ப வரும் தேர்ந்தெடுக்கப்பட்ட வழிபாட்டு இடத்தைக் குறிக்கும் மொழியை இயல்பான தமிழில் தருகிறது; בּוֹ குறிக்கும் இடப்பொருள் இதில் உள்ளடங்குகிறது.
- source_word: וְעַבְדְּךָ וַאֲמָתֶךָ
  choice: உங்கள் ஆண் பணியாளரும் உங்கள் பெண் பணியாளரும்
  rationale: எபிரெயச் சொற்களில் உள்ள ஆண்–பெண் வேறுபாட்டை நவீன, மரியாதையான மொழியில் வெளிப்படுத்துகிறது.
- source_word: וְהַלֵּוִי אֲשֶׁר בִּשְׁעָרֶיךָ
  choice: உங்கள் ஊர்களில் வாழும் லேவியரும்
  rationale: ‘உங்கள் வாசல்களுக்குள்’ என்ற எபிரெயக் குடியியல் மரபுத்தொடரின் பொருள், ஒருவரின் உள்ளூர் ஊர்கள் அல்லது சமூகத்தில் வாழ்வது என்பதால் தமிழில் நேரடியாகப் புரியும் வகையில் தரப்படுகிறது.
- source_word: וְשָׂמַחְתָּ
  choice: மகிழ வேண்டும்
  rationale: உடன்படிக்கை வழிபாட்டின் கொண்டாட்டமிக்க மகிழ்ச்சியைத் தருகிறது; தமிழில் கட்டளைத் தன்மையும் இயல்பாக அமைகிறது.
- source_word: בְּכֹל מִשְׁלַח יָדֶךָ
  choice: நீங்கள் மேற்கொள்ளும் எல்லாவற்றிலும்
  rationale: சொல்லுக்கு சொல் ‘உங்கள் கையின் அனுப்புதல் அனைத்திலும்’ என்ற மரபுத்தொடரின் செயல்/முயற்சி சார்ந்த பொருளை தெளிவான தமிழில் அளிக்கிறது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யெகோவா
  alternative: யாவே
  rationale: மெய்யெழுத்துத் தொகுப்பை ஒரு பொதுப்பட்டமாக மாற்றாமல் தனிப்பட்ட உடன்படிக்கைப் பெயராகப் பாதுகாக்கிறது. தமிழில் பரவலாக அறியப்படும் ஒலிபெயர்ப்பான ‘யெகோவா’ தேர்ந்தெடுக்கப்பட்டது; மூல உச்சரிப்பு உறுதியற்றது என்பதால் மாற்று வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் மதிப்புமிக்க உரைநடை. எபிரெய இரண்டாம் நபர் ஒருமை வடிவம் தமிழின் மரியாதைப் பயன்பாட்டில் ‘நீங்கள்/உங்கள்’ எனத் தரப்பட்டுள்ளது. ‘வாசல்களுக்குள்’ என்ற மரபுத்தொடர் பொருள்வழியாக ‘ஊர்களில் வாழும்’ என மொழிபெயர்க்கப்பட்டுள்ளது.
