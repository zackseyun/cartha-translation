base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/015.yaml
  text: But whenever your soul desires[a], you may slaughter and eat meat, according to the blessing of Yahweh your God that he has given you, within all your gates. The unclean and the clean alike may eat it[b], as they would the gazelle or the deer.
translation:
  language: ta
  text: 15 ஆனால், உன் உள்ளம் விரும்பும்போதெல்லாம்[a], உன் கடவுளாகிய யாவே உனக்கு அளித்த ஆசீர்வாதத்திற்கேற்ப, உன் எல்லா நகரங்களிலும்[b] நீ அறுத்து இறைச்சி உண்ணலாம். தீட்டுள்ளவனும் தீட்டில்லாதவனும் கலைமான் அல்லது மானின் இறைச்சியை உண்பதுபோல அதை உண்ணலாம்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், ‘உன் உயிரின் விருப்பமெல்லாம்’; அதாவது, நீ விரும்பும்போதெல்லாம்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில், ‘உன் வாசல்கள் அனைத்திலும்.’ ‘வாசல்கள்’ என்பது இங்கு நகரங்கள் அல்லது குடியிருப்புகளைக் குறிக்கும் மரபுத்தொடர்.
    reason: cultural_note
lexical_decisions:
- source_word: רַק
  choice: ஆனால்
  rationale: முந்தைய கட்டளைக்கான வரம்பையோ தளர்வையோ அறிமுகப்படுத்தும் எதிர்மறைத் தொடர்பை இயல்பான தமிழில் காட்டுகிறது.
- source_word: בְּכָל אַוַּת נַפְשְׁךָ
  choice: உன் உள்ளம் விரும்பும்போதெல்லாம்
  rationale: சொல்லர்த்தமான ‘உன் உயிரின் விருப்பமெல்லாம்’ என்ற எபிரெயப் பேச்சுவழக்கை, அதன் பொருளான விருப்பம் ஏற்படும் ஒவ்வொரு வேளையையும் தெளிவாகக் கூறும் நவீன தமிழில் தருகிறது; சொல்லர்த்தம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: תִּזְבַּח
  choice: நீ விலங்குகளை அறுத்து
  rationale: இங்கு பலிக்கான தொழில்நுட்பச் சொல்லாக அல்லாமல் உணவுக்காக விலங்கைக் கொன்று தயார் செய்வதைக் குறிக்கிறது; சூழலில் இது அனுமதியாக இருப்பதால் ‘உண்ணலாம்’ என்பதோடு இணைக்கப்பட்டுள்ளது.
- source_word: וְאָכַלְתָּ בָשָׂר
  choice: இறைச்சி உண்ணலாம்
  rationale: בָשָׂר இங்கு உணவாகிய விலங்கின் சதையைக் குறிக்கும்; ‘இறைச்சி’ தெளிவான நவீனத் தமிழ்.
- source_word: כְּבִרְכַּת יְהוָה אֱלֹהֶיךָ אֲשֶׁר נָתַן לְךָ
  choice: உன் கடவுளாகிய யாவே உனக்கு அளித்த ஆசீர்வாதத்திற்கேற்ப
  rationale: ஒப்புமையைக் குறிக்கும் כְּ மற்றும் ‘ஆசீர்வாதம்’ என்ற பெயர்ச்சொல் அமைப்பைப் பாதுகாத்து, கடவுள் அளித்த வளவசதிக்கேற்ப உண்ணலாம் என்ற பொருளைத் தருகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய மூலத்திலுள்ள கடவுளின் தனிப்பெயரைத் தமிழில் நேரடியாக ஒலிபெயர்க்கிறது.
- source_word: בְּכָל שְׁעָרֶיךָ
  choice: உன் குடியிருப்புகள் அனைத்திலும்
  rationale: சொல்லர்த்தமாக ‘உன் எல்லா வாசல்களிலும்’ என்றாலும், ‘வாசல்கள்’ என்பது நகரங்கள் அல்லது குடியிருப்புகளைக் குறிக்கும் எபிரெய மரபுத்தொடர்; தமிழில் நோக்குப் பொருள் நேரடியாக வழங்கப்படுகிறது.
- source_word: הַטָּמֵא וְהַטָּהוֹר
  choice: தீட்டுள்ளவனும் தீட்டில்லாதவனும்
  rationale: இவை ஒழுக்கநிலையை அல்ல, சடங்குசார் தூய்மை நிலையைக் குறிக்கின்றன. ‘-உம் ... -உம்’ அமைப்பு இரு தரப்பினருக்கும் ஒரே அனுமதி இருப்பதைக் காட்டுகிறது.
- source_word: יֹאכְלֶנּוּ
  choice: அதை உண்ணலாம்
  rationale: சூழலில் இது அனுமதியைக் குறிக்கிறது; ‘அதை’ என்பது அறுக்கப்பட்ட விலங்கின் இறைச்சியைச் சுட்டுகிறது.
- source_word: כַּצְּבִי וְכָאַיָּל
  choice: கலைமானையும் மானையும் உண்பதுபோல
  rationale: இரு காட்டு விலங்குகளின் இறைச்சியை உண்பதுடன் செய்யப்படும் ஒப்புமையை, மூலத்தில் வெளிப்படையாக இல்லாத செயலைத் தமிழில் இயல்பாக நிறைவு செய்து தெளிவாக்குகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூலத்தில் நான்கு எழுத்துகளைக் கொண்ட இறைத்தனிப்பெயர் நேரடியாக உள்ளது; பொதுப்பட்டமான ‘ஆண்டவர்’ என்பதற்குப் பதிலாக அந்த உடன்படிக்கைப் பெயரைப் பாதுகாக்கிறது.
- issue: הַטָּמֵא וְהַטָּהוֹר என்பதன் பொருள்
  choice: தீட்டுள்ளவனும் தீட்டில்லாதவனும்
  alternative: அசுத்தமானவனும் சுத்தமானவனும்
  rationale: இந்த இணைச்சொற்கள் ஒழுக்கத் தீர்ப்பை அல்ல, சடங்குசார் நிலையைச் சுட்டுகின்றன; ‘தீட்டு’ என்ற சொல் அந்த வேறுபாட்டைத் தமிழில் தெளிவாக உணர்த்துகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிதில் புரியும், கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘புசி’ போன்ற பழைய சொற்களுக்குப் பதிலாக ‘உண்’ என்றும், சடங்குசார் வேறுபாட்டைக் காட்ட ‘தீட்டுள்ளவன்/தீட்டில்லாதவன்’ என்றும் வழங்கப்பட்டுள்ளது. ஒருமை இரண்டாம் நபர் வடிவங்கள் மூலத்தைப் பின்பற்றுகின்றன.
