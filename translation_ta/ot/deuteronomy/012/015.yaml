  to: 15 ஆனால், உன் உள்ளம் விரும்பும்போதெல்லாம்[a], உன் கடவுளாகிய யாவே உனக்கு அளித்த ஆசீர்வாதத்திற்கேற்ப, உன் எல்லா நகரங்களிலும்[b] நீ அறுத்து இறைச்சி உண்ணலாம். தீட்டுள்ளவனும் தீட்டில்லாதவனும் கலைமான் அல்லது மானின் இறைச்சியை உண்பதுபோல அதை உண்ணலாம்.
