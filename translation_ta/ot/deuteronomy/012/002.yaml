source:
  edition: WLC
  text: אַבֵּ֣ד תְּ֠אַבְּדוּ/ן אֶֽת כָּל הַ/מְּקֹמ֞וֹת אֲשֶׁ֧ר עָֽבְדוּ שָׁ֣ם הַ/גּוֹיִ֗ם אֲשֶׁ֥ר אַתֶּ֛ם יֹרְשִׁ֥ים אֹתָ֖/ם אֶת אֱלֹהֵי/הֶ֑ם עַל הֶ/הָרִ֤ים הָֽ/רָמִים֙ וְ/עַל הַ/גְּבָע֔וֹת וְ/תַ֖חַת כָּל עֵ֥ץ רַעֲנָן־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/002.yaml
  text: You must surely destroy all the places where the nations whom you are dispossessing served their gods[a], on the high mountains, on the hills, and under every green tree.
translation:
  language: ta
  text: நீங்கள் அகற்றுகிற மக்களினங்கள் உயர்ந்த மலைகளிலும், குன்றுகளிலும், பசுமையான ஒவ்வொரு மரத்தின் கீழும் தங்கள் தெய்வங்களை வழிபட்ட[a] எல்லா இடங்களையும் முற்றிலும் அழித்துவிட வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அங்கே தங்கள் தெய்வங்களுக்குச் சேவை செய்த.” எபிரெய வினைச்சொல் தெய்வங்களைப் பொருளாகக் கொள்ளும்போது, சமய வழிபாட்டின் பொருளில் “சேவை செய்தல்” என்றும் பொருள்படும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַבֵּד תְּאַבְּדוּן
  choice: முற்றிலும் அழித்துவிட வேண்டும்
  rationale: வினையெச்சப் பெயருடன் அதே வினை சேர்ந்து கட்டளையை வலியுறுத்துகிறது. ‘முற்றிலும் அழித்துவிட வேண்டும்’ என்பது அந்த வலியுறுத்தலை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: הַמְּקֹמוֹת
  choice: எல்லா இடங்களையும்
  rationale: இங்கு வழிபாட்டுடன் தொடர்புடைய நிலையான இடங்கள் குறிக்கப்படுகின்றன. ‘இடங்கள்’ என்பது நேரடியானதும் பொதுவாசகர்களுக்கு எளிதானதும் ஆகும்.
- source_word: עָבְדוּ שָׁם
  choice: வழிபட்ட
  rationale: தெய்வங்களைப் பொருளாகக் கொள்ளும்போது עבד என்பது பணிசெய்தல் அல்லது சமய வழிபாடு செய்தல் எனப் பொருள்படும். சூழலில் ‘வழிபட்ட’ என்பது தெளிவான, இயல்பான தமிழாக்கம்; அடிப்படை ‘பணிசெய்த’ பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: הַגּוֹיִם
  choice: இனத்தார்
  rationale: கானான் நாட்டில் வாழ்ந்த இஸ்ரவேலரல்லாத மக்கள் இனங்களை இச்சொல் குறிக்கிறது. ‘இனத்தார்’ என்பது பிற்காலச் சமயப் பயன்பாடுகளைச் சேர்க்காமல் பொருளைத் தருகிறது.
- source_word: אֲשֶׁר אַתֶּם יֹרְשִׁים אֹתָם
  choice: நீங்கள் நாட்டை உரிமையாக்கும்போது அங்கிருந்து அகற்றப்போகிற
  rationale: ירשׁ இங்கு முந்தைய குடியிருப்போரை அகற்றி நாட்டை உடைமையாக்கும் இரு தொடர்புடைய கருத்துகளையும் கொண்டுள்ளது. இயல்பான தமிழுக்காக அவை தெளிவாக வெளிப்படுத்தப்பட்டுள்ளன.
- source_word: אֱלֹהֵיהֶם
  choice: தங்கள் தெய்வங்களை
  rationale: பன்மை உடைமைப்பொருளை நேரடியாகத் தருகிறது; தமிழில் எழுவாயைக் குறிப்பதற்கு ‘தங்கள்’ இயல்பாக உள்ளது.
- source_word: עַל הֶהָרִים הָרָמִים
  choice: உயர்ந்த மலைகளின்மேலும்
  rationale: பெயர்ச்சொல் மற்றும் அதன் பெயரடை இரண்டையும் நேரடியாகப் பிரதிபலிக்கிறது.
- source_word: הַגְּבָעוֹת
  choice: குன்றுகளின்மேலும்
  rationale: גבעות என்பதற்கான இயல்பான தமிழ்ச் சொல் ‘குன்றுகள்’; ‘மேல்’ என்ற இடைச்சொல் உயர்ந்த வழிபாட்டு இடங்களைக் காட்டுகிறது.
- source_word: תַּחַת כָּל עֵץ רַעֲנָן
  choice: பசுமையான ஒவ்வொரு மரத்தின் கீழும்
  rationale: רַעֲנָן செழிப்பான, புத்தம்புதிய பசுமையுள்ள இலைகளைக் குறிக்கிறது. ‘பசுமையான’ என்பது உருவகத்தை இயல்பாகத் தக்கவைக்கிறது.
theological_decisions:
- issue: அழிக்கும்படி கட்டளையிடப்பட்டதன் தன்மை
  choice: அந்நிய தெய்வ வழிபாட்டுடன் தொடர்புடைய இடங்களையே வசனம் நேரடியாக அழிக்கச் சொல்கிறது.
  alternative: அந்நிய வழிபாட்டு முறைகளையே பொதுவாக ஒழிக்கச் சொல்வதாக விரித்துரைக்கலாம்.
  rationale: எபிரெய உரையில் கட்டளையின் நேரடிப் பொருள் ‘எல்லா இடங்களும்’ என்பதே; வழிபாட்டு முறைகள் நேரடிப் பொருளாக இல்லை. ஆகவே concrete focus பாதுகாக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் வேதவசனத்திற்கேற்ற கண்ணியமான நடையிலும் மொழிபெயர்க்கப்பட்டுள்ளது. இடங்களின் பட்டியல் நீண்ட வாக்கியத்தில் தெளிவாக இணைவதற்காக முடிவில் ‘அந்த இடங்களை அழித்துவிட வேண்டும்’ என மீண்டும் குறிப்பிடப்பட்டுள்ளது.
