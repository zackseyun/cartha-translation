base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/006.yaml
  text: And there you shall bring your burnt offerings[a], your sacrifices, your tithes, the contribution of your hand, your vow offerings, your freewill offerings[b], and the firstborn of your herd and of your flock.
translation:
  language: ta
  text: அங்கே உங்கள் தகனபலிகளையும், பலிகளையும், பத்திலொரு பங்குகளையும், உங்கள் கையால் அளிக்கும் காணிக்கையையும்,[a] நேர்த்திக்கடன் காணிக்கைகளையும்,[b] விருப்பக் காணிக்கைகளையும், உங்கள் மாட்டு மந்தையிலும் ஆட்டு மந்தையிலும் பிறந்த முதற்பேறுகளையும் கொண்டுவர வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உங்கள் காணிக்கை” அல்லது “உங்கள் கையின் பங்களிப்பு.” எபிரெயச் சொற்றொடரில் “கை” என்பது நேரடியாக இடம்பெற்று, ஒருவர் தாமே அளிப்பதை வலியுறுத்துகிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “உங்கள் நேர்த்திக்கடன்கள்.” இந்தப் பட்டியலின் சூழலில், நேர்த்திக்கடன்களை நிறைவேற்றுவதற்காக அளிக்கப்படும் காணிக்கைகள் எனப் பொருள்பட வாய்ப்பு அதிகம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַהֲבֵאתֶם
  choice: கொண்டுவர வேண்டும்
  rationale: בוא என்பதன் ஹிஃபில் வடிவம் இங்கு குறிப்பிட்ட இடத்துக்குப் பொருட்களைக் கொண்டுவரும் சட்டக் கடமையைச் சுட்டுகிறது; நவீனத் தமிழில் prescriptive force-ஐ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: שָׁמָּה
  choice: அங்கே
  rationale: முந்தைய வசனத்தில் குறிப்பிடப்பட்ட வழிபாட்டு இடத்தைச் சுட்டும் இடவினையடை; எபிரெயச் சுட்டுத்தன்மையைச் சுருக்கமாகப் பாதுகாக்கிறது.
- source_word: עֹלֹתֵיכֶם
  choice: உங்கள் தகனபலிகள்
  rationale: עוֹלָה முழுவதுமாக எரிக்கப்படும் பலிக்கான நிலையான சடங்கியல் சொல்; ‘தகனபலி’ அந்த வேறுபாட்டைத் தெளிவாகக் காட்டுகிறது.
- source_word: זִבְחֵיכֶם
  choice: பலிகள்
  rationale: זֶבַח அறுத்துப் பலியிடப்படும் காணிக்கைகளைக் குறிக்கும் பரந்த சொல்; தேவையற்ற குறுக்கத்தைத் தவிர்த்து, தகனபலியிலிருந்து தனிக் கூறாக வைத்திருக்கிறது.
- source_word: מַעְשְׂרֹתֵיכֶם
  choice: பத்திலொரு பங்குகள்
  rationale: பத்தில் ஒரு பகுதியை அளிப்பதைக் குறிக்கும் மூலச்சொல்லின் பொருளை, சாதாரண வாசகருக்குத் தெளிவான தமிழில் நேரடியாகத் தருகிறது.
- source_word: תְּרוּמַת יֶדְכֶם
  choice: உங்கள் கையால் அளிக்கும் காணிக்கை
  rationale: תְּרוּמָה என்பது ஒதுக்கி அளிக்கப்படும் பங்களிப்பு அல்லது காணிக்கை; יֶדְכֶם என்ற ‘உங்கள் கை’ உருவகத்தை இயல்பான தமிழில் பாதுகாக்கிறது.
- source_word: נִדְרֵיכֶם
  choice: நேர்த்திக்கடன் காணிக்கைகள்
  rationale: சடங்கியல் பட்டியலில் נֶדֶר வெறும் வாய்மொழி நேர்த்தியை விட, அதை நிறைவேற்ற அளிக்கப்படும் பொருளையும் குறிக்கிறது; ‘காணிக்கைகள்’ சூழற்பொருளை வெளிப்படுத்துகிறது.
- source_word: נִדְבֹתֵיכֶם
  choice: விருப்பக் காணிக்கைகள்
  rationale: נְדָבָה நேர்த்திக்கடனால் கட்டுப்படாமல் மனமுவந்து அளிக்கப்படும் காணிக்கையைச் சுட்டுகிறது; இவ்வேறுபாட்டைச் சுருக்கமாகப் பாதுகாக்கிறது.
- source_word: בְכֹרֹת בְּקַרְכֶם וְצֹאנְכֶם
  choice: உங்கள் மாட்டு மந்தையிலும் ஆட்டு மந்தையிலும் பிறந்த முதற்பேறுகள்
  rationale: בָּקָר பெரிய கால்நடைகளையும் צֹאן செம்மறியாடுகள் மற்றும் வெள்ளாடுகள் உள்ளிட்ட சிறிய கால்நடைகளையும் குறிக்கும் இணை; ‘மாட்டு மந்தை / ஆட்டு மந்தை’ இயல்பான தமிழில் அவற்றை வேறுபடுத்துகிறது, ‘பிறந்த’ என்பது முதற்பேறு உயிரினங்கள் என்பதைத் தெளிவாக்குகிறது.
theological_decisions:
- issue: נִדְרֵיכֶם என்பது நேர்த்திகளா அல்லது அவற்றுடன் தொடர்புடைய காணிக்கைகளா
  choice: நேர்த்திக்கடன் காணிக்கைகள்
  alternative: உங்கள் நேர்த்திக்கடன்கள்
  rationale: இது ஆலயத்துக்குக் கொண்டுவரப்படும் பலிகள் மற்றும் காணிக்கைகளின் பட்டியல் என்பதால், நேர்த்தியை நிறைவேற்றும் காணிக்கைகள் என்ற சூழற்பொருள் வலுவானது; எனினும் எபிரெயச் சொல் தனியே ‘நேர்த்திகள்’ என்றும் பொருள்பட முடியும் என்பதால் அடிக்குறிப்பில் மாற்று தரப்படுகிறது.
- issue: תְּרוּמַת יֶדְכֶם-இல் உள்ள ‘கை’ உருவகம்
  choice: உங்கள் கையால் அளிக்கும் காணிக்கை
  alternative: உங்கள் காணிக்கை
  rationale: தனிப்பட்ட முறையில் அளிக்கப்படுவதை வலியுறுத்தும் மூலமொழியின் ‘கை’ கூறை, கோட்பாட்டுச் சிறப்புப் பொருள் ஏதும் சேர்க்காமல் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சட்ட அறிவுறுத்தலுக்குரிய கண்ணியமான ஆனால் எளிதில் புரியும் நடையைப் பயன்படுத்துகிறது. சடங்கியல் வேறுபாடுகளுக்காக ‘தகனபலி,’ ‘நேர்த்திக்கடன் காணிக்கை,’ ‘விருப்பக் காணிக்கை’ ஆகிய சொற்கள் தனித்தனியாக வைக்கப்பட்டுள்ளன; அரிதான வடமொழிச் சேர்க்கைகளும் பிரிவுசார் சொற்பயன்பாடுகளும் தவிர்க்கப்பட்டுள்ளன.
