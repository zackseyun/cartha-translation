  source_fidelity: எபிரெய மூலத்தின் பட்டியல், வரிசை, பன்மை உடைமைச்சுட்டுகள், மற்றும் சட்டக் கட்டளைத் தன்மை ஆகியவை துல்லியமாகக் காக்கப்பட்டுள்ளன. עֹלָה / זֶבַח, மַעֲשֵׂר, תְּרוּמַת יָד, נֶדֶר / נְדָבָה, மற்றும் மந்தை/ஆட்டுமந்தையின் முதற்பேறுகள் ஆகிய தனித்த கூறுகள் தெளிவாக வேறுபடுத்தப்பட்டுள்ளன. נִדְרֵיכֶם என்பதன் ‘நேர்த்திகள்’ என்ற சாத்தியமான பொருள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
