base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/030.yaml
  text: Be careful for yourself, lest you be ensnared after them, after they have been destroyed from before you, and lest you inquire about their gods, saying, “How did these nations serve their gods, so that I too may do the same?”
translation:
  language: ta
  text: அவர்கள் உன் முன்பாக அழிக்கப்பட்ட பின்பு, அவர்களைப் பின்பற்றிக் கண்ணியில் சிக்கிக்கொள்ளாதபடியும், அவர்களுடைய தெய்வங்களைப் பற்றி, “இந்த இனத்தவர்கள் தங்கள் தெய்வங்களை எவ்வாறு வழிபட்டார்கள்? நானும் அவ்வாறே செய்வேன்” என்று விசாரிக்காதபடியும், கவனமாயிரு.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִשָּׁמֶר לְךָ
  choice: உன்னைக் குறித்து எச்சரிக்கையாக இரு
  rationale: ‘உனக்காக/உன்னைக் குறித்து கவனமாயிரு’ என்ற தன்னைக் காத்துக்கொள்ளும் எச்சரிக்கையைத் தமிழில் இயல்பாகவும் தெளிவாகவும் தருகிறது.
- source_word: תִּנָּקֵשׁ אַחֲרֵיהֶם
  choice: அவர்களைப் பின்பற்றிக் கண்ணியில் சிக்கிக்கொள்ள
  rationale: נקשׁ என்பதிலுள்ள கண்ணியில் அகப்படும் உருவகத்தையும், אַחֲרֵיהֶם என்பதிலுள்ள ‘அவர்களைப் பின்பற்றி’ என்ற கருத்தையும் தக்கவைக்கிறது.
- source_word: תִּדְרֹשׁ לֵאלֹהֵיהֶם
  choice: அவர்களுடைய தெய்வங்களைப் பற்றி ... விசாரிக்க
  rationale: דרשׁ இங்கு தகவல் அறிய ஆராய்வது அல்லது விசாரிப்பது; வழிபாட்டை நாடுவது என்று தேவையின்றித் தீர்மானிக்காமல் மூலத்தின் பரப்பைத் தக்கவைக்கிறது.
- source_word: יַעַבְדוּ
  choice: வழிபட்டார்கள்
  rationale: עבד என்பதன் அடிப்படைப் பொருள் ‘சேவித்தல்’; தெய்வங்களைச் சார்ந்த இச்சூழலில் இயல்பான தமிழ் ‘வழிபடுதல்’ ஆகும். அழிக்கப்பட்ட மக்களைப் பற்றிய கேள்வி என்பதால் இறந்தகாலம் பயன்படுத்தப்பட்டுள்ளது.
- source_word: הַגּוֹיִם הָאֵלֶּה
  choice: இந்த மக்களினங்கள்
  rationale: גוים என்பதைக் குறிப்பிட்ட பிற இனக் குழுக்களாகக் காட்டுகிறது; இங்கு ‘புறவினத்தார்’ போன்ற சமயச் சாயலுள்ள சொல்லைத் தவிர்க்கிறது.
- source_word: אֱלֹהֵיהֶם
  choice: அவர்களுடைய தெய்வங்கள்
  rationale: பன்மை உடைமை வடிவத்தையும், இஸ்ரவேலுக்கு அயலான மக்களின் வழிபாட்டுப் பொருட்களைக் குறிக்கும் சூழலையும் தெளிவாகப் பிரதிபலிக்கிறது.
theological_decisions:
- issue: அந்நிய தெய்வங்களைப் பற்றி விசாரிப்பதற்கான நோக்கம்
  choice: “நானும் அவ்வாறே செய்வேன்” என்று நேரடி தொடர்ச்சியாக மொழிபெயர்க்கப்பட்டது.
  alternative: “நானும் அவ்வாறே செய்வதற்காக”
  rationale: எபிரெயில் וְאֶעֱשֶׂה என்பது நோக்கத்தையும் விளைவையும் சுட்டக்கூடிய தொடர்ச்சி; அதனை வெளிப்படையான நோக்கவாக்கியமாக மட்டும் சுருக்காமல், பேச்சாளரின் முடிவாக உள்ள பதற்றத்தைத் தக்கவைக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டது. எபிரெய் வாக்கியத்தின் நீண்ட எச்சரிக்கை அமைப்பைத் தமிழில் தெளிவாக்க வினைச்சொல் இறுதியில் வைக்கப்பட்டுள்ளது; ‘கண்ணியில் சிக்குதல்’ என்ற மூல உருவகம் பாதுகாக்கப்பட்டுள்ளது.
