- from: அவர்கள் உன் முன்னிலையிலிருந்து அழிக்கப்பட்ட பின்பு, நீ அவர்களைப் பின்பற்றிக் கண்ணியில் சிக்கிக்கொள்ளாதபடியும், அவர்களுடைய தெய்வங்களைப் பற்றி, “இந்த மக்களினங்கள் தங்கள் தெய்வங்களை எப்படி வழிபட்டார்கள்? நானும் அவ்வாறே செய்வேன்” என்று விசாரிக்காதபடியும் உன்னைக் குறித்து எச்சரிக்கையாக இரு.
