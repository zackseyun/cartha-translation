source:
  edition: WLC
  text: לֹֽא תַעֲשׂ֣וּ/ן כֵּ֔ן לַ/יהוָ֖ה אֱלֹהֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/004.yaml
  text: You shall not do so to Yahweh your God[a][b].
translation:
  language: ta
  text: உங்கள் கடவுளாகிய யாவேக்கு நீங்கள் அப்படிச் செய்யக் கூடாது.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அப்படி” என்பது முந்தைய வசனங்களில் பிற இனங்களின் வழிபாட்டிடங்களையும் வழிபாட்டுப் பொருட்களையும் அழிக்கும்படி கூறப்பட்ட விதத்தைப் பின்னோக்கிச் சுட்டுகிறது; இஸ்ரவேலர் யாவேவிடம் அவ்வாறு நடந்துகொள்ளக் கூடாது.
    reason: cross_reference
  - marker: b
    text: எபிரெயத்தில் יהוה (YHWH) என்ற இறைப்பெயர் உள்ளது; இதை “யெகோவா” என்றும் ஒலிபெயர்க்கலாம். மரபாக இது “கர்த்தர்” என்று மொழிபெயர்க்கப்படுகிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: לֹא תַעֲשׂוּן
  choice: நீங்கள் செய்யக் கூடாது
  rationale: לֹא உடன் வரும் இரண்டாம் நபர் பன்மை imperfect வினைச்சொல், இந்தச் சட்டச் சூழலில் நேரடியான தடையை வெளிப்படுத்துகிறது. நவீன தமிழில் ‘செய்யக் கூடாது’ இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: כֵּן
  choice: அப்படி
  rationale: முந்தைய வசனத்தில் பிற இனத்தாரின் வழிபாட்டிடங்களை அழிப்பதைக் குறிக்கும் பின்னோக்குச் சுட்டைச் சுருக்கமாகத் தக்கவைக்கிறது; விளக்கத்தை முதன்மை உரைக்குள் சேர்க்கவில்லை.
- source_word: לַיהוָה
  choice: யெகோவாவுக்கு
  rationale: לְ உறவு அல்லது நோக்குநிலையைக் குறிக்கிறது; தமிழில் ‘-க்கு’ இயல்பான இணை. יהוה என்ற தனிப்பட்ட இறைப்பெயரை பொதுப்பட்டமாக மாற்றாமல் ஒலிபெயர்த்துள்ளது.
- source_word: אֱלֹהֵיכֶם
  choice: உங்கள் கடவுளாகிய
  rationale: இரண்டாம் நபர் பன்மை உடைமைப் பின்னொட்டையும் உடன்படிக்கை உறவையும் வெளிப்படையாகத் தக்கவைக்கிறது; தமிழில் இறைப்பெயருடன் இயல்பாக இணைய ‘உங்கள் கடவுளாகிய’ பயன்படுத்தப்பட்டுள்ளது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யெகோவா
  alternative: யாவே; கர்த்தர்
  rationale: எபிரெய மூலத்தில் தனிப்பட்ட உடன்படிக்கைப் பெயர் நேரடியாக உள்ளது. தமிழ்ச் சூழலில் பரவலாக அறியப்படும் ‘யெகோவா’ ஒலிபெயர்ப்பு முதன்மை உரையில் பயன்படுத்தப்படுகிறது; ‘யாவே’ மாற்று ஒலிபெயர்ப்பாக அடிக்குறிப்பில் தரப்படுகிறது. ‘கர்த்தர்’ என்பது பட்டமாக இருப்பதால் பெயரின் தன்மையை மறைக்கக்கூடும்.
- issue: தடையின் சூழல்சார் பொருள்
  choice: முந்தைய வசனத்தில் கூறப்பட்ட விதத்தில் யெகோவாவிடம் நடந்துகொள்ள வேண்டாம் என்ற நேரடித் தடை
  alternative: யெகோவாவுக்குரிய வழிபாட்டுப் பொருட்களை அழிக்க வேண்டாம் என்ற குறுகிய பொருள்
  rationale: כֵּן (‘அப்படி’) என்பது முந்தைய கட்டளைகளை நோக்கிச் சுட்டுகிறது. எபிரெய உரையின் சுருக்கத்தையும் அதன் சூழல்சார் திறந்த தன்மையையும் முதன்மை உரையில் காத்து, தொடர்பை அடிக்குறிப்பில் விளக்குகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சட்டக் கட்டளைக்குரிய கண்ணியமான ஆனால் எளிய நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. எபிரெயத்தின் இரண்டாம் நபர் பன்மை ‘நீங்கள்’ எனத் தக்கவைக்கப்பட்டுள்ளது; ‘அப்படி’ என்ற சுருக்கமான பின்னோக்குச் சுட்டும் பாதுகாக்கப்பட்டுள்ளது.
