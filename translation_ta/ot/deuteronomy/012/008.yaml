  text: לֹ֣א תַעֲשׂ֔וּ/ן כְּ֠/כֹל אֲשֶׁ֨ר אֲנַ֧חְנוּ עֹשִׂ֛ים פֹּ֖ה הַ/יּ֑וֹם אִ֖ישׁ כָּל הַ/יָּשָׁ֥ר בְּ/עֵינָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/008.yaml
  text: You shall not do as we are doing here today[a], each man whatever is right in his own eyes.
translation:
  language: ta
  text: இன்று இங்கே நாம் செய்துவருவதுபோல் நீங்கள் செய்யக்கூடாது; ஒவ்வொருவனும் தன் பார்வையில் சரியானதையெல்லாம் செய்கிறான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תַעֲשׂוּן
  choice: நீங்கள் செய்யக்கூடாது
  rationale: எதிர்மறையுடன் வரும் இரண்டாம் நபர் பன்மை வினைமுற்று எதிர்காலத்திற்கான தடையையும் கட்டளையின் வலிமையையும் தருகிறது; நவீன தமிழில் ‘செய்யக்கூடாது’ இதை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: כְּכֹל אֲשֶׁר
  choice: செய்துவருகிறபடி
  rationale: இது செயல் நடைபெறும் முறையை ஒப்பிடுகிறது. ‘-படி’ என்ற அமைப்பு தமிழில் அந்த ஒப்பீட்டை இயல்பாகத் தருகிறது; ‘எல்லாம்’ என்ற விரிவான பொருள் பின்னுள்ள ‘சரியானதையெல்லாம்’ என்பதிலும் சூழலிலும் வெளிப்படுகிறது.
- source_word: עֹשִׂים פֹּה הַיּוֹם
  choice: இன்று இங்கே நாம் செய்துவருகிறபடி
  rationale: எபிரெயப் பங்கேற்புவினை அப்போது தொடர்ந்துகொண்டிருக்கும் செயலைக் குறிக்கிறது. ‘செய்துவருகிற’ என்பது அந்த நிகழ்காலத் தொடர்ச்சியைத் தெளிவாகக் காட்டுகிறது.
- source_word: אִישׁ
  choice: ஒவ்வொருவனும்
  rationale: ஒருமை ஆண்பால் சொல் இங்கு பகிர்நிலைப் பொருளில் வருகிறது. மூலத்தின் வடிவத்தைப் பேண ‘ஒவ்வொருவனும்’ என மொழிபெயர்த்து, அதன் பிரதிநிதித்துவப் பொருள் அடிக்குறிப்பில் விளக்கப்படுகிறது.
- source_word: כָּל הַיָּשָׁר
  choice: சரியானதையெல்லாம்
  rationale: இச்சொற்றொடர் ஒருவன் நேர்மையானது அல்லது சரியானது என்று மதிப்பிடுவதைக் குறிக்கிறது. ‘சரியானதையெல்லாம்’ என்பது ‘எது சரியெனத் தோன்றுகிறதோ’ என்ற கூடுதல் விளக்கத்தை உரைக்குள் புகுத்தாமல் பொருளைத் தருகிறது.
- source_word: בְּעֵינָיו
  choice: தன் பார்வையில்
  rationale: சொல்லாட்சியாக ‘அவனுடைய கண்களில்’ என்றாலும், இது தனிப்பட்ட மதிப்பீட்டைக் குறிக்கும் எபிரெய மரபுத்தொடர். ‘தன் பார்வையில்’ என்பது பார்வை உருவகத்தையும் இயல்பான தமிழையும் பேணுகிறது.
theological_decisions:
- issue: אִישׁ ... בְּעֵינָיו என்ற ஆண்பால் ஒருமை பகிர்நிலை அமைப்பு
  choice: ஒவ்வொருவனும் ... தன் பார்வையில்
  alternative: ஒவ்வொருவரும் ... தங்கள் பார்வையில்
  rationale: மூலத்தில் ஆண்பால் ஒருமை வடிவம் இருந்தாலும் அது குழுவிலுள்ள ஆட்கள் ஒவ்வொருவரையும் பகிர்நிலையில் சுட்டுகிறது. முதன்மை உரை அந்த வடிவத்தைப் பேணுகிறது; அது ஆண்களை மட்டும் குறுக்கிக் காட்டுவதாகப் புரிந்துகொள்ளப்படாதபடி அடிக்குறிப்பு விளக்குகிறது.
translation_notes:
  register: நவீன, மரியாதைமிக்க சட்ட/அறிவுறுத்தல் நடை பயன்படுத்தப்பட்டுள்ளது. இடைக்கோடுகளுக்குள் வரும் பகுதி, இஸ்ரவேலர் அப்போது செய்துகொண்டிருந்த செயலின் தன்மையை விளக்கும் மூலத்தின் சுருக்கமான இணைப்பைத் தெளிவாக்குகிறது; புதிய காரணவிளக்கம் சேர்க்கப்படவில்லை.
