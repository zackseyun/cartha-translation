- from: உங்கள் முன்னோர்களின் கடவுளாகிய யாவே உங்களுக்கு உரிமையாக்கிக்கொள்ளக்[b] கொடுத்த நாட்டில், நீங்கள் பூமியில்[c] உயிரோடிருக்கும் நாளெல்லாம் கவனமாகக் கடைப்பிடிக்க வேண்டிய நியமங்களும் நீதித்தீர்ப்புகளும்[a] இவையே.
