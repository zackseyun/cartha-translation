base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/001.yaml
  text: These are the statutes and the judgments that you shall be careful to do in the land that Yahweh[a], the God of your fathers, has given you to possess[c][b], all the days that you are living on the earth.
translation:
  language: ta
  text: உன் முன்னோர்களின் கடவுளாகிய யாவே உனக்கு உரிமையாக்கிக் கொள்ளக் கொடுத்த நாட்டில், நீங்கள் பூமியில் வாழும் காலமெல்லாம் கவனமாகக் கடைப்பிடித்து நடக்க வேண்டிய நியமங்களும் நீதித் தீர்ப்புகளும்[a] இவையே.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘நீதித் தீர்ப்புகள்’ என்பதற்கு ‘சட்டவிதிகள்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה
  choice: இவையே
  rationale: தொடர்ந்து வரும் சட்டத் தொகுப்பைச் சுட்டுகிறது; வாக்கியத்தின் முடிவில் வைப்பது இயல்பான தமிழ்நடையைத் தருகிறது.
- source_word: הַחֻקִּים
  choice: நியமங்கள்
  rationale: சட்டபூர்வமாக நிர்ணயிக்கப்பட்ட கட்டளைகள் என்ற பொருளைத் தருவதோடு, מִשְׁפָּטִים என்பதிலிருந்து சொல்வேறுபாட்டையும் காக்கிறது.
- source_word: וְהַמִּשְׁפָּטִים
  choice: நீதித்தீர்ப்புகள்
  rationale: சட்டரீதியான தீர்ப்புகள் அல்லது விதிகள் என்ற எபிரெயச் சட்டப் பயன்பாட்டை முறையான தமிழில் பிரதிபலிக்கிறது.
- source_word: אֲשֶׁר תִּשְׁמְרוּן לַעֲשׂוֹת
  choice: கவனமாகக் கடைப்பிடிக்க வேண்டிய
  rationale: שׁמר என்பதிலுள்ள விழிப்பான கவனத்தையும் עשה என்பதிலுள்ள நடைமுறை கீழ்ப்படிதலையும் இயல்பான தமிழில் ஒருங்கிணைக்கிறது.
- source_word: בָּאָרֶץ
  choice: நாட்டில்
  rationale: இங்கு வாக்குத்தத்தம் செய்யப்பட்ட குறிப்பிட்ட நிலப்பகுதியைக் குறிப்பதால் ‘நாடு’ என்பது சூழலுக்கு ஏற்றது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், எபிரெய மெய்யெழுத்துப் பெயரின் பரவலான தமிழெழுத்துப்பெயர்ப்பாக வழங்குகிறது.
- source_word: אֱלֹהֵי אֲבֹתֶיךָ
  choice: உங்கள் முன்னோர்களின் கடவுள்
  rationale: உடன்படிக்கைச் சூத்திரத்தின் பொருளைக் காக்கிறது; தமிழில் ‘முன்னோர்கள்’ என்பது உள்ளடக்கமானதும் இயல்பானதும் ஆகும்.
- source_word: לְרִשְׁתָּהּ
  choice: உரிமையாக்கிக்கொள்ள
  rationale: இச்சூழலில் ירשׁ குறிக்கும் நிலத்தைப் பெற்றுத் தம் உடைமையாக்கும் செயலை வெளிப்படுத்துகிறது; ‘சுதந்தரித்துக்கொள்ள’ என்பதும் சாத்தியம்.
- source_word: כָּל הַיָּמִים אֲשֶׁר אַתֶּם חַיִּים
  choice: நீங்கள் உயிரோடிருக்கும் நாளெல்லாம்
  rationale: காலத்தின் முழுமையையும் பன்மை முகவரியையும் இயல்பான தமிழில் காக்கிறது.
- source_word: עַל הָאֲדָמָה
  choice: பூமியில்
  rationale: முன்னர் வந்த குறிப்பிட்ட ‘நாடு’ என்பதிலிருந்து வேறுபடுத்தி, உயிர்வாழும் காலமெங்கும் என்ற விரிவான பொருளை வெளிப்படுத்துகிறது; ‘நிலத்தில்’ என்பதும் சாத்தியம்.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூலத்தில் தனிப்பட்ட உடன்படிக்கைப் பெயர் நேரடியாக இருப்பதால், அதை ஒரு பட்டமாக மாற்றாமல் எழுத்துப்பெயர்த்து வழங்கப்பட்டது.
- issue: ירשׁ என்பதன் நில உரிமைப் பொருள்
  choice: உரிமையாக்கிக்கொள்ள
  alternative: சுதந்தரித்துக்கொள்ள
  rationale: இந்த உபாகமச் சூழலில் நிலத்தைப் பெற்று உடைமையாக்கும் செயற்பொருள் உள்ளது; மரபுரிமை என்ற ஒரே கருத்துக்குள் அதைச் சுருக்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் சட்டப்பகுதிக்கேற்ற கண்ணியமான முறையான நடையிலும் மொழிபெயர்க்கப்பட்டது. எபிரெயச் சட்டச் சொற்களுக்கிடையிலான வேறுபாடும் ‘நாடு/பூமி’ என்ற இடச்சொற்களின் வேறுபாடும் இயன்றவரை காக்கப்பட்டுள்ளன.
