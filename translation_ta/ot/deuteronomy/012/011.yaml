  source_fidelity: 'மூலத்தின் பெரும்பகுதி துல்லியமாக உள்ளது: தேர்ந்தெடுக்கப்பட்ட இடத்திற்குக் கொண்டுவருதல், முழுதகனப் பலிகள், பலிகள், தசமபாகங்கள், கையின் காணிக்கை, மற்றும் யாவேக்கு நேர்ந்துகொள்ளும் சிறந்த நேர்ச்சைகள் ஆகிய பட்டியல் காக்கப்பட்டுள்ளது. ஆனால் ‘உங்கள் கையின் காணிக்கை’ இயல்பற்றது; மேலும் மூலத்தில் உள்ள ஹிஃபில் வடிவத்தின் மாற்றுவாசிப்புக்கான அடிக்குறிப்பு, உரிய சொற்றொடரிலேயே இணைக்கப்பட வேண்டும்.'
  naturalness: ‘உங்கள் தேவனாகிய யாவே,’ மற்றும் ‘உங்கள் கையால் அளிக்கும் காணிக்கையை’ ஆகியவை நவீனத் தரநிலைத் தமிழில் தெளிவாகவும் மரியாதையான வேதாகம நடையிலும் உள்ளன. ‘தசமபாகங்கள்’ என்பது இச்சூழலில் நிலைபெற்ற, இயல்பான சொல். ‘நேர்ச்சைகளில் மிகச் சிறந்த அனைத்தும்’ என்பது ‘நேர்த்திக்கடன்களில் சிறந்தவை அனைத்தும்’ என்பதைக் காட்டிலும் நேரடியானது.
