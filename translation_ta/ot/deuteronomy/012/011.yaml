revisions:
- from: 'அப்போது, உங்கள் இறைவனாகிய யாவே தமது பெயரை அங்கே குடியிருக்கச் செய்வதற்காகத் தேர்ந்தெடுக்கும் இடத்திற்கு, நான் உங்களுக்குக் கட்டளையிடும் அனைத்தையும் நீங்கள் கொண்டுவர வேண்டும்: உங்கள் முழுத் தகனபலிகள், பலிகள், பத்திலொரு பங்குகள், உங்கள் கையின் காணிக்கை, யாவேக்கு நீங்கள் நேர்ந்துகொள்ளும் நேர்த்திக்கடன்களில் சிறந்தவை அனைத்தும்.'
  to: 'அப்போது, உங்கள் தேவனாகிய யாவே, தமது பெயர் அங்கே குடியிருக்கும்படி[a] தேர்ந்தெடுக்கும் இடத்திற்கு, நான் உங்களுக்குக் கட்டளையிடுகிற அனைத்தையும் நீங்கள் கொண்டுவர வேண்டும்: உங்கள் முழுதகனப் பலிகளை, உங்கள் பலிகளை, உங்கள் தசமபாகங்களை, உங்கள் கையால் அளிக்கும் காணிக்கையை, யாவேக்கு நீங்கள் நேர்ந்துகொள்ளும் நேர்ச்சைகளில் மிகச் சிறந்த அனைத்தையும்.'
  rationale: திருத்தம் மூலத்தின் பட்டியல் அமைப்பையும் எதிர்காலக் கட்டளைத் தன்மையையும் காக்கிறது. பெயர் ‘குடியிருத்தல்’ உருவகம் பிரதான உரையில் பாதுகாக்கப்படுகிறது; ஹிஃபில் காரணவினைத் தன்மை அடிக்குறிப்பில் வெளிப்படையாகக் குறிக்கப்படுகிறது. காணிக்கை, நேர்ச்சி, மற்றும் தசமபாகம் தொடர்பான சொற்கள் நவீனத் தரநிலைத் தமிழில் இயல்பாகவும் துல்லியமாகவும் மாற்றப்பட்டுள்ளன.
