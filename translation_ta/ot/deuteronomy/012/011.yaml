source:
  edition: WLC
  text: וְ/הָיָ֣ה הַ/מָּק֗וֹם אֲשֶׁר יִבְחַר֩ יְהוָ֨ה אֱלֹהֵי/כֶ֥ם בּ/וֹ֙ לְ/שַׁכֵּ֤ן שְׁמ/וֹ֙ שָׁ֔ם שָׁ֣מָּ/ה תָבִ֔יאוּ אֵ֛ת כָּל אֲשֶׁ֥ר אָנֹכִ֖י מְצַוֶּ֣ה אֶתְ/כֶ֑ם עוֹלֹתֵי/כֶ֣ם וְ/זִבְחֵי/כֶ֗ם מַעְשְׂרֹֽתֵי/כֶם֙ וּ/תְרֻמַ֣ת יֶדְ/כֶ֔ם וְ/כֹל֙ מִבְחַ֣ר נִדְרֵי/כֶ֔ם אֲשֶׁ֥ר תִּדְּר֖וּ לַֽ/יהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/011.yaml
  text: 'Then the place that Yahweh your God will choose for his name to dwell there—to that place you shall bring all that I am commanding you: your burnt offerings[a], your sacrifices, your tithes, the contribution of your hand, and all the choicest of your vows that you vow to Yahweh.'
translation:
  language: ta
  text: 'அப்போது, உங்கள் தேவனாகிய யாவே, தமது பெயர் அங்கே குடியிருக்கும்படி[a] தேர்ந்தெடுக்கும் இடத்திற்கு, நான் உங்களுக்குக் கட்டளையிடுகிற அனைத்தையும் நீங்கள் கொண்டுவர வேண்டும்: உங்கள் முழுதகனப் பலிகளை, உங்கள் பலிகளை, உங்கள் தசமபாகங்களை, உங்கள் கையால் அளிக்கும் காணிக்கையை, யாவேக்கு நீங்கள் நேர்ந்துகொள்ளும் நேர்ச்சைகளில் மிகச் சிறந்த அனைத்தையும்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அதிகச் சொற்சரியான வகையில், ‘தமது பெயரை அங்கே குடியிருக்கச் செய்வதற்காக.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: அப்போது
  rationale: முந்தைய அறிவுறுத்தல்களிலிருந்து எதிர்காலச் சூழலுக்குச் செல்லும் உரையோட்டத்தை இயல்பான தமிழில் காட்டுகிறது.
- source_word: הַמָּקוֹם אֲשֶׁר יִבְחַר
  choice: தேர்ந்தெடுக்கும் இடத்திற்கு
  rationale: வழிபாட்டுக்காகத் தேர்ந்தெடுக்கப்படும் குறிப்பிட்ட இடம் என்ற மையக் கருத்தையும், שָׁמָּה என்பதன் திசைநோக்கிய பொருளையும் காக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைத் திருப்பெயரான நான்கெழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: לְשַׁכֵּן שְׁמוֹ שָׁם
  choice: தமது பெயரை அங்கே குடியிருக்கச் செய்வதற்காக
  rationale: שכן என்பதன் ஹிஃபில் காரணவினைப் பொருளையும், உபாகமத்தின் ‘பெயர் குடியிருத்தல்’ உருவகத்தையும் வெளிப்படையாகப் பாதுகாக்கிறது.
- source_word: תָבִיאוּ
  choice: நீங்கள் கொண்டுவர வேண்டும்
  rationale: கட்டளையின் வலிமையை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: כָּל אֲשֶׁר אָנֹכִי מְצַוֶּה אֶתְכֶם
  choice: நான் உங்களுக்குக் கட்டளையிடும் அனைத்தையும்
  rationale: தொடர்ச்சியான கட்டளையிடும் செயலைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: עוֹלֹתֵיכֶם
  choice: உங்கள் முழுத் தகனபலிகள்
  rationale: முழுவதும் எரிக்கப்படும் பலிவகையைத் தெளிவாக வேறுபடுத்துகிறது.
- source_word: זִבְחֵיכֶם
  choice: பலிகள்
  rationale: ஒரு குறிப்பிட்ட பலிவகையாகக் குறுக்காமல் மூலச் சொல்லின் பரந்த பொருளைக் காக்கிறது.
- source_word: מַעְשְׂרֹתֵיכֶם
  choice: பத்திலொரு பங்குகள்
  rationale: ‘தசமபாகம்’ என்ற மரபுச் சொல்லைவிட பொதுவாசகருக்குத் தெளிவான, பொருள்நேரான வடிவம்.
- source_word: תְרֻמַת יֶדְכֶם
  choice: உங்கள் கையின் காணிக்கை
  rationale: எபிரெய மொழியின் உறுதியான ‘உங்கள் கை’ உருவகத்தைச் சீரான தமிழில் பாதுகாக்கிறது.
- source_word: מִבְחַר נִדְרֵיכֶם
  choice: நேர்த்திக்கடன்களில் சிறந்தவை அனைத்தும்
  rationale: ‘சிறந்தவை’ என்ற தேர்ந்தெடுக்கப்பட்ட தரத்தையும், נדר என்பதன் நேர்ந்துகொள்ளப்பட்ட கடமை/நேர்த்திக்கடன் பொருளையும் பாதுகாக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைத் திருப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலத்தில் வரும் தனிப்பட்ட இறைப் பெயரைப் பட்டமாக மாற்றாமல் ஒலிபெயர்க்கிறது; ஒரு சமயப்பிரிவின் தனிப்பட்ட வழக்கையும் திணிக்கவில்லை.
- issue: לְשַׁכֵּן שְׁמוֹ שָׁם என்பதிலுள்ள ‘பெயர்’ இறையியல்
  choice: தமது பெயரை அங்கே குடியிருக்கச் செய்வதற்காக
  alternative: தமது பெயரை அங்கே வைப்பதற்காக / தமது பெயர் அங்கே குடியிருப்பதற்காக
  rationale: காரணவினைத் தன்மையையும் ‘குடியிருத்தல்’ உருவகத்தையும் காக்கிறது; கடவுளின் முழு இருப்பே அந்த இடத்துக்குள் கட்டுப்படுகிறது என்று உரையைத் தீர்த்துவிடாமல் அதன் இறையியல் பதற்றத்தைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனச் செந்தமிழ் சார்ந்த, dignified ஆனால் பொதுவாசகருக்குப் புரியும் நடை. பலி தொடர்பான சொற்களில் தேவையான அளவு துல்லியம் காக்கப்பட்டுள்ளது; வாக்கியத்தின் பட்டியல் அமைப்பும் மூலத்தின் வலியுறுத்தலும் தொடர்கின்றன.
