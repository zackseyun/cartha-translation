id: DEU.12.23
reference: Deuteronomy 12:23
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: רַ֣ק חֲזַ֗ק לְ/בִלְתִּי֙ אֲכֹ֣ל הַ/דָּ֔ם כִּ֥י הַ/דָּ֖ם ה֣וּא הַ/נָּ֑פֶשׁ וְ/לֹא תֹאכַ֥ל הַ/נֶּ֖פֶשׁ עִם הַ/בָּשָֽׂר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/023.yaml
  text: Only be sure not to eat the blood[a], because the blood is the life, and you shall not eat the life with the flesh.
translation:
  language: ta
  text: ஆனால், இரத்தத்தை உண்ணாதிருக்க உறுதியாய் இரு[a]; ஏனெனில் இரத்தமே உயிர். உயிரை இறைச்சியோடு சேர்த்து உண்ணாதே.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘உயிர்’ என்பதற்குப் பதிலாக, இவ்விரு இடங்களிலும் ‘ஆத்துமா’ என்றும் மொழிபெயர்க்கலாம். இங்கு எபிரெயச் சொல் உயிரினத்தை உயிரோடிருக்கச் செய்யும் உயிரைக் குறிக்கிறது; அதனால்தான் பல மொழிபெயர்ப்புகள் ‘உயிர்’ என்று தருகின்றன.
    reason: lexical_alternative
lexical_decisions:
- source_word: רַק
  choice: மட்டும்
  rationale: முந்தைய அனுமதிக்கு வலுவான வரம்பை விதிக்கும் சொல்லாக இருப்பதால், தமிழில் இயல்பாக அந்த விதிவிலக்கை உணர்த்துகிறது.
- source_word: חֲזַק
  choice: உறுதியாயிரு
  rationale: சொல்லுக்குச் சொல் ‘பலமாயிரு’ என்றாலும், לְבִלְתִּי உடன் இங்கு ஒரு செயலைச் செய்யாமல் இருப்பதில் திடமாக இருக்கும்படி வலியுறுத்துகிறது.
- source_word: לְבִלְתִּי אֲכֹל
  choice: உண்ணாதபடி
  rationale: உண்ணாமல் இருப்பதற்கான உறுதியான தடை அல்லது நோக்கத்தைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: הַדָּם
  choice: இரத்தம்
  rationale: மூலத்தின் நேரடியான பொருள்; வசனத்தில் வரும் இரு இடங்களிலும் ஒரே சொல்லாகப் பேணப்பட்டுள்ளது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: இரத்தத்தை உண்ணக்கூடாததற்கான காரணத்தை அறிமுகப்படுத்துகிறது.
- source_word: הַנָּפֶשׁ
  choice: உயிர்
  rationale: இங்கு உயிரினத்தை உயிரோடு வைத்திருக்கும் உயிரைக் குறிக்கிறது; உடலிலிருந்து பிரிந்த ஆன்மா என்ற பிற்காலத் தத்துவக் கருத்தைத் தேவையின்றி புகுத்துவதில்லை.
- source_word: וְלֹא תֹאכַל
  choice: உண்ணாதே
  rationale: சட்ட அறிவுறுத்தலில் வரும் எபிரெய வினை வடிவத்தின் தடை வலிமையை இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: הַנֶּפֶשׁ עִם הַבָּשָׂר
  choice: உயிரை இறைச்சியோடு சேர்த்து
  rationale: இரத்தத்துக்கும் உயிருக்கும் இடையிலான முந்தைய இணைப்பையும், உயிரை மாம்சத்துடன் உண்ணுதல் என்ற மூலத்தின் தெளிவான உருவகத்தையும் பேணுகிறது; உணவுச் சூழலில் בשר என்பதற்கு ‘இறைச்சி’ இயல்பான தமிழாகும்.
theological_decisions:
- issue: உணவுச் சட்டச் சூழலில் נֶפֶשׁ என்பதன் பொருள்
  choice: உயிர்
  alternative: ஆத்துமா
  rationale: இரத்தம் உயிரினத்தின் உயிராக இருப்பதாலேயே அதை உண்ணக்கூடாது என்பதே வசனத்தின் தர்க்கம். ‘ஆத்துமா’ என்பது மூலத்தில் கட்டாயப்படுத்தப்படாத உடல்–ஆத்துமா இருமைக் கருத்தைத் தூண்டக்கூடும்; ‘உயிர்’ சூழலுக்கும் மூலப் பொருளுக்கும் ஏற்றது.
translation_notes:
  register: நவீன நிலையான தமிழில், சட்ட அறிவுறுத்தலின் கண்ணியமும் வலிமையும் பேணப்பட்டுள்ளன. ‘உறுதியாயிரு’ என்பது חֲזַק என்பதன் வலியுறுத்தலை வெளிப்படுத்துகிறது; ‘உண்ணாதே’ தேவையற்ற பழமைநடையின்றித் தடையைத் தெளிவாக்குகிறது.
