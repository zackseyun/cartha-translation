revisions:
- from: நீ கைப்பற்றுவதற்காகச் செல்கிற அந்த நாடுகளை உன் முன்னிலையிலிருந்து உன் கடவுளாகிய யாவே அகற்றும்போது, நீ அவர்களைத் துரத்திவிட்டு அவர்களுடைய நாட்டில் குடியிருப்பாய்.
  to: உன் கடவுளாகிய யாவே, நீ கைப்பற்றுவதற்காக அங்கே செல்லும் அந்த மக்களினங்களை உன் முன்னிலையிலிருந்து அகற்றும்போது, நீ அவர்களைத் துரத்தி அவர்களுடைய நாட்டில் குடியிருப்பாய்.
