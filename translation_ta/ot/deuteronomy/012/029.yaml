  text: כִּֽי יַכְרִית֩ יְהוָ֨ה אֱלֹהֶ֜י/ךָ אֶת הַ/גּוֹיִ֗ם אֲשֶׁ֨ר אַתָּ֥ה בָא שָׁ֛מָּ/ה לָ/רֶ֥שֶׁת אוֹתָ֖/ם מִ/פָּנֶ֑י/ךָ וְ/יָרַשְׁתָּ֣ אֹתָ֔/ם וְ/יָשַׁבְתָּ֖ בְּ/אַרְצָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/029.yaml
  text: When Yahweh your God cuts off the nations before you, which you are going in there to dispossess, and you dispossess them and dwell in their land,
translation:
  language: ta
  text: உன் கடவுளாகிய யாவே, நீ கைப்பற்றுவதற்காக அங்கே செல்லும் அந்த மக்களினங்களை உன் முன்னிலையிலிருந்து அகற்றும்போது, நீ அவர்களைத் துரத்தி அவர்களுடைய நாட்டில் குடியிருப்பாய்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: அகற்றும்போது
  rationale: இங்கு כִּי, அடுத்த வசனத்தின் எச்சரிக்கைக்கான எதிர்காலச் சூழலை அறிமுகப்படுத்துகிறது. எனவே காரணப் பொருளைவிட காலப் பொருளான ‘போது’ இயல்பாகிறது.
- source_word: יַכְרִית
  choice: அகற்றும்போது
  rationale: כרת என்பதன் ஹிஃபில் வடிவம் இச்சூழலில் இஸ்ரவேலின் முன்னிலையிலிருந்து அந்த நாடுகளை நீக்குவதைக் குறிக்கிறது. ‘அழித்தொழிக்கும்போது’ என்பது முழுமையான இனஅழிப்பைத் தேவையின்றி வலியுறுத்தக்கூடும்; ‘அகற்றும்போது’ மூலத்தின் சூழல்சார் பொருளைத் தக்கவைக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரான நான்கு எழுத்துப் பெயரை ஒரு பட்டமாக மாற்றாமல், தமிழில் பரவலாகப் புரிந்துகொள்ளத்தக்க ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: אֱלֹהֶיךָ
  choice: உன் கடவுளாகிய
  rationale: இரண்டாம் நபர் ஒருமை உடைமைப் பின்னொட்டைத் தெளிவாகக் காட்டி, ‘யாவே’ என்பதுடன் இயல்பான தமிழ்த் தொடராக அமைகிறது.
- source_word: הַגּוֹיִם
  choice: அந்த நாடுகளை
  rationale: גּוֹיִם என்பதற்கு நேரடியான ‘நாடுகள்’ என்பதைக் கொண்டு, முன்னரே குறிப்பிட்டவையாக அவற்றைக் காட்ட ‘அந்த’ சேர்க்கப்பட்டுள்ளது.
- source_word: אֲשֶׁר אַתָּה בָא שָׁמָּה לָרֶשֶׁת אֹתָם
  choice: நீ கைப்பற்றுவதற்காகச் செல்கிற அந்த நாடுகளை
  rationale: ‘அங்கே வருகிற/செல்கிற’ என்ற எபிரெய அமைப்பைத் தமிழில் இயல்பாக ‘செல்கிற’ எனக் கொடுத்து, ירש என்பதன் உடைமையாக்கும் மற்றும் முந்தைய குடிகளை அகற்றும் சூழல்சார் வலிமையை ‘கைப்பற்ற’ என வெளிப்படுத்துகிறது.
- source_word: מִפָּנֶיךָ
  choice: உன் முன்னிலையிலிருந்து
  rationale: மக்களை இஸ்ரவேலின் வழி அல்லது முன்னிலையிலிருந்து நீக்குதல் என்ற எபிரெய மரபுத்தொடரின் திசைநிலையைத் தக்கவைக்கிறது.
- source_word: וְיָרַשְׁתָּ אֹתָם
  choice: நீ அவர்களைத் துரத்திவிட்டு
  rationale: மக்களையே நேரடி பொருளாகக் கொண்டிருப்பதால், நிலத்தை வெறுமனே உடைமையாக்குதல் என்பதைவிட அவர்களை அவர்களது இடத்திலிருந்து அகற்றும் கருத்தைத் தெளிவாக்குகிறது. இருப்பினும் அடுத்த சொற்றொடருடன் சேர்ந்து நிலத்தைக் கைப்பற்றும் விளைவும் வெளிப்படுகிறது.
- source_word: וְיָשַׁבְתָּ בְּאַרְצָם
  choice: அவர்களுடைய நாட்டில் குடியிருப்பாய்
  rationale: ישב என்பதன் வாழ்தல்/குடியேறுதல் பொருளையும், בְּאַרְצָם என்பதிலுள்ள அவர்களுடைய நிலம் என்ற உறவையும் இயல்பான நவீன தமிழில் தருகிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் ஒரு பொதுப் பட்டம் அல்ல, இஸ்ரவேலுக்கு வெளிப்படுத்தப்பட்ட தனிப்பட்ட உடன்படிக்கைப் பெயரே உள்ளது. ஆகவே அதை பட்டத்தால் மாற்றாமல் ஒலிபெயர்க்கப்பட்டுள்ளது.
- issue: כרת என்பதன் அழிவு அளவு
  choice: அகற்றும்போது
  alternative: அழித்தொழிக்கும்போது
  rationale: இவ்வசனத்தின் உடனடிச் சூழல் அந்த நாடுகள் இஸ்ரவேலின் முன்னிலையிலிருந்து நீக்கப்படுவதைச் சொல்கிறது. மூலச்சொல் அனுமதிப்பதைவிட முழுமையான அழிவை உறுதிப்படுத்தாமல் இருக்க மிதமான, சூழலுக்கு ஏற்ற சொல் தேர்ந்தெடுக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீனத் தரத் தமிழில், மரியாதையும் வேதாகமச் செறிவும் கொண்ட நடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய மொழியின் நீண்ட துணைவாக்கியத்தைத் தமிழில் வாசிக்க எளிதாக அமைத்தாலும், எதிர்காலச் சூழல், நாடுகளின் அகற்றம், அவர்களைத் துரத்துதல், அவர்களுடைய நாட்டில் குடியிருத்தல் என்ற நிகழ்வுகளின் வரிசை பாதுகாக்கப்பட்டுள்ளது.
