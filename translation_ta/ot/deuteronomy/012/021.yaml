  text: כִּֽי יִרְחַ֨ק מִמְּ/ךָ֜ הַ/מָּק֗וֹם אֲשֶׁ֨ר יִבְחַ֜ר יְהוָ֣ה אֱלֹהֶי/ךָ֮ לָ/שׂ֣וּם שְׁמ֣/וֹ שָׁם֒ וְ/זָבַחְתָּ֞ מִ/בְּקָרְ/ךָ֣ וּ/מִ/צֹּֽאנְ/ךָ֗ אֲשֶׁ֨ר נָתַ֤ן יְהוָה֙ לְ/ךָ֔ כַּ/אֲשֶׁ֖ר צִוִּיתִ֑/ךָ וְ/אָֽכַלְתָּ֙ בִּ/שְׁעָרֶ֔י/ךָ בְּ/כֹ֖ל אַוַּ֥ת נַפְשֶֽׁ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/021.yaml
  text: If the place that Yahweh your God chooses to put his name there is too far from you[a], then you may slaughter from your herd and from your flock that Yahweh has given you, as I have commanded you[b], and you may eat within your gates according to all the desire of your soul.
translation:
  language: ta
  text: உங்கள் கடவுளாகிய யாவே தமது பெயரை அங்கே வைப்பதற்காகத் தேர்ந்தெடுக்கும் இடம் உங்களிடமிருந்து வெகுதொலைவில் இருந்தால், யாவே உங்களுக்குக் கொடுத்த உங்கள் மாட்டு மந்தையிலும் ஆட்டு மந்தையிலும் சிலவற்றை, நான் உங்களுக்குக் கட்டளையிட்டபடி, நீங்கள் அறுத்து, உங்கள் ஊர்களில்[a] உங்கள் உள்ளம் விரும்பியபடியெல்லாம்[b] உண்ணலாம்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “உங்கள் வாயில்களுக்குள்”; இங்கு அது உங்கள் ஊர்கள் அல்லது குடியிருப்புகளைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: நேரடியாக, “உங்கள் உயிரின் விருப்பமெல்லாம்”; அதாவது, நீங்கள் விரும்பியபடியெல்லாம் அல்லது உங்கள் பசிக்கேற்ப.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי יִרְחַק מִמְּךָ
  choice: உங்களிடமிருந்து வெகுதொலைவில் இருந்தால்
  rationale: כִּי இங்கு நிபந்தனையையும், רחק நடைமுறைத் தொலைவையும் குறிக்கிறது. சட்டச் சூழலில் இயல்பான தமிழுக்காக இவ்வாறு மொழிபெயர்க்கப்பட்டது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைப் பெயரான நான்கெழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் வழக்கமான ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: לָשׂוּם שְׁמוֹ שָׁם
  choice: தமது பெயரை அங்கே வைப்பதற்காக
  rationale: שׂים என்பதன் நேரடிப் பொருளான ‘வை’ என்பதைக் காத்து, சரணாலயத்தைப் பற்றிய உபாகமச் சொற்றொடருக்கு மேலதிக விளக்கம் சேர்க்கவில்லை.
- source_word: וְזָבַחְתָּ
  choice: நீங்கள் அறுத்து
  rationale: இங்கு மையச் சரணாலயம் தொலைவில் இருப்பதால் உணவுக்காக உள்ளூரில் விலங்குகளை அறுப்பதற்கான அனுமதி பேசப்படுகிறது; ‘பலியிட்டு’ என்பது தேவையற்ற பலிச் சடங்கு பொருளை உருவாக்கக்கூடும்.
- source_word: מִבְּקָרְךָ וּמִצֹּאנְךָ
  choice: உங்கள் மாட்டு மந்தையிலும் ஆட்டு மந்தையிலும் சிலவற்றை
  rationale: מן என்பதன் பகுதியெடுக்கும் பொருளை ‘சிலவற்றை’ என்று வெளிப்படுத்தி, בקר மற்றும் צאן ஆகிய கூட்டுப்பெயர்களை இயல்பான தமிழில் தருகிறது.
- source_word: כַּאֲשֶׁר צִוִּיתִךָ
  choice: நான் உங்களுக்குக் கட்டளையிட்டபடி
  rationale: முதலாம் நபர் ஒருமை வினை வடிவத்தையும், மோசே முன்பு கொடுத்த கட்டளையுடனான தொடர்பையும் காக்கிறது.
- source_word: בִּשְׁעָרֶיךָ
  choice: உங்கள் ஊர்களில்
  rationale: ‘உங்கள் வாயில்களுக்குள்’ என்ற நேரடிச் சொற்றொடர் இங்கு வாயில்களால் குறிக்கப்படும் ஊர்கள் அல்லது குடியிருப்புகளைக் குறிக்கிறது; முதன்மை உரையில் இயல்பான பொருள் தரப்பட்டு நேரடிவடிவம் அடிக்குறிப்பில் வைக்கப்பட்டது.
- source_word: בְּכֹל אַוַּת נַפְשֶׁךָ
  choice: உங்கள் உள்ளம் விரும்பியபடியெல்லாம்
  rationale: נפשׁ என்பதன் உயிர்/தன்/ஆசை சார்ந்த பரப்பை முற்றிலும் உடல்சார்ந்த ‘பசி’ என்று சுருக்காமல், இன்றைய தமிழில் தெளிவாகத் தருகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரின் மொழியாக்கம்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் தனிப்பட்ட இறைப் பெயர் நேரடியாக இருப்பதால், அதை ஒரு பட்டமாக மாற்றாமல் ஒலிபெயர்த்துள்ளது.
- issue: וְזָבַחְתָּ என்பதில் பலிச் சடங்கு உள்ளதா
  choice: அறுத்து
  alternative: பலியிட்டு
  rationale: சுற்றியுள்ள சட்டச் சூழல் மையச் சரணாலயத்துக்கு அப்பால் சாதாரண உணவுக்காக விலங்குகளை அறுப்பதற்கான அனுமதியைச் சுட்டுகிறது; ஆகவே உள்ளூர் பலிச் சடங்கை மொழிபெயர்ப்பில் புகுத்தவில்லை.
translation_notes:
  register: நவீன பொதுத்தரத் தமிழ் பயன்படுத்தப்பட்டுள்ளது. மரியாதைமிக்க பன்மை இரண்டாம் நபர் வடிவம் காக்கப்பட்டுள்ளது. சட்ட உரையின் கண்ணியத்தையும் மூலத்தின் சொற்படிமங்களையும் பாதுகாத்தபடி, தமிழில் செயற்கையாக ஒலிக்கும் இடங்களில் இயல்பான இணைமொழி தேர்ந்தெடுக்கப்பட்டுள்ளது.
