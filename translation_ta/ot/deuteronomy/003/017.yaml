translation_notes:
  register: நவீனத் தரத் தமிழில், எல்லை விவரிப்புக்குரிய சுருக்கத்தையும் கண்ணியத்தையும் காக்கும் நடை. எபிரெய வாக்கியத்தின் பட்டியல் அமைப்பு நீண்ட கோடால் தெளிவாக்கப்பட்டுள்ளது; நிலப்பெயர்கள் தமிழில் வழக்கமான ஒலிவடிவில் தரப்பட்டுள்ளன.
