base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/017.yaml
  text: also the Arabah[a], with the Jordan as its border, from Kinnereth as far as the Sea of the Arabah, the Salt Sea[b], below the slopes of Pisgah on the east.
translation:
  language: ta
  text: மேலும், அரபாவும்[a], அதற்கு எல்லையாகிய யோர்தானும்—கின்னெரேத்திலிருந்து அரபாவின் கடலாகிய உப்புக் கடல்[b] வரையும், கிழக்கில் பிஸ்காவின் சரிவுகளுக்குக் கீழேயுள்ள பகுதியும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அரபா என்பது யோர்தான் பிளவுப் பள்ளத்தாக்குப் பகுதிக்கான நிலப்பெயர்.
    reason: lexical_clarification
  - marker: b
    text: அதாவது, சவக்கடல்.
    reason: modern_name
lexical_decisions:
- source_word: הָעֲרָבָה
  choice: அரபா
  rationale: இந்த எல்லை விளக்கத்தில் பொதுவான ‘சமவெளி’ என்பதைக் காட்டிலும் யோர்தான் பிளவுப் பள்ளத்தாக்குப் பகுதியைக் குறிக்கும் நிலப்பெயராக வருகிறது; ஆகவே ஒலிபெயர்க்கப்பட்டது.
- source_word: הַיַּרְדֵּן
  choice: யோர்தான்
  rationale: நன்கு அறியப்பட்ட புவியியல் பெயர்; ‘ஆறு’ என்பது சூழலில் உள்ளடங்குவதால் சேர்க்கப்படவில்லை.
- source_word: גְבֻל
  choice: அதன் எல்லையாகிய
  rationale: எபிரெயப் பட்டியல் நடையில் உள்ள சுருக்கமான உறவை இயல்பான தமிழில் தெளிவுபடுத்துகிறது; எல்லை என்ற அடிப்படைப் பொருளைப் பாதுகாக்கிறது.
- source_word: מִכִּנֶּרֶת
  choice: கின்னெரேத்திலிருந்து
  rationale: மூலத்தில் கடலா பகுதியா என்று வெளிப்படையாக விளக்காமல் இடப்பெயர் மட்டும் இருப்பதால் அதையே ஒலிபெயர்த்துள்ளது.
- source_word: יָם הָעֲרָבָה
  choice: அரபாவின் கடல்
  rationale: அடுத்து வரும் ‘உப்புக் கடல்’ என்ற இணைப்பெயருக்கு முன் உள்ள எபிரெயப் பெயரிடலை நேரடியாகப் பாதுகாக்கிறது.
- source_word: יָם הַמֶּלַח
  choice: உப்புக் கடல்
  rationale: நவீனப் பெயரான ‘சவக்கடல்’ என்பதற்குப் பதிலாக மூலச் சொல்லை முறையாக மொழிபெயர்க்கிறது.
- source_word: תַּחַת
  choice: கீழேயுள்ள
  rationale: நிலவியல் சார்ந்த உயரத் தொடர்பைக் குறிக்கும் இயல்பான தமிழ்; ‘தெற்கே’ என்று அளவுக்கு மீறி விளக்கவில்லை.
- source_word: אַשְׁדֹּת
  choice: சரிவுகள்
  rationale: இந்நிலவியல் சூழலில் மலைச்சரிவுகள் அல்லது இறக்கங்களைக் குறிக்கும் பொருத்தமான சொல்.
- source_word: הַפִּסְגָּה
  choice: பிஸ்கா
  rationale: தனிப்பட்ட இடப்பெயராக ஒலிபெயர்க்கப்பட்டது.
- source_word: מִזְרָחָה
  choice: கிழக்கே
  rationale: கிழக்குத் திசையிலுள்ள நிலையைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
