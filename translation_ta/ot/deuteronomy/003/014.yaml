base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/014.yaml
  text: Jair son of Manasseh took all the region of Argob[a], as far as the border of the Geshurites and the Maacathites, and he called them, that is, Bashan, Havvoth-jair[b], to this day.
translation:
  language: ta
  text: மனாசேயின் மகன் யாயீர் அர்கோபின் பகுதி முழுவதையும் கேஷூரியர் மற்றும் மாக்காத்தியரின் எல்லைவரை கைப்பற்றினான். அவற்றைத் தன் பெயரால், அதாவது பாசானை, “ஹவ்வோத்-யாயீர்”[b] என்று அழைத்தான்[a]; இன்றுவரை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இத்தொடரின் எபிரெய இலக்கண அமைப்பு மிகவும் சுருக்கமானது; இன்னும் சொல்லுக்குச் சொல்லாக, “அவற்றைத் தன் பெயரின்படி பாசானை ஹவ்வோத்-யாயீர் என்று அழைத்தான்” என மொழிபெயர்க்கலாம். இந்தச் சொற்றொடரின் தொடர்பு சற்றே வேறுவிதமாகவும் புரிந்துகொள்ளப்படலாம்.
    reason: alternative_reading
  - marker: b
    text: “ஹவ்வோத்-யாயீர்” என்பதற்கு “யாயீரின் கிராமங்கள்” அல்லது “யாயீரின் கூடாரக் குடியிருப்புகள்” என்று பொருள் இருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֶבֶל
  choice: பகுதி
  rationale: இந்த நிலவியல் சூழலில் வரையறுக்கப்பட்ட நிலப்பரப்பைக் குறிக்கிறது; நவீன தமிழில் இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: אַרְגֹּב
  choice: அர்கோப்
  rationale: இடப்பெயர் என்பதால் தமிழில் ஒலிபெயர்க்கப்பட்டது.
- source_word: עַד גְּבוּל הַגְּשׁוּרִי וְהַמַּעֲכָתִי
  choice: கேசூரியர் மற்றும் மாக்காத்தியரின் எல்லைவரை
  rationale: גְּבוּל என்பதன் எல்லை/எல்லைப்புறம் என்ற பொருளையும், இனக்குழுக்களைக் குறிக்கும் வடிவங்களையும் இயல்பான தமிழில் தருகிறது.
- source_word: וַיִּקְרָא אֹתָם
  choice: அவற்றுக்கு … பெயரிட்டான்
  rationale: எபிரெய மூலத்திலுள்ள ஆண்பால் பன்மைப் பின்னொட்டின் ‘அவற்றை/அவற்றுக்கு’ என்ற பன்மையை ஒருமையாக மாற்றாமல் காக்கிறது.
- source_word: עַל שְׁמוֹ
  choice: தன் பெயரைத் தழுவி
  rationale: ஒருவர் தன் பெயரையே ஒன்றுக்குச் சூட்டுதல் என்ற எபிரெய மரபுத்தொடரின் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: אֶת הַבָּשָׁן
  choice: அதாவது, பாசானுக்கு
  rationale: சுருக்கமானதும் கடினமானதுமான எபிரெய தொடரை விளக்கும் இணைப்பாகக் காட்டுகிறது; அதன் இலக்கணத் தெளிவின்மை அடிக்குறிப்பில் காக்கப்படுகிறது.
- source_word: חַוֹּת יָאִיר
  choice: ஹவ்வோத்-யாயீர்
  rationale: இது இடப்பெயராகச் செயல்படுவதால் ஒலிபெயர்க்கப்பட்டது; அதன் சொற்பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: இன்றுவரை அப்பெயர் நிலைத்திருக்கிறது
  rationale: கதைசொல்லியின் காலம்வரை அப்பெயர் தொடர்ந்ததை நவீன தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: பன்மையான ‘அவற்றுக்கு’ என்பதற்கும் ஒருமையான ‘பாசான்’ என்பதற்கும் இடையிலான சுருக்கமான தொடர்பு
  choice: மூலத்தின் பன்மையைப் பாதுகாத்து, ‘அதாவது, பாசானுக்கு’ என்பதை விளக்கும் இணைப்பாக வைத்தல்
  alternative: ‘பாசானிலுள்ள குடியிருப்புகளுக்கு’ என்று பொருளைத் தெளிவுபடுத்துதல்
  rationale: மூலத்தில் ‘குடியிருப்புகள்’ என்ற பெயர்ச்சொல் வெளிப்படையாக இல்லை; அதை முதன்மை உரையில் சேர்ப்பது உண்மையான இலக்கணத் தெளிவின்மையைத் தேவையின்றித் தீர்த்துவிடும்.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளும் dignified நடையில் மொழிபெயர்க்கப்பட்டது. எபிரெய மூலத்தின் பன்மை மற்றும் ‘பாசான்’ என்ற ஒருமை இடையே உள்ள இலக்கண அழுத்தம் முற்றிலும் சீராக்கப்படாமல், அடிக்குறிப்புடன் பாதுகாக்கப்பட்டுள்ளது. எல்லா அடிக்குறிப்பு குறிகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
