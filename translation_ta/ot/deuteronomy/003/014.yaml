revisions:
- from: மனாசேயின் மகன் யாயீர், அர்கோபின் பகுதி முழுவதையும் கேசூரியர் மற்றும் மாக்காத்தியரின் எல்லைவரை கைப்பற்றினான். அவற்றுக்குத் தன் பெயரைத் தழுவி—அதாவது, பாசானுக்கு—“ஹவ்வோத்-யாயீர்”[b] என்று பெயரிட்டான்[a]; இன்றுவரை அப்பெயர் நிலைத்திருக்கிறது.
  to: மனாசேயின் மகன் யாயீர் அர்கோபின் பகுதி முழுவதையும் கேஷூரியர் மற்றும் மாக்காத்தியரின் எல்லைவரை கைப்பற்றினான். அவற்றைத் தன் பெயரால், அதாவது பாசானை, “ஹவ்வோத்-யாயீர்”[b] என்று அழைத்தான்[a]; இன்றுவரை.
  rationale: The revision removes the unsupported Tamil dative attached to Bashan, keeps the Hebrew's compressed and disputed naming syntax visible, and retains the alternative understanding in a properly anchored footnote. It also uses conventional Tamil renderings for Manasseh and the Geshurites, while avoiding an unnecessary interpretive expansion at the verse ending.
