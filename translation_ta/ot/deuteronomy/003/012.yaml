base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/012.yaml
  text: And we took possession of this land at that time[a], from Aroer, which is on the Valley of the Arnon, and half the hill country of Gilead with its cities[b]; I gave it to the Reubenites and the Gadites.
translation:
  language: ta
  text: அக்காலத்தில், அர்னோன் பள்ளத்தாக்கின் ஓரத்தில் உள்ள அரோவேர் தொடங்கி, கீலேயாத்தின் மலைநாட்டின் பாதியையும் அதன் நகரங்களையும் உள்ளடக்கிய இந்த நாட்டை நாம் கைப்பற்றினோம்; அதை ரூபனியருக்கும் காதியருக்கும் நான் கொடுத்தேன்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “கீலேயாத் மலையின் பாதியையும்” என்றும் மொழிபெயர்க்கலாம். இங்குள்ள எபிரெயச் சொல் ஒரு தனி மலையையோ அல்லது மலைப்பாங்கான பிரதேசத்தையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָרַשְׁנוּ
  choice: நாம் கைப்பற்றிக்கொண்டோம்
  rationale: வெற்றிகொள்ளுதல் மற்றும் நிலத்தை உடைமையாக்குதல் ஆகிய இரு கருத்துகளையும் இந்தச் சூழலில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: הָאָרֶץ הַזֹּאת
  choice: இந்த நாட்டை
  rationale: கைப்பற்றப்பட்ட நிலப்பரப்பைக் குறிக்கும் இயல்பான நவீனத் தமிழ் சொல்.
- source_word: בָּעֵת הַהִוא
  choice: அக்காலத்தில்
  rationale: எபிரெய temporal expression-ஐ சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: מֵעֲרֹעֵר אֲשֶׁר עַל נַחַל אַרְנֹן
  choice: அர்னோன் பள்ளத்தாக்கின் ஓரத்தில் உள்ள அரோவேர் தொடங்கி
  rationale: מן என்பதன் எல்லைத் தொடக்கத்தையும், על என்பதன் அருகாமை/ஓரக் கருத்தையும், נחל என்பதன் நிலவியல் பொருளையும் காக்கிறது.
- source_word: וַחֲצִי הַר הַגִּלְעָד
  choice: கீலேயாத்தின் மலைநாட்டில் பாதியையும்
  rationale: הַר இங்கு தனியொரு மலையைவிட ஒரு மலைப்பாங்கான பிரதேசத்தைக் குறிக்க வாய்ப்புள்ளதால் நிலப்பங்கீட்டுச் சூழலுக்கு ஏற்றவாறு மொழிபெயர்க்கப்பட்டது.
- source_word: וְעָרָיו
  choice: அதன் நகரங்களையும்
  rationale: கீலேயாத் மலைநாட்டுடன் தொடர்புடைய நகரங்களை suffix இயல்பாகக் குறிக்கிறது.
- source_word: נָתַתִּי
  choice: நான் கொடுத்தேன்
  rationale: முதல் நபர் பன்மையிலிருந்து ஒருமைக்கு மாறும் மூல உரையின் மாற்றத்தை நேரடியாகக் காக்கிறது.
- source_word: לָרֻאוּבֵנִי וְלַגָּדִי
  choice: ரூபனியருக்கும் காதியருக்கும்
  rationale: ஒருமை வடிவிலுள்ள இனப்பெயர்கள் இங்கு குலக்குழுக்களைத் தொகையாகக் குறிப்பதால் தமிழில் மரியாதையான கூட்டுப்பெயர்களாக வழங்கப்பட்டன.
