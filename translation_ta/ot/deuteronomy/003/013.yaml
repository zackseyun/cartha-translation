base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/013.yaml
  text: And the rest of Gilead[a], and all Bashan, the kingdom of Og, I gave to the half-tribe of Manasseh—all the region of Argob, that is, all Bashan. That is called the land of the Rephaim.
translation:
  language: ta
  text: கீலேயாத்தின் எஞ்சிய பகுதியையும், ஓக்கின் இராஜ்யமான பாசான் முழுவதையும் மனாசே கோத்திரத்தின் பாதிப் பிரிவினருக்குக் கொடுத்தேன். அர்கோபின் முழுப் பகுதி உட்பட, பாசான் முழுவதும் ரெபாயீமியரின் நாடு[a] என்று அழைக்கப்படுகிறது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, மரபாக, “ராட்சதர்களின் நாடு.” “ரெபாயீமியர்” என்பது இப்பகுதியுடன் தொடர்புடைய ஒரு பழங்கால மக்களினத்தின் எபிரேயப் பெயர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֶתֶר הַגִּלְעָד
  choice: கீலேயாத்தின் எஞ்சிய பகுதி
  rationale: முன்னர் பகிர்ந்தளிக்கப்பட்ட நிலத்திற்குப் பின் மீந்த பகுதியைக் குறிக்கும் יֶתֶר என்பதன் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: כָל הַבָּשָׁן
  choice: பாசான் முழுவதும்
  rationale: כָל என்பதன் முழுமையான பரப்பைக் காக்கும் இயல்பான தமிழ் அமைப்பு.
- source_word: מַמְלֶכֶת עוֹג
  choice: ஓகின் அரசு
  rationale: இந்த இணைப்புத் தொடர் ஓகுக்குரிய அரசாட்சிப் பகுதியை நேரடியாகக் குறிக்கிறது.
- source_word: נָתַתִּי
  choice: கொடுத்தேன்
  rationale: முதல் நபர் வினை வடிவத்தையும் நிலப் பங்கீட்டின் அடிப்படைப் பொருளையும் விளக்கச் சேர்க்கையின்றிக் காக்கிறது.
- source_word: לַחֲצִי שֵׁבֶט הַמְנַשֶּׁה
  choice: மனாசே கோத்திரத்தின் பாதியினருக்கு
  rationale: ஒரு கோத்திரத்தின் பாதிப் பிரிவைக் குறிக்கும் எபிரெயச் சொல்லை சாதாரண வாசகருக்குத் தெளிவான தமிழில் அளிக்கிறது.
- source_word: כֹּל חֶבֶל הָאַרְגֹּב
  choice: அர்கோபின் பகுதி முழுவதும்
  rationale: חֶבֶל இங்கு கயிற்றை அல்ல, நிலப்பகுதியைக் குறிக்கிறது; ‘பகுதி’ என்பது தெளிவான நவீனத் தமிழ்.
- source_word: לְכָל הַבָּשָׁן
  choice: அதாவது பாசான் முழுவதும்
  rationale: அர்கோபின் பகுதியையும் பாசானின் முழுப் பரப்பையும் விளக்கமான இணைப்பில் வைக்கும் சூழல்சார் பொருளைத் தருகிறது; மூலத்தின் சுருக்கமான உறவு முற்றிலும் வெளிப்படையானதல்ல.
- source_word: יִקָּרֵא
  choice: என்று அழைக்கப்படுகிறது
  rationale: எபிரெய மொழியின் செயல்பாட்டு/வழக்கப் பெயரிடலை நிகழ்காலப் பொதுவழக்காக நேரடியாக வெளிப்படுத்துகிறது.
- source_word: אֶרֶץ רְפָאִים
  choice: ரெபாயீமியரின் நாடு
  rationale: רְפָאִים என்பதை விளக்கவுரையாக ‘ராட்சதர்கள்’ என்று மாற்றாமல், பழங்குடியினப் பெயராக ஒலிபெயர்த்து மூலத்தின் சொற்பொருள் வெளிப்படைத்தன்மையைப் பாதுகாக்கிறது.
theological_decisions:
- issue: רְפָאִים என்பதை ஒரு மக்களினப் பெயராக ஒலிபெயர்ப்பதா அல்லது ‘ராட்சதர்கள்’ என்று பொருளாக்குவதா
  choice: ரெபாயீமியரின் நாடு
  alternative: ராட்சதர்களின் நாடு
  rationale: இவ்விடத்தில் எபிரெயச் சொல் ஒரு பழங்கால மக்களினத்தின் பெயராகச் செயல்படுகிறது. முதன்மை உரையில் ஒலிபெயர்ப்பது விளக்கத்தைத் திணிக்காமல் மூலத்தின் தெளிவின்மையைக் காக்கிறது; மரபான பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான உரைநடை பயன்படுத்தப்பட்டுள்ளது. இடப்பெயர்களும் மக்களினப் பெயரும் தமிழில் எளிதாக வாசிக்கக்கூடிய வகையில் ஒலிபெயர்க்கப்பட்டுள்ளன; விளக்கவுரை முதன்மை உரைக்குள் திணிக்கப்படவில்லை.
