  yaml_path: translation/ot/deuteronomy/003/015.yaml
  text: And to Machir I gave Gilead[a].
translation:
  language: ta
  text: மேலும், மாகீருக்குக் கிலேயாத்தைக் கொடுத்தேன்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/לְ/מָכִיר
  choice: மாகீருக்கு
  rationale: לְ- இங்குப் பெறுநரைக் குறிக்கும் நான்காம் வேற்றுமை உருபாக இயல்பாக மொழிபெயர்க்கப்படுகிறது; מָכִיר என்ற ஆள்பெயர் தமிழில் ‘மாகீர்’ என ஒலிபெயர்க்கப்படுகிறது. தொடக்க וְ- சுற்றியுள்ள பங்கீட்டு வரிசையோடு இணைக்கிறது; தமிழில் வாக்கியத் தொடர்ச்சியால் அந்த இணைப்பு இயல்பாக வெளிப்படுவதால் தனியே ‘மேலும்’ சேர்க்கப்படவில்லை.
- source_word: נָתַתִּי
  choice: கொடுத்தேன்
  rationale: נתן என்பதன் கால் நிறைவுவினை, முதல் நபர் ஒருமை வடிவம். கடந்தகாலப் பகிர்ந்தளிப்பை நேரடியாகவும் இயல்பாகவும் ‘கொடுத்தேன்’ வெளிப்படுத்துகிறது.
- source_word: אֶת
  choice: '[நேரடிச் செயப்படுபொருள் குறியீடு தனியாக மொழிபெயர்க்கப்படவில்லை]'
  rationale: இது திட்டவட்டமான நேரடிச் செயப்படுபொருளைக் குறிக்கும் இலக்கணத் துகள்; தமிழில் தனிச் சொல் இணை இல்லை. ‘கிலேயாத்தை’ என்பதிலுள்ள ஐ வேற்றுமை உருபில் அதன் செயற்பாடு வெளிப்படுகிறது.
- source_word: הַגִּלְעָד
  choice: கிலேயாத்தை
  rationale: גִּלְעָד என்ற நிலப்பெயர் ‘கிலேயாத்’ என ஒலிபெயர்க்கப்பட்டு, நேரடிச் செயப்படுபொருளாக ஐ உருபைப் பெறுகிறது. எபிரெயக் குறிப்புச் சுட்டு הַ- உள்ளபோதிலும், தமிழில் நிலப்பெயருக்கு ‘அந்த’ சேர்ப்பது இயல்பற்றதும் தேவையற்றதும் ஆகும்.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழில் சுருக்கமான, கண்ணியமான வரலாற்றுக் கூற்று. பொருள் தெளிவாக இருப்பதால் எழுவாய் ‘நான்’ தனியே சேர்க்கப்படவில்லை; அது ‘கொடுத்தேன்’ என்ற வினைமுற்றிலேயே வெளிப்படுகிறது. எபிரெயத்தில் உள்ள இடப்பெயரின் குறிப்புச் சுட்டுக்காக அடிக்குறிப்பு தரப்படவில்லை; தமிழிலும் இத்தகைய இடப்பெயர் இயல்பாகச் சுட்டுச்சொல் இன்றியே வரும்.
