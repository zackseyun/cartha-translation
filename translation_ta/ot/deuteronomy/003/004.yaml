  text: וַ/נִּלְכֹּ֤ד אֶת כָּל עָרָי/ו֙ בָּ/עֵ֣ת הַ/הִ֔וא לֹ֤א הָֽיְתָה֙ קִרְיָ֔ה אֲשֶׁ֥ר לֹא לָקַ֖חְנוּ מֵֽ/אִתָּ֑/ם שִׁשִּׁ֥ים עִיר֙ כָּל חֶ֣בֶל אַרְגֹּ֔ב מַמְלֶ֥כֶת ע֖וֹג בַּ/בָּשָֽׁן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/004.yaml
  text: 'And we captured all his cities at that time; there was not a city that we did not take from them: sixty cities[a], all the region of Argob, the kingdom of Og in Bashan.'
translation:
  language: ta
  text: 'அந்தக் காலத்தில் அவனுடைய எல்லா நகரங்களையும் கைப்பற்றினோம். அவர்களிடமிருந்து[a] நாம் கைப்பற்றாத ஒரு நகரம்கூட இல்லை: அறுபது நகரங்கள்—பாசானிலுள்ள ஓகின் அரசுக்கு உட்பட்ட அர்கோபுப் பகுதி முழுவதும்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அவர்களிடமிருந்து” என்று எபிரெயத்தில் பன்மையில் உள்ளது; இது ஓக் ஒருவனை மட்டும் அல்லாமல், அவனுடைய மக்களையோ படைகளையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַנִּלְכֹּד
  choice: கைப்பற்றினோம்
  rationale: לכד என்ற வினை போரில் ஒரு இடத்தைக் கைப்பற்றுவதைக் குறிக்கிறது; “கைப்பற்றினோம்” என்பது அதன் இராணுவச் சூழலைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: כָּל עָרָיו
  choice: அவனுடைய நகரங்கள் அனைத்தையும்
  rationale: עיר என்பதற்கு “நகரம்” என்று இயல்பாக மொழிபெயர்க்கப்பட்டுள்ளது; ஒருமை ஆண்பால் பின்னொட்டு ஓகைக் குறிக்கிறது.
- source_word: בָּעֵת הַהִוא
  choice: அந்தக் காலத்தில்
  rationale: எபிரெயத்தின் பொதுவான காலக் குறிப்பை நவீனத் தமிழில் இயல்பாகவும் முறையாகவும் தருகிறது.
- source_word: לֹא הָיְתָה קִרְיָה אֲשֶׁר לֹא לָקַחְנוּ מֵאִתָּם
  choice: அவர்களிடமிருந்து நாம் கைப்பற்றாத ஒரு நகரம்கூட இல்லை
  rationale: இரட்டை மறுப்பின் வலியுறுத்தலையும் தொடர்பு வாக்கிய அமைப்பையும் காக்கிறது. מֵאִתָּם என்பதிலுள்ள பன்மையை “அவர்களிடமிருந்து” என வெளிப்படையாகப் பாதுகாக்கிறது.
- source_word: שִׁשִּׁים עִיר
  choice: அறுபது நகரங்கள்
  rationale: எண்ணும் பெயர்ச்சொல்லும் கொண்ட நேரடியான அமைப்பு; வசனத்தின் முந்தைய “நகரங்கள்” என்ற சொல்லுடனும் ஒருமைப்பாட்டைக் காக்கிறது.
- source_word: כָּל חֶבֶל אַרְגֹּב
  choice: அர்கோபின் பகுதி முழுவதும்
  rationale: חבל இங்கு ஒரு நிலப்பகுதி அல்லது மாவட்டத்தைக் குறிக்கிறது; “பகுதி” என்பது பொதுவாசகர்களுக்குத் தெளிவான நவீனச் சொல்.
- source_word: מַמְלֶכֶת עוֹג בַּבָּשָׁן
  choice: பாசானிலிருந்த ஓகின் அரசைச் சேர்ந்த
  rationale: அர்கோபின் பகுதி பாசானில் இருந்த ஓகின் அரசுக்குரியது என்பதை இயல்பான தமிழில் தெளிவுபடுத்துகிறது; மூலத்தின் புவியியல் மற்றும் அரசியல் தொடர்பை மாற்றவில்லை.
