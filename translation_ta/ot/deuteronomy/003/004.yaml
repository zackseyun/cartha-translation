  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. எபிரெய உரையின் மீளுரையும் வலியுறுத்தலும் காக்கப்பட்டுள்ளன; மֵאִתָּם என்பதிலுள்ள பன்மை ஒருமையாகச் சீராக்கப்படவில்லை.
