source:
  edition: WLC
  text: וַ/יִּתְעַבֵּ֨ר יְהוָ֥ה בִּ/י֙ לְמַ֣עַנְ/כֶ֔ם וְ/לֹ֥א שָׁמַ֖ע אֵלָ֑/י וַ/יֹּ֨אמֶר יְהוָ֤ה אֵלַ/י֙ רַב לָ֔/ךְ אַל תּ֗וֹסֶף דַּבֵּ֥ר אֵלַ֛/י ע֖וֹד בַּ/דָּבָ֥ר הַ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/026.yaml
  text: But Yahweh was angry with me because of you and did not listen to me[a], and Yahweh said to me, “Enough from you[b]; do not speak to me again about this matter.”
translation:
  language: ta
  text: ஆனால் உங்கள் காரணமாக[a] யாவே என்மீது கோபமடைந்து, எனக்குச் செவிகொடுக்கவில்லை. யாவே என்னிடம், “போதும்![b] இந்தக் காரியத்தைப் பற்றி இனி என்னிடம் பேசாதே” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘உங்கள் பொருட்டு’ / ‘உங்கள்நிமித்தம்.’
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில், ‘உனக்குப் போதும்.’ இது உரையாடலைக் கூர்மையாக முடிக்கும் மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְעַבֵּר
  choice: கோபமடைந்து
  rationale: இந்த எபிரெயச் சொற்றொடர் யாவே மோசேயின்மீது கோபம் கொண்டதைக் குறிக்கிறது. ‘கோபமடைந்து’ என்பது பொருளை மிகைப்படுத்தாமல் இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இது பட்டப்பெயர் அல்ல, எபிரெய வேதமொழியில் வரும் இறைநாமம்; ஆகவே தமிழில் ஒலிபெயர்த்து வழங்கப்பட்டுள்ளது.
- source_word: בִּי
  choice: என்மீது
  rationale: கோபத்தைக் குறிக்கும் இந்தச் சூழலில் ‘என்மீது கோபமடைந்து’ என்பது இயல்பான தமிழ்ச் சேர்க்கை.
- source_word: לְמַעַנְכֶם
  choice: உங்கள் காரணமாக
  rationale: இச்சூழலில் மக்கள் காரணமாக யாவே மோசேயின்மீது கோபமடைந்தார் என்ற காரணப் பொருளை நேரடியாகத் தெரிவிக்கிறது; ‘உங்கள் பொருட்டு’ என்ற பொருளும் வடிவில் சாத்தியம் என்பதால் அடிக்குறிப்பு தரப்பட்டுள்ளது.
- source_word: וְלֹא שָׁמַע אֵלָי
  choice: எனக்குச் செவிகொடுக்கவில்லை
  rationale: שׁמע உடன் אֶל வரும்போது வெறுமனே ஒலியைக் கேட்பதைவிட வேண்டுகோளை ஏற்காமல் இருப்பதைக் குறிக்கிறது; ‘செவிகொடுக்கவில்லை’ அந்த நுணுக்கத்தைத் தக்கவைக்கிறது.
- source_word: רַב לָךְ
  choice: போதும்!
  rationale: இந்தச் சுருக்கமான எபிரெய மரபுத்தொடர் கூர்மையான மறுப்பை வெளிப்படுத்துகிறது. தமிழில் ‘போதும்!’ இயல்பாக அதே வலிமையைத் தருகிறது; சொற்கூறு அடிக்குறிப்பில் குறிப்பிடப்பட்டுள்ளது.
- source_word: אַל תּוֹסֶף דַּבֵּר ... עוֹד
  choice: இனி ... பேசாதே
  rationale: יסף மற்றும் עוֹד இணைந்து செயலைத் தொடரவோ மீண்டும் செய்யவோ கூடாது என்பதைக் குறிக்கின்றன; ‘இனி பேசாதே’ என்பது சுருக்கமாகவும் இயல்பாகவும் உள்ளது.
- source_word: בַּדָּבָר הַזֶּה
  choice: இந்தக் காரியத்தைப் பற்றி
  rationale: דבר இங்கு ஒரு பொருளையோ வார்த்தையையோ அல்ல, விவாதிக்கப்படும் வேண்டுகோள் சார்ந்த காரியத்தைக் குறிக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைநாமத்தை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலத்தில் தனிப்பட்ட இறைநாமமான நான்கு எழுத்துப் பெயர் நேரடியாக வருகிறது. அதனை ஒரு பட்டப்பெயரால் மாற்றாமல் தமிழில் ‘யாவே’ என்று ஒலிபெயர்ப்பது மூலத்தின் தன்மையைப் பாதுகாக்கிறது.
- issue: மக்களுக்கும் மோசேயின் தண்டனைக்கும் உள்ள காரணத் தொடர்பு
  choice: உங்கள் காரணமாக
  alternative: உங்கள் பொருட்டு
  rationale: לְמַעַנְכֶם வடிவம் நோக்கம் அல்லது நன்மை என்ற பொருளையும் சில சூழல்களில் தரலாம்; ஆனால் இங்கு மோசே மக்களுடைய செயல்களைத் தன் மீதான யாவேயின் கோபத்திற்குக் காரணமாகச் சுட்டுவதால் காரணப் பொருள் முதன்மையாக உள்ளது. மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீனத் தரத் தமிழில், மரியாதையும் உரையின் நேரடியான கண்டிப்பும் ஒன்றாகப் பாதுகாக்கப்பட்டுள்ளன. மக்களை நோக்கிப் பேசும்போது ‘உங்கள்’ என்றும், யாவே மோசேயை ஒருமையில் நேரடியாகக் கண்டிக்கும்போது ‘பேசாதே’ என்றும் எண் வேறுபாடு காக்கப்பட்டுள்ளது.
