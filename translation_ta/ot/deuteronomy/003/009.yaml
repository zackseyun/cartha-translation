translation_notes:
  register: நவீன செந்தமிழை அடிப்படையாகக் கொண்ட, பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. எபிரேயத்தில் இல்லாத ‘மலை’ சேர்க்கப்படவில்லை; இனப்பெயரின் தொகுப்பொருள் தமிழில் இயல்பான பன்மையால் வெளிப்படுத்தப்பட்டது. வசனத்தின் தொடர்ச்சியைச் சுட்டும் இறுதி நீண்ட கோடு பாதுகாக்கப்பட்டது.
