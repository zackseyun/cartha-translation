  text: צִידֹנִ֛ים יִקְרְא֥וּ לְ/חֶרְמ֖וֹן שִׂרְיֹ֑ן וְ/הָ֣/אֱמֹרִ֔י יִקְרְאוּ ל֖/וֹ שְׂנִֽיר־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/009.yaml
  text: The Sidonians call Hermon Sirion[b][a], and the Amorites call it Senir—
translation:
  language: ta
  text: சீதோனியர்கள் எர்மோனைச் சிரியோன் என்று அழைக்கிறார்கள்; எமோரியர்களோ அதைச் செனீர் என்று அழைக்கிறார்கள்—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: צִידֹנִים
  choice: சீதோனியர்கள்
  rationale: சீதோன் மக்களைக் குறிக்கும் பன்மை இனப்பெயர்; தமிழில் இயல்பான மக்கள் பெயராக வழங்கப்பட்டது.
- source_word: יִקְרְאוּ
  choice: என்று அழைக்கிறார்கள்
  rationale: ל உடன் வரும் קרא இங்கு பெயரிடுதல் அல்லது ஒரு பெயரால் அழைத்தல் என்ற பொருளுடையது; நவீன தமிழில் இயல்பாக ‘என்று அழைக்கிறார்கள்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: לְחֶרְמוֹן
  choice: எர்மோனை
  rationale: எர்மோன் என்ற இடப்பெயரே எபிரேய மூலத்தில் உள்ளது; ‘மலை’ என்ற சொல் இவ்வசனத்தில் வெளிப்படையாக இல்லாததால் சேர்க்கப்படவில்லை.
- source_word: שִׂרְיֹן
  choice: சிரியோன்
  rationale: சீதோனியர்கள் எர்மோனுக்கு வழங்கிய பெயர்; பொருள் மொழிபெயர்க்காமல் ஒலிபெயர்க்கப்பட்டது.
- source_word: וְהָאֱמֹרִי
  choice: எமோரியர்களோ
  rationale: வடிவத்தில் ஒருமையாக இருந்தாலும் இங்கு இனம் முழுவதையும் குறிக்கும் தொகுப்பொருள் கொண்டது; பன்மை வினையுடனும் இணை அமைப்புடனும் பொருந்த தமிழில் பன்மையாக வழங்கப்பட்டது. ‘-ஓ’ எதிரிணை/ஒப்பீட்டு மாற்றத்தை இயல்பாகக் காட்டுகிறது.
- source_word: יִקְרְאוּ לוֹ
  choice: அதைச் … என்று அழைக்கிறார்கள்
  rationale: பதிலிப்பெயர் முன் குறிப்பிடப்பட்ட எர்மோனைக் குறிக்கிறது; பெயரிடும் பொருளை இயல்பான தமிழ்ச் சொல்லமைப்பில் வெளிப்படுத்துகிறது.
- source_word: שְׂנִיר
  choice: செனீர்
  rationale: எமோரியர்கள் எர்மோனுக்கு வழங்கிய பெயர்; வழக்கமான ஒலிபெயர்ப்பு வடிவம் பயன்படுத்தப்பட்டது.
