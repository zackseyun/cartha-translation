  yaml_path: translation/ot/deuteronomy/003/007.yaml
  text: But all the livestock and the spoil of the cities we took as plunder for ourselves[a].
translation:
  language: ta
  text: ஆனால் கால்நடைகள் அனைத்தையும் நகரங்களின் கொள்ளைப் பொருளையும் நமக்காகக் கொள்ளையாக எடுத்துக்கொண்டோம்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மேலும் கால்நடைகள் அனைத்தையும் நகரங்களின் கொள்ளைப் பொருளையும் நமக்காகக் கொள்ளையிட்டோம்.”
    reason: இணைப்புச் சொல்லையும் בזז என்ற வினையையும் மேலும் நேரடியாக மொழிபெயர்க்கும் சாத்தியமான மாற்று.
lexical_decisions:
- source_word: וְ/כָל
  choice: ஆனால் … அனைத்தையும்
  rationale: வாவ் முந்தைய வசனத்தில் மக்களை முற்றிலும் அழித்ததற்கும் இங்கே கால்நடைகளையும் பொருள்களையும் எடுத்துக்கொண்டதற்கும் இடையிலான மென்மையான எதிர்மறைத் தொடர்பைக் காட்டுகிறது; כָּל என்பதன் முழுமையையும் ‘அனைத்தையும்’ காக்கிறது.
- source_word: הַ/בְּהֵמָה
  choice: கால்நடைகள்
  rationale: இச்சூழலில் בְּהֵמָה நகரவாசிகள் வளர்த்த வீட்டுவிலங்குகளை மொத்தமாகக் குறிக்கிறது; ‘கால்நடைகள்’ என்பது இயல்பான, துல்லியமான நவீனத் தமிழ்.
- source_word: וּ/שְׁלַל
  choice: கொள்ளைப் பொருளையும்
  rationale: שָׁלָל போரில் கைப்பற்றப்பட்ட பொருள்களைக் குறிக்கிறது; ‘கொள்ளைப் பொருள்’ அந்த இராணுவச் சூழலைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: הֶ/עָרִים
  choice: நகரங்களின்
  rationale: எபிரெயக் கட்டமைப்பிலுள்ள உரிமைத் தொடர்பை நேரடியாகக் காக்கிறது; இவை அந்த நகரங்களுக்குரிய அல்லது அவற்றிலிருந்து கைப்பற்றப்பட்ட பொருள்கள்.
- source_word: בַּזּוֹנוּ
  choice: கொள்ளையாக எடுத்துக்கொண்டோம்
  rationale: בזז என்பது கொள்ளையிடுதல் அல்லது போர்க்கொள்ளையாக எடுத்தல் என்று பொருள்படும்; இத்தொடர் செயலைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: לָֽ/נוּ
  choice: நமக்கென
  rationale: முதல் நபர் பன்மைக்கான பயனாளித் தொடர்பைச் சுருக்கமாகக் காட்டி, அவற்றைத் தங்களுக்குச் சொந்தமாக எடுத்துக்கொண்ட கருத்தை வெளிப்படுத்துகிறது.
