translation_notes:
  register: நவீன தரத் தமிழில், கண்ணியமான ஆனால் பொதுவாசகர்களுக்கு எளிதில் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. நீண்ட எபிரெய எல்லை விவரிப்பு தமிழில் தெளிவாக இருக்க இரண்டு வாக்கியங்களாக அமைக்கப்பட்டுள்ளது. இடப்பெயர்கள் தமிழ் வேதாகம மரபுக்கு நெருக்கமாக ஒலிபெயர்க்கப்பட்டுள்ளன.
