base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/016.yaml
  text: And to the Reubenites and to the Gadites I gave from Gilead as far as the Arnon Valley[a], the middle of the valley as a border, and as far as the Jabbok Valley[b], the border of the sons of Ammon.
translation:
  language: ta
  text: ரூபேனியருக்கும் காதியருக்கும் கீலேயாத்திலிருந்து அர்னோன் பள்ளத்தாக்கு[a] வரை கொடுத்தேன்; பள்ளத்தாக்கின் நடுப்பகுதி எல்லையாக இருந்தது; மேலும், அம்மோன் மக்களின் எல்லையான யாப்போக்கு பள்ளத்தாக்கு[b] வரையும் கொடுத்தேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயச் சொல் נַחַל என்பது ஓடை, வறண்ட ஓடைப்படுகை, அல்லது அதனுடன் தொடர்புடைய பள்ளத்தாக்கைக் குறிக்கலாம். அடுத்த சொற்றொடர் பள்ளத்தாக்கின் நடுப்பகுதியை எல்லையாகக் குறிப்பிடுவதால் இங்கே “பள்ளத்தாக்கு” என்று மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயச் சொல் נַחַל என்பதற்கு “ஓடை” அல்லது “ஓடைப் பள்ளத்தாக்கு” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָרֻאוּבֵנִי
  choice: ரூபேனியருக்கும்
  rationale: எபிரெய வடிவம் மூதாதையான ரூபேன் என்ற தனிநபரை அல்ல, அவரது கோத்திர மக்களைக் குறிக்கிறது.
- source_word: לַגָּדִי
  choice: காதியருக்கும்
  rationale: இனக்குழுப் பெயர் நிலத்தைப் பெற்ற காத் கோத்திரத்தாரைக் குறிக்கிறது.
- source_word: נָתַתִּי
  choice: கொடுத்தேன்
  rationale: נתן என்பதன் எளிய பொருளைப் பாதுகாக்கிறது; சூழலில் இது நிலப்பகுதியை ஒதுக்கிக் கொடுத்ததைக் குறிக்கிறது.
- source_word: מִן הַגִּלְעָד
  choice: கீலேயாத்திலிருந்து
  rationale: நிலப்பரப்பின் தொடக்க எல்லையை இயல்பான தமிழில் குறிக்கிறது.
- source_word: עַד נַחַל אַרְנֹן
  choice: அர்னோன் பள்ளத்தாக்கு வரையிலான
  rationale: נחל என்பது ஓடை, வறண்ட ஓடைப்படுகை, அல்லது அதனுடன் தொடர்புடைய பள்ளத்தாக்கைக் குறிக்கலாம்; அடுத்த சொற்றொடர் அதன் நடுப்பகுதியை எல்லையாகக் கூறுவதால் ‘பள்ளத்தாக்கு’ பொருத்தமானது.
- source_word: תּוֹךְ הַנַּחַל וּגְבֻל
  choice: பள்ளத்தாக்கின் நடுப்பகுதி எல்லையாக இருந்தது
  rationale: தெளிவுபடுத்தும் உடனிணைப்பு உறவை இயல்பான தமிழில் வெளிப்படுத்துகிறது; எல்லைக் கோடு பள்ளத்தாக்கின் நடுவில் இருந்தது என்பதைச் சொல்கிறது.
- source_word: עַד יַבֹּק הַנַּחַל
  choice: யாப்போக்கு பள்ளத்தாக்கு வரையிலும்
  rationale: முந்தைய נחל என்பதற்குத் தேர்ந்த ‘பள்ளத்தாக்கு’ என்ற சொல்லைத் தொடர்ச்சியாகப் பயன்படுத்துகிறது.
- source_word: גְּבוּל בְּנֵי עַמּוֹן
  choice: அம்மோனின் மக்களின் எல்லையான
  rationale: ‘அம்மோனின் மகன்கள்’ என்ற எபிரெய உறவுமுறைச் சொல்லை, அதன் மக்கள் சார்ந்த பொருளுடன் தமிழில் இயல்பாகவும் நெருக்கமாகவும் தருகிறது.
