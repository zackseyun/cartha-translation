source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֤ה אֵלַ/י֙ אַל תִּירָ֣א אֹת֔/וֹ כִּ֣י בְ/יָדְ/ךָ֞ נָתַ֧תִּי אֹת֛/וֹ וְ/אֶת כָּל עַמּ֖/וֹ וְ/אֶת אַרְצ֑/וֹ וְ/עָשִׂ֣יתָ לּ֔/וֹ כַּ/אֲשֶׁ֣ר עָשִׂ֗יתָ לְ/סִיחֹן֙ מֶ֣לֶךְ הָֽ/אֱמֹרִ֔י אֲשֶׁ֥ר יוֹשֵׁ֖ב בְּ/חֶשְׁבּֽוֹן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/002.yaml
  text: And Yahweh said to me, “Do not fear him, for I have given him, all his people, and his land into your hand; and you shall do to him just as you did to Sihon king of the Amorites, who lived in Heshbon.”
translation:
  language: ta
  text: யாவே என்னிடம், “அவனுக்குப் பயப்படாதே; ஏனெனில், அவனையும் அவனுடைய மக்கள் அனைவரையும் அவனுடைய நாட்டையும் உன் கையில் ஒப்புக்கொடுத்துவிட்டேன். எஸ்போனில் வாழ்ந்த எமோரியர்களின் அரசன் சீகோனுக்கு நீ செய்ததுபோலவே அவனுக்கும் செய்வாய்” என்றார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: யெகோவா
  rationale: தேவனுடைய தனிப்பெயரைப் பொதுப்பட்டமாக மாற்றாமல், நவீனத் தமிழில் பரவலாக அறியப்படும் வடிவில் தருகிறது.
- source_word: אַל תִּירָא אֹתוֹ
  choice: அவனுக்குப் பயப்படாதே
  rationale: எபிரெய எதிர்மறைக் கட்டளையையும் வெளிப்படையான செயப்படுபொருளையும் இயல்பான தமிழில் நேரடியாகக் காக்கிறது.
- source_word: בְיָדְךָ נָתַתִּי
  choice: உன் கையில் ஒப்புக்கொடுத்துவிட்டேன்
  rationale: ‘கையில்’ என்ற மூல உருவகத்தைத் தக்கவைத்து, நிறைவேறியதாகக் கூறப்படும் ஒப்படைப்பின் விளைவுநிலையையும் ‘விட்டேன்’ மூலம் வெளிப்படுத்துகிறது.
- source_word: וְאֶת כָּל עַמּוֹ וְאֶת אַרְצוֹ
  choice: அவனுடைய மக்கள் அனைவரையும் அவனுடைய நாட்டையும்
  rationale: עַם என்பதை ‘படை’ என்று குறுக்காமல் ‘மக்கள்’ என்றும், אֶרֶץ என்பதை இச்சூழலில் ‘நாடு’ என்றும் தருகிறது.
- source_word: וְעָשִׂיתָ לּוֹ
  choice: அவனுக்கும் செய்வாய்
  rationale: עשה என்ற பரந்த வினையின் பொருளை மிகையாக விளக்காமல், அடுத்த ஒப்பீட்டு வாக்கியம் அதன் உள்ளடக்கத்தை நிர்ணயிக்க விடுகிறது.
- source_word: כַּאֲשֶׁר עָשִׂיתָ
  choice: நீ செய்ததுபோலவே
  rationale: ஒப்பீட்டின் துல்லியமான வலிமையை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: לְסִיחֹן מֶלֶךְ הָאֱמֹרִי
  choice: எமோரியர்களின் அரசன் சீகோனுக்கு
  rationale: அரசனுக்கும் இனக்குழுவுக்கும் உள்ள உறவைத் தெளிவாகக் காட்டும் இயல்பான தமிழ்ச் சொற்றொடர்.
- source_word: אֲשֶׁר יוֹשֵׁב בְּחֶשְׁבּוֹן
  choice: எஸ்போனில் வாழ்ந்த
  rationale: ישב என்ற பங்கேற்புவினையின் குடியிருத்தல் பொருளை பழமையான நடையின்றி வாசிக்க எளிதாகத் தருகிறது.
theological_decisions:
- issue: יְהוָה என்ற தேவனுடைய பெயரை மொழிபெயர்த்தல்
  choice: யெகோவா
  alternative: யாவே
  rationale: மூலத்தில் வரும் தனிப்பெயரை ‘ஆண்டவர்’ என்ற பட்டமாக மாற்றாமல் பாதுகாக்கிறது; தமிழில் நிலைபெற்ற அடையாள வடிவமான ‘யெகோவா’ தேர்ந்தெடுக்கப்பட்டது. உச்சரிப்பை மீளமைக்கும் மாற்று வடிவமாக ‘யாவே’ உள்ளது.
translation_notes:
  register: நவீனத் தரத் தமிழ்; நேரடியான, கண்ணியமான உரைநடை. ‘உன் கையில்’ என்ற எபிரெய உருவகம் தக்கவைக்கப்பட்டுள்ளது; தேவையற்ற போரியல் விளக்கம் சேர்க்கப்படவில்லை.
