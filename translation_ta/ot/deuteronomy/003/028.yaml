base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/028.yaml
  text: But commission Joshua[a], and strengthen him and encourage him, for he will cross over before this people[c][b], and he will cause them to inherit the land that you will see.
translation:
  language: ta
  text: ஆனால் யோசுவாவுக்கு ஆணையிட்டு[a], அவனைப் பலப்படுத்தி, தைரியப்படுத்து[b]. ஏனெனில், அவன் இந்த மக்களுக்கு முன்பாகக் கடந்து செல்வான்; நீ காணப்போகும் அந்த நாட்டை அவர்கள் உரிமையாகப் பெறச் செய்வான்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘யோசுவாவுக்குக் கட்டளையிட்டு’ அல்லது ‘யோசுவாவுக்கு அதிகாரபூர்வமாகப் பொறுப்பளித்து’ என்றும் மொழிபெயர்க்கலாம். எபிரெய வினை இங்கே தலைமைப் பொறுப்பை ஒப்படைக்கும் அதிகாரபூர்வ ஆணையைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘அவனை மனத்திடமுள்ளவனாக்கு’ என்றும் மொழிபெயர்க்கலாம். ‘பலப்படுத்து,’ ‘தைரியப்படுத்து’ என்ற இணை வினைகள் உறுதியையும் தைரியத்தையும் அளிப்பதைச் சுட்டுகின்றன.
    reason: lexical_alternative
  - marker: c
    text: '‘அவர்களுக்கு நாட்டை உரிமையாகக் கொடுப்பான்’ என்றும் மொழிபெயர்க்கலாம். எபிரெய வினை காரணவினை வடிவில் உள்ளது: மக்கள் தங்கள் உரிமையைப் பெறுவதற்கு யோசுவா செயற்பாட்டுக் கருவியாக இருப்பான்.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְצַו אֶת־יְהוֹשֻׁעַ
  choice: யோசுவாவுக்கு ஆணையிட்டு
  rationale: צוה என்பதன் பியேல் ஏவல் வடிவம் யோசுவாவுக்கு அதிகாரபூர்வமான பொறுப்புக் கட்டளையை வழங்குவதைக் குறிக்கிறது. ‘ஆணையிட்டு’ என்பது கட்டளையின் வலிமையை இயல்பான தமிழில் காக்கிறது; அதிகாரபூர்வமாகப் பொறுப்பளிக்கும் நுணுக்கம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: וְחַזְּקֵהוּ
  choice: அவனைப் பலப்படுத்தி
  rationale: חזק என்பதன் பியேல் வடிவம் ஒருவரைப் பலமுள்ளவராக அல்லது உறுதியுள்ளவராக ஆக்குவதைக் குறிக்கிறது. ‘பலப்படுத்தி’ என்பது causative வலிமையையும் ஏவல் தொடரையும் காக்கிறது.
- source_word: וְאַמְּצֵהוּ
  choice: அவனுக்குத் துணிவூட்டு
  rationale: אמץ, חזק உடன் இணைந்து வரும்போது மனத்திடத்தையும் துணிவையும் அளித்தலைக் குறிக்கிறது. ‘துணிவூட்டு’ முதல் வினையிலிருந்து வேறுபட்டாலும் அதனோடு இணையும் பொருளை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: כִּי הוּא יַעֲבֹר
  choice: ஏனெனில், அவனே … கடந்து செல்வான்
  rationale: עבר இச்சூழலில் யோர்தானைக் கடப்பதைக் குறிக்கிறது. தனிப்பட்ட சுட்டுப்பெயரான הוּא வலியுறுத்தலுடன் இருப்பதால் ‘அவனே’ என மொழிபெயர்க்கப்படுகிறது.
- source_word: לִפְנֵי הָעָם הַזֶּה
  choice: இந்த மக்களுக்கு முன்பாக
  rationale: לִפְנֵי இடநிலையாக ‘முன்பாக’ என்பதையும், சூழலில் தலைமை தாங்கிச் செல்வதையும் உணர்த்தலாம். ‘முன்பாக’ மூலத்தின் திறந்த நுணுக்கத்தைத் தக்கவைக்கிறது.
- source_word: וְהוּא יַנְחִיל אוֹתָם
  choice: அவர்களுக்கு உரிமைச்சொத்தாகக் கிடைக்கச் செய்வான்
  rationale: 'נחל என்பதன் ஹிஃபில் வடிவம் causative: யோசுவா மூலமாக மக்கள் நாட்டைத் தங்கள் சுதந்தர உரிமையாகப் பெறுவர். ‘கிடைக்கச் செய்வான்’ அந்த causative பொருளைத் தெளிவாகக் காக்கிறது.'
- source_word: הָאָרֶץ אֲשֶׁר תִּרְאֶה
  choice: நீ காணப்போகும் நாட்டை
  rationale: இது மோசே பார்க்க அனுமதிக்கப்படும் நாட்டைக் குறிக்கிறது. இச்சூழலில் imperfect எதிர்கால நோக்குடையதால் ‘காணப்போகும்’ இயல்பாகவும் துல்லியமாகவும் உள்ளது.
theological_decisions:
- issue: யோசுவாவின் பங்கு மற்றும் நாட்டைச் சுதந்தரமாகப் பெறுதல்
  choice: ‘அவர்களுக்கு உரிமைச்சொத்தாகக் கிடைக்கச் செய்வான்’ என்று causative வடிவில் மொழிபெயர்க்கப்பட்டது.
  alternative: ‘அவர்களுக்கு நாட்டைக் கொடுப்பான்’ அல்லது ‘அவர்கள் நாட்டை உரிமையாக்க வழிநடத்துவான்.’
  rationale: எபிரெய ஹிஃபில் வடிவம் யோசுவா தனக்குச் சொந்தமான நாட்டைக் கொடுப்பவன் என்று கூறாமல், மக்கள் தங்கள் உரிமைச்சொத்தைப் பெறுவதற்கான செயற்பாட்டுக் கருவியாக இருப்பதைத் தெரிவிக்கிறது. இந்த இறையியல் நெருக்கடியைத் தீர்த்துவிடாமல் இலக்கண causative பொருள் காக்கப்படுகிறது.
translation_notes:
  register: நவீன செந்தமிழுக்கு ஏற்ற, பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘ஆணையிட்டு,’ ‘பலப்படுத்தி,’ ‘துணிவூட்டு’ என்ற தொடர் எபிரெய ஏவல் வினைகளின் வலிமையைத் தக்கவைக்கிறது. ‘முன்பாக’ என்பது இடநிலையையும் தலைமை நுணுக்கத்தையும் மிகையாக விளக்காமல் காக்கிறது.
