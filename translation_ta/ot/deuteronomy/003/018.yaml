revisions:
- from: 'அந்த நேரத்தில் நான் உங்களுக்குக் கட்டளையிட்டுச் சொன்னது: “உங்கள் கடவுளாகிய யாவே இந்த நாட்டை நீங்கள் உரிமையாக்கிக்கொள்ளும்படி உங்களுக்குக் கொடுத்திருக்கிறார். போருக்கு ஆயத்தமானவர்களாய் நீங்கள் உங்கள் சகோதரர்களான இஸ்ரயேல் மக்களுக்கு முன்னே கடந்து செல்ல வேண்டும்—போரிட வல்ல ஆண்கள் அனைவரும் செல்ல வேண்டும்.[a]”'
