base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/018.yaml
  text: And I commanded you at that time[a], saying, ‘Yahweh your God has given you this land to possess. You shall cross over armed before your brothers[c][b], the sons of Israel—all the men of valor.’
translation:
  language: ta
  text: 'அந்த நேரத்தில் நான் உங்களுக்குக் கட்டளையிட்டேன்: “உங்கள் கடவுளான யாவே இந்த நாட்டை உடைமையாக்கிக்கொள்ளும்படி உங்களுக்குக் கொடுத்திருக்கிறார். போருக்கு ஆயத்தமானவர்களாய், போரிட வல்ல ஆண்கள் அனைவரும் உங்கள் சகோதரர்களாகிய இஸ்ரயேல் மக்களுக்கு முன்னே கடந்து செல்ல வேண்டும்.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “போரிட வல்ல ஆண்கள்” என்பது உள்ளார்ந்த துணிவுள்ளவர்களை மட்டும் குறிக்காமல், போரில் ஈடுபடத் தகுதியும் திறனும் உடைய ஆண்களைக் குறிக்கிறது.
    reason: cultural_note
lexical_decisions:
- source_word: וָאֲצַו אֶתְכֶם בָּעֵת הַהִוא לֵאמֹר
  choice: அந்த நேரத்தில் நான் உங்களுக்குக் கட்டளையிட்டுச் சொன்னது
  rationale: கட்டளையிடுதல் என்ற צוה-வின் வலிமையையும், எபிரெயப் பேச்சு அறிமுகத்தின் முறையான ஓட்டத்தையும் இயல்பான தமிழில் காக்கிறது.
- source_word: יְהוָה אֱלֹהֵיכֶם
  choice: உங்கள் கடவுளாகிய யாவே
  rationale: יהוה என்ற தனிப்பெயரை ‘யாவே’ என ஒலிபெயர்த்து, אֱלֹהֵיכֶם என்பதன் இரண்டாம் நபர் பன்மை உடைமைப் பொருளைக் காக்கிறது.
- source_word: נָתַן לָכֶם אֶת הָאָרֶץ הַזֹּאת לְרִשְׁתָּהּ
  choice: இந்த நாட்டை நீங்கள் உரிமையாக்கிக்கொள்ளும்படி உங்களுக்குக் கொடுத்திருக்கிறார்
  rationale: முடிவுற்ற கொடை தற்போதும் பொருந்துகிறது என்பதை ‘கொடுத்திருக்கிறார்’ காட்டுகிறது; ירשׁ இங்கு நாட்டைக் கைப்பற்றி உடைமையாக்கும் பொருளைத் தருகிறது.
- source_word: חֲלוּצִים
  choice: போருக்கு ஆயத்தமானவர்களாய்
  rationale: இச்சொல் வெறுமனே ஆயுதம் வைத்திருப்பதைவிடப் போர்ச் செயலுக்காக அணிவகுத்து ஆயத்தமாயிருப்பதைக் குறிக்கலாம்; தமிழில் தெளிவாகவும் இயல்பாகவும் தரப்பட்டுள்ளது.
- source_word: תַּעַבְרוּ לִפְנֵי אֲחֵיכֶם בְּנֵי יִשְׂרָאֵל
  choice: நீங்கள் உங்கள் சகோதரர்களான இஸ்ரயேல் மக்களுக்கு முன்னே கடந்து செல்ல வேண்டும்
  rationale: கட்டளையின் வலிமையை ‘வேண்டும்’ காக்கிறது; אֲחֵיכֶם என்பதன் உறவுமுறை உருவகத்தை ‘சகோதரர்கள்’ எனத் தக்கவைத்து, בְּנֵי יִשְׂרָאֵל-ஐ இயல்பான தமிழில் ‘இஸ்ரயேல் மக்கள்’ என வழங்குகிறது.
- source_word: כָּל בְּנֵי חָיִל
  choice: போரிட வல்ல ஆண்கள் அனைவரும்
  rationale: இது உள்ளார்ந்த துணிச்சலை மட்டும் அல்லாமல், போரிடும் திறனுடைய ஆண்களைக் குறிக்கும் இராணுவச் சூழல் சொற்றொடர்.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர் / ஆண்டவர்
  rationale: மூலத்தில் பொதுப் பட்டம் அல்ல, இறைவனின் தனிப்பெயரான நான்கு எழுத்துப் பெயர் நேரடியாக உள்ளது; ஆகவே அதை ஒலிபெயர்ப்பது மூல வேறுபாட்டைக் காக்கிறது.
- issue: אֲחֵיכֶם மற்றும் בְּנֵי חָיִל ஆகிய ஆண்பால் சொற்கள்
  choice: உங்கள் சகோதரர்கள் ... போரிட வல்ல ஆண்கள்
  alternative: உங்கள் சக இஸ்ரயேலர் ... வீரர்கள்
  rationale: இராணுவச் சூழலில் உள்ள மூலத்தின் ஆண்பால் குறிப்பை மறைக்காமல் வைத்திருக்கிறது; அதேவேளை ‘இஸ்ரயேல் மக்கள்’ என்பது בְּנֵי יִשְׂרָאֵל-க்கு இயல்பான சமூகப் பெயராக அமைகிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; மரியாதையும் வேதாகமக் கண்ணியமும் கொண்ட, பொதுவாசகர்களுக்குப் புரியும் நடை. ‘யாவே’ தனிப்பெயராகத் தக்கவைக்கப்பட்டது; இராணுவச் சூழல் தெளிவுபடுத்தப்பட்டாலும் மூலத்தின் உறவுமுறை மொழி பாதுகாக்கப்பட்டது.
