base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/001.yaml
  text: Then we turned and went up by the way of Bashan[a], and Og king of Bashan came out to meet us, he and all his people, for battle at Edrei.
translation:
  language: ta
  text: பின்பு நாங்கள் திரும்பி, பாசானுக்குச் செல்லும் வழியாக மேலே சென்றோம். அப்போது பாசானின் அரசனான ஓக், தன் மக்கள் அனைவருடனும் நம்மை எதிர்கொண்டு எத்ரேயியில் போரிட வந்தான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַנֵּפֶן
  choice: பின்பு நாம் திரும்பி
  rationale: வழிநடைக் கதைத்தொடரில் வரும் פנה என்பதன் ‘திரும்பு’ என்ற பொருளையும், wayyiqtol தொடர்ச்சியையும் இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: וַנַּעַל
  choice: மேலே சென்றோம்
  rationale: עלה என்பதிலுள்ள மேல்நோக்கிய இயக்கத்தை இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: דֶּרֶךְ הַבָּשָׁן
  choice: பாசானுக்குச் செல்லும் வழியாக
  rationale: பிரதேசப் பெயருடன் வரும் דרך, அந்தப் பகுதிக்குச் செல்லும் அல்லது அதனூடே செல்லும் வழியைக் குறிக்கலாம். முதன்மை உரையில் இயல்பான சூழல்சார் பொருள் தரப்பட்டு, எபிரேயச் சொல்லமைப்புக்கு நெருக்கமான மாற்று அடிக்குறிப்பில் வைக்கப்பட்டுள்ளது.
- source_word: וַיֵּצֵא
  choice: வந்தான்
  rationale: יצא என்பதன் அடிப்படைப் பொருள் ‘வெளியே புறப்படு’; எதிர்கொள்ள வருவதைத் தமிழ் சூழலில் ‘வந்தான்’ இயல்பாகத் தெரிவிக்கிறது; ‘படையெடுத்து வந்தான்’ போன்ற கூடுதல் விளக்கத்தைத் தவிர்க்கிறது.
- source_word: עוֹג מֶלֶךְ הַבָּשָׁן
  choice: பாசானின் ராஜாவான ஓக்
  rationale: எபிரேய இணைப்புத் தொடரை இயல்பான தமிழ் அடைமொழி அமைப்பில் தருகிறது; பெயர் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: לִקְרָאתֵנוּ
  choice: நம்மை எதிர்கொண்டு
  rationale: לקראת என்பது சந்திக்க அல்லது எதிர்கொள்ள வருவதைக் குறிக்கிறது. போர் நோக்கம் அடுத்த சொற்றொடரில் வெளிப்படுவதால், இதுவே சூழலுக்கு ஏற்றதும் மிகைப்படுத்தாததும் ஆகும்.
- source_word: הוּא וְכָל־עַמּוֹ
  choice: தன் மக்கள் அனைவருடனும்
  rationale: עם என்பதன் பரந்த ‘மக்கள்’ என்ற பொருளைத் தக்கவைக்கிறது; உரையில் வெளிப்படையாக இல்லாத ‘படை’ அல்லது ‘வீரர்கள்’ என்பதைச் சேர்க்கவில்லை.
- source_word: לַמִּלְחָמָה
  choice: போரிட
  rationale: ஒரு குறிப்பிட்ட போர்ச் சந்திப்பை இங்கு מלחמה குறிக்கிறது; நோக்கத்தைக் காட்டும் ל முன்னொட்டுடன் சேர்த்து தமிழில் வினையெச்ச நோக்கத் தொடராக இயல்பாக மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: אֶדְרֶעִי
  choice: எத்ரேயிக்கு
  rationale: இடப்பெயர் ஒலிபெயர்க்கப்பட்டுள்ளது. எபிரேயத்தில் முன்னிடைச்சொல் இல்லாவிட்டாலும், இறுதி இடப்பெயர் நிகழ்வின் இலக்கு அல்லது இடத்தை அட்வெர்பியல் முறையில் குறிக்கிறது; ‘எத்ரேயிக்கு வந்தான்’ என்பது இயல்பான தமிழாகும்.
