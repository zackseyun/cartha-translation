translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான வரலாற்றுக் கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘ராஜா’ என்பது வேதாகம வரலாற்றுச் சூழலில் பரவலாகப் புரியப்படும் சொல். மூலத்தின் வரிசை, பன்மை முதல் நபர் பார்வை, மற்றும் ‘மக்கள்’ என்பதன் பரந்த குறிப்பு பாதுகாக்கப்பட்டுள்ளன.
