base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/020.yaml
  text: until Yahweh gives rest to your brothers as to you[a], and they also take possession of the land that Yahweh your God is giving them beyond the Jordan[c][b]. Then each of you may return to his possession that I have given you.
translation:
  language: ta
  text: யாவே உங்களுக்குக் கொடுத்ததுபோல உங்கள் சகோதரர்களுக்கும் இளைப்பாறுதல் அளித்து, உங்கள் கடவுளாகிய யாவே யோர்தானுக்கு அப்பால் அவர்களுக்குக் கொடுக்கிற நாட்டை அவர்களும் கைப்பற்றும்வரை, நீங்கள் ஒவ்வொருவரும் நான் உங்களுக்குக் கொடுத்த தத்தம் உடைமைக்குத் திரும்பலாம்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יָנִיחַ
  choice: இளைப்பாறுதல் அளித்து
  rationale: ஹிஃபில் வடிவம் ‘இளைப்பாறச் செய்தல் / இளைப்பாறுதல் அளித்தல்’ எனப் பொருள்படும்; இங்கு நிலத்தில் பாதுகாப்பாகக் குடியமர்ந்த நிலையையும் நிம்மதியையும் குறிக்கிறது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: தமிழில் நீண்டகாலமாகப் பயன்படும் திருப்பெயர் வடிவம்; ‘கர்த்தர்’ என்ற பட்டப்பெயரால் மூலத்தின் தனிப்பெயரை மாற்றாமல் பாதுகாக்கிறது.
- source_word: לַאֲחֵיכֶם
  choice: உங்கள் சகோதரர்களுக்கும்
  rationale: மூலத்தின் ஆண்பால் உறவுமுறைச் சொல்லைத் தக்கவைக்கிறது; சூழலில் இது உடன் இஸ்ரவேலரைக் குறிக்கிறது.
- source_word: כָכֶם
  choice: உங்களுக்கு ... போல
  rationale: எபிரெய மொழியில் மறைந்துள்ள ஒப்பீட்டை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: וְיָרְשׁוּ
  choice: கைப்பற்றும்வரை
  rationale: ירשׁ இங்கு நாட்டைத் தமக்குரியதாகப் பெற்று உடைமையாக்குவதைக் குறிக்கிறது; ‘கைப்பற்றுதல்’ செயல்முகமான பொருளைத் தருகிறது.
- source_word: נֹתֵן
  choice: கொடுக்கிற
  rationale: பங்கேற்புவினை வடிவத்தின் தொடரும், உறுதியான கொடை உணர்வை இயல்பான தமிழில் காட்டுகிறது.
- source_word: בְּעֵבֶר הַיַּרְדֵּן
  choice: யோர்தானுக்கு அப்பால்
  rationale: பேசுகிறவர் ஆற்றின் கிழக்கே இருப்பதைக் கொண்டு மேற்குப் பகுதியைக் குறிக்கும் சார்புநிலை இடச்சொற்றொடர்.
- source_word: וְשַׁבְתֶּם
  choice: அதன்பின் ... திரும்பிச் செல்லலாம்
  rationale: கடமை நிறைவேறிய பிறகு நிகழும் திரும்புதலைக் குறிக்கிறது; சூழலிலுள்ள அனுமதிப் பொருளை ‘செல்லலாம்’ வெளிப்படுத்துகிறது.
- source_word: אִישׁ
  choice: நீங்கள் ஒவ்வொருவரும்
  rationale: ஆண்பால் ஒருமைச் சொல்லின் பகிர்வுப் பொருளைத் தமிழில் இயல்பாகத் தருகிறது; உரையாடப்படுவோர் ஒவ்வொருவரையும் குறிக்கிறது.
- source_word: לִירֻשָּׁתוֹ
  choice: உங்கள் உடைமைக்கு
  rationale: வாரிசுரிமையாக அல்லது பங்காகக் கிடைத்த நிலவுடைமையைக் குறிக்கிறது; ‘உடைமை’ தெளிவான பொதுத்தமிழ்.
- source_word: נָתַתִּי לָכֶם
  choice: நான் உங்களுக்குக் கொடுத்த
  rationale: மோசே முன்பே அளித்த கிழக்கு யோர்தான் நிலப்பங்கைக் குறிக்கும் நிறைவுற்ற செயலைத் தக்கவைக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யெகோவா
  alternative: யாவே; ஆண்டவர்
  rationale: மூலத்தில் தனிப்பெயர் இருப்பதால் பட்டப்பெயரான ‘ஆண்டவர்’ என்பதற்குப் பதிலாக தமிழில் பரவலாக அறியப்பட்ட தனிப்பெயர் வடிவம் பயன்படுத்தப்பட்டது.
- issue: לַאֲחֵיכֶם மற்றும் אִישׁ ஆகியவற்றின் பாலின மொழி
  choice: ‘சகோதரர்கள்’ என்பதைத் தக்கவைத்து, אִישׁ என்பதைக் ‘ஒவ்வொருவரும்’ எனப் பகிர்வுப் பொருளில் மொழிபெயர்த்தல்
  alternative: உடன் இஸ்ரவேலர்; ஒவ்வொரு ஆணும்
  rationale: முதல் சொல் மூலத்தின் ஆண்பால் உறவுமுறையைப் பாதுகாக்கிறது; இரண்டாவது சொல்லில் இலக்கணப் பாலைவிட பகிர்வுப் பொருள் முதன்மையானதால் இயல்பான தமிழ் பயன்படுத்தப்பட்டது.
- issue: வசனத்தின் தொடக்கத்தில் உள்ள עַד אֲשֶׁר சார்ந்த கட்டளைத் தொடர்ச்சி
  choice: ‘... கைப்பற்றும்வரை நீங்கள் அவர்களுக்கு உதவ வேண்டும்’ என முந்தைய கட்டளையின் மறைந்த செயலை வெளிப்படுத்துதல்
  alternative: ‘... கைப்பற்றும்வரை’ என்று மட்டும் மொழிபெயர்த்தல்
  rationale: எபிரெய வசனம் 3:18–19-இல் தொடங்கிய கட்டளையைத் தொடர்கிறது. தனி வசனமாக வாசிக்கும்போது இலக்கண ரீதியாக முழுமையடைய, சூழலில் வெளிப்படையான உதவிக் கடமை சுருக்கமாகச் சேர்க்கப்பட்டது; புதிய கருத்து சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீனத் தரமான, மரியாதைமிக்க பொதுத்தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘இளைப்பாறுதல்’ உபாகமத்தின் நிலம், பாதுகாப்பு, நிம்மதி ஆகிய கருத்துத் தொடரைத் தக்கவைக்கிறது. வசனம் முந்தைய வாக்கியத்தின் தொடராக இருப்பதால், தனித்து வாசிக்கத் தெளிவாக ‘நீங்கள் அவர்களுக்கு உதவ வேண்டும்’ என்பது சூழலிலிருந்து வெளிப்படுத்தப்பட்டுள்ளது.
