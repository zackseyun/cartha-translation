  source_fidelity: 'மூல எபிரெயக் கட்டளைகளின் வரிசையும் பொருளும் துல்லியமாகக் காக்கப்பட்டுள்ளன: பிஸ்காவின் உச்சிக்குச் செல்லுதல், கண்களை உயர்த்துதல், நான்கு திசைகளிலும் நோக்குதல், கண்களால் பார்ப்பது, யோர்தானைக் கடக்கமாட்டாய் என்ற காரணவாக்கியம் ஆகிய அனைத்தும் இடம்பெற்றுள்ளன. יָמָּה என்பதன் ‘மேற்கே’ என்ற சூழல்பொருளும் சரியாக வழங்கப்பட்டுள்ளது; ‘இந்த’ என்ற சுட்டுச்சொல்லும் விடப்படவில்லை.'
