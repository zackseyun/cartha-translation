translation_notes:
  register: நவீன நிலையான தமிழில், ஒருமை கட்டளைத் தொனியும் மூலத்தின் இலக்கிய வலியுறுத்தலும் காக்கப்பட்டுள்ளன. திசைப் பட்டியல் சீரான தமிழில் அமைக்கப்பட்டுள்ளது. ஆங்கில ஆலோசனை உரையில் அடிக்குறிப்பு குறிகள் பொருந்தாத இடங்களில் இருந்ததால், அவை அவற்றின் உண்மையான சொற்களான ‘மேற்கே’ மற்றும் ‘இந்த யோர்தான்’ என்பவற்றோடு இணைக்கப்பட்டுள்ளன.
