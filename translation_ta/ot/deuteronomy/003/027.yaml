source:
  edition: WLC
  text: עֲלֵ֣ה רֹ֣אשׁ הַ/פִּסְגָּ֗ה וְ/שָׂ֥א עֵינֶ֛י/ךָ יָ֧מָּ/ה וְ/צָפֹ֛נָ/ה וְ/תֵימָ֥נָ/ה וּ/מִזְרָ֖חָ/ה וּ/רְאֵ֣ה בְ/עֵינֶ֑י/ךָ כִּי לֹ֥א תַעֲבֹ֖ר אֶת הַ/יַּרְדֵּ֥ן הַ/זֶּֽה׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/027.yaml
  text: Go up to the top of Pisgah[a], and lift up your eyes westward and northward and southward and eastward, and see with your eyes[b]; for you shall not cross this Jordan.
translation:
  language: ta
  text: பிஸ்காவின் உச்சிக்கு ஏறிப்போ. உன் கண்களை உயர்த்தி, மேற்கே[a], வடக்கே, தெற்கே, கிழக்கே நோக்கி, உன் கண்களாலேயே பார்; ஏனெனில் நீ இந்த யோர்தானைக்[b] கடக்கமாட்டாய்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொல்லுக்கு சொல், ‘கடலை நோக்கி’; இங்கு அது மேற்குத் திசையைக் குறிக்கும் வழக்கமான சொல்லாட்சி.
    reason: cultural_note
  - marker: b
    text: அல்லது, ‘இந்த யோர்தான் ஆற்றை.’ எபிரெயத்தில் ‘இந்த யோர்தான்’ என்றே உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲלֵה
  choice: ஏறிப்போ
  rationale: עלה என்பதன் கால் கட்டளை வடிவம் மேல்நோக்கிச் செல்லும்படி நேரடியாகக் கட்டளையிடுகிறது. ‘ஏறிப்போ’ என்பது திசை உணர்வைத் தக்கவைக்கும் இயல்பான நவீனத் தமிழ்.
- source_word: רֹאשׁ הַפִּסְגָּה
  choice: பிஸ்காவின் உச்சி
  rationale: רֹאשׁ இங்கு ‘உச்சி/மேற்பகுதி’ என்று பொருள்படுகிறது; הַפִּסְגָּה பிஸ்கா என்னும் நிலப்பெயரைக் குறிக்கிறது. ‘உச்சி’ தெளிவாகவும் கண்ணியமாகவும் உள்ளது.
- source_word: וְשָׂא עֵינֶיךָ
  choice: உன் கண்களை உயர்த்தி
  rationale: பார்வையை ஒரு திசை நோக்கித் திருப்பும் எபிரெய மரபுத்தொடரை, அதன் இலக்கியத் தன்மையுடன் தமிழில் இயல்பாகத் தக்கவைக்கிறது.
- source_word: יָמָּה
  choice: மேற்கே
  rationale: ים (‘கடல்’) என்பதிலிருந்து உருவான திசை வடிவம்; இஸ்ரவேல் நிலப்பார்வையில் வழக்கமாக மேற்குத் திசையைக் குறிக்கிறது. மூலத்தின் நேரடிப் படிமம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: וְצָפֹנָה וְתֵימָנָה וּמִזְרָחָה
  choice: வடக்கே, தெற்கே, கிழக்கே
  rationale: மூன்று திசை வினையடைகளையும் ஒரே சீரான, இயல்பான தமிழமைப்பில் வழங்குகிறது.
- source_word: וּרְאֵה בְעֵינֶיךָ
  choice: உன் கண்களாலேயே பார்
  rationale: முன்னரே ‘கண்கள்’ என்று வந்திருந்தாலும், மூலத்தில் மீண்டும் வரும் வலியுறுத்தலை ‘கண்களாலேயே’ என்பதன் மூலம் பாதுகாக்கிறது.
- source_word: כִּי לֹא תַעֲבֹר
  choice: ஏனெனில் நீ ... கடக்கமாட்டாய்
  rationale: כִּי இங்கு முந்தைய கட்டளைக்கான காரணத்தை அறிமுகப்படுத்துகிறது; עבר யோர்தானைப் பற்றிய சூழலில் ‘கடத்தல்’ அல்ல, ‘கடந்து செல்லுதல்’ என்று பொருள்படுகிறது.
- source_word: אֶת הַיַּרְדֵּן הַזֶּה
  choice: இந்த யோர்தானை
  rationale: הַזֶּה எனும் சுட்டுச்சொல்லை ‘இந்த’ என்று வெளிப்படையாகத் தக்கவைக்கிறது. எபிரெயத்தில் ‘ஆறு’ என்ற சொல் சேர்க்கப்படவில்லை; இயல்பான விளக்க மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
