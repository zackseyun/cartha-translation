base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/024.yaml
  text: O Lord Yahweh[a], you have begun to show your servant your greatness and your strong hand. For what god is there in heaven or on earth who can do deeds like your deeds and mighty acts like yours?
translation:
  language: ta
  text: ஆண்டவராகிய யாவே! உமது மகத்துவத்தையும் உமது வலிமையான கரத்தையும் உமது அடியேனுக்குக் காட்டத் தொடங்கியிருக்கிறீர். வானத்திலோ பூமியிலோ உமது செயல்களைப் போன்ற செயல்களையும் உமது வல்லச் செயல்களைப் போன்ற வல்லச் செயல்களையும் செய்ய முடியும் எந்தத் தெய்வம் இருக்கிறது?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: ஆண்டவராகிய யெகோவாவே
  rationale: אֲדֹנָי என்ற ஆண்டவர் பட்டத்தையும் יהוה என்ற தனிப்பட்ட இறைப் பெயரையும் வேறுபடுத்திப் பாதுகாக்கிறது; தமிழ் அழைப்புநிலையில் இயல்பாக உள்ளது.
- source_word: הַחִלּוֹתָ לְהַרְאוֹת
  choice: காட்டத் தொடங்கியிருக்கிறீர்
  rationale: ‘காட்டத் தொடங்கினீர்’ என்ற அடிப்படைப் பொருளையும், தொடங்கிய செயல் பேச்சின் தருணத்தில் தொடரும் முக்கியத்துவத்தையும் வெளிப்படுத்துகிறது.
- source_word: עַבְדְּךָ
  choice: உமது அடியேன்
  rationale: கடவுளை நோக்கிய மோசேயின் தாழ்மையான சுயக்குறிப்பை இயல்பான தமிழ் செப மொழியில் வெளிப்படுத்துகிறது; வெறும் ‘அடிமை’ எனும் சமூகப் பொருளை தேவையின்றி முன்னிறுத்தவில்லை.
- source_word: גָּדְלְךָ
  choice: உமது மகத்துவம்
  rationale: பெயர்ச்சொல்லின் நேரடிப் பொருளான greatness/majesty என்பதைக் கண்ணியமான நவீன தமிழில் தருகிறது.
- source_word: יָדְךָ הַחֲזָקָה
  choice: உமது வலிமையான கரம்
  rationale: தெய்வீக வல்லமை செயல்படுவதைக் குறிக்கும் எபிரேய உருவகத்தைத் தக்கவைத்து, חזק என்பதன் ‘வலிமையான’ பொருளை நேரடியாக வழங்குகிறது.
- source_word: מִי אֵל בַּשָּׁמַיִם וּבָאָרֶץ
  choice: வானத்திலோ பூமியிலோ எந்தத் தெய்வம்
  rationale: ஒப்பற்ற தன்மையை வலியுறுத்தும் மறைமுக மறுப்புக் கேள்வியை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: יַעֲשֶׂה
  choice: செய்ய முடியும்
  rationale: இச்சூழலில் வினையின் திறன்/சாத்தியப்பாட்டு வலிமையைத் தெளிவாகக் காட்டுகிறது.
- source_word: כְמַעֲשֶׂיךָ וְכִגְבוּרֹתֶיךָ
  choice: உமது செயல்களைப் போன்ற செயல்களையும் உமது வல்லமையான செயல்களைப் போன்றவற்றையும்
  rationale: מַעֲשֶׂה மற்றும் גְּבוּרָה இடையிலான கவிதை இணைப்பையும் வேறுபாட்டையும் முடிந்தவரை பாதுகாக்கிறது.
theological_decisions:
- issue: אֲדֹנָי יהוה என்ற இணைப்பில் இறைப் பெயரை வழங்குதல்
  choice: ஆண்டவராகிய யெகோவாவே
  alternative: ஆண்டவராகிய யாவே; ஆண்டவராகிய கர்த்தரே
  rationale: முதல் சொல் பட்டம்; இரண்டாவது உடன்படிக்கையின் தனிப்பட்ட இறைப் பெயர். இரண்டையும் ஒரே பட்டமாக்காமல் வேறுபடுத்துகிறது. ‘யெகோவா’ தமிழ் வாசகர்களிடையே பரவலாக அறியப்பட்ட வடிவம்; எபிரேய உச்சரிப்பை ‘யாவே’ எனக் கருதுவோர் இருப்பதால் அது அடிக்குறிப்பில் குறிப்பிடப்படுகிறது.
- issue: மற்ற தெய்வங்கள் குறித்த மறைமுக மறுப்புக் கேள்வி
  choice: எந்தத் தெய்வம் ... செய்ய முடியும்?
  alternative: ஒரு தெய்வம் யார் ... செய்வது?
  rationale: எபிரேய வாக்கியம் ஒப்பிடத்தக்க தெய்வம் இல்லை என்பதை வலியுறுத்தும் கேள்வியாகவே வைக்கப்படுகிறது; அதை நேரடி கொள்கைக் கூற்றாக மாற்றவில்லை.
translation_notes:
  register: மரியாதை ஒருமை வடிவங்களுடன் கூடிய நவீன, கண்ணியமான செப நடையைப் பயன்படுத்துகிறது. ‘அடியேன்’ என்பது இங்கு மோசே தன்னைத் தாழ்த்திக் குறிப்பிடும் இயல்பான தமிழ் வடிவம். எபிரேயத்தின் உருவகமான ‘வலிமையான கரம்’ பாதுகாக்கப்பட்டுள்ளது.
