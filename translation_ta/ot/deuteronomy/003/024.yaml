  to: ஆண்டவராகிய யாவே! உமது மகத்துவத்தையும் உமது வலிமையான கரத்தையும் உமது அடியேனுக்குக் காட்டத் தொடங்கியிருக்கிறீர். வானத்திலோ பூமியிலோ உமது செயல்களைப் போன்ற செயல்களையும் உமது வல்லச் செயல்களைப் போன்ற வல்லச் செயல்களையும் செய்ய முடியும் எந்தத் தெய்வம் இருக்கிறது?
