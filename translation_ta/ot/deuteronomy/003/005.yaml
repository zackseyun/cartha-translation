  text: כָּל אֵ֜לֶּה עָרִ֧ים בְּצֻר֛וֹת חוֹמָ֥ה גְבֹהָ֖ה דְּלָתַ֣יִם וּ/בְרִ֑יחַ לְ/בַ֛ד מֵ/עָרֵ֥י הַ/פְּרָזִ֖י הַרְבֵּ֥ה מְאֹֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/005.yaml
  text: All these were fortified cities with a high wall, double doors, and bars, besides a great many rural towns.
translation:
  language: ta
  text: இவையெல்லாம் உயரமான மதிலும், இரட்டைக் கதவுகளும், தாழ்ப்பாள்களும் கொண்ட அரணமைக்கப்பட்ட நகரங்கள். இவை தவிர, மதிலற்ற ஊர்களும்[a] மிக ஏராளமாக இருந்தன.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘திறந்தவெளிப் பகுதிகளிலிருந்த ஊர்கள்’ அல்லது ‘மதிலில்லாத நகரங்கள்.’ இங்கு எபிரெயச் சொல், முன்பு கூறப்பட்ட அரணமைக்கப்பட்ட நகரங்களுடன் இந்தக் குடியிருப்புகளை வேறுபடுத்திக் காட்டுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּצֻרוֹת
  choice: அரணமைக்கப்பட்ட
  rationale: தாக்குதலை எதிர்கொள்ளப் பாதுகாப்பாக வலுப்படுத்தப்பட்ட நகரங்களைக் குறிக்கிறது; நவீனத் தமிழில் இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: חוֹמָה גְבֹהָה
  choice: உயரமான மதில்
  rationale: எபிரெய உரையில் உள்ள ஒருமையைப் பாதுகாத்து, நகரத்தின் உயர்ந்த பாதுகாப்பு மதிலைக் குறிக்கிறது.
- source_word: דְּלָתַיִם
  choice: இரட்டைக் கதவுகள்
  rationale: எபிரெயச் சொல்லின் இருமை வடிவம் கதவின் இரண்டு பலகைகள் அல்லது இணைக் கதவுகளைக் காட்டுவதால், பொதுவான ‘வாசல்கள்’ என்பதற்குப் பதிலாக அந்த வடிவ நுணுக்கம் பாதுகாக்கப்படுகிறது.
- source_word: וּבְרִיחַ
  choice: தாழ்ப்பாள்கள்
  rationale: நகரக் கதவுகளை உறுதியாக அடைக்கும் குறுக்குத் தாழ்ப்பாள்களைக் குறிக்கிறது; ஒருமை வடிவம் பட்டியலில் கூட்டுப்பொருளில் புரிந்துகொள்ளப்படுகிறது.
- source_word: לְבַד
  choice: இவை தவிர
  rationale: முன்னர் கூறப்பட்ட அரணமைக்கப்பட்ட நகரங்களுக்கு மேலாக வேறு குடியிருப்புகளும் இருந்தன என்ற சேர்க்கை/வேறுபாட்டை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: מֵעָרֵי הַפְּרָזִי
  choice: மதிலற்ற ஊர்கள்
  rationale: முன்பு கூறப்பட்ட அரணமைக்கப்பட்ட நகரங்களுக்கு மாறாக, மதிலால் சூழப்படாத திறந்தவெளிக் குடியிருப்புகளைத் தெளிவாகக் குறிக்கிறது.
- source_word: הַרְבֵּה מְאֹד
  choice: மிக ஏராளமாக
  rationale: எண்ணிக்கையின் மிகுதியை வலியுறுத்தும் எபிரெயச் சொற்றொடரை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: כָּל אֵלֶּה עָרִים
  choice: இவையெல்லாம் ... நகரங்கள்
  rationale: எபிரெய மொழியின் தொடக்க வலியுறுத்தலைப் பாதுகாத்து, தமிழில் தெளிவான பெயர்ப் பயனிலை அமைப்பாக வழங்குகிறது.
