base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/006.yaml
  text: And we devoted them to destruction[a], just as we had done to Sihon king of Heshbon, utterly destroying every city—men, women, and little ones.
translation:
  language: ta
  text: எஸ்போன் அரசன் சீகோனுக்கு நாம் செய்ததுபோலவே, அவர்களையும் அழிவுக்கென்று அர்ப்பணித்தோம்[a]; ஒவ்வொரு நகரத்திலிருந்த ஆண்கள், பெண்கள், சிறு பிள்ளைகள் அனைவரையும் முற்றிலும் அழித்தோம்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்களை அழிவுக்கான தடைக்குட்படுத்தினோம்.” எபிரெய மொழியில் חרם என்ற வினை, ஒருவரையோ ஒன்றையோ அழிவுக்கென்று அர்ப்பணிப்பதைக் குறிக்கும் ஒரு தொழில்நுட்பச் சொல்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַנַּחֲרֵם
  choice: அவர்களையும் அழிவுக்கென்று அர்ப்பணித்தோம்
  rationale: חרם என்ற வினை போர்ச் சூழலில் ஒருவரையோ ஒன்றையோ அழிவுக்கென ஒதுக்கி வைக்கும் தொழில்நுட்பப் பொருளைக் கொண்டுள்ளது. வெறும் ‘அழித்தோம்’ என்பதைவிட இந்தத் தனிப்பொருளை இச்சொற்றொடர் காக்கிறது.
- source_word: כַּאֲשֶׁר עָשִׂינוּ
  choice: நாம் செய்ததுபோலவே
  rationale: முன்பு சீகோனுக்கு எதிராக நிகழ்ந்த செயலை ஒப்பிட்டுக் குறிப்பிடும் இயல்பான தமிழ் வடிவம்.
- source_word: לְסִיחֹן מֶלֶךְ חֶשְׁבּוֹן
  choice: எஸ்போன் அரசன் சீகோனுக்கு
  rationale: עשה உடன் வரும் ל பாதிக்கப்பட்ட நபரைச் சுட்டுகிறது; தமிழில் ‘சீகோனுக்கு நாம் செய்தது’ இயல்பாக அமைந்து மூலத்தின் கட்டமைப்பையும் காக்கிறது.
- source_word: הַחֲרֵם
  choice: முற்றிலும் அழித்தோம்
  rationale: முன்னுள்ள חרם செயலை விளக்கி வலுப்படுத்தும் infinitive absolute; தமிழில் முழுமையின் வலிமையைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: כָּל עִיר
  choice: ஒவ்வொரு நகரத்தையும்
  rationale: עיר என்பதன் வழக்கமான பொருளான ‘நகரம்’ என்பதையும், כָּל என்பதன் அனைத்தையும் உள்ளடக்கும் பொருளையும் காக்கிறது.
- source_word: מְתִם
  choice: ஆண்கள்
  rationale: பெண்களும் சிறு பிள்ளைகளும் தொடர்ந்து தனியே குறிப்பிடப்படுவதால், இங்கு ஆண் நபர்களைக் குறிக்கும் தனிப்பெயராக மொழிபெயர்க்கப்படுகிறது; ‘குடியிருக்கும்’ என்ற பெயரடையாக மாற்றப்படவில்லை.
- source_word: הַנָּשִׁים
  choice: பெண்கள்
  rationale: நேரடியான, இயல்பான தமிழ்ச் சமமான சொல்.
- source_word: וְהַטָּף
  choice: சிறு பிள்ளைகள்
  rationale: טף சிறு குழந்தைகள் அல்லது சார்ந்திருக்கும் இளம் பிள்ளைகளைக் குறிக்கிறது; ‘பிள்ளைகள்’ என்பதைவிட வயதின் சிறுமையை இவ்வடிவம் நெருக்கமாகக் காட்டுகிறது.
theological_decisions:
- issue: போர்த் தீர்ப்புச் சூழலில் חרם மொழியை மொழிபெயர்த்தல்
  choice: முதன்மை வாக்கியத்தில் ‘அழிவுக்கென்று அர்ப்பணித்தோம்’ என்றும், அதை வலுப்படுத்தும் தொடரில் ‘முற்றிலும் அழித்தோம்’ என்றும் மொழிபெயர்த்தல்
  alternative: ‘முழுவதுமாக அழித்தோம்’ அல்லது ‘தடைக்குள் வைத்தோம்’
  rationale: חרם என்பதன் தொழில்நுட்பத் தன்மையையும் நிகழ்வின் கடுமையையும் மென்மைப்படுத்தாமல் காக்க வேண்டும். ‘அழிவுக்கென்று அர்ப்பணித்தோம்’ அதன் தனிப்பொருளை வெளிப்படுத்துகிறது; ‘முற்றிலும் அழித்தோம்’ பின்வரும் வலியுறுத்தலை இயல்பான தமிழில் தருகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் dignified நடையில் அமைக்கப்பட்டுள்ளது. மூலத்தில் உள்ள חרם சொல்லின் தொழில்நுட்பப் பொருளும் அழிவின் கடுமையும் பாதுகாக்கப்பட்டுள்ளன; ஆண்கள்–பெண்கள்–சிறு பிள்ளைகள் என்ற மும்மைத் தொடரும் தெளிவாக வைக்கப்பட்டுள்ளது.
