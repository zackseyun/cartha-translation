  source_fidelity: மூல எபிரெயத்தின் வாவ்-தொடர்கதை இறந்தகாலம், தீவிரமான வேண்டுதல் (וָאֶתְחַנַּן), யாவேவை நோக்கிய தொடர்பு, காலக் குறிப்பு, அடுத்த நேரடிக் கூற்றை அறிமுகப்படுத்தும் לֵאמֹר ஆகியவை துல்லியமாகப் பிரதிபலிக்கப்படுகின்றன. ‘அப்போது’ என்பது בָּעֵת הַהִוא என்பதற்கு இயல்பான சுருக்கமான இணை; ‘இவ்வாறு … :’ என்பது அடுத்த வசனத்தில் தொடரும் கூற்றைத் தெளிவாக அறிமுகப்படுத்துகிறது.
  naturalness: ‘அப்போது நான் யாவேயிடம் இவ்வாறு மன்றாடினேன்:’ என்பது நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான கதைநடை. ‘மன்றாடினேன்’ வினை வேண்டுதலின் உருக்கத்தையும் தீவிரத்தையும் நன்றாக வெளிப்படுத்துகிறது.
  terminology: யְהוָה தனிப்பெயர் ‘யாவே’ என ஒலிபெயர்க்கப்பட்டுள்ளது; இது வழங்கப்பட்ட மொழிபெயர்ப்புக் கொள்கையுடனும் மூல உரையுடனும் ஒத்துள்ளது. அடிக்குறிப்பு இறைப்பெயரின் எபிரெய வடிவத்தையும் மரபான ‘கர்த்தர்’ வழங்கலையும் பொருத்தமாகக் குறிப்பிடுகிறது.
