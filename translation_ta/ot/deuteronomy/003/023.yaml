  yaml_path: translation/ot/deuteronomy/003/023.yaml
  text: And I pleaded with Yahweh at that time[a], saying,
translation:
  language: ta
  text: 'அப்போது நான் யாவே[a]யிடம் இவ்வாறு மன்றாடினேன்:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரெயம்: “YHWH” (יהוה). இது மரபாக “கர்த்தர்” என்று மொழிபெயர்க்கப்படுகிறது; “யாவே” என்பது இறைப்பெயரின் ஒலிபெயர்ப்பு.'
    reason: alternative_reading
lexical_decisions:
- source_word: וָאֶתְחַנַּן
  choice: மன்றாடினேன்
  rationale: חנן என்பதன் ஹித்பயேல் வடிவம் இரக்கத்தையோ தயவையோ நாடி உருக்கமாக வேண்டுவதைக் குறிக்கிறது. ‘மன்றாடினேன்’ என்பது அந்த வேண்டுதலின் தீவிரத்தைக் காக்கும் இயல்பான நவீனத் தமிழ் சொல்.
- source_word: אֶל
  choice: யிடம்
  rationale: வேண்டுதல் செலுத்தப்படும் நபரைத் தமிழில் இயல்பாகக் குறிக்க ‘-யிடம்’ பயன்படுத்தப்படுகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய மூலத்தில் உள்ள יהוה என்ற தனிப்பெயரை ஒரு பட்டப்பெயராக மாற்றாமல், தமிழில் வழக்கமான ஒலிபெயர்ப்பாக ‘யாவே’ என வழங்குகிறது.
- source_word: בָּעֵת הַהִוא
  choice: அப்போது
  rationale: ‘அந்த நேரத்தில்’ என்ற பொருளைச் சுருக்கமாகவும் இயல்பான கதைநடைத் தமிழிலும் தெரிவிக்கிறது.
- source_word: לֵאמֹר
  choice: 'இவ்வாறு … மன்றாடினேன்:'
  rationale: அடுத்து வரும் நேரடிக் கூற்றை அறிமுகப்படுத்தும் எபிரெய சூத்திரத்தைத் தமிழில் இயல்பாகக் காட்ட ‘இவ்வாறு’ என்பதும் முக்காற்புள்ளியும் பயன்படுத்தப்பட்டுள்ளன.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூல உரை இறைவனின் தனிப்பெயரான יהוה என்பதை நேரடியாகப் பயன்படுத்துகிறது. அதனைப் பட்டப்பெயரால் மாற்றாமல் ஒலிபெயர்ப்பது மூலத்தின் தன்மையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், எளிமையும் கண்ணியமும் கொண்ட கதைநடை பயன்படுத்தப்பட்டுள்ளது. அடுத்த வசனத்தில் வரும் நேரடிக் கூற்றை இயல்பாக அறிமுகப்படுத்த முக்காற்புள்ளி இடப்பட்டுள்ளது; அடிக்குறிக் குறியீடு அது விளக்கும் ‘யாவே’ என்பதன் உடனேயே வைக்கப்பட்டுள்ளது.
