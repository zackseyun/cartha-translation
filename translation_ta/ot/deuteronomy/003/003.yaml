  yaml_path: translation/ot/deuteronomy/003/003.yaml
  text: So Yahweh our God also gave into our hand Og king of Bashan[a], and all his people, and we struck him down until he had no survivor left.
translation:
  language: ta
  text: நம் கடவுளாகிய யாவே பாசானின் அரசனான ஓகையும் அவனுடைய மக்கள் அனைவரையும் நம் கையில் ஒப்புக்கொடுத்தார். அவனுக்கு உயிர்தப்பி எஞ்சியவர் எவரும் இல்லாதவரை நாம் அவனைத் தாக்கினோம்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'இன்னும் சொற்சொல்லாக: “அவனுக்கு எஞ்சியவர் எவரும் இல்லாதவரை.”'
    reason: עַד בִּלְתִּי הִשְׁאִיר לוֹ שָׂרִיד என்ற எபிரேய விளைவுத்தொடரின் மேலும் சொற்சொல்லான வடிவத்தை வழங்குகிறது.
lexical_decisions:
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைத் திருப்பெயரான நான்கெழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் தெளிவாக ஒலிபெயர்க்கிறது.
- source_word: וַיִּתֵּן ... בְּיָדֵנוּ
  choice: நம் கையில் ஒப்புக்கொடுத்தார்
  rationale: ‘கொடுத்தார்’ என்பதன் அடிப்படைப் பொருளையும் போர்ச் சூழலில் ‘கையில்’ என்பது அதிகாரத்திற்குள் ஒப்புக்கொடுத்ததைக் குறிக்கும் எபிரேய மரபுத்தொடரையும் இயல்பான தமிழில் இணைக்கிறது.
- source_word: גַּם
  choice: -யும்
  rationale: முந்தைய சீகோனின் தோல்வியோடு ஓகின் தோல்வியையும் இணைக்கும் சேர்க்கைப் பொருளைத் தமிழ் இணைப்புவிகுதி இயல்பாகத் தெரிவிக்கிறது.
- source_word: עוֹג מֶלֶךְ הַבָּשָׁן
  choice: பாசானின் அரசன் ஓகு
  rationale: ஆளின் பெயரையும் அவரது அரசப் பட்டத்தையும் பகுதியையும் இயல்பான தமிழ்ச் சொல்வரிசையில் தருகிறது.
- source_word: כָּל עַמּוֹ
  choice: அவனுடைய மக்கள் அனைவரும்
  rationale: עַם என்பதன் பரந்த ‘மக்கள்’ என்ற பொருளைத் தக்கவைக்கிறது; அதை ‘படை’ என்று குறுக்கவில்லை.
- source_word: וַנַּכֵּהוּ
  choice: நாம் அவனை முறியடித்தோம்
  rationale: போர்ச் சூழலில் נכה குறிக்கும் தாக்கி வீழ்த்துதல் அல்லது தோற்கடித்தல் என்ற வலிமையை இயல்பான நவீன தமிழில் தெரிவிக்கிறது; ஒருமைச் சுட்டுப்பெயரைத் தக்கவைக்கிறது.
- source_word: עַד בִּלְתִּי הִשְׁאִיר לוֹ שָׂרִיד
  choice: அவனுக்கு உயிர்தப்பியவர் ஒருவர்கூட எஞ்சாதவரை
  rationale: முழுமையான போர்த் தோல்வியைத் தெளிவாகக் கூறுகிறது; எஞ்சச் செய்தவர் யார் என்பதைத் தமிழ் வாக்கியத்தில் தேவையின்றி நிர்ணயிக்காமல், எபிரேயத்தின் விளைவுநிலையைப் பாதுகாக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைத் திருப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: தனிப்பட்ட இறைப் பெயரை ஒரு பொதுப்பட்டத்தால் மாற்றாமல் ஒலிபெயர்ப்பதால் மூலத்தின் தன்மையைப் பாதுகாக்கிறது.
- issue: அழிவின் முழுமையைக் குறிக்கும் மொழிநடை
  choice: அவனுக்கு உயிர்தப்பியவர் ஒருவர்கூட எஞ்சாதவரை
  alternative: அவனுக்காக உயிர்தப்பிய ஒருவனையும் எஞ்சவைக்காதவரை
  rationale: மூலத்தில் கூறப்படும் கடுமையான, முழுமையான போர்த் தோல்வியை மென்மையாக்காமலும் கூடுதல் இறையியல் விளக்கம் சேர்க்காமலும் தெரிவிக்கிறது; அதேவேளை הִשְׁאִיר என்பதன் மறைமுக எழுவாயைத் தமிழில் கட்டாயமாகத் தீர்மானிப்பதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘நம் கையில்’ என்ற வேதாகம மரபுத்தொடர் புரிந்துகொள்ளக்கூடியதாக இருப்பதால் தக்கவைக்கப்பட்டது; ‘மக்கள்’ என்பது மூலத்தின் பரந்த பொருளைச் சுருக்காமல் காக்கிறது.
