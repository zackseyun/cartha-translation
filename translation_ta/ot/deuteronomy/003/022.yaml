base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/022.yaml
  text: Do not fear them[a], for Yahweh your God is the one who fights for you.
translation:
  language: ta
  text: அவர்களைக் கண்டு பயப்படாதீர்கள்[a]; ஏனெனில் உங்கள் கடவுளான யாவே தாமே உங்களுக்காகப் போரிடுகிறார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்களைக் கண்டு அஞ்சாதீர்கள்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא תִּירָאוּם
  choice: அவர்களுக்குப் பயப்படாதீர்கள்
  rationale: எதிர்மறைத் துகளும் இரண்டாம் நபர் பன்மை வினை வடிவமும் மூன்றாம் நபர் பன்மை பின்னொட்டும் சேர்ந்து, ‘நீங்கள் அவர்களுக்குப் பயப்பட வேண்டாம்’ என்ற தடையைத் தெரிவிக்கின்றன. நவீனத் தமிழில் இயல்பாகவும் நேரடியாகவும் இவ்வாறு மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய தடைக்கான காரணத்தை அறிமுகப்படுத்துவதால், காரணப்பொருளைத் தெளிவாகக் காட்டும் ‘ஏனெனில்’ தேர்ந்தெடுக்கப்பட்டுள்ளது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இது பட்டப்பெயர் அல்ல, எபிரெயத் தெய்வீகப் பெயரான நான்கு எழுத்துப் பெயர். அதன் பெயர்த்தன்மையைப் பாதுகாக்கத் தமிழில் ‘யாவே’ என ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: אֱלֹהֵיכֶם
  choice: உங்கள் கடவுள்
  rationale: இஸ்ரவேலின் கடவுளைக் குறிக்கும் ஒருமைப் பொருளும் இரண்டாம் நபர் பன்மை உடைமைப் பின்னொட்டும் இயல்பான தமிழில் வெளிப்படுகின்றன.
- source_word: הוּא
  choice: தாமே
  rationale: தனித்து வரும் சுட்டுப்பெயரின் வலியுறுத்தலைத் தமிழில் மரியாதையுடனும் இயல்பாகவும் ‘தாமே’ வெளிப்படுத்துகிறது.
- source_word: הַנִּלְחָם
  choice: போரிடுகிறார்
  rationale: இப்பெயரெச்ச வடிவம் தொடர்ந்து அல்லது பண்பியல்பாகச் செயல்படும் ‘போரிடுகிறவர்’ என்ற கருத்தைக் கொண்டது; தமிழ் நிகழ்கால வினை அந்த உறுதியை இயல்பாகத் தெரிவிக்கிறது.
- source_word: לָכֶם
  choice: உங்களுக்காக
  rationale: இங்குள்ள முன்னொட்டு பயன் அல்லது சார்பைக் குறிக்கிறது; ‘உங்களுக்காக’ என்பது ‘உங்கள் சார்பாக’ என்ற பொருளை நேரடியாகத் தருகிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் பொதுவான பட்டப்பெயர் அல்லாமல் தனிப்பட்ட தெய்வீகப் பெயரே உள்ளது. ஆகவே அதைப் பட்டப்பெயரால் மாற்றாமல் ஒலிபெயர்த்தது மூலத்தின் பெயர்த்தன்மையைப் பாதுகாக்கிறது.
- issue: הוּא என்பதன் வலியுறுத்தல்
  choice: யாவேதாமே
  alternative: யாவே
  rationale: எபிரெயத்தில் தனிப்பட்ட சுட்டுப்பெயர் வெளிப்படையாக இடம்பெற்று எழுவாயை வலியுறுத்துகிறது. ‘தாமே’ அந்த வலியுறுத்தலைச் சேர்க்கிறது; ஆனால் அதற்கு மேலான இறையியல் விளக்கத்தை இறக்குமதி செய்யவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் அதேவேளையில் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. பன்மை அழைப்பு ‘பயப்படாதீர்கள்’ என்பதில் காக்கப்பட்டுள்ளது; தெய்வீகப் பெயரும் மூலத்தின் வலியுறுத்தலும் வெளிப்படையாகப் பாதுகாக்கப்பட்டுள்ளன.
