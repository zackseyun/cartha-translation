base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/021.yaml
  text: And I commanded Joshua at that time[a], saying, ‘Your eyes have seen all that Yahweh your God did to these two kings; so Yahweh will do to all the kingdoms through which you are passing.’
translation:
  language: ta
  text: 'அக்காலத்தில் நான் யோசுவாவுக்குக் கட்டளையிட்டுச் சொன்னேன்: “உங்கள் கடவுளாகிய யாவே இந்த இரண்டு அரசர்களுக்கு எதிராகச் செய்த அனைத்தையும் உன் கண்கள் கண்டிருக்கின்றன. அவ்வாறே, நீ அங்கே கடந்துசெல்லும் எல்லா அரசாட்சிகளுக்கும் யாவே செய்வார்.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, இன்னும் இயல்பாக, “நீ கடந்துசென்று சேரும் எல்லா அரசாட்சிகளுக்கும்.” எபிரெயச் சொற்றொடர் இன்னும் நேரடியாக, “நீ அங்கே கடந்துசெல்லும்” என்று கூறுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶת יְהוֹשׁוּעַ צִוֵּיתִי
  choice: நான் யோசுவாவுக்குக் கட்டளையிட்டேன்
  rationale: צוה என்பது அதிகாரத்துடன் கட்டளையிடுதல் அல்லது பொறுப்பளித்தல் என்பதைக் குறிக்கிறது; இங்கு “கட்டளையிட்டேன்” நேரடியான, இயல்பான தமிழாக்கம்.
- source_word: בָּעֵת הַהִוא
  choice: அக்காலத்தில்
  rationale: குறிப்பிட்ட முந்தைய காலச்சூழலைச் சுட்டும் வழக்கமான எபிரெய காலக்குறிப்பை இயல்பான தமிழில் தருகிறது.
- source_word: לֵאמֹר
  choice: சொன்னேன்
  rationale: எபிரெய உரையறிமுக வாய்பாட்டை, தமிழில் தேவையற்ற சொற்பிரதியாக இல்லாமல் “கட்டளையிட்டுச் சொன்னேன்” என இயல்பாக வெளிப்படுத்துகிறது.
- source_word: עֵינֶיךָ הָרֹאֹת
  choice: உன் கண்கள் கண்டிருக்கின்றன
  rationale: யோசுவாவின் நேரடிச் சாட்சியத்தை வலியுறுத்தும் “உன் கண்கள்” என்ற உருவகத்தைத் தக்கவைக்கிறது; முடிந்த செயல் தற்போதைய உறுதிக்கு அடிப்படையாக இருப்பதையும் “கண்டிருக்கின்றன” உணர்த்துகிறது.
- source_word: יְהוָה אֱלֹהֵיכֶם
  choice: உங்கள் கடவுளாகிய யாவே
  rationale: יְהוָה என்ற உடன்படிக்கைப் பெயரை “யாவே” என ஒலிபெயர்த்து, אֱלֹהֵיכֶם இல் உள்ள பன்மை இரண்டாம் நபர் பின்னொட்டை “உங்கள்” எனப் பாதுகாக்கிறது. யோசுவாவை ஒருமையில் அழைக்கும் சுற்றுப்பகுதியுடன் இந்த எண்ண்மாற்றம் மூலத்திலேயே உள்ளது.
- source_word: לִשְׁנֵי הַמְּלָכִים הָאֵלֶּה
  choice: இந்த இரண்டு அரசர்களுக்கும்
  rationale: לְ குறிக்கும் பாதிக்கப்பட்ட இலக்கைத் தமிழின் “-க்கும்” வேற்றுமையால் நெருக்கமாகத் தருகிறது; பகைமையைச் சூழல் தெளிவுபடுத்துவதால் “எதிராக” என்பதைச் சேர்க்கவில்லை.
- source_word: כֵּן יַעֲשֶׂה יְהוָה
  choice: அவ்வாறே ... யாவே செய்வார்
  rationale: முன்னர் இரண்டு அரசர்களுக்கு நிகழ்ந்தது, பின்னர் மற்ற அரசுகளுக்கும் நிகழும் மாதிரி என்பதை כֵּן காட்டுகிறது; “அவ்வாறே” அந்த ஒப்புமையைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: לְכָל הַמַּמְלָכוֹת
  choice: எல்லா அரசுகளுக்கும்
  rationale: מַמְלָכוֹת என்பது அரசர்கள் மட்டுமல்ல, அவர்களது ஆட்சிப்பகுதிகளையும் அரசமைப்புகளையும் குறிக்கும்; “அரசுகள்” அதற்கேற்ற இயல்பான பொதுத்தமிழ் சொல்.
- source_word: אֲשֶׁר אַתָּה עֹבֵר שָׁמָּה
  choice: நீ அங்கே கடந்துசெல்லும்
  rationale: אַתָּה என்பதன் ஒருமையை “நீ” எனவும், עבר என்பதன் கடத்தல்/கடந்துசெல்லல் கருத்தையும், שָׁמָּה என்பதன் இலக்குநோக்கிய “அங்கே” கூறையும் தக்கவைக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் நான்கெழுத்து உடன்படிக்கைப் பெயர் நேரடியாக உள்ளது. பொதுப்பட்டப்பெயராக மாற்றாமல், அந்தத் தனிப்பெயரைத் தமிழில் ஒலிபெயர்ப்பது மூலத்தின் வேறுபாட்டைப் பாதுகாக்கிறது.
- issue: யோசுவாவுக்கான ஒருமை அழைப்புக்குள் אֱלֹהֵיכֶם என்ற பன்மை உடைமை வடிவம்
  choice: “உன் கண்கள்” என்றும் “உங்கள் கடவுள்” என்றும் எண்ண்மாற்றத்தைத் தக்கவைத்தல்
  alternative: முழுவதையும் ஒருமைப்படுத்தி “உன் கடவுள்” என மொழிபெயர்த்தல்
  rationale: עֵינֶיךָ மற்றும் אַתָּה யோசுவாவை ஒருமையில் குறிக்கின்றன; אֱלֹהֵיכֶם மட்டும் இஸ்ரவேல் சமூகத்தை உள்ளடக்கும் பன்மை வடிவம். இதைச் சீராக்காமல் விடுவது மூலத்தின் உரையாடல் நுட்பத்தைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் மரியாதையும் வேதாகம உரைக்குரிய செறிவும் காக்கப்பட்டுள்ளன. யோசுவாவைக் குறிக்கும் ஒருமை “உன்/நீ” மற்றும் இஸ்ரவேலை உள்ளடக்கும் பன்மை “உங்கள்” ஆகியவை மூல எபிரெய எண்ண்மாற்றத்தின்படி திட்டமிட்டே வைக்கப்பட்டுள்ளன. இறுதிக் கூறின் சிறிய இயல்பின்மையை மூலத்தின் “அங்கே கடந்துசெல்லும்” அமைப்பைக் காக்க ஏற்றுக்கொண்டு, வழுவழுப்பான மாற்று அடிக்குறிப்பில் தரப்பட்டுள்ளது.
