source:
  edition: WLC
  text: כִּ֣י רַק ע֞וֹג מֶ֣לֶךְ הַ/בָּשָׁ֗ן נִשְׁאַר֮ מִ/יֶּ֣תֶר הָ/רְפָאִים֒ הִנֵּ֤ה עַרְשׂ/וֹ֙ עֶ֣רֶשׂ בַּרְזֶ֔ל הֲ/לֹ֣ה הִ֔וא בְּ/רַבַּ֖ת בְּנֵ֣י עַמּ֑וֹן תֵּ֧שַׁע אַמּ֣וֹת אָרְכָּ֗/הּ וְ/אַרְבַּ֥ע אַמּ֛וֹת רָחְבָּ֖/הּ בְּ/אַמַּת אִֽישׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/011.yaml
  text: For only Og king of Bashan was left of the remnant of the Rephaim[a]. Look, his bed was a bed of iron. Is it not in Rabbah of the Ammonites? Its length was nine cubits and its width four cubits[b], by the cubit of a man.
translation:
  language: ta
  text: பாசானின் அரசனாகிய ஓகு மட்டுமே ரெப்பாயீமியரின் எஞ்சியோரில் மீந்திருந்தான்[a]. இதோ, அவனுடைய கட்டில் இரும்புக் கட்டில். அது அம்மோனியரின் ரப்பா நகரத்தில் அல்லவா இருக்கிறது? அதன் நீளம் ஒன்பது முழமும், அகலம் நான்கு முழமும்—மனிதரின் முழ அளவின்படி[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘ராட்சதர்களின்.’ ‘ரெப்பாயீம்’ என்பது மிகுந்த உடலளவுடன் தொடர்புபடுத்தப்பட்ட ஒரு பழங்கால மக்கள் வகையின் பெயராக இருக்கலாம்.
    reason: alternative_reading
  - marker: b
    text: அல்லது, ‘வழக்கமான முழ அளவின்படி’ அல்லது ‘சாதாரண முழ அளவின்படி.’ எபிரெயத்தில் சொல்லுக்கு சொல், ‘மனிதரின் முழத்தின்படி.’
    reason: lexical_alternative
lexical_decisions:
- source_word: רַק
  choice: மட்டுமே
  rationale: ஓகு ஒருவன் மட்டுமே மீந்திருந்தான் என்ற தனித்தன்மையை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: נִשְׁאַר מִיֶּתֶר
  choice: எஞ்சியோரில் மீந்திருந்தான்
  rationale: செயப்பாட்டு வடிவையும், ஏற்கெனவே எஞ்சியிருந்த ரெப்பாயீமியரில் ஓகு மீந்திருந்தான் என்ற பொருளையும் தெளிவாகக் காட்டுகிறது.
- source_word: הָרְפָאִים
  choice: ரெப்பாயீமியர்
  rationale: ‘ராட்சதர்கள்’ என்று விளக்கமாக மொழிபெயர்க்காமல், எபிரெயப் பெயரைக் குறிப்பிட்ட மக்கள் வகையின் பெயராகப் பாதுகாக்கிறது.
- source_word: הִנֵּה
  choice: இதோ
  rationale: குறிப்பிடப்படும் பொருளின் மேல் கவனத்தை ஈர்க்கும் எபிரெயச் சொல்லின் வலிமையைச் சுருக்கமாகப் பாதுகாக்கிறது.
- source_word: עַרְשׂוֹ ... עֶרֶשׂ
  choice: அவனுடைய கட்டில் இரும்புக் கட்டில்
  rationale: மூலத்தில் ஒரே பெயர்ச்சொல் திரும்ப வருவதைக் காத்து, நவீனத் தமிழில் இயல்பாக அமைகிறது.
- source_word: בַּרְזֶל
  choice: இரும்பு
  rationale: பொருளைக் குறிக்கும் நேரடியான மொழிபெயர்ப்பு.
- source_word: הֲלֹה הִוא
  choice: அது ... அல்லவா இருக்கிறது?
  rationale: அறியப்பட்ட பொருளையும் இடத்தையும் சான்றாகச் சுட்டும் மூலத்தின் வினாவடிவத்தைப் பாதுகாக்கிறது.
- source_word: בְּרַבַּת בְּנֵי עַמּוֹן
  choice: அம்மோனியரின் ரப்பா நகரத்தில்
  rationale: இடப்பெயரை ஒலிபெயர்த்து, மக்கள் பெயரைத் தமிழில் இயல்பாக வழங்குகிறது; ‘நகரம்’ என்பது ரப்பா ஓர் இடப்பெயர் என்பதை வாசகருக்குத் தெளிவாக்குகிறது.
- source_word: תֵּשַׁע אַמּוֹת ... וְאַרְבַּע אַמּוֹת
  choice: ஒன்பது முழம் ... நான்கு முழம்
  rationale: தவறான துல்லியமுள்ள நவீன அலகு மாற்றத்தைத் தவிர்த்து, பழங்கால அளவான முழத்தையே வைத்திருக்கிறது.
- source_word: בְּאַמַּת אִישׁ
  choice: மனிதரின் முழ அளவின்படி
  rationale: எபிரெயச் சொற்றொடரின் வடிவத்தையும் சாத்தியமான பொருள் நுணுக்கத்தையும் பாதுகாக்கிறது; பொதுவான முழ அளவு என்ற விளக்கம் அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: הָרְפָאִים என்பதை விளக்கமாக ‘ராட்சதர்கள்’ என்று மொழிபெயர்ப்பதா, மக்கள் பெயராகப் பாதுகாப்பதா
  choice: ரெப்பாயீமியர்
  alternative: ராட்சதர்கள்
  rationale: இச்சொல் பழைய ஏற்பாட்டில் அறியப்பட்ட மக்கள் அல்லது வகையின் பெயராக வருகிறது. அவர்களின் மிகுந்த உடலளவு சூழலால் உணர்த்தப்பட்டாலும், ‘ராட்சதர்கள்’ என்பது மூலச்சொல்லை விட விளக்கமான வாசிப்பாகும்.
- issue: עֶרֶשׂ என்பது கட்டிலா அல்லது இறந்தோர் படுக்கை/கல்லறைப் பேழையா
  choice: கட்டில்
  alternative: படுக்கை; இறந்தோர் படுக்கை; கல்லறைப் பேழை
  rationale: அதன் பரிமாணங்கள் ஓகுவின் அசாதாரண உடலளவுக்குச் சான்றாகக் கூறப்படும் சூழலில் ‘கட்டில்’ இயல்பாகப் பொருந்துகிறது; சிறப்பு வாய்ந்த இறுதிச்சடங்கு பொருளை எபிரெய உரை கட்டாயப்படுத்தவில்லை.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான, பொதுவாசகருக்குப் புரியும் தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘இதோ’ மற்றும் ‘அல்லவா’ ஆகியவை மூலத்தின் சுட்டும் வலிமையையும் வினாவடிவத்தையும் காக்கின்றன. ‘ரெப்பாயீமியர்’ என்ற ஒலிபெயர்ப்பு விளக்கத்தை உரைக்குள் திணிக்காமல் ambiguity-ஐப் பாதுகாக்கிறது.
