revisions:
- from: தயவுசெய்து, நான் கடந்து சென்று, யோர்தானுக்கு அப்பாலுள்ள அந்த நல்ல நாட்டை—இந்த நல்ல மலைப்பகுதியையும்[a] லெபனோனையும்—பார்க்கட்டும்.
  to: தயவுசெய்து, நான் கடந்து சென்று யோர்தானுக்கு அப்பாலுள்ள அந்த நல்ல நாட்டை—இந்த நல்ல மலைப்பகுதியையும்[a] லெபனோனையும்—பார்க்க அனுமதியுங்கள்.
