source:
  edition: WLC
  text: אֶעְבְּרָה נָּ֗א וְ/אֶרְאֶה֙ אֶת הָ/אָ֣רֶץ הַ/טּוֹבָ֔ה אֲשֶׁ֖ר בְּ/עֵ֣בֶר הַ/יַּרְדֵּ֑ן הָ/הָ֥ר הַ/טּ֛וֹב הַ/זֶּ֖ה וְ/הַ/לְּבָנֽוֹן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/025.yaml
  text: Please let me cross over and see the good land that is beyond the Jordan[a], this good hill country and Lebanon.
translation:
  language: ta
  text: தயவுசெய்து, நான் கடந்து சென்று யோர்தானுக்கு அப்பாலுள்ள அந்த நல்ல நாட்டை—இந்த நல்ல மலைப்பகுதியையும்[a] லெபனோனையும்—பார்க்க அனுமதியுங்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இந்த நல்ல மலை.” எபிரெயச் சொல் ஒரு குறிப்பிட்ட மலையையோ யோர்தானுக்கு மேற்கிலுள்ள மலைப்பகுதியையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶעְבְּרָה נָּא
  choice: தயவுசெய்து, நான் கடந்து சென்று
  rationale: முதலாம் நபர் விருப்பவினையும் வேண்டுகோளை மென்மையாக்கும் נָא என்பதும் சேர்ந்து மோசேயின் மன்றாட்டை வெளிப்படுத்துகின்றன; நவீன தமிழில் இயல்பாக இதைத் தருகிறது.
- source_word: וְאֶרְאֶה
  choice: பார்க்கட்டும்
  rationale: முந்தைய விருப்பவினையுடன் இணைந்த நோக்கத்தையும் வேண்டுதலையும் தமிழின் இயல்பான விருப்ப வினைமுற்றில் காக்கிறது.
- source_word: הָאָרֶץ הַטּוֹבָה
  choice: அந்த நல்ல நாட்டை
  rationale: உபாகமத்தின் நிலப்பரப்பு சார்ந்த சூழலில் אֶרֶץ என்பது ‘நாடு/நிலம்’ எனப் பொருள்படும்; இங்கு ‘நாடு’ இயல்பாகவும் உடன்படிக்கை நாட்டின் கருத்தைத் தெளிவாகவும் தருகிறது.
- source_word: אֲשֶׁר בְּעֵבֶר הַיַּרְדֵּן
  choice: யோர்தானுக்கு அப்பாலுள்ள
  rationale: பேசுபவர் யோர்தானின் கிழக்கே இருக்கும் பார்வைநிலையிலிருந்து ஆற்றுக்கு மறுபுறமுள்ள பகுதியைக் குறிக்கிறது.
- source_word: הָהָר הַטּוֹב הַזֶּה
  choice: இந்த நல்ல மலைப்பகுதியையும்
  rationale: הַר என்பது தனி மலையையோ மலைநாட்டையோ குறிக்கலாம்; இச்சூழலில் கானானின் மேட்டுநிலப் பகுதியைக் குறிக்கும் கூட்டுப் பொருள் இயல்பானது.
- source_word: וְהַלְּבָנוֹן
  choice: லெபனோனையும்
  rationale: இடப்பெயர் தமிழில் வழக்கமான ஒலிபெயர்ப்பில் தரப்பட்டுள்ளது; இணைப்பு விகுதி எபிரெய வாக்கியத் தொடரை இயல்பான தமிழில் காட்டுகிறது.
theological_decisions:
- issue: 'הָהָר என்பதன் புவியியல் பொருள்: ஒரு குறிப்பிட்ட மலையா, மலைப்பகுதியா?'
  choice: மலைப்பகுதி
  alternative: மலை
  rationale: எபிரெய ஒருமைச் சொல் ஒரு மலைநிலப் பகுதியைத் தொகுப்பாகக் குறிக்க முடியும். நாட்டைப் பற்றிய இச்சூழலிலும் ‘லெபனோன்’ என்பதுடனான இணைப்பிலும் பிராந்தியப் பொருள் அதிகம் பொருந்துகிறது; எனினும் குறிப்பிட்ட மலையைக் குறிக்கும் வாய்ப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன தரத் தமிழில் இயல்பான, கண்ணியமான மன்றாட்டு நடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் ‘அந்த நல்ல நாடு—இந்த நல்ல மலைப்பகுதியும் லெபனோனும்’ என்ற விளக்க இணைவை நீள்கோடுகள் தெளிவாக்குகின்றன; மூலத்தில் உள்ள புவியியல் இருபொருள்தன்மை அடிக்குறிப்பில் காக்கப்பட்டுள்ளது.
