translation_notes:
  register: நவீனத் தரத் தமிழில், பட்டியல் அமைப்பையும் முந்தைய வசனத்துடன் தொடரும் வேற்றுமை வடிவத்தையும் காத்துள்ளோம். இடப்பெயர்கள் வாசிக்க எளிதான தமிழ் ஒலிபெயர்ப்பில் தரப்பட்டுள்ளன. இறுதி விளக்கத் தொடர் முன் பட்டியலுக்கான இணைப்பாகத் தெளிவாக இருக்க நீண்ட கோடுகள் பயன்படுத்தப்பட்டுள்ளன.
