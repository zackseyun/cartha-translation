  text: all the cities of the tableland[a], and all Gilead, and all Bashan, as far as Salecah and Edrei[b], the cities of the kingdom of Og in Bashan.
translation:
  language: ta
  text: மேட்டுநிலப் பகுதியின் எல்லா நகரங்களையும்[a], கிலேயாத் முழுவதையும், பாசான் முழுவதையும், சல்காவும் எத்ரேயியும் வரையிலும் உள்ள பாசானிலுள்ள ஓகின் அரசாட்சியின் நகரங்களையும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘மேட்டுநிலப் பகுதி’ என்பதற்கான எபிரெயச் சொல், ‘சமமான நிலம்’ அல்லது ‘பீடபூமி’ என்றும் மொழிபெயர்க்கப்படலாம். இங்கு அது யோர்தானுக்குக் கிழக்கேயுள்ள சமமான உயர்நிலப் பகுதியைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּל עָרֵי הַמִּישֹׁר
  choice: மேட்டுநிலப் பகுதியின் எல்லா நகரங்களையும்
  rationale: מִישׁוֹר இங்கு யோர்தானுக்குக் கிழக்கேயுள்ள சமமான உயர்நிலப் பகுதியைக் குறிக்கிறது. ‘மேட்டுநிலப் பகுதி’ என்பது வெறும் தாழ்வான சமவெளி என்ற தவறான எண்ணத்தைத் தவிர்த்து நிலவியல் பொருளை இயல்பான தமிழில் தருகிறது. எபிரெய உரையின் வேற்றுமை வடிவம் முந்தைய வசனத்தின் வினையோடு தொடர்வதால் ‘நகரங்களையும்’ என அமைக்கப்பட்டுள்ளது.
- source_word: הַגִּלְעָד
  choice: கிலேயாத்
  rationale: இடப்பெயர் தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: הַבָּשָׁן
  choice: பாசான்
  rationale: பிரதேசப் பெயர் தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: עַד סַלְכָה וְאֶדְרֶעִי
  choice: சல்கா மற்றும் எத்ரேயி வரையிலும்
  rationale: עַד குறிக்கும் நிலப்பரப்பு எல்லையை ‘வரையிலும்’ எனத் தெளிவாகத் தருகிறது; இரு இடப்பெயர்களும் ஒலிபெயர்க்கப்பட்டுள்ளன.
- source_word: עָרֵי מַמְלֶכֶת עוֹג בַּבָּשָׁן
  choice: பாசானிலிருந்த ஓகின் அரசாட்சிக்குரிய நகரங்களையும்
  rationale: בַּבָּשָׁן இடத்தைக் குறிக்கிறது; மַמְלֶכֶת என்பது ஓகின் அரசாட்சி அல்லது ராஜ்யத்தைக் குறிக்கிறது. இத்தொடர் முன் கூறிய நிலப்பகுதிகளையும் நகரங்களையும் விளக்கும் இணைப்பாக இருப்பதை கோடுகள் காட்டுகின்றன.
