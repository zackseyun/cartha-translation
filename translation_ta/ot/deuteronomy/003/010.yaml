- from: மேட்டுநிலப் பகுதியின் எல்லா நகரங்களையும்[a], கிலேயாத் முழுவதையும், பாசான் முழுவதையும், சல்கா மற்றும் எத்ரேயி வரையிலும்—பாசானிலிருந்த ஓகின் அரசாட்சிக்குரிய நகரங்களையும்—
  to: மேட்டுநிலப் பகுதியின் எல்லா நகரங்களையும்[a], கிலேயாத் முழுவதையும், பாசான் முழுவதையும், சல்காவும் எத்ரேயியும் வரையிலும் உள்ள பாசானிலுள்ள ஓகின் அரசாட்சியின் நகரங்களையும்.
  rationale: The revision removes the disruptive dashes and renders the Hebrew apposition as a continuous Tamil noun phrase. ‘பாசானிலுள்ள ஓகின் அரசாட்சியின் நகரங்கள்’ explicitly preserves the sense ‘the cities of the kingdom of Og in Bashan,’ while all accusative endings remain to reflect the verse’s continuation from the preceding context.
