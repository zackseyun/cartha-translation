source:
  edition: WLC
  text: וַ/נִּקַּ֞ח בָּ/עֵ֤ת הַ/הִוא֙ אֶת הָ/אָ֔רֶץ מִ/יַּ֗ד שְׁנֵי֙ מַלְכֵ֣י הָ/אֱמֹרִ֔י אֲשֶׁ֖ר בְּ/עֵ֣בֶר הַ/יַּרְדֵּ֑ן מִ/נַּ֥חַל אַרְנֹ֖ן עַד הַ֥ר חֶרְמֽוֹן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/008.yaml
  text: And at that time we took the land from the hand of the two kings of the Amorites who were beyond the Jordan[a], from the Wadi Arnon as far as Mount Hermon.
translation:
  language: ta
  text: அக்காலத்தில், யோர்தானுக்கு அப்பால் இருந்த எமோரியரின் இரண்டு அரசர்களின் கையிலிருந்து, அர்னோன் பள்ளத்தாக்கிலிருந்து எர்மோன் மலைவரையுள்ள நிலப்பகுதியை நாம் எடுத்துக்கொண்டோம்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַנִּקַּח
  choice: நாம் கைப்பற்றினோம்
  rationale: לקח என்பதன் அடிப்படைப் பொருள் ‘எடுத்தோம்’; இங்கு அரசர்களின் கட்டுப்பாட்டிலிருந்த நிலப்பகுதியைத் தம்வசப்படுத்திய போர் சார்ந்த சூழலில், இயல்பான தமிழில் ‘கைப்பற்றினோம்’ பொருத்தமாக உள்ளது.
- source_word: בָּעֵת הַהִוא
  choice: அக்காலத்தில்
  rationale: முன்னர் விவரிக்கப்பட்ட நிகழ்வுகளின் காலத்தைச் சுட்டும் வழக்கமான காலக் குறிப்பு; நவீனத் தமிழில் சுருக்கமாகவும் இயல்பாகவும் உள்ளது.
- source_word: הָאָרֶץ
  choice: நாட்டை
  rationale: இங்கு אֶרֶץ என்பது முழு பூமியையல்ல, குறிப்பிட்ட அரசர்களின் ஆட்சிக்குட்பட்ட நிலப்பரப்பைக் குறிக்கிறது; ‘நாடு’ அந்த அரசியல்-புவியியல் பொருளை இயல்பாகத் தருகிறது.
- source_word: מִיַּד
  choice: கையிலிருந்து
  rationale: எபிரேயத்தின் ‘கையிலிருந்து’ என்ற உடைமை அல்லது கட்டுப்பாட்டைக் குறிக்கும் உருவகத்தைத் தமிழிலும் தெளிவாகப் பாதுகாக்கிறது.
- source_word: שְׁנֵי מַלְכֵי הָאֱמֹרִי
  choice: எமோரியரின் இரண்டு அரசர்கள்
  rationale: எபிரேயக் கட்டமைப்பைப் பின்பற்றி, அந்த இனத்தாரைச் சேர்ந்த அல்லது அவர்கள்மேல் ஆட்சி செய்த இரண்டு அரசர்களைக் குறிக்கிறது.
- source_word: אֲשֶׁר בְּעֵבֶר הַיַּרְדֵּן
  choice: யோர்தானுக்கு அப்பால் இருந்த
  rationale: בְּעֵבֶר הַיַּרְדֵּן என்ற புவியியல் சொல்லாட்சியின் சார்புநிலைக் கண்ணோட்டத்தை விளக்கிச் சேர்க்காமல் அப்படியே பாதுகாக்கிறது.
- source_word: מִנַּחַל אַרְנֹן
  choice: அர்னோன் பள்ளத்தாக்கு தொடங்கி
  rationale: נַחַל என்பது பருவகால நீரோடை, அதன் படுகை, அல்லது பள்ளத்தாக்கைக் குறிக்கலாம். தமிழில் வாசிக்க இயல்பான ‘பள்ளத்தாக்கு’ முதன்மைத் தேர்வாக வைக்கப்பட்டு, மாற்றுப் பொருள்கள் அடிக்குறிப்பில் தரப்படுகின்றன.
- source_word: עַד הַר חֶרְמוֹן
  choice: எர்மோன் மலைவரையுள்ள
  rationale: עַד குறிக்கும் எல்லை அல்லது பரப்பின் முடிவை ‘வரையுள்ள’ தெளிவாக வெளிப்படுத்துகிறது; הַר பெயருடன் ‘மலை’ என மொழிபெயர்க்கப்பட்டுள்ளது.
