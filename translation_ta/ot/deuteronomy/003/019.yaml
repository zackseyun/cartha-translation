base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/019.yaml
  text: Only your wives[a], your little ones, and your livestock—I know that you have much livestock—shall remain in your towns that I have given you[b],
translation:
  language: ta
  text: உங்கள் மனைவிகளும், சிறு பிள்ளைகளும்[a], கால்நடைகளும் மட்டுமே—உங்களிடம் ஏராளமான கால்நடைகள் இருப்பது எனக்குத் தெரியும்—நான் உங்களுக்குக் கொடுத்த ஊர்களில் தங்கியிருக்கட்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘சிறு பிள்ளைகள்’ என்பதற்குப் பதிலாக ‘பிள்ளைகள்’ அல்லது ‘உங்களைச் சார்ந்திருப்போர்’ என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் சிறு குழந்தைகளையோ குடும்பத்தைச் சார்ந்திருப்போரையோ குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: רַק
  choice: மட்டும்
  rationale: முந்தைய கட்டளையிலிருந்து இவர்களை மட்டும் விலக்கி வைக்கும் கட்டுப்படுத்தும் பொருளை இயல்பான தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: נְשֵׁיכֶם
  choice: உங்கள் மனைவிகள்
  rationale: இங்கு பின்னால் தங்கும் குடும்ப உறுப்பினர்களைப் பற்றிய சூழலில், பொதுவான ‘பெண்கள்’ என்பதைவிட ‘மனைவிகள்’ என்பதே குறிப்பான பொருள்.
- source_word: טַפְּכֶם
  choice: உங்கள் சிறு பிள்ளைகள்
  rationale: טַף என்பது சிறு குழந்தைகளையோ குடும்பத்தைச் சார்ந்திருப்போரையோ குறிக்கலாம்; ‘சிறு பிள்ளைகள்’ அதன் குடும்பச் சூழலையும் வயதுசார் நுணுக்கத்தையும் காக்கிறது.
- source_word: מִקְנֵיכֶם / מִקְנֶה רַב
  choice: உங்கள் கால்நடைகள் / ஏராளமான கால்நடைகள்
  rationale: இந்தச் சொல் மாடுகளை மட்டும் அல்லாமல் வளர்ப்பு விலங்குகளைப் பொதுவாகக் குறிக்கிறது. எபிரெய மூலத்தின் மீளுரைப்பும் தமிழில் பாதுகாக்கப்பட்டுள்ளது.
- source_word: יָדַעְתִּי כִּי
  choice: இருப்பது எனக்குத் தெரியும்
  rationale: பேசுபவரின் நேரடியான அறிவிப்பையும், ஏன் கால்நடைகள் பின்னால் விடப்பட வேண்டும் என்ற விளக்கத் தொடர்பையும் இயல்பாகத் தருகிறது.
- source_word: יֵשְׁבוּ
  choice: தங்கியிருக்கட்டும்
  rationale: வினையின் அடிப்படைப் பொருள் ‘அமர்தல்/குடியிருத்தல்’; இங்கு போருக்குச் செல்பவர்களுக்கு மாறாக ஊர்களிலேயே பின்னால் இருப்பதைக் குறிக்கும் கட்டளைநயத்தை இது வெளிப்படுத்துகிறது.
- source_word: בְּעָרֵיכֶם
  choice: உங்கள் ஊர்களில்
  rationale: עִיר பல அளவுள்ள குடியிருப்புகளைக் குறிக்கக்கூடும்; ‘ஊர்கள்’ என்பது நகர்ப்புற அளவை மிகைப்படுத்தாமல் இயல்பாக உள்ளது.
- source_word: אֲשֶׁר נָתַתִּי לָכֶם
  choice: நான் உங்களுக்குக் கொடுத்த
  rationale: ஏற்கெனவே வழங்கப்பட்டு இப்போது அவர்களுக்குரியதாக உள்ள குடியிருப்புகளைக் குறிக்கும் எபிரெய நிறைவுற்ற செயலைச் சுருக்கமாகக் காக்கிறது.
