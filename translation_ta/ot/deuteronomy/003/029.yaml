  yaml_path: translation/ot/deuteronomy/003/029.yaml
  text: So we stayed in the valley opposite Beth-peor[a].
translation:
  language: ta
  text: ஆகவே நாம் பெத்-பேயோருக்கு எதிரே உள்ள பள்ளத்தாக்கில் தங்கினோம்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நாம் பெத்-பேயோருக்கு எதிரிலுள்ள பள்ளத்தாக்கில் குடியிருந்தோம்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַנֵּשֶׁב
  choice: ஆகவே நாம் தங்கியிருந்தோம்
  rationale: ישׁב என்பதன் வாவ்-தொடர்ச்சி வடிவம் கடந்தகாலக் கூட்டு நிகழ்வைச் சொல்கிறது. சூழலில் முன் கூறிய நிகழ்வின் விளைவாக அங்கே தொடர்ந்து இருந்ததைக் காட்டுவதால், இயல்பான நவீனத் தமிழில் ‘ஆகவே ... தங்கியிருந்தோம்’ என வழங்கப்படுகிறது.
- source_word: בַּגָּיְא
  choice: பள்ளத்தாக்கில்
  rationale: גַּיְא என்பது பள்ளத்தாக்கு, கணவாய் அல்லது குறுகிய பள்ளம் எனப் பொருள்படலாம். நில அமைப்பை அளவுக்கு மீறிக் குறிப்பாக்காமல் பரந்த பொருளைக் காக்க ‘பள்ளத்தாக்கில்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: מוּל
  choice: எதிரே உள்ள
  rationale: מוּל ஓர் இடத்திற்கு நேரெதிரான அல்லது அதை நோக்கிய நிலையைச் சுட்டுகிறது. இடப்பெயருடன் இயல்பாக அமைய ‘எதிரே உள்ள’ பயன்படுத்தப்பட்டது.
- source_word: בֵּית פְּעוֹר
  choice: பெத்-பெயோர்
  rationale: இது ஓர் இடப்பெயர்; அதன் சொற்பொருளை மொழிபெயர்க்காமல் எபிரெய ஒலிவடிவத்தைத் தமிழில் எழுத்துப்பெயர்த்துள்ளோம்.
theological_decisions: []
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘தங்கியிருந்தோம்’ என்பது தற்காலிகமாகவோ ஒரு காலம் தொடர்ந்து அங்கே இருந்ததையோ குறிக்க முடிவதால், மூலத்தின் பரந்த பொருள் காக்கப்படுகிறது. அடிக்குறிப்பு மாற்றுச் சொல் வாய்ப்பைச் சுட்டுகிறது.
