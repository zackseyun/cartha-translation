    reason: lexical_alternative
  revision_rationale: The revision retains the narrative-continuation sense represented by ‘ஆகவே,’ the broad topographical meaning ‘பள்ளத்தாக்கு,’ and the spatial sense of מוּל. It uses a straightforward Tamil narrative past for the Hebrew wayyiqtol, refines the transliteration of Beth-peor, and makes the footnote a clear lexical alternative without changing the meaning.
