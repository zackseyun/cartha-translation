source:
  edition: WLC
  text: וְ/הָ/אָ֗רֶץ אֲשֶׁ֨ר אַתֶּ֜ם עֹבְרִ֥ים שָׁ֨מָּ/ה֙ לְ/רִשְׁתָּ֔/הּ אֶ֥רֶץ הָרִ֖ים וּ/בְקָעֹ֑ת לִ/מְטַ֥ר הַ/שָּׁמַ֖יִם תִּשְׁתֶּה מָּֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/011.yaml
  text: But the land that you are crossing over to possess is a land of mountains and valleys[b][a]; it drinks water from the rain of heaven.
translation:
  language: ta
  text: ஆனால், அதை உரிமையாக்கிக்கொள்வதற்காக நீங்கள் கடந்து செல்கிற தேசம் மலைகளும் பள்ளத்தாக்குகளும் நிறைந்த தேசம்; அது வானத்து மழைநீரைக் குடிக்கிறது.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘சுதந்தரமாகப் பெற’ என்றும் மொழிபெயர்க்கலாம். இங்குள்ள எபிரெய வினைச்சொல், குறிப்பாக உடன்படிக்கைச் சூழலில், உரிமையாக்குதல் மற்றும் சுதந்தரித்தல் ஆகிய இரு நுணுக்கங்களையும் கொண்டிருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָאָרֶץ
  choice: ஆனால் ... தேசம்
  rationale: முந்தைய வசனத்தில் எகிப்தைப் பற்றிய விளக்கத்துடன் உள்ள முரண்பாட்டை வாவ் இணைப்புச் சொல் இங்கு குறிக்கிறது; ஆகவே நவீன தமிழில் ‘ஆனால்’ இயல்பாக அந்த உரையாடல் தொடர்பை வெளிப்படுத்துகிறது.
- source_word: עֹבְרִים שָׁמָּה
  choice: கடந்து செல்கிற
  rationale: பங்கேற்புவினையும் திசைச்சொல்லும், இஸ்ரவேலர் அந்தத் தேசத்திற்குள் செல்லும் நிகழ்வைச் சுட்டுகின்றன. இலக்கை அடுத்த சொற்றொடர் தெளிவுபடுத்துவதால் ‘அங்கே’ என்பதைத் தனியே சேர்க்கத் தேவையில்லை.
- source_word: לְרִשְׁתָּהּ
  choice: உரிமையாக்கிக்கொள்ள
  rationale: ירשׁ என்பது இங்கு செயற்பூர்வமாகக் கைப்பற்றி உடைமையாக்குவதையும் உடன்படிக்கை சார்ந்த சுதந்தரப் பொருளையும் தாங்குகிறது. ‘உரிமையாக்கிக்கொள்ள’ முதன்மைப் பொருளை இயல்பான தமிழில் தருகிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: אֶרֶץ הָרִים וּבְקָעֹת
  choice: மலைகளும் பள்ளத்தாக்குகளும் நிறைந்த தேசம்
  rationale: இந்த இணைச்சொற்றொடர் நிலத்தின் இயற்கை அமைப்பை விவரிக்கிறது. הָרִים என்பதற்கு ‘மலைகள்’, בְקָעֹת என்பதற்கு பொதுவாகப் புரியும் ‘பள்ளத்தாக்குகள்’ பொருத்தமானவை.
- source_word: לִמְטַר הַשָּׁמַיִם
  choice: வானத்திலிருந்து பெய்யும் மழையின்
  rationale: மழையே அந்தத் தேசத்தின் நீராதாரம் என்பதைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது. שָׁמַיִם என்ற எபிரெயச் சொல்லின் வடிவத்தைச் சொற்சொல்லாகப் பன்மையில் மாற்றாமல், தமிழின் வழக்கமான ‘வானம்’ பயன்படுத்தப்படுகிறது.
- source_word: תִּשְׁתֶּה מָּיִם
  choice: நீரைக் குடிக்கிறது
  rationale: தேசம் நீரைக் குடிப்பதாகக் கூறும் எபிரெய உருவகத்தையும் உயிரூட்டலையும் சுருக்காமல் பாதுகாக்கிறது.
theological_decisions:
- issue: ירשׁ என்பதிலுள்ள உடைமை மற்றும் சுதந்தர நுணுக்கங்கள்
  choice: முதன்மை உரையில் ‘உரிமையாக்கிக்கொள்ள’
  alternative: ‘சுதந்தரித்துக்கொள்ள’
  rationale: சூழலில் தேசத்திற்குள் செயற்பூர்வமாக நுழைந்து அதைப் பெறுதல் முன்னிலையில் உள்ளது; அதேவேளை உடன்படிக்கை சார்ந்த சுதந்தர நுணுக்கத்தை அடிக்குறிப்பு வெளிப்படையாகப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. ‘தேசம் நீரைக் குடிக்கிறது’ என்ற மூலமொழியின் உயிரூட்டும் உருவகம் தக்கவைக்கப்பட்டுள்ளது; எபிரெய மொழியில் வடிவரீதியாகப் பன்மையாக உள்ள ‘வானங்கள்’ தமிழில் இயல்பான ‘வானம்’ என வழங்கப்பட்டுள்ளது.
