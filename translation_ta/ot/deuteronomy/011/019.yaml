  text: וְ/לִמַּדְתֶּ֥ם אֹתָ֛/ם אֶת בְּנֵי/כֶ֖ם לְ/דַבֵּ֣ר בָּ֑/ם בְּ/שִׁבְתְּ/ךָ֤ בְּ/בֵיתֶ֨/ךָ֙ וּ/בְ/לֶכְתְּ/ךָ֣ בַ/דֶּ֔רֶךְ וּֽ/בְ/שָׁכְבְּ/ךָ֖ וּ/בְ/קוּמֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/019.yaml
  text: You shall teach them to your children[a], speaking of them when you sit in your house, and when you walk on the road, and when you lie down, and when you rise up.
translation:
  language: ta
  text: அவற்றை உங்கள் பிள்ளைகளுக்குக்[a] கற்றுக்கொடுங்கள்; நீங்கள் உங்கள் வீட்டில் அமர்ந்திருக்கும்போதும், வழியில் செல்லும்போதும், படுத்துக்கொள்ளும்போதும், எழும்போதும் அவற்றைப் பற்றிப் பேசுங்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘உங்கள் மகன்களுக்கு.’ எபிரெய மொழியில் ஆண்பால் பன்மை வடிவம் பயன்படுத்தப்பட்டுள்ளது; அது ஒருவரின் பிள்ளைகள் அனைவரையும் பிரதிநிதித்துவமாகக் குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלִמַּדְתֶּם
  choice: கற்றுக்கொடுங்கள்
  rationale: למד என்பதன் பியேல் வடிவம் இங்கு ‘கற்பித்தல்’ என்று பொருள்படுகிறது. எபிரெய வாக்கியத்தின் கட்டளை வலிமையை இயல்பான நவீன தமிழில் இந்த ஏவல் வடிவம் வெளிப்படுத்துகிறது; ‘கவனமாகக் கற்றுக்கொடுங்கள்’ என்பது மூலத்தில் இல்லாத தீவிரப்படுத்தலைச் சேர்க்கும்.
- source_word: אֹתָם
  choice: அவற்றை
  rationale: ஆண்பால் பன்மை சுட்டுப்பெயர் முந்தைய சூழலில் உள்ள வார்த்தைகள் அல்லது கட்டளைகளைக் குறிக்கிறது. antecedent-ஐ தேவையின்றி வெளிப்படையாகச் சேர்க்காமல் பன்மைச் சுட்டைத் தமிழ் தக்கவைக்கிறது.
- source_word: אֶת־בְּנֵיכֶם
  choice: உங்கள் பிள்ளைகளுக்கு
  rationale: בנים என்பது குறிப்பாக ‘மகன்கள்’ என்றும் விரிவாக ‘பிள்ளைகள்’ என்றும் பொருள்படலாம். உடன்படிக்கைப் போதனை சந்ததியினருக்குக் கடத்தப்படும் இச்சூழலில் ‘பிள்ளைகள்’ என்பது பிரதிநிதித்துவப் பன்மையை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: לְדַבֵּר בָּם
  choice: அவற்றைப் பற்றிப் பேசுங்கள்
  rationale: לְ + infinitive construct இங்கு கற்பித்தலோடு இணையும் பேச்சை அல்லது அதன் உள்ளடக்கத்தைத் தெரிவிக்கிறது. ‘அவற்றைப் பற்றிப் பேசுங்கள்’ என்பது தமிழில் தெளிவாகவும் இயல்பாகவும் இருந்து, கட்டளைகளோடு சுட்டுப்பெயரின் தொடர்பைத் தக்கவைக்கிறது.
- source_word: בְּשִׁבְתְּךָ בְּבֵיתֶךָ
  choice: நீங்கள் உங்கள் வீட்டில் அமர்ந்திருக்கும்போது
  rationale: 'בְ + infinitive construct காலச் சூழலைக் குறிக்கிறது: ‘நீ அமரும்போது.’ ‘உங்கள் வீட்டில்’ இடத்தைக் நேரடியாக வெளிப்படுத்துகிறது.'
- source_word: וּבְלֶכְתְּךָ בַדֶּרֶךְ
  choice: வழியில் நடந்துசெல்லும்போது
  rationale: הלך என்பதன் அடிப்படைப் பொருள் ‘நடத்தல்/செல்லுதல்.’ ‘வழியில் நடந்துசெல்லும்போது’ என்பது செயலும் இடமும் இரண்டையும் இயல்பான தமிழில் தருகிறது; இதனை வெறுமனே ‘பயணம் செய்யும்போது’ எனப் பொதுமைப்படுத்தவில்லை.
- source_word: וּבְשָׁכְבְּךָ
  choice: படுத்துக்கொள்ளும்போது
  rationale: שכב உடன் வரும் בְ காலநிலையைச் சுட்டுகிறது. இந்தத் தமிழ் வடிவம் மூலத்தின் உடல் செயலைத் தக்கவைத்தபடி உறங்கச் செல்வதற்கான இயல்பான பயன்பாட்டையும் கொண்டுள்ளது.
- source_word: וּבְקוּמֶךָ
  choice: எழுந்திருக்கும்போது
  rationale: קום இங்கு படுத்திருப்பதிலிருந்து அல்லது உறக்கத்திலிருந்து எழுவதைச் சுட்டுகிறது. ‘படுத்துக்கொள்ளும்போது’ என்பதுடன் உள்ள மூலத்தின் இணைமுரணையும் ஓசையையும் இது தக்கவைக்கிறது.
theological_decisions:
- issue: בְּנֵיכֶם என்பதில் உள்ள பாலின மொழி
  choice: உங்கள் பிள்ளைகள்
  alternative: உங்கள் மகன்கள்
  rationale: ஆண்பால் பன்மையான בנים குறிப்பாக மகன்களைக் குறிக்கக்கூடியதாயினும், இங்கு உடன்படிக்கைப் போதனையை ஒருவரின் சந்ததியினருக்குக் கடத்தும் பிரதிநிதித்துவப் பயன்பாடு பொருத்தமானது. ‘பிள்ளைகள்’ மகள்களை விலக்காமல் நோக்கப்பட்ட பரப்பைத் தமிழில் இயல்பாகத் தெரிவிக்கிறது; ‘மகன்கள்’ என்ற சொற்பொருள் மாற்றாக அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன தரத் தமிழில் எளிதில் புரியும், மரியாதையும் வேதவாக்கியத்திற்குரிய செறிவும் கொண்ட நடை பயன்படுத்தப்பட்டுள்ளது. எபிரெயத்தின் நான்கு காலச் சூழல்களும் ‘-போதும்’ என்ற ஒத்த அமைப்பால் தக்கவைக்கப்பட்டுள்ளன. மூலத்தில் ஒருமை இரண்டாம் நபராக வரும் அன்றாடச் செயல்கள் தமிழில் மரியாதை/பொது முகவரியான ‘நீங்கள்’ வடிவில் வழங்கப்பட்டுள்ளன; தொடக்க வினை மட்டும் எபிரெயத்தில் பன்மையாக உள்ளது, ஆனால் தமிழ் வசனத்தில் அதனை மாற்றுவது வாசகருக்கு குழப்பம் தருவதால் ஒரே முகவரி நடையாக இயல்பாக்கப்பட்டுள்ளது.
