revisions:
- from: உன் கால்நடைகளுக்காக உன் வயலில் புல்லை விளையச் செய்வேன்[a]; நீ சாப்பிட்டுத் திருப்தியடைவாய்[b].
  to: உன் கால்நடைகளுக்காக உன் வயலில் புல்லைத் தருவேன்[a]; நீ உண்டு திருப்தியடைவாய்[b].
  rationale: The revision restores the explicit sense of the Hebrew verb as ‘give’ without losing the agricultural setting. It retains the representative second-person singular, the distinction between fodder for livestock and food for the addressee, and the promise sequence. Footnotes now provide genuine lexical alternatives in idiomatic Tamil and retain their correct anchors.
