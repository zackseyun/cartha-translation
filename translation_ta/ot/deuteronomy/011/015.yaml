  yaml_path: translation/ot/deuteronomy/011/015.yaml
  text: And I will give grass in your field for your livestock[b][a], and you will eat and be satisfied.
translation:
  language: ta
  text: உன் கால்நடைகளுக்காக உன் வயலில் புல்லைத் தருவேன்[a]; நீ உண்டு திருப்தியடைவாய்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘தாவரங்கள்’ அல்லது ‘பசுந்தழை.’ எபிரெயச் சொல் பொதுவாகத் தாவர வளர்ச்சியைக் குறிக்கலாம்; இங்கு அது கால்நடைகளுக்கான தீவனத்தைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘நிறைவடைவாய்.’ எபிரெய வினைச்சொல் உண்டபின் நிறைவடைதலை அல்லது திருப்தியடைவதைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתִּי
  choice: விளையச் செய்வேன்
  rationale: எபிரெயச் சொல்லின் அடிப்படைப் பொருள் ‘கொடுப்பேன்.’ ஆனால் வயலில் புல்லைக் கொடுப்பது என்ற வேளாண் சூழலில், இயல்பான நவீனத் தமிழில் ‘விளையச் செய்வேன்’ என்பது அந்தத் தெய்வீக ஏற்பாட்டைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: עֵשֶׂב
  choice: புல்
  rationale: இந்தச் சொல் பொதுவாகத் தாவர வளர்ச்சியைக் குறிக்கலாம்; இங்கு கால்நடைகளுக்கான தீவனத்தைச் சுட்டுவதால் ‘புல்’ என்பது சூழலுக்கு ஏற்ற இயல்பான தெரிவு.
- source_word: בְּשָׂדְךָ
  choice: உன் வயலில்
  rationale: שָׂדֶה என்பதன் நேரடியான வேளாண் பொருளான ‘வயல்’ என்பதையும், எபிரெய ஒருமை இரண்டாம் நபர் உரையாடலையும் பாதுகாக்கிறது.
- source_word: לִבְהֶמְתֶּךָ
  choice: உன் கால்நடைகளுக்காக
  rationale: בְּהֵמָה இங்கு வளர்ப்பு விலங்குகளைத் தொகுப்பாகக் குறிக்கிறது; ‘கால்நடைகள்’ என்பது தெளிவான நவீனத் தமிழ்.
- source_word: וְאָכַלְתָּ
  choice: நீ சாப்பிட்டு
  rationale: இரண்டாம் நபர் ஆண்பால் ஒருமையைப் பாதுகாக்கிறது; வாக்குறுதியின் தொடர்ச்சியில் தமிழில் இயல்பான இணைப்பை அளிக்கிறது.
- source_word: וְשָׂבָעְתָּ
  choice: திருப்தியடைவாய்
  rationale: உண்டபின் நிறைவடைதல் அல்லது வயிறு நிறைதல் என்ற பொருளை இயல்பாகத் தெரிவிக்கிறது; வெறும் உடல் நிறைவைத் தாண்டிய சொல்லின் பரப்பையும் காக்கிறது.
theological_decisions:
- issue: இஸ்ரவேலை நோக்கிய பிரதிநிதித்துவ ஒருமை உரை
  choice: ‘உன் வயல்,’ ‘உன் கால்நடைகள்,’ ‘நீ ... அடைவாய்’ என இரண்டாம் நபர் ஒருமையைத் தக்கவைத்தல்
  alternative: தமிழில் கூட்டுப் பொருளை வெளிப்படையாக்கப் பன்மையில் மொழிபெயர்த்தல்
  rationale: எபிரெய மூலத்தில் உடன்படிக்கைச் சமூகமான இஸ்ரவேல் ஒருமையில் நேரடியாக அழைக்கப்படுகிறது; அந்தச் சொல்லாட்சியையும் அதன் வலிமையையும் மொழிபெயர்ப்பு காக்கிறது.
- issue: வாக்களிக்கப்பட்ட ஆசீர்வாதத்தின் இயல்பு
  choice: கால்நடைகளுக்கான புல் மற்றும் மனிதருக்குத் திருப்தியளிக்கும் உணவு என சாதாரண வேளாண் ஏற்பாடாக மொழிபெயர்த்தல்
  alternative: பொதுவான செழிப்பு அல்லது அளவற்ற வளம் என விரிவுபடுத்தல்
  rationale: மூலவசனம் குறிப்பாக வேளாண் வாழ்வாதாரத்தை மட்டுமே கூறுகிறது; அதில் இல்லாத செழிப்புக் கோட்பாட்டை மொழிபெயர்ப்பு சேர்க்கவில்லை.
translation_notes:
  register: நவீனச் செந்தமிழுக்கு நெருக்கமான, பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான நடை. மூலத்தின் இரண்டாம் நபர் ஒருமையும் வேளாண் படிமமும் தக்கவைக்கப்பட்டுள்ளன. ‘சாப்பிட்டு’ என்பது அன்றாடமாகவும் இயல்பாகவும் இருப்பதால் தேர்ந்தெடுக்கப்பட்டது; ‘புசித்து’ போன்ற பழைய சமய வழக்குச் சொல் தவிர்க்கப்பட்டது.
