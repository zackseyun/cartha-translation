base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/022.yaml
  text: For if you carefully keep all this commandment that I am commanding you to do—to love Yahweh your God[a], to walk in all his ways[c][b], and to cling to him—
translation:
  language: ta
  text: ஏனெனில், நான் உங்களுக்குச் செய்யும்படி கட்டளையிடுகிற இந்தக் கட்டளை முழுவதையும்[b] நீங்கள் கவனமாகக் கடைப்பிடிப்பீர்களானால்[a]—உங்கள் கடவுளாகிய யாவேவை நேசிக்கவும், அவருடைய எல்லா வழிகளிலும் நடக்கவும், அவரைப் பற்றிக்கொள்ளவும்[c]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘மிகுந்த கவனத்துடன் கடைப்பிடிப்பீர்களானால்’ என்றும் மொழிபெயர்க்கலாம். எபிரெயத்தில் வினைச்சொல்லின் infinitive absolute வடிவமும் முற்றுவினையும் சேர்ந்து வலியுறுத்தலைத் தருகின்றன.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில் ‘கட்டளை’ ஒருமையில் உள்ளது; இது உடன்படிக்கைப் பொறுப்பு முழுவதையும் கூட்டாகக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: ‘அவரைப் பற்றிக்கொண்டு நிலைத்திருக்கவும்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  choice: ஏனெனில், ... என்றால்
  rationale: முந்தைய வசனத்துடனான காரணத் தொடர்பையும் இங்கு தொடங்கும் நிபந்தனையையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: שָׁמֹר תִּשְׁמְרוּן
  choice: கவனமாகக் கடைப்பிடிப்பீர்களானால்
  rationale: முற்றுவினையுடன் வரும் absolute infinitive தரும் வலியுறுத்தலை ‘கவனமாக’ என்பதால் காட்டி, நிபந்தனை அமைப்பையும் காக்கிறது.
- source_word: כָּל הַמִּצְוָה הַזֹּאת
  choice: இந்தக் கட்டளை முழுவதையும்
  rationale: எபிரெய மூலத்தின் ஒருமையைப் பாதுகாத்தபடி, முழு உடன்படிக்கைப் பொறுப்பையும் கூட்டாகக் குறிக்கக்கூடிய இயல்பான தமிழ் அமைப்பு.
- source_word: אֲשֶׁר אָנֹכִי מְצַוֶּה אֶתְכֶם לַעֲשֹׂתָהּ
  choice: நான் உங்களுக்குச் செயல்படுத்தும்படி கட்டளையிடுகிற
  rationale: מְצַוֶּה என்பதன் நிகழ்கால உரைச் செயலை ‘கட்டளையிடுகிற’ எனவும், עשה என்பதன் செயற்பாட்டு பொருளை ‘செயல்படுத்தும்படி’ எனவும் தருகிறது.
- source_word: לְאַהֲבָה אֶת יְהוָה אֱלֹהֵיכֶם
  choice: உங்கள் கடவுளாகிய யாவேவை நேசித்து
  rationale: தெய்வீகப் பெயரை ஒலிபெயர்த்து, உடன்படிக்கை உறவையும் நேசித்தல் என்ற செயற்பாட்டையும் நேரடியாகக் காக்கிறது.
- source_word: לָלֶכֶת בְּכָל דְּרָכָיו
  choice: அவருடைய வழிகளிலெல்லாம் நடந்து
  rationale: வாழ்க்கை நடத்தையைக் குறிக்கும் ‘நடத்தல்’ உருவகத்தை விளக்கமாக மாற்றாமல் பாதுகாக்கிறது.
- source_word: וּלְדָבְקָה בוֹ
  choice: அவரை உறுதியாகப் பற்றிக்கொண்டிருப்பீர்களானால்
  rationale: דבק குறிக்கும் நெருக்கமான, தொடர்ந்த பற்றுதலை நவீன தமிழில் தெளிவாகவும் உருவகத்தைத் தக்கவைத்தும் கூறுகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரின் மொழியாக்கம்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் பொதுப் பட்டம் அல்ல, இறைவனின் தனிப்பட்ட உடன்படிக்கைப் பெயரே உள்ளது; ஆகவே அதை ஒலிபெயர்ப்பாகக் காக்கிறது.
- issue: ‘வழிகளில் நடத்தல்’, ‘பற்றிக்கொள்ளுதல்’ ஆகிய உடன்படிக்கை உருவகங்கள்
  choice: உருவகங்களை முதன்மை உரையிலேயே காத்தல்
  alternative: ‘அவருடைய விருப்பப்படி வாழ்தல்’, ‘அவருக்கு உண்மையாயிருத்தல்’ என்று விளக்கிப் பெயர்த்தல்
  rationale: மூல உருவகங்களின் உறவுசார் மற்றும் ஒழுக்கவியல் பரப்பை ஒரு குறிப்பிட்ட இறையியல் விளக்கமாகச் சுருக்காமல் பாதுகாக்கிறது.
- issue: לְאַהֲבָה தொடங்கும் infinitive தொடர்களின் தொடர்பு
  choice: ‘அதாவது’ என்று முன் கட்டளையின் உள்ளடக்கத்தை விளக்கும் தொடராக அமைத்தல்
  alternative: தனித்தனி விளைவுகள் அல்லது முறைகள் என மொழியாக்கம் செய்தல்
  rationale: எபிரெய இலக்கணம் நோக்கம், உள்ளடக்கம், அல்லது முறை ஆகிய நெருங்கிய உறவுகளை அனுமதிக்கிறது; ‘அதாவது’ அவற்றை கட்டளையின் உட்பொருளாக இயல்பாக இணைக்கிறது, ஆனால் தனி கோட்பாட்டு வரிசையை உருவாக்காது.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுமக்களுக்கு புரியும் மரியாதைமிக்க நடையைப் பயன்படுத்துகிறது. வசனம் அடுத்த வசனத்தில் நிறைவடையும் நிபந்தனை வாக்கியமாக இருப்பதால் இறுதியில் நீண்ட கோடு வைக்கப்பட்டுள்ளது. ‘யாவே’, ‘வழிகளில் நடந்து’, ‘பற்றிக்கொண்டு’ ஆகியவை மூலத்தின் பெயரையும் உருவகங்களையும் காக்கின்றன.
