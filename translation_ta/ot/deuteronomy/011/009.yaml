base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/009.yaml
  text: so that you may live long on the land that Yahweh swore to your fathers to give to them and to their offspring[b][a], a land flowing with milk and honey.
translation:
  language: ta
  text: யாவே உங்கள் தந்தையருக்கும் அவர்களுடைய சந்ததிக்கும்[a] கொடுப்பதாகச் சத்தியம் செய்த, பாலும் தேனும் ஓடும் அந்த நாட்டில் நீங்கள் நீண்ட நாட்கள் வாழும்படியாக.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்களுடைய விதைக்கு.” எபிரேயச் சொல் ஒருமை வடிவில் இருந்து, சந்ததியினரை ஒரு கூட்டாகக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְמַעַן
  choice: நீங்கள் ... வாழும்படிக்கும்
  rationale: நோக்கம் அல்லது விளைவைக் குறிக்கும் எபிரேய இணைப்பின் வலிமையை இயல்பான தமிழில் காக்கிறது; முந்தைய வசனத்துடன் தொடரும் ‘-உம்படிக்கும்’ அமைப்பு பொருத்தமானது.
- source_word: תַּאֲרִיכוּ יָמִים
  choice: நீடித்து வாழ
  rationale: சொல்லுக்குச் சொல் ‘நாட்களை நீட்டித்தல்’ என்ற எபிரேய மரபுத்தொடர் நீண்ட காலம் வாழ்வதைக் குறிக்கிறது; ‘நீடித்து வாழ’ என்பது இயல்பாகவும் சுருக்கமாகவும் அப்பொருளைத் தருகிறது.
- source_word: עַל הָאֲדָמָה
  choice: அந்த நாட்டில்
  rationale: உபாகமச் சூழலில் אֲדָמָה வெறும் மண்ணை அல்ல, வாக்குறுதியளிக்கப்பட்ட நாட்டைக் குறிக்கிறது. தமிழ் இடவழக்கில் ‘நாட்டில்’ இயல்பானது.
- source_word: אֲשֶׁר נִשְׁבַּע יְהוָה
  choice: யெகோவா ... அளிப்பதாக ஆணையிட்ட
  rationale: נִשְׁבַּע என்பதன் உறுதிமொழி சார்ந்த வலிமையை ‘ஆணையிட்ட’ காக்கிறது; தெய்வீகப் பெயர் தனிப்பெயராக ஒலிபெயர்க்கப்படுகிறது.
- source_word: לַאֲבֹתֵיכֶם
  choice: உங்கள் தந்தையருக்கு
  rationale: எபிரேய உரையின் ‘உங்கள் தந்தையர்’ என்ற குறிப்பிட்ட சொல்லாட்சியை பாலினமற்ற பொதுச்சொல்லாக மாற்றாமல் காக்கிறது.
- source_word: לָתֵת לָהֶם וּלְזַרְעָם
  choice: அவர்களுக்கும் அவர்களுடைய சந்ததிக்கும் அளிப்பதாக
  rationale: זֶרַע என்பதன் கூட்டுப்பொருளை ‘சந்ததி’ இயல்பாகத் தருகிறது; முன்னோர்களுக்கும் அவர்களுக்குப் பின் வரும் சந்ததிக்கும் அளித்த வாக்கைத் தெளிவாகக் காக்கிறது.
- source_word: זָבַת חָלָב וּדְבָשׁ
  choice: பாலும் தேனும் பெருக்கெடுத்து ஓடும்
  rationale: நாட்டின் செழிப்பைக் குறிக்கும் உருவகத்தைத் தக்கவைத்து, ‘பாயும்’ என்பதைக் காட்டிலும் வளமையின் கருத்தைத் தமிழில் தெளிவாக்குகிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரை வழங்குதல்
  choice: யெகோவா
  alternative: கர்த்தர்
  rationale: மூல உரையில் பொதுப் பட்டப்பெயர் அல்ல, நான்கெழுத்துத் தெய்வீகத் தனிப்பெயர் நேரடியாக உள்ளது. தமிழில் பரவலாக அறியப்படும் தனிப்பெயர் வடிவமான ‘யெகோவா’ அதனைப் பட்டப்பெயராக மாற்றாமல் காக்கிறது.
- issue: ‘அவர்களுக்கும் அவர்களுடைய சந்ததிக்கும்’ என்பதன் பெறுநர்கள்
  choice: இரு பெறுநர் குழுக்களையும் வெளிப்படையாக வைத்தல்
  alternative: ‘அவர்களுடைய சந்ததிக்கு அளிப்பதாக’ என்று முன்னோர்களை உறுதிமொழியின் மறைமுகப் பெறுநர்களாக மட்டும் கொள்ளுதல்
  rationale: לָתֵת לָהֶם וּלְזַרְעָם என்பதில் ‘அவர்களுக்கும்’ மற்றும் ‘அவர்களுடைய சந்ததிக்கும்’ ஆகிய இரண்டும் இலக்கணரீதியாக வெளிப்படுகின்றன; நிலம் முன்னோர்களுக்கும் சந்ததிக்கும் அளிக்கப்படுவது குறித்த உரையின் வரலாற்று-இறையியல் இழுவிசையை மொழிபெயர்ப்பு நீக்கவில்லை.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகருக்குப் புரியும் கண்ணியமான நடையைப் பயன்படுத்துகிறது. எபிரேய வாக்கியத்தின் நோக்கத் தொடர்பும், உறுதிமொழியின் வலிமையும், முன்னோர்களும் சந்ததியும் என்ற இரட்டைச் சுட்டும் காக்கப்பட்டுள்ளன. பிரதான உரையில் ‘தந்தையர்’ மூலத்தின் சொற்பொருளைத் தக்கவைக்கிறது; ‘சந்ததி’ இயல்பான கூட்டுப்பெயராகத் தேர்ந்தெடுக்கப்பட்டது.
