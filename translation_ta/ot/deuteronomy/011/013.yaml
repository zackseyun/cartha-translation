base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/013.yaml
  text: And if you indeed listen to my commandments that I am commanding you today[a], to love Yahweh your God and to serve him with all your heart and with all your soul[c][b],
translation:
  language: ta
  text: நான் இன்று உங்களுக்குக் கட்டளையிடுகிற என் கட்டளைகளுக்கு நீங்கள் கவனமாகச் செவிகொடுத்து[a], உங்கள் கடவுளாகிய யாவேவை[b] நேசித்து, உங்கள் முழு இருதயத்தோடும் முழு உயிரோடும்[c] அவருக்குச் சேவை செய்தால்,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மொழியில் வலியுறுத்தலுடன், ‘நீங்கள் கவனமாகச் செவிகொடுத்தால்’; சூழலில் ‘நீங்கள் கவனமாகக் கீழ்ப்படிந்தால்’ என்ற பொருளையும் தரலாம்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில் YHWH என்ற தெய்வீகப் பெயர்; பாரம்பரியமாக ‘கர்த்தர்’ என்று வழங்கப்படுகிறது; இங்கு ‘யாவே’ என்று ஒலிபெயர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, ‘உங்கள் முழு வாழ்வோடும்’ அல்லது ‘உங்கள் முழு இருப்போடும்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה אִם
  choice: …செய்தால்
  rationale: இந்தச் சொற்றொடர் அடுத்த வசனத்திலும் தொடரும் நிபந்தனையின் முன்னுரையைத் தொடங்குகிறது. இயல்பான தமிழில் நிபந்தனை வினைமுற்றை வாக்கியத்தின் இறுதியில் அமைப்பது பொருத்தமானது.
- source_word: שָׁמֹעַ תִּשְׁמְעוּ
  choice: உண்மையாகவே செவிகொடுத்து
  rationale: வினையெச்ச முழுவடிவமும் வினையும் சேர்ந்த எபிரெயச் சொற்றொடர் வலியுறுத்தலைக் காட்டுகிறது. ‘செவிகொடுத்து’ என்பது கேட்டலையும் அதற்கேற்ப நடந்துகொள்ளுதலையும் உள்ளடக்குகிறது; ‘உண்மையாகவே’ வலியுறுத்தலை வெளிப்படுத்துகிறது.
- source_word: אֶל מִצְוֺתַי
  choice: என் கட்டளைகளுக்கு
  rationale: מִצְוֺת என்பது உடன்படிக்கையின் கடமைகளை விதிக்கும் கட்டளைகளைக் குறிக்கிறது; ‘கட்டளைகள்’ அதன் நேரடியான, புரிந்துகொள்ளத்தக்க தமிழ் இணைச்சொல்.
- source_word: אֲשֶׁר אָנֹכִי מְצַוֶּה אֶתְכֶם הַיּוֹם
  choice: நான் இன்று உங்களுக்குக் கொடுக்கிற
  rationale: நிகழ்காலப் பங்கேற்பு மோசே இப்போது வழங்கிக்கொண்டிருக்கும் கட்டளையைச் சுட்டுகிறது. ‘கட்டளை கொடுக்கிற’ என்பதிலுள்ள தேவையற்ற மறுபடியுரைத்தலைத் தவிர்த்து, இயல்பான தமிழில் ‘கொடுக்கிற’ என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: לְאַהֲבָה
  choice: நேசித்து
  rationale: தமிழ் நிபந்தனை வாக்கிய அமைப்பில் அடுத்தடுத்த செயல்களை இயல்பாக இணைக்க வினையெச்சம் பயன்படுத்தப்பட்டுள்ளது; மூலத்தின் ‘நேசிக்க’ என்ற பொருள் பாதுகாக்கப்படுகிறது.
- source_word: יְהוָה אֱלֹהֵיכֶם
  choice: உங்கள் கடவுளாகிய யாவேவை
  rationale: தெய்வீகப் பெயரான YHWH ஒரு பட்டத்தால் மாற்றப்படாமல் ஒலிபெயர்க்கப்பட்டுள்ளது; אֱלֹהֵיכֶם உடன்படிக்கை உறவைச் சுட்டும் ‘உங்கள் கடவுள்’ என்று மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: וּלְעָבְדוֹ
  choice: அவருக்குப் பணிசெய்தால்
  rationale: עבד என்பது கீழ்ப்படிதல், சேவை, வழிபாடு ஆகியவற்றை உள்ளடக்கக்கூடும். ‘பணிசெய்’ அதன் பரந்த சேவைப் பொருளைப் பாதுகாக்கிறது; ‘வழிபடு’ என்று மட்டும் குறுக்கப்படவில்லை.
- source_word: בְּכָל לְבַבְכֶם
  choice: உங்கள் முழு இருதயத்தோடும்
  rationale: לֵבָב சிந்தனை, விருப்பம், பற்று ஆகியவை அடங்கிய உள்ளார்ந்த மனிதரைச் சுட்டுகிறது. ‘இருதயம்’ இச்சூழலில் நிலைபெற்ற, கண்ணியமான தமிழ் இணைச்சொல்.
- source_word: וּבְכָל נַפְשְׁכֶם
  choice: முழு உயிரோடும்
  rationale: נֶפֶשׁ உயிர், தன்முழுமை, உயிருள்ள நபர் ஆகிய பொருட்களைக் கொண்டது. நவீன தமிழில் ‘உயிர்’ மூலத்தின் பரந்த உயிர்/முழு இருப்பு உணர்வை ‘ஆத்துமா’ என்பதைக் காட்டிலும் நன்கு வெளிப்படுத்துகிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலத்தில் தனிப்பட்ட உடன்படிக்கைப் பெயர் நேரடியாக உள்ளது. அதை ஒரு பட்டமாக மாற்றாமல் ‘யாவே’ என்று ஒலிபெயர்ப்பது மூல வடிவத்தை வெளிப்படையாகப் பாதுகாக்கிறது; உச்சரிப்பின் வரலாற்றுச் சிக்கல் அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
- issue: שָׁמֹעַ תִּשְׁמְעוּ என்பதன் கேட்டல்–கீழ்ப்படிதல் நுணுக்கம்
  choice: உண்மையாகவே செவிகொடுத்து
  alternative: கவனமாகக் கீழ்ப்படிந்து
  rationale: எபிரெய வினை கேட்டலையும் அதனால் விளையும் கீழ்ப்படிதலையும் குறிக்கலாம். முதன்மை உரை அதன் செவிகொடுத்தல் உருவகத்தைப் பாதுகாக்கிறது; கீழ்ப்படிதல் நுணுக்கம் அடிக்குறிப்பில் சொல்லப்படுகிறது.
- issue: נֶפֶשׁ என்பதன் மனித இயல்பு சார்ந்த பரப்பு
  choice: முழு உயிரோடும்
  alternative: முழு ஆத்துமாவோடும்; முழு உள்ளத்தோடும்
  rationale: இங்கு נֶפֶשׁ உடலிலிருந்து பிரிந்த ஒரு பகுதியை மட்டும் அவசியமாகக் குறிக்காது; ஒருவரின் உயிரையும் முழு இருப்பையும் குறிக்கலாம். ஆகவே ‘உயிர்’ தேர்ந்தெடுக்கப்பட்டு, மாற்று விளக்கம் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் நிபந்தனை அடுத்த வசனத்தில் தொடருவதால் வசனம் காற்புள்ளியுடன் முடிகிறது. ‘இருதயம்’ வேதாகம உடன்படிக்கை மொழியின் பரிச்சயத்தைத் தக்கவைக்கிறது; ‘உயிர்’ נֶפֶשׁ என்பதன் பரந்த பொருளைத் தெளிவாகக் காட்டுகிறது.
