  text: כִּ֤י עֵֽינֵי/כֶם֙ הָֽ/רֹאֹ֔ת אֶת כָּל מַעֲשֵׂ֥ה יְהוָ֖ה הַ/גָּדֹ֑ל אֲשֶׁ֖ר עָשָֽׂה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/007.yaml
  text: For your own eyes have seen all the great work of Yahweh that he did[a].
translation:
  language: ta
  text: ஏனெனில், யாவே செய்த மாபெரும் செயல்கள் அனைத்தையும் உங்கள் கண்களே கண்டன[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “உங்கள் கண்கள்—காண்பவை” என்று உள்ளது; அவர்கள் நேரில் கண்ட சாட்சிகள் என்பதை வலியுறுத்தும் சொற்றொடர் இது.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய அறிவுறுத்தலுக்கான காரணத்தையோ விளக்கத்தையோ அறிமுகப்படுத்துகிறது; தமிழில் உரையோட்டத்துக்கு இயல்பான காரண இணைப்புச் சொல்.
- source_word: עֵינֵיכֶם הָרֹאֹת
  choice: உங்கள் கண்களே கண்டன
  rationale: ‘உங்கள் கண்கள்—காண்பவை’ என்ற வலியுறுத்தப்பட்ட எபிரெய அமைப்பை, நேரில் கண்ட சாட்சிகள் அவர்களே என்பதைக் காட்டும் இயல்பான தமிழில் ‘கண்களே’ என வெளிப்படுத்துகிறது.
- source_word: אֶת כָּל מַעֲשֵׂה
  choice: செயல் அனைத்தையும்
  rationale: ஒருமை வடிவிலுள்ள ‘செயல்’ என்பதைப் பேணி, யாவே செய்தவற்றின் முழுத்தொகுதியைக் குறிக்கும் ‘அனைத்தையும்’ என்பதுடன் வழங்குகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், எபிரெய நான்கெழுத்துப் பெயரின் பரவலாக ஏற்றுக்கொள்ளப்பட்ட தமிழாக்கமாக வழங்குகிறது.
- source_word: הַגָּדֹל
  choice: மாபெரும்
  rationale: செயலின் பெருமையையும் அளவையும் நேரடியாக வெளிப்படுத்துகிறது; ‘வல்லமையான’ என்று பொருளைச் சுருக்கமாக விளக்கிச் சேர்ப்பதைத் தவிர்க்கிறது.
- source_word: אֲשֶׁר עָשָׂה
  choice: செய்த
  rationale: உறவுநிலை வாக்கியத்தைத் தமிழில் இயல்பான பெயரெச்சத் தொடராக மாற்றி, எளிய வினைப் பொருளைப் பேணுகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலத்தில் தனிப்பட்ட இறைப்பெயர் நேரடியாக இருப்பதால், அதை ஒரு பட்டப்பெயரால் மாற்றாமல் ஒலிபெயர்க்கிறது; ‘யெகோவா’ என்பதற்குப் பதில் எபிரெய உச்சரிப்புக்குச் சற்றே நெருக்கமான வழக்கைத் தேர்ந்தெடுக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. ‘உங்கள் கண்களே’ என்பது மூலத்தின் வலியுறுத்தலை இயல்பாகப் பேணுகிறது; ‘செயல் அனைத்தையும்’ என்பது ஒருமைத் தொகுப்புணர்வைத் தக்கவைக்கிறது.
