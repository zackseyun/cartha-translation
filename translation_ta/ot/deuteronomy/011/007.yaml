revisions:
- from: ஏனெனில், யாவே செய்த மாபெரும் செயல் அனைத்தையும் உங்கள் கண்களே கண்டன[a].
  to: ஏனெனில், யாவே செய்த மாபெரும் செயல்கள் அனைத்தையும் உங்கள் கண்களே கண்டன[a].
  rationale: The revision makes the collective object natural in modern standard Tamil. It retains the causal connector, the emphatic ‘உங்கள் கண்களே,’ the divine name ‘யாவே,’ the greatness of the deed, and the footnote’s explanation of the Hebrew participial emphasis.
