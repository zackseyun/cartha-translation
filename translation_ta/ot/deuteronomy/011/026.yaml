source:
  edition: WLC
  text: רְאֵ֗ה אָנֹכִ֛י נֹתֵ֥ן לִ/פְנֵי/כֶ֖ם הַ/יּ֑וֹם בְּרָכָ֖ה וּ/קְלָלָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/026.yaml
  text: See[a], today I am setting before you a blessing and a curse.
translation:
  language: ta
  text: பார், இன்று நான் உங்கள் முன் ஆசீர்வாதத்தையும் சாபத்தையும் வைக்கிறேன்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘வைக்கிறேன்’ என்பதற்கு, “உங்கள் முன் ஆசீர்வாதத்தையும் சாபத்தையும் கொடுக்கிறேன்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: רְאֵה
  choice: பார்
  rationale: ראה என்பதன் ஆண்பால் ஒருமை கட்டளை வடிவம் கவனத்தை ஈர்க்கிறது. ‘பார்’ என்பது அதன் நேரடியான கட்டளை வலிமையை நவீன தமிழில் இயல்பாகத் தக்கவைக்கிறது.
- source_word: אָנֹכִי
  choice: நான்
  rationale: தனித்து வரும் முதலாம் நபர் சுட்டுப்பெயர் வலியுறுத்தலைக் கொண்டிருந்தாலும், தமிழில் வெளிப்படையான ‘நான்’ அதைப் போதுமான அளவு உணர்த்துகிறது; ‘நானே’ என்பது சூழலில் அளவுக்கு மீறிய வலியுறுத்தலாகலாம்.
- source_word: נֹתֵן
  choice: வைக்கிறேன்
  rationale: נתן என்பதற்கு ‘கொடு/வை’ என்ற பொருள்கள் உண்டு. ‘உங்கள் முன்’ என்பதோடு சேரும்போது, தேர்வுகளை முன்வைக்கும் கருத்தை ‘வைக்கிறேன்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: לִפְנֵיכֶם
  choice: உங்கள் முன்
  rationale: இது ‘உங்களுக்கு முன்பாக/உங்கள் முன்னிலையில்’ என்ற வழக்குச் சொற்றொடர்; இச்சூழலில் ‘உங்கள் முன்’ தெளிவான, இயல்பான தமிழ்.
- source_word: הַיּוֹם
  choice: இன்று
  rationale: காலத்தைக் குறிக்கும் சொல்லின் நேரடியான, இயல்பான நவீனத் தமிழ் இணை.
- source_word: בְּרָכָה
  choice: ஆசீர்வாதம்
  rationale: உடன்படிக்கைச் சூழலில் வழங்கப்படும் நன்மையைச் சுட்டும் ஒருமைப் பெயர்ச்சொல். ‘ஆசீர்வாதம்’ என்பது பொதுவாகப் புரியக்கூடிய நிலையான தமிழ் சொல்.
- source_word: וּקְלָלָה
  choice: சாபம்
  rationale: ஆசீர்வாதத்திற்கு எதிரான உடன்படிக்கை விளைவைச் சுட்டுகிறது. ‘சாபம்’ இந்த எதிரிணையைச் சுருக்கமாகவும் தெளிவாகவும் தக்கவைக்கிறது.
theological_decisions:
- issue: ஆசீர்வாதம்–சாபம் என்ற இணையின் தன்மை
  choice: உடன்படிக்கையின் இரு மாற்றுவழிகள் முன்வைக்கப்படுவதாக மட்டும் மொழிபெயர்த்தல்
  alternative: பொதுவான நற்கூலி–தண்டனை நியதியாக விளக்கிப் பரவலாக்குதல்
  rationale: இந்த வசனம் உபாகமச் சூழலில் உடன்படிக்கையின் ஆசீர்வாதத்தையும் சாபத்தையும் அறிமுகப்படுத்துகிறது. மூலவசனம் கூறாத பிற்காலக் கோட்பாட்டு விளக்கங்களைச் சேர்க்காமல் அதன் பதற்றத்தையும் நேரடியான முன்வைப்பையும் காக்க வேண்டும்.
translation_notes:
  register: நவீன, கண்ணியமான, பொதுவாகப் புரியும் தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘பார்’ என்ற ஒருமைக் கட்டளையும் ‘உங்கள்’ என்ற பன்மைச் சுட்டுதலும் எபிரெய மூலத்தில் உள்ள எண்ணிக்கை மாற்றத்தைத் தக்கவைக்கின்றன.
