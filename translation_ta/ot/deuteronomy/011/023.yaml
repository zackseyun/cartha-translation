source:
  edition: WLC
  text: וְ/הוֹרִ֧ישׁ יְהוָ֛ה אֶת כָּל הַ/גּוֹיִ֥ם הָ/אֵ֖לֶּה מִ/לִּ/פְנֵי/כֶ֑ם וִֽ/ירִשְׁתֶּ֣ם גּוֹיִ֔ם גְּדֹלִ֥ים וַ/עֲצֻמִ֖ים מִ/כֶּֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/023.yaml
  text: then Yahweh will drive out all these nations before you, and you will dispossess nations greater and mightier than you.
translation:
  language: ta
  text: அப்போது யாவே இந்த எல்லாத் தேசங்களையும் உங்கள் முன்னிலையிலிருந்து துரத்திவிடுவார்; உங்களைவிடப் பெரியதும் வலிமைமிக்கதுமான தேசங்களை நீங்கள் கைப்பற்றுவீர்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהוֹרִישׁ
  choice: துரத்திவிடுவார்
  rationale: ירשׁ என்பதன் ஹிஃபில் வடிவம் ஒருவரை அவரது உடைமையிலிருந்து அகற்றும் காரணவினைப் பொருளைத் தருகிறது; வெற்றிகொள்ளும் சூழலில் இயல்பான தமிழாக இது அமைகிறது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: இறைப்பட்டமான ‘ஆண்டவர்’ என்பதற்குப் பதிலாக, எபிரேயத் தனிப்பெயரான நான்கு எழுத்துப் பெயரைத் தமிழில் வழக்கமான ஒலிபெயர்ப்பாகக் காக்கிறது.
- source_word: כָּל הַגּוֹיִם הָאֵלֶּה
  choice: இந்த எல்லா தேசத்தாரையும்
  rationale: גּוֹיִם இங்கு நிலப்பகுதிகளை அல்ல, அவற்றில் வாழும் இன-அரசியல் மக்களைக் குறிக்கிறது; மனிதர்களைக் குறிக்கும் நேரடி பொருளுக்கும் தொடரும் வினைக்கும் ‘தேசத்தார்’ பொருந்துகிறது.
- source_word: מִלִּפְנֵיכֶם
  choice: உங்கள் முன்னிலையிலிருந்து
  rationale: ‘உங்கள் முகம்/சந்நிதிக்கு முன்பிருந்து’ என்ற மூல உருவகத்தையும் அகற்றப்படுதல் என்ற பொருளையும் தெளிவாகத் தக்கவைக்கிறது.
- source_word: וִירִשְׁתֶּם
  choice: அவர்களுடைய உடைமையிலிருந்து அகற்றுவீர்கள்
  rationale: Qal ירשׁ என்பது சுதந்தரித்தல், உடைமையாக்குதல் அல்லது உடைமையிலிருந்து அகற்றுதல் என்று அமையலாம். நேரடி பொருள் தேசத்தார் என்பதால் ‘அகற்றுவீர்கள்’ பொருத்தமானது; ‘அவர்களுடைய உடைமையிலிருந்து’ என்பது தமிழில் தேவையான பொருளை வெளிப்படுத்துகிறது.
- source_word: גְּדֹלִים וַעֲצֻמִים
  choice: பெரியவர்களும் வலிமைமிக்கவர்களுமான
  rationale: מִכֶּם உடன் வரும் ஒப்பீட்டை ‘உங்களைவிட’ வெளிப்படுத்துகிறது; עָצוּם குறிக்கும் வலிமை/ஆற்றலை ‘வலிமைமிக்க’ இயல்பாக வழங்குகிறது.
- source_word: מִכֶּם
  choice: உங்களைவிட
  rationale: מִן முன்னொட்டின் ஒப்பீட்டுப் பயன்பாட்டையும் இரண்டாம் நபர் பன்மையையும் நேரடியாகக் காட்டுகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைத்தனிப்பெயரின் மொழிபெயர்ப்பு
  choice: யெகோவா
  alternative: யாவே; ஆண்டவர்
  rationale: மூலத்தில் இறைத்தனிப்பெயர் நேரடியாக உள்ளது. தமிழில் பரவலாக அறியப்படும் தனிப்பெயர் ஒலிபெயர்ப்பை பயன்படுத்துவது பெயரைப் பட்டமாக மாற்றாமல் காக்கிறது; எபிரேய உச்சரிப்பின் முழுத் துல்லியம் உறுதியற்றது.
- issue: וִירִשְׁתֶּם என்பதன் பொருள்
  choice: தேசத்தாரை அவர்களுடைய உடைமையிலிருந்து அகற்றுவீர்கள்
  alternative: தேசத்தாரை உடைமையாக்குவீர்கள்; அவர்களுடைய நாட்டைச் சுதந்தரிப்பீர்கள்
  rationale: வினையின் நேரடி பொருள் ‘தேசத்தார்’ என்பதால், இங்கு அவர்களை வெளியேற்றி அவர்களின் இடத்தைப் பிடித்தல் முன்னிலைப்படுகிறது. இருப்பினும் ירשׁ-இன் உடைமையாக்கும் நிழற்பொருளும் சூழலில் உள்ளது.
translation_notes:
  register: நவீன தரத் தமிழில் கண்ணியமான, வாசிக்க எளிய நடை. மூலவாக்கியத்தின் இரண்டு இணை எதிர்காலச் செயல்களும் காக்கப்பட்டுள்ளன. ‘தேசத்தார்’ மனிதக் குழுக்களைக் குறிக்கிறது; ‘உடைமையிலிருந்து அகற்றுவீர்கள்’ என்பது வன்முறைச் சூழலை மறைக்காமல், தமிழில் இயல்பாக விளக்குகிறது.
