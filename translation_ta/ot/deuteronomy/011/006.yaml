  text: וַ/אֲשֶׁ֨ר עָשָׂ֜ה לְ/דָתָ֣ן וְ/לַ/אֲבִירָ֗ם בְּנֵ֣י אֱלִיאָב֮ בֶּן רְאוּבֵן֒ אֲשֶׁ֨ר פָּצְתָ֤ה הָ/אָ֨רֶץ֙ אֶת פִּ֔י/הָ וַ/תִּבְלָעֵ֥/ם וְ/אֶת בָּתֵּי/הֶ֖ם וְ/אֶת אָהֳלֵי/הֶ֑ם וְ/אֵ֤ת כָּל הַ/יְקוּם֙ אֲשֶׁ֣ר בְּ/רַגְלֵי/הֶ֔ם בְּ/קֶ֖רֶב כָּל יִשְׂרָאֵֽל־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/006.yaml
  text: and what he did to Dathan and Abiram[a], sons of Eliab son of Reuben—how the earth opened its mouth and swallowed them, their households, their tents, and every living thing at their feet[b], in the midst of all Israel.
translation:
  language: ta
  text: ரூபனின் மகனான எலியாபின் மகன்களாகிய தாத்தானுக்கும் அபிராமுக்கும் அவர் செய்ததையும்—பூமி தன் வாயைத் திறந்து அவர்களையும், அவர்களுடைய வீடுகளையும்[a], கூடாரங்களையும், அவர்களுடைய காலடியில் இருந்த அனைத்தையும்[b], இஸ்ரவேலர் அனைவரின் நடுவில் விழுங்கியதையும்—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லடியாக, “அவர்களுடைய வீடுகள்.” எபிரெயச் சொல் அவர்களுடைய குடியிருப்புகளையோ, விரிவாக அவர்களுடைய குடும்பத்தாரையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: சொல்லடியாக, “அவர்களுடைய காலடியில் இருந்த எல்லா யெகூமும்.” அரிதான இந்த எபிரெயச் சொல்லும் முழுச் சொற்றொடரும், அவர்களோடு இருந்த அல்லது அவர்களுக்குச் சொந்தமான மக்கள், உயிரினங்கள், உடைமைகள் ஆகிய அனைத்தையும் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָשָׂה
  choice: செய்தது
  rationale: பின்னோக்கிக் குறிப்பிடும் இத்தொடரில் எபிரெயப் பொதுவினையின் இயல்பான, நேரடியான பொருளைப் பாதுகாக்கிறது.
- source_word: בְּנֵי אֱלִיאָב בֶּן רְאוּבֵן
  choice: ரூபனின் மகனான எலியாபின் மகன்கள்
  rationale: வம்சவரிசையைக் குறிக்கும் எபிரெயச் சொற்றொடரை உரிச்சொல்லாக மாற்றாமல் தெளிவாகப் பாதுகாக்கிறது.
- source_word: פָּצְתָה הָאָרֶץ אֶת־פִּיהָ
  choice: பூமி தன் வாயைத் திறந்து
  rationale: மூலத்தின் உயிரோட்டமுள்ள உருவகத்தையும் பூமியை ஆளுருவாக்கும் நடையையும் காக்கிறது.
- source_word: וַתִּבְלָעֵם
  choice: அவர்களை விழுங்கியது
  rationale: בלע என்பதன் நேரடியான, காட்சியளிக்கும் பொருள் ‘விழுங்குதல்’ ஆகும்.
- source_word: בָּתֵּיהֶם
  choice: அவர்களுடைய குடும்பத்தார்
  rationale: சொல்லடியாக ‘வீடுகள்’ என்றாலும், கூடாரங்கள் தனியே பட்டியலிடப்படுவதால் இங்கு வீட்டார் அல்லது குடும்பத்தினர் எனும் விரிவான பொருள் சூழலுக்கு ஏற்றது; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: אָהֳלֵיהֶם
  choice: அவர்களுடைய கூடாரங்கள்
  rationale: வனாந்தரச் சூழலுக்கு ஏற்ற நேரடியான மொழிபெயர்ப்பு.
- source_word: כָּל־הַיְקוּם אֲשֶׁר בְּרַגְלֵיהֶם
  choice: அவர்களுடைய காலடியில் இருந்த அனைத்தும்
  rationale: அரிதான יְקוּם சொல்லையும் ‘காலடியில்’ என்ற எபிரெயத் தொடரையும் அளவுக்கு மீறி விளக்காமல், மூலத்தின் பொருள் விரிவையும் தெளிவின்மையையும் பாதுகாக்கிறது.
- source_word: בְּקֶרֶב כָּל־יִשְׂרָאֵל
  choice: இஸ்ரவேலர் அனைவரின் நடுவில்
  rationale: நிகழ்வு முழு இஸ்ரவேலின் மத்தியில் வெளிப்படையாக நடந்த இடவியல் உணர்வைப் பாதுகாக்கிறது.
