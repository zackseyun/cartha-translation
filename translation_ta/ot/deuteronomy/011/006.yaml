translation_notes:
  register: நவீனத் தரமான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. வசனம் முந்தைய கட்டளையின் தொடராக இருப்பதால் இயல்பான முழுமைக்காக இறுதியில் ‘நினைவில் கொள்ளுங்கள்’ சேர்க்கப்பட்டுள்ளது; நீண்ட பட்டியல் கோடுகளால் ஒழுங்குபடுத்தப்பட்டுள்ளது. பெயர்கள் பொதுவாக அறியப்பட்ட தமிழ் வேதாகம ஒலிபெயர்ப்பு மரபுக்கு ஏற்றவாறு தரப்பட்டுள்ளன.
