base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/012.yaml
  text: a land that Yahweh your God cares for; the eyes of Yahweh your God are continually on it[a], from the beginning of the year to the end of the year.
translation:
  language: ta
  text: உன் கடவுளாகிய யாவே பராமரிக்கிற[a] தேசம் அது; ஆண்டின் தொடக்கமுதல் ஆண்டின் இறுதிவரை உன் கடவுளாகிய யாவேயின் கண்கள் எப்போதும் அதன்மேல் இருக்கின்றன.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “பராமரிக்கிற” என்பதற்கு “தேடுகிற” அல்லது “அக்கறையுடன் கவனிக்கிற” என்றும் மொழிபெயர்க்கலாம். எபிரெய வினைச்சொல் தேடுதல், விசாரித்தல், அக்கறையுடன் கவனித்தல் ஆகிய பொருள்களைக் கொண்டது; இங்கு தேசத்தின்மீதான யாவேயின் செயல்மிக்க அக்கறையை உணர்த்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶרֶץ
  choice: தேசம்
  rationale: இங்கு உலகம் முழுவதையும் குறிக்காமல், இஸ்ரவேலருக்கு வாக்களிக்கப்பட்ட நிலப்பரப்பைக் குறிக்கிறது; சூழலுக்கு ஏற்ற இயல்பான தமிழ் சொல்.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரான நான்கு எழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் அறியப்பட்ட ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: אֱלֹהֶיךָ
  choice: உன் கடவுள்
  rationale: இரண்டாம் நபர் ஆண்பால் ஒருமை பின்னொட்டுடன் உள்ள உடன்படிக்கைச் சார்ந்த நேரடி அழைப்பைத் துல்லியமாகக் காட்டுகிறது.
- source_word: דֹּרֵשׁ אֹתָהּ
  choice: அதைப் பராமரிக்கிற
  rationale: דרש என்பதன் அடிப்படைப் பொருள் ‘தேடுதல்/விசாரித்தல்’ என்றாலும், தேசத்தைப் பொருளாகக் கொண்ட இச்சூழலில் அக்கறையுடன் கவனித்துப் பராமரிப்பதை உணர்த்துகிறது.
- source_word: תָּמִיד
  choice: எப்போதும்
  rationale: தொடர்ந்தும் இடைவிடாமலும் இருக்கும் கவனத்தை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: עֵינֵי יְהוָה אֱלֹהֶיךָ בָּהּ
  choice: உன் கடவுளாகிய யாவேயின் கண்கள் அதன்மேல் இருக்கின்றன
  rationale: கடவுளின் கண்கள் தேசத்தின்மேல் இருப்பதாகிய எபிரெய உருவகத்தைப் பராமரித்து, தமிழில் இயல்பாக வழங்குகிறது.
- source_word: מֵרֵשִׁית הַשָּׁנָה וְעַד אַחֲרִית שָׁנָה
  choice: ஆண்டின் தொடக்கமுதல் ஆண்டின் இறுதிவரை
  rationale: முழு ஆண்டையும் உள்ளடக்கும் கால எல்லையைத் தெளிவாகவும் சுருக்கமாகவும் தெரிவிக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலத்தில் தனிப்பட்ட உடன்படிக்கைப் பெயர் நேரடியாக இருப்பதால், அதை ஒரு பட்டமாக மாற்றாமல் ஒலிபெயர்த்து, குறிப்பிட்ட சமய மரபின் மாற்றீட்டைத் தவிர்க்கிறது.
- issue: கடவுளின் ‘கண்கள்’ என்ற மனித உருவகம்
  choice: உருவகத்தை அப்படியே வைத்தல்
  alternative: ‘அவர் அதை எப்போதும் கவனித்துக்கொள்கிறார்’ என்று விளக்கமாக மாற்றுதல்
  rationale: மூலத்தின் கவிதைமிக்க மனித உருவகத்தையும், கடவுளின் தொடர்ந்த கவனத்தையும் பாதுகாக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழ்; பொதுவாசகர்களுக்குப் புரியும் dignified நடையில், மூலத்தின் மீளுரையையும் ‘கண்கள்’ என்ற உருவகத்தையும் காக்கிறது. வசனத்தின் தொடர்ச்சிக்காக ‘தேசம் அது’ என்ற அமைப்பு பயன்படுத்தப்பட்டுள்ளது.
