revisions:
- from: எகிப்தின் நடுவில்[a] பார்வோன் என்னும் எகிப்தின் அரசனுக்கும் அவனுடைய நாடு முழுவதற்கும் அவர் செய்த அடையாளங்களையும் செயல்களையும்—
  to: எகிப்தின் நடுவில்[a] எகிப்தின் அரசனான பார்வோனுக்கும்[b] அவனுடைய நாடு முழுவதற்கும் அவர் செய்த அடையாளங்களையும் செயல்களையும்—
  rationale: வசனத்தின் பொருள் மாற்றப்படவில்லை. இயல்பான நவீன தமிழ் அடைமொழி அமைப்பிற்காக ‘எகிப்தின் அரசனான பார்வோன்’ எனச் சீரமைக்கப்பட்டது. எபிரேய לְ-இன் முறையான ‘-க்கு’ பொருள் முதன்மை உரையில் தக்கவைக்கப்பட்டு, சூழல்சார்ந்த ‘எதிராக’ வாசிப்பு அடிக்குறிப்பில் சேர்க்கப்பட்டது. இறுதியிலுள்ள நீண்ட கோடு, முந்தைய வசனத்தின் வினையோடு தொடரும் அமைப்பைச் சுட்டுகிறது.
