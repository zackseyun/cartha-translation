  yaml_path: translation/ot/deuteronomy/011/003.yaml
  text: and his signs and his deeds that he did in the midst of Egypt[c][b][a], to Pharaoh king of Egypt and to all his land—
translation:
  language: ta
  text: எகிப்தின் நடுவில்[a] எகிப்தின் அரசனான பார்வோனுக்கும்[b] அவனுடைய நாடு முழுவதற்கும் அவர் செய்த அடையாளங்களையும் செயல்களையும்—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘எகிப்தில்.’ எபிரேயத்தில் சொல்லுக்குச் சொல், ‘எகிப்தின் நடுவில்.’
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘எகிப்தின் அரசனான பார்வோனுக்கு எதிராகவும் அவனுடைய நாடு முழுவதற்கு எதிராகவும்.’ எபிரேய முன்னிடைச்சொல் சொல்லுக்குச் சொல் ‘-க்கு’; ஆனால் சூழல் தீர்ப்புச் செயல்கள் அவர்களை நோக்கிச் செய்யப்பட்டதைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹתֹתָיו
  choice: அவர் செய்த அடையாளங்கள்
  rationale: אוֹת என்பதன் அடிப்படைப் பொருளான ‘அடையாளம்’ என்பதைக் காக்கிறது; சூழலால் அவை அற்புத அடையாளங்கள் என்பது தெளிவாகிறது, ஆனால் அதை உரைக்குள் கூடுதலாகச் சேர்க்கவில்லை.
- source_word: מַעֲשָׂיו
  choice: அவர் செய்த செயல்கள்
  rationale: מַעֲשֶׂה என்பது செய்யப்பட்ட செயல் அல்லது நடவடிக்கையைக் குறிக்கிறது; ‘செயல்கள்’ நவீன தமிழில் இயல்பாகவும் பரந்த பொருளைத் தக்கவைத்தும் உள்ளது.
- source_word: אֲשֶׁר עָשָׂה
  choice: அவர் செய்த
  rationale: தொடர்புச் சொல்லையும் வினையையும் தமிழில் இயல்பான பெயரெச்சத் தொடராக வழங்குகிறது; இது அடையாளங்கள், செயல்கள் ஆகிய இரண்டுடனும் தொடர்புடையது.
- source_word: בְּתוֹךְ מִצְרַיִם
  choice: எகிப்தின் நடுவில்
  rationale: בְּתוֹךְ என்பதிலுள்ள ‘நடுவில்/உள்ளே’ என்ற வலியுறுத்தலை நேரடியாகப் பாதுகாக்கிறது.
- source_word: לְפַרְעֹה
  choice: பார்வோனுக்கு
  rationale: לְ என்பதன் முறையான ‘-க்கு’ இலக்கைத் தக்கவைக்கிறது; சூழலில் தீர்ப்புக்குரிய எதிர்நோக்கம் இருந்தாலும் ‘எதிராக’ என்று உரைக்குள் முடிவுசெய்யவில்லை.
- source_word: מֶלֶךְ מִצְרַיִם
  choice: எகிப்தின் அரசன்
  rationale: எபிரேய இணைப்புத் தொடரை இயல்பான நவீன தமிழில் துல்லியமாக வழங்குகிறது.
- source_word: וּלְכָל אַרְצוֹ
  choice: அவனுடைய நாடு முழுவதற்கும்
  rationale: כָּל + אֶרֶץ + உடைமை விகுதியின் முழுமையையும் பிரதேசப் பொருளையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: וְאֶת ... וְאֶת
  choice: அடையாளங்களையும் செயல்களையும்
  rationale: மீண்டும் வரும் இணைப்பையும் நேரடி செயப்படுபொருள் அமைப்பையும் தமிழின் ‘-ஐயும் ... -ஐயும்’ வடிவில் பாதுகாக்கிறது.
theological_decisions:
- issue: לְ முன்னிடைச்சொல் பார்வோனையும் நாட்டையும் எவ்வாறு குறிக்கிறது
  choice: ‘அரசனுக்கும் ... நாடு முழுவதற்கும்’ என்று முறையாக வழங்கப்பட்டது
  alternative: ‘அரசனுக்கு எதிராகவும் ... நாடு முழுவதற்கு எதிராகவும்’
  rationale: சூழல் தீர்ப்புச் செயல்களைக் குறித்தாலும், எபிரேய לְ தன்னிச்சையாக ‘எதிராக’ என்பதை மட்டும் நிர்ணயிப்பதில்லை; ஆகவே மூலத்தின் பரந்த இலக்கு/பாதிப்பு உறவு பாதுகாக்கப்பட்டது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகருக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. முந்தைய வசனத்தின் வினையுடன் தொடரும் பட்டியல் அமைப்பைக் காட்ட இறுதியில் நீண்ட கோடு வைக்கப்பட்டது. ‘பார்வோன்’ என்பது தனிப்பெயராக அல்லாமல் பதவிப்பெயராக வருவதால், ‘பார்வோன் என்னும் எகிப்தின் அரசன்’ எனத் தெளிவாக்கப்பட்டது.
