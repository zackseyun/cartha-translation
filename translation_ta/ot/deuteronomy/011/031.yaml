base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/031.yaml
  text: For you are crossing the Jordan to go in to take possession of the land that Yahweh your God is giving you[a], and you will take possession of it and live in it.
translation:
  language: ta
  text: ஏனெனில், உங்கள் கடவுளாகிய யாவே உங்களுக்குக் கொடுக்கிற நாட்டிற்குள் சென்று அதை உரிமையாக்கிக்கொள்வதற்காக நீங்கள் யோர்தானைக் கடக்கப்போகிறீர்கள்[a]; அதை உரிமையாக்கிக்கொள்வீர்கள், அதில் குடியிருப்பீர்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரேயத்தில்: ‘YHWH’; பாரம்பரியமாக ‘ஆண்டவர்’ என்று வழங்கப்படுகிறது.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய அறிவுறுத்தலுக்கான காரணத்தை அறிமுகப்படுத்தும் இணைப்புச் சொல்லாக இயல்பாக அமைகிறது.
- source_word: עֹבְרִים
  choice: கடக்கப்போகிறீர்கள்
  rationale: நிகழ்கால எச்சவினைச் சொல் சூழலில் மிக விரைவில் நடைபெறவுள்ள செயலைக் குறிக்கிறது; தமிழில் எதிர்நோக்கியுள்ள செயலை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: הַיַּרְדֵּן
  choice: யோர்தான்
  rationale: ஆற்றின் வழக்கமான தமிழ் பெயர்; மூலத்தில் 'ஆறு' என்பது தனியாக இல்லை.
- source_word: לָבֹא
  choice: நாட்டிற்குள் சென்று
  rationale: யோர்தானைக் கடந்தபின் நாட்டிற்குள் நுழைவதைக் குறிக்கும் בוא என்ற வினையின் இயக்கப் பொருளைப் பாதுகாக்கிறது.
- source_word: לָרֶשֶׁת / וִירִשְׁתֶּם
  choice: உரிமையாக்கிக்கொள்வதற்காக / உரிமையாக்கிக்கொண்டு
  rationale: ירשׁ இங்கு நாட்டைத் தமதாக்கி உடைமையில் கொள்ளும் பொருளைக் கொண்டது; இரு இடங்களிலும் ஒரே கருத்தைத் தொடர்ந்து தருகிறது.
- source_word: הָאָרֶץ
  choice: நாடு
  rationale: இங்கு இஸ்ரவேலருக்குக் கொடுக்கப்படும் குறிப்பிட்ட தேசப்பரப்பைக் குறிக்கிறது; நவீன தமிழில் 'நாடு' இயல்பானது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரான நான்கு எழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல் ஒலிபெயர்க்கிறது.
- source_word: אֱלֹהֵיכֶם
  choice: உங்கள் கடவுள்
  rationale: இரண்டாம் நபர் பன்மை உடைமைப் பின்னொட்டுடன் உள்ள உடன்படிக்கைச் சொல்லாக்கத்தை நேராக வெளிப்படுத்துகிறது.
- source_word: נֹתֵן לָכֶם
  choice: உங்களுக்குக் கொடுக்கிற
  rationale: எச்சவினையின் நிகழ் அல்லது நெருங்கிய செயற்பாட்டுத் தன்மையையும், கடவுள் அளிக்கும் கொடை என்ற கருத்தையும் காக்கிறது.
- source_word: וִישַׁבְתֶּם בָּהּ
  choice: அதில் குடியிருப்பீர்கள்
  rationale: ישׁב என்பதன் அந்த நாட்டில் நிலையாக வாழும் பொருளைத் தெளிவான, மதிப்புமிக்க நவீன தமிழில் தருகிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூலம் தனிப்பட்ட உடன்படிக்கைப் பெயரை நேரடியாகப் பயன்படுத்துவதால், அதை ஒரு பட்டமாக மாற்றாமல் ஒலிபெயர்த்துள்ளது.
- issue: நாட்டைப் பெறுவதில் தெய்வீகக் கொடையும் மனித உரிமையாக்கலும்
  choice: “கொடுக்கிற” என்பதையும் “உரிமையாக்கிக்கொள்வது” என்பதையும் இரண்டையும் நிலைநிறுத்துதல்
  alternative: ஒரே கருத்தாக ‘பெற்றுக்கொள்ளுதல்’ என்று சுருக்குதல்
  rationale: எபிரெய உரை கடவுள் கொடுப்பதையும் மக்கள் அதை உரிமையாக்கிக்கொள்வதையும் அருகருகே வைத்து உள்ள இறையியல் பதற்றத்தைச் சுருக்காமல் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. மூலத்தின் காரணத் தொடர்பு, செயல்வரிசை, தெய்வீகக் கொடை மற்றும் மனிதச் செயல்பாடு ஆகியவை பாதுகாக்கப்பட்டுள்ளன.
