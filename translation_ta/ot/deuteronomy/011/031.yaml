revisions:
- from: ஏனெனில், உங்கள் கடவுளாகிய யாவே உங்களுக்குக் கொடுக்கிற நாட்டிற்குள் சென்று அதை உரிமையாக்கிக்கொள்வதற்காக நீங்கள் யோர்தானைக் கடக்கப்போகிறீர்கள்[a]. நீங்கள் அதை உரிமையாக்கிக்கொண்டு அதில் குடியிருப்பீர்கள்.
  to: ஏனெனில், உங்கள் கடவுளாகிய யாவே உங்களுக்குக் கொடுக்கிற நாட்டிற்குள் சென்று அதை உரிமையாக்கிக்கொள்வதற்காக நீங்கள் யோர்தானைக் கடக்கப்போகிறீர்கள்[a]; அதை உரிமையாக்கிக்கொள்வீர்கள், அதில் குடியிருப்பீர்கள்.
  rationale: 'The revision makes the second occurrence of ירשׁ an explicit future finite verb, matching the Hebrew sequence: crossing, entering to take possession, then taking possession and living in the land. It otherwise retains the draft''s accurate terminology, modern register, and divine-name footnote.'
