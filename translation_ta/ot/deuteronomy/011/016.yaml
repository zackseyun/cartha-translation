revisions:
- from: உங்கள் உள்ளம் ஏமாற்றப்பட்டு, நீங்கள் வழிவிலகி, வேறு தெய்வங்களுக்குச் சேவை செய்து அவற்றைப் பணிந்துகொள்ளாதபடி எச்சரிக்கையாக இருங்கள்.[a]
  to: உங்கள் உள்ளம் ஏமாற்றப்படாமலும், நீங்கள் வழிவிலகி வேறு தெய்வங்களுக்குச் சேவை செய்து அவற்றைப் பணிந்து வணங்காமலும் இருக்கும்படி எச்சரிக்கையாக இருங்கள்.[a]
  rationale: The revision makes the negative force of פֶּן explicitly govern both the heart's deception and the ensuing actions, while retaining the Hebrew progression. It also uses a natural Tamil expression for bowing in worship and refines the lexical-alternative footnote without adding interpretation.
