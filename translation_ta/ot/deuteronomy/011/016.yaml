  text: הִשָּֽׁמְר֣וּ לָ/כֶ֔ם פֶּ֥ן יִפְתֶּ֖ה לְבַבְ/כֶ֑ם וְ/סַרְתֶּ֗ם וַ/עֲבַדְתֶּם֙ אֱלֹהִ֣ים אֲחֵרִ֔ים וְ/הִשְׁתַּחֲוִיתֶ֖ם לָ/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/016.yaml
  text: Be careful lest your heart be deceived and you turn aside and serve other gods and bow down to them[a].
translation:
  language: ta
  text: உங்கள் உள்ளம் ஏமாற்றப்படாமலும், நீங்கள் வழிவிலகி வேறு தெய்வங்களுக்குச் சேவை செய்து அவற்றைப் பணிந்து வணங்காமலும் இருக்கும்படி எச்சரிக்கையாக இருங்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உங்கள் உள்ளம் கவரப்படாமலும்.” எபிரெய வினைச்சொல் வசப்படுத்தப்படுதல், கவரப்படுதல், அல்லது ஏமாற்றப்படுதல் ஆகிய பொருள்களைத் தரக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִשָּׁמְרוּ לָכֶם
  choice: எச்சரிக்கையாக இருங்கள்
  rationale: நிபால் கட்டளை வடிவமும் לָכֶם என்பதன் தற்காப்பு எச்சரிக்கை நுணுக்கமும் இயல்பான நவீன தமிழில் இவ்வாறு தெளிவாக வெளிப்படுகின்றன.
- source_word: פֶּן
  choice: …ஆதபடி
  rationale: எதிர்மறையான விளைவைத் தவிர்க்கும்படி எச்சரிக்கும் இணைப்பாக פֶּן செயல்படுகிறது; தமிழ் வாக்கிய அமைப்பில் ‘…ஆதபடி’ இயல்பாக அந்த எச்சரிக்கையைத் தருகிறது.
- source_word: יִפְתֶּה
  choice: ஏமாற்றப்பட்டு
  rationale: פתה என்பதற்கு ஏமாற்றப்படுதல், இணங்கச் செய்யப்படுதல், கவரப்படுதல் ஆகிய நுணுக்கங்கள் உண்டு. முதன்மை உரையில் ‘ஏமாற்றப்பட்டு’ என்பதும் மாற்று நுணுக்கம் அடிக்குறிப்பிலும் பாதுகாக்கப்படுகிறது.
- source_word: לְבַבְכֶם
  choice: உங்கள் உள்ளம்
  rationale: לֵבָב என்பது உணர்ச்சியை மட்டும் அல்லாமல் சிந்தனை, விருப்பம், முடிவெடுக்கும் அகமனிதனையும் குறிக்கலாம்; நவீன தமிழில் ‘உள்ளம்’ இந்த விரிவை ‘இருதயம்’ என்பதைக் காட்டிலும் இயல்பாகத் தாங்குகிறது.
- source_word: וְסַרְתֶּם
  choice: நீங்கள் வழிவிலகி
  rationale: סור உடன்படிக்கையின் சரியான வழி அல்லது பற்றுறுதியிலிருந்து விலகுவதைக் குறிக்கிறது; ‘வழிவிலகி’ அந்த உருவகத்தையும் தொடர்ச்சியையும் காக்கிறது.
- source_word: וַעֲבַדְתֶּם
  choice: சேவை செய்து
  rationale: עבד பிற தெய்வங்களுடன் வரும்போது மதப்பற்றுடன் சேவிப்பதைக் குறிக்கிறது. அடுத்த வினை வெளிப்படையான வணக்கச் செயலைக் குறிப்பதால் இரண்டையும் ஒன்றாக்காமல் ‘சேவை செய்து’ என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: אֱלֹהִים אֲחֵרִים
  choice: வேறு தெய்வங்கள்
  rationale: எபிரெயச் சொற்றொடரின் நேரான பொருள் ‘வேறு தெய்வங்கள்’; ‘அந்நிய தெய்வங்கள்’ என்பது இங்கு தேவையற்ற விளக்கத்தைச் சேர்க்கலாம்.
- source_word: וְהִשְׁתַּחֲוִיתֶם לָהֶם
  choice: அவற்றைப் பணிந்துகொண்டு
  rationale: השתחוה தரையில் குனிந்து அல்லது பணிந்து வணங்கும் உடல் செயலைக் குறிக்கிறது. ‘பணிந்துகொண்டு’ அந்தத் தெளிவான செயலைப் பாதுகாக்கிறது; மதவழிபாட்டு பொருள் சூழலால் தெளிவாகிறது.
theological_decisions:
- issue: விசுவாச விலகலைப் பற்றிய எச்சரிக்கையின் இயல்பு
  choice: உள்ளத்தின் ஏமாற்றத்திலிருந்து வழிவிலகுதல், வேறு தெய்வங்களுக்குச் சேவை செய்தல், அவற்றைப் பணிந்துகொள்ளுதல் என நகரும் தொடர்ச்சி பாதுகாக்கப்பட்டது.
  alternative: இதை முழுவதுமாக ‘சிலை வழிபாட்டுக்குக் கவரப்படுதல்’ என்ற ஒரே விளக்கச் சொற்றொடராகக் கூறலாம்.
  rationale: எபிரெய உரை அகநிலைச் சிதைவிலிருந்து வெளிப்படையான வழிபாட்டுச் செயலுக்கு நகரும் படிநிலைகளைத் தனித்தனியாகக் காட்டுகிறது. மொழிபெயர்ப்பு அவற்றை ஒன்றாகச் சுருக்காமலும் பிற்காலக் கோட்பாட்டுச் சொற்களைச் சேர்க்காமலும் வைத்திருக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில் இயல்பான, கண்ணியமான எச்சரிக்கை நடை பயன்படுத்தப்பட்டுள்ளது. பன்மை இரண்டாம் நபர் வடிவங்கள் காக்கப்பட்டுள்ளன. ‘சேவை செய்தல்’ மற்றும் ‘பணிந்துகொள்ளுதல்’ என்ற இரு செயல்களும் மூலத்தின் தொடர்ச்சிக்கேற்ப வேறுபடுத்தப்பட்டுள்ளன.
