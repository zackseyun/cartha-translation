  yaml_path: translation/ot/deuteronomy/011/020.yaml
  text: And you shall write them on the doorposts of your house and on your gates[a][b].
translation:
  language: ta
  text: அவற்றை உன் வீட்டின் கதவுநிலைக்கால்களின் மேல்[a], உன் வாசல்களின் மேல்[b] எழுத வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘கதவுச்சட்டங்களின் மேல்.’ எபிரெயச் சொல் கதவின் பக்கங்களில் உள்ள செங்குத்தான பகுதிகளைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘உன் வாசல்களில்.’ எபிரெயச் சொல் வாசல்களையும் அவற்றைச் சுற்றிய நுழைவுப் பகுதிகளையும் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּכְתַבְתָּם
  choice: அவற்றை ... எழுத வேண்டும்
  rationale: இணைப்புடன் வரும் கால் வினைமுற்று, இந்தக் கட்டளைகளின் தொடரில் கடமை அல்லது கட்டளைப் பொருளைத் தருகிறது. மூன்றாம் நபர் ஆண்பால் பன்மை பின்னொட்டு முன்பு குறிப்பிடப்பட்ட வார்த்தைகளைக் குறிக்கும் என்பதால் ‘அவற்றை’ என மொழிபெயர்க்கப்பட்டது.
- source_word: עַל
  choice: -மேல்
  rationale: ஒரு மேற்பரப்பில் எழுதப்படுவதை நேரடியாகக் குறிக்கும் இயல்பான தமிழ் இடவேற்றுமை வடிவம்.
- source_word: מְזוּזוֹת
  choice: வாசல் நிலைக்கால்கள்
  rationale: இச்சொல் நுழைவாயிலின் பக்கங்களில் செங்குத்தாக இருக்கும் நிலைக்கால்களைக் குறிக்கிறது. பிற்கால யூத வழக்கைக் குறிக்கும் ஒலிபெயர்ப்பைத் தவிர்த்து, பொருளை நேரடியாகத் தெரிவிக்கும் சொற்றொடர் தேர்ந்தெடுக்கப்பட்டது.
- source_word: בֵּיתֶךָ
  choice: உன் வீட்டின்
  rationale: בַּיִת என்பதன் உறுதியான, நேரடியான பொருள் ‘வீடு’; எபிரெய மூலத்தின் ஒருமை இரண்டாம் நபர் வடிவமும் காக்கப்பட்டுள்ளது.
- source_word: וּבִשְׁעָרֶיךָ
  choice: உன் வாசல்களின்மேலும்
  rationale: שַׁעַר என்பது பொதுவாக வாசல் அல்லது நுழைவாயிலைச் சுட்டுகிறது. எபிரெயத்தில் உள்ள பன்மையும் மீண்டும் வரும் இடச்சுட்டும் தமிழில் வெளிப்படையாகக் காக்கப்பட்டுள்ளன.
theological_decisions: []
translation_notes:
  register: நவீன பொதுத்தமிழில் தெளிவாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘எழுத வேண்டும்’ என்பது தொடர்ச்சியான உடன்படிக்கைக் கட்டளையின் கடமைப் பொருளை இயல்பாக வெளிப்படுத்துகிறது; ஒருமை இரண்டாம் நபரான ‘உன்’ மூலத்துக்கு ஏற்ப காக்கப்பட்டுள்ளது.
