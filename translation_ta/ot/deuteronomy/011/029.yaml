base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/029.yaml
  text: And when Yahweh your God brings you into the land that you are entering to possess[a], you shall set the blessing on Mount Gerizim and the curse on Mount Ebal.
translation:
  language: ta
  text: உன் கடவுளாகிய யாவே, நீ உரிமையாக்கிக்கொள்ள நுழைகிற நாட்டிற்குள் உன்னைக் கொண்டுவரும்போது, ஆசீர்வாதத்தைக் கெரிசீம் மலையின்மேல் வைப்பாய்; சாபத்தை ஏபால் மலையின்மேல் வைப்பாய்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஆசீர்வாதத்தைக் கெரிசீம் மலையின்மேலும் சாபத்தை ஏபால் மலையின்மேலும் அறிவிப்பாய்.” எபிரேய மொழியில் சொல்லுக்குச் சொல் “வை/கொடு” என்று உள்ளது; சடங்கில் செய்யப்பட வேண்டிய துல்லியமான செயல் சுற்றியுள்ள பகுதியில் விளக்கப்படுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: கொண்டுவரும்போது
  rationale: எதிர்காலத்தில் நிகழவிருக்கும் சூழலை அறிமுகப்படுத்தும் எபிரெயச் சொற்றொடரின் காலப் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: יְבִיאֲךָ
  choice: உன்னைக் கொண்டுவரும்போது
  rationale: בוא என்பதன் ஹிஃபில் வடிவம் ‘உள்ளே கொண்டுவருதல்’ என்ற காரணவினைப் பொருளைக் கொண்டது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரான நான்கெழுத்துப் பெயரை ஒரு பட்டமாக மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: אֱלֹהֶיךָ
  choice: உன் கடவுளாகிய
  rationale: இரண்டாம் நபர் ஒருமை உரிமை விகுதியையும் உடன்படிக்கை உறவையும் நேரடியாகக் காட்டுகிறது.
- source_word: הָאָרֶץ
  choice: நாடு
  rationale: உபாகமத்தின் சூழலில் இஸ்ரவேல் உரிமையாக்கிக்கொள்ளவிருக்கும் வாக்குத்தத்த நாட்டைக் குறிக்கிறது; தமிழில் ‘நாடு’ இயல்பாக உள்ளது.
- source_word: אֲשֶׁר אַתָּה בָא שָׁמָּה
  choice: நீ ... நுழைகிற
  rationale: בָא என்ற பங்கேற்பு வடிவமும் திசையைக் குறிக்கும் שָׁמָּה என்பதும் அண்மையில் நிகழவிருக்கும் நுழைவைச் சுட்டுகின்றன.
- source_word: לְרִשְׁתָּהּ
  choice: உரிமையாக்கிக்கொள்ள
  rationale: ירשׁ இங்கு நாட்டைச் சுதந்தரித்துத் தன் உடைமையாக்கிக்கொள்ளும் பொருளைக் கொண்டுள்ளது; ‘கைப்பற்ற’ என்று மட்டும் கூறுவதைக் காட்டிலும் உடன்படிக்கைச் சூழலை இது காக்கிறது.
- source_word: וְנָתַתָּה
  choice: வைக்க வேண்டும்
  rationale: נתן என்பதன் அடிப்படைப் பொருளான ‘கொடு/வை’ என்பதைப் பாதுகாக்கிறது; சடங்கின் துல்லியமான செயல்முறையை மொழிபெயர்ப்பிலேயே தீர்மானிப்பதைத் தவிர்க்கிறது.
- source_word: הַבְּרָכָה
  choice: ஆசீர்வாதத்தை
  rationale: சூழலில் ஏற்கெனவே எடுத்துரைக்கப்பட்ட உடன்படிக்கையின் குறிப்பிட்ட ஆசீர்வாதத்தைக் குறிக்கும் வரையறுக்கப்பட்ட பெயர்ச்சொல்.
- source_word: עַל הַר גְּרִזִים
  choice: கெரிசீம் மலையின்மேல்
  rationale: மலை சார்ந்த இடத்தைக் குறிக்கும் עַל என்பதையும் இடப்பெயரையும் இயல்பான தமிழில் வழங்குகிறது.
- source_word: הַקְּלָלָה
  choice: சாபத்தை
  rationale: ஆசீர்வாதத்திற்கு இணையான எதிர்மறை உடன்படிக்கை விளைவைக் குறிக்கும் வரையறுக்கப்பட்ட பெயர்ச்சொல்.
- source_word: עַל הַר עֵיבָל
  choice: ஏபால் மலையின்மேல்
  rationale: முந்தைய மலைக்கான சொற்றொடருடன் உள்ள எபிரெய இணை அமைப்பைப் பாதுகாக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலத்தில் பட்டம் அல்லாமல் தனிப்பட்ட உடன்படிக்கைப் பெயரே நேரடியாக வருகிறது; ஆகவே அதனை ‘யாவே’ என்று ஒலிபெயர்ப்பது மூல வேறுபாட்டைப் பாதுகாக்கிறது.
- issue: ஆசீர்வாதத்தையும் சாபத்தையும் சார்ந்த உடன்படிக்கைச் செயல்
  choice: ஆசீர்வாதத்தை ... சாபத்தை ... வைக்க வேண்டும்
  alternative: ஆசீர்வாதத்தை ... சாபத்தை ... அறிவிக்க வேண்டும்
  rationale: எபிரெயில் נתן (‘கொடு/வை’) என்ற பரந்த பொருளுடைய வினை உள்ளது. ‘வைக்க’ என்பது அதன் உருவகத் தெளிவையும், சடங்கின் சரியான செயல் குறித்து உரையில் நிலவும் திறந்த தன்மையையும் காக்கிறது; ‘அறிவிக்க’ என்பது சூழலிலிருந்து பெறக்கூடிய விளக்கமாக அடிக்குறிப்பில் தரப்படுகிறது.
- issue: இரண்டாம் நபர் ஒருமையின் கூட்டு நோக்கம்
  choice: உன் / நீ / உன்னை
  alternative: உங்கள் / நீங்கள் / உங்களை
  rationale: எபிரெய இலக்கணத்தில் மோசே இஸ்ரவேல் மக்களை ஒரு கூட்டு ஒருமையாக இரண்டாம் நபர் ஆண்பால் ஒருமையில் அழைக்கிறார். தமிழிலும் ஒருமையை வைத்திருப்பது இந்த உரையாடல் வடிவத்தைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. எபிரெய மூலத்தின் இரண்டாம் நபர் ஒருமை வடிவம் கூட்டு இஸ்ரவேலை நோக்கினாலும், அந்த இலக்கணத் தன்மையைத் தெளிவாகப் பாதுகாக்க ‘நீ’ வடிவம் பயன்படுத்தப்பட்டுள்ளது. இடப்பெயர்கள் ‘கெரிசீம்’, ‘ஏபால்’ என்றும் தெய்வீகப் பெயர் ‘யாவே’ என்றும் ஒலிபெயர்க்கப்பட்டுள்ளன.
