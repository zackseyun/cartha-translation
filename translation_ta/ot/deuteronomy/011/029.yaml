  source_fidelity: மூலத்தின் காலச்சூழல், யாவே என்ற பெயர், நாட்டை உரிமையாக்கிக்கொள்ளும் நோக்கம், மேலும் ஆசீர்வாதம்/சாபம் இரு மலைகளோடு இணைக்கப்படுதல் ஆகியவை வரைவு மொழிபெயர்ப்பில் துல்லியமாக உள்ளன. ஆனால் וְנָתַתָּה என்ற இரண்டாம் நபர் ஒருமை எதிர்கால/கட்டளைத் தன்மையைத் தமிழில் வெளிப்படையாகக் காட்ட ‘வைப்பாய்’ என்பது ‘வைக்க வேண்டும்’ என்பதைக் காட்டிலும் நெருக்கமானது.
