source:
  edition: WLC
  text: וְ/שַׂמְתֶּם֙ אֶת דְּבָרַ֣/י אֵ֔לֶּה עַל לְבַבְ/כֶ֖ם וְ/עַֽל נַפְשְׁ/כֶ֑ם וּ/קְשַׁרְתֶּ֨ם אֹתָ֤/ם לְ/אוֹת֙ עַל יֶדְ/כֶ֔ם וְ/הָי֥וּ לְ/טוֹטָפֹ֖ת בֵּ֥ין עֵינֵי/כֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/018.yaml
  text: So you shall place these words of mine on your heart and on your soul[a], and you shall bind them as a sign on your hand, and they shall be as frontlets between your eyes.
translation:
  language: ta
  text: ஆகவே, என்னுடைய இந்த வார்த்தைகளை உங்கள் இதயத்தின்மேலும் உங்கள் உயிரின்மேலும் வைத்துக்கொள்ளுங்கள். அவற்றை உங்கள் கையின்மேல் ஓர் அடையாளமாகக் கட்டிக்கொள்ளுங்கள்; அவை உங்கள் கண்களுக்கு நடுவே நெற்றிப்பட்டங்களாக[a] இருக்கவேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தெபிலீன்”; பிற்கால யூத வழக்கத்தில் அணியப்பட்ட, வேதவசனத் துண்டுகள் வைக்கப்பட்ட சிறிய பெட்டிகள். இங்குள்ள எபிரெயச் சொல் அரிதானது; அதன் துல்லியமான பொருள் உறுதியற்றது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׂמְתֶּם
  choice: பதியவையுங்கள்
  rationale: שׂים என்பதன் அடிப்படைப் பொருள் ‘வை, பதியவை’ என்பதாகும். இதயத்திலும் உயிரிலும் வார்த்தைகளை வைப்பது என்ற எபிரெய உருவகத்தை இயல்பான நவீனத் தமிழில் ‘பதியவையுங்கள்’ தெளிவாக எடுத்துரைக்கிறது; வெறும் ‘நினைவில் கொள்ளுங்கள்’ என்று பொருளைச் சுருக்கவில்லை.
- source_word: דְּבָרַי אֵלֶּה
  choice: என்னுடைய இந்த வார்த்தைகளை
  rationale: முதலாம் நபர் ஒருமை உடைமைப் பின்னொட்டையும் ‘இந்த’ என்ற சுட்டையும் வெளிப்படையாகப் பாதுகாக்கிறது.
- source_word: עַל לְבַבְכֶם וְעַל נַפְשְׁכֶם
  choice: உங்கள் இதயத்திலும் உங்கள் உயிரிலும்
  rationale: לֵבָב என்பதற்கு ‘இதயம்’ என்றும், பரந்த பொருளுடைய נֶפֶשׁ என்பதற்கு இச்சூழலில் ‘உயிர்’ என்றும் மொழிபெயர்க்கப்பட்டுள்ளது. ‘உயிர்’ என்பது உயிர், தன்முழுமை, உள்ளார்ந்த நபர் ஆகிய நுணுக்கங்களைத் திறந்தவாறு வைக்கிறது; அதைத் திட்டவட்டமாக ‘ஆன்மா’ அல்லது ‘மனம்’ என்று குறுக்கவில்லை.
- source_word: וּקְשַׁרְתֶּם אֹתָם
  choice: அவற்றைக் கட்டிக்கொள்ளுங்கள்
  rationale: קשׁר என்பதன் ‘கட்டு, பிணை’ என்ற concrete பொருளைப் பாதுகாக்கிறது. தமிழ் வினையின் தற்சார்பு வடிவம் அணிந்துகொள்வதற்கான இயல்பான சொல்லாக்கத்தை வழங்குகிறது.
- source_word: לְאוֹת עַל יֶדְכֶם
  choice: உங்கள் கையின்மேல் ஓர் அடையாளமாக
  rationale: אוֹת என்பதன் ‘அடையாளம்’ என்ற பொருளையும் יָד என்பதன் வழக்கமான ‘கை’ என்ற பொருளையும் நேரடியாகப் பாதுகாக்கிறது.
- source_word: וְהָיוּ
  choice: இருக்கட்டும்
  rationale: அறிவுறுத்தல் தொடரில் வரும் வினையைத் தமிழில் இயல்பான கட்டளை/விருப்ப வடிவில் தொடர்கிறது.
- source_word: לְטוֹטָפֹת
  choice: நெற்றிப்பட்டங்களாக
  rationale: அரிதான טוֹטָפֹת என்பது கண்களுக்கு நடுவே அல்லது நெற்றியில் அணியப்படும் ஒன்றைக் குறிக்கிறது. ‘நெற்றிப்பட்டங்கள்’ அதன் concrete உருவத்தை வைத்துக்கொண்டு, பிற்கால யூதச் சடங்கு வடிவத்தை மூலவசனத்துக்குள் இறக்குமதி செய்யாமல் இருக்கிறது.
- source_word: בֵּין עֵינֵיכֶם
  choice: உங்கள் கண்களுக்கு நடுவே
  rationale: எபிரெயச் சொற்றொடரின் நேரடியான உடல்-இட உருவகத்தைப் பாதுகாக்கிறது; ‘நெற்றியில்’ என்று மட்டும் விளக்கிப் பொருளைக் குறுக்கவில்லை.
theological_decisions:
- issue: வார்த்தைகளைக் கையின்மேல் கட்டுவதும் கண்களுக்கு நடுவே வைத்திருப்பதும் சொற்படியான கட்டளையா அல்லது உருவக அறிவுறுத்தலா?
  choice: உடல் சார்ந்த concrete சொல்லாக்கத்தை அப்படியே வைத்திருந்து, அது சொற்படியானதா, உருவகமானதா, அல்லது இரண்டுமா என்பதைத் தீர்மானிக்காமல் விடுதல்
  alternative: இதைச் செயல்களிலும் சிந்தனையிலும் கட்டளைகளை எப்போதும் வைத்திருப்பதற்கான உருவகமாக மட்டும் மொழிபெயர்த்தல்; அல்லது பிற்கால மறைநூல் பெட்டிகளை அணியும் வழக்கமாக மட்டும் வெளிப்படுத்தல்
  rationale: எபிரெய உரை concrete படிமங்களை அளிக்கிறது; ஆனால் இவ்வசனம் மட்டும் அவற்றின் செயல்பாட்டை ஒரே விளக்கமாக முடிவுசெய்யவில்லை. ஆகவே மொழிபெயர்ப்பு அந்த இறையியல் மற்றும் நடைமுறைத் திறந்தநிலையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையும் வேதாகமத்துக்குரிய கண்ணியமும் கொண்ட எளிய நடையைப் பயன்படுத்துகிறது. ‘பதியவையுங்கள்’ இயல்பான தமிழுக்காகத் தேர்ந்தெடுக்கப்பட்டாலும் மூலத்தின் ‘வை’ என்ற உருவகத்தைத் தக்கவைக்கிறது. வசனத்தின் கூட்டுப்பன்மை அழைப்பு தமிழின் ‘உங்கள்’ மற்றும் பன்மைக் கட்டளை வடிவங்களால் வெளிப்படுத்தப்பட்டுள்ளது. அடிக்குறிப்பு குறியீடு தொடர்புடைய அரிய சொல்லான ‘நெற்றிப்பட்டங்கள்’ என்பதற்குப் பின்னரே வைக்கப்பட்டுள்ளது.
