source:
  edition: WLC
  text: וִֽ/ידַעְתֶּם֮ הַ/יּוֹם֒ כִּ֣י לֹ֣א אֶת בְּנֵי/כֶ֗ם אֲשֶׁ֤ר לֹֽא יָדְעוּ֙ וַ/אֲשֶׁ֣ר לֹא רָא֔וּ אֶת מוּסַ֖ר יְהוָ֣ה אֱלֹהֵי/כֶ֑ם אֶת גָּדְל֕/וֹ אֶת יָד/וֹ֙ הַ/חֲזָקָ֔ה וּ/זְרֹע֖/וֹ הַ/נְּטוּיָֽה׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/002.yaml
  text: And know today that that I am not speaking to your children, who have not known and who have not seen the discipline of Yahweh your God[a], his greatness, his strong hand[b], and his outstretched arm—
translation:
  language: ta
  text: 'இன்று அறிந்துகொள்ளுங்கள்: நான் பேசுவது உங்கள் பிள்ளைகளிடம் அல்ல[a]. அவர்களோ உங்கள் கடவுளாகிய யாவேயின் ஒழுக்கப் பயிற்சியையும், அவருடைய மேன்மையையும், அவருடைய வலிமையான கையையும்[b], அவருடைய நீட்டப்பட்ட புயத்தையும் அறியவும் இல்லை, காணவும் இல்லை—'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரேய வாக்கியம் விடுபட்ட அமைப்புடையது; சொல்லுக்குச் சொல், “ஏனெனில், அறியாதவர்களும் காணாதவர்களுமான உங்கள் பிள்ளைகள் அல்ல…” என்று உள்ளது. மோசே, யாவேயின் செயல்களைத் தாங்களே கண்டவர்களிடம் பேசுகிறார் என்பதே சூழலின் பொருள்.
    reason: alternative_reading
  - marker: b
    text: அல்லது, “வல்லமையுள்ள கையை.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וִידַעְתֶּם הַיּוֹם
  choice: இன்று இதை அறிந்துகொள்ளுங்கள்
  rationale: வினை வடிவத்தின் கவனத்தை ஈர்க்கும் அறிவுறுத்தல் வலிமையையும், הַיּוֹם என்பதன் உடனடித் தன்மையையும் இயல்பான நவீனத் தமிழில் காக்கிறது.
- source_word: כִּי לֹא אֶת־בְּנֵיכֶם
  choice: நான் பேசுவது உங்கள் பிள்ளைகளிடம் அல்ல
  rationale: எபிரேயத்தில் ஆளும் வினை விடுபட்டுள்ளது. சூழலில் மோசே நேரில் கண்ட தலைமுறையினரிடம் பேசுவதைத் தெளிவாக்க, குறைந்த அளவில் வினை நிரப்பப்பட்டுள்ளது.
- source_word: אֲשֶׁר לֹא יָדְעוּ וַאֲשֶׁר לֹא רָאוּ
  choice: அறியவும் இல்லை, காணவும் இல்லை
  rationale: அனுபவத்தின் மூலம் அறிதல் மற்றும் நேரில் காணுதல் ஆகிய இணையான எதிர்மறைக் கூறுகளைச் சுருக்கமாகவும் இயல்பாகவும் காக்கிறது.
- source_word: מוּסַר
  choice: ஒழுக்கப் பயிற்சி
  rationale: தண்டனை மட்டும் அல்லாமல், திருத்துதல், பயிற்றுவித்தல், உருவாக்குதல் ஆகிய பரந்த பொருளைத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: יְהוָה אֱלֹהֵיכֶם
  choice: உங்கள் கடவுளாகிய யாவே
  rationale: தெய்வீகப் பெயரைப் பட்டத்தால் மாற்றாமல் ஒலிபெயர்த்து, உடன்படிக்கைச் சார்ந்த ‘உங்கள் கடவுள்’ என்ற நேரடி அழைப்பையும் காக்கிறது.
- source_word: גָּדְלוֹ
  choice: அவருடைய மேன்மை
  rationale: யாவேயின் பெருமையும் வல்ல செயல்களில் வெளிப்படும் உயர்வும் குறிக்கப்படும் இடத்தில் இயல்பான தமிழ் பெயர்ச்சொல்.
- source_word: יָדוֹ הַחֲזָקָה
  choice: அவருடைய வலிமையான கை
  rationale: חזק என்பதன் அடிப்படைப் பொருளை நேரடியாகக் காத்து, தெய்வீக வல்லமையைக் குறிக்கும் எபிரேய உருவகத்தையும் தக்கவைக்கிறது.
- source_word: וּזְרֹעוֹ הַנְּטוּיָה
  choice: நீட்டப்பட்ட அவருடைய புயம்
  rationale: செயலில் வெளிப்படும் தெய்வீக வல்லமையைக் குறிக்கும் மூலமொழி உருவகத்தை கண்ணியமான வேதாகமத் தமிழில் காக்கிறது.
theological_decisions:
- issue: ‘உங்கள் பிள்ளைகள் அல்ல’ என்ற விடுபட்ட வாக்கிய அமைப்பு
  choice: ‘நான் பேசுவது உங்கள் பிள்ளைகளிடம் அல்ல’ என்று மறைந்துள்ள வினையை நிரப்புதல்
  alternative: ‘உங்கள் பிள்ளைகள் அல்ல’ என்று மட்டும் மொழிபெயர்த்தல்
  rationale: எபிரேய மூலத்தின் விடுபட்ட அமைப்பைத் தமிழில் அப்படியே வைத்தால் பொருள் தெளிவற்றதாகும். சூழல் சுட்டும் உரையாடல் எதிர்மறையை வெளிப்படையாக்குகிறது; பிள்ளைகள் முற்றிலும் அறியாதவர்கள் என்ற கோட்பாட்டுக் கூற்றாக இதை மாற்றுவதில்லை.
- issue: מוּסַר என்பதன் பரப்பு
  choice: ஒழுக்கப் பயிற்சி
  alternative: தண்டனை / போதனை / கண்டிப்பு
  rationale: இச்சொல் திருத்தும் தண்டனையையும் உருவாக்கும் போதனையையும் உள்ளடக்க முடியும். ‘ஒழுக்கப் பயிற்சி’ அந்தத் தத்துவார்த்த இழுவையை தேவையின்றி ஒரு பக்கமாகச் சுருக்காது.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகருக்குப் புரியும் கண்ணியமான நடை. வசனம் அடுத்த வசனத்தில் தொடர்வதால் இறுதியில் நீள்கோடு வைக்கப்பட்டுள்ளது. ‘யாவே’ என்ற தனிப்பெயரும் ‘கை/புயம்’ என்ற மூல உருவகங்களும் பாதுகாக்கப்பட்டுள்ளன.
