  source_fidelity: திருத்தம் தேவை. வரைவில் உள்ள ‘நீங்கள் கைப்பற்றப்போகும் நாடு’ என்பது אֲשֶׁר אַתֶּם עֹבְרִים שָׁמָּה לְרִשְׁתָּהּ என்ற தொடரில் வெளிப்படும் ‘அதை உரிமையாக்கிக்கொள்வதற்காக நீங்கள் கடந்து செல்லும்’ என்ற நோக்கத்தையும் கடத்தல் செயலும் தெளிவாகக் காட்டவில்லை. மேலும் ירשׁ வினை வசனத்தில் இருமுறை வருவதை மொழிபெயர்ப்பில் பாதுகாக்க வேண்டும்.
  naturalness: திருத்தப்பட்ட உரை நவீன நிலையான தமிழில் இயல்பாக உள்ளது. ‘நாட்டிற்குள் நுழைந்து’ என்பது בוא-வின் நிலநுழைவு உணர்வைத் தெளிவாகத் தருகிறது; ‘கடந்து செல்லும்’ என்பது சூழலால் குறிக்கப்படும் கடத்தலைச் செயற்கையாக விளக்காமல் வைத்திருக்கிறது.
  terminology: ‘கடைப்பிடியுங்கள்’ கட்டளை/உடன்படிக்கைச் சூழலுக்கு ஏற்றது. ירשׁ-க்கு இரு இடங்களிலும் ‘உரிமையாக்கிக்கொள்ள’ பயன்படுத்தப்பட்டுள்ளது; அடிக்குறிப்பில் ‘சுதந்தரித்துக்கொள்ள’ மற்றும் ‘கைப்பற்றிக்கொள்ள’ மாற்றுகளாகக் கொடுக்கப்படுகின்றன. ‘நாடு’ இச்சூழலில் ஏற்கத்தக்கது.
