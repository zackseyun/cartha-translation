base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/008.yaml
  text: So keep every commandment that I am commanding you today[c][b][a], so that you may be strong and go in and possess the land that you are crossing over to possess.
translation:
  language: ta
  text: ஆகவே, இன்று நான் உங்களுக்குக் கட்டளையிடும் எல்லாக் கட்டளைகளையும்[a] கடைப்பிடியுங்கள்; அப்போதுதான் நீங்கள் வலிமைபெற்று[b], நீங்கள் அதை உரிமையாக்கிக்கொள்வதற்காகக் கடந்து செல்லும் நாட்டிற்குள் நுழைந்து, அதை உரிமையாக்கிக்கொள்வீர்கள்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் நேரடியாக ‘முழுக் கட்டளை’ என்று ஒருமையில் உள்ளது; அது கட்டளைகளின் முழுத் தொகுதியைக் கூட்டாகக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: ‘வலிமையுள்ளவர்களாகி’ அல்லது ‘வலுப்படுத்தப்பட்டு’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: ‘சுதந்தரித்துக்கொள்வீர்கள்’ அல்லது ‘கைப்பற்றிக்கொள்வீர்கள்’ என்றும் மொழிபெயர்க்கலாம்; இதே எபிரெய வினை இவ்வசனத்தில் இருமுறை வருகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׁמַרְתֶּם
  choice: ஆகவே... கடைப்பிடியுங்கள்
  rationale: שׁמר என்பது உடன்படிக்கைச் சட்டச் சூழலில் கட்டளைகளைக் கவனமாகக் கைக்கொண்டு நடப்பதைக் குறிக்கிறது. முன்னுள்ள உரையோட்டத்துடனான முடிவுறு தொடர்பை וּ உணர்த்துவதால் ‘ஆகவே’ இயல்பானது.
- source_word: כָּל הַמִּצְוָה
  choice: எல்லாக் கட்டளைகளையும்
  rationale: எபிரெயத்தில் ‘முழுக் கட்டளை’ என ஒருமையில் இருந்தாலும், அது கட்டளைகளின் முழுத் தொகுதியைக் குறிக்கும் கூட்டுப்பொருள் ஒருமை. நவீன தமிழில் பன்மை இதைத் தெளிவாகத் தெரிவிக்கிறது.
- source_word: אֲשֶׁר אָנֹכִי מְצַוְּךָ הַיּוֹם
  choice: இன்று நான் உங்களுக்குக் கட்டளையிடும்
  rationale: நிகழ்காலப் பங்கேற்புச் சொல்லின் உயிரோட்டமான தற்போதைய வலிமையை ‘கட்டளையிடும்’ தக்கவைக்கிறது. ஒருமை பின்னொட்டு இஸ்ரவேலைக் கூட்டாக நோக்குகிறது; மரியாதை/கூட்டுப் பொருளுடைய ‘உங்களுக்கு’ தமிழில் இயல்பாக உள்ளது.
- source_word: לְמַעַן
  choice: அப்போது
  rationale: இங்கு கீழ்ப்படிதலின் நோக்கத்தையும் விளைவையும் இணைக்கிறது. இரண்டு தமிழ் வாக்கியங்களாக அமைத்தபோது ‘அப்போது’ அந்த நோக்கம்–விளைவு உறவை இயல்பாகக் காட்டுகிறது.
- source_word: תֶּחֶזְקוּ
  choice: வலிமைபெற்று
  rationale: חזק என்பதன் Qal வடிவம் வலிமையடைதல் அல்லது வலிமையுள்ளவர்களாதலைக் குறிக்கலாம். ‘வலிமைபெற்று’ செயப்படுவினையைத் தீர்மானிக்காமல் இவ்விரு நிழற்பொருள்களுக்கும் இடமளிக்கிறது.
- source_word: וּבָאתֶם
  choice: உள்ளே சென்று
  rationale: நாட்டை அணுகிக்கொண்டிருப்போரின் நோக்கிலிருந்து בוא இங்கு ‘உள்ளே செல்லுதல்/நுழைதல்’ என்று பொருள்படுகிறது.
- source_word: וִירִשְׁתֶּם ... לְרִשְׁתָּהּ
  choice: கைப்பற்றப்போகும் ... உரிமையாக்கிக்கொள்வீர்கள்
  rationale: ירשׁ என்பது சூழலின்படி சுதந்தரித்தல், கைப்பற்றுதல், உடைமையாக்குதல் ஆகியவற்றைக் குறிக்கலாம். ஒரே தமிழ்ச் சொல்லை இயந்திரமாக இருமுறை பயன்படுத்தாமல், எதிர்நோக்கப்படும் கைப்பற்றுதலையும் அதன் விளைவான உரிமையாக்குதலையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: הָאָרֶץ
  choice: நாடு
  rationale: இங்கு வாக்குறுதியளிக்கப்பட்ட புவிப்பரப்பைக் குறிக்கிறது. ‘நாடு’ பொதுவாசகருக்கு இயல்பானது; அரசியல் தேசிய அரசை அவசியமாக உணர்த்தவில்லை.
- source_word: אֲשֶׁר אַתֶּם עֹבְרִים שָׁמָּה
  choice: நீங்கள் கைப்பற்றப்போகும் நாட்டிற்குள்
  rationale: עֹבְרִים שָׁמָּה என்பதில் அந்த இடத்தை நோக்கிக் கடந்து செல்லும் திசை உள்ளது. தமிழில் ‘நாட்டிற்குள் சென்று’ என்பதே யோர்தானைக் கடந்து அங்கு நுழையும் கருத்தைச் சீராகத் தருகிறது; தனியாக ‘அங்கே’ சேர்ப்பது தேவையற்றதாக இருக்கும்.
theological_decisions:
- issue: உடன்படிக்கை உரையில் ஒருமை–பன்மை மாறுபடும் அழைப்பு
  choice: இஸ்ரவேல் மக்களை கூட்டாகக் குறிக்கும் இயல்பான தமிழ் பன்மை/மரியாதை வடிவமான ‘உங்கள்/நீங்கள்’ பயன்படுத்தப்பட்டது
  alternative: ஒருமை பின்னொட்டை ‘உனக்கு’ என்று வெளிப்படையாகக் காட்டி, பின்னர் ‘நீங்கள்’ என்று மாற்றுவது
  rationale: எபிரெய உரை இஸ்ரவேலை ஒரே உடன்படிக்கை மக்களாகவும் பல நபர்களாகவும் நோக்குவதால் வடிவங்கள் மாறுகின்றன. தமிழில் அந்த மாற்றத்தைச் சொற்சொல்லாகக் காட்டுவது ஒரே வசனத்தில் இயல்பற்ற குழப்பத்தை உருவாக்கும்; ‘நீங்கள்’ கூட்டுத்தன்மையைப் பாதுகாக்கிறது.
- issue: ירשׁ என்பதன் பொருள்—சுதந்தரித்தல் அல்லது கைப்பற்றி உரிமையாக்குதல்
  choice: முதலில் ‘கைப்பற்றப்போகும்’, பின்னர் ‘உரிமையாக்கிக்கொள்வீர்கள்’
  alternative: இரு இடங்களிலும் ‘சுதந்தரித்துக்கொள்வீர்கள்’ அல்லது ‘கைப்பற்றுவீர்கள்’
  rationale: வினைச்சொல்லில் வாக்குறுதிப்படி பெறுதல் மற்றும் செயல்முறையாக உடைமையாக்குதல் ஆகிய இரு நிழற்பொருள்களும் உள்ளன. மொழிபெயர்ப்பு ஒன்றை மட்டும் கோட்பாட்டு ரீதியில் திணிக்காமல் இரண்டுக்கும் இடமளிக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகருக்குப் புரியும் மரியாதையும் கண்ணியமும் கொண்ட நடை. நீண்ட எபிரெய வாக்கியம் தமிழின் இயல்புக்காக இரண்டு வாக்கியங்களாகப் பிரிக்கப்பட்டது. ‘கடைப்பிடியுங்கள்’, ‘வலிமைபெற்று’, ‘உரிமையாக்கிக்கொள்வீர்கள்’ ஆகியவை சட்ட/உடன்படிக்கைச் செறிவைத் தக்கவைத்தும் அளவுக்கு மீறிய சமயத் தொழில்மொழியைத் தவிர்த்தும் உள்ளன.
