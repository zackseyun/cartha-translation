  revised_text: ஆகவே, இன்று நான் உங்களுக்குக் கட்டளையிடும் எல்லாக் கட்டளைகளையும்[a] கடைப்பிடியுங்கள்; அப்போதுதான் நீங்கள் வலிமைபெற்று[b], நீங்கள் அதை உரிமையாக்கிக்கொள்வதற்காகக் கடந்து செல்லும் நாட்டிற்குள் நுழைந்து, அதை உரிமையாக்கிக்கொள்வீர்கள்[c].
