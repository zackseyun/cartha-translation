  to: ஆகவே, இன்று நான் உங்களுக்குக் கட்டளையிடும் எல்லாக் கட்டளைகளையும்[a] கடைப்பிடியுங்கள்; அப்போதுதான் நீங்கள் வலிமைபெற்று[b], நீங்கள் அதை உரிமையாக்கிக்கொள்வதற்காகக் கடந்து செல்லும் நாட்டிற்குள் நுழைந்து, அதை உரிமையாக்கிக்கொள்வீர்கள்[c].
  rationale: மூலத்தின் வாக்கிய அமைப்பைத் தக்கவைத்து, (1) கட்டளைகளைக் கடைப்பிடிப்பதன் நோக்கம், (2) வலிமைபெறுதல், (3) நாட்டிற்குள் நுழைதல், (4) அதை உரிமையாக்கிக்கொள்வதற்காக அந்நாட்டை நோக்கிக் கடந்து செல்லுதல், மற்றும் (5) நாட்டை உரிமையாக்கிக்கொள்ளுதல் ஆகிய கூறுகள் அனைத்தும் வெளிப்படுமாறு திருத்தப்பட்டது. தேவையற்ற வரலாற்று விவரமோ கோட்பாட்டுச் சாய்வோ சேர்க்கப்படவில்லை.
