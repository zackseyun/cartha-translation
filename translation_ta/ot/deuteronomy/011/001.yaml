- from: ஆகையால், உன் கடவுளாகிய யாவேவிடம் அன்புகூர்ந்து, அவர் காக்கும்படி ஒப்படைத்தவற்றையும்[a] அவருடைய சட்டதிட்டங்களையும், நீதித்தீர்ப்புகளையும்[b], கட்டளைகளையும் உன் வாழ்நாளெல்லாம் கடைப்பிடிப்பாயாக.
