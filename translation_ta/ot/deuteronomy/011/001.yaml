  text: וְ/אָ֣הַבְתָּ֔ אֵ֖ת יְהוָ֣ה אֱלֹהֶ֑י/ךָ וְ/שָׁמַרְתָּ֣ מִשְׁמַרְתּ֗/וֹ וְ/חֻקֹּתָ֧י/ו וּ/מִשְׁפָּטָ֛י/ו וּ/מִצְוֺתָ֖י/ו כָּל הַ/יָּמִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/001.yaml
  text: Therefore you shall love Yahweh your God and keep his charge[a], his statutes, his judgments[b], and his commandments all your days.
translation:
  language: ta
  text: ஆகையால், உன் கடவுளாகிய யாவேவை அன்புகூர்ந்து, அவர் ஒப்படைத்த பொறுப்பையும், அவருடைய விதிமுறைகளையும், நீதித்தீர்ப்புகளையும்,[b] கட்டளைகளையும் உன் வாழ்நாளெல்லாம் கடைப்பிடிப்பாயாக.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: “நீதித்தீர்ப்புகள்” என்பதற்கு மாற்றாக, “நியமங்கள்” அல்லது “சட்டவிதிகள்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אָהַבְתָּ
  choice: ஆகையால் ... அன்புகூர்ந்து
  rationale: אָהַב என்பது ‘அன்புகூர்’ என்று பொருள்படும். தொடக்க வாவ் இணைப்பை முந்தைய சூழலிலிருந்து வரும் முடிவுறுத்தலாக இயல்பான தமிழில் ‘ஆகையால்’ என வெளிப்படுத்துகிறது; ‘மேலும்/அப்போது’ என்ற எளிய இணைப்பும் சாத்தியம் என்பதால் அடிக்குறிப்பு தரப்பட்டுள்ளது.
- source_word: יְהוָה
  choice: யாவே
  rationale: நான்கு எழுத்துகளைக் கொண்ட இறைப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், எபிரெய தனிப்பெயரின் பரவலான தமிழ் ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: אֱלֹהֶיךָ
  choice: உன் கடவுளாகிய
  rationale: இரண்டாம் நபர் ஒருமை உடைமைப் பின்னொட்டைத் தெளிவாகக் காட்டி, யாவேவுக்கும் இஸ்ரவேலருக்கும் இடையிலான உடன்படிக்கை உறவைப் பாதுகாக்கிறது.
- source_word: וְ/שָׁמַרְתָּ
  choice: கடைப்பிடிப்பாயாக
  rationale: שׁמר என்பதன் ‘காத்தல்/கவனித்துக் கடைப்பிடித்தல்’ என்ற உடன்படிக்கைச் சட்டச் சூழலுக்குரிய கருத்தை இயல்பான தமிழில் தருகிறது.
- source_word: מִשְׁמַרְתּוֹ
  choice: அவர் காக்கும்படி ஒப்படைத்தவை
  rationale: מִשְׁמֶרֶת என்பது காக்க ஒப்படைக்கப்பட்ட பொறுப்பு, கடமை, அல்லது கடைப்பிடிக்க வேண்டியது எனப் பொருள்படும். ‘அவருடைய காவல்’ போன்ற தெளிவில்லாத சொற்றொடரைத் தவிர்த்து, பொருளை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: חֻקֹּתָיו
  choice: அவருடைய சட்டதிட்டங்கள்
  rationale: חֻקּוֹת என்பது நிலைநாட்டப்பட்ட சட்டங்கள் அல்லது விதிமுறைகள். அடுத்துள்ள பிற சட்டச் சொற்களிலிருந்து வேறுபாட்டைப் பேணுகிறது.
- source_word: וּמִשְׁפָּטָיו
  choice: நீதித்தீர்ப்புகள்
  rationale: מִשְׁפָּט என்பது தீர்ப்பு, நீதிநியமம், சட்டவிதி ஆகிய பொருட்களைக் கொள்ளும். ‘நீதித்தீர்ப்புகள்’ மூலச்சொல்லின் நீதிசார் கூறைப் பேணுகிறது; மாற்றாக ‘நியமங்கள்’ சாத்தியம்.
- source_word: וּמִצְוֺתָיו
  choice: கட்டளைகள்
  rationale: מִצְוָה என்பதற்குரிய வழக்கமான, தெளிவான தமிழ் சட்டச் சொல்.
- source_word: כָּל הַיָּמִים
  choice: உன் வாழ்நாளெல்லாம்
  rationale: சொல்லர்த்தமாக ‘எல்லா நாட்களும்.’ வசனம் முழுவதிலுமுள்ள இரண்டாம் நபர் ஒருமையை முன்னிட்டு, வாழ்நாள் முழுவதையும் குறிக்கும் இயல்பான தமிழ் வடிவம்.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலத்தில் தனிப்பெயர் நேரடியாக உள்ளது. பட்டப்பெயரால் மாற்றாமல் அதன் தனிப்பெயர் இயல்பைப் பேண ‘யாவே’ பயன்படுத்தப்பட்டுள்ளது; எந்தப் பிரிவுசார் கோட்பாட்டையும் இவ்வடிவம் சேர்ப்பதில்லை.
- issue: மִשְׁפָּטָיו என்ற சட்டச் சொல்லின் நுணுக்கம்
  choice: நீதித்தீர்ப்புகள்
  alternative: நியமங்கள் / சட்டவிதிகள்
  rationale: சட்டதிட்டங்கள், நீதித்தீர்ப்புகள், கட்டளைகள் என்ற மூலத்தின் இணையான ஆனால் வேறுபட்ட சட்டப் பிரிவுகளை ஒரே பொதுச்சொல்லாகச் சுருக்காமல் பேணுகிறது.
- issue: தொடக்க וְ இணைப்பின் உரையாடல் வலிமை
  choice: ஆகையால்
  alternative: மேலும் / அப்போது
  rationale: முந்தைய உரையின் முடிவும் நடைமுறைப் பயன்பாடுமாக இவ்வசனம் வருவதால் காரணவிளைவு நுணுக்கம் ஏற்கப்பட்டுள்ளது. எனினும், எபிரெய இணைப்பை எளிய ‘மற்றும்’ வகை இணைப்பாகவும் புரிந்துகொள்ள முடியும் என்பதை அடிக்குறிப்பு பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான தமிழ். ஒருமை ஆண்பால் முகவரியைத் தமிழ் இயல்புக்கு ஏற்ப ‘உன்’ எனத் தக்கவைத்துள்ளது. சட்டச் சொற்களுக்கிடையிலான வேறுபாடு பாதுகாக்கப்பட்டாலும், அரிதான அல்லது செயற்கையான சொற்கள் தவிர்க்கப்பட்டுள்ளன.
