  rationale: மִשְׁמַרְתּוֹவின் பொருளையும் ஒருமை எண்ணையும் தெளிவாகப் பேணுவதற்காக அந்தச் சொற்றொடர் திருத்தப்பட்டது. தொடக்க இணைப்புக்கான அடிக்குறிப்பு, மாற்று வாசகத்தை முழுமையான தமிழ்வாக்கியமாக வழங்குமாறு சரிசெய்யப்பட்டது. குறிப்பு a உரையில் இப்போது மேற்கோள் இருந்தாலும், உரையில் அதற்கான அடிக்குறிப்புக் குறி இல்லை; வழங்கப்பட்ட ஆங்கில audit trail-இல் உள்ளபடி, ‘ஆகையால்’ என்பதன் பின்னர் [a] குறியைச் சேர்க்க வேண்டும்.
