source:
  edition: WLC
  text: וְ/הַ/קְּלָלָ֗ה אִם לֹ֤א תִשְׁמְעוּ֙ אֶל מִצְוֺת֙ יְהוָ֣ה אֱלֹֽהֵי/כֶ֔ם וְ/סַרְתֶּ֣ם מִן הַ/דֶּ֔רֶךְ אֲשֶׁ֧ר אָנֹכִ֛י מְצַוֶּ֥ה אֶתְ/כֶ֖ם הַ/יּ֑וֹם לָ/לֶ֗כֶת אַחֲרֵ֛י אֱלֹהִ֥ים אֲחֵרִ֖ים אֲשֶׁ֥ר לֹֽא יְדַעְתֶּֽם־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/028.yaml
  text: and the curse[a], if you do not listen to the commandments of Yahweh your God, and turn aside from the way that I am commanding you today, to go after other gods that you have not known.
translation:
  language: ta
  text: சாபமோ, நீங்கள் உங்கள் கடவுளாகிய யாவேவின் கட்டளைகளுக்குச் செவிகொடுக்காமல்,[a] இன்று நான் உங்களுக்குக் கட்டளையிடும் வழியைவிட்டு விலகி, நீங்கள் அறிந்திராத வேறு தெய்வங்களைப் பின்பற்றினால்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உங்கள் கடவுளாகிய யாவேவின் கட்டளைகளுக்குக் கீழ்ப்படியாமல்.” உடன்படிக்கைச் சூழலில் “செவிகொடு” என்பதற்குக் கீழ்ப்படிதல் என்ற பொருளும் உண்டு.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַקְּלָלָה
  choice: சாபமும் வரும்
  rationale: முந்தைய வசனத்திலுள்ள ஆசீர்வாதத்துக்கு இணையான எதிர்மறைப் பகுதியைத் தமிழில் இயல்பான முழு வாக்கியமாக்குகிறது; எபிரெயின் இணைப்பும் குறிப்பிட்ட ‘சாபம்’ என்பதும் காக்கப்படுகின்றன.
- source_word: אִם לֹא
  choice: செவிகொடுக்காமல் ... சென்றால்
  rationale: எபிரெய நிபந்தனையைத் தமிழின் இயல்பான ‘-ஆல்’ நிபந்தனை அமைப்பில் தருகிறது.
- source_word: תִשְׁמְעוּ אֶל
  choice: செவிகொடுக்காமல்
  rationale: ‘கேட்பது’ மற்றும் அதற்குள் அடங்கிய கீழ்ப்படிதல் ஆகிய இரு நிழல்களையும் தாங்கக்கூடிய மரியாதையான தமிழ் சொல்; ‘கீழ்ப்படியாமல்’ எனப் பொருளை மட்டும் வெளிப்படையாக்கவில்லை.
- source_word: מִצְוֺת
  choice: கட்டளைகளுக்கு
  rationale: பன்மையையும் உடன்படிக்கைச் சூழலின் அதிகாரத் தொனியையும் காக்கிறது.
- source_word: יְהוָה אֱלֹהֵיכֶם
  choice: உங்கள் கடவுளாகிய யாவேவின்
  rationale: திருப்பெயரை ‘யாவே’ என நேரடியாகத் தருகிறது; உடைமைத் தொடர்பைத் தமிழில் இயல்பாக அமைக்கிறது.
- source_word: וְסַרְתֶּם מִן הַדֶּרֶךְ
  choice: வழியைவிட்டு விலகி
  rationale: பரிந்துரைக்கப்பட்ட பாதையிலிருந்து திரும்புதல் என்ற மூல உருவகத்தைத் தெளிவாகக் காக்கிறது.
- source_word: אֲשֶׁר אָנֹכִי מְצַוֶּה אֶתְכֶם הַיּוֹם
  choice: இன்று நான் உங்களுக்குக் கட்டளையிடும்
  rationale: மோசேயின் நிகழ்கால உரையின் உடனடித்தன்மையையும் ‘இன்று’ என்பதன் வலியுறுத்தலையும் காக்கிறது.
- source_word: לָלֶכֶת אַחֲרֵי
  choice: பின்பற்றிச் சென்றால்
  rationale: ‘பின்னால் செல்வது’ என்ற இயக்க உருவகத்தையும் விசுவாசச் சார்பை மாற்றும் கருத்தையும் இயல்பான தமிழில் இணைக்கிறது.
- source_word: אֱלֹהִים אֲחֵרִים
  choice: வேறு தெய்வங்களை
  rationale: மூலத்தின் பொதுவான உடன்படிக்கைச் சொற்றொடருக்கு நேரான, தெளிவான தமிழ் இணை.
- source_word: אֲשֶׁר לֹא יְדַעְתֶּם
  choice: நீங்கள் அறிந்திராத
  rationale: முன்பு உறவோ அனுபவ அறிவோ இல்லாத தெய்வங்கள் என்ற மூலத்தின் நிறைநிலைப் பொருளைச் சுருக்கமாகக் காக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூலத்தில் உள்ள உடன்படிக்கைத் திருப்பெயரைப் பொதுப்பட்டமாக மாற்றாமல் நேரடியாகப் பெயர்க்கிறது.
- issue: שׁמע என்பதில் கேட்பதா, கீழ்ப்படிவதா
  choice: செவிகொடுக்காமல்
  alternative: கீழ்ப்படியாமல்
  rationale: உடன்படிக்கைச் சூழலில் கீழ்ப்படிதல் உட்பொருளாக இருந்தாலும், மூலத்தின் ‘கேட்பது’ என்ற சொற்படிமத்தையும் பொருள் நெருக்கத்தையும் காக்கிறது.
- issue: וְהַקְּלָלָה என்பதிலுள்ள வினையற்ற அமைப்பு
  choice: சாபமும் வரும்
  alternative: சாபமோ
  rationale: முந்தைய வசனத்திலிருந்து புரிந்துகொள்ளப்படும் ‘உங்கள் முன் வைக்கிறேன்’ என்பதை மீண்டும் சேர்க்காமல், தமிழில் முழுமையான நிபந்தனை வாக்கியமாக்குகிறது; ‘வரும்’ என்பது சாபத்தின் விளைவை இயல்பாக வெளிப்படுத்தும் குறைந்தபட்ச நிறைவு.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. ‘வழியைவிட்டு விலகி’ மற்றும் ‘பின்பற்றிச் சென்று’ என்பவை மூலத்தின் இயக்க உருவகங்களைப் பாதுகாக்கின்றன. நிபந்தனைத் தொடரைத் தமிழுக்கேற்ற வகையில் மறுவரிசைப்படுத்தியுள்ளது.
