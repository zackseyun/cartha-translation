source:
  edition: WLC
  text: כִּ֣י הָ/אָ֗רֶץ אֲשֶׁ֨ר אַתָּ֤ה בָא שָׁ֨מָּ/ה֙ לְ/רִשְׁתָּ֔/הּ לֹ֣א כְ/אֶ֤רֶץ מִצְרַ֨יִם֙ הִ֔וא אֲשֶׁ֥ר יְצָאתֶ֖ם מִ/שָּׁ֑ם אֲשֶׁ֤ר תִּזְרַע֙ אֶֽת זַרְעֲ/ךָ֔ וְ/הִשְׁקִ֥יתָ בְ/רַגְלְ/ךָ֖ כְּ/גַ֥ן הַ/יָּרָֽק־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/010.yaml
  text: For the land that you are entering to possess is not like the land of Egypt[a], from which you came out, where you sowed your seed and watered it with your foot[b], like a vegetable garden.
translation:
  language: ta
  text: ஏனெனில், நீங்கள் உரிமையாக்கிக்கொள்வதற்காக நுழைகிற நாடு, நீங்கள் புறப்பட்டு வந்த எகிப்து நாட்டைப்[a] போன்றது அல்ல. அங்கே நீங்கள் உங்கள் விதையை விதைத்து, காய்கறித் தோட்டத்துக்கு நீர் பாய்ச்சுவதுபோல் உங்கள் காலால் நீர் பாய்ச்சினீர்கள்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “விதையை விதைத்து ... நீர் பாய்ச்சினீர்கள்” என்பது எகிப்தில் வழக்கமாகச் செய்யப்பட்ட பாசன முறையைக் குறிக்கலாம்; இதை “விதைத்து ... நீர் பாய்ச்சுவீர்கள்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “காலால்” என்பது காலால் இயக்கப்பட்ட பாசனக் கருவியையோ, காலால் சிறு வாய்க்கால்களைத் திறந்து மூடி நீரை வழிநடத்தியதையோ குறிக்கலாம்.
    reason: cultural_note
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய அறிவுறுத்தலுக்கான காரணவிளக்கத்தை அறிமுகப்படுத்துகிறது; தமிழில் உரையோட்டத்தைத் தெளிவாக இணைக்கிறது.
- source_word: הָאָרֶץ
  choice: நாடு
  rationale: இங்கு நிலப்பரப்பையும் மக்கள் குடியேறவிருக்கும் தேசத்தையும் குறிக்கிறது; நவீன தமிழில் ‘நாடு’ இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: בָא שָׁמָּה לְרִשְׁתָּהּ
  choice: கைப்பற்றுவதற்காக நுழைகிற
  rationale: בוא என்பதன் நுழைதல் இயக்கத்தையும் ירשׁ என்பதன் உரிமையாக்கிக் கைப்பற்றும் கருத்தையும் சுருக்கமாகத் தக்கவைக்கிறது.
- source_word: אֲשֶׁר יְצָאתֶם מִשָּׁם
  choice: நீங்கள் புறப்பட்டுவந்த
  rationale: எகிப்திலிருந்து வெளியே வந்த நிகழ்வைத் தெளிவாகக் கூறி, யாத்திராகமச் சொல்லோசையை ‘விட்டுவந்த’ என்று தட்டையாக்காமல் காக்கிறது.
- source_word: אֲשֶׁר תִּזְרַע אֶת זַרְעֲךָ
  choice: அங்கே நீங்கள் உங்கள் விதையை விதைத்து
  rationale: ‘விதை’ என்ற மூலப்படிமத்தைப் பாதுகாக்கிறது; எபிரெய வினைவடிவத்தின் வழக்கச் செயல் சார்ந்த சாத்தியம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: וְהִשְׁקִיתָ בְרַגְלְךָ
  choice: உங்கள் காலால் தண்ணீர் பாய்ச்சினீர்கள்
  rationale: ‘காலால்’ என்ற தெளிவான மூலப்படிமத்தை விளக்கமாக மாற்றாமல் தக்கவைக்கிறது; அதன் பாசனப் பின்னணி அடிக்குறிப்பில் விளக்கப்படுகிறது.
- source_word: כְּגַן הַיָּרָק
  choice: ஒரு காய்கறித் தோட்டத்திற்குத் தண்ணீர் பாய்ச்சுவதுபோல
  rationale: சிறிய, தீவிரமாக நீர்ப்பாய்ச்சப்படும் தோட்டத்தின் ஒப்புமையை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: உடன்படிக்கைச் சூழலில் யாத்திராகமச் சொல்லோசை
  choice: நீங்கள் புறப்பட்டுவந்த எகிப்து நாடு
  alternative: நீங்கள் விட்டுவந்த எகிப்து நாடு
  rationale: எகிப்திலிருந்து இஸ்ரவேல் வெளியே வந்த மீட்பு நிகழ்வின் சொல்லோசையைப் பாதுகாக்கிறது; அதேவேளையில் மூலத்தில் இல்லாத விளக்கத்தைச் சேர்ப்பதில்லை.
- issue: எபிரெய உரையில் ஒருமை–பன்மை மாறுபாடு
  choice: தமிழில் சமூகத்தைக் குறிக்கும் ‘நீங்கள்’ என்பதைத் தொடர்ச்சியாகப் பயன்படுத்துதல்
  alternative: ‘நீ’ மற்றும் ‘நீங்கள்’ என்று இலக்கண எண்ணை அப்படியே மாற்றுதல்
  rationale: எபிரெயத்தில் இஸ்ரவேல் ஒரே சமூகமாகவும் பலராகவும் மாறிமாறி அழைக்கப்படுகிறது. தமிழில் திடீர் எண்ண்மாற்றம் தனிநபர் மாறியதாகத் தவறாகப் புரியக்கூடும் என்பதால், பொருளை மாற்றாமல் இயல்பான பன்மைத் தொடர்பு பயன்படுத்தப்பட்டுள்ளது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, மரியாதைமிக்க உரைநடை பயன்படுத்தப்பட்டுள்ளது. வேளாண்மைப் படிமங்களான ‘விதை’, ‘காலால்’, ‘காய்கறித் தோட்டம்’ ஆகியவை விளக்கமாக மாற்றப்படாமல் பாதுகாக்கப்பட்டுள்ளன; தெளிவற்ற பாசன முறை அடிக்குறிப்பில் மட்டுமே விளக்கப்பட்டுள்ளது.
