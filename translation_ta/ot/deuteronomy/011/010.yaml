- from: ஏனெனில், நீங்கள் கைப்பற்றுவதற்காக நுழைகிற நாடு, நீங்கள் புறப்பட்டுவந்த எகிப்து நாட்டைப் போன்றது அல்ல. அங்கே[a] நீங்கள் உங்கள் விதையை விதைத்து, ஒரு காய்கறித் தோட்டத்திற்குத் தண்ணீர் பாய்ச்சுவதுபோல உங்கள் காலால்[b] தண்ணீர் பாய்ச்சினீர்கள்.
  to: ஏனெனில், நீங்கள் உரிமையாக்கிக்கொள்வதற்காக நுழைகிற நாடு, நீங்கள் புறப்பட்டு வந்த எகிப்து நாட்டைப்[a] போன்றது அல்ல. அங்கே நீங்கள் உங்கள் விதையை விதைத்து, காய்கறித் தோட்டத்துக்கு நீர் பாய்ச்சுவதுபோல் உங்கள் காலால் நீர் பாய்ச்சினீர்கள்[b].
  rationale: ஒப்புமை நீர்ப்பாசனச் செயலுடன் தெளிவாக இணையுமாறு வாக்கியம் மறுசீரமைக்கப்பட்டது. எபிரெய வினைவடிவத்தின் வழக்கச் செயல் சார்ந்த மாற்றுவாசிப்பு அடிக்குறிப்பில் தக்கவைக்கப்பட்டது; பாசன முறையின் தெளிவின்மையும் விளக்கக் குறிப்பில் மட்டும் விடப்பட்டுள்ளது. அடிக்குறிப்பு a அதன் பொருளுக்கு ஏற்ற இடத்துக்கு மாற்றப்பட்டது.
