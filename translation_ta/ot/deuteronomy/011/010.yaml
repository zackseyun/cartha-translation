  source_fidelity: 'மூலத்தின் முக்கியக் கருத்துகள் பாதுகாக்கப்பட்டுள்ளன: எகிப்துடன் வேறுபாடு, விதைத்தல், காலால் நீர் பாய்ச்சுதல், காய்கறித் தோட்ட ஒப்புமை ஆகியவை இடம்பெறுகின்றன. ஆயினும் தற்போதைய சொற்றொடரில் “ஒரு காய்கறித் தோட்டத்திற்குத் தண்ணீர் பாய்ச்சுவதுபோல” என்பது தேவையற்ற விதமாகத் தோட்டத்தையே நீர்ப்பாய்ச்சும் பொருளில் இணைகிறது; மூலத்தில் அது எகிப்தில் செய்யப்பட்ட நீர்ப்பாசனத்தின் ஒப்புமையாகும்.'
