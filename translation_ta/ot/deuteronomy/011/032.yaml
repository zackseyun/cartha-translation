  yaml_path: translation/ot/deuteronomy/011/032.yaml
  text: And you shall be careful to do all the statutes and the judgments that I am setting before you today[a].
translation:
  language: ta
  text: நான் இன்று உங்கள் முன் வைக்கிற எல்லா நியமங்களையும் நீதிமுறைகளையும் கவனமாகக் கடைப்பிடியுங்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இதை இன்னும் சொல்லுக்குச் சொல்லாக, “நான் இன்று உங்கள் முன் கொடுக்கிற” என்றும் மொழிபெயர்க்கலாம்; இங்குள்ள எபிரெய மரபுத்தொடரின் பொருள், “உங்கள் முன் வைக்கிற” என்பதாகும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/שְׁמַרְתֶּם לַ/עֲשׂוֹת
  choice: கவனமாகக் கடைப்பிடியுங்கள்
  rationale: שׁמר என்பதுடன் לַעֲשׂוֹת வருவதால், வெறுமனே ‘காத்துக்கொள்ளுதல்’ என்பதைக் காட்டிலும் கவனத்துடன் செயல்படுத்துதல் என்ற கட்டளைப் பொருள் வெளிப்படுகிறது.
- source_word: כָּל
  choice: எல்லா
  rationale: கோரிக்கையின் முழுமையை இயல்பான நவீன தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: הַֽ/חֻקִּים
  choice: நியமங்கள்
  rationale: חֻקִּים குறிக்கும் விதிக்கப்பட்ட சட்ட ஏற்பாடுகளை dignified, பொதுவாகப் புரியும் தமிழில் தெரிவிக்கிறது; மִשְׁפָּטִים என்பதிலிருந்து வேறுபாட்டையும் காக்கிறது.
- source_word: וְ/אֶת הַ/מִּשְׁפָּטִים
  choice: நீதிமுறைகளையும்
  rationale: சட்டத் தீர்ப்புகள் அல்லது நீதிசார் ஒழுங்குகள் என்ற பொருளைத் தருவதோடு, ‘நியமங்கள்’ என்பதுடன் முழுமையாக ஒன்றிணைந்து போகாமல் சொற்பொருள் வேறுபாட்டைக் காக்கிறது.
- source_word: אֲשֶׁר אָנֹכִי נֹתֵן לִ/פְנֵי/כֶם
  choice: நான் ... உங்கள் முன் வைக்கிற
  rationale: נֹתֵן என்பது சொற்பட ‘கொடுக்கிற’ என்றாலும், לִפְנֵיכֶם உடன் இங்கு ‘உங்கள் முன் வைக்கிற’ என்ற சட்ட முன்வைப்பு மரபுத்தொடரை இயல்பாகத் தருகிறது; எபிரெய நிகழ்காலப் பங்கேற்பு வடிவின் தொடர்நிலையையும் காக்கிறது.
- source_word: הַ/יּוֹם
  choice: இன்று
  rationale: உடன்படிக்கை உரையின் கால உடனடித்தன்மையை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
