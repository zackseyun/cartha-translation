  register: நவீன தரத் தமிழ்; பொதுவாசகர்களுக்குப் புரியும் வகையில் இயல்பாகவும், உடன்படிக்கைச் சட்ட உரைக்கு ஏற்ற கண்ணியமான கட்டளை நடையிலும் அமைக்கப்பட்டுள்ளது. ‘நியமங்கள் / நீதிமுறைகள்’ என்ற இணைச்சொற்கள் மூலத்தின் சட்டவகை வேறுபாட்டை இயன்றவரை காக்கின்றன.
