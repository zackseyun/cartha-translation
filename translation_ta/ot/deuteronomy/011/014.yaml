base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/014.yaml
  text: then I will give the rain for your land in its season[a], the early rain and the late rain, and you will gather in your grain, your new wine[c][b], and your oil.
translation:
  language: ta
  text: அப்போது நான் உரிய காலத்தில் உங்கள் நிலத்திற்கு மழையைத் தருவேன்—ஆரம்பப் பருவ மழையையும் இறுதிப் பருவ மழையையும்.[a] நீ[d] உன் தானியத்தையும் புதுத் திராட்சரசத்தையும்[b] எண்ணெயையும்[c] சேகரிப்பாய்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “முன்மழையையும் பின்மழையையும்.” இவை பொதுவாகப் பருவத்தின் தொடக்கத்திலும் முடிவிலும் பெய்யும் மழைகளைக் குறிக்கின்றன.
    reason: lexical_alternative
  - marker: b
    text: அதாவது, புதிதாக உற்பத்தி செய்யப்பட்ட திராட்சரசம்; அல்லது வெறுமனே “திராட்சரசம்.”
    reason: lexical_alternative
  - marker: c
    text: அதாவது, ஒலிவ எண்ணெய்.
    reason: cultural_note
  - marker: d
    text: எபிரெயத்தில் “உங்கள் நிலம்” என்பது பன்மையிலும், இங்கிருந்து வரும் “நீ, உன்” என்பவை ஒருமையிலும் உள்ளன.
    reason: source_form_note
lexical_decisions:
- source_word: וְנָתַתִּי
  choice: அப்போது நான் ... கொடுப்பேன்
  rationale: இணைப்புடன் வந்த நிறைவுவினை, முந்தைய வசனத்தின் நிபந்தனைக்கான விளைவாக எதிர்கால வாக்குறுதியைக் குறிக்கிறது; ‘அப்போது’ அந்தத் தொடரைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: מְטַר אַרְצְכֶם
  choice: உங்கள் நிலத்துக்கு ... மழை
  rationale: இங்கு אֶרֶץ என்பது நவீன அரசியல் நாட்டை அல்ல, வேளாண் வாழ்வுக்குரிய இஸ்ரவேலரின் நிலப்பரப்பைக் குறிக்கிறது.
- source_word: בְּעִתּוֹ
  choice: உரிய காலத்தில்
  rationale: மழை பெய்ய வேண்டிய பொருத்தமான, நியமிக்கப்பட்ட பருவகாலத்தைக் குறிக்கிறது.
- source_word: יוֹרֶה וּמַלְקוֹשׁ
  choice: ஆரம்பப் பருவ மழையும் இறுதிப் பருவ மழையும்
  rationale: விதைப்புக் காலத்தைத் தொடங்கும் மழையையும் அறுவடைக்கு முன் பெய்யும் கடைசி பருவ மழையையும் தெளிவான நவீன தமிழில் வேறுபடுத்துகிறது; பழமையான ‘முன்மாரி, பின்மாரி’ என்ற சொற்களைத் தவிர்க்கிறது.
- source_word: וְאָסַפְתָּ
  choice: சேகரித்துக்கொள்வாய்
  rationale: விளைபொருட்களை வயலிலிருந்து சேர்த்துக்கொள்ளும் வேளாண் செயலை வெளிப்படுத்துகிறது; எபிரெய வினையில் இல்லாத கூடுதல் தொழில்நுட்பத் துல்லியத்தைச் சேர்ப்பதில்லை.
- source_word: דְגָנֶךָ
  choice: உன் தானியம்
  rationale: பலவகைத் தானிய விளைச்சலையும் உள்ளடக்கும் பொதுவான, தெளிவான சமகாலத் தமிழ் சொல்.
- source_word: וְתִירֹשְׁךָ
  choice: உன் புதுத் திராட்சரசம்
  rationale: תִּירוֹשׁ பொதுவாகப் புதிதாக உற்பத்தி செய்யப்பட்ட திராட்சரசத்தைக் குறிக்கிறது; ‘புது’ என்பது வேளாண் மும்மையின் தனித்தன்மையைப் பாதுகாக்கிறது.
- source_word: וְיִצְהָרֶךָ
  choice: உன் எண்ணெய்
  rationale: தானியம்–திராட்சரசம்–எண்ணெய் என்ற வழக்கமான மும்மையில் இது ஒலிவ எண்ணெயைக் குறிக்கிறது; மூலத்தின் சுருக்கத்தை முதன்மை உரை காக்கிறது, குறிப்புரை பொருளைத் தெளிவுபடுத்துகிறது.
theological_decisions:
- issue: உடன்படிக்கைச் சூழலில் வேளாண் ஆசீர்வாத மொழி
  choice: காலத்திற்குரிய மழையையும் நிலத்தின் விளைபொருட்களையும் குறித்த நேரடியான வாக்குறுதியாக மொழிபெயர்த்தல்
  alternative: மழையை முதன்மையாக ஆவிக்குரிய, திருச்சடங்கு சார்ந்த, முடிவுக்கால அல்லது செழிப்பு உவமையாக விளக்குதல்
  rationale: எபிரெய உரை இஸ்ரவேலருக்கும் அவர்களுடைய நிலத்துக்கும் அளிக்கப்படும் உடன்படிக்கை சார்ந்த வேளாண் ஆசீர்வாதத்தை நேரடியாகக் கூறுகிறது; பின்னாளைய இறையியல் குறியீடுகளை முதன்மை உரைக்குள் சேர்க்கக் கூடாது.
- issue: இரண்டாம் நபர் எண்ணில் ஏற்படும் மாற்றம்
  choice: ‘உங்கள் நிலம்’ என்பதிலிருந்து ‘நீ உன்...’ என்ற ஒருமைக்கு மாறுவதைப் பாதுகாத்தல்
  alternative: வசனம் முழுவதையும் பன்மையாக ‘நீங்கள் உங்கள்...’ என்று ஒருமைப்படுத்துதல்
  rationale: மூல எபிரெயம் பன்மை உடைமையிலிருந்து ஒருமை அழைப்புக்கு மாறுகிறது. அது இஸ்ரவேலைக் கூட்டமாகவும் ஒரே உடன்படிக்கை மக்களாகவும் அணுகும் உரையின் பதற்றத்தைத் தக்கவைக்கிறது; தமிழில் ஏற்படும் எதிர்பாராத மாற்றத்தை குறிப்புரை விளக்குகிறது.
translation_notes:
  register: நடை நவீனத் தரத் தமிழாகவும், எளிதில் புரியும் கண்ணியமான மொழியாகவும் வைக்கப்பட்டுள்ளது. ‘முன்மாரி/பின்மாரி’ போன்ற பழமையான மரபுச் சொற்களுக்கு மாற்றாக ‘ஆரம்பப் பருவ மழை/இறுதிப் பருவ மழை’ பயன்படுத்தப்பட்டுள்ளன. மூலத்தில் உள்ள பன்மை–ஒருமை மாற்றம் குறிப்புரையுடன் பாதுகாக்கப்பட்டுள்ளது.
