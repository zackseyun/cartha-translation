  rationale: மூலத்தின் காரணவினை அமைப்பைத் துல்லியமாகவும் இயல்பான தமிழிலும் தெரிவிக்க ‘வெள்ளம்போல் மூடிவரச் செய்து’ என மாற்றப்பட்டது. மூலத்தைக் கடந்த கூடுதல் நிறைவு வலியுறுத்தலைத் தவிர்க்க ‘அழித்துப்போட்டதையும்’ என்பது ‘அழித்ததையும்’ எனத் திருத்தப்பட்டது. அடிக்குறிப்பு மொழிநடையும் இயல்பாக்கப்பட்டது; ‘செங்கடல்’/‘நாணல் கடல்’ என்ற மொழிபெயர்ப்பு மாற்று பாதுகாக்கப்பட்டுள்ளது.
