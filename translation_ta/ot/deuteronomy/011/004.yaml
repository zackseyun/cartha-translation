  text: וַ/אֲשֶׁ֣ר עָשָׂה֩ לְ/חֵ֨יל מִצְרַ֜יִם לְ/סוּסָ֣י/ו וּ/לְ/רִכְבּ֗/וֹ אֲשֶׁ֨ר הֵצִ֜יף אֶת מֵ֤י יַם סוּף֙ עַל פְּנֵי/הֶ֔ם בְּ/רָדְפָ֖/ם אַחֲרֵי/כֶ֑ם וַ/יְאַבְּדֵ֣/ם יְהוָ֔ה עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/004.yaml
  text: and what he did to the army of Egypt[a], to its horses and its chariots, when he made the waters of the Red Sea overflow over them as they pursued you, and Yahweh destroyed them to this day,
translation:
  language: ta
  text: எகிப்தின் படைக்கும், அதன் குதிரைகளுக்கும் தேர்களுக்கும் அவர் செய்ததையும்—அவர்கள் உங்களைத் துரத்திவந்தபோது, செங்கடலின்[a] நீரை அவர்கள்மேல் வெள்ளம்போல் மூடிவரச் செய்து, யாவே அவர்களை இந்நாள்வரை அழித்ததையும்—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரெய மொழியில்: ‘நாணல் கடல்.’ பாரம்பரியமாக ‘செங்கடல்’ என்று மொழிபெயர்க்கப்படுகிறது.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חֵיל
  choice: படை
  rationale: குதிரைகளும் தேர்களும் குறிப்பிடப்படும் இந்த இராணுவச் சூழலில், இச்சொல் செல்வத்தையோ பொதுவான வலிமையையோ அல்ல, எகிப்தின் படையையே குறிக்கிறது.
- source_word: לְסוּסָיו וּלְרִכְבּוֹ
  choice: அதன் குதிரைகளுக்கும் தேர்களுக்கும்
  rationale: ஒருமை விகுதிகள் எகிப்தை ஒரு கூட்டு தேசிய அமைப்பாகச் சுட்டுகின்றன. ‘தேர்கள்’ என்பது இயல்பான நவீனத் தமிழ்; படைத்தேர் அணியையும் உள்ளடக்கக்கூடும்.
- source_word: הֵצִיף
  choice: பெருக்கெடுத்து ஓடச் செய்து
  rationale: ஹிஃபில் வடிவத்தின் காரணவினைப் பொருளைப் பாதுகாத்து, நீர் அவர்கள்மேல் பெருக்கெடுத்து வந்ததை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: מֵי יַם סוּף
  choice: செங்கடலின் நீர்
  rationale: ‘செங்கடல்’ என்பது தமிழில் நிலைபெற்ற பாரம்பரியப் புவியியல் பெயர். எபிரெயச் சொல்லின் நேரடியான ‘நாணற்கடல்’ சாத்தியம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: עַל־פְּנֵיהֶם
  choice: அவர்கள்மேல்
  rationale: சொல்லுக்குச் சொல் ‘அவர்களுடைய முகங்கள்மேல்’ என்பதற்குப் பதிலாக, நீர் அவர்களை மூடியதைக் குறிக்கும் எபிரெய மரபுத்தொடரின் இயல்பான தமிழாக்கம்.
- source_word: בְּרָדְפָם אַחֲרֵיכֶם
  choice: அவர்கள் உங்களைத் துரத்திவந்தபோது
  rationale: בְּ உடனான வினையெச்ச அமைப்பு ஒரே நேரத்தில் நடந்த செயலைக் குறிக்கிறது; ‘துரத்திவந்தபோது’ அந்தக் காலத் தொடர்பை இயல்பாகத் தருகிறது.
- source_word: וַיְאַבְּדֵם
  choice: அவர்களை அழித்துப்போட்டதையும்
  rationale: காரணவினைச் சூழலில் אבד அவர்களை அழிவுக்குள்ளாக்கியதைக் குறிக்கிறது. ‘அழித்துப்போட்டார்’ முழுமையான அழிவின் வலிமையைத் தருகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தலைப்பால் மாற்றாமல், எபிரெய நான்கெழுத்துத் திருப்பெயரைத் தமிழில் ஒலிபெயர்த்து தனிப்பட்ட இறைப்பெயரைப் பாதுகாக்கிறது.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: இந்நாள்வரை
  rationale: பேசப்படும் காலம் வரையிலும் நிலைத்திருக்கும் விளைவைக் குறிக்கும் எபிரெய மரபுத்தொடருக்கு நெருக்கமான, இயல்பான தமிழாக்கம்.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: ஆண்டவர் / யெகோவா
  rationale: மூலத்தில் பட்டப்பெயர் அல்ல, தனிப்பட்ட இறைப்பெயரே உள்ளது. ஆகவே பட்டப்பெயரால் மாற்றாமலும் ‘Jehovah’ மரபுவடிவத்தைப் பயன்படுத்தாமலும், YHWH-க்கு ஏற்ற ‘யாவே’ என்ற ஒலிபெயர்ப்பு பயன்படுத்தப்பட்டது.
- issue: יַם סוּף என்பதன் அடையாளம்
  choice: செங்கடல்
  alternative: நாணற்கடல்
  rationale: தமிழ் வாசகர்களுக்கு அறிமுகமான பாரம்பரியப் பெயர் முதன்மை உரையில் வைக்கப்பட்டுள்ளது; எபிரெய סוּף என்பதன் ‘நாணல்’ தொடர்பும் உண்மையான மொழிபெயர்ப்பு மாற்றாக அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
- issue: עַד הַיּוֹם הַזֶּה அழிவுடன் இணையும் விதம்
  choice: யாவே அவர்களை இந்நாள்வரை அழித்துப்போட்டதையும்
  alternative: யாவே அவர்களை அழித்துப்போட்டார்; அதன் விளைவு இந்நாள்வரை நீடிக்கிறது
  rationale: மாற்று வடிவம் எபிரெய மரபுத்தொடரின் கருத்தை விளக்கமாக்கினாலும், அது இலக்கணத் தொடர்பைத் திறனாய்வாகத் தீர்த்துவிடும். முதன்மை உரை மூலத்தின் சுருக்கத்தையும் நீடிக்கும் விளைவு குறித்த பதற்றத்தையும் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், ஆனால் வேதாகம உரைக்கு ஏற்ற கண்ணியமான நடையில் அமைக்கப்பட்டது. இது முந்தைய வசனத்திலிருந்து தொடரும் பட்டியலின் ஒரு கூறாக இருப்பதால், ‘செய்ததையும்’ என்ற தொடரமைப்பும் இறுதி நீள்கோடும் பாதுகாக்கப்பட்டுள்ளன.
