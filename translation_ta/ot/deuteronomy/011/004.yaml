  source_fidelity: மூலத்தின் படைச் சூழல், எகிப்தைக் குறிக்கும் உடைமைச் சுட்டு, துரத்தலின் சமகால நிகழ்வு, யாவே என்ற இறைப்பெயர், மற்றும் ‘இந்நாள்வரை’ என்ற நீடித்த விளைவு ஆகியவை சரியாகப் பாதுகாக்கப்பட்டுள்ளன. ஆனால் הֵצִיף என்பதற்கு ‘பெருக்கெடுத்து ஓடச் செய்து’ என்பதைக் காட்டிலும், நீர் அவர்கள்மேல் வெள்ளம்போல் மூடிவந்த காரணவினைப் பொருளை நேரடியாகக் காட்டும் சொற்றொடர் பொருத்தமானது. ‘அழித்துப்போட்டது’ மூல வினையைவிடக் கூடுதல் பேச்சுவழக்கான வலியுறுத்தலைச் சேர்க்கிறது.
