  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. இது முந்தைய வசனத்தின் வாக்கியத்தைத் தொடரும் துணைப்பகுதி என்பதால் ‘ஆசீர்வாதத்தை’ என்ற செயப்படுபொருள் வடிவமும் இடைக்கோடும் வைக்கப்பட்டுள்ளன; மூலத்தின் நிபந்தனை அமைப்பும் இறைப் பெயரும் வெளிப்படையாகக் காக்கப்பட்டுள்ளன.
