  text: the blessing[a], if you listen to the commandments of Yahweh your God[b], which I am commanding you today.
translation:
  language: ta
  text: ஆசீர்வாதத்தை[a]—இன்று நான் உங்களுக்குக் கட்டளையிடுகிற உங்கள் கடவுளாகிய யாவேயின் கட்டளைகளுக்குச் செவிகொடுத்தால்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘உங்கள் கடவுளாகிய யாவேயின் கட்டளைகளுக்குக் கீழ்ப்படியும்போது கிடைக்கும் ஆசீர்வாதத்தை.’ எபிரெயத்தில் உள்ள தொடர்புச் சொல் இங்கு நிபந்தனைப் பொருளில் வருகிறது.
    reason: lexical_alternative
  - marker: b
    text: ‘செவிகொடு’ என்பதை ‘கீழ்ப்படி’ என்றும் மொழிபெயர்க்கலாம்; எபிரெய வினைச்சொல் பல இடங்களில் கேட்டதற்கு ஏற்ற கீழ்ப்படிதலையும் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶת הַבְּרָכָה
  choice: ஆசீர்வாதத்தை
  rationale: אֶת குறிக்கும் நேரடி செயப்படுபொருள் அமைப்பையும், முந்தைய வசனத்தில் தொடங்கிய ‘ஆசீர்வாதத்தையும் சாபத்தையும் உங்கள் முன் வைக்கிறேன்’ என்ற வாக்கியத் தொடர்ச்சியையும் தமிழின் வேற்றுமை உருபுடன் காக்கிறது.
- source_word: אֲשֶׁר
  choice: செவிகொடுத்தால் என்ற நிபந்தனை அமைப்பு
  rationale: இது வடிவில் தொடர்புச் சொல்லாக இருந்தாலும், இச்சூழலில் ஆசீர்வாதத்துக்கான நிபந்தனையை அறிமுகப்படுத்துகிறது; தமிழில் ‘-ஆல்’ அமைப்பு அந்த நிபந்தனைப் பொருளை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: תִּשְׁמְעוּ אֶל
  choice: செவிகொடுத்தால்
  rationale: שׁמע உடன் אֶל வரும்போது கவனமாகக் கேட்டு அதற்கேற்ப நடப்பது உட்பொருளாக இருக்கலாம். ‘செவிகொடு’ கேட்பது என்ற அடிப்படைப் பொருளையும் கீழ்ப்படிதலின் சாயலையும் ஒருங்கே காக்கிறது.
- source_word: מִצְוֺת
  choice: கட்டளைகளுக்கு
  rationale: உடன்படிக்கை மற்றும் சட்டச் சூழலில் מִצְוֹת என்பதன் அதிகாரபூர்வமான பொருளை ‘கட்டளைகள்’ தெளிவாகத் தருகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய தனிப்பெயரான நான்கெழுத்துத் திருப்பெயரை ஒரு பட்டத்தால் மாற்றாமல், அதன் வழக்கமான தமிழ் ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: אֱלֹהֵיכֶם
  choice: உங்கள் கடவுள்
  rationale: இரண்டாம் நபர் பன்மை உடைமை விகுதியை நேரடியாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: אֲשֶׁר אָנֹכִי מְצַוֶּה אֶתְכֶם הַיּוֹם
  choice: இன்று நான் உங்களுக்குக் கட்டளையிடுகிற
  rationale: מְצַוֶּה என்ற பங்கேற்புச் சொல்லின் நிகழ்காலத் தொடர்ச்சியையும், மோசே அன்றே வழங்கும் கட்டளையின் உடனடித் தன்மையையும் காக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: ஆண்டவர்; யெகோவா
  rationale: மூல உரை ஒரு பொதுப் பட்டத்தை அல்ல, உடன்படிக்கையின் தனிப்பெயரைப் பயன்படுத்துகிறது. ‘யாவே’ அந்தப் பெயரைப் பெயராகவே காக்கும் பரவலான ஒலிபெயர்ப்பு.
- issue: கேட்பதற்கும் கீழ்ப்படிவதற்கும் இடையிலான பொருள் உறவு
  choice: செவிகொடுத்தால்
  alternative: கீழ்ப்படிந்தால்
  rationale: שׁמע என்பதன் கேட்கும் அடிப்படைப் பொருளையும், உடன்படிக்கைச் சூழலில் உள்ள கீழ்ப்படிதல் உட்பொருளையும் முழுமையாக ஒன்றாகச் சுருக்காமல் காக்கிறது.
