source:
  edition: WLC
  text: וְ/חָרָ֨ה אַף יְהוָ֜ה בָּ/כֶ֗ם וְ/עָצַ֤ר אֶת הַ/שָּׁמַ֨יִם֙ וְ/לֹֽא יִהְיֶ֣ה מָטָ֔ר וְ/הָ֣/אֲדָמָ֔ה לֹ֥א תִתֵּ֖ן אֶת יְבוּלָ֑/הּ וַ/אֲבַדְתֶּ֣ם מְהֵרָ֗ה מֵ/עַל֙ הָ/אָ֣רֶץ הַ/טֹּבָ֔ה אֲשֶׁ֥ר יְהוָ֖ה נֹתֵ֥ן לָ/כֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/017.yaml
  text: Then Yahweh’s anger will burn against you[a], and he will shut up the heavens so that there will be no rain, and the ground will not yield its produce; and you will perish quickly from the good land that Yahweh is giving you.
translation:
  language: ta
  text: அப்போது யாவே உங்கள்மேல் கடுங்கோபம் கொள்வார்[a]; அவர் வானத்தை அடைத்துவிடுவார். அதனால் மழை பெய்யாது; நிலமும் தன் விளைச்சலைத் தராது. யாவே உங்களுக்குக் கொடுக்கிற அந்த நல்ல நாட்டிலிருந்து நீங்கள் விரைவில் அழிந்துபோவீர்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மொழியில், “யாவேயின் மூக்கு உங்கள்மேல் எரியும்” என்பது சொற்படி வடிவம்; இது அவரது கடுங்கோபத்தைக் குறிக்கும் மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְחָרָה אַף יְהוָה בָכֶם
  choice: அப்போது யாவே உங்கள்மேல் கடுங்கோபம் கொள்வார்
  rationale: חָרָה אַף என்பது கோபம் மூள்வதைச் சுட்டும் எபிரெய மரபுத்தொடர். தமிழில் இயல்பாகவும் அதன் தீவிரத்தைத் தக்கவைக்கவும் ‘கடுங்கோபம் கொள்வார்’ என்று மொழிபெயர்க்கப்பட்டது; ‘அப்போது’ முந்தைய எச்சரிக்கையின் விளைவை உணர்த்துகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இது இஸ்ரவேலின் இறைவனுடைய தனிப்பெயரான நான்கெழுத்துத் திருப்பெயர்; பட்டப்பெயரால் மாற்றாமல் தமிழில் பரவலாக அறியப்படும் ஒலிபெயர்ப்பாக ‘யாவே’ பயன்படுத்தப்பட்டது.
- source_word: וְעָצַר אֶת הַשָּׁמַיִם
  choice: அவர் வானத்தை அடைத்துவிடுவார்
  rationale: עצר இங்கு மழையைத் தடுக்க வானத்தை அடைக்கும் உருவகத்தைக் கொண்டுள்ளது. ஒருமை ‘வானம்’ நவீனத் தமிழில் இயல்பானது; உருவகம் பாதுகாக்கப்பட்டுள்ளது.
- source_word: וְלֹא יִהְיֶה מָטָר
  choice: அதனால் மழை பெய்யாது
  rationale: எபிரெய உரையில் ‘மழை இருக்காது’ என்றாலும், தமிழில் ‘மழை பெய்யாது’ இயல்பானது. ‘அதனால்’ வானம் அடைக்கப்படுவதன் விளைவைத் தெளிவாக்குகிறது.
- source_word: וְהָאֲדָמָה
  choice: நிலம்
  rationale: אֲדָמָה இங்கு பயிரிடப்படும் மண்ணையோ நிலத்தையோ குறிக்கிறது. பின்னர் வரும் הָאָרֶץ என்பதற்கான ‘நாடு’ என்பதிலிருந்து வேறுபடுத்த ‘நிலம்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: לֹא תִתֵּן אֶת יְבוּלָהּ
  choice: தன் விளைச்சலைத் தராது
  rationale: יְבוּל என்பது நிலத்தின் விளைவு அல்லது விளைச்சல். ‘தன் விளைச்சலைத் தராது’ மூலத்தின் உடைமைத் தொடரையும் வேளாண்மைச் சூழலையும் இயல்பாகத் தருகிறது.
- source_word: וַאֲבַדְתֶּם מְהֵרָה
  choice: நீங்கள் விரைவில் அழிந்துபோவீர்கள்
  rationale: אבד இங்கு உடன்படிக்கைத் தீர்ப்பின்கீழ் மக்கள் அழிவதைக் குறிக்கிறது; அது மரணம், அகற்றப்படுதல் ஆகியவற்றில் ஒன்றாக மட்டும் வரையறுக்கப்படாதபடி ‘அழிந்துபோவீர்கள்’ என்ற பரந்த சொல் பயன்படுத்தப்பட்டது. מְהֵרָה ‘விரைவில்’ என வழங்கப்பட்டது.
- source_word: מֵעַל הָאָרֶץ הַטֹּבָה
  choice: அந்த நல்ல நாட்டிலிருந்து
  rationale: מֵעַל அகற்றப்படுதலின் கருத்தைத் தருகிறது. தமிழில் இயல்பற்ற ‘நாட்டின் மேலிருந்து’ என்பதற்குப் பதிலாக ‘நாட்டிலிருந்து’ பயன்படுத்தப்பட்டது. הָאָרֶץ இங்கு உடன்படிக்கையாக அளிக்கப்படும் நாட்டைக் குறிக்கிறது.
- source_word: אֲשֶׁר יְהוָה נֹתֵן לָכֶם
  choice: யாவே உங்களுக்குக் கொடுக்கிற
  rationale: நֹתֵן என்பது நிகழ்காலப் பங்கேற்புவினை; இஸ்ரவேல் பெறவிருக்கும் கொடையின் உடனடி நிகழ்வுணர்வைத் தக்கவைக்க ‘கொடுக்கிற’ என மொழிபெயர்க்கப்பட்டது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூல உரை தனிப்பெயரை நேரடியாகப் பயன்படுத்துகிறது. அதை ஒரு பட்டப்பெயரால் மாற்றாமல் ஒலிபெயர்ப்பது உடன்படிக்கைப் பெயரின் தன்மையைப் பாதுகாக்கிறது.
- issue: தெய்வீகக் கோபத்தைக் குறிக்கும் חָרָה אַף என்ற உடலுறுப்பு சார்ந்த மரபுத்தொடர்
  choice: கடுங்கோபம் கொள்வார்
  alternative: அவருடைய கோபம் எரியும் / அவருடைய மூக்கு எரியும்
  rationale: ‘மூக்கு எரிதல்’ என்ற சொற்படி வடிவம் தமிழில் பொருளை மறைக்கும். ‘கடுங்கோபம்’ தீவிரத்தைப் பாதுகாக்கிறது; ஆனால் கட்டுப்பாடற்ற உணர்ச்சி போன்ற விளக்கத்தை உரைக்குள் சேர்ப்பதில்லை. மூல உருவகம் அடிக்குறிப்பில் தரப்படுகிறது.
- issue: וַאֲבַדְתֶּם என்பதன் தீர்ப்புச் சார்ந்த பரப்பு
  choice: அழிந்துபோவீர்கள்
  alternative: கொல்லப்படுவீர்கள் / நாட்டைவிட்டு அகற்றப்படுவீர்கள்
  rationale: மூலம் அழிவை உறுதியாகச் சொன்னாலும் அதன் துல்லியமான செயல்முறையை இவ்வசனத்தில் மட்டும் வரையறுக்கவில்லை. ஆகவே மரணம் அல்லது நாடுகடத்தல் என்ற ஒன்றை மட்டும் திணிக்காமல் பரந்த மொழி காக்கப்பட்டது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான நடையைப் பயன்படுத்துகிறது. ‘நிலம்’ (אֲדָמָה) மற்றும் ‘நாடு’ (הָאָרֶץ) என்ற வேறுபாடு பாதுகாக்கப்பட்டுள்ளது. ஒருமை ‘வானம்’ தமிழுக்கு இயல்பாக இருந்தாலும், வானத்தை அடைக்கும் மூல உருவகம் தக்கவைக்கப்பட்டுள்ளது.
