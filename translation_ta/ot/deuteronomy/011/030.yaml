  source_fidelity: திருத்தம் தேவை. ‘சூரியன் மறையும் திசைக்குச் செல்லும் பாதைக்கு அப்பால்’ என்பது எபிரெயின் אַחֲרֵי (‘பின்னால்/அதற்கு அப்பால்’) என்பதையும், ‘சூரியன் மறையும் பாதை’ என்ற சொற்றொடரையும் ‘மேற்கு நோக்கிச் செல்லும் பாதை’ எனச் சற்று அதிகமாக விளக்குகிறது. மூலத்தின் இடவியல் உருவகத்தையும் அதன் சிறிய தெளிவின்மையையும் காக்க ‘சூரியன் மறையும் பாதைக்குப் பின்னால்’ பொருத்தமானது. மற்ற இடவியல் கூறுகள், பன்மை வினா, இனப்பெயர், மற்றும் மரவகை ஐயம் ஆகியவை மூலத்திற்கு உண்மையாக உள்ளன.
  naturalness: நடை நவீன தரமான தமிழாகவும் வாசிக்க இயல்பாகவும் உள்ளது. ‘பின்னால்’ என மாற்றுவது தமிழ் தொடரையும் மூலச் சொல்லமைப்பையும் மேம்படுத்துகிறது. ‘அவை ... இருக்கின்றன அல்லவா?’ என்பது முந்தைய வசனத்தின் இரு மலைகளைச் சுட்டும் வகையில் இயல்பானது.
  terminology: யோர்தான், அராபா, கில்கால், மோரே ஆகிய இடப்பெயர் ஒலிபெயர்ப்புகள் ஏற்றவை. ‘கருவாலி மரங்கள்’ என்பது ஓக் என்ற முதன்மைத் தெரிவைத் தருகிறது; டெரிபிந்த் என்ற மாற்று அடிக்குறிப்பில் முறையாகக் காக்கப்படுகிறது. அடிக்குறிப்பு அடையாளங்கள் a, b, c அவை சார்ந்த உரைப்பகுதிகளிலேயே உள்ளன.
