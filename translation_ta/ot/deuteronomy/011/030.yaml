translation_notes:
  register: நவீன, தரமான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. புவியியல் பெயர்கள் ஒலிபெயர்க்கப்பட்டுள்ளன. மூலத்தின் சொல்லமைப்பு தமிழில் கடினமாகாதவாறு திசைப்பொருள் தெளிவாக்கப்பட்டாலும், பார்வைநிலை மற்றும் மரவகை குறித்த உண்மையான ஐயங்கள் அடிக்குறிப்புகளில் பாதுகாக்கப்பட்டுள்ளன.
