base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/030.yaml
  text: Are they not beyond the Jordan[a], behind the way of the setting sun, in the land of the Canaanites who dwell in the Arabah, opposite Gilgal[c][b], beside the oaks of Moreh?
translation:
  language: ta
  text: அவை யோர்தானுக்கு அப்பால்[a], சூரியன் மறையும் பாதைக்குப் பின்னால்[b], அராபாவில் குடியிருக்கும் கானானியரின் நாட்டில், கில்காலுக்கு எதிரே, மோரேயின் கருவாலி மரங்களுக்கு அருகில்[c] இருக்கின்றன அல்லவா?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘யோர்தானின் மறுபுறத்தில்.’ இந்த எபிரெயப் புவியியல் மரபுத்தொடரின் துல்லியமான திசைப்பொருள் பேசுபவரின் பார்வைநிலையைப் பொறுத்தது.
    reason: lexical_alternative
  - marker: b
    text: சொல்லுக்குச் சொல், ‘சூரியன் உள்ளே செல்லும் பாதைக்குப் பின்னால்’; அதாவது, மேற்கு நோக்கி.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, ‘மோரேயின் டெரிபிந்த் மரங்களுக்கு அருகில்.’ எபிரெயச் சொல் கருவாலி அல்லது டெரிபிந்த் வகையைச் சேர்ந்த பெரிய மரங்களைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא הֵמָּה
  choice: அவை ... இருக்கின்றன அல்லவா?
  rationale: முந்தைய வசனத்தில் குறிப்பிடப்பட்ட இரு மலைகளைப் பன்மையில் சுட்டுகிறது; உறுதிப்படுத்தும் பதிலை எதிர்பார்க்கும் எபிரெய வினாவையும் இயல்பான தமிழில் காக்கிறது.
- source_word: בְּעֵבֶר הַיַּרְדֵּן
  choice: யோர்தானுக்கு அப்பால்
  rationale: பார்வைநிலையைப் பொறுத்து ‘அக்கரையில்’ அல்லது ‘மறுபுறத்தில்’ எனப் பொருள்படக்கூடிய புவியியல் மரபுத்தொடரின் இடஞ்சார்ந்த நெகிழ்வைக் காக்கிறது.
- source_word: אַחֲרֵי דֶּרֶךְ מְבוֹא הַשֶּׁמֶשׁ
  choice: சூரியன் மறையும் திசைக்குச் செல்லும் பாதைக்கு அப்பால்
  rationale: ‘சூரியன் உள்ளே செல்லுதல்’ என்ற எபிரெய உருவகத்தின் மேற்கு நோக்கிய திசைப்பொருளைத் தெளிவாக்குகிறது; அதேவேளையில் דֶּרֶךְ என்பதிலுள்ள ‘பாதை’யையும் விடாமல் காக்கிறது.
- source_word: בְּאֶרֶץ הַכְּנַעֲנִי
  choice: கானானியரின் நாட்டில்
  rationale: எபிரெயில் ஒருமை இனப்பெயராக இருந்தாலும் அது மக்களினத்தைத் தொகுப்பாகக் குறிக்கிறது; தமிழில் பன்மை இயல்பானது.
- source_word: הַיֹּשֵׁב בָּעֲרָבָה
  choice: அராபாவில் குடியிருக்கும்
  rationale: அராபா என்பது குறிப்பிட்ட புவியியல் பகுதி என்பதால் பொதுவான ‘சமவெளி’ என மாற்றாமல் ஒலிபெயர்க்கப்படுகிறது.
- source_word: מוּל הַגִּלְגָּל
  choice: கில்காலுக்கு எதிரே
  rationale: நேரடியான இடவுறவை இயல்பான நவீன தமிழில் தெரிவிக்கிறது; இடப்பெயர் ஒலிபெயர்க்கப்படுகிறது.
- source_word: אֵצֶל אֵלוֹנֵי מֹרֶה
  choice: மோரேயின் கருவாலி மரங்களுக்கு அருகில்
  rationale: אֵצֶל என்பதன் அண்மை பொருளையும், אֵלוֹן என்பதற்கான பரவலான ‘கருவாலி’ பொருளையும் தருகிறது; தாவரவியல் ஐயம் அடிக்குறிப்பில் காக்கப்படுகிறது.
