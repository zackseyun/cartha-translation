- from: அப்படிச் செய்தால், உங்கள் நாட்களும் உங்கள் மகன்களின் நாட்களும்[a], யாவே உங்கள் தந்தையருக்குக் கொடுப்பதாக அவர்களிடம் ஆணையிட்ட நிலத்தில், பூமியின்மேல் வானம் இருக்கும் நாட்களைப்போல்[b] பெருகும்.
