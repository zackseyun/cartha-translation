base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/021.yaml
  text: so that your days and the days of your sons may be multiplied on the land that Yahweh swore to your fathers to give them[b][a], as the days of the heavens above the earth.
translation:
  language: ta
  text: உங்கள் நாட்களும் உங்கள் மகன்களின் நாட்களும்[a], யாவே உங்கள் தந்தையருக்குக் கொடுப்பதாகச் சத்தியம் செய்த நிலத்தில், பூமியின்மேல் வானம் இருக்கும் நாட்களைப்போல்[b] பெருகும்படியாக.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உங்கள் பிள்ளைகளின் நாட்களும்.” எபிரேய மூலத்தில் “உங்கள் மகன்களின்” என்று உள்ளது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “பூமிக்கு மேல் வானம் இருக்கும் காலமெல்லாம்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַעַן
  choice: அப்படிச் செய்தால்
  rationale: முந்தைய கட்டளைகளைக் கடைப்பிடிப்பதன் நோக்கத்தையும் விளைவையும் இயல்பான தமிழில் இணைக்கிறது; எபிரேய நோக்கப் பொருளைத் தக்கவைக்கிறது.
- source_word: יִרְבּוּ יְמֵיכֶם
  choice: உங்கள் நாட்கள் ... பெருகும்
  rationale: ரבה என்ற வினையையும் ‘நாட்கள்’ என்ற எழுவாயையும் நேரடியாகப் பாதுகாக்கிறது; ‘நீண்டகாலம் வாழ்வீர்கள்’ என்று விளக்கிப் பரப்பவில்லை.
- source_word: וִימֵי בְנֵיכֶם
  choice: உங்கள் மகன்களின் நாட்களும்
  rationale: בנים என்பதன் வெளிப்படையான ஆண்பால் பன்மையை ‘மகன்கள்’ எனத் தருகிறது; சூழலில் இருக்கக்கூடிய விரிவான ‘பிள்ளைகள்’ என்ற பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: עַל הָאֲדָמָה
  choice: நிலத்தில்
  rationale: உபாகமச் சூழலில் வாக்குத்தத்த நிலத்தைக் குறிக்கும் הָאֲדָמָה என்பதற்கு இயல்பான தமிழ்ச் சொல்.
- source_word: אֲשֶׁר נִשְׁבַּע יְהוָה לַאֲבֹתֵיכֶם לָתֵת לָהֶם
  choice: யாவே உங்கள் தந்தையருக்குக் கொடுப்பதாக அவர்களிடம் ஆணையிட்ட
  rationale: கொடுக்கப்படும் நிலத்தையும், தந்தையரிடம் செய்யப்பட்ட தெய்வீக ஆணையையும் தெளிவாக இணைக்கிறது; לָהֶם என்பதையும் ‘அவர்களிடம்’ என்ற வடிவில் வெளிப்படுத்துகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: உடன்படிக்கைக்குரிய தெய்வீகப் பெயரைப் பட்டப்பெயராக மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: כִּימֵי הַשָּׁמַיִם עַל הָאָרֶץ
  choice: பூமியின்மேல் வானம் இருக்கும் நாட்களைப்போல்
  rationale: வானமும் பூமியும் பற்றிய எபிரேய உருவகத்தையும் ‘நாட்கள்’ என்ற சொல்லையும் தக்கவைக்கிறது; காலநீட்சி சார்ந்த இயல்பான மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: ஆண்டவர் / யெகோவா
  rationale: மூலத்தில் நான்கெழுத்துத் தெய்வீகப் பெயர் நேரடியாக உள்ளது; ஆகவே அதை ஒரு பட்டப்பெயரால் மாற்றாமல் ‘யாவே’ என ஒலிபெயர்க்கிறது.
- issue: בְנֵיכֶם என்பதிலுள்ள பாலினக் குறிப்பு
  choice: உங்கள் மகன்களின்
  alternative: உங்கள் பிள்ளைகளின்
  rationale: எபிரேயச் சொல் இலக்கணத்திலும் சொற்பொருளிலும் ‘மகன்கள்’ என உள்ளது. அது பிள்ளைகளைப் பொதுவாகக் குறிக்கக்கூடிய சாத்தியத்தை அடிக்குறிப்பு பாதுகாக்கிறது.
- issue: வானம்–பூமி சொற்றொடரின் காலநீட்சிப் பொருள்
  choice: பூமியின்மேல் வானம் இருக்கும் நாட்களைப்போல்
  alternative: பூமிக்கு மேல் வானம் இருக்கும் காலமெல்லாம்
  rationale: முதன்மை உரை எபிரேய உருவகத்தையும் அதன் சற்றே திறந்த அமைப்பையும் பாதுகாக்கிறது; நீடித்த காலத்தைக் குறிக்கும் மொழியியல் புரிதல் அடிக்குறிப்பில் வழங்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையைப் பயன்படுத்துகிறது. ‘நாட்கள் பெருகும்’ என்ற எபிரேய உருவகமும் வானம்–பூமி ஒப்புமையும் திட்டமிட்டு பாதுகாக்கப்பட்டுள்ளன; தேவையற்ற சமயப்பிரிவு சார்ந்த விளக்கங்கள் சேர்க்கப்படவில்லை.
