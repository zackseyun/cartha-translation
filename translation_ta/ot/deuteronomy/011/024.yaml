revisions:
- from: உங்கள் உள்ளங்கால் மிதிக்கும் இடமெல்லாம் உங்களுடையதாகும்; பாலைநிலத்திலிருந்தும் லெபனோனிலிருந்தும், நதியாகிய யூபிரத்தீஸ் நதியிலிருந்து மேற்குக் கடல்[a] வரையிலும் உங்கள் எல்லை இருக்கும்.
