  text: כָּל הַ/מָּק֗וֹם אֲשֶׁ֨ר תִּדְרֹ֧ךְ כַּֽף רַגְלְ/כֶ֛ם בּ֖/וֹ לָ/כֶ֣ם יִהְיֶ֑ה מִן הַ/מִּדְבָּ֨ר וְ/הַ/לְּבָנ֜וֹן מִן הַ/נָּהָ֣ר נְהַר פְּרָ֗ת וְ/עַד֙ הַ/יָּ֣ם הָֽ/אַחֲר֔וֹן יִהְיֶ֖ה גְּבֻלְ/כֶֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/024.yaml
  text: Every place where the sole of your foot treads will be yours; from the wilderness and Lebanon[a], from the River, the Euphrates River, as far as the western sea, will be your border.
translation:
  language: ta
  text: உங்கள் காலின் உள்ளங்கால் பதியும் ஒவ்வோர் இடமும் உங்களுடையதாகும்; பாலைநிலத்திலிருந்தும் லெபனோனிலிருந்தும், நதியாகிய யூபிரத்தீஸ் நதியிலிருந்து மேற்குக் கடல்[a] வரையிலும் உங்கள் எல்லை இருக்கும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பின்புறக் கடல்” அல்லது “கடைசிக் கடல்”; இது பொதுவாக மத்தியதரைக் கடலைக் குறிக்கும் என்று புரிந்துகொள்ளப்படுகிறது.
    reason: אַחֲרוֹן என்பதன் நேரடிப் பொருளையும், புவியியல் சூழலில் வரும் ‘மேற்குக் கடல்’ என்ற பொருளையும் வாசகருக்குக் காட்டுகிறது.
lexical_decisions:
- source_word: כָּל הַמָּקוֹם
  choice: இடமெல்லாம்
  rationale: ஒவ்வொரு இடத்தையும் உள்ளடக்கும் எபிரெய விநியோகப் பொருளை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: אֲשֶׁר תִּדְרֹךְ כַּף רַגְלְכֶם בּוֹ
  choice: உங்கள் உள்ளங்கால் மிதிக்கும்
  rationale: כַּף רֶגֶל என்பதன் ‘காலின் உள்ளங்கால்’ என்ற நேரடியான உருவகத்தையும், דרך என்பதன் ‘மிதித்தல்’ என்ற செயலையும் காக்கிறது.
- source_word: לָכֶם יִהְיֶה
  choice: உங்களுடையதாகும்
  rationale: உடைமையை வாக்குறுதியாகக் கூறும் சுருக்கமான, இயல்பான தமிழ் வடிவம்.
- source_word: מִן הַמִּדְבָּר
  choice: பாலைநிலத்திலிருந்து
  rationale: מִדְבָּר குறிக்கும் குடியிருப்பற்ற வறண்ட நிலப்பகுதியை நவீன தமிழில் தெளிவாகக் கூறுகிறது; ‘பாலைவனம்’ என்று மிகக் குறுகலாக வரையறுக்கவில்லை.
- source_word: וְהַלְּבָנוֹן
  choice: லெபனோனிலிருந்து
  rationale: புவியியல் எல்லைக் குறிப்பின் தொடக்கப் புள்ளிகளுள் ஒன்றாகப் பெயரைத் தெளிவுபடுத்துகிறது; எபிரெய இணைப்பின் பொருளை தமிழில் இயல்பாக்குகிறது.
- source_word: מִן הַנָּהָר נְהַר פְּרָת
  choice: நதியாகிய யூபிரத்தீஸ் நதியிலிருந்து
  rationale: ‘நதி’ என்ற பொதுப் பட்டத்தையும், அதை யூபிரத்தீஸ் என்று அடையாளப்படுத்தும் எபிரெய ஒட்டுநிலையையும் காக்கிறது.
- source_word: וְעַד הַיָּם הָאַחֲרוֹן
  choice: மேற்குக் கடல் வரையிலும்
  rationale: பண்டைய எபிரெய திசைநோக்கில் אַחֲרוֹן குறிக்கும் மேற்குப் பக்கக் கடலை தெளிவாகத் தருகிறது; சொற்பொருள் மாற்று அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: יִהְיֶה גְּבֻלְכֶם
  choice: உங்கள் எல்லை இருக்கும்
  rationale: גְּבוּל என்பதன் புவியியல் ‘எல்லை’ என்ற பொருளை நேரடியாகவும் இயல்பாகவும் தருகிறது.
theological_decisions:
- issue: நிலப்பரப்பைப் பற்றிய வாக்குறுதி மொழி
  choice: இஸ்ரவேலருக்குக் கூறப்படும் நில எல்லை வாக்குறுதியாக வசனத்தை நேரடியாக மொழிபெயர்த்தல்
  alternative: இதை இலட்சிய எல்லை, நிபந்தனையற்ற நிரந்தர உடைமை, அல்லது பிற்கால நிறைவேற்றக் கோட்பாடு என விளக்குதல்
  rationale: வசனம் புவியியல் பரப்பை மட்டுமே வெளிப்படையாகக் கூறுகிறது. அதன் நிறைவேற்றம் அல்லது முன்நிழல் குறித்த பிற்கால இறையியல் விவாதங்களை மொழிபெயர்ப்புக்குள் சேர்க்கவில்லை.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையைப் பயன்படுத்துகிறது. முதன்மை வாக்குறுதியையும் அதன் பின் வரும் எல்லை விவரணையையும் அரைப்புள்ளி பிரிக்கிறது. புவியியல் பெயர்களும் மூலத்தின் குறிப்பிட்ட உடல் உருவகமும் பாதுகாக்கப்பட்டுள்ளன.
