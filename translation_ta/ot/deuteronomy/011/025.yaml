base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/025.yaml
  text: No man will stand before you[a]. Yahweh your God will put the fear and dread of you on the face of all the land on which you tread[b], just as he spoke to you.
translation:
  language: ta
  text: ஒருவனும் உங்களுக்கு முன்பாக நிலைத்து நிற்கமாட்டான்[a]. அவர் உங்களுக்குச் சொன்னபடியே, நீங்கள் காலடி வைக்கும் நிலமெங்கும் உங்களைக் குறித்த பயத்தையும் அச்சத்தையும் உங்கள் கடவுளாகிய யாவே ஏற்படுத்துவார்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஒருவனும் உங்களை எதிர்த்து நிலைக்க முடியாது.” “முன்பாக நிலைத்து நிற்றல்” என்ற எபிரெய மரபுத்தொடர் எதிர்த்து நின்று வெற்றிகரமாகத் தாங்கி நிற்பதைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில், “முழு நிலத்தின் முகத்தின்மேல்.” இங்குள்ள சொல் “பூமி” என்றும் பொருள்படலாம்; ஆனால் இஸ்ரவேலர் காலடி வைக்கும் நிலப்பரப்பே உடனடிச் சூழலில் குறிப்பிடப்படுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִתְיַצֵּב אִישׁ בִּפְנֵיכֶם
  choice: ஒருவனும் உங்களுக்கு முன்பாக நிலைத்து நிற்கமாட்டான்
  rationale: எபிரெயச் சொற்றொடரின் ‘முன்பாக நிற்றல்’ என்ற உருவகத்தைத் தக்கவைத்து, இச்சூழலில் எதிர்த்து நிலைக்க முடியாமையையும் இயல்பான தமிழில் உணர்த்துகிறது. אִישׁ எதிர்மறை வாக்கியத்தில் ‘ஒருவனும்’ எனப் பிரதிநிதித்துவப் பொருளில் வழங்கப்பட்டுள்ளது.
- source_word: פַּחְדְּכֶם וּמוֹרַאֲכֶם
  choice: உங்களைப் பற்றிய பயத்தையும் திகிலையும்
  rationale: இரண்டு தொடர்புடைய பெயர்ச்சொற்களின் தீவிரப்படுத்தும் இணைப்பை ‘பயம்’ மற்றும் ‘திகில்’ என்று வேறுபடுத்திக் காக்கிறது; இஸ்ரவேலரைக் குறித்து மற்றவர்களுக்கு ஏற்படும் உணர்வு என்பதையும் தெளிவாக்குகிறது.
- source_word: יִתֵּן ... עַל־פְּנֵי
  choice: தேசம் முழுவதிலும் ... பரவச்செய்வார்
  rationale: נתן என்பதன் அடிப்படைப் பொருள் ‘கொடு/வை’ என்றாலும், பயமும் திகிலும் தேசத்தின் பரப்பெங்கும் ஏற்படச் செய்வதைக் கூறும் இந்த அமைப்பில் ‘பரவச்செய்வார்’ என்பது இயல்பான தமிழ் சமநிகர்.
- source_word: יְהוָה אֱלֹהֵיכֶם
  choice: உங்கள் கடவுளாகிய யெகோவா
  rationale: உடன்படிக்கைப் பெயரான יהוה-வை ‘யெகோவா’ என்று ஒலிபெயர்த்து, ‘உங்கள் கடவுள்’ என்ற உறவுச் சொல்லையும் நேரடியாகப் பாதுகாக்கிறது.
- source_word: עַל־פְּנֵי כָל־הָאָרֶץ
  choice: தேசம் முழுவதிலும்
  rationale: அடுத்த உறவுவாக்கியம் இஸ்ரவேலர் காலடி வைக்கும் நிலப்பரப்பைக் குறுக்குவதால் הָאָרֶץ இங்கு ‘பூமி’ என்பதைக் காட்டிலும் ‘தேசம்’ என்று பொருந்துகிறது. ‘முகம் முழுவதும்’ என்ற எபிரெய மரபுத்தொடர் தமிழில் இயல்பாக ‘முழுவதிலும்’ என வழங்கப்பட்டுள்ளது.
- source_word: אֲשֶׁר תִּדְרְכוּ בָהּ
  choice: நீங்கள் காலடி வைக்கும்
  rationale: דרך என்பதிலுள்ள மிதித்தல் அல்லது கால்பதித்தல் என்ற தெளிவான உருவகத்தைச் சுருக்கமான, இயல்பான தமிழில் காக்கிறது.
- source_word: כַּאֲשֶׁר דִּבֶּר לָכֶם
  choice: அவர் உங்களிடம் சொன்னபடியே
  rationale: דבר என்பது குறிப்பாக ‘வாக்குறுதி அளி’ என்பதல்ல, ‘பேசு/சொல்’ என்பதால் அதன் சொற்பொருள் காக்கப்பட்டுள்ளது; சூழலிலுள்ள வாக்குறுதித் தன்மையை வாசகர் உணர முடியும்.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரை வழங்குதல்
  choice: யெகோவா
  alternative: யாவே
  rationale: நான்கு எழுத்து உடன்படிக்கைப் பெயரை பொதுப்பட்டமான ‘ஆண்டவர்’ என்று மாற்றாமல் தனிப்பெயராகவே வழங்குகிறது. அதன் பழங்கால உச்சரிப்பு முழுமையாக உறுதிப்படுத்தப்படாததால் தமிழில் பரவலாக அறியப்படும் ‘யெகோவா’ தேர்ந்தெடுக்கப்பட்டது; மாற்று ஒலிபெயர்ப்பு அடிக்குறிப்பில் தரப்படுகிறது.
- issue: אִישׁ என்ற பிரதிநிதித்துவ ஆண்பால் ஒருமை
  choice: ஒருவனும்
  alternative: யாரும்
  rationale: மூலத்தின் ஒருமை உருவத்தைத் தக்கவைத்தாலும், எதிர்மறை அமைப்பில் இது எந்த மனித எதிரியையும் உள்ளடக்கும் பொதுப் பொருளில் இருப்பதை தமிழ் இயல்பாக வெளிப்படுத்துகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் கண்ணியமான, எளிதில் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய உருவகங்கள் தமிழில் இயல்பாக இருக்கும் அளவிற்கு காக்கப்பட்டுள்ளன; ‘தேசம் முழுவதின் முகத்தின்மேல்’ போன்ற கடினமான சொற்சொல் அமைப்பு பொருள் தெளிவுக்காக இயல்பாக்கப்பட்டுள்ளது.
