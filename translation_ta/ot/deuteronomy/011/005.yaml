  text: וַ/אֲשֶׁ֥ר עָשָׂ֛ה לָ/כֶ֖ם בַּ/מִּדְבָּ֑ר עַד בֹּאֲ/כֶ֖ם עַד הַ/מָּק֥וֹם הַ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/005.yaml
  text: and what he did for you in the wilderness until you came to this place—
translation:
  language: ta
  text: நீங்கள் இந்த இடத்திற்கு வந்து சேரும் வரை அவர் பாலைநிலத்தில் உங்களுக்காகச் செய்ததையும்—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַאֲשֶׁר
  choice: செய்தவற்றையும்
  rationale: இணைப்புச் சொல்லும் தொடர்புச் சொல்லும் முந்தைய வசனங்களிலுள்ள பட்டியலைத் தொடர்கின்றன. தமிழில் வினையெச்சப் பெயராக்கமான ‘செய்தவற்றையும்’ அந்தத் தொடர்பை இயல்பாகக் காட்டுகிறது.
- source_word: עָשָׂה
  choice: செய்த
  rationale: இது ‘செய்’ என்ற பொதுவான பொருளுடைய வினை; இங்கு பாலைநிலத்தில் கடவுள் செய்த செயல்களைக் குறிக்கிறது.
- source_word: לָכֶם
  choice: உங்களுக்காக
  rationale: இந்தச் சூழலில் לָכֶם என்பது இஸ்ரவேலருக்காக அல்லது அவர்களின் நிமித்தம் செய்யப்பட்ட செயல்களைச் சுட்டுகிறது; ‘உங்களுக்கு’ என்பதைக் காட்டிலும் ‘உங்களுக்காக’ இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: בַּמִּדְבָּר
  choice: பாலைநிலத்தில்
  rationale: מִדְבָּר என்பது இஸ்ரவேலர் பயணித்த குடியிருப்பற்ற வறண்ட நிலப்பகுதியைக் குறிக்கிறது. ‘பாலைநிலம்’ நவீனத் தமிழில் இயல்பானது; முழுக்க மணற்பரப்பான ‘பாலைவனம்’ என்ற மிகக் குறுகிய எண்ணத்தைத் தவிர்க்கிறது.
- source_word: עַד בֹּאֲכֶם
  choice: நீங்கள் ... வந்து சேரும்வரையிலும்
  rationale: முதல் עַד கால எல்லையைக் குறிக்கிறது. בֹּאֲכֶם என்பதை தமிழில் ‘நீங்கள் வந்து சேரும்’ என்ற finite கருத்தாக வழங்குவது இயல்பாக உள்ளது.
- source_word: עַד הַמָּקוֹם הַזֶּה
  choice: இந்த இடத்திற்கு
  rationale: இரண்டாவது עַד சென்றடைந்த இடம் என்னும் வெளி எல்லையைக் குறிக்கிறது. தமிழில் ‘இந்த இடத்திற்கு வந்து சேரும்’ என்பது அந்த இலக்கைத் தெளிவாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: עָשָׂה என்பதன் மறைமுக எழுவாய்
  choice: அவர்
  alternative: யெகோவா / ஆண்டவர்
  rationale: சுற்றியுள்ள உரையில் எழுவாய் யெகோவா என்பது புரிகிறது. ஆனால் இவ்வசனத் துணுக்கில் தெய்வீகப் பெயரையோ பட்டத்தையோ மீண்டும் சேர்க்காமல் ‘அவர்’ என்று வழங்குவது மூலத்தின் தொடர்ச்சியைப் பாதுகாக்கிறது.
- issue: לָכֶם என்பதன் உறவுப்பொருள்
  choice: உங்களுக்காக
  alternative: உங்களுக்கு
  rationale: சூழல் கடவுள் இஸ்ரவேலரின் சார்பாகச் செய்தவற்றை முன்னிறுத்துகிறது. இருப்பினும் எபிரேய முன்னிடைச்சொல்லில் சாத்தியமான ‘உங்களுக்கு’ என்ற உறவுப்பொருளை முற்றிலும் மறுப்பதில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், கண்ணியமானதும் பொதுவாசகர்களுக்கு எளிதில் புரியத்தக்கதுமான நடை. முந்தையதும் அடுத்ததும் உள்ள பட்டியலோடு தொடர்வதை ‘-ஐயும்’ மற்றும் இறுதி நீள்கோடு காட்டுகின்றன. மூலத்தில் உள்ள கால எல்லை மற்றும் இட இலக்கு இரண்டும் ஒரே இயல்பான தமிழ் தொடரில் பாதுகாக்கப்பட்டுள்ளன.
