base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/017.yaml
  text: You shall diligently keep the commandments of Yahweh your God[a], and his testimonies and his statutes[b], which he has commanded you.
translation:
  language: ta
  text: உங்கள் கடவுளாகிய யாவேயின் கட்டளைகளையும், அவர் உனக்குக் கட்டளையிட்ட அவருடைய சாட்சியங்களையும் சட்டங்களையும், மிகுந்த கவனத்துடன் கடைப்பிடியுங்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘உறுதியாகக் கடைப்பிடியுங்கள்’ அல்லது ‘மிகக் கவனமாகப் பின்பற்றுங்கள்’ என்றும் மொழிபெயர்க்கலாம். எபிரேயத்தில் வலியுறுத்தலுக்காக ஒரே வினையின் வினையெச்ச முழுவடிவமும் வினை வடிவமும் இணைந்து பயன்படுத்தப்பட்டுள்ளன.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמוֹר תִּשְׁמְרוּן
  choice: மிகுந்த கவனத்துடன் கடைப்பிடியுங்கள்
  rationale: வினையெச்சத்தின் முழுவடிவமும் வரையறுக்கப்பட்ட வினையும் இணைந்து தரும் வலியுறுத்தலை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது; உடன்படிக்கை சார்ந்த கீழ்ப்படிதலையும் ‘கடைப்பிடியுங்கள்’ தெளிவாகக் காட்டுகிறது.
- source_word: מִצְוֺת
  choice: கட்டளைகள்
  rationale: கட்டாயமாகக் கடைப்பிடிக்க வேண்டிய இறைக் கட்டளைகள் என்ற சட்ட மற்றும் உடன்படிக்கைப் பொருளை நேரடியாகத் தருகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரேய மூலத்தில் உள்ள இறைவனின் தனிப்பெயரை ஒரு பட்டத்தால் மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: אֱלֹהֵיכֶם
  choice: உங்கள் கடவுள்
  rationale: பன்மை முகவரியைக் காட்டும் உடைமைப் பின்னொட்டைத் தமிழில் ‘உங்கள்’ என்று இயல்பாக வெளிப்படுத்துகிறது.
- source_word: עֵדֹתָיו
  choice: அவருடைய சாட்சியங்கள்
  rationale: சுற்றியுள்ள ‘கட்டளைகள்’, ‘சட்டங்கள்’ என்பவற்றிலிருந்து தனித்த எபிரேயச் சட்டச்சொல்லின் சாட்சி/உடன்படிக்கை நுணுக்கத்தைப் பாதுகாக்கிறது.
- source_word: חֻקָּיו
  choice: சட்டங்கள்
  rationale: நிர்ணயிக்கப்பட்ட சட்டவிதிகள் என்ற பொருளை பொதுவாசகர்களுக்குப் புரியும் நவீனத் தமிழில் தருகிறது.
- source_word: אֲשֶׁר צִוָּךְ
  choice: அவர் உங்களுக்குக் கட்டளையிட்ட இவை அனைத்தும்
  rationale: சார்புத்தொடர் முன் குறிப்பிடப்பட்ட மூன்று சட்டவகைகளையும் கூட்டாகக் குறிக்கிறது என்பதைத் தமிழில் தெளிவாக்குகிறது; எபிரேய உரையின் முகவரி மாறுபாட்டைச் சூழலுக்கேற்ற பன்மை ‘உங்களுக்கு’ என வழங்குகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூல உரை இறைவனின் தனிப்பெயரை நேரடியாகப் பயன்படுத்துவதால், அதை ஒரு பட்டமாக மாற்றாமல் ஒலிபெயர்ப்பது உரைசார் தன்மையையும் உடன்படிக்கைச் சூழலையும் காக்கிறது.
- issue: עֵדֹתָיו என்பதன் சட்ட-உடன்படிக்கைப் பொருள்
  choice: அவருடைய சாட்சியங்கள்
  alternative: அவருடைய ஆணைகள் / உடன்படிக்கை நிபந்தனைகள்
  rationale: ‘சாட்சியங்கள்’ என்பது சொல்லின் அடிப்படைச் சாட்சி நுணுக்கத்தைப் பாதுகாக்கிறது; மாற்றுப் பொருள்கள் அடிக்குறிப்பில் தரப்படுவதால் ஒரே விளக்கத்தைத் திணிப்பது தவிர்க்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் சட்ட-உடன்படிக்கைச் சூழலுக்கேற்ற கண்ணியமான நடையிலும் மொழிபெயர்க்கப்பட்டுள்ளது. மூன்று எபிரேயச் சட்டச்சொற்களின் வேறுபாடு முடிந்தவரை தனித்தனியாகப் பாதுகாக்கப்பட்டுள்ளது; வலியுறுத்தல் செயற்கையான சொற்சொல் மீளுருவாக்கமாக இல்லாமல் இயல்பான தமிழில் தரப்பட்டுள்ளது.
