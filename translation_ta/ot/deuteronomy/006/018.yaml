  yaml_path: translation/ot/deuteronomy/006/018.yaml
  text: And you shall do what is right and good in the eyes of Yahweh[a], so that it may go well for you, and you may go in and take possession of the good land that Yahweh swore to your fathers.
translation:
  language: ta
  text: யாவேயின் பார்வையில் நேர்மையானதையும் நல்லதையும் நீ செய்ய வேண்டும். அப்போது உனக்கு நன்மை உண்டாகும்; யாவே உன் தந்தையருக்குச் சத்தியம் செய்து வாக்களித்த நல்ல நாட்டிற்குள் நீ சென்று, அதை உனதாக்கிக்கொள்வாய்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அதை உரிமையாகப் பெறுவாய்’ என்றும் மொழிபெயர்க்கலாம். எபிரெய வினைச்சொல் ‘உரிமையாகப் பெறு,’ ‘உடைமையாக்கு,’ அல்லது ‘கைப்பற்று’ என்று பொருள்படலாம்; இங்கு யாவே தந்தையருக்குச் சத்தியம் செய்து வாக்களித்த நாட்டிற்குள் இஸ்ரவேல் நுழைந்து அதைத் தனதாக்குவதைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: நீ செய்ய வேண்டும்
  rationale: இச்சூழலில் இணைப்புடன் வரும் நிறைவுவினை எதிர்நோக்கிய கட்டளை வலிமையைக் கொண்டுள்ளது; நவீன தமிழில் ‘செய்ய வேண்டும்’ அதை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: הַיָּשָׁר וְהַטּוֹב
  choice: நேர்மையானதையும் நல்லதையும்
  rationale: ‘நேரானது/சரியானது’ மற்றும் ‘நல்லது’ என்ற இரு தனித்த எபிரெயக் கருத்துகளையும் ஒன்றாகக் கலக்காமல் பாதுகாக்கிறது.
- source_word: בְּעֵינֵי יְהוָה
  choice: யாவேயின் பார்வையில்
  rationale: எபிரெய மொழியின் மதிப்பீட்டுச் சொல்லாட்சியான ‘யாவேயின் கண்களில்’ என்பதன் உருவகத்தை இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இது ஒரு பட்டப்பெயர் அல்ல, தேவனுடைய தனிப்பெயரைக் குறிக்கும் நான்கெழுத்துத் திருப்பெயர்; அதனால் ‘ஆண்டவர்’ என்று மாற்றாமல் ஒலிபெயர்க்கப்படுகிறது.
- source_word: לְמַעַן יִיטַב לָךְ
  choice: அப்போது உனக்கு நன்மை உண்டாகும்
  rationale: நோக்கம் அல்லது விளைவை அறிமுகப்படுத்தும் தொடரையும், பொருளாதார வளத்துக்கு மட்டும் குறுக்கப்படாத நலமான முடிவையும் தெளிவாகக் கூறுகிறது.
- source_word: וּבָאתָ
  choice: நீ சென்று
  rationale: வாக்குறுதியளிக்கப்பட்ட நாட்டிற்குள் நுழையும் இயக்கத்தை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: וְיָרַשְׁתָּ
  choice: அதை உனதாக்கிக்கொள்வாய்
  rationale: ירשׁ என்பதன் ‘உரிமையாகப் பெறு/உடைமையாக்கு/கைப்பற்று’ என்ற பரப்பில், இங்கு நாட்டிற்குள் நுழைந்து அதைத் தமதாக்கும் செயற்பாட்டை வெளிப்படுத்துகிறது.
- source_word: הָאָרֶץ הַטּוֹבָה
  choice: நல்ல நாடு
  rationale: எபிரெய மதிப்பீட்டுச் சொல்லை ‘வளமானது’ போன்ற விளக்க விரிவாக்கமின்றி நேரடியாகப் பாதுகாக்கிறது.
- source_word: אֲשֶׁר נִשְׁבַּע יְהוָה
  choice: யாவே ... தருவதாக ஆணையிட்ட
  rationale: נשבע என்பதிலுள்ள உறுதிமொழி வலிமையை ‘ஆணையிட்ட’ என்பதால் தக்கவைக்கிறது; எபிரெயில் விடுபட்டுள்ள, சூழலால் தெளிவாக உணரப்படும் ‘நாட்டைத் தருவதாக’ என்ற பொருள் தமிழில் இலக்கணத் தெளிவுக்காக வெளிப்படுத்தப்படுகிறது.
- source_word: לַאֲבֹתֶיךָ
  choice: உன் தந்தையருக்கு
  rationale: ஆண்பால் பன்மைக் குடும்பச் சொல்லையும் முற்பிதாக்களோடு தொடர்புடைய வரலாற்றுச் சுட்டையும் பொதுமைப்படுத்தாமல் பாதுகாக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற திருப்பெயரின் மொழியாக்கம்
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூலவசனம் தேவனுடைய உடன்படிக்கைத் தனிப்பெயரை நேரடியாகப் பயன்படுத்துகிறது; பட்டப்பெயராக மாற்றுவது அந்த வேறுபாட்டை மறைக்கும்.
- issue: לַאֲבֹתֶיךָ என்ற ஆண்பால் உறவுமுறைச் சொல்
  choice: உன் தந்தையருக்கு
  alternative: உன் முன்னோர்களுக்கு
  rationale: மூலத்தில் ஆண்பால் பன்மை வெளிப்படையாக உள்ளது; இங்கு முற்பிதாக்களுக்கு அளிக்கப்பட்ட உடன்படிக்கை வாக்குறுதியை வரலாற்றுக் குறிப்புடன் தக்கவைக்கிறது.
- issue: וְיָרַשְׁתָּ என்பதன் பொருள்
  choice: அதை உனதாக்கிக்கொள்வாய்
  alternative: அதை உரிமையாகப் பெறுவாய்
  rationale: இந்த வினை மரபுரிமையாகப் பெறுதல் அல்லது உடைமையாக்குதல் என இருவித நிழற்பொருள்களைக் கொள்ளலாம். நாட்டிற்குள் சென்று அதைப் பெற்றுக்கொள்ளும் செயற்பாட்டு சூழலை முதன்மை உரை வெளிப்படுத்துகிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் தெளிவாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ஒருமை இரண்டாம் நபர் வடிவம் பாதுகாக்கப்பட்டுள்ளது. ‘யாவேயின் பார்வையில்’ என்பது எபிரெய உருவகத்தை இயல்பான தமிழில் வைத்திருக்கிறது; ‘நன்மை உண்டாகும்’ என்பது பொருளாதாரச் செழிப்பாக மட்டும் பொருளைக் குறுக்கவில்லை.
