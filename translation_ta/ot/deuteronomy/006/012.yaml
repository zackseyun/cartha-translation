source:
  edition: WLC
  text: הִשָּׁ֣מֶר לְ/ךָ֔ פֶּן תִּשְׁכַּ֖ח אֶת יְהוָ֑ה אֲשֶׁ֧ר הוֹצִֽיאֲ/ךָ֛ מֵ/אֶ֥רֶץ מִצְרַ֖יִם מִ/בֵּ֥ית עֲבָדִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/012.yaml
  text: Be careful lest you forget Yahweh[a], who brought you out of the land of Egypt, out of the house of servants.
translation:
  language: ta
  text: எகிப்து நாட்டிலிருந்து, அடிமைகளின் வீட்டிலிருந்து[a] உன்னை வெளியே கொண்டுவந்த யாவேவை நீ மறந்துவிடாதபடி எச்சரிக்கையாக இரு.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இதை இயல்பான தமிழில், “அடிமைத்தனத்தின் வீட்டிலிருந்து” என்றும் கூறலாம். எபிரேயத்தில் சொல்லுக்குச் சொல், “அடிமைகளின் வீட்டிலிருந்து” என்று உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִשָּׁמֶר לְךָ
  choice: எச்சரிக்கையாக இரு
  rationale: தன்னைப் பாதுகாத்துக்கொள்ளுமாறு எச்சரிக்கும் ஒருமை ஆணையின் வலிமையை, நவீன தமிழில் இயல்பாகவும் தெளிவாகவும் தருகிறது.
- source_word: פֶּן תִּשְׁכַּח
  choice: நீ மறந்துவிடாதபடி
  rationale: தவிர்க்க வேண்டிய அபாயத்தை அறிமுகப்படுத்தும் எபிரேய எதிர்மறை எச்சரிக்கை அமைப்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைத் திருப்பெயரை ஒரு பட்டப்பெயரால் மாற்றாமல், எபிரேய நான்கெழுத்துப் பெயரின் வழக்கமான தமிழ் ஒலிபெயர்ப்பாகத் தருகிறது.
- source_word: הוֹצִיאֲךָ
  choice: உன்னை வெளியே கொண்டுவந்த
  rationale: ஹிஃபில் வடிவத்தின் ‘வெளியே கொண்டுவருதல்’ என்ற காரணவினைப் பொருளையும் யாத்திராகம நிகழ்வையும் நேரடியாகப் பாதுகாக்கிறது.
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: எகிப்து நாட்டிலிருந்து
  rationale: மூலத்தில் வெளிப்படையாக உள்ள ‘நாடு’ என்பதைக் காத்து, தமிழில் இயல்பான சொல்லாக்கத்தைப் பயன்படுத்துகிறது.
- source_word: מִבֵּית עֲבָדִים
  choice: அடிமைகளின் வீட்டிலிருந்து
  rationale: ‘அடிமைகள்’ என்ற மூலத்தின் உறுதியான பன்மைப் பெயர்ச்சொல்லையும் ‘வீடு’ என்ற உருவகத்தையும் காக்கிறது; அதன் இயல்பான கருத்துப்பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: ஆண்டவர் / யெகோவா
  rationale: மூல உரை இறைவனின் தனிப்பெயரை நேரடியாகப் பயன்படுத்துவதால், அதை ஒரு பட்டப்பெயராக மாற்றாமல் ஒலிபெயர்க்கிறது.
- issue: עֲבָדִים என்ற சொல்லின் சமூக நிலைப் பொருள்
  choice: அடிமைகள்
  alternative: அடிமைத்தனம் / ஊழியர்கள்
  rationale: எகிப்திலிருந்த உண்மையான அடிமை நிலையைக் மங்கச் செய்யாமல், மூலத்தின் பன்மை மற்றும் உறுதியான மனிதக் குறிப்பைத் தக்கவைக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான எச்சரிக்கை நடையைப் பயன்படுத்துகிறது. இரண்டாம் நபர் ஒருமைச் சூழலை ‘நீ’ மூலம் வெளிப்படையாகக் காக்கிறது; மூலத்தின் மறக்காதிருக்கும் எச்சரிக்கையையும் இறைப் பெயரையும் தெளிவாகப் பாதுகாக்கிறது.
