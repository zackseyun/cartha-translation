base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/007.yaml
  text: You shall teach them diligently to your sons[a], and you shall speak of them when you sit in your house, and when you walk on the road, and when you lie down[b], and when you rise.
translation:
  language: ta
  text: அவற்றை உன் மகன்களுக்குத்[b] திரும்பத் திரும்பக் கற்பி[a]. நீ உன் வீட்டில் உட்கார்ந்திருக்கும்போதும், வழியில் நடந்துசெல்லும்போதும், படுத்துக்கொள்ளும்போதும், எழும்போதும் அவற்றைப் பற்றிப் பேசு.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய வினைச்சொல்லின் நேரடிப் பொருள் ‘கூர்மையாக்கு’. இங்கு அது மனதில் ஆழமாகப் பதியும்படி கவனமாகவும் திரும்பத் திரும்பவும் கற்பிப்பதை உருவகமாகக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: ‘மகன்கள்’ என்பது எபிரெய மூலத்தின் நேரடிப் பொருள்; விரிந்த பொருளில் இந்த அறிவுரை வீட்டிலுள்ள பிள்ளைகளுக்கான போதனையையும் உள்ளடக்குகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשִׁנַּנְתָּם
  choice: அவற்றைத் திரும்பத் திரும்பக் கற்பி
  rationale: שׁנן என்பதன் அடிப்படைப் பொருள் ‘கூர்மையாக்கு’. இங்கு அது உருவகமாக, கவனத்துடனும் மறுமறுபடியும் மனதில் பதியும்படி கற்பிப்பதைக் குறிக்கிறது. இயல்பான நவீனத் தமிழில் ‘திரும்பத் திரும்பக் கற்பி’ அந்தத் தீவிரத்தைக் காக்கிறது.
- source_word: לְבָנֶיךָ
  choice: உன் மகன்களுக்கு
  rationale: בנים என்பது இங்கு ஆண்பால் பன்மையாக, நேரடியாக ‘உன் மகன்கள்’ என்று பொருள்படுகிறது. மூலத்தின் பாலினக் குறிப்பை முதன்மை உரை காக்கிறது; விரிந்த குடும்பப் பயன்பாடு அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
- source_word: וְדִבַּרְתָּ בָּם
  choice: அவற்றைப் பற்றிப் பேசு
  rationale: דבר உடன் வரும் בָּם இங்கு ‘அவற்றைக் குறித்து/அவற்றைப் பற்றி’ என்று இயல்பாகப் பொருள்படுகிறது. ‘பேசு’ என்பது நேரடியும் dignified modern Tamil usage-க்கும் ஏற்றதுமாகும்.
- source_word: בְּשִׁבְתְּךָ בְּבֵיתֶךָ
  choice: நீ உன் வீட்டில் உட்கார்ந்திருக்கும்போது
  rationale: ב prefixed infinitive construct காலச்சூழலைக் குறிக்கிறது. இந்த வடிவம் வழக்கமான, தொடர்ச்சியான வீட்டுச் சூழலை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וּבְלֶכְתְּךָ בַדֶּרֶךְ
  choice: வழியில் நடந்துசெல்லும்போது
  rationale: הלך மற்றும் דרך ஆகியவற்றின் நேரடிப் படிமத்தை வைத்துக்கொண்டு, அன்றாடப் பயணத்தை நவீனத் தமிழில் தெளிவாகச் சொல்கிறது.
- source_word: וּבְשָׁכְבְּךָ
  choice: படுக்கும்போது
  rationale: படுத்துக்கொள்வதையோ உறங்கச் செல்வதையோ குறிக்கும் காலவாக்கியத்தைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: וּבְקוּמֶךָ
  choice: எழுந்திருக்கும்போது
  rationale: எழுவது, குறிப்பாக உறக்கத்திலிருந்து எழுவது, என்ற பொருளைக் காத்து ‘படுக்கும்போது’ என்பதுடன் இயல்பாக இணைகிறது.
theological_decisions:
- issue: உடன்படிக்கைப் போதனையில் பாலினம் குறிக்கப்பட்ட பிள்ளைச் சொல்
  choice: உன் மகன்களுக்கு
  alternative: உன் பிள்ளைகளுக்கு
  rationale: எபிரெயச் சொல் வெளிப்படையாக ஆண்பால் பன்மை (‘உன் மகன்கள்’). ஆகவே முதன்மை உரையில் அந்த வடிவம் மாற்றப்படவில்லை. இந்த அறிவுரை குடும்பத்தில் விரிவாகப் பொருந்துவதைக் குறிப்பு விளக்குகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், ஒருமை முன்னிலைக் கட்டளை வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன. வசனத்தின் நான்கு அன்றாடச் சூழல்களையும் இணைக்கும் ‘-போதும்’ அமைப்பு எபிரெயத்தின் ஒத்திசைவு மற்றும் தொடர்ச்சியை இயல்பாகக் காக்கிறது. அடிக்குறி [a] அதற்குரிய கற்பித்தல் வினைக்குப் பின்னரும், [b] வசன முடிவில் விரிந்த குடும்பப் பயன்பாட்டைக் குறிக்கவும் வைக்கப்பட்டுள்ளது.
