  naturalness: ‘படுத்துக்கொள்ளும்போதும், எழும்போதும்’ என்பது நவீன நிலையான தமிழில் இயல்பானது; அன்றாடச் செயல்களின் தொடர்ச்சியான சூழல்களையும் துல்லியமாக வெளிப்படுத்துகிறது. ‘அவற்றைப் பற்றிப் பேசு’ இயல்பாகவும் பொருத்தமான பதிவிலும் உள்ளது.
