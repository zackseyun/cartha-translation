base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/010.yaml
  text: And when Yahweh your God brings you into the land that he swore to your fathers—to Abraham[a], to Isaac, and to Jacob—to give you, with great and good cities that you did not build,
translation:
  language: ta
  text: உன் கடவுளாகிய யாவே, உன் தந்தையரான[a] ஆபிரகாமுக்கும், ஈசாக்குக்கும், யாக்கோபுக்கும் உனக்குக் கொடுப்பேன் என்று சத்தியம் செய்த நாட்டிற்குள் உன்னை அழைத்துச் செல்லும்போது, நீ கட்டாத பெரிய, நல்ல நகரங்களையும்,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘உன் முன்னோர்கள்.’ எபிரேயத்தில் ‘உன் தந்தையர்’ என்று உள்ளது; இங்கே ஆபிரகாம், ஈசாக்கு, யாக்கோபு ஆகியோர் குறிப்பாகப் பெயரிடப்படுகிறார்கள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: அப்போது / ... செல்லும்போது
  rationale: எதிர்காலத்தில் நிகழவிருக்கும் சூழலை அறிமுகப்படுத்தும் எபிரேய அமைப்பை இயல்பான நவீனத் தமிழில் காலவினைத் தொடரால் வெளிப்படுத்துகிறது; வாக்கியம் அடுத்த வசனங்களில் தொடர்வதால் இறுதியில் முடிவுறாத தொடரமைப்பு வைக்கப்படுகிறது.
- source_word: יְבִיאֲךָ
  choice: உன்னை அழைத்துச் செல்லும்போது
  rationale: בוא என்பதன் ஹிஃபில் வடிவிலுள்ள ‘உள்ளே கொண்டுவருதல்’ என்ற காரணவினைப் பொருளை இலக்கு நாட்டிற்குள் அழைத்துச் செல்வதாக இயல்பாக வெளிப்படுத்துகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரான நான்கெழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் வழக்கமான ஒலிபெயர்ப்பாகத் தருகிறது.
- source_word: אֱלֹהֶיךָ
  choice: உன் கடவுளாகிய
  rationale: இரண்டாம் நபர் ஒருமை உடைமைப் பொருளான ‘உன் கடவுள்’ என்பதைத் தொடர்ந்து வரும் பெயருடன் இயல்பாக இணைக்கிறது.
- source_word: הָאָרֶץ
  choice: அந்த நாட்டிற்குள்
  rationale: உடன்படிக்கை வாக்குறுதியின் குறிப்பிட்ட நிலப்பரப்பைக் குறிக்கும் definite வடிவை ‘அந்த நாடு’ என வெளிப்படுத்தி, בוא-வின் இயக்கப் பொருளுக்கேற்ப ‘-க்குள்’ சேர்க்கப்பட்டுள்ளது.
- source_word: אֲשֶׁר נִשְׁבַּע
  choice: ஆணையிட்ட
  rationale: שׁבע என்பதிலுள்ள சத்தியம்/உறுதிமொழி கூறும் வலிமையை ‘வாக்குறுதி அளித்த’ என மெலிதாக்காமல் ‘ஆணையிட்ட’ எனக் காக்கிறது.
- source_word: לַאֲבֹתֶיךָ
  choice: உன் தந்தையரான
  rationale: ஆண்பால் பன்மை உறவுச் சொல்லையும், உடனே பெயரிடப்படும் ஆபிரகாம், ஈசாக்கு, யாக்கோபு ஆகிய முன்னோர்களின் குறிப்புத்தன்மையையும் காக்கிறது.
- source_word: לְאַבְרָהָם לְיִצְחָק וּלְיַעֲקֹב
  choice: ஆபிரகாமுக்கும் ஈசாக்குக்கும் யாக்கோபுக்கும்
  rationale: மூன்று பெயர்களோடும் திரும்ப வரும் לְ முன்னிலையின் ஒத்த அமைப்பைத் தமிழ் வேற்றுமை உருபை ஒவ்வொரு பெயருடனும் சேர்த்துக் காக்கிறது.
- source_word: לָתֶת לָךְ
  choice: உனக்குக் கொடுப்பதாக
  rationale: கொடுத்தலின் நோக்கத்தையும் இரண்டாம் நபர் ஒருமை பெறுநரையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: עָרִים גְּדֹלֹת וְטֹבֹת
  choice: பெரிய, நல்ல நகரங்கள்
  rationale: גדל என்பதன் அளவு/மகத்துவப் பொருளையும் טוב என்பதன் நல்ல/விரும்பத்தக்க தன்மையையும் விளக்கவுரை சேர்க்காமல் நேரடியாகக் காக்கிறது.
- source_word: אֲשֶׁר לֹא בָנִיתָ
  choice: நீ கட்டாத
  rationale: இரண்டாம் நபர் ஆண்பால் ஒருமை எதிர்மறை நிறைவுவினையை தமிழில் பாலைக் குறிக்காத இயல்பான உறவெச்சமாகத் தருகிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரின் மொழியாக்கம்
  choice: யாவே
  alternative: யெகோவா; கர்த்தர்
  rationale: மூலத்தில் தனிப்பட்ட உடன்படிக்கைப் பெயர் நேரடியாக இருப்பதால், அதை ஒரு பட்டமாக மாற்றாமல் ஒலிபெயர்க்கிறது.
- issue: לַאֲבֹתֶיךָ என்பதிலுள்ள பாலினம் குறித்த உறவுச்சொல்
  choice: உன் தந்தையரான
  alternative: உன் முன்னோர்களான
  rationale: மூலம் ஆண்பால் பன்மையைப் பயன்படுத்துவதோடு ஆபிரகாம், ஈசாக்கு, யாக்கோபு என்று குறிப்பாகப் பெயரிடுவதால், தந்தையர் என்ற குறிப்புத்தன்மை காக்கப்படுகிறது.
- issue: נִשְׁבַּע என்பதன் உறுதிமொழிப் பொருள்
  choice: ஆணையிட்ட
  alternative: வாக்குறுதி அளித்த
  rationale: மூல வினை சத்தியம் செய்து உறுதியளித்தலைக் குறிக்கிறது; ‘ஆணையிட்ட’ என்பது அதன் உடன்படிக்கைச் சத்திய வலிமையைத் தக்கவைக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான நடை. ஒருமை ‘உன்/உன்னை/நீ’ என்பவை மூலத்தின் இரண்டாம் நபர் ஒருமையைப் பாதுகாக்கின்றன. வசனம் 11–12 உடன் இலக்கண ரீதியாகத் தொடர்வதால் முடிவில் காற்புள்ளி வைக்கப்பட்டுள்ளது; ‘நகரங்களையும்’ என்ற இணைப்பும் அடுத்த பட்டியலுடன் தொடர்வதைச் சுட்டுகிறது.
