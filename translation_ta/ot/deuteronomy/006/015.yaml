base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/015.yaml
  text: for Yahweh your God in your midst is a jealous God[b][a], lest the anger of Yahweh your God burn against you and he destroy you from the face of the earth.
translation:
  language: ta
  text: ஏனெனில், உங்கள் நடுவில் இருக்கும் உங்கள் கடவுளாகிய யாவே பொறாமையுள்ள கடவுள்.[a] இல்லையெனில், உங்கள் கடவுளாகிய யாவேயின் கோபம் உங்களுக்கு எதிராகப் பற்றியெரிந்து, அவர் உங்களைப் பூமியின் முகத்திலிருந்து முற்றிலும் அழித்துவிடுவார்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ஆர்வமிக்க கடவுள்’ என்றும் மொழிபெயர்க்கலாம். இங்கு எபிரெயச் சொல், தம் மக்கள்மீது யாவே கொண்டுள்ள தனிப்பட்ட உடன்படிக்கை உரிமையையும் போட்டி வழிபாட்டை அவர் சகிக்காததையும் வலியுறுத்துகிறது.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயில், ‘பூமியின் முகத்தின்மேலிருந்து’; இது முற்றிலும் அகற்றப்படுவதைக் குறிக்கும் மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய வசனத்தின் தடைக்கான காரணத்தை அறிமுகப்படுத்துகிறது.
- source_word: אֵל קַנָּא
  choice: பொறாமையுள்ள கடவுள்
  rationale: போட்டி வழிபாட்டைச் சகிக்காத, தம் உடன்படிக்கை மக்கள்மீது யாவே கொண்டுள்ள தனிப்பட்ட உரிமைக்கோரிக்கையை வெளிப்படுத்துகிறது; எளிய மனிதப் பொறாமை என்ற பொருள் அல்ல.
- source_word: יְהוָה
  choice: யாவே
  rationale: தலைப்பால் மாற்றாமல், எபிரெயத் தெய்வீகப் பெயரை ஒலிபெயர்க்கிறது.
- source_word: אֱלֹהֶיךָ
  choice: உங்கள் கடவுள்
  rationale: இரண்டாம் நபர் ஆண்பால் ஒருமை பின்னொட்டைக் கொண்ட வடிவம்; தமிழில் மரியாதை/பொதுவான வாசகர் வழக்கிற்கேற்ப ‘உங்கள்’ என வழங்கப்படுகிறது.
- source_word: בְּקִרְבֶּךָ
  choice: உங்கள் நடுவில் இருக்கும்
  rationale: மக்களிடையே கடவுள் உடனிருப்பதன் இடவியல் மற்றும் உடன்படிக்கை சார்ந்த பொருளைப் பாதுகாக்கிறது.
- source_word: פֶּן
  choice: இல்லையென்றால்
  rationale: நிகழக்கூடிய கடுமையான விளைவை எச்சரிக்கும் இயல்பான நவீனத் தமிழ்ச் சொல்.
- source_word: יֶחֱרֶה אַף
  choice: கோபம் ... பற்றியெரிந்து
  rationale: கோபம் எரிதல் என்ற எபிரெய உருவகத்தை இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: בָּךְ
  choice: உங்களுக்கு எதிராக
  rationale: கோபத்தின் இலக்கைத் தெளிவாகக் காட்டுகிறது.
- source_word: וְהִשְׁמִידְךָ
  choice: உங்களை ... முற்றிலும் அழித்துவிடுவார்
  rationale: ஹிஃபில் வடிவத்தின் வலிமையான அழித்தல்/அகற்றுதல் பொருளை வெளிப்படுத்துகிறது.
- source_word: מֵעַל פְּנֵי הָאֲדָמָה
  choice: பூமியின் முகத்திலிருந்து
  rationale: முழுமையாக அகற்றப்படுதலைக் குறிக்கும் எபிரெய மரபுத்தொடரின் உருவகத்தைப் பாதுகாக்கிறது.
theological_decisions:
- issue: தெய்வீகப் பொறாமையை மொழிபெயர்த்தல்
  choice: பொறாமையுள்ள கடவுள்
  alternative: தீவிர வைராக்கியமுள்ள கடவுள்
  rationale: קַנָּא என்பது பாவமுள்ள மனிதப் பொறாமையை அல்ல, உடன்படிக்கை உறவில் யாவேயின் தனியுரிமைக் கோரிக்கையையும் போட்டி வழிபாட்டைச் சகிக்காமையையும் குறிக்கிறது. ‘பொறாமை’ என்ற பதம் மூலத்தின் இறையியல் அழுத்தத்தையும் பதற்றத்தையும் மறைக்காமல் காக்கிறது.
- issue: יהוה என்ற தெய்வீகப் பெயர்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் வரும் தனிப்பட்ட உடன்படிக்கைப் பெயரை ஒரு பட்டத்தால் மாற்றாமல் ஒலிபெயர்க்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகருக்குப் புரியும் கண்ணியமான நடை. வசனத்தின் எச்சரிக்கைத் தொனியும் ‘கோபம் பற்றியெரிதல்’ மற்றும் ‘பூமியின் முகம்’ ஆகிய மூல உருவகங்களும் தக்கவைக்கப்பட்டுள்ளன. எபிரெயில் ‘நீ’ ஒருமை வந்தாலும், தமிழில் இயல்பும் கண்ணியமும் கருதி ‘உங்கள்/உங்களை’ பயன்படுத்தப்பட்டுள்ளது.
