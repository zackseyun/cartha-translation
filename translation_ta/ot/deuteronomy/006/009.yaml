- from: அவற்றை உன் வீட்டின் வாசல் நிலைகளிலும் உன் வாயில்களிலும்[a] எழுதுவாயாக.
  to: அவற்றை உன் வீட்டின் வாசல் நிலைகளின் மீதும்[a] உன் வாயில்களிலும்[b] எழுதுவாயாக.
  rationale: The revision makes the explicit Hebrew contrast between עַל מְזוּזֹת (‘upon the doorposts’) and בִּשְׁעָרֶיךָ (‘in/at your gates’) visible in idiomatic modern Tamil. It preserves the command’s object, number, possessive reference, and the lexical breadth of ‘gates.’
