base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/009.yaml
  text: You shall write them on the doorposts of your house and on your gates[a][b].
translation:
  language: ta
  text: அவற்றை உன் வீட்டின் வாசல் நிலைகளின் மீதும்[a] உன் வாயில்களிலும்[b] எழுதுவாயாக.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “வாசற்சட்டங்களின் மீதும்.” எபிரெயச் சொல் வாசலின் பக்க நிலைகளைக் குறிப்பாகக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “உன் வாயில் நிலைகளிலும்” அல்லது “உன் வாயில்களருகிலும்.” எபிரெயச் சொல் வாயிலையோ அதன் நுழைவுப் பகுதியையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּכְתַבְתָּם
  choice: அவற்றை எழுதுவாயாக
  rationale: இணைப்புடன் வரும் வினைமுற்று இக்கட்டளைத் தொடரில் கட்டளைப் பொருளைத் தருகிறது; பின்னுள்ள சூழலில் கூறப்பட்ட வார்த்தைகளைக் குறிக்கும் பன்மைச் சுட்டுப்பொருளும் வெளிப்படையாகத் தக்கவைக்கப்படுகிறது.
- source_word: עַל מְזוּזֹת בֵּיתֶךָ
  choice: உன் வீட்டின் வாசல் நிலைகளிலும்
  rationale: מְזוּזֹת என்பது வாசலின் பக்கவாட்டில் நிற்கும் நிலைகளைச் சுட்டுகிறது. தமிழ் கட்டுமான வழக்கில் ‘வாசல் நிலைகள்’ இயல்பாகவும் துல்லியமாகவும் உள்ளது; עַל என்பதன் மேற்பரப்பில் எழுதும் பொருள் ‘-இல்’ மூலம் இயல்பாக வெளிப்படுகிறது.
- source_word: וּבִשְׁעָרֶיךָ
  choice: உன் வாயில்களிலும்
  rationale: שְׁעָרֶיךָ என்பது சொத்து, குடியிருப்பு அல்லது நகர நுழைவாயில்களைக் குறிக்கக்கூடிய பன்மை வடிவம். எபிரெய இணை அமைப்பையும் பொதுவான பரப்பையும் ‘வாயில்களிலும்’ தக்கவைக்கிறது.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதைமிக்க ஆனால் எளிதில் புரியும் நடையில் மொழிபெயர்க்கப்பட்டது. ஒருமை இரண்டாம் நபர் கட்டளை வடிவம் தக்கவைக்கப்பட்டுள்ளது; ‘வாசல் நிலை’ மற்றும் ‘வாயில்’ என்ற வேறுபாடு மூலத்தின் இரண்டு பெயர்ச்சொற்களையும் பிரதிபலிக்கிறது.
