  text: וְ/אָמַרְתָּ֣ לְ/בִנְ/ךָ֔ עֲבָדִ֛ים הָיִ֥ינוּ לְ/פַרְעֹ֖ה בְּ/מִצְרָ֑יִם וַ/יּוֹצִיאֵ֧/נוּ יְהוָ֛ה מִ/מִּצְרַ֖יִם בְּ/יָ֥ד חֲזָקָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/021.yaml
  text: then you shall say to your son[a], ‘We were servants to Pharaoh in Egypt[b], and Yahweh brought us out from Egypt with a strong hand.’
translation:
  language: ta
  text: 'அப்போது[a] நீ உன் மகனிடம் இப்படிச் சொல்ல வேண்டும்: “நாங்கள் எகிப்தில் பார்வோனுக்கு அடிமைகளாக இருந்தோம். யாவே தமது வலிமையான கையால்[b] எங்களை எகிப்திலிருந்து வெளியே கொண்டுவந்தார்.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மேலும் நீ ... சொல்ல வேண்டும்.” எபிரெய இணைப்புச் சொல் பொதுவாக ‘மேலும்/மற்றும்’ என்றும் மொழிபெயர்க்கப்படலாம்; இங்கு ‘அப்போது’ என்பது முந்தைய வசனத்திலிருந்து தொடரும் அறிவுறுத்தல் வரிசையை வெளிப்படுத்துகிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “தமது வல்லமையுள்ள கையால்.” இந்த எபிரெயச் சொல்லாட்சி யாவேயின் வல்லமையான விடுதலைச் செயலைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמַרְתָּ
  choice: அப்போது நீ ... சொல்ல வேண்டும்
  rationale: முந்தைய வசனத்தில் வரும் மகனின் கேள்விக்குப் பதிலளிக்கும் அறிவுறுத்தல் வரிசையை וְ என்ற இணைப்புச் சொல் தொடர்கிறது. ‘அப்போது’ அந்த வரிசையை இயல்பான தமிழில் தெளிவாக்குகிறது; ‘சொல்ல வேண்டும்’ கட்டளையுணர்வை வெளிப்படுத்துகிறது.
- source_word: לְבִנְךָ
  choice: உன் மகனிடம்
  rationale: எபிரெயச் சொல் ஆண்பால் ஒருமையில் ‘உன் மகன்’ என்று குறிப்பாக உள்ளது; அதை பாலினப் பொதுமைப்படுத்தாமல் அப்படியே மொழிபெயர்க்கிறது.
- source_word: עֲבָדִים
  choice: அடிமைகளாக
  rationale: யாத்திராகமச் சூழலில் இச்சொல் பார்வோனின் கீழிருந்த கட்டுப்பட்ட அடிமைநிலையைக் குறிக்கிறது; ‘வேலைக்காரர்கள்’ என்பதைவிட ‘அடிமைகள்’ மூலத்தின் வலிமையைத் தக்கவைக்கிறது.
- source_word: לְפַרְעֹה
  choice: பார்வோனுக்கு
  rationale: לְ இங்கு பார்வோனுக்கு உட்பட்டிருந்த உறவைச் சுட்டுகிறது. ‘பார்வோனுக்கு அடிமைகளாக’ என்பது இயல்பான தமிழிலும் அந்த உட்பட்ட நிலையைத் தெளிவாகவும் காட்டுகிறது.
- source_word: וַיּוֹצִיאֵנוּ
  choice: எங்களை ... வெளியே கொண்டுவந்தார்
  rationale: יצא என்பதன் ஹிஃபில் வடிவம் ‘வெளியே வரச் செய்தல், வெளியே கொண்டுவருதல்’ என்று பொருள்படும்; விடுதலைச் செயலை நேரடியாகக் காட்டுகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: மூலத்தில் வரும் இறைத் திருப்பெயரான நான்கெழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: בְּיָד חֲזָקָה
  choice: தமது வலிமையான கையால்
  rationale: சொல்லாட்சியின் ‘வலிமையான கை’ என்ற உருவகத்தைத் தக்கவைத்தபடி, யாவேயின் வல்லமையான விடுதலைச் செயலை இயல்பான தமிழில் தெரிவிக்கிறது. ‘தமது’ என்பது அந்தக் கை யாவேக்குரியது என்பதைத் தமிழில் தெளிவாக்குகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைத் திருப்பெயரின் மொழியாக்கம்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: வசனம் ஒரு பொதுப் பட்டத்தை அல்ல, இறைவனின் தனிப்பெயரைப் பயன்படுத்துகிறது. ஆகவே அந்தத் தனிப்பெயரை ஒலிபெயர்த்து, மூலத்தின் உடன்படிக்கைப் பெயரைத் தக்கவைக்கிறது.
- issue: עֲבָדִים குறிக்கும் அடிமைநிலையின் தீவிரம்
  choice: அடிமைகள்
  alternative: வேலைக்காரர்கள்
  rationale: எகிப்திலும் பார்வோனின் கீழும் இருந்த ஒடுக்குமுறைப் பிணைப்பே சூழலின் மையம். ‘அடிமைகள்’ என்பது அந்த வரலாற்று மற்றும் இறையியல் நிறையை மென்மையாக்காமல் வெளிப்படுத்துகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், வாசிப்புக்கு எளியதாயும் மரியாதைமிக்கதாயும் அமைக்கப்பட்டுள்ளது. நேரடி உரை தெளிவாகப் பிரிக்கப்பட்டுள்ளது; மூலத்தின் ‘கை’ உருவகமும், ‘மகன்’ என்ற ஆண்பால் ஒருமையும், இறைத் தனிப்பெயரும் பாதுகாக்கப்பட்டுள்ளன.
