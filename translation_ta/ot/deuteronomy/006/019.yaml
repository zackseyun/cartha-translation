- from: உன் முன்னிலையிலிருந்து உன் பகைவர்கள் அனைவரையும் துரத்திவிடுவதற்காக[b], யாவே கூறியிருக்கிறபடியே[a].
  to: உன் முன்பாக இருந்து உன் பகைவர்கள் அனைவரையும் துரத்திவிடுவதற்காக[b], யாவே கூறியபடியே[a].
