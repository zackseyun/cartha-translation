  text: לַ/הֲדֹ֥ף אֶת כָּל אֹיְבֶ֖י/ךָ מִ/פָּנֶ֑י/ךָ כַּ/אֲשֶׁ֖ר דִּבֶּ֥ר יְהוָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/019.yaml
  text: to drive out all your enemies from before you[b][a], as Yahweh has spoken.
translation:
  language: ta
  text: உன் முன்பாக இருந்து உன் பகைவர்கள் அனைவரையும் துரத்திவிடுவதற்காக[b], யாவே கூறியபடியே[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கூறியிருக்கிறபடியே.” எபிரேய வினைச்சொல் சொற்சொல்லாக “கூறினார்” என்பதைக் குறிக்கிறது; முன்பு கூறப்பட்ட அந்த வார்த்தை தொடர்ந்து செல்லுபடியாக இருப்பது இங்கு உணர்த்தப்படுகிறது.
    reason: lexical_alternative
  - marker: b
    text: எபிரேயத்தில், “உன் முகத்திலிருந்து.” இது உன் பாதையிலிருந்தோ உன் முன்னிலையிலிருந்தோ பகைவர்களை அகற்றுவதைக் குறிக்கும் மரபுத்தொடர்.
    reason: cultural_note
lexical_decisions:
- source_word: לַהֲדֹף
  choice: துரத்திவிடுவதற்காக
  rationale: ל முன்னொட்டுடன் வரும் வினையெச்ச வடிவம் முந்தைய வசனத்துடன் தொடரும் நோக்கம் அல்லது விளைவைக் காட்டுகிறது. ஹிஃபில் வடிவிலுள்ள נדף, பகைவர்களை அப்புறப்படுத்துதல் அல்லது விரட்டியடித்தல் என்ற பொருளைத் தருகிறது; ‘துரத்திவிடு’ என்பது இயல்பான நவீனத் தமிழ்.
- source_word: אֶת
  choice: '[நேரடிச் செயப்படுபொருள் குறியீடு; மொழிபெயர்க்கப்படவில்லை]'
  rationale: எபிரேய நேரடிச் செயப்படுபொருள் குறியீட்டுக்குத் தமிழில் தனியான இணைச்சொல் தேவையில்லை.
- source_word: כָּל
  choice: அனைவரையும்
  rationale: பன்மையில் உள்ள மனிதர்களைக் குறிக்கும் אֹיְבֶיךָ உடன் சேர்ந்து முழுமையைக் காட்டுவதால், தமிழில் ‘அனைவரையும்’ என்று இயல்பாக வழங்கப்பட்டுள்ளது.
- source_word: אֹיְבֶיךָ
  choice: உன் பகைவர்கள்
  rationale: இரண்டாம் நபர் ஆண்பால் ஒருமை பின்னொட்டைத் தக்கவைத்து, இஸ்ரவேலிடம் ஒருமையில் செய்யப்படும் நேரடி உரையைப் பாதுகாக்கிறது.
- source_word: מִפָּנֶיךָ
  choice: உன் முன்னிலையிலிருந்து
  rationale: சொல்லுக்கு நெருக்கமாக ‘உன் முகம்/முன்னிலையிலிருந்து’ என்று பொருள். இங்கு பகைவர்கள் ஒருவரின் பாதையிலிருந்தோ முன்னிலையிலிருந்தோ அகற்றப்படுவதைச் சுட்டும் எபிரேய மரபுத்தொடரின் வடிவம் பாதுகாக்கப்படுகிறது.
- source_word: כַּאֲשֶׁר
  choice: …படியே
  rationale: முன்பு உரைக்கப்பட்ட இறைவார்த்தைக்கும் நிகழவிருக்கும் செயலுக்கும் உள்ள ஒத்திசைவைத் தமிழில் இயல்பாகக் காட்டுகிறது.
- source_word: דִּבֶּר
  choice: கூறியிருக்கிற
  rationale: எபிரேயத்தில் இது நிறைவுற்ற வினைவடிவம். முன்பு கூறப்பட்ட வார்த்தை தொடர்ந்து செல்லுபடியாக இருப்பதைக் தமிழின் நிறைவு வடிவம் உணர்த்துகிறது; ‘வாக்களித்த’ என்று மொழிபெயர்த்து மூலவினையின் பொருளை விரிவுபடுத்தவில்லை.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைப்பட்டத்தால் மாற்றாமல், எபிரேய நான்கெழுத்துத் திருப்பெயரின் பரவலான தமிழ் ஒலிபெயர்ப்பு பயன்படுத்தப்பட்டுள்ளது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை வழங்குதல்
  choice: யாவே
  alternative: யெகோவா; கர்த்தர்
  rationale: மூலத்தில் தனிப்பட்ட உடன்படிக்கைப் பெயரே நேரடியாக இருப்பதால், அதை ஒரு பட்டத்தால் மாற்றாமல் ஒலிபெயர்க்கிறது.
- issue: உடன்படிக்கைச் சூழலில் דִּבֶּר என்பதன் காலமும் வலிமையும்
  choice: கூறியிருக்கிறபடியே
  alternative: கூறியபடியே; வாக்களித்தபடியே
  rationale: முன்பு உரைக்கப்பட்ட வார்த்தை இன்னும் வலிமையுடன் இருப்பதை நிறைவு வடிவம் உணர்த்துகிறது. ‘வாக்களித்தபடியே’ என்பது சூழலுக்கு ஏற்ற விளக்கமாக இருந்தாலும், דבר என்ற வினையைத் தேவைக்குமேல் குறிப்பாக்கும்.
translation_notes:
  register: நவீனத் தரத் தமிழில், மரியாதையும் எளிய புரிதலும் இணையும் நடை பயன்படுத்தப்பட்டுள்ளது. இது முந்தைய வசனத்தின் இலக்கணத் தொடராக இருப்பதால் ‘…துரத்திவிடுவதற்காக’ என்ற துணைவாக்கிய வடிவம் காக்கப்பட்டுள்ளது. ஒருமை இரண்டாம் நபர் உரை ‘உன்’ மூலம் பாதுகாக்கப்பட்டுள்ளது.
