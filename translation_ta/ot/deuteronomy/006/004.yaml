source:
  edition: WLC
  text: שְׁמַ֖ יִשְׂרָאֵ֑ל יְהוָ֥ה אֱלֹהֵ֖י/נוּ יְהוָ֥ה אֶחָֽ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/004.yaml
  text: 'Hear[a], Israel: Yahweh our God, Yahweh is one.'
translation:
  language: ta
  text: 'இஸ்ரவேலே, கேள்[a]: யாவே நம் கடவுள்; யாவே ஒருவரே.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யாவே நம் கடவுள்; யாவே மட்டுமே”; வேறொரு வகையில், “நம் கடவுளாகிய யாவே ஒரே யாவே.” எபிரெயச் சொற்றொடர் மிகவும் சுருக்கமானது; ஆகவே இலக்கணரீதியாக ஒன்றுக்கு மேற்பட்ட மொழிபெயர்ப்புகள் சாத்தியம்.
    reason: alternative_reading
lexical_decisions:
- source_word: שְׁמַע
  choice: கேள்
  rationale: இஸ்ரவேலை ஒரே மக்களினமாக முன்னிறுத்தி ஒருமையில் கொடுக்கப்பட்ட கட்டளை. ‘கேள்’ என்பது செவியால் கேட்பதையும் கவனித்து அதன்படி நடப்பதற்கான உடன்படிக்கை அழைப்பையும் சுருக்கமாகத் தக்கவைக்கிறது.
- source_word: יִשְׂרָאֵל
  choice: இஸ்ரவேல்
  rationale: உடன்படிக்கை மக்களின் இயற்பெயர்; தமிழில் நிலைபெற்ற ஒலிபெயர்ப்பு பயன்படுத்தப்படுகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீக இயற்பெயரை ‘கர்த்தர்’ போன்ற பட்டப்பெயரால் மாற்றாமல், எபிரெய நான்கெழுத்துப் பெயரின் பரவலாக ஏற்கப்பட்ட உச்சரிப்பைத் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: אֱלֹהֵינוּ
  choice: நம் கடவுள்
  rationale: வடிவத்தில் பன்மைக் கூறு இருந்தாலும், இச்சூழலில் இஸ்ரவேலின் கடவுளைக் குறிக்கும் ஒருமைப் பட்டப்பெயராக இயங்குகிறது. உள்ளடக்கும் முதல் நபர் பன்மையை ‘நம்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: אֶחָד
  choice: ஒருவரே
  rationale: அடிப்படைப் பொருளான ‘ஒருவர்/ஒன்று’ என்பதைக் காக்கிறது. யாவேயின் தனித்தன்மை அல்லது அவரையே வழிபட வேண்டிய தனியுரிமை ஆகிய பொருள்களை விளக்கமாக முதன்மை உரைக்குள் சேர்க்காமல் விடுகிறது.
theological_decisions:
- issue: ஷெமாவின் இறுதிக் கூற்றிலுள்ள தொடரமைப்பும் பொருளும்
  choice: யாவே நம் கடவுள்; யாவே ஒருவரே
  alternative: யாவே நம் கடவுள்; யாவே மட்டுமே / நம் கடவுளாகிய யாவே ஒரே யாவே
  rationale: வினைச்சொல் வெளிப்படையாக இல்லாத சுருக்கமான எபிரெயத் தொடரை ஒன்றுக்கு மேற்பட்ட முறையில் இலக்கணரீதியாகப் புரிந்துகொள்ளலாம். முதன்மை மொழிபெயர்ப்பு אֶחָד என்பதன் அடிப்படைப் பொருளைக் காத்து, நீண்டகாலமாக ஏற்கப்பட்ட மற்ற வாசிப்புகளை அடிக்குறிப்பில் வழங்குகிறது; இதனால் ஏகத்துவத்திற்கும் தனிப்பட்ட பற்றுறுதிக்கும் இடையிலான உரையின் பொருள் அழுத்தம் முன்கூட்டியே தீர்க்கப்படவில்லை.
translation_notes:
  register: நவீன தரத் தமிழில் சுருக்கமான, கண்ணியமான அறிக்கை வடிவம் பயன்படுத்தப்பட்டுள்ளது. ‘கேள்’ என்ற ஒருமைக் கட்டளை இஸ்ரவேலை ஒருங்கிணைந்த மக்களாக அழைக்கிறது. நிறுத்தக்குறிகள் எபிரெயத்தின் சுருக்கமான வினையற்ற கூறுகளை வாசகருக்குத் தெளிவாக்குகின்றன; இல்லாத வினைச்சொல்லை தேவையின்றி சேர்க்கவில்லை.
