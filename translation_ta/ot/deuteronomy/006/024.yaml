  text: And the LORD commanded us to do all these statutes, to fear the LORD our God, for our good always, to keep us alive as it is this day.
translation:
  language: ta
  text: இந்தச் சட்டங்கள் அனைத்தையும் கடைப்பிடிக்கவும், நம் கடவுளாகிய ஆண்டவருக்கு அஞ்சவும், எல்லா நாட்களிலும் நமக்கு நன்மை உண்டாகவும், இந்நாளில் இருப்பதுபோல் நம்மை உயிரோடு காக்கவும் ஆண்டவர் நமக்குக் கட்டளையிட்டார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: ஆண்டவர்
  rationale: தேவநாமத்தைத் தமிழ் வேதாகம மரபுக்கும் பொதுவாசிப்புக்கும் ஏற்ற வகையில் மரியாதையுடன் குறிக்கிறது.
- source_word: לַעֲשׂוֹת אֶת כָּל הַחֻקִּים הָאֵלֶּה
  choice: இந்தச் சட்டங்கள் அனைத்தையும் கடைப்பிடிக்கும்படி
  rationale: எபிரேயத்தின் ‘செய்ய’ என்ற சொல் இங்கு சட்டங்களுக்குக் கீழ்ப்படிந்து அவற்றை நடைமுறைப்படுத்துவதைக் குறிக்கும்; ‘கடைப்பிடிக்க’ என்பது இயல்பான நவீனத் தமிழ்.
- source_word: לְיִרְאָה אֶת יְהוָה
  choice: ஆண்டவருக்குப் பயந்து நடக்கவும்
  rationale: ‘பயப்படுதல்’ என்பது வெறும் அச்சம் மட்டுமல்லாது மரியாதை கலந்த கீழ்ப்படிதலையும் குறிக்கிறது; ‘நடக்கவும்’ என்பது தமிழில் அந்த வாழ்வியல் பொருளை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: לְטוֹב לָנוּ כָּל הַיָּמִים
  choice: எப்போதும் நமக்கு நன்மை உண்டாகவும்
  rationale: כָּל הַיָּמִים என்பதன் நேரடிப் பொருள் ‘எல்லா நாட்களிலும்’; சூழலில் தொடர்ச்சியான நன்மையைக் குறிக்கும் ‘எப்போதும்’ இயல்பாக உள்ளது.
- source_word: לְחַיֹּתֵנוּ
  choice: நம்மை உயிரோடு காக்கவும்
  rationale: ஹிஃபில் வடிவத்தின் காரணவினைப் பொருளான ‘நம்மை வாழச்செய்ய/உயிரோடு வைத்திருக்க’ என்பதைக் தெளிவாகத் தருகிறது.
theological_decisions:
- issue: ஆண்டவருக்குப் பயப்படுதல்
  choice: ஆண்டவருக்குப் பயந்து நடக்கவும்
  alternative: ஆண்டவரை அஞ்சவும்
  rationale: மூலத்தின் ‘பயம்’ என்ற வலிமையைத் தக்கவைத்தபடியே, அது கீழ்ப்படிதலுடன் கூடிய வாழ்வுநிலையைக் குறிக்கும் என்பதை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- issue: கட்டளையின் நோக்கங்களை இணைத்தல்
  choice: நன்மை உண்டாகவும் ... உயிரோடு காக்கவும்
  alternative: நன்மைக்காக ... உயிர்வாழும்படியாக
  rationale: לְ முன்னொட்டுகளின் நோக்க/விளைவு சார்ந்த தொடர்பைத் திறந்தே வைத்துக் கொண்டு, அவை கடவுளின் கட்டளையின் நோக்கங்களாக வாசிக்கப்படும்படி அமைக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசிப்புக்கு எளிமையானதும் மரியாதைமிக்கதும். எபிரேய வாக்கியத்தின் நோக்கத் தொடர்களைத் தக்கவைத்து, கடினமான சொற்சொல் மொழிபெயர்ப்பைத் தவிர்க்கிறது.
