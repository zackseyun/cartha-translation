  source_fidelity: வரைவில் எபிரேய வாக்கியத்தின் முக்கிய கூறுகள் அனைத்தும் உள்ளன. ஆனால் לְיִרְאָה (‘அஞ்சுதல்/பயப்படுதல்’) என்பதற்கு மூலத்தில் இல்லாத ‘நடக்க’ சேர்க்கப்பட்டுள்ளது. இது கீழ்ப்படிதல் என்ற விளக்கத்தைத் தருவதால், நேரடியான சொல்லைத் தேர்வது பாதுகாப்பானது. மேலும் כַּיּוֹם הַזֶּה என்பது உயிரோடு காத்தலுடன் இணைந்த ‘இந்நாளில் இருப்பதுபோல்’ என்ற ஒப்பீட்டைத் தக்கவைக்க வேண்டும்.
