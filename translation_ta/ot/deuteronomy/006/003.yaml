base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/003.yaml
  text: So hear[a], Israel, and be careful to do it, that it may go well with you and that you may multiply greatly, just as Yahweh, the God of your fathers, has spoken to you[b], in a land flowing with milk and honey.
translation:
  language: ta
  text: இஸ்ரவேலே, கேள்; செய்யக் கவனமாயிரு. அப்போது உனக்கு நன்மை உண்டாகும்; உன் பிதாக்களின்[a] தேவனாகிய யாவே உனக்குச் சொன்னபடியே, பாலும் தேனும் வழிந்தோடும் நாட்டில் நீங்கள் மிகவும் பெருகுவீர்கள்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உன் முன்னோர்களின் தேவன்.” எபிரெய மூலத்தில் “உன் பிதாக்கள்” என்று உள்ளது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “உன் பிதாக்களின் தேவனாகிய யாவே, பாலும் தேனும் வழிந்தோடும் ஒரு நாட்டைக் குறித்து உனக்குச் சொன்னபடியே.” எபிரெயச் சொற்றொடர் சுருக்கமாக இருப்பதால், “பாலும் தேனும் வழிந்தோடும் நாடு” என்பது யாவே சொன்னதுடன் இணைத்தும் புரிந்துகொள்ளப்படலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: וְשָׁמַעְתָּ
  choice: கேள்
  rationale: שׁמע என்பதன் அடிப்படைப் பொருளான ‘கேள்’ என்பதைத் தக்கவைக்கிறது; அதைத் தொடர்ந்து வரும் கவனித்துச் செய்தல் என்ற சொற்றொடர் கீழ்ப்படிதலின் நுண்பொருளை வெளிப்படுத்துகிறது.
- source_word: וְשָׁמַרְתָּ לַעֲשׂוֹת
  choice: இவற்றைச் செய்யக் கவனமாயிரு
  rationale: שׁמר + עשה என்ற அமைப்பு கட்டளைகளை விழிப்புடன் கடைப்பிடித்து நடைமுறைப்படுத்துவதைக் குறிக்கிறது. முந்தைய சூழலில் உள்ள கட்டளைகளைக் குறிக்க ‘இவற்றை’ இயல்பான தமிழுக்காகச் சேர்க்கப்பட்டுள்ளது.
- source_word: אֲשֶׁר יִיטַב לְךָ
  choice: அப்போது உனக்கு நன்மை உண்டாகும்
  rationale: உனக்குச் சூழ்நிலை நன்றாக அமையும் என்ற உபாகமத்திற்குரிய நன்மைச்சொற்றொடரை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: וַאֲשֶׁר תִּרְבּוּן מְאֹד
  choice: நீங்கள் மிகவும் பெருகுவீர்கள்
  rationale: רבה இங்கு மக்கள்தொகையில் பெருகுவதைக் குறிக்கிறது; מְאֹד என்பதற்கு ‘மிகவும்’ பயன்படுத்தப்பட்டுள்ளது. எபிரெயத்தில் இங்கு பன்மைக்கு மாறுவது தமிழிலும் காக்கப்பட்டுள்ளது.
- source_word: כַּאֲשֶׁר דִּבֶּר
  choice: சொன்னபடியே
  rationale: முன்னர் உரைக்கப்பட்ட உடன்படிக்கை வார்த்தையைக் குறிக்கிறது; ‘வாக்குறுதி அளித்தபடியே’ என்று விளக்கிப் பொருள் சேர்க்காமல் דִּבֶּר என்பதன் ‘சொன்னார்’ என்ற கருத்தைத் தக்கவைக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: திருநாமமான יהוה-ஐ ஒரு பட்டப்பெயரால் மாற்றாமல், அதன் பொதுவாக ஏற்கப்படும் தமிழ் ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: אֱלֹהֵי אֲבֹתֶיךָ
  choice: உங்கள் பிதாக்களின் தேவன்
  rationale: אבות என்பதன் ஆண்பால் பன்மை வடிவை ‘பிதாக்கள்’ எனத் துல்லியமாகக் காக்கிறது; ‘முன்னோர்கள்’ என்பது இயல்பான மாற்றுப் பொருள் என்பதால் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: לָךְ
  choice: உனக்கு
  rationale: דִּבֶּר என்பதன் மறைமுகச் செயப்படுபொருளைத் தெளிவாகக் காட்டுகிறது; இஸ்ரவேலை ஒருமைக் கூட்டுப்பெயராக அழைக்கும் எபிரெய வடிவத்தையும் காக்கிறது.
- source_word: אֶרֶץ זָבַת חָלָב וּדְבָשׁ
  choice: பாலும் தேனும் வழிந்தோடும் நாடு
  rationale: வாக்குத்தத்த நாட்டை விவரிக்கும் நிலையான உருவகத்தை இயல்பான, மரபுவழித் தமிழில் வழங்குகிறது.
theological_decisions:
- issue: יהוה என்ற இறைதிருநாமத்தை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் தனிப்பட்ட உடன்படிக்கைத் திருநாமம் நேரடியாக உள்ளது; அதை ஒரு பட்டப்பெயராக மாற்றாமல் ஒலிபெயர்ப்பது மூல வேறுபாட்டைக் காக்கிறது.
- issue: אֱלֹהֵי אֲבֹתֶיךָ என்பதிலுள்ள பாலினம் குறித்த உறவுப்பெயர்
  choice: உங்கள் பிதாக்களின் தேவன்
  alternative: உங்கள் முன்னோர்களின் தேவன்
  rationale: மூல எபிரெயம் ‘பிதாக்கள்’ என்ற ஆண்பால் சொல்லைப் பயன்படுத்துவதால் அதை முதன்மை உரையில் காத்து, உள்ளடக்கப் பொருளான ‘முன்னோர்கள்’ என்பதை அடிக்குறிப்பில் அளிக்கிறது.
- issue: இறுதி சொற்றொடரின் சுருக்கமான இலக்கணத் தொடர்பு
  choice: பாலும் தேனும் வழிந்தோடும் நாட்டில் நீங்கள் மிகவும் பெருகுவீர்கள்
  alternative: பாலும் தேனும் வழிந்தோடும் ஒரு நாட்டைப் பற்றி யாவே உனக்குச் சொன்னபடியே
  rationale: எபிரெயத் தொடர் சுருக்கமாக இருப்பதால் ‘நாடு’ என்பது பெருகுதல் நிகழும் இடத்தையோ, யாவே சொன்னதன் விளக்கத்தையோ குறிக்கலாம். முதன்மை உரை இயல்பான இடப்பொருள் தொடர்பைத் தேர்ந்தெடுக்கிறது; மாற்று அமைப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகருக்குப் புரியும் கண்ணியமான நடையைக் கொண்டுள்ளது. ‘இஸ்ரவேலே’ என்ற நேரடி அழைப்பு மற்றும் எபிரெய மூலத்திலுள்ள ஒருமையிலிருந்து பன்மைக்கு நிகழும் மாறுதல் திட்டமிட்டே காக்கப்பட்டுள்ளன. ‘பிதாக்கள்’ மூலத்தின் பாலினக் குறிப்பைத் தக்கவைக்கிறது; ‘முன்னோர்கள்’ அடிக்குறிப்பில் வழங்கப்படுகிறது.
