base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/005.yaml
  text: And you shall love Yahweh your God with all your heart and with all your soul and with all your might[a][b].
translation:
  language: ta
  text: உன் கடவுளாகிய யாவேவை உன் முழு இருதயத்தோடும், உன் முழு ஆத்துமாவோடும்[a], உன் முழு வலிமையோடும்[b] அன்புகூர வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ஆத்துமா’ என்பதற்கான எபிரேயச் சொல் (நெஃபெஷ்) ‘உயிர்’ அல்லது ‘தன்னையே’ என்றும் பொருள்படலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘வலிமை’ என்பதற்கான எபிரேயச் சொல் (மெஓத்) சொல்லடிப்படையில் ‘மிகுதி’ என்பதோடு தொடர்புடையது; அது ஆற்றல், தீவிரம் அல்லது வளங்களையும் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָהַבְתָּ
  choice: அன்புகூர வேண்டும்
  rationale: இணைப்புச் சொல்லுடன் வரும் Qal perfect இரண்டாம் நபர் ஆண்பால் ஒருமை வடிவம், இந்த உடன்படிக்கை சார்ந்த அறிவுறுத்தல் சூழலில் கட்டளையின் வலிமையைக் கொண்டுள்ளது. நவீன தமிழில் ‘அன்புகூர வேண்டும்’ இயல்பாக அந்தக் கட்டாயத்தைக் காட்டுகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இது ஒரு பட்டம் அல்ல, இஸ்ரவேலின் கடவுளுடைய தனிப்பெயரைக் குறிக்கும் நான்கெழுத்துத் திருப்பெயர். ஆகவே ‘கர்த்தர்’ போன்ற பதிலீட்டுப் பட்டத்துக்குப் பதிலாக ஒலிபெயர்ப்பு பயன்படுத்தப்படுகிறது.
- source_word: אֱלֹהֶיךָ
  choice: உன் கடவுளாகிய
  rationale: வடிவத்தில் பன்மையாக இருந்தாலும், இங்கு ஒருமையான இஸ்ரவேலின் கடவுளையே குறிக்கிறது. தமிழில் யாவேவுக்கும் ‘உன் கடவுள்’ என்பதற்கும் உள்ள அடையாள உறவை ‘ஆகிய’ இயல்பாக இணைக்கிறது.
- source_word: בְּכָל
  choice: உன் முழு …த்தோடும்
  rationale: மூன்று முறை திரும்ப வரும் בְּכָל முழுமையான அர்ப்பணிப்பை வலியுறுத்துகிறது. ‘முழு …த்தோடும்’ என்ற அமைப்பு அதன் மீளுரையையும் மொத்தத்தன்மையையும் தமிழில் காக்கிறது.
- source_word: לְבָבְךָ
  choice: உன் முழு இருதயத்தோடும்
  rationale: לֵבָב உணர்ச்சிகளை மட்டும் அல்லாமல் சிந்தனை, சித்தம் உள்ளிட்ட அகமனிதனையும் குறிக்கலாம். ‘இருதயம்’ அந்த விரிவைச் சுருக்காமல் காக்கும் மதிப்புமிக்க, பரவலாகப் புரியக்கூடிய சொல்.
- source_word: נַפְשְׁךָ
  choice: உன் முழு ஆத்துமாவோடும்
  rationale: נֶפֶשׁ ஆத்துமா, உயிர், தன்னையே அல்லது உயிருள்ள நபரை குறிக்கலாம். ‘ஆத்துமா’ மரபாக அறியப்பட்ட சொல்லாக இருந்தாலும், அதன் விரிந்த எபிரேயப் பொருள் அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
- source_word: מְאֹדֶךָ
  choice: உன் முழு வலிமையோடும்
  rationale: מְאֹד அடிப்படையில் ‘மிகுதி/மிகவும்’ என்பதுடன் தொடர்புடையது; இங்கு பெயர்ச்சொல் போல் பயன்படுத்தப்பட்டு ஒருவரின் முழுத் திறன், ஆற்றல் அல்லது வளத்தைக் குறிக்கலாம். ‘வலிமை’ இயல்பான தமிழ் இணை; விரிந்த பொருள் அடிக்குறிப்பில் காக்கப்படுகிறது.
theological_decisions:
- issue: יְהוָה என்ற திருப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலம் தெய்வீகத் தனிப்பெயரையே நேரடியாகக் கொண்டுள்ளது. பட்டத்தால் மாற்றாமல் ‘யாவே’ என்று ஒலிபெயர்ப்பது உடன்படிக்கைப் பெயரின் தனித்தன்மையைப் பாதுகாக்கிறது.
- issue: கடவுளிடம் அன்புகூரும் கட்டளையிலுள்ள மனித இயல்பைக் குறிக்கும் சொற்கள்
  choice: இருதயம் … ஆத்துமா … வலிமை
  alternative: உள்ளம் … உயிர் … ஆற்றல்; மனம் … தன்னையே … உடைமைகள்
  rationale: எபிரேயச் சொற்கள் நவீன உளவியல் பிரிவுகளாகத் தெளிவாகப் பிரிக்கப்படாமல், முழு மனிதரைக் குறிக்கும் ஒன்றோடொன்று மேலிடும் சொற்களாக உள்ளன. அவற்றைச் செயற்கையாகத் தனித்தனி உறுப்புகளாக்காமல் மூலத்தின் முழுமையான வலியுறுத்தலும் பொருள் நெகிழ்வும் காக்கப்படுகின்றன.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்கள் புரிந்துகொள்ளும் வகையிலும் வேதாகம உரைக்கு ஏற்ற கண்ணியமான நடையிலும் வடிவமைக்கப்பட்டது. ஒருமை இரண்டாம் நபரான ‘உன்’ மூலத்துக்கு ஏற்ப தொடர்ந்து வைக்கப்பட்டுள்ளது. ‘முழு …த்தோடும்’ என்ற மும்முறை அமைப்பு எபிரேயத்தின் வலியுறுத்தும் இணைநிலையைப் பாதுகாக்கிறது.
