source:
  edition: WLC
  text: לֹ֣א תְנַסּ֔וּ אֶת יְהוָ֖ה אֱלֹהֵי/כֶ֑ם כַּ/אֲשֶׁ֥ר נִסִּיתֶ֖ם בַּ/מַּסָּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/016.yaml
  text: You shall not test Yahweh your God[b][a], as you tested him at Massah.
translation:
  language: ta
  text: மாசாவில்[a] நீங்கள் அவரைச் சோதித்ததுபோல், உங்கள் கடவுளாகிய யாவேவைச் சோதிக்காதீர்கள்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: மாசா என்பது வனாந்தரத்தில் இஸ்ரவேலர் யாவேவைச் சோதித்த இடம் (யாத்திராகமம் 17:1–7); அந்தப் பெயர் ‘சோதித்தல்’ என்ற பொருளுடன் தொடர்புடையது.
    reason: cross_reference
  - marker: b
    text: அல்லது, ‘உங்கள் கடவுளாகிய யாவேவைச் சோதனைக்கு உட்படுத்தாதீர்கள்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא
  choice: சோதிக்காதீர்கள் என்பதில் உள்ள ‘ஆதீர்கள்’
  rationale: இது தடை விதிக்கும் மறுப்பை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: תְנַסּוּ
  choice: சோதிக்காதீர்கள்
  rationale: נסה என்ற வினையின் பியேல் வடிவம் இங்கு கடவுளைச் சோதனைக்கு உட்படுத்துவதைத் தடை செய்கிறது; ‘சோதித்தல்’ என்பது சுருக்கமானதும் அடுத்துள்ள அதே வேர்ச்சொல்லுடனான தொடர்பைக் காப்பதும் ஆகும்.
- source_word: יְהוָה
  choice: யாவே
  rationale: திருநான்கெழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், எபிரெய தனிப்பெயரின் பரவலாக ஏற்கப்பட்ட உச்சரிப்பைத் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: אֱלֹהֵיכֶם
  choice: உங்கள் கடவுளாகிய
  rationale: இரண்டாம் நபர் பன்மை உடைமைப் பின்னொட்டைத் தெளிவாகக் காட்டி, தமிழில் யாவே என்ற பெயருடன் இயல்பாக இணைக்கிறது.
- source_word: כַּאֲשֶׁר
  choice: …போல்
  rationale: முந்தைய வரலாற்றுச் செயலுடன் செய்யப்படும் ஒப்பீட்டை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: נִסִּיתֶם
  choice: நீங்கள் அவரைச் சோதித்த
  rationale: נסה என்ற அதே வேர்ச்சொல்லை ‘சோதித்த’ என்று மீண்டும் வழங்கி, கட்டளைக்கும் கடந்த நிகழ்வுக்கும் உள்ள சொல்லியல் தொடர்பைக் காக்கிறது; தமிழில் தேவைப்படும் பொருள் சுட்டுப்பெயராக ‘அவரை’ சேர்க்கப்பட்டுள்ளது.
- source_word: בַּמַּסָּה
  choice: மாசாவில்
  rationale: மாசா என்பது இடப்பெயர் என்பதால் முதன்மை உரையில் மொழிபெயர்க்காமல் ஒலிபெயர்க்கப்பட்டுள்ளது; இடத்தைக் குறிக்கும் בְּ முன்னொட்டு ‘-வில்’ என வழங்கப்பட்டுள்ளது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரை வழங்குதல்
  choice: யாவே
  alternative: ஆண்டவர்; யெகோவா
  rationale: மூல உரை தனிப்பெயரையே பயன்படுத்துவதால் அதை ஒரு பட்டமாக மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
- issue: யாத்திராகமம் 17-ஐக் குறிக்கும் மாசா என்ற பெயரை முதன்மை உரையில் விளக்க வேண்டுமா
  choice: மாசா என்ற இடப்பெயரை அப்படியே வைத்து, விளக்கத்தை அடிக்குறிப்பில் தருதல்
  alternative: சோதனை செய்த இடத்தில்; சோதனையின் இடமாகிய மாசாவில்
  rationale: எபிரெய உரை இடப்பெயரை மட்டுமே தருகிறது. பெயரின் பொருளையும் வரலாற்றுப் பின்னணியையும் முதன்மை உரையில் சேர்ப்பது மூலத்தைவிட விரிவாக்கமாகிவிடும்.
translation_notes:
  register: நவீன பொதுத்தமிழில் புரியக்கூடிய, மரியாதையும் கண்ணியமும் கொண்ட பன்மை கட்டளை நடை பயன்படுத்தப்பட்டுள்ளது. எபிரெயத்தில் வரும் இரு נסה வடிவங்களுக்கும் ‘சோதித்தல்’ என்ற ஒரே தமிழ்ச் சொல் பயன்படுத்தப்பட்டு சொல்லியல் இணைப்பு காக்கப்பட்டுள்ளது. இயல்பான தமிழ் வாக்கிய ஓட்டத்திற்காக வரலாற்று ஒப்பீட்டுத் தொடர் முதலில் வைக்கப்பட்டுள்ளது.
