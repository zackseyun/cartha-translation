revisions:
- from: நம் கடவுளாகிய யாவே நமக்குக் கட்டளையிட்டபடியே, அவருக்கு முன்பாக இந்தக் கட்டளை முழுவதையும்[b] செய்ய நாம் கவனமாக இருந்தால், அது நமக்கு நீதியாக இருக்கும்[a].
