base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/025.yaml
  text: And it will be righteousness for us if we are careful to do all this commandment before Yahweh our God[b][a], as he has commanded us.
translation:
  language: ta
  text: நம் கடவுளாகிய யாவே நமக்குக் கட்டளையிட்டபடியே, நம் கடவுளாகிய யாவேக்கு முன்பாக இந்தக் கட்டளை முழுவதையும் செய்ய நாம் கவனமாக இருந்தால், அது நமக்கு நீதியாக இருக்கும்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அது நமக்குச் சரியானதாக இருக்கும்.’ எபிரெயச் சொல் நீதியானது அல்லது சரியானது என்பதைக் குறிக்கலாம்; இங்கு ‘நீதி’ உடன்படிக்கைச் சூழலுக்கு நன்றாகப் பொருந்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּצְדָקָה
  choice: நீதியாக
  rationale: צְדָקָה என்பது சரியானது, நீதியானது, நேர்மையான நிலை ஆகிய பொருள் வளையங்களைக் கொண்டது. உடன்படிக்கைச் சூழலில் உள்ள ஒழுக்க மற்றும் உறவுசார் அழுத்தத்தைத் தக்கவைத்து, பின்னாளைய தொழில்நுட்ப இறையியல் கருத்தைச் சேர்க்காமல் இருக்க ‘நீதியாக’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: תִּהְיֶה לָּנוּ
  choice: அது நமக்கு ... இருக்கும்
  rationale: எபிரெயத்தின் இருப்பு/பயனிலை அமைப்பை இயல்பான தமிழில் காட்டுகிறது; ‘நமக்குக் கணக்கிடப்படும்’ போன்ற மூலத்தில் வெளிப்படையாக இல்லாத கருத்தைச் சேர்ப்பதில்லை.
- source_word: כִּי
  choice: '... இருந்தால்'
  rationale: இங்கு כִּי முன் கூறப்பட்ட முடிவுக்கான நிபந்தனையை அறிமுகப்படுத்துகிறது. தமிழில் ‘இருந்தால்’ இயல்பாக அந்த நிபந்தனைப் பொருளைக் காட்டுகிறது.
- source_word: נִשְׁמֹר לַעֲשׂוֹת
  choice: செய்ய நாம் கவனமாக இருந்தால்
  rationale: שׁמר என்பதிலுள்ள விழிப்புடனும் அக்கறையுடனும் காத்துக் கடைப்பிடிக்கும் நுணுக்கத்தையும், עשה என்பதன் ‘செய்’ என்ற அடிப்படைப் பொருளையும் இரண்டையும் தக்கவைக்கிறது.
- source_word: כָּל הַמִּצְוָה הַזֹּאת
  choice: இந்தக் கட்டளை முழுவதையும்
  rationale: ஒருமையில் வரும் מִצְוָה-வை ‘கட்டளை’ என்று தக்கவைத்து, כָּל குறிப்பிடும் முழுமையை இயல்பான தமிழ்ச் சொற்றொடரில் வெளிப்படுத்துகிறது.
- source_word: לִפְנֵי
  choice: அவருக்கு முன்பாக
  rationale: கடவுளின் முன்னிலையிலும் அவரது பார்வைக்குக் கீழும் கீழ்ப்படிதல் நடைபெறுகிறது என்ற உடன்படிக்கைச் சாயலைத் தக்கவைக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைப் பெயரான நான்கெழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் ஒலிபெயர்த்துக் காட்டுகிறது.
- source_word: אֱלֹהֵינוּ
  choice: நம் கடவுளாகிய
  rationale: ‘நம் கடவுள்’ என்ற உடன்படிக்கை உறவைத் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: כַּאֲשֶׁר צִוָּנוּ
  choice: நமக்குக் கட்டளையிட்டபடியே
  rationale: முன்னரே கொடுக்கப்பட்ட தெய்வீகக் கட்டளையோடு தற்போதைய கீழ்ப்படிதலை இணைக்கும் நிறைவுற்ற செயலை இயல்பான தமிழில் காட்டுகிறது.
theological_decisions:
- issue: உடன்படிக்கைக்குக் கீழ்ப்படிதலின் சூழலில் ‘நீதி’ என்பதன் பொருள்
  choice: அத்தகைய கீழ்ப்படிதல் ‘நமக்கு நீதியாக இருக்கும்’ என்று வசனம் கூறுவதை அப்படியே தக்கவைத்தல்
  alternative: அது தொழில்நுட்பமான சட்டவியல் அர்த்தத்தில் ‘நமக்குக் கணக்கிடப்படும் நீதி’ என்று விளக்குதல், அல்லது அதைச் சமூக ‘நியாயம்’ என்று மட்டும் குறுக்குதல்
  rationale: எபிரெய உரை உடன்படிக்கைக்குக் கீழ்ப்படிதலுக்கும் நீதிக்கும் உண்மையான தொடர்பை உறுதிப்படுத்துகிறது; ஆனால் அந்தத் தொடர்பின் பிற்கால இறையியல் செயல்முறையை விவரிக்கவில்லை. ஆகவே மொழிபெயர்ப்பு அந்த இறையியல் அழுத்தத்தையும் தெளிவின்மையையும் தீர்த்துவிடாமல் காக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் வேதாகம உரைக்கேற்ற கண்ணியமான நடையிலும் மொழிபெயர்க்கப்பட்டது. எபிரெயச் சொல் வரிசையை அப்படியே பின்பற்றாமல் இயல்பான தமிழ்ச் சொல் வரிசை பயன்படுத்தப்பட்டுள்ளது; இருப்பினும் ஒருமை ‘கட்டளை,’ நிபந்தனை, தெய்வீகப் பெயர், மற்றும் ‘நமக்கு நீதியாக இருக்கும்’ என்ற இறையியல் அழுத்தம் பாதுகாக்கப்பட்டுள்ளன.
