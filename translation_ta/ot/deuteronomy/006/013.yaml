base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/013.yaml
  text: You shall fear Yahweh your God[a], and him you shall serve[b], and by his name you shall swear.
translation:
  language: ta
  text: உன் கடவுளாகிய யாவேக்கு நீ பயப்பட வேண்டும்[a]; அவரையே நீ சேவிக்க வேண்டும்[b]; அவருடைய பெயரால் நீ சத்தியம் செய்ய வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உன் கடவுளாகிய யாவேக்குப் பயபக்தியுடன் இருக்க வேண்டும்.” எபிரெய வினைச்சொல் வெறும் திகிலை மட்டுமல்ல, பயபக்தியையும் வியப்பையும் உள்ளடக்குகிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அவரையே நீ வழிபட வேண்டும்.” எபிரெய வினைச்சொல் பொதுவாக ‘சேவித்தல்’ என்று பொருள்படும்; இச்சூழலில் வழிபாட்டுடன் கூடிய சேவையையும் உள்ளடக்குகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைவனின் தனிப்பட்ட பெயராகிய நான்கு எழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் இயல்பான ஒலிபெயர்ப்பாகத் தருகிறது.
- source_word: אֱלֹהֶיךָ
  choice: உன் கடவுளாகிய
  rationale: இரண்டாம் நபர் ஒருமை ஆண்பால் உடைமைப் பின்னொட்டைத் தக்கவைத்து, யாவே என்ற பெயருடன் இயல்பான தமிழ்த் தொடரை உருவாக்குகிறது.
- source_word: תִּירָא
  choice: நீ பயந்து நடக்க வேண்டும்
  rationale: எபிரெயச் சொல் கொண்டுள்ள பயபக்தி, அச்சம், கீழ்ப்படிதல் ஆகிய பரப்பை வெறும் ‘மதிக்க வேண்டும்’ என்று குறுக்காமல், நவீன தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וְאֹתוֹ
  choice: அவரையே
  rationale: வெளிப்படையான நேர்செயப்படுபொருள் சுட்டுப்பெயரின் வலியுறுத்தலை ‘-ஏ’ மூலம் தக்கவைக்கிறது; வசனத்தில் வெளிப்படையாக இல்லாத ‘மட்டும்’ என்பதைச் சேர்க்கவில்லை.
- source_word: תַעֲבֹד
  choice: நீ சேவிக்க வேண்டும்
  rationale: עבד என்பதன் அடிப்படைப் பொருளான சேவித்தலைத் தக்கவைத்து, சூழலில் உள்ள வழிபாட்டுச் சேவையின் உட்பொருளையும் திறந்துவைக்கிறது.
- source_word: וּבִשְׁמוֹ
  choice: அவருடைய பெயரால்
  rationale: ஆணையிடும் சூழலில் ב என்பது அழைக்கப்படும் பெயரின் அடிப்படை அல்லது அதிகாரத்தைக் குறிக்கும் கருவிப் பொருளில் இயல்பாக ‘பெயரால்’ என மொழிபெயர்க்கப்படுகிறது.
- source_word: תִּשָּׁבֵעַ
  choice: நீ ஆணையிட வேண்டும்
  rationale: שׁבע என்பதன் நிபால் வடிவம் சத்தியம் செய்தல் அல்லது ஆணையிடுதலைக் குறிக்கிறது; இங்கு ‘பெயரால் ஆணையிடுதல்’ தமிழில் தெளிவானதும் கண்ணியமானதும் ஆகும்.
- source_word: אֶת
  choice: தனியாக மொழிபெயர்க்கப்படவில்லை
  rationale: இது எபிரெய மொழியின் நேர்செயப்படுபொருள் குறியீடு; அதன் இலக்கணப் பணி தமிழ்த் தொடரமைப்பில் வெளிப்படுகிறது.
theological_decisions:
- issue: கடவுளுக்குரிய பதிலை ‘பயம்’ என்று தருவதா, ‘பயபக்தி/மதிப்பு’ என்று மென்மைப்படுத்துவதா
  choice: ‘பயந்து நடக்க வேண்டும்’ என்பதை முதன்மை உரையில் தக்கவைத்தல்
  alternative: ‘பயபக்தியுடன் இருக்க வேண்டும்’ அல்லது ‘போற்ற வேண்டும்’
  rationale: இச்சொல் வெறும் திகிலை அல்ல, பயபக்தி, ஆச்சரியம், கீழ்ப்படிதல் ஆகியவற்றை உள்ளடக்குகிறது. ‘பயம்’ என்ற கூறை நீக்குவது உடன்படிக்கைக் கட்டளையின் தீவிரத்தைக் குறுக்கும்; ‘நடக்க’ என்பது தமிழில் அது வெறும் உணர்ச்சி அல்ல, வாழ்வின் நிலைப்பாடு என்பதைக் காட்டுகிறது.
- issue: עבד என்பதை ‘சேவித்தல்’ அல்லது ‘வழிபடுதல்’ என மொழிபெயர்ப்பது
  choice: ‘சேவிக்க வேண்டும்’
  alternative: ‘வழிபட வேண்டும்’
  rationale: ‘சேவை’ மூலச்சொல்லின் பரந்த பொருளையும் உடன்படிக்கை விசுவாசம் செயலாக வெளிப்படுவதையும் காக்கிறது; வழிபாட்டின் உட்பொருளை மறுப்பதில்லை, ஆனால் அதைச் சடங்கு சார்ந்த குறுகிய பொருளாக மாற்றுவதில்லை.
- issue: וְאֹתוֹ என்பதில் தனித்தன்மையை வெளிப்படுத்த ‘அவரை மட்டுமே’ என்று சேர்ப்பதா
  choice: ‘அவரையே’
  alternative: ‘அவரை மட்டுமே’
  rationale: சூழல் யாவேக்கே உரிய முழு விசுவாசத்தை உணர்த்தினாலும், ‘மட்டும்’ என்ற தனிச் சொல் இவ்வசனத்தில் வெளிப்படையாக இல்லை. ‘அவரையே’ எபிரெய வலியுறுத்தலைக் காக்கிறது; உரையில் இல்லாத சொல்லைச் சேர்ப்பதைத் தவிர்க்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், ஒருமை உடன்படிக்கை அழைப்பை ‘உன்/நீ’ எனத் தக்கவைத்துள்ளோம். இறைவனைக் குறிக்கும் சுட்டுப்பெயரில் மரியாதைப் பன்மை (‘அவர்’) பயன்படுத்தப்பட்டுள்ளது. கட்டளையின் எபிரெய வடிவை இயல்பான தமிழில் ‘வேண்டும்’ என வழங்கி, மூன்று இணைநிலை வாக்கியங்களின் வலிமையைப் பேணியுள்ளோம்.
