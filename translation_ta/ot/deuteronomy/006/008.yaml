base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/008.yaml
  text: And you shall bind them as a sign on your hand[a], and they shall be as frontlets between your eyes.
translation:
  language: ta
  text: அவற்றை உன் கையின்மேல் ஓர் அடையாளமாகக் கட்டிக்கொள்; அவை உன் கண்களுக்கு இடையில் நெற்றிப்பட்டைகளாக[a] இருக்கட்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தெஃபிலீன்கள்.” இது பிற்கால யூத நடைமுறையில் அணியப்பட்ட சிறிய பெட்டிகளைக் குறிக்கும் மரபுவழி விளக்கமாகும். எபிரெயச் சொல் அரிதானது; அது நெற்றியில் அணியும் பட்டைகள் அல்லது அணிகலன்களைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּקְשַׁרְתָּם
  choice: அவற்றை ... கட்டிக்கொள்
  rationale: கால் வினை வடிவம் அறிவுறுத்தல் தொடரில் கட்டளையின் வலிமையுடன் வருகிறது. மூன்றாம் நபர் பன்மை பின்னொட்டு முந்தைய சூழலில் உள்ள வார்த்தைகளைக் குறிக்கும் என்பதால் ‘அவற்றை’ வெளிப்படையாக வைக்கப்பட்டது.
- source_word: לְאוֹת
  choice: ஓர் அடையாளமாக
  rationale: אוֹת என்பதன் இயல்பான பொருள் ‘அடையாளம்’ அல்லது ‘குறி.’ இங்குள்ள לְ வகிக்கும் நிலை/பயனைக் காட்டுவதால் ‘அடையாளமாக’ பொருத்தமானது.
- source_word: עַל יָדֶךָ
  choice: உன் கையின்மேல்
  rationale: יָד சில இடங்களில் முன்கையையும் குறிக்கக்கூடும்; எனினும் அதன் நேரடியான பொருளான ‘கை’ இங்கு தக்கவைக்கப்பட்டது.
- source_word: וְהָיוּ
  choice: அவை ... இருக்கட்டும்
  rationale: இது அறிவுறுத்தல் தொடரைத் தொடர்ந்து கொண்டுசெல்கிறது. தமிழில் ‘இருக்கட்டும்’ கட்டளையின் தன்மையை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: לְטֹטָפֹת
  choice: நெற்றிப்பட்டைகளாக
  rationale: טֹטָפֹת அரிதான சொல்; நெற்றிப் பகுதியில் அணியப்படும் பட்டை அல்லது அணிகலன் என்பது பொதுவான புரிதல். பிற்கால யூத வழக்கின் குறிப்பிட்ட பொருளை முதன்மை உரைக்குள் புகுத்தாமல், இடத்தையும் வடிவத்தையும் உணர்த்த ‘நெற்றிப்பட்டைகள்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: בֵּין עֵינֶיךָ
  choice: உன் கண்களுக்கு நடுவே
  rationale: எபிரெய மொழித்தொடரின் நேரடியான உருவகம் தக்கவைக்கப்படுகிறது. ‘உன் நெற்றியில்’ என்று மாற்றுவது விளக்கவுரையாகி விடும்.
theological_decisions:
- issue: இந்தக் கட்டளை உடலில் நேரடியாகச் செய்ய வேண்டிய நடைமுறையா, நினைவில் நிலைநிறுத்துவதற்கான உருவகமா, அல்லது இரண்டுமா?
  choice: உடலைச் சார்ந்த தெளிவான உருவகத்தைத் தக்கவைத்து, கேள்வியைத் தீர்மானிக்காமல் விடுதல்
  alternative: இதை நிலையான நினைவுக்கான உருவகமாக மட்டும் மொழிபெயர்த்தல், அல்லது பிற்காலத் திஃபிலீன் வழக்கை நேரடியாகக் குறிப்பிடுதல்
  rationale: எபிரெய உரை கை மற்றும் கண்களுக்கு இடைப்பட்ட பகுதி என்ற தெளிவான உடல் உருவகத்தைப் பயன்படுத்துகிறது. மொழிபெயர்ப்பு அதன் நேரடி, உருவகச் சாத்தியங்கள் இரண்டையும் திறந்தவையாக வைத்திருக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில், ஒருமை முன்னிலையைத் தொடர்ந்து பயன்படுத்தும் மரியாதைமிக்க வேதாகம நடையில் மொழிபெயர்க்கப்பட்டது. எபிரெயத்தின் இணை அமைப்பும் உடல் சார்ந்த உருவகமும் இயன்றவரை பாதுகாக்கப்பட்டன.
