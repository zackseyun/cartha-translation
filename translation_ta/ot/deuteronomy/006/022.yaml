- from: யெகோவா எகிப்தில்[a] பார்வோனுக்கும் அவனுடைய குடும்பத்தார் அனைவருக்கும் எதிராகப் பெரியதும் பேரழிவு விளைவிப்பதுமான அடையாளங்களையும் அற்புதங்களையும் எங்கள் கண்முன்னே நிகழச் செய்தார்.
