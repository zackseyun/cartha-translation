  text: וַ/יִּתֵּ֣ן יְהוָ֡ה אוֹתֹ֣ת וּ֠/מֹפְתִים גְּדֹלִ֨ים וְ/רָעִ֧ים בְּ/מִצְרַ֛יִם בְּ/פַרְעֹ֥ה וּ/בְ/כָל בֵּית֖/וֹ לְ/עֵינֵֽי/נוּ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/022.yaml
  text: And Yahweh gave great and grievous signs and wonders in Egypt[a], against Pharaoh and against all his house[b], before our eyes.
translation:
  language: ta
  text: யாவே எகிப்தில்[a] பெரியதும் பேரழிவு விளைவிப்பதுமான அடையாளங்களையும் அற்புதங்களையும் பார்வோன்மீதும் அவனுடைய வீட்டார் அனைவர்மீதும் எங்கள் கண்முன்னே நிகழச் செய்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எகிப்துக்கு எதிராக.” இங்குள்ள எபிரெய முன்னிடைச்சொல் இடத்தைக் குறிக்கவும், தீர்ப்புச் செயல்களின் இலக்கைக் குறிக்கவும் முடியும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: நிகழச் செய்தார்
  rationale: נתן என்பதன் அடிப்படைப் பொருள் ‘கொடுத்தார்/வைத்தார்’ என்றாலும், ‘அடையாளங்களையும் அற்புதங்களையும் கொடுத்தார்’ என்பது இன்றைய தமிழில் இயல்பாக இல்லை. இந்தச் சூழலில் செயல்களை ஏற்படுத்தினார் என்ற எபிரெய மரபுத்தொடரின் பொருளை ‘நிகழச் செய்தார்’ இயல்பாகத் தெரிவிக்கிறது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: நான்கு எழுத்துகளாலான இறைப்பெயரை ஒரு பட்டப்பெயரால் மாற்றாமல், தமிழில் பரவலாக அறியப்பட்ட ஒலிபெயர்ப்பான ‘யெகோவா’ என வழங்குகிறது.
- source_word: אוֹתֹת וּמֹפְתִים
  choice: அடையாளங்களையும் அற்புதங்களையும்
  rationale: 'இணைச்சொற்களின் வேறுபாட்டைக் காக்கிறது: אותות என்பது அர்த்தம் சுட்டும் அடையாளங்கள்; מפתים என்பது வியப்பூட்டும் அற்புதச் செயல்கள்.'
- source_word: גְּדֹלִים וְרָעִים
  choice: பெரியதும் பேரழிவு விளைவிப்பதுமான
  rationale: גדלים அளவு மற்றும் வல்லமையைச் சுட்டுகிறது. רעים இங்கு ஒழுக்கத் தீமையை அல்ல, எகிப்தின்மீது ஏற்பட்ட தீங்கையும் கடுமையான விளைவையும் குறிக்கிறது; ‘பேரழிவு விளைவிப்பதுமான’ என்பது அந்தத் தீவிரத்தைத் தெளிவாக்குகிறது.
- source_word: בְּמִצְרַיִם
  choice: எகிப்தில்
  rationale: ב என்ற முன்னிடைச்சொல்லின் நேரடியான இடப்பொருளை இங்கு காக்கிறது. தொடரும் பார்வோன் மற்றும் அவனுடைய குடும்பம் பற்றிய சொற்றொடர்கள் இலக்குகளாகப் புரிந்துகொள்ளப்படலாம்.
- source_word: בְּפַרְעֹה וּבְכָל־בֵּיתוֹ
  choice: பார்வோனுக்கும் அவனுடைய குடும்பத்தார் அனைவருக்கும் எதிராக
  rationale: இங்கு ב என்பது அடையாளங்களும் அற்புதங்களும் தாக்கிய இலக்கைச் சுட்டுகிறது. ביתו என்பதை கட்டடமாக அல்லாமல் பார்வோனின் குடும்பத்தார் அல்லது வீட்டார் என்ற சமூகப் பொருளில் மொழிபெயர்க்கிறது.
- source_word: לְעֵינֵינוּ
  choice: எங்கள் கண்முன்னே
  rationale: ‘எங்கள் கண்களுக்கு முன்பாக’ என்ற எபிரெய மரபுத்தொடரின் நேரடியான சாட்சி உணர்வை இயல்பான தமிழில் தருகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழியாக்கம்
  choice: யெகோவா
  alternative: யாவே; கர்த்தர்
  rationale: மூலத்தில் தனிப்பட்ட இறைப்பெயர் நேரடியாக உள்ளது. அதை ‘கர்த்தர்’ என்ற பட்டப்பெயரால் மாற்றாமல் ஒலிபெயர்க்கிறது. எபிரெய உயிரொலிப்பின் துல்லியம் உறுதியற்றதால் மாற்று ஒலிபெயர்ப்பு அடிக்குறிப்பில் தரப்படுகிறது.
- issue: וְרָעִים என்பது இறைச்செயல்களை விவரிக்கும் விதம்
  choice: பேரழிவு விளைவிப்பதுமான
  alternative: கொடுமையான; தீங்கான; தீய
  rationale: இந்தச் சொல் செயல்களின் அழிவூட்டும் விளைவைக் குறிக்கிறது. ‘தீய’ என்பது கடவுளுக்கே ஒழுக்கத் தீமையைச் சுமத்துவது போலத் தவறாகப் புரியக்கூடும்; அதேவேளையில் மூலத்தின் கடுமையைத் தணிக்காமல் ‘பேரழிவு விளைவிப்பதுமான’ என வழங்கப்படுகிறது.
- issue: בְּמִצְרַיִם என்பதிலுள்ள ב முன்னிடைச்சொல்லின் பொருள்
  choice: எகிப்தில்
  alternative: எகிப்துக்கு எதிராக
  rationale: இடப்பொருளும் இலக்குப் பொருளும் சாத்தியம். முதல் சொற்றொடரில் நேரடியான இடப்பொருளை முதன்மை உரையில் காத்து, மாற்றுப் பொருளை அடிக்குறிப்பில் பதிவு செய்வது உண்மையான தெளிவின்மையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான உரை. ‘பார்வோன்’ மற்றும் ‘அடையாளங்களும் அற்புதங்களும்’ போன்ற பரவலாகப் புரியும் வேதாகமச் சொற்கள் வைக்கப்பட்டுள்ளன. ‘குடும்பத்தார்’ என்பது בית என்பதன் இங்குள்ள கூட்டுச் சமூகப் பொருளைத் தெளிவாகத் தருகிறது; மூலத்தின் முன்னிடைச்சொல் தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
