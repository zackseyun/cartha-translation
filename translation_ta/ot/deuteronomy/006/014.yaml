source:
  edition: WLC
  text: לֹ֣א תֵֽלְכ֔וּ/ן אַחֲרֵ֖י אֱלֹהִ֣ים אֲחֵרִ֑ים מֵ/אֱלֹהֵי֙ הָֽ/עַמִּ֔ים אֲשֶׁ֖ר סְבִיבוֹתֵי/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/014.yaml
  text: You shall not go after other gods[a], the gods of the peoples who are around you.
translation:
  language: ta
  text: உங்களைச் சுற்றியுள்ள மக்களினங்களின் தெய்வங்களுள் வேறு தெய்வங்களைப் பின்பற்றாதீர்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இதை விளக்கமான முறையில், “வேறு தெய்வங்களை, அதாவது உங்களைச் சுற்றியுள்ள மக்களினங்களின் தெய்வங்களைப் பின்பற்றாதீர்கள்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא תֵלְכוּן אַחֲרֵי
  choice: பின்பற்றாதீர்கள்
  rationale: הלך אחרי என்பது இங்கு வெறுமனே உடலால் பின்னால் செல்வதை அல்ல, ஒருவரை அல்லது ஒன்றைச் சார்ந்து அதன் வழியில் செல்வதைக் குறிக்கும் மரபுத்தொடர். தமிழில் ‘பின்பற்றாதீர்கள்’ என்பது தடை, பற்றுறுதி, வழிபாட்டுச் சார்பு ஆகிய நுணுக்கங்களை இயல்பாகத் தருகிறது.
- source_word: אֱלֹהִים אֲחֵרִים
  choice: வேறு தெய்வங்களை
  rationale: இஸ்ரவேலின் தேவனைத் தவிர்ந்த தெய்வங்களை நேரடியாகக் குறிக்கிறது. ‘அந்நிய தெய்வங்கள்’ என்பதில் மூலத்தில் வெளிப்படையாக இல்லாத வெளிநாட்டுத்தன்மை சேரக்கூடும்; ஆகவே ‘வேறு தெய்வங்கள்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: מֵאֱלֹהֵי הָעַמִּים
  choice: மக்களின் தெய்வங்களில்
  rationale: מִן முன்னொட்டு இங்கு தொகுதியிலிருந்து எடுத்துரைக்கும் பகுதியியல் பொருளில் புரிந்துகொள்ளப்படலாம். ‘தெய்வங்களில்’ என்பது அந்த எபிரெயக் கட்டமைப்பைச் சுருக்கமாகப் பாதுகாக்கிறது.
- source_word: הָעַמִּים
  choice: மக்கள்
  rationale: עַמִּים என்பதன் அடிப்படைப் பன்மைப் பொருள் ‘மக்கள்/மக்களினங்கள்.’ இச்சூழலில் ‘மக்கள்’ எளிமையாகவும் இயல்பாகவும் உள்ளது; ‘நாடுகள்’ என்பது அரசியல் எல்லை என்ற கூடுதல் நுணுக்கத்தைத் தரலாம்.
- source_word: אֲשֶׁר סְבִיבוֹתֵיכֶם
  choice: உங்களைச் சுற்றியுள்ள
  rationale: அண்டை மக்களின் இடவியல் சூழலைத் தெளிவாகவும் இயல்பான நவீனத் தமிழிலும் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: தடையின் தன்மை
  choice: வேறு தெய்வங்களைப் பின்பற்றி அவற்றிடம் பற்றுறுதி கொள்வதற்கான உடன்படிக்கைத் தடை
  alternative: புறமத வழிபாட்டிடங்களை நோக்கி உடலால் செல்வதற்கு மட்டும் விதிக்கப்பட்ட குறுகிய தடை
  rationale: உபாகமத்தில் הלך אחרי என்ற மரபுத்தொடர் பொதுவாக மதப் பற்றுறுதியையும் வழிபாட்டுச் சார்பையும் குறிக்கிறது. ‘பின்பற்றுதல்’ அந்தப் பொருளைப் பாதுகாக்கிறது; அதேவேளையில் அதை ‘வழிபடுதல்’ என்று மட்டும் குறுக்கிவிடவில்லை.
- issue: מִן முன்னொட்டின் தொடர்பு
  choice: சுற்றியுள்ள மக்களின் தெய்வங்களுள் வேறு தெய்வங்கள் என்று பகுதியியல் தொடர்பைப் பாதுகாத்தல்
  alternative: ‘வேறு தெய்வங்கள், அதாவது உங்களைச் சுற்றியுள்ள மக்களின் தெய்வங்கள்’ என்ற விளக்கச் சமனிலை
  rationale: மூலத்தில் உள்ள מֵאֱלֹהֵי வடிவம் பகுதியியல் வாசிப்பை ஆதரிக்கிறது. எனினும் விளக்கச் சமனிலை வாசிப்பும் பொருளில் நெருக்கமானதால் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் கண்ணியமான நடையைக் கொண்டுள்ளது. ‘பின்பற்றாதீர்கள்’ என்பது எபிரெய மரபுத்தொடரின் மதப் பற்றுறுதி சார்ந்த வலிமையை இயல்பாகக் காக்கிறது; அடிக்குறிப்பு பகுதியியல் மற்றும் விளக்கச் சமனிலை வாசிப்புகளுக்கு இடமளிக்கிறது.
