base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/020.yaml
  text: When your son asks you in time to come[a], saying[b], ‘What are the testimonies and the statutes and the judgments that Yahweh our God commanded you?’
translation:
  language: ta
  text: எதிர்காலத்தில்[a] உன் மகன் உன்னிடம், “நம் கடவுளாகிய யாவே உங்களுக்குக் கட்டளையிட்ட சாட்சிகளும், விதிமுறைகளும், நியாயத்தீர்ப்புகளும் என்ன?”[b] என்று கேட்டால்,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் நேரடியாக ‘நாளை’; இங்கு வருங்காலத்தில் ஒரு நேரம் என்ற மரபுத்தொடர்ப் பொருளில் வருகிறது.
    reason: lexical_alternative
  - marker: b
    text: இந்தக் கேள்வியை, “இந்தச் சாட்சிகள், விதிமுறைகள், நியாயத்தீர்ப்புகள் ஆகியவற்றின் பொருள் என்ன?” என்றும் பொருள்படுத்தலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: கேட்டால்
  rationale: இங்கு எதிர்காலத்தில் நிகழக்கூடியதாக எதிர்பார்க்கப்படும் சூழலை அறிமுகப்படுத்துகிறது. தமிழில் நிபந்தனை வினையெச்சம் இயல்பாகவும் மூலத்தின் திறந்த தன்மையைப் பாதுகாப்பதாகவும் உள்ளது.
- source_word: יִשְׁאָלְךָ
  choice: உன்னிடம் ... கேட்டால்
  rationale: שׁאל என்பதன் இயல்பான பொருள் ‘கேள்/விசாரி’; இரண்டாம் நபர் ஒருமை நேர்முகத்தைத் தெளிவாக வைத்திருக்கிறது.
- source_word: בִנְךָ
  choice: உன் மகன்
  rationale: எபிரெயச் சொல் ஆண்பால் ஒருமையாக இருப்பதால் பாலினத்தைப் பொதுமைப்படுத்தாமல் மொழிபெயர்க்கப்படுகிறது.
- source_word: מָחָר
  choice: எதிர்காலத்தில்
  rationale: நேரடியாக ‘நாளை’ என்றாலும், இச்சூழலில் வருங்காலத்தில் ஒரு நேரத்தைக் குறிக்கும் மரபுத்தொடராகப் பயன்படுகிறது.
- source_word: לֵאמֹר
  choice: என்று
  rationale: கேள்வியின் உள்ளடக்கத்தை அறிமுகப்படுத்தும் எபிரெயக் கூறை இயல்பான தமிழில் நேரடி மேற்கோளுடன் வழங்குகிறது.
- source_word: מָה
  choice: என்ன
  rationale: மூலத்தில் உள்ள நேரடியான ‘என்ன?’ என்ற கேள்வியைப் பாதுகாக்கிறது; ‘பொருள் என்ன?’ என்று மறைமுகமான விளக்கத்தை முதன்மை உரையில் சேர்க்கவில்லை.
- source_word: הָעֵדֹת
  choice: சாட்சிநெறிகள்
  rationale: உடன்படிக்கை சார்ந்த சாட்சி/சான்று நுணுக்கத்தையும், அடுத்த இரண்டு சட்டச் சொற்களிலிருந்து அதன் வேறுபாட்டையும் பாதுகாக்கிறது.
- source_word: הַחֻקִּים
  choice: சட்டதிட்டங்கள்
  rationale: நிர்ணயிக்கப்பட்ட விதிகள் அல்லது சட்டங்கள் என்ற நுணுக்கத்தை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: הַמִּשְׁפָּטִים
  choice: நீதிநியமங்கள்
  rationale: நீதித் தீர்ப்புகள் மற்றும் சட்ட நியமங்கள் சார்ந்த பொருளைப் பாதுகாத்து, முக்கூற்றின் சொல் வேறுபாட்டை நிலைநிறுத்துகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் பரவலாகப் புரியக்கூடிய ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: אֱלֹהֵינוּ
  choice: நம் கடவுள்
  rationale: முதல் நபர் பன்மை உடைமையையும் உடன்படிக்கை உறவையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: צִוָּה ... אֶתְכֶם
  choice: உங்களுக்குக் கட்டளையிட்ட
  rationale: எபிரெயத்தில் செயப்பொருள் இரண்டாம் நபர் பன்மை; தமிழில் ‘உங்களுக்கு’ என்பதால் ஒருமை ‘உன்/உன்னிடம்’ என்பதிலிருந்து வேறுபாடு தெளிவாகிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலம் தனிப்பட்ட உடன்படிக்கைப் பெயரை நேரடியாகப் பயன்படுத்துவதால், பட்டமாக மாற்றாமல் ஒலிபெயர்க்கப்பட்டது.
- issue: בִנְךָ என்ற பாலினக் குறிப்பு
  choice: உன் மகன்
  alternative: உன் பிள்ளை
  rationale: மூலச் சொல் ஆண்பால் ஒருமை என்பதால் அதன் குறிப்பிட்ட பாலின வடிவம் தக்கவைக்கப்பட்டது.
- issue: מָה என்ற கேள்வியின் பரப்பு
  choice: '... என்ன?'
  alternative: '... என்பவற்றின் பொருள் என்ன?'
  rationale: மூலம் ‘என்ன?’ என்றே நேரடியாகக் கேட்கிறது. பொருள் அல்லது நோக்கத்தை விளக்குமாறு கேட்பது சூழலில் உட்கிடந்தாலும், அதை முதன்மை உரையில் வெளிப்படையாகச் சேர்க்காமல் உண்மையான திறந்த தன்மை பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பாகவும் மரியாதைமிக்கதாகவும் அமைக்கப்பட்டுள்ளது. தந்தையை நோக்கிய ஒருமை ‘உன்/உன்னிடம்’ என்பதும், இஸ்ரவேலரைக் குறிக்கும் பன்மை ‘உங்களுக்கு’ என்பதும் வேறுபடுத்தப்பட்டுள்ளன. சட்டச் சொற்களின் முக்கூற்றை ஒன்றாகக் கலக்காமல் தனித்தனி தமிழ்ச் சொற்களால் பாதுகாத்துள்ளோம்.
