  text: וְ/זֹ֣את הַ/מִּצְוָ֗ה הַֽ/חֻקִּים֙ וְ/הַ/מִּשְׁפָּטִ֔ים אֲשֶׁ֥ר צִוָּ֛ה יְהוָ֥ה אֱלֹהֵי/כֶ֖ם לְ/לַמֵּ֣ד אֶתְ/כֶ֑ם לַ/עֲשׂ֣וֹת בָּ/אָ֔רֶץ אֲשֶׁ֥ר אַתֶּ֛ם עֹבְרִ֥ים שָׁ֖מָּ/ה לְ/רִשְׁתָּֽ/הּ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/001.yaml
  text: This is the commandment—the statutes and the judgments—that Yahweh your God commanded to teach you[a], so that you may do them in the land into which you are crossing[c][b], to possess it.
translation:
  language: ta
  text: உங்களுக்குக் கற்பிப்பதற்காக உங்கள் கடவுளாகிய யாவே கட்டளையிட்ட கட்டளை இதுவே—சட்டதிட்டங்களும் நீதிமுறைகளும். நீங்கள் உரிமையாக்கிக்கொள்ளப் போகிற நாட்டிற்குள் கடந்து சென்று, அங்கே அவற்றைச் செய்வதற்காக இது கொடுக்கப்பட்டது.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அவற்றைச் செய்வதற்காக’ என்பதற்கு ‘அவற்றைக் கடைப்பிடிப்பதற்காக’ என்றும் மொழிபெயர்க்கலாம். ‘உரிமையாக்கிக்கொள்ள’ என்பதற்கு ‘அதைக் கைப்பற்ற’ அல்லது ‘அதைச் சுதந்தரித்துக்கொள்ள’ என்பதும் சாத்தியம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזֹאת
  choice: இதுதான்
  rationale: இது முந்தைய உரையுடன் தொடர்பைத் தக்கவைத்தபடி புதிய பகுதியை அறிமுகப்படுத்துகிறது; தமிழில் தனியான ‘இப்போது’ சேர்க்காமல் இயல்பாக உள்ளது.
- source_word: הַמִּצְוָה
  choice: கட்டளை
  rationale: ஒருமையைத் தக்கவைத்து, தொடர்ந்து வரும் பன்மைச் சட்டப் பிரிவுகளுக்கான தொகுப்புத் தலைப்பாக வழங்குகிறது.
- source_word: הַחֻקִּים
  choice: சட்டதிட்டங்கள்
  rationale: நிலையாக வகுக்கப்பட்ட சட்டங்களைக் குறிக்கும் எபிரெயச் சொல்லின் சட்டப் பதிவை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: וְהַמִּשְׁפָּטִים
  choice: நீதிமுறைகள்
  rationale: சட்டத் தீர்ப்புகள் அல்லது ஒழுங்குமுறைகள் என்ற பொருளைப் பாதுகாத்து, חֻקִּים என்பதிலிருந்து வேறுபடுத்துகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைத் திருப்பெயரான YHWH-ஐ ஒரு பட்டத்தால் மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: לְלַמֵּד אֶתְכֶם
  choice: உங்களுக்குக் கற்பிக்கும்படி
  rationale: கற்பித்தல் என்ற நேரடியான பொருளையும் நோக்கத் தொடர்பையும் தக்கவைக்கிறது.
- source_word: לַעֲשׂוֹת
  choice: அவற்றின்படி நடக்க வேண்டும்
  rationale: சட்டங்களை ‘செய்தல்’ என்பதன் நடைமுறை கீழ்ப்படிதல் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது; ‘அவற்றின்’ சுட்டுப்பொருள் முந்தைய பன்மைப் பிரிவுகள்.
- source_word: אֲשֶׁר אַתֶּם עֹבְרִים שָׁמָּה
  choice: கடந்து செல்கிற நாட்டில்
  rationale: நாட்டை நோக்கிய உடனடி கடத்தலையும் இலக்கையும் சுருக்கமாகப் பாதுகாக்கிறது.
- source_word: לְרִשְׁתָּהּ
  choice: உரிமையாக்கிக்கொள்ளும்படி
  rationale: நாட்டைக் கைப்பற்றி உடைமையாக்குதல்/சுதந்தரித்தல் ஆகிய பொருள் பரப்பைச் சூழலுக்கேற்ற வகையில் தருகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைத் திருப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் நேரடியாக உள்ள உடன்படிக்கைத் திருப்பெயரைப் பட்டமாக மாற்றாமல் பாதுகாக்கிறது.
- issue: ஒருமையான ‘கட்டளை’க்கும் பன்மையான சட்டப் பிரிவுகளுக்கும் உள்ள உறவு
  choice: ‘கட்டளை’ என்ற ஒருமையையும், ‘சட்டதிட்டங்களும் நீதிமுறைகளும்’ என்ற பன்மை விரிவாக்கத்தையும் தக்கவைத்தல்
  alternative: அனைத்தையும் பன்மையாக்கி ‘கட்டளைகள்’ என வழங்குதல்
  rationale: மூலத்தின் ஒருமை–பன்மை வேறுபாட்டையும், தொகுப்புத் தலைப்பு பின்னர் விரிவாக்கப்படும் அமைப்பையும் அழிக்காமல் காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழ்; மரியாதையும் சட்ட-உடன்படிக்கைத் தொனியும் காக்கப்பட்டுள்ளன. மிகப் பழமையான சட்டச் சொற்கள் தவிர்க்கப்பட்டு, ஒருமை–பன்மை அமைப்பும் இறைத் திருப்பெயரும் பாதுகாக்கப்பட்டுள்ளன.
