- from: நீ நிரப்பாத, எல்லா நல்ல பொருள்களும் நிறைந்த வீடுகளும், நீ வெட்டாத, வெட்டப்பட்ட நீர்த்தொட்டிகளும்[a], நீ நடாத திராட்சைத்தோட்டங்களும் ஒலிவ மரங்களும் இருக்கும்; நீ உண்டு நிறைவடைவாய்[b]—
