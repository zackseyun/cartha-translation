base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/011.yaml
  text: and houses full of every good thing that you did not fill[a], and hewn cisterns that you did not hew[b], vineyards and olive trees that you did not plant—and you eat and are satisfied—
translation:
  language: ta
  text: நீ நிரப்பாத எல்லா நல்ல பொருள்களும் நிறைந்த வீடுகளும், பாறையை வெட்டி அமைத்த நீர்த்தொட்டிகளும்[a]—அவற்றை நீ வெட்டியமைக்கவில்லை—நீ நடாத திராட்சைத்தோட்டங்களும் ஒலிவ மரங்களும் இருக்கும்; நீ உண்டு நிறைவடைவாய்[b]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கிணறுகள்.” எபிரெயச் சொல், பொதுவாகப் பாறையை வெட்டி நீரைச் சேமிப்பதற்காக அமைக்கப்பட்ட நீர்த்தொட்டிகளைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: எபிரெய வினை வடிவங்கள், இஸ்ரவேல் தேசத்திற்குள் நுழைந்தபின் நிகழப்போகும் தொடரின் பகுதியாக இங்கு எதிர்காலப் பொருளில் வருகின்றன.
    reason: grammatical_ambiguity
lexical_decisions:
- source_word: בָתִּים
  choice: வீடுகள்
  rationale: பொருள் வளங்களின் பட்டியலில் வரும் கட்டடங்களை நேரடியாகவும் இயல்பாகவும் குறிக்கிறது.
- source_word: מְלֵאִים כָּל טוּב
  choice: எல்லா நல்ல பொருள்களும் நிறைந்த
  rationale: טוּב என்பதை அறநன்மை என்று மட்டும் குறுக்காமல், விரும்பத்தக்க பொருள்களையும் வாழ்வாதார வளங்களையும் உள்ளடக்கும் வகையில் மொழிபெயர்க்கிறது.
- source_word: אֲשֶׁר לֹא מִלֵּאתָ
  choice: நீ நிரப்பாத
  rationale: இஸ்ரவேல் தானே உழைத்துச் சேர்க்காத வளம் என்ற முரண்பாட்டையும் இரண்டாம் நபர் ஒருமை அழைப்பையும் காக்கிறது.
- source_word: בֹרֹת חֲצוּבִים
  choice: வெட்டப்பட்ட நீர்த்தொட்டிகள்
  rationale: நீரைச் சேமிப்பதற்காக வெட்டியமைக்கப்பட்ட தொட்டிகள் என்ற சூழல்சார்ந்த பொருளைக் கொடுக்கிறது; பொதுவான ‘கிணறுகள்’ என்பதைக் காட்டிலும் துல்லியமானது.
- source_word: אֲשֶׁר לֹא חָצַבְתָּ
  choice: நீ வெட்டாத
  rationale: חצב என்ற வேரின் வெட்டுதல் அல்லது செதுக்குதல் சார்ந்த உருவகத்தைச் சுருக்கமாகப் பாதுகாக்கிறது.
- source_word: כְּרָמִים
  choice: திராட்சைத்தோட்டங்கள்
  rationale: தனித்தனி திராட்சைக்கொடிகளைக் காட்டிலும் பயிரிடப்பட்ட தோட்டப்பகுதிகளை இச்சொல் குறிக்கிறது.
- source_word: זֵיתִים
  choice: ஒலிவ மரங்கள்
  rationale: நடப்பட்ட வளங்களின் பட்டியலில் தனித்தனி மரங்கள் அல்லது அவற்றின் பயிரிடுதலைத் தெளிவாகக் குறிக்கிறது.
- source_word: אֲשֶׁר לֹא נָטָעְתָּ
  choice: நீ நடாத
  rationale: பெறுபவன் தானாக உருவாக்காத வளங்கள் என்ற மீண்டும் மீண்டும் வரும் அமைப்பைப் பாதுகாக்கிறது.
- source_word: וְאָכַלְתָּ וְשָׂבָעְתָּ
  choice: நீ உண்டு நிறைவடைவாய்
  rationale: சுற்றியுள்ள எதிர்கால நிகழ்வுகளின் தொடரைத் தமிழில் இயல்பாக வெளிப்படுத்தி, உணவுக்குப் பிந்தைய திருப்தி மற்றும் நிறைவைப் பாதுகாக்கிறது.
theological_decisions:
- issue: வாக்குறுதியளிக்கப்பட்ட வளத்தின் தன்மை
  choice: இஸ்ரவேல் தன் உழைப்பால் உருவாக்காத பொருளாதார மற்றும் வாழ்வாதார வளங்களின் எளிய பட்டியல்
  alternative: இந்த வசனத்திலேயே எச்சரிக்கையையோ, அவை முறைகேடாகப் பெறப்பட்டவை என்ற கருத்தையோ சேர்த்தல்
  rationale: இவ்வசனம் வீடுகள், நீர்த்தொட்டிகள், தோட்டங்கள், மரங்கள் ஆகியவற்றைப் பட்டியலிடுகிறது; மறந்துவிடாதே என்ற எச்சரிக்கை அடுத்த வசனத்தில் வருகிறது. ஆகவே அந்த எச்சரிக்கை இங்கு முன்கூட்டியே சேர்க்கப்படவில்லை.
- issue: இரண்டாம் நபர் ஒருமை அழைப்பு
  choice: ‘நீ’ என்ற ஒருமை வடிவத்தை முழுவதும் தக்கவைத்தல்
  alternative: ‘நீங்கள்’ என்ற பன்மை வடிவமாக மாற்றுதல்
  rationale: எபிரெய உரை இஸ்ரவேலை உடன்படிக்கை மக்களாக ஒருமையில் அழைக்கிறது; தமிழ் ஒருமை வடிவம் அந்த இலக்கண மற்றும் பிரதிநிதித்துவத் தன்மையைப் பாதுகாக்கிறது.
- issue: வினைகளின் காலம்
  choice: ‘உண்டு நிறைவடைவாய்’ என எதிர்காலத் தொடராக மொழிபெயர்த்தல்
  alternative: ‘உண்டு நிறைவடைந்தாய்’ அல்லது நிகழ்கால வடிவம்
  rationale: எபிரெய வடிவங்கள் இலக்கண ரீதியாக நிறைவு வடிவங்களாக இருந்தாலும், இங்கு தேசத்தில் நுழைந்த பின்பு நிகழப்போகும் தொடரின் பகுதியாகச் செயல்படுகின்றன.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியும் ஆனால் மரியாதைமிக்க நடையில் மொழிபெயர்க்கப்பட்டது. எபிரெய உரையின் மீளுரைப்பும் ‘நீ’ என்ற உடன்படிக்கை ஒருமையும் காக்கப்பட்டுள்ளன. முந்தைய வசனத்திலிருந்து தொடரும் பட்டியல் என்பதால் இறுதியில் நீள்கோடு வைக்கப்பட்டுள்ளது.
