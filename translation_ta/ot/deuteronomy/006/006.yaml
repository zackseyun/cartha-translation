source:
  edition: WLC
  text: וְ/הָי֞וּ הַ/דְּבָרִ֣ים הָ/אֵ֗לֶּה אֲשֶׁ֨ר אָנֹכִ֧י מְצַוְּ/ךָ֛ הַ/יּ֖וֹם עַל לְבָבֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/006.yaml
  text: And these words that I am commanding you today shall be on your heart[a].
translation:
  language: ta
  text: இன்று நான் உனக்குக் கட்டளையிடும் இந்த வார்த்தைகள் உன் இதயத்தில்[a] இருக்கட்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உன் இதயத்தின்மேல்.” எபிரெய மூலத்தில் சொற்சார்பாக இவ்வாறே உள்ளது; இந்த வார்த்தைகளை ஒருவர் தமது உள்ளார்ந்த வாழ்வில் எப்போதும் வைத்திருப்பதை இது குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיוּ
  choice: இருக்கட்டும்
  rationale: முந்தைய கட்டளைச் சூழலைத் தொடர்ந்து வரும் இவ்வடிவம் அறிவுறுத்தல் சார்ந்த பொருளைக் கொண்டுள்ளது; நவீன தமிழில் இயல்பாகவும் தெளிவாகவும் அதைக் காட்டுகிறது.
- source_word: הַדְּבָרִים הָאֵלֶּה
  choice: இந்த வார்த்தைகள்
  rationale: דְּבָרִים என்பதன் அடிப்படைப் பொருளான ‘வார்த்தைகள்’ என்பதைப் பேணி, குறிப்பாக இப்போது கூறப்பட்ட கட்டளையைச் சுட்டுகிறது.
- source_word: אֲשֶׁר
  choice: -உம்
  rationale: தமிழின் தொடர்பெயரெச்ச அமைப்பில் ‘கட்டளையிடும்’ என்பதே எபிரெய உறவுச்சொல்லின் பணியை இயல்பாக நிறைவேற்றுகிறது.
- source_word: אָנֹכִי
  choice: நான்
  rationale: தனி முதற்பெயர் தரும் எழுவாய் வலியுறுத்தலை மிகைப்படுத்தாமல் நேரடியாகப் பேணுகிறது.
- source_word: מְצַוְּךָ
  choice: உனக்குக் கட்டளையிடும்
  rationale: பங்கேற்பு வினையெச்சத்தின் நிகழ்காலப் பேச்சுச் செயலைத் தமிழில் இயல்பான தொடர்பெயரெச்சமாக வெளிப்படுத்துகிறது.
- source_word: הַיּוֹם
  choice: இன்று
  rationale: மோசேயின் உரையின் உடனடி காலச்சுட்டை இயல்பான நவீன தமிழில் பேணுகிறது.
- source_word: עַל לְבָבֶךָ
  choice: உன் இதயத்தில்
  rationale: எபிரெய மொழியில் சொற்சார்பாக ‘உன் இதயத்தின்மேல்’ என்றாலும், அந்தச் சொல்லாட்சி வார்த்தைகளை உள்ளார்ந்து தொடர்ந்து வைத்திருப்பதைக் குறிக்கிறது; தமிழில் ‘இதயத்தில்’ என்பது இயல்பாக அந்தப் பொருளைத் தருகிறது, அசல் உருவகம் அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: לְבָב என்பதன் மனித உள்ளமை சார்ந்த சொல்லாட்சி
  choice: இதயம்
  alternative: மனம் / உள்ளம்
  rationale: எபிரெய ‘இதயம்’ சிந்தனை, மனவுறுதி, விருப்பம், உணர்வு ஆகியவற்றை உள்ளடக்குகிறது. ‘இதயம்’ என்ற உருவகத்தைப் பேணுவது பொருளை அறிவாற்றலுக்கு மட்டும் குறுக்காமல் வேதாகமச் சொல்லாட்சியை நிலைநிறுத்துகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், ஒருமை இரண்டாம் நபர் உரையைப் பேணி, எளிமையான ஆனால் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘இதயத்தில்’ இயல்பான தமிழ் சொல்லாட்சியாக முதன்மை உரையில் வைக்கப்பட்டு, ‘இதயத்தின்மேல்’ என்ற எபிரெய வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
