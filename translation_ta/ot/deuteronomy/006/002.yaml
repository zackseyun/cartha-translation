  text: לְמַ֨עַן תִּירָ֜א אֶת יְהוָ֣ה אֱלֹהֶ֗י/ךָ לִ֠/שְׁמֹר אֶת כָּל חֻקֹּתָ֣י/ו וּ/מִצְוֺתָי/ו֮ אֲשֶׁ֣ר אָנֹכִ֣י מְצַוֶּ/ךָ֒ אַתָּה֙ וּ/בִנְ/ךָ֣ וּ/בֶן בִּנְ/ךָ֔ כֹּ֖ל יְמֵ֣י חַיֶּ֑י/ךָ וּ/לְמַ֖עַן יַאֲרִכֻ֥/ן יָמֶֽי/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/002.yaml
  text: so that you may fear Yahweh your God[a], by keeping all his statutes and his commandments that I am commanding you—you and your son and your grandson—all the days of your life[c][b], and so that your days may be prolonged.
translation:
  language: ta
  text: நீ உன் கடவுளாகிய யாவேக்குப் பயந்து[a], நான் உனக்குக் கட்டளையிடுகிற அவருடைய எல்லாச் சட்டங்களையும் கட்டளைகளையும் நீயும் உன் மகனும் உன் மகனின் மகனும்[b] உன் வாழ்நாளெல்லாம் கடைப்பிடிக்கும்படியாகவும், உன் வாழ்நாட்கள் நீடிக்கும்படியாகவும்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “பயந்து” என்பது இங்கே பயபக்தி கொள்வதையும் பிரமிப்புடன் மதிப்பதையும் உள்ளடக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில் நேரடியாக, “நீயும் உன் மகனும் உன் மகனின் மகனும்.”
    reason: lexical_alternative
  - marker: c
    text: அல்லது, “உன் வாழ்நாட்கள் நீண்டவையாக இருக்கும்படியாகவும்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַעַן תִּירָא
  choice: நீ பயந்து ... கடைப்பிடிப்பதற்காகவும்
  rationale: לְמַעַן நோக்கத்தைக் குறிக்கிறது; ירא என்பதிலுள்ள பயம், பயபக்தி, வியப்பு ஆகிய பொருள் அழுத்தங்களைத் தீர்த்துவிடாமல் ‘பயந்து’ எனப் பாதுகாக்கிறது. முந்தைய வசனத்தின் கட்டளையோடு தமிழில் இயல்பாக இணைக்க இறுதியில் ‘இவற்றைக் கற்றுக்கொள்’ என்பது சூழலிலிருந்து நிரப்பப்பட்டுள்ளது.
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: உன் கடவுளாகிய யெகோவா
  rationale: தெய்வீகப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் நிலைபெற்ற ‘யெகோவா’ என்ற ஒலிபெயர்ப்பைப் பயன்படுத்துகிறது; אֱלֹהֶיךָ என்பதிலுள்ள உடன்படிக்கை உறவை ‘உன் கடவுள்’ பாதுகாக்கிறது.
- source_word: לִשְׁמֹר
  choice: கடைப்பிடிப்பதற்காக
  rationale: שמר இங்கு சட்டங்களையும் கட்டளைகளையும் கவனமாகப் பேணிக் கீழ்ப்படிவதைக் குறிக்கிறது; ‘கடைப்பிடி’ நவீனத் தமிழில் இயல்பான சட்ட/கட்டளைச் சொல்லாட்சி.
- source_word: חֻקֹּתָיו וּמִצְוֺתָיו
  choice: அவருடைய எல்லா சட்டங்களையும் கட்டளைகளையும்
  rationale: חֻקִּים மற்றும் מִצְוֹת ஆகிய இரு உடன்படிக்கைச் சொற்களுக்கிடையிலான வேறுபாட்டை ‘சட்டங்கள்’, ‘கட்டளைகள்’ எனப் பேணுகிறது.
- source_word: אֲשֶׁר אָנֹכִי מְצַוֶּךָ
  choice: நான் உனக்குக் கட்டளையிடுகிற
  rationale: பேச்சுச் சூழலில் நிகழும் கட்டளையிடுதலை இயல்பான தமிழ் நிகழ்காலப் பெயரெச்சம் வெளிப்படுத்துகிறது; மூலத்தில் இல்லாத ‘இன்று’ சேர்க்கப்படவில்லை.
- source_word: אַתָּה וּבִנְךָ וּבֶן בִּנְךָ
  choice: நீயும் உன் மகனும் உன் மகனின் மகனும்
  rationale: மூலத்தின் மூன்று தலைமுறை வரிசையையும், ‘மகனின் மகன்’ என்ற நேரடி வடிவத்தையும் பேணுகிறது; எல்லா சந்ததியினரென பொதுமைப்படுத்தவில்லை.
- source_word: כֹּל יְמֵי חַיֶּיךָ
  choice: உன் வாழ்நாளெல்லாம்
  rationale: ‘உன் வாழ்வின் எல்லா நாட்களிலும்’ என்ற பொருளைச் சுருக்கமான, இயல்பான தமிழில் தருகிறது.
- source_word: וּלְמַעַן יַאֲרִכֻן יָמֶיךָ
  choice: உன் வாழ்நாட்கள் நீடிப்பதற்காகவும்
  rationale: இரண்டாம் நோக்கம்/விளைவு கூறை இணைப்புடன் பேணுகிறது; ‘நீ நீண்டகாலம் வாழ்வாய்’ என்று மிகையாகப் பொழிப்புரை செய்யாமல் ‘நாட்கள் நீடித்தல்’ என்ற எபிரெய வடிவத்தைத் தக்கவைக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரின் மொழிபெயர்ப்பு
  choice: யெகோவா
  alternative: ஆண்டவர்; யாவே
  rationale: மூலத்தில் தனிப்பட்ட உடன்படிக்கைப் பெயர் நேரடியாக உள்ளது. அதை ‘ஆண்டவர்’ என்ற பட்டத்தால் மாற்றாமல் தமிழில் பரவலாக அறியப்படும் ‘யெகோவா’ என ஒலிபெயர்க்கப்பட்டுள்ளது.
- issue: கடவுளுக்கு ‘பயப்படுதல்’ என்பதன் பொருள்
  choice: பயந்து
  alternative: பயபக்தி கொண்டு; வணங்கி மதித்து
  rationale: ירא என்பதில் உண்மையான பயம், பயபக்தி, பிரமிப்பு ஆகியவை ஒன்றோடொன்று பின்னியுள்ளன. ‘பயந்து’ என்பது அந்த வேதாகமத் தத்துவ அழுத்தத்தை மென்மையாக்காமல் பாதுகாக்கிறது; அடிக்குறிப்பு அதன் பரந்த பொருளைக் குறிப்பிடுகிறது.
- issue: நீண்ட வாழ்நாட்கள் குறித்த கூறு
  choice: உன் வாழ்நாட்கள் நீடிப்பதற்காகவும்
  alternative: நீ நீண்டகாலம் வாழ்வதற்காகவும்
  rationale: வாக்குறுதியின் எபிரெய உருவகத்தைப் பேணி, அது தனிநபரின் ஆயுளை மட்டுமே குறிக்கிறதா அல்லது நிலத்தில் நீடித்த வாழ்வையும் உள்ளடக்குகிறதா என்பதைத் தேவையின்றித் தீர்மானிக்கவில்லை.
translation_notes:
  register: நவீன, கண்ணியமான ஒருமை உரையாடல் நடை பயன்படுத்தப்பட்டுள்ளது. இது உபாகமம் 6:1-இல் தொடங்கும் வாக்கியத்தின் தொடர்ச்சி என்பதால், தனித்து வாசிக்க இயலுமாறு ‘இவற்றைக் கற்றுக்கொள்’ சூழலிலிருந்து நிறைவு செய்யப்பட்டுள்ளது; ஆனால் மூலவசனத்தில் அந்த வினை வெளிப்படையாக இல்லை. ‘சட்டங்கள்/கட்டளைகள்’ என்ற வேறுபாடும் மூன்று தலைமுறை அமைப்பும் பேணப்பட்டுள்ளன.
