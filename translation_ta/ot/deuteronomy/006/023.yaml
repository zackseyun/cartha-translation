id: DEU.6.23
reference: Deuteronomy 6:23
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וְ/אוֹתָ֖/נוּ הוֹצִ֣יא מִ/שָּׁ֑ם לְמַ֨עַן֙ הָבִ֣יא אֹתָ֔/נוּ לָ֤/תֶת לָ֨/נוּ֙ אֶת הָ/אָ֔רֶץ אֲשֶׁ֥ר נִשְׁבַּ֖ע לַ/אֲבֹתֵֽי/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/023.yaml
  text: And he brought us out from there[a], so that he might bring us in, to give us the land that he swore to our fathers.
translation:
  language: ta
  text: அவர் எங்களை அங்கிருந்து வெளியே கொண்டுவந்தார்; எங்களை நாட்டிற்குள் கொண்டுவந்து, எங்கள் தந்தையருக்கு அவர் சத்தியம் செய்து வாக்களித்த அந்த நாட்டை எங்களுக்குக் கொடுப்பதற்காக.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאוֹתָנוּ הוֹצִיא
  choice: அவர் எங்களை ... வெளியே கொண்டுவந்தார்
  rationale: முன்னிலைப்படுத்தப்பட்ட நேரடிச் செயப்படுபொருளை இயல்பான தமிழ்ச் சொல் வரிசையில் அமைத்து, יצא என்பதன் ஹிஃபில் வடிவத்துக்குரிய ‘வெளியே கொண்டுவருதல்’ என்ற பொருளைப் பாதுகாக்கிறது.
- source_word: מִשָּׁם
  choice: அங்கிருந்து
  rationale: எளிய இடக் குறிப்பு; நவீனத் தமிழில் சுருக்கமாகவும் இயல்பாகவும் உள்ளது.
- source_word: לְמַעַן
  choice: '...பதற்காகவே'
  rationale: சொல் குறிக்கும் நோக்கத்தைத் தெளிவாக வெளிப்படுத்துகிறது; ‘வே’ அந்த நோக்க உறவை வலியுறுத்துகிறது.
- source_word: הָבִיא אֹתָנוּ
  choice: எங்களை நாட்டிற்குள் கொண்டுவந்து
  rationale: בוא என்பதன் ஹிஃபில் வடிவம் ‘உள்ளே கொண்டுவருதல்’ எனப் பொருள்படும். தமிழில் இலக்கு தெளிவாக இருக்க, அடுத்த தொடரில் குறிப்பிடப்படும் நாட்டை வெளிப்படையாக இணைத்துள்ளது; இது ‘வெளியே கொண்டுவந்தார்’ என்பதுடனான எதிரிணையையும் காக்கிறது.
- source_word: לָתֵת לָנוּ
  choice: எங்களுக்குக் கொடுப்பதற்காக
  rationale: נתן வினையின் நேரடியான பொருளையும் நோக்க உறவையும் இயல்பான தமிழில் தருகிறது.
- source_word: אֶת־הָאָרֶץ
  choice: அந்த நாட்டை
  rationale: இச்சூழலில் குறிப்பிட்ட வாக்குத்தத்த நாட்டைக் குறிக்கிறது. தமிழில் முன்பே அறியப்பட்ட குறிப்பிட்ட நிலப்பரப்பைக் காட்ட ‘அந்த நாடு’ இயல்பாக உள்ளது.
- source_word: אֲשֶׁר נִשְׁבַּע
  choice: ஆணையிட்டபடி
  rationale: שׁבע என்பதன் ‘சத்தியம்/ஆணை செய்தல்’ என்ற உடன்படிக்கை சார்ந்த வலிமையைப் பாதுகாக்கிறது; தமிழில் யாருக்குச் செய்யப்பட்ட ஆணை என்பதோடு இயல்பாக இணைகிறது.
- source_word: לַאֲבֹתֵינוּ
  choice: எங்கள் தந்தையருக்கு
  rationale: எபிரெயச் சொல்லின் வெளிப்படையான ஆண்பால் பன்மையையும் இஸ்ரவேலின் முற்பிதாக்களுடனான உடன்படிக்கைத் தொடர்பையும் காக்கிறது; விரிவான ‘முன்னோர்’ என்பது அடிக்குறிப்பில் மாற்றாக வழங்கப்படுகிறது.
theological_decisions:
- issue: לַאֲבֹתֵינוּ என்பதிலுள்ள பாலினம் சுட்டும் உடன்படிக்கைக் குறிப்பு
  choice: எங்கள் தந்தையருக்கு
  alternative: எங்கள் முன்னோர்களுக்கு
  rationale: மூலத்தில் ஆண்பால் பன்மை வெளிப்படையாக உள்ளது; சூழலில் இஸ்ரவேலின் முற்பிதாக்களைக் குறிக்கும் வாய்ப்பு வலுவானது. ஆகவே பொதுப்பாலாக்காமல் முதன்மை உரையில் அதைப் பாதுகாத்து, விரிவான மாற்றை அடிக்குறிப்பில் தருகிறது.
- issue: נִשְׁבַּע என்பதின் உடன்படிக்கை ஆணை மொழி
  choice: ஆணையிட்டபடி
  alternative: வாக்களித்தபடி
  rationale: இது வெறும் வாக்குறுதியை அல்ல, ஆணையிட்டுச் செய்த உறுதிமொழியைக் குறிக்கிறது. ‘ஆணையிட்டபடி’ அந்த இறையியல் வலிமையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையைப் பயன்படுத்துகிறது. எபிரெயத்தின் ‘வெளியே கொண்டுவருதல் / உள்ளே கொண்டுவருதல்’ என்ற எதிரிணை பாதுகாக்கப்பட்டுள்ளது. தமிழில் குழப்பம் தவிர்க்க இரண்டாவது இயக்கத்தின் இலக்காக ‘நாடு’ வெளிப்படுத்தப்பட்டுள்ளது.
