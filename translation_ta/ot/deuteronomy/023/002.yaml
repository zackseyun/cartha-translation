- from: விதைப்பைகள் நசுக்கப்பட்டவனோ, ஆணுறுப்பு துண்டிக்கப்பட்டவனோ யெகோவாவின் சபைக்குள் சேரக்கூடாது.[a][b]
  to: விதைப்பைகள் நசுக்கப்பட்டவனோ, ஆணுறுப்பு துண்டிக்கப்பட்டவனோ யாவேவின் சபைக்குள் நுழையக்கூடாது.[a][b]
  rationale: The revision aligns the divine name with the established Yahweh rendering and replaces ‘சேரக்கூடாது’ with ‘நுழையக்கூடாது’ to reflect the Hebrew verb’s access/entry sense. It preserves the anatomical specificity, legal register, disjunctive syntax, and the unresolved scope of ‘the assembly of Yahweh.’
