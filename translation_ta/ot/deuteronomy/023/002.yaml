base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/002.yaml
  text: No man with crushed testicles or a severed penis may enter the assembly of Yahweh[a][b].
translation:
  language: ta
  text: விதைப்பைகள் நசுக்கப்பட்டவனோ, ஆணுறுப்பு துண்டிக்கப்பட்டவனோ யாவேவின் சபைக்குள் நுழையக்கூடாது.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'இன்னும் சொற்சொல்லான மொழிபெயர்ப்பு: “விதைப்பைகள் நசுக்கப்பட்டவனும், ஆணுறுப்பு வெட்டப்பட்டவனும் யாவேவின் சபைக்குள் நுழையக்கூடாது.”'
    reason: lexical_alternative
  - marker: b
    text: “யாவேவின் சபை” என்பது இஸ்ரவேலின் உடன்படிக்கைச் சமூகத்தில் அதிகாரபூர்வமாகப் பங்கேற்பதைக் குறிக்கலாம்; இந்தத் தடையின் துல்லியமான வரம்பு குறித்து கருத்து வேறுபாடு உள்ளது.
    reason: alternative_reading
lexical_decisions:
- source_word: יָבֹא
  choice: சேரக்கூடாது
  rationale: בוא என்பதன் அடிப்படைப் பொருள் ‘வருதல்/நுழைதல்’. இச்சட்டச் சூழலில், சபையின் அங்கீகரிக்கப்பட்ட வட்டத்திற்குள் சேர்வதற்கான தடையை இயல்பான தமிழில் ‘சேரக்கூடாது’ எனத் தருகிறது.
- source_word: פְצוּעַ דַּכָּא
  choice: விதைப்பைகள் நசுக்கப்பட்டவன்
  rationale: இந்தச் சொற்றொடர் நசுக்குதலால் ஆண் இனப்பெருக்க உறுப்புகளில் ஏற்பட்ட காயத்தை, குறிப்பாக விதைப்பைகள் நசுக்கப்பட்ட நிலையைச் சுட்டுகிறது. தெளிவற்ற மங்கலான சொல்லைவிட உடற்கூற்றுத் துல்லியத்தைப் பேணுகிறது.
- source_word: וּכְרוּת שָׁפְכָה
  choice: ஆணுறுப்பு துண்டிக்கப்பட்டவன்
  rationale: இச்சொற்றொடர் ஆண் பாலுறுப்பு வெட்டப்பட்ட அல்லது துண்டிக்கப்பட்ட நிலையைக் குறிக்கிறது. தமிழில் நேரடியானதும் கண்ணியமானதும் தெளிவானதுமான வடிவம் பயன்படுத்தப்பட்டுள்ளது.
- source_word: בִּקְהַל
  choice: சபைக்குள்
  rationale: קהל என்பது கூடிய சமுதாயத்தையோ அதிகாரபூர்வ அவையையோ குறிக்கலாம். ‘சபை’ தமிழில் சுருக்கமாகவும் மரபுடன் தொடர்புடையதாகவும் உள்ளது; அதன் துல்லியமான சட்ட வரம்பு அடிக்குறிப்பில் திறந்துவைக்கப்படுகிறது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: எபிரெய தனிப்பெயரான יהוה-ஐ ஒரு பட்டப்பெயரால் மாற்றாமல், தமிழில் பரவலாக அறியப்படும் ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: לֹא
  choice: கூடாது
  rationale: எபிரெய மறுப்புக் கட்டளையின் சட்டத் தடையை இயல்பான தமிழ் வாக்கிய முடிவாகத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: implicit male referent of the participial phrases
  choice: அவன்
  rationale: இரு உடல் நிலைகளும் ஆண் பாலுறுப்புகளைத் தெளிவாகக் குறிப்பிடுவதால், ஆண் குறிப்பு தமிழிலும் வெளிப்படையாகப் பேணப்படுகிறது.
theological_decisions:
- issue: ‘யெகோவாவின் சபை’ என்பதிலிருந்து விலக்கப்படுவதன் தன்மை
  choice: இஸ்ரவேலின் உடன்படிக்கைச் சபைக்குள் சேர்வதற்கான தடையாகச் சொற்றொடரை நேரடியாக மொழிபெயர்த்தல்; அதன் முழு சட்ட அல்லது இறையியல் எல்லையை நிர்ணயிக்காமல் விடுதல்
  alternative: வழிபாட்டு அவையில் பங்கேற்பதற்கான தடை, குடியுரிமை அல்லது திருமணத் தகுதி மீதான தடை, அல்லது விரிவான சடங்குசார் விலக்கு என்று குறிப்பாக்குதல்
  rationale: எபிரெய உரை ‘யெகோவாவின் சபை’ என்று கூறினாலும், இவ்வசனத்திலேயே அதன் சரியான நடைமுறை வரம்பை விளக்கவில்லை. ஆகவே பிற்கால திருச்சபை அல்லது இரட்சிப்பு சார்ந்த முடிவுகளை உரைக்குள் சேர்க்காமல் உள்ளார்ந்த தெளிவின்மை பேணப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சட்டத் தொனியையும் கண்ணியத்தையும் பேணிய நேரடி நடை. உடற்கூற்றுச் சொற்கள் மங்கலாக்கப்படாமல் தெளிவாகத் தரப்பட்டுள்ளன; அதேவேளை தேவையற்ற மருத்துவச் சொற்கள் தவிர்க்கப்பட்டுள்ளன.
