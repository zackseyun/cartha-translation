base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/015.yaml
  text: For Yahweh your God walks in the midst of your camp to deliver you and to give your enemies before you[a]. Therefore your camp must be holy[c][b], so that he may not see in you anything indecent and turn away from you.
translation:
  language: ta
  text: ஏனெனில், உன் கடவுளாகிய யாவே உன்னைக் காப்பாற்றவும், உன் எதிரிகளை உன்னிடம் ஒப்படைக்கவும்[a] உன் முகாமின் நடுவே நடமாடுகிறார். ஆகவே, உன் முகாம் பரிசுத்தமாக இருக்க வேண்டும்; அப்போதுதான் அவர் உன்னிடையே வெட்கக்கேடான எதையும்[b] கண்டு உன்னைவிட்டு விலகிவிடாதபடி[c] இருக்கும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'சொல்லுக்குச் சொல்: “உன் எதிரிகளை உன் முன்னால் கொடுக்கவும்.” எதிரிகளை உன் அதிகாரத்தில் ஒப்படைப்பதைக் குறிக்கும் எபிரேய மரபுத்தொடர் இது.'
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “வெட்கக்கேடான ஏதாவது ஒரு காரியத்தை.” இது முகாமைத் தீட்டுப்படுத்தும் வெட்ககரமான அல்லது தூய்மையற்ற எதையும் குறிக்கக்கூடிய பரந்த எபிரேய சொற்றொடர்.
    reason: lexical_alternative
  - marker: c
    text: 'சொல்லுக்குச் சொல்: “உன் பின்னாலிருந்து திரும்பிவிட.” யாவே இனி முகாமுடன் உடன்செல்லாமல் போவதை இந்தச் சித்திரம் குறிக்கிறது.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரேய உடன்படிக்கைப் பெயரைப் பட்டப்பெயராக மாற்றாமல், தமிழில் அதன் வழக்கமான ஒலிபெயர்ப்பால் தருகிறது.
- source_word: מִתְהַלֵּךְ
  choice: உலாவுகிறார்
  rationale: முகாமுக்குள் கடவுள் நடந்துசெல்லும் செயற்பாட்டையும் உருவகத்தின் தெளிவையும் காக்கிறது; வெறும் ‘இருக்கிறார்’ என்று அருவமாக்கவில்லை.
- source_word: בְּקֶרֶב מַחֲנֶךָ
  choice: உன் முகாமின் நடுவே
  rationale: בקרב என்பதன் ‘நடுவில்/உள்ளே’ என்ற பொருளையும் ஒருமை அழைப்பையும் இயல்பான தமிழில் காக்கிறது.
- source_word: לְהַצִּילְךָ
  choice: உன்னைக் காப்பாற்றவும்
  rationale: இராணுவச் சூழலில் ஆபத்திலிருந்து விடுவித்துக் காக்கும் பொருளை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וְלָתֵת אֹיְבֶיךָ לְפָנֶיךָ
  choice: உன் எதிரிகளை உன்னிடம் ஒப்படைக்கவும்
  rationale: சொல்லுக்குச் சொல் வடிவம் தமிழில் தெளிவற்றதால், எதிரிகளை ஒருவரின் அதிகாரத்தில் ஒப்படைக்கும் எபிரேய மரபுத்தொடரின் பொருளை வழங்குகிறது; நேரடி வடிவம் அடிக்குறிப்பில் காக்கப்படுகிறது.
- source_word: וְהָיָה מַחֲנֶיךָ קָדוֹשׁ
  choice: ஆகவே, உன் முகாம் பரிசுத்தமாக இருக்க வேண்டும்
  rationale: யாவேயின் உடனிருப்பிலிருந்து எழும் கட்டாயத்தையும் விளைவுத் தொடர்பையும் தெளிவுபடுத்துகிறது.
- source_word: עֶרְוַת דָּבָר
  choice: வெட்கக்கேடான எதையும்
  rationale: சொற்றொடரின் பரந்த வெட்ககரமான அல்லது தூய்மைக்கேடான பொருளைத் தக்கவைத்து, அதை வெறும் நிர்வாணம் என்று குறுக்கவில்லை.
- source_word: וְשָׁב מֵאַחֲרֶיךָ
  choice: உன்னைவிட்டு விலகிவிட மாட்டார்
  rationale: முகாமுடன் உடன்செல்லும் யாவே அதை விட்டுத் திரும்பிவிடும் அபாயத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது; மூலத்தின் இடவியல் உருவகம் அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: யாவே முகாமில் ‘நடமாடும்’ மனிதவடிவச் சித்திரம்
  choice: ‘உன் முகாமின் நடுவே உலாவுகிறார்’ என்று தெளிவான இயக்க உருவகத்தைத் தக்கவைத்தல்
  alternative: ‘உன் முகாமில் இருக்கிறார்’ என்று அருவமாக மொழிபெயர்த்தல்
  rationale: தெய்வீக அண்மையே முகாமின் பரிசுத்தத்திற்கான அடிப்படை என்பதை மூலத்தின் திட்டமிட்ட சித்திரம் வலியுறுத்துகிறது; இது கடவுளின் உடலமைப்பைப் பற்றிய மேலதிகக் கூற்றைச் சேர்ப்பதில்லை.
- issue: முகாம் பரிசுத்தமாக இருப்பதன் இலக்கண வலிமை
  choice: ‘பரிசுத்தமாக இருக்க வேண்டும்’ என்ற கடமைக் கூறு
  alternative: ‘பரிசுத்தமாக இருக்கும்’ என்ற எதிர்கால அல்லது முன்னறிவிப்புக் கூறு
  rationale: சூழலில் இது வெறும் முன்னறிவிப்பு அல்ல; யாவேயின் உடனிருப்பால் ஏற்படும் கட்டளைசார் கடமை.
- issue: யாவே திரும்பிச் செல்வதன் சித்திரம்
  choice: முதன்மை உரையில் ‘உன்னைவிட்டு விலகிவிட மாட்டார்’ என்றும், நேரடி சித்திரத்தை அடிக்குறிப்பிலும் தருதல்
  alternative: ‘உன் பின்னாலிருந்து திரும்பிவிடுவார்’ என்று சொல்லுக்குச் சொல் வழங்குதல்
  rationale: மூலத்தில் யாவே முகாமுடன் உடன்செல்வதை நிறுத்தும் சித்திரம் உள்ளது. இயல்பான தமிழையும் அந்தச் சித்திரத்தின் பொருளையும் இரண்டையும் இம்முறை காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், ஒருமை இரண்டாம் நபர் அழைப்பைத் தொடர்ந்து காக்கும் மரியாதைமிக்க, எளிதில் புரியும் நடை. ‘பரிசுத்தம்’ போன்ற நிலைபெற்ற வேதாகமச் சொல்லாட்சி தேவையான இடத்தில் மட்டும் பயன்படுத்தப்பட்டுள்ளது; எபிரேய உருவகங்களும் தெளிவின்மையும் இயன்றவரை காக்கப்பட்டுள்ளன.
