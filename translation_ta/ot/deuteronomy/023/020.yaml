  variant: modern standard Tamil
source:
  edition: WLC
  text: לֹא תַשִּׁ֣יךְ לְ/אָחִ֔י/ךָ נֶ֥שֶׁךְ כֶּ֖סֶף נֶ֣שֶׁךְ אֹ֑כֶל נֶ֕שֶׁךְ כָּל דָּבָ֖ר אֲשֶׁ֥ר יִשָּֽׁךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/020.yaml
  text: You shall not charge your brother interest on money[a], interest on food[c][b], or interest on anything that is lent at interest.
translation:
  language: ta
  text: உன் சகோதரனுக்கு நீ பணத்திற்கான வட்டியையோ, உணவிற்கான வட்டியையோ, வட்டி வசூலிக்கப்படும் வேறு எதற்குமான வட்டியையோ வசூலிக்கக் கூடாது.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘உன் சகோதரன்’ என்பது ‘உன் சக இஸ்ரவேலன்’ அல்லது ‘உன் இனத்தான்’ என்றும் பொருள்படலாம்; எபிரெயத்தில் சொல்லுக்குச் சொல் ‘உன் சகோதரன்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: תַשִּׁיךְ
  choice: வட்டி வசூலிக்க
  rationale: נשׁך என்பதன் ஹிஃபில் வடிவம் இங்கு கடன் கொடுப்பவர் வட்டியை விதித்து வாங்குவதைக் குறிக்கிறது; நவீன தமிழில் ‘வட்டி வசூலிக்க’ என்பது இயல்பான சட்டநடைச் சொற்றொடர்.
- source_word: לְאָחִיךָ
  choice: உன் சகோதரனிடம்
  rationale: எபிரெயச் சொல் நேரடியாக ‘உன் சகோதரன்’ எனப் பொருள்பட்டு, உடன்படிக்கைச் சமூகத்தின் குடும்ப உறவுச் சித்திரத்தைப் பேணுகிறது.
- source_word: נֶשֶׁךְ
  choice: வட்டி
  rationale: இது பொதுவாகக் கடனுக்கான வட்டியைக் குறிக்கிறது; அளவுக்கு மீறிய வட்டியை மட்டும் குறிக்கும் சொல்லாகச் சுருக்கப்படவில்லை.
- source_word: כֶּסֶף
  choice: பணம்
  rationale: அடிப்படைப் பொருள் ‘வெள்ளி’ என்றாலும், இச்சட்டப் பொருளாதாரச் சூழலில் அது பணத்தைக் குறிக்கிறது.
- source_word: אֹכֶל
  choice: உணவுப்பொருள்
  rationale: கடனாக வழங்கப்படக்கூடிய உணவுப் பொருட்களைத் தெளிவாகவும் இயல்பாகவும் குறிக்கிறது.
- source_word: כָּל דָּבָר
  choice: வேறு எதற்கான
  rationale: பணம், உணவு ஆகியவற்றைத் தாண்டி தடை எல்லாவற்றுக்கும் பொருந்துவதை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: אֲשֶׁר יִשָּׁךְ
  choice: வட்டி விதிக்கக்கூடிய
  rationale: வட்டி சுமத்தப்படும் எந்தப் பொருள் அல்லது கடனையும் குறிக்கும் எபிரெய உறவுப்பெயர் வாக்கியத்தின் பொதுவான வரம்பைப் பேணுகிறது.
theological_decisions:
- issue: ‘சகோதரன்’ என்பதன் சமூக வரம்பு
  choice: முதன்மை உரையில் ‘உன் சகோதரன்’ என்று நேரடியாகப் பேணப்பட்டது.
  alternative: ‘உன் சக இஸ்ரவேலன்’ அல்லது ‘உன் இனத்தான்’
  rationale: ‘சகோதரன்’ என்ற மூல உருவகம் உடன்படிக்கைச் சமூகத்தின் குடும்பப்பிணைப்பை வெளிப்படுத்துகிறது; அதன் வரம்பை முதன்மை உரையிலேயே விளக்கி முடிவுசெய்வதைத் தவிர்க்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சட்டக் கட்டளைக்கேற்ற கண்ணியமான நேரடி நடையில் மொழிபெயர்க்கப்பட்டது. எபிரெய வாக்கியத்தின் மீளுரைத்த பட்டியல் அமைப்பு முடிந்தவரை பேணப்பட்டுள்ளதுடன், தமிழில் இயல்பாகப் புரிய ‘பணத்திற்கான/உணவுப்பொருளுக்கான வட்டி’ என்ற அமைப்பு பயன்படுத்தப்பட்டது.
