base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/004.yaml
  text: No Ammonite or Moabite may enter the assembly of Yahweh[a]; even to the tenth generation[b], none of them may enter the assembly of Yahweh forever.
translation:
  language: ta
  text: அம்மோனியரோ மோவாபியரோ யாவேயின் சபைக்குள் நுழையக்கூடாது.[a] பத்தாம் தலைமுறை வரையிலும் கூட,[b] அவர்களில் எவரும் யாவேயின் சபைக்குள் என்றென்றைக்கும் நுழையக்கூடாது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யாவேயின் கூட்டம்.”
    reason: lexical_alternative
  - marker: b
    text: எபிரெய உரையில் “பத்தாம் தலைமுறை வரையிலும்” என்றும் “என்றென்றைக்கும்” என்றும் இரண்டும் வருகின்றன; ஒரு சொற்றொடரை மற்றொன்றுக்குள் கரைத்துவிடாமல், நீடித்த விலக்கின் வலிமையை உரை காக்கிறது.
    reason: cultural_note
lexical_decisions:
- source_word: יָבֹא
  choice: சேர அனுமதிக்கப்பட மாட்டான்
  rationale: சட்டச் சூழலில் לֹא உடன் வரும் வினை, வெறும் இடப்பெயர்ச்சியை அல்லாமல் அனுமதி மறுக்கப்படுவதைத் தெரிவிக்கிறது; இத்தமிழாக்கம் அந்தச் சட்டப் பொருளை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: עַמּוֹנִי וּמוֹאָבִי
  choice: அம்மோனியனோ மோவாபியனோ
  rationale: இவை இனத்தைக் குறிக்கும் ஒருமை ஆண்பால் சொற்கள்; தமிழில் வழக்கமான இனப்பெயர்களாகவும் ‘அல்லது’ என்ற இணைப்புப் பொருளுடனும் வழங்கப்பட்டுள்ளன.
- source_word: קְהַל
  choice: சபை
  rationale: இங்கு உடன்படிக்கைச் சமூகத்தின் அதிகாரப்பூர்வக் கூடுகையை குறிக்கிறது. ‘சபை’ என்பது சுருக்கமான, dignified, பரவலாகப் புரியக்கூடிய தமிழ் சொல்; ‘கூட்டம்’ என்பது மிகப் பொதுவானதாக இருக்கலாம்.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், எபிரெய நான்கெழுத்துப் பெயரின் தமிழாக்கமாக வழங்குகிறது.
- source_word: גַּם דּוֹר עֲשִׂירִי
  choice: பத்தாம் தலைமுறை வரையிலும்
  rationale: தடையின் தீவிரத்தையும் தலைமுறைச் சூத்திரத்தையும் இயல்பான தமிழில் காக்கிறது.
- source_word: לָהֶם
  choice: அவர்களில் ஒருவனும்
  rationale: சொல்லுக்குச் சொல் ‘அவர்களுக்கு’ என்பது தமிழில் தெளிவற்றதாக இருக்கும்; சூழலில் அந்த மக்களினத்தைச் சேர்ந்த ஒருவரையும் குறிக்கும் பொருள் வெளிப்படையாகத் தரப்பட்டுள்ளது.
- source_word: עַד עוֹלָם
  choice: என்றென்றைக்கும்
  rationale: நீடித்த கால அளவைத் தெளிவாகக் காட்டுகிறது; ‘பத்தாம் தலைமுறை’ என்ற முந்தைய சொற்றொடருடன் சேர்த்து இரண்டையும் அப்படியே பாதுகாக்கிறது.
theological_decisions:
- issue: ‘பத்தாம் தலைமுறை வரையிலும்’ என்பதற்கும் ‘என்றென்றைக்கும்’ என்பதற்கும் இடையிலான தொடர்பு
  choice: இரண்டு காலக் குறிப்புகளையும் முதன்மை உரையில் வைத்திருத்தல்
  alternative: ‘பத்தாம் தலைமுறை’ என்பதை வெறுமனே ‘ஒருபோதும் இல்லை’ என்ற மரபுத்தொடராகக் கருதி ஒன்றாக்குதல்
  rationale: எபிரெய உரை இரண்டு சொற்றொடர்களையும் கொண்டுள்ளது. அவற்றுக்கிடையிலான வலிமையையும் சாத்தியமான பதற்றத்தையும் மொழிபெயர்ப்பு தீர்த்துவிடாமல் பாதுகாக்க வேண்டும்.
translation_notes:
  register: நவீன நிலையான தமிழில், சட்டவிதிக்கேற்ற கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘சேர அனுமதிக்கப்பட மாட்டான்’ என்பது தடை/தகுதிநீக்கப் பொருளைத் தெளிவாக்குகிறது; எபிரெய ஒருமை ஆண்பால் அமைப்பும் இயன்றவரை பாதுகாக்கப்பட்டுள்ளது.
