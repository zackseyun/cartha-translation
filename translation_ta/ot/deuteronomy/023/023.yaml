source:
  edition: WLC
  text: וְ/כִ֥י תֶחְדַּ֖ל לִ/נְדֹּ֑ר לֹֽא יִהְיֶ֥ה בְ/ךָ֖ חֵֽטְא־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/023.yaml
  text: But if you refrain from making a vow[a], there will be no sin in you.
translation:
  language: ta
  text: ஆனால், நீ நேர்ச்சை செய்யத் தவிர்த்தால், உனக்குப் பாவம் இராது.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உன்மேல் குற்றப்பொறுப்பு இராது.”
    reason: חֵטְא (‘பாவம்; குற்றம்/குற்றப்பொறுப்பு’) மற்றும் בְּךָ ஆகியவை இணைந்து, பாவம் இல்லாமையோடு ஒருவர்மேல் குற்றப்பொறுப்பு இல்லாமையையும் குறிக்கலாம்.
lexical_decisions:
- source_word: וְ/כִי
  choice: ஆனால் ... இருந்தால்
  rationale: முந்தைய வசனத்தில் நேர்ச்சையை நிறைவேற்ற வேண்டிய கடமையுடன் முரண்படுத்தும் நிபந்தனையை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: תֶחְדַּל
  choice: செய்யாமல் இருந்தால்
  rationale: חדל என்பதன் ‘தவிர்த்தல், விலகியிருத்தல்’ என்ற பொருளை, இங்கு ஒரு நேர்ச்சையை மேற்கொள்ளாதிருப்பதாக இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: לִנְדֹּר
  choice: நேர்ச்சை செய்ய
  rationale: נדר என்பது கடவுளிடம் மனமுவந்து உறுதிமொழி ஏற்கும் செயலைக் குறிக்கிறது; ‘நேர்ச்சை செய்தல்’ என்பது அதற்கான தெளிவான, தற்போதைய தமிழ் வழக்கு.
- source_word: לֹא יִהְיֶה
  choice: இராது
  rationale: எதிர்கால அல்லது விளைவு சார்ந்த மறுப்பு இருப்பைச் சுருக்கமாகவும் இயல்பாகவும் காட்டுகிறது.
- source_word: בְ/ךָ
  choice: உனக்கு
  rationale: எபிரேய மொழியின் ‘உன்னில்’ என்ற சொற்சார்ந்த வடிவத்தைத் தமிழில் குற்றப் பொறுப்பைக் குறிக்கும் இயல்பான ‘உனக்கு’ என வழங்குகிறது; ‘உன்மேல்’ என்ற நுணுக்கம் அடிக்குறிப்பில் காக்கப்படுகிறது.
- source_word: חֵטְא
  choice: பாவம்
  rationale: இச்சூழலில் நேர்ச்சை செய்யாதிருப்பது பாவமல்ல என்ற அறநெறி-சட்டக் கருத்தை நேரடியாகக் காட்டுகிறது; ‘குற்றம்/குற்றப்பொறுப்பு’ என்ற சாத்தியமான நுணுக்கம் அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: நேர்ச்சை செய்யாமல் இருப்பதன் அறநெறி நிலை
  choice: ஒருவர் நேர்ச்சை செய்யாமல் இருப்பது பாவம் அல்ல.
  alternative: இது குறுகிய அறநெறிப் பொருளில் பாவம் இல்லை என்பதைக் காட்டுவதற்குப் பதிலாக, அவர்மேல் குற்றமோ குற்றப்பொறுப்போ இல்லை என்பதை வலியுறுத்தலாம்.
  rationale: חֵטְא என்பது ‘பாவம்’ என்றும் ‘குற்றம்/குற்றப்பொறுப்பு’ என்றும் பொருள்படலாம். சூழல், நேர்ச்சை செய்யாதிருப்பதையும் செய்த நேர்ச்சையை நிறைவேற்றாதிருப்பதையும் வேறுபடுத்துகிறது. முதன்மைப் பொருளில் ‘பாவம்’ வைக்கப்பட்டு, சட்டரீதியான குற்ற நுணுக்கம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிமையானதும் கண்ணியமானதுமான நடை. ‘நேர்ச்சை’ என்பது கடவுளிடம் செய்யப்படும் vow என்பதைப் பொதுவாகப் புரியவைக்கும் சொல்; பழமையான கூட்டுவினை வடிவங்கள் தவிர்க்கப்பட்டுள்ளன.
