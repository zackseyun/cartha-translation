revisions:
- from: 'ஆனால் நீ நேர்ச்சை செய்யாமல் இருந்தால், உனக்குப் பாவம் இராது.[a]


    [a] அல்லது, “உன்மேல் குற்றம் இராது.”'
  to: ஆனால், நீ நேர்ச்சை செய்யத் தவிர்த்தால், உனக்குப் பாவம் இராது.[a]
  rationale: தெஹ்தால் (תֶחְדַּל) என்பதன் செயற்பாட்டு ‘தவிர்த்தல்’ பொருளைத் தெளிவாகக் காட்டுவதற்காக மட்டும் முதன்மை உரை திருத்தப்பட்டுள்ளது. அடிக்குறிப்பு, எபிரேயத்தின் ‘பாவம்’ மற்றும் ‘குற்றப்பொறுப்பு’ என்ற இரு சாத்திய நுணுக்கங்களையும் பாதுகாக்கிறது.
