  source_fidelity: The Tamil accurately renders the conditional legal case, the male referent, ritual non-cleanness resulting from the Hebrew idiom מִקְּרֵה לָיְלָה, exclusion outside the camp, and prohibition from returning to its interior. “தீட்டுப்பட்டிருந்தால்” suitably communicates a ritual state in this register, and the note correctly preserves and explains the Hebrew euphemism.
