source:
  edition: WLC
  text: כִּֽי יִהְיֶ֤ה בְ/ךָ֙ אִ֔ישׁ אֲשֶׁ֛ר לֹא יִהְיֶ֥ה טָה֖וֹר מִ/קְּרֵה לָ֑יְלָה וְ/יָצָא֙ אֶל מִ/ח֣וּץ לַֽ/מַּחֲנֶ֔ה לֹ֥א יָבֹ֖א אֶל תּ֥וֹךְ הַֽ/מַּחֲנֶֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/011.yaml
  text: If there is among you a man who is not clean because of a nocturnal emission[a], he shall go outside the camp; he shall not come into the midst of the camp.
translation:
  language: ta
  text: உங்களிடையே ஒருவன் இரவில் ஏற்பட்ட விந்து வெளியேற்றத்தால்[a] தீட்டுப்பட்டிருந்தால், அவன் முகாமுக்கு வெளியே செல்ல வேண்டும்; அவன் முகாமின் நடுவே வரக் கூடாது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரேயத்தில், “இரவின் நிகழ்வு”; இது இரவில் ஏற்படும் விந்து வெளியேற்றத்தைக் குறிக்கும் மறைமொழி.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: …இருந்தால்
  rationale: சட்ட வழக்கை அறிமுகப்படுத்தும் நிபந்தனைப் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: יִהְיֶה בְךָ אִישׁ
  choice: உங்களிடையே ஒருவன்
  rationale: היה என்பதன் இருப்புப் பொருளையும் בְךָ என்பதன் சமூகச் சூழலையும் சுருக்கமாகத் தக்கவைக்கிறது; குறிப்பிட்ட உடல்நிலை ஆணைச் சார்ந்ததால் ‘ஒருவன்’ பயன்படுத்தப்படுகிறது.
- source_word: אֲשֶׁר לֹא יִהְיֶה טָהוֹר
  choice: தீட்டுப்பட்டிருந்தால்
  rationale: சடங்குசார் தூய்மையின்மையைக் குறிக்கிறது; ஒழுக்கக் குற்றத்தை உணர்த்தாமல் இச்சூழலில் வழக்கமான வேதாகமத் தமிழை வழங்குகிறது.
- source_word: מִקְּרֵה לָיְלָה
  choice: இரவில் ஏற்பட்ட விந்து வெளியேற்றத்தால்
  rationale: ‘இரவின் நிகழ்வு’ என்ற எபிரேய மறைமொழியின் உடலியல் குறிப்பைத் தெளிவாகவும் கண்ணியமாகவும் வெளிப்படுத்துகிறது.
- source_word: וְיָצָא אֶל מִחוּץ לַמַּחֲנֶה
  choice: அவன் முகாமுக்கு வெளியே செல்ல வேண்டும்
  rationale: சட்டக் கட்டளையின் வலிமையையும் முகாமின் எல்லைக்கு அப்பால் செல்லும் இயக்கத்தையும் இயல்பான தமிழில் தருகிறது.
- source_word: לֹא יָבֹא אֶל תּוֹךְ הַמַּחֲנֶה
  choice: அவன் முகாமின் நடுவே வரக் கூடாது
  rationale: תּוֹךְ என்பதிலுள்ள ‘உட்பகுதி/நடுவே’ என்ற நுணுக்கத்தைத் தட்டையாக்காமல் காக்கிறது.
theological_decisions:
- issue: இவ்வசனத்தில் தீட்டின் தன்மை
  choice: ஒழுக்கக் குற்றமாக அல்லாமல் சடங்குசார் தீட்டாக மொழிபெயர்த்தல்
  alternative: ஒழுக்கத் தவறைக் குறிக்கும் அசுத்தமாகப் புரிந்துகொள்ளுதல்
  rationale: சூழல் முகாமின் பரிசுத்தத்தையும் உடல்சார் தீட்டையும் பற்றியது; தனிப்பட்ட பாவம் அல்லது குற்றத்தை வசனம் கூறவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில் தெளிவான, கண்ணியமான சட்டநடை பயன்படுத்தப்பட்டுள்ளது. ‘தீட்டுப்பட்டிருந்தால்’ என்பது இங்கு சடங்குசார் நிலையை மட்டும் குறிக்கிறது; ஒழுக்கக் குற்றத்தை அல்ல. அடிக்குறிப்பு குறியீடு முதன்மை உரையில் சேர்க்கப்பட்டுள்ளது.
