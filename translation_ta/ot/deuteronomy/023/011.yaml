  terminology: “விந்து வெளியேற்றம்” is accurate, clinically respectful, and appropriate for the bodily event intended. “தீட்டுப்பட்ட” is established Tamil biblical terminology for ritual impurity and does not inherently assert moral guilt in this context. “முகாம்” consistently renders the camp setting.
