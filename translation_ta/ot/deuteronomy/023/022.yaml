base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/022.yaml
  text: But if you make a vow to Yahweh your God[a], you shall not delay in paying it, for Yahweh your God will surely require it from you, and it will be sin in you.
translation:
  language: ta
  text: ஆனால், உன் கடவுளாகிய யாவேக்கு நீ ஒரு நேர்த்திக்கடன் செய்தால், அதைச் செலுத்தத் தாமதிக்கக் கூடாது. ஏனெனில், உன் கடவுளாகிய யாவே அதை உன்னிடமிருந்து நிச்சயமாகக் கேட்பார்; அது உனக்குப் பாவமாகும்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நீ பாவக்குற்றத்துக்கு உள்ளாவாய்.” எபிரெயத்தில் சொல்லுக்குச் சொல், “அது உன்னில் பாவமாக இருக்கும்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ஆனால் … செய்தால்
  rationale: முந்தைய வசனத்துடன் உள்ள மென்மையான முரண்பாட்டையும் இங்குள்ள நிபந்தனைப் பொருளையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: תִדֹּר נֶדֶר
  choice: ஒரு நேர்த்திக்கடன் செய்தால்
  rationale: ஒரே வேர்ச்சொல்லைக் கொண்ட எபிரெய வினை–பெயர்ச்சொல் தொடரைச் சொற்சொல்லாக மீளுரைக்காமல், கடவுளிடம் செய்யப்படும் உறுதிமொழியைத் தெளிவாகக் குறிக்கும் வழக்கமான தமிழ்ச் சொற்றொடர்.
- source_word: לַיהוָה אֱלֹהֶיךָ
  choice: உன் கடவுளாகிய யாவேக்கு
  rationale: לְ முன்னொட்டு நேர்த்திக்கடனின் பெறுநரைக் குறிக்கிறது; יהוה என்ற உடன்படிக்கைப் பெயர் ‘யாவே’ என்று ஒலிபெயர்க்கப்படுகிறது.
- source_word: לֹא תְאַחֵר
  choice: தாமதிக்கக் கூடாது
  rationale: சட்ட அறிவுறுத்தலில் வரும் மறுப்பு வினையை நவீனத் தமிழில் இயல்பாகவும் கட்டாயத் தன்மையுடனும் தருகிறது.
- source_word: לְשַׁלְּמוֹ
  choice: அதைச் செலுத்த
  rationale: שלם என்பது நேர்த்திக்கடன் சூழலில் வாக்களித்ததை நிறைவேற்றுதல் அல்லது செலுத்துதல் எனப் பொருள்படும்; ‘செலுத்த’ என்பது அதன் தெளிவான கடமைத் தன்மையைப் பேணுகிறது.
- source_word: דָּרֹשׁ יִדְרְשֶׁנּוּ
  choice: அதை … நிச்சயமாகக் கேட்பார்
  rationale: முற்றுப்பெயரெச்சமும் வினையும் சேர்ந்த எபிரெய வலியுறுத்தலை ‘நிச்சயமாக’ என்பதன் மூலம் வெளிப்படுத்துகிறது; இங்கு ‘கேட்பார்’ என்பது வாக்களித்ததைத் தரும்படி கோருவார் என்ற பொருளில் வருகிறது.
- source_word: מֵעִמָּךְ
  choice: உன்னிடமிருந்து
  rationale: நேர்த்திக்கடனைச் செய்தவரிடமிருந்து அதன் நிறைவேற்றம் கோரப்படும் என்பதை நேரடியாகக் காட்டுகிறது.
- source_word: וְהָיָה בְךָ חֵטְא
  choice: அது உனக்குப் பாவமாகும்
  rationale: எபிரெய மொழியின் சுருக்கமான சொல்லாக்கத்தை இயல்பான தமிழில் தருகிறது; பாவமும் அதனால் வரும் குற்றப்பொறுப்பும் இதில் வேண்டுமென்றே முழுமையாகப் பிரித்துத் தீர்மானிக்கப்படவில்லை.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலத்தில் நான்கெழுத்து இறைப் பெயர் நேரடியாக இருப்பதால், பொதுப்பட்டப் பெயராக மாற்றாமல் ‘யாவே’ என்று ஒலிபெயர்க்கப்படுகிறது.
- issue: וְהָיָה בְךָ חֵטְא என்பதிலுள்ள பாவம்–குற்றப்பொறுப்பு உறவு
  choice: அது உனக்குப் பாவமாகும்
  alternative: நீ பாவக்குற்றத்துக்கு உள்ளாவாய்
  rationale: மாற்று வாசகம் குற்றப்பொறுப்பை வெளிப்படையாக விளக்கினாலும், மூலத்தின் ‘உன்னில்/உன்னிடம் பாவம் இருக்கும்’ என்ற இறுக்கமான மற்றும் ஓரளவு தெளிவுறுத்தப்படாத அமைப்பை முதன்மை வாசகம் சிறப்பாகப் பேணுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான சட்ட–உபதேச நடையில் அமைக்கப்பட்டது. ஒருமை இரண்டாம் நபர் வடிவங்கள் மூலத்துக்கு ஏற்ப பேணப்பட்டுள்ளன; ‘நேர்த்திக்கடன்’, ‘செலுத்துதல்’ ஆகியவை வழிபாட்டு உறுதிமொழியின் கடமைத் தன்மையை வெளிப்படுத்துகின்றன.
