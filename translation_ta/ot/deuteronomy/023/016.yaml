source:
  edition: WLC
  text: לֹא תַסְגִּ֥יר עֶ֖בֶד אֶל אֲדֹנָ֑י/ו אֲשֶׁר יִנָּצֵ֥ל אֵלֶ֖י/ךָ מֵ/עִ֥ם אֲדֹנָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/016.yaml
  text: You shall not hand over to his master a servant who has escaped from his master to you[a].
translation:
  language: ta
  text: தன் எஜமானிடமிருந்து தப்பி உன்னிடம் வந்த ஓர் அடிமையை அவனுடைய எஜமானிடம் ஒப்படைக்கக் கூடாது.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அடிமை” என்பதற்கான எபிரெயச் சொல் பணியாளரையும் அடிமையையும் குறிக்கலாம். இங்கு அந்த நபர் எஜமானின் அதிகாரத்திலிருந்து தப்பிவந்த நிலை மையமாக இருப்பதால் “அடிமை” என்று மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַסְגִּיר
  choice: ஒப்படைக்கக் கூடாது
  rationale: הפעיל வடிவிலுள்ள סגר இங்கு ஒருவரை இன்னொருவரின் கட்டுப்பாட்டில் ஒப்படைப்பதைக் குறிக்கிறது. ‘ஒப்படை’ என்பது சட்டச் சூழலின் வலிமையை இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: עֶבֶד
  choice: அடிமை
  rationale: இந்தச் சட்டத்தில் அந்த நபர் எஜமானின் அதிகாரத்திலிருந்து தப்பிவந்த நிலையே மையமாக இருப்பதால், ‘வேலைக்காரன்’ என்பதைவிட பிணைக்கப்பட்ட சமூக நிலையைக் காட்டும் ‘அடிமை’ பொருத்தமானது.
- source_word: אֶל אֲדֹנָיו
  choice: அவனுடைய எஜமானிடம்
  rationale: இந்தச் சமூக-சட்டச் சூழலில் אָדוֹן என்பது இறைப்பட்டம் அல்ல; அடிமையின் எஜமானைக் குறிக்கிறது.
- source_word: אֲשֶׁר יִנָּצֵל
  choice: தப்பி ... வந்த
  rationale: נצל என்பதன் Niphal வடிவம் ‘மீட்கப்படுதல்’ அல்லது ‘தப்புதல்’ எனப் பொருள்படலாம். எஜமானிடமிருந்து வந்து சேர்ந்த அடிமையைப் பற்றிய இச்சூழலில் ‘தப்பி வந்த’ என்பது இயல்பான பொருள்; தொடர்புச் சொல்லின் விசேஷணத் தன்மையும் காக்கப்படுகிறது.
- source_word: אֵלֶיךָ
  choice: உன்னிடம்
  rationale: אֶל என்பது உரையாடப்படுபவரை நோக்கிய இயக்கத்தைக் குறிக்கிறது; ‘உன்னிடம்’ அந்தத் திசைநோக்கை இயல்பாகத் தருகிறது.
- source_word: מֵעִם אֲדֹנָיו
  choice: தன் எஜமானிடமிருந்து
  rationale: מֵעִם எஜமானுடனான தொடர்பிலிருந்து பிரிவதைக் குறிக்கிறது. தமிழில் ‘எஜமானிடமிருந்து’ என்பது துல்லியமும் இயல்பும் உடையது.
theological_decisions:
- issue: עֶבֶד என்பதன் சமூக நிலை
  choice: அடிமை
  alternative: வேலைக்காரன் / பணியாளர்
  rationale: எஜமானின் அதிகாரத்திலிருந்து தப்பிய நபரைத் திருப்பி ஒப்படைக்கக் கூடாது என்பதே வசனத்தின் கருத்து. ஆகவே சார்பு அல்லது உடைமைக்கு உட்பட்ட நிலையைக் காட்டும் ‘அடிமை’ மூலச்சொல்லின் வலிமையைச் சிறப்பாகப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சட்டக் கட்டளையின் நேரடித் தொனியைப் பேணும் கண்ணியமான நடை. ஒருமை இரண்டாம் நபரான אֵלֶיךָ என்பதற்காக ‘உன்னிடம்’ பயன்படுத்தப்பட்டது; ‘தன் எஜமானிடமிருந்து’ என்பது முன்வரும் அடிமையையே இயல்பாகச் சுட்டுகிறது.
