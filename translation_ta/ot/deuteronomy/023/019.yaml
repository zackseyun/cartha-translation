source:
  edition: WLC
  text: לֹא תָבִיא֩ אֶתְנַ֨ן זוֹנָ֜ה וּ/מְחִ֣יר כֶּ֗לֶב בֵּ֛ית יְהוָ֥ה אֱלֹהֶ֖י/ךָ לְ/כָל נֶ֑דֶר כִּ֧י תוֹעֲבַ֛ת יְהוָ֥ה אֱלֹהֶ֖י/ךָ גַּם שְׁנֵי/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/019.yaml
  text: You shall not bring the wages of a prostitute or the price of a dog into the house of Yahweh your God for any vow[a], because both of them are an abomination to Yahweh your God.
translation:
  language: ta
  text: விபசாரப் பெண்ணின் கூலியையோ, நாயின் விலையையோ எந்த நேர்த்திக்கடனுக்காகவும் உன் இறைவனாகிய யாவேயின் இல்லத்திற்குள் கொண்டுவரக் கூடாது[a]. ஏனெனில், உன் இறைவனாகிய யாவேக்கு இவ்விரண்டுமே அருவருப்பானவை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘ஆண் விபசாரியின் கூலி’; இங்கே ‘நாய்’ என்பது வழிபாட்டுச் சார்ந்த ஆண் விபசாரியைக் குறிக்கும் இழிவுச்சொல் என்று புரிந்துகொண்டால் இவ்வாறு பொருள்கொள்ளலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: תָבִיא
  choice: கொண்டுவரக் கூடாது
  rationale: בוא என்பதன் ஹிஃபில் வடிவம் ஒன்றை ஓர் இடத்திற்குள் கொண்டுவருவதைக் குறிக்கிறது; தமிழில் தடையின் நேரடியான வலிமையை இது இயல்பாகக் காக்கிறது.
- source_word: אֶתְנַן זוֹנָה
  choice: விபச்சாரியின் கூலி
  rationale: אֶתְנַן என்பது கூலி அல்லது கட்டணம்; זוֹנָה என்பது விபச்சாரி. சுருக்கமாகவும் தெளிவாகவும் மூலத்தின் தொடர்பை இச்சொற்றொடர் வெளிப்படுத்துகிறது.
- source_word: מְחִיר כֶּלֶב
  choice: நாயின் விலை
  rationale: מְחִיר என்பதன் வழக்கமான பொருள் விலை; כֶּלֶב என்பதன் நேரடிப் பொருள் நாய். விவாதத்திற்குரிய உருவகப் பொருளை முதன்மை உரையில் புகுத்தாமல் சொற்பொருள் காக்கப்படுகிறது.
- source_word: בֵּית יְהוָה אֱלֹהֶיךָ
  choice: உன் இறைவனாகிய யாவேயின் இல்லம்
  rationale: בֵּית என்பதற்கு 'இல்லம்' என்று மொழிபெயர்ப்பது 'கோவில்' என்ற காலச்சூழல் சார்ந்த கூடுதல் விளக்கத்தைத் தவிர்க்கிறது; יהוה உடன்படிக்கைப் பெயராக 'யாவே' என ஒலிபெயர்க்கப்படுகிறது.
- source_word: לְכָל נֶדֶר
  choice: எந்த நேர்த்திக்கடனுக்காகவும்
  rationale: נֶדֶר என்பது கடவுளுக்கு நேர்ந்துகொள்ளப்படும் நேர்த்திக்கடன்; לְ முன்னொட்டு இங்கு அதன் நோக்கம் அல்லது தொடர்பைக் காட்டுகிறது.
- source_word: תוֹעֲבַת
  choice: அருவருப்பவை
  rationale: תוֹעֵבָה கடவுளின் பார்வையில் வெறுக்கத்தக்க அல்லது அருவருப்பான ஒன்றைக் குறிக்கும் வலுவான சொல்; தமிழில் இயல்பான வாக்கிய அமைப்போடு அதன் தீவிரம் காக்கப்படுகிறது.
- source_word: גַּם שְׁנֵיהֶם
  choice: இவ்விரண்டுமே
  rationale: குறிப்பிட்ட இரண்டு பொருட்களும் தடைக்குள் அடங்குகின்றன என்ற வலியுறுத்தலை '-மே' இயல்பாகத் தெரிவிக்கிறது.
theological_decisions:
- issue: מְחִיר כֶּלֶב என்பதில் כֶּלֶב என்பதன் பொருள்
  choice: முதன்மை உரையில் நேரடியாக 'நாய்' என மொழிபெயர்த்தல்
  alternative: ஆண் விபச்சாரி அல்லது வழிபாட்டுச் சார்ந்த ஆண் விபச்சாரியைக் குறிக்கும் இழிவுச்சொல்
  rationale: எபிரெயச் சொல்லின் நேரடிப் பொருள் 'நாய்'; உருவகப் பொருள் உறுதியற்றது. ஆகவே உண்மையான விளக்கத் தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: יהוה என்ற இறைப் பெயர்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலத்தில் உடன்படிக்கைப் பெயர் நேரடியாக உள்ளது; அதை பொதுப்பட்டமாக மாற்றாமல் நவீனத் தமிழில் ஏற்ற ஒலிபெயர்ப்பாக 'யாவே' பயன்படுத்தப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான சட்டநடை பயன்படுத்தப்பட்டுள்ளது. ஒருமை இரண்டாம் நபர் உரை காக்கப்பட்டுள்ளது; விவாதத்திற்குரிய பொருள் முதன்மை உரையில் தீர்மானிக்கப்படாமல் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
