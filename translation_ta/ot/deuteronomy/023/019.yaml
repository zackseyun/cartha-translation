  source_fidelity: 'முதன்மை உரை எபிரெய மூலத்தின் அமைப்பையும் முக்கியச் சொற்களையும் நன்றாகப் பின்பற்றுகிறது: ‘நாயின் விலை’ என்ற நேரடியான வாசகமும், நேர்த்திக்கடனுடனான தொடர்பும், யாவே என்ற பெயரும் காக்கப்பட்டுள்ளன. ஆனால் இறுதி வாக்கியத்தில் ‘உன் இறைவனாகிய யாவே அருவருப்பவை’ என்பது இலக்கண ரீதியாக யாவேயே அருவருப்பானவர் எனப் பொருள்பட வாய்ப்புள்ளது. மூலத்தின் ‘யாவேக்கு அருவருப்பானவை’ என்ற பொருளைத் தெளிவாகத் தரத் திருத்தம் வேண்டும்.'
