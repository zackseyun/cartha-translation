base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/024.yaml
  text: You shall keep what has gone out from your lips and do it[a], according to what you vowed to Yahweh your God as a freewill offering[b], which you spoke with your mouth.
translation:
  language: ta
  text: உன் உதடுகளிலிருந்து வெளிவந்ததை நீ கடைப்பிடித்து நிறைவேற்று[a]; உன் கடவுளாகிய யாவேக்கு நீ உன் வாயால் கூறித் தன்னார்வக் காணிக்கையாக நேர்ந்துகொண்டபடியே செய்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘உன் உதடுகள் உரைத்ததை’ அல்லது ‘உன் உதடுகளிலிருந்து புறப்பட்டதை.’
    reason: lexical_alternative
lexical_decisions:
- source_word: מוֹצָא שְׂפָתֶיךָ
  choice: உன் உதடுகளிலிருந்து வெளிவந்ததை
  rationale: מוֹצָא என்பதன் ‘வெளியே வருவது’ என்ற நேரடியான உருவகத்தை இயல்பான தமிழில் காக்கிறது; இங்கு அது வாயால் சொல்லப்பட்ட நேர்த்திக்கடனைக் குறிக்கிறது.
- source_word: תִּשְׁמֹר וְעָשִׂיתָ
  choice: நீ கடைப்பிடித்து நிறைவேற்ற வேண்டும்
  rationale: שׁמר இங்கு சொன்ன உறுதியைக் கடைப்பிடிப்பதையும், עשה அதைச் செயல்படுத்தி நிறைவேற்றுவதையும் குறிக்கின்றன. இரு வினைகளின் தனித்த வலியுறுத்தலும் தமிழில் காக்கப்பட்டுள்ளது.
- source_word: כַּאֲשֶׁר נָדַרְתָּ
  choice: நீ நேர்ந்துகொண்டபடியே
  rationale: נדר என்பது கடவுளுக்கு நேர்த்திக்கடன் செய்வதைக் குறிக்கிறது; ‘நேர்ந்துகொள்’ என்பது இதற்குப் பொருத்தமான, புரிந்துகொள்ளக்கூடிய தமிழ் வழக்கு.
- source_word: לַיהוָה אֱלֹהֶיךָ
  choice: உன் கடவுளாகிய யாவேக்கு
  rationale: יהוה என்ற உடன்படிக்கைப் பெயர் மறைக்கப்படாமல் தமிழில் ‘யாவே’ என ஒலிபெயர்க்கப்படுகிறது.
- source_word: נְדָבָה
  choice: மனமுவந்து செலுத்தும் காணிக்கையாக
  rationale: இந்தச் சொல் கட்டாயத்தால் அல்லாமல் விருப்பத்துடன் அளிக்கப்படும் காணிக்கையைக் குறிக்கிறது. ‘மனமுவந்து’ என்பது அதன் தன்னார்வத் தன்மையை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: אֲשֶׁר דִּבַּרְתָּ בְּפִיךָ
  choice: உன் வாயால் நீ நேர்ந்துகொண்டபடியே
  rationale: வாக்குறுதி வாயால் சொல்லப்பட்டது என்பதை எபிரெயம் மீண்டும் வலியுறுத்துகிறது; ‘உன் வாயால்’ என்பதைத் தக்கவைத்ததால் அந்த வலியுறுத்தல் பாதுகாக்கப்படுகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலத்தில் இறைவனின் தனிப்பெயரான יהוה நேரடியாக உள்ளது. அதை ஒரு பட்டமாக மாற்றாமல், பொதுவாக ஏற்றுக்கொள்ளப்படும் தமிழொலிப்பில் வழங்குவது மூலத்தின் உடன்படிக்கைப் பெயரைத் தக்கவைக்கிறது.
- issue: விருப்பத்துடன் செய்யப்பட்ட காணிக்கையும் பின்னர் கட்டுப்படுத்தும் நேர்த்திக்கடனும்
  choice: ‘மனமுவந்து செலுத்தும் காணிக்கையாக’ நேர்ந்துகொண்டதை நிறைவேற்ற வேண்டும்
  alternative: வெறும் ‘விருப்பக் காணிக்கை’ என்று மட்டும் கூறுதல்
  rationale: נְדָבָה காணிக்கை ஆரம்பத்தில் விருப்பத்துடன் முன்வைக்கப்பட்டதைச் சுட்டுகிறது; נדר மற்றும் கட்டளை வினைகள், வாயால் நேர்ந்துகொண்ட பின் அதை நிறைவேற்ற வேண்டிய கடமையைச் சுட்டுகின்றன. இந்த இரு அம்சங்களின் பதற்றமும் மொழிபெயர்ப்பில் காக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீனத் தரத் தமிழில், மரியாதையும் தெளிவும் கொண்ட நடை பயன்படுத்தப்பட்டுள்ளது. ‘உதடுகளிலிருந்து வெளிவந்தது’ மற்றும் ‘உன் வாயால்’ என்ற எபிரெய உருவகங்களும் மீளுரையும் தேவையின்றி வழுவழுப்பாக்கப்படாமல் தக்கவைக்கப்பட்டுள்ளன.
