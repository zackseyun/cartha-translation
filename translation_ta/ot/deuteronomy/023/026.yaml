  text: When you come into your neighbor’s standing grain[a], you may pluck heads with your hand[b], but you shall not put a sickle to your neighbor’s standing grain.
translation:
  language: ta
  text: உன் அயலானின் வயலில் நிற்கும் தானியப் பயிருக்குள் நீ செல்லும்போது, கதிர்களை உன் கையால் பறித்துக்கொள்ளலாம்; ஆனால் உன் அயலானின் வயலில் நிற்கும் தானியப் பயிரின்மேல் அரிவாளைச் செலுத்தக்கூடாது.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அரிவாளைச் செலுத்தக்கூடாது’ என்பதை ‘அரிவாளை அசைக்கக்கூடாது’ அல்லது ‘அரிவாளைப் பயன்படுத்தக்கூடாது’ என்றும் மொழிபெயர்க்கலாம். எபிரெய வினைச்சொல் அரிவாளை அசைத்தல் அல்லது பயிரின்மேல் பிரயோகித்தல் என்ற படிமத்தைக் கொண்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי תָבֹא
  choice: நீ செல்லும்போது
  rationale: כִּי இங்கு சட்டம் பொருந்தும் சூழலை அறிமுகப்படுத்துகிறது; நிபந்தனைச் சாயலைவிட இயல்பான நிகழ்வுச் சூழலைக் காட்ட ‘செல்லும்போது’ பொருத்தமானது. בוא என்பதன் வருதல்/நுழைதல் பொருளையும் இது சூழலுக்கேற்ப தெரிவிக்கிறது.
- source_word: בְּקָמַת
  choice: விளைந்து நிற்கும் தானியப் பயிருக்குள்
  rationale: קָמָה அறுவடை செய்யப்படாமல் வயலில் நிற்கும் தானியப் பயிரைக் குறிக்கிறது. ‘வயல்’ என்று பொதுமைப்படுத்தாமல் அதன் நிலையை வெளிப்படுத்துகிறது.
- source_word: רֵעֶךָ
  choice: உன் அயலானின்
  rationale: சட்டச் சூழலில் רֵעַ சமூகத்தில் உள்ள மற்றொருவரைக் குறிக்கிறது; ‘அயலான்’ இயல்பான, நிலைபெற்ற தமிழ் இணைச்சொல்.
- source_word: וְקָטַפְתָּ
  choice: பறித்துக்கொள்ளலாம்
  rationale: வடிவில் எளிய வினைச்சொல்லாக இருந்தாலும், எதிர்வரும் தடையுடன் ஒப்பிடும்போது இது அனுமதியைக் குறிக்கிறது. ‘லாம்’ அந்த அனுமதிப் பொருளைத் தெளிவாக்குகிறது.
- source_word: מְלִילֹת
  choice: கதிர்களை
  rationale: מְלִילֹת தானிய மணிகள் தாங்கிய கதிர்களைக் குறிக்கிறது; தமிழில் ‘கதிர்கள்’ சுருக்கமாகவும் வேளாண்மைச் சூழலில் தெளிவாகவும் உள்ளது.
- source_word: בְּיָדֶךָ
  choice: உன் கையால்
  rationale: அனுமதிக்கப்பட்ட முறையான கையால் மட்டும் பறித்தலை நேரடியாகப் பாதுகாக்கிறது.
- source_word: וְחֶרְמֵשׁ לֹא תָנִיף
  choice: ஆனால் ... அரிவாளை வீசக் கூடாது
  rationale: וְ இங்கு கையால் பறித்தலுக்கும் கருவியால் அறுவடை செய்வதற்கும் இடையிலான முரண்பாட்டைக் காட்டுவதால் ‘ஆனால்’ என வழங்கப்பட்டது. נוף என்பதன் அசைத்தல்/வீசுதல் சார்ந்த படிமத்தை ‘வீச’ பாதுகாக்கிறது; தமிழில் அரிவாளைப் பயிரின்மேல் செயல்படுத்தும் பொருளும் விளங்குகிறது.
- source_word: עַל קָמַת רֵעֶךָ
  choice: உன் அயலானின் விளைந்து நிற்கும் தானியப் பயிரின்மேல்
  rationale: עַל என்பதன் ‘மேல்’ உறவை முறையாகப் பாதுகாத்து, தடையின் பொருள் அறுவடை செய்யப்படாத அயலானின் பயிரே என்பதை மீண்டும் தெளிவாக்குகிறது.
theological_decisions:
- issue: கையால் கதிர்களைப் பறிப்பது கட்டளையா அல்லது அனுமதியா
  choice: 'அனுமதி: ‘பறித்துக்கொள்ளலாம்’'
  alternative: ‘பறித்துக்கொள்’ அல்லது ‘பறிப்பாய்’
  rationale: சட்டத்தின் எதிர்மறை இரண்டாம் பகுதி கருவியால் அறுவடை செய்வதைத் தடுக்கிறது; முதல் பகுதி வரையறுக்கப்பட்ட அனுமதியை வழங்குகிறது. இதை கட்டளையாக மாற்றாமல் சூழல்சார் சட்ட வலிமை பாதுகாக்கப்பட்டது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு விளங்கும் மரியாதைமிக்க ஒருமை நடை பயன்படுத்தப்பட்டது. ‘விளைந்து நிற்கும் தானியப் பயிர்’ என்பது மூலத்தின் agricultural specificity-ஐ காக்கிறது; ‘கதிர்கள்’ மற்றும் ‘அரிவாள்’ இயல்பான வேளாண்மைச் சொற்கள். பிரதான உரையில் உள்ள [a] குறியீடு அடிக்குறிப்புடன் பொருந்துகிறது.
