  text: עַל דְּבַ֞ר אֲשֶׁ֨ר לֹא קִדְּמ֤וּ אֶתְ/כֶם֙ בַּ/לֶּ֣חֶם וּ/בַ/מַּ֔יִם בַּ/דֶּ֖רֶךְ בְּ/צֵאתְ/כֶ֣ם מִ/מִּצְרָ֑יִם וַ/אֲשֶׁר֩ שָׂכַ֨ר עָלֶ֜י/ךָ אֶת בִּלְעָ֣ם בֶּן בְּע֗וֹר מִ/פְּת֛וֹר אֲרַ֥ם נַהֲרַ֖יִם לְ/קַֽלְלֶֽ/ךָּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/005.yaml
  text: because they did not meet you with bread and water on the way when you came out from Egypt[a], and because he hired Balaam son of Beor from Pethor of Aram-naharaim against you to curse you.
translation:
  language: ta
  text: நீங்கள் எகிப்திலிருந்து புறப்பட்டு வந்தபோது, வழியில் அவர்கள் அப்பமும் தண்ணீரும் கொண்டு உங்களை எதிர்கொண்டு வராததாலும், உன்னைச் சபிப்பதற்காக அராம்-நஹராயிமின்[a] பெத்தோரிலிருந்து பெயோரின் மகன் பிலேயாமை உனக்கு எதிராக அவன் கூலிக்கு அமர்த்தியதாலும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அராம்-நஹராயிம் பாரம்பரியமாக மெசொப்பொத்தாமியாவுடன் அடையாளப்படுத்தப்படுகிறது; அந்தப் பெயரின் சொற்பொருள் “இரு நதிகளின் அராம்” என்பதாகும்.
    reason: cultural_note
lexical_decisions:
- source_word: עַל דְּבַר
  choice: …வராததாலும்
  rationale: முந்தைய தடைக்கான காரணத்தை அறிமுகப்படுத்தும் எபிரெயச் சொற்றொடரின் காரணப் பொருளை, தமிழில் இயல்பான காரணவினை வடிவில் தருகிறது.
- source_word: קִדְּמוּ אֶתְכֶם
  choice: உங்களை எதிர்கொண்டு வராத
  rationale: உணவுப் பொருட்களுடன் எதிரே சென்று சந்தித்தல் என்ற சூழல்சார் பொருளைப் பாதுகாக்கிறது; ‘வரவேற்காத’ என்பதிலுள்ள கூடுதல் விளக்கத்தைத் தவிர்க்கிறது.
- source_word: בַּלֶּחֶם וּבַמַּיִם
  choice: அப்பமும் தண்ணீரும் கொண்டு
  rationale: இரு மூலமொழிக் concrete பெயர்ச்சொற்களையும் நேரடியாகத் தக்கவைக்கிறது; ‘உணவும் தண்ணீரும்’ என்று பொதுமைப்படுத்தவில்லை.
- source_word: בַּדֶּרֶךְ
  choice: வழியில்
  rationale: இடத்தைக் குறிக்கும் எபிரெயச் சொற்றொடருக்கு இயல்பான, சுருக்கமான தமிழ் இணை.
- source_word: בְּצֵאתְכֶם מִמִּצְרָיִם
  choice: நீங்கள் எகிப்திலிருந்து புறப்பட்டு வந்தபோது
  rationale: காலத்தைக் குறிக்கும் infinitive construct-ஐ இயல்பான தமிழ் காலவாக்கியமாகத் தருவதோடு, எகிப்திலிருந்து வெளியேறிய நிகழ்வையும் தெளிவாக வைத்திருக்கிறது.
- source_word: וַאֲשֶׁר
  choice: …அமர்த்தியதாலும்
  rationale: முதல் காரணத்துக்கு இணையான இரண்டாவது காரணத்தை ‘-ஆலும்’ வடிவால் தொடர்கிறது.
- source_word: שָׂכַר עָלֶיךָ
  choice: உனக்கு எதிராக அவன் கூலிக்கு அமர்த்திய
  rationale: שׂכר என்பதன் ‘கூலிக்கு அமர்த்து’ என்ற பொருளையும், עַל என்பதன் பகைமையான திசையையும் வெளிப்படுத்துகிறது; மூலத்திலுள்ள ஒருமை ஆண்பால் வினையெழுவாயை ‘அவன்’ என்று வெளிப்படையாகக் காட்டுகிறது.
- source_word: בִּלְעָם בֶּן בְּעוֹר
  choice: பெயோரின் மகன் பிலேயாம்
  rationale: தனிப்பெயர்களை ஒலிபெயர்த்து, எபிரெயத் தந்தைவழி அடையாளத்தை இயல்பான தமிழ் வடிவில் தருகிறது.
- source_word: מִפְּתֹר אֲרַם נַהֲרַיִם
  choice: அராம்-நஹராயிமிலுள்ள பெத்தோரிலிருந்து
  rationale: இரு இடப்பெயர்களையும் ஒலிபெயர்த்து, பெத்தோர் அந்தப் பிரதேசத்தில் இருப்பதை இயல்பான தமிழில் காட்டுகிறது; ‘மெசொப்பொத்தாமியா’ என்ற பாரம்பரிய அடையாளத்தை முதன்மை உரைக்குள் இறக்குமதி செய்யவில்லை.
- source_word: לְקַלְלֶךָּ
  choice: உன்னைச் சபிப்பதற்காக
  rationale: நோக்கத்தைக் குறிக்கும் எபிரெய infinitive-இன் நேரடியான பொருளைத் தெளிவாக வழங்குகிறது.
theological_decisions:
- issue: இரண்டாம் நபர் பன்மையிலிருந்து ஒருமைக்கு மாறுதல்
  choice: ‘நீங்கள்/உங்களை’ என்பதிலிருந்து ‘உன்னை/உனக்கு’ என மாறுதல் பாதுகாக்கப்பட்டது
  alternative: முழு வசனத்தையும் ஒரே எண்ணிக்கையில் ஒற்றுமைப்படுத்துதல்
  rationale: மூல எபிரெயத்தில் אתכם மற்றும் בצאתכם பன்மையாகவும், עליך மற்றும் לקללך ஒருமையாகவும் உள்ளன. இந்த உண்மையான இலக்கண மாறுபாட்டை விளக்கமாகச் சீராக்காமல் வைத்திருக்கிறது.
- issue: இரண்டாவது காரணத்தில் கூலிக்கு அமர்த்தியவரின் ஒருமை அடையாளம்
  choice: ‘அவன்’ என ஒருமையைப் பாதுகாத்தல்
  alternative: ‘அவர்கள்’ என்று முன் எழுவாயோடு ஒற்றுமைப்படுத்துதல்
  rationale: שָׂכַר என்பது மூன்றாம் நபர் ஆண்பால் ஒருமை வினை. அதன் சாத்தியமான குறிப்பை உரை தானாகத் தீர்மானிப்பதைவிட, மூலத்தின் இலக்கணத் திடீர்மாற்றத்தைத் தக்கவைக்கிறது.
translation_notes:
  register: நவீன செந்தமிழுக்கு ஏற்ற, கண்ணியமான மற்றும் பொதுவாசகர்களுக்கு எளிதில் புரியும் நடை பயன்படுத்தப்பட்டது. இது முந்தைய வசனத்தின் வாக்கியத்தைத் தொடரும் காரணத் துணைவாக்கியம் என்பதால், இரு காரணங்களும் ‘-ஆலும்’ வடிவில் அமைக்கப்பட்டுள்ளன. மூலத்தில் காணப்படும் பன்மை–ஒருமை மாற்றமும் ஒருமை எழுவாயும் விளக்கமாகச் சீராக்கப்படாமல் பாதுகாக்கப்பட்டுள்ளன.
