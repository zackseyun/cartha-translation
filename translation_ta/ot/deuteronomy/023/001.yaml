source:
  edition: WLC
  text: לֹא יִקַּ֥ח אִ֖ישׁ אֶת אֵ֣שֶׁת אָבִ֑י/ו וְ/לֹ֥א יְגַלֶּ֖ה כְּנַ֥ף אָבִֽי/ו־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/001.yaml
  text: A man shall not take his father’s wife[b][a], nor uncover his father’s skirt.
translation:
  language: ta
  text: ஒருவன் தன் தந்தையின் மனைவியை எடுத்துக்கொள்ளக் கூடாது[a]; தன் தந்தையின் ஆடை விளிம்பை வெளிப்படுத்தவும் கூடாது[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தன் தந்தையின் மனைவியை மணந்துகொள்ளக் கூடாது.”
    reason: lexical_alternative
  - marker: b
    text: சொல்லுக்குச் சொல், “தன் தந்தையின் ஆடை விளிம்பை வெளிப்படுத்தக்கூடாது.” இது பாலுறவைக் குறிக்கும் மறைமொழி; “தன் தந்தையின் நிர்வாணத்தை வெளிப்படுத்துதல்” அல்லது “தன் தந்தையின் திருமணப் படுக்கையை அவமதித்தல்” என்ற கருத்தோடு ஒப்பிடலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: יִקַּח
  choice: எடுத்துக்கொள்ள
  rationale: לָקַח என்பதன் அடிப்படைப் பொருளான ‘எடுத்துக்கொள்’ என்பதையும், ‘மனைவி’ என்பதோடு வரும்போது அதற்கு இருக்கக்கூடிய ‘மணம் செய்துகொள்’ என்ற பொருளையும் இச்சொல் ஓரளவு காக்கிறது; குறிப்பான திருமணப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: אִישׁ
  choice: ஒருவன்
  rationale: ஆண்பால் ஒருமையான எபிரேயச் சொல்லையும், மறுப்புக் கட்டளையின் பொதுவான சட்டநடையையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: אֵשֶׁת אָבִיו
  choice: தன் தந்தையின் மனைவி
  rationale: ‘தன் தந்தையின் மனைவி’ என்பது எபிரேய உறவுமுறையை நேரடியாகக் காக்கிறது; ‘மாற்றாந்தாய்’ என்று மொழிபெயர்ப்பது மூலத்தில் உள்ளதைவிடக் குறுகிய பொருளைத் தரக்கூடும்.
- source_word: יְגַלֶּה
  choice: விலக்கு
  rationale: גלה என்பதன் ‘மூடியிருப்பதை அகற்று/வெளிப்படுத்து’ என்ற கருத்தை ஆடையுடன் இயல்பாகக் கூறுகிறது; பாலியல் மறைமொழியை முதன்மை உரையிலேயே முழுமையாக விளக்கிவிடாமல் காக்கிறது.
- source_word: כְּנַף
  choice: ஆடை ஓரம்
  rationale: כָּנָף என்பதற்கு ‘சிறகு, விளிம்பு, ஆடையின் ஓரம்’ என்ற பொருள்கள் உள்ளன. இங்கு ‘ஆடை ஓரம்’ என்பது உருவகத்தைத் தக்கவைத்து, நவீன தமிழில் தவறாகப் புரியக்கூடிய மிகக் குறிப்பான ஆடைச்சொல்லைத் தவிர்க்கிறது.
theological_decisions:
- issue: பாலியல் மறைமொழியை முதன்மை உரையில் வெளிப்படையாக்க வேண்டுமா?
  choice: ‘தன் தந்தையின் ஆடை ஓரத்தை விலக்கு’ என்ற உருவகத்தைத் தக்கவைத்தல்
  alternative: ‘தன் தந்தையின் நிர்வாணத்தை வெளிப்படுத்து’ அல்லது ‘தன் தந்தையின் திருமண உரிமையை மீறு’
  rationale: எபிரேயம் வழக்கமான ‘நிர்வாணத்தை வெளிப்படுத்துதல்’ என்ற தொடருக்குப் பதிலாக ஆடை ஓரத்தைச் சார்ந்த மறைமொழியைப் பயன்படுத்துகிறது. உருவகத்தைத் தக்கவைப்பது மூலத்தின் திட்டமிட்ட மறைமுகத்தன்மையையும் அதன் இறையியல்/சட்டத் தீவிரத்தையும் முன்கூட்டியே ஒரே விளக்கமாக முடிவுசெய்யாமல் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சட்டக் கட்டளைக்கேற்ற கண்ணியமான நடையைப் பயன்படுத்துகிறது. ‘தகப்பன்’ என்பதற்குப் பதில் பொதுவாகப் புரியும் ‘தந்தை’ பயன்படுத்தப்பட்டது. மூலத்தின் இணையான இரு தடைகளும் அரைப்புள்ளியால் தெளிவாகப் பிரிக்கப்பட்டுள்ளன.
