source:
  edition: WLC
  text: לֹא יָבֹ֥א מַמְזֵ֖ר בִּ/קְהַ֣ל יְהוָ֑ה גַּ֚ם דּ֣וֹר עֲשִׂירִ֔י לֹא יָ֥בֹא ל֖/וֹ בִּ/קְהַ֥ל יְהוָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/003.yaml
  text: No one of illegitimate birth may enter the assembly of Yahweh; even to the tenth generation[a], none of his descendants may enter the assembly of Yahweh.
translation:
  language: ta
  text: முறையற்ற பிறப்புடைய எவரும்[a] யாவேயின் சபைக்குள் வரக்கூடாது. அவருடைய சந்ததியினரில் பத்தாம் தலைமுறை வரையிலும் எவரும் யாவேயின் சபைக்குள் வரக்கூடாது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயச் சொல்லான מַמְזֵר (மம்சேர்) என்பதன் துல்லியமான வரம்பு உறுதியல்ல. அது முறையற்ற அல்லது தடைசெய்யப்பட்ட உறவினால் பிறந்தவரையோ, பிறப்பின் காரணமாகச் சட்டரீதியாக விலக்கப்பட்டவரையோ குறிக்கலாம். மரபுவழியாக இது ‘முறைதவறிப் பிறந்தவர்’ என்று மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַמְזֵר
  choice: முறையற்ற பிறப்பு நிலையைச் சேர்ந்தவர்
  rationale: இந்த எபிரெயச் சொல், பிறப்பின் காரணமாகச் சமூக அல்லது சட்டரீதியாக விலக்கப்பட்ட ஒருவரைக் குறிக்கிறது; அதன் துல்லியமான வரம்பு விவாதத்திற்குரியது. இத்தமிழாக்கம் இழிவான அடைமொழியைத் தவிர்த்து, பிறப்பு நிலையோடு தொடர்புடைய வகைப்பாட்டைப் பாதுகாக்கிறது.
- source_word: יָבֹא
  choice: சேரக்கூடாது
  rationale: வினைச்சொல்லின் அடிப்படைப் பொருள் ‘வருதல்/நுழைதல்’. இச்சட்டத் தடையின் சூழலில், சபையில் அனுமதிக்கப்படாமையை இயல்பான தமிழில் ‘சேரக்கூடாது’ எனத் தெரிவிக்கிறது.
- source_word: קְהַל יְהוָה
  choice: யாவேயின் சபை
  rationale: קהל என்பது இங்கு உடன்படிக்கைச் சமூகத்தின் கூடுகை அல்லது சபையைக் குறிக்கிறது. יְהוָה தனிப்பட்ட இறைப் பெயராக ‘யாவே’ என்று ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: גַּם דּוֹר עֲשִׂירִי
  choice: பத்தாம் தலைமுறையினர்கூட
  rationale: גַּם என்பதன் வலியுறுத்தலையும், דּוֹר עֲשִׂירִי என்பதன் தலைமுறை வரம்பையும் சுருக்கமாகவும் இயல்பாகவும் பாதுகாக்கிறது.
- source_word: לֹא יָבֹא לוֹ
  choice: அவருடைய வழிவந்தவர்களில் … சேரக்கூடாது
  rationale: לוֹ என்பதன் ‘அவருக்குரிய/அவரைச் சேர்ந்த’ பொருள், தலைமுறைச் சூழலில் அவரது வழிவந்தவர்களைக் குறிக்கிறது. தமிழில் மறைபொருளைத் தெளிவாக்கும் வகையில் இவ்வாறு வழங்கப்பட்டுள்ளது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் நான்கெழுத்து இறைப் பெயர் நேரடியாக உள்ளது. அதனை பொதுப்பட்டமாக மாற்றாமல், உடன்படிக்கைப் பெயராக ஒலிபெயர்ப்பது மூலத்தின் தனித்தன்மையைப் பாதுகாக்கிறது.
- issue: ‘யாவேயின் சபையில் சேருதல்’ என்பதன் வரம்பு
  choice: சபையில் சேரக்கூடாது
  alternative: வழிபாட்டில் பங்கேற்கக்கூடாது
  rationale: קהל என்பதன் சட்ட, சமூக, வழிபாட்டு வரம்பு இவ்வசனத்தில் முழுமையாக வரையறுக்கப்படவில்லை. எனவே அதை வழிபாட்டில் பங்கேற்பது மட்டும் எனக் குறுக்காமல், மூலத்தின் பரந்த மற்றும் மங்கலான பொருளைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சட்ட உரைக்கேற்ற கண்ணியமான நேரடி நடையைப் பயன்படுத்துகிறது. பிறப்பை அடிப்படையாகக் கொண்ட இழிவான அடைமொழிகளைத் தவிர்க்கிறது; அதேவேளை மூலத்திலுள்ள விலக்குதலின் கடுமையையும் தலைமுறைத் தொடர்ச்சியையும் மென்மைப்படுத்தவில்லை.
