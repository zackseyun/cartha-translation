base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/012.yaml
  text: And toward evening he shall wash himself with water[b][a], and when the sun sets he may come into the midst of the camp.
translation:
  language: ta
  text: மாலை நெருங்கும்போது அவன் தண்ணீரால் தன்னைக் கழுவிக்கொள்ள வேண்டும். சூரியன் மறைந்ததும்[a], முகாமின் உட்பகுதிக்குள்[b] அவன் வரலாம்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லுக்குச் சொல், ‘சூரியன் உள்ளே வரும்போது’; இது சூரியன் மறைவதைக் குறிக்கும் எபிரெய மரபுத்தொடர்.
    reason: lexical_alternative
  - marker: b
    text: ‘முகாமுக்குள்’ என்றும் மொழிபெயர்க்கலாம்; எபிரெயம் இன்னும் குறிப்பாக முகாமின் உட்பகுதியைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: மாலை நெருங்கும்போது
  rationale: சட்ட அறிவுறுத்தலைத் தொடரும் וְ + היה அமைப்பைத் தமிழில் தேவையற்ற சொல்லெச்சமின்றி இயல்பான காலத் தொடராக அளிக்கிறது.
- source_word: לִפְנוֹת עֶרֶב
  choice: மாலை நெருங்கும்போது
  rationale: פנה என்பதன் ‘திரும்புதல்/நோக்கிச் செல்லுதல்’ என்ற காலநுணுக்கத்தை, நாள் மாலையை நோக்கிச் செல்லும் பொருளில் இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: יִרְחַץ בַּמָּיִם
  choice: தண்ணீரால் தன்னைக் கழுவிக்கொள்ள வேண்டும்
  rationale: சடங்குசார் சூழலில் உடலைக் கழுவுவதைத் தெளிவுபடுத்துகிறது; எபிரெயத்தில் தனியான தற்சுட்டுப் பெயர் இல்லாவிட்டாலும், சூழலில் உள்ள தன்னைத் தானே கழுவும் பொருளை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וּכְבֹא הַשֶּׁמֶשׁ
  choice: சூரியன் மறைந்ததும்
  rationale: சொல்லுக்கு சொல் ‘சூரியன் உள்ளே வரும்போது’ எனும் எபிரெய மரபுத்தொடரின் உண்மைப் பொருளான சூரிய அஸ்தமனத்தை வாசகருக்குத் தெளிவாகக் கொடுக்கிறது; நேரடிப் படிமம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: יָבֹא
  choice: அவன் வரலாம்
  rationale: கழுவுதல் மற்றும் சூரிய அஸ்தமனத்திற்குப் பின் முகாமுக்குள் மீண்டும் நுழைய வழங்கப்படும் அனுமதியைத் தமிழின் ‘வரலாம்’ தெளிவாக உணர்த்துகிறது.
- source_word: אֶל תּוֹךְ הַמַּחֲנֶה
  choice: முகாமின் நடுப்பகுதிக்குள்
  rationale: תּוֹךְ குறிக்கும் முகாமின் உட்பகுதிக்குள் நுழைதல் என்ற நுணுக்கத்தைப் பாதுகாக்கிறது; வெறுமனே முகாமை அணுகுவதாகப் புரிந்துகொள்ளப்படுவதைத் தவிர்க்கிறது.
