  text: לֹא תִדְרֹ֥שׁ שְׁלֹמָ֖/ם וְ/טֹבָתָ֑/ם כָּל יָמֶ֖י/ךָ לְ/עוֹלָֽם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/007.yaml
  text: You shall not seek their peace or their prosperity all your days forever[a].
translation:
  language: ta
  text: உன் வாழ்நாளெல்லாம், என்றென்றைக்கும், அவர்களுடைய சமாதானத்தையோ நலத்தையோ நாடாதே.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அவர்களுடைய நல்வாழ்வையோ நன்மையையோ’ என்றும் மொழிபெயர்க்கலாம். எபிரேயச் சொற்கள் அரசியல் சமாதானம் அல்லது பொருளாதாரச் செழிப்பு என்பவற்றைவிட விரிவான பொருள் கொண்டவை.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִדְרֹשׁ
  choice: நாடாதே
  rationale: דרש என்பதன் அடிப்படைப் பொருளான ‘தேடு/நாடு’ என்பதை இயல்பான தமிழில் தருகிறது; சமாதானம், நலம் ஆகியவற்றை நோக்கிச் செயல்படுவதையும் இது உள்ளடக்க முடியும்.
- source_word: שְׁלֹמָם
  choice: அவர்களுடைய சமாதானம்
  rationale: שָׁלוֹם என்பது சமாதானம், நல்வாழ்வு, நலநிலை ஆகிய விரிந்த பொருள்களைக் கொண்டது. ‘சமாதானம்’ மூலச்சொல்லின் அறியப்பட்ட முதன்மைப் பொருளைப் பாதுகாக்கிறது; அதன் விரிவை அடிக்குறிப்பு சுட்டுகிறது.
- source_word: טֹבָתָם
  choice: அவர்களுடைய நலம்
  rationale: טוֹבָה என்பது இங்கு அவர்களுக்கான நன்மை, நலன் அல்லது நல்ல நிலையைச் சுட்டுகிறது. ‘நலம்’ என்பது தமிழில் இயல்பாகவும் போதிய அளவு விரிவாகவும் உள்ளது; ‘செழிப்பு’ என்று பொருளை பொருளாதாரத்துக்கு மட்டும் குறுக்கவில்லை.
- source_word: כָּל יָמֶיךָ
  choice: உன் வாழ்நாளெல்லாம்
  rationale: சொல்லுக்குச் சொல் ‘உன் நாட்களெல்லாம்’ என்றாலும், காலநீட்சியைக் குறிக்கும் இந்த எபிரேய மொழிமரபை ‘உன் வாழ்நாளெல்லாம்’ தெளிவான இயல்பான தமிழில் தருகிறது; ஒருமை முன்னிலையையும் காக்கிறது.
- source_word: לְעוֹלָם
  choice: என்றென்றைக்கும்
  rationale: தடையின் நீடித்த வலிமையை வெளிப்படுத்துகிறது; முந்தைய காலவுரையுடன் வரும் வலியுறுத்தலையும் தனியே வைத்திருக்கிறது.
theological_decisions:
- issue: ‘உன் வாழ்நாளெல்லாம்’ மற்றும் ‘என்றென்றைக்கும்’ ஆகிய காலச் சொற்றொடர்களுக்கிடையிலான தோற்ற மீளுரை அல்லது இழுபறி
  choice: இரண்டு சொற்றொடர்களையும் மொழிபெயர்ப்பில் வைத்தல்
  alternative: ‘நீ உயிரோடிருக்கும் காலமெல்லாம்’ என்று ஒன்றாகச் சுருக்குதல்
  rationale: எபிரேய உரை כָּל יָמֶיךָ என்பதையும் לְעוֹלָם என்பதையும் அடுக்கி வலியுறுத்துகிறது. அதை மென்மையாக்காமல், மூலத்தின் வலிமையையும் உள்ளார்ந்த இழுபறியையும் மொழிபெயர்ப்பு காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், ஒருமை முன்னிலையான ‘உன்’ என்பதைக் காத்து, கட்டளையின் நேரடித்தன்மையை ‘நாடாதே’ என வழங்குகிறது. ‘சமாதானம்—நலம்’ என்ற இணை மூலத்தின் இரு வேறு, ஆனால் ஓரளவு மேலோடும் கருத்துகளைப் பாதுகாக்கிறது.
