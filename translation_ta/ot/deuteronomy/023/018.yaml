base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/018.yaml
  text: There shall not be a cult prostitute from the daughters of Israel[a], and there shall not be a cult prostitute from the sons of Israel.
translation:
  language: ta
  text: இஸ்ரவேலின் மகள்களில் எவளும் வழிபாட்டுடன் தொடர்புடைய பாலியல் தொழிலாளியாக[a] இருக்கக் கூடாது; இஸ்ரவேலின் மகன்களில் எவனும் வழிபாட்டுடன் தொடர்புடைய பாலியல் தொழிலாளியாக இருக்கக் கூடாது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘கோவில் சார்ந்த பாலியல் தொழிலாளி’ என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொற்களின் சொற்பொருள் ‘அர்ப்பணிக்கப்பட்ட பெண்/ஆண்’ என்பதாக இருந்தாலும், இங்கே அவை பிறதெய்வ வழிபாட்டோடு தொடர்புடைய முறைகேடான பாலியல் செயல்பாட்டைக் குறிப்பதாகப் பாரம்பரியமாகப் புரிந்துகொள்ளப்படுகின்றன.
    reason: சொற்பொருள் மாற்றும் மாற்று மொழிபெயர்ப்பும்
lexical_decisions:
- source_word: קְדֵשָׁה
  choice: வழிபாட்டுச் சடங்கோடு தொடர்புடைய பாலியல் தொழிலாளி
  rationale: பெண்பால் பெயர்ச்சொல், நேர்மறையான பொருளில் ‘புனிதமாக்கப்பட்ட பெண்’ என்பதைக் குறிக்காமல், பிறதெய்வ வழிபாட்டோடு தொடர்புடைய முறைகேடான பாலியல் பங்கைக் குறிக்கும் தொழில்நுட்பச் சொல்லாக இச்சூழலில் வருகிறது. ‘வழிபாட்டுச் சடங்கோடு தொடர்புடைய’ என்பது சமயப் பரிமாணத்தை வெளிப்படுத்துகிறது; ‘கோவில்’ என்று மொழிபெயர்த்து இடத்தைத் தேவையின்றி மிகத் துல்லியமாகக் கட்டுப்படுத்துவதையும் தவிர்க்கிறது.
- source_word: קָדֵשׁ
  choice: வழிபாட்டுச் சடங்கோடு தொடர்புடைய பாலியல் தொழிலாளி
  rationale: இது கְדֵשָׁה என்பதன் ஆண்பால் இணைச்சொல். இரண்டிற்கும் ஒரே சொற்றொடரைப் பயன்படுத்தி எபிரெய இணை அமைப்பு பாதுகாக்கப்படுகிறது; ‘மகள்களில் எவளும்’ மற்றும் ‘மகன்களில் எவனும்’ என்பவை பாலின வேறுபாட்டைத் தெளிவாக்குகின்றன.
- source_word: לֹא תִהְיֶה / וְלֹא יִהְיֶה
  choice: இருக்கக் கூடாது
  rationale: சட்டப் பாணியிலான தடை அல்லது விலக்கை இயல்பான நவீனத் தமிழில் நேரடியாக வெளிப்படுத்துகிறது.
- source_word: מִבְּנוֹת יִשְׂרָאֵל
  choice: இஸ்ரவேலின் மகள்களில் எவளும்
  rationale: מִן முன்னொட்டு இங்கு சமூகத்தின் உறுப்பினர்களுள் ஒருவரைக் குறிக்கிறது. ‘மகள்கள்’ என்ற குடும்ப-தேசியச் சொல்லாட்சியைப் பாதுகாத்தபடி, தமிழில் தடைவாக்கியம் இயல்பாக அமைய ‘எவளும்’ சேர்க்கப்பட்டுள்ளது.
- source_word: מִבְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் மகன்களில் எவனும்
  rationale: முதல் கூறுடன் உள்ள மகள்கள்/மகன்கள் இணை அமைப்பையும் ஆண்பால் குறிப்பையும் பாதுகாக்கிறது; ‘எவனும்’ தடையின் தன்மையைத் தெளிவாகவும் இயல்பாகவும் காட்டுகிறது.
theological_decisions:
- issue: קדש/קדשה என்ற சொற்களின் பொருள்
  choice: பிறதெய்வ வழிபாட்டுச் சடங்கோடு தொடர்புடைய பாலியல் பங்கில் ஈடுபடும் ஆண் மற்றும் பெண்
  alternative: பொதுவாகப் பாலியல் ஒழுக்கக்கேட்டில் ஈடுபடுபவர்கள்; அல்லது நடுநிலையான பொருளில் அர்ப்பணிக்கப்பட்ட ஆண்/பெண்
  rationale: இச்சட்டச் சூழலில் இவை பொதுவான பாலியல் ஒழுக்கக்கேட்டையோ நேர்மறையான அர்ப்பணிப்பையோ குறிக்காமல், முறைகேடான சமய வழிபாட்டோடு தொடர்புடைய தொழில்நுட்பச் சொற்களாக உள்ளன. அதே நேரத்தில், ‘கோவில்’ என்று குறிப்பிட்டு அதன் துல்லியமான இடத்தை மொழிபெயர்ப்பு தீர்மானிக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், சட்டத் தடையின் கண்ணியமான நேரடிப் பாணி பயன்படுத்தப்பட்டுள்ளது. ‘விபசாரி’ போன்ற இழிவுணர்வு தரக்கூடிய சொல்லைத் தவிர்த்து, சமயச் சூழலை வெளிப்படுத்தும் விளக்கமான சொற்றொடர் தேர்ந்தெடுக்கப்பட்டுள்ளது; எபிரெயத்தின் மகள்கள்/மகன்கள் இணை அமைப்பும் பாதுகாக்கப்பட்டுள்ளது.
