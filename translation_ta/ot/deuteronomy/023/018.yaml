    rationale: “கோவில் பாலியல் தொழிலாளி” can be smoothed to “கோவில் சார்ந்த பாலியல் தொழிலாளி,” retaining the intended ‘temple prostitute’ alternative without claiming that the Hebrew specifies the precise location.
