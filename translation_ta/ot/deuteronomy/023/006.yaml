  text: וְ/לֹֽא אָבָ֞ה יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ לִ/שְׁמֹ֣עַ אֶל בִּלְעָ֔ם וַ/יַּהֲפֹךְ֩ יְהוָ֨ה אֱלֹהֶ֧י/ךָ לְּ/ךָ֛ אֶת הַ/קְּלָלָ֖ה לִ/בְרָכָ֑ה כִּ֥י אֲהֵֽבְ/ךָ֖ יְהוָ֥ה אֱלֹהֶֽי/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/006.yaml
  text: But Yahweh your God was not willing to listen to Balaam, and Yahweh your God turned the curse into a blessing for you, because Yahweh your God loved you.
translation:
  language: ta
  text: ஆனால் உங்கள் கடவுளாகிய யாவே பிலேயாமுக்குச் செவிகொடுக்க விரும்பவில்லை. உங்கள் கடவுளாகிய யாவே உங்களை நேசித்ததால், அந்தச் சாபத்தை உங்களுக்கு ஆசீர்வாதமாக மாற்றினார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אָבָה
  choice: விரும்பவில்லை
  rationale: இச்சொல் வெறும் இயலாமையை அல்ல, மனவிருப்பம் அல்லது சம்மதத்தைச் சுட்டுகிறது; ‘விரும்பவில்லை’ அந்த நோக்கத்தை இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய மூலத்தில் வரும் இறைத் திருப்பெயரை ஒரு பட்டப்பெயரால் மாற்றாமல், தமிழில் வழக்கமான ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: אֱלֹהֶיךָ
  choice: உங்கள் கடவுள்
  rationale: இரண்டாம் நபர் ஒருமை ஆண்பால் பின்னொட்டுடைய வடிவம்; தமிழில் தனிநபரையோ சமூகத்தை ஒருமையாகவோ மரியாதையுடன் குறிக்க ‘உங்கள் கடவுள்’ இயல்பாக உள்ளது.
- source_word: לִשְׁמֹעַ אֶל
  choice: செவிகொடுக்க
  rationale: இச்சொற்றொடர் ஒருவரைக் கேட்பது மட்டுமல்லாமல் அவரது வேண்டுகோளை ஏற்றுச் செயல்படுவதையும் குறிக்கலாம்; ‘செவிகொடுக்க’ மூலத்தின் பொருள் பரப்பைத் தக்கவைக்கிறது.
- source_word: בִּלְעָם
  choice: பிலேயாம்
  rationale: தனிப்பெயரின் நிலையான தமிழ் ஒலிபெயர்ப்பு.
- source_word: וַיַּהֲפֹךְ
  choice: மாற்றினார்
  rationale: சாபம் ஆசீர்வாதமாக ஆன மாற்றத்தை இயல்பான தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: הַקְּלָלָה
  choice: அந்தச் சாபம்
  rationale: குறிப்பிட்ட, ஏற்கெனவே சூழலில் அறியப்பட்ட சாபத்தைக் குறிக்கும் எபிரெய வரையறைச் சுட்டை ‘அந்த’ வெளிப்படுத்துகிறது.
- source_word: לִבְרָכָה
  choice: ஆசீர்வாதமாக
  rationale: லாமேத் உருமாற்றத்தின் விளைவைச் சுட்டுகிறது; ‘ஆசீர்வாதமாக மாற்றினார்’ என்பது இயல்பான தமிழ் அமைப்பு.
- source_word: כִּי
  choice: என்பதால்
  rationale: யாவேயின் செயலுக்கான காரணத்தை வெளிப்படுத்தும் காரண இணைப்பாக மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: אֲהֵבְךָ
  choice: உங்களை நேசித்தார்
  rationale: எளிய அன்பை நேரடியாகக் குறிக்கும் வினை; உடன்படிக்கைச் சூழலின் ஆழத்தைச் சுருக்காமல் இயல்பாக வழங்குகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைத் திருப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூலத்தில் தனிப்பட்ட இறைத் திருப்பெயர் நேரடியாக உள்ளது. அதனைப் பட்டப்பெயராக மாற்றாமல் ஒலிபெயர்ப்பது மூலத்தின் வேறுபாட்டைப் பாதுகாக்கிறது.
- issue: பிலேயாமுக்குச் ‘செவிகொடுக்குதல்’ என்பதன் பொருள்
  choice: செவிகொடுக்க
  alternative: கீழ்ப்படிய
  rationale: மூலச் சொற்றொடர் கேட்டல், ஏற்றுக்கொள்ளுதல் ஆகிய இரு நிழற்பொருள்களையும் தாங்குகிறது. ‘கீழ்ப்படிய’ என்பது இங்கு தேவையற்ற அளவு விளக்கமாகிவிடும்; ‘செவிகொடுக்க’ உண்மையான பொருள் அகலத்தைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. இஸ்ரவேல் ஒரு சமூகமாக ஒருமையில் அழைக்கப்பட்டுள்ளதால், தமிழில் இயல்பும் மரியாதையும் கருதி ‘உங்கள்/உங்களை’ பயன்படுத்தப்பட்டுள்ளது. தேவையற்ற விளக்கக் குறிப்புகள் சேர்க்கப்படவில்லை.
