source:
  edition: WLC
  text: בָּנִ֛ים אֲשֶׁר יִוָּלְד֥וּ לָ/הֶ֖ם דּ֣וֹר שְׁלִישִׁ֑י יָבֹ֥א לָ/הֶ֖ם בִּ/קְהַ֥ל יְהוָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/009.yaml
  text: Children born to them in the third generation may enter the assembly of Yahweh[a][b].
translation:
  language: ta
  text: அவர்களுக்குப் பிறக்கும் பிள்ளைகள்[a], மூன்றாம் தலைமுறையில் யாவேயின் சபையில் சேரலாம்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் நேரடியாக ‘மகன்கள்’; இந்தச் சட்டபூர்வ வம்சாவளிச் சூழலில் இச்சொல் பிள்ளைகள் அல்லது சந்ததியினர் அனைவரையும் பொதுவாகக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘மூன்றாம் தலைமுறையினர் சேர்வார்கள்.’ எபிரெயத்தை இவ்வாறு இன்னும் முறையாக மொழிபெயர்க்கலாம்; எனினும் மூன்றாம் தலைமுறை முதல் சேர அனுமதி உண்டு என்பதே இங்கு பொருள்.
    reason: alternative_reading
lexical_decisions:
- source_word: בָּנִים
  choice: பிள்ளைகள்
  rationale: எபிரெயச் சொல்லின் நேரடிப் பொருள் ‘மகன்கள்’ என்றாலும், இந்தச் சட்டபூர்வமான வம்சாவளிச் சூழலில் அது சந்ததியினரைப் பொதுவாகக் குறிக்க முடியும். ‘பிள்ளைகள்’ என்பது குடும்ப உறவையும் பரந்த குறிப்பையும் இயல்பாகப் பேணுகிறது.
- source_word: אֲשֶׁר יִוָּלְדוּ לָהֶם
  choice: அவர்களுக்குப் பிறக்கும்
  rationale: ילד என்பதன் செயப்பாட்டு வடிவமும் לָהֶם என்பதும் இணைந்து ‘அவர்களுக்குப் பிறக்கும்’ என்று இயல்பாகப் பொருள்படுகின்றன.
- source_word: דּוֹר שְׁלִישִׁי
  choice: மூன்றாம் தலைமுறையில்
  rationale: சபையில் சேர அனுமதி தொடங்கும் தலைமுறைக் கட்டத்தை இச்சொற்றொடர் குறிக்கிறது; தமிழில் ‘மூன்றாம் தலைமுறையில்’ என்பது இந்தச் சட்டப்பூர்வ காலப் பொருளைத் தெளிவாகத் தருகிறது.
- source_word: יָבֹא
  choice: சேரலாம்
  rationale: வினைச்சொல் நேரடியாக ‘வருதல்/நுழைதல்’ என்று பொருள்படும். சபையைப் பற்றிய இச்சட்டச் சூழலில், அனுமதிக்கப்பட்ட சேர்க்கையை ‘சேரலாம்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: בִּקְהַל יְהוָה
  choice: யாவேயின் சபையில்
  rationale: קהל என்பது கூடிய சமூகத்தையோ அதிகாரபூர்வ சபையையோ குறிக்கிறது. ‘சபை’ அதன் உடன்படிக்கைச் சமூகப் பொருளைப் பேணுகிறது; בְּ முன்னொட்டின் பொருள் தமிழில் இடவேற்றுமையால் வெளிப்படுகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: திருநான்கெழுத்தான தெய்வீகப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் பரவலாகப் புரிந்துகொள்ளத்தக்க ஒலிபெயர்ப்பாக ‘யாவே’ வழங்கப்படுகிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரை வழங்குதல்
  choice: யாவே
  alternative: யெகோவா / ஆண்டவர்
  rationale: மூல உரையில் தனிப்பட்ட உடன்படிக்கைப் பெயரே உள்ளது. ஆகவே பட்டமான ‘ஆண்டவர்’ என்பதையோ வேறுபட்ட ஒலிபெயர்ப்பான ‘யெகோவா’ என்பதையோ பயன்படுத்தாமல் ‘யாவே’ என ஒலிபெயர்க்கப்பட்டுள்ளது.
- issue: சட்டபூர்வ வம்சாவளிச் சூழலில் בָּנִים என்பதன் வரம்பு
  choice: பிள்ளைகள்
  alternative: மகன்கள் / சந்ததியினர்
  rationale: இலக்கண வடிவம் ஆண்பால் பன்மையாக இருந்தாலும், இங்கு வம்சத்தில் பிறப்பவர்களைப் பொதுவாகக் குறிக்கிறது. ‘பிள்ளைகள்’ நேரடிக் குடும்பப் பொருளையும் பரந்த வம்சாவளிக் குறிப்பையும் பேணுகிறது.
- issue: יָבֹא என்பதன் சட்டப்பூர்வ நுண்பொருள்
  choice: சேரலாம்
  alternative: சேர்வார்கள் / சேர வேண்டும்
  rationale: வடிவம் முறையாக ‘வருவான்/நுழைவான்’ என வழங்கப்படலாம்; ஆனால் தடை மற்றும் அனுமதியை வரையறுக்கும் சூழலில் மூன்றாம் தலைமுறை முதல் அனுமதி உண்டு என்பதே கருத்து. இதை ‘சேரலாம்’ தெளிவாக வெளிப்படுத்துகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான சட்டநடை பயன்படுத்தப்பட்டுள்ளது. ‘சபை’ என்பது வழிபாட்டுக் கூட்டத்தை மட்டும் அல்லாமல் உடன்படிக்கைச் சமூகத்தின் அதிகாரபூர்வக் கூடுகையையும் குறிக்கிறது. மூலத்தின் அனுமதி சார்ந்த சட்டப் பொருள் முதன்மை உரையில் தெளிவாக்கப்பட்டாலும், மேலும் முறையான மாற்று வாசகம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
