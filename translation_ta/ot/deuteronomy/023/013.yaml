review_pass:
  verdict: revise
  source_fidelity: The draft correctly takes יָד as a designated place and retains both the camp-external location and the final reinforcing חוּץ. However, «அங்கே வெளியே செல்ல வேண்டும்» is syntactically awkward in Tamil and can obscure that the person is to go out to the designated place.
  naturalness: «வெளியே, அந்த இடத்திற்குச் செல்ல வேண்டும்» is clear modern standard Tamil and represents the Hebrew sequence 'go out—there—outside' without an unnatural adjacent repetition.
  terminology: «முகாம்», «இடம்», and «எபிரெயம்» are suitable. The note is retained but lightly refined to present the lexical alternatives as possibilities rather than a settled conclusion.
  issues:
  - severity: low
    issue: Awkward placement of the final locative emphasis
    rationale: In «நீ அங்கே வெளியே செல்ல வேண்டும்», the adjacent adverbs are understandable but not idiomatic enough for a polished modern Tamil translation. Reordering them makes the destination and outward movement clear while retaining the Hebrew emphasis.
  revised_text: முகாமுக்கு வெளியே உனக்கென ஓர் இடம்[a] இருக்க வேண்டும்; நீ வெளியே, அந்த இடத்திற்குச் செல்ல வேண்டும்.
