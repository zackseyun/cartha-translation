base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/013.yaml
  text: And you shall have a place outside the camp[a], and you shall go out there, outside.
translation:
  language: ta
  text: முகாமுக்கு வெளியே உனக்கென ஓர் இடம்[a] இருக்க வேண்டும்; நீ வெளியே, அந்த இடத்திற்குச் செல்ல வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் ‘கை’ (யாத்); இங்கே இது ஒதுக்கப்பட்ட ஓர் இடம் அல்லது பகுதியைக் குறிக்கும் சொல்லாட்சியாக இருக்கலாம். அடுத்த வசனத்தை முன்னிட்டு, சில மொழிபெயர்ப்புகள் இதை ஒரு கருவி அல்லது முளை என மொழிபெயர்க்கின்றன.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָד
  choice: இடம்
  rationale: יָד என்பதன் வழக்கமான பொருள் ‘கை’ என்றாலும், இச்சூழலில் முகாமுக்கு வெளியே ஒதுக்கப்பட்ட இடத்தைக் குறிக்கும் மரபுத்தொடராகப் புரிந்துகொள்வது தொடரமைப்புக்கும் அடுத்த கட்டளைக்கும் பொருந்துகிறது.
- source_word: תִּהְיֶה לְךָ
  choice: உனக்கென ... இருக்க வேண்டும்
  rationale: היה + לְ என்னும் எபிரெய உடைமை அல்லது ஒதுக்கீட்டுக் கட்டமைப்பை இயல்பான தமிழில் காட்டுவதோடு கட்டளையின் வலிமையையும் காக்கிறது.
- source_word: מִחוּץ לַמַּחֲנֶה
  choice: முகாமுக்கு வெளியே
  rationale: முகாமின் எல்லைக்கு அப்பாற்பட்ட இடத்தை நேரடியாகவும் இயல்பாகவும் குறிக்கிறது.
- source_word: וְיָצָאתָ
  choice: நீ ... செல்ல வேண்டும்
  rationale: יצא வினையின் ‘வெளியே செல்’ என்ற இயக்கத்தையும் இங்குள்ள கட்டளைத் தன்மையையும் நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: שָׁמָּה
  choice: அங்கே
  rationale: முன்னர் குறிப்பிடப்பட்ட ஒதுக்கப்பட்ட இடத்தைச் சுருக்கமாகச் சுட்டுகிறது.
- source_word: חוּץ
  choice: வெளியே
  rationale: இறுதியில் மீண்டும் வரும் חוּץ தரும் வலியுறுத்தலை, தமிழில் சற்றே மீளுரையாக இருந்தாலும், பாதுகாக்கிறது.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழில் எளிதில் புரியும், கண்ணியமான கட்டளை நடையைப் பயன்படுத்தியுள்ளோம். எபிரெய மூலத்தின் இறுதி ‘வெளியே’ என்ற மீளுரையை வலியுறுத்தலாகத் தக்கவைத்துள்ளோம்.
