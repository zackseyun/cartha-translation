base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/017.yaml
  text: He shall live with you[a], in your midst, in the place that he chooses within one of your gates, wherever it is good for him[b]; you shall not oppress him.
translation:
  language: ta
  text: அவன் உன்னோடு, உன் நடுவில், உன் ஊர்களில் ஒன்றில்[b], தனக்கு நலமாக இருக்கும் என்று அவன் தேர்ந்தெடுக்கும் இடத்தில் குடியிருக்கட்டும்[a]; நீ அவனை ஒடுக்கக் கூடாது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “குடியிருக்கட்டும்” என்பதற்கு “வசிக்கட்டும்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “உன் ஊர்களில் ஒன்றில்” என்பது சொல்லர்த்தமாக “உன் வாயில்களில் ஒன்றில்”; இங்கு “வாயில்கள்” என்பது ஊர்களையோ குடியிருப்புச் சமூகங்களையோ குறிக்கும் எபிரெய மரபுத்தொடர்.
    reason: cultural_note
lexical_decisions:
- source_word: יֵשֵׁב
  choice: குடியிருக்கட்டும்
  rationale: ישב என்பது இச்சட்டச் சூழலில் தொடர்ந்து வசிப்பதைக் குறிக்கிறது. அனுமதிக்கும் சட்டநடைப் பொருளைத் தமிழில் இயல்பாக வெளிப்படுத்த “குடியிருக்கட்டும்” தேர்ந்தெடுக்கப்பட்டது.
- source_word: עִמְּךָ
  choice: உன்னோடு
  rationale: עם என்பதன் நேரடிப் பொருளான “உன்னோடு” என்பதைக் காக்கிறது; அடுத்துவரும் “உன் நடுவில்” சமூகத்திற்குள் இருப்பதைத் தெளிவுபடுத்துகிறது.
- source_word: בְּקִרְבְּךָ
  choice: உன் நடுவில்
  rationale: சமூகத்தின் மத்தியில் வாழ்வதைச் சுட்டும் எபிரெய உருவகத்தை நெருக்கமாகவும் தெளிவாகவும் காக்கிறது.
- source_word: בַּמָּקוֹם אֲשֶׁר יִבְחַר
  choice: தான் தேர்ந்தெடுக்கும் இடத்தில்
  rationale: தேர்ந்தெடுப்பவர் முந்தைய வசனத்தில் குறிப்பிடப்பட்ட தப்பிவந்த அடிமையே என்பதை “தான்” தெளிவாக்குகிறது; בחר என்பதன் தேர்வு என்ற பொருள் காக்கப்படுகிறது.
- source_word: בְּאַחַד שְׁעָרֶיךָ
  choice: உன் ஊர்களில் ஒன்றில்
  rationale: “உன் வாயில்களில் ஒன்றில்” என்பது சொல்லுக்கு சொல் வடிவம்; இங்கு שער metonymy ஆக நகரம் அல்லது குடியிருப்பைக் குறிக்கிறது. நவீனத் தமிழில் பொருள் தெளிவாக இருக்க “ஊர்களில் ஒன்றில்” என வழங்கப்பட்டது.
- source_word: בַּטּוֹב לוֹ
  choice: தனக்கு நலமான இடத்தில்
  rationale: சொல்லர்த்தத்தில் “அவனுக்கு நன்மையானதில்” என்றுள்ள சொற்றொடர், அவனுக்குச் சாதகமான அல்லது உகந்த இடத்தைக் குறிக்கிறது. வெறும் விருப்பத்தைவிட நலன் என்ற பரந்த நுணுக்கம் காக்கப்படுகிறது.
- source_word: לֹא תּוֹנֶנּוּ
  choice: நீ அவனை ஒடுக்கக் கூடாது
  rationale: ינה என்பதன் இச்சட்டப் பயன்பாடு பலவீனமான ஒருவரை ஒடுக்குதல் அல்லது சுரண்டுதலைக் குறிக்கிறது. தடையின் சமூக மற்றும் அறநெறி வலிமையை “ஒடுக்க” துல்லியமாகத் தருகிறது.
theological_decisions:
- issue: ஆண்பால் ஒருமை வடிவங்களின் சுட்டுப்பொருள்
  choice: முந்தைய வசனத்தில் வரும் தப்பிவந்த அடிமையை ஆண்பால் ஒருமையில் “அவன்/அவனை” என்று குறிப்பிடுதல்
  alternative: பாலினம் குறிப்பிடாத ஒருமைச் சொற்றொடரைப் பயன்படுத்துதல்
  rationale: எபிரெய மூலத்தில் வினை மற்றும் சுட்டுப்பெயர் வடிவங்கள் ஆண்பால் ஒருமையில் உள்ளன. அந்த இலக்கண வடிவத்தைத் தமிழ் மொழிபெயர்ப்பு காக்கிறது; அதேவேளை இதற்கு மேலான பாலினக் கோட்பாட்டை உரைக்குள் சேர்ப்பதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், சட்ட உரைக்கு ஏற்ற கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. இரண்டாம் நபர் ஒருமை வடிவங்கள் மூல எபிரெயைத் தொடர்ந்து காக்கப்பட்டன. “வாயில்கள்” என்ற சொல்லர்த்த வடிவம் பிரதான உரையில் குழப்பமளிக்கக்கூடும் என்பதால் “ஊர்கள்” பயன்படுத்தப்பட்டு, மூல மரபுத்தொடர் அடிக்குறிப்பில் பதிவு செய்யப்பட்டது.
