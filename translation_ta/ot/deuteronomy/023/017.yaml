- from: அவன் உன்னோடு, உன் நடுவில், உன் ஊர்களில் ஒன்றில் தான் தேர்ந்தெடுக்கும் இடத்தில், தனக்கு நலமான இடத்தில் குடியிருக்கட்டும்[a]; நீ அவனை ஒடுக்கக் கூடாது.
