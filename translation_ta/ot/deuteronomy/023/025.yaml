  source_fidelity: 'மூல எபிரெயத்தின் சட்டவழக்குப் பொருள் பெரும்பாலும் துல்லியமாக உள்ளது: நுழையும்/நிபந்தனைச் சூழல், அயலானின் திராட்சைத்தோட்டம், தனிப்பட்ட உணவிற்கான அனுமதி, எடுத்துச் செல்லத் தடை ஆகியவை காக்கப்பட்டுள்ளன. ஆனால் “உன் விருப்பம்போல் ... திருப்தியாகும்வரை” என்ற நடப்பு அமைப்பு, திருப்தியடைவது யார் என்பதையும் ‘விருப்பம்’ மற்றும் ‘நிறைவு’ என்ற இரட்டை வரம்பின் தொடர்பையும் சற்றே இயல்பற்றதாக ஆக்குகிறது.'
