  text: When you enter your neighbor’s vineyard[a], you may eat grapes as your appetite desires, until you are satisfied[c][b], but you shall not put any into your container.
translation:
  language: ta
  text: நீ உன் அயலானின் திராட்சைத்தோட்டத்திற்குள் நுழையும்போது[a], உன் விருப்பத்தின்படி, உனக்குத் திருப்தி ஏற்படும் அளவு திராட்சைப்பழங்களைச் சாப்பிடலாம்[b]; ஆனால் அவற்றில் எதையும் உன் கொள்கலனில் போடக் கூடாது[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நீ உன் அயலானின் திராட்சைத்தோட்டத்திற்குள் நுழைந்தால்.” எபிரெயச் சொல்லான כִּי காலத்தைக் குறிக்கும் உட்பிரிவையோ நிபந்தனையைக் குறிக்கும் உட்பிரிவையோ அறிமுகப்படுத்தலாம்.
    reason: lexical_alternative
  - marker: b
    text: சொல்லுக்குச் சொல், “உன் உயிரின்படி, உன் நிறைவுக்கேற்ப.” இது ஒருவர் விரும்பிய அளவு உண்டு திருப்தியடைவதைக் குறிக்கும் மரபுத்தொடர்.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, “பாத்திரத்தில்.” எபிரெயச் சொல் பொதுவானது; எந்த வகையான கொள்கலன் என்பதை அது குறிப்பிடவில்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: செல்லும்போது
  rationale: இங்கு כִּי காரணத்தைக் குறிக்காமல் ஒரு சூழ்நிலையை அறிமுகப்படுத்துகிறது. சட்டச் சூழலில் எதிர்பார்க்கக்கூடிய நிகழ்வை இயல்பாகக் காட்ட “செல்லும்போது” தேர்ந்தெடுக்கப்பட்டது; நிபந்தனைப் பொருளும் சாத்தியம் என்பதால் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: תָבֹא בְּכֶרֶם
  choice: திராட்சைத்தோட்டத்திற்குள் செல்லும்போது
  rationale: בוא என்பது இங்கு ஓர் இடத்திற்குள் நுழைவதைக் குறிக்கிறது. தமிழில் “திராட்சைத்தோட்டத்திற்குள் செல்” என்பது இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: רֵעֶךָ
  choice: உன் அயலானுடைய
  rationale: רֵעַ என்பது அயலான், சக மனிதன் அல்லது தோழன் எனப் பொருள்படலாம். இந்தச் சொத்துரிமைச் சட்டச் சூழலில் “உன் அயலானுடைய” இயல்பான தேர்வு.
- source_word: וְאָכַלְתָּ עֲנָבִים
  choice: திராட்சைப்பழங்களை ... சாப்பிடலாம்
  rationale: சட்டச் சூழலில் இவ்வினைவடிவு அனுமதிக்கப்பட்ட செயலைக் குறிக்கிறது; ஆகவே கட்டளையாக அல்லாமல் “சாப்பிடலாம்” என மொழிபெயர்க்கப்பட்டது.
- source_word: כְּנַפְשְׁךָ שָׂבְעֶךָ
  choice: உன் விருப்பம்போல் ... திருப்தியாகும்வரை
  rationale: נֶפֶשׁ இங்கு இறையியல் பொருளிலான “ஆத்துமா” அல்ல; தனிப்பட்ட விருப்பம் அல்லது பசியார்வத்தைக் குறிக்கிறது. שָׂבְעֶךָ உண்டு நிறைவடைவதைக் குறிக்கிறது. இரண்டையும் இணைத்து இயல்பான தமிழ் சொற்றொடராக வழங்கப்பட்டுள்ளது.
- source_word: כֶּלְיְךָ
  choice: உன் கொள்கலனில்
  rationale: כְּלִי என்பது பாத்திரம், பை, கூடை போன்றவற்றில் ஒன்றைத் திட்டவட்டமாகச் சுட்டாமல் பொதுவாக எடுத்துச் செல்லும் பொருள் அல்லது கலனைக் குறிக்கிறது. அந்தப் பொதுத்தன்மையை “கொள்கலன்” காக்கிறது.
- source_word: לֹא תִתֵּן
  choice: போடக் கூடாது
  rationale: נתן என்பதன் அடிப்படைப் பொருள் “கொடு/வை”; இங்கு கொள்கலனுக்குள் திராட்சைப்பழங்களை வைப்பதே கருத்து. தமிழ்ச் சட்டநடையில் தடை தெளிவாக அமைய “போடக் கூடாது” பயன்படுத்தப்பட்டது.
