translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்கு எளிதில் புரியும் கண்ணியமான சட்டநடை பயன்படுத்தப்பட்டுள்ளது. ஒருமை இரண்டாம் நபரைக் காட்ட “நீ/உன்” காக்கப்பட்டுள்ளது. அனுமதிக்கும் பகுதியும் தடைசெய்யும் பகுதியும் தெளிவாக வேறுபடுத்தப்பட்டுள்ளன; எபிரெய மூலத்தின் நிபந்தனை/காலத் தெளிவின்மை மற்றும் כְּלִי என்பதன் பொதுத்தன்மை அடிக்குறிப்புகளில் பாதுகாக்கப்பட்டுள்ளன.
