  text: כִּֽי תֵצֵ֥א מַחֲנֶ֖ה עַל אֹיְבֶ֑י/ךָ וְ/נִ֨שְׁמַרְתָּ֔ מִ/כֹּ֖ל דָּבָ֥ר רָֽע־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/010.yaml
  text: When you go out as an army against your enemies[a], then keep yourself from every evil thing.
translation:
  language: ta
  text: நீ உன் எதிரிகளை எதிர்த்துப் படையுடன் புறப்படும்போது, தீமையான எதிலிருந்தும் உன்னைக் காத்துக்கொள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘தீட்டான எதிலிருந்தும்’ / ‘தகாத எதிலிருந்தும்.’ எபிரெயச் சொற்றொடர் விரிவான பொருளுடையது; இச்சூழலில் அது சடங்குத் தீட்டையும் உள்ளடக்கலாம், ஆனால் அதற்கு மட்டும் வரையறுக்கப்படவில்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: புறப்படும்போது
  rationale: இங்கு כִּי, தொடர்ந்து வரும் கட்டளைக்கான சூழலை அறிமுகப்படுத்துகிறது. நிபந்தனையாகக் குறுக்காமல், சட்ட அறிவுறுத்தலின் இயல்புக்கு ஏற்றவாறு ‘போது’ என மொழிபெயர்க்கப்பட்டது.
- source_word: תֵצֵא
  choice: புறப்படு
  rationale: יצא என்பதன் அடிப்படைப் பொருளான ‘வெளியே செல்/புறப்படு’ என்பதைக் காக்கிறது; இராணுவச் சூழலில் ‘புறப்படு’ இயல்பான நவீனத் தமிழ்.
- source_word: מַחֲנֶה
  choice: படையாக
  rationale: מַחֲנֶה பொதுவாக ‘முகாம்’ எனப் பொருள்பட்டாலும், ‘எதிரிகளுக்கு எதிராகப் புறப்படுதல்’ என்ற தொடரில் முகாமிட்டிருக்கும் படையைக் குறிக்கிறது. தமிழில் இயல்பாகப் பொருள் விளங்க ‘படையாக’ என வழங்கப்பட்டது.
- source_word: עַל
  choice: எதிராக
  rationale: போர்ச் சூழலில் עַל எதிர்நிலைப் பொருளைத் தருவதால் ‘எதிராக’ என்பது தெளிவான இணை.
- source_word: אֹיְבֶיךָ
  choice: உன் எதிரிகள்
  rationale: אויב மற்றும் இரண்டாம் நபர் ஒருமை உடைமைப் பின்னொட்டின் நேரடியான, இயல்பான தமிழ் வடிவம்.
- source_word: וְנִשְׁמַרְתָּ
  choice: உன்னைக் காத்துக்கொள்
  rationale: שׁמר என்பதன் நிஃபால் வடிவம் இங்கு தன்னைப் பாதுகாத்துக்கொள்ளுதல் அல்லது எச்சரிக்கையாக இருத்தல் என்ற தற்சார்புப் பொருளைத் தருகிறது. ‘உன்னைக் காத்துக்கொள்’ அந்தப் பொருளையும் கட்டளைத் தன்மையையும் காக்கிறது.
- source_word: מִכֹּל
  choice: எந்த ... இலிருந்தும்
  rationale: מן உடன் כֹּל வருவது எல்லாவற்றிலிருந்தும் விலகிக் காத்துக்கொள்வதைக் குறிக்கிறது. தமிழில் பகிர்வுப் பொருளை இயல்பாக வெளிப்படுத்த ‘எந்த ... இலிருந்தும்’ பயன்படுத்தப்பட்டது.
- source_word: דָּבָר
  choice: காரியம்
  rationale: דָּבָר என்பது ‘சொல், விஷயம், காரியம்’ போன்ற விரிந்த பொருள்களைக் கொண்டது. பேச்சை மட்டும் குறிக்காமல் பொதுவாக இருக்க ‘காரியம்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: רָע
  choice: தீமையான
  rationale: רָע இங்கு ஒழுக்கரீதியாகவோ சடங்குரீதியாகவோ ஏற்கத்தகாததை உள்ளடக்கக்கூடும். ‘தீமையான’ என்பது எபிரெயச் சொல்லின் அகலத்தைப் பாதுகாக்கிறது; ‘தீட்டான’ என்பது இவ்வசனத்தை மட்டும் கொண்டு பொருளை அளவுக்கு மீறிக் குறுக்கும்.
theological_decisions:
- issue: பாளையத் தூய்மைச் சட்டங்களில் דָּבָר רָע என்பதன் பொருள் வரம்பு
  choice: ‘தீமையான எந்தக் காரியமும்’ என்று விரிவாக மொழிபெயர்க்கப்பட்டது.
  alternative: ‘தீட்டான எந்தக் காரியமும்’ அல்லது ‘தகாத எதுவும்’
  rationale: அடுத்துவரும் சூழல் சடங்குத் தீட்டைப் பற்றிப் பேசினாலும், இங்குள்ள எபிரெயச் சொற்றொடர் அதைவிட விரிவானது. அதைச் சடங்குத் தீட்டுக்கு மட்டும் வரையறுக்காமல் மூலத்தின் பொருள் அகலமும் விளக்கத் திறப்பும் பாதுகாக்கப்பட்டன.
translation_notes:
  register: நவீன நிலையான தமிழில், ஒருமை இரண்டாம் நபரை நேரடியாகச் சுட்டும் சட்ட அறிவுறுத்தல் நடையில் வடிவமைக்கப்பட்டது. ‘படையாகப் புறப்படும்போது’ என்பது எபிரெயச் சொற்றொடரின் இராணுவச் சூழலை இயல்பாகத் தெரிவிக்கிறது; மொழிநடை கண்ணியமாகவும் பொதுவாசகர்களுக்கு எளிதாகவும் வைக்கப்பட்டது.
