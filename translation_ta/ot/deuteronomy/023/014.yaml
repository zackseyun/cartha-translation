  terminology: ‘ஆப்பு’ is the better primary Tamil equivalent for יָתֵד in this context. ‘மலம்’ suitably renders the formal but explicit צֵאָה. The footnotes retain the lexical and euphemistic ambiguities without treating a disputed idiom as certain.
