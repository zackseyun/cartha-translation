  register: நவீன நிலையான தமிழில், சட்டப்பகுதிக்கேற்ற கண்ணியமான கட்டளைநடை பயன்படுத்தப்பட்டுள்ளது. எபிரெயத்தின் மறைமுகச் சொல்லாட்சி பாதுகாக்கப்பட்டு, தெளிவுக்காகத் தேவையற்ற விளக்கச் சொற்கள் வசனத்திற்குள் சேர்க்கப்படவில்லை.
