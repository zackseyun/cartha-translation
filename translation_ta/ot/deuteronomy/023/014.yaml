  text: וְ/יָתֵ֛ד תִּהְיֶ֥ה לְ/ךָ֖ עַל אֲזֵנֶ֑/ךָ וְ/הָיָה֙ בְּ/שִׁבְתְּ/ךָ֣ ח֔וּץ וְ/חָפַרְתָּ֣ה בָ֔/הּ וְ/שַׁבְתָּ֖ וְ/כִסִּ֥יתָ אֶת צֵאָתֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/014.yaml
  text: And you shall have a peg among your equipment[a], and when you sit down outside[c][b], you shall dig with it and turn back and cover your excrement.
translation:
  language: ta
  text: உன் உபகரணங்களோடு[a][b] ஒரு ஆப்பை வைத்திருக்க வேண்டும். நீ வெளியே உட்காரும்போது[c], அதனால் தோண்டி, திரும்பி, உன் மலத்தை மூட வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘முள்’; சிலர் இதை அதன் பயன்பாட்டின் அடிப்படையில் தோண்டும் கருவி அல்லது சிறிய மண்வெட்டி என்று புரிந்துகொள்கிறார்கள்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில் சொல்லுக்குச் சொல், ‘உன் காதின்மேல்.’ இங்கு இந்த மரபுத்தொடர் ஒருவருடைய உபகரணங்களையோ உடைமைகளையோ குறிக்கக்கூடும்.
    reason: lexical_alternative
  - marker: c
    text: எபிரெயத்தில், ‘நீ வெளியே உட்காரும்போது’ என்று உள்ளது; இது மலம் கழிப்பதை நயமாகக் குறிப்பிடும் மறைமுகச் சொல்.
    reason: cultural_note
lexical_decisions:
- source_word: יָתֵד
  choice: முள்
  rationale: இந்தப் பெயர்ச்சொல் பொதுவாக நிலத்தில் அடிக்கப்படும் முள் அல்லது ஆப்பைக் குறிக்கிறது. இச்சூழலில் அது தோண்டுவதற்குப் பயன்படுத்தப்படுகிறது; ‘முள்’ என்ற மொழிபெயர்ப்பு மூலத்தின் சொல்லுருவைப் பாதுகாக்கிறது, அடுத்த வாக்கியம் அதன் பயன்பாட்டைத் தெளிவாக்குகிறது.
- source_word: עַל אֲזֵנֶךָ
  choice: உன் பொருட்களோடு
  rationale: אֲזֵן என்பதன் நேர்ப்பொருள் ‘காது’; ஆனால் இங்கு அது படைவீரன் தன்னுடன் வைத்திருக்கும் உடைமைகள் அல்லது உபகரணங்களைக் குறிக்கும் மரபுத்தொடராகத் தெரிகிறது. ‘உன் பொருட்களோடு’ என்பது சூழலுக்கேற்ற இயல்பான தமிழ்.
- source_word: בְּשִׁבְתְּךָ חוּץ
  choice: நீ வெளியே உட்காரும்போது
  rationale: எபிரெயச் சொற்றொடரின் நேரடியான உருவம் ‘நீ வெளியே உட்காருகையில்’ என்பதாகும். இது மலம் கழிப்பதை நயமாகக் குறிப்பிடும் மறைமுகச் சொல்; தமிழிலும் அதன் அடக்கமான சொல்லாட்சியைப் பாதுகாக்கிறது.
- source_word: וְחָפַרְתָּה בָהּ
  choice: அதனால் தோண்டி
  rationale: பெண்பால் சுட்டுப்பெயர் முன் வரும் יָתֵד-ஐக் குறிக்கிறது. ‘குழி’ என்பது கருத்தில் இருந்தாலும் மூலத்தில் வெளிப்படையாக இல்லை; ஆகவே அதைச் சேர்க்காமல் ‘அதனால் தோண்டி’ என மொழிபெயர்க்கப்படுகிறது.
- source_word: וְשַׁבְתָּ
  choice: பிறகு திரும்பி
  rationale: שׁוב இங்கு தோண்டிய பின் திரும்பி கழிவை மூடும் செயல்வரிசையைக் காட்டுகிறது. ‘பிறகு திரும்பி’ என்பது அந்த வரிசையை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: צֵאָתֶךָ
  choice: உன் மலத்தை
  rationale: இந்தச் சொல் மனிதக் கழிவைக் குறிக்கிறது. ‘மலம்’ என்பது நவீனத் தமிழில் தெளிவான, கண்ணியமான, சட்டப்பகுதிக்குப் பொருத்தமான சொல்.
