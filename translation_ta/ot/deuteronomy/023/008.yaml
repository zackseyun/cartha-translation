id: DEU.23.8
reference: Deuteronomy 23:8
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: לֹֽא תְתַעֵ֣ב אֲדֹמִ֔י כִּ֥י אָחִ֖י/ךָ ה֑וּא לֹא תְתַעֵ֣ב מִצְרִ֔י כִּי גֵ֖ר הָיִ֥יתָ בְ/אַרְצֽ/וֹ־ס־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/008.yaml
  text: You shall not abhor an Edomite[a], for he is your brother. You shall not abhor an Egyptian[c][b], for you were a sojourner in his land.
translation:
  language: ta
  text: ஏதோமியனை அருவருக்காதே[a]; ஏனெனில் அவன் உன் சகோதரன்[b]. எகிப்தியனை அருவருக்காதே; ஏனெனில் நீ அவனுடைய நாட்டில் அந்நியக் குடியிருப்பாளனாக இருந்தாய்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “வெறுத்து ஒதுக்காதே.”
    reason: lexical_alternative
  - marker: b
    text: “உன் சகோதரன்” என்பது ஏசாவின் வழியாக இஸ்ரவேலுக்கும் ஏதோமுக்கும் உள்ள உறவைக் குறிக்கிறது.
    reason: cross_reference
  - marker: c
    text: அல்லது, “தங்கியிருந்த அந்நியனாக இருந்தாய்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: תְתַעֵב
  choice: அருவருக்காதே
  rationale: பியேல் வடிவம் ஒருவரை அருவருப்பானவராகக் கருதி வெறுத்து ஒதுக்கும் வலுவான மனப்பாங்கைக் குறிக்கிறது. இரு இணையான தடைகளிலும் ஒரே சொல்லைத் திரும்பப் பயன்படுத்துவது எபிரேய அமைப்பைப் பேணுகிறது.
- source_word: אֲדֹמִי
  choice: ஏதோமியன்
  rationale: ஏதோம் மக்களில் ஒருவரைக் குறிக்கும் ஒருமை இனப்பெயர்; எபிரேய சட்ட நடையின் பிரதிநிதித்துவ ஒருமையைப் பேணுகிறது.
- source_word: אָחִיךָ
  choice: உன் சகோதரன்
  rationale: நேரடியான உறவுமுறைச் சொல்லைப் பேணி, ஏசாவின் வழியாக இஸ்ரவேலுக்கும் ஏதோமுக்கும் உள்ள வரலாற்று உறவை விளக்கமாக உரைக்காமல் அப்படியே வைத்திருக்கிறது.
- source_word: מִצְרִי
  choice: எகிப்தியன்
  rationale: எகிப்து மக்களில் ஒருவரைக் குறிக்கும் நிலையான ஒருமை இனப்பெயர்.
- source_word: גֵר
  choice: அந்நியக் குடியிருப்பாளன்
  rationale: தன் சொந்த நிலத்துக்கும் குலத்துக்கும் வெளியே வேறொரு மக்களிடையே தங்கி வாழ்பவரைக் குறிக்கும் சமூக-சட்ட நுணுக்கத்தை இது வெளிப்படுத்துகிறது; பொதுவான ‘அந்நியன்’ என்பதைவிட தங்கியிருக்கும் நிலையைத் தெளிவுபடுத்துகிறது.
- source_word: בְאַרְצוֹ
  choice: அவனுடைய நாட்டில்
  rationale: ஒருமை பின்னொட்டைத் தொடர்ந்து, எகிப்தியன் என்பவன் எகிப்தை பிரதிநிதித்துவப்படுத்தும் மூலமொழி அமைப்பைப் பேணுகிறது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: இரண்டு கட்டளைகளுக்கும் தரப்படும் காரணத்தை இயல்பான நவீனத் தமிழில் தெளிவாக அறிமுகப்படுத்துகிறது.
theological_decisions:
- issue: தேசிய இனங்களைக் குறிக்கும் பிரதிநிதித்துவ ஒருமை
  choice: ‘ஏதோமியன்’, ‘எகிப்தியன்’, ‘அவன்’, ‘அவனுடைய நாடு’ என ஒருமை வடிவங்களைப் பேணுதல்
  alternative: தமிழ் வழக்கிற்காகப் பன்மைப்படுத்தி ‘ஏதோமியர்கள்’, ‘எகிப்தியர்கள்’, ‘அவர்களுடைய நாடு’ என மொழிபெயர்த்தல்
  rationale: எபிரேயச் சட்ட நடை ஒவ்வொரு மக்கள் குழுவின் உறுப்பினரையும் பிரதிநிதித்துவ ஒருமையில் குறிப்பிடுகிறது. ஒருமையைப் பேணுவது கட்டளையின் தனிப்பட்ட வலிமையையும் மூலத்தின் வடிவத்தையும் காக்கிறது.
- issue: ஏதோமுடன் உள்ள உறவுமுறை மொழி
  choice: ‘உன் சகோதரன்’ என்று நேரடியாக மொழிபெயர்த்தல்
  alternative: ‘உன் உறவினன்’ என்று விளக்கமளித்து மொழிபெயர்த்தல்
  rationale: இஸ்ரவேலுக்கும் ஏதோமுக்கும் உள்ள குடும்பத் தொடர்பை உரை தானே சகோதர உறவாகக் கூறுகிறது. அந்த வரலாற்று-இறையியல் அழுத்தத்தை விளக்கிச் சீராக்காமல் அப்படியே பேணுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சட்டக் கட்டளைக்கேற்ற சுருக்கமானதும் கண்ணியமானதுமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘அருவருக்காதே’ என்ற வலுவான சொல் இருமுறையும் மீள்கிறது. பிரதிநிதித்துவ ஒருமையும் ‘சகோதரன்’ என்ற மூல உறவுமுறைச் சொல்லும் பேணப்பட்டுள்ளன.
