base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/021.yaml
  text: You may charge interest to a foreigner[a], but to your brother you shall not charge interest[b], so that Yahweh your God may bless you in all the work of your hand in the land that you are entering to possess.
translation:
  language: ta
  text: உன் இறைவனாகிய யாவே உன்னை ஆசீர்வதிக்கும்படி, அந்நியனிடம் நீ வட்டி விதிக்கலாம்[a]; ஆனால் உன் சகோதரனிடம் வட்டி விதிக்கக் கூடாது[b]. நீ உரிமையாக்கிக்கொள்ள நுழைகிற நாட்டில், உன் கையின் எல்லாச் செயல்களிலும் அவர் உன்னை ஆசீர்வதிப்பார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'வேறு விதமாக: ‘வட்டிக்குக் கடன் கொடுக்கலாம்’ அல்லது ‘வட்டி வசூலிக்கலாம்.’'
    reason: lexical_alternative
  - marker: b
    text: இங்கு ‘உன் சகோதரன்’ என்பது இஸ்ரவேல் சமூகத்தைச் சேர்ந்த ஒருவரைக் குறிக்கிறது; எபிரெயம் குடும்ப உறவுச் சொல்லையே பயன்படுத்துகிறது.
    reason: cultural_note
lexical_decisions:
- source_word: לַנָּכְרִי
  choice: அந்நியனிடம்
  rationale: נָכְרִי என்பது இஸ்ரவேல் சமூகத்தைச் சேராத வெளிநாட்டவரை அல்லது புறத்தவரைக் குறிக்கிறது; சட்டச் சூழலில் ‘அந்நியன்’ இந்த வேறுபாட்டைச் சுருக்கமாகக் காக்கிறது.
- source_word: תַשִּׁיךְ / לֹא תַשִּׁיךְ
  choice: வட்டி வாங்கலாம் / வட்டி வாங்கக் கூடாது
  rationale: இந்தக் கடன் சட்டச் சூழலில் נשׁך என்பதன் ஹிஃபில் வடிவம் வட்டி விதித்து வாங்குவதைக் குறிக்கிறது. ‘வட்டி வாங்குதல்’ இயல்பான நவீனத் தமிழ்; அளவுக்கு மீறிய வட்டி என்ற கூடுதல் கருத்தைத் திணிக்காது.
- source_word: אָחִיךָ
  choice: உன் சகோதரனிடம்
  rationale: எபிரெயச் சொல்லின் குடும்ப உறவு உருவகத்தை நேரடியாகக் காக்கிறது; இச்சூழலில் அது உடன்படிக்கைச் சமூகமான இஸ்ரவேலைச் சேர்ந்த ஒருவரைக் குறிக்கிறது.
- source_word: לְמַעַן
  choice: ஆசீர்வதிப்பதற்காக
  rationale: நோக்கம் அல்லது விளைவைக் குறிக்கும் இணைப்பைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: יְבָרֶכְךָ יְהוָה אֱלֹהֶיךָ
  choice: உன் இறைவனாகிய யாவே உன்னை ஆசீர்வதிப்பதற்காக
  rationale: நோக்குச் சூழலிலுள்ள வினை வடிவத்தின் பொருளைக் காக்கிறது; יהוה என்ற உடன்படிக்கைப் பெயரை ‘யாவே’ என ஒலிபெயர்க்கிறது.
- source_word: בְּכֹל מִשְׁלַח יָדֶךָ
  choice: உன் கையின் எல்லா வேலைகளிலும்
  rationale: முயற்சிகள் அல்லது தொழில்கள் என்னும் பொருளுடைய எபிரெயக் கை உருவகத்தைப் புரியக்கூடிய தமிழில் காக்கிறது.
- source_word: עַל הָאָרֶץ
  choice: நாட்டில்
  rationale: இடத்தைக் குறிக்கும் இச்சூழலில் עַל என்பதற்கு இயல்பான தமிழாக்கம் ‘நாட்டில்’.
- source_word: אֲשֶׁר אַתָּה בָא שָׁמָּה לְרִשְׁתָּהּ
  choice: நீ உரிமையாக்கிக்கொள்ள நுழைகிற
  rationale: நாட்டுக்குள் வருவதையும் அதை உடைமையாக்கும் நோக்கத்தையும் சுருக்கமாகவும் தெளிவாகவும் தெரிவிக்கிறது.
theological_decisions:
- issue: יהוה என்ற உடன்படிக்கைப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலத்தில் இறைப்பெயர் நேரடியாக இருப்பதால், பொதுப்பட்டப் பெயராக மாற்றாமல் ‘யாவே’ என ஒலிபெயர்க்கப்பட்டது.
- issue: ‘சகோதரன்’ என்பவரின் சமூக அடையாளம்
  choice: மூலத்தின் குடும்ப உறவுச் சொல்லை உரையில் காத்து, அடிக்குறிப்பில் சக இஸ்ரவேலர் என விளக்குதல்
  alternative: உரையிலேயே ‘சக இஸ்ரவேலர்’ என விரித்தல்
  rationale: உடன்படிக்கைச் சமூகப் பொருளை விளக்கும்போதும் எபிரெயத்தின் குடும்ப உறவு உருவகத்தையும் அதன் இறையியல் அழுத்தத்தையும் இழக்காமல் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சட்ட உரைக்கேற்ற கண்ணியமான ஆனால் எளிதில் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. ஒருமை இரண்டாம் நபர் வடிவங்கள் காக்கப்பட்டுள்ளன; ‘யாவே’ என்ற இறைப்பெயரும் ‘உன் சகோதரன்’ என்ற குடும்ப உறவு உருவகமும் நேரடியாகப் பாதுகாக்கப்பட்டுள்ளன.
