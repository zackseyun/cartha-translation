source:
  edition: WLC
  text: גְּדִלִ֖ים תַּעֲשֶׂה לָּ֑/ךְ עַל אַרְבַּ֛ע כַּנְפ֥וֹת כְּסוּתְ/ךָ֖ אֲשֶׁ֥ר תְּכַסֶּה בָּֽ/הּ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/012.yaml
  text: You shall make tassels for yourself on the four corners of your covering with which you cover yourself[a][b].
translation:
  language: ta
  text: நீ உன்னைப் போர்த்திக்கொள்ளும் உன் ஆடையின்[b] நான்கு மூலைகளிலும் தொங்கல்கள்[a] செய்துகொள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “முறுக்கப்பட்ட கயிறுகள்” அல்லது “விளிம்புத் தொங்கல்கள்.”
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில், “உன் மூடுதுணி”; “மேலங்கி” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: גְּדִלִים
  choice: தொங்கல்கள்
  rationale: ஆடையின் மூலைகளில் இணைக்கப்படும் தொங்கும் நூல் அமைப்புகளைக் குறிக்கிறது. நவீனத் தமிழில் இயல்பாகப் புரியும் பொதுச்சொல்லாக இதைத் தேர்ந்தெடுத்தோம்; முறுக்கப்பட்ட கயிறுகள், விளிம்புத் தொங்கல்கள் என்பனவும் சாத்தியம்.
- source_word: תַּעֲשֶׂה לָּךְ
  choice: செய்துகொள்
  rationale: சட்டக் கட்டளையின் இரண்டாம் நபர் ஒருமை வலிமையையும், לָּךְ தரும் தனக்காக என்ற நலன்/தற்சுட்டுப் பொருளையும் இயல்பான தமிழில் ஒருங்கிணைக்கிறது.
- source_word: עַל אַרְבַּע כַּנְפוֹת
  choice: நான்கு மூலைகளிலும்
  rationale: כָּנָף என்பதன் அடிப்படைப் பொருள் 'சிறகு' அல்லது 'ஓரம்'; துணி அல்லது போர்வைச் சூழலில் அதன் நான்கு முனைகள் அல்லது மூலைகளைக் குறிக்கிறது. עַל என்பதன் இடப்பொருளையும் '-இல்' வெளிப்படுத்துகிறது.
- source_word: כְּסוּתְךָ
  choice: உன் போர்வை
  rationale: כְּסוּת என்பது போர்த்திக்கொள்ளப் பயன்படும் மூடுதுணி அல்லது ஆடையைக் குறிக்கலாம். தொடரும் 'போர்த்திக்கொள்ளும்' என்ற உறவுவாக்கியத்துடன் 'போர்வை' இயல்பாக அமைகிறது; குறிப்பிட்ட படுக்கைப் போர்வை என்று சுருக்காமல் இருக்க மாற்றுப் பொருள்கள் அடிக்குறிப்பில் தரப்படுகின்றன.
- source_word: אֲשֶׁר תְּכַסֶּה בָּהּ
  choice: நீ உன்னைப் போர்த்திக்கொள்ளும்
  rationale: போர்வையின் பயன்பாட்டை விளக்கும் உறவுவாக்கியம். כסה என்பதன் 'மூடு/போர்த்து' பொருளையும் செய்பவர்மீதே செயல் திரும்புவதையும் இயல்பான தமிழில் காக்கிறது.
