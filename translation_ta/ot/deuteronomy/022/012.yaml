translation_notes:
  register: நவீன நிலையான தமிழில், ஒருமை இரண்டாம் நபருக்கான வேதாகமச் சட்டநடை காக்கப்பட்டுள்ளது. மூலத்தின் சொல்விளையாட்டை ஒத்தவாறு 'போர்வை/போர்த்திக்கொள்ளும்' பயன்படுத்தப்பட்டுள்ளது. வாசிப்பை இயல்பாக்க உறவுவாக்கியம் தமிழுக்கேற்ற முன்னிலையில் வைக்கப்பட்டது; உண்மையான சொற்பொருள் மாற்றுகள் அடிக்குறிப்புகளில் பாதுகாக்கப்பட்டுள்ளன.
