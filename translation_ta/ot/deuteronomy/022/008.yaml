base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/008.yaml
  text: When you build a new house[a], you shall make a parapet for your roof, so that you do not bring bloodguilt on your house if someone falls from it.
translation:
  language: ta
  text: நீ ஒரு புதிய வீட்டைக் கட்டும்போது, யாராவது அதன் கூரைமாடியிலிருந்து விழுந்தால் உன் வீட்டின்மேல் இரத்தப்பழி வராதபடி, கூரைமாடியைச் சுற்றித் தடுப்புச் சுவர்[a] அமைக்க வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது “கைப்பிடிச் சுவர்” அல்லது “பாதுகாப்பு வேலி.” எபிரேயச் சொல், தட்டையான கூரைமாடியின் விளிம்பைச் சுற்றிக் கட்டப்படும் பாதுகாப்புத் தடையைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: கட்டும்போது
  rationale: இங்கு כִּי காரணத்தைக் குறிப்பிடாமல், ஒரு சட்டச் சூழ்நிலையை அறிமுகப்படுத்துகிறது. எனவே நிபந்தனைப் பொருளை இயல்பாக வெளிப்படுத்தும் ‘கட்டும்போது’ பயன்படுத்தப்பட்டது.
- source_word: תִבְנֶה בַּיִת חָדָשׁ
  choice: நீ ஒரு புதிய வீட்டைக் கட்டும்போது
  rationale: வினை, பொருள், பெயரடை ஆகியவற்றைத் தெளிவான நவீன தமிழில் நேரடியாக வெளிப்படுத்துகிறது.
- source_word: וְעָשִׂיתָ
  choice: அமைக்க வேண்டும்
  rationale: இந்தச் சட்டப் பகுதியில் வினை கட்டளையிடும் வலிமையுடையது. ‘வேண்டும்’ அந்தக் கடமையை இயல்பான நவீன தமிழில் காட்டுகிறது.
- source_word: מַעֲקֶה
  choice: தடுப்புச் சுவர்
  rationale: தட்டையான மாடியின் விளிம்பைச் சுற்றி அமைக்கப்படும் பாதுகாப்புத் தடையை இது குறிக்கிறது. ‘தடுப்புச் சுவர்’ துல்லியமாகவும் பொதுவாசகருக்குப் புரியும்படியும் உள்ளது; வேறு இயல்பான சொற்கள் அடிக்குறிப்பில் தரப்பட்டுள்ளன.
- source_word: לְגַגֶּךָ
  choice: மாடியைச் சுற்றி
  rationale: பாதுகாப்புத் தடை அமைக்கப்படும் இடத்தையும் அதன் நோக்கத்தையும் தமிழில் தெளிவுபடுத்துகிறது. பழங்கால வீட்டின் தட்டையான கூரை பயன்பாட்டில் மாடியாக இருந்ததால் ‘மாடி’ இயல்பான தேர்வு.
- source_word: וְלֹא תָשִׂים דָּמִים בְּבֵיתֶךָ
  choice: உன் வீட்டின்மேல் இரத்தப்பழி வராதபடி
  rationale: ‘இரத்தங்களை வைக்காதே’ என்ற எபிரேய மரபுத்தொடர், தவிர்க்கக்கூடிய மரணம் ஏற்பட்டால் உண்டாகும் சட்ட-அறப் பொறுப்பைக் குறிக்கிறது. ‘இரத்தப்பழி’ அந்த வலிமையைப் பாதுகாக்கிறது.
- source_word: כִּי יִפֹּל הַנֹּפֵל
  choice: யாராவது ... விழுந்துவிடுவதால்
  rationale: எபிரேயத்தில் சாத்தியமான, குறிப்பிட்டிராத ஒருவரைக் குறிக்கும் சொற்றொடரைத் தமிழில் இயல்பாகத் தெரிவிக்கிறது; நிகழ்ந்துவிட்ட சம்பவமாக அல்லாமல் தடுப்பு விதியின் காரணமாகக் காட்டுகிறது.
- source_word: מִמֶּנּוּ
  choice: அதன் மாடியிலிருந்து
  rationale: பின்னொட்டின் சுட்டுப்பொருளை வீட்டின் கூரை அல்லது மாடி எனச் சூழல் காட்டுகிறது. தமிழில் குழப்பத்தைத் தவிர்க்க அந்த இடம் வெளிப்படையாகக் குறிப்பிடப்பட்டது.
theological_decisions:
- issue: சட்டச் சூழலில் דָּמִים என்பதன் பொருள்
  choice: இரத்தப்பழி
  alternative: இரத்தச்சிந்துதல்; இரத்தத்துக்கான குற்றப்பொறுப்பு
  rationale: இவ்வசனம் உடல் இரத்தத்தை மட்டும் அல்லாமல், தடுக்கக்கூடிய மரணத்திற்கான சட்ட மற்றும் அறப் பொறுப்பைக் குறிக்கிறது. ‘இரத்தப்பழி’ இந்தப் பொருளைப் பாதுகாக்கிறது; பிற்காலக் கோட்பாடுகளைச் சேர்ப்பதில்லை.
translation_notes:
  register: நவீன தரத் தமிழில், சட்டத்தின் கட்டாயத் தொனியை ‘வேண்டும்’ என்பதன் மூலம் வெளிப்படுத்தியுள்ளது. ‘மாடி’ என்பது இங்கு பழங்கால வீட்டின் தட்டையான கூரைப்பகுதியைக் குறிக்கிறது. வாக்கிய அமைப்பு, பாதுகாப்பு ஏற்பாட்டின் நோக்கத்தையும் அலட்சியத்தால் ஏற்படும் இரத்தப்பழியையும் தெளிவாக இணைக்கிறது.
