id: DEU.22.1
reference: Deuteronomy 22:1
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: לֹֽא תִרְאֶה֩ אֶת שׁ֨וֹר אָחִ֜י/ךָ א֤וֹ אֶת שֵׂי/וֹ֙ נִדָּחִ֔ים וְ/הִתְעַלַּמְתָּ֖ מֵ/הֶ֑ם הָשֵׁ֥ב תְּשִׁיבֵ֖/ם לְ/אָחִֽי/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/001.yaml
  text: You shall not see your brother’s ox or his sheep driven away and ignore them; you must certainly return them to your brother.
translation:
  language: ta
  text: உன் சகோதரனுடைய எருதோ ஆடோ தவறிப்போயிருப்பதை நீ கண்டும், அவற்றைப் புறக்கணிக்கக் கூடாது; அவற்றை உன் சகோதரனிடம் கண்டிப்பாகத் திரும்பக் கொண்டுபோய்ச் சேர்க்க வேண்டும்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אָחִיךָ
  choice: உன் சகோதரன்
  rationale: உறவினரையும் உடன்படிக்கைச் சமூகத்தைச் சேர்ந்த ஒருவரையும் குறிக்கக்கூடிய எபிரேய உறவுமுறைச் சொல்லை நேரடியாகவும் இயல்பாகவும் வழங்குகிறது.
- source_word: שֵׂיוֹ
  choice: அவனுடைய ஆடு
  rationale: שֶׂה என்பது ஆடு அல்லது செம்மறியாட்டைக் குறிக்கலாம்; சூழலில் பொதுவான ‘ஆடு’ இயல்பான தேர்வு.
- source_word: נִדָּחִים
  choice: வழிதவறிப் போவதை
  rationale: נדח என்பதன் விரட்டப்படுதல் அல்லது விலகிச் செல்லுதல் என்ற பொருள் பரப்பை, இங்கு தொலைந்த கால்நடைகளுக்குப் பொருத்தமான இயல்பான தமிழில் தருகிறது; வெளிப்புற நபர் விரட்டினார் என்று தேவையின்றி உறுதிப்படுத்தவில்லை.
- source_word: וְהִתְעַלַּמְתָּ מֵהֶם
  choice: கண்டும் காணாதவன்போல் இருக்கக் கூடாது
  rationale: ஹித்பயேல் வடிவின் திட்டமிட்டு கவனிக்காமல் விடுதல் அல்லது தன்னை மறைத்துக்கொள்ளுதல் என்ற கருத்தை இயல்பான தமிழ் மரபுத்தொடரில் வெளிப்படுத்துகிறது.
- source_word: הָשֵׁב תְּשִׁיבֵם
  choice: கண்டிப்பாகத் திரும்பக் கொண்டுபோய்ச் சேர்க்க வேண்டும்
  rationale: முடிவிலி முழுவடிவம் மற்றும் வினைச்சொல் இணைப்பின் வலியுறுத்தலை ‘கண்டிப்பாக’ என்பதால் காத்து, உரிமையாளரிடம் மீட்டளிக்கும் செயலைத் தெளிவாக்குகிறது.
theological_decisions:
- issue: אָחִיךָ என்பதன் சமூக வரம்பு
  choice: உன் சகோதரன்
  alternative: உன் சக இஸ்ரவேலன் / உன் இனத்தான்
  rationale: மூலத்தின் உறவுமுறைச் சொல்லை விளக்கமாகக் குறுக்காமல் வைத்திருப்பதால் அதன் சமூக மற்றும் உடன்படிக்கை சார்ந்த பொருள் பரப்பு பாதுகாக்கப்படுகிறது.
- issue: נִדָּחִים என்பதன் செயப்பாட்டு நுணுக்கம்
  choice: வழிதவறிப் போவதை
  alternative: விரட்டப்பட்டிருப்பதை
  rationale: செயப்பாட்டு வடிவின் நுணுக்கத்தை ஒப்புக்கொண்டபோதும், கால்நடைகள் தம் இடத்திலிருந்து விலகி அல்லது சிதறிப்போன நிலையே கட்டளையின் மையம்; அறியப்படாத வெளிப்புற செயற்பாட்டாளரை மொழிபெயர்ப்பில் சேர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழ்; ஒருமை இரண்டாம் நபர் கட்டளைத் தொனி காக்கப்பட்டுள்ளது. சட்டவுரைத் தீவிரத்தை ‘கூடாது’ மற்றும் ‘கண்டிப்பாக ... வேண்டும்’ இயல்பாக வெளிப்படுத்துகின்றன.
