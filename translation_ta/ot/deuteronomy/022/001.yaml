revisions:
- from: உன் சகோதரனுடைய மாடோ ஆடோ வழிதவறிப் போவதை நீ கண்டும் காணாதவன்போல் இருக்கக் கூடாது; அவற்றை உன் சகோதரனிடம் கண்டிப்பாகத் திரும்பக் கொண்டுபோய்ச் சேர்க்க வேண்டும்.
  to: உன் சகோதரனுடைய எருதோ ஆடோ தவறிப்போயிருப்பதை நீ கண்டும், அவற்றைப் புறக்கணிக்கக் கூடாது; அவற்றை உன் சகோதரனிடம் கண்டிப்பாகத் திரும்பக் கொண்டுபோய்ச் சேர்க்க வேண்டும்.
  rationale: A limited lexical and aspectual revision improves correspondence with שׁוֹר and נִדָּחִים. The revised text preserves the legal register, the deliberate-refusal nuance of וְהִתְעַלַּמְתָּ מֵהֶם, and the emphatic force of הָשֵׁב תְּשִׁיבֵם, without adding an asserted cause for the animals’ displacement.
  reviewer_model: gpt-5.6-terra
