- from: அப்போது அந்த நகரத்தின் மூப்பர்கள் அந்த மனிதனைப் பிடித்து, அவனைத் தண்டிக்க வேண்டும்.[a]
  to: அப்போது அந்த நகரத்தின் மூப்பர்கள் அந்த மனிதனை அழைத்துக்கொண்டு, அவனை ஒழுக்கப்படுத்த வேண்டும்.[a]
  rationale: ‘பிடித்து’ என்பதனால் ஏற்பட்ட தேவையற்ற வலுக்கட்டாய உணர்வை நீக்கி, לָקַח என்பதன் நடுநிலையான பொருளை ‘அழைத்துக்கொண்டு’ என வழங்கியுள்ளேன். மேலும், יָסַר என்பதன் பரந்த திருத்தும்-ஒழுக்கப்படுத்தும் பொருளை முதன்மை உரையிலும் அடிக்குறிப்பிலும் தக்கவைத்துள்ளேன். அடிக்குறிப்பில் தண்டனையின் வடிவத்தைச் சூழல் மட்டும் உறுதியாக ‘விளக்குகிறது’ என்று கூறாமல், சூழலைக் கருத்தில் கொள்ள வேண்டும் என எச்சரிக்கையுடன் அமைத்துள்ளேன்.
