  text: Then the elders of that city shall take the man and discipline him,[a]
translation:
  language: ta
  text: அப்போது அந்த நகரத்தின் மூப்பர்கள் அந்த மனிதனை அழைத்துக்கொண்டு, அவனை ஒழுக்கப்படுத்த வேண்டும்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அவனைத் தண்டிக்க வேண்டும்,” “அவனைக் கண்டித்துத் திருத்த வேண்டும்,” அல்லது ஒருவேளை “அவனை அடிக்க வேண்டும்” என்றும் மொழிபெயர்க்கலாம். எபிரெய வினைச்சொல் திருத்தும் நோக்கிலான ஒழுக்க நடவடிக்கையைப் பரந்த வகையில் குறிக்கிறது; தண்டனையின் சரியான வடிவத்தை இச்சொல் மட்டும் தெளிவுபடுத்துவதில்லை; அதைச் சுற்றியுள்ள சட்டச் சூழலைக் கருத்தில் கொள்ள வேண்டும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקְחוּ
  choice: பிடித்து
  rationale: לקח என்பதன் அடிப்படைப் பொருள் ‘எடுத்துக்கொள்’; இச்சட்டச் சூழலில் அதிகாரிகள் அந்த மனிதனைத் தங்கள் கட்டுப்பாட்டுக்குள் கொண்டுவருவதைக் ‘பிடித்து’ என்பது இயல்பாகத் தெரிவிக்கிறது; ‘கைதுசெய்து’ என அளவுக்கு மீறிக் குறிப்பாக்கவில்லை.
- source_word: זִקְנֵי
  choice: மூப்பர்கள்
  rationale: இங்கு זקנים என்பது வயதான ஆண்களை மட்டும் அல்லாமல், நகரத்தின் அங்கீகரிக்கப்பட்ட சமூக-நீதித்துறைத் தலைவர்களைக் குறிக்கிறது.
- source_word: הָעִיר הַהִוא
  choice: அந்த நகரத்தின்
  rationale: עיר உள்ளூர் குடியிருப்பையும் அதன் ஆட்சிப்பரப்பையும் குறிக்கிறது; எபிரெய உரையிலுள்ள சுட்டுப்பொருளை ‘அந்த’ பாதுகாக்கிறது.
- source_word: הָאִישׁ
  choice: அந்த மனிதனை
  rationale: איש என்பதன் நேரடிப் பொருள் ‘மனிதன்/ஆண்’; முந்தைய சூழலில் கணவனைக் குறிப்பிட்டாலும், மூலத்தின் பொதுவான சொல்லைத் தக்கவைக்கிறது.
- source_word: וְיִסְּרוּ אֹתוֹ
  choice: அவனைத் தண்டிக்க வேண்டும்
  rationale: יסר ஒழுக்கப்படுத்துதல், கண்டித்துத் திருத்துதல், தண்டித்தல் ஆகிய பரந்த பொருள்களைக் கொண்டது. இச்சட்டச் சூழலில் ‘தண்டிக்க’ இயல்பாக உள்ளது; ஆனால் தண்டனையின் குறிப்பிட்ட வடிவத்தை நிர்ணயிப்பதில்லை.
