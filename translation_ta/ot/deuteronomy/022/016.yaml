source:
  edition: WLC
  text: וְ/אָמַ֛ר אֲבִ֥י ה/נער אֶל הַ/זְּקֵנִ֑ים אֶת בִּתִּ֗/י נָתַ֜תִּי לָ/אִ֥ישׁ הַ/זֶּ֛ה לְ/אִשָּׁ֖ה וַ/יִּשְׂנָאֶֽ/הָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/016.yaml
  text: And the young woman’s father shall say to the elders[a], ‘I gave my daughter to this man as a wife, and he hates her.’
translation:
  language: ta
  text: அந்த இளம்பெண்ணின் தந்தை மூப்பர்களிடம், “என் மகளை இந்த ஆணுக்கு மனைவியாகக் கொடுத்தேன்; அவன் அவளை வெறுக்கிறான்[a]” என்று சொல்ல வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவன் அவளை வெறுக்கத் தொடங்கிவிட்டான்.” எபிரெய வினைச்சொல்லின் அடிப்படைப் பொருள் ‘வெறுக்கிறான்’ என்பதே; இதைத் தற்போதைய மனநிலையாகவும், உருவாகிவிட்ட மனப்பான்மையாகவும் புரிந்துகொள்ளலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמַר
  choice: என்று சொல்ல வேண்டும்
  rationale: இது சட்ட வழக்கை விவரிக்கும் நடைமுறைச் சூழல் என்பதால், எளிய இறந்தகாலமாக அல்லாமல் செய்ய வேண்டிய செயலைக் குறிக்கும் விதத்தில் மொழிபெயர்க்கப்பட்டது.
- source_word: אֲבִי הַנַּעַר
  choice: அந்த இளம்பெண்ணின் தந்தை
  rationale: திருமண வயதுள்ள பெண்ணைக் குறிக்கும் சூழலில், நவீனத் தமிழில் இயல்பாகவும் மரியாதையாகவும் ‘இளம்பெண்’ பொருந்துகிறது.
- source_word: הַזְּקֵנִים
  choice: மூப்பர்கள்
  rationale: இங்கு வயதான ஆண்களை மட்டும் அல்லாமல், அங்கீகரிக்கப்பட்ட சமூக மற்றும் நீதித்துறைத் தலைவர்களைக் குறிக்கிறது.
- source_word: אֶת בִּתִּי
  choice: என் மகளை
  rationale: אֶת என்னும் நேரடிச் செயப்படுபொருள் குறியீடு தமிழில் தனியாக மொழிபெயர்க்கப்படாது; בִּתִּי என்பது ‘என் மகள்’ என்று நேரடியாகப் பொருள்படும்.
- source_word: נָתַתִּי
  choice: கொடுத்தேன்
  rationale: திருமண ஏற்பாட்டில் மகளை ஒருவருக்கு மனைவியாகக் கொடுத்ததைக் குறிக்கும் நேரடியான, இயல்பான தமிழ் சொல்.
- source_word: לָאִישׁ הַזֶּה
  choice: இந்த மனிதனுக்கு
  rationale: אִישׁ என்பதன் அடிப்படைப் பொருளான ‘மனிதன்/ஆண்’ என்பதைக் காக்கிறது; அடுத்துள்ள ‘மனைவியாக’ என்ற சொற்றொடர் திருமண உறவைத் தெளிவாக்குகிறது.
- source_word: לְאִשָּׁה
  choice: மனைவியாக
  rationale: திருமண உறவைச் சுட்டும் எபிரெய வழக்குச் சொற்றொடரை நவீனத் தமிழில் இயல்பாகத் தருகிறது.
- source_word: וַיִּשְׂנָאֶהָ
  choice: அவனோ அவளை வெறுக்கிறான்
  rationale: שׂנא என்பதன் நேரடிப் பொருள் ‘வெறு’. ‘அவனோ’ என்பது தந்தையின் செயலும் கணவனின் எதிர்மறை மனநிலையும் இடையிலான இயல்பான முரணைத் தமிழில் வெளிப்படுத்துகிறது; வினை நிகழ்கால மனநிலையாக வைக்கப்பட்டுள்ளது.
