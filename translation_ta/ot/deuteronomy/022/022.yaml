base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/022.yaml
  text: If a man is found lying with a woman married to a husband[a], then both of them shall die—the man who lay with the woman, and the woman[b]. So you shall purge the evil from Israel.
translation:
  language: ta
  text: ஒருவன் திருமணமான ஒரு பெண்ணுடன்[a] படுத்திருப்பதாகக் கண்டுபிடிக்கப்பட்டால், அவர்கள் இருவரும்—அந்தப் பெண்ணுடன் படுத்த ஆணும் அந்தப் பெண்ணும்—சாக வேண்டும்[b]. இவ்வாறு நீ இஸ்ரவேலிலிருந்து அந்தத் தீமையை அகற்ற வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லுக்கு நெருக்கமாக, “கணவனையுடைய ஒரு பெண்ணுடன்”; அதாவது, திருமணப் பிணைப்பில் உள்ள பெண்ணுடன்.
    reason: lexical_alternative
  - marker: b
    text: “சாக வேண்டும்” என்பது இச்சட்டத்தில் விதிக்கப்படும் மரணத் தண்டனையைக் குறிக்கிறது. சில மொழிபெயர்ப்புகள் இதைத் தெளிவுபடுத்த “கொல்லப்பட வேண்டும்” எனக் கூறுகின்றன.
    reason: alternative_reading
lexical_decisions:
- source_word: יִמָּצֵא
  choice: கண்டுபிடிக்கப்பட்டால்
  rationale: מצא என்பதன் நிஃபால் வடிவம் இங்கு ஒருவரின் செயல் வெளிப்படுவதையோ கண்டறியப்படுவதையோ குறிக்கிறது; சட்ட நடையில் ‘கண்டுபிடிக்கப்பட்டால்’ இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: שֹׁכֵב עִם
  choice: உடன் படுத்திருப்பது
  rationale: இது பாலுறவைக் குறிக்கும் எபிரேய மரபுத்தொடர். வெளிப்படையாக விளக்கிச் சொல்லாமல், மூலத்தின் சொல்லுருவத்தையும் சட்டநடையின் கண்ணியத்தையும் ‘உடன் படுத்திருப்பது’ காக்கிறது.
- source_word: בְעֻלַת בַּעַל
  choice: திருமணமான ஒரு பெண்
  rationale: சொல்லுக்கு நெருக்கமாக ‘கணவனுக்குரிய/கணவனையுடைய பெண்’ என வரலாம்; ஆனால் அது நவீன தமிழில் உடைமைப் பொருளைத் தவறாக முன்னிறுத்தக்கூடும். இங்கு நோக்கமான திருமணப் பிணைப்பை ‘திருமணமான ஒரு பெண்’ இயல்பாகத் தெரிவிக்கிறது; சொல்லடியான அமைப்பு அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: וּמֵתוּ גַּם שְׁנֵיהֶם
  choice: இருவரும் சாக வேண்டும்
  rationale: சட்டச் சூழலில் இது விதிக்கப்பட்ட மரணத் தண்டனையைக் குறிக்கிறது. ‘சாக வேண்டும்’ என்பது மூலத்தின் ‘சாவார்கள்/சாக வேண்டும்’ என்ற வடிவத்துக்கு நெருக்கமானது; ‘கொல்லப்பட வேண்டும்’ எனக் காரணவினையைச் சேர்ப்பதைத் தவிர்க்கிறது.
- source_word: הָאִישׁ הַשֹּׁכֵב עִם הָאִשָּׁה וְהָאִשָּׁה
  choice: அந்தப் பெண்ணுடன் படுத்த அந்த ஆணும் அந்தப் பெண்ணும்
  rationale: குற்றத்தில் தொடர்புடைய இருவரையும் சட்டத் தெளிவுக்காக எபிரேயம் மீண்டும் குறிப்பதைத் தமிழிலும் தக்கவைக்கிறது.
- source_word: וּבִעַרְתָּ הָרָע
  choice: அந்தத் தீமையை அகற்ற வேண்டும்
  rationale: உபாகமச் சட்டங்களில் בער என்பது சமூகத்திலிருந்து தீமையை நீக்குதல் அல்லது ஒழித்தல் என்ற பொருளுடைய நிலையான சூத்திரம். ‘அகற்ற வேண்டும்’ நவீன தமிழில் தெளிவாகவும் கண்ணியமாகவும் உள்ளது.
- source_word: מִיִּשְׂרָאֵל
  choice: இஸ்ரவேலிலிருந்து
  rationale: מִן முன்னிடைச்சொல் இங்கு இஸ்ரவேல் சமூகத்திலிருந்து நீக்கப்படுவதைக் குறிக்கிறது; நேரடியான வடிவம் தக்கவைக்கப்படுகிறது.
theological_decisions:
- issue: בְעֻלַת בַּעַל என்ற திருமணநிலைச் சொற்றொடரை மொழிபெயர்த்தல்
  choice: திருமணமான ஒரு பெண்
  alternative: கணவனையுடைய ஒரு பெண் / கணவனுக்கு மணமான ஒரு பெண்
  rationale: மூலத்தில் கணவனுடனான திருமணப் பிணைப்பு வலியுறுத்தப்படுகிறது. இயல்பான தமிழ் முதன்மை உரையில் பயன்படுத்தப்பட்டு, சொல்லடியான தன்மை அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது; உடைமையைக் குறிக்கும் தேவையற்ற நுண்பொருள் சேர்க்கப்படவில்லை.
- issue: וּמֵתוּ என்பதில் நீதிமுறை மரணத் தண்டனையை வெளிப்படையாகக் கூறுவதா
  choice: சாக வேண்டும்
  alternative: கொல்லப்பட வேண்டும் / மரண தண்டனை விதிக்கப்பட வேண்டும்
  rationale: சட்டச் சூழல் நீதிமுறை மரணத் தண்டனையை உணர்த்தினாலும், எபிரேய வினை நேரடியாக ‘சாகுதல்’ என்றே கூறுகிறது. மூலத்தின் வடிவம் முதன்மை உரையில் காக்கப்பட்டு, அதன் சட்டப் பொருள் அடிக்குறிப்பில் விளக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான சட்டநடை பயன்படுத்தப்பட்டுள்ளது. பாலுறவைக் குறிக்கும் எபிரேய மரபுத்தொடர் மிதமான நேரடித்தன்மையுடன் காக்கப்பட்டுள்ளது. இருவரையும் மீண்டும் குறிப்பிடும் மூலத்தின் சட்டத் தெளிவும், இரண்டாம் நபர் ஒருமை கட்டளையின் ‘நீ’ என்பதும் தக்கவைக்கப்பட்டுள்ளன.
