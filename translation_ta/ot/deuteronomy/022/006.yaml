translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குத் தெளிவானதும் கண்ணியமானதுமான சட்டநடை பயன்படுத்தப்பட்டது. ஒருமை இரண்டாம் நபரைக் காட்ட ‘உன்’ பயன்படுத்தப்பட்டுள்ளது; தற்செயல் சந்திப்பு மற்றும் தாயைச் சந்ததியோடு சேர்த்து எடுக்கும் எபிரெய மரபுத்தொடர் அடிக்குறிப்புகளில் விளக்கப்பட்டுள்ளன.
