  verdict: revise
  source_fidelity: தற்செயலாக எதிர்ப்படும் கூடு, மரம்/தரை, குஞ்சுகள் அல்லது முட்டைகள், அவற்றின்மேல் தாய் இருப்பது ஆகிய மூலத்தின் கூறுகள் துல்லியமாக உள்ளன. ஆனால் இறுதியில் ‘குஞ்சுகளோடு’ என்பது முட்டைகள் உள்ள நிலையையும் உள்ளடக்க வேண்டிய மூலக் கட்டளையைச் சற்றுக் குறுக்குகிறது; ‘பிடிக்க’ என்பதும் ‘எடுத்துக்கொள்ளுதல்’ என்பதைக் காட்டிலும் பிடித்தல்/பிடிபடுதல் என்ற குறிப்பான பொருளைத் தரலாம்.
