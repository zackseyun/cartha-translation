base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/006.yaml
  text: If a bird’s nest happens to be before you on the way[a], in any tree or on the ground, with young ones or eggs, and the mother is sitting on the young ones or on the eggs[b], you shall not take the mother along with the young.
translation:
  language: ta
  text: வழியில் ஏதாவது ஒரு மரத்திலோ தரையிலோ குஞ்சுகளோ முட்டைகளோ உள்ள ஒரு பறவைக் கூடு தற்செயலாக உன் கண்ணில் பட்டால்,[a] அந்தக் குஞ்சுகளின்மேலோ முட்டைகளின்மேலோ தாய்ப்பறவை உட்கார்ந்திருந்தால், அவற்றோடு தாய்ப்பறவையையும் எடுத்துக்கொள்ளக் கூடாது.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஒரு பறவைக் கூடு உனக்கு எதிர்ப்பட்டால்.” எபிரெய வினைச்சொல் திட்டமிட்டுத் தேடுவதைக் காட்டிலும் தற்செயலாகக் காண்பதைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: எழுத்துப்படி, “சந்ததியின்மேல் தாயை.” இங்கு இந்தச் சொற்றொடர் தாய்ப்பறவையை அதன் குஞ்சுகள் அல்லது முட்டைகளோடு சேர்த்து எடுத்துக்கொள்வதைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי יִקָּרֵא
  choice: தற்செயலாக உன் கண்ணில் பட்டால்
  rationale: כִּי நிபந்தனைச் சட்டத்தை அறிமுகப்படுத்துகிறது; יִקָּרֵא திட்டமிட்ட தேடலை அல்ல, எதிர்பாராமல் நேரிடும் சந்திப்பைக் குறிக்கிறது. இத்தமிழாக்கம் இரண்டையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: קַן צִפּוֹר
  choice: ஒரு பறவைக் கூடு
  rationale: எபிரெயக் கூட்டு அமைப்பின் பொருளை இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: לְפָנֶיךָ בַּדֶּרֶךְ
  choice: வழியில் ... உன் கண்ணில் பட்டால்
  rationale: சொல்லுக்குச் சொல் 'உனக்கு முன்பாக வழியில்' என்பதற்குப் பதிலாக, பயணப்பாதையில் எதிர்ப்படுவதைத் தெளிவாகவும் இயல்பாகவும் கூறுகிறது.
- source_word: בְּכָל עֵץ אוֹ עַל הָאָרֶץ
  choice: ஏதாவது ஒரு மரத்திலோ தரையிலோ
  rationale: கூடு இருக்கக்கூடிய இரு இடங்களையும் துல்லியமாகக் குறிக்கிறது; הָאָרֶץ இச்சூழலில் நிலப்பரப்பை விடத் 'தரை' என்பதே பொருத்தம்.
- source_word: אֶפְרֹחִים אוֹ בֵיצִים
  choice: குஞ்சுகளோ முட்டைகளோ
  rationale: கூட்டிலுள்ள இளம் பறவைகளையும் முட்டைகளையும் நேரடியாகவும் பொதுவாகவும் குறிக்கிறது.
- source_word: וְהָאֵם רֹבֶצֶת
  choice: தாய்ப்பறவை உட்கார்ந்திருந்தால்
  rationale: רֹבֶצֶת என்பதன் நிலைசார் பொருளை வழங்குகிறது; 'அடைகாத்தல்' என்பது நோக்கத்தைச் சேர்க்கக்கூடும் என்பதால் தவிர்க்கப்பட்டது. தமிழில் தெளிவுக்காக 'பறவை' சேர்க்கப்பட்டது.
- source_word: לֹא תִקַּח
  choice: பிடிக்கக் கூடாது
  rationale: பறவையை எடுத்துச் செல்லும் அல்லது கைப்பற்றும் செயலைத் தமிழில் இயல்பாகக் குறித்து, சட்டத் தடையின் வலிமையைப் பேணுகிறது.
- source_word: הָאֵם עַל הַבָּנִים
  choice: குஞ்சுகளோடு தாய்ப்பறவையையும்
  rationale: இங்கு עַל இடநிலையை மட்டும் அல்லாமல் தாயையும் அதன் சந்ததியோடு சேர்த்து எடுத்தலைக் குறிக்கும் மரபுத்தொடராகப் புரிகிறது. הַבָּנִים என்பதற்குச் சூழலுக்கேற்றவாறு 'குஞ்சுகள்' பயன்படுத்தப்பட்டது.
