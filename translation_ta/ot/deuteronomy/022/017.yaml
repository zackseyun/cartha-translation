  text: וְ/הִנֵּה ה֡וּא שָׂם֩ עֲלִילֹ֨ת דְּבָרִ֜ים לֵ/אמֹ֗ר לֹֽא מָצָ֤אתִי לְ/בִתְּ/ךָ֙ בְּתוּלִ֔ים וְ/אֵ֖לֶּה בְּתוּלֵ֣י בִתִּ֑/י וּ/פָֽרְשׂוּ֙ הַ/שִּׂמְלָ֔ה לִ/פְנֵ֖י זִקְנֵ֥י הָ/עִֽיר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/017.yaml
  text: and look[a], he has charged her with slanderous words, saying, “I did not find your daughter a virgin.” But these are the proofs of my daughter’s virginity[c][b]. And they shall spread out the garment before the elders of the city.
translation:
  language: ta
  text: “இதோ, ‘உங்கள் மகள் கன்னியாக இருப்பதை நான் காணவில்லை’ என்று கூறி, அவன் அவள்மீது அவதூறான குற்றச்சாட்டுகளைச் சுமத்தியிருக்கிறான். ஆனால், இவையே என் மகளின் கன்னித்தன்மைக்கான அடையாளங்கள்[a]” என்று அவளுடைய தந்தை சொல்ல வேண்டும். பின்பு அவர்கள் அந்தத் துணியை நகரத்தின் மூப்பர்கள் முன்னிலையில் விரித்துக் காட்ட வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “உங்கள் மகளுக்குக் கன்னித்தன்மைகளை நான் காணவில்லை” என்றும், “இவையே என் மகளின் கன்னித்தன்மைகள்” என்றும் உள்ளது. இவை கன்னித்தன்மையையும் அதற்கான அடையாளங்கள் அல்லது சான்றுகளையும் குறிக்கும் மரபுத்தொடர்கள். இங்கு குறிப்பிடப்படும் துணி இந்த வழக்கில் சட்டச் சான்றாகக் காட்டப்படுகிறது.
    reason: lexical_and_cultural_note
lexical_decisions:
- source_word: וְהִנֵּה
  choice: இதோ
  rationale: குற்றச்சாட்டை நோக்கிக் கவனத்தை ஈர்க்கும் எபிரெய உரையாடல் குறியீட்டின் சுட்டும் வலிமையை இயல்பான தமிழில் காக்கிறது.
- source_word: שָׂם עֲלִילֹת דְּבָרִים
  choice: அவள்மீது அவதூறான குற்றச்சாட்டுகளைச் சுமத்தியிருக்கிறான்
  rationale: ஒருவர் மீது பழியுண்டாக்கும் குற்றச்சாட்டுகளை வைப்பது என்ற சட்டவியல் பொருளைத் தெளிவாகக் காட்டுகிறது; சூழலிலிருந்து ‘அவள்மீது’ சேர்க்கப்பட்டுள்ளது.
- source_word: לֹא מָצָאתִי לְבִתְּךָ בְּתוּלִים
  choice: உங்கள் மகளிடம் கன்னித்தன்மைக்கான சான்றுகளை நான் காணவில்லை
  rationale: ‘உங்கள் மகளுக்குக் கன்னித்தன்மைகளை நான் காணவில்லை’ என்ற எபிரெய மரபுத்தொடரை, அடுத்த வாக்கியத்திலுள்ள சான்றுகளுடனான தொடர்பை இழக்காமல் இயல்பான தமிழில் தருகிறது.
- source_word: וְאֵלֶּה בְּתוּלֵי בִתִּי
  choice: ஆனால் இவையே என் மகளின் கன்னித்தன்மைக்கான சான்றுகள்
  rationale: பன்மை வடிவம் இச்சட்டச் சூழலில் கன்னித்தன்மையைச் சுட்டும் அடையாளங்கள் அல்லது சான்றுகளைக் குறிக்கிறது; ‘ஆனால்’ குற்றச்சாட்டுக்கும் மறுப்புக்கும் இடையிலான எதிர்மறைத் தொடர்பை வெளிப்படுத்துகிறது.
- source_word: וּפָרְשׂוּ הַשִּׂמְלָה
  choice: பின்பு அவர்கள் அந்தத் துணியை ... விரித்துக் காட்ட வேண்டும்
  rationale: தொடர்ந்து மேற்கொள்ளப்படும் சட்ட நடைமுறையை ‘பின்பு’ காட்டுகிறது; שִׂמְלָה என்பதைக் குறிப்பிட்ட வகை ஆடையாக மிகையாக நிர்ணயிக்காமல் ‘துணி’ எனத் தருகிறது.
- source_word: לִפְנֵי זִקְנֵי הָעִיר
  choice: நகரத்தின் மூப்பர்கள் முன்னிலையில்
  rationale: குடிமை நீதித் தலைவர்களின் முன்னிலையில் சான்று சமர்ப்பிக்கப்படுவதை இயல்பான தமிழில் தெரிவிக்கிறது.
