translation_notes:
  register: நவீனத் தரத் தமிழில், சட்டவியல் சூழலுக்கேற்ற கண்ணியமான நடையுடன் மொழிபெயர்க்கப்பட்டுள்ளது. எபிரெய வசனத்தில் பேச்சாளர் வெளிப்படையாக மீண்டும் குறிப்பிடப்படாதபோதிலும், முந்தைய வசனத்திலிருந்து அது பெண்ணின் தந்தை என்பதால் இயல்பான தமிழுக்காக ‘அவளுடைய தந்தை சொல்ல வேண்டும்’ சேர்க்கப்பட்டுள்ளது. மரியாதைப் பன்மையான ‘உங்கள்’ பயன்படுத்தப்பட்டுள்ளது.
