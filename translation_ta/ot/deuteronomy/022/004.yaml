source:
  edition: WLC
  text: לֹא תִרְאֶה֩ אֶת חֲמ֨וֹר אָחִ֜י/ךָ א֤וֹ שׁוֹר/וֹ֙ נֹפְלִ֣ים בַּ/דֶּ֔רֶךְ וְ/הִתְעַלַּמְתָּ֖ מֵ/הֶ֑ם הָקֵ֥ם תָּקִ֖ים עִמּֽ/וֹ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/004.yaml
  text: You shall not see your brother’s donkey or his ox fallen on the road and ignore them[a]; you must surely lift them up with him.
translation:
  language: ta
  text: உன் சகோதரனுடைய கழுதையோ எருதோ வழியில் விழுந்து கிடப்பதை நீ பார்த்தும் அதைக் கண்டுகொள்ளாமல் இருக்கக்கூடாது; அவனோடு சேர்ந்து அதைத் தூக்கி நிறுத்த வேண்டும்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אָחִיךָ
  choice: உன் சகோதரனுடைய
  rationale: எபிரெயச் சொல்லின் நேரடியான குடும்பச் சொல்லாட்சியையும், உடன்படிக்கைச் சமூகத்தில் சக உறுப்பினரைக் குறிக்கும் அதன் விரிவான வலிமையையும் காக்கிறது.
- source_word: חֲמוֹר
  choice: கழுதை
  rationale: நவீனத் தமிழில் விலங்கைத் தெளிவாகவும் இயல்பாகவும் குறிக்கும் வழக்கமான சொல்.
- source_word: שׁוֹרוֹ
  choice: மாடு
  rationale: שׁוֹר இங்கு உழைப்புக்குப் பயன்படும் பெரிய கால்நடையைக் குறிக்கிறது; ‘மாடு’ சாதாரண வாசகருக்குப் புரியும் இயல்பான தமிழ்ச் சொல், பாலினத்தைத் தேவையின்றி வரையறுப்பதில்லை.
- source_word: נֹפְלִים
  choice: விழுந்து கிடப்பதை
  rationale: விலங்குகள் வழியில் கீழே விழுந்து எழ முடியாத நிலையில் இருப்பதை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: בַּדֶּרֶךְ
  choice: வழியில்
  rationale: இடத்தைக் குறிக்கும் எபிரெயத் தொடருக்கு சுருக்கமான, இயல்பான தமிழ் இணை.
- source_word: וְהִתְעַלַּמְתָּ מֵהֶם
  choice: கண்டும் காணாதவன்போல் இருக்க
  rationale: வேண்டுமென்றே கவனிக்காமல் கடந்து செல்வதைக் குறிக்கும் ஹித்பயேல் சொற்றொடரின் மொழிவழக்குப் பொருளைத் தமிழில் தெளிவாக எடுத்துரைக்கிறது.
- source_word: הָקֵם תָּקִים
  choice: தூக்கி நிறுத்த வேண்டும்
  rationale: வினையெச்ச முழுமை வடிவமும் வரையறுக்கப்பட்ட வினையும் சேர்ந்த வலியுறுத்தப்பட்ட கட்டளையை ‘வேண்டும்’ எனக் காட்டி, விழுந்த விலங்கை எழுப்பும் செயலை ‘தூக்கி நிறுத்த’ என இயல்பாக மொழிபெயர்க்கிறது.
- source_word: עִמּוֹ
  choice: அவனோடு சேர்ந்து
  rationale: உரிமையாளரைத் தனியே விட்டுவிடாமல் அவருடன் இணைந்து செயல்பட வேண்டும் என்ற ‘அவனுடன்’ என்னும் நேரடிப் பொருளைக் காக்கிறது.
