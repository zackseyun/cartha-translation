source:
  edition: WLC
  text: כִּֽי יִמְצָ֣א אִ֗ישׁ נער בְתוּלָה֙ אֲשֶׁ֣ר לֹא אֹרָ֔שָׂה וּ/תְפָשָׂ֖/הּ וְ/שָׁכַ֣ב עִמָּ֑/הּ וְ/נִמְצָֽאוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/028.yaml
  text: If a man finds a young woman[a], a virgin who is not engaged, and seizes her and lies with her, and they are discovered[b],
translation:
  language: ta
  text: ஒருவன் திருமண நிச்சயதார்த்தம் செய்யப்படாத[a] கன்னியான ஓர் இளம்பெண்ணைக் கண்டு, அவளைப் பற்றிப்பிடித்து[b] அவளுடன் பாலுறவு கொண்டால், அவர்கள் இருவரும் கண்டுபிடிக்கப்படும்போது,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மணஒப்பந்தம் செய்யப்படாத.”
    reason: אֹרָשָׂה என்பது சாதாரண நவீன நிச்சயதார்த்தத்தைவிடச் சட்டபூர்வமான மணஒப்பந்த நிலையைக் குறிக்கக்கூடும்.
  - marker: b
    text: இதற்கான எபிரேய வினைச்சொல் “பற்றிப்பிடி,” “கைப்பற்று,” அல்லது “பிடித்துக்கொள்” என்று பொருள்படலாம். இங்கு இந்தச் சொற்றொடர் பாலியல் வல்லுறவைக் குறிப்பதாகச் சிலர் புரிந்துகொள்கிறார்கள்; அந்தச் சட்ட நுணுக்கத்தை இந்த வினைச்சொல்லிலிருந்து மட்டும் அல்லாமல் விரிவான சூழலிலிருந்தே தீர்மானிக்க வேண்டும் என்று மற்றவர்கள் கருதுகிறார்கள்.
    reason: மூல வினைச்சொல்லின் பொருள் வரம்பையும், இப்பகுதியின் முக்கியமான விளக்க வேறுபாட்டையும் வெளிப்படையாகப் பாதுகாக்கிறது.
lexical_decisions:
- source_word: כִּי
  choice: ஒருவன் ... கொண்டால்
  rationale: நிபந்தனை வடிவிலான சட்டத்தை அறிமுகப்படுத்துவதால், தமிழில் இயல்பான ‘...கொண்டால்’ என்ற சட்டநடை பயன்படுத்தப்பட்டுள்ளது.
- source_word: יִמְצָא
  choice: கண்டு
  rationale: ‘கண்டுபிடி’ அல்லது ‘எதிர்ப்படு’ என்று பொருள்படக்கூடிய பொதுவான வினை; இங்கு சுருக்கமாகவும் நேரடியாகவும் ‘கண்டு’ என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: אִישׁ
  choice: ஒருவன்
  rationale: ஆண்பால் ஒருமையைத் துல்லியமாகக் காக்கிறது; நிபந்தனைச் சட்ட நடையிலும் இயல்பாக உள்ளது.
- source_word: נער בְתוּלָה
  choice: கன்னியான ஓர் இளம்பெண்
  rationale: எபிரேயச் சொற்றொடரில் உள்ள இளமை மற்றும் கன்னித்தன்மை ஆகிய இரு கூறுகளையும் நவீன, கண்ணியமான தமிழில் காக்கிறது.
- source_word: אֲשֶׁר לֹא אֹרָשָׂה
  choice: திருமணத்துக்கு நிச்சயிக்கப்படாத
  rationale: சட்டப்பூர்வமாக மணத்திற்கு ஒப்புக்கொடுக்கப்படாத நிலையைக் குறிக்கிறது; ‘நிச்சயிக்கப்படாத’ என்பது பொதுவான நவீன தமிழ்.
- source_word: וּתְפָשָׂהּ
  choice: அவளைப் பற்றிப்பிடித்து
  rationale: תפשׂ என்பதன் ‘பிடி, பற்றிக்கொள், கைப்பற்று’ என்ற உடல் சார்ந்த வலிமையை வெளிப்படுத்துகிறது; அதேவேளையில் முதன்மை உரையிலேயே ஒரு குறிப்பிட்ட சட்ட விளக்கத்தைத் திணிக்கவில்லை.
- source_word: וְשָׁכַב עִמָּהּ
  choice: அவளுடன் பாலுறவு கொண்டு
  rationale: பாலுறவைக் குறிக்கும் எபிரேய மரபுத்தொடரின் பொருளை இன்றைய வாசகர்களுக்கு தெளிவாகவும் கண்ணியமாகவும் தெரிவிக்கிறது.
- source_word: וְנִמְצָאוּ
  choice: அவர்கள் இருவரும் கண்டுபிடிக்கப்படும்போது
  rationale: எபிரேயத்தில் உள்ள பன்மைச் செயப்பாட்டு வடிவத்தைப் பாதுகாக்க ‘அவர்கள் இருவரும்’ எனத் தெளிவுபடுத்தப்பட்டுள்ளது; வாக்கியம் அடுத்த வசனத்தில் தொடர்வதால் ‘...போது’ என முடிகிறது.
theological_decisions:
- issue: இந்தச் செயலை முதன்மை உரையில் நேரடியாக ‘பாலியல் வல்லுறவு’ என்று பெயரிட வேண்டுமா?
  choice: ‘அவளைப் பற்றிப்பிடித்து அவளுடன் பாலுறவு கொண்டு’ என்ற மூலச்சொற்களுக்கு நெருக்கமான வடிவம்
  alternative: ‘அவளைப் பாலியல் வல்லுறவுக்கு உட்படுத்தி’ அல்லது மென்மையாக ‘அவளை எடுத்துக்கொண்டு’
  rationale: תפשׂ உடலால் பிடித்தல் அல்லது கைப்பற்றுதல் என்ற வலுவைக் கொண்டிருந்தாலும், அந்த வினை மட்டும் சம்பவத்தின் முழுச் சட்ட வகைப்பாட்டையும் சந்தேகமின்றி தீர்மானிப்பதில்லை. ஆகவே அதன் வலிமையை மென்மையாக்காமலும், விவாதிக்கப்படும் முடிவை முதன்மை உரையில் திணிக்காமலும் மொழிபெயர்க்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழ்; சட்ட உரைக்கு ஏற்ற கண்ணியமான, தெளிவான நடை. ‘பாலுறவு’ என்பது பழமையான மறைமுகச் சொல்லாட்சியைத் தவிர்த்து பொருளைத் தெளிவாக்குகிறது. வசனம் அடுத்த வசனத்தில் தொடர்வதால் இறுதியில் காற்புள்ளி வைக்கப்பட்டுள்ளது.
