review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the casuistic condition, the man, the young unmarried virgin, the physical verb תפשׂ, sexual intercourse, and the passive plural ‘they are discovered.’ It appropriately avoids deciding the debated legal classification in the main text. However, ‘திருமணத்துக்கு நிச்சயிக்கப்படாத’ can mean ‘not designated/decided for marriage’ rather than not being in the legally binding betrothal state denoted by אֹרָשָׂה.
  naturalness: The Tamil is generally clear and suitably formal. ‘திருமண நிச்சயதார்த்தம் செய்யப்படாத’ is more precise in this legal context while remaining understandable in modern standard Tamil. The verse-ending comma correctly signals continuation into the following verse.
  terminology: ‘கன்னியான ஓர் இளம்பெண்,’ ‘அவளைப் பற்றிப்பிடித்து,’ and ‘அவளுடன் பாலுறவு கொண்டால்’ are faithful, dignified, and clear. ‘மணஒப்பந்தம்’ is a useful footnote alternative for the juridical sense of betrothal.
  issues:
  - severity: medium
    issue: The main-text rendering of אֹרָשָׂה is imprecise.
    rationale: ‘திருமணத்துக்கு நிச்சயிக்கப்படாத’ may describe a woman for whom marriage has not been arranged or determined. The Hebrew specifically refers to a woman not betrothed/legally pledged in marriage. Adding ‘நிச்சயதார்த்தம்’ preserves that status distinction.
  revised_text: ஒருவன் திருமண நிச்சயதார்த்தம் செய்யப்படாத[a] கன்னியான ஓர் இளம்பெண்ணைக் கண்டு, அவளைப் பற்றிப்பிடித்து[b] அவளுடன் பாலுறவு கொண்டால், அவர்கள் இருவரும் கண்டுபிடிக்கப்படும்போது,
