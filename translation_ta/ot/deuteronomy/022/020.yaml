  register: நவீன நிலையான தமிழில், சட்டச் சூழலுக்கேற்ற கண்ணியமான மற்றும் தெளிவான நடை. வசனம் அடுத்த வசனத்தில் நிறைவடையும் நிபந்தனைத் துணைவாக்கியமாக இருப்பதால் இறுதியில் காற்புள்ளி வைக்கப்பட்டுள்ளது.
