source:
  edition: WLC
  text: וְ/אִם אֱמֶ֣ת הָיָ֔ה הַ/דָּבָ֖ר הַ/זֶּ֑ה לֹא נִמְצְא֥וּ בְתוּלִ֖ים ל/נער־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/020.yaml
  text: But if this matter is true[a], and evidence of virginity was not found for the young woman,
translation:
  language: ta
  text: ஆனால், இந்தக் காரியம் உண்மையாக இருந்து, அந்த இளம் பெண்ணுக்குக் கன்னித்தன்மைக்கான சான்றுகள் காணப்படவில்லை என்றால்,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அந்த இளம் பெண்ணுக்குக் கன்னித்தன்மையின் அடையாளங்கள் காணப்படவில்லை என்றால்.” எபிரெயச் சொல் בְּתוּלִים என்பது சொற்பொருளில் “கன்னித்தன்மை” என்றும், இந்தப் பழங்காலச் சட்ட வழக்கின் சூழலில் “கன்னித்தன்மையின் அடையாளங்கள் அல்லது சான்றுகள்” என்றும் பொருள்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: ஆனால் ... என்றால்
  rationale: முந்தைய வசனத்தில் கூறப்பட்ட நிலைக்கு மாறான நிபந்தனையை இயல்பான தமிழில் அறிமுகப்படுத்துகிறது.
- source_word: אֱמֶת הָיָה
  choice: உண்மையாக இருந்து
  rationale: எபிரெய வாக்கியத்தின் இறந்தகால வடிவையும் நிபந்தனைச் சூழலையும் காத்து, தமிழில் இயல்பாக வழங்குகிறது.
- source_word: הַדָּבָר הַזֶּה
  choice: இந்தக் காரியம்
  rationale: நீதிசார் சூழலில் உள்ள விவகாரம் அல்லது குற்றச்சாட்டை அளவுக்கு மீறிக் குறிப்பாக்காமல் தெரிவிக்கிறது.
- source_word: לֹא נִמְצְאוּ
  choice: காணப்படவில்லை
  rationale: எபிரெய செயலப்பாட்டு வடிவத்தை இயல்பான தமிழ் செயலப்பாட்டு நடையில் பிரதிபலிக்கிறது.
- source_word: בְּתוּלִים
  choice: கன்னித்தன்மைக்கான சான்றுகள்
  rationale: இச்சட்டச் சூழலில் எதிர்பார்க்கப்படும் கன்னித்தன்மையின் அடையாளங்கள் அல்லது சான்றுகள் என்ற பொருளை நவீன தமிழில் தெளிவாகத் தருகிறது; அடிக்குறிப்பு சொற்பொருள் வாய்ப்பையும் காக்கிறது.
- source_word: לַנַּעֲרָ
  choice: அந்த இளம் பெண்ணிடம்
  rationale: திருமண வயதுடைய இளம் பெண்ணைக் குறிக்கும் சொல்லை மரியாதையான நவீன தமிழில் வழங்குகிறது; சான்றுகள் அவளைச் சார்ந்து காணப்படுதல் என்ற சூழலைத் தெரிவிக்கிறது.
