base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/002.yaml
  text: But if your brother is not near you[a], and you do not know him, then you shall bring it into your house, and it shall remain with you until your brother seeks it[c][b]; then you shall restore it to him.
translation:
  language: ta
  text: ஆனால் உங்கள் சகோதரன்[a] உங்களுக்கு அருகில் இல்லாதிருந்தாலும், அவனை உங்களுக்குத் தெரியாவிட்டாலும்[b], அதை உங்கள் வீட்டுக்குள் கொண்டுவந்து, உங்கள் சகோதரன் அதைத் தேடும்வரை உங்களிடம் வைத்திருக்க வேண்டும்; பிறகு அதை அவனுக்குத் திருப்பிக் கொடுக்க வேண்டும்.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “சகோதரன்” என்பது உடன்பிறந்த சகோதரனை மட்டும் அல்லாமல், உடன்படிக்கைச் சமூகத்தைச் சேர்ந்த சக இஸ்ரவேலரையும் பரந்த பொருளில் குறிக்கலாம்.
    reason: cultural_note
  - marker: b
    text: அதாவது, “அது யாருடையது என்று உங்களுக்குத் தெரியாவிட்டாலும்”; சொல்லுக்குச் சொல், “அவனை உங்களுக்குத் தெரியாவிட்டாலும்.”
    reason: lexical_alternative
  - marker: c
    text: அல்லது, “அதை அவனிடம் மீட்டளிக்க வேண்டும்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אָחִיךָ
  choice: உங்கள் சகோதரன்
  rationale: எபிரெய மூலத்தின் உறவுமுறைச் சொல்லை நேரடியாகத் தக்கவைக்கிறது. உபாகமச் சட்டச் சூழலில் இது உடன்படிக்கைச் சமூகத்தைச் சேர்ந்த சக இஸ்ரவேலரையும் பரந்த பொருளில் குறிக்கலாம்.
- source_word: קָרוֹב אֵלֶיךָ
  choice: உங்களுக்கு அருகில்
  rationale: உடல்சார்ந்த அல்லது வாழ்விட அண்மையை இயல்பான நவீன தமிழில் தெரிவிக்கிறது; மூலத்தின் பொருளை தேவையின்றி குறுக்கவில்லை.
- source_word: וְלֹא יְדַעְתּוֹ
  choice: அவனை உங்களுக்குத் தெரியாமலும்
  rationale: ஆண்பால் ஒருமை பின்னொட்டு ‘சகோதரன்’ என்பதையே சுட்டுவதால் மூல இலக்கணம் தக்கவைக்கப்படுகிறது. சூழலில் அதன் பொருள் உரிமையாளர் யார் என்று தெரியாதிருப்பதாகும்.
- source_word: וַאֲסַפְתּוֹ אֶל תּוֹךְ בֵּיתֶךָ
  choice: அதை உங்கள் வீட்டுக்குள் கொண்டுவந்து
  rationale: தொலைந்த விலங்கு அல்லது பொருளைத் தன் பாதுகாப்புக்குள் எடுத்துக்கொள்வதையும் வீட்டுக்குள் கொண்டுவருவதையும் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וְהָיָה עִמְּךָ
  choice: உங்களிடம் வைத்திருக்க வேண்டும்
  rationale: சொல்லுக்குச் சொல் ‘உங்களுடன் இருக்க வேண்டும்’ என்பதைக் காட்டிலும், உரிமையாளர் வரும் வரை பாதுகாப்பில் வைத்திருக்கும் நீடித்த நிலையைச் சட்டச் சூழலில் தெளிவாகக் காட்டுகிறது.
- source_word: עַד דְּרֹשׁ אָחִיךָ אֹתוֹ
  choice: உங்கள் சகோதரன் அதைத் தேடி வரும்வரை
  rationale: דרש என்பதிலுள்ள தேடுதல் அல்லது உரிமை கோரி விசாரித்தல் என்ற பொருளைச் சூழலுக்கு ஏற்ற இயல்பான தமிழில் தருகிறது.
- source_word: וַהֲשֵׁבֹתוֹ לוֹ
  choice: அதை அவனுக்குத் திருப்பிக் கொடுக்க வேண்டும்
  rationale: שוב என்பதன் ஹிஃபில் வடிவம் இங்கு பொருளை அதன் உரிமையாளரிடம் மீண்டும் சேர்ப்பதைக் குறிக்கிறது; ‘திருப்பிக் கொடுக்க’ என்பது தெளிவான, இயல்பான சட்டநடைத் தமிழ்.
