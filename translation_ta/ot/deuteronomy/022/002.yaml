translation_notes:
  register: நவீன தரமான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான சட்டநடை பயன்படுத்தப்பட்டுள்ளது. மரியாதைப் பன்மையான ‘உங்கள்/உங்களுக்கு’ தொடர்ச்சியாக வைக்கப்பட்டுள்ளது. மூலத்தின் ஆண்பால் உறவுமுறைச் சொல் ‘சகோதரன்’ எனத் தக்கவைக்கப்பட்டு, அதன் சமூகப் பரப்பு அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது.
