  source_fidelity: 'கருத்து சரியான திசையில் உள்ளது: שַׁעַטְנֵז என்பதைக் கம்பளி/மயிர் மற்றும் பிஷ்தீம் ஆகியவற்றின் கலப்பாகக் காட்டுகிறது. ஆனால் ‘நார்ப்பட்டு’ என்பது நவீனத் தமிழில் நிலையானதும் தெளிவானதுமான ‘linen’ குறியீடாக இல்லை; மேலும் ‘நெய்த’ என்பது எபிரெய உரையில் வெளிப்படையாகச் சொல்லப்படாத செய்முறை விவரத்தைச் சேர்க்கிறது.'
  naturalness: ‘கம்பளி நூலும் சணல் நூலும் கலந்த துணி’ என்பது நவீன நிலையான தமிழில் தெளிவாகவும் இயல்பாகவும் உள்ளது. ‘அணியக்கூடாது’ சட்டத் தடைக்கு ஏற்றது.
  terminology: צֶמֶר-க்கு ‘கம்பளி நூல்’ பொருத்தமானது. פִשְׁתִּים என்பது ஆடைச் சூழலில் flax/linen-ஐச் சுட்டுகிறது; ‘சணல் நூல்’ மூலப் பொருளையும் கலப்புப் பொருளின் தன்மையையும் தெளிவாகக் காக்கிறது. அரிய שַׁעַטְנֵז சொல்லை அடிக்குறிப்பில் ஒலிபெயர்ப்புடன் விளக்குவது ஏற்றது.
