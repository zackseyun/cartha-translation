  yaml_path: translation/ot/deuteronomy/022/011.yaml
  text: You shall not wear cloth made of wool and linen together[a].
translation:
  language: ta
  text: கம்பளி நூலும் சணல் நூலும் கலந்த துணியை அணியக்கூடாது.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரெய மூலத்தில்: “ஷாஅட்நேஸ்—கம்பளி நூலும் சணல் நூலும் ஒன்றாக.” அரிதாக வரும் “ஷாஅட்நேஸ்” என்ற சொல், இந்த இரண்டின் கலவையால் ஆன துணியைக் குறிக்கிறது.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא תִלְבַּשׁ
  choice: அணியக் கூடாது
  rationale: சட்ட மொழியில் வரும் இரண்டாம் நபர் ஆண்பால் ஒருமை வினை வடிவத்துடன் கூடிய மறுப்பை, நவீனத் தமிழில் இயல்பான பொதுத் தடையாக வெளிப்படுத்துகிறது.
- source_word: שַׁעַטְנֵז
  choice: ஒன்றாகக் கலந்து நெய்த துணி
  rationale: அரிதான எபிரெயச் சொல், தொடர்ந்து வரும் ‘கம்பளி நூலும் நார்ப்பட்டையும் ஒன்றாக’ என்ற விளக்கத்தால் குறிப்பிட்ட கலப்புத் துணியைக் குறிக்கிறது; ஒலிபெயர்ப்பைவிட பொருளை உரைப்பது வாசகருக்குத் தெளிவு.
- source_word: צֶמֶר
  choice: கம்பளி நூல்
  rationale: ஆடை மற்றும் நெசவுச் சூழலில் இது விலங்கின் உரோமத்திலிருந்து பெறப்படும் wool நூலைக் குறிக்கிறது; ‘கம்பளி’ மட்டும் தயாரித்த துணி அல்லது போர்வை எனப் புரியக்கூடும் என்பதால் ‘நூல்’ சேர்க்கப்பட்டது.
- source_word: וּפִשְׁתִּים
  choice: நார்ப்பட்டு
  rationale: פִשְׁתִּים என்பது சணல் செடியையோ அதிலிருந்து செய்யப்பட்ட linen துணியையோ குறிக்கலாம்; ஆடைச் சூழலில் நவீனத் தமிழில் linen-ஐக் குறிக்கும் ‘நார்ப்பட்டு’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: יַחְדָּו
  choice: ஒன்றாகக் கலந்து
  rationale: இரு பொருட்களும் ஒரே துணியில் இணைக்கப்படுவதைத் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
