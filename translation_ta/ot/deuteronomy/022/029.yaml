base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/029.yaml
  text: Then the man who lay with her shall give fifty shekels of silver to the young woman's father[a], and she shall become his wife because he has violated her[b]. He may not send her away all his days.
translation:
  language: ta
  text: அவளோடு உடலுறவு கொண்ட அந்த ஆண், அந்த இளம்பெண்ணின் தந்தைக்கு ஐம்பது சேக்கல் வெள்ளியைக் கொடுக்க வேண்டும். அவன் அவள்மீது பாலியல் அத்துமீறல் செய்ததால்[a], அவள் அவனுக்கு மனைவியாக வேண்டும். அவன் வாழ்நாளெல்லாம் அவளை அனுப்பிவிடக் கூடாது[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரேயச் சொல்லை இன்னும் நேரடியாக, ‘அவளைத் தாழ்த்தினான்’ அல்லது ‘இழிவுபடுத்தினான்’ என்றும் மொழிபெயர்க்கலாம். இச்சூழலில் அது பாலியல் மீறலைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: ‘அனுப்பிவிடுதல்’ என்பது இங்கு மனைவியை நிராகரிப்பதையோ மணவிலக்கு செய்வதையோ குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַן
  choice: கொடுக்க வேண்டும்
  rationale: சட்ட விதியின் தொடர்ச்சியையும் கட்டாயத் தன்மையையும் இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: הָאִישׁ הַשֹּׁכֵב עִמָּהּ
  choice: அவளோடு படுத்த அந்த ஆண்
  rationale: பாலுறவைக் குறிக்கும் எபிரேயச் சொல்லாட்சியை அடக்கமான, ஆனால் தெளிவான மொழியில் நெருக்கமாகப் பிரதிபலிக்கிறது.
- source_word: לַאֲבִי הַנַּעֲרָ
  choice: அந்த இளம்பெண்ணின் தந்தைக்கு
  rationale: נַעֲרָה என்பது திருமண வயதிலுள்ள இளம்பெண்ணைக் குறிக்கக்கூடும்; ‘இளம்பெண்’ என்பது வயதையும் நிலைமையையும் மிகைப்படுத்தாமல் தெரிவிக்கிறது.
- source_word: חֲמִשִּׁים כָּסֶף
  choice: ஐம்பது சேக்கல் வெள்ளி
  rationale: எபிரேயத்தில் சொல்லுக்கு சொல் ‘ஐம்பது வெள்ளி’ என்றிருந்தாலும், இச்சட்டப் பொருளாதாரச் சூழலில் எடையலகான சேக்கல் மறைமுகமாகக் குறிக்கப்படுகிறது.
- source_word: וְלוֹ תִהְיֶה לְאִשָּׁה
  choice: அவள் அவனுக்கு மனைவியாக வேண்டும்
  rationale: இதன் விளைவாக ஏற்பட வேண்டிய திருமண உறவையும் சட்டக் கட்டாயத்தையும் தெரிவிக்கிறது; உடைமைப் பொருளைத் தேவையின்றி புகுத்தவில்லை.
- source_word: תַּחַת אֲשֶׁר
  choice: செய்ததால்
  rationale: தீர்ப்பிற்கான காரணத்தை அறிமுகப்படுத்தும் எபிரேயச் சட்டச் சூத்திரத்தை இயல்பான காரணத் தொடராக வழங்குகிறது.
- source_word: עִנָּהּ
  choice: அவள்மீது பாலியல் அத்துமீறல் செய்ததால்
  rationale: பாலியல் சூழலில் அவளைத் தாழ்த்தி மீறிய கடுமையான செயலைத் தெளிவாகத் தெரிவிக்கிறது; அதே நேரத்தில் இவ்வினைச்சொல் தனியாகக் கூறாத வன்முறையின் குறிப்பிட்ட விதத்தைச் சேர்க்கவில்லை.
- source_word: לֹא יוּכַל שַׁלְּחָהּ
  choice: அவளை விலக்கிவிடக் கூடாது
  rationale: சொல்லுக்கு நெருக்கமான ‘அனுப்பிவிடுதல்’ என்ற படிமத்தையும் திருமணச் சூழலில் மனைவியை நிராகரித்தல் அல்லது மணவிலக்கு செய்தல் என்ற பொருளையும் இணைத்து வழங்குகிறது.
- source_word: כָּל יָמָיו
  choice: அவன் வாழ்நாளெல்லாம்
  rationale: ‘அவனுடைய எல்லா நாட்களும்’ என்ற எபிரேய மரபுத்தொடரின் வாழ்நாள் முழுவதுமான கால அளவை இயல்பான தமிழில் தெரிவிக்கிறது.
theological_decisions:
- issue: ענה என்ற பாலியல் மீறலைக் குறிக்கும் சொல்லை அதன் தீவிரத்தைக் குறைக்காமலும், உடனடி சொல்லாட்சிக்கு அப்பாற்பட்டு மிகத் துல்லியப்படுத்தாமலும் மொழிபெயர்த்தல்
  choice: அவள்மீது பாலியல் அத்துமீறல் செய்ததால்
  alternative: அவளைத் தாழ்த்தியதால் / அவளைச் சீரழித்ததால் / அவளைப் பாலியல் வல்லுறவுக்கு உட்படுத்தியதால்
  rationale: இச்சொல் பாலியல் சூழலில் அவளுக்கு இழைக்கப்பட்ட இழிவையும் மீறலையும் குறிக்கிறது. ‘பாலியல் அத்துமீறல்’ அதன் கடுமையைத் தெளிவாக்குகிறது; ஆனால் இவ்வசனத்தின் வினைச்சொல் மட்டும் வெளிப்படையாகக் கூறாத வற்புறுத்தலின் துல்லிய வடிவத்தைத் தீர்மானித்து விடவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், சட்டநடைக்கு ஏற்ற கண்ணியமான மற்றும் பொதுவாசகர்களுக்குப் புரியக்கூடிய சொற்கள் பயன்படுத்தப்பட்டுள்ளன. பாலியல் செயல் குறித்து அடக்கமான தெளிவு பேணப்பட்டுள்ளது; மூலத்தில் உள்ள lexical ambiguity அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
