  verdict: revise
  source_fidelity: Draft correctly identifies the prohibition, ox/bovine animal, donkey, and their joint use in plowing. However, “பூட்டி” specifically adds the action of yoking/harnessing, which is not stated by the Hebrew; יַחְדָּו says “together.”
  naturalness: “மாட்டையும் கழுதையையும் சேர்த்து உழாதே” is natural, concise modern Tamil for this agricultural prohibition. It retains the direct prohibitive register.
  terminology: “மாடு” is an appropriate general modern Tamil rendering of שׁוֹר in this context, and “கழுதை” accurately renders חֲמוֹר. The direct imperative “உழாதே” suitably conveys the legal prohibition.
  issues:
  - severity: medium
    issue: “ஒன்றாகப் பூட்டி” introduces yoking/harnessing.
    rationale: The Hebrew text prohibits plowing with the ox and donkey together but does not explicitly name the act of yoking them. The added specification is plausible contextually but narrows the wording beyond the source.
