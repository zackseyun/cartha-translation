  text: לֹֽא תַחֲרֹ֥שׁ בְּ/שׁוֹר וּ/בַ/חֲמֹ֖ר יַחְדָּֽו־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/010.yaml
  text: You shall not plow with an ox and a donkey together[a].
translation:
  language: ta
  text: மாட்டையும் கழுதையையும் சேர்த்து உழாதே.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மாட்டையும் கழுதையையும் ஒன்றாக உழாதே.”
    reason: יַחְדָּו என்பதற்கு “சேர்த்து” என்பதற்குப் பதிலாக “ஒன்றாக” என்ற நேரடியான சொல்லாட்சி மாற்றை வழங்குகிறது.
lexical_decisions:
- source_word: לֹא תַחֲרֹשׁ
  choice: உழாதே
  rationale: எதிர்மறைச் சொல்லுடன் வந்த Qal imperfect 2ms, சட்டச் சூழலில் நேரடியான தடையைத் தெரிவிக்கிறது. நவீன தமிழில் ‘உழாதே’ இயல்பாகவும் தெளிவாகவும் அந்த வலிமையைத் தருகிறது.
- source_word: בְּשׁוֹר
  choice: மாட்டை
  rationale: שׁוֹר என்பது உழவுக்குப் பயன்படும் மாட்டினத்தைக் குறிக்கும் பொதுச்சொல். தமிழில் பாலினத்தைத் தேவையின்றிக் குறிப்பாக்காமல் ‘மாடு’ என்பது இயல்பான தேர்வு.
- source_word: וּבַחֲמֹר
  choice: கழுதையையும்
  rationale: חֲמוֹר என்பதற்கான தெளிவான, வழக்கிலுள்ள நவீனத் தமிழ் சொல் ‘கழுதை’.
- source_word: יַחְדָּו
  choice: ஒன்றாகப் பூட்டி
  rationale: יַחְדָּו என்பது இரண்டு விலங்குகளும் சேர்ந்து உழுவதைக் குறிக்கிறது. உழவுச் சூழலில் ‘ஒன்றாகப் பூட்டி’ என்பது அவை ஒரே அணியாக இணைக்கப்படுவதை இயல்பாக வெளிப்படுத்துகிறது; ‘உழ’ என்ற வினையுடன் சேர்ந்து மூலத்தின் கருத்தைத் தெளிவாக்குகிறது.
theological_decisions:
- issue: உடன்படிக்கைச் சட்டத்தில் தடையின் வலிமை
  choice: ‘உழாதே’ என்ற நேரடியான சட்டத் தடையாக மொழிபெயர்த்தல்
  alternative: ‘உழக்கூடாது’ என்று விதிமுறை வடிவில் மொழிபெயர்த்தல்
  rationale: எபிரெய எதிர்மறை imperfect இங்கு நேரடியான தடையாகச் செயல்படுகிறது. ‘உழாதே’ நவீனத் தமிழில் நேர்முகக் கட்டளையின் வலிமையைத் தக்கவைக்கிறது; வசனத்தில் தனிப்பட்ட சமயக் கோட்பாட்டைத் தீர்மானிக்க வேண்டிய சிக்கல் இல்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் நேரடியான சட்டக் கட்டளை நடை பயன்படுத்தப்பட்டுள்ளது. ‘ஒன்றாகப் பூட்டி’ என்பது உழவுச் சூழலை இயல்பாகத் தெளிவாக்குகிறது; அடிக்குறிப்பு மேலும் சொல்லுக்குச் சொல் நெருக்கமான மாற்றைத் தருகிறது.
