  edition: WLC
  text: כִּ֤י יִהְיֶה֙ נער בְתוּלָ֔ה מְאֹרָשָׂ֖ה לְ/אִ֑ישׁ וּ/מְצָאָ֥/הּ אִ֛ישׁ בָּ/עִ֖יר וְ/שָׁכַ֥ב עִמָּֽ/הּ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/023.yaml
  text: If there is a young woman[a], a virgin, pledged to a man, and another man finds her in the city and lies with her,
translation:
  language: ta
  text: ஒருவனுக்கு மணம் நிச்சயிக்கப்பட்ட கன்னியான இளம்பெண் இருந்தால்[a], வேறொருவன் அவளை நகரத்தில் கண்டு, அவளுடன் உடலுறவு கொண்டால்,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘ஒருவனுக்கு நிச்சயிக்கப்பட்ட.’ எபிரெயச் சொல் சாதாரண நவீன திருமண நிச்சயத்தை அல்ல, சட்டரீதியாகக் கட்டுப்படுத்தும் முறையான மணஒப்பந்தத்தைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי יִהְיֶה
  choice: …இருக்கும்போது
  rationale: இது ஒரு சட்ட வழக்குக்கான நிபந்தனைச் சூழலை அறிமுகப்படுத்துகிறது. தமிழில் ‘…இருக்கும்போது’ இயல்பாகவும் நிபந்தனைத் தன்மையுடனும் அமைகிறது.
- source_word: נַעֲרָ
  choice: இளம்பெண்
  rationale: திருமண வயதுடைய இளம் பெண்ணைக் குறிக்கிறது; நவீனத் தமிழில் இயல்பாகவும் வயதைத் தேவையின்றி மிகக் குறைவாகக் காட்டாமலும் உள்ளது.
- source_word: בְתוּלָה
  choice: கன்னியான
  rationale: மூலச்சொல் கன்னித்தன்மையை வெளிப்படையாகக் குறிக்கிறது; சட்ட மற்றும் சமூகப் பொருத்தத்தைப் பாதுகாக்க இது நேரடியாக மொழிபெயர்க்கப்படுகிறது.
- source_word: מְאֹרָשָׂה לְאִישׁ
  choice: ஒருவனுக்கு திருமணம் நிச்சயிக்கப்பட்டிருக்கும்போது
  rationale: நவீனத் திருமண நிச்சயத்தைவிடச் சட்டரீதியாகக் கட்டுப்படுத்தும் முறையான மணஒப்பந்த நிலையைக் குறிக்கிறது; முதன்மை உரை வாசிக்க எளிதாக இருக்க, அதன் வலிமை அடிக்குறிப்பில் விளக்கப்படுகிறது.
- source_word: וּמְצָאָהּ אִישׁ
  choice: வேறொருவன் அவளைக் கண்டு
  rationale: எபிரெயத்தில் ‘ஒருவன்’ என்றே இருந்தாலும், முன்பு கூறப்பட்ட மணமகனிடமிருந்து இவனைத் தெளிவாக வேறுபடுத்த ‘வேறொருவன்’ எனச் சூழலுக்கேற்றவாறு தரப்படுகிறது.
- source_word: בָּעִיר
  choice: நகரத்தில்
  rationale: இடத்தை நேரடியாகக் குறிக்கிறது; அடுத்த வசனத்தின் சட்ட விவாதத்திற்கும் இந்தச் சூழல் முக்கியமானது.
- source_word: וְשָׁכַב עִמָּהּ
  choice: அவளுடன் உடலுறவுகொண்டால்
  rationale: பாலுறவைக் குறிக்கும் எபிரெய மறைமுகச் சொல்லாட்சியின் பொருளை நவீனத் தமிழில் தெளிவாகவும் கண்ணியமாகவும் தெரிவிக்கிறது; வற்புறுத்தலைச் சேர்க்கவில்லை.
theological_decisions:
- issue: இந்த வசனத்திலேயே பாலுறவு வற்புறுத்தலானது என்று வெளிப்படையாகக் கூறுவதா
  choice: வற்புறுத்தல் அல்லது பாலியல் வன்கொடுமை என்று சேர்க்காமல், ‘அவளுடன் உடலுறவுகொண்டால்’ என்று நடுநிலையாக மொழிபெயர்த்தல்
  alternative: ‘அவளைப் பாலியல் வன்கொடுமை செய்தால்’ அல்லது ‘அவளை வற்புறுத்தி உடலுறவுகொண்டால்’
  rationale: இந்த வசனத்தின் சொற்களே வற்புறுத்தலை வெளிப்படையாகக் குறிப்பிடவில்லை. சுற்றியுள்ள சட்டப் பகுதியிலிருந்து ஒரு முடிவை முன்கூட்டியே இங்கே புகுத்தாமல், மூலத்தின் தெளிவின்மையையும் பதற்றத்தையும் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; சட்டப் பாங்கைத் தக்கவைத்தபடியே சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடை. வசனம் அடுத்த வசனத்தில் தொடர்வதால் இறுதியில் காற்புள்ளி வைக்கப்பட்டுள்ளது.
