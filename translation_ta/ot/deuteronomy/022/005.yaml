base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/005.yaml
  text: A woman shall not wear a man's article[a], and a man shall not put on a woman's garment, for everyone who does these things is an abomination to Yahweh your God.
translation:
  language: ta
  text: ஒரு பெண்ணின்மேல் ஆணுக்குரிய பொருள் இருக்கக்கூடாது; ஓர் ஆண் பெண்ணின் உடையை அணியக்கூடாது. ஏனெனில், இவற்றைச் செய்கிற அனைவரும் உன் கடவுளாகிய யாவேக்கு அருவருப்பானவர்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כְלִי גֶבֶר
  choice: ஆணுக்குரிய பொருள்
  rationale: כְּלִי என்பது உடையை மட்டும் குறிக்காமல் பொருள், கருவி, உபகரணம் போன்ற விரிவான பொருளைக் கொண்டது. அடுத்த உட்பிரிவில் உடைக்கான குறிப்பான שִׂמְלָה வருவதால், அந்த வேறுபாட்டைத் தமிழிலும் காக்க இந்த விரிவான சொற்றொடர் தேர்ந்தெடுக்கப்பட்டது.
- source_word: עַל אִשָּׁה
  choice: ஒரு பெண்ணிடம் ... இருக்கக்கூடாது
  rationale: எபிரெயச் சொற்றொடரின் நேரடியான பொருள் ‘ஒரு பெண்ணின்மேல் இருக்கக்கூடாது’ என்பதாகும். அணிந்திருத்தல் அல்லது தன் உடலில் வைத்திருத்தல் என்ற இரு சாத்தியங்களையும் தேவையின்றி குறுக்காமல் இயல்பான தமிழில் ‘பெண்ணிடம் ... இருக்கக்கூடாது’ என்று மொழிபெயர்க்கப்பட்டது.
- source_word: יִלְבַּשׁ
  choice: அணியக்கூடாது
  rationale: இந்த வினை ஆடையை உடுத்துதல் அல்லது அணிதலைத் தெளிவாகக் குறிக்கிறது; நவீன தமிழில் ‘அணி’ இயல்பானது.
- source_word: שִׂמְלַת אִשָּׁה
  choice: பெண்ணின் உடை
  rationale: שִׂמְלָה என்பது உடை அல்லது மேலாடையைக் குறிக்கும். ஒரு குறிப்பிட்ட ஆடை வகையாகக் குறுக்காமல் ‘உடை’ என்று வழங்கப்பட்டது.
- source_word: גֶּבֶר / אִשָּׁה
  choice: ஆண் / பெண்
  rationale: மூலத்தில் வெளிப்படையாக உள்ள ஆண்–பெண் வேறுபாட்டைத் துல்லியமாகக் காக்கிறது.
- source_word: תוֹעֲבַת יְהוָה
  choice: யெகோவாவுக்கு அருவருப்பானவர்
  rationale: תוֹעֵבָה கடவுளின் பார்வையில் மிகவும் வெறுக்கத்தக்க அல்லது அருவருப்பான ஒன்றைக் குறிக்கும் வலுவான சொல். உடன்படிக்கைச் சூழலின் தீவிரத்தை ‘அருவருப்பானவர்’ காக்கிறது; יהוה தனிப்பெயர் ‘யெகோவா’ என வழங்கப்படுகிறது.
- source_word: כָּל עֹשֵׂה אֵלֶּה
  choice: இவற்றைச் செய்கிற ஒவ்வொருவரும்
  rationale: כָּל என்பதன் அனைவர் சார்ந்த வலிமையையும், பங்கேற்புவினையின் பொதுவான செய்பவர் பொருளையும் இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: முதல் தடையின் வரம்பு (כְלִי גֶבֶר)
  choice: ‘ஆணுக்குரிய பொருள்’ என்று விரிவாக மொழிபெயர்த்தல்
  alternative: ‘ஆணின் உடை’ அல்லது ‘ஆணின் ஆயுதம்/உபகரணம்’
  rationale: முதல் உட்பிரிவில் விரிவான כְּלִי என்பதும், இரண்டாவது உட்பிரிவில் உடைக்கான குறிப்பான שִׂמְלָה என்பதும் பயன்படுத்தப்படுகின்றன. ஆகவே முதல் தடையை உடைக்கு மட்டும் அல்லது ஆயுதத்துக்கு மட்டும் குறுக்காமல் மூலத்தின் தெளிவின்மையும் சொல் வேறுபாடும் பாதுகாக்கப்படுகின்றன.
- issue: תוֹעֲבַת יְהוָה என்ற தொடரின் இலக்கணப் பயன்பாடு
  choice: செய்பவர்களை ‘யெகோவாவுக்கு அருவருப்பானவர்’ என்று கூறுதல்
  alternative: அவர்களின் செயல் ‘யெகோவாவுக்கு அருவருப்பானது’ என்று கூறுதல்
  rationale: எபிரெயம் ‘இவற்றைச் செய்கிற ஒவ்வொருவரும்’ என்பவரையே תוֹעֲבָה என இலக்கணரீதியாக அடையாளப்படுத்துகிறது; செயலை மட்டும் மாற்றுப் பொருளாக ஆக்காமல் அந்தத் தீவிரமான வடிவம் காக்கப்பட்டது.
- issue: பாலினச் சொற்கள்
  choice: ‘ஆண்’ மற்றும் ‘பெண்’ என்ற வெளிப்படையான சொற்கள்
  alternative: பாலினப் பொதுமைப்படுத்தப்பட்ட சொற்கள்
  rationale: மூலவசனம் ஆண்–பெண் வேறுபாட்டை நேரடியாக அமைப்பதால் அதனை மொழிபெயர்ப்பிலும் காக்க வேண்டும்.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டது. ‘பொருள்’ என்ற பொதுச்சொல் சற்றே விரிவானதாக இருந்தாலும், மூலத்தின் כְּלִי மற்றும் שִׂמְלָה ஆகியவற்றுக்கிடையிலான வேறுபாட்டைத் தக்கவைக்கிறது. கடவுளின் உடன்படிக்கைப் பெயர் ‘யெகோவா’ என ஒலிபெயர்க்கப்பட்டது.
