reference: Deuteronomy 22:27
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: כִּ֥י בַ/שָּׂדֶ֖ה מְצָאָ֑/הּ צָעֲקָ֗ה ה/נער הַ/מְאֹ֣רָשָׂ֔ה וְ/אֵ֥ין מוֹשִׁ֖יעַ לָֽ/הּ׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/027.yaml
  text: For he found her in the field[a]; the betrothed young woman cried out[b], but there was no one to rescue her.
translation:
  language: ta
  text: ஏனெனில், அவன் அவளை வயல்வெளியில்[a] கண்டான்; திருமணத்திற்கு நிச்சயிக்கப்பட்டிருந்த அந்த இளம்பெண் கூக்குரலிட்டாள், ஆனால் அவளைக் காப்பாற்ற யாரும் இருக்கவில்லை.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “திறந்த நாட்டுப்புறத்தில்.” எபிரெயச் சொற்றொடர் தனிமையான கிராமப்புற இடத்தைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அவளை விடுவிக்க யாரும் இருக்கவில்லை.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய சட்டத் தீர்ப்புக்கான காரணத்தை அறிமுகப்படுத்துகிறது; தமிழில் விளக்கக் காரணத்தை இயல்பாகக் காட்டுகிறது.
- source_word: בַשָּׂדֶה
  choice: வயல்வெளியில்
  rationale: உதவி உடனடியாகக் கிடைக்காத திறந்த கிராமப்புறச் சூழலைக் குறிக்கிறது; எபிரெயச் சொல்லுக்கு நேரடியும் இயல்புமான தமிழ் இணை.
- source_word: מְצָאָהּ
  choice: அவன் அவளை ... கண்டான்
  rationale: מצא என்பதன் அடிப்படைப் பொருளான ‘காணுதல்/கண்டடைதல்’ என்பதைக் காக்கிறது; சூழலில் அவன் அவளை அங்கே சந்தித்ததைக் குறிக்கிறது.
- source_word: צָעֲקָה
  choice: கூக்குரலிட்டாள்
  rationale: துன்பத்தில் உதவிக்காக உரத்துக் குரலிடும் பொருளை, ‘உதவி கேட்டாள்’ என்று விளக்கமாக விரிவுபடுத்தாமல் வெளிப்படுத்துகிறது.
- source_word: הנער
  choice: இளம்பெண்
  rationale: எழுத்துருவில் காணப்படும் சாத்தியமான வடிவக் குழப்பத்தை விட, சூழலும் இலக்கண ஒத்திசைவும் பெண் நபரையே தெளிவாகச் சுட்டுகின்றன.
- source_word: הַמְאֹרָשָׂה
  choice: திருமணத்திற்கு நிச்சயிக்கப்பட்டிருந்த
  rationale: நவீன ‘நிச்சயதார்த்தம்’ என்பதைக் காட்டிலும் வலுவான பண்டைய சட்டபூர்வ திருமண ஒப்பந்த நிலையை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: וְאֵין מוֹשִׁיעַ לָהּ
  choice: ஆனால் அவளைக் காப்பாற்ற யாரும் இருக்கவில்லை
  rationale: இங்கு וְ எதிர்மறைத் திருப்பத்தைச் சுட்டுவதால் ‘ஆனால்’ இயல்பானது; מושיע என்பதன் சூழல்சார் பொருளை ‘காப்பாற்ற’ தெளிவாக வழங்குகிறது.
theological_decisions:
- issue: הַמְאֹרָשָׂה குறிக்கும் சட்ட-சமூக நிலை
  choice: திருமணத்திற்கு நிச்சயிக்கப்பட்டிருந்த
  alternative: நிச்சயதார்த்தம் செய்யப்பட்டிருந்த / மண ஒப்பந்தம் செய்யப்பட்டிருந்த
  rationale: பெண்ணின் பண்டைய இஸ்ரவேலிய சட்டநிலையின் தீவிரத்தைப் பாதுகாக்கிறது; அதேவேளையில் பின்னைய சமயக் கோட்பாடுகளைப் புகுத்தவில்லை.
- issue: הנער என்பதன் பாலின வெளிப்பாடு
  choice: இளம்பெண்
  alternative: பெண் / கன்னிப்பெண்
  rationale: சூழலும் தொடர்புடைய பெண்பால் வடிவங்களும் பெண் நபரைச் சுட்டுகின்றன. ‘கன்னிப்பெண்’ என்பது மூலச்சொல் இங்கு வெளிப்படையாகக் கூறாத கூடுதல் கருத்தைச் சேர்க்கக்கூடும்.
- issue: மீட்பவர் இல்லாத நிலையைச் சொல்லுதல்
  choice: காப்பாற்ற யாரும் இருக்கவில்லை
  alternative: விடுவிக்க யாரும் இருக்கவில்லை
  rationale: உடனடியான வன்முறைச் சூழலில் மனித உதவி கிடைக்காததையே உரை கூறுகிறது; தனிப்பட்ட இரட்சிப்பியல் பொருளைத் தேவையின்றி உருவாக்காமல் இருக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சட்ட உரைக்கு ஏற்ற கண்ணியமானவும் தெளிவானவும் உள்ள நடை. ‘வயல்வெளி,’ ‘இளம்பெண்,’ ‘திருமணத்திற்கு நிச்சயிக்கப்பட்டிருந்த’ ஆகிய சொற்கள் சாதாரண வாசகர்களுக்குப் புரியும் வகையில் தேர்ந்தெடுக்கப்பட்டன. எல்லா அடிக்குறிப்பு குறியீடுகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
