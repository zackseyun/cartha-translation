  source_fidelity: 'The translation accurately represents the Hebrew explanatory clause: the man found her in a field, the betrothed young woman cried out, and no rescuer was present. ‘ஏனெனில்’ appropriately conveys כִּי in its explanatory function. ‘வயல்வெளியில்,’ ‘கூக்குரலிட்டாள்,’ and ‘அவளைக் காப்பாற்ற யாரும் இருக்கவில்லை’ preserve the immediate legal and situational sense without adding interpretation.'
