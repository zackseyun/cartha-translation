base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/003.yaml
  text: And so you shall do with his donkey[a], and so you shall do with his cloak, and so you shall do with any lost thing of your brother that is lost from him and you find it; you may not ignore it.
translation:
  language: ta
  text: அவனுடைய கழுதைக்கும் அப்படியே செய்ய வேண்டும்; அவனுடைய மேலாடைக்கும் அப்படியே செய்ய வேண்டும்; உன் சகோதரனிடமிருந்து தொலைந்துபோன எந்தப் பொருளை நீ கண்டாலும், அதற்கும் அப்படியே செய்ய வேண்டும். அதை நீ புறக்கணிக்கக் கூடாது.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இன்னும் சொல்லுக்குச் சொல்லாக, “நீ உன்னை மறைத்துக்கொள்ளக் கூடாது”; அதாவது, அதைக் கவனிக்காததுபோல் நடிக்கக் கூடாது.
    reason: לְהִתְעַלֵּם என்பதிலுள்ள தன்னை மறைத்துக்கொள்ளும் உருவகத்தையும் அதன் சூழ்நிலைப் பொருளையும் காக்கும் சொற்பொருள் மாற்று.
lexical_decisions:
- source_word: וְכֵן
  choice: அப்படியே
  rationale: முந்தைய வசனத்தில் கூறப்பட்ட செயலைத் தொடர்ந்து, அதே விதியை ஒவ்வொரு பொருளுக்கும் பயன்படுத்துவதை இயல்பான தமிழில் உணர்த்துகிறது; எபிரெய மூலத்தின் திரும்பத் திரும்ப வரும் சட்டநடையும் காக்கப்படுகிறது.
- source_word: תַּעֲשֶׂה
  choice: செய்ய வேண்டும்
  rationale: சட்டச் சூழலில் இவ்வினை வடிவம் கட்டளையின் வலிமையைக் கொண்டது. நவீனத் தமிழில் தெளிவான, கண்ணியமான கடமை மொழியாக இது அமைகிறது.
- source_word: לַחֲמֹרוֹ
  choice: அவனுடைய கழுதைக்கும்
  rationale: முந்தைய வசனத்திலுள்ள சகோதரனின் தொலைந்த விலங்கைக் குறிக்கிறது. -க்கும் என்ற வேற்றுமை உருபு, அதற்கும் இதே நடவடிக்கை பொருந்தும் என்பதைத் தமிழில் இயல்பாகத் தெரிவிக்கிறது.
- source_word: לְשִׂמְלָתוֹ
  choice: அவனுடைய மேலாடைக்கும்
  rationale: שִׂמְלָה பொதுவாக உடலின் மேல் அணியும் வெளிப்புற ஆடையைக் குறிக்கலாம். ‘மேலாடை’ என்பது ‘ஆடை’ என்பதைவிடச் சற்றுத் துல்லியமானதும் இன்றைய வாசகருக்குப் புரியக்கூடியதுமாகும்.
- source_word: לְכָל אֲבֵדַת
  choice: தொலைந்துபோன எந்தப் பொருளை
  rationale: பெயரிட்டு கூறப்பட்டவற்றிலிருந்து, தொலைந்த எந்த உடைமைக்கும் சட்டத்தை விரிவாக்குகிறது. ‘பொருள்’ என்பது ‘சொத்து’ என்ற சட்டரீதியான கூடுதல் விளக்கத்தைத் தவிர்த்து மூலத்துக்கு நெருக்கமாக உள்ளது.
- source_word: אָחִיךָ
  choice: உன் சகோதரன்
  rationale: மூலத்தில் உள்ள ஆண்பால் ஒருமை உறவுச்சொல்லை அப்படியே காக்கிறது. உடன்படிக்கைச் சமூகத்தை விரிவாகக் குறிக்கும் சாத்தியம் இருந்தாலும், முதன்மை உரையில் அதை விளக்கி விரிவுபடுத்தவில்லை.
- source_word: אֲשֶׁר תֹּאבַד מִמֶּנּוּ
  choice: உன் சகோதரனிடமிருந்து தொலைந்துபோன
  rationale: செய்பவரை நேரடியாகக் குறிப்பதில்லாத மூலத்தின் நுணுக்கத்தைக் காக்கிறது; ‘அவன் தொலைத்த’ என்று காரணச் செயலை வெளிப்படையாகச் சேர்ப்பதைத் தவிர்க்கிறது.
- source_word: וּמְצָאתָהּ
  choice: நீ கண்டாலும்
  rationale: தொலைந்த பொருளை முகவரியாளர் கண்டடையும் தொடர்ச்சியான நிகழ்வை நேரடியாகக் கூறுகிறது. தமிழில் நிபந்தனைத் தொடர்பை இயல்பாக்க ‘-ஆலும்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: לֹא תוּכַל
  choice: கூடாது
  rationale: இங்கு உடல் அல்லது திறன் சார்ந்த இயலாமையை அல்ல, சட்டத் தடையைச் சொல்கிறது. ‘கூடாது’ அந்தத் தடை வலிமையைத் தெளிவாக வழங்குகிறது.
- source_word: לְהִתְעַלֵּם
  choice: கண்டும் காணாததுபோல் இருக்க
  rationale: தன்னை மறைத்துக்கொள்ளுதல் அல்லது கவனிக்காதவனாக விலகுதல் என்ற hitpael வடிவத்தின் உருவகத்தையும், நடைமுறையில் பொறுப்பைத் தவிர்க்கும் பொருளையும் தமிழில் உயிரோட்டமாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: உடன்படிக்கைச் சட்டச் சூழலில் אָחִיךָ என்பதன் மொழிபெயர்ப்பு
  choice: உன் சகோதரன்
  alternative: உன் சக இஸ்ரவேலன் / உன் உறவினன்
  rationale: எபிரெய உரையின் ஆண்பால் ஒருமை உறவுமுறையையும் அதன் சமூக-இறையியல் வடிவத்தையும் முதன்மை உரையில் காக்கிறது; அதன் பொருளை அமைதியாகப் பொதுமைப்படுத்தவில்லை.
- issue: לֹא תוּכַל לְהִתְעַלֵּם என்பதன் சட்ட வலிமையும் உருவகமும்
  choice: நீ அதைக் கண்டும் காணாததுபோல் இருக்கக் கூடாது
  alternative: நீ உன்னை மறைத்துக்கொள்ள முடியாது / அதை அலட்சியப்படுத்தக் கூடாது
  rationale: சட்டத் தடையைத் தெளிவாகக் காட்டுவதோடு, பொறுப்பிலிருந்து தன்னை மறைத்துக்கொள்ளும் மூல உருவகத்தையும் ஓரளவு காக்கிறது. அடிப்படையான நேரடி உருவகம் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகருக்குப் புரியும் கண்ணியமான சட்டநடை பயன்படுத்தப்பட்டுள்ளது. וְכֵן תַּעֲשֶׂה என்ற மூன்று முறை மீளுரைத்தலை ‘அப்படியே செய்ய வேண்டும்’ என்று மூன்றுமுறை காத்து, எபிரெய உரையின் வலியுறுத்தலையும் அமைப்பையும் பாதுகாத்துள்ளது.
