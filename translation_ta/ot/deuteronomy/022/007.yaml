  text: שַׁלֵּ֤חַ תְּשַׁלַּח֙ אֶת הָ/אֵ֔ם וְ/אֶת הַ/בָּנִ֖ים תִּֽקַּֽח לָ֑/ךְ לְמַ֨עַן֙ יִ֣יטַב לָ֔/ךְ וְ/הַאֲרַכְתָּ֖ יָמִֽים־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/007.yaml
  text: You must surely let the mother go[a], but you may take the young for yourself[c][b], so that it may go well for you and you may prolong your days.
translation:
  language: ta
  text: தாய்ப்பறவையை நிச்சயமாகப் போகவிட வேண்டும்[a]; ஆனால் குஞ்சுகளையோ முட்டைகளையோ உனக்காக எடுத்துக்கொள்ளலாம்[b], உனக்கு நன்மை உண்டாகவும் நீ நீண்ட நாள் வாழவும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'இன்னும் சொல்லுக்கு நெருக்கமாக: “தாயை நிச்சயமாகப் போகவிட வேண்டும்.”'
    reason: lexical_alternative
  - marker: b
    text: எபிரேயத்தில் “பிள்ளைகள்”; முந்தைய வசனத்தில் கூறப்படும் பறவைக்கூட்டின் சூழலில் இது குஞ்சுகளையோ முட்டைகளையோ குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׁלֵּחַ תְּשַׁלַּח
  choice: நிச்சயமாகப் போகவிட வேண்டும்
  rationale: வினையெச்சப் பெயருடன் அதே வினை சேர்ந்து கட்டளையை வலியுறுத்துகிறது. தமிழில் இயல்பாகவும் தெளிவாகவும் அந்த வலியுறுத்தலை இது வெளிப்படுத்துகிறது.
- source_word: הָאֵם
  choice: தாய்ப்பறவையை
  rationale: எபிரேயத்தில் நேரடியாக ‘தாய்’ என்றாலும், முந்தைய வசனத்தின் பறவைக்கூடு சூழலைத் தமிழில் உடனடியாகத் தெளிவுபடுத்த ‘தாய்ப்பறவை’ என மொழிபெயர்க்கப்பட்டது.
- source_word: הַבָּנִים
  choice: குஞ்சுகளை
  rationale: சொல்லுக்கு நேர்ப்பொருள் ‘பிள்ளைகள்’; பறவைக்கூட்டின் சூழலில் இயல்பான தமிழ் சொல் ‘குஞ்சுகள்’. முந்தைய வசனத்தில் குஞ்சுகளோ முட்டைகளோ குறிப்பிடப்பட்டாலும், இவ்வசனத்தின் சொல்லை அதன் சாதாரண சூழற்பொருளின்படி மொழிபெயர்க்கிறது.
- source_word: תִּקַּח לָךְ
  choice: உனக்காக எடுத்துக்கொள்ளலாம்
  rationale: தாயை விடுவிக்க வேண்டும் என்ற கட்டளைக்குப் பின்வரும் இந்த வடிவம், குஞ்சுகளை எடுத்துக்கொள்ள அனுமதிப்பதாகச் சூழலில் செயல்படுகிறது; לָךְ என்பதும் ‘உனக்காக’ எனப் பாதுகாக்கப்படுகிறது.
- source_word: לְמַעַן יִיטַב לָךְ
  choice: அப்போது உனக்கு நன்மை உண்டாகும்
  rationale: לְמַעַן அறிமுகப்படுத்தும் நோக்கம் அல்லது விளைவை இயல்பான தமிழில் வெளிப்படுத்துகிறது; உடன்படிக்கை ஆசீர்வாதத்தின் கருத்தையும் மிகைப்படுத்தாமல் தக்கவைக்கிறது.
- source_word: וְהַאֲרַכְתָּ יָמִים
  choice: நீ நீண்ட காலம் வாழ்வாய்
  rationale: சொல்லுக்கு நெருக்கமாக ‘நாட்களை நீடிக்கச் செய்வாய்’; அதன் எபிரேய மரபுத்தொடரின் இயல்பான தமிழ்ப்பொருள் ‘நீண்ட காலம் வாழ்வாய்’.
theological_decisions:
- issue: வாக்குறுதியான விளைவின் தன்மை
  choice: கீழ்ப்படிதலுடன் இணைக்கப்பட்ட உடன்படிக்கை ஆசீர்வாதம் அல்லது விளைவாக மொழிபெயர்க்கப்பட்டது.
  alternative: ஒவ்வொரு தனிநபருக்கும் விதிவிலக்கின்றி நீண்ட ஆயுளை உறுதிசெய்யும் இயந்திரத்தனமான வாக்குறுதி.
  rationale: எபிரேய நோக்கம்/விளைவு அமைப்பு நன்மையையும் நீண்ட வாழ்வையும் கூறுகிறது; ஆனால் ஒவ்வொரு சம்பவத்திற்குமான நிபந்தனையற்ற உத்தரவாதம் என்று உரையைவிட அதிகமாக மொழிபெயர்க்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், ஒருமை இரண்டாம் நபர் வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன. நடையில் கண்ணியமும் பொதுவாசகருக்கான தெளிவும் பேணப்பட்டுள்ளன; எபிரேய வலியுறுத்தல் இயல்பான தமிழில் வெளிப்படுத்தப்பட்டுள்ளது.
