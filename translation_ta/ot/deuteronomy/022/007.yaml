revisions:
- from: தாய்ப்பறவையை நிச்சயமாகப் போகவிட வேண்டும்[a]; ஆனால் குஞ்சுகளை உனக்காக எடுத்துக்கொள்ளலாம்[b]. அப்போது உனக்கு நன்மை உண்டாகும்; நீ நீண்ட காலம் வாழ்வாய்.
  to: தாய்ப்பறவையை நிச்சயமாகப் போகவிட வேண்டும்[a]; ஆனால் குஞ்சுகளையோ முட்டைகளையோ உனக்காக எடுத்துக்கொள்ளலாம்[b], உனக்கு நன்மை உண்டாகவும் நீ நீண்ட நாள் வாழவும்.
  rationale: The revision changes the temporal connective to a purpose/result construction and makes explicit the contextual scope of the nest contents. It retains the emphatic command, the permissive sense of taking for oneself, and the covenantal blessing/result without overstating it as an unconditional individual guarantee.
