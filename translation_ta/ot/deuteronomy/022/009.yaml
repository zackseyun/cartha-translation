revisions:
- from: உன் திராட்சைத்தோட்டத்தில் இருவகை விதைகளை விதைக்காதே. இல்லையென்றால், நீ விதைக்கும் விதையும் திராட்சைத்தோட்டத்தின் விளைச்சலும் ஆகிய முழு விளைவும் அர்ப்பணிக்கப்பட்டதாகிவிடும்[a].
  to: உன் திராட்சைத்தோட்டத்தில் இருவகை விதைகளைக் கலந்து விதைக்காதே. இல்லையென்றால், நீ விதைக்கும் விதையும் திராட்சைத்தோட்டத்தின் விளைச்சலும் அனைத்தும் புனிதமாகிவிடும்[a].
