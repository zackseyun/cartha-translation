source:
  edition: WLC
  text: לֹא תִזְרַ֥ע כַּרְמְ/ךָ֖ כִּלְאָ֑יִם פֶּן תִּקְדַּ֗שׁ הַֽ/מְלֵאָ֤ה הַ/זֶּ֨רַע֙ אֲשֶׁ֣ר תִּזְרָ֔ע וּ/תְבוּאַ֖ת הַ/כָּֽרֶם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/009.yaml
  text: You shall not sow your vineyard with two kinds of seed[a], lest the whole yield be forfeited—the seed that you sow and the produce of the vineyard.
translation:
  language: ta
  text: உன் திராட்சைத்தோட்டத்தில் இருவகை விதைகளைக் கலந்து விதைக்காதே. இல்லையென்றால், நீ விதைக்கும் விதையும் திராட்சைத்தோட்டத்தின் விளைச்சலும் அனைத்தும் புனிதமாகிவிடும்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: நேர்ச்சொற்படி, “புனிதமானதாகிவிடும்” அல்லது “புனிதப் பயன்பாட்டுக்காக ஒதுக்கப்பட்டதாகிவிடும்.” அதாவது, அவை சாதாரண பயன்பாட்டுக்கு இனி உரியவை அல்ல.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִזְרַע
  choice: விதைக்காதே
  rationale: זרע என்பது விதையை விதைப்பதைக் குறிக்கிறது; வேளாண்மைச் சட்டத்தின் நேரடியான கட்டளை நடையைத் தமிழில் இயல்பாகத் தருகிறது.
- source_word: כַּרְמְךָ
  choice: உன் திராட்சைத்தோட்டத்தில்
  rationale: כרם என்பதற்கான தெளிவான, வழக்கமான நவீனத் தமிழ் இணைச்சொல் ‘திராட்சைத்தோட்டம்’; எபிரெய இடப்பொருளைத் தமிழில் ‘-த்தில்’ கொண்டு இயல்பாக வெளிப்படுத்துகிறது.
- source_word: כִּלְאָיִם
  choice: இருவகை விதைகளை
  rationale: כלאים தடைசெய்யப்பட்ட வகைக் கலவையைக் குறிக்கிறது. இச்சூழலில் ‘இருவகை விதைகள்’ என்பது விதை வகைகளைக் கலந்து விதைப்பதைக் தெளிவாகக் காட்டுகிறது.
- source_word: פֶּן
  choice: இல்லையென்றால்
  rationale: פן தவிர்க்க வேண்டிய எதிர்மறை விளைவை அறிமுகப்படுத்துகிறது; ‘இல்லையென்றால்’ நவீனத் தமிழில் இயல்பான எச்சரிக்கை இணைப்பாகும்.
- source_word: תִּקְדַּשׁ
  choice: அர்ப்பணிக்கப்பட்டதாகிவிடும்[a]
  rationale: קדש என்பதன் அடிப்படைப் பொருளான புனிதமாக்கப்படுதல் அல்லது சாதாரண பயன்பாட்டிலிருந்து ஒதுக்கப்படுதல் என்பதைக் காக்கிறது. ‘பறிமுதல் செய்யப்படும்’ என்று மட்டும் மொழிபெயர்த்து சட்ட விளக்கத்தை மூலப்பொருளாக மாற்றாமல், சிக்கலை அடிக்குறிப்பில் விளக்குகிறது.
- source_word: הַמְלֵאָה
  choice: முழு விளைவும்
  rationale: இச்சொல் நிலத்தின் முழுமையான மகசூல் அல்லது விளைவைச் சுட்டுகிறது; தமிழில் ‘முழு விளைவு’ சுருக்கமாகவும் தெளிவாகவும் உள்ளது.
- source_word: הַזֶּרַע אֲשֶׁר תִּזְרָע
  choice: நீ விதைக்கும் விதையும்
  rationale: மூலத்தின் தொடர்புச் சொற்றொடரை இயல்பான தமிழில் காத்து, பாதிக்கப்படும் விளைவின் முதல் பகுதியைக் குறிப்பிடுகிறது.
- source_word: וּתְבוּאַת הַכָּרֶם
  choice: திராட்சைத்தோட்டத்தின் விளைச்சலும்
  rationale: תבואה என்பது மகசூல் அல்லது விளைச்சலைக் குறிக்கிறது; திராட்சைத்தோட்டத்திலிருந்து கிடைப்பதை ‘விளைச்சல்’ இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: தூய்மை/கலவைச் சட்டச் சூழலில் תִּקְדַּשׁ என்பதன் பொருள்
  choice: முதன்மை உரையில் ‘அர்ப்பணிக்கப்பட்டதாகிவிடும்’ என்று மூலத்தின் புனிதப்படுத்துதல் சார்ந்த மொழியைத் தக்கவைத்தல்
  alternative: ‘உனக்குப் பயன்படாமல் போகும்’ அல்லது ‘பறிமுதல் செய்யப்படும்’
  rationale: இச்சொல் விளைவு சாதாரண பயன்பாட்டிலிருந்து ஒதுக்கப்படும் சட்ட விளைவைக் குறிக்கலாம்; ஆனாலும் அது யாரிடம் பறிமுதல் செய்யப்படும் என்பதை மூல உரை வெளிப்படையாகக் கூறவில்லை. ஆகவே அர்ப்பணிப்பு/புனிதப்படுத்துதல் என்ற உண்மையான மொழியியல் இழுபறி முதன்மை உரையிலும் அடிக்குறிப்பிலும் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன, மரியாதையான சட்டக் கட்டளை நடை பயன்படுத்தப்பட்டுள்ளது. ஒருமை இரண்டாம் நபர் ‘உன்/விதைக்காதே’ என்பதால் எபிரெய மூலத்தின் நேரடி முகவரித் தன்மை காக்கப்படுகிறது. கடினமான תִּקְדַּשׁ என்பதன் பொருள் மிகையாகத் தீர்மானிக்கப்படாமல், வாசிக்கத்தக்க முதன்மை உரையுடனும் விளக்க அடிக்குறிப்புடனும் வழங்கப்பட்டுள்ளது.
