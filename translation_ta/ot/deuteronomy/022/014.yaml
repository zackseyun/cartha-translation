  text: וְ/שָׂ֥ם לָ/הּ֙ עֲלִילֹ֣ת דְּבָרִ֔ים וְ/הוֹצִ֥יא עָלֶ֖י/הָ שֵׁ֣ם רָ֑ע וְ/אָמַ֗ר אֶת הָ/אִשָּׁ֤ה הַ/זֹּאת֙ לָקַ֔חְתִּי וָ/אֶקְרַ֣ב אֵלֶ֔י/הָ וְ/לֹא מָצָ֥אתִי לָ֖/הּ בְּתוּלִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/014.yaml
  text: and he charges her with false accusations and brings a bad name upon her[a], saying, ‘I took this woman, and when I came near to her[d][c][b], I did not find evidence of virginity in her.’
translation:
  language: ta
  text: அவன் அவள்மேல் அவதூறான குற்றச்சாட்டுகளைச் சுமத்தி[a], அவளுக்குக் கெட்ட பெயரை உண்டாக்கி[b], ‘இந்தப் பெண்ணை நான் மணந்துகொண்டேன்; நான் அவளை அணுகியபோது[c], கன்னித்தன்மைக்கான சான்றுகளை அவளிடம் காணவில்லை[d]’ என்று சொன்னால்,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயச் சொற்றொடர், அவளுடைய பெயரைக் கெடுக்கும் குற்றச்சாட்டுகளை அவள்மேல் சுமத்துவதைக் குறிக்கிறது. ‘பொய்யான குற்றச்சாட்டுகள்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: நேர்ச்சொல்லாக, ‘அவள்மேல் கெட்ட பெயரை வரச்செய்து’; அதாவது, அவளுடைய நற்பெயரைக் கெடுத்து.
    reason: lexical_alternative
  - marker: c
    text: இது பாலுறவைக் குறிக்கும் எபிரெய நயவுரை. ‘அவளுடன் உறவுகொண்டபோது’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: d
    text: நேர்ச்சொல்லாக, ‘அவளுக்குக் கன்னித்தன்மையை நான் காணவில்லை.’ இச்சூழலில், அடுத்த வசனங்களில் குறிப்பிடப்படும் கன்னித்தன்மைக்கான அடையாளங்கள் அல்லது சான்றுகள் குறிக்கப்படுகின்றன.
    reason: cross_reference
lexical_decisions:
- source_word: וְשָׂם לָהּ עֲלִילֹת דְּבָרִים
  choice: அவள்மேல் அவதூறான குற்றச்சாட்டுகளைச் சுமத்தி
  rationale: இந்த எபிரெயச் சொற்றொடர் ஒருவர்மேல் குற்றச்சாட்டுகளைச் சுமத்துவதைக் குறிக்கும். குற்றச்சாட்டுகள் அவளுடைய பெயரைக் கெடுப்பவை என்ற சூழல்சார் பொருளை ‘அவதூறான’ தெரிவிக்கிறது; மூலத்தில் வெளிப்படையாக இல்லாத ‘பொய்யான’ என்பதை முதன்மை உரையில் சேர்க்கவில்லை.
- source_word: וְהוֹצִיא עָלֶיהָ שֵׁם רָע
  choice: அவளுக்குக் கெட்ட பெயரை உண்டாக்கி
  rationale: ‘கெட்ட பெயரை வெளியே கொண்டுவருதல்’ என்ற எபிரெய உருவகத்தை இயல்பான தமிழில் தக்கவைத்து, அவளுடைய நற்பெயரைக் கெடுக்கும் செயலைத் தெளிவாகக் காட்டுகிறது.
- source_word: הָאִשָּׁה הַזֹּאת לָקַחְתִּי
  choice: இந்தப் பெண்ணை நான் மணந்துகொண்டேன்
  rationale: לָקַחְתִּי என்பதன் அடிப்படைப் பொருள் ‘எடுத்தேன்’ என்றாலும், இங்கு அது திருமண உறவைச் சுட்டுகிறது. ‘மணந்துகொண்டேன்’ என்பது நவீன தமிழில் இயல்பாகவும் சட்டச் சூழலுக்கு ஏற்றதாகவும் உள்ளது; ‘இந்தப் பெண்’ என்ற மூலத்தின் சற்றே விலகிய சுட்டுமுறையும் காக்கப்படுகிறது.
- source_word: וָאֶקְרַב אֵלֶיהָ
  choice: நான் அவளை அணுகியபோது
  rationale: இது பாலுறவைக் குறிக்கும் அடக்கமான எபிரெய நயவுரை. ‘அணுகியபோது’ அதன் மறைமுகமான, கண்ணியமான நடையைத் தக்கவைக்கிறது.
- source_word: וְלֹא מָצָאתִי לָהּ בְּתוּלִים
  choice: கன்னித்தன்மைக்கான சான்றுகளை அவளிடம் காணவில்லை
  rationale: בְּתוּלִים இங்கு பன்மையில் வந்து, அடுத்த வசனங்களின் சட்டச் சூழலில் கன்னித்தன்மைக்குரிய அடையாளங்கள் அல்லது சான்றுகளைக் குறிக்கிறது. ‘சான்றுகள்’ என்பது பொருளைத் தெளிவாக்கினாலும், அந்தக் குற்றச்சாட்டு உண்மை என்று தீர்மானிக்கவில்லை.
theological_decisions:
- issue: கணவனின் குற்றச்சாட்டு உண்மையா என்பது
  choice: குற்றச்சாட்டை அவன் கூறியதாகவே வழங்குதல்; உரையாசிரியரின் தீர்ப்பாகக் கூறாதிருத்தல்
  alternative: முதன்மை உரையிலேயே ‘பொய்யான குற்றச்சாட்டுகள்’ என்று திட்டவட்டமாகக் கூறுதல்
  rationale: இந்த வசனம் கணவனின் குற்றச்சாட்டை அறிமுகப்படுத்துகிறது; அதன் உண்மைத்தன்மை தொடரும் நீதிச் செயல்முறையில் ஆராயப்படுகிறது. ஆகவே மூலத்தின் சட்டரீதியான பதற்றமும் தெளிவின்மையும் பாதுகாக்கப்படுகின்றன.
translation_notes:
  register: நவீன தரத் தமிழில் இயல்பான, கண்ணியமான சட்ட-கதைநடை பயன்படுத்தப்பட்டுள்ளது. பாலுறவைக் குறிக்கும் மூலத்தின் நயவுரை வெளிப்படையாக மாற்றப்படவில்லை. வசனம் முந்தைய நிபந்தனை வாக்கியத்தின் தொடராக இருப்பதால் இறுதியில் ‘என்று சொன்னால்,’ என அமைக்கப்பட்டுள்ளது.
