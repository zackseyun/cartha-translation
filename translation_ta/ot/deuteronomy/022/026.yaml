  text: ו/ל/נער לֹא תַעֲשֶׂ֣ה דָבָ֔ר אֵ֥ין ל/נער חֵ֣טְא מָ֑וֶת כִּ֡י כַּ/אֲשֶׁר֩ יָק֨וּם אִ֤ישׁ עַל רֵעֵ֨/הוּ֙ וּ/רְצָח֣/וֹ נֶ֔פֶשׁ כֵּ֖ן הַ/דָּבָ֥ר הַ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/026.yaml
  text: But to the young woman you shall do nothing[a]; the young woman has committed no sin deserving death[b]. For this case is like when a man rises against his neighbor and murders him.
translation:
  language: ta
  text: ஆனால் அந்த இளம்பெண்ணுக்கு ஒன்றும் செய்யாதே; அந்த இளம்பெண்ணுக்கு மரண தண்டனைக்குரிய பாவம் இல்லை.[a] ஒருவன் தன் அயலானுக்கு எதிராக எழுந்து அவனைக் கொலை செய்வதுபோல, இந்தக் காரியமும் அப்படியே இருக்கிறது.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அந்த இளம்பெண் மரண தண்டனைக்குரிய குற்றம் எதுவும் செய்யவில்லை.”
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில், “அப்படியே இந்தக் காரியமும் இருக்கிறது”—அதாவது, இந்த வழக்கு தாக்கி நிகழ்த்தப்படும் கொலைக்கு ஒப்பிடப்படுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלַנַּעַר
  choice: ஆனால் அந்த இளம்பெண்ணுக்கு
  rationale: முந்தைய வசனத்தில் ஆணுக்குக் கூறப்பட்ட தண்டனையுடன் உள்ள முரண்பாட்டை וְ இங்கு காட்டுவதால் ‘ஆனால்’ என மொழிபெயர்க்கப்பட்டது. நַעַר என்பது சூழலில் முன்னர் குறிப்பிடப்பட்ட நிச்சயிக்கப்பட்ட இளம்பெண்ணைக் குறிக்கிறது.
- source_word: לֹא תַעֲשֶׂה דָבָר
  choice: ஒன்றும் செய்யாதே
  rationale: எந்தத் தண்டனை நடவடிக்கையும் எடுக்கக் கூடாது என்ற முழுமையான சட்டத் தடையையும் எபிரெய மூலத்தின் இரண்டாம் நபர் ஒருமை கட்டளையையும் இயல்பான தமிழில் தருகிறது.
- source_word: אֵין לַנַּעַר חֵטְא מָוֶת
  choice: அந்த இளம்பெண்ணிடம் மரண தண்டனைக்குரிய பாவம் இல்லை
  rationale: சொல்லுக்குச் சொல் அமைப்பான ‘அவளிடம் மரணத்திற்குரிய பாவம் இல்லை’ என்பதன் சட்டப்பூர்வ பொருளைத் தெளிவாகத் தருகிறது; அவளுக்கு மரண தண்டனை விதிக்கத்தக்க குற்றப்பொறுப்பு இல்லை என்பதே இங்கு வலியுறுத்தப்படுகிறது.
- source_word: כַּאֲשֶׁר יָקוּם אִישׁ עַל רֵעֵהוּ
  choice: ஒருவன் தன் அயலானுக்கு எதிராக எழுந்து
  rationale: எபிரெய உரையின் ஒப்பீட்டு அமைப்பையும் தாக்குதலைச் சித்தரிக்கும் உயிரோட்டமான மொழியையும் காக்கிறது. רֵעַ என்பதற்கு உறவுசார் சட்டச் சூழலில் ‘அயலான்’ பொருத்தமானது.
- source_word: וּרְצָחוֹ נֶפֶשׁ
  choice: அவனைக் கொலை செய்து
  rationale: רצח என்பது பொதுவான கொல்லுதலைவிட சட்டவிரோதமான மனிதக் கொலையைக் குறிக்கிறது. வினையிலுள்ள சுட்டுப்பெயர் பின்னொட்டு அயலானையே பலியானவனாகச் சுட்டுகிறது; נֶפֶשׁ தமிழில் தனியே மொழிபெயர்க்கப்படாமல் இயல்பாக உட்பொருளாக்கப்படுகிறது.
- source_word: כֵּן הַדָּבָר הַזֶּה
  choice: அப்படியே இந்தக் காரியமும் இருக்கிறது
  rationale: மூலத்தின் ‘அப்படியே இந்தக் காரியம்’ என்ற முடிவுறும் ஒப்புமையைப் பாதுகாக்கிறது; இங்கு דָּבָר என்பது விசாரிக்கப்படும் நிகழ்வு அல்லது வழக்கைக் குறிக்கிறது.
theological_decisions:
- issue: இளம்பெண்ணின் குற்றமின்மையின் தன்மை
  choice: இந்த வழக்கில் அவளுக்கு மரண தண்டனை விதிக்கத்தக்க குற்றப்பொறுப்பு இல்லை என்று வசனம் கூறுகிறது.
  alternative: சட்டப் பொறுப்பை மட்டும் அல்லாமல் எல்லா வகையிலும் முழுமையான ஒழுக்கக் குற்றமின்மையை வசனம் கூறுகிறது.
  rationale: חֵטְא מָוֶת என்ற சொற்றொடர் இக்கட்டளைச் சட்டச் சூழலில் மரண தண்டனைக்கு உரிய குற்றத்தைக் குறிக்கிறது. ஆகவே உரை கூறும் நீதித்துறை சார்ந்த குற்றமின்மையைப் பாதுகாத்து, அதற்கு அப்பாற்பட்ட கூற்றைச் சேர்க்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், சட்டக் கட்டளையின் கண்ணியமும் நேரடித்தன்மையும் காக்கப்பட்டுள்ளன. ‘இளம்பெண்,’ ‘மரண தண்டனைக்குரிய பாவம்,’ ‘அயலான்,’ ‘கொலை’ ஆகிய சொற்கள் பொதுவாசகர்களுக்குப் புரியும் வகையிலும் மூலத்தின் சட்ட மற்றும் ஒழுக்கத் தொனியைத் தக்கவைக்கும் வகையிலும் தேர்ந்தெடுக்கப்பட்டன.
