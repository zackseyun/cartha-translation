base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/019.yaml
  text: Then they shall fine him one hundred shekels of silver and give them to the father of the young woman[a], because he has brought a bad name upon a virgin of Israel. And she shall be his wife; he may not send her away all his days.
translation:
  language: ta
  text: பின்பு அவர்கள் அவனுக்கு நூறு சேக்கல் வெள்ளியை அபராதமாக விதித்து, அதை அந்த இளம் பெண்ணின் தந்தைக்குக் கொடுக்க வேண்டும்; ஏனெனில் அவன் இஸ்ரவேலரைச் சேர்ந்த ஒரு கன்னிப்பெண் மீது அவப்பெயர் சுமத்தியதால். அவள் அவனுக்கு மனைவியாக இருப்பாள்; அவன் தன் வாழ்நாளெல்லாம் அவளை அனுப்பிவிடக்[a] கூடாது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவளை விவாகரத்து செய்ய.” எபிரெய மொழியில் சொல்லுக்குச் சொல் “அவளை அனுப்பிவிட” என்று உள்ளது; திருமணச் சட்டச் சூழல்களில் இது திருமண உறவை முறித்தலைக் குறிக்கும் வழக்கமான சொற்றொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָנְשׁוּ
  choice: அபராதம் விதித்து
  rationale: இந்தச் சட்டச் சூழலில் வினைச்சொல் பொதுவான தண்டனையை அல்ல, பண அபராதம் விதிப்பதைக் குறிக்கிறது.
- source_word: מֵאָה כֶסֶף
  choice: நூறு சேக்கல் வெள்ளி
  rationale: எபிரெயில் சொல்லுக்குச் சொல் ‘நூறு வெள்ளி’ என்று இருந்தாலும், சட்ட மற்றும் பொருளாதாரச் சூழலில் இது வெள்ளியின் எடையளவைக் குறிக்கிறது; ‘சேக்கல்’ என்பதைச் சேர்ப்பது தொகையைத் தெளிவாக்குகிறது.
- source_word: לַאֲבִי הַנַּעֲרָה
  choice: அந்த இளம் பெண்ணின் தந்தைக்கு
  rationale: נַעֲרָה திருமண வயதுடைய இளம் பெண்ணைக் குறிக்கிறது; இத்தேர்வு நவீன தமிழில் இயல்பாகவும் மரியாதையாகவும் உள்ளது.
- source_word: כִּי הוֹצִיא שֵׁם רָע
  choice: அவப்பெயர் உண்டாக்கினான்
  rationale: ‘கெட்ட பெயரை வெளிக்கொண்டு வந்தான்’ என்ற எபிரெய மொழிமரபின் உருவகத்தை இயல்பான தமிழில் சுருக்கமாகவும் தெளிவாகவும் தெரிவிக்கிறது.
- source_word: עַל בְּתוּלַת יִשְׂרָאֵל
  choice: இஸ்ரவேலின் ஒரு கன்னிப்பெண்ணுக்கு
  rationale: בְּתוּלָה இச்சட்டக் குற்றச்சாட்டின் சூழலில் கன்னிப்பெண்ணைக் குறிக்கிறது; ‘இஸ்ரவேலின்’ என்பது உடன்படிக்கைச் சமூகத்துடனான தொடர்பைத் தக்கவைக்கிறது.
- source_word: וְלוֹ תִהְיֶה לְאִשָּׁה
  choice: அவள் அவனுக்கு மனைவியாக இருப்பாள்
  rationale: இதன் சட்டப்பூர்வமான திருமண நிலையை எபிரெய வாக்கிய அமைப்புக்கு நெருக்கமாகத் தெரிவிக்கிறது; ‘தொடர்ந்து’ போன்ற விளக்கச் சொல்லைத் தேவையின்றிச் சேர்க்கவில்லை.
- source_word: לֹא יוּכַל
  choice: கூடாது
  rationale: சட்ட உரையில் இது உடல் இயலாமையை விடத் தடையையும் சட்ட அனுமதியின்மையையும் குறிக்கிறது.
- source_word: לְשַׁלְּחָהּ
  choice: அவளை அனுப்பிவிட
  rationale: வினைச்சொல்லின் அடிப்படைப் பொருளை முதன்மை உரையில் தக்கவைக்கிறது; திருமணச் சட்டத்தில் ‘மணவிலக்கு அளித்தல்’ என்ற சூழல்சார் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: כָּל יָמָיו
  choice: தன் வாழ்நாளெல்லாம்
  rationale: ‘அவனுடைய எல்லா நாட்களும்’ என்ற எபிரெய மொழிமரபின் வாழ்நாள் முழுவதுமான கால அளவை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
theological_decisions:
- issue: திருமண உறவைச் சட்டப்படி முடிப்பதற்கான மொழிமரபு
  choice: அவளை அனுப்பிவிட
  alternative: அவளுக்கு மணவிலக்கு அளிக்க
  rationale: எபிரெய சொற்றொடர் சொல்லுக்குச் சொல் ‘அனுப்பிவிடுதல்’ என்று பொருள்பட்டாலும், திருமணச் சட்டத்தில் மணவிலக்கைக் குறிக்கலாம். மூலத்தின் மொழியுருவம் முதன்மை உரையில் பாதுகாக்கப்பட்டு, வெளிப்படையான சட்டப் பொருள் அடிக்குறிப்பில் வழங்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சட்ட உரைக்கேற்ற கண்ணியமான மற்றும் தெளிவான நடை பயன்படுத்தப்பட்டுள்ளது. ‘அபராதம் விதித்து,’ ‘சேக்கல்,’ ‘அவப்பெயர்’ ஆகியவை மூலத்தின் நீதித்துறை மற்றும் சமூகப் பின்னணியை இயல்பாக வெளிப்படுத்துகின்றன.
