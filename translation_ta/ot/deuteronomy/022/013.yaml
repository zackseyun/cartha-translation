base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/013.yaml
  text: If a man takes a wife and goes in to her[a], and then hates her,
translation:
  language: ta
  text: ஒருவன் ஒரு பெண்ணை மனைவியாக ஏற்றுக்கொண்டு, அவளுடன் சேர்ந்தபின்[a] அவளை வெறுத்தால்,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அதாவது, அவளுடன் பாலுறவுகொண்ட பின். “அவளிடம் செல்லுதல்” என்ற எபிரெய மறைமுகச் சொற்றொடர் திருமணப் பாலுறவைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: -ஆல் (நிபந்தனை விகுதி)
  rationale: இது ஒரு சட்ட வழக்கின் நிபந்தனையை அறிமுகப்படுத்துகிறது. தமிழில் வாக்கியத்தின் இறுதியில் வரும் ‘வெறுத்தால்’ என்ற வடிவம் அந்த நிபந்தனையை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: יִקַּח אִישׁ אִשָּׁה
  choice: ஒருவன் ஒரு பெண்ணை மனைவியாக ஏற்றுக்கொண்டு
  rationale: לקח என்பதன் அடிப்படைப் பொருள் ‘எடுத்துக்கொள்’; இத்திருமணச் சூழலில் ‘மனைவியாக ஏற்றுக்கொள்’ என்பது மூலமொழியின் உருவகத்தை ஓரளவு காத்து, நவீன தமிழிலும் இயல்பாக உள்ளது. אִשָּׁה என்பதன் ‘பெண்/மனைவி’ ஆகிய இரு நுணுக்கங்களும் இவ்வாக்கியத்தில் வெளிப்படுகின்றன.
- source_word: וּבָא אֵלֶיהָ
  choice: அவளுடன் சேர்ந்தபின்
  rationale: இது திருமணப் பாலுறவைக் குறிக்கும் எபிரெய மறைமுகச் சொற்றொடர். ‘சேர்தல்’ அதன் அடக்கமான நடையைத் தக்கவைக்கிறது; அடிக்குறிப்பு பொருளைத் தெளிவுபடுத்துகிறது.
- source_word: וּשְׂנֵאָהּ
  choice: அவளை வெறுத்தால்
  rationale: שׂנא என்பதன் நேரடிப் பொருள் ‘வெறு’. நிபந்தனைச் சட்ட வாக்கிய அமைப்புக்கு ஏற்ப தமிழில் ‘வெறுத்தால்’ என வழங்கப்பட்டுள்ளது.
theological_decisions: []
translation_notes:
  register: நவீன தரத் தமிழில் சட்ட நிபந்தனை இயல்பாக ஒலிக்கும்படி வாக்கியம் அமைக்கப்பட்டுள்ளது. பாலுறவைக் குறிக்கும் மூலமொழியின் அடக்கமான நடை முதன்மை உரையில் காக்கப்பட்டு, அதன் பொருள் அடிக்குறிப்பில் தெளிவாக்கப்பட்டுள்ளது.
