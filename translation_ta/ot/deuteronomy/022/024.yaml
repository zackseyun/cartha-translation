base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/024.yaml
  text: 'then you shall bring both of them out to the gate of that city[a], and you shall stone them with stones, and they shall die: the young woman because she did not cry out in the city, and the man because he violated his neighbor’s wife[c][b]. So you shall purge the evil from your midst.'
translation:
  language: ta
  text: 'அவர்கள் இருவரையும் அந்த நகரத்தின் வாசலுக்குக்[c] கொண்டு வந்து, அவர்களைக் கற்களால் எறிந்து கொல்லுங்கள்: இளம்பெண்[a] நகரத்தில் கூக்குரலிடாததற்காகவும், அந்த ஆண் தன் அயலானின் மனைவியிடம் பாலியல் அத்துமீறல் செய்ததற்காகவும்[b]. இவ்வாறு உன் நடுவிலிருந்து தீமையை அகற்றிவிடு.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “பெண்” அல்லது “இளம்பெண்” எனப் பொருள் கொள்ளலாம். இங்குள்ள எபிரெயச் சொல் முழுமையான பெண்பால் எழுத்து முடிவின்றி எழுதப்பட்டிருந்தாலும், தொடர்ந்து வரும் “அவள் கூக்குரலிடவில்லை” என்ற பெண்பால் வினைச்சொல் பெண் குறிக்கப்படுவதைத் தெளிவாக்குகிறது.
    reason: lexical_alternative
  - marker: b
    text: “அவமானப்படுத்தினான்” அல்லது “துன்புறுத்தினான்” என்றும் மொழிபெயர்க்கலாம். இந்தச் சூழலில் எபிரெய வினை பாலியல் மீறலோடு சேர்ந்த அவமானத்தையும் துன்புறுத்தலையும் குறிக்கக்கூடும்.
    reason: lexical_alternative
  - marker: c
    text: பண்டைய இஸ்ரவேலிய நகரங்களில் நகர வாசல் சட்ட விசாரணையும் பொதுத் தீர்ப்பும் நடைபெறும் வழக்கமான இடமாக இருந்தது.
    reason: cultural_note
lexical_decisions:
- source_word: וְהוֹצֵאתֶם
  choice: வெளியே கொண்டுவந்து
  rationale: יצא என்பதன் ஹிஃபில் வடிவம் பிறரை வெளியே கொண்டுவரும் காரணவினைப் பொருளைக் கொண்டுள்ளது; தமிழில் “வெளியே கொண்டுவந்து” என்பது அதை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: שְׁנֵיהֶם
  choice: அவர்கள் இருவரையும்
  rationale: இரு தரப்பினரையும் தெளிவாகக் குறிக்கும் இருமைப் பொருள் தமிழில் இயல்பாகப் பாதுகாக்கப்படுகிறது.
- source_word: שַׁעַר הָעִיר הַהִוא
  choice: அந்த நகரத்தின் வாசல்
  rationale: நகர வாசல் பொதுத் தீர்ப்பும் சட்ட நடவடிக்கையும் நடைபெற்ற இடம்; மூலத்தின் இடக்குறிப்பு நேரடியாகத் தக்கவைக்கப்படுகிறது.
- source_word: וּסְקַלְתֶּם אֹתָם בָּאֲבָנִים וָמֵתוּ
  choice: அவர்களைக் கற்களால் எறிந்து கொல்லுங்கள்
  rationale: எபிரெயத்தில் கற்களால் எறிதலும் அதனால் மரணம் ஏற்படுதலும் தொடர்ச்சியாக வருகின்றன. தமிழில் “கற்களால் எறிந்து கொல்லுங்கள்” என்பது இரண்டையும் தெளிவாகவும் இயல்பாகவும் ஒருங்கிணைக்கிறது.
- source_word: הנער
  choice: இளம்பெண்
  rationale: எழுத்து வடிவத்தில் முழுமையான பெண்பால் முடிவு இல்லாவிட்டாலும், அடுத்து வரும் צָעֲקָה பெண்பால் வினைச்சொல் பெண்ணையே குறிக்கிறது. “இளம்பெண்” என்பது வயதை மிகையாகக் குறுக்காமல் நவீன தமிழில் இயல்பாக உள்ளது.
- source_word: לֹא צָעֲקָה בָעִיר
  choice: நகரத்தில் இருந்தும் கூக்குரலிடாதது
  rationale: “கூக்குரலிடவில்லை” என்ற வெளிப்படையான சட்டக் காரணத்தைப் பாதுகாக்கிறது; “இருந்தும்” என்பது நகரச் சூழல் காரணமாக உரையில் உள்ள எதிர்பார்ப்பை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: עִנָּה
  choice: பாலியல் அத்துமீறல் செய்தான்
  rationale: இந்தப் பாலியல்-சட்டச் சூழலில் வினை அவமானமும் துன்புறுத்தலும் சேர்ந்த பாலியல் மீறலைக் குறிக்கிறது. இத்தேர்வு “வன்புணர்ச்சி” என்று பொருளை அளவுக்கு மீறிக் குறிப்பாக்காமல் அதன் தீவிரத்தைக் காட்டுகிறது.
- source_word: אֵשֶׁת רֵעֵהוּ
  choice: தன் அயலானின் மனைவி
  rationale: எபிரெயக் கட்டமைப்பையும் சமூக-உறவுப் பொருளையும் இயல்பான தமிழில் பாதுகாக்கிறது.
- source_word: וּבִעַרְתָּ הָרָע מִקִּרְבֶּךָ
  choice: உன் நடுவிலிருந்து தீமையை அகற்றிவிடு
  rationale: உபாகமத்தில் திரும்பத் திரும்ப வரும் உடன்படிக்கைச் சட்டச் சூத்திரத்தின் வலிமையை “அகற்றிவிடு” இயல்பாகக் காட்டுகிறது; இரண்டாம் நபர் ஒருமையும் தக்கவைக்கப்படுகிறது.
theological_decisions:
- issue: இளம்பெண்ணுக்கான தீர்ப்பின் காரணத்தை மொழிபெயர்த்தல்
  choice: நகரத்தில் இருந்தும் கூக்குரலிடாததற்காக
  alternative: நகரத்தில் உதவிக்காகக் கூப்பிடாததற்காக
  rationale: வசனம் கூறும் சட்டக் காரணத்தை அப்படியே பாதுகாக்கிறது. சம்மதம், குற்றப்பொறுப்பு போன்ற விரிவான நவீன சட்ட அல்லது ஒழுக்க முடிவுகளை மொழிபெயர்ப்புக்குள் சேர்க்கவில்லை.
- issue: பாலியல் சட்டச் சூழலில் עִנָּה என்பதன் பொருள்
  choice: பாலியல் அத்துமீறல் செய்தான்
  alternative: அவமானப்படுத்தினான்; துன்புறுத்தினான்; வன்புணர்ச்சி செய்தான்
  rationale: மூலச்சொல்லில் உள்ள பாலியல் மீறல் மற்றும் அவமானப்படுத்தல் சார்ந்த தீவிரத்தைத் தெரிவிக்கிறது; ஆனால் “வன்புணர்ச்சி” என்ற ஒரே நவீன சட்ட வகைக்குள் அதன் பொருளை முழுமையாக அடைத்துவிடவில்லை.
- issue: தண்டனையின் விளைவைத் தமிழில் வெளிப்படுத்தல்
  choice: கற்களால் எறிந்து கொல்லுங்கள்
  alternative: கற்களால் எறியுங்கள்; அவர்கள் சாகவேண்டும்
  rationale: எபிரெயத் தொடரில் செயலும் மரண விளைவும் இரண்டும் உள்ளன. இயல்பற்ற தமிழ்ச் சொற்றொடரைத் தவிர்த்து, இரண்டையும் ஒரே தெளிவான சட்டக் கட்டளையாக வழங்குகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், சட்ட உரைக்கேற்ற கண்ணியமும் நேர்மையும் காக்கப்பட்டுள்ளன. வன்முறை அல்லது பாலியல் மீறலை மறைக்கும் பழமையான மங்கலான சொற்கள் தவிர்க்கப்பட்டன; அதேவேளை மூலத்தில் இல்லாத நவீன சட்ட வரையறைகள் திணிக்கப்படவில்லை. பன்மை கட்டளையிலிருந்து இறுதி ஒருமை அழைப்புக்கு மாறும் எபிரெய அமைப்பு முடிந்தவரை தக்கவைக்கப்பட்டுள்ளது.
