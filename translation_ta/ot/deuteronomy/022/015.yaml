  register: நவீன பொதுத்தமிழில், சட்ட நடைமுறைக்கேற்ற கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘வேண்டும்’ கடமையை வெளிப்படுத்துகிறது; ‘கொண்டுவந்து காட்ட’ என்பது இரண்டு எபிரெய வினைகளின் நடைமுறைப் பொருளை இயல்பான தமிழில் ஒருங்கிணைக்கிறது.
