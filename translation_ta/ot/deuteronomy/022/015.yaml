base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/015.yaml
  text: then the young woman’s father and her mother shall take and bring out the evidence of the young woman’s virginity to the elders of the city at the gate[a].
translation:
  language: ta
  text: அப்போது அந்த இளம்பெண்ணின் தந்தையும் தாயும் அவளுடைய கன்னித்தன்மைக்கான சான்றை[a] எடுத்து, நகரவாசலில் நகரத்தின் மூப்பர்களிடம் கொண்டுவந்து காட்ட வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எழுத்துப்படி, “அந்த இளம்பெண்ணின் கன்னித்தன்மைகள்.” இது கன்னித்தன்மைக்குச் சான்றாக முன்வைக்கப்பட்ட அடையாளம் அல்லது ஆதாரத்தைக் குறிக்கும் மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַח
  choice: கொண்டுவந்து காட்ட வேண்டும்
  rationale: சட்ட நடைமுறையைத் தொடரும் வினை வடிவம் கட்டளை/கடமைப் பொருளைக் கொண்டுள்ளது. அடுத்துள்ள וְהוֹצִיאוּ என்பதுடன் இணைத்து, இயல்பான நவீனத் தமிழில் கடமையைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: אֲבִי הַנַּעַר וְאִמָּהּ
  choice: அந்த இளம்பெண்ணின் தந்தையும் தாயும்
  rationale: נַעֲרָה திருமண வயதுள்ள இளம்பெண்ணைக் குறிக்கிறது; ‘இளம்பெண்’ என்பது குழந்தைப் பருவத்தையோ பழமையான நடையையோ உணர்த்தாமல் பொருளை இயல்பாகத் தருகிறது.
- source_word: וְהוֹצִיאוּ
  choice: கொண்டுவந்து காட்ட
  rationale: יצא என்பதன் ஹிஃபில் வடிவம் இங்கு அதிகாரிகள்முன் ஒன்றைக் கொண்டுவந்து முன்வைப்பதைக் குறிக்கிறது. ‘காட்ட’ என்பது சட்டரீதியான சமர்ப்பிப்பைச் சூழலில் தெளிவாக்குகிறது.
- source_word: אֶת בְּתוּלֵי הַנַּעַר
  choice: அவளுடைய கன்னித்தன்மைக்கான சான்றை
  rationale: சொல்லுக்கு நேராக ‘இளம்பெண்ணின் கன்னித்தன்மைகள்’ என்ற பன்மை இருந்தாலும், இச்சட்டச் சூழலில் கன்னித்தன்மையை நிரூபிப்பதற்காக முன்வைக்கப்படும் அடையாளம் அல்லது சான்று என்ற மரபுத்தொடர்ப் பொருள் உள்ளது.
- source_word: אֶל זִקְנֵי הָעִיר
  choice: நகரத்தின் மூப்பர்களிடம்
  rationale: אֶל அதிகாரிகளாகச் செயல்படும் நகர மூப்பர்களை நோக்கிய சமர்ப்பிப்பைக் குறிக்கிறது; ‘மூப்பர்களிடம்’ என்பது தமிழில் இயல்பாகவும் நீதித்துறைச் சூழலுக்கு ஏற்றதாகவும் உள்ளது.
- source_word: הַשַּׁעְרָה
  choice: நகரவாசலில்
  rationale: திசைச் சுட்டும் வடிவத்தைச் சொற்படியாக ‘வாசலுக்கு’ என மொழிபெயர்க்கலாம்; ஆனால் நகர மூப்பர்கள் தீர்ப்பளிக்கும் இடத்தை இங்கு குறைப்பதால் ‘நகரவாசலில்’ என்பது செயல்பாட்டு இடத்தை இயல்பாகத் தெரிவிக்கிறது.
