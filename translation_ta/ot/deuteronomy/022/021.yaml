  revision_rationale: மூலத்தில் இல்லாத ‘வெளியே’ என்ற இடக்குறிப்பை நீக்கி, நுழைவிடம்/வாசல் என்ற பொருளைத் துல்லியமாக்கினேன். மேலும், கற்களால் கல்லெறிதல் என்ற சட்டத் தண்டனைச் செயலைத் தெளிவாக வெளிப்படுத்தினேன். பிற சொற்களும் அடிக்குறிப்பு நங்கூரங்களும் மூலத்தின் பொருளையும் ஆங்கில ஆய்வுத் தடத்தையும் தக்கவைத்துள்ளன.
