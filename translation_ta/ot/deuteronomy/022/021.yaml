base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/021.yaml
  text: Then they shall bring out the young woman to the entrance of her father's house[a], and the men of her city shall stone her with stones, and she shall die, because she has committed an outrageous act in Israel by prostituting herself in her father's house[c][b]. So you shall purge the evil from your midst.
translation:
  language: ta
  text: அப்போது அந்த இளம்பெண்ணை அவளுடைய தகப்பனின் வீட்டின் வாசலுக்கு கொண்டுவர வேண்டும்[a]. அவளுடைய நகரத்து ஆண்கள் கற்களால் அவளைக் கல்லெறிந்து கொல்ல வேண்டும். ஏனெனில், அவள் தன் தகப்பனின் வீட்டில் பாலியல் ஒழுக்கக்கேட்டில் ஈடுபட்டு[c], இஸ்ரவேலில் கேவலமான செயலைச் செய்தாள்[b]. இவ்வாறு உன் நடுவிலிருந்து தீமையை அகற்றுவாய்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அந்தப் பெண்ணை.” எபிரெயச் சொல் இளம் பெண்ணைக் குறிக்கலாம்; அதன் நுட்பத்தைச் சூழல் தீர்மானிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “இழிவான செயலை” அல்லது “அருவருப்பான செயலை.” எபிரெயச் சொல் ஒழுக்கரீதியாக அதிர்ச்சியூட்டும் கேவலத்தைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: c
    text: நேரடியாக, “வேசித்தனம் செய்து” அல்லது “வேசியைப் போல நடந்து.” இங்குள்ள எபிரெய வினை வேசித்தனத்தின் உருவகத்தைக் கொண்டதாயினும், முறைகேடான பாலியல் நடத்தையைக் குறிக்க விரிவாகவும் பயன்படுத்தப்படுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנַּעַר
  choice: அந்த இளம்பெண்
  rationale: சூழல் பெண்ணைக் குறிக்கிறது; நַעַר என்பதன் இளமை சார்ந்த பொருளையும் சட்ட உரையின் கண்ணியமான நடையையும் ‘இளம்பெண்’ இயல்பாகக் காக்கிறது.
- source_word: פֶּתַח בֵּית אָבִיהָ
  choice: அவளுடைய தகப்பனின் வீட்டுவாசல்
  rationale: פֶּתַח என்பது நுழைவிடம் அல்லது வாசலைக் குறிக்கிறது. ‘வீட்டுவாசல்’ இடத்தைத் தெளிவாகவும் இயல்பான தமிழிலும் தருகிறது; ‘தகப்பன்’ பண்டைய குடும்பச் சட்டச் சூழலுக்கேற்ற கண்ணியமான சொல்லாகும்.
- source_word: וּסְקָלוּהָ ... בָּאֲבָנִים
  choice: அவள்மேல் கற்களை எறிந்து அவளைக் கொல்ல வேண்டும்
  rationale: எபிரெய மொழியில் கல்லெறியும் செயலும் அதன் விளைவான மரணமும் வெளிப்படையாக உள்ளன. தமிழில் தேவையற்ற சொல் இரட்டிப்பைத் தவிர்த்து சட்டப் பொருளைத் தெளிவாகத் தருகிறது.
- source_word: אַנְשֵׁי עִירָהּ
  choice: அவளுடைய நகரத்து ஆண்கள்
  rationale: אַנְשֵׁי என்பதன் ஆண்பால் குறிப்பை நடுநிலைப்படுத்தாமல் நேரடியாகக் காக்கிறது.
- source_word: נְבָלָה
  choice: கேவலமான செயல்
  rationale: இச்சொல் சாதாரண மூடத்தனத்தை அல்ல, சமூகத்தையும் ஒழுக்கத்தையும் அதிர்ச்சியுறச் செய்யும் இழிவான குற்றச்செயலைக் குறிக்கிறது.
- source_word: לִזְנוֹת
  choice: பாலியல் ஒழுக்கக்கேட்டில் ஈடுபட்டு
  rationale: זנה விபசாரம்/வேசித்தனம் என்ற உருவக வலிமையைக் கொண்டிருந்தாலும், இச்சட்டச் சூழலில் திருமணத்திற்கு வெளியான பாலியல் நடத்தையைக் குறிக்கிறது. தமிழ் மொழிபெயர்ப்பு குற்றச்சாட்டைத் தெளிவாக்குகிறது; நேரடி மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: בֵּית אָבִיהָ
  choice: தன் தகப்பனின் வீட்டில்
  rationale: எபிரெய உரையின் இடவியல் சொல்லாக்கத்தை அப்படியே காக்கிறது; ‘குடும்பம்’ என்று பொருளை மட்டும் சுருக்கவில்லை.
- source_word: וּבִעַרְתָּ הָרָע מִקִּרְבֶּךָ
  choice: இவ்வாறு உன் நடுவிலிருந்து தீமையை அகற்றுவாய்
  rationale: உபாகமத்தில் மீண்டும் வரும் நீதிச்சட்ட வாய்பாட்டை இயல்பான தமிழில் காக்கிறது. இரண்டாம் நபர் ஒருமையையும் எதிர்கால/கட்டளை வலிமையையும் விடாமல் தருகிறது.
theological_decisions:
- issue: சட்ட மற்றும் பாலியல் சொல்லாக்கத்தை மென்மைப்படுத்தாமலும் மிகையாகக் குறிப்பாக்காமலும் மொழிபெயர்த்தல்
  choice: முதன்மை உரையில் ‘பாலியல் ஒழுக்கக்கேட்டில் ஈடுபட்டு’ என்றும், நேரடியான வேசித்தன உருவகத்தை அடிக்குறிப்பிலும் தருதல்
  alternative: ‘வேசித்தனத்தில் ஈடுபட்டு’ அல்லது ‘வேசியைப் போல நடந்து’ என்று முதன்மை உரையிலேயே மொழிபெயர்த்தல்
  rationale: இது சம்பளத்துக்கான பாலியல் தொழிலை அவசியமாகக் குறிக்கிறது என்று மிகையாக நிர்ணயிக்காமல், சூழலின் சட்ட-பாலியல் குற்றச்சாட்டைத் தெளிவுபடுத்துகிறது; அதேவேளை மூலத்தின் கடுமையான உருவகத்தை அடிக்குறிப்பு பாதுகாக்கிறது.
- issue: நகரத்தின் ஆண்கள் என்ற பாலினக் குறிப்பு
  choice: ‘அவளுடைய நகரத்து ஆண்கள்’ என்று மொழிபெயர்த்தல்
  alternative: ‘அவளுடைய நகரத்து மக்கள்’ என்று பாலின நடுநிலையாக்குதல்
  rationale: எபிரெயச் சொற்றொடரின் ஆண்பால் பன்மையை நேரடியாகப் பிரதிபலிக்கிறது; உரையில் இல்லாத பொதுமைப்படுத்தலைச் செய்யவில்லை.
- issue: தீமையை அகற்றுதல் என்ற உடன்படிக்கைச் சட்ட வாய்பாடு
  choice: ‘உன் நடுவிலிருந்து தீமையை அகற்றுவாய்’
  alternative: ‘தீயவளை உன் நடுவிலிருந்து அகற்றுவாய்’
  rationale: הָרָע இலக்கணரீதியாக ‘தீமை’ அல்லது ‘தீயது’ எனப் புரியக்கூடியதால், ஒருவரை மட்டும் சுட்டுவதாகச் சுருக்காமல் மூலத்தின் பொதுவான நீதிச்சட்ட வாய்பாட்டைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன செந்தமிழுக்கு ஏற்ற, கண்ணியமான சட்டநடை பயன்படுத்தப்பட்டுள்ளது. ‘தகப்பன்,’ ‘இளம்பெண்,’ ‘நகரத்து ஆண்கள்’ போன்ற சொற்கள் பண்டைய குடும்ப-சமூகச் சூழலைத் தெளிவாக வைத்திருக்கின்றன. தண்டனையின் கடுமை மறைக்கப்படவில்லை; அதேவேளை தேவையற்ற பரபரப்பூட்டும் மொழி தவிர்க்கப்பட்டுள்ளது.
