  revised_text: அப்போது அந்த இளம்பெண்ணை அவளுடைய தகப்பனின் வீட்டின் வாசலுக்கு கொண்டுவர வேண்டும்[a]. அவளுடைய நகரத்து ஆண்கள் கற்களால் அவளைக் கல்லெறிந்து கொல்ல வேண்டும். ஏனெனில், அவள் தன் தகப்பனின் வீட்டில் பாலியல் ஒழுக்கக்கேட்டில் ஈடுபட்டு[c], இஸ்ரவேலில் கேவலமான செயலைச் செய்தாள்[b]. இவ்வாறு உன் நடுவிலிருந்து தீமையை அகற்றுவாய்.
