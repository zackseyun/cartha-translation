  text: וְֽ/אִם בַּ/שָּׂדֶ֞ה יִמְצָ֣א הָ/אִ֗ישׁ אֶת ה/נער הַ/מְאֹ֣רָשָׂ֔ה וְ/הֶחֱזִֽיק בָּ֥/הּ הָ/אִ֖ישׁ וְ/שָׁכַ֣ב עִמָּ֑/הּ וּ/מֵ֗ת הָ/אִ֛ישׁ אֲשֶׁר שָׁכַ֥ב עִמָּ֖/הּ לְ/בַדּֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/025.yaml
  text: But if in the open field the man finds the young woman who is betrothed[a], and the man seizes her and lies with her, then only the man who lay with her shall die.
translation:
  language: ta
  text: ஆனால் திறந்த வயல்வெளியில் திருமண நிச்சயம்செய்யப்பட்ட இளம்பெண்ணை அந்த ஆண் கண்டு, அவளைப் பலமாகப் பிடித்து[a] அவளுடன் உடலுறவு கொண்டால், அவளுடன் உடலுறவு கொண்ட அந்த ஆண் மட்டுமே கொல்லப்பட வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அவளை அடக்கி வலுக்கட்டாயப்படுத்தி” அல்லது “அவளை வன்புணர்வு செய்து” என்றும் பொருள் கொள்ளலாம். எபிரெயத்தில் நேரடியாக “அவளைப் பலமாகப் பிடித்து” என்று உள்ளது; சுற்றியுள்ள சட்டச் சூழல் இச்செயல் அவளுடைய சம்மதமின்றி நடந்தது என்பதைத் தெளிவாக்குகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: ஆனால் ... என்றால்
  rationale: முந்தைய சட்டச் சூழலுக்கு மாறான நிபந்தனையை இயல்பான தமிழில் காட்டுகிறது.
- source_word: בַּשָּׂדֶה
  choice: திறந்தவெளியில்
  rationale: சொல்லின் அடிப்படைப் பொருளான வயல்/வெளியைப் பிரதிபலிப்பதோடு, உதவி கிடைக்காத தனிமையான சூழலை அளவுக்கு மீறாமல் உணர்த்துகிறது.
- source_word: יִמְצָא
  choice: கண்டு
  rationale: מצא என்பதன் நேரடிப் பொருளைச் சட்ட நிகழ்வின் தமிழ்நடைக்கு ஏற்றவாறு தருகிறது.
- source_word: הַנַּעַר הַמְאֹרָשָׂה
  choice: நிச்சயிக்கப்பட்ட இளம்பெண்ணை
  rationale: இளம் பெண்ணையும், சாதாரண நவீன நிச்சயதார்த்தத்தைவிட சட்டபூர்வப் பிணைப்பு வலுவான திருமண நிச்சய நிலையையும் சுருக்கமாகக் காட்டுகிறது.
- source_word: וְהֶחֱזִיק בָּהּ
  choice: அவளைப் பலவந்தமாகப் பிடித்து
  rationale: חזק என்பதிலுள்ள வலுக்கட்டாயமான பற்றிப்பிடித்தலைத் தெளிவாக்குகிறது; சூழல் காட்டும் பாலியல் வன்முறையை நேரடியாக 'வன்புணர்வு' என்று சொல்லி மூல வினையின் எல்லையை மீறவில்லை.
- source_word: וְשָׁכַב עִמָּהּ
  choice: அவளோடு உறவுகொண்டால்
  rationale: பாலுறவைக் குறிக்கும் எபிரெய மரபுத்தொடரை நவீன, கண்ணியமான தமிழில் இயல்பாக வழங்குகிறது.
- source_word: וּמֵת
  choice: கொல்லப்பட வேண்டும்
  rationale: சட்டச் சூழலில் மரணத் தண்டனையை விதிக்கும் பொருளைத் தெளிவாகக் காட்டுகிறது.
- source_word: לְבַדּוֹ
  choice: அந்த ஆண் மட்டுமே
  rationale: பெண் அல்ல, ஆண் ஒருவனுக்கே தண்டனை என்பதைக் குறிக்கும் தனிப்படுத்தலைத் தெளிவாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: வசனத்தின் முதன்மை உரையில் பாலியல் வன்முறையை எவ்வளவு வெளிப்படையாகச் சொல்வது
  choice: “பலவந்தமாகப் பிடித்து” என்று மொழிபெயர்த்து, சம்மதமின்மையைத் தெளிவாகக் காட்டுதல்
  alternative: “அவளை வன்புணர்வு செய்து” அல்லது வெறுமனே “அவளைப் பிடித்து”
  rationale: சுற்றியுள்ள சட்டம் செயல் சம்மதமற்றது என்பதைத் தெளிவாக்குகிறது. ஆனால் חזק என்பது தனியாக ‘வன்புணர்வு செய்’ என்பதற்குரிய பிரத்யேக வினை அல்ல; ஆகவே வலுக்கட்டாயத்தை வெளிப்படுத்தி, அதற்கு மேலான விளக்கத்தை அடிக்குறிப்பில் தருவது மூலத்துக்கு வெளிப்படையாக உள்ளது.
translation_notes:
  register: நவீனத் தரத் தமிழ்; சட்ட உரைக்கு ஏற்ற கண்ணியமும் தெளிவும் பேணப்பட்டுள்ளன. “நிச்சயிக்கப்பட்ட” என்பது சட்டப் பிணைப்புள்ள திருமண நிச்சய நிலையைக் குறிக்கிறது; “உறவுகொண்டால்” என்பது பாலுறவைக் கண்ணியமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
