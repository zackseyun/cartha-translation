- from: ஆனால் திறந்தவெளியில் நிச்சயிக்கப்பட்ட இளம்பெண்ணை அந்த ஆண் கண்டு, அவளைப் பலவந்தமாகப் பிடித்து[a] அவளோடு உறவுகொண்டால், அவளோடு உறவுகொண்ட அந்த ஆண் மட்டுமே கொல்லப்பட வேண்டும்.
