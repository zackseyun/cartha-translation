base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/026/003.yaml
  text: And you shall go to the priest who is in office in those days and say to him[c][b][a], ‘Today I declare to Yahweh your God that I have come into the land that Yahweh swore to our fathers to give to us.’
translation:
  language: ta
  text: 'அப்போது பணியில் இருக்கும் ஆசாரியனிடம்[a] நீ சென்று, அவனிடம் இவ்வாறு சொல்: “இன்று உன் கடவுளாகிய யாவேயிடம் நான் அறிவிக்கிறேன்: நமக்குக் கொடுப்பதாக யாவே நம் தந்தையரிடம்[c] சத்தியம் செய்த நாட்டிற்குள் நான் வந்திருக்கிறேன்[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லர்த்தமாக, “அந்த நாட்களில் இருக்கும் ஆசாரியன்”; அதாவது அப்போது பணியாற்றும் ஆசாரியன்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “இன்று அறிவித்திருக்கிறேன்.” எபிரெய வடிவம், இந்த வார்த்தைகளைச் சொல்வதன் மூலமே அறிவிப்பை நிகழ்த்துவதைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, “நம் முன்னோரிடம்.” எபிரெயில் ஆண்பால் வடிவம் இருப்பதாலும், இங்கு அது முற்பிதாக்களைச் சிறப்பாகக் குறிக்கக்கூடும் என்பதாலும் “நம் தந்தையர்” என்பது வைக்கப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָאתָ
  choice: நீ சென்று
  rationale: בוא என்பது பார்வைநிலைக்கேற்ப ‘வரு,’ ‘செல்,’ அல்லது ‘நுழை’ எனப் பொருள்படும். ஆசாரியனை நோக்கிய நகர்வைத் தமிழில் இயல்பாகக் காட்ட ‘சென்று’ தேர்ந்தெடுக்கப்பட்டது; சட்ட அறிவுறுத்தலின் தொடர்ச்சியும் காக்கப்படுகிறது.
- source_word: הַכֹּהֵן
  choice: ஆசாரியன்
  rationale: இஸ்ரவேலின் வழிபாட்டு மற்றும் சட்டச் சூழலில் כֹּהֵן என்பதற்கான நிலையான, எளிதில் புரியும் தமிழ் சொல்.
- source_word: אֲשֶׁר יִהְיֶה בַּיָּמִים הָהֵם
  choice: அப்போது பணியில் இருக்கும்
  rationale: சொல்லர்த்தமாக ‘அந்த நாட்களில் இருப்பவன்.’ சூழலில் அக்காலத்தில் ஆசாரியப் பணியைச் செய்துகொண்டிருப்பவரைக் குறிக்கும் பொருள் இயல்பான தமிழில் வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: הִגַּדְתִּי הַיּוֹם
  choice: இன்று … அறிவிக்கிறேன்
  rationale: எபிரெய நிறைவுவினை இங்கு சொல்வதன்மூலமே நிகழும் அறிவிப்பாகச் செயல்பட வாய்ப்புள்ளது. நிகழ்கால ‘அறிவிக்கிறேன்’ அந்தச் செயற்பாட்டு நுணுக்கத்தைக் காக்கிறது.
- source_word: לַיהוָה אֱלֹהֶיךָ
  choice: உன் கடவுளாகிய யாவேயிடம்
  rationale: இறைப்பெயர் ஒலிபெயர்க்கப்பட்டு, ஆசாரியனை நோக்கிய இரண்டாம் நபர் ஒருமை ‘உன்’ என்பதும் மாற்றமின்றிக் காக்கப்பட்டுள்ளது.
- source_word: כִּי בָאתִי אֶל הָאָרֶץ
  choice: நாட்டிற்குள் நான் வந்திருக்கிறேன் என்று
  rationale: வாக்குத்தத்த நாட்டிற்குள் நுழைந்ததும் அதன் தற்போதைய விளைவும் தமிழின் நிகழ்கால நிறைவு வடிவால் வெளிப்படுகின்றன.
- source_word: אֲשֶׁר נִשְׁבַּע יְהוָה
  choice: யாவே … சத்தியம் செய்த
  rationale: உடன்படிக்கை சார்ந்த உறுதியான ஆணையை ‘சத்தியம் செய்த’ என்பது நேரடியாகக் காக்கிறது.
- source_word: לַאֲבֹתֵינוּ
  choice: நம் தந்தையரிடம்
  rationale: எபிரெயச் சொல்லின் ஆண்பால் பன்மையும், இச்சூழலில் முற்பிதாக்களைக் குறிக்கும் சாத்தியமும் காக்கப்படுகின்றன.
- source_word: לָתֶת לָנוּ
  choice: நமக்குக் கொடுப்பதாக
  rationale: நாடு கடவுளால் அளிக்கப்படும் பரிசு என்பதையும், ‘நமக்கு’ என்ற பெறுநர் குறிப்பையும் தெளிவாக வைத்திருக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: ஆண்டவர்; யெகோவா
  rationale: மூலத்தில் காணப்படும் உடன்படிக்கைப் பெயரைப் பொதுப்பட்டமாக மாற்றாமல், ‘Yahweh’ என்பதற்கான தெளிவான தமிழ் ஒலிபெயர்ப்பாக ‘யாவே’ பயன்படுத்தப்பட்டது.
- issue: ‘நம் தந்தையர்’ என்பதன் குறிப்பு
  choice: நம் தந்தையர்
  alternative: நம் முன்னோர்
  rationale: ஆண்பால் வடிவத்தையும், உபாகமச் சூழலில் முற்பிதாக்களைச் சிறப்பாகக் குறிக்கக்கூடிய நுணுக்கத்தையும் பிரதான உரை காக்கிறது; விரிவான மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- issue: הִגַּדְתִּי என்பதன் காலமும் செயற்பாடும்
  choice: அறிவிக்கிறேன்
  alternative: அறிவித்திருக்கிறேன்
  rationale: பேசுபவர் இந்தச் சொற்களைச் சொல்வதன் மூலமே அறிவிப்பை நிகழ்த்துகிறார் என்ற செயற்பாட்டு வாசிப்பு பிரதான உரையில் தரப்படுகிறது; எபிரெய வடிவத்தின் நிறைவு நுணுக்கம் அடிக்குறிப்பில் காக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சட்ட அறிவுறுத்தலுக்கேற்ற கண்ணியமான ஆனால் பொதுவாசகர்களுக்குப் புரியும் நடை பயன்படுத்தப்பட்டது. நேரடி உரையின் வழிபாட்டு பெருமிதம் காக்கப்பட்டு, தேவையற்ற சமயப் பிரிவுசார் சொற்கள் தவிர்க்கப்பட்டன.
