source:
  edition: WLC
  text: וְ/עַתָּ֗ה הִנֵּ֤ה הֵבֵ֨אתִי֙ אֶת רֵאשִׁית֙ פְּרִ֣י הָ/אֲדָמָ֔ה אֲשֶׁר נָתַ֥תָּה לִּ֖/י יְהוָ֑ה וְ/הִנַּחְתּ֗/וֹ לִ/פְנֵי֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ וְ/הִֽשְׁתַּחֲוִ֔יתָ לִ/פְנֵ֖י יְהוָ֥ה אֱלֹהֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/026/010.yaml
  text: And now[a], behold, I have brought the firstfruits of the ground that you, O Yahweh, have given me[b]. Then you shall set it down before Yahweh your God and bow down before Yahweh your God.
translation:
  language: ta
  text: “இப்போது, இதோ, யாவே, நீர் எனக்குக் கொடுத்த நிலத்தின் விளைச்சலின் முதற்பகுதியை[a] கொண்டுவந்திருக்கிறேன்.” பின்னர் அதை உன் இறைவனாகிய யாவேவின் முன்னிலையில் வைத்து, உன் இறைவனாகிய யாவேவின் முன்னிலையில் தாழ்ந்து வணங்குவாய்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நிலத்தின் முதற்கனிகளை” அல்லது “நிலத்தின் விளைச்சலில் முதலானதை.”
    reason: lexical_alternative
  - marker: b
    text: இங்குள்ள எபிரெய வினைச்சொல் உடலைத் தாழ்த்தி வணங்குவதைக் குறிப்பாகக் குறிக்கிறது; “வழிபடுவாய்” என்பது சூழல்சார்ந்த விரிவான மொழிபெயர்ப்பு.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: இப்போது
  rationale: முன்னர் சொல்லப்பட்ட அறிக்கையிலிருந்து காணிக்கையைச் சமர்ப்பிக்கும் தற்போதைய செயலுக்கு மாறுவதை இயல்பான நவீனத் தமிழில் குறிக்கிறது.
- source_word: הִנֵּה
  choice: இதோ
  rationale: கொண்டுவரப்பட்ட காணிக்கையின் மீது கவனத்தைத் திருப்பும் எபிரெயச் சுட்டிடைச்சொல்லின் நேரடியான, இயல்பான தமிழ் வடிவம்.
- source_word: הֵבֵאתִי
  choice: கொண்டுவந்திருக்கிறேன்
  rationale: கொண்டுவரும் செயல் நிறைவுற்று அதன் விளைவு இப்போது நிலவுவதைச் சடங்கு அறிக்கைக்கு ஏற்ற தமிழில் வெளிப்படுத்துகிறது.
- source_word: רֵאשִׁית פְּרִי הָאֲדָמָה
  choice: நிலத்தின் விளைச்சலில் முதற்பகுதி
  rationale: רֵאשִׁית என்பதன் ‘முதல்/முதற்பகுதி’ என்ற பொருளையும், פְּרִי הָאֲדָמָה என்பதன் வேளாண் விளைச்சல் சார்ந்த பொருளையும் தெளிவாகக் காக்கிறது.
- source_word: אֲשֶׁר נָתַתָּה לִּי
  choice: நீர் எனக்குக் கொடுத்த
  rationale: விளைச்சல் இறைவனால் அளிக்கப்பட்டது என்ற நேரடியான ஒப்புதலையும் உறவுப்பெயர் தொடரையும் காக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய மூலத்தில் உள்ள இறைப் பெயரைப் பொதுப்பட்டப் பெயராக மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: וְהִנַּחְתּוֹ
  choice: பின்பு அதை ... வைத்து
  rationale: சடங்கு வழிமுறையில் வரும் இரண்டாம் நபர் கட்டளையுணர்வையும் பொருளை இறைமுன் வைக்கும் உடல்சார்ந்த செயலையும் இயல்பாகத் தருகிறது.
- source_word: לִפְנֵי
  choice: முன்னிலையில்
  rationale: இறைவனின் சந்நிதியில் சமர்ப்பித்தல் என்ற வழிபாட்டுச் சூழலைத் தெளிவாகக் காட்டுகிறது.
- source_word: וְהִשְׁתַּחֲוִיתָ
  choice: தாழ்ந்து பணிவாய்
  rationale: வெறும் பொதுவான ‘வழிபடு’ என்பதைக் காட்டிலும், உடலைத் தாழ்த்திப் பணியும் செயலைக் குறிப்பாகக் காக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலவசனம் உடன்படிக்கையின் தனிப்பட்ட இறைப் பெயரை நேரடியாகப் பயன்படுத்துவதால், அதை ஒரு பொதுப்பட்டமாக மாற்றாமல் ஒலிபெயர்க்கப்பட்டது.
- issue: וְהִשְׁתַּחֲוִיתָ என்பதன் பொருள்
  choice: தாழ்ந்து பணிவாய்
  alternative: வழிபடுவாய்
  rationale: இச்சொல் உடலைத் தாழ்த்தும் செயலை நேரடியாகக் குறிக்கிறது; வழிபாடு சூழலில் உட்பொருளாக இருந்தாலும், விரிவான கருத்தை மட்டும் பயன்படுத்தி உடல்சார்ந்த படிமத்தை இழக்கவில்லை.
translation_notes:
  register: நவீனத் தரநிலைத் தமிழில் எளிமையும் கண்ணியமும் பேணப்பட்டுள்ளன. நேரடி உரையின் முதல் நபர் அறிக்கையிலிருந்து சடங்கு வழிமுறையின் இரண்டாம் நபர் கட்டளைக்கு மாறுவது தெளிவாக இருக்க, மூலத்தில் உள்ள மறைமுகமான ‘சொல்’ தமிழ் வாக்கிய அமைப்பில் வெளிப்படுத்தப்பட்டுள்ளது. இறைவனை நேரடியாக அழைக்கும் இடத்தில் மரியாதைப் பன்மையான ‘நீர்’ பயன்படுத்தப்பட்டுள்ளது; வழிமுறை ஒருமை இரண்டாம் நபரில் ‘உன்’, ‘பணிவாய்’ என வைக்கப்பட்டுள்ளது.
