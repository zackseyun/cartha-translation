  text: לֹא אָכַ֨לְתִּי בְ/אֹנִ֜י מִמֶּ֗/נּוּ וְ/לֹא בִעַ֤רְתִּי מִמֶּ֨/נּוּ֙ בְּ/טָמֵ֔א וְ/לֹא נָתַ֥תִּי מִמֶּ֖/נּוּ לְ/מֵ֑ת שָׁמַ֗עְתִּי בְּ/קוֹל֙ יְהוָ֣ה אֱלֹהָ֔/י עָשִׂ֕יתִי כְּ/כֹ֖ל אֲשֶׁ֥ר צִוִּיתָֽ/נִי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/026/014.yaml
  text: I have not eaten any of it while in mourning[a], and I have not removed any of it while unclean, and I have not given any of it for the dead. I have obeyed the voice of Yahweh my God[c][b]; I have done according to all that you commanded me.
translation:
  language: ta
  text: துக்கத்தில் இருந்தபோது அதில் எதையும் நான் சாப்பிடவில்லை[a]. சடங்குத் தீட்டான நிலையில் அதிலிருந்து எதையும் அகற்றவில்லை[b]. இறந்தவர்களுக்காக அதிலிருந்து எதையும் கொடுக்கவில்லை[c]. என் கடவுளாகிய யாவேயின் குரலுக்குக் கீழ்ப்படிந்தேன்; நீர் எனக்குக் கட்டளையிட்ட அனைத்தின்படியும் செய்தேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘என் துக்கத்தில்,’ ‘வேதனையில்’ அல்லது ‘துன்பத்தில்.’
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘அதிலிருந்து எதையும் எரிக்கவில்லை’ அல்லது ‘அதிலிருந்து எதையும் முற்றிலும் நீக்கவில்லை.’ எபிரெய வினைச்சொல் எரிப்பதையோ அகற்றுவதையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, ‘இறந்த ஒருவருக்காக’ அல்லது ‘இறந்தவர்களுடன் தொடர்புடையதாக.’ தடைசெய்யப்பட்ட பயன்பாடு துல்லியமாகக் குறிப்பிடப்படவில்லை.
    reason: alternative_reading
lexical_decisions:
- source_word: בְּאֹנִי
  choice: துக்கத்தில் இருந்தபோது
  rationale: אֹנִי என்பது துக்கம், வேதனை அல்லது ஒடுக்கநிலை ஆகியவற்றைக் குறிக்கலாம். தூய்மை தொடர்பான இந்தச் சூழலில், துக்க நிலையில் இருந்தபோது உண்பதை இவ்வாசகம் குறிக்கக்கூடும். தமிழில் இயல்பாக அமையும்படியும் மூலத்தின் பொருள் வரம்பை மிகையாகக் குறுக்காதபடியும் இச்சொற்றொடர் தேர்ந்தெடுக்கப்பட்டது.
- source_word: בִעַרְתִּי מִמֶּנּוּ
  choice: அதிலிருந்து எதையும் அகற்றவில்லை
  rationale: Piel வடிவிலுள்ள בער என்பதற்கு எரித்தல், அகற்றுதல், முற்றிலும் நீக்குதல் போன்ற பொருள்கள் உண்டு. இங்கு குறிப்பிட்ட செய்முறையைத் தீர்மானிக்காமல், பரந்த பொருளைத் தக்கவைக்க ‘அகற்றவில்லை’ என மொழிபெயர்க்கப்பட்டது.
- source_word: בְּטָמֵא
  choice: தீட்டான நிலையில்
  rationale: இது சடங்குசார் தூய்மையின்மையைக் குறிக்கிறது. ‘தீட்டான நிலையில்’ என்பது அந்த நிலையைக் தெளிவாகவும் இயல்பாகவும் எடுத்துரைக்கிறது.
- source_word: לְמֵת
  choice: இறந்தவர்களுக்காக
  rationale: மூலச்சொற்றொடர் இறந்தவர் தொடர்பான பயன்பாட்டைக் குறிப்பிடுகிறது; ஆனால் அது இறுதிச்சடங்கா, பிணத்துடன் தொடர்புடையதா, வேறு பயன்பாடா என்பதை விளக்கவில்லை. ஆகவே அதன் பரந்த தன்மை காக்கப்பட்டது.
- source_word: שָׁמַעְתִּי בְּקוֹל
  choice: குரலுக்குக் கீழ்ப்படிந்தேன்
  rationale: இந்த எபிரெய வழக்கு வெறுமனே கேட்டதைக் காட்டாமல், கேட்டுக் கீழ்ப்படிந்ததைக் குறிக்கிறது. தமிழிலும் உடன்படிக்கைச் சூழலின் செயற்பொருள் தெளிவாகத் தெரிவிக்கப்படுகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: நான்கு எழுத்துகளைக் கொண்ட இறைப் பெயர் ஒரு பட்டமாக மாற்றப்படாமல், தமிழில் பரவலாகப் புரிந்துகொள்ளக்கூடிய ஒலிபெயர்ப்பாக வழங்கப்படுகிறது.
- source_word: כְּכֹל אֲשֶׁר צִוִּיתָנִי
  choice: நீர் எனக்குக் கட்டளையிட்ட அனைத்தின்படியும்
  rationale: கடவுள் கட்டளையிட்ட அனைத்திற்கும் முழுமையாக இணங்கி நடந்ததை இச்சொற்றொடர் வெளிப்படுத்துகிறது. மரியாதையையும் அறிக்கை நடையையும் காக்க ‘நீர்’ பயன்படுத்தப்பட்டது.
theological_decisions:
- issue: ‘இறந்தவர்களுக்காக’ என்பதன் தடைசெய்யப்பட்ட பயன்பாடு
  choice: குறிப்பிட்ட இறுதிச்சடங்கு அல்லது பிணத் தீட்டு என்று வரையறுக்காமல், ‘இறந்தவர்களுக்காக’ என்ற பரந்த வாசகத்தைத் தக்கவைத்தல்
  alternative: இறுதிச்சடங்குகளுக்காக / இறந்த ஒருவருக்காக / பிணத்திற்காக
  rationale: எபிரெய வாசகம் தடைசெய்யப்பட்ட செயல் எதுவென்று துல்லியமாக விளக்கவில்லை. ஒரு குறிப்பிட்ட சடங்கு விளக்கத்தைச் சேர்க்காமல் மூலத்தின் தெளிவின்மையை மொழிபெயர்ப்பு பாதுகாக்கிறது.
translation_notes:
  register: நவீன தரநிலைத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் இயல்பான ஆனால் கண்ணியமான அறிக்கை நடை பயன்படுத்தப்பட்டது. சடங்குசார் சூழலைக் காட்ட ‘தீட்டான நிலை’ என்றும், இறைப் பெயரைப் பாதுகாக்க ‘யாவே’ என்றும் வழங்கப்பட்டது. மூலத்தில் உள்ள சுருக்கமும் பொருள் தெளிவின்மையும் அடிக்குறிப்புகள் மூலம் பாதுகாக்கப்பட்டுள்ளன.
