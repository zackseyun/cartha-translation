  text: וַ/יָּרֵ֧עוּ אֹתָ֛/נוּ הַ/מִּצְרִ֖ים וַ/יְעַנּ֑וּ/נוּ וַ/יִּתְּנ֥וּ עָלֵ֖י/נוּ עֲבֹדָ֥ה קָשָֽׁה׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/026/006.yaml
  text: And the Egyptians treated us badly and afflicted us[c][b][a], and laid hard labor on us.
translation:
  language: ta
  text: எகிப்தியர்கள் எங்களுக்குத் தீங்கு செய்தார்கள்[a]; எங்களை ஒடுக்கினார்கள்[b]; எங்கள்மீது கடின உழைப்பைச் சுமத்தினார்கள்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எங்களை மோசமாக நடத்தினார்கள்.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “எங்களைத் துன்புறுத்தினார்கள்.”
    reason: lexical_alternative
  - marker: c
    text: அல்லது, “எங்கள்மீது கொடுமையான வேலையைச் சுமத்தினார்கள்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּרֵעוּ אֹתָנוּ
  choice: எங்களுக்குத் தீங்கு செய்தார்கள்
  rationale: רעע என்பதன் ஹிஃபீல் வடிவம் ஒருவருக்குத் தீங்கு செய்வதையோ அவரை மோசமாக நடத்துவதையோ குறிக்கிறது. இத்தமிழாக்கம் செயலை மிகையாகக் குறிப்பாக்காமல் அதன் தீங்கு விளைவிக்கும் தன்மையைப் பேணுகிறது.
- source_word: הַמִּצְרִים
  choice: எகிப்தியர்கள்
  rationale: எகிப்து மக்களை ஒடுக்கிய குழுவாகக் குறிப்பிடும் திட்டவட்டமான இன/தேசியப் பெயர்.
- source_word: וַיְעַנּוּנוּ
  choice: எங்களை ஒடுக்கினார்கள்
  rationale: ענה என்பதன் பியேல் வடிவம் துன்புறுத்துதல், ஒடுக்குதல் அல்லது சிறுமைப்படுத்துதல் ஆகிய பொருள்களைக் கொள்ளலாம். இச்சூழலில் ‘ஒடுக்கினார்கள்’ என்பது முதல் வினையிலிருந்து வேறுபட்ட தொடர்ச்சியான அடக்குமுறையை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: וַיִּתְּנוּ עָלֵינוּ
  choice: எங்கள்மீது ... சுமத்தினார்கள்
  rationale: נתן על என்ற சொல்லமைப்பு ஒருவர்மீது ஒன்றை வைப்பதை அல்லது திணிப்பதைக் குறிக்கிறது. உழைப்பின் பாரத்தையும் கட்டாயத் தன்மையையும் ‘சுமத்தினார்கள்’ இயல்பாக உணர்த்துகிறது.
- source_word: עֲבֹדָה קָשָׁה
  choice: கடின உழைப்பு
  rationale: עֲבֹדָה என்பது வேலை/உழைப்பு/சேவையையும் קָשָׁה என்பது கடினமான அல்லது கொடுமையான தன்மையையும் குறிக்கிறது. ‘கடின உழைப்பு’ தெளிவான நவீனத் தமிழ் இணைச்சொல்.
theological_decisions:
- issue: ஒடுக்குமுறையைக் குறிக்கும் மூன்று கூறுகளையும் தனித்தனியாக மொழிபெயர்த்தல்
  choice: ‘தீங்கு செய்தார்கள்,’ ‘ஒடுக்கினார்கள்,’ ‘கடின உழைப்பைச் சுமத்தினார்கள்’ என மூன்று வேறுபட்ட தொடர்களைப் பயன்படுத்துதல்
  alternative: முதல் இரண்டு வினைகளையும் ஒரே ‘ஒடுக்குதல்’ என்ற கருத்தில் இணைத்தல் அல்லது ஒவ்வொரு கூறிலும் வலுவான அடிமைத்தனச் சொற்களைச் சேர்த்தல்
  rationale: எபிரெய உரை தொடர்புடைய ஆனால் ஒரே பொருளல்லாத மூன்று செயல்களை வரிசைப்படுத்துகிறது. அந்த முன்னேற்றத்தைப் பேணுவது உரையின் சொல்லாட்சியை மதிக்கிறது; உரையில் நேரடியாக இல்லாத கூடுதல் கருத்துகளையும் புகுத்துவதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டது. எபிரெய வினைகளின் மும்மடங்கான முன்னேற்றம் தனித்தனியாகப் பேணப்பட்டுள்ளது; ‘சுமத்தினார்கள்’ கட்டாயமான பாரத்தை இயல்பாக வெளிப்படுத்துகிறது.
