base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/026/017.yaml
  text: Today you have declared Yahweh to be your God[a], and that you will walk in his ways, keep his statutes, his commandments, and his judgments[c][b], and obey his voice.
translation:
  language: ta
  text: இன்று யாவே உன் கடவுள் என்றும், நீ அவருடைய வழிகளில் நடந்து, அவருடைய நியமங்களையும் கட்டளைகளையும் நீதித்தீர்ப்புகளையும் கடைப்பிடித்து, அவருடைய குரலுக்குச் செவிகொடுப்பாய்[b] என்றும் நீ முறையாக அறிவித்திருக்கிறாய்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “முறையாக அறிவித்திருக்கிறாய்” என்பதற்கான எபிரெய வினைவடிவம் அரிதானது; இதை “உறுதிப்படுத்தியிருக்கிறாய்” அல்லது “முறையாக ஏற்றுக்கொண்டிருக்கிறாய்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “அவருடைய குரலுக்குச் செவிகொடுப்பாய்” என்பது சூழலில் அவருக்குக் கீழ்ப்படிவதையும் உட்படுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைப்பெயரான நான்கு எழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் இயல்பான ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: הֶאֱמַרְתָּ
  choice: உறுதியாக அறிவித்திருக்கிறாய்
  rationale: אמר என்பதன் இங்கு அரிதாக வரும் Hiphil வடிவம் சாதாரணமாகச் ‘சொல்வதை’விட முறையான உடன்படிக்கை அறிவிப்பையோ உறுதிப்படுத்தலையோ குறிக்கிறது. தமிழில் தெளிவையும் அதன் சிறப்பான வலிமையையும் இச்சொற்றொடர் காக்கிறது.
- source_word: הַיּוֹם
  choice: இன்று
  rationale: கால அழுத்தத்தை இயல்பான நவீன தமிழில் நேரடியாகத் தருகிறது.
- source_word: לִהְיוֹת לְךָ לֵאלֹהִים
  choice: உன் கடவுளாக இருப்பார்
  rationale: உடன்படிக்கை உறவைத் தெரிவிக்கும் எபிரெய infinitive அமைப்பை இயல்பான தமிழில் பிரதிபலிக்கிறது.
- source_word: וְלָלֶכֶת בִּדְרָכָיו
  choice: அவருடைய வழிகளில் நடந்து
  rationale: வாழ்க்கை நடத்தையைச் சுட்டும் வேதாகம உடன்படிக்கை உருவகமான ‘வழிகளில் நட’ என்பதைச் சுருக்காமல் பாதுகாக்கிறது.
- source_word: חֻקָּיו
  choice: அவருடைய நியமங்கள்
  rationale: חֻקִּים என்பதன் நிர்ணயிக்கப்பட்ட சட்டவிதிகள் என்ற பொருளை, மற்ற சட்டச்சொற்களிலிருந்து வேறுபடுத்தி dignified modern Tamil-ல் தருகிறது.
- source_word: מִצְוֺתָיו
  choice: அவருடைய கட்டளைகள்
  rationale: அதிகாரத்துடன் கொடுக்கப்பட்ட ஆணைகள் என்ற உடன்படிக்கைச் சட்டப் பொருளை நேரடியாகத் தருகிறது.
- source_word: מִשְׁפָּטָיו
  choice: அவருடைய நீதித்தீர்ப்புகள்
  rationale: முறைமைகள் அல்லது சட்டத் தீர்மானங்கள் எனப் பொருள்படக்கூடிய מִשְׁפָּטִים என்பதன் நீதிசார் தொடர்பைக் காக்கிறது; அருகிலுள்ள மற்ற சட்டச்சொற்களோடு கலக்காமல் விடுகிறது.
- source_word: וְלִשְׁמֹעַ בְּקֹלוֹ
  choice: அவருடைய குரலுக்குச் செவிகொடுப்பாய்
  rationale: ‘அவருடைய குரலைக் கேள்’ என்ற சொற்படிமத்தையும், சூழலில் உள்ள கீழ்ப்படிதல் நுண்ணுணர்வையும் ஒருங்கே தக்கவைக்கிறது.
theological_decisions:
- issue: உடன்படிக்கை அறிவிப்பின் தன்மையும் மனிதப் பொறுப்பும்
  choice: இஸ்ரவேல் யாவேயைத் தன் கடவுளாக முறையாக அறிவித்து, அவருடைய வழிகளிலும் கட்டளைகளிலும் நடப்பதாக உறுதியளிக்கும் வாக்கியமாக மொழிபெயர்க்கப்பட்டுள்ளது.
  alternative: அரிதான הֶאֱמַרְתָּ வடிவத்தை ‘உறுதிப்படுத்தியிருக்கிறாய்’ அல்லது மரப்பாங்காக ஒன்றோடொன்று இணைந்த infinitive தொடர்களாக மொழிபெயர்க்கலாம்.
  rationale: எபிரெய வாக்கியம் முறையான அறிவிப்பு வினையையும் அதைத் தொடரும் உடன்படிக்கைக் கடமைகளையும் இணைக்கிறது. மொழிபெயர்ப்பு இந்த இணைப்பைத் தெளிவாக்குகிறது; அதே நேரத்தில் வினையின் அரிதான தன்மையை அடிக்குறிப்பில் திறந்துவைக்கிறது.
- issue: ‘குரலுக்குச் செவிகொடுத்தல்’ என்பதில் கேட்டலும் கீழ்ப்படிதலும்
  choice: ‘செவிகொடுப்பாய்’ என்று படிமத்தைப் பாதுகாத்து, கீழ்ப்படிதல் நுண்ணுணர்வை அடிக்குறிப்பில் குறிப்பிடுகிறது.
  alternative: ‘அவருடைய குரலுக்குக் கீழ்ப்படிவாய்’ என்று பொருளை வெளிப்படையாக மொழிபெயர்க்கலாம்.
  rationale: שׁמע בקול என்பது சூழலில் கீழ்ப்படிதலை உட்படுத்தினாலும், எபிரெயத்தின் ‘குரல்/கேட்டல்’ படிமத்தை முற்றிலும் நீக்காமல் இருப்பது உண்மையான சொற்பொருள் பரப்பைச் சிறப்பாகக் காக்கிறது.
translation_notes:
  register: நவீன செந்தமிழ் கலந்த பொதுநடை பயன்படுத்தப்பட்டுள்ளது. ‘நீ’ என்பது மூலத்தின் ஒருமை அழைப்பைத் தக்கவைக்கிறது; கடவுளைக் குறிக்க மரியாதை ஒருமையான ‘அவர்’ பயன்படுத்தப்பட்டுள்ளது. சட்டச் சொற்களின் மும்மை வேறுபாடு—நியமங்கள், கட்டளைகள், நீதித்தீர்ப்புகள்—பாதுகாக்கப்பட்டுள்ளது.
