base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/026/013.yaml
  text: Then you shall say before Yahweh your God[a], ‘I have removed the holy portion from the house, and I have also given it to the Levite, the sojourner, the fatherless, and the widow, according to all your commandment that you commanded me. I have not transgressed your commandments[c][b], nor have I forgotten them.’
translation:
  language: ta
  text: பின்பு நீ உன் கடவுளாகிய யாவேவின் முன்னிலையில், ‘புனிதப் பங்கை[a] வீட்டிலிருந்து அகற்றிவிட்டேன். அதை லேவியருக்கும், குடியிருக்கும் அந்நியருக்கும்[b], தந்தையற்றவருக்கும்[c], விதவைக்கும் கொடுத்துவிட்டேன். நீர் எனக்குக் கட்டளையிட்ட உமது முழுக் கட்டளையின்படி நடந்தேன். உமது கட்டளைகளை நான் மீறவும் இல்லை; அவற்றை மறக்கவும் இல்லை’ என்று சொல்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘புனிதமானது’ அல்லது ‘அர்ப்பணிக்கப்பட்ட பங்கு’ என்றும் மொழிபெயர்க்கலாம்; இங்கு பகிர்ந்தளிப்பதற்காக ஒதுக்கப்பட்ட தசமபாகம் அல்லது விளைபொருள் குறிக்கப்படுகிறது.
    reason: lexical_alternative
  - marker: b
    text: அதாவது, இஸ்ரவேலரிடையே தங்கி வாழும் வெளிநாட்டவர்.
    reason: lexical_clarification
  - marker: c
    text: ‘அனாதை’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמַרְתָּ
  choice: பின்பு நீ ... என்று சொல்
  rationale: வாவ் இணைப்புடன் வந்த வினைச்சொல் சடங்குச் செயல்களின் தொடர்ச்சியைச் சுட்டுகிறது; ‘பின்பு’ இயல்பான தமிழ் வரிசையைக் கொடுக்கிறது.
- source_word: לִפְנֵי יְהוָה אֱלֹהֶיךָ
  choice: உன் கடவுளாகிய யாவேக்கு முன்பாக
  rationale: לִפְנֵי என்பதன் ‘முன்பாக/சந்நிதியில்’ என்ற பொருளையும், יהוה என்ற உடன்படிக்கைப் பெயரையும் நேரடியாகப் பாதுகாக்கிறது.
- source_word: בִּעַרְתִּי
  choice: அகற்றிவிட்டேன்
  rationale: இந்தச் சூழலில் எரித்தல் அல்ல, வீட்டிலிருந்த அர்ப்பணிக்கப்பட்ட பங்கை முறையாக வெளியேற்றி வழங்கியதைக் குறிக்கிறது.
- source_word: הַקֹּדֶשׁ
  choice: புனிதப் பங்கு
  rationale: சொல்லின் அடிப்படைப் பொருள் ‘புனிதமானது’; இங்கு பகிர்ந்தளிப்பதற்காக ஒதுக்கப்பட்ட தசமபாக விளைபொருளைக் குறிப்பதால் ‘பங்கு’ சூழலைத் தெளிவாக்குகிறது.
- source_word: מִן הַבַּיִת
  choice: வீட்டிலிருந்து
  rationale: எபிரெய உரையின் ‘அந்த வீட்டிலிருந்து’ என்ற அமைப்பைத் தமிழில் இயல்பாகத் தருகிறது; ‘என்’ என்பதை உரையில் இல்லாததால் சேர்க்கவில்லை.
- source_word: וְגַם נְתַתִּיו
  choice: அதை ... கொடுத்துவிட்டேன்
  rationale: பின்னொட்டு முன் குறிப்பிடப்பட்ட புனிதப் பங்கைக் குறிக்கிறது; முடிவுற்ற செயலை ‘கொடுத்துவிட்டேன்’ வெளிப்படுத்துகிறது.
- source_word: לַלֵּוִי
  choice: லேவியருக்கு
  rationale: உரை ‘லேவியர்’ என்றே கூறுகிறது; ‘ஆசாரியர்’ என்ற கூடுதல் அடையாளம் சேர்க்கப்படவில்லை.
- source_word: לַגֵּר
  choice: குடியிருக்கும் அந்நியர்
  rationale: இஸ்ரவேல் சமூகத்தின் நடுவில் தங்கி வாழும் வெளிநாட்டவரைக் குறிக்கும் גֵּר என்பதன் சமூக-சட்ட நுணுக்கத்தை வெளிப்படுத்துகிறது.
- source_word: לַיָּתוֹם
  choice: தந்தையற்றவர்
  rationale: சட்டச் சூத்திரத்தில் பாதுகாப்பற்ற சமூகப் பிரிவைக் குறிக்கும் சொல்லின் நேரடியான நுணுக்கத்தைப் பாதுகாக்கிறது.
- source_word: כְּכָל מִצְוָתְךָ אֲשֶׁר צִוִּיתָנִי
  choice: நீர் எனக்குக் கட்டளையிட்ட உமது முழுக் கட்டளையின்படியும்
  rationale: מִצְוָה என்ற ஒருமை கூட்டுப்பொருளில் வருவதையும், ‘கட்டளை/கட்டளையிட்ட’ என்ற மூலத்தின் மீளுரைப்பையும் முடிந்தவரை பாதுகாக்கிறது.
- source_word: לֹא עָבַרְתִּי מִמִּצְוֺתֶיךָ וְלֹא שָׁכָחְתִּי
  choice: உமது கட்டளைகளை நான் மீறவும் இல்லை; அவற்றை மறக்கவும் இல்லை
  rationale: עבר מן என்பதன் ‘மீறுதல்’ என்ற சூழற்பொருளையும், இரு மறுப்புகளின் இணை அமைப்பையும் தெளிவாகத் தருகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் நேரடியாக வரும் நான்கெழுத்து இறைப்பெயரைப் பொதுப்பட்டமாக மாற்றாமல் பெயராகவே தருகிறது.
- issue: הַקֹּדֶשׁ என்பதன் குறிப்பிட்ட பொருள்
  choice: புனிதப் பங்கு
  alternative: புனிதமானது
  rationale: இது பொதுவான புனிதப் பொருள் மட்டுமல்லாமல், இச்சூழலில் வழங்குவதற்காக ஒதுக்கப்பட்ட விளைபொருள் அல்லது தசமபாகப் பங்கைக் குறிக்கிறது; அடிப்படைப் பொருளை அடிக்குறிப்பில் திறந்தவாறு வைத்துள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான சட்ட-வழிபாட்டு நடையில் வடிவமைக்கப்பட்டது. கடவுளை நேரடியாகச் சொல்வதில் மரியாதைப் பன்மையான ‘நீர்/உமது’ பயன்படுத்தப்பட்டுள்ளது; உரையாடல் தொடக்கத்தில் கட்டளைக்குரிய ஒருமை ‘நீ/உன்’ பாதுகாக்கப்பட்டுள்ளது.
