base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/026/005.yaml
  text: And you shall answer and say before Yahweh your God[a], ‘My father was a perishing Aramean, and he went down to Egypt and sojourned there, few in number; and there he became a great, mighty, and numerous nation.’
translation:
  language: ta
  text: 'நீ உன் கடவுளாகிய யாவேக்கு முன்பாக மறுமொழியாக இவ்வாறு சொல்ல வேண்டும்: “என் தந்தை அழிந்து கொண்டிருந்த ஓர் அரமேயர்.[a] அவர் எகிப்துக்கு இறங்கிச் சென்று, மிகச் சிலருடன் அங்கே அந்நியராகத் தங்கினார். அங்கே அவர் ஒரு பெரிய, வலிமைமிக்க, எண்ணிக்கையில் பெருகிய தேசமாக ஆனார்.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அலைந்து திரிந்த ஓர் அரமேயர்” என்றும் மொழிபெயர்க்கலாம். இங்குள்ள எபிரெய வினையெச்சம் “அழிந்துபோகும்” என்றும் “அலைந்து திரியும்” என்றும் பொருள்படக்கூடும்.
    reason: alternative_reading
lexical_decisions:
- source_word: וְעָנִיתָ וְאָמַרְתָּ
  choice: மறுமொழி கூறி இவ்வாறு சொல்ல வேண்டும்
  rationale: வழிபாட்டுச் சூழலில் சொல்லப்படும் முறைப்படியான அறிக்கையைச் சுட்டும் இணை வினைச்சொற்களின் வலிமையை இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: לִפְנֵי יְהוָה אֱלֹהֶיךָ
  choice: உன் கடவுளாகிய யாவேக்கு முன்பாக
  rationale: לִפְנֵי என்பதன் முன்னிலைப் பொருளையும் יהוה என்ற தனிப்பெயரையும் நேரடியாக வெளிப்படுத்துகிறது.
- source_word: אֲרַמִּי
  choice: அரமேயர்
  rationale: வரலாற்று இன அடையாளத்தைத் துல்லியமாகக் குறிக்கிறது; பிற்காலப் புவியியல் பெயரான ‘சீரியர்’ என்பதைத் தவிர்க்கிறது.
- source_word: אֹבֵד
  choice: அழிந்துபோகும் நிலையில் இருந்த
  rationale: Qal நிகழ்கால வினையெச்சத்தின் ‘அழிந்துகொண்டிருத்தல்/அழிவுக்கு உட்பட்டிருத்தல்’ என்ற நேரடியான பொருளைத் தருகிறது; ‘அலைந்து திரிந்த’ என்ற சாத்தியமும் அடிக்குறிப்பில் வைக்கப்படுகிறது.
- source_word: אָבִי
  choice: என் தந்தை
  rationale: மூலத்தின் ஒருமையையும் நினைவறிக்கையின் நேரடியான சொல்லாட்சியையும் காக்கிறது; ‘மூதாதை’ என்று விளக்கமாக மாற்றவில்லை.
- source_word: וַיֵּרֶד מִצְרַיְמָה
  choice: அவர் எகிப்துக்குச் சென்று
  rationale: எகிப்தை நோக்கிய பயணத்தை இயல்பான நவீன தமிழில் கூறுகிறது; எபிரெயத் திசைமரபான ‘கீழே இறங்கினார்’ என்பதை சொற்படியாகத் திணிக்கவில்லை.
- source_word: וַיָּגָר שָׁם
  choice: அங்கே அந்நியராகத் தங்கினார்
  rationale: גור என்பதில் உள்ள குடியுரிமையற்ற அயல்நாட்டுக் குடியிருப்பாளரின் நிலையைத் தெளிவாகக் காட்டுகிறது.
- source_word: בִּמְתֵי מְעָט
  choice: மிகச் சிலருடன்
  rationale: அவரோடு இருந்த குழு எண்ணிக்கையில் சிறியது என்ற எபிரெய மரபுத்தொடரின் கருத்தைச் சுருக்கமாகத் தருகிறது.
- source_word: וַיְהִי שָׁם לְגוֹי
  choice: அங்கே அவர் ... ஒரு மக்களினமானார்
  rationale: ஒருமை எழுவாய் தன் சந்ததியினர்மூலம் மக்களினமாக ஆனார் என்ற மூலத்தின் பிரதிநிதித்துவச் சொல்லாட்சியை விளக்கிச் சீராக்காமல் காக்கிறது.
- source_word: גָּדוֹל עָצוּם וָרָב
  choice: பெரியதும் வலிமைமிக்கதும் எண்ணிக்கையில் மிகுந்ததுமான
  rationale: அளவு, வலிமை, எண்ணிக்கை ஆகிய மூன்று கூறுகளின் திரண்ட வலியுறுத்தலைத் தக்கவைக்கிறது.
theological_decisions:
- issue: אֲרַמִּי אֹבֵד אָבִי என்பதன் பொருள்
  choice: என் தந்தை அழிந்துபோகும் நிலையில் இருந்த ஓர் அரமேயர்
  alternative: என் தந்தை அலைந்து திரிந்த ஓர் அரமேயர்
  rationale: மசோரா உயிர்க்குறிப்பின்படி ‘என் தந்தை’ என்பதே வினையெச்சத்தின் எழுவாய் என வாசிப்பது இலக்கணரீதியாக நேரடியானது. אֹבֵד என்பதன் பொதுவான ‘அழிந்துபோதல்’ பொருள் முதன்மை உரையில் வைக்கப்படுகிறது; சூழலுக்கு ஏற்ற ‘அலைந்து திரிதல்’ என்ற உண்மையான மாற்றுவாசிப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது. ‘ஓர் அரமேயன் என் தந்தையை அழிக்க முயன்றான்’ என்ற வாசிப்பு அதிக விளக்கத்தைச் சேர்ப்பதால் ஏற்கப்படவில்லை.
- issue: மூதாதை மக்களினமாக ஆனார் என்ற ஒருமைச் சொல்லாட்சி
  choice: அவர் ... ஒரு மக்களினமானார்
  alternative: அவருடைய சந்ததியினர் ... ஒரு மக்களினமானார்கள்
  rationale: மூலம் மூதாதையையும் அவருடைய சந்ததியினரையும் பிரதிநிதித்துவ ஒருமையில் இணைக்கிறது. அந்த இறையியல்-கூட்டுத்தன்மை இழக்கப்படாதபடி வெளிப்படையான ‘சந்ததியினர்’ சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீன தரத்தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான வழிபாட்டு நடையில் அமைக்கப்பட்டது. ‘யாவே’ என்ற இறைப்பெயர் ஒலிபெயர்க்கப்பட்டது. பாலினத்தைக் காட்டும் ஒருமை ‘அரமேயன்’ என்பதற்குப் பதிலாக மரியாதை மற்றும் இயல்புக்காக ‘அரமேயர்’ பயன்படுத்தப்பட்டாலும், மூலத்தின் ஒருமை முழுவதும் காக்கப்பட்டுள்ளது.
