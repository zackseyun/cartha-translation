base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/026/002.yaml
  text: you shall take some of the firstfruits of all the fruit of the ground that you bring in from your land[a], which Yahweh your God is giving you, and put it in a basket[b], and go to the place that Yahweh your God will choose to make his name dwell there.
translation:
  language: ta
  text: உன் கடவுளாகிய யாவே உனக்குக் கொடுத்துவரும் உன் நாட்டிலிருந்து நீ கொண்டுவருகிற எல்லா விளைச்சல்களின் முதற்பலனிலிருந்து சிலவற்றை[a] எடுத்து, ஒரு கூடையில் வைக்க வேண்டும். பின்பு, தம் பெயரை அங்கே குடியிருக்கச் செய்யும்படி[b] உன் கடவுளாகிய யாவே தேர்ந்தெடுக்கும் இடத்திற்குச் செல்ல வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: மரபுவழியாக, “நிலத்தின் எல்லா விளைச்சல்களின் முதற்பலன்களை” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: சொல்லுக்கு நெருக்கமாக, “தம் பெயரை அங்கே குடியிருக்கச் செய்யும்படி.” யாவே தமது வழிபாட்டுக்குரிய பிரசன்னத்திற்காகத் தேர்ந்தெடுக்கும் இடத்தைக் குறிக்கும் உபாகமத்தின் தனித்துவமான சொற்றொடர் இது.
    reason: theological_idiom
lexical_decisions:
- source_word: וְלָקַחְתָּ
  choice: எடுத்து ... வைக்க வேண்டும்
  rationale: சட்ட அறிவுறுத்தல் தொடரில் வரும் எபிரேய வினை வடிவத்தின் கட்டளைப் பொருளை, இயல்பான நவீனத் தமிழில் ‘வேண்டும்’ எனக் கொடுக்கிறது.
- source_word: מֵרֵאשִׁית כָּל פְּרִי הָאֲדָמָה
  choice: நிலத்தின் எல்லா விளைச்சல்களின் முதற்பலனிலிருந்து சிலவற்றை
  rationale: מִן உடன் வரும் רֵאשִׁית, முதலில் கிடைக்கும் பகுதியிலிருந்து எடுக்கப்படுவதைச் சுட்டுகிறது; ‘சிலவற்றை’ என்பது எல்லா முதற்பலனையும் எடுக்க வேண்டும் என்ற தவறான எண்ணத்தைத் தவிர்க்கிறது. פְּרִי இங்கு பழங்களை மட்டும் அல்லாமல் வேளாண் விளைச்சல் முழுவதையும் குறிக்கிறது.
- source_word: אֲשֶׁר תָּבִיא מֵאַרְצְךָ
  choice: உன் நாட்டிலிருந்து நீ கொண்டுவரும்
  rationale: בוא என்பதன் ஹிஃபில் வடிவிலுள்ள ‘உள்ளே கொண்டுவருதல்’ என்ற இயக்கப் பொருளைப் பேணுகிறது; ‘அறுவடை செய்யும்’ என்று விளக்கி விரிவுபடுத்தவில்லை.
- source_word: אֲשֶׁר יְהוָה אֱלֹהֶיךָ נֹתֵן לָךְ
  choice: உன் கடவுளாகிய யாவே உனக்குக் கொடுத்துவரும்
  rationale: נֹתֵן என்ற நிகழ்காலப் பங்கேற்பு வடிவத்தின் தொடரும் கொடை என்ற வலியுறுத்தலை ‘கொடுத்துவரும்’ வெளிப்படுத்துகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைத் திருப்பெயரை ஒரு பட்டமாக மாற்றாமல், எபிரேய தனிப்பெயரின் தமிழாக்க ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: וְשַׂמְתָּ בַטֶּנֶא
  choice: ஒரு கூடையில் வைக்க வேண்டும்
  rationale: טֶנֶא என்பது விளைபொருளைச் சுமக்கும் கூடை; தமிழில் இயல்பாகத் தெளிவுற ‘ஒரு கூடை’ என வழங்கப்பட்டுள்ளது.
- source_word: וְהָלַכְתָּ אֶל הַמָּקוֹם אֲשֶׁר יִבְחַר
  choice: தேர்ந்தெடுக்கும் இடத்திற்குச் செல்ல வேண்டும்
  rationale: அறிவுறுத்தலின் தொடரையும், மோசேயின் உரையிலிருந்து எதிர்நோக்கப்படும் தேர்வையும் இயல்பான தமிழில் பேணுகிறது.
- source_word: לְשַׁכֵּן שְׁמוֹ שָׁם
  choice: தம் பெயரை அங்கே குடியிருக்கச் செய்யும்படி
  rationale: שכן என்பதன் காரணவினைப் பொருளையும், உபாகமத்தில் காணப்படும் ‘பெயர் குடியிருத்தல்’ என்ற தனித்துவமான இறையியல் மொழிநடையையும் சுருக்கிப் பொருளுரைக்காமல் பேணுகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைத் திருப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூலத்தில் ஒரு பட்டமல்ல, நான்கெழுத்து இறைத் தனிப்பெயர் நேரடியாக உள்ளது; எனவே அந்தத் தனிப்பெயர் தமிழில் ஒலிபெயர்க்கப்படுகிறது.
- issue: לְשַׁכֵּן שְׁמוֹ שָׁם என்ற திருத்தலச் சூத்திரம்
  choice: தம் பெயரை அங்கே குடியிருக்கச் செய்யும்படி
  alternative: தம் பெயரை அங்கே நிலைநிறுத்தும்படி
  rationale: கடவுளே ஓர் இடத்துக்குள் அடங்கியிருப்பதாகவும், அந்த இடம் வெறும் உரிமைக் குறியீடு மட்டுமே என்றும் தீர்மானிக்காமல், ‘பெயர் குடியிருத்தல்’ என்ற மூலத்தின் இறையியல் இழுபறியைப் பேணுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் அதேவேளையில் கண்ணியமான சட்ட-வழிபாட்டு நடையைப் பேணுகிறது. ‘நிலத்தின் விளைச்சல்’, ‘முதற்பலன்’, ‘தேர்ந்தெடுக்கும் இடம்’ ஆகியவை வேளாண்மை மற்றும் திருத்தலச் சூழலைத் தெளிவாக வைத்திருக்கின்றன; இறைத் திருப்பெயர் ‘யாவே’ என்றும், மரியாதைப் பன்மை ‘தம்’ என்றும் வழங்கப்பட்டுள்ளது.
