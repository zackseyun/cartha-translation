  text: וַ/יּוֹצִאֵ֤/נוּ יְהוָה֙ מִ/מִּצְרַ֔יִם בְּ/יָ֤ד חֲזָקָה֙ וּ/בִ/זְרֹ֣עַ נְטוּיָ֔ה וּ/בְ/מֹרָ֖א גָּדֹ֑ל וּ/בְ/אֹת֖וֹת וּ/בְ/מֹפְתִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/026/008.yaml
  text: And Yahweh brought us out of Egypt with a strong hand and an outstretched arm[a], and with great terror, and with signs and wonders.
translation:
  language: ta
  text: யாவே வலிமைமிக்க கரத்தாலும் நீட்டப்பட்ட புயத்தாலும், மிகுந்த அச்சத்தோடும்[a] அடையாளங்களோடும் அற்புதங்களோடும் நம்மை எகிப்திலிருந்து வெளியே கொண்டுவந்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘பெரும் பிரமிப்போடு’ அல்லது ‘பிரமிப்பூட்டும் பெருஞ்செயல்களோடு.’ எபிரெயச் சொல் அச்சம், பயங்கரம், அல்லது பிரமிப்பை உண்டாக்கும் வெளிப்பாடு ஆகியவற்றைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹצִאֵנוּ
  choice: நம்மை வெளியே கொண்டுவந்தார்
  rationale: יצא என்பதன் ஹிஃபில் வடிவம் ‘வெளியே செல்லச் செய்தல்/வெளியே கொண்டுவருதல்’ என்று பொருள்படும். இத்தேர்வு யாத்திராகம விடுதலைக் கருத்தை இயல்பான தமிழில் நேரடியாகக் காக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய மூலத்தில் தனிப்பட்ட இறைப்பெயரான நான்கெழுத்துப் பெயர் நேரடியாக உள்ளது; அதனை ஒரு பட்டத்தால் மாற்றாமல், நவீன தமிழில் வழக்கமான ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: מִמִּצְרַיִם
  choice: எகிப்திலிருந்து
  rationale: מִן முன்னிடைச்சொல்லின் பிரிவிடப் பொருளையும், வெளியே கொண்டுவரப்பட்ட இடமாக எகிப்தைக் குறிப்பிடுவதையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: בְּיָד חֲזָקָה
  choice: வலிமைமிக்க கரத்தால்
  rationale: தேவனுடைய வல்லமையான செயலைக் குறிக்கும் எபிரெய உருவகத்தை ‘கரம்’ என்ற உடற்கூறு உருவகத்துடன் காக்கிறது.
- source_word: וּבִזְרֹעַ נְטוּיָה
  choice: நீட்டிய புயத்தால்
  rationale: זְרוֹעַ נְטוּיָה என்பதன் உடற்கூறு உருவகத்தையும் செயலில் வெளிப்படும் வல்லமையையும் நெருக்கமாகப் பிரதிபலிக்கிறது.
- source_word: וּבְמֹרָא גָּדֹל
  choice: பேரச்சத்தோடு
  rationale: מוֹרָא என்பதிலுள்ள அச்சம், பயங்கரம், பிரமிப்பூட்டும் வெளிப்பாடு ஆகிய பொருள் பரப்பில், எகிப்துக்கு எதிரான செயல்களின் கடுமையான தாக்கத்தை ‘பேரச்சம்’ காக்கிறது; பிற சாத்தியங்களை அடிக்குறிப்பு தெரிவிக்கிறது.
- source_word: וּבְאֹתוֹת
  choice: அடையாளங்களோடு
  rationale: אוֹתוֹת என்பதன் அடிப்படைப் பொருளான ‘அடையாளங்கள்’ என்பதைக் கூடுதல் விளக்கமின்றி வழங்குகிறது.
- source_word: וּבְמֹפְתִים
  choice: அற்புதங்களோடு
  rationale: מוֹפְתִים என்பது இங்கு அடையாளங்களுடன் இணைந்து வியப்பூட்டும் அதிசயச் செயல்களைக் குறிக்கிறது; ‘அற்புதங்கள்’ நவீன தமிழில் தெளிவான இணைச்சொல்.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலவசனம் இறைவனின் தனிப்பட்ட உடன்படிக்கைப் பெயரைப் பயன்படுத்துகிறது. அதை ஒரு பட்டமாக மாற்றாமல் ஒலிபெயர்ப்பது மூலத்தின் வேறுபாட்டைக் காக்கிறது.
- issue: מוֹרָא என்பதன் பொருள் நுணுக்கம்
  choice: பேரச்சம்
  alternative: பெரும் பிரமிப்பு / பிரமிப்பூட்டும் பெருஞ்செயல்கள்
  rationale: இச்சொல் அச்சம், பயங்கரம், பிரமிப்பை உண்டாக்கும் வெளிப்பாடு ஆகியவற்றைக் குறிக்கலாம். எகிப்தின் மீது நிகழ்ந்த செயல்களின் கடுமையான அனுபவத் தாக்கத்தை ‘பேரச்சம்’ முன்னிறுத்துகிறது; ஆனால் சாத்தியமான மற்ற நுணுக்கங்கள் அடிக்குறிப்பில் காக்கப்படுகின்றன.
translation_notes:
  register: நவீன தரநிலைத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டுள்ளது. இணையாக வரும் בְּ தொடர்களை ‘-ஆல்/-ஓடு’ வடிவங்களில் இயல்பாக இணைத்தபோதும், எபிரெய மூலத்தின் கரம், புயம் ஆகிய உருவகங்கள் காக்கப்பட்டுள்ளன.
