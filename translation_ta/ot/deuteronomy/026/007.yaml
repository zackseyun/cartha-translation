  text: וַ/נִּצְעַ֕ק אֶל יְהוָ֖ה אֱלֹהֵ֣י אֲבֹתֵ֑י/נוּ וַ/יִּשְׁמַ֤ע יְהוָה֙ אֶת קֹלֵ֔/נוּ וַ/יַּ֧רְא אֶת עָנְיֵ֛/נוּ וְ/אֶת עֲמָלֵ֖/נוּ וְ/אֶת לַחֲצֵֽ/נוּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/026/007.yaml
  text: Then we cried out to Yahweh[a], the God of our fathers, and Yahweh heard our voice and saw our affliction, our labor[b], and our oppression.
translation:
  language: ta
  text: அப்போது நாங்கள் எங்கள் தந்தையரின் கடவுளாகிய யாவேயை நோக்கிக் கூக்குரலிட்டோம். யாவே எங்கள் குரலைக் கேட்டு, எங்கள் துன்பத்தையும் கடும் உழைப்பையும் ஒடுக்குமுறையையும் கண்டார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַנִּצְעַק
  choice: கூக்குரலிட்டோம்
  rationale: צעק என்பது உதவிக்காக எழுப்பப்படும் அவசரமான, வேதனை நிறைந்த கூக்குரலைக் குறிக்கிறது; ‘கூக்குரலிட்டோம்’ அந்த வலிமையை இயல்பான தமிழில் தருகிறது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: இது பட்டப்பெயரால் மாற்றப்படாமல், எபிரெயத் திருப்பெயரான יהוה-ஐத் தமிழில் வழக்கமான தனிப்பெயர் வடிவில் வழங்குகிறது.
- source_word: אֱלֹהֵי אֲבֹתֵינוּ
  choice: எங்கள் தந்தையரின் கடவுள்
  rationale: அசல் மொழியின் ஆண்பால் முன்னோர் குறிப்பையும் உடன்படிக்கைச் சூத்திரத்தையும் காக்கிறது.
- source_word: וַיִּשְׁמַע ... אֶת קֹלֵנוּ
  choice: எங்கள் குரலைக் கேட்டு
  rationale: ‘எங்கள் குரலைக் கேட்டார்’ என்ற எபிரெயச் சொல்லமைப்பை இயல்பான தமிழில் நேரடியாகப் பாதுகாக்கிறது; சூழலில் அது அவர்களுடைய முறையீட்டைக் கேட்டதைக் குறிக்கிறது.
- source_word: וַיַּרְא
  choice: கண்டார்
  rationale: எளிய ‘கண்டார்’ என்பது மூலத்தின் நேரடித் தன்மையையும், கவனித்து அறிந்தார் என்ற உட்பொருளை மிகைவிளக்கமின்றியும் காக்கிறது.
- source_word: עָנְיֵנוּ
  choice: எங்கள் துன்பம்
  rationale: עֳנִי குறிக்கும் துயரம், வறுமைப்பட்ட நிலை, அவதி ஆகியவற்றை வாசிக்க எளிய, போதிய நிறையுள்ள சொல்லாக ‘துன்பம்’ தருகிறது.
- source_word: עֲמָלֵנוּ
  choice: எங்கள் கடும் உழைப்பு
  rationale: עָמָל என்பதன் உழைப்பு/வருத்தம் என்ற பொருள் வரம்பில், எகிப்தில் சுமத்தப்பட்ட கடின உழைப்பைச் சூழலுக்கு ஏற்றவாறு வெளிப்படுத்துகிறது; அடுத்துள்ள ‘ஒடுக்குமுறை’ என்பதிலிருந்து வேறுபாட்டையும் காக்கிறது.
- source_word: לַחֲצֵנוּ
  choice: எங்கள் ஒடுக்குமுறை
  rationale: לַחַץ குறிக்கும் அழுத்தும் ஒடுக்குதலை ‘ஒடுக்குமுறை’ தெளிவாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: உடன்படிக்கைத் திருப்பெயரான יהוה-ஐ மொழிபெயர்த்தல்
  choice: யெகோவா
  alternative: கர்த்தர்; யாவே
  rationale: மூலத்தில் பட்டப்பெயர் அல்ல, திருப்பெயரே உள்ளது. தமிழ்ச் சூழலில் நன்கு அறியப்பட்ட தனிப்பெயர் வடிவான ‘யெகோவா’ பயன்படுத்தப்பட்டதால், ‘கர்த்தர்’ என்று பட்டப்பெயரால் மாற்றப்படவில்லை. ‘யாவே’ என்பது மூல உச்சரிப்புக்கு நெருக்கமான மாற்று ஒலிபெயர்ப்பு.
translation_notes:
  register: நவீனத் தரத் தமிழ்; எளிமையானதும் கண்ணியமானதும். மூலத்தின் மூன்று துன்பச் சொற்களான עֳנִי, עָמָל, לַחַץ ஆகியவற்றின் வேறுபாடு முறையே ‘துன்பம்’, ‘கடும் உழைப்பு’, ‘ஒடுக்குமுறை’ எனக் காக்கப்பட்டுள்ளது.
