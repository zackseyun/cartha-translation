  terminology: “தந்தையரின் கடவுள்,” “கூக்குரலிட்டோம்,” “துன்பம்,” “கடும் உழைப்பு,” and “ஒடுக்குமுறை” adequately preserve the source senses and distinguish the three Hebrew terms. The divine name requires correction from “யெகோவா” to “யாவே” for consistency with the English POB audit trail and project policy.
