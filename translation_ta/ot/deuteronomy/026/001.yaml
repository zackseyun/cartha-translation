    issue: Footnote a uses “தம் உடைமையாக்கிக்கொள்வதைக்,” shifting from the verse's singular second-person address.
    rationale: 'The explanatory wording should preserve the singular perspective: “உன் உடைமையாக்கிக்கொள்வதைக்” or an impersonal formulation.'
