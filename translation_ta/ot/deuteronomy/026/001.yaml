base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/026/001.yaml
  text: And when you come into the land that Yahweh your God is giving you as an inheritance[a], and you take possession of it and live in it[b],
translation:
  language: ta
  text: உன் கடவுளாகிய யாவே உனக்குச் சுதந்தரமாகக் கொடுக்கிற நாட்டிற்குள் நீ சென்று, அதை உடைமையாக்கிக்கொண்டு[a], அதில் குடியிருக்கும்போது[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அதை உடைமையாகக் கொண்டு.’ இங்கு வரும் எபிரெய வினைச்சொல் சில சூழல்களில் ‘அதைச் சுதந்தரித்துக்கொண்டு’ என்றும் மொழிபெயர்க்கப்படலாம்; இங்கே நாட்டை உன் உடைமையாக்கிக்கொள்வதைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘அதில் வாழும்போது’ அல்லது ‘அதில் குடியேறும்போது.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: நீ ... போது
  rationale: எதிர்காலச் சூழலை அறிமுகப்படுத்தும் எபிரெய காலத் தொடரை, தமிழில் இயல்பான ‘போது’ கட்டமைப்பால் வெளிப்படுத்துகிறது.
- source_word: תָבֹוא אֶל הָאָרֶץ
  choice: நாட்டிற்குள் நீ சென்று
  rationale: בוא உடன் אֶל வருவதால், நாட்டை நோக்கிச் செல்வதை மட்டும் அல்லாமல் அதற்குள் நுழைவதையும் ‘நாட்டிற்குள்’ தெளிவாக்குகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைத் திருப்பெயரை ஒரு பட்டத்தால் மாற்றாமல், எபிரெய நான்கெழுத்துப் பெயரின் பரவலான தமிழ் ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: אֱלֹהֶיךָ
  choice: உன் கடவுளாகிய
  rationale: இரண்டாம் நபர் ஒருமை உடைமைப் பின்னொட்டைத் தக்கவைத்து, தமிழில் இயல்பாக யாவேயுடன் இணைக்கிறது.
- source_word: נֹתֵן לְךָ
  choice: உனக்குக் கொடுக்கிற
  rationale: நிகழ்காலப் பங்கேற்புவினையின் தொடரும் அல்லது நெருங்கிய செயலுணர்வைத் தக்கவைக்கிறது; வெறும் எதிர்காலமாக மட்டுப்படுத்தவில்லை.
- source_word: נַחֲלָה
  choice: உரிமைச் சொத்தாக
  rationale: பங்காக அளிக்கப்பட்டு தலைமுறையாகக் கொண்டிருக்கப்படும் சொத்து என்ற பொருளை இயல்பான நவீன தமிழில் எடுத்துரைக்கிறது.
- source_word: וִירִשְׁתָּהּ
  choice: அதை உரிமையாக்கிக்கொண்டு
  rationale: நிலச் சூழலில் ירשׁ குறிக்கும் செயற்பாட்டுடன் உடைமையாக்குதலை வெளிப்படுத்துகிறது; முந்தைய נַחֲלָה உடன் தேவையற்ற சொல் மறுபதிவைத் தவிர்க்கிறது.
- source_word: וְיָשַׁבְתָּ בָּהּ
  choice: அதில் குடியிருக்கும்போது
  rationale: ישׁב என்பதன் நிலையான வாழ்வு அல்லது குடியேற்றப் பொருளை இயல்பான தமிழில் தருகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைத் திருப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலத்தில் தனிப்பட்ட இறைத் திருப்பெயர் நேரடியாக இருப்பதால், அதை பொதுப் பட்டமாக மாற்றாமல் ஒலிபெயர்க்கிறது.
- issue: நாடு இறைவனால் அளிக்கப்படுவதும் இஸ்ரவேல் அதை உடைமையாக்குவதும்
  choice: ‘கொடுக்கிற’ என்பதையும் ‘உரிமையாக்கிக்கொண்டு’ என்பதையும் தனித்தனியாக வைத்தல்
  alternative: நாட்டைப் பெறுதல் என்று இரண்டையும் ஒன்றாக்குதல்
  rationale: நாட்டிற்குள் செல்லுதல், யாவே அதைக் கொடுத்தல், மக்கள் அதை உடைமையாக்குதல், அதில் குடியிருத்தல் என்ற எபிரெய வரிசையையும் இறை அளிப்பு–மனிதச் செயல் பதற்றத்தையும் தக்கவைக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; சாதாரண வாசகர்களுக்குப் புரியும் வகையில் இயல்பானதாயும், வேதாகம உரைக்கு ஏற்ற கண்ணியத்துடனும் அமைக்கப்பட்டது. எபிரெய இரண்டாம் நபர் ஆண்பால் ஒருமை தமிழில் பால்வேறுபாடற்ற ‘நீ/உன்’ வடிவால் பாதுகாக்கப்பட்டுள்ளது. வசனம் அடுத்த கட்டளையோடு தொடர்வதால் முடிவில் காற்புள்ளி வைக்கப்பட்டுள்ளது.
