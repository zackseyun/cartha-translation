base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/026/016.yaml
  text: This day Yahweh your God commands you to do these statutes and judgments[c][b][a]; and you shall keep and do them with all your heart and with all your soul.
translation:
  language: ta
  text: இந்த நாளில்[a] உன் கடவுளாகிய யாவே, இந்தச் சட்டங்களையும் நீதிநியமங்களையும்[b] நிறைவேற்றும்படி உனக்குக் கட்டளையிடுகிறார்; நீ அவற்றை உன் முழு உள்ளத்தோடும் முழு உயிரோடும்[c] கடைப்பிடித்து நிறைவேற்ற வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இன்று.”
    reason: lexical_alternative
  - marker: b
    text: “நீதிநியமங்கள்” என்பதற்கான எபிரெயச் சொல் சட்டத் தீர்ப்புகள், நியாய விதிகள் அல்லது ஒழுங்குமுறைகள் என்றும் பொருள்படலாம்.
    reason: lexical_alternative
  - marker: c
    text: “உயிர்” என்று மொழிபெயர்க்கப்பட்டுள்ள எபிரெயச் சொல் நெஃபெஷ்; அது “வாழ்வு” அல்லது “முழு சுயம்” என்றும் பொருள்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַיּוֹם הַזֶּה
  choice: இந்த நாளில்
  rationale: காலத்தைச் சுட்டும் எபிரெயச் சொற்றொடரின் வலியுறுத்தலையும் உடன்படிக்கைச் சூழலின் மேன்மையான நடையையும் காக்கிறது; இயல்பான மாற்றாக ‘இன்று’ அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இது ஒரு பட்டப்பெயர் அல்ல, இஸ்ரவேலின் கடவுளுடைய தனிப்பட்ட உடன்படிக்கைப் பெயர்; எனவே அதை ‘ஆண்டவர்’ என்று மாற்றாமல் ஒலிபெயர்க்கிறது.
- source_word: אֱלֹהֶיךָ
  choice: உன் கடவுள்
  rationale: இரண்டாம் நபர் ஒருமை விகுதியைத் தக்கவைத்து, இஸ்ரவேலை ஒரே உடன்படிக்கை மக்களாக நேரடியாக அழைக்கும் வடிவை வெளிப்படுத்துகிறது.
- source_word: מְצַוְּךָ
  choice: உனக்குக் கட்டளையிடுகிறார்
  rationale: நிகழ்காலப் பங்கேற்பு வடிவத்தின் உடனடி கட்டளை வலிமையை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: הַחֻקִּים
  choice: சட்டங்கள்
  rationale: உடன்படிக்கை மற்றும் சட்டச் சூழலில் நிர்ணயிக்கப்பட்ட விதிமுறைகளைக் குறிக்கும் சொல்லாகத் தெளிவாக உள்ளது.
- source_word: הַמִּשְׁפָּטִים
  choice: நீதிநியமங்கள்
  rationale: சட்டத் தீர்ப்புகள், நியாய விதிகள், ஒழுங்குமுறைகள் ஆகிய பொருள் வளத்தைத் தக்கவைத்து, חֻקִּים என்பதிலிருந்து வேறுபடுத்துகிறது.
- source_word: וְשָׁמַרְתָּ וְעָשִׂיתָ אֹתָם
  choice: அவற்றைக் கைக்கொண்டு நிறைவேற்ற வேண்டும்
  rationale: ‘காத்தல்/கடைப்பிடித்தல்’ மற்றும் ‘செய்தல்’ என்ற இரு எபிரெய வினைகளையும் இயல்பான தமிழில் தனித்தனி கருத்துகளாகக் காக்கிறது.
- source_word: בְּכָל לְבָבְךָ
  choice: உன் முழு உள்ளத்தோடும்
  rationale: לֵבָב குறிக்கும் சிந்தனை, விருப்பம், மனப்பாங்கு ஆகிய அகநிலை அம்சங்களை ‘உள்ளம்’ இயல்பாக உள்ளடக்குகிறது.
- source_word: וּבְכָל נַפְשֶׁךָ
  choice: முழு உயிரோடும்
  rationale: נֶפֶשׁ என்பதன் ‘உயிர், தன் முழுமை, உயிருள்ள நபர்’ என்ற பரந்த பொருளை, தனியே பிரிந்த ஆன்மா என்ற தேவையற்ற விளக்கமின்றி வெளிப்படுத்துகிறது.
theological_decisions:
- issue: יְהוָה என்ற உடன்படிக்கைப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூல உரையில் தனிப்பட்ட தெய்வீகப் பெயர் நேரடியாக உள்ளது; பட்டப்பெயராக மாற்றாமல் ஒலிபெயர்ப்பது அந்த வேறுபாட்டைக் காக்கிறது.
- issue: இரண்டாம் நபர் ஒருமை அழைப்பு
  choice: உன் / உனக்கு / நீ என்ற ஒருமை வடிவங்கள்
  alternative: உங்கள் / உங்களுக்கு / நீங்கள் என்ற பன்மை அல்லது மரியாதை வடிவங்கள்
  rationale: எபிரெய உரை இஸ்ரவேலைக் கூட்டாகக் குறிப்பிட்டாலும் இலக்கண ரீதியாக ஒருமையில் நேரடியாக அழைக்கிறது; தமிழ் ஒருமை வடிவங்கள் அந்த உடன்படிக்கை நேர்முகத்தன்மையை வெளிப்படையாகக் காக்கின்றன.
- issue: נֶפֶשׁ என்பதன் மனித இயல்பு சார்ந்த பொருள்
  choice: உயிர்
  alternative: ஆத்துமா
  rationale: இங்கு அந்தச் சொல் வாழ்க்கை அல்லது முழு சுயத்தையும் குறிக்கக்கூடும். ‘உயிர்’ இந்தப் பரப்பைத் திறந்தவாறு வைத்திருந்து, உடலிலிருந்து பிரிந்த ஓர் அங்கம் என்ற குறிப்பிட்ட கோட்பாட்டை உரைக்குள் சேர்க்காது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. சட்டச் சொற்களுக்கிடையிலான வேறுபாடு காக்கப்பட்டுள்ளது; இஸ்ரவேலை ஒரே உடன்படிக்கை மக்களாக அழைக்கும் எபிரெய ஒருமை வடிவமும் தமிழில் வெளிப்படையாகத் தக்கவைக்கப்பட்டுள்ளது.
