- from: யெகோவா இன்று உன்னைத் தமக்குச் சொந்தமான அருமைமிக்க மக்களாக[a] இருக்கும்படி அறிவித்திருக்கிறார்; அவர் உன்னிடம் கூறியபடியே[b], நீ அவருடைய எல்லாக் கட்டளைகளையும் கடைப்பிடிக்க வேண்டும்.
  to: யெகோவா இன்று உன்னைத் தமக்குரிய விலையேறப்பெற்ற மக்களாக[a], அவர் உன்னிடம் கூறியபடியே[b], இருக்கும்படி அறிவித்திருக்கிறார்; நீ அவருடைய எல்லாக் கட்டளைகளையும் கடைப்பிடிக்க வேண்டும்.
