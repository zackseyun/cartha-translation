base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/026/018.yaml
  text: And Yahweh has declared today that you are to be his treasured people[a], as he promised you[b], and that you are to keep all his commandments.
translation:
  language: ta
  text: யெகோவா இன்று உன்னைத் தமக்குரிய விலையேறப்பெற்ற மக்களாக[a], அவர் உன்னிடம் கூறியபடியே[b], இருக்கும்படி அறிவித்திருக்கிறார்; நீ அவருடைய எல்லாக் கட்டளைகளையும் கடைப்பிடிக்க வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தமக்குச் சொந்தமான அருமைமிக்க மக்கள்.” எபிரெயத்தில், “விலையேறப்பெற்ற சொத்தான மக்கள்.”
    reason: lexical_alternative
  - marker: b
    text: சூழலுக்கு ஏற்ப, “அவர் உனக்கு வாக்குறுதி அளித்தபடியே.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיהוָה
  choice: யெகோவா
  rationale: தனிப்பட்ட இறைப்பெயரான יהוה என்பதை பொதுப்பட்டமான ‘ஆண்டவர்’ என மாற்றாமல், தமிழில் நன்கு அறியப்பட்ட ‘யெகோவா’ என்ற ஒலிபெயர்ப்பால் தருகிறது.
- source_word: הֶאֱמִירְךָ
  choice: உன்னை ... இருக்கும்படி அறிவித்திருக்கிறார்
  rationale: அரிதான இந்த ஹிஃபில் வடிவம் உடன்படிக்கைச் சூழலில் முறைப்படியான பிரகடனம் அல்லது உறுதிப்படுத்தலைக் குறிக்கிறது. ‘அறிவித்திருக்கிறார்’ என்பது ‘தேர்ந்தெடுத்தார்’ என்ற விளக்கத்தைச் சேர்க்காமல் அதன் செயற்பாட்டு வலிமையைத் தக்கவைக்கிறது.
- source_word: הַיּוֹם
  choice: இன்று
  rationale: எபிரெயச் சொல்லின் காலச்சுட்டையும் உடன்படிக்கையின் உடனடித் தன்மையையும் இயல்பான நவீன தமிழில் காக்கிறது.
- source_word: לִהְיוֹת לוֹ
  choice: தமக்குச் சொந்தமான ... இருக்கும்படி
  rationale: இறைவனுடனான சொந்த உறவையும், அறிவிப்போடு இணைந்த நோக்கம் அல்லது விளைவையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: לְעַם סְגֻלָּה
  choice: அருமைமிக்க மக்கள்
  rationale: עַם என்பதன் கூட்டு மக்கள் அடையாளத்தையும் סְגֻלָּה என்பதன் மதிப்புமிக்க தனிச்சொத்து அல்லது பொக்கிஷம் என்ற நுண்பொருளையும் இணைத்துக் காட்டுகிறது.
- source_word: כַּאֲשֶׁר דִּבֶּר לָךְ
  choice: அவர் உன்னிடம் கூறியபடியே
  rationale: דבר என்பதன் நேரடிப் பொருளான ‘பேசு/கூறு’ என்பதைத் தக்கவைத்து, ‘வாக்குறுதி அளித்தார்’ என்ற சூழல்சார் விளக்கத்தை முதன்மை உரைக்குள் கட்டாயப்படுத்தாமல் விடுகிறது.
- source_word: וְלִשְׁמֹר
  choice: கடைப்பிடிக்க வேண்டும்
  rationale: கட்டளைகளுடன் வரும் שׁמר என்பது அவற்றைக் காத்து நடப்பதைக் குறிக்கிறது; ‘கடைப்பிடிக்க’ என்பது தெளிவான நவீனத் தமிழ். ‘வேண்டும்’ இங்கு உரிய கடமை உணர்வை வெளிப்படுத்துகிறது.
- source_word: כָּל מִצְוֺתָיו
  choice: அவருடைய எல்லாக் கட்டளைகளையும்
  rationale: உடன்படிக்கைச் சட்டத்தின் பதிவைத் தக்கவைக்கும் நேரடியான, இயல்பான மொழிபெயர்ப்பு.
theological_decisions:
- issue: உடன்படிக்கைச் சூழலில் அரிதான הֶאֱמִיר என்ற வினையின் வலிமை
  choice: முறைப்படியான இறை அறிவிப்பு
  alternative: ‘தேர்ந்தெடுத்தார்’ என்ற தேர்தல் மொழி அல்லது பழமையான பரஸ்பர உறுதிமொழிச் சொல்
  rationale: வசனம் இஸ்ரவேலின் நிலையைப் பற்றிய யெகோவாவின் உடன்படிக்கை அறிவிப்பை விவரிக்கிறது. ‘அறிவித்திருக்கிறார்’ என்பது உடனடி சொற்கள் கூறுவதைவிட வலுவான தேர்தல் கோட்பாட்டைச் சேர்க்காமலும், வாசகருக்கு அறிமுகமற்ற பழமையான சொல்லைப் பயன்படுத்தாமலும் அந்த வலிமையைப் பாதுகாக்கிறது.
- issue: כַּאֲשֶׁר דִּבֶּר לָךְ என்பதில் வாக்குறுதியின் நுண்பொருள்
  choice: முதன்மை உரையில் ‘கூறியபடியே’
  alternative: ‘வாக்குறுதி அளித்தபடியே’
  rationale: உடன்படிக்கைச் சூழல் வாக்குறுதியைக் குறிப்பதாக இருக்கலாம்; ஆயினும் எபிரெய வினை நேரடியாக ‘பேசினார்/கூறினார்’ என்பதால் அந்த உண்மையான அகலப் பொருள் முதன்மை உரையில் காக்கப்பட்டு, வாக்குறுதி என்ற சாத்தியம் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையும் வாசிப்புத் தெளிவும் கொண்ட நடை பயன்படுத்தப்பட்டுள்ளது. ஒருமை இரண்டாம் நபரான ךָ/לָךְ என்பதற்கேற்ப ‘உன்னை/உன்னிடம்/நீ’ காக்கப்பட்டுள்ளது. இறைவனைக் குறிக்கும் இடங்களில் மரியாதைப் பன்மை வினை மற்றும் சுட்டுப்பெயர்கள் பயன்படுத்தப்பட்டுள்ளன; ‘அருமைமிக்க மக்கள்’ என்பது இயல்பான தமிழுக்காக இலக்கணப் பன்மையில் அமைந்தாலும், இஸ்ரவேலை ஒரே கூட்டு மக்களாகக் குறிக்கிறது.
