  text: כִּ֣י תְכַלֶּ֞ה לַ֠/עְשֵׂר אֶת כָּל מַעְשַׂ֧ר תְּבוּאָתְ/ךָ֛ בַּ/שָּׁנָ֥ה הַ/שְּׁלִישִׁ֖ת שְׁנַ֣ת הַֽ/מַּעֲשֵׂ֑ר וְ/נָתַתָּ֣ה לַ/לֵּוִ֗י לַ/גֵּר֙ לַ/יָּת֣וֹם וְ/לָֽ/אַלְמָנָ֔ה וְ/אָכְל֥וּ בִ/שְׁעָרֶ֖י/ךָ וְ/שָׂבֵֽעוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/026/012.yaml
  text: When you have finished tithing all the tithe of your produce in the third year[a], the year of the tithe, then you shall give it to the Levite, the sojourner, the fatherless, and the widow, and they shall eat within your gates and be satisfied.
translation:
  language: ta
  text: மூன்றாம் ஆண்டில், அதாவது தசமபாகத்தின் ஆண்டில், உங்கள் விளைச்சலின் தசமபாகம் முழுவதையும் பிரித்து ஒதுக்கி முடித்த பின்பு, அதை லேவியருக்கும், உங்களிடையே வாழும் அந்நியருக்கும், தந்தையற்றவருக்கும், விதவைக்கும் கொடுக்க வேண்டும். அவர்கள் உங்கள் வாசல்களுக்குள்[a] உண்டு நிறைவடைவார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உங்கள் ஊர்களில்”; சொல்லாட்சிப்படி, “உங்கள் வாசல்களுக்குள்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי תְכַלֶּה לַעְשֵׂר
  choice: ஒதுக்கி முடித்த பின்பு
  rationale: כִּי இங்கு காலச் சூழலை அறிமுகப்படுத்துகிறது; כלה என்பதன் தீவிர வினை வடிவம் செயலை முழுமையாக முடிப்பதைக் குறிக்கிறது. עשר என்பது தசமபாகத்தைப் பிரித்துவைக்கும் செயல் என்பதால், இயல்பான தமிழில் இவ்வாறு வழங்கப்பட்டது.
- source_word: מַעְשַׂר
  choice: தசமபாகம்
  rationale: விளைச்சலிலிருந்து பிரிக்கப்படும் பத்தில் ஒரு பங்கைத் துல்லியமாகக் குறிக்கும், வேதாகமப் பயன்பாட்டுக்கு ஏற்ற சொல்.
- source_word: תְּבוּאָתְךָ
  choice: உங்கள் விளைச்சல்
  rationale: நிலத்திலிருந்து கிடைக்கும் வேளாண் உற்பத்தி அல்லது மகசூலைக் குறிக்கிறது; சூழலில் 'விளைச்சல்' இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: שְׁנַת הַמַּעֲשֵׂר
  choice: தசமபாகத்தின் ஆண்டு
  rationale: மூன்றாம் ஆண்டைத் தசமபாகத்துக்குரிய சிறப்பு ஆண்டாக அடையாளப்படுத்தும் எபிரேய இணைப்புத் தொடரை நெருக்கமாகப் பாதுகாக்கிறது.
- source_word: לַלֵּוִי
  choice: லேவியர்
  rationale: கோத்திர மற்றும் சமூக அடையாளத்தைப் பாதுகாக்கும் வழக்கமான தமிழ் வடிவம்.
- source_word: לַגֵּר
  choice: உங்களிடையே குடியிருக்கும் அந்நியர்
  rationale: גֵּר என்பது வழிப்போக்கரை அல்ல, இஸ்ரவேலரிடையே வசிக்கும் பிறநாட்டவரைக் குறிக்கிறது; தமிழ் வாசகருக்கு அந்தச் சமூக நிலையைத் தெளிவாக்குகிறது.
- source_word: לַיָּתוֹם
  choice: தந்தையற்றவர்
  rationale: எபிரேயச் சட்ட மொழியில் பாதுகாப்பற்ற சமூக நிலையைக் குறிக்கும் குறிப்பிட்ட வகையைப் பாதுகாக்கிறது; பொதுவான 'அனாதை' என்பதைவிட மூலத்துக்கு நெருக்கமானது.
- source_word: בִשְׁעָרֶיךָ
  choice: உங்கள் வாசல்களுக்குள்
  rationale: சொல்லாட்சிப்படி 'உங்கள் வாசல்களுக்குள்'; இது நகரங்களையோ குடியிருப்புகளையோ குறிக்கும் எபிரேய மரபுத்தொடர். மூல உருவகம் முதன்மை உரையில் பாதுகாக்கப்பட்டு, பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: וְאָכְלוּ ... וְשָׂבֵעוּ
  choice: உண்டு நிறைவடைவார்கள்
  rationale: உண்பதையும் போதுமான அளவு பெற்று நிறைவடைவதையும் குறிக்கும் தொடர்ச்சியான வினைகளை இயல்பான தமிழில் வழங்குகிறது.
theological_decisions:
- issue: உடன்படிக்கைச் சட்டத்தில் குறிப்பிடப்படும் பாதுகாப்பற்ற சமூகக் குழுக்கள்
  choice: லேவியர், குடியிருக்கும் அந்நியர், தந்தையற்றவர், விதவை ஆகிய தனித்த வகைகளை அப்படியே வைத்தல்
  alternative: சமயப் பணியாளர்கள், குடியேறிகள், அனாதைகள், விதவைகள் அல்லது பொதுவாக ஏழைகள் என்று விரிவாக்குதல்
  rationale: வசனம் தசமபாகத்தின் பயனாளர்களாக குறிப்பிட்ட சமூக மற்றும் உடன்படிக்கை சார்ந்த வகைகளைப் பெயரிடுகிறது. அவற்றைப் பொதுமைப்படுத்துவது மூலச் சட்டத்தின் தனித்த அமைப்பை மறைக்கும்.
- issue: בִשְׁעָרֶיךָ என்பதன் சொல்லாட்சி மற்றும் கருத்துப் பொருள்
  choice: முதன்மை உரையில் 'உங்கள் வாசல்களுக்குள்'
  alternative: உங்கள் ஊர்களில்
  rationale: எபிரேய உருவகத்தைப் பாதுகாத்தபடியே, அதன் நடைமுறைப் பொருளான உள்ளூர் ஊர்கள் அல்லது குடியிருப்புகளை அடிக்குறிப்பில் தெரிவிக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சட்டக் கட்டளைக்குரிய கண்ணியமான நடையுடன் மொழிபெயர்க்கப்பட்டுள்ளது. ஒருமை எபிரேயப் பயனாளிப் பெயர்கள் தமிழில் மரியாதை மற்றும் வகைப்பாட்டு ஒருமையை வெளிப்படுத்தும் வடிவில் வைக்கப்பட்டுள்ளன; வாசகத் தெளிவுக்காக இரண்டாம் நபர் மரியாதைப் பன்மை பயன்படுத்தப்பட்டுள்ளது.
