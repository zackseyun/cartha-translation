base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/026/015.yaml
  text: Look down from your holy dwelling[a], from heaven, and bless your people Israel and the land that you have given us, as you swore to our fathers, a land flowing with milk and honey.
translation:
  language: ta
  text: உமது பரிசுத்த உறைவிடத்திலிருந்து, வானத்திலிருந்து, கீழ்நோக்கிப் பார்த்து, உமது மக்களாகிய இஸ்ரவேலையும், நீர் எங்கள் தந்தையருக்குச் சத்தியம் செய்தபடியே எங்களுக்குக் கொடுத்த பாலும் தேனும் ஓடும் நாடான நிலத்தையும் ஆசீர்வதியும்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַשְׁקִיפָה
  choice: கீழே பார்த்து
  rationale: மேலிருந்து கவனமாக நோக்குதல் என்ற கட்டளைப் பொருளையும், தொடர்ந்து வரும் வானத்திலிருந்து என்ற இடக்குறிப்பையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: מִמְּעוֹן קָדְשְׁךָ
  choice: உமது பரிசுத்த உறைவிடத்திலிருந்து
  rationale: מָעוֹן என்பது தங்குமிடம் அல்லது உறைவிடம்; קֹדֶשׁ குறிக்கும் பரிசுத்தத் தன்மையையும் இச்சொற்றொடர் காக்கிறது.
- source_word: מִן הַשָּׁמַיִם
  choice: வானத்திலிருந்து
  rationale: எபிரெய வடிவம் பன்மையாக இருந்தாலும், இவ்விடச்சூழலில் தமிழில் ஒருமையான ‘வானம்’ இயல்பான சமமான சொல்.
- source_word: וּבָרֵךְ
  choice: ஆசீர்வதியும்
  rationale: ברך என்பதன் நேரடியான கட்டளைப் பொருளை, வேண்டுதலுக்கேற்ற மரியாதைமிக்க தமிழ் வடிவில் தருகிறது.
- source_word: עַמְּךָ אֶת יִשְׂרָאֵל
  choice: உமது மக்களாகிய இஸ்ரவேல்
  rationale: ‘உமது மக்கள்’ யார் என்பதை ‘இஸ்ரவேல்’ விளக்கும் எபிரெய இணைப்பமைப்பைத் தெளிவாகக் காக்கிறது.
- source_word: הָאֲדָמָה
  choice: நிலம்
  rationale: விவசாயத்திற்குரிய மண்/நிலம் என்ற நுணுக்கத்தைக் காட்டுவதோடு, பின்னர் வரும் אֶרֶץ என்பதற்கான ‘நாடு’ என்பதிலிருந்து சொல்வேறுபாட்டையும் காக்கிறது.
- source_word: אֲשֶׁר נָתַתָּה לָנוּ
  choice: நீர் எங்களுக்குக் கொடுத்த
  rationale: முடிவுற்ற தெய்வீகக் கொடையை எளிய, இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: כַּאֲשֶׁר נִשְׁבַּעְתָּ לַאֲבֹתֵינוּ
  choice: நீர் எங்கள் தந்தையருக்கு சத்தியம் செய்து வாக்களித்தபடி
  rationale: נשבע என்பதிலுள்ள உறுதிமொழி/ஆணைச் சத்தியத்தின் வலிமையை வெளிப்படுத்துகிறது; ‘தந்தையர்’ என்ற ஆண்பால் மூலவடிவத்தையும் காக்கிறது.
- source_word: אֶרֶץ זָבַת חָלָב וּדְבָשׁ
  choice: பாலும் தேனும் ஓடும் நாடு
  rationale: செழிப்பைக் குறிக்கும் எபிரெய உருவகத்தைச் சுருக்கமாகவும் தமிழில் புரியத்தக்க வகையிலும் காக்கிறது.
theological_decisions:
- issue: לַאֲבֹתֵינוּ என்ற உடன்படிக்கைச் சொற்றொடரின் மொழிபெயர்ப்பு
  choice: எங்கள் தந்தையருக்கு
  alternative: எங்கள் முன்னோர்களுக்கு
  rationale: எபிரெயச் சொல் நேரடியாக ‘தந்தையர்’ என்ற ஆண்பால் வடிவைக் கொண்டது; இங்கு முற்பிதாக்களைக் குறிக்கும் உடன்படிக்கைச் சூழலும் உள்ளது. பரந்த பொருளான ‘முன்னோர்’ அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீனத் தரமான, மரியாதைமிக்க தமிழ் பயன்படுத்தப்பட்டுள்ளது. இறைவனை நோக்கிய வேண்டுதலுக்காக ‘உமது’, ‘நீர்’, ‘ஆசீர்வதியும்’ ஆகிய உயர்மரியாதை வடிவங்கள் வைக்கப்பட்டுள்ளன. הָאֲדָמָה / אֶרֶץ வேறுபாடு முறையே ‘நிலம்’ / ‘நாடு’ என்று பாதுகாக்கப்பட்டுள்ளது.
