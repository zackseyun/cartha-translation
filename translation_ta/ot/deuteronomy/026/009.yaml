  text: וַ/יְבִאֵ֖/נוּ אֶל הַ/מָּק֣וֹם הַ/זֶּ֑ה וַ/יִּתֶּן לָ֨/נוּ֙ אֶת הָ/אָ֣רֶץ הַ/זֹּ֔את אֶ֛רֶץ זָבַ֥ת חָלָ֖ב וּ/דְבָֽשׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/026/009.yaml
  text: And he brought us to this place and gave us this land[b][a], a land flowing with milk and honey.
translation:
  language: ta
  text: அவர் எங்களை இந்த இடத்திற்குக் கொண்டுவந்து, பாலும் தேனும்[b] பெருக்கெடுத்து ஓடும் இந்த நாட்டை[a] எங்களுக்குக் கொடுத்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘பாலும் தேனும் மிகுதியாக விளையும் இந்த நாடு’; எபிரேய மரபுத்தொடர் செழிப்பையும் வளத்தையும் சித்தரிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: ‘தேன்’ என்பது சில சூழல்களில் தேனீத் தேனை மட்டுமல்லாமல், பேரீச்சம் பழப் பாகு போன்ற இனிப்புப் பாகையும் குறிக்கக்கூடும்.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְבִאֵנוּ
  choice: எங்களைக் கொண்டுவந்து
  rationale: בוא என்பதன் ஹிஃபில் வடிவம் காரணவினை இயக்கத்தைக் குறிக்கிறது; ‘கொண்டுவந்து’ என்பது தமிழில் இயல்பாகவும் அந்தப் பொருளைத் தெளிவாகவும் தருகிறது.
- source_word: אֶל הַמָּקוֹם הַזֶּה
  choice: இந்த இடத்திற்கு
  rationale: אֶל இலக்கை நோக்கிய இயக்கத்தையும், הַמָּקוֹם הַזֶּה ‘இந்த இடம்’ என்பதையும் குறிக்கின்றன.
- source_word: וַיִּתֶּן לָנוּ
  choice: எங்களுக்குக் கொடுத்தார்
  rationale: נתן உடன் வரும் ל பெறுநரைக் குறிக்கிறது; ‘எங்களுக்குக் கொடுத்தார்’ என்பது எளிமையான, நேரான தமிழ்.
- source_word: אֶת הָאָרֶץ הַזֹּאת
  choice: இந்த நாட்டை
  rationale: இங்கு אֶרֶץ இஸ்ரவேலருக்குக் கொடுக்கப்பட்ட குறிப்பிட்ட தேசப்பரப்பைக் குறிக்கிறது; நவீன தமிழில் ‘நாடு’ இந்தச் சூழலுக்கு இயல்பானது.
- source_word: אֶרֶץ זָבַת חָלָב וּדְבָשׁ
  choice: பாலும் தேனும் பெருக்கெடுத்து ஓடும் நாடு
  rationale: זָבַת என்பதன் ஓடும் உருவகத்தையும், செழிப்பு மற்றும் வளம் என்ற எபிரேய மரபுத்தொடரின் கருத்தையும் காக்கிறது.
- source_word: דְבָשׁ
  choice: தேன்
  rationale: דְבָשׁ பொதுவாகத் தேனைக் குறிக்கும்; சில சூழல்களில் பேரீச்சம் பழப் பாகு போன்ற இனிப்புப் பாகையும் உள்ளடக்கக்கூடும் என்பதால் அந்த வாய்ப்பு அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: முதல் நபர் வரலாற்று அறிக்கையில் தெய்வீக எழுவாய்
  choice: ‘அவர்’ என்ற பதிற்பெயரை வைத்திருத்தல்
  alternative: ‘யெகோவா’ அல்லது ‘ஆண்டவர்’ என்று வெளிப்படையாகப் பெயரிடுதல்
  rationale: இந்த வசனத்தின் எபிரேயத்தில் எழுவாய் பெயராகச் சொல்லப்படாமல் மூன்றாம் நபர் ஒருமை வினைகள் மட்டுமே உள்ளன; சுற்றியுள்ள உரையில் குறிப்பிடப்படும் தெய்வீக எழுவாயைத் தொடர்ந்தாலும், மூலத்தில் இல்லாத பெயரைச் சேர்க்காமல் ‘அவர்’ என்று மொழிபெயர்ப்பது உரையின் இணைப்பைக் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் எளிமையும் கண்ணியமும் காக்கப்பட்டுள்ளன. ‘பெருக்கெடுத்து ஓடும்’ என்பது மூல உருவகத்தை உயிரோட்டமாகத் தக்கவைக்கிறது. எல்லா அடிக்குறிப்பு குறிகளும் பிரதான உரையில் இடம்பெற்றுள்ளன.
