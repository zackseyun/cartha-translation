base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/026/011.yaml
  text: And you shall rejoice in all the good that Yahweh your God has given to you and to your household—you[a], and the Levite, and the sojourner who is among you.
translation:
  language: ta
  text: உன் கடவுளாகிய யாவே உனக்கும் உன் வீட்டாருக்கும் அளித்த எல்லா நன்மைகளைக் குறித்து நீயும், லேவியரும், உன்னிடையே குடியிருக்கும் அந்நியரும்[a] மகிழ வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘உன்னிடையே குடியிருக்கும் பிறநாட்டவர்.’ எபிரேயச் சொல் גֵּר, இஸ்ரவேலரல்லாதவராக இருந்தும் இஸ்ரவேலரிடையே குடியிருந்து அவர்களுடைய பாதுகாப்பின்கீழ் வாழ்ந்தவரைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׂמַחְתָּ
  choice: நீ மகிழ வேண்டும்
  rationale: அறிவுறுத்தல் சூழலில் இணைப்புடன் வரும் Qal நிறைவுவினை எதிர்காலக் கட்டளையின் வலிமையைக் கொண்டுள்ளது. ‘மகிழ வேண்டும்’ என்பது உணர்ச்சியையும் உடன்படிக்கைச் சார்ந்த பண்டிகை மகிழ்ச்சியையும் இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: בְּכָל הַטּוֹב
  choice: எல்லா நன்மைகளுக்காகவும்
  rationale: בְּ இங்கு பெற்ற ஆசீர்வாதங்களை முன்னிட்டு மகிழ்வதைக் குறிக்கிறது. சொற்சொல்லான ‘எல்லா நன்மையிலும்’ என்பதைக் காட்டிலும் காரணப் பொருளுடைய இவ்வடிவம் தமிழில் இயல்பாக உள்ளது; அதே நேரத்தில் הַטּוֹב என்பதன் மொத்த ஆசீர்வாதப் பொருளைக் காக்கிறது.
- source_word: אֲשֶׁר נָתַן לְךָ
  choice: உனக்குக் கொடுத்த
  rationale: எபிரேய உறவுத் தொடரையும், இரண்டாம் நபர் ஒருமை நோக்கிய கொடைப் பொருளையும் நேரடியாகக் காக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இது ஒரு பட்டத்திற்குப் பதிலாக எபிரேய இறைப்பெயர் יהוה-ஐ தமிழில் ஒலிபெயர்க்கிறது.
- source_word: אֱלֹהֶיךָ
  choice: உன் கடவுளாகிய
  rationale: உடன்படிக்கைச் சொற்றொடரிலுள்ள இரண்டாம் நபர் ஒருமை உரிமைத் தொடர்பைத் தெளிவாகக் காக்கிறது.
- source_word: וּלְבֵיתֶךָ
  choice: உன் வீட்டாருக்கும்
  rationale: בַּיִת இங்கு கட்டிடத்தை மட்டும் அல்லாமல் குடும்பத்தையும் வீட்டுக் குழுவையும் குறிக்கிறது; ‘வீட்டார்’ அந்த சமூகப் பொருளை இயல்பாகத் தருகிறது.
- source_word: אַתָּה
  choice: நீயும்
  rationale: எபிரேயத்தில் வலியுறுத்தலுக்காக வெளிப்படையாக உள்ள சுட்டுப்பெயர் பட்டியலின் தொடக்கத்தில் தக்கவைக்கப்படுகிறது.
- source_word: הַלֵּוִי
  choice: லேவியரும்
  rationale: லேவி கோத்திரத்தைச் சேர்ந்தவரைக் குறிக்கும் வழக்கமான துல்லியமான பெயர்ப்பு.
- source_word: הַגֵּר
  choice: குடியேறிய அந்நியரும்
  rationale: גֵּר என்பது இஸ்ரவேலரல்லாதவராக இருந்தும் அவர்களிடையே குடியிருந்து சமூகப் பாதுகாப்பைப் பெறுபவரைக் குறிக்கிறது. ‘குடியேறிய அந்நியர்’ அதன் குடியிருப்பு மற்றும் வெளிநாட்டவர் என்ற இரு கூறுகளையும் வாசிக்க எளிய தமிழில் தருகிறது.
- source_word: אֲשֶׁר בְּקִרְבֶּךָ
  choice: உன் நடுவில் வாழும்
  rationale: בְּקִרְבֶּךָ என்பதன் சமூக உட்சேர்க்கையை இயல்பான தமிழில் வெளிப்படுத்துகிறது; ‘வாழும்’ என்பது גֵּר என்பவரின் நிலையான குடியிருப்புத் தன்மையையும் சூழலுக்கேற்ப தெளிவாக்குகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரின் பெயர்ப்பு
  choice: யாவே
  alternative: யெகோவா
  rationale: மூலத்தில் நான்கு எழுத்து இறைப்பெயர் நேரடியாக உள்ளது. ‘யாவே’ என்பது அதை ஒரு பொதுப் பட்டமாக மாற்றாமல், பரவலாக ஏற்றுக்கொள்ளப்பட்ட ஒலியமைப்புக்கு அருகில் தமிழில் தருகிறது.
- issue: மகிழ்ச்சியில் பங்குபெறும் நபர்களுக்கும் ஒருமைக் கட்டளைக்கும் உள்ள தொடர்பு
  choice: ஒருமை ‘நீ மகிழ வேண்டும்’ என்பதைக் காத்து, பின்னர் பட்டியலில் உள்ள அனைவருக்கும் ‘மகிழ வேண்டும்’ என்பதைத் தெளிவாக மீண்டும் கூறுதல்
  alternative: ‘நீயும் லேவியரும் அந்நியரும் மகிழுங்கள்’ எனப் பன்மைக் கட்டளையாக்குதல்
  rationale: எபிரேய வினை இரண்டாம் நபர் ஆண்பால் ஒருமையில் உள்ளது; அதற்குப் பின்னர் ‘நீ, லேவியன், அந்நியன்’ என்ற விரிவான பட்டியல் வருகிறது. தமிழ் வாசகருக்கு பட்டியலின் பங்கேற்பைத் தெளிவாக்கியபோதும் மூலத்தின் ஒருமை அழைப்பை அழிக்காமல் இவ்வடிவம் காக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகருக்குப் புரியும் கண்ணியமான நடையைப் பயன்படுத்துகிறது. இரண்டாம் நபர் ஒருமை முழுவதும் காக்கப்பட்டுள்ளது. மூலத்தின் இறுதிப் பட்டியலும் அதன் வலியுறுத்தலும் தெளிவாக இருக்க நீண்ட கோடு பயன்படுத்தப்பட்டு, தமிழில் குழப்பம் தவிர்க்க வினைத்தொடர் மீண்டும் கூறப்பட்டுள்ளது.
