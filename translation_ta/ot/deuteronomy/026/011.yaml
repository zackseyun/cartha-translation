- from: உன் கடவுளாகிய யாவே உனக்கும் உன் வீட்டாருக்கும் கொடுத்த எல்லா நன்மைகளுக்காகவும் நீ மகிழ வேண்டும்—நீயும், லேவியரும், உன் நடுவில் வாழும் குடியேறிய அந்நியரும்[a] மகிழ வேண்டும்.
  to: உன் கடவுளாகிய யாவே உனக்கும் உன் வீட்டாருக்கும் அளித்த எல்லா நன்மைகளைக் குறித்து நீயும், லேவியரும், உன்னிடையே குடியிருக்கும் அந்நியரும்[a] மகிழ வேண்டும்.
  rationale: திருத்தம் மூலத்தின் ஒரே கட்டளைவினையைத் தக்கவைத்து, ‘நீ, லேவியர், உன்னிடையே குடியிருக்கும் அந்நியர்’ என்ற பட்டியலை அதில் பங்கேற்பவர்களாக இணைக்கிறது. “எல்லா நன்மைகளைக் குறித்து” என்பது בְּכָל הַטּוֹב என்பதன் மகிழ்ச்சிக்கான அடிப்படையை நவீன தமிழில் இயல்பாக வெளிப்படுத்துகிறது. அடிக்குறிப்பும் மூலத்தின் ஒருமை முகவரியைத் தக்கவைக்கிறது.
