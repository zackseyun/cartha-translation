source:
  edition: WLC
  text: וְ/לָקַ֧ח הַ/כֹּהֵ֛ן הַ/טֶּ֖נֶא מִ/יָּדֶ֑/ךָ וְ/הִ֨נִּיח֔/וֹ לִ/פְנֵ֕י מִזְבַּ֖ח יְהוָ֥ה אֱלֹהֶֽי/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/026/004.yaml
  text: Then the priest shall take the basket from your hand and set it before the altar of Yahweh your God[a].
translation:
  language: ta
  text: பிறகு ஆசாரியன் உன் கையிலிருந்து கூடையை வாங்கி, உன் கடவுளாகிய யாவேயின்[a] பலிபீடத்திற்கு முன் வைப்பான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரெயத்தில்: “YHWH”; மரபாக “ஆண்டவர்” என்று மொழிபெயர்க்கப்படுகிறது.'
    reason: தெய்வீகப் பெயரின் எபிரெய வடிவத்தையும் மரபான மாற்று மொழிபெயர்ப்பையும் தெரிவிக்கிறது.
lexical_decisions:
- source_word: וְלָקַח
  choice: பிறகு ... வாங்கி
  rationale: சடங்கு நடைமுறையின் அடுத்த கட்டத்தைக் குறிக்கும் தொடர்ச்சிப் பொருளை ‘பிறகு’ வெளிப்படுத்துகிறது; ஒருவரின் கையிலிருந்து பொருளைப் பெறும் செயலை இச்சூழலில் ‘வாங்கி’ இயல்பாகத் தெரிவிக்கிறது.
- source_word: הַכֹּהֵן
  choice: ஆசாரியன்
  rationale: சடங்கை நடத்தும் குறிப்பிட்ட குருவைக் குறிக்கும் தமிழில் நிலைபெற்ற வேதாகமச் சொல்.
- source_word: הַטֶּנֶא
  choice: கூடையை
  rationale: முதற்பலன்களை வைத்திருக்கும் பாத்திரத்தைக் குறிக்கும் טֶנֶא என்பதன் நேரான, பொதுவாகப் புரியும் பொருள்.
- source_word: מִיָּדֶךָ
  choice: உன் கையிலிருந்து
  rationale: இரண்டாம் நபர் ஒருமை உரையையும், கையிலிருந்து நேரடியாகப் பொருள் மாற்றப்படுகிற காட்சியையும் காக்கிறது.
- source_word: וְהִנִּיחוֹ
  choice: வைப்பான்
  rationale: Hiphil வடிவம் இங்கு கூடையை ஓர் இடத்தில் வைப்பதைக் குறிக்கிறது; பொருள் சுட்டுப்பெயர் தமிழில் வினையின் சூழலால் தெளிவாகிறது.
- source_word: לִפְנֵי
  choice: முன்
  rationale: பலிபீடத்தைச் சார்ந்த இடவியல் உறவைச் சுருக்கமாகவும் இயல்பாகவும் காட்டுகிறது.
- source_word: מִזְבַּח
  choice: பலிபீடம்
  rationale: பலியிடுவதற்கான altar என்பதற்கான வழக்கமான, துல்லியமான தமிழ் சொல்.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரான YHWH-ஐ ஒரு பட்டத்தால் மாற்றாமல், அதன் பரவலான ஒலிபெயர்ப்பைத் தமிழில் தருகிறது.
- source_word: אֱלֹהֶיךָ
  choice: உன் கடவுளாகிய
  rationale: இரண்டாம் நபர் ஒருமை உடைமைத் தொடர்பையும் உடன்படிக்கை சார்ந்த நேரடி உரையையும் காக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: ஆண்டவர்; யெகோவா
  rationale: எபிரெய உரையில் தனிப்பட்ட தெய்வீகப் பெயர் நேரடியாக உள்ளது. பட்டமான ‘ஆண்டவர்’ என்பதைப் பதிலிடாமல் பெயரை ஒலிபெயர்ப்பது மூலத்தின் வேறுபாட்டைக் காக்கிறது; ‘யாவே’ என்பது YHWH-க்கான ஏற்ற தமிழாக்கம்.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்கு எளிதாகவும் சடங்கு உரைக்கு ஏற்ற கண்ணியத்துடனும் வடிவமைக்கப்பட்டது. ஒருமை ‘உன்’ என்ற நேரடி அழைப்பு பாதுகாக்கப்பட்டுள்ளது.
