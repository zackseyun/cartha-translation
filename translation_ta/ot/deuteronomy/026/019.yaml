- from: அவர் படைத்த எல்லா இனங்களுக்கும் மேலாக உன்னை உயர்த்தி, நீ புகழும் நற்பெயரும்[a] மகிமையும்[b] பெறும்படியாகவும், அவர் சொன்னபடியே[c] உன் கடவுளாகிய யாவேவுக்குப் பரிசுத்த மக்களாக இருக்கும்படியாகவும் செய்வார்.
  to: அவர் படைத்த எல்லா இனங்களுக்கும் மேலாக உன்னை உயர்த்தி, புகழும் நற்பெயரும் மகிமையும் உனக்குக் கிடைக்கும்படியாகவும், உன் கடவுளாகிய யாவேவுக்குப் பரிசுத்த மக்களாக நீ இருக்கும்படியாகவும், அவர் சொன்னபடியே செய்வார்.
  rationale: மூலத்தின் இறுதி நிறைவு தொடரைத் தமிழ் வாக்கியத்தின் இறுதிக்கு மாற்றி, இரு இணை நோக்கத் தொடர்களையும் தெளிவாகச் சமநிலைப்படுத்தினேன். பொருளில் புதிய விளக்கம் சேர்க்கப்படவில்லை. அடிக்குறிப்பு a-வில் மாற்றுச் சொல் நேரடிப் பொருளான “பெயர்” எனச் சரிசெய்யப்பட்டது; “புகழ்பெற்ற பெயர்” என்பது மாற்று மொழிபெயர்ப்பாகத் தெளிவாக இல்லை. திருத்தப்பட்ட உரையில் அடிக்குறிப்பு குறிகள் முறையே நற்பெயர்[a], மகிமை[b], சொன்னபடியே[c] ஆகிய இடங்களில் இணைக்கப்பட வேண்டும்.
