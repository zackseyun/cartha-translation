  text: and to set you high above all the nations that he has made[a], for praise and for name and for beauty, and for you to be a holy people to Yahweh your God[c][b], as he has spoken.
translation:
  language: ta
  text: அவர் படைத்த எல்லா இனங்களுக்கும் மேலாக உன்னை உயர்த்தி, புகழும் நற்பெயரும் மகிமையும் உனக்குக் கிடைக்கும்படியாகவும், உன் கடவுளாகிய யாவேவுக்குப் பரிசுத்த மக்களாக நீ இருக்கும்படியாகவும், அவர் சொன்னபடியே செய்வார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּלְתִתְּךָ עֶלְיוֹן
  choice: உன்னை உயர்த்தி ... செய்வார்
  rationale: נתן உடன் வரும் עֶלְיוֹן இங்கு இஸ்ரவேலை மற்ற இனங்களுக்கு மேலான நிலையில் வைப்பதைக் குறிக்கிறது. தமிழில் இயல்பாக அமைய, வாக்கியத்தின் இறுதியில் வரும் ‘செய்வார்’ என்பதோடு இணைக்கப்பட்டது.
- source_word: עַל כָּל הַגּוֹיִם אֲשֶׁר עָשָׂה
  choice: அவர் படைத்த எல்லா இனங்களுக்கும் மேலாக
  rationale: גּוֹיִם என்பதற்கு இச்சூழலில் ‘இனங்கள்’ இயல்பானது; עָשָׂה என்ற பொதுவான வினை, அவரே அவற்றை உண்டாக்கியவர் என்ற பொருளில் ‘படைத்த’ என வழங்கப்பட்டது.
- source_word: לִתְהִלָּה
  choice: புகழும் ... பெறும்படியாக
  rationale: லாமேத் நோக்கம் அல்லது விளைவைக் குறிக்கிறது. ‘புகழ் பெறுதல்’ என்பது தமிழில் இயல்பாகவும் மூன்று பெயர்ச்சொற்களின் இணைப்பைத் தெளிவாகவும் தருகிறது.
- source_word: וּלְשֵׁם
  choice: நற்பெயரும்
  rationale: שֵׁם என்பதன் நேர்ப்பொருள் ‘பெயர்’; இச்சூழலில் அது புகழ்பெற்ற பெயர் அல்லது கீர்த்தியைக் குறிக்கிறது. ‘நற்பெயர்’ அந்த எபிரேய மரபுத்தொடரின் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: וּלְתִפְאָרֶת
  choice: மகிமையும்
  rationale: תִּפְאָרֶת அழகு, சிறப்பு, மாட்சிமை, மகிமை ஆகிய பொருட்களை ஏற்கக்கூடியது. இங்கு தேசத்தின் உயர்ந்த சிறப்பைக் குறிக்க ‘மகிமை’ தேர்ந்தெடுக்கப்பட்டது; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்பட்டது.
- source_word: וְלִהְיֹתְךָ עַם קָדוֹשׁ
  choice: பரிசுத்த மக்களாக இருக்கும்படியாகவும்
  rationale: இரண்டாவது நோக்கத் தொடரைத் தெளிவாக வைத்திருக்கிறது. ஒருமை பின்னொட்டு கூட்டாகிய இஸ்ரவேலை நோக்குவதால் ‘உன்னை’ என்பதுடன் ‘மக்களாக’ இயல்பாக இணைகிறது.
- source_word: לַיהוָה אֱלֹהֶיךָ
  choice: உன் கடவுளாகிய யாவேவுக்கு
  rationale: லாமேத் உறவு அல்லது உரிமை சார்ந்த நிலையைச் சுட்டுகிறது. יהוה என்ற தனிப்பெயர் தமிழில் ‘யாவே’ என ஒலிபெயர்க்கப்பட்டது.
- source_word: כַּאֲשֶׁר דִּבֵּר
  choice: அவர் சொன்னபடியே
  rationale: דבר என்பதன் அடிப்படைப் பொருள் ‘பேசுதல்/சொல்லுதல்.’ உடன்படிக்கைச் சூழலில் வாக்குறுதி உட்பொருளாக இருந்தாலும், மூலத்தில் வெளிப்படையாக இல்லாததை முதன்மை உரையில் சேர்க்கவில்லை.
theological_decisions:
- issue: இறுதித் தொடரை வெளிப்படையாக வாக்குறுதியாக்கலாமா
  choice: அவர் சொன்னபடியே
  alternative: அவர் வாக்களித்தபடியே
  rationale: எபிரேய வினை ‘சொன்னார்/பேசினார்’ என்பதே; உடன்படிக்கைச் சூழல் வாக்குறுதியை உணர்த்தினாலும், முதன்மை உரை அந்த விளக்கத்தை கட்டாயப்படுத்தாமல் மூலத்தின் சொற்பரப்பைக் காக்கிறது.
- issue: יהוה என்ற இறைப் பெயரின் மொழியாக்கம்
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: இங்கு தனிப்பெயரின் தன்மையைத் தெளிவாகக் காக்க ஒலிபெயர்ப்பு பயன்படுத்தப்பட்டது; பொதுப் பட்டப்பெயராக மாற்றப்படவில்லை.
- issue: புகழ், பெயர், மகிமை ஆகியவற்றின் பெறுநர்
  choice: நீ ... பெறும்படியாக
  alternative: புகழுக்காகவும் பெயருக்காகவும் மகிமைக்காகவும்
  rationale: தொடரமைப்பு இஸ்ரவேலை உயர்த்துவதன் நோக்கம் அல்லது விளைவைச் சுட்டுகிறது. தமிழில் இயல்புக்காக இஸ்ரவேல் அவற்றைப் பெறுவதாக வெளிப்படுத்தப்பட்டது; இருப்பினும் இவை கடவுளுக்குக் கொண்டுவரும் புகழையும் சூழல் மறைமுகமாக உணர்த்தக்கூடும்.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியும் ஆனால் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. எபிரேய ஒருமை முகவரியான இஸ்ரவேலைக் காக்க ‘உன்னை/உன்’ பயன்படுத்தப்பட்டு, அதன் கூட்டு அடையாளத்திற்காக ‘மக்களாக’ வைக்கப்பட்டது. நோக்கத்தைக் குறிக்கும் இணையான infinitive தொடர்கள் ‘...பெறும்படியாகவும் ... இருக்கும்படியாகவும்’ என்ற சமநிலை அமைப்பில் தரப்பட்டுள்ளன.
