  source_fidelity: மூல எபிரேயத்தின் இரு நோக்கத் தொடர்களும் ('உன்னை உயர்ந்த நிலையில் வைக்க' மற்றும் 'நீ பரிசுத்த மக்களாக இருக்க') வரைவில் பொதுவாகக் காக்கப்பட்டுள்ளன. ஆனால் இறுதி 'அவர் சொன்னபடியே' என்பது மூலத்தில் முழு வாக்கியத்தையும் நிறைவு செய்யும் தொடராக இருப்பதால், அதை வாக்கிய இறுதிக்குக் கொண்டுவருவது அமைப்பையும் பொருளோட்டத்தையும் நன்றாகக் காக்கும். புகழ்–பெயர்–மகிமை என்ற முத்தொடர் இஸ்ரவேலுக்கு உரிய நிலை/புகழைக் குறிக்கிறது; 'பெறும்படியாக' என்பதற்குப் பதில் 'உனக்குக் கிடைக்கும்படியாக' தெளிவான இயல்பான தமிழ்.
  naturalness: வரைவின் நடை பெரும்பாலும் நவீன நிலையான தமிழுக்கு ஏற்றது. திருத்தப்பட்ட வடிவம் நீளமான நோக்கத் தொடர்களைச் சமநிலைப்படுத்தி, 'அவர் சொன்னபடியே' என்பதை இயல்பான வாக்கிய நிறைவில் வைக்கிறது. ஒருமை முகவரியான 'உன்னை/உன்' மற்றும் கூட்டுப் பொருளான 'பரிசுத்த மக்களாக' என்பவை தொடர்ந்தும் பொருத்தமானவை.
  terminology: '''யாவே'' என்பது יהוה-வின் தனிப்பெயர்த் தன்மையைக் காக்கும் ஏற்ற ஒலிபெயர்ப்பு. ''நற்பெயர்'' שֵׁם என்பதன் இச்சூழல் பொருளான கீர்த்தி/புகழை இயல்பாகத் தருகிறது; அடிக்குறிப்பில் நேரடிப் பொருளான ''பெயர்'' தெளிவாகக் கொடுக்கப்படுகிறது. ''மகிமை'' தִפְאָרֶת என்பதற்கான ஏற்கத்தக்க முதன்மைச் சொல்; அதன் பிற சாத்தியப் பொருள்கள் அடிக்குறிப்பில் உள்ளன.'
