base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/012.yaml
  text: so that today he may establish you as a people for himself[a], and he himself may be your God, just as he spoke to you and as he swore to your fathers, to Abraham, to Isaac[b], and to Jacob.
translation:
  language: ta
  text: இன்று அவர் உன்னைத் தமக்கென்று ஒரு மக்களாக நிலைநிறுத்தவும், அவரே உனக்குக் கடவுளாக இருக்கவும்—அவர் உன்னிடம் கூறியபடியும், உன் தந்தையரான ஆபிரகாம், ஈசாக்கு, யாக்கோபு ஆகியோருக்குச் சத்தியம் செய்தபடியும்—[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இவ்வசனம் முந்தைய வசனத்தில் தொடங்கும் நோக்கத் தொடரின் தொடர்ச்சியாக உள்ளது; ஆகவே தமிழிலும் இது முழுமையான தனி வாக்கியமாக முடிவதில்லை.
    reason: contextual_note
lexical_decisions:
- source_word: לְמַעַן
  choice: —வும் ... —வும் இவ்வாறு செய்கிறார்
  rationale: முந்தைய வசனத்தின் உடன்படிக்கைக்குள் நுழையும் செயலின் நோக்கத்தை இவ்வசனம் தொடர்கிறது. தமிழில் இயல்பாக நோக்கத்தை வெளிப்படுத்த வினையெச்சத் தொடர் பயன்படுத்தப்பட்டது.
- source_word: הָקִים אֹתְךָ הַיּוֹם
  choice: இன்று அவர் உன்னை ... நிலைநிறுத்தவும்
  rationale: קום என்பதன் ஹிஃபில் வடிவம் உடன்படிக்கை நிலைக்குள் உறுதியாக நிறுவுதல் அல்லது நிலைநிறுத்துதல் என்ற பொருளைத் தருகிறது. ஒருமை முன்னிலைச் சுட்டான 'உன்னை' இஸ்ரவேலைக் கூட்டாகக் குறிக்கும் எபிரெய வடிவத்தைப் பேணுகிறது.
- source_word: לוֹ לְעָם
  choice: தமக்கென்று ஒரு மக்களாக
  rationale: எபிரெயச் சொற்றொடரின் 'அவருக்காக/அவருக்குரிய மக்களாக' என்ற உடன்படிக்கைச் சார்ந்த உடைமை மற்றும் உறவு நுணுக்கத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: וְהוּא יִהְיֶה לְךָ לֵאלֹהִים
  choice: அவரே உனக்குக் கடவுளாக இருக்கவும்
  rationale: וְהוּא தரும் வலியுறுத்தலை 'அவரே' பேணுகிறது; לְךָ לֵאלֹהִים என்பதன் உறவுசார் உடன்படிக்கை வடிவத்தை 'உனக்குக் கடவுளாக' நெருக்கமாகக் காட்டுகிறது.
- source_word: כַּאֲשֶׁר דִּבֶּר לָךְ
  choice: அவர் உன்னிடம் கூறியபடியும்
  rationale: דבר என்பதைக் 'வாக்குறுதி அளித்தார்' என்று விளக்கமாக மாற்றாமல், அதன் நேரடியான 'கூறினார்/பேசினார்' பொருளைப் பேணுகிறது.
- source_word: וְכַאֲשֶׁר נִשְׁבַּע
  choice: ஆணையிட்டபடியும்
  rationale: נשבע என்பது ஆணையிடுதல் அல்லது சத்தியம் செய்தல். தெய்வீக உறுதிமொழிச் சூழலில் 'ஆணையிட்டார்' என்பது இயல்பும் கண்ணியமும் உடைய தமிழ்.
- source_word: לַאֲבֹתֶיךָ
  choice: உன் தந்தையரான
  rationale: உடனே ஆபிரகாம், ஈசாக்கு, யாக்கோபு என ஆண் மூதாதையர் பெயரிடப்படுவதால், பொதுவான 'முன்னோர்' என்பதற்குப் பதில் பாலினத் துல்லியத்தைப் பேணுகிறது.
- source_word: לְאַבְרָהָם לְיִצְחָק וּלְיַעֲקֹב
  choice: ஆபிரகாமுக்கும் ஈசாக்குக்கும் யாக்கோபுக்கும்
  rationale: ஒவ்வொரு பெயருக்கும் முன் வரும் எபிரெய முன்னிடைச்சொல்லைத் தமிழ் வேற்றுமை உருபின் மீளுரைப்பால் பேணி, வசனத்தின் சீரான மரியாதை நடையைத் தக்கவைக்கிறது.
theological_decisions:
- issue: உடன்படிக்கைச் சூத்திரத்தின் சொற்கள்
  choice: தமக்கென்று ஒரு மக்களாக ... உனக்குக் கடவுளாக
  alternative: தமது மக்களாக ... உன் கடவுளாக
  rationale: தேர்ந்த வடிவம் לוֹ לְעָם மற்றும் לְךָ לֵאלֹהִים ஆகியவற்றின் 'அவருக்காக ஒரு மக்கள் / உனக்குக் கடவுள்' என்ற சமச்சீரான உறவமைப்பை நெருக்கமாகப் பேணுகிறது; அதை வெறும் உடைமை மொழியாகச் சுருக்கவில்லை.
- issue: לַאֲבֹתֶיךָ என்பதின் பாலினக் குறிப்பு
  choice: உன் தந்தையரான
  alternative: உன் முன்னோர்களான
  rationale: பெயரிடப்பட்டவர்கள் ஆபிரகாம், ஈசாக்கு, யாக்கோபு என்பதால், இங்கு குறிப்பிட்ட ஆண் மூதாதையரையே உரை குறிக்கிறது.
- issue: לְמַעַן என்பதின் நோக்கம்/விளைவு நுணுக்கம்
  choice: நோக்கைச் சுட்டும் —வும் ... இவ்வாறு செய்கிறார்
  alternative: அதனால் ... நிலைநிறுத்துகிறார்
  rationale: לְמַעַן நோக்கையும் எதிர்பார்க்கப்படும் விளைவையும் கொண்டிருக்கலாம். இங்கு முந்தைய வசனத்துடன் தொடரும் நோக்குச் சார்பை முன்னிறுத்தினாலும், செயல் இவ்வசனத்துக்குள் தனித்து இருப்பதாகக் காட்டாமல் இணைப்பை வெளிப்படுத்துகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் நடை. 'தமக்கென்று', 'அவரே' ஆகியவை உடன்படிக்கை உறவையும் எபிரெய வலியுறுத்தலையும் பேணுகின்றன. ஒருமை 'உன்னை/உனக்கு' என்பது இஸ்ரவேலைக் கூட்டாக அணைக்கும் மூலமொழி வடிவத்தைத் தக்கவைக்கிறது.
