revisions:
- from: இன்று அவர் உன்னைத் தமக்கென்று ஒரு மக்களாக நிலைநிறுத்தவும், அவர் உன்னிடம் கூறியபடியும் உன் தந்தையரான ஆபிரகாமுக்கும் ஈசாக்குக்கும் யாக்கோபுக்கும் ஆணையிட்டபடியும், அவரே உனக்குக் கடவுளாக இருக்கவும் இவ்வாறு செய்கிறார்.[a]
  to: இன்று அவர் உன்னைத் தமக்கென்று ஒரு மக்களாக நிலைநிறுத்தவும், அவரே உனக்குக் கடவுளாக இருக்கவும்—அவர் உன்னிடம் கூறியபடியும், உன் தந்தையரான ஆபிரகாம், ஈசாக்கு, யாக்கோபு ஆகியோருக்குச் சத்தியம் செய்தபடியும்—[a]
  rationale: நִשְׁבַּע-க்கான தவறான ‘ஆணையிட்ட’ என்பதற்கு ‘சத்தியம் செய்த’ எனத் திருத்தப்பட்டுள்ளது. மூலத்தின் நோக்கத் தொடரைத் தக்கவைக்க, சேர்க்கப்பட்ட “இவ்வாறு செய்கிறார்” நீக்கப்பட்டு, முந்தைய வசனத்துடனான இலக்கணத் தொடர்பை விளக்கும் குறிப்பு வைக்கப்பட்டுள்ளது. ‘கூறினார்’ என்பதன் பெறுநராக ‘உன்னை’யும், ‘சத்தியம் செய்தார்’ என்பதன் பெறுநர்களாக தந்தையரையும் வெளிப்படையாக அமைத்துள்ளோம்.
