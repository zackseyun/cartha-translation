  text: לֹא יֹאבֶ֣ה יְהוָה֮ סְלֹ֣חַֽ ל/וֹ֒ כִּ֣י אָ֠ז יֶעְשַׁ֨ן אַף יְהוָ֤ה וְ/קִנְאָת/וֹ֙ בָּ/אִ֣ישׁ הַ/ה֔וּא וְ/רָ֤בְצָה בּ/וֹ֙ כָּל הָ֣/אָלָ֔ה הַ/כְּתוּבָ֖ה בַּ/סֵּ֣פֶר הַ/זֶּ֑ה וּ/מָחָ֤ה יְהוָה֙ אֶת שְׁמ֔/וֹ מִ/תַּ֖חַת הַ/שָּׁמָֽיִם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/019.yaml
  text: Yahweh will not be willing to forgive him[a], for then the anger of Yahweh and his jealousy will burn against that man, and every curse written in this book will settle on him, and Yahweh will blot out his name from under heaven.
translation:
  language: ta
  text: யாவே அவனை மன்னிக்க மனங்கொள்ளமாட்டார்; ஏனெனில், அப்போது யாவேயின் கோபமும் அவருடைய பொறாமையும் அந்த மனிதனுக்கு எதிராகக் கொழுந்துவிட்டு எரியும். இந்தப் புத்தகத்தில் எழுதப்பட்டுள்ள சாபமெல்லாம்[a] அவன்மேல் வந்து தங்கும்; யாவே அவனுடைய பெயரை வானத்தின்கீழிருந்து அழித்துவிடுவார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘உடன்படிக்கை ஆணையுடன் இணைந்த சாபம்.’ எபிரெயச் சொல் பொதுவான சாபத்தை மட்டுமல்லாமல், உடன்படிக்கை ஆணையின் சூழலில் உரைக்கப்படும் சாபத்தையும் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֹאבֶה
  choice: மனங்கொள்ளமாட்டார்
  rationale: אבה என்பது இயலாமையை அல்ல, விருப்பம் அல்லது சம்மதத்தைச் சுட்டுகிறது. ‘மன்னிக்க மனங்கொள்ளமாட்டார்’ என்பது அந்த மனவுறுதியை இயல்பான தமிழில் காக்கிறது.
- source_word: סְלֹחַ לוֹ
  choice: அவனை மன்னிக்க
  rationale: סלח உடன்படிக்கைச் சூழலில் மன்னித்தல் அல்லது பொறுத்தருளுதல் என்று பொருள்படும்; இங்கு ‘மன்னிக்க’ தெளிவான நவீனத் தமிழ்.
- source_word: כִּי אָז
  choice: அப்போது
  rationale: இந்தச் சொற்றொடர் காரண-விளக்கத் தொடர்போடு அடுத்து நிகழும் விளைவையும் அறிமுகப்படுத்துகிறது; தமிழில் ‘அப்போது’ அந்தத் தொடர்ச்சியை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: יֶעְשַׁן אַף יְהוָה
  choice: யாவேயின் கோபம் ... கொழுந்துவிட்டு எரியும்
  rationale: எபிரெய உருவகம் கோபம் புகைவதை நேரடியாகக் கூறுகிறது. தமிழில் ‘கோபம் புகையும்’ இயல்பற்றதாக இருப்பதால், புகை எழும் தீவிரக் கோபத்தின் படிமத்தை ‘கொழுந்துவிட்டு எரியும்’ காக்கிறது.
- source_word: קִנְאָתוֹ
  choice: அவருடைய பொறாமை
  rationale: קנאה இங்கு உடன்படிக்கையைப் பாதுகாக்கும் பொறாமைமிக்க தீவிரத்தைக் குறிக்கிறது. ‘பொறாமை’ நேரடியான இணைச்சொல்; ‘வைராக்கியம்’ என மாற்றி அதன் பதற்றத்தைத் தணிக்கவில்லை.
- source_word: בָּאִישׁ הַהוּא
  choice: அந்த மனிதனுக்கு எதிராக
  rationale: ஆண்பால் ஒருமையை ‘அந்த மனிதன்’ காக்கிறது; கோபத்தின் இலக்கை ב குறிப்பதால் ‘எதிராக’ இயல்பான தமிழ்.
- source_word: וְרָבְצָה בוֹ
  choice: அவன்மேல் தங்கும்
  rationale: רבץ என்பதன் அடிப்படைப் பொருள் படுத்தல் அல்லது பதிந்து கிடத்தல். சாபம் ஒருவர்மேல் வந்து நிலைத்திருக்கும் படிமத்தை ‘தங்கும்’ தெளிவாகக் காட்டுகிறது.
- source_word: כָּל הָאָלָה
  choice: சாபங்கள் அனைத்தும்
  rationale: ஆலா என்பது உடன்படிக்கை ஆணையுடன் தொடர்புடைய சாபத்தைக் குறிக்கலாம். முதன்மை உரையில் வாசிப்புக்கு இயல்பான ‘சாபங்கள் அனைத்தும்’ பயன்படுத்தப்பட்டு, ஆணைச் சாப நுணுக்கம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: הַכְּתוּבָה בַּסֵּפֶר הַזֶּה
  choice: இந்தப் புத்தகத்தில் எழுதப்பட்டுள்ள
  rationale: סֵפֶר என்பது புத்தகம் அல்லது சுருள் எனப் பொருள்படலாம். சூழலில் ‘புத்தகம்’ நவீன வாசகருக்கு இயல்பானது; எழுதப்பட்டிருக்கும் நிலையை ‘எழுதப்பட்டுள்ள’ காக்கிறது.
- source_word: וּמָחָה ... אֶת שְׁמוֹ
  choice: அவனுடைய பெயரை ... அழித்துவிடுவார்
  rationale: பெயரைத் துடைத்தழித்தல் என்பது நினைவு அல்லது சந்ததியை முற்றாக நீக்கும் எபிரெய மரபுத்தொடர். ‘பெயரை அழித்துவிடுவார்’ தமிழில் அதன் தீவிரத்தைத் தெளிவாகத் தருகிறது.
- source_word: מִתַּחַת הַשָּׁמָיִם
  choice: வானத்தின் கீழிருந்து
  rationale: இது பூமியிலிருந்து முற்றாக அகற்றப்படுதலைக் குறிக்கும் நிலையான எபிரெய சொற்றொடர்; ‘வானத்தின் கீழிருந்து’ அதன் வடிவத்தையும் வலிமையையும் காக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரான நான்கு எழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் வழக்கமான ஒலிபெயர்ப்பான ‘யாவே’ என வழங்குகிறது.
theological_decisions:
- issue: மனிதப் பண்பில் வர்ணிக்கப்படும் தெய்வீகக் கோபம்
  choice: ‘கோபமும் ... பொறாமையும் ... கொழுந்துவிட்டு எரியும்’ என்று தீ மற்றும் புகை சார்ந்த வலிமையான படிமத்தைத் தக்கவைத்தல்
  alternative: ‘யாவே மிகவும் கோபப்படுவார்’ என்று பொதுமைப்படுத்துதல் அல்லது ‘கோபம் புகையும்’ என்று சொல்லுக்குச் சொல் மொழிபெயர்த்தல்
  rationale: மூலத்தின் தீவிரமான உருவகத்தைத் தணிக்காமல், அதேவேளை நவீனத் தமிழில் இயல்பற்ற சொற்றொடரைத் தவிர்க்கிறது; கடவுளின் உணர்ச்சிகளைக் குறித்து உரை சொல்வதற்கு அப்பாற்பட்ட கோட்பாட்டையும் சேர்க்கவில்லை.
- issue: ஆண்பால் ஒருமைக் குறிப்பு
  choice: ‘அந்த மனிதன்’
  alternative: ‘அந்த நபர்’
  rationale: הָאִישׁ הַהוּא இலக்கண ரீதியாக ஆண்பால் ஒருமை; உடன்படிக்கையை மீறும் தனிநபரைச் சுட்டும் இந்த வடிவத்தைப் பாலினநடுநிலையாக்காமல் காக்கிறது.
- issue: உடன்படிக்கைச் சாபச் சொல்
  choice: முதன்மை உரையில் ‘சாபங்கள் அனைத்தும்’; ஆணைச் சாப நுணுக்கம் அடிக்குறிப்பில்
  alternative: ‘ஆணையிட்டுச் சொல்லப்பட்ட சாபம் முழுவதும்’
  rationale: உரை உடனடியாகப் புரியும்படி இருக்கிறது; அதே சமயம் אָלָה என்பதன் உடன்படிக்கை ஆணைச் சூழலை அடிக்குறிப்பு பாதுகாக்கிறது.
- issue: மன்னிக்காதிருப்பதின் மனவிருப்பு சார்ந்த தன்மை
  choice: ‘மன்னிக்க மனங்கொள்ளமாட்டார்’
  alternative: ‘மன்னிக்கமாட்டார்’
  rationale: יֹאבֶה என்பது வெறும் எதிர்கால மறுப்பை விட விருப்பம் அல்லது சம்மதமின்மையை வலியுறுத்துகிறது; மொழிபெயர்ப்பு இந்தத் தெய்வீகத் தீர்மானத்தின் மனவுறுதியைத் தக்கவைக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகருக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘மனங்கொள்ளமாட்டார்’ என்பது சற்றே உயர்ந்தாலும் எளிதில் புரியும் வழக்கு; மூலத்திலுள்ள விருப்பமின்மையைச் சுருக்காமல் காக்கிறது. ‘கொழுந்துவிட்டு எரியும்’ இயல்பான தமிழில் மூலத்தின் புகை/தீக் கோபப் படிமத்தைப் பாதுகாக்கிறது. பிரதிப்பெயர்கள் மரியாதை ஒருமையில் அமைந்துள்ளன; ஆண்பால் தனிநபர் குறிப்பு மட்டும் மூலத்திற்கு ஏற்பத் தெளிவாக வைக்கப்பட்டுள்ளது.
