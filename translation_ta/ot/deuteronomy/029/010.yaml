  yaml_path: translation/ot/deuteronomy/029/010.yaml
  text: your little ones[a], your wives, and the sojourner who is in the midst of your camp, from the one who chops your wood to the one who draws your water[b],
translation:
  language: ta
  text: உங்கள் சிறு பிள்ளைகள்[a], உங்கள் மனைவிகள், உங்கள் முகாமில் தங்கியிருக்கும் அந்நியர்[b], உங்கள் விறகை வெட்டுபவர் முதல் உங்கள் தண்ணீரை எடுப்பவர் வரை,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘உங்கள் பிள்ளைகள்.’ எபிரெயச் சொல் טַף குறிப்பாகச் சிறு பிள்ளைகளையோ சார்ந்திருப்போரையோ குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘உங்களிடையே குடியிருந்து வாழும் அந்நிய நாட்டவர்.’ எபிரெயச் சொல் גֵּר சமூகத்துக்குள் வசிக்கும் அந்நியரைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: טַפְּכֶם
  choice: உங்கள் சிறு பிள்ளைகள்
  rationale: טַף என்பது பொதுவாகப் பிள்ளைகள் அனைவரையும் மட்டும் அல்லாமல், குறிப்பாகச் சிறு பிள்ளைகளையும் சார்ந்திருப்போரையும் குறிக்கிறது. ‘சிறு பிள்ளைகள்’ அதன் தெளிவான, இயல்பான பொருளைக் காக்கிறது.
- source_word: נְשֵׁיכֶם
  choice: உங்கள் மனைவிகள்
  rationale: உடன்படிக்கைக் கூட்டத்தின் இந்தச் சூழலில், இரண்டாம் நபர் உடைமை விகுதியுடன் வரும் נָשִׁים என்பதற்கு ‘மனைவிகள்’ என்பது இயல்பான உறவுமுறைப் பொருள்.
- source_word: וְגֵרְךָ
  choice: அந்நியக் குடியிருப்பாளர்
  rationale: גֵּר என்பது வழிப்போக்கரை அல்ல, சமூகத்தினரிடையே தங்கி வாழும் அந்நிய நாட்டவரைக் குறிக்கிறது. ‘அந்நியக் குடியிருப்பாளர்’ அதன் குடியிருப்பு மற்றும் சமூக-சட்ட நிலையைத் தெளிவாகத் தெரிவிக்கிறது; எபிரெய ஒருமையும் காக்கப்படுகிறது.
- source_word: אֲשֶׁר בְּקֶרֶב מַחֲנֶיךָ
  choice: உங்கள் முகாமின் நடுவில் வசிக்கும்
  rationale: இந்தத் தொடர் அந்நியக் குடியிருப்பாளரை இஸ்ரவேலரின் முகாமுக்குள் வாழ்பவராகக் காட்டுகிறது. ‘நடுவில்’ இடவியல் படிமத்தையும், ‘வசிக்கும்’ நிலையான குடியிருப்பையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: מֵחֹטֵב עֵצֶיךָ
  choice: உங்கள் விறகை வெட்டுகிறவர் முதல்
  rationale: מִן ... עַד என்பது ஒரு முனையிலிருந்து மறுமுனைவரை உள்ள வரம்பைக் குறிக்கிறது. பங்கேற்புப் பெயரின் செயற்பாட்டு வலிமையை ‘வெட்டுகிறவர்’ காக்கிறது.
- source_word: עַד שֹׁאֵב מֵימֶיךָ
  choice: உங்கள் தண்ணீரை எடுக்கிறவர் வரை
  rationale: שֹׁאֵב என்பது தண்ணீர் எடுக்கும் செயலைக் குறிக்கும் பங்கேற்புப் பெயர். ‘எடுக்கிறவர்’ என்பது நவீனத் தமிழில் இயல்பாகவும் விறகு வெட்டும் பணியுடன் இணையான உழைப்புப் பணியாகவும் உள்ளது; ‘வரை’ עַד-ஐ வெளிப்படுத்துகிறது.
theological_decisions:
- issue: உடன்படிக்கைக் கூட்டத்தின் சமூக வரம்பு
  choice: அந்நியக் குடியிருப்பாளரையும் அன்றாட உடல் உழைப்புப் பணிகளைச் செய்வோரையும் உட்பட சமூகத்தின் பல்வேறு நிலைகளில் உள்ளவர்கள் பட்டியலில் வெளிப்படையாகச் சேர்க்கப்படுகிறார்கள்.
  alternative: இந்தப் பட்டியல் இஸ்ரவேலரை மட்டும் குறிக்கிறது; அல்லது விறகு வெட்டுவோரும் தண்ணீர் எடுப்போரும் உருவக வகுப்புகள் மட்டுமே.
  rationale: எபிரெய உரையின் நேரடிப் பொருள், கூட்டத்தில் நிற்போரின் பரந்த சமூக வரம்பைக் காட்டும் உள்ளடக்கிய பட்டியலாகும். மொழிபெயர்ப்பு இதைச் சுருக்காமலும் தனிப்பட்ட கோட்பாட்டைச் சேர்க்காமலும் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் பட்டியல் அமைப்பும் ‘முதல் ... வரை’ என்ற வரம்புச் சொல்லாட்சியும் காக்கப்பட்டுள்ளன. வசனம் அடுத்த வசனத்துடன் தொடர்வதால் இறுதியில் காற்புள்ளி வைக்கப்பட்டுள்ளது.
