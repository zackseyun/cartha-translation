base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/013.yaml
  text: And it is not with you alone that I am making this covenant and this oath[b][a],
translation:
  language: ta
  text: உங்களோடு மட்டும் அல்ல, நான் இந்த உடன்படிக்கையையும் இந்தச் சத்தியப்பிரமாணத்தையும்[a][b] ஏற்படுத்துகிறேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொற்பொருளாக, “இந்த உடன்படிக்கையை வெட்டுகிறேன்.” இது உடன்படிக்கையை ஏற்படுத்துவதைக் குறிக்கும் எபிரெய மரபுத்தொடர்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “இந்தச் சாபத்தையும்.” எபிரெயச் சொல் சத்தியப்பிரமாணத்தையோ, அந்தச் சத்தியப்பிரமாணத்தோடு பிணைந்த சாபத்தையோ குறிக்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: וְלֹא אִתְּכֶם לְבַדְּכֶם
  choice: உங்களோடு மட்டும் அல்ல
  rationale: எபிரெய மொழியின் இணைப்பையும் மறுப்பையும் தனித்தன்மை குறிக்கும் பொருளையும் இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது; உடன்படிக்கை இப்போது முன்னிலையில் இருப்பவர்களோடு மட்டும் செய்யப்படுவதில்லை என்பதைக் காக்கிறது.
- source_word: אָנֹכִי
  choice: நான்
  rationale: தனிப்பட்ட சுட்டுப்பெயரின் வலியுறுத்தலைத் தமிழில் வெளிப்படையான எழுவாய் போதுமான அளவு தருகிறது.
- source_word: כֹּרֵת
  choice: ஏற்படுத்துகிறேன்
  rationale: எபிரெயத்தில் சொற்பொருளாக ‘வெட்டுகிறேன்’ என்றாலும், ‘உடன்படிக்கையை வெட்டுதல்’ என்பது உடன்படிக்கை செய்தலைக் குறிக்கும் மரபுத்தொடர். ‘ஏற்படுத்துகிறேன்’ என்பது தமிழில் இயல்பாகவும் சட்ட-உறவு சார்ந்த கருத்துக்கு ஏற்றவாறும் உள்ளது.
- source_word: הַבְּרִית הַזֹּאת
  choice: இந்த உடன்படிக்கையை
  rationale: בְּרִית என்பதன் சட்ட, உறவு, இறையியல் நிறையை ‘உடன்படிக்கை’ தெளிவாகத் தக்கவைக்கிறது.
- source_word: וְאֶת הָאָלָה הַזֹּאת
  choice: இந்த ஆணையையும்
  rationale: אָלָה என்பது சாபத் தண்டனையை உள்ளடக்கிய உறுதிமொழி அல்லது ஆணையைக் குறிக்கலாம். பிரதான உரையில் ‘ஆணை’ அந்தச் சத்தியப்பிரமாண அம்சத்தை இயல்பான தமிழில் தருகிறது; ‘சாபம்’ என்ற சாத்தியம் அடிக்குறிப்பில் காக்கப்படுகிறது.
theological_decisions:
- issue: உடன்படிக்கைச் சூழலில் אָלָה என்பதன் மொழிபெயர்ப்பு
  choice: ஆணை
  alternative: சாபம்
  rationale: இந்தச் சொல் உடன்படிக்கையை உறுதிப்படுத்தும் ஆணையையும், அதை மீறுவதோடு பிணைந்த சாபத் தண்டனையையும் குறிக்கக்கூடும். பிரதான உரை ஆணை அம்சத்தை முன்வைக்கிறது; சாபம் என்ற உண்மையான மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன தரநிலைத் தமிழ்; பொதுவாசகர்களுக்குப் புரியும் dignified நடை. ‘உடன்படிக்கை’ என்ற நிலைபெற்ற சொல் தக்கவைக்கப்பட்டுள்ளது. எபிரெய மரபுத்தொடர் இயல்பான தமிழாக்கமாக வழங்கப்பட்டு, சொற்பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது. எல்லா அடிக்குறிப்பு குறிகளும் பிரதான உரையில் இடம்பெற்றுள்ளன.
