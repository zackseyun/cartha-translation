revisions:
- from: உங்களோடு மட்டும் அல்ல, நான் இந்த உடன்படிக்கையையும் இந்த ஆணையையும்[a][b] ஏற்படுத்துகிறேன்.
  to: உங்களோடு மட்டும் அல்ல, நான் இந்த உடன்படிக்கையையும் இந்தச் சத்தியப்பிரமாணத்தையும்[a][b] ஏற்படுத்துகிறேன்.
  rationale: The revision changes only the rendering of אָלָה from the potentially misleading ‘ஆணை’ (‘command/order’) to ‘சத்தியப்பிரமாணம்’ (‘oath’). It retains the covenantal curse alternative in the footnote and preserves the Hebrew idiom note and all anchors.
