base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/009.yaml
  text: 'You are standing today[a], all of you, before Yahweh your God: your heads, your tribes, your elders[b], and your officers—all the men of Israel.'
translation:
  language: ta
  text: 'இன்று நீங்கள் எல்லாரும் உங்கள் கடவுளாகிய யாவேக்கு முன்பாக நிற்கிறீர்கள்: உங்கள் தலைவர்கள்[a], உங்கள் கோத்திரங்கள், உங்கள் மூப்பர்கள், உங்கள் அதிகாரிகள், இஸ்ரவேலைச் சேர்ந்த ஒவ்வொரு ஆணும்[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “உங்கள் தலைவர்கள்” என்பதற்கான எபிரெயச் சொல் சொல்லுக்குச் சொல் “உங்கள் தலைகள்” என்று பொருள்படும். இதையும் அடுத்த சொல்லையும் இணைத்து, “உங்கள் கோத்திரத் தலைவர்கள்” என்றும் புரிந்துகொள்ளலாம்.
    reason: alternative_reading
  - marker: b
    text: எபிரெயத்தில் சொல்லுக்குச் சொல் “இஸ்ரவேலின் ஒவ்வொரு ஆணும்”; இது ஒவ்வொரு ஆணையும் தனித்தனியாகக் குறிக்கும் பகிர்வுப் பொருளுடைய தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: נִצָּבִים
  choice: நிற்கிறீர்கள்
  rationale: நிபால் வினையெச்சத்தின் நிகழ்நிலை, காட்சியை அமைக்கும் தன்மையை இயல்பான தமிழில் வெளிப்படுத்துகிறது; உடன்படிக்கைச் சபை கடவுளின் முன்னிலையில் கூடி நிற்பதைச் சொல்கிறது.
- source_word: הַיּוֹם
  choice: இன்று
  rationale: கால வலியுறுத்தலைத் தெளிவாகவும் இயல்பாகவும் காக்கிறது.
- source_word: כֻּלְּכֶם
  choice: நீங்கள் எல்லாரும்
  rationale: இரண்டாம் நபர் பன்மையுடன் வரும் முழுமையைக் குறிக்கும் சொல்லின் கூட்டுத்தன்மையையும் வலியுறுத்தலையும் நேரடியாகத் தருகிறது.
- source_word: לִפְנֵי
  choice: முன்பாக
  rationale: கடவுளின் முன்னிலையில் நிற்பதைக் குறிக்கும் உடன்படிக்கைச் சூழலுக்கு ஏற்ற சுருக்கமான தமிழ் வடிவம்.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய தனிப்பெயரான நான்கெழுத்து இறைப்பெயரை ஒரு பட்டத்தால் மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: אֱלֹהֵיכֶם
  choice: உங்கள் கடவுளாகிய
  rationale: உடைமைப் பின்னொட்டையும் யாவேவுடன் உள்ள இணைப்பையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: רָאשֵׁיכֶם
  choice: உங்கள் தலைவர்கள்
  rationale: சொல்லுக்குச் சொல் 'உங்கள் தலைகள்' என்றாலும், இங்கு சமூகத் தலைமைப் பொறுப்பாளர்களைக் குறிக்கும் உருவகப் பயன்பாட்டை இயல்பான தமிழில் தருகிறது; மூலத்தின் மாற்று கட்டமைப்பு அடிக்குறிப்பில் காக்கப்படுகிறது.
- source_word: שִׁבְטֵיכֶם
  choice: உங்கள் கோத்திரங்கள்
  rationale: மசோரா உரையின் பட்டியல் அமைப்பின்படி சொல்லின் நேரடியான பொருளான 'கோத்திரங்கள்' என்பதைக் காக்கிறது; 'கோத்திரத் தலைவர்கள்' என்ற மாற்று வாசிப்பு அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: זִקְנֵיכֶם
  choice: உங்கள் மூப்பர்கள்
  rationale: இஸ்ரவேலின் சமூகத் தலைமைப் பதவியைக் குறிக்கும் வழக்கமான, தெளிவான தமிழ் சொல்.
- source_word: שֹׁטְרֵיכֶם
  choice: உங்கள் அதிகாரிகள்
  rationale: உபாகம நிர்வாகச் சூழலில் பொறுப்பு வகிக்கும் அலுவலர்களைக் குறிக்கிறது; அவர்களின் குறிப்பிட்ட பணியை ஆதாரமின்றி மிகைப்படுத்தவில்லை.
- source_word: כֹּל אִישׁ יִשְׂרָאֵל
  choice: இஸ்ரவேலைச் சேர்ந்த ஒவ்வொரு ஆணும்
  rationale: ஒருமையில் அமைந்த பகிர்வுப் பொருளையும் אִישׁ என்பதன் ஆண்பால் குறிப்பையும் காக்கிறது; இயல்பான தமிழில் ஒவ்வொரு இஸ்ரவேலிய ஆணையும் குறிக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் பட்டம் அல்ல, கடவுளின் தனிப்பெயரே உள்ளது; ஆகவே அதை மறைக்காமல் ஒலிபெயர்க்கிறது.
- issue: כֹּל אִישׁ יִשְׂרָאֵל என்பதிலுள்ள பாலினக் குறிப்பு
  choice: இஸ்ரவேலைச் சேர்ந்த ஒவ்வொரு ஆணும்
  alternative: இஸ்ரவேலர் அனைவரும்
  rationale: אִישׁ என்ற ஆண்பால் பெயர்ச்சொல்லை பாலினப் பொதுமைப்படுத்தாமல் காக்கிறது; அடுத்த வசனத்தில் பரந்த சபைக் கூட்டம் விவரிக்கப்படுவது இவ்வசனத்தின் சொல் வடிவத்தை மாற்றுவதற்கான காரணமாக எடுத்துக்கொள்ளப்படவில்லை.
- issue: רָאשֵׁיכֶם שִׁבְטֵיכֶם என்ற தொடரின் கட்டமைப்பு
  choice: உங்கள் தலைவர்கள், உங்கள் கோத்திரங்கள்
  alternative: உங்கள் கோத்திரத் தலைவர்கள்
  rationale: மசோரா பிரிப்புக்கும் பட்டியல் அமைப்புக்கும் ஏற்ப இரண்டையும் தனித்தனி உறுப்புகளாக முதன்மை உரையில் வைத்திருக்கிறது; எபிரெய தொடரில் சாத்தியமான நெருங்கிய இணைப்பு அடிக்குறிப்பில் வெளிப்படையாகத் தரப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் மரியாதையும் பொதுமக்களுக்கு எளிதில் புரியும் நடையும் காக்கப்பட்டுள்ளன. பட்டியல் நீளமாக இருந்தாலும் மூலத்தின் சடங்குத்தன்மையும் உடன்படிக்கைச் சபையின் பரப்பும் காக்கப்பட்டுள்ளன. வாக்கியத்தின் தொடக்கமும் முடிவும் ‘நிற்கிறீர்கள்’ என அமைவது தமிழில் நீண்ட பட்டியலுக்குப் பின் இலக்கணத் தெளிவை உறுதிசெய்கிறது.
