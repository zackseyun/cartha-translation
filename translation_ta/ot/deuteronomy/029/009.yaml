revisions:
- from: 'இன்று நீங்கள் எல்லாரும் உங்கள் கடவுளாகிய யாவேக்கு முன்பாக நிற்கிறீர்கள்: உங்கள் தலைவர்கள்[a], உங்கள் கோத்திரங்கள், உங்கள் மூப்பர்கள், உங்கள் அதிகாரிகள், இஸ்ரவேலைச் சேர்ந்த ஒவ்வொரு ஆணும்[b] நிற்கிறீர்கள்.'
  to: 'இன்று நீங்கள் எல்லாரும் உங்கள் கடவுளாகிய யாவேக்கு முன்பாக நிற்கிறீர்கள்: உங்கள் தலைவர்கள்[a], உங்கள் கோத்திரங்கள், உங்கள் மூப்பர்கள், உங்கள் அதிகாரிகள், இஸ்ரவேலைச் சேர்ந்த ஒவ்வொரு ஆணும்[b].'
  rationale: 'The revision removes the ungrammatical repeated verb while retaining the Hebrew structure: one assertion that the whole assembly stands before Yahweh, followed by an appositional list identifying its constituent groups. Footnote b is adjusted to preserve the source expression’s explicitly male referent.'
  reviewer_model: gpt-5.6-terra
