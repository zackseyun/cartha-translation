translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டது. அரசப் பட்டங்கள் தெளிவாகவும், இடப்பெயர்களும் ஆட்பெயர்களும் வழக்கமான தமிழ் ஒலிபெயர்ப்பிலும் வழங்கப்பட்டன. எபிரெயத் தொடர்வினையின் கால/தொடர் இருமையும் נכה வினையின் ‘தாக்கு/வீழ்த்து’ அர்த்தவிரிவும் அடிக்குறிப்புகளில் பாதுகாக்கப்பட்டன.
