  text: וַ/תָּבֹ֖אוּ אֶל הַ/מָּק֣וֹם הַ/זֶּ֑ה וַ/יֵּצֵ֣א סִיחֹ֣ן מֶֽלֶךְ חֶ֠שְׁבּוֹן וְ/ע֨וֹג מֶֽלֶךְ הַ/בָּשָׁ֧ן לִ/קְרָאתֵ֛/נוּ לַ/מִּלְחָמָ֖ה וַ/נַּכֵּֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/006.yaml
  text: When you came to this place[a], Sihon king of Heshbon and Og king of Bashan came out to meet us in battle[b], and we struck them down.
translation:
  language: ta
  text: நீங்கள் இந்த இடத்திற்கு வந்தபோது[a], எஸ்போனின் அரசன் சீகோனும் பாசானின் அரசன் ஓகும் நம்மை எதிர்கொள்ளப் போருக்கு வந்தார்கள்; நாம் அவர்களை அடித்தோம்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நீங்கள் இந்த இடத்திற்கு வந்தீர்கள்.” எபிரெயக் கதைநடை வடிவத்தை எளிய தொடராகவும், அடுத்த நிகழ்வுக்கான காலச் சூழலாகவும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “நாம் அவர்களை வீழ்த்தினோம்.” எபிரெய வினைச்சொல் நேரடியாக ‘அடித்தல்’ என்று பொருள்படும்; போர்ச் சூழலில் அது எதிரிகளை முறியடித்ததையும் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּבֹאוּ
  choice: நீங்கள் ... வந்தபோது
  rationale: בוא என்பதன் Qal wayyiqtol இரண்டாம் நபர் ஆண்பால் பன்மை வடிவம். அடுத்த நிகழ்வோடு இயல்பாக இணைக்கத் தமிழில் காலத்தொடர்பைக் காட்டும் ‘வந்தபோது’ பயன்படுத்தப்பட்டது; எளிய தொடரிணைப்பும் சாத்தியம் என்பதால் மாற்று அடிக்குறிப்பில் தரப்பட்டது.
- source_word: אֶל הַמָּקוֹם הַזֶּה
  choice: இந்த இடத்திற்கு
  rationale: מָקוֹם என்பதன் அடிப்படைப் பொருள் ‘இடம்’; אֶל இங்கு சென்றடையும் திசையைக் குறிப்பதால் ‘இந்த இடத்திற்கு’ என்பது இயல்பான தமிழ்.
- source_word: וַיֵּצֵא
  choice: புறப்பட்டு வந்தார்கள்
  rationale: יצא என்பதன் பொருள் ‘வெளியேறு/புறப்படு.’ சந்திப்புக்காக எதிரே வருவதைத் தமிழில் இயல்பாக வெளிப்படுத்த ‘புறப்பட்டு வந்தார்கள்’ எனப்பட்டது; ‘அணிவகுத்து வந்தார்கள்’ போன்ற கூடுதல் கருத்து சேர்க்கப்படவில்லை.
- source_word: סִיחֹן מֶלֶךְ חֶשְׁבּוֹן
  choice: எஸ்போனின் அரசன் சீகோன்
  rationale: பெயர்களின் ஒலிபெயர்ப்புடன், எபிரெயச் சேர்க்கை அமைப்பு இயல்பான தமிழில் உடைமைத் தொடராக வழங்கப்பட்டது.
- source_word: וְעוֹג מֶלֶךְ הַבָּשָׁן
  choice: பாசானின் அரசன் ஓகும்
  rationale: முந்தைய அரசப் பட்டத்துக்கு இணையான அமைப்பு காக்கப்பட்டது; וְ என்பதன் இணைப்புப் பொருள் தமிழின் ‘-உம்’ மூலம் தெரிவிக்கப்பட்டது.
- source_word: לִקְרָאתֵנוּ לַמִּלְחָמָה
  choice: நம்மை எதிர்கொண்டு போரிட
  rationale: לִקְרָאתֵנוּ நேருக்கு நேர் சந்திப்பதையும், לַמִּלְחָמָה அதன் போர்நோக்கத்தையும் குறிக்கின்றன. இரண்டையும் சேர்த்து இயல்பாகவும் பகைமையான சூழலைத் தெளிவாகவும் கூறும் தமிழ் தேர்ந்தெடுக்கப்பட்டது.
- source_word: וַנַּכֵּם
  choice: நாம் அவர்களை வீழ்த்தினோம்
  rationale: נכה என்பதன் Hiphil வடிவம் தாக்குதல் அல்லது போரில் முறியடித்தலைக் குறிக்கலாம். ‘வீழ்த்தினோம்’ அதன் திடமான செயற்பொருளையும் தீர்மானமான தோல்வியையும் காக்கிறது; நேரடியான ‘தாக்கினோம்’ மாற்று அடிக்குறிப்பில் தரப்பட்டது.
