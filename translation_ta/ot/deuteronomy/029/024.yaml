source:
  edition: WLC
  text: וְ/אָ֣מְר֔וּ עַ֚ל אֲשֶׁ֣ר עָֽזְב֔וּ אֶת בְּרִ֥ית יְהוָ֖ה אֱלֹהֵ֣י אֲבֹתָ֑/ם אֲשֶׁר֙ כָּרַ֣ת עִמָּ֔/ם בְּ/הוֹצִיא֥/וֹ אֹתָ֖/ם מֵ/אֶ֥רֶץ מִצְרָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/024.yaml
  text: Then they will say[a], ‘Because they forsook the covenant of Yahweh, the God of their fathers, which he made with them when he brought them out of the land of Egypt.’
translation:
  language: ta
  text: அப்போது அவர்கள், “தங்கள் தந்தையரின் கடவுளாகிய[a] யாவே அவர்களை எகிப்து நாட்டிலிருந்து வெளியே கொண்டுவந்தபோது அவர்களுடன் ஏற்படுத்திய உடன்படிக்கையை அவர்கள் கைவிட்டதால்தான்” என்று சொல்வார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரேயத்தில், “அவர்களுடைய தந்தையரின் கடவுள்”; மாற்றாக, “அவர்களுடைய தந்தையருக்குக் கடவுளானவர்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמְרוּ
  choice: அப்போது அவர்கள் ... என்று சொல்வார்கள்
  rationale: சுற்றியுள்ள உரையாடலில் காரணத்திற்கான பதில் அடுத்து வருவதை ‘அப்போது’ இயல்பாகக் காட்டுகிறது; எதிர்காலச் சூழலை ‘சொல்வார்கள்’ தக்கவைக்கிறது.
- source_word: עַל אֲשֶׁר
  choice: …தால்தான்
  rationale: நாட்டிற்கு நேர்ந்த அழிவுக்கான காரணத்தை அறிமுகப்படுத்தும் எபிரேயத் தொடரைத் தமிழில் இயல்பான காரண விகுதியாலும் வலியுறுத்தலாலும் வெளிப்படுத்துகிறது.
- source_word: עָזְבוּ
  choice: கைவிட்ட
  rationale: இது வெறுமனே விட்டு நீங்குவதைக் குறிக்காமல், உடன்படிக்கையைத் தெரிந்தே புறக்கணித்ததைக் குறிக்கிறது.
- source_word: בְּרִית
  choice: உடன்படிக்கை
  rationale: கடவுளுக்கும் இஸ்ரவேலுக்கும் இடையிலான கட்டுப்படுத்தும் உறவைச் சுட்டும் வழக்கமான, பொருள் செறிந்த தமிழ் சொல்.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரேய மூலத்தில் வரும் கடவுளின் தனிப்பெயரை ஒரு பட்டத்தால் மாற்றாமல் ஒலிபெயர்க்கிறது.
- source_word: אֱלֹהֵי אֲבֹתָם
  choice: தங்கள் தந்தையரின் கடவுள்
  rationale: எபிரேய ஆண்பால் மூதாதையர் குறிப்பையும், தொடர்புடைய உரிமை அமைப்பையும் காக்கிறது.
- source_word: אֲשֶׁר כָּרַת עִמָּם
  choice: அவர்களோடு செய்துகொண்ட உடன்படிக்கை
  rationale: ‘உடன்படிக்கையை வெட்டுதல்’ என்ற எபிரேய மரபுத்தொடரை சொல்லுக்குச் சொல் மொழிபெயர்க்காமல் அதன் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: בְּהוֹצִיאוֹ אֹתָם
  choice: அவர்களை ... வெளியே கொண்டுவந்தபோது
  rationale: בְּ முன்னொட்டுடன் வரும் வினையெச்சத்தின் காலத் தொடர்பைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: எகிப்து நாட்டிலிருந்து
  rationale: ‘எகிப்து நாடு’ என்ற முழு மூலச் சொல்லாட்சியையும் விடுதலை நிகழ்வின் எதிரொலியையும் தக்கவைக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூலத்தில் தனிப்பெயரான நான்கெழுத்து இறைப்பெயர் நேரடியாக இருப்பதால், அதை ஒரு பட்டமாக மாற்றாமல் தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளது.
- issue: אֱלֹהֵי אֲבֹתָם என்ற தந்தையர் குறிப்பு
  choice: தங்கள் தந்தையரின் கடவுள்
  alternative: தங்கள் மூதாதையரின் கடவுள்
  rationale: மூலத்தின் இலக்கண ஆண்பாலையும் தந்தையர் வழியிலான வரலாற்றுக் குறிப்பையும் பொதுமைப்படுத்தாமல் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பாகவும் கண்ணியமாகவும் வடிவமைக்கப்பட்டுள்ளது. ‘கைவிட்ட’ என்பது பழமையான சொல்லாட்சியைத் தவிர்த்து உடன்படிக்கைத் துரோகத்தின் தீவிரத்தைத் தக்கவைக்கிறது; மேற்கோளுக்குள் காரணவாக்கியமாக இருப்பதால் ‘…தால்தான்’ பயன்படுத்தப்பட்டுள்ளது.
