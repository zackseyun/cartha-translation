  text: וְ/אָמַ֞ר הַ/דּ֣וֹר הָֽ/אַחֲר֗וֹן בְּנֵי/כֶם֙ אֲשֶׁ֤ר יָק֨וּמוּ֙ מֵ/אַ֣חֲרֵי/כֶ֔ם וְ/הַ֨/נָּכְרִ֔י אֲשֶׁ֥ר יָבֹ֖א מֵ/אֶ֣רֶץ רְחוֹקָ֑ה וְ֠/רָאוּ אֶת מַכּ֞וֹת הָ/אָ֤רֶץ הַ/הִוא֙ וְ/אֶת תַּ֣חֲלֻאֶ֔י/הָ אֲשֶׁר חִלָּ֥ה יְהוָ֖ה בָּֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/021.yaml
  text: 'And the generation to come—your children who rise up after you—and the foreigner who comes from a distant land will say[c][b][a], when they see the plagues of that land and its sicknesses with which Yahweh has afflicted it:'
translation:
  language: ta
  text: '“உங்களுக்குப் பின் எழும்பும் உங்கள் பிள்ளைகளாகிய பிற்காலத் தலைமுறையும்[a], தொலைதூர நாட்டிலிருந்து வரும் அந்நியனும், அந்த நாட்டின் வாதைகளையும், யாவே அதில் உண்டாக்கிய அதன் நோய்களையும்[b][c] கண்டு, இப்படிச் சொல்வார்கள்:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “வருங்காலத் தலைமுறை.” இது கட்டாயமாக இறுதித் தலைமுறையைக் குறிக்காது.
    reason: lexical_alternative
  - marker: b
    text: “நோய்கள்” என்பதற்கு “பிணிகள்” அல்லது “வியாதிகள்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: எழுத்துப்படி, “யாவே அதில் நோயுறச் செய்தவை”; அல்லது, “யாவே அதில் வருத்தியவை.”
    reason: source_form_and_lexical_alternative
lexical_decisions:
- source_word: וְאָמַר
  choice: சொல்வார்கள்
  rationale: எபிரெய வினை ஒருமையில் இருந்தாலும், பின்னர் வரும் கூட்டெழுவாய்களான தலைமுறையும் அந்நியனும் சேர்ந்து கருத்தளவில் பன்மையாக இருப்பதால், இயல்பான தமிழில் பன்மை பயன்படுத்தப்பட்டது.
- source_word: הַדּוֹר הָאַחֲרוֹן
  choice: வருங்காலத் தலைமுறை
  rationale: இது கட்டாயமாக உலகின் இறுதித் தலைமுறையைக் குறிக்காமல், தற்போதைய கேட்போருக்குப் பின் வரும் ஒரு தலைமுறையைக் குறிக்கிறது.
- source_word: בְּנֵיכֶם אֲשֶׁר יָקֻמוּ מֵאַחֲרֵיכֶם
  choice: உங்களுக்குப் பின் எழும்பும் உங்கள் பிள்ளைகள்
  rationale: மூலத்தின் ‘எழும்புதல்’ என்ற உருவகத்தையும், பிள்ளைகள்/சந்ததியினர் என்ற குடும்பத் தொடர்ச்சியையும் காக்கிறது.
- source_word: וְהַנָּכְרִי
  choice: அந்நியன்
  rationale: இஸ்ரவேலுக்கு வெளியிலிருந்து வரும் வெளிநாட்டவரைக் குறிக்கும் சொல்லுக்கு dignified, வழக்கமான தமிழ் இணை.
- source_word: מֵאֶרֶץ רְחוֹקָה
  choice: தொலைதூர நாட்டிலிருந்து
  rationale: புவியியல் தொலைவை இயல்பான நவீன தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: וְרָאוּ
  choice: கண்டு
  rationale: காண்பது சொல்லுவதற்கு முன் நிகழும் சூழ்நிலையைத் தமிழ் வினையெச்சம் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: מַכּוֹת
  choice: வாதைகள்
  rationale: அடிகள், பேரிடர்கள், தண்டனைமிக்க தாக்கங்கள் ஆகிய பொருள் பரப்பை உடன்படிக்கைச் சாபச் சூழலில் ஏற்றவாறு எடுத்துரைக்கிறது.
- source_word: תַּחֲלֻאֶיהָ
  choice: அதன் நோய்கள்
  rationale: நாடு நோயுற்றதாகச் சித்தரிக்கப்படும் மூல உருவகத்தைத் தக்கவைக்கிறது.
- source_word: חִלָּה
  choice: உண்டாக்கிய பிணிகள்
  rationale: பியேல் வடிவத்தின் ‘நோயுறச் செய்தல்/பீடித்தல்’ என்ற காரணவினைப் பொருளையும், நாட்டுக்குள் ஏற்பட்ட நிலையைச் சற்று வெளிப்படையாகக் காட்டுகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: திருநாமத்தை ஒரு பட்டப்பெயரால் மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: בָּהּ
  choice: அதில்
  rationale: பின்னொட்டு அந்த நாட்டைக் குறிக்கிறது; மூலத்தின் ‘அதில்’ என்ற இடப்பொருள் பாதுகாக்கப்பட்டது.
theological_decisions:
- issue: יְהוָה என்ற இறைநாமத்தின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலத்தில் நேரடியாக வரும் நான்கெழுத்துத் திருநாமத்தைப் பட்டப்பெயராக மாற்றாமல், நவீன தமிழில் பரவலாகப் புரியக்கூடிய ஒலிபெயர்ப்பாக வழங்குகிறது.
- issue: בְּנֵיכֶם என்பதன் வரம்பு
  choice: உங்கள் பிள்ளைகள்
  alternative: உங்கள் மகன்கள் / உங்கள் சந்ததியினர்
  rationale: சொல்லின் குடும்ப உறவுப் பொருளைக் காத்து, இச்சூழலில் ஆண்களை மட்டும் தேவையின்றிக் குறுக்காமல் அடுத்த தலைமுறையைக் குறிக்கிறது.
- issue: הַדּוֹר הָאַחֲרוֹן என்பதன் காலவியல் பொருள்
  choice: வருங்காலத் தலைமுறை
  alternative: கடைசித் தலைமுறை
  rationale: இங்கு இறுதிக்காலக் கருத்தைத் திணிக்காமல், தற்போதைய தலைமுறைக்குப் பிந்திய தலைமுறை என்ற உண்மையான பொருள் பரப்பைக் காக்கிறது.
translation_notes:
  register: நவீன, செம்மையான, பொதுமக்களுக்கு விளங்கும் தமிழ் பயன்படுத்தப்பட்டது. செய்யுளின் அடுத்த வசனத்தில் வரும் கேள்வியை அறிமுகப்படுத்தும் நிறுத்துக்குறியாக இரட்டைப்புள்ளி வைக்கப்பட்டது. ‘நாடு நோயுற்றது’ என்ற எபிரெய உருவகம் சாத்தியமான அளவு பாதுகாக்கப்பட்டது.
