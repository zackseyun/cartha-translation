source:
  edition: WLC
  text: וְ/אָֽמְרוּ֙ כָּל הַ/גּוֹיִ֔ם עַל מֶ֨ה עָשָׂ֧ה יְהוָ֛ה כָּ֖כָה לָ/אָ֣רֶץ הַ/זֹּ֑את מֶ֥ה חֳרִ֛י הָ/אַ֥ף הַ/גָּד֖וֹל הַ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/023.yaml
  text: And all the nations will say[a], ‘Why has Yahweh done thus to this land? Why this great burning anger?’
translation:
  language: ta
  text: எல்லா நாடுகளும், “யாவே ஏன் இந்த நாட்டுக்கு இப்படிச் செய்தார்? இந்த மாபெரும் எரியும் கோபம் ஏன்?[a]” என்று கேட்பார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'இன்னும் சொற்சொல்லாக: “இந்தப் பெரும் கோபத்தின் வெம்மை ஏன்?”'
    reason: எபிரெய மூலத்தில் חֳרִי என்பது ‘வெம்மை/எரிச்சல்’ என்றும், אַף என்பது இம்மொழிவழக்கில் ‘கோபம்’ என்றும் பொருள்படும்; பிரதான உரை இந்த உருவகத்தை இயல்பான தமிழில் வழங்குகிறது.
lexical_decisions:
- source_word: וְאָמְרוּ
  choice: அப்போது ... என்று கேட்பார்கள்
  rationale: இணைப்புச் சொல் உடன்படிக்கைச் சூழலில் அடுத்துவரும் எதிர்காலப் பிரதிசெயலை அறிமுகப்படுத்துகிறது. אָמַר என்பதன் அடிப்படைப் பொருள் ‘சொல்’ என்றாலும், நேரடிக் கேள்வியைத் தொடர்ந்து தமிழில் ‘என்று கேட்பார்கள்’ என்பது இயல்பாக உள்ளது.
- source_word: כָּל הַגּוֹיִם
  choice: எல்லா நாடுகளும்
  rationale: இங்கு இஸ்ரவேலின் நிலைக்கு நேர்ந்ததைப் பார்க்கும் பிற தேச மக்களை ஒட்டுமொத்தமாகக் குறிக்கிறது; ‘நாடுகள்’ என்பது அதன் அரசியல்-இனக்குழு சார்ந்த பொருளைப் பேணுகிறது.
- source_word: עַל מֶה
  choice: ஏன்
  rationale: காரணத்தை வினவும் எபிரெய மொழிவழக்கிற்கு நவீனத் தமிழில் இயல்பான இணை ‘ஏன்’ ஆகும்.
- source_word: עָשָׂה יְהוָה כָּכָה
  choice: யாவே ... இப்படிச் செய்தார்
  rationale: כָּכָה என்பதன் ‘இவ்வாறு/இப்படி’ என்ற சுட்டுப்பொருளைப் பேணி, தமிழில் இயல்பான சொல் வரிசையில் வழங்கப்பட்டுள்ளது.
- source_word: לָאָרֶץ הַזֹּאת
  choice: இந்த நாட்டுக்கு
  rationale: ஆராயப்படும் உடன்படிக்கை நிலப்பகுதியை אָרֶץ குறிக்கிறது. இச்சூழலில் ‘இந்த நாட்டுக்கு’ என்பது இயல்பான தமிழ்; ‘இந்த நிலத்துக்கு’ என்பதும் சாத்தியம்.
- source_word: חֳרִי הָאַף הַגָּדוֹל הַזֶּה
  choice: இந்த மாபெரும் எரியும் கோபம்
  rationale: חֳרִי-யின் வெம்மை அல்லது எரிதல் உருவகத்தையும், אַף-ன் வழக்குப்பொருளான ‘கோபம்’ என்பதையும் பேணுகிறது; גָּדוֹל வலிமையை ‘மாபெரும்’ வெளிப்படுத்துகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் பொதுப்பட்டம் அல்ல, நான்கு எழுத்துகளைக் கொண்ட தனிப்பட்ட உடன்படிக்கைப் பெயர் நேரடியாக உள்ளது. எனவே அதை ஒரு பட்டத்தால் மாற்றாமல் தமிழில் ஒலிபெயர்த்துள்ளது.
- issue: தெய்வீகக் கோபத்தின் எரிதல் உருவகம்
  choice: எரியும் கோபம்
  alternative: கடுங்கோபம்
  rationale: ‘கடுங்கோபம்’ இயல்பான தமிழாக இருந்தாலும், חֳרִי-யில் உள்ள வெம்மை/எரிதல் படிமத்தை ‘எரியும்’ வெளிப்படையாகப் பேணுகிறது; இதனால் கோபத்தின் தீவிரமும் உருவகமும் இரண்டும் நிலைக்கின்றன.
translation_notes:
  register: நவீனத் தரநிலைத் தமிழில், பொதுவாசகர்களுக்கு எளிதாகவும் மரியாதைமிக்க நடையிலும் அமைக்கப்பட்டுள்ளது. நேரடிக் கேள்வியின் உயிரோட்டம், எதிர்காலச் சூழல், இறைப்பெயர், கோபத்தின் எரிதல் உருவகம் ஆகியவை பேணப்பட்டுள்ளன.
