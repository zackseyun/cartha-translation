    text: ‘மறைவானவை நம் கடவுளாகிய ஆண்டவருக்குரியவை’ என்றும் மொழிபெயர்க்கலாம்.
    reason: divine_name_alternative
  - marker: b
    text: ‘சட்டம்’ என்பதற்கான எபிரெயச் சொல் ‘போதனை’ என்றும் மொழிபெயர்க்கப்படலாம்; உபாகமத்தில் இது மோசே இஸ்ரவேலர்முன் வைக்கும் உடன்படிக்கைப் போதனையைக் குறிக்கிறது.
    reason: lexical_alternative
