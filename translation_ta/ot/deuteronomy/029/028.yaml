base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/028.yaml
  text: The hidden things belong to Yahweh our God[a], but the revealed things belong to us and to our children forever[b], so that we may do all the words of this law.
translation:
  language: ta
  text: மறைவானவை நம் கடவுளாகிய யெகோவாவுக்குரியவை; வெளிப்படுத்தப்பட்டவையோ நமக்கும் நம் பிள்ளைகளுக்கும் என்றென்றும் உரியவை; நாம் இந்தச் சட்டத்தின் எல்லா வார்த்தைகளையும் கடைப்பிடிப்பதற்காக.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַנִּסְתָּרֹת
  choice: மறைவானவை
  rationale: סתר என்பதன் மறைநிலைப் பன்மைப் பெயரெச்சம் பெயர்ச்சொல்லாகப் பயன்படுகிறது. மனித அறிவுக்கு மறைக்கப்பட்ட காரியங்கள் என்ற கருத்தை இயல்பாகவும் மிகைப்படுத்தாமலும் தெரிவிக்கிறது.
- source_word: לַיהוָה אֱלֹהֵינוּ
  choice: நம் கடவுளாகிய யெகோவாவுக்கே உரியவை
  rationale: לְ உடைமை அல்லது உரிமையைக் குறிக்கிறது. יהוה என்ற தனிப்பெயர் ‘யெகோவா’ என்று ஒலிபெயர்க்கப்பட்டு, אֱלֹהֵינוּ ‘நம் கடவுள்’ என்று தரப்பட்டுள்ளது; ‘-க்கே’ மறைவானவையும் வெளிப்படுத்தப்பட்டவையும் இடையிலான எதிர்நிலையைத் தெளிவாக்குகிறது.
- source_word: וְהַנִּגְלֹת
  choice: ஆனால் வெளிப்படுத்தப்பட்டவை
  rationale: גלה என்பதன் மறைநிலைப் பெயரெச்சம், ‘மறைவானவை’ என்பதற்கு இணையான எதிர்ச்சொல் அமைப்பைத் தக்கவைக்கிறது. וְ இங்கு கருத்து மாறுபாட்டைக் காட்டுவதால் ‘ஆனால்’ என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: לָנוּ וּלְבָנֵינוּ
  choice: நமக்கும் நம் பிள்ளைகளுக்கும் உரியவை
  rationale: முதல் அரையடியிலுள்ள உடைமைப் பொருள் இங்கும் தொடர்வதைத் தமிழில் வெளிப்படையாகக் கூறுகிறது. בנים உடன்படிக்கைச் சூழலில் ஆண் மக்களை மட்டும் அல்லாமல் சந்ததியினரையும் உள்ளடக்குவதால் ‘பிள்ளைகள்’ எனத் தரப்பட்டுள்ளது.
- source_word: עַד עוֹלָם
  choice: என்றென்றும்
  rationale: தொடர்ந்து நிலைக்கும் காலத்தைக் குறிக்கும் எபிரெயச் சொற்றொடருக்கு இயல்பான, கண்ணியமான தமிழ் இணை.
- source_word: לַעֲשׂוֹת
  choice: நாம் நடப்பதற்காக
  rationale: לְ உடனான வினையெச்சம் நோக்கத்தைக் குறிக்கிறது. சட்டத்தின் வார்த்தைகளை ‘செய்தல்’ என்பது தமிழில் அவற்றின்படி வாழ்ந்து கீழ்ப்படிதலை இயல்பாகக் குறிக்க ‘நடப்பது’ என வழங்கப்பட்டுள்ளது.
- source_word: אֵת כָּל דִּבְרֵי
  choice: எல்லா வார்த்தைகளின்படியும்
  rationale: דִּבְרֵי என்பதிலுள்ள ‘வார்த்தைகள்’ என்ற உரைமையைக் காக்கிறது; ‘-இன்படியும்’ என்பது அவற்றைச் செய்தல் என்ற தமிழ்ச் சேர்க்கையை இயல்பாக்குகிறது.
- source_word: הַתּוֹרָה הַזֹּאת
  choice: இந்தத் திருச்சட்டம்
  rationale: תורה என்பது போதனை அல்லது நியமம் என்றும் பொருள்படலாம்; உபாகமத்தின் உடன்படிக்கைச் சூழலில் ‘திருச்சட்டம்’ சட்டப்பூர்வத்தையும் இறைபோதனையின் கண்ணியத்தையும் தெரிவிக்கிறது.
theological_decisions:
- issue: ‘மறைவானவை’ மற்றும் ‘வெளிப்படுத்தப்பட்டவை’ என்பவற்றின் வரம்பு
  choice: கடவுளுக்கே உரிய மறைவான காரியங்களையும், கீழ்ப்படிதலுக்காக இஸ்ரவேலருக்கு வெளிப்படுத்தப்பட்ட காரியங்களையும் பொதுவாக எதிர்நிறுத்துதல்
  alternative: எல்லா இறைமறைபொருள்களையும் பற்றிய முழுமையான அறிவியல் கோட்பாடாகவோ, உடனடியான சூழலிலுள்ள உடன்படிக்கை ஆசீர்வாதங்களுக்கும் சாபங்களுக்கும் மட்டும் உரியதாகவோ குறுக்குதல்
  rationale: எபிரெய உரை அவற்றின் துல்லியமான எல்லையை வரையறுக்கவில்லை. எனவே உடனடிச் சூழலை மதித்தபடியே அதன் உண்மையான பொதுமையையும் இறையியல் இழுபறியையும் மொழிபெயர்ப்பு காக்கிறது.
- issue: வெளிப்பாட்டின் நோக்கம்
  choice: வெளிப்படுத்தப்பட்டவை உடன்படிக்கைச் சட்டத்திற்குக் கீழ்ப்படிவதற்காக அளிக்கப்பட்டவை என்று நோக்கத் தொடர்பை வெளிப்படுத்துதல்
  alternative: לַעֲשׂוֹת என்பதை நோக்கத்தைத் தெளிவாக்காமல் வெறும் ‘செய்ய’ என விடுதல்
  rationale: எபிரெய வினையெச்சத்தின் நோக்கப் பொருளை இயல்பான தமிழில் தெளிவாக்குகிறது; ஆனால் வெளிப்பாட்டின் உள்ளடக்கத்தை உரை கூறுவதைக் கடந்து வரையறுக்கவில்லை.
translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான வேதாகம நடை பயன்படுத்தப்பட்டுள்ளது. இணையான ‘மறைவானவை / வெளிப்படுத்தப்பட்டவை’ அமைப்பு காக்கப்பட்டுள்ளது. கடவுளின் தனிப்பெயர் முதன்மை உரையில் ‘யெகோவா’ எனவும், வழக்கமான பட்டப்பெயர் அடிக்குறிப்பில் மாற்றாகவும் தரப்பட்டுள்ளது. நோக்கத் தொடர்பைத் தமிழில் இயல்பாக்க இறுதி வாக்கியம் வெளிப்படையாக அமைக்கப்பட்டுள்ளது.
