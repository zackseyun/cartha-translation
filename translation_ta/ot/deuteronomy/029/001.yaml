base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/001.yaml
  text: And Moses called all Israel and said to them[a], “You have seen all that Yahweh did before your eyes in the land of Egypt, to Pharaoh and to all his servants and to all his land.”
translation:
  language: ta
  text: 'மோசே இஸ்ரவேலர் அனைவரையும் அழைத்து, அவர்களிடம் கூறினார்: “எகிப்து நாட்டில் பார்வோனுக்கும் அவனுடைய பணியாளர்கள் அனைவருக்கும் அவனுடைய நாடு முழுவதற்கும்[a] யாவே உங்கள் கண்களுக்கு முன்பாகச் செய்த அனைத்தையும் நீங்கள் கண்டிருக்கிறீர்கள்.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பார்வோனுக்கும் அவனுடைய பணியாளர்கள் அனைவருக்கும் அவனுடைய நாடு முழுவதற்கும் எதிராக.” இங்குள்ள எபிரெய முன்னொட்டு, எகிப்தில் யாவே செய்தவை அவர்களுக்கு எதிரான நியாயத்தீர்ப்புச் செயல்கள் என்பதைச் சூழலுக்கேற்ப இவ்வாறு மொழிபெயர்க்க இடமளிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: அழைத்து
  rationale: இச்சூழலில் קרא என்பது மக்களை அழைப்பதையோ ஒன்றுகூட்டுவதையோ குறிக்கிறது; ‘அழைத்து’ என்பது இயல்பான நவீனத் தமிழ்.
- source_word: כָּל יִשְׂרָאֵל
  choice: இஸ்ரவேலர் அனைவரையும்
  rationale: உடன்படிக்கை மக்களாகிய இஸ்ரவேல் முழுவதையும் குறிக்கும் கூட்டுப்பெயரைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: רְאִיתֶם
  choice: நீங்கள் கண்டிருக்கிறீர்கள்
  rationale: கடந்தகாலத்தில் நேரடியாகக் கண்ட அனுபவம் தற்போதும் பொருத்தமுடையது என்ற எபிரெய நிறைவேற்ற வினையின் நுணுக்கத்தைப் பாதுகாக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைத் திருப்பெயரை ஒரு பட்டத்தால் மாற்றாமல், எபிரெய மெய்யெழுத்துப் பெயரின் பரவலான தமிழ் ஒலிபெயர்ப்பால் தருகிறது.
- source_word: לְעֵינֵיכֶם
  choice: உங்கள் கண்களுக்கு முன்பாக
  rationale: நிகழ்வுகளை மக்கள் நேரடியாகவும் வெளிப்படையாகவும் கண்டனர் என்பதை வலியுறுத்தும் எபிரெய மரபுத்தொடரின் உயிரோட்டத்தைத் தக்கவைக்கிறது.
- source_word: בְּאֶרֶץ מִצְרַיִם
  choice: எகிப்து நாட்டில்
  rationale: மூலத்தில் உள்ள ‘நாடு’ என்பதைக் காத்து, இயல்பான தமிழில் இடத்தைச் சுட்டுகிறது.
- source_word: לְפַרְעֹה וּלְכָל עֲבָדָיו וּלְכָל אַרְצוֹ
  choice: பார்வோனுக்கும் அவனுடைய பணியாளர்கள் அனைவருக்கும் அவனுடைய நாடு முழுவதற்கும்
  rationale: மீண்டும் மீண்டும் வரும் לְ முன்னொட்டின் அடிப்படை உறவைப் பாதுகாத்து, செயல்களின் பாதிப்புக்குள்ளானவர்களையும் நாட்டையும் குறிப்பிடுகிறது; ‘எதிராக’ என்ற சூழல்சார் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைத் திருப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூலவசனம் இறைவனின் தனிப்பட்ட உடன்படிக்கைப் பெயரை நேரடியாகப் பயன்படுத்துவதால், அதை ஒரு பட்டமாக மாற்றாமல் ஒலிபெயர்த்துள்ளது.
- issue: பார்வோனுக்கும் அவனுடைய நாட்டிற்கும் செய்யப்பட்ட செயல்களின் திசை
  choice: …க்கும்
  alternative: …க்கு எதிராக
  rationale: לְ முன்னொட்டு இலக்கண ரீதியாக விரிந்த பொருளுடையது. எகிப்தின் மீதான நியாயத்தீர்ப்பைச் சூழல் உணர்த்தினாலும், முதன்மை உரை அந்த விளக்கத்தை கட்டாயப்படுத்தாமல் மூலத்தின் தெளிவின்மையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன, பொதுநிலையான, மரியாதைமிக்க தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘பார்வோன்’ மற்றும் ‘யாவே’ ஆகிய வேதாகமப் பெயர்கள் நிலையான ஒலிபெயர்ப்பில் தரப்பட்டுள்ளன; எபிரெய வாக்கியத்தின் மீளுரைப்பைத் தக்கவைத்தபோதும் தமிழ் நடை இயல்பாக அமைக்கப்பட்டுள்ளது.
