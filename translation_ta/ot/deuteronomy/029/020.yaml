  text: וְ/הִבְדִּיל֤/וֹ יְהוָה֙ לְ/רָעָ֔ה מִ/כֹּ֖ל שִׁבְטֵ֣י יִשְׂרָאֵ֑ל כְּ/כֹל֙ אָל֣וֹת הַ/בְּרִ֔ית הַ/כְּתוּבָ֕ה בְּ/סֵ֥פֶר הַ/תּוֹרָ֖ה הַ/זֶּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/020.yaml
  text: And Yahweh will single him out from all the tribes of Israel for disaster[a], according to all the curses of the covenant written in this book of the law.
translation:
  language: ta
  text: யாவே அவனை இஸ்ரவேலின் எல்லாக் கோத்திரங்களிலிருந்தும் பேரழிவுக்காகத் தனியே பிரிப்பார்; இந்தச் சட்ட நூலில் எழுதப்பட்டுள்ள உடன்படிக்கையின் எல்லாச் சாபங்களின்படியும்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உடன்படிக்கையின் ஆணைச் சாபங்களின்படியும்.” இங்குள்ள எபிரெயச் சொல், ஆணையுடன் இணைக்கப்பட்ட உடன்படிக்கைச் சாபங்களைக் குறிப்பாகக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִבְדִּילוֹ
  choice: அவனைத் தனியே பிரித்துவைப்பார்
  rationale: בדל என்பதன் ஹிப்ஈல் வடிவம் ஒருவரைப் பிறரிடமிருந்து பிரித்து வைப்பதைக் குறிக்கிறது. தண்டனைச் சூழலில், ‘தனியே பிரித்துவைப்பார்’ என்பது குறிப்பாக அவனையே தீர்ப்புக்காகத் தேர்ந்தெடுக்கும் எதிர்மறை வலிமையையும் வினையின் அடிப்படைப் பொருளையும் காக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய மூலத்தில் வரும் இறைபெயரான יהוה-ஐ பட்டப்பெயராக மாற்றாமல், தமிழில் அறியப்பட்ட ஒலிபெயர்ப்பு வடிவில் வழங்குகிறது.
- source_word: לְרָעָה
  choice: பேரழிவுக்கென
  rationale: இந்த இடத்தில் רָעָה ஒழுக்கத் தீமையை அல்ல, உடன்படிக்கை மீறுதலால் வரும் தண்டனைக்குரிய அழிவைக் குறிக்கிறது. ‘பேரழிவு’ அந்தத் தீங்கான முடிவைத் தெளிவாகச் சொல்கிறது.
- source_word: מִכֹּל שִׁבְטֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் எல்லாக் கோத்திரங்களிலிருந்தும்
  rationale: מִן இங்கு பெரிய உடன்படிக்கைச் சமூகத்திலிருந்து பிரித்தலைக் குறிக்கிறது; தமிழ் வடிவம் அந்த உறவை இயல்பாகப் பாதுகாக்கிறது.
- source_word: כְּכֹל
  choice: எல்லாச் … இன்படியும்
  rationale: כְּ என்பது எழுதப்பட்ட சாபங்களுக்கும் நிறைவேற்றப்படும் தண்டனைக்கும் உள்ள ஒத்திசைவைச் சுட்டுகிறது. ‘இன்படியும்’ அந்த முறையுறவைத் தக்கவைக்கிறது.
- source_word: אָלֹות
  choice: சாபங்கள்
  rationale: உடன்படிக்கைச் சூழலில் אָלָה ஆணையோடு இணைக்கப்பட்ட சாபத் தடைகளைச் சுட்டலாம். முதன்மை உரையில் தெளிவான ‘சாபங்கள்’ பயன்படுத்தப்பட்டு, ஆணை சார்ந்த நுணுக்கம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: הַבְּרִית
  choice: உடன்படிக்கையின்
  rationale: בְּרִית என்பதன் உடன்படிக்கை சார்ந்த வேதாகமப் பொருளை நேரடியாகவும் இயல்பாகவும் வழங்குகிறது.
- source_word: הַכְּתוּבָה
  choice: எழுதப்பட்டுள்ள
  rationale: செயப்பாட்டு வினையெச்சம், சாபங்கள் நூலில் பதிவாகியிருப்பதை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: בְּסֵפֶר הַתּוֹרָה הַזֶּה
  choice: இந்தத் திருச்சட்ட நூலில்
  rationale: סֵפֶר என்பதை ‘நூல்’ என்றும், இச்சூழலில் உடன்படிக்கைச் சட்டத் தொகுப்பைக் குறிக்கும் תּוֹרָה என்பதை ‘திருச்சட்டம்’ என்றும் வழங்குகிறது.
theological_decisions:
- issue: יהוה என்ற இறைபெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: ஆண்டவர் / யெகோவா
  rationale: மூல உரை இறைபெயரை நேரடியாகப் பயன்படுத்துவதால், அதை பொதுப் பட்டப்பெயராக மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது; குறிப்பிட்ட சமயக்குழுவோடு வலுவாக இணைக்கப்படாத நவீன ஆய்வுசார் வடிவமாக ‘யாவே’ தேர்ந்தெடுக்கப்பட்டது.
- issue: לְרָעָה குறிக்கும் தீர்ப்பின் இயல்பு
  choice: பேரழிவுக்கென
  alternative: தீமைக்கென / தீங்குக்கென / கேடுவரும்படி
  rationale: இங்கு கடவுள் ஒருவரை ஒழுக்கத் தீமைக்காகப் பிரிக்கிறார் என்ற கருத்து இல்லை; உடன்படிக்கைத் தீர்ப்பாக வரும் அழிவே பொருள். ஆகவே தண்டனை விளைவைத் தெளிவுபடுத்தும் சொல் தேர்ந்தெடுக்கப்பட்டது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகருக்குப் புரியும் வகையிலும் வேதாகம உரைக்கு ஏற்ற கண்ணியத்துடனும் வடிவமைக்கப்பட்டது. ‘கோத்திரங்கள்,’ ‘உடன்படிக்கை,’ ‘திருச்சட்டம்’ போன்ற நிலைபெற்ற வேதாகமச் சொற்கள் தக்கவைக்கப்பட்டுள்ளன; எபிரெய வாக்கியத்தின் தீர்ப்பு சார்ந்த பதற்றமும் ஆணைச் சாபங்களின் நுணுக்கமும் ஒழிக்கப்படவில்லை.
