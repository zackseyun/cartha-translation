- from: யாவே அவனை இஸ்ரவேலின் எல்லாக் கோத்திரங்களிலிருந்தும் பேரழிவுக்கெனத் தனியே பிரித்துவைப்பார்; இந்தத் திருச்சட்ட நூலில் எழுதப்பட்டுள்ள உடன்படிக்கையின் எல்லாச் சாபங்களின்படியும்[a] அவர் செய்வார்.
  to: யாவே அவனை இஸ்ரவேலின் எல்லாக் கோத்திரங்களிலிருந்தும் பேரழிவுக்காகத் தனியே பிரிப்பார்; இந்தச் சட்ட நூலில் எழுதப்பட்டுள்ள உடன்படிக்கையின் எல்லாச் சாபங்களின்படியும்[a].
