source:
  edition: WLC
  text: וָ/אוֹלֵ֥ךְ אֶתְ/כֶ֛ם אַרְבָּעִ֥ים שָׁנָ֖ה בַּ/מִּדְבָּ֑ר לֹֽא בָל֤וּ שַׂלְמֹֽתֵי/כֶם֙ מֵ/עֲלֵי/כֶ֔ם וְ/נַֽעַלְ/ךָ֥ לֹֽא בָלְתָ֖ה מֵ/עַ֥ל רַגְלֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/004.yaml
  text: And I led you forty years in the wilderness; your clothes did not wear out on you[a], and your sandal did not wear out on your foot.
translation:
  language: ta
  text: நான் உங்களை நாற்பது ஆண்டுகள் வனாந்தரத்தில் வழிநடத்தினேன். நீங்கள் அணிந்திருந்த உங்கள் உடைகள் தேய்ந்து போகவில்லை; உன் காலில் இருந்த உன் காலணி தேய்ந்து போகவில்லை.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரெயத்தில் இறுதிக் கூறில் பன்மையிலிருந்து ஒருமைக்கு மாறுகிறது: நேரடியாக, ‘உன் காலணி உன் காலின்மேலிருந்து தேய்ந்து போகவில்லை.’ இந்த ஒருமை இஸ்ரவேலை ஒரே மக்களாகக் குறிப்பிடலாம் அல்லது ஒவ்வொருவரையும் தனித்தனியாகக் குறிக்கும் பகிர்வொருமையாக இருக்கலாம்.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאוֹלֵךְ
  choice: வழிநடத்தினேன்
  rationale: הלך என்பதன் காரணவினைப் பொருள் இங்கு மக்களைப் பயணிக்கச் செய்வதையும் அவர்களை நடத்திச் செல்வதையும் குறிக்கிறது. சூழலில் இயல்பாகவும் துல்லியமாகவும் இருப்பதால் ‘வழிநடத்தினேன்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: בַמִּדְבָּר
  choice: வனாந்தரத்தில்
  rationale: מִדְבָּר என்பது குடியிருப்பற்ற வறண்ட வனப்பகுதியைக் குறிக்கிறது. இஸ்ரவேலரின் பயணச் சூழலுக்கும் தமிழ் வேதாகம நடைக்கும் ஏற்ற, பரவலாகப் புரியும் சொல்லாக ‘வனாந்தரம்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: בָּלוּ / בָלְתָה
  choice: தேய்ந்து போகவில்லை
  rationale: בלה என்பது பயன்பாட்டினால் உடையும் காலணியும் பழுதாகி பயன்படாத நிலையை அடைவதைக் குறிக்கிறது. இரண்டுக்கும் இயல்பாகப் பொருந்தும் தமிழ் சொற்றொடர் ‘தேய்ந்து போகவில்லை’.
- source_word: שַׂלְמֹתֵיכֶם
  choice: உங்கள் உடைகள்
  rationale: இந்தப் பன்மைச் சொல் பொதுவாக அணியும் ஆடைகளைக் குறிக்கிறது; குறிப்பிட்ட மேலாடையாகக் குறுக்காமல் ‘உடைகள்’ என்று வழங்கப்பட்டது.
- source_word: מֵעֲלֵיכֶם
  choice: உங்கள் உடலில்
  rationale: சொல்லெழுத்தாக ‘உங்கள்மேலிருந்து’ என்றாலும், உடைகள் அணிந்திருந்தபோது தேயவில்லை என்ற பொருளை இயல்பான தமிழில் ‘உங்கள் உடலில்’ என்பது வெளிப்படுத்துகிறது.
- source_word: נַעַלְךָ
  choice: உன் காலணி
  rationale: இச்சொல் இரண்டாம் நபர் ஆண்பால் ஒருமை விகுதியுடன் உள்ளது. மூலத்தில் உள்ள எண்ணிக்கை மாற்றத்தைப் பாதுகாக்க ஒருமையான ‘உன் காலணி’ பயன்படுத்தப்பட்டது.
- source_word: מֵעַל רַגְלֶךָ
  choice: உன் காலில்
  rationale: சொல்லெழுத்தாக ‘உன் காலின்மேலிருந்து’ என்பதாக இருந்தாலும், அணிந்த காலணி தேயவில்லை என்ற படிமத்தை இயல்பாக ‘உன் காலில்’ என்பது தருகிறது.
- source_word: אַרְבָּעִים שָׁנָה
  choice: நாற்பது ஆண்டுகள்
  rationale: கால அளவைக் குறிக்கும் நேரடியான சொற்றொடர்; விரிவாக்கமின்றித் துல்லியமாக மொழிபெயர்க்கப்பட்டது.
theological_decisions:
- issue: முன்னைய பன்மை அழைப்பிலிருந்து இறுதிக் கூறில் ஒருமைக்கு மாறுதல்
  choice: ‘உங்கள் உடைகள்’ என்பதற்குப் பின் ‘உன் காலணி, உன் கால்’ என்று ஒருமையைத் தக்கவைத்தல்
  alternative: தமிழில் சீராக்கி ‘உங்கள் காலணிகள் உங்கள் கால்களில்’ என்று பன்மையாக்குதல்
  rationale: எபிரெய உரை பன்மையிலிருந்து ஒருமைக்கு திட்டவட்டமாக மாறுகிறது. இது இஸ்ரவேலை ஒரே மக்களாகக் கூட்டாக அழைப்பதாகவோ, ஒவ்வொருவரையும் தனித்தனியாகக் குறிக்கும் பகிர்வுப் பயன்பாடாகவோ இருக்கலாம். எந்த விளக்கத்தையும் உரைக்குள் உறுதிப்படுத்தாமல் மூலத்தின் பதற்றத்தையும் இரு சாத்தியங்களையும் ஒருமை வடிவம் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிதில் புரியும், ஆனால் கண்ணியமான நடை பயன்படுத்தப்பட்டது. ‘வழிநடத்தினேன்’, ‘வனாந்தரம்’, ‘தேய்ந்து போகவில்லை’ ஆகியவை மூலத்தின் பொருளையும் பயணச் சூழலையும் இயல்பாக வெளிப்படுத்துகின்றன. எபிரெயத்தின் பன்மை–ஒருமை மாற்றம் தமிழிலும் வெளிப்படையாகத் தக்கவைக்கப்பட்டது.
