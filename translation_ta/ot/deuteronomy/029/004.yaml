  source_fidelity: 'மூலத்தின் முக்கியப் பொருள் துல்லியமாக உள்ளது: கர்த்தர் இஸ்ரவேலரை நாற்பது ஆண்டுகள் வனாந்தரத்தில் நடத்தினார்; உடைகளும் காலணியும் தேயவில்லை. இறுதிக் கூறிலுள்ள எபிரெயப் பன்மை–ஒருமை மாற்றமும் தமிழில் பாதுகாக்கப்பட்டுள்ளது. ஆயினும் ‘உங்கள் உடலில் தேய்ந்து போகவில்லை’ என்பது உடைகள் உடலைத் தேய்க்கவில்லை என்ற தவறான அல்லது குழப்பமான வாசிப்பைத் தரக்கூடும்; உடைகள் அணிந்திருந்த நிலையிலும் அவை தேயவில்லை என்பதையே தெளிவாகச் சொல்ல வேண்டும்.'
  naturalness: ‘நீங்கள் அணிந்திருந்த உடைகள் தேய்ந்து போகவில்லை’ என்பது நவீனத் தரத் தமிழில் இயல்பாகவும் தெளிவாகவும் உள்ளது. அதேபோல் ‘உன் காலில் இருந்த காலணி’ என்பது காலணி காலில் அணியப்பட்டிருந்தபோதும் தேயவில்லை என்ற மூலப் படிமத்தைச் சீராகத் தருகிறது.
