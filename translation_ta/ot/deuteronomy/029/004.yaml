  to: நான் உங்களை நாற்பது ஆண்டுகள் வனாந்தரத்தில் வழிநடத்தினேன். நீங்கள் அணிந்திருந்த உங்கள் உடைகள் தேய்ந்து போகவில்லை; உன் காலில் இருந்த உன் காலணி தேய்ந்து போகவில்லை.[a]
  rationale: திருத்தம் எபிரெயத்தின் ‘உங்கள்மேல்/உன் காலின்மேல்’ என்ற அணிந்திருக்கும் உறவை இயல்பான தமிழில் வெளிப்படுத்துகிறது; அதே நேரத்தில் உடைகளுக்கான பன்மையையும் இறுதிக் காலணி, கால் ஆகியவற்றுக்கான ஒருமையையும் மாற்றாமல் பாதுகாக்கிறது. அடிக்குறிப்பு எண்ணிக்கை மாற்றத்தையும் அதன் சாத்தியமான செயல்பாட்டையும் விளக்குகிறது; ஒரு விளக்கத்தை உரையில் திணிக்கவில்லை.
