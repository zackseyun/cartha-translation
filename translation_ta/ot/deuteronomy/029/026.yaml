base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/026.yaml
  text: So the anger of Yahweh burned against that land, to bring upon it every curse written in this book.
translation:
  language: ta
  text: அதனால் யாவேயின் கோபம் அந்த நாட்டுக்கு எதிராகப் பற்றியெரிந்தது; இந்தப் புத்தகத்தில் எழுதப்பட்டுள்ள சாபம் முழுவதையும் அதன்மேல் கொண்டுவருவதற்காக யாவே அவ்வாறு செய்தார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּחַר אַף
  choice: கோபம் ... பற்றியெரிந்தது
  rationale: எபிரெய மொழியின் ‘கோபம் எரிதல்’ என்ற வலுவான உருவகத்தை இயல்பான நவீன தமிழில் தக்கவைக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரான நான்கெழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் வழக்கமான ஒலிபெயர்ப்பாக அளிக்கிறது.
- source_word: בָּאָרֶץ הַהִוא
  choice: அந்த நாட்டுக்கு எதிராக
  rationale: இந்தச் சூழலில் ב என்பது கோபம் செலுத்தப்படும் இலக்கைக் குறிக்கிறது; தீர்ப்பு நாட்டின்மேல் வருவதையும் இவ்வாசகம் தெளிவாக்குகிறது.
- source_word: לְהָבִיא עָלֶיהָ
  choice: அதன்மேல் அவர் வரச்செய்தார்
  rationale: ஹிஃபில் வினையின் காரணவினைப் பொருளைத் தக்கவைத்து, இறைவனே சாபத்தை நாட்டின்மேல் கொண்டுவந்தார் என்பதை இயல்பான தமிழில் சொல்கிறது.
- source_word: כָּל הַקְּלָלָה
  choice: சாபம் முழுவதையும்
  rationale: மூலத்தில் ‘சாபம்’ ஒருமையில் இருந்து, כָּל அதின் முழுமையைக் குறிக்கிறது. ‘ஒவ்வொரு சாபத்தையும்’ என்பதற்குப் பதில் இந்த ஒருமை-முழுமை அமைப்பைத் தக்கவைக்கிறது.
- source_word: הַכְּתוּבָה
  choice: எழுதப்பட்டுள்ள
  rationale: செயப்பாட்டு எச்சத்தின் நேரடியான பொருளையும், எழுத்துப் பதிவின் உடன்படிக்கை சார்ந்த வலிமையையும் காக்கிறது.
- source_word: בַּסֵּפֶר הַזֶּה
  choice: இந்தப் புத்தகத்தில்
  rationale: סֵפֶר என்பதற்கு இச்சூழலில் பொதுவாகவும் எளிதில் புரியுமாறும் ‘புத்தகம்’ பொருந்துகிறது; ‘சுருள்’ என்பது தேவையற்ற பொருள்வடிவக் குறிப்பைச் சேர்க்கும்.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: ஆண்டவர் / யெகோவா
  rationale: மூலவசனம் தனிப்பட்ட உடன்படிக்கைப் பெயரை நேரடியாகப் பயன்படுத்துகிறது. ‘யாவே’ என்பது அதை ஒரு பட்டமாக மாற்றாமல் ஒலிபெயர்க்கிறது.
- issue: כָּל הַקְּלָלָה என்பதன் ஒருமை மற்றும் மொத்தத்தன்மை
  choice: சாபம் முழுவதையும்
  alternative: ஒவ்வொரு சாபத்தையும்
  rationale: எபிரெயத்தில் ‘சாபம்’ ஒருமையில் உள்ளது; ஆகவே சாபத்தின் முழுத்தொகுப்பு அல்லது முழு விளைவு என்ற பதற்றத்தைத் தீர்க்காமல் காக்கும் வகையில் ஒருமையைப் பேணுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் dignified நடையில் மொழிபெயர்க்கப்பட்டது. ‘பற்றியெரிந்தது’ மூலத்தின் தீவிர உருவகத்தைப் பேணுகிறது; அரிதான அல்லது சமயப்பிரிவு சார்ந்த சொற்கள் தவிர்க்கப்பட்டுள்ளன.
