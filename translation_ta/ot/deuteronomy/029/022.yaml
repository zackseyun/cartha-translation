  source_fidelity: திருத்தம் தேவை. வரைவு நிலத்தின் பாழ்நிலையையும் விதைப்பு, முளைப்பு, தாவர வளர்ச்சி இல்லாமையையும் பெரும்பாலும் சரியாகத் தருகிறது. ஆனால் இறுதி வாக்கியத்தில் சேர்க்கப்பட்டுள்ள “அது இருக்கும்” மூலத்தின் உவமைத் தொடர்பைத் தளர்த்துகிறது; மேலும் “எரிந்துபோய்க் கிடக்கும்” என்பது שְׂרֵפָה-வின் ‘எரிப்பு/எரிந்த நிலை’ என்ற சுருக்கமான பெயர்ச்சொல் அமைப்பைத் தேவைக்கு அதிகமாக விளக்குகிறது.
  naturalness: “கந்தகமும் உப்புமாக, எரிந்துபோய்க் கிடக்கும்” என்ற தொடர் நவீனத் தமிழில் சற்றே முழுமையற்றதாக ஒலிக்கிறது. ‘கந்தகமும் உப்பும் எரிப்பும் அதன் நிலம் முழுவதும் இருக்கும்’ என்பது மூலத்தின் பட்டியலிடும் அமைப்பையும் தமிழின் இயல்பான வாக்கிய அமைப்பையும் காக்கிறது. ‘எந்தச் செடியும்’ என்பதற்குப் பதில் ‘எந்தப் புல்லும்’ என்பது עֵשֶׂב-க்கு நெருக்கமானது.
  terminology: யாவே, கந்தகம், உப்பு, கோபம், கடுஞ்சினம், மற்றும் இடப்பெயர்கள் ஏற்றவை. הפך என்ற சொல்லின் பெயர்ச்சொல்-வினைச் சொல்லுக்கிடையேயான தொடர்பை ‘கவிழ்த்துப்போட்ட ... அழிவு’ காக்கிறது. அடிக்குறிப்பு שְׂרֵפָה-வின் எரிதல் மற்றும் எரிந்த நிலை ஆகிய இரு சாத்தியங்களையும் திறந்தவண்ணம் வைக்கிறது.
