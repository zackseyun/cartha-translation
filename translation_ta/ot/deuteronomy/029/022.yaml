source:
  edition: WLC
  text: גָּפְרִ֣ית וָ/מֶלַח֮ שְׂרֵפָ֣ה כָל אַרְצָ/הּ֒ לֹ֤א תִזָּרַע֙ וְ/לֹ֣א תַצְמִ֔חַ וְ/לֹֽא יַעֲלֶ֥ה בָ֖/הּ כָּל עֵ֑שֶׂב כְּֽ/מַהְפֵּכַ֞ת סְדֹ֤ם וַ/עֲמֹרָה֙ אַדְמָ֣ה ו/צביים אֲשֶׁר֙ הָפַ֣ךְ יְהוָ֔ה בְּ/אַפּ֖/וֹ וּ/בַ/חֲמָתֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/022.yaml
  text: Sulfur and salt[a], a burning waste, are all its land; it is not sown, and it does not sprout, and no grass grows in it, like the overthrow of Sodom and Gomorrah, Admah and Zeboiim, which Yahweh overthrew in his anger and in his wrath.
translation:
  language: ta
  text: கந்தகமும் உப்பும் எரிப்பும் அதன் நிலம் முழுவதும் இருக்கும்[a]; அது விதைக்கப்படாது; அது எதையும் முளைக்கச் செய்யாது; அதில் எந்தப் புல்லும் முளைக்காது—யாவே தமது கோபத்திலும் கடுஞ்சினத்திலும் கவிழ்த்துப்போட்ட சோதோம், கொமோரா, அத்மா, செபோயீம் ஆகியவற்றின் அழிவைப்போல.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கந்தகமும் உப்பும், எரிந்த பாழ்நிலையும் அதன் நிலம் முழுவதும் இருக்கும்.” எபிரேயச் சொல்லுக்கு ‘எரிப்பு’ என்றும் ‘எரிந்த நிலை’ என்றும் பொருள் கொள்ளலாம்.
    reason: שְׂרֵפָה என்பதன் சுருக்கமான, ஓரளவு திறந்த பொருளைத் தக்கவைக்கிறது.
lexical_decisions:
- source_word: גָּפְרִית וָמֶלַח
  choice: கந்தகமும் உப்பும்
  rationale: இரு பொருட்களின் பெயர்களையும் நேரடியாக மொழிபெயர்த்து, நிலத்தின் பாழ்நிலையையும் விளைச்சலின்மையையும் சுட்டும் இணைப்பைப் பாதுகாக்கிறது.
- source_word: שְׂרֵפָה כָל אַרְצָהּ
  choice: அதன் நிலம் முழுவதும் ... எரிந்துபோய்க் கிடக்கும்
  rationale: שְׂרֵפָה என்பதன் எரிதல் அல்லது எரிந்த நிலை என்ற கருத்தையும், வினையில்லாத எபிரேய வாக்கியத்தின் விவரிப்புத் தன்மையையும் இயல்பான தமிழில் தருகிறது; மூலத்தின் சுருக்கமான அமைப்பு அடிக்குறிப்பில் காட்டப்படுகிறது.
- source_word: לֹא תִזָּרַע
  choice: அது விதைக்கப்படுவதில்லை
  rationale: நிலத்தையே எழுவாயாக வைத்துக்கொண்டு நிஃபால் வினையின் செயப்பாட்டு வடிவத்தைப் பாதுகாக்கிறது.
- source_word: וְלֹא תַצְמִחַ
  choice: எதையும் முளைக்கச் செய்வதில்லை
  rationale: ஹிஃபில் வடிவத்தின் ‘முளைக்கச் செய்தல்’ என்ற காரணவினைப் பொருளைத் தெளிவாகக் காட்டுகிறது.
- source_word: וְלֹא יַעֲלֶה בָהּ כָּל עֵשֶׂב
  choice: எந்தச் செடியும் அதில் வளராது
  rationale: עֵשֶׂב என்பதை இச்சூழலில் பொதுவான தாவர வளர்ச்சியாகக் கொண்டு, ‘மேலெழாது’ என்ற எபிரேய மொழிவழக்கை இயல்பான தமிழில் வழங்குகிறது.
- source_word: כְּמַהְפֵּכַת ... אֲשֶׁר הָפַךְ
  choice: கவிழ்த்துப்போட்ட ... அழிவைப் போல
  rationale: הפך வேர் தரும் கவிழ்த்தல் என்ற படிமத்தை வினையில் பாதுகாத்து, பெயர்ச்சொல்லான מַהְפֵּכָה-வின் பேரழிவு சார்ந்த பொருளை இயல்பான தமிழில் ‘அழிவு’ என வழங்குகிறது.
- source_word: סְדֹם וַעֲמֹרָה אַדְמָה וּצְבֹיִים
  choice: சோதோம், கொமோரா, அத்மா, செபோயீம்
  rationale: நவீனத் தமிழில் அறியப்பட்ட மற்றும் மூல ஒலிகளுக்கு நெருக்கமான பெயரெழுத்தாக்கங்கள் பயன்படுத்தப்பட்டுள்ளன.
- source_word: יְהוָה
  choice: யாவே
  rationale: திருநான்கெழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் தெளிவான தனிப்பெயர் வடிவில் தருகிறது.
- source_word: בְּאַפּוֹ וּבַחֲמָתוֹ
  choice: தமது கோபத்திலும் கடுஞ்சினத்திலும்
  rationale: இரு இணையான சொற்களின் தீவிரத்தையும் வேறுபாட்டையும் காத்து, இறைவனைச் சுட்டும் மரியாதை ஒருமை நடை பயன்படுத்தப்படுகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைபெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர் / ஆண்டவர்
  rationale: மூலத்தில் பட்டமல்ல, உடன்படிக்கையின் தனிப்பெயரான திருநான்கெழுத்துப் பெயரே உள்ளது; ஆகவே அதைத் தமிழில் பெயரெழுத்தாக்கமாக வழங்குகிறது.
- issue: இறைக் கோபத்தைக் குறிக்கும் இணைச்சொற்கள்
  choice: கோபத்திலும் கடுஞ்சினத்திலும்
  alternative: கோபத்தில்
  rationale: אַף மற்றும் חֵמָה ஆகிய இரு சொற்களையும் ஒன்றாகச் சுருக்காமல், மூலத்தின் தீவிரத்தையும் இறையியல்சார் பதற்றத்தையும் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் நடை. பாழ்நிலத்தின் மூன்று அடுக்குகள்—விதைக்கப்படாமை, முளைக்கச் செய்யாமை, செடி வளராமை—தனித்தனியாகப் பாதுகாக்கப்பட்டுள்ளன; இடப்பெயர்களும் இறைபெயரும் தமிழில் பெயரெழுத்தாக்கப்பட்டுள்ளன.
