revisions:
- from: அதன் நிலம் முழுவதும் கந்தகமும் உப்புமாக, எரிந்துபோய்க் கிடக்கும்[a]. அது விதைக்கப்படுவதில்லை; எதையும் முளைக்கச் செய்வதில்லை; எந்தச் செடியும் அதில் வளராது. யாவே தமது கோபத்திலும் கடுஞ்சினத்திலும் கவிழ்த்துப்போட்ட சோதோம், கொமோரா, அத்மா, செபோயீம் ஆகியவற்றின் அழிவைப் போல அது இருக்கும்.
  to: கந்தகமும் உப்பும் எரிப்பும் அதன் நிலம் முழுவதும் இருக்கும்[a]; அது விதைக்கப்படாது; அது எதையும் முளைக்கச் செய்யாது; அதில் எந்தப் புல்லும் முளைக்காது—யாவே தமது கோபத்திலும் கடுஞ்சினத்திலும் கவிழ்த்துப்போட்ட சோதோம், கொமோரா, அத்மா, செபோயீம் ஆகியவற்றின் அழிவைப்போல.
  rationale: திருத்தம் எபிரேயத்தின் வினையில்லா தொடக்கப் பட்டியலைத் தமிழில் தெளிவாக அமைக்கிறது; மூன்று தொடர்ச்சியான விளைச்சலின்மை வினைத் தொடர்களையும் காக்கிறது; உவமையை நிலத்தின் பாழ்நிலைக்கு நேரடியாக இணைக்கிறது. இறைபெயர், இடப்பெயர்கள், மற்றும் கோபத்திற்கான இரட்டைச் சொற்கள் பாதுகாக்கப்பட்டுள்ளன.
