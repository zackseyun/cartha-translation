source:
  edition: WLC
  text: וְ/הָיָ֡ה בְּ/שָׁמְע/וֹ֩ אֶת דִּבְרֵ֨י הָֽ/אָלָ֜ה הַ/זֹּ֗את וְ/הִתְבָּרֵ֨ךְ בִּ/לְבָב֤/וֹ לֵ/אמֹר֙ שָׁל֣וֹם יִֽהְיֶה לִּ֔/י כִּ֛י בִּ/שְׁרִר֥וּת לִבִּ֖/י אֵלֵ֑ךְ לְמַ֛עַן סְפ֥וֹת הָ/רָוָ֖ה אֶת הַ/צְּמֵאָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/018.yaml
  text: and when he hears the words of this oath[a], he blesses himself in his heart, saying, ‘I will have peace[b], though I walk in the stubbornness of my heart’—so as to sweep away the well-watered with the thirsty.
translation:
  language: ta
  text: இந்த ஆணையுறுதியின் வார்த்தைகளை[a] அவன் கேட்கும்போது, தன் உள்ளத்தில் தன்னையே ஆசீர்வதித்துக்கொண்டு, ‘நான் என் இதயத்தின் பிடிவாதத்தின்படி நடந்தாலும் எனக்கு நலமே உண்டாகும்’ என்று கூறுவான்—நன்கு நீருற்றதையும் தாகமுள்ளதோடு அழித்தொழிப்பதற்காக.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘இந்தச் சாபத்தின் வார்த்தைகளை.’ எபிரெயச் சொல் சாபத்தை உள்ளடக்கிய ஆணையுறுதியைக் குறிக்கலாம்.
    reason: alternative_reading
  - marker: b
    text: இந்தக் கடினமான எபிரெய உருவகத்தை, ‘நீரூட்டப்பட்ட நிலத்தையும் வறண்ட நிலத்தையும் ஒன்றாக அழித்தொழிப்பதற்காக’ என்றும் புரிந்துகொள்ளலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאָלָה
  choice: ஆணையுறுதி
  rationale: இந்த எபிரெயச் சொல் சாபத் தண்டனையை உள்ளடக்கிய ஆணையைக் குறிக்கலாம். உடன்படிக்கைச் சூழலில் ‘ஆணையுறுதி’ என்பது சத்தியப்பிரமாணத்தின் வலிமையை இயல்பான தமிழில் தருகிறது; ‘சாபம்’ என்ற மாற்றுப் பொருள் அடிக்குறிப்பில் வைக்கப்படுகிறது.
- source_word: וְהִתְבָּרֵךְ בִּלְבָבוֹ
  choice: தன் உள்ளத்தில் தன்னையே ஆசீர்வதித்துக்கொண்டு
  rationale: வினையின் தன்முகப் பொருளையும், அந்த மனிதன் தனக்குத்தானே நன்மையை உறுதிப்படுத்திக்கொள்ளும் முரணான தன்னம்பிக்கையையும் பாதுகாக்கிறது.
- source_word: שָׁלוֹם יִהְיֶה לִּי
  choice: எனக்கு நலமே உண்டாகும்
  rationale: שָׁלוֹם இங்கு சமாதானம் மட்டுமல்லாமல் நல்வாழ்வு, பாதுகாப்பு ஆகியவற்றையும் குறிக்கிறது. ‘நலம்’ இந்த விரிவான பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: שְׁרִרוּת לִבִּי
  choice: என் இதயத்தின் பிடிவாதத்தின்படி
  rationale: கடின மனவுறுதியையும் கீழ்ப்படிய மறுக்கும் சுயவிருப்பத்தையும் நேரடியாக வெளிப்படுத்துகிறது.
- source_word: לְמַעַן
  choice: அழித்தொழிப்பதற்காக
  rationale: לְמַעַן குறிக்கும் நோக்கம் அல்லது நோக்கமுள்ள விளைவைத் தமிழில் ‘-ப்பதற்காக’ என்ற அமைப்பு பாதுகாக்கிறது.
- source_word: סְפוֹת
  choice: அழித்தொழிக்க
  rationale: உடன்படிக்கைத் தீர்ப்பின் சூழலில் இந்த வினை கூட்டிச் சேர்ப்பதைவிட முற்றிலும் அகற்றுதல் அல்லது அழித்தலைக் குறிக்கும் வாய்ப்பு அதிகம்.
- source_word: הָרָוָה אֶת־הַצְּמֵאָה
  choice: தாகமுள்ளதோடு நன்கு நீருற்றதையும்
  rationale: நீரால் நிறைந்தது மற்றும் தாகமுள்ளது என்ற எபிரெய உருவகத்தை விளக்கி முடிவுசெய்யாமல் பாதுகாக்கிறது. நிலத்தைக் குறிக்கும் மாற்றுப் புரிதல் அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: הָאָלָה என்பதிலுள்ள உடன்படிக்கை ஆணை–சாப உறவு
  choice: முதன்மை உரையில் ‘ஆணையுறுதி’
  alternative: சாபம்
  rationale: இந்தச் சொல் சாபத் தண்டனையைக் கொண்ட ஆணையைக் குறிக்க முடியும். முதன்மை உரை ஆணையின் வடிவத்தைப் பாதுகாக்கிறது; அதன் தண்டனைப் பரிமாணம் அடிக்குறிப்பில் வெளிப்படையாக வைக்கப்படுகிறது.
- issue: הָרָוָה אֶת־הַצְּמֵאָה என்ற கடினமான உருவகத்தின் பொருள்
  choice: ‘தாகமுள்ளதோடு நன்கு நீருற்றதையும்’ என்று உருவகத்தைப் பாதுகாத்தல்
  alternative: நீரூட்டப்பட்ட நிலத்தையும் வறண்ட நிலத்தையும் ஒன்றாக அழித்தல்
  rationale: இந்தச் சொற்றொடர் உண்மையிலேயே தெளிவற்றது. ஒரு குறிப்பிட்ட விளக்கத்தை முதன்மை உரையில் திணிக்காமல், சாத்தியமான நில உருவகத்தை அடிக்குறிப்பில் வழங்குவது மூலத்தின் பதற்றத்தைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘இதயம்,’ ‘ஆசீர்வதித்தல்,’ ‘ஆணையுறுதி’ ஆகியவை வேதாகமச் சூழலுக்கு ஏற்றிருந்தாலும் பொதுவாசகருக்குப் புரியக்கூடிய சொற்கள். கடைசிப் பகுதியின் அசாதாரண உருவகம் மூலத்தின் தெளிவின்மையைப் பாதுகாக்கும் வகையில் திட்டமிட்டு நேரடியாக வைக்கப்பட்டுள்ளது.
