base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/025.yaml
  text: and they went and served other gods and bowed down to them[a], gods whom they had not known and whom he had not allotted to them.
translation:
  language: ta
  text: அவர்கள் சென்று, அவர்கள் அறிந்திராததும் அவர் அவர்களுக்கு ஒதுக்கிக் கொடுக்காததுமான வேறு தெய்வங்களுக்குப் பணிவிடை செய்து, அவற்றின் முன் பணிந்தார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்களுக்கு ஒதுக்கப்படாத தெய்வங்கள்.” எபிரெயில் எழுவாய் வெளிப்படையாகக் கூறப்படவில்லை; ஒருமை வினையின் எழுவாய் கடவுளாக இருக்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֵּלְכוּ
  choice: அவர்கள் சென்று
  rationale: הלך என்பதன் அடிப்படைப் பொருளான ‘செல்’ என்பதையும், தொடர்ந்து வரும் செயல்களின் எபிரெய வரிசையையும் இது இயல்பான தமிழில் காக்கிறது.
- source_word: וַיַּעַבְדוּ
  choice: பணிவிடை செய்து
  rationale: עבד என்பது இங்கு ‘சேவை செய்/பணிவிடை செய்’ என்று பொருள்படும். அடுத்த வினை தனியாகப் பணிந்து வணங்கும் செயலைக் குறிப்பதால், இரண்டையும் ‘வணங்கினர்’ என்று ஒன்றாக்காமல் வேறுபாடு காக்கப்படுகிறது.
- source_word: אֱלֹהִים אֲחֵרִים
  choice: வேறு தெய்வங்கள்
  rationale: אֲחֵרִים என்பதன் நேரான பொருள் ‘வேறு’. ‘அந்நிய தெய்வங்கள்’ என்பதைக் காட்டிலும் இது மூலத்தின் சொல்லாட்சிக்கு நெருக்கமானது.
- source_word: וַיִּשְׁתַּחֲווּ לָהֶם
  choice: அவற்றின் முன் பணிந்தார்கள்
  rationale: שׁחה உடலைத் தாழ்த்திப் பணியும் காட்சியை வெளிப்படுத்துகிறது. ‘வணங்கினார்கள்’ என்று பொதுப்படுத்தாமல் அந்த உடல் சார்ந்த படிமம் காக்கப்படுகிறது.
- source_word: אֱלֹהִים אֲשֶׁר לֹא יְדָעוּם
  choice: அவர்கள் அறிந்திராத தெய்வங்கள்
  rationale: ידע இங்கு வெறும் தகவல் அறிதலைவிட அனுபவ அல்லது உறவு சார்ந்த அறிதலையும் உள்ளடக்கலாம். ‘அறிந்திராத’ என்பது அந்தப் பரப்பைத் திறந்தவாறே வைக்கிறது.
- source_word: וְלֹא חָלַק לָהֶם
  choice: அவர் அவர்களுக்கு ஒதுக்கிக் கொடுக்காத
  rationale: חלק என்பதற்கு ‘பகிர்ந்தளி/ஒதுக்கிக் கொடு’ என்பது பொருள். எபிரெயில் வெளிப்படையாகக் கூறப்படாத ஒருமை ஆண்பால் எழுவாயை, சூழலின்படி கடவுளைக் குறிக்கும் ‘அவர்’ எனத் தமிழில் தெளிவாக்குகிறது.
theological_decisions:
- issue: חָלַק என்ற ஒருமை வினையின் மறைமுக எழுவாய்
  choice: எழுவாய் கடவுளைக் குறிக்கும் எனக் கொண்டு, ‘அவர் அவர்களுக்கு ஒதுக்கிக் கொடுக்காத’ என்று மொழிபெயர்க்கப்பட்டது.
  alternative: ‘அவர்களுக்கு ஒதுக்கப்படாத’ என்ற செயப்பாட்டு வடிவில், செய்பவரை வெளிப்படுத்தாமல் மொழிபெயர்த்தல்.
  rationale: எபிரெயில் வெளிப்படையான எழுவாய் இல்லாவிட்டாலும் வினை மூன்றாம் நபர் ஆண்பால் ஒருமையில் உள்ளது. உபாகமத்தின் தெய்வீக ஒதுக்கீடு பற்றிய மொழிநடையும் உடனடிச் சூழலும் கடவுளை மறைமுக எழுவாயாகக் கொள்வதை ஆதரிக்கின்றன; இருப்பினும் இலக்கணத்தில் உள்ள மறைமுகத்தன்மை அடிக்குறிப்பில் தெரிவிக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன பொதுத்தமிழில், மரியாதையும் வேதாகமச் செறிவும் கொண்ட நடை பயன்படுத்தப்பட்டுள்ளது. ‘பணிவிடை செய்து’ மற்றும் ‘முன் பணிந்தார்கள்’ என்பவற்றால் மூலத்திலுள்ள இரு தனித்த வினைகளும் வேறுபடுத்தப்பட்டுள்ளன.
