  text: וְ/לֹֽא נָתַן֩ יְהוָ֨ה לָ/כֶ֥ם לֵב֙ לָ/דַ֔עַת וְ/עֵינַ֥יִם לִ/רְא֖וֹת וְ/אָזְנַ֣יִם לִ/שְׁמֹ֑עַ עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/003.yaml
  text: But Yahweh has not given you a heart to know[a], or eyes to see, or ears to hear, to this day.
translation:
  language: ta
  text: ஆனால் யாவே உங்களுக்கு அறிந்துகொள்ளும் இதயத்தையும், காணும் கண்களையும், கேட்கும் காதுகளையும் இந்நாள்வரை கொடுக்கவில்லை.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது: “மேலும் யாவே உங்களுக்கு அறிந்துகொள்ளும் இதயத்தையும், காணும் கண்களையும், கேட்கும் காதுகளையும் இந்நாள்வரை கொடுக்கவில்லை.”'
    reason: וְלֹא என்பதன் தொடக்க இணைப்பைச் சூழலுக்கேற்ப எதிர்மறைத் தொடர்புடைய ‘ஆனால்’ எனவும், எளிய தொடர்ச்சியான ‘மேலும்’ எனவும் மொழிபெயர்க்கலாம்.
lexical_decisions:
- source_word: וְלֹא
  choice: ஆனால் ... கொடுக்கவில்லை
  rationale: முந்தைய சூழலில் இஸ்ரவேலர் கண்டவற்றுக்கும் இங்கே கூறப்படும் உள்ளார்ந்த அறிதல் இல்லாமைக்கும் உள்ள எதிர்மறைத் தொடர்பை நவீனத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது; எபிரெயின் எளிய இணைப்பான ‘மேலும் ... இல்லை’ என்பதும் சாத்தியம்.
- source_word: נָתַן
  choice: கொடுக்கவில்லை
  rationale: எபிரெய நிறைவேற்ற வினையும் עַד הַיּוֹם הַזֶּה என்ற காலவரையறையும் சேர்ந்து, இந்நாள்வரை நீடித்த கொடுக்காமையைச் சுட்டுகின்றன.
- source_word: יְהוָה
  choice: யாவே
  rationale: திருப்பெயரான நான்கு எழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் புரிந்துகொள்ளத்தக்க ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: לֵב לָדַעַת
  choice: அறிந்துகொள்ளும் இதயம்
  rationale: לֵב என்பதன் ‘இதயம்’ என்ற உருவகத்தையும், ידע என்பதன் அடிப்படை ‘அறிதல்’ பொருளையும் காக்கிறது; இது வெறும் அறிவாற்றலைவிட உள்ளார்ந்த புரிதலையும் மனநிலையையும் உள்ளடக்கலாம்.
- source_word: וְעֵינַיִם לִרְאוֹת
  choice: காணும் கண்கள்
  rationale: எபிரெய இணைநிலையையும் உடல் உறுப்பின் உருவகத்தையும் சுருக்கமான, இயல்பான தமிழில் பாதுகாக்கிறது.
- source_word: וְאָזְנַיִם לִשְׁמֹעַ
  choice: கேட்கும் காதுகள்
  rationale: புலனுணர்வைத் தாண்டிய உணர்ந்து ஏற்றுக்கொள்ளும் கேட்பையும் சாத்தியமாக வைத்தபடி, மூல உருவகத்தை நேரடியாகக் காக்கிறது.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: இந்நாள்வரை
  rationale: கதையின் நிகழ்காலப் புள்ளிவரை அந்த நிலை நீடித்ததை இயல்பான தமிழில் தெரிவிக்கிறது.
theological_decisions:
- issue: இஸ்ரவேலரின் புரிதல் இல்லாமையில் இறைச் செயலாண்மை
  choice: அறியும் இதயம், காணும் கண்கள், கேட்கும் காதுகள் ஆகியவற்றை யாவே கொடுக்கவில்லை என்று நேரடியாக மொழிபெயர்க்கப்பட்டது.
  alternative: இதை யாவே அனுமதிக்கவில்லை அல்லது அவர்கள் தாமே புரிந்துகொள்ளவில்லை என்று மென்மைப்படுத்துதல்.
  rationale: மூல உரை கொடுக்காமையை யாவேவுக்கே வெளிப்படையாகக் கூறுகிறது. மனிதப் பொறுப்பும் இறைச் செயலாண்மையும் எவ்வாறு தொடர்புபடுகின்றன என்பதை வசனம் விளக்காததால், அந்த இறையியல் இழுவிசை தீர்க்கப்படாமல் காக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், கண்ணியமானதும் சாதாரண வாசகர்களுக்குப் புரியத்தக்கதுமான நடை. ‘இதயம்—கண்கள்—காதுகள்’ என்ற எபிரெய இணை அமைப்பும் உருவகமும் காக்கப்பட்டுள்ளன; செயற்கையான சொல்வரிசையைத் தவிர்க்க ‘இந்நாள்வரை’ தொடக்கத்தில் வைக்கப்பட்டுள்ளது.
