source:
  edition: WLC
  text: כִּֽי אַתֶּ֣ם יְדַעְתֶּ֔ם אֵ֥ת אֲשֶׁר יָשַׁ֖בְנוּ בְּ/אֶ֣רֶץ מִצְרָ֑יִם וְ/אֵ֧ת אֲשֶׁר עָבַ֛רְנוּ בְּ/קֶ֥רֶב הַ/גּוֹיִ֖ם אֲשֶׁ֥ר עֲבַרְתֶּֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/015.yaml
  text: For you know how we lived in the land of Egypt[a], and how we passed through the midst of the nations through which you passed.
translation:
  language: ta
  text: ஏனெனில், நாம் எகிப்து நாட்டில் எப்படி வாழ்ந்தோம் என்பதையும், நீங்கள் கடந்து வந்த நாடுகளின் நடுவே நாம் எப்படிக் கடந்து வந்தோம் என்பதையும் நீங்கள் அறிவீர்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய கூற்றுக்கான விளக்கக் காரணத்தை அறிமுகப்படுத்துகிறது; தமிழில் இயல்பாக அந்தத் தொடர்பைக் காட்டுகிறது.
- source_word: יְדַעְתֶּם
  choice: நீங்கள் அறிவீர்கள்
  rationale: கடந்தகால அனுபவத்தின் அடிப்படையில் கேட்போருக்கு இப்போது உள்ள அறிவை எபிரெய நிறைவுவினை குறிக்கிறது.
- source_word: אֵת אֲשֶׁר יָשַׁבְנוּ
  choice: நாம் ... எப்படி வாழ்ந்தோம் என்பதையும்
  rationale: சொல்லுக்குச் சொல் அமைப்பை விட, அறியப்பட்ட சூழலையும் அனுபவத்தையும் நவீன தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: בְּאֶרֶץ מִצְרָיִם
  choice: எகிப்து நாட்டில்
  rationale: ‘எகிப்து தேசத்தில்’ என்பதைவிட இன்றைய பொதுத் தமிழில் இயல்பாகவும், ‘எகிப்தில்’ என்பதைவிட எபிரெயச் சொற்றொடருக்கு நெருக்கமாகவும் உள்ளது.
- source_word: וְאֵת אֲשֶׁר עָבַרְנוּ
  choice: நாம் எப்படிக் கடந்து வந்தோம் என்பதையும்
  rationale: עבר என்பதன் நகர்வு சார்ந்த பொருளைப் பாதுகாக்கிறது; துன்பத்தை அனுபவித்தோம் என்ற கூடுதல் கருத்தைச் சேர்க்கவில்லை.
- source_word: בְּקֶרֶב הַגּוֹיִם
  choice: நாடுகளின் நடுவே
  rationale: בקרב என்பதன் ‘நடுவில்/மத்தியில்’ என்ற பொருளையும் பயணச் சூழலையும் இயல்பாகக் காட்டுகிறது.
- source_word: הַגּוֹיִם
  choice: நாடுகள்
  rationale: இங்கு பிற தேசங்களையோ மக்களினங்களையோ குறிக்கிறது; பிற்கால மதச்சார்புள்ள ‘புறஜாதிகள்’ என்ற சொல்லைத் தவிர்க்கிறது.
- source_word: אֲשֶׁר עֲבַרְתֶּם
  choice: நீங்கள் கடந்து வந்த
  rationale: ‘நாடுகள்’ என்பதை விளக்கும் தொடர்புச் சொல்லாகவும், கேட்போரின் சொந்தப் பயணத்தைக் குறிக்கும் நேரடி உரையாகவும் உள்ளது.
