translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளும் வகையில் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. எபிரெயில் உள்ள ‘கடந்து’ என்ற வினையின் மறுபயன்பாடு வலியுறுத்தலைப் பாதுகாக்க தமிழிலும் வைக்கப்பட்டுள்ளது.
