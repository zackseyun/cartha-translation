  text: לֶ֚חֶם לֹ֣א אֲכַלְתֶּ֔ם וְ/יַ֥יִן וְ/שֵׁכָ֖ר לֹ֣א שְׁתִיתֶ֑ם לְמַ֨עַן֙ תֵּֽדְע֔וּ כִּ֛י אֲנִ֥י יְהוָ֖ה אֱלֹהֵי/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/005.yaml
  text: You did not eat bread[a], and you did not drink wine or strong drink, so that you might know that I am Yahweh your God.
translation:
  language: ta
  text: நீங்கள் அப்பம் உண்ணவும் இல்லை; திராட்சரசமோ போதை தரும் பானமோ[a] அருந்தவும் இல்லை; நானே உங்கள் கடவுளாகிய யாவே என்பதை நீங்கள் அறிந்துகொள்ளும்படியாக.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மதுபானம்.” எபிரேயச் சொல் ஒரு குறிப்பிட்ட பானத்தை மட்டும் அல்லாமல், போதை தரும் புளிக்கவைக்கப்பட்ட பானங்களைப் பொதுவாகக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֶחֶם
  choice: அப்பம்
  rationale: இச்சொல்லின் அடிப்படைப் பொருள் ‘அப்பம்.’ சில இடங்களில் இது உணவைப் பொதுவாகக் குறிக்கலாம் என்றாலும், இங்கு திராட்சரசம் மற்றும் போதையூட்டும் பானத்துடன் வரும் நேரடியான சொல்லமைப்பை ‘அப்பம்’ நன்றாகப் பாதுகாக்கிறது.
- source_word: אֲכַלְתֶּם
  choice: நீங்கள் உண்ணவில்லை
  rationale: எபிரேய நிறைவுவினை வனாந்தர அனுபவத்தைப் பின்னோக்கிச் சுருக்கிக் கூறுகிறது; தமிழில் இறந்தகால எதிர்மறை இயல்பாக உள்ளது.
- source_word: יַיִן
  choice: திராட்சரசம்
  rationale: இது சொல்லின் வழக்கமான பொருள்; தமிழில் ‘திராட்சரசம்’ என்பது மதுவகையான wine-ஐத் தெளிவாகக் குறிக்கிறது.
- source_word: שֵׁכָר
  choice: போதையூட்டும் பானம்
  rationale: குறிப்பிட்ட ஒரே பானவகையைக் காட்டிலும், போதை தரும் புளிக்கவைக்கப்பட்ட பானங்களை விரிவாகக் குறிக்கும் எபிரேயச் சொல்லின் பொருளைப் பாதுகாக்கிறது.
- source_word: שְׁתִיתֶם
  choice: நீங்கள் அருந்தவில்லை
  rationale: பானங்களைப் பற்றிய கண்ணியமான, இயல்பான நவீனத் தமிழ் வினைச்சொல்.
- source_word: לְמַעַן
  choice: அறிந்துகொள்வதற்காக
  rationale: நோக்கம் அல்லது உத்தேசிக்கப்பட்ட விளைவைத் தெரிவிக்கும் எபிரேய இணைப்பின் வலிமையை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: תֵּדְעוּ
  choice: நீங்கள் அறிந்துகொள்ள
  rationale: சாதாரண தகவலறிவை மட்டும் அல்லாமல் உணர்ந்து அறிதலையும் ஏற்கக்கூடிய இயல்பான தமிழ் வடிவம்.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரான நான்கு எழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் பரவலாகப் புரிந்துகொள்ளக்கூடிய ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: אֱלֹהֵיכֶם
  choice: உங்கள் கடவுள்
  rationale: உடன்படிக்கை உறவைச் சுட்டும் இரண்டாம் நபர் பன்மை உடைமை அமைப்பை நேரடியாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலவசனம் ஒரு பட்டத்தை அல்ல, தெய்வீகத் தனிப்பெயரையே பயன்படுத்துகிறது. ஆகவே பெயரின் தன்மையைப் பாதுகாக்க ‘யாவே’ என ஒலிபெயர்க்கப்பட்டது.
- issue: לְמַעַן தொடங்கும் நோக்கக் கூற்றின் தொடர்பு
  choice: இது நடந்தது என்று தமிழில் வெளிப்படையாக்குதல்
  alternative: முந்தைய எதிர்மறை வினைகளுடன் மட்டும் நேரடியாக இணைத்தல்
  rationale: எபிரேயத்தில் நோக்கக் கூற்று முன் விவரிக்கப்பட்ட வனாந்தர அனுபவத்துடன் தொடர்புடையது; தமிழில் வாக்கியம் தொங்காமல் இருக்க ‘இது நடந்தது’ எனக் குறைந்தளவில் வெளிப்படையாக்கப்பட்டது. இதனால் நோக்கமா அல்லது விளைவா என்ற நுண்ணிய இடைவெளி முற்றிலும் நீக்கப்படவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. ‘உண்ணவில்லை/அருந்தவில்லை’ என்ற இணைச்சொற்கள் வசனத்தின் முறையான தொனியையும் எபிரேய இணை அமைப்பையும் பேணுகின்றன.
