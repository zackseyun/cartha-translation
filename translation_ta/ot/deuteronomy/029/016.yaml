  yaml_path: translation/ot/deuteronomy/029/016.yaml
  text: and you saw their detestable things and their idols[a], wood and stone, silver and gold[c][b], that were among them—
translation:
  language: ta
  text: அவர்களுடைய அருவருப்பான பொருட்களையும் சிலைகளையும்[a]—மரமும் கல்லும், வெள்ளியும் பொன்னும்—அவர்களோடு இருந்தவற்றை[b] நீங்கள் கண்டீர்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “சிலைகள்” என்பதற்கான எபிரெயச் சொல் இழிவும் அருவருப்பும் தொனிக்கும் மிகக் கடுமையான சொல்; அது “சாணச் சிலைகள்” போன்ற இழிவான உட்பொருளைக் கொண்டிருக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “அவர்களோடு இருந்தவற்றை” என்பது, முந்தைய வசனத்தில் குறிப்பிடப்பட்டு இஸ்ரவேலர் கடந்து வந்த பிற இன மக்களோடு இருந்தவற்றைக் குறிக்கிறது. “அவர்களிடையே இருந்தவற்றை” என்றும் மொழிபெயர்க்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: וַתִּרְאוּ
  choice: நீங்கள் கண்டீர்கள்
  rationale: ראה என்பதன் Qal wayyiqtol இரண்டாம் நபர் பன்மை வடிவம்; மோசே மக்களிடம் தொடர்ந்து உரையாற்றுவதால், தமிழில் இயல்பான இறந்தகாலப் பன்மை வடிவம் பயன்படுத்தப்பட்டது.
- source_word: שִׁקּוּצֵיהֶם
  choice: அருவருப்பான பொருட்கள்
  rationale: சிலைவழிபாட்டுச் சூழலில் வெறுப்புக்குரிய பொருட்களைக் குறிக்கும் வலுவான சொல்; அதன் மதிப்பீட்டுத் தீவிரத்தை நவீன தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: גִּלֻּלֵיהֶם
  choice: அவர்களுடைய சிலைகள்
  rationale: இது சிலைகளை இழிவாகக் குறிப்பிடும் சொல். முதன்மை உரையில் பொருள் தெளிவாக இருக்க ‘சிலைகள்’ எனவும், அதன் கடுமையான இழிவுப்பொருள் அடிக்குறிப்பிலும் தரப்பட்டது.
- source_word: עֵץ וָאֶבֶן כֶּסֶף וְזָהָב
  choice: மரமும் கல்லும், வெள்ளியும் பொன்னும்
  rationale: எபிரெய உரையின் பெயர்ச்சொல் பட்டியலை நேரடியாகப் பாதுகாக்கிறது; இவை சிலைகள் அல்லது அருவருப்பான வழிபாட்டுப் பொருட்களின் மூலப்பொருட்களைச் சுட்டுவதாக இயல்பாகப் புரிகின்றன.
- source_word: אֲשֶׁר עִמָּהֶם
  choice: அவர்களிடையே இருந்த
  rationale: முந்தைய வசனத்தில் குறிப்பிடப்பட்ட பிற இன மக்களிடையே அந்த வழிபாட்டுப் பொருட்கள் இருந்ததைச் சுட்டுகிறது; இஸ்ரவேலர் அவற்றை உடைமையாக வைத்திருந்தனர் என்ற தவறான எண்ணத்தைத் தவிர்க்கிறது.
theological_decisions:
- issue: சிலைவழிபாட்டுப் பொருட்களுக்கான இரண்டு இழிவுச் சொற்களின் மொழிபெயர்ப்பு
  choice: ‘அருவருப்பான பொருட்கள்’ மற்றும் ‘சிலைகள்’ என இரண்டையும் தனித்தனியாக வைத்தல்
  alternative: ‘அருவருப்புகள்’ மற்றும் ‘சாணச் சிலைகள்’
  rationale: மூலத்தில் உள்ள இரு வேறு இழிவுச் சொற்களையும் ஒன்றாக்காமல் பாதுகாக்கிறது; அதேவேளையில் சாதாரண வாசகருக்குப் புரியும் இயல்பான தமிழை வழங்குகிறது. இரண்டாவது சொல்லின் கடுமையான நுண்பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- issue: אֲשֶׁר עִמָּהֶם என்ற உறவுத்தொடரின் தொடர்பு
  choice: முந்தைய வசனத்தின் பிற இன மக்களோடு இணைத்து ‘அவர்களிடையே இருந்த’ என மொழிபெயர்த்தல்
  alternative: ‘அவர்களோடு இருந்த’ அல்லது ‘அவர்களுக்குச் சொந்தமான’
  rationale: சூழலில் அந்தப் பொருட்கள் இஸ்ரவேலரிடம் அல்ல, அவர்கள் கடந்து வந்த இன மக்களிடையே காணப்பட்டவை என்பதே இயல்பான வாசிப்பு; உடைமை என்பதை மூலத்துக்கு மேலாக வலியுறுத்தவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் வேதாகம உரைக்கு ஏற்ற கண்ணியமான நடையிலும் அமைக்கப்பட்டது. மூலத்தின் பொருட்பட்டியல் இடைக்கோடுகளால் தெளிவுபடுத்தப்பட்டுள்ளது; மதிப்பீட்டுச் சொற்களின் தீவிரமும் வேறுபாடும் பாதுகாக்கப்பட்டுள்ளன.
