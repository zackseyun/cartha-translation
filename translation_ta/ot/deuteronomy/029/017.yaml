base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/017.yaml
  text: lest there be among you a man or a woman[a], or a clan or a tribe, whose heart is turning away today from Yahweh our God to go and serve the gods of those nations; lest there be among you a root bearing poisonous fruit and wormwood.
translation:
  language: ta
  text: உங்களிடையே ஓர் ஆணோ பெண்ணோ, ஒரு குலமோ கோத்திரமோ இருந்து, அவருடைய அல்லது அதன் உள்ளம் இன்று நம் கடவுளாகிய யாவேயைவிட்டு விலகி, அந்த நாடுகளின் தெய்வங்களை வழிபடச் செல்லாதபடி கவனமாக இருங்கள். உங்களிடையே நஞ்சையும்[a] கசப்புச் செடியையும் விளைவிக்கும் வேர் இருந்துவிடாதபடியும் கவனமாக இருங்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயச் சொல்லை “பித்தநீர்” அல்லது “நச்சுச் செடி” என்றும் மொழிபெயர்க்கலாம்.
    reason: רֹאשׁ என்பது நஞ்சு, பித்தநீர் அல்லது ஒரு நச்சுச் செடியைக் குறிக்கக்கூடியதால் அதன் சொற்பொருள் நிச்சயமின்மையைப் பதிவு செய்கிறது.
lexical_decisions:
- source_word: פֶּן יֵשׁ בָּכֶם
  choice: உங்களிடையே ... இருந்துவிடாதபடி கவனமாக இருங்கள்
  rationale: פֶּן அறிமுகப்படுத்தும் எச்சரிக்கையின் நோக்கத்தை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது; எபிரெய உரையில் சூழலால் உணர்த்தப்படும் எச்சரிக்கை வலிமையை மட்டும் வெளிப்படையாக்குகிறது.
- source_word: אִישׁ אוֹ אִשָּׁה
  choice: ஓர் ஆணோ பெண்ணோ
  rationale: மூலத்தில் வெளிப்படையாக உள்ள ஆண்–பெண் இணையைப் பொதுப்படுத்தாமல் காக்கிறது.
- source_word: מִשְׁפָּחָה
  choice: குலம்
  rationale: இங்கு தனிக் குடும்பத்தைவிட விரிவான உறவினர் சமூக அலகைக் குறிக்கிறது.
- source_word: שֵׁבֶט
  choice: கோத்திரம்
  rationale: இஸ்ரவேலின் கோத்திர அலகைக் குறிக்கும் நிலையான, புரிந்துகொள்ளத்தக்க வேதாகமத் தமிழ் சொல்.
- source_word: לְבָבוֹ פֹנֶה
  choice: அவருடைய அல்லது அதன் உள்ளம் ... விலகி
  rationale: பங்கேற்பு வடிவம் காட்டும் நிகழ்ந்துகொண்டிருக்கும் அல்லது தொடங்கும் விலகலைக் காக்கிறது; தனிநபர் மற்றும் சமூகக் குழு ஆகிய இருவகை முன்னோடிகளுக்கும் ஏற்ற சுட்டுப்பெயர்கள் பயன்படுத்தப்பட்டுள்ளன.
- source_word: יְהוָה אֱלֹהֵינוּ
  choice: நம் கடவுளாகிய யாவே
  rationale: உடன்படிக்கைப் பெயரான יהוה என்பதை ஒலிபெயர்த்து, אֱלֹהֵינוּ என்பதிலுள்ள ‘நம் கடவுள்’ உறவையும் காக்கிறது.
- source_word: לָלֶכֶת לַעֲבֹד
  choice: வழிபடச் செல்ல
  rationale: ‘சென்று சேவித்தல்’ என்ற எபிரெய நோக்கக் கட்டமைப்பை இயல்பான தமிழில் தருகிறது; அந்நிய தெய்வங்களுக்கு ஆற்றும் சமயச் சேவையை ‘வழிபடுதல்’ தெளிவாக வெளிப்படுத்துகிறது.
- source_word: אֱלֹהֵי הַגּוֹיִם הָהֵם
  choice: அந்த நாடுகளின் தெய்வங்கள்
  rationale: גּוֹיִם என்பதைக் குறிப்பிட்ட சுற்றுப்புற நாடுகள்/மக்கள் குழுக்களாகச் சூழலுக்கேற்ப தருகிறது.
- source_word: שֹׁרֶשׁ פֹּרֶה רֹאשׁ וְלַעֲנָה
  choice: நஞ்சையும் எட்டியையும் விளைவிக்கும் வேர்
  rationale: ‘வேர் விளைவித்தல்’ என்ற உருவகத்தையும், רֹאשׁ மற்றும் לַעֲנָה என்ற இரு தீங்கு/கசப்பு விளைபொருட்களையும் தேவையற்ற ‘பழம்’ சேர்க்காமல் காக்கிறது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூல உரையில் நேரடியாக வரும் உடன்படிக்கைப் பெயரை பொதுப் பட்டமாக மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
- issue: ‘உள்ளம் விலகுதல்’ என்பதன் காலநிலை
  choice: இன்று ... விலகி
  alternative: இன்று விலகிவிட்ட
  rationale: פֹנֶה என்ற பங்கேற்பு வடிவம் முடிந்துபோன செயலாக மட்டும் அல்லாமல் தற்போது நிகழும் அல்லது தொடங்கும் உடன்படிக்கைத் துரோகத்தையும் குறிக்க இடமளிக்கிறது.
- issue: வேர் உருவகத்தின் தீங்கு
  choice: நஞ்சையும் எட்டியையும் விளைவிக்கும்
  alternative: நச்சுப் பழத்தையும் எட்டியையும் விளைவிக்கும்
  rationale: மூலத்தில் ‘பழம்’ வெளிப்படையாக இல்லை; ஆகவே அதைச் சேர்க்காமல், மறைந்துள்ள ஒரு மூலத்திலிருந்து தீங்கு உருவாகும் உருவகத் தீவிரத்தைக் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் மரியாதையான நடையில் வடிவமைக்கப்பட்டது. ‘யாவே’, ‘குலம்’, ‘கோத்திரம்’ ஆகியவை உடன்படிக்கை மற்றும் சமூக அமைப்பின் தனித்துவத்தைப் பாதுகாக்கின்றன. நீண்ட எபிரெய எச்சரிக்கைத் தொடர் தமிழில் இரண்டு வாக்கியங்களாகப் பிரிக்கப்பட்டாலும், இருமுறை வரும் פֶּן என்பதன் இணை எச்சரிக்கை அமைப்பு காக்கப்பட்டுள்ளது.
