  text: כִּי֩ אֶת אֲשֶׁ֨ר יֶשְׁנ֜/וֹ פֹּ֗ה עִמָּ֨/נוּ֙ עֹמֵ֣ד הַ/יּ֔וֹם לִ/פְנֵ֖י יְהוָ֣ה אֱלֹהֵ֑י/נוּ וְ/אֵ֨ת אֲשֶׁ֥ר אֵינֶ֛/נּוּ פֹּ֖ה עִמָּ֥/נוּ הַ/יּֽוֹם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/014.yaml
  text: but with whoever is standing here with us today before Yahweh our God[a], and with whoever is not here with us today.
translation:
  language: ta
  text: ஆனால், இன்று நம்மோடு இங்கே நம் கடவுளாகிய யாவேக்கு முன்பாக நிற்கிறவர்களுடனும், இன்று நம்மோடு இங்கே இல்லாதவர்களுடனும்[a] இந்த உடன்படிக்கையையும் ஆணையையும் ஏற்படுத்துகிறேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘இன்று நம்மோடு இங்கே இல்லாதவர்கள்’ என்பது இந்தக் கூட்டத்திற்கு வராத இஸ்ரவேலர்களையோ, வருங்காலத் தலைமுறையினரையோ, அல்லது இரு தரப்பினரையுமோ குறிக்கலாம்.
    reason: மூல உரை குறிப்பிடும் நபர்களின் வரம்பைத் திட்டவட்டமாக வரையறுக்காததால், முக்கியமான மாற்று விளக்கங்களைச் சுட்டுகிறது.
lexical_decisions:
- source_word: כִּי
  choice: மாறாக
  rationale: முந்தைய வசனத்திலுள்ள ‘உங்களோடு மட்டும் அல்ல’ என்ற மறுப்பைத் தொடர்ந்து, இங்கு காரணத்தை அல்ல எதிர்மறைத் தொடர்ச்சியைச் சுட்டுகிறது.
- source_word: אֶת אֲשֶׁר
  choice: எவர்களோடும் / அவர்களோடும்
  rationale: உடன்படிக்கையில் சேர்க்கப்படும் நபர்களைக் குறிக்கிறது. தமிழில் இயல்பான பன்மை வடிவம் பயன்படுத்தப்பட்டாலும், ஒவ்வொருவரையும் உள்ளடக்கும் எபிரெயச் சொல்லின் விரிந்த பொருள் காக்கப்படுகிறது.
- source_word: יֶשְׁנוֹ ... אֵינֶנּוּ
  choice: இருக்கிறவர்கள் ... இல்லாதவர்கள்
  rationale: இருப்பு மற்றும் இன்மையை நேரடியாகக் காட்டுகிறது; ‘வருங்காலத் தலைமுறையினர்’ போன்ற விளக்கத்தை மூல உரைக்குள் சேர்க்கவில்லை.
- source_word: פֹּה עִמָּנוּ
  choice: நம்மோடு இங்கே
  rationale: கூட்டத்தில் உடல்ரீதியாக இருப்பதையும் ‘நம்மோடு’ என்ற உறவுநிலையையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: עֹמֵד
  choice: நிற்கிறவர்கள்
  rationale: கடவுளின் முன்னிலையில் கூடியிருப்பதைக் குறிக்கும் நேரடியான, உருவகத் தெளிவுடைய மொழிபெயர்ப்பு.
- source_word: הַיּוֹם
  choice: இன்று
  rationale: இரு கூறுகளிலும் காலக் குறிப்பைத் தெளிவாகவும் நவீன தமிழிலும் தருகிறது.
- source_word: לִפְנֵי
  choice: முன்பாக
  rationale: இடத்தையும் கடவுளின் சந்நிதியில் இருப்பதையும் சுருக்கமாகக் காக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய மூலத்தில் உள்ள கடவுளின் தனிப்பெயரைப் பட்டப்பெயராக மாற்றாமல் தமிழ் ஒலிபெயர்ப்பில் தருகிறது.
- source_word: אֱלֹהֵינוּ
  choice: நம் கடவுள்
  rationale: முதலாம் நபர் பன்மை உடைமை விகுதியை நேரடியாகவும் இயல்பாகவும் மொழிபெயர்க்கிறது.
theological_decisions:
- issue: ‘இன்று நம்மோடு இங்கே இல்லாதவர்கள்’ என்பதன் வரம்பு
  choice: யாரைக் குறிக்கிறது என்பதை முதன்மை உரையில் குறிப்பிடாமல் திறந்த நிலையில் வைத்தல்
  alternative: கூட்டத்திற்கு வராத இஸ்ரவேலர்கள், வருங்காலத் தலைமுறையினர், அல்லது இரு குழுவினரும் என்று குறிப்பாக விளக்குதல்
  rationale: எபிரெய உரை அந்த நபர்களைத் துல்லியமாக அடையாளப்படுத்தவில்லை. ஆகவே அதன் உண்மையான பொருள் விரிவையும் இறையியல் பதற்றத்தையும் மொழிபெயர்ப்பு தீர்த்துவிடாமல் காக்கிறது.
- issue: முந்தைய வசனத்திலிருந்து தொடரும் உடன்படிக்கைச் செயல்
  choice: தமிழில் வாக்கியத்தை நிறைவு செய்ய ‘இந்த உடன்படிக்கையைச் செய்கிறேன்’ என்பதை முந்தைய வசனத்திலிருந்து பொருளடிப்படையில் நிரப்புதல்
  alternative: எபிரெயத்தைப் போல வினையில்லாத தொடர்கூறாக விடுதல்
  rationale: 14ஆம் வசனம் எபிரெயத்தில் 12–13ஆம் வசனங்களின் வாக்கிய அமைப்பைத் தொடர்கிறது. தனி வசனமாக வாசிக்கும்போது தமிழில் பொருள் தெளிவாக இருக்க இந்நிரப்பு தேவை; புதிய இறையியல் கருத்தை இது சேர்ப்பதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதாகவும் உடன்படிக்கைச் சூழலுக்கேற்ற கண்ணியத்துடனும் அமைக்கப்பட்டது. ‘யாவே’ என்ற தனிப்பெயர் பாதுகாக்கப்பட்டது; ‘நிற்கிறவர்கள்’ என்ற தெளிவான காட்சி மொழியும் மூலத்தின் இரு கூறுகளுக்கிடையிலான இணை அமைப்பும் காக்கப்பட்டன.
