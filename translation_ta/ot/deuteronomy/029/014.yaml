revisions:
- from: மாறாக, இன்று நம்மோடு இங்கே நம் கடவுளாகிய யாவேக்கு முன்பாக நிற்கிறவர்களோடும், இன்று நம்மோடு இங்கே இல்லாதவர்களோடும்[a] இந்த உடன்படிக்கையைச் செய்கிறேன்.
  to: ஆனால், இன்று நம்மோடு இங்கே நம் கடவுளாகிய யாவேக்கு முன்பாக நிற்கிறவர்களுடனும், இன்று நம்மோடு இங்கே இல்லாதவர்களுடனும்[a] இந்த உடன்படிக்கையையும் ஆணையையும் ஏற்படுத்துகிறேன்.
