  text: the great trials that your eyes saw[a], those great signs and wonders.
translation:
  language: ta
  text: உங்கள் கண்கள் கண்ட பெரும் சோதனைகள்[a]—அந்தப் பெரும் அடையாளங்களையும் அற்புதங்களையும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘பெரும் பரிசோதனைகள்.’ பழைய ஆங்கில மொழிபெயர்ப்புகளில் சில ‘பெரும் சோதித்தல்கள்’ என்பதற்குப் பதிலாக, பாவம் செய்யத் தூண்டுதல் என்ற பொருளைத் தரக்கூடிய சொல்லைப் பயன்படுத்துகின்றன. ஆனால் இங்கே பொருள் சோதித்தல் அல்லது மெய்ப்பித்தலே; பாவம் செய்யத் தூண்டுதல் அல்ல.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּסּוֹת
  choice: சோதனைகள்
  rationale: மַסּוֹת என்பது ஒருவரையோ ஒன்றையோ சோதித்து மெய்ப்பிக்கும் நிகழ்வுகளைக் குறிக்கிறது. நவீன தமிழில் ‘சோதனைகள்’ இயல்பாகவும் தெளிவாகவும் உள்ளது; பாவம் செய்யத் தூண்டும் ‘temptations’ என்ற பொருளை இது புகுத்தாது.
- source_word: הַגְּדֹלֹת
  choice: பெரும்
  rationale: சோதனைகளின் அளவையும் முக்கியத்துவத்தையும் வலியுறுத்தும் பெயரடையாக இருப்பதால், இயல்பானவும் கண்ணியமானவும் உள்ள ‘பெரும்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: אֲשֶׁר רָאוּ עֵינֶיךָ
  choice: உங்கள் கண்கள் கண்ட
  rationale: எபிரெய மொழியில் ‘உங்கள் கண்கள் கண்ட’ என்ற நேரடி சாட்சியத்தை வலியுறுத்தும் சொல்லாட்சி உள்ளது. வெறுமனே ‘நீங்கள் கண்ட’ என்று சுருக்காமல் அதன் அழுத்தம் காக்கப்பட்டது. ஒருமை வடிவில் இஸ்ரவேல் மக்களைக் கூட்டாக அழைப்பதை இயல்பான நவீன தமிழில் ‘உங்கள்’ என வழங்குகிறது.
- source_word: הָאֹתֹת
  choice: அந்த அடையாளங்கள்
  rationale: אוֹת என்பது இச்சூழலில் கடவுளின் செயல்களைச் சுட்டிக்காட்டும் ‘அடையாளம்’ எனப் பொருள்படும்; הָ என்ற சுட்டும் வலிமையை ‘அந்த’ வெளிப்படுத்துகிறது.
- source_word: וְהַמֹּפְתִים
  choice: அந்தப் அற்புதங்கள்
  rationale: מוֹפֵת என்பது வியப்பூட்டும் தெய்வீகச் செயலைக் குறிக்கிறது. ‘அற்புதங்கள்’ என்பது நவீன தமிழில் தெளிவானதும் ‘அடையாளங்கள்’ என்பதுடன் இயல்பாக இணைவதும் ஆகும்.
- source_word: הַגְּדֹלִים הָהֵם
  choice: அந்தப் பெரும்
  rationale: எபிரெய உரையில் ஆண்பால் பன்மை வடிவிலுள்ள பெயரடை மற்றும் சுட்டுப்பெயர் அருகிலுள்ள ‘அற்புதங்கள்’ என்பதோடு இலக்கண ரீதியாகப் பொருந்துகின்றன. ஆகவே ‘பெரும்’ என்பது அற்புதங்களை நேரடியாக விவரிக்கவும், ‘அந்த’ சுட்டும் வலிமையைக் காக்கவும் அமைக்கப்பட்டது.
