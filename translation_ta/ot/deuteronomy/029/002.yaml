translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான நடை பயன்படுத்தப்பட்டது. நேரடி சாட்சியை வலியுறுத்தும் ‘உங்கள் கண்கள் கண்ட’ என்ற எபிரெய சொல்லாட்சி தக்கவைக்கப்பட்டது. கோடு, முதலில் கூறப்படும் சோதனைகளுக்கும் பின்னர் அவற்றை விளக்கும் அடையாளங்களுக்கும் அற்புதங்களுக்கும் இடையிலான appositional தொடர்பைத் தெளிவாக்குகிறது.
