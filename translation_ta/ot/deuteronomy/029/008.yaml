language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וּ/שְׁמַרְתֶּ֗ם אֶת דִּבְרֵי֙ הַ/בְּרִ֣ית הַ/זֹּ֔את וַ/עֲשִׂיתֶ֖ם אֹתָ֑/ם לְמַ֣עַן תַּשְׂכִּ֔ילוּ אֵ֖ת כָּל אֲשֶׁ֥ר תַּעֲשֽׂוּ/ן־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/008.yaml
  text: So keep the words of this covenant and do them[a], so that you may act wisely in all that you do.
translation:
  language: ta
  text: எனவே, இந்த உடன்படிக்கையின் வார்த்தைகளைக் கடைப்பிடித்து, அவற்றின்படி செய்யுங்கள். அப்போது நீங்கள் செய்யும் எல்லாவற்றிலும் விவேகமாகச் செயல்படுவீர்கள்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நீங்கள் செய்யும் எல்லாவற்றிலும் வெற்றி பெறுவீர்கள்”; அல்லது, “செழிப்படைவீர்கள்.”
    reason: תַּשְׂכִּילוּ என்பது விவேகமாகச் செயல்படுதல் என்பதையும், அதனால் வெற்றி அல்லது செழிப்பு அடைதல் என்பதையும் குறிக்கக்கூடும்.
lexical_decisions:
- source_word: וּ/שְׁמַרְתֶּם
  choice: கடைப்பிடித்து
  rationale: உடன்படிக்கைச் சூழலில் שׁמר என்பது அதன் கட்டளைகளையும் கடமைகளையும் காத்துக் கடைப்பிடிப்பதைக் குறிக்கிறது; ‘கடைப்பிடித்து’ என்பது நவீன தமிழில் இயல்பாகவும் உடன்படிக்கையின் கடமை உணர்வைத் தெளிவாகவும் தருகிறது.
- source_word: דִּבְרֵי הַ/בְּרִית הַ/זֹּאת
  choice: இந்த உடன்படிக்கையின் வார்த்தைகளை
  rationale: דברים என்பதன் ‘வார்த்தைகள்’ என்ற வடிவத்தைத் தக்கவைத்து, அதை விளக்கமாக ‘நிபந்தனைகள்’ என்று மாற்றாமல் மூலத்தின் உருவகத்தையும் குறிப்பையும் பாதுகாக்கிறது.
- source_word: וַ/עֲשִׂיתֶם אֹתָם
  choice: அவற்றின்படி செய்யுங்கள்
  rationale: אֹתָם என்ற பன்மைச் சுட்டு ‘வார்த்தைகள்’ என்பதைக் குறிக்கிறது. தமிழில் ‘அவற்றைச் செய்யுங்கள்’ என்பது இயல்பற்றதால், பன்மைத் தொடர்பைத் தக்கவைத்தபடி நடைமுறைப்படுத்தும் பொருளை ‘அவற்றின்படி செய்யுங்கள்’ என இயல்பாக வெளிப்படுத்துகிறது.
- source_word: לְמַעַן
  choice: அப்போது
  rationale: கீழ்ப்படிதலைத் தொடர்ந்து எதிர்பார்க்கப்படும் நோக்கம் அல்லது விளைவை இயல்பான தமிழில் இணைக்கிறது; கடினமான நோக்கவாக்கிய அமைப்பைத் தவிர்க்கிறது.
- source_word: תַּשְׂכִּילוּ
  choice: விவேகமாகச் செயல்படுவீர்கள்
  rationale: שׂכל என்பதன் ஹிஃபில் வடிவத்தில் உள்ள விவேகமான நடத்தை என்ற மைய நுணுக்கத்தை நேரடியாக வெளிப்படுத்துகிறது; அதனுடன் தொடர்புடைய வெற்றி என்ற சாத்தியமான பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: אֵת כָּל אֲשֶׁר תַּעֲשׂוּן
  choice: நீங்கள் செய்யும் எல்லாவற்றிலும்
  rationale: כָּל אֲשֶׁר என்பதன் முழுமையான பரப்பையும், விவேகமான செயல் நிகழும் துறையையும் இயல்பான தமிழில் தருகிறது.
- source_word: וְ
  choice: எனவே
  rationale: முந்தைய உடன்படிக்கை வரலாற்றிலிருந்து வரும் முடிவு அல்லது அறிவுறுத்தல் தொடர்பைத் தெளிவுபடுத்துகிறது.
theological_decisions:
- issue: תַּשְׂכִּילוּ என்பதில் விவேகமான செயலும் வெற்றிகரமான விளைவும் இடையே உள்ள பொருள் நெருக்கம்
  choice: முதன்மை உரையில் ‘விவேகமாகச் செயல்படுவீர்கள்’
  alternative: ‘வெற்றி பெறுவீர்கள்’ அல்லது ‘செழிப்படைவீர்கள்’
  rationale: எபிரெயச் சொல்லின் ஞானம் சார்ந்த செயற்பாட்டு நுணுக்கத்தை முதன்மை உரை நேரடியாகப் பாதுகாக்கிறது. உடன்படிக்கைக்குக் கீழ்ப்படிவதால் கிடைக்கும் வெற்றி அல்லது செழிப்பு என்ற விளைவு சாத்தியத்தை மறுக்காமல் அடிக்குறிப்பில் தருவது, உரையின் இறையியல் பதற்றத்தை ஒருபக்கமாகத் தீர்க்காமல் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. பன்மை முன்னிலையை மரியாதை/பன்மை வினைமுற்றுகள் தக்கவைக்கின்றன. மூலத்தின் சொற்தொடரை முற்றிலும் மரவுரையாக மாற்றாமல், ‘அவற்றின்படி செய்யுங்கள்’ என்று தமிழுக்கு இயல்பாக்கப்பட்டுள்ளது.
