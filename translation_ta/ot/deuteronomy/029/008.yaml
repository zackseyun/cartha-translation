  terminology: “உடன்படிக்கை,” “கடைப்பிடித்து,” and “விவேகமாகச் செயல்படுவீர்கள்” are appropriate and consistent covenantal and ethical terminology. The footnote is clearly anchored and gives alternatives without doctrinal overstatement.
