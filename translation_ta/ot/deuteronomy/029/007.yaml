base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/007.yaml
  text: and we took their land and gave it as an inheritance to the Reubenites[a], the Gadites, and the half-tribe of the Manassites.
translation:
  language: ta
  text: அவர்களுடைய நாட்டை நாம் எடுத்துக்கொண்டு, அதை ரூபனியருக்கும் காதியருக்கும் மனாசேயரின் அரைக் கோத்திரத்திற்கும் மரபுரிமையாகக் கொடுத்தோம்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַנִּקַּח
  choice: நாம் கைப்பற்றி
  rationale: לקח என்பதன் அடிப்படைப் பொருள் ‘எடுத்துக்கொள்’; தோற்கடிக்கப்பட்ட அரசர்களின் நிலத்தைப் பெறும் போர்ச் சூழலில் ‘கைப்பற்றி’ என்பது இயல்பான தமிழாகவும், தேவையற்ற வன்முறை நுணுக்கத்தைச் சேர்க்காமலும் உள்ளது.
- source_word: אַרְצָם
  choice: அவர்களுடைய நாட்டை
  rationale: אֶרֶץ இங்கு முன்சூழலில் குறிப்பிடப்பட்ட அரசர்களுக்குரிய ஆட்சிப்பகுதியைக் குறிக்கிறது; ‘நாடு’ என்பது இந்தப் பிராந்தியப் பொருளை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וַנִּתְּנָהּ
  choice: அதை ... கொடுத்தோம்
  rationale: נתן என்பதன் நேரடியான பொருளான ‘கொடு’ பாதுகாக்கப்படுகிறது; ‘அதை’ என்பது முன் வந்த நாட்டைக் குறிக்கிறது.
- source_word: לְנַחֲלָה
  choice: உரிமைச் சொத்தாக
  rationale: נַחֲלָה என்பது பங்கிடப்பட்டு தலைமுறை வழியாக உரிமையுடன் வைத்திருக்கும் சொத்தைச் சுட்டுகிறது. ‘உரிமைச் சொத்து’ சாதாரண வாசகருக்குத் தெளிவாக இந்த நிலப்பங்கின் நிலையான உரிமைத் தன்மையை வெளிப்படுத்துகிறது.
- source_word: לָראוּבֵנִי
  choice: ரூபனியருக்கு
  rationale: எபிரெய இனப்பெயரின் ஒருமை வடிவம் முழுக் குலத்தையும் கூட்டாகக் குறிக்கிறது; தமிழில் ‘ரூபனியர்’ அந்தக் கூட்டுப் பொருளை இயல்பாகத் தருகிறது.
- source_word: וְלַגָּדִי
  choice: காதியருக்கு
  rationale: இனப்பெயரின் ஒருமை வடிவம் காத் குலத்தாரை கூட்டாகக் குறிக்கிறது; ‘காதியர்’ என்பது இயல்பான தமிழ் கூட்டுப்பெயர்.
- source_word: וְלַחֲצִי שֵׁבֶט הַמְנַשִּׁי
  choice: மனாசேயரின் அரைக் கோத்திரத்திற்கு
  rationale: חֲצִי שֵׁבֶט என்பதன் ‘அரைக் கோத்திரம்’ என்ற வடிவம் பாதுகாக்கப்படுகிறது; הַמְנַשִּׁי என்பது மனாசே வழிவந்த மக்களைக் குறிக்கும் இனப்பெயர் என்பதால் ‘மனாசேயரின்’ என மொழிபெயர்க்கப்பட்டுள்ளது.
