translation_notes:
  register: நவீன நிலையான தமிழில், சுருக்கமான வரலாற்று உரைநடையுடன் மொழிபெயர்க்கப்பட்டது. இனப்பெயர்கள் தமிழில் இயல்பான கூட்டுப் பொருள் தரும் மரியாதைப் பன்மை வடிவில் அமைக்கப்பட்டுள்ளன; மூலத்தின் ‘அரைக் கோத்திரம்’ என்ற வெளிப்பாடு தக்கவைக்கப்பட்டுள்ளது.
