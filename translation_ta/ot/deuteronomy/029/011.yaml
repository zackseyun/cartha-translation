  text: לְ/עָבְרְ/ךָ֗ בִּ/בְרִ֛ית יְהוָ֥ה אֱלֹהֶ֖י/ךָ וּ/בְ/אָלָת֑/וֹ אֲשֶׁר֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ כֹּרֵ֥ת עִמְּ/ךָ֖ הַ/יּֽוֹם׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/011.yaml
  text: so that you may enter into the covenant of Yahweh your God[a], and into his oath[b], which Yahweh your God is making with you today.
translation:
  language: ta
  text: உன் கடவுளாகிய யாவே இன்று உன்னோடு செய்துகொள்ளும்[b] உடன்படிக்கைக்குள்ளும், அவரது சபதத்திற்குள்ளும்[a] நீ நுழைவதற்காக.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘சாபங்கள் இணைந்த அவரது சபதத்திற்குள்ளும்.’ இங்கு வரும் எபிரெயச் சொல், உடன்படிக்கைச் சாபங்களுடன் இணைந்த சபதத்தைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: சொற்பொருளில், ‘இன்று உன்னோடு வெட்டும்.’ ‘உடன்படிக்கையை வெட்டுதல்’ என்பது உடன்படிக்கை செய்துகொள்வதைக் குறிக்கும் எபிரெய மரபுத்தொடர்.
    reason: cultural_note
lexical_decisions:
- source_word: לְעָבְרְךָ
  choice: நீ நுழைவதற்காகவே
  rationale: לְ முன்னொட்டுடன் வரும் עבר வினையின் infinitive construct இங்கு நோக்கம் அல்லது விளைவைச் சுட்டுகிறது. உடன்படிக்கைச் சூழலில் இது நேரடியான இடமாற்றம் அல்ல; உடன்படிக்கையின் கட்டுப்பாட்டுக்குள் வருவதைக் குறிக்கிறது.
- source_word: בִּבְרִית
  choice: உடன்படிக்கைக்குள்ளும்
  rationale: בְּרִית என்பதற்கு நிலையான பொருள் ‘உடன்படிக்கை’. בְּ முன்னொட்டு עבר உடன் சேர்ந்து ‘உடன்படிக்கைக்குள் நுழைதல்’ என்ற கருத்தைத் தருகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இஸ்ரவேலின் கடவுளுடைய தனிப்பெயரான יהוה என்பதை ஒரு பட்டப்பெயரால் மாற்றாமல், தமிழில் ‘யாவே’ என்று ஒலிபெயர்க்கிறது.
- source_word: אֱלֹהֶיךָ
  choice: உன் கடவுளாகிய
  rationale: இரண்டாம் நபர் ஆண்பால் ஒருமை உரிமை விகுதியை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: וּבְאָלָתוֹ
  choice: அவரது சபதத்திற்குள்ளும்
  rationale: אָלָה என்பது சபதத்தையும், குறிப்பாக உடன்படிக்கையை மீறினால் வரும் சாபத் தண்டனைகள் அடங்கிய சபதத்தையும் குறிக்கலாம். முதன்மை உரையில் பரந்த பொருளுடைய ‘சபதம்’ வைக்கப்பட்டு, சாப நுணுக்கம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: כֹּרֵת
  choice: செய்துகொள்ளும்
  rationale: כרת ברית என்பதன் சொற்பொருள் ‘உடன்படிக்கையை வெட்டுதல்’; ஆனால் அதன் இயல்பான தமிழ் இணை ‘உடன்படிக்கை செய்துகொள்ளுதல்’. எபிரெயப் பங்கேற்பு வடிவம் இன்றைய நிகழ்வைச் சுட்டுவதால் நிகழ்காலத் தொடர் பயன்படுத்தப்படுகிறது.
- source_word: עִמְּךָ
  choice: உன்னோடு
  rationale: עם உடன் சேர்ந்த இரண்டாம் நபர் ஆண்பால் ஒருமை விகுதியின் நேரான, இயல்பான தமிழ் வடிவம்.
- source_word: הַיּוֹם
  choice: இன்று
  rationale: உடன்படிக்கை நிகழ்வு நடைபெறும் நாளை நவீன தமிழில் நேரடியாகக் குறிக்கிறது.
theological_decisions:
- issue: יהוה என்ற உடன்படிக்கைப் பெயரை எவ்வாறு வழங்குவது
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூல உரை கடவுளுடைய தனிப்பெயரை நேரடியாகப் பயன்படுத்துகிறது. அதை ஒரு பட்டப்பெயரால் மாற்றாமல் ஒலிபெயர்ப்பது உடன்படிக்கைச் சூழலையும் பெயரின் தனித்தன்மையையும் காக்கிறது.
- issue: אָלָה என்பதில் உள்ள சபதம்–சாபம் நுணுக்கம்
  choice: முதன்மை உரையில் ‘சபதம்’; சாபத் தண்டனை நுணுக்கம் அடிக்குறிப்பில்
  alternative: சாபம் / சாபத்துடன் கூடிய சபதம்
  rationale: இந்தச் சொல் சபதத்தையும் அதனோடு இணைந்த உடன்படிக்கைச் சாபங்களையும் குறிக்க முடியும். ‘சாபம்’ மட்டும் என்று மொழிபெயர்ப்பது பொருளை மிகையாகக் குறுக்கும்; நீளமான விளக்கத்தை முதன்மை உரையில் சேர்ப்பது தெளிவை பாதிக்கும். ஆகவே மூலத்தின் பதற்றம் அடிக்குறிப்புடன் காக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் உடன்படிக்கைச் சூழலுக்கேற்ற கண்ணியமான நடையிலும் மொழிபெயர்க்கப்பட்டுள்ளது. ஒருமை ‘நீ/உன்/உன்னோடு’ வடிவங்கள் எபிரெய மூலத்தின் இரண்டாம் நபர் ஆண்பால் ஒருமையைப் பாதுகாக்கின்றன. [a], [b] குறிகள் அவை விளக்கும் சொற்றொடர்களுக்குப் பின்பே வைக்கப்பட்டுள்ளன.
