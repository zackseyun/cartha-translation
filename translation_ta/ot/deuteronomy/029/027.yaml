    issue: The final idiom is expressed somewhat interpretively.
    rationale: “இன்று நிலைமை அப்படியே உள்ளது” is understandable, but “இன்றும் அப்படியே உள்ளது” is a more concise rendering of the Hebrew formula while retaining its idiomatic force.
