  text: וַ/יִּתְּשֵׁ֤/ם יְהוָה֙ מֵ/עַ֣ל אַדְמָתָ֔/ם בְּ/אַ֥ף וּ/בְ/חֵמָ֖ה וּ/בְ/קֶ֣צֶף גָּד֑וֹל וַ/יַּשְׁלִכֵ֛/ם אֶל אֶ֥רֶץ אַחֶ֖רֶת כַּ/יּ֥וֹם הַ/זֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/027.yaml
  text: So Yahweh uprooted them from their land in anger[a], fury, and great wrath, and cast them into another land[b], as it is this day.
translation:
  language: ta
  text: யாவே அவர்களை அவர்களுடைய நிலத்திலிருந்து கோபத்தோடும் கடுஞ்சினத்தோடும் மிகுந்த சீற்றத்தோடும் வேரோடு பிடுங்கி[a], வேறொரு நாட்டிற்குள் எறிந்தார்; இன்றும் அப்படியே உள்ளது[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘வேரோடு பிடுங்கி’ என்பதற்கு ‘பறித்தெடுத்து’ அல்லது ‘பிய்த்தெடுத்து’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில், ‘இந்த நாளைப்போல்’; தீர்ப்பின் விளைவு இன்றும் தெளிவாகக் காணப்படுகிறது என்பது இதன் பொருள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְּשֵׁם
  choice: வேரோடு பிடுங்கி
  rationale: נתשׁ என்பது செடியை வேரோடு பிடுங்குவதுபோல, மக்களைத் தங்கள் நிலத்திலிருந்து வலுக்கட்டாயமாக அகற்றுவதைக் குறிக்கிறது. உருவகத்தின் வலிமையை இந்தத் தேர்வு காக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய மூலத்தில் உள்ள இறைத் திருப்பெயரை ஒரு பட்டப்பெயரால் மாற்றாமல், தமிழில் இயல்பான ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: מֵעַל אַדְמָתָם
  choice: அவர்களுடைய நிலத்திலிருந்து
  rationale: אַדָמָה என்பதற்கு மண், தரை, நிலம் ஆகிய பொருள்கள் உள்ளன; நாடுகடத்தல் சூழலில் ‘நிலம்’ என்பதே இயல்பாகவும் பொருத்தமாகவும் உள்ளது.
- source_word: בְּאַף וּבְחֵמָה וּבְקֶצֶף גָּדוֹל
  choice: கோபத்திலும் கடுஞ்சினத்திலும் மிகுந்த ஆத்திரத்திலும்
  rationale: தெய்வீகத் தீர்ப்பின் தீவிரத்தை உயர்த்தும் மூன்று நெருங்கிய கோபச் சொற்களையும் ஒன்றாகச் சுருக்காமல் தனித்தனியாகக் காக்கிறது; גָּדוֹל என்பதற்கு ‘மிகுந்த’ என நேரடியாக இடமளிக்கிறது.
- source_word: וַיַּשְׁלִכֵם
  choice: எறிந்தார்
  rationale: שׁלך என்பதன் வலுக்கட்டாயமாகத் தூக்கி எறியும் படிமத்தைத் தெளிவாகவும் சுருக்கமாகவும் வெளிப்படுத்துகிறது.
- source_word: אֶל אֶרֶץ אַחֶרֶת
  choice: வேறொரு நாட்டிற்குள்
  rationale: அவர்கள் அந்நியப் பகுதிக்குள் நாடுகடத்தப்பட்ட நகர்வை אֶל குறிக்கிறது; இச்சூழலில் אֶרֶץ என்பதற்கு ‘நாடு’ இயல்பானது.
- source_word: כַּיּוֹם הַזֶּה
  choice: இன்று நிலைமை அப்படியே உள்ளது
  rationale: ‘இந்த நாளைப்போல்’ என்ற எபிரெய வழக்குச் சொல்லின், தீர்ப்பின் விளைவு இன்றும் கண்முன் உள்ளது என்ற பொருளை இயல்பான நவீன தமிழில் தருகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைத் திருப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலவசனம் இறைவனின் தனிப்பட்ட உடன்படிக்கைப் பெயரை நேரடியாகப் பயன்படுத்துவதால், அதை ஒரு பட்டப்பெயராக மாற்றாமல் ஒலிபெயர்க்கிறது.
- issue: கோபத்தைக் குறிக்கும் அடுக்குச் சொற்கள்
  choice: கோபத்திலும் கடுஞ்சினத்திலும் மிகுந்த ஆத்திரத்திலும்
  alternative: மிகுந்த கோபத்தோடு
  rationale: மூலத்தின் אף, חמה, קצף ஆகிய மூன்று நெருங்கிய சொற்களின் வலுப்படுத்தும் திரட்சியைச் சுருக்காமல் காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையைப் பயன்படுத்தியுள்ளது. ‘வேரோடு பிடுங்கி’ மற்றும் ‘எறிந்தார்’ ஆகியவை மூலத்தின் வலிமையான தீர்ப்பு உருவகங்களைத் தக்கவைக்கின்றன; கோபத்தைக் குறிக்கும் மூன்று சொற்களும் தனித்தனியாகப் பாதுகாக்கப்பட்டுள்ளன.
