base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/013/013.yaml
  text: If you hear it said in one of your cities that Yahweh your God is giving you to dwell there[a], saying[b],
translation:
  language: ta
  text: 'உங்கள் கடவுளாகிய யாவே, நீங்கள் அங்கே குடியிருக்கும்படி[a] உங்களுக்குக் கொடுக்கிற நகரங்களில் ஒன்றில் இவ்வாறு சொல்லப்படுவதை நீங்கள் கேள்விப்பட்டால்[b]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘நீங்கள் அங்கே குடியேறும்படி’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘நீங்கள் கேள்விப்படும்போது’ என்றும் மொழிபெயர்க்கலாம்; சட்டப்பகுதிகளில் எபிரேய இணைப்புச்சொல் நிபந்தனையையோ காலத்தையோ அறிமுகப்படுத்தக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: கேள்விப்பட்டால்
  rationale: சட்ட நிபந்தனையை அறிமுகப்படுத்தும் இணைப்பாக இங்கு כִּי வருகிறது; தமிழில் ‘-ஆல்’ நிபந்தனை இயல்பாக உள்ளது. காலப்பொருளான ‘கேள்விப்படும்போது’ என்பதும் சாத்தியம் என்பதால் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: תִשְׁמַע
  choice: கேள்விப்பட்டால்
  rationale: இங்கு שׁמע கீழ்ப்படிதலை அல்ல, ஒரு தகவல் அல்லது செய்தியை அறிதலைக் குறிக்கிறது; ‘கேள்விப்படு’ அந்தப் பொருளை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: בְּאַחַת עָרֶיךָ
  choice: உங்களுக்குக் கொடுக்கிற நகரங்களில் ஒன்றில்
  rationale: בְּ இடத்தைக் குறிக்கிறது; עִיר என்பதற்கு இச்சட்டச் சூழலில் ‘நகரம்’ தெளிவான பொதுப்பெயர்.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைநாமமான நான்கு எழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் அதன் ஒலிப்பெயர்ப்பாக வழங்குகிறது.
- source_word: אֱלֹהֶיךָ
  choice: உங்கள் கடவுளாகிய
  rationale: இரண்டாம் நபர் ஒருமை உடைமைப் பின்னொட்டை உள்ளடக்கிய உடன்படிக்கைத் தொடரை இயல்பான தமிழில் வெளிப்படுத்துகிறது; தமிழில் மரியாதை/பொதுக் குழு முகவரியாக ‘உங்கள்’ பயன்படுத்தப்படுகிறது.
- source_word: נֹתֵן לְךָ
  choice: உங்களுக்குக் கொடுக்கிற
  rationale: எபிரேய நிகழ்காலப் பங்கேற்பு வடிவின் தொடரும் அல்லது பண்புக்கூற்று நுணுக்கத்தைத் தக்கவைத்து, ‘நகரங்கள்’ என்பதைக் குறிக்கும் இயல்பான தொடர்பெயர் அமைப்பாக மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: לָשֶׁבֶת שָׁם
  choice: நீங்கள் அங்கே குடியிருக்கும்படி
  rationale: לְ + வினையெச்சம் நோக்கம் அல்லது விளைவைச் சுட்டுகிறது; ישׁב இங்கு வாழ்தல்/குடியேறுதல் சார்ந்தது. ‘குடியிருக்கும்படி’ இரு நுணுக்கங்களையும் இயன்றவரை தாங்குகிறது.
- source_word: לֵאמֹר
  choice: 'இவ்வாறு சொல்லப்படுவதை ... :'
  rationale: அடுத்த வசனத்தில் வரும் செய்தியின் உள்ளடக்கத்தை அறிமுகப்படுத்தும் மேற்கோள் குறியாகும். தமிழில் ‘இவ்வாறு சொல்லப்படுவதை’ என்றும் இறுதியில் முக்காற்புள்ளியும் பயன்படுத்துவது தொடரும் உரையை இயல்பாக அறிமுகப்படுத்துகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைநாமத்தை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: ஆண்டவர் / யெகோவா
  rationale: மூலத்தில் தனிப்பட்ட உடன்படிக்கைப் பெயரே நேரடியாக உள்ளது. அதை பொதுப்பட்டமான ‘ஆண்டவர்’ என்று மாற்றாமல், ‘Yahweh’ என்பதற்கான இயல்பான தமிழ் ஒலிப்பெயர்ப்பான ‘யாவே’ என்று வழங்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான சட்டநடை பயன்படுத்தப்பட்டுள்ளது. வசனம் அடுத்த வசனத்தில் நிறைவடையும் செய்தியை அறிமுகப்படுத்துவதால், முடிவில் முக்காற்புள்ளி வைக்கப்பட்டுள்ளது. ஒருமை முகவரியைக் கொண்ட எபிரேய வடிவம் தமிழில் இயல்பான மரியாதை/கூட்டு முகவரியான ‘நீங்கள்/உங்கள்’ மூலம் தரப்பட்டுள்ளது.
