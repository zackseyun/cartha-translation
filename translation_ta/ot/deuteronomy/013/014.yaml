base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/013/014.yaml
  text: Certain worthless men have gone out from among you and have led the inhabitants of their city astray[a], saying, ‘Let us go and serve other gods,’ which you have not known.
translation:
  language: ta
  text: உங்கள் நடுவிலிருந்து சீர்கெட்ட மனிதர்கள்[a] சிலர் புறப்பட்டு, தங்கள் நகரத்தில் குடியிருப்பவர்களை வழிதவறச் செய்து, ‘நாம் போய், நீங்கள் அறிந்திராத வேறு தெய்வங்களுக்குப் பணிவிடை செய்வோம்’ என்று கூறியிருக்கிறார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரேயத்தில், “பயனற்ற தன்மையின் மகன்கள்”; மரபாக, “பெலியாலின் மகன்கள்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יָצְאוּ
  choice: புறப்பட்டு
  rationale: יצא என்பதன் அடிப்படைப் பொருளான ‘வெளியே புறப்படுதல்’ என்பதையும், இவர்கள் சமூகத்தின் உள்ளிருந்து தோன்றியதையும் இயல்பான தமிழில் காட்டுகிறது.
- source_word: אֲנָשִׁים בְּנֵי בְלִיַּעַל
  choice: சீர்கெட்ட மனிதர்கள்
  rationale: சொல்லுக்குச் சொல் ‘பயனற்ற தன்மையின் மகன்கள்’ என்ற எபிரேய மரபுத்தொடர் ஒழுக்கக்கேடும் சட்டமீறலும் கொண்ட மனிதர்களைக் குறிக்கிறது; ‘பெலியால்’ என்பதை தனிப்பெயராக்கி பிற்காலக் கருத்தை இங்கு புகுத்தாமல், அதன் சூழல்சார் பொருள் தரப்பட்டுள்ளது.
- source_word: מִקִּרְבְּךָ
  choice: உங்கள் நடுவிலிருந்து
  rationale: உடன்படிக்கைச் சமூகத்திற்குள்ளிருந்தே அவர்கள் வந்தார்கள் என்ற கருத்தைப் பாதுகாக்கிறது.
- source_word: וַיַּדִּיחוּ
  choice: வழிதவறச் செய்து
  rationale: נדח என்பதன் Hiphil வடிவம் பிறரை விலகிச் செல்லச் செய்வதை, இச்சூழலில் வேறு தெய்வங்களைப் பின்பற்றச் செய்வதை, குறிக்கிறது.
- source_word: יֹשְׁבֵי עִירָם
  choice: தங்கள் நகரத்தில் குடியிருப்பவர்களை
  rationale: ‘அவர்களுடைய நகரத்தின் குடியிருப்போர்’ என்ற எபிரேயப் பொருளைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: נֵלְכָה וְנַעַבְדָה
  choice: நாம் போய் ... பணிவிடை செய்வோம்
  rationale: இரு cohortative வினைகளின் கூட்டான அழைப்பையும், עבד என்பதிலுள்ள வழிபாட்டை உள்ளடக்கிய விரிவான சமயப் பணிவிடை உணர்வையும் பாதுகாக்கிறது.
- source_word: אֱלֹהִים אֲחֵרִים
  choice: வேறு தெய்வங்கள்
  rationale: உபாகமத்தில் வழக்கமாக வரும் சொற்றொடரை நேரடியாகத் தருகிறது; ‘அந்நிய தெய்வங்கள்’ என்ற குறுகிய விளக்கத்தைச் சேர்க்கவில்லை.
- source_word: אֲשֶׁר לֹא יְדַעְתֶּם
  choice: நீங்கள் அறிந்திராத
  rationale: ידע என்பதன் ‘அறிதல்’ என்ற சொல்லாட்சியைப் பாதுகாக்கிறது; வெறும் தகவல் அறிமுகம் என்று குறுக்காமல், மூலத்தில் இருக்கக்கூடிய உறவுசார் நுட்பத்தையும் திறந்துவைக்கிறது.
theological_decisions:
- issue: בְּנֵי בְלִיַּעַל என்பதன் பொருள்
  choice: சீர்கெட்ட மனிதர்கள்
  alternative: பெலியாலின் மகன்கள்
  rationale: இச்சூழலில் இது ஒழுக்கக்கேடான மனிதர்களைக் குறிக்கும் எபிரேய மரபுத்தொடர். ‘பெலியால்’ என்பதைத் தனிப்பட்ட தீய ஆளுமையாகக் காட்டுவது இவ்வசனம் கட்டாயப்படுத்தாத பிற்கால இறையியல் தொடர்பை இறக்குமதி செய்யக்கூடும்.
- issue: עבד என்பதன் சமயப் பொருள்
  choice: பணிவிடை செய்வோம்
  alternative: வழிபடுவோம்
  rationale: வேறு தெய்வங்களை வழிபடுதல் இங்கு உள்ளடங்கினாலும், ‘பணிவிடை செய்தல்’ என்பது மூல வினையின் விரிவான உடன்படிக்கை மற்றும் கீழ்ப்படிதல் சார்ந்த பொருளைச் சுருக்காமல் காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் வேதாகம உரைக்கு ஏற்ற கண்ணியமான நடையிலும் மொழிபெயர்க்கப்பட்டுள்ளது. நேரடி உரையின் அழைப்புத்தன்மையும் சமூகத்தின் உள்ளிருந்து ஏற்பட்ட வழிதவறச் செய்தலும் தெளிவாக வைக்கப்பட்டுள்ளன.
