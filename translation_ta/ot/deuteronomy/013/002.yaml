  text: כִּֽי יָק֤וּם בְּ/קִרְבְּ/ךָ֙ נָבִ֔יא א֖וֹ חֹלֵ֣ם חֲל֑וֹם וְ/נָתַ֥ן אֵלֶ֛י/ךָ א֖וֹת א֥וֹ מוֹפֵֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/013/002.yaml
  text: If a prophet or a dreamer of dreams arises among you and gives you a sign or a wonder,[a]
translation:
  language: ta
  text: உங்களிடையே ஒரு தீர்க்கதரிசியோ கனவு காண்கிறவனோ தோன்றி, உங்களுக்கு ஓர் அடையாளத்தையோ அற்புதத்தையோ கொடுத்தால்,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஓர் அடையாளத்தையோ முன்னறிகுறியையோ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: -ஆல் (கொடுத்தால்)
  rationale: இது அடுத்த வசனத்திற்கும் தொடரும் நிபந்தனைச் சட்ட நிகழ்வை அறிமுகப்படுத்துகிறது; தமிழில் நிபந்தனை வினைமுற்றால் இயல்பாக வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: יָקוּם
  choice: தோன்றி
  rationale: சமூகத்திற்குள் அத்தகைய ஒருவர் எழும்பி வருவதை நவீனத் தமிழில் இயல்பாகக் குறிக்கிறது.
- source_word: בְּקִרְבְּךָ
  choice: உங்களிடையே
  rationale: சமூகத்தின் நடுவில் அல்லது உறுப்பினர்களுள் என்ற பொருளை இயல்பாகப் பாதுகாக்கிறது.
- source_word: נָבִיא
  choice: தீர்க்கதரிசி
  rationale: தமிழ் வேதாகம மரபிலும் பொதுப் பயன்பாட்டிலும் நிலைபெற்ற இணைச்சொல்.
- source_word: חֹלֵם חֲלוֹם
  choice: கனவு காண்கிறவன்
  rationale: எபிரெயச் சேர்ந்துரையைச் சொற்சொல்லாகக் கடினப்படுத்தாமல், கனவின் வழி உரிமைகோருகிற தனி நபரைத் தெளிவாகக் காட்டுகிறது.
- source_word: וְנָתַן אֵלֶיךָ
  choice: உங்களுக்குக் ... கொடுத்தால்
  rationale: நிபந்தனைத் தொடரில் உள்ள செயலைத் தமிழில் இயல்பான நிபந்தனை வடிவில் தருகிறது.
- source_word: אוֹת
  choice: அடையாளம்
  rationale: சான்றாகவோ உறுதிப்படுத்துவதாகவோ அமையும் குறியைக் குறிக்கும் வழக்கமான, தெளிவான மொழிபெயர்ப்பு.
- source_word: מוֹפֵת
  choice: அற்புதம்
  rationale: அடையாளத்துடன் இணைந்து வரும் வியப்பூட்டும் நிகழ்வைச் சுட்டுகிறது; அது உண்மையான அதிசயமா என்பதைச் சொல்லிலேயே முடிவு செய்யவில்லை.
theological_decisions:
- issue: தீர்க்கதரிசி அல்லது கனவு காண்கிறவன் கொடுக்கும் அடையாளம்/அற்புதத்தின் இயல்பு
  choice: “ஓர் அடையாளத்தையோ அற்புதத்தையோ” என்று நேரடியாக மொழிபெயர்த்து, அதன் மூலமோ உண்மைத்தன்மையோ இவ்வசனத்தில் தீர்மானிக்கப்படவில்லை.
  alternative: “ஓர் அடையாளத்தையோ முன்னறிகுறியையோ” அல்லது “ஓர் அதிசய அடையாளத்தையோ அற்புதத்தையோ”
  rationale: எபிரெய உரை நிகழ்வைச் சுட்டினாலும், அது உண்மையான அற்புதமா, ஏமாற்றமா, அல்லது வெறும் உரிமைகோரலா என்பதை இங்கே விளக்கவில்லை; அந்த இறையியல் பதற்றம் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியக்கூடிய, மரியாதைமிக்க வேதாகம நடை. ஒருமை எபிரெய இரண்டாம் நபர் சமூகத்தைக் குறிக்கும் சூழலில் தமிழில் இயல்பான மரியாதை/கூட்டுப் பயன்பாடான “உங்கள்” வடிவில் தரப்பட்டுள்ளது.
