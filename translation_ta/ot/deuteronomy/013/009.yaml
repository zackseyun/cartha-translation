base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/013/009.yaml
  text: You shall not yield to him or listen to him[a], and your eye shall not pity him, and you shall not spare[c][b], and you shall not conceal him.
translation:
  language: ta
  text: நீ அவனுக்கு இணங்காதே; அவன் சொல்வதைக் கேட்காதே.[a] உன் கண் அவன்மேல் இரக்கம் காட்டக்கூடாது.[b] அவனை விட்டுவிடாதே; அவனை மூடிமறைக்காதே.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அவனுக்குச் சம்மதிக்காதே” என்றும் மொழிபெயர்க்கலாம். எபிரெய வினைச்சொல் விரும்புதல், சம்மதித்தல், அல்லது இணங்குதல் ஆகியவற்றைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: சொல்லுக்குச் சொல், “உன் கண் அவன்மேல் இரக்கம் கொள்ளக்கூடாது.” இது இரக்கமுள்ள பார்வை அல்லது பரிதாபத்தைத் தடுக்கக் கூறும் எபிரெய சொல்லாட்சி.
    reason: cultural_note
  - marker: c
    text: “அவனுக்காக மறைக்காதே” அல்லது “அவனை மறைக்காதே” என்றும் மொழிபெயர்க்கலாம்; இது அவனையோ அவனுடைய குற்றத்தையோ மூடிமறைக்காதிருப்பதைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: תֹאבֶה לוֹ
  choice: அவனுக்கு இணங்காதே
  rationale: אָבָה என்பதன் விருப்பம் தெரிவித்தல், சம்மதித்தல், இணங்குதல் ஆகிய பொருள் வரம்பில், வழிதவறச் செய்யும் தூண்டுதலுக்கு உடன்படாதிருப்பதை இயல்பான தமிழில் ‘இணங்காதே’ தெளிவாகக் காட்டுகிறது.
- source_word: תִשְׁמַע אֵלָיו
  choice: அவன் சொல்வதைக் கேட்காதே
  rationale: שׁמע + אֶל இங்கு வெறுமனே ஒலியைக் கேட்பதை அல்ல, ஒருவனுடைய வேண்டுகோளுக்குச் செவிசாய்ப்பதைக் குறிக்கிறது. ‘அவன் சொல்வதைக் கேட்காதே’ என்பது கீழ்ப்படிதல் என்ற முழுப் பொருளைத் தேவையின்றி திணிக்காமல் இதை வெளிப்படுத்துகிறது.
- source_word: תָחוֹס עֵינְךָ עָלָיו
  choice: உன் கண் அவன்மேல் இரக்கம் கொள்ளாதிருக்கட்டும்
  rationale: חוּס இரங்குதல் அல்லது இரக்கத்தால் விட்டுவிடுதல் எனப் பொருள்படும். எபிரெய மூலத்தின் ‘உன் கண்’ என்ற உருவகத்தைத் தமிழிலும் தக்கவைத்து அதன் வலிமையைக் காக்கிறது.
- source_word: תַחְמֹל
  choice: அவனைத் தப்பவிடாதே
  rationale: חמל என்பது இரங்குதல் அல்லது விட்டுவைத்தல் என்ற பொருளுடையது. முந்தைய இரக்கத் தடையிலிருந்து இதை வேறுபடுத்தி, சட்டச் சூழலில் இரக்கத்தால் தண்டனையிலிருந்து தப்பவிடாதிருப்பதை ‘தப்பவிடாதே’ காட்டுகிறது.
- source_word: תְכַסֶּה עָלָיו
  choice: அவனை மறைத்துப் பாதுகாக்காதே
  rationale: Piel வடிவிலுள்ள כסה மறைத்தல், மூடிவைத்தல், ஒருவருக்காக மறைத்துப் பாதுகாத்தல் ஆகியவற்றைக் குறிக்கலாம். ‘மறைத்துப் பாதுகாக்காதே’ என்பது குற்றவாளியை மறைப்பதும் அவனுடைய செயலை மூடிமறைப்பதும் அடங்கக்கூடிய மூலத்தின் பொருள் பரப்பை இயல்பான தமிழில் தருகிறது.
theological_decisions:
- issue: விசுவாசத் துரோகத்திற்குத் தூண்டுபவனைப் பற்றிய கடுமையான உடன்படிக்கைச் சட்ட மொழி
  choice: ஒன்றன்பின் ஒன்றாக வரும் நேரடியான தடைகளை மென்மைப்படுத்தாமல் தக்கவைத்தல்
  alternative: இதை வெறும் மனப்பூர்வமான மறுப்பாகப் பொதுமைப்படுத்துதல் அல்லது ‘அவனைப் பாதுகாக்காதே’ என்று மட்டும் சுருக்குதல்
  rationale: இந்த வசனம் தூண்டுபவனுக்கு இணங்குவதையும் செவிசாய்ப்பதையும் இரங்குவதையும் தப்பவிடுவதையும் மறைத்துப் பாதுகாப்பதையும் தடைசெய்யும் சட்டச் சூழலில் உள்ளது. ஆகவே மூலத்தின் தீவிரத்தையும் படிப்படியாகக் குவியும் தடைகளையும் மொழிபெயர்ப்பு காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், ஒருமை முன்னிலையைத் தொடர்ந்து பயன்படுத்தி, சட்டக் கட்டளையின் நேரடியான வலிமையைப் பேணியுள்ளோம். ‘உன் கண் ... இரக்கம் கொள்ளாதிருக்கட்டும்’ என்ற எபிரெய உருவகம் திட்டமிட்டு தக்கவைக்கப்பட்டது.
