source:
  edition: WLC
  text: לֹ֣א תִשְׁמַ֗ע אֶל דִּבְרֵי֙ הַ/נָּבִ֣יא הַ/ה֔וּא א֛וֹ אֶל חוֹלֵ֥ם הַ/חֲל֖וֹם הַ/ה֑וּא כִּ֣י מְנַסֶּ֞ה יְהוָ֤ה אֱלֹֽהֵי/כֶם֙ אֶתְ/כֶ֔ם לָ/דַ֗עַת הֲ/יִשְׁ/כֶ֤ם אֹֽהֲבִים֙ אֶת יְהוָ֣ה אֱלֹהֵי/כֶ֔ם בְּ/כָל לְבַבְ/כֶ֖ם וּ/בְ/כָל נַפְשְׁ/כֶֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/013/004.yaml
  text: You shall not listen to the words of that prophet or to that dreamer of dreams[a], for Yahweh your God is testing you[b], to know whether you love Yahweh your God with all your heart and with all your soul.
translation:
  language: ta
  text: அந்தத் தீர்க்கதரிசியின் வார்த்தைகளுக்கோ, அந்தக் கனவு காண்பவனுக்கோ[a] நீங்கள் செவிசாய்க்கக் கூடாது. ஏனெனில், உங்கள் கடவுளாகிய யாவே, உங்கள் முழு உள்ளத்தோடும் உங்கள் முழு உயிரோடும்[b] உங்கள் கடவுளாகிய யாவே மீது நீங்கள் அன்புகூருகிறீர்களா என்பதை அறிய உங்களைச் சோதிக்கிறார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மொழியில், “கனவு காணும் அந்தக் கனவுக்காரன்” என்று வலியுறுத்தும் சொற்றொடர் உள்ளது.
    reason: எபிரெய மொழிநடையின் வினை-பெயர் மீளுருவை விளக்குகிறது.
  - marker: b
    text: “உயிர்” என்பதற்கான எபிரெயச் சொல் “ஆத்துமா,” “வாழ்வு,” “தன் முழுமை,” அல்லது “முழு இருப்பு” என்றும் பொருள்படலாம்.
    reason: נֶפֶשׁ என்ற சொல்லின் பொருள் வரம்பையும் உடன்படிக்கைச் சொற்றொடரிலுள்ள அதன் முழுமையான அர்ப்பணிப்பு நுணுக்கத்தையும் காட்டுகிறது.
lexical_decisions:
- source_word: לֹא תִשְׁמַע אֶל
  choice: நீங்கள் செவிசாய்க்கக் கூடாது
  rationale: שׁמע אֶל என்பது வெறுமனே ஒலியைக் கேட்பதைவிட ஒருவரின் சொல்லைக் கேட்டு ஏற்றுக்கொள்வதை அல்லது கீழ்ப்படிவதை உணர்த்துகிறது. ‘செவிசாய்க்கக் கூடாது’ அந்தக் கருத்தை இயல்பான தமிழில் காக்கிறது.
- source_word: דִּבְרֵי הַנָּבִיא הַהוּא
  choice: அந்தத் தீர்க்கதரிசியின் வார்த்தைகளுக்கு
  rationale: דִּבְרֵי என்பதன் பன்மை வடிவத்தையும், הַהוּא சுட்டும் முன்பு குறிப்பிடப்பட்ட நபரையும் வெளிப்படையாகக் காக்கிறது.
- source_word: חוֹלֵם הַחֲלוֹם הַהוּא
  choice: கனவுகளைக் காணும் அந்தக் கனவுக்காரனுக்கு
  rationale: எபிரெயச் சொற்றொடரின் வினை-பெயர் வலியுறுத்தலை முடிந்தவரை காக்கும் அதேவேளையில், தமிழில் புரியத்தக்கதாக அமைக்கப்பட்டுள்ளது.
- source_word: מְנַסֶּה
  choice: சோதிக்கிறார்
  rationale: נסה என்பதன் மதிப்பிட்டு அறியும் சோதனை என்ற பொருளைத் தெளிவாகத் தருகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இது பட்டப்பெயர் அல்ல, தேவனுடைய தனிப்பெயரைக் குறிக்கும் நான்கு எபிரெய மெய்யெழுத்துகளின் தமிழாக்க ஒலிபெயர்ப்பு.
- source_word: לָדַעַת
  choice: அறிய
  rationale: மூலத்தின் நோக்கம் அல்லது விளைவைக் குறிக்கும் வினையெச்சத்தையும், அதிலுள்ள இறையியல் அழுத்தத்தையும் விளக்கி மாற்றாமல் நேரடியாகக் காக்கிறது.
- source_word: הֲיִשְׁכֶם אֹהֲבִים
  choice: நீங்கள் அன்புகூருகிறீர்களா என்பதை
  rationale: கேள்வித் துகளையும் நிகழ்நிலைப் பங்கேற்புவினையின் தொடரும் மனநிலையையும் இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: בְּכָל לְבַבְכֶם
  choice: உங்கள் முழு உள்ளத்தோடும்
  rationale: לֵבָב என்பது உணர்ச்சி மட்டுமன்றி எண்ணம், விருப்பம், மனவுறுதி ஆகியவற்றை உள்ளடக்கும் அகமனிதனைக் குறிக்கிறது; ‘உள்ளம்’ தமிழில் அந்த விரிவை இயல்பாகத் தருகிறது.
- source_word: וּבְכָל נַפְשְׁכֶם
  choice: உங்கள் முழு உயிரோடும்
  rationale: נֶפֶשׁ என்பது உயிர், உயிருள்ள நபர், தன்னையே முழுமையாக அர்ப்பணித்தல் ஆகிய கருத்துகளைத் தரக்கூடும். ‘உயிர்’ நவீன தமிழில் இயல்பாகவும் மூலத்தின் பரந்த பொருளுக்கு நெருக்கமாகவும் உள்ளது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூலத்தில் பொதுவான பட்டப்பெயர் அல்ல, உடன்படிக்கையின் தனிப்பெயர் நேரடியாக உள்ளது; ஆகவே அதை பட்டப்பெயரால் மாற்றாமல் ஒலிபெயர்த்துள்ளது.
- issue: தேவன் சோதிப்பது ‘அறிய’ என்பதற்காக என்ற மனிதவுருவ மொழி
  choice: ‘அறிய உங்களைச் சோதிக்கிறார்’ என்று அப்படியே வைத்தல்
  alternative: ‘வெளிப்படுத்த உங்களைச் சோதிக்கிறார்’
  rationale: மூலம் לָדַעַת, ‘அறிய’ என்றே கூறுகிறது. தேவனுடைய அறிவைப் பற்றிய இறையியல் சிக்கலை மொழிபெயர்ப்பிலேயே தீர்த்துவிடாமல், மூலத்தின் அழுத்தத்தைப் பாதுகாக்கிறது.
- issue: נֶפֶשׁ என்பதன் மொழிபெயர்ப்பு
  choice: உயிர்
  alternative: ஆத்துமா / முழு இருப்பு
  rationale: இந்தச் சூழலில் சொல் உடலிலிருந்து தனித்த ஓர் அங்கத்தை மட்டும் அவசியமாகக் குறிக்காது; ஒருவரின் உயிரையும் முழுத் தன்னையும் குறிக்க முடியும். எனவே ‘உயிர்’ தேர்ந்தெடுக்கப்பட்டு மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சட்ட-உடன்படிக்கை உரைக்கு ஏற்ற கண்ணியமான நேரடி நடை பயன்படுத்தப்பட்டுள்ளது. ‘செவிசாய்க்கக் கூடாது,’ ‘அன்புகூருகிறீர்களா,’ ‘முழு உள்ளம்,’ ‘முழு உயிர்’ ஆகியவை சாதாரண வாசகருக்குப் புரியும்படியும் மூலத்தின் வலியுறுத்தலைக் காக்கும்படியும் தேர்ந்தெடுக்கப்பட்டன.
