  text: וְ/לֹֽא יִדְבַּ֧ק בְּ/יָדְ/ךָ֛ מְא֖וּמָה מִן הַ/חֵ֑רֶם לְמַעַן֩ יָשׁ֨וּב יְהוָ֜ה מֵ/חֲר֣וֹן אַפּ֗/וֹ וְ/נָֽתַן לְ/ךָ֤ רַחֲמִים֙ וְ/רִֽחַמְ/ךָ֣ וְ/הִרְבֶּ֔/ךָ כַּ/אֲשֶׁ֥ר נִשְׁבַּ֖ע לַ/אֲבֹתֶֽי/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/013/018.yaml
  text: And nothing from what is devoted to destruction shall cling to your hand[a], so that Yahweh may turn from the fierceness of his anger and show you mercy, and have compassion on you, and multiply you[b], just as he swore to your fathers.
translation:
  language: ta
  text: அழிவுக்கென்று அர்ப்பணிக்கப்பட்டவற்றில் எதுவும் உன் கையில் ஒட்டிக்கொள்ளக் கூடாது.[a] இதனால் யாவே தமது கடுங்கோபத்தைவிட்டுத் திரும்பி,[b] உனக்கு இரக்கம் அளித்து, உன்மேல் மனமிரங்கி, உன் தந்தையருக்கு சத்தியம் செய்தபடியே உன்னைப் பெருகச் செய்வார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: மரபுவழியாக, “அழிவுக்கான கட்டளைக்குட்பட்டவற்றில் எதுவும்” என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் חֵרֶם, கடவுளுக்கெனத் திரும்பப்பெற முடியாதபடி அர்ப்பணிக்கப்பட்ட ஒன்றைக் குறிக்கிறது; பல சூழல்களில் அது அழிக்கப்பட வேண்டியதாகும்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயில் சொல்லுக்குச் சொல், “அவருடைய மூக்கின் எரிச்சல்” என உள்ளது; இது மிகுந்த கோபத்தைக் குறிக்கும் மரபுத்தொடர்.
    reason: cultural_note
lexical_decisions:
- source_word: יִדְבַּק בְּיָדְךָ
  choice: உன் கையில் ஒட்டிக்கொள்ளக் கூடாது
  rationale: דבק என்பதன் ‘ஒட்டிக்கொள்’ என்ற நேரடியான உருவகத்தையும், ‘கையில்’ என்பதன் உடைமையில் வைத்துக்கொள்ளுதல் என்ற சூழல்சார் பொருளையும் இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: מְאוּמָה
  choice: எதுவும்
  rationale: மறுப்பு வாக்கியத்தில் ‘எதுவும் ... கூடாது’ என்பது முழுமையான தடையைத் தெளிவாகத் தெரிவிக்கிறது.
- source_word: הַחֵרֶם
  choice: அழிவுக்கென்று அர்ப்பணிக்கப்பட்டவை
  rationale: חֵרֶם என்பது கடவுளுக்குத் திரும்பப்பெற முடியாதபடி ஒதுக்கப்பட்டு, இச்சூழலில் அழிக்கப்பட வேண்டியவற்றைக் குறிக்கிறது; ‘தடை’ என்ற தெளிவற்ற சொல்லைவிட இத்தேர்வு பொருளை வெளிப்படுத்துகிறது.
- source_word: לְמַעַן
  choice: அப்போது
  rationale: முந்தைய கட்டளைக்குக் கீழ்ப்படிவதன் நோக்கம் அல்லது விளைவாகத் தொடர்ந்து வரும் செயல்களை இயல்பான தமிழில் இணைக்கிறது; காரண–விளைவு தொடர்பைத் தக்கவைக்கிறது.
- source_word: יָשׁוּב יְהוָה מֵחֲרוֹן אַפּוֹ
  choice: யாவே தமது கடுங்கோபத்தைவிட்டுத் திரும்பி
  rationale: שׁוּב מן என்பதன் ‘விட்டுத் திரும்புதல்’ என்ற இயக்கத்தையும் חֲרוֹן אַף என்பதன் தீவிரக் கோபத்தையும் மென்மைப்படுத்தாமல் வழங்குகிறது.
- source_word: רַחֲמִים
  choice: இரக்கம்
  rationale: נתן உடன் வரும் பெயர்ச்சொல்லை ‘இரக்கம் அளித்து’ என வழங்குவது தமிழில் இயல்பாகவும் மூலத்தின் சொல்லமைப்புக்கு நெருக்கமாகவும் உள்ளது.
- source_word: וְרִחַמְךָ
  choice: உன்மேல் மனமிரங்கி
  rationale: முந்தைய ‘இரக்கம்’ என்பதோடு உள்ள பொருள் ஒத்திசைவைத் தக்கவைத்தபடியே, பெயர்ச்சொல் மற்றும் வினைச்சொல் வேறுபாட்டைக் காட்டுகிறது.
- source_word: וְהִרְבֶּךָ
  choice: உன்னைப் பெருகச் செய்வார்
  rationale: רבה என்பதன் காரணவினைப் பொருளையும் முற்பிதாக்களுக்கான பெருக்க வாக்குறுதியின் எதிரொலியையும் தக்கவைக்கிறது.
- source_word: כַּאֲשֶׁר נִשְׁבַּע לַאֲבֹתֶיךָ
  choice: உன் தந்தையருக்கு ஆணையிட்டபடியே
  rationale: אבות என்பதைப் பொதுவான ‘முன்னோர்’ என விரிவாக்காமல் ஆண் முற்பிதாக்களைக் குறிக்கும் வகையில் வழங்குகிறது; נשבע என்பதன் உறுதியான சத்தியப் பொருளை ‘ஆணையிட்டார்’ தெரிவிக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: எபிரெய மூலத்தில் வரும் உடன்படிக்கைப் பெயரை பொதுப்பட்டமாக மாற்றாமல், தமிழில் பரவலாக அறியக்கூடிய ஒலிபெயர்ப்பில் தருகிறது.
- issue: חֵרֶם என்பதன் உடன்படிக்கைப் போர் சார்ந்த பொருள்
  choice: அழிவுக்கென்று அர்ப்பணிக்கப்பட்டவை
  alternative: தடைக்குட்பட்டவை / சாபத்தீடானவை
  rationale: இறைவனுக்கென மீளப்பெற முடியாதபடி ஒதுக்கப்பட்டு அழிக்கப்பட வேண்டியவை என்ற இச்சூழலின் பொருளை வெளிப்படுத்துகிறது; ‘சாபம்’ என்ற மூலத்தில் கட்டாயமில்லாத கருத்தைச் சேர்ப்பதில்லை.
- issue: இறைக் கோபத்தைச் சித்தரிக்கும் மனிதவுருவ மொழி
  choice: தமது கடுங்கோபத்தைவிட்டுத் திரும்பி
  alternative: தமது எரியும் கோபத்தைத் தணித்து
  rationale: கோபத்தின் தீவிரத்தையும் ‘திரும்புதல்’ என்ற மூல வினையையும் காக்கிறது; அதேவேளையில் ‘மூக்கு’ என்ற எபிரெய மரபுத்தொடரைத் தமிழில் பொருளற்ற உடலுறுப்பு மொழியாக நேரடியாக்காமல் அடிக்குறிப்பில் விளக்குகிறது.
- issue: אֲבֹתֶיךָ என்பதிலுள்ள பாலினத் துல்லியம்
  choice: உன் தந்தையர்
  alternative: உன் முன்னோர் / உன் மூதாதையர்
  rationale: இங்கு முற்பிதாக்களின் உடன்படிக்கை வரிசையைச் சுட்டும் ஆண்பால் குறிப்பைத் தக்கவைக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், ஒருமை இரண்டாம் நபர் வடிவத்தைத் தொடர்ந்து பயன்படுத்துகிறது. நடை கண்ணியமானதாகவும் சாதாரண வாசகர்களுக்குப் புரியக்கூடியதாகவும் வைக்கப்பட்டுள்ளது. ‘தந்தையர்’ என்பது இங்கு உடன்படிக்கை பெற்ற முற்பிதாக்களைக் குறிக்கிறது; ‘யாவே’ என்பது இறைப்பெயரின் ஒலிபெயர்ப்பு.
