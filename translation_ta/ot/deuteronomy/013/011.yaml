source:
  edition: WLC
  text: וּ/סְקַלְתּ֥/וֹ בָ/אֲבָנִ֖ים וָ/מֵ֑ת כִּ֣י בִקֵּ֗שׁ לְ/הַדִּֽיחֲ/ךָ֙ מֵ/עַל֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ הַ/מּוֹצִיאֲ/ךָ֛ מֵ/אֶ֥רֶץ מִצְרַ֖יִם מִ/בֵּ֥ית עֲבָדִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/013/011.yaml
  text: You shall stone him with stones[a], and he shall die, because he sought to drive you away from Yahweh your God, who brought you out from the land of Egypt[b], out of the house of slavery.
translation:
  language: ta
  text: நீ அவனைக் கற்களால் எறிந்து கொல்ல வேண்டும்; அவன் இறக்க வேண்டும். ஏனெனில், எகிப்து நாட்டிலிருந்து, அடிமைத்தனத்தின் வீட்டிலிருந்து[b], உன்னை வெளியே கொண்டுவந்த உன் கடவுளாகிய யாவேவிடமிருந்து உன்னை விலக்க[a] அவன் முயன்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘உன் கடவுளாகிய யாவேவிடமிருந்து உன்னை வழிதவறச் செய்ய’ அல்லது ‘யாவேவிடமிருந்து உன்னை ஈர்த்து விலக்க’.
    reason: lexical_alternative
  - marker: b
    text: ‘அடிமைத்தனத்தின் வீடு’ என்பது எகிப்தில் அடிமைகளாக இருந்த இஸ்ரவேலரை யாவே விடுவித்ததை நினைவூட்டும் உடன்படிக்கைச் சொல்லாட்சி.
    reason: cultural_note
lexical_decisions:
- source_word: וּסְקַלְתּוֹ בָאֲבָנִים
  choice: நீ அவன்மேல் கற்களை எறிய வேண்டும்
  rationale: சட்டக் கட்டளையாகச் செயல்படும் எபிரெய வினை வடிவத்தையும், கற்களால் நிறைவேற்றப்படும் தண்டனையையும் வெளிப்படையாகக் காட்டுகிறது. அடுத்த கூறில் மரணம் தனியாகச் சொல்லப்படுவதால் இங்கே ‘கொல்ல வேண்டும்’ என்று சேர்க்கப்படவில்லை.
- source_word: וָמֵת
  choice: அவன் சாகவேண்டும்
  rationale: கல்லெறிதலின் முடிவை எபிரெய உரை தனிக் கூறாக வலியுறுத்துவதைக் காக்கிறது.
- source_word: כִּי בִקֵּשׁ
  choice: ஏனெனில் ... அவன் முயன்றான்
  rationale: כִּי தண்டனைக்கான காரணத்தை அறிமுகப்படுத்துகிறது; בִקֵּשׁ இச்சூழலில் திட்டமிட்ட முயற்சியைக் குறிக்கிறது.
- source_word: לְהַדִּיחֲךָ
  choice: உன்னை விலக்கிவிட
  rationale: נדח என்பதன் ஹிஃபில் வடிவத்திலுள்ள காரணவினைப் பொருளையும், உடன்படிக்கை விசுவாசத்திலிருந்து ஒருவரை அகற்றும் கருத்தையும் இயல்பான தமிழில் தருகிறது; மாற்றுப் பொருள்கள் அடிக்குறிப்பில் தரப்பட்டுள்ளன.
- source_word: מֵעַל יְהוָה אֱלֹהֶיךָ
  choice: உன் கடவுளாகிய யாவேவிடமிருந்து
  rationale: מֵעַל குறிக்கும் உறவு அல்லது பற்றிலிருந்து பிரித்தலைத் தமிழில் தெளிவாகக் காட்டுகிறது; יהוה என்ற தனிப்பெயர் ‘யாவே’ என ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: הַמּוֹצִיאֲךָ
  choice: உன்னை வெளியே கொண்டுவந்த
  rationale: பங்கேற்பு வினை இங்கு யாவேவை அவரது வரலாற்று மீட்புச் செயலால் அடையாளப்படுத்துகிறது; தமிழில் இயல்பான இறந்தகால உறவெச்சம் பயன்படுத்தப்பட்டுள்ளது.
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: எகிப்து நாட்டிலிருந்து
  rationale: புவியியல் சொற்றொடரை நேராகவும் இயல்பாகவும் மொழிபெயர்க்கிறது.
- source_word: מִבֵּית עֲבָדִים
  choice: அடிமைத்தனத்தின் வீட்டிலிருந்து
  rationale: ‘அடிமைகளின் வீடு’ என்ற சொல்லாட்சியின் உருவகத்தையும், எகிப்தில் இஸ்ரவேலர் அனுபவித்த அடிமை நிலையையும் காக்கிறது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூல உரையிலுள்ள உடன்படிக்கைத் தனிப்பெயரை ஒரு பட்டத்தால் மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
- issue: לְהַדִּיחֲךָ מֵעַל יְהוָה என்பதிலுள்ள உடன்படிக்கையிலிருந்து விலகச் செய்யும் மொழி
  choice: யாவேவிடமிருந்து உன்னை விலக்கிவிட
  alternative: யாவேவிடமிருந்து உன்னை வழிதவறச் செய்ய / ஈர்த்து விலக்க
  rationale: காரணவினையின் வலிமையையும் யாவேவுடனான பற்றிலிருந்து பிரிக்கும் கருத்தையும் காக்கிறது; செயல் முறை பற்றிய சொற்பொருள் நுணுக்கத்தைத் தீர்மானிக்காமல் மாற்றுகளை அடிக்குறிப்பில் தருகிறது.
- issue: இரண்டாம் நபர் எண்ணிக்கை
  choice: 'ஒருமை: நீ / உன்னை / உன்'
  alternative: 'பன்மை அல்லது மரியாதை வடிவம்: நீங்கள் / உங்களை / உங்கள்'
  rationale: இந்த வசனத்தின் எபிரெய உரையில் இரண்டாம் நபர் ஆண்பால் ஒருமை தொடர்ந்து வருவதைக் காக்கிறது.
translation_notes:
  register: நவீன, கண்ணியமான சட்டநடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய உரையின் ஒருமை அழைப்பு காக்கப்பட்டுள்ளது. வாக்கிய ஒழுங்கு தமிழில் தெளிவாக அமையச் சிறிது மாற்றப்பட்டாலும், தண்டனை, காரணம், யாவேயின் மீட்புச் செயல் ஆகிய கூறுகள் அனைத்தும் வெளிப்படையாக வைக்கப்பட்டுள்ளன.
