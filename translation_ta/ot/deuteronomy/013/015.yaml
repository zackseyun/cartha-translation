  text: וְ/דָרַשְׁתָּ֧ וְ/חָקַרְתָּ֧ וְ/שָׁאַלְתָּ֖ הֵיטֵ֑ב וְ/הִנֵּ֤ה אֱמֶת֙ נָכ֣וֹן הַ/דָּבָ֔ר נֶעֶשְׂתָ֛ה הַ/תּוֹעֵבָ֥ה הַ/זֹּ֖את בְּ/קִרְבֶּֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/013/015.yaml
  text: and you shall investigate[a], and search out, and inquire thoroughly; and behold, if it is true and certain that this abomination has been done in your midst,
translation:
  language: ta
  text: நீ விசாரித்து, ஆராய்ந்து, நன்றாகக் கேட்டறிய வேண்டும். இதோ, இந்த அருவருப்பான செயல் உன் நடுவில் நடந்துள்ளது என்பது உண்மையும் உறுதியுமானது என்று தெரியவந்தால்,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயச் சொற்றொடரை இன்னும் நேரடியாக, “இதோ, இந்த அருவருப்பான செயல் உன் நடுவில் நடந்துள்ளது; அது உண்மையும் உறுதியுமானது” என்றும் மொழிபெயர்க்கலாம்.
    reason: אֱמֶת נָכוֹן என்ற சுருக்கமான எபிரெய உறுதிப்படுத்தல் வாய்பாட்டையும் וְהִנֵּה என்பதன் நேரடி ‘இதோ’ வடிவத்தையும் காட்டுகிறது.
lexical_decisions:
- source_word: וְדָרַשְׁתָּ
  choice: விசாரித்து
  rationale: சட்ட விசாரணைச் சூழலில் தரשׁ முறையான விசாரணையைச் சுட்டுகிறது; நவீனத் தமிழில் ‘விசாரி’ இதைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: וְחָקַרְתָּ
  choice: ஆராய்ந்து
  rationale: חקר கவனமாகத் துருவி ஆராய்வதை உணர்த்துகிறது; முந்தைய வினையிலிருந்து வேறுபாட்டையும் தொடர்ச்சியான தீவிரத்தையும் காக்கிறது.
- source_word: וְשָׁאַלְתָּ הֵיטֵב
  choice: தீரக் கேட்டறிய வேண்டும்
  rationale: שאל என்பதின் ‘கேட்டு அறிதல்’ என்ற பொருளையும், הֵיטֵב தரும் முழுமை மற்றும் கவனத்தின் வலியுறுத்தலையும் இயல்பான தமிழில் இணைக்கிறது.
- source_word: וְהִנֵּה
  choice: தெரியவந்தால்
  rationale: விசாரணையின் விளைவு வெளிப்பட்டு உறுதியாகும் கட்டத்தை הנה இங்கு குறிக்கிறது. ‘இதோ’ என்ற நேரடி வடிவத்தைவிட, நிபந்தனைச் சட்ட வாக்கியத்தில் ‘தெரியவந்தால்’ இயல்பாக உள்ளது.
- source_word: אֱמֶת
  choice: உண்மை
  rationale: விசாரிக்கப்பட்ட செய்தி உண்மையானது என்ற தீர்மானத்தைக் குறிக்கிறது.
- source_word: נָכוֹן
  choice: உறுதிப்படுத்தப்பட்டது
  rationale: נכון இங்கு காரியம் நிலைநிறுத்தப்பட்டு சான்றுகளால் உறுதியானது என்ற நீதிசார் பொருளைக் கொண்டுள்ளது.
- source_word: הַדָּבָר
  choice: காரியம்
  rationale: விசாரணைக்குட்பட்ட செய்தி அல்லது விவகாரத்தைப் பொதுவாகக் குறிக்கும் சொல்லாக ‘காரியம்’ மூலத்தின் பரந்த பொருளைக் காக்கிறது.
- source_word: נֶעֶשְׂתָה
  choice: நடந்துள்ளது
  rationale: அருவருப்பான செயல் நிகழ்ந்துவிட்டது என்பதைக் காட்டும் வடிவம்; தமிழில் இயல்பாகவும் முடிவடைந்த நிகழ்வாகவும் வெளிப்படுகிறது.
- source_word: הַתּוֹעֵבָה הַזֹּאת
  choice: இந்த அருவருப்பான செயல்
  rationale: תועבה என்பதின் கடுமையான ஒழுக்க மற்றும் உடன்படிக்கைச் சார்ந்த கண்டனத்தை ‘அருவருப்பான’ காக்கிறது; ‘செயல்’ சூழலைத் தெளிவாக்குகிறது.
- source_word: בְּקִרְבֶּךָ
  choice: உன் நடுவில்
  rationale: ஒருமை இரண்டாம் நபர் வடிவத்தையும், உடன்படிக்கைச் சமூகத்திற்குள் நிகழ்ந்தது என்ற பொருளையும் காக்கிறது.
theological_decisions:
- issue: நீதிசார் உறுதிப்படுத்தல் தொடர்
  choice: விசாரணை, ஆராய்ச்சி, தீரக் கேட்டறிதல் ஆகியவற்றுக்குப் பின் செய்தியின் உண்மையும் காரியத்தின் உறுதியும் தெரியவரும் நிபந்தனைத் தொடராக மொழிபெயர்த்தல்
  alternative: ‘இதோ, அது உண்மை; காரியம் உறுதியானது’ என்று எபிரெயச் சொற்றொடரை நெருக்கமாக அமைத்தல்
  rationale: எபிரெயம் பல விசாரணை வினைகளை அடுக்கி, பின்னர் சுருக்கமான உறுதிப்படுத்தல் வாய்பாட்டைக் கொடுக்கிறது. தமிழ் சட்டநடைத் தெளிவுக்காக நிபந்தனை வெளிப்படையாக அமைக்கப்பட்டாலும், உண்மை மற்றும் உறுதிப்பாடு என்ற இரு கூறுகளும் தனித்தனியாகக் காக்கப்பட்டுள்ளன.
translation_notes:
  register: நவீன நிலையான தமிழில், சட்ட விசாரணைக்குரிய கண்ணியமான நடையைப் பயன்படுத்துகிறது. மூன்று விசாரணை வினைகளின் சேர்க்கைத் தீவிரம் காக்கப்பட்டுள்ளது. வசனம் அடுத்த கட்டளைக்கான நிபந்தனையாக முடிவதால் இறுதியில் காற்புள்ளி வைக்கப்பட்டுள்ளது.
