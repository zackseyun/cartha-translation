  text: וְ/כָל יִשְׂרָאֵ֔ל יִשְׁמְע֖וּ וְ/יִֽרָא֑וּ/ן וְ/לֹֽא יוֹסִ֣פוּ לַ/עֲשׂ֗וֹת כַּ/דָּבָ֥ר הָ/רָ֛ע הַ/זֶּ֖ה בְּ/קִרְבֶּֽ/ךָ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/013/012.yaml
  text: And all Israel shall hear and fear[a], and they shall not again do this evil thing in your midst.
translation:
  language: ta
  text: இஸ்ரவேலர் அனைவரும் இதைக் கேட்டு அஞ்சுவார்கள்; உன் நடுவில்[a] இந்தத் தீய செயலை மீண்டும் செய்யமாட்டார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உங்களிடையே.” எபிரெயத்தில் இஸ்ரவேல் மக்கள் ஒரே சமூகமாகக் கருதப்பட்டு ஒருமை வடிவில் அழைக்கப்படுகிறார்கள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָל יִשְׂרָאֵל
  choice: இஸ்ரவேலர் அனைவரும்
  rationale: כָּל என்பதுடன் வரும் ‘இஸ்ரவேல்’ முழு உடன்படிக்கை மக்களையும் கூட்டாகக் குறிக்கிறது. தமிழில் மக்களைக் தெளிவாகக் குறிக்க ‘இஸ்ரவேலர் அனைவரும்’ இயல்பானது.
- source_word: יִשְׁמְעוּ
  choice: இதைக் கேட்டு
  rationale: שׁמע இங்கு முன்பு கூறப்பட்ட தீர்ப்பைப் பற்றி அறிதலைக் குறிக்கிறது. அடுத்த வினையுடன் இயல்பாக இணைவதற்காக ‘இதைக் கேட்டு’ என மொழிபெயர்க்கப்பட்டது.
- source_word: וְיִרָאוּן
  choice: அஞ்சுவார்கள்
  rationale: ירא இச்சட்டச் சூழலில் தண்டனையைக் கேட்டு ஏற்படும் தடுப்பு அச்சத்தைக் குறிக்கிறது; ‘அஞ்சுவார்கள்’ உணர்ச்சியை மிகைப்படுத்தாமல் அந்தப் பொருளைத் தருகிறது.
- source_word: וְלֹא יוֹסִפוּ לַעֲשׂוֹת
  choice: மீண்டும் செய்யமாட்டார்கள்
  rationale: יסף உடன் வரும் வினையெச்சம் ஒரு செயலை மறுபடியும் செய்வதைக் குறிக்கிறது. ‘மீண்டும் செய்யமாட்டார்கள்’ இதைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: כַּדָּבָר הָרָע הַזֶּה
  choice: இந்தத் தீய செயலை
  rationale: דָּבָר பல பொருள்களைக் கொண்டிருந்தாலும், இங்கு முன்பு விவரிக்கப்பட்ட குற்றச்செயலைக் குறிக்கிறது. ஆகவே பொதுவான ‘காரியம்’ என்பதற்குப் பதிலாக ‘செயல்’ பயன்படுத்தப்பட்டது.
- source_word: בְּקִרְבֶּךָ
  choice: உன் நடுவில்
  rationale: சொற்றொடர் நேரடியாக ‘உன் நடுவில்’ என்று பொருள்படும்; ஒருமை ஆண்பால் பின்னொட்டு இஸ்ரவேலை ஒரே மக்களாகக் கூட்டாக அழைக்கிறது.
theological_decisions:
- issue: உடன்படிக்கை மக்களைக் குறிக்கும் இறுதி ஒருமை முன்னிலை
  choice: ‘உன் நடுவில்’ என்ற ஒருமை வடிவைத் தக்கவைத்தல்
  alternative: ‘உங்களிடையே’
  rationale: எபிரெயப் பின்னொட்டு ஒருமை ஆண்பாலில் உள்ளது; உபாகமத்தில் இஸ்ரவேல் ஒரே மக்களாகக் கூட்டாக அழைக்கப்படுவதை இது பிரதிபலிக்கிறது. மாற்று வாசிப்பு அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், சட்டப்பகுதிக்கேற்ற கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. எபிரெயத்தின் கூட்டொருமை அழைப்பு ‘உன்’ என்பதால் தக்கவைக்கப்பட்டு, இயல்பான பன்மை மாற்று அடிக்குறிப்பில் வழங்கப்பட்டது.
