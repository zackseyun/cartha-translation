base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/013/007.yaml
  text: If your brother[a], the son of your mother, or your son or your daughter, or the wife of your embrace, or your friend who is like your own soul, secretly entices you, saying[b], ‘Let us go and serve other gods’—gods that neither you nor your fathers have known—
translation:
  language: ta
  text: உன் தாயின் மகனான உன் சகோதரனோ, உன் மகனோ, உன் மகளோ, உன் மார்போடு அணைத்துக்கொள்ளும் மனைவியோ[a], உன் உயிரைப்போன்ற நண்பனோ[b], “நாம் போய் வேறு தெய்வங்களுக்குப் பணிவிடை செய்வோம்” என்று உன்னை இரகசியமாகத் தூண்டினால்—அந்தத் தெய்வங்களை நீயும் உன் தந்தையரும் அறிந்திருக்கவில்லை—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “உன் மடியின் மனைவி”; மிக நெருக்கமாக அணைத்துக்கொள்ளும் மனைவியைக் குறிக்கும் மரபுத்தொடர்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில், “உன் உயிரைப்போன்ற நண்பன்”; உனக்கு உன்னைப்போல் நெருக்கமான நண்பன் என்றும் பொருள்கொள்ளலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְסִיתְךָ ... בַּסֵּתֶר
  choice: உன்னை இரகசியமாகத் தூண்டினால்
  rationale: סות என்பதன் ஹிஃபில் வடிவம் ஒருவரை ஒரு செயலுக்கு இணங்கத் தூண்டுதல் அல்லது கவர்ந்திழுத்தல் என்ற பொருளுடையது; בַּסֵּתֶר அந்தத் தூண்டுதல் இரகசியமாக நடைபெறுவதைத் தெளிவுபடுத்துகிறது.
- source_word: אָחִיךָ בֶן אִמֶּךָ
  choice: உன் தாயின் மகனான உன் சகோதரன்
  rationale: நெருங்கிய இரத்த உறவை வலியுறுத்தும் எபிரெய அடைமொழியைச் சுருக்காமல், இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: אֵשֶׁת חֵיקֶךָ
  choice: உன் நெஞ்சோடு அணைத்துக்கொள்ளும் மனைவி
  rationale: חֵיק என்பது மடி, மார்பு, அணைப்பு ஆகிய கருத்துகளைக் கொண்டது. தமிழில் நெருக்கமான தாம்பத்திய உறவை இயல்பாகக் காட்டுவதற்காக இந்த மரபுத்தொடர் பொருளோடு மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: רֵעֲךָ אֲשֶׁר כְּנַפְשְׁךָ
  choice: உன் உயிருக்கு நிகரான நண்பன்
  rationale: נֶפֶשׁ இங்கு வெறும் உயிரியல் வாழ்வை மட்டுமல்லாமல், ஒருவருக்குத் தன்னைப்போலவே நெருக்கமான உறவையும் குறிக்கிறது. மூலத்தின் தீவிரத்தை இந்தத் தமிழ் சொற்றொடர் காக்கிறது.
- source_word: נֵלְכָה וְנַעַבְדָה
  choice: நாம் போய் ... பணிவிடை செய்வோம்
  rationale: இரண்டு வினைகளின் அழைப்பு அல்லது தூண்டுதல் தன்மையைப் பாதுகாக்கிறது. עבד என்பதன் பரந்த சமயச் சேவைப் பொருளைக் காக்க ‘வழிபடுவோம்’ என்பதற்குப் பதிலாக ‘பணிவிடை செய்வோம்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: אֱלֹהִים אֲחֵרִים
  choice: வேறு தெய்வங்கள்
  rationale: אֲחֵרִים என்பதன் நேரடியான பொருள் ‘வேறு’; ‘அந்நிய’ என்று விளக்கமாகக் குறுக்காமல் மூலத்தைப் பின்பற்றுகிறது.
- source_word: אֲשֶׁר לֹא יָדַעְתָּ אַתָּה וַאֲבֹתֶיךָ
  choice: அந்தத் தெய்வங்களை நீயும் உன் முன்னோர்களும் அறிந்திருக்கவில்லை
  rationale: יָדַעְתָּ என்பதிலுள்ள அறிமுகம் அல்லது அங்கீகாரம் என்ற திறந்த பொருளை ‘அறிந்திருக்கவில்லை’ காக்கிறது; אַתָּה וַאֲבֹתֶיךָ என்ற இணைப்பையும் தெளிவாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: மிக நெருக்கமான குடும்ப மற்றும் நட்பு உறவுகளைக் குறிக்கும் உருவகங்களை மொழிபெயர்த்தல்
  choice: ‘உன் தாயின் மகனான உன் சகோதரன்,’ ‘உன் நெஞ்சோடு அணைத்துக்கொள்ளும் மனைவி,’ ‘உன் உயிருக்கு நிகரான நண்பன்’ என்று உறவின் நெருக்கத்தைப் பாதுகாத்தல்
  alternative: ‘உன் சொந்தச் சகோதரன்,’ ‘உன் அன்பு மனைவி,’ ‘உன் மிக நெருங்கிய நண்பன்’ என்று உருவகங்களை முழுவதும் இயல்பாக்குதல்
  rationale: மிக நெருங்கிய மனித உறவுகள்கூட இவ்வகைத் தூண்டுதலை நியாயப்படுத்தாது என்பதே வசனத்தின் அழுத்தம். ஆகவே மூல உருவகங்களின் தீவிரம் காக்கப்படுகிறது; அதேவேளை தமிழில் புரியாத சொற்சொல் மொழிபெயர்ப்பு தவிர்க்கப்படுகிறது.
- issue: பிற தெய்வங்கள் தொடர்பாக עבד என்பதை மொழிபெயர்த்தல்
  choice: ‘பணிவிடை செய்வோம்’
  alternative: ‘வழிபடுவோம்’
  rationale: עבד என்பது வழிபாட்டை உள்ளடக்கியிருந்தாலும், தெய்வத்திற்குச் செய்யப்படும் சேவையை விரிவாகக் குறிக்கிறது. ‘பணிவிடை’ அந்த விரிந்த பொருளைத் தக்கவைக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் dignified நடையில் அமைக்கப்பட்டுள்ளது. ‘இரகசியமாகத் தூண்டினால்,’ ‘பணிவிடை செய்வோம்’ போன்ற சொற்கள் மூலத்தின் செயற்பாட்டு மற்றும் சமயச் சேவை நுணுக்கங்களைத் தக்கவைக்கின்றன. வசனம் அடுத்த வசனத்துடன் தொடர்வதால் இறுதியில் நீள்கோடு வைக்கப்பட்டுள்ளது.
