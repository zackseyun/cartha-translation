- from: அந்த நகரத்தில் குடியிருப்பவர்களை நீங்கள் வாளின் கூர்மையால் நிச்சயமாக வெட்டிக் கொல்ல வேண்டும்.[a] அந்த நகரத்தையும் அதிலுள்ள அனைத்தையும் அதன் கால்நடைகளையும் அழிவுக்கென்று ஒப்புக்கொடுத்து, வாளின் கூர்மையால் அழிக்க வேண்டும்.[b]
  to: அந்த நகரத்தில் குடியிருப்பவர்களை நீ வாளின் வெட்டுமுனையால் நிச்சயமாக வெட்டிக் கொல்ல வேண்டும்.[a] அந்த நகரத்தை அழிவுக்கென்று ஒப்புக்கொடுத்து, அதிலுள்ள அனைத்தையும் அதன் கால்நடைகளையும் வாளின் வெட்டுமுனையால் அழிக்க வேண்டும்.[b]
  rationale: மூல எபிரெயத்தின் ஒருமை கட்டளை வடிவம் மீட்டெடுக்கப்பட்டுள்ளது. வாளைக் குறிக்கும் மீண்டும் வரும் மரபுத்தொடர், அதன் பொருளைத் தெளிவுபடுத்தும் ‘வெட்டுமுனை’ என்ற சொல்லால் மொழிபெயர்க்கப்பட்டுள்ளது. חרם பற்றிய கடுமையான, மாற்றமுடியாத அழிவுக்காக ஒதுக்கும் நுட்பம் உரையிலும் அடிக்குறிப்பிலும் மாற்றமின்றி காக்கப்பட்டுள்ளது.
