  text: הַכֵּ֣ה תַכֶּ֗ה אֶת יֹֽשְׁבֵ֛י הָ/עִ֥יר ה/הוא לְ/פִי חָ֑רֶב הַחֲרֵ֨ם אֹתָ֧/הּ וְ/אֶת כָּל אֲשֶׁר בָּ֛/הּ וְ/אֶת בְּהֶמְתָּ֖/הּ לְ/פִי חָֽרֶב־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/013/016.yaml
  text: You shall surely strike the inhabitants of that city with the edge of the sword[a], devoting it to destruction, along with all that is in it and its livestock[b], with the edge of the sword.
translation:
  language: ta
  text: அந்த நகரத்தில் குடியிருப்பவர்களை நீ வாளின் வெட்டுமுனையால் நிச்சயமாக வெட்டிக் கொல்ல வேண்டும்.[a] அந்த நகரத்தை அழிவுக்கென்று ஒப்புக்கொடுத்து, அதிலுள்ள அனைத்தையும் அதன் கால்நடைகளையும் வாளின் வெட்டுமுனையால் அழிக்க வேண்டும்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரெய மொழியில் வலியுறுத்தப்பட்ட ஒருமை கட்டளை வடிவம் உள்ளது: ‘நீ நிச்சயமாக வெட்டிக் கொல்ல வேண்டும்.’'
    reason: lexical_alternative
  - marker: b
    text: ‘அழிவுக்கென்று ஒப்புக்கொடுத்து’ என்பது எபிரெய חרם என்ற சொல்லை மொழிபெயர்க்கிறது; ஒன்றை மீட்க முடியாதபடி அழிவுக்காக ஒதுக்குவதை இது குறிக்கிறது. ‘வாளின் வெட்டுமுனையால்’ என்பதன் சொல்லுக்குச் சொல் வடிவம் ‘வாளின் வாயால்’ என்பதாகும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכֵּה תַכֶּה
  choice: நிச்சயமாக வெட்டிக் கொல்ல வேண்டும்
  rationale: வினையெச்ச முற்றுப்பெயரும் நிறைவுறா வினையும் சேர்ந்த எபிரெய வடிவம் கட்டளையை வலியுறுத்துகிறது. சூழலில் வாள் குறிப்பிடப்படுவதால், தமிழில் ‘வெட்டிக் கொல்ல’ என்பது தாக்குதலின் உயிர்க்கொல்லும் பொருளை இயல்பாக வெளிப்படுத்துகிறது; ‘நிச்சயமாக’ வலியுறுத்தலைக் காக்கிறது.
- source_word: יֹשְׁבֵי הָעִיר הַהוּא
  choice: அந்த நகரத்தில் குடியிருப்பவர்கள்
  rationale: இது அந்நகரில் வசிப்பவர்களைக் குறிக்கும் பங்கேற்பு வடிவம். ‘குடியிருப்பவர்கள்’ நவீனத் தமிழில் தெளிவானதும் இயல்பானதும் ஆகும்.
- source_word: לְפִי חָרֶב
  choice: வாளின் கூர்மையால்
  rationale: சொல்லுக்குச் சொல் ‘வாளின் வாயால்’ என்ற எபிரெய மரபுத்தொடர் வாளின் வெட்டும் முனை அல்லது கூர்மையைச் சுட்டுகிறது. ‘வாளின் கூர்மையால்’ உருவகத்தைப் பெருமளவு காத்து தமிழில் தெளிவாக உள்ளது.
- source_word: הַחֲרֵם אֹתָהּ
  choice: அந்த நகரத்தை அழிவுக்கென்று ஒப்புக்கொடுத்து ... அழிக்க வேண்டும்
  rationale: חרם என்பதன் ஹிஃபில் வடிவம் ஒன்றை மீட்க முடியாதபடி அழிவுக்காக அர்ப்பணிப்பதைச் சுட்டுகிறது. ‘அழிவுக்கென்று ஒப்புக்கொடுத்து’ அதன் வழிபாட்டு/தீர்ப்பு சார்ந்த நுட்பத்தைக் காக்கிறது; இறுதியில் ‘அழிக்க வேண்டும்’ என்பது வாக்கியத்தின் நடைமுறை விளைவைத் தெளிவாக்குகிறது.
- source_word: וְאֶת כָּל אֲשֶׁר בָּהּ
  choice: அதிலுள்ள அனைத்தையும்
  rationale: அழிவின் வரம்பு நகரவாசிகளைத் தாண்டி நகரத்திலுள்ள அனைத்தையும் உள்ளடக்குவதைச் சுருக்கமாகவும் துல்லியமாகவும் தெரிவிக்கிறது.
- source_word: בְּהֶמְתָּהּ
  choice: அதன் கால்நடைகளையும்
  rationale: בְּהֵמָה பொதுவாக வீட்டில் வளர்க்கப்படும் விலங்குகளைத் தொகுப்பாகக் குறிக்கலாம். ‘கால்நடைகள்’ மாடுகளுக்கு மட்டும் பொருளைச் சுருக்காமல் நவீனத் தமிழில் இயல்பாக உள்ளது.
theological_decisions:
- issue: போர்ச் சூழலில் חרם என்பதன் மொழிபெயர்ப்பு
  choice: அழிவுக்கென்று ஒப்புக்கொடுத்து ... அழிக்க வேண்டும்
  alternative: முற்றிலும் அழிக்க வேண்டும்; தடைக்குட்படுத்த வேண்டும்
  rationale: இந்தச் சொல் வெறும் இராணுவ அழிப்பை விட, மாற்ற முடியாத அழிவுக்காக ஒதுக்கும் புனித/தீர்ப்புச் சார்ந்த நுட்பத்தையும் கொண்டுள்ளது. தேர்ந்தெடுத்த மொழியாக்கம் அந்த இறையியல் பதற்றத்தை மறைக்காமல், புரியாத தொழில்நுட்பச் சொல்லையும் தவிர்க்கிறது.
- issue: கடுமையான தீர்ப்புக் கட்டளையின் முழு வலிமை
  choice: கட்டளையின் உயிர்க்கொல்லும் மற்றும் முழுமையான தன்மையை மென்மைப்படுத்தாமல் காத்தல்
  alternative: தோற்கடிக்க வேண்டும் போன்ற மென்மையான மொழியைப் பயன்படுத்துதல்
  rationale: எபிரெய உரையின் கடுமையைத் தணிப்பது ஆதாரத்தில் இல்லாத விளக்கத்தைச் சேர்க்கும். ஆகவே குடியிருப்பவர்கள், நகரிலுள்ள அனைத்தும், கால்நடைகள் ஆகியவற்றின் மீது கட்டளை விரிவடைவது வெளிப்படையாக வைக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் கண்ணியமான, நேரடியான கட்டளை நடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் மீளுரைப்பும் கடுமையும் காக்கப்பட்டுள்ளன; חרם என்பதன் தனிச்சிறப்பு பொதுவான ‘அழித்தல்’ என்ற சொல்லில் மறையாமல் உரையிலும் அடிக்குறிப்பிலும் வெளிப்படுத்தப்பட்டுள்ளது.
