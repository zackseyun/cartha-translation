  yaml_path: translation/ot/deuteronomy/013/019.yaml
  text: if you listen to the voice of Yahweh your God, to keep all his commandments that I am commanding you today, to do what is right in the eyes of Yahweh your God.
translation:
  language: ta
  text: உன் கடவுளாகிய யாவேவின் குரலுக்குச் செவிகொடுத்து, இன்று நான் உனக்குக் கட்டளையிடுகிற அவருடைய கட்டளைகள் அனைத்தையும் கடைப்பிடித்து, உன் கடவுளாகிய யாவேவின் பார்வையில் சரியானதைச் செய்தால்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: செய்தால்
  rationale: முந்தைய வாக்குறுதி நிறைவேறும் நிபந்தனையை இங்கு כִּי அறிமுகப்படுத்துகிறது; தமிழில் வாக்கிய இறுதியிலுள்ள நிபந்தனை வினைமுற்று இயல்பானது.
- source_word: תִשְׁמַע בְּקוֹל
  choice: குரலுக்குச் செவிகொடுத்து
  rationale: கேட்டு அதன்படி நடக்கும் கருத்தை உள்ளடக்கிய எபிரெயச் சொற்றொடரின் செவிசாய்த்தல் உருவகத்தையும் தனிப்பட்ட குரல் என்ற அம்சத்தையும் காக்கிறது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: திருப்பெயரை ஒரு பட்டமாக மாற்றாமல், தமிழில் பரவலாக அறியப்படும் பெயர்வடிவில் வழங்குகிறது.
- source_word: אֱלֹהֶיךָ
  choice: உன் கடவுள்
  rationale: உடன்படிக்கைச் சூழலிலுள்ள இரண்டாம் நபர் ஒருமை உடைமைத் தொடர்பை நேரடியாகக் காட்டுகிறது.
- source_word: לִשְׁמֹר
  choice: கடைப்பிடித்து
  rationale: கட்டளைகளை கவனமாகப் பேணி நடைமுறைப்படுத்தும் பொருளை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: כָּל מִצְוֺתָיו
  choice: அவருடைய கட்டளைகள் அனைத்தையும்
  rationale: כָּל என்பதன் முழுமையையும் מִצְוָה என்பதன் சட்ட/உடன்படிக்கைச் சார்ந்த பொருளையும் வெளிப்படையாகத் தக்கவைக்கிறது.
- source_word: אֲשֶׁר אָנֹכִי מְצַוְּךָ הַיּוֹם
  choice: இன்று நான் உனக்குக் கட்டளையிடுகிற
  rationale: பேசிக்கொண்டிருக்கும் தருணத்தில் மோசே வழங்கும் கட்டளையின் நிகழ்காலத் தொடர்ச்சியை இயல்பான தமிழில் காட்டுகிறது.
- source_word: לַעֲשׂוֹת הַיָּשָׁר
  choice: சரியானதைச் செய்து
  rationale: יָשָׁר என்பதன் நேர்மை/சரியானது என்ற ஒழுக்க மதிப்பீட்டைத் தெளிவாக வழங்குகிறது.
- source_word: בְּעֵינֵי
  choice: பார்வையில்
  rationale: சொற்பொருளான ‘கண்களில்’ என்பதற்குப் பதிலாக, மதிப்பீட்டைக் குறிக்கும் எபிரெய மரபுத்தொடரின் பொருளை இயல்பான தமிழில் தருகிறது.
theological_decisions:
- issue: יְהוָה என்ற திருப்பெயரை மொழிபெயர்த்தல்
  choice: யெகோவா
  alternative: யாவே / கர்த்தர்
  rationale: மூலத்தில் உள்ள தனிப்பட்ட திருப்பெயரை ‘கர்த்தர்’ என்ற பட்டத்தால் மாற்றாமல் காக்கிறது. ‘யாவே’ என்பதும் சாத்தியமான ஒலிப்பெயர்ப்பு; ‘யெகோவா’ நவீன தமிழ் வாசகர்களிடையே பரவலாக அறியப்படும் பெயர்வடிவமாகத் தேர்ந்தெடுக்கப்பட்டது.
- issue: שׁמע בקול என்பதிலுள்ள கேட்டல்–கீழ்ப்படிதல் உறவு
  choice: குரலுக்குச் செவிகொடுத்து
  alternative: கீழ்ப்படிந்து
  rationale: கீழ்ப்படிதல் என்ற உட்பொருளை உணர்த்தியபடியே, மூலத்தின் ‘குரல்’ மற்றும் ‘கேட்டல்’ உருவகத்தை அழிக்காமல் வைத்திருக்கிறது.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான தமிழ். எபிரெய வாக்கியத்தின் நிபந்தனைத் தொடர்பை தமிழுக்கேற்றவாறு இறுதியில் ‘செய்தால்’ என அமைத்துள்ளது. ‘நீ’ என்பது வசனத்தின் இரண்டாம் நபர் ஒருமையைத் தக்கவைக்கிறது; மரியாதைப் பன்மை சேர்க்கப்படவில்லை.
