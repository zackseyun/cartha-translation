base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/013/017.yaml
  text: You shall gather all its spoil into the middle of its open square[a], and you shall burn the city and all its spoil with fire as a whole offering to Yahweh your God. It shall remain a perpetual ruin mound[b]; it shall not be rebuilt again.
translation:
  language: ta
  text: அதன் கொள்ளைப்பொருள் அனைத்தையும் அதன் பொதுச் சதுக்கத்தின் நடுவில் குவிக்க வேண்டும். அந்த நகரத்தையும் அதன் கொள்ளைப்பொருள் அனைத்தையும் உன் கடவுளாகிய ஆண்டவருக்கான முழுப் பலியாக[a] நெருப்பில் எரிக்க வேண்டும். அது என்றென்றும் இடிபாடுகளின் மேடாக இருக்கும்[b]; அந்த நகரம் இனி மீண்டும் கட்டப்படக்கூடாது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘உன் கடவுளாகிய ஆண்டவருக்காக முழுவதுமாக.’ எபிரெயச் சொல்லை ‘முழுவதுமாக’ என்ற வினையடையாகவும், கடவுளுக்காக முற்றிலும் எரித்து அர்ப்பணிக்கப்படுவதைக் குறிக்கும் பலிசார் சொல்லாகவும் புரிந்துகொள்ளலாம்.
    reason: lexical_alternative
  - marker: b
    text: சொல்லர்த்தமாக, ‘என்றென்றும் ஒரு மேடு’; அதாவது, நிலைத்திருக்கும் இடிபாடுகளின் குவியல்.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁלָלָהּ
  choice: அதன் கொள்ளைப்பொருள்
  rationale: שָׁלָל என்பது போரில் கைப்பற்றப்படும் பொருட்களைக் குறிக்கிறது. சட்டம் மற்றும் போர் சார்ந்த இச்சூழலில் ‘கொள்ளைப்பொருள்’ தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: תִּקְבֹּץ
  choice: குவிக்க வேண்டும்
  rationale: קבץ என்பதன் பொருள் ஒன்றுசேர்த்தல் அல்லது திரட்டுதல். நகரின் நடுப்பகுதியில் பொருட்களை ஒரே இடத்தில் சேர்க்கும் செயலை ‘குவிக்க வேண்டும்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: אֶל תּוֹךְ רְחֹבָהּ
  choice: அதன் பொது வெளி நடுவில்
  rationale: רְחוֹב என்பது பொதுவாக நகரின் அகன்ற பொதுவிடத்தை அல்லது சதுக்கத்தைக் குறிக்கிறது; குறுகிய தெருவை அல்ல. ‘பொது வெளி’ நகர்ப்புறச் சூழலையும் சாதாரண வாசகருக்கான தெளிவையும் காக்கிறது.
- source_word: וְשָׂרַפְתָּ בָאֵשׁ
  choice: நெருப்பில் எரிக்க வேண்டும்
  rationale: எபிரெயச் சொற்றொடர் நெருப்பால் முழுமையாக அழிப்பதை நேரடியாகக் குறிக்கிறது. தமிழில் ‘நெருப்பில் எரிக்க வேண்டும்’ இயல்பான கட்டளை வடிவம்.
- source_word: כָּלִיל
  choice: முழுப் பலியாக
  rationale: כָּלִיל என்பதற்கு ‘முழுவதுமாக’ என்ற வினையடைப் பொருளும், கடவுளுக்காக முற்றிலும் எரிக்கப்படும் பலி என்ற வழிபாட்டுச் சாயலும் உண்டு. தொடர்ந்து வரும் לַיהוָה காரணமாக ‘முழுப் பலியாக’ என்பது அந்தச் சாயலைக் காக்கிறது; குறிப்பிட்ட விலங்குப் பலியைத் தேவையின்றி உணர்த்துவதில்லை.
- source_word: לַיהוָה אֱלֹהֶיךָ
  choice: உன் கடவுளாகிய ஆண்டவருக்கான
  rationale: ל முன்னொட்டு அர்ப்பணிப்பு அல்லது உரிமை நோக்கைச் சுட்டுகிறது. יהוה மரபுப்படி ‘ஆண்டவர்’ என்றும், אֱלֹהֶיךָ ‘உன் கடவுள்’ என்றும் வழங்கப்பட்டு, தமிழில் இயல்பான இணைப்பாக அமைக்கப்பட்டுள்ளது.
- source_word: תֵּל עוֹלָם
  choice: என்றென்றும் ஓர் இடிபாட்டு மேடு
  rationale: תֵּל என்பது மேடு அல்லது குவியல், குறிப்பாக இடிபாடுகளால் உருவான மேடு; עוֹלָם நீடித்த காலத்தைக் குறிக்கிறது. இத்தொடர் உடற்காட்சியையும் நிரந்தரப் பாழ்நிலையையும் காக்கிறது.
- source_word: לֹא תִבָּנֶה עוֹד
  choice: அதை மீண்டும் கட்டக்கூடாது
  rationale: בנה என்பதன் நிஃபால் வடிவம் ‘கட்டப்படுதல்/மீண்டும் கட்டப்படுதல்’ என்று பொருள்படும்; לֹא மற்றும் עוֹד சேர்ந்து எதிர்காலத்திற்கான தடை அல்லது நிலையான விளைவைத் தெரிவிக்கின்றன. தமிழ்ச் சட்ட மொழியில் ‘கட்டக்கூடாது’ நேரடியான கட்டளையாக உள்ளது.
theological_decisions:
- issue: நகரை எரிக்கும் கட்டளையில் כָּלִיל என்பதன் வழிபாட்டுச் சாயல்
  choice: ‘ஆண்டவருக்கான முழுப் பலியாக’ என்று மொழிபெயர்க்கப்பட்டது.
  alternative: ‘ஆண்டவருக்காக முழுவதுமாக’ என்றும் மொழிபெயர்க்கலாம்.
  rationale: כָּלִיל என்பது ‘முழுவதுமாக’ என்ற பொருளிலும், கடவுளுக்காக முற்றிலும் அழித்து அர்ப்பணிக்கப்படுவது என்ற பலிசார் பொருளிலும் புரிந்துகொள்ளப்படலாம். ‘முழுப் பலியாக’ என்பது இங்குள்ள அர்ப்பணிப்புச் சாயலைக் காக்கிறது; அதேவேளை மாற்றுப் புரிதல் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், சட்டக் கட்டளையின் வலிமையை ‘வேண்டும்/கூடாது’ வடிவங்கள் மூலம் காத்துள்ளோம். ‘பொது வெளி,’ ‘கொள்ளைப்பொருள்,’ ‘இடிபாட்டு மேடு’ ஆகியவை சாதாரண வாசகருக்குப் புரியக்கூடியவையாகவும் மூலத்தின் நகர்ப்புற மற்றும் போர்சார் படிமங்களைத் தக்கவைத்தவையாகவும் உள்ளன. அடிக்குறிப்பு குறிகள் உரிய சொற்றொடர்களுக்குப் பின்னர் வைக்கப்பட்டுள்ளன.
