base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/013/001.yaml
  text: Every word that I am commanding you[a], you shall be careful to do. You shall not add to it[b], and you shall not take away from it.
translation:
  language: ta
  text: நான் உங்களுக்குக் கட்டளையிடுகிற ஒவ்வொரு வார்த்தையையும்[a] கவனமாகக் கடைப்பிடியுங்கள். அதனுடன் எதையும் சேர்க்காதீர்கள்; அதிலிருந்து எதையும் நீக்காதீர்கள்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மொழியில் இது கூட்டுப்பொருளுடைய ஒருமை வடிவில், நேரடியாக ‘முழு வார்த்தையையும்’ என்று உள்ளது.
    reason: lexical_alternative
  - marker: b
    text: சில ஆங்கில வேதாகம வசன எண் மரபுகளில் இவ்வசனம் உபாகமம் 12:32 என எண்ணப்பட்டுள்ளது.
    reason: versification
lexical_decisions:
- source_word: כָּל הַדָּבָר
  choice: ஒவ்வொரு வார்த்தையையும்
  rationale: எபிரெய மொழியில் ‘வார்த்தை’ ஒருமையில் கூட்டுப்பொருளுடன் வருகிறது. தமிழில் ‘வார்த்தை முழுவதையும்’ என்பது இயல்பற்றதாக இருப்பதால், மூலத்தின் முழுமை வலியுறுத்தலை இயல்பாகத் தெரிவிக்க ‘ஒவ்வொரு வார்த்தையையும்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: מְצַוֶּה
  choice: கட்டளையிடுகிற
  rationale: பங்கேற்புவினை வடிவத்தின் நிகழ்கால அல்லது தொடர்நிலை வலிமையை நவீன தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: תִשְׁמְרוּ לַעֲשׂוֹת
  choice: கவனமாகக் கடைப்பிடியுங்கள்
  rationale: שׁמר + வினையெச்சக் கட்டமைப்பு கவனத்துடன் காத்து நடைமுறைப்படுத்துவதைக் குறிக்கிறது. ‘கடைப்பிடியுங்கள்’ கீழ்ப்படிந்து செயல்படும் பொருளையும், ‘கவனமாக’ அதன் விழிப்புணர்வையும் தருகிறது.
- source_word: לֹא תֹסֵף עָלָיו
  choice: அதனுடன் எதையும் சேர்க்காதீர்கள்
  rationale: עַל உடன் வரும் יסף, ஏற்கெனவே உள்ளதன்மேல் ஒன்றைச் சேர்ப்பதைக் குறிக்கிறது; இத்தடை தமிழில் தெளிவாகவும் இயல்பாகவும் இவ்வாறு அமைகிறது.
- source_word: וְלֹא תִגְרַע מִמֶּנּוּ
  choice: அதிலிருந்து எதையும் நீக்காதீர்கள்
  rationale: גרע என்பது குறைத்தல் அல்லது எடுத்துவிடுதல் எனப் பொருள்படும். ‘நீக்காதீர்கள்’ சட்டரீதியான தடை வலிமையைச் சுருக்கமாக வெளிப்படுத்துகிறது.
- source_word: אָנֹכִי
  choice: நான்
  rationale: தனிப்பட்ட சுட்டுப்பெயர் மூலத்தில் வெளிப்படையாக உள்ளது. தமிழில் ‘நானே’ என அதிகப்படியான முரண் வலியுறுத்தலைச் சேர்க்காமல் ‘நான்’ என்பது அதிகாரமுள்ள பேச்சாளரைத் தெளிவுபடுத்துகிறது.
theological_decisions:
- issue: வசன எண் மற்றும் உரையோட்டத் தொடர்பு
  choice: அடுத்த வசனத்தின் பொய்த்தீர்க்கதரிசி குறித்த உள்ளடக்கத்தைச் சேர்க்காமல், இவ்வசனத்தை முழுமையான தனிக் கட்டளையாக மொழிபெயர்த்தல்
  alternative: சில வசன எண் மரபுகளைப் பின்பற்றி இதை உபாகமம் 12:32 எனக் கொண்டு முந்தைய பகுதிக்கு இன்னும் நெருக்கமாக இணைத்தல்
  rationale: எபிரெய உரையில் இங்கே முழுமையான ஒரு கட்டளை உள்ளது. அது அடுத்த சட்டப்பகுதிக்கான மாற்றமாகவும் செயல்படலாம்; ஆனால் மொழிபெயர்ப்பில் அடுத்த வசனத்தின் கருத்தை முன்னதாகச் சேர்க்கக் கூடாது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கட்டளைநடை பயன்படுத்தப்பட்டுள்ளது. ‘கவனமாகக் கடைப்பிடியுங்கள்’ என்பது கவனித்துக் காத்தல் மற்றும் செயல்படுத்துதல் ஆகிய இரண்டையும் தக்கவைக்கிறது. இரண்டாம் நபர் பன்மைக்கான மரியாதை/பன்மை வினைமுற்றுகள் மூலத்தின் பன்மை முகவரியை வெளிப்படுத்துகின்றன.
