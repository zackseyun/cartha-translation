base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/013/006.yaml
  text: But that prophet[a], or that dreamer of dreams, shall be put to death, because he has spoken rebellion against Yahweh your God, who brought you out from the land of Egypt and redeemed you from the house of slavery, to drive you from the way in which Yahweh your God commanded you to walk[b]. So you shall purge the evil from your midst.
translation:
  language: ta
  text: ஆனால் அந்தத் தீர்க்கதரிசியோ அந்தக் கனவுகாண்பவனோ மரண தண்டனை பெற வேண்டும். ஏனெனில், எகிப்து நாட்டிலிருந்து உங்களை வெளியே கொண்டுவந்து, அடிமைகளின் வீட்டிலிருந்து[b] உன்னை மீட்ட உங்கள் கடவுளாகிய யாவேக்கு எதிராகக் கலகமான வார்த்தைகளை அவன் பேசியிருக்கிறான்[a]; நீ நடக்கும்படி உன் கடவுளாகிய யாவே உனக்குக் கட்டளையிட்ட வழியிலிருந்து உன்னை விலக்குவதற்காகவே அவன் அவ்வாறு செய்தான். அவ்வாறு, உன் நடுவிலிருந்து தீமையை அகற்றிவிடு.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘கலகமான வார்த்தைகள்’ என்பதற்கு ‘விசுவாசத்திலிருந்து விலகுதல்’ அல்லது ‘துரோகம்’ என்றும் பொருள் கொள்ளலாம். எபிரெயச் சொல் யாவேக்கு உரிய உடன்படிக்கை விசுவாசத்தைக் கைவிடுவதைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: 'சொல்லுக்குச் சொல்: ‘அடிமைகளின் வீடு’; வழக்கமாக ‘அடிமைத்தனத்தின் வீடு’ என்றும் மொழிபெயர்க்கப்படுகிறது.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַנָּבִיא הַהוּא
  choice: ஆனால் அந்தத் தீர்க்கதரிசியோ
  rationale: முந்தைய சூழலுடன் இணைக்கும் וְ இங்கு சட்டவழக்கின் எதிர்மறைத் தொடர்ச்சியாக இருப்பதால் ‘ஆனால்’ என மொழிபெயர்க்கப்பட்டது; demonstrative வலியுறுத்தலும் காக்கப்பட்டது.
- source_word: אוֹ חֹלֵם הַחֲלוֹם הַהוּא
  choice: கனவு காண்கிற அந்த மனிதனோ
  rationale: எபிரெயச் சொற்றொடரின் பொருளை இயல்பான நவீன தமிழில் தருகிறது; இரண்டாவது நபரையும் சுட்டும் ‘அந்த’ என்பதும் காக்கப்படுகிறது.
- source_word: יוּמָת
  choice: கொல்லப்பட வேண்டும்
  rationale: מות என்பதன் Hophal வடிவம் சாதாரண மரணத்தை அல்ல, ஏற்படுத்தப்படும் நீதித்துறை மரணத்தைச் சுட்டுகிறது.
- source_word: כִּי דִבֶּר סָרָה
  choice: ஏனெனில் ... அவன் கலகத்தைப் பேசியிருக்கிறான்
  rationale: סָרָה உடன்படிக்கை விசுவாசத்திலிருந்து விலகும் கலகம் அல்லது துரோகத்தைச் சுட்டுகிறது; எபிரெய வாக்கிய அமைப்பின் ‘பேசுதல்’ உருவகமும் காக்கப்படுகிறது.
- source_word: עַל יְהוָה אֱלֹהֵיכֶם
  choice: உங்கள் கடவுளாகிய யாவேக்கு எதிராக
  rationale: இந்தப் பகைமைச் சூழலில் עַל என்பது ‘எதிராக’ என்ற பொருளைத் தருகிறது; יהוה உடன்படிக்கைப் பெயராக ‘யாவே’ என ஒலிபெயர்க்கப்பட்டது.
- source_word: הַמּוֹצִיא אֶתְכֶם מֵאֶרֶץ מִצְרַיִם
  choice: எகிப்து நாட்டிலிருந்து உங்களை வெளியே கொண்டுவந்து
  rationale: விடுதலைப் பயணத்தைச் சுட்டும் வழக்கமான எபிரெய மொழியை நேராகவும் இயல்பாகவும் தருகிறது.
- source_word: וְהַפֹּדְךָ מִבֵּית עֲבָדִים
  choice: அடிமைகளின் வீட்டிலிருந்து உன்னை மீட்ட
  rationale: פּדה என்பதன் மீட்பு உணர்வையும் בֵּית עֲבָדִים என்பதன் concrete சமூகப் படிமத்தையும் காக்கிறது; மூலத்தில் பன்மையிலிருந்து ஒருமைக்கு மாறுவது அப்படியே வைக்கப்பட்டது.
- source_word: לְהַדִּיחֲךָ מִן הַדֶּרֶךְ
  choice: வழியிலிருந்து உன்னை விலக்கவே
  rationale: נדח என்பதன் வழியிலிருந்து அகற்றுதல் அல்லது வழிதவறச் செய்தல் என்ற வலிமையையும் ‘வழி’ உருவகத்தையும் காக்கிறது.
- source_word: אֲשֶׁר צִוְּךָ יְהוָה אֱלֹהֶיךָ לָלֶכֶת בָּהּ
  choice: உங்கள் கடவுளாகிய யாவே உனக்கு நடக்கக் கட்டளையிட்ட வழி
  rationale: ‘வழியில் நடத்தல்’ என்ற உடன்படிக்கைச் சார்ந்த நடத்தை உருவகம் ‘நடக்க’ என்பதன் மூலம் பாதுகாக்கப்படுகிறது.
- source_word: וּבִעַרְתָּ הָרָע מִקִּרְבֶּךָ
  choice: இவ்வாறு உன் நடுவிலிருந்து தீமையை அகற்றிவிட வேண்டும்
  rationale: உபாகமச் சட்டச் சூத்திரத்தில் בער என்பது தீமையைத் தீர்மானமாக அகற்றுவதைக் குறிக்கிறது; ‘அகற்றிவிட’ அந்த நிறைவு வலிமையைத் தருகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயர்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் தனிப்பட்ட உடன்படிக்கைப் பெயரான יהוה நேரடியாக உள்ளது; பட்டப்பெயராக மாற்றாமல் ஒலிபெயர்க்கப்பட்டது.
- issue: סָרָה என்பதன் உடன்படிக்கைச் சார்ந்த பொருள்
  choice: கலகம்
  alternative: விசுவாசத்திலிருந்து விலகுதல் / மதத்துரோகம்
  rationale: சொல் கலகத்தையும் உடன்படிக்கை விசுவாசத்திலிருந்து விலகுதலையும் உள்ளடக்குகிறது. பிரதான உரையில் பொதுவாகப் புரியும் ‘கலகம்’ வைக்கப்பட்டு, அதன் விரிந்த உணர்வு அடிக்குறிப்பில் தரப்பட்டது.
- issue: ஒருமை–பன்மை இரண்டாம் நபர் மாற்றம்
  choice: ‘உங்களை’ என்பதிலிருந்து ‘உன்னை/உனக்கு/உன்’ என்பதற்கான மூல மாற்றத்தைப் பாதுகாத்தல்
  alternative: முழுவதையும் பன்மையாக ஒருமைப்படுத்துதல்
  rationale: எபிரெயம் சமூகத்தைப் பன்மையில் அழைத்த பின் ஒவ்வொரு உடன்படிக்கை உறுப்பினரையும் ஒருமையில் அணுகுகிறது; அந்த உரைத்தன்மை தமிழிலும் காக்கப்பட்டது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சட்டவழக்கிற்கேற்ற கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. ‘வழியில் நடக்க’ என்ற வேதாகம உருவகமும் ‘அடிமைகளின் வீடு’ என்ற மூலப் படிமமும் காக்கப்பட்டுள்ளன. மூல எபிரெயத்தில் உள்ள பன்மை–ஒருமை அழைப்புமுறை மாற்றம் திட்டமிட்டு பாதுகாக்கப்பட்டது.
