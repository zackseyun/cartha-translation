base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/013/005.yaml
  text: You shall walk after Yahweh your God and fear him[a], and keep his commandments and listen to his voice, and serve him[c][b], and cling to him.
translation:
  language: ta
  text: உங்கள் கடவுளாகிய யாவேயைப் பின்பற்றி நடங்கள்[a]; அவருக்கு அஞ்சுங்கள்; அவருடைய கட்டளைகளைக் கைக்கொள்ளுங்கள்; அவருடைய குரலுக்குச் செவிகொடுங்கள்[b]; அவருக்குப் பணிசெய்யுங்கள்; அவரைப் பற்றிக்கொள்ளுங்கள்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உங்கள் கடவுளாகிய யாவேயைப் பின்பற்றுங்கள்.” எபிரெய மொழியில் சொல்லுக்குச் சொல், “உங்கள் கடவுளாகிய யாவேயின் பின்னால் நடங்கள்.”
    reason: lexical_alternative
  - marker: b
    text: “அவருடைய குரலுக்குச் செவிகொடுங்கள்” என்பது “அவருடைய குரலுக்குக் கீழ்ப்படியுங்கள்” அல்லது “அவருக்குக் கீழ்ப்படியுங்கள்” என்றும் பொருள்படலாம்.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, “அவரை உறுதியாகப் பற்றிக்கொள்ளுங்கள்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחֲרֵי יְהוָה אֱלֹהֵיכֶם תֵּלֵכוּ
  choice: உங்கள் கடவுளாகிய யாவேயைப் பின்பற்றி நடங்கள்
  rationale: ‘பின்னால் நட’ என்ற எபிரெய உருவகத்தை இயல்பான தமிழில் ‘பின்பற்றி நட’ எனக் காத்து, உடன்படிக்கை சார்ந்த பற்றுறுதியையும் நடத்தையையும் வெளிப்படுத்துகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இது பட்டப்பெயர் அல்ல, தேவனுடைய தனிப்பெயரான நான்கெழுத்துப் பெயர்; ‘Yahweh’ என்பதற்கான தெளிவான தமிழ் ஒலிபெயர்ப்பு பயன்படுத்தப்பட்டுள்ளது.
- source_word: תִירָאוּ
  choice: அவருக்கு அஞ்சுங்கள்
  rationale: இறைவனைச் சார்ந்த பயம், மரியாதை, பயபக்தி ஆகிய பரப்பை மென்மைப்படுத்தாமல் ‘அஞ்சுங்கள்’ காக்கிறது.
- source_word: מִצְוֺתָיו תִּשְׁמֹרוּ
  choice: அவருடைய கட்டளைகளைக் கைக்கொள்ளுங்கள்
  rationale: שׁמר என்பதன் ‘காத்தல்/கடைப்பிடித்தல்’ பொருளை உடன்படிக்கைச் சூழலில் இயல்பான ‘கைக்கொள்ளுங்கள்’ தெரிவிக்கிறது.
- source_word: וּבְקֹלוֹ תִשְׁמָעוּ
  choice: அவருடைய குரலுக்குச் செவிகொடுங்கள்
  rationale: சொற்றொடரின் நேரடியான ‘குரலைக் கேள்’ வடிவத்தைப் பாதுகாக்கிறது; அதிலுள்ள கீழ்ப்படிதல் நிழற்பொருளை அடிக்குறிப்பு சுட்டுகிறது.
- source_word: תַעֲבֹדוּ
  choice: அவருக்குப் பணிசெய்யுங்கள்
  rationale: עבד என்பதில் சேவையும் வழிபாட்டுச் சேவையும் அடங்கலாம்; ‘பணிசெய்யுங்கள்’ அந்தப் பரப்பை தேவையின்றிக் குறுக்கவில்லை.
- source_word: תִדְבָּקוּן
  choice: அவரைப் பற்றிக்கொள்ளுங்கள்
  rationale: דבק குறிக்கும் நெருக்கமான பற்று மற்றும் உறுதியான உடன்படிக்கை விசுவாசத்தை உயிரோட்டமாகக் காட்டுகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூல உரையில் பட்டப்பெயர் அல்ல, தனிப்பெயரே உள்ளது; ஆகவே அதை பட்டப்பெயரால் மாற்றாமல் ஒலிபெயர்த்துள்ளது.
- issue: שׁמע בְּקוֹל என்பதை வெளிப்படையாக ‘கீழ்ப்படி’ என மொழிபெயர்க்கலாமா
  choice: அவருடைய குரலுக்குச் செவிகொடுங்கள்
  alternative: அவருக்குக் கீழ்ப்படியுங்கள்
  rationale: எபிரெயச் சொற்றொடரின் கேட்பது/செவிகொடுப்பது என்ற உருவத்தை முதன்மை உரை காக்கிறது; அதனுள் உள்ள கீழ்ப்படிதல் பொருள் விளக்கமாக மட்டும் தரப்படுகிறது.
- issue: עבד என்பதை ‘சேவை செய்’ அல்லது ‘வழிபடு’ எனக் குறுக்குதல்
  choice: அவருக்குப் பணிசெய்யுங்கள்
  alternative: அவரை வழிபடுங்கள்
  rationale: இச்சொல் இறைவனைச் சார்ந்த சேவை மற்றும் வழிபாடு இரண்டையும் தாங்கக்கூடும்; பரந்த பொருளை முதன்மை உரை பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கட்டளைநடை பயன்படுத்தப்பட்டுள்ளது. தொடர்ச்சியான எபிரெய வினைகளின் ஓசையை அரைப்புள்ளிகளால் காத்து, ‘பின்பற்றி நட’, ‘குரலுக்குச் செவிகொடு’, ‘பற்றிக்கொள்’ ஆகிய மூல உருவகங்கள் இயன்றவரை பாதுகாக்கப்பட்டுள்ளன.
