revisions:
- from: உங்களைச் சுற்றியுள்ள மக்களின் தெய்வங்களில்—அந்த மக்கள் உனக்கு அருகில் இருந்தாலும் உன்னைவிட்டுத் தொலைவில் இருந்தாலும், பூமியின் ஒரு முனைமுதல் மறுமுனைவரை[a] எங்கிருந்தாலும்—
  to: உங்களைச் சுற்றியுள்ள மக்களின் தெய்வங்களிலிருந்து—அந்த மக்கள் உனக்கு அருகில் இருந்தாலும் உன்னைவிட்டுத் தொலைவில் இருந்தாலும், பூமியின் ஒரு முனையிலிருந்து மறுமுனைவரை எங்கிருந்தாலும்—
  rationale: The revision corrects the semantic force of the opening Hebrew preposition without changing the intended continuation syntax. ‘ஒரு முனையிலிருந்து மறுமுனைவரை’ is adjusted for standard Tamil postpositional phrasing, and the footnote is conformed to that wording while preserving the stated lexical ambiguity.
