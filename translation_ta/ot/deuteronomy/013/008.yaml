    text: அல்லது, ‘நாட்டின் ஒரு முனையிலிருந்து மறுமுனைவரை.’ எபிரெயச் சொல் אֶרֶץ என்பதற்கு ‘பூமி’ அல்லது ‘நாடு’ என்று பொருள் கொள்ளலாம்.
    reason: lexical_alternative
