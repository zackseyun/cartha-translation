language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: מֵ/אֱלֹהֵ֣י הָֽ/עַמִּ֗ים אֲשֶׁר֙ סְבִיבֹ֣תֵי/כֶ֔ם הַ/קְּרֹבִ֣ים אֵלֶ֔י/ךָ א֖וֹ הָ/רְחֹקִ֣ים מִמֶּ֑/ךָּ מִ/קְצֵ֥ה הָ/אָ֖רֶץ וְ/עַד קְצֵ֥ה הָ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/013/008.yaml
  text: from the gods of the peoples that are around you[a], whether near to you or far from you, from one end of the earth to the other end of the earth—
translation:
  language: ta
  text: உங்களைச் சுற்றியுள்ள மக்களின் தெய்வங்களிலிருந்து—அந்த மக்கள் உனக்கு அருகில் இருந்தாலும் உன்னைவிட்டுத் தொலைவில் இருந்தாலும், பூமியின் ஒரு முனையிலிருந்து மறுமுனைவரை எங்கிருந்தாலும்—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מֵאֱלֹהֵי הָעַמִּים
  choice: மக்களின் தெய்வங்களில்
  rationale: מִן இங்கு முந்தைய வாக்கியத்துடன் இணையும் ‘இவர்களின் தெய்வங்களில்/இவர்களுடைய தெய்வங்களிலிருந்து’ என்ற உறவைத் தருகிறது. עַמִּים என்பதன் இனக்குழு சார்ந்த பன்மைப் பொருளை ‘மக்கள்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: אֲשֶׁר סְבִיבֹתֵיכֶם
  choice: உங்களைச் சுற்றியுள்ள
  rationale: சுற்றுப்புறத்தில் இருப்பதைக் குறிக்கும் எபிரெயச் சொல்லின் இடவியல் பொருளையும், பன்மை இரண்டாம் நபர் வடிவத்தையும் காக்கிறது.
- source_word: הַקְּרֹבִים אֵלֶיךָ אוֹ הָרְחֹקִים מִמֶּךָּ
  choice: அந்த மக்கள் உனக்கு அருகில் இருந்தாலும் உன்னைவிட்டுத் தொலைவில் இருந்தாலும்
  rationale: ‘அருகில்—தொலைவில்’ என்ற எதிரிணையைத் தெளிவாக வைத்திருக்கிறது. எபிரெயத்தில் இங்கு இரண்டாம் நபர் ஒருமைக்கு மாறுவதையும் ‘உனக்கு/உன்னை’ எனப் பாதுகாக்கிறது; உரிச்சொற்கள் குறிக்கும் ‘மக்கள்’ என்பதைத் தமிழில் தெளிவுக்காக வெளிப்படுத்துகிறது.
- source_word: מִקְצֵה הָאָרֶץ וְעַד קְצֵה הָאָרֶץ
  choice: பூமியின் ஒரு முனைமுதல் மறுமுனைவரை
  rationale: முழுமையான புவியியல் பரப்பைக் குறிக்கும் மரபுத்தொடரின் வலிமையை இயல்பான தமிழில் தருகிறது. אֶרֶץ என்பதற்கான ‘நாடு’ என்ற சாத்தியத்தைக் குறிப்பில் பாதுகாக்கிறது.
theological_decisions:
- issue: הָאָרֶץ என்பதன் பரப்பு
  choice: பூமி
  alternative: நாடு
  rationale: ‘ஒரு முனைமுதல் மறுமுனைவரை’ என்ற விரிவான மரபுத்தொடரில் ‘பூமி’ உலகளாவிய சொல்லாட்சியின் வலிமையை நன்கு வெளிப்படுத்துகிறது; இருப்பினும் எபிரெயச் சொல் ‘நாடு’ என்றும் பொருள்படக்கூடும் என்பதால் மாற்று வாசிப்பு அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன, பொதுவாகப் புரியும், கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. மூலத்தில் உள்ள பன்மை ‘உங்களை’ என்பதிலிருந்து ஒருமை ‘உனக்கு’ என்பதற்கான மாறுதல் பாதுகாக்கப்பட்டுள்ளது. இது முந்தைய வாக்கியத்திலிருந்து தொடரும் துணைத் தொடர் என்பதால் இறுதியில் நீண்ட கோடு வைக்கப்பட்டுள்ளது.
