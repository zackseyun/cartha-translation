  text: וּ/בָ֤א הָ/אוֹת֙ וְ/הַ/מּוֹפֵ֔ת אֲשֶׁר דִּבֶּ֥ר אֵלֶ֖י/ךָ לֵ/אמֹ֑ר נֵֽלְכָ֞ה אַחֲרֵ֨י אֱלֹהִ֧ים אֲחֵרִ֛ים אֲשֶׁ֥ר לֹֽא יְדַעְתָּ֖/ם וְ/נָֽעָבְדֵֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/013/003.yaml
  text: and the sign or the wonder comes to pass[a], about which he spoke to you, saying, ‘Let us go after other gods, which you have not known[c][b], and let us serve them,’
translation:
  language: ta
  text: அவன் உன்னிடம் கூறிய அந்த அடையாளமோ அற்புதமோ நிகழ்ந்து[a], ‘நீ அறிந்திராத வேறு தெய்வங்களைப் பின்தொடர்ந்து, அவற்றுக்குப் பணிசெய்வோம்[b]’ என்று அவன் சொல்லி,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயில் நேரடியாக, “அந்த அடையாளமும் அற்புதமும் நிகழ்ந்து.” இந்த இணைச்சொல் “அடையாளமோ அற்புதமோ” என்ற பொருளிலும் பயன்படலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அவற்றை வழிபடுவோம்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָא
  choice: நிகழ்ந்து
  rationale: வினைச்சொல்லின் அடிப்படைப் பொருள் ‘வந்து’ என்பதாக இருந்தாலும், முன்னறிவிக்கப்பட்ட அடையாளம் உண்மையில் நடைபெறுவதை இச்சூழலில் ‘நிகழ்ந்து’ இயல்பாகத் தெரிவிக்கிறது.
- source_word: הָאוֹת וְהַמּוֹפֵת
  choice: அந்த அடையாளமோ அற்புதமோ
  rationale: אוֹת என்பது உறுதிப்படுத்தும் அடையாளத்தையும் מוֹפֵת என்பது வியப்பூட்டும் நிகழ்வையும் குறிக்கிறது. இணைச்சொல் இங்கு இரண்டு வகைகளில் ஏதேனும் ஒன்றைக் குறிக்கக்கூடும் என்பதால், நவீன தமிழில் ‘அடையாளமோ அற்புதமோ’ என வழங்கப்பட்டது; எபிரெய உரையின் ‘மற்றும்’ வடிவம் அடிக்குறிப்பில் காக்கப்படுகிறது.
- source_word: אֲשֶׁר דִּבֶּר אֵלֶיךָ
  choice: அவன் உன்னிடம் முன்னறிவித்த
  rationale: அடையாளம் நிகழ்வதற்கு முன்பே அதைப்பற்றி சொன்னான் என்பது சூழலாலும் וּבָא என்பதாலும் தெளிவாகிறது. ‘முன்னறிவித்த’ என்பது தமிழில் உறவுத்தொடரைச் சுருக்கி இயல்பாக்குகிறது; தீர்க்கதரிசனத்தின் உண்மைத்தன்மையைத் தனியே உறுதிப்படுத்தாது.
- source_word: לֵאמֹר
  choice: என்று அவன் சொன்னாலும்
  rationale: மேற்கோள் உரையை அறிமுகப்படுத்தும் எபிரெய வடிவம் தமிழில் ‘என்று’ மூலம் வழங்கப்பட்டது. அடுத்த வசனத்தில் நிறைவுபெறும் நிபந்தனை அமைப்பைத் தெளிவாக்க ‘சொன்னாலும்’ பயன்படுத்தப்பட்டது.
- source_word: נֵלְכָה אַחֲרֵי
  choice: பின்பற்றிச் சென்று
  rationale: இந்தச் சொற்றொடர் ஒருவரைப் பின்தொடர்வதையும் அவருக்கு மதரீதியான பற்றுறுதி காட்டுவதையும் குறிக்கிறது. எபிரெய உருவகத்தையும் தமிழ் இயல்பையும் ஒருசேர காக்கிறது.
- source_word: אֱלֹהִים אֲחֵרִים
  choice: வேறு தெய்வங்களை
  rationale: உபாகமத்தில் காணப்படும் உடன்படிக்கைச் சூழலிலான வழக்கமான சொற்றொடருக்கு நேரான, இயல்பான தமிழ்.
- source_word: אֲשֶׁר לֹא יְדַעְתָּם
  choice: நீ அறிந்திராத
  rationale: ידע என்பதிலுள்ள அறிதல் அல்லது பழக்கமுள்ள தொடர்பு என்ற திறந்த பொருளை இது காக்கிறது; அந்தத் தெய்வங்களின் இயல்பைப் பற்றி உரை கூறாததைச் சேர்ப்பதில்லை.
- source_word: וְנָעָבְדֵם
  choice: அவற்றுக்குப் பணிசெய்வோம்
  rationale: עבד என்பதன் அடிப்படை ‘பணிசெய்தல்/சேவித்தல்’; இங்கு அது தெய்வ வழிபாட்டுச் சேவையைக் குறிக்கிறது. விரிவான உடன்படிக்கைப் பொருளை ‘பணிசெய்வோம்’ காக்கிறது; ‘வழிபடுவோம்’ அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: வேறு தெய்வங்களைப் பற்றிய குறிப்பின் வடிவம்
  choice: நீ அறிந்திராத வேறு தெய்வங்களை
  alternative: உனக்குத் தெரியாத வேறு தெய்வங்களை
  rationale: ‘அறிந்திராத’ என்பது எபிரெய ידע சொல்லிலுள்ள அறிவு, அங்கீகாரம், உறவுசார் பழக்கம் ஆகிய சாத்தியங்களைத் திறந்தவையாக வைக்கிறது. அந்தத் தெய்வங்களுக்கு தனிப்பட்ட ஆளுமையையோ உண்மையான தெய்வீக நிலையையோ மொழிபெயர்ப்பு வழங்கவில்லை; அவை இல்லை என்றும் இவ்வசனத்துக்குள் கூடுதலாகச் சொல்லவில்லை.
- issue: עבד என்பதன் மதச்சார்ந்த பொருள்
  choice: அவற்றுக்குப் பணிசெய்வோம்
  alternative: அவற்றை வழிபடுவோம்
  rationale: சூழலில் வழிபாடு நிச்சயமாக உட்பட்டிருந்தாலும், ‘பணிசெய்தல்’ என்ற விரிவான உடன்படிக்கைச் சார்ந்த கருத்தை முதன்மை உரை காக்கிறது; தெளிவான சூழல்சார் மாற்று அடிக்குறிப்பில் உள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளும் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. இது அடுத்த வசனத்தில் தொடரும் நிபந்தனை வாக்கியம் என்பதால் இறுதியில் காற்புள்ளி வைக்கப்பட்டுள்ளது. ‘அவற்றுக்கு’ என்பது தமிழில் இயல்பான அஃறிணைச் சுட்டாக இருந்து, பொய்த் தெய்வங்களுக்கு உரை கூறாத ஆளுமையைச் சேர்ப்பதைத் தவிர்க்கிறது.
