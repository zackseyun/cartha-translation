- from: ஏனெனில், நீ அவனை நிச்சயமாகக் கொல்ல வேண்டும்; அவனைக் கொல்வதற்கு முதலில் உன் கை அவன்மேல் இருக்க வேண்டும்[a]; அதன்பின் எல்லா மக்களின் கையும் அவன்மேல் இருக்க வேண்டும்.
  to: ஏனெனில், நீ அவனை நிச்சயமாகக் கொல்ல வேண்டும்[a]; அவனைக் கொல்வதற்கு முதலில் உன் கையே அவனுக்கு எதிராகச் செயல்பட வேண்டும்; அதன்பின் எல்லா மக்களின் கைகளும் செயல்பட வேண்டும்.
