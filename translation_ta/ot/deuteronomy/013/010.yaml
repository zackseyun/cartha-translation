base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/013/010.yaml
  text: For you must surely put him to death; your hand shall be first against him to put him to death[a], and afterward the hand of all the people.
translation:
  language: ta
  text: ஏனெனில், நீ அவனை நிச்சயமாகக் கொல்ல வேண்டும்[a]; அவனைக் கொல்வதற்கு முதலில் உன் கையே அவனுக்கு எதிராகச் செயல்பட வேண்டும்; அதன்பின் எல்லா மக்களின் கைகளும் செயல்பட வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நீ அவனை நிச்சயமாகக் கொல்லவேண்டும்.” எபிரெயத்தில் வினைச்சொல்லின் வலியுறுத்தும் வடிவம் பயன்படுத்தப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய கட்டளைக்கான காரணத்தையோ விளக்கத்தையோ அறிமுகப்படுத்துவதால், தர்க்கத் தொடர்பை இயல்பான தமிழில் காக்கிறது.
- source_word: הָרֹג תַּהַרְגֶנּוּ
  choice: நீ அவனை நிச்சயமாகக் கொல்ல வேண்டும்
  rationale: முற்றுவினையெச்சத்துடன் வினைச்சொல் இணையும் எபிரெய வலியுறுத்தலை ‘நிச்சயமாக’ மற்றும் ‘வேண்டும்’ மூலம் வெளிப்படுத்துகிறது; மரணத் தண்டனையின் நேரடியான பொருளையும் மறைக்கவில்லை.
- source_word: יָדְךָ
  choice: உன் கை
  rationale: எபிரெய மூலத்தின் தெளிவான உடலுறுப்பு உருவகத்தையும் சட்டச் செயல்பாட்டின் நேரடித் தன்மையையும் காக்கிறது.
- source_word: תִּהְיֶה בּוֹ בָרִאשׁוֹנָה
  choice: முதலில் உன் கை அவன்மேல் இருக்க வேண்டும்
  rationale: தண்டனையை நிறைவேற்றுவதில் குற்றஞ்சாட்டியவரின் கை முதலில் செயல்பட வேண்டும் என்ற வரிசையை, எபிரெய மொழியமைப்புக்கு நெருக்கமாகக் காட்டுகிறது.
- source_word: לַהֲמִיתוֹ
  choice: அவனைக் கொல்வதற்கு
  rationale: ஹிஃபில் வடிவம் ‘மரணமடையச் செய்தல்’ எனும் காரணவினைப் பொருளைக் கொண்டது; இங்கு சட்டரீதியாக உயிரை முடிப்பதைக் குறிக்க இயல்பான தமிழில் இவ்வாறு தரப்படுகிறது.
- source_word: וְיַד כָּל הָעָם
  choice: எல்லா மக்களின் கையும்
  rationale: ‘உன் கை’ என்பதுடனான எபிரெய இணைநிலையையும், சமூகமுழுவதின் பங்கேற்பையும் காக்கிறது.
- source_word: בָּאַחֲרֹנָה
  choice: அதன்பின்
  rationale: ‘முதலில்’ என்பதற்கு எதிரிணையாக அடுத்த கட்டச் செயலை இயல்பாகக் குறிக்கிறது.
theological_decisions:
- issue: சட்டரீதியான மரணத் தண்டனை மொழியை மென்மைப்படுத்தாமலும் மிகைப்படுத்தாமலும் மொழிபெயர்த்தல்
  choice: கொல்ல வேண்டும் / கொல்வதற்கு
  alternative: மரண தண்டனை நிறைவேற்ற வேண்டும் / சாகடிக்க வேண்டும்
  rationale: மூலத்தில் הרג மற்றும் מות ஆகிய இரண்டு வேர்கள் பயன்படுத்தப்படுகின்றன. தமிழில் இயல்பும் தெளிவும் கருதி ‘கொல்’ பயன்படுத்தப்படுகிறது; இது சட்டச் சூழலை மறைக்காது, அதேவேளை தேவையற்ற கொடூர மொழியையும் சேர்க்காது.
translation_notes:
  register: நவீன நிலையான தமிழில், சட்டக் கட்டளைக்கேற்ற கண்ணியமான ஆனால் நேரடியான நடை. ‘உன் கை’ மற்றும் ‘எல்லா மக்களின் கை’ என்ற மூல உருவகமும் இணைநிலையும் பாதுகாக்கப்பட்டுள்ளன.
