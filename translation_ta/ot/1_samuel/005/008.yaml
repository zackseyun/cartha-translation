base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/005/008.yaml
  text: So they sent and gathered all the lords of the Philistines to themselves[a], and said, “What shall we do with the ark of the God of Israel?” And they said, “Let the ark of the God of Israel be brought around to Gath.” So they brought the ark of the God of Israel around.
translation:
  language: ta
  text: ஆகவே, அவர்கள் ஆள்களை அனுப்பி, பெலிஸ்தியர்களின் தலைவர்கள் எல்லாரையும் தங்களிடம் கூட்டிவந்து, “இஸ்ரவேலின் கடவுளின் பெட்டியை நாம் என்ன செய்வது?” என்று கேட்டார்கள். அதற்கு அவர்கள், “இஸ்ரவேலின் கடவுளின் பெட்டி காத்துக்கு மாற்றப்படட்டும்[a]” என்றார்கள். அவர்கள் இஸ்ரவேலின் கடவுளின் பெட்டியைக் காத்துக்கு மாற்றினார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இஸ்ரவேலின் கடவுளின் பெட்டி காத்துக்குச் சுற்றிச் செல்லட்டும்.” எபிரெய வினைச்சொல் எடுத்துச் சென்ற துல்லியமான முறையைக் குறிப்பிடாமல், அதன் இயக்கத்தையோ இடமாற்றத்தையோ வலியுறுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלְחוּ
  choice: அவர்கள் ஆளனுப்பி
  rationale: שׁלח என்பதன் நேரடிப் பொருள் ‘அனுப்புதல்’. அடுத்த வினைச்சொல் தலைவர்களைக் கூட்டுவதைச் சொல்வதால், தமிழில் யாரை அனுப்பினார்கள் என்பதை இயல்பாக உணர்த்த ‘ஆளனுப்பி’ என மொழிபெயர்க்கப்பட்டது.
- source_word: וַיַּאַסְפוּ
  choice: கூட்டிவந்து
  rationale: אָסף என்பது ஒன்றுகூட்டுதல் அல்லது திரட்டுதல். אֲלֵיהֶם என்பதையும் சேர்த்து, தலைவர்கள் பேசுகிறவர்களின் இடத்திற்குக் கூட்டிவரப்பட்டதை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: סַרְנֵי פְלִשְׁתִּים
  choice: பெலிஸ்தியர்களின் தலைவர்கள்
  rationale: סֶרֶן என்பது பெலிஸ்திய நகரங்களின் ஆட்சித் தலைவர்களுக்குரிய சிறப்புப் பட்டம். ‘தலைவர்கள்’ என்பது அரச மரபுரிமையை ஊகிக்காமல் அவர்களுடைய அதிகார நிலையைத் தெளிவாகக் காட்டுகிறது.
- source_word: מַה נַּעֲשֶׂה
  choice: நாம் என்ன செய்வது?
  rationale: முதல் நபர் பன்மை நிறைவுறா வினை ஆலோசனை கேட்கும் தன்மையுடையது; இந்தத் தமிழ்ச் சொற்றொடர் அந்த ஆலோசனைத் தொனியை இயல்பாகப் பாதுகாக்கிறது.
- source_word: לַאֲרוֹן אֱלֹהֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் கடவுளுடைய பெட்டியை
  rationale: ל முன்னிடைச்சொல் இங்கு ‘அதைப் பற்றி/அதற்கு என்ன செய்வது’ என்ற பொருளில் உள்ளது. אָרוֹן என்பதற்கு இவ்வசனத்தில் இல்லாத ‘உடன்படிக்கை’ என்ற சொல்லைச் சேர்க்காமல் ‘பெட்டி’ என மொழிபெயர்க்கப்பட்டது.
- source_word: גַּת
  choice: காத்
  rationale: இடப்பெயர் நவீனத் தமிழில் ஒலிபெயர்க்கப்பட்டது.
- source_word: יִסֹּב
  choice: திருப்பி அனுப்பப்படட்டும்
  rationale: סבב என்பது திரும்புதல், சுற்றிச் செல்லுதல், வேறிடத்திற்குத் திருப்புதல் ஆகிய பொருட்களைக் கொண்டது. சூழலில் பெட்டி காத் நகருக்கு மாற்றப்படுவதால் இச்சொற்றொடர் இயல்பான தமிழாக உள்ளது; வினையின் விரிவான இயக்கப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: וַיַּסֵּבּוּ
  choice: திருப்பி அனுப்பினார்கள்
  rationale: ஹிஃபீல் வடிவம் பெட்டியைச் செல்லச் செய்ததை, அதாவது வேறிடத்துக்கு மாற்றியதை, குறிக்கிறது. முந்தைய கட்டளையுடன் சொல்லாட்சித் தொடர்ச்சியையும் இது காக்கிறது.
