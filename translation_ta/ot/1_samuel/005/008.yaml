  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. ‘தேவன்’ என்பதற்குப் பதில் சமகாலப் பொதுத் தமிழில் இயல்பான ‘கடவுள்’ பயன்படுத்தப்பட்டது. ‘உடன்படிக்கைப் பெட்டி’ என்று விரிவாக்காமல் எபிரெய மூலத்தின் சொல் அளவு காக்கப்பட்டது.
