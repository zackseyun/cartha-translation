base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/005/002.yaml
  text: So the Philistines took the ark of God and brought it into the house of Dagon[a], and set it beside Dagon.
translation:
  language: ta
  text: அப்போது பெலிஸ்தியர்கள் கடவுளின் பேழையை எடுத்து, அதைத் தாகோனின் இல்லத்திற்குள்[a] கொண்டுவந்து, தாகோனின் அருகில் வைத்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தாகோனின் கோவிலுக்குள்.” சொல்லுக்குச் சொல், “தாகோனின் இல்லத்திற்குள்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְחוּ
  choice: எடுத்துக்கொண்டு
  rationale: לקח இங்கு நிகழ்ச்சித் தொடரில் ‘எடுத்தல்’ என்ற இயல்பான பொருளில் வருகிறது; ‘கைப்பற்றினர்’ போன்ற சொல் மூலத்தில் இல்லாத கூடுதல் வலிமையைச் சேர்க்கும்.
- source_word: פְלִשְׁתִּים
  choice: பெலிஸ்தியர்கள்
  rationale: இந்த மக்களினத்திற்கான தமிழில் பரவலாக அறியப்பட்ட பெயர்.
- source_word: אֲרוֹן הָאֱלֹהִים
  choice: கடவுளின் உடன்படிக்கைப் பெட்டி
  rationale: אֲרוֹן என்பது பெட்டி எனப் பொருள்படும்; இச்சூழலில் அது புனித உடன்படிக்கைப் பெட்டியைக் குறிக்கிறது. הָאֱלֹהִים என்பதால் ‘கடவுள்’ என மொழிபெயர்க்கப்பட்டது; இவ்வசனத்தில் YHWH என்ற திருப்பெயர் இல்லை.
- source_word: וַיָּבִיאוּ אֹתוֹ
  choice: அதைக் ... கொண்டுவந்து
  rationale: Hiphil வடிவிலுள்ள בוא என்பதன் இயல்பான பொருள் ‘கொண்டுவருதல்’; சுட்டுப்பெயர் பெட்டியையே குறிக்கிறது.
- source_word: בֵּית דָּגוֹן
  choice: தாகோனின் இல்லம்
  rationale: בֵּית என்பதன் நேரடிப் பொருள் ‘இல்லம்/வீடு’; சூழலில் அது தாகோனின் கோவிலைக் குறிக்கிறது. நேரடி உருவகம் முதன்மை உரையில் காக்கப்பட்டு, சூழற்பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: וַיַּצִּיגוּ אֹתוֹ
  choice: அதை ... வைத்தார்கள்
  rationale: Hiphil வடிவிலுள்ள יצג என்பது ஒன்றை ஓரிடத்தில் நிறுத்துதல் அல்லது வைத்தல்; தமிழில் ‘வைத்தார்கள்’ இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: אֵצֶל דָּגוֹן
  choice: தாகோனின் அருகில்
  rationale: אֵצֶל அருகாமையைக் குறிக்கிறது. ஆலயச் சூழலில் இது தாகோனின் சிலையைக் குறித்திருக்கலாம்; ஆனால் எபிரெயம் ‘தாகோன்’ என்று மட்டும் சொல்வதால் அந்தத் தெளிவின்மை காக்கப்படுகிறது.
theological_decisions:
- issue: ‘கடவுளின் பெட்டி’ என்பதில் உள்ள இறைக் குறிப்பு
  choice: ‘கடவுள்’ என்ற இறைக் குறிப்பைப் பேணுதல்
  alternative: ‘ஆண்டவரின் உடன்படிக்கைப் பெட்டி’
  rationale: மூலத்தில் הָאֱלֹהִים உள்ளது; YHWH இல்லை. ஆகவே பழக்கமான வேறு இறைப் பட்டத்துடன் ஒத்திசைக்காமல் மூலத்தின் குறிப்பு காக்கப்படுகிறது.
- issue: தாகோன் என்ற இரண்டாவது குறிப்பின் பொருள்
  choice: ‘தாகோன்’ என்றே மொழிபெயர்த்தல்
  alternative: ‘தாகோனின் சிலை’
  rationale: சூழல் தெய்வச் சிலையைச் சுட்டுவதாக இருந்தாலும், எபிரெய உரை ‘தாகோன்’ என்று மட்டுமே கூறுகிறது. ‘சிலை’ என்று சேர்ப்பது மறைமுகமாக உள்ள தகவலை வெளிப்படையாக்கிவிடும்.
translation_notes:
  register: நவீனத் தரத் தமிழ்; இயல்பான, கண்ணியமான கதைநடை. ‘தாகோனின் இல்லம்’ என்ற எபிரெய உருவகம் முதன்மை உரையில் பேணப்பட்டு, ‘கோவில்’ என்ற சூழல்சார் மாற்று அடிக்குறிப்பில் கொடுக்கப்பட்டுள்ளது.
