base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/005/007.yaml
  text: When the men of Ashdod saw that it was so[a], they said, “The ark of the God of Israel must not remain with us[b], because his hand is heavy against us and against Dagon our god.”
translation:
  language: ta
  text: அஸ்தோத்தைச் சேர்ந்த ஆண்கள் நிலைமை இவ்வாறு இருப்பதைக் கண்டபோது, “இஸ்ரவேலின் கடவுளுடைய பெட்டி நம்மோடு இருக்கக்கூடாது[a]. ஏனெனில், அவருடைய கை நம்மீதும் நம் கடவுளான தாகோன்மீதும் கடுமையாய்ப் பட்டிருக்கிறது[b]” என்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘நம்மோடு தங்கியிருக்கக்கூடாது’ என்றும் மொழிபெயர்க்கலாம். எபிரெய வினைச்சொல் ‘உட்காருதல்,’ ‘குடியிருத்தல்,’ அல்லது ‘தங்கியிருத்தல்’ என்று பொருள்படலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘அவருடைய கை நம்மீதும் நம் கடவுளான தாகோன்மீதும் கடுமையாய்ப் பட்டிருக்கிறது’ என்பது கடவுளின் வல்லமை கடுமையான நெருக்கடியாகவோ தீர்ப்பாகவோ செயல்படுவதைக் குறிக்கும் எபிரெய மரபுத்தொடர்.
    reason: idiom_explanation
lexical_decisions:
- source_word: וַיִּרְאוּ אַנְשֵׁי אַשְׁדּוֹד
  choice: அஸ்தோத்தைச் சேர்ந்த ஆண்கள் ... கண்டபோது
  rationale: וַיִּרְאוּ கதையின் அடுத்த நிகழ்வை முன்னெடுக்கிறது; தமிழில் காலத் தொடர்பை இயல்பாகக் காட்ட ‘கண்டபோது’ பயன்படுத்தப்பட்டது. אַנְשֵׁי என்பதன் ஆண்பால் வடிவை ‘ஆண்கள்’ தக்கவைக்கிறது.
- source_word: כִּי כֵן
  choice: நிலைமை இவ்வாறு இருப்பதை
  rationale: முந்தைய வசனங்களில் அவர்கள் கண்ட சூழ்நிலையைச் சுட்டும் எபிரெயச் சொற்றொடரின் குறிப்புணர்வை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: לֹא יֵשֵׁב
  choice: இருக்கக்கூடாது
  rationale: יָשַׁב என்பதற்கு ‘உட்கார், குடியிரு, தங்கியிரு’ என்ற பொருள்கள் உண்டு. பெட்டியைப் பற்றிய இச்சூழலில் அது தொடர்ந்து அங்கே இருப்பதை மறுக்கும் வலியுறுத்தலாக உள்ளது.
- source_word: אֲרוֹן אֱלֹהֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் கடவுளுடைய பெட்டி
  rationale: אֲרוֹן என்பதன் அடிப்படைப் பொருளான ‘பெட்டி’ என்பதைத் தக்கவைத்து, பெலிஸ்தியர்கள் பயன்படுத்தும் ‘இஸ்ரவேலின் கடவுள்’ என்ற அடையாளத்தையும் பாதுகாக்கிறது.
- source_word: עִמָּנוּ
  choice: நம்மோடு
  rationale: முதல் நபர் பன்மை விகுதியுடன் வரும் עִם என்பதன் நேரடியான, இயல்பான தமிழ் வடிவம்.
- source_word: קָשְׁתָה יָדוֹ
  choice: அவருடைய கை ... கடுமையாக உள்ளது
  rationale: קָשָׁה என்பது இங்கு ‘கடுமையாக இரு’ என்பதைக் குறிக்கிறது. கடவுளின் வல்லமை தீர்ப்பாகச் செயல்படுவதைச் சொல்லும் ‘கை’ என்ற எபிரெய உருவகத்தை மொழிபெயர்ப்பு தக்கவைக்கிறது.
- source_word: עָלֵינוּ וְעַל דָּגוֹן אֱלֹהֵינוּ
  choice: நம்மீதும் நம் கடவுளான தாகோன்மீதும்
  rationale: עַל என்பதன் இணையான பயன்பாட்டை இரு பொருட்களுடனும் தக்கவைத்து, தாக்கம் ஆண்கள்மீதும் தாகோன்மீதும் இருப்பதை வெளிப்படுத்துகிறது. ‘நம் கடவுள்’ என்பது பேச்சாளர்களின் பார்வையை மாற்றாமல் தருகிறது.
theological_decisions:
- issue: קָשְׁתָה יָדוֹ என்ற இறைத் தீர்ப்பைக் குறிக்கும் மரபுத்தொடர்
  choice: அவருடைய கை ... கடுமையாக உள்ளது
  alternative: அவர் எங்களைக் கடுமையாகத் தண்டித்துள்ளார்
  rationale: ‘கை’ என்ற மனித உருவகத்தை விளக்கவுரையாக மாற்றாமல் தக்கவைக்கிறது; அதேவேளை קָשָׁה என்பதைக் ‘கனமாக’ என்று மாற்றாமல் அதன் ‘கடுமை’ உணர்வை வெளிப்படுத்துகிறது.
- issue: தாகோனை ‘நம் கடவுள்’ என்று அழைத்தல்
  choice: பேச்சாளர்களின் சொற்களாக ‘நம் கடவுளான தாகோன்’ என்று தக்கவைத்தல்
  alternative: நம் சிலையான தாகோன்
  rationale: எபிரெய உரை பெலிஸ்தியர்களின் பார்வையிலிருந்து ‘எங்கள் கடவுள்’ என்று கூறுகிறது. உரையில் இல்லாத மறுப்பையோ மதிப்பீட்டையோ மொழிபெயர்ப்பு சேர்க்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. எபிரெய மூலத்தின் ‘கை’ உருவகமும், தாகோனைப் பற்றிய பெலிஸ்தியர்களின் பேச்சுக் கோணமும் தக்கவைக்கப்பட்டுள்ளன. அடிக்குறிப்பு குறிகள் அவை விளக்கும் சொற்றொடர்களுக்குப் பின்னரே வைக்கப்பட்டுள்ளன.
