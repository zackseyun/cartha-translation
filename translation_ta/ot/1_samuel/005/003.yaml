  text: וַ/יַּשְׁכִּ֤מוּ אַשְׁדּוֹדִים֙ מִֽ/מָּחֳרָ֔ת וְ/הִנֵּ֣ה דָג֗וֹן נֹפֵ֤ל לְ/פָנָי/ו֙ אַ֔רְצָ/ה לִ/פְנֵ֖י אֲר֣וֹן יְהוָ֑ה וַ/יִּקְחוּ֙ אֶת דָּג֔וֹן וַ/יָּשִׁ֥בוּ אֹת֖/וֹ לִ/מְקוֹמֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/005/003.yaml
  text: When the Ashdodites rose early the next day, behold, Dagon had fallen facedown on the ground before the ark of Yahweh. So they took Dagon and put him back in his place.
translation:
  language: ta
  text: மறுநாள் அதிகாலையில் அஸ்தோத் மக்கள் எழுந்தபோது, இதோ, தாகோன் யாவேயின் பெட்டிக்கு முன்பாகத் தரையில் முகங்குப்புற விழுந்து கிடந்தான். அவர்கள் தாகோனை எடுத்து, அவனுடைய இடத்தில் திரும்பவும் வைத்தார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּשְׁכִּמוּ
  choice: அதிகாலையில் ... எழுந்தபோது
  rationale: שׁכם என்பதன் ஹிஃபில் வடிவம் அதிகாலையில் எழுவதைக் குறிக்கிறது. தமிழில் காலச் சூழலோடு இயல்பாக இணைக்கப்பட்டது.
- source_word: אַשְׁדּוֹדִים
  choice: அஸ்தோத் மக்கள்
  rationale: அஸ்தோத் நகரத்தின் குடிமக்களைக் குறிக்கும் இனப்பெயர் பன்மை; தமிழில் புரியும்படி ‘மக்கள்’ என வழங்கப்பட்டது.
- source_word: מִמָּחֳרָת
  choice: மறுநாள்
  rationale: அடுத்த நாளைக் குறிக்கும் இயல்பான நவீனத் தமிழ் சொல்.
- source_word: וְהִנֵּה
  choice: இதோ
  rationale: எதிர்பாராத காட்சியின்மீது உடனடியாகக் கவனம் ஈர்க்கும் எபிரெயக் கதைநடை வலிமையைப் பாதுகாக்கிறது.
- source_word: נֹפֵל
  choice: விழுந்து கிடந்தான்
  rationale: வடிவில் நிகழ்காலப் பெயரெச்சமாக இருந்தாலும், அவர்கள் கண்டபோது ஏற்கெனவே ஏற்பட்டிருந்த விழுந்த நிலையைக் குறிக்கிறது. ‘கிடந்தான்’ அந்தக் கண்டறியப்பட்ட நிலையை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: לְפָנָיו אַרְצָה
  choice: தரையில் முகங்குப்புற
  rationale: தாகோனின் முகம் தரையை நோக்கிய அவமானகரமான விழுந்த நிலையைத் தெளிவாகவும் சுருக்கமாகவும் காட்டுகிறது.
- source_word: לִפְנֵי אֲרוֹן יְהוָה
  choice: யாவேயின் பெட்டிக்கு முன்பாக
  rationale: இங்கு לִפְנֵי இடத்தைக் குறிக்கிறது; אֲרוֹן என்பது சூழலில் யாவேயின் பரிசுத்தப் பெட்டி. மூலத்தில் இவ்வசனத்தில் ‘உடன்படிக்கை’ என்ற சொல் இல்லாததால் அது சேர்க்கப்படவில்லை.
- source_word: יְהוָה
  choice: யாவே
  rationale: திருப்பெயரை ஒரு பட்டத்தால் மாற்றாமல், எபிரெய மெய்யெழுத்துப் பெயரின் பரவலாக ஏற்றுக்கொள்ளப்பட்ட ஒலிப்பைத் தமிழில் தருகிறது.
- source_word: וַיִּקְחוּ אֶת־דָּגוֹן
  choice: தாகோனை எடுத்து
  rationale: לקח என்பதன் அடிப்படைப் பொருளான ‘எடுத்தல்’ இயல்பாகப் பாதுகாக்கப்படுகிறது; ‘தூக்கி’ என்ற கூடுதல் விவரம் சேர்க்கப்படவில்லை.
- source_word: וַיָּשִׁבוּ אֹתוֹ לִמְקוֹמוֹ
  choice: அவனுடைய இடத்தில் திரும்பவும் வைத்தார்கள்
  rationale: ஹிஃபில் வடிவம் மீண்டும் தன் இடத்துக்குக் கொண்டுவந்து வைப்பதைக் குறிக்கிறது. தாகோனைச் சுட்டும் ஆண்பால் பின்னொட்டுகளை ‘அவனுடைய’ என்று பிரதிபலிக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற திருப்பெயரை வழங்குதல்
  choice: யாவே
  alternative: ஆண்டவர் / யெகோவா
  rationale: மூலத்தில் தனிப்பட்ட திருப்பெயரே உள்ளது. அதை பொதுப் பட்டமாக மாற்றாமல் ஒலிபெயர்ப்பது மூல வேறுபாட்டைப் பாதுகாக்கிறது.
- issue: தாகோனை ஆண்பால் ஒருமையில் சுட்டுதல்
  choice: விழுந்து கிடந்தான்; அவனுடைய இடம்
  alternative: விழுந்து கிடந்தது; அதற்குரிய இடம்
  rationale: எபிரெய உரை தாகோனை ஆண்பால் ஒருமைப் பின்னொட்டுகளால் சுட்டுகிறது; இவ்வாறு மொழிபெயர்ப்பது தெய்வமாகக் கருதப்பட்ட உருவம் யாவேயின் பெட்டிக்கு முன் வீழ்ந்திருக்கும் கதைநடை நையாண்டியையும் பதற்றத்தையும் காக்கிறது. இது தாகோனின் உண்மையான தெய்வத்தன்மையை ஏற்றுக்கொள்வதல்ல.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் வகையிலும் வேதாகமக் கதைநடைக்குரிய கண்ணியத்துடனும் மொழிபெயர்க்கப்பட்டது. ‘இதோ’ திடீர் காட்சியின் தாக்கத்தையும், ‘முகங்குப்புற’ வீழ்ச்சியின் தெளிவான படிமத்தையும் காக்கிறது.
