base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/005/005.yaml
  text: Therefore, to this day the priests of Dagon and all who enter Dagon's temple in Ashdod do not step on Dagon's threshold[a][b].
translation:
  language: ta
  text: ஆகையால், இன்றுவரை தாகோனின் பூசாரிகளும் அஸ்தோதிலுள்ள தாகோனின் கோவிலுக்குள் செல்கிற அனைவரும் தாகோனின் வாசற்படியின்மேல் கால்வைப்பதில்லை.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “தாகோனின் வீடு”; இங்கு அது புறமத வழிபாட்டிடத்தைக் குறிப்பதால் “கோவில்” என்று மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל כֵּן
  choice: ஆகையால்
  rationale: முந்தைய நிகழ்வின் விளைவாக இந்த வழக்கம் ஏற்பட்டது என்பதைக் காட்டும் காரண-விளைவு இணைப்பை இயல்பாகப் பாதுகாக்கிறது.
- source_word: לֹא יִדְרְכוּ
  choice: கால்வைப்பதில்லை
  rationale: דרך என்பதன் ‘மிதித்தல்/கால்வைத்தல்’ என்ற பொருளை வாசற்படி சூழலில் இயல்பான நவீன தமிழில் தருகிறது; தொடரும் வழக்கத்தை நிகழ்கால எதிர்மறை வடிவம் வெளிப்படுத்துகிறது.
- source_word: כֹהֲנֵי דָגוֹן
  choice: தாகோனின் பூசாரிகள்
  rationale: புறமத வழிபாட்டுப் பணியாளர்களைக் குறிக்கும் சொற்றொடரைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: וְכָל הַבָּאִים בֵּית דָּגוֹן
  choice: தாகோனின் கோவிலுக்குள் செல்கிற அனைவரும்
  rationale: ‘தாகோனின் வீடு’ என்பது இச்சூழலில் வழிபாட்டிடம் என்பதால், ‘கோவில்’ அதன் வழிபாட்டுச் செயல்பாட்டை நவீன தமிழில் தெளிவாக்குகிறது.
- source_word: עַל מִפְתַּן דָּגוֹן
  choice: தாகோனின் வாசற்படியின்மேல்
  rationale: מִפְתָּן என்பதன் ‘வாசற்படி’ என்ற துல்லியமான பொருளையும் தாகோனுடன் உள்ள உடைமைத் தொடர்பையும் பாதுகாக்கிறது.
- source_word: בְּאַשְׁדּוֹד
  choice: அஸ்தோதிலுள்ள
  rationale: கோவில் அமைந்த இடத்தைக் குறிக்கும் எபிரெய இடப்பெயரைத் தமிழில் ஒலிபெயர்த்து, கட்டிடத்துடன் இயல்பாக இணைக்கிறது.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: இன்றுவரை
  rationale: கதைசொல்லியின் காலம்வரை வழக்கம் தொடர்ந்ததைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
