  text: וַ/יַּשְׁכִּ֣מוּ בַ/בֹּקֶר֮ מִֽ/מָּחֳרָת֒ וְ/הִנֵּ֣ה דָג֗וֹן נֹפֵ֤ל לְ/פָנָי/ו֙ אַ֔רְצָ/ה לִ/פְנֵ֖י אֲר֣וֹן יְהוָ֑ה וְ/רֹ֨אשׁ דָּג֜וֹן וּ/שְׁתֵּ֣י כַּפּ֣וֹת יָדָ֗י/ו כְּרֻתוֹת֙ אֶל הַ/מִּפְתָּ֔ן רַ֥ק דָּג֖וֹן נִשְׁאַ֥ר עָלָֽי/ו׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/005/004.yaml
  text: When they rose early the next morning[a], behold, Dagon had fallen facedown on the ground before the ark of Yahweh, and the head of Dagon and both the palms of his hands were cut off on the threshold; only Dagon was left on him.
translation:
  language: ta
  text: அவர்கள் மறுநாள் அதிகாலையில் எழுந்தபோது, இதோ, தாகோன் யாவேயின் பெட்டிக்கு முன்பாக முகங்குப்புறமாகத் தரையில் விழுந்துகிடந்தது. தாகோனின் தலையும் அதன் இரு கைகளின் உள்ளங்கைகளும் வெட்டப்பட்டு வாசற்படியின்மேல் கிடந்தன; தாகோன் மட்டும் எஞ்சியிருந்தது[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “தாகோன் மட்டும் அதன்மேல் எஞ்சியிருந்தது.” தலைவும் கைகளும் வெட்டப்பட்டபின் சிலையின் உடற்பகுதி மட்டும் எஞ்சியிருந்தது என்பதே இதன் பொருளாக இருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁכִּמוּ בַבֹּקֶר מִמָּחֳרָת
  choice: அவர்கள் மறுநாள் அதிகாலையில் எழுந்தபோது
  rationale: தொடர்நிகழ்வையும் அடுத்த நாள் காலைப்பொழுதையும் இயல்பான நவீனத் தமிழில் ஒருங்கிணைக்கிறது.
- source_word: וְהִנֵּה
  choice: இதோ
  rationale: எதிர்பாராத காட்சியைச் சுட்டும் எபிரெய உரைநடை வலிமையைத் தக்கவைக்கிறது.
- source_word: נֹפֵל לְפָנָיו אַרְצָה
  choice: முகங்குப்புறத் தரையில் விழுந்துகிடந்தது
  rationale: அவர்கள் கண்டபோது சிலை ஏற்கெனவே விழுந்த நிலையில் இருந்ததையும், முகம் தரையை நோக்கியிருந்ததையும் தெரிவிக்கிறது.
- source_word: לִפְנֵי אֲרוֹן יְהוָה
  choice: யாவேயின் பெட்டிக்கு முன்பாக
  rationale: אֲרוֹן என்பதன் அடிப்படைப் பொருளான பெட்டியையும், יהוה என்ற திருப்பெயரையும் நேரடியாக வழங்குகிறது.
- source_word: וּשְׁתֵּי כַּפּוֹת יָדָיו
  choice: அதன் இரு கைகளின் உள்ளங்கைகளும்
  rationale: כַּפּוֹת என்பது கைகளைப் பொதுவாக அல்ல, அவற்றின் உள்ளங்கைகளைச் சிறப்பாகக் குறிக்கிறது.
- source_word: כְּרֻתוֹת אֶל הַמִּפְתָּן
  choice: வெட்டப்பட்டு வாசற்படியின்மேல் கிடந்தன
  rationale: துண்டிக்கப்பட்ட நிலையையும் அவை காணப்பட்ட இடத்தையும் தெளிவான தமிழில் வெளிப்படுத்துகிறது.
- source_word: רַק דָּגוֹן נִשְׁאַר עָלָיו
  choice: தாகோன் மட்டும் அதன்மேல் எஞ்சியிருந்தது
  rationale: கடினமும் தெளிவற்றதுமான எபிரெய சொற்றொடரை விளக்கச் சொல்லை மூலவசனத்துக்குள் சேர்க்காமல் நெருக்கமாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூலத்தில் வரும் தனிப்பட்ட உடன்படிக்கைப் பெயரைப் பொதுப் பட்டப்பெயராக மாற்றாமல் ஒலிபெயர்க்கிறது.
- issue: இறுதி சொற்றொடரில் எஞ்சியது எது?
  choice: தாகோன் மட்டும் அதன்மேல் எஞ்சியிருந்தது
  alternative: தாகோனின் உடற்பகுதி மட்டும் எஞ்சியிருந்தது
  rationale: தலை மற்றும் கைகள் அகற்றப்பட்டதால் உடற்பகுதியே எஞ்சியது என்பது சூழலுக்கு ஏற்ற விளக்கம்; ஆனால் 'உடற்பகுதி' என்ற சொல் எபிரெயத்தில் வெளிப்படையாக இல்லை. ஆகவே அதன் தெளிவின்மை முதன்மை உரையில் பாதுகாக்கப்பட்டு அடிக்குறிப்பில் விளக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. சிலையைச் சுட்ட ‘அது’ பயன்படுத்தப்பட்டுள்ளது. ‘இதோ’ என்பது காட்சியின் திடீர் அதிர்ச்சியைப் பாதுகாக்கிறது; தெளிவற்ற இறுதி எபிரெயச் சொற்றொடர் அடிக்குறிப்பின் உதவியுடன் முற்றிலும் விளக்கித் தீர்க்கப்படாமல் வைக்கப்பட்டுள்ளது.
