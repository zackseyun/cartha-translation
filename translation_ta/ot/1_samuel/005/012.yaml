  text: And the men who did not die were struck with tumors[a], and the cry of the city went up to heaven.
translation:
  language: ta
  text: இறக்காத ஆண்கள் கட்டிகளால்[a] தாக்கப்பட்டார்கள்; நகரத்தின் கூக்குரல் வானத்தை நோக்கி எழுந்தது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘வீக்கங்களால்.’ எபிரேயச் சொல் உடலில் ஏற்படும் வீக்கம் அல்லது கட்டியைக் குறிக்கிறது. சில பாரம்பரிய மொழிபெயர்ப்புகள் இதை ‘மூலநோய்’ என்று குறிப்பாக மொழிபெயர்க்கின்றன.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָאֲנָשִׁים
  choice: மனிதர்கள்
  rationale: אֲנָשִׁים என்பதன் வழக்கமான பொருளை இயல்பான நவீன தமிழில் தருகிறது; இங்கு உரையில் இல்லாத ‘நகரவாசிகள்’ போன்ற விரிவாக்கம் தவிர்க்கப்படுகிறது.
- source_word: אֲשֶׁר לֹא מֵתוּ
  choice: இறக்காமல் இருந்த
  rationale: இறந்தவர்களிலிருந்து உயிருடன் இருந்தவர்களை வேறுபடுத்தும் தொடர்புச் சொற்றொடரைத் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: הֻכּוּ
  choice: தாக்கப்பட்டார்கள்
  rationale: נכה வினையின் ஹொஃபால் செயப்பாட்டு வடிவத்தையும் திடீரான துன்பத் தாக்கத்தின் வலிமையையும் காக்கிறது.
- source_word: בָעֳפָלִים
  choice: கட்டிகளால்
  rationale: עפלים குறிக்கும் உடல் வீக்கம் அல்லது கட்டியை மருத்துவ ரீதியாக அளவுக்கு மீறிக் குறிப்பாக்காமல் நவீன தமிழில் தருகிறது.
- source_word: וַתַּעַל
  choice: எழும்பியது
  rationale: עלה என்பதன் மேல்நோக்கிய இயக்கத்தைத் தமிழில் இயல்பாகக் காக்கிறது.
- source_word: שַׁוְעַת
  choice: கூக்குரல்
  rationale: שַׁוְעָה குறிக்கும் துயரத்திலான உதவிக்குரலை வெறும் ‘குரல்’ என்பதைக் காட்டிலும் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: הָעִיר
  choice: அந்த நகரத்தின்
  rationale: எபிரேய இணைப்புத் தொடரான ‘நகரத்தின் கூக்குரல்’ என்பதை நேரடியாகக் காக்கிறது; தமிழில் குறிப்பிட்ட நகரைக் குறிக்க ‘அந்த’ இயல்பாகச் சேர்க்கப்படுகிறது.
- source_word: הַשָּׁמָיִם
  choice: வானம்வரை
  rationale: שָׁמַיִם வடிவில் பன்மையாக இருந்தாலும் இச்சொற்றொடரில் ‘வானம்’ என்பது இயல்பான தமிழ்; ‘வரை’ கூக்குரல் மேலே சென்று எட்டியதை வெளிப்படுத்துகிறது.
