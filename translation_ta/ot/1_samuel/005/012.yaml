  source_fidelity: 'முதன்மைச் சொற்றொடரின் பொருள் பெரும்பாலும் சரியாக உள்ளது: உயிரிழக்காதவர்கள்மேல் உடல் கட்டிகள்/வீக்கங்கள் வந்தன; நகரத்தின் துயரக்குரல் வானத்தை நோக்கி எழுந்தது. ஆனால் אֲנָשִׁים என்பதன் நேரடியான ‘ஆண்கள்’ என்ற குறிப்பை ‘மனிதர்கள்’ எனப் பொதுமைப்படுத்துகிறது. மேலும் ‘இறக்காமல் இருந்த’ என்பது இச்சூழலின் இறந்தவர்களுக்கு மாறான ‘இறக்காத’வர்களைக் காட்டுவதில் சற்றே இயல்பற்றது.'
