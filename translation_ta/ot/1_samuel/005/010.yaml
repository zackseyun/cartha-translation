  text: וַֽ/יְשַׁלְּח֛וּ אֶת אֲר֥וֹן הָ/אֱלֹהִ֖ים עֶקְר֑וֹן וַ/יְהִ֗י כְּ/ב֨וֹא אֲר֤וֹן הָ/אֱלֹהִים֙ עֶקְר֔וֹן וַ/יִּזְעֲק֨וּ הָֽ/עֶקְרֹנִ֜ים לֵ/אמֹ֗ר הֵסַ֤בּוּ אֵלַ/י֙ אֶת אֲרוֹן֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל לַ/הֲמִיתֵ֖/נִי וְ/אֶת עַמִּֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/005/010.yaml
  text: So they sent the ark of God to Ekron. But when the ark of God came to Ekron, the Ekronites cried out, saying, “They have brought around to me the ark of the God of Israel, to kill me and my people!”
translation:
  language: ta
  text: ஆகவே அவர்கள் தேவனுடைய பேழையை எக்ரோனுக்கு அனுப்பினார்கள். ஆனால் தேவனுடைய பேழை எக்ரோனுக்கு வந்தபோது, எக்ரோன் மக்கள், “இஸ்ரவேலின் தேவனுடைய பேழையை என்னிடம் திருப்பிக் கொண்டுவந்திருக்கிறார்கள்; என்னையும் என் மக்களையும் கொல்லவே!”[a] என்று அலறினார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மூலத்தில் இங்குள்ள “என்னிடம்,” “என்னையும்,” “என் மக்களையும்” ஆகியவை ஒருமையில் உள்ளன; எக்ரோன் மக்கள் தங்கள் நகரத்தை ஒரே கூட்டு ஆளாகக் கொண்டு பேசுவதாக இருக்கலாம்.
    reason: பன்மை எழுவாய்க்குப் பின் வரும் ஒருமை முதலாம் நபர் வடிவங்களால் ஏற்படும் மூலமொழித் தன்மையையும், நகரம் ஒரு கூட்டு ஆளாகப் பேசும் சாத்தியத்தையும் விளக்குகிறது.
lexical_decisions:
- source_word: אֲרוֹן הָאֱלֹהִים
  choice: தேவனுடைய பேழை
  rationale: אֲרוֹן என்பது இங்கு புனிதப் பேழையைக் குறிக்கிறது; மூலத்தில் இல்லாத ‘உடன்படிக்கை’ என்ற சொல்லைச் சேர்க்காமல், தமிழில் மரியாதையும் தெளிவும் உள்ள ‘பேழை’ பயன்படுத்தப்பட்டது.
- source_word: וַיִּזְעֲקוּ
  choice: அலறினார்கள்
  rationale: இந்த வினை சாதாரணமாகக் கூப்பிடுவதைவிட அச்சத்திலும் துயரத்திலும் எழுப்பப்படும் உரத்த குரலைக் குறிக்கிறது.
- source_word: הֵסַבּוּ אֵלַי
  choice: என்னிடமே கொண்டுவந்துவிட்டார்கள்
  rationale: הסב என்ற வடிவில் உள்ள ‘சுற்றி/திசைமாற்றிக் கொண்டுவருதல்’ என்ற நுணுக்கம் சூழலில் பேழையை வேறொரு நகரத்திலிருந்து எக்ரோனுக்குத் திருப்பி அனுப்பிய செயலைக் குறிக்கிறது; இயல்பான தமிழில் அதன் விளைவு வெளிப்படுத்தப்பட்டது.
- source_word: לַהֲמִיתֵנִי
  choice: என்னைக் கொல்வதற்காக
  rationale: எபிரெயச் சொல் நோக்கத்தைத் தெரிவிக்கும் ‘கொல்லும்படி/கொல்வதற்காக’ என்ற பொருளையும் ஒருமை முதலாம் நபர் பின்னொட்டையும் கொண்டுள்ளது.
theological_decisions:
- issue: பலர் பேசும் இடத்தில் ஒருமை முதலாம் நபர் பயன்படுத்தப்படுதல்
  choice: ‘என்னிடமே’, ‘என்னையும் என் மக்களையும்’ என்ற ஒருமை வடிவங்கள் காக்கப்பட்டன.
  alternative: ‘எங்களிடமே’, ‘எங்களையும் எங்கள் மக்களையும்’ என்று பன்மையாக்குதல்.
  rationale: மசோரெட்டிக் எபிரெய மூலத்தில் אֵלַי, לַהֲמִיתֵנִי, עַמִּי ஆகியவை ஒருமையில் உள்ளன. இது எக்ரோன் நகரத்தை ஒரே கூட்டு ஆளாகப் பேச வைக்கலாம்; அந்த உண்மையான இலக்கணத் தன்மையை மொழிபெயர்ப்பு அழிக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் வேதாகம நிகழ்வுக்கேற்ற கண்ணியத்துடனும் வடிவமைக்கப்பட்டது. ‘பேழை’ என்ற நிலைபெற்ற சொல் காக்கப்பட்டு, உரையின் அச்சமும் அவசரமும் ‘அலறினார்கள்’ மற்றும் நேரடி மேற்கோளின் மூலம் வெளிப்படுத்தப்பட்டன.
