source:
  edition: WLC
  text: וּ/פְלִשְׁתִּים֙ לָֽקְח֔וּ אֵ֖ת אֲר֣וֹן הָ/אֱלֹהִ֑ים וַ/יְבִאֻ֛/הוּ מֵ/אֶ֥בֶן הָעֵ֖זֶר אַשְׁדּֽוֹדָ/ה׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/005/001.yaml
  text: The Philistines had taken the ark of God and brought it from Ebenezer to Ashdod[a].
translation:
  language: ta
  text: பெலிஸ்தியர்கள்[a] கடவுளின் பெட்டியைக் கைப்பற்றியிருந்தார்கள்; அதை எபெனேசரிலிருந்து அஸ்தோத்துக்குக் கொண்டுவந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “பெலிஸ்தியர்களும்”; இங்குள்ள இணைப்புச் சொல் கதைத் தொடர்ச்சியைக் குறிக்கிறது.
    reason: மூலத்தின் தொடக்க இணைப்புச் சொல்லைத் தமிழில் வெளிப்படையாக மொழிபெயர்க்காததைச் சுட்டிக்காட்டுகிறது.
lexical_decisions:
- source_word: וּ/פְלִשְׁתִּים
  choice: பெலிஸ்தியர்கள்
  rationale: ו־ இங்கு முந்தைய நிகழ்விலிருந்து அடுத்த காட்சிக்குச் செல்லும் கதைத் தொடர்ச்சியைக் குறிக்கிறது. தமிழில் வசனத்தை நேரடியாக ‘பெலிஸ்தியர்கள்’ என்று தொடங்குவது இயல்பானது; ‘மற்றும்’ என்று சேர்ப்பது செயற்கையாக ஒலிக்கும்.
- source_word: לָקְחוּ
  choice: கைப்பற்றியிருந்தார்கள்
  rationale: לקח என்பதன் பொருள் ‘எடுத்தல்/கைப்பற்றுதல்’. முந்தைய போரில் ஏற்கெனவே நிகழ்ந்த செயலை இவ்வசனம் பின்னணியாக எடுத்துரைப்பதால், தமிழில் இறந்தகால நிறைவு நிலையை உணர்த்தும் ‘கைப்பற்றியிருந்தார்கள்’ பொருத்தமானது.
- source_word: אֲרוֹן הָאֱלֹהִים
  choice: கடவுளின் பெட்டி
  rationale: எபிரெயச் சொற்றொடரின் உரிமைத் தொடர்பை நேரடியாகக் காக்கிறது. மூலத்தில் இல்லாத ‘உடன்படிக்கை’ என்ற விளக்கத்தைச் சேர்க்காமல், אָרוֹן என்பதைக் ‘பெட்டி’ என்று எளிய நவீன தமிழில் தருகிறது.
- source_word: וַיְבִאֻהוּ
  choice: அதைக் கொண்டுவந்தார்கள்
  rationale: בוא என்பதன் ஹிஃபீல் வடிவம் ‘கொண்டுவருதல்’ என்றும், ஆண்பால் ஒருமை பின்னொட்டு முன் குறிப்பிடப்பட்ட பெட்டியைக் குறிக்கிறது என்றும் வெளிப்படுத்துகிறது.
- source_word: מֵאֶבֶן הָעֵזֶר
  choice: எபெனேசரிலிருந்து
  rationale: מִן முன்னொட்டின் ‘இலிருந்து’ என்ற பொருளையும், இடப்பெயரின் வழக்கமான தமிழ் ஒலிபெயர்ப்பையும் காக்கிறது.
- source_word: אַשְׁדּוֹדָה
  choice: அஸ்தோத்துக்கு
  rationale: இடப்பெயருடன் இணைந்த திசைச்சுட்டும் ה־, அஸ்தோத்தை நோக்கிய நகர்வைக் குறிக்கிறது; தமிழில் ‘அஸ்தோத்துக்கு’ என்று இயல்பாகத் தரப்படுகிறது.
