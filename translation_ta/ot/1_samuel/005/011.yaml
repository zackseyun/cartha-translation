base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/005/011.yaml
  text: So they sent and gathered all the lords of the Philistines[a], and they said, “Send away the ark of the God of Israel, and let it return to its place, so that it may not kill us and our people.” For there was a deadly panic throughout the whole city[b]; the hand of God was very heavy there.
translation:
  language: ta
  text: எனவே, அவர்கள் ஆளனுப்பி பெலிஸ்தியர்களின் ஆட்சியாளர்கள் அனைவரையும் ஒன்றுகூட்டி, “இஸ்ரவேலின் கடவுளுடைய பெட்டியை அனுப்பிவிடுங்கள்; அது தன் இடத்திற்குத் திரும்பிப் போகட்டும்; அது என்னையும் என் மக்களையும் கொல்லாதபடி” என்றார்கள். ஏனெனில், நகரம் முழுவதும் மரணத்தை விளைவிக்கும் பெரும் பீதி உண்டாயிருந்தது[a]; கடவுளின் கை அங்கே மிகவும் பாரமாக இருந்தது[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய சொற்றொடரை ‘மரணப் பீதி,’ ‘மரணத்துக்குரிய குழப்பம்,’ அல்லது ‘மரணத்தை விளைவிக்கும் பெரும் கலகம்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘கடவுளின் கை அங்கே மிகவும் பாரமாக இருந்தது’ என்பது கடவுளின் கடுமையான தண்டனைச் செயலைக் குறிக்கும் உருவகம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: סַרְנֵי פְלִשְׁתִּים
  choice: பெலிஸ்தியர்களின் ஆட்சியாளர்கள்
  rationale: சர்னே என்பது பெலிஸ்திய நகரங்களின் அங்கீகரிக்கப்பட்ட அரசியல் ஆட்சியாளர்களைக் குறிக்கிறது. நவீனத் தமிழில் இயல்பாகவும் பதவிநிலையைத் தெளிவாகவும் தெரிவிக்க ‘ஆட்சியாளர்கள்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: שַׁלְּחוּ
  choice: அனுப்பிவிடுங்கள்
  rationale: பெட்டியை அந்த நகரத்திலிருந்து அகற்றி அனுப்ப வேண்டும் என்ற கட்டளையின் வலிமையை ‘அனுப்பிவிடுங்கள்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: אֲרוֹן אֱלֹהֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் கடவுளுடைய பெட்டி
  rationale: பெட்டி இஸ்ரவேலின் கடவுளுக்குரியது என்ற மூலமொழியின் உறவை நேரடியாகப் பாதுகாக்கிறது.
- source_word: וְיָשֹׁב לִמְקֹמוֹ
  choice: அது தன் இடத்திற்குத் திரும்பிப் போகட்டும்
  rationale: கட்டளையைத் தொடரும் விருப்பக் கட்டளையின் நுணுக்கத்தையும் ‘அதற்குரிய இடம்’ என்ற பொருளையும் இயல்பான தமிழில் தருகிறது.
- source_word: וְלֹא יָמִית אֹתִי וְאֶת עַמִּי
  choice: இல்லையெனில், அது என்னையும் என் மக்களையும் கொன்றுவிடும்
  rationale: מות என்பதன் காரணவினைப் பொருளான ‘கொல்லுதல்’ தெளிவாகத் தரப்பட்டுள்ளது. எபிரெய உரையிலுள்ள ஒருமை ‘என்னையும் என் மக்களையும்’ மாற்றப்படாமல் பாதுகாக்கப்பட்டுள்ளது.
- source_word: מְהוּמַת מָוֶת
  choice: மரணத்தை விளைவிக்கும் பெரும் பீதி
  rationale: இந்தச் சொற்றொடரில் உள்ள கடும் கலக்கம் அல்லது பீதியையும் அதன் மரண விளைவையும் ஒருங்கே வெளிப்படுத்துகிறது; தெளிவில்லாத நுணுக்கம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: בְּכָל הָעִיר
  choice: நகரம் முழுவதும்
  rationale: நகரின் எல்லாப் பகுதிகளிலும் பரவியிருந்த நிலையை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: כָּבְדָה מְאֹד יַד הָאֱלֹהִים
  choice: கடவுளின் கை அங்கே மிகவும் பாரமாக இருந்தது
  rationale: தெய்வீகச் செயலையும் தீர்ப்பையும் குறிக்கும் ‘கை’ என்ற முக்கிய வேதாகம உருவகத்தையும் ‘மிகவும் பாரமாக’ என்ற மூலத்தின் வலிமையையும் பாதுகாக்கிறது.
theological_decisions:
- issue: ‘கடவுளின் கை’ என்ற மனித உறுப்பைச் சார்ந்த உருவகத்தைப் பாதுகாப்பதா அல்லது அதைத் தெய்வீக வல்லமை/தீர்ப்பு என்று விளக்கிப் பெயர்ப்பதா
  choice: ‘கடவுளின் கை அங்கே மிகவும் பாரமாக இருந்தது’ என்று உருவகத்தைப் பாதுகாத்தல்
  alternative: ‘கடவுள் அங்கிருந்தவர்களைக் கடுமையாகத் தண்டித்தார்’
  rationale: எபிரெய உரை ‘கை’ என்ற வேதாகம உருவகத்தை வெளிப்படையாகப் பயன்படுத்துகிறது. அதை அப்படியே வைத்திருப்பது தெய்வீகச் செயலின் இலக்கிய மற்றும் இறையியல் தொடர்புகளைப் பாதுகாக்கிறது; பொருள் அடிக்குறிப்பில் விளக்கப்படுகிறது.
- issue: பலர் பேசுவதாக அறிமுகப்படுத்தப்பட்டாலும் நேரடிப் பேச்சில் வரும் ஒருமைச் சுட்டுப்பெயர்கள்
  choice: ‘என்னையும் என் மக்களையும்’ என்ற எபிரெய ஒருமையைப் பாதுகாத்தல்
  alternative: ‘எங்களையும் எங்கள் மக்களையும்’
  rationale: மூல உரையில் ஒருமை பின்னொட்டுகள் உள்ளன; நகரின் ஆட்சியாளர் பிரதிநிதியாகப் பேசுவதை இது சுட்டக்கூடும். சூழலுக்காக அதைப் பன்மையாக்குவது மூலத்தின் குறிப்பிடத்தக்க அம்சத்தை அழித்துவிடும்.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் வேதாகம உரைக்குரிய கண்ணியத்துடனும் மொழிபெயர்க்கப்பட்டுள்ளது. ‘பெட்டி’ என்பது அன்றாடத் தமிழில் தெளிவான சொல்லாகத் தேர்ந்தெடுக்கப்பட்டுள்ளது; ‘கடவுளின் கை’ என்ற மூல உருவகம் விளக்கமின்றி மாற்றப்படாமல் வைக்கப்பட்டுள்ளது.
