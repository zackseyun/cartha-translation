source:
  edition: WLC
  text: וַ/תִּכְבַּ֧ד יַד יְהוָ֛ה אֶל הָ/אַשְׁדּוֹדִ֖ים וַ/יְשִׁמֵּ֑/ם וַ/יַּ֤ךְ אֹתָ/ם֙ ב/עפלים אֶת אַשְׁדּ֖וֹד וְ/אֶת גְּבוּלֶֽי/הָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/005/006.yaml
  text: And the hand of Yahweh was heavy against the people of Ashdod[a], and he devastated them and struck them with tumors, Ashdod and its territory.
translation:
  language: ta
  text: 'யாவேயின் கை அஸ்தோத் மக்கள்மீது பாரமாய் இருந்தது. அவர் அவர்களை அழிவுக்குள்ளாக்கி, கட்டிகளால்[a] தாக்கினார்; அதாவது, அஸ்தோத்தையும் அதன் எல்லைப் பகுதிகளையும்.


    [a] அல்லது, “வீக்கங்களால்”; பாரம்பரியமாகச் சிலர் இதை இன்னும் குறிப்பாக “மூலநோய்க் கட்டிகளால்” என்று மொழிபெயர்க்கின்றனர்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “வீக்கங்களால்”; பாரம்பரியமாகச் சிலர் இதை இன்னும் குறிப்பாக “மூலநோய்க் கட்டிகளால்” என்று மொழிபெயர்க்கின்றனர்.
    reason: בַּעֳפָלִים என்பதன் சரியான உடற்கூறு சார்ந்த குறிப்பு உறுதியற்றது; பரந்த பொருளும் பாரம்பரியமான குறிப்பான பொருளும் பாதுகாக்கப்படுகின்றன.
lexical_decisions:
- source_word: וַתִּכְבַּד יַד יְהוָה
  choice: யாவேயின் கை ... பாரமாக இருந்தது
  rationale: எபிரெய மொழியின் ‘கை’ மற்றும் ‘பாரமாக இருந்தது’ என்ற உருவகத்தைத் தக்கவைத்து, வலிமையான தண்டனைச் செயலை வெளிப்படுத்துகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தேவனுடைய தனிப்பட்ட பெயரான நான்கெழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் இயல்பான ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: אֶל הָאַשְׁדּוֹדִים
  choice: அஸ்தோத் மக்கள்மீது
  rationale: இச்சொல் நகரத்தை மட்டும் அல்ல, அஸ்தோத்தின் குடிமக்களைக் குறிக்கிறது; சூழலில் பகைமையான தாக்கத்தை ‘மீது’ தெளிவாகக் காட்டுகிறது.
- source_word: וַיְשִׁמֵּם
  choice: அவர்களை அழிவுக்குள்ளாக்கி
  rationale: அவர்களுக்குப் பேரழிவை ஏற்படுத்தியதைக் காட்டும் வினையின் வலிமையை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: וַיַּךְ אֹתָם
  choice: அவர்களை ... தாக்கினார்
  rationale: தண்டனை அல்லது வாதையால் தாக்குதல் என்ற பொதுவான எபிரெய வினைப் பொருளை நேரடியாக வழங்குகிறது.
- source_word: בַּעֳפָלִים
  choice: கட்டிகளால்
  rationale: உடலில் ஏற்பட்ட கட்டிகள் அல்லது வீக்கங்கள் என்ற உறுதியான பரந்த பொருளை முதன்மை உரையில் தருகிறது; குறிப்பான பாரம்பரிய விளக்கம் அடிக்குறிப்பில் வைக்கப்படுகிறது.
- source_word: אֶת אַשְׁדּוֹד וְאֶת גְּבוּלֶיהָ
  choice: அஸ்தோத்தையும் அதன் சுற்றுப்புறப் பகுதியையும்
  rationale: வாதையின் பரப்பு நகரத்தையும் அதைச் சார்ந்த நிலப்பகுதியையும் உள்ளடக்கியதை இயல்பான தமிழில் காட்டுகிறது; ‘சுற்றுப்புறப் பகுதி’ என்பது இங்கு גְּבוּלֶיהָ என்பதன் நிலப்பரப்பு சார்ந்த பொருளைத் தெரிவிக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: இஸ்ரவேலின் தேவனுடைய தனிப்பட்ட உடன்படிக்கைப் பெயர் உரையில் இருப்பதை மறைக்காமல், அதன் பொதுவாக ஏற்கப்பட்ட ஒலிப்பைத் தமிழில் தருகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய ‘கை பாரமாக இருந்தது’ என்ற முக்கிய உருவகம் தக்கவைக்கப்பட்டுள்ளது. இறுதி இணைநிலைத் தொடரின் சற்றுக் கடினமான மூலமொழி அமைப்பு, அதன் வலியுறுத்தலையும் வாதையின் புவியியல் பரப்பையும் காக்கும் வகையில் வினை மீளுரைப்புடன் இயல்பாக்கப்பட்டுள்ளது.
