  edition: WLC
  text: וַ/יְהִ֞י אַחֲרֵ֣י הֵסַ֣בּוּ אֹת֗/וֹ וַ/תְּהִ֨י יַד יְהוָ֤ה בָּ/עִיר֙ מְהוּמָה֙ גְּדוֹלָ֣ה מְאֹ֔ד וַ/יַּךְ֙ אֶת אַנְשֵׁ֣י הָ/עִ֔יר מִ/קָּטֹ֖ן וְ/עַד גָּד֑וֹל וַ/יִּשָּׂתְר֥וּ לָ/הֶ֖ם עפלים׀־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/005/009.yaml
  text: And after they had moved it around[a], the hand of Yahweh was against the city, causing a very great panic; and he struck the men of the city, from small to great, and tumors broke out on them.
translation:
  language: ta
  text: அதை அவர்கள் இடம்மாற்றியபின், யாவேவின் கை அந்த நகரத்தின்மேல் இருந்தது; அங்கே மிகப் பெரும் பீதி உண்டாயிற்று. அவர் அந்த நகரத்து ஆண்களைச் சிறியவர் முதல் பெரியவர் வரை தாக்கினார்; அவர்களுக்குக் கட்டிகள் தோன்றின[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அவர்கள்மேல் கட்டிகள் வெடித்தெழுந்தன.’ எபிரெயச் சொற்றொடர் உடலில் வீக்கங்கள் தோன்றுவதையோ வெடித்தெழுவதையோ விவரிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵסַבּוּ אֹתוֹ
  choice: அதை அவர்கள் இடம்மாற்றிய பிறகு
  rationale: சபב் வேரின் Hiphil வடிவம் பொருளை வேறிடத்திற்குக் கொண்டுசெல்வதைக் குறிக்கிறது. சூழலில் சுட்டுப்பெயர் உடன்படிக்கைப் பெட்டியைக் குறித்தாலும், எபிரெய உரையைப் போலவே பெயரை மீண்டும் சேர்க்காமல் சுட்டுப்பெயர் தக்கவைக்கப்படுகிறது.
- source_word: יַד יְהוָה
  choice: யெகோவாவின் கை
  rationale: தேவனுடைய செயலாற்றும் வல்லமையையும் நியாயத்தீர்ப்பையும் குறிக்கும் எபிரெய உருவகத்தை ‘கை’ என்று நேரடியாகத் தக்கவைக்கிறது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: நான்கு எழுத்துகளைக் கொண்ட தேவநாமத்தை பொதுவான பட்டப்பெயராக மாற்றாமல், தமிழில் வழக்கமான தனிப்பெயர் வடிவில் தருகிறது.
- source_word: מְהוּמָה גְּדוֹלָה מְאֹד
  choice: மிகப் பெரும் பீதி
  rationale: מְהוּמָה குறிக்கும் கலக்கம், திகில், குழப்பம் ஆகியவற்றில் இச்சூழலுக்கு ‘பீதி’ இயல்பாகப் பொருந்துகிறது; intensifier-இன் வலிமையும் தக்கவைக்கப்படுகிறது.
- source_word: וַיַּךְ
  choice: தாக்கினார்
  rationale: ஒருமை வினையின் எழுவாய் யெகோவா. ‘தாக்கினார்’ என்பது எபிரெய வினையின் நேரடியான வலிமையை நவீன தமிழில் இயல்பாகக் காட்டுகிறது.
- source_word: אַנְשֵׁי הָעִיר
  choice: அந்த நகரத்தின் ஆண்கள்
  rationale: எபிரெயச் சொல் பொதுவாக மக்களையல்ல, இங்கு குறிப்பாக ஆண்களைக் குறிப்பிடுவதால் பாலினத் துல்லியம் காக்கப்படுகிறது.
- source_word: מִקָּטֹן וְעַד גָּדוֹל
  choice: சிறியோர் முதல் பெரியோர் வரை
  rationale: வயது, சமூக நிலை அல்லது முக்கியத்துவம் ஆகியவற்றில் எது குறிக்கப்படுகிறது என்பதைத் தீர்மானிக்காமல், எபிரெய மரபுத்தொடரின் பரந்த பொருளைத் தக்கவைக்கிறது.
- source_word: וַיִּשָּׂתְרוּ לָהֶם עפלים
  choice: அவர்கள்மேல் கட்டிகள் வெடித்தெழுந்தன
  rationale: அரிய வினையும் பெயர்ச்சொல்லும் உடலில் வீக்கங்கள் தோன்றியதையோ வெடித்தெழுந்ததையோ விவரிக்கின்றன. ‘கட்டிகள்’ என்பது குறிப்பிட்ட மருத்துவ நோயைத் திணிக்காமல் பொருளைத் தெளிவாகத் தருகிறது.
theological_decisions:
- issue: יהוה என்ற தேவநாமத்தை மொழிபெயர்த்தல்
  choice: யெகோவா
  alternative: கர்த்தர்
  rationale: இவ்வசனத்தில் பட்டப்பெயர் அல்ல, தேவனுடைய தனிப்பெயரான יהוה நேரடியாக வருகிறது. ஆகவே தனிப்பெயர் வடிவம் தக்கவைக்கப்படுகிறது.
- issue: ‘யெகோவாவின் கை’ என்ற உருவகம்
  choice: உருவகத்தை அப்படியே தக்கவைத்தல்
  alternative: யெகோவாவின் தண்டனை அல்லது வல்லமை
  rationale: ‘கை’ என்பது தேவனுடைய செயல் மற்றும் நியாயத்தீர்ப்பைக் குறிக்கும் இறையியல் வலிமையுள்ள எபிரெய உருவகம்; அதை விளக்கவுரையாக மாற்றுவது மூலத்தின் படிமத்தைச் சுருக்கும்.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிதில் புரியக்கூடிய, ஆனால் கண்ணியமான நடையைக் கொண்டுள்ளது. ‘கை’ என்ற மூல உருவகமும் ‘சிறியோர் முதல் பெரியோர் வரை’ என்ற திட்டமிட்ட தெளிவின்மையும் காக்கப்பட்டுள்ளன. அடிக்குறி குறியீடு அதற்குரிய ‘கட்டிகள் வெடித்தெழுந்தன’ என்ற சொற்றொடருக்குப் பின் வைக்கப்பட்டுள்ளது.
