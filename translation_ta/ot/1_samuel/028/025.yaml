  text: Then she brought it before Saul and before his servants[a], and they ate. Then they rose and went away that night.
translation:
  language: ta
  text: அவள் அதைச் சவுலுக்கும் அவனுடைய பணியாளர்களுக்கும் முன்பாக வைத்தாள்[a]; அவர்கள் சாப்பிட்டார்கள். பிறகு அவர்கள் எழுந்து, அந்த இரவில் புறப்பட்டுச் சென்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரெயத்தில் நேரடியாக: “அவள் சவுலின் முன்பாகவும் அவனுடைய பணியாளர்களின் முன்பாகவும் கொண்டுவந்தாள்.” செயப்படுபொருள் வெளிப்படையாகக் கூறப்படவில்லை; முந்தைய சூழலில் ஆயத்தப்படுத்தப்பட்ட உணவே குறிக்கப்படுகிறது.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּגֵּשׁ
  choice: அதை ... முன்பாகக் கொண்டுவந்து வைத்தாள்
  rationale: ஹிஃபில் வடிவிலுள்ள இந்த வினை, ஒன்றை அருகில் கொண்டுவருதல் அல்லது ஒருவர்முன் வைத்தல் என்று பொருள்படும். எபிரெயத்தில் செயப்படுபொருள் வெளிப்படையாக இல்லை; முந்தைய சூழலில் ஆயத்தப்படுத்தப்பட்ட உணவு குறிக்கப்படுவதால், இயல்பான தமிழுக்காக ‘அதை’ சேர்க்கப்பட்டுள்ளது.
- source_word: לִפְנֵי
  choice: முன்பாக
  rationale: இச்சொல் அடிப்படையில் ‘முன்/எதிரில்’ என்று பொருள்படும்; உணவை ஒருவர்முன் கொண்டுவந்து வைக்கும் இச்சூழலில் ‘முன்பாக’ இயல்பாகவும் மூலத்திற்கு நெருக்கமாகவும் உள்ளது.
- source_word: עֲבָדָיו
  choice: அவனுடைய பணியாளர்கள்
  rationale: עבד என்பது சூழலுக்கேற்ப அடிமை, பணியாளர், அல்லது உடனிருக்கும் சேவகர் எனப் பொருள்படலாம். இங்கு சவுலுடன் வந்த அரசுப் பணியிலுள்ள ஆட்களைக் குறிப்பதால், அவர்களின் சட்டநிலையை மிகைப்படுத்தாத ‘பணியாளர்கள்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: וַיֹּאכֵלוּ
  choice: அவர்கள் சாப்பிட்டார்கள்
  rationale: வினை எளிமையாக அவர்கள் உண்டதைக் கூறுகிறது. எதைச் சாப்பிட்டார்கள் என்பது சூழலால் தெளிவாக இருப்பதால் செயப்படுபொருளை மீண்டும் சேர்க்கவில்லை.
- source_word: וַיָּקֻמוּ
  choice: பிறகு அவர்கள் எழுந்து
  rationale: கதை நிகழ்வுகளின் தொடர்ச்சியை ‘பிறகு’ காட்டுகிறது; קום என்பதன் நேரடியான பொருளை ‘எழுந்து’ இயல்பாகத் தருகிறது.
- source_word: וַיֵּלְכוּ
  choice: புறப்பட்டுச் சென்றார்கள்
  rationale: הלך என்பதன் அடிப்படைப் பொருள் ‘செல்’ என்பதாகும். அவர்கள் வீட்டை விட்டுச் சென்றனர் என்பது சூழலில் தெளிவாக இருப்பதால், நவீன தமிழில் இயல்பான ‘புறப்பட்டுச் சென்றார்கள்’ பயன்படுத்தப்பட்டது.
- source_word: בַּלַּיְלָה הַהוּא
  choice: அந்த இரவிலேயே
  rationale: சொற்றொடரின் நேரடிப் பொருள் ‘அந்த இரவில்.’ நிகழ்வு அதே இரவில் நடந்ததைத் தமிழில் இயல்பாக வலியுறுத்த ‘அந்த இரவிலேயே’ என மொழிபெயர்க்கப்பட்டது.
