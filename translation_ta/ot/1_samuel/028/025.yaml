translation_notes:
  register: நவீன நிலையான தமிழில், கண்ணியமான ஆனால் பொதுவாசகர்களுக்கு எளிதில் புரியும் நடையில் வடிவமைக்கப்பட்டது. ‘பணியாளர்கள்’ என்பது ‘அடிமைகள்’ என்ற தேவையற்ற சட்ட அல்லது சமூகப் பொருளைத் தவிர்த்து, சவுலுடன் இருந்த சேவகர்களைக் குறிக்கிறது. வசனத்தின் சுருக்கமான நிகழ்வுத் தொடர்ச்சி பாதுகாக்கப்பட்டுள்ளது.
