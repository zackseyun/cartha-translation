source:
  edition: WLC
  text: כַּ/אֲשֶׁ֤ר לֹֽא שָׁמַ֨עְתָּ֙ בְּ/ק֣וֹל יְהוָ֔ה וְ/לֹֽא עָשִׂ֥יתָ חֲרוֹן אַפּ֖/וֹ בַּ/עֲמָלֵ֑ק עַל כֵּן֙ הַ/דָּבָ֣ר הַ/זֶּ֔ה עָשָֽׂה לְ/ךָ֥ יְהוָ֖ה הַ/יּ֥וֹם הַ/זֶּֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/018.yaml
  text: Because you did not obey the voice of Yahweh and did not carry out his burning anger against Amalek[a], therefore Yahweh has done this thing to you today.
translation:
  language: ta
  text: நீ யாவேயின் குரலுக்குக் கீழ்ப்படியாமலும், அமாலேக்குக்கு எதிராக அவருடைய எரியும் கோபத்தைச் செயல்படுத்தாமலும் போனதால், ஆகையால் யாவே இன்று உனக்கு இதைச் செய்திருக்கிறார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כַּאֲשֶׁר
  choice: போனதால்
  rationale: இங்கு இந்த இணைப்புச்சொல் சவுலுக்கு வந்த தீர்ப்புக்கான காரணத்தை அறிமுகப்படுத்துகிறது; தமிழில் காரணப் பொருளை இயல்பாக வெளிப்படுத்த வினையுடன் ‘போனதால்’ என இணைக்கப்பட்டது.
- source_word: שָׁמַעְתָּ בְּקוֹל יְהוָה
  choice: யாவேயின் குரலுக்குக் கீழ்ப்படியாமலும்
  rationale: שׁמע בְּקוֹל என்பது வெறுமனே கேட்பதை அல்ல, சொன்னபடி கீழ்ப்படிவதைக் குறிக்கிறது. ‘குரலுக்குக் கீழ்ப்படி’ என்பது மூல உருவகத்தையும் பொருளையும் காக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: நான்கு எழுத்துகளாலான இறைபெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் தெளிவான ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: עָשִׂיתָ חֲרוֹן אַפּוֹ
  choice: அவருடைய எரியும் கோபத்தை நிறைவேற்றாமலும்
  rationale: சொல்லுக்கு சொல் ‘அவருடைய கோபத்தின் எரிவைச் செய்யவில்லை’ என்ற எபிரெய வழக்கு, அமாலேக்குக்கு எதிராகக் கட்டளையிடப்பட்ட இறைக் கோபத் தீர்ப்பைச் செயல்படுத்தாததைக் குறிக்கிறது. ‘நிறைவேற்று’ என்பது செயற்பாட்டு வலிமையை இயல்பான தமிழில் தருகிறது.
- source_word: חֲרוֹן אַפּוֹ
  choice: அவருடைய எரியும் கோபம்
  rationale: இந்த எபிரெயச் சொற்றொடரிலுள்ள வெம்மை அல்லது எரிதல் உருவகத்தை ‘எரியும் கோபம்’ காக்கிறது.
- source_word: בַּעֲמָלֵק
  choice: அமாலேக்குக்கு எதிராக
  rationale: இறைக் கோபத்தைச் செயல்படுத்துவதன் இலக்கை בְּ குறிக்கிறது; இச்சூழலில் ‘எதிராக’ என்பது இயல்பான தமிழ்.
- source_word: עַל כֵּן
  choice: அதனால்தான்
  rationale: முன்னர் கூறப்பட்ட கீழ்ப்படியாமையிலிருந்து வரும் விளைவை வலியுறுத்துகிறது; כַּאֲשֶׁר உடன் வரும் காரணம்–விளைவு அமைப்பையும் காக்கிறது.
- source_word: הַדָּבָר הַזֶּה
  choice: இதை
  rationale: தற்போது அறிவிக்கப்பட்ட தீர்ப்பு அல்லது நிகழ்வைக் குறிக்கும் பொதுவான דבר என்பதற்கு இயல்பான தமிழ் சுட்டுப்பெயர்.
- source_word: עָשָׂה לְךָ יְהוָה
  choice: யாவே உனக்கு இதைச் செய்திருக்கிறார்
  rationale: முடிவுற்ற செயல் தற்போதைய விளைவைக் கொண்டிருப்பதைத் தமிழின் ‘செய்திருக்கிறார்’ தெளிவாக வெளிப்படுத்துகிறது; לְךָ-வின் பாதிப்புறும் நபர் ‘உனக்கு’ எனக் காக்கப்படுகிறது.
- source_word: הַיּוֹם הַזֶּה
  choice: இன்று
  rationale: ‘இந்த நாள்’ என்பதன் இயல்பான நவீனத் தமிழ் வடிவம்; கால வலியுறுத்தலைத் தக்கவைக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைபெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூல வசனம் தனிப்பட்ட இறைபெயரை நேரடியாகப் பயன்படுத்துகிறது. அதை ஒரு பட்டமாக மாற்றாமல் ஒலிபெயர்ப்பது மூலத்தின் வேறுபாட்டைக் காக்கிறது; ‘யாவே’ என்பது சாத்தியமான எபிரெய உச்சரிப்பை அணுகும் தமிழ் வடிவம்.
- issue: அமாலேக்குக்கு எதிரான חֲרוֹן אַף என்பதன் பொருள்
  choice: அவருடைய எரியும் கோபத்தை நிறைவேற்றுதல்
  alternative: அவருடைய கடுங்கோபத் தீர்ப்பை நிறைவேற்றுதல்
  rationale: உரை இறைக் கோபத்தையும் அதைக் கட்டளையின்படி செயல்படுத்துவதையும் ஒன்றாகக் கூறுகிறது. ‘எரியும் கோபம்’ மூல உருவகத்தைத் தக்கவைக்கிறது; அடிக்குறிப்பு தீர்ப்பை நிறைவேற்றும் செயற்பாட்டு பொருளை விளக்குகிறது, ஆனால் உரையில் இல்லாத சமய மரபுசார் விளக்கத்தைச் சேர்ப்பதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடையைக் கடைப்பிடிக்கிறது. ‘நீ’ மற்றும் ‘உனக்கு’ ஆகிய ஒருமை வடிவங்கள் சவுலிடம் நேரடியாக உரைக்கப்படும் எபிரெய வடிவங்களைப் பிரதிபலிக்கின்றன. காரணத்தைக் குறிக்கும் ‘போனதால்’ மற்றும் விளைவைக் குறிக்கும் ‘அதனால்தான்’ இரண்டையும் வைத்திருப்பது மூலத்தின் כַּאֲשֶׁר ... עַל כֵּן அமைப்பைத் தெளிவாகக் காக்கிறது.
