revisions:
- from: நீ யாவேயின் குரலுக்குக் கீழ்ப்படியாமலும், அமாலேக்குக்கு எதிராக அவருடைய எரியும் கோபத்தை நிறைவேற்றாமலும் போனதால்[a], அதனால்தான் யாவே இன்று உனக்கு இதைச் செய்திருக்கிறார்.
  to: நீ யாவேயின் குரலுக்குக் கீழ்ப்படியாமலும், அமாலேக்குக்கு எதிராக அவருடைய எரியும் கோபத்தைச் செயல்படுத்தாமலும் போனதால், ஆகையால் யாவே இன்று உனக்கு இதைச் செய்திருக்கிறார்.
  rationale: மூலத்தில் உள்ள கீழ்ப்படியாமை மற்றும் அமாலேக்குக்கு எதிராக யாவேயின் கோபத்தைச் செயல்படுத்தத் தவறுதல் ஆகிய இரு காரணங்களும், அவற்றின் விளைவாக வந்த செயலும் காக்கப்பட்டுள்ளன. ‘செயல்படுத்துதல்’ எபிரெய עָשָׂה-வின் செயல்வலிமையை நவீன தமிழில் இயல்பாகத் தருகிறது. அடிக்குறிப்பு உரைக்கு அப்பாற்பட்ட ‘தீர்ப்பு’ என்ற சேர்க்கையை நீக்கி, சொற்சார் மாற்றை மட்டுமே தருகிறது.
