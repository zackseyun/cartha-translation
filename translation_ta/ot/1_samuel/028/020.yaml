base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/020.yaml
  text: Saul immediately fell full length to the ground[a], and he was very afraid because of Samuel’s words. There was no strength in him either, because he had eaten no bread all that day and all that night.
translation:
  language: ta
  text: சவுல் உடனே தன் முழு உடலோடும் தரையில் விழுந்தான்; சாமுவேலின் வார்த்தைகளால் அவன் மிகவும் பயந்தான். அவனுக்கு வலிமையும் இல்லை; ஏனெனில் அந்தப் பகல் முழுவதும் அந்த இரவு முழுவதும் அவன் அப்பம் சாப்பிடவில்லை.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மொழியில் ‘அப்பம்’ என்ற சொல் விரிவான பொருளில் ‘உணவு’ என்பதையும் குறிக்கலாம்; மூலத்தின் சொல்லாட்சியைப் பிரதிபலிக்க இங்கு ‘அப்பம்’ என்றே மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְמַהֵר
  choice: உடனே
  rationale: வினைச்சொல்லின் அடிப்படைப் பொருள் ‘விரைந்தான்’; இங்கு சவுலின் திடீர் வீழ்ச்சியை இயல்பான தமிழில் ‘உடனே’ வெளிப்படுத்துகிறது.
- source_word: וַיִּפֹּל מְלֹא קוֹמָתוֹ אַרְצָה
  choice: தன் முழு உடலும் தரையில் படும்படி விழுந்தான்
  rationale: ‘தன் முழு உயரம்/உடல் நீளம் முழுவதுமாகத் தரையை நோக்கி விழுதல்’ என்ற எபிரெயச் சொற்றொடரை, வெறுமனே தடுமாறி விழுந்தான் என்று அல்லாமல் முழு உடலுடன் விழுந்தான் எனத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: וַיִּרָא מְאֹד
  choice: மிகவும் பயந்தான்
  rationale: கடுமையான அச்சத்தை நேரடியாகவும் நவீனத் தமிழிலும் தெரிவிக்கிறது.
- source_word: מִדִּבְרֵי שְׁמוּאֵל
  choice: சாமுவேலின் வார்த்தைகளால்
  rationale: מִן இங்கு காரணத்தைக் குறிக்கிறது; சாமுவேலின் வார்த்தைகளே அவனது அச்சத்திற்குக் காரணம் என்பதைப் பாதுகாக்கிறது.
- source_word: גַּם כֹּחַ לֹא הָיָה בוֹ
  choice: அவனிடம் வலிமையும் இருக்கவில்லை
  rationale: גַּם என்பதன் சேர்க்கைப் பொருளை ‘வலிமையும்’ என்பதன் மூலம் காக்கிறது; மூலத்தில் இல்லாத ‘மீதமிருக்கவில்லை’ என்ற கூடுதல் காலநிலையைத் தவிர்க்கிறது.
- source_word: לֹא אָכַל לֶחֶם
  choice: அப்பம் சாப்பிடாததால்
  rationale: לֶחֶם பொதுவாக உணவையும் குறிக்கலாம்; இருப்பினும் மூலச் சொல்லை பிரதிபலிக்க ‘அப்பம்’ வைக்கப்பட்டுள்ளது.
- source_word: כָּל הַיּוֹם וְכָל הַלָּיְלָה
  choice: அந்தப் பகல் முழுவதும் அந்த இரவு முழுவதும்
  rationale: கதைச் சூழலில் குறிப்பிட்ட பகலையும் இரவையும் சுட்டி, காலத்தின் முழுமையையும் வெளிப்படுத்துகிறது.
