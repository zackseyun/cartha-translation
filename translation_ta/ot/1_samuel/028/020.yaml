revisions:
- from: சவுல் உடனே தன் முழு உடலும் தரையில் படும்படி விழுந்தான்; சாமுவேலின் வார்த்தைகளால் அவன் மிகவும் பயந்தான். அந்தப் பகல் முழுவதும் அந்த இரவு முழுவதும் அவன் அப்பம் சாப்பிடாததால், அவனிடம் வலிமையும் இருக்கவில்லை.[a]
