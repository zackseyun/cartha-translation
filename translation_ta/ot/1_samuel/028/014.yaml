base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/014.yaml
  text: He said to her[a], “What is his appearance?” And she said, “An old man is coming up, and he is wrapped in a robe.” Then Saul knew that it was Samuel[c][b], and he bowed with his face to the ground and prostrated himself.
translation:
  language: ta
  text: அவன் அவளிடம், “அவருடைய தோற்றம் எப்படி இருக்கிறது?” என்று கேட்டான். அதற்கு அவள், “முதியவர் ஒருவர் மேலே வந்துகொண்டிருக்கிறார்[a]; அவர் ஒரு மேலங்கியைப் போர்த்தியிருக்கிறார்[b]” என்றாள். அப்போது அவர் சாமுவேல் என்று சவுல் அறிந்துகொண்டான்; பிறகு அவன் முகம் தரையில் படுமாறு குனிந்து, விழுந்து பணிந்தான்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘மேலே எழுந்துவருகிறார்’ அல்லது ‘மேலே ஏறிவருகிறார்’ என்றும் மொழிபெயர்க்கலாம். எபிரெயப் பங்கேற்புவினை மேல்நோக்கி நடந்துகொண்டிருக்கும் இயக்கத்தை வலியுறுத்துகிறது.
    reason: lexical_alternative
  - marker: b
    text: ‘ஒரு மேலங்கியை அணிந்திருக்கிறார்’ என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல், அதை வெறுமனே அணிந்திருப்பதைவிடப் போர்த்தியிருப்பதை இன்னும் தெளிவாகச் சித்தரிக்கிறது.
    reason: lexical_alternative
  - marker: c
    text: இறுதி வினைச்சொல்லை ‘வணங்கினான்’ என்றும், சில சூழல்களில் ‘வழிபட்டான்’ என்றும் மொழிபெயர்க்கலாம். இங்கு சாமுவேல் என்று அடையாளம் காணப்பட்டவருக்கு முன்பாக ஆழமாக விழுந்து பணிந்த செயலை அது குறிக்கிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: תָּאֳרוֹ
  choice: அவனுடைய தோற்றம்
  rationale: תֹּאַר என்பது கண்ணுக்குப் புலப்படும் உருவத்தையோ தோற்றத்தையோ குறிக்கிறது. அடையாளம் காண உதவும் வெளிப்புற விவரத்தை சவுல் கேட்பதை ‘தோற்றம்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: אִישׁ זָקֵן
  choice: முதியவர் ஒருவர்
  rationale: வயது முதிர்ந்த ஆண் ஒருவரை நேரடியாகக் குறிக்கும் சொற்றொடர். ‘முதியவர் ஒருவர்’ என்பது நவீனத் தமிழில் இயல்பாகவும் மரியாதையாகவும் உள்ளது.
- source_word: עֹלֶה
  choice: மேலே வந்துகொண்டிருக்கிறார்
  rationale: எபிரெயப் பங்கேற்புவினை நடந்துகொண்டிருக்கும் மேல்நோக்கிய இயக்கத்தைச் சுட்டுகிறது. ‘மேலே வந்துகொண்டிருக்கிறார்’ என்பது அதன் திசையையும் தொடர்ச்சியையும் காக்கிறது.
- source_word: עֹטֶה מְעִיל
  choice: ஒரு மேலங்கியைப் போர்த்தியிருக்கிறார்
  rationale: עֹטֶה என்பது வெறுமனே அணிவதைவிடப் போர்த்திக்கொள்வதைக் குறிக்கிறது; מְעִיל நீண்ட மேலங்கி அல்லது அங்கியைக் குறிக்கிறது. இங்கு ‘மேலங்கி’ பொதுவாசகருக்கு இயல்பாகவும் அடையாளம் காட்டும் ஆடையின் தன்மையைத் தக்கவைத்தும் உள்ளது.
- source_word: וַיֵּדַע
  choice: சவுல் அறிந்துகொண்டான்
  rationale: ידע என்பதன் அடிப்படைப் பொருள் ‘அறிதல்’; இச்சூழலில் கொடுக்கப்பட்ட விவரத்திலிருந்து அடையாளம் கண்டுகொள்வதைக் குறிக்கிறது. ‘அறிந்துகொண்டான்’ இரண்டையும் இயல்பாக இணைக்கிறது.
- source_word: כִּי שְׁמוּאֵל הוּא
  choice: அது சாமுவேல் என்று
  rationale: எபிரெயத்தில் ‘அவர் சாமுவேல்’ என்று ஆண்பால் சுட்டுப்பெயர் இருந்தாலும், ஒருவரின் அடையாளத்தைத் தோற்றவிவரத்தின் அடிப்படையில் உணர்ந்ததைத் தமிழில் ‘அது சாமுவேல்’ என்று சொல்வது இயல்பானது; காட்சியின் இயல்பு குறித்த கூடுதல் தீர்ப்பையும் இது சேர்ப்பதில்லை.
- source_word: וַיִּקֹּד אַפַּיִם אַרְצָה
  choice: முகம் தரையில் படுமாறு குனிந்து
  rationale: இந்த மொழிமரபு முகம் அல்லது மூக்கு நிலத்தை நோக்குமாறு ஆழமாகக் குனிவதைக் குறிக்கிறது. தேர்ந்த சொற்றொடர் உடல் நிலையைக் தெளிவாகக் காட்டுகிறது.
- source_word: וַיִּשְׁתָּחוּ
  choice: விழுந்து பணிந்தான்
  rationale: שׁחה ஆழமாகக் குனிதல், முகங்குப்புற விழுந்து மரியாதை செலுத்துதல், அல்லது சூழலைப் பொறுத்து வழிபடுதல் ஆகியவற்றைக் குறிக்கலாம். ‘விழுந்து பணிந்தான்’ உடல் செயலையும் மரியாதையையும் காக்கிறது; வழிபாடு என்ற முடிவை உரைக்குள் கட்டாயப்படுத்துவதில்லை.
theological_decisions:
- issue: சாமுவேல் என்று அடையாளம் காணப்பட்ட உருவத்துக்கு சவுல் செய்த செயலை வெளிப்படையாக ‘வழிபட்டான்’ என்று மொழிபெயர்க்க வேண்டுமா
  choice: ‘விழுந்து பணிந்தான்’ என்று மொழிபெயர்க்கப்பட்டது.
  alternative: ‘வணங்கினான்’ அல்லது ‘வழிபட்டான்’
  rationale: שׁחה என்பது சூழலின்படி வழிபாட்டையோ ஆழ்ந்த மரியாதையுடன் தரையில் விழுந்து பணிவதையோ குறிக்கலாம். இங்கு உடல் சார்ந்த பணிவுச் செயல் உறுதியாக உள்ளது; ஆனால் ‘வழிபட்டான்’ என்பது மூலவசனம் வெளிப்படையாகத் தீர்மானிக்காத சமயவியல் பொருளைச் சேர்க்கக்கூடும். எனவே தெளிவான செயலைக் கூறி, அதன் துல்லியமான சமயவியல் மதிப்பீட்டை வாசகரிடம் திறந்தவாறு விடுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகருக்கு எளிதில் புரியும், அதே நேரத்தில் மரியாதையும் வேதாகம உரைக்குரிய கண்ணியமும் கொண்ட நடை. ‘மேலங்கி’, ‘போர்த்தியிருக்கிறார்’, ‘விழுந்து பணிந்தான்’ ஆகியவை இயல்பான சொற்களாகத் தேர்ந்தெடுக்கப்பட்டன. மூலத்தின் தொடர்ச்சியான மேல்நோக்கிய இயக்கமும், இரண்டு பணிவுச் செயல்களின் தீவிரமும், வழிபாடு குறித்த சமயவியல் தெளிவின்மையும் காக்கப்பட்டுள்ளன.
