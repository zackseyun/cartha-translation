base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/011.yaml
  text: Then the woman said[a], “Whom shall I bring up for you?” And he said, “Bring up Samuel for me.”
translation:
  language: ta
  text: அப்போது அந்தப் பெண், “உங்களுக்காக நான் யாரை மேலே வரவழைக்க வேண்டும்[a]?” என்று கேட்டாள். அதற்கு அவர், “எனக்காக சாமுவேலை மேலே வரவழை” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அழைத்து வரவேண்டும்?” எபிரெய வினை சொல்லுக்கு சொல் “மேலே வரச் செய்” அல்லது “மேலே கொண்டுவா” என்று பொருள்படும்; இறந்தவரோடு தொடர்புகொள்ளும் இச்சூழலில் பயன்படும் சொல்லாட்சி இது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: அப்போது ... கேட்டாள்
  rationale: வழக்கமான இறந்தகாலக் கதைநடையைத் தொடரும் wayyiqtol வடிவம். நேரடி உரை கேள்வியாக இருப்பதால், இயல்பான தமிழில் ‘சொன்னாள்’ என்பதற்குப் பதிலாக ‘கேட்டாள்’ என வழங்கப்படுகிறது.
- source_word: הָאִשָּׁה
  choice: அந்தப் பெண்
  rationale: சூழலில் ஏற்கெனவே குறிப்பிடப்பட்ட ஏன்தோர் பெண்ணைக் குறிக்கிறது; பெயர்ச்சொல்லை எளிமையாகவும் தெளிவாகவும் வழங்குகிறது.
- source_word: אֶת מִי
  choice: யாரை
  rationale: אֶת குறிக்கும் நேரடிச் செயப்படுபொருள் செயல்பாட்டைத் தமிழின் ‘-ஐ’ உருபு துல்லியமாக வெளிப்படுத்துகிறது.
- source_word: אַעֲלֶה
  choice: நான் ... மேலே வரவழைக்க வேண்டும்
  rationale: עלה என்பதன் ஹிஃபில் வடிவம் ‘மேலே வரச் செய்/மேலே கொண்டுவா’ என்ற உருவகத்தைத் தருகிறது. ‘மேலே வரவழை’ என்பது மூல உருவகத்தைப் பாதுகாத்தபடி தமிழில் இயல்பாக உள்ளது.
- source_word: לָּךְ
  choice: உங்களுக்காக
  rationale: இங்கு ל பயனாளரைக் குறிக்கிறது; அந்தச் செயல் சவுலுக்காகச் செய்யப்படுவதை மரியாதையான நவீன தமிழில் காட்டுகிறது.
- source_word: וַיֹּאמֶר
  choice: அதற்கு அவர் ... என்றார்
  rationale: உரையாடலின் தொடர்ச்சியையும் பதிலின் தொடர்பையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது; மூலத்தின் ஆண்பால் ஒருமையையும் ‘அவர்’ காக்கிறது.
- source_word: אֶת שְׁמוּאֵל
  choice: சாமுவேலை
  rationale: אֶת மொழிபெயர்க்கப்படாமல், நேரடிச் செயப்படுபொருளைக் காட்டும் ‘-ஐ’ பெயருடன் இணைக்கப்படுகிறது.
- source_word: הַעֲלִי
  choice: மேலே வரவழை
  rationale: பெண்ணை நோக்கிய ஹிஃபில் கட்டளை வடிவம். முந்தைய வினையுடன் சொற்பொருள் ஒற்றுமையையும் ‘மேலே’ என்ற மூல உருவகத்தையும் காக்கிறது.
- source_word: לִי
  choice: எனக்காக
  rationale: 'ל இங்கும் பயனாளர் பொருளில் எடுத்துக்கொள்ளப்படுகிறது: சாமுவேலைத் தனக்காக வரவழைக்கும்படி சவுல் கேட்கிறார்.'
theological_decisions:
- issue: இறந்தவரோடு தொடர்புகொள்ளும் சூழலில் עלה என்ற சொல்லை மொழிபெயர்த்தல்
  choice: மேலே வரவழை
  alternative: அழைத்து வரவழை / மேலே கொண்டுவா
  rationale: எபிரெய வினை நேரடியாக ‘மேலே வரச் செய்’ என்ற உருவகத்தைப் பயன்படுத்துகிறது. நிகழ்வின் இயல்பையோ செயல்முறையையோ இறையியல் ரீதியாக முன்கூட்டியே தீர்மானிக்காமல், அந்த உருவகத்தையும் உரையின் பதற்றத்தையும் இந்தத் தேர்வு காக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில், எளிமையான ஆனால் கண்ணியமான உரையாடல் நடை பயன்படுத்தப்பட்டுள்ளது. சவுலின் அடையாளம் இவ்வசனத்தில் பெயரால் மீண்டும் சொல்லப்படாததால் ‘அவர்’ என மூலத்தின் குறிப்புநிலையைப் பாதுகாக்கிறது. ‘மேலே வரவழை’ என்பது சற்றே குறியீட்டுத் தன்மை கொண்டிருந்தாலும், மூலத்தின் மீளுரைப்பையும் உண்மையான தெளிவின்மையையும் காக்கிறது.
