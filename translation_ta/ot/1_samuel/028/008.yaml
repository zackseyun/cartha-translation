base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/008.yaml
  text: So Saul disguised himself and put on other clothes[a], and he went, he and two men with him. They came to the woman by night, and he said, “Please divine for me by a medium, and bring up for me the one whom I name to you.”
translation:
  language: ta
  text: எனவே சவுல் மாறுவேடமிட்டு, வேறு உடைகளை அணிந்துகொண்டான். அவனும் அவனோடு இரண்டு ஆட்களும் புறப்பட்டுச் சென்றார்கள். இரவில் அவர்கள் அந்தப் பெண்ணிடம் வந்தார்கள். சவுல் அவளிடம், “தயவுசெய்து, ஓர் ஊடகத்தின் மூலம்[a] எனக்காகக் குறிபார்த்து, நான் உன்னிடம் சொல்லும் ஒருவரை எனக்காக எழும்பிவரச் செய்” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரேயச் சொல் ஓர் ஊடகத்தையோ, அதனுடன் தொடர்புடைய ஆவியையோ குறிக்கலாம்; இச்சூழலில் அது இறந்தோருடன் தொடர்பு கொள்ளும் குறிபார்த்தலோடு இணைக்கப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְחַפֵּשׂ
  choice: மாறுவேடமிட்டு
  rationale: Hitpael வடிவம் சவுல் தன் அடையாளத்தை மறைக்கத் தன் தோற்றத்தை மாற்றிக்கொண்டதைக் குறிக்கிறது; நவீனத் தமிழில் இயல்பான சுருக்கமான தெரிவு.
- source_word: בְּגָדִים אֲחֵרִים
  choice: வேறு உடைகளை அணிந்துகொண்டான்
  rationale: மாறுவேடத்தின் ஒரு பகுதியாக வேறு ஆடைகளை அணிந்த செயலைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: וַיֵּלֶךְ הוּא וּשְׁנֵי אֲנָשִׁים עִמּוֹ
  choice: அவனும் அவனோடு இரண்டு ஆட்களும் புறப்பட்டுச் சென்றார்கள்
  rationale: எபிரேயத்தில் சவுலையும் அவனோடிருந்த இருவரையும் வெளிப்படையாகச் சுட்டும் அமைப்பைப் பேணுகிறது.
- source_word: לָיְלָה
  choice: இரவில்
  rationale: இரவுநேரச் சூழலை இயல்பான நவீனத் தமிழில் நேரடியாகக் காட்டுகிறது.
- source_word: קָסֳמִי נָא לִי
  choice: தயவுசெய்து ... எனக்காகக் குறிபார்த்து
  rationale: קסם குறிகேட்பு அல்லது குறிபார்த்தல் சார்ந்த செயலைக் குறிக்கிறது; נָא என்பதன் வேண்டுகோள் நயத்தை ‘தயவுசெய்து’ காட்டுகிறது.
- source_word: בָּאוֹב
  choice: இறந்தோரிடம் குறிகேட்கும் முறையில்
  rationale: இச்சூழலில் אוֹב என்பது இறந்தோரை அணுகுவதாகக் கருதப்பட்ட குறிகேட்பு வழிமுறையையோ அதனுடன் தொடர்புடைய ஆவியையோ குறிக்கக்கூடும்; முதன்மை உரை செய்முறையைத் தெளிவாகத் தருகிறது, உண்மையான சொல்லியல் தெளிவின்மை அடிக்குறிப்பில் காக்கப்படுகிறது.
- source_word: וְהַעֲלִי לִי
  choice: எனக்காக எழும்பிவரச் செய்
  rationale: עלה என்பதன் Hiphil வடிவிலுள்ள ‘மேலே வரச் செய்தல்’ என்ற உருவகத்தைப் பேணுகிறது; அழைத்துவரும் செயலின் உண்மைத் தன்மை குறித்து கூடுதல் தீர்ப்பைச் சேர்க்கவில்லை.
- source_word: אֵת אֲשֶׁר אֹמַר אֵלָיִךְ
  choice: நான் உன்னிடம் குறிப்பிடுகிறவனை
  rationale: சவுல் பின்னர் அடையாளப்படுத்தும் நபரைக் குறிக்கும் தொடரை இயல்பாகவும் நேரடியாகவும் தருகிறது.
theological_decisions:
- issue: இறந்தோரிடம் குறிகேட்பது தொடர்பான சொற்களை, அதன் செயல்திறனை ஆதரிக்காமலும் மறுக்காமலும் மொழிபெயர்த்தல்
  choice: ‘குறிபார்த்து’, ‘இறந்தோரிடம் குறிகேட்கும் முறையில்’, ‘எழும்பிவரச் செய்’ என்று கதையின் சொற்படிமத்தை நேரடியாகப் பேணுதல்
  alternative: ‘எழும்பிவருவது போலச் செய்’ என்று சந்தேகத்தைச் சேர்த்தல், அல்லது ‘இறந்தவரின் ஆவியுடன் தொடர்புகொள்’ என்று வலுவான விளக்கத்தைச் சேர்த்தல்
  rationale: உரை சவுலின் வேண்டுகோளை அதன் கருத்துலகுக்குள் அறிவிக்கிறது. அந்தச் செயல் உண்மையில் எவ்வாறு நிகழ்ந்தது என்ற கோட்பாட்டுத் தீர்ப்பை மொழிபெயர்ப்பே முன்கூட்டியே வழங்கக்கூடாது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் dignified narrative register பயன்படுத்தப்பட்டுள்ளது. ‘மாறுவேடமிட்டு’, ‘குறிபார்த்து’, ‘எழும்பிவரச் செய்’ ஆகியவை மூலத்தின் செயல்களையும் படிமத்தையும் காக்கின்றன; அமானுஷ்ய நிகழ்வின் இயல்பு குறித்து மொழிபெயர்ப்பு தீர்ப்பளிக்கவில்லை.
