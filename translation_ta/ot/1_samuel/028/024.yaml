base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/024.yaml
  text: The woman had a fattened calf in the house[a], and she hurried and slaughtered it. Then she took flour, kneaded it[c][b], and baked unleavened bread.
translation:
  language: ta
  text: அந்தப் பெண்ணின் வீட்டில் கொழுக்கவைக்கப்பட்ட கன்றுக்குட்டி ஒன்று இருந்தது[a]. அவள் விரைந்து அதை அறுத்தாள்[b]. பின்பு மாவை எடுத்து, அதைப் பிசைந்து, புளிப்பில்லா அப்பங்களைச் சுட்டாள்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘தீனி போட்டு கொழுக்கவைக்கப்பட்ட கன்றுக்குட்டி’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: இங்கு பயன்படுத்தப்பட்டுள்ள வினை சில சூழல்களில் பலிக்காக அறுப்பதைக் குறிக்கலாம்; ஆனால் இங்கே உணவுக்காக விலங்கை அறுப்பதையே குறிக்கிறது.
    reason: lexical_alternative
  - marker: c
    text: ‘புளிப்பில்லா அடைகள்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵגֶל
  choice: கன்றுக்குட்டி
  rationale: இச்சொல் இளம் மாட்டினத்தைக் குறிக்கிறது. அதன் பாலினத்தை மூலவாக்கியம் குறிப்பாகத் தீர்மானிக்காததால், பொதுவான ‘கன்றுக்குட்டி’ இயல்பான தேர்வாகும்.
- source_word: מַרְבֵּק
  choice: கொழுக்கவைக்கப்பட்ட
  rationale: தொழுவத்தில் வைத்து நன்கு தீனி போட்டு கொழுக்கவைக்கப்பட்ட விலங்கைக் குறிக்கும் சொல்லின் பொருளை, இன்றைய வாசகருக்குத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: בַּבַּיִת
  choice: வீட்டில்
  rationale: இடத்தைக் குறிக்கும் எளிய, நேரடியான பொருளைத் தக்கவைக்கிறது.
- source_word: וַתְּמַהֵר
  choice: விரைந்து
  rationale: செயல் அவசரமாக நடந்ததை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: וַתִּזְבָּחֵהוּ
  choice: அதை அறுத்தாள்
  rationale: இந்தச் சூழலில் பலிக்காக அல்ல, உணவு தயாரிப்பதற்காக விலங்கு அறுக்கப்படுகிறது. ‘அறுத்தாள்’ அந்தச் செயலைத் துல்லியமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: קֶמַח
  choice: மாவை
  rationale: அப்பம் சுடப் பயன்படுத்தப்படும் மாவைக் குறிக்கும் தெளிவான தமிழ் இணைச்சொல்.
- source_word: וַתָּלָשׁ
  choice: பிசைந்து
  rationale: மாவைப் பிசையும் குறிப்பிட்ட செயலை நேரடியாகக் குறிக்கிறது.
- source_word: וַתֹּפֵהוּ מַצּוֹת
  choice: புளிப்பில்லா அப்பங்களைச் சுட்டாள்
  rationale: சுடுதல் என்ற செயலும் அதன் விளைவான புளிப்பில்லா அப்பங்களும் இயல்பான தமிழ் தொடராக வழங்கப்படுகின்றன; எபிரெயப் பன்மையும் தக்கவைக்கப்படுகிறது.
theological_decisions:
- issue: וַתִּזְבָּחֵהוּ என்ற வினை பலியிடுதலைக் குறிக்கிறதா?
  choice: உணவுக்காக விலங்கை அறுத்தல்
  alternative: பலியிட்டாள்
  rationale: உடனடிச் சூழல் உணவு தயாரிப்பைப் பற்றியது; வழிபாட்டு அல்லது பலிச்சடங்கு எதுவும் குறிப்பிடப்படவில்லை. ஆகவே பலியிடுதல் என்ற சமயப் பொருளை இங்கு சேர்க்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், கண்ணியமும் வாசிப்புத் தெளிவும் கொண்ட உரை. எபிரெய வாக்கியத்தின் தொடர்ச்சியான செயல்முறையைச் சுருக்கமான தமிழ் வாக்கியங்களாக இயல்பாக வழங்குகிறது. மூலத்தில் வெளிப்படையான ‘இப்போது’ என்ற காலச் சொல் இல்லாததால் அத்தகைய தொடக்கச் சொல் சேர்க்கப்படவில்லை.
