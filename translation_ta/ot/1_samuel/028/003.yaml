base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/003.yaml
  text: Samuel had died[a], and all Israel had mourned for him and buried him in Ramah, in his own city. And Saul had removed the mediums and the spiritists from the land.
translation:
  language: ta
  text: சாமுவேல் இறந்திருந்தார். இஸ்ரவேல் மக்கள் அனைவரும் அவருக்காகப் புலம்பி, அவருடைய சொந்த நகரமான ராமாவில் அவரை அடக்கம் செய்திருந்தார்கள். சவுல் ஆவி ஊடகங்களையும் ஆவியுலக விசாரணையாளர்களையும்[a] நாட்டிலிருந்து அகற்றியிருந்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் இரண்டு வேறுபட்ட சொற்கள் உள்ளன. அவை ஆவியுலகத் தொடர்பு அல்லது மறைமுறை விசாரணையுடன் தொடர்புடையவர்களைக் குறிக்கின்றன; அவற்றுக்கிடையேயான துல்லிய வேறுபாடு தெளிவாக இல்லை. முதல் சொல் இறந்தோருடன் தொடர்பு கொள்வதையும் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵת
  choice: இறந்திருந்தார்
  rationale: தொடர்ந்து நிகழவிருக்கும் சம்பவங்களுக்கு முன்பே சாமுவேல் இறந்துவிட்டார் என்பதைக் காட்டும் பின்னணிக் கூற்றாக அமைவதால், தமிழில் இறந்தகால நிறைவுநிலையைப் பயன்படுத்துகிறது.
- source_word: וַיִּסְפְּדוּ לוֹ
  choice: அவருக்காகப் புலம்பி
  rationale: ספד இறப்பை முன்னிட்டு வெளிப்படையாகத் துக்கம் தெரிவிப்பதைக் குறிக்கிறது; ‘புலம்பி’ என்பது அந்த இறுதிச்சடங்கு சார்ந்த பொருளைச் சுருக்கமாகத் தக்கவைக்கிறது.
- source_word: כָּל יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்கள் அனைவரும்
  rationale: எபிரெய மொழியின் கூட்டு தேசியக் குறிப்பை, நவீனத் தமிழில் இயல்பாகவும் அனைவருக்கும் தெளிவாகவும் வழங்குகிறது.
- source_word: וַיִּקְבְּרֻהוּ
  choice: அவரை அடக்கம் செய்திருந்தார்கள்
  rationale: קבר என்பதன் நேரடியான அடக்கஞ்செய்தல் பொருளையும், இந்தச் செயல் முன்பே முடிந்திருந்தது என்ற பின்னணித் தன்மையையும் வெளிப்படுத்துகிறது.
- source_word: בָרָמָה וּבְעִירוֹ
  choice: அவருடைய சொந்த நகரமான ராமாவில்
  rationale: ‘ராமாவில், அவருடைய நகரத்தில்’ என்ற எபிரெய இணைப்பை இயல்பான தமிழ் விளக்கப்பெயர் அமைப்பில் தருகிறது; உடைமையை ‘சொந்த’ என்பதால் தெளிவாக்குகிறது.
- source_word: הֵסִיר
  choice: அகற்றியிருந்தான்
  rationale: சவுல் முன்னதாக மேற்கொண்டிருந்த அதிகாரபூர்வ ஒழிப்பு அல்லது வெளியேற்ற நடவடிக்கையை, அதன் முறையைத் தேவையின்றி குறிப்பாக்காமல் தருகிறது.
- source_word: הָאֹבוֹת
  choice: இறந்தோரின் ஆவிகளுடன் தொடர்புகொள்வோர்
  rationale: אוֹב என்பது குறிப்பாக இறந்தோரின் ஆவிகளை அணுகுவதாகக் கருதப்பட்ட நபர்களுடன் தொடர்புடையது; நவீனத் தமிழில் புரியும் விளக்கச் சொல்லாக்கம் தேர்ந்தெடுக்கப்பட்டுள்ளது.
- source_word: הַיִּדְּעֹנִים
  choice: ஆவிகளிடம் குறிகேட்போர்
  rationale: יִדְּעֹנִי என்பது மறைமுறை ஆவியுலக அறிவை நாடும் பயிற்சியாளரைக் குறிக்கிறது; பிற்காலக் கற்பனைக் கதைகளின் ‘மந்திரவாதி’ வகைப்பாட்டைத் தவிர்க்கிறது.
- source_word: מֵהָאָרֶץ
  choice: நாட்டிலிருந்து
  rationale: இங்கு அரசியல்-தேசிய எல்லைக்குள் உள்ள நிலப்பரப்பைக் குறிக்கும் הארץ என்பதற்கு இயல்பான நவீனத் தமிழ் இணை.
theological_decisions:
- issue: மறைமுறை ஆவியுலகப் பயிற்சியாளர்களைக் குறிக்கும் இரு எபிரெயச் சொற்களின் வகைப்பாடு
  choice: இறந்தோரின் ஆவிகளுடன் தொடர்புகொள்வோர் மற்றும் ஆவிகளிடம் குறிகேட்போர்
  alternative: ஆவி ஊடகங்கள் மற்றும் ஆவியுலகத்தார்; அஞ்சனம் பார்ப்போர் மற்றும் குறிசொல்வோர்
  rationale: இரு சொற்களும் தடைசெய்யப்பட்ட ஆவியுலக விசாரணையாளர்களைக் குறித்தாலும், அவற்றுக்கிடையேயான துல்லியமான வேறுபாடு உறுதியில்லை. தேர்ந்தெடுத்த மொழிபெயர்ப்பு அடிப்படைச் செயலைத் தெளிவாக்குகிறது; பிற்கால சமய அல்லது நாட்டுப்புற வகைப்பாடுகளை உரைக்குள் இறக்குமதி செய்யவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், மரியாதையும் கதைநடைத் தெளிவும் காக்கப்பட்டுள்ளன. முதல் இரண்டு வாக்கியங்களிலும் இறுதி வாக்கியத்திலும் ‘இருந்தார்/இருந்தார்கள்/இருந்தான்’ வடிவங்கள் பயன்படுத்தப்பட்டு, இவை அடுத்த நிகழ்வுக்கு முன்பிருந்த பின்னணி நிலைகள் என்பதும் வெளிப்படுத்தப்பட்டுள்ளது. தொன்மையான அல்லது இன்றைய வாசகருக்குத் தெளிவில்லாத மறைமுறைச் சொற்களுக்கு பதிலாக விளக்கமான சொல்லாக்கம் பயன்படுத்தப்பட்டுள்ளது.
