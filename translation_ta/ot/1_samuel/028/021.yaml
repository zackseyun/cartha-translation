base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/021.yaml
  text: The woman came to Saul[a], and when she saw that he was very terrified, she said to him, “Behold, your servant has obeyed your voice[b], and I have put my life in my hand and listened to your words that you spoke to me.”
translation:
  language: ta
  text: அந்தப் பெண் சவுலிடம் வந்து, அவன் மிகவும் கலங்கியிருந்ததைக் கண்டு, அவனிடம், “இதோ, உமது பணிப்பெண்ணாகிய நான் உமது குரலுக்குக் கீழ்ப்படிந்தேன்; என் உயிரை என் உள்ளங்கையில் வைத்தேன்[a]; நீர் என்னிடம் சொன்ன வார்த்தைகளுக்குச் செவிகொடுத்தேன்” என்றாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரெய மரபுத்தொடர்: “என் உயிரை என் உள்ளங்கையில் வைத்தேன்”; அதாவது, “என் உயிரைப் பணயம் வைத்தேன்” அல்லது “என் உயிருக்கு ஆபத்தை ஏற்றேன்.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּב֤וֹא הָֽאִשָּׁה֙ אֶל שָׁא֔וּל
  choice: அந்தப் பெண் சவுலிடம் வந்து
  rationale: வழிநடத்தும் வினைத்தொடர் கதையை முன்னெடுக்கிறது. ‘அந்தப் பெண்’ என்பது வரையறுக்கப்பட்ட பெயர்ச்சொல்லைப் பாதுகாக்கிறது; இவ்வசனத்தில் இல்லாத ‘குறிசொல்பவள்’ போன்ற அடையாளத்தைச் சேர்க்கவில்லை.
- source_word: וַתֵּ֖רֶא כִּי נִבְהַ֣ל מְאֹ֑ד
  choice: அவன் மிகவும் கலங்கிப்போயிருப்பதைக் கண்டபோது
  rationale: נבהל என்பது திடுக்கிடுதல், அச்சமடைதல், கடுமையாகக் கலங்குதல் ஆகிய பொருள்களை உடையது. சூழலில் சவுலின் ஆழ்ந்த மனக்கலக்கத்தை இயல்பான தமிழில் தெரிவிக்க ‘மிகவும் கலங்கிப்போயிருப்பது’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: הִנֵּ֨ה
  choice: இதோ
  rationale: பேசுபவர் தமது வேண்டுகோளின் ஆதாரத்திற்குக் கவனத்தை ஈர்க்கும் உரையாடல் குறியீடாக இயங்குகிறது; ‘இதோ’ கண்ணியமான நவீன தமிழில் அதன் வலிமையைப் பாதுகாக்கிறது.
- source_word: שָׁמְעָ֤ה שִׁפְחָֽתְךָ֙ בְּקוֹלֶ֔ךָ
  choice: உமது பணிப்பெண்ணாகிய நான் உமது குரலுக்குக் கீழ்ப்படிந்தேன்
  rationale: שִׁפְחָה பெண் பணியாளைக் குறிக்கிறது; மூன்றாம் நபர் வடிவிலான தாழ்மையான தற்சுட்டலைத் தமிழில் தெளிவாக்க ‘உமது பணிப்பெண்ணாகிய நான்’ என வழங்கப்பட்டது. שׁמע בְּקוֹל என்பது வெறுமனே கேட்பதைவிட ‘கீழ்ப்படிதல்’ என்ற மரபுத்தொடர்ப் பொருளைக் கொண்டது.
- source_word: וָאָשִׂ֤ים נַפְשִׁי֙ בְּכַפִּ֔י
  choice: என் உயிரை என் உள்ளங்கையில் வைத்துக்கொண்டு
  rationale: உயிரைப் பணயம் வைத்தல் அல்லது உயிருக்கு ஆபத்தை ஏற்றல் என்பதைக் குறிக்கும் எபிரெய உருவகத்தை முதன்மை உரையில் பாதுகாக்கிறது; அதன் பொருள் அடிக்குறிப்பில் விளக்கப்படுகிறது.
- source_word: וָֽאֶשְׁמַע֙ אֶת דְּבָרֶ֔יךָ אֲשֶׁ֥ר דִּבַּ֖רְתָּ אֵלָֽי
  choice: நீர் என்னிடம் சொன்ன வார்த்தைகளுக்குச் செவிகொடுத்தேன்
  rationale: இங்கு שׁמע நேரடி செயப்படுபொருளுடன் வருவதால் கேட்டல்/செவிகொடுத்தல் என்ற பொருளைத் தக்கவைக்கிறது; முன்னுள்ள ‘குரலுக்குக் கீழ்ப்படிந்தேன்’ என்பதோடு உள்ள சொல் வடிவ வேறுபாடும் பாதுகாக்கப்படுகிறது.
