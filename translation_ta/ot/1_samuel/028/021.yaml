translation_notes:
  register: நவீன நிலையான தமிழில், கண்ணியமான வேதாகமக் கதைநடை பயன்படுத்தப்பட்டுள்ளது. சவுலை நோக்கிய மரியாதைப் பன்மை (‘உமது’, ‘நீர்’) தக்கவைக்கப்பட்டுள்ளது. எபிரெய உருவகம் முதன்மை உரையில் பாதுகாக்கப்பட்டு அதன் பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
