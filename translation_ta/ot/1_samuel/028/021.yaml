    issue: The idiom is rendered with the converb “வைத்துக்கொண்டு.”
    rationale: 'The Hebrew וָאָשִׂים is an independent first-person perfect/consecutive clause: “I put my life in my palm/hand.” A finite Tamil verb preserves the coordinated assertion and avoids suggesting merely a simultaneous manner of listening.'
