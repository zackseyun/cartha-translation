source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר שְׁמוּאֵ֔ל וְ/לָ֖/מָּה תִּשְׁאָלֵ֑/נִי וַ/יהוָ֛ה סָ֥ר מֵ/עָלֶ֖י/ךָ וַ/יְהִ֥י עָרֶֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/016.yaml
  text: And Samuel said[a], “Why then do you ask me, since Yahweh has turned away from you and has become your adversary?”
translation:
  language: ta
  text: அப்போது சாமுவேல், “யாவே உன்னைவிட்டு விலகி, உனக்கு எதிரியாகிவிட்டாரே[a]; அப்படியிருக்க, நீ ஏன் என்னிடம் கேட்கிறாய்?” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உனக்கு எதிராளியாகிவிட்டாரே.”
    reason: עָר என்ற எபிரெயச் சொல்லுக்கு ‘எதிரி’ என்றும் ‘எதிராளி’ என்றும் பொருள் கொள்ளலாம்.
lexical_decisions:
- source_word: וַיֹּאמֶר שְׁמוּאֵל
  choice: அப்போது சாமுவேல் ... என்றார்
  rationale: வாவ் தொடர்கதை நகர்வைத் தமிழில் இயல்பாகக் காட்ட ‘அப்போது’ பயன்படுத்தப்பட்டுள்ளது; பேச்சை அறிமுகப்படுத்தும் எபிரெய வடிவம் தமிழின் இயல்பான மேற்கோள் அமைப்பில் வாக்கிய முடிவில் தரப்பட்டுள்ளது.
- source_word: וְלָמָּה תִּשְׁאָלֵנִי
  choice: அப்படியிருக்க, நீ ஏன் என்னிடம் கேட்கிறாய்?
  rationale: וְלָמָּה என்பதன் தொடர்பையும் கூர்மையான வினாவையும் ‘அப்படியிருக்க ... ஏன்’ இயல்பாக வெளிப்படுத்துகிறது; שאל இங்கு ‘கேள்/விசாரி’ என்ற பொருளுடையது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரான நான்கெழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் உச்சரிப்புக்கு ஏற்ற ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: סָר מֵעָלֶיךָ
  choice: உன்னைவிட்டு விலகி
  rationale: சவுலிடமிருந்து யாவே விலகியிருப்பதைச் சுருக்கமாகவும் உறவுசார் பொருளைத் தக்கவைத்தும் காட்டுகிறது.
- source_word: וַיְהִי עָרֶךָ
  choice: உனக்கு எதிரியாகிவிட்டாரே
  rationale: עָר என்பது எதிரி அல்லது எதிராளியைக் குறிக்கிறது. ‘எதிரி’ தெய்வீக எதிர்ப்பின் கடுமையை மென்மைப்படுத்தாமல், சாதாரண வாசகருக்கும் தெளிவாகத் தெரிவிக்கிறது; ‘-ஆரே’ முந்தைய கூற்றை வினாவுக்கான வெளிப்படையான காரணமாக இணைக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: ஆண்டவர்; யெகோவா
  rationale: மூலத்தில் தனிப்பட்ட தெய்வீகப் பெயரே உள்ளது. ஆகவே அதை ஒரு பொதுப் பட்டமாக மாற்றாமல் ஒலிபெயர்ப்பது மூலத்துக்கு நெருக்கமானது.
- issue: சவுலுக்கு எதிரான யாவேயின் நிலையை வெளிப்படுத்துதல்
  choice: உனக்கு எதிரியாகிவிட்டார்
  alternative: உனக்கு எதிராளியாகிவிட்டார்; உனக்கு விரோதமாக இருக்கிறார்
  rationale: எபிரெய עָר வெளிப்படுத்தும் நேரடியான எதிர்ப்பையும் இறையியல் பதற்றத்தையும் தணிக்காமல் காக்கிறது. ‘எதிராளி’ என்பது சாத்தியமான சற்றே முறையான மாற்று.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான நேரடி உரை பயன்படுத்தப்பட்டுள்ளது. ஒருமை ‘நீ/உன்’ சவுலை நோக்கிய மூல உரையின் எண்ணைத் தக்கவைக்கிறது; யாவேயைக் குறிக்கும் வினைக்கு மரியாதைப் பன்மை பயன்படுத்தப்பட்டுள்ளது.
