translation_notes:
  register: நவீன நிலையான தமிழில், dignified narrative register. ‘சாப்பிடமாட்டேன்’ நேரடி உரையில் இயல்பாகவும் தெளிவாகவும் உள்ளது. ‘பேச்சுக்குச் செவிகொடுத்தார்’ என்பது எபிரெய மரபுத்தொடரின் தடத்தைப் பாதுகாத்தபடி சொல்லுக்குச் சொல் மொழிபெயர்ப்பின் இயல்பின்மையைத் தவிர்க்கிறது. அடிக்குறிப்பு குறியீடு தொடர்புடைய ‘கட்டில்’ என்பதற்குப் பின் வைக்கப்பட்டுள்ளது.
