base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/023.yaml
  text: But he refused and said[a], “I will not eat.” Yet his servants, along with the woman, urged him, and he listened to their voice[c][b]. So he rose from the ground and sat on the bed.
translation:
  language: ta
  text: ஆனால் அவர் மறுத்து, “நான் சாப்பிடமாட்டேன்” என்றார். அவருடைய பணியாளர்களும் அந்தப் பெண்ணும் அவரை மிகவும் வற்புறுத்தினார்கள்; அவர் அவர்களுடைய பேச்சுக்குச் செவிகொடுத்தார். பிறகு அவர் தரையிலிருந்து எழுந்து கட்டிலின்மேல்[a] உட்கார்ந்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “கட்டில்” என்பதற்கான எபிரெயச் சொல் இச்சூழலில் படுக்கையையோ சாய்விருக்கையையோ குறிக்கலாம்.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְמָאֵן
  choice: அவர் மறுத்து
  rationale: מָאֵן என்பது மறுப்பதையோ விருப்பமின்மையையோ குறிக்கிறது; கதைநடையில் ‘மறுத்து’ என்பது நேரான, இயல்பான தமிழ்.
- source_word: לֹא אֹכַל
  choice: நான் சாப்பிடமாட்டேன்
  rationale: לֹא உடன் வரும் אֹכַל சவுலின் உறுதியான மறுப்பை நேரடி உரையில் வெளிப்படுத்துகிறது; மூலத்தில் இல்லாத செயப்படுபொருளைச் சேர்க்கவில்லை.
- source_word: וַיִּפְרְצוּ בוֹ
  choice: அவரை மிகவும் வற்புறுத்தினார்கள்
  rationale: פרץ ב என்ற மரபுத்தொடர் ஒருவர்மீது உடல்ரீதியாகப் பாய்வதை அல்ல, விடாப்பிடியாக அழுத்தம் கொடுத்து வற்புறுத்துவதை இங்கு குறிக்கிறது; ‘மிகவும்’ அதன் வலிமையை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: עֲבָדָיו
  choice: அவருடைய பணியாளர்கள்
  rationale: அரசனுடன் இருந்த சேவகர்கள் அல்லது உதவியாளர்களை இங்கு குறிக்கிறது; அவர்களுடைய சட்ட அல்லது சமூக அடிமைநிலையை வலியுறுத்தாமல் ‘பணியாளர்கள்’ சூழலுக்கு ஏற்றது.
- source_word: וְגַם הָאִשָּׁה
  choice: அந்தப் பெண்ணும்
  rationale: וְגַם என்பதன் சேர்த்துக் கூறும் பொருளை ‘-உம்’ இயல்பாகப் பாதுகாக்கிறது; முன்சூழலில் அடையாளம் காணப்பட்ட பெண் என்பதால் ‘அந்தப் பெண்’ பொருத்தமானது.
- source_word: וַיִּשְׁמַע לְקֹלָם
  choice: அவர் அவர்களுடைய பேச்சுக்குச் செவிகொடுத்தார்
  rationale: சொல்லுக்குச் சொல் ‘அவர்களுடைய குரலுக்குச் செவிகொடுத்தார்’; தமிழில் ‘பேச்சுக்குச் செவிகொடுத்தார்’ என்பது மூல மரபுத்தொடரின் வடிவத்தையும், முழுமையான கீழ்ப்படிதல் என்று மிகைப்படுத்தாத பதிலளிக்கும் கேட்பதையும் காக்கிறது.
- source_word: מֵהָאָרֶץ
  choice: தரையிலிருந்து
  rationale: இங்கு אֶרֶץ சவுல் கிடந்த தரை அல்லது நிலப்பரப்பைக் குறிக்கிறது; ‘தரையிலிருந்து’ சூழலில் தெளிவானது.
- source_word: וַיֵּשֶׁב אֶל הַמִּטָּה
  choice: கட்டிலின்மேல் உட்கார்ந்தார்
  rationale: מִטָּה படுக்கை, கட்டில், அல்லது சாய்விருக்கையைக் குறிக்கலாம். வீட்டுச் சூழலில் ‘கட்டில்’ இயல்பான பொதுச் சொல்; אֶל இங்கு அமரும் இலக்கை உணர்த்துவதால் தமிழில் ‘-இன்மேல்’ என வழங்கப்பட்டுள்ளது.
