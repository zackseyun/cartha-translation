  register: நவீன நிலையான தமிழில், கண்ணியமான எளிய நடையில் மொழிபெயர்க்கப்பட்டது. ‘பாளயம்’ இராணுவ முகாமைத் தெளிவாகக் காட்டுகிறது; முதன்மை உரையில் இயல்பான ‘உள்ளம்’ பயன்படுத்தப்பட்டு, எபிரெய மொழியின் நேரடி ‘இதயம்’ அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
