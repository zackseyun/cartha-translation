lexical_decisions:
- source_word: וַיַּרְא
  choice: கண்டபோது
  rationale: ראה என்பதன் இயல்பான காட்சிப்புலப் பொருளைத் தருகிறது; தொடர்ந்த நிகழ்வுடன் தமிழில் இயல்பாக இணைக்கப்படுகிறது.
- source_word: מַחֲנֵה
