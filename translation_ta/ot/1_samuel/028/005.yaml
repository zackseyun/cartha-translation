  rationale: ירא குறிக்கும் அச்சத்தை நவீனத் தமிழில் நேரடியாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: וַיֶּחֱרַד
  choice: நடுங்கியது
  rationale: חרד குறிக்கும் கடும் உளக் கலக்கத்தையும் நடுக்கத்தையும் காக்கிறது; ‘திகிலடைந்தது’ போன்ற விளக்கமான மொழிபெயர்ப்பைத் தவிர்க்கிறது.
- source_word: לִבּוֹ
  choice: அவனுடைய உள்ளம்
  rationale: எபிரெய மொழியில் ‘இதயம்’ என்பது உள்ளார்ந்த மனிதனைச் சுட்டுகிறது; தமிழில் ‘உள்ளம்’ அந்த உருவகத்தையும் இயல்பான வாசிப்பையும் சமநிலைப்படுத்துகிறது.
- source_word: מְאֹד
  choice: மிகவும்
  rationale: வினையின் தீவிரத்தை எளிய நவீனத் தமிழில் வலுப்படுத்துகிறது.
