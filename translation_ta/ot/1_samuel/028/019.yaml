source:
  edition: WLC
  text: וְ/יִתֵּ֣ן יְ֠הוָה גַּ֣ם אֶת יִשְׂרָאֵ֤ל עִמְּ/ךָ֙ בְּ/יַד פְּלִשְׁתִּ֔ים וּ/מָחָ֕ר אַתָּ֥ה וּ/בָנֶ֖י/ךָ עִמִּ֑/י גַּ֚ם אֶת מַחֲנֵ֣ה יִשְׂרָאֵ֔ל יִתֵּ֥ן יְהוָ֖ה בְּ/יַד פְּלִשְׁתִּֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/019.yaml
  text: And Yahweh will also give Israel with you into the hand of the Philistines[a], and tomorrow you and your sons will be with me[b]. Yahweh will also give the camp of Israel into the hand of the Philistines.
translation:
  language: ta
  text: யாவே இஸ்ரவேலையும் உன்னோடு சேர்த்துப் பெலிஸ்தியரின் கையில் ஒப்புக்கொடுப்பார். நாளை நீயும் உன் மகன்களும் என்னோடு இருப்பீர்கள்.[a] இஸ்ரவேலின் படைமுகாமையும் யாவே பெலிஸ்தியரின் கையில் ஒப்புக்கொடுப்பார்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘இறப்பில் என்னோடு,’ ‘இறந்தோர் உலகில் என்னோடு.’ எபிரெயில் ‘என்னோடு’ என்று மட்டுமே உள்ளது.
    reason: alternative_reading
  - marker: b
    text: அல்லது, ‘இஸ்ரவேலின் படை.’ இதற்குரிய எபிரெயச் சொல் ‘முகாம்’ அல்லது இச்சூழலில் ‘படை’ என்று பொருள்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: யாவே
  rationale: திருப்பெயரின் எபிரெய வடிவமான YHWH-ஐ, ‘ஆண்டவர்’ என்ற பட்டமாக மாற்றாமல், தமிழில் பொதுவாக ஏற்ற ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: וְיִתֵּן / יִתֵּן ... בְּיַד
  choice: கையில் ஒப்புக்கொடுப்பார்
  rationale: נתן בְּיַד என்பது ஒருவரின் அதிகாரத்திற்குள் ஒப்புக்கொடுப்பதைக் குறிக்கும் எபிரெய மரபுத்தொடர். ‘கையில்’ என்ற மூலப்படிமத்தைத் தக்கவைத்தபடி பகைவரிடம் ஒப்படைக்கப்படும் பொருளை இயல்பாகத் தெரிவிக்கிறது.
- source_word: גַּם
  choice: -யும்
  rationale: இரு இடங்களிலும் கூடுதல் அல்லது சேர்க்கையைச் சுட்டும் גַּם என்பதன் வலிமையைத் தமிழின் இணைப்பும்மை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: עִמְּךָ
  choice: உன்னோடு சேர்த்து
  rationale: இஸ்ரவேலும் சவுலுடன் அதே முடிவைப் பகிரும் பொருளைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: וּבָנֶיךָ
  choice: உன் மகன்களும்
  rationale: בָּנִים இச்சூழலில் சவுலின் மகன்களைக் குறிப்பதால் பாலினத் துல்லியத்துடன் மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: עִמִּי
  choice: என்னோடு
  rationale: இறப்பு அல்லது இறந்தோர் உலகம் என்று மூலத்தில் இல்லாத விளக்கத்தை முதன்மை உரையில் சேர்க்காமல், எபிரெயின் சுருக்கத்தையும் தெளிவின்மையையும் காக்கிறது.
- source_word: מַחֲנֵה יִשְׂרָאֵל
  choice: இஸ்ரவேலின் படைமுகாம்
  rationale: מַחֲנֶה என்பதன் அடிப்படை ‘முகாம்’ பொருளையும் இங்குள்ள போர்ச் சூழலையும் ஒருங்கே வெளிப்படுத்துகிறது; ‘படை’ என்ற மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: ‘நாளை நீயும் உன் மகன்களும் என்னோடு இருப்பீர்கள்’ என்பதன் பொருள்
  choice: ‘என்னோடு’ என்று மட்டுமே மொழிபெயர்த்து, நிலை அல்லது இடத்தை வரையறுக்கவில்லை.
  alternative: ‘இறப்பில் என்னோடு’ அல்லது ‘இறந்தோர் உலகில் என்னோடு’
  rationale: சவுலும் அவன் மகன்களும் சாமுவேலோடு சேரப் போவதாக வசனம் கூறுகிறது; ஆனால் ‘என்னோடு’ என்பதற்கு அப்பால் மரணத்திற்குப் பிந்தைய நிலையை எபிரெய உரை விளக்கவில்லை. ஆகவே இறந்தோர் நிலை குறித்த ஒரு குறிப்பிட்ட கோட்பாட்டை மொழிபெயர்ப்பில் புகுத்தாமல் மூலத்தின் இறையியல் பதற்றம் காக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. எபிரெய மரபுத்தொடரின் ‘கை’ படிமம் காக்கப்பட்டாலும், ‘ஒப்புக்கொடுப்பார்’ மூலம் அதன் பொருள் இயல்பாக்கப்பட்டுள்ளது. அடிக்குறி [a] ‘என்னோடு’ என்பதற்குப் பின்னும் [b] ‘படைமுகாம்’ என்பதற்குப் பின்னும் பொருத்தமாக அமைக்கப்பட்டுள்ளன.
