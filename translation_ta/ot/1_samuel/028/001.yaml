base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/001.yaml
  text: In those days the Philistines gathered their camps for war[a], to fight against Israel. And Achish said to David, “You surely know that you and your men must go out with me in the camp.”
translation:
  language: ta
  text: அந்நாட்களில் பெலிஸ்தியர்கள் இஸ்ரவேலுக்கு எதிராகப் போரிடுவதற்காகத் தங்கள் படைகளைப்[a] போருக்கு ஒன்றுதிரட்டினார்கள். ஆகீஸ் தாவீதிடம், “நீயும் உன் ஆட்களும் என்னுடன் படையில் புறப்பட வேண்டும் என்பதை நீ நன்றாக அறிந்திருக்கிறாய்” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தங்கள் முகாம்களை.” இங்குள்ள எபிரெயச் சொல் முகாம்களையோ, விரிவான பொருளில் அங்கு முகாமிட்டிருந்த படைகளையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בַּיָּמִים הָהֵם
  choice: அந்நாட்களில்
  rationale: புதிய நிகழ்வை அறிமுகப்படுத்தும் எபிரெயக் கதைத் தொடக்கத்தை இயல்பான நவீனத் தமிழில் சுருக்கமாகக் காட்டுகிறது; மூலத்தில் இல்லாத ‘இப்போது’ போன்ற காலச் சொல்லைச் சேர்க்கவில்லை.
- source_word: וַיִּקְבְּצוּ
  choice: ஒன்றுதிரட்டினார்கள்
  rationale: கூட்டுதல் அல்லது அணிதிரட்டுதல் என்ற அடிப்படைப் பொருளையும் இங்குள்ள இராணுவச் சூழலையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: מַחֲנֵיהֶם
  choice: தங்கள் படைகளை
  rationale: מַחֲנֶה என்பதன் அடிப்படைப் பொருள் ‘முகாம்’ என்றாலும், இச்சூழலில் முகாமிட்டிருக்கும் இராணுவப் படைகளைக் குறிக்கலாம். ‘படைகள்’ என்பது சூழலுக்கு இயல்பானது; நேரடியான மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: לַצָּבָא
  choice: போருக்கு
  rationale: இராணுவ நோக்கத்தைக் குறிக்கும் சொற்றொடரைத் தெளிவாகவும் சுருக்கமாகவும் வழங்குகிறது.
- source_word: לְהִלָּחֵם בְּיִשְׂרָאֵל
  choice: இஸ்ரவேலுக்கு எதிராகப் போரிடுவதற்காக
  rationale: இஸ்ரவேலுக்கு விரோதமாகப் போர் செய்யும் நோக்கத்தைத் தெளிவாகக் காட்டுகிறது.
- source_word: יָדֹעַ תֵּדַע
  choice: நன்றாகத் தெரியும்
  rationale: வினையெச்ச முழுவடிவமும் finite verb-உம் சேர்ந்த எபிரெய வலியுறுத்தலை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: אִתִּי תֵּצֵא
  choice: என்னுடன் … புறப்பட வேண்டும்
  rationale: சொல்லுக்கு சொல் எதிர்காலத்தைவிட, ஆகீஸ் வலியுறுத்தும் எதிர்பார்ப்பு அல்லது கடமையை ‘வேண்டும்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: בַּמַּחֲנֶה
  choice: படையில்
  rationale: ‘முகாமில்’ என்பது நேரடியான பொருள்; இங்கு போருக்குப் புறப்படும் இராணுவ அணியில் சேர்ந்து செல்வதைக் குறிப்பதால் ‘படையில்’ சூழலுக்கு தெளிவானது.
- source_word: אַתָּה וַאֲנָשֶׁיךָ
  choice: நீயும் உன் ஆட்களும்
  rationale: தாவீதையும் அவனுடன் இருந்தவர்களையும் தனித்தனியாக வலியுறுத்தும் மூல அமைப்பைப் பாதுகாக்கிறது.
- source_word: אָכִישׁ
  choice: ஆகீஸ்
  rationale: எபிரெயப் பெயரின் ஒலியைத் தமிழில் வழக்கமான வேதாகமப் பெயர்ப்பெயர்ப்பு முறையில் வழங்குகிறது.
