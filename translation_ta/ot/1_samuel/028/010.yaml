source:
  edition: WLC
  text: וַ/יִּשָּׁ֤בַֽע לָ/הּ֙ שָׁא֔וּל בַּֽ/יהוָ֖ה לֵ/אמֹ֑ר חַי יְהוָ֕ה אִֽם יִקְּרֵ֥/ךְ עָוֺ֖ן בַּ/דָּבָ֥ר הַ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/010.yaml
  text: So Saul swore to her by Yahweh[a], saying, “As Yahweh lives, no punishment will come upon you in this matter.”
translation:
  language: ta
  text: அப்போது சவுல் அவளிடம் யாவேயின் பெயரால் ஆணையிட்டு, “யாவே உயிரோடிருக்கிறபடியே, இந்தக் காரியத்தில் உனக்கு எந்தத் தண்டனையும் நேரிடாது[a]” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இந்தக் காரியத்தில் எந்தக் குற்றப்பழியும் உனக்கு நேரிடாது.” எபிரெயச் சொல் ‘அக்கிரமம்,’ ‘குற்றப்பழி,’ அல்லது குற்றத்தால் வரும் ‘தண்டனை’ ஆகியவற்றைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׁבַע
  choice: ஆணையிட்டு
  rationale: נשבע என்பதன் நிபால் வடிவம் ‘ஆணையிடுதல்’ எனப் பொருள்படும்; தமிழில் உறுதிமொழியின் கடுமையையும் இயல்பான நடையையும் இது காக்கிறது.
- source_word: לָהּ
  choice: அவளிடம்
  rationale: பெண்பால் ஒருமை மறைமுகச் செயப்படுபொருளை இயல்பான நவீனத் தமிழில் காட்டுகிறது.
- source_word: בַּיהוָה
  choice: யாவேயின் பெயரால்
  rationale: בְּ என்பது இங்கு ஆணையில் அழைக்கப்படும் ஆதாரத்தைக் குறிக்கிறது; ‘பெயரால்’ என்பது தமிழில் ‘யாவேயைச் சாட்சியாக வைத்து’ என்ற பொருளை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: חַי יְהוָה
  choice: யாவே உயிரோடிருப்பது உறுதிபோல
  rationale: இது வழக்கமான எபிரெய ஆணைச் சூத்திரம்; சொற்சார்ந்த பொருளையும் ஆணையின் உறுதியையும் தமிழில் தெளிவாகத் தருகிறது.
- source_word: אִם
  choice: எந்த… நேரிடாது
  rationale: ஆணைச் சூழலில் אִם விடுபட்ட சாபவாக்கியத்தைத் தொடங்கி வலுவான மறுப்பாகச் செயல்படுகிறது; தமிழில் நேரடி மறுப்பு அதன் நடைமுறைப் பொருளைக் காட்டுகிறது.
- source_word: יִקְּרֵךְ
  choice: உனக்கு நேரிடாது
  rationale: קרה இங்கு ஒருவருக்கு ஏதாவது நிகழ்தல் அல்லது நேரிடுதல் என்ற பொருளில் உள்ளது.
- source_word: עָוֺן
  choice: தண்டனை
  rationale: עָוֺן என்பது அக்கிரமம், குற்றப்பழி, அல்லது அதன் விளைவான தண்டனை ஆகியவற்றைக் குறிக்கலாம்; சவுல் அந்தப் பெண்ணுக்கு பாதிப்பு ஏற்படாது என்று உறுதியளிக்கும் சூழலில் ‘தண்டனை’ உடனடிப் பொருளைத் தருகிறது, மாற்றுப் பொருள் அடிக்குறிப்பில் காக்கப்படுகிறது.
- source_word: בַּדָּבָר הַזֶּה
  choice: இந்தக் காரியத்திற்காக
  rationale: பேசப்பட்டுவரும் செயலைக் குறிக்கும் இயல்பான நவீனத் தமிழ்; காரணத்தொடர்பையும் சூழலுக்கேற்றவாறு வெளிப்படுத்துகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைபெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலத்தில் நான்கெழுத்து இறைபெயர் நேரடியாக வருகிறது; அதனை பொதுப்பட்டமாக மாற்றாமல் தமிழில் ஒலிபெயர்ப்பது தனிப்பட்ட உடன்படிக்கைப் பெயரைப் பாதுகாக்கிறது.
- issue: சவுலின் ஆணையில் עָוֺן என்பதன் பொருள்
  choice: தண்டனை
  alternative: குற்றப்பழி; அக்கிரமம்
  rationale: அந்தச் செயல் தன்னிலேயே ஒழுக்கரீதியாகக் குற்றமற்றது என்று சவுல் அறிவிப்பதல்ல; அதற்காக அவள்மீது தண்டனை வராது என்று உறுதியளிப்பதே சூழலின் முதன்மை வலியுறுத்தல். இருப்பினும் எபிரெயச் சொல்லின் உண்மையான பல்பொருள்தன்மை அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான உரைநடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய ஆணைச் சூத்திரத்தின் வலிமை காக்கப்பட்டு, עָוֺן என்பதன் பொருள் விரிவு அடிக்குறிப்பில் வெளிப்படுத்தப்பட்டுள்ளது.
