revisions:
- from: அப்போது சவுல் அவளிடம் யாவேயின் பெயரால் ஆணையிட்டு, “யாவே உயிரோடிருப்பது உறுதிபோல, இந்தக் காரியத்திற்காக எந்தத் தண்டனையும் உனக்கு நேரிடாது[a]” என்றான்.
