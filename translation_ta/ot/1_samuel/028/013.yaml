  text: וַ/יֹּ֨אמֶר לָ֥/הּ הַ/מֶּ֛לֶךְ אַל תִּֽירְאִ֖י כִּ֣י מָ֣ה רָאִ֑ית וַ/תֹּ֤אמֶר הָֽ/אִשָּׁה֙ אֶל שָׁא֔וּל אֱלֹהִ֥ים רָאִ֖יתִי עֹלִ֥ים מִן הָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/013.yaml
  text: The king said to her[a], “Do not be afraid. What do you see?” And the woman said to Saul[b], “I see a divine being coming up from the earth.”
translation:
  language: ta
  text: அரசன் அவளிடம், “பயப்படாதே. நீ என்ன பார்க்கிறாய்?[a]” என்றான். அந்தப் பெண் சவுலிடம், “தெய்வீக இருப்பு ஒன்று[b] பூமியிலிருந்து மேலே எழுந்துவருவதை நான் பார்க்கிறேன்” என்றாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரெயில் சொல்லுக்கு சொல்: “நீ என்ன கண்டாய்?” வினைச்சொல் வடிவில் இறந்த/நிறைவுற்ற செயலைக் குறித்தாலும், இங்கு உடனடியாகக் காணும் காட்சியைக் குறிக்கலாம்.'
    reason: lexical_alternative
  - marker: b
    text: אֱלֹהִים என்ற எபிரெயச் சொல்லும் அதனுடன் வரும் “எழுந்துவரும்” என்ற பெயரெச்சமும் பன்மை வடிவில் உள்ளன; ஆகவே, “தெய்வங்கள் எழுந்துவருவதை” என்றும் மொழிபெயர்க்கலாம். பின்னர் வரும் வசனங்களில் ஒரே உருவம் விவரிக்கப்படுகிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: הַמֶּלֶךְ
  choice: அரசன்
  rationale: எபிரெய உரையில் பெயர்ச்சொல் சுட்டுப்பெயருடன் வருகிறது; இவ்வசனத்தின் பின்னரே சவுலின் பெயர் வருவதால், கதைநடையைப் பேண ‘அரசன்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: אַל תִּירְאִי
  choice: பயப்படாதே
  rationale: இது பெண்ணை நோக்கிய எதிர்மறைக் கட்டளை; நவீனத் தமிழில் இயல்பாகவும் மூலத்திற்கு நெருக்கமாகவும் உள்ளது.
- source_word: כִּי מָה רָאִית
  choice: நீ என்ன பார்க்கிறாய்?
  rationale: רָאִית என்பது வடிவில் நிறைவினை என்றாலும், உடனடியாக நிகழும் காட்சியை விசாரிக்கும் சூழலில் தமிழ் நிகழ்காலம் இயல்பானது. இறந்தகாலச் சாத்தியம் அடிக்குறிப்பில் பேணப்படுகிறது.
- source_word: הָאִשָּׁה
  choice: அந்தப் பெண்
  rationale: இங்கு எபிரெய உரை அவளை விளக்கப் பெயரால் அல்ல, ‘அந்தப் பெண்’ என்றே குறிப்பிடுகிறது; சூழலிலிருந்து கூடுதல் அடையாளத்தை வசனத்துக்குள் இறக்குமதி செய்யவில்லை.
- source_word: אֱלֹהִים
  choice: தெய்வீக உருவம் ஒன்று
  rationale: இந்தச் சூழலில் காணப்படும் அமானுஷ்ய இருப்பைக் குறிக்க இயல்பான தமிழில் இவ்வாறு தரப்பட்டுள்ளது. மூலச்சொல்லின் பன்மை வடிவத்தையும் அதனுடன் வரும் பன்மைப் பெயரெச்சத்தையும் அடிக்குறிப்பு வெளிப்படையாகப் பேணுகிறது.
- source_word: עֹלִים
  choice: மேலே எழுந்துவருவதை
  rationale: עלה மேல்நோக்கிய இயக்கத்தைக் குறிக்கிறது; பூமியிலிருந்து தோன்றிவரும் காட்சியைத் தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: מִן הָאָרֶץ
  choice: பூமியிலிருந்து
  rationale: மூலத்தின் பொதுவான ‘பூமி/நிலம்’ என்ற சொல்லையும் கீழிருந்து மேலே வரும் காட்சியையும் பேணுகிறது.
theological_decisions:
- issue: அந்தப் பெண்ணின் கூற்றிலுள்ள אֱלֹהִים என்பதன் பொருள்
  choice: தெய்வீக உருவம் ஒன்று
  alternative: தெய்வங்கள்; கடவுள்
  rationale: இது அந்தப் பெண் கண்டதாகச் சொல்லும் காட்சியே அன்றி, உரையாசிரியர் உறுதிப்படுத்தும் கோட்பாட்டுக் கூற்று அல்ல. முதன்மை உரை ஒரே அமானுஷ்ய உருவத்தைச் சூழலுக்கு ஏற்ப காட்டுகிறது; அதே நேரத்தில் எபிரெயச் சொல்லும் அதனுடன் வரும் עֹלִים என்பதும் பன்மை வடிவில் இருப்பதை அடிக்குறிப்பு மறைக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தில் இல்லாத ‘குறிசொல்பவள்’ போன்ற விளக்கப் பெயர் சேர்க்கப்படவில்லை; אֱלֹהִים மற்றும் עֹלִים ஆகியவற்றின் இலக்கணப் பன்மை அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
