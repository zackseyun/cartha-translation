source:
  edition: WLC
  text: וַ/תֵּ֤רֶא הָֽ/אִשָּׁה֙ אֶת שְׁמוּאֵ֔ל וַ/תִּזְעַ֖ק בְּ/ק֣וֹל גָּד֑וֹל וַ/תֹּאמֶר֩ הָ/אִשָּׁ֨ה אֶל שָׁא֧וּל לֵ/אמֹ֛ר לָ֥/מָּה רִמִּיתָ֖/נִי וְ/אַתָּ֥ה שָׁאֽוּל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/012.yaml
  text: When the woman saw Samuel[a], she cried out with a loud voice, and the woman said to Saul, “Why have you deceived me? You are Saul!”
translation:
  language: ta
  text: அந்தப் பெண் சாமுவேலைக் கண்டபோது[a], உரத்த குரலில் அலறினாள். பின்பு அந்தப் பெண் சவுலிடம், “நீர் ஏன் என்னை ஏமாற்றினீர்? நீர்தான் சவுல்!” என்றாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சாமுவேல் போலத் தோன்றியதை.” எபிரெய உரை அதன் இயல்பை விளக்காமல், ‘சாமுவேல்’ என்று மட்டுமே கூறுகிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: וַתֵּרֶא
  choice: கண்டபோது
  rationale: ראה என்பதன் இயல்பான பொருள் ‘காணுதல்.’ தொடர்ச்சியான எபிரெயக் கதைநடையைத் தமிழில் இயல்பாக இணைக்க, காலத் தொடர்பைக் காட்டும் ‘கண்டபோது’ பயன்படுத்தப்பட்டது.
- source_word: הָאִשָּׁה
  choice: அந்தப் பெண்
  rationale: எபிரெயத்தில் இங்கு சாதாரணமாக ‘பெண்’ என்றே உள்ளது. சூழலில் அவர் ஆவிகளோடு தொடர்புகொள்பவர் என்றாலும், அந்தப் பணிப்பெயரை வசனத்திற்குள் சேர்க்காமல் மூலத்தின் சொல்லாட்சியே பாதுகாக்கப்பட்டது.
- source_word: אֶת שְׁמוּאֵל
  choice: சாமுவேலை
  rationale: மூல உரை அவள் கண்டவரை நேரடியாக ‘சாமுவேல்’ என்று குறிப்பிடுகிறது. தோற்றம் அல்லது ஆவி என விளக்கிச் சேர்க்காமல் அதே நேரடியான குறிப்பைத் தக்கவைக்கிறது.
- source_word: וַתִּזְעַק
  choice: அலறினாள்
  rationale: זעק வலிமையான, திடீர் கூக்குரலைக் குறிக்கிறது. ‘அலறினாள்’ என்பது இங்குள்ள அதிர்ச்சியையும் தீவிரத்தையும் இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: בְּקוֹל גָּדוֹל
  choice: உரத்த குரலில்
  rationale: சொற்றொடரின் தீவிரத்தைத் தெளிவாகவும் தமிழில் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: וַתֹּאמֶר ... לֵאמֹר
  choice: என்றாள்
  rationale: எபிரெயத்தின் ‘சொன்னாள்—சொல்லி’ அமைப்பைத் தமிழில் செயற்கையாக இரட்டிக்காமல் இயல்பான நேரடி உரை முடிவாக வழங்குகிறது.
- source_word: לָמָּה
  choice: ஏன்
  rationale: காரணம் கேட்கும் வழக்கமான வினாச்சொல்லுக்கு நேரான, இயல்பான தமிழ் இணை.
- source_word: רִמִּיתָנִי
  choice: என்னை ஏமாற்றினீர்
  rationale: פיעל வடிவிலுள்ள רמה ஏமாற்றுதல் அல்லது வஞ்சித்தலைக் குறிக்கிறது. உடனே வெளிப்பட்ட சவுலின் மறைமுகச் செயலை ‘ஏமாற்றினீர்’ தெளிவாக எடுத்துரைக்கிறது.
- source_word: וְאַתָּה שָׁאוּל
  choice: நீர்தான் சவுல்!
  rationale: தனிப்பெயர்ச்சொல்லின் வலியுறுத்தலை ‘தான்’ வெளிப்படுத்துகிறது. சவுலிடம் நேரடியாகப் பேசுவதால் மரியாதை ஒருமை ‘நீர்’ பயன்படுத்தப்பட்டது; வியப்புக்குறி உரையின் தீவிரத்தைப் பாதுகாக்கிறது.
theological_decisions:
- issue: ‘சாமுவேல்’ என்பதைத் தோற்றம், ஆவி, அல்லது சாமுவேல் போலத் தோன்றியது என்று முதன்மை உரையில் தகுதிப்படுத்த வேண்டுமா?
  choice: மூலத்தின் நேரடியான ‘சாமுவேல்’ என்ற சொல்லைத் தக்கவைத்தல்
  alternative: ‘சாமுவேல் போலத் தோன்றிய உருவம்’ அல்லது ‘சாமுவேலின் ஆவி’
  rationale: எபிரெயக் கதை அந்தப் பெண் சாமுவேலைக் கண்டதாகவே கூறுகிறது; நிகழ்வின் இயல்பை இந்த வசனம் விளக்கவில்லை. முதன்மை உரையில் விளக்கச் சொல் சேர்ப்பது சர்ச்சைக்குரிய இறையியல் முடிவை மொழிபெயர்ப்புக்குள் கொண்டுவரும். மாற்றுப் புரிதல் அடிக்குறிப்பில் மட்டும் சுட்டப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான கதைநடை பயன்படுத்தப்பட்டது. சவுலிடம் பேசும் நேரடி உரையில் மரியாதை ஒருமையான ‘நீர்/ஏமாற்றினீர்’ அமைப்பு கடைப்பிடிக்கப்பட்டது. ‘உரத்த குரலில் அலறினாள்’ என்பது மூலத்தின் வினைச்சொல்லையும் தீவிரப்படுத்தும் சொற்றொடரையும் தனித்தனியாகப் பாதுகாக்கிறது.
