revisions:
- from: ஆனால் அந்தப் பெண் அவனிடம், “இதோ, சவுல் செய்தது என்னவென்று உமக்கே தெரியும். ஆவிகளை அழைத்துக் குறிசொல்பவர்களையும் ஆவிகளிடம் விசாரிப்பவர்களையும் அவர் நாட்டிலிருந்து ஒழித்துவிட்டார்.[a] அப்படியிருக்க, என்னைக் கொல்லும்படி ஏன் என் உயிருக்கு வலை விரிக்கிறீர்?” என்றாள்.
