source:
  edition: WLC
  text: וַ/תֹּ֨אמֶר הָֽ/אִשָּׁ֜ה אֵלָ֗י/ו הִנֵּ֨ה אַתָּ֤ה יָדַ֨עְתָּ֙ אֵ֣ת אֲשֶׁר עָשָׂ֣ה שָׁא֔וּל אֲשֶׁ֥ר הִכְרִ֛ית אֶת הָ/אֹב֥וֹת וְ/אֶת הַ/יִּדְּעֹנִ֖י מִן הָ/אָ֑רֶץ וְ/לָ/מָ֥ה אַתָּ֛ה מִתְנַקֵּ֥שׁ בְּ/נַפְשִׁ֖/י לַ/הֲמִיתֵֽ/נִי־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/009.yaml
  text: But the woman said to him[a], “Look, you yourself know what Saul has done, that he has cut off the mediums and the spiritists from the land. So why are you laying a snare for my life, to put me to death?”
translation:
  language: ta
  text: ஆனால் அந்தப் பெண் அவனிடம், “இதோ, சவுல் ஆவிகளுடன் தொடர்புகொள்பவர்களையும் மறைஞானிகளையும் நாட்டிலிருந்து ஒழித்துவிட்டதை உமக்கே தெரியும். அப்படியிருக்க, என்னைக் கொல்லும்படி ஏன் என் உயிருக்கு வலை விரிக்கிறீர்?” என்றாள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: ஆனால் ... என்றாள்
  rationale: தொடர்ச்சியைச் சுட்டும் வாவ் இங்கு முந்தைய கோரிக்கைக்கு அந்தப் பெண் எச்சரிக்கையுடனும் எதிர்ப்புடனும் பதிலளிப்பதைக் காட்டுவதால், சூழலுக்கேற்றவாறு ‘ஆனால்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: הִנֵּה
  choice: இதோ
  rationale: கவனத்தை வலியுறுத்தும் உரையாடல் குறியீட்டை இயல்பான, கண்ணியமான நவீனத் தமிழில் எடுத்துரைக்கிறது.
- source_word: אַתָּה יָדַעְתָּ
  choice: உமக்கே தெரியும்
  rationale: வினைச்சொல்லுடன் வெளிப்படையாக வரும் இரண்டாம் நபர் பதிலிப்பெயரின் அழுத்தத்தை ‘-ஏ’ விகுதி வெளிப்படுத்துகிறது; பெண் அறியாத ஒருவரிடம் மரியாதையாகப் பேசும் சூழலுக்கு ‘உமக்கு’ பொருந்துகிறது.
- source_word: הִכְרִית
  choice: ஒழித்துவிட்டார்
  rationale: நாட்டிலிருந்து முழுமையாக அகற்றுதல் அல்லது இல்லாமல் செய்தல் என்ற இச்சூழலின் கடுமையான பொருளை இயல்பாகத் தருகிறது; தனிநபர்கள் அனைவரும் கொல்லப்பட்டனர் என்று தேவையின்றி முடிவுசெய்யவில்லை.
- source_word: הָאֹבוֹת
  choice: ஆவிகளை அழைத்துக் குறிசொல்பவர்கள்
  rationale: אוֹב என்பதன் துல்லியமான தன்மை விவாதத்துக்குரியதாயினும், இச்சூழலில் ஆவிகளை அணுகிக் குறிசொல்லும் நடைமுறையாளர்களைக் குறிக்கிறது. மொழிபெயர்ப்பு பின்னாளைய நாட்டுப்புறக் கற்பனைகளைச் சேர்க்காமல் செயல்பாட்டைத் தெளிவாக்குகிறது.
- source_word: הַיִּדְּעֹנִי
  choice: ஆவிகளிடம் விசாரிப்பவர்கள்
  rationale: மறைவான அறிவைப் பெற ஆவிகளிடம் விசாரிப்பவர்களைக் குறிக்கும் சொல்லாகச் சூழலுக்கு ஏற்றது; எபிரெயச் சொல்லின் ஒருமை வடிவம் இங்கு ஒரு வகுப்பினரைக் கூட்டாகக் குறிப்பதால் தமிழில் பன்மை பயன்படுத்தப்பட்டது.
- source_word: מִן הָאָרֶץ
  choice: நாட்டிலிருந்து
  rationale: இங்கு உலகம் முழுவதையும் அல்ல, சவுலின் ஆட்சிக்குட்பட்ட நாட்டைக் குறிக்கிறது.
- source_word: מִתְנַקֵּשׁ בְּנַפְשִׁי
  choice: என் உயிருக்கு வலை விரிக்கிறீர்
  rationale: சிக்கவைக்க அல்லது கண்ணி வைக்க முயல்வது என்ற எபிரெய உருவகத்தையும், தனது உயிரே குறிவைக்கப்படுகிறது என்ற பெண்ணின் அச்சத்தையும் பாதுகாக்கிறது.
- source_word: לַהֲמִיתֵנִי
  choice: என்னைக் கொல்லும்படி
  rationale: வலையை விரிப்பதன் நோக்கம் தன்னை மரணத்துக்குள்ளாக்குவதே என்று பெண் கூறுவதை நேரடியாகக் காட்டுகிறது.
theological_decisions:
- issue: மறைமாந்திரிக நடைமுறையாளர்களைக் குறிக்கும் אוֹב மற்றும் יִדְּעֹנִי ஆகிய சொற்களை மொழிபெயர்த்தல்
  choice: ஆவிகளை அழைத்துக் குறிசொல்பவர்கள்; ஆவிகளிடம் விசாரிப்பவர்கள்
  alternative: இறந்தோரிடம் குறிகேட்பவர்கள்; மறைஞானிகள்
  rationale: தேர்ந்தெடுக்கப்பட்ட சொற்கள் தடைசெய்யப்பட்ட நடைமுறையாளர்களின் அடிப்படைச் செயல்களை நவீன வாசகருக்குத் தெளிவாகக் காட்டுகின்றன. அவர்கள் அணுகிய ஆவிகளின் இயல்பு அல்லது அந்த நடைமுறைகள் உண்மையில் எவ்வாறு செயல்பட்டன என்பது குறித்து வசனம் தீர்மானிக்காத இறையியல் கேள்விகளுக்குப் பதிலை மொழிபெயர்ப்பு திணிக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான உரைநடை பயன்படுத்தப்பட்டுள்ளது. வேடமிட்ட சவுலை அடையாளம் அறியாத பெண் அவரிடம் பேசுவதால் ‘உமக்கு/விரிக்கிறீர்’ என்ற மரியாதை ஒருமை வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன. எபிரெய உருவகமான ‘வலை விரித்தல்’ பாதுகாக்கப்பட்டுள்ளது.
