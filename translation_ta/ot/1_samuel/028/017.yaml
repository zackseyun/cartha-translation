  text: וַ/יַּ֤עַשׂ יְהוָה֙ ל֔/וֹ כַּ/אֲשֶׁ֖ר דִּבֶּ֣ר בְּ/יָדִ֑/י וַ/יִּקְרַ֨ע יְהוָ֤ה אֶת הַ/מַּמְלָכָה֙ מִ/יָּדֶ֔/ךָ וַֽ/יִּתְּנָ֖/הּ לְ/רֵעֲ/ךָ֥ לְ/דָוִֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/017.yaml
  text: 'And Yahweh has done for you just as he spoke by my hand: Yahweh has torn the kingdom out of your hand and given it to your neighbor[b][a], to David.'
translation:
  language: ta
  text: 'யாவே தமக்காகச் செய்திருக்கிறார்[a]—அவர் என் மூலமாகச் சொன்னபடியே[b]: யாவே உன் கையிலிருந்து அரசாட்சியைப் பறித்தெடுத்து, அதை உன் அயலான தாவீதுக்குக் கொடுத்திருக்கிறார்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரெயம்: “அவருக்காக/தமக்காகச் செய்திருக்கிறார்.” சூழலின் அடிப்படையில் பல மொழிபெயர்ப்புகள் இதை “உனக்குச் செய்திருக்கிறார்” அல்லது “உனக்கு நேரிடச் செய்திருக்கிறார்” என்று வழங்குகின்றன; ஆனால் மசோரா உரையில் “அவருக்காக/தமக்காக” என்றே உள்ளது.'
    reason: alternative_reading
  - marker: b
    text: அல்லது, “என் கையால் சொன்னபடியே.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: யெகோவா
  rationale: இறைப் பெயரான YHWH-ஐ தமிழில் அறியப்பட்ட தனிப்பெயர் வடிவில் வழங்குகிறது; பொதுப்பட்டமான ‘கர்த்தர்’ என்று மாற்றவில்லை.
- source_word: וַיַּעַשׂ ... לוֹ
  choice: தமக்காகச் செய்திருக்கிறார்
  rationale: மசோரா உரையின் לוֹ (‘அவருக்காக/தமக்காக’) என்பதைக் சூழலுக்கேற்ப ‘உனக்குச் செய்தார்’ எனத் திருத்தாமல் நேரடியாகப் பாதுகாக்கிறது. தமிழில் இறைவனைச் சுட்டும் மரியாதைத் தற்சுட்டுப் பெயராக ‘தமக்காக’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: כַּאֲשֶׁר דִּבֶּר בְּיָדִי
  choice: அவர் என் மூலமாகச் சொன்னபடியே
  rationale: בְּיַדִי என்ற எபிரெய வழக்கின் கருவி/இடைநிலைப் பொருளை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: וַיִּקְרַע
  choice: பறித்தெடுத்து
  rationale: கிழித்தல்/பிய்த்தல் என்ற வலிமையான உருவகத்தையும், சவுலின் கட்டுப்பாட்டிலிருந்து அரசாட்சி அகற்றப்பட்டதையும் ஒருங்கே தெரிவிக்கிறது.
- source_word: הַמַּמְלָכָה
  choice: அரசாட்சி
  rationale: இங்கு நாட்டின் நிலப்பரப்பைவிட சவுலின் அரசுரிமையும் ஆட்சியுமே மையம் என்பதால் ‘அரசாட்சி’ பொருத்தமானது.
- source_word: מִיָּדֶךָ
  choice: உன் கையிலிருந்து
  rationale: உடைமை மற்றும் கட்டுப்பாட்டைக் குறிக்கும் எபிரெய உருவகத்தைத் தமிழிலும் பாதுகாக்கிறது.
- source_word: וַיִּתְּנָהּ
  choice: அதைக் ... கொடுத்திருக்கிறார்
  rationale: பெண்பால் ஒருமை பின்னொட்டு ‘அரசாட்சி’யைக் குறிக்கிறது; தமிழில் ‘அதை’ என்று தெளிவாக வழங்கப்பட்டுள்ளது.
- source_word: לְרֵעֲךָ
  choice: உனக்கு அடுத்தவனான
  rationale: רֵעַ என்பதன் நண்பன்/தோழன்/அடுத்தவன் என்ற பொருள் வரம்பை, தாவீதுடனான உறவைத் தேவையின்றி ‘நண்பன்’ எனக் குறுக்காமல் வெளிப்படுத்துகிறது.
- source_word: לְדָוִד
  choice: தாவீதுக்கு
  rationale: தனிப்பெயர் தமிழின் வழக்கமான வேதாகம வடிவில் தரப்பட்டுள்ளது.
theological_decisions:
- issue: முதல் கூறிலுள்ள மசோரா உரை לוֹ
  choice: ‘தமக்காகச் செய்திருக்கிறார்’ என்று மசோரா உரையை அப்படியே பிரதிபலித்தல்
  alternative: ‘உனக்குச் செய்திருக்கிறார்’ அல்லது ‘உனக்கு நேரிடச் செய்திருக்கிறார்’
  rationale: கொடுக்கப்பட்ட எபிரெய உரை இரண்டாம் நபர் לְךָ அல்ல, மூன்றாம் நபர் לוֹ ஆகும். சூழலில் சவுலைக் குறிக்கும் வாசிப்பு எளிதாக இருந்தாலும், உண்மையான உரைச் சிக்கலை மொழிபெயர்ப்பில் மறைக்காமல் அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான நடை. மூலத்தின் ‘தமக்காக’ என்ற திட்டமிட்ட சிக்கல் பாதுகாக்கப்பட்டுள்ளது; ‘என் கையால்’ என்ற சொற்சொல் வழக்கிற்குப் பதிலாக பொதுவாசகருக்கு தெளிவான ‘என் மூலமாக’ பயன்படுத்தப்பட்டுள்ளது.
