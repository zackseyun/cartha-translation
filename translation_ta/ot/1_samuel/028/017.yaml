- from: 'யெகோவா தமக்காகச் செய்திருக்கிறார்[a], அவர் என் மூலமாகச் சொன்னபடியே: யெகோவா உன் கையிலிருந்து அரசாட்சியைப் பறித்தெடுத்து, அதை உனக்கு அடுத்தவனான தாவீதுக்குக் கொடுத்திருக்கிறார்.'
  to: 'யாவே தமக்காகச் செய்திருக்கிறார்[a]—அவர் என் மூலமாகச் சொன்னபடியே[b]: யாவே உன் கையிலிருந்து அரசாட்சியைப் பறித்தெடுத்து, அதை உன் அயலான தாவீதுக்குக் கொடுத்திருக்கிறார்.'
