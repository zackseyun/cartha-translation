base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/015.yaml
  text: Then Samuel said to Saul[a], “Why have you disturbed me by bringing me up?” Saul answered, “I am in great distress. The Philistines are fighting against me, and God has turned away from me and no longer answers me, either by prophets or by dreams[b]. So I have called you to tell me what I should do.”
translation:
  language: ta
  text: அப்போது சாமுவேல் சவுலிடம், “என்னை மேலே வரவழைத்து ஏன் என்னைத் தொந்தரவு செய்தாய்?[a]” என்று கேட்டார். அதற்குச் சவுல், “நான் மிகுந்த நெருக்கடியில் இருக்கிறேன். பெலிஸ்தியர்கள் எனக்கு எதிராகப் போரிடுகிறார்கள். கடவுள் என்னைவிட்டு விலகிவிட்டார்; தீர்க்கதரிசிகள் மூலமாகவோ கனவுகள் மூலமாகவோ[b] அவர் இனி எனக்குப் பதிலளிப்பதில்லை. ஆகவே, நான் என்ன செய்ய வேண்டும் என்பதை எனக்குத் தெரிவிக்க உம்மை அழைத்தேன்” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என்னை மேலே வரவழைத்து ஏன் என்னைக் கலங்கச் செய்தாய்?”
    reason: הִרְגַּזְתַּנִי என்பதற்கு தொந்தரவு செய்தல், கலங்கச் செய்தல் ஆகிய நெருங்கிய பொருள்கள் உள்ளன.
  - marker: b
    text: எபிரெயத்தில், “தீர்க்கதரிசிகளின் கையால்”; இங்கு இதன் பொருள் “தீர்க்கதரிசிகள் மூலமாக.”
    reason: மூலத்தின் முகவர் வழியைக் குறிக்கும் சொல்லாட்சியை விளக்குகிறது.
lexical_decisions:
- source_word: הִרְגַּזְתַּנִי
  choice: எனக்குக் கலக்கமூட்டினாய்
  rationale: רגז என்பதன் காரணவினை வடிவம் அமைதியைக் குலைத்தல், கலக்கமூட்டுதல் என்ற பொருளைத் தருகிறது. இச்சொல் மூலத்தின் உணர்வை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: לְהַעֲלוֹת אֹתִי
  choice: என்னை மேலே வரவழைத்து
  rationale: עלה என்பதிலுள்ள ‘மேலே’ என்ற இடவியல் உருவகத்தைத் தக்கவைக்கிறது; உயிர்த்தெழுதல் என்ற கருத்தைத் தேவையின்றி இறக்குமதி செய்யாமல், அழைப்பித்தலை இயல்பாகக் கூறுகிறது.
- source_word: צַר לִי מְאֹד
  choice: நான் மிகுந்த நெருக்கடியில் இருக்கிறேன்
  rationale: சவுலின் கடுமையான துயரமும் அழுத்தமுமான நிலையைத் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: נִלְחָמִים בִּי
  choice: எனக்கு எதிராகப் போரிடுகிறார்கள்
  rationale: לחם உடன் வரும் முன்னிடைச்சொல் சவுலை நோக்கிய பகைமையான போர் நடவடிக்கையைக் குறிக்கிறது.
- source_word: וֵאלֹהִים סָר מֵעָלַי
  choice: கடவுள் என்னைவிட்டு விலகிவிட்டார்
  rationale: סור מעל குறிக்கும் விலகுதலை நேரடியாகத் தருகிறது; வசனம் கூறுவதைத் தாண்டி கடவுளின் இருப்பைப் பற்றிய முடிவைச் சேர்ப்பதில்லை.
- source_word: וְלֹא עָנָנִי עוֹד
  choice: அவர் இனி எனக்குப் பதிலளிப்பதில்லை
  rationale: עוד இங்கு முன்பு இருந்த பதில் இனி இல்லை என்ற தொடர்நிறுத்தத்தைக் குறிக்கிறது.
- source_word: גַּם בְּיַד הַנְּבִיאִם גַּם בַּחֲלֹמוֹת
  choice: தீர்க்கதரிசிகள் மூலமாகவோ கனவுகள் மூலமாகவோ
  rationale: ביד என்பதன் ‘மூலமாக’ என்ற முகவர் வழிப் பொருளையும் גם ... גם இணைப்பின் இரு வழிகளையும் இயல்பான தமிழில் தருகிறது.
- source_word: וָאֶקְרָאֶה לְךָ
  choice: உம்மை அழைத்தேன்
  rationale: קרא ל என்பதன் அழைத்தல் அல்லது வரவழைத்தல் என்ற பொருளைத் தருகிறது; மூலத்தில் இல்லாத மறைமந்திரத் தொழில்நுட்பச் சொல்லைச் சேர்ப்பதில்லை.
- source_word: לְהוֹדִיעֵנִי מָה אֶעֱשֶׂה
  choice: நான் என்ன செய்ய வேண்டும் என்பதை எனக்குத் தெரிவிக்க
  rationale: ஹிப்ஃபில் வடிவிலுள்ள ‘அறியச்செய்’ என்ற பொருளையும் வழிகாட்டுதல் கோரும் கேள்வியையும் தெளிவாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: மாந்திரீக விசாரணை நிகழ்வில் பேசுபவரின் அடையாளம்
  choice: விவரிப்பு கூறுவதுபோல சாமுவேலே சவுலிடம் பேசுகிறார் என்று நேரடியாக மொழிபெயர்த்தல்
  alternative: அவர் சாமுவேலின் தோற்றம், வேறொரு ஆவி, அல்லது அந்தப் பெண்ணின் காட்சி என்று விளக்கக் குறிச்சொற்களைச் சேர்த்தல்
  rationale: எபிரெய உரை நேரடியாக ‘சாமுவேல் சவுலிடம் சொன்னார்’ என்கிறது. இந்த வசனத்தின் மொழிபெயர்ப்பு அந்த விவரிப்பைப் பிரதிபலிக்க வேண்டும்; நிகழ்வின் இயல்பைப் பற்றிய விரிவான இறையியல் விவாதத்தைத் தீர்மானிக்கக் கூடாது.
translation_notes:
  register: நவீன நிலையான தமிழ்; மரியாதையும் கண்ணியமும் உடைய, பொதுவாசகர்களுக்குப் புரியும் நடை. சவுல் சாமுவேலை நோக்கிப் பேசுவதில் ‘உம்மை’ பயன்படுத்தப்பட்டு, விவரிப்பில் இயல்பான வாக்கிய ஓட்டம் பேணப்பட்டுள்ளது. எல்லா அடிக்குறிப்பு குறிகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
