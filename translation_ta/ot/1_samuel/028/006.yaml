    rationale: וְלֹא עָנָהוּ என்ற ஒரே மறுப்புவினை கனவுகள், ஊரீம், இறைவாக்கினர்கள் என்ற மூன்று வழிமுறைகளையும் ஆள்கிறது. தமிழிலும் அந்த மறுப்பை இறுதியில் ஒருமுறை வைப்பது மூலத்தின் தொடரமைப்பையும் இயல்பான நடையையும் காக்கிறது.
