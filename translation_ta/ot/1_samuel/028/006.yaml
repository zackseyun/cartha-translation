  source_fidelity: 'மூலத்தின் முக்கியப் பொருள் சரியாக உள்ளது: சவுல் யாவேயிடம் வழிகாட்டுதலை நாடினான்; யாவே கனவுகள், ஊரீம், இறைவாக்கினர்கள் ஆகிய எந்த வழியிலும் பதிலளிக்கவில்லை. ஆனால் வரைவில் ‘பதிலளிக்கவில்லை’ இருமுறை வருகிறது; எபிரெயத்தில் உள்ள ஒரே மறுப்புவினையின் மூன்று வழிமுறைத் தொடர்களுடனான தொடர்பைத் தமிழில் ஒரே வாக்கிய அமைப்பில் தெளிவாக்கலாம்.'
  naturalness: ‘ஆனால் யாவே அவனுக்குப் பதிலளிக்கவில்லை—... பதிலளிக்கவில்லை’ என்ற அமைப்பு தேவையற்ற மறுபடியும் சிறிது தடுமாற்றமான இடைநிறுத்தமும் கொண்டது. மறுப்புவினையைப் பட்டியலின் இறுதியில் ஒருமுறை வைப்பது நவீனத் தரத் தமிழில் இயல்பாகவும் தெளிவாகவும் இருக்கும்.
  terminology: ‘யாவே,’ ‘விசாரித்தான்,’ ‘ஊரீம்,’ ‘இறைவாக்கினர்கள்’ ஆகிய தேர்வுகள் ஏற்றவை. ‘ஊரீம்’ குறித்த அடிக்குறிப்பில் அதன் ஆசாரியத் தொடர்பும் வழிகாட்டுதலை நாடிய பயன்பாடும் தெளிவாக இருக்க வேண்டும்; அதன் துல்லிய இயல்பைக் குறித்து ஊகிக்கக் கூடாது.
  issues:
