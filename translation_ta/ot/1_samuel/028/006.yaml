base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/006.yaml
  text: Saul inquired of Yahweh[a], but Yahweh did not answer him[b], either by dreams or by the Urim or by the prophets.
translation:
  language: ta
  text: சவுல் யாவேயிடம் விசாரித்தான்; ஆனால் யாவே அவனுக்குக் கனவுகள் மூலமாகவோ, ஊரீம்[a] மூலமாகவோ, இறைவாக்கினர்கள் மூலமாகவோ பதிலளிக்கவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ஊரீம் என்பது தெய்வீக வழிகாட்டுதலை நாடுவதற்கான ஒரு ஆசாரிய வழிமுறையாக இருந்தது.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּשְׁאַל ... בַּיהוָה
  choice: யாவேயிடம் விசாரித்தான்
  rationale: שׁאל என்பதுடன் தெய்வப் பெயரைச் சுட்டும் ב வரும்போது, சாதாரணமாக ஒரு கேள்வி கேட்டதைவிட இறைவழிகாட்டுதலை நாடியதைக் குறிக்கிறது. எனவே இயல்பான தமிழில் ‘விசாரித்தான்’ என வழங்கப்பட்டது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய மூலத்தில் உள்ள நான்கு எழுத்துத் தெய்வப் பெயரைப் பட்டப்பெயராக மாற்றாமல், அதன் பரவலாக ஏற்றுக்கொள்ளப்பட்ட உச்சரிப்பைத் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: וְלֹא עָנָהוּ
  choice: அவனுக்குப் பதிலளிக்கவில்லை
  rationale: ענה இங்கு சவுலின் விசாரணைக்கு இறைவன் மறுமொழி அளிப்பதைக் குறிக்கிறது; இந்த நேரடியான தமிழ் சொற்றொடர் அந்தப் பொருளைப் பாதுகாக்கிறது.
- source_word: גַּם ... גַּם ... גַּם
  choice: … மூலமாகவோ, … மூலமாகவோ, … மூலமாகவோ
  rationale: எதிர்மறை வாக்கியத்தில் மீண்டும் வரும் גַּם, பட்டியலிடப்பட்ட எந்த வழியிலும் பதில் வரவில்லை என்பதைக் காட்டுகிறது. தமிழின் ‘-வோ’ தொடர் அந்தப் பகிர்ந்த எதிர்மறைப் பொருளை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: בַּחֲלֹמוֹת
  choice: கனவுகள் மூலமாக
  rationale: கனவுகள் இறை வெளிப்பாட்டின் ஒரு வழியாகப் பட்டியலிடப்படுகின்றன; ‘மூலமாக’ என்பது கருவி அல்லது வழிமுறையைக் குறிக்கும் ב-ஐத் தெளிவாக வழங்குகிறது.
- source_word: בָּאוּרִים
  choice: ஊரீம்
  rationale: אוּרִים என்பது ஆசாரியர்கள் இறைவழிகாட்டுதலை நாடுவதோடு தொடர்புடைய தனிப்பெயர் போன்ற தொழில்நுட்பச் சொல். அதன் துல்லிய இயல்பு முழுமையாகத் தெரியாததால் பொருள் ஊகிக்காமல் ஒலிபெயர்க்கப்பட்டது.
- source_word: בַּנְּבִיאִם
  choice: இறைவாக்கினர்கள் மூலமாக
  rationale: נביאים என்பது இறைச்செய்தியைப் பெறும் அல்லது அறிவிக்கும் மனித முகவர்களைக் குறிக்கிறது. ‘இறைவாக்கினர்கள்’ என்பது நவீன, கண்ணியமான தமிழில் அந்தப் பணியைத் தெளிவாகக் காட்டுகிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வப் பெயரை வழங்குதல்
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூலவசனம் உடன்படிக்கைப் பெயரான יהוה-ஐ நேரடியாக இருமுறை பயன்படுத்துகிறது. அதை பொதுவான பட்டப்பெயராக மாற்றாமல் ஒலிபெயர்ப்பது மூலத்தின் வேறுபாட்டைப் பாதுகாக்கிறது.
- issue: சவுலின் விசாரணைக்கு பதில் கிடைக்காததன் பொருள்
  choice: பட்டியலிடப்பட்ட எந்த வழியிலும் யாவே அவனுக்குப் பதிலளிக்கவில்லை என்று மட்டும் கூறுதல்
  alternative: யாவே ஏன் பதில் மறுத்தார் என்பதை விளக்கிச் சேர்த்தல்
  rationale: இந்த வசனம் பதில் அளிக்கப்படாததைக் கூறுகிறது; அதற்கான காரணத்தை இங்கே கூறவில்லை. ஆகவே காரணம் அல்லது சவுலின் ஆன்மீக நிலை குறித்த விளக்கம் சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், வாசிக்க எளிதானதும் கண்ணியமானதுமான நடை பயன்படுத்தப்பட்டது. எபிரெயப் பட்டியலின் மூன்று உறுப்புகளும் ஒரே இலக்கண வடிவில் வைக்கப்பட்டுள்ளன; பதில் கிடைக்காததன் வலியுறுத்தலைக் காக்க இறுதியில் ‘பதிலளிக்கவில்லை’ மீண்டும் கூறப்பட்டுள்ளது.
