base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/002.yaml
  text: David said to Achish[a], “Then you yourself will know what your servant can do.” And Achish said to David, “Very well[b], I will make you my bodyguard for all your days.”
translation:
  language: ta
  text: தாவீது ஆகீசிடம், “அப்படியானால், உமது அடியான் என்ன செய்வான் என்பதை நீரே அறிந்துகொள்வீர்[a]” என்றான். அதற்கு ஆகீசு தாவீதிடம், “அப்படியானால், உன்னை உன் வாழ்நாளெல்லாம் என் மெய்க்காவலனாக நியமிப்பேன்[b]” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'மாற்று வாசிப்பு: “உமது அடியான் என்ன செய்யக்கூடியவன் என்பதை.” தாவீதின் சொற்கள் திட்டமிட்டே இருபொருள்பட உள்ளன.'
    reason: lexical_alternative
  - marker: b
    text: சொல்லுக்கு சொல், “என் தலைக்குக் காவலனாக”; அதாவது, ஆகீசின் உயிரையும் உடலையும் காக்கும் தனிப்பட்ட காவலனாக.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: அப்படியானால்
  rationale: முந்தைய கூற்றிலிருந்து வரும் முடிவையோ பதிலையோ குறிக்கும் உரையாடல் இணைப்பாக இச்சொல் இரு இடங்களிலும் வருகிறது; ‘அப்படியானால்’ அந்தத் தொடர்பை இயல்பான தமிழில் காக்கிறது.
- source_word: אַתָּה תֵדַע
  choice: நீரே அறிந்துகொள்வீர்
  rationale: வினைச்சொல்லில் ஏற்கெனவே நபர் குறிக்கப்பட்டிருந்தும் אַתָּה தனியாக வந்திருப்பதால் உள்ள வலியுறுத்தலை ‘நீரே’ வெளிப்படுத்துகிறது.
- source_word: אֵת אֲשֶׁר יַעֲשֶׂה עַבְדֶּךָ
  choice: உமது அடியான் என்ன செய்வான் என்பதை
  rationale: எபிரெய எதிர்கால வடிவத்தின் நேரடியான பொருளைத் தக்கவைத்து, தாவீது யாருக்கு எதிராக என்ன செய்வான் என்பதைத் தெளிவுபடுத்தாத மூலத்தின் திட்டமிட்ட இருபொருள்தன்மையையும் காக்கிறது.
- source_word: עַבְדֶּךָ
  choice: உமது அடியான்
  rationale: அரசவைச் சூழலில் தாழ்மையுடன் தன்னைச் சுட்டும் மரபுவழிக் கூறு; அடிமைநிலையைத் திட்டவட்டமாகக் குறிக்காமல் சமூக மரியாதைப் பதிவை காக்கிறது.
- source_word: שֹׁמֵר לְרֹאשִׁי
  choice: என் மெய்க்காவலனாக
  rationale: சொல்லுக்கு சொல் ‘என் தலைக்குக் காவலன்’ என்றாலும், ஒருவரின் உடலையும் உயிரையும் காக்கும் தனிப்பட்ட காவலரை குறிக்கும் எபிரெய மரபுத்தொடரின் இயல்பான தமிழ்ப் பொருள் ‘மெய்க்காவலன்’ ஆகும்.
- source_word: אֲשִׂימְךָ
  choice: உன்னை ... நியமிப்பேன்
  rationale: ஒரு பொறுப்பில் ஒருவரை வைப்பதை அல்லது அமர்த்துவதை இங்கு குறிக்கிறது; ‘நியமிப்பேன்’ தமிழில் அந்தப் பணியமர்த்தலைத் தெளிவாகச் சொல்கிறது.
- source_word: כָּל הַיָּמִים
  choice: என்றென்றும்
  rationale: சொல்லுக்கு சொல் ‘எல்லா நாட்களிலும்’; சூழலில் தொடர்ச்சியான, காலவரையற்ற நியமனத்தை இயல்பான தமிழில் ‘என்றென்றும்’ தெரிவிக்கிறது.
theological_decisions:
- issue: தாவீதின் கூற்றிலுள்ள திட்டமிட்ட இருபொருள்தன்மை
  choice: ‘என்ன செய்வான்’ என்று செயலைக் குறிப்பிடாமல் விடப்பட்டது.
  alternative: ‘என்ன செய்யக்கூடியவன்’ அல்லது பெலிஸ்தருக்காக என்ன செய்வான் என்று வெளிப்படையாகக் கூறுதல்.
  rationale: மூல எபிரெயம் தாவீதின் செயல் என்னவாகும், அது யாருக்கு எதிராக அமையும் என்பதைக் கூறவில்லை. கதையின் பதற்றத்தை மொழிபெயர்ப்பு தீர்த்துவிடாமல் காக்க வேண்டும்.
translation_notes:
  register: நவீன நிலையான தமிழில் கண்ணியமான அரசவை உரையாடல் பதிவு பயன்படுத்தப்பட்டுள்ளது. ஆகீசை நோக்கிய மரியாதையை ‘உமது’, ‘நீரே’, ‘அறிந்துகொள்வீர்’ என்பவை வெளிப்படுத்துகின்றன; தாவீதை நோக்கி ஆகீசு பேசுவதால் ஒருமை வடிவமான ‘உன்னை’ பயன்படுத்தப்பட்டுள்ளது.
