translation_notes:
  register: நவீன நிலையான தமிழில், கண்ணியமானவும் சாதாரண வாசகர்களுக்கு எளிதில் புரியக்கூடியதாகவும் அமைக்கப்பட்டது. எபிரெய உரையின் தொடர் வினைநடையைத் தக்கவைத்தபடியே, தமிழில் இயல்பான வாக்கிய ஓட்டத்திற்காக இரண்டு வாக்கியங்களாகப் பிரிக்கப்பட்டது.
