source:
  edition: WLC
  text: וַ/יִּקָּבְצ֣וּ פְלִשְׁתִּ֔ים וַ/יָּבֹ֖אוּ וַ/יַּחֲנ֣וּ בְ/שׁוּנֵ֑ם וַ/יִּקְבֹּ֤ץ שָׁאוּל֙ אֶת כָּל יִשְׂרָאֵ֔ל וַֽ/יַּחֲנ֖וּ בַּ/גִּלְבֹּֽעַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/004.yaml
  text: The Philistines gathered and came and camped at Shunem[a], and Saul gathered all Israel[b], and they camped at Gilboa.
translation:
  language: ta
  text: பெலிஸ்தியர்கள் ஒன்றுகூடி, சூனேமுக்கு வந்து அங்கே முகாமிட்டார்கள். சவுல் இஸ்ரவேலர் அனைவரையும் ஒன்றுகூட்டினார்; அவர்கள் கில்போவாவில்[a] முகாமிட்டார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “கில்போவாவில்” என்பதை “கில்போவா மலைப்பகுதியில்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקָּבְצוּ
  choice: ஒன்றுகூடி
  rationale: קבץ என்பதன் ஒன்றுகூடுதல் அல்லது திரளுதல் என்ற பொருளை இயல்பான தமிழில் தருகிறது; இராணுவ அணிதிரட்டல் என்ற கருத்தை அளவுக்கு மீறி வெளிப்படுத்தவில்லை.
- source_word: פְלִשְׁתִּים
  choice: பெலிஸ்தியர்கள்
  rationale: இந்த மக்கள் இனத்திற்கான தமிழில் பரவலாக அறியப்படும் பெயர்.
- source_word: וַיָּבֹאוּ
  choice: வந்து
  rationale: בוא என்ற எளிய இயக்க வினையின் பொருளைப் பாதுகாக்கிறது; மூலத்தில் வெளிப்படையாக இல்லாத ‘முன்னேறி’ போன்ற இராணுவச் சாயலைச் சேர்க்கவில்லை.
- source_word: וַיַּחֲנוּ
  choice: முகாமிட்டார்கள்
  rationale: חנה என்பதன் முகாம் அமைத்துத் தங்குதல் என்ற பொருளை நவீன, இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: בְשׁוּנֵם
  choice: சூனேமுக்கு வந்து அங்கே
  rationale: בְ முன்னிடைச்சொல் முகாமிட்ட இடத்தைச் சுட்டுகிறது. ‘சூனேமில்’ என்பதும் சாத்தியம்; ‘சூனேமுக்கு வந்து அங்கே’ என்பது தொடர்ச்சியான இயக்கத்தையும் முகாமின் இடத்தையும் தமிழில் தெளிவாக இணைக்கிறது.
- source_word: וַיִּקְבֹּץ
  choice: ஒன்றுகூட்டினார்
  rationale: முந்தைய קבץ வேருடன் சொல் தொடர்பைப் பேணுகிறது; சவுல் பிறரைத் திரட்டினார் என்ற causative அல்லாத எபிரெய வாக்கியத்தின் செயப்படுபொருள் அமைப்பை இயல்பாகக் காட்டுகிறது.
- source_word: כָּל יִשְׂרָאֵל
  choice: இஸ்ரவேலர் அனைவரையும்
  rationale: ‘இஸ்ரவேல் முழுவதையும்’ என்ற கூட்டுப்பொருளை இயல்பான தமிழில் தருகிறது; மூலத்தில் இல்லாத ‘ஆண்கள்’ அல்லது ‘படைவீரர்கள்’ என்ற வரம்பைச் சேர்க்கவில்லை.
- source_word: בַּגִּלְבֹּעַ
  choice: கில்போவாவில்
  rationale: மூலத்தில் ‘மலை’ என்ற சொல் சேர்க்கப்படாததால் இடப்பெயரை மட்டும் வழங்குகிறது. இப்பெயர் கில்போவா மலைப்பகுதியைக் குறிக்கக்கூடும் என்பதைக் காலடிக்குறிப்பு பாதுகாக்கிறது.
