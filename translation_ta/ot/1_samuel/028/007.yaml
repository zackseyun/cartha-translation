base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/007.yaml
  text: Then Saul said to his servants, “Find for me a woman who is a medium, so that I may go to her and inquire through her.” And his servants said to him, “Look, there is a woman who is a medium at En-dor.”
translation:
  language: ta
  text: அப்போது சவுல் தன் பணியாளர்களிடம், “ஆவியுடன் தொடர்புகொள்ளும் ஒரு பெண்ணை எனக்காகத் தேடுங்கள்; நான் அவளிடம் சென்று, அவள் மூலமாக விசாரிப்பேன்” என்றான். அவனுடைய பணியாளர்கள் அவனிடம், “இதோ, ஆவியுடன் தொடர்புகொள்ளும் ஒரு பெண் என்-தோரில் இருக்கிறாள்” என்றார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֵשֶׁת בַּעֲלַת אוֹב
  choice: ஆவியுடன் தொடர்புகொள்ளும் ஒரு பெண்
  rationale: בעלת אוב என்பது ஓர் אוֹב-ஐ உடைய அல்லது அதனுடன் செயல்படும் பெண்ணைக் குறிக்கும். இச்சூழலில் இறந்தோரின் ஆவியுடன் தொடர்புகொள்வதாகக் கருதப்பட்ட பெண்ணை இயல்பான நவீன தமிழில் குறிக்கிறது; அவள் உண்மையில் எதை அல்லது யாரைத் தொடர்புகொண்டாள் என்ற கதையின் பதற்றத்தைத் தீர்மானித்து விடவில்லை.
- source_word: וְאֶדְרְשָׁה בָּהּ
  choice: அவள் மூலமாக விசாரிப்பேன்
  rationale: בָּהּ இங்கு அந்தப் பெண்ணை வழிமுறையாகக் கொண்டு விசாரிப்பதைச் சுட்டுகிறது. எனவே ‘அவளிடம் விசாரிப்பேன்’ என்பதைவிட ‘அவள் மூலமாக’ என்பது எபிரெயச் சொல்லின் நுணுக்கத்தைப் பாதுகாக்கிறது.
- source_word: הִנֵּה
  choice: இதோ
  rationale: கவனத்தை ஈர்க்கும் எபிரெய இடைச்சொல்லின் நேரடியான, கண்ணியமான தமிழ் இணை.
- source_word: בְּעֵין דּוֹר
  choice: என்-தோரில்
  rationale: இடப்பெயரை ஒலிபெயர்த்து, இருப்பிடத்தைக் குறிக்கும் வேற்றுமை உருபைச் சேர்க்கிறது.
theological_decisions:
- issue: אוֹב என்பதன் இயல்பும் மொழிபெயர்ப்பும்
  choice: ஆவியுடன் தொடர்புகொள்ளும்
  alternative: குறிசொல்லும் / ஆவி ஊடகம் / பிதற்றும் ஆவி உடைய
  rationale: சொல்லை வெறும் எதிர்காலக் குறிசொல்லுதலாகச் சுருக்காமலும், நவீன தொழில்நுட்பத் தொனி கொண்ட ‘ஊடகம்’ என்பதைக் கட்டாயப்படுத்தாமலும், அந்தப் பெண்ணின் செயல்பாட்டைத் தெளிவாகக் கூறுகிறது. மேலும் தொடர்ந்து வரும் நிகழ்வு உண்மையான ஆவி தோற்றமா அல்லது வேறு நிகழ்வா என்பதை இவ்வசனத்திலேயே தீர்மானிக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழ்; எளிதில் புரியும், கண்ணியமான கதைநடை. ‘பணியாளர்கள்’ என்பது அரசனுக்குச் சேவை செய்பவர்களைக் குறிக்கும் இயல்பான சொல். மேற்கோள்களிலும் வினைமுற்றுகளிலும் சவுலின் ஆண்பால் ஒருமை தெளிவாக வைக்கப்பட்டுள்ளது.
