source:
  edition: WLC
  text: וְ/עַתָּ֗ה שְׁמַֽע נָ֤א גַם אַתָּה֙ בְּ/ק֣וֹל שִׁפְחָתֶ֔/ךָ וְ/אָשִׂ֧מָה לְ/פָנֶ֛י/ךָ פַּת לֶ֖חֶם וֶ/אֱכ֑וֹל וִ/יהִ֤י בְ/ךָ֙ כֹּ֔חַ כִּ֥י תֵלֵ֖ךְ בַּ/דָּֽרֶךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/022.yaml
  text: Now then[a], please listen, you also, to the voice of your female servant, and let me set a piece of bread before you. Eat, so that there may be strength in you[c][b], because you must go on your way.
translation:
  language: ta
  text: இப்போது, தயவுசெய்து, நீரும் உமது பணிப்பெண்ணின் சொல்லைக் கேளுங்கள்[a]. நான் உமக்கு முன்பாக ஒரு துண்டு அப்பத்தை[b] வைக்க அனுமதியுங்கள்; அதைச் சாப்பிடுங்கள். ஏனெனில், நீர் பயணம் செல்ல வேண்டியிருப்பதால் உமக்குப் பலம் உண்டாகட்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: நேரடியாக, “உமது பணிப்பெண்ணின் குரலுக்குச் செவிகொடுங்கள்”; இது அவளது சொல்லைக் கேட்டு இணங்குவதைக் குறிக்கும் எபிரேய மரபுத்தொடர்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “ஒரு சிறு துண்டு அப்பம்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: ஆகவே இப்போது
  rationale: காலத்தையும், முந்தைய உரையிலிருந்து வரும் வேண்டுகோளின் தொடர்ச்சியையும் காட்டும் உரையாடல் இணைப்பாக மொழிபெயர்க்கப்பட்டது.
- source_word: שְׁמַע נָא גַם אַתָּה
  choice: நீரும் ... கேளும்
  rationale: נָא தரும் பணிவான வேண்டுகோள், தமிழின் மரியாதை ஒருமை வினை வடிவத்தால் இயல்பாக வெளிப்படுகிறது; גַם אַתָּה காட்டும் பதிலளிக்கும் வலியுறுத்தலை ‘நீரும்’ காக்கிறது.
- source_word: בְּקוֹל שִׁפְחָתֶךָ
  choice: உமது பணிப்பெண்ணின் சொல்லை
  rationale: எபிரேய மொழிமரபான ‘குரலுக்குச் செவிகொடு’ என்பதன் பொருள் ‘சொல்லைக் கேட்டு இணங்கு’; שִׁפְחָה பெண்பால் பணியாளரைக் குறிப்பதால் ‘பணிப்பெண்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: וְאָשִׂימָה לְפָנֶיךָ
  choice: நான் உமக்கு முன்பாக ... வைக்க அனுமதியும்
  rationale: முதல் நபர் cohortative வடிவத்தின் பணிவான முன்வருதலைப் பாதுகாக்கிறது.
- source_word: פַּת לֶחֶם
  choice: ஒரு துண்டு அப்பம்
  rationale: פַּת என்பது ஒரு துண்டு அல்லது சிறு பகுதியைக் குறிக்கிறது; ‘துண்டு அப்பம்’ துல்லியமும் இயல்பும் உடையது.
- source_word: וֶאֱכֹל
  choice: அதைச் சாப்பிடும்
  rationale: கட்டளை வடிவத்தை மரியாதை ஒருமையில் தருகிறது; தமிழில் பொருள் தெளிவாக இருக்க ‘அதை’ சேர்க்கப்பட்டுள்ளது.
- source_word: וִיהִי בְךָ כֹּחַ
  choice: உமக்குப் பலம் இருக்கும்
  rationale: சாப்பிடுவதால் கிடைக்க வேண்டிய விளைவை இயல்பான தமிழில் கூறுகிறது; உடல் வலிமையே சூழலில் குறிக்கப்படுகிறது.
- source_word: כִּי תֵלֵךְ בַּדָּרֶךְ
  choice: நீர் வழியில் செல்ல
  rationale: வரவிருக்கும் பயணத்திற்காகப் பலம் தேவை என்ற காரணத் தொடர்பை தமிழில் நோக்கத் தொடராக இயல்பாக வெளிப்படுத்துகிறது; கட்டாயம் என்ற கருத்தை உரையில் தேவையின்றி சேர்க்கவில்லை.
