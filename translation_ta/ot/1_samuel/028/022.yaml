  register: நவீனத் தரமான, கண்ணியமான தமிழில் சவுலை நோக்கிய மரியாதை ஒருமை (‘நீர்/உமது’) பயன்படுத்தப்பட்டுள்ளது. பெண்பால் குறிக்கும் שִׁפְחָה ‘பணிப்பெண்’ எனத் தெளிவாகக் காக்கப்பட்டுள்ளது; எபிரேய மொழிமரபுகள் தேவையான இடங்களில் இயல்பான தமிழாக்கத்துடன் அடிக்குறிப்பில் விளக்கப்பட்டுள்ளன.
