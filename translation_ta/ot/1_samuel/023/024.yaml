  source_fidelity: மூல எபிரெயத்தின் தொடர்ச்சியான செயலை (“எழுந்து ... சென்றார்கள்”), சீப்பை நோக்கிய இயக்கத்தை, சவுலுக்கு முன்பாகச் சென்றதைக், தாவீதும் அவரது ஆட்களும் இருந்த இடத்தை, மற்றும் யெஷிமோனுக்குத் தெற்கான நிலஅமைவைக் மொழிபெயர்ப்பு துல்லியமாகத் தருகிறது. ‘யெஷிமோன்’ இடப்பெயராக வைக்கப்பட்டிருப்பதும், יָמִין என்பதன் நேரடிப் பொருளும் புவியியல் பொருளும் அடிக்குறிப்பில் காக்கப்பட்டிருப்பதும் பொருத்தமானவை.
