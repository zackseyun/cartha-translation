translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. பாரம்பரியமாக அறியப்படும் நபர் மற்றும் இடப்பெயர்கள் தக்கவைக்கப்பட்டுள்ளன. எபிரெய மூலத்தின் புவியியல் சொற்களிலுள்ள உண்மையான இருபொருள் வாய்ப்புகள் அடிக்குறிப்புகளில் பாதுகாக்கப்பட்டுள்ளன.
