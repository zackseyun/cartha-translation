base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/024.yaml
  text: They arose and went to Ziph ahead of Saul[a]. Now David and his men were in the wilderness of Maon, in the Arabah[b], to the south of the Jeshimon.
translation:
  language: ta
  text: அவர்கள் எழுந்து, சவுலுக்கு முன்னதாக சீப்புக்குச் சென்றார்கள். அப்போது தாவீதும் அவனுடைய ஆட்களும் மாவோன் வனாந்தரத்தில், அரபாவில், யெஷிமோன்[b] பகுதியின் தெற்கே[a] இருந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யெஷிமோனின் வலப்பக்கத்தில்.” எபிரெயச் சொற்றொடர் நேரடியாக “வலக்கை/வலப்பக்கம்” என்கிறது; புவியியல் பயன்பாட்டில் இது “தெற்கு” என்பதைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “யெஷிமோன்” என்பதை “பாழ்நிலம்” அல்லது “வறண்ட நிலம்” என்றும் புரிந்துகொள்ளலாம்; ஆனால் இங்கு அது ஓர் இடப்பெயராகப் பயன்படுத்தப்பட்டிருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקֻמוּ וַיֵּלְכוּ
  choice: அவர்கள் எழுந்து … சென்றார்கள்
  rationale: இரண்டு தொடர்நிலை வினைகளையும் இயல்பான தமிழ் கதைநடையில் தருகிறது; קום என்பதன் ‘எழுதல்’ என்ற தனித்த பொருளையும் காக்கிறது.
- source_word: זִיפָה
  choice: சீப்புக்குச்
  rationale: இடப்பெயருடன் சேர்ந்த திசைகாட்டும் ה, சீப்பை நோக்கிய இயக்கத்தைக் குறிக்கிறது; தமிழில் நான்காம் வேற்றுமை இதை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: לִפְנֵי שָׁאוּל
  choice: சவுலுக்கு முன்னதாக
  rationale: இங்கு לִפְנֵי என்பது சவுலுக்கு முன்பாக அல்லது அவரை முந்தி அவர்கள் சென்றதைக் குறிக்கிறது; தமிழில் கால/வரிசைத் தொடர்பு தெளிவாக உள்ளது.
- source_word: וְדָוִד וַאֲנָשָׁיו
  choice: அப்போது தாவீதும் அவனுடைய ஆட்களும்
  rationale: வினையில்லா எபிரெயக் கூற்று தாவீதின் இருப்பிடத்தை நோக்கிக் காட்சியை மாற்றுகிறது. ‘அப்போது’ அந்த மாற்றத்தை இயல்பாகக் காட்டுகிறது.
- source_word: בְּמִדְבַּר מָעוֹן
  choice: மாவோன் வனாந்தரத்தில்
  rationale: מִדְבָּר என்பது மணற்பாலை மட்டும் அல்லாமல் குடியிருப்பற்ற வறண்ட வெளியையும் குறிக்கலாம்; ‘வனாந்தரம்’ அந்த விரிவைத் தக்கவைக்கிறது.
- source_word: בָּעֲרָבָה
  choice: அரபாவில்
  rationale: குறிப்பிட்ட புவியியல் மண்டலத்தைக் குறிக்கும் வாய்ப்பு உள்ளதால், பொதுப்பெயரான ‘சமவெளி’ என்று மாற்றாமல் இடப்பெயராக ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: אֶל יְמִין הַיְשִׁימוֹן
  choice: யெஷிமோன் பகுதியின் தெற்கே
  rationale: יָמִין என்பதன் நேர்ப்பொருள் ‘வலப்பக்கம்’; கிழக்கை நோக்கிய புவியியல் திசையமைப்பில் அது தெற்கைக் குறிக்கிறது. முதன்மை உரையில் தெளிவான திசை தரப்பட்டு, நேர்ப்பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: הַיְשִׁימוֹן
  choice: யெஷிமோன்
  rationale: இச்சொல் ‘பாழ்நிலம்’ என்றும் பொருள்படலாம்; ஆனால் இங்கு புவியியல் பெயராகச் செயல்படும் வாய்ப்பு அதிகம் என்பதால் ஒலிபெயர்க்கப்பட்டுள்ளது.
