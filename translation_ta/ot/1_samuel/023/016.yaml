source:
  edition: WLC
  text: וַ/יָּ֨קָם֙ יְהוֹנָתָ֣ן בֶּן שָׁא֔וּל וַ/יֵּ֥לֶךְ אֶל דָּוִ֖ד חֹ֑רְשָׁה וַ/יְחַזֵּ֥ק אֶת יָד֖/וֹ בֵּ/אלֹהִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/016.yaml
  text: Then Jonathan son of Saul arose and went to David at Horesh[a], and strengthened his hand in God.
translation:
  language: ta
  text: அப்போது சவுலின் மகன் யோனத்தான் எழுந்து, ஓரேஷில் தாவீதிடம் சென்று, கடவுளில் தாவீதின் கையைப் பலப்படுத்தினான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கடவுளில் தாவீதுக்கு ஊக்கமளித்தான்”; சொல்லுக்குச் சொல், “கடவுளில் தாவீதின் கையைப் பலப்படுத்தினான்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: எழுந்து
  rationale: קום வினை இங்கு நோக்கமுள்ள அடுத்த செயலைத் தொடங்குவதைக் குறிக்கிறது; ‘எழுந்து’ என்பது எபிரெயக் கதைநடையின் தொடர்ச்சியையும் இயல்பான தமிழையும் காக்கிறது.
- source_word: יְהוֹנָתָן בֶּן שָׁאוּל
  choice: சவுலின் மகன் யோனத்தான்
  rationale: எபிரெய மூலத்தின் தந்தை–மகன் உறவை நேரடியாகத் தெரிவித்து, குடும்ப மற்றும் அரசியல் பதற்றத்தையும் வெளிப்படையாக வைத்திருக்கிறது.
- source_word: וַיֵּלֶךְ אֶל דָּוִד
  choice: தாவீதிடம் சென்று
  rationale: הלך אל என்பது இலக்கை அடையும் இயக்கத்தைக் குறிக்கிறது; தமிழில் ‘தாவீதிடம் சென்று’ என்பது இயல்பான நேரடி மொழிபெயர்ப்பு.
- source_word: חֹרְשָׁה
  choice: ஓரேசில் இருந்த
  rationale: இது பொதுப்பெயரான ‘காடு’ என்பதற்குப் பதிலாக இடப்பெயராகப் புரிந்துகொள்ளப்படுகிறது. இடவியல் பொருளைத் தெளிவாக்க ‘ஓரேசில் இருந்த தாவீதிடம்’ என்று அமைக்கப்பட்டுள்ளது.
- source_word: וַיְחַזֵּק אֶת יָדוֹ
  choice: அவனுடைய கையைப் பலப்படுத்தினான்
  rationale: ‘அவனுடைய கையைப் பலப்படுத்தினான்’ என்ற மூல உருவகத்தைத் தக்கவைக்கிறது; இதன் கருத்து தாவீதுக்குத் துணிவும் உறுதியும் அளித்தான் என்பதாக இருக்கலாம்.
- source_word: בֵּאלֹהִים
  choice: கடவுளில்
  rationale: ב முன்னிடைச்சொல்லின் ‘இல்’ என்ற நேரடிப் பொருளைத் தக்கவைத்து, பலப்படுத்துதலின் தளம் அல்லது ஆதாரம் கடவுள் என்பதைத் தீர்மானமாக விரித்துரைக்காமல் விடுகிறது.
theological_decisions:
- issue: אֱלֹהִים என்ற இறைச்சொல்லின் மொழிபெயர்ப்பு
  choice: கடவுள்
  alternative: ஆண்டவர்
  rationale: மூலத்தில் אֱלֹהִים உள்ளது; יהוה என்ற தனிப்பெயர் இல்லை. ஆகவே ‘ஆண்டவர்’ என்று ஒத்திசைக்காமல் ‘கடவுள்’ என்று மொழிபெயர்க்கப்படுகிறது.
- issue: בֵּאלֹהִים என்பதில் ב முன்னிடைச்சொல்லின் உறவு
  choice: கடவுளில்
  alternative: கடவுள்மூலம்
  rationale: ‘கடவுளில்’ என்பது மூலத்தின் திட்டமிட்ட சுருக்கத்தையும் சாத்தியமான பொருள் நுட்பத்தையும் காக்கிறது; ‘கடவுள்மூலம்’ என்பது கருவி அல்லது செயலாளர் பொருளை அதிகமாக நிர்ணயித்துவிடும்.
translation_notes:
  register: நவீன தரத் தமிழில் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய மொழியின் ‘கையைப் பலப்படுத்துதல்’ என்ற உருவகம் பிரதான உரையில் காக்கப்பட்டு, அதன் இயல்பான கருத்து அடிக்குறிப்பில் தரப்பட்டுள்ளது. ‘Horesh’ என்ற இடப்பெயர் தமிழ் ஒலிப்புமுறைக்கு ஏற்ப ‘ஓரேஸ்’ என அல்லாமல் எபிரெய ח ஒலியைத் தமிழில் வழக்கமாக அணுகும் வகையில் ‘ஓரேஸ்/ஓரேஷ்’ இடையே, வாசிப்புத் தெளிவுக்காக ‘ஓரேஸ்’ வடிவம் தேர்ந்தெடுக்கப்பட வேண்டியிருந்தாலும், இவ்வரைவில் மரபுசார்ந்த ‘ஓரேஸ்’ ஒலியமைப்புடன் ஒத்திசையாத ‘ஓரேசில்’ பயன்படுத்தப்பட்டுள்ளது; வெளியீட்டு பெயர்ப்பட்டியலுடன் இறுதி ஒத்திசைவு தேவை.
