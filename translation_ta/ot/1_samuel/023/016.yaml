revisions:
- from: அப்போது சவுலின் மகன் யோனத்தான் எழுந்து, ஓரேசில் இருந்த தாவீதிடம் சென்று, கடவுளில் அவனுடைய கையைப் பலப்படுத்தினான்.[a]
  to: அப்போது சவுலின் மகன் யோனத்தான் எழுந்து, ஓரேஷில் தாவீதிடம் சென்று, கடவுளில் தாவீதின் கையைப் பலப்படுத்தினான்.[a]
  rationale: The revision directly renders Jonathan’s movement to David at Horesh, standardizes the place-name form, and removes pronoun ambiguity by explicitly identifying David as the one whose ‘hand’ was strengthened. It retains the Hebrew metaphor in the main text and gives the idiomatic alternative in the footnote. No doctrinal interpretation has been introduced.
  reviewer_model: gpt-5.6-terra
