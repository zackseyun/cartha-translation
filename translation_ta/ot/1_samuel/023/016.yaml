    reason: lexical_alternative
  revision_rationale: The revision directly renders Jonathan’s movement to David at Horesh, standardizes the place-name form, and removes pronoun ambiguity by explicitly identifying David as the one whose ‘hand’ was strengthened. It retains the Hebrew metaphor in the main text and gives the idiomatic alternative in the footnote. No doctrinal interpretation has been introduced.
