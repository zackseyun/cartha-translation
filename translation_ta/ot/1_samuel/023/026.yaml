base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/026.yaml
  text: Saul was going on one side of the mountain[a], and David and his men were on the other side of the mountain. David was hurrying to go away from Saul[c][b], while Saul and his men were closing in on David and his men to capture them.
translation:
  language: ta
  text: சவுல் மலையின் ஒரு பக்கமாகச் சென்றுகொண்டிருந்தான்[a]; தாவீதும் அவனுடைய ஆட்களும் மலையின் மறுபக்கத்தில் இருந்தார்கள். சவுலிடமிருந்து விலகிச் செல்லத் தாவீது விரைந்துகொண்டிருந்தான்; அதே வேளையில், சவுலும் அவனுடைய ஆட்களும் தாவீதையும் அவனுடைய ஆட்களையும் பிடிப்பதற்காக அவர்களைச் சுற்றி நெருங்கிக்கொண்டிருந்தார்கள்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மொழியில் சொல்லர்த்தமாக, “சவுல் மலையின் பக்கத்தில் இந்தப் புறத்திலிருந்து சென்றான்; தாவீதும் அவனுடைய ஆட்களும் மலையின் பக்கத்தில் இந்தப் புறத்திலிருந்து இருந்தார்கள்.” எதிரெதிரான இடநிலையைத் தெளிவுபடுத்த, “ஒரு பக்கம்,” “மறுபக்கம்” என்று மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “தாவீதையும் அவனுடைய ஆட்களையும் சுற்றிவளைத்துக்கொண்டிருந்தார்கள்.”
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: சென்றுகொண்டிருந்தான்
  rationale: மலையின் இருபுறங்களிலும் ஒரே நேரத்தில் நிகழும் நகர்வை இயல்பான தமிழில் தொடர்நிலையாகக் காட்டுகிறது.
- source_word: מִצַּד הָהָר מִזֶּה ... מִצַּד הָהָר מִזֶּה
  choice: மலையின் ஒரு பக்கமாக ... மலையின் மறுபக்கத்தில்
  rationale: எபிரெய உரை இருமுறையும் ‘இந்தப் பக்கத்திலிருந்து’ என்ற இடச்சுட்டு அமைப்பைப் பயன்படுத்தினாலும், சூழல் காட்டும் எதிரெதிர் பக்கங்களைத் தமிழில் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: נֶחְפָּז
  choice: விரைந்துகொண்டிருந்தான்
  rationale: உணர்ச்சிப் பீதியைச் சேர்க்காமல் அவசரமான நகர்வை வெளிப்படுத்துகிறது.
- source_word: לָלֶכֶת מִפְּנֵי שָׁאוּל
  choice: சவுலிடமிருந்து விலகிச் செல்ல
  rationale: சொல்லர்த்தமான ‘சவுலின் முன்னிலையிலிருந்து செல்ல’ என்பதன் திசை மற்றும் விலகல் கருத்தைப் பேணுகிறது; ‘தப்பியோட’ என்று தீவிரப்படுத்தவில்லை.
- source_word: עֹטְרִים
  choice: சுற்றி நெருங்கிக்கொண்டிருந்தார்கள்
  rationale: சுற்றிவளைத்தல் அல்லது பிடிக்கும்படி நெருங்குதல் என்ற சூழல்சார் பொருளைத் தமிழில் தெளிவாகக் காட்டுகிறது; மாற்றுப் பொருளை அடிக்குறிப்பில் தருகிறது.
- source_word: לְתָפְשָׂם
  choice: பிடிப்பதற்காக
  rationale: இராணுவத் துரத்தல் சூழலில் ‘அவர்களைப் பிடிக்க’ என்ற நோக்கத்தை இயல்பாக வெளிப்படுத்துகிறது.
