translation_notes:
  register: நவீனத் தரத் தமிழில், கண்ணியமான ஆனால் எளிதில் புரியும் நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ஒரே நேரத்தில் நடைபெறும் நகர்வுகளை ‘சென்றுகொண்டிருந்தான்,’ ‘விரைந்துகொண்டிருந்தான்,’ ‘நெருங்கிக்கொண்டிருந்தார்கள்’ என்ற தொடர்நிலை வடிவங்கள் வெளிப்படுத்துகின்றன. அடிக்குறிப்பு குறிகள் அனைத்தும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
