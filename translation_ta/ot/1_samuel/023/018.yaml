base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/018.yaml
  text: And the two of them made a covenant before Yahweh[a]. Then David remained in the wooded area[b], and Jonathan went to his house.
translation:
  language: ta
  text: 'அவர்கள் இருவரும் யாவேவின் முன்னிலையில் ஓர் உடன்படிக்கை செய்துகொண்டார்கள்[a]. பின்பு தாவீது காட்டுப்பகுதியில்[b] தங்கியிருந்தான்; யோனத்தானோ தன் வீட்டுக்குச் சென்றான்.


    [a] எபிரெய மொழியில் சொல்லுக்குச் சொல், “ஓர் உடன்படிக்கையை வெட்டினார்கள்.”


    [b] அல்லது, “ஹோரேசில்.” இங்குள்ள எபிரெயச் சொல்லை ஓர் இடப்பெயராகவோ, “காட்டுப்பகுதி” என்ற பொதுப்பெயராகவோ புரிந்துகொள்ளலாம்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மொழியில் சொல்லுக்குச் சொல், “ஓர் உடன்படிக்கையை வெட்டினார்கள்.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “ஹோரேசில்.” இங்குள்ள எபிரெயச் சொல்லை ஓர் இடப்பெயராகவோ, “காட்டுப்பகுதி” என்ற பொதுப்பெயராகவோ புரிந்துகொள்ளலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּכְרְתוּ
  choice: செய்துகொண்டார்கள்
  rationale: כרת ברית என்பது சொல்லுக்குச் சொல் ‘உடன்படிக்கையை வெட்டுதல்’ என்றாலும், உடன்படிக்கை ஏற்படுத்திக்கொண்ட செயலை இயல்பான நவீன தமிழில் ‘உடன்படிக்கை செய்துகொண்டார்கள்’ என்று வழங்குகிறது; மூல மொழியின் சொல்லாட்சி அடிக்குறிப்பில் காக்கப்படுகிறது.
- source_word: שְׁנֵיהֶם
  choice: அவர்கள் இருவரும்
  rationale: தாவீதும் யோனத்தானும் இணைந்து செய்த செயல் என்பதை எபிரெய இருமைத் தன்மையுடன் தெளிவாகக் காட்டுகிறது.
- source_word: בְּרִית
  choice: உடன்படிக்கை
  rationale: இந்தச் சூழலில் உள்ள உறவுசார், solemn பிணைப்பை ‘உடன்படிக்கை’ தக்கவைக்கிறது; ‘ஒப்பந்தம்’ என்பது அதன் ஆழத்தைக் குறைக்கக்கூடும்.
- source_word: לִפְנֵי יְהוָה
  choice: யாவே முன்னிலையில்
  rationale: தேவனின் சந்நிதியில் நிகழ்ந்த உடன்படிக்கைச் செயல் என்ற பொருளைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய வேதப்பெயரான יהוה-ஐ பட்டப்பெயராக மாற்றாமல், தமிழில் ஒலிபெயர்த்து வழங்குகிறது.
- source_word: וַיֵּשֶׁב
  choice: தங்கியிருந்தான்
  rationale: இங்கு நேரடியாக ‘உட்கார்ந்தான்’ என்பதல்ல, அந்த இடத்தில் தொடர்ந்து தங்கியிருந்தான் என்பதே சூழலுக்குப் பொருத்தம்.
- source_word: בַּחֹרְשָׁה
  choice: காட்டுப்பகுதியில்
  rationale: חֹרֶשׁ என்பதன் காடு அல்லது மரங்கள் அடர்ந்த பகுதி என்ற பொதுப்பெயர்ப் பொருளை முதன்மை உரை தருகிறது; இடப்பெயரான ‘ஹோரேசில்’ என்ற சாத்தியம் அடிக்குறிப்பில் காக்கப்படுகிறது.
- source_word: הָלַךְ לְבֵיתוֹ
  choice: தன் வீட்டுக்குச் சென்றான்
  rationale: எபிரெயச் சொற்றொடரின் வடிவத்தையும் பொருளையும் இயல்பான தமிழில் நேரடியாக வழங்குகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூல உரை יהוה என்ற தனிப்பட்ட இறைப்பெயரை நேரடியாகப் பயன்படுத்துவதால், அதை ஒரு பட்டப்பெயராக மாற்றாமல் ‘யாவே’ என ஒலிபெயர்க்கிறது.
- issue: בַּחֹרְשָׁה என்பது பொதுப்பெயரா இடப்பெயரா
  choice: முதன்மை உரையில் ‘காட்டுப்பகுதியில்’
  alternative: ‘ஹோரேசில்’
  rationale: எபிரெய வடிவம் மரங்கள் அடர்ந்த பகுதியைக் குறிக்கும் பொதுப்பெயராகப் புரிந்துகொள்ள இடமளிக்கிறது; சுற்றியுள்ள நிகழ்விடச் சூழலால் இடப்பெயராகவும் கொள்ள முடியும். இந்த உண்மையான தெளிவின்மை அடிக்குறிப்பில் வெளிப்படையாக வைக்கப்படுகிறது.
translation_notes:
  register: நவீன தரநிலைத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டுள்ளது. ‘யோனத்தானோ’ என்பது தாவீது தங்கியதற்கும் யோனத்தான் சென்றதற்கும் இடையிலான இயல்பான எதிர்நிலையை உணர்த்துகிறது. மூலத்தின் இடப்பெயர்/பொதுப்பெயர் தெளிவின்மையும் உடன்படிக்கையை ‘வெட்டுதல்’ என்ற எபிரெய மரபுச் சொல்லாட்சியும் அடிக்குறிப்புகளில் பாதுகாக்கப்பட்டுள்ளன.
