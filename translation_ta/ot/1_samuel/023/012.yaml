base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/012.yaml
  text: Then David said[a], “Will the men of Keilah hand me and my men over into Saul’s hand?” And Yahweh said[c][b], “They will hand you over.”
translation:
  language: ta
  text: அப்போது தாவீது, “கேயிலா நகரத்தார்[a] என்னையும் என் ஆட்களையும் சவுலின் கையில்[b] ஒப்படைப்பார்களா[c]?” என்று கேட்டான். அதற்கு யாவே, “அவர்கள் ஒப்படைப்பார்கள்[d]” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “கேயிலா நகரத்தார்” என்பதற்கான எபிரெயச் சொற்றொடரைச் சொற்படியாக “கேயிலாவின் உரிமையாளர்கள்” அல்லது, சூழலுக்கு ஏற்ப, “கேயிலாவின் தலைவர்கள்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “சவுலின் கையில்” என்பது சவுலின் அதிகாரத்திற்குள் அல்லது கட்டுப்பாட்டிற்குள் என்று பொருள்படும் எபிரெய மரபுத்தொடர்.
    reason: lexical_alternative
  - marker: c
    text: அல்லது “விட்டுக்கொடுப்பார்களா” / “கையளிப்பார்களா.”
    reason: lexical_alternative
  - marker: d
    text: எபிரெயப் பதில் சொற்படியாக, “அவர்கள் ஒப்படைப்பார்கள்” என்பதாகும்; செயப்படுபொருள் வெளிப்படையாகக் கூறப்படவில்லை. சூழலில் தாவீதும் அவனுடைய ஆட்களும் குறிக்கப்படலாம்.
    reason: source_ambiguity
lexical_decisions:
- source_word: בַּעֲלֵי קְעִילָה
  choice: கேயிலாவின் குடிமக்கள்
  rationale: בַּעֲלֵי என்பது சொற்படியாக ‘உரிமையாளர்கள்/தலைவர்கள்’ எனப் பொருள்படலாம்; ஆனால் இந்நகரச் சூழலில் கேயிலாவைச் சேர்ந்த பொறுப்புள்ள குடிமக்களைக் குறிக்கிறது. ‘குடிமக்கள்’ என்பது பாலினத்தையும் நிர்வாகப் பதவியையும் தேவையின்றி வரையறுக்காமல் இயல்பாகப் பொருளைத் தருகிறது.
- source_word: הֲיַסְגִּרוּ / יַסְגִּירוּ
  choice: ஒப்படைப்பார்களா / ஒப்படைப்பார்கள்
  rationale: סגר என்பதன் ஹிஃபில் வடிவம் இங்கு ஒருவரை எதிரியின் அதிகாரத்திற்குள் விட்டுக்கொடுப்பதைக் குறிக்கிறது. ‘ஒப்படை’ என்பது இந்த மாற்றத்தையும் பகைவரிடம் கொடுத்துவிடும் கருத்தையும் இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது; கேள்வியிலும் பதிலிலும் ஒரே சொல்லைத் தொடர்ந்து பயன்படுத்துகிறது.
- source_word: אֹתִי וְאֶת־אֲנָשַׁי
  choice: என்னையும் என் ஆட்களையும்
  rationale: אֲנָשַׁי என்பதன் நேர்ப்பொருள் ‘என் ஆட்கள்’. அவர்கள் தாவீதின் ஆயுதமேந்திய உடனிருந்தவர்கள் என்றாலும், ‘வீரர்கள்’ என்று மிகையாகக் குறிப்பாக்காமல் எபிரெயச் சொல்லின் பரப்பை இது காக்கிறது.
- source_word: בְּיַד שָׁאוּל
  choice: சவுலின் கையில்
  rationale: ‘கையில்’ என்ற எபிரெய உருவகம் ஒருவருடைய அதிகாரம் அல்லது கட்டுப்பாட்டுக்குள் கொடுக்கப்படுவதைக் குறிக்கிறது. தமிழிலும் இவ்வுருவகம் புரியக்கூடியதால் அது தக்கவைக்கப்படுகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இது ஒரு பட்டப்பெயர் அல்ல, இஸ்ரவேலின் தேவனுடைய தனிப்பெயரைக் குறிக்கும் நான்கெழுத்துப் பெயர். எனவே ‘கர்த்தர்’ போன்ற மாற்றுப் பட்டத்தைப் பயன்படுத்தாமல் தமிழில் ‘யாவே’ என்று ஒலிபெயர்க்கப்படுகிறது.
- source_word: יַסְגִּירוּ (object implied as singular)
  choice: அவர்கள் உன்னை ஒப்படைப்பார்கள்
  rationale: பதில் தாவீதை ஒருமையில் குறிக்கிறது. கேள்வியில் அவனுடைய ஆட்களும் இடம்பெற்றாலும், பதிலின் ஒருமையைப் பன்மையாக்காமல் தாவீதைப் பிரதிநிதித் தலைவனாக முன்வைக்கும் எபிரெய அமைப்பு பாதுகாக்கப்படுகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூல உரை தேவனுடைய தனிப்பெயரை நேரடியாகப் பயன்படுத்துகிறது. பட்டப்பெயரால் அதை மாற்றாமல், தனிப்பெயரையே ஒலிபெயர்ப்பது மூலத்தின் வேறுபாட்டைப் பாதுகாக்கிறது.
- issue: யாவேயின் பதிலில் ஒருமை எண்ணைத் தக்கவைத்தல்
  choice: அவர்கள் உன்னை ஒப்படைப்பார்கள்
  alternative: அவர்கள் உங்களையெல்லாம் ஒப்படைப்பார்கள் / அவர்கள் உன்னையும் உன் ஆட்களையும் ஒப்படைப்பார்கள்
  rationale: எபிரெயப் பதிலில் செயப்படுபொருள் ஒருமையில் உள்ளது. தாவீதின் ஆட்கள் உட்குறிப்பாக இருக்கலாம்; ஆனால் அதை வெளிப்படையாகச் சேர்ப்பது மூலத்தில் உள்ள பிரதிநிதித்துவத் தன்மையையும் சிறிய தெளிவின்மையையும் நீக்கிவிடும்.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியும் அதேவேளையில் வேதாகமக் கதையாடலுக்கேற்ற கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘அப்போது’, ‘அதற்கு’ ஆகிய இணைப்புகள் உரையாடலின் ஓட்டத்தை இயல்பாக்குகின்றன. எபிரெய மொழியின் ‘கை’ உருவகமும் பதிலிலுள்ள ஒருமையும் பொருள் தெளிவுக்காகச் சமப்படுத்தப்படாமல் பாதுகாக்கப்பட்டுள்ளன.
