- from: அப்போது தாவீது, “கேயிலாவின் குடிமக்கள்[a] என்னையும் என் ஆட்களையும் சவுலின் கையில்[b] ஒப்படைப்பார்களா[c]?” என்று கேட்டான். அதற்கு யாவே, “அவர்கள் உன்னை ஒப்படைப்பார்கள்[d]” என்றார்.
  to: அப்போது தாவீது, “கேயிலா நகரத்தார்[a] என்னையும் என் ஆட்களையும் சவுலின் கையில்[b] ஒப்படைப்பார்களா[c]?” என்று கேட்டான். அதற்கு யாவே, “அவர்கள் ஒப்படைப்பார்கள்[d]” என்றார்.
  rationale: The revision corrects the treatment of the Hebrew final verb by not inserting an explicit singular object and by replacing the inaccurate note about a singular object. It also uses a more natural civic expression for the people of Keilah while retaining the lexical alternatives in a footnote. The divine name, the hand idiom, and the repeated handing-over verb are preserved.
