  text: וַ/יֵּ֨שֶׁב דָּוִ֤ד בַּ/מִּדְבָּר֙ בַּ/מְּצָד֔וֹת וַ/יֵּ֥שֶׁב בָּ/הָ֖ר בְּ/מִדְבַּר זִ֑יף וַ/יְבַקְשֵׁ֤/הוּ שָׁאוּל֙ כָּל הַ/יָּמִ֔ים וְ/לֹֽא נְתָנ֥/וֹ אֱלֹהִ֖ים בְּ/יָדֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/014.yaml
  text: David stayed in the wilderness strongholds[a], and he stayed in the hill country in the wilderness of Ziph. Saul sought him all the days, but God did not give him into his hand.
translation:
  language: ta
  text: தாவீது வனாந்தரத்திலுள்ள அரணமைந்த இடங்களில் தங்கியிருந்தான்; சீப் வனாந்தரத்தின் மலைப்பகுதியிலும் தங்கியிருந்தான். சவுல் நாட்களெல்லாம் அவனைத் தேடினான். ஆனால் கடவுள் அவனைச் சவுலின் கையில் கொடுக்கவில்லை[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அவனைச் சவுலிடம் ஒப்புக்கொடுக்கவில்லை.’ எபிரெய மொழியில், ‘அவனை அவனுடைய கையில் கொடுக்கவில்லை.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּשֶׁב
  choice: தங்கியிருந்தான்
  rationale: ישׁב என்பதன் தங்குதல், தங்கியிருத்தல் என்ற தொடர்நிலைப் பொருளை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: בַּמִּדְבָּר
  choice: வனாந்தரத்தில்
  rationale: מִדְבָּר என்பது மணற்பாலை மட்டும் அல்லாமல் பயிரிடப்படாத, குடியிருப்பு குறைந்த வனாந்தரப் பகுதியையும் குறிக்கும்; ‘வனாந்தரம்’ அந்தப் பரந்த பொருளைக் காக்கிறது.
- source_word: בַּמְּצָדוֹת
  choice: அரணான இடங்களில்
  rationale: מְצָדוֹת குறிக்கும் தற்காப்புக்கு ஏற்ற உறுதியான இடங்களைத் தெளிவாகவும் இயல்பாகவும் வழங்குகிறது; கட்டப்பட்ட கோட்டைகள் மட்டுமே என்ற எண்ணத்தைத் தவிர்க்கிறது.
- source_word: בָּהָר
  choice: மலைப்பகுதியில்
  rationale: הַר இங்கு ஒரு தனி மலைச்சிகரத்தைவிட சீப் வனாந்தரத்தின் மேட்டு அல்லது மலைநிலப் பகுதியைக் குறிப்பதால் இத்தேர்வு பொருத்தமானது.
- source_word: בְּמִדְבַּר זִיף
  choice: சீப் வனாந்தரத்தின்
  rationale: சீப்புடன் தொடர்புடைய குறிப்பிட்ட வனாந்தரப் பகுதியைக் குறிக்கும் எபிரெயக் கட்டமைப்பை இயல்பான தமிழில் தருகிறது.
- source_word: וַיְבַקְשֵׁהוּ
  choice: அவனைத் தேடினான்
  rationale: בקשׁ என்பதன் தேடுதல் அல்லது கண்டுபிடிக்க முயலுதல் என்ற பொருளைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: כָּל הַיָּמִים
  choice: நாட்களெல்லாம்
  rationale: எபிரெய மொழியின் ‘எல்லா நாட்களும்’ என்ற தொடர்ச்சியான காலப் பொருளைக் காத்து, தமிழில் புரியத்தக்கவாறு தருகிறது.
- source_word: וְלֹא נְתָנוֹ
  choice: அவனைக் கொடுக்கவில்லை
  rationale: נתן என்பதன் அடிப்படைப் பொருளையும், தொடர்ந்து வரும் ‘கையில்’ என்ற எபிரெய மரபுத்தொடரையும் காக்கிறது.
- source_word: אֱלֹהִים
  choice: கடவுள்
  rationale: இங்கு ஒருமை வினைப் பொருளுடன் இஸ்ரவேலின் கடவுளைக் குறிப்பதால், நவீனத் தமிழில் பொதுவாகவும் தெளிவாகவும் உள்ள ‘கடவுள்’ பயன்படுத்தப்படுகிறது.
- source_word: בְּיָדוֹ
  choice: சவுலின் கையில்
  rationale: ‘கையில்’ என்ற எபிரெய மரபுத்தொடரைக் காக்கிறது; தமிழில் சுட்டுப்பெயர் குழப்பத்தைத் தவிர்க்க அதன் குறிப்பு சவுல் என்று வெளிப்படுத்தப்படுகிறது.
theological_decisions:
- issue: கதைநிகழ்வில் אֱלֹהִים குறிக்கும் இறைச் செயல்பாடு
  choice: கடவுள் தாவீதைச் சவுலின் கையில் கொடுக்கவில்லை
  alternative: கடவுள் தாவீதைச் சவுலிடம் ஒப்புக்கொடுக்கவில்லை
  rationale: தாவீதின் பாதுகாப்பை நேரடியாகக் கடவுளின் செயலோடு இணைக்கும் மூலவாக்கியத்தை விரிவுபடுத்தாமல் காக்கிறது; ‘கையில் கொடுத்தல்’ என்ற உருவகத்தையும் நிலைநிறுத்துகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் இருமுறை வரும் ‘தங்கியிருந்தான்’ என்பதும் ‘கையில் கொடுத்தல்’ என்ற எபிரெய உருவகமும் காக்கப்பட்டுள்ளன; சுட்டுப்பெயர் தெளிவிற்காக ‘சவுலின்’ என்று வெளிப்படுத்தப்பட்டுள்ளது.
