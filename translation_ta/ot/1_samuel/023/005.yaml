base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/005.yaml
  text: So David and his men went to Keilah and fought against the Philistines[a], and he drove off their livestock and struck them with a great blow[c][b]. So David saved the inhabitants of Keilah.
translation:
  language: ta
  text: தாவீதும் அவனுடைய ஆட்களும் கேயிலாவுக்குச் சென்று, பெலிஸ்தியர்களுக்கு எதிராகப் போரிட்டனர். தாவீது அவர்களுடைய கால்நடைகளை ஓட்டிக்கொண்டு போய்[a], அவர்கள்மேல் பெரும் அடியைக் கொடுத்தான்[b]. இவ்வாறு தாவீது கேயிலாவில் குடியிருந்தவர்களைக் காப்பாற்றினான்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்களுடைய மந்தைகளை ஓட்டிக்கொண்டு போய்.” எபிரேயச் சொல் கால்நடைகளைப் பொதுவாகக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அவர்களுக்குப் பெரும் தோல்வியை ஏற்படுத்தினான்”; “அவர்களில் பலரைக் கொன்றான்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, “விடுவித்தான்” அல்லது “மீட்டான்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ דָּוִד וַאֲנָשָׁיו קְעִילָה
  choice: தாவீதும் அவனுடைய ஆட்களும் கேயிலாவுக்குச் சென்று
  rationale: הלך என்பதன் இயல்பான கதைநடைப் பொருளான ‘செல்’ என்பதையும், אֲנָשָׁיו என்பது இந்த இராணுவச் சூழலில் தாவீதின் போர்க்குழுவினரைக் குறிக்கிறது என்பதையும் தெளிவாகக் காட்டுகிறது.
- source_word: וַיִּלָּחֶם בַּפְּלִשְׁתִּים
  choice: பெலிஸ்தியர்களுக்கு எதிராகப் போரிட்டனர்
  rationale: לחם உடன் வரும் ב இச்சூழலில் எதிரியை எதிர்த்துப் போரிடுவதைக் குறிக்கிறது; ‘எதிராக’ என்பது கூட்டுச் செயலென்ற தவறான புரிதலைத் தவிர்க்கிறது.
- source_word: וַיִּנְהַג אֶת־מִקְנֵיהֶם
  choice: அவர்களுடைய கால்நடைகளை ஓட்டிக்கொண்டு போய்
  rationale: נהג விலங்குகளை ஓட்டிச் செல்வதைக் குறிக்கிறது; מִקְנֶה மாடுகளை மட்டும் அல்லாமல் கால்நடைகளைப் பொதுவாகக் குறிக்கும் கூட்டுப்பெயர்.
- source_word: וַיַּךְ בָּהֶם מַכָּה גְדוֹלָה
  choice: அவர்களைக் கடுமையாகத் தாக்கினான்
  rationale: நכה–מכה என்ற எபிரெயச் சொற்றொடரின் தாக்குதல்/பெரும் அடி என்ற உருவகத்தை இயல்பான தமிழில் தருகிறது; உயிரிழந்தோரின் எண்ணிக்கையையோ முழுமையான தோல்வியையோ மூலத்தைவிடத் தெளிவாக நிர்ணயிக்கவில்லை.
- source_word: וַיֹּשַׁע
  choice: காப்பாற்றினான்
  rationale: ישע இங்கு ஆபத்திலிருந்து விடுவித்தல் அல்லது மீட்டல் என்பதைக் குறிக்கிறது; ‘காப்பாற்றினான்’ என்பது நவீன தமிழில் நேரடியும் இயல்பானதும் ஆகும்.
- source_word: יֹשְׁבֵי קְעִילָה
  choice: கேயிலாவில் குடியிருந்தவர்கள்
  rationale: இந்தப் பங்கேற்புப் பெயர்ச்சொல் ‘கேயிலாவில் வசிப்பவர்கள்’ என்று பொருள்படும்; தேர்ந்த வடிவம் இயல்பான தமிழில் அதையே தருகிறது.
theological_decisions:
- issue: ישע என்ற வினையின் இராணுவச் சூழல்
  choice: காப்பாற்றினான்
  alternative: விடுவித்தான்; மீட்டான்
  rationale: இங்கு சொல் கேயிலா மக்களைப் பெலிஸ்திய ஆபத்திலிருந்து காத்த செயலைக் குறிக்கிறது. எந்தத் தனிப்பட்ட இறையியல் பொருளையும் கூடுதலாகச் சேர்க்காமல், பரந்த மூலப்பொருளைத் தக்கவைக்கிறது.
translation_notes:
  register: நவீன தரத்தமிழில் எளிமையும் கண்ணியமும் கொண்ட கதைநடை பயன்படுத்தப்பட்டுள்ளது. கூட்டு எழுவாய்க்குப் பன்மை வினை பயன்படுத்தப்பட்டு, பின்னர் எபிரெய மூலத்தில் தாவீதைத் தனி எழுவாயாகக் காட்டும் வினைகள் ஒருமைக்கு மாற்றப்பட்டுள்ளன. இடப்பெயர் ‘கேயிலா’ என்றும் இனப்பெயர் ‘பெலிஸ்தியர்கள்’ என்றும் வழக்கமான வேதாகமத் தமிழ் ஒலிபெயர்ப்பில் தரப்பட்டுள்ளன.
