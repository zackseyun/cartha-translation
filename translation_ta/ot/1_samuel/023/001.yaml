base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/001.yaml
  text: Then they told David[a], saying, “Look, the Philistines are fighting against Keilah, and they are plundering the threshing floors.”
translation:
  language: ta
  text: அப்போது அவர்கள் தாவீதிடம், “இதோ, பெலிஸ்தியர்கள் கெயிலாவுக்கு எதிராகப் போரிட்டுக்கொண்டிருக்கிறார்கள்; கதிரடிக்கும் களங்களைக் கொள்ளையடிக்கிறார்கள்” என்று தெரிவித்தார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பெலிஸ்தியர்கள் கெயிலாவில் போரிட்டுக்கொண்டிருக்கிறார்கள்” அல்லது “பெலிஸ்தியர்கள் கெயிலாவிடத்தில் போரிட்டுக்கொண்டிருக்கிறார்கள்.” எபிரேய முன்னிடைச்சொல்லின் நேரடிப் பொருள் “உள்ளே/இடத்தில்”; ஆனால் இந்த இராணுவச் சூழலில் பெலிஸ்தியர்கள் நகரத்தைத் தாக்குகிறார்கள் என்பதே பொருளாக இருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּגִּדוּ
  choice: அப்போது ... தெரிவித்தார்கள்
  rationale: נגד என்பதன் ஹிஃபில் தொடர்வினை கதைநடையில் அடுத்த நிகழ்வை அறிமுகப்படுத்துகிறது. பன்மை எழுவாயையும் நிகழ்வுத் தொடர்ச்சியையும் இயல்பான தமிழில் காக்கிறது.
- source_word: לְדָוִד
  choice: தாவீதிடம்
  rationale: ל குறிக்கும் செய்தியைப் பெறுபவரைத் தமிழில் இயல்பாக ‘-இடம்’ வேற்றுமையால் காட்டுகிறது.
- source_word: לֵאמֹר
  choice: என்று
  rationale: நேர்கூற்றை அறிமுகப்படுத்தும் எபிரெய மேற்கோள் அமைப்பை நவீன தமிழில் இயல்பாகக் குறிக்கிறது.
- source_word: הִנֵּה
  choice: இதோ
  rationale: அவசரமான செய்தியின்மீது கவனத்தை ஈர்க்கும் சுட்டிடைச்சொல்லின் உடனடித் தன்மையை, பழமையுணர்வு மிகாமல் காக்கிறது.
- source_word: פְלִשְׁתִּים
  choice: பெலிஸ்தியர்கள்
  rationale: அறியப்பட்ட மக்களினத்தைக் குறிக்கும் பெயரின் வழக்கமான தமிழ் வடிவம்.
- source_word: נִלְחָמִים
  choice: போரிட்டு
  rationale: לחם என்பதன் நிஃபால் வினையெச்சம் இங்கு நடந்துகொண்டிருக்கும் இராணுவச் செயலைக் குறிக்கிறது; குறிப்பிட்ட போர்த் தந்திரத்தைச் சேர்க்காமல் பொதுவான பொருளைக் காக்கிறது.
- source_word: בִּקְעִילָה
  choice: கேகிலாவுக்கு எதிராக
  rationale: ב என்பதன் அடிப்படைப் பொருள் ‘உள்ளே/இடத்தில்’ என்றாலும், இராணுவச் சூழலில் கேகிலா தாக்குதலின் இலக்கு என்பதே பெரும்பாலும் கருதப்படுகிறது. இந்த உணர்வை முதன்மை உரை தெளிவாக வழங்குகிறது; சொற்பொருள் மாற்று அடிக்குறிப்பில் காக்கப்படுகிறது.
- source_word: וְהֵמָּה
  choice: அவர்கள்
  rationale: தனி சுட்டுப்பெயர் எழுவாயை வலியுறுத்துகிறது. தமிழில் வினைமுற்றின் பன்மையோடு செய்தியின் எழுவாயைத் தெளிவாகப் பேணும் வகையில் கருத்தாக்கப்பட்டுள்ளது.
- source_word: שֹׁסִים
  choice: கொள்ளையடிக்கிறார்கள்
  rationale: போர்ச் சூழலில் சூறையாடி உடைமையைக் கைப்பற்றுவதைக் குறிக்கும் வினை. வேளாண் விளைபொருள் கொள்ளையை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: אֶת הַגֳּרָנוֹת
  choice: கதிரடிக்கும் களங்களை
  rationale: גֹּרֶן தானியத்தைப் பிரிக்கும் களம் அல்லது இடத்தைக் குறிக்கிறது. மறைமுகமாகத் தானியமும் கொள்ளையிடப்படுவதை உணர்த்தினாலும், மூலத்தின் நேரடியான இடப்பெயர்ச்சொல்லைத் தக்கவைக்கிறது.
