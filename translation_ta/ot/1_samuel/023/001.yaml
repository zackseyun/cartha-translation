revisions:
- from: அப்போது தாவீதிடம், “இதோ, பெலிஸ்தியர்கள் கேகிலாவுக்கு எதிராகப் போரிட்டு, கதிரடிக்கும் களங்களைக் கொள்ளையடிக்கிறார்கள்” என்று தெரிவித்தார்கள்.[a]
  to: அப்போது அவர்கள் தாவீதிடம், “இதோ, பெலிஸ்தியர்கள் கெயிலாவுக்கு எதிராகப் போரிட்டுக்கொண்டிருக்கிறார்கள்; கதிரடிக்கும் களங்களைக் கொள்ளையடிக்கிறார்கள்” என்று தெரிவித்தார்கள்.[a]
  rationale: The revision corrects the transliteration of Keilah, represents the two Hebrew participles as simultaneous ongoing actions, and improves the clarity and completeness of the lexical-alternative footnote. The footnote continues to preserve the Hebrew preposition’s locative ambiguity while identifying the contextual sense only as probable.
