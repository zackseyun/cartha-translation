  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் வேதாகமக் கதைநடைக்கேற்ற கண்ணியத்துடனும் மொழிபெயர்க்கப்பட்டது. ‘இதோ’ அவசரச் செய்தியின் உடனடித் தன்மையைக் காக்கிறது. இடப்பொருள் சார்ந்த உண்மையான தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
