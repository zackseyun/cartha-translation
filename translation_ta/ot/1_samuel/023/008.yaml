base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/008.yaml
  text: So Saul summoned all the people to war[a], to go down to Keilah, to besiege David and his men.
translation:
  language: ta
  text: அப்போது சவுல் போருக்காக மக்கள் அனைவரையும் திரட்டினான்[a]; கேயிலாவுக்கு இறங்கிச் சென்று தாவீதையும் அவனுடைய ஆட்களையும் முற்றுகையிடுவதற்காக.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “போருக்காக மக்கள் அனைவரையும் அழைத்துக் கூட்டினான்.” எபிரெய வினைச்சொல் சொற்படியாக “கேட்கச் செய்தான்” எனப் பொருள்படும்; இச்சூழலில் இராணுவ நடவடிக்கைக்காக மக்களை அழைத்துத் திரட்டினான் என்பதைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְשַׁמַּע
  choice: திரட்டினான்
  rationale: שׁמע என்பதன் ஹிஃபில் வடிவம் சொற்படியாக ‘கேட்கச் செய்தான்’ எனப் பொருள்படலாம்; இங்குள்ள இராணுவச் சூழலில், போருக்காக மக்களை அழைத்துத் திரட்டியதைக் குறிக்கிறது.
- source_word: כָּל הָעָם
  choice: மக்கள் அனைவரையும்
  rationale: எபிரெயச் சொற்றொடரின் நேரடியான பொருள் ‘மக்கள் அனைவரும்.’ சூழலில் போருக்குத் திரட்டப்பட்டவர்களைக் குறித்தாலும், மூலத்தில் ‘படை’ என்று வெளிப்படையாக இல்லை.
- source_word: לַמִּלְחָמָה
  choice: போருக்காக
  rationale: இது திரட்டியதன் இராணுவ நோக்கத்தை இயல்பான தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: לָרֶדֶת
  choice: செல்ல
  rationale: ירד என்பதன் நேரடிப் பொருள் ‘கீழே செல்லுதல்.’ தமிழில் இப்பயணத்தை இயல்பாகச் சொல்ல ‘செல்ல’ என்பது தேர்ந்தெடுக்கப்பட்டது; நிலவியல் திசையை வலியுறுத்த வேண்டுமெனில் ‘இறங்கிச் செல்ல’ என்பதும் சாத்தியம்.
- source_word: קְעִילָה
  choice: கேகிலா
  rationale: எபிரெய இடப்பெயரான קְעִילָה என்பதன் தமிழ் ஒலிபெயர்ப்பு.
- source_word: לָצוּר
  choice: முற்றுகையிடுவதற்காக
  rationale: צור இச்சூழலில் ஒருவரையும் அவருடைய ஆட்களையும் அடைத்து இராணுவ முற்றுகைக்கு உட்படுத்துவதைக் குறிக்கிறது.
- source_word: אֶל דָּוִד וְאֶל אֲנָשָׁיו
  choice: தாவீதையும் அவனுடைய ஆட்களையும்
  rationale: אֶל என்பது முற்றுகையின் இலக்கைக் குறிக்கிறது. אֲנָשָׁיו என்பதற்கு ‘அவனுடைய ஆட்கள்’ என்பது, அவர்கள் போர்க்குழுவாக இருந்ததைக் கூடுதலாக விளக்காமல் மூலத்தின் பொதுவான சொல்லாட்சியைப் பாதுகாக்கிறது.
