  yaml_path: translation/ot/1_samuel/023/015.yaml
  text: David saw that Saul had come out to seek his life[a], while David was in the wilderness of Ziph at Horesh.
translation:
  language: ta
  text: சவுல் தாவீதின் உயிரைத் தேடிப் புறப்பட்டிருந்ததை தாவீது கண்டான். தாவீது சீப் வனாந்தரத்திலுள்ள ஹோரேஷில் இருந்தான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘காட்டில்’ அல்லது ‘மரங்கள் அடர்ந்த இடத்தில்.’ எபிரெயச் சொல்லை ஒரு பொதுப்பெயராகவும் புரிந்துகொள்ளலாம்; ஆனால் இங்கு அது ‘ஹோரேஷ்’ என்ற இடப்பெயராக இருப்பதற்கே அதிக வாய்ப்புள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: கண்டான்
  rationale: ראה என்பதன் அடிப்படைப் பொருள் ‘காணுதல்’; இங்கு ஒரு நிலைமையை உணர்ந்துகொண்டதையும் குறிக்கலாம். ‘கண்டான்’ இந்த இரு சாத்தியங்களையும் இயல்பாகத் தக்கவைக்கிறது.
- source_word: כִּי
  choice: …இருந்ததை
  rationale: כִּי, தாவீது கண்டறிந்த செய்தியை அறிமுகப்படுத்துகிறது. தமிழில் பெயரெச்சத் தொடருடன் ‘…இருந்ததை’ என அமைப்பது இயல்பானது.
- source_word: יָצָא
  choice: புறப்பட்டிருந்ததை
  rationale: יצא என்பது ‘வெளியே செல்லுதல்/புறப்படுதல்’ என்று பொருள்படும். முந்திய செயலைக் காட்டும் நிறைவுற்ற வடிவம் தமிழ் கதைநடைக்கு ஏற்றது.
- source_word: לְבַקֵּשׁ אֶת נַפְשׁוֹ
  choice: தன் உயிரைத் தேடி
  rationale: எபிரெயச் சொற்றொடர் சொற்படியாக ‘அவனுடைய உயிரைத் தேடுதல்’ என்றும், சூழலில் உயிரைப் பறிக்கும் நோக்குடன் பின்தொடர்வதையும் குறிக்கிறது. ‘கொல்ல’ என்று வெளிப்படையாக விரித்துரைக்காமல் மூலத்தின் சொல்லாட்சியையும் அச்சுறுத்தலையும் தக்கவைக்கிறது.
- source_word: בְּמִדְבַּר זִיף
  choice: சீப் வனாந்தரத்தில்
  rationale: מִדְבָּר என்பது பாலைவனம் மட்டுமல்லாமல் மக்கள் குடியிருப்பு குறைந்த வறண்ட வனாந்தரப் பகுதியையும் குறிக்கலாம். ‘வனாந்தரம்’ இங்கு அதன் பரந்த பொருளைத் தக்கவைக்கிறது.
- source_word: בַּחֹרְשָׁה
  choice: ஓரேஷில்
  rationale: חֹרְשָׁה என்பது ‘காட்டுப்பகுதி/மரங்கள் அடர்ந்த இடம்’ என்ற பொதுப்பெயராகவும் புரிந்துகொள்ளப்படலாம்; இச்சூழலில் அது பெரும்பாலும் இடப்பெயராகக் கருதப்படுவதால் ‘ஓரேஷ்’ என ஒலிபெயர்க்கப்பட்டது.
- source_word: וְדָוִד
  choice: அப்போது தாவீது … இருந்தான்
  rationale: இணைப்புச் சொல் இங்கு தாவீது இருந்த இடத்தைச் சூழ்நிலைத் தகவலாக வழங்குகிறது. ‘அப்போது’ என்பது அந்தத் தொடர்பை இயல்பான தமிழில் காட்டுகிறது.
