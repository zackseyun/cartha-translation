  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் ‘உயிரைத் தேடுதல்’ என்ற உயிருக்கு ஆபத்தைக் குறிக்கும் மொழிவழக்கு, ‘கொல்லுதல்’ என்று முழுமையாக விளக்கிவிடாமல் தக்கவைக்கப்பட்டுள்ளது. இடப்பெயரின் மாற்றுப் புரிதல் அடிக்குறிப்பில் வழங்கப்பட்டுள்ளது.
