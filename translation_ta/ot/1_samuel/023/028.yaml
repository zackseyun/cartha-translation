base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/028.yaml
  text: So Saul returned from pursuing David and went to meet the Philistines. Therefore that place was called the Rock of Division[a].
translation:
  language: ta
  text: அப்போது சவுல் தாவீதைத் துரத்துவதை விட்டுத் திரும்பி, பெலிஸ்தியரைச் சந்திக்கச் சென்றான். அதனால்தான் அந்த இடத்துக்குப் ‘பிரிவுகளின் பாறை’[a] என்று பெயரிட்டார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘பிரிவின் பாறை’ அல்லது ‘பிரிதலின் பாறை.’ சவுல் தாவீதைத் துரத்துவதை நிறுத்தியதைக் இந்த இடப்பெயர் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: விட்டுத் திரும்பி
  rationale: שׁוב என்பது இச்சூழலில் சவுல் தன் தற்போதைய நடவடிக்கையைக் கைவிட்டுத் திரும்பியதைக் குறிக்கிறது; அடுத்துவரும் מן + வினைத் தொகையுடன் தமிழில் இயல்பாக இணைக்கப்பட்டுள்ளது.
- source_word: מִרְדֹף אַחֲרֵי
  choice: தாவீதைத் துரத்துவதை விட்டு
  rationale: מן உடன் வரும் வினையெச்சப் பெயர் ஒரு செயலை நிறுத்துவதைக் காட்டுகிறது; רדף என்பதன் பகைமைமிக்க இராணுவச் சூழலை ‘துரத்துதல்’ தெளிவாக வெளிப்படுத்துகிறது.
- source_word: לִקְרַאת
  choice: எதிர்கொள்ள
  rationale: לקראת என்பது சந்திக்கச் செல்வதையோ எதிர்கொள்ளச் செல்வதையோ குறிக்கலாம். பெலிஸ்தியரின் தாக்குதலுக்குப் பதிலளிக்கும் சூழலில் ‘எதிர்கொள்ள’ இயல்பானது; போரின் குறிப்பிட்ட முடிவைச் சேர்ப்பதில்லை.
- source_word: פְּלִשְׁתִּים
  choice: பெலிஸ்தியர்
  rationale: தமிழ் வேதாகம வழக்கிலும் நவீன வாசிப்பிலும் அறியப்பட்ட மக்களினப் பெயர்.
- source_word: עַל כֵּן
  choice: அதனால்தான்
  rationale: இடப்பெயருக்கான காரணத்தை அறிமுகப்படுத்தும் எபிரெயச் சூத்திரத்தை தெளிவான, இயல்பான நவீன தமிழில் தருகிறது.
- source_word: קָרְאוּ לַמָּקוֹם הַהוּא
  choice: அந்த இடத்துக்குப் … என்று பெயரிட்டார்கள்
  rationale: எபிரெயில் குறிப்பிடப்படாத பன்மை எழுவாயை, தமிழில் இயல்பான பொதுப்பன்மையாக வைத்திருக்கிறது; தேவையற்ற குறிப்பிட்ட எழுவாயைச் சேர்க்கவில்லை.
- source_word: סֶלַע
  choice: பாறை
  rationale: סלע குறிக்கும் பாறை அல்லது பாறை அமைப்பை இடப்பெயரில் நேரடியாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: הַמַּחְלְקוֹת
  choice: பிரிவினை
  rationale: חלק இலிருந்து உருவான இப்பெயர் பிரிவுகள் அல்லது பிரிதலைக் குறிக்கலாம். ‘பிரிவினை’ இடப்பெயராகச் சுருக்கமாக அமைகிறது; துல்லியமான நுண்பொருள் உறுதியற்றதால் மாற்றுகள் அடிக்குறிப்பில் தரப்பட்டுள்ளன.
