source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר שָׁא֔וּל בְּרוּכִ֥ים אַתֶּ֖ם לַֽ/יהוָ֑ה כִּ֥י חֲמַלְתֶּ֖ם עָלָֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/021.yaml
  text: Saul said[a], “May you be blessed by Yahweh[b], because you have had compassion on me.”
translation:
  language: ta
  text: சவுல், “யாவே உங்களை ஆசீர்வதிப்பாராக! ஏனெனில் நீங்கள் என்மீது இரக்கம் காட்டியிருக்கிறீர்கள்[a]” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நீங்கள் யாவேயால் ஆசீர்வதிக்கப்பட்டவர்கள்.” ‘இரக்கம் காட்டியிருக்கிறீர்கள்’ என மொழிபெயர்க்கப்பட்டுள்ள எபிரெய வினைச்சொல் சில சூழல்களில் “விட்டுவிடுதல்” அல்லது “கொல்லாமல் விடுதல்” என்ற பொருளையும் தரலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: என்றான்
  rationale: எபிரெய உரைநடையில் வரும் வழக்கமான தொடர்வினை வடிவம்; தமிழில் பேச்சுக்குப் பின் ‘என்றான்’ என்று இயல்பாக மொழிபெயர்க்கப்பட்டது.
- source_word: שָׁאוּל
  choice: சவுல்
  rationale: தனிப்பெயரின் தமிழில் நிலைபெற்ற ஒலிபெயர்ப்பு.
- source_word: בְּרוּכִים אַתֶּם
  choice: உங்களை ஆசீர்வதிப்பாராக
  rationale: பெயரடை–பதிலிப்பெயர் அமைப்பு இங்கு வெறும் நிலையைத் தெரிவிப்பதைவிட வாழ்த்துக் கூறும் செயல்பாட்டைக் கொண்டது; அதனை இயல்பான நவீன தமிழில் வாழ்த்தாக வெளிப்படுத்துகிறது.
- source_word: לַיהוָה
  choice: யாவே
  rationale: לַ முன்னொட்டு ஆசீர்வாதத்தின் உறவு அல்லது மூலத்தைக் குறிக்கிறது; தமிழில் செயப்பாட்டு வாழ்த்து அமைப்பினால் யாவே ஆசீர்வாதத்தை அளிப்பவராகத் தெளிவுபடுத்தப்படுகிறது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: சவுல் கூறிய ஆசீர்வாதத்திற்கான காரணத்தை அறிமுகப்படுத்தும் காரண இணைப்புச்சொல்.
- source_word: חֲמַלְתֶּם
  choice: இரக்கம் காட்டியிருக்கிறீர்கள்
  rationale: חמל என்பது இரக்கம் அல்லது பரிதாபம் கொள்வதைக் குறிக்கும்; சில சூழல்களில் அதன் விளைவாக உயிரைக் காப்பாற்றுதல் அல்லது தப்பவிடுதல் என்ற பொருளும் அமையலாம். இங்கு சவுலை நேரடியாகக் கொல்லாமல் விட்டனர் என்று கூறப்படாததால் இரக்கத்தின் உறவுசார் பொருள் ஏற்றது.
- source_word: עָלָי
  choice: என்மீது
  rationale: חמל உடன் வரும் על, ஒருவர்மீது இரக்கம் கொள்வதைச் சுட்டும் வழக்கமான எபிரெயச் சேர்க்கை; தமிழிலும் ‘என்மீது இரக்கம்’ என்பது இயல்பான இணைவு.
theological_decisions:
- issue: יהוה என்ற இறைபெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் உடன்படிக்கைக்குரிய தனிப்பட்ட இறைபெயரான יהוה நேரடியாக உள்ளது; அதை பொதுப் பட்டமாக மாற்றாமல் தமிழில் ஒலிபெயர்த்துள்ளது.
- issue: ஆசீர்வாதக் கூற்றின் இயல்பு
  choice: யாவே உங்களை ஆசீர்வதிப்பாராக
  alternative: நீங்கள் யாவேயால் ஆசீர்வதிக்கப்பட்டவர்கள்
  rationale: மூல இலக்கணம் ஒரு நிலைக் கூற்றாகவும் வாசிக்கக்கூடியது; ஆனால் சூழலில் சவுல் கூறும் வாழ்த்து அல்லது ஆசீர்வாதப் பிரகடனத்தின் செயல்பாட்டை முதன்மை உரை இயல்பான தமிழில் வெளிப்படுத்துகிறது. மாற்று வாசிப்பு அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையும் எளிய புரிதலும் இணையும் நடை பயன்படுத்தப்பட்டுள்ளது. பலரைக் குறிக்கும் ‘நீங்கள்’ என்பதற்கு இணங்க ‘அவர்களிடம்’ சேர்க்கப்பட்டுள்ளது; இது எபிரெயப் பன்மையைத் தமிழில் தெளிவாக்குகிறது.
