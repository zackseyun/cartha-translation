source:
  edition: WLC
  text: וַ/יֹּאמֶר֮ דָּוִד֒ יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל שָׁמֹ֤עַ שָׁמַע֙ עַבְדְּ/ךָ֔ כִּֽי מְבַקֵּ֥שׁ שָׁא֖וּל לָ/ב֣וֹא אֶל קְעִילָ֑ה לְ/שַׁחֵ֥ת לָ/עִ֖יר בַּ/עֲבוּרִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/010.yaml
  text: Then David said[a], “O Yahweh, God of Israel, your servant has surely heard that Saul is seeking to come to Keilah to destroy the city because of me.”
translation:
  language: ta
  text: 'அப்போது தாவீது, “இஸ்ரவேலின் கடவுளாகிய யாவே[a], உமது அடியானாகிய நான் உறுதியாகக் கேள்விப்பட்டிருக்கிறேன்: சவுல் என் காரணமாக நகரத்தை அழிப்பதற்காகக் கெயீலாவுக்கு வர முனைகிறான்” என்று சொன்னான்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் “YHWH”; மரபாக “ஆண்டவர்” என்று மொழிபெயர்க்கப்படுகிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: அப்போது ... சொன்னான்
  rationale: வாவ் தொடர்வினை கதையின் அடுத்த நிகழ்வை முன்னெடுக்கிறது; ‘அப்போது’ என்பது இயல்பான தமிழில் அந்த வரிசையைத் தெளிவாகக் காட்டுகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைவனின் தனிப்பெயரான நான்கெழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் பரவலாக அறியப்படும் ஒலிபெயர்ப்பில் தருகிறது.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் கடவுள்
  rationale: எபிரெயக் கட்டமைப்பின் பொருளை நேராகவும் இயல்பாகவும் தருகிறது; அழைப்புமுறையில் ‘இஸ்ரவேலின் கடவுளாகிய’ என அமைக்கப்பட்டுள்ளது.
- source_word: שָׁמֹעַ שָׁמַע
  choice: உறுதியாகக் கேள்விப்பட்டிருக்கிறேன்
  rationale: வினையெச்ச மூலவடிவமும் நிறைவுற்ற வினையும் சேர்ந்துள்ள வலியுறுத்தலை ‘உறுதியாக’ வெளிப்படுத்துகிறது; தமிழில் தொடரும் விளைவை ‘கேள்விப்பட்டிருக்கிறேன்’ இயல்பாகக் காட்டுகிறது.
- source_word: עַבְדְּךָ
  choice: உமது அடியானாகிய நான்
  rationale: கடவுளிடம் பேசும் தாழ்மையான தன்னடையாளத்தை ‘அடியான்’ காக்கிறது; தமிழில் முதலாம் நபர் வினையுடன் தெளிவாக இணைய ‘ஆகிய நான்’ சேர்க்கப்பட்டுள்ளது.
- source_word: מְבַקֵּשׁ
  choice: முனைகிறான்
  rationale: நடப்பிலுள்ள நோக்கம் அல்லது முயற்சியை வெளிப்படுத்துகிறது; உறுதியான திட்டம் என்று அளவுக்கு மீறித் தீர்மானிப்பதில்லை.
- source_word: לָבוֹא אֶל קְעִילָה
  choice: கேயிலாவுக்கு வர
  rationale: בוא என்பதன் ‘வருதல்’ என்ற நோக்குநிலையைப் பேணி, இடப்பெயரை இயல்பான தமிழ் வேற்றுமையுடன் தருகிறது.
- source_word: לְשַׁחֵת לָעִיר
  choice: இந்த நகரத்தை அழிப்பதற்காக
  rationale: இராணுவச் சூழலில் שׁחת என்பதன் அழித்தல் என்ற பொருளைத் தெளிவாகத் தருகிறது; ‘இந்த’ என்பது ஏற்கெனவே குறிப்பிடப்பட்ட கேயிலாவைக் குறிக்கும் தமிழ் இயல்பாக்கம்.
- source_word: בַּעֲבוּרִי
  choice: என் காரணமாக
  rationale: தாவீதை முன்னிட்டே நகரம் அழிக்கப்படும் என்ற காரண உறவை நேரடியாகப் பேணுகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூலத்தில் ஒரு பட்டம் அல்ல, நான்கெழுத்து இறைப்பெயரே நேரடியாக உள்ளது; ஆகவே தனிப்பெயரை ஒலிபெயர்த்து, மரபான பட்டப்பெயரை அடிக்குறிப்பில் குறிப்பிடுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, மரியாதைமிக்க வேண்டுதல் நடை பயன்படுத்தப்பட்டுள்ளது. ‘உமது அடியானாகிய நான்’ என்பது மூலத்தின் மூன்றாம் நபர் தாழ்மையான தன்னடையாளத்தைத் தமிழில் இலக்கணத் தெளிவுடன் எடுத்துரைக்கிறது. மூலத்தில் உள்ள வலியுறுத்தலும், சவுலின் நோக்கத்தை முழுமையாக உறுதிப்படுத்தாத ‘முனைகிறான்’ என்ற நுணுக்கமும் காக்கப்பட்டுள்ளன.
