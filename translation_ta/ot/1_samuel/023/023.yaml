review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the investigative commands, the return with reliable intelligence, Saul's accompanying action, and the conditional search. However, “நன்றாகப் பார்த்து” adds an explicit adverb not present in the Hebrew and subordinates the first imperative. More significantly, “தேடிக் கண்டுபிடிப்பேன்” asserts successful discovery, whereas וְחִפַּשְׂתִּי means that Saul will search/seek him out and does not guarantee that he will find him.
  naturalness: The Tamil is generally clear and suitably dignified. Separating the two opening commands produces a more direct and natural command sequence. “குலப் பிரிவுகள்” is slightly more precise in this administrative-social context than an unqualified “குலங்கள்,” while retaining readable modern Tamil.
  terminology: “மறைவிடங்கள்,” “உறுதியான தகவலுடன்,” and “யூதா” are appropriate. The footnote correctly preserves the literal “thousands” and cautiously explains the likely sense without presenting it as certain.
  issues:
  - severity: medium
    issue: “நன்றாகப் பார்த்து” adds ‘carefully/well’ and makes the first imperative dependent on the second.
    rationale: וּרְאוּ וּדְעוּ consists of two coordinated plural imperatives. Tamil should retain the command sequence without adding emphasis not explicit in the source.
  - severity: medium
    issue: “அவனைத் தேடிக் கண்டுபிடிப்பேன்” implies that Saul will find David.
    rationale: וְחִפַּשְׂתִּי אֹתוֹ expresses searching for or seeking him out; it does not state the outcome of finding him.
  revised_text: பாருங்கள்; அவன் அங்கே ஒளிந்துகொள்ளும் எல்லா மறைவிடங்களையும் பற்றி அறிந்துகொள்ளுங்கள். பின்பு உறுதியான தகவலுடன் என்னிடம் திரும்பி வாருங்கள்; நான் உங்களுடன் வருவேன். அவன் நாட்டில் இருந்தால், யூதாவின் எல்லாக் குலப் பிரிவுகளிலும்[a] அவனைத் தேடுவேன்.
