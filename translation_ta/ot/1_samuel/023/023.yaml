base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/023.yaml
  text: See and find out from all the hiding places where he hides there, then return to me with certainty, and I will go with you. And if he is in the land, I will search him out among all the clans of Judah.
translation:
  language: ta
  text: பாருங்கள்; அவன் அங்கே ஒளிந்துகொள்ளும் எல்லா மறைவிடங்களையும் பற்றி அறிந்துகொள்ளுங்கள். பின்பு உறுதியான தகவலுடன் என்னிடம் திரும்பி வாருங்கள்; நான் உங்களுடன் வருவேன். அவன் நாட்டில் இருந்தால், யூதாவின் எல்லாக் குலப் பிரிவுகளிலும்[a] அவனைத் தேடுவேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “யூதாவின் எல்லா ஆயிரங்களிலும்”; இது யூதாவிலுள்ள குல அல்லது குடும்பப் பிரிவுகளைக் குறிப்பதாக இருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּרְאוּ וּדְעוּ
  choice: நன்றாகப் பார்த்து ... தெரிந்துகொள்ளுங்கள்
  rationale: 'இரண்டு பன்மை ஏவல் வினைகளையும் தனித்தன்மையுடன் வைத்திருக்கிறது: ראה என்பது கவனித்துப் பார்ப்பதையும், ידע என்பது விசாரித்து உறுதியாக அறிந்துகொள்வதையும் இச்சூழலில் குறிக்கின்றன.'
- source_word: מִכֹּל הַמַּחֲבֹאִים אֲשֶׁר יִתְחַבֵּא שָׁם
  choice: அவன் அங்கே ஒளிந்துகொள்ளும் எல்லா மறைவிடங்களையும் பற்றி
  rationale: מַחֲבֹא என்பதற்கு இயல்பான ‘மறைவிடம்’ பயன்படுத்தப்பட்டுள்ளது. எபிரெயத்தில் உள்ள இடத்தைக் குறிக்கும் שָׁם என்பதும் ‘அங்கே’ எனத் தக்கவைக்கப்பட்டுள்ளது; התפעל வடிவின் தற்சுட்டுப் பொருள் ‘ஒளிந்துகொள்ளும்’ என்பதில் வெளிப்படுகிறது.
- source_word: וְשַׁבְתֶּם אֵלַי אֶל נָכוֹן
  choice: பின்பு உறுதியான தகவலுடன் என்னிடம் திரும்பி வாருங்கள்
  rationale: தொடர்ச்சியான கட்டளையை ‘பின்பு’ காட்டுகிறது. נָכוֹן இங்கு உறுதிப்படுத்தப்பட்ட, நம்பத்தகுந்த செய்தியைக் குறிப்பதால், தமிழில் பொருள் தெளிவுக்காக ‘உறுதியான தகவலுடன்’ என வழங்கப்பட்டுள்ளது.
- source_word: וְחִפַּשְׂתִּי אֹתוֹ
  choice: அவனைத் தேடிக் கண்டுபிடிப்பேன்
  rationale: חפשׂ என்பது கவனமாகத் தேடுதல் அல்லது தேடிக் கண்டறிதல் என்ற வலிமையைக் கொண்டுள்ளது; வெறும் ‘தேடுவேன்’ என்பதைவிட இத்தொடர் அந்த நோக்கமுள்ள தீவிரத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: בְּכֹל אַלְפֵי יְהוּדָה
  choice: யூதாவின் எல்லாக் குலங்களிலும்
  rationale: אַלְפֵי என்பதன் சொற்பொருள் ‘ஆயிரங்கள்’; ஆனால் இங்கு அது யூதாவின் சமூக அல்லது குடும்பப் பிரிவுகளைக் குறிப்பதாகப் புரிந்துகொள்ளப்படுகிறது. வாசிக்க இயல்பாக ‘குலங்கள்’ என மொழிபெயர்த்து, சொற்பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
