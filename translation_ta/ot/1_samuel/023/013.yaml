  yaml_path: translation/ot/1_samuel/023/013.yaml
  text: Then David arose with his men[a], about six hundred men, and they went out from Keilah and went wherever they could go. And it was told to Saul that David had escaped from Keilah[b], so he stopped going out.
translation:
  language: ta
  text: அப்போது தாவீதும் அவருடைய ஆட்களும்—ஏறக்குறைய அறுநூறு பேர்—எழுந்து, கேகிலாவைவிட்டு வெளியேறி, அவர்கள் சென்றுகொண்டிருந்த இடங்களிலெல்லாம் இடம் பெயர்ந்து சென்றார்கள்.[a] தாவீது கேகிலாவிலிருந்து தப்பிவிட்டான் என்று சவுலுக்கு அறிவிக்கப்பட்டது. ஆகவே, அவன் புறப்படுவதை நிறுத்திக்கொண்டான்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்கள் செல்ல முடிந்த இடங்களிலெல்லாம் அலைந்து திரிந்தார்கள்”; எபிரெயச் சொற்றொடர் ஓரிடத்திலிருந்து மற்றோர் இடத்துக்குத் தொடர்ந்து சென்றுகொண்டிருந்ததை வலியுறுத்துகிறது.
    reason: lexical_alternative
  - marker: b
    text: “அவன் புறப்படுவதை நிறுத்திக்கொண்டான்” என்பது, தாவீது கேகிலாவிலிருந்து தப்பிவிட்டதை அறிந்தபின் அவனைப் பிடிக்கச் சவுல் மேற்கொள்ளவிருந்த படையெடுப்பைக் கைவிட்டான் என்று பொருள்படலாம்.
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּקָם דָּוִד וַאֲנָשָׁיו
  choice: தாவீதும் அவருடைய ஆட்களும் ... எழுந்து
  rationale: קום என்பதன் அடிப்படைச் செயலுணர்வான ‘எழுதல்’ என்பதைக் காக்கிறது; இணைப்புச் சொற்றொடரைத் தமிழில் இயல்பான கூட்டு எழுவாயாக அமைக்கிறது.
- source_word: כְּשֵׁשׁ מֵאוֹת אִישׁ
  choice: ஏறக்குறைய அறுநூறு பேர்
  rationale: எண்ணுக்கு முன் வரும் כְּ தோராயத்தைக் குறிக்கிறது. இராணுவக் குழுவைக் குறிக்கும் சூழலிலும், எண்ணிக்கைக்குப் பின் ‘பேர்’ என்பது இயல்பான நவீன தமிழ்.
- source_word: וַיֵּצְאוּ מִקְּעִלָה
  choice: கேகிலாவைவிட்டு வெளியேறி
  rationale: יצא என்பதிலுள்ள வெளியே செல்லும் இடவுணர்வைத் தக்கவைத்தபடி தமிழில் இயல்பாக வழங்குகிறது.
- source_word: וַיִּתְהַלְּכוּ בַּאֲשֶׁר יִתְהַלָּכוּ
  choice: தங்களால் செல்ல முடிந்த இடங்களுக்கெல்லாம் இடம் பெயர்ந்து சென்றார்கள்
  rationale: மீண்டும் வரும் התהלך வடிவங்கள் தொடர்ச்சியாக ஓரிடத்திலிருந்து மற்றோர் இடத்துக்குச் சென்றதைக் காட்டுகின்றன. ‘இடம் பெயர்ந்து’ என்பது அழுத்தத்தின் கீழுள்ள தொடர்ச்சியான நடமாட்டத்தை வெளிப்படுத்துகிறது; நோக்கமற்ற அலைச்சல் என்று மிகைப்படுத்தாது.
- source_word: וּלְשָׁאוּל הֻגַּד
  choice: சவுலுக்கு அறிவிக்கப்பட்டது
  rationale: Hophal வினையின் ஆளில்லாப் பாட்டுவினை அமைப்பைத் தமிழிலும் காக்கிறது.
- source_word: כִּי נִמְלַט דָּוִד מִקְּעִילָה
  choice: தாவீது கேகிலாவிலிருந்து தப்பிவிட்டான் என்று
  rationale: נמלט என்பதன் ‘தப்புதல்/தப்பிச் செல்லுதல்’ என்ற பொருளையும், சவுலின் முயற்சியிலிருந்து விடுபட்டுவிட்ட நிறைவுணர்வையும் தருகிறது.
- source_word: וַיֶּחְדַּל לָצֵאת
  choice: அவன் புறப்படுவதை நிறுத்திக்கொண்டான்
  rationale: חדל + பெயரெச்ச வினையின் ‘செய்வதை நிறுத்துதல்’ என்ற நேரடிப் பொருளைக் காக்கிறது. ‘புறப்படுதல்’ என்பது இராணுவ நடவடிக்கைக்குச் செல்லும் சூழலை இயல்பாக உணர்த்தினாலும், இலக்கை மொழிபெயர்ப்பிலேயே வெளிப்படையாகச் சேர்ப்பதில்லை.
