translation_notes:
  register: நவீன நிலையான தமிழில், கண்ணியமான ஆனால் பொதுவாசகர்களுக்கு எளிதில் புரியும் கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘கேகிலா’ என்பது קְעִילָה என்ற எபிரெயப் பெயரின் ஒலிப்புக்கு நெருக்கமான தமிழாக்கம். மூலத்தின் கடைசி சொற்றொடரிலுள்ள சுருக்கமும் தெளிவின்மையும் அடிக்குறிப்பில் விளக்கப்பட்டுள்ளன.
