source:
  edition: WLC
  text: וַ/יְהִ֗י בִּ֠/בְרֹחַ אֶבְיָתָ֧ר בֶּן אֲחִימֶ֛לֶךְ אֶל דָּוִ֖ד קְעִילָ֑ה אֵפ֖וֹד יָרַ֥ד בְּ/יָדֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/006.yaml
  text: When Abiathar son of Ahimelech fled to David at Keilah[a], he came down with an ephod in his hand.
translation:
  language: ta
  text: அகிமெலேக்கின் மகன் அபியத்தார் கெயிலாவில் இருந்த தாவீதிடம் தப்பியோடி வந்தபோது, தன் கையில் ஓர் ஏபோத்தை வைத்துக்கொண்டு இறங்கி வந்தான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது, எபிரெயச் சொல் வரிசையை இன்னும் நேரடியாகப் பின்பற்றி: “ஓர் ஏபோத் அவனுடைய கையில் இறங்கி வந்தது.”'
    reason: இறுதித் தொடரில் יָרַד என்பதற்கான கர்த்தா அபியத்தாரா அல்லது ஏபோத்தா என்பது எபிரெயச் சொல் வரிசையில் தெளிவாகத் தீர்மானிக்கப்படவில்லை.
lexical_decisions:
- source_word: וַיְהִי
  choice: …வந்தபோது
  rationale: வாவ் தொடர்ச்சியுடன் வரும் היה இங்கு கதைநடை மாற்றத்தை அறிமுகப்படுத்துகிறது. தமிழில் தனியாக ‘அப்போது நிகழ்ந்தது’ என்று சேர்க்காமல், காலச் சார்புத்தொடரின் இயல்பான அமைப்பில் அதன் பணி வெளிப்படுகிறது.
- source_word: בִּבְרֹחַ
  choice: தப்பியோடி வந்தபோது
  rationale: ב + infinitive construct காலச் சூழலைக் குறிக்கிறது. ברח என்பதன் தப்பிச் செல்லும் கருத்தையும், தாவீதிடம் நோக்கிய இயக்கத்தையும் இயல்பான தமிழில் தருகிறது.
- source_word: אֶבְיָתָר בֶּן אֲחִימֶלֶךְ
  choice: அகிமெலேக்கின் மகன் அபியத்தார்
  rationale: பெயர்களையும் தந்தை–மகன் உறவையும் வழக்கமான தமிழ் வேதாகமப் பெயரெழுத்தாக்கத்துடன் நேரடியாகக் காக்கிறது.
- source_word: אֶל דָּוִד קְעִילָה
  choice: கெயிலாவில் இருந்த தாவீதிடம்
  rationale: אֶל என்பது தாவீதை நோக்கிய இயக்கத்தைக் குறிக்கிறது; קְעִילָה இங்கு தாவீது இருந்த இடமாகப் புரிந்துகொள்ளப்படுகிறது. இந்தத் தமிழ் வடிவம் கருத்தைத் தெளிவாகவும் இயல்பாகவும் வழங்குகிறது.
- source_word: אֵפוֹד
  choice: ஓர் ஏபோத்தை
  rationale: குறிப்பிட்ட ஆசாரியப் பயன்பாட்டுடைய பொருளுக்கு முழுமையான பொதுத் தமிழ் இணைச்சொல் இல்லாததால், எபிரெயச் சொல்லின் பெயரெழுத்தாக்கம் காக்கப்படுகிறது; அது உடையா அல்லது வேறு புனிதப் பொருளா என்பதை மொழிபெயர்ப்பு குறுக்கவில்லை.
- source_word: יָרַד
  choice: இறங்கி வந்தான்
  rationale: ירד என்பதன் இறங்கும் இயக்கத்தை நேரடியாகக் காக்கிறது; தாவீதின் இருப்பிடத்தை நோக்கிய வருகை என்பதால் ‘வந்தான்’ இயல்பாக உள்ளது.
- source_word: בְּיָדוֹ
  choice: தன் கையில் … எடுத்துக்கொண்டு
  rationale: ‘அவனுடைய கையில்’ என்ற concrete உருவகத்தை இயல்பான தமிழில் காக்கிறது; ஏபோத் அவனிடம் இருந்ததையும் உடன் கொண்டுவந்ததையும் தெரிவிக்கிறது.
theological_decisions:
- issue: இச்சூழலில் אֵפוֹד என்பதன் இயல்பு
  choice: ‘ஏபோத்’ என்று பெயரெழுத்தாக்கி, எபிரெயம் கூறுவதற்கு மேல் அதன் வடிவத்தையோ செயலையோ வரையறுக்காமல் விடுதல்
  alternative: ‘ஆசாரிய உடை’ அல்லது ‘புனித மேலங்கி’ என்று விளக்கமாக மொழிபெயர்த்தல்
  rationale: பரந்த கதையில் இப்பொருளுக்கு ஆசாரிய மற்றும் இறைவாக்கறியும் முக்கியத்துவம் இருந்தாலும், இவ்வசனம் அதை இன்னும் குறுகிய வகையில் வரையறுக்கவில்லை. பெயரெழுத்தாக்கம் தேவையற்ற சமயவியல் முடிவைத் தவிர்க்கிறது.
- issue: יָרַד בְּיָדוֹ என்பதன் இலக்கண கர்த்தா
  choice: அபியத்தாரே ஏபோத்தை கையில் எடுத்துக்கொண்டு இறங்கி வந்தார் என முதன்மை உரையில் வழங்குதல்
  alternative: ‘ஏபோத் அவனுடைய கையில் இறங்கி வந்தது’ என்று ஏபோத்தை கர்த்தாவாக எடுத்தல்
  rationale: சொல் வரிசை மாற்று வாசிப்புக்கு இடமளித்தாலும், சூழலில் அபியத்தாரின் வருகையைத் தொடர்ந்து குறிப்பிடுவது இயல்பான புரிதல். உண்மையான இலக்கணத் தெளிவின்மை அடிக்குறிப்பில் காக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘ஏபோத்’ வரலாற்று–சமயச் சிறப்புச் சொல்லாகப் பெயரெழுத்தாக்கப்பட்டுள்ளது. ‘கெயிலாவில் இருந்த தாவீதிடம்’ என்பது இடத்தொடரின் பொருளை வாசகருக்குத் தெளிவாக்குகிறது; இறுதித் தொடரின் உண்மையான இலக்கணத் தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
