base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/011.yaml
  text: Will the men of Keilah hand me over into his hand? Will Saul come down[a], as your servant has heard? O Yahweh, God of Israel, please tell your servant.” And Yahweh said, “He will come down.”
translation:
  language: ta
  text: “கெயிலா நகரத்தார் என்னை அவன் கையில்[a] ஒப்படைப்பார்களா? உமது அடியான் கேள்விப்பட்டபடியே சவுல் இறங்கி வருவானா? இஸ்ரவேலின் கடவுளாகிய யாவே, தயவுசெய்து உமது அடியானுக்கு அறிவியுங்கள்.” அதற்கு யாவே, “அவன் இறங்கி வருவான்” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அவன் கையில்” என்பது சவுலின் அதிகாரத்திற்குள் அல்லது கட்டுப்பாட்டிற்குள் என்பதைக் குறிக்கும் எபிரேய மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַסְגִּרֻנִי
  choice: என்னை ... ஒப்படைப்பார்களா
  rationale: סגר என்பதன் ஹிஃபில் வடிவம் இங்கு ஒருவரை மற்றொருவரின் அதிகாரத்திற்குள் ஒப்படைப்பதைக் குறிக்கிறது. ‘ஒப்படைப்பார்களா’ என்பது பகைமையான ஒப்படைப்பை இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: בַעֲלֵי קְעִילָה
  choice: கெயிலா நகரத்தார்
  rationale: בעלי என்பதற்கு சொற்படியாக ‘உரிமையாளர்கள்/தலைவர்கள்’ என்ற பொருள் இருக்கலாம்; இந்நகரச் சூழலில் அது கெயிலாவின் முக்கிய குடிமக்களையோ நகர மக்களையோ குறிக்கிறது. ‘நகரத்தார்’ இந்தக் கூட்டுப் பொருளை இயல்பாகத் தருகிறது; குறிப்பாக ஆண்கள் மட்டும் என்று தேவையின்றி வரையறுக்கவில்லை.
- source_word: בְיָדוֹ
  choice: அவன் கையில்
  rationale: ‘கை’ என்ற எபிரேய உருவகத்தைத் தக்கவைத்து, சவுலின் அதிகாரத்திற்குள் ஒப்படைக்கப்படுதல் என்ற கருத்தை வெளிப்படுத்துகிறது. சுட்டுப்பெயர் சவுலைக் குறிக்கிறது.
- source_word: יֵרֵד
  choice: இங்கே இறங்கி வருவானா / இறங்கி வருவான்
  rationale: ירד என்பது ‘இறங்குதல்’ என்று பொருள். தாவீது இருக்கும் கெயிலாவை நோக்கிய சவுலின் நகர்வாதலால் ‘இங்கே இறங்கி வருதல்’ இயல்பானது; கேள்வியிலும் பதிலிலும் ஒரே வினைத் தொடர் பேணப்பட்டுள்ளது.
- source_word: כַּאֲשֶׁר שָׁמַע עַבְדֶּךָ
  choice: உமது அடியான் கேள்விப்பட்டபடியே
  rationale: தாவீது பெற்ற செய்தியை அடிப்படையாகக் கொண்ட கேள்வி என்பதை ஒப்புமைத் துகளும் நிறைவுற்ற வினையும் சேர்ந்து காட்டுகின்றன.
- source_word: עַבְדֶּךָ
  choice: உமது அடியான்
  rationale: கடவுளிடம் செய்யும் வேண்டுதலில் இது தாழ்மையான தற்குறிப்பாக வருகிறது. மரியாதையும் வேதாகம வேண்டுதல் நடையும் காக்க ‘அடியான்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரான நான்கெழுத்துப் பெயரை ஒரு பட்டப்பெயரால் மாற்றாமல், தமிழில் தெளிவான ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: הַגֶּד נָא
  choice: தயவுசெய்து ... தெரிவியும்
  rationale: נגד என்பதன் கட்டளை வடிவத்தோடு נא சேர்ந்து பணிவும் அவசரமும் கொண்ட வேண்டுதலைக் காட்டுகிறது. ‘தயவுசெய்து தெரிவியும்’ dignified prayer register-ஐப் பேணுகிறது.
- source_word: וַיֹּאמֶר יְהוָה
  choice: அதற்கு யாவே ... என்றார்
  rationale: தெய்வீகப் பதிலைத் தொடங்கும் எபிரேயக் கதைநடை இணைப்பை இயல்பான தமிழில் தெளிவுபடுத்துகிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலவசனம் தெய்வீகப் பெயரை நேரடியாகப் பயன்படுத்துகிறது. அதை பொதுப் பட்டப்பெயராக மாற்றாமல் ‘யாவே’ என்று ஒலிபெயர்ப்பது மூலத்தின் தனிப்பெயர்த் தன்மையைப் பேணுகிறது.
- issue: யாவேயின் பதில் எந்தக் கேள்விக்குரியது
  choice: ‘அவன் இறங்கி வருவான்’ என்ற பதிலை இரண்டாவது கேள்விக்கான பதிலாகவே வைத்தல்
  alternative: கெயிலா நகரத்தார் தாவீதை ஒப்படைப்பார்கள் என்றும் பதிலை விரிவாக்குதல்
  rationale: இவ்வசனத்தின் எபிரேய உரையில் யாவேயின் பதில் יֵרֵד (‘அவன் இறங்கி வருவான்’) என்பதே. அடுத்த கேள்விக்கான பதிலை இவ்வசனத்துக்குள் முன்கூட்டியே சேர்க்காமல், உரையின் சுருக்கத்தையும் தொடர்ச்சியையும் காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பாகவும், வேண்டுதல் பகுதியில் மரியாதைமிக்க உயர்நடையுடனும் வடிவமைக்கப்பட்டுள்ளது. ‘உமது அடியான்’, ‘தெரிவியும்’ என்பவை தாவீதின் பணிவை வெளிப்படுத்துகின்றன; மற்ற பகுதிகள் சாதாரண வாசகர்களுக்குப் புரியும் தெளிவான நடையில் உள்ளன. அடிக்குறிப்புக் குறி அது விளக்கும் ‘அவன் கையில்’ என்ற தொடரின் பின்னரே வைக்கப்பட்டுள்ளது.
