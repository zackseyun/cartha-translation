    issue: “தெரிவியும்” is an unnatural or unclear imperative in modern standard Tamil.
    rationale: הַגֶּד־נָא is a polite imperative, 'please tell/make known.' “தயவுசெய்து உமது அடியானுக்கு அறிவியுங்கள்” conveys this directly in a respectful prayer register.
