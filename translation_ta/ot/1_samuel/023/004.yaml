base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/004.yaml
  text: David again inquired of the LORD, and the LORD answered him and said, “Rise, go down to Keilah, for I am giving the Philistines into your hand.”
translation:
  language: ta
  text: தாவீது மீண்டும் ஆண்டவரிடம் விசாரித்தான். ஆண்டவர் அவனுக்குப் பதிலளித்து, “எழுந்து, கேகிலாவுக்கு இறங்கிச் செல்; ஏனெனில் பெலிஸ்தியர்களை உன் கையில் ஒப்புக்கொடுக்கிறேன்” என்றார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לִשְׁאֹל בַּיהוָה
  choice: ஆண்டவரிடம் விசாரித்தான்
  rationale: இறைவனுடைய வழிகாட்டுதலைத் தேடிக் கேட்டல் என்ற எபிரெயச் சொற்றொடரின் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: יְהוָה
  choice: ஆண்டவர்
  rationale: திருநாமத்தைக் குறிக்கும் יהוה என்பதற்கான மரியாதைமிக்க, தமிழ் வேதாகம மரபில் பரவலாகப் புரிந்துகொள்ளப்படும் வடிவம்.
- source_word: קוּם רֵד
  choice: எழுந்து ... போ
  rationale: קוּם என்ற கட்டளையைத் தனியே காக்கிறது; கேகிலாவுக்குச் செல்வதைக் குறிக்கும் רֵד என்பதன் இடச்சார்ந்த ‘இறங்கிப் போ’ நுணுக்கம் தமிழில் இயல்பாக ‘போ’ என வழங்கப்படுகிறது.
- source_word: נֹתֵן ... בְּיָדֶךָ
  choice: உன் கையில் ஒப்புக்கொடுக்கிறேன்
  rationale: வெற்றி பெறும்படி ஒருவரின் அதிகாரத்திற்குள் எதிரிகளைத் தருதல் என்ற எபிரெய மரபுத்தொடரையும் நிகழ்கால வடிவத்தின் உடனடித்தன்மையையும் காக்கிறது.
- source_word: קְעִילָה
  choice: கேகிலா
  rationale: எபிரெய இடப்பெயரின் ஒலியை நெருக்கமாகப் பிரதிபலிக்கும் தமிழ் ஒலிபெயர்ப்பு.
- source_word: פְּלִשְׁתִּים
  choice: பெலிஸ்தியர்கள்
  rationale: இந்த மக்களினத்திற்கான தமிழில் நிலைபெற்ற பெயர்.
theological_decisions:
- issue: יהוה என்ற இறைத் திருநாமத்தின் மொழிபெயர்ப்பு
  choice: ஆண்டவர்
  alternative: யெகோவா / யாவே
  rationale: திருநாமத்தை ஒரு குறிப்பிட்ட உச்சரிப்பால் தீர்மானிக்காமல், மரியாதைமிக்க பாரம்பரியப் பதவிப் பெயரால் வழங்குகிறது.
- issue: நֹתֵן என்ற நிகழ்கால வினையின் பொருள்
  choice: ஒப்புக்கொடுக்கிறேன்
  alternative: ஒப்புக்கொடுப்பேன்
  rationale: எபிரெய மூலத்தின் நிகழ்காலப் பங்கேற்பு வடிவத்தைப் பாதுகாத்து, இறைவனின் உறுதியான செயலை எதிர்காலமாக மட்டும் மாற்றாமல் விடுகிறது.
translation_notes:
  register: நவீன செந்தமிழுக்கு ஏற்ற, தெளிவான மற்றும் மரியாதைமிக்க நடை. நேரடி உரையின் கட்டளைத் தொனியும் மூலத்தின் சுருக்கமும் காக்கப்பட்டுள்ளன.
