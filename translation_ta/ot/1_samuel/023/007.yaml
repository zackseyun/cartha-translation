  source_fidelity: 'முதன்மை உரை எபிரேயத்தின் பொருளைச் சரியாகக் கொடுக்கிறது: சவுலுக்குத் தகவல் அறிவிக்கப்பட்டது, தாவீது கேயிலாவுக்கு வந்திருந்தான், சவுல் அதை கடவுள் தாவீதைத் தன் கையில் ஒப்புவித்ததாகக் கருதினான், மேலும் அரணமைப்புள்ள நகருக்குள் நுழைந்ததால் அவன் சிக்குண்டதாகச் சொன்னான். דלתים என்பதன் இரட்டைக் கதவுத் தகடுகள் மற்றும் בריח என்பதன் ஒருமை குறுக்குத் தாழ்ப்பாள் ஆகியவை தெளிவாகச் சொல்லப்பட வேண்டும்.'
