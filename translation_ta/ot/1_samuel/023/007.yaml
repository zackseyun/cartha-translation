base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/007.yaml
  text: And it was reported to Saul that David had come to Keilah[a]. So Saul said, “God has delivered him into my hand[b], for he has shut himself in by entering a city with doors and bars.”
translation:
  language: ta
  text: தாவீது கேயிலாவுக்கு வந்திருப்பதாகச் சவுலுக்கு அறிவிக்கப்பட்டது. சவுல், “கடவுள் அவனை என் கையில் ஒப்புவித்துவிட்டார்[a]. ஏனெனில், இரட்டைக் கதவுகளும் குறுக்குத் தாழ்ப்பாளும் கொண்ட ஒரு நகரத்திற்குள் நுழைந்து, அவன் தன்னை அடைத்துக்கொண்டான்[b]” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கடவுள் அவனை என் அதிகாரத்திற்குள் கையளித்துவிட்டார்.” தாவீதின் நிலையை, கடவுள் அவனைத் தன் அதிகாரத்தில் ஒப்புவித்த செயலாகச் சவுல் விளக்குகிறான்.
    reason: lexical_alternative
  - marker: b
    text: “தன்னை அடைத்துக்கொண்டான்” என்பதை “அடைபட்டுவிட்டான்” என்றும் மொழிபெயர்க்கலாம்; எபிரேய வினை தற்சுட்டுப் பொருளிலோ செயப்பாட்டுப் பொருளிலோ புரிந்துகொள்ளப்படலாம். “இரட்டைக் கதவுகள்” என்பது இணையான இரு கதவுத் தகடுகளையும், “குறுக்குத் தாழ்ப்பாள்” என்பது அவற்றைப் பாதுகாக்கும் தாழ்ப்பாளையும் குறிக்கிறது.
    reason: textual_ambiguity_and_cultural_note
lexical_decisions:
- source_word: וַיֻּגַּד
  choice: அறிவிக்கப்பட்டது
  rationale: הֻפעל வினைவடிவின் செயப்பாட்டு உணர்வைப் பாதுகாத்து, இயல்பான நவீனத் தமிழில் செய்தி சவுலுக்குத் தெரிவிக்கப்பட்டதை வெளிப்படுத்துகிறது.
- source_word: בָא
  choice: வந்திருப்பதாக
  rationale: அறிக்கையின் நேரத்துக்கு முன்பே தாவீது கேயிலாவுக்கு வந்திருந்ததைத் தமிழில் இயல்பாகக் காட்டுகிறது.
- source_word: נִכַּר אֹתוֹ אֱלֹהִים בְּיָדִי
  choice: கடவுள் அவனை என் கையில் ஒப்புவித்துவிட்டார்
  rationale: נכר என்பதன் இச்சூழலுக்குரிய ‘ஒப்புவி/கையளி’ பொருளையும், בידי என்ற ‘என் அதிகாரத்துக்குள்’ என்னும் எபிரேய உருவகத்தையும் பாதுகாக்கிறது.
- source_word: נִסְגַּר
  choice: தன்னை அடைத்துக்கொண்டான்
  rationale: நகரத்திற்குள் நுழைந்ததன் மூலம் தாவீது தானே சிக்கிக்கொண்டான் என்ற சவுலின் கருத்தை இயல்பான தமிழில் தருகிறது; வினையின் செயப்பாட்டு சாத்தியம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: בְּעִיר דְּלָתַיִם וּבְרִיחַ
  choice: இரட்டைக் கதவுகளும் குறுக்குத் தாழும் உள்ள ஒரு நகரம்
  rationale: דלתים குறிக்கும் இணையான இரு கதவுத் தகடுகளையும், בריח குறிக்கும் அவற்றைப் பூட்டும் குறுக்குத் தாழையும் துல்லியமாகவும் புரியும்படியாகவும் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: தாவீதின் நிலையை கடவுளுடைய செயலாகச் சவுல் விளக்குவது
  choice: “கடவுள் அவனை என் கையில் ஒப்புவித்துவிட்டார்” என்று சவுலின் கூற்றை நேரடிப் பேச்சாகவே வழங்குதல்
  alternative: “கடவுள் அவனைத் தன்னிடம் ஒப்புவித்ததாக சவுல் நினைத்தான்” என்று உரையாளர் விலகி நிற்பதைச் சேர்த்தல்
  rationale: எபிரேய உரை சவுலின் கூற்றை நேரடியாகத் தருகிறது; அது உண்மை என்று உரையாளர் உறுதிப்படுத்துவதாகவோ தவறு என்று வெளிப்படையாக மறுப்பதாகவோ மொழிபெயர்ப்பு மாற்றக்கூடாது.
translation_notes:
  register: நவீனத் தரத் தமிழில், மரியாதையும் கதைநடைத் தெளிவும் காக்கப்பட்டுள்ளன. ‘என் கையில்’ என்ற வேதாகம உருவகம் தமிழிலும் புரியக்கூடியதால் அப்படியே வைக்கப்பட்டுள்ளது. நகரக் கதவுகளின் பண்டைய அமைப்பை விளக்க ‘இரட்டைக் கதவுகள்’ மற்றும் ‘குறுக்குத் தாழ்’ பயன்படுத்தப்பட்டுள்ளன.
