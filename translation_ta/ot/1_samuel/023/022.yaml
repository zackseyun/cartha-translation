source:
  edition: WLC
  text: לְכוּ נָ֞א הָכִ֣ינוּ ע֗וֹד וּ/דְע֤וּ וּ/רְאוּ֙ אֶת מְקוֹמ/וֹ֙ אֲשֶׁ֣ר תִּֽהְיֶ֣ה רַגְל֔/וֹ מִ֥י רָאָ֖/הוּ שָׁ֑ם כִּ֚י אָמַ֣ר אֵלַ֔/י עָר֥וֹם יַעְרִ֖ם הֽוּא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/022.yaml
  text: Please go and make further preparations[a], and know and see his place where his foot is, who has seen him there; for I am told[c][b], ‘He is very cunning.’
translation:
  language: ta
  text: “தயவுசெய்து போய், மேலும் ஆயத்தங்களைச் செய்யுங்கள். அவனுடைய இடம் எது—அவன் கால் பதிக்கும் இடம் எது—என்பதையும், அங்கே அவனைப் பார்த்தவர் யார் என்பதையும் நன்கு அறிந்து பாருங்கள். ஏனெனில், ‘அவன் மிகத் தந்திரமாக நடந்துகொள்கிறான்’ என்று என்னிடம் சொல்லப்பட்டது[b][c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: அல்லது, “ஏனெனில், ‘அவன் மிகத் தந்திரமாக நடந்துகொள்கிறான்’ என்று அவன் என்னிடம் சொன்னான்.” ‘சொன்னான்’ என்பதன் எழுவாய் எபிரெய உரையில் வெளிப்படையாகக் குறிப்பிடப்படவில்லை.
    reason: alternative_reading
  - marker: c
    text: எபிரெயத்தில் ஒரே வேர்ச் சொற்கள் இணைக்கப்பட்டு வலியுறுத்தப்படுகின்றன; நேரடியாக, “தந்திரமாக அவன் தந்திரம் செய்கிறான்” என்பதுபோல் உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָכִינוּ עוֹד
  choice: இன்னும் ஆயத்தம் செய்யுங்கள்
  rationale: הכין என்பதன் Hiphil வடிவம் ‘ஆயத்தம் செய்தல், தயார்படுத்துதல்’ என்ற பொருளைத் தருகிறது; עוֹד மேலும் செய்ய வேண்டிய ஆயத்தத்தை வலியுறுத்துகிறது.
- source_word: וּדְעוּ וּרְאוּ
  choice: நன்கு அறிந்து பாருங்கள்
  rationale: இரு கட்டளை வினைகளையும் தக்கவைத்து, கவனமான விசாரணையை வலியுறுத்தும் எபிரெயக் கூட்டு அமைப்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: מְקוֹמוֹ אֲשֶׁר תִּהְיֶה רַגְלוֹ
  choice: அவன் கால் பதிக்கும் அவனுடைய இடம் எது
  rationale: מְקוֹמוֹ-இல் உள்ள மூன்றாம் நபர் ஒருமை உரிமை விகுதியையும், ‘அவன் கால் இருக்கும்/பதிக்கும் இடம்’ என்ற மூல மொழியின் உருவகத்தையும் தக்கவைக்கிறது.
- source_word: מִי רָאָהוּ שָׁם
  choice: அங்கே அவனைப் பார்த்தது யார்
  rationale: அவனை அந்த இடத்தில் நேரில் கண்ட சாட்சியை அடையாளம் காணும் கேள்வியாக இயல்பான தமிழில் மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: כִּי אָמַר אֵלַי
  choice: ஏனெனில் … என்று என்னிடம் சொல்லப்பட்டது
  rationale: אָמַר என்பது மூன்றாம் நபர் ஆண்பால் ஒருமை வினையாக இருந்தாலும், அதன் எழுவாய் வெளிப்படையாகக் குறிப்பிடப்படவில்லை. செயப்பாட்டு வடிவம் எழுவாயை ஊகித்து நிரப்பாமல் அந்தத் தெளிவின்மையைப் பாதுகாக்கிறது.
- source_word: עָרוֹם יַעְרִם הוּא
  choice: அவன் மிகத் தந்திரமாக நடந்துகொள்கிறான்
  rationale: ஒரே வேர் சார்ந்த பெயரடை மற்றும் வினைச்சொல் இணைந்து தரும் வலியுறுத்தலை ‘மிகத்’ என்பதன் மூலம் இயல்பான தமிழில் வெளிப்படுத்துகிறது; சவுலின் சந்தேகப் பார்வைக்கேற்ற எதிர்மறை நிழலையும் ‘தந்திரமாக’ தக்கவைக்கிறது.
theological_decisions:
- issue: כִּי אָמַר אֵלַי என்பதில் பேசுபவரின் அடையாளம்
  choice: எழுவாயைக் குறிப்பிடாமல் ‘என்னிடம் சொல்லப்பட்டது’ என்று மொழிபெயர்த்தல்
  alternative: ‘அவன் என்னிடம் சொன்னான்’
  rationale: எபிரெய வினை ஆண்பால் ஒருமையாக இருந்தாலும் அதன் எழுவாய் உரையில் வெளிப்படையாக இல்லை; ஒருவரைத் திட்டவட்டமாக அடையாளப்படுத்துவது மூலத்திலுள்ள உண்மையான தெளிவின்மையை நீக்கிவிடும்.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் மரியாதையான மற்றும் கண்ணியமான நடையைக் கையாள்கிறது. மூலத்தின் இரட்டை கட்டளைகளும், ‘கால்’ என்ற உருவகமும், சொல்லியவர் யார் என்ற தெளிவின்மையும் அடிக்குறிப்புகளுடன் பாதுகாக்கப்பட்டுள்ளன.
