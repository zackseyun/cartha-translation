base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/002.yaml
  text: So David inquired of Yahweh[a], saying, “Shall I go and strike these Philistines?” And Yahweh said to David, “Go and strike the Philistines, and save Keilah.”
translation:
  language: ta
  text: அப்போது தாவீது யாவேயிடம், “நான் போய் இந்தப் பெலிஸ்தியர்களைத் தாக்கலாமா?” என்று விசாரித்தார். யாவே தாவீதிடம், “போய் பெலிஸ்தியர்களைத் தாக்கி, கேயிலாவைக் காப்பாற்று[a]” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கேயிலாவை விடுவி.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁאַל ... בַּיהוָה
  choice: யாவேயிடம் விசாரித்து
  rationale: שׁאל உடன் בַּיהוָה வருவது சாதாரணமாகக் கேள்வி கேட்பதைவிட, இறைவனிடம் வழிகாட்டுதலை நாடுவதைக் குறிக்கிறது. ‘விசாரித்து’ அந்த ஆலோசனை நாடும் பொருளை இயல்பாகத் தக்கவைக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய மூலத்தில் வரும் உடன்படிக்கைப் பெயரைப் பட்டப்பெயராக மாற்றாமல், தமிழில் அறியப்பட்ட ஒலிபெயர்ப்பான ‘யாவே’ என வழங்குகிறது.
- source_word: הַאֵלֵךְ וְהִכֵּיתִי
  choice: நான் போய் ... தாக்கலாமா?
  rationale: கேள்வித் துகளுடன் வரும் வினை வடிவம், செயல்பட வேண்டுமா எனத் தாவீது வழிகாட்டுதல் நாடுவதை வெளிப்படுத்துகிறது. ‘தாக்கலாமா?’ என்பது நவீனத் தமிழில் இயல்பான ஆலோசனைக் கேள்வி.
- source_word: בַּפְּלִשְׁתִּים הָאֵלֶּה
  choice: இந்தப் பெலிஸ்தியர்களை
  rationale: הָאֵלֶּה என்பதன் சுட்டுப் பொருளை ‘இந்த’ என்று வெளிப்படையாகத் தக்கவைக்கிறது.
- source_word: לֵךְ וְהִכִּיתָ
  choice: போய் ... தாக்கி
  rationale: நேரடியான கட்டளையையும், தாவீதின் கேள்வியில் வந்த נכה என்ற வினையின் மறுபயன்பாட்டையும் தக்கவைக்கிறது; ‘தோற்கடி’ என்று முடிவை மிகைப்படுத்தவில்லை.
- source_word: וְהוֹשַׁעְתָּ
  choice: காப்பாற்று
  rationale: ישע இங்கு எதிரிகளின் ஆபத்திலிருந்து நகரை மீட்பதைக் குறிக்கிறது. ‘காப்பாற்று’ இயல்பான முதன்மை மொழிபெயர்ப்பு; ‘விடுவி’ சூழலுக்கேற்ற மாற்று.
- source_word: קְעִילָה
  choice: கேயிலா
  rationale: எபிரெய இடப்பெயரின் ஒலியை நவீனத் தமிழில் தெளிவாக ஒலிபெயர்க்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூலத்தில் தனிப்பட்ட இறைப்பெயர் நேரடியாக வருகிறது. அதை பொதுவான பட்டப்பெயராக மாற்றாமல் ஒலிபெயர்ப்பது மூலத்தின் வேறுபாட்டைப் பாதுகாக்கிறது.
- issue: וְהוֹשַׁעְתָּ என்பதின் பொருள்
  choice: காப்பாற்று
  alternative: விடுவி
  rationale: இராணுவச் சூழலில் இது கேயிலா நகரை உடனடியான ஆபத்திலிருந்து மீட்பதைக் குறிக்கிறது; ஆன்மீக இரட்சிப்பு என்ற பொருளைத் தனியாக இறக்குமதி செய்யவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பாகவும் மதிப்புடனும் அமைக்கப்பட்டுள்ளது. தாவீதின் கேள்விக்கும் யாவேயின் பதிலுக்கும் இடையிலான ‘போய்—தாக்கு’ என்ற சொல் ஒற்றுமை முடிந்தவரை பாதுகாக்கப்பட்டுள்ளது.
