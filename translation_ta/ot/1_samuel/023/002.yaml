  source_fidelity: 'மூலத்தின் முக்கியக் கூறுகள் சரியாக உள்ளன: தாவீது யாவேயிடம் வழிகாட்டுதல் கேட்பது, குறிப்பிட்ட பெலிஸ்தியர்களைத் தாக்கலாமா என்ற கேள்வி, மேலும் கேயிலாவைக் காப்பாற்றும்படியான யாவேயின் கட்டளை ஆகியவைத் துல்லியமாக வெளிப்படுத்தப்படுகின்றன. “இந்த” என்பது הָאֵלֶּה-யின் சுட்டுப் பொருளையும், “காப்பாற்று” என்பது וְהוֹשַׁעְתָּ-யின் பொருளையும் நன்றாகத் தருகிறது.'
