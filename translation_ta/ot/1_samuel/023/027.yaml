  text: ஆனால் ஒரு தூதுவன் சவுலிடம் வந்து, “விரைந்து செல்லுங்கள்; பெலிஸ்தியர்கள் நாட்டின்மீது படையெடுத்திருக்கிறார்கள்” என்றான்.
