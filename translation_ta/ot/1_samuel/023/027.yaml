lexical_decisions:
- source_word: מַלְאָךְ
  choice: தூதுவன்
  rationale: இச்சூழலில் செய்தி கொண்டுவரும் மனிதத் தூதனைக் குறிக்கிறது; ‘தேவதூதன்’ என்ற பொருள் இங்கு பொருந்தாது.
- source_word: מַהֲרָה וְלֵכָה
  choice: விரைந்து வாரும்
  rationale: அவசரமாகச் செல்லும்படி கூறும் கட்டளையை, தூதுவன் சவுலைத் தன்னுடன் வர அழைக்கும் இயல்பான தமிழ் வழக்கில் தருகிறது.
- source_word: פָשְׁטוּ
  choice: படையெடுத்திருக்கிறார்கள்
  rationale: திடீர்த் தாக்குதல் அல்லது கொள்ளைப் படையெடுப்பு நடத்துதல் என்ற இராணுவச் சூழலுக்குரிய பொருளை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: עַל הָאָרֶץ
  choice: நாட்டின்மீது
  rationale: ‘நிலம்/நாடு மீது’ என்ற மூலத்தின் திசை மற்றும் எதிர்ப்பு உணர்வைப் பாதுகாக்கிறது.
