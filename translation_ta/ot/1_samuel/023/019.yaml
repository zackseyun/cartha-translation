base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/019.yaml
  text: Then the Ziphites went up to Saul at Gibeah[a], saying, “Is not David hiding among us in the strongholds in the wooded area, on the hill of Hachilah[b], which is to the right of the Jeshimon?”
translation:
  language: ta
  text: அப்போது சீப்பியர்கள் கிபியாவில் இருந்த சவுலிடம் போய், “தாவீது எங்களிடையே காட்டுப்பகுதியில்[a] உள்ள அரணிடங்களில், எசிமோனுக்கு வலப்புறத்தில் இருக்கும் அகிலா குன்றின்மேல்[b] ஒளிந்துகொண்டிருக்கிறான் அல்லவா?” என்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “காட்டுப்பகுதியில்” என்பதற்குப் பதிலாக, இந்தச் சொல்லை இடப்பெயராகக் கொண்டு “ஓரேஷில்” என்றும் மொழிபெயர்க்கலாம்.
    reason: alternative_reading
  - marker: b
    text: “எசிமோனுக்கு வலப்புறத்தில்” என்பது நேரடியான பொருள். எபிரெய நிலவியல் வழக்கில் இது “எசிமோனுக்குத் தெற்கே” என்றும் குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲלוּ
  choice: போய்
  rationale: עלה இங்கு கிபியாவை நோக்கிய பயணத்தைக் குறிக்கிறது. தமிழில் ‘மேலே போய்’ என்பது தேவையற்ற நிலத்தோற்ற விளக்கமாக ஒலிக்கக்கூடும்; ‘போய்’ இயல்பாக இயக்கத்தைத் தருகிறது.
- source_word: זִפִים
  choice: சீப்பியர்கள்
  rationale: சீப் ஊரைச் சேர்ந்த மக்களைக் குறிக்கும் பன்மை இனப்பெயர்.
- source_word: הַגִּבְעָתָה
  choice: கிபியாவில் இருந்த
  rationale: இடப்பெயருடன் சேர்ந்த திசைச் சுட்டு கிபியாவை நோக்கிய இயக்கத்தைக் காட்டுகிறது; சவுலின் இருப்பிடத்தைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: הֲלוֹא
  choice: அல்லவா?
  rationale: ஒப்புதலை எதிர்பார்க்கும் வினாவை இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: מִסְתַּתֵּר
  choice: ஒளிந்திருக்கிறான்
  rationale: தன்னைத்தானே மறைத்துக்கொண்டு தொடர்ந்திருக்கிற நிலையை நிகழ்கால வடிவில் தெரிவிக்கிறது.
- source_word: עִמָּנוּ
  choice: எங்கள் பகுதியில்
  rationale: சொல்லுக்கு நேராக ‘எங்களுடன்’ என்றாலும், இச்சூழலில் சீப்பியர்களின் நிலப்பகுதிக்குள் இருப்பதையே குறிக்கிறது.
- source_word: בַמְּצָדוֹת
  choice: அரணான இடங்களில்
  rationale: பாதுகாப்புக்கும் தற்காப்புக்கும் ஏற்ற உறுதியான இடங்கள் என்ற பொருளை பொதுவாசகருக்கு தெளிவாக வழங்குகிறது.
- source_word: בַּחֹרְשָׁה
  choice: காட்டுப்பகுதியிலுள்ள
  rationale: חֹרְשָׁה என்பதை மரங்கள் நிறைந்த பகுதியைக் குறிக்கும் பொதுப்பெயராக எடுத்துள்ளது; ‘ஓரேஷ்’ என்ற இடப்பெயர் வாசிப்பையும் அடிக்குறிப்பில் பாதுகாக்கிறது.
- source_word: בְּגִבְעַת הַחֲכִילָה
  choice: அகிலா குன்றின்மேல்
  rationale: גִּבְעָה என்பதன் நிலத்தோற்றப் பொருளையும், חֲכִילָה என்ற இடப்பெயரையும் இயல்பாகத் தருகிறது.
- source_word: אֲשֶׁר מִימִין הַיְשִׁימוֹן
  choice: எசிமோனுக்கு வலப்புறத்தில் இருக்கும்
  rationale: மூலத்தின் ‘வலப்புறம்’ என்ற திசைமொழியை நேரடியாகப் பாதுகாக்கிறது; அது தெற்கைக் குறிக்கக்கூடிய எபிரெய நிலவியல் வழக்கை அடிக்குறிப்பில் விளக்குகிறது.
