translation_notes:
  register: நவீன தரமான தமிழில், dignified ஆனால் எளிதில் புரியும் உரைநடை பயன்படுத்தப்பட்டுள்ளது. இடப்பெயர்கள் தமிழ் வேதாகம மரபுக்கு ஏற்ற ஒலிபெயர்ப்பில் தரப்பட்டுள்ளன. மூலத்தில் உள்ள חֹרְשָׁה மற்றும் מִימִין ஆகிய இரு பொருள் சாத்தியங்களும் ஒரே அடிக்குறிப்பில் தெளிவாகப் பாதுகாக்கப்பட்டுள்ளன.
