  source_fidelity: மூலத்தின் முக்கிய இடங்கள், தொடர்நிலை ஒளிதல், மற்றும் வலப்புறம் என்ற நேரடியான திசைக்குறிப்பு ஆகியவை பெரும்பாலும் தக்கவைக்கப்பட்டுள்ளன. ஆனால் ‘எங்கள் பகுதியில்’ என்பது עִמָּנוּ (“எங்களுடன்/எங்களிடையே”) என்பதைக் கொஞ்சம் அதிகமாக விளக்குகிறது; ‘எங்களிடையே’ மூலத்திற்கு நெருக்கமானது. மேலும், காட்டுப்பகுதி மற்றும் அகிலா குன்றின் இடத்தொடர்கள் தெளிவாக அமைய வேண்டும்.
  naturalness: ‘அரணான இடங்களில்’ நவீன தரமான தமிழில் சற்றே செயற்கையாக உள்ளது. ‘அரணிடங்களில்’ என்பது மலைவனாந்தரத்தில் உள்ள பாதுகாப்பான/தற்காப்பான இடங்கள் என்ற பொருளையும் இயல்பான நடையையும் தருகிறது.
