translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. பெயர்கள் ‘சவுல்,’ ‘தாவீது,’ ‘மாவோன்’ எனத் தமிழாக்கப்பட்டுள்ளன. எபிரெயத்தில் குறிப்பிடப்படாத தகவலாளர்களின் அடையாளம் தீர்மானிக்கப்படவில்லை; ‘பாறை’ குறித்த இடவியல் தெளிவின்மையும் அடிக்குறிப்புடன் பாதுகாக்கப்பட்டுள்ளது.
