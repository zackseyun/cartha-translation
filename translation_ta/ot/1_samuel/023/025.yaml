base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/025.yaml
  text: So Saul and his men went to seek him. And they told David[a], so he went down to the rock and stayed in the wilderness of Maon. When Saul heard, he pursued David in the wilderness of Maon.
translation:
  language: ta
  text: எனவே, சவுலும் அவனுடைய ஆட்களும் தாவீதைத் தேடிச் சென்றார்கள். அதைத் தாவீதுக்குத் தெரிவித்தார்கள். அவன் பாறைக்கு இறங்கி, மாவோன் வனாந்தரத்தில் தங்கினான். இதைக் கேள்விப்பட்ட சவுல், மாவோன் வனாந்தரத்தில் தாவீதைத் துரத்தினான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “பாறை” என்பதற்கு “பாறைக் குன்று” அல்லது “செங்குத்துப் பாறை” என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல், அடையாளம் காணத்தக்க ஒரு பாறை அரணையோ பாறை அமைப்பையோ குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְבַקֵּשׁ
  choice: தாவீதைத் தேடிச் சென்றார்கள்
  rationale: இந்த வினையெச்சம் சவுலும் அவனுடைய ஆட்களும் சென்றதன் நோக்கத்தைத் தெரிவிக்கிறது. எபிரெயத்தில் வெளிப்படையாக இல்லாத செயப்படுபொருள் சூழலிலிருந்து தாவீது என நிரப்பப்படுகிறது.
- source_word: וַיַּגִּדוּ לְדָוִד
  choice: இதைத் தாவீதிடம் தெரிவித்தார்கள்
  rationale: எபிரெய வினை பன்மைச் செயப்பாட்டு வடிவில் உள்ளது; செய்பவர்கள் குறிப்பிடப்படாத நிலையையும் தமிழில் இயல்பாகப் பாதுகாக்கிறது.
- source_word: וַיֵּרֶד הַסֶּלַע
  choice: அவன் பாறையை நோக்கி இறங்கிச் சென்று
  rationale: וַיֵּרֶד என்பதன் கீழ்நோக்கிய இயக்கத்தையும் הַסֶּלַע குறிக்கும் இலக்கிடத்தையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது; தாவீது பாறையின் கீழே சென்றான் என்று தேவையின்றி தீர்மானிக்கவில்லை.
- source_word: הַסֶּלַע
  choice: பாறை
  rationale: இந்தச் சொல் பாறை, பாறைக் குன்று அல்லது செங்குத்துப் பாறை அமைப்பைக் குறிக்கலாம். முதன்மை உரையில் பொதுவான நேரடிப் பொருள் வைக்கப்பட்டு, மாற்றுகள் அடிக்குறிப்பில் தரப்படுகின்றன.
- source_word: וַיֵּשֶׁב
  choice: தங்கினான்
  rationale: இக்கதைச் சூழலில் ஒரு இடத்தில் தற்காலிகமாகத் தங்கியிருப்பதைக் குறிக்கும் இயல்பான நவீனத் தமிழ்.
- source_word: מִדְבַּר מָעוֹן
  choice: மாவோன் வனாந்தரம்
  rationale: מִדְבָּר என்பது மணற்பாலை மட்டும் அல்லாமல் மக்கள் குடியிருப்பு குறைந்த வறண்ட வெளிப்பகுதியையும் குறிக்கலாம்; ‘வனாந்தரம்’ அந்தப் பரந்த பொருளைத் தக்கவைக்கிறது.
- source_word: וַיִּרְדֹּף אַחֲרֵי
  choice: பின்தொடர்ந்து சென்றான்
  rationale: தாவீதைக் கைப்பற்றும் நோக்குடன் சவுல் தொடர்ந்து சென்ற செயலை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: וַיֵּלֶךְ שָׁאוּל וַאֲנָשָׁיו
  choice: எனவே, சவுலும் அவனுடைய ஆட்களும் ... சென்றார்கள்
  rationale: தொடர்ச்சியான கதைநடையையும் முந்தைய நிகழ்வின் விளைவையும் ‘எனவே’ சுட்டுகிறது; பன்மை எழுவாய்க்கு ஏற்ற தமிழ் வினை பயன்படுத்தப்பட்டுள்ளது.
