source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר אֵלָ֜י/ו אַל תִּירָ֗א כִּ֠י לֹ֤א תִֽמְצָאֲ/ךָ֙ יַ֚ד שָׁא֣וּל אָבִ֔/י וְ/אַתָּה֙ תִּמְלֹ֣ךְ עַל יִשְׂרָאֵ֔ל וְ/אָנֹכִ֖י אֶֽהְיֶה לְּ/ךָ֣ לְ/מִשְׁנֶ֑ה וְ/גַם שָׁא֥וּל אָבִ֖/י יֹדֵ֥עַ כֵּֽן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/017.yaml
  text: He said to him[a], “Do not be afraid, for the hand of Saul my father will not find you. You will reign over Israel, and I will be second to you[b]. Even Saul my father knows this.”
translation:
  language: ta
  text: “பயப்படாதே; என் தந்தையான சவுலின் கை உன்னை அடையாது[a]. நீ இஸ்ரவேலின் மேல் அரசாள்வாய்; நான் உனக்கு இரண்டாமவனாக இருப்பேன்[b]. இது உண்மை என்று என் தந்தையான சவுலும்கூட அறிந்திருக்கிறார்” என்று அவன் அவனிடம் கூறினான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என் தந்தையான சவுலின் அதிகாரம் உன்னை எட்டாது.” எபிரெயத்தில், “என் தந்தையான சவுலின் கை உன்னை அடையாது” என்று உள்ளது; இங்கே “கை” என்பது அதிகாரம் அல்லது பிடியைக் குறிக்கும் உருவகம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “நான் உனக்குப் பிறகு இரண்டாம் அதிகாரியாக இருப்பேன்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תִּירָא
  choice: பயப்படாதே
  rationale: எதிர்மறைக் கட்டளையின் வலிமையை இயல்பான நவீனத் தமிழில் நேரடியாகத் தெரிவிக்கிறது.
- source_word: לֹא תִמְצָאֲךָ יַד שָׁאוּל אָבִי
  choice: என் தந்தை சவுலின் கை உன்னைக் கண்டுபிடிக்காது
  rationale: ‘கை’ என்பதை அதிகாரம் அல்லது பிடியின் உருவகமாகவும், ‘கண்டுபிடி’ என்ற எபிரெய வினை உருவகத்தையும் பிரதான உரையில் பாதுகாக்கிறது; தமிழில் இதன் பொருளை அடிக்குறிப்பு தெளிவுபடுத்துகிறது.
- source_word: וְאַתָּה תִּמְלֹךְ עַל יִשְׂרָאֵל
  choice: நீ இஸ்ரவேல்மேல் அரசாள்வாய்
  rationale: מָלַךְ என்ற வினைச்சொல்லின் வடிவத்தையும் அரசாட்சிப் பொருளையும் நேரடியாகத் தக்கவைக்கிறது.
- source_word: וְאָנֹכִי אֶהְיֶה לְּךָ לְמִשְׁנֶה
  choice: நான் உனக்கு இரண்டாம் நிலையில் இருப்பேன்
  rationale: מִשְׁנֶה குறிக்கும் இரண்டாம் தரத்தையும் கீழ்நிலை உறவையும் தக்கவைக்கிறது; நவீன நிர்வாகப் பதவிப்பெயரை பிரதான உரையில் சேர்ப்பதைத் தவிர்க்கிறது.
- source_word: וְגַם שָׁאוּל אָבִי יֹדֵעַ כֵּן
  choice: இது இப்படித்தான் என்று என் தந்தை சவுலும்கூட அறிந்திருக்கிறார்
  rationale: כֵּן முந்தைய கூற்றுகளின் உண்மையைச் சுட்டுவதைக் ‘இது இப்படித்தான்’ என்று வெளிப்படையாகவும் இயல்பாகவும் தெரிவிக்கிறது; וְגַם என்பதன் வலியுறுத்தலை ‘கூட’ தக்கவைக்கிறது.
theological_decisions:
- issue: தாவீதின் வருங்கால அரசாட்சியும் யோனத்தானின் கீழ்நிலைப் பங்கும் எவ்வளவு வெளிப்படையாக இறையியல் கூற்றாகத் தரப்பட வேண்டும்
  choice: அரசியல் மற்றும் இறைநடத்தல் சார்ந்த எதிர்பார்ப்பை வசனம் கூறும் அளவிலேயே நேரடியாக மொழிபெயர்த்தல்
  alternative: இதைத் தெய்வீக நியமனத்தை வெளிப்படையாக அறிவிக்கும் தீர்க்கதரிசனமாக விரிவுபடுத்துதல்
  rationale: இந்த வாக்கியத்தில் தாவீது அரசாள்வான் என்றும் யோனத்தான் அவனுக்கு இரண்டாம் நிலையில் இருப்பான் என்றும் கூறப்படுகிறது; ஆனால் கர்த்தர் அல்லது உடன்படிக்கை வெளிப்படையாகக் குறிப்பிடப்படவில்லை. ஆகவே கூடுதல் உடன்படிக்கை அல்லது மேசியா சார்ந்த மொழி சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையும் கண்ணியமும் பேணப்பட்டுள்ளன. மூலத்தில் பேசுபவரும் கேட்பவரும் சுட்டுப்பெயர்களால் மட்டுமே குறிப்பிடப்படுவதால், பெயர்களை உரைக்குள் சேர்த்து அந்த மறைமுகத்தன்மையை நீக்காமல் ‘அவன் அவனிடம்’ எனத் தக்கவைத்துள்ளது. தந்தையைப் பற்றிப் பேசும் சூழலுக்கேற்ப இறுதி வினையில் மரியாதைப் பன்மை பயன்படுத்தப்பட்டுள்ளது.
