  verdict: revise
  source_fidelity: 'மூலத்தின் முக்கியக் கருத்துகள் பாதுகாக்கப்பட்டுள்ளன: பயப்பட வேண்டாமென்ற கட்டளை, சவுலின் ‘கை’ என்ற உருவகம், தாவீதின் அரசாட்சி, யோனத்தானின் இரண்டாம் நிலை, சவுலின் அறிவு ஆகியவை அனைத்தும் உள்ளன. ஆனால் ‘கை உன்னைக் கண்டுபிடிக்காது’ என்பது தமிழில் இயல்பற்றதாகவும், எபிரெய ‘கை’யின் அடைதல்/பிடித்தல் சார்ந்த உருவகப் பொருளைத் தெளிவாகக் காட்டாததாகவும் உள்ளது. ‘உன்னை அடையாது’ என்பது உருவகத்தையும் வினையின் நோக்கத்தையும் நன்றாகத் தக்கவைக்கிறது.'
  naturalness: ‘நான் உனக்கு இரண்டாம் நிலையில் இருப்பேன்’ என்பது புரிந்துகொள்ளத்தக்கது; ஆயினும் ஒருவருக்குரிய உறவுநிலையைச் சொல்வதில் ‘நான் உனக்கு இரண்டாமவனாக இருப்பேன்’ என்பது நவீனத் தரத் தமிழில் அதிக இயல்பானது. ‘இது இப்படித்தான் என்று’ என்பதற்குப் பதில் ‘இது உண்மை என்று’ என்பது כֵּן சுட்டும் முந்தைய கூற்றின் உண்மையைத் தமிழில் சீராக வெளிப்படுத்துகிறது.
  terminology: ‘இஸ்ரவேலின் மேல் அரசாள்வாய்’ என்பது מלך על என்பதற்கு ஏற்றது. ‘என் தந்தையான சவுல்’ என்பது ஆபியின் உரிமைத் தொடர்பைத் தெளிவாகவும் இயல்பாகவும் தருகிறது. ‘இரண்டாமவனாக’ என்பது לְמִשְׁנֶה குறிக்கும் இரண்டாம் தர/கீழ்ப்பட்ட நிலையைக் காக்கிறது; நவீன நிர்வாகப் பதவியை பிரதான உரையில் திணிப்பதில்லை.
