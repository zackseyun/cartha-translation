base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/009.yaml
  text: When David learned that Saul was secretly plotting harm against him[a], he said to Abiathar the priest[b], “Bring the ephod here.”
translation:
  language: ta
  text: சவுல் தாவீதுக்கு எதிராக இரகசியமாகத் தீங்கு விளைவிக்கத் திட்டமிட்டுக்கொண்டிருந்ததைத் தாவீது அறிந்தான்[a]. அப்போது அவன் ஆசாரியனாகிய அபியத்தாரிடம், “ஏபோத்தை[b] இங்கே கொண்டுவா” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சவுல் தாவீதுக்கு எதிராகத் தீமையை வகுத்துக்கொண்டிருந்ததைத் தாவீது அறிந்தான்.”
    reason: lexical_alternative
  - marker: b
    text: இந்தக் கதைச் சூழலில், ஏபோத்து என்பது கடவுளின் வழிகாட்டுதலை நாடுவதுடன் தொடர்புடைய ஆசாரியப் பொருள்.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֵּדַע
  choice: அறிந்தபோது
  rationale: கதையின் இந்தக் கட்டத்தில் தாவீது தகவலை அறிந்துகொண்டதை இயல்பான தமிழில் தெரிவிக்கிறது; எபிரெய வினையின் கதைத் தொடரையும் அடுத்த செயலைத் தூண்டும் சூழலையும் இணைக்கிறது.
- source_word: כִּי
  choice: …என்பதை / …இருந்ததை
  rationale: தாவீது அறிந்த செய்தியின் உள்ளடக்கத்தை அறிமுகப்படுத்தும் இணைப்பாக இருப்பதால், தமிழில் பெயரெச்சத் தொடருடன் ‘இருந்ததை’ என இயல்பாக அமைக்கப்பட்டுள்ளது.
- source_word: עָלָיו
  choice: தனக்கு எதிராக
  rationale: தீங்கு குறித்த அடுத்த சொற்றொடருடன் சேர்ந்து பகைமையான நோக்கைக் காட்டுவதால், ‘எதிராக’ என்பது சூழலுக்கேற்ற தமிழ் வடிவம்.
- source_word: מַחֲרִישׁ
  choice: இரகசியமாகத் … திட்டமிட்டுக்கொண்டிருந்ததை
  rationale: இந்த இடத்தில் சொல்லுக்கு தீய திட்டம் வகுத்தல் என்ற பொருளும் மறைவான செயலின் நிழற்பொருளும் உள்ளன; வினையெச்சத்தின் தொடர்நிலையை ‘திட்டமிட்டுக்கொண்டிருந்த’ காக்கிறது.
- source_word: הָרָעָה
  choice: தீங்கு செய்ய
  rationale: சவுல் தாவீதுக்குச் செய்ய நினைத்த சேதத்தைத் தெளிவாகக் குறிக்கிறது; ‘தீமை’ என்ற விரிவான அறநெறிசார் சொல்லை மட்டும் கொண்டு பொருளை அளவுக்கு மீறி விரிவுபடுத்தவில்லை.
- source_word: אֶל אֶבְיָתָר הַכֹּהֵן
  choice: ஆசாரியனாகிய அபியத்தாரிடம்
  rationale: அபியத்தாரின் பெயரையும் அவரது பணிநிலையையும் தெளிவாகவும் இயல்பான தமிழிலும் தருகிறது.
- source_word: הַגִּישָׁה
  choice: இங்கே கொண்டுவா
  rationale: ஹிபில் கட்டளையின் ‘அருகில் கொண்டுவரு/முன்வை’ என்ற வலிமையை, இச்சூழலில் நேரடியான இயல்பான தமிழ் கட்டளையாக வழங்குகிறது.
- source_word: הָאֵפוֹד
  choice: ஏபோத்தை
  rationale: குறிப்பிட்ட ஆசாரியப் பொருளைக் குறிக்கும் நிலைபெற்ற ஒலிபெயர்ப்பு; பொதுப்பெயராக மொழிபெயர்த்தால் அதன் தனித்துவமும் கதையில் அதன் பங்கும் மறைந்துவிடும்.
theological_decisions:
- issue: מַחֲרִישׁ הָרָעָה என்பதில் சவுலின் நோக்கின் தன்மை
  choice: சவுல் தாவீதுக்கு எதிராக இரகசியமாகத் தீங்கு செய்யத் திட்டமிட்டுக்கொண்டிருந்தான்
  alternative: சவுல் தாவீதுக்கு எதிராகத் தீமை வகுத்துக்கொண்டிருந்தான்
  rationale: எபிரெயச் சொற்றொடரில் பகைமையான திட்டமிடலும் மறைவு நிழற்பொருளும் உள்ளன. ‘தீங்கு’ உடனடி அச்சுறுத்தலைத் தெளிவாக்குகிறது; ‘தீமை’ என்ற மாற்றுப் பொருளையும் அடிக்குறிப்பு பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘ஏபோத்து’ என்ற குறிப்பிட்ட பண்பாட்டுச் சொல் தக்கவைக்கப்பட்டு அடிக்குறிப்பில் சுருக்கமாக விளக்கப்பட்டுள்ளது; மூலத்தின் பொருள் நிழல்கள் மாற்று வாசிப்பாகப் பாதுகாக்கப்பட்டுள்ளன.
