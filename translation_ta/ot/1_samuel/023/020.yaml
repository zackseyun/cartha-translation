  naturalness: “உங்கள் உள்ளத்தின் முழு விருப்பத்தின்படியே இறங்கி வாருங்கள்” புரியத்தக்கதாக இருந்தாலும், ‘இறங்கி வர வேண்டும் என்ற’ விருப்பம் என்பதைச் சொல்வதால் தமிழில் வாக்கிய உறவு தெளிவாகிறது. “உங்கள் உள்ளம் விரும்பியபடியெல்லாம்” நவீன நிலையான தமிழில் இயல்பாகவும், לְכָל என்பதன் முழுமைச் சாயலையும் தக்கவைக்கவும் செய்கிறது.
