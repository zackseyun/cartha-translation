  yaml_path: translation/ot/1_samuel/023/020.yaml
  text: Now then[a], O king, come down according to all the desire of your soul to come down[b], and it is for us to hand him over into the king’s hand.
translation:
  language: ta
  text: இப்போது, அரசே, இறங்கி வர வேண்டும் என்ற உங்கள் உள்ளம் விரும்பியபடியெல்லாம்[a] இறங்கி வாருங்கள்.[b] அவரை அரசரின் கையில் ஒப்படைப்பது எங்கள் பங்கு.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “உங்கள் உள்ளம் விரும்பியபடியெல்லாம்” என்பது எபிரெயத்தில் சொல்லுக்கு சொல் “உங்கள் உயிரின்/உள்ளத்தின் எல்லா விருப்பத்தின்படி” என்பதாகும்; ஆழ்ந்த அல்லது வலுவான விருப்பத்தைக் குறிக்கும் வழக்குச்சொல்.
    reason: lexical_alternative
  - marker: b
    text: வலியுறுத்துவதற்காக எபிரெயத்தில் “இறங்கி வருதல், இறங்கி வாருங்கள்” என முடிவிலி வடிவமும் கட்டளை வடிவமும் ஒரே வினையை மீண்டும் பயன்படுத்துகின்றன.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: இப்போதும்
  rationale: உடனடியான வேண்டுகோளுக்கான உரைமாற்றத்தைக் குறிக்கும் இணைப்பையும் காலச்சுட்டையும் சுருக்கமாக வெளிப்படுத்துகிறது.
- source_word: לְכָל אַוַּת נַפְשְׁךָ
  choice: உங்கள் உள்ளத்தின் முழு விருப்பத்தின்படியே
  rationale: נֶפֶשׁ குறிக்கும் உள்ளார்ந்த ஆழ்ந்த விருப்பத்தை இயல்பான நவீனத் தமிழில் தக்கவைத்து, לְכָל என்பதன் முழுமை மற்றும் இசைவு சார்ந்த பொருளையும் வெளிப்படுத்துகிறது.
- source_word: הַמֶּלֶךְ
  choice: அரசே
  rationale: குறிப்புச் சுட்டுடன் வரும் எபிரெயப் பெயர்ச்சொல் இங்கு விளிவேற்றுமை அழைப்பாகச் செயல்படுகிறது; தமிழில் ‘அரசே’ இயல்பும் கண்ணியமும் உடையது.
- source_word: לָרֶדֶת רֵד
  choice: கீழே இறங்கிவர வேண்டுமென்ற ... இறங்கி வாருங்கள்
  rationale: வினையெச்ச/முடிவிலி வடிவத்துடன் கட்டளை வினை மீளும் எபிரெய வலியுறுத்தலை தமிழில் புரியத்தக்க மறுபயன்பாட்டால் காக்கிறது.
- source_word: וְלָנוּ
  choice: எங்கள் பொறுப்பு
  rationale: அவரை ஒப்படைக்கும் செயல் தங்களுக்குரிய பங்கு அல்லது கடமை என்று பேசுவோர் கூறும் பொருளை இயல்பான தமிழில் தெளிவாக்குகிறது.
- source_word: הַסְגִּירוֹ
  choice: அவரை ... ஒப்படைப்பது
  rationale: Hiphil வடிவம் ஒருவரை மற்றொருவரின் அதிகாரத்திற்குள் கொடுத்துவிடுதல் என்ற பொருளை இச்சூழலில் தருகிறது.
- source_word: בְּיַד הַמֶּלֶךְ
  choice: அரசரின் கையில்
  rationale: அதிகாரம் அல்லது கட்டுப்பாட்டுக்குள் ஒப்படைத்தல் என்ற எபிரெய உருவகத்தை ‘கையில்’ எனத் தக்கவைக்கிறது.
