base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/003.yaml
  text: But David’s men said to him[a], “Look, we are afraid here in Judah; how much more, then, if we go to Keilah against the battle lines of the Philistines?”
translation:
  language: ta
  text: ஆனால் தாவீதின் ஆட்கள் அவரிடம், “பாருங்கள், இங்கே யூதாவிலேயே நாங்கள் பயந்துகொண்டிருக்கிறோம்; அப்படியிருக்க, பெலிஸ்தியரின் போரணிகளை எதிர்க்கக் கேயிலாவுக்குப் போனால் இன்னும் எவ்வளவு பயப்படுவோம்![a]” என்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பெலிஸ்தியரின் படையணிகளை எதிர்க்கக் கேயிலாவுக்குப் போவதைப் பற்றிச் சொல்லவே வேண்டாம்!” எபிரெய மொழிமரபு குறைந்த ஆபத்திலிருந்து அதிக ஆபத்துக்குச் செல்லும் வாதத்தை வெளிப்படுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: ஆனால் ... என்றார்கள்
  rationale: வாவ் தொடர்கதை நிகழ்வை முன்னெடுத்தாலும், முந்தைய கட்டளைக்கு ஆட்கள் காட்டும் தயக்கமான எதிர்வினையைச் சூழலில் இயல்பாக வெளிப்படுத்த “ஆனால்” பயன்படுத்தப்பட்டது.
- source_word: אַנְשֵׁי דָוִד
  choice: தாவீதின் ஆட்கள்
  rationale: உரிமையையும் தாவீதோடு இணைந்த குழுவையும் இயல்பான நவீனத் தமிழில் காட்டுகிறது.
- source_word: הִנֵּה
  choice: பாருங்கள்
  rationale: பேசுவோரின் வலியுறுத்தலான கவன ஈர்ப்பை மரியாதைப் பன்மையுடன் இயல்பாகத் தெரிவிக்கிறது.
- source_word: אֲנַחְנוּ פֹה בִּיהוּדָה יְרֵאִים
  choice: இங்கே யூதாவிலேயே நாங்கள் பயந்துகொண்டிருக்கிறோம்
  rationale: “இங்கே யூதாவிலேயே” என்பது பாதுகாப்பானதாகக் கருதக்கூடிய இடத்தில்கூட அவர்களுக்கு அச்சம் இருப்பதை வலியுறுத்தி, சிறியதிலிருந்து பெரியதற்குச் செல்லும் வாதத்துக்கு அடித்தளம் அமைக்கிறது.
- source_word: וְאַף כִּי
  choice: அப்படியிருக்க ... இன்னும் எவ்வளவு
  rationale: எபிரெய மொழிமரபிலுள்ள குறைந்த ஆபத்திலிருந்து அதிக ஆபத்துக்கான வாதத்தைத் தமிழில் இயல்பாகவும் வெளிப்படையாகவும் எடுத்துரைக்கிறது.
- source_word: נֵלֵךְ קְעִלָה
  choice: கேயிலாவுக்குப் போனால்
  rationale: இலக்கை நோக்கிய நகர்வை நிபந்தனை அமைப்பில் இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: אֶל מַעַרְכוֹת פְּלִשְׁתִּים
  choice: பெலிஸ்தியரின் போரணிகளை எதிர்க்க
  rationale: מַעַרְכוֹת என்பதன் படை அணிவகுப்பு அல்லது போர்வரிசைகள் என்ற துல்லியமான இராணுவப் பொருளையும், אֶל மூலம் சூழலில் உணர்த்தப்படும் மோதலையும் காக்கிறது.
