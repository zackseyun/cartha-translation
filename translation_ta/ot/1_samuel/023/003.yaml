translation_notes:
  register: நவீன நிலையான தமிழ்; எளிதில் புரியக்கூடியதும் கண்ணியமானதும். கேள்வி வடிவில் தமிழுக்கு இயல்பாக முழுமைப்படுத்தப்பட்ட “பயப்படுவோம்” என்பது எபிரெய மொழிமரபின் உள்ளார்ந்த கருத்தை வெளிப்படுத்துகிறது; மாற்று சுருக்கமான வாசிப்பு அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
