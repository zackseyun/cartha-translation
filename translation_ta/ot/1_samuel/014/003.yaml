source:
  edition: WLC
  text: וַ/אֲחִיָּ֣ה בֶן אֲחִט֡וּב אֲחִ֡י אִיכָב֣וֹד בֶּן פִּינְחָ֨ס בֶּן עֵלִ֜י כֹּהֵ֧ן יְהוָ֛ה בְּ/שִׁל֖וֹ נֹשֵׂ֣א אֵפ֑וֹד וְ/הָ/עָם֙ לֹ֣א יָדַ֔ע כִּ֥י הָלַ֖ךְ יוֹנָתָֽן־׀־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/003.yaml
  text: Ahijah son of Ahitub[a], brother of Ichabod, son of Phinehas, son of Eli, priest of Yahweh at Shiloh, was carrying an ephod. And the people did not know that Jonathan had gone.
translation:
  language: ta
  text: இக்கபோத்தின் சகோதரனும், பினெகாசின் மகனும், ஏலியின் மகனுமான அகித்தூபின் மகன் அகியா, சீலோவில் யாவேயின் ஆசாரியனாக இருந்து ஏபோதைச் சுமந்துகொண்டிருந்தான்.[a] யோனத்தான் போயிருந்ததை மக்களோ அறியவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘ஏபோதை அணிந்துகொண்டிருந்தான்.’ எபிரெயத்தில் நேரடியாக, ‘ஏபோதைச் சுமந்துகொண்டிருந்தான்’ அல்லது ‘ஏந்திக்கொண்டிருந்தான்’ என்று உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַ/אֲחִיָּה
  choice: அகியா
  rationale: வாவ் இங்கு கதையைத் தொடர்கிறது; தமிழில் தேவையற்ற ‘இப்போது’ அல்லது இயந்திரமான ‘மேலும்’ சேர்க்காமல், பெயர் நேரடியாக வழங்கப்படுகிறது.
- source_word: בֶן אֲחִטוּב אֲחִי אִיכָבוֹד בֶּן פִּינְחָס בֶּן עֵלִי
  choice: இக்கபோத்தின் சகோதரனும் பினெகாசின் மகனும் ஏலியின் பேரனுமான அகித்தூபின் மகன்
  rationale: எபிரெய மரபுவரிசையில் ‘இக்கபோத்தின் சகோதரன்’ மற்றும் ‘பினெகாசின் மகன்’ என்பவை அகித்தூபை விளக்குகின்றன. உறவுகளின் தொடர் தமிழில் தெளிவாகவும், ஏலியிலிருந்து அகியாவரை உள்ள தலைமுறை வேறுபாடு ‘பேரன்’ என்பதால் இயல்பாகவும் காட்டப்படுகிறது.
- source_word: כֹּהֵן יְהוָה בְּ/שִׁלֹה
  choice: சீலோவில் யாவேக்கு ஆசாரியனாக இருந்து
  rationale: அகியா சீலோவில் யாவேக்கு ஆசாரியராகச் செயல்பட்டதை இயல்பான தமிழில் காட்டுகிறது; יהוה தனிப்பெயராக ‘யாவே’ என்று ஒலிபெயர்க்கப்படுகிறது.
- source_word: נֹשֵׂא אֵפוֹד
  choice: ஏபோதைச் சுமந்துகொண்டிருந்தான்
  rationale: נשא என்பதன் அடிப்படைப் பொருள் ‘சுமத்தல்/ஏந்துதல்’. ஏபோதை அவர் அணிந்திருந்தாரா அல்லது எடுத்துச் சென்றாரா என்பதை மூல உரை துல்லியமாகத் தீர்மானிக்காததால், அந்தத் தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: וְ/הָ/עָם לֹא יָדַע
  choice: மக்களோ அறியவில்லை
  rationale: கூட்டு ஒருமை வினைச்சொல்லின் பொருள் தமிழில் இயல்பான பன்மையுடன் தரப்படுகிறது; ‘-ஓ’ முந்தைய நிகழ்வுக்கும் மக்களின் அறியாமைக்கும் உள்ள வேறுபாட்டை மென்மையாகக் காட்டுகிறது.
- source_word: כִּי הָלַךְ יוֹנָתָן
  choice: யோனத்தான் போயிருந்ததை
  rationale: யோனத்தானின் புறப்பாடு மக்கள் அறியாதிருந்த நேரத்திற்கு முன்பே நடந்ததால், தமிழின் நிறைவுற்ற இறந்தகால வடிவம் பயன்படுத்தப்படுகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூல உரையில் பட்டப்பெயர் அல்ல, நான்கு எழுத்துகளைக் கொண்ட இறைத் தனிப்பெயர் நேரடியாக உள்ளது; ஆகவே அதை பட்டப்பெயரால் மாற்றாமல் தமிழில் ஒலிபெயர்க்கப்படுகிறது.
- issue: அகியாவின் ஆசாரியப் பணி மற்றும் ஏபோதைத் தாங்கிய விதம்
  choice: யாவேக்கு ஆசாரியனாக இருந்து, ஏபோதைச் சுமந்துகொண்டிருந்தான்
  alternative: யாவேயின் ஆசாரியனாக, ஏபோதை அணிந்திருந்தான்
  rationale: ஆசாரிய அடையாளத்தைத் தெளிவாகக் காட்டியபோதும், נשא என்பதைக் ‘அணிந்தான்’ என்று மட்டும் தீர்மானித்து வழிபாட்டு நடைமுறையை மூலத்துக்கு மேலாகச் சேர்க்காமல் விடுகிறது.
translation_notes:
  register: நவீனத் தரமான, மரியாதைமிக்க தமிழ் பயன்படுத்தப்பட்டுள்ளது. மரபுவரிசை நீண்டதாக இருந்தாலும் சாதாரண வாசகர் உறவுகளைத் தெளிவாகப் புரிந்துகொள்ளும் வகையில் தமிழ்ச் சொல்லமைப்பில் மறுவரிசைப்படுத்தப்பட்டுள்ளது. ‘ஆசாரியன்’, ‘ஏபோத்’ ஆகிய நிலைபெற்ற வேதாகமச் சொற்கள் தக்கவைக்கப்பட்டுள்ளன.
