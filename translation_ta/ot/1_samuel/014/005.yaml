base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/005.yaml
  text: One crag stood on the north[a], opposite Michmash, and the other on the south[b], opposite Geba.
translation:
  language: ta
  text: ஒரு பாறைமுனை[a] மிக்மாசுக்கு எதிரே வடக்கில் இருந்தது; மற்றொன்று கேபாவுக்கு[b] எதிரே தெற்கில் இருந்தது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயச் சொல்லின் நேரடிப் பொருள் ‘பல்’; இங்கு அது கூர்மையாக நீண்டுநிற்கும் பாறை அமைப்பை உருவகமாகக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: சில ஆங்கில மொழிபெயர்ப்புகள் இங்கு ‘கிபியா’ என்று தருகின்றன; ஆனால் எபிரெய இடப்பெயர் ‘கேபா’ என்பதே.
    reason: alternative_reading
lexical_decisions:
- source_word: הַשֵּׁן
  choice: பாறைமுனை
  rationale: சொல்லுக்குச் சொல் ‘பல்’ என்று பொருள்; இங்கு கூர்மையாக நீண்டுநிற்கும் பாறை அமைப்பை உருவகமாகக் குறிக்கிறது. ‘பாறைமுனை’ அந்த உருவகத்தின் நிலவியல் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: הָאֶחָד ... וְהָאֶחָד
  choice: ஒரு ... மற்றொன்று
  rationale: இரண்டு பாறைமுனைகளைத் தனித்தனியாகச் சுட்டும் பகிர்வுக் கட்டமைப்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: מָצוּק
  choice: இருந்தது
  rationale: இச்சூழலில் அந்தப் பாறைமுனையின் நிலை அல்லது அமைவிடத்தை விவரிக்கிறது; அதிகமாக ஊகிக்காமல் இயல்பான தமிழில் ‘இருந்தது’ என வழங்கப்படுகிறது.
- source_word: מִצָּפוֹן
  choice: வடக்குப் பக்கத்தில்
  rationale: கணவாய் அல்லது பாதையின் வடக்குப் பக்கத்தில் இருந்த இடநிலையைச் சுட்டுகிறது.
- source_word: מוּל
  choice: எதிராக
  rationale: ஒரு இடத்தை நோக்கி அல்லது அதற்கு எதிர்ப்புறத்தில் அமைந்திருப்பதைக் குறிக்கும் நிலவியல் உறவைச் சுருக்கமாகத் தருகிறது.
- source_word: מִכְמָשׂ
  choice: மிக்மாஸ்
  rationale: எபிரெய இடப்பெயரின் ஒலியை நவீன தமிழில் தெளிவாக எழுத்துப்பெயர்க்கிறது.
- source_word: מִנֶּגֶב
  choice: தெற்குப் பக்கத்தில்
  rationale: வடக்கிற்கு இணையான எதிர்நிலையாகத் தெற்குப் பக்கத்தைச் சுட்டுகிறது.
- source_word: גָּבַע
  choice: கேபா
  rationale: எபிரெய வடிவம் கேபா என்ற இடப்பெயரையே குறிக்கிறது; கிபியா அல்ல.
