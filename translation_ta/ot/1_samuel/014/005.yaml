  register: நவீன செந்தமிழ் சார்ந்த, பொதுவாசகர்களுக்கு எளிதில் புரியும் நிலவியல் நடை பயன்படுத்தப்பட்டது. எபிரெய இணை அமைப்பான ‘ஒரு ... மற்றொன்று’ பாதுகாக்கப்பட்டது; இடப்பெயர்கள் மூல வடிவங்களின் வேறுபாட்டைத் தக்கவைக்கின்றன.
