source:
  edition: WLC
  text: וְ/הָ/עִבְרִ֗ים הָי֤וּ לַ/פְּלִשְׁתִּים֙ כְּ/אֶתְמ֣וֹל שִׁלְשׁ֔וֹם אֲשֶׁ֨ר עָל֥וּ עִמָּ֛/ם בַּֽ/מַּחֲנֶ֖ה סָבִ֑יב וְ/גַם הֵ֗מָּה לִֽ/הְיוֹת֙ עִם יִשְׂרָאֵ֔ל אֲשֶׁ֥ר עִם שָׁא֖וּל וְ/יוֹנָתָֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/021.yaml
  text: The Hebrews who had previously been with the Philistines[a], who had gone up with them into the camp all around—even they also came to be with Israel[c][b], who were with Saul and Jonathan.
translation:
  language: ta
  text: முன்பு பெலிஸ்தியர்களோடு இருந்த எபிரெயர்கள்[a]—அவர்களோடு சுற்றுப்பகுதியில் இருந்த முகாமுக்குள் ஏறிச் சென்றிருந்தவர்களும்கூட[c]—சவுலோடும் யோனத்தானோடும் இருந்த இஸ்ரவேலரோடு சேர்ந்தார்கள்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் எழுத்துப்படி, ‘நேற்றைப் போல, அதற்கு முந்தின நாள்’; இது ‘முன்பு’ அல்லது ‘முன்னர்’ என்று பொருள்படும் மரபுத்தொடர்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘இஸ்ரவேலரோடு இருக்கலானார்கள்.’ எபிரெய மூலத்தில் ‘இஸ்ரவேலோடு இருக்க’ என்று உள்ளது; சூழல் அவர்கள் சார்பு மாறியதைக் குறிக்கிறது.
    reason: alternative_reading
  - marker: c
    text: ‘சுற்றுப்பகுதியில் இருந்த முகாம்’ என்ற எபிரெயச் சொற்றொடர் பொருள் தெளிவில்லாதது. சுற்றியிருந்த பகுதியில் பரந்திருந்த பெலிஸ்திய முகாமை இது குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָעִבְרִים
  choice: எபிரெயர்கள்
  rationale: மூலத்தில் உள்ள עִבְרִים என்பதைக் ‘இஸ்ரவேலர்’ என்று பொதுமைப்படுத்தாமல், தனித்த சமூக அல்லது வெளிப்பார்வைச் சுட்டலைக் காக்கிறது.
- source_word: הָיוּ לַפְּלִשְׁתִּים
  choice: பெலிஸ்தியர்களோடு இருந்த
  rationale: எழுத்துப்படி ‘பெலிஸ்தியர்களுக்குரியவர்களாக இருந்தனர்’ என்ற கட்டமைப்பு இங்கு உடனிருப்பு அல்லது சார்புநிலையைக் குறிக்கிறது; உடைமை உணர்வை மிகைப்படுத்தாமல் மொழிபெயர்க்கப்பட்டது.
- source_word: כְּאֶתְמוֹל שִׁלְשׁוֹם
  choice: முன்பு
  rationale: ‘நேற்றைப் போல, அதற்கு முந்தின நாளைப் போல’ என்ற எபிரெய மரபுத்தொடரின் இயல்பான பொருள் ‘முன்பு’ என்பதாகும்.
- source_word: אֲשֶׁר עָלוּ עִמָּם
  choice: அவர்களோடு ... சென்றிருந்தவர்கள்
  rationale: עלה என்பதன் திசை உணர்வை அளவுக்கு மீறாமல், பெலிஸ்தியர்களுடன் சென்றிருந்ததைத் தெளிவாகக் காட்டுகிறது.
- source_word: בַּמַּחֲנֶה סָבִיב
  choice: சுற்றிலும் இருந்த முகாமுக்கு
  rationale: இலக்கண ரீதியாகக் கடினமான சொற்றொடரின் இடவியல் உணர்வைக் காக்கிறது; அது சுற்றுப்பகுதியில் பரந்திருந்த பெலிஸ்திய முகாமைக் குறிக்கலாம்.
- source_word: וְגַם הֵמָּה
  choice: அவர்களும்கூட
  rationale: மற்றவர்களுடன் இந்த எபிரெயர்களும் சேர்ந்தனர் என்ற வலியுறுத்தலை இயல்பான தமிழில் தருகிறது.
- source_word: לִהְיוֹת עִם יִשְׂרָאֵל
  choice: இஸ்ரவேலரோடு இப்போது சேர்ந்திருந்தார்கள்
  rationale: எழுத்துப்படி ‘இஸ்ரவேலோடு இருக்க’ என்பது இச்சூழலில் அணிமாற்றத்தைக் குறிக்கிறது. ‘சேர்ந்திருந்தார்கள்’ அதைத் தெளிவாக்குகிறது; ‘இப்போது’ முன்பிருந்த நிலையுடனான காலமாற்றத்தை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: אֲשֶׁר עִם שָׁאוּל וְיוֹנָתָן
  choice: சவுலுடனும் யோனத்தானுடனும் இருந்த
  rationale: தொடர்புப்பெயர் வாக்கியம் ‘இஸ்ரவேல்’ என்ற கூட்டுமக்களைக் குறிப்பதாக எடுத்துக்கொண்டு இயல்பான தமிழில் வழங்கப்பட்டுள்ளது.
theological_decisions:
- issue: இஸ்ரவேலோடு இருப்பது அணிமாற்றமா அல்லது வெறும் உடனிருப்பா
  choice: சேர்ந்திருந்தார்கள்
  alternative: இருக்கலானார்கள் / இருக்க வந்தார்கள்
  rationale: சூழல் ஒரு சார்புநிலை மாற்றத்தைக் காட்டுகிறது; எனினும் முழுமையான மனமாற்றம் அல்லது உடன்படிக்கைச் சேர்க்கை போன்ற இறையியல் கருத்துகள் சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் வேதாகம உரைக்கு ஏற்ற கண்ணியமான நடையிலும் வடிவமைக்கப்பட்டது. நீண்ட எபிரெய வாக்கியத்தின் உறவுத்தொடர்கள் கோடுகளால் பிரிக்கப்பட்டு வாசிப்புத் தெளிவு மேம்படுத்தப்பட்டது; மூலத்தின் தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்பட்டது.
