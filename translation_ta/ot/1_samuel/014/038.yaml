source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר שָׁא֔וּל גֹּ֣שֽׁוּ הֲלֹ֔ם כֹּ֖ל פִּנּ֣וֹת הָ/עָ֑ם וּ/דְע֣וּ וּ/רְא֔וּ בַּ/מָּ֗ה הָֽיְתָ֛ה הַ/חַטָּ֥את הַ/זֹּ֖את הַ/יּֽוֹם׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/038.yaml
  text: Then Saul said[a], “Come here, all you chiefs of the people, and know and see by what this sin has happened today.”
translation:
  language: ta
  text: அப்போது சவுல், “மக்களின் தலைவர்கள் அனைவரும்[a] இங்கே வாருங்கள். இன்று இந்தப் பாவம் எதனால் ஏற்பட்டது என்பதை அறிந்து பாருங்கள்” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மொழியில் சொல்லுக்குச் சொல், “மக்களின் எல்லா மூலைகளும்”; இது மக்களின் தலைவர்கள் அல்லது பிரதிநிதிகளைக் குறிக்கும் மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: גֹּשׁוּ הֲלֹם
  choice: இங்கே வாருங்கள்
  rationale: நגשׁ என்பதன் பன்மை ஏவல்வினையும் இடத்தைக் குறிக்கும் הֲלֹם என்பதும் சவுல் இருக்கும் இடத்தை நோக்கி வருமாறு குழுவை அழைக்கின்றன. ‘இங்கே வாருங்கள்’ என்பது இயல்பான நவீனத் தமிழ்.
- source_word: כֹּל פִּנּוֹת הָעָם
  choice: மக்களின் தலைவர்கள் அனைவரும்
  rationale: சொல்லுக்குச் சொல் ‘மக்களின் எல்லா மூலைகளும்’ என்றாலும், இங்கு அது மக்களிடையேயுள்ள முதன்மையானவர்கள் அல்லது பிரதிநிதித் தலைவர்களைக் குறிக்கும் எபிரெய மரபுத்தொடர். பொருளைத் தெளிவாகத் தர ‘தலைவர்கள்’ என மொழிபெயர்க்கப்பட்டது; நேரடிப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: וּדְעוּ וּרְאוּ
  choice: அறிந்து பாருங்கள்
  rationale: இணையாக வரும் இரு ஏவல்வினைகளும் விசாரித்து உண்மையை அறிதல், பின்னர் கவனித்தறிதல் ஆகிய வலியுறுத்தலைக் கொண்டுள்ளன. அவற்றை ஒரே வினையாகச் சுருக்காமல் இரண்டும் காக்கப்பட்டன.
- source_word: בַּמָּה
  choice: எதனால்
  rationale: ב + מה இங்கு இந்தப் பாவம் எந்தக் காரணத்தால் அல்லது வழியாக ஏற்பட்டது என்ற விசாரணையை அறிமுகப்படுத்துகிறது. ‘எதனால்’ என்பது அந்தக் கேள்வியின் திறந்த தன்மையை இயல்பான தமிழில் காக்கிறது.
- source_word: הָיְתָה
  choice: ஏற்பட்டது
  rationale: அடிப்படையில் ‘இருந்தது/உண்டானது’ எனப் பொருள்படும் இச்சொல், சூழலில் பாவம் எவ்வாறு நிகழ்ந்தது என்பதைச் சுட்டுகிறது. ‘ஏற்பட்டது’ இயல்பாக அந்த நிகழ்வுப் பொருளை வெளிப்படுத்துகிறது.
- source_word: הַחַטָּאת הַזֹּאת
  choice: இந்தப் பாவம்
  rationale: חטאת இங்கு கடவுளுக்கு முன்பான மீறுதலான செயலைக் குறிக்கிறது. ‘பாவம்’ அதன் நேரடியான அறவியல் மற்றும் இறையியல் வலிமையைப் பாதுகாக்கிறது.
- source_word: הַיּוֹם
  choice: இன்று
  rationale: காலத்தைக் குறிக்கும் வழக்கமான சொல்லுக்கான இயல்பான நவீனத் தமிழ் இணை.
theological_decisions:
- issue: כֹּל פִּנּוֹת הָעָם என்ற மரபுத்தொடரின் பொருள்
  choice: மக்களின் தலைவர்கள் அனைவரும்
  alternative: மக்களின் எல்லா மூலைகளும் / மக்களின் தலைவர்கள் அனைவரும்
  rationale: இங்கு நேரடியாக ‘மூலைகள்’ என்று மொழிபெயர்ப்பது தமிழில் தவறான காட்சியை உண்டாக்கும். மக்கள் மத்தியில் முதன்மை அல்லது பிரதிநிதித்துவம் வகிப்பவர்களை இம்மரபுத்தொடர் குறிக்கிறது; அதனால் பொருளை முதன்மை உரையில் கொடுத்து, சொற்சார்ந்த வடிவம் அடிக்குறிப்பில் காக்கப்பட்டது.
- issue: חטאת என்பதன் அறவியல் வலிமை
  choice: பாவம்
  alternative: குற்றம் / தவறு / குற்றச்செயல்
  rationale: கதைச்சூழலில் இது கடவுளுக்கு முன்பான மீறுதலைக் குறிக்கிறது. ‘பாவம்’ மூலச்சொல்லின் இறையியல் வலிமையை மிகைப்படுத்தாமலும் தணிக்காமலும் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் கண்ணியமான உரைநடையிலும் வடிவமைக்கப்பட்டது. எபிரெயத்தின் இரட்டை ஏவல்வினை ‘அறிந்து பாருங்கள்’ என்று காக்கப்பட்டது; மரபுத்தொடரின் நேரடிப் பொருள் அடிக்குறிப்பில் விளக்கப்பட்டது.
