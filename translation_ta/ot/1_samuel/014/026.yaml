  source_fidelity: முக்கிய உரையில் הַשְּׁבֻעָה (‘அந்தச் சத்தியம்/ஆணைச்சத்தியம்’) என்பதற்கு ‘அந்த ஆணை’ என்று வழங்கப்பட்டுள்ளது. சூழலில் அது ஒரு கட்டளையாகச் செயல்பட்டாலும், மூலத்தின் பெயர்ச்சொல் ‘ஆணை’ அல்ல; ஆகவே அதன் சத்தியத் தன்மையை முதன்மை உரையிலேயே காக்க வேண்டும். மற்ற கூறுகள்—காட்டிற்குள் வருதல், தேனின் ஓட்டம், கை-வாய் உருவகம், மற்றும் அச்சம் காரணமாக இருப்பது—மூலத்திற்கு உண்மையாக உள்ளன.
  naturalness: நடை நவீன நிலையான தமிழில் இயல்பாக உள்ளது. ‘தன் கையைத் தன் வாய்க்குக் கொண்டுபோகவில்லை’ என்பது நோக்கமுள்ள நேரடி உருவக மொழிபெயர்ப்பு; அடிக்குறிப்பு அதன் பொருளைத் தெளிவாக்குகிறது. ‘அந்தச் சத்தியத்திற்குப் பயந்தார்கள்’ என்பது இச்சூழலில் தெளிவாகவும் இயல்பாகவும் உள்ளது.
  terminology: שבועה என்பதற்கு ‘சத்தியம்’ பயன்படுத்தப்பட வேண்டும்; ‘சாபம்’ அல்லது ‘ஆணை’ மட்டும் மூலத்தின் சொற்பொருளை முறையே மிகைப்படுத்தும் அல்லது மாற்றும். சவுலின் முந்தைய அறிவிப்பில் சத்தியமும் சாபமும் கட்டளையும் தொடர்புடையவை என்பதை அடிக்குறிப்பில் விளக்கலாம்; ஆனால் முதன்மை உரையில் ‘சத்தியம்’ பாதுகாக்கப்பட வேண்டும்.
