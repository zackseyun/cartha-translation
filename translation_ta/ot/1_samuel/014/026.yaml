base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/026.yaml
  text: When the people came into the forest[a], behold, there was a flow of honey, but no one put his hand to his mouth[c][b], because the people feared the oath.
translation:
  language: ta
  text: மக்கள் காட்டிற்குள் வந்தபோது, இதோ, தேன் வழிந்துகொண்டிருந்தது[a]. ஆனால் ஒருவரும் தன் கையைத் தன் வாய்க்குக் கொண்டுபோகவில்லை[b]; ஏனெனில் மக்கள் அந்தச் சத்தியத்திற்குப் பயந்தார்கள்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயச் சொற்றொடரைச் சொல்லுக்குச் சொல் மொழிபெயர்த்தால், ‘தேனின் ஓட்டம்’ எனலாம். ‘தேன் ஓடிக்கொண்டிருந்தது’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: சொல்லுக்குச் சொல், ‘ஒருவரும் தன் கையைத் தன் வாய்க்குக் கொண்டுபோகவில்லை.’ அதாவது, ஒருவரும் அந்தத் தேனைச் சாப்பிடவில்லை.
    reason: lexical_alternative
  - marker: c
    text: எபிரெயத்தில் ‘அந்தச் சத்தியம்’ என்று உள்ளது. சூழலில், மாலைவரை உண்பவன் சபிக்கப்பட்டவன் எனச் சவுல் அறிவித்த சத்தியத்தை இது குறிக்கிறது; 1 சாமுவேல் 14:24-ஐப் பார்க்கவும்.
    reason: cross_reference
lexical_decisions:
- source_word: וַיָּבֹא
  choice: வந்தபோது
  rationale: בוא என்பதன் தொடர்கதை வடிவம் கடந்தகால இயக்கத்தைக் குறிக்கிறது; அடுத்த நிகழ்வுடன் இயல்பாக இணைக்கத் தமிழில் ‘வந்தபோது’ என வழங்கப்பட்டது.
- source_word: הָעָם
  choice: மக்கள்
  rationale: עם என்பதன் பரந்த பொருளான ‘மக்கள்’ பாதுகாக்கப்படுகிறது; இராணுவச் சூழலில் ‘வீரர்கள்’ சாத்தியமானாலும், மூலச்சொல் அதைவிடப் பரந்தது.
- source_word: הַיַּעַר
  choice: காடு
  rationale: יער என்பது மரங்கள் அடர்ந்த பகுதி அல்லது காட்டைக் குறிக்கிறது; ‘காடு’ தெளிவான இயல்பான தமிழ்.
- source_word: וְהִנֵּה
  choice: இதோ
  rationale: הנה கவனத்தை ஈர்த்து காட்சியை உயிர்ப்புடன் முன்வைக்கிறது; ‘இதோ’ அந்த உரையாடல் செயல்பாட்டைப் பாதுகாக்கிறது.
- source_word: הֵלֶךְ דְּבָשׁ
  choice: தேன் வழிந்துகொண்டிருந்தது
  rationale: இந்த அரிய பெயர்ச்சொல் அமைப்பு தேன் சென்றுகொண்டிருப்பதை அல்லது வழிவதைச் சுட்டுகிறது; சொல்லுக்குச் சொல் அசட்டுத்தன்மையைத் தவிர்த்து, இயக்கத்தைத் தெளிவாகக் காட்டுகிறது.
- source_word: וְאֵין מַשִּׂיג יָדוֹ אֶל פִּיו
  choice: ஆனால் ஒருவரும் தன் கையைத் தன் வாய்க்குக் கொண்டுபோகவில்லை
  rationale: உண்ணவில்லை என்ற பொருளுடைய எபிரெய உருவகத்தை நேரடியாகப் பாதுகாத்து, தமிழில் இயல்பாக வழங்குகிறது.
- source_word: כִּי יָרֵא הָעָם
  choice: ஏனெனில் மக்கள் ... பயந்தார்கள்
  rationale: כִּי காரணத்தைத் தருகிறது; ירא இங்கு ஆணையை மீறுவதால் வரும் விளைவுக்கான அச்சத்தைக் குறிக்கிறது.
- source_word: הַשְּׁבֻעָה
  choice: அந்த ஆணை
  rationale: שבועה அடிப்படையில் ‘சத்தியம்/ஆணை’ என்பதைக் குறிக்கும். இச்சூழலில் சவுல் சத்தியமிட்டு மக்கள்மீது விதித்த கட்டளையைத் தமிழில் தெளிவாக உணர்த்த ‘அந்த ஆணை’ தேர்ந்தெடுக்கப்பட்டது; அடிப்படைச் சொற்பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
theological_decisions:
- issue: הַשְּׁבֻעָה என்பதன் சூழல்சார் தன்மை
  choice: முதன்மை உரையில் ‘அந்த ஆணை’; அடிக்குறிப்பில் ‘சத்தியம்’ மற்றும் அதனுடன் இணைந்த சாபத்தின் பின்னணி
  alternative: ‘அந்தச் சத்தியம்’ அல்லது ‘அந்தச் சாபம்’
  rationale: ‘சாபம்’ மட்டும் என்பது மூலச்சொல்லை மிகையாக விளக்கும்; ‘சத்தியம்’ மட்டும் தமிழில் மக்கள் ஏன் அதற்குப் பயந்தார்கள் என்பதை மறைக்கக்கூடும். ‘ஆணை’ சூழல்சார் செயல்பாட்டைத் தருகிறது; அடிக்குறிப்பு சொற்பொருளையும் 14:24 பின்னணியையும் வெளிப்படுத்துகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. ‘இதோ’ மூலம் மூலத்தின் காட்சித் திடீர்மையும், கை-வாய் உருவகத்தின் தெளிவும் பாதுகாக்கப்பட்டுள்ளன. அடிக்குறிப்பு குறிகள் உரையில் வரிசையாக [a], [b], [c] என அமைக்கப்பட்டுள்ளன.
