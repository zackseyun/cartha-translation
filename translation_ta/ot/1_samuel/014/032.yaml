base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/032.yaml
  text: Then the people rushed upon the spoil and took sheep and cattle and calves[a], and they slaughtered them on the ground[b], and the people ate with the blood.
translation:
  language: ta
  text: அப்போது மக்கள் கொள்ளைப்பொருட்கள்மீது பாய்ந்து[a], செம்மறியாடுகளையும் மாடுகளையும் கன்றுகளையும் பிடித்து, அவற்றைத் தரையிலேயே அறுத்தார்கள். மக்கள் அந்த இறைச்சியை இரத்தத்தோடே சாப்பிட்டார்கள்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘மக்கள் கொள்ளைப்பொருட்களின்மேல் விழுந்தார்கள்.’
    reason: lexical_alternative
  - marker: b
    text: அதாவது, இரத்தத்தை முறையாக வடிக்காமல், அது இன்னும் இறைச்சியில் இருக்கும்போதே அவர்கள் சாப்பிட்டார்கள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ ... אֶל שָׁלָל
  choice: கொள்ளைப்பொருட்கள்மீது பாய்ந்து
  rationale: இச்சூழலில் இந்த எபிரெயச் சொற்றொடர், பசியால் வாடிய மக்கள் போரில் கைப்பற்றிய பொருட்களை நோக்கி வேகமாகவும் கட்டுப்பாடின்றியும் பாய்ந்ததைக் குறிக்கிறது. ‘பாய்ந்து’ என்பது அந்தத் திடீர் தீவிரத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: שָׁלָל
  choice: கொள்ளைப்பொருட்கள்
  rationale: போருக்குப் பின் எதிரியிடமிருந்து கைப்பற்றப்பட்ட பொருட்களையும் கால்நடைகளையும் குறிக்கும் பொதுவான, தெளிவான தமிழ்ச் சொல்.
- source_word: צֹאן
  choice: செம்மறியாடுகள்
  rationale: கால்நடைகளின் பட்டியலில் வரும் צֹאן என்பதற்கு இங்கு தெளிவான உயிரினப் பெயர் பொருத்தமானது; ‘செம்மறியாடுகள்’ நவீனத் தமிழில் இயல்பாக உள்ளது.
- source_word: בָּקָר
  choice: மாடுகள்
  rationale: בקר என்பது பொதுவாக மாட்டினத்தைக் குறிக்கிறது. ‘மாடுகள்’ என்பது விரிவான பொருளையும் இயல்பான தமிழ்நடையையும் காக்கிறது.
- source_word: בְּנֵי בָקָר
  choice: கன்றுகள்
  rationale: சொல்லர்த்தமாக ‘மாடுகளின் குட்டிகள்’; ‘கன்றுகள்’ என்பது அதற்கான சுருக்கமான, இயல்பான தமிழாக்கம்.
- source_word: וַיִּשְׁחֲטוּ אָרְצָה
  choice: அவற்றைத் தரையிலேயே அறுத்தார்கள்
  rationale: முந்தைய பட்டியலில் உள்ள கால்நடைகளே மறைமுகச் செயப்படுபொருள். אָרְצָה அவை தரையில் அறுக்கப்பட்டதை வலியுறுத்துவதால் ‘தரையிலேயே’ என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: עַל־הַדָּם
  choice: இரத்தத்தோடே
  rationale: எபிரெயச் சொற்றொடரின் சுருக்கத்தையும் அதன் அதிர்ச்சியூட்டும் கருத்தையும் காக்கிறது. இறைச்சியிலிருந்து இரத்தம் முறையாக வடிக்கப்படவில்லை என்ற விளக்கம் அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: עַל־הַדָּם என்ற தடை சார்ந்த சொற்றொடரை எவ்வளவு வெளிப்படையாக மொழிபெயர்ப்பது
  choice: இரத்தத்தோடே
  alternative: இரத்தம் இன்னும் அதில் இருக்கும்போதே
  rationale: மூல எபிரெயம் சுருக்கமாகவும் ஓரளவு விளக்கத்திற்குத் திறந்ததாகவும் உள்ளது. முதன்மை உரை அதன் வடிவத்தையும் இறையியல் அழுத்தத்தையும் காக்கிறது; இரத்தம் வடிக்கப்படாத இறைச்சி என்பதைக் குறிப்புரை விளக்குகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான உரைநடை பயன்படுத்தப்பட்டுள்ளது. போர்ச் சூழலை ‘கொள்ளைப்பொருட்கள்’ வெளிப்படுத்துகிறது; ‘இரத்தத்தோடே’ என்பது மூலத்தின் சுருக்கத்தையும் இறையியல் பதற்றத்தையும் தீர்த்துவிடாமல் காக்கிறது. எல்லா அடிக்குறிப்பு குறியீடுகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
