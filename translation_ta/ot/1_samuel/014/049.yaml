  text: וַ/יִּֽהְיוּ֙ בְּנֵ֣י שָׁא֔וּל יוֹנָתָ֥ן וְ/יִשְׁוִ֖י וּ/מַלְכִּי שׁ֑וּעַ וְ/שֵׁם֙ שְׁתֵּ֣י בְנֹתָ֔י/ו שֵׁ֤ם הַ/בְּכִירָה֙ מֵרַ֔ב וְ/שֵׁ֥ם הַ/קְּטַנָּ֖ה מִיכַֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/049.yaml
  text: 'Saul’s sons were Jonathan[a], Ishvi, and Malchi-shua; and the names of his two daughters were these: the name of the firstborn was Merab[b], and the name of the younger was Michal.'
translation:
  language: ta
  text: 'சவுலின் மகன்கள் யோனத்தான், இஸ்வி, மல்கிசூவா ஆகியோர் ஆவர். அவனுடைய இரண்டு மகள்களின் பெயர்கள்[a]: முதற்பேறானவளின் பெயர் மேராப்[b]; இளையவளின் பெயர் மீகாள்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயில் சொல்லுக்கு சொல், “அவனுடைய இரண்டு மகள்களின் பெயர்” என்று ஒருமையில் உள்ளது; தொடர்ந்து இரண்டு பெயர்கள் வருவதால் தமிழில் “பெயர்கள்” என்று தரப்பட்டுள்ளது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது “மூத்தவள்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּהְיוּ בְּנֵי שָׁאוּל
  choice: சவுலின் மகன்கள் … ஆகியோர்
  rationale: எபிரெயக் கூற்றின் எளிய இருப்புப் பொருளை இயல்பான நவீனத் தமிழில் தருகிறது; மூலத்தில் இல்லாத காலக் குறிக்கும் ‘இப்போது’ போன்ற சொல்லைச் சேர்க்கவில்லை.
- source_word: יוֹנָתָן
  choice: யோனத்தான்
  rationale: தமிழில் வழக்கிலுள்ள வேதாகமப் பெயர் வடிவம்.
- source_word: יִשְׁוִי
  choice: இஸ்வி
  rationale: மசோரா உரையின் மெய்யெழுத்து வடிவத்தை நெருக்கமாக ஒலிபெயர்க்கிறது.
- source_word: מַלְכִּי שׁוּעַ
  choice: மல்கிசூவா
  rationale: எபிரெயில் இரு கூறுகளாக எழுதப்பட்ட தனிப்பெயரைத் தமிழில் ஒரே பெயராக இயல்பாக ஒலிபெயர்க்கிறது.
- source_word: וְשֵׁם שְׁתֵּי בְנֹתָיו
  choice: அவனுடைய இரண்டு மகள்களின் பெயர்கள்
  rationale: எபிரெயில் ‘பெயர்’ ஒருமையில் இருந்தாலும், தொடர்ந்து இரண்டு பெயர்கள் வருவதால் தமிழில் இயல்பான பன்மை பயன்படுத்தப்பட்டது; மூலத்தின் ஒருமை அமைப்பு அடிக்குறிப்பில் தெரிவிக்கப்பட்டது.
- source_word: הַבְּכִירָה
  choice: முதற்பேறானவள்
  rationale: வயதில் மூத்தவள் என்ற பொருளுடன் பிறப்பு வரிசையையும் தெளிவாகப் பாதுகாக்கிறது.
- source_word: מֵרַב
  choice: மேராப்
  rationale: எபிரெயத் தனிப்பெயரின் வழக்கமான தமிழ் ஒலிபெயர்ப்பு.
- source_word: הַקְּטַנָּה
  choice: இளையவள்
  rationale: குடும்ப உறவுச் சூழலில் இது உடல் அளவை அல்ல, ஒப்பீட்டு வயதைச் சுட்டுகிறது.
- source_word: מִיכַל
  choice: மீகாள்
  rationale: எபிரெயத் தனிப்பெயரின் வழக்கமான தமிழ் ஒலிபெயர்ப்பு.
