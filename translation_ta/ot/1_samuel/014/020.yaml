base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/020.yaml
  text: Then Saul and all the people who were with him were summoned, and they came to the battle[a]. And behold, every man's sword was against his companion[b], with very great confusion.
translation:
  language: ta
  text: அப்போது சவுலும் அவரோடு இருந்த மக்கள் அனைவரும் ஒன்றுகூடும்படி அழைக்கப்பட்டார்கள்[a]. அவர்கள் போர்க்களத்துக்கு வந்தார்கள். இதோ, ஒவ்வொருவருடைய வாளும் அவரவர் தோழருக்கு எதிராக இருந்தது; மிகப் பெரும் குழப்பம் ஏற்பட்டது[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சவுலும் அவரோடு இருந்த மக்கள் அனைவரும் கூக்குரலிட்டார்கள்” அல்லது “ஒன்றுகூடினார்கள்.” இங்குள்ள எபிரெய வினைச்சொல்லைப் பலவிதமாகப் புரிந்துகொள்ளலாம்.
    reason: lexical_alternative
  - marker: b
    text: “மிகப் பெரும் பீதி” அல்லது “மிகப் பெரும் அமளி” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּזָּעֵק
  choice: ஒன்றுகூட அழைக்கப்பட்டார்கள்
  rationale: זעק என்பதன் நிஃபால் வடிவத்தை இச்சூழலில் செயல்பாட்டு அழைப்பை ஏற்று ஒன்றுகூடுதல் என்ற செயப்பாட்டு பொருளில் எடுத்துக்கொள்கிறது. ‘கூக்குரலிட்டார்கள்’ என்பதும் இலக்கண ரீதியாகச் சாத்தியமானதால் அடிக்குறிப்பில் வைக்கப்பட்டுள்ளது.
- source_word: הָעָם אֲשֶׁר אִתּוֹ
  choice: அவரோடு இருந்த மக்கள் அனைவரும்
  rationale: עָם என்பதன் நேரடியான ‘மக்கள்’ என்ற பொருளைப் பாதுகாக்கிறது; இராணுவச் சூழலை முன்னிட்டு ‘வீரர்கள்’ என்று மிகையாகக் குறிப்பாக்கவில்லை.
- source_word: וַיָּבֹאוּ עַד הַמִּלְחָמָה
  choice: அவர்கள் போர்க்களத்துக்கு வந்தார்கள்
  rationale: בוא + עד இங்கு போர் நடைபெறும் இடத்தை வந்தடைந்த இயக்கத்தைக் குறிக்கிறது. நேரடியாகப் போரில் ஈடுபட்டார்கள் என்று கூறாமல் மூலத்தின் எல்லையைப் பாதுகாக்க ‘போர்க்களத்துக்கு’ என இயல்பாக மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: וְהִנֵּה
  choice: இதோ, அங்கே
  rationale: הִנֵּה திடீரெனக் கண்ணில் படும் காட்சியின்மீது கவனத்தை ஈர்க்கிறது. ‘இதோ’ அதன் கதைநடை உயிரோட்டத்தைப் பாதுகாக்கிறது; ‘அங்கே’ தமிழில் காட்சியை இயல்பாக்குகிறது.
- source_word: חֶרֶב אִישׁ בְּרֵעֵהוּ
  choice: ஒவ்வொருவருடைய வாளும் அவரவர் தோழருக்கு எதிராக இருந்தது
  rationale: ‘ஒருவனின் வாள் அவனுடைய தோழனுக்கு எதிராக’ என்ற எபிரெயச் சொற்றொடரின் அமைப்பையும், எதிரிப்படையினர் ஒருவரையொருவர் தாக்கிய நிலையையும் பாதுகாக்கிறது. רֵעַ என்பதற்கு நெருங்கிய நட்பைத் திணிக்காமல் ‘தோழர்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: מְהוּמָה גְּדוֹלָה מְאֹד
  choice: மிகப் பெரும் குழப்பம் நிலவியது
  rationale: מְהוּמָה என்பது குழப்பம், பீதி, அமளி ஆகிய பொருட்களைத் தரலாம். பரந்த அடிப்படைப் பொருளான ‘குழப்பம்’ முதன்மை உரையில் வைக்கப்பட்டு மற்ற சாத்தியங்கள் அடிக்குறிப்பில் தரப்பட்டுள்ளன.
