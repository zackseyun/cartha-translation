base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/010.yaml
  text: But if they say this[a], ‘Come up to us,’ then we will go up, for Yahweh has given them into our hand[b], and this will be the sign for us.
translation:
  language: ta
  text: ஆனால் அவர்கள், ‘எங்களிடம் ஏறி வாருங்கள்’[a] என்று சொன்னால், நாங்கள் ஏறிச் செல்வோம். ஏனெனில் யாவே அவர்களை நம் கையில் ஒப்புக்கொடுத்திருக்கிறார்[b]. அதுவே நமக்கு அடையாளமாக இருக்கும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எங்களுக்கு எதிராக ஏறி வாருங்கள்.” எபிரெயச் சொற்றொடர் பெலிஸ்தியர்கள் இருந்த உயர்ந்த இடத்தை நோக்கி வருவதைக் குறிக்கலாம்; சூழலில் பகைமையுடன் வருவது உட்பொருளாக உள்ளது.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில், “நம் கையில்”; அதாவது, நமது அதிகாரத்துக்குள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: ஆனால் … சொன்னால்
  rationale: முந்தைய வசனத்தில் கூறப்பட்ட சாத்தியத்துக்கு மாறான நிபந்தனையை இயல்பான தமிழில் காட்டுகிறது.
- source_word: כֹּה יֹאמְרוּ
  choice: அவர்கள் … என்று சொன்னால்
  rationale: כֹּה நேரடிக் கூற்றை அறிமுகப்படுத்துகிறது; தமிழில் தனியே ‘இவ்வாறு’ என்று சேர்க்காமல் மேற்கோள் அமைப்பிலேயே அதன் பணியை இயல்பாக வெளிப்படுத்தலாம்.
- source_word: עֲלוּ עָלֵינוּ
  choice: எங்களிடம் ஏறி வாருங்கள்
  rationale: உயர்ந்திருந்த பெலிஸ்தியர்களின் நிலையை நோக்கி மேலே வருமாறு அழைப்பதே முதன்மையான இடவியல் பொருள்; போர்த் தாக்குதல் சூழலால் உட்பொருளாக இருக்கலாம், ஆகவே மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: וְעָלִינוּ
  choice: நாங்கள் ஏறிச் செல்வோம்
  rationale: நிபந்தனை நிறைவேறினால் தொடரும் செயலைக் குறிக்கும் விளைவுப் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: כִּי נְתָנָם
  choice: ஏனெனில் … அவர்களை … ஒப்புக்கொடுத்திருக்கிறார்
  rationale: כִּי காரணத்தைக் காட்டுகிறது; נתן என்பதன் நிறைவுற்ற வடிவம், அடையாளத்தை முன்னிட்டு எதிரிகளைத் தங்கள் அதிகாரத்துக்குள் கடவுள் உறுதியாக அளித்துவிட்டார் என்ற யோனத்தானின் நம்பிக்கையை வெளிப்படுத்துகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைத் திருப்பெயரான நான்கு எழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: בְּיָדֵנוּ
  choice: நம் கையில்
  rationale: எபிரெய மூலத்தின் ஒருமை உருவகத்தைத் தக்கவைக்கிறது; இது ‘நமது அதிகாரத்தில்’ என்ற மரபுத்தொடர் பொருளைக் கொண்டது.
- source_word: וְזֶה לָּנוּ הָאוֹת
  choice: இதுவே நமக்கான அடையாளம்
  rationale: வரவிருக்கும் நிகழ்வு உறுதிப்படுத்தும் அடையாளமாக இருக்கும் என்பதைச் சுருக்கமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைத் திருப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் பொதுப் பட்டம் அல்ல, தனிப்பட்ட இறைத் திருப்பெயர் நேரடியாக உள்ளது; எனவே அதைத் தமிழில் ஒலிபெயர்ப்பது மூல வேறுபாட்டைக் காக்கிறது.
- issue: נְתָנָם என்ற நிறைவுற்ற வினையின் காலமும் உறுதியும்
  choice: ஒப்புக்கொடுத்திருக்கிறார்
  alternative: ஒப்புக்கொடுப்பார்
  rationale: அடையாளம் நிகழ்ந்ததும் வெற்றி கடவுளால் ஏற்கெனவே உறுதிசெய்யப்பட்டதாக யோனத்தான் கருதும் நம்பிக்கையை நிறைவுற்ற வடிவம் காட்டுகிறது; அதை எதிர்கால வாக்குறுதியாக மட்டும் மாற்றவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், வாசிக்க எளிதான அதேவேளையில் கண்ணியமான நடையைக் கடைப்பிடிக்கிறது. போர்ச் சூழலைத் தேவையின்றி வெளிப்படையாக்காமல், மூலத்தின் இடவியல் பொருளையும் மரபுத்தொடரையும் அடிக்குறிப்புகளுடன் காக்கிறது.
