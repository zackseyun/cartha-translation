  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. மூலத்தின் ஆகுபெயர்ப் பயன்பாடும் ‘வயல்/நிலம்’ என்ற சொல்லியல் தெளிவின்மையும் அடிக்குறிப்புகளில் பாதுகாக்கப்பட்டுள்ளன.
