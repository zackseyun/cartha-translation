  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וְ/כָל הָ/אָ֖רֶץ בָּ֣אוּ בַ/יָּ֑עַר וַ/יְהִ֥י דְבַ֖שׁ עַל פְּנֵ֥י הַ/שָּׂדֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/025.yaml
  text: And all the people of the land entered the forest[b][a], and there was honey on the surface of the ground.
translation:
  language: ta
  text: நாட்டினர் அனைவரும் காட்டுக்குள் சென்றார்கள்[a]. அங்கே நிலத்தின் மேற்பரப்பில் தேன் இருந்தது[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொற்படியாக, ‘நாடு முழுவதும் காட்டுக்குள் சென்றது.’ இங்கு ‘நாடு’ என்பது நாட்டினரை ஆகுபெயராகக் குறிப்பதாகத் தெரிகிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘வயல்வெளியின் மேற்பரப்பில்.’ எபிரெயச் சொற்றொடர் கண்ணுக்குத் தெரியும் நிலப்பரப்பின்மேல் தேன் இருந்ததைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כָל הָ/אָ֖רֶץ
  choice: நாட்டினர் அனைவரும்
  rationale: எபிரெயச் சொற்றொடர் சொற்படியாக ‘நாடு முழுவதும்’ என்று இருந்தாலும், பன்மை வினைச்சொல்லுடனும் சூழலிலும் அது அங்கிருந்த மக்களைக் கூட்டாகக் குறிக்கிறது. ‘நாட்டினர் அனைவரும்’ இந்த ஆகுபெயர்ப் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: בָּ֣אוּ
  choice: சென்றார்கள்
  rationale: בוא என்பதற்கு ‘வந்தார்கள்/சென்றார்கள்’ அல்லது ‘நுழைந்தார்கள்’ என்று பொருள் கொள்ளலாம். காட்டுக்குள் நகர்ந்ததைத் தமிழில் இயல்பாகக் கூற ‘சென்றார்கள்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: בַ/יָּ֑עַר
  choice: காட்டுக்குள்
  rationale: יַעַר என்பது மரங்கள் அடர்ந்த காடு அல்லது வனப்பகுதியைக் குறிக்கிறது; இடப்பொருளைத் தெளிவாகக் காட்ட ‘காட்டுக்குள்’ என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: וַ/יְהִ֥י
  choice: அங்கே ... இருந்தது
  rationale: היה இங்கு காட்சியில் தேன் இருப்பதை அறிமுகப்படுத்துகிறது. தமிழில் இடத்தைத் தெளிவுபடுத்தும் இயல்பான இருப்புத் தொடராக இது அமைக்கப்பட்டுள்ளது.
- source_word: דְבַ֖שׁ
  choice: தேன்
  rationale: דְבַשׁ என்பதன் நேரான பொருள் ‘தேன்.’ காட்டு சூழல் காட்டுத்தேனை உணர்த்தக்கூடும்; ஆனால் மூலத்தில் அது வெளிப்படையாகச் சொல்லப்படாததால் ‘தேன்’ என்றே வைக்கப்பட்டுள்ளது.
- source_word: עַל פְּנֵ֥י הַ/שָּׂדֶֽה
  choice: நிலத்தின் மேற்பரப்பில்
  rationale: עַל־פְּנֵי என்பது ‘மேற்பரப்பில்’ என்றும் שָׂדֶה என்பது ‘வயல்/வெளி/நிலம்’ என்றும் பொருள்படலாம். காட்டுச் சூழலில் ‘வயல்’ என்பது தவறான காட்சியை உருவாக்கக்கூடும் என்பதால், காணக்கூடிய நிலப்பரப்பைக் குறிக்கும் ‘நிலத்தின் மேற்பரப்பில்’ தேர்ந்தெடுக்கப்பட்டுள்ளது.
