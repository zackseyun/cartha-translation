base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/043.yaml
  text: Then Saul said to Jonathan[a], “Tell me what you have done.” And Jonathan told him and said, “I indeed tasted a little honey on the tip of the staff that was in my hand, and here I am, about to die.”
translation:
  language: ta
  text: அப்போது சவுல் யோனத்தானிடம், “நீ என்ன செய்தாய் என்று எனக்குச் சொல்” என்றான். யோனத்தான் அவனிடம், “என் கையில் இருந்த கோலின் நுனியால் சிறிது தேனை உண்மையாகவே சுவைத்தேன்; இதோ, நான் சாகப்போகிறேன்!”[a] என்று சொன்னான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நான் கோலின் நுனியால் சிறிது தேனை உண்மையாகவே சுவைத்தேன்; இப்போது நான் சாக வேண்டுமா?” எபிரெயத்தில் “சுவைத்தேன்” என்ற வினை வலியுறுத்தப்பட்டுள்ளது. இறுதிக் கூறை விதியை ஏற்றுக்கொள்ளும் கூற்றாகவோ, எதிர்ப்புணர்வுள்ள சொல்லாட்சிக் கேள்வியாகவோ புரிந்துகொள்ளலாம்.
    reason: மூல எபிரெயத்தின் வினை வலியுறுத்தலையும் இறுதிக் கூறின் உண்மையான இலக்கண-சூழல் தெளிவின்மையையும் பதிவு செய்கிறது.
lexical_decisions:
- source_word: הַגִּידָה לִּי
  choice: எனக்குச் சொல்
  rationale: נגד என்ற வினையின் கட்டளை வடிவத்தை இயல்பான நவீனத் தமிழில் நேரடியான கோரிக்கையாகத் தருகிறது.
- source_word: מֶה עָשִׂיתָה
  choice: நீ என்ன செய்தாய்
  rationale: முடிந்த செயலையும் அதன் தற்போதைய விளைவையும் சூழல் உணர்த்துவதால், இயல்பான தமிழ் இறந்தகால வினா போதுமானது.
- source_word: וַיַּגֶּד לוֹ
  choice: அவனிடம் ... சொன்னான்
  rationale: முன்னுள்ள נגד வினையுடன் பொருள் ஒற்றுமையைப் பேணுகிறது; தமிழ்க் கதைநடையில் இயல்பாக உள்ளது.
- source_word: טָעֹם טָעַמְתִּי
  choice: சுவைத்தேன்
  rationale: எபிரெயத்தில் வினைமுற்றுடன் வரும் infinitive absolute செயலை உறுதிப்படுத்துகிறது. தமிழில் செயற்கையான இரட்டிப்பைத் தவிர்த்து, இறுதி வியப்புக்குறியுடனும் சூழலுடனும் அந்த வலியுறுத்தல் வெளிப்படுகிறது; மாற்றுப் புரிதல் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: בִּקְצֵה הַמַּטֶּה
  choice: கோலின் நுனியால்
  rationale: קצה என்பது முனை அல்லது கடைசிப் பகுதியைக் குறிக்கிறது. முந்தைய நிகழ்வில் கோலைத் தேனில் தொட்டு வாய்க்குக் கொண்டுசென்ற செயலுடன் ஒத்துப்போக, தமிழில் கருவிப்பொருள் வேற்றுமை இயல்பாக உள்ளது.
- source_word: הַמַּטֶּה
  choice: கோல்
  rationale: கையில் எடுத்துச் செல்லப்படும் staff என்பதற்கான தெளிவான, பொதுவான நவீனத் தமிழ் சொல்.
- source_word: מְעַט דְּבַשׁ
  choice: சிறிது தேன்
  rationale: அளவைக் குறிக்கும் எபிரெயச் சொற்றொடரைச் சுருக்கமாகவும் இயல்பாகவும் பிரதிபலிக்கிறது.
- source_word: הִנְנִי
  choice: இதோ, நான்
  rationale: பேச்சாளரின் உடனடி நிலையைக் கவனத்திற்கு கொண்டுவரும் הִנְנִי என்பதன் சுட்டும், வலியுறுத்தும் தன்மையைப் பேணுகிறது.
- source_word: אָמֽוּת
  choice: சாக வேண்டியிருக்கிறது
  rationale: சவுலின் ஆணையின் விளைவாக எதிர்நிற்கும் மரணத்தை உணர்த்துகிறது; இது ஒப்புக்கொள்ளும் கூற்றாகவும் எதிர்ப்புணர்வுள்ள வினாவாகவும் கேட்கக்கூடிய மூலத்தின் பதற்றத்தைத் தக்கவைக்கிறது.
theological_decisions:
- issue: 'யோனத்தானின் இறுதிக் கூற்று: ஒப்புக்கொள்ளும் கூற்றா அல்லது எதிர்ப்புணர்வுள்ள வினாவா'
  choice: 'முதன்மை உரையில் வியப்புடன் கூடிய கூற்றாக: “இதோ, நான் சாக வேண்டியிருக்கிறது!”'
  alternative: “இப்போது நான் சாக வேண்டுமா?”
  rationale: எபிரெயத்தில் கேள்விக்குறியீடு இல்லை; ஆகவே நேரடிக் கூற்று முதன்மை உரைக்கு ஏற்றது. எனினும் சூழலும் மொழிநடையும் இதை சொல்லாட்சிக் கேள்வியாகக் கேட்க அனுமதிப்பதால் அந்த உண்மையான தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதாகவும் வேதாகமக் கதைநடைக்கேற்ற கண்ணியத்துடனும் வடிவமைக்கப்பட்டது. “சாக வேண்டியிருக்கிறது” என்பது இயல்பான தற்போதைய விளைவைத் தருகிறது; இறுதி வியப்புக்குறி யோனத்தானின் அதிர்ச்சியையும் எதிர்ப்புணர்வையும் காட்டுகிறது, ஆனால் வினாவாகத் தீர்மானிக்கவில்லை.
