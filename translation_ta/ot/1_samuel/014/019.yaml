  text: And it happened[a], while Saul was speaking to the priest, that the tumult in the camp of the Philistines kept increasing more and more. So Saul said to the priest, “Withdraw your hand.”
translation:
  language: ta
  text: சவுல் ஆசாரியனிடம் பேசிக்கொண்டிருக்கும்போதே, பெலிஸ்தரின் முகாமிலிருந்த அமளி மென்மேலும் அதிகரித்துக்கொண்டே போனது. அப்போது சவுல் ஆசாரியனிடம், “உன் கையைப் பின்னுக்கு இழுத்துக்கொள்[a]” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொற்பட, “உன் கையைச் சேர்த்துக்கொள்.” ஆசாரியன் செய்துகொண்டிருந்த செயலை நிறுத்தும்படி சவுல் கூறுகிறான்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי עַד דִּבֶּר
  choice: பேசிக்கொண்டிருக்கும்போதே
  rationale: וַיְהִי என்பது எபிரெயக் கதைநடையின் நிகழ்வுத் தொடரை அறிமுகப்படுத்துகிறது; தமிழில் தனியே ‘அது நிகழ்ந்தது’ என்று மொழிபெயர்ப்பது இயல்பற்றதாக இருப்பதால், עַד דִּבֶּר குறிக்கும் தொடர்ந்துகொண்டிருந்த செயலையும் திடீர் திருப்பத்தையும் ‘பேசிக்கொண்டிருக்கும்போதே’ என இயல்பாக வெளிப்படுத்துகிறது.
- source_word: הַכֹּהֵן
  choice: ஆசாரியன்
  rationale: முன்னரே அறிமுகமான குறிப்பிட்ட כהן-ஐக் குறிக்கும் வழக்கமான, கண்ணியமான தமிழ் வேதாகமச் சொல்.
- source_word: הֶהָמוֹן
  choice: அமளி
  rationale: வெறும் சத்தத்தை மட்டுமல்லாமல், முகாமிலிருந்த குழப்பமான ஆரவாரத்தையும் கலக்கத்தையும் குறிக்கிறது.
- source_word: בְּמַחֲנֵה פְלִשְׁתִּים
  choice: பெலிஸ்தரின் முகாமிலிருந்த
  rationale: எபிரெயக் கட்டமைப்பின் உறவையும் இடப்பொருளையும் இயல்பான தமிழில் தெளிவாகத் தருகிறது.
- source_word: וַיֵּלֶךְ הָלוֹךְ וָרָב
  choice: மென்மேலும் அதிகரித்துக்கொண்டே போனது
  rationale: வினைச்சொல்லுடன் வரும் infinitive absolute அமைப்பு தொடர்ச்சியான தீவிர அதிகரிப்பைக் குறிக்கிறது; இந்தத் தமிழ் சொற்றொடர் அந்த முன்னேற்றத்தையும் வலுப்பாட்டையும் காக்கிறது.
- source_word: אֱסֹף יָדֶךָ
  choice: உன் கையைப் பின்னுக்கு இழுத்துக்கொள்
  rationale: சொற்பட ‘உன் கையைச் சேர்/ஒடுக்கிக்கொள்’ என்ற உருவகத்தைத் தக்கவைத்தபடி, ஆசாரியன் செய்துகொண்டிருந்த செயலை நிறுத்தும்படி சவுல் கூறியதை இயல்பாக உணர்த்துகிறது.
theological_decisions:
- issue: ஆசாரியன் செய்த செயல் என்ன என்பது வசனத்தில் வெளிப்படையாகக் கூறப்படவில்லை
  choice: கட்டளையின் கை-உருவகத்தை முதன்மை உரையில் தக்கவைத்தல்
  alternative: ‘நிறுத்து’ என்று மட்டும் மொழிபெயர்த்தல்
  rationale: சூழல் ஆசாரியச் செயலை நிறுத்துவதைச் சுட்டினாலும், எபிரெய உரை அந்தச் செயலைத் துல்லியமாகப் பெயரிடவில்லை. ஆகவே விளக்கத்தை முதன்மை உரைக்குள் புகுத்தாமல் அடிக்குறிப்பில் குறிப்பிடுவது உண்மையான தெளிவின்மையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘அமளி’ என்பது சத்தத்தையும் குழப்பத்தையும் ஒருங்கே உணர்த்துகிறது; ‘மென்மேலும் அதிகரித்துக்கொண்டே போனது’ என்பது எபிரெய மொழியின் தொடர்ச்சியான தீவிரத்தைப் பாதுகாக்கிறது.
