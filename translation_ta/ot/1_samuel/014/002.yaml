source:
  edition: WLC
  text: וְ/שָׁא֗וּל יוֹשֵׁב֙ בִּ/קְצֵ֣ה הַ/גִּבְעָ֔ה תַּ֥חַת הָ/רִמּ֖וֹן אֲשֶׁ֣ר בְּ/מִגְר֑וֹן וְ/הָ/עָם֙ אֲשֶׁ֣ר עִמּ֔/וֹ כְּ/שֵׁ֥שׁ מֵא֖וֹת אִֽישׁ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/002.yaml
  text: Saul was staying at the outskirts of Gibeah[a], under the pomegranate tree that is at Migron[b], and the people who were with him were about six hundred men.
translation:
  language: ta
  text: சவுல் கிபியாவின் ஓரத்தில்[a], மிக்ரோனில் உள்ள மாதுளை மரத்தின் கீழ் தங்கியிருந்தார்; அவருடன் இருந்த மக்கள் ஏறக்குறைய அறுநூறு பேர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘கிபியாவின் ஓரத்தில் உட்கார்ந்திருந்தார்.’ எபிரெயப் பங்கேற்புவினை உட்கார்ந்திருப்பதையோ ஓரிடத்தில் தங்கி இருப்பதையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: יוֹשֵׁב
  choice: தங்கியிருந்தார்
  rationale: ישׁב என்ற எபிரெயப் பங்கேற்புவினை ‘உட்கார்ந்திருத்தல்’ அல்லது ஓரிடத்தில் ‘தங்கியிருத்தல்’ எனப் பொருள்படலாம். இந்தப் படைச்சூழலில் சவுலின் தொடர்ந்த இருப்பிடத்தை இயல்பாகத் தெரிவிக்க ‘தங்கியிருந்தார்’ பொருத்தமானது.
- source_word: בִּקְצֵה הַגִּבְעָה
  choice: கிபியாவின் எல்லைப்பகுதியில்
  rationale: קָצֶה என்பது ஓரம், எல்லை அல்லது கடைப்பகுதியைக் குறிக்கிறது. இங்கு הַגִּבְעָה சூழலின்படி இடப்பெயரான ‘கிபியா’; ‘எல்லைப்பகுதி’ அதன் இடஞ்சார்ந்த பொருளை அளவுக்கு மீறி வரையறுக்காமல் தெரிவிக்கிறது.
- source_word: תַּחַת הָרִמּוֹן
  choice: மாதுளை மரத்தின் கீழ்
  rationale: רִמּוֹן சொல்லின் நேரடிப் பொருள் ‘மாதுளை’; இந்த இடஞ்சுட்டும் தொடரில் அது மாதுளை மரத்தைக் குறிக்கிறது. தமிழில் பொருள் தெளிவாக இருக்க ‘மரம்’ சேர்க்கப்பட்டுள்ளது.
- source_word: אֲשֶׁר בְּמִגְרוֹן
  choice: மிக்ரோனில் இருந்த
  rationale: இந்த உறவுத்தொடர் இயல்பாகவே மாதுளை மரத்தின் இருப்பிடத்தை அடையாளப்படுத்துகிறது. עברகாலக் கதைநடைக்கு ஏற்ப ‘இருந்த’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: וְהָעָם אֲשֶׁר עִמּוֹ
  choice: அவருடன் இருந்தவர்கள்
  rationale: עָם என்பது பொதுவாக மக்கள் அல்லது உடனிருந்த குழுவைக் குறிக்கும். படைவீரர்கள் என்று பொருளைக் குறுக்காமல், இச்சூழலில் இயல்பான தமிழாக ‘அவருடன் இருந்தவர்கள்’ என வழங்கப்பட்டுள்ளது.
- source_word: כְּשֵׁשׁ מֵאוֹת אִישׁ
  choice: ஏறக்குறைய அறுநூறு பேர்
  rationale: முன்னொட்டு כְּ எண்ணிக்கை தோராயமானது என்பதைக் காட்டுகிறது; ஆகவே ‘ஏறக்குறைய’ காக்கப்பட்டுள்ளது. எண்ணிக்கைக்குப் பின் வரும் אִישׁ என்பதற்கு இயல்பான தமிழில் ‘பேர்’ பயன்படுத்தப்பட்டுள்ளது.
