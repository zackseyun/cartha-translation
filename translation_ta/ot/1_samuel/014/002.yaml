revisions:
- from: சவுல் கிபியாவின் எல்லைப்பகுதியில்[a], மிக்ரோனில் இருந்த மாதுளை மரத்தின் கீழ் தங்கியிருந்தார். அவருடன் இருந்தவர்கள் ஏறக்குறைய அறுநூறு பேர்.
  to: சவுல் கிபியாவின் ஓரத்தில்[a], மிக்ரோனில் உள்ள மாதுளை மரத்தின் கீழ் தங்கியிருந்தார்; அவருடன் இருந்த மக்கள் ஏறக்குறைய அறுநூறு பேர்.
  rationale: “கிபியாவின் ஓரத்தில்” more closely reflects the Hebrew spatial expression while remaining idiomatic. “மிக்ரோனில் உள்ள” naturally identifies the tree’s location without making an unnecessary temporal assertion. The second clause now explicitly retains “மக்கள்” and the source conjunction. The existing footnote anchor remains correctly attached to the location phrase; no footnote is needed for the Tamil clarification “மரம்.”
