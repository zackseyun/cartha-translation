translation_notes:
  register: நவீனத் தரமான, எளிதில் புரியும் மரியாதைநடைத் தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘மாதுளை மரம்’ என்பது தமிழில் தெளிவுக்காக இயல்பாக விரிவாக்கப்பட்டுள்ளது; அதனால் அதற்குத் தனிக் குறிப்புரை தேவையில்லை. இடப்பெயர்கள் ‘கிபியா’, ‘மிக்ரோன்’ என ஒலிபெயர்க்கப்பட்டுள்ளன.
