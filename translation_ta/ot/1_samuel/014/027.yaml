base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/027.yaml
  text: But Jonathan had not heard when his father put the people under oath[a], so he stretched out the tip of the staff that was in his hand and dipped it into the honeycomb, and he brought his hand to his mouth[b], and his eyes brightened.
translation:
  language: ta
  text: ஆனால், தன் தந்தை மக்களிடம் சத்தியம் செய்ய வைத்தபோது யோனத்தான் அதைக் கேட்டிருக்கவில்லை. ஆகவே, தன் கையிலிருந்த கோலின் நுனியை நீட்டி, அதைத் தேனடையில் தோய்த்தார்[a]. பின்பு தன் கையை வாய்க்குக் கொண்டுவந்தார்; அவருடைய கண்கள் ஒளிபெற்றன[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லர்த்தமாக, “தேனின் காடு” அல்லது “தேனின் புதர்”; இந்த எபிரெயச் சொற்றொடர் தேனடை அல்லது அடர்ந்த தேன் திரளைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “கண்கள் ஒளிபெற்றன” என்பது, உண்டபின் புத்துணர்ச்சியோ விழிப்புணர்வோ திரும்பியதைக் குறிக்கும் எபிரெய மரபுத்தொடர்.
    reason: cultural_note
lexical_decisions:
- source_word: שָׁמַע
  choice: கேட்டிருக்கவில்லை
  rationale: சவுல் விதித்த ஆணையை யோனத்தான் அறிந்திருக்கவில்லை என்பதே சூழலின் பொருள்; கீழ்ப்படிய மறுத்தார் என்பதல்ல. நிகழ்வுகளின் காலவரிசையையும் இவ்வடிவம் இயல்பாகக் காட்டுகிறது.
- source_word: בְּהַשְׁבִּיעַ
  choice: ஆணைக்குக் கட்டுப்படுத்தியபோது
  rationale: Hiphil வடிவம் மக்களை ஆணையின்கீழ் கொண்டுவருதல் அல்லது சத்தியத்தால் கட்டுப்படுத்துதல் என்று பொருள்படுகிறது. நவீனத் தமிழில் சட்டப்பூர்வமான கட்டுப்பாட்டை இது தெளிவாகக் கூறுகிறது.
- source_word: וַיִּשְׁלַח
  choice: நீட்டி
  rationale: கோலின் நுனியுடன் வரும் இச்சொல், அதை வெளியே நீட்டிய செயலைக் குறிக்கிறது; சொல்லுக்குச் சொல் ‘அனுப்பினார்’ என்பது இங்கு இயல்பல்ல.
- source_word: קְצֵה הַמַּטֶּה
  choice: கோலின் நுனி
  rationale: தேன் எடுக்கப் பயன்படுத்தப்பட்ட கோலின் முனைப்பகுதியை இயல்பாகவும் துல்லியமாகவும் குறிக்கிறது.
- source_word: וַיִּטְבֹּל אוֹתָהּ
  choice: அதைத் தோய்த்தார்
  rationale: பெண்பால் பதிலிடுபெயர் கோலின் நுனியைக் குறிக்கிறது. ‘தோய்த்தார்’ என்பது தேனில் அமிழ்த்தி எடுத்த செயலை இயல்பாகத் தருகிறது.
- source_word: בְּיַעְרַת הַדְּבָשׁ
  choice: தேனடையில்
  rationale: எபிரெயச் சொற்றொடர் சொல்லர்த்தத்தில் ‘தேனின் காடு/புதர்’ என இருந்தாலும், சூழலில் தேன்கூடு அல்லது அடர்ந்த தேன் திரளைக் குறிக்கலாம். கோலின் நுனியைத் தோய்க்கும் செயலுக்கு ‘தேனடை’ பொருத்தமானது; மாற்று சொல்லர்த்தம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: וַיָּשֶׁב יָדוֹ אֶל פִּיו
  choice: தன் கையை வாயருகே கொண்டுசென்றார்
  rationale: தேனை உண்ணுவதற்காகக் கையை வாயிடம் கொண்டுவந்த செயலைத் தெளிவாகச் சொல்கிறது; ‘கையைத் திருப்பினார்’ என்ற சொல்லர்த்த மொழிபெயர்ப்பு தமிழில் குழப்பம் தரலாம்.
- source_word: וַתָּרְאֶנָה עֵינָיו
  choice: அவருடைய கண்கள் ஒளிபெற்றன
  rationale: உண்டபின் புத்துணர்ச்சியும் விழிப்பும் திரும்பியதைக் குறிக்கும் எபிரெய உருவகத்தை விளக்கிவிடாமல் அப்படியே பாதுகாக்கிறது.
