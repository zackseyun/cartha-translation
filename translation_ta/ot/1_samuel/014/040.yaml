base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/040.yaml
  text: Then he said to all Israel[a], “You be on one side, and I and Jonathan my son will be on the other side.” And the people said to Saul, “Do what seems good in your eyes.”
translation:
  language: ta
  text: அப்போது அவர் இஸ்ரவேலர் அனைவரிடமும், “நீங்கள் ஒரு பக்கத்தில் இருங்கள்[a]; நானும் என் மகன் யோனத்தானும் மறுபக்கத்தில் இருப்போம்” என்றார். மக்கள் சவுலிடம், “உங்கள் பார்வைக்கு நல்லதாகத் தோன்றுவதைச் செய்யுங்கள்” என்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நீங்கள் ஒரு பக்கத்தில் இருங்கள் ... நாங்கள் மறுபக்கத்தில் இருப்போம்.” எபிரேயத்தில் ‘இருங்கள்’ என்னும் வினை, ‘ஒரு பக்கத்திற்கு’ என்ற சொல்லுடன் வருகிறது; இது மற்றொரு தரப்புக்கு எதிராகத் தங்கள் இடத்தை எடுத்துக்கொள்வதைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְעֵבֶר אֶחָד
  choice: ஒரு பக்கத்தில் / மறுபக்கத்தில்
  rationale: עֵבֶר என்பது அடிப்படையில் ‘பக்கம்’ அல்லது ‘அப்பாற்பட்ட பகுதி’ என்பதைக் குறிக்கிறது. சீட்டுப்போடும் இச்சூழலில் இரு தரப்புகளின் எதிரெதிரான நிலையை இயல்பான தமிழில் இது தெளிவாக வெளிப்படுத்துகிறது.
- source_word: תִּהְיוּ / נִהְיֶה
  choice: இருங்கள் / இருப்போம்
  rationale: היה என்ற வினையின் அடிப்படைப் பொருளான ‘இரு’ என்பதைக் காத்து, לְעֵבֶר אֶחָד என்பதுடன் சேர்ந்து தரப்புகளாகப் பிரிந்து நிற்கும் கருத்தை இயல்பாகத் தெரிவிக்கிறது; ‘நில்லுங்கள்’ என்று மூலத்தில் இல்லாத உடல் நிலையைத் தேவையின்றி வலியுறுத்தவில்லை.
- source_word: כָּל יִשְׂרָאֵל
  choice: இஸ்ரவேலர் அனைவரும்
  rationale: கூடியிருந்த இஸ்ரவேல் மக்களைச் சுட்டும் கூட்டுப்பெயரை நவீனத் தமிழில் இயல்பாக அளிக்கிறது.
- source_word: בְּנִי
  choice: என் மகன்
  rationale: மூலத்தில் வெளிப்படையாக உள்ள தந்தை–மகன் உறவைக் காக்கிறது.
- source_word: הַטּוֹב בְּעֵינֶיךָ
  choice: உங்கள் பார்வைக்கு நல்லதாகத் தோன்றுவது
  rationale: ‘உங்கள் கண்களில் நல்லது’ என்ற எபிரேய மரபுத்தொடரின் உருவகத்தையும், ஒருவருக்குச் சரியாக அல்லது ஏற்றதாகத் தோன்றுவது என்ற பொருளையும் புரியத்தக்க தமிழில் காக்கிறது.
- source_word: עֲשֵׂה
  choice: செய்யுங்கள்
  rationale: எளிய கட்டளை வடிவத்தை மரியாதைப் பன்மையுடன் இயல்பான தமிழில் தருகிறது.
