  register: நவீன நிலையான தமிழில் எளிமையும் கண்ணியமும் கொண்ட உரை. அரசனிடம் மக்கள் பேசுவதால் ‘உங்கள்/செய்யுங்கள்’ என்ற மரியாதை வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன. எபிரேய வாக்கியத்தின் இரு தரப்புகளுக்கிடையேயான சமச்சீர் அமைப்பு இயன்றவரை காக்கப்பட்டுள்ளது.
