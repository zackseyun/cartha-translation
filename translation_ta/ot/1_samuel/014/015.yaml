  source_fidelity: மூலத்தின் தொடர்ச்சியான חרדה/חרדו சொல் மீளுரைப்பை ‘நடுக்கம்/நடுங்கின’ நன்கு காக்கிறது. ஆனால் அடிக்குறிப்பு சுட்டி விளக்கும் לְחֶרְדַּת אֱלֹהִים இறுதித் தொடரில் அல்லாமல் ‘முகாமிலும்’ என்பதோடு இணைக்கப்பட்டுள்ளது; இது மூலத் தெளிவுக்கு இடையூறாகிறது. ‘வயல்வெளி’ என்பது בַשָּׂדֶה என்பதற்கு ‘வெளியில்’ என்பதைக் காட்டிலும் நேரடியானது.
