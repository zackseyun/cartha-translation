  text: וַ/תְּהִי֩ חֲרָדָ֨ה בַ/מַּחֲנֶ֤ה בַ/שָּׂדֶה֙ וּ/בְ/כָל הָ/עָ֔ם הַ/מַּצָּב֙ וְ/הַ/מַּשְׁחִ֔ית חָרְד֖וּ גַּם הֵ֑מָּה וַ/תִּרְגַּ֣ז הָ/אָ֔רֶץ וַ/תְּהִ֖י לְ/חֶרְדַּ֥ת אֱלֹהִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/015.yaml
  text: And there was trembling in the camp[a], in the field, and among all the people; the garrison and the raiding party also trembled. And the earth quaked, so that it became a trembling from God.
translation:
  language: ta
  text: அப்போது முகாமிலும், வயல்வெளியிலும், மக்கள் அனைவரிடையிலும் நடுக்கம் ஏற்பட்டது; காவற்படையும் சூறையாடும் படையும் கூட நடுங்கின. பூமியும் அதிர்ந்தது; அது கடவுளிடமிருந்து வந்த நடுக்கமாயிற்று[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘மிகப் பெரிய நடுக்கம்’ அல்லது ‘தெய்வீகப் பேரச்சம்’ என்றும் மொழிபெயர்க்கலாம். இவ்வசனத்தின் இறுதியிலுள்ள எபிரெயத் தொடர், நடுக்கம் கடவுளிடமிருந்து வந்தது என்பதையோ அதன் மிகுதியையோ குறிக்கக்கூடும்.
    reason: alternative_reading
lexical_decisions:
- source_word: חֲרָדָה / חרד
  choice: நடுக்கம் / நடுங்கினர்
  rationale: அச்சத்தால் உடல் நடுங்கும் உருவகத்தையும், ஒரே எபிரெய வேர் மீண்டும் வருவதையும் தமிழில் இயன்றவரை காக்கிறது.
- source_word: בַמַּחֲנֶה
  choice: முகாமில்
  rationale: நேரடியான இடப்பொருளை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: בַשָּׂדֶה
  choice: வெளியில்
  rationale: இங்கு முகாமுக்கு வெளியேயுள்ள திறந்த நிலப்பரப்பைக் குறிக்கும்; ‘வயலில்’ என்பதன் வேளாண்மைச் சாயலைத் தவிர்க்கிறது.
- source_word: וּבְכָל הָעָם
  choice: மக்கள் அனைவரிடையிலும்
  rationale: עָם என்பதன் அடிப்படைப் பொருளைத் தக்கவைத்து, இச்சூழலில் படையினரையும் உள்ளடக்க அனுமதிக்கிறது.
- source_word: הַמַּצָּב
  choice: காவற்படை
  rationale: நிலைப்படுத்தப்பட்ட இராணுவக் காவல் அணியை இயல்பாகக் குறிக்கிறது.
- source_word: הַמַּשְׁחִית
  choice: கொள்ளையிடும் படைப்பிரிவு
  rationale: ஹிஃபில் பங்கேற்புவினையின் அழிக்கும் அல்லது சூறையாடும் இராணுவச் செயல்பாட்டையும் அதன் கூட்டுப்பொருளையும் வெளிப்படுத்துகிறது.
- source_word: וַתִּרְגַּז הָאָרֶץ
  choice: நிலமும் அதிர்ந்தது
  rationale: மனிதர்களின் அச்ச நடுக்கத்திலிருந்து நிலத்தின் உடல் அதிர்வுக்கு நகரும் உயர்வைத் தெளிவாகக் காட்டுகிறது.
- source_word: לְחֶרְדַּת אֱלֹהִים
  choice: கடவுளிடமிருந்து வந்த நடுக்கம்
  rationale: אֱלֹהִים என்பதை மூலத்தைக் குறிக்கும் உறவாக வாசித்து, நிகழ்வின் தெய்வீக ஆதாரத்தை வெளிப்படுத்துகிறது; தீவிரத்தைக் குறிக்கும் மாற்று வாசிப்பு அடிக்குறிப்பில் வைக்கப்படுகிறது.
theological_decisions:
- issue: לְחֶרְדַּת אֱלֹהִים என்பதன் பொருள்
  choice: கடவுளிடமிருந்து வந்த நடுக்கம்
  alternative: மிகப் பெரிய நடுக்கம்; தெய்வீகப் பேரச்சம்
  rationale: எபிரெயத் தொடர் கடவுளை நிகழ்வின் மூலமாகவும், அல்லது மிகுதியைக் காட்டும் வழக்காகவும் புரிந்துகொள்ள இடமளிக்கிறது. முதன்மை உரை மூலப்பொருளைத் தேர்ந்தெடுக்கிறது; மாற்று வாசிப்பை அடிக்குறிப்பு காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான உரைநடை. ‘நடுக்கம்/நடுங்கினர்’ என்ற மீளுரைப்பால் மூலத்தின் சொல்விளையாட்டு காக்கப்பட்டுள்ளது. இராணுவச் சொற்கள் பொதுவாசகர்களுக்குப் புரியுமாறு தேர்ந்தெடுக்கப்பட்டுள்ளன.
