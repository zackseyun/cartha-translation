- from: அன்று அவர்கள் மிக்மாஸ்[a] முதல் ஆயலோன்வரை பெலிஸ்தியரை வெட்டி வீழ்த்தினார்கள்; மக்கள் மிகவும் களைத்துப்போனார்கள்.
