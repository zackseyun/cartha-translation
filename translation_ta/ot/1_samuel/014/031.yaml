  yaml_path: translation/ot/1_samuel/014/031.yaml
  text: That day they struck down the Philistines from Mikmash to Aijalon[a], and the people were very weary.
translation:
  language: ta
  text: அன்று அவர்கள் மிக்மாஸ்[a] முதல் அய்யாலோன் வரை பெலிஸ்தியரைத் தாக்கினர்; மக்கள் மிகவும் களைத்துப்போனார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இந்த எபிரெய இடப்பெயர் ‘மிக்மாஷ்’ என்றும் எழுதப்படுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּכּוּ
  choice: வெட்டி வீழ்த்தினார்கள்
  rationale: נכה என்ற வினை போர்ச் சூழலில் தாக்கிக் கொல்வதையோ வீழ்த்துவதையோ குறிக்கிறது. ‘வெட்டி வீழ்த்தினார்கள்’ என்பது வெறும் ‘தாக்கினார்கள்’ என்பதைவிட இராணுவச் சூழலைத் தெளிவாகக் காட்டுகிறது; அதே நேரத்தில் முழுமையாக அழித்தார்கள் என்ற மிகைப்பையும் சேர்ப்பதில்லை.
- source_word: בַּיּוֹם הַהוּא
  choice: அன்று
  rationale: ‘அந்த நாளில்’ என்ற எபிரெயக் காலக் குறிப்பை இயல்பான நவீனத் தமிழில் சுருக்கமாகவும் முழுப் பொருளுடனும் தருகிறது.
- source_word: בַּפְּלִשְׁתִּים
  choice: பெலிஸ்தியரை
  rationale: பகைமைச் செயல் யாருக்கு எதிராக நிகழ்ந்தது என்பதைக் குறிக்கும் சொல்லைத் தமிழில் நேரடி செயப்படுபொருளாகத் தருகிறது.
- source_word: מִמִּכְמָשׂ אַיָּלֹנָה
  choice: மிக்மாஸ் முதல் ஆயலோன்வரை
  rationale: מִן தொடக்க இடத்தையும், אַיָּלֹנָה என்பதிலுள்ள திசை நோக்கிய இறுதியொட்டு சென்றடையும் இடத்தையும் குறிக்கின்றன. தமிழில் ‘முதல் … வரை’ என்பது இந்தப் புவியியல் எல்லையை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וַיָּעַף
  choice: களைத்துப்போனார்கள்
  rationale: இந்த வினை சோர்வடைதல் அல்லது வலுவிழத்தலைக் குறிக்கிறது. ‘களைத்துப்போனார்கள்’ என்பது தீவிரமான சோர்வை இயல்பான தமிழில் கூறுகிறது; ‘முற்றிலும் சோர்ந்து விழுந்தார்கள்’ போன்ற மிகையான பொருளைச் சேர்ப்பதில்லை.
- source_word: הָעָם
  choice: மக்கள்
  rationale: எபிரெயில் ஒருமை வடிவிலுள்ள கூட்டுப்பெயரைத் தமிழில் இயல்பான பன்மைப் பொருளுடன் ‘மக்கள்’ எனத் தருகிறது.
- source_word: מְאֹד
  choice: மிகவும்
  rationale: சோர்வின் தீவிரத்தை வலியுறுத்தும் பொதுவான எபிரெய வினையடை; ‘மிகவும்’ அதன் நேரான, இயல்பான தமிழ் இணை.
