base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/034.yaml
  text: And Saul said[a], “Spread out among the people and tell them, ‘Each man must bring me his ox and each man his sheep, and you must slaughter them here and eat, so that you may not sin against Yahweh by eating with the blood.’” So all the people brought, each man his ox in his hand that night[b], and they slaughtered them there.
translation:
  language: ta
  text: 'சவுல் சொன்னார்: “மக்களிடையே பரவிச் சென்று அவர்களிடம், ‘ஒவ்வொருவனும் தன் மாட்டையும், ஒவ்வொருவனும் தன் ஆட்டையும் என்னிடம் கொண்டுவர வேண்டும். அவற்றை இங்கே அறுத்து உண்ணுங்கள்; இரத்தத்தோடு உண்பதன் மூலம்[a] யெகோவாவுக்கு எதிராகப் பாவம் செய்யாதிருங்கள்’ என்று சொல்லுங்கள்.” அன்றிரவு மக்கள் எல்லாரும், ஒவ்வொருவனும் தன் மாட்டைக் கையில் பிடித்தவாறு[b] கொண்டுவந்து, அங்கே அவற்றை அறுத்தார்கள்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொல்லுக்கு சொல், “இரத்தத்தோடு” அல்லது “இரத்தத்தின் மேல் உண்ணுதல்.” விலங்கின் இரத்தம் முறையாக வடிவதற்கு முன்பே அதன் இறைச்சியை உண்பதை இது குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “தன் மாட்டைக் கையால் நடத்திக்கொண்டு.”
    reason: lexical_alternative
lexical_decisions:
- source_word: פֻּצוּ בָעָם
  choice: மக்களிடையே பரவிச் சென்று
  rationale: פוץ என்பதன் சிதறிப் பரவுதல் என்ற உருவகத்தைத் தக்கவைத்தபடி, தூதர்கள் மக்கள் முழுவதிடமும் செல்ல வேண்டும் என்ற சூழலை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: הַגִּישׁוּ אֵלַי
  choice: என்னிடம் கொண்டுவர வேண்டும்
  rationale: Hiphil வடிவில் உள்ள נגשׁ, அருகே கொண்டுவருதல் அல்லது முன்னிலைப்படுத்துதல் என்று பொருள்படும்; இங்கு விலங்குகளைச் சவுலிடம் கொண்டுவருவதே சூழல்.
- source_word: אִישׁ שׁוֹרוֹ וְאִישׁ שְׂיֵהוּ
  choice: ஒவ்வொருவனும் தன் மாட்டையும், ஒவ்வொருவனும் தன் ஆட்டையும்
  rationale: இருமுறை வரும் אִישׁ என்பதன் பகிர்ந்தளிக்கும் வலியுறுத்தலைத் தக்கவைக்கிறது. שֶׂה என்பது செம்மறியாடு அல்லது வெள்ளாடு உள்ளிட்ட சிறிய கால்நடையைக் குறிக்கக்கூடும் என்பதால் பொதுவான ‘ஆடு’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: וּשְׁחַטְתֶּם בָּזֶה
  choice: அவற்றை இங்கே அறுத்து
  rationale: שׁחט என்பது பொதுவான கொல்லுதலைவிட உணவுக்காக அல்லது பலிக்காக அறுப்பதைக் குறிக்கிறது; בזה இங்கு இடத்தைக் குறிக்கும் வகையில் ‘இங்கே’ என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: וְלֹא תֶחֶטְאוּ לַיהוָה
  choice: யெகோவாவுக்கு எதிராகப் பாவம் செய்யாதிருங்கள்
  rationale: לַיהוָה இங்கு நெறிசார் எதிர்நிலையைக் காட்டுவதால் ‘எதிராக’ எனத் தெளிவுபடுத்தப்பட்டுள்ளது.
- source_word: לֶאֱכֹל אֶל־הַדָּם
  choice: இரத்தத்தோடு உண்பதன் மூலம்
  rationale: எபிரெயச் சொற்றொடரின் ‘இரத்தத்தோடு/இரத்தத்தின் மேல் உண்ணுதல்’ என்ற நெருக்கமான பொருளைத் தக்கவைத்து, அதன் நடைமுறைச் சூழல் அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது.
- source_word: אִישׁ שׁוֹרוֹ בְיָדוֹ
  choice: ஒவ்வொருவனும் தன் மாட்டைக் கையில் பிடித்தவாறு
  rationale: ‘அவனுடைய கையில்’ என்ற எபிரெயச் சொல்லாட்சியின் காட்சித்தன்மையைத் தக்கவைக்கிறது; விலங்கை கையால் நடத்திக்கொண்டு வந்தார் என்ற சாத்தியமான பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: הַלַּיְלָה
  choice: அன்றிரவு
  rationale: கதை நிகழும் குறிப்பிட்ட இரவைக் குறிக்கும் இயல்பான தமிழ் காலவினையடை.
- source_word: וַיִּשְׁחֲטוּ שָׁם
  choice: அங்கே அவற்றை அறுத்தார்கள்
  rationale: வினையின் மறைபொருளான விலங்குகளைத் தமிழில் தெளிவுக்காக ‘அவற்றை’ என்று சேர்த்துள்ளது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யெகோவா
  alternative: கர்த்தர் / யாவே
  rationale: மூலத்தில் வரும் தனிப்பட்ட உடன்படிக்கைப் பெயரை பொதுப்பட்டப் பெயராக மாற்றாமல், தமிழில் பரவலாக அறியப்படும் ‘யெகோவா’ என்ற ஒலிபெயர்ப்பில் வழங்குகிறது.
- issue: இரத்தத்தோடு உண்ணுதல் குறித்த பாவத்தின் தன்மை
  choice: மூலத்தின் சுருக்கமான சொல்லாட்சியை முதன்மை உரையில் தக்கவைத்தல்
  alternative: இரத்தம் முழுமையாக வடிக்கப்படாத இறைச்சியை உண்ணுதல் என்று உரையிலேயே விளக்குதல்
  rationale: மூலத்தின் genuine ambiguity மற்றும் சடங்குசார் பின்னணியை முன்கூட்டியே விரித்துரைக்காமல், தேவையான விளக்கத்தை அடிக்குறிப்பில் அளிக்கிறது.
translation_notes:
  register: நவீன தரத்தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் மரியாதையான கதைநடை பயன்படுத்தப்பட்டுள்ளது. கட்டளையின் வலிமை காக்கப்பட்டதுடன், எபிரெயச் சொல்லாட்சியின் தெளிவின்மைகள் அடிக்குறிப்புகளில் பாதுகாக்கப்பட்டுள்ளன.
