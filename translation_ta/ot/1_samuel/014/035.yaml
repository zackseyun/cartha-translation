base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/035.yaml
  text: And Saul built an altar to Yahweh[a]; this was the first altar he built to Yahweh.
translation:
  language: ta
  text: சவுல் யாவேக்கு ஒரு பலிபீடத்தைக் கட்டினார்; அவர் யாவேக்குக் கட்டிய முதல் பலிபீடம் இதுவே.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இன்னும் நேரடியாக, “அதை யாவேக்கான பலிபீடமாகக் கட்டத் தொடங்கினார்” என்றும் மொழிபெயர்க்கலாம். இந்த எபிரெய மொழிநடை பொதுவாக, இது சவுல் யாவேக்குக் கட்டிய முதல் பலிபீடம் என்று புரிந்துகொள்ளப்படுகிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּבֶן
  choice: கட்டினார்
  rationale: בנה என்பதன் இச்சூழலுக்குரிய நேரான, இயல்பான தமிழ் இணைச்சொல்; பலிபீடம் அமைப்பதையும் தெளிவாகக் குறிக்கிறது.
- source_word: שָׁאוּל
  choice: சவுல்
  rationale: שאול என்ற எபிரெய தனிப்பெயரின் தமிழில் நிலைபெற்ற ஒலிபெயர்ப்பு.
- source_word: מִזְבֵּחַ
  choice: பலிபீடம்
  rationale: பலியிடுவதற்குரிய இடத்தைக் குறிக்கும் מזבח என்பதற்கான துல்லியமான, வழக்கிலுள்ள தமிழ் வேதாகமச் சொல்.
- source_word: לַיהוָה
  choice: யெகோவாவுக்கு
  rationale: ל இங்கு அர்ப்பணிப்பு அல்லது தொடர்பைக் குறிக்கிறது; יהוה என்ற உடன்படிக்கைப் பெயரை ஒலிபெயர்த்து, இயல்பான தமிழ் வேற்றுமையுடன் வழங்குகிறது.
- source_word: אֹתוֹ הֵחֵל לִבְנוֹת
  choice: அவர் ... கட்டிய முதல் ... இதுவே
  rationale: சொல்லுக்குச் சொல் முறையில் ‘அதை அவர் கட்டத் தொடங்கினார்’ என்று வரக்கூடிய சற்றுக் கடினமான எபிரெய தொடரை, பொதுவாக ஏற்கப்படும் ‘இது அவர் கட்டிய முதல் பலிபீடம்’ என்ற இடியோமப் பொருளில் இயல்பான தமிழில் தருகிறது; நேரடி வாசிப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரின் மொழிபெயர்ப்பு
  choice: யெகோவா
  alternative: கர்த்தர்; யாவே
  rationale: மூலத்தில் உள்ள நான்கெழுத்து இறைப் பெயரை பொதுப்பட்டப் பெயராக மாற்றாமல் தனிப்பெயராகப் பாதுகாக்கிறது; தமிழில் பரவலாக அறியப்படும் ‘யெகோவா’ வடிவம் தேர்ந்தெடுக்கப்பட்டது.
- issue: אֹתוֹ הֵחֵל לִבְנוֹת என்ற தொடரின் பொருள்
  choice: அவர் யெகோவாவுக்குக் கட்டிய முதல் பலிபீடம் இதுவே
  alternative: அதை யெகோவாவுக்கான பலிபீடமாகக் கட்டத் தொடங்கினார்
  rationale: இத்தொடரின் இயல்பான சூழற்பொருள் சவுலின் முதல் பலிபீடத்தைச் சுட்டுவதாகப் பொதுவாகப் புரிந்துகொள்ளப்படுகிறது. இருப்பினும், ‘தொடங்கினார்’ என்ற நேரடி இலக்கண வாசிப்பையும் அடிக்குறிப்பில் வெளிப்படையாக வைத்திருக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையும் கண்ணியமும் பேணப்பட்டுள்ளன. முதல் வாக்கியத்துக்கும் விளக்க வாக்கியத்துக்கும் இடையே அரைப்புள்ளி பயன்படுத்தப்பட்டு, மூலத்தின் நெருக்கமான தொடர்ச்சி காக்கப்பட்டுள்ளது. உண்மையான எபிரெய மொழிநடைத் தெளிவின்மை [a] அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
