base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/044.yaml
  text: And Saul said[a], “May God do so and more also, for you shall surely die, Jonathan.”
translation:
  language: ta
  text: சவுல், “தேவன் இப்படிச் செய்யட்டும்; இதற்கு மேலும் செய்யட்டும்[a]; ஏனெனில், யோனத்தானே, நீ நிச்சயமாகச் சாவாய்” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'இது ஓர் எபிரெயச் சூளுரைச் சொற்றொடர். சொல்லுக்குச் சொல்: “இவ்வாறு தேவன் செய்யட்டும்; இவ்வாறே அவர் மேலும் செய்யட்டும்.” தண்டனைக்குரிய செயல் யார்மீது நிகழ வேண்டும் என்பது எபிரெயத்தில் கூறப்படவில்லை.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: என்றான்
  rationale: எபிரெயக் கதைநடையின் தொடர்ச்சியை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது; பேச்சுக்குப் பின் வரும் தமிழ் வினைமுறை காரணமாக வசன இறுதியில் அமைக்கப்பட்டுள்ளது.
- source_word: שָׁאוּל
  choice: சவுல்
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் பரவலாக அறியப்பட்ட பெயரெழுத்தாக்கம்.
- source_word: כֹּה יַעֲשֶׂה אֱלֹהִים וְכֹה יוֹסִף
  choice: தேவன் இப்படிச் செய்யட்டும்; இதற்கு மேலும் செய்யட்டும்
  rationale: இது தெய்வத் தண்டனையை வரவழைக்கும் எபிரெய ஆணைச் சூளுரை. செயல் யார்மீது நிகழ வேண்டும் என்பதைச் சேர்க்காமல், மூலத்தின் மறைபொருளையும் இருபகுதி அமைப்பையும் காக்கிறது.
- source_word: אֱלֹהִים
  choice: தேவன்
  rationale: இங்கு சூளுரையில் அழைக்கப்படும் ஒரே தெய்வத்தைக் குறிக்கிறது; இயல்பான ஒருமைத் தமிழாக்கம்.
- source_word: כִּי
  choice: தனி இணைப்புச்சொல்லாக மொழிபெயர்க்கப்படவில்லை
  rationale: இங்கு சூளுரையின் உறுதியான அறிவிப்பை அறிமுகப்படுத்துகிறது. தமிழில் நேரடியாக அடுத்த வாக்கியத்திற்குச் செல்வது இயல்பாகவும் பொருளைத் தெளிவாகவும் தருகிறது; ‘ஏனெனில்’ என்பது தேவையற்ற காரணத் தொடர்பை வலுப்படுத்தக்கூடும்.
- source_word: מוֹת תָּמוּת
  choice: நீ நிச்சயமாகச் சாவாய்
  rationale: முற்றுப்பெயர் வினையும் வரையறுக்கப்பட்ட வினையும் சேர்ந்த எபிரெய வலியுறுத்தலை ‘நிச்சயமாக’ தெளிவாக வெளிப்படுத்துகிறது.
- source_word: יוֹנָתָן
  choice: யோனத்தானே
  rationale: பெயரை நேரடி அழைப்பாகக் காட்ட ‘ஏ’ வேற்றுமை உருபு சேர்க்கப்பட்டுள்ளது; தமிழில் பரவலாக அறியப்பட்ட பெயரெழுத்தாக்கம் பயன்படுத்தப்பட்டுள்ளது.
theological_decisions:
- issue: சூளுரை யார்மீது நிறைவேற வேண்டும் என்பதை வெளிப்படையாகச் சேர்ப்பது
  choice: பெறுபவரைச் சேர்க்காமல் ‘தேவன் இப்படிச் செய்யட்டும்; இதற்கு மேலும் செய்யட்டும்’ என்று மொழிபெயர்த்தல்
  alternative: ‘தேவன் எனக்கு இப்படியும் இதற்கு மேலும் செய்யட்டும்’
  rationale: எபிரெய மூலத்தில் அச்செயலின் பெறுபவர் கூறப்படவில்லை. வழக்குச் சூழலில் சவுலே மறைமுகப் பெறுபவராகப் புரிந்துகொள்ளப்படலாம்; இருந்தாலும் ‘எனக்கு’ என்று சேர்ப்பது மூலத்தில் வெளிப்படாததைத் தீர்மானித்துவிடும்.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியும் ஆனால் கண்ணியமான நடை. ‘சாவாய்’ என்பது மூலத்தின் நேரடியான மரண அறிவிப்பையும் வலியுறுத்தலையும் இயல்பாகத் தருகிறது. அடிக்குறிப்புக் குறி சூளுரைச் சொற்றொடருக்குப் பின் வைக்கப்பட்டுள்ளது.
