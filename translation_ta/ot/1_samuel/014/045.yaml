base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/045.yaml
  text: But the people said to Saul[a], “Should Jonathan die, who has brought about this great deliverance in Israel? Far from it! As Yahweh lives, not one hair of his head shall fall to the ground, for he has worked with God this day.” So the people redeemed Jonathan[d][c][b], and he did not die.
translation:
  language: ta
  text: ஆனால் மக்கள் சவுலிடம், “இஸ்ரவேலில் இந்த மாபெரும் விடுதலையை[a] நிகழ்த்திய யோனத்தான் சாக வேண்டுமா? ஒருபோதும் கூடாது![b] யாவே வாழ்வது நிச்சயமாக, அவன் தலையின் ஒரு முடியும்கூட தரையில் விழாது. ஏனெனில் இன்று அவன் கடவுளோடு செயல்பட்டான்[c]” என்றார்கள். அப்பொழுது மக்கள் யோனத்தானை மீட்டார்கள்[d]; அவன் இறக்கவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘மாபெரும் மீட்பு’ அல்லது ‘மாபெரும் வெற்றி’ என்றும் மொழிபெயர்க்கலாம். எபிரேயச் சொல் சூழலுக்கேற்ப விடுதலை, மீட்பு அல்லது வெற்றி எனப் பொருள்படும்.
    reason: lexical_alternative
  - marker: b
    text: எபிரேயத்தில், ‘அவ்வாறு ஆகாதிருப்பதாக!’ என்ற வலுவான மறுப்புச் சொல்; ‘நிச்சயமாகக் கூடாது!’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: சொல்லர்த்தமாக, ‘இன்று அவன் கடவுளோடு செய்தான்.’ யோனத்தானின் செயல் கடவுளோடான தொடர்பில் அல்லது கடவுளின் ஆதரவோடு நிகழ்ந்ததைக் குறிக்கலாம்; அந்த உறவைச் சொற்றொடர் இதைவிடத் துல்லியமாக வரையறுக்கவில்லை.
    reason: ambiguity_preservation
  - marker: d
    text: ‘யோனத்தானை விடுவித்தார்கள்’ அல்லது ‘யோனத்தானைக் காப்பாற்றினார்கள்’ என்றும் மொழிபெயர்க்கலாம். எபிரேய வினைச்சொல் ஒரு கோரிக்கை அல்லது தீர்ப்பிலிருந்து விடுதலை பெற்றுத்தருவதைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲיוֹנָתָן יָמוּת
  choice: யோனத்தான் சாக வேண்டுமா?
  rationale: வினாவிடை எதிர்பாராத இந்தச் சொல்லமைப்பு மக்களின் கடும் எதிர்ப்பை வெளிப்படுத்துகிறது; ‘சாக வேண்டுமா?’ என்பது அதனை இயல்பான நவீன தமிழில் தக்கவைக்கிறது.
- source_word: הַיְשׁוּעָה הַגְּדוֹלָה הַזֹּאת
  choice: இந்த மாபெரும் விடுதலை
  rationale: יְשׁוּעָה என்பது விடுதலை, மீட்பு, வெற்றி ஆகிய பொருள்களைக் கொள்ளலாம். போர்ச் சூழலில் ‘விடுதலை’ என்பது வெற்றியை மட்டும் குறுக்காமல் மீட்பின் கருத்தையும் தக்கவைக்கிறது.
- source_word: בְּיִשְׂרָאֵל
  choice: இஸ்ரவேலில்
  rationale: ב என்ற முன்னிடைச்சொல்லின் இயல்பான இடப்பொருளை நேரடியாகத் தக்கவைக்கிறது.
- source_word: חָלִילָה
  choice: ஒருபோதும் கூடாது!
  rationale: இது வலுவான மறுப்புச் சொல். தமிழில் கடும் நிராகரிப்பை இயல்பாகவும் கண்ணியமாகவும் வெளிப்படுத்துகிறது.
- source_word: חַי יְהוָה
  choice: யாவே உயிரோடிருப்பது உறுதி!
  rationale: தெய்வீகப் பெயரையும் எபிரேய உறுதிமொழியின் வலிமையையும் தக்கவைக்கும் இயல்பான தமிழ் வடிவம்.
- source_word: אִם יִפֹּל מִשַּׂעֲרַת רֹאשׁוֹ אַרְצָה
  choice: அவனுடைய தலையிலிருந்து ஒரு முடிகூட தரையில் விழாது
  rationale: உறுதிமொழிக்குப் பின் வரும் אִם இங்கு வலியுறுத்தப்பட்ட எதிர்மறைப் பொருளைத் தருகிறது; முழுமையான பாதுகாப்பைக் குறிக்கும் உருவகத்தைத் தமிழ் தெளிவாகப் பாதுகாக்கிறது.
- source_word: כִּי עִם אֱלֹהִים עָשָׂה
  choice: ஏனெனில் இன்று அவன் கடவுளோடு செயலாற்றினான்
  rationale: עִם என்பதன் அடிப்படைப் பொருளான ‘உடன்/ஓடு’ என்பதைத் தக்கவைத்து, தெய்வ உதவி அல்லது ஒத்திசைவு பற்றிய உரையின் திட்டமிட்ட தெளிவின்மையை மிகையாக விளக்காமல் பாதுகாக்கிறது.
- source_word: וַיִּפְדּוּ הָעָם אֶת יוֹנָתָן
  choice: மக்கள் யோனத்தானை மீட்டார்கள்
  rationale: פדה என்பது ஒரு கோரிக்கை அல்லது தண்டனையிலிருந்து ஒருவரை விடுவித்தல் அல்லது மீட்டல் என்ற பொருளுடையது; ‘மீட்டார்கள்’ அதன் சட்டரீதியான விடுவிப்புச் சாயலைத் தமிழில் சுருக்கமாகத் தருகிறது.
- source_word: וְלֹא מֵת
  choice: அவன் சாகவில்லை
  rationale: எபிரேய முடிவுரையின் நேரடியான, எளிய கூறலைத் தக்கவைக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் நேரடியாக வரும் உடன்படிக்கைப் பெயரைப் பொதுப் பட்டப்பெயராக மாற்றாமல் ஒலிபெயர்த்துத் தருகிறது.
- issue: עִם אֱלֹהִים என்பதில் யோனத்தானின் செயலுக்கும் கடவுளுக்கும் உள்ள உறவு
  choice: கடவுளோடு செயலாற்றினான்
  alternative: கடவுளின் உதவியால் செயலாற்றினான்
  rationale: ‘கடவுளோடு’ என்பது மூலத்தின் ‘உடன்’ என்ற சொல்லைத் தக்கவைத்து, தெய்வ உதவி, அங்கீகாரம் அல்லது இணைந்த செயல் ஆகியவற்றில் ஒன்றை மட்டும் கட்டாயமாகத் தேர்ந்தெடுக்காமல் இறையியல் பதற்றத்தைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. மக்களின் எதிர்ப்பும் உறுதிமொழியின் வலிமையும் நேரடி உரையில் பாதுகாக்கப்பட்டுள்ளன; ‘கடவுளோடு’ என்ற மூலத்தின் இறையியல் தெளிவின்மை விளக்கிக் குறுக்கப்படவில்லை.
