revisions:
- from: ஆனால் மக்கள் சவுலிடம், “இஸ்ரவேலில் இந்த மாபெரும் விடுதலையை[a] நிகழ்த்திய யோனத்தான் சாக வேண்டுமா? ஒருபோதும் கூடாது![b] யாவே உயிரோடிருப்பது உறுதி! அவனுடைய தலையிலிருந்து ஒரு முடிகூட தரையில் விழாது. ஏனெனில் இன்று அவன் கடவுளோடு செயலாற்றினான்[c]” என்றார்கள். இவ்வாறு மக்கள் யோனத்தானை மீட்டார்கள்[d]; அவன் சாகவில்லை.
  to: ஆனால் மக்கள் சவுலிடம், “இஸ்ரவேலில் இந்த மாபெரும் விடுதலையை[a] நிகழ்த்திய யோனத்தான் சாக வேண்டுமா? ஒருபோதும் கூடாது![b] யாவே வாழ்வது நிச்சயமாக, அவன் தலையின் ஒரு முடியும்கூட தரையில் விழாது. ஏனெனில் இன்று அவன் கடவுளோடு செயல்பட்டான்[c]” என்றார்கள். அப்பொழுது மக்கள் யோனத்தானை மீட்டார்கள்[d]; அவன் இறக்கவில்லை.
  rationale: The revision restores the oath force of חַי יְהוָה, improves a few modern-Tamil idioms, and replaces the inaccurate explanatory wording in footnote b. It retains the source's rhetorical force, the divine name, the ambiguity of עִם אֱלֹהִים, and every existing footnote anchor.
