  text: His armor-bearer said to him, “Do all that is in your heart. Go on; here I am with you, according to your heart.”
translation:
  language: ta
  text: அவனுடைய ஆயுதங்களைச் சுமப்பவன் அவனை நோக்கி, “உங்கள் மனதில் இருப்பதையெல்லாம் செய்யுங்கள். செல்லுங்கள்; இதோ, உங்கள் மனவிருப்பப்படியே நான் உங்களுடன் இருக்கிறேன்” என்றான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נֹשֵׂא כֵלָיו
  choice: அவனுடைய ஆயுதங்களைச் சுமப்பவன்
  rationale: ‘அவனுடைய ஆயுதங்களைச் சுமப்பவர்’ என்ற எபிரெயச் சொல்லை இயல்பான தமிழில் நேரடியாக வெளிப்படுத்துகிறது.
- source_word: עֲשֵׂה כָּל אֲשֶׁר בִּלְבָבֶךָ
  choice: உங்கள் மனதில் இருப்பதையெல்லாம் செய்யுங்கள்
  rationale: எபிரெய மொழியின் ‘இதயம்’ என்பது இங்கு எண்ணம் அல்லது தீர்மானத்தைக் குறிக்கிறது; தமிழில் புரியும்படி ‘மனம்’ என வழங்கப்பட்டுள்ளது.
- source_word: נְטֵה לָךְ
  choice: முன்னே செல்லுங்கள்
  rationale: சூழலில் யோனத்தானின் திட்டத்தைத் தொடர்ந்து செயல்படுமாறு ஊக்குவிக்கும் பொருளைத் தருகிறது; சொல்லின் திசைதிரும்புதல்/நகர்தல் நுணுக்கத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: הִנְנִי עִמְּךָ כִּלְבָבֶךָ
  choice: இதோ, உங்கள் மனவிருப்பப்படியே நான் உங்களுடன் இருக்கிறேன்
  rationale: ‘இதோ நான்’ என்ற வலியுறுத்தலையும், யோனத்தானின் எண்ணத்துடன் ஆயுததாரி முழுமையாக இணங்குவதையும் காக்கிறது.
theological_decisions:
- issue: ஆயுததாரியின் இணக்கம் தெய்வீக அங்கீகாரமாகக் கூறப்படுகிறதா
  choice: அவருடைய தனிப்பட்ட ஆதரவும் மனஒற்றுமையும் மட்டுமே வெளிப்படுத்தப்பட்டது
  alternative: இதை கடவுளின் விருப்பத்திற்கான உறுதிப்பாடாக விரிவுபடுத்துதல்
  rationale: மூலவசனம் ஆயுததாரியின் முழு ஆதரவை மட்டுமே கூறுகிறது; வெளிப்படையாக இல்லாத தெய்வீக அங்கீகாரத்தைச் சேர்க்கவில்லை.
translation_notes:
  register: நவீன செந்தமிழ் நடையில், யோனத்தானிடம் மரியாதையாகப் பேசும் பன்மை வினைமுற்றுகள் பயன்படுத்தப்பட்டுள்ளன. வசனத்தின் ஊக்கமளிக்கும், உறுதியான தொனி காக்கப்பட்டுள்ளது.
