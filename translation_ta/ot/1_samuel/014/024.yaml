  text: וְ/אִֽישׁ יִשְׂרָאֵ֥ל נִגַּ֖שׂ בַּ/יּ֣וֹם הַ/ה֑וּא וַ/יֹּאֶל֩ שָׁא֨וּל אֶת הָ/עָ֜ם לֵ/אמֹ֗ר אָר֣וּר הָ֠/אִישׁ אֲשֶׁר יֹ֨אכַל לֶ֜חֶם עַד הָ/עֶ֗רֶב וְ/נִקַּמְתִּי֙ מֵ/אֹ֣יְבַ֔/י וְ/לֹֽא טָעַ֥ם כָּל הָ/עָ֖ם לָֽחֶם־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/024.yaml
  text: The men of Israel were hard-pressed that day[a], and Saul put the people under an oath, saying, “Cursed is the man who eats food before evening, before I have avenged myself on my enemies.” So none of the people tasted food.
translation:
  language: ta
  text: அன்று இஸ்ரவேல் வீரர்கள் கடும் நெருக்கடியில் இருந்தார்கள். சவுல் மக்களைச் சத்தியம் செய்யும்படி கட்டாயப்படுத்தி, “மாலைவரை, நான் என் பகைவர்களைப் பழிவாங்கும் வரை, உணவு[a] உண்பவன் சபிக்கப்பட்டவன்!” என்றான். எனவே, மக்களில் எவரும் உணவைச் சுவைக்கவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இரண்டு இடங்களிலும் எபிரெய மொழியில் ‘அப்பம்’ என்று உள்ளது; இங்கு அது அப்பத்தை மட்டும் அல்லாமல் பொதுவாக உணவைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִישׁ יִשְׂרָאֵל נִגַּשׂ
  choice: இஸ்ரவேல் வீரர்கள் கடும் நெருக்கடியில் இருந்தார்கள்
  rationale: נִגַּשׂ என்ற நிபால் வடிவம் இச்சூழலில் இடத்தை நெருங்குவதைக் காட்டுவதற்குப் பதிலாக அழுத்தத்திற்கும் துன்பத்திற்கும் உள்ளான நிலையைக் குறிக்கிறது. אִישׁ יִשְׂרָאֵל என்பது போர்ச் சூழலில் இஸ்ரவேலின் ஆண்களாகிய வீரர்களைக் கூட்டாகக் குறிக்கிறது.
- source_word: וַיַּאֵל שָׁאוּל אֶת־הָעָם
  choice: சவுல் மக்களை ஓர் ஆணைக்குக் கட்டுப்படுத்தி
  rationale: தொடர்ந்து வரும் சாப அறிவிப்பு, சவுல் மக்கள்மீது உறுதிமொழி சார்ந்த கட்டுப்பாட்டை விதித்ததைக் காட்டுகிறது. ‘ஆணைக்குக் கட்டுப்படுத்தி’ என்பது அதன் கட்டாயத் தன்மையை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: אָרוּר הָאִישׁ
  choice: உண்கிறவன் சபிக்கப்பட்டவன்
  rationale: எபிரெய மொழியின் ஒருமை ஆண்பால் வடிவம் இங்கு பொதுவாக எந்த மனிதனையும் குறிக்கிறது; தமிழ் வாக்கியம் சாப அறிவிப்பின் நேரடித் தன்மையைப் பேணுகிறது.
- source_word: יֹאכַל לֶחֶם / טָעַם ... לָחֶם
  choice: உணவு உண்கிறவன் / உணவைச் சுவைக்கவில்லை
  rationale: לֶחֶם என்பதன் சொற்பொருள் ‘அப்பம்’; ஆனால் இங்கு அது பொதுவாக உணவைக் குறிக்கும் மரபுத்தொடராக உள்ளது. இரண்டாவது இடத்தில் טָעַם என்பதன் ‘சுவைத்தல்’ என்ற உயிரோட்டமான சொற்படிமம் பேணப்பட்டுள்ளது.
- source_word: עַד הָעֶרֶב וְנִקַּמְתִּי מֵאֹיְבַי
  choice: மாலை வருவதற்குமுன், நான் என் பகைவர்களைப் பழிவாங்குவதற்குமுன்
  rationale: சவுல் விதித்த தடையின் கால எல்லையையும், பகைவர்கள்மீது தனிப்பட்ட முறையில் பழிவாங்க வேண்டும் என்ற அவனது நோக்கத்தையும் தெளிவாகவும் இணையாகவும் வெளிப்படுத்துகிறது.
- source_word: וְלֹא טָעַם כָּל־הָעָם
  choice: மக்களில் எவரும் ... சுவைக்கவில்லை
  rationale: எபிரெய மொழியின் மறுக்கப்பட்ட கூட்டுச் சொல்லை இயல்பான தமிழில் முழுமையான மறுப்பாக அளிக்கிறது.
theological_decisions:
- issue: சவுலின் பழிவாங்குதல் குறித்த முதல் நபர் மொழி
  choice: நான் என் பகைவர்களைப் பழிவாங்குவதற்குமுன்
  alternative: நாம் நம் பகைவர்களை வெல்வதற்குமுன்
  rationale: மூலத்தில் உள்ள முதல் நபர் ஒருமையையும் ‘என் பகைவர்கள்’ என்ற தனிப்பட்ட தொனியையும் மாற்றாமல் பேணுகிறது; அதனை பொதுவான இராணுவ வெற்றியாக மென்மைப்படுத்தவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், கண்ணியமானதும் பொதுவாசகர்களுக்கு எளிதில் புரியக்கூடியதுமான நடை பயன்படுத்தப்பட்டுள்ளது. போர்ச் சூழலைத் தெளிவாக்க ‘வீரர்கள்’ பயன்படுத்தப்பட்டாலும், הָעָם என்பது ‘மக்கள்’ என்றே பேணப்பட்டுள்ளது. அடிக்குறிப்புக் குறியீடு முதல் ‘உணவு’ என்பதற்குப் பின் இடப்பட்டுள்ளது.
