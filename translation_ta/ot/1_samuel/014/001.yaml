  yaml_path: translation/ot/1_samuel/014/001.yaml
  text: One day Jonathan son of Saul said to the young man who carried his armor[a], “Come[b], let us cross over to the Philistine garrison that is on the other side.” But he did not tell his father.
translation:
  language: ta
  text: ஒருநாள் சவுலின் மகன் யோனத்தான், தன் ஆயுதங்களைச் சுமந்த இளைஞனிடம், “வா, அக்கரையில் இருக்கும் பெலிஸ்தியரின் காவற்படையிடம்[a] கடந்து போவோம்” என்றான். ஆனால் இதைத் தன் தந்தையிடம் அவன் சொல்லவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பெலிஸ்தியரின் புறக்காவல் நிலையத்திற்கு.” எபிரெயச் சொல் ஒரு படை நிறுத்தப்பட்ட இடத்தையோ அங்கு நிறுத்தப்பட்ட படையையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי הַיּוֹם
  choice: ஒருநாள்
  rationale: எபிரெயக் கதைநடையின் தொடக்கச் சொற்றொடரை இயல்பான நவீனத் தமிழில் காலக் குறிப்பாக வழங்குகிறது.
- source_word: הַנַּעַר
  choice: இளைஞன்
  rationale: இச்சூழலில் படைப் பணிக்குத் தகுந்த வயதுடைய ஆயுதம் சுமப்பவனைக் குறிக்கிறது; ‘சிறுவன்’ என்பது தவறான எண்ணத்தை ஏற்படுத்தலாம்.
- source_word: נֹשֵׂא כֵלָיו
  choice: தன் ஆயுதங்களைச் சுமந்த
  rationale: சொல்லர்த்தில் அவரது கருவிகள் அல்லது ஆயுதங்களைச் சுமப்பவனைக் குறிக்கும் பங்கேற்பு வடிவத்தைத் தெளிவாகப் பிரதிபலிக்கிறது.
- source_word: לְכָה וְנַעְבְּרָה
  choice: வா, ... கடந்து போவோம்
  rationale: לְכָה என்பதன் அழைப்பையும், நַעְבְּרָה என்பதன் சேர்ந்து செயல்படத் தூண்டும் பொருளையும் தக்கவைக்கிறது.
- source_word: מַצַּב פְּלִשְׁתִּים
  choice: பெலிஸ்தியர்களின் காவல்படை
  rationale: ம military சூழலில் நிறுத்திவைக்கப்பட்ட படையையோ காவல் நிலையத்தையோ குறிக்கும் சொல்லை இயல்பான தமிழில் தருகிறது.
- source_word: אֲשֶׁר מֵעֵבֶר הַלָּז
  choice: அக்கரையில் இருக்கும்
  rationale: தொலைவில் அல்லது மறுபுறத்தில் இருப்பதைக் காட்டும் எபிரெயச் சுட்டுப் பொருளைப் பாதுகாக்கிறது; மூலத்தில் வெளிப்படையாக இல்லாத ‘கணவாய்’ என்பதைச் சேர்க்கவில்லை.
- source_word: וּלְאָבִיו לֹא הִגִּיד
  choice: ஆனால் இதைத் தன் தந்தையிடம் அவன் சொல்லவில்லை
  rationale: கதையிலுள்ள முரண்பாட்டுத் திருப்பை ‘ஆனால்’ என்றும், சொல்லப்படாத செய்தியைத் தமிழில் இயல்பாக ‘இதை’ என்றும் வெளிப்படுத்துகிறது.
