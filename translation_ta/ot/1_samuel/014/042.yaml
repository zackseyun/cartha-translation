base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/042.yaml
  text: Then Saul said[a], “Cast lots between me and Jonathan my son.” And Jonathan was taken.
translation:
  language: ta
  text: அப்போது சவுல், “எனக்கும் என் மகன் யோனத்தானுக்கும் இடையே சீட்டுப் போடுங்கள்[a]” என்றான். சீட்டில் யோனத்தான் தேர்ந்தெடுக்கப்பட்டான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இன்னும் சொற்பொருளுக்கு நெருக்கமாக, “எனக்கும் என் மகன் யோனத்தானுக்கும் இடையே விழச் செய்யுங்கள்”; இங்கு சீட்டுப் போட்டு முடிவு செய்யுங்கள் என்பதே பொருள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: அப்போது சவுல் … என்றான்
  rationale: வாவ் தொடர் வடிவம் கதை நிகழ்வை அடுத்த கட்டத்துக்கு நகர்த்துகிறது; நவீன தமிழில் இயல்பான தொடர்ச்சிக்காக ‘அப்போது’ பயன்படுத்தப்பட்டது.
- source_word: הַפִּילוּ
  choice: குலுக்குப்போடுங்கள்
  rationale: הַפִּילוּ என்பதன் சொற்பொருள் ‘விழச்செய்யுங்கள்’; ஆனால் இச்சூழலில் குலுக்குப்போட்டு முடிவு காண்பதே பொருள். தமிழில் அந்த மறைமுகச் செயப்படுபொருளை வெளிப்படுத்தும் இயல்பான சொற்றொடர் தேர்ந்தெடுக்கப்பட்டது.
- source_word: בֵּינִי וּבֵין
  choice: எனக்கும் … இடையே
  rationale: இரு தரப்பினருக்கிடையிலான தேர்வைச் சுட்டும் இணை முன்னிடைச்சொல் அமைப்பைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: בְּנִי
  choice: என் மகன்
  rationale: முதலாம் நபர் ஒருமை உரிமை விகுதியுடன் உள்ள בֵּן, பொதுவான ‘பிள்ளை’ என்பதைக் காட்டிலும் குறிப்பாக மகன் என்ற உறவைக் குறிக்கிறது.
- source_word: וַיִּלָּכֵד
  choice: அகப்பட்டான்
  rationale: לכד என்ற வேரின் நிபால் வடிவம் ‘பிடிக்கப்பட்டான்/அகப்பட்டான்’ எனப் பொருள்படும். குலுக்குச் சூழலில் யோனத்தான் சுட்டிக்காட்டப்பட்டதை இது குறிக்கிறது; ‘அகப்பட்டான்’ என்பது அந்த உருவகத்தையும் மூலத்தின் சுருக்கத்தையும் காக்கிறது.
- source_word: יוֹנָתָן
  choice: யோனத்தான்
  rationale: எபிரேயப் பெயரின் ஒலிப்புக்கு நெருக்கமான, தமிழில் நிலைபெற்ற வேதாகமப் பெயர்வடிவம் பயன்படுத்தப்பட்டது.
