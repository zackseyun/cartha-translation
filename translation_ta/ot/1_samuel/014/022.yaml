base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/022.yaml
  text: And every man of Israel who had hidden themselves in the hill country of Ephraim heard that the Philistines had fled[a], and they too joined the pursuit in the battle.
translation:
  language: ta
  text: எப்பிராயீமின் மலைநாட்டில் ஒளிந்திருந்த இஸ்ரவேல் ஆண்கள் அனைவரும் பெலிஸ்தியர்கள் தப்பியோடிவிட்டார்கள் என்று கேள்விப்பட்டார்கள். அவர்களும் போரில் பெலிஸ்தியர்களை விடாமல் பின்தொடர்ந்தார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மொழியில் சொல்லுக்குச் சொல், “அவர்களுக்குப் பின்னால் ஒட்டிக்கொண்டு சென்றார்கள்.” போர்ச் சூழலில் இது தப்பியோடிய பெலிஸ்தியர்களை விடாமல் நெருக்கமாகப் பின்தொடர்ந்ததைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכֹל אִישׁ יִשְׂרָאֵל
  choice: இஸ்ரவேல் ஆண்கள் அனைவரும்
  rationale: כֹל אִישׁ என்ற எபிரெயப் பகுதி ஒவ்வொரு ஆணையும் உள்ளடக்கும் கூட்டுப் பொருளில் வருகிறது. தமிழில் இயல்பான பன்மை அமைப்பான ‘ஆண்கள் அனைவரும்’ மூலத்தின் பாலினக் குறிப்பையும் கூட்டுப் பொருளையும் காக்கிறது.
- source_word: הַמִּתְחַבְּאִים
  choice: ஒளிந்திருந்த
  rationale: இந்தப் பங்கேற்பு வினைச்சொல் அவர்கள் மறைவில் இருந்த நிலையைக் குறிக்கிறது; தொடர்ந்து வரும் செய்தியைக் கேள்விப்பட்ட நிகழ்வுக்கு முந்திய அந்த நிலையை ‘ஒளிந்திருந்த’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: בְּהַר אֶפְרַיִם
  choice: எப்பிராயீமின் மலைநாட்டில்
  rationale: הַר இங்கு ஒரு தனி மலைச்சிகரத்தைக் காட்டிலும் எப்பிராயீமின் உயர்நிலப் பகுதியைக் குறிக்கிறது; ‘மலைநாடு’ அந்தப் புவியியல் பொருளைத் தெளிவாகத் தருகிறது.
- source_word: שָׁמְעוּ כִּי נָסוּ פְּלִשְׁתִּים
  choice: பெலிஸ்தியர்கள் தப்பியோடிவிட்டார்கள் என்று கேள்விப்பட்டார்கள்
  rationale: נוּס என்பது பகைவரிடமிருந்து தப்பியோடுதலைக் குறிக்கிறது. கேள்விப்பட்ட நேரத்திற்குள் அவர்கள் ஓட்டம் பிடித்திருந்த நிகழ்வின் நிறைவுத்தன்மையை ‘தப்பியோடிவிட்டார்கள்’ தெரிவிக்கிறது.
- source_word: וַיַּדְבְּקוּ ... אַחֲרֵיהֶם
  choice: பெலிஸ்தியர்களை விடாமல் பின்தொடர்ந்தார்கள்
  rationale: דבק என்பதன் அடிப்படைப் பொருள் ‘ஒட்டிக்கொள்’; אַחֲרֵי என்பதுடன் போர்ச் சூழலில் அது ஒருவரை நெருக்கமாகவும் விடாமலும் பின்தொடர்வதைக் குறிக்கிறது. தமிழில் ‘விடாமல் பின்தொடர்ந்தார்கள்’ அந்தச் சொல்லோவியத்தையும் சூழற்பொருளையும் இயல்பாகத் தருகிறது.
- source_word: גַם הֵמָּה
  choice: அவர்களும்
  rationale: முன்பு ஒளிந்திருந்த இவர்களும் மற்ற இஸ்ரவேலர்களோடு சேர்ந்து இப்போது போரில் ஈடுபட்டதை ‘அவர்களும்’ சுருக்கமாகக் காட்டுகிறது.
- source_word: בַּמִּלְחָמָה
  choice: போரில்
  rationale: இங்கு מִלְחָמָה முழுப் போர்க்காலத்தைக் காட்டாமல் நடந்துகொண்டிருந்த மோதலைக் குறிக்கிறது; ‘போரில்’ தமிழில் இயல்பாகவும் தெளிவாகவும் உள்ளது.
