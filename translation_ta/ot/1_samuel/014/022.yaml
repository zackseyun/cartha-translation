  source_fidelity: 'மூல எபிரெய உரையின் அனைத்துக் கூறுகளும் துல்லியமாகக் காக்கப்பட்டுள்ளன: இஸ்ரவேல் ஆண்கள் அனைவரும், எப்பிராயீமின் மலைநாடு, பெலிஸ்தியரின் ஓட்டம், முன்பு ஒளிந்திருந்தவர்களும் சேர்ந்து அவர்களை நெருக்கமாகத் துரத்துதல், மற்றும் போர்ச் சூழல். “பெலிஸ்தியர்களை விடாமல் பின்தொடர்ந்தார்கள்” என்பது וַיַּדְבְּקוּ ... אַחֲרֵיהֶם என்ற போர்ச் சூழலுக்குரிய மரபுத்தொடரின் பொருளைச் சரியாகத் தருகிறது.'
