source:
  edition: WLC
  text: כִּ֣י חַי יְהוָ֗ה הַ/מּוֹשִׁ֨יעַ֙ אֶת יִשְׂרָאֵ֔ל כִּ֧י אִם יֶשְׁנ֛/וֹ בְּ/יוֹנָתָ֥ן בְּנִ֖/י כִּ֣י מ֣וֹת יָמ֑וּת וְ/אֵ֥ין עֹנֵ֖/הוּ מִ/כָּל הָ/עָֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/039.yaml
  text: For as Yahweh lives[a], who saves Israel, even if it is in Jonathan my son, he shall surely die.” But not one of all the people answered him.
translation:
  language: ta
  text: “இஸ்ரவேலைக் காப்பாற்றுகிற யாவே உயிரோடிருக்கிறார்; என் மகனான யோனத்தானிடமே அது இருந்தாலும்கூட[a], அவன் நிச்சயமாகச் சாவான்.” ஆனால் மக்களில் ஒருவர்கூட அவனுக்குப் பதில் சொல்லவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “அது என் மகனான யோனத்தானிடம் இருந்தாலும்கூட” என்று உள்ளது; ‘அது’ எதைக் குறிக்கிறது என்பது சொல்லப்படவில்லை. சூழலின்படி விசாரிக்கப்படும் குற்றம் அல்லது மீறல் குறிக்கப்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: חַי יְהוָה
  choice: யாவே உயிரோடிருப்பது நிச்சயமெனில்
  rationale: இது எபிரெய மொழியின் ஆணையுறுதி வாய்பாடு. அதன் உறுதியான, சத்தியப்பிரமாணத் தன்மையை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: הַמּוֹשִׁיעַ אֶת יִשְׂרָאֵל
  choice: இஸ்ரவேலைக் காப்பாற்றுகிற
  rationale: பெயரெச்ச வினைமுற்றின் தொடர்ச்சியான பண்பைத் தக்கவைத்து, யாவே இஸ்ரவேலைக் காப்பாற்றுகிறவர் எனக் காட்டுகிறது.
- source_word: כִּי אִם
  choice: இருந்தால்கூட
  rationale: ஆணையுறுதியின் சூழலில் கூறப்படும் மிகத் தீவிரமான அனுமான நிலையைக் குறிக்கும் ‘even if’ என்ற பொருளை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: יֶשְׁנוֹ בְּיוֹנָתָן בְּנִי
  choice: அது என் மகன் யோனத்தானிடம் இருந்தால்
  rationale: எபிரெயத்தில் ‘அது’ எதைக் குறிக்கிறது என்பது வெளிப்படையாகச் சொல்லப்படவில்லை. குற்றம் அல்லது மீறல் என்பதைக் குறிப்பாகச் சேர்க்காமல் மூலத்தின் நீள்விடுபாட்டைப் பாதுகாக்கிறது.
- source_word: מוֹת יָמוּת
  choice: அவன் நிச்சயமாகச் சாக வேண்டும்
  rationale: வினையெச்சப் பெயரும் முற்றுவினையும் இணைந்து தரும் உறுதியையும் நீதித்தீர்ப்புச் சார்ந்த கட்டாயத்தையும் தமிழில் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: וְאֵין עֹנֵהוּ מִכָּל הָעָם
  choice: ஆனால் மக்கள் அனைவரிலும் ஒருவர்கூட அவனுக்குப் பதில் சொல்லவில்லை
  rationale: மக்கள் முழுவதிலிருந்தும் ஒருவர்கூட பதிலளிக்கவில்லை என்ற பகுதிப்பொருளையும், சவுலின் கூற்றுக்குப் பின்வரும் முரண்பாட்டையும் தக்கவைக்கிறது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: யெகோவா / ஆண்டவர்
  rationale: எபிரெய தனிப்பெயரைப் பொதுப்பட்டமாக மாற்றாமல், திட்டத்தின் நடைமுறைக்கேற்ப ‘யாவே’ என்று ஒலிபெயர்க்கிறது.
- issue: யோனத்தானிடம் இருப்பதாகக் கூறப்படும் மறைபொருள்
  choice: ‘அது’ என்று மறைபொருளைத் திறந்தவாறே வைத்தல்
  alternative: ‘குற்றம்’ அல்லது ‘மீறல்’ என்று வெளிப்படையாகச் சேர்த்தல்
  rationale: சூழல் குற்றத்தையோ மீறலையோ சுட்டினாலும், எபிரெய மூலத்தில் அதன் பெயர் வெளிப்படையாக இல்லை; ஆகவே உண்மையான தெளிவின்மையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; ஆணையுறுதியின் கண்ணியமும் நீதித்தீர்ப்பின் வலிமையும் தக்கவைக்கப்பட்டுள்ளன. சாதாரண வாசகர்களுக்குப் புரியும் சொற்கள் பயன்படுத்தப்பட்டு, மூலத்தின் நீள்விடுபாடு அடிக்குறிப்புடன் பாதுகாக்கப்பட்டுள்ளது.
