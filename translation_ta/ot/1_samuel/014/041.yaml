  text: וַ/יֹּ֣אמֶר שָׁא֗וּל אֶל יְהוָ֛ה אֱלֹהֵ֥י יִשְׂרָאֵ֖ל הָ֣בָ/ה תָמִ֑ים וַ/יִּלָּכֵ֧ד יוֹנָתָ֛ן וְ/שָׁא֖וּל וְ/הָ/עָ֥ם יָצָֽאוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/041.yaml
  text: Then Saul said to Yahweh[a], the God of Israel, “Give a perfect lot.” And Jonathan and Saul were taken, but the people escaped.
translation:
  language: ta
  text: அப்போது சவுல் இஸ்ரவேலின் கடவுளாகிய யாவேயிடம், “குறையற்ற முடிவைத் தாரும்[a]” என்றான். யோனத்தானும் சவுலும் தேர்ந்தெடுக்கப்பட்டனர்; மக்களோ விடுபட்டனர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரெயத்தில் சொற்சொல்லாக, “குறையற்றதைத் தாரும்.” சீட்டுப் போடுவதன் மூலம் மறுப்புக்கு இடமற்ற ஒரு முடிவைத் தரும்படி சவுல் கேட்பதாக இதன் பொருள் இருக்கலாம். செப்துவஜிந்தில் பாதுகாக்கப்பட்டுள்ள நீண்ட பழங்கால வாசகம் இவ்வாறு உள்ளது: “இன்று உமது அடியானுக்கு நீர் ஏன் பதிலளிக்கவில்லை? இந்தக் குற்றம் என்னிடமோ என் மகன் யோனத்தானிடமோ இருந்தால், இஸ்ரவேலின் கடவுளாகிய யாவேயே, ஊரீமைத் தாரும்; ஆனால் அது உமது மக்களாகிய இஸ்ரவேலரிடம் இருந்தால், தும்மீமைத் தாரும்.”'
    reason: textual_variant
lexical_decisions:
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெயத் திருப்பெயரான יהוה என்பதை ஒரு பட்டத்தால் மாற்றாமல், நவீனத் தமிழில் அதன் உச்சரிப்பை நெருங்கியவாறு ஒலிபெயர்க்கிறது.
- source_word: הָבָה
  choice: தாரும்
  rationale: கடவுளிடம் வைக்கப்படும் நேரடியான வேண்டுகோளை இயல்பான, மரியாதையான தமிழில் தெரிவிக்கிறது.
- source_word: תָמִים
  choice: குறையற்ற தீர்ப்பு
  rationale: இந்தச் சொல் அடிப்படையில் ‘முழுமையானது, குறையற்றது, பழுதற்றது’ எனப் பொருள்படும். சீட்டுப் போட்டுத் தீர்மானிக்கும் சூழலில், நம்பத்தகுந்ததும் மறுப்புக்கு இடமற்றதுமான முடிவை வேண்டுவதாகப் பொருள் கொள்ளப்படுகிறது; ‘தீர்ப்பு’ என்பது சூழலால் நிரப்பப்பட்ட சொல், இதன் சிக்கல் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: וַיִּלָּכֵד
  choice: தேர்ந்தெடுக்கப்பட்டனர்
  rationale: சீட்டுப் போடும் நீதிவிசாரணைச் சூழலில், ‘பிடிபட்டனர்’ என்பதைக் காட்டிலும் யார் தனியே சுட்டிக்காட்டப்பட்டார்கள் என்பதைத் தெளிவாகவும் குற்றத்தை முன்கூட்டியே தீர்மானிக்காமலும் தெரிவிக்கிறது.
- source_word: יָצָאוּ
  choice: விடுபட்டனர்
  rationale: யோனத்தானும் சவுலும் சீட்டால் தேர்ந்தெடுக்கப்பட்டதற்கு மாறாக, மக்கள் தேர்ந்தெடுக்கப்படாமல் விலக்கப்பட்டார்கள் என்ற சூழ்நிலைப் பொருளை இயல்பாகத் தெரிவிக்கிறது.
theological_decisions:
- issue: சவுலின் வேண்டுதலின் உரைவடிவம்
  choice: மசோரா எபிரெய உரையின் சுருக்கமான ‘குறையற்ற தீர்ப்பைத் தாரும்’ என்ற வாசகத்தை முதன்மை உரையில் வைத்தல்
  alternative: செப்துவஜிந்தில் பாதுகாக்கப்பட்டுள்ள, ஊரீம்–தும்மீம் பற்றிய நீண்ட வேண்டுதலை முதன்மை உரையில் சேர்த்தல்
  rationale: வழங்கப்பட்ட WLC எபிரெய மூலமே முதன்மை ஆதாரம். அதன் சுருக்கத்தையும் பொருள் இறுக்கத்தையும் மௌனமாகத் திருத்தாமல் வைத்துள்ளோம்; பழமையான நீண்ட வாசகம் உரைவேறுபாடாக அடிக்குறிப்பில் முழுமையாகக் கொடுக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. எபிரெய மூலத்தின் இறுக்கமான சொல்லாட்சியை முதன்மை உரையில் வாசிக்கத்தக்கவாறு அளிக்க ‘தீர்ப்பு’ மற்றும் ‘சீட்டுப் போடப்பட்டபோது’ ஆகிய சூழல் விளக்கங்கள் சேர்க்கப்பட்டுள்ளன; உரைவேறுபாடும் மூலத்தின் சொற்சொல் தெளிவின்மையும் அடிக்குறிப்பில் வெளிப்படையாகப் பாதுகாக்கப்பட்டுள்ளன.
