base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/012.yaml
  text: And the men of the garrison answered Jonathan and his armor-bearer and said[a], “Come up to us, and we will tell you something.” Then Jonathan said to his armor-bearer, “Come up after me[d][c][b], for Yahweh has given them into the hand of Israel.”
translation:
  language: ta
  text: காவல்நிலையத்தில் இருந்த வீரர்கள் யோனத்தானுக்கும் அவன் ஆயுதம் சுமப்பவனுக்கும் பதிலளித்து, “எங்களிடம் ஏறி வாருங்கள்; உங்களுக்கு ஒரு காரியத்தைத் தெரிவிப்போம்[a]” என்றார்கள். அப்போது யோனத்தான் தன் ஆயுதம் சுமப்பவனிடம், “எனக்குப் பின்னால் ஏறி வா; ஏனெனில் யாவே அவர்களை இஸ்ரவேலின் கையில்[b] ஒப்புக்கொடுத்துவிட்டார்” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ஒரு காரியத்தைத் தெரிவிப்போம்” என்பதை “ஒரு விஷயத்தை உங்களுக்குத் தெரியப்படுத்துவோம்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “இஸ்ரவேலின் கையில்” என்பது “இஸ்ரவேலின் அதிகாரத்தில்” என்று பொருள்படும் எபிரேய மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַנְשֵׁי הַמַּצָּבָה
  choice: காவல்நிலையத்தில் இருந்த வீரர்கள்
  rationale: இராணுவச் சூழலில் மַצָּבָה என்பது நினைவுத்தூண் அல்ல, நிறுத்தப்பட்ட காவற்படை அல்லது காவல்நிலையைக் குறிக்கிறது. இடத்தையும் அங்கிருந்த ஆட்களையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: נֹשֵׂא כֵלָיו
  choice: அவனுடைய ஆயுதம் சுமப்பவன்
  rationale: எழுத்துப்படி ‘அவனுடைய உபகரணங்கள்/ஆயுதங்களைச் சுமப்பவன்’; பழங்கால இராணுவப் பணியைத் தெளிவாகவும் இயல்பாகவும் கூறுகிறது.
- source_word: עֲלוּ אֵלֵינוּ
  choice: எங்களிடம் ஏறி வாருங்கள்
  rationale: மேலுள்ள பெலிஸ்திய நிலையை நோக்கிய உயர்வான இயக்கத்தையும் பேச்சாளர்களை நோக்கிய வருகையையும் காக்கிறது.
- source_word: וְנוֹדִיעָה אֶתְכֶם דָּבָר
  choice: உங்களுக்கு ஒரு காரியத்தைத் தெரிவிக்கிறோம்
  rationale: ידע என்பதன் ஹிபீல் வடிவிலுள்ள ‘அறியச் செய்/தெரிவி’ என்ற பொருளையும், דָּבָר என்பதன் திட்டமிட்ட பொதுத்தன்மையையும் காக்கிறது.
- source_word: עֲלֵה אַחֲרַי
  choice: எனக்குப் பின்னால் ஏறி வா
  rationale: ஒருமை ஆணை வடிவையும், மேலே ஏறுவதையும், யோனத்தானைப் பின்தொடர்வதையும் நேரடியாகக் காக்கிறது.
- source_word: כִּי נְתָנָם יְהוָה בְּיַד יִשְׂרָאֵל
  choice: ஏனெனில் யாவே அவர்களை இஸ்ரவேலின் கையில் ஒப்புக்கொடுத்துவிட்டார்
  rationale: போரில் பகைவரை ஒருவரின் அதிகாரத்துக்குள் ஒப்புக்கொடுப்பதைக் குறிக்கும் נתן ... ביד என்ற எபிரேய மரபுத்தொடரை, ‘கை’ என்ற உருவகத்துடன் புரியத்தக்க தமிழில் தருகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: மூலத்தில் வரும் தனிப்பட்ட இறைப்பெயரை ஒரு பட்டத்தால் மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர் / ஆண்டவர்
  rationale: மூல எபிரேய உரை நான்கெழுத்து இறைப்பெயரை நேரடியாகப் பயன்படுத்துவதால், பட்டப்பெயரைப் பதிலிடாமல் தனிப்பட்ட பெயரை ஒலிபெயர்த்துள்ளது.
- issue: வெற்றி ஏற்கெனவே கொடுக்கப்பட்டதாகக் கூறும் நிறைவேற்றுப் பார்வை
  choice: ஒப்புக்கொடுத்துவிட்டார்
  alternative: ஒப்புக்கொடுப்பார்
  rationale: נְתָנָם என்பது நிறைவு வினை; நிகழவிருக்கும் வெற்றியை உறுதியான நிறைவேற்றமாக யோனத்தான் கூறும் பதற்றத்தை எதிர்காலமாகத் தளர்த்தாமல் காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் கண்ணியமான வரலாற்றுக் கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘ஆயுதம் சுமப்பவன்’ என்பது புரியத்தக்க நேரடி மொழிபெயர்ப்பு; ‘கையில்’ என்ற வேதாகம உருவகம் குறிப்பு விளக்கத்துடன் தக்கவைக்கப்பட்டுள்ளது. எல்லா அடிக்குறிப்பு குறிகளும் முதன்மை உரையில் இடம்பெறுகின்றன.
