translation_notes:
  register: நவீன தரத் தமிழில், சாதாரண வாசகர்கள் புரிந்துகொள்ளக்கூடிய கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய உருவகமான ‘கண்கள் ஒளிபெறுதல்’ அடிக்குறிப்புடன் தக்கவைக்கப்பட்டுள்ளது.
