  text: וַ/יֹּ֨אמֶר֙ יֽוֹנָתָ֔ן עָכַ֥ר אָבִ֖/י אֶת הָ/אָ֑רֶץ רְאוּ נָא֙ כִּֽי אֹ֣רוּ עֵינַ֔/י כִּ֣י טָעַ֔מְתִּי מְעַ֖ט דְּבַ֥שׁ הַ/זֶּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/029.yaml
  text: Then Jonathan said[a], “My father has troubled the land. See, please, how my eyes have brightened because I tasted a little of this honey.”
translation:
  language: ta
  text: அப்போது யோனத்தான், “என் தந்தை நாட்டுக்குத் தொல்லை உண்டாக்கிவிட்டார். தயவுசெய்து பாருங்கள், இந்தத் தேனைச் சிறிதளவு சுவைத்ததால் என் கண்கள் எப்படி ஒளிபெற்றுள்ளன![a]” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “என் கண்கள் ஒளிபெற்றுள்ளன” என்பது, சாப்பிட்ட பிறகு வலிமையோ விழிப்புணர்வோ புதுப்பிக்கப்பட்டதைக் குறிக்கும் எபிரெய மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָכַר
  choice: தொல்லை உண்டாக்கிவிட்டார்
  rationale: இந்த வினைச்சொல் தொந்தரவு செய்தல், நிலைகுலையச் செய்தல் அல்லது துன்பத்தைக் கொண்டுவருதல் என்னும் பொருள்களைத் தருகிறது. சூழலில் சவுலின் ஆணை நாட்டின் மக்களுக்கு ஏற்படுத்திய பாதிப்பை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: הָאָרֶץ
  choice: நாட்டுக்கு
  rationale: இங்கு நிலப்பரப்பையும் அதில் வாழும் மக்களையும் குறிக்கக்கூடிய எபிரெயச் சொல்லின் பரப்பை ‘நாடு’ தக்கவைக்கிறது.
- source_word: רְאוּ נָא
  choice: தயவுசெய்து பாருங்கள்
  rationale: பன்மை ஏவலுடன் வரும் נָא என்ற வேண்டுகோள் துகளையும் இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: אֹרוּ עֵינַי
  choice: என் கண்கள் ஒளிபெற்றுள்ளன
  rationale: உண்ட பிறகு புத்துணர்வும் விழிப்புணர்வும் திரும்பியதைக் குறிக்கும் எபிரெய உருவகத்தை கண் மற்றும் ஒளி சார்ந்த சொல்லாட்சியுடன் பாதுகாக்கிறது.
- source_word: טָעַמְתִּי
  choice: சுவைத்ததால்
  rationale: பொதுவாக ‘சாப்பிட்டேன்’ என்பதைக் காட்டிலும், மூலத்தின் ‘சுவைத்தேன்’ என்ற துல்லியமான பொருளையும் மிகச் சிறிய அளவு உட்கொண்டதையும் காட்டுகிறது.
- source_word: מְעַט
  choice: சிறிது
  rationale: குறைந்த அளவைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: דְּבַשׁ הַזֶּה
  choice: இந்தத் தேன்
  rationale: மூலத்தில் தேன்கூடு என்று வெளிப்படையாக இல்லாததால், சுட்டுப்பெயருடன் ‘இந்தத் தேன்’ என நேரடியாக மொழிபெயர்க்கப்பட்டுள்ளது.
