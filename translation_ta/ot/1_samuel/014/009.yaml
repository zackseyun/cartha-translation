translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையில் dignified நடையுடன் மொழிபெயர்க்கப்பட்டது. போர்க்களத்தின் மேல்நோக்கிய நில அமைப்பை ‘ஏறிச் செல்ல’ பாதுகாத்து, דֹּמּוּ மற்றும் תַחְתֵּינוּ ஆகியவற்றின் மாற்றுப் பொருள்கள் அடிக்குறிப்புகளில் வைக்கப்பட்டுள்ளன.
