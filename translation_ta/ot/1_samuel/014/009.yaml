base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/009.yaml
  text: If they say to us like this[b][a], ‘Stay there until we come to you,’ then we will stand where we are and will not go up to them.
translation:
  language: ta
  text: 'அவர்கள் நம்மிடம் இவ்வாறு சொன்னால்: ‘நாங்கள் உங்களிடம் வரும்வரை அங்கேயே அசையாமல் இருங்கள்[a],’ நாம் இருக்கும் இடத்திலேயே நிற்போம்[b]; அவர்களிடம் ஏறிச் செல்லமாட்டோம்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அமைதியாக இருங்கள்” அல்லது “காத்திருங்கள்.” எபிரேயக் கட்டளைச்சொல், அவர்கள் இருந்த இடத்திலேயே அசையாமலோ அமைதியாகவோ இருப்பதைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: சொல்லுக்குச் சொல், “நமக்குக் கீழே நிற்போம்”; இது “நாம் இருக்கும் இடத்திலேயே இருப்போம்” என்று பொருள்படும் எபிரேய வழக்குத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם כֹּה יֹאמְרוּ אֵלֵינוּ
  choice: அவர்கள் நம்மிடம் … என்று சொன்னால்
  rationale: நிபந்தனைத் தொடரையும் நேர்கூற்றின் அறிமுகத்தையும் இயல்பான நவீனத் தமிழில் தருகிறது; כֹּה என்பதன் ‘இவ்வாறு’ என்ற வலியுறுத்தல் மேற்கோள் அமைப்பிலேயே வெளிப்படுகிறது.
- source_word: דֹּמּוּ
  choice: அங்கேயே அசையாமல் இருங்கள்
  rationale: דמם என்பதற்கு அமைதியாக அல்லது அசையாமல் இருத்தல் என்ற பொருள் உண்டு. இப்போர்ச் சூழலில் அவர்கள் முன்னேறாமல் தங்கள் இடத்திலேயே இருக்க வேண்டும் என்பதே நடைமுறைப் பொருள்; மூலத்தின் பொருள் வரம்பைப் பாதுகாக்க அடிக்குறிப்பில் மாற்றுப் பொருள் தரப்பட்டுள்ளது.
- source_word: עַד הַגִּיעֵנוּ אֲלֵיכֶם
  choice: நாங்கள் உங்களிடம் வரும்வரை
  rationale: பெலிஸ்தியர்கள் யோனத்தானும் அவனுடைய ஆயுதம் தாங்குபவனும் இருக்கும் இடத்தை அடைவதைக் குறிக்கும் இயல்பான தமிழ் மொழிபெயர்ப்பு.
- source_word: וְעָמַדְנוּ תַחְתֵּינוּ
  choice: நாம் இருக்கும் இடத்திலேயே நிற்போம்
  rationale: சொல்லுக்குச் சொல் ‘நமக்குக் கீழே நிற்போம்’ எனும் எபிரெய வழக்குத்தொடர், தங்கள் தற்போதைய இடத்தில் நிலைத்திருப்பதைக் குறிக்கிறது.
- source_word: וְלֹא נַעֲלֶה אֲלֵיהֶם
  choice: அவர்களிடம் ஏறிச் செல்லமாட்டோம்
  rationale: עלה என்பதிலுள்ள மேல்நோக்கிய நில அமைப்புச் சாயலை ‘ஏறிச்’ என்பது பாதுகாக்கிறது; உடனடித் தாக்குதல் என்று தேவையின்றி விளக்கவில்லை.
