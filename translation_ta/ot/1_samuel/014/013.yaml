translation_notes:
  register: நவீன நிலையான தமிழில், கண்ணியமான ஆனால் பொதுவாசகருக்கு எளிதில் புரியும் நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. போர்ச் சூழலின் வன்முறையை மென்மைப்படுத்தாமலும் தேவையற்ற விவரங்களைச் சேர்க்காமலும் மூலத்தின் சுருக்கமும் இயக்கமும் காக்கப்பட்டுள்ளன. அடிக்குறிப்பு குறியீடு அது விளக்கும் מְמוֹתֵת என்ற சொல்லின் மொழிபெயர்ப்புக்குப் பின்னரே வைக்கப்பட்டுள்ளது.
