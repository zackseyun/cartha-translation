base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/013.yaml
  text: Then Jonathan climbed up on his hands and feet[a], with his armor-bearer behind him. They fell before Jonathan, and his armor-bearer killed them after him.
translation:
  language: ta
  text: அப்போது யோனத்தான் தன் கைகளையும் கால்களையும் ஊன்றி மேலே ஏறினான்; அவனுடைய ஆயுதங்களைச் சுமப்பவன் அவனுக்குப் பின்னால் வந்தான். அவர்கள் யோனத்தானுக்கு முன்பாக வீழ்ந்தார்கள்; அவனுடைய ஆயுதங்களைச் சுமப்பவன் யோனத்தானுக்குப் பின்னால் அவர்களைக் கொன்றுகொண்டே வந்தான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யோனத்தானுக்குப் பின்னால் அவர்களைக் கொன்றான்.” எபிரெய மொழியிலுள்ள பங்கேற்புவினை தொடர்ந்து அல்லது அடுத்தடுத்து நடைபெற்ற செயலை வலியுறுத்தக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: மேலே ஏறினான்
  rationale: עלה என்பதன் அடிப்படைப் பொருள் ‘மேலே போதல்/ஏறுதல்.’ செங்குத்தான இடத்தை கைகளாலும் கால்களாலும் கடக்கும் இச்சூழலில் ‘மேலே ஏறினான்’ என்பது உடல் இயக்கத்தை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: עַל יָדָיו וְעַל רַגְלָיו
  choice: தன் கைகளையும் கால்களையும் ஊன்றி
  rationale: எபிரெயச் சொற்றொடரின் தெளிவான உடல் நிலையைப் பாதுகாத்து, நவீன தமிழில் இயல்பாகப் புரியுமாறு ‘ஊன்றி’ சேர்க்கப்பட்டுள்ளது; இது நான்கு கால்களில் சென்றான் என்ற அளவுக்கு மிகையாக விளக்குவதில்லை.
- source_word: נֹשֵׂא כֵלָיו
  choice: அவனுடைய ஆயுதங்களைச் சுமப்பவன்
  rationale: சொல்லுக்குச் சொல் பொருளையும் போர்ச் சூழலில் அந்த உதவியாளரின் பணியையும் தெளிவாகக் காட்டுகிறது. ‘ஆயுததாரி’ என்பதைவிட பொதுவாசகருக்கு உடனடியாகப் புரியும்.
- source_word: אַחֲרָיו
  choice: அவனுக்குப் பின்னால்
  rationale: இங்கு இடநிலையும் பின்தொடரும் வரிசையும் முதன்மையானவை; தமிழ் உரையில் இரண்டையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וַיִּפְּלוּ לִפְנֵי יוֹנָתָן
  choice: அவர்கள் யோனத்தானுக்கு முன்பாக வீழ்ந்தார்கள்
  rationale: போரில் யோனத்தானுக்கு எதிராக அவர்கள் வீழ்த்தப்பட்டார்கள் என்ற கருத்தைத் தருகிறது; அவர்கள் எப்படித் துல்லியமாக வீழ்ந்தார்கள் என்பதை உரை கூறாததால் அதைத் திறந்தவாறே வைக்கிறது.
- source_word: מְמוֹתֵת
  choice: கொன்றுகொண்டே வந்தான்
  rationale: எபிரெயப் பங்கேற்புவினை தொடர்ந்து அல்லது அடுத்தடுத்து நடைபெற்ற செயலைக் குறிக்கக்கூடும். பின்தொடர்ந்து கொன்ற செயலைத் தமிழில் இயல்பாகக் காட்டுகிறது; அதேவேளை எளிய இறந்தகால வாசிப்பும் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
