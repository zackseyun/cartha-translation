source:
  edition: WLC
  text: וְ/שֵׁם֙ אֵ֣שֶׁת שָׁא֔וּל אֲחִינֹ֖עַם בַּת אֲחִימָ֑עַץ וְ/שֵׁ֤ם שַׂר צְבָא/וֹ֙ אֲבִינֵ֔ר בֶּן נֵ֖ר דּ֥וֹד שָׁאֽוּל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/050.yaml
  text: The name of Saul’s wife was Ahinoam daughter of Ahimaaz[a], and the name of the commander of his army was Abner son of Ner, Saul’s uncle.
translation:
  language: ta
  text: சவுலின் மனைவியின் பெயர் அகினோவாம்; அவள் அகிமாசின் மகள். சவுலின் படைத்தலைவனின் பெயர் அப்னேர்; அவன் சவுலின் மாமனான நேரின் மகன்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘சவுலின் நெருங்கிய ஆண் உறவினரான நேரின் மகன்.’ எபிரெயச் சொல் விரிவான ஆண் உறவையும் குறிக்கலாம்; ஆனால் இங்குள்ள வம்சச் சூழலில் ‘மாமன்’ என்பதே மிகப் பொருத்தமானது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשֵׁם
  choice: பெயர்
  rationale: முன்னொட்டான וְ உடன் வரும் பெயர்ச்சொல் அமைப்பு அடையாள விவரங்களைத் தொடர்ந்து அறிமுகப்படுத்துகிறது. தமிழில் இயல்பாகவும் தெளிவாகவும் இருக்க, இரு கூறுகளிலும் ‘பெயர்’ என்ற சூத்திர வடிவம் தக்கவைக்கப்பட்டது.
- source_word: אֵשֶׁת
  choice: மனைவி
  rationale: சவுலுடன் இணைந்த இந்தக் கட்டமைப்பில் திருமண உறவே தெளிவாகக் குறிக்கப்படுவதால் ‘மனைவி’ துல்லியமான நவீனத் தமிழ் சொல்.
- source_word: בַּת
  choice: மகள்
  rationale: இது வழக்கமான வம்ச உறவுச் சொல். தமிழில் ‘அவள் அகிமாசின் மகள்’ என்று கூறுவது உறவை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: שַׂר צְבָאוֹ
  choice: அவனுடைய படைத்தலைவன்
  rationale: שַׂר என்பது இங்கு இராணுவத் தலைமைப் பொறுப்பையும் צְבָאוֹ என்பது சவுலுடைய படையையும் குறிக்கின்றன. ‘படைத்தலைவன்’ சுருக்கமான, தெளிவான சமகாலத் தமிழ் இணைச்சொல்.
- source_word: בֶּן
  choice: மகன்
  rationale: வம்சப் பெயரிடலில் வரும் வழக்கமான தந்தை–மகன் உறவைத் தமிழில் நேரடியாகக் காட்டுகிறது.
- source_word: דּוֹד
  choice: தந்தையின் சகோதரன்
  rationale: இந்த வம்சச் சூழலில் ‘தந்தையின் சகோதரன்’ என்பதே மிகச் சாத்தியமான பொருள். தமிழிலுள்ள ‘மாமன்’, ‘சித்தப்பா’, ‘பெரியப்பா’ போன்ற சொற்கள் உறவின் பக்கம் அல்லது வயது குறித்த கூடுதல் தகவலைச் சேர்க்கக்கூடும்; ஆகவே விளக்கமான இச்சொற்றொடர் பயன்படுத்தப்பட்டது.
theological_decisions:
- issue: சவுலின் வம்சக் குறிப்பில் דּוֹד என்பதன் பொருள்
  choice: சவுலின் தந்தையின் சகோதரன்
  alternative: சவுலின் நெருங்கிய ஆண் உறவினர்
  rationale: வம்சப் பட்டியல் சூழலும் அடுத்த வசனத்தின் குடும்பத் தகவலும் தந்தையின் சகோதரன் என்ற பொருளை வலுப்படுத்துகின்றன. எனினும் எபிரெயச் சொல் சில சூழல்களில் விரிவான ஆண் உறவைக் குறிக்கக்கூடும் என்பதால் மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டது.
translation_notes:
  register: நவீன தரத் தமிழில் எளிமையான, கண்ணியமான வம்சக் குறிப்பு நடையைப் பயன்படுத்துகிறது. மூலத்தின் இரு இணையான ‘பெயர்’ அமைப்புகளும் தக்கவைக்கப்பட்டுள்ளன; நீண்ட தொடரை வாசிக்க எளிதாக்க அரைப்புள்ளிகளும் தெளிவுபடுத்தும் சுட்டுப்பெயர்களும் பயன்படுத்தப்பட்டுள்ளன.
