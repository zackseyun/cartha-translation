  text: וַ/יֹּ֣אמֶר שָׁא֡וּל נֵרְדָ֣ה אַחֲרֵי֩ פְלִשְׁתִּ֨ים לַ֜יְלָה וְֽ/נָבֹ֥זָה בָ/הֶ֣ם עַד א֣וֹר הַ/בֹּ֗קֶר וְ/לֹֽא נַשְׁאֵ֤ר בָּ/הֶם֙ אִ֔ישׁ וַ/יֹּ֣אמְר֔וּ כָּל הַ/טּ֥וֹב בְּ/עֵינֶ֖י/ךָ עֲשֵׂ֑ה וַ/יֹּ֨אמֶר֙ הַ/כֹּהֵ֔ן נִקְרְבָ֥ה הֲלֹ֖ם אֶל הָ/אֱלֹהִֽים׀׀־־־ס־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/036.yaml
  text: Then Saul said[a], “Let us go down after the Philistines by night and plunder them until the light of the morning, and let us not leave a man among them.” And they said, “Do whatever seems good in your eyes.” But the priest said, “Let us draw near here to God.”
translation:
  language: ta
  text: அப்பொழுது சவுல், “இரவில் பெலிஸ்தியரைப் பின்தொடர்ந்து இறங்கிச் செல்வோம்; காலை வெளிச்சம் வரும்வரை அவர்களைக் கொள்ளையிடுவோம்; அவர்களில் ஒருவனையும் விட்டுவைக்க மாட்டோம்” என்றான். அதற்கு அவர்கள், “உமது பார்வைக்கு நல்லதாகத் தோன்றுவதையெல்லாம் செய்யுங்கள்” என்றார்கள். ஆனால் ஆசாரியன், “நாம் இங்கே கடவுளை அணுகுவோம்[a]” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: மாற்றாக, “நாம் இங்கே கடவுளிடம் நெருங்கிச் செல்வோம்” என்றும் மொழிபெயர்க்கலாம். அடுத்ததாக என்ன செய்ய வேண்டும் என்பதற்காகக் கடவுளின் வழிகாட்டுதலை நாடுவோம் என்று ஆசாரியன் குறிப்பிட்டிருக்கலாம்.
    reason: மூலத்தில் ‘கடவுளை அணுகுவோம்’ என்றே உள்ளது. சூழல் வழிகாட்டுதல் நாடுதலைக் குறிக்கலாம்; ஆனால் குறிப்பிட்ட விசாரிப்பு முறையைச் சொல்லவில்லை.
lexical_decisions:
- source_word: נֵרְדָה
  choice: இறங்கிச் செல்வோம்
  rationale: ירד என்பதன் திசைசார்ந்த ‘இறங்குதல்’ பொருளையும், முதல் நபர் பன்மை வேண்டுகோள்/தூண்டல் வடிவையும் இயல்பான தமிழில் காக்கிறது.
- source_word: אַחֲרֵי פְלִשְׁתִּים
  choice: பெலிஸ்தியரைப் பின்தொடர்ந்து
  rationale: מאַחֲרֵי என்பதன் அடிப்படை ‘பின்னால்’ என்ற கருத்தை, இங்குள்ள போர்ச் சூழலில் இயல்பாகத் தெரிவிக்கிறது.
- source_word: לַיְלָה
  choice: இரவில்
  rationale: தாக்குதல் நடைபெறவுள்ள காலத்தைச் சுருக்கமாகக் குறிக்கிறது; எபிரெயத்தில் வெளிப்படையாக இல்லாத ‘இன்றிரவு’ என்பதைச் சேர்க்கவில்லை.
- source_word: וְנָבֹזָה בָהֶם
  choice: அவர்களைக் கொள்ளையிடுவோம்
  rationale: בזז என்பதன் கொள்ளையிடுதல்/சூறையாடுதல் பொருளைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: עַד אוֹר הַבֹּקֶר
  choice: காலை வெளிச்சம் வரும்வரை
  rationale: ‘காலையின் வெளிச்சம்’ என்ற மூலப்படிமத்தை இயல்பான நவீன தமிழில் காக்கிறது.
- source_word: וְלֹא נַשְׁאֵר בָּהֶם אִישׁ
  choice: அவர்களில் ஒருவனையும் விட்டுவைக்க வேண்டாம்
  rationale: אִישׁ என்ற ஒருமைச் சொல்லின் பகிர்வுப் பொருளையும் முழுமையாக ஒருவரையும் விடாத எண்ணத்தையும் காக்கிறது; மூலத்தில் வெளிப்படையாக இல்லாத ‘உயிரோடு’ என்பதைச் சேர்க்கவில்லை.
- source_word: כָּל הַטּוֹב בְּעֵינֶיךָ עֲשֵׂה
  choice: உமது பார்வைக்கு நல்லதாகத் தோன்றுவதையெல்லாம் செய்யும்
  rationale: தனிப்பட்ட தீர்மானம் அல்லது ஒப்புதலைக் குறிக்கும் எபிரெயக் கண் உருவகத்தைத் தமிழில் புரியுமாறு தக்கவைக்கிறது.
- source_word: נִקְרְבָה הֲלֹם אֶל הָאֱלֹהִים
  choice: நாம் இங்கே கடவுளை அணுகுவோம்
  rationale: קרב என்பதன் ‘அணுகுதல்’ பொருளையும் הֲלֹם என்பதன் ‘இங்கே’ கூறையும் காக்கிறது; குறிப்பிட்ட சடங்கு அல்லது விசாரிப்புமுறையை மொழிபெயர்ப்பில் சேர்க்கவில்லை.
theological_decisions:
- issue: போருக்கு முன் கடவுளிடம் வழிகாட்டுதல் நாடுதல்
  choice: “நாம் இங்கே கடவுளை அணுகுவோம்” என்று பொதுவாக மொழிபெயர்த்தல்
  alternative: “நாம் இங்கே கடவுளிடம் விசாரிப்போம்”
  rationale: சூழலில் ஆசாரியன் கடவுளின் வழிகாட்டுதலை நாடச் சொல்வது மறைமுகமாக இருக்கலாம்; ஆனாலும் எபிரெய உரை ‘விசாரித்தல்’ என்ற குறிப்பிட்ட வினையைப் பயன்படுத்தாமல் ‘அணுகுதல்’ என்கிறது. ஆகவே அந்தத் தெளிவின்மை காக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், மரியாதையும் கதைநடைத் தெளிவும் காக்கப்பட்டுள்ளன. சவுலின் தொடர்ச்சியான தூண்டல் வடிவங்கள் ‘செல்வோம்/கொள்ளையிடுவோம்’ என்றும், கட்டளையின் முடிவு இயல்பாக ‘விட்டுவைக்க வேண்டாம்’ என்றும் தரப்பட்டுள்ளது. கடவுளை அணுகுதல் பற்றிய சொற்றொடரில் மூலத்தின் இறையியல் தெளிவின்மை பாதுகாக்கப்பட்டுள்ளது.
