  text: וַ/יֹּ֣אמֶר שָׁא֗וּל לָ/עָם֙ אֲשֶׁ֣ר אִתּ֔/וֹ פִּקְדוּ נָ֣א וּ/רְא֔וּ מִ֖י הָלַ֣ךְ מֵ/עִמָּ֑/נוּ וַֽ/יִּפְקְד֔וּ וְ/הִנֵּ֛ה אֵ֥ין יוֹנָתָ֖ן וְ/נֹשֵׂ֥א כֵלָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/017.yaml
  text: Then Saul said to the people who were with him[a], “Please take a count and see who has gone from among us.” So they took a count, and behold, Jonathan and his armor-bearer were not there.
translation:
  language: ta
  text: அப்போது சவுல் தன்னுடன் இருந்த மக்களிடம், “தயவுசெய்து ஆட்களைக் கணக்கெடுத்து[a], நம்மிடமிருந்து யார் போயிருக்கிறார் என்று பாருங்கள்” என்றான். அவர்கள் கணக்கெடுத்தபோது, இதோ, யோனத்தானும் அவனுடைய ஆயுதம் தாங்குபவனும் அங்கே இல்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஆட்களை அணிவகுத்துப் பாருங்கள்” / “ஆட்களை எண்ணுங்கள்”; இங்குள்ள எபிரெய வினை, உடனிருந்தவர்களைப் பார்வையிடுவதையோ எண்ணுவதையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: פִּקְדוּ / וַיִּפְקְדוּ
  choice: ஆட்களைக் கணக்கெடுத்து / அவர்கள் கணக்கெடுத்தபோது
  rationale: இச்சூழலில் פקד என்பது உடனிருந்த ஆட்களைப் பார்வையிட்டு எண்ணி, யார் காணவில்லை என்பதைத் தெரிந்துகொள்வதைக் குறிக்கிறது. ‘கணக்கெடு’ என்பது இயல்பான நவீனத் தமிழில் அந்தப் பொருளைத் தெளிவாக வழங்குகிறது.
- source_word: נָא
  choice: தயவுசெய்து
  rationale: கட்டளையின் வலிமையை மென்மையாக்கும் வேண்டுகோள் நயத்தைத் தமிழில் இயல்பாகக் காட்டுகிறது.
- source_word: וּרְאוּ
  choice: என்று பாருங்கள்
  rationale: ‘பாருங்கள்’ என்பது எபிரெய வினையின் அடிப்படைப் படிமத்தைத் தக்கவைத்தபடியே, இங்கு ‘கண்டறியுங்கள்’ என்ற சூழல் பொருளையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: מִי הָלַךְ מֵעִמָּנוּ
  choice: நம்மிடமிருந்து யார் போயிருக்கிறார்
  rationale: குழுவிலிருந்து ஒருவர் சென்றிருப்பதைச் சுட்டும் எபிரெயத் தொடரை நெருக்கமாகவும் இயல்பாகவும் வழங்குகிறது; மூலத்திலுள்ள ஒருமை வினாவும் காக்கப்படுகிறது.
- source_word: וְהִנֵּה
  choice: இதோ
  rationale: எதிர்பாராத அல்லது கவனிக்கத்தக்க கண்டுபிடிப்பை முன்னிறுத்தும் הנה என்பதன் கதையாடல் வலிமையைத் தக்கவைக்கிறது.
- source_word: נֹשֵׂא כֵלָיו
  choice: அவனுடைய ஆயுதம் தாங்குபவன்
  rationale: சொல்லுக்குரிய ‘அவனுடைய போர்க்கருவிகளைச் சுமப்பவன்’ என்ற பணியைத் தெளிவாகத் தெரிவிக்கிறது; தமிழில் புரிந்துகொள்ள எளிதான வடிவம்.
- source_word: אֵין יוֹנָתָן וְנֹשֵׂא כֵלָיו
  choice: யோனத்தானும் அவனுடைய ஆயுதம் தாங்குபவனும் அங்கே இல்லை
  rationale: இருவரும் அங்கு காணப்படவில்லை என்ற எபிரெய இருப்பின்மை அமைப்பை இயல்பான தமிழில் வழங்குகிறது.
