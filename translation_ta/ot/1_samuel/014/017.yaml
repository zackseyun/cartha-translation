  source_fidelity: The draft accurately renders Saul's request to those with him to check the group and determine who has departed. It preserves the polite force of נָא, the personnel-checking sense of both instances of פקד, the departure sense of מֵעִמָּנוּ, the discovery marker וְהִנֵּה, and the absence of both Jonathan and his armor-bearer.
