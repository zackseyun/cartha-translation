translation_notes:
  register: நவீனத் தரத் தமிழில், மரியாதையும் வேதாகமக் கதையாடலுக்குரிய கண்ணியமும் காக்கப்பட்டுள்ளன. ‘இதோ’ என்பது மூலத்தின் கவன ஈர்ப்பு நயத்தைப் பாதுகாக்கிறது; தேவையற்ற பழமையான சொற்கள் தவிர்க்கப்பட்டுள்ளன.
