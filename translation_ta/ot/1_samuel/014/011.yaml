  yaml_path: translation/ot/1_samuel/014/011.yaml
  text: When the two of them revealed themselves to the Philistine garrison[a], the Philistines said, “Look[b], the Hebrews are coming out of the holes where they had hidden themselves.”
translation:
  language: ta
  text: அவர்கள் இருவரும் பெலிஸ்தியரின் காவலரண் முன் தங்களைக் காட்டிக்கொண்டார்கள்.[a] அப்போது பெலிஸ்தியர்கள், “இதோ, அவர்கள் ஒளிந்திருந்த குழிகளிலிருந்து எபிரெயர்கள்[b] வெளியே வருகிறார்கள்” என்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பெலிஸ்தியரின் புறக்காவல் நிலையத்தின் முன் தங்களைக் காட்டிக்கொண்டார்கள்.”
    reason: lexical_alternative
  - marker: b
    text: “எபிரெயர்கள்” என்பது இஸ்ரவேலரைப் பெலிஸ்தியர்கள் குறிப்பிடும் இனப்பெயர்.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּגָּלוּ
  choice: தங்களை வெளிப்படுத்தினார்கள்
  rationale: நிபால் வடிவம் இங்கு தற்செயலாகக் காணப்பட்டதை அல்ல, யோனத்தானும் அவனுடைய ஆயுததாரியும் வேண்டுமென்றே தங்களைக் காணச் செய்ததை உணர்த்துகிறது.
- source_word: שְׁנֵיהֶם
  choice: அவர்கள் இருவரும்
  rationale: யோனத்தானையும் அவனுடைய ஆயுததாரியையும் குறிக்கும் இருமை வலியுறுத்தலை இயல்பான தமிழில் காக்கிறது.
- source_word: מַצַּב פְּלִשְׁתִּים
  choice: பெலிஸ்தியர்களின் காவலரண்
  rationale: இந்த இராணுவச் சூழலில் מַצָּב என்பது நிலைநிறுத்தப்பட்ட படைக்காவல் அல்லது புறக்காவல் அரணைக் குறிக்கிறது; ‘காவலரண்’ சுருக்கமாகவும் தெளிவாகவும் உள்ளது.
- source_word: הִנֵּה
  choice: இதோ
  rationale: கவனத்தை ஈர்க்கும் வியப்புச் சொல்லின் உரையாடல் வலிமையை இயல்பான, கண்ணியமான தமிழில் தருகிறது.
- source_word: עִבְרִים
  choice: எபிரெயர்கள்
  rationale: பெலிஸ்தியர்கள் இஸ்ரவேலரைக் குறிப்பிடப் பயன்படுத்தும் வெளிப்புற இனப்பெயரை மாற்றாமல் காக்கிறது.
- source_word: יֹצְאִים
  choice: வெளியே வருகிறார்கள்
  rationale: நிகழ்ந்துகொண்டிருக்கும் செயலைக் காட்டும் எபிரெயப் பங்கேற்புவினையின் காட்சித் தன்மையைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: מִן הַחֹרִים
  choice: குழிகளிலிருந்து
  rationale: חֹרִים என்பதன் உறுதியான ‘துளைகள்/குழிகள்’ என்ற படிமத்தைக் காக்கிறது; ‘குகைகள்’ என்பது மூலத்தைவிடக் குறிப்பானதாகிவிடும்.
- source_word: אֲשֶׁר הִתְחַבְּאוּ שָׁם
  choice: தாங்கள் ஒளிந்துகொண்டிருந்த
  rationale: ஹித்பாயேல் வடிவின் தன்வினைப் பொருளை ‘ஒளிந்துகொண்டிருந்த’ என்பதும், பெலிஸ்தியர்களின் கூற்றுக்குள் எபிரெயர்களையே மீண்டும் சுட்டுவதை ‘தாங்கள்’ என்பதும் தெளிவாகக் காட்டுகின்றன.
