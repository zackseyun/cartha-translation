base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/047.yaml
  text: 'Saul had secured the kingship over Israel[a], and he fought against all his enemies on every side: against Moab, against the Ammonites, against Edom, against the kings of Zobah, and against the Philistines. Wherever he turned, he inflicted punishment.'
translation:
  language: ta
  text: 'சவுல் இஸ்ரவேல்மீதான அரசாட்சியை உறுதிப்படுத்திக்கொண்டான். அவன் தன்னைச் சுற்றிலும் இருந்த எதிரிகள் அனைவரோடும் போர் செய்தான்: மோவாபியரோடும், அம்மோனியரோடும், ஏதோமியரோடும், சோபாவின் அரசர்களோடும், பெலிஸ்தியரோடும் போர் செய்தான். அவன் எந்தத் திசையில் திரும்பினாலும், அவர்களைத் தண்டித்தான்[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இன்னும் சொற்சொல்லாக, “அவர்களைக் குற்றவாளிகளென்று தீர்த்தான்.” எபிரெய வினைச்சொல் ஒருவரைக் குற்றவாளி என்று அறிவிப்பதைக் குறிக்கலாம்; இங்கு அது எதிரிகளுக்குத் தண்டனையான தோல்வியை ஏற்படுத்தியதைக் குறிக்க வாய்ப்புள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכַד הַמְּלוּכָה עַל יִשְׂרָאֵל
  choice: இஸ்ரவேல்மீதான அரசாட்சியை உறுதிப்படுத்திக்கொண்டான்
  rationale: לכד என்பதன் அடிப்படைப் பொருள் ‘கைப்பற்று/பிடி’ என்பதாக இருந்தாலும், இங்கு שאול் அரச பதவியை முறைகேடாகப் பறித்தான் என்று கூறுவதைக் காட்டிலும், இஸ்ரவேலின்மேல் தன் அரசாட்சியை நிலைநிறுத்தியதைக் குறிக்கிறது. ‘உறுதிப்படுத்திக்கொண்டான்’ என்பது அந்தச் சூழற்பொருளை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וַיִּלָּחֶם סָבִיב בְּכָל אֹיְבָיו
  choice: தன்னைச் சுற்றிலும் இருந்த எதிரிகள் அனைவரோடும் போர் செய்தான்
  rationale: סָבִיב சுற்றியுள்ள எல்லாத் திசைகளையும் குறிக்கிறது; לחם உடன் வரும் ב போரின் எதிர்த்தரப்பைக் குறிக்கிறது. தமிழில் ‘எதிரிகளோடு போர் செய்தான்’ என்பது இயல்பான பயன்பாடு.
- source_word: בְּמוֹאָב וּבִבְנֵי עַמּוֹן וּבֶאֱדוֹם וּבְמַלְכֵי צוֹבָה וּבַפְּלִשְׁתִּים
  choice: மோவாபியரோடும், அம்மோனியரோடும், ஏதோமியரோடும், சோபாவின் அரசர்களோடும், பெலிஸ்தியரோடும்
  rationale: மீண்டும் மீண்டும் வரும் ב-ஐ ‘-ஓடும்’ என்று வழங்குவது தமிழில் போர் எதிரிகளைத் தெளிவாகக் காட்டுகிறது. ‘அம்மோனின் மகன்கள்’ என்பது இயல்பான தமிழில் ‘அம்மோனியர்’ என வழங்கப்படுகிறது. מַלְכֵי பன்மை என்பதால் ‘அரசர்கள்’ எனவே வைக்கப்பட்டுள்ளது.
- source_word: וּבְכֹל אֲשֶׁר יִפְנֶה
  choice: அவன் எந்தத் திசையில் திரும்பினாலும்
  rationale: פנה இங்கு திசைதிரும்புதல் அல்லது கவனத்தைத் திருப்புதல் என்ற பரந்த பொருளைக் கொண்டது. ‘எந்தத் திசையில் திரும்பினாலும்’ என்பது பகிர்வுப் பொருளையும் போர்ச் சூழலையும் காக்கிறது.
- source_word: יַרְשִׁיעַ
  choice: அவர்களைத் தண்டித்தான்
  rationale: רשע என்பதன் ஹிஃபில் வடிவம் ‘குற்றவாளி என்று தீர்த்தல்’ என்ற நீதித்தீர்ப்பு சார்ந்த பொருளைக் கொள்ளலாம். இப்போர்ச் சூழலில் அது எதிரிகள்மேல் தண்டனைக்குரிய தோல்வியை ஏற்படுத்தியதைக் குறிக்க வாய்ப்புள்ளது. ‘தண்டித்தான்’ என்பது சூழலுக்கேற்ற இயல்பான மொழியாக இருந்து, அடிப்படை நீதித்தீர்ப்புச் சாயலையும் ஓரளவு காக்கிறது.
theological_decisions:
- issue: יַרְשִׁיעַ என்பதன் நீதித்தீர்ப்பு மற்றும் போர்த் தண்டனை சார்ந்த தெளிவின்மை
  choice: அவர்களைத் தண்டித்தான்
  alternative: அவர்களைக் குற்றவாளிகளென்று தீர்த்தான்
  rationale: போர்வெற்றியை மட்டும் கூறும் சொல்லாகச் சுருக்காமல், தண்டனை/தீர்ப்பு சார்ந்த மூலச்சொல்லின் வலிமை முதன்மை உரையில் காக்கப்படுகிறது; மேலும் நேரடியான நீதிமன்றப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. நீண்ட எபிரெய தொடரை வாசிப்புத் தெளிவுக்காக மூன்று வாக்கியங்களாகப் பிரித்துள்ளோம்; எதிரிகளின் பட்டியலில் உள்ள மறுமொழி வலிமையை ‘போர் செய்தான்’ என்ற மீளுரையால் காத்துள்ளோம்.
