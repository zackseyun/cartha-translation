base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/033.yaml
  text: Then they told Saul[a], saying, “Look, the people are sinning against Yahweh by eating over the blood.” And he said, “You have acted treacherously. Roll a large stone to me today.”
translation:
  language: ta
  text: அப்போது சவுலிடம், “இதோ, மக்கள் இரத்தத்தோடு இறைச்சியைச் சாப்பிட்டு[a] யாவேக்கு எதிராகப் பாவம் செய்கிறார்கள்” என்று அறிவித்தார்கள். அதற்கு அவர், “நீங்கள் துரோகமாக நடந்துகொண்டீர்கள். இன்றே ஒரு பெரிய கல்லை உருட்டி என்னிடம் கொண்டுவாருங்கள்” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரேய மொழியில் சொல்லுக்கு சொல், “இரத்தத்தின்மேல்” அல்லது “இரத்தத்தோடு சாப்பிட்டு.” அதாவது, இரத்தம் முறையாக வடிக்கப்படாத இறைச்சியைச் சாப்பிட்டு.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּגִּידוּ לְשָׁאוּל לֵאמֹר
  choice: அப்போது சவுலிடம் … என்று அறிவித்தார்கள்
  rationale: தொடர்ச்சியான கதைநடையை ‘அப்போது’ காட்டுகிறது; נגד என்பதன் தகவல் அறிவிக்கும் பொருளையும் எபிரேய மேற்கோள் அமைப்பையும் இயல்பான தமிழில் தருகிறது.
- source_word: הִנֵּה
  choice: இதோ
  rationale: கேட்பவரின் கவனத்தை அறிக்கையின்மீது திருப்பும் சுட்டிடைச்சொல்லின் வலிமையைப் பாதுகாக்கிறது.
- source_word: הָעָם
  choice: மக்கள்
  rationale: சூழலில் சவுலோடு இருந்த படைவீரர்களை உள்ளடக்கிய கூட்டு மக்களைக் குறிக்கிறது; மூலத்தின் பொதுவான சொல்லாட்சியைப் பாதுகாக்கிறது.
- source_word: חֹטִאים לַיהוָה
  choice: யாவேக்கு எதிராகப் பாவம் செய்கிறார்கள்
  rationale: חטא உடன் வரும் ל இங்கு யாவேக்கு எதிரான குற்றத்தைச் சுட்டுகிறது; உறவுசார் மற்றும் ஒழுக்கரீதியான வலிமையைத் தெளிவாகத் தருகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தேவனுடைய தனிப்பெயரான நான்கெழுத்துப் பெயரைப் பட்டப்பெயராக மாற்றாமல், நவீன தமிழில் வழக்கமான ஒலிபெயர்ப்பால் தருகிறது.
- source_word: לֶאֱכֹל עַל־הַדָּם
  choice: இரத்தத்தோடு இறைச்சியைச் சாப்பிட்டு
  rationale: சொல்லுக்கு சொல் ‘இரத்தத்தின்மேல்/இரத்தத்தோடு சாப்பிடுதல்’ என்றாலும், சூழலில் இரத்தம் முறையாக வடிக்கப்படாத இறைச்சியை உண்பதைக் குறிக்கிறது. ‘இறைச்சியை’ வெளிப்படையாகச் சேர்ப்பது தமிழில் பொருளைத் தெளிவாக்குகிறது; அடிப்படை உருவகம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: בְּגַדְתֶּם
  choice: நீங்கள் துரோகமாக நடந்துகொண்டீர்கள்
  rationale: בגד குறிக்கும் நம்பிக்கை மீறிய, துரோகமான நடத்தையின் கடுமையைப் பொதுவான ‘மீறினீர்கள்’ என்பதைக் காட்டிலும் நன்றாகப் பாதுகாக்கிறது.
- source_word: גֹּלּוּ אֵלַי הַיּוֹם אֶבֶן גְּדוֹלָה
  choice: இன்றே ஒரு பெரிய கல்லை உருட்டி என்னிடம் கொண்டுவாருங்கள்
  rationale: גלל வினையின் நேரடியான ‘உருட்டுதல்’ பொருளையும், பன்மை கட்டளையையும், הַיּוֹם என்பதன் காலக் குறிப்பையும் இயல்பான தமிழில் தருகிறது. ‘கொண்டுவாருங்கள்’ என்பது אֵלַי குறிக்கும் சவுலை நோக்கிய இயக்கத்தைத் தெளிவாக்குகிறது.
theological_decisions:
- issue: יְהוָה என்ற தேவப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: இங்கு மூல உரை தேவனுடைய தனிப்பெயரை நேரடியாகப் பயன்படுத்துகிறது. ‘யாவே’ என்பது அதை ஒரு பட்டப்பெயரால் மாற்றாமல் பாதுகாக்கிறது.
- issue: இரத்தத்துடன் உண்பதன் குற்றம்
  choice: இரத்தம் வடிக்கப்படாத இறைச்சியை உண்பதைக் குறிக்கும் வகையில் மொழிபெயர்த்தல்
  alternative: இரத்தத்தின்மேல் சாப்பிட்டு
  rationale: עַל־הַדָּם என்ற சொற்றொடரின் நேரடி உருவகம் தெளிவற்றதாக இருக்கலாம்; உடனடியான சூழல் இரத்தம் நீக்கப்படாத இறைச்சியை உண்பதைக் காட்டுகிறது. இருப்பினும் மூல மொழியின் உருவகம் அடிக்குறிப்பில் தரப்படுகிறது; அதற்கு மேலான சமய விளக்கம் சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீன தரநிலைத் தமிழில் இயல்பான, மரியாதைமிக்க கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘இதோ’, ‘பாவம்’, ‘துரோகம்’ ஆகிய சொற்கள் மூலத்தின் கவன ஈர்ப்பு மற்றும் ஒழுக்கரீதியான தீவிரத்தைப் பாதுகாக்கின்றன. கட்டளையின் பன்மை மரியாதை வடிவம் தமிழில் இயல்பாக இருப்பதால் ‘கொண்டுவாருங்கள்’ பயன்படுத்தப்பட்டுள்ளது.
