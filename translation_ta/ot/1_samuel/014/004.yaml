  text: וּ/בֵ֣ין הַֽ/מַּעְבְּר֗וֹת אֲשֶׁ֨ר בִּקֵּ֤שׁ יֽוֹנָתָן֙ לַֽ/עֲבֹר֙ עַל מַצַּ֣ב פְּלִשְׁתִּ֔ים שֵׁן הַ/סֶּ֤לַע מֵ/הָ/עֵ֨בֶר֙ מִ/זֶּ֔ה וְ/שֵׁן הַ/סֶּ֥לַע מֵ/הָ/עֵ֖בֶר מִ/זֶּ֑ה וְ/שֵׁ֤ם הָֽ/אֶחָד֙ בּוֹצֵ֔ץ וְ/שֵׁ֥ם הָ/אֶחָ֖ד סֶֽנֶּה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/004.yaml
  text: Between the passes by which Jonathan sought to cross over to the Philistine garrison[a], there was a crag of rock on one side and a crag of rock on the other side; and the name of the one was Bozez, and the name of the other Seneh.
translation:
  language: ta
  text: யோனத்தான் பெலிஸ்தியரின் காவலரணுக்குக் கடந்து செல்ல முயன்ற கணவாய்களுக்கு நடுவே, ஒரு பக்கத்தில் ஒரு பாறைமுனையும்[a] மறுபக்கத்தில் ஒரு பாறைமுனையும் இருந்தன. ஒன்றின் பெயர் போசேஸ்; மற்றொன்றின் பெயர் சேனே.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொல்லுக்கு சொல், “பாறையின் பல்.” இது வெளியே நீட்டிக்கொண்டிருக்கும் கூரான பாறைமுனையைக் குறிக்கும் உருவகம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּעְבְּרוֹת
  choice: கணவாய்கள்
  rationale: பாறைகள் சூழ்ந்த நிலப்பரப்பில் கடந்து செல்லக்கூடிய குறுகிய வழிகளைக் குறிக்கும் சொல்லாக, நீர்நிலைக் கடப்பைக் குறிப்பதாகத் தவறாகப் புரியாமல் இயல்பாக மொழிபெயர்க்கிறது.
- source_word: בִּקֵּשׁ ... לַעֲבֹר
  choice: கடந்து செல்ல முயன்ற
  rationale: யோனத்தானின் நோக்கத்தையும் செயல்முயற்சியையும் காக்கிறது; வெறும் விருப்பமாகக் குறுக்கவில்லை.
- source_word: מַצַּב פְּלִשְׁתִּים
  choice: பெலிஸ்தியரின் காவலரண்
  rationale: இராணுவச் சூழலில் நிறுத்தப்பட்ட படையினர் காக்கும் நிலையையோ புறக்காவல் அரணையையோ இயல்பான தமிழில் குறிக்கிறது.
- source_word: שֵׁן הַסֶּלַע
  choice: பாறைமுனை
  rationale: சொல்லுக்கு சொல் பொருள் ‘பாறையின் பல்’; இங்கு நீட்டியோ கூர்மையாகவோ நிற்கும் பாறை அமைப்பைக் குறிக்கும் உருவகத்தை வாசகருக்குப் புரியும் தமிழில் தருகிறது.
- source_word: מֵהָעֵבֶר מִזֶּה ... מֵהָעֵבֶר מִזֶּה
  choice: ஒரு பக்கத்தில் ... மறுபக்கத்தில்
  rationale: கணவாயின் எதிரெதிர்ப் பக்கங்களில் இருந்த இரு பாறை அமைப்புகளையும் தெளிவாகக் காட்டுகிறது.
- source_word: שֵׁם הָאֶחָד ... וְשֵׁם הָאֶחָד
  choice: ஒன்றின் பெயர் ... மற்றொன்றின் பெயர்
  rationale: எபிரெய மொழியின் இணையான பெயரிடும் அமைப்பைப் படிக்க எளிய தமிழில் காக்கிறது.
- source_word: בּוֹצֵץ
  choice: போசேஸ்
  rationale: எபிரெய இடப்பெயரின் ஒலிப்பெயர்ப்பு.
- source_word: סֶנֶּה
  choice: சேனே
  rationale: எபிரெய இடப்பெயரின் ஒலிப்பெயர்ப்பு.
- source_word: וּבֵין
  choice: நடுவே
  rationale: இணைப்புச் சொல்லைத் தனியாக ‘இப்போது’ எனச் சேர்க்காமல், வாக்கியத்தின் இடவியல் உறவை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
