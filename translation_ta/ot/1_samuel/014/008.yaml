lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: என்றான்
  rationale: நேரடிக் கூற்றை அறிமுகப்படுத்தும் எபிரேயக் கதைநடை வடிவம்; தமிழில் கூற்றுக்குப் பின் வரும் ‘என்றான்’ இயல்பான நடை.
- source_word: יְהוֹנָתָן
  choice: யோனத்தான்
  rationale: எபிரேயப் பெயரின் வழக்கமான தமிழ் ஒலிபெயர்ப்பு.
- source_word: הִנֵּה
  choice: இதோ
  rationale: யோனத்தான் முன்வைக்கும் உடனடித் திட்டத்திற்குக் கவனத்தை ஈர்க்கும் இடைச்சொல்லின் உரையாடல் வலிமையைப் பேணுகிறது.
- source_word: אֲנַחְנוּ
  choice: நாம்
  rationale: வலியுறுத்தப்பட்ட முதல்நபர் பன்மைப் பெயர்ச்சொல்லை வெளிப்படையாகப் பேணுகிறது.
- source_word: עֹבְרִים
  choice: கடந்து போய்
  rationale: עבר என்பதன் கடந்து செல்லும் அசைவையும், உடனே மேற்கொள்ளப்படவிருக்கும் செயலையும் இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: אֶל הָאֲנָשִׁים
  choice: அந்த மனிதர்களிடம்
  rationale: சூழலில் ஏற்கெனவே காணப்படும் பெலிஸ்திய வீரர்களைக் குறிக்கும் வரையறுக்கப்பட்ட சொற்றொடர்; ‘அந்த’ என்பது குறிப்புத்தன்மையைத் தெளிவாக்குகிறது.
- source_word: וְנִגְלִינוּ
  choice: அவர்களுக்கு நம்மைக் காட்டுவோம்
  rationale: גלה என்பதன் நிஃபால் வடிவம் இங்கு தாங்களாகவே எதிரிகளின் பார்வைக்குத் தெரியப்படுத்திக்கொள்வதைக் குறிக்கிறது; இந்தத் தமிழ் வடிவம் நோக்கமுள்ள தன்-வெளிப்பாட்டை இயல்பாகத் தருகிறது.
- source_word: אֲלֵיהֶם
  choice: அவர்களுக்கு
  rationale: யாருடைய பார்வைக்கு அவர்கள் தங்களை வெளிப்படுத்தப் போகிறார்கள் என்பதைக் குறிக்கிறது.
