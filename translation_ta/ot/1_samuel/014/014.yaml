  yaml_path: translation/ot/1_samuel/014/014.yaml
  text: That first slaughter[a], which Jonathan and his armor-bearer made, was about twenty men within about half a furrow in an acre of a field.
translation:
  language: ta
  text: யோனத்தானும் அவனுடைய ஆயுததாரியும் நடத்திய அந்த முதல் தாக்குதலில் ஏறக்குறைய இருபது பேர் கொல்லப்பட்டனர்; அது ஓர் இணை மாடுகள் உழக்கூடிய வயலில் ஏறக்குறைய அரை உழவுச்சால் அளவுக்குள் நடந்தது.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயச் சொற்றொடர் சொல்லுக்குச் சொல், ‘ஓர் இணை மாடுகளுக்குரிய வயலின் ஏறக்குறைய அரை உழவுச்சால்’ என்று உள்ளது. இது ஓர் இணை மாடுகள் உழக்கூடிய நிலப்பரப்பை அடிப்படையாகக் கொண்ட பழங்கால அளவைக் குறிக்கலாம்; அதன் துல்லியமான பரப்பு உறுதியல்ல.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּכָּה הָרִאשֹׁנָה
  choice: முதலில் வெட்டி வீழ்த்தியவர்கள்
  rationale: மக்கா என்பது இப்போர்ச் சூழலில் உயிரிழப்பை ஏற்படுத்திய தாக்குதலைக் குறிக்கிறது. தமிழில் இயல்பாக இருக்கும்படி பெயர்ச்சொல் அமைப்பு வினை அமைப்பாக மாற்றப்பட்டுள்ளது; ‘வெட்டி வீழ்த்தியவர்கள்’ உயிர்க்கொலையின் பொருளையும் போர்ச் சூழலையும் தெரிவிக்கிறது.
- source_word: וְנֹשֵׂא כֵלָיו
  choice: அவனுடைய ஆயுததாரி
  rationale: ஒரு போர்வீரனின் ஆயுதங்களைச் சுமந்து உடன் செல்லும் உதவியாளரைக் குறிக்கும் வழக்கமான இராணுவப் பதவி.
- source_word: כְעֶשְׂרִים אִישׁ
  choice: ஏறக்குறைய இருபது பேர்
  rationale: முன்னொட்டு כְּ காட்டும் தோராயமான எண்ணிக்கையைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: כְבַחֲצִי מַעֲנָה
  choice: ஏறக்குறைய அரை உழவுச்சால் அளவுக்குள்
  rationale: מַעֲנָה என்பதன் உழவு சார்ந்த ‘சால்/உழுத தடம்’ என்ற படிமத்தையும், כְּ காட்டும் தோராயத்தையும் பாதுகாக்கிறது.
- source_word: צֶמֶד שָׂדֶה
  choice: ஓர் இணை மாடுகள் உழக்கூடிய நிலம்
  rationale: צֶמֶד என்பதன் அடிப்படைப் பொருளான இணை அல்லது நுகத்தடி பூட்டப்பட்ட மாட்டுச் சோடியை நில அளவுடன் தொடர்புபடுத்துகிறது; நவீன ஏக்கர் அளவை மூலத்தில் இல்லாமல் இறக்குமதி செய்வதைத் தவிர்க்கிறது.
