base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/006.yaml
  text: Then Jonathan said to the young man who carried his armor[a], “Come, let us cross over to the garrison of these uncircumcised men. Perhaps Yahweh will act for us[c][b], for nothing can hinder Yahweh from saving by many or by few.”
translation:
  language: ta
  text: அப்போது யோனத்தான் தன் ஆயுதங்களைச் சுமந்த இளைஞனிடம், “வா, விருத்தசேதனம் செய்யப்படாத இந்த மனிதர்களின்[b] காவல் நிலையத்துக்கு[a] நாம் கடந்து போவோம். ஒருவேளை யாவே நமக்காகச் செயல்படுவார். ஏனெனில், பலராலோ சிலராலோ காப்பாற்றுவதற்கு யாவேக்கு எந்தத் தடையும் இல்லை[c],” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது “புறக்காவல் நிலையம்.”
    reason: lexical_alternative
  - marker: b
    text: 'சொல்லுக்குச் சொல்: “விருத்தசேதனம் செய்யப்படாத இவர்கள்”; இது உடன்படிக்கை சார்ந்த இகழ்ச்சித் தொனியுள்ள சொற்றொடர்.'
    reason: cultural_note
  - marker: c
    text: அல்லது “காப்பாற்றுவதில் யாவேக்கு எந்தக் கட்டுப்பாடும் இல்லை.”
    reason: lexical_alternative
lexical_decisions:
- source_word: נֹשֵׂא כֵלָיו
  choice: தன் ஆயுதங்களைச் சுமந்த இளைஞன்
  rationale: எபிரெயப் பங்கேற்புவினைத் தொடர், யோனத்தானின் போர்க்கருவிகள் அல்லது ஆயுதங்களைச் சுமப்பவனை நேரடியாகக் குறிக்கிறது. மரபுவழிப் பதவிப்பெயரைவிட இந்த முழுத் தொடர் நவீனத் தமிழில் தெளிவாக உள்ளது.
- source_word: לְכָה וְנַעְבְּרָה
  choice: வா, நாம் கடந்து போவோம்
  rationale: கட்டளையும் விருப்பத்தை வெளிப்படுத்தும் வினைவடிவமும் இணைந்து அழைப்பையும் உறுதியையும் காட்டுகின்றன. சூழலின் நிலப்பரப்பு சார்ந்த நகர்வை ‘கடந்து போவோம்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: מַצַּב
  choice: காவல்நிலை
  rationale: இராணுவச் சூழலில் இது பெலிஸ்தியரின் பாதுகாப்பு அல்லது காவல் நிலையைச் சுட்டுகிறது. ‘புறக்காவல் நிலையம்’ என்பதும் சாத்தியம் என்பதால் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: הָעֲרֵלִים
  choice: விருத்தசேதனம் செய்யப்படாத இந்த மனிதர்கள்
  rationale: பெயர்ச்சொல்லாகப் பயன்படுத்தப்பட்ட பெயரடைச் சொல்லின் நேரடிப் பொருளையும், உடன்படிக்கை சார்ந்த இகழ்ச்சித் தொனியையும் இனப்பெயராக மாற்றாமல் பாதுகாக்கிறது.
- source_word: אוּלַי
  choice: ஒருவேளை
  rationale: யோனத்தான் நம்பிக்கையை வெளிப்படுத்தினாலும் முடிவை முன்கூட்டியே உறுதிப்படுத்தவில்லை; மூலத்தின் ஐயநிலையை இந்தச் சொல் காக்கிறது.
- source_word: יַעֲשֶׂה יְהוָה לָנוּ
  choice: யாவே நமக்காகச் செயல்படுவார்
  rationale: ‘செய்’ என்ற பரந்த பொருளுடைய வினை இச்சூழலில் தெய்வீகத் தலையீட்டைக் குறிக்கிறது. தலையீட்டின் தன்மையை மிகையாகக் குறிப்பாக்காமல் ‘செயல்படுவார்’ என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: יְהוָה
  choice: யாவே
  rationale: மூலத்தில் வரும் கடவுளின் தனிப்பெயரை ஒரு பட்டப்பெயரால் மாற்றாமல், நவீனத் தமிழில் தெளிவான ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: מַעְצוֹר
  choice: எந்தத் தடையும் இல்லை
  rationale: இந்தப் பெயர்ச்சொல் தடை, கட்டுப்பாடு அல்லது முட்டுக்கட்டையைக் குறிக்கிறது. தமிழ் வாக்கியத்தில் இயல்பாகவும் மூலத்தின் கருத்தை நேரடியாகவும் வெளிப்படுத்துகிறது.
- source_word: לְהוֹשִׁיעַ
  choice: காப்பாற்றுவதற்கு
  rationale: இங்கு இராணுவ ஆபத்திலிருந்து விடுவித்தல் முதன்மையான சூழல்; ‘காப்பாற்று’ அந்தப் பொருளையும் வேர்ச்சொல்லின் பரந்த வேதாகமப் பயன்பாட்டையும் தாங்குகிறது.
- source_word: בְּרַב אוֹ בִמְעָט
  choice: பலரைக் கொண்டோ சிலரைக் கொண்டோ
  rationale: கடவுள் பயன்படுத்தும் மனிதர்களின் எண்ணிக்கையை எதிரெதிராக நிறுத்தும் சொற்றொடரை இயல்பான தமிழில் காக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: வசனத்தில் நான்கெழுத்து இறைப்பெயர் நேரடியாக உள்ளது. அதை பொதுப் பட்டப்பெயராக மாற்றாமல் தனிப்பெயராகப் பாதுகாக்கிறது.
- issue: אוּלַי காட்டும் நிச்சயமின்மை
  choice: ஒருவேளை யாவே நமக்காகச் செயல்படுவார்
  alternative: யாவே நிச்சயமாக நமக்காகச் செயல்படுவார்
  rationale: யோனத்தானின் நம்பிக்கையோடு இணைந்த நிச்சயமின்மையை மூலவாக்கியம் வெளிப்படையாக வைத்திருக்கிறது; அதை உறுதியான வாக்குறுதியாக மாற்றவில்லை.
- issue: הָעֲרֵלִים என்பதன் உடன்படிக்கை சார்ந்த இகழ்ச்சித் தொனி
  choice: விருத்தசேதனம் செய்யப்படாத இந்த மனிதர்கள்
  alternative: இந்தப் பெலிஸ்தியர்கள்
  rationale: மூலம் இனப்பெயரைப் பயன்படுத்தவில்லை. உடன்படிக்கையின் அடையாளத்தை மையப்படுத்தும் அதன் கூர்மையான சொல்லாட்சியை மொழிபெயர்ப்பு பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டுள்ளது. இராணுவச் சூழல் தெளிவாக இருக்க ‘ஆயுதங்கள்’, ‘காவல்நிலை’, ‘காப்பாற்று’ ஆகிய சொற்கள் பயன்படுத்தப்பட்டுள்ளன. மூலத்தின் நிச்சயமின்மையும் உடன்படிக்கை சார்ந்த பதற்றமும் மென்மைப்படுத்தப்படவில்லை.
