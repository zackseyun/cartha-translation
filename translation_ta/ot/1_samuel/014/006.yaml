  to: அப்போது யோனத்தான் தன் ஆயுதங்களைச் சுமந்த இளைஞனிடம், “வா, விருத்தசேதனம் செய்யப்படாத இந்த மனிதர்களின்[b] காவல் நிலையத்துக்கு[a] நாம் கடந்து போவோம். ஒருவேளை யாவே நமக்காகச் செயல்படுவார். ஏனெனில், பலராலோ சிலராலோ காப்பாற்றுவதற்கு யாவேக்கு எந்தத் தடையும் இல்லை[c],” என்றான்.
  rationale: 'The revision makes one limited idiomatic correction: பலராலோ சிலராலோ accurately and naturally renders the Hebrew contrast of means or agents, ''by many or by few.'' The original''s uncertainty, military setting, covenantal reproach, and use of the divine name remain intact. Footnote anchors and all three supporting notes are retained.'
