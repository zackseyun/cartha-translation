base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/028.yaml
  text: Then one of the people answered and said[a], “Your father strictly put the people under oath, saying[b], ‘Cursed is the man who eats food today.’ So the people were faint.”
translation:
  language: ta
  text: அப்போது மக்களில் ஒருவன் பதிலளித்து, “உன் தந்தை மக்களைக் கடுமையாகச் சத்தியம் செய்ய வைத்து, ‘இன்று உணவு[a] உண்கிறவன் சபிக்கப்பட்டவன்’ என்று கூறினார்” என்றான். மக்கள் சோர்ந்துபோனார்கள்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரேயத்தில் ‘அப்பம்’; இங்கே பொதுவாக உணவைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘மக்கள் களைத்துப்போனார்கள்’ / ‘மக்கள் மிகவும் தளர்ந்துபோனார்கள்.’
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעַן
  choice: மறுமொழியாக ... என்றார்
  rationale: உரையாடலில் பதிலளிப்பதைக் குறிக்கும் எபிரெயக் கதைநடை மரபை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: אִישׁ מֵהָעָם
  choice: மக்களில் ஒருவர்
  rationale: மக்கள் அல்லது படைவீரர்கள் நடுவிலிருந்த பெயர் குறிப்பிடப்படாத ஒரே நபர் பேசினார் என்ற பொருளை இயல்பாகத் தருகிறது.
- source_word: הַשְׁבֵּעַ הִשְׁבִּיעַ
  choice: கண்டிப்பாகச் சத்தியம் வாங்கி
  rationale: வினையெச்ச முற்றுருவுடன் வந்த வினையின் வலியுறுத்தலையும், பிறரைச் சத்தியத்திற்குக் கட்டுப்படுத்தும் காரணவினைப் பொருளையும் காக்கிறது.
- source_word: אָבִיךָ
  choice: உன் தந்தை
  rationale: யோனத்தானை நோக்கிய நேரடி ஒருமை அழைப்பைத் தெளிவாகக் காக்கிறது.
- source_word: אָרוּר
  choice: சபிக்கப்பட்டவன்
  rationale: தீர்ப்பும் கட்டுப்பாடும் கொண்ட சாபச் சூத்திரத்தின் வலிமையை நவீனத் தமிழில் காக்கிறது.
- source_word: הָאִישׁ אֲשֶׁר יֹאכַל
  choice: உண்கிறவன்
  rationale: எபிரெயின் ஆண்பால் ஒருமை வடிவத்தையும், பொதுவாக எவரையும் குறிக்கும் சாபச் சொல்லமைப்பையும் சுருக்கமாகப் பிரதிபலிக்கிறது.
- source_word: לֶחֶם
  choice: உணவு
  rationale: சொல்லின் நேரடிப் பொருள் ‘அப்பம்’ என்றாலும், சுற்றியுள்ள நிகழ்வில் தேனும் உட்பட எந்த ஊட்ட உணவையும் குறிக்கும் விரிவான பொருள் இங்கு பொருந்துகிறது.
- source_word: הַיּוֹם
  choice: இன்று
  rationale: நேரடி உரையில் இயல்பான நவீனத் தமிழ் காலச்சொல்.
- source_word: וַיָּעַף
  choice: சோர்ந்துபோனார்கள்
  rationale: உணவு உண்ணாததால் ஏற்பட்ட களைப்பு அல்லது தளர்ச்சியை இயல்பாக வெளிப்படுத்துகிறது; மயங்கிவிட்டார்கள் என்று அளவுக்கு மீறிக் குறிப்பிடவில்லை.
- source_word: הָעָם
  choice: மக்கள்
  rationale: சூழலில் படைவீரர்களைக் குறித்தாலும், எபிரெயின் பொதுவான சொல்லை வெளிப்படையாகக் காக்கிறது.
