  source_fidelity: 'மூல எபிரெயத்தின் முக்கிய கூறுகள் சரியாக உள்ளன: மக்களில் ஒருவன் பேசுவது, யோனத்தானின் தந்தை மக்களைச் சத்தியத்திற்குக் கட்டுப்படுத்தியது, உண்பவன்மேல் சாபம், மக்கள் தளர்ந்த நிலை ஆகியவை காக்கப்பட்டுள்ளன. இருப்பினும், ‘அதனால்’ என்பது எபிரெய வாக்கியத்தில் வெளிப்படையாக இல்லாத காரண-விளைவு இணைப்பைச் சற்றே வலுப்படுத்துகிறது; அதைத் தவிர்ப்பது நன்று.'
