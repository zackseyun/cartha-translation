  register: நவீன நிலையான தமிழில், எளிதில் புரியக்கூடிய ஆனால் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. சத்தியத்தின் வலியுறுத்தல் ‘கண்டிப்பாக’ என்பதாலும், காரணவினைப் பொருள் ‘சத்தியம் வாங்கி’ என்பதாலும் தெரிவிக்கப்பட்டுள்ளது. ‘உணவு’ மற்றும் ‘சோர்ந்துபோனார்கள்’ ஆகியவற்றின் மூலமொழி நுணுக்கங்கள் அடிக்குறிப்புகளில் வெளிப்படையாகக் கொடுக்கப்பட்டுள்ளன.
