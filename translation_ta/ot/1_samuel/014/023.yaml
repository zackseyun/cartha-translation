  text: So Yahweh saved Israel that day[a], and the battle passed beyond Beth-aven.
translation:
  language: ta
  text: அன்று யாவே இஸ்ரவேலைக் காப்பாற்றினார்; போர் பெத்-ஆவேனைக் கடந்து சென்றது.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “போர் பெத்-ஆவேனைத் தாண்டி முன்னேறியது” அல்லது “பெத்-ஆவேனுக்கு அப்பால் சென்றது.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹשַׁע
  choice: காப்பாற்றினார்
  rationale: ישׁע என்பதன் ஹிஃபில் வடிவம் விடுவித்தல் அல்லது வெற்றி அளித்தல் என்ற பொருளைக் கொண்டது. இங்கு யாவே செய்பவராக இருப்பதையும் சொல்லின் பரந்த மீட்பு உணர்வையும் இயல்பான நவீன தமிழில் ‘காப்பாற்றினார்’ தக்கவைக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இது இறைவனின் தனிப்பெயரான நான்கெழுத்துப் பெயர்; பட்டப்பெயரால் மாற்றாமல் தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: בַּיּוֹם הַהוּא
  choice: அன்று
  rationale: ‘அந்த நாளில்’ என்பதன் இயல்பான, சுருக்கமான தமிழாக்கம்.
- source_word: אֶת יִשְׂרָאֵל
  choice: இஸ்ரவேலை
  rationale: நேரடிச் செயப்படுபொருளாக வரும் தேசியப் பெயர்; இச்சூழலில் இஸ்ரவேல் மக்களை ஒட்டுமொத்தமாகக் குறிக்கிறது.
- source_word: וְהַמִּלְחָמָה
  choice: போர்
  rationale: מִלְחָמָה போர் அல்லது சண்டையைக் குறிக்கலாம்; இங்கு நடைபெற்றுக்கொண்டிருக்கும் குறிப்பிட்ட போர்மோதலுக்கு ‘போர்’ பொருத்தமானது.
- source_word: עָבְרָה
  choice: தொடர்ந்தது
  rationale: עבר என்பதன் கடந்து செல்லுதல் அல்லது அப்பால் செல்லுதல் என்ற இடமாற்றப் பொருள், ‘அப்பாலும்’ என்பதுடன் இணைந்து போரின் நகர்வை இயல்பான தமிழில் தெரிவிக்கிறது; அதன் நேரடியான மாற்று அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: אֶת בֵּית אָוֶן
  choice: பெத்-ஆவேனுக்கு அப்பாலும்
  rationale: עבר உடன் வரும் אֶת, கடந்து செல்லப்பட்ட இடத்தைக் குறிக்கலாம். போர் அந்த இடத்தையும் தாண்டிச் சென்றது என்ற சாத்தியமான பொருளை இது தருகிறது; கட்டமைப்பின் தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூலத்தில் பட்டப்பெயர் அல்ல, இறைவனின் தனிப்பெயரே நேரடியாக உள்ளது. ஆகவே அதை பட்டப்பெயரால் மாற்றாமல் ஒலிபெயர்ப்பது மூலத்தின் வேறுபாட்டைப் பாதுகாக்கிறது.
- issue: וַיּוֹשַׁע என்பதில் யாவேயின் செயலைக் கூறுதல்
  choice: காப்பாற்றினார்
  alternative: வெற்றி அளித்தார்
  rationale: ‘வெற்றி அளித்தார்’ போர்ச் சூழலைத் தெளிவாக்கினாலும், மூல வினையின் விடுதலை/மீட்பு சார்ந்த பரந்த பொருளைச் சுருக்கிவிடும். ‘காப்பாற்றினார்’ அந்த இறையியல் நிறையையும் செய்பவர் யாவே என்பதையும் தக்கவைக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சுருக்கமான வரலாற்று நடையில் மொழிபெயர்க்கப்பட்டது. ‘அன்று’ மற்றும் ‘காப்பாற்றினார்’ ஆகியவை பொதுவாசகருக்கு இயல்பாக உள்ளன; பெத்-ஆவேனைச் சார்ந்த எபிரெயக் கட்டமைப்பின் இடவியல் தெளிவின்மை அடிக்குறிப்பில் வெளிப்படையாக வைக்கப்பட்டுள்ளது.
