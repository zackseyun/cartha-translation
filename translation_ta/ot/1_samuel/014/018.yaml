base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/018.yaml
  text: Then Saul said to Ahijah[b][a], “Bring the ark of God here,” for the ark of God was that day with the sons of Israel.
translation:
  language: ta
  text: 'அப்போது சவுல் அகியாவிடம், “கடவுளின் பெட்டியை இங்கே கொண்டுவா[a]” என்றான். ஏனெனில், அந்த நாளில் கடவுளின் பெட்டி இஸ்ரவேல் மக்களுடன் இருந்தது.[b]


    [a] சில மூலபாட மரபுகளில் “கடவுளின் பெட்டியைக் கொண்டுவா” என்பதற்குப் பதிலாக, “ஏபோத்தைக் கொண்டுவா” என்ற வாசகம் உள்ளது; சில விளக்கவுரையாளர்களும் இந்த வாசகத்தை ஏற்கின்றனர். இங்குள்ள எபிரெய மூலபாடத்தில் “கடவுளின் பெட்டி” என்றே உள்ளது.


    [b] “அந்த நாளில் கடவுளின் பெட்டி அங்கே இஸ்ரவேல் மக்களுடன் இருந்தது” என்றும் மொழிபெயர்க்கலாம்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சில மூலபாட மரபுகளில் “கடவுளின் பெட்டியைக் கொண்டுவா” என்பதற்குப் பதிலாக, “ஏபோத்தைக் கொண்டுவா” என்ற வாசகம் உள்ளது; சில விளக்கவுரையாளர்களும் இந்த வாசகத்தை ஏற்கின்றனர். இங்குள்ள எபிரெய மூலபாடத்தில் “கடவுளின் பெட்டி” என்றே உள்ளது.
    reason: textual_variant
  - marker: b
    text: “அந்த நாளில் கடவுளின் பெட்டி அங்கே இஸ்ரவேல் மக்களுடன் இருந்தது” என்றும் மொழிபெயர்க்கலாம்.
    reason: previous_rendering
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: அப்போது ... என்றான்
  rationale: வாவ் தொடர்வினை கதையின் அடுத்த நிகழ்வை முன்னெடுக்கிறது; நவீன தமிழில் இயல்பான நிகழ்வுத் தொடரை ‘அப்போது’ வெளிப்படுத்துகிறது.
- source_word: לַאֲחִיָּה
  choice: அகியாவிடம்
  rationale: தனிப்பெயர் எபிரெய ஒலிப்புக்கு நெருக்கமாகத் தமிழில் எழுத்துப்பெயர்க்கப்பட்டது.
- source_word: הַגִּישָׁה
  choice: இங்கே கொண்டுவா
  rationale: ஹிஃபில் கட்டளை வடிவம் ‘அருகில் கொண்டுவா/முன்வை’ என்ற பொருளுடையது; நேரடிக் கட்டளையில் ‘இங்கே கொண்டுவா’ இயல்பாக உள்ளது.
- source_word: אֲרוֹן הָאֱלֹהִים
  choice: கடவுளின் பெட்டி
  rationale: மூலத்தில் ‘கடவுளின் உடன்படிக்கைப் பெட்டி’ என்று அல்லாமல் ‘கடவுளின் பெட்டி’ என்றே உள்ளது; தேவையற்ற விரிவாக்கம் தவிர்க்கப்பட்டது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: சவுலின் கட்டளைக்கான பின்னணியை விளக்கும் உரையாளர் கூற்றை அறிமுகப்படுத்துகிறது.
- source_word: הָיָה
  choice: இருந்தது
  rationale: இருப்பு அல்லது உடனிருப்பைக் குறிக்கும் பொதுவான வினை; இடத்தைக் குறிக்கும் பொருள் தொடரிலிருந்து தெளிவாகிறது.
- source_word: בַּיּוֹם הַהוּא
  choice: அந்த நாளில்
  rationale: எபிரெய காலக் குறிப்பின் நேரடியான, இயல்பான தமிழ் வடிவம்.
- source_word: וּבְנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்களுடன்
  rationale: ‘இஸ்ரவேலின் பிள்ளைகள்’ என்ற சொற்சொல் வடிவத்தை நவீன தமிழில் இயல்பாகவும் கூட்டுறவுப் பொருளைத் தக்கவைத்தும் வழங்குகிறது.
theological_decisions:
- issue: ‘கடவுளின் பெட்டி’ என்பதற்குப் பதிலாக ‘ஏபோத்’ என்ற மூலபாட வேறுபாடு
  choice: கடவுளின் பெட்டி
  alternative: ஏபோத்
  rationale: கொடுக்கப்பட்ட WLC எபிரெய மூலபாடம் இவ்வசனத்தில் இருமுறையும் ‘கடவுளின் பெட்டி’ என்றே வாசிக்கிறது. வேறு மூலபாட மரபின் வாசகம் முதன்மை உரையில் ஏற்கப்படாமல் அடிக்குறிப்பில் பாதுகாக்கப்பட்டது.
- issue: இறுதிக் கூற்றிலுள்ள இடப்பொருளின் மறைமுகத் தன்மை
  choice: அந்த நாளில் ... இஸ்ரவேல் மக்களுடன் இருந்தது
  alternative: அந்த நாளில் ... அங்கே இஸ்ரவேல் மக்களுடன் இருந்தது
  rationale: ‘அங்கே’ என்பது எபிரெயத்தில் வெளிப்படையாக இல்லை; இருப்பினும் சூழலிலிருந்து இடப்பொருளாகப் புரிந்துகொள்ள முடிவதால் மாற்று மொழிபெயர்ப்பு அடிக்குறிப்பில் தரப்பட்டது.
translation_notes:
  register: நவீன செந்தமிழ் சார்ந்த, பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டது. ‘அருட்பேழை’ போன்ற மரபுசார் சிறப்புச் சொல்லுக்குப் பதிலாக மூலத்தின் எளிய ‘பெட்டி’ தக்கவைக்கப்பட்டது; ‘இஸ்ரவேலின் பிள்ளைகள்’ என்பதற்குப் பதிலாக இயல்பான ‘இஸ்ரவேல் மக்கள்’ பயன்படுத்தப்பட்டது.
