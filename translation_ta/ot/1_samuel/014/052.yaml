translation_notes:
  register: நவீன நிலையான தமிழில் எளிமையும் கண்ணியமும் கொண்ட நடை பயன்படுத்தப்பட்டுள்ளது. ‘சவுலின் காலம் முழுவதும்’ என்பது வாழ்நாள் அல்லது ஆட்சிக்காலம் என்ற சாத்தியங்களைத் தேவையின்றி ஒன்றாக முடிவுசெய்யாமல் மூலத்தின் காலவிரிவைக் காக்கிறது; ஆட்சேர்ப்பு பற்றிய மறைபொருள் அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது.
