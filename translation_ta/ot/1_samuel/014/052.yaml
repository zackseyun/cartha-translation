  text: וַ/תְּהִ֤י הַ/מִּלְחָמָה֙ חֲזָקָ֣ה עַל פְּלִשְׁתִּ֔ים כֹּ֖ל יְמֵ֣י שָׁא֑וּל וְ/רָאָ֨ה שָׁא֜וּל כָּל אִ֤ישׁ גִּבּוֹר֙ וְ/כָל בֶּן חַ֔יִל וַ/יַּאַסְפֵ֖/הוּ אֵלָֽי/ו־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/052.yaml
  text: And the war against the Philistines was severe all the days of Saul[a]. Whenever Saul saw any mighty man or any valiant man[c][b], he gathered him to himself.
translation:
  language: ta
  text: சவுலின் காலம் முழுவதும் பெலிஸ்தியருக்கு எதிரான போர் கடுமையாக இருந்தது.[a] வலிமைமிக்க வீரனையோ துணிவும் திறமையும் உள்ளவனையோ[b] சவுல் காணும்போதெல்லாம், அவனைத் தன்னிடம் சேர்த்துக்கொண்டான்.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘கடுமையாக’ என்பதற்கு ‘தீவிரமாக’ அல்லது ‘கடினமாக’ என்றும் மொழிபெயர்க்கலாம்; எபிரெயச் சொல் நேரடியாக ‘வலிமையான’ என்று பொருள்படும்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில் சொற்சொல்லாக, ‘வலிமைமிக்க எந்த மனிதனையும், வீரத்தின் எந்த மகனையும்.’
    reason: lexical_alternative
  - marker: c
    text: அதாவது, சவுல் அத்தகையவர்களைத் தனது படைச் சேவையில் சேர்த்துக்கொண்டான்.
    reason: cultural_note
lexical_decisions:
- source_word: וַתְּהִי הַמִּלְחָמָה
  choice: போர் ... இருந்தது
  rationale: இது ஒரு தனிப் போரைக் காட்டிலும் தொடர்ந்து நீடித்த போர் நிலையைக் குறிக்கிறது; எபிரெயக் கதைத் தொடரை இயல்பான தமிழ் இறந்தகால வாக்கியமாக வழங்குகிறது.
- source_word: חֲזָקָה
  choice: கடுமையாக
  rationale: அடிப்படைப் பொருள் ‘வலிமையானது’ என்றாலும், நீடித்த போரின் தீவிரத்தையும் கடினத்தன்மையையும் நவீன தமிழில் ‘கடுமையாக’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: עַל פְּלִשְׁתִּים
  choice: பெலிஸ்தியருக்கு எதிரான
  rationale: போர் செய்யப்படும் எதிர்த்தரப்பை עַל குறிக்கிறது.
- source_word: כֹּל יְמֵי שָׁאוּל
  choice: சவுலின் காலம் முழுவதும்
  rationale: ‘சவுலின் எல்லா நாட்களிலும்’ என்ற எபிரெய மரபுத்தொடரின் காலநீட்சியை இயல்பாகக் காட்டுகிறது; வாழ்நாளா ஆட்சிக்காலமா என்பதை தேவையின்றித் துல்லியப்படுத்தவில்லை.
- source_word: וְרָאָה
  choice: காணும்போதெல்லாம்
  rationale: இங்கு சவுலின் வழக்கமான, மீண்டும் மீண்டும் நிகழ்ந்த செயலைத் தொடர்ந்து வரும் வினையுடன் இணைத்துக் காட்டுகிறது.
- source_word: כָּל אִישׁ גִּבּוֹר
  choice: வலிமைமிக்க வீரனையோ
  rationale: גִּבּוֹר என்பதன் வலிமை மற்றும் போர்வீரத் தன்மை ஆகிய இரு நுணுக்கங்களையும் காக்கிறது.
- source_word: וְכָל בֶּן חַיִל
  choice: துணிவும் திறமையும் உள்ளவனையோ
  rationale: בֶּן חַיִל என்பது சொற்சொல்லாக ‘வீரத்தின் மகன்’; இச்சூழலில் துணிவு, திறன், போருக்கான தகுதி கொண்ட ஒருவனைக் குறிக்கும் மரபுத்தொடர்.
- source_word: וַיַּאַסְפֵהוּ אֵלָיו
  choice: அவனைத் தன்னிடம் சேர்த்துக்கொண்டான்
  rationale: ‘தன்னிடமாக அவனைச் சேர்த்தான்’ என்ற மூலத்தின் உருவகத்தை இயல்பான தமிழில் காத்து, சவுல் அத்தகையவர்களைத் தனது படைச் சேவையில் இணைத்த கருத்தையும் உணர்த்துகிறது.
