base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/030.yaml
  text: How much more if the people had eaten today from the spoil of their enemies that they found! For then the slaughter among the Philistines would have been much greater[a].
translation:
  language: ta
  text: மக்கள் இன்று தாங்கள் கண்ட தங்கள் எதிரிகளின் கொள்ளைப் பொருளிலிருந்து உண்டிருந்தால், இப்போது பெலிஸ்தியர்மேல் விழுந்த அடி இன்னும் பெரிதாக இருந்திருக்காதா![a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது: “மக்கள் இன்று தாங்கள் கண்ட தங்கள் எதிரிகளின் கொள்ளைப் பொருளிலிருந்து உண்டிருந்தால், பெலிஸ்தியர்களிடையே ஏற்பட்ட அழிவு இன்னும் அதிகமாக இருந்திருக்கும்!”'
    reason: אַף כִּי לוּא என்பதன் வலியுறுத்தும் எதிர்நிலைத் தொடக்கத்தையும், בַּפְּלִשְׁתִּים என்பதனை ‘பெலிஸ்தியர்களிடையே’ எனப் புரிந்துகொள்ளும் மாற்றையும் காட்டுகிறது.
lexical_decisions:
- source_word: אַף כִּי לוּא
  choice: இன்னும் எவ்வளவு பெரிய ... இருந்திருக்கும்
  rationale: இந்தச் சொற்றொடர் நிகழாத ஒரு நிபந்தனையின் விளைவு இன்னும் பெரிதாக இருந்திருக்கும் என்பதை வலியுறுத்துகிறது. தமிழில் இயல்பான அளவுவாத வியப்பாக மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: אָכֹל אָכַל
  choice: சாப்பிட்டிருந்தால்
  rationale: வினையெச்சப் பெயரும் முற்றுவினையும் இணைந்து உண்பதை வலியுறுத்துகின்றன. சூழலில் மக்கள் உணவே உட்கொள்ளாத நிலை முக்கியமானதால், ஆதாரத்தில் நேரடியாக இல்லாத ‘தாராளமாக’ என்பதைக் கூட்டாமல் இயல்பான எதிர்நிலை வடிவம் பயன்படுத்தப்பட்டது.
- source_word: מִשְּׁלַל אֹיְבָיו אֲשֶׁר מָצָא
  choice: தங்கள் எதிரிகளிடமிருந்து கைப்பற்றிய கொள்ளைப் பொருளில் இருந்ததை
  rationale: שָׁלָל போரில் கைப்பற்றப்பட்ட கொள்ளைப் பொருளைக் குறிக்கிறது. ஒருமை வடிவிலுள்ள கூட்டுப்பெயர் הָעָם தமிழில் இயல்பாகப் பன்மைக் கருத்துடன் தரப்பட்டுள்ளது.
- source_word: מַכָּה
  choice: அழிவு
  rationale: போர்ச் சூழலில் இச்சொல் தாக்குதல், தோல்வி அல்லது கொல்லப்பட்டோரின் பெருக்கைக் குறிக்கலாம். ‘அழிவு’ அதன் பரந்த இராணுவப் பொருளைப் பாதுகாக்கிறது; ‘படுகொலை’ என்பதைவிட குறைவாக விளக்கம்கூட்டுகிறது.
- source_word: לֹא רָבְתָה
  choice: இதைக் காட்டிலும் மிகுதியாக இருந்திருக்குமே
  rationale: எபிரெய மொழியில் மறுப்புச் சொல்லுடன் அமைந்துள்ள வினாவாக்கியத்தின் எதிர்நிலை வலிமையை இயல்பான தமிழ் வியப்புவாக்கியமாக வெளிப்படுத்துகிறது.
- source_word: בַּפְּלִשְׁתִּים
  choice: பெலிஸ்தியர்களிடையே
  rationale: בְּ இங்கு தாக்குதலின் பரப்பையோ இலக்கையோ குறிக்கலாம். ‘இடையே’ என்பது பெலிஸ்திய அணிகளுக்குள் ஏற்பட்ட அழிவை இயல்பாகக் காட்டுகிறது.
