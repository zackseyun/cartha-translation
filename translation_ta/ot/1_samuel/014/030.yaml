  register: நவீன பொதுத்தமிழில், போர்ச் சூழலுக்கேற்ற கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. மூலத்தின் எதிர்நிலை வாதமும் வியப்பின் வலிமையும் காக்கப்பட்டுள்ளன; தெளிவுக்காக முதல் கூறு தமிழில் விளைவை முன்வைக்கும் இயல்பான அமைப்பில் தரப்பட்டுள்ளது.
