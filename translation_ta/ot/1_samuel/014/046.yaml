  text: Then Saul went up from pursuing the Philistines[a], and the Philistines went to their own place.
translation:
  language: ta
  text: அப்போது சவுல் பெலிஸ்தியர்களைத் துரத்துவதை விட்டு விலகினார்[a]; பெலிஸ்தியர்களோ தங்கள் இடத்திற்குச் சென்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அப்போது சவுல் பெலிஸ்தியர்களைப் பின்தொடர்வதை நிறுத்தினார்.” எபிரெயத்தில் சொல்லுக்குச் சொல், “பெலிஸ்தியர்களுக்குப் பின்னாலிருந்து மேலே சென்றார்” என்று உள்ளது; இச்சூழலில் அது துரத்துதலை நிறுத்தி விலகியதைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: திரும்பினார்
  rationale: עלה என்பதன் அடிப்படைப் பொருள் ‘மேலே போதல்’ என்றாலும், מֵאַחֲרֵי என்பதுடன் வரும் இப்போர்ச் சூழலில் துரத்துதலிலிருந்து விலகிச் செல்வதைச் சுட்டுகிறது. தமிழில் ‘மேலே சென்றார்’ என்பது இங்கு தவறான இடவியல் எண்ணத்தைத் தரக்கூடும்; ‘திரும்பினார்’ சூழல்சார் இயக்கத்தை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: מֵאַחֲרֵי
  choice: பெலிஸ்தியர்களைத் துரத்துவதை விட்டு
  rationale: சொல்லுக்குச் சொல் ‘பெலிஸ்தியர்களுக்குப் பின்னாலிருந்து’ எனினும், இராணுவச் சூழலில் அவர்களைத் தொடர்ந்து துரத்துவதை நிறுத்தியதாகும். ‘துரத்துவதை விட்டு’ அந்தப் பொருளைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: פְּלִשְׁתִּים
  choice: பெலிஸ்தியர்கள்
  rationale: இனக்குழுவின் பெயருக்கான தமிழில் பரவலாக அறியப்பட்ட வடிவம்.
- source_word: הָלְכוּ
  choice: சென்றார்கள்
  rationale: הלך என்பதன் நேரடிப் பொருள் ‘செல்/நட’. ‘திரும்பிச் சென்றார்கள்’ என்பது சூழலில் சாத்தியமானாலும், எபிரெய வினைச்சொல் அந்த நுட்பத்தைத் தனியாகக் கட்டாயப்படுத்தாததால் ‘சென்றார்கள்’ என மொழிபெயர்க்கப்படுகிறது.
- source_word: לִמְקוֹמָם
  choice: தங்கள் இடத்துக்கு
  rationale: מָקוֹם என்பது ‘இடம்’; மூன்றாம் நபர் ஆண்பால் பன்மை உடைமை விகுதி ‘தங்கள்’ எனத் தரப்பட்டுள்ளது. ‘வீட்டுக்கு’ என்பது மூலத்தைவிடக் குறிப்பானது.
