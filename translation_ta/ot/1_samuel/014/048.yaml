  yaml_path: translation/ot/1_samuel/014/048.yaml
  text: He fought valiantly and struck Amalek[c][b][a], and he delivered Israel from the hand of those who plundered it.
translation:
  language: ta
  text: அவன் வீரத்துடன் போரிட்டு[a] அமலேக்கை[b] தாக்கினான்; இஸ்ரவேலைக் கொள்ளையிட்டவனின் கையிலிருந்து[c] அதை விடுவித்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் ‘வீரம்/வலிமை செய்தான்’; இது வீரமாகச் செயல்பட்டதையோ படை வெற்றி பெற்றதையோ குறிக்கும் மொழிமரபு.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில் ‘அமலேக்’; இங்கு அமலேக்கிய மக்களை ஒட்டுமொத்தமாகக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: c
    text: எபிரெயத்தில் ‘அதைக் கொள்ளையிட்டவனின் கையிலிருந்து’ என்று ஒருமையில் உள்ளது; கூட்டுப் பெயரான ‘இஸ்ரவேல்’ காரணமாக இது கொள்ளையிட்டவர்களைக் கூட்டாகவும் குறிக்கலாம்.
