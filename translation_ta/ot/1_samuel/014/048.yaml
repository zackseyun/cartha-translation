lexical_decisions:
- source_word: וַיַּעַשׂ חַיִל
  choice: வீரத்துடன் போரிட்டு
  rationale: ‘வலிமை/வீரம் செய்தான்’ என்ற எபிரெய மொழிமரபு, இப்போர்ச் சூழலில் வீரமாகப் போரிட்டதையோ படை வெற்றி பெற்றதையோ குறிக்கிறது. தமிழில் இயல்பாகவும் சூழலுக்குப் பொருத்தமாகவும் ‘வீரத்துடன் போரிட்டு’ என மொழிபெயர்க்கப்பட்டது.
- source_word: וַיַּךְ
  choice: தாக்கினான்
  rationale: נכה என்பதற்கு ‘அடி, தாக்கு, முறியடி’ என்ற பொருள் வரம்பு உண்டு. ‘தாக்கினான்’ மூலத்தின் வினைப்படிமத்தைப் பாதுகாக்கிறது; முழுமையான அழிவையோ தீர்க்கமான வெற்றியையோ தேவையின்றி உறுதிப்படுத்துவதில்லை.
- source_word: עֲמָלֵק
  choice: அமலேக்கை
  rationale: மூலத்தில் மக்களினத்தைக் கூட்டாகக் குறிக்கும் ‘அமலேக்’ என்ற ஒருமைப் பெயரே உள்ளது. அதைப் பெயருருவிலேயே வைத்ததால் மூலவடிவம் பாதுகாக்கப்படுகிறது.
- source_word: וַיַּצֵּל
  choice: விடுவித்தான்
  rationale: Hiphil வடிவிலுள்ள נצל, ஒருவரை மற்றொருவரின் பிடியிலிருந்து மீட்பதையோ விடுவிப்பதையோ குறிக்கிறது. ‘விடுவித்தான்’ இங்கு இராணுவச் சூழலுக்கும் இயல்பான நவீன தமிழுக்கும் ஏற்றது.
- source_word: מִיַּד
  choice: கையிலிருந்து
  rationale: ‘கையிலிருந்து’ என்பது அதிகாரம் அல்லது பிடியிலிருந்து என்பதைக் குறிக்கும் எபிரெய உருவகத்தை நேரடியாகப் பாதுகாக்கிறது; தமிழிலும் புரிந்துகொள்ளத்தக்கது.
- source_word: שֹׁסֵהוּ
  choice: கொள்ளையிட்டவனின்
  rationale: இந்தப் பங்கேற்புவினை ‘கொள்ளையிடுகிறவன்/கொள்ளையிட்டவன்’ என்று பொருள்படும்; பின்னொட்டு இலக்கணப்படி ஒருமையாக இருந்து கூட்டுப் பெயரான ‘இஸ்ரவேல்’ என்பதைச் சுட்டுகிறது. மூலத்தின் ஒருமைத் தெளிவின்மையை உரையில் பாதுகாத்தோம்.
