source:
  edition: WLC
  text: וַ/יִּשְׁאַ֤ל שָׁאוּל֙ בֵּֽ/אלֹהִ֔ים הַֽ/אֵרֵד֙ אַחֲרֵ֣י פְלִשְׁתִּ֔ים הֲ/תִתְּנֵ֖/ם בְּ/יַ֣ד יִשְׂרָאֵ֑ל וְ/לֹ֥א עָנָ֖/הוּ בַּ/יּ֥וֹם הַ/הֽוּא׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/037.yaml
  text: Then Saul inquired of God[a], “Should I go down after the Philistines? Will you give them into the hand of Israel?” But he did not answer him that day.
translation:
  language: ta
  text: 'அப்போது சவுல் கடவுளிடம் விசாரித்தார்: “நான் பெலிஸ்தியர்களைப் பின்தொடர்ந்து இறங்கிப்போக வேண்டுமா? அவர்களை இஸ்ரவேலின் கையில் ஒப்புக்கொடுப்பீரா?[a]” ஆனால் அன்று அவர் சவுலுக்குப் பதில் அளிக்கவில்லை.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்களை இஸ்ரவேலின் அதிகாரத்தில் ஒப்படைப்பீரா?”
    reason: ‘கையில் கொடுத்தல்’ என்ற எபிரேய மரபுத்தொடரின் பொருளை உருவகமின்றி வெளிப்படுத்தும் மாற்று மொழிபெயர்ப்பு.
lexical_decisions:
- source_word: וַיִּשְׁאַל ... בֵּאלֹהִים
  choice: கடவுளிடம் விசாரித்தார்
  rationale: இது ஒரு சாதாரண கேள்வியைக் கேட்பதை அல்ல, கடவுளின் வழிகாட்டுதலை நாடுவதைச் சுட்டுகிறது. ‘விசாரித்தார்’ என்பது அந்த முறையான இறை ஆலோசனை நாடுதலைச் சுருக்கமாகத் தெரிவிக்கிறது.
- source_word: הַאֵרֵד
  choice: நான் ... இறங்கிப்போக வேண்டுமா?
  rationale: முதல் நபர் வினாவோடு வரும் இச்சொல், வழிகாட்டுதல் அல்லது அனுமதி நாடும் கேள்வியை வெளிப்படுத்துகிறது; அதேவேளை ירד என்பதன் ‘இறங்குதல்’ என்ற இயக்கத்தையும் மொழிபெயர்ப்பு காக்கிறது.
- source_word: אַחֲרֵי פְלִשְׁתִּים
  choice: பெலிஸ்தியர்களைப் பின்தொடர்ந்து
  rationale: אַחֲרֵי என்பதன் அடிப்படைப் பொருளான ‘பின்னால்/பின்தொடர்ந்து’ என்பதையும், இங்குள்ள இராணுவத் துரத்தல் சூழலையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: הֲתִתְּנֵם בְּיַד יִשְׂרָאֵל
  choice: அவர்களை இஸ்ரவேலின் கையில் ஒப்புக்கொடுப்பீரா?
  rationale: போர்ச் சூழலில் נתן ... ביד என்பது எதிரிகளை மற்றொருவரின் அதிகாரத்தில் ஒப்படைப்பதைக் குறிக்கும். ‘கையில் ஒப்புக்கொடுத்தல்’ மூலமொழியின் உருவகத்தையும் பொருளையும் காக்கிறது.
- source_word: וְלֹא עָנָהוּ
  choice: ஆனால் ... அவர் சவுலுக்குப் பதில் அளிக்கவில்லை
  rationale: சூழலில் மறைமுக எழுவாய் கடவுளைக் குறிக்கிறது. ‘அவர்’ என்று வைத்து எபிரேய உரையின் மறைமுகத்தன்மையை ஓரளவு காக்கவும், ‘சவுலுக்கு’ என்று செயப்படுபவரைத் தெளிவுபடுத்தவும் செய்யப்பட்டுள்ளது.
- source_word: בַּיּוֹם הַהוּא
  choice: அன்று
  rationale: ‘அந்த நாளில்’ என்பதன் இயல்பான, சுருக்கமான நவீனத் தமிழ் வடிவம்.
theological_decisions:
- issue: பதில் அளிக்காதவரின் மறைமுக எழுவாய்
  choice: ‘அவர்’ என்பது சூழலின்படி கடவுளைக் குறிக்கிறது; பெயர் மீண்டும் வெளிப்படையாகச் சேர்க்கப்படவில்லை.
  alternative: ‘ஆனால் அன்று கடவுள் சவுலுக்குப் பதில் அளிக்கவில்லை’ என்று எழுவாயை வெளிப்படையாக்குதல்.
  rationale: சவுல் கடவுளிடம் விசாரித்ததே உடனடி முன்னிலை என்பதால் கடவுளே பதில் அளிக்கவில்லை என்பது இயல்பான வாசிப்பு. இருப்பினும் எபிரேய உரை எழுவாயை வெளிப்படையாக மீண்டும் கூறாததால், மொழிபெயர்ப்பும் பெயரைச் சேர்த்து அந்த மறைமுகத்தன்மையை முற்றிலும் நீக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையைப் பயன்படுத்துகிறது. ‘கடவுள்’, ‘விசாரித்தார்’, ‘ஒப்புக்கொடுப்பீரா’ ஆகிய சொற்கள் தேவையற்ற சமயக்குழுச் சார்பைத் தவிர்த்து, மூலத்தின் இறை ஆலோசனை மற்றும் போர்ச் சூழலைத் தெளிவாகக் காட்டுகின்றன.
