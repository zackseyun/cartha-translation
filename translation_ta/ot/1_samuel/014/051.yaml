source:
  edition: WLC
  text: וְ/קִ֧ישׁ אֲבִֽי שָׁא֛וּל וְ/נֵ֥ר אֲבִֽי אַבְנֵ֖ר בֶּן אֲבִיאֵֽל־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/051.yaml
  text: Kish was the father of Saul[a], and Ner was the father of Abner, the son of Abiel.
translation:
  language: ta
  text: கீஸ் சவுலின் தந்தை; நேர் அப்னேரின் தந்தை; அப்னேர் அபியேலின் மகன்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரேயத்தில் சொற்சொல்லாக: “கீஸ் சவுலின் தந்தை; நேர் அப்னேரின் தந்தை, அபியேலின் மகன்.” இறுதியிலுள்ள “அபியேலின் மகன்” என்ற ஒருமைத் தொடர் எவருடன் இணைகிறது என்பது விவாதத்திற்குரியது; இங்கு அது அருகிலுள்ள அப்னேருடன் இணைத்து மொழிபெயர்க்கப்பட்டுள்ளது.'
    reason: மூலத்தின் ஒருமை வடிவத்தையும் உறவுத் தொடரின் இலக்கணத் தெளிவின்மையையும் பாதுகாத்தல்
lexical_decisions:
- source_word: וְ/קִישׁ
  choice: கீஸ்
  rationale: தனிப்பட்ட பெயர்; நவீனத் தமிழில் வழக்கமான வேதாகம ஒலிபெயர்ப்பு பயன்படுத்தப்பட்டது. தொடக்க וְ தனியாக மொழிபெயர்க்கப்படவில்லை; இது முந்தைய உரையோட்டத்தோடு இணைக்கும் தொடரிடைச் சொல்.
- source_word: אֲבִי שָׁאוּל
  choice: சவுலின் தந்தை
  rationale: אֲבִי என்பது ‘தந்தை’ என்பதன் சார்பு வடிவம். வினைச்சொல் இல்லாத எபிரேய வம்சவரிசைக் கூற்றின் சுருக்கத்தைத் தமிழிலும் இயல்பாகப் பேணுகிறது.
- source_word: וְ/נֵר
  choice: நேர்
  rationale: தனிப்பட்ட பெயர் ஒலிபெயர்க்கப்பட்டது; இணை அமைப்பு தமிழில் அரைப்புள்ளியால் தெளிவாக்கப்பட்டது.
- source_word: אֲבִי אַבְנֵר
  choice: அப்னேரின் தந்தை
  rationale: முந்தைய சார்பு அமைப்புக்கு இணையாக மொழிபெயர்க்கப்பட்டு எபிரேய ஒத்திசைவு பேணப்பட்டது.
- source_word: בֶּן אֲבִיאֵל
  choice: இவர்கள் அபியேலின் மகன்கள்
  rationale: எபிரேயத்தில் ‘அபியேலின் மகன்’ என்பது ஒருமையில் இருந்தாலும், 1 சாமுவேல் 9:1 மற்றும் 14:50–51 இன் வம்சவரிசைச் சூழலில் கீஸும் நேரும் அபியேலின் மகன்கள் என்பதே தொடர்பு. தமிழில் குழப்பத்தைத் தவிர்க்க உறவு வெளிப்படுத்தப்பட்டது; நேரடி இலக்கண வடிவம் அடிக்குறிப்பில் தரப்பட்டது.
theological_decisions:
- issue: בֶּן אֲבִיאֵל என்ற ஒருமைத் தொடரின் தொடர்பு
  choice: கீஸும் நேரும் அபியேலின் மகன்கள் என்று சூழல்சார்ந்து வெளிப்படுத்துதல்
  alternative: ‘அப்னேர், அபியேலின் மகன்’ அல்லது ‘நேர், அபியேலின் மகன்’ என்று அருகிலுள்ள பெயருடன் மட்டும் இணைத்தல்
  rationale: எபிரேய தொடரின் மேற்பரப்பு அமைப்பு தொடர்பில் தெளிவற்றதாகத் தோன்றினாலும், 1 சாமுவேல் 9:1 கீஸின் தந்தை அபியேல் எனக் கூறுகிறது; 14:50–51 இன் நோக்கம் சவுலுக்கும் படைத்தலைவன் அப்னேருக்கும் உள்ள உறவை விளக்குவது. ஆகவே இரு சகோதரர்களையும் குறிக்கும் பொருள் ஏற்றுக்கொள்ளப்பட்டது; இலக்கண ஒருமை அடிக்குறிப்பில் வெளிப்படையாகப் பாதுகாக்கப்பட்டது.
translation_notes:
  register: நவீனத் தரத் தமிழில் சுருக்கமான, கண்ணியமான வம்சவரிசை நடை. எபிரேய வினையற்ற இணை அமைப்பை அரைப்புள்ளிகளால் பேணியுள்ளோம். பெயர்கள் தமிழ் வேதாகம வழக்கிற்கு ஏற்றவாறு ஒலிபெயர்க்கப்பட்டுள்ளன.
