  rationale: The revision removes the unsupported plural expansion, retains the Hebrew singular 'son of Abiel,' and keeps the debated syntactic connection visible in a restrained footnote. The main text follows the immediate word order by linking the final appositional phrase with Abner, without claiming that this resolves every genealogical question raised by related passages.
