base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/016.yaml
  text: And Saul’s watchmen in Gibeah of Benjamin looked[a], and behold, the multitude was melting away, and it went here and there.
translation:
  language: ta
  text: பென்யமீனிலுள்ள கிபியாவில் இருந்த சவுலின் காவலர்கள் பார்த்தார்கள்; இதோ, அந்தக் கூட்டம் கரைந்துகொண்டிருந்தது; அது அங்குமிங்கும் சென்றுகொண்டிருந்தது.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அந்தக் கூட்டம் கரைந்துகொண்டிருந்தது; அது இந்தப் பக்கமும் அந்தப் பக்கமும் சென்றுகொண்டிருந்தது.” எபிரேய வாசகம் சுருக்கமாக அமைந்து, பெலிஸ்தியர்களிடையே கண்ணுக்குத் தெரிந்த குழப்பத்தைச் சித்தரிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַצֹּפִים
  choice: காவலர்கள்
  rationale: צפה என்ற வேரிலிருந்து வரும் இச்சொல், கவனித்துப் பார்ப்பதற்காக நிறுத்தப்பட்ட இராணுவக் காவலர்களைக் குறிக்கிறது. நவீன தமிழில் ‘காவலர்கள்’ இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: לְשָׁאוּל
  choice: சவுலின்
  rationale: לְ இங்கு சவுலுடன் சேர்ந்த அல்லது அவருக்குக் கீழிருந்த காவலர்களைக் குறிக்கிறது; தமிழில் உடைமைத் தொடர்பு இயல்பாக ‘சவுலின்’ என வெளிப்படுகிறது.
- source_word: בְּגִבְעַת בִּנְיָמִן
  choice: பென்யமீனிலுள்ள கிபியாவில்
  rationale: இது இடப்பெயரைத் தெளிவுபடுத்துகிறது. ‘பென்யமீனிலுள்ள கிபியா’ என்பது இயல்பான நவீனத் தமிழ் வடிவம்.
- source_word: וַיִּרְאוּ
  choice: பார்த்தபோது
  rationale: இந்தக் கதைச் சூழலில் காவலர்கள் நோக்கிப் பார்த்து அடுத்த காட்சியைக் கண்டதை இணைக்கிறது. ‘பார்த்தபோது’ என்பது எபிரேய நிகழ்வுத் தொடரை தமிழில் இயல்பாக எடுத்துரைக்கிறது.
- source_word: וְהִנֵּה
  choice: இதோ
  rationale: הִנֵּה திடீரெனக் கண்ணில் பட்ட காட்சியின்மீது கவனத்தை ஈர்க்கிறது; ‘இதோ’ அதன் உயிரோட்டத்தைப் பாதுகாக்கிறது.
- source_word: הֶהָמוֹן
  choice: அந்தத் திரளான படை
  rationale: הָמוֹן என்பது பெருந்திரள் அல்லது இரைச்சலான கூட்டம் எனப் பொருள்படலாம். போர்ச் சூழலில் பெலிஸ்தியப் படைத்திரளைக் குறித்தாலும், மூலத்தில் உள்ள கூட்டுப் பொருளை ‘திரளான படை’ காக்கிறது.
- source_word: נָמוֹג
  choice: சிதைந்துகொண்டிருந்தது
  rationale: מוג என்பதன் அடிப்படை உருவகம் ‘உருகுதல்’; இங்கு படைத்திரள் கட்டுக்குலைந்து ஒற்றுமையை இழப்பதைச் சுட்டுகிறது. தமிழில் ‘சிதைந்துகொண்டிருந்தது’ அந்தக் காட்சியை இயல்பாகத் தருகிறது.
- source_word: וַיֵּלֶךְ
  choice: சென்றுகொண்டிருந்தது
  rationale: ஒருமை வினைச்சொல் கூட்டுப் பெயரான படைத்திரளையே எழுவாயாகக் கொண்டுள்ளது. தொடர்ச்சியான குழப்பமான அசைவை இவ்வடிவம் காட்டுகிறது.
- source_word: וַהֲלֹם
  choice: அங்குமிங்கும்
  rationale: הֲלֹם அடிப்படையில் ‘இங்கே/இவ்விடம் நோக்கி’ எனப் பொருள்படும்; இச்சுருக்கமான இணைப்பில் ஒழுங்கற்ற பலதிசை அசைவைக் குறிக்கிறது. ‘அங்குமிங்கும்’ நவீன தமிழில் அதைத் தெளிவாகத் தருகிறது.
