  text: וְ/הָיָה֙ כִּ֣י הִרְבְּתָ֔ה לְ/הִתְפַּלֵּ֖ל לִ/פְנֵ֣י יְהוָ֑ה וְ/עֵלִ֖י שֹׁמֵ֥ר אֶת פִּֽי/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/012.yaml
  text: And as she continued praying before Yahweh[a], Eli was watching her mouth.
translation:
  language: ta
  text: அவள் யாவேவின் முன்னிலையில் தொடர்ந்து மன்றாடிக்கொண்டிருந்தபோது, ஏலி அவளுடைய வாயைக் கவனித்துக்கொண்டிருந்தான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'இன்னும் சொற்சொல்லாக: “அவ்வாறு நிகழ்ந்தது: அவள் யாவேவின் முன்னிலையில் மன்றாடுதலைத் தொடர்ந்து செய்தபோது, ஏலி அவளுடைய வாயைக் கவனித்துக்கொண்டிருந்தான்.”'
    reason: וְהָיָה כִּי என்ற எபிரெயக் கதைத் தொடர் சூத்திரத்தையும், הִרְבְּתָה לְהִתְפַּלֵּל என்பதன் தொடர்ச்சி/மிகுதி நுணுக்கத்தையும் காட்டுகிறது.
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: …போது
  rationale: எபிரெயக் கதைத் தொடர் சூத்திரம் அடுத்த செயல் நிகழ்ந்த காலச்சூழலை அறிமுகப்படுத்துகிறது. தமிழில் மரபுச்சொல்லைச் சொற்சொல்லாகப் பிரதிபலிக்காமல், இயல்பான காலத் துணைவாக்கியமாக வழங்கப்பட்டுள்ளது.
- source_word: הִרְבְּתָה לְהִתְפַּלֵּל
  choice: நீண்ட நேரம் மன்றாடிக்கொண்டிருந்தபோது
  rationale: רבה என்பதன் ஹிஃபில் வடிவமும் தொடர்ந்து வரும் வினையெச்சமும் சேர்ந்து, மன்றாட்டின் நீடிப்பையோ மிகுதியையோ குறிக்கின்றன. இந்தத் தேர்வு தொடர்ச்சியையும் நீண்ட கால அளவையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: לִפְנֵי יְהוָה
  choice: யாவேக்கு முன்பாக
  rationale: இது யாவேயின் முன்னிலையில் செலுத்தப்பட்ட மன்றாட்டைக் குறிக்கும் வழக்குச் சொற்றொடர். 'முன்பாக' என்பது மூலத்தின் இட/உறவு உருவகத்தைப் பேணுகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: திருநான்கெழுத்துப் பெயரைப் பொதுப்பட்டமான 'ஆண்டவர்' என்று மாற்றாமல், உடன்படிக்கைப் பெயராக ஒலிபெயர்த்துள்ளது.
- source_word: שֹׁמֵר
  choice: கவனித்துக்கொண்டிருந்தான்
  rationale: கால் வினையெச்சம் நீடித்துக் கொண்டிருந்த கண்காணிப்பைச் சுட்டுகிறது; தமிழ் தொடர்நிலை வடிவம் இதைப் பேணுகிறது.
- source_word: אֶת־פִּיהָ
  choice: அவளுடைய வாய்
  rationale: மூலத்தில் உள்ள פֶּה என்பதன் நேர்ப்பொருள் 'வாய்'. அடுத்த வசனம் உதடுகளைக் குறிப்பதால், இங்கே அந்த வேறுபாடு பாதுகாக்கப்படுகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: இவ்வசனம் திருநான்கெழுத்து இறைப்பெயரை நேரடியாகப் பயன்படுத்துகிறது. தனிப்பெயரின் தன்மையைப் பேண ஒலிபெயர்ப்பு பயன்படுத்தப்பட்டுள்ளது; பொதுப்பட்டமாக மாற்றப்படவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், மரியாதைமிக்க ஆனால் பொதுவாசகர்களுக்கு எளிதில் புரியும் நடை. ‘மன்றாடுதல்’ என்பது இறைவனை நோக்கிய ஆழ்ந்த வேண்டுதலை இயல்பாகத் தருகிறது; ‘வாய்’ என்ற நேர்ப்பொருள் அடுத்த வசனத்தின் ‘உதடுகள்’ என்பதிலிருந்து வேறுபடுத்திப் பேணப்பட்டுள்ளது.
