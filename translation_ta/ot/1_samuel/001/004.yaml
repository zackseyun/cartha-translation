base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/004.yaml
  text: And when the day came[a], Elkanah sacrificed and gave portions to Peninnah his wife and to all her sons and daughters.
translation:
  language: ta
  text: எல்க்கானா பலி செலுத்திய நாள் வந்தபோது[a], அவர் அவருடைய மனைவி பெனின்னாளுக்கும் அவளுடைய மகன்கள், மகள்கள் அனைவருக்கும் பங்குகளைக் கொடுத்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எல்க்கானா பலி செலுத்தியபோதெல்லாம்”; இங்கு வரும் எபிரெய வினை வடிவங்களை எளிய இறந்தகாலமாக வாசிக்கலாம்; எனினும், சூழல் இது திரும்பத் திரும்ப நடந்த பலியுணவு வழக்கத்தையும் சுட்டலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי הַיּוֹם
  choice: நாள் வந்தபோது
  rationale: இது நிகழ்வுக்கான காலச் சூழலை அமைக்கும் எபிரெயக் கதைநடைத் தொடர். இயல்பான தமிழில் அதன் காலப் பொருளைப் பாதுகாக்கிறது.
- source_word: וַיִּזְבַּח
  choice: பலி செலுத்தும்
  rationale: זבח பலிக்காக அறுத்து அர்ப்பணிப்பதைக் குறிக்கிறது; வழிபாட்டுச் சூழலைத் தெளிவாகவும் மிகைப்படுத்தாமலும் தெரிவிக்கிறது.
- source_word: וְנָתַן
  choice: கொடுத்தார்
  rationale: எபிரெய வடிவின் எளிய இறந்தகாலத் தொடரை நேரடியாகப் பிரதிபலிக்கிறது. சூழலில் வழக்கமான செயல் என்ற வாசிப்பும் சாத்தியமுள்ளதால் அது அடிக்குறிப்பில் குறிப்பிடப்படுகிறது.
- source_word: לִפְנִנָּה אִשְׁתּוֹ
  choice: தம் மனைவி பெனின்னாளுக்கும்
  rationale: தமிழில் இயல்பான பெயர்–உறவு வரிசையைப் பயன்படுத்தி, பெனின்னாள் எல்க்கானாவின் மனைவி என்பதைப் பாதுகாக்கிறது.
- source_word: וּלְכָל בָּנֶיהָ וּבְנוֹתֶיהָ
  choice: அவளுடைய மகன்கள், மகள்கள் அனைவருக்கும்
  rationale: மூலத்தில் மகன்களும் மகள்களும் தனித்தனியாகக் குறிப்பிடப்படுவதைச் சுருக்காமல் பாதுகாக்கிறது.
- source_word: מָנוֹת
  choice: பங்குகள்
  rationale: பலியுணவில் ஒவ்வொருவருக்கும் ஒதுக்கப்பட்ட உணவுப் பங்குகளைக் குறிக்கும் இயல்பான தமிழ் சொல்; 'பலியின் பங்குகள்' என்று மூலத்தைவிட வெளிப்படையாக்கவில்லை.
theological_decisions: []
translation_notes:
  register: நவீன தரநிலைத் தமிழில் இயல்பான, கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் நிகழ்வுவரிசை பாதுகாக்கப்பட்டதுடன், வழக்கமான செயல் என்ற சூழல்சார் சாத்தியம் அடிக்குறிப்பில் விடப்பட்டுள்ளது.
