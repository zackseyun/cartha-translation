  text: וַ/יְהִי֩ אִ֨ישׁ אֶחָ֜ד מִן הָ/רָמָתַ֛יִם צוֹפִ֖ים מֵ/הַ֣ר אֶפְרָ֑יִם וּ/שְׁמ֡/וֹ אֶ֠לְקָנָה בֶּן יְרֹחָ֧ם בֶּן אֱלִיה֛וּא בֶּן תֹּ֥חוּ בֶן צ֖וּף אֶפְרָתִֽי־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/001.yaml
  text: There was a certain man from Ramathaim-zophim[a], from the hill country of Ephraim, and his name was Elkanah son of Jeroham, son of Elihu, son of Tohu, son of Zuph, an Ephraimite.
translation:
  language: ta
  text: எப்பிராயீம் மலைநாட்டிலுள்ள ராமாத்தாயிம்-சோபீமைச் சேர்ந்த ஒரு மனிதர் இருந்தார். அவருடைய பெயர் எல்க்கானா. அவர் எரோகாமின் மகன்; எரோகாம் எலிகூவின் மகன்; எலிகூ தோகூவின் மகன்; தோகூ சூப்பின் மகன். அவர் ஓர் எப்பிராத்தியர்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஓர் எப்பிராயீமியர்.” எபிரெய உரையில் “எப்பிராத்தியர்” என்று உள்ளது; இங்கு அது எப்பிராயீமுடன் தொடர்புடைய ஒரு வட்டார அடையாளமாகப் பயன்படுத்தப்பட்டிருக்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי
  choice: இருந்தார்
  rationale: கதையைத் தொடங்கும் היה வினையின் wayyiqtol வடிவத்தை இயல்பான தமிழ் கதைநடையில் தருகிறது; மூலத்தில் இல்லாத தனிப்பட்ட ‘இப்போது’ என்ற காலச்சொல் சேர்க்கப்படவில்லை.
- source_word: אִישׁ אֶחָד
  choice: ஒரு மனிதர்
  rationale: இன்னும் பெயரிடப்படாத ஒரு குறிப்பிட்ட நபரை அறிமுகப்படுத்தும் எபிரெய வழக்கை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: מִן הָרָמָתַיִם צוֹפִים
  choice: ராமாத்தாயிம்-சோபீமைச் சேர்ந்த
  rationale: இதனை கூட்டுப் புவிப்பெயராகக் கொண்டு ஒலிபெயர்க்கிறது; பெயரின் உட்கூறுகளை ஊகித்து விளக்கவில்லை.
- source_word: מֵהַר אֶפְרָיִם
  choice: எப்பிராயீம் மலைநாட்டிலுள்ள
  rationale: הַר என்ற சொல் இத்தகைய நிலப்பகுதிக் குறிப்பில் தனி மலையைவிட மலைநாட்டைக் குறிக்கிறது.
- source_word: וּשְׁמוֹ
  choice: அவருடைய பெயர்
  rationale: எபிரெய இணைப்புத் தொடரை தெளிவான, இயல்பான தமிழில் தனி வாக்கியமாக வழங்குகிறது.
- source_word: אֶלְקָנָה
  choice: எல்க்கானா
  rationale: தனிப்பெயர் மொழிபெயர்க்கப்படாமல் எபிரெய உச்சரிப்பை அணுகும் வகையில் ஒலிபெயர்க்கப்பட்டது.
- source_word: בֶּן ... בֶּן ... בֶּן ... בֶן
  choice: மகன் ... மகன் ... மகன் ... மகன்
  rationale: வம்சவரிசையில் בן என்பதன் நேரடியான உறவுப் பொருளைப் பேணுகிறது; வாசிப்புத் தெளிவுக்காக ஒவ்வொரு தலைமுறையும் வெளிப்படையாகக் கூறப்பட்டது.
- source_word: אֶפְרָתִי
  choice: ஓர் எப்பிராத்தியர்
  rationale: சொல்லின் முறையான வடிவத்தைக் பிரதான உரையில் பேணுகிறது; சூழலில் ‘எப்பிராயீமியர்’ எனப் புரிந்துகொள்ளும் வாய்ப்பு அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: אֶפְרָתִי என்ற இன/புவியியல் அடையாளம்
  choice: ஓர் எப்பிராத்தியர்
  alternative: ஓர் எப்பிராயீமியர்
  rationale: இது முதன்மையாக சொற்பொருள் மற்றும் புவியியல் சார்ந்த தெளிவின்மை. எபிரெய வடிவம் ‘எப்பிராத்தியர்’ என்பதைக் காட்டுவதால் அது உரையில் பேணப்பட்டு, முன்னுள்ள எப்பிராயீம் நிலப்பகுதிக் குறிப்பின் அடிப்படையில் சாத்தியமான மாற்றுப் புரிதல் அடிக்குறிப்பில் பதிவு செய்யப்படுகிறது.
translation_notes:
  register: நவீன தரத் தமிழில், கண்ணியமானதும் பொதுவாசகர்களுக்கு எளிதில் புரியத்தக்கதுமான கதைநடை பயன்படுத்தப்பட்டது. நீண்ட எபிரெய வம்சவரிசை தமிழில் தெளிவாக இருக்கச் சிறு வாக்கியங்களாகப் பிரிக்கப்பட்டது; மூலத்தின் தகவல் அனைத்தும் பேணப்பட்டது.
