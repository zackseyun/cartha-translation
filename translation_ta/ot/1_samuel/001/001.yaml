  source_fidelity: மூல எபிரெயத்தின் கதைத் தொடக்கம், ராமாத்தாயிம்-சோபீம் மற்றும் எப்பிராயீம் மலைநாடு என்ற இடக்குறிப்புகள், எல்க்கானாவின் பெயர், நான்கு தலைமுறை வம்சவரிசை, மற்றும் இறுதியிலுள்ள אֶפְרָתִי அடையாளம் ஆகிய அனைத்தும் கருத்து இழப்பின்றி தரப்பட்டுள்ளன. வம்சவரிசையைச் சிறு வாக்கியங்களாகப் பிரித்திருப்பது உறவுத் தொடரைத் தெளிவாக்குகிறது; பொருளை மாற்றவில்லை.
  naturalness: நடை நவீன தரத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் உள்ளது. “எப்பிராயீம் மலைநாட்டிலுள்ள ராமாத்தாயிம்-சோபீமைச் சேர்ந்த” என்பது இடப்பெயர் மற்றும் பிராந்தியக் குறிப்பை வாசிக்கத்தக்க வகையில் இணைக்கிறது.
  terminology: தனிப்பெயர்கள் தொடர்ச்சியாக ஒலிபெயர்க்கப்பட்டுள்ளன. “எப்பிராத்தியர்” என்பது אֶפְרָתִי-யின் வடிவத்தை முதன்மை உரையில் காக்கிறது. “எப்பிராயீமியர்” என்ற சூழல்சார் மாற்றுப் புரிதல் அடிக்குறிப்பில் மட்டும் இருப்பது மூலத்தின் விவாதத்துக்குரிய தெளிவின்மையைப் பாதுகாக்கிறது.
