source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר לָ֜/הּ אֶלְקָנָ֣ה אִישָׁ֗/הּ חַנָּה֙ לָ֣/מֶה תִבְכִּ֗י וְ/לָ֨/מֶה֙ לֹ֣א תֹֽאכְלִ֔י וְ/לָ֖/מֶה יֵרַ֣ע לְבָבֵ֑/ךְ הֲ/ל֤וֹא אָֽנֹכִי֙ ט֣וֹב לָ֔/ךְ מֵ/עֲשָׂרָ֖ה בָּנִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/008.yaml
  text: Then Elkanah her husband said to her[a], “Hannah, why are you weeping? And why do you not eat? And why is your heart troubled? Am I not better to you than ten sons?”
translation:
  language: ta
  text: அப்போது அவளுடைய கணவன் எல்க்கானா அவளிடம், “அன்னா, நீ ஏன் அழுகிறாய்? ஏன் உண்ணாமல் இருக்கிறாய்? உன் உள்ளம் ஏன் கலங்கியிருக்கிறது?[a] பத்து மகன்களைவிட நான் உனக்கு மேல் அல்லவா?” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உன் உள்ளம் ஏன் துயரமாயிருக்கிறது?” சொல்லடியாக, “உன் இருதயம் ஏன் மோசமாக இருக்கிறது?”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: அப்போது ... என்றான்
  rationale: வாவ் தொடர்வினை கதைநிகழ்வை முன்னெடுத்துச் செல்கிறது; ‘அப்போது’ இயல்பான தமிழில் அதன் தொடர்ச்சியை வெளிப்படுத்துகிறது.
- source_word: אֶלְקָנָה אִישָׁהּ
  choice: அவளுடைய கணவன் எல்க்கானா
  rationale: எல்க்கானா அவளுடைய கணவன் என்ற அடையாளத்தை வெளிப்படையாகவும் இயல்பாகவும் தருகிறது.
- source_word: לָמֶה
  choice: ஏன்
  rationale: மூன்று முறை வரும் வினாவைத் தமிழிலும் மூன்று முறை பேணி, அதன் வலியுறுத்தலைக் காக்கிறது.
- source_word: תִבְכִּי
  choice: நீ ஏன் அழுகிறாய்
  rationale: நடந்துகொண்டிருக்கும் துயர வெளிப்பாட்டை நவீனத் தமிழில் இயல்பாகக் குறிக்கிறது.
- source_word: לֹא תֹאכְלִי
  choice: ஏன் சாப்பிடாமல் இருக்கிறாய்
  rationale: அவள் தற்போது உணவு உண்ணாத நிலையைத் தெரிவிக்கிறது; விருப்பமின்மை போன்ற கூடுதல் பொருளைச் சேர்க்கவில்லை.
- source_word: יֵרַע לְבָבֵךְ
  choice: உன் இருதயம் ஏன் துயரமடைந்திருக்கிறது
  rationale: சொல்லடியாக ‘உன் இருதயம் ஏன் தீமையாக/மோசமாக இருக்கிறது?’ என்ற எபிரெய மரபுத்தொடர் இச்சூழலில் உள்ளார்ந்த துயரத்தைக் குறிக்கிறது; இருதய உருவகமும் காக்கப்படுகிறது.
- source_word: הֲלוֹא
  choice: அல்லவா
  rationale: ஆம் என்ற பதிலை எதிர்பார்க்கும் எதிர்மறை வினாவின் சொல்லாற்றலை இயல்பான தமிழில் தருகிறது.
- source_word: טוֹב לָךְ
  choice: நான் உனக்கு மேலானவன்
  rationale: ஒப்பீட்டுப் பொருளைத் தெளிவாகத் தருகிறது; ‘நல்லவன்’ என்பது இங்கு குணநலன் குறித்த தவறான புரிதலை ஏற்படுத்தக்கூடும்.
- source_word: מֵעֲשָׂרָה בָּנִים
  choice: பத்து மகன்களைவிட
  rationale: எபிரெய மூலத்தில் குறிப்பாக ‘மகன்கள்’ என்று இருப்பதைப் பேணுகிறது; ‘பத்து’ என்பதை விளக்கவுரை சேர்க்காமல் அப்படியே தருகிறது.
theological_decisions:
- issue: בָּנִים என்ற பாலினக் குறிப்புள்ள பெயர்ச்சொல்
  choice: மகன்கள்
  alternative: பிள்ளைகள்
  rationale: மூலம் ஆண்பால் பன்மையைத் தெளிவாகக் குறிப்பிடுகிறது; அதை பாலினப் பொதுமைப்படுத்தாமல் பேணுவது மூலத்தின் பண்பாட்டுச் சூழலையும் பதற்றத்தையும் காக்கிறது.
translation_notes:
  register: நவீன நிலையான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘அன்னாளே’ என்ற அழைப்புமுறை நேரடி உரையின் நெருக்கத்தையும் பெயரின் விளிவடிவத்தையும் காட்டுகிறது. ‘இருதயம்’ என்ற சொல் எபிரெய உருவகத்தைப் பேணுகிறது; ‘உள்ளம்’ என்பது இயல்பான மாற்றாக இருந்தாலும் இங்கு உருவகத் தொடர்ச்சி முன்னுரிமை பெற்றது.
