  naturalness: ‘அன்னாளே’ என்பது இன்றைய நிலையான உரைநடையில் பெயரழைப்பாக இயல்பானதல்ல; ‘அன்னா’ இயல்பான நேரடி அழைப்பு. ‘சாப்பிடாமல்’ பேச்சுவழக்குத் தன்மை கொண்டது; இப்பகுதியின் கண்ணியமான உரைநடைக்கு ‘உண்ணாமல்’ பொருத்தமானது. ‘இருதயம்’ புரிந்துகொள்ளத்தக்கது; இருப்பினும் நவீனத் தமிழில் ‘உள்ளம்’ இந்தச் சூழலின் உணர்வுநிலையை இயல்பாகத் தெரிவிக்கிறது. மூலத்தின் இதய உருவகத்தை அடிக்குறிப்பில் பாதுகாக்கலாம்.
