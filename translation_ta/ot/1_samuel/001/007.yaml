source:
  edition: WLC
  text: וְ/כֵ֨ן יַעֲשֶׂ֜ה שָׁנָ֣ה בְ/שָׁנָ֗ה מִ/דֵּ֤י עֲלֹתָ/הּ֙ בְּ/בֵ֣ית יְהוָ֔ה כֵּ֖ן תַּכְעִסֶ֑/נָּה וַ/תִּבְכֶּ֖ה וְ/לֹ֥א תֹאכַֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/007.yaml
  text: 'And so it happened year after year: whenever she went up to the house of Yahweh[a], Peninnah would provoke her[b], and she would weep and not eat.'
translation:
  language: ta
  text: 'இப்படியே ஆண்டுதோறும் நடந்துவந்தது[a]: அவள் யாவேவின் இல்லத்திற்குப்[b] போகும்போதெல்லாம், பெனின்னாள் அவளைத் துன்புறுத்துவாள்; அவளோ அழுது, சாப்பிடாமல் இருப்பாள்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவன் ஆண்டுதோறும் இப்படிச் செய்வான்.” எபிரெய வினைச்சொல் சொற்படி ஆண்பால் ஒருமையில் உள்ளது; அது எல்க்கானாவைக் குறிக்கலாம். ஆனால் ஆண்டுதோறும் திரும்ப நிகழ்ந்த சூழலைத் தொகுத்துச் சொல்லும் மரபுத்தொடராகவும் இதைப் புரிந்துகொள்ளலாம்.
    reason: alternative_reading
  - marker: b
    text: அல்லது, “யாவேவின் இல்லத்தில்.” எபிரெய முன்னிடைச்சொல் சொற்படி “இல்/இடத்தில்” என்று பொருள்படும்; ஆனால் இங்குள்ள இயக்க வினையுடன் அது செல்லும் இலக்கைக் குறிப்பதாகவும் புரிந்துகொள்ளலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכֵן יַעֲשֶׂה
  choice: இப்படியே … நடந்துவந்தது
  rationale: יַעֲשֶׂה என்பது சொற்படி ஆண்பால் ஒருமை வினைச்சொல் (‘அவன் செய்வான்’). எனினும், இங்கு ஆண்டுதோறும் திரும்ப நிகழ்ந்த சூழலைத் தொகுத்துச் சொல்லும் மரபுத்தொடராகவும் புரிந்துகொள்ளலாம். தமிழ் முதன்மைப் பாடம் அந்தத் தொடர்ச்சியான நிகழ்வை இயல்பாகத் தெரிவிக்கிறது; சொற்படியான மாற்று அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: שָׁנָה בְשָׁנָה
  choice: ஆண்டுதோறும்
  rationale: ஒவ்வோர் ஆண்டும் மீண்டும் நிகழ்ந்ததைச் சுருக்கமாகவும் இயல்பாகவும் காட்டுகிறது.
- source_word: מִדֵּי עֲלֹתָהּ
  choice: அவள் … போகும்போதெல்லாம்
  rationale: מִדֵּי உடன் வரும் வினையெச்சம் ‘ஒவ்வொரு முறை/எப்போதெல்லாம்’ என்ற தொடர்நிகழ்வைக் குறிக்கிறது; பெண்பால் பின்னொட்டு அன்னாளைக் குறிக்கிறது.
- source_word: בְּבֵית יְהוָה
  choice: யாவேவின் இல்லத்திற்கு
  rationale: בְּ என்பது சொற்படி ‘இல்/இடத்தில்’ என்றாலும், ‘ஏறிச் செல்லுதல்’ என்ற இயக்க வினையின் சூழலில் இலக்கைத் தமிழில் ‘இல்லத்திற்கு’ எனச் சொல்வது இயல்பானது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய மூலத்தில் உள்ள தேவனுடைய தனிப்பெயரான நான்கெழுத்துப் பெயரை பொதுப்பட்டமாக மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: תַּכְעִסֶנָּה
  choice: அவளை வேதனைப்படுத்துவாள்
  rationale: כעס என்பதன் காரணவினை வடிவம் ஒருவரை எரிச்சலடையச் செய்தல், சினமூட்டுதல் அல்லது மனவேதனைப்படுத்துதல் எனப் பொருள்படும். அடுத்ததாக அன்னாள் அழுவதை முன்னிட்டு ‘வேதனைப்படுத்துவாள்’ இயல்பானதும் சூழலுக்கு ஏற்றதுமாகும்.
- source_word: וַתִּבְכֶּה וְלֹא תֹאכַל
  choice: அவளோ அழுது, சாப்பிடாமல் இருப்பாள்
  rationale: வினை வடிவங்கள் கடந்தகாலத் தோற்றமுடையவையாக இருந்தாலும், முழு வசனத்தின் ஆண்டுதோறும் நிகழும் வழக்கச் சூழலில் அவை திரும்பத் திரும்ப ஏற்பட்ட விளைவைக் குறிக்கின்றன. ‘இருப்பாள்’ அந்த வழக்கத் தன்மையைத் தமிழில் தெளிவாக்குகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: இவ்வசனம் பொதுப்பட்டம் அல்லாமல் தேவனுடைய தனிப்பெயரையே பயன்படுத்துகிறது. ஆகவே அந்தப் பெயரைத் தமிழில் ஒலிபெயர்ப்பது மூலத்தின் வேறுபாட்டைப் பாதுகாக்கிறது.
- issue: יַעֲשֶׂה என்பதன் மறைமுக எழுவாய்
  choice: திரும்ப நிகழ்ந்த சூழலைக் குறிக்கும் மரபுத்தொடராக மொழிபெயர்த்தல்
  alternative: எல்க்கானா ‘இப்படிச் செய்வான்’ என்று மொழிபெயர்த்தல்
  rationale: வினை ஆண்பால் ஒருமையாக இருப்பதால் எல்க்கானாவை எழுவாயாகக் கொள்ள இயலும். அதேவேளையில், இக்கூற்று குடும்பத்தில் ஆண்டுதோறும் நடந்த முழுச் சூழலையும் தொகுப்பதாகவும் புரிந்துகொள்ள முடியும். தெளிவில்லாத இடத்தை அடிக்குறிப்பு மூலம் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. தொடர்ச்சியான வருடாந்திர நிகழ்வை ‘நடந்துவந்தது,’ ‘போகும்போதெல்லாம்,’ ‘இருப்பாள்’ ஆகிய வடிவங்கள் வெளிப்படுத்துகின்றன. ‘இல்லம்’ என்பது வழிபாட்டிடத்தைக் குறிக்கும் மரியாதையான, இயல்பான சொல்.
