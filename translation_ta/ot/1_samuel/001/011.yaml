base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/011.yaml
  text: She made a vow and said[a], “O Yahweh of hosts, if you will indeed look on the affliction of your female servant, and remember me, and not forget your female servant, but give your female servant a male child, then I will give him to Yahweh all the days of his life[b], and no razor shall come upon his head.”
translation:
  language: ta
  text: அவள் ஒரு நேர்த்திக்கடன் செய்து, “படைகளின் யாவே, உமது அடியாளின் துயரத்தை நீர் உண்மையாகவே நோக்கி, என்னை நினைவுகூர்ந்து, உமது அடியாளை மறவாமல், உமது அடியாளுக்கு ஓர் ஆண் குழந்தையைத் தந்தால்[a], அவனுடைய வாழ்நாளெல்லாம் அவனை யாவேக்கு கொடுப்பேன்; அவனுடைய தலையின்மேல் சவரக்கத்தி படாது[b]” என்றாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொற்சொல்லாக, “ஆண்களின் வித்து/சந்ததி”; இங்கு ஓர் ஆண் குழந்தையைக் குறிக்கும் மரபுத்தொடர்.
    reason: lexical_alternative
  - marker: b
    text: “சவரக்கத்தி படாது” என்ற மொழி, நாசரேய அர்ப்பணிப்புடன் தொடர்புடைய சிறப்பு அர்ப்பணிப்பு மொழியை நினைவூட்டுகிறது. ஆனால் இவ்வசனம் ‘நாசரேயன்’ என்ற பெயரைப் பயன்படுத்தாமல், தலைமுடியை மழிக்கக்கூடாது என்ற தடையை மட்டும் வெளிப்படையாகக் கூறுகிறது.
    reason: cultural_note
lexical_decisions:
- source_word: וַתִּדֹּר נֶדֶר
  choice: அவள் ஒரு நேர்த்திக்கடன் செய்து
  rationale: எபிரெயச் சொற்றொடரின் வலியுறுத்தலை இயல்பான தமிழில் ஒரு முறையான இறை வாக்குறுதியாக வெளிப்படுத்துகிறது.
- source_word: יְהוָה צְבָאוֹת
  choice: படைகளின் யாவே
  rationale: தெய்வீகப் பெயரான யாவே என்பதையும், צְבָאוֹת என்பதன் படைகள்/சேனைகள் சார்ந்த பொருளையும் மொழிபெயர்க்கிறது.
- source_word: אִם רָאֹה תִרְאֶה
  choice: நீர் உண்மையாகவே கண்ணோக்கி
  rationale: வினையெச்சமும் வினைமுற்றும் சேர்ந்த எபிரெய வலியுறுத்தலை ‘உண்மையாகவே’ என்பதன் மூலம் காக்கிறது.
- source_word: בָּעֳנִי
  choice: துயரத்தை
  rationale: அன்னாவின் வேதனை, தாழ்வு, சமூக இகழ்ச்சி ஆகியவற்றை அளவுக்கு மீறி குறிப்பாக்காமல் இயல்பாகக் குறிக்கிறது.
- source_word: אֲמָתֶךָ / לַאֲמָתְךָ
  choice: உமது அடியாள் / உமது அடியாளுக்கு
  rationale: பெண் பேசுபவர் தம்மைத் தாழ்த்திக் குறிப்பிடும் வேண்டுதல் மொழியைத் தமிழில் இயல்பாகக் காக்கிறது; தமிழில் ‘அடியாள்’ பெண்பாலைத் தெளிவாக்குகிறது.
- source_word: וּזְכַרְתַּנִי
  choice: என்னை நினைவுகூர்ந்து
  rationale: வேண்டுதல் மற்றும் உடன்படிக்கைச் சூழலுக்கேற்ற நேரடியான பொருள்.
- source_word: וְלֹא תִשְׁכַּח אֶת אֲמָתֶךָ
  choice: உமது அடியாளை மறவாமல்
  rationale: ‘நினைவுகூர்ந்து’ என்பதுடன் உள்ள இணை அமைப்பையும் வேண்டுதலின் தொடர்ச்சியையும் காக்கிறது.
- source_word: וְנָתַתָּה לַאֲמָתְךָ זֶרַע אֲנָשִׁים
  choice: உமது அடியாளுக்கு ஓர் ஆண் குழந்தையைத் தந்தால்
  rationale: ‘ஆண்களின் வித்து/சந்ததி’ என்ற சொற்சொல்லான மரபுத்தொடரின் சூழற்பொருளைத் தெளிவாக வழங்குகிறது; குறிப்பை அடிக்குறிப்பில் காக்கிறது.
- source_word: וּנְתַתִּיו לַיהוָה
  choice: அவனை யாவேக்கு ஒப்புக்கொடுப்பேன்
  rationale: மூல வினையின் ‘கொடுப்பேன்’ என்ற பொருளைக் காத்து, தமிழில் இறைவனுக்கான வாழ்நாள் அர்ப்பணிப்பை இயல்பாக உணர்த்துகிறது.
- source_word: כָּל יְמֵי חַיָּיו
  choice: அவனுடைய வாழ்நாளெல்லாம்
  rationale: வாக்குறுதியின் முழுக் கால அளவைச் சுருக்கமாகவும் துல்லியமாகவும் தெரிவிக்கிறது.
- source_word: וּמוֹרָה לֹא יַעֲלֶה עַל רֹאשׁוֹ
  choice: அவனுடைய தலையின்மேல் சவரக்கத்தி படாது
  rationale: முடியை மழிக்காதிருப்பதைக் குறிக்கும் எபிரெய உருவகத்தைத் தெளிவான தமிழில் காக்கிறது; ‘நாசரேயன்’ என்ற பெயரை மூலவசனம் சொல்லாததால் சேர்க்கவில்லை.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் உள்ள தனிப்பட்ட உடன்படிக்கைப் பெயரை பொதுப் பட்டமாக மாற்றாமல் ஒலிபெயர்க்கிறது.
- issue: சவரக்கத்தி தலையின்மேல் படாதிருக்கும் வாக்குறுதியின் நாசரேயத் தொடர்பு
  choice: வசனத்தில் உள்ள குறிப்பிட்ட தடையை மட்டும் முதன்மை உரையில் வைத்தல்
  alternative: அவனை நாசரேயனாக வெளிப்படையாக அடையாளப்படுத்துதல்
  rationale: இந்த மொழி நாசரேய அர்ப்பணிப்பை நினைவூட்டினாலும், வசனம் அந்தப் பெயரைப் பயன்படுத்தவில்லை; ஆகவே விளக்க முடிவை முதன்மை உரைக்குள் சேர்க்காமல் அடிக்குறிப்பில் தருகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், வேண்டுதலுக்கேற்ற கண்ணியமான உயர்வு விகுதிகளுடன் மொழிபெயர்க்கப்பட்டது. ‘அடியாள்’ என்பது பெண்பாலையும் தாழ்மையான சுயக்குறிப்பையும் இயல்பாக வெளிப்படுத்துகிறது. மூலத்தின் நீண்ட, சேர்க்கை அமைப்புடைய வேண்டுதல் ஓட்டம் பெரும்பாலும் காக்கப்பட்டுள்ளது.
