- from: இந்தப் பையனுக்காக நான் மன்றாடினேன்[a]; யெகோவா நான் அவரிடம் கேட்ட என் வேண்டுதலை எனக்குத் தந்தார்[b].
  to: இந்தச் சிறுவனுக்காக[a] நான் ஜெபித்தேன்; யாவே, நான் அவரிடம் கேட்ட என் வேண்டுதலை[b] எனக்குத் தந்தார்.
