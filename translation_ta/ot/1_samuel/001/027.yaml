source:
  edition: WLC
  text: אֶל הַ/נַּ֥עַר הַ/זֶּ֖ה הִתְפַּלָּ֑לְתִּי וַ/יִּתֵּ֨ן יְהוָ֥ה לִ/י֙ אֶת שְׁאֵ֣לָתִ֔/י אֲשֶׁ֥ר שָׁאַ֖לְתִּי מֵ/עִמּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/027.yaml
  text: For this boy I prayed[b][a], and Yahweh has given me my petition that I asked from him.
translation:
  language: ta
  text: இந்தச் சிறுவனுக்காக[a] நான் ஜெபித்தேன்; யாவே, நான் அவரிடம் கேட்ட என் வேண்டுதலை[b] எனக்குத் தந்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘இந்தச் சிறுவனைப் பற்றி நான் ஜெபித்தேன்.’ எபிரெய முன்னிடைச்சொல், நான் ஜெபித்த பொருளையும் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘என் வேண்டுகோளை.’
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶל הַנַּעַר הַזֶּה
  choice: இந்தப் பையனுக்காக
  rationale: אֶל என்பது இங்கு ஜெபத்தின் பொருள் அல்லது நோக்கத்தைக் குறிக்கிறது. இயல்பான தமிழில் ‘இந்தப் பையனுக்காக’ என்பது அன்னாள் இக்குழந்தையை வேண்டி மன்றாடியதைத் தெளிவாகக் காட்டுகிறது; ‘பையன்’ என்பது נַעַר என்பதன் ஆண்பால் குறிப்பையும் காக்கிறது.
- source_word: הִתְפַּלָּלְתִּי
  choice: நான் மன்றாடினேன்
  rationale: התפלל என்பதன் ஜெபப் பொருளை ‘மன்றாடினேன்’ இயல்பாகவும் இச்சூழலின் தீவிரத்துடனும் தெரிவிக்கிறது.
- source_word: וַיִּתֵּן
  choice: தந்தார்
  rationale: எபிரெயக் கதைநடை இறந்தகால வினையை நேரடியாகக் காக்கிறது; அன்னாள் குழந்தையை முன்வைக்கும் சூழலில் நிறைவேறிய செயல் தெளிவாக உள்ளது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: திருநான்கெழுத்துப் பெயரை ஒரு பொதுப் பட்டமாக மாற்றாமல், தமிழில் பரவலாக அறியப்படும் தனிப்பெயர் வடிவில் வழங்குகிறது.
- source_word: שְׁאֵלָתִי
  choice: என் வேண்டுதலை
  rationale: முதல் நபர் ஒருமை உடைமை விகுதியைக் ‘என்’ எனக் காக்கிறது; ஜெபச் சூழலில் שְׁאֵלָה என்பதற்கு ‘வேண்டுதல்’ இயல்பான தமிழ் இணை.
- source_word: אֲשֶׁר שָׁאַלְתִּי מֵעִמּוֹ
  choice: நான் அவரிடம் கேட்ட
  rationale: שאל என்ற வேரின் ‘கேட்ட’ பொருளையும், வேண்டுதல் யாரை நோக்கிச் செய்யப்பட்டது என்பதையும் தமிழில் இயல்பாகத் தெரிவிக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரின் மொழிபெயர்ப்பு
  choice: யெகோவா
  alternative: யாவே; கர்த்தர்
  rationale: மூலத்தில் தனிப்பட்ட இறைப் பெயர் நேரடியாக இருப்பதால் அதை ‘கர்த்தர்’ என்ற பட்டத்தால் மாற்றவில்லை. தமிழ்ச் சூழலில் நிலைபெற்ற ஒலிபெயர்ப்பான ‘யெகோவா’ தேர்ந்தெடுக்கப்பட்டது; ‘யாவே’ என்பதும் சாத்தியமான ஒலிபெயர்ப்பு.
- issue: அன்னாளின் வேண்டுதல் குழந்தையைப் பற்றியதா அல்லது குழந்தைக்காகவா
  choice: இந்தப் பையனுக்காக
  alternative: இந்தப் பையனைப் பற்றி
  rationale: אֶל என்னும் முன்னிடைச்சொல் இரு நுணுக்கங்களுக்கும் இடமளிக்கிறது. முதன்மை உரையில் இயல்பான நோக்கப் பொருள் தரப்பட்டது; பொருள் சார்ந்த மாற்று அடிக்குறிப்பில் காக்கப்பட்டது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. ‘மன்றாடினேன்’ ஜெபச் சூழலைக் காக்கிறது; ‘பையன்’ மூலத்தின் ஆண்பால் குறிப்பைத் தக்கவைக்கிறது. எல்லா அடிக்குறிப்பு குறியீடுகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
