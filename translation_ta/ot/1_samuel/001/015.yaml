  text: וַ/תַּ֨עַן חַנָּ֤ה וַ/תֹּ֨אמֶר֙ לֹ֣א אֲדֹנִ֔/י אִשָּׁ֤ה קְשַׁת ר֨וּחַ֙ אָנֹ֔כִי וְ/יַ֥יִן וְ/שֵׁכָ֖ר לֹ֣א שָׁתִ֑יתִי וָ/אֶשְׁפֹּ֥ךְ אֶת נַפְשִׁ֖/י לִ/פְנֵ֥י יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/015.yaml
  text: But Hannah answered and said[a], “No, my lord. I am a woman troubled in spirit. I have drunk neither wine nor strong drink[b], but I have poured out my soul before Yahweh.”
translation:
  language: ta
  text: 'ஆனால் அன்னாள் பதிலளித்துச் சொன்னாள்: “இல்லை, ஐயா; நான் உள்ளம் வேதனையுற்ற பெண்.[a] திராட்சரசமோ வேறு போதை தரும் பானமோ நான் குடிக்கவில்லை.[b] என் உயிரை யாவேக்கு முன்பாக ஊற்றினேன்.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயச் சொற்றொடரை “ஆவியில் துயருற்ற பெண்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: இது திராட்சரசம் அல்லாத, போதை தரும் பானத்தைக் குறிக்கிறது; அதன் துல்லியமான வகை குறிப்பிடப்படவில்லை.
    reason: lexical_clarification
lexical_decisions:
- source_word: לֹא אֲדֹנִי
  choice: இல்லை, ஐயா!
  rationale: எலி என்பவரை மரியாதையுடன் அழைக்கும் சொல் இது; தெய்வீகப் பட்டம் அல்ல. நவீனத் தமிழில் இயல்பான மரியாதை அழைப்பாக ‘ஐயா’ அமைகிறது.
- source_word: אִשָּׁה קְשַׁת רוּחַ
  choice: உள்ளம் வேதனையுற்ற பெண்
  rationale: சொல்லுக்கு சொல் வடிவில் ‘ஆவி கடினமான பெண்’ எனத் தோன்றினாலும், சூழலில் இது பிடிவாதத்தை அல்ல, ஆழ்ந்த மனவேதனையைக் குறிக்கிறது. ‘உள்ளம்’ என்பது רוּחַ குறிக்கும் அகநிலையை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וְיַיִן וְשֵׁכָר
  choice: திராட்சரசமோ வேறு மதுபானமோ
  rationale: יַיִן என்பது திராட்சரசம்; שֵׁכָר என்பது பொதுவாக அதிலிருந்து வேறான போதை தரும் பானம். ‘வேறு மதுபானம்’ பழங்காலப் பானத்தின் வகையை அளவுக்கு மீறிக் குறிப்பாக்காமல் வேறுபாட்டைப் பாதுகாக்கிறது.
- source_word: לֹא שָׁתִיתִי
  choice: நான் குடிக்கவில்லை
  rationale: இரண்டு பானங்களோடும் ‘-ஓ ... -ஓ’ இணைப்பைப் பயன்படுத்துவதால் எபிரெய மறுப்பு நவீனத் தமிழில் தெளிவாகவும் இயல்பாகவும் வருகிறது.
- source_word: וָאֶשְׁפֹּךְ אֶת נַפְשִׁי
  choice: என் உயிரையே ... ஊற்றினேன்
  rationale: தீவிரமான ஜெபத்தில் தன்னையே முழுமையாக வெளிப்படுத்துவதைச் சொல்லும் உருவகத்தைப் பாதுகாக்கிறது. נֶפֶשׁ என்பதன் உயிர்/தன் என்ற பரப்பையும் ‘உயிரையே’ நெருக்கமாகக் கொண்டுவருகிறது.
- source_word: לִפְנֵי יְהוָה
  choice: யாவே முன்னிலையில்
  rationale: לִפְנֵי என்பதன் ‘முன்னிலையில்’ என்ற பொருளையும், יהוה என்ற உடன்படிக்கைப் பெயரையும் நேரடியாகப் பாதுகாக்கிறது.
- source_word: וַתַּעַן חַנָּה וַתֹּאמֶר
  choice: அதற்கு அன்னாள் ... மறுமொழி சொன்னாள்
  rationale: இரட்டை எபிரெய வினைச்சொல் ஒரு வழக்கமான மறுமொழிச் சூத்திரம். தமிழில் தேவையற்ற இரட்டிப்பைத் தவிர்த்தபடியே பதிலளிக்கும் செயலை வெளிப்படுத்துகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் பொதுப் பட்டம் அல்ல, நான்கெழுத்து உடன்படிக்கைப் பெயரே நேரடியாக உள்ளது. ஆகவே பெயரைப் பெயராகவே ஒலிபெயர்த்துள்ளது.
- issue: נֶפֶשׁ குறிக்கும் ஜெப அனுபவம்
  choice: என் உயிரையே ... ஊற்றினேன்
  alternative: என் இதயத்தைத் திறந்து சொன்னேன்
  rationale: மாற்றுச் சொற்றொடர் பொருளை விளக்கினாலும், மூலத்தின் வலிமையான ‘ஊற்றுதல்’ உருவகத்தையும் נֶפֶשׁ என்பதையும் குறைத்துவிடும்; அதனால் மூல உருவகம் பாதுகாக்கப்பட்டது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகருக்குப் புரியும் மரியாதையான நடையைக் கடைப்பிடிக்கிறது. ‘ஐயா’ சமூக மரியாதையையும், ‘யாவே முன்னிலையில்’ மூலத்தின் இறைப்பெயர் மற்றும் முன்னிலை உருவகத்தையும் பாதுகாக்கின்றன. அனைத்து அடிக்குறிப்பு குறிகளும் தொடர்புடைய சொற்றொடர்களுக்குப் பின்னர் இடப்பட்டுள்ளன.
