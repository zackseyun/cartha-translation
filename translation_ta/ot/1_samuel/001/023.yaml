base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/023.yaml
  text: And Elqanah her husband said to her[a], “Do what seems good in your eyes. Stay until you have weaned him; only may Yahweh establish his word.” So the woman stayed and nursed her son until she had weaned him.
translation:
  language: ta
  text: அவளுடைய கணவனான எல்க்கானா அவளிடம், “உன் பார்வைக்கு நல்லதாகத் தோன்றுவதைச் செய். அவனைப் பால் மறக்கச் செய்யும்வரை தங்கியிரு. மட்டும் யாவே தம் வார்த்தையை நிலைநிறுத்துவாராக[a]” என்றான். ஆகவே அந்தப் பெண் தங்கியிருந்து, தன் மகனைப் பால் மறக்கச் செய்யும்வரை அவனுக்குப் பாலூட்டினாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “நிலைநிறுத்துவாராக” என்பதற்கு “உறுதிப்படுத்துவாராக” அல்லது “நிறைவேற்றுவாராக” என்றும் மொழிபெயர்க்கலாம். “தம் வார்த்தை” என்பது யாவேவின் வாக்குறுதியையோ, இச்சூழலில் இப்போது பேசப்பட்ட காரியத்தையோ குறிக்கக்கூடும்.
    reason: மாற்று மொழிபெயர்ப்பையும் மூலத்தின் பொருள் தெளிவின்மையையும் பதிவு செய்தல்
lexical_decisions:
- source_word: אִישָׁהּ
  choice: அவளுடைய கணவன்
  rationale: சூழலில் இந்தச் சொல் எல்க்கானாவுக்கும் அன்னாளுக்கும் இடையிலான திருமண உறவைக் குறிக்கிறது; ஆகவே நவீன தமிழில் இயல்பான ‘அவளுடைய கணவன்’ பயன்படுத்தப்பட்டது.
- source_word: עֲשִׂי הַטּוֹב בְּעֵינַיִךְ
  choice: உன் பார்வைக்கு நல்லதாகத் தோன்றுவதைச் செய்
  rationale: தனக்குச் சரியென்று அல்லது சிறந்ததென்று தோன்றுவதைச் செய்வது என்ற எபிரெய மரபுத்தொடரின் உருவகத்தைத் தமிழில் இயன்றவரை தக்கவைக்கிறது.
- source_word: שְׁבִי
  choice: இங்கேயே இரு
  rationale: இங்கு உட்காருதல் அல்ல, தற்போதைய இடத்திலேயே தங்கியிருத்தல் பொருள்; ‘இங்கேயே இரு’ சூழலைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: עַד גָּמְלֵךְ אֹתוֹ / עַד גָּמְלָהּ אֹתוֹ
  choice: அவனைப் பால்மறக்கச் செய்யும்வரை / தன் மகனைப் பால்மறக்கச் செய்யும்வரை
  rationale: குழந்தைப் பராமரிப்புச் சூழலில் גמל என்பது பாலூட்டுவதை நிறுத்திப் பழக்குவதைத் தெளிவாகக் குறிக்கிறது.
- source_word: אַךְ
  choice: ஆனால்
  rationale: முன்னுள்ள அனுமதிக்கு அடுத்ததாக வரும் வேண்டுதல் அல்லது நிபந்தனைசார் திருப்பத்தை இயல்பான தமிழில் காட்டுகிறது; எபிரெயச் சொல்லின் கட்டுப்படுத்தும் நுணுக்கம் தொடரமைப்பில் காக்கப்படுகிறது.
- source_word: יָקֵם
  choice: நிலைநிறுத்துவாராக
  rationale: קום வினையின் ஹிஃபில் வடிவத்தையும் வேண்டுதல் சார்ந்த யுசிவ் நுணுக்கத்தையும் பிரதிபலிக்கிறது; உறுதிப்படுத்துதல் அல்லது நிறைவேற்றுதல் என்ற இரு சாத்தியங்களையும் முற்றிலும் மூடுவதில்லை.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: தெய்வீகப் பெயரை ஒரு பொதுப் பட்டமாக மாற்றாமல், தமிழில் பரவலாக அறியப்பட்ட பெயர்வடிவில் தருகிறது.
- source_word: דְּבָרוֹ
  choice: தமது வார்த்தை
  rationale: ‘வாக்குறுதி’ அல்லது குறிப்பிட்ட ‘காரியம்’ என்று விளக்கமாக முடிவுசெய்யாமல், எபிரெயில் உள்ள ‘அவருடைய வார்த்தை’ என்ற தெளிவின்மையைப் பாதுகாக்கிறது.
- source_word: וַתֵּינֶק
  choice: பாலூட்டினாள்
  rationale: குழந்தைக்கு பால் கொடுத்து வளர்த்தல் என்ற வினையின் நேரடியான, இயல்பான நவீனத் தமிழ் வடிவம்.
- source_word: הָאִשָּׁה
  choice: அந்தப் பெண்
  rationale: மூலத்தில் பெயர்ச்சொல் அல்லாமல் சுட்டப்பட்ட பொதுப்பெயரே உள்ளது; தமிழ் உரையில் முன் குறிப்பிடப்பட்ட அன்னாளைத் தெளிவாகச் சுட்ட ‘அந்தப் பெண்’ என வழங்கப்பட்டது.
theological_decisions:
- issue: எல்க்கானா கூறும் ‘தமது வார்த்தை’ எதைக் குறிக்கிறது?
  choice: ‘தமது வார்த்தை’ என்று தெளிவின்மையுடன் வைக்கப்பட்டது.
  alternative: ‘தமது வாக்குறுதி’, ‘குழந்தையைப் பற்றிய வார்த்தை’, அல்லது அன்னாளின் பொருத்தனையை யெகோவா உறுதிப்படுத்துவது
  rationale: எபிரெய உரை דְּבָרוֹ, ‘அவருடைய வார்த்தை’ என்றே கூறுகிறது. அது யெகோவாவின் வாக்குறுதியையா அல்லது இச்சூழலில் சொல்லப்பட்ட காரியத்தையா குறிக்கிறது என்பது உறுதியாகத் தீர்மானிக்கப்படாததால், மொழிபெயர்ப்பு அதை விளக்கி முடிவுசெய்யவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், வாசிக்க எளிதானதும் மதிப்புமிக்கதுமான நடையில் மொழிபெயர்க்கப்பட்டது. எபிரெய மரபுத்தொடர் இயன்றவரை காக்கப்பட்டாலும், ‘இங்கேயே இரு’, ‘பால்மறக்கச் செய்யும்வரை’ போன்ற இயல்பான தமிழ்ச் சொற்றொடர்கள் பயன்படுத்தப்பட்டன. தெய்வீகப் பெயருக்கு தமிழில் பரவலாக அறியப்பட்ட ‘யெகோவா’ வடிவம் பயன்படுத்தப்பட்டது.
