base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/028.yaml
  text: So I also have given him to Yahweh[a]; all the days that he lives[b], he is given to Yahweh.” And he worshiped Yahweh there.
translation:
  language: ta
  text: “நானும் அவனை யாவேக்குக் கொடுத்திருக்கிறேன்[a]. அவன் வாழும் நாளெல்லாம், அவன் யாவேக்குக் கொடுக்கப்பட்டவன்.” அவன் அங்கே யாவேயை வழிபட்டான்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அவனை யாவேக்கு இரவலாகக் கொடுத்திருக்கிறேன்’ அல்லது ‘அவனை யாவேக்கு அர்ப்பணித்திருக்கிறேன்’ என்றும் மொழிபெயர்க்கலாம். இங்கு வரும் எபிரெய வினை, இவ்வதிகாரத்தில் முன்பு வரும் ‘கேட்டேன்’ என்ற சொல்லின் அதே வேரிலிருந்து வந்ததால் ஒரு சொல்விளையாட்டு உருவாகிறது.
    reason: lexical_alternative
  - marker: b
    text: ‘அவர்கள் அங்கே யாவேயை வழிபட்டார்கள்’ என்றும் சில மொழிபெயர்ப்பு மரபுகள் புரிந்துகொள்கின்றன.
    reason: alternative_reading
lexical_decisions:
- source_word: הִשְׁאִלְתִּהוּ
  choice: அவனை ... கொடுத்திருக்கிறேன்
  rationale: இந்தச் சூழலில் அன்னாள் சாமுவேலை யாவேக்கு வாழ்நாள் முழுவதும் ஒப்புக்கொடுப்பதையே வினை குறிக்கிறது. இயல்பான நவீனத் தமிழுக்காக ‘கொடுத்திருக்கிறேன்’ என மொழிபெயர்க்கப்பட்டது; שׁאל என்ற வேர்ச்சொல்லால் உருவாகும் ‘கேட்டல்/கொடுத்தல்’ சொல்விளையாட்டு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: לַיהוָה
  choice: யாவேக்கு
  rationale: לְ முன்னொட்டு இங்கு திசை/பெறுநர் பொருளைத் தருகிறது; יהוה என்ற உடன்படிக்கைப் பெயர் ‘யாவே’ என்று ஒலிபெயர்க்கப்படுகிறது.
- source_word: כָּל הַיָּמִים אֲשֶׁר הָיָה
  choice: அவன் வாழும் நாளெல்லாம்
  rationale: வாழ்நாள் முழுவதையும் குறிக்கும் எபிரெயச் சொற்றொடருக்கான இயல்பான, தெளிவான தமிழ் வடிவம்.
- source_word: שָׁאוּל
  choice: கொடுக்கப்பட்டவன்
  rationale: முன்னுள்ள הִשְׁאִלְתִּהוּ உடன் ஒரே שׁאל வேரைத் திரும்பக் கூறும் செயல்பெயரடை. தமிழிலும் ‘கொடுத்திருக்கிறேன்/கொடுக்கப்பட்டவன்’ என்ற மீளுரையை வைத்துப் பொருள் தொடர்பு ஓரளவு பாதுகாக்கப்படுகிறது.
- source_word: וַיִּשְׁתַּחוּ
  choice: வழிபட்டான்
  rationale: வினை உடலைத் தாழ்த்திப் பணிவதையும் வழிபடுவதையும் குறிக்கலாம். யாவே நோக்கிச் செய்யப்படும் செயலாக இருப்பதால் ‘வழிபட்டான்’ சூழலுக்குப் பொருத்தமானது; ஒருமை வடிவம் பிரதான உரையில் பின்பற்றப்படுகிறது.
- source_word: שָׁם
  choice: அங்கே
  rationale: இடத்தைக் குறிக்கும் எளிய வினையடை; நவீனத் தமிழில் இயல்பான இணைச்சொல்.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: எபிரெய உரையில் நான்கெழுத்து இறைப் பெயர் நேரடியாக உள்ளது. பொதுப்பட்டத்தைப் பயன்படுத்தாமல் உடன்படிக்கைப் பெயரைத் தமிழில் ஒலிபெயர்ப்பது மூல உரையின் தனித்தன்மையைப் பாதுகாக்கிறது.
- issue: וַיִּשְׁתַּחוּ என்பதன் எழுவாய்
  choice: அவன் அங்கே யாவேயை வழிபட்டான்
  alternative: அவர்கள் அங்கே யாவேயை வழிபட்டார்கள்
  rationale: மசோரா உயிர்க்குறியீட்டில் வினை ஒருமையாகப் புரிந்துகொள்ளப்படுகிறது; ஆனால் எழுவாய் வெளிப்படையாகக் குறிப்பிடப்படவில்லை, மேலும் சில மொழிபெயர்ப்பு மரபுகள் பன்மையாக எடுத்துள்ளன. ஆகவே ஒருமை பிரதான உரையிலும் பன்மை அடிக்குறிப்பிலும் தரப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், எளிமையும் கண்ணியமும் கொண்ட நடையில் வடிவமைக்கப்பட்டது. ‘அர்ப்பணித்தேன்’ என்ற சமயச் சிறப்புச்சொல்லை பிரதான உரையில் தவிர்த்து, மூலத்தின் ‘கொடுத்தல்’ உருவகத்தையும் மீளுரையையும் இயன்றவரை வைத்திருக்கிறது. இறைப் பெயர் ‘யாவே’ எனத் தொடர்ந்து ஒலிபெயர்க்கப்பட்டுள்ளது.
