source:
  edition: WLC
  text: וַ/תַּעֲלֵ֨/הוּ עִמָּ֜/הּ כַּ/אֲשֶׁ֣ר גְּמָלַ֗תּ/וּ בְּ/פָרִ֤ים שְׁלֹשָׁה֙ וְ/אֵיפָ֨ה אַחַ֥ת קֶ֨מַח֙ וְ/נֵ֣בֶל יַ֔יִן וַ/תְּבִאֵ֥/הוּ בֵית יְהוָ֖ה שִׁל֑וֹ וְ/הַ/נַּ֖עַר נָֽעַר־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/024.yaml
  text: When she had weaned him[a], she took him up with her, with three bulls, one ephah of flour, and a skin of wine, and brought him to the house of Yahweh at Shiloh. Now the boy was young.
translation:
  language: ta
  text: அவள் அவனுக்குப் பால்குடியை நிறுத்தியபின், மூன்று காளைகளையும்[a], ஓர் எப்பா மாவையும், திராட்சை மதுவின் ஒரு தோற்பையையும் எடுத்துக்கொண்டு, அவனைத் தன்னுடன் சீலோவிலுள்ள யாவேயின் இல்லத்திற்குக் கொண்டுபோனாள். அந்தப் பையன் இன்னும் சிறுவனாக இருந்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரெய மசோரெட்டிக் உரை: “மூன்று காளைகள்”; சில பழங்காலச் சான்றுகளும் உரைவிளக்க மரபுகளும் “மூன்று வயதான ஒரு காளை” என்று வாசிக்கின்றன.'
    reason: textual_variant
lexical_decisions:
- source_word: וַתַּעֲלֵהוּ עִמָּהּ
  choice: அவனைத் தன்னுடன் ... கொண்டுபோனாள்
  rationale: עלה என்பதன் மேலே செல்லும் திசைநுணுக்கம் இங்கு திருத்தலப் பயணத்தில் அடங்கியுள்ளது; தமிழில் இயல்பாகவும் அடுத்துவரும் ‘கொண்டுவந்தாள்’ என்ற வருகை வினையின் பொருளையும் உள்ளடக்கவும் இவ்வாறு மொழிபெயர்க்கப்பட்டது.
- source_word: כַּאֲשֶׁר גְּמָלַתּוּ
  choice: அவள் அவனைப் பால்மறக்கச் செய்தபின்
  rationale: இந்தச் சூழலில் גמל குழந்தைக்குப் பாலூட்டுவதை நிறுத்துவதைக் குறிக்கிறது; காலத் தொடர்பும் தெளிவாகக் காட்டப்பட்டுள்ளது.
- source_word: בְּפָרִים שְׁלֹשָׁה
  choice: மூன்று காளைகளையும்
  rationale: மசோரெட்டிக் எபிரெய உரையின் நேரடியான வாசகம் ‘மூன்று காளைகள்’; மாற்று வாசகம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
- source_word: וְאֵיפָה אַחַת קֶמַח
  choice: ஓர் எப்பா மாவையும்
  rationale: எப்பா என்பது பழங்கால உலர் அளவை; ஊகமான நவீன அளவாக மாற்றாமல் ஒலிபெயர்க்கப்பட்டது. קֶמַח என்பதற்கு இயல்பான ‘மாவு’ பயன்படுத்தப்பட்டது.
- source_word: וְנֵבֶל יַיִן
  choice: ஒரு தோற்பை திராட்சை மதுவையும்
  rationale: נֵבֶל இங்கு திரவத்தை வைத்துச் செல்லும் தோலாலான கொள்கலனைக் குறிக்கிறது; ‘திராட்சை மது’ என்பது יַיִן என்பதன் பொருளைத் தெளிவாகத் தருகிறது.
- source_word: בֵית יְהוָה שִׁלוֹ
  choice: சீலோவிலுள்ள யாவேயின் இல்லத்திற்கு
  rationale: இடப்பெயரும் தெய்வீகப் பெயரும் ஒலிபெயர்க்கப்பட்டு, தமிழில் இயல்பான இடத்தொடராக அமைக்கப்பட்டுள்ளன.
- source_word: וְהַנַּעַר נָעַר
  choice: அந்தப் பையன் இன்னும் சிறுவனாக இருந்தான்
  rationale: נער என்ற சொல்லின் எபிரெய மறுபடியுரைத்தல் சாமுவேலின் இளம் வயதை வலியுறுத்துகிறது; தமிழில் செயற்கையான சொல் மறுபடியுரைத்தலைத் தவிர்த்து அதன் வலியுறுத்தல் இயல்பாகத் தரப்பட்டுள்ளது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: எபிரெய மூலத்தில் தனிப்பட்ட இறைப்பெயரான நான்கெழுத்துப் பெயர் நேரடியாக உள்ளது; அதை ஒரு பட்டப்பெயரால் மாற்றாமல், நவீன தமிழில் பரவலாகப் புரிந்துகொள்ளக்கூடிய ஒலிபெயர்ப்பாக ‘யாவே’ பயன்படுத்தப்பட்டுள்ளது.
- issue: בְּפָרִים שְׁלֹשָׁה என்ற வாசகம்
  choice: மூன்று காளைகள்
  alternative: மூன்று வயதான ஒரு காளை
  rationale: WLC மசோரெட்டிக் உரை பன்மையில் ‘மூன்று காளைகள்’ என்று வாசிக்கிறது. சில பழங்காலச் சான்றுகளில் காணப்படும் ஒருமை மாற்று வாசகம் முதன்மை உரையை மாற்றாமல் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
translation_notes:
  register: நவீன தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டது. பழங்கால அளவான ‘எப்பா’ மாற்றமின்றி வைக்கப்பட்டது; உரைவேறுபாட்டுக்கான குறி அது சார்ந்த ‘மூன்று காளைகள்’ என்ற தொடருக்குப் பின்னரே இடப்பட்டுள்ளது.
