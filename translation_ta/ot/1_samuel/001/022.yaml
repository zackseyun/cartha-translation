base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/022.yaml
  text: But Hannah did not go up[a], for she said to her husband, “Not until the boy is weaned will I bring him[b], so that he may appear before Yahweh and stay there forever.”
translation:
  language: ta
  text: அன்னாளோ ஏறிப்போகவில்லை. ஏனெனில் அவள் தன் கணவனிடம், “சிறுவன் பால் மறந்த பிறகே நான் அவனைக் கொண்டுபோவேன்; அவன் யாவேவின் முன்னிலையில் தோன்றி[a], அங்கே என்றென்றும்[b] தங்கியிருப்பான்” என்றாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'வேறொரு உரைக்கட்டமைப்பு அல்லது உரைமரபின்படி: “நான் யாவேவின் முன்னிலையில் தோன்றுவேன்; அவன் அங்கே என்றென்றும் தங்கியிருப்பான்.”'
    reason: alternative_reading
  - marker: b
    text: இங்கு “என்றென்றும்” என்பது சாமுவேல் யாவேவின் பணிக்காக நிரந்தரமாக அர்ப்பணிக்கப்பட்டதை, அதாவது சாமுவேலின் வாழ்நாள் முழுவதையும் குறிக்கிறது.
    reason: cultural_note
lexical_decisions:
- source_word: עָלָתָה
  choice: ஏறிப்போகவில்லை
  rationale: வழிபாட்டிடத்திற்குச் செல்வதை எபிரெயம் ‘மேலே போதல்’ என்று கூறுகிறது. இலக்கை வசனத்திற்குள் சேர்க்காமல் அந்தப் பயணச் சொல்லாட்சியைத் தமிழில் காக்கிறது.
- source_word: כִּי אָמְרָה לְאִישָׁהּ
  choice: ஏனெனில் அவள் தன் கணவனிடம் … என்றாள்
  rationale: அன்னாள் போகாததற்கான காரணத்தைத் தெளிவாக இணைக்கிறது; இச்சூழலில் אִישׁ என்பது ‘கணவன்’ எனப் பொருள்படுகிறது.
- source_word: עַד יִגָּמֵל הַנַּעַר
  choice: சிறுவன் பால்மறந்த பிறகே
  rationale: עַד என்பதன் ‘அதுவரை அல்ல’ என்ற கால வரம்பையும், Niphal יִגָּמֵל என்பதன் பால்மறத்தலையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: וַהֲבִאֹתִיו
  choice: நான் அவனைக் கொண்டுபோவேன்
  rationale: பால்மறந்த பின்னர் அன்னாள் சிறுவனை வழிபாட்டிடத்திற்குக் கொண்டுசெல்லும் நோக்கத்தைக் குறிக்கிறது.
- source_word: הַנַּעַר
  choice: சிறுவன்
  rationale: இங்கு சாமுவேல் இன்னும் இளம் குழந்தையாக இருப்பதால், நַעַר என்பதற்கு இயல்பான, மரியாதையான நவீனத் தமிழ்ச் சொல்.
- source_word: וְנִרְאָה אֶת־פְּנֵי יְהוָה
  choice: அவன் யாவேவின் முன்னிலையில் தோன்றி
  rationale: மசோரா உயிர்க்குறிப்பின்படி வினையின் எழுவாய் சிறுவன்; வழிபாட்டுச் சூழலில் உள்ள ‘யாவேவின் முகத்துக்கு முன் தோன்றுதல்’ என்ற மரபுத்தொடரை இயல்பான தமிழில் தருகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இஸ்ரவேலின் தேவனுடைய தனிப்பெயரை ஒரு பட்டப்பெயரால் மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: וְיָשַׁב שָׁם
  choice: அங்கே … தங்கியிருக்க
  rationale: יָשַׁב இங்கு தொடர்ந்து வசித்து ஊழியம் செய்வதைக் குறிக்கிறது; ‘தங்கியிருக்க’ என்பது தெளிவான நவீனத் தமிழ்.
- source_word: עַד עוֹלָם
  choice: என்றென்றும்
  rationale: எபிரெயச் சொல்லின் நீடித்த கால உணர்வைக் காக்கிறது; இச்சூழலில் அது சாமுவேலின் வாழ்நாள் முழுவதுமான அர்ப்பணிப்பைக் குறிக்கிறது.
theological_decisions:
- issue: ‘யாவேவின் முன்னிலையில் தோன்றுதல்’ மற்றும் ‘அங்கே தங்கியிருத்தல்’ ஆகியவற்றின் எழுவாய்
  choice: 'இரண்டிற்கும் சாமுவேலே எழுவாய்: ‘அவன் … தோன்றி … தங்கியிருக்க’'
  alternative: ‘நான் யாவேவின் முன்னிலையில் தோன்றுவேன்; அவன் அங்கே என்றென்றும் தங்கியிருப்பான்’ என்று அன்னாளை முதல் வினையின் எழுவாயாகக் கொள்ளுதல்
  rationale: WLC மசோரா உரையின் உயிர்க்குறிப்பும், ‘அவனைக் கொண்டுபோவேன்’ என்பதற்குப் பின் வரும் வினைத்தொடரின் இயல்பான ஓட்டமும் சிறுவனையே எழுவாயாக ஆதரிக்கின்றன. இருப்பினும் வேறொரு உரைக்கட்டமைப்பு/உரைமரபு அன்னாளை முதல் வினையின் எழுவாயாகக் கொள்வதால் அது அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: ‘என்றென்றும்’ என்பதன் கால அளவு
  choice: மூலத்தின் עַד עוֹלָם என்பதைக் ‘என்றென்றும்’ என்று வைத்துக் கொண்டு, சூழல்சார் பொருளை அடிக்குறிப்பில் விளக்குதல்
  alternative: முதன்மை உரையிலேயே ‘வாழ்நாள் முழுவதும்’ என்று விளக்கமாக மொழிபெயர்த்தல்
  rationale: மூலத்தின் விரிவான, நீடித்த காலச் சொல்லைச் சுருக்காமல் காக்கிறது; கதையின் சூழலில் சாமுவேலின் நிரந்தர அர்ப்பணிப்பு அவரது மீதமுள்ள வாழ்நாள் முழுவதையும் குறிக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் வடிவமைக்கப்பட்டது. ‘அன்னாளோ’ எதிர்மறை மாறுபாட்டைத் தெளிவாக்குகிறது; ‘ஏறிப்போகவில்லை’ மூலத்தின் பயண உருவகத்தைப் பாதுகாக்கிறது. நீண்ட எபிரெய வாக்கியம் வாசிப்புத் தெளிவுக்காக இரண்டு நேர்கூற்று வாக்கியங்களாகப் பிரிக்கப்பட்டுள்ளது; பொருள்தொடர் காக்கப்பட்டுள்ளது.
