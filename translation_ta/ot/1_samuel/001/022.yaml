  to: அன்னாளோ ஏறிப்போகவில்லை. ஏனெனில் அவள் தன் கணவனிடம், “சிறுவன் பால் மறந்த பிறகே நான் அவனைக் கொண்டுபோவேன்; அவன் யாவேவின் முன்னிலையில் தோன்றி[a], அங்கே என்றென்றும்[b] தங்கியிருப்பான்” என்றாள்.
  rationale: மூலத்தில் ஒருமுறை மட்டுமே உள்ள ‘கொண்டுபோவேன்’ என்பதை ஒருமுறையாகச் செய்து, அதைத் தொடர்ந்து வரும் வினைகளைச் சிறுவனின் செயல்களாகத் தெளிவாக அமைத்துள்ளேன். WLC-யின் வாசிப்பில் உள்ள எழுவாய் தொடர்பான மாற்று விளக்கத்தை அடிக்குறிப்பு a பாதுகாக்கிறது; עַד עוֹלָם என்பதன் விரிவான மொழிபெயர்ப்பான ‘என்றென்றும்’ அடிக்குறிப்பு b-உடன் காக்கப்படுகிறது.
