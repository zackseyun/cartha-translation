  text: וַ/תָּ֣קָם חַנָּ֔ה אַחֲרֵ֛י אָכְלָ֥ה בְ/שִׁלֹ֖ה וְ/אַחֲרֵ֣י שָׁתֹ֑ה וְ/עֵלִ֣י הַ/כֹּהֵ֗ן יֹשֵׁב֙ עַל הַ/כִּסֵּ֔א עַל מְזוּזַ֖ת הֵיכַ֥ל יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/009.yaml
  text: After they had eaten in Shiloh[a], and after they had drunk, Hannah rose. Now Eli the priest was sitting on the seat by the doorpost of the temple of Yahweh.
translation:
  language: ta
  text: சீலோவில் சாப்பிட்டு, குடித்த பின்பு அன்னாள் எழுந்தாள். அப்போது ஆசாரியனாகிய ஏலி, யாவேயின் ஆலயக் கதவுநிலையின் அருகே இருந்த இருக்கையில் அமர்ந்திருந்தான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யாவேயின் திருத்தலம்.”
    reason: הֵיכָל என்பதற்கு இச்சூழலில் ‘ஆலயம்’ அல்லது ‘திருத்தலம்’ எனப் பொருள் கொள்ளலாம்.
lexical_decisions:
- source_word: וַתָּקָם
  choice: எழுந்தாள்
  rationale: קום என்பதன் Qal wayyiqtol வடிவம் அன்னாள் எழுந்து அடுத்த செயலில் ஈடுபடுவதைச் சுருக்கமாகவும் இயல்பாகவும் குறிக்கிறது.
- source_word: אַחֲרֵי אָכְלָה ... וְאַחֲרֵי שָׁתֹה
  choice: அவர்கள் சாப்பிட்டுக் குடித்த பின்பு
  rationale: இரண்டு காலக் கூறுகளையும் இயல்பான தமிழில் ஒன்றிணைக்கிறது. சுற்றியுள்ள குடும்ப விருந்து சூழல் பன்மை எழுவாயை ஆதரிக்கிறது; அன்னாளை மட்டும் எழுவாயாகக் கொள்ளும் வாய்ப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: בְשִׁלֹה
  choice: சீலோவில்
  rationale: ב என்ற இடப்பொருள் முன்னிடைச்சொல்லையும் சீலோ என்ற இடப்பெயரையும் நேரடியாகவும் இயல்பாகவும் தருகிறது.
- source_word: וְעֵלִי הַכֹּהֵן
  choice: அப்போது ஆசாரியனான ஏலி
  rationale: இணைப்புச் சொல் இங்கு அடுத்த நிகழ்வை மட்டும் கூறாமல் பின்னணிக் காட்சியை அறிமுகப்படுத்துகிறது; ‘அப்போது’ அந்தச் செயல்பாட்டைத் தெளிவாக்குகிறது.
- source_word: יֹשֵׁב
  choice: அமர்ந்திருந்தான்
  rationale: எபிரெயப் பெயரெச்சம் தொடர்ந்து நிலவிய உடல் நிலையைக் காட்டுவதால், தமிழின் தொடர்நிலை இறந்தகால வடிவம் பொருத்தமானது.
- source_word: עַל הַכִּסֵּא
  choice: இருக்கையில்
  rationale: כִּסֵּא இங்கு பொதுவான அமரும் இருக்கையைக் குறிக்கிறது; ‘சிங்காசனம்’ என்பது தேவையற்ற அரசப் பொருளைச் சேர்க்கும்.
- source_word: עַל מְזוּזַת
  choice: வாசல் நிலைக்கு அருகே
  rationale: מְזוּזָה என்பது வாசலின் பக்க நிலை அல்லது கதவு நிலை. இவ்விடச்சூழலில் עַל என்பதற்கு ‘அருகே’ என்பது இயல்பான தமிழ்.
- source_word: הֵיכַל יְהוָה
  choice: யாவேயின் ஆலயம்
  rationale: הֵיכָל ஒரு பெரிய வழிபாட்டுக் கட்டிடத்தை அல்லது திருத்தலத்தைக் குறிக்கலாம். முதன்மை உரையில் ‘ஆலயம்’ இயல்பாக உள்ளது; ‘திருத்தலம்’ என்ற மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தேவனுடைய தனிப்பெயரான நான்கெழுத்துப் பெயரைப் பட்டப்பெயரால் மாற்றாமல், தமிழில் பரவலாகப் புரியக்கூடிய ஒலிபெயர்ப்பாக வழங்குகிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: யெகோவா
  rationale: மூலத்தில் உள்ள தனிப்பெயரை ஒரு பட்டப்பெயராக மாற்றாமல் ஒலிபெயர்க்கிறது; மாற்று உச்சரிப்பைத் தேர்ந்தெடுத்து தனிப்பட்ட கோட்பாட்டைச் சேர்ப்பதைத் தவிர்க்கிறது.
- issue: சீலோவிலுள்ள הֵיכַל என்பதன் பொருள்
  choice: ஆலயம்
  alternative: திருத்தலம்
  rationale: הֵיכָל என்பதற்கு ஆலயம் அல்லது திருத்தலம் எனப் பொருள் இருக்கலாம். சாலொமோனுக்கு முந்தைய சீலோ சூழல் காரணமாக ‘திருத்தலம்’ சாத்தியமானது; அந்த நுணுக்கம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: உண்டதும் குடித்ததும் யாரைக் குறிக்கிறது
  choice: குடும்பக் குழுவைக் குறிக்கும் பன்மை
  alternative: அன்னாளைக் குறிக்கும் ஒருமை
  rationale: விருந்து பற்றிய விரிந்த சூழல் பன்மை வாசிப்பை ஆதரிக்கிறது; எனினும் எபிரெய வடிவங்களை அன்னாளை எழுவாயாகக் கொண்டும் புரிந்துகொள்ள முடிவதால் மாற்று வாசிப்பு அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியும் ஆனால் மரியாதைமிக்க நடையில் வடிவமைக்கப்பட்டது. ‘ஆசாரியன்’, ‘ஆலயம்’, ‘வாசல் நிலை’ ஆகியவை வேதாகமச் சூழலின் கண்ணியத்தைத் தக்கவைத்தபடியே பொதுவாசகருக்குப் புரியுமாறு தேர்ந்தெடுக்கப்பட்டன.
