base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/020.yaml
  text: And in due time Hannah conceived and bore a son[a], and she called his name Samuel, for she said[b], “I asked for him from Yahweh.”
translation:
  language: ta
  text: உரிய காலம் வந்தபோது[a] அன்னாள் கருவுற்று ஒரு மகனைப் பெற்றெடுத்தாள். அவள் அவனுக்குச் சாமுவேல் என்று பெயரிட்டு, “நான் அவனை யாவேயிடம் கேட்டேன்” என்றாள்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரெயத்தில் சொல்லுக்குச் சொல்: “நாட்களின் சுழற்சி/திருப்பம் வந்தபோது”; அதாவது, உரிய காலம் வந்தபோது.'
    reason: lexical_alternative
  - marker: b
    text: '“சாமுவேல்” என்ற பெயரை இங்கு “கேட்டேன்” (שׁאל) என்ற எபிரெய வினையுடன் சொல்விளையாட்டாக இணைக்கிறது: “நான் அவனை யாவேயிடம் கேட்டேன்.” பெயரின் துல்லியமான சொற்பிறப்பியல் குறித்து கருத்து வேறுபாடு உள்ளது.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לִתְקֻפוֹת הַיָּמִים
  choice: காலம் நிறைவடைந்தபோது
  rationale: சொல்லுக்குச் சொல் பார்த்தால் ‘நாட்களின் சுழற்சி/திருப்பம்’ எனும் இச்சொற்றொடர், உரிய காலம் வந்ததை உணர்த்தும் எபிரெய மரபுத்தொடர். இயல்பான தமிழில் அதன் காலப் பொருளைத் தெளிவாகத் தருகிறது.
- source_word: וַתַּהַר
  choice: கருவுற்று
  rationale: பிறப்பு நிகழ்வுகளில் הרה என்பதற்கான தெளிவான, இயல்பான தமிழ் இணை.
- source_word: וַתֵּלֶד בֵּן
  choice: ஒரு மகனைப் பெற்றெடுத்தாள்
  rationale: ילד + בן என்பதன் பொருளை நவீனத் தமிழில் நேரடியாகவும் இயல்பாகவும் வழங்குகிறது.
- source_word: וַתִּקְרָא אֶת־שְׁמוֹ
  choice: அவனுக்கு ... என்று பெயரிட்டு
  rationale: எபிரெயப் பெயரிடும் சூத்திரத்தின் பொருளைக் காத்து, தமிழில் இயல்பாக அமைக்கப்பட்டுள்ளது.
- source_word: שְׁמוּאֵל
  choice: சாமுவேல்
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் பரவலாக நிலைபெற்றுள்ள பெயர்வடிவம்.
- source_word: כִּי מֵיְהוָה שְׁאִלְתִּיו
  choice: “நான் அவனை யாவேவிடம் கேட்டுப் பெற்றேன்” என்றாள்
  rationale: שׁאל (‘கேள்/வேண்டு’) என்ற வினையோடு பெயருக்கு உள்ள சொல்விளையாட்டைக் காக்கிறது. ‘பெற்றேன்’ என்பது தமிழில் ‘கேட்டேன்’ என்பதன் நோக்கை இயல்பாகத் தெளிவுபடுத்துகிறது; அது தனியே புதிய இறையியல் காரணத்தைச் சேர்ப்பதில்லை.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய நான்கெழுத்துத் தெய்வீகப் பெயரைப் பட்டப்பெயராக மாற்றாமல் தனிப்பெயராக ஒலிபெயர்க்கிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரின் மொழியாக்கம்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலத்தில் உடன்படிக்கையின் தனிப்பெயர் நேரடியாக உள்ளது; எனவே அதை ஒரு பட்டப்பெயரால் மாற்றாமல் ஒலிபெயர்ப்பது மூலத்தின் வேறுபாட்டைக் காக்கிறது.
- issue: சாமுவேல் என்ற பெயருக்கும் שׁאל (‘கேள்’) என்ற வினைக்கும் உள்ள தொடர்பு
  choice: முதன்மை உரையில் இயல்பான பெயரிடல் விளக்கத்தைக் கொடுத்து, சொல்விளையாட்டை அடிக்குறிப்பில் சுட்டிக்காட்டுதல்
  alternative: சாமுவேல் என்ற பெயருக்கு உறுதியான சொற்பிறப்பியல் பொருளை முதன்மை உரையிலேயே சேர்த்தல்
  rationale: இவ்வசனம் பெயரை שׁאל என்ற வினையுடன் இணைத்தாலும், ‘சாமுவேல்’ என்ற பெயரின் துல்லியமான சொற்பிறப்பியல் விவாதத்திற்குரியது. ஆகவே உரையின் இணைப்பைக் காத்து, அதற்கு மேல் உறுதியான விளக்கத்தைத் திணிக்கவில்லை.
translation_notes:
  register: நவீனத் தரநிலைத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. எபிரெயச் சொற்றொடரின் நேரடி வடிவத்தால் தமிழில் ஏற்படும் செயற்கைத்தன்மை தவிர்க்கப்பட்டாலும், பெயரிடல் விளக்கமும் தெய்வீகப் பெயரும் வெளிப்படையாகக் காக்கப்பட்டுள்ளன.
