revisions:
- from: காலம் நிறைவடைந்தபோது அன்னாள் கருவுற்று ஒரு மகனைப் பெற்றெடுத்தாள்.[a] அவள் அவனுக்கு சாமுவேல் என்று பெயரிட்டு, “நான் அவனை யாவேவிடம் கேட்டுப் பெற்றேன்” என்றாள்.[b]
  to: உரிய காலம் வந்தபோது[a] அன்னாள் கருவுற்று ஒரு மகனைப் பெற்றெடுத்தாள். அவள் அவனுக்குச் சாமுவேல் என்று பெயரிட்டு, “நான் அவனை யாவேயிடம் கேட்டேன்” என்றாள்.[b]
  rationale: The revision removes the added sense ‘received’ so that the naming explanation translates only Hannah’s asking from Yahweh. It also places the temporal footnote anchor directly after the temporal expression and uses a clear idiomatic Tamil rendering of the Hebrew temporal phrase. The supplied Tamil reporting clause “என்றாள்” is retained as a natural way to express the explanation implicit in the Hebrew naming formula.
