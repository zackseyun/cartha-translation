base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/026.yaml
  text: And she said[a], “Please, my lord, as surely as you live, my lord, I am the woman who stood here beside you, praying to Yahweh.
translation:
  language: ta
  text: அவள், “தயவுசெய்து, என் ஆண்டவரே, உங்கள் உயிர்மேல் ஆணையாக, என் ஆண்டவரே, இங்கே உங்களருகில் நின்று யாவேயிடம் ஜெபித்துக்கொண்டிருந்த பெண் நான்தான்” என்றாள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “உங்கள் உயிரைக்கொண்டு” அல்லது இன்னும் சொல்லுக்குச் சொல், “உங்கள் ஆன்மா வாழ்வதாக”; இது உள்ளார்ந்த உறுதியுடன் முறையிடும் ஓர் உறுதிமொழி மரபு.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּי
  choice: தயவுசெய்து கேளுங்கள்
  rationale: நேரடி அழைப்பில் இது இடப்பொருளைத் தராமல், பணிவான வேண்டுகோளை வெளிப்படுத்தும் இடைச்சொல். தமிழில் இயல்பாகவும் மரியாதையாகவும் அமைய இவ்வாறு மொழிபெயர்க்கப்பட்டது.
- source_word: אֲדֹנִי
  choice: என் ஆண்டவரே
  rationale: இது ஏலியை மரியாதையுடன் அழைக்கும் சொல்; இறைவனைக் குறிக்கும் பட்டமல்ல. மூலத்தின் சமூக மரியாதையையும் தனிப்பட்ட அழைப்பையும் காக்கிறது.
- source_word: חֵי נַפְשְׁךָ
  choice: நீங்கள் உயிரோடிருப்பது எவ்வளவு உறுதியோ, அவ்வளவு உறுதியாகச் சொல்கிறேன்
  rationale: அழைக்கப்படுபவரின் உயிரை முன்வைத்து உறுதியளிக்கும் எபிரெய உறுதிமொழி மரபின் பொருளை, நவீன தமிழில் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: הָאִשָּׁה
  choice: பெண்
  rationale: திட்டவட்ட உருபுடன் வரும் இச்சொல், ஏலி முன்பு கண்ட குறிப்பிட்ட பெண்ணாக அன்னாள் தன்னை அடையாளப்படுத்துவதைக் காட்டுகிறது; தமிழில் ‘நான்தான்’ அந்தத் திட்டவட்டத்தைக் கொண்டுவருகிறது.
- source_word: הַנִּצֶּבֶת
  choice: நின்றிருந்த
  rationale: இறந்த நிகழ்வில் தொடர்ந்திருந்த உடல்நிலையையும் இடநிலையையும் இயல்பான தமிழ் பெயரெச்சத் தொடரால் வெளிப்படுத்துகிறது.
- source_word: עִמְּכָה
  choice: உங்களருகில்
  rationale: இச்சூழலில் உடனிருப்பதைக் காட்டிலும் இட அண்மையே கருத்து; ஆகவே ‘உங்களருகில்’ பொருத்தமானது.
- source_word: בָּזֶה
  choice: இங்கே
  rationale: முன்பு ஜெபித்த அதே இடத்தைச் சுட்டும் இடச்சுட்டை இயல்பான தமிழில் தருகிறது.
- source_word: לְהִתְפַּלֵּל
  choice: மன்றாடுவதற்காக
  rationale: யாவேயை நோக்கிச் செய்த வேண்டுதல் நிறைந்த ஜெபச் செயலைக் குறிக்கிறது; நோக்கத்தைக் காட்டும் எபிரெய infinitive-ஐத் தமிழில் இயல்பாகக் காக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: மூலத்தில் உள்ள இறைபெயரை ஒரு பொதுப் பட்டமாக மாற்றாமல், தமிழில் நேரடியாக ஒலிபெயர்க்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைபெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: வசனம் நான்கு எழுத்து இறைபெயரை நேரடியாகப் பயன்படுத்துகிறது. அதை ஒரு பட்டத்தால் மாற்றாமல், பரவலாக ஏற்கப்படும் ஒலியமைப்பின்படி தமிழில் ‘யாவே’ என்று வழங்குவது மூலத்தின் தனிப்பெயர்த் தன்மையைக் காக்கிறது.
- issue: חֵי נַפְשְׁךָ என்ற உறுதிமொழி மரபு
  choice: உறுதியளிக்கும் ஒப்புமையாகப் பொருள் வெளிப்படுத்தப்பட்டது
  alternative: ‘உங்கள் உயிர்மேல் ஆணையாக’ அல்லது சொல்லுக்குச் சொல் ‘உங்கள் ஆன்மா வாழ்வதாக’
  rationale: இது ஏலியின் உயிரைச் சார்ந்த எபிரெய உறுதிமொழி. ‘ஆன்மா’ என்று வழங்குவது இங்கு தேவையற்ற மானுடவியல் பொருளை இறக்கக்கூடும்; ‘ஆணை’ என்பது மூலத்தில் நேரடியாக இல்லாத சொல்லாகும். எனவே அதன் உறுதியான வலியுறுத்தல் காக்கப்பட்டது.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையும் கண்ணியமும் கொண்ட நேரடி உரையாடல் நடை பயன்படுத்தப்பட்டது. ‘என் ஆண்டவரே’ மூலத்தின் பணிவைத் தக்கவைக்கிறது; பழமையான ‘உமது ஜீவனைக் கொண்டு’ போன்ற நடைகள் தவிர்க்கப்பட்டுள்ளன. footnote குறி விளக்கும் உறுதிமொழித் தொடருக்குப் பின்பே வைக்கப்பட்டுள்ளது.
