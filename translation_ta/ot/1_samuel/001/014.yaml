  text: And Eli said to her[b][a], “How long will you be drunk? Put away your wine from you.”
translation:
  language: ta
  text: அப்போது ஏலி அவளிடம், “எவ்வளவு காலம் நீ குடிபோதையில் இருப்பாய்?[a] உன் திராட்சரசத்தை உன்னிடமிருந்து அகற்றிவிடு[b]” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “எவ்வளவு காலம் நீ குடிபோதைக்கு ஆளாகிக்கொண்டிருப்பாய்?” என்றும் மொழிபெயர்க்கலாம். எபிரெய வினை குடிபோதைக்கு ஆளாவதையோ குடிபோதையில் இருக்கும் நிலையையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: சொல்லுக்கு சொல், “உன் திராட்சரசத்தை உன்மேலிருந்து அகற்றிவிடு.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: அப்போது … என்றார்
  rationale: வழக்கமான எபிரெயக் கதைநடைத் தொடர்ச்சியை இயல்பான நவீனத் தமிழில் காட்டுகிறது; காலவரிசையை அளவுக்கு மீறி விளக்கவில்லை.
- source_word: אֵלֶיהָ
  choice: அவளிடம்
  rationale: பெண்பால் ஒருமை பின்னொட்டுடன் வரும் முன்னிடைச்சொல்லின் நேரடியான, இயல்பான தமிழ் வடிவம்.
- source_word: עֵלִי
  choice: ஏலி
  rationale: தனிப்பெயர் தமிழில் வழக்கமான ஒலிபெயர்ப்பு முறையில் தரப்பட்டுள்ளது.
- source_word: עַד מָתַי
  choice: எவ்வளவு காலம்
  rationale: ‘எதுவரை?’ என்ற கால வினாவை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: תִּשְׁתַּכָּרִין
  choice: நீ குடிபோதையில் இருப்பாய்
  rationale: எபிரெய வினை குடிபோதைக்கு ஆளாவதையோ குடிபோதையில் இருக்கும் நிலையையோ குறிக்கலாம்; முதன்மை உரையில் சூழலுக்கு இயல்பான நிலைச்சொல் பயன்படுத்தப்பட்டு, மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: הָסִירִי
  choice: அகற்றிவிடு
  rationale: பெண்பால் ஒருமைக்கான கட்டளையைத் தெளிவாகவும் இயல்பாகவும் வழங்குகிறது.
- source_word: אֶת יֵינֵךְ
  choice: உன் திராட்சரசத்தை
  rationale: இரண்டாம் நபர் பெண்பால் ஒருமை உடைமைப் பின்னொட்டுடன் உள்ள நேரடி செயப்படுபொருளைத் துல்லியமாகக் காட்டுகிறது.
- source_word: מֵעָלָיִךְ
  choice: உன்னிடமிருந்து
  rationale: சொல்லுக்கு சொல் ‘உன் மேலிருந்து’ என்ற உருவகத்தை இயல்பான தமிழில் காக்கிறது; அதன் நேரடி வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
