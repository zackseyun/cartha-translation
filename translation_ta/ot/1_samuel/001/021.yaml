  source_fidelity: 'வரைவின் மையப் பொருள் எபிரெய மூலத்துடன் ஒத்துள்ளது: எல்க்கானாவும் அவனுடைய முழுக் குடும்பத்தாரும் மேலே சென்று யாவேக்கு வருடாந்தரப் பலியைச் செலுத்தவும் அவனுடைய நேர்த்தியைச் சார்ந்த கடமையை நிறைவேற்றவும் சென்றனர். ஆனால் ‘பலியையும் தன் நேர்த்திக்கடனையும் ... செலுத்துவதற்காக’ என்ற ஒரே வினையுடன் இணைப்பது தமிழில் நேர்த்திக்கடனையே பலிபோல் செலுத்துவதாகத் தவறாக ஒலிக்கலாம். மூலத்தில் இரண்டாவது செயல் நீள்வட்டமாக விடப்பட்டிருப்பதால், தமிழில் அதை இயல்பாகத் தெளிவுபடுத்தி, அடிக்குறிப்பில் மூலத்தின் சுருக்கத்தைச் சுட்டுவது பாதுகாப்பானது.'
  naturalness: ‘எல்க்கானா என்ற அந்த மனிதன்’ மற்றும் நீண்ட இடைச்செருகலுடன் அமைந்த சொற்றொடர் நவீனத் தமிழில் சற்று கனமாக உள்ளது. ‘எல்க்கானா என்னும் அந்த மனிதன்’ மற்றும் இரு இணை வினைத்தொடர்கள் தெளிவாகவும் இயல்பாகவும் உள்ளன.
