- from: பின்பு எல்க்கானா என்ற அந்த மனிதன், ஆண்டுதோறும் செலுத்தும் பலியையும் தன் நேர்த்திக்கடனையும்[a] யாவேக்கு செலுத்துவதற்காகத் தன் குடும்பத்தார் அனைவரோடும் மேலே சென்றான்.
  to: பின்பு, எல்க்கானா என்னும் அந்த மனிதன், தன் குடும்பத்தார் அனைவரோடும், யாவேக்கு வருடாந்தர பலியைச் செலுத்தவும் தன் நேர்த்திக்கடனை நிறைவேற்றவும் மேலே சென்றான்.[a]
  rationale: மூலத்தின் ‘மேலே சென்றான்,’ ‘முழுக் குடும்பத்தார்,’ யாவே என்ற இறைப்பெயர், வருடாந்தரப் பலி, மற்றும் நேர்த்தியைச் சார்ந்த நீள்வட்டமான இரண்டாவது கூறு ஆகியவை காக்கப்பட்டுள்ளன. தமிழில் பொருள்மயக்கத்தைத் தவிர்க்க மட்டுமே ‘தன் நேர்த்திக்கடனை நிறைவேற்றவும்’ என்று செயல் வெளிப்படுத்தப்பட்டுள்ளது; அந்த விளக்கத்தின் மூல அடிப்படை அடிக்குறிப்பில் தெளிவாகக் கொடுக்கப்பட்டுள்ளது.
