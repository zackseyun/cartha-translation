  text: Then the man Elkanah went up with all his household to sacrifice to Yahweh the yearly sacrifice and his vow[a].
translation:
  language: ta
  text: பின்பு, எல்க்கானா என்னும் அந்த மனிதன், தன் குடும்பத்தார் அனைவரோடும், யாவேக்கு வருடாந்தர பலியைச் செலுத்தவும் தன் நேர்த்திக்கடனை நிறைவேற்றவும் மேலே சென்றான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொல்லுக்கு நெருக்கமாக, “யாவேக்கு வருடாந்தர பலியையும் தன் நேர்த்திக்கடனையும் பலியிடுவதற்கு” என்று உள்ளது. இரண்டாவது கூறின் செயல் முன்வரும் வினையிலிருந்து நீள்வட்டமாகப் புரிந்துகொள்ளப்படுகிறது; அதாவது, அவன் செய்த நேர்த்தியை நிறைவேற்றவும் சென்றான்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: மேலே சென்றான்
  rationale: שילהவிலிருந்த திருத்தலத்திற்குச் செல்லும் யாத்திரைச் சூழலில் עלה என்பதன் ‘மேலே செல்’ என்ற இடவியல் மற்றும் மரபுத்தொடர்ச் சாயலைப் பாதுகாக்கிறது.
- source_word: הָאִישׁ אֶלְקָנָה
  choice: எல்க்கானா என்ற அந்த மனிதன்
  rationale: אִישׁ என்பதன் நேரடிப் பொருளான ‘மனிதன்’ என்பதைக் காக்கிறது; சூழலிலிருந்து மட்டும் ‘கணவன்’ என்று பொருளைச் சுருக்கவில்லை.
- source_word: וְכָל־בֵּיתוֹ
  choice: தன் குடும்பத்தார் அனைவரோடும்
  rationale: בַּיִת இங்கு கட்டடத்தை அல்ல, வீட்டைச் சேர்ந்த மக்களைக் குறிக்கிறது. ‘குடும்பத்தார் அனைவரும்’ என்பது இயல்பான நவீனத் தமிழ்.
- source_word: לִזְבֹּחַ
  choice: பலியைச் செலுத்துவதற்காக
  rationale: זבח என்பதன் வழிபாட்டுச் சூழலிலான பலியிடும் செயலைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: לַיהוָה
  choice: யாவேக்கு
  rationale: יהוה என்ற உடன்படிக்கைப் பெயரைப் பட்டப்பெயராக மாற்றாமல் ஒலிபெயர்த்துக் காட்டுகிறது.
- source_word: זֶבַח הַיָּמִים
  choice: ஆண்டுதோறும் செலுத்தும் பலி
  rationale: சொல்லுக்கு சொல் ‘நாட்களின் பலி’ என்பதற்குப் பதிலாக, சூழலில் குறிக்கப்படும் வருடாந்திர வழக்கத்தைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: וְאֶת־נִדְרוֹ
  choice: தன் நேர்த்திக்கடனையும்
  rationale: נֶדֶר என்பது கடவுளிடம் செய்த நேர்த்தி அல்லது பொருத்தனையைச் சுட்டுகிறது. எபிரெயத்தில் செயப்படுபொருள் உருபுடன் இணைக்கப்பட்டுள்ள இதை, முன் வரும் ‘செலுத்து’ என்ற வினையுடன் தமிழிலும் இணைத்து, மூலத்தின் சுருக்கத்தைப் பாதுகாக்கிறது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர் / ஆண்டவர்
  rationale: வசனம் இறைவனின் நான்கெழுத்து உடன்படிக்கைப் பெயரை நேரடியாகப் பயன்படுத்துவதால், பொதுப் பட்டப்பெயரால் மாற்றாமல் ‘யாவே’ என்று ஒலிபெயர்க்கப்பட்டது.
- issue: וְאֶת־נִדְרוֹ என்பதில் மறைந்துள்ள செயல்
  choice: ‘செலுத்துவதற்காக’ என்ற முன் வினையுடன் ‘நேர்த்திக்கடனையும்’ இணைத்தல்
  alternative: தன் நேர்த்திக்கடனை நிறைவேற்றுவதற்காக
  rationale: ‘நிறைவேற்றுதல்’ என்பது பொருளை விளக்கினாலும், எபிரெயத்தில் அந்த வினை வெளிப்படையாக இல்லை. ஆகவே மூலத்தின் இலக்கணச் சுருக்கத்தையும் உண்மையான விளக்கத் திறப்பையும் காக்கும் வாசகம் தேர்ந்தெடுக்கப்பட்டது.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிதில் புரியும், அதேவேளை வேதாகம உரைக்கு ஏற்ற கண்ணியமான நடை பயன்படுத்தப்பட்டது. ‘மேலே சென்றான்’ யாத்திரைச் சொல்லாட்சியைப் பாதுகாக்கிறது; ‘குடும்பத்தார்’ என்பது ‘வீடு’ என்ற எபிரெயச் சமூகப் பொருளை இயல்பாகத் தருகிறது.
