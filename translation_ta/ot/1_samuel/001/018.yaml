base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/018.yaml
  text: She said[a], “May your servant find favor in your eyes.” Then the woman went on her way and ate[b], and her face was no longer downcast.
translation:
  language: ta
  text: அவள், “உமது அடியவளுக்கு உமது பார்வையில் தயவு கிடைக்கட்டும்” என்றாள்.[a] பின்பு அந்தப் பெண் தன் வழியே சென்று உணவு உண்டாள்; அவளுடைய முகம் இனி வாடியதாக இருக்கவில்லை.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அடியவள்” என்பது அன்னாள் தன்னைத் தாழ்மையுடன் குறிப்பிடும் பெண்பால் சொல்.
    reason: lexical_alternative
  - marker: b
    text: சொற்சொல்லாக, “அவளுடைய முகம் இனிமேல் அவளுக்கு இருக்கவில்லை.” இச்சுருக்கமான எபிரெய மரபுத்தொடர், அவளது முகம் முன்புபோல் துயரத்தை வெளிப்படுத்தவில்லை என்று பொருள்படுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּמְצָא
  choice: கிடைக்கட்டும்
  rationale: இங்கு இச்சொல் மரியாதையுடன் தெரிவிக்கப்படும் விருப்பத்தைக் குறிக்கிறது; சாதாரண எதிர்காலக் கூற்றாக அல்லாமல் வேண்டுதலின் தொனியைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: שִׁפְחָתְךָ
  choice: உமது அடியவளுக்கு
  rationale: எபிரெயச் சொல் பெண்பாலைக் குறிப்பதோடு, அன்னாள் ஏலியிடம் தன்னைத் தாழ்மையுடன் குறிப்பிடுவதையும் காட்டுகிறது. ‘அடியவள்’ என்பது இரு நுணுக்கங்களையும் இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: חֵן בְּעֵינֶיךָ
  choice: உமது பார்வையில் தயவு
  rationale: ஒருவரின் சாதகமான ஏற்றுக்கொள்ளுதலைக் குறிக்கும் எபிரெய மரபுத்தொடரின் கண்/பார்வை உருவகத்தைப் புரியக்கூடிய தமிழில் பாதுகாக்கிறது.
- source_word: לְדַרְכָּהּ
  choice: தன் வழியே சென்று
  rationale: அங்கிருந்து புறப்பட்டுத் தன் பயணத்தைத் தொடர்ந்தாள் என்ற பொருளை இயல்பாகத் தெரிவிக்கிறது.
- source_word: וַתֹּאכַל
  choice: உணவு உண்டாள்
  rationale: தொடர்ந்து நிகழ்ந்த எளிய செயலைக் குறிக்கிறது; முன்பு துயரத்தால் உண்ணாதிருந்த சூழலில் அதன் முக்கியத்துவத்தையும் தெளிவாக்குகிறது.
- source_word: וּפָנֶיהָ לֹא הָיוּ לָהּ עוֹד
  choice: அவளுடைய முகம் அதன்பின் வாடியிருக்கவில்லை
  rationale: எபிரெய வாசகம் சொற்சொல்லாகத் தெளிவற்றிருந்தாலும், சூழலில் அவளது முகம் இனி துயரத்தை வெளிப்படுத்தவில்லை என்பதே கருத்து. ‘வாடியிருக்கவில்லை’ என்பது அந்தக் காணத்தக்க மாற்றத்தை அளவுக்கு மீறி விளக்காமல் தெரிவிக்கிறது.
