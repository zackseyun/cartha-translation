  register: நவீனத் தரத் தமிழில், மரியாதையும் கதைநடை இயல்பும் காக்கப்பட்டுள்ளன. ‘உமது’ என்பது அன்னாள் ஏலியிடம் பேசும் மரியாதைத் தொனியைத் தக்கவைக்கிறது; எபிரெய மூலத்தின் ‘பார்வையில்’ என்ற உருவகமும் பாதுகாக்கப்பட்டுள்ளது.
