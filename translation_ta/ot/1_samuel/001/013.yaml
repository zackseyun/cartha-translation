  source_fidelity: மூல எபிரெயத்தின் வலியுறுத்தப்பட்ட தலைப்பான ‘ஹன்னா’வும், ‘தன் உள்ளத்தில் பேசுதல்’ என்ற உள்ளார்ந்த/ஒலியற்ற பேச்சின் உருவகமும், உதடுகளின் கண்ணுக்குத் தெரியும் அசைவும் குரல் கேட்கப்படாமையும், ஏலியின் தவறான மதிப்பீடும் துல்லியமாக வெளிப்படுத்தப்பட்டுள்ளன. ‘குடிபோதையில் இருப்பதாக’ என்பது לְשִׁכֹּרָה என்ற சொல்லின் பொருளைச் சரியாகத் தருகிறது.
  naturalness: நடை நவீன நிலையான தமிழில் தெளிவாகவும் கண்ணியமாகவும் உள்ளது. அரைப்புள்ளியும் ‘ஆகவே’ என்ற தொடர்புச்சொல்லும் நிகழ்வுகளின் ஓட்டத்தை இயல்பாகக் காட்டுகின்றன. ‘அன்னாள்’ என்பது தமிழ்வேதாகம மரபில் ஹன்னாவுக்கான நிலையான பெயர்வடிவமாகப் பயன்படுவதால் இச்சூழலில் ஏற்றது.
  terminology: ‘உள்ளத்தில் பேசிக்கொண்டிருந்தாள்’ பிரதான உரையில் மூல உருவகத்தை இயல்பாகப் பாதுகாக்கிறது. அடிக்குறிப்பில் ‘இதயத்தில்’ எனும் சொல்லுக்குச் சொல் வடிவமும், சூழல்சார் மாற்றுகளும் சரியான வகையில் தரப்பட்டுள்ளன. இறையியல் விளக்கத்தைத் திணிக்காமல் உரையின் தெளிவின்மையைப் பாதுகாக்கிறது.
