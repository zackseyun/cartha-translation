translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடையைப் பயன்படுத்துகிறது. உள்ளார்ந்த, ஒலியற்ற வேண்டுதலை வெளிப்படுத்தும் மூலமொழி உருவகம் பிரதான உரையில் பாதுகாக்கப்பட்டு, அதிக விளக்கமுள்ள மாற்றுகள் அடிக்குறிப்பில் தரப்பட்டுள்ளன.
