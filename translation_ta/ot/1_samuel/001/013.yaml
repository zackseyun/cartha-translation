  text: וְ/חַנָּ֗ה הִ֚יא מְדַבֶּ֣רֶת עַל לִבָּ֔/הּ רַ֚ק שְׂפָתֶ֣י/הָ נָּע֔וֹת וְ/קוֹלָ֖/הּ לֹ֣א יִשָּׁמֵ֑עַ וַ/יַּחְשְׁבֶ֥/הָ עֵלִ֖י לְ/שִׁכֹּרָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/013.yaml
  text: Hannah was speaking in her heart; only her lips were moving[a], but her voice was not heard. So Eli thought she was drunk.
translation:
  language: ta
  text: அன்னாள் தன் உள்ளத்தில் பேசிக்கொண்டிருந்தாள்; அவளுடைய உதடுகள் மட்டும் அசைந்தன[a], ஆனால் அவளுடைய குரல் கேட்கவில்லை. ஆகவே, அவள் குடிபோதையில் இருப்பதாக ஏலி நினைத்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தனக்குள் பேசிக்கொண்டிருந்தாள்” / “தன் உள்ளத்திற்குள் மன்றாடிக்கொண்டிருந்தாள்.” எபிரெய மொழியில் சொல்லுக்குச் சொல், “தன் இதயத்தில் பேசிக்கொண்டிருந்தாள்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מְדַבֶּרֶת עַל לִבָּהּ
  choice: தன் உள்ளத்தில் பேசிக்கொண்டிருந்தாள்
  rationale: எபிரெயச் சொற்றொடரின் உள்ளார்ந்த பேச்சு என்ற உருவகத்தைப் பாதுகாக்கிறது; அதேவேளை ஒலியெழுப்பாமல் தனக்குள் பேசியதை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: רַק
  choice: மட்டும்
  rationale: வெளியில் தெரிந்த ஒரே அறிகுறி உதடுகளின் அசைவு என்பதைக் கட்டுப்பாட்டு பொருளுடன் தெளிவாகக் காட்டுகிறது.
- source_word: שְׂפָתֶיהָ נָּעוֹת
  choice: அவளுடைய உதடுகள் மட்டும் அசைந்தன
  rationale: נוּעַ என்பதன் பொதுவான ‘அசைதல்’ என்ற பொருளையும், குரல் கேட்காத நிலையுடன் முரண்படும் காணக்கூடிய உதட்டசைவையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וְקוֹלָהּ לֹא יִשָּׁמֵעַ
  choice: ஆனால் அவளுடைய குரல் கேட்கவில்லை
  rationale: நிஃபால் வடிவத்தின் செயல்பாட்டில் குரல் கேட்கப்படாததைத் தெரிவிக்கிறது; ‘ஆனால்’ என்பது உதடுகள் அசைந்தும் குரல் கேட்காத முரண்பாட்டை தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וַיַּחְשְׁבֶהָ
  choice: அவள் ... இருப்பதாக ஏலி நினைத்தான்
  rationale: ஒருவரை ஒரு நிலையில் இருப்பதாகக் கருதுதல் என்ற חָשַׁב வினையின் பொருளைத் தெளிவான நவீனத் தமிழில் தருகிறது.
- source_word: לְשִׁכֹּרָה
  choice: குடிபோதையில்
  rationale: ‘மது அருந்தி போதையில் உள்ளவள்’ என்ற பொருளை, தேவையற்ற கடுமையோ விளக்க விரிவாக்கமோ இன்றி இயல்பாகத் தெரிவிக்கிறது.
- source_word: וְחַנָּה הִיא
  choice: அன்னாள்
  rationale: הִיא தரும் தலைப்புச் சுட்டலைத் தமிழின் இயல்பான வாக்கிய அமைப்பில் பெயரை முன்வைப்பதன் மூலம் காட்டுகிறது; மூலத்தில் இல்லாத தனி காலச் சொல்லைச் சேர்க்கவில்லை.
