source:
  edition: WLC
  text: וַֽ/יִּשְׁחֲט֖וּ אֶת הַ/פָּ֑ר וַ/יָּבִ֥יאוּ אֶת הַ/נַּ֖עַר אֶל עֵלִֽי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/025.yaml
  text: Then they slaughtered the bull and brought the boy to Eli[a][b].
translation:
  language: ta
  text: பின்பு அவர்கள் காளையை அறுத்து[a], சிறுவனை[b] ஏலியிடம் கொண்டுவந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “கொன்று” என்றும் மொழிபெயர்க்கலாம். எபிரெய வினை பொதுவாகக் கொல்வதையும் குறிக்கக்கூடும்; ஆனால் இங்குள்ள பலிச் சூழலை “அறுத்து” என்பது சிறப்பாக வெளிப்படுத்துகிறது.
    reason: lexical_alternative
  - marker: b
    text: “குழந்தையை” என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் சூழலுக்கேற்ப குழந்தை, சிறுவன் அல்லது இளைஞனைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁחֲטוּ
  choice: பின்பு அவர்கள் அறுத்து
  rationale: வழக்குரைத் தொடரை முன்னெடுக்கும் wayyiqtol வடிவை இயல்பான தமிழில் “பின்பு” எனக் காட்டுகிறது. “அறுத்து” என்பது பலிச் சூழலுக்குப் பொருத்தமாகவும், பொதுவான “கொன்று” என்பதைவிட எபிரெயச் சொல்லின் நுண்ணுணர்வைத் தெளிவாகவும் தருகிறது.
- source_word: הַפָּר
  choice: காளையை
  rationale: פַּר என்பது, குறிப்பாக பலியிடும் சூழலில், காளையைக் குறிக்கிறது. இவ்வசனத்தில் வயது தனியாகக் குறிப்பிடப்படாததால் “காளை” என்று மட்டும் மொழிபெயர்க்கப்படுகிறது.
- source_word: וַיָּבִיאוּ
  choice: கொண்டுவந்தார்கள்
  rationale: இது அடுத்தடுத்த நிகழ்வைத் தொடரும் வினை. ஒருவரை மற்றொருவரிடம் அழைத்து வருவதைக் குறிக்க நவீனத் தமிழில் “கொண்டுவந்தார்கள்” இயல்பாக உள்ளது.
- source_word: הַנַּעַר
  choice: சிறுவனை
  rationale: נַעַר என்பது குழந்தை, சிறுவன், இளைஞன் எனச் சூழலுக்கேற்ப பல வயதுநிலைகளைக் குறிக்கலாம். இங்கு சாமுவேல் மிகவும் இளவயதானவர் என்பதால் “சிறுவன்” பொருத்தமானது.
- source_word: אֶל עֵלִי
  choice: ஏலியிடம்
  rationale: אֶל ஒருவரை நோக்கிய இயக்கத்தைக் குறிக்கிறது; “ஏலியிடம்” என்பது தெளிவான, இயல்பான தமிழாக்கம்.
theological_decisions:
- issue: காளை கொல்லப்பட்டதன் பலிசார் நுண்ணுணர்வு
  choice: “அறுத்து” என்று மொழிபெயர்த்து பலியிடும் சூழலைக் காக்குதல்
  alternative: “கொன்று” என்று பொதுவாக மொழிபெயர்த்தல்
  rationale: சுற்றியுள்ள உரைப்பகுதி சீலோவில் நடைபெற்ற வழிபாட்டையும் பலியையும் பற்றியது. “அறுத்து” என்பது எபிரெய வினையின் நேரடிப் பொருளையும் பலிசார் நுண்ணுணர்வையும் கூடுதல் விளக்கமின்றிக் காக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் எளிமையும் கண்ணியமும் கொண்ட கதைநடை பயன்படுத்தப்பட்டுள்ளது. “அறுத்து” பலிச் சூழலை இயல்பாக உணர்த்துகிறது; “சிறுவன்” சாமுவேலின் இளவயதைக் காட்டுகிறது. மாற்றுப் பொருள்கள் அடிக்குறிப்புகளில் பாதுகாக்கப்பட்டுள்ளன.
