  text: וַ/יַּ֧עַן עֵלִ֛י וַ/יֹּ֖אמֶר לְכִ֣י לְ/שָׁל֑וֹם וֵ/אלֹהֵ֣י יִשְׂרָאֵ֗ל יִתֵּן֙ אֶת שֵׁ֣לָתֵ֔/ךְ אֲשֶׁ֥ר שָׁאַ֖לְתְּ מֵ/עִמּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/017.yaml
  text: Then Eli answered and said[a], “Go in peace, and may the God of Israel grant your petition that you have asked from him.”
translation:
  language: ta
  text: 'அப்போது ஏலி பதிலளித்தார்: “சமாதானத்துடன் போ. இஸ்ரவேலின் கடவுள் நீ அவரிடம் கேட்ட உன் வேண்டுதலை[a] அருள்வாராக.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘வேண்டுகோள்’ என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் ஜெபத்தில் கேட்ட காரியத்தைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמֶר
  choice: மறுமொழியாக ... என்றார்
  rationale: எபிரெய மொழியின் ‘பதிலளித்து சொன்னார்’ என்ற இரட்டைச் சொல்லாக்கத்தை இயல்பான தமிழ் உரையாடல் நடையில் தருகிறது; பதிலுரையின் தன்மையையும் பேச்சுச் செயலையும் காக்கிறது.
- source_word: לְכִי לְשָׁלוֹם
  choice: சமாதானத்துடன் போ
  rationale: அன்னாளை நோக்கிய பெண்பால் ஒருமை கட்டளையையும், நலமாகவும் சமாதானமாகவும் செல்லும்படி கூறும் எபிரெய வாழ்த்து மரபையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וֵאלֹהֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் கடவுள்
  rationale: இஸ்ரவேலுக்குரிய கடவுளைக் குறிக்கும் எபிரெய இணைப்புத் தொடரை நேராகவும் நவீன தமிழிலும் தருகிறது.
- source_word: יִתֵּן
  choice: அருள்வாராக
  rationale: அடிப்படைப் பொருள் ‘கொடுப்பார்’ என்பதாக இருந்தாலும், இங்கு வாழ்த்து அல்லது வேண்டுதல் சார்ந்த விருப்ப வினை வலிமை உள்ளது; ‘அருள்வாராக’ அதைக் கடவுளை நோக்கிய இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: שֵׁלָתֵךְ
  choice: உன் வேண்டுதல்
  rationale: கேட்கப்பட்ட காரியத்தையோ ஜெப விண்ணப்பத்தையோ குறிக்கும் சொல்லாக ‘வேண்டுதல்’ சூழலுக்கு ஏற்றது; ‘வேண்டுகோள்’ என்ற மாற்றுப் பொருளை அடிக்குறிப்பு பதிவு செய்கிறது.
- source_word: אֲשֶׁר שָׁאַלְתְּ מֵעִמּוֹ
  choice: நீ அவரிடம் கேட்ட
  rationale: முன்னர் அன்னாள் கடவுளிடம் கேட்ட விண்ணப்பத்தைச் சுட்டும் தொடர்புத் தொடரையும், எபிரெய ஆண்பால் ஒருமைச் சுட்டுப்பெயரையும் சுருக்கமாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: מֵעִמּוֹ என்பதிலுள்ள சுட்டுப்பெயர் யாரைக் குறிக்கிறது
  choice: ‘அவரிடம்’ என்பது கடவுளைக் குறிக்கும்படி மொழிபெயர்க்கப்பட்டது.
  alternative: சுட்டுப்பெயரை ஏலியைக் குறிக்கக்கூடியதாகத் தெளிவின்றி விடுதல்.
  rationale: முந்தைய சூழலில் அன்னாள் ஆண்டவருக்கு முன் தன் உள்ளத்தை ஊற்றியதாகச் சொல்கிறாள்; மேலும் இவ்வாக்கியத்தில் மிக அண்மையில் குறிப்பிடப்படுபவர் ‘இஸ்ரவேலின் கடவுள்.’ ஆகவே சுட்டுப்பெயர் கடவுளைக் குறிப்பது சூழலால் போதுமான அளவு தெளிவாகிறது; இருப்பினும் மூலத்தின் சுட்டுப்பெயர் வடிவம் ‘அவரிடம்’ என்று காக்கப்பட்டுள்ளது.
- issue: יִתֵּן என்பதன் வினை வலிமை
  choice: உறுதியான முன்னறிவிப்பாக அல்லாமல் வாழ்த்து/விருப்பமாக ‘அருள்வாராக’ எனத் தரப்பட்டது.
  alternative: ‘அருள்வார்’ என்று உறுதியான அறிவிப்பாக மொழிபெயர்த்தல்.
  rationale: இந்தச் சூழலில் வடிவம் வேண்டுதல் அல்லது ஆசீர்வாதத்தின் விருப்ப வலிமையைக் கொண்டிருக்கலாம். மூலத்தில் உள்ள அந்த நுண்ணிய திறந்தநிலையை உறுதியான தீர்க்கதரிசன வாக்காக மாற்றாமல் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதாகவும் வேதாகம உரைக்கு ஏற்ற கண்ணியத்துடனும் வடிவமைக்கப்பட்டது. ‘சமாதானத்துடன் போ’ என்பது மூல வாழ்த்து மரபைத் தெளிவாகக் காக்கிறது; ‘அருள்வாராக’ என்பது வாழ்த்து/வேண்டுதல் வலிமையை இயல்பான தமிழில் தருகிறது.
