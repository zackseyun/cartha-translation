source:
  edition: WLC
  text: וְ/ל/וֹ֙ שְׁתֵּ֣י נָשִׁ֔ים שֵׁ֤ם אַחַת֙ חַנָּ֔ה וְ/שֵׁ֥ם הַ/שֵּׁנִ֖ית פְּנִנָּ֑ה וַ/יְהִ֤י לִ/פְנִנָּה֙ יְלָדִ֔ים וּ/לְ/חַנָּ֖ה אֵ֥ין יְלָדִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/002.yaml
  text: He had two wives. The name of one was Hannah[a], and the name of the second was Peninnah. Peninnah had children, but Hannah had no children.
translation:
  language: ta
  text: அவனுக்கு இரண்டு மனைவிகள் இருந்தனர். ஒரு மனைவியின் பெயர் அன்னாள்; மற்ற மனைவியின் பெயர் பெனின்னாள். பெனின்னாளுக்குப் பிள்ளைகள் இருந்தனர்; ஆனால் அன்னாளுக்குப் பிள்ளைகள் இல்லை.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְלֹו
  choice: அவனுக்கு ... இருந்தார்கள்
  rationale: எபிரெய மொழியின் உடைமைக்கான முன்னிடைச்சொல் அமைப்பை இயல்பான தமிழில் ‘அவனுக்கு ... இருந்தார்கள்’ என்று மொழிபெயர்த்துள்ளது; தொடக்க இணைப்புச்சொல் தமிழ் வாக்கிய ஓட்டத்தில் தனியாகக் காட்டப்படவில்லை.
- source_word: שְׁתֵּי נָשִׁים
  choice: இரண்டு மனைவிகள்
  rationale: இங்கு திருமண உறவே தெளிவாகக் குறிக்கப்படுவதால் ‘பெண்கள்’ என்பதற்குப் பதிலாக ‘மனைவிகள்’ என்பது பொருத்தமானது.
- source_word: שֵׁם אַחַת ... וְשֵׁם הַשֵּׁנִית
  choice: ஒருத்தியின் பெயர் ...; மற்றவளின் பெயர்
  rationale: மூலத்தின் இணையான பெயரறிமுக அமைப்பையும் ‘பெயர்’ என்ற சொல்லின் மறுபயன்பாட்டையும் இயல்பான தமிழில் பாதுகாக்கிறது.
- source_word: חַנָּה
  choice: அன்னாள்
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் பரவலாக அறியப்படும் பெயர் வடிவம் பயன்படுத்தப்பட்டுள்ளது.
- source_word: פְּנִנָּה
  choice: பெனின்னாள்
  rationale: எபிரெயப் பெயரின் ஒலிப்பை நெருங்கிய, தமிழ் வாசிப்புக்கு ஏற்ற வடிவில் எழுத்துப்பெயர்த்துள்ளது.
- source_word: וַיְהִי לִפְנִנָּה יְלָדִים
  choice: பெனின்னாளுக்குப் பிள்ளைகள் இருந்தார்கள்
  rationale: எபிரெய இருப்பு/உடைமை அமைப்பு இயல்பான தமிழில் தரப்பட்டுள்ளது; יְלָדִים பொதுவாகக் ‘பிள்ளைகள்’ என்று பொருள்படும், பாலினங்களை இங்கு தனியே குறிப்பிடவில்லை.
- source_word: וּלְחַנָּה אֵין יְלָדִים
  choice: ஆனால் அன்னாளுக்குப் பிள்ளைகள் இல்லை
  rationale: אֵין குறிக்கும் இல்லாமையை நேரடியாகத் தருகிறது; இரு பெண்களின் நிலைகளுக்கிடையிலான மறைமுக எதிர்மறை ஒப்புமையை ‘ஆனால்’ தெளிவாக்குகிறது.
