revisions:
- from: அவனுக்கு இரண்டு மனைவிகள் இருந்தார்கள். ஒருத்தியின் பெயர் அன்னாள்; மற்றவளின் பெயர் பெனின்னாள். பெனின்னாளுக்குப் பிள்ளைகள் இருந்தார்கள்; ஆனால் அன்னாளுக்குப் பிள்ளைகள் இல்லை.
  to: அவனுக்கு இரண்டு மனைவிகள் இருந்தனர். ஒரு மனைவியின் பெயர் அன்னாள்; மற்ற மனைவியின் பெயர் பெனின்னாள். பெனின்னாளுக்குப் பிள்ளைகள் இருந்தனர்; ஆனால் அன்னாளுக்குப் பிள்ளைகள் இல்லை.
  rationale: 'A small register revision makes the naming formula more polished while retaining every stated element of the Hebrew: two wives, Hannah and Peninnah named in parallel, children for Peninnah, and no children for Hannah. ‘ஆனால்’ preserves the narrative contrast implicit in the juxtaposed clauses.'
  reviewer_model: gpt-5.6-terra
