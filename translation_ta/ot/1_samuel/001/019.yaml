base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/019.yaml
  text: They rose early in the morning and bowed down before Yahweh[a]. Then they returned and came to their house at Ramah, and Elkanah knew Hannah his wife[b], and Yahweh remembered her.
translation:
  language: ta
  text: அவர்கள் அதிகாலையில் எழுந்து, யாவேக்கு முன்பாகப் பணிந்துகொண்டார்கள். பின்பு அவர்கள் திரும்பி, ராமாவிலிருந்த தங்கள் வீட்டுக்கு வந்தார்கள். எல்க்கானா தன் மனைவி அன்னாளோடு கூடினான்[a]; யாவே அவளை நினைவுகூர்ந்தார்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “கூடினான்” என்பது திருமணப் பாலுறவைக் குறிக்கும் அடக்கமான எபிரேய மறைமொழியின் தமிழாக்கம்.
    reason: lexical_alternative
  - marker: b
    text: எபிரேய மொழியில் “நினைவுகூர்ந்தார்” என்பது வெறும் நினைவுக்கு வருவதைவிட அதிகத்தைக் குறிக்கிறது; கடவுள் ஒருவர்மேல் உண்மையுள்ள அக்கறை கொண்டு அவருக்காகச் செயல்படத் திரும்பியதையும் இது உணர்த்தலாம்.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּשְׁכִּמוּ בַבֹּקֶר
  choice: அவர்கள் அதிகாலையில் எழுந்து
  rationale: שׁכם என்பதன் Hiphil வடிவம் அதிகாலையில் எழுவதைக் குறிக்கிறது; בַבֹּקֶר உடன் சேர்ந்துள்ள காலக் குறிப்பை இயல்பான நவீனத் தமிழில் இவ்வாறு தருகிறது.
- source_word: וַיִּשְׁתַּחֲווּ לִפְנֵי יְהוָה
  choice: யாவேக்கு முன்பாகப் பணிந்துகொண்டார்கள்
  rationale: השתחוה குறிக்கும் உடலைத் தாழ்த்திப் பணியும் செயலைப் பாதுகாக்கிறது; பொதுவான ‘வழிபட்டார்கள்’ என்பதைவிட மூலத்தின் காணக்கூடிய செயலைத் தெளிவாக வைத்திருக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: திருநான்கெழுத்துப் பெயரான יהוה-வை ஒரு பட்டப்பெயரால் மாற்றாமல், தமிழில் இயல்பாக ஒலிபெயர்க்கிறது.
- source_word: וַיָּשֻׁבוּ וַיָּבֹאוּ אֶל בֵּיתָם הָרָמָתָה
  choice: பின்பு அவர்கள் திரும்பி, ராமாவிலிருந்த தங்கள் வீட்டுக்கு வந்தார்கள்
  rationale: திரும்புதல் மற்றும் வீட்டை அடைதல் ஆகிய இரு தொடர்ச்சியான இயக்கங்களையும் காக்கிறது; הָרָמָתָה குறிக்கும் இலக்கு ராமாவிலுள்ள அவர்களின் வீடு என்பதையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וַיֵּדַע אֶלְקָנָה אֶת חַנָּה אִשְׁתּוֹ
  choice: எல்க்கானா தன் மனைவி அன்னாளை அறிந்துகொண்டான்
  rationale: ידע இங்கு திருமணப் பாலுறவுக்கான அடக்கமான எபிரேய மரபுத்தொடர். அதன் இலக்கிய மறைமுகத்தன்மையை முதன்மை உரையில் காத்து, பொருளை அடிக்குறிப்பில் தெளிவுபடுத்துகிறது.
- source_word: וַיִּזְכְּרֶהָ יְהוָה
  choice: யாவே அவளை நினைவுகூர்ந்தார்
  rationale: זכר என்பதன் ‘நினைவுகூருதல்’ என்ற உருவகத்தைப் பாதுகாக்கிறது; வெறும் மனநினைவைத் தாண்டி செயல்படும் அக்கறையைச் சுட்டினாலும், அடுத்த விளைவை இவ்வசனத்திற்குள் முன்கூட்டியே சேர்ப்பதில்லை.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூல உரையில் தனிப்பட்ட இறைப்பெயர் நேரடியாக உள்ளது. அதை ஒரு பட்டப்பெயரால் மாற்றாமல் ஒலிபெயர்ப்பது மூலத்தின் வேறுபாட்டைக் காக்கிறது.
- issue: ידע என்ற பாலுறவு மறைமொழியை வெளிப்படையாக்க வேண்டுமா
  choice: முதன்மை உரையில் ‘அறிந்துகொண்டான்’ என்று மறைமொழியைப் பாதுகாத்தல்
  alternative: அவளுடன் உடலுறவுகொண்டான்; அவளுடன் சேர்ந்தான்
  rationale: எபிரேய உரையின் அடக்கமான இலக்கிய நடையைப் பாதுகாக்கிறது; நவீன வாசகருக்கான விளக்கம் அடிக்குறிப்பில் தரப்படுகிறது.
- issue: யாவே அன்னாளை ‘நினைவுகூர்ந்தார்’ என்பதன் பொருள்
  choice: ‘நினைவுகூர்ந்தார்’ என்ற மூல உருவகத்தைத் தக்கவைத்தல்
  alternative: அவள்மேல் கவனம் செலுத்தினார்; அவளுக்காகச் செயல்பட்டார்
  rationale: இது செயலாற்றும் உண்மையுள்ள அக்கறையை உணர்த்தலாம்; ஆனால் இவ்வசனம் விளைவை இன்னும் வெளிப்படையாகச் சொல்லாததால், விளக்க விரிவாக்கத்தை முதன்மை உரையில் சேர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான நடையைப் பயன்படுத்துகிறது. மனிதர்களுக்கான கதைவினைகள் நேரடியான இறந்தகாலத்தில் உள்ளன; இறைவனைச் சுட்டும் வினை மரியாதைப் பன்மையில் அமைந்துள்ளது. எபிரேய மறைமொழியும் தெய்வீக ‘நினைவுகூருதல்’ என்ற இறையியல் பதற்றமும் விளக்கமாக மாற்றப்படாமல் பாதுகாக்கப்பட்டுள்ளன.
