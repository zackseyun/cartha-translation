base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/016.yaml
  text: Do not regard your servant as a worthless woman[b][a], for out of the abundance of my complaint and my vexation I have spoken until now.
translation:
  language: ta
  text: உமது அடியாளைத் தீய பெண்ணாகக் கருதாதீர்.[a] என் மிகுந்த மனக்குமுறலினாலும் மனவேதனையினாலும்[b] நான் இதுவரை பேசினேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொல்லுக்கு சொல், “பயனின்மையின் மகள்”; இது தீய அல்லது இழிவான பெண்ணைக் குறிக்கும் மரபுத்தொடர்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “என் மிகுந்த மனக்குமுறலும் மனவேதனையும் காரணமாக.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תִּתֵּן ... לִפְנֵי
  choice: …ஆகக் கருதாதீர்
  rationale: נתן மற்றும் לפני இணைந்த இச்சூழல்சார் மரபுத்தொடர், ஒருவரை ஏதோ ஒன்றாக எண்ணுவது அல்லது கருதுவது எனப் பொருள்படுகிறது; இடவியல் பொருளான ‘முன்’ இங்கே பொருந்தாது.
- source_word: אֲמָתְךָ
  choice: உமது அடியாள்
  rationale: பெண் பணியாளைக் குறிக்கும் சொல்லாக இருந்தாலும், அன்னாள் தாழ்மையுடன் தன்னைக் குறிப்பிடும் நேரடி உரையில் ‘உமது அடியாள்’ இயல்பாகவும் மரியாதையாகவும் உள்ளது; அடுத்துள்ள ‘பெண்’ பாலினத்தைத் தெளிவாக்குகிறது.
- source_word: בַּת בְּלִיָּעַל
  choice: ஒழுக்கங்கெட்ட பெண்
  rationale: சொல்லுக்கு சொல் ‘பயனின்மையின் மகள்’ என்றாலும், இம்மரபுத்தொடர் அறநெறியற்ற அல்லது இழிவான பெண்ணைக் குறிக்கிறது. ‘ஒழுக்கங்கெட்ட’ என்பது நவீன தமிழில் அதன் அறவியல் இகழ்ச்சியைத் தெளிவாகத் தருகிறது.
- source_word: כִּי מֵרֹב
  choice: மிகுந்த … ஆலுமே
  rationale: כִּי விளக்கத்தையும் מֵרֹב காரணத்துடன் கூடிய மிகுதியையும் குறிக்கின்றன. தமிழ் வாக்கியத்தில் ‘ஆலுமே’ அன்னாள் ஏன் இவ்வாறு பேசினாள் என்பதை இயல்பாக எடுத்துரைக்கிறது.
- source_word: שִׂיחִי
  choice: என் மனக்குமுறல்
  rationale: שׂיח இங்கு தியானம், முறையீடு, கலங்கிய உள்ளப் பேச்சு ஆகிய அர்த்தநிழல்களைக் கொண்டுள்ளது. தவறாகப் புரிந்துகொள்ளப்பட்ட அன்னாளின் துயரநிறைந்த ஜெபத்தை ‘மனக்குமுறல்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וְכַעְסִי
  choice: வேதனை
  rationale: כעס இங்கு பிறர்மீது கொண்ட கோபத்தைவிட, அவளுடைய சூழ்நிலையால் எழுந்த மனவேதனை அல்லது எரிச்சலூட்டும் துயரத்தைக் குறிக்கிறது. ‘வேதனை’ சூழலுக்குப் பொருத்தமானது; மாற்று அர்த்தம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: דִּבַּרְתִּי עַד הֵנָּה
  choice: இதுவரை நான் பேசிக்கொண்டிருந்தேன்
  rationale: עַד הֵנָּה காலத்தில் தற்போதைய தருணம்வரை என்பதைக் குறிக்கிறது. தொடர்ச்சியாக நடந்த ஜெபப் பேச்சை ‘பேசிக்கொண்டிருந்தேன்’ இயல்பாக உணர்த்துகிறது.
