  register: நவீன தரத் தமிழில், ஆசாரியரிடம் அன்னாள் பேசும் மரியாதையைப் பேண ‘உமது’, ‘கருதாதீர்’ ஆகிய வடிவங்கள் பயன்படுத்தப்பட்டன. மூலத்தின் உணர்ச்சித் தீவிரமும் שׂיח மற்றும் כעס சொற்களின் அர்த்தவிரிவும் இயன்றவரை இயல்பான தமிழிலும் அடிக்குறிப்பிலும் பாதுகாக்கப்பட்டுள்ளன.
