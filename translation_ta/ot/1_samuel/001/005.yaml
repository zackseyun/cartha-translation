source:
  edition: WLC
  text: וּ/לְ/חַנָּ֕ה יִתֵּ֛ן מָנָ֥ה אַחַ֖ת אַפָּ֑יִם כִּ֤י אֶת חַנָּה֙ אָהֵ֔ב וַֽ/יהוָ֖ה סָגַ֥ר רַחְמָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/005.yaml
  text: But to Hannah he would give a double portion[a], because he loved Hannah, though Yahweh had closed her womb.
translation:
  language: ta
  text: ஆனால் அன்னாளுக்கு அவர் இரட்டிப்பான பங்கைக்[a] கொடுப்பது வழக்கம்; ஏனெனில் அவர் அன்னாளை நேசித்தார். யாவே அவளுடைய கருப்பையை மூடியிருந்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொல்லுக்குச் சொல், ‘இரண்டு முகங்கள்/மூக்குத்துளைகளுக்கான ஒரு பங்கு.’ இச்சொற்றொடரின் பொருள் தெளிவாக இல்லை; ‘இரட்டிப்பான பங்கு’ அல்லது ‘சிறப்பான பங்கு’ என்று பொருள்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְחַנָּה
  choice: ஆனால் அன்னாளுக்கு
  rationale: וְ உடன் வரும் இந்தச் சொற்றொடர் முந்தைய வசனத்தில் பெனின்னாளுக்கும் அவளுடைய பிள்ளைகளுக்கும் கொடுக்கப்பட்ட பங்குகளுடன் அன்னாளின் பங்கை வேறுபடுத்திக் காட்டுகிறது; அதனால் தமிழில் எதிர்மறைத் தொடர்பை இயல்பாகக் காட்ட ‘ஆனால்’ பயன்படுத்தப்பட்டது.
- source_word: יִתֵּן
  choice: கொடுப்பது வழக்கம்
  rationale: இறந்தகாலத்தில் வழக்கமாகத் தொடர்ந்து நடந்த செயலை இங்கு imperfect வடிவம் குறிக்கிறது. தமிழில் ‘கொடுப்பது வழக்கம்’ அந்தப் பொருளைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: מָנָה
  choice: பங்கு
  rationale: பலியுணவிலிருந்து ஒருவருக்கென ஒதுக்கப்பட்ட அளவை இச்சொல் குறிக்கிறது; ‘பங்கு’ இயல்பானதும் பொருத்தமானதுமான தமிழ் சொல்.
- source_word: אַחַת אַפָּיִם
  choice: இரட்டிப்பான பங்கு
  rationale: சொல்லுக்குச் சொல் பார்த்தால் ‘இரண்டு முகங்கள்/நாசித்துவாரங்களுடைய ஒரு பங்கு’ என வரும் கடினமான எபிரெயச் சொற்றொடர் இது. சூழலில் பெரும்பாலும் இரட்டிப்பான அல்லது சிறப்பான பங்கு என்று புரிந்துகொள்ளப்படுகிறது; அதன் நிச்சயமின்மை அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: அன்னாளுக்கு விசேஷமான பங்கு கொடுத்ததற்கான காரணமாக எல்க்கானாவின் அன்பை இந்த இணைப்புச்சொல் அறிமுகப்படுத்துகிறது.
- source_word: אֶת־חַנָּה אָהֵב
  choice: அவர் அன்னாளை நேசித்தார்
  rationale: எல்க்கானாவுக்கு அன்னாள்மீது இருந்த அன்பை நேரடியாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: יהוה
  choice: யாவே
  rationale: மூலத்தில் உள்ள தேவனுடைய தனிப்பெயரான நான்கெழுத்துப் பெயரை பொதுப்பட்டமாக மாற்றாமல் ஒலிபெயர்த்துள்ளது.
- source_word: סָגַר רַחְמָהּ
  choice: அவளுடைய கருப்பையை மூடியிருந்தார்
  rationale: סגר என்பதன் அடிப்படைப் பொருள் ‘மூடு’; சூழலில் ஏற்கெனவே நிலவிய அன்னாளின் பிள்ளையின்மையைப் பின்னணியாகக் காட்ட ‘மூடியிருந்தார்’ என இறந்தகால நிறைவுவடிவில் தரப்பட்டுள்ளது.
theological_decisions:
- issue: יהוה என்ற தேவனுடைய பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: ஆண்டவர்; யெகோவா
  rationale: மூல எபிரெய உரை பொதுப்பட்டமல்ல, தேவனுடைய தனிப்பெயரையே பயன்படுத்துகிறது. அதனைத் தமிழில் ‘யாவே’ என்று ஒலிபெயர்ப்பது அந்த வேறுபாட்டைப் பாதுகாக்கிறது.
- issue: எல்க்கானாவின் அன்புக்கும் அன்னாளின் பிள்ளையின்மைக்கும் இடையிலான தொடர்பு
  choice: யாவே அவளுடைய கருப்பையை மூடியிருந்தபோதிலும்
  alternative: யாவே அவளுடைய கருப்பையை மூடியிருந்தார்
  rationale: எபிரெயில் நேரடியாக ‘மற்றும்’ என்ற இணைப்பு இருந்தாலும், அன்னாளின் பிள்ளையின்மையையும் மீறி எல்க்கானா அவளை நேசித்ததைச் சூழல் உணர்த்துகிறது. தமிழில் ‘போதிலும்’ என்பது அந்த உடன்பாட்டெதிர் தொடர்பை இயல்பாக வெளிப்படுத்துகிறது; அதே நேரத்தில் அன்னாளின் நிலை யாவேயின் செயலாகக் கூறப்படுவதை மாற்றவில்லை.
translation_notes:
  register: நவீன பொதுத்தமிழில் எளிதில் புரியும், அதேவேளையில் வேதாகம உரைக்கு ஏற்ற கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘கொடுப்பது வழக்கம்’ கடந்தகாலத்தில் மீண்டும் மீண்டும் நடந்த செயலை இயல்பாகக் காட்டுகிறது; கடினமான எபிரெயச் சொற்றொடரின் மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
