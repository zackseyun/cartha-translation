base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/003.yaml
  text: That man used to go up from his city year after year to worship and to sacrifice to Yahweh of Armies at Shiloh. And the two sons of Eli[a], Hophni and Phinehas, were there as priests of Yahweh.
translation:
  language: ta
  text: அந்த மனிதர் ஆண்டுதோறும் தமது நகரத்திலிருந்து சீலோவுக்கு ஏறிச் சென்று, படைகளின் யாவேவை[a] வழிபட்டுப் பலியிடுவது வழக்கம். அங்கே ஏலியின் இரு மகன்களான ஓப்னியும் பினெகாசும் யாவேவின் ஆசாரியர்களாக இருந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: மரபுவழியாக, “சேனைகளின் கர்த்தர்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָלָה
  choice: ஏறிச் சென்று … வழக்கம்
  rationale: எபிரெய வினை இச்சூழலில் கடந்தகாலத்தில் வழக்கமாக நிகழ்ந்த யாத்திரையைக் குறிக்கிறது. ‘வழக்கம்’ அதன் தொடர்ச்சியான தன்மையையும், ‘ஏறிச் சென்று’ עלה என்பதன் திசை உணர்வையும் காக்கிறது.
- source_word: הָאִישׁ הַהוּא
  choice: அந்த மனிதர்
  rationale: முன்னரே அறிமுகப்படுத்தப்பட்ட எல்க்கானாவைச் சுட்டும் எபிரெயச் சுட்டுப்பெயரின் குறிப்புத்தன்மையைப் பாதுகாக்கிறது.
- source_word: מֵעִירוֹ
  choice: தமது நகரத்திலிருந்து
  rationale: עִיר என்பதன் நேரடியான பொருள் ‘நகரம்’; எழுவாய்க்கு மரியாதையுடன் இயல்பாகச் சுட்ட ‘தமது’ பயன்படுத்தப்பட்டது.
- source_word: מִיָּמִים יָמִימָה
  choice: ஆண்டுதோறும்
  rationale: இந்த எபிரெய மரபுத்தொடர் வருடந்தோறும் நிகழும் தொடர்ச்சியைச் சுட்டுகிறது; ‘ஆண்டுதோறும்’ நவீனத் தமிழில் இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: לְהִשְׁתַּחֲוֺת
  choice: வழிபட்டு
  rationale: வினை நேரடியாகக் குனிந்து பணிவதைக் குறிக்கக்கூடியது; இவ்வழிபாட்டுச் சூழலில் ‘வழிபட்டு’ அதன் செயல்பாட்டு பொருளைத் தெளிவாக வழங்குகிறது.
- source_word: וְלִזְבֹּחַ
  choice: பலியிடுவது
  rationale: வழிபாட்டுச் சூழலில் பலியை அர்ப்பணிக்கும் செயலைச் சுருக்கமாகவும் நேரடியாகவும் தெரிவிக்கிறது.
- source_word: לַיהוָה
  choice: யாவேவை / யாவேவின்
  rationale: יהוה என்ற உடன்படிக்கைப் பெயரைப் பெயராகவே ஒலிபெயர்த்து, வாக்கியத்திற்கேற்ற வேற்றுமை உருபுகளுடன் வழங்குகிறது.
- source_word: צְבָאוֹת
  choice: படைகளின்
  rationale: צְבָאוֹת என்பதன் பன்மைப் பொருளான படைகள்/சேனைகள் என்பதை இன்றைய வாசகருக்குத் தெளிவாகக் காட்டுகிறது; ‘சர்வவல்லவர்’ போன்ற விளக்கப் பொருளை இறக்குமதி செய்யவில்லை.
- source_word: בְּשִׁלֹה
  choice: சீலோவுக்கு
  rationale: இலக்கு நோக்கிய ‘ஏறிச் செல்’ என்ற தமிழ்க் கட்டமைப்புடன் இணைத்து, வழிபாட்டிடமான சீலோவை இயல்பாகக் குறிப்பிடுகிறது.
- source_word: וְשָׁם
  choice: அங்கே
  rationale: எபிரெய உரையின் இடச்சுட்டலைச் சுருக்கமாகவும் இயல்பாகவும் காக்கிறது.
- source_word: שְׁנֵי בְנֵי עֵלִי
  choice: ஏலியின் இரு மகன்களான
  rationale: இருவர் என்ற எண்ணிக்கையையும் அவர்கள் ஏலியின் மகன்கள் என்ற உறவையும் தெளிவாகப் பாதுகாக்கிறது.
- source_word: חָפְנִי וּפִנְחָס
  choice: ஓப்னியும் பினெகாசும்
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் அறியப்பட்ட வடிவங்களுக்கு நெருக்கமான ஒலிபெயர்ப்புகள் பயன்படுத்தப்பட்டுள்ளன.
- source_word: כֹּהֲנִים לַיהוָה
  choice: யாவேவின் ஆசாரியர்களாக
  rationale: அவர்கள் யாவேவுக்குச் சேவை செய்த ஆசாரியர்கள் என்ற உறவை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரின் மொழியாக்கம்
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலத்தில் உள்ள தனிப்பட்ட உடன்படிக்கைப் பெயரை பொதுப் பட்டமாக மாற்றாமல் ஒலிபெயர்க்கிறது.
- issue: יהוה צבאות என்ற இறைப் பட்டத்தின் மொழியாக்கம்
  choice: படைகளின் யாவே
  alternative: சேனைகளின் கர்த்தர் / சர்வவல்லமையுள்ள கர்த்தர்
  rationale: צבאות என்பதன் சொற்பொருளைத் தெளிவாகக் காத்து, ‘சர்வவல்லமையுள்ள’ என்ற விளக்கவுரையை மூலத்தில் இல்லாமல் சேர்ப்பதைத் தவிர்க்கிறது. மரபுவழி வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன, செம்மையான, பொதுவாசகர்களுக்குப் புரியும் தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘ஏறிச் சென்று’ என்பது மூலத்தின் யாத்திரைத் திசை உணர்வைக் காக்கிறது; ‘வழக்கம்’ என்பது கடந்தகால வழக்கச் செயலைத் தெளிவாக்குகிறது. இறைப்பெயரும் அதன் பட்டமும் வெளிப்படையாக மொழியாக்கப்பட்டுள்ளன.
