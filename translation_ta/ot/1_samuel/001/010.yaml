id: 1SA.1.10
reference: 1 Samuel 1:10
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וְ/הִ֖יא מָ֣רַת נָ֑פֶשׁ וַ/תִּתְפַּלֵּ֥ל עַל יְהוָ֖ה וּ/בָכֹ֥ה תִבְכֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/010.yaml
  text: And she was bitter in soul[b][a], and she prayed to Yahweh and wept bitterly.
translation:
  language: ta
  text: அவள் மனங்கசந்து[a], யாவேயிடம் ஜெபித்து, மிகவும் அழுதாள்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: நேரடியாக, ‘உள்ளத்தில் கசப்புற்றவளாக’; இது ஆழ்ந்த உள்ள வேதனையைக் குறிக்கும் எபிரெய மரபுத்தொடர்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயில் வலியுறுத்தும் அமைப்பு உள்ளது—நேரடியாக, ‘அழுதுகொண்டே அழுதாள்’; ‘இடைவிடாமல் அழுதாள்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: מָרַת נָפֶשׁ
  choice: மனங்கசந்து
  rationale: எபிரெய மொழியின் ‘உயிரில்/உள்ளத்தில் கசப்பு’ என்ற உருவகத்தை இயல்பான நவீனத் தமிழில் பாதுகாக்கிறது; இது அவளுடைய ஆழ்ந்த உள்ள வேதனையைக் குறிக்கிறது.
- source_word: וַתִּתְפַּלֵּל
  choice: ஜெபித்து
  rationale: פלל என்பதன் ஹித்பஅல் வடிவம் இங்கு நேரடியாக ‘ஜெபித்தல்’ என்று பொருள்படுகிறது. சுற்றியுள்ள சொற்களே தீவிரத்தை வெளிப்படுத்துவதால், அந்த வினையில் கூடுதல் பொருள் சேர்க்கப்படவில்லை.
- source_word: עַל יְהוָה
  choice: யாவேயிடம்
  rationale: עַל என்ற முன்னிடைச்சொல் இங்கு ஜெபம் யாரை நோக்கிச் செலுத்தப்பட்டது என்பதைக் குறிக்கிறது; தமிழில் ‘-யிடம்’ என்பது தெளிவான, இயல்பான இணைப்பு.
- source_word: יְהוָה
  choice: யாவே
  rationale: இது எபிரெய வேதாகமத்தில் உள்ள தனிப்பெயரான יהוה என்பதன் தமிழெழுத்துப் பெயர்ப்பு; ‘கர்த்தர்’ போன்ற பட்டப்பெயரால் மாற்றப்படவில்லை.
- source_word: וּבָכֹה תִבְכֶּה
  choice: மிகவும் அழுதாள்
  rationale: வினையெச்சப் பெயருருவும் வினைமுற்றும் இணைந்த எபிரெய அமைப்பு அழுகையின் தீவிரத்தை வலியுறுத்துகிறது. ‘மிகவும் அழுதாள்’ அந்த வலியுறுத்தலை இயல்பாகத் தருகிறது; அழுகையின் தன்மையை ‘கசப்பாக’ என்று தேவையின்றி தீர்மானிப்பதில்லை.
theological_decisions:
- issue: יהוה என்ற இறைபெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலத்தில் பட்டப்பெயர் அல்ல, நான்கெழுத்து இறைத் தனிப்பெயர் நேரடியாக உள்ளது. ஆகவே அதன் பொதுவாக ஏற்றுக்கொள்ளப்படும் ஒலிப்பைத் தமிழில் ‘யாவே’ என்று தருவது மூல வேறுபாட்டைப் பாதுகாக்கிறது.
- issue: அழுகையை ‘கசப்பாக’ என்று வருணிப்பதா
  choice: மிகவும் அழுதாள்
  alternative: கசப்புடன் அழுதாள் / அழுதுகொண்டே இருந்தாள்
  rationale: எபிரெய தீவிரிப்பு அழுகையை வலியுறுத்தினாலும், அது தனியாக ‘கசப்புடன்’ என்ற உணர்வுப்பண்பையோ தொடர்ச்சியான காலநிலையையோ கட்டாயப்படுத்துவதில்லை. எனவே பொதுவான தீவிரிப்பு பாதுகாக்கப்பட்டது.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியும் அதேவேளையில் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. ‘மனங்கசந்து’ மூல உருவகத்தை இயல்பாகக் காக்கிறது; ‘மிகவும் அழுதாள்’ எபிரெய வலியுறுத்தலை மிகைப்படுத்தாமல் வெளிப்படுத்துகிறது.
