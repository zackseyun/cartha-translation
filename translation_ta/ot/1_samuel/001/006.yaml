  text: And her rival would provoke her bitterly in order to irritate her[a], because Yahweh had closed her womb.
translation:
  language: ta
  text: அவளுடைய போட்டியாளர்[a] அவளை மிகவும் சீண்டி, அவளைக் கலங்கச் செய்வாள்; ஏனெனில் யாவே அவளுடைய கருப்பையை அடைத்திருந்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயச் சொல் “எதிராளி” அல்லது “போட்டியாளர்” என்றும் பொருள்படும்; இச்சூழலில் ஒரே கணவனுடைய மற்றொரு மனைவியான சகமனைவியைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִעֲסַתָּה
  choice: அவளை … சீண்டுவாள்
  rationale: כעס என்பதன் காரணவினைப் பொருளான ‘கோபமூட்டுதல்/துன்புறுத்துதல்’ என்பதையும், சூழலில் இது வழக்கமாக மீண்டும் மீண்டும் நடந்த செயல் என்பதையும் ‘சீண்டுவாள்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: צָרָתָהּ
  choice: அவளுடைய போட்டியாளான மற்ற மனைவி
  rationale: צָרָה என்பது எதிராளி அல்லது போட்டியாளர் எனப் பொருள்படும்; இச்சூழலில் அது எல்க்கானாவின் மற்ற மனைவியான பெனின்னாளைக் குறிக்கிறது. இந்தத் தேர்வு குடும்ப உறவையும் போட்டி மனப்பான்மையையும் தெளிவாகக் காட்டுகிறது.
- source_word: גַּם כַּעַס
  choice: மிகவும்
  rationale: ஒரே வேர்ச்சொல்லை வலியுறுத்திப் பயன்படுத்தும் எபிரெய அமைப்பின் தீவிரத்தை, இயல்பான தமிழில் ‘மிகவும்’ தெரிவிக்கிறது.
- source_word: בַּעֲבוּר הַרְּעִמָהּ
  choice: அவளைக் கலங்கச் செய்வதற்காக
  rationale: בַּעֲבוּר நோக்கத்தைக் குறிக்கிறது. அரிதான רעם வடிவம் இங்கு ஒருவரை மனக்கலக்கத்துக்கும் துயரத்துக்கும் உள்ளாக்குவதைக் குறிக்கிறது; அதன் உருவகத்தன்மையை மிகையாகக் குறிப்பாக்காமல் ‘கலங்கச் செய்வது’ என வழங்கப்பட்டுள்ளது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: அடுத்த கூற்று முன்னைய செயலுக்கான சூழ்நிலைக் காரணத்தை அறிமுகப்படுத்துகிறது.
- source_word: סָגַר
  choice: அடைத்திருந்தார்
  rationale: סגר என்பதன் ‘அடைத்தல்’ என்ற நேரடிப் பொருளையும், இந்த நிலை ஏற்கெனவே இருந்ததைக் காட்டும் பின்னணிச் செயற்பாட்டையும் காக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: திருநான்கெழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தேவனுடைய தனிப்பெயராகத் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: בְּעַד רַחְמָהּ
  choice: அவளுடைய கருப்பையை
  rationale: רֶחֶם என்பதன் நேரடிப் பொருள் ‘கருப்பை’. סגר உடன் வரும் எபிரெய மொழிவழக்கை தமிழிலும் புரியத்தக்க வகையில் காக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூல உரையில் இறைவனின் தனிப்பெயர் நேரடியாக உள்ளது. பட்டப்பெயரைப் பதிலிடாமல், அதனை ‘யாவே’ என்று ஒலிபெயர்ப்பது மூலத்தின் தனிப்பெயர் பயன்பாட்டைக் காக்கிறது.
- issue: அன்னாளின் மலட்டுத்தன்மையில் யாவேயின் செயற்பாடு
  choice: யாவே அவளுடைய கருப்பையை அடைத்திருந்தார்
  alternative: அவள் கருவுறவில்லை
  rationale: மூல உரை நிலையை மட்டும் கூறாமல் யாவேயை நேரடிச் செய்பவராகக் குறிப்பிடுகிறது. அந்த இறையியல் பதற்றத்தை மென்மையாக்காமல் அப்படியே காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், எளிதில் புரியும் ஆனால் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. ‘சீண்டுவாள்’ தொடர்ச்சியாக நடந்த பகைமையான செயலை இயல்பாகக் காட்டுகிறது; ‘கருப்பையை அடைத்திருந்தார்’ மூல மொழியின் உருவகத்தையும் நேரடி இறைச் செயற்பாட்டையும் காக்கிறது.
