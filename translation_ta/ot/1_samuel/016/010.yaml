source:
  edition: WLC
  text: וַ/יַּעֲבֵ֥ר יִשַׁ֛י שִׁבְעַ֥ת בָּנָ֖י/ו לִ/פְנֵ֣י שְׁמוּאֵ֑ל וַ/יֹּ֤אמֶר שְׁמוּאֵל֙ אֶל יִשַׁ֔י לֹא בָחַ֥ר יְהוָ֖ה בָּ/אֵֽלֶּה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/016/010.yaml
  text: So Jesse had seven of his sons pass before Samuel, and Samuel said to Jesse, “Yahweh has not chosen any of these.”
translation:
  language: ta
  text: இவ்வாறு, ஈசாய் தன் மகன்களில் ஏழுபேரை சாமுவேலுக்கு முன்பாகக் கடந்து செல்லச் செய்தான். அப்போது சாமுவேல் ஈசாயிடம், “யாவே இவர்களில் யாரையும் தேர்ந்தெடுக்கவில்லை” என்றார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲבֵר
  choice: கடந்து செல்லச் செய்தான்
  rationale: 'עבר என்பதன் ஹிஃபில் வடிவம் இங்கு காரணவினைப் பொருளைக் கொண்டுள்ளது: ஈசாய் தன் மகன்களை சாமுவேலுக்கு முன்பாக ஒருவர் பின் ஒருவராகக் கடந்து செல்லச் செய்தான்.'
- source_word: שִׁבְעַת בָּנָיו
  choice: தன் மகன்களில் ஏழுபேரை
  rationale: எபிரெயக் கட்டமைப்பு ‘அவனுடைய மகன்களில் ஏழுபேர்’ என்று இயல்பாகப் புரிகிறது; சூழலில் இவர்களே அவனுடைய மொத்த மகன்கள் என்ற தவறான எண்ணத்தையும் இவ்வடிவு தவிர்க்கிறது.
- source_word: לִפְנֵי
  choice: முன்பாக
  rationale: சாமுவேலின் முன்னிலையில் மகன்கள் அழைத்துவரப்பட்ட இடவியல் மற்றும் உறவியல் கருத்தை இயல்பான தமிழில் தருகிறது.
- source_word: לֹא בָחַר
  choice: தேர்ந்தெடுக்கவில்லை
  rationale: בחר என்பதன் ‘தேர்ந்தெடு’ என்ற அடிப்படைப் பொருளையும், காண்பிக்கப்பட்டவர்களைப் பற்றிய சாமுவேலின் முடிவையும் தெளிவாகத் தருகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரான நான்கெழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் நிலைபெற்ற ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: בָּאֵלֶּה
  choice: இவர்களில் யாரையும்
  rationale: בְּ உடன் வரும் சுட்டுப்பெயர் இச்சூழலில் காண்பிக்கப்பட்டவர்களில் ஒருவரும் தேர்ந்தெடுக்கப்படவில்லை என்ற விலக்குப் பொருளைக் கொண்டுள்ளது; இயல்பான தமிழில் அதைத் தெளிவாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூல வசனம் இறைவனின் தனிப்பெயரை நேரடியாகப் பயன்படுத்துவதால், அதை ஒரு பட்டமாக மாற்றாமல் ஒலிபெயர்த்து வழங்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன செந்தமிழ் நடையில், சாதாரண வாசகர்களுக்கு எளிதில் புரியும் வகையிலும் கண்ணியமான வேதாகம மொழிநடையிலும் அமைக்கப்பட்டது. காரணவினைத் தன்மையும் ஏழுபேர் என்பது மகன்களின் முழு எண்ணிக்கை அல்லவாக இருக்கக்கூடிய சூழல் நுணுக்கமும் பாதுகாக்கப்பட்டுள்ளன.
