base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/016/020.yaml
  text: So Jesse took a donkey[a], bread, a skin of wine, and one young goat[b], and sent them by the hand of David his son to Saul.
translation:
  language: ta
  text: 'அப்போது ஈசாய், அப்பம் சுமந்த ஒரு கழுதையையும்[a], திராட்சை மதுவுள்ள ஒரு தோற்பையையும், ஒரு வெள்ளாட்டுக்குட்டியையும் எடுத்துத் தன் மகன் தாவீதின் மூலம்[b] அவற்றைச் சவுலிடம் அனுப்பினார்.


    [a] எபிரெய மொழியில் எழுத்துப்படி, “ஒரு கழுதை, அப்பம்.” இங்கு அப்பத்தைச் சுமந்த அல்லது அப்பம் ஏற்றப்பட்ட கழுதை என்பது பொருள்.


    [b] எபிரெய மொழியில் எழுத்துப்படி, “தன் மகன் தாவீதின் கையால்.” இது ஒருவரின் வழியாக அனுப்புவதைக் குறிக்கும் மரபுத்தொடர்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மொழியில் எழுத்துப்படி, “ஒரு கழுதை, அப்பம்.” இங்கு அப்பத்தைச் சுமந்த அல்லது அப்பம் ஏற்றப்பட்ட கழுதை என்பது பொருள்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெய மொழியில் எழுத்துப்படி, “தன் மகன் தாவீதின் கையால்.” இது ஒருவரின் வழியாக அனுப்புவதைக் குறிக்கும் மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: எனவே ஈசாய் ... எடுத்துத்
  rationale: தொடர்ச்சியான கதைநடையைச் சுட்டும் wayyiqtol வடிவத்தை, முந்தைய நிகழ்வின் விளைவைக் காட்டும் இயல்பான நவீனத் தமிழில் வழங்குகிறது.
- source_word: חֲמוֹר לֶחֶם
  choice: அப்பம் சுமந்த ஒரு கழுதை
  rationale: எபிரெயத்தில் ‘கழுதை’ மற்றும் ‘அப்பம்’ நேரடியாக அடுத்தடுத்து வருகின்றன; சூழலில் கழுதை அப்பத்தைச் சுமந்தது என்பதே பொருள். மூலத்தின் சுருக்கமான அமைப்பு அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
- source_word: נֹאד יַיִן
  choice: ஒரு தோற்பை திராட்சை மது
  rationale: נֹאד என்பது தோலால் செய்யப்பட்ட திரவக் கொள்கலனைக் குறிக்கிறது. ‘தோற்பை’ அதன் பொருளையும் பண்டைய சூழலையும் தெளிவாகக் காட்டுகிறது; יַיִן என்பதற்கு தெளிவாக ‘திராட்சை மது’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: גְּדִי עִזִּים אֶחָד
  choice: ஓர் இளம் வெள்ளாடு
  rationale: ஒரே ஒரு இளம் ஆட்டைக் குறிக்கும் எபிரெயச் சொற்றொடரின் எண்ணிக்கையையும் வயதையும் இயல்பான தமிழில் காக்கிறது.
- source_word: וַיִּשְׁלַח
  choice: அவற்றைச் ... அனுப்பினார்
  rationale: அனுப்பப்பட்ட பொருட்கள் முன் பட்டியலிடப்பட்டுள்ளதால், தமிழில் தேவையான ‘அவற்றை’ என்ற செயப்படுபொருள் வெளிப்படையாகச் சேர்க்கப்பட்டுள்ளது.
- source_word: בְּיַד
  choice: மூலம்
  rationale: எழுத்துப்படி ‘கையால்’ என்றாலும், இங்கு அனுப்புதல் அல்லது கொடுத்தனுப்புதலில் ஒருவரின் வழியான செயற்பாட்டைக் குறிக்கும் மரபுத்தொடர். இயல்பான பொருள் முதன்மை உரையில் தரப்பட்டு, சொற்சார்ந்த வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
- source_word: דָּוִד בְּנוֹ
  choice: தன் மகன் தாவீது
  rationale: בְּנוֹ என்பதிலுள்ள உறவையும் ஈசாயை நோக்கிய தற்சுட்டையும் இயல்பான தமிழ்ச் சொல்வரிசையில் வெளிப்படுத்துகிறது.
- source_word: אֶל שָׁאוּל
  choice: சவுலிடம்
  rationale: பெறுநரைச் சுட்டும் אֶל என்பதற்கு இயல்பான நவீனத் தமிழ்ப் பயன்பாடு.
