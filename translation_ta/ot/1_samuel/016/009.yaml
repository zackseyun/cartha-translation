id: 1SA.16.9
reference: 1 Samuel 16:9
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יַּעֲבֵ֥ר יִשַׁ֖י שַׁמָּ֑ה וַ/יֹּ֕אמֶר גַּם בָּ/זֶ֖ה לֹא בָחַ֥ר יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/016/009.yaml
  text: Then Jesse made Shammah pass by, and he said, “Yahweh has not chosen this one either.”
translation:
  language: ta
  text: அப்போது ஈசாய் சம்மாவை முன்னே வரச்செய்தார். அவர், “யாவே இவரையும் தேர்ந்தெடுக்கவில்லை” என்றார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲבֵר
  choice: முன்னால் கடந்து செல்லச் செய்தார்
  rationale: עבר என்பதன் ஹிஃபில் வடிவம் காரணவினைப் பொருளைக் கொண்டது; ஈசாய் சம்மாவை சாமுவேலின் முன்னால் கடந்து செல்லச் செய்தார் என்பதைத் தமிழில் இயல்பாகவும் தெளிவாகவும் காட்டுகிறது.
- source_word: יִשַׁי
  choice: ஈசாய்
  rationale: எபிரெய தனிப்பெயரான יִשַׁי என்பதற்கான தமிழில் பரவலாக அறியப்படும் வடிவம்.
- source_word: שַׁמָּה
  choice: சம்மா
  rationale: எபிரெய தனிப்பெயரின் ஒலியைத் தமிழில் இயல்பாகப் பிரதிபலிக்கிறது.
- source_word: וַיֹּאמֶר
  choice: அவர் ... என்றார்
  rationale: எபிரெய உரை பேசுபவரை பெயரிட்டு குறிப்பிடாமல் ஆண்பால் ஒருமைப் பிரதிப்பெயரையே உணர்த்துகிறது; சூழலில் அது சாமுவேலைக் குறித்தாலும், மூலத்தின் வெளிப்பாட்டைத் தக்கவைக்கிறது.
- source_word: גַּם בָּזֶה
  choice: இவரையும்
  rationale: גַּם என்பதன் சேர்க்கைப் பொருளையும், בָּזֶה இப்போது பரிசீலிக்கப்படும் நபரைக் குறிப்பதையும் சுருக்கமான இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: לֹא בָחַר
  choice: தேர்ந்தெடுக்கவில்லை
  rationale: בחר என்பதன் ‘தேர்ந்தெடு’ என்ற அடிப்படைப் பொருளை நேரடியாகத் தருகிறது; நிறைவேற்றப்பட்ட மதிப்பீட்டைத் தமிழ் இறந்தகால எதிர்மறை வடிவம் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரான நான்கெழுத்துப் பெயரை ஒரு பட்டமாக மாற்றாமல், தமிழுக்கு ஏற்ற ஒலிபெயர்ப்பில் வழங்குகிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூல உரை ஒரு பொதுப் பட்டத்தை அல்ல, இஸ்ரவேலின் கடவுளுடைய தனிப்பெயரை நேரடியாகப் பயன்படுத்துகிறது; ஆகவே பெயரின் தன்மையைப் பாதுகாக்க ஒலிபெயர்ப்பு பயன்படுத்தப்பட்டது.
- issue: וַיֹּאמֶר என்பதில் பேசுபவரின் அடையாளம்
  choice: அவர்
  alternative: சாமுவேல்
  rationale: சூழலின்படி பேசுபவர் சாமுவேல் என்றாலும், இவ்வசனத்தின் எபிரெய உரை பெயரை வெளிப்படையாகச் சொல்லவில்லை. எனவே மூலத்தின் குறிப்பு நிலையும் இயல்பான தொடர்ச்சியும் காக்கப்படுகின்றன.
translation_notes:
  register: நவீன நிலையான தமிழ்; எளிதில் புரியும், கண்ணியமான கதைநடை. காரணவினைத் தன்மை காக்கப்பட்டுள்ளது. ‘ஆனால்’ என்பது அடுத்த மகன் முன்னிறுத்தப்பட்டபோதும் முடிவு மாறவில்லை என்ற உரையாடல் முரணை இயல்பாக இணைக்கிறது.
