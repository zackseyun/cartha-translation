source:
  edition: WLC
  text: וַ/יָּבֹ֤א דָוִד֙ אֶל שָׁא֔וּל וַֽ/יַּעֲמֹ֖ד לְ/פָנָ֑י/ו וַ/יֶּאֱהָבֵ֣/הֽוּ מְאֹ֔ד וַֽ/יְהִי ל֖/וֹ נֹשֵׂ֥א כֵלִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/016/021.yaml
  text: So David came to Saul and stood before him[a], and Saul loved him greatly, and he became his armor-bearer.
translation:
  language: ta
  text: தாவீது சவுலிடம் வந்து, அவன் முன்னிலையில் நின்றான். சவுல் அவனை மிகவும் நேசித்தான்; தாவீது அவனுடைய ஆயுதம் தாங்குபவனானான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயச் சொற்றொடரைச் சொல்லர்த்தமாக, ‘போர்ச் சாதனங்களைச் சுமப்பவன்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: வந்து
  rationale: בוא என்பது இங்கு சவுலை நோக்கிச் செல்வதைக் குறிக்கிறது; இடத்திற்குள் நுழைந்ததாகக் கூடுதல் விவரம் சேர்க்காமல், தமிழில் இயல்பாக ‘சவுலிடம் வந்து’ என்று மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: וַיַּעֲמֹד לְפָנָיו
  choice: அவன் முன்னிலையில் நின்றான்
  rationale: עמד לפני என்ற சொற்றொடர் உயரதிகாரியின் முன்னிலையில் நின்று பணியாற்றுவதையும் குறிக்கலாம். எபிரெய உருவகத்தையும் அதன் பணிசார் உட்பொருளையும் திறந்த நிலையில் வைத்திருக்க நேரடியாக மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: וַיֶּאֱהָבֵהוּ מְאֹד
  choice: சவுல் அவனை மிகவும் நேசித்தான்
  rationale: சூழலின்படி மறைந்துள்ள எழுவாய் சவுல். אהב உடன் מאד சேர்ந்து வலுவான அன்பையும் ஆதரவையும் தெரிவிப்பதால் ‘மிகவும் நேசித்தான்’ என வழங்கப்பட்டுள்ளது.
- source_word: וַיְהִי לוֹ
  choice: அவனுடைய … ஆனான்
  rationale: இந்த அமைப்பு உருவான புதிய நிலை அல்லது நியமனத்தைக் குறிக்கிறது; தமிழில் ‘ஆனான்’ என்பது அந்த மாற்றத்தை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: נֹשֵׂא כֵלִים
  choice: ஆயுதம் தாங்குபவன்
  rationale: சொல்லர்த்தமாக இது போருக்குரிய சாதனங்களைச் சுமப்பவனைக் குறிக்கும். பதவியின் இராணுவப் பொருளை நவீன வாசகர் தெளிவாகப் புரிந்துகொள்ள ‘ஆயுதம் தாங்குபவன்’ என மொழிபெயர்க்கப்பட்டுள்ளது.
