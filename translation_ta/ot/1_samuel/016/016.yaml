  text: יֹאמַר נָ֤א אֲדֹנֵ֨/נוּ֙ עֲבָדֶ֣י/ךָ לְ/פָנֶ֔י/ךָ יְבַקְשׁ֕וּ אִ֕ישׁ יֹדֵ֖עַ מְנַגֵּ֣ן בַּ/כִּנּ֑וֹר וְ/הָיָ֗ה בִּֽ/הְי֨וֹת עָלֶ֤י/ךָ רֽוּחַ אֱלֹהִים֙ רָעָ֔ה וְ/נִגֵּ֥ן בְּ/יָד֖/וֹ וְ/ט֥וֹב לָֽ/ךְ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/016/016.yaml
  text: Please let our lord say to your servants before you that they should seek out a man who knows how to play the lyre; and when a harmful spirit from God is upon you[a], he will play with his hand, and it will be well for you.
translation:
  language: ta
  text: எங்கள் ஆண்டவர் தயவுசெய்து உம் முன்னிலையில் இருக்கும் உம் ஊழியர்களிடம், யாழை வாசிக்கத் தெரிந்த ஒருவனைத் தேடும்படி கூறுவாராக. கடவுளிடமிருந்து வரும் தீங்கு விளைவிக்கும் ஆவி உம்மேல் இருக்கும்போது[a], அவன் தன் கையால் வாசிப்பான்; அப்போது உமக்கு நலமாகும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கடவுளிடமிருந்து வரும் தீய ஆவி உம்மேல் இருக்கும்போது.” எபிரெயத்தில், “கடவுளுடைய/கடவுளிடமிருந்து வரும் தீய அல்லது தீங்கு விளைவிக்கும் ஆவி.”
    reason: ‘தீய/தீங்கு விளைவிக்கும்’ மற்றும் ‘கடவுளுடைய/கடவுளிடமிருந்து வரும்’ என்ற இரு உண்மையான பொருள் வாய்ப்புகளையும் பாதுகாக்கிறது.
lexical_decisions:
- source_word: יֹאמַר נָא
  choice: தயவுசெய்து கட்டளையிடுவாராக
  rationale: நָא இணைந்த விருப்பவினை அரசரிடம் வைக்கப்படும் பணிவான வேண்டுகோளைத் தெரிவிக்கிறது. சூழலில் ‘சொல்வாராக’ என்பதைக் காட்டிலும் ஊழியர்களுக்கு ஆணையிடும் பொருளை ‘கட்டளையிடுவாராக’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: אֲדֹנֵינוּ
  choice: எங்கள் ஆண்டவர்
  rationale: சவுலைக் குறிக்கும் அரசவை மரியாதைப் பட்டத்தைப் பாதுகாக்கிறது; இது இங்கு இறைநாமம் அல்ல.
- source_word: עֲבָדֶיךָ לְפָנֶיךָ
  choice: தம் முன்னிலையில் நிற்கும் தம் ஊழியர்களிடம்
  rationale: அரசரின் முன்னிலையில் பணிபுரியும் அரசவை ஊழியர்கள் என்ற எபிரெய இடவியல் சொற்றொடரின் சூழற்பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: יְבַקְשׁוּ אִישׁ
  choice: ஒருவனைத் தேடும்படி
  rationale: குறிப்பிட்ட திறனுடைய ஒருவரைக் கண்டுபிடிக்க நோக்கமுடன் தேட வேண்டும் என்ற முன்மொழிவைத் தெரிவிக்கிறது.
- source_word: יֹדֵעַ מְנַגֵּן
  choice: வாசிக்கத் தெரிந்த
  rationale: இசைக்கருவியை வாசிக்கும் திறமையையும் அனுபவத்தையும் குறிக்கும் பங்கேற்பு அமைப்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: כִּנּוֹר
  choice: யாழ்
  rationale: பண்டைய நரம்பிசைக் கருவியான lyre-க்கு நெருங்கிய, தமிழில் புரிந்துகொள்ளக்கூடிய மரியாதைமிக்க சொல்லாக ‘யாழ்’ தேர்ந்தெடுக்கப்பட்டது; நவீன harp என்ற துல்லியமற்ற அடையாளத்தைத் தவிர்க்கிறது.
- source_word: וְהָיָה בִּהְיוֹת
  choice: இருக்கும்போது
  rationale: அடுத்து நிகழும் செயலைத் தூண்டும் காலச்சூழலைத் தெளிவாகவும் சுருக்கமாகவும் தருகிறது.
- source_word: רוּחַ אֱלֹהִים רָעָה
  choice: கடவுளிடமிருந்து வரும் தீங்கு விளைவிக்கும் ஆவி
  rationale: אֱלֹהִים என்பதன் மூல/தொடர்பு கருத்தையும் רָעָה என்பதன் தீங்கான விளைவு சார்ந்த பொருளையும் பாதுகாக்கிறது; கடவுளே ஒழுக்கரீதியாகத் தீயவர் என்ற தேவையற்ற உட்பொருளைத் தவிர்க்கிறது.
- source_word: עָלֶיךָ
  choice: உம்மேல் இருக்கும்போது
  rationale: ஆவி சவுல்மேல் வந்து அவரை ஆட்கொள்ளும் அல்லது ஒடுக்கும் நிலையை எபிரெய உருவகத்திற்கு நெருக்கமாகக் காட்டுகிறது.
- source_word: וְנִגֵּן בְּיָדוֹ
  choice: அவன் தன் கையால் வாசிப்பான்
  rationale: ‘தன் கையால்’ என்ற மூலத்தின் தெளிவான, உருவகமிக்க சொல்லாட்சியைப் பாதுகாக்கிறது.
- source_word: וְטוֹב לָךְ
  choice: உமக்கு நலமாகும்
  rationale: வெறும் உணர்ச்சி நிவாரணத்தைக் காட்டிலும் பரந்த நன்மை அல்லது சீரடைதலைக் குறிக்கும் மூலத்தின் திறந்த பொருளைப் பாதுகாக்கிறது.
theological_decisions:
- issue: רוּחַ אֱלֹהִים רָעָה என்பதில் ஆவியின் தன்மையையும் கடவுளுடனான தொடர்பையும் எவ்வாறு மொழிபெயர்ப்பது
  choice: கடவுளிடமிருந்து வரும் தீங்கு விளைவிக்கும் ஆவி
  alternative: கடவுளிடமிருந்து வரும் தீய ஆவி; கடவுளுடைய தீய/தீங்கு விளைவிக்கும் ஆவி
  rationale: எபிரெய தொடர் ‘தீய’ அல்லது ‘தீங்கு விளைவிக்கும்’ என்றும், ‘கடவுளுடைய’ அல்லது ‘கடவுளிடமிருந்து வரும்’ என்றும் புரிந்துகொள்ள இடமளிக்கிறது. முதன்மை உரை தீங்கான விளைவை முன்னிறுத்தி, ஆவியின் கடவுள் சார்ந்த மூலத்தை மறைக்காமல் கூறுகிறது; அடிக்குறிப்பு உண்மையான சொற்பொருள் மற்றும் இலக்கண மாற்றுகளைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், அரசரிடம் பேசும் மரியாதையை ‘ஆண்டவர்’, ‘உம்மேல்’, ‘உமக்கு’ என்பவற்றால் காக்கிறது. வாக்கியம் பொதுவாசகர்களுக்குப் புரியும் வகையில் இயல்பாக்கப்பட்டாலும், ஆவியின் கடவுள் சார்ந்த மூலம் மற்றும் அதன் தீங்கான தன்மை குறித்த மூலத்தின் இறையியல் பதற்றம் அடிக்குறிப்புடன் பாதுகாக்கப்பட்டுள்ளது.
