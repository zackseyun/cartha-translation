source:
  edition: WLC
  text: וַ/יַּ֣עַשׂ שְׁמוּאֵ֗ל אֵ֚ת אֲשֶׁ֣ר דִּבֶּ֣ר יְהוָ֔ה וַ/יָּבֹ֖א בֵּ֣ית לָ֑חֶם וַ/יֶּחֶרְד֞וּ זִקְנֵ֤י הָ/עִיר֙ לִ/קְרָאת֔/וֹ וַ/יֹּ֖אמֶר שָׁלֹ֥ם בּוֹאֶֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/016/004.yaml
  text: So Samuel did what Yahweh had spoken and came to Bethlehem. The elders of the city trembled at his coming and said[a], “Do you come in peace?”
translation:
  language: ta
  text: சாமுவேல் யாவே பேசியபடியே செய்து, பெத்லெகேமுக்கு வந்தார். நகரத்தின் மூப்பர்கள் அவரைச் சந்திக்கையில் நடுங்கி, “நீர் சமாதானமாக வருகிறீரா?” என்று கேட்டார்கள்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் “என்று சொன்னார்” என்ற வினை ஒருமையில் உள்ளது; ஆனால் எழுவாயான “மூப்பர்கள்” பன்மை.
    reason: மூலத்தில் உள்ள எண் ஒத்திசைவின்மையைப் பதிவு செய்கிறது; ஒரு குறிப்பிட்ட மூப்பரையே பேச்சாளராகத் தீர்மானிப்பதில்லை.
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: செய்து
  rationale: கதைத் தொடரில் עשה என்பதன் நேரடியான பொருளை இயல்பாகக் காட்டுகிறது; சாமுவேலின் கீழ்ப்படிதலை அளவுக்கு மீறி விளக்கவில்லை.
- source_word: אֵת אֲשֶׁר דִּבֶּר יְהוָה
  choice: யாவே பேசியபடியே
  rationale: דבר என்பதன் ‘பேசுதல்’ என்ற பொருளைப் பேணுகிறது; எபிரெயத்தில் வெளிப்படையாக இல்லாத ‘கட்டளையிட்டார்’ என்ற சொல்லைச் சேர்க்கவில்லை.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரை ஒரு பட்டப்பெயரால் மாற்றாமல், தமிழில் இயல்பான ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: וַיָּבֹא בֵּית לָחֶם
  choice: பெத்லெகேமுக்கு வந்தார்
  rationale: בוא என்பதற்கான இயல்பான கதைநடை மொழிபெயர்ப்பு; இலக்கையும் தெளிவாகக் காட்டுகிறது.
- source_word: וַיֶּחֶרְדוּ
  choice: நடுங்கி
  rationale: חרד குறிக்கும் அச்சத்தால் ஏற்பட்ட தீவிர கலக்கத்தையும் உடல் நடுக்கத்தையும் உயிரோட்டமாகப் பேணுகிறது.
- source_word: זִקְנֵי הָעִיר
  choice: நகரத்தின் மூப்பர்கள்
  rationale: நகரச் சமூகத்தில் அதிகாரமும் பொறுப்பும் வகித்த அங்கீகரிக்கப்பட்ட மூப்பர்களைக் குறிக்கும் இயல்பான தமிழ் சொற்றொடர்.
- source_word: לִקְרָאתוֹ
  choice: அவரைச் சந்திக்கச் சென்றார்கள்
  rationale: לקראת என்பதன் ‘எதிர்கொண்டு சந்திக்கச் செல்லுதல்’ என்ற திசை சார்ந்த பொருளைத் தெளிவாகக் காட்டுகிறது.
- source_word: שָׁלוֹם בּוֹאֶךָ
  choice: நீர் சமாதானமாகத்தான் வருகிறீரா?
  rationale: சாமுவேலின் வருகை நல்லெண்ணமும் தீங்கற்ற நோக்கமும் கொண்டதா என்று கேட்கும் எபிரெய வழக்கை இயல்பான மரியாதைத் தமிழில் தருகிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூல வசனம் நான்கெழுத்துத் தெய்வீகப் பெயரை நேரடியாகப் பயன்படுத்துகிறது. அதைப் பட்டப்பெயரால் மாற்றாமல், ஏற்றுக்கொள்ளப்பட்ட உச்சரிப்புக்கு நெருக்கமான தமிழ் ஒலிபெயர்ப்பாக ‘யாவே’ என்று வழங்குவது பெயரின் தன்மையைப் பேணுகிறது.
- issue: וַיֹּאמֶר என்ற ஒருமை வினை வடிவம்
  choice: பொருளுக்கேற்ற பன்மையாக ‘அவர்கள்…கேட்டார்கள்’
  alternative: சொல்லுக்கு நெருக்கமாக ‘அவர் கேட்டார்’ அல்லது ‘ஒருவர் கேட்டார்’
  rationale: எழுவாய் ‘நகரத்தின் மூப்பர்கள்’ என்பது பன்மை; ஆகவே கூட்டத்தின் கேள்வியைத் தமிழில் பன்மையாக வழங்குவது தெளிவானது. அதே நேரத்தில் எபிரெய வினை வடிவத்தின் ஒருமை அடிக்குறிப்பில் வெளிப்படையாகப் பாதுகாக்கப்படுகிறது; குறிப்பிட்ட ஒரே மூப்பரை உரையில் ஊகிக்கவில்லை.
translation_notes:
  register: நவீன தரமான, மரியாதைமிக்க தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘நீர்/வருகிறீரா’ என்பது சாமுவேலுக்குரிய மரியாதையை இயல்பாகக் காட்டுகிறது. வசனத்தின் அச்சநிலையும், வருகையின் நோக்கம் குறித்த மூப்பர்களின் கவலையும் தெளிவாகப் பேணப்பட்டுள்ளன.
