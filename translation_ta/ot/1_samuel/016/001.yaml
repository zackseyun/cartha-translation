  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל שְׁמוּאֵ֗ל עַד מָתַי֙ אַתָּה֙ מִתְאַבֵּ֣ל אֶל שָׁא֔וּל וַ/אֲנִ֣י מְאַסְתִּ֔י/ו מִ/מְּלֹ֖ךְ עַל יִשְׂרָאֵ֑ל מַלֵּ֨א קַרְנְ/ךָ֜ שֶׁ֗מֶן וְ/לֵ֤ךְ אֶֽשְׁלָחֲ/ךָ֙ אֶל יִשַׁ֣י בֵּֽית הַלַּחְמִ֔י כִּֽי רָאִ֧יתִי בְּ/בָנָ֛י/ו לִ֖/י מֶֽלֶךְ־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/016/001.yaml
  text: And Yahweh said to Samuel[a], “How long will you grieve over Saul, since I have rejected him from being king over Israel? Fill your horn with oil and go; I am sending you to Jesse the Bethlehemite, for I have provided for myself a king among his sons.”
translation:
  language: ta
  text: யாவே சாமுவேலிடம், “நீ எவ்வளவு காலம் சவுலுக்காகத் துக்கப்பட்டுக்கொண்டிருப்பாய்? இஸ்ரவேலின்மேல் அரசனாக இருப்பதிலிருந்து நான் அவனை நிராகரித்துவிட்டேன். உன் கொம்பை எண்ணெயால் நிரப்பிக்கொண்டு செல். பெத்லெகேமைச் சேர்ந்த ஈசாயிடம் நான் உன்னை அனுப்புகிறேன்; ஏனெனில் அவனுடைய மகன்களிடையே எனக்கென ஓர் அரசனை நான் கண்டிருக்கிறேன்[a]” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவனுடைய மகன்களிடையே எனக்கென ஓர் அரசனை நான் தேர்ந்தெடுத்திருக்கிறேன்” அல்லது “ஏற்பாடு செய்திருக்கிறேன்.” எபிரெய வினைச்சொல்லின் நேரடிப் பொருள் “கண்டிருக்கிறேன்”; இச்சூழலில் அது தேர்ந்தெடுத்தல் அல்லது ஏற்பாடு செய்தல் என்பதையும் உணர்த்தலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: யாவே
  rationale: தேவனுடைய தனிப்பெயரை ஒரு பட்டப்பெயரால் மாற்றாமல், எபிரெயப் பெயரின் வழக்கமான தமிழ் ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: מִתְאַבֵּל אֶל שָׁאוּל
  choice: சவுலுக்காகத் துக்கப்பட்டுக்கொண்டிருப்பாய்
  rationale: தொடர்ந்து துக்கப்படுவதைக் குறிக்கும் வினைவடிவத்தையும், சவுலை முன்னிட்டு சாமுவேல் வருந்துவதையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: מְאַסְתִּיו
  choice: நான் சவுலைப் புறக்கணித்துவிட்டேன்
  rationale: מאס என்பதன் நிராகரித்தல் அல்லது ஏற்க மறுத்தல் என்ற பொருளைத் தருகிறது; இங்கு அது அரச பதவியைப் பற்றியது என்பதை அடுத்த சொற்றொடர் வரையறுக்கிறது.
- source_word: מִמְּלֹךְ עַל יִשְׂרָאֵל
  choice: இஸ்ரவேலின்மேல் அரசனாக இருப்பதிலிருந்து
  rationale: சவுலின் ஒட்டுமொத்த இறுதி நிலையைப் பற்றிய முடிவைச் சேர்க்காமல், இஸ்ரவேலின் அரச பதவியிலிருந்து விலக்கப்படுவதையே முறையாகக் காட்டுகிறது.
- source_word: מַלֵּא קַרְנְךָ שֶׁמֶן
  choice: உன் கொம்பில் எண்ணெயை நிரப்பிக்கொண்டு
  rationale: அபிஷேக எண்ணெயை வைத்திருந்த மிருகக் கொம்பு என்ற மூலப்படிமத்தைப் பாதுகாக்கிறது.
- source_word: וְלֵךְ
  choice: புறப்பட்டுப் போ
  rationale: கட்டளையின் செயல்துடிப்பை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: אֶשְׁלָחֲךָ
  choice: நான் உன்னை அனுப்புகிறேன்
  rationale: உடனடியான தெய்வீகப் பணியனுப்புதலை நிகழ்கால வடிவில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: יִשַׁי בֵּית הַלַּחְמִי
  choice: பெத்லெகேமைச் சேர்ந்த ஈசாய்
  rationale: ஈசாயின் ஊர்சார்பைக் குறிக்கும் எபிரெய அடைமொழியைத் தெளிவான இயல்பான தமிழில் வழங்குகிறது.
- source_word: רָאִיתִי
  choice: நான் கண்டிருக்கிறேன்
  rationale: ראה என்பதன் அடிப்படை ‘காண்’ என்ற உருவகத்தைப் பாதுகாக்கிறது; சூழலில் தெரிவுசெய்தல் அல்லது ஏற்பாடு செய்தல் என்ற உட்பொருள் இருக்கலாம் என்பதைக் குறிப்பில் தருகிறது.
- source_word: בְּבָנָיו
  choice: அவனுடைய மகன்களிடையே
  rationale: ஈசாயின் மகன்களில் ஒருவன் என்பதைக் காட்டும் குழுவிற்குள் உள்ள தேர்வை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: לִי
  choice: எனக்காக
  rationale: தெய்வீக நோக்கம் அல்லது உரிமையைச் சுட்டும் இலக்குப் பொருளைத் தமிழில் நேரடியாகப் பாதுகாக்கிறது.
- source_word: מֶלֶךְ
  choice: ஓர் அரசனை
  rationale: பெயரிடப்படாத, ஈசாயின் மகன்களில் ஒருவரான அரசனைச் சுட்டும் மூலத்தின் வரையறையற்ற வடிவத்தைப் பிரதிபலிக்கிறது.
theological_decisions:
- issue: சவுலை யாவே புறக்கணித்ததன் வரம்பு
  choice: இஸ்ரவேலின்மேல் அரசனாக இருப்பதிலிருந்து நான் சவுலைப் புறக்கணித்துவிட்டேன்
  alternative: இஸ்ரவேலை ஆள்வதிலிருந்து நான் அவனை நிராகரித்துவிட்டேன்
  rationale: மூலவசனம் கூறும் தீர்ப்பை அரசாட்சிக்குள் வரையறுத்து, சவுலின் இறுதி ஆவிக்குரிய நிலை குறித்து உரை கூறாத முடிவைச் சேர்ப்பதைத் தவிர்க்கிறது.
- issue: רָאִיתִי לִי என்பதின் பொருள்
  choice: எனக்காக ஓர் அரசனை நான் கண்டிருக்கிறேன்
  alternative: எனக்காக ஓர் அரசனை நான் ஏற்பாடு செய்திருக்கிறேன் / தேர்ந்தெடுத்திருக்கிறேன்
  rationale: ‘காணுதல்’ என்ற மூலச் சொல்லின் படிமத்தையும் அதன் சூழல்சார் தேர்வு அல்லது ஏற்பாடு என்ற சாத்தியத்தையும் ஒன்றை மட்டும் கட்டாயப்படுத்தாமல் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரமான, மரியாதைமிக்க, சாதாரண வாசகர்களுக்குப் புரியும் தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘யாவே’ என்ற தனிப்பெயரும், அபிஷேகப் பாத்திரமான ‘கொம்பு’ என்ற மூலப்படிமமும் பாதுகாக்கப்பட்டுள்ளன; இறுதிக் கூறின் உண்மையான சொற்பொருள்-சூழற்பொருள் இடையேயான தெளிவின்மை அடிக்குறிப்பில் வைக்கப்பட்டுள்ளது.
