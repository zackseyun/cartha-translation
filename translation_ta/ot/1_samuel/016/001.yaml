revisions:
- from: யாவே சாமுவேலிடம், “இஸ்ரவேலின்மேல் அரசனாக இருப்பதிலிருந்து நான் சவுலைப் புறக்கணித்துவிட்டேன்; நீ எதுவரை அவனுக்காகத் துக்கப்பட்டுக்கொண்டிருப்பாய்? உன் கொம்பில் எண்ணெயை நிரப்பிக்கொண்டு புறப்பட்டுப் போ. பெத்லெகேமைச் சேர்ந்த ஈசாயிடம் நான் உன்னை அனுப்புகிறேன்; ஏனெனில் அவனுடைய மகன்களிடையே எனக்காக ஓர் அரசனை நான் கண்டிருக்கிறேன்[a]” என்றார்.
  to: யாவே சாமுவேலிடம், “நீ எவ்வளவு காலம் சவுலுக்காகத் துக்கப்பட்டுக்கொண்டிருப்பாய்? இஸ்ரவேலின்மேல் அரசனாக இருப்பதிலிருந்து நான் அவனை நிராகரித்துவிட்டேன். உன் கொம்பை எண்ணெயால் நிரப்பிக்கொண்டு செல். பெத்லெகேமைச் சேர்ந்த ஈசாயிடம் நான் உன்னை அனுப்புகிறேன்; ஏனெனில் அவனுடைய மகன்களிடையே எனக்கென ஓர் அரசனை நான் கண்டிருக்கிறேன்[a]” என்றார்.
  rationale: The revision strengthens the rendering of מאס to communicate rejection rather than mere disregard, improves natural modern Tamil phrasing, and retains the Hebrew word order’s rhetorical question followed by its rationale. The final clause remains literal in the text, with the contextual selection/provision nuance preserved in the footnote.
