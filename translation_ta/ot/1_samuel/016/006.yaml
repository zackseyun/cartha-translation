  text: וַ/יְהִ֣י בְּ/בוֹאָ֔/ם וַ/יַּ֖רְא אֶת אֱלִיאָ֑ב וַ/יֹּ֕אמֶר אַ֛ךְ נֶ֥גֶד יְהוָ֖ה מְשִׁיחֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/016/006.yaml
  text: When they came in[a], he saw Eliab and said, “Surely Yahweh’s anointed is before Yahweh.”
translation:
  language: ta
  text: அவர்கள் வந்தபோது, சாமுவேல் எலியாபைப் பார்த்து, “யாவே அபிஷேகம் செய்தவர்[a] நிச்சயமாக யாவேயின் முன்னிலையில் இருக்கிறார்” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யாவேயின் மேசியா.” இங்குள்ள எபிரெயச் சொல்தான் பின்னர் “மேசியா” என்ற பட்டத்திற்கும் பயன்படுத்தப்படுகிறது. ஆனால் இந்த இடத்தில், யாவே அரசராகத் தேர்ந்தெடுத்து அபிஷேகம் செய்தவர் என்று சாமுவேல் கருதிய நபரைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בְּבוֹאָם
  choice: அவர்கள் வந்தபோது
  rationale: வַיְהִי என்ற எபிரெயக் கதைத் தொடர் வடிவத்தையும், בְּבוֹאָם என்ற காலச் சூழலையும் இயல்பான நவீனத் தமிழில் ஒரே காலவாக்கியமாக அளிக்கிறது; பழமையான ‘அப்போது சம்பவித்ததாவது’ போன்ற நடையைத் தவிர்க்கிறது.
- source_word: וַיַּרְא אֶת אֱלִיאָב
  choice: சாமுவேல் எலியாபைப் பார்த்து
  rationale: רָאָה என்பதன் நேரடியான பொருளான ‘பார்த்தார்’ என்பதைக் காக்கிறது. எபிரெயத்தில் மறைமுகமாக உள்ள எழுவாய், தமிழில் குழப்பம் தவிர்க்க ‘சாமுவேல்’ என்று வெளிப்படுத்தப்படுகிறது.
- source_word: וַיֹּאמֶר
  choice: என்றார்
  rationale: אָמַר என்பதன் இயல்பான பொருள் ‘சொன்னார்/என்றார்.’ இது மனத்திற்குள் கூறப்பட்டதா என்பதை எபிரெயம் வெளிப்படையாகச் சொல்லாததால், ‘நினைத்தார்’ என்று விளக்கமளிக்கவில்லை.
- source_word: אַךְ
  choice: நிச்சயமாக
  rationale: எலியாபைக் கண்டவுடன் சாமுவேல் கொண்ட உறுதியான முடிவை אַךְ இங்கு வலியுறுத்துகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தேவனுடைய தனிப்பெயரான நான்கு எழுத்துப் பெயரை ஒரு பட்டமாக மாற்றாமல், தமிழில் உச்சரிப்புக்கு ஏற்றவாறு ஒலிபெயர்க்கிறது.
- source_word: מְשִׁיחוֹ
  choice: யாவே அபிஷேகம் செய்தவர்
  rationale: מָשִׁיחַ என்பது இச்சூழலில் அரசராகத் தெரிவுசெய்யப்பட்டு அபிஷேகம் செய்யப்படுபவரைக் குறிக்கிறது. மூன்றாம் ஆண்பால் ஒருமை உடைமைப் பின்னொட்டை யாவேயோடு இணைத்து, இயல்பான தமிழில் செயப்பாட்டு உறவாக வெளிப்படுத்துகிறது.
- source_word: נֶגֶד יְהוָה
  choice: யாவேயின் முன்னிலையில்
  rationale: נֶגֶד என்பது ‘முன்/முன்னிலையில்’ என்றும், தொடர்ந்து வரும் יְהוָה அதன் தொடர்புப் பொருளாகவும் உள்ளது. எபிரெயத்தின் வெளிப்படையான தேவப்பெயரை பிரதிப்பெயராக மாற்றாமல் காக்கிறது.
theological_decisions:
- issue: தாவீதுக்கு முந்தைய அரசத் தேர்வுச் சூழலில் מְשִׁיחוֹ என்பதை மொழிபெயர்த்தல்
  choice: யாவே அபிஷேகம் செய்தவர்
  alternative: யாவேயின் மேசியா
  rationale: இங்கு சாமுவேல், யாவே அரசராகத் தேர்ந்தெடுத்து அபிஷேகம் செய்யவிருப்பவர் எலியாப் என்று கருதுகிறார். ஆகவே உடனடி வரலாற்றுச் சூழலைக் காக்கும் மொழிபெயர்ப்பு முதன்மை உரையில் பயன்படுத்தப்படுகிறது; பிற்கால ‘மேசியா’ என்ற பட்டத்தோடு உள்ள சொல் தொடர்பு அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
- issue: נֶגֶד יְהוָה என்பதில் உள்ள ‘முன்னிலையில்’ என்ற உறவு
  choice: யாவேயின் முன்னிலையில்
  alternative: அவருக்கு முன்பாக
  rationale: எபிரெய உரையில் יְהוָה வெளிப்படையாக இருப்பதால், அதை ‘அவர்’ என்று மாற்றுவதால் ஏற்படக்கூடிய சுட்டுப்பெயர் குழப்பத்தைத் தவிர்த்து, சொற்றொடரின் பதற்றத்தையும் மீளுரையையும் காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, மரியாதையான கதைநடை பயன்படுத்தப்பட்டுள்ளது. மறைமுக எழுவாயைத் தெளிவுபடுத்த ‘சாமுவேல்’ வெளிப்படுத்தப்பட்டு, அவரைக் குறிக்கும் வினைமுற்றுகளும் மேற்கோளுக்குள் கருதப்படும் நபரைக் குறிக்கும் வடிவங்களும் மரியாதைப் பன்மையில் அமைக்கப்பட்டுள்ளன. தேவப்பெயர் ‘யாவே’ என்று ஒலிபெயர்க்கப்பட்டுள்ளது.
