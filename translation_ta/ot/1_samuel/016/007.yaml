base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/016/007.yaml
  text: But Yahweh said to Samuel[a], “Do not look at his appearance or at the height of his stature, because I have rejected him. For not as man sees does God see, for man sees what is before the eyes[c][b], but Yahweh sees the heart.”
translation:
  language: ta
  text: ஆனால் யாவே சாமுவேலிடம், “அவனுடைய தோற்றத்தையோ அவனுடைய உயரத்தையோ பார்க்காதே; ஏனெனில், நான் அவனை நிராகரித்துவிட்டேன். மனிதன் பார்ப்பதுபோல் யாவே பார்ப்பதில்லை[a]. மனிதன்[b] கண்களுக்குத் தெரிவதைப் பார்க்கிறான்[c]; ஆனால் யாவே உள்ளத்தைப் பார்க்கிறார்” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இன்னும் சொல்லுக்கு நெருக்கமாக, “ஏனெனில், மனிதன் பார்ப்பதுபோல் அல்ல.” எபிரெய வாசகம் இங்கே சுருக்கமாக உள்ளது; யாவேயின் பார்வை மனிதப் பார்வையிலிருந்து வேறுபடுகிறது என்பதே கருத்து.
    reason: lexical_alternative
  - marker: b
    text: இங்கே “மனிதன்” என்பது ஓர் ஆணை மட்டும் குறிக்காமல், மனிதர்களைப் பொதுவாகக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, “வெளித்தோற்றத்தைப் பார்க்கிறான்.” எபிரெயில் சொல்லுக்கு நேராக, “கண்களுக்கு” என்று உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைத் திருப்பெயரை ஒரு பட்டமாக மாற்றாமல், எபிரெய தனிப்பெயரின் வழக்கமான தமிழ் ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: תַּבֵּט
  choice: கவனிக்காதே
  rationale: வெறுமனே கண்ணால் பார்ப்பதைத் தடைசெய்வதல்லாமல், வெளித்தோற்றத்தைத் தேர்வுக்கான அடிப்படையாகக் கருதாதே என்ற சூழல்சார்ந்த பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: מַרְאֵהוּ
  choice: அவனுடைய தோற்றம்
  rationale: கண்ணுக்குப் புலப்படும் வெளிப்புறத் தோற்றத்தைக் குறிக்கும் நேரடியான, இயல்பான சொல்.
- source_word: גְּבֹהַּ קוֹמָתוֹ
  choice: உயரமான உடல்வாகை
  rationale: உடலின் உயரத்தையும் மொத்த உருவமைப்பையும் குறிக்கும் எபிரெய சொற்றொடரின் பொருளைத் தெளிவாகத் தருகிறது.
- source_word: מְאַסְתִּיהוּ
  choice: நான் அவனை நிராகரித்துவிட்டேன்
  rationale: அரசனாகத் தேர்ந்தெடுக்கும் சூழலில் அவன் ஏற்றுக்கொள்ளப்படவில்லை என்பதைக் குறிக்கிறது; ‘வெறுத்தேன்’ என்ற தேவையற்ற உணர்ச்சிப் பொருளைத் தவிர்க்கிறது.
- source_word: הָאָדָם
  choice: மனிதன்
  rationale: ஒரு குறிப்பிட்ட ஆணை அல்லாமல் பொதுவாக மனிதரைச் சுட்டும் எபிரெய ஒருமை வடிவத்தைப் பாதுகாக்கிறது; இதை அடிக்குறிப்பு தெளிவுபடுத்துகிறது.
- source_word: לַעֵינַיִם
  choice: கண்களுக்குத் தெரிவது
  rationale: ‘கண்களுக்கு’ என்ற எபிரெய உருவகத்தைப் பாதுகாத்தபடி, தமிழில் அதன் பொருளை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: לַלֵּבָב
  choice: உள்ளம்
  rationale: சிந்தனை, விருப்பம், நோக்கம், மனப்பாங்கு ஆகியவற்றின் அக மையத்தைக் குறிக்கும் எபிரெயச் சொல்லுக்கு இயல்பான நவீனத் தமிழ் இணை.
theological_decisions:
- issue: மனிதப் பார்வைக்கும் யாவேயின் பார்வைக்கும் இடையிலான வேறுபாடு
  choice: மனிதன் பார்ப்பதுபோல் யாவே பார்ப்பதில்லை
  alternative: மனிதன் பார்ப்பது அல்ல
  rationale: எபிரெய வாசகம் சுருக்கமாகவும் விடுபட்ட வாக்கிய அமைப்புடனும் உள்ளது. சூழலில் மறைந்துள்ள யாவே என்ற எழுவாயைத் தமிழில் வெளிப்படுத்துவது கருத்தைத் தெளிவாக்குகிறது; மூலத்தின் சுருக்கமான மாற்று அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: לֵבָב என்பதன் இறையியல் மற்றும் மானுடவியல் பரப்பு
  choice: உள்ளம்
  alternative: இருதயம்
  rationale: இங்கு உடல் உறுப்பைக் காட்டிலும் மனிதரின் அக இயல்பு, எண்ணம், நோக்கம் ஆகியவை குறிக்கப்படுகின்றன. ‘உள்ளம்’ இந்த விரிந்த பொருளை இயல்பான தமிழில் தருகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான உரைநடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய இணைப்புச் சொற்களின் மீளுருவாக்கம் தமிழில் கனமாகாமல் இருக்க வாக்கியங்கள் இயல்பாகப் பிரிக்கப்பட்டுள்ளன; மனிதன்/யாவே மற்றும் கண்கள்/உள்ளம் என்ற இணைமுரண்கள் பாதுகாக்கப்பட்டுள்ளன.
