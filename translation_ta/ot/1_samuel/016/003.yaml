revisions:
- from: ஈசாயைப் பலிக்காக அழைப்பாயாக[a]. நீ என்ன செய்ய வேண்டும் என்பதை நான் உனக்குத் தெரியப்படுத்துவேன்[b]. நான் உன்னிடம் யாரைக் குறிப்பிடுகிறேனோ, அவரை எனக்காக அபிஷேகம் செய்வாயாக[c].
  to: ஈசாயை பலிக்கு அழைப்பாயாக[a]; நீ என்ன செய்வாய் என்பதை நான் உனக்குத் தெரிவிப்பேன்[b]; நான் உனக்குச் சொல்லும் ஒருவரை எனக்காக அபிஷேகம் செய்வாயாக[c].
  rationale: The revision keeps the verse’s three coordinated divine instructions, preserves the Hebrew’s prospective wording for Samuel’s action, and replaces the interpretive present ‘குறிப்பிடுகிறேனோ’ with the direct future-oriented ‘சொல்லும்.’ It retains standard Tamil biblical names and theological vocabulary, and every footnote remains anchored to the relevant phrase.
