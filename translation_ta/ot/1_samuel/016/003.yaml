  text: Invite Jesse to the sacrifice[a], and I will make known to you what you shall do[c][b]; and you shall anoint for me the one whom I tell you.
translation:
  language: ta
  text: ஈசாயை பலிக்கு அழைப்பாயாக[a]; நீ என்ன செய்வாய் என்பதை நான் உனக்குத் தெரிவிப்பேன்[b]; நான் உனக்குச் சொல்லும் ஒருவரை எனக்காக அபிஷேகம் செய்வாயாக[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘ஈசாயைப் பலிக்கு வரவழைப்பாயாக.’
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘நீ என்ன செய்யவேண்டும் என்பதை நான் உனக்குக் காட்டுவேன்.’
    reason: lexical_alternative
  - marker: c
    text: அல்லது, ‘நான் உனக்குச் சொல்லும் எவரையும் எனக்காக அபிஷேகம் செய்வாயாக.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְקָרָאתָ לְיִשַׁי
  choice: ஈசாயை ... அழைப்பாயாக
  rationale: קרא என்பது இச்சூழலில் ஒரு பலி நிகழ்வில் கலந்துகொள்ள அழைப்பதைக் குறிக்கிறது. தமிழில் ‘அழை’ இயல்பாகவும் கட்டளையின் வலிமையைத் தக்கவைத்தும் உள்ளது.
- source_word: בַּזָּבַח
  choice: பலிக்காக
  rationale: זבח என்பது பலியையும் பலி நிகழ்வையும் குறிக்கலாம். அழைப்பதுடன் சேர்ந்த இச்சொற்றொடரில், ‘பலிக்காக’ என்பது அந்த நிகழ்வில் பங்கேற்கும் நோக்கத்தை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: וְאָנֹכִי אוֹדִיעֲךָ
  choice: நான் உனக்குத் தெரியப்படுத்துவேன்
  rationale: ידע என்பதன் ஹிஃபில் வடிவம் ‘அறியச் செய், தெரியப்படுத்து’ என்னும் causative பொருளைக் கொண்டது. தனித்த சுட்டுப்பெயரான אָנֹכִי தரும் வலியுறுத்தலை ‘நான்’ தக்கவைக்கிறது.
- source_word: אֵת אֲשֶׁר תַּעֲשֶׂה
  choice: நீ என்ன செய்ய வேண்டும் என்பதை
  rationale: Hebrew imperfect இங்கு எதிர்கால அறிவுறுத்தலைக் குறிக்கிறது. ‘செய்ய வேண்டும்’ என்பது தமிழில் அதன் வழிகாட்டும்/கடமை உணர்வை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וּמָשַׁחְתָּ
  choice: அபிஷேகம் செய்வாயாக
  rationale: משׁח என்பது அதிகாரபூர்வமாக எண்ணெய் பூசி அர்ப்பணிக்கும் செயலைக் குறிக்கும் வழக்குச் சொல். ‘அபிஷேகம் செய்’ வேதாகமத் தமிழில் பரிச்சயமானது; இவ்வசனம் சொல்லாத ‘ராஜாவாக’ என்ற பதவியைச் சேர்ப்பதில்லை.
- source_word: לִי
  choice: எனக்காக
  rationale: இங்கு לְ என்பது இறைவனின் சார்பாகவும் அவரது நோக்கத்திற்காகவும் செயல் நடைபெறுவதைத் தெரிவிக்கிறது.
- source_word: אֵת אֲשֶׁר אֹמַר אֵלֶיךָ
  choice: நான் உன்னிடம் யாரைக் குறிப்பிடுகிறேனோ, அவரை
  rationale: சொல்லப்படவிருக்கும் நபரை தேவன் அடையாளம் காட்டுவார் என்பதே பொருள். ‘குறிப்பிடுகிறேனோ’ என்பது ‘பெயரிடுதல்’ என்ற கூடுதல் கருத்தைத் தவிர்த்து, தமிழில் தெளிவாக அமைகிறது.
theological_decisions:
- issue: அபிஷேகத்தின் தன்மை
  choice: பதவியை வெளிப்படையாகச் சேர்க்காமல் ‘அபிஷேகம் செய்’ என்று வைத்தல்
  alternative: ‘ராஜாவாக அபிஷேகம் செய்’ என்று மொழிபெயர்த்தல்
  rationale: அருகிலுள்ள கதைச்சூழல் அரச அபிஷேகத்தைக் காட்டினாலும், இவ்வசனம் பதவியை நேரடியாகக் குறிப்பிடவில்லை. எனவே மூலத்தின் கட்டுப்பாட்டைத் தக்கவைக்கிறது.
- issue: தேவன் தேர்ந்தெடுக்கும் நபரைச் சுட்டும் சொற்றொடர்
  choice: ‘யாரைக் குறிப்பிடுகிறேனோ, அவரை’
  alternative: ‘நான் சொல்லும் எவரையும்’
  rationale: மூலத்தின் אֲשֶׁר வடிவம் நபரின் அடையாளத்தைத் திறந்தவாறே வைத்தாலும், சூழலில் குறிப்பிட்ட ஒருவரைத் தேவன் சுட்டுவார். தேர்வை மனிதருக்குரியதாக மாற்றாமல் அந்த எதிர்பார்ப்பைத் தக்கவைக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையும் வேதாகமச் செறிவும் கொண்ட எளிய நடை பயன்படுத்தப்பட்டுள்ளது. தெய்வீக நேரடிப் பேச்சின் கட்டளைநடை ‘-ஆயாக’ வடிவால் தக்கவைக்கப்பட்டுள்ளது; அளவுக்கு மீறிய பழந்தமிழ் தவிர்க்கப்பட்டுள்ளது.
