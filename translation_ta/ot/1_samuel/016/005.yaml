base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/016/005.yaml
  text: He said[a], “Peace. I have come to sacrifice to Yahweh. Consecrate yourselves, and come with me to the sacrifice.” And he consecrated Jesse and his sons and invited them to the sacrifice.
translation:
  language: ta
  text: அவர், “சமாதானம்.[a] யாவேக்குப் பலியிட வந்திருக்கிறேன். உங்களைப் பரிசுத்தப்படுத்திக்கொண்டு, என்னோடு பலிக்கு வாருங்கள்” என்றார். பின்பு அவர் ஈசாயையும் அவருடைய மகன்களையும் பரிசுத்தப்படுத்தி, அவர்களைப் பலிக்கு அழைத்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது “எல்லாம் நலமே” / “சமாதானத்தோடு.” எபிரெயத்தில் இங்கு “சமாதானம்” என்ற சொல் மட்டுமே உள்ளது; சாமுவேலின் வருகை பகை நோக்கமற்றது என்பதை அது உறுதிப்படுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁלוֹם
  choice: சமாதானம்
  rationale: முந்தைய வசனத்தில் கேட்கப்பட்ட கேள்விக்குப் பதிலாக, சாமுவேலின் வருகை பகை நோக்கமற்றது என்பதை உறுதிப்படுத்தும் தனிச்சொல். எபிரெயச் சொல்லின் சுருக்கத்தையும் பரந்த பொருள் வளத்தையும் இது காக்கிறது.
- source_word: לִזְבֹּחַ לַיהוָה
  choice: யெகோவாவுக்குப் பலியிட
  rationale: לִזְבֹּחַ என்னும் நோக்க வினையெச்சத்தையும், பலி யெகோவாவை நோக்கிய வழிபாட்டுச் செயல் என்பதையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: בָּאתִי
  choice: வந்திருக்கிறேன்
  rationale: சாமுவேல் இப்போது அங்கு இருப்பதற்கான நோக்கத்தை விளக்கும் நிறைவேற்ற வினை; தமிழின் நிகழ்கால நிறைவு வடிவம் உரையாடலுக்கு இயல்பாக உள்ளது.
- source_word: הִתְקַדְּשׁוּ
  choice: உங்களைப் பரிசுத்தப்படுத்திக்கொண்டு
  rationale: பலியில் பங்கேற்பதற்கான சடங்குசார் ஆயத்தத்தையும் புனித நோக்கத்திற்காகத் தம்மை ஒதுக்குவதையும் குறிக்கிறது; வெறும் தூய்மைப்படுத்துதல் என்று பொருளைக் குறுக்கவில்லை.
- source_word: וּבָאתֶם אִתִּי בַּזָּבַח
  choice: என்னோடு பலிக்கு வாருங்கள்
  rationale: வழிமுறையோடு இணைந்த அழைப்பாக உள்ள எபிரெயத் தொடரை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: וַיְקַדֵּשׁ
  choice: பரிசுத்தப்படுத்தி
  rationale: பலியில் பங்கேற்க ஈசாயையும் அவன் மகன்களையும் சாமுவேல் சடங்குசார் முறையில் ஆயத்தப்படுத்திய செயலைக் குறிக்கிறது.
- source_word: וַיִּקְרָא לָהֶם לַזָּבַח
  choice: அவர்களைப் பலிக்கு அழைத்தார்
  rationale: קרא + ל இச்சூழலில் பலி நிகழ்வில் பங்கேற்க அழைப்பதைக் குறிக்கிறது; கட்டாயமாக வரவழைத்தார் என்ற தேவையற்ற வலிமையைச் சேர்க்கவில்லை.
- source_word: יִשַׁי
  choice: ஈசாய்
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் அறியப்பட்ட பெயர் வடிவம்.
- source_word: בָּנָיו
  choice: அவனுடைய மகன்கள்
  rationale: எபிரெயம் ஆண் பிள்ளைகளைத் தெளிவாகக் குறிப்பிடுகிறது; கதையின் தொடர்ச்சிக்கும் இவ்விவரம் முக்கியம்.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யெகோவா
  alternative: யாவே
  rationale: மூலத்தில் வரும் உடன்படிக்கைப் பெயரை பொதுப்பட்டமான ‘கர்த்தர்’ என்று மாற்றாமல் தனிப்பெயராகக் காக்கிறது. நவீன தமிழ் கிறிஸ்தவ வாசகர்களிடையே பரவலாக அறியப்படும் வடிவமாக ‘யெகோவா’ தேர்ந்தெடுக்கப்பட்டது; ‘யாவே’ என்பது மூல உச்சரிப்பை நெருங்கிய மாற்று.
- issue: קדשׁ வேரின் சடங்குசார் பொருள்
  choice: பரிசுத்தப்படுத்துதல்
  alternative: தூய்மைப்படுத்துதல்
  rationale: இங்கு வெறும் கழுவுதல் அல்லது ஒழுக்கத் தூய்மை மட்டும் அல்லாமல், புனித நிகழ்வில் பங்கேற்கத் தம்மை ஆயத்தப்படுத்தி ஒதுக்குவதும் அடங்குகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் கண்ணியமான, எளிதில் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. பலி மற்றும் பரிசுத்தப்படுத்துதல் போன்ற வழிபாட்டுச் சொற்களின் சடங்குசார் நிறம் காக்கப்பட்டுள்ளது; மூலத்தின் சுருக்கமான ‘சமாதானம்’ அடிக்குறிப்புடன் அப்படியே வைக்கப்பட்டுள்ளது.
