  terminology: “சமாதானம்,” “பலியிட,” and “பரிசுத்தப்படுத்துதல்” preserve the concise assurance and cultic sense of the Hebrew well. The divine-name form requires correction for consistency with the project’s stated Yahweh policy.
  issues:
