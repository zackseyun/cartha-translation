base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/016/008.yaml
  text: Then Jesse called Abinadab and made him pass before Samuel. And he said[a], “Yahweh has not chosen this one either.”
translation:
  language: ta
  text: அப்போது ஈசாய் அபினதாபை அழைத்து, அவனைச் சாமுவேலின் முன்பாகக் கடந்து செல்லச் செய்தான். அவர்[a], “யாவே இவனையும் தேர்ந்தெடுக்கவில்லை” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரேய மூலத்தில் பேசியவரின் பெயர் வெளிப்படையாகக் குறிப்பிடப்படவில்லை; சூழல் சாமுவேலைச் சுட்டுகிறது.
    reason: source_ambiguity
lexical_decisions:
- source_word: וַיִּקְרָא יִשַׁי אֶל אֲבִינָדָב
  choice: ஈசாய் அபினதாபை அழைத்து
  rationale: קרא என்பதன் ‘அழைத்தல்’ என்ற பொருளையும் இயல்பான தமிழ் வாக்கிய அமைப்பையும் காக்கிறது; אֶל தனியாக மொழிபெயர்க்கப்படாமல் வினையின் செயப்படுபொருள் அமைப்பில் இயல்பாக உட்படுத்தப்பட்டுள்ளது.
- source_word: וַיַּעֲבִרֵהוּ לִפְנֵי שְׁמוּאֵל
  choice: அவனைச் சாமுவேலுக்கு முன்பாகக் கடந்து செல்லச் செய்தான்
  rationale: עבר என்பதன் ஹிஃபில் வடிவிலுள்ள காரணவினைப் பொருளை ‘செல்லச் செய்தான்’ என்று வெளிப்படையாகக் காக்கிறது.
- source_word: וַיֹּאמֶר
  choice: அவர் … என்றார்
  rationale: எபிரெயத்தில் எழுவாய் வெளிப்படையாகக் குறிப்பிடப்படாததால் பெயரைச் சேர்க்காமல் பிரதிப்பெயரால் அந்தத் தெளிவின்மையைத் தக்கவைக்கிறது.
- source_word: גַּם בָּזֶה
  choice: இவனையும்
  rationale: எதிர்மறை வாக்கியத்தில் גַּם தரும் சேர்க்கைப் பொருளை நவீனத் தமிழில் இயல்பாக ‘-உம்’ உருபு தெரிவிக்கிறது.
- source_word: לֹא בָחַר
  choice: தேர்ந்தெடுக்கவில்லை
  rationale: தேர்வு செய்யவில்லை என்ற நிறைவுற்ற மதிப்பீட்டை இயல்பான தமிழில் நேரடியாகத் தெரிவிக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைத் திருப்பெயரான நான்கெழுத்துப் பெயரை ஒரு பொதுப் பட்டமாக மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரின் மொழியாக்கம்
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூலத்தில் பொதுப் பட்டம் அல்ல, தனிப்பட்ட இறைப் பெயரே இருப்பதால் அதை ஒலிபெயர்த்து வழங்குகிறது.
- issue: וַיֹּאמֶר என்பதன் மறை எழுவாய்
  choice: பெயரைக் குறிப்பிடாமல் ‘அவர்’ என்று வைத்தல்
  alternative: ‘சாமுவேல் கூறினார்’ என்று வெளிப்படையாக்குதல்
  rationale: சூழல் சாமுவேலைப் பேச்சாளராகச் சுட்டினாலும், எபிரெய உரை எழுவாயின் பெயரை வெளிப்படையாகக் கூறவில்லை; ஆகவே உரையின் இலக்கணத் தெளிவின்மையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியும் அதேவேளையில் கண்ணியமான வரலாற்றுக் கதைநடை பயன்படுத்தப்பட்டுள்ளது. காரணவினை அமைப்பும் இறைப் பெயரும் மூலத்துக்கு நெருக்கமாகப் பாதுகாக்கப்பட்டுள்ளன.
