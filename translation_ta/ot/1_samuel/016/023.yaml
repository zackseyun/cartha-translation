base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/016/023.yaml
  text: And whenever the spirit of God came upon Saul[a], David would take the lyre and play it with his hand; then Saul found relief, and it was well with him[c][b], and the harmful spirit departed from him.
translation:
  language: ta
  text: தேவனுடைய ஆவி சவுல்மேல் வரும்போதெல்லாம்[a], தாவீது யாழை[b] எடுத்து, தன் கையால் அதை வாசிப்பான். அப்போது சவுலுக்கு நிம்மதி கிடைக்கும்; அவர் நலம் பெறுவார்; தீங்கு விளைவிக்கும் ஆவி[c] அவரைவிட்டு விலகும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இங்கு எபிரெய மூலத்தில் ‘தேவனுடைய ஆவி’ என்று கூறப்பட்டுள்ளது; வசனத்தின் இறுதியில் மட்டும் ‘தீங்கு விளைவிக்கும் ஆவி’ என்று கூறப்பட்டுள்ளது. மூலத்தில் உள்ள இந்தச் சொல் வேறுபாடு மொழிபெயர்ப்பிலும் காக்கப்பட்டுள்ளது.
    reason: alternative_reading
  - marker: b
    text: எபிரெயச் சொல்லான கின்னோர் ஒரு பழங்கால நரம்பிசைக் கருவியைக் குறிக்கிறது. அது நவீன ஹார்ப்பைவிட லைர் வகைக் கருவியைப் போன்றதாக இருந்திருக்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: ‘தீய ஆவி’ என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் ‘தீய’ அல்லது ‘தீங்கு விளைவிக்கும்’ என்ற இரு பொருள்களையும் தரக்கூடும்; இங்கு சவுலுக்கு அது விளைவித்த துன்பம் முன்னிலைப்படுத்தப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה בִּהְיוֹת
  choice: வரும்போதெல்லாம்
  rationale: היה என்பதுடன் infinitive construct சேர்ந்துள்ள இவ்வமைப்பு மீண்டும் மீண்டும் நிகழும் சூழலைக் குறிக்கிறது; நவீனத் தமிழில் ‘வரும்போதெல்லாம்’ அந்த வழக்கமான நிகழ்வை இயல்பாகத் தெரிவிக்கிறது.
- source_word: רוּחַ אֱלֹהִים
  choice: தேவனுடைய ஆவி
  rationale: எபிரெயச் சொற்றொடர் நேரடியாக ‘தேவனுடைய ஆவி’ என்றே உள்ளது; இவ்விடத்தில் இல்லாத ‘தீய’ அல்லது ‘தீங்கிழைக்கும்’ என்ற அடைமொழியை முந்தைய வசனங்களிலிருந்து சேர்க்கவில்லை.
- source_word: אֶל שָׁאוּל
  choice: சவுல்மேல்
  rationale: இக்கதைச் சூழலில் ஆவி சவுலை வந்து ஆட்கொள்ளும் அல்லது அவர்மீது தாக்கம் செலுத்தும் தொடக்கத்தை ‘சவுல்மேல்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: הַכִּנּוֹר
  choice: யாழ்
  rationale: כִּנּוֹר என்பது பழங்கால நரம்பிசைக் கருவி. தமிழில் எளிதில் புரியும் மரியாதையான இணையாக ‘யாழ்’ பயன்படுத்தப்பட்டுள்ளது; அதன் துல்லிய இயல்பு அடிக்குறிப்பில் விளக்கப்படுகிறது.
- source_word: וְנִגֵּן בְּיָדוֹ
  choice: தன் கையால் அதை இசைப்பான்
  rationale: נגן என்பது நரம்பிசைக் கருவியை வாசிப்பதைக் குறிக்கிறது. ‘அதை’ என்பது முன் குறிப்பிடப்பட்ட கருவியிலிருந்து இயல்பாக நிரப்பப்படுகிறது; ‘தன் கையால்’ எபிரெய வெளிப்பாட்டைப் பாதுகாக்கிறது.
- source_word: וְרָוַח לְשָׁאוּל
  choice: சவுலுக்கு ஆசுவாசம் கிடைத்து
  rationale: רוח என்ற வினை இங்கு நெருக்கடியிலிருந்து விடுதலை அல்லது இளைப்பாறுதலைக் குறிக்கிறது. ‘ஆசுவாசம் கிடைத்து’ என்பது சவுல் அதை அனுபவித்ததை இயல்பாகத் தெரிவிக்கிறது.
- source_word: וְטוֹב לוֹ
  choice: அவர் நலமாக இருப்பார்
  rationale: இச்சொற்றொடர் சவுலின் நிலை மேம்பட்டிருப்பதைக் குறிக்கிறது; உணர்ச்சியை மட்டும் சுட்டும் ‘நன்றாக உணர்வார்’ என்பதைவிட ‘நலமாக இருப்பார்’ மூலத்தின் பரந்த பொருளைக் காக்கிறது.
- source_word: רוּחַ הָרָעָה
  choice: தீங்கிழைக்கும் ஆவி
  rationale: רָעָה என்பது ஒழுக்கரீதியான தீமையையோ தீங்கு மற்றும் துன்பம் விளைவிப்பதையோ குறிக்கலாம். இச்சூழலில் சவுலுக்கு ஏற்பட்ட தீங்கான விளைவை ‘தீங்கிழைக்கும்’ தெளிவாகத் தெரிவிக்கிறது; ஆவியின் ஒழுக்க இயல்பை தேவையின்றி முடிவுசெய்யவில்லை.
- source_word: וְסָרָה מֵעָלָיו
  choice: அவரைவிட்டு விலகும்
  rationale: סור இங்கு அகலுதல் அல்லது நீங்குதலைக் குறிக்கிறது. ‘அவரைவிட்டு விலகும்’ என்பது தெளிவான, இயல்பான தமிழ் நடை.
theological_decisions:
- issue: முதல் பகுதியில் வரும் רוּחַ אֱלֹהִים என்பதையும் இறுதியில் வரும் רוּחַ הָרָעָה என்பதையும் ஒன்றுபடுத்தி மொழிபெயர்க்க வேண்டுமா?
  choice: முதலாவதை ‘தேவனுடைய ஆவி’ என்றும் பின்னையதை ‘தீங்கிழைக்கும் ஆவி’ என்றும் வேறுபடுத்தி மொழிபெயர்த்தல்.
  alternative: முதல் சொற்றொடரையே ‘தேவனிடமிருந்து வந்த தீங்கிழைக்கும் ஆவி’ எனச் சூழலுக்கு ஏற்ப விரிவுபடுத்துதல்; அல்லது பின்னையதை ‘தீய ஆவி’ என மொழிபெயர்த்தல்.
  rationale: எபிரெய மூலத்தில் இரு இடங்களிலும் வெவ்வேறு சொற்றொடர்கள் உள்ளன. அவற்றை அப்படியே வேறுபடுத்துவது மூலத்தின் இறையியல் பதற்றத்தையும் உண்மையான தெளிவின்மையையும் காக்கிறது; அருகிலுள்ள வசனங்களின் விளக்கத்தை இவ்வசனத்துக்குள் இறக்குமதி செய்வதைத் தவிர்க்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகருக்குப் புரியும் மரியாதையான கதைநடை பயன்படுத்தப்பட்டுள்ளது. தொடர்ச்சியாக நிகழ்ந்த வழக்கத்தை எதிர்காலப் பழக்கவழக்க வினைமுற்றுகள் வெளிப்படுத்துகின்றன. ‘தேவனுடைய ஆவி’ மற்றும் ‘தீங்கிழைக்கும் ஆவி’ ஆகியவற்றின் வேறுபாடு விளக்கிச் சமப்படுத்தப்படாமல் பாதுகாக்கப்பட்டுள்ளது.
