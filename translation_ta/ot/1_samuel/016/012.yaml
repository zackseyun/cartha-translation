source:
  edition: WLC
  text: וַ/יִּשְׁלַ֤ח וַ/יְבִיאֵ֨/הוּ֙ וְ/ה֣וּא אַדְמוֹנִ֔י עִם יְפֵ֥ה עֵינַ֖יִם וְ/ט֣וֹב רֹ֑אִי וַ/יֹּ֧אמֶר יְהוָ֛ה ק֥וּם מְשָׁחֵ֖/הוּ כִּֽי זֶ֥ה הֽוּא־פ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/016/012.yaml
  text: So he sent and brought him in. Now he was ruddy[a], with beautiful eyes and a handsome appearance. And Yahweh said, “Rise, anoint him, for this is he.”
translation:
  language: ta
  text: அவர் ஆள் அனுப்பி அவனை அழைத்து வரச் செய்தார். அவன் சிவந்த நிறம் கொண்டவனாகவும், அழகிய கண்களும் நல்ல தோற்றமும் உடையவனாகவும் இருந்தான். அப்போது யாவே, “எழுந்து, அவனை அபிஷேகம் செய்; ஏனெனில் இவன்தான்[a]” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இவனே அந்த ஒருவன்.”
    reason: כִּי זֶה הוּא என்பதன் சுருக்கமான, வலியுறுத்தும் அடையாளப்படுத்தலுக்கான இயல்பான மாற்று வடிவம்.
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: ஆகவே, அவர் ஆள் அனுப்பி
  rationale: வய்யிக்தோல் வடிவம் கதைநிகழ்வை அடுத்த கட்டத்துக்கு நகர்த்துகிறது; சூழலில் ஈசாய் ஒருவரை அனுப்பியதைக் குறிப்பதால், இயல்பான தமிழில் ‘ஆள் அனுப்பி’ என வழங்கப்பட்டது.
- source_word: וַיְבִיאֵהוּ
  choice: அவனை அழைத்துவரச் செய்தார்
  rationale: בוא என்பதன் ஹிஃபில் வடிவம் ‘வரவழைத்தல்/கொண்டுவருதல்’ எனப் பொருள்படும். அனுப்பியவரே நேரடியாகச் சென்றதாகத் தவறாக உணர்த்தாமல் causative பொருள் காக்கப்படுகிறது.
- source_word: אַדְמוֹנִי
  choice: சிவந்த நிறமுடையவன்
  rationale: உடல் நிறம் அல்லது பொது நிறத்தோற்றத்தில் சிவப்புச் சாயலைக் குறிக்கிறது; ‘செம்பட்டை முடியுடையவன்’ என்பது எபிரெய உரையைவிடக் குறிப்பானதாகிவிடும்.
- source_word: עִם יְפֵה עֵינַיִם
  choice: அழகிய கண்களும் … உடையவன்
  rationale: கண்களின் அழகைக் குறிக்கும் எபிரெயச் சொற்றொடரின் நேரடியான, இயல்பான தமிழ் வடிவம்.
- source_word: וְטוֹב רֹאִי
  choice: நல்ல தோற்றமும் உடையவன்
  rationale: பார்ப்பதற்கு இனிய வெளித்தோற்றத்தைச் சுட்டுகிறது; உரையில் இல்லாத குணநலப் பொருளைச் சேர்க்காமல் உடல் தோற்றத்தையே காக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைப்பட்டத்தை மாற்றீடாக இடாமல், எபிரெயத் தனிப்பெயரான நான்கெழுத்துப் பெயரைத் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: קוּם
  choice: எழுந்து
  rationale: சாமுவேலுக்குக் கொடுக்கப்படும் சுருக்கமான கட்டளை; அடுத்த கட்டளையுடன் இயல்பாக இணைகிறது.
- source_word: מְשָׁחֵהוּ
  choice: அவனை அபிஷேகம் செய்
  rationale: அரசத் தேர்வின் சூழலில் משׁח என்பதற்குரிய துல்லியமான, தமிழில் பரவலாகப் புரியக்கூடிய சொல்.
- source_word: כִּי זֶה הוּא
  choice: ஏனெனில் இவனே அவன்
  rationale: எபிரெயின் சுருக்கத்தையும் வலியுறுத்தலையும் காக்கிறது. தமிழில் சற்றே புதிரான தன்மை இருந்தாலும், ‘தேர்ந்தெடுக்கப்பட்டவன்’ என்று விளக்கிச் சேர்க்காமல் மூலத்தின் அடையாளப்படுத்தும் சொல்லமைப்பைப் பாதுகாக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழியாக்கம்
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலத்தில் பட்டமல்ல, இறைவனின் தனிப்பெயர் நேரடியாக உள்ளது; ஆகவே அதைத் தமிழில் ஒலிபெயர்த்து வழங்குவது மூலவடிவைத் தெளிவாகப் பாதுகாக்கிறது.
- issue: தாவீதின் வெளித்தோற்ற விவரிப்பு
  choice: உடல் சார்ந்த விளக்கமாகவே வைத்தல்
  alternative: முடியின் நிறமாகக் குறிப்பாக்குதல் அல்லது ஒழுக்கக் குணங்களைக் குறிக்கும் வகையில் விரித்தல்
  rationale: אַדְמוֹנִי முடி நிறத்தை கட்டாயப்படுத்தவில்லை; இவ்விவரிப்பை அடையாள அல்லது ஒழுக்கப் பொருளாக மாற்றுவதற்கும் உரையில் ஆதாரம் இல்லை.
- issue: כִּי זֶה הוּא என்பதின் அடையாளப்படுத்தல்
  choice: இவனே அவன்
  alternative: இவனே அந்த ஒருவன் / இவனே தேர்ந்தெடுக்கப்பட்டவன்
  rationale: எபிரெயில் தேர்வு வலியுறுத்தப்பட்டாலும் ‘தேர்ந்தெடுக்கப்பட்டவன்’ என்ற பெயர்ச்சொல் வெளிப்படையாக இல்லை. சுருக்கமான மற்றும் ஓரளவு திறந்த அடையாளப்படுத்தலைக் காக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், மரியாதையும் கதைநடைத் தெளிவும் காக்கப்பட்டுள்ளன. ‘அபிஷேகம் செய்’ என்பது சாதாரண வாசகர்களுக்கும் பரிச்சயமான வேதாகமச் சொல்; ‘சிவந்த நிறமுடையவன்’ என்பது தேவையற்ற குறிப்பாக்கத்தைத் தவிர்க்கிறது. அடிக்குறிப்பு குறியீடு பிரதான உரையில் [a] என இடப்பட்டுள்ளது.
