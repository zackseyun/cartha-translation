  to: அவர் ஆள் அனுப்பி அவனை அழைத்து வரச் செய்தார். அவன் சிவந்த நிறம் கொண்டவனாகவும், அழகிய கண்களும் நல்ல தோற்றமும் உடையவனாகவும் இருந்தான். அப்போது யாவே, “எழுந்து, அவனை அபிஷேகம் செய்; ஏனெனில் இவன்தான்[a]” என்றார்.
  rationale: திருத்தம் இறுதிச் சொற்றொடரை நவீனத் தரத் தமிழில் இயல்பாக்குகிறது. “இவன்தான்” எபிரெயின் ‘இவனே/இவன்தான் அவன்’ என்ற வலியுறுத்தலைக் காக்கிறது; ஆனால் மூலத்தில் வெளிப்படையாக இல்லாத ‘தேர்ந்தெடுக்கப்பட்டவன்’ போன்ற விளக்கத்தைச் சேர்ப்பதில்லை. நிறவிளக்கமும் மென்மையாகச் சீரமைக்கப்பட்டுள்ளது. அடிக்குறிப்புக் குறியீடு அதற்குரிய அடையாளப்படுத்தல் சொற்றொடரிலேயே வைக்கப்பட்டுள்ளது.
