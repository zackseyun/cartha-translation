base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/016/013.yaml
  text: Then Samuel took the horn of oil and anointed him in the midst of his brothers[a]. And the Spirit of Yahweh rushed upon David from that day onward[b]. Then Samuel rose and went to Ramah.
translation:
  language: ta
  text: பின்னர் சாமுவேல் எண்ணெய்க் கொம்பை எடுத்து, தாவீதின் சகோதரர்களின் நடுவில் அவனுக்கு அபிஷேகம் செய்தார். அந்நாள்முதல் யாவேயின் ஆவி தாவீதின்மேல் வல்லமையுடன் பாய்ந்துவந்தது[a][b]. பிறகு சாமுவேல் எழுந்து ராமாவுக்குச் சென்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தாவீதின்மேல் வல்லமையாக வந்தது.” எபிரெய வினை, ஆவி வலிமையாக வந்து ஆற்றலூட்டுவதைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில் பெரிய எழுத்து–சிறிய எழுத்து வேறுபாடு இல்லாததால், ‘ஆவி’ தனிப்பட்டவரைக் குறிக்கிறதா என்பதை எழுத்துமுறை மட்டும் தீர்மானிப்பதில்லை.
    reason: alternative_reading
lexical_decisions:
- source_word: קֶרֶן הַשֶּׁמֶן
  choice: எண்ணெய்க் கொம்பு
  rationale: קֶרֶן என்பது நேரடியாக ‘கொம்பு’; இங்கு எண்ணெயை வைத்திருந்த விலங்குக் கொம்பைக் குறிக்கிறது. மூலத்தின் தெளிவான காட்சியுருவை இச்சொல் காக்கிறது.
- source_word: וַיִּמְשַׁח
  choice: அபிஷேகம் செய்தார்
  rationale: משׁח என்பது சடங்குமுறையில் எண்ணெய் பூசி நியமிப்பதற்கான வழக்கமான வினை. ‘அபிஷேகம் செய்தார்’ என்பது அதன் உடல்சார்ந்த செயலையும் அரசருக்குரிய முக்கியத்துவத்தையும் தக்கவைக்கிறது.
- source_word: בְּקֶרֶב אֶחָיו
  choice: தாவீதின் சகோதரர்களின் நடுவில்
  rationale: בקרב என்பதன் நேரடிப் பொருள் ‘நடுவில்’. எபிரெய உரையிலுள்ள ஆண்பால் உடன்பிறந்தோரைக் ‘சகோதரர்கள்’ துல்லியமாகக் குறிக்கிறது; தமிழில் பிரதிப்பெயரின் தொடர்பு குழம்பாதபடி ‘தாவீதின்’ என வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: וַתִּצְלַח רוּחַ יְהוָה אֶל דָּוִד
  choice: யாவேயின் ஆவி தாவீதின்மேல் வல்லமையோடு வந்தது
  rationale: צלח என்ற வினை இந்தச் சூழலில் ஆவியின் ஆற்றல்மிக்க, வலுவான வருகையைக் குறிக்கிறது. தமிழில் இயல்பாகவும் மூலத்தின் வலிமையைத் தக்கவைத்தும் ‘வல்லமையோடு வந்தது’ என வழங்கப்பட்டுள்ளது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரான நான்கெழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் பரவலாகப் புரியக்கூடிய ஒலிபெயர்ப்பாக ‘யாவே’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: מֵהַיּוֹם הַהוּא וָמָעְלָה
  choice: அன்று முதல் தொடர்ந்து
  rationale: இச்சொற்றொடர் அந்த நாளில் தொடங்கி நீடித்த நிலையைச் சுட்டுகிறது. ‘அன்று முதல் தொடர்ந்து’ என்பது அதன் தொடக்கத்தையும் தொடர்ச்சியையும் இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: וַיָּקָם
  choice: எழுந்து
  rationale: קום என்பது கதைநடையில் எழுதல் அல்லது புறப்படத் தயாராதலைக் குறிக்கிறது. ‘எழுந்து’ சுருக்கமாகவும் நேரடியாகவும் உள்ளது.
- source_word: הָרָמָתָה
  choice: ராமாவுக்கு
  rationale: இடப்பெயருடன் இணைந்த திசைச்சுட்டு, ராமாவை நோக்கிய இயக்கத்தைக் குறிக்கிறது; தமிழில் ‘ராமாவுக்குச் சென்றார்’ என இயல்பாக வழங்கப்பட்டுள்ளது.
theological_decisions:
- issue: רוּחַ יְהוָה என்பதன் பொருள்
  choice: யாவேயின் ஆவி
  alternative: யாவேயிடமிருந்து வந்த ஆவி
  rationale: கதைச் சூழலில் இது தாவீதை ஆற்றலூட்டும் கடவுளுடைய ஆவியைக் குறிக்கிறது. இருப்பினும் எபிரெய எழுத்துமுறை ‘ஆவி’ என்பதைப் பெரிய எழுத்தால் தனியே அடையாளப்படுத்துவதில்லை; ஆகவே மொழியியல் சாத்தியம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: தாவீதின் அபிஷேகத்தின் குடும்பத்தார் முன்னிலையிலான தன்மை
  choice: தாவீதின் சகோதரர்களின் நடுவில்
  alternative: அவனுடைய குடும்பத்தாரிடையே தனிப்பட்ட முறையில்
  rationale: தாவீதின் சகோதரர்களின் நடுவில் அபிஷேகம் நடந்ததாக மட்டுமே உரை நேரடியாகக் கூறுகிறது. அதன் அரசியல் வெளிப்படைத்தன்மையின் அளவை மொழிபெயர்ப்பு ஊகிக்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், மரியாதையும் எளிய புரிதலும் இணையும் நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘அபிஷேகம்’ என்பது தமிழ்க் கிறிஸ்தவப் பயன்பாட்டில் பரிச்சயமானதும் இச்சடங்கின் பொருளைச் சுருக்கமாகத் தருவதுமான சொல். ‘எண்ணெய்க் கொம்பு’ மூலத்தின் பொருட்சார் காட்சியைப் பாதுகாக்கிறது. எபிரெயச் சொற்தொடரின் வலிமையை இயல்பான தமிழில் தர ‘வல்லமையோடு வந்தது’ தேர்ந்தெடுக்கப்பட்டுள்ளது.
