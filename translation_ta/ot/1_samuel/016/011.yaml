base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/016/011.yaml
  text: Then Samuel said to Jesse[a], “Are these all the young men?” And he said, “The youngest still remains, and behold, he is shepherding the flock.” Then Samuel said to Jesse, “Send and bring him[b], for we will not sit down until he comes here.”
translation:
  language: ta
  text: அப்போது சாமுவேல் ஈசாயிடம், “இளைஞர்கள் எல்லாரும் இவர்கள்தானா?” என்று கேட்டார். அதற்கு அவர், “இளையவன் இன்னும் இருக்கிறான்; இதோ, அவன் மந்தையை மேய்த்துக்கொண்டிருக்கிறான்[a]” என்றார். அப்போது சாமுவேல் ஈசாயிடம், “ஆள் அனுப்பி அவனை அழைத்துவாரும்; அவன் இங்கே வரும்வரை நாம் அமரமாட்டோம்[b]” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவன் ஆடுகளைப் பராமரித்துக்கொண்டிருக்கிறான்.” எபிரெயில் சொல்லுக்கு சொல், “மந்தையை மேய்த்துக்கொண்டிருக்கிறான்.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “நாம் நம் இடங்களில் அமரமாட்டோம்.” அவன் வரும்வரை அவர்கள் உணவையோ முறையான கூடுகையையோ தொடங்கமாட்டார்கள் என்பது இதன் பொருளாக இருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲתַמּוּ הַנְּעָרִים
  choice: இளைஞர்கள் எல்லாரும் இவர்கள்தானா?
  rationale: תמם என்பதன் ‘முழுமையாதல்’ என்ற கருத்தை, ஈசாய் முன்நிறுத்திய மகன்கள் இவர்களோடு முடிந்துவிட்டார்களா எனக் கேட்கும் இயல்பான தமிழில் வெளிப்படுத்துகிறது; נְעָרִים என்பதற்கு சூழலுக்கேற்ற ‘இளைஞர்கள்’ பயன்படுத்தப்பட்டது.
- source_word: עוֹד שָׁאַר הַקָּטָן
  choice: இளையவன் இன்னும் இருக்கிறான்
  rationale: குடும்பச் சூழலில் הַקָּטָן என்பது உருவளவில் சிறியவனை அல்ல, வயதில் இளைய மகனைக் குறிக்கிறது; עוֹד שָׁאַר அவன் இன்னும் முன்நிறுத்தப்படாமல் இருப்பதைச் சொல்கிறது.
- source_word: וְהִנֵּה
  choice: இதோ
  rationale: அடுத்து சொல்லப்படும் தகவலின் மீது கவனத்தை ஈர்க்கும் எபிரெயச் சொல்லின் சுட்டும் வலிமையை இயல்பாகப் பாதுகாக்கிறது.
- source_word: רֹעֶה בַּצֹּאן
  choice: மந்தையை மேய்த்துக்கொண்டிருக்கிறான்
  rationale: தொடர்ந்து நடந்துகொண்டிருக்கும் செயலைப் பங்கேற்புவினை வடிவம் காட்டுகிறது; ‘மந்தை’ என்பது צֹאן என்ற கூட்டுப்பெயரைப் பிரதிபலிக்கிறது.
- source_word: שִׁלְחָה וְקָחֶנּוּ
  choice: ஆள் அனுப்பி அவனை அழைத்துவாரும்
  rationale: ஒருவரை அனுப்பி இளைய மகனை இங்கே கொண்டுவரும்படி கூறும் இரு செயல்களையும் இயல்பான தமிழில் தருகிறது.
- source_word: לֹא נָסֹב
  choice: நாம் அமரமாட்டோம்
  rationale: סבב என்பதன் அடிப்படைப் பொருள் ‘திரும்புதல்/சுற்றுதல்’ என்றாலும், இச்சூழலில் விருந்து அல்லது முறையான கூடுகைக்காகத் தங்கள் இடங்களில் அமர்வதைக் குறிக்கும் சொற்றொடராகப் புரிந்துகொள்ளப்படுகிறது.
- source_word: עַד בֹּאוֹ פֹה
  choice: அவன் இங்கே வரும்வரை
  rationale: கால எல்லையைக் குறிக்கும் எபிரெயச் சொற்றொடரை நேராகவும் இயல்பாகவும் மொழிபெயர்க்கிறது.
