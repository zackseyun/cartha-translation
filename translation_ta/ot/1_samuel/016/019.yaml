lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: அனுப்பி
  rationale: தொடர்ச்சியான எபிரெய கதைநடையை இயல்பான தமிழில் இணைவினையெச்சமாகக் காட்டுகிறது; செயல் இறந்தகாலக் கதைநிகழ்வாகவே உள்ளது.
- source_word: מַלְאָכִים
  choice: தூதர்களை
  rationale: இங்கு மனிதர்களாக அனுப்பப்பட்ட செய்தியாளர்களைக் குறிக்கிறது; ‘தூதர்கள்’ என்பது தெளிவான, இயல்பான தமிழ்ச் சொல்.
- source_word: אֶל יִשָׁי
  choice: ஈசாயிடம்
  rationale: திசை அல்லது அணுகலைக் குறிக்கும் אֶל என்பதையும் பெறுநரான ஈசாயையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: וַיֹּאמֶר
  choice: என்றான்
  rationale: சவுலின் நேரடிப் பேச்சை அறிமுகப்படுத்தும் אמר என்பதற்கு தமிழ் மேற்கோளின் முடிவில் ‘என்றான்’ இயல்பாக அமைகிறது.
- source_word: שִׁלְחָה אֵלַי
  choice: என்னிடம் அனுப்பு
  rationale: கட்டளை வடிவத்தையும் சவுலை நோக்கிய அனுப்புதலையும் நேரடியாகப் பாதுகாக்கிறது.
- source_word: אֶת דָּוִד בִּנְךָ
  choice: உன் மகன் தாவீதை
  rationale: தாவீது ஈசாயின் மகன் என்ற உறவையும் நேரடி செயப்படுபொருளையும் இயல்பான தமிழ் சொல்வரிசையில் தருகிறது.
- source_word: אֲשֶׁר בַּצֹּאן
  choice: மந்தையுடன் இருக்கும்
  rationale: בַּצֹּאן என்பதன் ‘மந்தையோடு/மந்தைக்குள்’ என்ற இடவியல் நுணுக்கத்தை மிகையாக விளக்காமல், மேய்ப்பு சூழலுக்கு ஏற்ற இயல்பான தமிழில் தருகிறது.
