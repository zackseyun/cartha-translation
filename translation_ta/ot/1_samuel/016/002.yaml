base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/016/002.yaml
  text: Samuel said[a], “How can I go? If Saul hears, he will kill me.” And Yahweh said, “Take a heifer with you and say, ‘I have come to sacrifice to Yahweh.’”
translation:
  language: ta
  text: சாமுவேல், “நான் எப்படிப் போவேன்? சவுல் கேள்விப்பட்டால் என்னைக் கொன்றுவிடுவான்” என்றார். யாவே, “ஒரு இளம் பசுவை[a] உன்னுடன் எடுத்துக்கொண்டு போய், ‘யாவேக்குப் பலியிட வந்திருக்கிறேன்’ என்று சொல்” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஒரு கிடாரியை”; அதாவது, இன்னும் கன்று ஈனாத இளம் பெண் மாடு.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵיךְ אֵלֵךְ
  choice: நான் எப்படிப் போவேன்?
  rationale: கேள்வி பயண முறையை மட்டும் அல்லாமல், நிலவும் ஆபத்தில் போவது எப்படிச் சாத்தியம் என்ற சாமுவேலின் கவலையையும் வெளிப்படுத்துகிறது.
- source_word: וְשָׁמַע שָׁאוּל
  choice: சவுல் இதைக் கேள்விப்பட்டால்
  rationale: எபிரெயில் இணைப்புச் சொல் இருந்தாலும், சூழலில் இது நிபந்தனைப் பொருளைத் தருகிறது. ‘இதைக்’ என்பது சாமுவேல் செல்லும் செய்தியை இயல்பாகக் குறிக்கிறது.
- source_word: וַהֲרָגַנִי
  choice: என்னைக் கொன்றுவிடுவானே
  rationale: சவுல் கேள்விப்பட்டால் நிகழும் எனச் சாமுவேல் அஞ்சும் நேரடி விளைவை இயல்பான தமிழில் தெரிவிக்கிறது; ‘-வானே’ அவரது அச்சத்தையும் எதிர்ப்பையும் காட்டுகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரான நான்கு எபிரெய் எழுத்துகளைக் பட்டப்பெயராக மாற்றாமல், தமிழில் பரவலாகப் புரிந்துகொள்ளக்கூடிய ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: עֶגְלַת בָּקָר
  choice: ஓர் இளம் பசு
  rationale: பலிக்குத் தகுந்த இளம் பெண் மாட்டைக் குறிக்கிறது. ‘இளம் பசு’ என்பது துல்லியத்தையும் பொதுவாசகர்களுக்கான தெளிவையும் சமநிலைப்படுத்துகிறது.
- source_word: תִּקַּח בְּיָדֶךָ
  choice: உன்னுடன் கொண்டுபோய்
  rationale: சொல்லுக்கு சொல் ‘உன் கையில் எடுத்துக்கொள்’ என்றாலும், இங்கு ஒருவருடன் எடுத்துச் செல்வதே எபிரெய் மரபுத்தொடரின் இயல்பான பொருள்.
- source_word: לִזְבֹּחַ לַיהוָה
  choice: யாவேக்குப் பலி செலுத்த
  rationale: யாவேக்கு ஒரு பலியை அறுத்துச் செலுத்தும் வழிபாட்டுச் செயலை, தேவையற்ற சடங்கு விவரங்களைச் சேர்க்காமல் தெளிவாகக் கூறுகிறது.
- source_word: בָּאתִי
  choice: வந்திருக்கிறேன்
  rationale: வருகையின் தற்போதைய விளைவையும் அறிவிக்கப்படும் நோக்கத்தையும் எபிரெய் நிறைவுவினைக்கு ஏற்ற இயல்பான தமிழில் தெரிவிக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலவசனம் இறைவனின் தனிப்பெயரை நேரடியாகப் பயன்படுத்துகிறது. எனவே அதை ஒரு பட்டப்பெயரால் மாற்றாமல் ஒலிபெயர்ப்பது மூலத்தின் வேறுபாட்டைப் பாதுகாக்கிறது.
- issue: சாமுவேலுக்குக் கொடுக்கப்பட்ட கூற்றின் தன்மை
  choice: ‘யாவேக்குப் பலி செலுத்த வந்திருக்கிறேன்’ என்ற மூலவாக்கியத்தை மட்டும் மொழிபெயர்த்தல்
  alternative: இதை முழு நோக்கத்தையும் வெளிப்படுத்தும் கூற்றாகவோ பொய்யாகவோ விளக்கிச் சேர்த்தல்
  rationale: வசனம் பலியிடுதல் குறித்த கூற்றைத் தருகிறது; அதன் ஒழுக்கவியல் அல்லது அது முழுமையான விளக்கமா என்ற கேள்வியை உரைக்குள் தீர்மானித்து விடவில்லை. அந்த இறையியல் பதற்றம் விளக்கமின்றி பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், உரையாடலுக்கேற்ற இயல்பும் வேதாகம உரைக்குரிய கண்ணியமும் பேணப்பட்டுள்ளன. ‘கிடாரி’ துல்லியமான சொல் என்றாலும் எல்லா வாசகர்களுக்கும் உடனடியாகப் புரியாமல் இருக்கலாம் என்பதால், முதன்மை உரையில் ‘இளம் பசு’ பயன்படுத்தப்பட்டு மாற்றுச் சொல் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
