  text: וַ/יַּעַן֩ אֶחָ֨ד מֵ/הַ/נְּעָרִ֜ים וַ/יֹּ֗אמֶר הִנֵּ֨ה רָאִ֜יתִי בֵּ֣ן לְ/יִשַׁי֮ בֵּ֣ית הַלַּחְמִי֒ יֹדֵ֣עַ נַ֠גֵּן וְ/גִבּ֨וֹר חַ֜יִל וְ/אִ֧ישׁ מִלְחָמָ֛ה וּ/נְב֥וֹן דָּבָ֖ר וְ/אִ֣ישׁ תֹּ֑אַר וַ/יהוָ֖ה עִמּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/016/018.yaml
  text: Then one of the young men answered and said[a], “Look, I have seen a son of Jesse the Bethlehemite who is skillful in playing, a mighty man of valor, a man of war, prudent in speech, and a handsome man[d][c][b], and Yahweh is with him.”
translation:
  language: ta
  text: 'அப்போது இளைஞர்களில் ஒருவன் பதிலளித்துச் சொன்னான்: “இதோ, பெத்லெகேமைச் சேர்ந்த ஈசாயின் ஒரு மகனை நான் பார்த்திருக்கிறேன். அவன் இசைக்கருவி வாசிப்பதில் திறமைசாலி; வலிமையும் துணிவும் கொண்டவன்,[a] போர்வீரன், பேச்சில் விவேகமுள்ளவன், அழகிய தோற்றமுள்ளவன். யாவே அவனோடு இருக்கிறார்.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “வலிமையும் துணிவும் கொண்டவன்” என்பதற்கான எபிரெயச் சொற்றொடர் “வீரமிக்க போர்வீரன்” அல்லது விரிவாக “திறமைமிக்கவன்” என்றும் பொருள்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמֶר
  choice: என்று சொன்னான்
  rationale: ענה + אמר என்பது எபிரெய உரையாடல் அறிமுக மரபுச்சொற்றொடர். தமிழில் இங்கு முன் கேள்விக்கான நேரடி பதில் இல்லாததால் ‘பதிலளித்துச் சொன்னான்’ என்பதைக் காட்டிலும் இயல்பான ‘என்று சொன்னான்’ பயன்படுத்தப்பட்டது.
- source_word: אֶחָד מֵהַנְּעָרִים
  choice: இளைஞர்களில் ஒருவன்
  rationale: נְעָרִים என்பதற்கு இளைஞர்கள், பணியாளர்கள், ஏவலர்கள் ஆகிய பொருள்கள் இருக்கலாம். அரசவைக் சூழல் பணியாளர்களைக் குறிக்கக்கூடும் என்றாலும், சமூகப் பங்கை உறுதியாக்காமல் அடிப்படைப் பொருள் பாதுகாக்கப்பட்டது.
- source_word: הִנֵּה
  choice: இதோ
  rationale: கவனத்தை ஈர்க்கும் உரையாடல் இடைச்சொல்லின் ஆற்றலை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: רָאִיתִי
  choice: நான் பார்த்திருக்கிறேன்
  rationale: முன்னர் கண்டதன் அடிப்படையில் இப்போது பரிந்துரைக்கும் நிறைவேற்ற வினையின் நிகழ்காலத் தொடர்பு பாதுகாக்கப்படுகிறது.
- source_word: בֵּן לְיִשַׁי בֵּית הַלַּחְמִי
  choice: பெத்லெகேமைச் சேர்ந்த ஈசாயின் மகன் ஒருவன்
  rationale: ‘பெத்லெகேமியன்’ போன்ற இயல்பற்ற இனவழிப் பெயருக்குப் பதிலாக, בֵּית הַלַּחְמִי குறிக்கும் ஊர்ச் சார்பை தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: יֹדֵעַ נַגֵּן
  choice: இசைக்கருவி வாசிப்பதில் திறமைசாலி
  rationale: נגּן இசைக்கருவி வாசிப்பதைக் குறிக்கிறது; இவ்வசனத்தில் குறிப்பிட்ட கருவி பெயரிடப்படாததால் அதைச் சேர்க்காமல் திறமை என்ற கருத்து வெளிப்படுத்தப்பட்டது.
- source_word: גִּבּוֹר חַיִל
  choice: வலிமையும் துணிவும் கொண்டவன்
  rationale: இந்த நிலையான சொற்றொடர் வலிமை, வீரம், திறமை அல்லது போர்த்துணிவைக் குறிக்கலாம். அடுத்ததாக ‘போர்வீரன்’ வருவதால் தேவையற்ற மறுபடிவைத் தவிர்த்து அதன் பாராட்டுப் பொருளையும் பரந்த தன்மையையும் பாதுகாக்கிறது.
- source_word: אִישׁ מִלְחָמָה
  choice: போர்வீரன்
  rationale: சொற்றொடரின் போர்சார் பொருளைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: נְבוֹן דָּבָר
  choice: பேச்சில் விவேகமுள்ளவன்
  rationale: נבון என்பதன் பகுத்தறிவையும் דבר என்பதன் பேச்சு அல்லது சொல் சார்ந்த அம்சத்தையும் இணைத்துப் பாதுகாக்கிறது; ‘சொற்பொழிவாளர்’ என வெறும் பேச்சுத்திறனாகக் குறுக்கவில்லை.
- source_word: אִישׁ תֹּאַר
  choice: அழகிய தோற்றமுள்ளவன்
  rationale: תֹּאַר குறிக்கும் உருவம் அல்லது தோற்றத்தை இயல்பாகத் தருகிறது; உடல் வடிவத்தை அளவுக்கு மீறிக் குறிப்பாக்கவில்லை.
- source_word: וַיהוָה עִמּוֹ
  choice: யாவே அவனோடு இருக்கிறார்
  rationale: திருப்பெயரான יהוה ஒலிபெயர்க்கப்பட்டு, தெய்வீக உடனிருப்பைக் குறிக்கும் வினையற்ற உட்பிரிவு தமிழில் நிகழ்காலமாக வழங்கப்பட்டது.
theological_decisions:
- issue: יהוה என்ற திருப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர் / ஆண்டவர் / யெகோவா
  rationale: மூலத்தில் திருப்பெயர் நேரடியாக உள்ளது. பட்டப்பெயரால் மாற்றாமல் வழக்கமான தமிழ் ஒலிபெயர்ப்பான ‘யாவே’ பயன்படுத்தப்பட்டது.
- issue: וַיהוָה עִמּוֹ என்பதன் பொருள்
  choice: யாவே அவனோடு இருக்கிறார்
  alternative: யாவே அவனுக்கு வெற்றியளிக்கிறார்
  rationale: உடனிருப்பு தெய்வீக ஆதரவு அல்லது அருளைக் குறிப்பதாக இருக்கலாம்; ஆனால் மூலத்தில் இல்லாத விளைவான ‘வெற்றி’யை வெளிப்படையாகச் சேர்க்காமல் இறையியல் செறிவும் திறந்த தன்மையும் பாதுகாக்கப்பட்டன.
translation_notes:
  register: நவீன தரத் தமிழில், அரசவைக் கதையாடலுக்கேற்ற கண்ணியமான ஆனால் பொதுவாசகர்களுக்கு எளிதான நடை பயன்படுத்தப்பட்டது. பணியாளரின் சமூகப் பங்கு, இசைக்கருவியின் வகை, גִּבּוֹר חַיִל என்பதன் துல்லிய வரம்பு ஆகியவை மூலத்தைவிடக் குறிப்பாக்கப்படவில்லை. பட்டியல் தமிழில் தெளிவாக வாசிக்க அரைப்புள்ளி மற்றும் இணைநிலைப் பெயரெச்ச வடிவங்கள் பயன்படுத்தப்பட்டன.
