  text: וְ/ר֧וּחַ יְהוָ֛ה סָ֖רָה מֵ/עִ֣ם שָׁא֑וּל וּ/בִֽעֲתַ֥תּ/וּ רֽוּחַ רָעָ֖ה מֵ/אֵ֥ת יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/016/014.yaml
  text: The Spirit of Yahweh had departed from Saul[a], and an evil spirit from Yahweh terrified him.
translation:
  language: ta
  text: யெகோவாவின் ஆவி சவுலைவிட்டு விலகியது; யெகோவாவிடமிருந்து வந்த ஒரு தீய ஆவி[a] அவனைத் திகிலடையச் செய்தது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது ‘தீங்கு விளைவிக்கும் ஆவி’ அல்லது ‘துன்புறுத்தும் ஆவி.’ இங்குள்ள எபிரெயப் பெயரடை ஒழுக்கத் தீமையையோ, விளைவில் தீங்கு அல்லது துயரம் ஏற்படுத்துவதையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרוּחַ יְהוָה
  choice: யெகோவாவின் ஆவி
  rationale: רוּחַ என்பது ஆவி, காற்று, மூச்சு ஆகிய பொருள்களைக் கொள்ளலாம். சவுலுக்கு முன்பு அளிக்கப்பட்ட தெய்வீக வல்லமையூட்டும் பிரசன்னத்தைக் குறிக்கும் இக்கதையமைப்பில் ‘ஆவி’ இயல்பானது. יהוה என்ற தனிப்பெயர் ‘யெகோவா’ என ஒலிபெயர்க்கப்படுகிறது.
- source_word: סָרָה מֵעִם
  choice: விலகியது
  rationale: סוּר என்பது விலகுதல் அல்லது அகலுதல்; מֵעִם உடன் சேர்ந்து, சவுலோடு இருந்த ஆவி அவனைவிட்டு அகன்றதை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: שָׁאוּל
  choice: சவுல்
  rationale: எபிரெயத் தனிப்பெயருக்கான வழக்கமான தமிழ் ஒலிபெயர்ப்பு.
- source_word: וּבִעֲתַתּוּ
  choice: அவனைத் திகிலடையச் செய்தது
  rationale: בעת திடீர் அச்சம் அல்லது திகிலை ஏற்படுத்துவதைக் குறிக்கிறது. ‘துன்புறுத்தியது’ என்பது சூழலில் சாத்தியமானாலும், வினையின் அச்சமூட்டும் அடிப்படை உணர்வை இத்தேர்வு தெளிவாகக் காக்கிறது.
- source_word: רוּחַ רָעָה
  choice: ஒரு தீய ஆவி
  rationale: רָעָה என்பது ஒழுக்கத் தீமை மட்டுமல்லாமல் தீங்கு அல்லது துயர்விளைவிக்கும் தன்மையையும் குறிக்கலாம். நேரடியான ‘தீய ஆவி’ முதன்மை உரையில் வைக்கப்பட்டு, பிற நுணுக்கங்கள் அடிக்குறிப்பில் தரப்படுகின்றன.
- source_word: מֵאֵת יְהוָה
  choice: யெகோவாவிடமிருந்து வந்த
  rationale: מֵאֵת மூலத்தையோ தோற்றுவாயையோ குறிக்கும். ‘யெகோவாவிடமிருந்து வந்த’ என்பது அதைத் தெளிவான தமிழில் கூறுகிறது; ‘யெகோவா அனுப்பிய’ என்பது மூலத்தில் வெளிப்படையாக இல்லாத விளக்கத்தைச் சேர்க்கும் என்பதால் தவிர்க்கப்படுகிறது.
theological_decisions:
- issue: தொந்தரவு செய்த ஆவி யெகோவாவிடமிருந்து வந்தது என்ற கூற்றை மென்மைப்படுத்தாமலும் மிகையாக விளக்காமலும் மொழிபெயர்த்தல்
  choice: யெகோவாவிடமிருந்து வந்த ஒரு தீய ஆவி
  alternative: யெகோவாவிடமிருந்து வந்த தீங்கு விளைவிக்கும் அல்லது துன்புறுத்தும் ஆவி; யெகோவா அனுப்பிய ஒரு தீய ஆவி
  rationale: அந்த ஆவியின் மூலம் யெகோவா என்று எபிரெய உரை வெளிப்படையாகக் கூறுகிறது. எனவே அதன் இறையியல் பதற்றம் தீர்த்துவைக்கப்படாமல் பாதுகாக்கப்படுகிறது. அதேவேளை רָעָה என்பதன் தீங்கு அல்லது துயரம் சார்ந்த பொருள் அடிக்குறிப்பில் காட்டப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையும் கண்ணியமும் காக்கப்பட்டுள்ளன. மூலத்தில் வெளிப்படையான காலக் குறிச்சொல் இல்லாததால் தொடக்கத்தில் ‘அப்போது’ அல்லது ‘இப்போது’ சேர்க்கப்படவில்லை. இரு தொடர்புடைய நிகழ்வுகளையும் இயல்பாக இணைக்க அரைப்புள்ளி பயன்படுத்தப்பட்டுள்ளது.
