translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. அரசவைக் சேவை என்ற சூழற்பொருள் முதன்மை உரையில் தெளிவாக்கப்பட்டாலும், ‘நிற்க/இருக்க’ என்ற எபிரெயச் சொல்லின் நேரடி சாத்தியம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
