  text: וַ/יִּשְׁלַ֣ח שָׁא֔וּל אֶל יִשַׁ֖י לֵ/אמֹ֑ר יַעֲמָד נָ֤א דָוִד֙ לְ/פָנַ֔/י כִּֽי מָ֥צָא חֵ֖ן בְּ/עֵינָֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/016/022.yaml
  text: Then Saul sent to Jesse[a], saying, “Please let David stand before me, for he has found favor in my eyes.”
translation:
  language: ta
  text: பின்பு சவுல் ஈசாயிடம் தூது அனுப்பி, “தயவுசெய்து, தாவீது என் முன்னிலையில் நிற்கட்டும்[a]; ஏனெனில் அவன் என் பார்வையில் தயவைப் பெற்றிருக்கிறான்” என்று சொல்லச் செய்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தாவீது என் முன்னிலையில் தொடர்ந்து இருக்கட்டும்.” இது சவுலின் சேவையில் அவன் தொடர்ந்து இருப்பதைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח שָׁאוּל אֶל יִשַׁי לֵאמֹר
  choice: பின்பு சவுல் ஈசாயிடம் ஆள் அனுப்பி ... என்று சொல்லச் செய்தான்
  rationale: வַיִּשְׁלַח என்ற தொடர்நிகழ்வு வடிவம் கதையின் அடுத்த நிகழ்வைக் குறிக்கிறது. செய்தி அனுப்பப்படுவதை இயல்பான நவீன தமிழில் தெளிவுபடுத்த ‘ஆள் அனுப்பி ... சொல்லச் செய்தான்’ என வழங்கப்பட்டுள்ளது.
- source_word: יַעֲמָד נָא דָוִד לְפָנַי
  choice: தாவீது என் முன்னிலையில் பணிபுரிய அனுமதியும்
  rationale: עמד என்பதன் அடிப்படைப் பொருள் ‘நிற்க’ என்பதாக இருந்தாலும், அரசவைக் சூழலில் לְפָנַי உடன் அது அரசனின் முன்னிலையில் தொடர்ந்து சேவை செய்வதைக் குறிக்கிறது. נָא குறிக்கும் பணிவான வேண்டுகோளை மரியாதையான ‘அனுமதியும்’ வெளிப்படுத்துகிறது.
- source_word: כִּי מָצָא חֵן בְּעֵינָי
  choice: ஏனெனில் அவன் என் பார்வையில் தயவு பெற்றிருக்கிறான்
  rationale: מָצָא חֵן என்ற எபிரெய மரபுத்தொடர் ஒருவரின் அங்கீகாரம் அல்லது ஆதரவைப் பெறுவதைக் குறிக்கிறது. ‘தயவு பெற்றிருக்கிறான்’ அதைப் பாதுகாக்கிறது; בְּעֵינָי என்பதன் பார்வை உருவகமும் தக்கவைக்கப்படுகிறது.
- source_word: דָוִד / שָׁאוּל / יִשַׁי
  choice: தாவீது / சவுல் / ஈசாய்
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் பரவலாக அறியப்பட்ட பெயர் வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன.
