revisions:
- from: பின்பு சவுல் ஈசாயிடம் ஆள் அனுப்பி, “தாவீது என் முன்னிலையில் பணிபுரிய அனுமதியும்[a]; ஏனெனில் அவன் என் பார்வையில் தயவு பெற்றிருக்கிறான்” என்று சொல்லச் செய்தான்.
  to: பின்பு சவுல் ஈசாயிடம் தூது அனுப்பி, “தயவுசெய்து, தாவீது என் முன்னிலையில் நிற்கட்டும்[a]; ஏனெனில் அவன் என் பார்வையில் தயவைப் பெற்றிருக்கிறான்” என்று சொல்லச் செய்தான்.
  rationale: The revision restores the primary, less-interpreted sense of יַעֲמָד (‘let David stand’) and retains the contextual possibility of continued royal service in the footnote. It also avoids adding an explicit messenger, improves Tamil grammar, and preserves the polite request and the Hebrew favor idiom.
