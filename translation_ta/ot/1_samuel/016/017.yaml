translation_notes:
  register: நவீன நிலையான தமிழ்; எளிமையானதாயினும் அரசவைக் கதையாடலுக்கேற்ற கண்ணியமான நடை. ‘இசைக்க’ என்பது கருவியை ஊகித்து சேர்க்காமல் மூலத்தின் பொதுப் பொருளைப் பாதுகாக்கிறது.
