source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר שָׁא֖וּל אֶל עֲבָדָ֑י/ו רְאוּ נָ֣א לִ֗/י אִ֚ישׁ מֵיטִ֣יב לְ/נַגֵּ֔ן וַ/הֲבִיאוֹתֶ֖ם אֵלָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/016/017.yaml
  text: Then Saul said to his servants[a], “Please find for me a man who can play well, and bring him to me.”
translation:
  language: ta
  text: அப்போது சவுல் தன் பணியாளர்களிடம், “நன்றாக இசைக்கக்கூடிய ஒரு மனிதனை எனக்காகத் தேடி, அவனை என்னிடம் அழைத்து வாருங்கள்” என்றான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: அப்போது ... என்றான்
  rationale: தொடர்கதை நிகழ்வின் அடுத்த கட்டத்தை வாவ் தொடர் வடிவம் முன்னெடுக்கிறது; நவீன தமிழில் ‘அப்போது’ இயல்பாக வரிசையை உணர்த்துகிறது.
- source_word: עֲבָדָיו
  choice: தன் பணியாளர்களிடம்
  rationale: அரசவையில் சவுலுக்குச் சேவை செய்தவர்களைச் சுட்டுகிறது. ‘பணியாளர்கள்’ என்பது ‘ஊழியர்கள்’ என்ற குழப்பத்தைத் தவிர்த்து, சேவகர்/அரண்மனை உதவியாளர் என்ற பரப்பை இயல்பாகக் கொண்டுள்ளது.
- source_word: רְאוּ נָא
  choice: தேடி
  rationale: ראה என்ற கட்டளையும் נָא என்ற வேண்டுகோள் துகளும் இங்கு ஒருவரைக் கண்டறிந்து அழைத்துவரும் பொருளில் வருகின்றன. தமிழில் முழுக் கூற்றின் மரியாதையான கட்டளை வடிவமான ‘தேடி ... வாருங்கள்’ இதை இயல்பாகத் தருகிறது.
- source_word: לִי
  choice: எனக்காக
  rationale: சவுலின் பயன் அல்லது தேவைக்காக ஒருவரைத் தேட வேண்டும் என்பதைக் குறிக்கும் நன்மைப் பொருள்.
- source_word: אִישׁ
  choice: ஒரு மனிதனை
  rationale: எபிரெயச் சொல் ஒருமை ஆண்பாலைத் தெளிவாகக் குறிக்கிறது; அதை பாலினமற்ற ‘ஒருவரை’ என மாற்றாமல் வெளிப்படுத்துகிறது.
- source_word: מֵיטִיב לְנַגֵּן
  choice: நன்றாக இசைக்கக்கூடிய
  rationale: சொல்லடிப்படையில் ‘இசைப்பதில் நன்றாகச் செய்கிற’ என்பது இசைத் திறமையைக் குறிக்கிறது. இவ்வசனத்தில் கருவி குறிப்பிடப்படாததால் ஒன்றைச் சேர்க்காமல் ‘நன்றாக இசைக்கக்கூடிய’ என மொழிபெயர்க்கப்படுகிறது.
- source_word: וַהֲבִיאוֹתֶם אֵלָי
  choice: அவனை என்னிடம் அழைத்து வாருங்கள்
  rationale: பலரிடம் கூறப்படும் கட்டளையை ‘வாருங்கள்’ காட்டுகிறது; முன் குறிப்பிடப்பட்ட ஒருமை ஆண்பால் மனிதனை ‘அவனை’ தொடர்கிறது.
