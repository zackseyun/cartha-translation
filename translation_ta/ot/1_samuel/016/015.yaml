base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/016/015.yaml
  text: And Saul’s servants said to him[a], “Look now, an evil spirit from God is terrifying you.”
translation:
  language: ta
  text: சவுலின் பணியாளர்கள் அவரிடம், “இதோ, இப்போது கடவுளிடமிருந்து வந்த ஒரு தீய ஆவி[a] உம்மைத் திகிலுறச் செய்கிறது” என்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கடவுளிடமிருந்து வந்த, தீங்கு விளைவிக்கும் அல்லது துன்பம் தரும் ஒரு ஆவி.” எபிரெயச் சொல் அந்த ஆவி தீயது என்றோ, தீங்கு அல்லது துன்பம் விளைவிப்பது என்றோ பொருள்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: என்றார்கள்
  rationale: வழக்கமான தமிழ் கதைநடையில் உரையாடலுக்குப் பின் வரும் வினை, எபிரெய உரையின் நிகழ்வுத் தொடரை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: עַבְדֵי שָׁאוּל
  choice: சவுலின் பணியாளர்கள்
  rationale: அரசவையின் சூழலில் עֶבֶד என்பதற்கு ‘பணியாளர்கள்’ என்பது அடிமைநிலையைத் தேவையின்றி முன்னிறுத்தாமல் சேவைப் பொறுப்பை இயல்பாகக் குறிக்கிறது.
- source_word: אֵלָיו
  choice: அவரிடம்
  rationale: முன்னிடைச்சொல் மற்றும் ஆண்பால் ஒருமை பின்னொட்டின் நேரான, இயல்பான தமிழ் வடிவம்.
- source_word: הִנֵּה נָא
  choice: இதோ
  rationale: கவனத்தை ஈர்த்து உடனடியான நிலையைச் சுட்டும் இச்சொற்றொடரின் உரையாடல் வலிமையை நவீன தமிழில் சுருக்கமாகத் தருகிறது.
- source_word: רוּחַ אֱלֹהִים
  choice: கடவுளிடமிருந்து வந்த ஒரு ... ஆவி
  rationale: இங்கு ஆவி கடவுளோடு கொண்டுள்ள தொடர்பை அதன் தோற்றம் அல்லது அனுப்புதலாக வெளிப்படுத்துகிறது; அதைக் கடவுளுடைய சொந்த ஆவியோடு நேரடியாக அடையாளப்படுத்துவதைத் தவிர்க்கிறது.
- source_word: רָעָה
  choice: தீய
  rationale: רָעָה என்பதன் நேரடியான பொருளைத் தக்கவைக்கிறது; ‘தீங்கு விளைவிக்கும்/துன்புறுத்தும்’ என்ற சூழல்சார் சாத்தியத்தை அடிக்குறிப்பில் பாதுகாக்கிறது.
- source_word: מְבַעִתֶּךָ
  choice: உம்மைப் பயங்கரமாக அச்சுறுத்துகிறது
  rationale: பங்கேற்புவினையின் தொடர்ச்சியான செயற்பாட்டையும், בּעת வேரின் தீவிர அச்சம் அல்லது திகில் ஏற்படுத்தும் வலிமையையும் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: רוּחַ אֱלֹהִים רָעָה என்ற சொற்றொடரில் ஆவிக்கும் கடவுளுக்கும் உள்ள தொடர்பையும் רָעָה என்பதன் பொருள் வீச்சையும் எவ்வாறு மொழிபெயர்ப்பது
  choice: கடவுளிடமிருந்து வந்த ஒரு தீய ஆவி
  alternative: கடவுளிடமிருந்து வந்த, தீங்கு விளைவிக்கும்/துன்புறுத்தும் ஒரு ஆவி
  rationale: எபிரெய உரை அந்த ஆவி கடவுளிடமிருந்து வருவதாக ஏதோ ஒரு வகையில் கூறும் இறையியல் பதற்றத்தைத் தணிக்காமல் காக்கிறது. அதேவேளை, ‘கடவுளிடமிருந்து வந்த’ என்பது அதை கடவுளுடைய சொந்த ஆவியுடன் அடையாளப்படுத்தாமல் இருக்கிறது. רָעָה என்பதன் மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன தரத் தமிழில், கண்ணியமான வேதாகமக் கதைநடை பயன்படுத்தப்பட்டுள்ளது. அரசவைக் சூழலுக்குப் ‘பணியாளர்கள்’ எனவும், சவுலை நோக்கிய மரியாதைப் பன்மைக்குப் ‘உம்மை’ எனவும் வழங்கப்பட்டுள்ளது; மூலத்தின் பொருள் இருமை அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
