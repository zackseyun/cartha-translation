base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/013/010.yaml
  text: And it happened[a], as soon as he had finished offering up the burnt offering, that behold, Samuel came. And Saul went out to meet him, to bless him.
translation:
  language: ta
  text: அவன் தகனபலியைச் செலுத்தி முடித்தவுடனேயே, இதோ, சாமுவேல் வந்தார். சாமுவேலைச் சந்திக்கவும் அவரை ஆசீர்வதிக்கவும் சவுல் வெளியே சென்றான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “வாழ்த்தவும்.” எபிரெய வினைச்சொல்லின் நேரடிப் பொருள் “ஆசீர்வதித்தல்”; ஆனால் இத்தகைய சந்திப்புச் சூழலில் அது மரியாதையாக வாழ்த்துவதைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: '[தனி வார்த்தையாக மொழிபெயர்க்காமல் காலவாக்கிய அமைப்பில் வெளிப்படுத்தப்பட்டது]'
  rationale: எபிரெயக் கதைநடையில் அடுத்த நிகழ்வை அறிமுகப்படுத்தும் வழக்கமான வடிவம். தமிழில் இயல்பான தொடர்ச்சிக்காக ‘முடித்தவுடனேயே’ எனும் அமைப்பிலேயே அதன் கதைநடைப் பணி வெளிப்படுத்தப்படுகிறது.
- source_word: כְּכַלֹּתוֹ
  choice: அவன் ... முடித்தவுடனேயே
  rationale: כְּ முன்னொட்டுடன் வரும் வினையெச்ச வடிவம் காலத் தொடர்பைக் குறிக்கிறது; இச்சூழலில் செயல் முடிந்த உடனேயே அடுத்த நிகழ்வு நடந்ததை ‘முடித்தவுடனேயே’ தெளிவாகக் காட்டுகிறது.
- source_word: לְהַעֲלוֹת הָעֹלָה
  choice: தகனபலியைச் செலுத்தி
  rationale: עֹלָה என்பது முழுவதுமாக எரிக்கப்படும் பலிக்கான தொழில்நுட்பச் சொல்; ‘தகனபலி’ அதைச் சுருக்கமாகவும் வழக்கமாகவும் குறிக்கிறது. העלה என்பதன் பலியிடும் பொருளை ‘செலுத்தி’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וְהִנֵּה
  choice: இதோ
  rationale: சாமுவேலின் திடீர் வருகையை உயிரோட்டத்துடனும் வியப்புடனும் முன்வைக்கும் எபிரெயச் சுட்டுச்சொல்லின் பணியைப் பாதுகாக்கிறது.
- source_word: שְׁמוּאֵל בָּא
  choice: சாமுவேல் வந்தார்
  rationale: நிகழ்வை நேரடியாகவும் இயல்பாகவும் தெரிவிக்கிறது; நவீனத் தமிழில் சாமுவேலைக் குறிக்க மரியாதைப் பன்மை பயன்படுத்தப்பட்டுள்ளது.
- source_word: וַיֵּצֵא שָׁאוּל לִקְרָאתוֹ
  choice: சவுல் அவரைச் சந்தித்து ... வெளியே சென்றான்
  rationale: வெளியே சென்று ஒருவரை எதிர்கொண்டு சந்திப்பதைக் குறிக்கும் எபிரெயச் சொற்றொடரின் இயக்கத்தையும் நோக்கத்தையும் பாதுகாக்கிறது.
- source_word: לְבָרֲכוֹ
  choice: ஆசீர்வதிப்பதற்காக
  rationale: ברך என்பதன் அடிப்படைப் பொருளான ‘ஆசீர்வதித்தல்’ பாதுகாக்கப்படுகிறது. சந்திப்புச் சூழலில் இது மரியாதையான வாழ்த்தைக் குறிக்கக்கூடும் என்பதால் மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
