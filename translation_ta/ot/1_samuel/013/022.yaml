  text: וְ/הָיָה֙ בְּ/י֣וֹם מִלְחֶ֔מֶת וְ/לֹ֨א נִמְצָ֜א חֶ֤רֶב וַ/חֲנִית֙ בְּ/יַ֣ד כָּל הָ/עָ֔ם אֲשֶׁ֥ר אֶת שָׁא֖וּל וְ/אֶת יוֹנָתָ֑ן וַ/תִּמָּצֵ֣א לְ/שָׁא֔וּל וּ/לְ/יוֹנָתָ֖ן בְּנֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/013/022.yaml
  text: So on the day of battle[a], not a sword or spear was found in the hand of any of the people who were with Saul and Jonathan; but Saul and his son Jonathan had them.
translation:
  language: ta
  text: ஆகவே, போர்நாளில் சவுலோடும் யோனத்தானோடும் இருந்த படைவீரர்களில் எவருடைய கையிலும் வாளோ ஈட்டியோ காணப்படவில்லை[a]; சவுலிடமும் அவனுடைய மகன் யோனத்தானிடமும் அவை இருந்தன.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அதிகச் சொற்சார்பாக: “மக்கள் அனைவருடைய கையிலும் வாளும் ஈட்டியும் காணப்படவில்லை.” எபிரெயச் சொற்றொடரின் பொருள், படைவீரர்களில் எவரிடமும் இத்தகைய ஆயுதங்கள் இல்லை என்பதாகும்.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה בְּיוֹם מִלְחֶמֶת
  choice: ஆகவே, போர்நாளில்
  rationale: முந்தைய விளக்கத்தின் விளைவாக ஏற்பட்ட நிலையை எபிரெயக் கதைநடை அறிமுகப்படுத்துகிறது. ‘ஆகவே’ தொடர்பை இயல்பாகக் காட்டுகிறது; ‘போர்நாளில்’ காலக் குறிப்பைத் தக்கவைக்கிறது.
- source_word: לֹא נִמְצָא
  choice: காணப்படவில்லை
  rationale: מצא என்பதன் நிஃபால் வடிவிலுள்ள செயப்பாட்டு/ஆளற்ற கட்டமைப்பை நேரடியாகவும் இயல்பாகவும் பிரதிபலிக்கிறது.
- source_word: חֶרֶב וַחֲנִית
  choice: வாளோ ஈட்டியோ
  rationale: எபிரெயத்தில் இணைப்புச் சொல் ‘மற்றும்’ என்றாலும், எதிர்மறை வாக்கியத்தில் எந்த வகை ஆயுதமும் இல்லை என்ற பகிர்வுப் பொருளைத் தமிழின் ‘-ஓ ... -ஓ’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: בְּיַד כָּל הָעָם
  choice: படைவீரர்களில் எவருடைய கையிலும்
  rationale: எதிர்மறையின் கீழ் כָּל என்பது ‘ஒருவரிடமும் இல்லை’ என்ற பகிர்வுப் பொருளைத் தருகிறது. சூழலில் הָעָם போருக்கு வந்த படையினரைக் குறிப்பதால் ‘படைவீரர்கள்’ தெளிவான சூழல்சார் மொழிபெயர்ப்பு; ‘கையில்’ என்ற எபிரெய உடைமை மரபும் தக்கவைக்கப்பட்டுள்ளது.
- source_word: אֲשֶׁר אֶת שָׁאוּל וְאֶת יוֹנָתָן
  choice: சவுலோடும் யோனத்தானோடும் இருந்த
  rationale: இங்கு אֶת நேரடிச் செயப்படுபொருள் குறியீடாக அல்லாமல் உடனிருப்பதைக் குறிக்கிறது; தமிழில் ‘-ஓடும் ... இருந்த’ அந்தத் தொடர்பை இயல்பாகக் கூறுகிறது.
- source_word: וַתִּמָּצֵא לְשָׁאוּל וּלְיוֹנָתָן בְּנוֹ
  choice: சவுலிடமும் அவனுடைய மகன் யோனத்தானிடமும் மட்டுமே அவை இருந்தன
  rationale: லாமேத் ஆயுதங்கள் அவர்களிடம் இருந்ததைக் குறிக்கிறது. எபிரெயப் பெண்பால் ஒருமை வினைச்சொல் ஆயுத இணையைத் தொகுப்பாக எடுத்தாலும், தமிழில் ‘அவை’ என்று வெளிப்படுத்துவது தெளிவு. எதிர்மறை–நேர்மறை வேறுபாட்டை இயல்பாகச் சுட்ட ‘மட்டுமே’ சேர்க்கப்பட்டுள்ளது.
theological_decisions: []
translation_notes:
  register: நவீனத் தரத் தமிழில், எளிதில் புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘எவருடைய கையிலும்’ என்பது மூலத்தின் உடைமை மரபையும் எதிர்மறைப் பகிர்வுப் பொருளையும் காக்கிறது; அடிக்குறிப்பு குறியீடு முதன்மை உரையில் சேர்க்கப்பட்டுள்ளது.
