source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר שָׁא֔וּל הַגִּ֣שׁוּ אֵלַ֔/י הָ/עֹלָ֖ה וְ/הַ/שְּׁלָמִ֑ים וַ/יַּ֖עַל הָ/עֹלָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/013/009.yaml
  text: So Saul said[b][a], “Bring near to me the burnt offering and the peace offerings.” And he offered up the burnt offering.
translation:
  language: ta
  text: அப்பொழுது சவுல், “தகனபலியையும் சமாதானப் பலிகளையும்[a] என்னிடம் கொண்டுவாருங்கள்” என்றான். பின்பு அவன் தகனபலியைச் செலுத்தினான்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உறவுப் பலிகளையும்.” எபிரெயச் சொல் சமாதானம், நல்வாழ்வு அல்லது பகிர்ந்துறவோடு தொடர்புடைய பலிகளைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: இறுதிக் கூற்றின் இயல்பான பொருள், சவுலே தகனபலியைச் செலுத்தினான் என்பதாகும்; சிலர், அவன் அந்தப் பலியை மற்றொருவர்மூலம் செலுத்தச் செய்தான் என்று மறைமுகமாகப் புரிந்துகொள்கிறார்கள்.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: அப்பொழுது சவுல் … என்றான்
  rationale: வாவ் தொடர் வடிவம் கதையின் அடுத்த நிகழ்வை முன்னெடுக்கிறது; நவீனத் தமிழில் இயல்பான தொடர்ச்சியை ‘அப்பொழுது’ வெளிப்படுத்துகிறது.
- source_word: הַגִּשׁוּ אֵלַי
  choice: என்னிடம் கொண்டுவாருங்கள்
  rationale: ஹிஃபில் கட்டளை வடிவம் அருகில் கொண்டுவருதல் அல்லது முன்வைத்தல் என்னும் பொருளைத் தருகிறது; இங்கு பலியைச் சவுலிடம் கொண்டுவரும் செயலை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: הָעֹלָה
  choice: தகனபலி
  rationale: முழுவதும் எரித்துச் செலுத்தப்படும் பலியைக் குறிக்கும் எபிரெய வழிபாட்டுச் சொல்லுக்கு இது துல்லியமான, வழக்கிலுள்ள தமிழ்ச் சொல்.
- source_word: וְהַשְּׁלָמִים
  choice: சமாதானப் பலிகள்
  rationale: שְׁלָמִים என்பது சமாதானம், நல்வாழ்வு, பகிர்ந்துறவு ஆகிய கருத்துகளோடு தொடர்புடைய பலிகளைப் பன்மையில் குறிக்கிறது; ‘சமாதானப் பலிகள்’ மூலச்சொல்லோடு நெருக்கமான வழிபாட்டுச் சொல்.
- source_word: וַיַּעַל
  choice: செலுத்தினான்
  rationale: பலியிடும் சூழலில் עלה என்பது பலியை ஏறச்செய்தல், அதாவது பலிபீடத்தில் செலுத்துதல் என்ற மரபுச் சார்ந்த பொருளைக் கொண்டது; தமிழில் ‘பலியைச் செலுத்தினான்’ இயல்பாகவும் துல்லியமாகவும் உள்ளது.
theological_decisions:
- issue: இறுதி வாக்கியத்தில் செயலைச் செய்தவர் யார்?
  choice: சவுலே தகனபலியைச் செலுத்தினான்
  alternative: சவுல் தகனபலியை மற்றொருவர்மூலம் செலுத்தச் செய்தான் அல்லது முன்வைக்கச் செய்தான்
  rationale: முந்தைய எழுவாயான சவுலைத் தொடர்ந்து வரும் ஒருமை வினை வடிவத்தின் நேரடியான வாசிப்பு, சவுலே செயலைச் செய்தான் என்பதாகும். அடுத்துவரும் கண்டனமும் இதற்கு ஆதரவாக உள்ளது; இருப்பினும் மறைமுகச் செயற்பாட்டைப் புரிந்துகொள்ளும் வாய்ப்பை அடிக்குறிப்பு பாதுகாக்கிறது.
translation_notes:
  register: நவீன பொதுத்தரத் தமிழில், வழிபாட்டுச் சொற்களின் துல்லியத்தையும் கதையின் சுருக்கமான நடையையும் காக்கும் கண்ணியமான மொழிநடை பயன்படுத்தப்பட்டுள்ளது. அடிக்குறிப்பு குறிகள் அவை விளக்கும் சொற்றொடர்களுக்குப் பின்னர் அமைக்கப்பட்டுள்ளன.
