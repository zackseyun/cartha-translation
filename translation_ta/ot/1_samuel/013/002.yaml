  text: וַ/יִּבְחַר ל֨/וֹ שָׁא֜וּל שְׁלֹ֣שֶׁת אֲלָפִים֮ מִ/יִּשְׂרָאֵל֒ וַ/יִּהְי֨וּ עִם שָׁא֜וּל אַלְפַּ֗יִם בְּ/מִכְמָשׂ֙ וּ/בְ/הַ֣ר בֵּֽית אֵ֔ל וְ/אֶ֗לֶף הָיוּ֙ עִם י֣וֹנָתָ֔ן בְּ/גִבְעַ֖ת בִּנְיָמִ֑ין וְ/יֶ֣תֶר הָ/עָ֔ם שִׁלַּ֖ח אִ֥ישׁ לְ/אֹהָלָֽי/ו־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/013/002.yaml
  text: And Saul chose for himself three thousand men from Israel[a]. Two thousand were with Saul at Michmash and in the hill country of Bethel, and a thousand were with Jonathan at Gibeah of Benjamin. The rest of the people he sent away[b], each man to his tent.
translation:
  language: ta
  text: சவுல் இஸ்ரவேலரிலிருந்து மூவாயிரம் பேரைத் தனக்கெனத் தேர்ந்தெடுத்தான். அவர்களில் இரண்டாயிரம் பேர் மிக்மாசிலும் பெத்தேலின் மலைப்பகுதியிலும்[a] சவுலோடு இருந்தார்கள்; ஆயிரம் பேர் பென்யமீனின் கிபியாவில் யோனத்தானோடு இருந்தார்கள். மீதமிருந்த மக்களில் ஒவ்வொருவனையும் அவனவன் கூடாரத்துக்கு[b] சவுல் அனுப்பிவிட்டான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பெத்தேலின் மலையிலும்.” எபிரெயச் சொற்றொடர் பெத்தேலைச் சுற்றிய மலைப்பகுதியையோ, பெத்தேலுக்கு அருகிலுள்ள குறிப்பிட்ட ஒரு உயரமான இடத்தையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில், “ஒவ்வொருவனையும் அவனவன் கூடாரங்களுக்கு [அனுப்பினான்].” இது மக்களை அவரவர் இருப்பிடங்களுக்கு அனுப்பிவைப்பதைக் குறிக்கும் பொதுவான எபிரெய மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבְחַר לוֹ
  choice: தனக்கெனத் தேர்ந்தெடுத்தான்
  rationale: בחר என்பதன் அடிப்படைப் பொருளான ‘தேர்ந்தெடு’ என்பதையும், לוֹ குறிக்கும் ‘தனக்காக/தனக்கென’ என்ற நுட்பத்தையும் இயல்பான தமிழில் காக்கிறது.
- source_word: שְׁלֹשֶׁת אֲלָפִים מִיִּשְׂרָאֵל
  choice: இஸ்ரவேலரிலிருந்து மூவாயிரம் பேரை
  rationale: מן குறிக்கும் தேர்ந்தெடுக்கப்பட்ட மக்களின் மூலக் குழுவை ‘இருந்து’ வெளிப்படுத்துகிறது; ஆட்களைக் குறிக்கும் எண்ணிக்கைக்கு ‘பேர்’ இயல்பான நவீனத் தமிழ்.
- source_word: וַיִּהְיוּ עִם שָׁאוּל
  choice: சவுலோடு இருந்தார்கள்
  rationale: எபிரெயச் சொற்றொடரின் எளிய உடனிருப்பு/நிலையமைப்பை கூடுதல் பொருள் சேர்க்காமல் தருகிறது.
- source_word: בְּמִכְמָשׂ
  choice: மிக்மாசில்
  rationale: படை தங்கிய இடத்தைக் குறிக்கும் ב முன்னிடைச்சொல்லைத் தமிழின் இடவேற்றுமை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וּבְהַר בֵּית אֵל
  choice: பெத்தேலின் மலைப்பகுதியில்
  rationale: הַר என்பது தனிப்பட்ட மலை அல்லது மலைப்பகுதி ஆகியவற்றைக் குறிக்கக்கூடும்; இச்சூழலில் பிராந்திய நிலவியலைக் குறிக்கும் ‘மலைப்பகுதி’ வாசிப்புக்கு இயல்பானது, ஆனால் மாற்று அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: וְאֶלֶף הָיוּ עִם יוֹנָתָן
  choice: ஆயிரம் பேர் ... யோனத்தானோடு இருந்தார்கள்
  rationale: முந்தைய எண்ணிக்கை மற்றும் படைநிலையமைப்புக்கு இணையான எளிய தமிழாக்கம்.
- source_word: בְּגִבְעַת בִּנְיָמִין
  choice: பென்யமீனின் கிபியாவில்
  rationale: மசோரா உயிர்க்குறிப்பு גִּבְעַת என்பதை ‘கிபியா’ என ஆதரிக்கிறது; பென்யமீன் என்பது அந்த இடத்தை வேறுபடுத்தும் உடைமைத் தொடர்பாக வழங்கப்படுகிறது.
- source_word: וְיֶתֶר הָעָם
  choice: மீதமிருந்த மக்களை
  rationale: הָעָם என்பதன் நேரடிப் பொருளான ‘மக்கள்’ காக்கப்படுகிறது; சூழலால் அவர்கள் படையில் திரண்டவர்கள் என்பது தெளிவாகிறது.
- source_word: שִׁלַּח
  choice: அனுப்பிவிட்டான்
  rationale: இங்கு மீதமிருந்தவர்களைப் படைநிலையிலிருந்து விடுவித்து அனுப்பிய சூழல்சார் பொருளை இயல்பாகத் தருகிறது.
- source_word: אִישׁ לְאֹהָלָיו
  choice: ஒவ்வொருவனும் தன் கூடாரத்திற்குச் சென்றான்
  rationale: ‘ஒவ்வொரு ஆணும் அவனது கூடாரங்களுக்கு’ என்ற எபிரெய மரபுத்தொடரின் பகிர்ந்தளிக்கும் பொருளையும் ‘கூடாரம்’ என்ற உருவகத்தையும் காக்கிறது; தமிழில் முழுமையான இயல்பான வாக்கியமாக அமைக்கப்பட்டுள்ளது.
