translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் வகையிலும் வேதாகம வர்ணனையின் கண்ணியமான நடையையும் காத்தும் மொழிபெயர்க்கப்பட்டுள்ளது. இடப்பெயர்கள் தமிழ் வேதாகமப் பயன்பாட்டுக்கு ஏற்ற ஒலிபெயர்ப்பில் தரப்பட்டுள்ளன. மூலத்தில் உள்ள நிலவியல் தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
