translation_notes:
  register: நவீன, கண்ணியமான உரைநடை பயன்படுத்தப்பட்டுள்ளது. சாமுவேலின் கூர்மையான கேள்விக்குத் ‘நீ’ என்றும், சவுல் சாமுவேலை மரியாதையுடன் விளிப்பதற்கு ‘நீர்’ என்றும் தரப்பட்டுள்ளது. எபிரெய வாக்கியம் அடுத்த வசனத்தில் தொடருவதால், இந்த வசனத்தின் இறுதியில் காரண அமைப்பு முடிவுறாமல் காக்கப்பட்டுள்ளது.
