base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/013/011.yaml
  text: Then Samuel said[a], “What have you done?” And Saul said, “Because I saw that the people were scattering from me, and you had not come at the appointed time[b], and the Philistines were gathering at Michmash,”
translation:
  language: ta
  text: அப்போது சாமுவேல், “நீ என்ன செய்துவிட்டாய்?” என்றார். அதற்குச் சவுல், “மக்கள் என்னைவிட்டுச் சிதறிப்போவதையும், குறிக்கப்பட்ட காலத்தில்[b] நீர் வராததையும், பெலிஸ்தியர்கள் மிக்மாஸில் திரண்டுகொண்டிருப்பதையும்[a] நான் கண்டதால்,” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மிக்மாஸில் கூடிவந்துகொண்டிருப்பதையும்.”
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில், “நாட்களின் குறிக்கப்பட்ட நேரத்தில்”; இது முன்பு ஒப்புக்கொள்ளப்பட்ட காலக்கெடுவைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֶה עָשִׂיתָ
  choice: நீ என்ன செய்துவிட்டாய்?
  rationale: முடிந்த செயலின் தற்போதைய விளைவைக் குறித்து சாமுவேல் நேரடியாகக் கண்டிப்பதை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: כִּי רָאִיתִי כִּי
  choice: … நான் கண்டதால்
  rationale: சவுல் தன் செயலுக்குக் காரணம் கூறும் அமைப்பைத் தமிழில் இயல்பான காரண வாக்கியமாகத் தருகிறது.
- source_word: נָפַץ הָעָם מֵעָלַי
  choice: மக்கள் என்னைவிட்டுச் சிதறிப்போவதை
  rationale: படையினர் சவுலை விட்டு விலகிப் பல திசைகளில் கலைந்துபோகும் கருத்தையும், அவன் ஆதரவை இழப்பதையும் காக்கிறது.
- source_word: לֹא בָאתָ
  choice: நீர் வராததை
  rationale: சவுல் சாமுவேலை மரியாதையுடன் விளிக்கும் இயல்பான தமிழ் வடிவம்; எதிர்பார்க்கப்பட்ட நேரத்திற்குள் வராமையைக் குறிக்கிறது.
- source_word: לְמוֹעֵד הַיָּמִים
  choice: குறிக்கப்பட்ட காலத்தில்
  rationale: சொல்லுக்குச் சொல் ‘நாட்களின் குறிக்கப்பட்ட நேரத்தில்’ என்பதற்குப் பதிலாக, முன்னரே நிர்ணயிக்கப்பட்ட காலக்கெடுவைக் குறிக்கும் இயல்பான தமிழ்.
- source_word: נֶאֱסָפִים
  choice: திரண்டுகொண்டிருப்பதை
  rationale: நிஃபால் வினையெச்சத்தின் தொடர்ந்துகொண்டிருந்த படைத் திரள்வை வெளிப்படுத்துகிறது; ‘கூடிவருதல்’ என்பதும் சாத்தியம்.
- source_word: מִכְמָשׂ
  choice: மிக்மாஸ்
  rationale: எபிரெய இடப்பெயரின் ஒலியை நவீனத் தமிழ் எழுத்துப்பெயர்ப்பில் தருகிறது.
