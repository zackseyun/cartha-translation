  yaml_path: translation/ot/1_samuel/013/017.yaml
  text: And raiders came out from the camp of the Philistines in three companies[a]. One company turned toward the road to Ophrah[b], toward the land of Shual.
translation:
  language: ta
  text: பெலிஸ்தியரின் முகாமிலிருந்து கொள்ளைப் படை மூன்று பிரிவுகளாகப் புறப்பட்டது.[a] ஒரு பிரிவு ஒப்ராவுக்குச் செல்லும் பாதையை நோக்கி, சூவால் நாட்டை நோக்கித் திரும்பியது.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “கொள்ளைப் படை” என்பதற்கான எபிரெயச் சொல் சொற்பட “அழிப்பவன்” அல்லது “அழிக்கும் படை” என்று பொருள்படும்; இங்கு அது பெலிஸ்தியர் முகாமிலிருந்து புறப்பட்ட கொள்ளைப் படையைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: “மூன்று பிரிவுகள்,” “ஒரு பிரிவு” என்பவை எபிரெயத்தில் சொற்பட “மூன்று தலைகள்,” “ஒரு தலை” என்று உள்ளன; இது படைப்பிரிவுகள் அல்லது குழுக்களைக் குறிக்கும் மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּשְׁחִית
  choice: கொள்ளையிடும் படை
  rationale: இச்சொல்லின் அடிப்படைப் பொருள் ‘அழிப்பவன்/அழிக்கும் படை’ என்பதாக இருந்தாலும், இங்கு ஒருமை வடிவம் கூட்டுப்பொருளில் பெலிஸ்திய முகாமிலிருந்து புறப்படும் தாக்குதல் அல்லது கொள்ளைப் படையைக் குறிக்கிறது.
- source_word: שְׁלֹשָׁה רָאשִׁים
  choice: மூன்று பிரிவுகளாக
  rationale: எபிரெயத்தில் சொற்பட ‘மூன்று தலைகள்’; இங்கு படைப் பிரிவுகளைக் குறிக்கும் மரபுத்தொடர். இயல்பான நவீன தமிழில் ‘மூன்று பிரிவுகளாக’ என்று வழங்கப்பட்டது.
- source_word: הָרֹאשׁ אֶחָד
  choice: ஒரு பிரிவு
  rationale: முந்தைய ‘மூன்று தலைகள்’ என்ற மரபுத்தொடரின் ஒருமை வடிவம்; தமிழில் ஒரே சீராக ‘ஒரு பிரிவு’ என மொழிபெயர்க்கப்பட்டது.
- source_word: יִפְנֶה
  choice: திரும்பியது
  rationale: ‘திரும்பு/திசைநோக்கு’ என்ற பொருளுடைய வினை; ஒரு படைப்பிரிவு சென்ற திசையை இங்கு குறிக்கிறது.
- source_word: דֶּרֶךְ עָפְרָה
  choice: ஒப்ராவுக்குச் செல்லும் பாதையில்
  rationale: דֶּרֶךְ என்பது ‘வழி/பாதை’; ஒப்ராவை நோக்கிச் செல்லும் வழி என்பதை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: אֶרֶץ שׁוּעָל
  choice: சூவால் நாடு
  rationale: אֶרֶץ என்பது ‘நாடு/நிலப்பகுதி’; இங்கு சூவால் என்ற பிரதேசப் பெயருடன் ‘நாடு’ பொருத்தமாக உள்ளது.
- source_word: פְלִשְׁתִּים
  choice: பெலிஸ்தியர்
  rationale: மக்கள் இனப்பெயருக்கான தமிழில் நிலைபெற்ற ஒலிபெயர்ப்பு.
- source_word: עָפְרָה
  choice: ஒப்ரா
  rationale: இடப்பெயர் பொருளாக்கப்படாமல் தமிழில் ஒலிபெயர்க்கப்பட்டது.
- source_word: שׁוּעָל
  choice: சூவால்
  rationale: பிரதேசப் பெயர் பொருளாக்கப்படாமல் தமிழில் ஒலிபெயர்க்கப்பட்டது.
