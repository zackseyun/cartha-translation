base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/013/003.yaml
  text: Jonathan struck down the Philistine garrison that was at Geba[a], and the Philistines heard of it. Then Saul blew the ram's horn throughout all the land, saying[b], “Let the Hebrews hear!”
translation:
  language: ta
  text: யோனத்தான் கேபாவில் இருந்த பெலிஸ்தியரின் இராணுவக் காவல் நிலையத்தை[a] தாக்கினார். பெலிஸ்தியர்கள் அதைக் கேள்விப்பட்டார்கள். அப்போது சவுல் நாடெங்கும் கொம்பை[b] ஊதி, “எபிரெயர்கள் கேட்கட்டும்!” என்று அறிவித்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பெலிஸ்திய அதிகாரியை.” எபிரெயச் சொல் ஓர் அதிகாரியையோ, அங்கு நிறுத்தப்பட்ட இராணுவக் காவல் நிலையத்தையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில் ஷோஃபார்; இது பொதுவாக ஆட்டுக்கடாவின் கொம்பு.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּךְ
  choice: தாக்கினார்
  rationale: נכה என்பது அடித்தல் அல்லது தாக்குதல் என்ற பரந்த பொருளுடையது; இங்கு பொருள் ஒரு படைநிலையாக இருக்கக்கூடும் என்பதால், ‘கொன்றார்’ எனத் தேவையின்றி குறுக்காமல் ‘தாக்கினார்’ என்பது பொருத்தமானது.
- source_word: נְצִיב פְּלִשְׁתִּים
  choice: பெலிஸ்தியப் படைநிலை
  rationale: נְצִיב என்பது ஓர் அதிகாரியையோ நிறுத்தப்பட்ட படைப்பிரிவு அல்லது காவல்நிலையையோ குறிக்கலாம். போர்ச் சூழலில் ‘படைநிலை’ இயல்பாகப் பொருந்துகிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: בְּגֶבַע
  choice: கேபாவில்
  rationale: கேபா என்ற இடப்பெயரைத் தமிழில் இயல்பான இடவேற்றுமையுடன் வழங்குகிறது.
- source_word: וַיִּשְׁמְעוּ פְּלִשְׁתִּים
  choice: பெலிஸ்தியர்கள் அதைக் கேள்விப்பட்டார்கள்
  rationale: எபிரெயத்தில் வினையின் பொருள் வெளிப்படையாக இல்லை; தமிழில் சூழலால் உணரப்படும் செய்தியை ‘அதை’ எனக் குறிப்பது இயல்பானது.
- source_word: תָּקַע בַּשּׁוֹפָר
  choice: கொம்பை ஊதினார்
  rationale: שׁוֹפָר என்பது உலோக எக்காளம் அல்ல, ஊதுவதற்குப் பயன்படுத்தப்பட்ட விலங்குக் கொம்பு. மூலத்தின் பண்பாட்டு உருவகத்தை ‘கொம்பு’ காக்கிறது.
- source_word: בְּכָל הָאָרֶץ
  choice: நாடெங்கும்
  rationale: இங்கு הָאָרֶץ உலகம் முழுவதையும் அல்ல, நாட்டின் நிலப்பரப்பைக் குறிக்கிறது; ‘நாடெங்கும்’ தமிழில் இயல்பான பரவல் உணர்வைத் தருகிறது.
- source_word: לֵאמֹר
  choice: என்று சொல்லி
  rationale: நேர்கூற்றை அறிமுகப்படுத்தும் எபிரெயச் சொல்லமைப்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: יִשְׁמְעוּ הָעִבְרִים
  choice: எபிரெயர்கள் இதைக் கேட்கட்டும்!
  rationale: இங்குள்ள imperfect வடிவத்தின் கட்டளை அல்லது வேண்டுகோள் வலிமையை ‘கேட்கட்டும்’ காக்கிறது. மூலத்தில் உள்ள ‘எபிரெயர்கள்’ என்பதே வைக்கப்பட்டுள்ளது; ‘இஸ்ரவேலர்கள்’ என மாற்றப்படவில்லை.
