base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/013/021.yaml
  text: And the charge was a pim for the plowshares[a], for the mattocks, for the three-pronged forks, and for the axes[b], and for setting the goads.
translation:
  language: ta
  text: கலப்பைக் கொழுக்கள், மண்வெட்டிகள், மும்முனைக் கவைக்கோல்கள், கோடரிகள் ஆகியவற்றுக்கும் தார்க்கோலைச் சீர்செய்வதற்கும் கட்டணம்[b] ஒரு பீம்[a] ஆக இருந்தது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: பீம் என்பது ஒரு சிறிய எடை அல்லது செலுத்தும் அளவாக இருந்திருக்கலாம்; அது பொதுவாக ஒரு சேக்கலில் ஏறக்குறைய மூன்றில் இரண்டு பங்கு என்று கருதப்படுகிறது.
    reason: cultural_note
  - marker: b
    text: அல்லது, “தீட்டுதலுக்கான கட்டணம் ஒரு பீம்.” எபிரெய வாசகம் புரிந்துகொள்வதற்குக் கடினமானது; இது வசூலிக்கப்பட்ட கட்டணத்தையோ தீட்டும் பணியையோ குறிக்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: הַפְּצִירָה
  choice: கட்டணம்
  rationale: இச்சொல் அரிதானது. பின்வரும் ‘பீம்’ அளவைக் கருத்தில் கொள்ளும்போது, கருவிகளைப் பராமரிக்கும் பணிக்காக வசூலிக்கப்பட்ட கட்டணம் என்பது சூழலுக்கு இயல்பாகப் பொருந்துகிறது; ‘தீட்டுதல்’ என்ற மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: פִים
  choice: ஒரு பீம்
  rationale: இது ஒரு பழங்கால எடை அல்லது செலுத்தும் அளவின் பெயர். அதன் துல்லியமான மதிப்பு உறுதியல்ல என்பதால் பெயரொலிப்பு செய்யப்பட்டு, சாத்தியமான மதிப்பு அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: מַחֲרֵשֹׁת
  choice: கலப்பைக் கொழுக்கள்
  rationale: தீட்டப்பட வேண்டிய கலப்பையின் இரும்பு முனை அல்லது உழும் பகுதியைக் குறிக்கும் இயல்பான தமிழ்ச் சொற்றொடர்.
- source_word: אֵתִים
  choice: மண்வெட்டிகள்
  rationale: மண்ணை வெட்டவும் கொத்தவும் பயன்படும் வேளாண் கருவி என்பதைக் காட்டும் பொதுவாகப் புரியக்கூடிய சொல்; துல்லியமான கருவிவகை உறுதியல்ல.
- source_word: שְׁלֹשׁ קִלְּשׁוֹן
  choice: மும்முனைக் கவைக்கோல்கள்
  rationale: மூன்று முனைகளுள்ள வேளாண் கருவி என்ற எபிரெயப் படிமத்தை இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: קַּרְדֻּמִּים
  choice: கோடரிகள்
  rationale: வெட்டுவதற்குப் பயன்படும் கருவிகளைக் குறிக்கும் நேரடியான, பொதுவாகப் புரியக்கூடிய மொழிபெயர்ப்பு.
- source_word: לְהַצִּיב הַדָּרְבָן
  choice: தார்க்கோல்களைச் சீர்செய்வதற்கு
  rationale: விலங்குகளை ஓட்டும் தார்க்கோல்களைப் பொருத்துதல், நேராக்குதல் அல்லது பயன்பாட்டுக்குத் தயார்செய்தல் ஆகிய சாத்தியங்களை ‘சீர்செய்தல்’ பரந்த வகையில் தக்கவைக்கிறது; ‘தீட்டுதல்’ என்று மிகத் துல்லியப்படுத்துவதைத் தவிர்க்கிறது.
