translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. ‘நாற்றமெடுத்ததாகிவிட்டது’ என்பது மூலத்தின் கூர்மையான உருவகத்தைத் தக்கவைக்கிறது; தெளிவுக்காக அதன் பொருள் அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது. எல்லா அடிக்குறிப்பு குறிகளும் உரையில் தொடர்புடைய இடங்களில் இடம்பெற்றுள்ளன.
