base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/013/004.yaml
  text: And all Israel heard it said[a], “Saul has struck down the Philistine garrison[c][b], and Israel has also become odious to the Philistines.” Then the people were called out to join Saul at Gilgal.
translation:
  language: ta
  text: இஸ்ரவேலர் அனைவரும், “சவுல் பெலிஸ்தரின் காவற்படையைத் தாக்கிவிட்டார்[a]; இஸ்ரவேலும் பெலிஸ்தருக்குத் துர்நாற்றமாகிவிட்டது[b]” என்ற செய்தியைக் கேட்டார்கள். பின்பு மக்கள் கில்காலில் சவுலைப் பின்தொடர அணிதிரட்டப்பட்டார்கள்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “பெலிஸ்தரின் அதிகாரியைத் தாக்கிவிட்டார்” அல்லது “பெலிஸ்தரின் படைநிலையைத் தாக்கிவிட்டார்” என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் ஒரு அதிகாரியையோ, அங்கு நிறுத்தப்பட்ட காவற்படையையோ அல்லது படைநிலையையோ குறிக்கக்கூடும்; இராணுவச் சூழல் “காவற்படை” என்பதற்கு ஆதரவளிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: சொல்லர்த்தமாக, “இஸ்ரவேல் பெலிஸ்தருக்குத் துர்நாற்றமாகிவிட்டது.” இது பெலிஸ்தர் இஸ்ரவேலை அருவருப்பானதாகக் கருதத் தொடங்கியதை உணர்த்தும் மரபுத்தொடர்.
    reason: lexical_alternative
  - marker: c
    text: “மக்கள் கில்காலில் சவுலுக்குப் பின்னால் அழைத்துக் கூட்டப்பட்டார்கள்” என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொற்றொடர் சவுலைப் பின்தொடர்ந்து போருக்குச் செல்ல மக்களை அணிதிரட்டியதைக் குறிக்க வாய்ப்புள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמְעוּ לֵאמֹר
  choice: “...என்ற செய்தியைக் கேட்டார்கள்”
  rationale: எபிரெய அறிக்கை அறிமுகச் சொற்றொடரின் பொருளை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: הִכָּה
  choice: தாக்கிவிட்டார்
  rationale: נכה என்பதன் ‘அடி/தாக்கு’ என்ற வலிமையைத் தக்கவைக்கிறது; காவற்படை முழுவதும் அழிக்கப்பட்டதாக தேவையின்றி தீர்மானிப்பதைத் தவிர்க்கிறது.
- source_word: נְצִיב פְּלִשְׁתִּים
  choice: பெலிஸ்தரின் காவற்படை
  rationale: נְצִיב என்பது அதிகாரியையோ நிறுவப்பட்ட படைநிலையையோ குறிக்கலாம்; இங்குள்ள இராணுவச் சூழலில் காவற்படை பொருத்தமாக உள்ளது, ஆனால் மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: נִבְאַשׁ
  choice: நாற்றமெடுத்ததாகிவிட்டது
  rationale: ‘துர்நாற்றமாதல்’ என்ற எபிரெய உருவகத்தைத் தக்கவைத்து, பெலிஸ்தரின் வெறுப்புக்குள்ளான நிலையை உணர்த்துகிறது.
- source_word: בַּפְּלִשְׁתִּים
  choice: பெலிஸ்தருக்கு
  rationale: இஸ்ரவேலை வெறுப்புக்குரியதாகக் கருதுபவர்களுடனான உறவைக் குறிக்கும் முன்னிடைச்சொல்லைச் சுருக்கமாக வெளிப்படுத்துகிறது.
- source_word: וַיִּצָּעֲקוּ
  choice: அணிதிரட்டப்பட்டார்கள்
  rationale: இந்த இராணுவச் சூழலில் வினைச்சொல் மக்களைப் போருக்காக அழைத்துக் கூட்டுவதைக் குறிக்கிறது.
- source_word: אַחֲרֵי שָׁאוּל
  choice: சவுலைப் பின்தொடர
  rationale: சவுலின் தலைமையின் கீழ் செல்வதைக் குறிக்கும் ‘அவருக்குப் பின்னால்’ என்ற பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: הַגִּלְגָּל
  choice: கில்காலில்
  rationale: அணிதிரட்டல் நிகழ்ந்த இடமாகப் பெயரை ஒலிபெயர்த்து, தமிழ் இடவேற்றுமையுடன் வழங்குகிறது.
