  text: No blacksmith could be found in all the land of Israel[a], because the Philistines said, “Otherwise the Hebrews will make swords or spears.”
translation:
  language: ta
  text: இஸ்ரவேல் தேசம் முழுவதிலும் ஒரு கொல்லன்கூட காணப்படவில்லை. ஏனெனில் பெலிஸ்தியர்கள், “இல்லாவிட்டால் எபிரெயர்கள் வாள்களையோ ஈட்டிகளையோ செய்வார்கள்” என்று சொல்லியிருந்தார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חָרָשׁ
  choice: கொல்லன்
  rationale: பொதுவாகக் கைவினைஞரைக் குறிக்கக்கூடிய சொல் என்றாலும், ஆயுதங்களையும் அடுத்த வசனங்களில் கூறப்படும் கருவிகளையும் உருவாக்கி கூர்மைப்படுத்தும் உலோகத் தொழிலாளியே இப்போர்ச் சூழலில் குறிக்கப்படுகிறார்.
- source_word: יִמָּצֵא
  choice: காணப்படவில்லை
  rationale: நிபால் வடிவம் ஒருவர் காணப்படுதல் அல்லது அங்கு இருத்தலைக் குறிக்கிறது; தமிழில் முழுமையான இல்லாமையை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: בְּכֹל אֶרֶץ יִשְׂרָאֵל
  choice: இஸ்ரவேல் தேசம் முழுவதிலும்
  rationale: முழு நிலப்பரப்பையும் குறிக்கும் எபிரெய புவியியல் சொற்றொடரைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: கொல்லர்கள் இல்லாததற்கான காரணத்தை அறிமுகப்படுத்துகிறது.
- source_word: אמר
  choice: சொல்லியிருந்தார்கள்
  rationale: மசோரா உரையில் எதிர்பார்க்கப்படும் பன்மை வடிவுக்குப் பதிலாக மெய்யெழுத்து உரையில் אמר உள்ளது; சூழலும் ‘பெலிஸ்தியர்கள்’ என்ற பன்மை எழுவாயும் முந்திய கொள்கையைக் குறிப்பதும் தமிழில் பன்மை இறந்தநிறை வடிவை ஆதரிக்கின்றன.
- source_word: פֶּן
  choice: இல்லாவிட்டால்
  rationale: தடுக்கப்பட வேண்டிய அபாயம் அல்லது விளைவை அறிமுகப்படுத்தும் சொல்லின் பொருளை நவீன தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: הָעִבְרִים
  choice: எபிரெயர்கள்
  rationale: மூலத்தில் உள்ள இனப்பெயரை ‘இஸ்ரவேலர்’ என்று ஒத்திசைக்காமல் அப்படியே பாதுகாக்கிறது.
- source_word: יַעֲשׂוּ
  choice: செய்துகொள்வார்கள்
  rationale: பெலிஸ்தியர்கள் தடுக்க நினைத்த எதிர்கால ஆயுதத் தயாரிப்பைக் குறிக்கிறது; தங்களுக்காக ஆயுதங்களை உருவாக்குவார்கள் என்ற சூழல்சார்ந்த உணர்வையும் தருகிறது.
- source_word: חֶרֶב אוֹ חֲנִית
  choice: வாள்களையோ ஈட்டிகளையோ
  rationale: எபிரெயத்தில் ஒருமை பெயர்கள் பொதுவகைப் பொருளில் வருகின்றன; பொதுவான ஆயுத உற்பத்தியைக் குறிக்க தமிழில் பன்மை இயல்பானது.
