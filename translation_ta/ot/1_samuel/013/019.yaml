translation_notes:
  register: நவீன பொதுத்தமிழில் எளிமையும் கண்ணியமும் பேணப்பட்டுள்ளன. வசனத் தொடக்க וְ தனியாக ‘இப்போது’ என மொழிபெயர்க்கப்படவில்லை; தமிழ் தொடருரையில் அவசியமில்லாத இணைப்புச் சொல் தவிர்க்கப்பட்டது. மூலத்தின் காரண உறவும் பெலிஸ்தியர்களின் தடுப்பு நோக்கமும் தெளிவாக வைக்கப்பட்டுள்ளன.
