base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/013/012.yaml
  text: So I said[a], ‘Now the Philistines will come down against me at Gilgal[b], and I have not sought the favor of Yahweh.’ So I forced myself and offered up the burnt offering.
translation:
  language: ta
  text: அதனால் நான், “இப்போது பெலிஸ்தியர்கள் கில்காலில் எனக்கு எதிராக இறங்கி வருவார்கள்; நானோ யாவேயின் தயவை நாடவில்லை[a]” என்று சொன்னேன். ஆகவே, என்னை நானே வற்புறுத்திக்கொண்டு[b] தகனபலியைச் செலுத்தினேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மொழியில், “யாவேயின் முகத்தை மன்றாடவில்லை” என்பது சொல்லுக்குச் சொல் வடிவம்; இது யாவேயின் தயவை நாடவில்லை என்று பொருள்படும்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “என்னை நானே அடக்கிக்கொண்டேன்.” எபிரெய வினைச்சொல் ஒருவர் தம்மைக் கட்டுப்படுத்துவதையோ தம்மைத் தாமே ஆளுவதையோ குறிக்கலாம்; இங்கு சவுல் தம்மைச் செயல்பட வற்புறுத்திக்கொண்டதாகக் கூறுவது பொருத்தமாகத் தெரிகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֹמַר
  choice: என்று சொல்லிக்கொண்டேன்
  rationale: தொடர்ச்சியைக் குறிக்கும் வாவ் சவுலின் விளக்கத்தை முன்னெடுக்கிறது. இங்கு அவர் தமக்குள் எடுத்த முடிவை விவரிப்பதால், நவீனத் தமிழில் இயல்பாக ‘என்று சொல்லிக்கொண்டேன்’ என வழங்கப்பட்டது.
- source_word: עַתָּה
  choice: இப்போது
  rationale: சவுல் உணர்ந்த அவசரத்தையும் உடனடி சூழலையும் குறிக்கும் நேரவினையடை.
- source_word: יֵרְדוּ ... אֵלַי
  choice: எனக்கு எதிராக இறங்கி வருவார்கள்
  rationale: ירד என்பதன் இறங்குதல் என்ற திசைப் பொருளையும், אֵלַי என்பதன் இச்சூழலுக்குரிய பகைமைப் பொருளையும் காக்கிறது.
- source_word: הַגִּלְגָּל
  choice: கில்காலில்
  rationale: இடப்பெயர் ஒலிபெயர்க்கப்பட்டு, எதிர்பார்க்கப்பட்ட மோதலின் இடத்தைக் குறிக்க ஏழாம் வேற்றுமையில் வழங்கப்பட்டது.
- source_word: וּפְנֵי יְהוָה לֹא חִלִּיתִי
  choice: யாவேயின் தயவை இன்னும் நாடவில்லை
  rationale: ‘முகத்தை மன்றாடுதல்’ என்ற எபிரெய மரபுத்தொடர், ஒருவரின் தயவை நாடுதல் அல்லது அவரிடம் மன்றாடுதல் என்று பொருள்படும். ‘இன்னும்’ என்பது எதிர்பார்க்கப்பட்ட தாக்குதலுக்கு முன் இதைச் செய்யவில்லை என்ற சூழ்நிலைப் பொருளை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: திருப்பெயரான நான்கெழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் அதன் வழக்கமான ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: וָאֶתְאַפַּק
  choice: என்னை நானே வற்புறுத்திக்கொண்டு
  rationale: ஹித்பயேல் வடிவம் தன்னைக் கட்டுப்படுத்துதல் அல்லது மனமில்லாதபோதும் தன்னைச் செயலில் ஈடுபடுத்த வற்புறுத்துதல் ஆகிய பொருட்களைத் தரலாம். சூழலில் சவுல் அழுத்தத்தால் தாம் செயல்பட்டதாக நியாயப்படுத்துவதால் இத்தேர்வு பொருத்தமானது; மாற்றுப் பொருள் அடிக்குறிப்பில் காக்கப்படுகிறது.
- source_word: וָאַעֲלֶה הָעֹלָה
  choice: தகனபலியைச் செலுத்தினேன்
  rationale: עלה உடன் עֹלָה வருவது பலியிடுதலைக் குறிக்கும் வழிபாட்டுச் சொற்றொடர். தமிழில் தெளிவான, வழக்கமான பலிச்சொல்லாக்கம் பயன்படுத்தப்பட்டது.
theological_decisions:
- issue: יְהוָה என்ற திருப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: ஆண்டவர் / யெகோவா
  rationale: மூல உரையில் தனிப்பட்ட திருப்பெயர் நேரடியாக உள்ளது. அதை ஒரு பட்டமாக மாற்றாமல் ‘யாவே’ என்று ஒலிபெயர்ப்பது மூலத்தின் வேறுபாட்டைக் காக்கிறது.
- issue: சவுலின் செயலுக்கான உள்நோக்கத்தை வெளிப்படுத்துதல்
  choice: ‘என்னை நானே வற்புறுத்திக்கொண்டு’ என அவரது சொந்த நியாயப்படுத்தலாக வழங்குதல்
  alternative: ‘என்னை அடக்கிக்கொண்டு’
  rationale: வினைச்சொல்லின் இரு சாத்தியங்களையும் ஏற்றுக்கொண்டு, இச்சூழலில் தன்னைச் செயல்படத் தூண்டியதாக சவுல் கூறும் பொருளை முதன்மைப்படுத்துகிறது; இதனால் அவரது செயலை மொழிபெயர்ப்பு தானாகவே சரி எனத் தீர்ப்பதில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, மரியாதைமிக்க நடையைக் கையாளுகிறது. பலியியல் சொற்களில் பரவலாகப் புரியக்கூடிய ‘தகனபலி’ பயன்படுத்தப்பட்டுள்ளது. ஆங்கில ஆலோசனை உரையில் அடிக்குறிப்பு குறிகள் தவறான சொற்களுடன் இணைந்திருந்ததால், அவை விளக்கும் எபிரெய சொற்றொடர்களான ‘தயவை நாடவில்லை’ மற்றும் ‘வற்புறுத்திக்கொண்டு’ என்பவற்றின் பின்னர் முறையாக வைக்கப்பட்டுள்ளன.
