revisions:
- from: பெலிஸ்தியர்களின் காவற்படை ஒன்று மிக்மாசின் கணவாயை நோக்கிப் புறப்பட்டது.[a]
  to: பெலிஸ்தியரின் காவற்படை ஒன்று மிக்மாசின் கணவாய்க்குச் சென்றது.[a]
  rationale: முக்கிய வாக்கியத்தில் எபிரெயத்தின் எளிய இயக்கக் கருத்தை ‘கணவாய்க்குச் சென்றது’ என நெருக்கமாகக் கொடுக்கப்பட்டுள்ளது. அடிக்குறிப்பு மַצַּב மற்றும் מַעֲבַר ஆகியவற்றின் சொற்பொருள் மாற்றுகளைப் பாதுகாக்கிறது; எந்தச் சிறப்பான நிலவியல் அல்லது இராணுவ விளக்கத்தையும் திணிக்கவில்லை.
