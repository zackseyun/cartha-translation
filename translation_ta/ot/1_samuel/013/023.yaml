  text: And a garrison of the Philistines went out to the pass of Michmash[a].
translation:
  language: ta
  text: பெலிஸ்தியரின் காவற்படை ஒன்று மிக்மாசின் கணவாய்க்குச் சென்றது.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பெலிஸ்தியரின் காவல் நிலையம் ஒன்று மிக்மாசின் கடக்கும் இடத்துக்குச் சென்றது.”
    reason: מַצַּב என்பது நிலைநிறுத்தப்பட்ட படைப்பிரிவையோ காவல் நிலையத்தையோ குறிக்கலாம்; מַעֲבַר என்பது கணவாய் அல்லது கடக்கும் இடம் எனப் பொருள்படலாம்.
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: புறப்பட்டது
  rationale: יצא என்பதன் அடிப்படை வெளியே செல்லும் இயக்கத்தை இயல்பான தமிழ் கதைநடையில் தெரிவிக்கிறது; இராணுவ முன்னேற்றம் என்ற கூடுதல் பொருளைத் திணிக்கவில்லை.
- source_word: מַצַּב
  choice: காவற்படை
  rationale: இராணுவச் சூழலில் நிலைநிறுத்தப்பட்ட படையையோ காவல் நிலையப் படையையோ குறிக்கிறது. ‘காவற்படை’ படையினரைக் குறிக்கும் ஒருமைத் தொகுப்புச்சொல்லாக இயல்பாக உள்ளது; ‘காவல் முகாம்’ என்பதும் சாத்தியம்.
- source_word: פְּלִשְׁתִּים
  choice: பெலிஸ்தியர்கள்
  rationale: இந்த மக்கள் இனத்தின் பெயருக்கான வழக்கமான நவீனத் தமிழ் ஒலிபெயர்ப்பு.
- source_word: אֶל
  choice: நோக்கி
  rationale: திசைநோக்கிய இயக்கத்தைத் தெரிவிக்கிறது; இலக்கை அடைந்ததாக எபிரெய உரை கட்டாயப்படுத்தாததால் ‘நோக்கி’ பொருத்தமானது.
- source_word: מַעֲבַר
  choice: கணவாய்
  rationale: கடந்து செல்லும் இடம் என்ற அடிப்படைப் பொருளுடன், மிக்மாசைச் சுற்றியுள்ள நிலவியல் மற்றும் இராணுவச் சூழலில் மலைகளுக்கிடையிலான குறுகிய பாதையைக் குறிக்க இயல்பான தமிழ் சொல்.
- source_word: מִכְמָשׂ
  choice: மிக்மாஸ்
  rationale: எபிரெய இடப்பெயரின் இறுதி மெய்யொலியையும் நீள உயிரையும் பிரதிபலிக்கும் தமிழ் ஒலிபெயர்ப்பு.
