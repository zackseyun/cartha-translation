source:
  edition: WLC
  text: ו/ייחל שִׁבְעַ֣ת יָמִ֗ים לַ/מּוֹעֵד֙ אֲשֶׁ֣ר שְׁמוּאֵ֔ל וְ/לֹא בָ֥א שְׁמוּאֵ֖ל הַ/גִּלְגָּ֑ל וַ/יָּ֥פֶץ הָ/עָ֖ם מֵ/עָלָֽי/ו׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/013/008.yaml
  text: He waited seven days[a], until the appointed time that Samuel had set, but Samuel did not come to Gilgal[b], and the people were scattering from him.
translation:
  language: ta
  text: சாமுவேல் குறித்திருந்த காலம்வரை அவன் ஏழு நாட்கள் காத்திருந்தான்[a]. ஆனால் சாமுவேல் கில்காலுக்கு வரவில்லை; மக்களோ அவனைவிட்டுச் சிதறிச் சென்றுகொண்டிருந்தனர்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சாமுவேல் நியமித்திருந்த நேரம்வரை.” எபிரெய உறவுநிலைத் தொடர் சுருக்கமாக உள்ளது; அதன் உட்கருத்தைத் தமிழில் வெளிப்படையாகச் சொல்ல வேண்டியுள்ளது.
    reason: lexical_alternative
  - marker: b
    text: அதாவது, மக்கள் சவுலைவிட்டு விலகிச் சென்றுகொண்டிருந்தனர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּיחֶל
  choice: காத்திருந்தான்
  rationale: இங்கு இந்த வினைச்சொல் நம்பிக்கை வைத்திருப்பதை அல்ல, ஒரு குறிப்பிட்ட காலம் முழுவதும் காத்திருப்பதைக் குறிக்கிறது.
- source_word: שִׁבְעַת יָמִים
  choice: ஏழு நாட்கள்
  rationale: காத்திருந்த கால அளவை நேரடியாகக் குறிக்கும் இயல்பான மொழிபெயர்ப்பு.
- source_word: לַמּוֹעֵד אֲשֶׁר שְׁמוּאֵל
  choice: சாமுவேல் குறித்திருந்த காலம்வரை
  rationale: מוֹעֵד என்பது முன்குறிக்கப்பட்ட நேரம் அல்லது காலத்தைக் குறிக்கிறது. எபிரெய உறவுநிலைத் தொடர் சுருக்கமாக இருப்பதால், தமிழில் அதன் உட்கருத்தை இயல்பாக வெளிப்படுத்த ‘குறித்திருந்த’ என வழங்கப்பட்டுள்ளது.
- source_word: וְלֹא בָא שְׁמוּאֵל הַגִּלְגָּל
  choice: ஆனால் சாமுவேல் கில்காலுக்கு வரவில்லை
  rationale: எபிரெய இணைப்புச்சொல் முறையாக ‘மற்றும்’ என்றாலும், எதிர்பார்க்கப்பட்ட வருகை நிகழாததைச் சூழல் எதிர்மறையாகக் காட்டுவதால் ‘ஆனால்’ இயல்பானது.
- source_word: וַיָּפֶץ הָעָם
  choice: மக்களோ ... சிதறிச் சென்றுகொண்டிருந்தனர்
  rationale: மக்கள் சவுலிடமிருந்து படிப்படியாக விலகிச் சென்றுகொண்டிருந்த நிகழ்நிலையைத் தொடர்வினை வடிவம் வெளிப்படுத்துகிறது.
- source_word: מֵעָלָיו
  choice: அவனைவிட்டு
  rationale: பிரதிப்பெயர் பின்னொட்டு சூழலில் சவுலைக் குறிக்கிறது; மூலத்தின் பிரதிப்பெயர் வடிவம் தமிழிலும் பாதுகாக்கப்பட்டுள்ளது.
