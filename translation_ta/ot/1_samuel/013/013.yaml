  - marker: a
    text: அல்லது, “நீ மதியீனமான செயலைச் செய்தாய்.”
    reason: נִסְכָּלְתָּ என்பது முட்டாள்தனமான நடத்தை அல்லது செயலைக் குறிக்கலாம்; மாற்று வாசகம் செயலை நேரடியாக முன்னிறுத்துகிறது.
lexical_decisions:
- source_word: נִסְכָּלְתָּ
  choice: நீ மதியீனமாக நடந்துகொண்டாய்
  rationale: நிஃபால் வடிவம் வெறும் மனநிலையைவிட மதியற்ற நடத்தை அல்லது செயலை மதிப்பிடுகிறது. ‘மதியீனமாக நடந்துகொண்டாய்’ என்பது கண்டனத்தின் வலிமையைத் தக்கவைக்கும் இயல்பான, கண்ணியமான நவீனத் தமிழ்.
- source_word: שָׁמַרְתָּ
  choice: நீ கடைப்பிடிக்கவில்லை
  rationale: שׁמר என்பதன் ‘காத்தல்/கடைப்பிடித்தல்’ என்ற உடன்படிக்கை சார்ந்த பொருளைத் தக்கவைத்து, கட்டளையோடு இயல்பாக இணைகிறது; ‘கீழ்ப்படியவில்லை’ என்பதைக் காட்டிலும் மூலச்சொல்லுக்கு நெருக்கமானது.
- source_word: מִצְוַת
  choice: கட்டளையை
  rationale: ஒரு குறிப்பிட்ட தெய்வீகக் கட்டளையைக் குறிக்கும் ஒருமை வடிவத்தை நேரடியாகக் காட்டுகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரேய நான்கெழுத்துத் திருப்பெயரை ஒரு பட்டப்பெயரால் மாற்றாமல், தனிப்பட்ட தெய்வீகப் பெயராகத் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: אֱלֹהֶיךָ
  choice: உன் கடவுளாகிய
  rationale: இரண்டாம் நபர் ஒருமை உடைமைத் தொடர்பையும், யாவேவுடன் உள்ள விளக்கத் தொடர்பையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: צִוָּךְ
  choice: உனக்குக் கட்டளையிட்ட
  rationale: צוה என்பதன் வழக்கமான ‘கட்டளையிடு’ என்ற பொருளையும் சவுலை நோக்கிய இரண்டாம் நபர் குறிப்பையும் தக்கவைக்கிறது.
- source_word: כִּי עַתָּה
  choice: ஏனெனில், இப்போது
  rationale: முந்தைய கண்டனத்திற்கான விளக்கத்தையும் இழந்துபோன விளைவின் காலக் குறிப்பையும் வெளிப்படுத்துகிறது.
- source_word: הֵכִין
  choice: நிலைநிறுத்தியிருப்பார்
  rationale: הכין என்பதன் உறுதியாக நிறுவுதல் என்ற பொருளைத் தருகிறது. தமிழின் இறந்தகால நிபந்தனைசார் வினை வடிவம், சூழலில் உள்ள நிறைவேறாத எதிர்நிலை விளைவை வெளிப்படுத்துகிறது.
- source_word: מַמְלַכְתְּךָ
  choice: உன் அரசாட்சியை
  rationale: இங்கு சவுலின் ஆட்சியுரிமை மற்றும் அரச வம்சத்தின் தொடர்ச்சியை உள்ளடக்கும் ממלכה என்பதற்கு ‘அரசாட்சி’ இயல்பானது; நிலப்பரப்பை மட்டும் உணர்த்தக்கூடிய ‘ராஜ்யம்’ என்பதைத் தவிர்க்கிறது.
- source_word: אֶל יִשְׂרָאֵל
  choice: இஸ்ரவேலின்மேல்
  rationale: அரசாட்சியை நிறுவும் சூழலில் אֶל குறிக்கும் ஆட்சித் தொடர்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: עַד עוֹלָם
  choice: என்றென்றும்
  rationale: தொடர்ந்து நீடிக்கும் காலத்தைச் சுட்டும் எபிரேய சொற்றொடருக்கான நேரடியான, வழக்கமான தமிழ்.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூல உரை ஒரு பட்டப்பெயரை அல்ல, இஸ்ரவேலுக்குத் தெரிவிக்கப்பட்ட தனிப்பட்ட தெய்வீகப் பெயரையே பயன்படுத்துகிறது; ஆகவே அதைப் பெயராகவே ஒலிபெயர்ப்பது மூலத்தின் வேறுபாட்டைக் காக்கிறது.
- issue: כִּי עַתָּה הֵכִין יְהוָה என்ற கூற்றின் எதிர்நிலைப் பொருள்
  choice: யாவே ... நிலைநிறுத்தியிருப்பார்
  alternative: யாவே ... நிலைநிறுத்தியிருந்தார்
  rationale: சவுலின் கீழ்ப்படியாமையால் இழக்கப்பட்டிருக்கிற விளைவையே உரையாடல் சூழல் சுட்டுகிறது. ‘நிலைநிறுத்தியிருப்பார்’ என்பது அதை நடந்த உண்மையாகக் கூறாமல், நிறைவேறாத எதிர்நிலை விளைவாக வெளிப்படுத்துகிறது; தனியான நிபந்தனை வாக்கியத்தை மூலத்தில் இல்லாமல் சேர்ப்பதையும் தவிர்க்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான தீர்க்கதரிசனக் கண்டன நடையைப் பயன்படுத்துகிறது. ‘மதியீனமாக’ என்பது மூலத்தின் ஒழுக்க மதிப்பீட்டைத் தக்கவைத்தபடியே தேவையற்ற பேச்சுவழக்கு இழிவைத் தவிர்க்கிறது. வாக்கிய அமைப்பு எபிரேய வரிசையை இயன்றவரை பின்பற்றினாலும் தமிழில் இயல்பாக வாசிக்கும்படி அமைக்கப்பட்டுள்ளது.
