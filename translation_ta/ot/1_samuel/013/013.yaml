  yaml_path: translation/ot/1_samuel/013/013.yaml
  text: And Samuel said to Saul[a], “You have acted foolishly. You have not kept the command of Yahweh your God, which he commanded you; for now Yahweh would have established your kingdom over Israel forever.”
translation:
  language: ta
  text: சாமுவேல் சவுலிடம், “நீ முட்டாள்தனமாகச் செயல்பட்டாய்[a]. உன் கடவுளாகிய யாவே உனக்குக் கட்டளையிட்ட கட்டளையை நீ கடைப்பிடிக்கவில்லை. ஏனெனில், இப்போது யாவே இஸ்ரவேலின்மேல் உன் அரசாட்சியை என்றென்றும் நிலைநிறுத்தியிருப்பார்” என்றார்.
  philosophy: optimal-equivalence
