- from: ஆனால் இப்போது உன் அரசாட்சி நிலைத்திருக்காது.[a] யெகோவா தமது இதயத்துக்கு ஏற்ற ஒரு மனிதனைத் தமக்காகத் தேடிக்கொண்டார்; நீ யெகோவா உனக்குக் கட்டளையிட்டதைக் கடைப்பிடிக்காததால், யெகோவா அவனைத் தமது மக்கள்மேல் தலைவனாக நியமித்தார்.[b]
  to: ஆனால் இப்போது உன் அரசாட்சி நிலைத்திருக்காது.[a] யெகோவா தமக்காகத் தமது இதயத்துக்கு ஏற்ற ஒரு மனிதனைத் தேடிக்கொண்டார்; யெகோவா அவனைத் தமது மக்கள்மேல் தலைவனாக நியமித்தார்; ஏனெனில், யெகோவா உனக்குக் கட்டளையிட்டதை நீ கடைப்பிடிக்கவில்லை.[b]
  rationale: 'திருத்தம் பொருளை மாற்றாமல், எபிரெய மூலத்தின் கூற்று வரிசையை மீட்டமைக்கிறது: யெகோவா மனிதனைத் தேடினார், அவனைத் தலைவனாக நியமித்தார், இதற்குக் காரணம் சவுல் கட்டளையைக் கடைப்பிடிக்காததே. காரணவாக்கியத்தில் “நீ” என்பதன் இடம் மாற்றப்பட்டதால் தமிழ் வாக்கியம் இலக்கணரீதியாகவும் நடையியலாகவும் தெளிவடைந்தது.'
