  source_fidelity: 'மூல எபிரெயத்தின் முக்கியக் கூறுகள் காக்கப்பட்டுள்ளன: அரசாட்சி நிலைக்காதிருத்தல், யெகோவா தமக்காகத் தேடிய மனிதன், அவர் மக்கள்மேல் தலைவனாக நியமித்தல், கட்டளையைக் கடைப்பிடிக்காததற்கான காரணம் ஆகியவை துல்லியமாக உள்ளன. ஆனால் காரணவாக்கியம் நியமனக் கூற்றுக்கு உடனடியாகப் பின்வருமாறு மறுவரிசைப்படுத்தப்பட வேண்டும்; இது மூலத்தின் தொடரமைப்பையும் காரணத் தொடர்பையும் தெளிவாகக் காட்டும்.'
  naturalness: “நீ யெகோவா உனக்குக் கட்டளையிட்டதைக் கடைப்பிடிக்காததால்” என்ற சொல்வரிசை நவீனத் தமிழில் இயல்பாக இல்லை; மேலும் அது வினையின் செய்பவரைத் தற்காலிகமாகத் தெளிவிழக்கச் செய்கிறது. “யெகோவா உனக்குக் கட்டளையிட்டதை நீ கடைப்பிடிக்காததால்” என்பது தெளிவான, இயல்பான நடை.
  terminology: “அரசாட்சி,” “தமது இதயத்துக்கு ஏற்ற,” “தலைவன்,” “கடைப்பிடிக்க” ஆகிய தேர்வுகள் சூழலுக்கு ஏற்றவை. “யெகோவா” என்ற தெய்வீகப் பெயர் பயன்பாடு வரைவின் பெயரியல் நடைமுறையோடு ஒத்திருக்கிறது. “தமது மக்கள்” என்பதன் குறிப்பு அடிக்குறிப்பில் சரியாகத் தெளிவுபடுத்தப்பட்டுள்ளது.
