base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/013/014.yaml
  text: But now your kingdom will not endure[a]. Yahweh has sought for himself a man according to his own heart, and Yahweh has appointed him ruler over his people[c][b], because you have not kept what Yahweh commanded you.
translation:
  language: ta
  text: ஆனால் இப்போது உன் அரசாட்சி நிலைத்திருக்காது.[a] யெகோவா தமக்காகத் தமது இதயத்துக்கு ஏற்ற ஒரு மனிதனைத் தேடிக்கொண்டார்; யெகோவா அவனைத் தமது மக்கள்மேல் தலைவனாக நியமித்தார்; ஏனெனில், யெகோவா உனக்குக் கட்டளையிட்டதை நீ கடைப்பிடிக்கவில்லை.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உன் அரசாட்சி நிற்காது.”
    reason: lexical_alternative
  - marker: b
    text: “தமது மக்கள்” என்பது யெகோவாவின் மக்களைக் குறிக்கிறது.
    reason: referent_clarification
lexical_decisions:
- source_word: וְעַתָּה
  choice: ஆனால் இப்போது
  rationale: சவுலின் முந்தைய நிலைக்கும் இப்போது அறிவிக்கப்படும் தீர்ப்புக்கும் இடையிலான கூர்மையான மாற்றத்தைச் சூழலில் வெளிப்படுத்துகிறது.
- source_word: מַמְלַכְתְּךָ לֹא תָקוּם
  choice: உன் அரசாட்சி நிலைத்திருக்காது
  rationale: מַמְלָכָה இங்கு சவுலின் அரசுரிமையையும் அதன் தொடர்ச்சியையும் குறிக்கிறது; קום என்பதன் ‘நிற்றல்’ என்ற அடிப்படைப் பொருள் இச்சூழலில் ‘நிலைத்திருத்தல்’ என்று இயல்பாக அமைகிறது.
- source_word: בִּקֵּשׁ יְהוָה לוֹ
  choice: யெகோவா ... தமக்காகத் தேடிக்கொண்டார்
  rationale: முடிவுற்ற தேடலை வினை வடிவம் சுட்டுகிறது; לוֹ-வின் பயன்நிலைப் பொருளையும் தக்கவைக்கிறது.
- source_word: אִישׁ כִּלְבָבוֹ
  choice: தமது இதயத்துக்கு ஏற்ற ஒரு மனிதனை
  rationale: எபிரெயச் சொற்றொடரின் ‘அவருடைய இதயத்தின்படி’ என்ற உருவகத்தை இயல்பான தமிழில் காக்கிறது; ‘அவருடைய’ என்பது யெகோவாவைக் குறிக்கிறது.
- source_word: וַיְצַוֵּהוּ יְהוָה לְנָגִיד
  choice: யெகோவா அவனை ... தலைவனாக நியமித்தார்
  rationale: צוה பொதுவாக ‘கட்டளையிடுதல்’ என்றாலும், לְנָגִיד உடனான இக்கட்டமைப்பில் அதிகாரப் பொறுப்புக்கு நியமித்தல் அல்லது ஏற்படுத்துதல் என்பதே பொருத்தமானது.
- source_word: עַל עַמּוֹ
  choice: தமது மக்கள்மேல்
  rationale: ஒருமை பின்னொட்டு யெகோவாவையே குறிக்கிறது என்பதை தமிழில் தெளிவாக்குகிறது.
- source_word: לֹא שָׁמַרְתָּ אֵת אֲשֶׁר צִוְּךָ יְהוָה
  choice: நீ யெகோவா உனக்குக் கட்டளையிட்டதைக் கடைப்பிடிக்காததால்
  rationale: שמר என்பதன் கட்டளையைப் பேணுதல் அல்லது கடைப்பிடித்தல் என்ற கருத்தைத் தக்கவைத்து, காரணத்தைக் காட்டும் כִּי-ஐ இயல்பான தமிழ் காரண எச்சத்தால் வெளிப்படுத்துகிறது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: தெய்வீகப் பெயரான tetragrammaton-ஐ பெயராகவே ஒலிபெயர்த்து வழங்குகிறது.
theological_decisions:
- issue: כִּלְבָבוֹ என்பதிலுள்ள பின்னொட்டின் குறிப்பு
  choice: ‘தமது இதயத்துக்கு ஏற்ற’ என்பதில் ‘தமது’ யெகோவாவைக் குறிக்கிறது.
  alternative: அந்தப் பின்னொட்டு தேடப்பட்ட மனிதனைக் குறிக்கிறது எனப் புரிந்துகொள்ளுதல்.
  rationale: உடனடி தொடரமைப்பிலும் கதைச் சூழலிலும் யெகோவாவே இயல்பான முன்னிலைச் சுட்டுப்பொருள். அதேவேளையில், ‘அவருடைய சித்தமெல்லாம் செய்பவன்’ போன்ற பிற்கால விளக்கத்தை வசனத்துக்குள் சேர்க்கவில்லை.
- issue: נָגִיד என்பதன் அதிகாரப் பொருள்
  choice: தலைவன்
  alternative: ஆட்சியாளர்; இளவரசன்
  rationale: மக்கள்மேல் நியமிக்கப்பட்ட அதிகாரத் தலைமையை இது குறிக்கிறது; பிற்கால அரசவம்ச அல்லது மேசியா சார்ந்த தொழில்நுட்பப் பொருளை இங்கு திணிக்காமல் இருக்க ‘தலைவன்’ தேர்ந்தெடுக்கப்பட்டது.
- issue: சவுலின் מַמְלָכָה தொடராததன் அளவு
  choice: ‘அரசாட்சி நிலைத்திருக்காது’ என்று உரையின் பொதுவான அறிவிப்பைத் தக்கவைத்தல்.
  alternative: சவுலின் தனிப்பட்ட ஆட்சி உடனே முடிவடையும் அல்லது அவரது வம்சம் மட்டும் தொடராது என்று வெளிப்படையாக விரித்துரைத்தல்.
  rationale: சூழல் வம்சத் தொடர்ச்சியை நோக்கினாலும், எபிரெய உரை சுருக்கமாகவே உள்ளது; குறிப்பிட்ட விளக்கத்தை மொழிபெயர்ப்பில் கட்டாயப்படுத்தவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. ‘அரசாட்சி,’ ‘இதயத்துக்கு ஏற்ற,’ ‘கடைப்பிடிக்க’ ஆகிய சொற்கள் மூலத்தின் உருவகத்தையும் உடன்படிக்கைச் சார்ந்த கட்டளையைப் பேணும் கருத்தையும் இயல்பாகக் காக்கின்றன.
