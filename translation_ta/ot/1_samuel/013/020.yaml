base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/013/020.yaml
  text: So all Israel went down to the Philistines[a], each man to sharpen his plowshare, his mattock, his axe, and his sickle.
translation:
  language: ta
  text: எனவே, இஸ்ரவேலர் அனைவரும் அவரவர் கலப்பைக்கொழு, மண்வெட்டி, கோடரி, அரிவாள்[a] ஆகியவற்றைக் கூர்தீட்டுவதற்காகப் பெலிஸ்தியர்களிடம் இறங்கிச் சென்றனர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கலப்பைக்கத்தி”; வேறொரு உழவுக் கருவியையும் இது குறிக்கக்கூடும். இதற்கான எபிரெயச் சொல் உறுதியற்றது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרְדוּ
  choice: இறங்கிச் சென்றனர்
  rationale: ירד என்பதன் கீழ்நோக்கிய இயக்கத்தை இயல்பான தமிழ் நடையில் காக்கிறது.
- source_word: כָל יִשְׂרָאֵל
  choice: இஸ்ரவேலர் அனைவரும்
  rationale: எபிரெய மொழியின் கூட்டு மக்களினக் குறிப்பை நவீன தமிழில் இயல்பாகத் தருகிறது.
- source_word: הַפְּלִשְׁתִּים
  choice: பெலிஸ்தியர்களிடம்
  rationale: நிலப்பகுதியையோ உரையில் இல்லாத கொல்லர்களையோ சேர்க்காமல், மக்கள் குழுவையே சென்றடையும் இடமாகக் காட்டுகிறது.
- source_word: לִלְטוֹשׁ
  choice: கூர்தீட்டுவதற்காக
  rationale: இச்சூழலில் உலோகக் கருவிகளுக்குக் கூர்மை ஏற்படுத்துவதைக் தெளிவாகக் குறிக்கிறது.
- source_word: אִישׁ
  choice: அவரவர்
  rationale: கூட்டுப் பொருளைத் தொடர்ந்து வரும் பகிர்வுநிலை ஒருமையை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: מַחֲרַשְׁתּוֹ
  choice: கலப்பைக்கொழு
  rationale: கூர்தீட்டப்படும் உலோக உழவுக் கருவியின் பகுதியைத் துல்லியமாகக் குறிக்கிறது.
- source_word: אֵתוֹ
  choice: மண்வெட்டி
  rationale: மண்ணைத் தோண்டுவதற்கும் கொத்துவதற்கும் பயன்படும் கருவியைக் குறிக்கும் எளிதில் புரியும் தமிழ் இணைச்சொல்.
- source_word: קַרְדֻּמּוֹ
  choice: கோடரி
  rationale: வெட்டுவதற்கான கோடரி போன்ற கருவியைக் குறிக்கும் நேரடியான, பொதுவாகப் புரியும் சொல்.
- source_word: מַחֲרֵשָׁתוֹ
  choice: அரிவாள்
  rationale: இறுதிக் கருவியின் அடையாளம் உறுதியற்றது; கூர்தீட்டப்படும் வேளாண் கருவிகளின் பட்டியலில் ‘அரிவாள்’ பொருத்தமான சாத்தியமான பொருள். உறுதியின்மை அடிக்குறிப்பில் காக்கப்படுகிறது.
