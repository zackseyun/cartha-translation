  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘அவரவர்’ என்பது எபிரெயப் பகிர்வுநிலை ஒருமையை இயல்பாகத் தருகிறது; உரையில் இல்லாத ‘கொல்லர்கள்’ என்ற சொல்லைச் சேர்க்கவில்லை.
