  yaml_path: translation/ot/1_samuel/013/001.yaml
  text: Saul was one year old when he became king[a], and he reigned two years over Israel.
translation:
  language: ta
  text: சவுல் அரசனானபோது ஒரு வயதுடையவராக இருந்தார்[a]; அவர் இஸ்ரவேல்மேல் இரண்டு ஆண்டுகள் ஆட்சி செய்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இங்குள்ள எபிரேய உரை புரிந்துகொள்வதற்குக் கடினமானது; அது உரைநிலையில் குறைபட்டிருக்கலாம். எபிரேயச் சொற்களின் நேரடி அமைப்பு, “சவுல் அரசனாகும்போது ஒரு வயதின் மகன்; அவர் இஸ்ரவேல்மேல் இரண்டு ஆண்டுகள் ஆட்சி செய்தார்” என்பதாகும். சில பழங்காலச் சான்றுகளும் பிற்கால முன்மொழிவுகளும் பெரிய எண்களை வழங்குகின்றன; உதாரணமாக, சவுலின் வயதுக்கு “முப்பது” என்றும், அவரது ஆட்சிக்காலத்துக்கு “நாற்பத்து இரண்டு” என்றும் கூறுகின்றன.
    reason: textual_variant
lexical_decisions:
- source_word: בֶּן שָׁנָה
  choice: ஒரு வயதுடையவராக இருந்தார்
  rationale: எபிரெய மொழிவழக்கு வழக்கமாக ‘ஒரு வயதுடையவர்’ என்று பொருள்படும். வரலாற்றுச் சிக்கல் இருந்தாலும், மசோரா உரையின் எண்ணைத் திருத்தாமல் இயல்பான தமிழில் தருகிறது.
- source_word: שָׁאוּל
  choice: சவுல்
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் நிலைபெற்ற பெயர்வடிவம்.
- source_word: בְּמָלְכוֹ
  choice: அரசனானபோது
  rationale: இந்த வடிவம் அவர் அரசாட்சியை ஏற்ற காலத்தைக் குறிக்கிறது; தமிழில் இயல்பாகவும் தெளிவாகவும் தரப்பட்டுள்ளது.
- source_word: וּשְׁתֵּי שָׁנִים
  choice: இரண்டு ஆண்டுகள்
  rationale: மசோரா உரையில் காணப்படும் ஆட்சிக்கால எண்ணை நேரடியாகப் பாதுகாக்கிறது.
- source_word: מָלַךְ
  choice: ஆட்சி செய்தார்
  rationale: מלך என்பதன் இச்சூழலுக்குரிய இயல்பான தமிழ் பொருள்.
- source_word: עַל יִשְׂרָאֵל
  choice: இஸ்ரவேல்மேல்
  rationale: ஆளுகையின் பொருளைச் சுட்டும் עַל என்பதைக் ‘மேல்’ எனத் தருகிறது.
theological_decisions:
- issue: மசோரா உரையிலுள்ள சிக்கலான அல்லது குறைபட்ட அரசாட்சி வாய்பாடு
  choice: ஊக எண்களைச் சேர்க்காமல் மசோரா உரையின் சொற்களை முதன்மை உரையில் தக்கவைத்தல்
  alternative: சவுல் அரசனானபோது முப்பது வயதுடையவராக இருந்தார்; அவர் இஸ்ரவேல்மேல் நாற்பத்திரண்டு ஆண்டுகள் ஆட்சி செய்தார்
  rationale: கிடைத்துள்ள எபிரெய உரை வரலாற்று மற்றும் உரைநிலைச் சிக்கலை உருவாக்கினாலும், ஆதாரமற்ற ஒத்திசைவு அல்லது ஊகத் திருத்தத்தை முதன்மை உரைக்குள் கொண்டுவராமல், சிக்கலை அடிக்குறிப்பில் வெளிப்படையாகக் குறிப்பிடுவது மூல உரைக்குச் சிறப்பாக உண்மையாயிருக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழ்; எளிதில் புரியும், கண்ணியமான நடை. மசோரா உரையின் இயல்பற்ற எண்கள் முதன்மை உரையில் மாற்றப்படாமல், உரைநிலைச் சிக்கல் அடிக்குறிப்பில் தெளிவுபடுத்தப்பட்டுள்ளது.
