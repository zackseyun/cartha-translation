base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/013/015.yaml
  text: Then Samuel arose and went up from Gilgal to Gibeah of Benjamin[a], and Saul counted the people who were present with him, about six hundred men.
translation:
  language: ta
  text: பின்பு சாமுவேல் எழுந்து, கில்காலிலிருந்து பென்யமீனின் கிபியாவுக்கு[a] மேலே சென்றார். சவுல் தன்னுடன் இருந்த மக்களைக் கணக்கிட்டார்; அவர்கள் ஏறக்குறைய அறுநூறு ஆண்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சில கையெழுத்துச் சாட்சிகளும் பழங்கால மொழிபெயர்ப்புகளும் “பென்யமீனின் கேபாவுக்கு” என்று வாசிக்கின்றன. இங்குள்ள எபிரெய உரை “பென்யமீனின் கிபியாவுக்கு” என்று வாசிக்கிறது.
    reason: textual_variant
lexical_decisions:
- source_word: וַיָּקָם
  choice: எழுந்து
  rationale: קום என்பதன் பொதுவான கதைநடைப் பொருளான ‘எழுதல்’ என்பதைப் பாதுகாக்கிறது; புறப்பட்டுச் சென்றார் என்று மட்டும் பொருளைச் சுருக்கவில்லை.
- source_word: וַיַּעַל
  choice: போனார்
  rationale: עלה என்பதில் ‘மேலே செல்லுதல்’ என்ற திசைநுட்பம் இருக்கலாம். எனினும் நவீன தமிழில் இவ்விடங்களுக்கு இடையிலான பயணத்தை ‘மேலே போனார்’ எனச் சொல்வது செயற்கையாக இருப்பதால், இயல்பான ‘போனார்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: מִן הַגִּלְגָּל
  choice: கில்காலிலிருந்து
  rationale: பயணம் தொடங்கிய இடத்தைக் குறிக்கும் எபிரெய முன்னிடைத் தொடரின் நேரடியான மொழிபெயர்ப்பு.
- source_word: גִּבְעַת בִּנְיָמִן
  choice: பென்யமீனின் கிபியாவுக்கு
  rationale: மசோரெட்டிய எபிரெய உரையின் உயிர்க்குறியீட்டின்படி இடப்பெயர் ‘கிபியா.’ சில சாட்சிகளில் உள்ள ‘கேபா’ அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: וַיִּפְקֹד
  choice: எண்ணிப் பார்த்தார்
  rationale: இராணுவச் சூழலில் פקד என்பது எண்ணுதல் அல்லது படையினரை கணக்கெடுத்தல் என்று பொருள்படும். ‘எண்ணிப் பார்த்தார்’ என்பது மீதமிருந்தவர்களின் எண்ணிக்கையை அறிந்துகொண்ட செயலை இயல்பான தமிழில் தருகிறது.
- source_word: הָעָם
  choice: மக்களை
  rationale: עם என்பதன் பரந்த பொருளான ‘மக்கள்’ என்பதைக் காக்கிறது; சூழல் அவர்களை சவுலின் படையினர் என்று உணர்த்தினாலும் மூலத்தைவிடக் குறுகலாக்கவில்லை.
- source_word: הַנִּמְצְאִים עִמּוֹ
  choice: தன்னுடன் இருந்த
  rationale: מצא என்பதன் நிபால் பங்கேற்பு வடிவம் சொற்பட ‘காணப்பட்டவர்கள்’ என்றாலும், இங்கு உடனிருந்த அல்லது அங்கே மீந்திருந்தவர்களைக் குறிக்கிறது. ‘தன்னுடன் இருந்த’ என்பது இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: כְּשֵׁשׁ מֵאוֹת אִישׁ
  choice: ஏறக்குறைய அறுநூறு ஆண்கள்
  rationale: முன்னொட்டு כ அளவு தோராயமானது என்பதைக் காட்டுவதால் ‘ஏறக்குறைய’ பயன்படுத்தப்பட்டது; אִישׁ இராணுவக் கணக்கீட்டுச் சூழலில் வயது வந்த ஆண்களைக் குறிக்கிறது.
