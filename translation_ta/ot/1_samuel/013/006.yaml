base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/013/006.yaml
  text: When the men of Israel saw that they were in trouble[a], because the people were hard pressed, the people hid themselves in caves, in thickets, among rocks, in strongholds[c][b], and in pits.
translation:
  language: ta
  text: இஸ்ரவேல் ஆண்கள் தாங்கள் நெருக்கடியில் இருப்பதைக் கண்டார்கள்; ஏனெனில் மக்கள் கடுமையாக நெருக்கப்பட்டிருந்தார்கள். மக்கள் குகைகளிலும், முட்புதர்களிலும்[a], பாறைகளின் நடுவிலும், நிலத்தடி அறைகளிலும்[b], குழிகளிலும்[c] ஒளிந்துகொண்டார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “முட்கள் நிறைந்த புதர்களிலும்.” இங்கு வரும் எபிரெயச் சொல் அரிதானது; அது குறிப்பாக முட்செடிகளைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “குழிவான மறைவிடங்களிலும்” அல்லது “அரண்களிலும்.” இதற்கான எபிரெயச் சொல் அரிதும் பொருள் உறுதியற்றதுமாகும்; நிலத்தடி சேமிப்பிடங்கள் அல்லது மறைவறைகளையும் அது குறிக்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, “நீர்த்தொட்டிகளிலும்” அல்லது “கிணறுகளிலும்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִישׁ יִשְׂרָאֵל
  choice: இஸ்ரவேல் ஆண்கள்
  rationale: אִישׁ ஒருமை வடிவில் இருந்தாலும், பன்மை வினைச்சொல்லுடன் இங்கு கூட்டுப்பொருளில் வருகிறது. ஆண்பாலைக் காத்து, தமிழில் இயல்பான கூட்டுப்பெயராக மொழிபெயர்க்கப்பட்டது.
- source_word: רָאוּ
  choice: கண்டபோது
  rationale: அடிப்படைப் பொருளான ‘கண்டார்கள்’ என்பதைக் காக்கிறது; சூழலில் நிலைமையை உணர்ந்ததையும் இயல்பாக உள்ளடக்குகிறது.
- source_word: כִּי צַר לוֹ
  choice: தாங்கள் நெருக்கடியில் இருப்பதையும்
  rationale: கூட்டுப்பொருள் எழுவாயைத் தொடரும் சுருக்கமான எபிரெயக் கட்டமைப்பை இயல்பான தமிழ்ப் பன்மையில் வெளிப்படுத்துகிறது.
- source_word: כִּי נִגַּשׂ הָעָם
  choice: மக்கள் கடுமையாக நெருக்கப்படுவதையும்
  rationale: Niphal வடிவின் அழுத்தப்படுதல் அல்லது ஒடுக்கப்படுதல் என்ற பொருளை, இராணுவ நெருக்கடியின் சூழலுக்கு ஏற்றவாறு தருகிறது. இரண்டாவது כִּי-யை ஒருங்கிணைந்த கண்டறிதலாகப் புரிந்துகொள்ளும் வாய்ப்பைத் தேர்ந்தெடுக்கிறது.
- source_word: וַיִּתְחַבְּאוּ
  choice: ஒளிந்துகொண்டார்கள்
  rationale: Hitpael வடிவின் தன்னிலைப் பொருளை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: בַּמְּעָרוֹת
  choice: குகைகளிலும்
  rationale: מְעָרָה என்பதன் நேரடியான, வழக்கமான பொருள் ‘குகை’.
- source_word: וּבַחֲוָחִים
  choice: முட்புதர்களிலும்
  rationale: அரிதான இச்சொல் முட்செடிகள் அல்லது முட்கள் நிறைந்த புதர்ப்பகுதியைக் குறிப்பதாகப் பொதுவாகப் புரிந்துகொள்ளப்படுகிறது; சொல்லின் அரிதான தன்மை அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
- source_word: וּבַסְּלָעִים
  choice: பாறைகளின் நடுவிலும்
  rationale: סֶלַע பாறை, கற்பாறை அல்லது செங்குத்துப் பாறையைக் குறிக்கலாம்; ஒளிவிடங்களின் பட்டியலில் இத்தேர்வு இயல்பாக உள்ளது.
- source_word: וּבַצְּרִחִים
  choice: நிலத்தடி அறைகளிலும்
  rationale: மிக அரிதும் பொருள் உறுதியற்றதுமான சொல். நிலத்தடி சேமிப்பிடங்கள் அல்லது மறைவறைகள் என்பது சாத்தியமான புரிதல்; மாற்றுப் பொருள்கள் அடிக்குறிப்பில் தரப்படுகின்றன.
- source_word: וּבַבֹּרוֹת
  choice: குழிகளிலும்
  rationale: בּוֹר குழி, நீர்த்தொட்டி அல்லது கிணறு போன்ற தோண்டப்பட்ட இடத்தைக் குறிக்கலாம். சூழலை அளவுக்கு மீறிக் குறிப்பாக்காமல் ‘குழிகள்’ என்ற விரிவான பொருள் தேர்ந்தெடுக்கப்பட்டது.
