  register: நவீன நிலையான தமிழ்; பொதுவாசகருக்கு எளிதில் புரியும், ஆனால் கண்ணியமான வரலாற்று உரைநடை. எபிரெய வாக்கியத்தின் நீண்ட பட்டியல் தமிழில் தெளிவுக்காக இரண்டு வாக்கியங்களாக அமைக்கப்பட்டுள்ளது. இடப்பெயர்கள் ‘பெலிஸ்தியர்கள்’, ‘மிக்மாஸ்’, ‘பெத்-ஆவேன்’ என வழக்கமான தமிழ் ஒலியமைப்பில் தரப்பட்டுள்ளன.
