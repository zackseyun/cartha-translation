base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/013/005.yaml
  text: 'And the Philistines gathered to fight against Israel: thirty thousand chariots[a], and six thousand horsemen, and troops as numerous as the sand that is on the seashore. They went up and camped at Mikmash, east of Beth-aven.'
translation:
  language: ta
  text: 'பெலிஸ்தியர்கள் இஸ்ரவேலுக்கு எதிராகப் போரிட ஒன்றுகூடினார்கள்: முப்பதாயிரம் தேர்களும்[a], ஆறாயிரம் குதிரைவீரர்களும், கடற்கரை மணலைப்போல எண்ணிக்கையில் ஏராளமான படையினரும் இருந்தனர். அவர்கள் மேலே சென்று, பெத்-ஆவேனுக்குக் கிழக்கே உள்ள மிக்மாஸில் முகாமிட்டார்கள்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய உரையில், “முப்பதாயிரம் தேர்கள்” என்று உள்ளது. இந்த எண்ணிக்கை இச்சூழலில் வழக்கத்திற்கு மாறாக மிகப் பெரிதாகத் தோன்றுவதால், சில விளக்கவுரையாளர்களும் சில பழங்கால உரைச் சாட்சிகளும் “மூவாயிரம்” போன்ற குறைந்த எண்ணிக்கையை முன்வைத்துள்ளனர். எனினும், முதன்மை மொழிபெயர்ப்பு மசோரா எபிரெய உரையைப் பின்பற்றுகிறது.
    reason: textual_variant
