base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/013/018.yaml
  text: and one company turned toward the road to Beth-horon[a], and one company turned toward the road of the border that overlooks the Valley of Zeboim[b], toward the wilderness.
translation:
  language: ta
  text: ஒரு படைப்பிரிவு[a] பெத்-ஓரோனுக்குச் செல்லும் சாலையை நோக்கித் திரும்பியது. மற்றொரு படைப்பிரிவு செபோயீம் பள்ளத்தாக்கை மேலிருந்து நோக்கும் எல்லையை ஒட்டிய பாதையை நோக்கி, வனாந்தரத்தை நோக்கித் திரும்பியது.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ஒரு அணி’ அல்லது ‘ஒரு தனிப்படை’ என்றும் மொழிபெயர்க்கலாம்; எபிரெயத்தில் நேரடியாக ‘ஒரு தலை’ என்று உள்ளது.
    reason: lexical_alternative
  - marker: b
    text: ‘செபோயீம்’ என்பது பெரும்பாலும் ஓர் இடப்பெயர்; அதன் அடிப்படையான எபிரெயச் சொல் ‘கழுதைப்புலிகள்’ என்பதோடு தொடர்புடையதாக இருக்கலாம்.
    reason: cultural_note
lexical_decisions:
- source_word: הָרֹאשׁ אֶחָד
  choice: ஒரு படைப்பிரிவு
  rationale: רֹאשׁ என்பதன் நேரடிப் பொருள் ‘தலை.’ ஆனால் இங்குள்ள இராணுவச் சூழலில், முந்தைய வசனத்தில் கூறப்பட்ட கொள்ளையிடும் படையின் ஒரு பிரிவைக் குறிக்கிறது. ‘படைப்பிரிவு’ என்பது அந்தச் சூழற்பொருளைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: יִפְנֶה
  choice: நோக்கித் திரும்பியது
  rationale: פנה என்பது ‘திரும்புதல்’ அல்லது ‘முகங்கொள்ளுதல்’ எனப் பொருள்படும். படையினரின் திசைமாற்றத்தைக் குறிக்கும் இச்சூழலில் ‘நோக்கித் திரும்பியது’ இயல்பான மொழிபெயர்ப்பு.
- source_word: דֶּרֶךְ
  choice: சாலை / பாதை
  rationale: דֶּרֶךְ என்பது வழி, சாலை அல்லது பயணப்பாதையைக் குறிக்கும். பெத்-ஓரோனுடன் ‘சாலை’ என்றும், எல்லையுடன் இணைந்த இடவியல் தொடரில் இயல்புக்காக ‘எல்லைப் பாதை’ என்றும் மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: בֵּית חֹרוֹן
  choice: பெத்-ஓரோன்
  rationale: இடப்பெயர் தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: הַגְּבוּל
  choice: எல்லைப் பாதை
  rationale: גְּבוּל என்பது எல்லை அல்லது எல்லைப்புறத்தைக் குறிக்கிறது. דֶּרֶךְ உடன் இணைத்து, தமிழில் இயல்பாக ‘எல்லைப் பாதை’ என வழங்கப்பட்டுள்ளது.
- source_word: הַנִּשְׁקָף
  choice: மேலிருந்து நோக்கும்
  rationale: שׁקף வினையின் நிபால் வடிவம் ஓர் உயர்ந்த இடத்திலிருந்து கீழேயுள்ள பகுதியை நோக்கியிருக்கும் நிலையைச் சுட்டுகிறது.
- source_word: גֵּי הַצְּבֹעִים
  choice: செபோயீம் பள்ளத்தாக்கு
  rationale: இது இடப்பெயராகச் செயல்படுவதால் செபோயீம் என ஒலிபெயர்க்கப்பட்டுள்ளது; גֵּי என்பது ‘பள்ளத்தாக்கு’ என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: הַמִּדְבָּרָה
  choice: வனாந்தரத்தை நோக்கி
  rationale: מִדְבָּר என்பதிலுள்ள திசைகாட்டும் ־ה பின்னொட்டு, வனாந்தரத்தை நோக்கிய திசையை வெளிப்படுத்துகிறது.
