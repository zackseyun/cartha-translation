translation_notes:
  register: நவீன தரத் தமிழில், இராணுவ இயக்கமும் இடவியல் திசையும் தெளிவாகத் தோன்றும் வகையில் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. மூலத்தின் இடவியல் தொடரில் உள்ள ஓரளவு சிக்கல் தீர்த்துவிடப்படாமல், ‘வனாந்தரத்தை நோக்கி’ என்ற திசைக் கூறு தனியே பாதுகாக்கப்பட்டுள்ளது.
