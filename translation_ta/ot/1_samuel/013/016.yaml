base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/013/016.yaml
  text: Saul and Jonathan his son[a], and the people who were with them, were staying in Geba of Benjamin[b], while the Philistines had encamped at Michmash.
translation:
  language: ta
  text: சவுலும் அவன் மகன் யோனத்தானும், அவர்களுடன் இருந்த மக்களும்[a] பென்யமீனுக்குச் சேர்ந்த கேபாவில்[b] தங்கியிருந்தார்கள்; பெலிஸ்தியரோ மிக்மாஸில் முகாமிட்டிருந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மொழியில், “அவர்களுடன் காணப்பட்ட மக்கள்”; மற்றவர்கள் சிதறிப்போன பின்பும் சவுலுடனும் யோனத்தானுடனும் எஞ்சியிருந்தவர்களை இது குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: இங்குள்ள எபிரெய இடப்பெயர் கேபா; இது கிபியா அல்ல. இந்த நிகழ்வுகளின் சூழலில் இவை ஒன்றோடொன்று தொடர்புடையவையாயினும் வெவ்வேறு இடங்கள்.
    reason: alternative_reading
lexical_decisions:
- source_word: יֹשְׁבִים
  choice: தங்கியிருந்தார்கள்
  rationale: ישׁב என்பதன் இடம்சார்ந்த தொடர்நிலைப் பொருள் இங்கு வெறுமனே ‘உட்கார்ந்திருந்தார்கள்’ என்பதல்ல; ஒரு இடத்தில் தங்கி அல்லது நிலைகொண்டிருந்ததைக் குறிக்கிறது.
- source_word: הַנִּמְצָא עִמָּם
  choice: அவர்களுடன் இருந்த மக்களும்
  rationale: எபிரெயச் சொற்றொடர் சொல்லுக்குச் சொல் ‘அவர்களுடன் காணப்பட்ட மக்கள்’ எனினும், முந்தைய சிதறலுக்குப் பின் அவர்களோடு இன்னும் இருந்தவர்களை இயல்பான தமிழில் இது குறிக்கிறது; நேரடிப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: בְּגֶבַע בִּנְיָמִן
  choice: பென்யமீனுக்குச் சேர்ந்த கேபாவில்
  rationale: மூலப்பெயர் கேபா; இது கிபியா அல்ல. ‘பென்யமீனுக்குச் சேர்ந்த’ என்பது இடத்தின் கோத்திரப் பகுதி தொடர்பை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: חָנוּ
  choice: முகாமிட்டிருந்தார்கள்
  rationale: חנה என்பது படை முகாமிடுதலைக் குறிக்கும் வழக்கமான வினை; முடிந்து நிலைத்திருந்த முகாம் நிலையைத் தமிழ் இறந்தகாலத் தொடர்நிலை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: בְמִכְמָשׂ
  choice: மிக்மாஸில்
  rationale: இடப்பெயர் ஒலிபெயர்க்கப்பட்டு, முகாம் இருந்த இடத்தை ‘-இல்’ வேற்றுமை இயல்பாகக் குறிக்கிறது.
- source_word: וְ
  choice: உம் / பெலிஸ்தியரோ
  rationale: தொடக்க ו தனியாக ‘இப்போது’ என்று மொழிபெயர்க்கப்படவில்லை. பெயர்ச்சொற்களை ‘உம்’ இணைக்கிறது; கடைசி கூறின் எதிர்முகத்தை ‘பெலிஸ்தியரோ’ இயல்பாக வெளிப்படுத்துகிறது.
