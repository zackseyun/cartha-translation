translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, மரியாதைமிக்க நடையைப் பயன்படுத்துகிறது. படைச் சூழலை ‘முகாமிட்டிருந்தார்கள்’ தெளிவாக்குகிறது; மூலத்தில் இல்லாத தொடக்கக் காலக் குறியீடு சேர்க்கப்படவில்லை. ‘கேபா’ மற்றும் ‘மிக்மாஸ்’ ஆகிய இடப்பெயர்கள் எபிரெய வடிவங்களிலிருந்து ஒலிபெயர்க்கப்பட்டுள்ளன.
