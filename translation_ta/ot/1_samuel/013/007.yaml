base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/013/007.yaml
  text: And Hebrews crossed over the Jordan into the land of Gad and Gilead[a]. But Saul was still at Gilgal[b], and all the people trembled behind him.
translation:
  language: ta
  text: எபிரெயர்கள்[a] யோர்தானைக் கடந்து காத் மற்றும் கீலேயாத் நாட்டிற்குச் சென்றார்கள். ஆனால் சவுல் இன்னும் கில்காலில் இருந்தான்; மக்கள் அனைவரும் அவனுக்குப் பின்னால்[b] நடுங்கினார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘எபிரெயர்கள்’ என்பதற்குப் பதிலாக ‘இஸ்ரவேலர்கள்’ என்றும் மொழிபெயர்க்கலாம். எபிரெய மூலத்தில் ‘எபிரெயர்கள்’ என்றே உள்ளது; இக்கதைச் சூழலில் அது இன அடையாளத்தைச் சிறப்பாகச் சுட்டும் பெயராக இருக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘அவனைப் பின்பற்றி’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: עִבְרִים
  choice: எபிரெயர்கள்
  rationale: இச்சொல் நேரடியாக ‘எபிரெயர்கள்’ எனப் பொருள்படும். இங்கு அது இஸ்ரவேலர்களைக் குறிக்கும் வேறொரு அடையாளச் சொல்லாகவோ, அவர்களில் ஒரு பிரிவைக் குறிக்கும் சொல்லாகவோ இருக்கலாம்; மூலத்தின் தெளிவின்மையைப் பாதுகாக்க இவ்வடிவம் தேர்ந்தெடுக்கப்பட்டது.
- source_word: עָבְרוּ אֶת הַיַּרְדֵּן
  choice: யோர்தானைக் கடந்து
  rationale: עבר என்ற வினை யோர்தானைக் கடந்து மறுகரைக்குச் சென்ற இயக்கத்தைக் குறிக்கிறது; தமிழில் ‘யோர்தானைக் கடந்து’ என்பது இயல்பாகவும் திசைநுட்பத்தைப் பாதுகாப்பதாகவும் உள்ளது.
- source_word: אֶרֶץ גָּד וְגִלְעָד
  choice: காத் மற்றும் கீலேயாத் நாட்டிற்கு
  rationale: אֶרֶץ என்பது இங்கு நிலம் அல்லது பிரதேசத்தைக் குறிக்கிறது. யோர்தானுக்கு அப்பாலுள்ள இலக்கிடத்தைத் தமிழில் இயல்பாகக் காட்ட ‘நாட்டிற்கு’ பயன்படுத்தப்பட்டது.
- source_word: עוֹדֶנּוּ
  choice: இன்னும் ... இருந்தான்
  rationale: இது ஒரு நிலையில் தொடர்ந்து இருப்பதைக் குறிக்கிறது. தமிழில் எழுவாயுடன் பொருந்துமாறு ‘இன்னும் ... இருந்தான்’ என வழங்கப்பட்டது.
- source_word: בַגִּלְגָּל
  choice: கில்காலிலேயே
  rationale: சவுல் அங்கேயே தொடர்ந்து இருந்ததை இடப்பொருளுடன் இயல்பாகவும் வலியுறுத்தலுடனும் தெரிவிக்கிறது.
- source_word: חָרְדוּ
  choice: நடுங்கிக்கொண்டிருந்தார்கள்
  rationale: இந்த வினை அச்சத்தால் உடல் நடுங்கும் வலுவான படிமத்தைக் கொண்டது; வெறுமனே ‘பயந்தார்கள்’ என்பதைவிட மூலத்தின் உயிரோட்டத்தை இது பாதுகாக்கிறது.
- source_word: אַחֲרָיו
  choice: அவனுக்குப் பின்னால்
  rationale: אחריו என்பதன் இடஞ்சார்ந்த ‘அவனுக்குப் பின்னால்’ என்ற படிமத்தை முதன்மை உரை பாதுகாக்கிறது; சூழலில் இது அவனைப் பின்பற்றியதையும் குறிக்கலாம்.
