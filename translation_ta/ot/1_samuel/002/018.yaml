  text: Samuel was ministering before Yahweh[a], a boy clothed with a linen ephod.
translation:
  language: ta
  text: சிறுவனான சாமுவேல் நார்த் துணியாலான ஏபோத்தை அணிந்திருந்தபடி, யாவேயின் முன்னிலையில்[a] பணிவிடை செய்துவந்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், ‘யாவேயின் முகத்தின் முன்பாக,’ அதாவது ‘யாவேயின் சமுகத்தில்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/שְׁמוּאֵל
  choice: சாமுவேல்
  rationale: வாவ் இணைப்புச் சொல் இங்கு முந்தைய நிகழ்வுடன் வசனத்தை இணைக்கிறது; தமிழில் தனியாக ‘மேலும்’ என்று தொடங்காமல் இயல்பான கதைநடையால் அந்தத் தொடர்பு வெளிப்படுகிறது.
- source_word: מְשָׁרֵת
  choice: பணிவிடை செய்துவந்தான்
  rationale: எபிரெயப் பங்கேற்புவினை தொடர்ந்து நடைபெற்ற செயலைக் குறிக்கிறது. ‘செய்துவந்தான்’ அந்த நீடித்த தன்மையையும், ‘பணிவிடை’ வழிபாட்டுச் சூழலிலுள்ள சேவையையும் இயல்பாகத் தெரிவிக்கிறது.
- source_word: אֶת פְּנֵי יְהוָה
  choice: யாவேயின் முன்னிலையில்
  rationale: ‘முகம்/சமுகத்திற்கு முன்பாக’ என்ற எபிரெய மரபுத்தொடர், யாவேயின் பிரசன்னத்தில் பணியாற்றுவதைச் சுட்டுகிறது. ‘முன்னிலையில்’ என்பது தெளிவான நவீனத் தமிழ்; நேரடிப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: נַעַר
  choice: சிறுவனான
  rationale: சாமுவேலின் இளவயதைத் தெளிவாகக் காட்டுகிறது; மூலத்தில் இல்லாத பணியாள் என்ற பொருளைச் சேர்ப்பதில்லை.
- source_word: חָגוּר
  choice: அணிந்துகொண்டு
  rationale: சொல்லுக்கு நேரடியாக ‘இடுப்பில் கட்டியிருந்த’ என்ற கருத்து இருந்தாலும், குறிப்பிட்ட ஆடையை உடுத்தியிருந்த நிலையை நவீனத் தமிழில் இயல்பாகக் கூறுகிறது.
- source_word: אֵפוֹד
  choice: ஏபோத்
  rationale: இது இஸ்ரவேலரின் வழிபாட்டுடன் தொடர்புடைய தனிப்பட்ட ஆடை; துல்லியமான தமிழ் இணைச்சொல் இல்லாததால் ஒலிபெயர்ப்பு பொருத்தமானது.
- source_word: בָּד
  choice: நார்ப்பட்டுத் துணியாலான
  rationale: ஆசாரிய ஆடைச் சூழலில் இச்சொல் linen துணியைக் குறிக்கிறது. ‘நார்ப்பட்டுத் துணி’ அதன் பொருளை சாதாரண வாசகருக்குத் தெளிவாக்குகிறது; மூலத்தில் இல்லாத ‘மெல்லிய’ அல்லது ‘உயர்தரமான’ என்ற நுணுக்கம் சேர்க்கப்படவில்லை.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலவசனத்தில் நான்கெழுத்து இறைப் பெயர் நேரடியாக உள்ளது. பொதுப்பட்டத்தால் மாற்றாமல், உடன்படிக்கையின் தனிப்பெயரைத் தமிழில் ஒலிபெயர்த்துப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியும் ஆனால் வழிபாட்டு நிகழ்வுக்கேற்ற கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் பங்கேற்புவினைகளில் உள்ள தொடர்நிலையை ‘அணிந்துகொண்டு’ மற்றும் ‘செய்துவந்தான்’ என்பவை வெளிப்படுத்துகின்றன; தமிழ் வாக்கிய ஓட்டத்திற்காக சாமுவேலின் இளவயதும் ஆடையும் முதலில் வைக்கப்பட்டுள்ளன.
