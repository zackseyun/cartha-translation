revisions:
- from: சிறுவனான சாமுவேல் நார்ப்பட்டுத் துணியாலான ஏபோத்தை அணிந்துகொண்டு, யாவேயின் முன்னிலையில்[a] பணிவிடை செய்துவந்தான்.
  to: சிறுவனான சாமுவேல் நார்த் துணியாலான ஏபோத்தை அணிந்திருந்தபடி, யாவேயின் முன்னிலையில்[a] பணிவிடை செய்துவந்தான்.
  rationale: The revision preserves the Hebrew participial, ongoing sense of Samuel’s service while rendering חָגוּר as a state of being clothed/girded rather than an action of dressing. It also uses idiomatic modern Tamil for linen and smooths the literal footnote phrasing without altering its content.
