base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/021.yaml
  text: For Yahweh visited Hannah[a], and she conceived and bore three sons and two daughters[b]. And the boy Samuel grew before Yahweh.
translation:
  language: ta
  text: ஏனெனில், யாவே அன்னாவின்மேல் கரிசனை காட்டினார்[a]; அவள் கருவுற்று மூன்று மகன்களையும் இரண்டு மகள்களையும் பெற்றெடுத்தாள். சிறுவன் சாமுவேல் யாவேவோடு வளர்ந்தான்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘யாவே அன்னாவை நினைவுகூர்ந்தார்,’ ‘அன்னாவைக் கவனித்தார்,’ அல்லது ‘அன்னாவுக்கு அருளுடன் உதவினார்’ என்றும் மொழிபெயர்க்கலாம். இங்குள்ள எபிரேய வினைச்சொல், ஒருவருக்குச் சாதகமாக இறைவன் தலையிட்டதைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: சொல்லர்த்தமாக, ‘யாவேவோடு.’ இச்சூழலில், சாமுவேல் திருவிடத்தில் யாவேயின் சந்நிதியில் வளர்ந்தான் என்பது இதன் பொருளாக இருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய கூற்றுக்கான விளக்கத்தையோ காரணத்தையோ அறிமுகப்படுத்தும் எபிரேய இணைப்புச் சொல்லின் வலிமையைத் தக்கவைக்கிறது.
- source_word: פָקַד
  choice: கவனித்தார்
  rationale: இங்கு அன்னாவுக்குச் சாதகமாக யாவே தலையிட்டதைக் குறிக்கிறது. ‘கவனித்தார்’ என்பது அக்கறையுடன் செயல்பட்டார் என்ற பொருளைத் தருகிறது; ‘ஆசீர்வதித்தார்’ என்று விளைவை மட்டும் கூறி மூலச்சொல்லை மிகையாக விளக்குவதில்லை.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைப்பட்டத்தால் மாற்றாமல், எபிரேய மூலத்தில் உள்ள தனிப்பெயரை ஒலிபெயர்க்கிறது.
- source_word: וַתַּהַר וַתֵּלֶד
  choice: அவள் கருவுற்று… பெற்றெடுத்தாள்
  rationale: கருத்தரித்தல் மற்றும் பிள்ளைகளைப் பெற்றெடுத்தல் என்ற இரு தொடர்ச்சியான செயல்களையும் இயல்பான நவீனத் தமிழில் தெளிவாகக் கூறுகிறது.
- source_word: שְׁלֹשָׁה בָנִים וּשְׁתֵּי בָנוֹת
  choice: மூன்று மகன்களையும் இரண்டு மகள்களையும்
  rationale: எண்ணிக்கையையும் குடும்ப உறவுச் சொற்களையும் நேரடியாகத் தக்கவைக்கிறது.
- source_word: הַנַּעַר שְׁמוּאֵל
  choice: சிறுவன் சாமுவேல்
  rationale: נַעַר என்பதன் வயதுசார் பொருளையும் எபிரேயப் பெயரிணை அமைப்பையும் இயல்பான தமிழில் தருகிறது.
- source_word: וַיִּגְדַּל
  choice: வளர்ந்தான்
  rationale: இச்சூழலில் உடல் மற்றும் வாழ்க்கை முதிர்ச்சியைக் குறிக்கும் எளிய, நேரடியான இணைச்சொல்.
- source_word: עִם יְהוָה
  choice: யாவேவோடு
  rationale: עִם என்பதன் அடிப்படைப் பொருளான ‘உடன்/ஓடு’ என்பதைத் தக்கவைத்து, அதை அமைதியாக ‘சந்நிதியில்’ என்று மாற்றுவதால் மறைந்துபோகக்கூடிய மூலமொழியின் உறவுசார் நுட்பத்தையும் தெளிவின்மையையும் பாதுகாக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரின் மொழியாக்கம்
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூல உரை இறைவனின் தனிப்பெயரையே பயன்படுத்துவதால், ஒரு பட்டத்தைப் பதிலீடு செய்யாமல் அந்தப் பெயரை ஒலிபெயர்க்கிறது.
- issue: עִם יְהוָה என்பதன் பொருள்
  choice: யாவேவோடு
  alternative: யாவேயின் சந்நிதியில்
  rationale: ஆலயச் சூழலில் ‘யாவேயின் சந்நிதியில்’ என்பது உத்தேசிக்கப்பட்ட பொருளாக இருக்கலாம். எனினும், எபிரேய உரை ‘யாவேவோடு’ என்று கூறுவதால், அதன் உண்மையான தெளிவின்மையையும் உறவுசார் வலிமையையும் முதன்மை உரையில் தக்கவைத்து, சூழல்சார் விளக்கத்தை அடிக்குறிப்பில் தருகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையும் கதைநடைத் தெளிவும் கொண்ட மொழி பயன்படுத்தப்பட்டுள்ளது. ‘யாவே’ என்ற தனிப்பெயரும் ‘யாவேவோடு’ என்ற மூலத்திற்கு நெருக்கமான சொல்லாட்சியும் திட்டமிட்டு வைக்கப்பட்டுள்ளன; இரண்டாவது சொல்லாட்சியின் சூழல்சார் பொருள் அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது.
