source:
  edition: WLC
  text: וְ/אִ֗ישׁ לֹֽא אַכְרִ֤ית לְ/ךָ֙ מֵ/עִ֣ם מִזְבְּחִ֔/י לְ/כַלּ֥וֹת אֶת עֵינֶ֖י/ךָ וְ/לַ/אֲדִ֣יב אֶת נַפְשֶׁ֑/ךָ וְ/כָל מַרְבִּ֥ית בֵּיתְ/ךָ֖ יָמ֥וּתוּ אֲנָשִֽׁים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/033.yaml
  text: But I will not cut off every man of yours from beside my altar[a], to make your eyes fail and your soul grieve; and all the increase of your house will die by the sword of men.
translation:
  language: ta
  text: ஆயினும், உனக்குரிய ஆண்கள் அனைவரையும் என் பலிபீடத்தருகிலிருந்து நான் முற்றிலும் அகற்றிவிட மாட்டேன்; உன் கண்கள் சோர்ந்துபோகவும் உன் உள்ளம் துயருறவும் அப்படிச் செய்வேன். உன் குடும்பத்தின் பெருக்கம் முழுவதும் மனிதர்களாக இறப்பார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொல்லாட்சிப்படி, “மனிதர்களாக இறப்பார்கள்” என்று உள்ளது. இது “ஆண்மைப் பருவத்தில்,” அல்லது “வாழ்வின் உச்சப் பருவத்தில், இறப்பார்கள்” என்றும் பொருள்படலாம்.
    reason: יָמֻתוּ אֲנָשִׁים என்ற சுருக்கமான எபிரெயச் சொற்றொடரின் சொல்லாட்சி வடிவத்தையும் அதன் சாத்தியமான மொழிவழக்குப் பொருளையும் பாதுகாக்கிறது.
lexical_decisions:
- source_word: וְאִישׁ לֹא אַכְרִית לְךָ
  choice: உனக்குரிய ஆண்கள் அனைவரையும் ... முற்றிலும் அகற்றிவிட மாட்டேன்
  rationale: இங்கு אִישׁ, எதிர்மறை வினையுடன் சேர்ந்து, ஏலியின் ஆண் சந்ததியினர் ஒவ்வொருவரும் முற்றாக நீக்கப்பட மாட்டார்கள் என்ற பகிர்வுப் பொருளைத் தருகிறது. כרת என்பதன் ‘வெட்டிப்போடு/அழி/அகற்று’ என்ற பரப்பில், பலிபீடத்திலிருந்து நீக்கப்படுதல் என்ற சூழலுக்கு ‘அகற்றிவிட’ இயல்பாகப் பொருந்துகிறது.
- source_word: מֵעִם מִזְבְּחִי
  choice: என் பலிபீடத்தின் அருகிலிருந்து
  rationale: מֵעִם என்பது வெறுமனே ‘இருந்து’ என்பதைக் காட்டிலும் ‘அருகிலிருந்து/பக்கத்திலிருந்து’ என்ற நெருக்கத்தை உணர்த்துகிறது.
- source_word: לְכַלּוֹת אֶת־עֵינֶיךָ
  choice: உன் கண்கள் மங்கிப்போகவும்
  rationale: சொல்லாட்சிப்படி ‘உன் கண்களைத் தீர்த்துப்போட’ என்ற உருவகம், நீடித்த துயரத்தால் பார்வை மங்குதல் அல்லது கண்கள் சோர்தல் என்ற பொருளைத் தருகிறது; தமிழில் உருவகத்தை இயல்பாக வைத்திருக்க ‘மங்கிப்போக’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: וְלַאֲדִיב אֶת־נַפְשֶׁךָ
  choice: உன் உள்ளம் துயரத்தில் வாடவும்
  rationale: அரிய வினை வேதனை, துயரம், வாட்டம் ஆகியவற்றைக் குறிக்கிறது. נֶפֶשׁ இங்கு முழு நபரின் அக வாழ்வைச் சுட்டுவதால் ‘உள்ளம்’ என்பது இயல்பான தமிழ் இணை.
- source_word: וְכָל־מַרְבִּית בֵּיתְךָ
  choice: உன் குடும்பத்தில் பெருகும் அனைவரும்
  rationale: מַרְבִּית என்பதன் அடிப்படைப் பொருள் ‘பெருக்கம்’; இங்கு அது குடும்பத்தின் தொடரும் சந்ததியினரைக் குறிக்கிறது. ‘பெருகும் அனைவரும்’ என்ற வடிவம் உருவகத்தையும் நபர்களைக் குறிக்கும் சூழலையும் இணைக்கிறது.
- source_word: יָמוּתוּ אֲנָשִׁים
  choice: ஆண்களாக இருக்கும்போதே இறப்பார்கள்
  rationale: எபிரெயச் சொற்றொடர் சுருக்கமானதும் தெளிவற்றதுமாக ‘ஆண்களாக இறப்பார்கள்’ என்று உள்ளது. அது முதுமைக்கு முன், ஆண்மைப் பருவத்தில் இறப்பதை உணர்த்தக்கூடும். மூலத்தில் இல்லாத ‘வாளால்’ என்பதைச் சேர்க்காமல், அந்தத் தெளிவின்மையை அடிக்குறிப்பில் காக்கும் வகையில் இவ்வாறு மொழிபெயர்க்கப்பட்டது.
theological_decisions:
- issue: ஏலியின் ஆசாரியக் குடும்பத்தின்மீது வரும் தீர்ப்பின் தன்மை
  choice: அவனுடைய ஆண் சந்ததியினர் அனைவரும் பலிபீடத்தருகிலிருந்து முற்றாக அகற்றப்பட மாட்டார்கள்; எஞ்சியிருப்பவர்களின் நிலையே நீடித்த துயரத்திற்குக் காரணமாகும்.
  alternative: அவனுடைய குடும்பம் உடனடியாகவும் முற்றிலுமாகவும் ஆசாரியப் பணியிலிருந்து நீக்கப்படும்.
  rationale: ‘அனைவரையும் ... அகற்றிவிட மாட்டேன்’ என்ற எதிர்மறை அமைப்பும் அதனைத் தொடரும் நோக்கம்/விளைவு கூறுகளும், முற்றழிவுக்கு மாறாக தீர்ப்பின் கீழ் எஞ்சியிருப்பவர்களைச் சுட்டுகின்றன. இதற்கு மேல் பின்னைய கோட்பாட்டு முடிவு எதுவும் சேர்க்கப்படவில்லை.
- issue: יָמוּתוּ אֲנָשִׁים என்பதன் பொருள்
  choice: ஆண்களாக இருக்கும்போதே இறப்பார்கள்
  alternative: வாழ்வின் முதிராத பருவத்தில் இறப்பார்கள்; அல்லது சொல்லாட்சிப்படி, ‘மனிதர்களாக இறப்பார்கள்’.
  rationale: אֲנָשִׁים என்பதில் ‘ஆண்கள்/மனிதர்கள்’ என்ற நேரடிப் பொருளும், முழு ஆண்மைப் பருவத்தில் அல்லது வாழ்வின் உச்சத்தில் இறத்தல் என்ற மொழிவழக்குப் பொருளும் சாத்தியம். ‘வாளால்’ என்பது எபிரெய மூலத்தில் வெளிப்படையாக இல்லாததால் சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீன பொதுத்தமிழில், மரியாதையும் தீர்க்கதரிசனத் தீர்ப்பின் கனமும் காக்கப்பட்டுள்ளன. ‘ஆன்மா’ போன்ற தொழில்நுட்பத் தோற்றமுள்ள சொல்லுக்கு பதில் சூழலுக்கேற்ற ‘உள்ளம்’ பயன்படுத்தப்பட்டது. மூலத்தில் இல்லாத ‘வாளால்’ என்ற கருத்து சேர்க்கப்படவில்லை; அடிக்குறி அது விளக்கும் இறுதிச் சொற்றொடரிலேயே வைக்கப்பட்டது.
