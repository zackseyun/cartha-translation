source:
  edition: WLC
  text: וַ/תִּתְפַּלֵּ֤ל חַנָּה֙ וַ/תֹּאמַ֔ר עָלַ֤ץ לִבִּ/י֙ בַּֽ/יהוָ֔ה רָ֥מָה קַרְנִ֖/י בַּֽ/יהוָ֑ה רָ֤חַב פִּ/י֙ עַל א֣וֹיְבַ֔/י כִּ֥י שָׂמַ֖חְתִּי בִּ/ישׁוּעָתֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/001.yaml
  text: 'And Hannah prayed and said: “My heart exults in Yahweh[a]; my horn is lifted high in Yahweh. My mouth is opened wide against my enemies[c][b], because I rejoice in your salvation.”'
translation:
  language: ta
  text: 'அன்னாள் ஜெபித்து இப்படிச் சொன்னாள்:

    “யாவேயில் என் இதயம் களிகூருகிறது;

    யாவேயில் என் கொம்பு உயர்ந்திருக்கிறது.[a]

    என் பகைவர்களுக்கு எதிராக

    என் வாய் அகலத் திறந்திருக்கிறது.[b]

    ஏனெனில், உமது மீட்பில் நான் மகிழ்கிறேன்.[c]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘கொம்பு’ என்பது வலிமை, கண்ணியம் அல்லது உயர்ந்த நிலையைக் குறிக்கும் எபிரெய உருவகம்.
    reason: cultural_note
  - marker: b
    text: அல்லது, ‘என் பகைவர்களுக்கு மேலாக என் வாய் பெருமிதம் பேசுகிறது’ / ‘என் பகைவர்களுக்கு எதிராக நான் துணிவுடன் பேசுகிறேன்.’ எபிரெய மொழியில் சொற்பொருளாக, ‘என் வாய் என் பகைவர்களுக்கு எதிராக அகலத் திறந்திருக்கிறது’ என்று உள்ளது.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, ‘உமது இரட்சிப்பில்’ / ‘உமது விடுவிப்பில்.’ எபிரெயச் சொல் பரந்த பொருளில் இரட்சிப்பையோ துன்பத்திலிருந்து கிடைக்கும் குறிப்பிட்ட விடுவிப்பையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּתְפַּלֵּל
  choice: ஜெபித்து
  rationale: פלל என்பதன் ஹித்பஅேல் வடிவம் பொதுவாக ‘ஜெபி’ என்று பொருள்படும். தொடர்ந்து வருவது கவிதைநயமிக்க துதியாக இருந்தாலும், கதைசொல்லி அதை ஜெபமாகவே அறிமுகப்படுத்துகிறார்.
- source_word: וַתֹּאמַר
  choice: இப்படிச் சொன்னாள்
  rationale: எபிரெயச் சொல் பொதுவான ‘சொல்’ என்ற வினைச்சொல்; ‘பாடினாள்’ என்று மொழிபெயர்ப்பது மூலத்தில் இல்லாத குறிப்பைச் சேர்க்கும். தமிழில் மேற்கோளை இயல்பாக அறிமுகப்படுத்த ‘இப்படிச்’ சேர்க்கப்பட்டுள்ளது.
- source_word: עָלַץ לִבִּי
  choice: என் இதயம் களிகூருகிறது
  rationale: עלץ மிகுந்த, வெற்றிக்களிப்புள்ள மகிழ்ச்சியைக் குறிக்கிறது. ‘களிகூருகிறது’ கவிதை வலிமையையும் இதயத்தை எழுவாயாகக் கொண்ட மூல உருவகத்தையும் காக்கிறது.
- source_word: בַּיהוָה
  choice: யாவேயில்
  rationale: ב என்ற முன்னொட்டு இங்கு மகிழ்ச்சிக்கும் உயர்வுக்கும் உரிய தளம் அல்லது ஆதாரத்தைச் சுட்டுகிறது. ‘யாவேயில்’ அதை விளக்கி விரிவாக்காமல் சுருக்கமாகக் காக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இது இஸ்ரவேலின் தேவனுடைய தனிப்பெயரைக் குறிக்கும் நான்கெழுத்துப் பெயர். பட்டப்பெயரால் மாற்றாமல் ‘யாவே’ என ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: רָמָה קַרְנִי
  choice: என் கொம்பு உயர்ந்திருக்கிறது
  rationale: ‘கொம்பு’ வலிமை, கண்ணியம் அல்லது உயர்ந்த நிலையைக் குறிக்கும் எபிரெய உருவகம். அதை ‘வலிமை’ என்று விளக்கிப் பதிலிடாமல் மூலக் கவித்துவப் படிமம் காக்கப்பட்டுள்ளது.
- source_word: רָחַב פִּי עַל אֹיְבַי
  choice: என் பகைவர்களுக்கு எதிராக என் வாய் அகலத் திறந்திருக்கிறது
  rationale: வாய் அகலத் திறப்பதாகக் கூறும் மூல உடல்-உருவகம் துணிவான வெற்றிப் பேச்சைக் குறிக்கிறது. அதன் பொருளை மட்டும் கொடுக்காமல் படிமமும் பாதுகாக்கப்பட்டுள்ளது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: அன்னாளின் துணிவான களிப்புக்கான காரணத்தை அறிமுகப்படுத்தும் காரண இணைப்பாக இங்கு வருகிறது.
- source_word: שָׂמַחְתִּי
  choice: நான் மகிழ்கிறேன்
  rationale: முற்றுவினை வடிவம் கவிதைச் சூழலில் நிகழ்காலத்தில் தொடரும் விளைவு அல்லது நிலையாகத் தமிழில் இயல்பாக வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: בִּישׁוּעָתֶךָ
  choice: உமது மீட்பில்
  rationale: ישועה பரந்த பொருளில் இரட்சிப்பையும் குறிப்பிட்ட துன்பத்திலிருந்து விடுவிப்பையும் குறிக்கலாம். ‘மீட்பு’ இவ்விரு பரிமாணங்களையும் தமிழில் ஓரளவு திறந்தவையாக வைத்திருக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூல வசனம் இறைவனுடைய தனிப்பெயரை நேரடியாகப் பயன்படுத்துகிறது. அதை ஒரு பட்டப்பெயராக மாற்றாமல் ஒலிபெயர்ப்பது மூலத்தின் பெயரிடலைப் பாதுகாக்கிறது.
- issue: בִּישׁוּעָתֶךָ என்பதன் பொருள் வரம்பு
  choice: உமது மீட்பில்
  alternative: உமது இரட்சிப்பில் / உமது விடுவிப்பில்
  rationale: இந்தச் சொல் பரந்த இறையியல் பொருளுள்ள இரட்சிப்பையோ சூழ்நிலை சார்ந்த உறுதியான விடுவிப்பையோ குறிக்க முடியும். முதன்மை உரையில் ‘மீட்பு’ தேர்ந்தெடுக்கப்பட்டு, மாற்றுப் பொருட்கள் அடிக்குறிப்பில் தரப்பட்டுள்ளன.
translation_notes:
  register: நவீன தரத் தமிழில், சாதாரண வாசகருக்குப் புரியும் வகையிலும் ஜெபக் கவிதைக்குரிய கண்ணியத்துடனும் வடிவமைக்கப்பட்டுள்ளது. ‘இதயம்,’ ‘கொம்பு,’ ‘வாய் அகலத் திறத்தல்’ ஆகிய மூலக் கவித்துவப் படிமங்கள் பாதுகாக்கப்பட்டுள்ளன; அவற்றின் பொருள் அடிக்குறிப்புகளில் தெளிவாக்கப்பட்டுள்ளது. இறைப்பெயர் ‘யாவே’ என ஒலிபெயர்க்கப்பட்டுள்ளது.
