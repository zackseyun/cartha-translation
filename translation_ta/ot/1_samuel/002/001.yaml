  source_fidelity: மூல எபிரெய உரையின் வினைத் தொடக்கம், கவிதை அமைப்பு, இருமுறை வரும் “யாவேயில்,” ‘கொம்பு’ மற்றும் ‘வாய் அகலத் திறத்தல்’ ஆகிய படிமங்கள், காரண இணைப்பு, மற்றும் ישועה என்பதன் திறந்த பொருள் வரம்பு ஆகியவை துல்லியமாகக் காக்கப்பட்டுள்ளன. שָׂמַחְתִּי-யின் நிகழ்காலத் தமிழ் வடிவம் கவிதைச் சூழலில் இயல்பான விளைவுநிலையாக ஏற்கத்தக்கது.
