source:
  edition: WLC
  text: וַ/יָּבֹ֥א אִישׁ אֱלֹהִ֖ים אֶל עֵלִ֑י וַ/יֹּ֣אמֶר אֵלָ֗י/ו כֹּ֚ה אָמַ֣ר יְהוָ֔ה הֲ/נִגְלֹ֤ה נִגְלֵ֨יתִי֙ אֶל בֵּ֣ית אָבִ֔י/ךָ בִּֽ/הְיוֹתָ֥/ם בְּ/מִצְרַ֖יִם לְ/בֵ֥ית פַּרְעֹֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/027.yaml
  text: 'And a man of God came to Eli and said to him, “Thus says the LORD: Did I indeed reveal myself to your father''s house when they were in Egypt, belonging to Pharaoh''s house?”'
translation:
  language: ta
  text: 'இறைவனுடைய மனிதர் ஒருவர் ஏலியிடம் வந்து, அவரிடம், “ஆண்டவர் இவ்வாறு கூறுகிறார்: ‘உன் தந்தையின் குடும்பம் எகிப்தில் பார்வோனின் வீட்டைச் சேர்ந்தவர்களாக இருந்தபோது, நான் உண்மையாகவே அவர்களுக்கு என்னை வெளிப்படுத்தவில்லையா?’” என்றார்.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִישׁ אֱלֹהִים
  choice: இறைவனுடைய மனிதர்
  rationale: தீர்க்கதரிசன அதிகாரத்துடன் வரும் நபரைக் குறிக்கும் எபிரேய மரபுச் சொல்லை இயன்றவரை இயல்பான தமிழில் வைத்துள்ளது.
- source_word: יְהוָה
  choice: ஆண்டவர்
  rationale: தெய்வீகப் பெயரைக் குறிக்கும் வழக்கமான மரியாதைமிக்க தமிழ் வேதாகமப் பயன்பாடு.
- source_word: בֵּית אָבִיךָ
  choice: உன் மூதாதையின் குடும்பத்தார்
  rationale: இங்கு ‘தந்தையின் வீடு’ என்பது தனிப்பட்ட தந்தையை மட்டும் அல்லாமல் ஆரோனிய மூதாதைக் குடும்பத்தைச் சுட்டுவதால், தமிழில் பொருள் தெளிவாக வெளிப்படுத்தப்பட்டது.
- source_word: לְבֵית פַּרְעֹה
  choice: பார்வோனின் வீட்டாருக்கு உட்பட்டிருந்தபோது
  rationale: לְ என்பதன் உறவு துல்லியமாகத் தெளிவில்லாதது; பார்வோனின் ஆட்சிக்குட்பட்ட சேவை/சார்பு நிலையைக் காட்டும் இயல்பான தமிழ் வடிவம் தேர்ந்தெடுக்கப்பட்டது.
theological_decisions:
- issue: הֲנִגְלֹה נִגְלֵיתִי என்ற வலியுறுத்தப்பட்ட வினாவின் தன்மை
  choice: நான் உண்மையாகவே அவர்களுக்கு என்னை வெளிப்படுத்தவில்லையா?
  alternative: நான் நிச்சயமாக அவர்களுக்கு என்னை வெளிப்படுத்தினேன் அல்லவா?
  rationale: இரட்டிக்கப்பட்ட வினைச்சொல்லின் வலியுறுத்தலையும், பதிலை எதிர்பார்க்கும் கேள்வி வடிவத்தையும் காக்கிறது; அதை வெறும் அறிவிப்பாக மாற்றவில்லை.
- issue: ‘மூதாதையின் குடும்பம்’ யாரைக் குறிக்கிறது
  choice: பெயரிடாமல் மூதாதைக் குடும்பம் என்றே வைத்தல்
  alternative: ஆரோனின் குடும்பம்
  rationale: சூழலில் ஆரோனின் குடும்பம் சுட்டப்பட்டாலும், மூல வசனம் பெயரை வெளிப்படையாகக் கூறாததால் அதை உரைக்குள் சேர்க்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழ்; மரியாதைமிக்க தீர்க்கதரிசன உரைநடை. மூலத்தின் கேள்வி வடிவமும் வலியுறுத்தலும் காக்கப்பட்டுள்ளன; கடைசி சொற்றொடரின் உறவு இயல்பான தமிழில் சார்பு/அதிகாரத்திற்குட்பட்ட நிலையாக மொழிபெயர்க்கப்பட்டுள்ளது.
