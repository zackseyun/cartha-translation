    rationale: זְרוֹעַ literally denotes an arm, not a hand. Since the note exists to preserve the lexical alternative, it needs to state ‘புயம்’ accurately.
  - severity: low
    issue: ‘உன் தந்தையின் வீட்டாரின் வலிமை’ is somewhat cumbersome.
    rationale: ‘உன் தந்தையின் குடும்பத்தின் வலிமை’ more naturally expresses ‘the strength of your father’s house’ while retaining its family-line sense.
