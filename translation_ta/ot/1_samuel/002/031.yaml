  text: הִנֵּה֙ יָמִ֣ים בָּאִ֔ים וְ/גָֽדַעְתִּי֙ אֶת זְרֹ֣עֲ/ךָ֔ וְ/אֶת זְרֹ֖עַ בֵּ֣ית אָבִ֑י/ךָ מִֽ/הְי֥וֹת זָקֵ֖ן בְּ/בֵיתֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/031.yaml
  text: Look[a], days are coming when I will cut off your strength and the strength of your father's house, so that there will not be an old man in your house.
translation:
  language: ta
  text: “இதோ, நாட்கள் வருகின்றன; அப்போது உன் வலிமையையும் உன் தந்தையின் குடும்பத்தின் வலிமையையும்[a] நான் ஒழித்துவிடுவேன்; அதனால் உன் குடும்பத்தில் முதியவர் ஒருவரும் இருக்கமாட்டார்.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லுக்குச் சொல், “உன் புயம்… உன் தந்தையின் குடும்பத்தின் புயம்.” இங்கு “புயம்” என்பது வலிமை அல்லது அதிகாரத்தைக் குறிக்கும் எபிரெய உருவகம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: இதோ
  rationale: வரவிருக்கும் தீர்ப்பை ஆழ்ந்த கவனத்துடன் அறிமுகப்படுத்தும் தீர்க்கதரிசன அறிவிப்பின் சுட்டும் வலிமையை இயல்பான நவீன தமிழில் தக்கவைக்கிறது.
- source_word: יָמִים בָּאִים
  choice: நாட்கள் வருகின்றன
  rationale: வரவிருக்கும் நிகழ்வை அறிவிக்கும் எபிரெயத் தீர்க்கதரிசனச் சூத்திரத்தை நேரடியாகவும் இயல்பாகவும் தருகிறது.
- source_word: גָדַעְתִּי
  choice: நான் ஒழித்துவிடுவேன்
  rationale: மூல வினை வெட்டிப்போடுதல் அல்லது துண்டித்தல் என்பதைக் குறிக்கிறது; ‘வலிமை’ என்பதுடன் தமிழில் இயல்பாக இணைந்து, அதிகாரமும் குடும்பத் தொடர்ச்சியும் தீர்மானமாக அகற்றப்படுவதை ‘ஒழித்துவிடுவேன்’ தெரிவிக்கிறது.
- source_word: זְרֹעֲךָ
  choice: உன் வலிமை
  rationale: சொல்லுக்குச் சொல் பொருள் ‘உன் கை’; இங்கு கை என்பது ஆற்றல் அல்லது அதிகாரத்தைக் குறிக்கும் எபிரெய உருவகம். அதன் சூழற்பொருளை நவீன தமிழில் தெளிவாகத் தருகிறது.
- source_word: זְרֹעַ בֵּית אָבִיךָ
  choice: உன் தந்தையின் வீட்டாரின் வலிமை
  rationale: இணையான இரண்டாவது உருவகமும் ஏலியின் தந்தைவழிக் குடும்பத்தின் ஆற்றலையும் தொடர்ச்சியையும் குறிக்கிறது. ‘வீட்டார்’ என்பது குடும்பக் குழுவைக் குறிக்கும் மூல மரபுத்தொடரின் நயத்தைத் தக்கவைக்கிறது.
- source_word: מֵהְיוֹת זָקֵן בְּבֵיתֶךָ
  choice: அதனால் உன் குடும்பத்தில் முதியவர் ஒருவரும் இருக்கமாட்டார்
  rationale: வலிமை ஒழிக்கப்படுவதால் ஏற்படும் விளைவைத் தமிழில் வெளிப்படையாகவும் இயல்பாகவும் தருகிறது; இங்கு ‘வீடு’ கட்டடத்தை அல்ல, குடும்பத்தைச் சுட்டுகிறது.
- source_word: זָקֵן
  choice: முதியவர்
  rationale: இங்கு பதவியாகிய மூப்பரை அல்ல, முதிர்ந்த வயதை அடைந்த ஒருவரைக் குறிக்கிறது; ‘முதியவர்’ மரியாதையானதும் பாலினத்தைத் தேவையின்றி மிகைப்படுத்தாததும் ஆகும்.
theological_decisions:
- issue: தீர்ப்புரையில் ‘கை’ என்ற உருவகத்தின் பொருள்
  choice: இரண்டு இடங்களிலும் ‘கை’ என்பதன் சூழற்பொருளை ‘வலிமை’ என்று மொழிபெயர்த்தல்
  alternative: இரண்டு இடங்களிலும் சொல்லுக்குச் சொல் ‘கை’ என்று மொழிபெயர்த்தல்
  rationale: எபிரெயத்தில் ‘கை’ ஆற்றல் அல்லது அதிகாரத்தின் பொதுவான உருவகம். ஏலியின் குடும்பத்துக்கு எதிரான இந்தத் தீர்ப்புரையில் அதிகாரமும் நீடித்த உயிர்வாழ்வும் அகற்றப்படுவதே கருத்து; அடுத்த கூற்று குடும்பத்தில் முதியவர் இருக்கமாட்டார் என்று இதைத் தெளிவுபடுத்துகிறது. அடிக்குறிப்பு மூல உருவகத்தைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், தீர்க்கதரிசன அறிவிப்புக்கேற்ற கண்ணியமான தொனி பயன்படுத்தப்பட்டுள்ளது. ‘வீட்டார்/குடும்பம்’ என்ற சொற்கள் בַּיִת என்பதன் குடும்ப அல்லது வம்சச் சார்ந்த பொருளை இயல்பாக வெளிப்படுத்துகின்றன; ‘முதியவர்’ என்பது பதவியைக் காட்டாமல் வயதைச் சுட்டுகிறது.
