  to: “உறைவிடத்திற்காக[b] நான் கட்டளையிட்ட என் பலியையும் என் காணிக்கையையும் நீங்கள் ஏன் அவமதிக்கிறீர்கள்?[a] என் மக்களான இஸ்ரவேலின் ஒவ்வொரு காணிக்கையின் முதற்பங்கிலிருந்தும் உங்களை நீங்களே கொழுக்கச் செய்துகொண்டு[c], என்னைவிட உன் மகன்களுக்கு அதிக மதிப்பளிக்கிறாய்?”
