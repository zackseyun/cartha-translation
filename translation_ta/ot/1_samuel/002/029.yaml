  text: לָ֣/מָּה תִבְעֲט֗וּ בְּ/זִבְחִ/י֙ וּ/בְ/מִנְחָתִ֔/י אֲשֶׁ֥ר צִוִּ֖יתִי מָע֑וֹן וַ/תְּכַבֵּ֤ד אֶת בָּנֶ֨י/ךָ֙ מִמֶּ֔/נִּי לְ/הַבְרִֽיאֲ/כֶ֗ם מֵ/רֵאשִׁ֛ית כָּל מִנְחַ֥ת יִשְׂרָאֵ֖ל לְ/עַמִּֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/029.yaml
  text: Why do you scorn my sacrifice and my offering[a], which I commanded for the dwelling, and honor your sons above me, fattening yourselves from the first of every offering of Israel[c][b], my people?
translation:
  language: ta
  text: “உறைவிடத்திற்காக[b] நான் கட்டளையிட்ட என் பலியையும் என் காணிக்கையையும் நீங்கள் ஏன் அவமதிக்கிறீர்கள்?[a] என் மக்களான இஸ்ரவேலின் ஒவ்வொரு காணிக்கையின் முதற்பங்கிலிருந்தும் உங்களை நீங்களே கொழுக்கச் செய்துகொண்டு[c], என்னைவிட உன் மகன்களுக்கு அதிக மதிப்பளிக்கிறாய்?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அவமதிக்கிறீர்கள்’ என்பதற்கான எபிரெய வினைச்சொல் சொல்லர்த்தமாக ‘உதைத்துத் தள்ளுகிறீர்கள்’ என்ற வலுவான படிமத்தைக் கொண்டது; ‘இகழ்ச்சியுடன் நடத்துகிறீர்கள்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: 'எபிரெயம்: ‘உறைவிடத்திற்காக/உறைவிடத்தில் நான் கட்டளையிட்ட.’ ‘உறைவிடம்’ என்பது கடவுளின் பரிசுத்த இடத்தைக் குறிக்கலாம்.'
    reason: alternative_reading
  - marker: c
    text: அல்லது, ‘என் மக்களான இஸ்ரவேலின் ஒவ்வொரு காணிக்கையிலிருந்தும் மிகச் சிறந்த பகுதியை உண்டு, உங்களை நீங்களே கொழுக்கச் செய்துகொண்டு.’
    reason: lexical_alternative
lexical_decisions:
- source_word: תִבְעֲטוּ
  choice: அவமதிக்கிறீர்கள்
  rationale: இந்த வினைச்சொல் சொல்லர்த்தமாக ‘உதைத்துத் தள்ளுதல்’ என்ற வலுவான படிமத்தைக் கொண்டிருந்தாலும், இங்கு கடவுள் கட்டளையிட்ட பலிகளைக் contempt-ஆக நடத்துவதைக் குறிக்கிறது. இயல்பான தமிழில் குற்றச்சாட்டின் பொருளை ‘அவமதிக்கிறீர்கள்’ தெளிவாகத் தருகிறது; மூலப் படிமம் அடிக்குறிப்பில் காக்கப்படுகிறது.
- source_word: זִבְחִי
  choice: என் பலி
  rationale: விலங்கை அறுத்துச் செலுத்தும் பலியைக் குறிக்கக்கூடிய சொல்லாக இருந்தாலும், இச்சூழலில் ‘என் பலி’ இயல்பாகவும் போதிய துல்லியத்துடனும் உள்ளது.
- source_word: מִנְחָתִי
  choice: என் காணிக்கை
  rationale: מִנְחָה தானியக் காணிக்கையைச் சிறப்பாகக் குறிக்கலாம்; ஆனால் זֶבַח உடன் இணைந்துள்ள இவ்விடத்தில் காணிக்கையைப் பொதுவாகக் குறிக்கும் வாய்ப்பைத் திறந்துவைக்க ‘காணிக்கை’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: אֲשֶׁר צִוִּיתִי מָעוֹן
  choice: உறைவிடத்திற்காக நான் கட்டளையிட்ட
  rationale: מָעוֹן இங்கு வழிபாட்டிடம் அல்லது பரிசுத்த இடமாகிய கடவுளின் உறைவிடத்தைக் குறிக்கலாம். எபிரெயச் சொற்றொடரின் சுருக்கத்தையும் இடைச்சொல் சார்ந்த தெளிவின்மையையும் முற்றிலும் தீர்த்துவிடாமல் இயல்பான தமிழில் இவ்வாறு தரப்படுகிறது.
- source_word: וַתְּכַבֵּד
  choice: அதிக மதிப்பளிக்கிறாய்
  rationale: כבד இங்கு ‘கனம் அளித்தல்’ என்பதிலிருந்து ‘மதிப்பளித்தல்/கனப்படுத்துதல்’ என்ற பொருளைக் கொண்டது. מִמֶּנִּי உடன் வரும் ஒப்பீட்டைத் தமிழில் தெளிவாக்க ‘என்னைவிட ... அதிக மதிப்பளிக்கிறாய்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: מִמֶּנִּי
  choice: என்னைவிட
  rationale: ஏலி கடவுளைவிடத் தன் மகன்களுக்கு மேலான மதிப்பளித்தான் என்ற ஒப்பீட்டை நேரடியாகவும் இயல்பாகவும் காட்டுகிறது.
- source_word: לְהַבְרִיאֲכֶם
  choice: உங்களைக் கொழுக்கச் செய்துகொண்டு
  rationale: பலிகளின் பகுதிகளைத் தவறாக உண்டு நன்கு கொழுத்ததைக் குறிக்கும் குற்றஞ்சாட்டும் உடல்சார்ந்த படிமத்தை மென்மைப்படுத்தாமல் காக்கிறது. பன்மை பின்னொட்டும் பிரதிபலிப்பு பொருளும் தமிழில் வெளிப்படுத்தப்பட்டுள்ளன.
- source_word: מֵרֵאשִׁית
  choice: முதற்பங்கிலிருந்து
  rationale: רֵאשִׁית என்பது ‘முதல்’ என்றும், நீட்சியாக ‘சிறந்த/தேர்ந்த பகுதி’ என்றும் பொருள்படலாம். ‘முதற்பங்கு’ மூலத்திற்கு நெருக்கமாக இருந்து பலிக்குரிய பங்கையும் சுட்டுகிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: כָּל מִנְחַת יִשְׂרָאֵל
  choice: இஸ்ரவேலின் ஒவ்வொரு காணிக்கை
  rationale: இங்கு מִנְחָה காணிக்கைகளைப் பொதுவாகக் குறிக்க வாய்ப்புள்ளதால், ‘ஒவ்வொரு காணிக்கை’ எனப் பரந்த பொருளில் மொழிபெயர்க்கப்பட்டது.
- source_word: לְעַמִּי
  choice: என் மக்களான
  rationale: ‘இஸ்ரவேல்’ யார் என்பதை இணைநிலையில் அடையாளப்படுத்தும் இயல்பான தமிழ் வடிவம்; எபிரெய லְ-இன் உறவு இங்கு சூழல்படி இவ்வாறு வெளிப்படுகிறது.
theological_decisions:
- issue: ஏலியையும் அவன் வீட்டாரையும் நோக்கிய குற்றச்சாட்டின் இலக்கண எண் மாற்றம்
  choice: முதல் கேள்வியில் பன்மையான ‘நீங்கள்’ என்பதையும், பின்னர் ஏலியை நேரடியாகக் குறிக்கும் ஒருமையான ‘உன்/மதிப்பளிக்கிறாய்’ என்பதையும் காத்தல்
  alternative: வசனம் முழுவதையும் ஏலியை மட்டும் நோக்கிய ஒருமையாகவோ, ஏலியின் வீட்டார் அனைவரையும் நோக்கிய பன்மையாகவோ ஒரேப்படுத்துதல்
  rationale: எபிரெய உரை தִבְעֲטוּ என்ற பன்மையிலிருந்து וַתְּכַבֵּד மற்றும் בָּנֶיךָ என்ற ஒருமைக்கு மாறுகிறது. இந்த மாற்றம் முதலில் விரிந்த குற்றச்சாட்டையும் பின்னர் ஏலியின் தனிப்பட்ட பொறுப்பையும் முன்வைக்கலாம்; அதை மொழிபெயர்ப்பு சமப்படுத்தவில்லை.
- issue: பலிகளிலிருந்து பெற்ற ‘முதற்பங்கு’ என்பதன் பொருள்
  choice: ‘முதற்பங்கு’ என மூலச் சொல்லுக்கு நெருக்கமாக வைத்தல்
  alternative: ‘மிகச் சிறந்த பங்கு’ அல்லது ‘தேர்ந்தெடுக்கப்பட்ட பங்கு’
  rationale: רֵאשִׁית ‘முதல்’ என்றும் ‘சிறந்தது’ என்றும் கொள்ளப்படலாம். பிரதான உரை முதல்/முதன்மை என்ற சொல்லமைப்பைக் காக்கிறது; சூழலுக்குப் பொருந்தும் ‘சிறந்த பங்கு’ என்ற வாய்ப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: ஏலியின் குற்றத்தில் அவன் பங்குபற்றிய விதம்
  choice: அவன் தன் மகன்களுக்குக் கடவுளைவிட அதிக மதிப்பளித்து, காணிக்கைகளின் பயனைத் தானும் தன் வீட்டாரும் அனுபவித்ததாக உரையின் குற்றச்சாட்டை நேரடியாகக் காட்டுதல்
  alternative: ஏலி மகன்களின் செயல்களைத் தடுக்கத் தவறியவன் மட்டுமே என்று குற்றச்சாட்டைக் குறைத்தல்
  rationale: ‘உங்களைக் கொழுக்கச் செய்துகொண்டு’ என்ற பன்மை வடிவம் தவறான பலனைப் பகிர்ந்துகொண்டதைக் குற்றச்சாட்டின் பகுதியாக்குகிறது. அதற்கு அப்பாற்பட்ட கோட்பாட்டுத் தீர்ப்புகள் சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீனத் தரத்தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளும் வகையிலும் கண்டனத்தின் கண்ணியமான தீவிரம் குறையாத வகையிலும் அமைக்கப்பட்டது. ‘நீங்கள்’ என்ற பன்மையிலிருந்து ‘உன்/மதிப்பளிக்கிறாய்’ என்ற ஒருமைக்கு மாறும் மூல இலக்கண அமைப்பு திட்டமிட்டு காக்கப்பட்டது. பலி தொடர்பான சொற்களில் மிகத் தொழில்நுட்பமான வழிபாட்டுச் சொற்கள் தவிர்க்கப்பட்டாலும், ‘பலி’, ‘காணிக்கை’, ‘முதற்பங்கு’ ஆகிய தெளிவான வேதாகமச் சொற்கள் பயன்படுத்தப்பட்டன.
