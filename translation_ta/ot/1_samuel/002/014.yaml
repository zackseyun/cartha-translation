- from: அவன் அதை ஒரு பெரிய பாத்திரத்திலோ[a], பானையிலோ, கொப்பரையிலோ, சமையல் சட்டியிலோ குத்துவான்; முள்கரண்டி மேலே கொண்டுவருவதையெல்லாம் ஆசாரியன் அதைக் கொண்டு எடுத்துக்கொள்வான். சீலோவுக்கு அங்கே வந்த இஸ்ரவேலர் அனைவருக்கும் அவர்கள் இப்படியே செய்தார்கள்.[b]
