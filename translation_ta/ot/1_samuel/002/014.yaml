  yaml_path: translation/ot/1_samuel/002/014.yaml
  text: and he would thrust it into the basin[a], or the pot, or the kettle, or the cooking pan; all that the fork brought up, the priest would take with it[b]. Thus they did to all Israel who came there to Shiloh.
translation:
  language: ta
  text: அவன் அதை ஒரு கலத்திலோ[a], பானையிலோ, கொப்பரையிலோ, சமையல் சட்டியிலோ குத்துவான்; முள்கரண்டி மேலே கொண்டுவருவதையெல்லாம் ஆசாரியன் அதைக் கொண்டு எடுத்துக்கொள்வான். சீலோவுக்கு வந்த இஸ்ரவேலர் அனைவருக்கும் அவர்கள் இப்படியே செய்தார்கள்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இங்கு வரும் எபிரெயச் சொற்கள் பலவகைச் சமையல் பாத்திரங்களைப் பட்டியலிடுகின்றன; அவற்றுக்கிடையேயான துல்லியமான வேறுபாடுகள் உறுதியாகத் தெரியவில்லை.
    reason: cultural_note
  - marker: b
    text: எபிரெய உரை முதலில் ‘ஆசாரியன்’ என்று ஒருமையில் கூறி, பின்னர் ‘அவர்கள்’ என்று பன்மைக்கு மாறுகிறது.
    reason: textual_clarity
lexical_decisions:
- source_word: וְהִכָּה
  choice: குத்துவான்
  rationale: இங்கு נכה என்பதன் ஹிப்இல் வடிவம் பாத்திரத்திற்குள் கருவியைச் செலுத்திக் குத்தும் வழக்கமான செயலைக் குறிக்கிறது; தொடர்ச்சியாக நடந்த செயலைத் தமிழ் வினைமுற்று இயல்பாக வெளிப்படுத்துகிறது.
- source_word: בַכִּיּוֹר
  choice: ஒரு பெரிய பாத்திரத்தில்
  rationale: כִּיּוֹר என்பது அகன்ற பாத்திரம் அல்லது தொட்டியைக் குறிக்கலாம்; பலியிறைச்சி சமைக்கும் சூழலில் அளவையும் பொதுவான பாத்திரத் தன்மையையும் தெரிவிக்கும் வகையில் இவ்வாறு மொழிபெயர்க்கப்பட்டது.
- source_word: בַדּוּד
  choice: பானையில்
  rationale: דּוּד என்பது சமைப்பதற்கான பானை அல்லது கொப்பரையைக் குறிக்கும்; நவீன தமிழில் தெளிவான பொதுச் சொல் தேர்ந்தெடுக்கப்பட்டது.
- source_word: בַקַּלַּחַת
  choice: கொப்பரையில்
  rationale: குறிப்பிட்ட பாத்திர வகை உறுதியற்றபோதிலும், பட்டியலிலுள்ள வேறுபாட்டைப் பேண பெரிய சமையல் பாத்திரத்தைக் குறிக்கும் சொல்லாக ‘கொப்பரை’ பயன்படுத்தப்பட்டது.
- source_word: בַפָּרוּר
  choice: சமையல் சட்டியில்
  rationale: פָּרוּר என்பதன் துல்லியமான வடிவம் உறுதியில்லை; அது சமைப்பதற்கான வேறொரு பாத்திரம் என்பதை இயல்பாகத் தெரிவிக்கிறது.
- source_word: כֹּל אֲשֶׁר יַעֲלֶה הַמַּזְלֵג
  choice: முள்கரண்டி மேலே கொண்டுவருவதையெல்லாம்
  rationale: עלה என்பதன் ‘மேலே வருதல்’ என்ற உருவகத்தைப் பேணி, கருவியில் சிக்கி மேலே எடுக்கப்பட்ட இறைச்சியைக் குறிக்கும் இயல்பான தமிழாக்கம்.
- source_word: הַמַּזְלֵג
  choice: முள்கரண்டி
  rationale: முந்தைய வசனத்தில் இது மூன்று முனைகளுள்ள கருவி என விளக்கப்படுவதால், இங்கு புரிந்துகொள்ள எளிதான ‘முள்கரண்டி’ போதுமானது.
- source_word: יִקַּח הַכֹּהֵן בּוֹ
  choice: ஆசாரியன் அதைக் கொண்டு எடுத்துக்கொள்வான்
  rationale: בּוֹ கருவியாகிய முள்கரண்டியைக் குறிப்பதாக இயல்பாகப் புரிகிறது; தமிழ் வாக்கியத்தில் கருவிப் பொருள் தெளிவாகக் காட்டப்பட்டது.
- source_word: כָּכָה יַעֲשׂוּ
  choice: அவர்கள் இப்படியே செய்தார்கள்
  rationale: எபிரெயப் பன்மையைப் பேணி, இது ஆசாரிய வீட்டாரின் அல்லது ஊழியர்களின் வழக்கமான நடைமுறை என்பதை இயல்பாகத் தெரிவிக்கிறது.
- source_word: לְכָל יִשְׂרָאֵל הַבָּאִים שָׁם בְּשִׁלֹה
  choice: சீலோவுக்கு அங்கே வந்த இஸ்ரவேலர் அனைவருக்கும்
  rationale: ‘இஸ்ரவேல் முழுவதும்’ என்ற கூட்டுப் பொருளை இயல்பான தமிழில் மக்களைக் குறிக்கும் வகையில் அளிக்கிறது; שָׁם என்பதையும் ‘அங்கே’ என்று வெளிப்படையாகப் பேணுகிறது.
theological_decisions:
- issue: செயலைச் செய்பவரின் எண்ணிக்கையில் ஏற்படும் மாற்றம்
  choice: முக்கிய செயலில் ‘ஆசாரியன்’ என்ற ஒருமையையும், சுருக்கக் கூற்றில் ‘அவர்கள்’ என்ற பன்மையையும் பேணுதல்
  alternative: முழுவதையும் ‘ஆசாரியன் செய்தான்’ என்ற ஒருமையாக ஒருமைப்படுத்துதல்
  rationale: எபிரெய உரை ஆசாரியன் எடுத்துக்கொள்வதை ஒருமையில் கூறி, பரந்த நடைமுறையைப் பன்மையில் சுருக்குகிறது. இந்த மாற்றத்தைப் பேணுவது உரையின் கதைநடையையும் பொறுப்பின் பரப்பையும் தீர்மானித்து விடாமல் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்கள் புரிந்துகொள்ளும் கண்ணியமான நடையில் அமைக்கப்பட்டது. பாத்திரங்களின் பெயர்களில் உள்ள மூலமொழி நிச்சயமின்மை அடிக்குறிப்பில் தெரிவிக்கப்பட்டுள்ளது; ஒருமை–பன்மை மாற்றம் திட்டமிட்டு பேணப்பட்டுள்ளது.
