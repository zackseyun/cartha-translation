base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/020.yaml
  text: And Eli would bless Elkanah and his wife and say[b][a], “May Yahweh give you offspring by this woman in place of the petition that was asked for Yahweh.” Then they would go to his place.
translation:
  language: ta
  text: ஏலி எல்க்கானாவையும் அவனுடைய மனைவியையும் ஆசீர்வதித்து, “இந்தப் பெண்ணின் மூலம் யாவே உனக்குச் சந்ததியைத் தருவாராக; யாவேயிடம் கேட்கப்பட்ட வேண்டுதலுக்குப் பதிலாகத் தருவாராக” என்று கூறுவார்.[a][b] பின்னர் அவர்கள் அவனுடைய இடத்திற்குச் செல்வார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “கேட்கப்பட்ட வேண்டுதல்” என்பதற்கான எபிரெயச் சொல், “கேட்பது” மற்றும் “கடனாகக் கொடுப்பது” தொடர்பான சொல்லாடலை எதிரொலிக்கிறது. சாமுவேலின் பிறப்புக் கதையில் இந்தச் சொல்லாடல் மீண்டும் மீண்டும் வருகிறது; யாவேயிடம் கேட்டு, பின்னர் யாவேக்கே ஒப்புக்கொடுக்கப்பட்ட சாமுவேலையும் இது சுட்டக்கூடும்.
    reason: lexical_alternative
  - marker: b
    text: “கேட்கப்பட்ட” என்பதன் எபிரெய வினை ஆண்பால் ஒருமையில் உள்ளது. ஆனால் 1 சாமுவேல் 1:20, 27–28-இன் சூழல், குழந்தையைக் கேட்டவர் அன்னாள் என்பதைக் காட்டுகிறது. எனவே இத்தொடரை “அவள் யாவேயிடம் கேட்ட வேண்டுதலுக்குப் பதிலாக” என்றும் புரிந்துகொள்ளலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: וּבֵרַךְ
  choice: ஆசீர்வதித்து ... கூறுவது வழக்கம்
  rationale: சுற்றியுள்ள ஆண்டு தோறும் நிகழும் சூழலில் வினை வழக்கமான, மீண்டும் நிகழ்ந்த செயலைக் குறிக்கிறது.
- source_word: אֶת אֶלְקָנָה וְאֶת אִשְׁתּוֹ
  choice: எல்க்கானாவையும் அவனுடைய மனைவியையும்
  rationale: எபிரெய உரையில் தனிப்பெயருக்குப் பதிலாக ‘அவனுடைய மனைவி’ என்றே உள்ளது.
- source_word: יָשֵׂם יְהוָה לְךָ
  choice: யெகோவா உனக்குத் ... தருவாராக
  rationale: ‘வை/ஏற்படுத்து’ என்பது அடிப்படைப் பொருள்; ஆசீர்வாதச் சூழலில் ‘அருளித் தருவாராக’ என்ற கருத்தை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: தமிழில் பரவலாக அறியப்பட்ட தனிப்பெயர் வடிவத்தைப் பயன்படுத்தி, மூலத்திலுள்ள இறைப்பெயரை ஒரு பட்டத்தால் மாற்றவில்லை.
- source_word: זֶרַע
  choice: பிள்ளைகளை
  rationale: இக்குடும்ப ஆசீர்வாதச் சூழலில் கூட்டு ஒருமையான ‘சந்ததி’ என்பதன் இயல்பான பொருளைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: מִן הָאִשָּׁה הַזֹּאת
  choice: இந்தப் பெண்ணின் மூலம்
  rationale: அந்தச் சந்ததி அன்னாள் வழியாகப் பிறக்கும் என்பதைக் குறிக்கும் இயல்பான தமிழ் வடிவம்.
- source_word: תַּחַת
  choice: பதிலாக
  rationale: அர்ப்பணிக்கப்பட்ட குழந்தைக்குப் பதிலீடாக மற்ற பிள்ளைகள் அருளப்பட வேண்டும் என்ற பரிமாற்றப் பொருளைத் தக்கவைக்கிறது.
- source_word: הַשְּׁאֵלָה
  choice: கேட்கப்பட்ட வேண்டுதல்
  rationale: ‘கேள்/கடனாகக் கொடு’ என்ற சொல்லடிப்படையை ஓரளவு தக்கவைத்து, இங்கு வேண்டப்பட்ட குழந்தையைக் குறிக்கும் சொல்லின் தெளிவின்மையையும் பாதுகாக்கிறது.
- source_word: אֲשֶׁר שָׁאַל לַיהוָה
  choice: யெகோவாவுக்காகக் கேட்கப்பட்ட
  rationale: வினை இலக்கணப்படி ஆண்பால் ஒருமையாக இருப்பதால் ‘அவள் கேட்டாள்’ என்று அமைதியாகத் திருத்தாமல், செயப்பாட்டு வடிவில் உண்மையான இலக்கணச் சிக்கலைத் தக்கவைக்கிறது.
- source_word: וְהָלְכוּ לִמְקֹמוֹ
  choice: பின்பு அவர்கள் தங்கள் வீட்டிற்குத் திரும்பிச் செல்வார்கள்
  rationale: பன்மை வினை எல்க்கானாவையும் அவன் மனைவியையும் குறிக்கிறது; ‘அவனுடைய இடம்’ என்பது தமிழில் இயல்பாக ‘அவர்கள் வீடு’ என வழங்கப்படுகிறது; வழக்கமான நிகழ்வும் தக்கவைக்கப்படுகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யெகோவா
  alternative: யாவே; கர்த்தர்
  rationale: மூலத்தில் தனிப்பெயர் இருப்பதால் பட்டமான ‘கர்த்தர்’ என்பதற்குப் பதிலாகத் தமிழில் பரவலாக அறியப்பட்ட தனிப்பெயர் வடிவம் தேர்ந்தெடுக்கப்பட்டது.
- issue: שָׁאַל என்ற வினையின் எழுவாய் மற்றும் לַיהוָה என்பதன் உறவு
  choice: யெகோவாவுக்காகக் கேட்கப்பட்ட
  alternative: அவள் யெகோவாவிடம் கேட்ட; அவன் யெகோவாவிடம் கேட்ட
  rationale: எபிரெய வினை ஆண்பால் ஒருமை; ஆனால் முந்தைய கதை அன்னாளின் வேண்டுதலைச் சுட்டுகிறது. மேலும் לְ என்பது ‘யெகோவாவுக்காக’ அல்லது சூழல்படி ‘யெகோவாவிடம்’ எனப் புரியலாம். முதன்மை உரை வடிவச் சிக்கலைத் தக்கவைத்து, அடிக்குறிப்புகள் சூழலை விளக்குகின்றன.
- issue: הַשְּׁאֵלָה என்பதன் குறிப்பு
  choice: வேண்டுதல்
  alternative: கேட்டுப் பெற்ற பிள்ளை; கடனாகக் கொடுக்கப்பட்டவன்
  rationale: சொல் வேண்டுகோளையும், கேட்டுப் பெற்று யெகோவாவுக்குக் கொடுக்கப்பட்ட சாமுவேலையும் எதிரொலிக்கக்கூடும்; ஒரே விளக்கத்தை உரையில் கட்டாயப்படுத்தவில்லை.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் தமிழ். தொடர் நிகழ்வைக் காட்ட ‘வழக்கம்’ மற்றும் ‘செல்வார்கள்’ பயன்படுத்தப்பட்டன. ‘தங்கள் வீட்டிற்கு’ என்பது எபிரெய ‘அவனுடைய இடத்திற்கு’ என்பதன் இயல்பான தமிழ்; இறைப்பெயர் தனிப்பெயராகவே வழங்கப்பட்டது.
