base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/023.yaml
  text: And he said to them[a], “Why do you do such things? For I hear from all these people about your evil deeds.”
translation:
  language: ta
  text: அவர் அவர்களிடம், “நீங்கள் ஏன் இப்படிப்பட்ட காரியங்களைச் செய்கிறீர்கள்? இந்த மக்கள் எல்லாரிடமிருந்தும் உங்கள் தீய செயல்களைப் பற்றி நான் கேள்விப்படுகிறேனே[a]” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மொழியில் சொல்லுக்குச் சொல், “இந்த மக்கள் எல்லாரிடமிருந்தும் உங்கள் தீய காரியங்களை/வார்த்தைகளை நான் கேட்கிறேன்.” சூழலில், ஏலி தன் மகன்களின் பொல்லாத நடத்தையைப் பற்றிய செய்திகளைக் கேள்விப்படுவதையே இது குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר לָהֶם
  choice: அவர் அவர்களிடம் … என்றார்
  rationale: வழக்கமான எபிரெயக் கதைத் தொடரை இயல்பான நவீனத் தமிழில் எடுத்துரைக்கிறது; சூழலில் ‘அவர்’ ஏலியையும் ‘அவர்கள்’ அவரது மகன்களையும் குறிக்கின்றன.
- source_word: לָמָּה תַעֲשׂוּן כַּדְּבָרִים הָאֵלֶּה
  choice: நீங்கள் ஏன் இப்படிப்பட்ட காரியங்களைச் செய்கிறீர்கள்?
  rationale: இரண்டாம் நபர் பன்மை imperfect இங்கு தொடரும் நடத்தையைக் கண்டிக்கும் நிகழ்கால வினாவாக உள்ளது. דְּבָרִים என்பதன் பரந்த ‘காரியங்கள்/விஷயங்கள்’ பொருளை ‘காரியங்கள்’ காக்கிறது.
- source_word: אָנֹכִי שֹׁמֵעַ
  choice: நான் கேள்விப்படுகிறேனே
  rationale: தனிப்பட்ட சுட்டுப்பெயருடன் வரும் participle, தற்போது தொடர்ந்து வரும் செய்திகளை ஏலி கேள்விப்படுவதை உணர்த்துகிறது; ‘-ஏ’ கண்டனத்திற்கான ஆதாரத்தை இயல்பாக வலியுறுத்துகிறது.
- source_word: אֶת דִּבְרֵיכֶם רָעִים
  choice: உங்கள் தீய செயல்களைப் பற்றி
  rationale: சொல்லுக்குச் சொல் ‘உங்கள் தீய காரியங்கள்/வார்த்தைகள்’ என்றாலும், சூழலில் மகன்களின் பொல்லாத நடத்தையைப் பற்றிய செய்திகளே குறிக்கப்படுகின்றன. ‘செயல்கள்’ இதைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: מֵאֵת כָּל הָעָם אֵלֶּה
  choice: இந்த மக்கள் எல்லாரிடமிருந்தும்
  rationale: מֵאֵת என்பதன் மூலத்தைக் குறிக்கும் பொருளையும், כָּל மற்றும் אֵלֶּה தரும் முழுமை மற்றும் சுட்டு வலியுறுத்தலையும் காக்கிறது.
