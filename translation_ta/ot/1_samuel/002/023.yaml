translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான நேரடி கண்டிப்பு. ‘கேள்விப்படுகிறேனே’ என்பது காரணத்தையும் கண்டனத்தின் அழுத்தத்தையும் இயல்பாக இணைக்கிறது; அடிக்குறிப்பு குறியீடு உரையில் சேர்க்கப்பட்டுள்ளது.
