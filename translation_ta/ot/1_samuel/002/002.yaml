source:
  edition: WLC
  text: אֵין קָד֥וֹשׁ כַּ/יהוָ֖ה כִּ֣י אֵ֣ין בִּלְתֶּ֑/ךָ וְ/אֵ֥ין צ֖וּר כֵּ/אלֹהֵֽי/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/002.yaml
  text: There is none holy like Yahweh[a], for there is none besides you, and there is no rock like our God.
translation:
  language: ta
  text: யாவேவைப் போல் பரிசுத்தர் ஒருவரும் இல்லை[a]; ஏனெனில் உம்மைத் தவிர வேறு யாரும் இல்லை; நம் தேவனைப் போல் கன்மலை எதுவும் இல்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரேயம்: יהוה (YHWH). இப்பெயரின் உச்சரிப்பு பொதுவாக “யாவே” என மறுகட்டமைக்கப்படுகிறது.'
    reason: alternative_reading
lexical_decisions:
- source_word: אֵין
  choice: ஒருவரும் இல்லை / எதுவும் இல்லை
  rationale: இல்லாமையைச் சுட்டும் எபிரெயச் சொல்லை இயல்பான தமிழில் இருப்பின்மைத் தொடராக மொழிபெயர்த்துள்ளது. நபரைக் குறிக்கும் இடங்களில் ‘ஒருவரும்’, ‘கன்மலை’ உருவகத்துடன் ‘எதுவும்’ என்று அமைத்தாலும், மூன்று முறை வரும் மறுப்பின் இணைநிலையும் வலியுறுத்தலும் காக்கப்படுகின்றன.
- source_word: קָדוֹשׁ
  choice: பரிசுத்தர்
  rationale: இங்கு பெயரடை பெயர்ச்சொல் தன்மையில் கடவுளைக் குறிக்கிறது. ‘பரிசுத்தர்’ என்பது அவரது தூய்மையையும் ஒப்பற்ற தனித்தன்மையையும் கண்ணியமான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: כַּיהוָה
  choice: யெகோவாவைப் போல்
  rationale: כְּ ஒப்புமையைக் குறிக்கிறது. יהוה என்ற தனிப்பெயர் தமிழில் பரவலாக அறியப்படும் ‘யெகோவா’ என்று ஒலிபெயர்க்கப்பட்டுள்ளது; அதற்கான மாற்று ஒலிபெயர்ப்பு அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: כִּי
  choice: ;
  rationale: இங்கு כִּי முந்தைய கூற்றிற்கான காரணம் அல்லது விளக்கத்தை அறிமுகப்படுத்தலாம். தமிழ்க் கவிதைநடையில் அரைப்புள்ளி அந்த விளக்கத் தொடர்பை இயல்பாக வைத்திருக்கிறது; ‘ஏனெனில்’ என்று வெளிப்படையாகச் சேர்த்து ஒரே நுணுக்கத்தை மட்டும் கட்டாயப்படுத்தவில்லை.
- source_word: בִּלְתֶּךָ
  choice: உம்மைத் தவிர
  rationale: விலக்குப் பொருளையும் அன்னாள் கடவுளை நேரடியாக ஒருமையில் அழைப்பதையும் காக்கிறது. ‘உம்மை’ என்பது ஜெபச் சூழலுக்கு ஏற்ற கண்ணியமான ஒருமை வடிவம்.
- source_word: צוּר
  choice: கன்மலை
  rationale: வலிமை, நிலைத்தன்மை, பாதுகாப்பு ஆகியவற்றைத் தாங்கும் எபிரெய உருவகத்தை விளக்கச் சொல்லாகக் குறுக்காமல் அப்படியே காக்கிறது.
- source_word: כֵּאלֹהֵינוּ
  choice: நம் தேவனைப் போல்
  rationale: אֱלֹהִים வடிவில் பன்மையாக இருந்தாலும் இங்கு இஸ்ரவேலின் கடவுளைக் குறிக்கும் ஒருமைத் தலைப்பாகச் செயல்படுகிறது. முதல் நபர் பன்மை உடைமைச் சுட்டு ‘நம்’ என்று இயல்பாகத் தரப்பட்டுள்ளது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யெகோவா
  alternative: யாவே
  rationale: மூல உரை பொதுப்பட்டப் பெயரை அல்ல, நான்கு எழுத்துகளைக் கொண்ட இறைத் தனிப்பெயரை நேரடியாகப் பயன்படுத்துகிறது. தமிழில் பரவலாக அறியப்படும் ‘யெகோவா’ முதன்மை உரையில் வைக்கப்பட்டு, கல்வியுலகில் பொதுவான ‘யாவே’ என்ற ஒலிபெயர்ப்பு அடிக்குறிப்பில் குறிப்பிடப்படுகிறது; மூல உயிரொலி முழு உறுதியுடன் அறியப்படாதது மறைக்கப்படவில்லை.
- issue: צוּר என்ற இறை உருவகம்
  choice: கன்மலை
  alternative: அடைக்கலம்
  rationale: ‘அடைக்கலம்’ உருவகத்தின் பாதுகாப்பு அம்சத்தை மட்டும் முன்னிறுத்தும். ‘கன்மலை’ மூல உருவகத்தின் வலிமை, நிலைத்தன்மை, பாதுகாப்பு ஆகிய பல்வேறு சாத்தியங்களைத் திறந்தவையாக வைத்திருக்கிறது.
- issue: כִּי என்பதன் தொடர்பு
  choice: விளக்கத் தொடர்பை அரைப்புள்ளியால் வெளிப்படுத்துதல்
  alternative: ஏனெனில்
  rationale: כִּי காரணம், விளக்கம், அல்லது வலியுறுத்தல் ஆகிய நுணுக்கங்களை ஏற்கக்கூடும். அரைப்புள்ளி முதல் கூற்றுக்கும் அடுத்த கூற்றுக்கும் உள்ள ஆதார/விளக்க உறவைத் தக்கவைத்து, பொருளை தேவையின்றி ஒரே வகையில் முடிவுசெய்யாது.
translation_notes:
  register: நவீன தரத் தமிழில், ஜெபத்திற்கேற்ற கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. மூன்று இணையான மறுப்புக் கூற்றுகளும் நேரடி இரண்டாம் நபர் அழைப்பும் காக்கப்பட்டுள்ளன. ‘பரிசுத்தர்’, ‘தேவன்’, ‘கன்மலை’ ஆகியவை சாதாரண வாசகர்களுக்குப் புரியும் வேதாகமத் தமிழ்ச் சொற்களாகத் தேர்ந்தெடுக்கப்பட்டுள்ளன.
