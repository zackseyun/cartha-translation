  source_fidelity: 'மூல எபிரெயத்தின் இரு முக்கியக் கூறுகளும் துல்லியமாகக் காக்கப்பட்டுள்ளன: בְנֵי עֵלִי என்பது “ஏலியின் மகன்கள்”; בְּנֵי בְלִיָּעַל என்ற மரபுத்தொடர், பிற்காலத் தனிப்பெயர்சார் வாசிப்பை முதன்மை உரையில் திணிக்காமல், “கயவர்கள்” என அதன் ஒழுக்கச் சீர்கேட்டைக் காட்டுகிறது. לֹא יָדְעוּ אֶת־יְהוָה என்பதிலுள்ள நேரடியான ‘அறியவில்லை’ மொழியும் பாதுகாக்கப்பட்டுள்ளது. தொடக்க வாவ் இணைப்பைத் தமிழில் விடுவது இயல்பானதும் பொருளிழப்பில்லாததும் ஆகும்.'
  naturalness: “ஏலியின் மகன்கள் கயவர்கள். அவர்கள் யாவேவை அறியவில்லை.” என்பது நவீனத் தரத் தமிழில் சுருக்கமாகவும் தெளிவாகவும் இயல்பாகவும் உள்ளது. “கயவர்கள்” இச்சூழலில் வெறும் பயனின்மையை அல்லாமல் ஒழுக்கக் கேட்டை உணர்த்துகிறது.
  terminology: ‘யாவே’ என்ற இறைப்பெயர் முதன்மை உரையிலும் மாற்று வாசிப்புக் குறிப்பிலும் ஒரேபோல் பயன்படுத்தப்பட்டுள்ளது. ‘பெலியாலின் மகன்கள்’ என்பது முதன்மை உரையில் திணிக்கப்படாமல் பாரம்பரிய மாற்றாகக் குறிப்பில் மட்டுமே தரப்பட்டுள்ளது. குறிப்பு a மரபுத்தொடரின் சொற்பொருள் மற்றும் பாரம்பரிய மொழிபெயர்ப்பைத் தருகிறது; குறிப்பு b ‘அறிதல்’ என்பதன் சாத்தியமான உறவுசார் பொருளை உரையை மிகைப்படுத்தாமல் வழங்குகிறது.
