source:
  edition: WLC
  text: וּ/בְנֵ֥י עֵלִ֖י בְּנֵ֣י בְלִיָּ֑עַל לֹ֥א יָדְע֖וּ אֶת יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/012.yaml
  text: Eli’s sons were worthless men[b][a]; they did not know Yahweh.
translation:
  language: ta
  text: ஏலியின் மகன்கள் கயவர்கள்[a]. அவர்கள் யாவேவை அறியவில்லை[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “தகாத தன்மையின் மகன்கள்”; பாரம்பரிய மொழிபெயர்ப்பு, “பெலியாலின் மகன்கள்.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “யாவேவை ஏற்றுக்கொள்ளவில்லை” / “யாவேவை மதிக்கவில்லை.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בְנֵי עֵלִי
  choice: ஏலியின் மகன்கள்
  rationale: וּ என்பது இங்கு சூழலுடன் இணைக்கும் சொல்லாக உள்ளது; தமிழில் தேவையற்ற காலச்சுட்டுச் சொல்லைச் சேர்க்காமல் இயல்பாக விடப்பட்டுள்ளது. בְנֵי עֵלִי என்பது ‘ஏலியின் மகன்கள்’ என்று நேரடியாக மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: בְּנֵי בְלִיָּעַל
  choice: கயவர்கள்
  rationale: சொல்லுக்கு சொல் ‘தகாத தன்மையின் மகன்கள்’ என்ற எபிரெய மரபுத்தொடர், ஒழுக்கத்தில் இழிந்த மனிதர்களைக் குறிக்கிறது. ‘கயவர்கள்’ அதன் அறநெறிசார் வலிமையை இயல்பான நவீன தமிழில் தருகிறது; ‘பெலியல்’ என்பதை இங்கு தனிப்பெயராகக் கருதுவதையும் தவிர்க்கிறது.
- source_word: לֹא יָדְעוּ
  choice: அறியவில்லை
  rationale: יָדַע என்பதன் அடிப்படைப் பொருளான ‘அறிதல்’ தக்கவைக்கப்பட்டுள்ளது. இங்கு அது உறவுசார் அங்கீகாரத்தையும் மதிப்பையும் உட்குறிக்கலாம்; அந்த விரிவான பொருளை முதன்மை உரையிலேயே ஒரே விதமாக விளக்காமல், மூலத்தின் இறையியல் அழுத்தம் பாதுகாக்கப்படுகிறது.
- source_word: אֶת יְהוָה
  choice: யாவேவை
  rationale: אֶת என்பது நேர்செயப்படுபொருள் குறியீடு; தமிழில் ‘-ஐ’ வேற்றுமை உருபால் வெளிப்படுகிறது. יהוה என்ற இறைப்பெயர் பொதுப்பட்டமான ‘ஆண்டவர்’ என்று மாற்றப்படாமல் ‘யாவே’ என ஒலிபெயர்க்கப்பட்டுள்ளது.
theological_decisions:
- issue: בְלִיָּעַל என்பதை பொதுப்பெயர்சார் மரபுத்தொடராகப் புரிந்துகொள்வதா, ‘பெலியல்’ என்ற தனிப்பெயராகப் புரிந்துகொள்வதா
  choice: ஒழுக்கத்தில் இழிந்தவர்களைக் குறிக்கும் பொதுப்பெயர்சார் மரபுத்தொடராகக் கொண்டு ‘கயவர்கள்’ என்று மொழிபெயர்த்தல்
  alternative: ‘பெலியாலின் மகன்கள்’
  rationale: இந்தச் சூழலில் இச்சொற்றொடர் பெயரிடப்பட்ட ஒரு தீய ஆளுமையைத் தெளிவாகக் குறிக்காமல், மனிதர்களின் ஒழுக்கச் சீர்கேட்டை விவரிக்கிறது. ஆகவே பிற்கால இறையியல் பொருளை உரைக்குள் கொண்டு வராமல் சூழலின் நேரடிப் பொருள் தரப்பட்டுள்ளது.
- issue: ‘யாவேவை அறியவில்லை’ என்பதை அதன் உட்குறிப்பான அங்கீகாரமின்மை அல்லது மதிப்பின்மை என விரித்துரைப்பதா
  choice: ‘யாவேவை அறியவில்லை’ என்ற மூலத்தின் அறிதல் மொழியைத் தக்கவைத்தல்
  alternative: ‘யாவேவை ஏற்றுக்கொள்ளவில்லை’ / ‘யாவேவை மதிக்கவில்லை’
  rationale: ‘அறிதல்’ என்பது உடன்படிக்கை உறவையும் அறநெறிசார் அங்கீகாரத்தையும் உட்குறிக்கக்கூடும். ஆனால் ஒரு விளக்கத்தை மட்டும் முதன்மைப்படுத்தாமல், மூலத்திலுள்ள பொருள் செறிவும் இறையியல் பதற்றமும் பாதுகாக்கப்பட்டுள்ளன.
translation_notes:
  register: நவீனத் தரத் தமிழில் சுருக்கமாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘கயவர்கள்’ என்பது வெறும் பயனின்மையை அல்ல, சூழலில் உள்ள ஒழுக்கச் சீர்கேட்டை இயல்பாக வெளிப்படுத்துகிறது. இரு குறிப்புக் குறிகளும் அவை விளக்கும் சொற்றொடர்களின் உடனேயே வைக்கப்பட்டுள்ளன.
