  text: וַ/יֵּ֧לֶךְ אֶלְקָנָ֛ה הָ/רָמָ֖תָ/ה עַל בֵּית֑/וֹ וְ/הַ/נַּ֗עַר הָיָ֤ה מְשָׁרֵת֙ אֶת יְהוָ֔ה אֶת פְּנֵ֖י עֵלִ֥י הַ/כֹּהֵֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/011.yaml
  text: Then Elkanah went to Ramah[a], to his house; and the boy was ministering to Yahweh before Eli the priest.
translation:
  language: ta
  text: பின்பு எல்க்கானா ராமாவுக்கு, தன் வீட்டுக்குச் சென்றான். அந்தச் சிறுவன் ஏலி ஆசாரியரின் முன்னிலையில்[a] யாவேவுக்குப் பணிவிடை செய்துகொண்டிருந்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ஏலி ஆசாரியரின் முன்பாக” என்றும் மொழிபெயர்க்கலாம்; எபிரெயச் சொற்றொடர் நேரடியாக ஏலியின் “முகம்/முன்னிலை” என்பதைக் குறிக்கிறது. சூழலில் இது அவரது மேற்பார்வையையும் உட்குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: சென்றான்
  rationale: הלך என்ற வினை இங்கு கதைநிகழ்வை முன்னெடுக்கும் வகையில் ‘சென்றான்’ என்று பொருள்படுகிறது. சூழலால் ‘திரும்பிச் சென்றான்’ என்று கொள்ளலாம் என்றாலும், திரும்புதல் என்ற பொருள் வினையிலேயே வெளிப்படையாக இல்லை.
- source_word: הָרָמָתָה עַל בֵּיתוֹ
  choice: ராமாவிலுள்ள தன் வீட்டுக்கு
  rationale: இடப்பெயருடன் சேர்ந்த திசைகாட்டும் ה ராமாவை நோக்கிய இயக்கத்தைக் குறிக்கிறது; עַל בֵּיתוֹ இச்சூழலில் அவனுடைய வீடு அல்லது இல்லத்தை இலக்காகக் காட்டுகிறது. இயல்பான தமிழில் இரண்டையும் இணைத்து இவ்வாறு வழங்கப்பட்டுள்ளது.
- source_word: וְהַנַּעַר
  choice: அந்தச் சிறுவனோ
  rationale: נַעַר என்பதற்குக் குழந்தை முதல் இளைஞன் வரை பொருள் வரலாம். இங்கு சாமுவேல் இன்னும் சிறுவனாகச் சித்தரிக்கப்படுவதால் ‘சிறுவன்’ பொருத்தமானது; ‘-ஓ’ எல்க்கானாவின் புறப்பாட்டுக்கும் சிறுவனின் தொடர்ந்த சேவைக்கும் உள்ள எதிர்நிலையை இயல்பாகக் காட்டுகிறது.
- source_word: הָיָה מְשָׁרֵת
  choice: பணிவிடை செய்துகொண்டிருந்தான்
  rationale: היה உடன் வரும் பெயரெச்ச வினைவடிவு நீடித்துக்கொண்டிருந்த செயலைக் குறிக்கிறது. ‘செய்துகொண்டிருந்தான்’ அந்த நீடிப்பைப் பாதுகாக்கிறது; ‘பணிவிடை’ இங்குள்ள திருப்பணி சார்ந்த சேவையைத் தெளிவாக உணர்த்துகிறது.
- source_word: אֶת יְהוָה
  choice: யாவேவுக்கு
  rationale: שרת உடன் வரும் நேரடி பொருள் குறியீடு சேவை யாருக்குச் செய்யப்பட்டது என்பதைக் காட்டுகிறது. יהוה என்ற தனிப்பெயர் ‘யாவே’ என ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: אֶת פְּנֵי עֵלִי הַכֹּהֵן
  choice: ஏலி ஆசாரியரின் முன்னிலையில்
  rationale: פני என்பதன் அடிப்படைப் பொருள் ‘முகம்/முன்னிலை’. இங்கு ஏலியின் முன்னிலையில் நிகழ்ந்த சேவையைத் தெரிவிக்கிறது; ‘மேற்பார்வையில்’ என்று மொழிபெயர்ப்பது உள்ளார்ந்த அதிகார உறவைத் தேவையின்றி வெளிப்படையாக்கிவிடும்.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரை வழங்குதல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் உடன்படிக்கைக்குரிய தனிப்பெயரான יהוה நேரடியாக உள்ளது. அதை பொதுப் பட்டப்பெயராக மாற்றாமல் ‘யாவே’ என்று ஒலிபெயர்ப்பது மூலத்தின் தனிப்பெயர்த் தன்மையைப் பாதுகாக்கிறது.
- issue: சாமுவேலின் சேவை ஏலியுடன் கொண்டிருந்த உறவு
  choice: ஏலி ஆசாரியரின் முன்னிலையில்
  alternative: ஏலி ஆசாரியரின் மேற்பார்வையில்
  rationale: எபிரெயச் சொற்றொடர் முன்னிலை அல்லது சந்நிதி என்ற இட-உறவுப் பொருளை நேரடியாகத் தருகிறது. மேற்பார்வை என்பது சூழலில் சாத்தியமான உட்பொருளாக இருந்தாலும், அதை முதன்மை உரையில் கட்டாயப்படுத்தாமல் விடப்பட்டுள்ளது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பாகவும் மரியாதைமிக்க நடையிலும் அமைக்கப்பட்டுள்ளது. ‘ஆசாரியர்’ என்ற மரியாதைப் பன்மை தமிழின் வழக்கிற்கு ஏற்ப பயன்படுத்தப்பட்டாலும், எபிரெயத்தில் ஒருமையே உள்ளது. நீடித்த செயலைத் தெளிவாக்க ‘செய்துகொண்டிருந்தான்’ பயன்படுத்தப்பட்டுள்ளது.
