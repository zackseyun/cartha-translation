base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/036.yaml
  text: And everyone left in your house will come to bow down to him for a piece of silver and a loaf of bread[a], and will say, ‘Please attach me to one of the priestly offices[b], so that I may eat a morsel of bread.’
translation:
  language: ta
  text: உன் வீட்டாரில் எஞ்சியிருக்கும் ஒவ்வொருவனும் ஒரு சிறு வெள்ளிக்காசுக்காகவும் ஒரு ரொட்டிக்காகவும்[a] அவனிடம் வந்து தலைவணங்கி, ‘நான் ஒரு துண்டு ரொட்டி சாப்பிடும்படி, தயவுசெய்து என்னை ஆசாரியப் பணிகளில் ஒன்றில் சேர்த்துக்கொள்ளும்[b]’ என்று சொல்வான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘ஒரு சிறு வெள்ளித் துண்டுக்காகவும் ஒரு வட்ட ரொட்டிக்காகவும்.’ எபிரெயச் சொல் வெள்ளியின் சிறிய அலகைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘ஆசாரியப் பொறுப்புகளில் ஒன்றில் என்னைச் சேர்த்துக்கொள்ளும்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנּוֹתָר בְּבֵיתְךָ
  choice: உன் வீட்டாரில் எஞ்சியிருக்கும் ஒவ்வொருவனும்
  rationale: இது கட்டிடத்துக்குள் மீந்திருப்பவரை அல்ல, ஏலியின் குடும்ப வழியில் தீர்ப்புக்குப் பின் எஞ்சியிருப்பவரைக் குறிக்கிறது. ஆண்பால் ஒருமை வினைச்சொல்லுக்கு ஏற்ப ‘ஒவ்வொருவனும்’ பயன்படுத்தப்பட்டது.
- source_word: לְהִשְׁתַּחֲוֺת לוֹ
  choice: அவனிடம் வந்து தலைவணங்கி
  rationale: வினைச்சொல் உடலால் குனிந்து பணிவையும் மன்றாட்டையும் வெளிப்படுத்துவதைக் குறிக்கிறது; ‘தலைவணங்கி’ நவீன தமிழில் இரண்டையும் இயல்பாகத் தருகிறது.
- source_word: לַאֲגֹרַת כֶּסֶף
  choice: ஒரு சிறு வெள்ளிக்காசுக்காக
  rationale: אֲגוֹרָה ஒரு சிறிய வெள்ளி மதிப்பலகை அல்லது நாணய அலகைக் குறிக்கிறது. அதன் சிறுமையை ‘சிறு’ என்பதன் மூலம் வெளிப்படுத்துகிறது.
- source_word: וְכִכַּר לָחֶם
  choice: ஒரு ரொட்டிக்காகவும்
  rationale: இங்கு כִּכָּר ஒரு முழு வட்ட ரொட்டி அல்லது ரொட்டி அலகைக் குறிக்கிறது; சாதாரண வாசகருக்குப் புரியும் வகையில் ‘ஒரு ரொட்டி’ என வழங்கப்பட்டது.
- source_word: סְפָחֵנִי נָא
  choice: தயவுசெய்து என்னை ... சேர்த்துக்கொள்ளும்
  rationale: ספח ஒருவரை ஒரு குழு அல்லது பணியோடு இணைத்துக்கொள்வதைச் சொல்கிறது; ‘சேர்த்துக்கொள்ளும்’ அதன் அடிப்படை உருவகத்தையும் மன்றாட்டுத் தொனியையும் காக்கிறது. நָא ‘தயவுசெய்து’ என மொழிபெயர்க்கப்பட்டது.
- source_word: אַחַת הַכְּהֻנּוֹת
  choice: ஆசாரியப் பணிகளில் ஒன்றோடு
  rationale: பன்மை வடிவம் பல தனித்த ஆசாரியத்துவங்களைக் காட்டுவதாகத் தெளிவில்லை; ஆசாரிய சேவைக்குரிய பணிகள் அல்லது பொறுப்புகளில் ஒன்றைக் குறிக்கலாம். ஆகவே இறையியல் மிகைவிளக்கமின்றி ‘ஆசாரியப் பணிகள்’ என வழங்கப்பட்டது.
- source_word: לֶאֱכֹל פַּת לָחֶם
  choice: ஒரு துண்டு ரொட்டி சாப்பிடும்படி
  rationale: פַּת ஒரு துண்டை அல்லது சிறு பகுதியைக் குறிக்கிறது; தீர்ப்பினால் ஏற்பட்ட வறுமையையும் உணவுக்கான தாழ்மையான வேண்டுகோளையும் இது வெளிப்படுத்துகிறது.
theological_decisions:
- issue: ‘அவனிடம்’ என்ற ஒருமைப் பிரதிப்பெயரின் குறிப்பு
  choice: மூலத்தில் உள்ள ஒருமைப் பிரதிப்பெயரை ‘அவனிடம்’ எனக் குறிப்பிட்ட நபரைச் சேர்க்காமல் காத்தல்
  alternative: அக்காலத்தில் ஆசாரிய அதிகாரம் வகிப்பவனிடம் என்று வெளிப்படையாக விளக்குதல்
  rationale: ஏலியின் வீட்டார் வேறொருவருக்கு முன் தாழ்ந்து சார்ந்திருக்கும் நிலைமாற்றமே வசனத்தின் மையம். அந்த ‘அவன்’ யார் என்பதை வசனம் இங்கே பெயரிட்டு உறுதிப்படுத்தாததால் மொழிபெயர்ப்பு அதைத் தீர்மானிக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், தீர்ப்புரைக்குரிய கண்ணியமான தொனியுடனும் பொதுவாசகருக்கு எளிதில் புரியும் சொற்களுடனும் மொழிபெயர்க்கப்பட்டது. ‘வீட்டார்’ குடும்ப/வம்சப் பொருளையும், ‘தலைவணங்கி’ பணிவான மன்றாட்டையும் வெளிப்படுத்துகின்றன. அடிக்குறிப்பு குறியீடுகள் அனைத்தும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
