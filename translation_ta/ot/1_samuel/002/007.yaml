  text: Yahweh makes poor and makes rich[b][a]; he brings low and also lifts up.
translation:
  language: ta
  text: யாவே ஏழையாக்குகிறார்[a], செல்வந்தராக்குகிறார்; அவர் தாழ்த்துகிறார், உயர்த்தவும் செய்கிறார்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “வறுமைப்படுத்துகிறார்”; இழக்கச் செய்கிறார் அல்லது உடைமையிழக்கச் செய்கிறார் என்ற விரிவான பொருளையும் எபிரேய வினை தரக்கூடும்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “மேன்மைப்படுத்துகிறார்” அல்லது “மேலெழுப்புகிறார்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைத் திருப்பெயரை ஒரு பட்டப்பெயரால் மாற்றாமல், எபிரேய நான்கெழுத்துப் பெயரின் பரவலான ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: מוֹרִישׁ
  choice: ஏழையாக்குகிறார்
  rationale: இங்கு ‘செல்வந்தராக்குகிறார்’ என்பதற்கு எதிரிணையாக வருவதால், பொருளாதாரத் தாழ்வை உண்டாக்குதல் என்ற சூழல்சார் பொருளைத் தெளிவாகவும் இயல்பாகவும் தருகிறது; இழக்கச் செய்தல் அல்லது உடைமையிழக்கச் செய்தல் என்ற விரிவான பொருள் அடிக்குறிப்பில் தக்கவைக்கப்படுகிறது.
- source_word: וּמַעֲשִׁיר
  choice: செல்வந்தராக்குகிறார்
  rationale: ஹிஃபில் வினையின் காரணவினைப் பொருளான ‘செல்வமுடையவராக ஆக்குதல்’ என்பதைத் தெளிவாகக் காட்டி, முந்தைய வினையுடன் கவிதை எதிரிணையைப் பேணுகிறது.
- source_word: מַשְׁפִּיל
  choice: தாழ்த்துகிறார்
  rationale: ஒருவரைத் தாழ்ந்த நிலைக்குக் கொண்டுவருதல் என்ற செங்குத்துப் படிமத்தைப் பேணி, அடுத்துள்ள ‘உயர்த்துகிறார்’ என்பதுடன் இயல்பான இணையை உருவாக்குகிறது.
- source_word: אַף
  choice: -வும்
  rationale: இரண்டாம் செயலைச் சேர்த்துக் கூறும் ‘மேலும்/கூட’ என்ற பொருளை நவீனத் தமிழில் இயல்பான இணைப்பாக வெளிப்படுத்துகிறது.
- source_word: מְרוֹמֵם
  choice: உயர்த்தவும் செய்கிறார்
  rationale: உயர்த்துதல் அல்லது மேன்மைப்படுத்துதல் என்ற காரணவினைப் பொருளைக் கொண்டுள்ளது; ‘தாழ்த்துகிறார்’ என்பதுடன் உள்ள படிமச் சமநிலையைப் பேணுகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைத் திருப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: யெகோவா; கர்த்தர்
  rationale: மூல உரையில் பட்டப்பெயர் அல்ல, இறைவனின் தனிப்பட்ட திருப்பெயரே உள்ளது. ஆகவே அதை ‘கர்த்தர்’ என்று மாற்றாமல், நவீன ஆய்வுலகில் பரவலாக ஏற்கப்படும் ‘யாவே’ என்ற ஒலிபெயர்ப்பால் வழங்குகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் எளிமையான, கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. காரணவினை அமைப்புகளும் ‘தாழ்த்துகிறார்—உயர்த்துகிறார்’ என்ற செங்குத்துப் படிம எதிரிணையும் பேணப்பட்டுள்ளன.
