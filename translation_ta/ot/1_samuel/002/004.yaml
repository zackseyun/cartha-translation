  text: קֶ֥שֶׁת גִּבֹּרִ֖ים חַתִּ֑ים וְ/נִכְשָׁלִ֖ים אָ֥זְרוּ חָֽיִל׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/004.yaml
  text: The bows of the mighty are shattered[b][a], but those who stumble are girded with strength.
translation:
  language: ta
  text: 'வலிமைமிக்கோரின் வில்கள் முறிந்தன[a];


    தடுமாறுகிறவர்களோ வலிமையை இடுப்பில் கட்டிக்கொண்டார்கள்[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நொறுங்கின.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “வலிமையால் தங்கள் இடையைச் சுற்றிக்கொண்டார்கள்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: קֶשֶׁת
  choice: வில்கள்
  rationale: இச்சொல் ஒருமை வடிவில் இருந்தாலும், ‘வலியோர்’ என்ற பன்மைச் சொல்லுடனும் பன்மை பயனிலையுடனும் சேர்ந்து கூட்டுப்பொருளில் வருகிறது; ஆகவே தமிழில் பன்மை இயல்பானது.
- source_word: גִּבֹּרִים
  choice: வலியோர்
  rationale: இது வலிமைமிக்க அல்லது வீரமிக்கவர்களைக் குறிக்கலாம். ‘வலியோர்’ என்பது பொருளை போர்வீரர்களுக்கு மட்டும் சுருக்காமல் கவிதையின் பரந்த எதிர்மறை இணைப்பைப் பாதுகாக்கிறது.
- source_word: חַתִּים
  choice: முறிந்துபோயின
  rationale: வில்களைப் பற்றிய சூழலில் இது மனக்கலக்கத்தை அல்ல, அவை முறிக்கப்பட்ட அல்லது முறிந்த நிலையையே குறிக்கிறது. செய்பவரை உரை வெளிப்படையாகக் குறிப்பிடாததால் தமிழ் வடிவமும் அதைச் சேர்க்கவில்லை.
- source_word: נִכְשָׁלִים
  choice: தடுமாறுகிறவர்கள்
  rationale: பங்கேற்பு வடிவம் தடுமாறும் அல்லது நிலைகுலையும் நபர்களை நேரடியாகச் சித்தரிக்கிறது; ‘பலவீனர்கள்’ என்று கருத்தை மட்டும் கூறாமல் மூல உருவகத்தைப் பாதுகாக்கிறது.
- source_word: אָזְרוּ
  choice: தங்கள் இடையில் கட்டிக்கொண்டார்கள்
  rationale: எபிரெய வினை இடைக்கச்சை அல்லது ஆயுதத்தை இடையில் கட்டிக்கொள்வதைக் குறிக்கிறது. செயப்பாட்டு வடிவமாக மாற்றாமல், மூலத்தின் செயல்வினைத் தன்மையையும் உடல் சார்ந்த உருவகத்தையும் இது காக்கிறது.
- source_word: חָיִל
  choice: வலிமை
  rationale: இச்சொல் வலிமை, ஆற்றல், வீரம் அல்லது படை வல்லமை ஆகியவற்றைக் குறிக்கலாம். இங்கு ‘வலிமை’ என்பது போர்ச் சூழலுக்கு மட்டும் சுருக்காமல் கவிதையின் தலைகீழ் மாற்றத்தை வெளிப்படுத்துகிறது.
theological_decisions:
- issue: அன்னாளின் பாடலில் வலிமையும் பலவீனமும் தலைகீழாக மாறும் கவித்துவப் படிமம்
  choice: ‘வில்கள்,’ ‘தடுமாறுகிறவர்கள்,’ ‘இடையில் கட்டிக்கொண்டார்கள்’ என்ற திடமான உருவகங்கள் தக்கவைக்கப்பட்டன.
  alternative: ‘வீரர்களின் ஆயுதங்கள் அழிந்தன; பலவீனர்கள் வலிமை பெற்றார்கள்’ என்று கருத்துரைக்கலாம்.
  rationale: மூல உரை மனித வலிமையின் வீழ்ச்சியையும் தடுமாறுவோரின் வலிமைப்படுத்தலையும் உருவகங்களால் காட்டுகிறது. அவற்றை அருவமான விளக்கமாக மாற்றாமல் வைத்திருப்பது கவித்துவ மற்றும் இறையியல் பதற்றத்தைப் பாதுகாக்கிறது; மேலும் இவ்வசனத்தில் வெளிப்படையாகக் குறிப்பிடப்படாத செய்பவரையும் சேர்ப்பதில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளும் கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டது. இரண்டு அரையடிகளின் எதிர்மறை இணைப்பு ‘-களோ’ மூலம் தெளிவாக்கப்பட்டது; மூலத்தின் போரியல் மற்றும் உடல் சார்ந்த உருவகங்கள் விளக்கவுரையாகச் சுருக்கப்படவில்லை.
