  rationale: 'The revision improves modern Tamil clarity and idiom while maintaining the source''s parallelism: the bows belonging to the mighty are broken, whereas those who stumble actively gird themselves with strength. The footnotes retain non-exclusive lexical/rendering alternatives without changing the verse''s meaning.'
