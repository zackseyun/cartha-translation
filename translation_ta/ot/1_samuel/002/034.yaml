source:
  edition: WLC
  text: וְ/זֶה לְּ/ךָ֣ הָ/א֗וֹת אֲשֶׁ֤ר יָבֹא֙ אֶל שְׁנֵ֣י בָנֶ֔י/ךָ אֶל חָפְנִ֖י וּ/פִֽינְחָ֑ס בְּ/י֥וֹם אֶחָ֖ד יָמ֥וּתוּ שְׁנֵי/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/034.yaml
  text: 'And this will be the sign to you that will come upon your two sons[b][a], Hophni and Phinehas: both of them will die on one day.'
translation:
  language: ta
  text: '“உன் இரண்டு மகன்களான ஓப்னிக்கும் பினெகாஸுக்கும் நேரிடப்போவது[a] உனக்கு அடையாளமாக இருக்கும்: ஒரு நாளில்[b] அவர்கள் இருவரும் இறந்துபோவார்கள்.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லுக்கு நெருக்கமாக, “உன் இரண்டு மகன்களிடம் வரப்போவது”; அதாவது, அவர்களுக்கு நேரிடப்போவது.
    reason: lexical_alternative
  - marker: b
    text: சொல்லுக்கு நெருக்கமாக, “ஒரு நாளில்”; அதாவது, இருவரும் அதே நாளில் இறப்பார்கள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאוֹת
  choice: அடையாளம்
  rationale: אוֹת என்பது ஒரு செய்தியை உறுதிப்படுத்தும் குறி அல்லது அடையாளத்தைக் குறிக்கிறது. தீர்க்கதரிசனமாக அறிவிக்கப்பட்ட நியாயத்தீர்ப்பை உறுதிப்படுத்தும் பொருளை ‘அடையாளம்’ இயல்பாகத் தருகிறது.
- source_word: אֲשֶׁר יָבֹא אֶל
  choice: நிகழப்போவது
  rationale: சொல்லுக்கு நெருக்கமாக ‘அவர்களிடம் வரப்போவது’ என இருந்தாலும், இங்கு ஒருவருக்கு நேரிடும் நிகழ்வைக் குறிக்கும் எபிரெய மொழிமரபை நவீனத் தமிழில் ‘நிகழப்போவது’ தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: שְׁנֵי בָנֶיךָ
  choice: உன் இரண்டு மகன்கள்
  rationale: ஏலியின் இரு மகன்களையும் நேரடியாகச் சுட்டும் மூலமொழியின் எண்ணிக்கையையும் உறவையும் அப்படியே காக்கிறது.
- source_word: אֶל חָפְנִי וּפִינְחָס
  choice: ஓப்னிக்கும் பினெகாசுக்கும்
  rationale: இரண்டாவது אֶל, ‘இரண்டு மகன்கள்’ யார் என்பதை இணைப்பாக விளக்குகிறது. தமிழில் பெயர்களுடன் நான்காம் வேற்றுமையைப் பயன்படுத்துவது இந்த உறவை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: בְּיוֹם אֶחָד
  choice: ஒரே நாளில்
  rationale: சொல்லுக்கு நெருக்கமான பொருள் ‘ஒரு நாளில்’ என்பதாகும்; சூழலில் இருவரும் அதே நாளில் இறப்பார்கள் என்ற ஒருமைப்பாட்டை ‘ஒரே நாளில்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: יָמוּתוּ שְׁנֵיהֶם
  choice: அவர்கள் இருவரும் இறந்துபோவார்கள்
  rationale: שְׁנֵיהֶם இரு மகன்களும் விதிவிலக்கின்றி இறப்பார்கள் என்பதை வலியுறுத்துகிறது; ‘அவர்கள் இருவரும்’ அந்த வலியுறுத்தலைத் தமிழில் காக்கிறது.
theological_decisions:
- issue: ‘அடையாளம்’ என்பதன் தன்மை
  choice: ஏலியின் குடும்பத்துக்கு அறிவிக்கப்பட்ட நியாயத்தீர்ப்பை உறுதிப்படுத்தும் அடையாளம்
  alternative: உறுதிப்படுத்தும் வலிமையற்ற, வெறும் முன்னறிவிப்புக் குறி
  rationale: சூழலில் இந்த நிகழ்வு ஏலியின் குடும்பத்துக்கு எதிராகக் கூறப்பட்ட தீர்க்கதரிசன வார்த்தை நிறைவேறும் என்பதை உறுதிப்படுத்துகிறது. இருப்பினும், முதன்மை உரை அதை மேலும் குறுக்காமல் பொதுவான ‘அடையாளம்’ என்ற சொல்லையே வைத்திருக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், நேரடியான தீர்க்கதரிசன உரையின் கண்ணியமும் தீவிரமும் காக்கப்பட்டுள்ளன. ‘நிகழப்போவது’ எபிரெய மொழிமரபை இயல்பான தமிழாக்கமாகத் தருகிறது; சொல்லுக்கு நெருக்கமான வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
