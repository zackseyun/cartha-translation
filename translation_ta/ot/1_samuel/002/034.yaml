  to: '“உன் இரண்டு மகன்களான ஓப்னிக்கும் பினெகாஸுக்கும் நேரிடப்போவது[a] உனக்கு அடையாளமாக இருக்கும்: ஒரு நாளில்[b] அவர்கள் இருவரும் இறந்துபோவார்கள்.”'
