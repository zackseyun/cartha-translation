theological_decisions:
- issue: מְשִׁיחוֹ என்பதன் உடனடி அரசப் பொருளும் பிற்கால மேசியத் தொடர்பும்
  choice: தாம் அபிஷேகம் செய்தவர்
  alternative: தமது மேசியா
  rationale: ‘தமது அரசன்’ என்பதுடன் இணையும் இவ்விடத்தில் முதன்மையாக யாவே அபிஷேகம் செய்யும் அரசரைக் குறிக்கும் பொருளை மொழிபெயர்ப்பு நேரடியாக வெளிப்படுத்துகிறது. அதேவேளை, சொல்லை ‘மேசியா’ என்று மட்டும் வழங்கி உடனடி அரசச் சுட்டுதலைச் சுருக்காமல், அதன் மேசியத் தொடர்பை அடிக்குறிப்பில் பாதுகாக்கிறது.
- issue: முதல் அடியின் சுட்டுப்பெயர் மற்றும் கெதீப்–கெரே சார்ந்த சொல்லமைப்பு
  choice: யாவேக்கு எதிராகப் போராடுகிறவர்கள்
  alternative: யாவேயின் எதிரிகள்
  rationale: மூலத்தில் உள்ள ‘அவருக்கு எதிராக மோதுகிறவர்கள்’ என்ற செயற்பொருளைத் தக்கவைத்தபடி, சுட்டுப்பெயரின் குறிப்பு யாவே என்பதைத் தமிழில் தெளிவாக்குகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பாகவும் மாண்புடனும் வடிவமைக்கப்பட்டுள்ளது. ‘நியாயந்தீர்ப்பார்’ போன்ற பரவலாக அறியப்பட்ட வேதாகமச் சொல்லாட்சியுடன், ‘கொம்பை உயர்த்துதல்’ என்ற மூல உருவகம் விளக்க அடிக்குறிப்போடு பாதுகாக்கப்பட்டுள்ளது. இறைப்பெயர் ‘யாவே’ என ஒலிபெயர்க்கப்பட்டுள்ளது.
