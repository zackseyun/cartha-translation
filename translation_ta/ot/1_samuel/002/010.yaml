base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/010.yaml
  text: Yahweh’s adversaries will be shattered[a]; he will thunder against them from heaven. Yahweh will judge the ends of the earth[c][b]; he will give strength to his king and lift up the horn of his anointed.
translation:
  language: ta
  text: யாவேயின் எதிரிகள் நொறுக்கப்படுவார்கள்[a]; வானத்திலிருந்து அவர் அவர்களுக்கு எதிராக இடிமுழங்குவார்[b]. யாவே பூமியின் கடையெல்லைகளையும் நியாயந்தீர்ப்பார்; தமது அரசனுக்கு வலிமை அளித்து, தாம் அபிஷேகம் செய்தவரின் கொம்பை உயர்த்துவார்[c][d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யாவேக்கு எதிராக மோதுகிறவர்கள்.” எபிரெயச் சொற்றொடர் அவருக்கு எதிராக வாதிடுகிறவர்களையும் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயில் நேரடியாக, “வானத்தில்.” இங்கு “வானத்திலிருந்து” என்பது இடிமுழக்கத்தின் தோற்றிடத்தை வெளிப்படுத்துகிறது.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, “தமது மேசியாவின்.” எபிரெயச் சொல் யாவே அபிஷேகம் செய்த அரசரைக் குறிக்கலாம்; ‘மேசியா’ என்ற பட்டமும் இதே சொல்லிலிருந்து வருகிறது.
    reason: alternative_reading
  - marker: d
    text: “கொம்பை உயர்த்துதல்” என்பது வலிமை, கண்ணியம், வெற்றி ஆகியவற்றை உயர்த்துவதைக் குறிக்கும் எபிரெய உருவகம்.
    reason: cultural_clarification
