  text: וַ/יֹּ֨אמֶר אֵלָ֜י/ו הָ/אִ֗ישׁ קַטֵּ֨ר יַקְטִיר֤וּ/ן כַּ/יּוֹם֙ הַ/חֵ֔לֶב וְ/קַ֨ח לְ/ךָ֔ כַּ/אֲשֶׁ֥ר תְּאַוֶּ֖ה נַפְשֶׁ֑/ךָ וְ/אָמַ֥ר ל/ו כִּ֚י עַתָּ֣ה תִתֵּ֔ן וְ/אִם לֹ֖א לָקַ֥חְתִּי בְ/חָזְקָֽה־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/016.yaml
  text: And the man would say to him[a], “Let them first burn the fat today, and then take for yourself whatever your soul desires.” But he would say to him, “No, you must give it now; and if not, I will take it by force.”
translation:
  language: ta
  text: அந்த மனிதன் அவனிடம், “இன்று முதலில் கொழுப்பை எரிக்கட்டும்[a]; பிறகு உன் மனம் விரும்புகிறதை எடுத்துக்கொள்” என்று சொல்வான். ஆனால் அவன், “இல்லை, இப்போதே நீ கொடுத்தாக வேண்டும்; இல்லையெனில் நான் பலவந்தமாக எடுத்துக்கொள்வேன்” என்று சொல்வான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இன்னும் சொல்லுக்குச் சொல் மொழிபெயர்த்தால், “இன்று கொழுப்பை நிச்சயமாக எரிக்கட்டும்; பிறகு உன் மனம் விரும்புகிறபடி எடுத்துக்கொள்.” எபிரெயத்தில் வலியுறுத்தும் வினை அமைப்பு பயன்படுத்தப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאִישׁ
  choice: அந்த மனிதன்
  rationale: கதைச் சூழலில் காணிக்கை செலுத்தும் குறிப்பிட்ட ஆண் நபரைக் குறிக்கும் ஒருமைச் சொல்லை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: קַטֵּר יַקְטִירוּן
  choice: முதலில் ... எரிக்கட்டும்
  rationale: முற்றுப்பெயர் வினை + முற்றாத வினை அமைப்பின் வலியுறுத்தலைச் சூழலுக்கேற்ற வேண்டுகோளாகத் தருகிறது; அடுத்த செயலைவிட இதுவே முன்னதாக நடைபெற வேண்டும் என்பதைக் ‘முதலில்’ தெளிவாக்குகிறது.
- source_word: כַּיּוֹם
  choice: இன்று
  rationale: இந்தச் சூழலில் காலத்தைக் குறிக்கும் எளிய, இயல்பான நவீனத் தமிழ் வடிவம்.
- source_word: הַחֵלֶב
  choice: கொழுப்பு
  rationale: பலியில் எரிக்கப்பட வேண்டிய கொழுப்புப் பகுதிகளைத் துல்லியமாகக் குறிக்கிறது.
- source_word: וְקַח לְךָ
  choice: பிறகு ... எடுத்துக்கொள்
  rationale: கொழுப்பு எரிக்கப்பட்ட பின்பே ஊழியன் இறைச்சியை எடுத்துக்கொள்ள வேண்டும் என்ற வரிசையை இயல்பான தமிழில் காட்டுகிறது.
- source_word: כַּאֲשֶׁר תְּאַוֶּה נַפְשֶׁךָ
  choice: உன் மனம் விரும்புகிறதை
  rationale: சொல்லுக்குச் சொல் ‘உன் உயிர் விரும்புகிறபடி’ என்ற எபிரெயச் சொற்றொடரின் பொருளை, தமிழில் இயல்பாகவும் தெளிவாகவும் தருகிறது.
- source_word: וְאָמַר לוֹ
  choice: அதற்கு அவன் ... என்று சொல்வான்
  rationale: சுற்றியுள்ள விவரிப்பில் மீண்டும் மீண்டும் நிகழ்ந்த வழக்கமான பதிலைத் தமிழ் எதிர்கால வழக்குநிலை மூலம் வெளிப்படுத்துகிறது; ‘அதற்கு’ எதிர்மறையான பதிலின் தொடர்பைக் காட்டுகிறது.
- source_word: כִּי עַתָּה תִתֵּן
  choice: இல்லை, இப்போதே நீ கொடுத்தாக வேண்டும்
  rationale: எபிரெயத்தில் வெளிப்படையான ‘இல்லை’ இல்லாவிட்டாலும், மறுப்பையும் கடுமையான உடனடிக் கோரிக்கையையும் இயல்பான நேரடி உரையாடல் தமிழில் தெரிவிக்கிறது.
- source_word: וְאִם לֹא
  choice: இல்லையென்றால்
  rationale: அச்சுறுத்தலை அறிமுகப்படுத்தும் நிபந்தனைச் சொற்றொடரின் சுருக்கமான இயல்பான மொழிபெயர்ப்பு.
- source_word: לָקַחְתִּי
  choice: நான் ... எடுத்துக்கொள்வேன்
  rationale: வடிவத்தில் நிறைவுற்ற வினையாக இருந்தாலும், அச்சுறுத்தல் சூழலில் உள்ள எதிர்கால/நோக்க வலிமையைத் தமிழில் சரியாகத் தருகிறது.
- source_word: בְחָזְקָה
  choice: பலவந்தமாக
  rationale: வலிமையையோ கட்டாயத்தையையோ பயன்படுத்திப் பறித்துக்கொள்வதைத் தெளிவாகவும் சுருக்கமாகவும் குறிக்கிறது.
theological_decisions:
- issue: மனிதனின் எதிர்ப்பில் மறைமுகமாக உள்ள பலிச் சடங்கின் செயல்வரிசை
  choice: ஊழியன் இறைச்சியை எடுப்பதற்கு முன் கொழுப்பு எரிக்கப்பட வேண்டும் என்பதைக் ‘முதலில்... பிறகு’ என்று தெளிவாக வழங்குதல்
  alternative: செயல்வரிசையை வெளிப்படுத்தாமல் எபிரெயச் சொல்வரிசையை மட்டும் நேரடியாகப் பின்பற்றுதல்
  rationale: இவ்வசனம் முறையான பலிச் செயல்வரிசையையும் ஊழியர்களின் வற்புறுத்தலையும் வேறுபடுத்துகிறது. கூடுதல் சடங்கு விளக்கத்தை முதன்மை உரையில் சேர்க்காமல், உரையில் உட்பொருளாக உள்ள வரிசையை மட்டும் தெளிவாக்குகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் வேதாகமக் கதைநடைக்கு ஏற்ற கண்ணியத்துடனும் மொழிபெயர்க்கப்பட்டுள்ளது. உரையாடலின் கடுமையை ‘கொடுத்தாக வேண்டும்’ மற்றும் ‘பலவந்தமாக’ என்பவை இயல்பாகப் பாதுகாக்கின்றன.
