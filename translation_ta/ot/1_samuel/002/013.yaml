id: 1SA.2.13
reference: 1 Samuel 2:13
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וּ/מִשְׁפַּ֥ט הַ/כֹּהֲנִ֖ים אֶת הָ/עָ֑ם כָּל אִ֞ישׁ זֹבֵ֣חַ זֶ֗בַח וּ/בָ֨א נַ֤עַר הַ/כֹּהֵן֙ כְּ/בַשֵּׁ֣ל הַ/בָּשָׂ֔ר וְ/הַ/מַּזְלֵ֛ג שְׁלֹ֥שׁ הַ/שִּׁנַּ֖יִם בְּ/יָדֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/013.yaml
  text: 'The custom of the priests with the people was this: whenever any man was sacrificing a sacrifice[a], the priest’s servant would come while the meat was boiling, with the three-pronged fork in his hand.'
translation:
  language: ta
  text: 'ஆசாரியர்கள் மக்களிடம் கடைப்பிடித்த வழக்கம்[a] இதுதான்: ஒருவன் பலி செலுத்தும்போதெல்லாம், இறைச்சி வேகிக்கொண்டிருக்கையில் ஆசாரியனின் சேவகன் மூன்று முனைகள் கொண்ட முள்கரண்டியை[b] கையில் பிடித்துக்கொண்டு வருவான்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘வழக்கம்’ என்பதற்கான எபிரெயச் சொல் ‘முறை,’ ‘ஒழுங்கு,’ அல்லது ‘உரிமையாகக் கிடைக்க வேண்டிய பங்கு’ என்றும் பொருள்படலாம்.
    reason: lexical_ambiguity
  - marker: b
    text: அல்லது, “மூன்று முனைகளுள்ள இறைச்சிக் கொக்கி”; பானையிலிருந்து இறைச்சியை எடுக்கப் பயன்படுத்திய முள்கரண்டி போன்ற கருவியை எபிரெயச் சொல் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִשְׁפַּט
  choice: வழக்கம்
  rationale: מִשְׁפָּט என்பதற்கு தீர்ப்பு, ஒழுங்குமுறை, உரிமையாகக் கிடைக்க வேண்டிய பங்கு, நிலைபெற்ற நடைமுறை ஆகிய பொருள்கள் உண்டு. இங்கு மீண்டும் மீண்டும் நடந்த ஆசாரிய நடைமுறையை அறிமுகப்படுத்துவதால் ‘வழக்கம்’ இயல்பானது; அதிலுள்ள மாற்றுப் பொருள் அடிக்குறிப்பில் வைக்கப்பட்டுள்ளது.
- source_word: הַכֹּהֲנִים אֶת־הָעָם
  choice: மக்களுடன் ஆசாரியர்கள் கடைப்பிடித்த
  rationale: மக்களைப் பொறுத்தவரையில் ஆசாரியர்கள் பின்பற்றிய நடைமுறையைக் குறிக்கும் உறவுநிலையை இயல்பான தமிழில் தெரிவிக்கிறது; பகைமை அல்லது நன்மை என்ற கருத்தைச் சேர்க்கவில்லை.
- source_word: כָּל־אִישׁ
  choice: ஒருவன் … போதெல்லாம்
  rationale: எபிரெய மூலத்தின் ஒருமை ஆண்பால் பொதுப்பயன்பாட்டையும், ஒவ்வொரு நிகழ்வையும் குறிக்கும் பகிர்வுப் பொருளையும் தமிழில் காக்கிறது.
- source_word: זֹבֵחַ זֶבַח
  choice: பலி செலுத்தும்போது
  rationale: எபிரெயத்தில் ஒரே வேரிலிருந்து வரும் வினை–பெயர் இணைப்பு உள்ளது. தமிழில் ‘பலியைப் பலியிடுதல்’ செயற்கையாக ஒலிப்பதால், பொருளைத் தெளிவாகவும் இயல்பாகவும் ‘பலி செலுத்துதல்’ என வழங்குகிறது.
- source_word: וּבָא
  choice: வருவான்
  rationale: வசனம் வழக்கமாக மீண்டும் நடந்த செயலை விவரிப்பதால், தமிழின் எதிர்கால வடிவம் இங்கு வழக்கநிலைச் செயலை இயல்பாகக் குறிக்கிறது.
- source_word: נַעַר הַכֹּהֵן
  choice: ஆசாரியனின் பணியாள்
  rationale: נַעַר இளைஞன் அல்லது பணியாள்/உதவியாளர் எனப் பொருள்படலாம். பலியுணவைக் கையாளும் சேவைப்பங்கு இங்கு முன்னிலையாதலால் ‘பணியாள்’ தேர்ந்தெடுக்கப்பட்டது; சிறுவன் என்ற தேவையற்ற வயதுக் கருத்து தவிர்க்கப்படுகிறது.
- source_word: כְּבַשֵּׁל הַבָּשָׂר
  choice: இறைச்சி கொதித்து வேகிக்கொண்டிருக்கையில்
  rationale: כְּ உடன் வரும் infinitive construct காலத்தொடர்பைத் தருகிறது. בָּשַׁל இங்கு கொதிக்கவைத்து வேகவைத்தலைக் குறிக்கலாம்; தொடர்நிலை வடிவம் அதே நேரத்தில் நடந்த செயலைத் தெளிவாக்குகிறது.
- source_word: הַמַּזְלֵג שְׁלֹשׁ הַשִּׁנַּיִם
  choice: மூன்று முனைகளுள்ள முள்கரண்டி
  rationale: சொல்லுக்கு சொல் ‘மூன்று பற்களுள்ள கருவி.’ இறைச்சியைப் பானையிலிருந்து எடுக்கும் முட்கருவியை நவீன தமிழில் தெளிவாகக் குறிக்கிறது; ‘இறைச்சிக் கொக்கி’ என்ற மரபுவழி மாற்று அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: בְּיָדוֹ
  choice: தன் கையில் வைத்துக்கொண்டு
  rationale: பணியாள் கருவியை ஏந்தி வந்தான் என்பதை இயல்பான தமிழில் தெரிவிக்கிறது; தற்சுட்டுப் பெயர் உரிமையாளரைத் தெளிவுபடுத்துகிறது.
theological_decisions:
- issue: מִשְׁפָּט என்பதன் சூழல்சார் நுட்பம்
  choice: முதன்மை உரையில் ‘வழக்கம்’
  alternative: ‘முறை’ அல்லது ‘உரிமையாகக் கோரிய பங்கு’
  rationale: இவ்வசனம் ஆசாரியர்களின் நடைமுறையை விவரிக்கிறது; அடுத்த வசனங்கள் அது முறைகேடானது என்பதை வெளிப்படுத்துகின்றன. ‘உரிமை’ என்று மட்டும் மொழிபெயர்த்தால் அந்த நடைமுறைக்கு சட்டப்பூர்வ அங்கீகாரம் இருந்ததாக வாசகர் எண்ணக்கூடும். இருப்பினும் மூலச்சொல்லின் சட்ட/உரிமை நிழற்பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் dignified narrative register பயன்படுத்தப்பட்டுள்ளது. ‘ஆசாரியன்,’ ‘பலி’ போன்ற பரவலாக அறியப்பட்ட வேதாகமச் சொற்கள் தக்கவைக்கப்பட்டுள்ளன. ஆங்கில ஆலோசனை உரையில் பலிக்குப் பின் இருந்த அடிக்குறி, அதன் அடிக்குறிப்பு உண்மையில் முள்கரண்டியை விளக்குவதால் தொடர்புடைய சொல்லுக்குப் பின் வைக்கப்பட்டுள்ளது.
