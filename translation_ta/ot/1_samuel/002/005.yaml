  text: שְׂבֵעִ֤ים בַּ/לֶּ֨חֶם֙ נִשְׂכָּ֔רוּ וּ/רְעֵבִ֖ים חָדֵ֑לּוּ עַד עֲקָרָה֙ יָלְדָ֣ה שִׁבְעָ֔ה וְ/רַבַּ֥ת בָּנִ֖ים אֻמְלָֽלָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/005.yaml
  text: Those who were full have hired themselves out for bread[a], but those who were hungry have ceased. Even the barren woman has borne seven[c][b], but she who had many sons has withered away.
translation:
  language: ta
  text: 'வயிறார உண்டவர்கள் அப்பத்துக்காகக் கூலிக்கு அமர்ந்தார்கள்;

    பசியாயிருந்தவர்களோ பசி தீர்ந்தார்கள்[a].


    மலடியாயிருந்தவள்கூட ஏழு பேரைப் பெற்றாள்[b];

    பல மகன்களைப் பெற்றவளோ[c] வாடிப்போனாள்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் ‘நிறுத்தினார்கள்/ஓய்ந்தார்கள்’ என்பதற்கான செயப்படுபொருள் சொல்லப்படவில்லை; இச்சூழலில் அவர்கள் இனிப் பசியாயிருக்கவில்லை அல்லது பற்றாக்குறையில் இல்லை என்பது பொருளாக இருக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘ஏழு’ என்பது நேரடியான எண்ணாகவும், நிறைவு அல்லது முழுமையைக் குறிக்கும் கவிதை எண்ணாகவும் செயல்படலாம்.
    reason: cultural_note
  - marker: c
    text: எபிரெயத்தில் குறிப்பாக ‘மகன்கள்’; சில மொழிபெயர்ப்புகள் இதைப் பொதுமைப்படுத்தி ‘பிள்ளைகள்’ என வழங்குகின்றன.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂבֵעִים
  choice: வயிறார உண்டவர்கள்
  rationale: நிறைவாக உண்டு திருப்தியடைந்திருந்தவர்களைக் குறிக்கும் பெயரடைப் பயன்பாட்டை இயல்பான தமிழில் வெளிப்படுத்தி, நிலைமாற்றத்தின் எதிர்மறை இணைப்பைத் தக்கவைக்கிறது.
- source_word: בַּלֶּחֶם
  choice: அப்பத்துக்காக
  rationale: לֶחֶם என்பதன் நேரடியான ‘அப்பம்’ என்ற உருவகத்தைப் பாதுகாக்கிறது; இங்கு அன்றாட உணவுக்காகக் கூலிவேலை செய்யும் வறுமை நிலையையும் உணர்த்துகிறது.
- source_word: נִשְׂכָּרוּ
  choice: கூலிவேலை செய்தார்கள்
  rationale: கூலிக்கு அமர்த்தப்பட்டு உழைக்கும் நிலையை நவீனத் தமிழில் இயல்பாகச் சொல்கிறது; வளமையிலிருந்து பிறரைச் சார்ந்த கூலிநிலைக்குச் சென்ற மாற்றத்தையும் வெளிப்படுத்துகிறது.
- source_word: וּרְעֵבִים
  choice: பசியாயிருந்தவர்களோ
  rationale: முந்தைய ‘வயிறார உண்டவர்கள்’ என்பதற்கு இணையான எதிர்மறை அமைப்பைத் தக்கவைக்கிறது.
- source_word: חָדֵלּוּ
  choice: ஓய்ந்தார்கள்
  rationale: எபிரெய வினையின் ‘ஓய்தல்/நிறுத்துதல்’ என்ற பொருளைத் தக்கவைத்து, எதிலிருந்து ஓய்ந்தார்கள் என்ற சொல்லப்படாத செயப்படுபொருளை முதன்மை உரையில் நிரப்பாமல் விடுகிறது.
- source_word: עַד
  choice: கூட
  rationale: இங்கு நிலைமாற்றம் எவ்வளவு தூரம் சென்றது என்பதை, ‘மலடியாயிருந்தவள்கூட’ என்ற இயல்பான தமிழ்ப் பயன்பாட்டால் வெளிப்படுத்துகிறது.
- source_word: עֲקָרָה
  choice: மலடியாயிருந்தவள்
  rationale: குழந்தை பெறாத பெண்ணைக் குறிக்கும் மூலத்தின் பெண்பால் ஒருமையைத் தெளிவாகவும் கவிதைநடைக்கு ஏற்றவாறும் வழங்குகிறது.
- source_word: יָלְדָה שִׁבְעָה
  choice: ஏழு பேரைப் பெற்றாள்
  rationale: எபிரெயத்தின் சுருக்கமான கவித்துவக் கூற்றை இயல்பான தமிழில் தருகிறது; ‘ஏழு’ என்பது நேரடி எண்ணாகவோ நிறைவைக் குறிக்கும் கவிதை எண்ணாகவோ இருக்கக்கூடிய திறந்த தன்மையைப் பாதுகாக்கிறது.
- source_word: וְרַבַּת בָּנִים
  choice: பல மகன்களைப் பெற்றவளோ
  rationale: בָּנִים என்பதன் குறிப்பான ‘மகன்கள்’ என்ற பொருளை பொதுவான ‘பிள்ளைகள்’ என்று மாற்றாமல் தக்கவைக்கிறது.
- source_word: אֻמְלָלָה
  choice: வாடிப்போனாள்
  rationale: பலவீனமடைதல், தளர்தல், பரிதாப நிலைக்குச் செல்லுதல் ஆகிய நிழற்பொருள்களை கவிதைநயமுள்ள இயல்பான தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: שִׁבְעָה (‘ஏழு’) என்பதை நேரடி எண்ணாகவா, நிறைவு/முழுமையின் கவிதை எண்ணாகவா புரிந்துகொள்வது
  choice: முதன்மை உரையில் ‘ஏழு’ என்பதையே விளக்கமின்றித் தக்கவைத்தல்
  alternative: முழுமையான கனிவைக் குறிக்கும் அடையாள எண்ணாக வெளிப்படையாக விளக்குதல்
  rationale: மூல உரை எண்ணை நேரடியாகக் கூறுகிறது; நேரடி மற்றும் கவிதைச் சார்ந்த இரு ஒலிப்புகளுக்கும் இடமிருப்பதால் மொழிபெயர்ப்பு அதைத் தீர்மானிக்கவில்லை.
- issue: בָּנִים என்பதைக் பாலினப் பொதுமைப்படுத்தி ‘பிள்ளைகள்’ என மொழிபெயர்ப்பதா
  choice: மகன்கள்
  alternative: பிள்ளைகள்
  rationale: மூலச் சொல் ஆண்பால் பன்மையில் குறிப்பாக ‘மகன்கள்’ என்று பொருள்படுகிறது; அதை பொதுமைப்படுத்த வேண்டிய கட்டாயம் இச்சூழலில் இல்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. எதிரெதிரான நிலைமாற்றங்கள் அரைப்புள்ளிகளாலும் ‘-ஓ’ எதிர்மறை இணைப்பாலும் தெளிவாக்கப்பட்டுள்ளன; மூலத்தில் விடப்பட்டுள்ள பொருள் [a] அடிக்குறிப்பின் மூலம் திறந்த நிலையில் பாதுகாக்கப்பட்டுள்ளது.
