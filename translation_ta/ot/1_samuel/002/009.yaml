base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/009.yaml
  text: He guards the feet of his faithful ones[a], but the wicked are silenced in darkness[c][b], for not by strength does a man prevail.
translation:
  language: ta
  text: அவர் தமக்கு உண்மையுள்ளவர்களின் கால்களைக் காக்கிறார்[a]; ஆனால் பொல்லாதவர்கள் இருளில் மௌனமாக்கப்படுவார்கள்[b]. ஏனெனில், ஒரு மனிதன் வலிமையால் வெற்றிபெறுவதில்லை[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய உரைமரபை ஒருமையாக, ‘தமக்கு உண்மையுள்ளவரின் கால்’ என்றும் வாசிக்கலாம்; கவிதை இணைநிலைக்கும் கூட்டுப் பொருளுக்கும் ஏற்றதால் இங்கு பன்மை ஏற்கப்பட்டுள்ளது.
    reason: textual_variant
  - marker: b
    text: அல்லது ‘மௌனமாய் இருப்பார்கள்’ / ‘அழிக்கப்படுவார்கள்’; எபிரெய வினை மௌனமாதல் அல்லது மௌனப்படுத்தப்படுதல் ஆகிய பொருள்களைக் கொள்ளலாம்.
    reason: lexical_alternative
  - marker: c
    text: ‘ஒரு மனிதன்’ என்று மொழிபெயர்க்கப்பட்ட எபிரெய ஆண்பால் ஒருமை இங்கு பொதுவான பிரதிநிதித்துவப் பொருளில் பயன்படுத்தப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: רַגְלֵי
  choice: கால்களை
  rationale: ‘கால்கள்’ என்ற நேரடியான எபிரெய உருவகத்தைப் பாதுகாக்கிறது; ‘அடிகள்’ என்பதும் சாத்தியம், ஆனால் அது குறைவான நேரடி மொழிபெயர்ப்பு.
- source_word: חסידו
  choice: தமக்கு உண்மையுள்ளவர்களின்
  rationale: எண்ணிக்கையில் உரைமரபு மாறுபாடு இருந்தாலும், கவிதை இணைநிலையும் கூட்டுப் பொருளும் பன்மையை ஆதரிக்கின்றன. ‘உண்மையுள்ளவர்கள்’ என்பது உடன்படிக்கைச் சார்ந்த பற்றுறுதியை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: יִשְׁמֹר
  choice: காக்கிறார்
  rationale: பாதுகாத்தல், பத்திரமாக வைத்தல் ஆகிய வலிமையைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: וּרְשָׁעִים
  choice: ஆனால் பொல்லாதவர்கள்
  rationale: இணைப்புச்சொல் இங்கு உண்மையுள்ளவர்களுக்கும் பொல்லாதவர்களுக்கும் இடையிலான முரண்பாட்டைக் காட்டுவதால் ‘ஆனால்’ பொருத்தமானது.
- source_word: בַּחֹשֶׁךְ
  choice: இருளில்
  rationale: நியாயத்தீர்ப்பு அல்லது ஒடுக்கப்பட்ட நிலையைச் சுட்டக்கூடிய மூல உருவகத்தை அப்படியே வைத்திருக்கிறது.
- source_word: יִדָּמּוּ
  choice: மௌனமாக்கப்படுவார்கள்
  rationale: நிஃபால் வடிவத்தின் செயப்படுபொருள் தன்மையையும், மௌனப்படுத்தப்படுதல் அல்லது அடக்கப்படுதல் என்ற நியாயத்தீர்ப்புச் சூழலையும் வெளிப்படுத்துகிறது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய முரண்பாட்டிற்கான காரணத்தை அறிமுகப்படுத்துகிறது.
- source_word: לֹא בְכֹחַ
  choice: தன் வலிமையால் ... இல்லை
  rationale: வலிமை அல்லது ஆற்றலால் அல்ல என்ற எபிரெயக் கருத்தை இயல்பான தமிழில் தருகிறது; ‘தன்’ என்பது மனிதனுடைய சொந்த வலிமை என்ற சூழல்பொருளைத் தெளிவாக்குகிறது.
- source_word: יִגְבַּר
  choice: வெற்றிபெறுவதில்லை
  rationale: வெறும் வலிமையுடையவனாக இருப்பதைவிட மேலோங்குதல் அல்லது வெற்றியடைதல் என்ற வினையின் சூழல்சார் பொருளைத் தருகிறது.
- source_word: אִישׁ
  choice: ஒரு மனிதன்
  rationale: மூலத்தின் ஆண்பால் ஒருமையைப் பாதுகாக்கிறது; இங்கு அது பொதுமனிதனைப் பிரதிநிதித்துவப்படுத்தும் பழமொழித் தன்மையுடன் பயன்படுத்தப்பட்டுள்ளது.
theological_decisions:
- issue: חסידו என்பதன் எண்ணிக்கையும் பொருளும்
  choice: 'கூட்டு/பன்மைப் பொருள்: ‘தமக்கு உண்மையுள்ளவர்கள்’'
  alternative: 'ஒருமை: ‘தமக்கு உண்மையுள்ளவர்’'
  rationale: மெய்யெழுத்து வடிவத்தை ஒருமையாக வாசிக்க இயன்றாலும், கவிதை இணைநிலையும் பழைய மொழிபெயர்ப்பு மரபுகளின் ஆதரவும் கூட்டுப் பொருளுக்கு வலு சேர்க்கின்றன. உரைமாறுபாடு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: אִישׁ என்பதன் பிரதிநிதித்துவப் பயன்பாடு
  choice: ‘ஒரு மனிதன்’ என்ற ஆண்பால் ஒருமையைத் தக்கவைத்தல்
  alternative: ‘ஒருவர்’ அல்லது ‘எவரும்’
  rationale: மூலம் ஆண்பால் ஒருமையைப் பயன்படுத்துகிறது; இங்கு வாக்கியம் பொதுவான, பழமொழித் தன்மை கொண்ட கூற்றாகப் புரிந்துகொள்ளப்படுகிறது.
- issue: மனித வலிமையின் வரம்பு
  choice: ‘தன் வலிமையால் வெற்றிபெறுவதில்லை’
  alternative: ‘வலிமையால் எவரும் வெற்றிபெறுவதில்லை’
  rationale: மூலத்தின் இறையியல் அழுத்தத்தைத் தீர்மானவாதமாக விரிவாக்காமல், மனிதனுடைய வலிமை தனியே வெற்றிக்குக் காரணமல்ல என்ற பதற்றத்தைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் dignified நடையைப் பயன்படுத்துகிறது. ‘காக்கிறார்’, ‘பொல்லாதவர்கள்’, ‘மௌனமாக்கப்படுவார்கள்’ போன்ற சொற்கள் கவிதைச் செறிவையும் எதிர்மறை இணைநிலையையும் காக்கின்றன. இறைவனைக் குறிக்கும் மரியாதை வடிவமாக ‘அவர்/தமக்கு’ பயன்படுத்தப்பட்டுள்ளது.
