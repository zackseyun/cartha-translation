  text: לָ/כֵ֗ן נְאֻם יְהוָה֮ אֱלֹהֵ֣י יִשְׂרָאֵל֒ אָמ֣וֹר אָמַ֔רְתִּי בֵּֽיתְ/ךָ֙ וּ/בֵ֣ית אָבִ֔י/ךָ יִתְהַלְּכ֥וּ לְ/פָנַ֖/י עַד עוֹלָ֑ם וְ/עַתָּ֤ה נְאֻם יְהוָה֙ חָלִ֣ילָ/ה לִּ֔/י כִּֽי מְכַבְּדַ֥/י אֲכַבֵּ֖ד וּ/בֹזַ֥/י יֵקָֽלּוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/030.yaml
  text: 'Therefore[a], declares Yahweh, the God of Israel: I indeed said that your house and your father’s house would walk before me forever. But now, declares Yahweh: far be it from me! For those who honor me I will honor, but those who despise me will be lightly esteemed.'
translation:
  language: ta
  text: 'ஆகையால், இஸ்ரவேலின் தேவனாகிய யாவே அறிவிக்கிறார்: “உன் வீட்டாரும் உன் தந்தையின் வீட்டாரும் என்றென்றும் என் முன்னிலையில் நடப்பார்கள் என்று நான் உறுதியாகச் சொன்னேன். ஆனால் இப்போது யாவே அறிவிக்கிறார்: ‘அப்படி இருக்கவே கூடாது! ஏனெனில், என்னை மதிக்கிறவர்களை நான் மதிப்பேன்; என்னை இகழ்கிறவர்களோ அற்பமாகிவிடுவார்கள்[a].’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “மதிப்பிழப்பார்கள்” அல்லது “முக்கியமற்றவர்களாக நடத்தப்படுவார்கள்” என்றும் மொழிபெயர்க்கலாம். எபிரெய வினைச்சொல், “நான் மதிப்பேன்” என்பதற்கு எதிராக, இலகுவாகுதல், அற்பமாகுதல், அல்லது சிறிதாக மதிக்கப்படுதல் என்ற கருத்தைத் தருகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: ஆகையால்
  rationale: முந்தைய குற்றச்சாட்டின் அடிப்படையில் வரும் இறைத் தீர்ப்பை அறிமுகப்படுத்தும் காரணவிளைவுச் சொல்லாக இயல்பாக உள்ளது.
- source_word: נְאֻם יְהוָה
  choice: யாவே அறிவிப்பது இதுவே
  rationale: தீர்க்கதரிசன அறிவிப்பு வாய்பாட்டின் அதிகாரத்தையும், நவீன தமிழின் இயல்பான நடையையும் காக்கிறது; יהוה என்பது ‘யாவே’ எனப் பெயரெழுத்தாக்கப்பட்டுள்ளது.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் கடவுள்
  rationale: எபிரெயக் கட்டமைப்பைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: אָמֹר אָמַרְתִּי
  choice: நான் உறுதியாகச் சொன்னேன்
  rationale: வினையெச்சப் பெயருடன் வினை மீண்டும் வருவதால் உண்டாகும் வலியுறுத்தலை தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: בֵּיתְךָ וּבֵית אָבִיךָ
  choice: உன் வீட்டாரும் உன் தந்தையின் வீட்டாரும்
  rationale: ‘வீடு’ என்பதன் குடும்ப/வம்சப் பொருளையும் எபிரெயச் சொல்லின் மீளுரைப்பையும் காக்கிறது.
- source_word: יִתְהַלְּכוּ לְפָנַי
  choice: என் முன்னிலையில் நடந்துகொள்வார்கள்
  rationale: இறைமுன் தொடர்ச்சியான வாழ்க்கை, நடத்தை, சேவை ஆகியவற்றை உள்ளடக்கும் உருவகத்தை, ஆசாரியப் பணியாக மட்டும் குறுக்காமல் காக்கிறது.
- source_word: עַד עוֹלָם
  choice: என்றென்றும்
  rationale: நீடித்த உடன்படிக்கை மொழிக்கான நேரடியான, இயல்பான தமிழாக்கம்.
- source_word: וְעַתָּה
  choice: ஆனால் இப்போது
  rationale: முந்தைய இறை அறிவிப்பிலிருந்து தற்போதைய மறுப்புக்குச் செல்லும் கூர்மையான முரண்பாட்டை வெளிப்படுத்துகிறது.
- source_word: חָלִילָה לִּי
  choice: அது என்னால் ஒருபோதும் நடக்காது!
  rationale: சொல்லுக்குச் சொல் மொழிபெயர்த்தால் தமிழில் இயல்பிழக்கும் வலுவான மறுப்பு வாய்பாட்டை அதன் முழு அழுத்தத்துடன் தருகிறது.
- source_word: מְכַבְּדַי אֲכַבֵּד
  choice: என்னை மதிக்கிறவர்களை நான் மதிப்பேன்
  rationale: כבד என்ற ஒரே மூலச்சொல்லின் மறுமொழியையும் பரஸ்பர ‘கனம்/மதிப்பு’ கருத்தையும் நவீன தமிழில் தெளிவாகக் காக்கிறது.
- source_word: וּבֹזַי יֵקָלּוּ
  choice: என்னை இகழ்கிறவர்களோ அற்பமாகிவிடுவார்கள்
  rationale: בזה என்பதின் அவமதிப்பையும், כבד என்பதற்கு எதிராக קל தரும் ‘இலகுவாகுதல்/முக்கியமற்றதாகுதல்’ என்ற சொல்லாட்டத்தையும் இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: ஏலியின் வீட்டாருக்குக் கொடுக்கப்பட்ட முந்தைய வாக்குறுதியின் தன்மை
  choice: “என்றென்றும் ... என்று நான் உறுதியாகச் சொன்னேன்” என்ற மெய்யான முந்தைய இறை அறிவிப்பையும், “ஆனால் இப்போது ... ஒருபோதும் நடக்காது” என்ற தற்போதைய மறுப்பையும் அவற்றின் பதற்றத்தோடு வைத்திருக்கிறது.
  alternative: ‘என்றென்றும்’ என்பதை தொடக்கத்திலிருந்தே மிகைப்படுத்தலாகக் கொள்ளுதல் அல்லது தற்போதைய அறிவிப்பை உரிமையின் சிறிய வரையறையாக மட்டும் மென்மைப்படுத்துதல்.
  rationale: வசனமே முந்தைய அறிவிப்புக்கும் தற்போதைய கூர்மையான மறுப்புக்கும் இடையே வெளிப்படையான முரண்பாட்டை அமைத்து, அதனை மனிதர்கள் இறைவனை மதிப்பதோ இகழ்வதோ என்பதோடு இணைக்கிறது. விரிவான கோட்பாட்டு ஒத்திசைவை மொழிபெயர்ப்புக்குள் புகுத்தாமல் அந்தத் தெய்வவியல் பதற்றம் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘என் முன்னிலையில் நடந்துகொள்வார்கள்’ என்ற சொற்றொடர் மூலத்தின் உடன்படிக்கை சார்ந்த உருவகத்தைப் பாதுகாக்கிறது. ‘கனப்படுத்துவேன்’ போன்ற சமயக் குழுவுக்கே உரிய வழக்கைத் தவிர்த்து, כבד-இன் மறுமொழி ‘மதிக்கிறவர்களை ... மதிப்பேன்’ என இயல்பாகக் காக்கப்பட்டுள்ளது.
