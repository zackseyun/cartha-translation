source:
  edition: WLC
  text: אִם יֶחֱטָ֨א אִ֤ישׁ לְ/אִישׁ֙ וּ/פִֽלְל֣/וֹ אֱלֹהִ֔ים וְ/אִ֤ם לַֽ/יהוָה֙ יֶֽחֱטָא אִ֔ישׁ מִ֖י יִתְפַּלֶּל ל֑/וֹ וְ/לֹ֤א יִשְׁמְעוּ֙ לְ/ק֣וֹל אֲבִי/הֶ֔ם כִּֽי חָפֵ֥ץ יְהוָ֖ה לַ/הֲמִיתָֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/025.yaml
  text: If a man sins against another man[a], God will mediate for him; but if a man sins against Yahweh, who will pray for him? But they would not listen to the voice of their father[b], because Yahweh desired to put them to death.
translation:
  language: ta
  text: ஒருவன் மற்றொருவனுக்கு எதிராகப் பாவம் செய்தால், தேவன் அவனுக்காக நடுவராகச் செயல்படுவார்[a]. ஆனால் ஒருவன் யாவேக்கு எதிராகப் பாவம் செய்தால், அவனுக்காக யார் வேண்டிக்கொள்வார்[b]? ஆனால் அவர்கள் தங்கள் தந்தையின் குரலுக்குச் செவிகொடுக்கவில்லை; ஏனெனில், யாவே அவர்களைக் கொல்ல விரும்பினார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நியாயாதிபதிகள் அவனுடைய வழக்கைத் தீர்ப்பார்கள்.” אֱלֹהִים என்பது சில இடங்களில் மனித நியாயாதிபதிகளைக் குறிக்கலாம்; ஆனால் இங்கு யாவேயுடன் காணப்படும் ஒப்பீடு காரணமாக முதன்மை உரையில் “தேவன்” என்று தரப்பட்டுள்ளது.
    reason: alternative_reading
  - marker: b
    text: அல்லது, “அவனுக்காக யார் பரிந்துபேசுவார்?” இங்குள்ள எபிரெய வினை வேண்டுதல் செய்வதையோ பரிந்துபேசுவதையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֶחֱטָא
  choice: பாவம் செய்தால்
  rationale: חטא என்பதன் ஒழுக்க மற்றும் இறையியல் வலிமையைத் தக்கவைக்கிறது; ‘தவறு செய்தால்’ என்பதைவிட மூலத்திற்கு நெருக்கமானது.
- source_word: אִישׁ לְאִישׁ
  choice: ஒருவன் மற்றொருவனுக்கு எதிராக
  rationale: இரு ஆண்பால் ஒருமை வடிவங்களையும் இயல்பான நவீனத் தமிழில் வெளிப்படுத்தி, ஒருவருக்கு எதிரான குற்றம் என்ற உறவையும் தெளிவாக்குகிறது.
- source_word: וּפִלְלוֹ אֱלֹהִים
  choice: தேவன் அவனுக்காக நடுவராகச் செயல்படுவார்
  rationale: פלל என்ற வினையின் நீதித்துறை சார்ந்த நடுவர்/தீர்ப்பாளர் பொருளைத் தக்கவைக்கிறது; வெறும் கண்டனத் தீர்ப்பு என்ற எண்ணத்தைத் தவிர்க்கிறது.
- source_word: לַיהוָה
  choice: யாவேக்கு எதிராக
  rationale: உடன்படிக்கையின் தெய்வீகப் பெயரைப் பெயர்ப்பதற்குப் பதிலாக ஒலிபெயர்த்து, לְ குறிக்கும் எதிரான குற்றத்தை வெளிப்படுத்துகிறது.
- source_word: מִי יִתְפַּלֶּל לוֹ
  choice: அவனுக்காக யார் பரிந்துபேசுவார்?
  rationale: இச்சூழலில் hitpael வடிவம் குறிக்கும் வேண்டுதல் கலந்த பரிந்துரைத்தலை இயல்பாகவும், முந்தைய நடுவர் கருத்தோடு உள்ள பொருள் உறவை உணர்த்துமாறும் வழங்குகிறது.
- source_word: וְלֹא יִשְׁמְעוּ לְקוֹל אֲבִיהֶם
  choice: அவர்கள் தங்கள் தந்தையின் குரலுக்குச் செவிகொடுக்கவில்லை
  rationale: ‘குரலுக்குச் செவிகொடுத்தல்’ என்ற எபிரெய வழக்கை புரியத்தக்க தமிழில் தக்கவைத்து, அவர்களுடைய மறுப்பையும் காட்டுகிறது.
- source_word: כִּי חָפֵץ יְהוָה לַהֲמִיתָם
  choice: ஏனெனில், யாவே அவர்களைக் கொல்ல விரும்பினார்
  rationale: חפץ என்பதன் விருப்பம்/சித்தம் என்ற வலிமையையும், מות என்பதன் காரணவினை வடிவத்தையும் மென்மைப்படுத்தாமல் நேரடியாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: முதல் கூற்றிலுள்ள אֱלֹהִים என்பதன் பொருள்
  choice: தேவன்
  alternative: நியாயாதிபதிகள்
  rationale: மனிதனுக்கு எதிரான பாவத்தையும் யாவேக்கு எதிரான பாவத்தையும் ஒப்பிடும் அமைப்பு தெய்வீக நடுவரைக் குறிக்கும் வாசிப்பை ஆதரிக்கிறது. வரலாற்று ஆதாரமுள்ள மாற்று வாசிப்பு அடிக்குறிப்பில் தரப்படுகிறது.
- issue: כִּי חָפֵץ יְהוָה לַהֲמִיתָם என்பதில் வெளிப்படும் தெய்வீக நோக்கம்
  choice: யாவே அவர்களைக் கொல்ல விரும்பினார்
  alternative: யாவே அவர்களைக் கொல்லத் தீர்மானித்திருந்தார்
  rationale: மூலத்தின் கடுமையான தெய்வீக விருப்பக் கூற்றை மென்மைப்படுத்தாமலும், மனித மறுப்புக்கும் தெய்வீக நியாயத்தீர்ப்புக்கும் இடையிலுள்ள இறையியல் பதற்றத்தைத் தீர்த்துவிடாமலும் தக்கவைக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டுள்ளது. ‘யாவே’ தெய்வீகப் பெயரை ஒலிபெயர்க்கிறது. ‘குரலுக்குச் செவிகொடுக்கவில்லை’ மூலத்தின் உருவகத்தைத் தக்கவைக்கிறது; இறுதி கூற்று திட்டமிட்டு மென்மைப்படுத்தப்படவில்லை.
