base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/032.yaml
  text: You will look on the distress of the dwelling in all the good that he does for Israel[a], and there will not be an old man in your house all the days.
translation:
  language: ta
  text: இஸ்ரவேலுக்கு அவர் செய்யும் எல்லா நன்மையிலும், உறைவிடத்தின் துயரத்தை நீ காண்பாய்[a]. உன் வீட்டில் எல்லா நாட்களிலும் முதிய ஆண் ஒருவரும் இருக்கமாட்டார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உறைவிடத்தில் ஓர் எதிரி,” “பரிசுத்த இடத்தில் துயரம்,” அல்லது இதுபோன்ற பொருள்; எபிரெயச் சொற்றொடர் புரிந்துகொள்ளக் கடினமானது.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהִבַּטְתָּ
  choice: நீ காண்பாய்
  rationale: נבט என்பதன் ஹிஃபில் வடிவம் ‘பார், நோக்கு, காண்’ என்று பொருள்படும். இங்கு வரவிருக்கும் நியாயத்தீர்ப்பை ஏலி காண்பதை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது; பொறாமை போன்ற உணர்ச்சியை உரையில் சேர்க்கவில்லை.
- source_word: צַר
  choice: துயரம்
  rationale: இந்தச் சொல் ‘எதிரி’ என்றும் ‘நெருக்கடி/துயரம்’ என்றும் பொருள்படலாம். சூழலில் ஏற்படும் துன்பத்தைச் சுட்டும் வாசிப்பைத் தேர்ந்தெடுத்தாலும், மாற்று வாசிப்பை அடிக்குறிப்பில் பாதுகாக்கிறது.
- source_word: מָעוֹן
  choice: உறைவிடம்
  rationale: מָעוֹן என்பதன் அடிப்படைப் பொருள் வாழிடம் அல்லது உறைவிடம். வழிபாட்டிடத்தைக் குறிக்கும் சூழல் இருந்தாலும், ‘பரிசுத்த ஸ்தலம்’ என்று பொருளை மிகத் துல்லியமாக நிர்ணயிக்காமல் மூலச்சொல்லின் பரப்பை வைத்திருக்கிறது.
- source_word: בְּכֹל אֲשֶׁר יֵיטִיב אֶת־יִשְׂרָאֵל
  choice: அவர் இஸ்ரவேலுக்குச் செய்யும் எல்லா நன்மைகளுக்கிடையிலும்
  rationale: மூலத்தில் நன்மை செய்பவரின் எழுவாய் வெளிப்படையாகப் பெயரிடப்படவில்லை; ஆண்பால் ஒருமை வினைமுற்று உள்ளது. சூழலில் அது இயல்பாகக் கடவுளைக் குறிப்பதால் மரியாதைப் பெயர்ச்சொல்லான ‘அவர்’ பயன்படுத்தப்பட்டது. ‘நன்மைகளுக்கிடையிலும்’ என்பது நன்மை நடைபெறும் நிலையிலேயே துயரம் காணப்படும் முரண்பாட்டை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: זָקֵן
  choice: முதியவர்
  rationale: இங்கு பதவியாகிய ‘மூப்பர்’ அல்ல, வயது முதிர்ந்த ஒருவரே குறிக்கப்படுகிறார். ‘முதியவர்’ அந்த வேறுபாட்டைத் தெளிவாகக் காட்டுகிறது.
- source_word: בְּבֵיתְךָ
  choice: உன் வீட்டில்
  rationale: ‘வீடு’ என்பது எபிரெயத்தில் குடும்பத்தையும் வம்சத்தையும் குறிக்க முடியும். நேரடியான உருவகத்தைத் தக்கவைத்தபடியே, இச்சூழலில் ஏலியின் குடும்ப வழியை வாசகர் உணர முடிகிறது.
- source_word: כָּל הַיָּמִים
  choice: எல்லா நாட்களிலும்
  rationale: மூலத்தின் ‘எல்லா நாட்களும்’ என்ற காலச்சொற்றொடரை நெருக்கமாகப் பாதுகாக்கிறது; ‘ஒருபோதும்’ அல்லது ‘என்றென்றும்’ என்று அதன் வலிமையை அதிகரிக்கவில்லை.
theological_decisions:
- issue: צַר מָעוֹן என்ற கடினமான சொற்றொடரின் பொருள்
  choice: உறைவிடத்தின் துயரம்
  alternative: உறைவிடத்தில் ஓர் எதிரி; பரிசுத்த இடத்தில் துயரம்
  rationale: எபிரெயச் சொற்றொடர் இலக்கணத்திலும் பொருளிலும் தெளிவற்றது. முதன்மை வாசகம் துயரத்தை உறைவிடத்துடன் இணைக்கிறது; ஆனால் அது ஒரு தனிப்பட்ட எதிரியையோ பரிசுத்த இடத்தில் நேரும் நெருக்கடியையோ திட்டவட்டமாக நிர்ணயிக்கவில்லை. உண்மையான உரைத் தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான, பொதுவாசகருக்குப் புரியும் தமிழ். தீர்ப்பின் கடுமையான ஓசையைத் தக்கவைத்துள்ளது. கடினமான எபிரெயச் சொற்றொடரின் தெளிவின்மை முதன்மை உரையிலும் அடிக்குறிப்பிலும் பாதுகாக்கப்பட்டுள்ளது.
