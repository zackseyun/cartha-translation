base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/028.yaml
  text: And did I not choose him from all the tribes of Israel to be my priest[a], to go up to my altar, to burn incense, to wear an ephod before me? And I gave to your father's house all the food offerings of the sons of Israel.
translation:
  language: ta
  text: இஸ்ரவேலின் எல்லாக் கோத்திரங்களிலிருந்தும் அவனை எனக்கு ஆசாரியனாகத் தேர்ந்தெடுத்து, என் பலிபீடத்தின்மேல் ஏறவும், தூபம் எரிக்கவும், என் முன்னிலையில் ஏபோத்தை அணியவும் நான் ஏற்படுத்தவில்லையா? இஸ்ரவேல் மக்களின் நெருப்பில் செலுத்தப்படும் பலிகள் அனைத்தையும் உன் தந்தையின் குடும்பத்தாருக்கு நான் கொடுத்தேன்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “நெருப்பில் செலுத்தப்படும் பலிகள்” என்பது எபிரெயத்தில் “நெருப்பால் செலுத்தப்படும் பலிகள்” என்ற பரந்த பொருளுடைய சொல்; இது தகனபலிகளை மட்டும் குறிக்காது.
    reason: אִשֵּׁי என்ற சொல்லின் பரந்த சடங்குப் பொருளைத் தெளிவுபடுத்துதல்.
lexical_decisions:
- source_word: וּבָחֹר אֹתוֹ
  choice: அவனை ... நான் தேர்ந்தெடுக்கவில்லையா?
  rationale: சூழலில் உள்ள வலியுறுத்தலையும் கண்டனத் தொனியையும் இயல்பான தமிழில் வினாவடிவில் வெளிப்படுத்துகிறது.
- source_word: מִכָּל שִׁבְטֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் எல்லாக் கோத்திரங்களிலிருந்தும்
  rationale: தேர்வு பல கோத்திரங்களின் நடுவிலிருந்து நிகழ்ந்தது என்ற பகுதி சார்ந்த பொருளைப் பாதுகாக்கிறது.
- source_word: לִי לְכֹהֵן
  choice: எனக்கு ஆசாரியனாக இருக்கும்படி
  rationale: தேவனுக்குரிய ஆசாரியப் பணியையும் நோக்கத்தையும் தெளிவாகக் காட்டுகிறது.
- source_word: לַעֲלוֹת עַל מִזְבְּחִי
  choice: என் பலிபீடத்தின்மேல் ஏறவும்
  rationale: עלה என்பதன் நேரடியான மேலேறுதல் சார்ந்த வழிபாட்டு மொழியை அதிக விளக்கமின்றிப் பாதுகாக்கிறது.
- source_word: לְהַקְטִיר קְטֹרֶת
  choice: தூபம் எரிக்கவும்
  rationale: ஆசாரிய வழிபாட்டுச் செயலைத் தெளிவாகவும் இயல்பாகவும் கூறுகிறது.
- source_word: לָשֵׂאת אֵפוֹד לְפָנַי
  choice: என் முன்னிலையில் ஏபோத்தை அணியவும்
  rationale: נשא அடிப்படையில் சுமத்தல்/தரித்தல் எனினும், ஆசாரிய உடைச் சூழலில் 'அணிய' என்பது இயல்பாகவும் துல்லியமாகவும் உள்ளது; ஏபோத் என்ற தனிப்பெயர் ஒலிபெயர்க்கப்படுகிறது.
- source_word: לְבֵית אָבִיךָ
  choice: உன் தந்தையின் வீட்டாருக்கு
  rationale: தந்தையின் தனிக் கட்டிடத்தை அல்ல, ஏலியின் மூதாதையர் வழிக் குடும்பத்தாரைக் குறிக்கும் எபிரெய மொழிவழக்கைத் தமிழில் தெளிவாக்குகிறது.
- source_word: אֶת כָּל אִשֵּׁי בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்களின் நெருப்புப் பலிகள் அனைத்தையும்
  rationale: אִשֵּׁי என்பதன் நெருப்பில் செலுத்தப்படும் பலிகள் என்ற பரந்த சடங்குப் பொருளைப் பாதுகாக்கிறது; 'தகனபலிகள்' என்று குறுக்கவில்லை.
theological_decisions:
- issue: אִשֵּׁי என்ற பலிச் சொல்
  choice: நெருப்புப் பலிகள்
  alternative: உணவுக் காணிக்கைகள்
  rationale: இச்சொல் நெருப்பின் மூலம் செலுத்தப்படும் பலிகளைப் பரந்த வகையில் குறிக்கிறது. 'நெருப்புப் பலிகள்' அந்தச் சடங்கு அம்சத்தை வெளிப்படையாகப் பாதுகாக்கிறது; 'தகனபலிகள்' என்று மொழிபெயர்ப்பது பொருளைத் தேவையின்றிக் குறுக்கும்.
- issue: בְּנֵי יִשְׂרָאֵל என்ற தேசிய அடையாள மொழிவழக்கு
  choice: இஸ்ரவேல் மக்கள்
  alternative: இஸ்ரவேலின் மகன்கள்
  rationale: இங்கு முழு உடன்படிக்கைச் சமூகத்தைக் குறிக்கும் நிலையான எபிரெய மொழிவழக்காக இருப்பதால், நவீனத் தமிழில் இயல்பான தேசியக் கூட்டுப்பெயர் பயன்படுத்தப்படுகிறது; உயிரியல் ஆண் சந்ததியினருக்கு மட்டும் பொருளைக் குறுக்கவில்லை.
- issue: ஏபோத்தை 'சுமத்தல்' அல்லது 'அணிதல்'
  choice: அணியவும்
  alternative: சுமக்கவும்
  rationale: ஆசாரியப் பணியும் உடையும் குறித்த இச்சூழலில் 'அணிதல்' இயல்பான பொருளைத் தருகிறது; 'சுமக்கவும்' என்பது தமிழில் கையில் எடுத்துச் செல்வதாகத் தவறாகப் புரியக்கூடும்.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகருக்குப் புரியும் கண்ணியமான வேதாகம நடையில் வடிவமைக்கப்பட்டது. நீண்ட எபிரெய வாக்கியம் தமிழில் தெளிவுக்காக இரண்டு வினாக்களாகப் பகுக்கப்பட்டுள்ளது; மீளுரைக்கப்பட்ட 'அவனைத் தேர்ந்தெடுக்கவில்லையா' என்பது முதல் வினாவின் ஆட்சியைத் தெளிவாக்குகிறது. 'ஆசாரியன்', 'பலிபீடம்', 'தூபம்', 'ஏபோத்' ஆகிய நிறுவப்பட்ட வழிபாட்டுச் சொற்கள் தக்கவைக்கப்பட்டுள்ளன.
