source:
  edition: WLC
  text: אַל תַּרְבּ֤וּ תְדַבְּרוּ֙ גְּבֹהָ֣ה גְבֹהָ֔ה יֵצֵ֥א עָתָ֖ק מִ/פִּי/כֶ֑ם כִּ֣י אֵ֤ל דֵּעוֹת֙ יְהוָ֔ה ו/לא נִתְכְּנ֖וּ עֲלִלֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/003.yaml
  text: Do not keep speaking so very proudly; do not let arrogance come out of your mouth[a], for Yahweh is a God of knowledge, and by him actions are weighed.
translation:
  language: ta
  text: 'மிகவும் பெருமையாகப் பேசிக்கொண்டே இருக்காதீர்கள்;

    உங்கள் வாயிலிருந்து ஆணவம் வெளிவர வேண்டாம்.

    ஏனெனில் யாவே அறிவின் கடவுள்;

    அவரால் செயல்கள் எடைபோடப்படுகின்றன.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: மெய்யெழுத்து உரையை இன்னும் நேரடியாகப் பின்பற்றினால், ‘செயல்கள் எடைபோடப்படுவதில்லை’ என்றும் மொழிபெயர்க்கலாம். முதன்மை உரை, யாவே மனிதர்களின் செயல்களை மதிப்பிடுகிறார் என்ற மரபுவழி ஓதப்படும் வடிவத்தைப் பின்பற்றுகிறது.
    reason: textual_variant
lexical_decisions:
- source_word: אַל תַּרְבּוּ תְדַבְּרוּ
  choice: பேசிக்கொண்டே இருக்காதீர்கள்
  rationale: רבה என்பதுடன் தொடரும் வினைச்சொல் செயலைத் தொடர்ந்து அல்லது மீண்டும் மீண்டும் செய்வதை வலியுறுத்துகிறது. எனவே வெறுமனே ‘பேசாதீர்கள்’ என்பதற்குப் பதிலாக, இயல்பான தமிழில் தொடர்ச்சியான செயலைக் குறிக்கும் வடிவம் பயன்படுத்தப்பட்டது.
- source_word: גְּבֹהָה גְבֹהָה
  choice: மிகவும் பெருமையாக
  rationale: இருமுறை வரும் ‘உயர்வான’ என்ற சொல் பேச்சிலுள்ள மிகுதியான தற்பெருமையையும் செருக்கையும் வலியுறுத்துகிறது. தமிழில் அந்த வலியுறுத்தலை ‘மிகவும்’ என்பதும், சூழலின் அறநெறிப் பொருளை ‘பெருமையாக’ என்பதும் எடுத்துரைக்கின்றன.
- source_word: יֵצֵא עָתָק מִפִּיכֶם
  choice: உங்கள் வாயிலிருந்து ஆணவம் வெளிவர வேண்டாம்
  rationale: עָתָק இங்கு செருக்கான, அகந்தையான அல்லது துணிகரமான பேச்சைக் குறிக்கிறது. முந்தைய தடையை இந்த இணை வாக்கியத்திலும் இயல்பாகத் தொடரச் செய்து, எபிரேய உருவகத்தைப் பாதுகாக்கும் வகையில் மொழிபெயர்க்கப்பட்டது.
- source_word: אֵל דֵּעוֹת יְהוָה
  choice: யாவே அறிவின் கடவுள்
  rationale: ‘அறிவுகளின் கடவுள்’ என்ற எபிரேயப் பன்மை முழுமையான அல்லது விரிவான அறிவைக் குறிக்கலாம். தமிழில் இயல்பாகவும் கண்ணியமாகவும் இருக்க ஒருமையான ‘அறிவின் கடவுள்’ பயன்படுத்தப்பட்டது; יהוה என்பது தனிப்பெயராக ‘யாவே’ என்று ஒலிபெயர்க்கப்பட்டது.
- source_word: וְלֹו נִתְכְּנוּ עֲלִלוֹת
  choice: அவரால் செயல்கள் எடைபோடப்படுகின்றன
  rationale: மசோரா வாசிப்பு לו (‘அவரால்/அவருக்கு’) அடிப்படையில், செயல்களை யாவே மதிப்பிடுகிறார் என்ற கருத்து தரப்படுகிறது. תכן சொல்லின் அளத்தல் அல்லது எடைபோடுதல் உருவகத்தை ‘எடைபோடப்படுகின்றன’ பாதுகாக்கிறது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் பொதுப் பட்டப்பெயர் அல்ல, நான்கு எழுத்துகளைக் கொண்ட இறைவனின் தனிப்பெயர் நேரடியாக வருகிறது. அதனால் அந்தப் பெயர் தமிழில் ‘யாவே’ என்று ஒலிபெயர்க்கப்பட்டது.
- issue: וְלֹא / וְלֹו נִתְכְּנוּ עֲלִלוֹת என்ற வாசக வேறுபாடு
  choice: அவரால் செயல்கள் எடைபோடப்படுகின்றன
  alternative: செயல்கள் எடைபோடப்படுவதில்லை
  rationale: மசோரா மரபின் ஓதப்படும் வடிவமான לו மற்றும் சூழலின் கருத்தோட்டம், கடவுள் மனிதச் செயல்களை மதிப்பிடுகிறார் என்ற முதன்மை வாசிப்பை ஆதரிக்கின்றன. எனினும், மெய்யெழுத்து வடிவமான לא தரக்கூடிய மறுப்பு வாசிப்பு உண்மையான உரை வேறுபாடு என்பதால் அடிக்குறிப்பில் பாதுகாக்கப்பட்டது.
translation_notes:
  register: நவீன பொதுத்தமிழில் எளிதில் புரியக்கூடிய, அதேவேளையில் கவிதைத் தன்மையும் கண்ணியமும் கொண்ட நடை பயன்படுத்தப்பட்டது. எபிரேய இணை அமைப்பைப் பாதுகாக்க வரிகள் பிரிக்கப்பட்டுள்ளன; தேவையற்ற சமயக்குழுச் சொற்கள் தவிர்க்கப்பட்டுள்ளன.
