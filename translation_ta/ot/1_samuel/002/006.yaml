revisions:
- from: யாவே கொல்லுகிறார்; உயிர்ப்பிக்கிறார்; பாதாளத்திற்குள் இறங்கச் செய்கிறார்[a]; அங்கிருந்து மேலே எழுப்புகிறார்.
  to: யாவே கொல்லுகிறார்; உயிர் அளிக்கிறார்; ஷியோலுக்குள் இறங்கச் செய்கிறார்[a]; மேலே ஏற்றுகிறார்.
  rationale: The revision retains the Hebrew poem’s balanced sequence—death/life and descent/ascent—while preserving the technical and disputed breadth of שְׁאוֹל by transliteration. It removes an unstated locative inference and uses broad life-giving language rather than explicit resurrection terminology.
