source:
  edition: WLC
  text: יְהוָ֖ה מֵמִ֣ית וּ/מְחַיֶּ֑ה מוֹרִ֥יד שְׁא֖וֹל וַ/יָּֽעַל׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/006.yaml
  text: Yahweh puts to death and makes alive[a]; he brings down to Sheol and raises up.
translation:
  language: ta
  text: யாவே கொல்லுகிறார்; உயிர் அளிக்கிறார்; ஷியோலுக்குள் இறங்கச் செய்கிறார்[a]; மேலே ஏற்றுகிறார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘கல்லறைக்குள்’ அல்லது ‘இறந்தோரின் உலகிற்குள்.’ இங்குள்ள எபிரெயச் சொல் ‘ஷியோல்’ இறந்தோரின் இருப்பிடத்தை அல்லது உலகைக் குறிக்கிறது; அதைத் தானாகவே ‘நரகம்’ என்று பொருள்கொள்ளக் கூடாது.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைத் திருப்பெயரை ஒரு பட்டப்பெயரால் மாற்றாமல், எபிரெயத் திருப்பெயரின் ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: מֵמִית
  choice: கொல்லுகிறார்
  rationale: מות என்பதன் ஹிஃபில் வடிவிலுள்ள காரணவினைப் பொருளை நேரடியாகவும் இயல்பான தமிழிலும் வெளிப்படுத்துகிறது.
- source_word: וּמְחַיֶּה
  choice: உயிர்ப்பிக்கிறார்
  rationale: חיה என்பதன் காரணவினைப் பொருளைப் பாதுகாத்து, ‘கொல்லுகிறார்’ என்பதுடன் உள்ள கவிதை இணைநிலையைத் தக்கவைக்கிறது; உயிர்த்தெழுதலை மட்டும் குறிப்பதாக இதைச் சுருக்கவில்லை.
- source_word: מוֹרִיד
  choice: இறங்கச் செய்கிறார்
  rationale: ירד என்பதன் ஹிஃபில் காரணவினைத் தன்மையையும் கடவுளின் செயற்பாட்டையும் தெளிவாகக் காட்டுகிறது.
- source_word: שְׁאוֹל
  choice: பாதாளம்
  rationale: இறந்தோரின் உலகைக் குறிக்கும் எபிரெயக் கருத்துக்கு இயல்பான தமிழ் இணை; இதைத் தானாகவே ‘நரகம்’ என்று குறுக்காமல் காக்கிறது.
- source_word: וַיָּעַל
  choice: மேலே எழுப்புகிறார்
  rationale: ‘இறங்கச் செய்கிறார்’ என்பதற்கு எதிரிணையாக அமைந்து, மீட்டெடுத்தலைக் குறிக்கும் பரந்த கவிதைப் பொருளைப் பாதுகாக்கிறது; உடல் உயிர்த்தெழுதலை வெளிப்படையாகச் சேர்க்கவில்லை.
theological_decisions:
- issue: வசனத்தை வெளிப்படையான உயிர்த்தெழுதல் மொழியில் மொழிபெயர்க்க வேண்டுமா?
  choice: ‘உயிர்ப்பிக்கிறார்’, ‘மேலே எழுப்புகிறார்’ என்ற பரந்த மொழியைப் பயன்படுத்துதல்.
  alternative: ‘மரித்தோரிலிருந்து உயிர்த்தெழச் செய்கிறார்’ என்று குறிப்பாக மொழிபெயர்த்தல்.
  rationale: எபிரெய உரை மரணம் மற்றும் ஷியோல்மீது யாவேக்குள்ள அதிகாரத்தை வலியுறுத்தினாலும், உடல் உயிர்த்தெழுதலை மட்டும் குறிப்பதில்லை. ஆகவே அதன் கவிதைச் செறிவும் இறையியல் விரிவும் பாதுகாக்கப்படுகின்றன.
translation_notes:
  register: நவீனத் தரத் தமிழில், எளிமையும் கண்ணியமும் கொண்ட கவிதை நடை. இணையான காரணவினை அமைப்புகள் முடிந்தவரை பாதுகாக்கப்பட்டுள்ளன.
