base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/017.yaml
  text: So the sin of the young men was very great before Yahweh[c][b][a], because the men despised Yahweh’s offering.
translation:
  language: ta
  text: ஆகவே, அந்த இளைஞர்களின் பாவம் யாவேவின் முன்னிலையில் மிகவும் பெரியதாக இருந்தது[a]; ஏனெனில் அவர்கள் யாவேவின் காணிக்கையை இகழ்ந்தார்கள்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொல்லுக்கு சொல், “யாவேவின் முகத்துக்கு முன்பாக”; இதன் பொருள் “யாவேவின் முன்னிலையில்.”
    reason: lexical_alternative
  - marker: b
    text: “காணிக்கை” என்பதற்கான எபிரெயச் சொல் மின்ஹா; அது பொதுவாக ஒரு காணிக்கையையோ, சில சூழல்களில் குறிப்பாகத் தானியக் காணிக்கையையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: חַטַּאת
  choice: பாவம்
  rationale: இங்கு ஏலியின் மகன்கள் செய்த தீச்செயலைக் குறிக்கிறது; ‘பாவநிவாரண பலி’யைக் குறிக்கவில்லை.
- source_word: הַנְּעָרִים
  choice: அந்த இளைஞர்கள்
  rationale: נַעַר என்பதன் வயது சார்ந்த பொருளைப் பாதுகாக்கிறது; இவர்கள் ஆசாரியப் பணியில் இருந்த வளர்ந்த ஆண்கள் என்பதால் ‘சிறுவர்கள்’ பொருந்தாது.
- source_word: גְּדוֹלָה מְאֹד
  choice: மிகவும் பெரிதாயிருந்தது
  rationale: எபிரெய வலியுறுத்தலை இயல்பான, கண்ணியமான தமிழில் தக்கவைக்கிறது.
- source_word: אֶת־פְּנֵי יְהוָה
  choice: யாவேவின் முன்னிலையில்
  rationale: சொல்லுக்கு சொல் ‘யாவேவின் முகத்திற்கு முன்’; இங்கு அவருடைய முன்னிலையில் என்பதே இயல்பான இடியப் பொருள்.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைப்பட்டத்தால் மாற்றாமல், எபிரெய தனிப்பெயரான יהוה-ஐ தமிழில் ஒலிபெயர்க்கிறது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய மதிப்பீட்டிற்கான காரணத்தை அறிமுகப்படுத்துகிறது.
- source_word: נִאֲצוּ
  choice: அவமதித்தார்கள்
  rationale: இகழ்ச்சியோடும் மதிப்பின்மையோடும் நடத்தும் வினைச்சொல் வலிமையை நேரடியாக வெளிப்படுத்துகிறது.
- source_word: הָאֲנָשִׁים
  choice: அந்த மனிதர்கள்
  rationale: முன்னர் குறிப்பிடப்பட்ட குற்றவாளிகளையே சுட்டுகிறது; மூலத்தின் பொதுவான ‘மனிதர்கள்/ஆண்கள்’ சொல்லை மிகையாக விளக்கவில்லை.
- source_word: מִנְחַת יְהוָה
  choice: யாவேவின் காணிக்கை
  rationale: מִנְחָה பொதுவாகக் காணிக்கையையும், சில சூழல்களில் குறிப்பாகத் தானியக் காணிக்கையையும் குறிக்கலாம்; இங்கு பரந்த சொல் சூழலுக்குப் பொருந்துகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் தனிப்பெயர் நேரடியாக உள்ளது; அதை ஒரு பட்டமாக மாற்றாமல் ஒலிபெயர்ப்பது பெயரின் தன்மையைப் பாதுகாக்கிறது.
- issue: பாவம் யாருக்கு முன்பாக அல்லது யாருக்கு எதிராக இருந்தது
  choice: யாவேவின் முன்னிலையில்
  alternative: யாவேவுக்கு எதிராக
  rationale: אֶת־פְּנֵי என்ற இடியத்தின் முன்னிலை/சந்நிதி உருவகத்தைப் பாதுகாக்கிறது; ‘எதிராக’ என்பது சாத்தியமான பொருள் விளக்கம் என்றாலும் மூல உருவகத்தைச் சுருக்கிவிடும்.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில், எபிரெய இடியமும் מִנְחָה என்பதன் பொருள் பரப்பும் அடிக்குறிப்புகளில் பாதுகாக்கப்பட்டுள்ளன.
