base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/022.yaml
  text: Eli was very old[a], and he heard all that his sons were doing to all Israel, and that they were lying with the women who served at the entrance to the tent of meeting.
translation:
  language: ta
  text: ஏலி மிகவும் முதியவனாக இருந்தான். தன் மகன்கள் இஸ்ரவேலர் அனைவருக்கும் செய்துவந்த எல்லாவற்றையும், சந்திப்புக் கூடாரத்தின் நுழைவாயிலில் பணிபுரிந்த பெண்களுடன்[a] அவர்கள் உறவுகொண்டதையும் அவன் கேள்விப்பட்டான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘சந்திப்புக் கூடாரத்தின் நுழைவாயிலில் கூடியிருந்த பெண்களுடன்.’ இந்த எபிரெயப் பங்கேற்புவினை, கூடிவருவதையோ ஒழுங்குபடுத்தப்பட்ட முறையில் பணிபுரிவதையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: זָקֵן מְאֹד
  choice: மிகவும் முதிர்ந்த வயதுடையவனாக இருந்தான்
  rationale: எபிரெயப் பெயரடையையும் வலியுறுத்தியையும் இயல்பான, கண்ணியமான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: וְשָׁמַע
  choice: கேள்விப்பட்டான்
  rationale: ஏலி இந்தச் செயல்களைப் பற்றிய செய்திகளை அறிந்தான் என்ற இறந்தகாலக் கதைநடையை இயல்பாகத் தருகிறது.
- source_word: כָּל אֲשֶׁר יַעֲשׂוּן
  choice: செய்துவந்த எல்லாவற்றையும்
  rationale: மகன்களின் தொடர்ச்சியான தவறான நடத்தையையும் அதன் முழுமையையும் வெளிப்படுத்துகிறது.
- source_word: לְכָל יִשְׂרָאֵל
  choice: இஸ்ரவேலர் அனைவருக்கும்
  rationale: ל என்ற முன்னிடைச்சொல்லின் தொடர்பு அல்லது பாதிக்கப்பட்டவர்களை நோக்கிய செயல் என்ற நுணுக்கத்தை மிகைப்படுத்தாமல் நெருக்கமாகக் காக்கிறது.
- source_word: יִשְׁכְּבוּן אֶת־הַנָּשִׁים
  choice: பெண்களோடு அவர்கள் படுத்துக்கொண்டதையும்
  rationale: எபிரெயத்தில் உள்ள பாலுறவைக் குறிக்கும் மரபான மங்கலான சொல்லாட்சியை, பொருள் புரியுமாறும் தேவையற்ற வெளிப்படைத்தன்மை இல்லாமலும் தமிழில் காக்கிறது.
- source_word: הַצֹּבְאוֹת
  choice: பணிபுரிந்துவந்த
  rationale: ஆலயச் சூழலில் ஒழுங்குபடுத்தப்பட்ட சேவையைச் சுட்டும் சாத்தியத்தை இயல்பாகத் தருகிறது; ‘கூடியிருந்த’ என்பதும் மொழியியல் ரீதியில் சாத்தியம்.
- source_word: פֶּתַח אֹהֶל מוֹעֵד
  choice: சந்திப்புக் கூடாரத்தின் நுழைவாயிலில்
  rationale: திருத்தலத்தைக் குறிக்கும் நிலையான சொற்றொடரை தெளிவான நவீன தமிழில் வழங்குகிறது.
theological_decisions:
- issue: திருத்தலத்தில் அந்தப் பெண்களின் பணி எத்தகையது
  choice: நுழைவாயிலில் பணிபுரிந்துவந்த பெண்கள்
  alternative: நுழைவாயிலில் கூடியிருந்த பெண்கள்
  rationale: הַצֹּבְאוֹת என்பது ஒழுங்குபடுத்தப்பட்ட சேவையையோ கூடிவருதலையோ குறிக்கலாம். யாத்திராகமம் 38:8-இன் ஒத்த பயன்பாட்டையும் திருத்தலச் சூழலையும் கருத்தில் கொண்டு ‘பணிபுரிந்துவந்த’ முதன்மை உரையில் வைக்கப்படுகிறது; பின்னாளைய பதவிப் பெயர் எதுவும் இதில் சேர்க்கப்படவில்லை.
- issue: பாலியல் தவறை எவ்வளவு வெளிப்படையாக மொழிபெயர்ப்பது
  choice: அவர்கள் படுத்துக்கொண்டது
  alternative: அவர்கள் பாலுறவு கொண்டது
  rationale: மூல எபிரெயம் மரபான மங்கலான சொல்லாட்சியைப் பயன்படுத்துகிறது. தமிழ் மொழிபெயர்ப்பு தவறை மறைக்காமலும் மூலத்தைவிட மருத்துவ அல்லது வெளிப்படையான நடைக்குச் செல்லாமலும் அதைப் பிரதிபலிக்கிறது.
translation_notes:
  register: நவீன தரநிலைத் தமிழில் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘படுத்துக்கொண்டது’ பாலியல் பொருளை உணர்த்தும் அதேவேளையில் மூலத்தின் மங்கலான சொல்லாட்சியைப் பாதுகாக்கிறது. அடிக்குறிப்புக் குறி அது விளக்கும் ‘பெண்களோடு’ என்ற தொடருக்குப் பின் வைக்கப்பட்டுள்ளது.
