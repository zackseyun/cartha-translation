source:
  edition: WLC
  text: מֵקִ֨ים מֵ/עָפָ֜ר דָּ֗ל מֵֽ/אַשְׁפֹּת֙ יָרִ֣ים אֶבְי֔וֹן לְ/הוֹשִׁיב֙ עִם נְדִיבִ֔ים וְ/כִסֵּ֥א כָב֖וֹד יַנְחִלֵ֑/ם כִּ֤י לַֽ/יהוָה֙ מְצֻ֣קֵי אֶ֔רֶץ וַ/יָּ֥שֶׁת עֲלֵי/הֶ֖ם תֵּבֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/008.yaml
  text: He raises the poor from the dust[a]; he lifts the needy from the ash heap, to seat them with nobles and make them inherit a seat of honor. For the pillars of the earth belong to Yahweh[b], and on them he has set the world.
translation:
  language: ta
  text: அவர் ஏழையைப் புழுதியிலிருந்து எழுப்புகிறார்; வறியவரைக் குப்பைமேட்டிலிருந்து உயர்த்துகிறார்; அவர்களைப் பிரபுக்களோடு அமரச்செய்து, கௌரவமான இருக்கையை[a] அவர்களுக்குச் சுதந்தரிக்கச் செய்கிறார். ஏனெனில் பூமியின் தூண்கள்[b] யாவேக்கே உரியவை; அவற்றின்மேல் அவர் உலகத்தை நிறுவினார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மகிமையின் அரியணையை.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “பூமியின் அஸ்திவாரங்கள்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵקִים מֵעָפָר דָּל
  choice: ஏழையைப் புழுதியிலிருந்து எழுப்புகிறார்
  rationale: காரணவினைச் செயப்பாட்டையும் தாழ்ந்த நிலையிலிருந்து உயர்த்தும் தெளிவான உருவகத்தையும் காக்கிறது.
- source_word: מֵאַשְׁפֹּת יָרִים אֶבְיוֹן
  choice: வறியவரைக் குப்பைமேட்டிலிருந்து உயர்த்துகிறார்
  rationale: אַשְׁפֹּת என்பது சாம்பலை மட்டும் அல்லாது கழிவுகள் கொட்டப்படும் மேட்டைக் குறிக்கலாம்; நவீன தமிழில் 'குப்பைமேடு' இழிவான நிலையைக் காட்டும் உருவகத்தை இயல்பாகப் பாதுகாக்கிறது.
- source_word: לְהוֹשִׁיב עִם נְדִיבִים
  choice: அவர்களைப் பிரபுக்களோடு அமரச்செய்து
  rationale: நְדִיבִים என்பதன் உயர்குடி அல்லது ஆட்சிசார் அந்தஸ்தை 'பிரபுக்கள்' தெரிவிக்கிறது; நோக்கம் அல்லது விளைவு என்ற உறவு இயல்பாகத் தொடர்கிறது.
- source_word: וְכִסֵּא כָבוֹד יַנְחִלֵם
  choice: மகிமையின் இருக்கையை அவர்களுக்கு உரிமையாக்குகிறார்
  rationale: נחל என்ற காரணவினையின் வாரிசுரிமை அல்லது உடைமையாக்கும் கருத்தைத் தக்கவைக்கிறது; כִּסֵּא என்பதிலுள்ள 'இருக்கை/அரியணை' தெளிவின்மையை முதன்மை உரையில் அளவுக்கு மீறி அரசராக்காமல் வழங்குகிறது.
- source_word: מְצֻקֵי אֶרֶץ
  choice: பூமியின் தூண்கள்
  rationale: பூமியைத் தாங்கும் அமைப்புகள் என்ற பண்டைய கவித்துவப் படிமத்தை விளக்கிச் சமப்படுத்தாமல் நேரடியாகக் காக்கிறது.
- source_word: וַיָּשֶׁת עֲלֵיהֶם תֵּבֵל
  choice: அவற்றின்மேல் அவர் உலகத்தை நிறுவியிருக்கிறார்
  rationale: שׁית என்பதன் வைப்பது அல்லது அமைப்பது என்ற பொருளையும் முடிவுற்ற செயலைக் குறிக்கும் எபிரெய வினையின் வலிமையையும் இயல்பான தமிழில் அளிக்கிறது.
- source_word: לַיהוָה
  choice: யாவேக்கே
  rationale: மூலத்தில் உள்ள தனிப்பட்ட இறைப் பெயரை மறைக்காமல் தமிழில் ஒலிபெயர்க்கிறது; உரிமையை வலியுறுத்தும் ל முன்னொட்டிற்கு 'க்கே உரியவை' எனத் தரப்பட்டுள்ளது.
theological_decisions:
- issue: מְצֻקֵי אֶרֶץ என்பதிலுள்ள அண்டவியல் படிமம்
  choice: பூமியின் தூண்கள்
  alternative: பூமியின் அஸ்திவாரங்கள்
  rationale: இது இறைவனின் இறையாண்மையைப் பண்டைய கவித்துவ உலகமைப்புப் படிமத்தால் தெரிவிக்கிறது. படிமத்தை அகற்றாமல் காப்பது மூலத்திற்கு வெளிப்படையான அணுகுமுறை.
- issue: כִסֵּא כָבוֹד என்பதன் அந்தஸ்துச் சொற்றொடர்
  choice: மகிமையின் இருக்கை
  alternative: மகிமையின் அரியணை
  rationale: כִּסֵּא என்பது இருக்கையையோ அரியணையையோ குறிக்கலாம். வசனம் ஏழை மற்றும் வறியவர்களின் உயர்வைப் பொதுவாகப் பேசுவதால் முதன்மை உரை அரச பதவியைத் தேவையின்றி குறிப்பாக்கவில்லை; மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- issue: இறைப் பெயர் יהוה
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூல எபிரெயத்தில் தனிப்பட்ட இறைப் பெயர் இருப்பதால் அதைத் தெளிவாக ஒலிபெயர்த்து, பட்டப்பெயராக மாற்றவில்லை.
translation_notes:
  register: நவீன தரமான, கண்ணியமான தமிழ்நடை பயன்படுத்தப்பட்டுள்ளது. எபிரெயக் கவிதையின் இணை அமைப்பும் சமூக நிலைமாற்றப் படிமமும் பாதுகாக்கப்பட்டுள்ளன; 'இருக்கை/அரியணை' மற்றும் 'தூண்கள்/அஸ்திவாரங்கள்' என்ற உண்மையான சொற்பொருள் மாற்றுகள் அடிக்குறிப்புகளில் தரப்பட்டுள்ளன.
