translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. வசனம் தனித்து வாசிக்கப்படும் நிலையிலும் தாய் மற்றும் அவன் குறித்த சுட்டுப்பெயர்கள் தெளிவாக இருக்க, 'சாமுவேலின் தாய்' என்று சூழல்சார் பெயராக்கம் பயன்படுத்தப்பட்டது. ஒரே [a] அடிக்குறிப்பு மூலமொழியின் மரபுத்தொடரை விளக்குகிறது.
