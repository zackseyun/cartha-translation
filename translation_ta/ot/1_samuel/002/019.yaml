  text: וּ/מְעִ֤יל קָטֹן֙ תַּעֲשֶׂה לּ֣/וֹ אִמּ֔/וֹ וְ/הַעַלְתָ֥ה ל֖/וֹ מִ/יָּמִ֣ים יָמִ֑ימָ/ה בַּֽ/עֲלוֹתָ/הּ֙ אֶת אִישָׁ֔/הּ לִ/זְבֹּ֖חַ אֶת זֶ֥בַח הַ/יָּמִֽים־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/019.yaml
  text: And his mother would make for him a small robe and bring it up to him from year to year[b][a], when she went up with her husband to offer the yearly sacrifice.
translation:
  language: ta
  text: சாமுவேலின் தாய் அவனுக்காக ஒரு சிறிய மேலங்கியைச் செய்து, ஆண்டுதோறும்[a] தன் கணவனோடு வருடாந்திரப் பலியைச் செலுத்த மேலே போகும்போது, அதை அவனிடம் கொண்டுபோவாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “நாட்களிலிருந்து நாட்களுக்கு”; இது “ஆண்டுதோறும்” என்று பொருள்படும் மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְעִיל
  choice: மேலங்கி
  rationale: வெளிப்புறத்தில் அணியும் ஆடையைக் குறிக்கிறது; இங்கு சிறுவனான சாமுவேலுக்குரிய ஆடை என்ற சூழலில் இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: קָטֹן
  choice: சிறிய
  rationale: சாமுவேலின் அளவுக்கேற்ற ஆடை என்பதை நேரடியாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: תַּעֲשֶׂה
  choice: செய்து ... கொண்டுபோவாள்
  rationale: எபிரெய இறந்தகாலத் தொடரில் இது வழக்கமாக மீண்டும் நிகழ்ந்த செயலைக் குறிக்கிறது; தமிழில் வினைமுற்று தொடரால் அந்த வழக்கச் செயல் இயல்பாக வெளிப்படுகிறது.
- source_word: וְהַעַלְתָה לּוֹ
  choice: அதை அவனிடம் கொண்டுபோவாள்
  rationale: ஆடையை அவனுக்காக எடுத்துச் சென்றதைக் கூறுகிறது; தொடர்ந்து வரும் 'மேலே போகும்போது' என்பதில் ஆலயப் பயணத்தின் ஏற்றம் தனியே பாதுகாக்கப்படுகிறது.
- source_word: מִיָּמִים יָמִימָה
  choice: ஆண்டுதோறும்
  rationale: சொல்லுக்குச் சொல் 'நாட்களிலிருந்து நாட்களுக்கு' என்றாலும், இது ஆண்டுதோறும் நிகழ்வதைக் குறிக்கும் எபிரெய மரபுத்தொடர்.
- source_word: בַּעֲלוֹתָהּ
  choice: மேலே போகும்போது
  rationale: வழிபாட்டிடத்துக்குச் செல்லும் யாத்திரைசார் ஏற்றத்தைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: אִישָׁהּ
  choice: தன் கணவனோடு
  rationale: உறவுச் சூழலில் אִישָׁהּ என்பதன் பொருள் 'அவளுடைய கணவன்'; தமிழின் எழுவாய் ஒத்திசைவுக்கு 'தன்' இயல்பானது.
- source_word: לִזְבֹּחַ
  choice: பலியைச் செலுத்த
  rationale: பலியிடும் வழிபாட்டுச் செயலை நவீனத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் தெரிவிக்கிறது.
- source_word: זֶבַח הַיָּמִים
  choice: வருடாந்திரப் பலி
  rationale: ஒழுங்காக ஆண்டுதோறும் செலுத்தப்பட்ட பலியைக் குறிக்கும் சொல்லாட்சிக்குத் தெளிவான தமிழாக்கம்.
