base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/035.yaml
  text: And I will raise up for myself a faithful priest[a], who will do according to what is in my heart and in my soul. And I will build for him a faithful house[b], and he will walk before my anointed all the days.
translation:
  language: ta
  text: எனக்கென்று உண்மையுள்ள ஒரு ஆசாரியனை எழுப்புவேன். அவன் என் இதயத்திலும் உள்ளத்திலும் இருப்பதற்கேற்ப செய்வான். அவனுக்காக நிலைத்திருக்கும் ஒரு வீட்டைக்[a] கட்டுவேன்; அவன் என் அபிஷேகம் செய்யப்பட்டவரின் முன்னிலையில் எல்லா நாட்களிலும் நடந்துகொள்வான்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “வீடு” என்பது இங்கு நிலைத்திருக்கும் குடும்பத்தையோ வழிமரபையோ குறிக்கலாம். எபிரேயத்தை இன்னும் சொல்லுக்குச் சொல்லாக, “உண்மையுள்ள ஒரு வீடு” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “என் அபிஷேகம் செய்யப்பட்டவர்” என்பதை “என் மேசியா” என்றும், இச்சூழலில் “என் ராஜா” என்றும் மொழிபெயர்க்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: וַהֲקִימֹתִי לִי
  choice: எனக்காக ... எழுப்புவேன்
  rationale: הקים என்பதன் ஒருவரை ஒரு பொறுப்பில் நிறுத்தும் பொருளையும், לִי என்பதன் இறை முன்முயற்சியையும் உரிமையையும் இயல்பான தமிழில் காக்கிறது.
- source_word: כֹּהֵן נֶאֱמָן
  choice: உண்மையுள்ள ஒரு ஆசாரியன்
  rationale: נֶאֱמָן குறிக்கும் நம்பகத்தன்மையையும் கடமைப்பற்றையும் ‘உண்மையுள்ள’ வெளிப்படுத்துகிறது; כֹּהֵן என்பதற்கான வழக்கமான வேதாகமத் தமிழ் ‘ஆசாரியன்’.
- source_word: כַּאֲשֶׁר בִּלְבָבִי וּבְנַפְשִׁי יַעֲשֶׂה
  choice: என் இதயத்திலும் என் உள்ளத்திலும் உள்ளபடி செய்வான்
  rationale: ‘இதயம்’ மற்றும் ‘உள்ளம்’ என்ற இணைப்பால் இறைவனுடைய சித்தம் மற்றும் ஆழ்ந்த விருப்பத்தைச் சுட்டும் மானுட உருவக மொழி காக்கப்படுகிறது; נפש-ஐ இங்கு இயல்பற்ற ‘ஆத்துமா’ எனக் குறுக்காமல் ‘உள்ளம்’ என வழங்குகிறது.
- source_word: וּבָנִיתִי לוֹ בַּיִת נֶאֱמָן
  choice: அவனுக்காக நிலைத்திருக்கும் ஒரு வீட்டைக் கட்டுவேன்
  rationale: בנה–בית என்ற ‘கட்டு–வீடு’ உருவகம் காக்கப்படுகிறது. இங்கு נֶאֱמָן, ஆசாரிய வம்சம் நீடித்து நிலைப்பதைக் குறிப்பதால் ‘நிலைத்திருக்கும்’ என்பது தமிழில் பொருளைத் தெளிவாக்குகிறது.
- source_word: וְהִתְהַלֵּךְ לִפְנֵי
  choice: முன்பாக ... நடந்துகொள்வான்
  rationale: התהלך குறிக்கும் தொடர்ந்த வாழ்க்கை அல்லது ஊழிய நடத்தையை ‘நடந்துகொள்வான்’ இயல்பாக வெளிப்படுத்துகிறது; לפני என்பதன் முன்னிலை/சந்நிதி சார்ந்த நுணுக்கமும் காக்கப்படுகிறது.
- source_word: מְשִׁיחִי
  choice: என் அபிஷேகம் செய்யப்பட்டவர்
  rationale: משיח என்பதன் அடிப்படைப் பொருளைத் தருகிறது; உடனடி வரலாற்றுச் சூழலில் இதை ‘மேசியா’ அல்லது ‘ராஜா’ என்று ஒரே குறிப்புக்குள் கட்டுப்படுத்தவில்லை.
- source_word: כָּל הַיָּמִים
  choice: எல்லா நாட்களிலும்
  rationale: எபிரேய தொடரின் காலநீட்சி வலியுறுத்தலை நெருக்கமாகக் காக்கிறது.
theological_decisions:
- issue: מְשִׁיחִי என்பவரின் அடையாளம்
  choice: என் அபிஷேகம் செய்யப்பட்டவர்
  alternative: என் மேசியா; என் ராஜா
  rationale: சொல்லின் அடிப்படைப் பொருளையும் குறிப்பிலுள்ள தெளிவின்மையையும் காக்கிறது. உடனடி சூழல் அபிஷேகம் பெற்ற ஆட்சியாளரைச் சுட்டக்கூடும்; விரிந்த திருமறை வாசிப்பு மேசியாவோடும் தொடர்பைக் காணலாம். முதன்மை உரை இவற்றில் ஒன்றை மட்டும் கட்டாயப்படுத்தவில்லை.
- issue: בַּיִת נֶאֱמָן என்பதன் உருவகம்
  choice: நிலைத்திருக்கும் ஒரு வீடு
  alternative: உண்மையுள்ள ஒரு வீடு; நிலையான குடும்பம் அல்லது வம்சம்
  rationale: ‘வீடு’ என்ற உருவகத்தைப் பாதுகாத்தபடியே, இச்சூழலில் נֶאֱמָן குறிக்கும் நீடித்த நிலைப்பாட்டைத் தெளிவாக்குகிறது. இது கட்டடத்தைவிட குடும்பம் அல்லது ஆசாரிய வழிமரபைக் குறிக்கலாம் என்பதை அடிக்குறிப்பு தெரிவிக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் கண்ணியமான, பொதுவாசகருக்குப் புரியும் நடை பயன்படுத்தப்பட்டது. ‘ஆசாரியன்’, ‘அபிஷேகம்’ போன்ற பரவலாக அறியப்பட்ட வேதாகமச் சொற்கள் வைக்கப்பட்டுள்ளன; எபிரேய உருவகங்களும் இறையியல் தெளிவின்மையும் இயன்றவரை காக்கப்பட்டுள்ளன.
