  text: גַּם֮ בְּ/טֶרֶם֮ יַקְטִר֣וּ/ן אֶת הַ/חֵלֶב֒ וּ/בָ֣א נַ֣עַר הַ/כֹּהֵ֗ן וְ/אָמַר֙ לָ/אִ֣ישׁ הַ/זֹּבֵ֔חַ תְּנָ֣/ה בָשָׂ֔ר לִ/צְל֖וֹת לַ/כֹּהֵ֑ן וְ/לֹֽא יִקַּ֧ח מִמְּ/ךָ֛ בָּשָׂ֥ר מְבֻשָּׁ֖ל כִּ֥י אִם חָֽי־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/015.yaml
  text: Even before they burned the fat[a], the priest’s servant would come and say to the man who was sacrificing, “Give meat for the priest to roast, for he will not take boiled meat from you, but only raw.”
translation:
  language: ta
  text: கொழுப்பை எரிப்பதற்கு முன்பே, ஆசாரியனின் பணியாள்[a] வந்து, பலியிடுகிறவனிடம், “ஆசாரியன் வாட்டுவதற்கு இறைச்சியைக் கொடு; அவன் உன்னிடமிருந்து வேகவைத்த இறைச்சியை எடுத்துக்கொள்ளமாட்டான்; பச்சை இறைச்சியைத்தான் எடுத்துக்கொள்வான்” என்று சொல்வான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது “ஆசாரியனின் இளைஞன்” அல்லது “ஆசாரியனின் உதவியாளர்.” எபிரெயச் சொல்லான נַעַר ஓர் இளைஞனையோ பணியாளையோ குறிக்கலாம்; இங்கு ஆசாரியன் சார்பில் செயல்பட்ட ஒருவரைக் குறிப்பதாகத் தெரிகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם בְּטֶרֶם
  choice: முன்பே
  rationale: גַּם இங்குள்ள முறைகேட்டின் தீவிரத்தை வலியுறுத்துகிறது; பְּטֶרֶם கால முன்னுரிமையைக் குறிக்கிறது. இயல்பான தமிழில் இரண்டையும் ‘முன்பே’ தெரிவிக்கிறது.
- source_word: יַקְטִרוּן אֶת־הַחֵלֶב
  choice: கொழுப்பைப் பலிபீடத்தில் எரிப்பதற்கு
  rationale: பலிக்குரிய கொழுப்புப் பகுதிகளைப் புகையாக எழும்பும்படி எரிக்கும் சடங்குச் செயலைக் குறிக்கிறது. ‘பலிபீடத்தில்’ என்பது சூழலைத் தெளிவாக்கும் மறைமுகத் தகவல்.
- source_word: נַעַר הַכֹּהֵן
  choice: ஆசாரியனின் பணியாள்
  rationale: נַעַר என்பது இளைஞன், பணியாள், உதவியாளர் ஆகிய பொருள்களைக் கொள்ளலாம்; இங்கு ஆசாரியன் சார்பில் செயல்படும் கீழ்நிலைப் பணியாளரைக் குறிப்பதால் ‘பணியாள்’ பொருத்தமானது. மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: לָאִישׁ הַזֹּבֵחַ
  choice: பலியிடுகிறவனிடம்
  rationale: பலியைச் செலுத்திக்கொண்டிருக்கும் நபரைச் சுட்டும் வினையெச்ச அமைப்பைச் சுருக்கமாகவும் இயல்பாகவும் வழங்குகிறது.
- source_word: תְּנָה בָשָׂר לִצְלוֹת לַכֹּהֵן
  choice: ஆசாரியன் வாட்டுவதற்கு இறைச்சி கொடு
  rationale: கட்டளைத் தொனியையும், இறைச்சியை நெருப்பில் வாட்டும் நோக்கத்தையும் நேரடியாகப் பாதுகாக்கிறது.
- source_word: וְלֹא יִקַּח מִמְּךָ בָּשָׂר מְבֻשָּׁל
  choice: அவன் உன்னிடமிருந்து வேகவைத்த இறைச்சியை வாங்கமாட்டான்
  rationale: יִקַּח என்பதன் ‘பெற்றுக்கொள்/எடுத்துக்கொள்’ பொருளை இச்சூழலில் இயல்பான ‘வாங்கு’ மூலம் வழங்குகிறது; מְבֻשָּׁל சமைத்தது என்ற பொதுப்பொருளைவிட வேகவைத்த இறைச்சியைத் துல்லியமாகக் குறிக்கிறது.
- source_word: כִּי אִם חָי
  choice: பச்சை இறைச்சியைத்தான் வாங்குவான்
  rationale: ‘வேகவைத்தது அல்ல, பச்சையானதே’ என்ற விலக்கும் வலியுறுத்தலும் தமிழில் ‘-ஐத்தான்’ மூலம் தெளிவாக வெளிப்படுகின்றன.
