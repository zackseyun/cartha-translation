translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. கட்டளையின் முரட்டுத்தன்மையும், முறையான பலிச்சடங்கிற்கு முன்பே இறைச்சி கோரப்பட்ட முறைகேட்டின் வலியுறுத்தலும் பாதுகாக்கப்பட்டுள்ளன.
