  text: וְ/הַ/נַּ֣עַר שְׁמוּאֵ֔ל הֹלֵ֥ךְ וְ/גָדֵ֖ל וָ/ט֑וֹב גַּ֚ם עִם יְהוָ֔ה וְ/גַ֖ם עִם אֲנָשִֽׁים־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/026.yaml
  text: The boy Samuel continued to grow, and he was good in the sight of both Yahweh and men[a][b].
translation:
  language: ta
  text: சிறுவன் சாமுவேல் தொடர்ந்து வளர்ந்து, யாவேவிடமும் மனிதர்களிடமும் நன்மதிப்பு பெற்று வந்தான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இதனை, “தொடர்ந்து வளர்ந்து, யாவேவிடமும் மனிதர்களிடமும் பிரியமானவனாக இருந்தான்” என்றும் மொழிபெயர்க்கலாம். எபிரெயத்தில், “யாவேவுடனும் மனிதர்களுடனும் நல்லவனாக” என்று உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַנַּעַר
  choice: சிறுவன்
  rationale: נַעַר என்பது இச்சூழலில் குழந்தைப் பருவத்திலுள்ள சாமுவேலைக் குறிக்கிறது; எனவே நவீன தமிழில் இயல்பான ‘சிறுவன்’ பொருத்தமானது. தொடக்க וְ தனியாக மொழிபெயர்க்கப்படாமல் தமிழ் உரைநடையில் இயல்பாக விடப்பட்டுள்ளது.
- source_word: שְׁמוּאֵל
  choice: சாமுவேல்
  rationale: தமிழ் வேதாகம மரபில் நன்கு அறியப்பட்ட பெயர்வடிவம் பயன்படுத்தப்பட்டுள்ளது.
- source_word: הֹלֵךְ וְגָדֵל
  choice: தொடர்ந்து வளர்ந்துவந்தான்
  rationale: הֹלֵךְ உடன் வரும் வினைச்சொல் படிப்படியாகத் தொடரும் செயலையோ முன்னேற்றத்தையோ குறிக்கிறது; ‘தொடர்ந்து ... வந்தான்’ அந்த நீடித்த தன்மையை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: וָטוֹב ... עִם
  choice: நன்மதிப்பைப் பெற்றுவந்தான்
  rationale: ‘ஒருவருடன் நல்லவனாக இருத்தல்’ என்ற எபிரெய மரபுத்தொடர் இங்கு அவருக்கு உகந்தவராக அல்லது அவர்களுடைய நன்மதிப்பைப் பெற்றவராக இருப்பதைக் குறிக்கிறது. தெய்வத்துடனும் மனிதர்களுடனும் உள்ள உறவை இயல்பாகச் சொல்ல ‘நன்மதிப்பைப் பெற்றுவந்தான்’ தேர்ந்தெடுக்கப்பட்டது; மூலத்தின் அதிக நேரடியான வடிவம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: גַּם עִם יְהוָה וְגַם עִם אֲנָשִׁים
  choice: யாவேவிடமும் மனிதர்களிடமும்
  rationale: மீண்டும் வரும் גַּם ... וְגַם அமைப்பு ‘இருவரிடமும்’ என்ற சமநிலையைத் தருகிறது. אֲנָשִׁים இங்கு பொதுவாக மனிதர்களைக் குறிக்கிறது; ‘மனிதர்களிடமும்’ என்பது அந்தப் பொருளைத் துல்லியமாகக் காக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: நான்கு எழுத்துகளாலான இறைப் பெயர் ஒரு பட்டமாக மாற்றப்படாமல், தமிழில் அதன் பரவலான ஒலிபெயர்ப்பு வடிவமான ‘யாவே’ என்று தரப்பட்டுள்ளது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூல உரை ஒரு பொதுப் பட்டத்தை அல்ல, இஸ்ரவேலின் இறைவனுடைய தனிப்பட்ட உடன்படிக்கைப் பெயரைப் பயன்படுத்துகிறது. எனவே அந்தப் பெயர் ஒலிபெயர்க்கப்பட்டுள்ளது.
- issue: וָטוֹב עִם என்பதன் உறவுசார் மதிப்பீடு
  choice: நன்மதிப்பைப் பெற்றுவந்தான்
  alternative: உகந்தவனாக இருந்தான்
  rationale: இந்தச் சொற்றொடர் சாமுவேலின் உள்ளார்ந்த ஒழுக்க நற்குணத்தை மட்டும் கூறாமல், யாவேவுடனும் மனிதர்களுடனும் அவர் பெற்ற சாதகமான மதிப்பீட்டையும் உறவையும் குறிக்கிறது. மாற்று வாசிப்பின் நேரடித்தன்மை அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான உரைநடை பயன்படுத்தப்பட்டுள்ளது. ‘நன்மதிப்பு’ என்பது மூலத்தின் உறவுசார் மதிப்பீட்டை இயல்பாகத் தெரிவிக்கிறது; அதே நேரத்தில் ‘உகந்தவன்/நல்லவன்’ என்ற அதிக நேரடியான சாத்தியம் அடிக்குறிப்பில் வைக்கப்பட்டுள்ளது.
