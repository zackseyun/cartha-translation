  text: And the lords of the Philistines were passing by by hundreds and by thousands[a], and David and his men were passing by at the rear with Achish.
translation:
  language: ta
  text: பெலிஸ்தியர்களின் தலைவர்கள் நூறு நூறாகவும் ஆயிரம் ஆயிரமாகவும் அணிவகுத்துச் சென்றார்கள்[a]. தாவீதும் அவனுடைய ஆட்களும் ஆகீசுடன் பின்புறத்தில் சென்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நூறு பேர் கொண்ட பிரிவுகளாகவும் ஆயிரம் பேர் கொண்ட பிரிவுகளாகவும்.” இது நூற்றுக்கணக்கான மற்றும் ஆயிரக்கணக்கான வீரர்களைக் கொண்ட இராணுவப் பிரிவுகளைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: סַרְנֵי
  choice: தலைவர்கள்
  rationale: பெலிஸ்திய நகர அரசுகளின் உயர்நிலை அரசியல்-இராணுவ ஆட்சியாளர்களைக் குறிக்கிறது; நவீன தமிழில் இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: פְלִשְׁתִּים
  choice: பெலிஸ்தியர்கள்
  rationale: இந்த மக்கள் இனத்திற்கான வழக்கமான தமிழ் பெயர்.
- source_word: עֹבְרִים
  choice: அணிவகுத்துச் சென்றார்கள்
  rationale: போர்ப்படைச் சூழலில் தொடர்ச்சியாகக் கடந்து செல்லும் காட்சியை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: לְמֵאוֹת וְלַאֲלָפִים
  choice: நூறு நூறாகவும் ஆயிரம் ஆயிரமாகவும்
  rationale: எபிரெயச் சொல்லமைப்பின் பகிர்வுப் பொருளைப் பாதுகாக்கிறது; இவை படைப்பிரிவுகளாகவும் புரிந்துகொள்ளப்படலாம் என்பதைக் குறிப்பில் தெரிவிக்கிறது.
- source_word: אֲנָשָׁיו
  choice: அவனுடைய ஆட்கள்
  rationale: தாவீதுடன் இருந்த ஆண் தோழர்களையும் போர்வீரர்களையும் இயல்பாகக் குறிக்கிறது; 'படைவீரர்கள்' என்பதைவிட சற்றுப் பரந்த பொருளைத் தக்கவைக்கிறது.
- source_word: בָּאַחֲרֹנָה
  choice: கடைசியில்
  rationale: அணிவகுப்பின் பின்புற அல்லது இறுதி நிலையை நெருக்கமாகத் தெரிவிக்கிறது.
- source_word: עִם אָכִישׁ
  choice: ஆகீசுடன்
  rationale: உடன்செல்லுதலை நேரடியாகவும் இயல்பாகவும் தெரிவிக்கிறது.
