  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. எபிரெய மொழியின் தொடர்ச்சியான அணிவகுப்புக் காட்சியும் எண்ணிக்கை சார்ந்த உண்மையான தெளிவின்மையும் பாதுகாக்கப்பட்டுள்ளன.
