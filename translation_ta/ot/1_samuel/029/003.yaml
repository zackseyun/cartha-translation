  yaml_path: translation/ot/1_samuel/029/003.yaml
  text: Then the Philistine commanders said[a], “What are these Hebrews?” And Achish said to the Philistine commanders, “Is this not David, the servant of Saul king of Israel, who has been with me these days or these years? And I have found nothing against him from the day of his defecting until this very day.”
translation:
  language: ta
  text: அப்போது பெலிஸ்தியத் தளபதிகள், “இந்த எபிரெயர்கள் எதற்கு?” என்று கேட்டார்கள். அதற்கு ஆகீஸ் பெலிஸ்தியத் தளபதிகளிடம், “இவன் இஸ்ரவேலின் அரசனான சவுலின் பணியாளன் தாவீது அல்லவா? இவன் என்னோடு சில நாட்களாகவோ சில ஆண்டுகளாகவோ இருந்திருக்கிறான். இவன் என் பக்கம் வந்துசேர்ந்த[a] நாள் முதல் இன்றுவரை இவனிடம் எந்தக் குற்றத்தையும் நான் காணவில்லை” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'சொல்லுக்குச் சொல்: “அவன் விழுந்த நாள் முதல்.” இங்கு இது ஆகீஸின் பக்கம் வந்து சேர்ந்ததையோ கட்சி மாறியதையோ குறிக்கிறது.'
    reason: מִיּוֹם נָפְלוֹ என்பதிலுள்ள ‘விழுதல்’ என்ற உருவகத்தைத் தருவதோடு, சூழலுக்கேற்ற அரசியல்-இராணுவப் பொருள் வரம்பையும் விளக்குகிறது.
lexical_decisions:
- source_word: שָׂרֵי פְלִשְׁתִּים
  choice: பெலிஸ்தியத் தளபதிகள்
  rationale: போர்ச்சூழலில் שָׂרִים உயர்நிலை இராணுவத் தலைவர்களைக் குறிக்கிறது; ‘தளபதிகள்’ நவீன தமிழில் இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: מָה הָעִבְרִים הָאֵלֶּה
  choice: இந்த எபிரெயர்கள் எதற்கு?
  rationale: எபிரெய உரை வேண்டுமென்றே சுருக்கமான, சந்தேகம் தொனிக்கும் கேள்வியாக உள்ளது. ‘இங்கே என்ன செய்கிறார்கள்?’ என்ற விளக்கத்தைச் சேர்க்காமல் அதன் இடைவெளியை ஓரளவு காக்கிறது.
- source_word: הָעִבְרִים
  choice: எபிரெயர்கள்
  rationale: பெலிஸ்தியர்களின் பார்வையைப் பிரதிபலிக்கும் இனப்பெயரையே காக்கிறது; ‘இஸ்ரவேலர்’ என்று மாற்றவில்லை.
- source_word: עֶבֶד
  choice: பணியாளன்
  rationale: இங்கு சவுலுடனான அரண்மனை மற்றும் அரசியல் உறவே முன்னிலைப்படுகிறது; அடிமை நிலையை வலியுறுத்தாத இயல்பான சொல்.
- source_word: זֶה יָמִים אוֹ זֶה שָׁנִים
  choice: இத்தனை நாட்களோ இத்தனை ஆண்டுகளோ
  rationale: ‘நாட்களோ ஆண்டுகளோ’ என்ற மூலத்தின் அசாதாரணமான மாற்று அமைப்பையும் வலியுறுத்தலையும் தமிழில் காக்கிறது.
- source_word: מְאוּמָה
  choice: எந்தக் குற்றத்தையும்
  rationale: சொற்பொருள் ‘எதுவும்’ என்றாலும், ஆகீஸ் தாவீதுக்கு எதிராகக் குற்றமோ குறையோ காணவில்லை என்பதே சூழல்சார் பொருள்.
- source_word: מִיּוֹם נָפְלוֹ
  choice: இவன் என் பக்கம் வந்துசேர்ந்த நாள் முதல்
  rationale: ‘விழுதல்’ என்ற மூல வினை இராணுவ-அரசியல் சூழலில் ஒருவரது பக்கம் வந்து சேருதல் அல்லது கட்சி மாறுதல் எனப் பொருள்படும்; மூல உருவகம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: இன்றுவரை
  rationale: எபிரெய காலச்சொற்றொடரின் இயல்பான நவீனத் தமிழ் வடிவம்.
- source_word: אָכִישׁ / דָוִד / שָׁאוּל
  choice: ஆகீஸ் / தாவீது / சவுல்
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் பரவலாக அறியப்படும் பெயர் வடிவங்கள்.
