base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/029/006.yaml
  text: Then Achish called David and said to him[a], “As Yahweh lives, you are upright, and your going out and your coming in with me in the camp is good in my sight; for I have not found any evil in you from the day of your coming to me to this day. But in the eyes of the lords of the Philistines[c][b], you are not good.”
translation:
  language: ta
  text: அப்போது ஆகீஸ் தாவீதை அழைத்து அவனிடம், “யாவே உயிரோடிருக்கிறபடியே, நீ நேர்மையானவன். நீ என்னோடு படைமுகாமில் புறப்பட்டுச் செல்வதும் வருவதும் என் பார்வைக்கு நல்லதாக உள்ளது. ஏனெனில், நீ என்னிடம் வந்த நாள் முதல் இன்றுவரை உன்னில் எந்தத் தீமையையும் நான் காணவில்லை. ஆனால் பெலிஸ்தியரின் தலைவர்களின்[b] பார்வையில் நீ நல்லவனாக இல்லை[c]” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: எபிரெயச் சொல் பெலிஸ்தியரின் முதன்மை ஆட்சியாளர்களுக்குப் பயன்படுத்தப்பட்ட தனிப்பட்ட பட்டமாகும்.
    reason: cultural_note
  - marker: c
    text: அதாவது, “நீ அவர்களுக்கு ஏற்றுக்கொள்ளத்தக்கவனாக இல்லை” என்றும் பொருள் கொள்ளலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: חַי יְהוָה
  choice: யெகோவா உயிரோடிருப்பது நிச்சயமென்பதுபோல
  rationale: இது உறுதிமொழிக்கான எபிரெய வழக்குத்தொடர். தமிழில் அதன் சத்தியப்பிரமாண வலிமையையும் தெய்வீகப் பெயரையும் வெளிப்படையாகப் பேணுகிறது.
- source_word: יָשָׁר
  choice: நேர்மையானவன்
  rationale: ஒழுக்க நேர்மையையும் குற்றமற்ற நடத்தையையும் குறிக்கும்; இச்சூழலில் இயல்பான நவீனத் தமிழ்.
- source_word: טוֹב בְּעֵינַי
  choice: என் பார்வைக்கு நல்லதாக இருந்தது
  rationale: மூலத்தின் ‘என் கண்களில் நல்லது’ என்ற மதிப்பீட்டு உருவகத்தை வாசிக்கத்தக்க தமிழில் பேணுகிறது.
- source_word: צֵאתְךָ וּבֹאֲךָ
  choice: நீ ... சென்று வந்தது
  rationale: ‘உன் புறப்படுதலும் வருதலும்’ என்ற இணைச்சொல்லின் வடிவத்தை இயல்பான தமிழில் பிரதிபலிக்கிறது; இது நடத்தையையோ படைச் செயல்பாட்டையோ குறிக்கலாம்.
- source_word: אִתִּי בַּמַּחֲנֶה
  choice: என்னோடு இந்தப் படைமுகாமில்
  rationale: מַחֲנֶה என்பதன் முகாம் என்ற நேரடிப் பொருளையும் இராணுவச் சூழலையும் ஒருசேர தெளிவாக்குகிறது.
- source_word: לֹא מָצָאתִי בְךָ רָעָה
  choice: உன்னில் எந்தத் தீமையையும் நான் காணவில்லை
  rationale: மூலத்தின் ‘உன்னில் தீமையைக் காணவில்லை’ என்ற வலுவான ஒழுக்க மொழியைப் பேணுகிறது.
- source_word: מִיּוֹם בֹּאֲךָ אֵלַי עַד הַיּוֹם הַזֶּה
  choice: நீ என்னிடம் வந்த நாள் முதல் இன்றுவரை
  rationale: எபிரெய காலவரம்பைச் சுருக்கமின்றி இயல்பான தமிழில் தருகிறது.
- source_word: סְרָנִים
  choice: பெலிஸ்திய ஆட்சியாளர்கள்
  rationale: பெலிஸ்திய நகர-அரசுகளின் தலைவர்களுக்குப் பயன்படுத்தப்பட்ட தனித்துவமான பட்டத்தை நவீன வாசகருக்குத் தெளிவாகத் தெரிவிக்கிறது.
- source_word: לֹא טוֹב אָתָּה
  choice: நீ நல்லவனாக இல்லை
  rationale: மூலத்தின் சுருக்கமான, நேரடியான சொல்லாட்சியைப் பேணுகிறது; சூழலில் ‘ஏற்றுக்கொள்ளத்தக்கவனாக இல்லை’ என்பதே கருத்து.
theological_decisions:
- issue: பெலிஸ்திய அரசன் கூறும் உறுதிமொழியில் வரும் יהוה என்ற தெய்வீகப் பெயர்
  choice: யெகோவா
  alternative: யாவே
  rationale: மூலத்தில் பொதுப்பட்டம் அல்ல, நான்கு எழுத்துத் தெய்வீகப் பெயரே உள்ளது. தமிழில் பரவலாக அறியப்பட்ட பெயர்வடிவமான ‘யெகோவா’ பயன்படுத்தப்பட்டு, ‘கர்த்தர்’ போன்ற பட்டத்தால் மாற்றப்படவில்லை.
- issue: לֹא טוֹב אָתָּה என்பதின் மதிப்பீட்டு தெளிவின்மை
  choice: நீ நல்லவனாக இல்லை
  alternative: நீ அவர்களுக்கு ஏற்றுக்கொள்ளத்தக்கவனாக இல்லை
  rationale: ஆட்சியாளர்கள் தாவீதை ஏற்கவில்லை என்பது சூழல்பொருள்; ஆனால் மூலத்தின் திட்டமிட்ட சுருக்கத்தையும் ‘நல்லது’ என்ற முந்தைய சொல்லுடனான எதிரொலியையும் பிரதான உரை பேணுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் ‘பார்வையில்’, ‘நல்லது’, ‘தீமை’ ஆகிய சொல் எதிரொலிகள் பேணப்பட்டுள்ளன; ‘சென்று வந்தது’ என்ற வழக்குத்தொடரின் தெளிவின்மை அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது.
