base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/029/001.yaml
  text: The Philistines gathered all their camps at Aphek[b][a], while Israel was encamped by the spring that is in Jezreel.
translation:
  language: ta
  text: பெலிஸ்தியர்கள் தங்கள் முகாம்கள்[a] அனைத்தையும் ஆப்பேக்கில் ஒன்றுகூட்டினார்கள்; இஸ்ரவேலரோ யெஸ்ரயேலில் உள்ள நீரூற்றருகே முகாமிட்டிருந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “தங்கள் படைகள் அனைத்தையும்” அல்லது “தங்கள் படைப்பிரிவுகள் அனைத்தையும்” என்றும் மொழிபெயர்க்கலாம்; எபிரெய மொழியில் நேரடியாக “தங்கள் முகாம்கள் அனைத்தையும்” என்று உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְבְּצוּ
  choice: ஒன்றுகூட்டினார்கள்
  rationale: קבץ என்பது ஒன்றாகச் சேர்த்தல் அல்லது திரட்டுதல் என்பதைக் குறிக்கிறது. இராணுவ நடைமுறையை அளவுக்கு மீறிக் குறிப்பாக்காமல் அடிப்படைப் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: פְלִשְׁתִּים
  choice: பெலிஸ்தியர்கள்
  rationale: மக்களினத்தின் பெயருக்கான தமிழில் நிலைபெற்ற வடிவம்.
- source_word: כָּל מַחֲנֵיהֶם
  choice: தங்கள் முகாம்கள் அனைத்தையும்
  rationale: מַחֲנֶה என்பதன் நேரடிப் பொருள் ‘முகாம்/பாளையம்’. சூழலில் படைப்பிரிவுகள் அல்லது படைகள் எனப் புரிந்துகொள்ள வாய்ப்பிருந்தாலும், எபிரெயச் சொல்லின் உருவகத் தெளிவின்மையை ‘முகாம்கள்’ காக்கிறது.
- source_word: אֲפֵקָה
  choice: ஆப்பேக்கில்
  rationale: இடப்பெயரை ஒலிபெயர்த்து, திசைச் சுட்டும் -ה வடிவத்தை இச்சூழலில் இயல்பான தமிழ் இடவேற்றுமையால் மொழிபெயர்க்கிறது.
- source_word: וְיִשְׂרָאֵל
  choice: இஸ்ரவேலரோ
  rationale: வாவ் இணைப்பின் ஒரே நேர நிகழ்வையும் காட்சிகளுக்கிடையிலான மாறுபாட்டையும் ‘-ரோ’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: חֹנִים
  choice: முகாமிட்டிருந்தார்கள்
  rationale: பன்மை வினையெச்சம் இஸ்ரவேல் மக்களைச் சுட்டுகிறது; தொடர்ந்திருந்த இராணுவ முகாம் நிலையை தமிழ் இறந்தகாலத் தொடர்நிலையால் தருகிறது.
- source_word: בַּעַיִן
  choice: நீரூற்றருகே
  rationale: עַיִן இங்கு இயற்கையான ஊற்று அல்லது நீரூற்றைக் குறிக்கிறது. ‘நீரூற்று’ நவீனத் தமிழில் புவியியல் நீராதாரத்தைத் தெளிவாகக் காட்டுகிறது.
- source_word: אֲשֶׁר בְּיִזְרְעֶאל
  choice: யெஸ்ரயேலில் உள்ள
  rationale: ஊற்றின் இருப்பிடத்தைச் சுட்டும் தொடர்புச் சொற்றொடரைச் சுருக்கமான, இயல்பான தமிழில் தருகிறது.
