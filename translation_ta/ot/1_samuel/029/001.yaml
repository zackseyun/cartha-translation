  register: நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான வரலாற்று நடையைக் கடைப்பிடிக்கிறது. மூலத்தில் தனியான ‘இப்போது’ என்ற காலச்சொல் இல்லாததால் அதைச் சேர்க்கவில்லை. வாசகத்தில் உள்ள [a] குறிப்பு ‘முகாம்கள்’ என்பதன் இராணுவச் சூழல் மாற்றுப் பொருள்களைப் பதிவு செய்கிறது.
