  text: וַ/יֹּ֨אמֶר דָּוִ֜ד אֶל אָכִ֗ישׁ כִּ֣י מֶ֤ה עָשִׂ֨יתִי֙ וּ/מַה מָּצָ֣אתָ בְ/עַבְדְּ/ךָ֔ מִ/יּוֹם֙ אֲשֶׁ֣ר הָיִ֣יתִי לְ/פָנֶ֔י/ךָ עַ֖ד הַ/יּ֣וֹם הַ/זֶּ֑ה כִּ֣י לֹ֤א אָבוֹא֙ וְ/נִלְחַ֔מְתִּי בְּ/אֹיְבֵ֖י אֲדֹנִ֥/י הַ/מֶּֽלֶךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/029/008.yaml
  text: David said to Achish[a], “But what have I done? And what have you found against your servant from the day I entered your service until this day[b], that I should not go and fight against the enemies of my lord the king?”
translation:
  language: ta
  text: தாவீது ஆகீசிடம், “ஆனால் நான் என்ன செய்தேன்? நான் உமக்கு முன்பாக இருந்த நாள்முதல் இன்றுவரை உமது அடியேனில் என்ன குற்றத்தைக் கண்டீர்? என் ஆண்டவராகிய அரசரின்[a] பகைவர்களுக்கு எதிராகப் போய்ப் போரிட நான் ஏன் கூடாது?” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “என் ஆண்டவராகிய அரசர்” என்பது தாவீது கூறியபடியே விடப்பட்டுள்ளது. அது ஆகீசை நேரடியாகக் குறிக்கலாம்; கதையின் சூழலில் திட்டமிட்ட இருபொருள் தன்மையையும் கொண்டிருக்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי מֶה עָשִׂיתִי
  choice: ஆனால் நான் என்ன செய்தேன்?
  rationale: כִּי இங்கு முந்தைய கூற்றுக்கு எதிரான தாவீதின் மறுப்பை அறிமுகப்படுத்துகிறது; நவீன தமிழில் ‘ஆனால்’ அந்த உரையாடல் வலிமையை இயல்பாகக் காட்டுகிறது.
- source_word: וּמַה מָּצָאתָ בְעַבְדְּךָ
  choice: உமது அடியேனிடம் என்ன குற்றத்தைக் கண்டீர்?
  rationale: מצא + ב இச்சூழலில் குற்றமோ குறையோ கண்டுபிடித்தல் என்ற பொருளைத் தருகிறது. ‘குற்றம்’ என்பது உட்கிடையான எதிர்மறைப் பொருளைத் தெளிவாக்குகிறது; ‘அடியேன்’ அரசரிடம் பேசும் பணிவான தன்மைக் குறிப்பைத் தக்கவைக்கிறது.
- source_word: מִיּוֹם אֲשֶׁר הָיִיתִי לְפָנֶיךָ עַד הַיּוֹם הַזֶּה
  choice: நான் உமக்கு முன்பாக இருந்த நாள்முதல் இன்றுவரை
  rationale: எபிரெயச் சொற்றொடரின் ‘உமக்கு முன்பாக இருந்தேன்’ என்ற வடிவைத் தமிழில் இயல்பாகவும், ‘உமது சேவையில் சேர்ந்தேன்’ என்ற கூடுதல் விளக்கத்தைப் புகுத்தாமலும் வழங்குகிறது.
- source_word: כִּי לֹא אָבוֹא וְנִלְחַמְתִּי
  choice: போய்ப் போரிட நான் ஏன் அனுமதிக்கப்படவில்லை?
  rationale: இறுதி כִּי தாவீதின் குறைமுறையீட்டின் விளைவைக் காட்டுகிறது. நேரடி எபிரெய வடிவின் நோக்கம், போருக்குச் செல்ல அவர் தடுக்கப்பட்டதைக் கேள்வியாக வெளிப்படுத்துவதாகும்.
- source_word: בְּאֹיְבֵי אֲדֹנִי הַמֶּלֶךְ
  choice: அரசராகிய என் ஆண்டவரின் பகைவர்களுக்கு எதிராக
  rationale: נלחם உடன் ב எதிர்த்துப் போரிடும் தரப்பைக் குறிக்கிறது. אֲדֹנִי என்பது இங்கு மனித அரசருக்குரிய மரியாதைமிக்க ‘என் ஆண்டவர்’; அதன் சாத்தியமான குறிப்பை மொழிபெயர்ப்பு தீர்மானிக்கவில்லை.
theological_decisions:
- issue: ‘அரசராகிய என் ஆண்டவர்’ யாரைக் குறிக்கிறது என்பதும் அதன் சொல்லாட்சியின் நோக்கமும்
  choice: குறிப்பவரை அடையாளப்படுத்தாமல், தாவீது கூறிய மரியாதைத் தொடரை அப்படியே தக்கவைத்தல்
  alternative: அது ஆகீசை நேர்மையாகக் குறிக்கிறது என்று வெளிப்படையாக மொழிபெயர்த்தல்; அல்லது வேறொருவரையும் குறிக்கக்கூடிய திட்டமிட்ட இருபொருள் என்று விளக்குதல்
  rationale: எபிரெய உரை தாவீதின் உள்ளார்ந்த நோக்கத்தைத் தெரிவிக்கவில்லை. குறிப்பவரைத் தீர்மானிக்காமல் விடுவது கதையின் உண்மையான பதற்றத்தையும் இருபொருள் சாத்தியத்தையும் காக்கிறது.
translation_notes:
  register: நவீன, கண்ணியமான உரைநடை பயன்படுத்தப்பட்டுள்ளது. அரசரிடம் பேசும் சூழலைக் காட்ட ‘உமது’, ‘கண்டீர்’, ‘அடியேன்’ ஆகிய மரியாதை வடிவங்கள் தேர்ந்தெடுக்கப்பட்டுள்ளன. அடிக்குறி குறிக்கும் சொற்றொடருக்குப் பின் [a] இடப்பட்டுள்ளது.
