base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/029/011.yaml
  text: So David rose early[a], he and his men, to leave in the morning and return to the land of the Philistines[b]. And the Philistines went up to Jezreel.
translation:
  language: ta
  text: ஆகவே தாவீதும் அவனுடைய ஆட்களும் காலையில் சீக்கிரமாக எழுந்து, பெலிஸ்தியரின் நாட்டுக்குத் திரும்பிச் செல்வதற்காகப் புறப்பட்டார்கள்.[a] பெலிஸ்தியர்கள் யெஸ்ரயேலுக்கு ஏறிச் சென்றார்கள்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இதை இன்னும் சொற்சார்பாக, “காலையில் சென்று பெலிஸ்தியரின் நாட்டுக்குத் திரும்பவும்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “ஏறிச் சென்றார்கள்” என்பது ஓர் இடத்தை நோக்கிய நகர்வைக் குறிக்கும் எபிரெய மரபுத்தொடரைப் பிரதிபலிக்கிறது; இங்கு நில அமைப்பு அல்லது படை நகர்வு சார்ந்த நுண்பொருள் இருக்கலாம். “யெஸ்ரயேலுக்கு அணிவகுத்துச் சென்றார்கள்” என்பது மற்றொரு சாத்தியம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁכֵּם
  choice: காலையில் சீக்கிரமாக எழுந்து
  rationale: שׁכם என்பதன் ஹிஃபில் வடிவம் பொதுவாக அதிகாலையில் எழுவதையோ சீக்கிரமாகப் புறப்படுவதையோ குறிக்கிறது. தமிழில் காலைக் குறிப்பையும் சீக்கிரம் என்ற அழுத்தத்தையும் இயல்பாகப் பாதுகாக்கிறது.
- source_word: הוּא וַאֲנָשָׁיו
  choice: தாவீதும் அவனுடைய ஆட்களும்
  rationale: இங்குள்ள אֲנָשָׁיו தாவீதுடன் இருந்த ஆண் குழுவினரைக் குறிக்கிறது; வீட்டுப் பணியாளர்கள் என்ற குறுகிய பொருளைச் சேர்க்காமல் ‘ஆட்கள்’ என்பது சூழலுக்கு இயல்பானது.
- source_word: לָלֶכֶת ... לָשׁוּב
  choice: திரும்பிச் செல்வதற்காகப் புறப்பட்டார்கள்
  rationale: இரு எபிரெய முடிவிலா வினைகளும் புறப்படுதலையும் திரும்பிச் செல்வதன் நோக்கத்தையும் தெரிவிக்கின்றன. தமிழில் இந்த நோக்கத் தொடர்பை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: אֶל אֶרֶץ פְּלִשְׁתִּים
  choice: பெலிஸ்தியரின் நாட்டுக்கு
  rationale: ‘நாடு’ என்பது אֶרֶץ என்பதன் concrete sense-ஐப் பாதுகாக்கிறது; குறிப்பிட்ட நகரத்தை அல்ல, பெலிஸ்தியரின் நிலப்பகுதியைப் பொதுவாகக் குறிக்கிறது.
- source_word: וּפְלִשְׁתִּים
  choice: பெலிஸ்தியரோ
  rationale: ‘-ரோ’ அடுத்த காட்சியில் தாவீதின் குழுவிலிருந்து பெலிஸ்தியரிடம் மாறும் கதையோட்டத்தையும் இரு தரப்பினரின் வேறுபட்ட நகர்வையும் இயல்பாகக் காட்டுகிறது.
- source_word: עָלוּ
  choice: ஏறிச் சென்றார்கள்
  rationale: עלה என்பதன் அடிப்படை நகர்வுப் பொருளைப் பாதுகாக்கிறது; நில அமைப்பு அல்லது படை நகர்வு என்ற இரு சாத்தியங்களிலும் ஒன்றை மட்டும் தீர்மானிக்கவில்லை.
- source_word: יִזְרְעֶאל
  choice: யெஸ்ரயேல்
  rationale: இடப்பெயரின் தமிழில் வழக்கமான ஒலிபெயர்ப்பு.
