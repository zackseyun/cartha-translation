translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான கதையுரை பயன்படுத்தப்பட்டது. மூலத்தில் உள்ள ‘சீக்கிரமாக எழுதல்’ மற்றும் ‘காலையில்’ என்ற நேரக் கூறுகள் ஒன்றிணைந்த இயல்பான தொடராக வழங்கப்பட்டன; எபிரெய முடிவிலா வினைகளின் அதிக சொற்சார்பான அமைப்பு அடிக்குறிப்பில் பாதுகாக்கப்பட்டது. עָלוּ என்பதிலுள்ள நிலவியல்/இராணுவ நுண்பொருள் பிரதான உரையில் தீர்மானிக்கப்படாமல் விடப்பட்டது.
