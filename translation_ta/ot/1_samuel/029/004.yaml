- from: ஆனால் பெலிஸ்தியத் தளபதிகள் அவன்மீது கோபமடைந்தார்கள். அவர்கள் அவனிடம், “இந்த மனிதனைத் திருப்பி அனுப்பிவிடும். நீ அவனை நியமித்த இடத்திற்கே அவன் திரும்பிப் போகட்டும். போரில் அவன் நமக்கு எதிரியாகிவிடாதபடி, எங்களுடன் போருக்கு வர வேண்டாம்.[a] இந்த மனிதன் எதைக் கொண்டு தன் தலைவனின் தயவை மீண்டும் பெற முடியும்?[b] அந்த வீரர்களின் தலைகளைக் கொண்டுதானே?” என்றார்கள்.
  to: ஆனால் பெலிஸ்தியத் தளபதிகள் அவன்மீது கோபமடைந்தார்கள். பெலிஸ்தியத் தளபதிகள் அவனிடம், “இந்த மனிதனைத் திருப்பி அனுப்பிவிடும். நீ அவனை நியமித்த இடத்திற்கே அவன் திரும்பிப் போகட்டும். அவன் எங்களுடன் போருக்குச் செல்லக்கூடாது; போரில் அவன் நமக்கு எதிரியாகிவிடக்கூடாது.[a] இந்த மனிதன் எதைக் கொண்டு தன் தலைவனின் தயவை மீண்டும் பெற முடியும்?[b] அந்த மனிதர்களின் தலைகளைக் கொண்டுதானே?” என்றார்கள்.
  rationale: The revision preserves the Hebrew prohibition and adversary clause with clearer Tamil syntax, retains the common-noun sense of שָׂטָן, and removes the interpretive narrowing of “those men” to “warriors.” The rhetorical force and the deliberately stark reference to heads are retained without elaboration.
