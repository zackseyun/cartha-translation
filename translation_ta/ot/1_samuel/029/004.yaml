  text: וַ/יִּקְצְפ֨וּ עָלָ֜י/ו שָׂרֵ֣י פְלִשְׁתִּ֗ים וַ/יֹּ֣אמְרוּ ל/וֹ֩ שָׂרֵ֨י פְלִשְׁתִּ֜ים הָשֵׁ֣ב אֶת הָ/אִ֗ישׁ וְ/יָשֹׁב֙ אֶל מְקוֹמ/וֹ֙ אֲשֶׁ֣ר הִפְקַדְתּ֣/וֹ שָׁ֔ם וְ/לֹֽא יֵרֵ֤ד עִמָּ֨/נוּ֙ בַּ/מִּלְחָמָ֔ה וְ/לֹא יִֽהְיֶה לָּ֥/נוּ לְ/שָׂטָ֖ן בַּ/מִּלְחָמָ֑ה וּ/בַ/מֶּ֗ה יִתְרַצֶּ֥ה זֶה֙ אֶל אֲדֹנָ֔י/ו הֲ/ל֕וֹא בְּ/רָאשֵׁ֖י הָ/אֲנָשִׁ֥ים הָ/הֵֽם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/029/004.yaml
  text: But the Philistine commanders were angry with him[a], and the Philistine commanders said to him, “Send the man back, so that he may return to his place where you assigned him, and let him not go down with us into battle, lest he become an adversary to us in the battle[b]. For with what could this man reconcile himself to his lord? Would it not be with the heads of those men?”
translation:
  language: ta
  text: ஆனால் பெலிஸ்தியத் தளபதிகள் அவன்மீது கோபமடைந்தார்கள். பெலிஸ்தியத் தளபதிகள் அவனிடம், “இந்த மனிதனைத் திருப்பி அனுப்பிவிடும். நீ அவனை நியமித்த இடத்திற்கே அவன் திரும்பிப் போகட்டும். அவன் எங்களுடன் போருக்குச் செல்லக்கூடாது; போரில் அவன் நமக்கு எதிரியாகிவிடக்கூடாது.[a] இந்த மனிதன் எதைக் கொண்டு தன் தலைவனின் தயவை மீண்டும் பெற முடியும்?[b] அந்த மனிதர்களின் தலைகளைக் கொண்டுதானே?” என்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இங்கு ‘எதிரி’ என மொழிபெயர்க்கப்பட்டுள்ள שָׂטָן என்ற எபிரேயச் சொல், எதிர்ப்பவர் அல்லது பகைவன் என்பதைக் குறிக்கும் பொதுப்பெயர்; ‘சாத்தான்’ என்ற தனிப்பெயர் அல்ல.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “தன் தலைவனிடம் மீண்டும் ஏற்றுக்கொள்ளப்பட முடியும்?” இந்த எபிரேயச் சொற்றொடர் மேலதிகாரியின் தயவை அல்லது ஏற்றுக்கொள்ளுதலை மீண்டும் பெறுவதைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְצְפוּ עָלָיו
  choice: அவன்மீது கோபமடைந்தார்கள்
  rationale: קצף என்பதன் கோபம் அல்லது கடுஞ்சினம் என்ற பொருளை மிகைப்படுத்தாமல் இயல்பான நவீன தமிழில் தருகிறது.
- source_word: שָׂרֵי פְלִשְׁתִּים
  choice: பெலிஸ்தியத் தளபதிகள்
  rationale: போர் சார்ந்த உடனடிச் சூழலில் שָׂרִים என்பது அரசியல்-இராணுவத் தலைவர்களைக் குறிக்கிறது; ‘தளபதிகள்’ சூழலுக்கு இயல்பாகப் பொருந்துகிறது.
- source_word: הָשֵׁב אֶת הָאִישׁ
  choice: இந்த மனிதனைத் திருப்பி அனுப்பிவிடும்
  rationale: שוב என்பதன் ஹிஃபில் கட்டளை வடிவிலுள்ள ‘திரும்பச் செய்’ என்ற காரணவினைப் பொருளையும் கட்டளையின் வலிமையையும் தெளிவாகக் காட்டுகிறது.
- source_word: וְיָשֹׁב אֶל מְקוֹמוֹ
  choice: அவன் திரும்பிப் போகட்டும்
  rationale: கட்டளையைத் தொடர்ந்து வரும் நோக்கம் அல்லது அனுமதிப்பொருளை இயல்பான தமிழ் வியங்கோள் வடிவில் தருகிறது.
- source_word: אֲשֶׁר הִפְקַדְתּוֹ שָׁם
  choice: நீ அவனை நியமித்த இடம்
  rationale: הפקיד என்பதன் நியமித்தல், பொறுப்பில் வைத்தல், ஓர் இடத்தில் அமர்த்துதல் ஆகிய பொருள் வீச்சை ‘நியமித்த’ என்பது தேவையின்றிக் குறுக்காமல் தக்கவைக்கிறது.
- source_word: וְלֹא יֵרֵד עִמָּנוּ בַּמִּלְחָמָה
  choice: எங்களுடன் போருக்கு வர வேண்டாம்
  rationale: ‘இறங்குதல்’ என்ற எபிரெய வழக்கைத் தமிழில் சொற்சொல்லாகக் கூறுவது இயல்பற்றதாகும்; படையெடுப்பில் பங்கேற்கக் கூடாது என்ற சூழல்சார் பொருளைத் தெளிவாக அளிக்கிறது.
- source_word: וְלֹא יִהְיֶה לָּנוּ לְשָׂטָן
  choice: போரில் அவன் நமக்கு எதிரியாகிவிடாதபடி
  rationale: שָׂטָן இங்கு இயற்பெயர் அல்ல; எதிரி அல்லது எதிர்ப்பவர் என்னும் பொதுப்பெயர். ‘எதிரி’ அந்தப் பொருளை இயல்பாகவும் தெளிவாகவும் தருகிறது.
- source_word: יִתְרַצֶּה זֶה אֶל אֲדֹנָיו
  choice: இந்த மனிதன் தன் தலைவனின் தயவை மீண்டும் பெற
  rationale: רצה என்பதன் ஹித்பாயேல் வடிவம் மேலதிகாரியிடம் மீண்டும் ஏற்றுக்கொள்ளப்படுதல் அல்லது தயவைப் பெறுதல் என்பதைக் குறிக்கிறது; தமிழில் அதன் நடைமுறைப் பொருள் தெளிவாக வெளிப்படுகிறது.
- source_word: אֲדֹנָיו
  choice: தன் தலைவன்
  rationale: இங்கு தாவீதின் அரசியல் மேலதிகாரியான சவுல் குறிக்கப்படுகிறார்; ‘தலைவன்’ அடிமைத்தனத் தொனியின்றி அந்த உறவைத் தருகிறது.
- source_word: הֲלוֹא בְּרָאשֵׁי הָאֲנָשִׁים הָהֵם
  choice: அந்த வீரர்களின் தலைகளைக் கொண்டுதானே?
  rationale: எபிரெயச் சொற்றொடரின் சுருக்கமான, அதேவேளை கொடூரமான உருவகத்தைத் தக்கவைக்கிறது; சூழலில் ‘அந்த மனிதர்கள்’ பெலிஸ்தியப் படைவீரர்கள் என்பதால் ‘வீரர்கள்’ தெளிவாக உள்ளது.
theological_decisions:
- issue: שָׂטָן என்பதன் பொருள்
  choice: ‘எதிரி’ என்ற பொதுப்பெயர்
  alternative: ‘சாத்தான்’ என்ற இயற்பெயர்
  rationale: இந்த வரலாற்றுக் கதையில் இச்சொல் எதிர்ப்பவர் அல்லது பகைவன் என்ற சாதாரண பொருளிலேயே வருகிறது. ‘சாத்தான்’ எனப் பெயர்ப்பது மூலவசனம் கூறாத பிற்காலத் தீய ஆவியியல் கருத்தை இங்கு புகுத்திவிடும்.
- issue: יִתְרַצֶּה என்பதன் உறவுசார் பொருள்
  choice: தன் தலைவனின் தயவை மீண்டும் பெறுதல்
  alternative: தன் தலைவனோடு தன்னை ஒப்புரவாக்கிக்கொள்ளுதல்
  rationale: இரு வாசிப்புகளும் அடிப்படையில் சாத்தியமானவை; அரசன் சவுலின் ஏற்றுக்கொள்ளுதலைத் தாவீது மீண்டும் பெறுவது என்ற சூழல்சார் கருத்தை முதன்மை உரை இயல்பான தமிழில் தருகிறது, மாற்று நுணுக்கம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான வரலாற்றுக் கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘தளபதிகள்’, ‘திருப்பி அனுப்பிவிடும்’, ‘தயவை மீண்டும் பெற’ ஆகியவை தெளிவையும் இயல்பையும் முன்னிறுத்துகின்றன. எபிரெயத்தின் ‘போருக்கு இறங்குதல்’ தமிழில் இயல்பான ‘போருக்கு வருதல்’ என வழங்கப்பட்டுள்ளது; இறுதி வினாவின் திட்டமிட்ட கொடூரமும் சொல்லாட்சியின் சுருக்கமும் பாதுகாக்கப்பட்டுள்ளன.
