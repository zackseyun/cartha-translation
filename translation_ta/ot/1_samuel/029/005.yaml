  register: நவீனச் செந்தமிழுக்கு நெருக்கமான, பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. பாடல் வரிகளின் இணை அமைப்பும் சொல் சுருக்கமும் முடிந்தவரை காக்கப்பட்டுள்ளன.
