  text: הֲ/לוֹא זֶ֣ה דָוִ֔ד אֲשֶׁ֧ר יַעֲנוּ ל֛/וֹ בַּ/מְּחֹל֖וֹת לֵ/אמֹ֑ר הִכָּ֤ה שָׁאוּל֙ בַּֽ/אֲלָפָ֔י/ו וְ/דָוִ֖ד ב/רבבת/ו־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/029/005.yaml
  text: Is this not David[a], of whom they sang to one another in the dances, saying, ‘Saul has struck down his thousands[b], and David his ten thousands’?”
translation:
  language: ta
  text: “‘சவுல் தம் ஆயிரக்கணக்கானோரை வீழ்த்தினார்; தாவீதோ தம் பதினாயிரக்கணக்கானோரை வீழ்த்தினார்’ என்று ஆடல்களில் இவனைப் பற்றி அவர்கள் மாறிமாறிப் பாடிய தாவீது இவன்தானே?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֲלוֹא זֶה דָוִד
  choice: இவன்தானே தாவீது?
  rationale: ஒப்புதலை எதிர்பார்க்கும் வினாவையும் தாவீதைச் சுட்டிக்காட்டும் வலியுறுத்தலையும் இயல்பான நவீனத் தமிழில் காக்கிறது.
- source_word: יַעֲנוּ לוֹ
  choice: இவனைப் பற்றி அவர்கள் மாறிமாறிப் பாடினார்களே
  rationale: ענה என்ற வினை இச்சூழலில் மறுமொழிப் பாணியிலான அல்லது மாறிமாறிப் பாடுதலைக் குறிக்கிறது; לוֹ என்பது தாவீதைப் பற்றிய பாடல் என்பதை வெளிப்படுத்துகிறது.
- source_word: בַּמְּחֹלוֹת
  choice: ஆடல்களின்போது
  rationale: விழாக்காலக் குழு ஆடல்களின் சூழலைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: הִכָּה
  choice: வீழ்த்தினார்
  rationale: போர்ச் சூழலில் தாக்கித் தோற்கடித்தல் அல்லது கொல்லுதல் என்ற பொருளைத் தருகிறது; மூலத்தில் இல்லாத அளவுக்கு மரணத்தைத் திட்டவட்டமாக்காமல் அதன் வலிமையைக் காக்கிறது.
- source_word: בַּאֲלָפָיו
  choice: தம் ஆயிரக்கணக்கானோரை
  rationale: எதிரிகளை எண்ணிக்கையால் குறிப்பிடும் எபிரெயப் பாடல் வழக்கை இயல்பான தமிழில் தருகிறது; உடைமைப் பின்னொட்டின் தொடர்பையும் ‘தம்’ காக்கிறது.
- source_word: בְרִבְבֹתָיו
  choice: தம் பதினாயிரக்கணக்கானோரை
  rationale: சவுலின் ‘ஆயிரங்கள்’ என்பதுடன் உள்ள எண்ணியல் ஏற்றத்தாழ்வையும் இணை அமைப்பையும் காக்கிறது.
