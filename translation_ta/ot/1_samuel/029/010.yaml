  text: וְ/עַתָּה֙ הַשְׁכֵּ֣ם בַּ/בֹּ֔קֶר וְ/עַבְדֵ֥י אֲדֹנֶ֖י/ךָ אֲשֶׁר בָּ֣אוּ אִתָּ֑/ךְ וְ/הִשְׁכַּמְתֶּ֣ם בַּ/בֹּ֔קֶר וְ/א֥וֹר לָ/כֶ֖ם וָ/לֵֽכוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/029/010.yaml
  text: Now rise early in the morning[a], you and your master's servants who came with you. When you rise early in the morning and it is light for you, go.
translation:
  language: ta
  text: இப்போது, நீயும் உன்னோடு வந்த உன் எஜமானின் பணியாளர்களும் காலையில் சீக்கிரம் எழுந்திருங்கள். நீங்கள் காலையில் சீக்கிரம் எழுந்து, உங்களுக்கு வெளிச்சம் வந்ததும் புறப்பட்டுச் செல்லுங்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உங்களுக்கு பகல் வெளிச்சம் வந்ததும் செல்லுங்கள்”; எபிரெயச் சொற்றொடர் சொல்லடியாக “உங்களுக்கு வெளிச்சம் [உண்டாகும்]” என உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: இப்போது
  rationale: உடனடியாகக் கொடுக்கப்படும் அறிவுறுத்தலை அறிமுகப்படுத்தும் உரையாடல் இணைப்பாக இயல்பாக உள்ளது.
- source_word: הַשְׁכֵּם בַּבֹּקֶר
  choice: காலையில் சீக்கிரம் எழுந்திருங்கள்
  rationale: שׁכם என்பதன் ஹிஃபில் கட்டளை வடிவம் அதிகாலையில் எழுவதையோ முன்கூட்டியே புறப்படத் தயாராவதையோ குறிக்கிறது; காலக் குறிப்புடன் சேர்த்து தமிழில் தெளிவாகத் தரப்படுகிறது.
- source_word: וְעַבְדֵי אֲדֹנֶיךָ
  choice: நீயும் ... உன் எஜமானுடைய பணியாளர்களும்
  rationale: இங்கு אֲדֹנֶיךָ மனித எஜமானைக் குறிக்கிறது; தெய்வீக பட்டமல்ல. ஒருமை முகவரியான தாவீதையும் அவரோடு வந்தவர்களையும் இணைத்துக் காட்டுகிறது.
- source_word: אֲשֶׁר בָּאוּ אִתָּךְ
  choice: உன்னோடு வந்த
  rationale: தாவீதுடன் வந்த பணியாளர்களை அடையாளப்படுத்தும் தொடர்புச் சொற்றொடரைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: וְהִשְׁכַּמְתֶּם בַּבֹּקֶר
  choice: நீங்கள் காலையில் சீக்கிரம் எழுந்து
  rationale: எபிரெயத்தில் மீண்டும் வரும் ‘சீக்கிரம் எழுதல்’ என்ற கருத்தையும் பன்மை முகவரியையும் காக்கிறது; தொடர்ச்சியான காலச் சூழலை தமிழில் வினையெச்சமாக வழங்குகிறது.
- source_word: וְאוֹר לָכֶם
  choice: உங்களுக்கு வெளிச்சம் வந்ததும்
  rationale: சொல்லடியாக ‘உங்களுக்கு வெளிச்சம் [உண்டாகும்]’ என்ற அரிய அமைப்பு; தமிழில் அதன் பொருளான விடியற்கால வெளிச்சத்தை இயல்பாகக் குறிக்கிறது, ஆனால் ‘விடியற்காலையில்’ என்று முழுமையாக விளக்கிவிடாமல் மூல உருவகத்தைப் பேணுகிறது.
- source_word: וָלֵכוּ
  choice: புறப்பட்டுச் செல்லுங்கள்
  rationale: הלך என்பதன் பன்மைக் கட்டளை. இச்சூழலில் வெறும் ‘செல்லுங்கள்’ என்பதைவிட முகாமிலிருந்து புறப்படுதலைத் தெளிவாக்குகிறது.
