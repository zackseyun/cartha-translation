translation_notes:
  register: நவீன நிலையான தமிழ்; மரியாதையும் தெளிவும் கொண்ட வரலாற்றுக் கதையாடல் நடை. ஒருமையில் தாவீதிடம் தொடங்கும் கட்டளை, அவரோடு வந்தவர்களை உள்ளடக்கும்போது பன்மைக்கு மாறுவது தமிழில் வெளிப்படையாகக் காக்கப்பட்டுள்ளது. எபிரெய மூலத்தில் உள்ள ‘காலையில் சீக்கிரம் எழுதல்’ என்ற மறுபடியும் கூறுதலும் பாதுகாக்கப்பட்டுள்ளது.
