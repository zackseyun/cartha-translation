base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/029/007.yaml
  text: So now[a], return and go in peace, and do not do evil in the eyes of the Philistine lords.
translation:
  language: ta
  text: ஆகவே இப்போது, திரும்பு; சமாதானத்துடன் போ. பெலிஸ்தியத் தலைவர்களின் பார்வையில் தீமையானதைச் செய்யாதே.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பெலிஸ்தியத் தலைவர்களின் பார்வையில் தவறானதைச் செய்யாதே.” அவர்கள் தீமை அல்லது ஏற்றுக்கொள்ள முடியாதது என்று மதிப்பிடுவதையும் இந்த எபிரெயச் சொற்றொடர் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: ஆகவே இப்போது
  rationale: וְ என்பதன் இணைப்பையும், עַתָּה அறிமுகப்படுத்தும் முடிவான அறிவுறுத்தலையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: שׁוּב וְלֵךְ
  choice: திரும்பு; ... போ
  rationale: தாவீதைப் படையிலிருந்து திருப்பி அனுப்பும் சூழலைத் தெளிவாக்குவதோடு, எபிரெய மொழியிலுள்ள இரண்டு கட்டளை வினைகளையும் தனித்தனியாகப் பேணுகிறது.
- source_word: בְּשָׁלוֹם
  choice: சமாதானத்துடன்
  rationale: பாதுகாப்பாகவும் எந்தப் பகைமையும் இன்றியும் புறப்படுவதைக் குறிக்கக்கூடிய எபிரெய மரபுத்தொடரின் அடிப்படைப் பொருளைப் பேணுகிறது.
- source_word: וְלֹא תַעֲשֶׂה רָע
  choice: தீமையானதைச் செய்யாதே
  rationale: רָע என்பதிலுள்ள தீமை அல்லது தவறு என்ற மதிப்பீட்டுப் பொருளைப் பேணுகிறது; அதை வெறும் தீங்கு விளைவிப்பதாகக் குறுக்கவில்லை.
- source_word: בְּעֵינֵי
  choice: பார்வையில்
  rationale: ஒருவரின் மதிப்பீட்டில் அல்லது கணிப்பில் என்பதைக் குறிக்கும் எபிரெய மரபுத்தொடரை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: סַרְנֵי פְלִשְׁתִּים
  choice: பெலிஸ்தியத் தலைவர்கள்
  rationale: பெலிஸ்திய நகர-அரசுகளின் உயர்நிலை ஆட்சியாளர்களைக் குறிக்கும் பட்டத்தை, பொதுவாசகர்களுக்குப் புரியும் வகையில் வழங்குகிறது.
