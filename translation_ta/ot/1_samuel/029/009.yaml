  terminology: Use ‘கடவுளின் வானதூதன்’ in the main text for the likely sense of מַלְאָךְ אֱלֹהִים, with ‘கடவுளின் தூதர்’ retained as the lexical alternative. ‘பார்வையில் நல்லவனாக’ suitably preserves the broad evaluative force without specifying loyalty or moral innocence.
