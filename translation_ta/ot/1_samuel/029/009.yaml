source:
  edition: WLC
  text: וַ/יַּ֣עַן אָכִישׁ֮ וַ/יֹּ֣אמֶר אֶל דָּוִד֒ יָדַ֕עְתִּי כִּ֣י ט֥וֹב אַתָּ֛ה בְּ/עֵינַ֖/י כְּ/מַלְאַ֣ךְ אֱלֹהִ֑ים אַ֣ךְ שָׂרֵ֤י פְלִשְׁתִּים֙ אָֽמְר֔וּ לֹֽא יַעֲלֶ֥ה עִמָּ֖/נוּ בַּ/מִּלְחָמָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/029/009.yaml
  text: Achish answered and said to David[a], “I know that you are good in my eyes, like an angel of God. Yet the commanders of the Philistines have said, ‘He must not go up with us into battle.’”
translation:
  language: ta
  text: 'ஆகீஸ் தாவீதுக்குப் பதிலளித்துச் சொன்னான்: “நீ கடவுளின் வானதூதனைப் போல[a] என் பார்வையில் நல்லவனாக இருக்கிறாய் என்று நான் அறிவேன். ஆனாலும், ‘அவன் எங்களோடு போருக்குப் போகக்கூடாது’ என்று பெலிஸ்தியரின் தளபதிகள் கூறியுள்ளனர்.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “கடவுளின் தூதரைப் போல” என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் மனிதத் தூதரையோ வானதூதரையோ குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמֶר
  choice: பதிலளித்துச் சொன்னான்
  rationale: எபிரெய உரையின் ‘பதிலளித்து, சொன்னான்’ என்ற தொடரை இயல்பான நவீனத் தமிழில் நெருக்கமாகப் பேணுகிறது.
- source_word: יָדַעְתִּי
  choice: நான் அறிவேன்
  rationale: உரையாடலில் ஆகீஸின் நிலையான தற்போதைய மதிப்பீட்டைத் தெரிவிக்கிறது.
- source_word: טוֹב אַתָּה בְּעֵינַי
  choice: நீ என் பார்வையில் நல்லவனாக ... இருக்கிறாய்
  rationale: ‘என் கண்களில்’ என்ற எபிரெய மதிப்பீட்டு மரபுத்தொடரின் பொருளை இயல்பான தமிழில் தருகிறது; விசுவாசம் அல்லது குற்றமின்மை எனக் குறுக்கிப் பொருள் தீர்மானிக்கவில்லை.
- source_word: כְּמַלְאַךְ אֱלֹהִים
  choice: கடவுளின் தூதரைப் போல
  rationale: מַלְאָךְ என்பதன் அடிப்படைப் பொருளான ‘தூதர்’ என்பதைப் பேணி, வானதூதர் என்ற சாத்தியத்தை அடிக்குறிப்பில் வெளிப்படுத்துகிறது.
- source_word: אַךְ
  choice: ஆனாலும்
  rationale: ஆகீஸின் தனிப்பட்ட மதிப்பீட்டுக்கும் பெலிஸ்தியத் தளபதிகளின் முடிவுக்கும் இடையிலான முரண்பாட்டைக் காட்டுகிறது.
- source_word: שָׂרֵי פְלִשְׁתִּים
  choice: பெலிஸ்தியத் தளபதிகள்
  rationale: போர்ச் சூழலில் שָׂרִים என்போர் ஆட்சியதிகாரமுள்ள இராணுவத் தலைவர்கள் என்பதைத் தெளிவாகவும் சுருக்கமாகவும் தெரிவிக்கிறது.
- source_word: לֹא יַעֲלֶה עִמָּנוּ בַּמִּלְחָמָה
  choice: அவன் எங்களோடு போருக்குப் போகக்கூடாது
  rationale: மூன்றாம் நபர் imperfect-இன் தடை/முடிவு வலிமையை ‘போகக்கூடாது’ எனத் தருகிறது. עלה என்பதைக் கட்டாயமாக ‘ஏறிச் செல்லுதல்’ என மொழிபெயர்ப்பது தமிழில் இயல்பற்றதால், படையெடுப்பில் சேர்ந்து செல்லும் பொருள் இயல்பாகக் கூறப்படுகிறது.
theological_decisions:
- issue: כְּמַלְאַךְ אֱלֹהִים என்பதில் מַלְאָךְ என்பதன் பொருள்
  choice: முதன்மை உரையில் ‘கடவுளின் தூதர்’
  alternative: ‘கடவுளின் வானதூதர்’
  rationale: מַלְאָךְ என்பது மனிதத் தூதரையோ வானதூதரையோ குறிக்கலாம். இங்கு இது தாவீதைக் குறித்த ஒப்புமை மட்டுமே; அவரது இயல்பைப் பற்றிய தத்துவக் கூற்றல்ல. மூலத்தின் நிச்சயமின்மையை அடிக்குறிப்பு பேணுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழ்; கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் நடை. ‘என் பார்வையில் நல்லவன்’ என்பது மூலத்தின் விரிவான மதிப்பீட்டை அதிகமாக விளக்காமல் பேணுகிறது; ‘போருக்குப் போகக்கூடாது’ என்பது இயல்பான தமிழில் தடை வலிமையைத் தருகிறது.
