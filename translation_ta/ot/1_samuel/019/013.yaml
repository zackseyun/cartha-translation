base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/019/013.yaml
  text: Then Michal took the household idol and laid it on the bed[b][a], and she put a cushion of goats’ hair at its head and covered it with the garment.
translation:
  language: ta
  text: அப்போது மீகாள் வீட்டுத் தெய்வச் சிலையை[a] எடுத்து, படுக்கையில் வைத்தாள். அதன் தலைமாட்டில் வெள்ளாட்டு மயிரால் ஆன ஒரு வலைப்பின்னலை[b] வைத்து, அதை அந்த ஆடையால் மூடினாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயச் சொல்லை ‘தெராபீம்,’ ‘வீட்டுத் தெய்வங்கள்,’ அல்லது ‘உருவச்சிலை’ என்றும் மொழிபெயர்க்கலாம். அது வீட்டு வழிபாட்டுப் பொருட்களைக் குறிக்கிறது; இங்கு படுக்கையில் வைக்கப்பட்ட ஓர் உருவமாகச் செயல்படுகிறது.
    reason: lexical_alternative
  - marker: b
    text: இந்த எபிரெயச் சொற்றொடரின் துல்லியமான பொருள் உறுதியாகத் தெரியவில்லை. இது வெள்ளாட்டு மயிரால் செய்யப்பட்ட வலை, பின்னிய உறை, மெத்தை அல்லது அதுபோன்ற ஒரு பொருளைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַתְּרָפִים
  choice: வீட்டுத் தெய்வச் சிலை
  rationale: תְּרָפִים என்பது வீட்டில் வைக்கப்பட்ட வழிபாட்டுப் பொருள் அல்லது சிலையைக் குறிக்கிறது. வடிவம் பன்மையாக இருந்தாலும், இச்சூழலில் படுக்கையில் ஒரு மனித உருவைப் போல வைக்கப்பட்ட ஒற்றைப் பொருளாகச் செயல்படுவதால் ஒருமையில் மொழிபெயர்க்கப்பட்டது.
- source_word: אֶל הַמִּטָּה
  choice: படுக்கையில்
  rationale: אֶל பொதுவாக ‘நோக்கி/உள்ளே’ எனப் பொருள்பட்டாலும், שׂים உடன் இச்சூழலில் படுக்கையின்மேல் வைப்பதையே இயல்பாகக் குறிக்கிறது.
- source_word: כְּבִיר הָעִזִּים
  choice: வெள்ளாட்டு மயிரால் செய்யப்பட்ட ஒரு பின்னல்
  rationale: כְּבִיר அரிதானதும் பொருள் உறுதியாகத் தெரியாததுமான சொல். வெள்ளாட்டு மயிரால் நெய்யப்பட்ட அல்லது பின்னப்பட்ட வலை, மெத்தை, போர்வை போன்ற பொருளாக இருக்கலாம்; ‘பின்னல்’ அதன் வடிவத்தைத் தேவையின்றி மிகத் துல்லியப்படுத்தாமல் காட்டுகிறது.
- source_word: מְרַאֲשֹׁתָיו
  choice: அதன் தலைமாட்டில்
  rationale: இந்தச் சொல் தலை இருக்கும் இடத்தையோ தலைமாட்டையோ குறிக்கிறது. அருகிலுள்ள சுட்டுப்பொருள் சிலை என்பதால் ‘அதன்’ என வழங்கப்பட்டது; வேடமிட்ட தாவீதைக் கருத்தில் கொண்டு ‘அவனுடைய’ என்றும் புரிந்துகொள்ள வாய்ப்புள்ளது.
- source_word: בַּבָּגֶד
  choice: ஓர் ஆடையால்
  rationale: בֶּגֶד என்பது பொதுவாக ஆடை அல்லது உடுப்பைக் குறிக்கும். எபிரெயத்தில் குறிப்புச் சுட்டு இருந்தாலும், தமிழில் இங்கு ‘ஓர் ஆடையால்’ என்பது இயல்பாகவும் தேவையற்ற முன்தகவலைக் கருதாமலும் உள்ளது.
- source_word: וַתְּכַס
  choice: மூடினாள்
  rationale: כסה என்ற வினை இங்கு பொருளை மறைக்கும் வகையில் மூடும் நேரடியான செயலைக் குறிக்கிறது.
