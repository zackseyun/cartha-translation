translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டது. அரிதான வழிபாட்டுச் சொல்லை வாசகருக்குப் புரியும் வகையில் மொழிபெயர்த்து, மூலச்சொல்லின் பிற சாத்தியங்களை அடிக்குறிப்பில் காத்துள்ளது. כְּבִיר הָעִזִּים என்பதன் உண்மையான தெளிவின்மை தீர்க்கப்படாமல் அடிக்குறிப்பில் வெளிப்படுத்தப்பட்டுள்ளது.
