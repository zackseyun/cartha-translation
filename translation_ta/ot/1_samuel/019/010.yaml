  yaml_path: translation/ot/1_samuel/019/010.yaml
  text: Saul sought to pin David to the wall with the spear, but he slipped away from Saul’s presence, and he drove the spear into the wall. Then David fled and escaped that night.
translation:
  language: ta
  text: சவுல் தாவீதை ஈட்டியால் சுவரில் குத்தி மாட்டிவிட முயன்றான். ஆனால் தாவீது சவுலிடமிருந்து நழுவித் தப்பினான்; சவுல் ஈட்டியைச் சுவரில் குத்தினான். பின்னர் தாவீது அந்த இரவில் ஓடித் தப்பினான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְהַכּוֹת בַּחֲנִית בְּדָוִד וּבַקִּיר
  choice: ஈட்டியால் தாவீதைச் சுவரோடு சேர்த்துக் குத்த
  rationale: எபிரெயச் சொற்றொடரின் நோக்கம் தாவீதை ஈட்டியால் தாக்கி சுவரோடு பிணைத்துவிடுவதாகும்; தமிழில் இயல்பாகவும் காட்சியின் வன்மையைத் தெளிவாகவும் தருகிறது.
- source_word: וַיִּפְטַר מִפְּנֵי שָׁאוּל
  choice: சவுலின் முன்னிலையிலிருந்து விலகித் தப்பினான்
  rationale: פטר இங்கு தாக்குதலிலிருந்து நழுவி விடுபடுதலைக் குறிக்கிறது; 'விலகித் தப்பினான்' இயக்கத்தையும் விடுபடுதலையும் காக்கிறது.
- source_word: וַיַּךְ אֶת־הַחֲנִית בַּקִּיר
  choice: ஈட்டி சுவரில் பாய்ந்தது
  rationale: இலக்கணப்படி செய்பவன் சவுலாக இருக்கலாம் என்றாலும், தொடர்ச்சியில் ஈட்டி சுவரைத் தாக்கிய விளைவே முக்கியம். இயல்பான தமிழில் கருவியை எழுவாயாக்குவது சவுல் தன்னையே குத்தியதாகத் தோன்றும் குழப்பத்தைத் தவிர்க்கிறது.
- source_word: נָס וַיִּמָּלֵט
  choice: தப்பியோடி உயிர் பிழைத்தான்
  rationale: נוס என்பது ஓடுதலையும், מלט என்பது ஆபத்திலிருந்து தப்பிப் பிழைத்தலையும் குறிக்கிறது; இரு வினைகளின் வேறுபாட்டைத் தக்கவைக்கிறது.
