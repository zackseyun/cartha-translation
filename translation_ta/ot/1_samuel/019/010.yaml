  source_fidelity: முதல் வாக்கியத்தின் நோக்கம் தாவீதை ஈட்டியால் சுவரில் குத்தி மாட்டிவிடுவதாகும்; அதைத் தெளிவாகச் சொல்லலாம். மேலும், וַיַּךְ என்ற வினைக்கு இங்கு சவுலே இயல்பான செய்பவர். ஈட்டி தானே பாய்ந்ததாக அமைந்துள்ள வரைவு அந்தச் செய்பவரை மறைக்கிறது. இறுதியில் நாச்/மிலட் ஆகிய இரு வினைகளின் ஓடுதலும் தப்புதலும் காக்கப்பட்டுள்ளன, ஆனால் ‘உயிர் பிழைத்தான்’ என்பது மூலத்தில் வெளிப்படையாக இல்லாத கூடுதல் நுணுக்கம்.
