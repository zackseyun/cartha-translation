base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/019/016.yaml
  text: When the messengers came in[a], behold, the teraphim was in the bed[b], with the quilt of goats’ hair at its head.
translation:
  language: ta
  text: தூதர்கள் வந்தபோது, இதோ, படுக்கையில் தெராப்பீம்[a] இருந்தது; அதன் தலைமாட்டில் வெள்ளாட்டு மயிர்ப் போர்வை[b] இருந்தது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘தெராப்பீம்’ என்பது வீட்டு வழிபாட்டில் பயன்படுத்தப்பட்ட ஒரு தெய்வச்சிலையையோ விக்கிரக உருவத்தையோ குறிக்கும் எபிரெயச் சொல்.
    reason: lexical_alternative
  - marker: b
    text: ‘போர்வை’ என்று மொழிபெயர்க்கப்பட்ட எபிரெயச் சொல் அரிதானது; அது பொதுவாக நெய்யப்பட்ட ஒரு மூடுதுணியையும் குறிக்கலாம். இங்கு அதன் சாத்தியமான பயன்பாட்டின் அடிப்படையில் ‘வெள்ளாட்டு மயிர்ப் போர்வை’ என மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּלְאָכִים
  choice: தூதர்கள்
  rationale: இங்கு சவுலால் அனுப்பப்பட்ட மனிதர்களையே குறிக்கிறது; வானதூதர்கள் என்ற பொருள் அல்ல. ‘தூதர்கள்’ என்பது சொல்லின் பொதுவான மனித முகவர் பொருளைத் தக்கவைக்கிறது.
- source_word: וְהִנֵּה
  choice: இதோ
  rationale: அவர்கள் திடீரெனக் கண்ட காட்சியை உயிரோட்டத்துடன் முன்வைக்கும் எபிரெயக் கதைநடைச் சொல்லின் சுட்டிக்காட்டும் வலிமையைப் பாதுகாக்கிறது.
- source_word: הַתְּרָפִים
  choice: தெராப்பீம்
  rationale: இது வீட்டு வழிபாட்டுடன் தொடர்புடைய தனித்துவமான பண்பாட்டுச் சொல்லாகும். ஒலிபெயர்ப்பு அதன் அளவு, வடிவம், துல்லியமான பயன்பாடு ஆகியவற்றை உரை கூறுவதைக் கடந்த வகையில் நிர்ணயிப்பதைத் தவிர்க்கிறது.
- source_word: אֶל הַמִּטָּה
  choice: படுக்கையில்
  rationale: אֶל என்பதன் அடிப்படைப் பொருள் ‘நோக்கி’ என இருந்தாலும், இக்கண்டுபிடிப்புக் காட்சியில் தெராப்பீம் தாவீதுக்குப் பதிலாகப் படுக்கையில் வைக்கப்பட்டிருந்த இடநிலையே குறிக்கப்படுகிறது.
- source_word: וּכְבִיר
  choice: போர்வை
  rationale: அரிதாக வரும் இச்சொல் நெய்யப்பட்ட ஒரு மூடுதுணியையோ போர்வையையோ குறிக்கலாம். படுக்கைச் சூழலில் ‘போர்வை’ இயல்பானதும் அதன் சாத்தியமான செயல்பாட்டுக்கு ஏற்றதுமான மொழிபெயர்ப்பு.
- source_word: הָעִזִּים
  choice: வெள்ளாட்டு மயிர்
  rationale: இங்கு மூடுதுணி செய்யப்பட்ட பொருள் வெள்ளாட்டு மயிராக இருப்பதே சூழலுக்குப் பொருந்துகிறது; தமிழில் இதை வெளிப்படையாகச் சொல்வது இயல்பாக உள்ளது.
- source_word: מְרַאֲשֹׁתָיו
  choice: அதன் தலைமாட்டில்
  rationale: இச்சொல் ‘தலை வைக்கப்படும் இடம்’ என்பதைக் குறிக்கிறது. உடனடி சுட்டுப்பொருள் படுக்கையிலுள்ள தெராப்பீம் என்பதால், உண்மையான மனிதர் அங்கு இருந்தார் என்ற எண்ணத்தைத் தவிர்த்து ‘அதன் தலைமாட்டில்’ என மொழிபெயர்க்கப்பட்டுள்ளது.
theological_decisions:
- issue: வீட்டு வழிபாடு அல்லது சிலைவழிபாட்டுடன் தொடர்புடைய תְּרָפִים என்ற பொருளின் மொழிபெயர்ப்பு
  choice: தெராப்பீம்
  alternative: வீட்டுத் தெய்வச்சிலை; விக்கிரக உருவம்
  rationale: மூலவசனம் அந்தப் பொருளைப் பெயரிட்டு மட்டுமே கூறுகிறது; அதைப் பற்றி வெளிப்படையான மதிப்பீட்டைச் சேர்க்கவில்லை. ஒலிபெயர்ப்பு பண்பாட்டுத் தனித்துவத்தையும் பொருளின் துல்லிய வடிவம் குறித்த தெளிவின்மையையும் காக்கிறது; அடிக்குறிப்பு அதன் சாத்தியமான பொருளை விளக்குகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘இதோ’ என்பது எபிரெயக் கதைநடையின் திடீர் கண்டுபிடிப்பு உணர்வைத் தக்கவைக்கிறது. ‘தெராப்பீம்’ என்ற பண்பாட்டுச் சொல் ஒலிபெயர்க்கப்பட்டு, பொதுவாசகர்களுக்காக அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது.
