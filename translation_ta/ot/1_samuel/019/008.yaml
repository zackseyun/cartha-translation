base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/019/008.yaml
  text: And the war broke out again[a], and David went out and fought against the Philistines and struck them with a great blow, so that they fled before him.
translation:
  language: ta
  text: போர் மீண்டும் மூண்டது[a]. தாவீது புறப்பட்டுச் சென்று பெலிஸ்தியர்களுக்கு எதிராகப் போரிட்டு, அவர்களுக்குப் பெரும் அடியைக் கொடுத்தான். அவர்கள் அவனிடமிருந்து தப்பியோடினார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “போர் தொடர்ந்தது” அல்லது “மீண்டும் போர் உண்டாயிற்று” என்றும் மொழிபெயர்க்கலாம். எபிரெய மொழிவழக்கு, போர் மீண்டும் தொடங்கியதையோ தொடர்ந்து நடந்ததையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתּוֹסֶף הַמִּלְחָמָה לִהְיוֹת
  choice: போர் மீண்டும் மூண்டது
  rationale: יסף + היה என்ற எபிரெய மொழிவழக்கு போரின் மறுநிகழ்வையோ மீள்தொடக்கத்தையோ குறிக்கிறது. “மீண்டும் மூண்டது” என்பது இயல்பான நவீனத் தமிழில் புதுப்பிக்கப்பட்ட பகைமையைத் தெரிவிக்கிறது; தொடர்ச்சியைக் குறிக்கும் சாத்தியம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: וַיֵּצֵא דָוִד
  choice: தாவீது புறப்பட்டுச் சென்று
  rationale: יצא என்பதன் அடிப்படைப் பொருள் “புறப்பட்டுச் செல்.” போருக்குச் சென்றான் என்பது சூழலில் தெளிவாக இருந்தாலும், எபிரெய மூலத்தில் சொல்லப்படாத இலக்கைச் சேர்க்காமல் மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: וַיִּלָּחֶם בַּפְּלִשְׁתִּים
  choice: பெலிஸ்தியர்களுக்கு எதிராகப் போரிட்டு
  rationale: לחם என்பது போரிடுதலைக் குறிக்கிறது; இங்குள்ள ב பகைமை சார்ந்த மோதலைக் காட்டுவதால் “எதிராக” என்று தெளிவாக வழங்கப்பட்டுள்ளது.
- source_word: וַיַּךְ בָּהֶם מַכָּה גְדוֹלָה
  choice: அவர்களைக் கடுமையாகத் தாக்கினான்
  rationale: נכה + מכה என்ற சொற்சேர்க்கை பெரும் அடி அல்லது கடும் தோல்வியை ஏற்படுத்துதலைக் குறிக்கிறது. உயிரிழப்புகளின் அளவை ஊகிக்காமல், மூலத்தின் தாக்குதல் உருவகத்தை இயல்பான தமிழில் காக்கிறது.
- source_word: וַיָּנֻסוּ מִפָּנָיו
  choice: அவர்கள் அவனுக்கு முன்பாகத் தப்பியோடினார்கள்
  rationale: מִפָּנָיו என்பது நேரடியாக “அவனுக்கு முன்பாக இருந்து” என்ற கருத்தைக் கொண்டது. தாவீதின் முன்னிலையிலிருந்து பின்வாங்கி ஓடியதைக் காட்ட இவ்வாறு மொழிபெயர்க்கப்பட்டுள்ளது.
