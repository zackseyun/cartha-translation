  text: וַ/יִּשְׁלַ֨ח שָׁא֣וּל מַלְאָכִים֮ לָ/קַ֣חַת אֶת דָּוִד֒ וַ/יַּ֗רְא אֶֽת לַהֲקַ֤ת הַ/נְּבִיאִים֙ נִבְּאִ֔ים וּ/שְׁמוּאֵ֕ל עֹמֵ֥ד נִצָּ֖ב עֲלֵי/הֶ֑ם וַ/תְּהִ֞י עַֽל מַלְאֲכֵ֤י שָׁאוּל֙ ר֣וּחַ אֱלֹהִ֔ים וַ/יִּֽתְנַבְּא֖וּ גַּם הֵֽמָּה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/019/020.yaml
  text: Then Saul sent messengers to seize David[a]. When they saw the company of prophets prophesying, with Samuel standing over them, the Spirit of God came upon Saul’s messengers[b], and they also prophesied.
translation:
  language: ta
  text: சவுல் தாவீதைப் பிடித்துவரத் தூதர்களை அனுப்பினான். தீர்க்கதரிசிகளின் கூட்டம்[a] தீர்க்கதரிசனம் உரைத்துக்கொண்டிருந்ததையும், சாமுவேல் அவர்களுக்கு மேலாக நின்றிருந்ததையும்[b] அவர்கள் கண்டபோது, சவுலின் தூதர்கள் மேல் கடவுளின் ஆவி வந்தது; அவர்களும் தீர்க்கதரிசனம் உரைத்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “தீர்க்கதரிசிகளின் குழு” என்றும் மொழிபெயர்க்கலாம். எபிரேயச் சொல் ஒன்றுகூடிய ஒரு கூட்டத்தைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: “அவர்களிடையே நின்றிருந்ததையும்” என்றும் மொழிபெயர்க்கலாம். சாமுவேல் அவர்களுக்கு மேலான தலைமை அல்லது மேற்பார்வை நிலையில் இருந்தார் என்பதையும் எபிரேயம் உணர்த்தக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְאָכִים / מַלְאֲכֵי
  choice: தூதர்கள்
  rationale: இந்தக் கதைச் சூழலில் இச்சொல் தேவதூதர்களை அல்ல, சவுலால் அனுப்பப்பட்ட மனிதத் தூதர்களைக் குறிக்கிறது.
- source_word: לָקַחַת
  choice: பிடித்துவர
  rationale: அடிப்படைப் பொருள் ‘எடுத்துக்கொள்ளுதல்’ என்றாலும், இங்கு தாவீதைக் கைது செய்து கொண்டுவரும் பகைமையான நோக்கை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: לַהֲקַת הַנְּבִיאִים
  choice: தீர்க்கதரிசிகளின் கூட்டம்
  rationale: לַהֲקָה என்பது ஒன்றுகூடிய குழுவைக் குறிக்கிறது; ‘கூட்டம்’ நவீனத் தமிழில் தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: נִבְּאִים
  choice: தீர்க்கதரிசனம் உரைத்துக்கொண்டிருப்பது
  rationale: எபிரேயப் பங்கேற்புவினை தொடர்ந்து நடைபெற்றுக்கொண்டிருந்த தீர்க்கதரிசனச் செயல்பாட்டைச் சுட்டுகிறது.
- source_word: עֹמֵד נִצָּב עֲלֵיהֶם
  choice: அவர்களுக்கு மேலாக நின்றுகொண்டிருப்பது
  rationale: சாமுவேல் நிலையாக நின்றதையும், தீர்க்கதரிசிகளுடன் ஒப்பிடுகையில் அவர் வகித்த மேற்பார்வை அல்லது தலைமை நிலையையும் பாதுகாக்கிறது; இடவியல் தெளிவின்மையை அடிக்குறிப்பு பதிவு செய்கிறது.
- source_word: רוּחַ אֱלֹהִים
  choice: கடவுளின் ஆவி
  rationale: தீர்க்கதரிசனச் செயல்பாட்டை உண்டாக்கும் கடவுளின் வல்லமையான பிரசன்னத்தையும் செயலையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: וַתְּהִי עַל
  choice: மேல் ... வந்தது
  rationale: ஆவி ஒருவர்மேல் வந்து செயலாற்றச் செய்யும் நிகழ்வுத்தன்மையை எபிரேய மரபுத்தொடருக்கு நெருக்கமாகப் பாதுகாக்கிறது.
- source_word: וַיִּתְנַבְּאוּ גַּם הֵמָּה
  choice: அவர்களும் தீர்க்கதரிசனம் உரைத்தார்கள்
  rationale: சவுலின் தூதர்களும்கூட எதிர்பாராத விதமாக அதே தீர்க்கதரிசனச் செயல்பாட்டில் இணைந்ததை גַּם என்பதற்கேற்ப வலியுறுத்துகிறது.
theological_decisions:
- issue: இந்தக் கதையில் רוּחַ אֱלֹהִים என்பதன் இயல்பு
  choice: ‘கடவுளின் ஆவி’ என்று, கடவுளிடமிருந்து வரும் வல்லமையூட்டும் பிரசன்னமாக மொழிபெயர்க்கப்பட்டது.
  alternative: ‘கடவுளிடமிருந்து வந்த ஓர் ஆவி’
  rationale: சாமுவேல் நூல்களின் இச்சூழலில் இந்தச் சொற்றொடர் வரலாற்றில் வல்லமையுடன் செயல்படும் கடவுளின் ஆவியைக் குறிக்கிறது. பிற்காலக் கோட்பாட்டு நுட்பங்களை வசனத்துக்குள் சேர்க்காமல், கடவுளின் நேரடி செயலாற்றலை இம்மொழிபெயர்ப்பு பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரமான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் வேதாகமக் கதைநடைக்கு ஏற்ற கண்ணியமான நடையிலும் வடிவமைக்கப்பட்டது. எபிரேய வாக்கியத்தின் தொடர்ச்சியைப் பாதுகாத்து, மூலத்தில் வெளிப்படையாக இல்லாத முரண்பாட்டுச் சொல்லைச் சேர்க்கவில்லை. அடிக்குறிப்பு குறிகள் அவை விளக்கும் சொற்றொடர்களின் அருகே வைக்கப்பட்டுள்ளன.
