base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/019/002.yaml
  text: Jonathan told David[a], saying, “Saul my father is seeking to kill you. So now, please be on your guard in the morning, and stay in a secret place and hide yourself.”
translation:
  language: ta
  text: யோனத்தான் தாவீதிடம், “என் தந்தை சவுல் உன்னைக் கொல்ல முயல்கிறார். ஆகவே, காலையில் தயவுசெய்து எச்சரிக்கையாக இரு; மறைவான ஓர் இடத்தில் தங்கி, ஒளிந்துகொள்[a]” என்று சொன்னான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘மறைவாகத் தங்கியிருந்து, ஒளிந்துகொள்’ என்றும் மொழிபெயர்க்கலாம். எபிரெய மொழியில் ‘தங்கு’ என்ற வினையுடன் ‘மறைவு’ அல்லது ‘மறைவிடம்’ என்று பொருள்படும் பெயர்ச்சொல் வருகிறது; அதைத் தொடர்ந்து ‘ஒளிந்துகொள்’ என்று கூறப்படுவது அறிவுறுத்தலை வலியுறுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּגֵּד
  choice: சொன்னான்
  rationale: נגד என்பதன் ஹிஃபில் வடிவம் இங்கு ஒருவருக்கு ஒரு செய்தியைத் தெரிவிப்பதைக் குறிக்கிறது. நேரடியான உரையை அறிமுகப்படுத்தும் சூழலில் ‘சொன்னான்’ இயல்பான நவீனத் தமிழாகும்.
- source_word: לֵאמֹר
  choice: என்று
  rationale: எபிரெய மொழியின் நேரடி உரை அறிமுகச் சூத்திரத்தைத் தமிழின் இயல்பான மேற்கோள் அமைப்பான ‘என்று சொன்னான்’ மூலம் வெளிப்படுத்துகிறது.
- source_word: מְבַקֵּשׁ
  choice: தேடுகிறார்
  rationale: பங்கேற்புவினை வடிவம் சவுலின் தற்போதைய, தொடரும் நோக்கத்தை உணர்த்துகிறது. ‘தேடுகிறார்’ அந்த நீடித்த நோக்கத்தைப் பாதுகாக்கிறது; ஏற்கெனவே கொலை முயற்சி நடைபெற்றதாகச் சேர்த்துக் கூறுவதில்லை.
- source_word: לַהֲמִיתֶךָ
  choice: உன்னைக் கொல்ல
  rationale: מות என்பதன் ஹிஃபில் வடிவம் ‘சாகச் செய்தல்’ என்று பொருள்பட்டு, இச்சூழலில் இயல்பாக ‘கொல்ல’ என மொழிபெயர்கிறது. ‘மரணதண்டனை விதிக்க’ என்பது மூலத்தில் இல்லாத நீதிமுறைப் பொருளைச் சேர்க்கக்கூடும்.
- source_word: הִשָּׁמֶר נָא
  choice: தயவுசெய்து எச்சரிக்கையாக இரு
  rationale: שמר என்பதன் நிஃபால் கட்டளை வடிவம் இங்கு தன்னைக் காத்துக்கொள்ளும் எச்சரிக்கை உணர்வைக் கொண்டுள்ளது; נָא என்ற வேண்டுகோள் துகள் ‘தயவுசெய்து’ என்பதால் வெளிப்படுகிறது.
- source_word: בַבֹּקֶר
  choice: காலையில்
  rationale: சொற்றொடரின் நேரடியான பொருள் ‘காலையில்.’ சூழலில் அடுத்த காலை என இருக்கக்கூடியபோதிலும், மூலத்தில் வெளிப்படையாக இல்லாத ‘நாளைக் காலை’ என்பதைச் சேர்க்கவில்லை.
- source_word: וְיָשַׁבְתָּ
  choice: தங்கி
  rationale: ישב என்பது ‘உட்கார்’ என்றும் ‘தங்கு/இரு’ என்றும் பொருள்படலாம். மறைந்திருக்கும் அறிவுறுத்தலில் ‘தங்கி’ என்பதே சூழலுக்கேற்ற இயல்பான தமிழ்.
- source_word: בַסֵּתֶר
  choice: மறைவான ஓர் இடத்தில்
  rationale: סֵתֶר என்பது மறைவு, இரகசியம் அல்லது மறைவிடம் ஆகிய பொருட்களைக் கொண்டது. இங்கு இடத்தைக் குறிக்கும் வலிமையை ‘மறைவான ஓர் இடத்தில்’ பாதுகாக்கிறது.
- source_word: וְנַחְבֵּאתָ
  choice: ஒளிந்துகொள்
  rationale: חבא என்பது தன்னை மறைத்துக்கொள்வதைக் குறிக்கிறது. ‘ஒளிந்துகொள்’ அதன் தற்சார்பு வலிமையை இயல்பாகத் தருகிறது; முந்தைய ‘தங்கி’ என்பதுடன் இணைந்து அறிவுறுத்தலை வலியுறுத்துகிறது.
- source_word: יְהוֹנָתָן ... לְדָוִד ... שָׁאוּל אָבִי
  choice: யோனத்தான் ... தாவீதிடம் ... என் தந்தை சவுல்
  rationale: பெயர்கள் தமிழில் வழக்கமான வேதாகம ஒலிபெயர்ப்பு வடிவங்களில் தரப்பட்டுள்ளன. ‘என் தந்தை’ என்பது யோனத்தானின் உரையில் உள்ள உறவை வெளிப்படையாகப் பாதுகாத்து, எச்சரிக்கையின் தனிப்பட்ட பதற்றத்தையும் உணர்த்துகிறது.
