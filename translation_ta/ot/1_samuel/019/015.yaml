base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/019/015.yaml
  text: Then Saul sent the messengers to see David[a], saying, “Bring him up to me in the bed, so that I may put him to death.”
translation:
  language: ta
  text: அப்போது சவுல் தாவீதைப் பார்க்கத் தன் தூதுவர்களை அனுப்பி, “அவனைப் படுக்கையோடு[a] என்னிடம் தூக்கிக்கொண்டு வாருங்கள்; நான் அவனைக் கொல்ல வேண்டும்” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “படுக்கையில்” அல்லது “படுக்கையின் மேல்” என்றும் மொழிபெயர்க்கலாம். எபிரேய முன்னிடைச்சொல்லைப் பலவாறு புரிந்துகொள்ள முடியும்; தாவீது படுத்திருந்த நிலையிலேயே அவனைச் சுமந்துவரும்படி சவுல் கட்டளையிட்டிருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: அப்போது ... அனுப்பி
  rationale: வாவ் தொடர்வினை கதையின் அடுத்த நிகழ்வைக் குறிக்கிறது; நவீன தமிழ் கதைநடையில் ‘அப்போது’ இயல்பாக வரிசையை வெளிப்படுத்துகிறது.
- source_word: הַמַּלְאָכִים
  choice: தன் தூதுவர்களை
  rationale: இங்கு מַלְאָךְ என்பது விண்ணுலகத் தூதரை அல்ல, சவுலால் அனுப்பப்பட்ட மனிதர்களைக் குறிக்கிறது. ‘தூதுவர்கள்’ அந்த அரசவைக் சூழலுக்கு ஏற்றது.
- source_word: לִרְאוֹת אֶת דָּוִד
  choice: தாவீதைப் பார்க்க
  rationale: ראה என்பதன் நேர்ப்பொருளான ‘பார்’ என்பதைக் காக்கிறது; தாவீதின் இருப்பையோ நிலையையோ உறுதிசெய்யச் சென்றனர் என்று தேவையின்றி விளக்கவில்லை.
- source_word: לֵאמֹר
  choice: '... என்றான்'
  rationale: எபிரெய மொழியில் நேர்கூற்றை அறிமுகப்படுத்தும் வழக்கமான வடிவம். தமிழில் இயல்பான நேர்கூற்று அமைப்புக்காக மேற்கோளின் முடிவில் ‘என்றான்’ என வழங்கப்பட்டுள்ளது.
- source_word: הַעֲלוּ אֹתוֹ
  choice: அவனை ... தூக்கிக்கொண்டு வாருங்கள்
  rationale: Hiphil வடிவம் ‘மேலே கொண்டுவருதல்’ எனும் பொருளுடையது. படுக்கையில் கிடப்பவனைக் கொண்டுவரும் சூழலில் ‘தூக்கிக்கொண்டு வாருங்கள்’ செயலைத் தெளிவாகக் காட்டுகிறது; இலக்கு ‘என்னிடம்’ என்பதால் வருதல் இயல்பாகிறது.
- source_word: בַמִּטָּה
  choice: படுக்கையோடு
  rationale: בְּ முன்னிடைச்சொல் இங்கு ‘படுக்கையில்/படுக்கையின் மேல்/படுக்கையோடு’ எனப் புரிந்துகொள்ளப்படலாம். தாவீது படுத்திருந்த நிலையிலேயே சுமந்துவர வேண்டும் என்ற சூழலுக்கு ‘படுக்கையோடு’ இயல்பான தமிழாக உள்ளது; ambiguity அடிக்குறிப்பில் காக்கப்படுகிறது.
- source_word: אֵלַי
  choice: என்னிடம்
  rationale: முதலாம் நபரை நோக்கிய இலக்கை நேரடியாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: לַהֲמִתוֹ
  choice: நான் அவனைக் கொன்றுபோட வேண்டும்
  rationale: לְ உடன் வந்த infinitive நோக்கத்தை வெளிப்படுத்துகிறது. ‘கொன்றுபோட’ என்பது மரணமடையச் செய்வதைத் தெளிவாகக் கூறுகிறது; ‘வேண்டும்’ சவுலின் நோக்கத்தை இயல்பான தமிழில் தருகிறது.
