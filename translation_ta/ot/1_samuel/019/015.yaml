translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. அரசவைக் சூழலுக்கு ‘தூதுவர்கள்’ என்பதும், படுக்கையில் கிடப்பவனை எடுத்துவரும் செயலைக் காட்ட ‘தூக்கிக்கொண்டு வாருங்கள்’ என்பதும் தேர்ந்தெடுக்கப்பட்டன. எபிரெய בַמִּטָּה-வின் உண்மையான இலக்கண ambiguity அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
