translation_notes:
  register: நவீனத் தரமான, கண்ணியமான, பொதுவாசகர்களுக்கு எளிதில் புரியும் தமிழ் பயன்படுத்தப்பட்டுள்ளது. எபிரெய உரையின் குறிக்கப்படாத பிரதிப்பெயர் ‘அவன்’ எனவே வைக்கப்பட்டுள்ளது; சூழலிலிருந்து பெயரைச் சேர்க்கவில்லை. இடப்பெயர்கள் தமிழ் ஒலியமைப்புக்கு ஏற்ப ராமா, சேகூ, நாயோத் என வழங்கப்பட்டுள்ளன.
