base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/019/022.yaml
  text: He too went to Ramah[a], and he came as far as the great well that is at Seku. He asked and said, “Where are Samuel and David?” And one said, “Look[b], they are at Naioth in Ramah.”
translation:
  language: ta
  text: அவனும் ராமாவுக்குச் சென்றான். சேகூவில் இருந்த பெரிய கிணறு[a] வரை வந்து, “சாமுவேலும் தாவீதும் எங்கே?” என்று விசாரித்தான். அதற்கு ஒருவர்[b], “இதோ, அவர்கள் ராமாவிலுள்ள நாயோத்தில் இருக்கிறார்கள்” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘பெரிய கிணறு’ என்பதற்கான எபிரெயச் சொற்றொடரை ‘பெரிய நீர்த்தேக்கத் தொட்டி’ அல்லது ‘பெரிய குழி’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில், ‘அவன் சொன்னான்’ என்று உள்ளது; பதில் சொன்னவர் யார் என்பது குறிப்பிடப்படாததால், தெளிவுக்காக ‘ஒருவர்’ என்று மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרָמָתָה
  choice: ராமாவுக்குச்
  rationale: இடப்பெயருடன் இணைந்த திசையைக் குறிக்கும் -ה, ராமாவை நோக்கிய இயக்கத்தைக் காட்டுகிறது; நவீன தமிழில் ‘ராமாவுக்கு’ என்பது இயல்பான வடிவம்.
- source_word: בּוֹר הַגָּדוֹל
  choice: பெரிய கிணறு
  rationale: בּוֹר என்பது குழி, நீர்த்தேக்கத் தொட்டி அல்லது கிணறு எனப் பொருள்படலாம். இங்கு வழியிலுள்ள அறியப்பட்ட அடையாள இடமாக வருவதால் ‘பெரிய கிணறு’ முதன்மை உரையாகத் தேர்ந்தெடுக்கப்பட்டது; மாற்றுப் பொருள்கள் அடிக்குறிப்பில் தரப்பட்டுள்ளன.
- source_word: בַּשֶּׂכוּ
  choice: சேகூவில்
  rationale: இடப்பெயர் ஒலிபெயர்க்கப்பட்டு, எபிரெய இடவுருபு தமிழில் இயல்பாக ‘-வில்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: וַיִּשְׁאַל וַיֹּאמֶר
  choice: “...?” என்று விசாரித்தான்
  rationale: இரு எபிரெய வினைகளும் விசாரணையைத் தொடர்ந்து நேரடிக் கூற்று வருவதைச் சுட்டுகின்றன. தமிழில் அவற்றைத் தனித்தனியாக மொழிபெயர்ப்பது செயற்கையாக இருப்பதால், கேள்வியுடன் ‘விசாரித்தான்’ என இயல்பாகச் சொல்லப்பட்டது.
- source_word: אֵיפֹה
  choice: எங்கே
  rationale: சாமுவேல், தாவீது ஆகிய இருவரின் இருப்பிடத்தைக் கேட்கும் இயல்பான தமிழ் வினாச்சொல்.
- source_word: הִנֵּה
  choice: இதோ
  rationale: கவனத்தைத் திருப்பும் எபிரெயச் சொல்லின் சுட்டும் வலிமையை, நவீனமும் கண்ணியமுமான தமிழில் காக்கிறது.
- source_word: בנוית
  choice: நாயோத்தில்
  rationale: இடப்பெயர் ஒலிபெயர்க்கப்பட்டு, இருப்பிடத்தைக் குறிக்க ‘-இல்’ சேர்க்கப்பட்டது.
- source_word: בָּרָמָה
  choice: ராமாவிலுள்ள
  rationale: நாயோத் எந்த ராமாவுடன் தொடர்புடையது என்பதை இயல்பான தமிழில் தெளிவுபடுத்தும் இடவுருவாக்கம்.
- source_word: וַיֹּאמֶר
  choice: ஒருவர் ... என்றார்
  rationale: பதில் சொல்பவரை எபிரெய உரை வெளிப்படையாக அடையாளப்படுத்தவில்லை. தமிழில் வாக்கியம் முழுமையாகவும் இயல்பாகவும் இருக்க, குறிப்பிடப்படாத ஒருவரை ‘ஒருவர்’ என வழங்குகிறது; இது அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது.
