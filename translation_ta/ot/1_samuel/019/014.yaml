base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/019/014.yaml
  text: Then Saul sent messengers to seize David[a], and she said, “He is sick.”
translation:
  language: ta
  text: பின்பு சவுல் தாவீதைப் பிடிக்கத் தூதுவர்களை அனுப்பினான். அவள்[a], “அவர் நோய்வாய்ப்பட்டிருக்கிறார்” என்றாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் பெயரைக் குறிப்பிடாமல், பெண்பால் வினையுடன் ‘அவள் என்றாள்’ என்று மட்டுமே உள்ளது; சூழலிலிருந்து ‘அவள்’ என்பது மீகாளைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: பின்பு ... அனுப்பினான்
  rationale: வாவ் தொடர்வினை கதைநிகழ்வின் அடுத்த கட்டத்தை முன்னெடுக்கிறது; ‘பின்பு’ இயல்பான தமிழ் நிகழ்வோட்டத்தைக் கொடுக்கிறது.
- source_word: מַלְאָכִים
  choice: தூதுவர்களை
  rationale: இங்கு சவுலால் அனுப்பப்பட்ட மனிதத் தூதர்களையே குறிக்கிறது; வானதூதர்களை அல்ல. ‘தூதுவர்கள்’ என்பது அவர்களது அனுப்பப்பட்ட பணியைத் தெளிவாகக் காட்டுகிறது.
- source_word: לָקַחַת
  choice: பிடிக்க
  rationale: இந்த வினை பொதுவாக ‘எடுக்க’ என்று பொருள்படலாம்; ஆனால் இச்சூழலில் தாவீதைக் கைது செய்யும் நோக்கம் உள்ளதால் ‘பிடிக்க’ என்பது பகைமைச் சூழலை மிகைப்படுத்தாமல் வெளிப்படுத்துகிறது.
- source_word: וַתֹּאמֶר
  choice: அவள் ... என்றாள்
  rationale: எபிரெய வினை பெண்பால் ஒருமையில் உள்ளது; எழுவாய் பெயரால் குறிப்பிடப்படவில்லை. முந்தைய சூழலிலிருந்து அது மீகாள் என்று புரிகிறது. எளிய இணைப்பை எதிர்மறைத் தொடர்பாக மாற்றாமல் தமிழில் அடுத்த வாக்கியமாக வழங்கப்பட்டுள்ளது.
- source_word: חֹלֶה הוּא
  choice: அவர் நோய்வாய்ப்பட்டிருக்கிறார்
  rationale: பெயரடைப் பயனிலை மற்றும் ஆண்பால் சுட்டுப்பெயர் சேர்ந்து தாவீதின் நோய்நிலையைச் சொல்கின்றன. கணவரைக் குறிக்கும் இயல்பான மரியாதை ஒருமையை நவீனத் தமிழில் பயன்படுத்துகிறது.
