- from: சவுல் தாவீதைக் கொன்றுபோடும்படி தன் மகன் யோனத்தானிடமும் தன் பணியாளர்கள் அனைவரிடமும் கூறினார்.[a] ஆனால் சவுலின் மகன் யோனத்தான் தாவீதின்மேல் மிகுந்த பிரியம் கொண்டிருந்தான்.[b]
  to: சவுல் தாவீதைக் கொல்லும்படி தன் மகன் யோனத்தானிடமும் தன் பணியாளர்கள் அனைவரிடமும் கூறினார்.[a] ஆனால் சவுலின் மகன் யோனத்தான் தாவீதின்மேல் மிகுந்த பிரியம் கொண்டிருந்தான்.[b]
  rationale: A limited register and precision revision replaces the colloquial, intensified “கொன்றுபோடும்படி” with neutral “கொல்லும்படி.” Footnote b is refined to provide alternatives that accurately express Jonathan’s delight in David. No doctrinal interpretation has been added, and both footnote anchors remain present and correctly associated with their respective clauses.
