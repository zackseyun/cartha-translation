translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. அரசவைக் சூழலுக்குப் பொருத்தமாக ‘பணியாளர்கள்’ என்றும், חפץ என்பதன் தனிப்பட்ட நுட்பத்தைத் தக்கவைக்க ‘பிரியம் கொண்டிருந்தான்’ என்றும் வழங்கப்பட்டுள்ளது. எல்லா அடிக்குறிப்பு குறிகளும் பிரதான உரையில் இடம்பெற்றுள்ளன.
