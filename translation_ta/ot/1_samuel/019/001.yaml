base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/019/001.yaml
  text: Saul spoke to Jonathan his son and to all his servants to put David to death[b][a], but Jonathan son of Saul delighted greatly in David.
translation:
  language: ta
  text: சவுல் தாவீதைக் கொல்லும்படி தன் மகன் யோனத்தானிடமும் தன் பணியாளர்கள் அனைவரிடமும் கூறினார்.[a] ஆனால் சவுலின் மகன் யோனத்தான் தாவீதின்மேல் மிகுந்த பிரியம் கொண்டிருந்தான்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'வேறு மொழிபெயர்ப்பு: “தாவீதைக் கொலை செய்யும்படி.” எபிரெய வினைச்சொல் சொற்படியாக ஒருவரை மரணமடையச் செய்வதைக் குறிக்கிறது.'
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “தாவீதில் மிகவும் மகிழ்ந்தான்,” “தாவீதின்மேல் மிகுந்த விருப்பம் கொண்டிருந்தான்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: கூறினார்
  rationale: דבר என்பது இங்கு சவுல் யோனத்தானிடமும் பணியாளர்களிடமும் தன் நோக்கத்தைக் கூறியதைக் குறிக்கிறது; இயல்பான தமிழ் நடைக்காக ‘கூறினார்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: עֲבָדָיו
  choice: தன் பணியாளர்கள்
  rationale: அரசவைக் சூழலில் עבד அரசனுக்குப் பணிபுரிவோரை அல்லது அதிகாரிகளைக் குறிக்கலாம். ‘பணியாளர்கள்’ என்பது மூலச்சொல்லுடன் நெருக்கமாகவும் நவீன தமிழில் இயல்பாகவும் உள்ளது.
- source_word: לְהָמִית אֶת דָּוִד
  choice: தாவீதைக் கொன்றுபோடும்படி
  rationale: המית என்ற காரணவினையின் ‘மரணமடையச் செய்தல்/கொன்றுபோடுதல்’ என்ற பொருளையும், לְ உடைய நோக்கம் அல்லது பேச்சின் உள்ளடக்கம் என்ற நுட்பத்தையும் இத்தொடர் வெளிப்படுத்துகிறது.
- source_word: וִיהוֹנָתָן
  choice: ஆனால் ... யோனத்தான்
  rationale: இணைப்புச்சொல் இங்கு சவுலின் கொலைநோக்கத்துக்கும் யோனத்தானின் ஆழ்ந்த பிரியத்துக்கும் இடையிலான முரண்பாட்டைக் காட்டுகிறது.
- source_word: חָפֵץ בְּדָוִד מְאֹד
  choice: தாவீதின்மேல் மிகுந்த பிரியம் கொண்டிருந்தான்
  rationale: חפץ என்பது ஒருவரில் மகிழ்தல், விருப்பம் அல்லது பிரியம் கொள்ளுதல் என்பதைக் குறிக்கிறது. ‘மிகுந்த பிரியம்’ என்பது מְאֹד என்பதையும் அன்பின் வலிமையையும் தெரிவிக்கிறது; אהב என்பதற்குரிய நேரடியான ‘அன்பு’ சொல்லை இங்கு இறக்குமதி செய்யவில்லை.
- source_word: בְּנוֹ / בֶּן שָׁאוּל
  choice: தன் மகன் / சவுலின் மகன்
  rationale: மூலத்தில் இருமுறை வரும் மகன் உறவுக் குறிப்பைத் தக்கவைத்து, சவுலின் நோக்கத்துக்கும் யோனத்தானின் மனநிலைக்கும் இடையிலான பதற்றத்தை வெளிப்படுத்துகிறது.
