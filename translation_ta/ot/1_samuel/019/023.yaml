base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/019/023.yaml
  text: So he went there[a], to Naioth in Ramah, and the Spirit of God came upon him also; and he went on, prophesying[b], until he came to Naioth in Ramah.
translation:
  language: ta
  text: அவன் அங்கே ராமாவிலுள்ள நாயோத்துக்குச் சென்றான்.[a] கடவுளின் ஆவி அவன்மேலும் வந்தது;[b] அவன் ராமாவிலுள்ள நாயோத்தை அடையும் வரை தீர்க்கதரிசனம் செய்துகொண்டே சென்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ராமாவில் உள்ள நாயோத்.”
    reason: lexical_alternative
  - marker: b
    text: சொல்லுக்கு நெருக்கமாக, “கடவுளின் ஆவி அவன்மேல் இருந்தது.”
    reason: lexical_alternative
lexical_decisions:
- source_word: נוית בָּרָמָה
  choice: ராமாவிலுள்ள நாயோத்
  rationale: נוית என்ற இடப்பெயர் ‘நாயோத்’ என்று ஒலிபெயர்க்கப்படுகிறது. בָּרָמָה என்பது இங்கு அந்த இடம் ராமாவில் இருப்பதைக் குறிக்கும் வகையில் இயல்பான தமிழில் ‘ராமாவிலுள்ள’ என்று மொழிபெயர்க்கப்படுகிறது.
- source_word: וַתְּהִי עָלָיו ... רוּחַ אֱלֹהִים
  choice: கடவுளின் ஆவி அவன்மேலும் வந்தது
  rationale: היה על என்ற எபிரெய மரபுத்தொடர், ஒருவர்மேல் ஆவி செயல்படத் தொடங்குவதை இச்சூழலில் குறிக்கிறது. ‘அவன்மேலும்’ என்பது גַּם הוּא என்பதன் சேர்க்கைப் பொருளைப் பாதுகாக்கிறது.
- source_word: וַיֵּלֶךְ הָלוֹךְ
  choice: போய்க்கொண்டே
  rationale: வினைச்சொல்லுடன் வரும் வினையெச்ச வலியுறுத்தல் தொடர்ச்சியான செயலைக் காட்டுகிறது; ‘போய்க்கொண்டே’ என்பது அதை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: וַיִּתְנַבֵּא
  choice: தீர்க்கதரிசனம் செய்தான்
  rationale: சவுலின் செயல் எந்த வடிவில் வெளிப்பட்டது என்பதை மூலவசனம் விளக்கவில்லை. எனவே ‘தீர்க்கதரிசனம் செய்தான்’ என்று பரந்த பொருளுடன் மொழிபெயர்த்து, ‘வெறிகொண்டான்’ போன்ற கூடுதல் விளக்கங்கள் தவிர்க்கப்படுகின்றன.
- source_word: עַד בֹּאוֹ
  choice: வந்து சேரும்வரை
  rationale: பின்னொட்டுடன் கூடிய வினையெச்சப் பெயர்ச்சொல் அமைப்பு தமிழில் இயல்பான காலவரையறைத் தொடராக வழங்கப்படுகிறது.
- source_word: שָׁם
  choice: அங்கே
  rationale: முந்தைய சூழலில் குறிப்பிடப்பட்ட இலக்கைச் சுட்டும் உரையாடல் இணைப்பாக இது தக்கவைக்கப்படுகிறது.
theological_decisions:
- issue: רוּחַ אֱלֹהִים என்பது கடவுளின் ஆவியைக் குறிக்கிறதா அல்லது கடவுளிடமிருந்து வந்த ஓர் ஆவியைக் குறிக்கிறதா?
  choice: கடவுளின் ஆவி
  alternative: கடவுளிடமிருந்து வந்த ஓர் ஆவி
  rationale: சாமுவேல் நூலின் இப்பகுதியில் இந்தச் சொற்றொடர் கடவுளிடமிருந்து வரும் வல்லமையூட்டும் ஆவியைக் குறிப்பதே அதிகச் சாத்தியம். தமிழில் எழுத்து வடிவத்தால் தனிப்பெயர் வேறுபாடு காட்டப்படாததால், உரை தேவையற்ற கோட்பாட்டு விளக்கத்தைச் சேர்க்கவில்லை.
- issue: சவுலின் தீர்க்கதரிசனச் செயலின் தன்மை
  choice: தீர்க்கதரிசனம் செய்தான்
  alternative: தீர்க்கதரிசியைப்போல் நடந்துகொண்டான்
  rationale: மூலவசனம் செயலின் உளவியல் அல்லது சடங்கு வடிவத்தை வரையறுக்கவில்லை. நேரடியான மொழிபெயர்ப்பு அந்தத் தெளிவின்மையையும் இறையியல் பதற்றத்தையும் பாதுகாக்கிறது.
translation_notes:
  register: நவீன பொதுத்தரத் தமிழில், வாசிக்க எளிதான அதேவேளையில் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. இடப்பெயர்கள் வழக்கமான தமிழ் ஒலிபெயர்ப்பில் தரப்பட்டுள்ளன; மூலத்தின் தொடர்ச்சிச் செயலும் திட்டமிட்ட தெளிவின்மையும் பாதுகாக்கப்பட்டுள்ளன.
