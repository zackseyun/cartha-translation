source:
  edition: WLC
  text: וַ/יַּגִּ֣דוּ לְ/שָׁא֗וּל וַ/יִּשְׁלַח֙ מַלְאָכִ֣ים אֲחֵרִ֔ים וַ/יִּֽתְנַבְּא֖וּ גַּם הֵ֑מָּה וַ/יֹּ֣סֶף שָׁא֗וּל וַ/יִּשְׁלַח֙ מַלְאָכִ֣ים שְׁלִשִׁ֔ים וַ/יִּֽתְנַבְּא֖וּ גַּם הֵֽמָּה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/019/021.yaml
  text: When they told Saul[a], he sent other messengers, and they also prophesied. Then Saul again sent a third group of messengers[b], and they also prophesied.
translation:
  language: ta
  text: அதைச் சவுலுக்கு அறிவித்தார்கள். அவன் வேறு தூதர்களை அனுப்பினான்; அவர்களும் தீர்க்கதரிசனம் உரைத்தார்கள்.[a] சவுல் மீண்டும் மூன்றாவது முறையாகத் தூதர்களை அனுப்பினான்; அவர்களும் தீர்க்கதரிசனம் உரைத்தார்கள்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மொழியில் “அவர்களும்கூட” என்பது வலியுறுத்தப்படுகிறது; முந்தைய தூதர்களைப் போல இவர்களும் தீர்க்கதரிசனம் உரைத்தார்கள்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெய மொழியில் “மூன்றாவது”; அதாவது, சவுல் மூன்றாவது முறையாகத் தூதர்களை அனுப்பினான்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּגִּדוּ לְשָׁאוּל
  choice: அதைச் சவுலுக்கு அறிவித்தார்கள்
  rationale: נגד என்பதன் ஹிபில் வடிவம் ‘அறிவித்தல்/தெரிவித்தல்’ என்று பொருள்படும். முந்தைய நிகழ்வைப் பற்றிய செய்தி சவுலிடம் தெரிவிக்கப்பட்டதை இயல்பான தமிழில் கூறுகிறது.
- source_word: מַלְאָכִים אֲחֵרִים
  choice: வேறு தூதர்களை
  rationale: இங்கு מַלְאָכִים என்பது தேவதூதர்களை அல்ல, சவுலால் அனுப்பப்பட்ட மனிதத் தூதர்களைக் குறிக்கிறது; אֲחֵרִים என்பதன் பன்மைப் பொருளை ‘வேறு’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וַיִּתְנַבְּאוּ גַּם הֵמָּה
  choice: அவர்களும் தீர்க்கதரிசனம் உரைத்தார்கள்
  rationale: נבא என்பதன் ஹித்பயேல் வடிவம் தீர்க்கதரிசனச் செயல்பாட்டைச் சுட்டுகிறது. அதன் துல்லியமான வெளிப்பாடு எப்படியிருந்தது என்பதை வரையறுக்காமல், גַּם הֵמָּה வலியுறுத்தும் ‘அவர்களும்’ என்பதைக் காக்கிறது.
- source_word: וַיֹּסֶף שָׁאוּל וַיִּשְׁלַח
  choice: சவுல் மீண்டும் ... அனுப்பினான்
  rationale: יסף இங்கு சவுல் அதே செயலை மறுபடியும் செய்தான் என்ற தொடர்ச்சியான பொருளைக் கொண்டுள்ளது.
- source_word: מַלְאָכִים שְׁלִשִׁים
  choice: மூன்றாவது முறையாகத் தூதர்களை
  rationale: שְׁלִשִׁים இச்சூழலில் ‘முப்பது’ என்ற எண்ணைக் குறிக்காமல், மூன்றாவது அனுப்புதலைக் குறிக்கிறது. தமிழில் ‘மூன்றாவது முறையாக’ என்பது அந்தப் பொருளைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
theological_decisions:
- issue: சவுலின் தூதர்களுடைய தீர்க்கதரிசனச் செயலின் தன்மை
  choice: ‘தீர்க்கதரிசனம் உரைத்தார்கள்’ என்று பொதுவாக மொழிபெயர்க்கப்பட்டது.
  alternative: ‘பரவச நிலையில் தீர்க்கதரிசனம் சொன்னார்கள்’ அல்லது ‘தீர்க்கதரிசிகளைப் போல நடந்துகொண்டார்கள்’
  rationale: இது ஆவியால் உண்டான தீர்க்கதரிசன நிகழ்வு என்பதைச் சூழல் காட்டினாலும், அதன் வெளிப்பாடு பரவசப் பேச்சா, துதியா, வேறொரு செயலா என்பதை இவ்வசனம் விளக்கவில்லை. ஆகவே மூலத்தின் பரந்த பொருளும் இறையியல் சார்ந்த தெளிவின்மையும் காக்கப்படுகின்றன.
translation_notes:
  register: நவீனத் தரமான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான வரலாற்று நடையில் வடிவமைக்கப்பட்டது. ‘தீர்க்கதரிசனம் உரைத்தார்கள்’ என்ற வழக்கமான வேதாகமச் சொற்றொடர் வைக்கப்பட்டாலும், நிகழ்வின் தன்மை தேவையின்றி விளக்கப்படவில்லை. அனைத்து அடிக்குறிப்புக் குறிகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
