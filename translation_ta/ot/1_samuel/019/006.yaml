base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/019/006.yaml
  text: Saul listened to Jonathan’s voice[a], and Saul swore, “As Yahweh lives, he shall not be put to death.”
translation:
  language: ta
  text: சவுல் யோனத்தானின் பேச்சுக்குச் செவிகொடுத்தார். பின்னர் சவுல், “யாவே வாழ்கிறபடியால், தாவீது கொல்லப்பட மாட்டான்” என்று சத்தியம் செய்தார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரெயத்தில்: “யாவே வாழ்கிறபடியால், அவன் கொல்லப்பட்டால் …” இது உறுதிமொழிகளில் வரும் நீள்வட்டமான வடிவம். இங்குள்ள “என்றால்” வலுவான மறுப்பை உணர்த்துகிறது: “அவன் நிச்சயமாகக் கொல்லப்பட மாட்டான்.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע ... בְּקוֹל יְהוֹנָתָן
  choice: யோனத்தானின் பேச்சுக்குச் செவிகொடுத்தார்
  rationale: שׁמע בקול என்பது வெறுமனே கேட்டதைக் காட்டாமல், ஒருவரின் வேண்டுகோளை ஏற்றுச் செயல்படுவதைக் குறிக்கும். இயல்பான தமிழில் ‘பேச்சுக்குச் செவிகொடுத்தார்’ அந்தப் பதிலளிக்கும் பொருளைக் காக்கிறது.
- source_word: וַיִּשָּׁבַע
  choice: ஆணையிட்டார்
  rationale: இந்த வினைச்சொல் சத்தியம் அல்லது உறுதிமொழி செய்வதைக் குறிக்கிறது; தொடர்ந்து வரும் தெய்வீகப் பெயரால் அமைந்த உறுதிமொழிச் சூத்திரத்திற்கு ‘ஆணையிட்டார்’ பொருந்துகிறது.
- source_word: חַי יְהוָה
  choice: யாவே உயிரோடிருப்பது உறுதி
  rationale: எபிரெய உறுதிமொழிச் சூத்திரத்தின் நேரடியான படிமத்தையும் அதன் வலிமையையும் இயல்பான தமிழில் காக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரைப் பட்டப்பெயரால் மாற்றாமல், எபிரெய நான்கெழுத்துப் பெயரின் வழக்கமான தமிழாக்கமாக வழங்குகிறது.
- source_word: אִם יוּמָת
  choice: தாவீது கொல்லப்பட மாட்டான்
  rationale: உறுதிமொழிச் சூழலில் אִם விடுபட்ட சாபவாக்கியத்துடன் வலுவான மறுப்பை உணர்த்துகிறது. יוּמָת என்பது ஹொஃபால் வடிவில் ‘கொல்லப்படுதல்/மரணதண்டனைக்கு உட்படுத்தப்படுதல்’ என்று பொருள்படும். முந்தைய சூழலிலிருந்து குறிக்கப்படுபவர் தாவீது என்பதால் தமிழில் பெயர் வெளிப்படுத்தப்பட்டுள்ளது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூலத்தில் தனிப்பட்ட தெய்வீகப் பெயர் நேரடியாக உள்ளது; ஆகவே அதை ஒரு பட்டப்பெயரால் மாற்றாமல் ஒலிபெயர்ப்பது மூலத்தின் வேறுபாட்டைக் காக்கிறது.
- issue: אִם יוּמָת என்ற உறுதிமொழிச் சொற்றொடரின் பொருள்
  choice: தாவீது கொல்லப்பட மாட்டான்
  alternative: அவன் கொல்லப்பட்டால்…
  rationale: எபிரெய உறுதிமொழிகளில் אִם உடன் வரும் சாபப்பகுதி விடுபடலாம்; இங்கு நோக்கம் வலுவான மறுப்பு. அதை நேரடியான நிபந்தனையாக மொழிபெயர்த்தால் தமிழில் கருத்து முழுமையற்றதாகவும் தவறாகவும் தோன்றும்.
translation_notes:
  register: நவீனத் தரமான, மரியாதைமிக்க தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘செவிகொடுத்தார்’ என்பது அர்த்தத்தை ஏற்றுக்கொண்டு இணங்கியதைக் காட்டுகிறது. மேற்கோளில் குறிக்கப்படுபவர் முந்தைய சூழலின் தாவீது என்பதால், தெளிவுக்காக அவரது பெயர் சேர்க்கப்பட்டுள்ளது; அடிக்குறிப்பு எபிரெய உறுதிமொழியின் சுருக்கப்பட்ட வடிவத்தைப் பாதுகாக்கிறது.
