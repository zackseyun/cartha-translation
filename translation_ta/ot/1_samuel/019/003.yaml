base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/019/003.yaml
  text: I will go out and stand beside my father in the field where you are[a], and I will speak to my father about you. Then I will see what happens and tell you.
translation:
  language: ta
  text: நான் வெளியே போய், நீ இருக்கும் வயலில் என் தந்தையின் அருகே நின்றுகொள்வேன். உன்னைப் பற்றி என் தந்தையிடம் பேசுவேன். பிறகு என்ன நடக்கிறது என்று பார்த்து[a], உனக்குத் தெரிவிப்பேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: நேர்ச்சொல்லாக, “என்ன என்று பார்ப்பேன்.” இது “என்ன நடக்கிறது என்று பார்ப்பேன்” அல்லது “நிலைமை என்னவென்று பார்ப்பேன்” எனப் பொருள்படும் சுருக்கமான கூறு.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵצֵא
  choice: நான் வெளியே போய்
  rationale: יצא என்பதன் திசை சார்ந்த பொருளை இயல்பான நவீனத் தமிழில் தருகிறது; தொடரும் செயலுடன் இணைக்க வினையெச்ச வடிவம் பயன்படுத்தப்பட்டுள்ளது.
- source_word: וְעָמַדְתִּי לְיַד אָבִי
  choice: என் தந்தையின் அருகே நின்றுகொள்வேன்
  rationale: לְיַד என்ற மரபுத்தொடரின் ‘அருகே/பக்கத்தில்’ என்ற பொருளைப் பாதுகாக்கிறது; திட்டமிட்டு ஓர் இடத்தில் நிற்பதை ‘நின்றுகொள்வேன்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: בַּשָּׂדֶה אֲשֶׁר אַתָּה שָׁם
  choice: நீ இருக்கும் வயலில்
  rationale: שָׁם என்பதின் இடப்பொருளைத் தமிழின் ‘இருக்கும்’ என்ற தொடர்பெச்ச அமைப்பில் இயல்பாக உள்ளடக்குகிறது.
- source_word: אֲדַבֵּר בְּךָ אֶל אָבִי
  choice: உன்னைப் பற்றி என் தந்தையிடம் பேசுவேன்
  rationale: דבר ב என்ற அமைப்பு இங்கு ஒருவரைக் குறித்து பேசுவதைக் குறிக்கிறது; ‘உன்னைப் பற்றி’ என்பது தெளிவான நவீனத் தமிழ்.
- source_word: וְרָאִיתִי מָה
  choice: பிறகு என்ன நடக்கிறது என்று பார்த்து
  rationale: எபிரெயத்தில் இது சொல் விடுபட்ட சுருக்கமான கூறு; சூழலில் யோனத்தான் நிலைமை எவ்வாறு அமைகிறது என்பதை அறியப் பார்ப்பதை இவ்வாறு இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וְהִגַּדְתִּי לָךְ
  choice: உனக்குத் தெரிவிப்பேன்
  rationale: נגד என்பதன் Hiphil வடிவம் ‘அறிவித்தல்/தெரிவித்தல்’ என்று பொருள்படும்; ‘தெரிவிப்பேன்’ சூழலுக்கேற்ற இயல்பும் மரியாதையான நடையும் உடையது.
