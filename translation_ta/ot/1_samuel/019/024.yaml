base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/019/024.yaml
  text: He too stripped off his clothes[a], and he too prophesied before Samuel. He lay naked all that day and all that night. Therefore they say[b], “Is Saul also among the prophets?”
translation:
  language: ta
  text: அவரும் தமது ஆடைகளைக் கழற்றினார்; அவரும் சாமுவேலுக்கு முன்பாக இறைவாக்குரைத்தார். அந்த நாள் முழுவதும், அந்த இரவு முழுவதும் ஆடையின்றி[a] விழுந்து கிடந்தார். அதனால்தான், “சவுலும் இறைவாக்கினர்களுள் ஒருவரா?” என்று சொல்கிறார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இங்கு வரும் எபிரெயச் சொல் முழுமையாக நிர்வாணமாக இருந்ததையோ, வெளிப்புற ஆடைகள் கழற்றப்பட்ட நிலையையோ குறிக்கலாம்; வசனம் இதை மேலும் விளக்கவில்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְשַׁט ... בְּגָדָיו
  choice: தமது ஆடைகளைக் கழற்றினார்
  rationale: פשט உடன் בגדים என்பது ஆடைகளை அகற்றுவதைக் குறிக்கிறது. ‘ஆடைகளைக் கழற்றினார்’ என்பது நவீனத் தமிழில் இயல்பாகவும் மூலத்தின் பொருளுக்கு நெருக்கமாகவும் உள்ளது.
- source_word: גַּם הוּא ... גַם הוּא
  choice: அவரும் ... அவரும்
  rationale: சவுலும் அவருக்கு முன் அனுப்பப்பட்ட தூதர்களைப் போலவே இந்த அனுபவத்துக்கு உள்ளானார் என்பதை வலியுறுத்தும் எபிரெய மறுபதிப்பு தமிழிலும் காக்கப்பட்டுள்ளது.
- source_word: וַיִּתְנַבֵּא
  choice: இறைவாக்குரைத்தார்
  rationale: இந்த வினை தீர்க்கமுன்னறிவிப்பை மட்டும் கட்டாயப்படுத்தாமல், தெய்வீகத் தாக்கத்திலான இறைவாக்குச் செயல்பாட்டைக் குறிக்கிறது. அதன் சரியான வெளிப்பாட்டு முறையை வசனம் வரையறுக்காததால் பொதுவான மொழிபெயர்ப்பு தேர்ந்தெடுக்கப்பட்டது.
- source_word: לִפְנֵי שְׁמוּאֵל
  choice: சாமுவேலுக்கு முன்பாக
  rationale: לפני இங்கு சாமுவேலின் முன்னிலையில் என்பதைக் குறிக்கிறது; ‘முன்பாக’ சுருக்கமாகவும் நேரடியாகவும் உள்ளது.
- source_word: וַיִּפֹּל עָרֹם
  choice: ஆடையின்றி விழுந்து கிடந்தார்
  rationale: ‘விழுந்து’ என்பது נפל என்பதன் நிகழ்வையும், ‘கிடந்தார்’ என்பது தொடர்ந்து ஒரு பகலும் இரவும் இருந்த நிலையையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது. עָרֹם மென்மைப்படுத்தப்படாமல் ‘ஆடையின்றி’ என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: כָּל הַיּוֹם הַהוּא וְכָל הַלָּיְלָה
  choice: அந்த நாள் முழுவதும், அந்த இரவு முழுவதும்
  rationale: கால அளவை வலியுறுத்தும் மூலத்தின் இணையான அமைப்பைத் தமிழிலும் காக்கிறது.
- source_word: עַל כֵּן יֹאמְרוּ
  choice: அதனால்தான் ... என்று சொல்கிறார்கள்
  rationale: இது பழமொழிபோன்ற கேள்விக்கான காரணத்தை அறிமுகப்படுத்துகிறது. நிகழ்காலப் பன்மை எபிரெய வடிவத்தின் பொதுவழக்குப் பொருளை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: הֲגַם שָׁאוּל בַּנְּבִיאִם
  choice: சவுலும் இறைவாக்கினர்களுள் ஒருவரா?
  rationale: கேள்வியின் பழமொழித் தன்மையையும் ‘தீர்க்கதரிசிகளின் நடுவில்/குழுவில்’ என்ற பொருளையும் தெளிவான நவீனத் தமிழில் தருகிறது.
theological_decisions:
- issue: சவுலின் ஆடையற்ற நிலை (עָרֹם)
  choice: முதன்மை உரையில் ‘ஆடையின்றி’ என்று நேரடியாக மொழிபெயர்த்தல்
  alternative: மேலாடைகளை மட்டும் கழற்றியிருந்தார் என்று குறிப்பிடுதல்
  rationale: עָרֹם பொதுவாக நிர்வாணம் அல்லது ஆடையற்ற நிலையைக் குறிக்கிறது; ஆனால் முழு நிர்வாணமா, வெளிப்புற ஆடைகள் அகற்றப்பட்ட நிலையா என்பதை இவ்வசனம் மேலும் விளக்கவில்லை. ஆகவே முதன்மை உரை அதன் வலிமையைத் தக்கவைத்து, சாத்தியமான வரம்பை அடிக்குறிப்பு குறிப்பிடுகிறது.
- issue: சவுலின் இறைவாக்குச் செயலின் இயல்பு
  choice: ‘இறைவாக்குரைத்தார்’ என்று மொழிபெயர்த்து அதன் துல்லியமான வெளிப்பாட்டு முறையைத் தீர்மானிக்காமல் விடுதல்
  alternative: பரவசமான தீர்க்கதரிசன நிலையில் இருந்தார் அல்லது இறைவாக்கினரைப் போல நடந்துகொண்டார்
  rationale: வசனம் இது முன்னறிவிப்புச் சொற்களா, பரவச நடத்தைதானா, இரண்டும் சேர்ந்ததா என்பதை வரையறுக்கவில்லை. பொதுவான வினைச்சொல் அந்தத் தெளிவின்மையையும் இறையியல் இழுபறியையும் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. ‘தீர்க்கதரிசனம் உரைத்தார்’ என்பதில் ஏற்படக்கூடிய முன்னறிவிப்பு சார்ந்த குறுகிய பொருளைத் தவிர்க்க ‘இறைவாக்குரைத்தார்’ பயன்படுத்தப்பட்டது. எபிரெய மூலத்தில் இருமுறை வரும் גם הוא என்பதன் வலியுறுத்தல் தமிழிலும் ‘அவரும் ... அவரும்’ எனக் காக்கப்பட்டது.
