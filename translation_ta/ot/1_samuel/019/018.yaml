source:
  edition: WLC
  text: וְ/דָוִ֨ד בָּרַ֜ח וַ/יִּמָּלֵ֗ט וַ/יָּבֹ֤א אֶל שְׁמוּאֵל֙ הָ/רָמָ֔תָ/ה וַ/יַּ֨גֶּד ל֔/וֹ אֵ֛ת כָּל אֲשֶׁ֥ר עָֽשָׂה ל֖/וֹ שָׁא֑וּל וַ/יֵּ֤לֶךְ הוּא֙ וּ/שְׁמוּאֵ֔ל וַ/יֵּשְׁב֖וּ ב/נוית־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/019/018.yaml
  text: David fled and escaped[a], and he came to Samuel at Ramah and told him all that Saul had done to him. Then he and Samuel went and stayed at Naioth.
translation:
  language: ta
  text: தாவீது தப்பியோடி உயிர்தப்பி, ராமாவிலிருந்த சாமுவேலிடம் வந்து, சவுல் தனக்குச் செய்த அனைத்தையும் அவரிடம் சொன்னான். பின்பு அவனும் சாமுவேலும் புறப்பட்டுச் சென்று நாயோத்தில்[a] தங்கினார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “நாயோத்” என்பது ஓர் இடப்பெயர்; இப்பெயர் ராமாவுடன் தொடர்புடைய குடியிருப்புகளையோ ஒரு குடியிருப்புப் பகுதியையோ குறித்திருக்கலாம்.
    reason: cultural_note
lexical_decisions:
- source_word: בָּרַח וַיִּמָּלֵט
  choice: தப்பியோடி உயிர்தப்பி
  rationale: முதல் வினை ஆபத்திலிருந்து ஓடுவதையும், அடுத்த வினை வெற்றிகரமாகத் தப்பியதையும் குறிக்கிறது. இரண்டின் தொடர்ச்சியையும் இயல்பான தமிழில் காக்கிறது; வெளிப்படையாக இல்லாத தெய்வீக விடுதலைக் கருத்தைச் சேர்க்கவில்லை.
- source_word: הָרָמָתָה
  choice: ராமாவிலிருந்த சாமுவேலிடம்
  rationale: திசையைக் குறிக்கும் இறுதி ה ராமாவை நோக்கிய பயணத்தைச் சுட்டுகிறது. தமிழில் சாமுவேல் அங்கிருந்தார் என்பதை இயல்பாகத் தெரிவித்து, ‘சாமுவேலிடம் வந்தான்’ என்ற வாக்கிய அமைப்பைத் தெளிவாக்குகிறது.
- source_word: וַיַּגֶּד לוֹ
  choice: அவரிடம் சொன்னான்
  rationale: נגד என்பதன் ஹிஃபில் வடிவம் இங்கு தெரிவித்தல் அல்லது சொல்லுதல் என்ற இயல்பான கதைநடைப் பொருளைக் கொண்டுள்ளது. சாமுவேலுக்கான மரியாதை ஒருமையைப் பயன்படுத்துகிறது.
- source_word: אֵת כָּל אֲשֶׁר עָשָׂה לוֹ שָׁאוּל
  choice: சவுல் தனக்குச் செய்த அனைத்தையும்
  rationale: כָּל என்பதன் முழுமையையும், לוֹ என்பதன் தனிப்பட்ட பாதிப்பையும் சுருக்கமாகவும் தெளிவாகவும் காக்கிறது.
- source_word: וַיֵּלֶךְ הוּא וּשְׁמוּאֵל
  choice: பின்பு அவனும் சாமுவேலும் புறப்பட்டுச் சென்று
  rationale: வாவ் தொடரின் கதைநடை வரிசையை ‘பின்பு’ காட்டுகிறது. வெளிப்படையான הוּא இருவரையும் இணைத்துச் சொல்லும் ‘அவனும் சாமுவேலும்’ என்ற அமைப்பில் பாதுகாக்கப்படுகிறது.
- source_word: וַיֵּשְׁבוּ
  choice: தங்கினார்கள்
  rationale: ישׁב என்பதன் அடிப்படைப் பொருள் உட்காருதல் அல்லது குடியிருத்தல் என்றாலும், இப்பயணச் சூழலில் ஒரு இடத்தில் தங்கியிருத்தலைக் குறிக்கிறது.
- source_word: בְנוית
  choice: நாயோத்தில்
  rationale: இது ஓர் இடப்பெயராகப் புரிந்துகொள்ளப்படுகிறது. בְ முன்னொட்டின் இடப்பொருளைத் தமிழ் வேற்றுமை உருபு வெளிப்படுத்துகிறது.
