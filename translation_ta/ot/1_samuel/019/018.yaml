translation_notes:
  register: நவீனத் தரமான, மரியாதைமிக்க தமிழ் கதைநடை. தாவீதுக்கு ‘அவன்’, வயதிலும் பதவியிலும் மூத்த சாமுவேலுக்கு ‘அவர்’ என்ற இயல்பான தமிழ் மரியாதை வேறுபாடு பயன்படுத்தப்பட்டுள்ளது. மூலத்தில் இல்லாத தொடக்கக் காலச் சுட்டுச்சொல் சேர்க்கப்படவில்லை.
