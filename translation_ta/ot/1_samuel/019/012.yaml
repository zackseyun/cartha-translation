translation:
  language: ta
  text: அப்போது மீகாள் தாவீதை ஜன்னல் வழியாகக் கீழே இறக்கிவிட்டாள். அவன் சென்று, ஓடிப்போய், தப்பினான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֹּרֶד
  choice: கீழே இறக்கிவிட்டாள்
  rationale: இபிரேய வினைச்சொல்லின் causative பொருளான ‘கீழிறங்கச் செய்தாள்’ என்பதை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: בְּעַד הַחַלּוֹן
  choice: ஜன்னல் வழியாக
  rationale: ‘ஜன்னலின் வழியே’ என்ற இடவியல் பொருளைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: וַיֵּלֶךְ
  choice: அங்கிருந்து சென்று
  rationale: ‘அவன் சென்றான்’ என்ற மூலத்தின் தனி செயலைப் பேணுகிறது; தமிழில் சூழலுக்கேற்ற இயல்புக்காக ‘அங்கிருந்து’ சேர்க்கப்பட்டுள்ளது.
- source_word: וַיִּבְרַח
  choice: தப்பியோடி
  rationale: ברח என்பதன் ‘ஓடித் தப்புதல்’ என்ற கருத்தைச் சுருக்கமாகத் தருகிறது.
- source_word: וַיִּמָּלֵט
  choice: உயிர் தப்பினான்
  rationale: முந்தைய ‘தப்பியோடி’ என்பதிலிருந்து வேறுபடுத்தி, இறுதியில் ஆபத்திலிருந்து பாதுகாப்பாகத் தப்பியதை இயல்பான தமிழில் காட்டுகிறது.
