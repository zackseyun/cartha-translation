source:
  edition: WLC
  text: וַ/יָּשֶׂם֩ אֶת נַפְשׁ֨/וֹ בְ/כַפּ֜/וֹ וַ/יַּ֣ךְ אֶת הַ/פְּלִשְׁתִּ֗י וַ/יַּ֨עַשׂ יְהוָ֜ה תְּשׁוּעָ֤ה גְדוֹלָה֙ לְ/כָל יִשְׂרָאֵ֔ל רָאִ֖יתָ וַ/תִּשְׂמָ֑ח וְ/לָ֤/מָּה תֶֽחֱטָא֙ בְּ/דָ֣ם נָקִ֔י לְ/הָמִ֥ית אֶת דָּוִ֖ד חִנָּֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/019/005.yaml
  text: For he put his life in his hand and struck down the Philistine[a], and Yahweh brought about a great salvation for all Israel. You saw it and rejoiced[c][b]. So why should you sin against innocent blood by putting David to death for no reason?
translation:
  language: ta
  text: ஏனெனில், அவன் தன் உயிரைப் பணயம் வைத்து[a] அந்தப் பெலிஸ்தியனை வீழ்த்தினான். யாவே இஸ்ரவேல் முழுவதற்கும் பெரும் மீட்பை[b] ஏற்படுத்தினார். அதை நீர் கண்டு மகிழ்ந்தீர். அப்படியிருக்க, எந்தக் காரணமும் இல்லாமல் தாவீதைக் கொன்று, குற்றமற்ற இரத்தத்தைச் சிந்தி, நீர் ஏன் பாவம் செய்ய வேண்டும்?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லுக்குச் சொல், “தன் உயிரைக் கையில் வைத்து.”
    reason: lexical_alternative
  - marker: b
    text: “பெரும் மீட்பு” என்பதை “பெரும் வெற்றி” அல்லது “பெரும் விடுதலை” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֶׂם אֶת־נַפְשׁוֹ בְכַפּוֹ
  choice: தன் உயிரைக் கையில் வைத்துக்கொண்டு
  rationale: எபிரேயச் சொல்லோவியத்தை இயல்பான தமிழில் தக்கவைத்து, உயிருக்கு ஆபத்தை ஏற்ற பொருளையும் வெளிப்படுத்துகிறது.
- source_word: נַפְשׁוֹ
  choice: தன் உயிரை
  rationale: இங்கு נֶפֶשׁ என்பது உடலிலிருந்து தனியான ஆன்மாவைக் குறிக்காமல், போரில் ஆபத்துக்குள்ளாக்கப்பட்ட உயிரைக் குறிக்கிறது.
- source_word: וַיַּךְ אֶת־הַפְּלִשְׁתִּי
  choice: அந்தப் பெலிஸ்தியனை வீழ்த்தினான்
  rationale: சூழலில் தாவீது கோலியாத்தைத் தாக்கிக் கொன்றதைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: וַיַּעַשׂ יְהוָה
  choice: யாவே ... ஏற்படுத்தினார்
  rationale: עשה என்ற வினை இங்கு மீட்பை நிகழச் செய்த இறைச் செயலாற்றலைக் குறிக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், எபிரேய நான்கெழுத்துப் பெயரின் தமிழ் ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: תְּשׁוּעָה גְדוֹלָה
  choice: பெரும் மீட்பு
  rationale: இராணுவ வெற்றியை உள்ளடக்கியிருந்தாலும், תְּשׁוּעָה என்பதன் விரிவான விடுவிப்பு மற்றும் இரட்சிப்பு நுண்ணுணர்வைத் தக்கவைக்கிறது.
- source_word: לְכָל־יִשְׂרָאֵל
  choice: இஸ்ரவேல் முழுவதற்கும்
  rationale: לְ என்பதன் நன்மைபெறும் பொருளை இயல்பான தமிழில் காட்டுகிறது.
- source_word: רָאִיתָ וַתִּשְׂמָח
  choice: அதை நீர் கண்டு மகிழ்ந்தீர்
  rationale: சவுலை நோக்கிய நேரடி ஒருமை உரையை மரியாதை ஒருமையுடன் வழங்குகிறது; ‘அதை’ என்பது சூழலிலிருந்து பெறப்பட்ட தெளிவாக்கம்.
- source_word: וְלָמָּה תֶחֱטָא
  choice: அப்படியிருக்க ... நீர் ஏன் பாவம் செய்ய வேண்டும்?
  rationale: முந்தைய மகிழ்ச்சிக்கும் இப்போது திட்டமிடப்படும் கொலைக்கும் இடையிலான முரண்பாட்டை இயல்பான தமிழ் வினாவாக வெளிப்படுத்துகிறது.
- source_word: בְּדָם נָקִי
  choice: குற்றமற்ற இரத்தத்திற்கு எதிராக
  rationale: இரத்தப்பழி சார்ந்த எபிரேயச் சட்ட மற்றும் ஒழுக்கச் சொல்லாட்சியைத் தக்கவைக்கிறது.
- source_word: לְהָמִית אֶת־דָּוִד חִנָּם
  choice: காரணமின்றி தாவீதைக் கொன்று
  rationale: தாவீதைக் கொல்வதே குற்றமற்ற இரத்தத்திற்கு எதிரான பாவத்தின் வழி என்பதைத் தமிழில் தெளிவாக இணைக்கிறது; חִנָּם என்பதற்கு ‘காரணமின்றி’ பொருத்தமானது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் தனிப்பட்ட உடன்படிக்கைப் பெயர் நேரடியாக வருவதால், பட்டப்பெயராக மாற்றாமல் ஒலிபெயர்க்கப்பட்டுள்ளது.
- issue: இராணுவச் சூழலில் תְּשׁוּעָה என்பதன் பொருள்
  choice: மீட்பு
  alternative: வெற்றி / விடுதலை
  rationale: உடனடி போர்வெற்றியையும் கடவுள் அளித்த விரிவான விடுவிப்பையும் ஒருங்கே உணர்த்த ‘மீட்பு’ தேர்ந்தெடுக்கப்பட்டுள்ளது.
- issue: בְּדָם נָקִי என்பதிலுள்ள இரத்தப்பழி மொழி
  choice: குற்றமற்ற இரத்தத்திற்கு எதிராகப் பாவம் செய்தல்
  alternative: குற்றமற்ற இரத்தத்தைச் சிந்திப் பாவம் செய்தல்
  rationale: மூலத்தின் சொற்படிமத்தையும் சட்ட-ஒழுக்கத் தொனியையும் தக்கவைக்கிறது; கொல்வது அடுத்த சொற்றொடரில் தெளிவாகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், மரியாதை ஒருமையான ‘நீர்’ வடிவம் பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் சொல்லோவியம், சட்ட-ஒழுக்கத் தொனி, தெய்வீகச் செயலாற்றல் ஆகியவை இயல்பான வாசிப்புடன் சமநிலைப்படுத்தப்பட்டுள்ளன.
