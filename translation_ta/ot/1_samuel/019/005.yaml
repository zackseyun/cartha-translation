- from: ஏனெனில், அவன் தன் உயிரைக் கையில் வைத்துக்கொண்டு[a] அந்தப் பெலிஸ்தியனை வீழ்த்தினான். யாவே இஸ்ரவேல் முழுவதற்கும் பெரும் மீட்பை[b] ஏற்படுத்தினார். அதை நீர் கண்டு மகிழ்ந்தீர். அப்படியிருக்க, காரணமின்றி தாவீதைக் கொன்று, குற்றமற்ற இரத்தத்திற்கு எதிராக நீர் ஏன் பாவம் செய்ய வேண்டும்?
