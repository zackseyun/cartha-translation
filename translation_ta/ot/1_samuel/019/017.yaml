base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/019/017.yaml
  text: Then Saul said to Michal[a], “Why have you deceived me like this and sent away my enemy, so that he escaped?” And Michal said to Saul, “He said to me, ‘Let me go. Why should I kill you?’”
translation:
  language: ta
  text: 'அப்போது சவுல் மீகாளிடம், “நீ ஏன் இப்படி என்னை ஏமாற்றி, என் பகைவனை அனுப்பிவிட்டு, அவன் தப்பித்துக்கொள்ளும்படி செய்தாய்?” என்றான். அதற்கு மீகாள் சவுலிடம், “அவன் என்னிடம், ‘என்னை அனுப்பிவிடு. நான் ஏன் உன்னைக் கொல்ல வேண்டும்?’[a] என்றான்” என்று சொன்னாள்.


    [a] இதைச் சற்று விளக்கமாக, “என்னைப் போகவிடு; இல்லையென்றால் உன்னைக் கொன்றுவிடுவேன்” என்றும் மொழிபெயர்க்கலாம். எபிரெய மூலத்தில் சொல்லுக்குச் சொல், “என்னை அனுப்பிவிடு. நான் ஏன் உன்னைக் கொல்ல வேண்டும்?” என்று உள்ளது.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இதைச் சற்று விளக்கமாக, “என்னைப் போகவிடு; இல்லையென்றால் உன்னைக் கொன்றுவிடுவேன்” என்றும் மொழிபெயர்க்கலாம். எபிரெய மூலத்தில் சொல்லுக்குச் சொல், “என்னை அனுப்பிவிடு. நான் ஏன் உன்னைக் கொல்ல வேண்டும்?” என்று உள்ளது.
    reason: alternative_reading
lexical_decisions:
- source_word: רִמִּיתִנִי
  choice: என்னை ஏமாற்றி
  rationale: இந்த வினை இங்கு வஞ்சனையால் தவறாக நம்பச் செய்வதைக் குறிக்கிறது. ‘ஏமாற்றி’ என்பது சவுலின் குற்றச்சாட்டை இயல்பாகத் தெரிவிக்கிறது; ‘துரோகம் செய்து’ என்று மொழிபெயர்த்து பொருளை மிகைப்படுத்தவில்லை.
- source_word: כָּכָה
  choice: இப்படி
  rationale: செயலின் முறையைச் சுட்டும் சொல்லாக இருப்பதால், நவீன தமிழில் இயல்பான ‘இப்படி’ பயன்படுத்தப்பட்டது.
- source_word: וַתְּשַׁלְּחִי
  choice: அனுப்பிவிட்டாய்
  rationale: שלח என்பதன் அடிப்படைப் பொருளான ‘அனுப்பு/அனுப்பிவிடு’ பாதுகாக்கப்பட்டது. மீகாள் தாவீது வெளியேற உதவிய நிகழ்வையும் இது தெளிவாகக் காட்டுகிறது.
- source_word: אֹיְבִי
  choice: என் பகைவனை
  rationale: சவுல் தாவீதைத் தன் பகைவன் என்று அழைக்கும் பகைமையையும் கதையிலுள்ள முரண்பாட்டையும் நேரடியாகப் பாதுகாக்கிறது.
- source_word: וַיִּמָּלֵט
  choice: அவனும் தப்பித்துக்கொண்டானே
  rationale: Niphal வடிவம் ‘தப்பித்துக்கொள்’ என்ற பொருளைத் தருகிறது. தமிழில் சவுலின் குற்றஞ்சாட்டும் தொனியை இயல்பாக வெளிப்படுத்த ‘-ஆனே’ பயன்படுத்தப்பட்டது; எபிரெயத்தின் தொடர்ச்சியான விளைவும் பாதுகாக்கப்படுகிறது.
- source_word: שַׁלְּחִנִי
  choice: என்னை அனுப்பிவிடு
  rationale: முன்னர் வந்த அதே שלח வேருடன் சொல் ஒற்றுமையைப் பாதுகாக்கிறது. ‘என்னைப் போகவிடு’ என்பது இயல்பான மாற்றாக இருந்தாலும், மூலத்தின் மீளுரைப்பை முன்னிறுத்த ‘அனுப்பிவிடு’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: לָמָה אֲמִיתֵךְ
  choice: நான் ஏன் உன்னைக் கொல்ல வேண்டும்?
  rationale: எபிரெய உரையின் நேரடியான கேள்வி வடிவம் பாதுகாக்கப்பட்டது. மறைமுக அச்சுறுத்தல் இருக்கக்கூடும்; ஆனால் மூலத்தில் இல்லாத ‘இல்லையென்றால்’ என்பதை முதன்மை உரையில் சேர்க்கவில்லை.
- source_word: מִיכַל
  choice: மீகாள்
  rationale: தமிழ் வேதாகமப் பெயர்வழக்கிற்கு ஏற்ற ஒலிபெயர்ப்பு.
- source_word: שָׁאוּל
  choice: சவுல்
  rationale: தமிழ் வேதாகமப் பெயர்வழக்கிற்கு ஏற்ற ஒலிபெயர்ப்பு.
theological_decisions:
- issue: மீகாள் தாவீதுக்குச் சாட்டிக் கூறும் பேச்சின் பொருள்
  choice: ‘என்னை அனுப்பிவிடு. நான் ஏன் உன்னைக் கொல்ல வேண்டும்?’ என்ற எபிரெய கேள்வி வடிவத்தை முதன்மை உரையில் பாதுகாத்தல்
  alternative: ‘என்னைப் போகவிடு; இல்லையென்றால் உன்னைக் கொன்றுவிடுவேன்’ என்று வெளிப்படையான அச்சுறுத்தலாக மொழிபெயர்த்தல்
  rationale: மூலத்தில் கட்டளைத் தொடரை அடுத்து למה + முதலாம் நபர் வினை கொண்ட கேள்வி வருகிறது; ‘இல்லையென்றால்’ என்ற இணைப்பு வெளிப்படையாக இல்லை. ஆகவே சாத்தியமான அச்சுறுத்தல் அடிக்குறிப்பில் தெரிவிக்கப்பட்டு, மூலத்தின் உண்மையான தெளிவின்மை முதன்மை உரையில் பாதுகாக்கப்பட்டது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. சவுலின் குற்றஞ்சாட்டும் நேரடிப் பேச்சும், மீகாளின் பதிலிலுள்ள சாத்தியமான அச்சுறுத்தலின் தெளிவின்மையும் பாதுகாக்கப்பட்டுள்ளன.
