translation_notes:
  register: நவீன தரத் தமிழில், எளிதில் புரியும் அதேவேளையில் கண்ணியமான வரலாற்றுக் கதையாடல் நடை பயன்படுத்தப்பட்டுள்ளது. இறுதி வாக்கியத்தில் வரும் இரு ஆண்பால் சுட்டுப்பெயர்களின் குழப்பத்தைத் தவிர்க்க ‘தாவீது’, ‘சவுலின்’ என்று பெயர்கள் மீண்டும் குறிப்பிடப்பட்டன. அடிக்குறிப்பு குறி அது விளக்கும் ‘முன்புபோலவே’ என்ற தொடருடன் தொடர்புடைய வாக்கியத்தின் முடிவில் வைக்கப்பட்டுள்ளது.
