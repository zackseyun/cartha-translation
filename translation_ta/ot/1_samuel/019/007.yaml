base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/019/007.yaml
  text: So Jonathan called David and told him all these things. Then Jonathan brought David to Saul[a], and he was in his presence as before.
translation:
  language: ta
  text: யோனத்தான் தாவீதை அழைத்து, இந்த எல்லா விஷயங்களையும் அவரிடம் தெரிவித்தான். பின்பு யோனத்தான் தாவீதை சவுலிடம் அழைத்து வந்தான்; தாவீது முன்புபோலவே சவுலின் முன்னிலையில் இருந்தான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மூலத்தில் சொல்லுக்குச் சொல், “நேற்றும் முந்தின நாளும் இருந்ததுபோல”; இது “முன்புபோல” அல்லது “முன்னர் இருந்ததுபோல” என்று பொருள்படும் ஒரு மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא ... לְדָוִד
  choice: தாவீதை அழைத்து
  rationale: קרא + לְ என்பது ஒருவரை அழைப்பதையோ வரவழைப்பதையோ குறிக்கலாம். சூழல் முறைப்படியான அழைப்பா தனிப்பட்ட அழைப்பா என்பதைத் தெளிவுபடுத்தாததால், இயல்பான பொதுச் சொல்லான ‘அழைத்து’ பயன்படுத்தப்பட்டது.
- source_word: וַיַּגֵּד לוֹ
  choice: அவரிடம் தெரிவித்தான்
  rationale: Hiphil வடிவிலுள்ள נגד என்பது ‘தெரிவித்தல்/அறிவித்தல்’ என்று பொருள். யோனத்தான் சவுலோடு நடந்த உரையாடலை தாவீதுக்குத் தெரியப்படுத்தும் இச்சூழலுக்கு ‘தெரிவித்தான்’ பொருந்துகிறது.
- source_word: כָּל הַדְּבָרִים הָאֵלֶּה
  choice: இந்த எல்லா விஷயங்களையும்
  rationale: דבר என்பதற்கு ‘வார்த்தை’, ‘காரியம்’, ‘விஷயம்’ ஆகிய பொருள்கள் உண்டு. இங்கு பேசப்பட்டதும் நிகழ்ந்ததுமான முழு உள்ளடக்கத்தைக் குறிக்க ‘விஷயங்கள்’ இயல்பாக உள்ளது.
- source_word: וַיָּבֵא ... אֶל
  choice: அழைத்து வந்தான்
  rationale: Hiphil வடிவிலுள்ள בוא என்பதன் காரணவினைப் பொருள் ‘கொண்டுவருதல்’. தமிழில் ஒருவரை இன்னொருவரிடம் கொண்டுசென்று சேர்ப்பதை ‘அழைத்து வந்தான்’ இயல்பாக வெளிப்படுத்துகிறது; பயண முறையை இது மேலதிகமாக நிர்ணயிப்பதில்லை.
- source_word: וַיְהִי לְפָנָיו
  choice: சவுலின் முன்னிலையில் இருந்தான்
  rationale: ‘ஒருவரின் முகத்துக்கு முன் இருத்தல்’ என்ற எபிரெய மரபுத்தொடர் அவருடைய முன்னிலையையோ பணிச்சூழலையோ குறிக்கலாம். ‘முன்னிலையில் இருந்தான்’ என்பது நேரடிப் பொருளைப் பாதுகாத்து, குறிப்பிட்ட அரண்மனைப் பதவியைத் திணிக்காமல் விடுகிறது.
- source_word: כְּאֶתְמוֹל שִׁלְשׁוֹם
  choice: முன்புபோலவே
  rationale: சொல்லுக்குச் சொல் ‘நேற்றும் முந்தின நாளும் இருந்ததுபோல’ எனும் இந்த எபிரெய மரபுத்தொடர், ‘முன்பு இருந்ததுபோல’ என்ற பொருளில் வருகிறது. ‘முன்புபோலவே’ என்பது அதன் இயல்பான தமிழாக்கம்.
