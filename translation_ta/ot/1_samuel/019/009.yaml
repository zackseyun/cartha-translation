  text: וַ/תְּהִי֩ ר֨וּחַ יְהוָ֤ה רָעָה֙ אֶל שָׁא֔וּל וְ/הוּא֙ בְּ/בֵית֣/וֹ יוֹשֵׁ֔ב וַ/חֲנִית֖/וֹ בְּ/יָד֑/וֹ וְ/דָוִ֖ד מְנַגֵּ֥ן בְּ/יָֽד׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/019/009.yaml
  text: And an evil spirit from Yahweh came upon Saul while he was sitting in his house with his spear in his hand[b][a], and David was playing the lyre with his hand.
translation:
  language: ta
  text: அப்போது யாவேயிடமிருந்து ஒரு தீய[a] ஆவி சவுல்மேல் வந்தது. சவுல் தன் வீட்டில் கையில் ஈட்டியுடன் அமர்ந்திருந்தான்; தாவீது கையால் இசை வாசித்துக்கொண்டிருந்தான்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யாவேயிடமிருந்து தீங்கு விளைவிக்கும் ஓர் ஆவி.” எபிரெயப் பெயரடை “தீய” அல்லது “தீங்கு விளைவிக்கும், துன்புறுத்தும்” என்று பொருள்படலாம்.
    reason: lexical_alternative
  - marker: b
    text: சொற்படியாக, “கையால்.” இந்த வசனத்தில் இசைக்கருவியின் பெயர் குறிப்பிடப்படவில்லை; ஆனால் சுற்றியுள்ள நிகழ்ச்சிச் சூழல் தாவீது சவுலுக்காக இசைக்கருவி வாசித்ததைக் காட்டுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתְּהִי
  choice: வந்தது
  rationale: רוּחַ என்பதே எழுவாயாகவும் אֶל שָׁאוּל என்பது சவுலை நோக்கிய வருகையைக் குறிப்பதாகவும் இருப்பதால், நிகழ்வின் தொடக்கத்தை இயல்பான தமிழில் ‘வந்தது’ என வழங்குகிறது.
- source_word: רוּחַ יְהוָה רָעָה
  choice: யாவேயிடமிருந்து ஒரு தீய ஆவி
  rationale: רוּחַ என்பதை ‘ஆவி’ என்றும் רָעָה என்பதை அதன் நேரடியான பொருளான ‘தீய’ என்றும் மொழிபெயர்க்கிறது. எபிரெய உறவை ‘யாவேயிடமிருந்து’ என வழங்குவது, அந்த ஆவி யாவேயிடமிருந்து வந்ததைக் காட்டுகிறது; யாவே தாமே தீயவர் என்று பொருள்படுவதைத் தவிர்க்கிறது.
- source_word: אֶל שָׁאוּל
  choice: சவுல்மேல்
  rationale: துன்புறுத்தும் ஆவி சவுலை வந்தடைந்ததைத் தமிழில் இயல்பாகக் காட்ட ‘சவுல்மேல்’ பயன்படுத்தப்படுகிறது.
- source_word: בְּבֵיתוֹ יוֹשֵׁב
  choice: தன் வீட்டில் ... அமர்ந்திருந்தான்
  rationale: יֹשֵׁב என்ற நிகழ்காலப் பங்கேற்பு வடிவம் தொடர்ந்த பின்னணி நிலையைக் காட்டுவதால் ‘அமர்ந்திருந்தான்’ பொருத்தமானது.
- source_word: וַחֲנִיתוֹ בְּיָדוֹ
  choice: கையில் ஈட்டியுடன்
  rationale: வினையில்லாத இந்த எபிரெயச் சொற்றொடர் சவுலின் அப்போதைய நிலையைக் கூறுகிறது; தமிழில் ‘கையில் ஈட்டியுடன்’ என்பது சுருக்கமாகவும் இயல்பாகவும் உள்ளது.
- source_word: מְנַגֵּן
  choice: இசைத்துக்கொண்டிருந்தான்
  rationale: פיעל பங்கேற்பு வடிவமான இது ஓர் இசைக்கருவியை வாசித்துக்கொண்டிருப்பதைக் குறிக்கிறது. இந்த வசனத்தில் கருவியின் பெயர் இல்லாததால் ‘இசைத்துக்கொண்டிருந்தான்’ என வழங்கப்படுகிறது.
- source_word: בְּיָד
  choice: தன் கையால்
  rationale: எபிரெய மூலத்தில் சொற்படியாக ‘கையால்’ என்றே உள்ளது. ஒருமையையும் மூலத்தின் வெளிப்பாட்டையும் காக்க ‘தன் கையால்’ என மொழிபெயர்க்கப்படுகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரை வழங்குதல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் நான்கு எழுத்துகளைக் கொண்ட இறைப் பெயர் நேரடியாக உள்ளது. அதை ஒரு பட்டமாக மாற்றாமல், தமிழில் பரவலாக அறியப்படும் ஒலிபெயர்ப்பான ‘யாவே’ என வழங்குகிறது.
- issue: רוּחַ יְהוָה רָעָה என்பதில் ஆவிக்கும் யாவேக்கும் உள்ள உறவு
  choice: யாவேயிடமிருந்து ஒரு தீய ஆவி
  alternative: யாவேயின் தீய ஆவி
  rationale: எபிரெயத் தொடரின் உறவை மூலத்திற்கிணங்க வைத்தபடியே, தீமை யாவேயின் பண்பு எனத் தவறாகப் புரிந்துகொள்ளாமல் அந்த ஆவி அவரிடமிருந்து வந்தது என்ற கருத்தைத் தெளிவாக்குகிறது. ‘தீய’ மற்றும் ‘தீங்கு விளைவிக்கும்’ ஆகிய சாத்தியங்களை அடிக்குறிப்பு பாதுகாக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘தீய ஆவி’ என்ற மூலத்தின் கூர்மையான சொல்லாட்சி முதன்மை உரையில் காக்கப்பட்டு, அதன் ‘தீங்கு விளைவிக்கும்/துன்புறுத்தும்’ பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது. மூலத்தில் குறிப்பிடப்படாத யாழ் போன்ற குறிப்பிட்ட இசைக்கருவி முதன்மை உரையில் சேர்க்கப்படவில்லை.
