  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. யோனத்தான் அரசரை மூன்றாம் நபரில் மரியாதையுடன் அழைக்கும் அரண்மனைத் தொனி ‘அரசர்’ மற்றும் ‘தம்’ என்பவற்றால் காக்கப்பட்டுள்ளது; சவுலை நோக்கிய இரண்டாம் நபர் வடிவமாக ‘உமக்கு’ பயன்படுத்தப்பட்டுள்ளது.
