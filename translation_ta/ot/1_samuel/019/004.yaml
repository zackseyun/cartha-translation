  text: וַ/יְדַבֵּ֨ר יְהוֹנָתָ֤ן בְּ/דָוִד֙ ט֔וֹב אֶל שָׁא֖וּל אָבִ֑י/ו וַ/יֹּ֣אמֶר אֵ֠לָי/ו אַל יֶחֱטָ֨א הַ/מֶּ֜לֶךְ בְּ/עַבְדּ֣/וֹ בְ/דָוִ֗ד כִּ֣י ל֤וֹא חָטָא֙ לָ֔/ךְ וְ/כִ֥י מַעֲשָׂ֖י/ו טוֹב לְ/ךָ֥ מְאֹֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/019/004.yaml
  text: Jonathan spoke well of David to Saul his father[a], and said to him, “Let not the king sin against his servant David, because he has not sinned against you[b], and because his deeds have been very good for you.”
translation:
  language: ta
  text: யோனத்தான் தன் தந்தையாகிய சவுலிடம் தாவீதுக்கு ஆதரவாகப் பேசி[a], அவரிடம், “அரசர் தம் பணியாளனாகிய தாவீதுக்கு எதிராகப் பாவம் செய்ய வேண்டாம்; ஏனெனில் அவன் உமக்கு எதிராகப் பாவம் செய்யவில்லை; மேலும், அவனுடைய செயல்கள் உமக்கு மிகவும் நன்மையாக இருந்தன” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தாவீதைக் குறித்துச் சாதகமாகப் பேசினான்.” எபிரெயச் சொற்றொடர் சொற்சொல்லாக, “தாவீதைக் குறித்து நல்லதைப் பேசினான்” என்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר ... טוֹב בְּדָוִד
  choice: தாவீதுக்கு ஆதரவாகப் பேசி
  rationale: ‘தாவீதைக் குறித்து நல்லவிதமாகப் பேசினான்’ என்ற எபிரெயச் சொற்றொடரின் கருத்து, தாவீதுக்குச் சாதகமாகப் பரிந்துபேசுவதாகும். நவீனத் தமிழில் ‘ஆதரவாகப் பேசி’ என்பது சூழலுக்கேற்ற இயல்பான வடிவம்.
- source_word: אֶל שָׁאוּל אָבִיו
  choice: தன் தந்தையாகிய சவுலிடம்
  rationale: எபிரெய மூலத்தின் உறவுமுறையையும் பெயரையும் தெளிவாகவும் இயல்பான தமிழ் சொல்வரிசையிலும் தருகிறது.
- source_word: אַל יֶחֱטָא הַמֶּלֶךְ
  choice: அரசர் ... பாவம் செய்ய வேண்டாம்
  rationale: אַל உடன் வரும் யுஸ்ஸிவ் தடைப்பொருளைத் தருகிறது. நேரடியாகத் தந்தையிடம் பேசினாலும் ‘அரசர்’ என்ற மூன்றாம் நபர் மரியாதை வடிவத்தைத் தமிழ் வாக்கியம் காக்கிறது.
- source_word: בְּעַבְדּוֹ בְדָוִד
  choice: தம் பணியாளனாகிய தாவீதுக்கு எதிராக
  rationale: இரு בְּ தொடர்களில் இரண்டாவது, ‘தம் பணியாளன்’ யார் என்பதைத் தாவீது என விளக்குகிறது. தமிழில் இயல்புக்காக ஒரே ‘எதிராக’ பயன்படுத்தப்பட்டாலும், அடிக்குறிப்பில் மூலத்தின் மீளுரைத்தல் குறிப்பிடப்படுகிறது.
- source_word: כִּי לֹא חָטָא לָךְ
  choice: ஏனெனில் அவன் உமக்கு எதிராகப் பாவம் செய்யவில்லை
  rationale: முந்தைய ‘பாவம் செய்ய’ என்ற வேர்ச்சொல்லையே மீண்டும் பயன்படுத்தி, சவுலின் சாத்தியமான பாவத்திற்கும் தாவீதின் குற்றமின்மைக்கும் இடையிலான சொல்லாட்சிசார் எதிர்மறையைப் பாதுகாக்கிறது.
- source_word: מַעֲשָׂיו טוֹב לְךָ מְאֹד
  choice: அவனுடைய செயல்கள் உமக்கு மிகவும் நன்மையாக இருந்திருக்கின்றன
  rationale: தாவீதின் செயல்கள் சவுலுக்குப் பெரிதும் பயனளித்தன என்ற பொருளை, எபிரெயின் ‘மிகவும் நல்லவை’ என்ற மதிப்பீட்டிற்கு அருகாகவும் இயல்பான தமிழிலும் தருகிறது.
