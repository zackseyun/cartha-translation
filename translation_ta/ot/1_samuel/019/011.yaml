base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/019/011.yaml
  text: Then Saul sent messengers to David’s house to watch him and to kill him in the morning. And Michal his wife told David[a], saying, “If you do not save your life tonight, tomorrow you will be put to death.”
translation:
  language: ta
  text: அப்போது சவுல் தாவீதைக் கண்காணித்து, காலையில் அவனைக் கொல்லுவதற்காக தாவீதின் வீட்டுக்குத் தூதர்களை அனுப்பினான். தாவீதின் மனைவி மீகாள் அவனிடம், “இன்றிரவே நீ உன் உயிரைக் காப்பாற்றிக்கொள்ளாவிட்டால்[a], நாளை நீ கொல்லப்படுவாய்” என்று சொன்னாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இன்றிரவே நீ உயிரோடு தப்பாவிட்டால்.”
    reason: מְמַלֵּט אֶת־נַפְשְׁךָ என்ற மரபுத்தொடரை ‘உன் உயிரைக் காப்பாற்றிக்கொள்’ என்றும் ‘உயிரோடு தப்பு’ என்றும் இயல்பாகப் புரிந்துகொள்ளலாம்.
lexical_decisions:
- source_word: מַלְאָכִים
  choice: தூதர்கள்
  rationale: இங்கு சவுலால் அனுப்பப்பட்ட மனிதத் தூதர்களைக் குறிக்கிறது; வானதூதர்களை அல்ல.
- source_word: לְשָׁמְרוֹ
  choice: அவனைக் கண்காணித்து
  rationale: தாவீதின் வீட்டுக்கு வெளியே பகை நோக்குடன் கவனித்திருப்பதை இயல்பாகத் தெரிவிக்கிறது; பாதுகாப்பதைக் குறிக்கும் சொல்லைத் தவிர்க்கிறது.
- source_word: וְלַהֲמִיתוֹ
  choice: அவனைக் கொன்றுபோடுவதற்காக
  rationale: מות என்பதன் ஹிஃபில் வடிவிலுள்ள ‘சாகச் செய்தல்’ என்ற நேரடியான கொலை நோக்கைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: בַּבֹּקֶר
  choice: காலையில்
  rationale: கொலை செய்யத் திட்டமிடப்பட்ட நேரத்தை இயல்பான நவீன தமிழில் குறிக்கிறது.
- source_word: וַתַּגֵּד
  choice: சொன்னாள்
  rationale: மீகாள் தாவீதுக்கு அறிவித்த எச்சரிக்கையை எளிய, இயல்பான கதைநடையில் தருகிறது.
- source_word: מִיכַל אִשְׁתּוֹ
  choice: தாவீதின் மனைவி மீகாள்
  rationale: எபிரெயச் சொல்லிணைப்பின் தகவலைத் தெளிவாகவும் தமிழில் இயல்பாகவும் வழங்குகிறது.
- source_word: מְמַלֵּט אֶת־נַפְשְׁךָ
  choice: நீ உன் உயிரைக் காப்பாற்றிக்கொள்ளாவிட்டால்
  rationale: ‘உன் உயிரை/உன்னைத் தப்புவித்தல்’ என்ற எபிரெய மரபுத்தொடரின் முதன்மைப் பொருளை இயல்பான தமிழில் தருகிறது; ‘உயிரோடு தப்பாவிட்டால்’ என்ற மாற்றுப் பொருள் அடிக்குறிப்பில் வைக்கப்படுகிறது.
- source_word: הַלַּיְלָה
  choice: இன்றிரவே
  rationale: நடப்பு இரவையும் அவசரத்தையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: מוּמָת
  choice: நீ கொல்லப்படுவாய்
  rationale: சவுலின் ஆட்களால் நிகழவிருக்கும் மரணத்தைச் சுட்டும் செயப்பாட்டு நிலையைப் பாதுகாக்கிறது.
