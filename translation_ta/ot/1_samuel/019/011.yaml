  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் dignified கதைநடை பயன்படுத்தப்பட்டுள்ளது. தொடக்க வாவ் தொடர்ச்சி ‘அப்போது’ எனவும், மீகாளின் செயலை இணைக்கும் வாவ் தனியே முரண்பாடாக மாற்றப்படாமலும் தரப்பட்டுள்ளது. ‘கொல்லப்படுவாய்’ என்பது மூலத்தின் செயப்பாட்டு நிலையைப் பாதுகாக்கிறது.
