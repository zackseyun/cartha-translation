lexical_decisions:
- source_word: וַיֻּגַּד
  choice: தெரிவிக்கப்பட்டது
  rationale: நிகழ்த்துபவரைக் குறிப்பிடாத எபிரெயச் செயலப்பாட்டு வடிவத்தை இயல்பான நவீன தமிழில் தக்கவைக்கிறது.
- source_word: לְשָׁאוּל
  choice: சவுலுக்கு
  rationale: மறைமுகச் செயப்படுபொருளைக் குறிக்கும் לְ முன்னிடைச்சொல்லின் இயல்பான தமிழ் வடிவம்.
- source_word: לֵאמֹר
  choice: என்று
  rationale: அறிவிக்கப்பட்ட செய்தியின் உள்ளடக்கத்தை அறிமுகப்படுத்தும் எபிரெய மேற்கோள் அமைப்பை இயல்பான தமிழில் தருகிறது.
- source_word: הִנֵּה
  choice: இதோ
  rationale: செய்தியின்மீது கவனத்தை ஈர்க்கும் சொல்லின் உடனடித் தன்மையை dignified, current Tamil usage preserves.
- source_word: דָוִד
  choice: தாவீது
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் நிலைபெற்ற பெயர்வடிவம்.
- source_word: בְּנוָיֹת
  choice: நாயோத்தில்
  rationale: இடப்பெயருடன் வரும் בְ என்பதன் இடப்பொருளை தமிழ் வேற்றுமை உருபால் இயல்பாகக் குறிக்கிறது.
- source_word: בָּרָמָה
  choice: ராமாவிலுள்ள
  rationale: நாயோத் ராமாவின் எல்லைக்குள் அல்லது அதனுடன் தொடர்புடைய இடம் என்பதைத் தெளிவாகவும் சுருக்கமாகவும் காட்டுகிறது.
