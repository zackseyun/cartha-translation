  text: וְ/הַ֨/דָּבָ֔ר אֲשֶׁ֥ר דִּבַּ֖רְנוּ אֲנִ֣י וָ/אָ֑תָּה הִנֵּ֧ה יְהוָ֛ה בֵּינִ֥/י וּ/בֵינְ/ךָ֖ עַד עוֹלָֽם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/023.yaml
  text: And as for the matter that you and I have spoken of[a], behold, Yahweh is between me and you forever.
translation:
  language: ta
  text: மேலும், நானும் நீயும் பேசிய அந்தக் காரியத்தைப் பொறுத்தவரை[a], இதோ, யாவே என்றென்றும் எனக்கும் உனக்கும் நடுவில் இருக்கிறார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நானும் நீயும் பேசிய அந்தச் சொல்லைப் பொறுத்தவரை.” எபிரெய דָּבָר என்பதற்கு “சொல்,” “காரியம்,” அல்லது “விஷயம்” என்று பொருள் வரலாம்; இங்கு அது முன்பு பேசப்பட்ட உடன்பாட்டைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַדָּבָר
  choice: அந்தக் காரியத்தைப் பொறுத்தவரை
  rationale: דָּבָר என்பது ‘சொல்,’ ‘காரியம்,’ அல்லது ‘விஷயம்’ என்று பொருள்படலாம். இங்கு யோனத்தானும் தாவீதும் பேசி ஒப்புக்கொண்ட ஏற்பாட்டைக் குறிப்பதால், ‘காரியம்’ இயல்பாகவும் தெளிவாகவும் உள்ளது; וְ தொடர்ச்சியையும் தலைப்புமாற்றத்தையும் ‘பொறுத்தவரை’ வெளிப்படுத்துகிறது.
- source_word: אֲשֶׁר דִּבַּרְנוּ אֲנִי וָאָתָּה
  choice: நானும் நீயும் பேசிக்கொண்ட
  rationale: எபிரெய வரிசையையும் பரஸ்பரத் தன்மையையும் காக்கிறது. ‘பேசிக்கொண்ட’ என்பது முன்பு இருவரும் விவாதித்த உடன்பாட்டைக் குறிக்கிறது.
- source_word: הִנֵּה
  choice: இதோ
  rationale: הִנֵּה செலுத்தும் கவனத்தையும் உரையின் ஆழ்ந்த உறுதிப்பாட்டையும் நவீனத் தமிழில் இயல்பாகத் தருகிறது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: இறைத் திருப்பெயரை ஒரு பட்டப்பெயரால் மாற்றாமல், தமிழில் பரவலாக அறியப்படும் பெயர்வடிவத்தில் வழங்குகிறது.
- source_word: בֵּינִי וּבֵינְךָ
  choice: எனக்கும் உனக்கும் நடுவில்
  rationale: மூலத்தின் நபர் வரிசையையும் ‘இடையில்/நடுவில்’ என்ற திறந்த உருவகத்தையும் காக்கிறது; சாட்சி அல்லது உத்தரவாதம் என்ற பொருளை உரைக்குள் வெளிப்படையாகச் சேர்க்கவில்லை.
- source_word: עַד עוֹלָם
  choice: என்றென்றும்
  rationale: நீடித்த காலத்தைக் குறிக்கும் எபிரெயச் சொற்றொடருக்கு இயல்பான, கண்ணியமான தமிழாக்கம்.
theological_decisions:
- issue: יְהוָה என்ற இறைத் திருப்பெயரின் மொழிபெயர்ப்பு
  choice: யெகோவா
  alternative: கர்த்தர் / யாவே
  rationale: மூலத்தில் தனிப்பட்ட இறைத் திருப்பெயர் இருப்பதால் பட்டப்பெயரான ‘கர்த்தர்’ என்று மாற்றப்படவில்லை. நவீனத் தமிழ் வேதாகமப் பயன்பாட்டில் பரவலாக அறியப்படும் ‘யெகோவா’ பயன்படுத்தப்பட்டது.
- issue: யெகோவா இருவருக்கும் ‘நடுவில்’ இருப்பதன் பொருள்
  choice: உருவகத்தை அப்படியே வைத்தல்
  alternative: ‘சாட்சியாக’ அல்லது ‘உத்தரவாதமளிப்பவராக’ என்று வெளிப்படுத்துதல்
  rationale: சூழல் உடன்படிக்கைக்கான சாட்சி/உத்தரவாதப் பொருளை உணர்த்தினாலும், மூல உரை בֵּין (‘நடுவில்’) என்ற சொல்லையே பயன்படுத்துகிறது. அதன் இறையியல் செறிவையும் திறந்த தன்மையையும் காக்க விளக்கவுரை பிரதான உரையில் சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடை. உடன்படிக்கைச் சூழலின் ஆழ்ந்த தொனியை ‘இதோ’ மற்றும் ‘என்றென்றும்’ காக்கின்றன; மூலத்தின் சுருக்கமும் இறையியல் திறந்த தன்மையும் பாதுகாக்கப்பட்டுள்ளன.
