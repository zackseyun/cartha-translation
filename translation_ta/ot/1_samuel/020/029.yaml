  text: וַ/יֹּ֡אמֶר שַׁלְּחֵ֣/נִי נָ֡א כִּ֣י זֶבַח֩ מִשְׁפָּחָ֨ה לָ֜/נוּ בָּ/עִ֗יר וְ/ה֤וּא צִוָּֽה לִ/י֙ אָחִ֔/י וְ/עַתָּ֗ה אִם מָצָ֤אתִי חֵן֙ בְּ/עֵינֶ֔י/ךָ אִמָּ֥לְטָה נָּ֖א וְ/אֶרְאֶ֣ה אֶת אֶחָ֑/י עַל כֵּ֣ן לֹא בָ֔א אֶל שֻׁלְחַ֖ן הַ/מֶּֽלֶךְ־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/029.yaml
  text: He said[a], ‘Please let me go, because we have a family sacrifice in the city, and my brother himself has commanded me. So now, if I have found favor in your eyes[b], please let me escape and see my brothers.’ Therefore he has not come to the king’s table.
translation:
  language: ta
  text: அவன், “தயவுசெய்து என்னைப் போக விடு; ஏனெனில் நகரத்தில் எங்கள் குடும்பத்துக்கான பலி இருக்கிறது. என் சகோதரன்தான் எனக்குக் கட்டளையிட்டிருக்கிறான். இப்போது உன் பார்வையில் எனக்குத் தயவு கிடைத்திருந்தால், தயவுசெய்து என்னைத் தப்பிச் சென்று[a] என் சகோதரர்களைப்[b] பார்க்க விடு” என்றான். ஆகவேதான் அவன் அரசரின் மேசைக்கு வரவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “தப்பிச் சென்று” என்பதற்கு “யாருக்கும் தெரியாமல் நழுவிச் சென்று” என்றும் பொருள் கொள்ளலாம். எபிரெய வினை தப்பித்துச் செல்வதையோ மறைவாக விலகிச் செல்வதையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “சகோதரர்கள்” என்பது தாவீதின் உடன்பிறந்த சகோதரர்களையோ, விரிவான பொருளில் அவரது குடும்பக் குழுவைச் சேர்ந்த ஆண் உறவினர்களையோ குறிக்கலாம்.
    reason: cultural_note
lexical_decisions:
- source_word: שַׁלְּחֵנִי נָא
  choice: தயவுசெய்து என்னைப் போகவிடு
  rationale: שלח என்பதன் கட்டளை வடிவமும் முதலாம் நபர் ஒருமை பின்னொட்டும் புறப்பட அனுமதி கேட்பதைக் குறிக்கின்றன; נָא தரும் பணிவையும் ‘தயவுசெய்து’ வெளிப்படுத்துகிறது.
- source_word: זֶבַח מִשְׁפָּחָה
  choice: எங்கள் குடும்பத்துக்கான பலி
  rationale: זֶבַח என்பதன் பலியிடுதல் சார்ந்த பொருளையும், מִשְׁפָּחָה என்பதன் குடும்பம் அல்லது குலம் சார்ந்த பரப்பையும் பாதுகாக்கிறது.
- source_word: בָּעִיר
  choice: நகரத்தில்
  rationale: மூலத்தின் இடப்பொருளை இயல்பான நவீனத் தமிழில் நேரடியாகத் தருகிறது.
- source_word: וְהוּא צִוָּה לִי אָחִי
  choice: என் சகோதரனே எனக்குக் கட்டளையிட்டிருக்கிறான்
  rationale: הוּא தரும் வலியுறுத்தலைத் தமிழின் ‘-ஏ’ விகுதி வெளிப்படுத்துகிறது; צוה என்பதன் வலுவான கட்டளைப் பொருளும் காக்கப்படுகிறது.
- source_word: אִם מָצָאתִי חֵן בְּעֵינֶיךָ
  choice: உன் பார்வையில் எனக்குத் தயவு கிடைத்திருந்தால்
  rationale: எபிரெய மரியாதைச் சொல்லாட்சியிலுள்ள ‘உன் கண்களில்’ என்ற உருவகத்தைத் தமிழில் இயல்பாகப் புரியும் ‘உன் பார்வையில்’ என வழங்குகிறது.
- source_word: אִמָּלְטָה נָּא
  choice: தயவுசெய்து நான் தப்பிச் சென்று
  rationale: מלט என்பதிலுள்ள தப்பித்தல் அல்லது தடையிலிருந்து விலகிச் செல்லுதல் என்ற பொருளைக் காக்கிறது; வேண்டுகோள் சூழலில் அடுத்துள்ள ‘அனுமதிப்பாயாக’ என்பதோடு இயல்பாக இணைகிறது.
- source_word: וְאֶרְאֶה אֶת אֶחָי
  choice: என் சகோதரர்களைப் பார்க்க
  rationale: ראה என்பதன் ‘பார்’ என்ற நேரடிப் பொருளையும் אֶחָי என்பதன் ஆண்பால் உறவுமுறையையும் பாதுகாக்கிறது.
- source_word: עַל כֵּן
  choice: ஆகவேதான்
  rationale: தாவீது அரசரின் பந்திக்கு வராததற்கான காரணவிளைவு தொடர்பைத் தெளிவாகக் காட்டுகிறது.
- source_word: אֶל שֻׁלְחַן הַמֶּלֶךְ
  choice: அரசரின் பந்திக்கு
  rationale: அரசருடன் உணவருந்தும் சூழலை நவீனத் தமிழில் இயல்பாகக் குறிக்கிறது; வெறும் மரச்சாமானைக் குறிக்கும் ‘மேசை’ என்பதைவிட உணவுக் கூடுகையைத் தெளிவுபடுத்துகிறது.
