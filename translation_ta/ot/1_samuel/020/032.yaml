base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/032.yaml
  text: Jonathan answered Saul his father and said to him[a], “Why should he be put to death? What has he done?”
translation:
  language: ta
  text: யோனத்தான் தன் தந்தையான சவுலுக்குப் பதிலளித்து, அவனிடம், “அவன் ஏன் கொல்லப்பட வேண்டும்?[a] அவன் என்ன செய்தான்?” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவன் ஏன் மரணத்துக்கு உட்படுத்தப்பட வேண்டும்?” எபிரெய வினைச்சொல் வெறுமனே சாவதைக் குறிக்காமல், ஒருவன் கொல்லப்படுதல் அல்லது மரணத்துக்கு உட்படுத்தப்படுதலைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן
  choice: பதிலளித்து
  rationale: கதை உரையாடலில் ענה என்பது ‘பதில் அளித்தல்’ அல்லது ‘மறுமொழி கூறுதல்’ என்ற பொருளைத் தருகிறது; இங்கு இயல்பான நவீனத் தமிழாக ‘பதிலளித்து’ பயன்படுத்தப்பட்டது.
- source_word: יְהוֹנָתָן
  choice: யோனத்தான்
  rationale: எபிரெய தனிப்பெயரின் தமிழில் நிலைபெற்ற வேதாகம ஒலிபெயர்ப்பு.
- source_word: אֶת שָׁאוּל אָבִיו
  choice: தன் தகப்பனாகிய சவுலுக்கு
  rationale: சவுல் யோனத்தானின் தகப்பன் என்பதைத் தெளிவாகக் காட்டும் எபிரெய ஒட்டுநிலையை இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: וַיֹּאמֶר אֵלָיו
  choice: என்று கேட்டான்
  rationale: சொற்பட ‘அவனிடம் சொன்னான்’ என்றாலும், தொடர்ந்து வரும் நேரடிக் கேள்விகளைத் தமிழில் இயல்பாக அறிமுகப்படுத்த ‘என்று கேட்டான்’ என வழங்கப்பட்டது; மறைமுகப் பொருள் மீண்டும் சொல்லப்படாமல் தமிழ்ச் சொற்றொடரில் உள்ளடங்குகிறது.
- source_word: לָמָּה
  choice: ஏன்
  rationale: காரணத்தைக் கேட்கும் நேரடியான வினாவுக்கு இயல்பான நவீனத் தமிழ்.
- source_word: יוּמַת
  choice: கொல்லப்பட வேண்டும்
  rationale: מות என்பதன் ஹொஃபால் வடிவம் வெறுமனே ‘சாகுதல்’ என்பதல்ல, மரணத்துக்குட்படுத்தப்படுதல் என்ற causative-passive பொருளைக் கொண்டது; சூழலின் வினாவியல் வலிமையையும் ‘வேண்டும்’ தக்கவைக்கிறது.
- source_word: מֶה עָשָׂה
  choice: அவன் என்ன செய்தான்?
  rationale: குற்றமாகக் கருதப்படும் எந்தச் செயலை அவன் செய்தான் என்று கேட்கும் எளிய, இயல்பான தமிழ் வினா.
