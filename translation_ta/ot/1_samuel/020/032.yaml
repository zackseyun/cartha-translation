revisions:
- from: யோனத்தான் தன் தகப்பனாகிய சவுலுக்குப் பதிலளித்து, “அவன் ஏன் கொல்லப்பட வேண்டும்? அவன் என்ன செய்தான்?” என்று கேட்டான்.[a]
  to: யோனத்தான் தன் தந்தையான சவுலுக்குப் பதிலளித்து, அவனிடம், “அவன் ஏன் கொல்லப்பட வேண்டும்?[a] அவன் என்ன செய்தான்?” என்றான்.
