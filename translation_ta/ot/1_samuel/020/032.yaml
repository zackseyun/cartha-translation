translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் வேதாகம உரைக்கு ஏற்ற கண்ணியமான நடையிலும் மொழிபெயர்க்கப்பட்டது. ‘தகப்பன்’ மற்றும் நிலைபெற்ற பெயரான ‘யோனத்தான்’ ஆகியவை தமிழ் வேதாகமப் பயன்பாட்டுடனான தொடர்ச்சிக்காகத் தேர்ந்தெடுக்கப்பட்டன.
