  text: וְ/לֹֽא תַכְרִ֧ת אֶֽת חַסְדְּ/ךָ֛ מֵ/עִ֥ם בֵּיתִ֖/י עַד עוֹלָ֑ם וְ/לֹ֗א בְּ/הַכְרִ֤ת יְהוָה֙ אֶת אֹיְבֵ֣י דָוִ֔ד אִ֕ישׁ מֵ/עַ֖ל פְּנֵ֥י הָ/אֲדָמָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/015.yaml
  text: And you shall not cut off your steadfast love from my house forever[a], not even when Yahweh cuts off David’s enemies, every one of them, from the face of the earth.
translation:
  language: ta
  text: மேலும், உன் மாறாத அன்பை என் வீட்டாரிடமிருந்து என்றைக்கும் அகற்றிவிடாதே[a]; யாவே தாவீதின் எதிரிகள் ஒவ்வொருவரையும் பூமியின் முகத்திலிருந்து அகற்றும்போதுகூட அகற்றிவிடாதே.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உன் உடன்படிக்கை விசுவாசத்தை” / “உன் விசுவாசமான அன்பை.” எபிரெயச் சொல் חֶסֶד, உடன்படிக்கை உறவுக்குள் உண்மையுடன் நிலைக்கும் அன்பை அடிக்கடி குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַכְרִת / בְּהַכְרִת (כרת)
  choice: அகற்றிவிடாதே / அகற்றும்போது
  rationale: இரு இடங்களிலும் ஒரே வினைச்சொல்லைப் பயன்படுத்துவது எபிரெயச் சொல்விளையாட்டைத் தக்கவைக்கிறது. தமிழில் அன்பை ஒருவரிடமிருந்து அகற்றுதல் என்றும் எதிரிகளை பூமியிலிருந்து அகற்றுதல் என்றும் இயல்பாகக் கூற முடிகிறது.
- source_word: חַסְדְּךָ
  choice: உன் மாறாத அன்பை
  rationale: חֶסֶד என்பது இங்கு வெறும் தயவை மட்டுமல்லாமல் உறவுக்கும் உடன்படிக்கைக்கும் உண்மையாக நிலைக்கும் அன்பைக் குறிக்கிறது. ‘மாறாத அன்பு’ அதன் அன்பு மற்றும் விசுவாசம் ஆகிய இரு நுணுக்கங்களையும் இயல்பான தமிழில் தருகிறது.
- source_word: מֵעִם בֵּיתִי
  choice: என் வீட்டாரிடமிருந்து
  rationale: בֵּיתִי இங்கு கட்டிடத்தை அல்ல, யோனத்தானின் குடும்பத்தையும் வழிமரபையும் குறிக்கிறது; ‘வீட்டார்’ இந்தக் குடும்பப் பொருளைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: עַד עוֹלָם
  choice: என்றைக்கும்
  rationale: நீடித்த, முடிவற்ற காலத்தைக் குறிக்கும் இயல்பான நவீனத் தமிழ் வடிவம்.
- source_word: יְהוָה
  choice: யாவே
  rationale: தலைப்புச் சொல்லால் மாற்றாமல், எபிரெயத் தெய்வீகப் பெயரைத் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: אֹיְבֵי דָוִד
  choice: தாவீதின் எதிரிகள்
  rationale: எபிரெய இணைப்புத் தொடரைத் தமிழில் இயல்பான உடைமைத் தொடராக வழங்குகிறது.
- source_word: אִישׁ
  choice: ஒவ்வொருவரையும்
  rationale: பன்மையான எதிரிகள் ஒவ்வொருவராக அகற்றப்படுவார்கள் என்ற பகிர்முறை வலியுறுத்தலைத் தெளிவாகக் காட்டுகிறது; தமிழில் ‘ஒவ்வொரு மனிதனையும்’ என்பது தேவையற்ற கடினத்தன்மையையும் பாலின வரம்பையும் உண்டாக்கும்.
- source_word: מֵעַל פְּנֵי הָאֲדָמָה
  choice: பூமியின் பரப்பிலிருந்து
  rationale: எபிரெய மொழிமரபின் ‘பூமியின் முகத்திலிருந்து’ என்ற உருவகத்தை இயல்பான, கண்ணியமான தமிழில் வழங்குகிறது.
- source_word: וְלֹא ... וְלֹא
  choice: அகற்றிவிடாதே ... அகற்றும்போதுகூட அப்படிச் செய்யாதே
  rationale: இரண்டாவது மறுப்பு முதல் வேண்டுகோளை வலுப்படுத்தி, யாவே தாவீதின் எதிரிகளை அகற்றும் காலத்திலும் அது பொருந்தும் என்பதைத் தமிழில் தெளிவாக்குகிறது.
theological_decisions:
- issue: உடன்படிக்கைச் சூழலில் חֶסֶד என்பதன் தன்மை
  choice: மாறாத அன்பு
  alternative: உடன்படிக்கை விசுவாசம்; விசுவாசமான அன்பு; தயவு
  rationale: யோனத்தானுக்கும் தாவீதுக்கும் இடையிலான உடன்படிக்கை இந்தச் சொல்லுக்கு நிலைத்த விசுவாசத்தின் நுணுக்கத்தை அளிக்கிறது. ஆனாலும் அதை முதன்மை உரையில் சட்டரீதியான தொழில்நுட்பச் சொல்லாகச் சுருக்காமல், அன்பையும் விசுவாசத்தையும் உள்ளடக்கும் வகையில் மொழிபெயர்க்கப்பட்டுள்ளது.
- issue: இரண்டாம் கூறுடன் யோனத்தானின் வேண்டுகோளுக்குள்ள தொடர்பு
  choice: யாவே தாவீதின் எதிரிகளை அகற்றும்போதுகூட யோனத்தானின் வீட்டாரிடமிருந்து அன்பை அகற்ற வேண்டாம் என்ற வேண்டுகோள்
  alternative: யாவே எதிரிகளை அகற்றுவது குறித்த தனியான அல்லது இடைச்செருகலான கூற்று
  rationale: இரண்டாவது மறுப்பு முதல் வேண்டுகோளின் கால எல்லையை வலியுறுத்துகிறது. தாவீதின் எதிரிகள் வீழும் வேளையிலும் யோனத்தானின் குடும்பத்திற்கு இரக்கம் காட்டப்பட வேண்டும் என்ற பதற்றத்தை இது காக்கிறது.
- issue: אִישׁ என்பதன் பகிர்முறைப் பொருள்
  choice: ஒவ்வொருவரையும்
  alternative: ஒவ்வொரு மனிதனையும்; அவர்கள் அனைவரையும்
  rationale: ஒவ்வொரு எதிரியும் தனித்தனியாக உள்ளடக்கப்படுகிறான் என்ற எபிரெய வலியுறுத்தலை இது இயல்பான தமிழில் தருகிறது; குறிப்பாக ஆண்கள் மட்டுமே குறிக்கப்படுகிறார்கள் என்று உரை அவசியப்படுத்தாததால் செயற்கையான பாலினச் சுருக்கம் தவிர்க்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில் கண்ணியமான, வாசிக்க எளிய நடை பயன்படுத்தப்பட்டுள்ளது. வசனம் முந்தைய உரையின் தொடராக இருப்பதால் ‘மேலும்’ எனத் தொடங்குகிறது. எபிரெய மூலத்தில் כרת இருமுறை வருவதைக் காட்ட ‘அகற்று’ இரு கூறுகளிலும் மீண்டும் பயன்படுத்தப்பட்டுள்ளது; இரண்டாவது மறுப்பின் வலியுறுத்தல் ‘அப்படிச் செய்யாதே’ என்பதால் வெளிப்படையாகிறது.
