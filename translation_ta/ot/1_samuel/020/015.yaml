revisions:
- from: மேலும், உன் மாறாத அன்பை என் வீட்டாரிடமிருந்து என்றைக்கும் அகற்றிவிடாதே[a]. யாவே தாவீதின் எதிரிகள் ஒவ்வொருவரையும் பூமியின் பரப்பிலிருந்து அகற்றும்போதுகூட அப்படிச் செய்யாதே.
  to: மேலும், உன் மாறாத அன்பை என் வீட்டாரிடமிருந்து என்றைக்கும் அகற்றிவிடாதே[a]; யாவே தாவீதின் எதிரிகள் ஒவ்வொருவரையும் பூமியின் முகத்திலிருந்து அகற்றும்போதுகூட அகற்றிவிடாதே.
