base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/007.yaml
  text: If he says[a], ‘Good,’ there will be peace for your servant; but if he becomes very angry, know that evil has been determined by him.
translation:
  language: ta
  text: அவர், ‘நல்லது’ என்று சொன்னால், உமது அடியானுக்கு நலமே உண்டாகும். ஆனால் அவர் மிகவும் கோபமடைந்தால், தீங்கு செய்ய அவர் உறுதியாகத் தீர்மானித்துவிட்டார் என்பதை அறிந்துகொள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவரால் தீமை உறுதியாகத் தீர்மானிக்கப்பட்டுள்ளது”; அதாவது, தீங்கு செய்யச் சவுல் உறுதியாக முடிவுசெய்துவிட்டார்.
    reason: lexical_alternative
lexical_decisions:
- source_word: טוֹב
  choice: நல்லது
  rationale: சவுலின் ஒப்புதலைக் காட்டும் சுருக்கமான நேரடிக் கூற்றாக வரும் பெயரடை; தமிழிலும் ‘நல்லது’ இயல்பான பதிலாக உள்ளது.
- source_word: שָׁלוֹם
  choice: நலமே உண்டாகும்
  rationale: இங்கு வெறும் மோதலின்மை மட்டுமல்லாமல் தாவீதின் பாதுகாப்பையும் நல்வாழ்வையும் குறிக்கிறது; சூழலின் எதிர்கால விளைவையும் இச்சொற்றொடர் வெளிப்படுத்துகிறது.
- source_word: לְעַבְדֶּךָ
  choice: உமது அடியானுக்கு
  rationale: தாவீது தன்னை யோனத்தானிடம் தாழ்மையாக மூன்றாம் நபரில் குறிப்பிடுகிறார். அரசவைக்குரிய மரியாதையையும் தாழ்மையையும் ‘அடியான்’ இயல்பாகத் தருகிறது.
- source_word: חָרֹה יֶחֱרֶה לוֹ
  choice: அவர் மிகவும் கோபமடைந்தால்
  rationale: வினையெச்சத்தின் மூலவடிவமும் வினையும் சேர்ந்த எபிரெய தீவிரப்படுத்தலை ‘மிகவும்’ வெளிப்படுத்துகிறது.
- source_word: דַּע
  choice: அறிந்துகொள்
  rationale: சவுலின் எதிர்வினையிலிருந்து முடிவை உணருமாறு யோனத்தானுக்குக் கொடுக்கப்படும் நேரடி ஒருமை ஆண்பால் கட்டளை.
- source_word: כָלְתָה הָרָעָה מֵעִמּוֹ
  choice: தீங்கு செய்ய அவர் உறுதியாகத் தீர்மானித்துவிட்டார்
  rationale: சவுலின் தீய நோக்கம் முழுமையாக முடிவுசெய்யப்பட்டிருப்பதை இயல்பான தமிழில் தெரிவிக்கிறது; הָרָעָה என்பதன் ஒழுக்கப் பாரத்தை ‘தீங்கு’ என்ற சூழல்சார் சொல்லுடன் அடிக்குறிப்பு விளக்குகிறது.
theological_decisions:
- issue: כָלְתָה הָרָעָה מֵעִמּוֹ என்பதன் இலக்கண மற்றும் பொருள் நுணுக்கம்
  choice: தீங்கு செய்ய அவர் உறுதியாகத் தீர்மானித்துவிட்டார்
  alternative: தீமை அவரிடமிருந்து முழுமையாகத் தீர்மானிக்கப்பட்டுவிட்டது
  rationale: முதன்மை உரை சவுலின் உறுதியான தீய நோக்கத்தை தெளிவான தமிழில் தருகிறது; எபிரெய மொழியின் ‘முழுமையடைதல்/அவரிடமிருந்து’ என்ற அமைப்பிலுள்ள உண்மையான நுணுக்கத்தை அடிக்குறிப்பு பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘உமது அடியான்’ என்பது உரையாடலின் அரசவைச் சார்ந்த தாழ்மையைத் தக்கவைக்கிறது; இங்கு பேசுவது தாவீது என்பதால் அது தாவீதையே குறிக்கிறது. ‘நலமே உண்டாகும்’ என்பது שָׁלוֹם குறிக்கும் பாதுகாப்பு மற்றும் நல்வாழ்வை இயல்பாக எடுத்துரைக்கிறது.
