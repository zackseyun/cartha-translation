  text: And Jonathan made David swear again by his love for him[b][a], for he loved him as his own soul.
translation:
  language: ta
  text: யோனத்தான் தாவீதின்மேல் தனக்கிருந்த அன்பின் காரணமாக, தாவீதை மீண்டும் ஆணையிட்டு சத்தியம் செய்ய வைத்தான்[a]; ஏனெனில், அவன் தன் உயிரையே நேசிப்பதுபோல் தாவீதையும் நேசித்தான்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘யோனத்தான் தாவீதைத் தொடர்ந்து சத்தியம் செய்ய வைத்தான்’ அல்லது ‘தாவீதை மீண்டும் ஆணையின்கீழ் வைத்தான்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில், ‘அவன் தன் உயிரின் அன்பால் அவனை நேசித்தான்’; இது ‘தன் உயிரையே நேசிப்பதுபோல்’ என்ற பொருளுடைய, ஆழ்ந்த தனிப்பட்ட அன்பை வெளிப்படுத்தும் மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹסֶף
  choice: மீண்டும்
  rationale: יסף என்பதுடன் தொடரும் வினையெச்ச அமைப்பு, செயல் மறுபடியும் நடந்ததையோ தொடர்ந்ததையோ குறிக்கிறது. இங்கு ‘மீண்டும்’ என்பது கதைச்சூழலில் இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: לְהַשְׁבִּיעַ
  choice: ஆணையிடச் செய்தான்
  rationale: שבע என்பதன் ஹிஃபில் வடிவம் ஒருவரை ஆணையிடச் செய்வதையோ ஆணைக்குக் கட்டுப்படுத்துவதையோ குறிக்கிறது; தமிழில் இந்தக் காரணவினை வடிவம் அந்த வலிமையைத் தக்கவைக்கிறது.
- source_word: בְּאַהֲבָתוֹ אֹתוֹ
  choice: தாவீதின்மீது கொண்டிருந்த அன்பின் பேரில்
  rationale: בְּ இங்கு அன்பைச் செயலின் அடிப்படையாகவோ உந்துதலாகவோ காட்டலாம். சுட்டுப்பெயர்களின் பொருளைத் தமிழில் தெளிவாக்க பெயரை மீண்டும் பயன்படுத்தப்பட்டுள்ளது; எபிரெயச் சொற்றொடரின் சுருக்கமும் மாற்று நுணுக்கமும் அடிக்குறிப்பில் பாதுகாக்கப்படுகின்றன.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: இந்த இணைப்புச்சொல் யோனத்தானின் செயலுக்கான விளக்கத்தை அறிமுகப்படுத்துகிறது.
- source_word: אַהֲבַת נַפְשׁוֹ
  choice: தன் உயிரை நேசித்ததுபோல
  rationale: נֶפֶשׁ என்பது உயிர், தன் நபர், ஆன்மா ஆகிய பொருள்களை ஏற்கலாம். இங்கு ஆழ்ந்த தனிப்பட்ட அன்பைக் குறிக்கும் மரபுத்தொடராக இருப்பதால், நவீன தமிழில் புரியக்கூடிய ‘தன் உயிரை நேசித்ததுபோல’ என வழங்கப்பட்டுள்ளது.
- source_word: אֲהֵבוֹ
  choice: தாவீதையும் நேசித்தான்
  rationale: வினை யோனத்தான் தாவீதை நேசித்தான் என்ற விளக்க உண்மையைச் சொல்கிறது. தெளிவிற்காக ‘அவனை’ என்பதற்குப் பதில் பெயர் பயன்படுத்தப்பட்டுள்ளது.
theological_decisions:
- issue: தாவீதின்மீது யோனத்தான் கொண்ட அன்பின் தன்மை
  choice: எபிரெய மூலத்தில் உள்ள வலுவான ‘நேசித்தான்/அன்பு’ என்ற மொழியைத் தக்கவைத்து, அதன் தன்மையை மேலதிகமாக வரையறுக்காமல் மொழிபெயர்த்தல்
  alternative: அதை வெறும் ‘நட்பு’ என்று மெலிதாக்குதல் அல்லது மூலத்தில் வெளிப்படையாக இல்லாத காதல்/பாலியல் பொருளைச் சேர்த்தல்
  rationale: אהב என்ற சொல் ஆழமான தனிப்பட்ட பற்றை வெளிப்படுத்துகிறது. ஆனால் அந்த அன்பின் தன்மையை இவ்வசனம் விரிவாக வரையறுக்காததால், மொழிபெயர்ப்பு அதன் தீவிரத்தைப் பாதுகாத்து விளக்க மீறலைத் தவிர்க்கிறது.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘ஆணையிடச் செய்தான்’ காரணவினையைத் தக்கவைக்கிறது; ‘தன் உயிரை நேசித்ததுபோல’ என்பது נֶפֶשׁ மரபுத்தொடரை சாதாரண வாசகர்களுக்குப் புரியும் வகையில் வழங்குகிறது. சுட்டுப்பெயர் குழப்பத்தைத் தவிர்க்க ‘தாவீது’ இரண்டாம் முறை வெளிப்படையாகக் குறிப்பிடப்பட்டுள்ளது.
