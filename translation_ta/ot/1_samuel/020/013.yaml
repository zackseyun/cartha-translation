base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/013.yaml
  text: May Yahweh do so to Jonathan[a], and more also, if my father intends evil against you and I do not disclose it to you and send you away, so that you may go in peace. And may Yahweh be with you[c][b], as he has been with my father.
translation:
  language: ta
  text: '“யெகோவா யோனத்தானுக்கு இப்படிச் செய்யட்டும்; இதற்கும் மேலும் செய்யட்டும்: என் தந்தை உனக்குத் தீங்கு செய்ய எண்ணினால், நான் அதை உனக்குத் தெரிவித்து, நீ சமாதானத்துடன் போகும்படி உன்னை அனுப்பிவைக்காவிட்டால்[a]. யெகோவா என் தந்தையோடு இருந்ததுபோல உன்னோடும் இருப்பாராக.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய உறுதிமொழியின் வாக்கிய அமைப்பு சுருக்கப்பட்டுள்ளது. சொல்லுக்குச் சொல், “என் தந்தைக்கு உனக்கு எதிராகத் தீங்கு செய்வது நன்றாயிருந்தால், நான் உன் காதைத் திறந்து, உன்னை அனுப்பிவைப்பேன் …” என்று வருகிறது. “உன் காதைத் திறத்தல்” என்பது “உனக்குத் தெரிவித்தல்” என்ற மரபுத்தொடர். சூழலின்படி, யோனத்தான் இதைத் தெரிவித்து தாவீதை அனுப்பிவைக்கத் தவறினால் சாபம் தன்மேல் வரட்டும் என்பதே பொருள்.
    reason: textual_ambiguity
lexical_decisions:
- source_word: כֹּה יַעֲשֶׂה יְהוָה לִיהוֹנָתָן וְכֹה יֹסִיף
  choice: யெகோவா யோனத்தானுக்கு இப்படிச் செய்யட்டும்; இதற்கு மேலும் செய்யட்டும்
  rationale: இது சாபத்தைத் தன்மேல் வரவழைக்கும் வழக்கமான எபிரெய உறுதிமொழி. மூலத்தில் உள்ள மூன்றாம் நபர் பெயரிடல் பாதுகாக்கப்படுகிறது.
- source_word: יֵיטִב אֶל אָבִי אֶת הָרָעָה עָלֶיךָ
  choice: என் தந்தை உனக்குத் தீங்கு செய்ய எண்ணியிருப்பது தெரியவந்தும்
  rationale: சொல்லெச்சமாக ‘உனக்கு எதிரான தீமை என் தந்தைக்கு நன்றாயிருந்தால்’ என்ற நீள்வட்டச் சொற்றொடர், சவுல் தீங்கு செய்ய விரும்புவது அல்லது எண்ணுவது என்ற பொருளைத் தருகிறது. כִּי-யின் சூழல்சார் நிபந்தனை உணர்வு ‘தெரியவந்தும்’ என்பதில் வெளிப்படுகிறது.
- source_word: וְגָלִיתִי אֶת אָזְנֶךָ
  choice: நான் அதை உனக்குத் தெரிவித்து ... அனுப்பிவைக்காவிட்டால்
  rationale: ‘உன் காதைத் திறப்பேன்’ என்பது ‘தெரிவிப்பேன்’ என்ற எபிரெய மரபுத்தொடர். உறுதிமொழியின் சுருக்கப்பட்ட கட்டமைப்பிலுள்ள மறுப்பு, முழு வினைத்தொடரையும் இயல்பான தமிழில் ஆளுமாறு இறுதியில் ‘-ஆவிட்டால்’ எனக் கொடுக்கப்பட்டுள்ளது.
- source_word: וְשִׁלַּחְתִּיךָ
  choice: உன்னை அனுப்பிவைக்காவிட்டால்
  rationale: பீயேல் வடிவத்தின் செயற்படுத்தும் நுணுக்கத்தையும், யோனத்தான் தாவீதின் புறப்பாட்டுக்கு உதவுவார் என்பதையும் பாதுகாக்கிறது.
- source_word: וְהָלַכְתָּ לְשָׁלוֹם
  choice: நீ சமாதானத்துடன் போகும்படி
  rationale: לְשָׁלוֹם என்பதன் சமாதானம், நலம், பாதுகாப்பு ஆகிய பரப்பை ‘சமாதானத்துடன்’ பாதுகாக்கிறது; தொடரின் நோக்க உணர்வு ‘போகும்படி’ எனத் தரப்படுகிறது.
- source_word: וִיהִי יְהוָה עִמָּךְ
  choice: யெகோவா ... உன்னோடும் இருப்பாராக
  rationale: வேண்டுதல்/வாழ்த்தைக் குறிக்கும் யுசிவ் வலிமை ‘இருப்பாராக’ என வெளிப்படுகிறது.
- source_word: כַּאֲשֶׁר הָיָה עִם אָבִי
  choice: என் தந்தையோடு இருந்ததுபோல
  rationale: மூலத்தின் ஒப்பீட்டை நேரடியாகப் பாதுகாக்கிறது; கடந்தகாலத்தில் சவுலோடு இருந்த தெய்வீக துணையைத் தாவீதுக்காக யோனத்தான் வேண்டுகிறார்.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: திருநான்கெழுத்துப் பெயரை ஒரு பட்டப்பெயரால் மாற்றாமல், தமிழில் நிலைபெற்ற தனிப்பெயர் வடிவமான ‘யெகோவா’ என வழங்குகிறது.
theological_decisions:
- issue: யோனத்தானின் உறுதிமொழியில் வெளிப்படையாக இல்லாத மறுப்பு
  choice: ‘தெரிவித்து ... அனுப்பிவைக்காவிட்டால்’ என்று சுருக்கப்பட்ட மறுப்பை வெளிப்படுத்துதல்
  alternative: மறுப்பைச் சேர்க்காமல், ‘என் தந்தை தீங்கு செய்ய எண்ணினால், நான் அதைத் தெரிவித்து உன்னை அனுப்பிவைப்பேன்’ என வாசித்தல்
  rationale: எபிரெய சாப-உறுதிமொழியில் விளைவு வாக்கியம் சுருக்கப்பட்டுள்ளது. சூழலில், யோனத்தான் எச்சரித்து அனுப்பத் தவறினால் சாபம் தன்மேல் வரட்டும் என்பதே கருத்து. மறுப்பை வெளிப்படுத்துவது பொருளைத் தெளிவாக்குகிறது; அதை எவ்வாறு நிரப்புவது உரையில் உண்மையான கட்டமைப்பு சிக்கலாக இருப்பதால் அடிக்குறிப்பில் குறிப்பிடப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பாகவும் மதிப்புமிக்க நடையிலும் மொழிபெயர்க்கப்பட்டுள்ளது. ‘சமாதானத்துடன்’ என்ற வேதாகமச் சூழலுக்கு ஏற்ற பொதுவழக்கு காக்கப்பட்டுள்ளது. உறுதிமொழியின் கடுமையை உணர்த்த வியப்புக்குறி பயன்படுத்தப்பட்டுள்ளது; சுருக்கப்பட்ட எபிரெய இலக்கணத்தை அடிக்குறிப்பு வெளிப்படையாக விளக்குகிறது.
