- from: “யெகோவா யோனத்தானுக்கு இப்படிச் செய்யட்டும்; இதற்கு மேலும் செய்யட்டும்! என் தந்தை உனக்குத் தீங்கு செய்ய எண்ணியிருப்பது தெரியவந்தும், நான் அதை உனக்குத் தெரிவித்து, நீ சமாதானத்துடன் போகும்படி உன்னை அனுப்பிவைக்காவிட்டால், அப்படியே ஆகட்டும். யெகோவா என் தந்தையோடு இருந்ததுபோல உன்னோடும் இருப்பாராக.”[a]
