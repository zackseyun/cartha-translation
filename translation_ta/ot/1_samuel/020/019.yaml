base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/019.yaml
  text: On the third day[a], go down quickly and come to the place where you hid yourself on the day of the deed[b], and remain beside the stone Ezel.
translation:
  language: ta
  text: மூன்றாம் நாளில்[a] நீ வேகமாகக் கீழே இறங்கி, அந்தக் காரிய நாளில்[b] நீ ஒளிந்திருந்த இடத்துக்கு வந்து, ஏசேல் கல்லின் அருகே[c] தங்கியிரு.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரேயச் சொற்றொடரை ‘நீ இதை மூன்றாவது முறையாகச் செய்யும்போது’ அல்லது ‘மூன்று நாட்களுக்குப் பின்’ என்றும் புரிந்துகொள்ள வாய்ப்புள்ளது.
    reason: lexical_alternative
  - marker: b
    text: எபிரேயத்தில் ‘செயலின் நாளில்’ அல்லது ‘காரியத்தின் நாளில்’; இதை ‘நிகழ்வின் நாளில்’ அல்லது ‘அலுவலின் நாளில்’ என்றும் மொழிபெயர்க்கலாம். முன்பு ஏற்பாடு செய்யப்பட்ட காரியம் அல்லது சந்தர்ப்பத்தையே இச்சொற்றொடர் குறிப்பிடுவதாகத் தெரிகிறது.
    reason: lexical_alternative
  - marker: c
    text: ‘ஏசேல்’ என்பது பெரும்பாலும் இடப்பெயர் அல்லது அந்தக் கல்லின் நிலையான பெயர். இதன் அடிப்படை எபிரேயச் சொல் ‘செல்லுதல்’ அல்லது ‘புறப்படுதல்’ என்பதோடு தொடர்புடையதாக இருக்கலாம்; அதன் துல்லியமான பொருள் உறுதியில்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשִׁלַּשְׁתָּ
  choice: மூன்றாம் நாளில்
  rationale: பיעேல் வடிவம் இங்கு இயல்பான தமிழில் சொல்லுக்குச் சொல் மொழிபெயர்க்க முடியாத ஓர் இடியமாக உள்ளது. சூழலில், ஒப்புக்கொள்ளப்பட்ட அடையாளத் திட்டத்தின் மூன்றாம் நாளையே குறிப்பதாகத் தோன்றுவதால் இவ்வாறு மொழிபெயர்க்கப்பட்டது; வேறு சாத்தியங்கள் அடிக்குறிப்பில் தரப்பட்டுள்ளன.
- source_word: תֵּרֵד מְאֹד
  choice: வேகமாகக் கீழே இறங்கி
  rationale: יָרַד என்பது ‘கீழே இறங்கு’; מְאֹד செயலை வலுப்படுத்துகிறது. மறைவிடத்துக்குச் செல்லும் அவசரமான இயக்கத்தை இயல்பான தமிழில் தெரிவிக்க ‘வேகமாக’ பயன்படுத்தப்பட்டது; ‘மிகவும் கீழே இறங்கு’ என்பது தமிழில் செயற்கையாக ஒலிக்கும்.
- source_word: וּבָאתָ אֶל הַמָּקוֹם
  choice: இடத்துக்கு வந்து
  rationale: בוא என்பதன் அடிப்படைப் பொருள் ‘வா/உள்ளே செல்’. நேரடி அறிவுறுத்தலில் ‘இடத்துக்கு வந்து’ என்பது இயல்பானது.
- source_word: אֲשֶׁר נִסְתַּרְתָּ שָּׁם
  choice: நீ ஒளிந்திருந்த
  rationale: நிபால் வடிவம் சூழலில் தாவீது தன்னையே மறைத்துக்கொண்டதைச் சுட்டுகிறது. ‘ஒளிந்திருந்த’ என்பது தெளிவான, இயல்பான தமிழ்.
- source_word: בְּיוֹם הַמַּעֲשֶׂה
  choice: அந்த நிகழ்ச்சி நடந்த நாளில்
  rationale: מַעֲשֶׂה என்பதற்கு ‘செயல், காரியம், நிகழ்வு’ என்ற பரந்த பொருள் உண்டு. முன்பு ஏற்பாடு செய்யப்பட்ட காரியம் அல்லது சந்தர்ப்பத்தைச் சுட்டுவதாகத் தோன்றுவதால் ‘அந்த நிகழ்ச்சி’ என வழங்கப்பட்டது; எபிரேயச் சொற்றொடரின் தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: וְיָשַׁבְתָּ
  choice: தங்கியிரு
  rationale: ישׁב என்பதற்கு ‘உட்கார், குடியிரு, தங்கியிரு’ என்ற பொருள்கள் உண்டு. மறைவிடத்தில் காத்திருக்கும்படியான அறிவுறுத்தலில் ‘தங்கியிரு’ நோக்கத்தைத் தெளிவாகக் கூறுகிறது.
- source_word: אֵצֶל הָאֶבֶן הָאָזֶל
  choice: ஏசேல் கல்லின் அருகே
  rationale: אֶבֶן என்பது ‘கல்’. הָאָזֶל என்பது இங்கு அந்தக் கல்லின் நிலையான பெயர் அல்லது இடப்பெயராக இருப்பது சாத்தியம். சரியான பொருள் உறுதியில்லாததால் ‘ஏசேல்’ என ஒலிபெயர்க்கப்பட்டு, மாற்றுப் பொருள் அடிக்குறிப்பில் குறிப்பிடப்பட்டது.
