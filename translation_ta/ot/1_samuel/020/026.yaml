base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/026.yaml
  text: But Saul did not say anything that day[a], for he thought, “Something has happened; he is not clean—surely he is not clean.”
translation:
  language: ta
  text: ஆனால் அன்று சவுல் எதுவும் சொல்லவில்லை. ஏனெனில், “ஏதோ சம்பவம் நடந்திருக்கிறது; அவன் தூய்மையாக இல்லை—நிச்சயமாக அவன் தூய்மையாக இல்லை” என்று அவன் நினைத்தான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அதாவது, “அவன் சடங்கின்படி தூய்மையற்றவனாக இருக்கிறான்.” இந்த விருந்தின் சூழலில் எபிரெயச் சொல் சடங்குசார் தூய்மையைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: דִבֶּר ... מְאוּמָה
  choice: எதுவும் சொல்லவில்லை
  rationale: ‘பேசு/சொல்’ என்பதுடன் ‘எதுவும்’ இணைந்த எபிரெய மரபுத்தொடரின் இயல்பான நவீனத் தமிழ் வடிவம்.
- source_word: בַּיּוֹם הַהוּא
  choice: அன்று
  rationale: ‘அந்த நாளில்’ என்ற காலக் குறிப்பைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: כִּי אָמַר
  choice: என்று அவன் நினைத்தான்
  rationale: சொல்லர்த்தம் ‘அவன் சொன்னான்’ என்றாலும், இங்கு சவுலின் மனத்திற்குள்ளான எண்ணம் குறிப்பிடப்படுவதால் ‘நினைத்தான்’ என்பது சூழலுக்கேற்றது.
- source_word: מִקְרֶה
  choice: ஏதோ ஒன்று நேர்ந்திருக்கிறது
  rationale: எதிர்பாராத நிகழ்வு அல்லது சம்பவம் என்ற பொருளைத் தருகிறது; யாருக்கு நேர்ந்தது என்பதை மூலத்தில் இல்லாதபடி சேர்க்கவில்லை.
- source_word: בִּלְתִּי טָהוֹר הוּא
  choice: அவன் தூய்மையாக இல்லை
  rationale: எபிரெயச் சொற்றொடரின் மறுப்பு வடிவத்தைப் பாதுகாக்கிறது; சடங்குசார் பொருள் அடிக்குறிப்பில் விளக்கப்படுகிறது.
- source_word: כִּי לֹא טָהוֹר
  choice: நிச்சயமாகவே அவன் தூய்மையாக இல்லை
  rationale: மீண்டும் கூறப்படும் முடிவின் வலியுறுத்தலையும் இங்குள்ள כִּי-யின் உறுதிப்படுத்தும் தன்மையையும் தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: טָהוֹר குறிக்கும் தூய்மையின் தன்மை
  choice: முதன்மை உரையில் ‘தூய்மையாக இல்லை’ என்று பரந்த சொல்லாக்கத்தை வைத்தல்
  alternative: ‘சடங்கின்படி தீட்டுப்பட்டிருக்கிறான்’ என்று வெளிப்படையாக மொழிபெயர்த்தல்
  rationale: அமாவாசை விருந்தின் கதைச் சூழலில் இது சடங்குசார் தூய்மையின்மையை இயல்பாகக் குறிக்கிறது. எனினும், மூலத்தின் பொதுவான சொல்லை முதன்மை உரையில் பாதுகாத்து, சூழல்சார் பொருளை அடிக்குறிப்பில் தருவது தேவையற்ற விளக்கச் சேர்க்கையைத் தவிர்க்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான உரைநடை பயன்படுத்தப்பட்டுள்ளது. சவுலின் உள்ளார்ந்த எண்ணம் நேரடி மேற்கோளாக வைக்கப்பட்டு, மூலத்தில் உள்ள இருமுறை வலியுறுத்தல் பாதுகாக்கப்பட்டுள்ளது.
