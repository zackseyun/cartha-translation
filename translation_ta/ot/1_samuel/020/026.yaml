  source_fidelity: 'மூலத்தின் பொருள் பெரும்பாலும் துல்லியமாக உள்ளது: சவுல் அந்நாளில் எதுவும் சொல்லவில்லை; யோனத்தானுக்கு ஏதோ நேர்ந்ததால் அவன் சடங்குசார் தூய்மையற்றவனாக இருக்கலாம் என்று எண்ணினான். ஆனால் מִקְרֶה என்ற ‘தற்செயல் நிகழ்வு/சம்பவம்’ என்ற நுணுக்கம் ‘ஏதோ ஒன்று நேர்ந்திருக்கிறது’ என்பதில் சற்றே பொது வடிவமாகிறது; ‘ஏதோ சம்பவம் நடந்திருக்கிறது’ என்பது அதைச் சிறப்பாகக் காட்டும். இரண்டாம் כִּי-யை ‘நிச்சயமாகவே’ என வலுப்படுத்துவது சாத்தியமானது; ஆயினும் தமிழில் மீள்கூற்றின் இயல்பான வலியுறுத்தலை ‘நிச்சயமாக’ போதுமான அளவில் தருகிறது.'
  naturalness: ‘தூய்மையாக இல்லை’ என்பது தமிழில் புரியக்கூடியது; எனினும் இந்த உணவுச் சூழலில் சடங்குசார் நிலையைப் பற்றிய குறிப்பு அடிக்குறிப்பில் இருப்பதால் முதன்மை உரை இயல்பாகவே தொடர்கிறது. ‘ஏதோ சம்பவம் நடந்திருக்கிறது’ மற்றும் ‘அவன் சடங்கின்படி தூய்மையற்றவனாக இருக்கிறான்’ என்ற அடிக்குறிப்பு நவீனத் தரத் தமிழில் தெளிவாகவும் இயல்பாகவும் உள்ளன.
