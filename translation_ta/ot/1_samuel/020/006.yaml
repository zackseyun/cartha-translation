  text: אִם פָּקֹ֥ד יִפְקְדֵ֖/נִי אָבִ֑י/ךָ וְ/אָמַרְתָּ֗ נִשְׁאֹל֩ נִשְׁאַ֨ל מִמֶּ֤/נִּי דָוִד֙ לָ/רוּץ֙ בֵּֽית לֶ֣חֶם עִיר֔/וֹ כִּ֣י זֶ֧בַח הַ/יָּמִ֛ים שָׁ֖ם לְ/כָל הַ/מִּשְׁפָּחָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/006.yaml
  text: If your father surely notices me[a], then say, ‘David earnestly asked leave of me to run to Bethlehem, his city[d][c][b], because the yearly sacrifice is there for the whole family.’
translation:
  language: ta
  text: “என் இல்லாமையை உன் தந்தை நிச்சயமாகக் கவனித்தால்[a], ‘தாவீது தன் நகரமான பெத்லகேமுக்கு விரைந்து செல்ல என்னிடம் அனுமதி தரும்படி மிகவும் வேண்டினான்[b]; ஏனெனில் முழுக் குடும்பத்திற்குமான வருடாந்திர பலி அங்கே நடக்கிறது’ என்று சொல்.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என்னை உன் தந்தை நிச்சயமாகத் தேடினால்.” எபிரெய மொழியில் வினையை வலியுறுத்தும் இலக்கண அமைப்பு பயன்படுத்தப்பட்டுள்ளது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “என்னிடம் அனுமதி கேட்டுக் கெஞ்சினான்.” இங்கும் எபிரெய மொழியில் வினையை வலியுறுத்தும் இலக்கண அமைப்பு உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: פָּקֹד יִפְקְדֵנִי
  choice: என் இல்லாமையை உன் தந்தை கட்டாயம் கவனித்தால்
  rationale: פקד என்பதுடன் வினையெச்ச வலியுறுத்தல் அமைப்பு இருப்பதால் உறுதியான கவனிப்பை வெளிப்படுத்துகிறது. விருந்து சூழலில் தாவீதின் இல்லாமையே கவனிக்கப்படுவது தமிழில் இயல்பாக வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: נִשְׁאֹל נִשְׁאַל
  choice: மிகவும் வேண்டிக் கேட்டான்
  rationale: שאל வேரின் வலியுறுத்தல் அமைப்பை இயல்பான நவீன தமிழில் காட்டுகிறது; அனுமதி கோரும் சூழலும் தொடரிலிருந்து தெளிவாகிறது.
- source_word: לָרוּץ
  choice: விரைந்து செல்ல
  rationale: சொற்பொருள் ‘ஓடுதல்’; இச்சூழலில் விரைவாகப் புறப்பட்டுச் செல்வதைச் சுட்டுவதால் concrete sense-ஐ மிகைப்படுத்தாமல் இயல்பாக வழங்குகிறது.
- source_word: בֵּית לֶחֶם עִירוֹ
  choice: தன் நகரமான பெத்லகேமுக்கு
  rationale: ‘பெத்லகேம், அவனுடைய நகரம்’ என்ற எபிரெய apposition-ஐ தமிழில் இயல்பான அடைமொழித் தொடராக வழங்குகிறது.
- source_word: זֶבַח הַיָּמִים
  choice: ஆண்டுதோறும் செலுத்தப்படும் பலி
  rationale: குறித்த காலச்சுழற்சியில் மீண்டும் நடைபெறும் பலியைச் சுட்டும் சொற்றொடரைத் தெளிவாக மொழிபெயர்க்கிறது; ‘வருடாந்திர பலி’ என்பதும் சாத்தியம்.
- source_word: לְכָל הַמִּשְׁפָּחָה
  choice: குடும்பம் முழுவதற்குமான
  rationale: מִשְׁפָּחָה குடும்பம் அல்லது குலம் எனப் பொருள்படலாம்; இச்சூழலில் ‘குடும்பம்’ இயல்பானது, כָל என்பதைக் ‘முழுவதற்குமான’ காட்டுகிறது.
