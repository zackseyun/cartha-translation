- from: “என் இல்லாமையை உன் தந்தை கட்டாயம் கவனித்தால்[a], ‘தாவீது தன் நகரமான பெத்லகேமுக்கு விரைந்து செல்ல என்னிடம் மிகவும் வேண்டிக் கேட்டான்[b]; ஏனெனில் குடும்பம் முழுவதற்குமான ஆண்டுதோறும் செலுத்தப்படும் பலி அங்கே நடைபெறுகிறது’ என்று சொல்.”
  to: “என் இல்லாமையை உன் தந்தை நிச்சயமாகக் கவனித்தால்[a], ‘தாவீது தன் நகரமான பெத்லகேமுக்கு விரைந்து செல்ல என்னிடம் அனுமதி தரும்படி மிகவும் வேண்டினான்[b]; ஏனெனில் முழுக் குடும்பத்திற்குமான வருடாந்திர பலி அங்கே நடக்கிறது’ என்று சொல்.”
  rationale: ‘கட்டாயம்’ என்பதற்குப் பதிலாக உறுதிப்படுத்தும் பொருளுடைய ‘நிச்சயமாக’ இடப்பட்டுள்ளது. மேலும், தாவீது கேட்டது புறப்படுவதற்கான அனுமதி என்பதைத் தெளிவாகக் காட்ட ‘அனுமதி தரும்படி’ சேர்க்கப்பட்டுள்ளது. பிற கூறுகள் மூலத்தின் சொற்பொருள் மற்றும் சூழல் பொருளைத் தக்கவைத்துள்ளன.
