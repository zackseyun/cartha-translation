  register: நவீன பொதுத்தமிழில் இயல்பாகவும் மரியாதைமிக்க வேதாகம நடையிலும் வடிவமைக்கப்பட்டது. ‘கட்டாயம்’ மற்றும் ‘மிகவும்’ ஆகியவை மூலத்தின் இரு வலியுறுத்தல் அமைப்புகளையும் பிரதிபலிக்கின்றன; ‘விரைந்து செல்ல’ என்பது לָרוּץ என்பதன் சூழல்சார் பொருளைத் தருகிறது.
