base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/038.yaml
  text: And Jonathan called after the boy[b][a], “Hurry! Be quick! Do not stop!” So Jonathan’s boy gathered up the arrows and came to his master.
translation:
  language: ta
  text: யோனத்தான் அந்தச் சிறுவனை நோக்கிக் கூப்பிட்டு, “சீக்கிரம்! விரை! நிற்காதே![a]” என்றான். யோனத்தானின் பணியாள் சிறுவன் அம்புகளைப்[b] பொறுக்கி, தன் எஜமானனிடம் வந்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயில் நேரடியாக, “நிற்காதே.” இச்சூழலில் தாமதிக்காமல் தொடர்ந்து செல்ல வேண்டும் என்பதே கருத்து.
    reason: lexical_alternative
  - marker: b
    text: “அம்புகள்” என்பதற்கான எபிரெய வடிவம் எழுத்தில் ஒருமையைப் போல் தோன்றலாம்; ஆனால் யோனத்தான் எய்த அம்புகளையே சூழல் தெளிவாகக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא ... אַחֲרֵי הַנַּעַר
  choice: அந்தச் சிறுவனை நோக்கிக் கூப்பிட்டு
  rationale: קרא אחרי என்பது சென்றுகொண்டிருக்கும் ஒருவரை நோக்கிக் குரல் கொடுப்பதைக் குறிக்கிறது. ‘நோக்கிக் கூப்பிட்டு’ என்பது தமிழில் இயல்பாக அந்தப் பொருளைத் தருகிறது; נַעַר என்பதன் வயது மற்றும் கீழ்நிலைப் பணியாளர் நுணுக்கத்தை ‘சிறுவன்’ காக்கிறது.
- source_word: מְהֵרָה
  choice: சீக்கிரம்!
  rationale: அவசரத்தைத் தெரிவிக்கும் தனித்த கட்டளையாக எளிய, இயல்பான நவீனத் தமிழில் தரப்பட்டுள்ளது.
- source_word: חוּשָׁה
  choice: விரைந்து வா!
  rationale: முந்தைய அவசரக் கட்டளையை விழுங்கிவிடாமல், எபிரெய உரையின் இரட்டித்த வற்புறுத்தலைத் தனிக் கட்டளையாகக் காக்கிறது. சூழலில் அம்புகளைத் தேடிச் செல்லும் சிறுவனிடம் கூறப்படுவதால் ‘வா’ இயல்பான கட்டளை வடிவம்.
- source_word: אַל תַּעֲמֹד
  choice: நிற்காதே!
  rationale: எபிரெயச் சொல்லின் நேரடிப் பொருளையும், இச்சூழலில் தாமதிக்காமல் தொடர்ந்து நகர வேண்டும் என்ற கருத்தையும் தமிழில் இயல்பாகக் காக்கிறது.
- source_word: וַיְלַקֵּט
  choice: பொறுக்கிக்கொண்டு
  rationale: தரையில் விழுந்த அம்புகளை ஒன்றன்பின் ஒன்றாக எடுத்துச் சேர்த்த செயலைத் தமிழில் துல்லியமாகக் காட்டுகிறது.
- source_word: נַעַר יְהוֹנָתָן
  choice: யோனத்தானின் பணியாள் சிறுவன்
  rationale: இரண்டாம் occurrence-இல் சிறுவனின் பணியாளர் உறவைத் தெளிவாக்குவதோடு נַעַר என்பதன் இளவயது நுணுக்கத்தையும் காக்கிறது.
- source_word: החצי
  choice: அம்புகளை
  rationale: எழுத்துவடிவம் ஒருமையைப் போல் தோன்றினாலும், யோனத்தான் எய்த அம்புகளைச் சேகரிக்கும் சூழல் பன்மையைத் தெளிவாகக் கோருகிறது.
- source_word: אֶל אֲדֹנָיו
  choice: தன் எஜமானனிடம்
  rationale: இங்கு אָדוֹן என்பது சிறுவனின் மனித மேலாளரான யோனத்தானைக் குறிக்கிறது. ‘எஜமானன்’ அந்தப் பணியாளர் உறவை இயல்பாகத் தெரிவிக்கிறது.
