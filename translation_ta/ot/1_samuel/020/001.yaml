translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் மதிப்பான கதைநடை பயன்படுத்தப்பட்டுள்ளது. தாவீதின் தொடர்ச்சியான மூன்று தற்காப்பு வினாக்களும், இறுதியில் வெளிப்படும் உயிர் அச்சுறுத்தலும் காக்கப்பட்டுள்ளன. இடப்பெயர்கள் தமிழ் வேதாகமப் பயன்பாட்டுக்கு ஏற்றவாறு ஒலிபெயர்க்கப்பட்டுள்ளன.
