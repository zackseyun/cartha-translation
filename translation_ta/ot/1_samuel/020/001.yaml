source:
  edition: WLC
  text: וַ/יִּבְרַ֣ח דָּוִ֔ד מ/נוות בָּ/רָמָ֑ה וַ/יָּבֹ֞א וַ/יֹּ֣אמֶר לִ/פְנֵ֣י יְהוֹנָתָ֗ן מֶ֤ה עָשִׂ֨יתִי֙ מֶֽה עֲוֺנִ֤/י וּ/מֶֽה חַטָּאתִ/י֙ לִ/פְנֵ֣י אָבִ֔י/ךָ כִּ֥י מְבַקֵּ֖שׁ אֶת נַפְשִֽׁ/י׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/001.yaml
  text: Then David fled from Naioth in Ramah and came before Jonathan and said[a], “What have I done? What is my guilt, and what is my sin before your father, that he is seeking my life?”
translation:
  language: ta
  text: தாவீது ராமாவிலுள்ள நாயோத்திலிருந்து[a] தப்பியோடி, யோனத்தானிடம் வந்து, “நான் என்ன செய்தேன்? என் குற்றம் என்ன? உன் தந்தையின் முன்னிலையில் என் பாவம் என்ன, அவர் என் உயிரைப் பறிக்க முயல்கிறாரே?” என்று கேட்டான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ராமாவில் உள்ள நாயோத்திலிருந்து.” எபிரெயச் சொல், ராமாவுடன் தொடர்புடைய நாயோத் என்ற அறியப்பட்ட இடப்பெயரைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבְרַח
  choice: தப்பியோடி
  rationale: ברח என்பது ஆபத்திலிருந்து தப்பியோடுவதைக் குறிக்கிறது. “தப்பியோடி” என்பது அவசரத்தையும் தப்பிச் செல்லும் கருத்தையும் இயல்பான தமிழில் தருகிறது.
- source_word: מִנָּוֹת בָּרָמָה
  choice: ராமாவிலுள்ள நாயோத்திலிருந்து
  rationale: முந்தைய சூழலின் அடிப்படையில் נָוֹת என்பது இடப்பெயராகப் புரிந்துகொள்ளப்படுகிறது; எனவே “நாயோத்” என்று ஒலிபெயர்க்கப்பட்டுள்ளது. בָּרָמָה என்பதன் இடவுறவை “ராமாவிலுள்ள” எனக் காட்டுகிறது.
- source_word: וַיָּבֹא
  choice: வந்து
  rationale: בוא என்பதன் எளிய கதைநடைப் பொருளைத் தருகிறது; அடுத்ததாக யோனத்தானிடம் சென்றதைத் தமிழில் இயல்பாக இணைக்கிறது.
- source_word: לִפְנֵי יְהוֹנָתָן
  choice: யோனத்தானிடம்
  rationale: லִפְנֵי என்பதன் அடிப்படைப் பொருள் “முன்பாக/முன்னிலையில்” என்றாலும், ஒருவரிடம் வந்து பேசும் இச்சூழலில் “யோனத்தானிடம்” என்பது அதே உறவைக் கொண்ட இயல்பான நவீன தமிழ்.
- source_word: מֶה עָשִׂיתִי
  choice: நான் என்ன செய்தேன்?
  rationale: தாவீதின் தற்காப்பு சார்ந்த நேரடியான வினாவைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: עֲוֺנִי
  choice: என் குற்றம்
  rationale: עָוֹן குற்றச்செயல், அக்கிரமம் அல்லது அதனால் உண்டாகும் குற்றப்பொறுப்பு ஆகியவற்றைக் குறிக்கலாம். இங்கு “குற்றம்” என்பது தாவீதின் தற்காப்பு வினாவுக்கு ஏற்றது; அடுத்துவரும் “பாவம்” என்பதோடும் தேவையின்றி ஒன்றுபடுத்துவதில்லை.
- source_word: חַטָּאתִי
  choice: நான் செய்த பாவம்
  rationale: חַטָּאת என்பதன் ஒழுக்க-சமய வலிமையை “பாவம்” காக்கிறது. தமிழில் யாருக்கு எதிராகப் பாவம் செய்தான் என்ற தொடர்பைத் தெளிவாக்க “நான் செய்த” சேர்க்கப்பட்டுள்ளது.
- source_word: לִפְנֵי אָבִיךָ
  choice: உன் தந்தைக்கு எதிராக
  rationale: சொல்லுக்கு நெருக்கமாக இது “உன் தந்தையின் முன்னிலையில்” என்றாலும், இங்கு அவருக்கு விரோதமாகச் செய்த குற்றம் என்ன என்பதே கருத்து. “எதிராக” என்பது அந்த உறவை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: כִּי
  choice: —ஆரே?
  rationale: כִּי இங்கு முந்தைய வினாக்களுடன் சவுலின் உயிரைப் பறிக்கும் முயற்சியை காரண/விளைவு தொடர்பில் இணைக்கிறது. தமிழின் “முயல்கிறாரே?” என்ற முடிவு, “அப்படியிருக்க அவர் ஏன் இவ்வாறு செய்கிறார்?” என்ற வினாவுணர்வை இயல்பாகக் கொண்டுவருகிறது.
- source_word: מְבַקֵּשׁ אֶת־נַפְשִׁי
  choice: என் உயிரைப் பறிக்க முயல்கிறார்
  rationale: இந்த எபிரெய சொற்றொடர் ஒருவரைக் கொல்ல முயல்வதைக் குறிக்கும் மரபுத்தொடர். “உயிரைப் பறிக்க முயல்கிறார்” என்பது “உயிர்” என்ற மூல உருவகத்தைக் காத்தபடி நவீன தமிழில் தெளிவாக உள்ளது.
