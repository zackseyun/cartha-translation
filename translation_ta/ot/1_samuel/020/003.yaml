base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/003.yaml
  text: But David swore again and said, “Your father certainly knows that I have found favor in your eyes, and he has said, ‘Jonathan must not know this, lest he be grieved.’ But as the LORD lives, and as your soul lives, there is only a step between me and death.”
translation:
  language: ta
  text: 'ஆனால் தாவீது மீண்டும் சத்தியம் செய்து சொன்னான்: “நான் உன் பார்வையில் தயவைப் பெற்றிருக்கிறேன் என்பதை உன் தந்தை நன்றாகவே அறிவார். அதனால் அவர், ‘யோனத்தான் இதை அறிந்துகொள்ளக் கூடாது; அவன் வருந்தாதபடி’ என்று சொல்லியிருக்கிறார். ஆனால் ஆண்டவர் வாழ்கிறபடியும், நீ வாழ்கிறபடியும், எனக்கும் சாவுக்கும் இடையில் ஒரே ஓர் அடிதான் இருக்கிறது.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יָדֹעַ יָדַע
  choice: நன்றாகத் தெரியும்
  rationale: எபிரெய இரட்டிப்பு வினைச்சொல் தரும் உறுதியான வலியுறுத்தலை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: מָצָאתִי חֵן בְּעֵינֶיךָ
  choice: நான் உன் தயவைப் பெற்றிருக்கிறேன்
  rationale: ‘உன் கண்களில் தயவு கண்டேன்’ என்ற எபிரெய மரபுத்தொடரின் பொருளைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: אַל יֵדַע זֹאת יְהוֹנָתָן
  choice: இதை யோனத்தான் அறிந்துகொள்ளக் கூடாது
  rationale: தடைப் பொருளுடைய எபிரெய வடிவத்தின் வலிமையைப் பாதுகாக்கிறது; வெறும் வேண்டுகோளாக மெலிதாக்கவில்லை.
- source_word: כְפֶשַׂע
  choice: ஒரே ஓர் அடி
  rationale: மரணத்திற்கு மிக அருகில் இருப்பதைச் சுட்டும் மூல உருவகத்தைப் பாதுகாக்கிறது.
- source_word: יְהוָה
  choice: ஆண்டவர்
  rationale: தெய்வீகப் பெயரைக் குறிக்கும் மரியாதைமிக்க, பரவலாகப் புரிந்துகொள்ளப்படும் தமிழ் வழக்கை பயன்படுத்துகிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரின் மொழிபெயர்ப்பு
  choice: ஆண்டவர்
  alternative: யெகோவா / யாவே
  rationale: மூலத்தில் தனிப்பெயர் இருப்பதை உணர்ந்தபோதும், வாசிப்பில் இயல்பானதும் மரியாதைமிக்கதுமான பாரம்பரிய பிரதிநிதித்துவத்தைத் தேர்ந்தெடுக்கிறது; குறிப்பிட்ட உச்சரிப்பைத் தீர்மானித்து திணிக்கவில்லை.
- issue: உயிரைக் கொண்டு செய்யப்படும் ஆணையின் வடிவம்
  choice: ஆண்டவர் உயிரோடிருப்பது உறுதி, நீ உயிரோடிருப்பதும் உறுதி
  alternative: ஆண்டவர் வாழ்கிறபடியும் உன் ஆத்துமா வாழ்கிறபடியும்
  rationale: எபிரெய ஆணையின் இரு உறுப்புகளையும் காக்கிறது; ‘נפשׁ’ என்பதை இங்கு தனிப் பொருளான ‘ஆத்துமா’ எனக் கோட்பாட்டாக்காமல், உயிருடன் இருக்கும் நபரைக் குறிக்கும் சூழல் பொருளில் தருகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், உரையாடலுக்கேற்ற தெளிவும் வேதாகமச் சூழலுக்கேற்ற கண்ணியமும் பேணப்பட்டுள்ளன. எபிரெய வலியுறுத்தலும் ‘ஒரே ஓர் அடி’ என்ற மரண நெருக்க உருவகமும் காக்கப்பட்டுள்ளன.
