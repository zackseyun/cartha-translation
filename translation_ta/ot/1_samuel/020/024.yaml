  text: So David hid himself in the field. When the new moon came[a], the king sat down to eat the meal.
translation:
  language: ta
  text: ஆகவே தாவீது வயலில் ஒளிந்துகொண்டான். அமாவாசை நாள் வந்தபோது, அரசன் உணவு உண்பதற்காக அமர்ந்தான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லுக்கு சொல், “உண்பதற்காக அப்பத்தின்மேல் அமர்ந்தான்”; இங்கு “அப்பம்” என்பது முழு உணவைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסָּתֵר
  choice: ஒளிந்துகொண்டான்
  rationale: நிஃபால் வடிவம் இச்சூழலில் தாவீது தன்னை மறைத்துக்கொண்டதைக் குறிக்கிறது; நவீன தமிழில் இயல்பாகவும் செயல் நோக்கத்துடனும் கூறப்படுகிறது.
- source_word: בַּשָּׂדֶה
  choice: வயலில்
  rationale: שָׂדֶה என்பதன் நேரடியான பொருள் ‘வயல்’; எபிரெயிலுள்ள குறிப்புத்தன்மையையும் சூழல் போதுமான அளவு வெளிப்படுத்துகிறது.
- source_word: וַיְהִי הַחֹדֶשׁ
  choice: அமாவாசை நாள் வந்தபோது
  rationale: הַחֹדֶשׁ இங்கு மாதத்தைப் பொதுவாகக் குறிக்காமல், புதிய நிலவு தொடங்கும் நாளையும் அதனுடன் தொடர்புடைய அனுசரிப்பையும் குறிக்கிறது. தமிழ்ச் சூழலில் ‘அமாவாசை நாள்’ என்பது தெளிவான இயல்பான இணை.
- source_word: וַיֵּשֶׁב
  choice: அமர்ந்தான்
  rationale: உணவு உண்ணுவதற்காக அரசன் தன் இடத்தில் அமர்ந்த செயலை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: עַל הַלֶּחֶם
  choice: உணவு
  rationale: சொல்லுக்கு சொல் ‘அப்பத்தின்மேல்’ என்றாலும், எபிரெயில் ‘அப்பம்’ முழு உணவைக் குறிக்கும் ஆகுபெயராக உள்ளது; தமிழில் ‘உணவு’ பொருளைத் தெளிவாகத் தருகிறது.
- source_word: לֶאֱכֹל
  choice: உண்பதற்காக
  rationale: இது நோக்கத்தைக் காட்டும் வினையெச்சம்; அமர்ந்ததன் நோக்கம் உண்பது என்பதைத் தெளிவாகத் தருகிறது.
- source_word: דָּוִד
  choice: தாவீது
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் நிலைபெற்ற பெயர்வடிவம்.
- source_word: הַמֶּלֶךְ
  choice: அரசன்
  rationale: மூலத்தில் சவுலின் பெயருக்குப் பதிலாக திட்டமான பட்டப்பெயர் பயன்படுத்தப்பட்டிருப்பதால் அதையே மொழிபெயர்க்கிறது.
