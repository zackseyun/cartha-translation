base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/042.yaml
  text: Jonathan said to David, “Go in peace, because the two of us have sworn in the name of the LORD, saying, ‘May the LORD be between me and you, and between my offspring and your offspring forever.’”
translation:
  language: ta
  text: யோனத்தான் தாவீதிடம், “சமாதானமாகப் போ. ஏனெனில், ‘எனக்கும் உனக்கும் இடையிலும், என் சந்ததிக்கும் உன் சந்ததிக்கும் இடையிலும் யெகோவா என்றென்றும் இருப்பாராக’ என்று நாமிருவரும் யெகோவாவின் பெயரில் ஆணையிட்டோம்” என்றான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לֵךְ לְשָׁלוֹם
  choice: சமாதானத்துடன் போ
  rationale: எபிரெய வாழ்த்தின் நேரடியான பொருளையும், பிரிவின் சூழலில் இயல்பான தமிழையும் காக்கிறது.
- source_word: אֲשֶׁר
  choice: ஏனெனில்
  rationale: இங்கு முந்தைய கட்டளைக்கான காரணத்தை அறிமுகப்படுத்துவதாகப் புரிந்துகொள்ளப்படுகிறது; மூலத்தின் தொடர்பு இயல்பான தமிழில் வெளிப்படுகிறது.
- source_word: נִשְׁבַּעְנוּ שְׁנֵינוּ אֲנַחְנוּ
  choice: நாமிருவரும் ... ஆணையிட்டிருக்கிறோம்
  rationale: ‘நாங்கள் இருவரும், நாங்களே’ என்ற வலியுறுத்தலை தமிழில் ‘நாமிருவரும்’ எனச் சுருக்கமாகவும் தெளிவாகவும் வெளிப்படுத்துகிறது.
- source_word: בְּשֵׁם יְהוָה
  choice: யெகோவாவின் பெயரில்
  rationale: தெய்வீகப் பெயரை பொதுப்பட்டமான ‘கர்த்தர்’ என மாற்றாமல், தனிப்பெயராக ஒலிபெயர்க்கிறது.
- source_word: זַרְעִי / זַרְעֲךָ
  choice: என் சந்ததி / உன் சந்ததி
  rationale: זֶרַע என்பதன் கூட்டு வழித்தோன்றல் கருத்தை ஒருமை வடிவில் காக்கும் இயல்பான தமிழ்.
- source_word: עַד עוֹלָם
  choice: என்றென்றும்
  rationale: நீடித்த, காலவரையற்ற உடன்படிக்கை உறவைத் தெரிவிக்கும் வழக்கமான தமிழ் இணை.
theological_decisions:
- issue: יְהוָה יִהְיֶה என்பதன் வினைநிலை
  choice: யெகோவா ... இருப்பாராக
  alternative: யெகோவா ... இருப்பார்
  rationale: உடன்படிக்கை ஆணையின் மேற்கோளுக்குள் இருப்பதால், இது வெறும் எதிர்காலக் கூற்றாக மட்டுமல்லாமல் வேண்டுதல் அல்லது உறுதிமொழிசார் வாழ்த்தாகவும் இயங்கலாம். ‘இருப்பாராக’ அந்தச் சூழல்சார் நுணுக்கத்தை இயல்பாக வெளிப்படுத்துகிறது.
- issue: யெகோவா ‘இடையில்’ இருப்பதன் பொருள்
  choice: மூல உருவகத்தை விளக்கமின்றி வைத்தல்
  alternative: யெகோவா சாட்சியாக இருப்பாராக / கண்காணிப்பாராக
  rationale: ‘இடையில் இருப்பது’ சாட்சி, உறவின் உத்தரவாதம், அல்லது உடன்படிக்கையின் காவல் ஆகிய பல நுணுக்கங்களைத் தாங்கலாம்; ஒன்றை மட்டும் தேர்ந்து விளக்குவது மூலத்தின் திறந்த தன்மையைச் சுருக்கும்.
translation_notes:
  register: நவீன நிலையான தமிழில், உரையாடலுக்கேற்ற எளிமையுடனும் வேதாகமச் சூழலுக்குரிய கண்ணியத்துடனும் வடிவமைக்கப்பட்டது. மேற்கோளுக்குள் உள்ள உடன்படிக்கைச் சொற்களின் சமச்சீரான அமைப்பு பாதுகாக்கப்பட்டுள்ளது.
