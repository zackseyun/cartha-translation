base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/034.yaml
  text: Then Jonathan rose from the table in fierce anger[a], and he ate no food on the second day of the month, because he was grieved over David, because his father had humiliated him.
translation:
  language: ta
  text: யோனத்தான் கடும் கோபத்தில் மேசையை விட்டு எழுந்தான். மாதத்தின் இரண்டாம் நாளில்[a] அவன் உணவு உண்ணவில்லை. ஏனெனில், தாவீதைக் குறித்து அவன் மனம் வருந்தினான்; அவனுடைய தந்தை அவனை அவமானப்படுத்தியிருந்தான்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அமாவாசையின் இரண்டாம் நாளில்.” எபிரெயச் சொல் חֹדֶשׁ என்பதற்கு “மாதம்” என்றும் “அமாவாசை” என்றும் பொருள் உண்டு; இங்கு அரசவையின் அமாவாசை விருந்து பின்னணியாக உள்ளது.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில் “அவனை” என்பது தாவீதையோ யோனத்தானையோ குறிக்கலாம்.
    reason: ambiguity_preservation
lexical_decisions:
- source_word: וַיָּקָם
  choice: எழுந்தான்
  rationale: קום என்பதன் தொடர்கதை வடிவம்; உணவு மேசையிலிருந்து எழுவதை இயல்பாகக் குறிக்கிறது.
- source_word: מֵעִם הַשֻּׁלְחָן
  choice: மேசையைவிட்டு
  rationale: மேசையருகிலிருந்த இடத்திலிருந்து விலகிச் சென்றதைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: בָּחֳרִי אָף
  choice: கடும் கோபத்துடன்
  rationale: சொற்றொடரின் ‘கோபத்தின் எரிச்சல்/சூடு’ என்ற தீவிரத்தை நவீனத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וְלֹא אָכַל ... לֶחֶם
  choice: உணவு உண்ணவில்லை
  rationale: לֶחֶם இங்கு அப்பத்தை மட்டும் அல்லாமல் உணவைக் குறிக்கும் வழக்குச் சொல்லாக இருப்பதால், விருந்தில் எதையும் உண்ணாத பொருளைத் தெளிவாக்குகிறது.
- source_word: בְּיוֹם הַחֹדֶשׁ הַשֵּׁנִי
  choice: மாதத்தின் இரண்டாம் நாளில்
  rationale: חֹדֶשׁ என்பதன் நேரடியான ‘மாதம்’ என்ற பொருளைப் பிரதான உரையில் வைத்துக் கொண்டு, ‘அமாவாசை விழா’ என்ற சூழல் சார்ந்த மாற்றை அடிக்குறிப்பில் பாதுகாக்கிறது.
- source_word: נֶעְצַב
  choice: மனம் வருந்தினான்
  rationale: עצב என்பதன் நிஃபால் வடிவம் உள்ளார்ந்த துயரத்தையும் வேதனையையும் குறிக்கிறது; தமிழில் இயல்பான உணர்ச்சி வெளிப்பாடு.
- source_word: אֶל דָּוִד
  choice: தாவீதைப் பற்றி
  rationale: யோனத்தானின் வருத்தம் தாவீதைக் குறித்தது என்பதைத் தெளிவாகச் சொல்கிறது; காரணம் அல்லது தொடர்பு என்ற எபிரெய ambiguity-ஐ மிகையாகத் தீர்மானிக்கவில்லை.
- source_word: הִכְלִמוֹ
  choice: அவமானப்படுத்தியிருந்தான்
  rationale: כלם என்பதன் ஹிஃபில் வடிவத்தில் உள்ள வெட்கப்படுத்துதல் அல்லது இழிவுபடுத்துதல் என்ற வலிமையைத் தக்கவைக்கிறது.
- source_word: אָבִיו
  choice: அவனுடைய தந்தை
  rationale: எபிரெய பிரதிப்பெயர் இலக்கணப்படி யோனத்தானையே சுட்டுகிறது; தொடர்ந்து வரும் பொருள் தாவீது என்பதைத் தெளிவுபடுத்த அவரது பெயர் பயன்படுத்தப்பட்டுள்ளது.
