base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/014.yaml
  text: And if I am still alive[a], will you not show me Yahweh’s covenant faithfulness, so that I may not die?
translation:
  language: ta
  text: நான் இன்னும் உயிரோடிருந்தால், நான் சாகாதபடி யாவேயின் உடன்படிக்கைப் பற்றுறுதியை[a] எனக்குக் காட்டமாட்டாயா?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யாவேயின் மாறாத அன்பை.” எபிரெயச் சொற்றொடர், யாவேவுக்குரிய பற்றுறுதி என்றும், யாவேயின் சொந்த நிலையான அன்பு என்றும் புரிந்துகொள்ளப்படலாம்.
    reason: חֶסֶד יְהוָה என்ற எபிரெயச் சொற்றொடரின் மாற்றுப் பொருளைத் தக்கவைக்கிறது; யோனத்தானைத் தவறாக மூன்றாம் நபராகக் குறிப்பிடுவதை நீக்குகிறது.
lexical_decisions:
- source_word: וְלֹא אִם
  choice: நான் … இருந்தால், … காட்டமாட்டாயா?
  rationale: இங்கு சொற்சொல்லாக வரும் மறுப்பும் நிபந்தனையும், யோனத்தானின் வேண்டுகோளில் எதிர்மறைக் கேள்வியாக இயல்பாகச் செயல்படுகின்றன. தமிழில் நிபந்தனையையும் வேண்டுகோளையும் தெளிவாக இணைக்க இவ்வமைப்பு பயன்படுத்தப்பட்டது.
- source_word: עוֹדֶנִּי חָי
  choice: நான் இன்னும் உயிரோடிருந்தால்
  rationale: עוֹד என்பதன் தொடர்நிலைப் பொருளையும் חָי என்பதன் ‘உயிரோடு’ என்ற பொருளையும் இயல்பான நவீனத் தமிழில் காக்கிறது.
- source_word: תַעֲשֶׂה עִמָּדִי
  choice: எனக்குக் காட்டமாட்டாயா?
  rationale: חֶסֶד உடன் வரும் עשה עם என்ற எபிரெய மரபுத்தொடர், சொற்சொல்லான ‘என்னுடன் செய்வாயா’ என்பதற்குப் பதிலாக தமிழில் ‘எனக்குக் காட்டு’ என்று இயல்பாக வெளிப்படுகிறது.
- source_word: חֶסֶד
  choice: உடன்படிக்கைப் பற்றுறுதி
  rationale: இச்சூழலில் இச்சொல் சாதாரண இரக்கத்தைவிட உறவு மற்றும் உடன்படிக்கைக்குரிய நிலையான விசுவாசத்தையும் பற்றையும் குறிக்கிறது. ‘பற்றுறுதி’ அதன் விசுவாசமான, செயலில் வெளிப்படும் தன்மையை எடுத்துரைக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய மூலத்தில் வரும் இறைத் திருப்பெயரை ஒரு பட்டமாக மாற்றாமல், நவீனத் தமிழுக்கு ஏற்ற ஒலிபெயர்ப்பில் தருகிறது.
- source_word: וְלֹא אָמוּת
  choice: நான் சாகாதபடி
  rationale: இறக்காமல் இருப்பதே கோரிக்கையின் நோக்கம் அல்லது விளைவு என்பதை இயல்பான தமிழில் தெரிவிக்கிறது; எபிரெய இணைப்பின் பொருள் உறவை மிகையாகத் தீர்மானிப்பதில்லை.
theological_decisions:
- issue: יְהוָה என்ற இறைத் திருப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: ஆண்டவர்; யெகோவா
  rationale: மூலத்தில் தனிப்பட்ட இறைத் திருப்பெயர் நேரடியாக உள்ளது. அதை ஒரு பட்டத்தால் மாற்றாமல், YHWH என்பதற்கான பொதுவான ‘Yahweh’ உச்சரிப்பைத் தமிழில் ‘யாவே’ என ஒலிபெயர்க்கிறது.
- issue: חֶסֶד יְהוָה என்பதன் உறவு
  choice: யாவேயின் உடன்படிக்கைப் பற்றுறுதி
  alternative: யாவேயின் மாறாத அன்பு; யாவேவுக்குரிய பற்றுறுதி
  rationale: எபிரெயச் சேர்க்கை யாவேயின் சொந்த நிலையான அன்பைக் குறிக்கலாம்; அல்லது யாவேயின் முன்னிலையில், அவருக்குரிய வகையில் காட்டப்படும் உடன்படிக்கைப் பற்றுறுதியைக் குறிக்கலாம். முதன்மை உரை மூலத்தின் சுருக்கமான உரிமைத் தொடர்பைக் காக்கிறது; அடிக்குறிப்பு மாற்றுப் புரிதலை வெளிப்படுத்துகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையும் வாசிப்புத் தெளிவும் உள்ள நடையில் வடிவமைக்கப்பட்டது. ‘சாகாதபடி’ என்பது உரையாடலுக்கேற்ற இயல்பான சொல்; ‘உடன்படிக்கைப் பற்றுறுதி’ என்பது சூழலின் உறவுசார் மற்றும் உடன்படிக்கைச் செறிவைத் தக்கவைக்கிறது. எபிரெய வசனத்தின் சற்றுச் சிக்கலான நிபந்தனை–வேண்டுகோள் அமைப்பு, பொருள் தெளிவுக்காக ஒரே இயல்பான எதிர்மறைக் கேள்வியாக வழங்கப்பட்டுள்ளது.
