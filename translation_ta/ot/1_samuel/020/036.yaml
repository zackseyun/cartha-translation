base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/036.yaml
  text: He said to his young man[a], “Run, please, find the arrows that I am shooting.” The young man ran, and he shot the arrow beyond him.
translation:
  language: ta
  text: அவன் தன் இளைஞனிடம், “ஓடு; நான் எய்கிற அம்புகளைத் தயவுசெய்து கண்டுபிடி” என்றான். அந்த இளைஞன் ஓடினான்; யோனத்தான் அந்த இளைஞனுக்கு அப்பால் அம்பை எய்தான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது “அந்த இளைஞனைக் கடந்து செல்லும்படி அம்பை எய்தான்.”
    reason: לְהַעֲבִרוֹ என்பதிலுள்ள அம்பை இளைஞனைக் கடந்து செல்லச் செய்தல் என்ற இயக்க நுணுக்கத்தை இன்னும் வெளிப்படையாக மொழிபெயர்க்கும் மாற்று.
lexical_decisions:
- source_word: לְנַעֲרוֹ / הַנַּעַר
  choice: தன் இளைஞன் / அந்த இளைஞன்
  rationale: נַעַר என்பது இளைஞன், உதவியாளர் அல்லது பணியாளர் எனப் பொருள்படலாம். இங்கு யோனத்தானுடன் சென்ற இளம் உதவியாளரைக் குறிக்கிறது; பணியாளர் என்ற நிலையை அளவுக்கு மீறிக் குறிப்பாக்காமல் வயது சார்ந்த நுணுக்கத்தை ‘இளைஞன்’ காக்கிறது.
- source_word: רוּץ
  choice: ஓடு
  rationale: கட்டளை வடிவிலுள்ள רוץ கூறும் உடல்சார்ந்த செயலை நேரடியாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: מְצָא נָא
  choice: தயவுசெய்து கண்டுபிடி
  rationale: מְצָא என்பதன் அடிப்படைப் பொருள் ‘கண்டுபிடி’; נָא கட்டளையை மென்மையாக்கும் வேண்டுகோள் நுணுக்கத்தைச் சேர்க்கிறது.
- source_word: הַחִצִּים
  choice: அம்புகள்
  rationale: எபிரெய மூலத்தில் உள்ள பன்மையை நேரடியாகக் காக்கிறது.
- source_word: אֲשֶׁר אָנֹכִי מוֹרֶה
  choice: நான் எய்கிற
  rationale: ירה வினையின் நிகழ்காலப் பங்கேற்பு வடிவம் இச்சூழலில் நடந்து கொண்டிருக்கும் அல்லது உடனடியாக நடைபெறவிருக்கும் செயலைக் குறிக்கிறது; தமிழ் நிகழ்கால உறவெச்சம் இரு நுணுக்கங்களையும் இயல்பாகத் தாங்குகிறது.
- source_word: וְהוּא יָרָה הַחֵצִי
  choice: அவன் ... அம்பை எய்தான்
  rationale: மூலத்தின் ஒருமைச் சுட்டப்பட்ட பெயர்ச்சொல்லை ‘அம்பை’ என்று காக்கிறது. முந்தைய பன்மைக்குப் பின் வரும் இந்த ஒருமை, எய்யப்பட்ட குறிப்பிட்ட அம்பைக் குறிக்கலாம்.
- source_word: לְהַעֲבִרוֹ
  choice: அந்த இளைஞனுக்கு அப்பால்
  rationale: עבר என்பதன் ஹிஃபில் வடிவமும் ஆண்பால் ஒருமை பின்னொட்டும், அம்பு இளைஞனைக் கடந்து செல்லச் செய்வதைச் சுட்டுகின்றன. ‘அப்பால்’ கதைப்போக்கில் முக்கியமான திசைச் சைகையைத் தெளிவாகத் தருகிறது.
