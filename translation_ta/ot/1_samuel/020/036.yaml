translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையான, கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. நָא என்பதன் மென்மையாக்கும் வலிமையை ‘தயவுசெய்து’ காக்கிறது. இரண்டாம் வாக்கியத்தின் இறுதி ‘அவன்’ யோனத்தானைக் குறிக்கிறது; குழப்பத்தைக் குறைக்க ‘அந்த இளைஞனுக்கு அப்பால்’ என்று பெயர்ச்சொல் மீண்டும் தரப்பட்டுள்ளது.
