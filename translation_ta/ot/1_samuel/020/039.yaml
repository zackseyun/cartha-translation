base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/039.yaml
  text: But the boy did not know anything[a]; only Jonathan and David knew the matter.
translation:
  language: ta
  text: ஆனால் அந்தச் சிறுவன் எதையும் அறியவில்லை; யோனத்தானும் தாவீதும் மட்டுமே அந்த விஷயத்தை[a] அறிந்திருந்தனர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அந்தக் காரியத்தை’ அல்லது ‘அந்த ஏற்பாட்டை.’ எபிரெயச் சொல்லான דָּבָר, பேசப்படும் ஒரு விஷயம், காரியம் அல்லது விவகாரத்தைக் குறிக்கக்கூடிய பரந்த பொருளுடையது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַנַּעַר
  choice: ஆனால் அந்தச் சிறுவன்
  rationale: נַעַר என்பது சூழலின்படி சிறுவன், இளைஞன் அல்லது பணியாள் எனப் பொருள்படும். இங்கு யோனத்தானுடன் வந்த இளம் உதவியாளனைக் குறிப்பதால் ‘சிறுவன்’ இயல்பானது; தொடர்ந்து வரும் அறிவு-அறியாமை வேறுபாட்டை வெளிப்படுத்த וְ என்பது ‘ஆனால்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: לֹא יָדַע מְאוּמָה
  choice: எதையும் அறியவில்லை
  rationale: எதிர்மறை வாக்கியத்தில் מְאוּמָה என்பது ‘எதையும்’ என்ற பொருளைத் தருகிறது; יָדַע என்பதன் நேரடியான அறிவுசார் பொருளை ‘அறியவில்லை’ காக்கிறது.
- source_word: אַךְ
  choice: மட்டுமே
  rationale: இங்கு אַךְ வரம்புறுத்தும் பொருளில் வந்து, சிறுவனின் அறியாமைக்கு மாறாக யோனத்தானும் தாவீதும் மட்டும் அறிந்திருந்ததைச் சுட்டுகிறது.
- source_word: יְהוֹנָתָן וְדָוִד
  choice: யோனத்தானும் தாவீதும்
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் நிலைபெற்ற பெயர் வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன; இணைப்பும் ‘-உம் ... -உம்’ அமைப்பால் இயல்பாகத் தரப்பட்டுள்ளது.
- source_word: יָדְעוּ
  choice: அறிந்திருந்தனர்
  rationale: முந்தைய יָדַע உடனான சொற்பொருள் தொடர்பை ‘அறி’ என்ற ஒரே வேர்ச்சொல் மூலம் காக்கிறது; நிகழ்ச்சியின் பின்னணியில் ஏற்கெனவே நிலவிய அறிவை ‘அறிந்திருந்தனர்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: אֶת־הַדָּבָר
  choice: அந்த விஷயத்தை
  rationale: דָּבָר என்பது சொல், காரியம், விஷயம், விவகாரம் எனப் பரந்த பொருள் கொண்டது. இங்கு இருவருக்கு மட்டும் தெரிந்திருந்த மறைமுக ஏற்பாடு அல்லது நடப்பைக் குறிக்கிறது; அதை மிகையாக விளக்காமல் ‘அந்த விஷயம்’ என வழங்கப்பட்டுள்ளது.
