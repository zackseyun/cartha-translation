  source_fidelity: 'மூல எபிரெய வாக்கியத்தின் எதிர்மறை–நேர்மறை அறிவு முரண்பாடு துல்லியமாகக் காக்கப்பட்டுள்ளது: சிறுவன் எதையும் அறியவில்லை; யோனத்தானும் தாவீதும் மட்டுமே அறிந்தனர். אַךְ என்பதன் வரம்புறுத்தும் வலிமை ‘மட்டுமே’ மூலம் பொருத்தமாகத் தரப்பட்டுள்ளது. הַדָּבָר என்பதற்கான ‘அந்த விஷயம்’ சூழலுக்கு ஏற்ற பரந்த, தீர்மானிக்கப்படாத சொற்றேர்வாகும்.'
  naturalness: ‘ஆனால் அந்தச் சிறுவன் எதையும் அறியவில்லை; யோனத்தானும் தாவீதும் மட்டுமே அந்த விஷயத்தை அறிந்திருந்தனர்’ என்பது நவீன நிலையான தமிழில் இயல்பாகவும் கண்ணியமான வேதாகம நடையுடனும் உள்ளது. ‘அறியவில்லை / அறிந்திருந்தனர்’ என்ற அமைப்பு நிகழ்ச்சியின் பின்னணியில் அவர்களுக்கிருந்த அறிவைத் தெளிவாக வெளிப்படுத்துகிறது.
