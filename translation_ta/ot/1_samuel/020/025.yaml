  register: நவீனத் தரத் தமிழில் எளிமையான, கண்ணியமான வரலாற்று நடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய தொடர்வாக்கியங்கள் தமிழில் வாசிக்க இயலுமாறு பிரிக்கப்பட்டுள்ளன; யோனத்தான் எழுந்ததற்கான விளக்கம் மூலத்தில் இல்லாததால் சேர்க்கப்படவில்லை.
