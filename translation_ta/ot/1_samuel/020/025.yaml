source:
  edition: WLC
  text: וַ/יֵּ֣שֶׁב הַ֠/מֶּלֶךְ עַל מ֨וֹשָׁב֜/וֹ כְּ/פַ֣עַם בְּ/פַ֗עַם אֶל מוֹשַׁב֙ הַ/קִּ֔יר וַ/יָּ֨קָם֙ יְה֣וֹנָתָ֔ן וַ/יֵּ֥שֶׁב אַבְנֵ֖ר מִ/צַּ֣ד שָׁא֑וּל וַ/יִּפָּקֵ֖ד מְק֥וֹם דָּוִֽד־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/025.yaml
  text: The king sat in his seat[a], as at other times, by the wall; and Jonathan rose, and Abner sat beside Saul, but David’s place was empty.
translation:
  language: ta
  text: அரசன் வழக்கம்போல் சுவரோரத்தில் இருந்த தன் இருக்கையில் அமர்ந்தான். யோனத்தான் எழுந்தான்; அப்னேர் சவுலின் அருகில் அமர்ந்தான். ஆனால் தாவீதின் இடம் காலியாக இருந்தது.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தாவீதின் இடம் இல்லாததாகக் காணப்பட்டது”; அதாவது, உணவின்போது அவருக்கென ஒதுக்கப்பட்ட இடத்தில் அவர் இல்லை.
    reason: וַיִּפָּקֵד என்பதன் ‘காணாமற்போதல் அல்லது இல்லாமை கவனிக்கப்படுதல்’ என்ற நிழற்பொருளைச் சுட்டும் சொற்பொருள் மாற்று.
lexical_decisions:
- source_word: הַמֶּלֶךְ
  choice: அரசன்
  rationale: எபிரெய உரையில் தனிப்பெயருக்குப் பதிலாக வரும் வரையறுக்கப்பட்ட பட்டத்தை அப்படியே காக்கிறது; சூழலில் இது சவுலைக் குறிக்கிறது.
- source_word: מוֹשָׁבוֹ
  choice: தன் இருக்கையில்
  rationale: விருந்துண்ணும் சூழலில் இது குடியிருப்பை அல்ல, அமரும் இருக்கையைக் குறிக்கிறது.
- source_word: כְּפַעַם בְּפַעַם
  choice: வழக்கம்போல்
  rationale: முந்தைய சந்தர்ப்பங்களில் செய்ததுபோல என்ற தொடர்ச்சியான வழக்கத்தை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: אֶל מוֹשַׁב הַקִּיר
  choice: சுவரோரத்தில் இருந்த தன் இருக்கையில்
  rationale: சுவருடன் தொடர்புடைய அரசனின் இருக்கை இருப்பிடத்தைத் தெளிவாகவும் இயல்பாகவும் காட்டுகிறது; אֶל இங்கு இடத்தைக் குறிக்கும் வகையில் புரிந்துகொள்ளப்படுகிறது.
- source_word: וַיָּקָם
  choice: எழுந்தான்
  rationale: קום என்பதன் எளிய தொடர்கதை வடிவத்தை நேரடியாக வழங்குகிறது; அவர் ஏன் எழுந்தார் என்பதை உரை விளக்காததால் கூடுதல் பொருள் சேர்க்கப்படவில்லை.
- source_word: וַיֵּשֶׁב אַבְנֵר מִצַּד שָׁאוּל
  choice: அப்னேர் சவுலின் அருகில் அமர்ந்தான்
  rationale: מִצַּד குறிக்கும் பக்கத்து இட உறவை இயல்பான தமிழில் காக்கிறது.
- source_word: וַיִּפָּקֵד מְקוֹם דָּוִד
  choice: தாவீதின் இடம் காலியாக இருந்தது
  rationale: எதிர்பார்க்கப்பட்ட தாவீது அங்கு இல்லாததால் அவருக்குரிய இடம் ஆளின்றி இருந்தது என்பதே விருந்து சூழலில் இயல்பான பொருள்; פקד வடிவத்தின் ‘காணாமற்போதல்/இல்லாமை கவனிக்கப்படுதல்’ நிழற்பொருள் அடிக்குறிப்பில் காக்கப்படுகிறது.
