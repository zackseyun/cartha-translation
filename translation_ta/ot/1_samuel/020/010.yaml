  text: Then David said to Jonathan[a], “Who will tell me? Or what if your father answers you harshly?”
translation:
  language: ta
  text: அப்போது தாவீது யோனத்தானிடம், “எனக்கு யார் தெரிவிப்பார்? அல்லது, உன் தந்தை உன்னிடம் கடுமையாகப் பதிலளித்தால் என்ன ஆகும்?[a]” என்று சொன்னான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரெயத்தில் சொல்லுக்கு சொல்: “எனக்கு யார் தெரிவிப்பார்? அல்லது உன் தந்தை உனக்கு என்ன பதிலளிப்பார்—கடுமையாக?” மூல வாக்கியம் சுருக்கமாக இருப்பதால், அதன் பொருள் மொழிபெயர்ப்பில் வெளிப்படையாகத் தரப்பட்டுள்ளது.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: அப்போது ... கேட்டான்
  rationale: வாவ் தொடர்வினை கதையை அடுத்த நிகழ்வுக்கு நகர்த்துகிறது. வசனம் கேள்விகளைக் கொண்டிருப்பதால், தமிழில் ‘கேட்டான்’ என்பது இயல்பான உரையாடல் அறிமுகம்.
- source_word: דָּוִד אֶל־יְהוֹנָתָן
  choice: தாவீது யோனத்தானிடம்
  rationale: பெயர்களின் வழக்கமான தமிழ் வடிவங்களும், பேசப்படுபவரைக் குறிக்கும் இயல்பான ‘-இடம்’ வேற்றுமை வடிவமும் பயன்படுத்தப்பட்டுள்ளன.
- source_word: מִי יַגִּיד לִי
  choice: எனக்கு யார் தெரிவிப்பார்?
  rationale: נגד என்பதன் ஹிஃபில் வடிவம் ‘தெரிவி/சொல்’ என்று பொருள்படும். ‘தெரிவிப்பார்’ செய்தியை அறிவிப்பதற்கான பொருளைத் தெளிவாகக் காட்டுகிறது.
- source_word: אוֹ
  choice: அல்லது
  rationale: மூலத்தின் வெளிப்படையான பிரிநிலை இணைப்பை நீக்காமல் பாதுகாக்கிறது.
- source_word: מַה יַּעַנְךָ אָבִיךָ קָשָׁה
  choice: உன் தந்தை உன்னிடம் கடுமையாகப் பதிலளித்தால் என்ன செய்வது?
  rationale: எபிரெயச் சொற்றொடர் சுருக்கமாக உள்ளது. ‘கடுமையாக’ என்பது קָשָׁה-வின் வினையடைப் பொருளைக் காட்டுகிறது; ‘என்ன செய்வது?’ என்பது מַה-வை இயல்பான தமிழில் வெளிப்படுத்துகிறது, ஆனால் அதன் சுருக்கத் தன்மை அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
