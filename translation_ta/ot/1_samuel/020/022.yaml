id: 1SA.20.22
reference: 1 Samuel 20:22
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וְ/אִם כֹּ֤ה אֹמַר֙ לָ/עֶ֔לֶם הִנֵּ֥ה הַ/חִצִּ֖ים מִמְּ/ךָ֣ וָ/הָ֑לְאָה לֵ֕ךְ כִּ֥י שִֽׁלַּחֲ/ךָ֖ יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/022.yaml
  text: But if I say this to the young man[a], ‘Look, the arrows are beyond you,’ then go, for Yahweh has sent you away.
translation:
  language: ta
  text: ஆனால் நான் அந்த இளைஞனிடம், “இதோ, அம்புகள் உன்னைக் கடந்து அப்பால் இருக்கின்றன” என்று சொன்னால், நீ போ; ஏனெனில் யாவே உன்னை அனுப்பிவிட்டார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאִם
  choice: ஆனால் ... சொன்னால்
  rationale: முந்தைய அடையாளத்திற்கு மாறான நிபந்தனையை அறிமுகப்படுத்துவதால், எதிர்மறைத் தொடர்பையும் நிபந்தனையையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: לָעֶלֶם
  choice: அந்த இளைஞனிடம்
  rationale: עֶלֶם என்பது இளைஞன் அல்லது வாலிபனைக் குறிக்கிறது; ‘வேலைக்காரன்’ எனப் பணியைச் சேர்க்காமல் மூலச்சொல்லின் பொருளைத் தருகிறது.
- source_word: הִנֵּה הַחִצִּים
  choice: இதோ, அம்புகள்
  rationale: הִנֵּה கவனத்தை ஈர்க்கும் சுட்டிடைச்சொல்; ‘இதோ’ கண்ணியமான நவீனத் தமிழில் அதன் சுட்டும் வலிமையைப் பாதுகாக்கிறது.
- source_word: מִמְּךָ וָהָלְאָה
  choice: உனக்கு அப்பால் இருக்கின்றன
  rationale: அம்புகள் இளைஞனைக் கடந்து இன்னும் தொலைவில் இருப்பதைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: לֵךְ
  choice: நீ போய்விடு
  rationale: கட்டளை வடிவத்தையும் இச்சூழலில் தாவீது அங்கிருந்து புறப்பட வேண்டிய கருத்தையும் தெளிவாகத் தருகிறது.
- source_word: כִּי שִׁלַּחֲךָ
  choice: ஏனெனில் ... உன்னை அனுப்பிவிட்டார்
  rationale: כִּי காரணத்தை அறிமுகப்படுத்துகிறது; piel வடிவிலுள்ள שׁלח இச்சூழலில் அனுப்பிவிடுதல் என்ற பொருளைத் தருகிறது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: திருநாமத்தை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் பரவலாக அறியப்பட்ட தனிப்பெயர் வடிவில் தருகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைத் திருநாமத்தின் மொழிபெயர்ப்பு
  choice: யெகோவா
  alternative: யாவே
  rationale: மூலத்தில் திருநாமம் நேரடியாக உள்ளது; ஆகவே ‘கர்த்தர்’ போன்ற பட்டப்பெயரைப் பதிலிடாமல் தனிப்பெயராகவே தரப்படுகிறது. ‘யெகோவா’ நவீனத் தமிழ் வேதாகமப் பயன்பாட்டில் பரவலாக அறியப்படும் வடிவம்.
- issue: யெகோவா அனுப்பியுள்ளார் என்பதன் இறையியல் வலிமை
  choice: யெகோவா உன்னை அனுப்பிவிட்டார்
  alternative: யெகோவா நீ செல்ல அனுமதித்தார்
  rationale: மூலம் அனுமதித்தல் என்று மென்மைப்படுத்தாமல், கடவுளே அனுப்பியவர் என்ற நேரடியான கூற்றைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், உரையாடலுக்கேற்ற இயல்பும் வேதாகம உரைக்கேற்ற கண்ணியமும் பேணப்பட்டுள்ளன. தேவையற்ற விளக்கச் சேர்க்கைகள் தவிர்க்கப்பட்டன; இவ்வசனத்திற்கு தனி அடிக்குறிப்பு அவசியமில்லை.
