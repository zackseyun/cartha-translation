  text: 'யோனத்தான் சவுலுக்குப் பதிலளித்தான்: “பெத்லெகேமுக்குப் போகத் தாவீது என்னிடம் மிகவும் வற்புறுத்தி அனுமதி கேட்டான்.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பெத்லெகேமுக்குப் போகத் தாவீது என்னிடம் திரும்பத் திரும்ப அனுமதி கேட்டான்.” எபிரெய மொழியில் அதே வேரைச் சேர்ந்த ஒரு முற்றாவினை வடிவம் முற்றுவினையுடன் சேர்ந்து பயன்படுத்தப்பட்டிருப்பது வலியுறுத்தலைக் காட்டுகிறது.
