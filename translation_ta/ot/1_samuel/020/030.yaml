base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/030.yaml
  text: Then Saul’s anger burned against Jonathan[a], and he said to him, “You son of a perverse, rebellious woman! Do I not know that you have chosen the son of Jesse[c][b], to your own shame and to the shame of your mother’s nakedness?”
translation:
  language: ta
  text: அப்போது சவுலுக்கு யோனத்தான்மேல் கோபம் மூண்டது. அவன் யோனத்தானிடம், “நெறிகெட்ட, கலகக்காரப் பெண்ணின் மகனே![a] நீ ஈசாயின் மகனைத் தேர்ந்தெடுக்கிறாய்[b] என்பது எனக்குத் தெரியாதா? இது உனக்கும் உன் தாயின் நிர்வாணத்திற்கும் அவமானமாக இருக்கிறது.[c]” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “நெறிகேட்டிற்கும் கலகத்திற்கும் பிறந்தவனே!” என்றும் மொழிபெயர்க்கலாம். இங்குள்ள எபிரெய வசைமொழி பொருள் தீர்மானிக்கக் கடினமானது; அது மிகவும் மரபுத்தொடரானது.
    reason: lexical_alternative
  - marker: b
    text: “நீ ஈசாயின் மகனுடைய பக்கம் சேர்ந்திருக்கிறாய்” என்றும் பொருள் கொள்ளலாம்.
    reason: lexical_alternative
  - marker: c
    text: “உன் தாயின் நிர்வாணத்திற்கான அவமானம்” என்பது குடும்பத்திற்கே ஏற்பட்ட கடும் இழிவைக் குறிக்கும் தீவிரமான எபிரெய வசைமொழி.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּחַר אַף שָׁאוּל בִּיהוֹנָתָן
  choice: சவுலுக்கு யோனத்தான்மேல் கோபம் மூண்டது
  rationale: எபிரெய மொழியின் ‘கோபம் எரிந்தது’ என்ற உயிரோட்டமான மரபுத்தொடரை, நவீன தமிழில் இயல்பாகவும் அதன் தீவிரத்தைத் தக்கவைத்தும் ‘கோபம் மூண்டது’ என வழங்குகிறது.
- source_word: בֶּן נַעֲוַת הַמַּרְדּוּת
  choice: நெறிகெட்ட, கலகக்காரப் பெண்ணின் மகனே
  rationale: இது கடுமையான, பொருள் தீர்மானிக்கச் சிரமமான எபிரெய வசைமொழி. נַעֲוַת என்பதன் கோணல்/நெறிகேடு சார்ந்த கருத்தையும் מַרְדּוּת என்பதன் கலகம் சார்ந்த கருத்தையும் தக்கவைத்து, தமிழில் புரியும் வகையில் ‘பெண்’ சேர்க்கப்பட்டுள்ளது; மாற்றுப் புரிதல் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: הֲלוֹא יָדַעְתִּי
  choice: எனக்குத் தெரியாதா?
  rationale: எதிர்மறை வினா வடிவிலுள்ள சவுலின் கண்டனத் தொனியை நேரடியான உரையாக மாற்றாமல் தக்கவைக்கிறது.
- source_word: בֹחֵר אַתָּה לְבֶן יִשַׁי
  choice: நீ ஈசாயின் மகனைத் தேர்ந்தெடுத்திருக்கிறாய்
  rationale: בחר என்பதன் அடிப்படைப் பொருளான ‘தேர்ந்தெடு’ என்பதைக் காக்கிறது. சூழலில் ‘அவனுடைய பக்கம் சேர்ந்திருக்கிறாய்’ என்ற பொருள் இருக்கலாம் என்பதால் அது அடிக்குறிப்பில் குறிப்பிடப்பட்டுள்ளது.
- source_word: לְבָשְׁתְּךָ
  choice: உனக்கு அவமானமாக
  rationale: לְ என்ற முன்னொட்டின் விளைவு சார்ந்த பொருளையும் בֹּשֶׁת என்பதன் அவமானம்/இழிவு என்ற கருத்தையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: וּלְבֹשֶׁת עֶרְוַת אִמֶּךָ
  choice: உன் தாயின் நிர்வாணத்திற்கு அவமானமாக
  rationale: עֶרְוָה என்பதன் நேரடிப் பொருளான ‘நிர்வாணம்’ என்பதை மென்மைப்படுத்தாமல் வைத்திருப்பதால் வசைமொழியின் கடுமையும் குடும்ப இழிவு சார்ந்த படிமமும் நிலைக்கின்றன.
