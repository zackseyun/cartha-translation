translation_notes:
  register: நவீன நிலையான தமிழில், வாசிக்க எளிதான ஆனால் மரியாதைமிக்க உரைநடை பயன்படுத்தப்பட்டுள்ளது. சவுலின் கோபம், வசைமொழியின் கடுமை, மூலத்தின் உடல்சார்ந்த வெட்கப் படிமம் ஆகியவை மென்மைப்படுத்தப்படவில்லை. பொருள் உறுதியில்லாத இடங்கள் முதன்மை உரையில் இயல்பாக வழங்கப்பட்டு, உண்மையான மாற்றுப் புரிதல்கள் அடிக்குறிப்புகளில் பாதுகாக்கப்பட்டுள்ளன.
