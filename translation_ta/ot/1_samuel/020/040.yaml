translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையும் கண்ணியமும் கொண்ட கதைநடை பயன்படுத்தப்பட்டது. ‘தன்னுடைய பணியாளனான இளைஞன்’ என்பது அֲשֶׁר לוֹ என்ற உடைமை/சேவை உறவை வெறும் ‘உடனிருந்தவன்’ என்று மங்கச் செய்யாமல், அதேவேளை அடிமைத்தனத்தை அளவுக்கு மீறிக் குறிப்பிடாமல் வழங்குகிறது. அடிக்குறி குறியீடு முதன்மை உரையில் சேர்க்கப்பட்டுள்ளது.
