base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/040.yaml
  text: Then Jonathan gave his weapons to the young man who was with him and said to him[a], “Go[c][b], bring them to the city.”
translation:
  language: ta
  text: பின்பு, யோனத்தான் தன் ஆயுதங்களைத் தன் இளைஞர் உதவியாளனிடம் கொடுத்து, அவனிடம், “போய், அவற்றை நகரத்துக்குக் கொண்டுபோ” என்றான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ஆயுதங்கள்” என்பதற்கான எபிரெயச் சொல் “உபகரணங்கள்,” “சாதனங்கள்,” அல்லது “பொருள்கள்” என்றும் பொருள்படலாம். ஆனால் இங்குள்ள வில், அம்புகள் பற்றிய சூழல் “ஆயுதங்கள்” என்ற மொழிபெயர்ப்பை ஆதரிக்கிறது. “அவற்றை” என்பது எபிரெயத்தில் வெளிப்படையாக இல்லை; முன்சொன்ன ஆயுதங்களையே குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: கொடுத்து
  rationale: נתן என்பதன் தொடர்கதை வடிவம் சாதாரணமாக ‘கொடுத்தான்’ என்று பொருள்படும்; அடுத்த வினையுடன் இயல்பாக இணைய ‘கொடுத்து’ என மொழிபெயர்க்கப்பட்டது.
- source_word: יְהוֹנָתָן
  choice: யோனத்தான்
  rationale: எபிரெயத் தனிப்பெயரின் தமிழில் வழக்கமான வேதாகம ஒலிபெயர்ப்பு.
- source_word: כֵּלָיו
  choice: தன் ஆயுதங்களை
  rationale: כְּלִי என்பது கருவி, பொருள், உபகரணம் அல்லது ஆயுதம் எனப் பொருள்படலாம். வில் மற்றும் அம்புகள் இடம்பெறும் உடனடி சூழலில் ‘ஆயுதங்கள்’ பொருத்தமானது; பன்மை வடிவம் அல்லாதபோதிலும் கூட்டுப்பொருள் தமிழில் இயல்பாகப் பன்மையில் தரப்படுகிறது.
- source_word: הַנַּעַר אֲשֶׁר לוֹ
  choice: தன்னுடைய பணியாளனான இளைஞனிடம்
  rationale: נַעַר என்பது சிறுவன், இளைஞன் அல்லது பணியாள் என வரலாம்; אֲשֶׁר לוֹ அவன் யோனத்தானுக்குரிய தனிப்பட்ட உதவியாளர் என்பதைச் சுட்டுகிறது. ‘பணியாளனான இளைஞன்’ வயதும் கீழ்நிலைப் பணியுறவும் இரண்டையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וַיֹּאמֶר לוֹ
  choice: அவனிடம் … என்றான்
  rationale: אמר என்பதன் நேரடியான ‘சொன்னான்’ என்ற பொருளைத் தமிழின் நேரடி உரை அமைப்பில் இயல்பாக வழங்குகிறது.
- source_word: לֵךְ
  choice: போ
  rationale: הלך வினையின் ஆண்பால் ஒருமை ஏவல் வடிவத்தின் நேரடி மொழிபெயர்ப்பு.
- source_word: הָבֵיא
  choice: அவற்றைக் … கொண்டுபோ
  rationale: בוא என்பதன் Hiphil வடிவம் பொதுவாக ‘கொண்டுவா/கொண்டுசெல்’ எனக் காரணவினைப் பொருள் தருகிறது. இங்கு பணியாளன் இருக்கும் இடத்திலிருந்து பட்டணத்துக்குச் செல்லும்படி கட்டளையிடப்படுவதால் தமிழில் ‘கொண்டுபோ’ என்பது திசையை இயல்பாகக் காட்டுகிறது. எபிரெயத்தில் மறைந்துள்ள செயப்படுபொருள் முன்சொன்ன ஆயுதங்களைக் குறிக்கும் ‘அவற்றை’ என நிரப்பப்பட்டுள்ளது.
- source_word: הָעִיר
  choice: பட்டணத்துக்கு
  rationale: הָעִיר என்பது குறிப்பிட்ட நகரம் அல்லது பட்டணத்தைக் குறிக்கிறது. இந்தக் கதைச் சூழலில் ‘பட்டணம்’ இயல்பான தமிழ் சொல்; மூலத்தில் பெயர் குறிப்பிடப்படாததால் கூடுதல் அடையாளம் சேர்க்கப்படவில்லை.
