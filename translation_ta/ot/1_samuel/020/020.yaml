- from: நானோ, ஒரு இலக்கை நோக்கிப் பயிற்சிக்காக எய்வதுபோல், அந்தக் கல்லின் பக்கமாக மூன்று அம்புகளை எய்வேன்.[a]
  to: நானோ, இலக்கை நோக்கி அம்பு எய்வதுபோல், அதன் பக்கமாக அந்த மூன்று அம்புகளை எய்வேன்.[a]
  rationale: The revision retains the Hebrew 3fs anaphoric suffix in the main text rather than resolving it as “that stone.” It also removes the explicitly added “for practice” while preserving the contextual sense of apparent target shooting. The footnote identifies the likely antecedent and documents the difficult, more literal final phrase.
