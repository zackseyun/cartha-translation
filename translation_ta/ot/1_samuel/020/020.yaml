translation_notes:
  register: நவீனத் தரத் தமிழில், எளிமையும் கண்ணியமும் காக்கப்பட்டுள்ளன. ‘அந்தக் கல்’ என்பது சூழலால் தெளிவாக்கப்பட்டாலும், எபிரெயத்தின் மறைசுட்டின் நுணுக்கம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
