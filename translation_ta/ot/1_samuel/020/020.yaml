  yaml_path: translation/ot/1_samuel/020/020.yaml
  text: And I will shoot the three arrows to the side of it[c][b][a], as though I were shooting for myself at a target.
translation:
  language: ta
  text: நானோ, இலக்கை நோக்கி அம்பு எய்வதுபோல், அதன் பக்கமாக அந்த மூன்று அம்புகளை எய்வேன்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “அதன் பக்கமாக” என்று உள்ளது; “அது” என்பது முந்தைய வசனத்தில் குறிப்பிடப்பட்ட கல்லைக் குறிப்பதாக இருக்கலாம். கடைசிப் பகுதியை இன்னும் சொற்படியாக, “எனக்காக ஓர் இலக்கை நோக்கி அனுப்புவதுபோல்” என மொழிபெயர்க்கலாம்; இது இலக்கை நோக்கி அம்பு எய்வதுபோல் செயல்படுவதைக் குறிக்கிறது.
    reason: cross_reference_and_lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: நானோ
  rationale: திட்டத்தில் யோனத்தான் செய்யவிருக்கும் செயலுக்கு உரையாடல் மாறுவதைத் தனிப்பெயர் வலியுறுத்துகிறது; ‘நானோ’ இதை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: שְׁלֹשֶׁת הַחִצִּים
  choice: மூன்று அம்புகளை
  rationale: குறிப்பிட்ட மூன்று அம்புகளைக் குறிக்கும் எபிரெய வடிவத்தைத் தமிழ் சூழலில் இயல்பாக வழங்குகிறது.
- source_word: צִדָּה
  choice: அந்தக் கல்லின் பக்கமாக
  rationale: பெண்பால் ஒருமை பின்னொட்டு முந்தைய வசனத்திலுள்ள கல்லைக் குறிப்பதாகச் சூழல் வலுவாக உணர்த்துகிறது; ‘பக்கமாக’ திசைநோக்கைத் தக்கவைக்கிறது.
- source_word: אוֹרֶה
  choice: எய்வேன்
  rationale: வில்வித்தைச் சூழலில் ירה என்பதன் இயல்பான தமிழ்ப் பொருள் ‘எய்தல்’; திட்டமிட்ட எதிர்காலச் செயலும் இதில் தெளிவாகிறது.
- source_word: לְשַׁלַּח לִי לְמַטָּרָה
  choice: ஒரு இலக்கை நோக்கிப் பயிற்சிக்காக எய்வதுபோல்
  rationale: சொல்லுக்கு சொல் அமைப்பு தமிழில் செயற்கையாக இருக்கும். சூழலில், தனக்காக இலக்கை நோக்கி அம்பெய்திப் பயிற்சி செய்வதுபோன்ற தோற்றத்தைக் கொடுப்பதே கருத்து.
