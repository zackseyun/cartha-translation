base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/009.yaml
  text: Jonathan said[a], “Far be it from you! If I knew for certain that evil had been determined by my father to come upon you, would I not tell you?”
translation:
  language: ta
  text: யோனத்தான், “அப்படியெல்லாம் இருக்கக் கூடாது! என் தந்தையிடமிருந்து உனக்குத் தீங்கு வருவது உறுதியாகிவிட்டது[a] என்று நான் நிச்சயமாக அறிந்தால், அதை உனக்குத் தெரிவிக்காமல் இருப்பேனா?” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தீங்கு தீர்மானிக்கப்பட்டுவிட்டது” / “தீங்கு நிறைவேறிவிட்டது.” சவுலின் தீங்கான நோக்கம் உறுதியாகத் தீர்மானிக்கப்பட்டிருந்தது அல்லது முழுமை அடைந்திருந்தது என்பதை எபிரெயச் சொற்றொடர் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: חָלִילָה לָּךְ
  choice: அது உனக்கு நேரவே கூடாது!
  rationale: கடுமையான மறுப்பைக் குறிக்கும் எபிரெய மரபுத்தொடர். இரண்டாம் நபர் உருபான לָּךְ என்பதையும் காத்து, தமிழில் இயல்பான வலியுறுத்தலாக மொழிபெயர்க்கப்பட்டது.
- source_word: כִּי אִם
  choice: என்றால்
  rationale: இங்கு நிபந்தனை வாக்கியத்தை அறிமுகப்படுத்துவதால், இயல்பான தமிழ் நிபந்தனை வடிவம் பயன்படுத்தப்பட்டது.
- source_word: יָדֹעַ אֵדַע
  choice: நான் நிச்சயமாக அறிந்தால்
  rationale: வினையெச்ச முழுவடிவமும் வினைமுற்றும் இணைந்து அறிவின் உறுதியை வலியுறுத்துகின்றன; ‘நிச்சயமாக’ அந்த வலிமையை வெளிப்படுத்துகிறது.
- source_word: כָלְתָה הָרָעָה
  choice: தீங்கு வருவது உறுதியாகிவிட்டது
  rationale: தீய நோக்கம் அல்லது தீங்கு முழுமையாக உருவாகி உறுதிப்பட்ட நிலையை இச்சொற்றொடர் குறிக்கலாம். மூலத்தின் பொருள் நெகிழ்வை அடிக்குறிப்பில் காக்கும் வகையில் உரையில் இயல்பாகத் தரப்பட்டது.
- source_word: מֵעִם אָבִי
  choice: என் தந்தையிடமிருந்து
  rationale: מֵעִם குறிக்கும் தோற்றுவாய் அல்லது மூலத்தை நேரடியாகக் காக்கிறது; தந்தையே தீங்கின் மூலமாக இருப்பதைச் சொல்கிறது.
- source_word: לָבוֹא עָלֶיךָ
  choice: உனக்குத் தீங்கு வருவது
  rationale: ‘உன்மேல் வருதல்’ என்ற திசைநோக்கிய உருவகத்தை தமிழில் இயல்பாகத் தெரிவிக்கிறது; தீங்கு தாக்குதலா வேறு கேடா என்பதைத் தேவையின்றி வரையறுக்கவில்லை.
- source_word: וְלֹא אֹתָהּ אַגִּיד לָךְ
  choice: அதை உனக்குத் தெரிவிக்காமல் இருப்பேனா?
  rationale: ஆம் என்ற பதிலை எதிர்பார்க்கும் மூலத்தின் வினாவடிவத்தைத் தக்கவைக்கிறது; נגד என்பதற்கு இவ்வுறவுச் சூழலில் ‘தெரிவித்தல்’ இயல்பானது.
