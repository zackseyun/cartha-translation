base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/008.yaml
  text: So show kindness to your servant[a], for you have brought your servant into the covenant of Yahweh with yourself. But if there is guilt in me, put me to death yourself[b]; why should you bring me to your father?
translation:
  language: ta
  text: ஆகையால், உமது அடியானுக்குத் தயவு காட்டுங்கள்[a]. ஏனெனில், உமது அடியானாகிய என்னை உம்மோடு யாவேயின் உடன்படிக்கைக்குள் கொண்டுவந்திருக்கிறீர். ஆனால், என்னில் குற்றம் இருந்தால், நீரே என்னைக் கொன்றுவிடுங்கள்; நீர் என்னை உமது தந்தையிடம் ஏன் கொண்டுபோக வேண்டும்?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உமது அடியானிடம் உடன்படிக்கைப் பற்றுறுதியைக் காட்டுங்கள்.” எபிரேயச் சொல் חֶסֶד தயவு, உண்மையான அன்பு, அல்லது உடன்படிக்கைக்கு உண்மையாய் நிலைக்கும் பற்றுறுதி ஆகிய பொருள்களைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ חֶסֶד
  choice: உடன்படிக்கைப் பற்றுறுதியைக் காட்டும்
  rationale: חֶסֶד என்பது இரக்கம் அல்லது தயவு மட்டுமல்லாமல் உறவுக்கும் உடன்படிக்கைக்கும் உண்மையாய் நிலைக்கும் பற்றுறுதியையும் குறிக்கலாம். அடுத்த சொற்றொடரில் யாவேயின் உடன்படிக்கை நேரடியாகக் குறிப்பிடப்படுவதால், இங்கு அந்த ஆழமான பொருளைத் தெளிவாக வெளிப்படுத்துவது பொருத்தமானது.
- source_word: עַל עַבְדֶּךָ
  choice: உமது அடியானிடம்
  rationale: עשה חסד עַל என்ற எபிரேய மரபுத்தொடர் ஒருவரிடம் அன்புடனும் பற்றுறுதியுடனும் நடந்துகொள்வதைக் குறிக்கிறது. ‘அடியான்’ என்பது தாவீதின் பணிவான தற்குறிப்பை நவீனத் தமிழில் கண்ணியமாகக் காக்கிறது.
- source_word: בִּבְרִית יְהוָה
  choice: யாவேயின் உடன்படிக்கைக்குள்
  rationale: בְּ முன்னொட்டு இங்கு உடன்படிக்கை உறவுக்குள் கொண்டுவரப்பட்டதைச் சுட்டுகிறது. ‘யாவே’ என்பது יהוה என்ற தனிப்பெயரின் தமிழ் ஒலிபெயர்ப்பு.
- source_word: הֵבֵאתָ אֶת עַבְדְּךָ עִמָּךְ
  choice: உமது அடியானாகிய என்னை உம்மோடு ... கொண்டுவந்தவர் நீரே
  rationale: בוא என்பதன் ஹிஃபில் வடிவம் ‘கொண்டுவருதல்’ எனப் பொருள்படும்; עִמָּךְ என்பது யோனத்தானோடு சேர்ந்து தாவீது உடன்படிக்கைக்குள் கொண்டுவரப்பட்ட உறவைத் தக்கவைக்கிறது. வலியுறுத்தலை இயல்பான தமிழில் ‘நீரே’ தெரிவிக்கிறது.
- source_word: וְאִם יֶשׁ בִּי עָוֺן
  choice: ஆனால் என்னிடம் குற்றம் இருந்தால்
  rationale: עָוֹן என்பது அக்கிரமம், குற்றம் அல்லது குற்றப்பழி ஆகியவற்றைக் குறிக்கலாம். இச்சூழலில் தாவீது உண்மையில் குற்றவாளியா என்பதே கேள்வி என்பதால் ‘குற்றம்’ இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: הֲמִיתֵנִי אַתָּה
  choice: நீரே என்னைக் கொன்றுவிடும்
  rationale: המית என்பது ‘கொல்லுதல்/மரணத்திற்கு உட்படுத்துதல்’; אַתָּה வலியுறுத்தப்படுவதால் ‘நீரே’ என மொழிபெயர்க்கப்பட்டது. நேரடியான வேண்டுகோளின் தீவிரத்தை ‘கொன்றுவிடும்’ இயல்பாகக் காட்டுகிறது.
- source_word: וְעַד אָבִיךָ לָמָּה זֶּה תְבִיאֵנִי
  choice: உமது தந்தையிடம் என்னை ஏன் கொண்டுபோக வேண்டும்?
  rationale: 'இது சொல்லாட்சிக் கேள்வி: தாவீதிடம் குற்றம் இருந்தால் யோனத்தானே அவனைக் கொல்லலாம்; சவுலிடம் ஒப்படைக்க வேண்டியதில்லை. עַד இங்குள்ள ‘வரை/அருகே’ என்ற இயக்கப் பொருள் தமிழில் ‘தந்தையிடம்’ என்பதிலேயே இயல்பாக அடங்குகிறது.'
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூல எபிரேய உரையில் பொதுப் பட்டப்பெயர் அல்லாமல் יהוה என்ற தனிப்பெயர் உள்ளது. ஆகவே பட்டப்பெயரால் மாற்றாமல் அதன் தனிப்பெயர்த் தன்மையைத் தமிழ் ஒலிபெயர்ப்பில் காக்கிறது.
- issue: חֶסֶד என்பதிலுள்ள உடன்படிக்கை சார்ந்த பொருள்
  choice: உடன்படிக்கைப் பற்றுறுதி
  alternative: தயவு
  rationale: இந்தச் சொல்லுக்கு பரந்த பொருள் வரம்பு இருந்தாலும், உடனடியான அடுத்த காரணவாக்கியம் ‘யாவேயின் உடன்படிக்கை’ என்று கூறுவதால் உறவுசார் உண்மைத்தன்மையும் பற்றுறுதியும் இங்கு முன்னிலைப்படுகின்றன. அடிக்குறிப்பு எளிய மாற்றுப் பொருளையும் தருகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் கண்ணியமான நேரடி உரையாடல் நடை பயன்படுத்தப்பட்டுள்ளது. அரசவைக் காலப் பணிவைச் சுட்ட ‘அடியான்’ என்றும், ஒருமை மரியாதையைத் தக்கவைக்க ‘உமது/நீர்’ என்றும் வழங்கப்பட்டுள்ளது. மூலத்தில் உள்ள உடன்படிக்கை சார்ந்த பதற்றம் விளக்கவுரையால் தீர்க்கப்படாமல், முதன்மை உரையிலும் அடிக்குறிப்பிலும் பாதுகாக்கப்பட்டுள்ளது.
