base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/041.yaml
  text: When the boy had come[a], David rose from beside the south side and fell with his face to the ground and bowed three times. Then they kissed one another and wept with one another[b], until David wept the more.
translation:
  language: ta
  text: அந்தப் பையன் வந்தபின், தாவீது தென்புறத்தின் அருகிலிருந்து[a] எழுந்தார்; முகங்குப்புறமாகத் தரையில் விழுந்து மூன்று முறை வணங்கினார். பின்பு அவர்கள் ஒருவரையொருவர் முத்தமிட்டு, ஒருவரோடு ஒருவர் அழுதார்கள்; தாவீது அதிகமாக அழுதார்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “தெற்கின்/நெகேபின் அருகிலிருந்து.” இச்சொற்றொடர் பொருள் காண்பதற்குக் கடினமானது; சிலர் இதைத் தாவீதின் மறைவிடத்துக்கு அருகிலிருந்த மேடு அல்லது கல்லைக் குறிப்பதாகப் புரிந்துகொள்கிறார்கள்.
    reason: alternative_reading
  - marker: b
    text: அல்லது, “தாவீது மிகுதியாகும் வரை.” தாவீதின் அழுகை யோனத்தானுடையதை மிஞ்சியது என்றோ, அது மேலும் தீவிரமடைந்தது என்றோ பொருள் கொள்ளலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנַּעַר בָּא
  choice: அந்தப் பையன் போனபின்
  rationale: மசோரா மெய்யெழுத்து உரை சொற்பட ‘பையன் வந்தான்’ என இருந்தாலும், உடனடி சூழலில் யோனத்தானின் பணியாளன் அங்கிருந்து நகரத்துக்குப் போன பிறகே தாவீது மறைவிடத்திலிருந்து வெளியே வருகிறார். இயல்பான தமிழ் ஓட்டத்திற்காகச் சூழல் உணர்த்தும் காலத் தொடர்பு வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: מֵאֵצֶל הַנֶּגֶב
  choice: தென்புறத்திலிருந்து
  rationale: נֶגֶב என்பதன் வழக்கமான பொருள் ‘தெற்கு/தென்புறம்.’ אֵצֶל தரும் ‘அருகிலிருந்து/பக்கத்திலிருந்து’ என்ற நுணுக்கத்தைச் சுருக்கமான இயல்பான தமிழில் இடப்பொருளாகத் தருகிறது; சொற்றொடரின் சிரமம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: וַיִּפֹּל לְאַפָּיו אַרְצָה
  choice: முகங்குப்புறத் தரையில் விழுந்து
  rationale: முகம் தரையை நோக்கிய முழு பணிவான உடல் நிலையை இயல்பாகவும் தெளிவாகவும் தெரிவிக்கிறது.
- source_word: וַיִּשְׁתַּחוּ שָׁלֹשׁ פְּעָמִים
  choice: மூன்று முறை வணங்கினார்
  rationale: שׁחה இங்கு தரைவரை குனிந்து மரியாதை செலுத்துவதைக் குறிக்கிறது. ‘தொழுதார்’ என மொழிபெயர்ப்பது மத வழிபாடு என்ற தேவையற்ற கருத்தைச் சேர்க்கக்கூடும்.
- source_word: וַיִּשְּׁקוּ אִישׁ אֶת רֵעֵהוּ
  choice: அவர்கள் ஒருவரையொருவர் முத்தமிட்டு
  rationale: எபிரெய பரஸ்பர அமைப்பை நேராகவும் இயல்பாகவும் தருகிறது; பிரியாவிடை அன்பின் செயலான முத்தத்தை மறைக்கவில்லை.
- source_word: וַיִּבְכּוּ אִישׁ אֶת רֵעֵהוּ
  choice: ஒருவரோடு ஒருவர் அழுதார்கள்
  rationale: இருவரும் பகிர்ந்து அழுத பரஸ்பர உணர்வை நவீனத் தமிழில் இயல்பாகக் காட்டுகிறது.
- source_word: עַד דָּוִד הִגְדִּיל
  choice: தாவீதோ இன்னும் அதிகமாக அழுதார்
  rationale: גדל என்பதன் ‘பெருகுதல்/மிகுதல்’ என்ற கருத்தை, முந்தைய ‘அழுதார்கள்’ என்னும் வினையிலிருந்து நிரப்பி வாசிக்கிறது. இது தாவீதின் அழுகை யோனத்தானுடையதை மிஞ்சியது அல்லது தீவிரமடைந்தது என்ற இரு சாத்தியங்களையும் முற்றிலும் தீர்மானிக்காமல் வைத்திருக்கிறது.
