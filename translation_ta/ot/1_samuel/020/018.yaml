base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/018.yaml
  text: Jonathan said to him[a], “Tomorrow is the new moon, and you will be missed, because your seat will be empty.”
translation:
  language: ta
  text: யோனத்தான் அவனிடம், “நாளை அமாவாசை; உன் இருக்கை காலியாக இருப்பதால், நீ இல்லாதது கவனிக்கப்படும்[a]” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உன் இல்லாமை கவனிக்கப்படும்; ஏனெனில் உன் இருக்கை காலியாக இருக்கும்.” எபிரெயத்தில் இரண்டு உட்பிரிவுகளிலும் פקד என்ற ஒரே வினைச்சொல் மீண்டும் வருகிறது; அந்தச் சொல்விளையாட்டைத் தமிழில் இயல்பாக அப்படியே பேணுவது கடினம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר לוֹ יְהוֹנָתָן
  choice: யோனத்தான் அவனிடம் … என்றான்
  rationale: எபிரெயக் கதைநடையின் இயல்பான பேச்சு அறிமுகத்தை நவீனத் தமிழின் இயல்பான சொல் வரிசையில் தருகிறது.
- source_word: מָחָר
  choice: நாளை
  rationale: காலத்தைக் குறிக்கும் வினையடை நேரடியாக மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: חֹדֶשׁ
  choice: அமாவாசை விழா
  rationale: இங்கு வெறும் ‘மாதம்’ அல்ல; அரச விருந்துடன் தொடர்புடைய புதுநிலா நாளின் அனுசரிப்பைக் குறிக்கிறது. தமிழில் வழக்கமான ‘அமாவாசை’ என்பதோடு ‘விழா’ சேர்ப்பது சூழலைத் தெளிவாக்குகிறது.
- source_word: וְנִפְקַדְתָּ
  choice: நீ இல்லாதது கவனிக்கப்படும்
  rationale: פקד என்பதன் நிஃபால் வடிவம் தாவீதின் இல்லாமை கவனத்திற்கு வரும் என்பதைக் குறிக்கிறது; ‘உன்னைத் தேடுவார்கள்’ என்று அளவுக்கு மீறித் தீர்மானிக்காமல் செயப்பாட்டு உணர்வைப் பேணுகிறது.
- source_word: כִּי
  choice: … இருப்பதால்
  rationale: முந்தைய கூற்றுக்கான காரணத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: יִפָּקֵד מוֹשָׁבֶךָ
  choice: உன் இருக்கை காலியாக இருக்கும்
  rationale: மீண்டும் வரும் פקד வினையின் சூழல்சார்ந்த விளைவைத் தமிழில் இயல்பாகக் கூறுகிறது; מוֹשָׁב என்பது விருந்து மேசையிலுள்ள ஒதுக்கப்பட்ட இருக்கையைக் குறிக்கிறது.
