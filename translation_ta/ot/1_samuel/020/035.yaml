  edition: WLC
  text: וַ/יְהִ֣י בַ/בֹּ֔קֶר וַ/יֵּצֵ֧א יְהוֹנָתָ֛ן הַ/שָּׂדֶ֖ה לְ/מוֹעֵ֣ד דָּוִ֑ד וְ/נַ֥עַר קָטֹ֖ן עִמּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/035.yaml
  text: In the morning[a], Jonathan went out to the field for the appointed meeting with David[b], and a young boy was with him.
translation:
  language: ta
  text: காலையில், யோனத்தான் தாவீதுடன் குறித்திருந்த சந்திப்புக்காக[a] வயல்வெளிக்குப் புறப்பட்டான்; ஒரு சிறு பையனும்[b] அவனுடன் இருந்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தாவீதுக்காகக் குறித்திருந்த நேரத்தில்.” எபிரெயச் சொல் מוֹעֵד (மோஏத்) குறிக்கப்பட்ட நேரத்தையோ குறிக்கப்பட்ட சந்திப்பையோ குறிக்கலாம். அவர்கள் முன்பே ஏற்பாடு செய்திருந்த கூடுகையைப் பற்றிய சூழல், “குறித்திருந்த சந்திப்பு” என்ற மொழிபெயர்ப்பை ஆதரிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “ஒரு சின்னப் பையன்” அல்லது “ஓர் இளம் பணியாள்.” எபிரெயச் சொல் נַעַר (நஅர்) சூழலுக்கேற்ப பையன், இளைஞன், அல்லது பணியாள் என்பதைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בַבֹּקֶר
  choice: காலையில்
  rationale: וַיְהִי தொடரும் நிகழ்வை அறிமுகப்படுத்துகிறது; בַבֹּקֶר செயல் நடந்த நேரத்தைக் குறிக்கிறது. தமிழில் இயல்பான கதைநடைக்காக இரண்டையும் ‘காலையில்’ என்பதில் சுருக்கமாக வெளிப்படுத்துகிறது.
- source_word: וַיֵּצֵא
  choice: புறப்பட்டுச் சென்றான்
  rationale: יצא என்பதிலுள்ள ‘வெளியே செல்லுதல்/புறப்படுதல்’ என்ற திசைநுட்பத்தை இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: יְהוֹנָתָן
  choice: யோனத்தான்
  rationale: எபிரெய தனிப்பெயரின் தமிழில் வழக்கமான ஒலிபெயர்ப்பு.
- source_word: הַשָּׂדֶה
  choice: வயல்வெளிக்கு
  rationale: שָׂדֶה திறந்த வெளி அல்லது வயல்வெளியைக் குறிக்கிறது; இச்சூழலுக்கு ‘வயல்வெளி’ பொருத்தமானது.
- source_word: לְמוֹעֵד דָּוִד
  choice: தாவீதுடன் குறித்திருந்த சந்திப்புக்காக
  rationale: מוֹעֵד என்பது குறிக்கப்பட்ட நேரத்தையோ சந்திப்பையோ குறிக்கலாம். முன்னதாக ஏற்பாடு செய்யப்பட்ட கூடுகையும் அடையாளமும் உள்ள சூழலில் ‘குறித்திருந்த சந்திப்பு’ இயல்பாகப் பொருந்துகிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் தக்கவைக்கப்படுகிறது.
- source_word: וְנַעַר קָטֹן
  choice: ஒரு சிறு பையனும்
  rationale: נַעַר என்பது பையன், இளைஞன் அல்லது பணியாள் எனச் சூழலுக்கேற்ப பொருள்படும்; קָטֹן அவனது சிறுவயதையோ சிறிய தன்மையையோ வலியுறுத்துகிறது. ‘சிறு பையன்’ இரண்டையும் நேரடியாக வெளிப்படுத்துகிறது.
- source_word: עִמּוֹ
  choice: அவனுடன் இருந்தான்
  rationale: உடனிருப்பதைத் தெரிவிக்கும் சொற்றொடரை முழுமையான தமிழ் வாக்கியமாக வழங்குகிறது.
