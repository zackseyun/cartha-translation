base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/005.yaml
  text: David said to Jonathan[a], “Look, tomorrow is the new moon, and I am supposed to sit with the king to eat. But let me go[b], so that I may hide myself in the field until the third evening.”
translation:
  language: ta
  text: தாவீது யோனத்தானிடம், “இதோ, நாளை புதுநிலா நாள்[a]. நான் அரசரோடு அமர்ந்து உணவருந்த வேண்டியிருக்கும். ஆனால் நான் வயல்வெளியில் மூன்றாம் மாலை வரை[b] ஒளிந்துகொள்ளும்படி என்னைப் போகவிடு” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “புதுநிலா நாள்” என்பது ஒவ்வொரு மாதத்தின் தொடக்கத்தில் கடைப்பிடிக்கப்பட்ட நாளைக் குறிக்கிறது; அது பொதுவாகச் சிறப்பு விருந்துடன் அனுசரிக்கப்பட்டது.
    reason: cultural_note
  - marker: b
    text: அல்லது, “மூன்றாம் நாளின் மாலை வரை.” எபிரேயச் சொற்றொடர் சுருக்கமாக அமைந்துள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: இதோ
  rationale: சூழ்நிலைக்குக் கவனத்தை ஈர்க்கும் எபிரேயச் சொல்லின் சுட்டும் வலிமையை இயல்பான தமிழ் நடையில் காக்கிறது.
- source_word: חֹדֶשׁ מָחָר
  choice: நாளை புதுநிலா நாள்
  rationale: חֹדֶשׁ இங்கு வெறும் ‘மாதம்’ என்பதைக் குறிக்காமல், சிறப்பு விருந்துடன் கடைப்பிடிக்கப்பட்ட புதுநிலா நாளைக் குறிக்கிறது.
- source_word: יָשֹׁב אֵשֵׁב
  choice: நான் ... அமர்ந்து உணவருந்த வேண்டியிருக்கும்
  rationale: வினையெச்ச முழுவடிவமும் வினைமுற்றும் சேர்ந்த எபிரேய அமைப்பு எதிர்பார்க்கப்பட்ட அல்லது கட்டாயமான வருகையை வலியுறுத்துகிறது; தமிழ் மொழிபெயர்ப்பு இதை தனிப்பட்ட அறக்கடமை என்று மிகைப்படுத்தாமல் சமூக எதிர்பார்ப்பாக வெளிப்படுத்துகிறது.
- source_word: עִם הַמֶּלֶךְ לֶאֱכֹל
  choice: அரசரோடு அமர்ந்து உணவருந்த
  rationale: அரசருடன் உணவுக்கு அமரும் மூலமொழியின் தெளிவான காட்சியை இயல்பான தமிழில் காக்கிறது.
- source_word: וְשִׁלַּחְתַּנִי
  choice: என்னைப் போகவிடு
  rationale: சொல்லுக்குச் சொல் ‘என்னை அனுப்பு’ என்றாலும், இச்சூழலில் தன் வராமைக்கு யோனத்தான் அனுமதி அளிக்க வேண்டும் என்ற தாவீதின் வேண்டுகோளை இது குறிக்கிறது.
- source_word: וְנִסְתַּרְתִּי
  choice: நான் ... ஒளிந்துகொள்கிறேன்
  rationale: முந்தைய வேண்டுகோளுக்குப் பின் வரும் தாவீதின் நோக்கத்தையும் திட்டத்தையும் இயல்பாக எடுத்துரைக்கிறது; எபிரேயத் தொடரின் விருப்ப அல்லது விளைவு நுணுக்கத்தை அளவுக்கு மீறித் தீர்மானிக்கவில்லை.
- source_word: בַשָּׂדֶה
  choice: வயல்வெளியில்
  rationale: שָׂדֶה என்பதன் திறந்த வெளி அல்லது வயல் என்ற பொருளை நவீனத் தமிழில் தெளிவாகத் தருகிறது.
- source_word: עַד הָעֶרֶב הַשְּׁלִשִׁית
  choice: மூன்றாம் மாலைவரை
  rationale: மூலத்தின் சுருக்கமான, முழுமையாக விளக்கப்படாத காலக் குறிப்பை முதன்மை உரையில் காக்கிறது; சாத்தியமான விரிவாக்கம் அடிக்குறிப்பில் தரப்படுகிறது.
