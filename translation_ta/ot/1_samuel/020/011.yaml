  yaml_path: translation/ot/1_samuel/020/011.yaml
  text: Then Jonathan said to David[a], “Come, and let us go out into the field.” So both of them went out into the field.
translation:
  language: ta
  text: அப்போது யோனத்தான் தாவீதிடம், “வா[a], நாம் வயல்வெளிக்குப் போவோம்” என்றான். அவர்கள் இருவரும் வயல்வெளிக்குப் போனார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “போ, நாம் வயல்வெளிக்குப் போவோம்.” எபிரெய வினைச்சொல்லை நேரடியாக “போ” என்றும் மொழிபெயர்க்கலாம்; ஆனால் சேர்ந்து செல்லும்படி அழைக்கும் இச்சூழலில் “வா” இயல்பாக உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: அப்போது ... என்றான்
  rationale: தொடர்ச்சியான கதைநிகழ்வை இயல்பான நவீனத் தமிழில் முன்னெடுக்கிறது.
- source_word: יְהוֹנָתָן
  choice: யோனத்தான்
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் நிலைபெற்ற பெயர்வடிவம்.
- source_word: אֶל דָּוִד
  choice: தாவீதிடம்
  rationale: பேச்சின் இலக்கைத் தமிழில் இயல்பாகக் குறிக்கிறது.
- source_word: לְכָה
  choice: வா
  rationale: அடிப்படை இயக்கப் பொருள் ‘போ’ என்றாலும், இருவரும் சேர்ந்து செல்லும் அழைப்புச் சூழலில் ‘வா’ என்பது இயல்பான தமிழ்.
- source_word: וְנֵצֵא
  choice: நாம் ... போவோம்
  rationale: முதலாம் நபர் பன்மை விருப்பவினையின் அழைப்பு அல்லது முன்மொழிவு நுணுக்கத்தைப் பாதுகாக்கிறது.
- source_word: הַשָּׂדֶה
  choice: வயல்வெளிக்கு
  rationale: שָׂדֶה என்பதன் வயல் அல்லது திறந்த வெளி என்ற பரப்பைச் சூழலுக்கேற்ற இயல்பான தமிழில் தருகிறது.
- source_word: וַיֵּצְאוּ שְׁנֵיהֶם
  choice: அவர்கள் இருவரும் ... போனார்கள்
  rationale: இருவரும் ஒன்றாகச் சென்றனர் என்ற வலியுறுத்தலைத் தெளிவாகப் பாதுகாக்கிறது.
