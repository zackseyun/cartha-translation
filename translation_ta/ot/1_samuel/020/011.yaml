translation_notes:
  register: நவீன நிலையான தமிழ்; எளிமையான, கண்ணியமான கதைநடை. எபிரெய உரையிலுள்ள ‘வயல்வெளி’ என்ற இலக்கின் மறுபடியும் கூறப்படுதல் பாதுகாக்கப்பட்டுள்ளது. ‘வா’ என்பது இணைந்து செல்லும் அழைப்பாகத் தேர்ந்தெடுக்கப்பட்டது; வசனத்தின் பொருளுக்கு அவசியமில்லாததால் அடிக்குறிப்பு சேர்க்கப்படவில்லை.
