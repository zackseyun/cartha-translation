base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/002.yaml
  text: He said to him[a], “Far from it! You will not die. Look, my father does nothing, great or small, without revealing it to me. So why would my father hide this matter from me? It is not so.”
translation:
  language: ta
  text: அவன் அவனிடம், “அப்படி ஒருபோதும் நடக்காது! நீ சாகமாட்டாய். இதோ, என் தந்தை பெரிய காரியமோ சிறிய காரியமோ எதையும் எனக்குத் தெரிவிக்காமல்[a] செய்வதில்லை. அப்படியிருக்க, என் தந்தை இந்தக் காரியத்தை என்னிடமிருந்து ஏன் மறைப்பார்? அப்படி இல்லை” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொல்லுக்குச் சொல், “என் காதைத் திறக்காமல்”; இது ‘எனக்குத் தெரிவிக்காமல்’ என்று பொருள்படும் மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: חָלִילָה
  choice: அப்படி ஒருபோதும் நடக்காது!
  rationale: இது கடுமையான மறுப்பை வெளிப்படுத்தும் மரபுத்தொடர். மூலத்தில் வெளிப்படையாக இல்லாத இறைக் குறிப்பைச் சேர்க்காமல், நவீனத் தமிழில் அதன் வலிமையை இயல்பாகத் தருகிறது.
- source_word: לֹא תָמוּת
  choice: நீ சாகமாட்டாய்
  rationale: சூழலில் இது நேரடியான உறுதியளிப்பு; நவீனத் தமிழில் இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: הִנֵּה
  choice: இதோ
  rationale: அடுத்து வரும் விளக்கத்திற்குக் கவனத்தை ஈர்க்கும் எபிரெய உரையாடல் குறியைத் தக்கவைக்கிறது.
- source_word: דָּבָר גָּדוֹל אוֹ דָּבָר קָטֹן
  choice: பெரிய காரியமோ சிறிய காரியமோ எதையும்
  rationale: ‘பெரியது அல்லது சிறியது’ என்ற இணைச்சொல் எல்லாவற்றையும் உள்ளடக்கும் பொருளுடையது; அந்தச் சொல்லாட்சி வலிமையையும் தமிழில் காக்கிறது.
- source_word: וְלֹא יִגְלֶה אֶת אָזְנִי
  choice: என் காதுக்குத் தெரிவிக்காமல்
  rationale: ‘என் காதைத் திறக்காமல்’ என்பதன் தகவல் தெரிவிக்கும் பொருளை வாசகருக்கு புரியும் தமிழில் தருகிறது; அதே நேரத்தில் காதைக் குறிப்பிடும் மூல உருவகத்தையும் ஓரளவு காக்கிறது.
- source_word: יַסְתִּיר
  choice: மறைப்பார்
  rationale: காரணவினை வடிவத்தின் சூழல்சார் பொருளை இயல்பான தமிழில் நேரடியாகத் தருகிறது.
- source_word: הַדָּבָר הַזֶּה
  choice: இந்தக் காரியத்தை
  rationale: דבר இங்கு வெறும் ‘சொல்’ அல்ல, பேசப்பட்ட திட்டம் அல்லது விவகாரத்தைக் குறிக்கிறது.
- source_word: אֵין זֹאת
  choice: அப்படி இல்லை
  rationale: தாவீதின் கூற்றை முடிவாக மறுக்கும் சுருக்கமான சொற்றொடரின் வலிமையையும் இயல்பான உரையாடல் நடையையும் காக்கிறது.
- source_word: אָבִי
  choice: என் தந்தை
  rationale: எபிரெயத்தில் இருமுறை வெளிப்படையாக வரும் உறவுமுறைக் குறிப்பை வலியுறுத்தலுக்காக இரு இடங்களிலும் தக்கவைக்கிறது.
