translation_notes:
  register: நவீனத் தரத் தமிழில், மரியாதையும் நேரடியான உரையாடல் வலிமையும் கொண்ட நடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் ஆண்பால் ஒருமைப் பிரதிப்பெயர்கள் பெயர்களாக விரிவாக்கப்படாமல் தக்கவைக்கப்பட்டுள்ளன; இதனால் தனி வசனமாக வாசிக்கும்போது குறிப்பு ஓரளவு தெளிவற்றதாக இருப்பது மூலத்திற்கே உரியதாக நீடிக்கிறது.
