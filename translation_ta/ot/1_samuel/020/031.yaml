base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/031.yaml
  text: For as long as the son of Jesse lives on the earth[a], neither you nor your kingdom will be established. So now, send and bring him to me, for he is a son of death.
translation:
  language: ta
  text: ஏனெனில், ஈசாயின் மகன் பூமியில் உயிரோடிருக்கும் காலமெல்லாம், உனக்கும் உன் அரசாட்சிக்கும் நிலை இருக்காது. ஆகவே இப்போதே ஆளனுப்பி அவனை என்னிடம் கொண்டுவா; ஏனெனில் அவன் சாவுக்குரியவன்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரேய மரபுத்தொடர்: “மரணத்தின் மகன்.” இதற்கு “சாவுக்குரியவன்” அல்லது “சாகத் தீர்மானிக்கப்பட்டவன்” என்று பொருள் கொள்ளலாம்.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: சவுலின் கூற்றுக்கான காரணத்தை அறிமுகப்படுத்தும் இணைப்புச் சொல்லாக இயல்பாக அமைகிறது.
- source_word: כָל הַיָּמִים אֲשֶׁר
  choice: உயிரோடிருக்கும் காலமெல்லாம்
  rationale: எபிரேய காலநீடிப்பு மரபுத்தொடரின் பொருளை நவீன தமிழில் இயல்பாகத் தருகிறது.
- source_word: בֶּן יִשַׁי
  choice: ஈசாயின் மகன்
  rationale: தாவீதின் பெயரைச் சொல்லாமல் தந்தைவழி அடையாளத்தால் குறிப்பிடும் சவுலின் விலக்கமான, இகழ்ச்சித் தொனியைப் பாதுகாக்கிறது.
- source_word: חַי עַל הָאֲדָמָה
  choice: இந்த மண்ணில் உயிரோடிருக்கும்
  rationale: חַי என்பதன் உயிர்வாழும் நிலையும் הָאֲדָמָה என்பதன் மண்/பூமி பொருளும் தெளிவாகத் தரப்படுகின்றன; குறிப்பிட்ட தேசம் என்று தேவையின்றி வரையறுக்கப்படவில்லை.
- source_word: לֹא תִכּוֹן
  choice: நிலைபெறமாட்டீர்கள்
  rationale: כון நிஃபால் வடிவத்தின் ‘நிறுவப்படுதல்/உறுதியாக நிலைத்தல்’ என்ற விளைவு சார்ந்த பொருளை, எழுவாய்களுடன் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: אַתָּה וּמַלְכוּתֶךָ
  choice: நீயும் உன் அரசாட்சியும்
  rationale: யோனத்தானையும் அவனுக்குரிய அரசாட்சியையும் இணையாகக் குறிக்கிறது; מַלְכוּת இங்கு வம்ச-அரசியல் சூழலில் ‘அரசாட்சி’ எனப் பொருந்துகிறது.
- source_word: וְעַתָּה
  choice: ஆகவே இப்போதே
  rationale: முந்தைய காரணத்திலிருந்து வரும் முடிவையும் கட்டளையின் அவசரத்தையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: שְׁלַח וְקַח אֹתוֹ אֵלַי
  choice: ஆளனுப்பி அவனை என்னிடம் கொண்டுவா
  rationale: ஒருவரை அனுப்பி தாவீதை அழைத்துவரச் செய்யும் இணைந்த கட்டளையின் நோக்கத்தைத் தெளிவான தமிழில் தருகிறது.
- source_word: בֶּן מָוֶת הוּא
  choice: அவன் சாவுக்குரியவன்
  rationale: சொல்லுக்குச் சொல் ‘மரணத்தின் மகன்’ என்ற எபிரேய மரபுத்தொடர் தமிழில் தவறாகப் புரியக்கூடும்; மரணத் தண்டனைக்கு உரியவன் என்ற முதன்மைப் பொருளைத் தருகிறது, அதன் சாத்தியமான பொருள் நுட்பம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
theological_decisions:
- issue: בֶּן מָוֶת என்பதன் பொருள் நுட்பம்
  choice: சாவுக்குரியவன்
  alternative: சாகத் தீர்மானிக்கப்பட்டவன்
  rationale: சவுலின் கட்டளையும் சூழலும் தாவீது மரணத்திற்குத் தகுதியானவன் அல்லது மரணத்துக்கு ஒப்படைக்கப்பட்டவன் என்ற வலுவான கூற்றைக் காட்டுகின்றன; எபிரேயம் இவ்விரண்டிற்கும் இடையில் ஓரளவு நுட்பத் திறப்பை விடுவதால் மாற்றுப் பொருள் அடிக்குறிப்பில் குறிப்பிடப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் dignified narrative register பயன்படுத்தப்பட்டுள்ளது. ‘ஈசாயின் மகன்’ என்ற குறிப்பும் கட்டளையின் கடுமையும் பாதுகாக்கப்பட்டுள்ளன; ‘ஆளனுப்பி’ என்பது மறைந்துள்ள தூதர்/ஆட்களை தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
