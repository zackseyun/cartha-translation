revisions:
- from: ஏனெனில், ஈசாயின் மகன் இந்த மண்ணில் உயிரோடிருக்கும் காலமெல்லாம், நீயும் உன் அரசாட்சியும் நிலைபெறமாட்டீர்கள். ஆகவே இப்போதே ஆளனுப்பி அவனை என்னிடம் கொண்டுவா; ஏனெனில் அவன் சாவுக்குரியவன்[a].
  to: ஏனெனில், ஈசாயின் மகன் பூமியில் உயிரோடிருக்கும் காலமெல்லாம், உனக்கும் உன் அரசாட்சிக்கும் நிலை இருக்காது. ஆகவே இப்போதே ஆளனுப்பி அவனை என்னிடம் கொண்டுவா; ஏனெனில் அவன் சாவுக்குரியவன்[a].
  rationale: The revision removes the added “இந்த” and replaces the awkward mixed-subject personal-plural construction with idiomatic Tamil. It retains Saul’s contemptuous patronymic, the broad sense of “earth,” the urgency of the command, and the Hebrew death idiom with an explanatory footnote.
