  text: וַ/יֹּ֨אמֶר יְהוֹנָתָ֜ן אֶל דָּוִ֗ד יְהוָ֞ה אֱלֹהֵ֤י יִשְׂרָאֵל֙ כִּֽי אֶחְקֹ֣ר אֶת אָבִ֗/י כָּ/עֵ֤ת מָחָר֙ הַ/שְּׁלִשִׁ֔ית וְ/הִנֵּה ט֖וֹב אֶל דָּוִ֑ד וְ/לֹֽא אָז֙ אֶשְׁלַ֣ח אֵלֶ֔י/ךָ וְ/גָלִ֖יתִי אֶת אָזְנֶֽ/ךָ־־־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/012.yaml
  text: And Jonathan said to David[a], “As Yahweh, the God of Israel, lives, when I sound out my father about this time tomorrow, or the third day, and behold, if it is favorable toward David[c][b], shall I not then send to you and uncover your ear?"
translation:
  language: ta
  text: யோனத்தான் தாவீதிடம், “இஸ்ரவேலின் கடவுளாகிய யாவே உயிரோடிருக்கிறார் என்பதுபோல்,[a] நாளை இதே நேரத்திலோ, மூன்றாம் நாளிலோ[b] என் தந்தையின் மனநிலையை நான் ஆராய்ந்து பார்ப்பேன். அவர் தாவீதுக்கு ஆதரவாக இருப்பது தெரியவந்தால், நான் உனக்குச் செய்தி அனுப்பி அதை உனக்குத் தெரிவிக்காமல் இருப்பேனா?[c]” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய உரை இங்கே சுருக்கமாக உள்ளது; இது யாவேயை முன்வைக்கும் ஓர் ஆணை அல்லது உறுதிமொழியாகப் புரிந்துகொள்ளப்படுகிறது.
    reason: textual_ambiguity
  - marker: b
    text: அல்லது, “நாளை இதே நேரத்தில், அதாவது மூன்றாம் நாளில்.” எபிரெய காலக் குறிப்பு சுருக்கமாகவும் பலவாறு புரிந்துகொள்ளத்தக்கதாகவும் உள்ளது.
    reason: alternative_reading
  - marker: c
    text: “அதை உனக்குத் தெரிவிக்க” என்பதற்கான எபிரெய மரபுத்தொடர் சொல்லுக்கு சொல், “உன் காதைத் திறக்க” என்பதாகும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה אֱלֹהֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் கடவுளாகிய யாவே
  rationale: தெய்வீகப் பெயரைத் தலைப்பாக மாற்றாமல் ‘யாவே’ என்று ஒலிபெயர்த்து, இணைநிலை அமைப்பை இயல்பான தமிழில் தருகிறது.
- source_word: אֶחְקֹר אֶת אָבִי
  choice: என் தந்தையின் மனநிலையை நான் ஆராய்ந்து பார்ப்பேன்
  rationale: இங்கு யோனத்தான் ஒரு பொது விசாரணை நடத்துவதல்ல; சவுலின் உள்ளப்போக்கை அறிய முயல்வதே சூழல். ‘மனநிலையை’ என்பது சூழலால் தெளிவாகும் மறைபொருளை வெளிப்படுத்துகிறது.
- source_word: כָּעֵת מָחָר הַשְּׁלִשִׁית
  choice: நாளை இதே நேரத்திலோ, மூன்றாம் நாளிலோ
  rationale: சுருக்கமாகவும் கடினமாகவும் உள்ள எபிரெய காலக் குறிப்பைத் தீர்மானமாகச் சீராக்காமல், இரண்டு சாத்தியமான நேரங்களை இயல்பான தமிழில் வைத்திருக்கிறது.
- source_word: טוֹב אֶל דָּוִד
  choice: அவர் தாவீதுக்கு ஆதரவாக இருப்பது
  rationale: טוֹב + אֶל என்பது இச்சூழலில் சவுல் தாவீதிடம் சாதகமான மனப்பான்மை கொண்டிருப்பதைக் குறிக்கிறது.
- source_word: וְגָלִיתִי אֶת אָזְנֶךָ
  choice: அதை உனக்குத் தெரிவிக்க
  rationale: ‘உன் காதைத் திறப்பேன்’ என்ற எபிரெய மரபுத்தொடரின் பொருளை நவீன தமிழில் தெளிவாகத் தருகிறது; சொல்லுக்கு சொல் உருவகம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரின் மொழியாக்கம்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் உள்ள தனிப்பட்ட தெய்வீகப் பெயரை ஒரு பட்டப்பெயரால் மாற்றாமல் ஒலிபெயர்க்கிறது.
- issue: தெய்வீகப் பெயருக்குப் பின் வரும் சுருக்கமான சத்திய மொழி
  choice: யாவே சாட்சி!
  alternative: யாவே உயிரோடிருப்பது உறுதிபோல
  rationale: மசோரா உரையில் ‘உயிரோடிருக்கிறார்’ என்ற வினை வெளிப்படையாக இல்லை. ஆகவே சத்தியத்தின் வலிமையைத் தமிழில் உணர்த்தியபோதும், மூலத்தில் இல்லாத வினையை நேரடியாகச் சேர்ப்பதைத் தவிர்க்கிறது.
- issue: וְלֹא אָז אֶשְׁלַח אֵלֶיךָ என்ற கடினமான எதிர்மறை அமைப்பு
  choice: நான் உன்னிடம் ஆள் அனுப்பி அதை உனக்குத் தெரிவிக்காமல் இருப்பேனா?
  alternative: அப்போது நான் உன்னிடம் ஆள் அனுப்பி அதை உனக்குத் தெரிவிப்பேன்
  rationale: எபிரெய உரையின் எதிர்மறை வினாவடிவத்தையும் உறுதியளிக்கும் வலிமையையும் பாதுகாக்கிறது; அதை நேர்மறை வாக்கியமாக அமைதியாக மாற்றவில்லை.
translation_notes:
  register: நவீன பொதுத்தமிழில் தெளிவான, கண்ணியமான உரைநடை பயன்படுத்தப்பட்டுள்ளது. ‘ஆள் அனுப்பி’ என்பது אֶשְׁלַח என்பதன் சூழல்சார் மறைநிரப்பை இயல்பாக வெளிப்படுத்துகிறது. சத்திய மொழி, காலக் குறிப்பு, எதிர்மறை வினா ஆகியவற்றின் உண்மையான தெளிவின்மை அடிக்குறிப்புகளிலும் வாக்கிய அமைப்பிலும் பாதுகாக்கப்பட்டுள்ளது.
