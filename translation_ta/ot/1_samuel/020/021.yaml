base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/021.yaml
  text: And look[a], I will send the young man, saying, ‘Go, find the arrows.’ If I plainly say to the young man, ‘Behold, the arrows are on this side of you; take them and come,’ then there is peace for you and no danger[b], as Yahweh lives.
translation:
  language: ta
  text: பார், நான் அந்த இளைஞனை அனுப்புவேன்; ‘போய் அம்புகளைத் தேடு’ என்று அவனிடம் சொல்வேன். நான் அந்த இளைஞனிடம், ‘இதோ, அம்புகள் உன்னைவிட இப்பக்கத்தில் இருக்கின்றன[a]; அவற்றை எடுத்துக்கொண்டு வா’ என்று உறுதியாகச் சொன்னால், உனக்கு நலமே; எந்த ஆபத்தும் இல்லை—யாவே உயிரோடிருக்கிறார் என ஆணையாகச் சொல்கிறேன்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அம்புகள் உன்னைவிட இப்பக்கம் இருக்கின்றன’ அல்லது ‘அம்புகள் உன்னை எட்டுவதற்கு முன்பாக விழுந்துள்ளன’ என்றும் பொருள் கொள்ளலாம். அவை அந்த இளைஞனைத் தாண்டி விழவில்லை என்பதே எபிரேயச் சொற்றொடரின் திசைச்சுட்டு.
    reason: lexical_alternative
  - marker: b
    text: எபிரேயத்தில், ‘யாவே உயிரோடிருக்கிறார்’ என்பது சொல்லப்பட்டதன் உண்மையை உறுதிப்படுத்தும் ஆணைச் சூத்திரம்.
    reason: cultural_note
lexical_decisions:
- source_word: וְהִנֵּה
  choice: பார்
  rationale: கவனத்தை ஈர்த்து அடுத்த நடவடிக்கையை அறிமுகப்படுத்தும் எபிரேயச் சொல்லின் உடனடித் தன்மையை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: הַנַּעַר
  choice: அந்த இளைஞன்
  rationale: நַעַר என்பது சிறுவன், இளைஞன் அல்லது பணியாள் எனப் பொருள்படலாம். இங்கு யோனத்தானுடன் இருந்த உதவியாளனைக் குறித்தாலும், அவனுடைய பணிநிலையை அளவுக்கு மீறி குறிப்பாக்காமல் வயது/நிலையைப் பாதுகாக்கிறது.
- source_word: לֵךְ מְצָא אֶת־הַחִצִּים
  choice: ‘போ, அம்புகளைத் தேடு’
  rationale: கட்டளைகளின் தொடரை நேரடியான பேச்சாகவும், מָצָא என்பதன் அடிப்படைப் பொருளை ‘தேடு’ என்றும் வழங்குகிறது.
- source_word: אִם אָמֹר אֹמַר
  choice: நான் … உறுதியாகச் சொன்னால்
  rationale: வினையெச்ச முழுவடிவமும் வினைமுற்றும் சேர்ந்த எபிரேய அமைப்பு பேச்சின் வலியுறுத்தலைக் காட்டுகிறது; ‘உறுதியாக’ என்பது அதை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: הִנֵּה הַחִצִּים מִמְּךָ וָהֵנָּה
  choice: இதோ, அம்புகள் உனக்கு இப்பக்கத்தில் இருக்கின்றன
  rationale: அம்புகள் இளைஞனைத் தாண்டி விழவில்லை, அவனுக்கு யோனத்தானின் பக்கத்தில் விழுந்துள்ளன என்ற திசைச்சுட்டைத் தெளிவாகத் தருகிறது.
- source_word: קָחֶנּוּ וָבֹאָה
  choice: அவற்றை எடுத்துக்கொண்டு வா
  rationale: எபிரேயப் பின்னொட்டு இலக்கண வடிவில் ஒருமையாக இருந்தாலும் முன்வரும் பன்மையான ‘அம்புகள்’ என்பதையே குறிக்கிறது; தமிழில் இயல்பாகப் பன்மையாக்கப்பட்டுள்ளது. ‘வா’ பேசுபவரை நோக்கிய இயக்கத்தைப் பாதுகாக்கிறது.
- source_word: כִּי שָׁלוֹם לְךָ
  choice: உனக்கு நலமே
  rationale: שָׁלוֹם இங்கு பாதுகாப்பையும் நல்வாழ்வையும் குறிக்கிறது. ‘நலமே’ அதன் பரந்த பொருளை வைத்துக்கொண்டு சூழலுக்கேற்ற இயல்பான தமிழை வழங்குகிறது.
- source_word: וְאֵין דָּבָר
  choice: எந்த ஆபத்தும் இல்லை
  rationale: சொல்லுக்கு சொல் ‘எந்தக் காரியமும் இல்லை’ என்றாலும், இச்சூழலில் தாவீதுக்கு எதிரான தீங்கோ அச்சுறுத்தலோ இல்லை என்பதே பொருள்.
- source_word: חַי יְהוָה
  choice: யாவே உயிரோடிருப்பது எவ்வளவு உறுதியோ, அவ்வளவு உறுதி
  rationale: இது கூறப்பட்ட செய்தின் உண்மையை உறுதிப்படுத்தும் எபிரேய ஆணைச் சூத்திரம். அதன் செயல்பாட்டை நவீன தமிழில் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: திருநான்கெழுத்துப் பெயரை பொதுப்பட்டப் பெயராக மாற்றாமல், எபிரேய ஒலிப்பை நெருங்கிய தமிழெழுத்துப் பெயர்ப்பாக வழங்குகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலத்தில் நேரடியாக வரும் உடன்படிக்கைப் பெயரை ஒரு பட்டப்பெயராக மாற்றாமல் வைத்திருக்கிறது; ‘யாவே’ என்பது Yahweh என்பதற்கான இயல்பான தமிழெழுத்துப் பெயர்ப்பு.
- issue: שָׁלוֹם என்பதன் சூழல்சார் பொருள்
  choice: உனக்கு நலமே
  alternative: நீ பாதுகாப்பாக இருப்பாய்; உனக்குச் சமாதானம் உண்டு
  rationale: இங்கு சொல் வெறும் உள்ளார்ந்த அமைதியைக் குறிக்காமல் தாவீதின் பாதுகாப்பு மற்றும் நல்வாழ்வைக் குறிக்கிறது. ‘நலமே’ அந்தப் பொருள் பரப்பை அளவுக்கு மீறிச் சுருக்கவில்லை.
- issue: חַי יְהוָה என்ற ஆணைச் சூத்திரம்
  choice: யாவே உயிரோடிருப்பது எவ்வளவு உறுதியோ, அவ்வளவு உறுதி
  alternative: யாவே உயிரோடிருக்கிறார்
  rationale: தனித்த அறிக்கையாகத் தவறாகப் புரிந்துகொள்ளப்படாமல், முன் கூறிய வாக்குறுதியை உறுதிப்படுத்தும் ஆணையாக அதன் செயல்பாட்டை வெளிப்படுத்துகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், மரியாதையும் கதைநடையின் உடனடித் தன்மையும் இணைக்கப்பட்டுள்ளன. பழமையான ‘இதோ பார்’ போன்ற இரட்டிப்பு தவிர்க்கப்பட்டு, முதல் הִנֵּהக்கு ‘பார்’ என்றும் சுட்டுக்காட்டும் இரண்டாவது הִנֵּהக்கு ‘இதோ’ என்றும் வேறுபடுத்தப்பட்டுள்ளது. திசைச்சுட்டின் உண்மையான நிச்சயமின்மை அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
