  yaml_path: translation/ot/1_samuel/020/027.yaml
  text: And it happened on the next day[a], the second day of the new moon, that David’s place was empty. So Saul said to Jonathan his son, “Why has the son of Jesse not come to the meal either yesterday or today?”
translation:
  language: ta
  text: மறுநாள், அமாவாசையின் இரண்டாம் நாளில், தாவீதின் இடம் காலியாக இருந்தது. அப்போது சவுல் தன் மகன் யோனத்தானிடம், “ஈசாயின் மகன் நேற்றும் இன்றும் உணவுக்கு[a] வரவில்லை ஏன்?” என்று கேட்டான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “அப்பத்திற்கு”; இங்கு இது உணவையோ உணவுப் பந்தியில் ஒன்றுகூடுவதையோ குறிக்கும் வழக்குச் சொல்.
