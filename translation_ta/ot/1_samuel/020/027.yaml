lexical_decisions:
- source_word: מִמָּחֳרַת הַחֹדֶשׁ הַשֵּׁנִי
  choice: அமாவாசையின் இரண்டாம் நாளான மறுநாளிலும்
  rationale: இந்தச் சூழலில் חֹדֶשׁ என்பது அமாவாசை அனுசரிப்பைக் குறிக்கிறது; הַשֵּׁנִי அதன் இரண்டாம் நாளைக் குறிக்கிறது. முந்தைய நாளோடு உள்ள தொடர்ச்சியைத் தெரிவிக்க מִמָּחֳרַת என்பதற்கு ‘மறுநாள்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: וַיִּפָּקֵד מְקוֹם דָּוִד
  choice: தாவீதின் இடம் காலியாக இருந்தது
  rationale: இங்கு פקד என்பதன் நிபால் வடிவம், உணவுப் பந்தியில் தாவீதுக்குரிய இடம் ஆளின்றிக் காணப்பட்டதைத் தெரிவிக்கிறது; இயல்பான தமிழில் ‘காலியாக இருந்தது’ அந்தப் பொருளைத் தெளிவாக வழங்குகிறது.
- source_word: בְּנוֹ
  choice: தன் மகன்
  rationale: சவுலுக்கும் யோனத்தானுக்கும் இடையிலான தந்தை–மகன் உறவை மூலத்தைப் போலவே வெளிப்படையாகப் பேணுகிறது.
- source_word: בֶן יִשַׁי
  choice: ஈசாயின் மகன்
  rationale: சவுல் தாவீதின் பெயரைச் சொல்லாமல் தந்தையின் பெயரால் குறிப்பிடும் சொல்லாட்சி மற்றும் அதிலுள்ள இடைவெளித் தொனி பேணப்படுகிறது.
- source_word: גַּם תְּמוֹל גַּם הַיּוֹם
  choice: நேற்றும் இன்றும்
  rationale: எபிரெயச் சொற்றொடரின் இரு நாட்களையும் உள்ளடக்கும் வலியுறுத்தலை இயல்பான தமிழில் நேரடியாகப் பேணுகிறது.
- source_word: אֶל הַלָּחֶם
  choice: உணவுக்கு
  rationale: לֶחֶם என்பதன் அடிப்படைப் பொருள் ‘அப்பம்’; ஆனால் இங்கு அது முழு உணவையும் குறிக்கும் ஆகுபெயராக வருவதால், சூழலுக்கேற்ற இயல்பான தமிழாக ‘உணவுக்கு’ தேர்ந்தெடுக்கப்பட்டுள்ளது.
