  register: நவீன நிலையான தமிழில், எளிதில் புரியும் அதேவேளையில் கண்ணியமான உரைநடை பயன்படுத்தப்பட்டது. எபிரெய மூலத்தின் இரண்டு தொடர்ச்சியான செயல்களும் தெளிவாக வைக்கப்பட்டுள்ளன; தேவையற்ற சமயப்பிரிவு சார்ந்த விளக்கங்கள் சேர்க்கப்படவில்லை.
