base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/033.yaml
  text: Then Saul hurled the spear at him to strike him[a], and Jonathan knew that his father was determined to put David to death.
translation:
  language: ta
  text: அப்போது சவுல் அவனைத் தாக்குவதற்காக அவன்மேல் ஈட்டியை எறிந்தான். தாவீதைக் கொல்லத் தன் தந்தை உறுதியாக முடிவுசெய்துவிட்டார் என்பதை யோனத்தான் அறிந்துகொண்டான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּטֶל
  choice: எறிந்தான்
  rationale: வினைச்சொல் எறிதல் அல்லது வீசுதல் என்பதைக் குறிக்கிறது; பகைமையான செயலை இயல்பான நவீன தமிழில் ‘எறிந்தான்’ தெளிவாகத் தெரிவிக்கிறது.
- source_word: הַחֲנִית
  choice: ஈட்டியை
  rationale: இது ஈட்டி அல்லது எறியீட்டி வகை ஆயுதத்தைக் குறிக்கும் பொதுவான சொல்; இச்சூழலில் ‘ஈட்டி’ இயல்பாகவும் போதுமான துல்லியத்துடனும் உள்ளது.
- source_word: עָלָיו
  choice: அவன்மேல்
  rationale: எறிதல் வினையுடன் சேர்ந்து தாக்குதலின் இலக்கையும் பகைமையான திசையையும் குறிக்கிறது.
- source_word: לְהַכֹּתוֹ
  choice: அவனைத் தாக்குவதற்காக
  rationale: לְ உடன் வரும் வினையெச்சம் நோக்கத்தை வெளிப்படுத்துகிறது; נכה என்பதன் தாக்குதல் அல்லது அடித்தல் என்ற பொருளை இச்சூழலில் இயல்பாகக் காட்டுகிறது.
- source_word: וַיֵּדַע
  choice: அறிந்துகொண்டான்
  rationale: ידע என்பது அறிதலைக் குறிக்கிறது; முன் நிகழ்ந்த தாக்குதலால் யோனத்தான் உணர்ந்து உறுதிப்பட்டதை தமிழில் இவ்வடிவம் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: כָלָה הִיא מֵעִם אָבִיו
  choice: தன் தந்தை உறுதியாக முடிவுசெய்துவிட்டார்
  rationale: எபிரெய மொழிவழக்கு, சவுலின் தரப்பில் காரியம் முடிவாகத் தீர்மானிக்கப்பட்ட நிலையைச் சுட்டுகிறது; முடிவின் உறுதியையும் நிறைவையும் இத்தமிழாக்கம் காக்கிறது.
- source_word: לְהָמִית אֶת דָּוִד
  choice: தாவீதைக் கொல்ல
  rationale: המית இங்கு தாவீதுக்கு மரணத்தை ஏற்படுத்துதல் என்ற நேரடியான நோக்கத்தைக் குறிக்கிறது; ‘கொல்ல’ தெளிவான, இயல்பான தமிழ்.
- source_word: יְהוֹנָתָן
  choice: யோனத்தான்
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் நிலைபெற்ற பெயர்வடிவம்.
- source_word: שָׁאוּל
  choice: சவுல்
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் நிலைபெற்ற பெயர்வடிவம்.
- source_word: דָּוִד
  choice: தாவீது
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் நிலைபெற்ற பெயர்வடிவம்; வேற்றுமையில் ‘தாவீதைக்’ என வருகிறது.
