  text: So Jonathan made a covenant with the house of David, and the LORD sought it from the hand of David’s enemies.
translation:
  language: ta
  text: இவ்வாறு யோனத்தான் தாவீதின் வீட்டாருடன் ஓர் உடன்படிக்கை செய்தான்; ஆண்டவர் தாவீதின் பகைவர்களின் கையிலிருந்து அதைக் கோருவாராக[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் ‘அதை’ என்பதற்கான சொல் வெளிப்படையாக இல்லை. இந்தத் தொடர், ஆண்டவர் தாவீதின் பகைவர்களிடமிருந்து கணக்குக் கேட்க வேண்டும் என்ற வேண்டுதல் அல்லது சாபமொழியாகப் புரிந்துகொள்ளப்படலாம். சொற்சொல்லாக, ‘ஆண்டவர் தாவீதின் பகைவர்களின் கையிலிருந்து கோரினார்/கோருவாராக’ என்று அமையும்.
    reason: மூலத்தின் இறந்தகால வடிவமும் சூழலால் உணர்த்தப்படும் வேண்டுதல்/சாபமொழிப் பயன்பாடும், வெளிப்படையற்ற பொருளும் வாசகருக்குத் தெரிவிக்கப்பட வேண்டும்.
lexical_decisions:
- source_word: וַיִּכְרֹת ... עִם
  choice: '...ஓர் உடன்படிக்கை செய்தான்'
  rationale: ‘வெட்டினான்’ என்பது எபிரெய மொழிமரபின் சொற்பொருள்; தமிழில் உடன்படிக்கை ஏற்படுத்துவதை இயல்பாகவும் தெளிவாகவும் தெரிவிக்க ‘உடன்படிக்கை செய்தான்’ என மொழிபெயர்க்கப்பட்டது. முந்தைய வசனத்தின் உடன்படிக்கைப் பொருள் இங்கு தொடர்கிறது.
- source_word: בֵּית דָּוִד
  choice: தாவீதின் வீட்டார்
  rationale: בֵּית என்பது இங்கு கட்டடத்தை அல்ல, தாவீதின் குடும்பம்/வம்சத்தைச் சுட்டுகிறது. ‘வீட்டார்’ இரண்டையும் இயல்பாக உள்ளடக்குகிறது.
- source_word: וּבִקֵּשׁ יְהוָה
  choice: ஆண்டவர் ... தேடிக் கேட்பாராக
  rationale: בקש என்பதன் அடிப்படை ‘தேடு’; ‘ஒருவரின் கையிலிருந்து தேடுதல்’ என்ற அமைப்பில் அது பொறுப்புக் கேட்பதையும் தண்டனை கோருவதையும் குறிக்கலாம். உடன்படிக்கைச் சூழலில் உள்ள வேண்டுதல்/சாபமொழியின் வலிமையை தமிழின் ‘கேட்பாராக’ வடிவம் வெளிப்படுத்துகிறது; ‘தேடிக்’ என்பது மூலத்தின் உருவகத்தைப் பாதுகாக்கிறது.
- source_word: מִיַּד אֹיְבֵי דָוִד
  choice: தாவீதின் பகைவர்களின் கையிலிருந்து
  rationale: ‘கையிலிருந்து’ என்ற எபிரெய உருவகம் பொறுப்பு மற்றும் தீர்ப்பை உணர்த்துகிறது; அதை விளக்கமாக மாற்றாமல் பாதுகாத்துள்ளோம்.
theological_decisions:
- issue: இறைவன் உடன்படிக்கையை மீறுவோரிடம் கணக்குக் கேட்பது அல்லது தண்டிப்பது
  choice: ‘தேடிக் கேட்பாராக’ என்ற திறந்த வடிவம்
  alternative: ‘தாவீதின் பகைவர்களைத் தண்டிப்பாராக’
  rationale: ‘தண்டிப்பாராக’ என்பது சூழலுக்குப் பொருத்தமான விளக்கம் என்றாலும், மூலத்தில் உள்ள ‘தேடுதல்/கையிலிருந்து கேட்டல்’ என்ற மறைமுகமான நீதித்தீர்ப்பு மொழியை முழுமையாகத் தீர்மானித்துவிடும். ஆகவே மூலத்தின் இறையியல் அழுத்தத்தையும் ஓரளவு தெளிவின்மையையும் பாதுகாத்தோம்.
- issue: வினையின் காலம்/நிலை
  choice: வேண்டுதல் அல்லது சாபமொழியாக ‘கேட்பாராக’
  alternative: இறந்தகாலமாக ‘ஆண்டவர் தேடிக் கேட்டார்’
  rationale: எபிரெய வடிவம் தொடர் இறந்தகால வடிவில் தோன்றினாலும், உடன்படிக்கை ஏற்படுத்தும் சூழலில் இக்கூற்று இறைவனைச் சாட்சியாக அழைக்கும் விளைவுரை அல்லது சாபமொழியாகப் பொதுவாகப் புரிந்துகொள்ளப்படுகிறது. அடிக்குறிப்பில் சொல் வடிவின் நேரடி வாசிப்பு பதிவு செய்யப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டது. ‘யோனத்தான்’, ‘தாவீது’, ‘ஆண்டவர்’ ஆகிய பரவலாக அறியப்பட்ட வேதாகமப் பெயர்/இறைப்பெயர் வடிவங்கள் பயன்படுத்தப்பட்டன. மூலத்தின் உடன்படிக்கைச் சூழலும் நீதித்தீர்ப்பு உருவகமும் பாதுகாக்கப்பட்டுள்ளன.
