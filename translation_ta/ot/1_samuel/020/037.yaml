- from: யோனத்தான் எய்த அம்பு கிடந்த இடத்திற்கு அந்தச் சிறுவன் வந்தபோது, யோனத்தான் அவனுக்குப் பின்னால் கூப்பிட்டு, “அம்பு உனக்கு அப்பால் அல்லவா இருக்கிறது?[a]” என்றான்.
