base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/037.yaml
  text: When the boy came to the place of the arrow that Jonathan had shot[a], Jonathan called after the boy and said, “Is not the arrow beyond you?”
translation:
  language: ta
  text: யோனத்தான் எய்த அம்பு இருந்த இடத்திற்கு அந்தச் சிறுவன் வந்தபோது, யோனத்தான் அந்தச் சிறுவனைப் பின்னால் இருந்து கூப்பிட்டு, “அம்பு உனக்கு அப்பால் அல்லவா இருக்கிறது?[a]” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அம்பு உன்னைக் கடந்து மேலும் அப்பால் அல்லவா இருக்கிறது?” எபிரெயத் தொடர் சொல்லர்த்தமாக, “உன்னிடமிருந்து மேலும் அப்பால்” என்று பொருள்படும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: வந்தபோது
  rationale: בוא என்பதன் இயல்பான கதைநடைப் பொருள் ‘வந்தான்’; அடுத்த பிரதான செயலுடன் இணைக்கத் தமிழில் ‘வந்தபோது’ என அமைப்பது இயல்பானது.
- source_word: הַנַּעַר
  choice: அந்தச் சிறுவன்
  rationale: נַעַר என்பது சிறுவன், இளைஞன், பணியாள் ஆகிய பொருள்களைத் தரலாம்; இச்சூழலில் யோனத்தானின் இளம் உதவியாளனைக் குறிப்பதால் ‘சிறுவன்’ பொருத்தமானது.
- source_word: עַד מְקוֹם הַחֵצִי
  choice: அம்பு கிடந்த இடத்திற்கு
  rationale: சொல்லுக்குச் சொல் ‘அம்பின் இடத்திற்கு’; தமிழில் இருப்பிடத்தைத் தெளிவாகவும் இயல்பாகவும் காட்ட ‘அம்பு கிடந்த இடத்திற்கு’ என மொழிபெயர்க்கப்பட்டது.
- source_word: אֲשֶׁר יָרָה יְהוֹנָתָן
  choice: யோனத்தான் எய்த
  rationale: ירה இங்கு அம்பை எய்வதைக் குறிக்கிறது; பெயரெச்சத் தொடரான ‘யோனத்தான் எய்த’ தமிழ் கதைநடையில் இயல்பாக உள்ளது.
- source_word: וַיִּקְרָא ... אַחֲרֵי
  choice: அவனுக்குப் பின்னால் கூப்பிட்டு
  rationale: קרא ... אחרי என்பது முன்னால் செல்பவனைப் பின்னிருந்து அழைப்பதைக் குறிக்கிறது; ‘அவனுக்குப் பின்னால் கூப்பிட்டு’ திசை உறவைத் தக்கவைக்கிறது.
- source_word: הֲלוֹא
  choice: அல்லவா
  rationale: ஒப்புதலை எதிர்பார்க்கும் எபிரெய வினாவைத் தமிழில் இயல்பான ‘அல்லவா’ வடிவம் பாதுகாக்கிறது.
- source_word: הַחֵצִי
  choice: அம்பு
  rationale: חֵץ என்பதற்கான இச்சூழலின் வழக்கமான, தெளிவான தமிழ் சொல் ‘அம்பு’.
- source_word: מִמְּךָ וָהָלְאָה
  choice: உனக்கு அப்பால்
  rationale: இத்தொடர் சொல்லர்த்தத்தில் ‘உன்னிடமிருந்து மேலும் அப்பால்’ எனும் இடப்பொருளைக் கொண்டது; ‘உனக்கு அப்பால்’ சுருக்கமாகவும் இயல்பாகவும் அந்தத் தெளிவை வழங்குகிறது.
