  source_fidelity: The threefold Hebrew blessing with שָׁלוֹם is accurately represented, and ‘நலம்’ suitably conveys its broad welfare sense. The difficult לֶחָי is reasonably rendered as a life-blessing, while the footnote preserves the principal literal alternatives and acknowledges uncertainty.
