translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையான ஒருமை (‘உமது’, ‘உமக்கு’) பயன்படுத்தப்பட்டுள்ளது. எபிரெய மூவடுக்கான நல்வாழ்த்தைத் தெளிவாகப் பாதுகாக்க ‘நலம் உண்டாவதாக’ மூன்று முறை மீள்கிறது. அரிதான לֶחָי என்பதன் தெளிவின்மை முதன்மை உரையில் இயல்பான வாழ்த்தாகவும் அடிக்குறிப்பில் மாற்று வாசிப்புகளுடனும் தரப்பட்டுள்ளது.
