  text: וַ/אֲמַרְתֶּ֥ם כֹּ֖ה לֶ/חָ֑י וְ/אַתָּ֤ה שָׁלוֹם֙ וּ/בֵיתְ/ךָ֣ שָׁל֔וֹם וְ/כֹ֥ל אֲשֶׁר לְ/ךָ֖ שָׁלֽוֹם־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/006.yaml
  text: 'And say this: ‘To the living one: Peace to you[a], peace to your house[b], and peace to all that is yours.’'
translation:
  language: ta
  text: 'நீங்கள் அவரிடம் இவ்வாறு சொல்லுங்கள்: ‘நீண்ட நாள் வாழ்க![a] உமக்கு நலம்[b] உண்டாவதாக; உமது வீட்டுக்கும் நலம் உண்டாவதாக; உமக்குச் சொந்தமான அனைத்திற்கும் நலம் உண்டாவதாக.’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயச் சொற்றொடரைச் சொற்சொல்லாகப் புரிந்துகொண்டால், ‘வாழ்கிறவனுக்கு’ அல்லது ‘வாழ்வுக்கு’ என்று பொருள் கொள்ளலாம். இங்கு அது வாழ்த்து அல்லது ஆசியாகப் பயன்பட்டிருக்கலாம்; எனவே ‘நீண்ட நாள் வாழ்க!’ என்று மொழிபெயர்க்கப்பட்டுள்ளது. ‘வாழ்த்துகள்’ என்பதும் சாத்தியம்.
    reason: alternative_reading
  - marker: b
    text: ‘நலம்’ என்று மொழிபெயர்க்கப்பட்டுள்ள எபிரெயச் சொல் ஷாலோம்; அது அமைதி, நல்வாழ்வு, முழுமை, செழிப்பு ஆகிய பொருள்களையும் தாங்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲמַרְתֶּם
  choice: நீங்கள் அவரிடம் ... சொல்லுங்கள்
  rationale: கட்டளையின் தொடர்ச்சியாக வரும் எபிரெய வாவ் + நிறைவுவினை இங்கு கட்டளைப் பொருளைக் கொண்டுள்ளது. தமிழில் பன்மை எழுவாயையும், செய்தி நாபாலிடம் சொல்லப்படுவதையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: כֹּה
  choice: இவ்வாறு
  rationale: அடுத்து வரும் நேரடி உரையை அறிமுகப்படுத்தும் சுட்டுச் சொல்லை இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: לֶחָי
  choice: நீடூழி வாழ்க!
  rationale: சொற்றொடர் அரிதானதும் பொருள் தெளிவில்லாததும் ஆகும்; சூழலில் இது வாழ்வை வேண்டுகிற வாழ்த்து அல்லது ஆசியாக இருப்பது மிகச் சாத்தியம். சொற்சொல்லான ‘வாழ்கிறவனுக்கு’ என்பதைவிட இது தமிழில் இயல்பாக அந்த வாழ்த்துப் பொருளைத் தருகிறது; வேறு வாசிப்புகள் அடிக்குறிப்பில் பாதுகாக்கப்படுகின்றன.
- source_word: וְאַתָּה שָׁלוֹם
  choice: உமக்கு நலம் உண்டாவதாக
  rationale: வினையில்லா எபிரெய வாக்கியம் நல்வாழ்வு வேண்டுதலை வெளிப்படுத்துகிறது. மரியாதையான ஒருமையைத் தக்கவைத்து தமிழில் இயல்பான ஆசிவடிவில் மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: וּבֵיתְךָ שָׁלוֹם
  choice: உமது வீட்டுக்கும் நலம் உண்டாவதாக
  rationale: ‘வீடு’ என்பது கட்டிடத்தையும் வீட்டாரையும் உள்ளடக்கக்கூடிய எபிரெய உருவகத்தின் அகலத்தைத் தமிழிலும் ஓரளவு பாதுகாக்கிறது.
- source_word: וְכֹל אֲשֶׁר לְךָ שָׁלוֹם
  choice: உமக்குள்ள எல்லாவற்றுக்கும் நலம் உண்டாவதாக
  rationale: உடைமைகள், சார்ந்தவர்கள், பராமரிப்பிலுள்ளவை ஆகிய அனைத்தையும் உள்ளடக்கக்கூடிய விரிவான ஆசியாக மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: שָׁלוֹם
  choice: நலம்
  rationale: இச்சூழலில் שָׁלוֹם என்பது மோதலின்மை மட்டுமல்லாமல் நல்வாழ்வு, முழுமை, செழிப்பு ஆகியவற்றையும் குறிக்கிறது. வாழ்த்துச் சூழலில் ‘நலம்’ இயல்பாகவும் அகன்ற பொருளுடனும் அமைகிறது; மூன்று முறை வரும் அமைப்பும் தக்கவைக்கப்பட்டுள்ளது.
