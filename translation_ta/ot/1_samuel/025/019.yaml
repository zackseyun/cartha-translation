  text: She said to her young men[a], “Go on ahead of me. Look, I am coming behind you.” But she did not tell her husband Nabal.
translation:
  language: ta
  text: அவள் தன் இளம் பணியாளர்களிடம், “நீங்கள் எனக்கு முன்னால் செல்லுங்கள். இதோ, நான் உங்களுக்குப் பின்னால் வருகிறேன்[a]” என்றாள். ஆனால் தன் கணவன் நாபாலிடம் அவள் இதைச் சொல்லவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இதோ, நான் உங்களுக்குப் பின் வருகிறேன்.”
    reason: הִנְנִי-யின் சுட்டுரையையும் אַחֲרֵיכֶם என்பதன் ‘உங்களுக்குப் பின்/பின்னால்’ என்ற இடவியல் மாற்றையும் நேரடியாகக் காட்டும் சொல்வழி மாற்று.
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: அவள் ... என்றாள்
  rationale: வழக்கமான எபிரெயக் கதைத் தொடரை இயல்பான தமிழில் அடுத்த நிகழ்வாகக் கூறுகிறது; தனியான இணைப்புச்சொல் தேவையில்லை.
- source_word: לִנְעָרֶיהָ
  choice: தன் இளம் பணியாளர்களிடம்
  rationale: נַעַר என்பதன் ‘இளைஞன்’ மற்றும் சூழலுக்குரிய ‘பணியாளர்’ ஆகிய இரு நுணுக்கங்களையும் இச்சொற்றொடர் காக்கிறது.
- source_word: עִבְרוּ לְפָנַי
  choice: நீங்கள் எனக்கு முன்னால் செல்லுங்கள்
  rationale: இங்கு עבר என்பது கடந்து செல்வதைவிட ஒருவருக்கு முன்னதாகச் செல்வதைக் குறிக்கிறது; לְפָנַי அதன் இடவியல் பொருளைத் தெளிவாக்குகிறது.
- source_word: הִנְנִי
  choice: இதோ
  rationale: பேசுகிறவர் தமது உடனடி அல்லது உறுதியான செயலைக் கவனத்திற்குக் கொண்டுவரும் சுட்டிடைச்சொல்லின் வலிமையைச் சுருக்கமாகக் காக்கிறது.
- source_word: אַחֲרֵיכֶם בָּאָה
  choice: நான் உங்களுக்குப் பின்னால் வருகிறேன்
  rationale: பெண்பால் ஒருமை வினையெச்சம் நிகழவிருக்கும்/நடைபெறும் செயலைக் குறிக்கிறது; אַחֲרֵיכֶם என்பதன் இடவியல் ‘உங்களுக்குப் பின்னால்’ என்ற பொருளும் காக்கப்படுகிறது.
- source_word: וּלְאִישָׁהּ נָבָל לֹא הִגִּידָה
  choice: ஆனால் தன் கணவன் நாபாலிடம் அவள் இதைச் சொல்லவில்லை
  rationale: אִישׁ இச்சூழலில் ‘கணவன்’; எதிர்மறை வேறுபாட்டை וְ குறிக்கும் என்பதால் ‘ஆனால்’ இயல்பானது. ‘இதை’ என்பது தமிழில் சொல்லப்படாத கருப்பொருளை இயல்பாகச் சுட்டுகிறது.
