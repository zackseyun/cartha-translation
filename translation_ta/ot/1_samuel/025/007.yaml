base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/007.yaml
  text: And now I have heard that you have shearers. Now your shepherds[a], who were with us, we did not mistreat, and nothing of theirs was missing all the days they were in Carmel.
translation:
  language: ta
  text: இப்போது உனக்காக ஆடுகளின் மயிரைக் கத்தரிக்கிறார்கள் என்று கேள்விப்பட்டேன். இப்போது, உன் மேய்ப்பர்கள் எங்களோடு இருந்தபோது, நாங்கள் அவர்களை அவமதிக்கவில்லை[a]; அவர்கள் கர்மேலில் இருந்த காலமெல்லாம் அவர்களுக்குரிய எதுவும் காணாமல் போகவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, இன்னும் சொற்சொல்லாக, “அவர்களுக்கு அவமானம் ஏற்படுத்தவில்லை.” எபிரெயச் சொல் ஒருவரை இழிவுக்கும் அவமானத்துக்கும் உள்ளாக்குவதைக் குறிக்கலாம்; இச்சூழலில் நாபாலின் மேய்ப்பர்களைத் துன்புறுத்தாமையையும் அது உள்ளடக்குகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: இப்போது
  rationale: இணைப்பையும் தற்போதைய வேண்டுகோளுக்கான காலமாற்றத்தையும் இயல்பான தமிழில் குறிக்கிறது; வசனத் தொடக்கத்தில் தனியாக ‘மேலும்’ சேர்ப்பது தமிழில் கனமாக இருக்கும்.
- source_word: שָׁמַעְתִּי כִּי
  choice: என்று கேள்விப்பட்டேன்
  rationale: அண்மையில் கிடைத்த செய்தியை அறிமுகப்படுத்தும் எபிரெய நிறைவேற்ற வினையையும் כִּי இணைப்பையும் இயல்பான தமிழ் மேற்கோள் அமைப்பில் தருகிறது.
- source_word: גֹזְזִים לָךְ
  choice: உன்னிடம் ஆடுகளின் மயிரைக் கத்தரிப்பவர்கள் வந்திருக்கிறார்கள்
  rationale: சொல்லுக்கு நெருக்கமாக ‘உனக்குக் கத்தரிப்பவர்கள்’ என்று கூறுவது தமிழில் தெளிவற்றது. சூழலில் இது நாபாலின் ஆடுமயிர் கத்தரிப்புக் காலத்தைக் குறிக்கிறது; ‘வந்திருக்கிறார்கள்’ அந்த நிகழ்நிலையை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: הָרֹעִים אֲשֶׁר לְךָ הָיוּ עִמָּנוּ
  choice: உன் மேய்ப்பர்கள் எங்களோடு இருந்தபோது
  rationale: உடைமையைக் குறிக்கும் நீண்ட எபிரெய அமைப்பை இயல்பான தமிழ் உரிமைத் தொடராக மாற்றி, עִם என்பதன் ‘உடன்’ பொருளைப் பேணுகிறது.
- source_word: לֹא הֶכְלַמְנוּם
  choice: நாங்கள் அவர்களை அவமதிக்கவில்லை
  rationale: כלם என்பதன் அவமானம் அல்லது இழிவு ஏற்படுத்துதல் என்ற அடிப்படைப் பொருளைப் பேணுகிறது. சூழலில் துன்புறுத்தாமையும் உட்படலாம்; அதை அடிக்குறிப்பு விளக்குகிறது.
- source_word: וְלֹא נִפְקַד לָהֶם מְאוּמָה
  choice: அவர்களுடையது எதுவும் காணாமற்போகவில்லை
  rationale: נפקד என்பதன் காணாமற்போதல் அல்லது கணக்கில் இல்லாமற்போதல் என்ற பொருளையும், לָהֶם குறிக்கும் அவர்களுக்குரியவற்றையும் தெளிவாகத் தருகிறது.
- source_word: כָּל יְמֵי הֱיוֹתָם בַּכַּרְמֶל
  choice: அவர்கள் கர்மேலில் இருந்த காலமெல்லாம்
  rationale: முழுக் கால அளவையும் இடப்பெயரான கர்மேலையும் இயல்பான நவீன தமிழில் பேணுகிறது.
