translation_notes:
  register: நவீன நிலையான தமிழில், நேரடியானதாயும் கண்ணியமானதாயும் மொழிபெயர்க்கப்பட்டுள்ளது. உரையாடலின் ஒருமை இரண்டாம் நபர் ‘உன்/உன்னிடம்’ எனப் பேணப்பட்டுள்ளது. ‘கர்மேல்’ இங்கு யூதாவிலுள்ள இடப்பெயராக எடுத்துக்கொள்ளப்பட்டுள்ளது.
