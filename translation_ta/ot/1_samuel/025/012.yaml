translation_notes:
  register: நவீன நிலையான தமிழ்; எபிரெயக் கதைநடையின் தொடர்ச்சியான இயக்கத்தைப் பேணியபடியே, சொல்லுக்குச் சொல் அசட்டுத்தன்மையைத் தவிர்க்கும் கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் நடை. ‘அப்போது’ என்பது wayyiqtol கதைத் தொடரை இயல்பான தமிழில் இணைக்கிறது.
