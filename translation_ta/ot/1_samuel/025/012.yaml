base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/012.yaml
  text: So David’s young men turned back on their way[a], and they returned and came and told him all these words.
translation:
  language: ta
  text: தாவீதின் இளைஞர்கள் தங்கள் வழிக்குத் திரும்பினார்கள்; அவர்கள் திரும்பி வந்து, இந்த வார்த்தைகளையெல்லாம் அவருக்குத் தெரிவித்தார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இந்தக் காரியங்களையெல்லாம்.” எபிரெயச் சொல் பேசப்பட்ட வார்த்தைகளையோ காரியங்கள்/நிகழ்வுகளையோ குறிக்கலாம்; இங்கு நாபால் கூறிய பதில் அறிவிக்கப்படுவதால், இந்த மொழிபெயர்ப்பில் “வார்த்தைகள்” எனத் தரப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּהַפְכוּ
  choice: திரும்பி
  rationale: הפך இங்கு பயணத் திசையை மாற்றித் திரும்புவதைக் குறிக்கிறது; ‘திரும்பி’ என்பது இயல்பான தமிழாகவும் அடுத்துள்ள שׁוב வினையுடன் சேர்ந்து எபிரெய இயக்கத் தொடரைச் சுருக்காமல் வெளிப்படுத்துவதாகவும் உள்ளது.
- source_word: נַעֲרֵי דָוִד
  choice: தாவீதின் இளைஞர்கள்
  rationale: נַעַר என்பது சூழலுக்கேற்ப இளைஞன், பணியாள் அல்லது உதவியாளர் எனப் பொருள்படலாம். இங்கு ‘இளைஞர்கள்’ வயது/நிலை நுணுக்கத்தைப் பேணுகிறது; பணியாளர் நிலையைத் தேவையின்றி உறுதிப்படுத்தவில்லை.
- source_word: לְדַרְכָּם
  choice: தாங்கள் வந்த வழியே
  rationale: சொல்லளவில் ‘தங்கள் வழிக்கு’ என்றாலும், திரும்பிச் செல்லும் பயணச் சூழலில் அவர்கள் வந்த பாதையிலேயே மீண்டதைத் தெளிவான, இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: וַיָּשֻׁבוּ וַיָּבֹאוּ
  choice: திரும்பி, அவரிடம் வந்து
  rationale: இரு இயக்க வினைகளையும் பேணி, அவர்கள் மீண்டு தாவீதிடம் வந்த நிகழ்வை இயல்பான தமிழ் வாக்கியத் தொடரில் வழங்குகிறது. ‘அவரிடம்’ என்பது அடுத்துள்ள לוֹ குறிக்கும் தாவீதைக் கொண்டு இயல்பாக நிறைவு செய்யப்படுகிறது.
- source_word: וַיַּגִּדוּ לוֹ
  choice: அவருக்குத் தெரிவித்தார்கள்
  rationale: נגד இங்கு செய்தியை அறிவித்தல் அல்லது அறிக்கையிடுதலைக் குறிக்கிறது. ‘தெரிவித்தார்கள்’ என்பது நவீனத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் உள்ளது.
- source_word: כְּכֹל הַדְּבָרִים הָאֵלֶּה
  choice: இந்த வார்த்தைகளையெல்லாம்
  rationale: דְּבָרִים என்பது ‘வார்த்தைகள்’ அல்லது ‘காரியங்கள்/விஷயங்கள்’ என இருவகையாக அமையலாம். முந்தைய வசனத்தில் நாபால் கூறிய பதில் அறிக்கையிடப்படுவதால், ‘வார்த்தைகள்’ இங்கு முன்னுரிமை பெறுகிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
