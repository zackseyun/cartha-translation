  yaml_path: translation/ot/1_samuel/025/034.yaml
  text: But as Yahweh[a], the God of Israel, lives, who has kept me from harming you, if you had not hurried and come to meet me, surely by the light of morning not one male would have been left to Nabal.
translation:
  language: ta
  text: '“ஆனாலும், உனக்குத் தீங்கு செய்யாதபடி என்னைத் தடுத்த இஸ்ரவேலின் கடவுளாகிய யாவே உயிரோடிருப்பதன் பேரில் உறுதியாகச் சொல்கிறேன்: நீ விரைந்து என்னைச் சந்திக்க வந்திருக்காவிட்டால், விடியற்கால வெளிச்சத்திற்குள் நாபாலுக்குரிய ஆண்மகன் ஒருவன்கூட மீந்திருக்க மாட்டான்.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאוּלָם
  choice: ஆனாலும்
  rationale: முந்தைய சூழலுடன் முரண்பாட்டைச் சுட்டும் உரையாடல் இணைப்பாக இயல்பான நவீனத் தமிழ் வடிவம்.
- source_word: חַי יְהוָה
  choice: யாவே உயிரோடிருப்பது எவ்வளவு நிச்சயமோ, அவ்வளவு நிச்சயமாகச் சொல்கிறேன்
  rationale: எபிரெய உறுதிமொழிச் சூத்திரத்தின் தீவிரத்தையும் உயிருள்ள யாவேயைச் சாட்சியாகக் கூறும் வலிமையையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: திருநாமமான YHWH-ஐ பட்டப்பெயராக மாற்றாமல் தமிழ் ஒலிபெயர்ப்பில் வழங்குகிறது.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் கடவுள்
  rationale: எபிரெய இணைநிலைத் தொடரை நேராகவும் இயல்பாகவும் மொழிபெயர்க்கிறது.
- source_word: אֲשֶׁר מְנָעַנִי מֵהָרַע אֹתָךְ
  choice: உனக்குத் தீங்கு செய்யாதபடி என்னைத் தடுத்த
  rationale: מנע என்பதன் ‘தடுத்தல்/கட்டுப்படுத்தல்’ பொருளையும், சூழலில் הרע குறிக்கும் தீங்கு விளைவித்தலையும் தெளிவாகக் காக்கிறது.
- source_word: כִּי לוּלֵי מִהַרְתְּ וַתָּבֹאתִי לִקְרָאתִי
  choice: நீ விரைந்து என்னைச் சந்திக்க வந்திராவிட்டால்
  rationale: அபிகாயிலை நோக்கிய இரண்டாம் நபர் பெண்பால் ஒருமையையும் கடந்தகால எதிர்நிகழ்வு நிபந்தனையையும் இயல்பான தமிழில் பிரதிபலிக்கிறது.
- source_word: עַד אוֹר הַבֹּקֶר
  choice: விடியற்கால வெளிச்சம் வருவதற்குள்
  rationale: சொல்லாட்சியின் ‘காலை வெளிச்சம்’ படிமத்தைக் காத்து கால எல்லையைத் தெளிவுபடுத்துகிறது.
- source_word: לְנָבָל
  choice: நாபாலுக்குரிய
  rationale: לְ குறிக்கும் உறவு அல்லது உடைமைப் பொருளை, நாபாலின் வீட்டாரைக் குறிப்பதாக இயல்பாக வெளிப்படுத்துகிறது.
- source_word: מַשְׁתִּין בְּקִיר
  choice: ஆண்மகன் ஒருவன்கூட
  rationale: சொற்பொருளில் கடுமையான ‘சுவரில் சிறுநீர் கழிப்பவன்’ என்ற ஆண்பாலாரைக் குறிக்கும் மரபுத்தொடரின் சூழல் பொருளை முதன்மை உரையில் வாசிக்கத்தக்க வகையில் தருகிறது; சொற்படிவம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைநாமத்தின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூலத்தில் வரும் தனிப்பட்ட உடன்படிக்கைத் திருநாமத்தை பொதுவான பட்டப்பெயராக மாற்றாமல் பாதுகாக்கிறது.
- issue: தாவீதின் உறுதிமொழியின் வடிவம்
  choice: யாவே உயிரோடிருப்பதைக் கொண்டு உறுதிசெய்யும் உறுதிமொழியாக வெளிப்படுத்தப்பட்டது
  alternative: ‘யாவே உயிரோடிருக்கிறார்’ என்று மட்டும் சொற்படி வழங்குதல்
  rationale: חַי יְהוָה என்பது இங்கு வெறும் இறையியல் கூற்று அல்ல; அடுத்து வரும் எதிர்நிகழ்வு முடிவின் உறுதியை வலியுறுத்தும் வழக்கமான எபிரெய உறுதிமொழிச் சூத்திரம்.
translation_notes:
  register: நவீன நிலையான தமிழில் கண்ணியமான, ஆனால் தாவீதின் கடுமையான உறுதிமொழித் தொனியை மழுங்கச் செய்யாத நடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய மரபுத்தொடரின் கரடுமுரடான சொற்படிவம் முதன்மை உரையை இயல்பற்றதாக்காமல் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
