translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘வனாந்தரம்’ வேதாகமச் சூழலைத் தக்கவைத்தாலும் ‘பாலைவனம்’ என்ற மிகக் குறுகிய பொருளைத் தவிர்க்கிறது; ‘மயிர் கத்தரித்தல்’ செயலைத் தெளிவாகச் சொல்கிறது.
