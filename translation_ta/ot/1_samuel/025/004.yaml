source:
  edition: WLC
  text: וַ/יִּשְׁמַ֥ע דָּוִ֖ד בַּ/מִּדְבָּ֑ר כִּֽי גֹזֵ֥ז נָבָ֖ל אֶת צֹאנֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/004.yaml
  text: David heard in the wilderness that Nabal was shearing his sheep[a].
translation:
  language: ta
  text: தாவீது வனாந்தரத்தில் இருந்தபோது, நாபால் தன் ஆடுகளின் மயிரைக் கத்தரித்துக்கொண்டிருந்ததாகக் கேள்விப்பட்டார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, விரிவான பொருளில், ‘தன் மந்தையின் மயிரை.’ எபிரெயச் சொல் சிறிய கால்நடைகளை மொத்தமாகக் குறிக்கலாம்; மயிர் கத்தரிக்கும் இச்சூழலில் ‘ஆடுகள்’ என்பது மிகவும் பொருத்தமானது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: கேள்விப்பட்டார்
  rationale: שׁמע இங்கு கடந்தகாலக் கதைநிகழ்வைக் குறிக்கிறது. தமிழில் ஒரு செய்தியை அறிந்துகொண்டதைக் இயல்பாகக் காட்ட ‘கேள்விப்பட்டார்’ பொருத்தமானது; ‘கேட்டார்’ என்பது நேரடியாக ஒலியைக் கேட்டார் என்ற பொருளையும் தரக்கூடும்.
- source_word: בַּמִּדְבָּר
  choice: வனாந்தரத்தில் இருந்தபோது
  rationale: מִדְבָּר என்பது மணற்பாலை மட்டும் அல்லாமல் மக்கள் குடியிருப்பு குறைந்த திறந்த வனப்பகுதியையும் குறிக்கலாம். இத்தொடர் தாவீது செய்தியைக் கேட்டபோது இருந்த இடத்தைக் குறிப்பதாகத் தமிழில் இயல்பாக வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: כִּי
  choice: என்பதாக
  rationale: כִּי இங்கு தாவீது கேள்விப்பட்ட செய்தியின் உள்ளடக்கத்தை அறிமுகப்படுத்துகிறது; தமிழ் மறைமுகக் கூற்றில் ‘என்பதாக’ இதை இயல்பாகக் குறிக்கிறது.
- source_word: גֹזֵז
  choice: மயிர் கத்தரித்துக்கொண்டிருப்பதாக
  rationale: גֹזֵז என்பது தொடர்ந்துகொண்டிருந்த செயலைக் காட்டும் பங்கேற்புவினை. ‘கத்தரித்துக்கொண்டிருப்பதாக’ அதன் நிகழ்நிலைத் தொடர்ச்சியைப் பாதுகாக்கிறது.
- source_word: נָבָל
  choice: நாபால்
  rationale: எபிரெய தனிப்பெயரின் ஒலியை நவீனத் தமிழில் தெளிவாக எழுத்துப்பெயர்த்த வடிவம்.
- source_word: אֶת צֹאנוֹ
  choice: தன் ஆடுகளுக்கு
  rationale: צֹאן சிறிய கால்நடைகளின் மந்தையை மொத்தமாகக் குறிக்கலாம். மயிர் கத்தரிக்கும் சூழலில் ‘ஆடுகள்’ இயல்பானதும் பொருத்தமானதும்; தமிழின் உடைமைத் தொடர்பை ‘தன்’ தெளிவுபடுத்துகிறது.
