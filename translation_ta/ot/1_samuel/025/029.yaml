  to: ஒருவன் எழுந்து உம்மைத் துரத்தவும் உமது உயிரைத் தேடவும் செய்தாலும், என் ஆண்டவரின் உயிர் உமது கடவுளாகிய யாவேயோடு உயிர்வாழ்வோரின் மூட்டையில் கட்டப்பட்டிருக்கும்[a]. ஆனால் உமது பகைவர்களின் உயிரை அவர் கவணின் குழியிலிருந்து எறிந்துவிடுவார்[b].
  rationale: The revision corrects the associative sense of ‘with Yahweh,’ preserves the Hebrew idiom ‘seek your life’ without unnecessary specification, and more explicitly retains the intentional sling imagery. Footnote a is anchored immediately after the phrase it explains; footnote b remains at the sling clause.
