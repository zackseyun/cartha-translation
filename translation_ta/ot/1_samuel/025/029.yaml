  register: நவீன நிலையான தமிழில், அபிகாயில் தாவீதிடம் பேசும் மரியாதையை ‘உம்மை/உமது’ மற்றும் ‘என் ஆண்டவர்’ மூலம் காத்துள்ளோம். வாக்கியம் கண்ணியமானதாகவும் சாதாரண வாசகர்களுக்குப் புரியத்தக்கதாகவும் வைக்கப்பட்டுள்ளது; மூலத்தின் மூட்டை–கவண் உருவகங்கள் சமய விளக்கமாக மாற்றப்படாமல் நிலைநிறுத்தப்பட்டுள்ளன.
