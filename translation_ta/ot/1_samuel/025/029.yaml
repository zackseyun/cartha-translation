base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/029.yaml
  text: Though a man has risen to pursue you and to seek your life[a], yet the life of my lord shall be bound in the bundle of the living with Yahweh your God[b], and the lives of your enemies he shall sling out from the hollow of the sling.
translation:
  language: ta
  text: ஒருவன் எழுந்து உம்மைத் துரத்தவும் உமது உயிரைத் தேடவும் செய்தாலும், என் ஆண்டவரின் உயிர் உமது கடவுளாகிய யாவேயோடு உயிர்வாழ்வோரின் மூட்டையில் கட்டப்பட்டிருக்கும்[a]. ஆனால் உமது பகைவர்களின் உயிரை அவர் கவணின் குழியிலிருந்து எறிந்துவிடுவார்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'வேறு வகையில்: ‘வாழ்வின் மூட்டையில் கட்டப்பட்டிருக்கும்.’ எபிரெய உருவகம், பாதுகாப்பாக வைப்பதற்காக ஒன்றை உறுதியாகப் பொதிந்து கட்டுவதைக் காட்டுகிறது.'
    reason: lexical_alternative
  - marker: b
    text: இந்த வினை குறிப்பாகக் கவணால் எறியும் செயலைக் குறிக்கிறது. ‘உயிர்வாழ்வோரின் மூட்டையில் கட்டப்பட்டிருத்தல்’ என்பதற்கு வேண்டுமென்றே எதிர்மறையாக இது அமைந்துள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם אָדָם
  choice: ஒருவன் ... எழுந்தாலும்
  rationale: வாவ் + நிறைவுற்ற வினை இங்கு அபிகாயிலின் கூற்றில் விட்டுக்கொடுக்கும் சூழ்நிலையை அறிமுகப்படுத்துகிறது. ஆண்பால் ஒருமையான אָדָם, சூழலில் தாவீதைத் துரத்தும் குறிப்பிட்ட மனிதனைக் குறிக்கிறது.
- source_word: לִרְדָפְךָ
  choice: உம்மைத் துரத்தி
  rationale: רדף பகைமையான சூழலில் தொடர்ந்து துரத்துவதைக் குறிக்கிறது; மரியாதை ஒருமையான ‘உம்மை’ அபிகாயில் தாவீதிடம் பேசும் நடைக்கு ஏற்றது.
- source_word: וּלְבַקֵּשׁ אֶת נַפְשֶׁךָ
  choice: உமது உயிரைப் பறிக்க
  rationale: நேரடியான ‘உமது உயிரைத் தேட’ என்பது தமிழில் இயல்பற்றது. இங்கு נֶפֶשׁ உயிரையும், בקשׁ உயிரைக் கொல்ல நாடுவதையும் குறிப்பதால், நோக்கத்தை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: נֶפֶשׁ אֲדֹנִי
  choice: என் ஆண்டவரின் உயிர்
  rationale: נֶפֶשׁ இங்கு ‘ஆத்துமா’ என்ற தனித்த தத்துவப் பொருளை அல்ல, ஒருவரின் உயிரை குறிக்கிறது; אֲדֹנִי என்பதன் மரியாதை அழைப்பும் காக்கப்படுகிறது.
- source_word: צְרוּרָה בִּצְרוֹר הַחַיִּים
  choice: உயிர்வாழ்வோரின் மூட்டையில் கட்டிவைக்கப்பட்டிருக்கும்
  rationale: காப்பிற்காக ஒன்றை மூட்டையில் உறுதியாகக் கட்டிவைக்கும் உருவகத்தைத் தக்கவைக்கிறது. הַחַיִּים என்பதன் பன்மை சார்ந்த ‘உயிர்வாழ்வோர்’ பொருளும் வெளிப்படுகிறது.
- source_word: אֵת יְהוָה אֱלֹהֶיךָ
  choice: உமது கடவுளாகிய யாவேயிடம்
  rationale: אֵת இங்கு உடனிருப்பு அல்லது பாதுகாப்பான அண்மையை உணர்த்துகிறது. தமிழில் ‘யாவேயிடம்’ என்பது உருவகத்தின் காப்பு உணர்வை இயல்பாகத் தருகிறது; திருப்பெயர் பெயராகவே ஒலிபெயர்க்கப்படுகிறது.
- source_word: וְאֵת נֶפֶשׁ אֹיְבֶיךָ
  choice: ஆனால் உமது பகைவர்களின் உயிரை
  rationale: எபிரெயத்தில் ஒருமையான נֶפֶשׁ, பன்மையான பகைவர்களைத் தொகுப்பாகக் குறிக்கிறது. எதிர்மறை ஒப்புமையைத் தெளிவாக்க வாவ் ‘ஆனால்’ என வழங்கப்படுகிறது.
- source_word: יְקַלְּעֶנָּה
  choice: அவர் ... வீசியெறிவார்
  rationale: קלע என்பது கவணால் எறியும் குறிப்பிட்ட செயலைக் குறிக்கிறது. அடுத்துள்ள கவண் உருவகத்துடன் சேர்ந்து தமிழ் வினை அதன் வன்மையான அகற்றலை வெளிப்படுத்துகிறது; மறைமுக எழுவாய் யாவே.
- source_word: בְּתוֹךְ כַּף הַקָּלַע
  choice: கவணின் குழியிலிருந்து
  rationale: כַּף என்பதன் ‘உள்ளங்கை/குழிவு’ உருவம் இங்கு கல்லைத் தாங்கும் கவணின் நடுப்பகுதியைக் குறிக்கிறது. ‘குழி’ அந்தக் காட்சியை சுருக்கமாகத் தக்கவைக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: திருநான்கெழுத்துப் பெயரை ஒரு பொதுப் பட்டத்தால் மாற்றாமல், தமிழில் அறியத்தக்க ஒலிபெயர்ப்பாக வழங்குகிறது.
theological_decisions:
- issue: தாவீதின் பாதுகாப்புக்கும் பகைவர்களின் அழிவுக்கும் இடையிலான உருவக எதிர்மறை
  choice: மூட்டையில் கட்டிவைத்தல் மற்றும் கவணிலிருந்து வீசியெறிதல் ஆகிய இரு தெளிவான உருவகங்களையும் காக்குதல்
  alternative: இவற்றை நித்திய ஜீவனைப் பற்றிய வெளிப்படையான போதனையாக விளக்குதல் அல்லது பொதுவான ‘பாதுகாப்பு/தோல்வி’ மொழியாகச் சமப்படுத்துதல்
  rationale: வசனம் கடவுள் தாவீதைக் காப்பதையும் அவரது பகைவர்களை அகற்றுவதையும் வலுவான பொருள் உருவகங்களால் கூறுகிறது; பிற்கால மறுமை வாழ்வு கோட்பாட்டை இதில் சேர்க்கவில்லை.
- issue: נֶפֶשׁ என்பதன் பொருள்
  choice: உயிர்
  alternative: ஆத்துமா
  rationale: இரு இடங்களிலும் நபரின் உயிரே ஆபத்திற்குள்ளாகுதல் அல்லது காக்கப்படுதல் என்ற சூழல் உள்ளது; உடலிலிருந்து பிரிந்த ஆத்துமா என்ற பொருளை உரை கட்டாயப்படுத்தவில்லை.
- issue: தெய்வீகப் பெயர் יְהוָה
  choice: யாவே
  alternative: கர்த்தர் / ஆண்டவர்
  rationale: மூலத்தில் உள்ள தனிப்பட்ட தெய்வீகப் பெயரைப் பட்டமாக மாற்றாமல் பாதுகாக்கிறது.
