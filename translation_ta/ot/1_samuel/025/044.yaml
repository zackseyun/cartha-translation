  text: Saul had given Michal his daughter[a], David’s wife, to Palti son of Laish, who was from Gallim.
translation:
  language: ta
  text: சவுல் தன் மகளும் தாவீதின் மனைவியுமான மீகாலை, கல்லீமைச் சேர்ந்தவனான லாயீசின் மகன் பல்திக்குக் கொடுத்திருந்தான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/שָׁאוּל
  choice: சவுல்
  rationale: ו எனும் இணைப்புச்சொல் இங்கு கதைத் தொடர்ச்சியைச் சுட்டுகிறது; தமிழில் தனியாக ‘இப்போது’ அல்லது ‘மேலும்’ என்று சேர்க்காமல் இயல்பான தொடர்ச்சியாக விடப்பட்டுள்ளது.
- source_word: נָתַן
  choice: கொடுத்திருந்தான்
  rationale: சுற்றியுள்ள நிகழ்வுகளுக்கு முன்பே முடிந்த செயலை எபிரெய qatal வடிவம் தெரிவிப்பதால், தமிழ் இறந்தகால முற்றுநிலையைப் பயன்படுத்துகிறது.
- source_word: מִיכַל בִּתּוֹ אֵשֶׁת דָּוִד
  choice: தன் மகளும் தாவீதின் மனைவியுமான மீகாலை
  rationale: மீகால் சவுலின் மகளாகவும் தாவீதின் மனைவியாகவும் அடையாளப்படுத்தப்படுவதை இயல்பான தமிழ் தொடர்பெயர் அமைப்பில் காக்கிறது.
- source_word: לְפַלְטִי בֶן לַיִשׁ
  choice: லாயீசின் மகன் பல்திக்கு
  rationale: எபிரெய தந்தைவழி அடையாளத்தை இயல்பான தமிழ் சொல் வரிசையில் வழங்குகிறது; பெயர்கள் மூலமொழியின் ஒலியைப் பின்பற்றி எழுத்துப்பெயர்க்கப்பட்டுள்ளன.
- source_word: אֲשֶׁר מִגַּלִּים
  choice: கல்லீமைச் சேர்ந்த
  rationale: மִן முன்னொட்டு பல்தியின் ஊர்சார்பைச் சுட்டுவதால், நவீன தமிழில் இயல்பான ‘சேர்ந்த’ என்று மொழிபெயர்க்கப்பட்டுள்ளது.
