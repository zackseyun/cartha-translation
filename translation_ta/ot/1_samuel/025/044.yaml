translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்கு எளிதாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘தன் மகளும் தாவீதின் மனைவியுமான’ என்ற அமைப்பு இரு உறவுகளையும் தெளிவாக இணைக்கிறது; ‘கொடுத்திருந்தான்’ முந்திய நிறைவுற்ற செயலை வெளிப்படுத்துகிறது.
