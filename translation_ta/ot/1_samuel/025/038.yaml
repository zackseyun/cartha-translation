  source_fidelity: 'எபிரெய மூலத்தின் நிகழ்வுத் தொடரும் தோராயமான காலக்குறிப்பும் துல்லியமாகப் பாதுகாக்கப்பட்டுள்ளன: “ஏறக்குறைய பத்து நாட்களுக்குப் பிறகு” என்பது כַּעֲשֶׂרֶת הַיָּמִים என்பதன் தோராயப் பொருளைச் சரியாகத் தருகிறது. “யாவே நாபாலைத் தாக்கினார்; அவன் இறந்தான்” என்பது וַיִּגֹּף … וַיָּמֹת என்ற இரு தனித்த தொடர்வினைகளையும் காரணத் தொடர்பை அளவுக்கு மீறி ஒன்றாக்காமல் வழங்குகிறது.'
