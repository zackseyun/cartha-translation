source:
  edition: WLC
  text: וַ/יְהִ֖י כַּ/עֲשֶׂ֣רֶת הַ/יָּמִ֑ים וַ/יִּגֹּ֧ף יְהוָ֛ה אֶת נָבָ֖ל וַ/יָּמֹֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/038.yaml
  text: And about ten days later[a], Yahweh struck Nabal, and he died.
translation:
  language: ta
  text: ஏறக்குறைய பத்து நாட்களுக்குப் பிறகு[a], யாவே நாபாலைத் தாக்கினார்; அவன் இறந்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஏறக்குறைய பத்து நாட்கள் கழிந்தபோது.” எபிரெயச் சொற்றொடர் பத்து நாட்கள் என்பது தோராயமான கால அளவு என்பதைக் காட்டுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: பிறகு
  rationale: இந்தக் கதைத்தொடர் வடிவம் அடுத்த நிகழ்வை அறிமுகப்படுத்துகிறது. தமிழில் இயல்பான காலத் தொடரை அமைக்க, காலக்குறிப்புடன் இணைந்த ‘பிறகு’ பயன்படுத்தப்பட்டது.
- source_word: כַּעֲשֶׂרֶת הַיָּמִים
  choice: ஏறக்குறைய பத்து நாட்களுக்குப் பிறகு
  rationale: ‘பத்து’ என்பதற்கு முன் வரும் כְּ தோராயத்தைக் குறிக்கிறது; ஆகவே கால அளவும் அடுத்த நிகழ்வுடனான தொடர்பும் தெளிவாகப் பாதுகாக்கப்படுகின்றன.
- source_word: וַיִּגֹּף
  choice: தாக்கினார்
  rationale: נָגַף என்பது அடித்தல் அல்லது தாக்குதல் என்ற நேரடியான பொருளைக் கொண்டது; தாக்குதலின் உடல் செயல்முறையை உரை குறிப்பிடாததால் அதைச் சேர்க்காமல் பொதுவான வினை தேர்ந்தெடுக்கப்பட்டது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய தனிப்பெயரான יהוה தமிழில் ஒலிபெயர்க்கப்பட்டது; பொதுப்பட்டமான ‘ஆண்டவர்’ என்று மாற்றப்படவில்லை.
- source_word: אֶת נָבָל
  choice: நாபாலை
  rationale: אֶת நேரடி செயப்படுபொருள் குறியீடு தமிழில் தனியாக மொழிபெயர்க்கப்படாது; நாபால் என்ற பெயர் செயப்படுபொருள் வேற்றுமையுடன் வழங்கப்பட்டது.
- source_word: וַיָּמֹת
  choice: அவன் இறந்தான்
  rationale: இரண்டாவது தொடர்வினை தனி நிகழ்வாக நேரடியாக மொழிபெயர்க்கப்பட்டது; ‘சாகடித்தார்’ என இரு வினைகளையும் ஒன்றாக்காமல் எபிரெய உரையின் வரிசை பாதுகாக்கப்பட்டது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: ஆண்டவர் / யெகோவா
  rationale: மூலத்தில் பொதுப்பட்டம் அல்ல, இறைவனின் தனிப்பெயர் உள்ளது. எனவே அதைத் தமிழில் ஒலிபெயர்த்து அதன் தனிப்பெயர் இயல்பைப் பாதுகாக்கிறது.
- issue: இறைத் தீர்ப்பின் காரணத் தொடர்பு
  choice: யாவே நாபாலைத் தாக்கினார்; அவன் இறந்தான்
  alternative: யாவே நாபாலைச் சாகடித்தார்
  rationale: எபிரெய உரை ‘தாக்கினார்’ மற்றும் ‘இறந்தான்’ என்ற இரு தொடர்வினைகளைப் பயன்படுத்துகிறது. தேர்ந்த வடிவம் இறைச் செயலைத் தெளிவாகக் கூறினாலும், அவற்றை ஒரே விளக்கமிகு வினையாகச் சுருக்காமல் உரையின் வரிசையையும் அழுத்தத்தையும் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிமையும் கண்ணியமும் கொண்ட கதையுரை. ‘தாக்கினார்’ என்ற மரியாதை வினை இறைவனுக்குப் பயன்படுத்தப்பட்டு, நாபாலைச் சுட்டும் வினை இயல்பான ஒருமை வடிவில் உள்ளது. அரைப்புள்ளி மூலத்தின் இரு தொடர்ச்சியான, ஆனால் தனித்த வினைநிகழ்வுகளைத் தெளிவாக வைத்திருக்கிறது.
