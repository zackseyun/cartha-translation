  source_fidelity: 'மூல எபிரெய உரையின் அனைத்துக் கூறுகளும் துல்லியமாகப் பிரதிபலிக்கப்பட்டுள்ளன: தாவீதின் பேச்சு, அபிகாயிலுக்கான முகவரி, யாவே என்ற தனிப்பட்ட இறைப்பெயர், “இஸ்ரவேலின் கடவுள்” என்ற அடையாளம், அபிகாயிலை அனுப்பிய செயல், காலக்குறிப்பு, மற்றும் தாவீதைக் சந்திக்கும் நோக்கம் ஆகியவை முழுமையாக உள்ளன. “போற்றப்படுவாராக” என்பது בָּרוּךְ என்ற இறைப்புகழ்ச்சி வாய்பாட்டிற்கு பொருத்தமான தமிழ் வடிவமாகும்.'
