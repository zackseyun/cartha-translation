source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר דָּוִ֖ד לַ/אֲבִיגַ֑ל בָּר֤וּךְ יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל אֲשֶׁ֧ר שְׁלָחֵ֛/ךְ הַ/יּ֥וֹם הַ/זֶּ֖ה לִ/קְרָאתִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/032.yaml
  text: David said to Abigail[a], “Blessed be Yahweh, the God of Israel, who sent you this day to meet me.”
translation:
  language: ta
  text: தாவீது அபிகாயிலிடம், “இன்று[a] உன்னை என்னைச் சந்திக்க அனுப்பிய இஸ்ரவேலின் கடவுளாகிய யாவே போற்றப்படுவாராக!” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரெய மொழியில் சொல்லுக்குச் சொல்: “இந்த நாள்”; “இந்த நாளில்” என்றும் மொழிபெயர்க்கலாம்.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: என்றான்
  rationale: தொடர்கதை வரிசையைக் குறிக்கும் வாவ்-தொடர்ச்சியுடன் வந்த பேச்சுவினை இது. நவீன தமிழில் உரையாடலுக்குப் பின் வரும் “என்றான்” இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: לַאֲבִיגַל
  choice: அபிகாயிலிடம்
  rationale: לְ முன்னொட்டு பேச்சு யாரை நோக்கிச் சொல்லப்பட்டது என்பதைக் குறிக்கிறது; தமிழில் “-இடம்” இயல்பான இணைவு.
- source_word: בָּרוּךְ
  choice: போற்றப்படுவாராக
  rationale: இது கடவுளைப் புகழ்ந்து வாழ்த்தும் நிலையான ஆசீர்வாத வாய்பாடு. “போற்றப்படுவாராக” உயர்ந்த, புரிந்துகொள்ளத்தக்க தமிழில் அந்த இறைப்புகழ்ச்சித் தன்மையைப் பேணுகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய தனிப்பெயரான יהוה-ஐ ஒரு பொதுப் பட்டமாக மாற்றாமல், தமிழில் பரவலாக அறியப்படும் ஒலிபெயர்ப்பு வடிவில் தருகிறது.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் கடவுளாகிய
  rationale: இணைநிலை அமைப்பில் யாவேவை இஸ்ரவேலின் கடவுள் என அடையாளப்படுத்துகிறது; “-ஆகிய” தமிழில் அடுத்துவரும் பெயருடன் இயல்பாக இணைக்கிறது.
- source_word: שְׁלָחֵךְ
  choice: உன்னை ... அனுப்பிய
  rationale: பெண்பால் ஒருமை இரண்டாம் நபர் பின்னொட்டையும் நிறைவேறிய அனுப்புதல் செயலையும் தெளிவாகக் காட்டுகிறது.
- source_word: הַיּוֹם הַזֶּה
  choice: இன்று
  rationale: சொல்லுக்குச் சொல் “இந்த நாள்” என்றாலும், சூழலில் “இன்று” என்பது அதே காலக் குறிப்பை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: לִקְרָאתִי
  choice: என்னைச் சந்திக்க
  rationale: לִקְרַאת் இங்கு ஒருவரை எதிர்கொண்டு சந்திப்பதைக் குறிக்கிறது; நோக்கத்தைக் காட்டும் வினையெச்ச வடிவம் தமிழில் பொருத்தமானது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூல உரை ஒரு தனிப்பட்ட இறைப்பெயரை நேரடியாகப் பயன்படுத்துகிறது. அதை “ஆண்டவர்” என்ற பட்டமாக மாற்றாமல் “யாவே” என ஒலிபெயர்ப்பது மூலத்தின் வேறுபாட்டைப் பேணுகிறது.
- issue: בָּרוּךְ என்ற இறைப்புகழ்ச்சி வாய்பாடு
  choice: போற்றப்படுவாராக
  alternative: ஆசீர்வதிக்கப்பட்டவர்
  rationale: இங்கு மனிதர் கடவுளுக்கு நன்மை வழங்குவதாக அல்ல, அவரைப் புகழ்ந்து வாழ்த்துவதாகப் பொருள். “போற்றப்படுவாராக” அந்த இறையியல் நுணுக்கத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் வகையிலும் இறைப்புகழ்ச்சிக்குரிய கண்ணியமான நடையிலும் வடிவமைக்கப்பட்டது. உரையாடல் தமிழின் இயல்பான சொல்லமைப்பில் தரப்பட்டுள்ளது; பெயர்களும் இறைப்பெயரும் ஒலிபெயர்க்கப்பட்டுள்ளன.
