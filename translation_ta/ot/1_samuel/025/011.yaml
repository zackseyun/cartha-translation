base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/011.yaml
  text: Should I take my bread and my water and my meat that I have slaughtered for my shearers[b][a], and give it to men whom I do not know where they are from?
translation:
  language: ta
  text: “என் அப்பத்தையும், என் தண்ணீரையும், என் செம்மறியாடுகளின் மயிரைக் கத்தரிப்பவர்களுக்காக[b] நான் அறுத்த இறைச்சியையும் எடுத்து, எங்கிருந்து வந்தவர்கள் என்று எனக்குத் தெரியாத மனிதர்களுக்குக் கொடுப்பேனா[a]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இன்னும் சொற்சொல்லாக, “நான் எடுப்பேன் ... நான் கொடுப்பேன்” எனலாம்; எபிரெயத்தில் நிறைவுவினை வடிவங்கள் வினாவியல் பொருளில் பயன்படுத்தப்பட்டுள்ளன.
    reason: lexical_alternative
  - marker: b
    text: “மயிரைக் கத்தரிப்பவர்கள்” என்பது செம்மறியாடுகளின் மயிரைக் கத்தரிக்கும் வேலையைச் செய்தவர்களைக் குறிக்கிறது.
    reason: cultural_note
lexical_decisions:
- source_word: וְלָקַחְתִּי
  choice: எடுத்து ... கொடுப்பேனா
  rationale: இது வடிவியல் அடிப்படையில் இணைப்புடன் வந்த முதலாம் நபர் ஒருமை நிறைவுவினை என்றாலும், இங்குள்ள சினம்கொண்ட வினாவியல் சூழலில் ‘நான் எடுத்துக் கொடுப்பேனா?’ என்ற ஆலோசனை/எதிர்கால வினாவாக இயங்குகிறது.
- source_word: לַחְמִי
  choice: என் அப்பம்
  rationale: ‘அப்பம்’ என்பது நேரடியான பொருள்; பொதுவாக உணவையும் குறிக்கக்கூடியதாயினும், இங்கு உணவுப் பொருட்களின் தெளிவான பட்டியலைப் பாதுகாக்கிறது.
- source_word: מֵימַי
  choice: என் தண்ணீர்
  rationale: மூலத்தின் நேரடியான பொருளையும் நாபாலின் பேச்சிலுள்ள ‘என்’ என்ற உடைமை வலியுறுத்தலையும் காக்கிறது.
- source_word: טִבְחָתִי ... טָבַחְתִּי
  choice: நான் வெட்டிய இறைச்சி
  rationale: பெயர்ச்சொல்லும் வினைச்சொல்லும் ஒரே வெட்டுதல்/அறுத்தல் வேரிலிருந்து வந்துள்ளன. இயல்பான தமிழில் விலங்குகளை உணவுக்காக வெட்டித் தயாரித்த இறைச்சியை இது தெளிவாகக் குறிக்கிறது; ‘விருந்து’ என்று பொதுமைப்படுத்தவில்லை.
- source_word: לְגֹזְזָי
  choice: என் ஆடுகளின் உரோமத்தைக் கத்தரிப்பவர்கள்
  rationale: இது ‘கத்தரிப்பவர்கள்’ என்று பொருள்படும் பங்கேற்புவினை வடிவம். கதைச்சூழலில் அவர்கள் செம்மறியாடுகளின் உரோமத்தைக் கத்தரிக்கும் தொழிலாளர்கள்; இயல்பான தமிழுக்காக அந்தச் சூழல் வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: וְנָתַתִּי
  choice: கொடுப்பேனா
  rationale: முந்தைய וְלָקַחְתִּי என்பதுடன் இணைந்து ஒரே சினம்கொண்ட வினாவை உருவாக்குவதால் தமிழில் இறுதியில் வினை வடிவமாக அமைக்கப்பட்டுள்ளது.
- source_word: לָאֲנָשִׁים
  choice: மனிதர்களுக்கு
  rationale: எபிரெயச் சொல்லின் ஆண்பால் பன்மையை நேரடியாகப் பிரதிபலிக்கிறது; ‘மக்களுக்கு’ என்று பொதுமைப்படுத்தவில்லை.
- source_word: אֲשֶׁר לֹא יָדַעְתִּי
  choice: எனக்குத் தெரியாத
  rationale: ידע என்பதன் இங்குள்ள அறிதல்/அறிமுகம் இல்லாமை என்ற உறவுசார் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: אֵי מִזֶּה הֵמָּה
  choice: எங்கிருந்து வந்தவர்கள்
  rationale: இந்த எபிரெய மரபுத்தொடர் அவர்களுடைய பிறப்பிடம் அல்லது வந்த இடத்தை வினவுகிறது; ‘எங்கிருந்து வந்தவர்கள்’ என்பது அதன் இயல்பான நவீனத் தமிழ் வடிவம்.
