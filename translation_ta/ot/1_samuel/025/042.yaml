  yaml_path: translation/ot/1_samuel/025/042.yaml
  text: Abigail quickly got up and rode on the donkey, with five of her young women going after her; she went after David's messengers and became his wife.
translation:
  language: ta
  text: அபிகாயில் விரைவாக எழுந்து, கழுதையின்மேல் ஏறினாள். அவளுடைய பணிப்பெண்கள் ஐவர் அவளுக்குப் பின்னால் நடந்து சென்றனர். அவள் தாவீதின் தூதர்களைப் பின்தொடர்ந்து சென்று, அவருக்கு மனைவியானாள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתְּמַהֵר וַתָּקָם
  choice: விரைவாக எழுந்து
  rationale: இரு வினைகளின் வேகத்தையும் செயலையும் இயல்பான நவீனத் தமிழில் பாதுகாக்கிறது.
- source_word: נַעֲרֹתֶיהָ
  choice: அவளுடைய பணிப்பெண்கள்
  rationale: இச்சூழலில் அபிகாயிலுடன் சேவைக்குச் செல்லும் இளம் பெண் பணியாளர்களைக் குறிக்கிறது; வெறும் ‘இளம் பெண்கள்’ என்பதைவிட உறவைத் தெளிவாகக் காட்டுகிறது.
- source_word: הַהֹלְכוֹת לְרַגְלָהּ
  choice: அவளுக்குப் பின்னால் நடந்து சென்றனர்
  rationale: ‘அவளுடைய காலடியில்/அவளுடன் கால்நடையாக’ என்ற எபிரேய மரபுத்தொடரின் இச்சூழலுக்குரிய பொருளை இயல்பாக வழங்குகிறது.
- source_word: וַתֵּלֶךְ אַחֲרֵי מַלְאֲכֵי דָוִד
  choice: அவள் தாவீதின் தூதர்களைப் பின்தொடர்ந்து சென்று
  rationale: אַחֲרֵי என்பதன் ‘பின்னால்/பின்தொடர்ந்து’ என்ற இடவியல்-செயற்பாட்டு பொருளையும் מַלְאָךְ என்பதன் மனிதத் தூதர் பொருளையும் காக்கிறது.
- source_word: וַתְּהִי לוֹ לְאִשָּׁה
  choice: அவருக்கு மனைவியானாள்
  rationale: சொற்றொடரின் திருமண உறவைக் குறிக்கும் நேரடியான பொருளைச் சுருக்கமாகவும் மரியாதையாகவும் தருகிறது.
