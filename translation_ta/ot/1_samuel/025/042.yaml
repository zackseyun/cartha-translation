  register: நவீன நிலையான தமிழில், கண்ணியமான கதைநடை. எபிரேய வாக்கியத்தின் தொடர்ச்சியான செயல்கள் தெளிவுக்காக மூன்று தமிழ் வாக்கியங்களாகப் பிரிக்கப்பட்டுள்ளன; புதிய விளக்கத் தகவல் சேர்க்கப்படவில்லை.
