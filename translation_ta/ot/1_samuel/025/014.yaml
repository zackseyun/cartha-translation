translation_notes:
  register: நவீன நிலையான தமிழில், கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘வனாந்தரம்,’ ‘தூதர்கள்,’ ‘எஜமான்’ ஆகியவை சாதாரண வாசகர்களுக்குப் புரியக்கூடிய வேதாகமப் பதிவைத் தக்கவைக்கின்றன. நேரடி உரை இயல்பாக அமைக்கப்பட்டு, மூலத்தின் விறுவிறுப்பும் தெளிவும் பாதுகாக்கப்பட்டுள்ளன.
