base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/014.yaml
  text: But one of the young men told Abigail[a], Nabal’s wife, saying, “Look, David sent messengers from the wilderness to greet our master[b], and he shouted at them.”
translation:
  language: ta
  text: ஆனால் இளைஞர்களில் ஒருவன் நாபாலின் மனைவியான அபிகாயிலிடம், “இதோ, நம் எஜமானை வாழ்த்துவதற்காக[a] தாவீது வனாந்தரத்திலிருந்து தூதர்களை அனுப்பினார்; அப்போது நம் எஜமான் அவர்கள்மேல் சீறினார்[b]” என்று தெரிவித்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘நம் எஜமானை ஆசீர்வதிப்பதற்காக.’ எபிரெய வினைச்சொல் பொதுவாக ‘ஆசீர்வதி’ என்று பொருள்படும்; இங்கு மரியாதையான வாழ்த்து அல்லது நல்வாழ்த்தைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘அவர்கள்மேல் பாய்ந்தார்.’ எபிரெய வினைச்சொல் பாய்ந்து தாக்குவதைப் போன்ற தீவிரமான, ஆக்ரோஷமான எதிர்வினையைச் சித்தரிக்கிறது; இச்சூழலில் அது கடுமையான வாய்மொழி வெடிப்பைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלַאֲבִיגַיִל
  choice: ஆனால் ... அபிகாயிலிடம்
  rationale: வாவ் இணைப்புச்சொல் கதைத் தொடர்ச்சியைக் குறித்தாலும், முந்தைய வசனத்தில் நாபாலின் மறுப்பிலிருந்து அபிகாயிலுக்குச் செய்தி தெரிவிக்கப்படுவதற்கான திருப்பத்தை இங்கு ‘ஆனால்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: אֵשֶׁת נָבָל
  choice: நாபாலின் மனைவி
  rationale: எபிரெயக் கட்டமைப்பின் உறவுப்பொருளை இயல்பான நவீனத் தமிழில் தெளிவாகக் காக்கிறது.
- source_word: הִגִּיד
  choice: தெரிவித்தான்
  rationale: נגד என்பதன் ஹிஃபில் வடிவம் ‘தெரிவி/அறிவி’ என்று பொருள்படும்; வீட்டுப் பணியாளன் அபிகாயிலிடம் செய்தியை அறிவிக்கும் சூழலுக்கு ‘தெரிவித்தான்’ பொருத்தமானது.
- source_word: נַעַר אֶחָד מֵהַנְּעָרִים
  choice: இளைஞர்களில் ஒருவன்
  rationale: נערים வீட்டுப் பணியாளர்களைக் குறிக்கக்கூடியதாயினும், சொல்லின் பரந்த அடிப்படைப் பொருளான ‘இளைஞர்கள்’ என்பதைப் பாதுகாக்கிறது.
- source_word: הִנֵּה
  choice: இதோ
  rationale: கேட்பவரின் கவனத்தை உடனடியாக ஈர்க்கும் எபிரெயச் சுட்டிடைச்சொல்லை, கண்ணியமானதும் வழக்கிலுள்ளதுமான தமிழில் தருகிறது.
- source_word: מַלְאָכִים
  choice: தூதர்கள்
  rationale: இங்கு தாவீது அனுப்பிய மனிதச் செய்தியாளர்களையே குறிக்கிறது; ‘தூதர்கள்’ சூழலுக்குத் தெளிவான சொல்.
- source_word: מֵהַמִּדְבָּר
  choice: வனாந்தரத்திலிருந்து
  rationale: தாவீதும் அவன் ஆட்களும் தங்கியிருந்த குடியிருப்பற்ற வெளிப்பகுதியைக் குறிக்கும் מִדְבָּר என்பதற்கு மரியாதைமிக்க, புரிந்துகொள்ளத்தக்க வேதாகமத் தமிழ்.
- source_word: לְבָרֵךְ
  choice: வாழ்த்துவதற்காக
  rationale: ברך பொதுவாக ‘ஆசீர்வதித்தல்’ எனினும், சமூகச் சந்திப்பில் நல்வாழ்த்து கூறுவதையும் குறிக்கும்; வசனச் சூழலில் தூதர்கள் மரியாதையுடன் வாழ்த்த வந்ததே முன்னிலைப் பொருள்.
- source_word: אֶת אֲדֹנֵינוּ
  choice: நம் எஜமானை
  rationale: இது தெய்வீகப் பட்டம் அல்ல; பணியாளர்கள் நாபாலைக் குறிப்பிடும் வீட்டுச் சமூக உறவை ‘எஜமான்’ தெளிவாக வெளிப்படுத்துகிறது.
- source_word: וַיָּעַט בָּהֶם
  choice: அவர்கள்மேல் சீறினார்
  rationale: עוט இங்கு விரைந்து பாய்வதைப் போன்ற வன்மையான எதிர்வினையை உருவகமாகக் காட்டுகிறது. ‘சீறினார்’ கடுமையான வாய்மொழி வெடிப்பையும் மூலத்தின் தீவிரத்தையும் இயல்பான தமிழில் காக்கிறது.
