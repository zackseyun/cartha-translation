source:
  edition: WLC
  text: כֹּה יַעֲשֶׂ֧ה אֱלֹהִ֛ים לְ/אֹיְבֵ֥י דָוִ֖ד וְ/כֹ֣ה יֹסִ֑יף אִם אַשְׁאִ֧יר מִ/כָּל אֲשֶׁר ל֛/וֹ עַד הַ/בֹּ֖קֶר מַשְׁתִּ֥ין בְּ/קִֽיר־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/022.yaml
  text: May God do so to David’s enemies[a], and more also[b], if by morning I leave so much as one male of all who belong to him.
translation:
  language: ta
  text: “காலைக்குள் அவனுக்குரியவர்களில் ஒரு ஆணையைக்கூட நான் விட்டுவைத்தால், தாவீதின் பகைவர்களுக்கு[a] கடவுள் இப்படிச் செய்யட்டும்; அதைவிட அதிகமாகவும் செய்யட்டும்.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: வழக்கமான ஆணைச் சூத்திரம் தன்னையே சபிப்பதாக இருப்பதால், சில விளக்கவுரையாளர்கள் ‘தாவீதின் பகைவர்கள்’ என்பது ‘தாவீது’ அல்லது ‘நான்’ என்பதற்குப் பதிலாக எழுத்தர்களால் பயன்படுத்தப்பட்ட நயப்படுத்தப்பட்ட மாற்றுச் சொல்லாக இருக்கலாம் என்று கருதுகின்றனர்.
    reason: textual_variant
lexical_decisions:
- source_word: כֹּה ... וְכֹה יֹסִיף
  choice: இப்படிச் செய்யட்டும்; இதைவிட அதிகமாகவும் செய்யட்டும்
  rationale: இது எபிரெய மொழியின் வழக்கமான ஆணை–சாபச் சூத்திரம். அதன் சாப வலிமையையும் மீளுரையின் கருத்தையும் இயல்பான நவீனத் தமிழில் காக்கிறது.
- source_word: אֱלֹהִים
  choice: கடவுள்
  rationale: சொல் வடிவத்தில் பன்மைத் தோற்றம் இருந்தாலும் வினையும் பொருளும் ஒருமையான இறைவனையே குறிக்கின்றன.
- source_word: לְאֹיְבֵי דָוִד
  choice: தாவீதின் பகைவர்களுக்கு
  rationale: சூழலில் எதிர்பார்க்கப்படும் தன்னையே சபிக்கும் வடிவத்துக்கு மாற்றாமல், மசோரெட்டிக் மூலத்தின் கடினமான வாசகத்தை அப்படியே தக்கவைக்கிறது.
- source_word: אִם
  choice: விட்டுவைத்தால்
  rationale: ஆணைச் சூத்திரத்தில் אִם நிபந்தனையை அறிமுகப்படுத்துகிறது; தமிழில் ‘-ஆல்’ விகுதி அந்த அமைப்பை இயல்பாக வெளிப்படுத்துகிறது. இறுதியில் ‘இப்படியே ஆகட்டும்’ என மறைமுக விளைவு தெளிவாக்கப்படுகிறது.
- source_word: אַשְׁאִיר
  choice: நான் மீதியாக விட்டுவைத்தால்
  rationale: ஹிஃபில் வடிவம் ‘மீதியாக இருக்கவிடுதல்’ எனப் பொருள்படும். ‘காப்பாற்றினால்’ என்பது சற்று அதிக விளக்கமாக இருப்பதால் தவிர்க்கப்பட்டது.
- source_word: מִכָּל אֲשֶׁר לוֹ
  choice: அவனுக்குரிய அனைவரிலும்
  rationale: அடுத்த சொற்றொடர் மனிதர்களை, குறிப்பாக ஆண்களை, சுட்டுவதால் பொதுவான உடைமைப் பொருள் நபர்களைக் குறிக்கும் விதத்தில் இயல்பாக மொழிபெயர்க்கப்படுகிறது.
- source_word: עַד הַבֹּקֶר
  choice: காலைவரை
  rationale: குறிக்கப்பட்ட கால எல்லையைச் சுருக்கமாகவும் நேரடியாகவும் தெரிவிக்கிறது.
- source_word: מַשְׁתִּין בְּקִיר
  choice: ஒரே ஓர் ஆணைக்கூட
  rationale: சொல்லுக்கு சொல் ‘சுவரில் சிறுநீர் கழிப்பவன்’ என்ற இழிவான வழக்குச்சொல் ஆணைக் குறிக்கிறது. முதன்மை உரையில் பொருள் தெளிவாக வழங்கப்பட்டு, அதன் கரடுமுரடான மூல உருவகம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
theological_decisions:
- issue: ஆணைச் சூத்திரத்தில் உள்ள மசோரெட்டிக் வாசகம் ‘தாவீதின் பகைவர்கள்’
  choice: முதன்மை உரையில் ‘தாவீதின் பகைவர்களுக்கு’ என்று தக்கவைத்தல்
  alternative: ‘தாவீதுக்கு’ அல்லது ‘எனக்கு’ என்று மறைமுகமாகத் திருத்துதல்
  rationale: கொடுக்கப்பட்ட எபிரெய மூலத்தில் ‘தாவீதின் பகைவர்கள்’ என்றே உள்ளது. வழக்கமான ஆணைச் சூத்திரம் தன்னையே சபிப்பதாக இருப்பதால் வாசகம் கடினமானது; எனினும் அதை அமைதியாகத் திருத்தாமல், மாற்றுப் புரிதலை அடிக்குறிப்பில் வெளிப்படையாகக் குறிப்பிடுவது மூலமொழி முன்னுரிமையையும் உண்மையான தெளிவின்மையையும் காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் கண்ணியமான, ஆனால் ஆணைச் சொல்லின் கடுமையை இழக்காத நடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் கரடுமுரடான ஆண் குறிப்பு முதன்மை உரையில் இயல்பாகவும் அடிக்குறிப்பில் சொல்லுக்கு சொல் விளக்கமாகவும் தரப்பட்டுள்ளது. மசோரெட்டிக் வாசகத்தின் இறையியல் மற்றும் உரைநிலைச் சிக்கல் தீர்த்துவிடப்படாமல் பாதுகாக்கப்பட்டுள்ளது.
