source:
  edition: WLC
  text: וְ/אֶת אֲחִינֹ֛עַם לָקַ֥ח דָּוִ֖ד מִֽ/יִּזְרְעֶ֑אל וַ/תִּהְיֶ֛יןָ גַּֽם שְׁתֵּי/הֶ֥ן ל֖/וֹ לְ/נָשִֽׁים־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/043.yaml
  text: David also took Ahinoam of Jezreel[b][a], and both of them became his wives.
translation:
  language: ta
  text: தாவீது யெஸ்ரயேலைச் சேர்ந்த அகினோவாமையும் மணந்துகொண்டார்; இவ்விருவரும் அவருக்கு மனைவிகளானார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לָקַח
  choice: மணந்துகொண்டார்
  rationale: வினைச்சொல்லின் அடிப்படைப் பொருள் ‘எடுத்துக்கொண்டார்’ என்றாலும், இங்குள்ள திருமணச் சூழலிலும் அடுத்துவரும் ‘மனைவிகளானார்கள்’ என்ற கூற்றிலும் இயல்பான நவீனத் தமிழில் ‘மணந்துகொண்டார்’ என்பதே கருத்தைத் தெளிவாகத் தருகிறது.
- source_word: אֲחִינֹעַם
  choice: அகினோவாம்
  rationale: எபிரெயத் தனிப்பெயரின் ஒலியைத் தமிழில் இயன்றவரை நெருக்கமாக எழுத்துப்பெயர்த்துள்ளது.
- source_word: מִיִּזְרְעֶאל
  choice: யெஸ்ரயேலைச் சேர்ந்த
  rationale: מִן முன்னொட்டுடன் வரும் இடப்பெயர் பிறப்பிடம் அல்லது ஊர்ச் சார்பைக் குறிக்கிறது; ‘யெஸ்ரயேலைச் சேர்ந்த’ என்பது அந்தப் புவியியல் தொடர்பை இயல்பான தமிழில் தருகிறது.
- source_word: וַתִּהְיֶיןָ גַּם שְׁתֵּיהֶן
  choice: இவ்விருவரும் ... ஆனார்கள்
  rationale: பெண்பால் பன்மை வினையும் ‘இருவரும்’ என்ற சொல்லும் அகினோவாமையும் முன் வசனத்தில் கூறப்பட்ட அபிகாயிலையும் சேர்த்துக் குறிக்கின்றன.
- source_word: לְנָשִׁים
  choice: அவருக்கு மனைவிகளானார்கள்
  rationale: לּוֹ לְנָשִׁים என்ற எபிரெய மரபுத்தொடரின் பன்மைத் திருமணப் பொருளை நேரடியாகவும் இயல்பாகவும் காக்கிறது.
- source_word: גַּם
  choice: -ஐயும்
  rationale: அபிகாயிலோடு கூடுதலாக அகினோவாமும் மணக்கப்பட்டார் என்பதைத் தமிழ் இணைப்பும்மை இயல்பாகக் காட்டுகிறது.
theological_decisions:
- issue: பலதார மணத்தை விவரித்தல்
  choice: இரு பெண்களும் தாவீதுக்கு மனைவிகளானார்கள் என்று நேரடியாக விவரித்தல்
  alternative: பன்மைத் திருமணக் குறிப்பை மென்மையாக்குதல் அல்லது மறைத்தல்
  rationale: எபிரெய உரை இருவரும் அவருக்கு மனைவிகளானார்கள் என்று தெளிவாகக் கூறுகிறது. மொழிபெயர்ப்பு இதற்கு ஒழுக்கத் தீர்ப்பைச் சேர்க்காமலும் இதை மறைக்காமலும் இருக்க வேண்டும்.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும் இயல்பான, கண்ணியமான நடை. ‘எடுத்துக்கொண்டார்’ என்ற சொற்சொல் மொழிபெயர்ப்பு தமிழில் தவறாக அல்லது கடினமாக ஒலிக்கக்கூடும் என்பதால் திருமணச் சூழலைத் தெளிவாக்கும் ‘மணந்துகொண்டார்’ பயன்படுத்தப்பட்டது.
