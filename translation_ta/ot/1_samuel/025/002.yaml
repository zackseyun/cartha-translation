base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/002.yaml
  text: There was a man in Maon whose business was in Carmel[a]. The man was very wealthy, and he had three thousand sheep and a thousand goats[b]. He was shearing his sheep in Carmel.
translation:
  language: ta
  text: மாவோனில் ஒரு மனிதன் இருந்தான்; அவனுடைய வணிகம் கார்மேலில் இருந்தது.[a] அவன் மிகவும் செல்வந்தனாக இருந்தான்; அவனிடம் மூவாயிரம் செம்மறியாடுகளும் ஆயிரம் வெள்ளாடுகளும் இருந்தன.[b] அப்போது அவன் கார்மேலில் தன் செம்மறியாடுகளின் மயிரைக் கத்தரித்துக்கொண்டிருந்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவனுடைய வேலை அல்லது உடைமைகள் கார்மேலில் இருந்தன.” எபிரெயச் சொல் ஒருவருடைய வேலை, நடவடிக்கைகள், அல்லது உடைமைகளைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: சொல்லுக்குச் சொல், “அவன் மிகவும் பெரிய மனிதனாக இருந்தான்”; அதாவது, சமூக நிலையிலோ பொருளாதார நிலையிலோ பெரும் செல்வாக்குடையவனாக இருந்தான்.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ
  choice: ஒரு மனிதன்
  rationale: எபிரெயக் கதையாடலில் ஒருவரை அறிமுகப்படுத்தும் இயல்பான வரையறையற்ற தொடர்; தமிழிலும் மிகைப்படுத்தாமல் அதே பொருளைத் தருகிறது.
- source_word: בְּמָעוֹן
  choice: மாவோனில்
  rationale: இடப்பெயர் தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: מַעֲשֵׂהוּ
  choice: அவனுடைய தொழில்
  rationale: இந்தச் சொல் வேலை, செயற்பாடு, உடைமை அல்லது தொழில் சார்ந்த நடவடிக்கைகளைக் குறிக்கலாம்; கால்நடைச் செல்வமும் கார்மேலில் நடந்த மயிர் கத்தரிப்பும் சூழலாக இருப்பதால் ‘தொழில்’ இயல்பாகப் பொருந்துகிறது; பிற சாத்தியங்கள் அடிக்குறிப்பில் வைக்கப்பட்டுள்ளன.
- source_word: הָאִישׁ גָּדוֹל מְאֹד
  choice: அவன் மிகவும் செல்வந்தனாக இருந்தான்
  rationale: சொல்லுக்குச் சொல் ‘மிகப் பெரியவன்’ என்றாலும், உடனே வரும் கால்நடை எண்ணிக்கை பொருளாதாரச் செல்வாக்கைக் காட்டுகிறது; நவீன தமிழில் ‘மிகவும் செல்வந்தன்’ சூழல்சார் பொருளைத் தெளிவாகத் தருகிறது.
- source_word: וְלוֹ צֹאן שְׁלֹשֶׁת אֲלָפִים וְאֶלֶף עִזִּים
  choice: அவனிடம் மூவாயிரம் செம்மறியாடுகளும் ஆயிரம் வெள்ளாடுகளும் இருந்தன
  rationale: உடைமையைக் குறிக்கும் எபிரெய அமைப்பு தமிழில் இயல்பான ‘அவனிடம் ... இருந்தன’ என வழங்கப்பட்டுள்ளது; צֹאן இங்கு עִזִּים என்பதிலிருந்து வேறுபடும் செம்மறியாடுகளைக் குறிக்கிறது.
- source_word: וַיְהִי בִּגְזֹז אֶת־צֹאנוֹ
  choice: அப்போது அவன் ... மயிர் கத்தரித்துக்கொண்டிருந்தான்
  rationale: வழக்கிலிருந்த நிகழ்வுச் சூழலைக் காட்டும் எபிரெயக் கட்டமைப்பு தமிழில் தொடர்நிலை வினையாக வழங்கப்பட்டுள்ளது; ‘அப்போது’ கதையின் சூழ்நிலை மாற்றத்தை இயல்பாக இணைக்கிறது.
- source_word: בַּכַּרְמֶל
  choice: கார்மேலில்
  rationale: இங்கு பொதுப்பெயரான தோட்டம் அல்ல, கார்மேல் என்னும் இடப்பெயர்; அதன் இரு நிகழ்வுகளும் மூலத்தைப் போலத் தக்கவைக்கப்பட்டுள்ளன.
