translation_notes:
  register: நவீனத் தரமான, மரியாதைமிக்க, பொதுவாசகர்களுக்கு எளிதில் புரியும் தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘செம்மறியாடுகளுக்கு மயிர் கத்தரித்தல்’ என்பது தமிழில் இயல்பான கால்நடைச் செயற்பாட்டு மொழியாகத் தேர்ந்தெடுக்கப்பட்டது. பெயர்கள் மாவோன், கார்மேல் என ஒலிபெயர்க்கப்பட்டன; மூலத்தின் மீளுரைப்பும் பொருள் வேறுபாடுகளும் தக்கவைக்கப்பட்டன.
