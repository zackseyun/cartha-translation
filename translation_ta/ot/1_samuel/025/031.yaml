base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/031.yaml
  text: 'And this will not be a cause of grief to you or a stumbling block of heart to my lord: either that you have shed blood without cause or that my lord has avenged himself[a]. And when Yahweh has dealt well with my lord[d][c][b], then remember your servant.'
translation:
  language: ta
  text: 'இது என் ஆண்டவராகிய உமக்கு மனவேதனைக்கான காரணமாகவும் மனதிற்கு இடறலாகவும்[b] இருக்காது: நியாயமின்றி இரத்தம் சிந்தியதோ, என் ஆண்டவர் தமக்காகத் தாமே பழிதீர்த்துக்கொண்டதோ[a] காரணமாக இருக்காது. யாவே[c] என் ஆண்டவருக்கு நன்மை செய்யும்போது, உமது பணிப்பெண்ணாகிய என்னை நினைவுகூருங்கள்[d].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என் ஆண்டவர் தம்மைக் காப்பாற்றிக்கொண்டதோ.” மூல வினை பொதுவாக “காப்பாற்று” என்று பொருள்படும்; இச்சூழலில் தாவீது தன் கையால் பழிதீர்ப்பதைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: சொல்லெழுத்தாக, “இதயத்திற்கு இடறல்.” இது பின்னர் மனச்சாட்சியை உறுத்தும் குற்றவுணர்வைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: எபிரெயத்தில் தேவனுடைய தனிப்பெயர் יהוה (YHWH); இது “யாவே” என்று ஒலிபெயர்க்கப்பட்டுள்ளது.
    reason: textual_clarity
  - marker: d
    text: எபிரெயத்தில், “உமது பணிப்பெண்”; அபிகாயில் தன்னைப் பணிவுடன் குறிப்பிடும் பெண்பால் சொல்.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְפוּקָה
  choice: மனவேதனைக்கான காரணம்
  rationale: அரிதான இச்சொல் தடுமாற்றம், அதிர்ச்சி அல்லது பின்னர் ஏற்படும் வேதனைமிக்க வருத்தத்தைக் குறிக்கலாம்; சூழலில் எதிர்கால மனவருத்தம் முதன்மை.
- source_word: מִכְשׁוֹל לֵב
  choice: மனச்சாட்சிக்கு இடறல்
  rationale: சொல்லெழுத்தாக ‘இதயத்தின் இடறல்’; தமிழில் உள்ளார்ந்த ஒழுக்க உறுத்தலை இயல்பாக உணர்த்தும் வகையில் உருவகத்தையும் ஓரளவு காக்கிறது.
- source_word: לַאדֹנִי / אֲדֹנִי
  choice: என் ஆண்டவர்
  rationale: அபிகாயில் தாவீதிடம் பேசும் மரியாதையும் பணிவும் கொண்ட சமூக விளிப்பைத் தருகிறது; இங்கு தெய்வத்தைக் குறிக்கவில்லை.
- source_word: לִשְׁפָּךְ דָּם חִנָּם
  choice: நியாயமின்றி இரத்தம் சிந்துதல்
  rationale: חִנָּם என்பது இங்கு காரணமோ நியாயமோ இன்றிச் செய்யப்படும் இரத்தப்பழியைக் குறிக்கிறது.
- source_word: לְהוֹשִׁיעַ ... לוֹ
  choice: தாமே தம்மைக் காப்பாற்றிக்கொள்ளுதல்
  rationale: יָשַׁע என்பதன் அடிப்படை ‘காப்பாற்று/விடுவி’ என்ற பொருளைத் தக்கவைக்கிறது; சூழலில் அது தாவீது தன் கையால் பழிதீர்த்துக்கொள்வதை மறைமுகமாகக் குறிக்கிறது.
- source_word: וְהֵיטִב יְהוָה
  choice: யெகோவா நன்மை செய்யும்போது
  rationale: வாவுடன் வரும் வினை வடிவம் இங்கு அபிகாயில் எதிர்நோக்கும் எதிர்கால நிகழ்வை காலவாக்கியமாக இயல்பாக வெளிப்படுத்துகிறது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: இஸ்ரவேலின் தேவனுடைய தனிப்பெயராகிய நான்கெழுத்துப் பெயரை ஒரு பட்டப்பெயரால் மாற்றாமல் தமிழில் வழக்கமான ஒலிபெயர்ப்பால் தருகிறது.
- source_word: אֲמָתֶךָ
  choice: உங்கள் பணிப்பெண்ணாகிய என்னை
  rationale: சொல் வெளிப்படையாகப் பெண்பாலைக் குறிக்கிறது; அபிகாயிலின் பணிவான சுயவிளிப்பை இயல்பான தமிழில் காக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரின் மொழியாக்கம்
  choice: யெகோவா
  alternative: கர்த்தர் / யாவே
  rationale: மூலத்தில் தனிப்பெயர் நேரடியாக இருப்பதால் பட்டப்பெயராக மாற்றாமல், தமிழில் பரவலாக அறியப்படும் ஒலிபெயர்ப்பைப் பயன்படுத்துகிறது.
- issue: לְהוֹשִׁיעַ ... לוֹ என்பதன் சூழல்சார் பொருள்
  choice: தாமே தம்மைக் காப்பாற்றிக்கொண்டது
  alternative: தமக்காகப் பழிதீர்த்துக்கொண்டது
  rationale: மூல வினையின் ‘காப்பாற்று’ பொருளை உரையில் காத்து, பழிதீர்த்தல் என்ற சூழல்சார் விளக்கத்தை அடிக்குறிப்பில் வழங்குவதால் உண்மையான பொருள் இழுபறி பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன செந்தமிழ்ச் சார்ந்த, பொதுவாசகர்களுக்குப் புரியும் மரியாதைமிக்க நடை. ‘என் ஆண்டவர்’ என்ற தொடர் அபிகாயிலின் பணிவான சமூக விளிப்பைத் தொடர்கிறது. அரிதான לְפוּקָה மற்றும் உருவகமான מִכְשׁוֹל לֵב ஆகியவற்றை முறையே இயல்பான பொருளாலும் ஓரளவு காக்கப்பட்ட உருவகத்தாலும் மொழியாக்குகிறது.
