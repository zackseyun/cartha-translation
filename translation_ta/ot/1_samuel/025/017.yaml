  edition: WLC
  text: וְ/עַתָּ֗ה דְּעִ֤י וּ/רְאִי֙ מַֽה תַּעֲשִׂ֔י כִּֽי כָלְתָ֧ה הָ/רָעָ֛ה אֶל אֲדֹנֵ֖י/נוּ וְ/עַ֣ל כָּל בֵּית֑/וֹ וְ/הוּא֙ בֶּן בְּלִיַּ֔עַל מִ/דַּבֵּ֖ר אֵלָֽי/ו־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/017.yaml
  text: Now know this and consider what you should do[a], for disaster has been determined against our master and against all his household, and he is such a worthless man that one cannot speak to him.
translation:
  language: ta
  text: இப்போது நீ இதை அறிந்து, என்ன செய்ய வேண்டும் என்று யோசித்துப் பார். ஏனெனில் நம் எஜமானுக்கும் அவருடைய வீட்டார் அனைவருக்கும் எதிராகப் பேரழிவு உறுதியாகிவிட்டது. அவரோ, யாரும் அவரிடம் பேச முடியாத அளவுக்குக் கீழ்த்தரமான மனிதர்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “பயனற்ற தன்மையின் மகன்”; மரபாக, “பெலியாலின் மகன்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: இப்போது
  rationale: பணியாளனின் பேச்சில் வரும் அவசரமான திருப்பத்தை இயல்பான தமிழில் காட்டுகிறது.
- source_word: דְּעִי וּרְאִי
  choice: நீ இதை அறிந்து ... யோசித்துப் பார்
  rationale: பெண்பால் ஒருமை கட்டளைகளான ‘அறி’ மற்றும் ‘பார்’ என்பவற்றின் இணைப்பை, சூழலில் உள்ள கவனமான பரிசீலனை என்ற பொருளுடன் இயல்பாகத் தருகிறது.
- source_word: מַה תַּעֲשִׂי
  choice: என்ன செய்ய வேண்டும்
  rationale: அபிகாயில் எடுக்க வேண்டிய நடவடிக்கையைப் பற்றிய அவசர ஆலோசனையை வெளிப்படுத்துகிறது; கட்டாயத்தை அளவுக்கு மீறி வலியுறுத்தவில்லை.
- source_word: כָלְתָה הָרָעָה
  choice: பேரழிவு உறுதியாகிவிட்டது
  rationale: தீங்கு அல்லது பேரிடர் முடிவாக நிர்ணயிக்கப்பட்டுவிட்டது என்ற எபிரெய வழக்கின் கருத்தைத் தெளிவாகத் தருகிறது.
- source_word: אֶל אֲדֹנֵינוּ וְעַל כָּל בֵּיתוֹ
  choice: நம் எஜமானுக்கும் அவருடைய வீட்டார் அனைவருக்கும் எதிராக
  rationale: வரவிருக்கும் தீங்கின் எதிர்மறை திசையையும், ‘வீடு’ என்பது இங்கு குடும்பத்தார் மற்றும் வீட்டைச் சேர்ந்தோர் என்பதையும் காட்டுகிறது.
- source_word: וְהוּא בֶּן בְּלִיַּעַל
  choice: அவரோ ... ஒரு பயனற்ற மனிதர்
  rationale: இங்கு வரும் எபிரெய மரபுத்தொடர் ஒரு கீழ்த்தரமான, பிடிவாதமான மனிதனைக் குறிக்கிறது; பிற்காலத் தனிப்பெயர் பொருளைத் தேவையின்றி இறக்குமதி செய்யவில்லை.
- source_word: מִדַּבֵּר אֵלָיו
  choice: யாரும் தம்மிடம் பேச முடியாத அளவுக்கு
  rationale: அவருடன் அறிவுறுத்திப் பேச இயலாத தன்மையை விளைவுக் கட்டமைப்பாக இயல்பான தமிழில் தெரிவிக்கிறது.
theological_decisions:
- issue: בְּלִיַּעַל என்ற மரபுத்தொடரின் பொருள்
  choice: பயனற்ற மனிதர்
  alternative: பெலியாலின் மகன் / பயனற்றவனின் மகன்
  rationale: இந்தச் சூழலில் இது ஒரு தீய, கீழ்த்தரமான, அறிவுரையை ஏற்காத மனிதனைக் குறிக்கும் மரபுத்தொடர்; ஒரு பேய்சார் தனிப்பெயர் என்ற வாசிப்பை உரை கட்டாயப்படுத்தவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையும் உரையாடலின் அவசரத் தன்மையும் காக்கப்பட்டுள்ளன. அபிகாயிலை நோக்கிய பெண்பால் ஒருமை கட்டளைகள் தமிழில் இயல்பான வாக்கிய அமைப்பில் தரப்பட்டுள்ளன; நாபாலைப் பற்றிப் பணியாளர் பேசுவதால் மரியாதைப் பன்மை பயன்படுத்தப்பட்டுள்ளது.
