  text: They were a wall around us both by night and by day[b][a], all the days we were with them tending the flock.
translation:
  language: ta
  text: நாங்கள் அவர்களுடன் இருந்து மந்தையை[b] மேய்த்த எல்லா நாட்களிலும், இரவிலும் பகலிலும் அவர்கள் எங்களைச் சுற்றி[a] ஒரு மதிலாக இருந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘எங்கள்மேல் ஒரு மதிலாக இருந்தார்கள்’ என்றும் மொழிபெயர்க்கலாம். எபிரெய முன்னிடைச்சொல்லின் நேரடியான பொருள் ‘மேல்’; இங்கு அவர்கள் சூழ்ந்து பாதுகாத்ததைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: ‘மந்தை’ என்பதற்கான எபிரெயச் சொல் செம்மறியாடுகளையும் வெள்ளாடுகளையும் கூட்டாகக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: חוֹמָה
  choice: ஒரு மதில்போல்
  rationale: எபிரெயச் சொல் நேரடியாக ‘மதில்’ என்று பொருள்படும். இங்கு அது பாதுகாப்பைக் குறிக்கும் உருவகம் என்பதால், தமிழில் இயல்பாகவும் உருவகம் தெளிவாகவும் இருக்க ‘மதில்போல்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: הָיוּ
  choice: இருந்தார்கள்
  rationale: היה என்பதன் Qal perfect வடிவம் இங்கு கடந்தகாலத்தில் தொடர்ந்து இருந்த நிலை அல்லது பங்கை விவரிக்கும் இணைப்புவினையாகச் செயல்படுகிறது.
- source_word: עָלֵינוּ
  choice: எங்களைச் சுற்றி
  rationale: עַל பொதுவாக ‘மேல்’ எனப் பொருள்படலாம்; ஆனால் ‘மதில்’ என்ற உருவகத்துடன் இங்கு சூழ்ந்து பாதுகாத்தல் என்பதே இயல்பான பொருள்.
- source_word: גַּם לַיְלָה גַּם יוֹמָם
  choice: இரவிலும் பகலிலும்
  rationale: גם...גם அமைப்பு இரவும் பகலும் இடைவிடாத பாதுகாப்பை வலியுறுத்துகிறது; தமிழ் இணை அமைப்பு அந்த வலியுறுத்தலை இயல்பாகக் காக்கிறது.
- source_word: כָּל יְמֵי
  choice: நாட்களிலெல்லாம்
  rationale: ‘எல்லா நாட்களும்’ என்ற காலக் கருத்தைத் தமிழில் இயல்பான காலவாக்கிய அமைப்பில் தெரிவிக்கிறது.
- source_word: הֱיוֹתֵנוּ עִמָּם
  choice: நாங்கள் அவர்களுடன் இருந்து
  rationale: சுட்டுப்பெயர் பின்னொட்டுடன் வரும் infinitive construct காலச்சூழலைக் குறிக்கிறது; தமிழில் வினையெச்சத் தொடர் இதைத் தெளிவாக எடுத்துரைக்கிறது.
- source_word: רֹעִים
  choice: மேய்த்த
  rationale: רעה என்பது மந்தையை மேய்த்துப் பராமரிப்பதைக் குறிக்கிறது; சூழலில் மனிதர்கள் மந்தையை மேய்த்த செயலை இயல்பான தமிழில் கூறுகிறது.
- source_word: הַצֹּאן
  choice: மந்தையை
  rationale: צאן என்பது செம்மறியாடுகளையும் வெள்ளாடுகளையும் உள்ளடக்கக்கூடிய கூட்டுப்பெயர்; ‘மந்தை’ அதன் பரந்த கூட்டுப் பொருளைக் காக்கிறது.
