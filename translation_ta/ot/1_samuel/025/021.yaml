  yaml_path: translation/ot/1_samuel/025/021.yaml
  text: David had said, “Surely I have guarded all that belongs to this man in the wilderness for nothing, so that not a thing of all that belonged to him was missing; and he has repaid me evil for good.”
translation:
  language: ta
  text: தாவீது, “இந்த மனிதனுக்குச் சொந்தமான எல்லாவற்றையும் பாலைவனத்தில் நான் பாதுகாத்தது வீணாகவே போயிற்று. அவனுக்குச் சொந்தமானவற்றில் ஒன்றும் காணாமற்போகவில்லை; ஆனால் அவன் நன்மைக்குப் பதிலாக எனக்குத் தீமை செய்திருக்கிறான்” என்று சொல்லியிருந்தான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַךְ לַשֶּׁקֶר
  choice: முற்றிலும் வீணாயிற்று
  rationale: אַךְ வலியுறுத்தலையும் לַשֶּׁקֶר இங்குக் குறிக்கும் ‘பயனின்றி/வீணாக’ என்ற பொருளையும் இயல்பான தமிழில் இணைக்கிறது.
- source_word: שָׁמַרְתִּי
  choice: நான் பாதுகாத்தது
  rationale: தாவீதும் அவன் ஆட்களும் நாபாலின் உடைமைகளுக்குக் காவலாக இருந்ததை நேரடியாக வெளிப்படுத்துகிறது.
- source_word: לֹא נִפְקַד ... מְאוּמָה
  choice: எதுவும் காணாமற்போகாதபடி
  rationale: נפקד என்பதன் இச்சூழலிலான ‘காணாமல் போதல்/குறைவுபடுதல்’ என்ற கருத்தைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: וַיָּשֶׁב לִי רָעָה תַּחַת טוֹבָה
  choice: அவன் நன்மைக்குப் பதிலாக எனக்குத் தீமை செய்திருக்கிறான்
  rationale: ‘நன்மைக்குப் பதிலாகத் தீமை’ என்ற எபிரெய எதிர்மறை இணைப்பைத் தக்கவைத்து, גמל/שוב சார்ந்த பதில்செயல் கருத்தை இயல்பான தமிழில் தருகிறது.
