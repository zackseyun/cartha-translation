translation_notes:
  register: நவீனத் தரத் தமிழில், கண்ணியமான ஆனால் பொதுவாசகர்களுக்கு எளிதில் புரியும் நடை. וְדָוִד אָמַר என்பதன் பின்னோக்கிச் சுட்டும் உரையாடல் செயல்பாட்டை ‘சொல்லியிருந்தான்’ எனக் காட்டி, மூலத்தில் இல்லாத தனி ‘இப்போது’ போன்ற உரையாடல் குறியீட்டைச் சேர்க்கவில்லை.
