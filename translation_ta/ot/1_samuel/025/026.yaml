source:
  edition: WLC
  text: וְ/עַתָּ֣ה אֲדֹנִ֗/י חַי יְהוָ֤ה וְ/חֵֽי נַפְשְׁ/ךָ֙ אֲשֶׁ֨ר מְנָעֲ/ךָ֤ יְהוָה֙ מִ/בּ֣וֹא בְ/דָמִ֔ים וְ/הוֹשֵׁ֥עַ יָדְ/ךָ֖ לָ֑/ךְ וְ/עַתָּ֗ה יִֽהְי֤וּ כְ/נָבָל֙ אֹיְבֶ֔י/ךָ וְ/הַֽ/מְבַקְשִׁ֥ים אֶל אֲדֹנִ֖/י רָעָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/026.yaml
  text: '[A], my lord, as Yahweh lives and as you yourself live, since Yahweh has kept you from bloodguilt and from saving yourself by your own hand[b], now let your enemies and those who seek evil against my lord be like Nabal.'
translation:
  language: ta
  text: இப்போது, என் ஆண்டவரே, யாவே உயிரோடிருப்பதுபோலும் நீங்கள் உயிரோடிருப்பதுபோலும், யாவே உங்களை இரத்தப்பழிக்கு ஆளாவதிலிருந்தும் உங்கள் சொந்தக் கையால் உங்களைக் காப்பாற்றிக்கொள்வதிலிருந்தும்[a] தடுத்திருக்கிறார். இப்போது, உங்கள் பகைவர்களும் என் ஆண்டவருக்குத் தீங்கு செய்ய நாடுகிறவர்களும் நாபாலைப் போல ஆகட்டும்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சூழலை இன்னும் வெளிப்படையாகக் காட்டினால், “உங்கள் சொந்தக் கையால் உங்களுக்காகப் பழிவாங்குவதிலிருந்தும்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “நாபாலைப் போல” என்பது முதன்மையாக நாபால் என்ற மனிதரைக் குறிக்கிறது; அதே பெயர் எபிரெய மொழியில் “மூடன்” என்ற சொல்லையும் எதிரொலிக்கிறது.
    reason: wordplay
lexical_decisions:
- source_word: וְעַתָּה
  choice: இப்போது
  rationale: வசனத்தின் இரு இடங்களிலும் உள்ள வெளிப்படையான கால/உரையாடல் குறியீட்டை இயல்பான தமிழில் நேரடியாகக் காட்டுகிறது.
- source_word: אֲדֹנִי
  choice: என் ஆண்டவரே
  rationale: அபிகாயில் தாவீதிடம் மரியாதையுடன் பேசும் அழைப்பைத் தெய்வத்தைக் குறிக்கும் பட்டமாக மாற்றாமல் வெளிப்படுத்துகிறது.
- source_word: חַי יְהוָה וְחֵי נַפְשְׁךָ
  choice: யாவே உயிரோடிருப்பதும் நீங்கள் உயிரோடிருப்பதும் எவ்வளவு உறுதியோ, அவ்வளவு உறுதியாகச் சொல்கிறேன்
  rationale: இது யாவேயின் வாழ்வையும் கேட்பவரின் வாழ்வையும் முன்வைக்கும் எபிரெய ஆணைச் சூத்திரம். சொற்சொல்லான ‘உங்கள் ஆத்துமா உயிரோடிருப்பதுபோல’ என்பதற்குப் பதிலாக, נֶפֶשׁ இங்கு முழு நபரைக் குறிக்கும் பொருளையும் ஆணையின் வலிமையையும் இயல்பான தமிழில் தருகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைவனின் தனிப்பெயரான நான்கு எழுத்துப் பெயரை ஒரு பொதுப் பட்டத்தால் மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: מְנָעֲךָ
  choice: உங்களை ... தடுத்திருக்கிறார்
  rationale: ஒரு செயலைச் செய்யவிடாமல் தடுத்தல் என்ற வினையின் பொருளைத் தெளிவாகத் தருகிறது.
- source_word: מִבּוֹא בְדָמִים
  choice: இரத்தப்பழிக்கு ஆளாவதிலிருந்து
  rationale: சொற்சொல்லாக ‘இரத்தங்களுக்குள் வருதல்’ என்றாலும், சூழலில் அநியாயமாக இரத்தம் சிந்துவதால் ஏற்படும் குற்றப்பழி முன்னிலைப்படுகிறது.
- source_word: וְהוֹשֵׁעַ יָדְךָ לָךְ
  choice: உங்கள் சொந்தக் கையால் உங்களைக் காப்பாற்றிக்கொள்வதிலிருந்து
  rationale: ישׁע என்பதன் காப்பாற்றுதல்/விடுவித்தல் சார்ந்த அடிப்படைப் பொருளையும் ‘உங்கள் கை’ என்ற தன்னிச்செயல் அம்சத்தையும் காக்கிறது; பழிவாங்குதல் என்ற சூழல்சார் விளக்கம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: יִהְיוּ כְנָבָל
  choice: நாபாலைப் போல ஆகட்டும்
  rationale: உடனடி சூழலில் נָבָל என்பது அபிகாயிலின் கணவருடைய பெயர்; ‘மூடன்’ என்ற சொல் விளையாட்டு இரண்டாம் நிலையில் இருப்பதால் பெயர் முதன்மை உரையில் வைக்கப்படுகிறது.
- source_word: אֹיְבֶיךָ וְהַמְבַקְשִׁים אֶל אֲדֹנִי רָעָה
  choice: உங்கள் பகைவர்களும் என் ஆண்டவருக்குத் தீங்கு செய்ய நாடுகிறவர்களும்
  rationale: רָעָה நாடுதல் என்ற வழக்குச் சொல்லின் சூழல்சார் பொருளான தீங்கு செய்ய முயல்வதை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைபெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலத்தில் உள்ள தனிப்பெயரைப் பொதுப் பட்டமாக மாற்றாமல், பரவலாக ஏற்கப்பட்ட ஒலிப்புக்கு அண்மையாகத் தமிழில் தருகிறது.
- issue: தாவீது செய்யாமல் தடுக்கப்பட்ட செயல்
  choice: இரத்தப்பழிக்கு ஆளாவதும் தன் கையால் தன்னைக் காப்பாற்றிக்கொள்வதும்
  alternative: தன் கையால் தனக்காகப் பழிவாங்குவது
  rationale: முதன்மை உரை ישׁע என்பதன் ‘காப்பாற்று/விடுவி’ என்ற சொற்பொருளைப் பாதுகாக்கிறது; கதையின் சூழலில் அது வன்முறையால் பழிவாங்குவதைக் குறிக்கலாம் என்பதைக் குறிப்பில் வெளிப்படையாக வைக்கிறது.
- issue: חֵי נַפְשְׁךָ என்பதிலுள்ள נֶפֶשׁ
  choice: நீங்கள் உயிரோடிருப்பதும்
  alternative: உங்கள் ஆத்துமா உயிரோடிருப்பதும்
  rationale: இங்கு נֶפֶשׁ உடலிலிருந்து பிரிந்த ஓர் ஆத்துமாவைப் பற்றிய கோட்பாட்டுச் சொல்லல்ல; அழைக்கப்படும் நபரின் உயிரை/அவரையே குறிக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் மரியாதையும் கதைநடை கண்ணியமும் காக்கப்பட்டுள்ளன. தாவீதுக்கான மரியாதைப் பன்மை பயன்படுத்தப்பட்டுள்ளது. எபிரெய ஆணைச் சூத்திரம் தமிழில் புரியும்படி விரிக்கப்பட்டாலும் அதன் இரட்டை உறுதிப்படுத்தல் காக்கப்பட்டுள்ளது; வசனத்தில் இருமுறை வரும் וְעַתָּה இரு இடங்களிலும் ‘இப்போது’ என வழங்கப்பட்டுள்ளது.
