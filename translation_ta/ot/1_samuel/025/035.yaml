  yaml_path: translation/ot/1_samuel/025/035.yaml
  text: So David took from her hand what she had brought him[a], and he said to her, “Go up in peace to your house. See, I have listened to your voice and accepted you.”
translation:
  language: ta
  text: தாவீது அவள் அவனுக்குக் கொண்டுவந்ததை அவளுடைய கையிலிருந்து எடுத்துக்கொண்டான். பிறகு அவன் அவளிடம், “நீ சமாதானத்துடன் உன் வீட்டுக்குச் செல். பார், நான் உன் குரலுக்குச் செவிகொடுத்து, உன்னை ஏற்றுக்கொண்டேன்[a]” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உனக்குத் தயவு காட்டினேன்.” எபிரெயத்தில் சொற்படியாக, “உன் முகத்தை உயர்த்தினேன்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: எடுத்துக்கொண்டான்
  rationale: לקח என்பதன் அடிப்படைப் பொருளான ‘எடுத்தல்’ என்பதை இயல்பான தமிழில் தருகிறது; இச்சூழலில் பொருளைப் பெற்றுக்கொண்ட செயலையும் தெளிவாகக் காட்டுகிறது.
- source_word: מִיָּדָהּ
  choice: அவளுடைய கையிலிருந்து
  rationale: எபிரெய மூலத்தில் உள்ள ‘அவளுடைய கையிலிருந்து’ என்ற நேரடியான, காட்சியளிக்கும் சொல்லாட்சியைப் பாதுகாக்கிறது.
- source_word: אֵת אֲשֶׁר הֵבִיאָה לוֹ
  choice: அவள் தனக்குக் கொண்டுவந்ததை
  rationale: அபிகாயில் தாவீதுக்காகக் கொண்டுவந்த பொருட்களைக் குறிக்கும் தொடர்புச் சொற்றொடரைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: עֲלִי לְשָׁלוֹם לְבֵיתֵךְ
  choice: நீ சமாதானத்துடன் உன் வீட்டுக்குச் செல்
  rationale: עלה என்பதன் சொற்பொருள் ‘மேலே செல்’ என்றாலும், இங்கு விடைபெற்றுச் செல்லும் கட்டளையே முதன்மை; தமிழில் ‘மேலே செல்’ என்பது தேவையற்ற இடவியல் பொருளை உருவாக்கக்கூடும். לְשָׁלוֹם என்பதன் சமாதானம் மற்றும் பாதுகாப்பு சார்ந்த நயத்தை ‘சமாதானத்துடன்’ காக்கிறது.
- source_word: רְאִי
  choice: பார்
  rationale: கவனத்தை ஈர்க்கும் பெண்பால் ஒருமை கட்டளையை நவீனத் தமிழில் இயல்பாகத் தருகிறது.
- source_word: שָׁמַעְתִּי בְקוֹלֵךְ
  choice: நான் உன் குரலுக்குச் செவிகொடுத்து
  rationale: ‘உன் குரலைக் கேட்டேன்/அதற்குச் செவிகொடுத்தேன்’ என்ற எபிரெய சொல்லாட்சியையும், அபிகாயிலின் வேண்டுகோளை தாவீது ஏற்றுக்கொண்டான் என்ற சூழல்சார் பொருளையும் இணைத்துக் காக்கிறது.
- source_word: וָאֶשָּׂא פָּנָיִךְ
  choice: உன்னை ஏற்றுக்கொண்டேன்
  rationale: ‘உன் முகத்தை உயர்த்தினேன்’ என்ற எபிரெய மரபுத்தொடர் இங்கு அவளுக்கு ஆதரவு காட்டி அவளுடைய வேண்டுகோளை ஏற்றதைக் குறிக்கிறது. ‘உன்னை ஏற்றுக்கொண்டேன்’ என்பது இதை இயல்பான தமிழில் தருகிறது; சொற்படியான உருவகம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
theological_decisions:
- issue: וָאֶשָּׂא פָּנָיִךְ என்ற மரபுத்தொடரின் பொருள்
  choice: உன்னை ஏற்றுக்கொண்டேன்
  alternative: உனக்குத் தயவு காட்டினேன் / உன் முகத்தை உயர்த்தினேன்
  rationale: இம்மரபுத்தொடர் ஒருவருக்கு ஆதரவு காட்டுதல் அல்லது அவரது வேண்டுகோளை ஏற்றல் ஆகிய நயங்களைக் கொண்டுள்ளது. முதன்மை உரை இயல்பான தமிழைத் தேர்ந்தெடுக்கிறது; ‘தயவு காட்டினேன்’ என்ற மாற்றுப் பொருளையும் சொற்படியான உருவகத்தையும் அடிக்குறிப்பு பதிவு செய்கிறது; குறிப்பிட்ட இறையியல் விளக்கத்தைத் திணிப்பதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியும் ஆனால் மரியாதைமிக்க நடையில் மொழிபெயர்க்கப்பட்டது. ‘சமாதானத்துடன்’, ‘குரலுக்குச் செவிகொடுத்து’ போன்ற மூலத்தின் முக்கிய சொல்லாட்சிகள் இயன்றவரை காக்கப்பட்டுள்ளன; தமிழில் இயல்பற்ற இடவியல் வாசிப்பைத் தவிர்க்க עֲלִי என்பது ‘செல்’ என வழங்கப்பட்டது.
