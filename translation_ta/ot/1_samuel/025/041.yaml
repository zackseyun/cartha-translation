base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/041.yaml
  text: She rose and bowed with her face to the ground and said[a], “Behold[b], your servant is a maidservant to wash the feet of the servants of my lord.”
translation:
  language: ta
  text: அவள் எழுந்து, முகம் தரையை நோக்கித் தாழ்ந்து வணங்கி[a], “இதோ, உங்கள் அடிமைப் பெண்ணாகிய நான், என் ஆண்டவரின் பணியாளர்களின் கால்களைக் கழுவும் பணிப்பெண்[b]” என்றாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: நேர்சொல்லாக, “முகம் தரையை நோக்கி [இருக்கும்படி] வணங்கினாள்.” இது முகம் தரையை நோக்கிய ஆழ்ந்த வணக்கநிலையைக் குறிக்கிறது; “தரையில் முகங்குப்புற விழுந்து வணங்கினாள்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “அடிமைப் பெண்” மற்றும் “பணிப்பெண்” என்பவற்றுக்குப் பின்னால், பெண் பணியாளர் அல்லது பெண் அடிமையைக் குறிக்கக்கூடிய பொருளில் நெருங்கிய இரண்டு வெவ்வேறு எபிரெயச் சொற்கள் உள்ளன. அவற்றுக்கிடையேயான துல்லியமான நிலைவேறுபாடு உறுதியானதல்ல.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּקָם
  choice: அவள் எழுந்து
  rationale: קום என்பதன் தொடர் இறந்தகால வடிவம் கதையின் அடுத்த செயலைக் குறிக்கிறது; ‘எழுந்து’ என்பது இயல்பான நவீனத் தமிழ்.
- source_word: וַתִּשְׁתַּחוּ אַפַּיִם אָרְצָה
  choice: முகம் தரையில் படும்படி பணிந்து வணங்கி
  rationale: முகம் தரையை நோக்கித் தாழ்த்தப்பட்ட ஆழ்ந்த மரியாதைச் செயலை இந்த எபிரெயச் சொற்றொடர் குறிக்கிறது. உடல் நிலையும் மரியாதையும் இரண்டையும் மொழிபெயர்ப்பு வெளிப்படுத்துகிறது.
- source_word: הִנֵּה
  choice: இதோ
  rationale: தன்னை மிகவும் தாழ்த்திக் கூறும் அபிகாயிலின் வாக்கியத்தை அறிமுகப்படுத்தும் சுட்டிடைச்சொல்; ‘இதோ’ கண்ணியமானதும் இன்றைய தமிழில் புரியக்கூடியதும் ஆகும்.
- source_word: אֲמָתְךָ
  choice: உங்கள் அடிமைப் பெண்
  rationale: אָמָה என்பது பெண் பணியாளர் அல்லது அடிமைப் பெண்ணைக் குறிக்கலாம். இங்கு பேச்சாளரின் தாழ்மையான தற்குறிப்பையும் பாலினத்தையும் ‘அடிமைப் பெண்’ தெளிவாகக் காக்கிறது.
- source_word: לְשִׁפְחָה
  choice: பணிப்பெண்ணாக
  rationale: שִׁפְחָה என்பது பெண் பணியாளர் அல்லது அடிமையைக் குறிக்கும், אמה-வுக்கு நெருக்கமான இன்னொரு சொல். ‘பணிப்பெண்’ என வேறுபடுத்துவது மூலத்தின் சொல் மாறுபாட்டைக் காத்து, தமிழில் இயல்பாகவும் உள்ளது.
- source_word: לִרְחֹץ רַגְלֵי
  choice: கால்களைக் கழுவும்
  rationale: לְ உடன் வந்த வினையெச்சம் நோக்கத்தைக் குறிக்கிறது; ‘கால்களைக் கழுவும்’ நேரடியான மற்றும் இயல்பான தமிழ் வடிவம்.
- source_word: עַבְדֵי אֲדֹנִי
  choice: என் ஆண்டவரின் பணியாளர்களுடைய
  rationale: עבד இங்கு தாவீதின் உடனிருந்த பணியாளர்களைக் குறிக்கிறது; ‘பணியாளர்கள்’ சூழலுக்கேற்றது. אֲדֹנִי-யின் மரியாதைத் தன்மையை ‘என் ஆண்டவர்’ காக்கிறது.
theological_decisions:
- issue: אמה மற்றும் שפחה ஆகிய பெண் பணிநிலைச் சொற்களின் மொழிபெயர்ப்பு
  choice: ‘அடிமைப் பெண்’ மற்றும் ‘பணிப்பெண்’ என்று வேறுபடுத்துதல்
  alternative: இரண்டையும் ‘பணிப்பெண்’ அல்லது ‘அடியாள்’ என்று மொழிபெயர்த்தல்
  rationale: இரண்டும் பெண் பணியாளர்/அடிமை நிலையைச் சுட்டக்கூடிய நெருங்கிய சொற்கள். அவற்றை முற்றிலும் ஒன்றாக்காமல் மொழிபெயர்ப்பது அபிகாயிலின் மிகுந்த தாழ்மையையும் மூலத்தின் சொல் மாறுபாட்டையும் காக்கிறது; எனினும் இரண்டுக்குமிடையே துல்லியமான நிலை வேறுபாடு உறுதியாக இல்லை.
- issue: அபிகாயிலின் தற்குறிப்பின் இலக்கண வடிவம்
  choice: ‘உங்கள் அடிமைப் பெண்ணாகிய நான் … இருப்பேன்’
  alternative: ‘உங்கள் அடிமைப் பெண் … இருப்பாள்’ என்ற மூன்றாம் நபர் மரியாதைத் தற்குறிப்பு
  rationale: எபிரெயத்தில் தாழ்மையான பெண் தற்குறிப்பு உள்ளது. தமிழில் ‘நான் … இருப்பேன்’ என்று வெளிப்படுத்துவது பொருளைத் தெளிவாகவும் இயல்பாகவும் தருகிறது; சமூகத் தாழ்மையை பெயர்ச்சொற்கள் தொடர்ந்து காக்கின்றன.
translation_notes:
  register: நவீன நிலையான தமிழில், கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘உங்கள்’ என்பது மரியாதையான ஒருமைச் சூழலில் இயல்பாக உள்ளது. மூலத்தில் உள்ள ஆழ்ந்த பணிவை வெளிப்படுத்தும் சமூக மொழிநிலை காக்கப்பட்டுள்ளது; பழமையான அல்லது பிரிவுசார் சொற்கள் தவிர்க்கப்பட்டுள்ளன.
