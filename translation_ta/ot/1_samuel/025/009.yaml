base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/009.yaml
  text: When David’s young men came[a], they spoke to Nabal all these words in David’s name, and then they rested.
translation:
  language: ta
  text: தாவீதின் இளைஞர்கள் வந்து, தாவீதின் பெயரால் நாபாலிடம் இந்த வார்த்தைகளையெல்லாம் சொல்லிவிட்டு, காத்திருந்தார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஓய்ந்திருந்தார்கள்,” அல்லது “பேசாமல் நின்றார்கள்.” எபிரெய வினைச்சொல் “ஓய்தல்” என்று பொருள்படலாம்; இச்சூழலில் அவர்கள் பேசி முடித்து நாபாலின் பதிலுக்காகக் காத்திருந்ததைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: נַעֲרֵי
  choice: இளைஞர்கள்
  rationale: இச்சொல் இளைஞர்கள், பணியாளர்கள் அல்லது உதவியாளர்களைக் குறிக்கலாம். இங்கு தாவீதின் சார்பாகச் செய்தி கொண்டுவந்த ஆட்களைக் குறித்தாலும், எபிரெயச் சொல்லின் வயது சார்ந்த நுணுக்கத்தைப் பாதுகாக்க ‘இளைஞர்கள்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: וַיָּבֹאוּ
  choice: வந்து
  rationale: בוא என்பதன் அடிப்படைப் பொருள் ‘வருதல்’. தொடர்ச்சியான தமிழ் கதைநடைக்கு ஏற்றவாறு வினையெச்சமாக வழங்கப்பட்டது.
- source_word: וַיְדַבְּרוּ אֶל
  choice: நாபாலிடம் ... சொல்லிவிட்டு
  rationale: דבר + אֶל என்பது ஒருவரை நோக்கிப் பேசுவதைக் குறிக்கிறது. செய்தியின் முழு உள்ளடக்கத்தை உரைத்ததை இயல்பான தமிழில் ‘நாபாலிடம் ... சொல்லிவிட்டு’ எனத் தருகிறது.
- source_word: כְּכָל הַדְּבָרִים הָאֵלֶּה
  choice: இந்த வார்த்தைகளையெல்லாம்
  rationale: சொற்றொடர் நேரடியாக ‘இந்த எல்லா வார்த்தைகளின்படியும்’ எனப் பொருள்படும். முந்தைய செய்தியைச் சுட்டும் மொழிசார் தன்மையை ‘வார்த்தைகள்’ என்பதன் மூலம் பாதுகாத்து, இயல்பான தமிழ் வரிசையில் தரப்பட்டது.
- source_word: בְּשֵׁם דָּוִד
  choice: தாவீதின் பெயரால்
  rationale: இந்தச் சொற்றொடர் தாவீதின் பிரதிநிதிகளாகவும் அவரது அதிகாரத்தின் பேரிலும் அவர்கள் பேசியதை உணர்த்துகிறது; ‘பெயரால்’ அந்த வடிவத்தையும் பொருளையும் பாதுகாக்கிறது.
- source_word: וַיָּנוּחוּ
  choice: காத்திருந்தார்கள்
  rationale: נוח வழக்கமாக ‘ஓய்தல்’ அல்லது ‘அமைதியடைதல்’ எனப் பொருள்படும். இச்சூழலில் அவர்கள் பேசி முடித்து நாபாலின் பதிலுக்காக இடைநிறுத்தியதைக் குறிக்கலாம்; கதைநடையில் ‘காத்திருந்தார்கள்’ இயல்பானது, நேரடிப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
