  register: நவீனத் தரமான, மரியாதைமிக்க, எளிதில் புரியும் தமிழ் பயன்படுத்தப்பட்டுள்ளது. எபிரெய வசனத்தின் தொடர் அமைப்பு இயல்பான தமிழ் வாக்கிய ஓட்டத்திற்கு ஏற்ப இணைக்கப்பட்டுள்ளது; இறுதி வினையின் உண்மையான பொருள் வேறுபாடு அடிக்குறிப்பில் வெளிப்படையாகப் பாதுகாக்கப்பட்டுள்ளது.
