  naturalness: நடை கண்ணியமாகவும் நவீனத் தரத் தமிழுக்குப் பெரும்பாலும் இயல்பாகவும் உள்ளது. ‘அவளிடம் ஆளனுப்பிப் பேசினார்’ என்பது சிறிது செறிவாகவும் யார் பேசினார் என்பதில் கணநேரத் தெளிவின்மையையும் தரலாம். ‘அவளிடம் பேச ஆட்களை அனுப்பினார்’ என்பது நோக்கத்தையும் செயற்பாட்டையும் தெளிவாக்குகிறது.
  terminology: ‘யாவே’ என்பது மூலத்தின் தனிப்பெயரையும் ஆங்கில POB audit trail-இன் ‘Yahweh’ முடிவையும் பின்பற்றுகிறது. ‘வழக்காடிய,’ ‘அடியான்,’ ‘தீமை,’ மற்றும் ‘தலையின்மேல் திரும்பச் செய்தார்’ ஆகியவை மூலச் சொற்களின் உருவக மற்றும் அறநெறி வலிமையைப் போதுமான அளவு காக்கின்றன.
