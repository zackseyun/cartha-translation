- source_word: מִיַּד נָבָל
  choice: நாபாலின் கையால்
  rationale: செயலுக்கான மூலத்தையோ காரணியையோ குறிக்கும் எபிரெய மரபுத்தொடரின் உருவகத்தைத் தமிழிலும் தக்கவைக்கிறது.
- source_word: וְאֶת עַבְדּוֹ חָשַׂךְ מֵרָעָה
  choice: அவர் தமது அடியானைத் தீமை செய்யாதபடி தடுத்தார்
  rationale: חָשַׂךְ என்பதின் தடுத்தல் பொருளையும் רָעָה என்பதின் அறநெறிசார் வலிமையையும் சூழலுக்கேற்ற இயல்பான தமிழில் தருகிறது.
- source_word: וְאֵת רָעַת נָבָל הֵשִׁיב יְהוָה בְּרֹאשׁוֹ
  choice: நாபாலின் தீமையை யெகோவா அவனுடைய தலையின்மேலேயே திரும்பச் செய்தார்
  rationale: தீவினையின் விளைவு அதைச் செய்தவனிடமே திரும்பியதைச் சுட்டும் மூலமொழி உருவகத்தைப் பாதுகாக்கிறது.
- source_word: וַיִּשְׁלַח דָּוִד וַיְדַבֵּר בַּאֲבִיגַיִל
  choice: தாவீது ... அவளிடம் ஆளனுப்பிப் பேசினார்
  rationale: ‘அனுப்பினார்’ மற்றும் ‘பேசினார்’ என்ற இரு வினைகளையும் பாதுகாத்து, தூதர்கள் வழியாகப் பேசிய சூழலை இயல்பாக வெளிப்படுத்துகிறது; ‘மணமுடிக்க முன்மொழிந்தார்’ என்று வினையை அளவுக்கு மீறி விளக்கவில்லை.
- source_word: לְקַחְתָּהּ לוֹ לְאִשָּׁה
  choice: அபிகாயிலைத் தனக்கு மனைவியாக எடுத்துக்கொள்வதற்காக
  rationale: எபிரெய திருமண மரபுத்தொடரை நெருக்கமாகவும் புரிந்துகொள்ளத்தக்க தமிழிலும் வழங்குகிறது.
theological_decisions:
- issue: நாபாலின் மரணத்தில் இறைநீதியும் பராமரிப்பும்
  choice: தன்னை யெகோவா நியாயப்படுத்தி, நாபாலின் தீமையை அவனிடமே திரும்பச் செய்தார் என்ற தாவீதின் அறிவிப்பை நேரடியாகத் தக்கவைத்தல்
  alternative: நாபாலைத் தேவன் நேரடியாகக் கொன்றார் என்று வெளிப்படையாக விரிவாக்குதல் அல்லது இறைத் தண்டனை மொழியை மென்மைப்படுத்துதல்
  rationale: எபிரெய உரை யெகோவாவுக்கே நியாயப்படுத்துதலையும் கைம்மாறையும் உரித்தாக்குகிறது; ஆனால் எல்லா துன்பம் அல்லது மரணம் குறித்த பொதுக் கோட்பாடாக இதை விரிவாக்கவில்லை.
- issue: רָעָה என்பதிலுள்ள அறநெறிசார் வலிமை
  choice: ‘தீமை செய்யாதபடி’
  alternative: ‘தீங்கு செய்யாதபடி’ அல்லது ‘பழிவாங்காதபடி’
  rationale: சூழலில் தாவீது செய்ய நினைத்த இரத்தப்பழி வெறும் சேதமாக அல்ல, அறநெறிசார் தீமையாக மதிப்பிடப்படுகிறது; அதே நேரத்தில் குறிப்பிட்ட ‘பழிவாங்குதல்’ என்ற விளக்கத்தை உரைக்குள் சேர்க்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘தமது அடியான்’ என்பது தாவீது தன்னையே யெகோவாவின் அடியான் என்று குறிப்பிடுவதைத் தெளிவாக வைத்திருக்கிறது. சட்டவழக்கு உருவகமும் ‘தலையின்மேல் திரும்புதல்’ என்ற கைம்மாறு உருவகமும் சாத்தியமான அளவு பாதுகாக்கப்பட்டுள்ளன.
