base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/039.yaml
  text: When David heard that Nabal was dead[a], he said, “Blessed be Yahweh, who has pleaded the case of my reproach from the hand of Nabal, and has kept his servant back from evil. Yahweh has returned Nabal’s evil on his own head.” Then David sent and spoke to Abigail[e][d][c][b], to take her as his wife.
translation:
  language: ta
  text: நாபால் இறந்துவிட்டான் என்று தாவீது கேள்விப்பட்டபோது, அவர், “நாபாலின் கையால் எனக்கு நேர்ந்த அவமானத்திற்காக வழக்காடிய யாவே போற்றப்படுவாராக![a] அவர் தமது அடியானைத் தீமை செய்யாதபடி தடுத்தார்.[b] நாபாலின் தீமையை யாவே அவனுடைய தலையின்மேல் திரும்பச் செய்தார்”[c] என்றார். பின்பு தாவீது, அபிகாயிலைத் தனக்கு மனைவியாக எடுத்துக்கொள்வதற்காக, அவளிடம் பேச ஆட்களை அனுப்பினார்.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “என் அவமானத்திற்கான வழக்கை நடத்திய” அல்லது “எனக்கு நேர்ந்த அவமானத்திற்காகப் போராடிய” என்றும் மொழிபெயர்க்கலாம். எபிரெயம் சட்டவழக்கு சார்ந்த மொழியைப் பயன்படுத்துகிறது.
    reason: lexical_alternative
  - marker: b
    text: “தமது அடியான் தீங்கு செய்யாதபடி தடுத்தார்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: “அவனுடைய தலையின்மேல் திரும்பச் செய்தார்” என்பது, ஒருவன் செய்த தீமையின் விளைவு அவனிடமே திரும்பி வந்ததைக் குறிக்கும் மரபுத்தொடர்.
    reason: cultural_note
  - marker: d
    text: அதாவது, அவளைத் திருமணம் செய்துகொள்வதற்காக அவளிடம் பேசும்படி ஆட்களை அனுப்பினார்.
    reason: clarification
