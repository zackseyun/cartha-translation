  revised_text: நாபால் இறந்துவிட்டான் என்று தாவீது கேள்விப்பட்டபோது, அவர், “நாபாலின் கையால் எனக்கு நேர்ந்த அவமானத்திற்காக வழக்காடிய யாவே போற்றப்படுவாராக![a] அவர் தமது அடியானைத் தீமை செய்யாதபடி தடுத்தார்.[b] நாபாலின் தீமையை யாவே அவனுடைய தலையின்மேல் திரும்பச் செய்தார்”[c] என்றார். பின்பு தாவீது, அபிகாயிலைத் தனக்கு மனைவியாக எடுத்துக்கொள்வதற்காக, அவளிடம் பேச ஆட்களை அனுப்பினார்.[d]
