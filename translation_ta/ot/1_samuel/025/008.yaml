base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/008.yaml
  text: Ask your young men[a], and they will tell you. So let the young men find favor in your eyes, for we have come on a festive day[b]. Please give whatever your hand finds to your servants and to your son David.
translation:
  language: ta
  text: உன் இளைஞர்களிடம்[a] கேள்; அவர்கள் உனக்குச் சொல்வார்கள். ஆகவே, இளைஞர்கள் உன் பார்வையில் தயவு பெறட்டும்; ஏனெனில் நாங்கள் ஒரு கொண்டாட்ட நாளில்[b] வந்திருக்கிறோம். உன் கைக்குக் கிடைப்பதைத் தயவுசெய்து உன் பணியாளர்களுக்கும் உன் மகன் தாவீதுக்கும் கொடு.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘பணியாளர்களிடம்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘கொண்டாட்ட நாள்’ என்பது ஆடுகளின் மயிர் கத்தரிக்கும் மகிழ்ச்சியான நிகழ்வுச் சூழலைப் பிரதிபலிக்கிறது; எபிரெயத்தில் சொற்பட, ‘நல்ல நாள்.’
    reason: cultural_note
lexical_decisions:
- source_word: שְׁאַל אֶת נְעָרֶיךָ
  choice: உன் இளைஞர்களிடம் கேள்
  rationale: שׁאל என்பதன் நேரடி கட்டளையையும், נַעַר என்பதன் ‘இளைஞர்/பணியாளர்’ பொருள் விரிவையும் காக்கிறது. பின்னர் வரும் הַנְּעָרִים என்பதுடனான சொல் தொடர்பும் தக்கவைக்கப்படுகிறது.
- source_word: וְיַגִּידוּ לָךְ
  choice: அவர்கள் உனக்குச் சொல்வார்கள்
  rationale: נגד என்பதன் ஹிஃபில் வடிவம் இங்கு அறிவித்தல் அல்லது சொல்லுதல் எனப் பொருள்படுகிறது; இயல்பான தமிழில் ‘சொல்வார்கள்’ பொருத்தமானது.
- source_word: וְיִמְצְאוּ הַנְּעָרִים חֵן בְּעֵינֶיךָ
  choice: ஆகவே, இந்த இளைஞர்களுக்கு உன் கண்களில் தயவு கிடைக்கட்டும்
  rationale: ‘ஒருவரின் கண்களில் தயவு கிடைத்தல்’ என்ற எபிரெய உருவகத்தையும், வேண்டுகோள் சார்ந்த jussive நயத்தையும் காக்கிறது. ‘இந்த’ என்பது பேசுபவரோடு வந்த இளைஞர்களைக் குறிக்கும் சூழலைத் தெளிவாக்குகிறது.
- source_word: כִּי עַל יוֹם טוֹב בָּאנוּ
  choice: ஏனெனில் நாங்கள் ஒரு கொண்டாட்ட நாளில் வந்திருக்கிறோம்
  rationale: יוֹם טוֹב சொற்பட ‘நல்ல நாள்’ என்றாலும், ஆடுகளின் மயிர் கத்தரிக்கும் கொண்டாட்டச் சூழலில் விழாக்கால நாளைக் குறிக்கிறது. ‘கொண்டாட்ட நாள்’ அந்தச் சமூகப் பொருளை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: תְּנָה נָּא
  choice: தயவுசெய்து ... கொடு
  rationale: கட்டளையுடன் வரும் נָא தாழ்மையான வேண்டுகோளைத் தெரிவிக்கிறது; தமிழில் ‘தயவுசெய்து’ அதைப் பொருத்தமாகக் காட்டுகிறது.
- source_word: אֵת אֲשֶׁר תִּמְצָא יָדְךָ
  choice: உன் கைக்குக் கிடைப்பதை
  rationale: ‘உன் கை கண்டடைவதை’ என்ற எபிரெய மொழிமரபை இயல்பான தமிழில் நெருக்கமாகத் தருகிறது; கிடைப்பதில் அல்லது கொடுக்க இயல்வதில் எதையாவது என்பது உட்பொருள்.
- source_word: לַעֲבָדֶיךָ
  choice: உன் பணியாளர்களுக்கு
  rationale: עֶבֶד அடிமை அல்லது பணியாளர் என வரலாம். இங்கு தாவீதின் ஆட்கள் தாழ்மையாகத் தங்களைக் குறிப்பிடுவதால் ‘பணியாளர்கள்’ சூழலுக்கு ஏற்றது.
- source_word: וּלְבִנְךָ לְדָוִד
  choice: உன் மகன் தாவீதுக்கு
  rationale: இது நேரடி குடும்ப உறவைக் கோருவதல்ல; தாவீது நாபாலிடம் தன்னைத் தாழ்மையாகக் குறிப்பிடும் மரியாதைமிக்க பேச்சு. மூலத்தின் சொல்லாட்சியைத் தக்கவைக்கிறது.
