base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/037.yaml
  text: And in the morning[a], when the wine had gone out of Nabal, his wife told him these things, and his heart died within him[b], and he became like a stone.
translation:
  language: ta
  text: காலையில், நாபாலின் போதை தெளிந்தபோது[a], அவனுடைய மனைவி இந்தக் காரியங்களை அவனிடம் சொன்னாள். அப்போது அவன் இதயம் அவனுக்குள் செத்துப்போனது[b]; அவன் கல்லைப் போல ஆனான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'சொல்லுக்குச் சொல்: ‘திராட்சரசம் நாபாலைவிட்டு வெளியேறியபோது’; அதாவது, அவனுடைய போதை தெளிந்தபோது அல்லது மதுவின் தாக்கம் அவனைவிட்டு நீங்கியபோது.'
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘அவன் இதயம் அவனுக்குள் செயலிழந்தது.’ எபிரெயம் ஒரு குறிப்பிட்ட மருத்துவ நிலையைச் சொல்லாமல் வலுவான உருவக மொழியைப் பயன்படுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַבֹּקֶר
  choice: காலையில்
  rationale: எபிரெயச் சொல்லின் வழக்கமான காலக் குறிப்பை இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: בְּצֵאת הַיַּיִן מִנָּבָל
  choice: நாபாலின் போதை தெளிந்தபோது
  rationale: சொல்லுக்குச் சொல் பொருள் ‘திராட்சரசம் நாபாலைவிட்டு வெளியேறியபோது.’ தமிழில் அந்த உருவகத்தை நேரடியாகச் சொல்வது இயல்பற்றதாக இருப்பதால், அதன் சூழல்சார் பொருளான போதை நீங்குதலை முதன்மை உரையில் தெளிவாகத் தருகிறது; நேரடி உருவகம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: וַתַּגֶּד לוֹ אִשְׁתּוֹ
  choice: அவனுடைய மனைவி ... அவனிடம் சொன்னாள்
  rationale: נגד என்பதன் ஹிஃபில் வடிவம் இங்கு ‘சொல்/தெரிவி’ எனப் பொருள்படுகிறது; ‘சொன்னாள்’ என்பது இயல்பான கதைநடை.
- source_word: אֶת הַדְּבָרִים הָאֵלֶּה
  choice: இந்தக் காரியங்களை
  rationale: דברים என்பது ‘வார்த்தைகள்’ அல்லது ‘காரியங்கள்/நிகழ்வுகள்’ என வரலாம்; அபிகாயில் நடந்தவற்றைத் தெரிவிப்பதால் ‘காரியங்கள்’ பொருத்தமானது.
- source_word: וַיָּמָת לִבּוֹ בְּקִרְבּוֹ
  choice: அவனுடைய இதயம் அவனுக்குள் செத்துப்போனது
  rationale: துல்லியமான மருத்துவ நோயறிதலைச் சேர்க்காமல், மூலத்தின் வலுவான ‘இதயம் இறத்தல்’ என்ற உருவகத்தைப் பாதுகாக்கிறது.
- source_word: וְהוּא הָיָה לְאָבֶן
  choice: அவன் கல்லைப் போல ஆனான்
  rationale: எபிரெய உருவக ஒப்புமையை இயல்பான தமிழில் தருகிறது; முடக்கம் அல்லது குறிப்பிட்ட மருத்துவ நிலை என்று மிகையாக விளக்கவில்லை.
theological_decisions:
- issue: நாபாலின் நிலையை ஒரு குறிப்பிட்ட மருத்துவ நிகழ்வாக விளக்குவதா அல்லது எபிரெயக் கதை உருவகத்தைப் பாதுகாப்பதா
  choice: ‘அவனுடைய இதயம் அவனுக்குள் செத்துப்போனது; அவன் கல்லைப் போல ஆனான்’ என்ற உருவக மொழியைப் பாதுகாத்தல்
  alternative: அவனுக்கு மாரடைப்பு ஏற்பட்டது / பக்கவாதம் ஏற்பட்டு முடங்கினான்
  rationale: மூல உரை தொழில்நுட்ப மருத்துவச் சொற்களைப் பயன்படுத்தாமல் அதிர்ச்சி அல்லது உடல் வீழ்ச்சியை உருவகமாக விவரிக்கிறது. எனவே துல்லியமான நோயறிதல் எதையும் மொழிபெயர்ப்பு திணிக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘போதை தெளிந்தபோது’ என்பது தமிழில் தெளிவான பொருள்மொழிபெயர்ப்பு; எபிரெயத்தின் நேரடி மது உருவகம் அடிக்குறிப்பில் தரப்பட்டுள்ளது. நாபாலின் உடல்நிலை பற்றிய மருத்துவத் தெளிவின்மை முதன்மை உரையிலும் அடிக்குறிப்பிலும் பாதுகாக்கப்பட்டுள்ளது.
