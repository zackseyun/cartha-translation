source:
  edition: WLC
  text: וַ/יָּ֣מָת שְׁמוּאֵ֔ל וַ/יִּקָּבְצ֤וּ כָל יִשְׂרָאֵל֙ וַ/יִּסְפְּדוּ ל֔/וֹ וַ/יִּקְבְּרֻ֥/הוּ בְּ/בֵית֖/וֹ בָּ/רָמָ֑ה וַ/יָּ֣קָם דָּוִ֔ד וַ/יֵּ֖רֶד אֶל מִדְבַּ֥ר פָּארָֽן־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/001.yaml
  text: Samuel died[a], and all Israel gathered and mourned for him, and they buried him at his house in Ramah. Then David arose and went down to the wilderness of Paran.
translation:
  language: ta
  text: சாமுவேல் இறந்தார். இஸ்ரவேலர் அனைவரும் ஒன்றுகூடி, அவருக்காகத் துக்கம் அனுசரித்து[a], ராமாவிலிருந்த அவருடைய வீட்டில்[b] அவரை அடக்கம் செய்தார்கள். அதன்பின் தாவீது எழுந்து, பாரான் வனாந்தரத்திற்கு இறங்கிச் சென்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அவருக்காகப் புலம்பி” என்றும் மொழிபெயர்க்கலாம். எபிரெய வினை இறந்தவருக்காக மேற்கொள்ளப்படும் துக்க அனுசரிப்பைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: “வீட்டில்” என்பது குடியிருப்புக் கட்டிடத்தையே குறிக்கலாம்; அல்லது அவரது வீட்டைச் சேர்ந்த குடும்ப நிலப்பகுதியைக் குறிக்கலாம்.
    reason: location_ambiguity
lexical_decisions:
- source_word: וַיָּמָת שְׁמוּאֵל
  choice: சாமுவேல் இறந்தார்
  rationale: வாவ் தொடர்கதை நிகழ்வை முன்னெடுத்தாலும், தனியான கால இடைச்சொல்லைச் சேர்க்காமல் எளிய இறப்புச் செய்தியாக மொழிபெயர்க்கப்பட்டது.
- source_word: וַיִּקָּבְצוּ כָל יִשְׂרָאֵל
  choice: இஸ்ரவேலர் அனைவரும் ஒன்றுகூடி
  rationale: כָל יִשְׂרָאֵל என்ற கூட்டு தேசியக் குறிப்பை, நவீன தமிழில் இயல்பாகவும் தெளிவாகவும் வெளிப்படுத்துகிறது.
- source_word: וַיִּסְפְּדוּ לוֹ
  choice: அவருக்காகத் துக்கம் அனுசரித்து
  rationale: இறந்தவருக்காக மேற்கொள்ளப்படும் முறையான துக்கம் அல்லது புலம்பலைக் குறிக்கும் எபிரெய வினையின் பரந்த பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: וַיִּקְבְּרֻהוּ
  choice: அவரை அடக்கம் செய்தார்கள்
  rationale: வினையையும் அதனுடன் இணைந்த மூன்றாம் நபர் ஆண்பால் ஒருமைச் சுட்டையும் நேரடியாக வெளிப்படுத்துகிறது.
- source_word: בְּבֵיתוֹ בָּרָמָה
  choice: ராமாவிலிருந்த அவருடைய வீட்டில்
  rationale: எபிரெய மொழியின் இடக்குறிப்பை முறையாகப் பாதுகாக்கிறது; ‘வீடு’ என்பது குடியிருப்புக் கட்டிடத்தையோ அதனுடன் சேர்ந்த குடும்ப நிலப்பகுதியையோ குறிக்கக்கூடியதால் விளக்கக் குறிப்பு சேர்க்கப்பட்டது.
- source_word: וַיָּקָם דָּוִד
  choice: அதன்பின் தாவீது எழுந்து
  rationale: קום என்ற வினையின் அடிப்படை இயக்கப் பொருளையும், கதையின் அடுத்த நடவடிக்கைக்கான மாற்றத்தையும் காக்கிறது.
- source_word: וַיֵּרֶד אֶל מִדְבַּר פָּארָן
  choice: பாரான் வனாந்தரத்திற்கு இறங்கிச் சென்றார்
  rationale: ירד என்பதன் ‘இறங்கிச் செல்’ என்ற நிலவியல் இயக்கத்தையும், מִדְבַּר என்பதன் குடியிருப்பற்ற வனாந்தரப் பொருளையும் பாதுகாக்கிறது.
