  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. பெயர்கள் வழக்கமான தமிழ் ஒலிபெயர்ப்பில் தரப்பட்டுள்ளன; தொடர்கதை வினைகளின் இயக்கமும் எபிரெய மூலத்தின் இடவியல் நுணுக்கமும் இயன்றவரை பாதுகாக்கப்பட்டுள்ளன.
