translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டது. திருமணச் சூழலிலுள்ள ‘எடுத்துக்கொள்ளுதல்’ என்ற மூல உருவகம் முதன்மை உரையில் இயல்பான ‘ஏற்றுக்கொள்வது’ என வழங்கப்பட்டு, அதன் சொற்சார்ந்த வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
