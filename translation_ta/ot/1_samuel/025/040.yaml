base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/040.yaml
  text: So David’s servants came to Abigail at Carmel and spoke to her[a], saying, “David has sent us to you to take you for himself as a wife.”
translation:
  language: ta
  text: தாவீதின் பணியாளர்கள் கர்மேலில் அபிகாயிலிடம் வந்து, அவளிடம், “உன்னைத் தனக்கு மனைவியாகக் கொள்ள தாவீது எங்களை உன்னிடம் அனுப்பியிருக்கிறார்” என்றார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உன்னைத் திருமணம் செய்துகொள்ள”; சொல்லுக்குச் சொல், “உன்னைத் தனக்கு மனைவியாகக் கொள்ள.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: வந்து
  rationale: בוא என்பது பார்வைக்கோணத்தைப் பொறுத்து ‘வருதல்’ அல்லது ‘செல்லுதல்’ எனப் பொருள்படும்; பணியாளர்கள் அபிகாயிலின் இருப்பிடத்தை அடைவதை இங்கு கதை விவரிப்பதால் ‘வந்து’ இயல்பானது.
- source_word: עַבְדֵי דָוִד
  choice: தாவீதின் பணியாளர்கள்
  rationale: עֶבֶד என்பதற்கு பணியாளர், அடிமை, அதிகாரி போன்ற பொருள்கள் இருக்கலாம். இங்கு அவர்கள் தாவீதின் தூதர்களாகச் செயல்படுவதால், அடிமைநிலையை வலியுறுத்தாத ‘பணியாளர்கள்’ பொருத்தமானது.
- source_word: הַכַּרְמֶלָה
  choice: கர்மேலில் இருந்த
  rationale: இடப்பெயருடன் உள்ள திசைசுட்டும் முடிவு கர்மேலை நோக்கிய இயக்கத்தைக் குறிக்கிறது; வருகை நிறைவடைந்த நிலையில் அபிகாயில் அங்கு இருந்ததைத் தமிழில் இயல்பாகத் தெரிவிக்கிறது.
- source_word: וַיְדַבְּרוּ אֵלֶיהָ לֵאמֹר
  choice: அவளிடம் ... என்றார்கள்
  rationale: எபிரெய மொழியின் வழக்கமான பேச்சு அறிமுகச் சூத்திரத்தை சொற்சுமையின்றி இயல்பான நவீன தமிழில் வழங்குகிறது.
- source_word: שְׁלָחָנוּ
  choice: எங்களை ... அனுப்பியிருக்கிறார்
  rationale: முடிந்த செயலும் அதன் தற்போதைய தொடர்பும் வெளிப்படுமாறு நிகழ்ந்துமுடிந்த நிகழ்கால வடிவம் பயன்படுத்தப்பட்டுள்ளது.
- source_word: לְקַחְתֵּךְ ... לְאִשָּׁה
  choice: உன்னைத் தனக்கு மனைவியாக ஏற்றுக்கொள்வதற்காக
  rationale: לקח என்பதன் அடிப்படைப் பொருள் ‘எடுத்துக்கொள்ளுதல்’; திருமணச் சூழலில் அது ஒருவரை மனைவியாக ஏற்றுக்கொள்வதைக் குறிக்கிறது. தமிழில் தெளிவாகவும் மரியாதையாகவும் அமைய இவ்வாறு மொழிபெயர்க்கப்பட்டது.
- source_word: לוֹ
  choice: தனக்கு
  rationale: இந்தப் பதிலிப்பெயர் தாவீதையே சுட்டுகிறது; தமிழின் இயல்பான தற்சுட்டு வடிவமான ‘தனக்கு’ அந்த உறவைத் தெளிவாகக் காட்டுகிறது.
