translation_notes:
  register: நவீன பொதுத்தமிழில் தெளிவாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘இதோ’ என்பது மூலத்தின் காட்சி-சுட்டும் வலிமையைத் தக்கவைக்கிறது; ‘உள்ளம் களிப்புற்றிருந்தது’ என்பது சொல்லுக்குச் சொல் கடினத்தன்மையைத் தவிர்த்து எபிரெய உள்ளநிலைப் படிமத்தைப் பாதுகாக்கிறது. அடிக்குறிப்பு குறிகள் [a], [b] உரையில் பொருத்தமான சொற்றொடர்களுக்குப் பின்னர் வைக்கப்பட்டுள்ளன.
