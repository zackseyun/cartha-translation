base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/036.yaml
  text: When Abigail came to Nabal[a], behold, he was holding a feast in his house like the feast of a king, and Nabal’s heart was merry within him, and he was very drunk. So she told him nothing at all, small or great[b], until the light of morning.
translation:
  language: ta
  text: அபிகாயில் நாபாலிடம் வந்தபோது, இதோ, அவன் தன் வீட்டில் ஓர் அரசனின் விருந்தைப் போன்ற விருந்தை நடத்திக்கொண்டிருந்தான். நாபாலின் உள்ளம் களிப்புற்றிருந்தது; அவன் மிகவும் குடிபோதையில் இருந்தான். ஆகவே, சிறியதோ பெரியதோ எந்த விஷயத்தையும்[a] காலை வெளிச்சம் வரும்வரை[b] அவள் அவனிடம் சொல்லவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “சிறியதோ பெரியதோ ஒரு விஷயத்தையும்”; இது எதையுமே சொல்லவில்லை என்று பொருள்படும் மரபுத்தொடர்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது “விடியும்வரை.” எபிரெயத்தில், “காலையின் வெளிச்சம் வரை.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּבֹא
  choice: அபிகாயில் நாபாலிடம் வந்தபோது
  rationale: தொடர்ந்து நடைபெறும் நிகழ்வை அடுத்த காட்சியோடு இயல்பாக இணைக்கிறது; எபிரெய வாவ்-தொடரின் காலவரிசையையும் காக்கிறது.
- source_word: וְהִנֵּה
  choice: இதோ
  rationale: காட்சியில் எதிர்பாராத நிலையில் நாபால் காணப்படுவதைச் சுட்டும் எபிரெய இடைச்சொல்லின் கவனஈர்ப்பு வலிமையைப் பாதுகாக்கிறது.
- source_word: מִשְׁתֶּה
  choice: விருந்து
  rationale: உணவும் மதுபானமும் இடம்பெறும் கொண்டாட்ட விருந்தைக் குறிக்கிறது. பின்னர் குடிபோதை வெளிப்படையாகக் கூறப்படுவதால் இங்கே ‘குடிவிருந்து’ என்று மிகையாக விளக்க வேண்டியதில்லை.
- source_word: בְּבֵיתוֹ
  choice: தன் வீட்டில்
  rationale: இடத்தைக் குறிக்கும் சொற்றொடரைத் தெளிவாகவும் இயல்பான தமிழிலும் தருகிறது.
- source_word: כְּמִשְׁתֵּה הַמֶּלֶךְ
  choice: ஓர் அரசனின் விருந்தைப் போன்ற
  rationale: அரசருக்குரிய ஆடம்பரமான விருந்துடன் செய்யப்படும் உவமையைப் பாதுகாக்கிறது; குறிப்பிட்ட ஓர் அரசனைக் குறிக்காத பொருளையும் தருகிறது.
- source_word: לֵב נָבָל טוֹב עָלָיו
  choice: நாபாலின் உள்ளம் களிப்புற்றிருந்தது
  rationale: ‘அவனுடைய இருதயம் அவன்மேல் நன்றாயிருந்தது’ என்ற எபிரெய மரபுத்தொடரின் உள்ளார்ந்த மகிழ்ச்சி அல்லது உற்சாகத்தை, விருந்து சூழலுக்கு ஏற்ற இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: שִׁכֹּר עַד מְאֹד
  choice: அவன் மிகவும் குடிபோதையில் இருந்தான்
  rationale: பெயரடை மற்றும் வலியுறுத்தியைத் தெளிவாக மொழிபெயர்த்து, போதையின் தீவிரத்தைக் காக்கிறது.
- source_word: וְלֹא הִגִּידָה לוֹ
  choice: ஆகவே ... அவள் அவனிடம் சொல்லவில்லை
  rationale: நாபாலின் மிகுந்த குடிபோதையைத் தொடர்ந்து அபிகாயில் எடுத்த நடவடிக்கையாக இவ்வாக்கியம் அமைவதை இயல்பான தமிழில் காட்டுகிறது.
- source_word: דָּבָר קָטֹן וְגָדוֹל
  choice: சிறியதோ பெரியதோ எந்த விஷயத்தையும்
  rationale: ‘சிறியது அல்லது பெரியது’ என்ற எபிரெய இருமுனை மரபுத்தொடரைப் பாதுகாத்தபடியே, ‘எதையும் சொல்லவில்லை’ என்ற முழுமையான மறுப்பைத் தெளிவாக்குகிறது.
- source_word: עַד אוֹר הַבֹּקֶר
  choice: காலை வெளிச்சம் வரும்வரை
  rationale: ‘காலையின் வெளிச்சம் வரை’ என்ற மூலமொழிப் படிமத்தை வாசிக்க இயல்பான தமிழில் காக்கிறது.
