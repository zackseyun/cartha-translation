  variant: modern standard Tamil
source:
  edition: WLC
  text: וְ/עַתָּה֙ הַ/בְּרָכָ֣ה הַ/זֹּ֔את אֲשֶׁר הֵבִ֥יא שִׁפְחָתְ/ךָ֖ לַֽ/אדֹנִ֑/י וְ/נִתְּנָה֙ לַ/נְּעָרִ֔ים הַ/מִּֽתְהַלְּכִ֖ים בְּ/רַגְלֵ֥י אֲדֹנִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/027.yaml
  text: And now, let this gift that your servant has brought to my lord be given to the young men who follow my lord.
translation:
  language: ta
  text: இப்போது, உமது பணிப்பெண் என் ஆண்டவரிடம் கொண்டுவந்துள்ள இந்த அன்பளிப்பு, என் ஆண்டவரைப் பின்தொடர்ந்து வருகிற இளைஞர்களுக்குக் கொடுக்கப்படட்டும்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַבְּרָכָה
  choice: அன்பளிப்பு
  rationale: அடிப்படைப் பொருள் ‘ஆசீர்வாதம்’ என்றாலும், இச்சூழலில் அபிகாயில் கொண்டுவந்த உணவுப் பரிசைக் குறிக்கும் மரியாதைமிக்க வழக்குச் சொல்; ‘அன்பளிப்பு’ இயல்பாக அந்தச் சூழற்பொருளைத் தருகிறது.
- source_word: שִׁפְחָתְךָ
  choice: உமது பணிப்பெண்
  rationale: அபிகாயில் தன்னைத் தாழ்த்திப் பேசும் மரியாதைமிக்க சுயகுறிப்பைத் தக்கவைக்கிறது.
- source_word: לַאדֹנִי
  choice: என் ஆண்டவரிடம் / என் ஆண்டவரை
  rationale: தாவீதைக் குறிக்கும் மனிதருக்குரிய மரியாதை அழைப்பு; தெய்வப் பெயராகப் புரிந்துகொள்ளாத வகையில் சூழலுக்கேற்றவாறு மொழிபெயர்க்கப்பட்டது.
- source_word: הַמִּתְהַלְּכִים בְּרַגְלֵי
  choice: பின்தொடர்ந்து வருகிற
  rationale: சொல்லடியாக ‘காலடியில்/காலடிகளைத் தொடர்ந்து நடக்கிற’ என்பதைக் குறித்தாலும், தலைவருடன் செல்லும் துணைவர்களைத் தமிழில் இயல்பாகக் குறிக்கிறது.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான நடையைப் பயன்படுத்துகிறது. மூலத்தின் வேண்டுகோள் தன்மையை ‘கொடுக்கப்படட்டும்’ எனவும், பணிவான ‘உமது பணிப்பெண்’ மற்றும் ‘என் ஆண்டவர்’ என்ற அழைப்புகளையும் பாதுகாக்கிறது.
