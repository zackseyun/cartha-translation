  register: நவீனத் தரமான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. நாபாலின் இகழ்ச்சியான இரட்டை வினா நேரடியாக வைக்கப்பட்டுள்ளது. ‘ஊழியர்கள்’ மற்றும் ‘எஜமான்’ ஆகியவை சமூக உறவைத் தெளிவாகக் காட்டுகின்றன; அடிமைத்தனத்தின் அளவை உரை கூறுவதைவிட அதிகமாக நிர்ணயிக்கவில்லை.
