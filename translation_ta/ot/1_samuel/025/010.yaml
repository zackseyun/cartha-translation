base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/010.yaml
  text: Nabal answered David’s servants and said[a], “Who is David? And who is the son of Jesse? These days many servants are breaking away, each man from before his master.”
translation:
  language: ta
  text: நாபால் தாவீதின் ஊழியர்களுக்குப் பதிலளித்து, “தாவீது யார்? ஈசாயின் மகன் யார்? இந்நாட்களில் தன் எஜமானிடமிருந்து விலகிப்போகும் ஊழியர்கள் பலராகிவிட்டார்கள்[a]” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இன்று தன் எஜமானின் முன்னிலையிலிருந்து பிரிந்து செல்லும் ஊழியர்கள் பெருகியிருக்கிறார்கள்.”
    reason: הַיּוֹם என்பதன் நேரடிப் பொருளான ‘இன்று’, רַבּוּ என்பதன் ‘பெருகியிருக்கிறார்கள்’ என்ற வினைப்பொருள், மִפְּנֵי என்பதன் ‘முன்னிலையிலிருந்து’ என்ற இடவியல் வடிவம் ஆகியவற்றைப் பாதுகாக்கும் மாற்று மொழிபெயர்ப்பு.
lexical_decisions:
- source_word: וַיַּעַן
  choice: பதிலளித்து
  rationale: கதைநடையில் ענה என்பதன் இயல்பான பொருள் ‘பதிலளித்தல்’; தொடர்ந்து வரும் நேரடிக் கூற்றுடன் இது தமிழில் சரளமாக அமைகிறது.
- source_word: עַבְדֵי דָוִד
  choice: தாவீதின் ஊழியர்கள்
  rationale: עבד என்பது பணியாளர், ஊழியர் அல்லது அடிமை எனப் பொருள்படலாம். இங்கு தாவீதின் தூதர்களைக் குறிக்கும் சூழலில் ‘ஊழியர்கள்’ இயல்பாகவும் மூலச்சொல்லுக்கு நெருக்கமாகவும் உள்ளது.
- source_word: מִי דָוִד וּמִי בֶן־יִשָׁי
  choice: தாவீது யார்? ஈசாயின் மகன் யார்?
  rationale: இருமுறை வரும் வினாவமைப்பு நாபாலின் இகழ்ச்சியான தொனியை வெளிப்படுத்துகிறது. ‘ஈசாயின் மகன்’ என்ற எபிரெயச் சொல்லமைப்பும் பாதுகாக்கப்பட்டுள்ளது.
- source_word: הַיּוֹם
  choice: இந்நாட்களில்
  rationale: சொல்லுக்கு நேரடியாக ‘இன்று’ என்று பொருள் இருந்தாலும், இங்குள்ள பொதுப்படுத்தும் கூற்றில் ‘இந்நாட்களில்’ என்ற காலவிரிவு பொருத்தமானது; நேரடி மாற்று அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: רַבּוּ
  choice: பலராகிவிட்டார்கள்
  rationale: רבה வினைச்சொல்லின் ‘பலராகுதல்/பெருகுதல்’ என்ற இயக்கப்பொருளை வெறும் ‘பலர்’ என்று தட்டையாக்காமல் தமிழில் இயல்பாகப் பாதுகாக்கிறது.
- source_word: עֲבָדִים
  choice: ஊழியர்கள்
  rationale: சமூகச் சார்பை உணர்த்தினாலும், இந்த வசனம் கட்டாயமாக ‘அடிமைகள்’ என்ற வலுவான சொல்லைக் கோரவில்லை; ‘ஊழியர்கள்’ பொருத்தமான நடுநிலைத் தேர்வு.
- source_word: הַמִּתְפָּרְצִים
  choice: விலகிப்போகும்
  rationale: פרץ என்பதன் தன்னிலைப் பங்கேற்பு வடிவம் இங்கு எஜமானரிடமிருந்து கட்டுப்பாட்டை மீறிப் பிரிவதைக் குறிக்கிறது. ‘கலகம் செய்கிற’ என்று மிகையாக விளக்காமல் ‘விலகிப்போகும்’ என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: אִישׁ מִפְּנֵי אֲדֹנָיו
  choice: தன் எஜமானிடமிருந்து
  rationale: איש இங்கு பகிர்நிலைப் பொருளில் ஒவ்வொருவரையும் குறிக்கிறது; தமிழில் ஒருமைத் தொடர்பான ‘தன்’ அதை இயல்பாக வெளிப்படுத்துகிறது. מִפְּנֵי என்பதன் இடவியல் வடிவம் இச்சூழலில் ‘இடமிருந்து’ என்ற பிரிவுப் பொருளைக் கொண்டுள்ளது.
- source_word: אֲדֹנָיו
  choice: தன் எஜமான்
  rationale: மனித சமூக மேலாளரைக் குறிக்கும் אדון என்பதற்கு ‘எஜமான்’ தெளிவான தமிழாக்கம்; இறையியல் பொருள்குழப்பம் ஏற்படுத்தக்கூடிய ‘ஆண்டவர்’ தவிர்க்கப்பட்டுள்ளது.
