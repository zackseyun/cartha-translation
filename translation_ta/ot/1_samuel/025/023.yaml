  text: When Abigail saw David[a], she hurried and got down from the donkey, and fell before David on her face and bowed to the ground.
translation:
  language: ta
  text: அபிகாயில் தாவீதைக் கண்டதும், விரைந்து கழுதையிலிருந்து இறங்கினாள். தாவீதுக்கு முன்பாக முகங்குப்புற விழுந்து, தரையை நோக்கிப் பணிந்தாள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தரையில் முழுமையாகத் தாழ்ந்து பணிந்தாள்.” எபிரெய வினைச்சொல் ஆழமாகக் குனிவதையோ முழுமையாகத் தரையில் தாழ்வதையோ குறிக்கலாம். இங்கு அது அபிகாயில் தாவீதுக்குக் காட்டிய மரியாதையைக் குறிக்கிறது; கடவுளுக்குரிய வழிபாட்டை அவசியம் குறிக்கவில்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּרֶא
  choice: கண்டபோது
  rationale: ראה என்பதன் இயல்பான பொருள் ‘காணுதல்’. தொடர் வினைநிகழ்வை நவீனத் தமிழில் இயல்பாக இணைக்க ‘கண்டபோது’ என்று மொழிபெயர்க்கப்பட்டது.
- source_word: וַתְּמַהֵר
  choice: விரைந்து
  rationale: מהר விரைவாகச் செயல்படுவதைக் குறிக்கிறது; ‘விரைந்து’ கதைநிகழ்வின் அவசரத்தைச் சுருக்கமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: וַתֵּרֶד מֵעַל הַחֲמוֹר
  choice: கழுதையிலிருந்து இறங்கினாள்
  rationale: சவாரி செய்த விலங்கின்மேலிருந்து கீழே இறங்கிய செயலை நேரடியாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: וַתִּפֹּל לְאַפֵּי דָוִד עַל־פָּנֶיהָ
  choice: தாவீதுக்கு முன்பாக முகங்குப்புற விழுந்து
  rationale: ‘தாவீதுக்கு முன்பாக’ என்பது அவருடைய காலடியில் என்று மூலத்தில் இல்லாத உறுப்பைச் சேர்க்காமல் לְאַפֵּי דָוִד என்பதைக் காட்டுகிறது; ‘முகங்குப்புற’ என்பது עַל־פָּנֶיהָ கூறும் உடல் நிலையைக் காட்சிப்படுத்துகிறது.
- source_word: וַתִּשְׁתַּחוּ אָרֶץ
  choice: தரைமட்டும் குனிந்து பணிந்தாள்
  rationale: שׁחה இங்கு ஒரு மனித அரசத் தலைவருக்கு முன் காட்டப்படும் ஆழ்ந்த மரியாதை அல்லது கீழ்ப்படிதலின் உடல் செயலைக் குறிக்கிறது. ‘பணிந்தாள்’ வழிபாடு என்ற இறையியல் பொருளைத் தேவையின்றி புகுத்தாது; ‘தரைமட்டும் குனிந்து’ செய்கையின் தீவிரத்தைப் பாதுகாக்கிறது.
theological_decisions:
- issue: ஒரு மனிதருக்கு முன் செய்யப்படும் שׁחה செயலை மொழிபெயர்த்தல்
  choice: தரைமட்டும் குனிந்து பணிந்தாள்
  alternative: தரையில் விழுந்து வணங்கினாள்
  rationale: இச்சூழலில் செயல் தாவீதுக்கு முன் மரியாதையையும் தாழ்மையையும் காட்டுகிறது; கடவுளுக்குரிய வழிபாடு என்று கட்டாயப்படுத்துவதில்லை. ‘பணிந்தாள்’ சமூகச் செய்கையைத் தெளிவாகக் காட்டி, மூலச்சொல்லின் ஆழ்ந்து குனிதல் அல்லது முழுமையாகத் தாழ்த்திக்கொள்ளுதல் என்ற பரப்பையும் அடிக்குறிப்பில் பாதுகாக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய உரையின் தொடர்ச்சியான வினைகள் தமிழில் இயல்பாக ஓடும்படி இரண்டு வாக்கியங்களாக அமைக்கப்பட்டுள்ளன. ‘முகங்குப்புற’ உடல் நிலையைத் தெளிவாகக் காட்டுகிறது; ‘தரைமட்டும் குனிந்து பணிந்தாள்’ செய்கையின் ஆழத்தையும் மனிதருக்குச் செலுத்திய மரியாதையையும் வேறுபடுத்திக் காக்கிறது.
