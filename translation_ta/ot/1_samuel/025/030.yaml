revisions:
- from: யெகோவா என் ஆண்டவருக்கு உம்மைக்குறித்துச் சொன்ன எல்லா நன்மையின்படியும் செய்து, உம்மை இஸ்ரவேலின்மேல் தலைவராக நியமிக்கும்போது[a],
  to: யாவே என் ஆண்டவருக்கு உம்மைக்குறித்து அவர் சொன்ன எல்லா நன்மைகளின்படியும் செய்து, உம்மை இஸ்ரவேலின்மேல் தலைவராக நியமிக்கும்போது[a],
  rationale: The revision aligns the rendering of the Tetragrammaton with the project’s “Yahweh” decision, using Tamil “யாவே,” and makes the collective expression for the favorable things spoken concerning David more idiomatic. The source’s ambiguity in וְצִוְּךָ is retained through the footnote, while “நியமிக்கும்போது” remains the best contextual main-text rendering.
