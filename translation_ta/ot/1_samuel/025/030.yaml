source:
  edition: WLC
  text: וְ/הָיָ֗ה כִּֽי יַעֲשֶׂ֤ה יְהוָה֙ לַֽ/אדֹנִ֔/י כְּ/כֹ֛ל אֲשֶׁר דִּבֶּ֥ר אֶת הַ/טּוֹבָ֖ה עָלֶ֑י/ךָ וְ/צִוְּ/ךָ֥ לְ/נָגִ֖יד עַל יִשְׂרָאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/030.yaml
  text: And when Yahweh has done for my lord according to all the good that he spoke concerning you[a], and has appointed you ruler over Israel[b],
translation:
  language: ta
  text: யாவே என் ஆண்டவருக்கு உம்மைக்குறித்து அவர் சொன்ன எல்லா நன்மைகளின்படியும் செய்து, உம்மை இஸ்ரவேலின்மேல் தலைவராக நியமிக்கும்போது[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உம்மை இஸ்ரவேலின்மேல் தலைவராக இருக்கும்படி கட்டளையிடும்போது” அல்லது “பொறுப்பளிக்கும்போது.” இங்குள்ள எபிரெய வினைச்சொல் பொதுவாக “கட்டளையிடு” எனப் பொருள்படும்; இச்சூழலில் தலைமைப் பொறுப்புக்கு நியமித்தல் அல்லது ஆணையளித்தல் என்ற பொருளையும் தரலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: செய்து, ... நியமிக்கும்போது
  rationale: எதிர்காலத்தில் நிகழவிருக்கும் சூழலை அறிமுகப்படுத்தும் எபிரெய மரபுத்தொடரை இயல்பான நவீனத் தமிழில் நிபந்தனை சார்ந்த காலவாக்கியமாக வெளிப்படுத்துகிறது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: தேவனுடைய தனிப்பெயராகிய நான்கெழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல் தமிழில் பரவலாக அறியப்படும் ஒலிபெயர்ப்பில் தருகிறது.
- source_word: לַאדֹנִי
  choice: என் ஆண்டவருக்கு
  rationale: அபிகாயில் தாவீதை மரியாதையுடன் அழைப்பதைத் தெளிவாகவும் இயல்பாகவும் காட்டுகிறது.
- source_word: כְּכֹל אֲשֶׁר דִּבֶּר אֶת הַטּוֹבָה עָלֶיךָ
  choice: உம்மைக்குறித்துச் சொன்ன எல்லா நன்மையின்படியும்
  rationale: דבר என்பதைக் குறிப்பாக ‘வாக்குறுதி அளித்தார்’ என்று விளக்கிவிடாமல் ‘சொன்ன’ என வைத்து, ‘நன்மை’ என்ற எபிரெயச் சொல்லையும் பாதுகாக்கிறது.
- source_word: וְצִוְּךָ
  choice: நியமித்து
  rationale: צוה பொதுவாக ‘கட்டளையிடு’ எனப் பொருள்படலாம்; ஆனால் לְנָגִיד உடன் இங்கு அதிகாரப் பொறுப்புக்கு அமர்த்துதல் அல்லது ஆணையளித்தல் என்ற சூழற்பொருள் பொருந்துகிறது.
- source_word: לְנָגִיד עַל יִשְׂרָאֵל
  choice: இஸ்ரவேலின்மேல் தலைவராக
  rationale: נָגִיד குறிக்கும் அதிகாரமுள்ள தலைமையை நவீனத் தமிழில் தெளிவாகத் தருகிறது; עַל அதிகாரத்தின் பரப்பை ‘இன்மேல்’ என வெளிப்படுத்துகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யெகோவா
  alternative: யாவே
  rationale: மூலத்தில் பட்டமல்ல, தேவனுடைய தனிப்பெயரே உள்ளது. தமிழ் வேதாகமப் பயன்பாட்டில் நன்கு அறியப்பட்ட ‘யெகோவா’ என்ற ஒலிபெயர்ப்பு தேர்ந்தெடுக்கப்பட்டது; ‘யாவே’ என்பது எபிரெய உச்சரிப்பை மீட்டமைக்கும் மற்றொரு ஏற்ற ஒலிபெயர்ப்பு.
- issue: וְצִוְּךָ என்பதன் பொருள்
  choice: நியமித்து
  alternative: உம்மை இஸ்ரவேலின் தலைவராக இருக்கும்படி கட்டளையிட்டு / பொறுப்பளித்து
  rationale: வினைச்சொல்லின் அடிப்படைப் பொருள் ‘கட்டளையிடு’ என்றாலும், ஒருவரை נָגִיד ஆகச் செய்வதைக் குறிக்கும் இக்கட்டமைப்பில் நியமனம் அல்லது பொறுப்பளித்தல் இயல்பான சூழற்பொருள். மாற்றுப் பொருளை அடிக்குறிப்பு பாதுகாக்கிறது.
translation_notes:
  register: இயல்பான, மரியாதைமிக்க நவீனத் தமிழ் பயன்படுத்தப்பட்டுள்ளது. இது அடுத்த வசனத்தில் நிறைவடையும் வாக்கியத்தின் தொடக்கம் என்பதால் முடிவில் காற்புள்ளி வைக்கப்பட்டுள்ளது. தாவீதுக்கான மரியாதைப் பன்மை ‘உம்மை’ பாதுகாக்கப்பட்டுள்ளது.
