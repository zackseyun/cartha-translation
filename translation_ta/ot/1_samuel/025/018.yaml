translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. பழங்காலப் பாத்திரமான தோற்பையும் அளவையான சேயாவும் நவீனச் சொற்களால் மாற்றப்படாமல், வாசகருக்குத் தெளிவாக வழங்கப்பட்டுள்ளன. மூலத்தின் பட்டியல் அமைப்பும் நிகழ்வின் அவசர உணர்வும் காக்கப்பட்டுள்ளன.
