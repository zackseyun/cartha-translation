  text: וַ/תְּמַהֵ֣ר אבוגיל וַ/תִּקַּח֩ מָאתַ֨יִם לֶ֜חֶם וּ/שְׁנַ֣יִם נִבְלֵי יַ֗יִן וְ/חָמֵ֨שׁ צֹ֤אן עשוות וְ/חָמֵ֤שׁ סְאִים֙ קָלִ֔י וּ/מֵאָ֥ה צִמֻּקִ֖ים וּ/מָאתַ֣יִם דְּבֵלִ֑ים וַ/תָּ֖שֶׂם עַל הַ/חֲמֹרִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/018.yaml
  text: Then Abigail hurried and took two hundred loaves of bread[a], two skins of wine, five sheep already prepared, five seahs of roasted grain, a hundred clusters of raisins, and two hundred cakes of figs, and put them on the donkeys.
translation:
  language: ta
  text: அபிகாயில் விரைந்து, இருநூறு அப்பங்களையும், திராட்சரசம் நிறைந்த இரண்டு தோற்பைகளையும், ஆயத்தம் செய்யப்பட்ட ஐந்து ஆடுகளையும், ஐந்து சேஆ[a] வறுத்த தானியத்தையும், நூறு உலர்ந்த திராட்சைத் தொகுதிகளையும், இருநூறு அத்திப்பழ அடைகளையும் எடுத்துக் கழுதைகளின்மேல் ஏற்றினாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘சேஆ’ என்பது பழங்காலத்தில் பயன்படுத்தப்பட்ட ஓர் உலர் அளவை.
    reason: cultural_note
lexical_decisions:
- source_word: וַתְּמַהֵר
  choice: உடனே விரைந்து
  rationale: מהר என்பதன் விரைவையும், தொடர் நிகழ்வைக் குறிக்கும் வாவையும் இயல்பான தமிழ் கதைநடையில் வெளிப்படுத்துகிறது.
- source_word: מָאתַיִם לֶחֶם
  choice: இருநூறு அப்பங்கள்
  rationale: לֶחֶם என்பது அப்பம் அல்லது உணவு எனப் பொருள்படலாம்; எண்ணிக்கையுடன் வருவதால் தனித்தனி அப்பங்கள் என்பது இங்கு பொருத்தமானது.
- source_word: שְׁנַיִם נִבְלֵי יַיִן
  choice: இரண்டு தோற்பைகள் நிறைய திராட்சரசம்
  rationale: נֵבֶל என்பது இச்சூழலில் திரவத்தை வைத்திருந்த தோலால் செய்யப்பட்ட பையைக் குறிக்கிறது; நவீன புட்டி அல்லது குடுவையைச் சுட்டுவதைத் தவிர்க்கிறது.
- source_word: חָמֵשׁ צֹאן עֲשׂוּיוֹת
  choice: ஆயத்தம் செய்யப்பட்ட ஐந்து ஆடுகள்
  rationale: צֹאן என்பது செம்மறியாடு அல்லது வெள்ளாடு உள்ளிட்ட மந்தை விலங்குகளைக் குறிக்கக்கூடும்; ‘ஆடுகள்’ அந்தப் பொதுத்தன்மையைப் பாதுகாக்கிறது. עֲשׂוּיוֹת அவை உணவுக்காகத் தயாராக்கப்பட்டிருந்ததைச் சொல்கிறது; எந்தச் சமையல் கட்டம் என்பதை உரை குறிப்பிடாததால் ‘ஆயத்தம் செய்யப்பட்ட’ என வழங்கப்படுகிறது.
- source_word: חָמֵשׁ סְאִים קָלִי
  choice: ஐந்து சேயா வறுத்த தானியம்
  rationale: סְאָה என்பது பழங்கால உலர் அளவை; அதன் குறிப்பான பெயர் ஒலிபெயர்க்கப்படுகிறது. קָלִי என்பது வறுத்த அல்லது பொரித்த தானியத்தைக் குறிக்கிறது; ‘வறுத்த தானியம்’ இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: מֵאָה צִמֻּקִים
  choice: நூறு உலர்ந்த திராட்சைக் கொத்துகள்
  rationale: צִמֻּקִים என்பது உலர்ந்த திராட்சைகளைக் குறிக்கிறது; எண்ணக்கூடிய உணவுப் பொதிகளின் பட்டியலில் வருவதால் ‘கொத்துகள்’ அவை தொகுதிகளாக இருந்ததை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: מָאתַיִם דְּבֵלִים
  choice: இருநூறு அத்திப்பழ அடைகள்
  rationale: דְּבֵלָה என்பது அழுத்தி வடிவமைக்கப்பட்ட உலர்ந்த அத்திப்பழ அடையைக் குறிக்கிறது.
- source_word: וַתָּשֶׂם עַל הַחֲמֹרִים
  choice: கழுதைகளின் மேல் வைத்தாள்
  rationale: שׂים என்பதன் நேரடியான ‘வை’ என்ற பொருளைப் பாதுகாக்கிறது; பொருட்கள் கழுதைகளில் ஏற்றப்பட்டன என்பது சூழலிலிருந்து தெளிவாகிறது.
