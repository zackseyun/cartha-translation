base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/005.yaml
  text: So David sent ten young men[a], and David said to the young men, “Go up to Carmel, and go to Nabal, and greet him in my name with peace.”
translation:
  language: ta
  text: தாவீது பத்து இளைஞர்களை அனுப்பினான். தாவீது அந்த இளைஞர்களிடம், “நீங்கள் கர்மேலுக்குப் போய், நாபாலிடம் சென்று, என் பெயரில் அவரிடம் நலமா என்று விசாரியுங்கள்[a]” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என் பெயரில் அவரிடம் சமாதான வாழ்த்து கூறுங்கள்”; அதாவது, வாழ்த்தின் வழியாக அவருடைய நலத்தை விசாரியுங்கள்.
    reason: לְשָׁלוֹם என்பது சொற்பொருளில் ‘சமாதானத்திற்காக/சமாதானத்துடன்’ என வரலாம்; இச்சூழலில் அது நலம் விசாரிக்கும் வாழ்த்துமுறையைக் குறிக்கிறது.
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: அனுப்பினான்
  rationale: கதைநடையில் שׁלח என்பதன் இயல்பான, நேரான பொருளைத் தருகிறது.
- source_word: עֲשָׂרָה נְעָרִים
  choice: பத்து இளைஞர்கள்
  rationale: נְעָרִים என்பது சூழலின்படி பணியாளர்களையும் குறிக்கலாம்; ஆனால் இங்கு சமூக நிலையை மிகுதியாகக் குறிப்பிடாமல் அதன் அடிப்படைப் பொருளான இளைஞர்கள் என்று மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: עֲלוּ כַרְמֶלָה
  choice: கர்மேலுக்குப் போய்
  rationale: עלה என்பதிலுள்ள மேல்நோக்கிய பயணக் கருத்து இச்சூழலில் இலக்கை நோக்கிச் செல்வதைக் குறிக்கிறது; தமிழில் இயல்பாக ‘போய்’ என வழங்கப்பட்டுள்ளது.
- source_word: וּבָאתֶם אֶל נָבָל
  choice: நாபாலிடம் சென்று
  rationale: בוא என்பதன் பயணக் கருத்தை, தாவீது அனுப்புகிறவர்களின் பார்வைக்கு ஏற்ற இயல்பான தமிழில் தருகிறது.
- source_word: וּשְׁאֶלְתֶּם לוֹ
  choice: அவருடைய நலத்தை விசாரியுங்கள்
  rationale: שׁאל இங்கு ஒருவருடைய நிலைமையை விசாரிக்கும் வாழ்த்துமுறையின் பகுதியாக வருகிறது.
- source_word: בִשְׁמִי
  choice: என் பெயரில்
  rationale: எபிரெயச் சொல்லமைப்பை நேரடியாகப் பாதுகாத்து, தாவீதின் சார்பாகப் பேசுவதையும் உணர்த்துகிறது.
- source_word: לְשָׁלוֹם
  choice: நலத்தை
  rationale: שָׁלוֹם இங்கு வெறும் மோதலின்மையை அல்ல, ஒருவரின் நல்வாழ்வு மற்றும் நலநிலையை விசாரிக்கும் வாழ்த்தைக் குறிக்கிறது.
