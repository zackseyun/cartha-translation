source:
  edition: WLC
  text: שָׂ֥א נָ֖א לְ/פֶ֣שַׁע אֲמָתֶ֑/ךָ כִּ֣י עָשֹֽׂה יַעֲשֶׂה֩ יְהוָ֨ה לַֽ/אדֹנִ֜/י בַּ֣יִת נֶאֱמָ֗ן כִּי מִלְחֲמ֤וֹת יְהוָה֙ אֲדֹנִ֣/י נִלְחָ֔ם וְ/רָעָ֛ה לֹא תִמָּצֵ֥א בְ/ךָ֖ מִ/יָּמֶֽי/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/028.yaml
  text: Please forgive the transgression of your servant[a], for Yahweh will surely make my lord a lasting house, because my lord fights Yahweh’s battles, and evil will not be found in you all your days.
translation:
  language: ta
  text: “உமது அடியாளின் மீறுதலைத் தயவுசெய்து மன்னியுங்கள். ஏனெனில், யாவே என் ஆண்டவருக்கு ஒரு நிலையான வீட்டை[a] நிச்சயமாக ஏற்படுத்துவார்; என் ஆண்டவர் யாவேயின் போர்களைப் போரிடுவதால், உமது வாழ்நாளெல்லாம் உம்மில் தீமை காணப்படாது.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உறுதியான வீடு,” “நீடித்த அரச வம்சம்.” இங்கு “வீடு” என்பது ஒரு கட்டிடத்தை மட்டுமல்ல, நிலைபெற்ற குடும்ப மரபை—குறிப்பாக அரச மரபை—குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂא נָא לְפֶשַׁע
  choice: மீறுதலைத் தயவுசெய்து மன்னியும்
  rationale: ‘சுமத்தல்/தாங்குதல்’ என்ற எபிரெய மொழிவழக்கு இங்கு குற்றத்தை மன்னிப்பதைக் குறிக்கிறது. נָא-வின் வேண்டுகோள் நயம் ‘தயவுசெய்து’ என்பதால் வெளிப்படுகிறது.
- source_word: אֲמָתֶךָ
  choice: உமது அடியாள்
  rationale: பெண் பணியாளரைக் குறிக்கும் சொல்லின் பாலினம் தமிழில் ‘அடியாள்’ என்பதால் இயல்பாகவும், அபிகாயிலின் தாழ்மையான தன்னடையாளத்தைப் பேணியும் வெளிப்படுகிறது.
- source_word: עָשֹׂה יַעֲשֶׂה
  choice: நிச்சயமாக ஏற்படுத்துவார்
  rationale: முற்றுவினையுடன் வந்த வினையெச்ச முழுவடிவம் செயலை வலியுறுத்துகிறது; ‘நிச்சயமாக’ அந்த வலியுறுத்தலைத் தருகிறது.
- source_word: בַּיִת נֶאֱמָן
  choice: நிலையான ஒரு வீடு
  rationale: ‘வீடு’ என்ற வேதாகம உருவகத்தைப் பேணுகிறது; ‘நிலையான’ என்பது உறுதியும் நீடித்த மரபும் என்ற பொருளைத் தெளிவாக்குகிறது.
- source_word: מִלְחֲמוֹת יְהוָה ... נִלְחָם
  choice: யாவேயின் போர்களைப் போரிட்டு வருகிறார்
  rationale: இறைவனுடைய நோக்கத்திற்காக நடத்தப்படும் போர்களைக் குறிக்கிறது. எபிரெயப் பங்கேற்புவினையின் தொடர்ச்சியான அல்லது இயல்பான செயற்பாட்டு நயம் ‘போரிட்டு வருகிறார்’ என்பதில் வெளிப்படுகிறது.
- source_word: וְרָעָה לֹא תִמָּצֵא בְךָ
  choice: தீமை உம்மிடம் காணப்படாது
  rationale: רָעָה என்பதன் ஒழுக்கத் தீமை என்ற பரந்த பொருளைப் பேணுகிறது; בְךָ-வை இயல்பான தமிழில் ‘உம்மிடம்’ என வழங்கி, தீமை ஒருவரில் அல்லது அவரோடு தொடர்புடையதாகக் காணப்படுதல் என்ற பரப்பைத் திறந்தே வைக்கிறது.
- source_word: מִיָּמֶיךָ
  choice: உமது வாழ்நாளெல்லாம்
  rationale: ஒருவரின் நாட்கள் முழுவதும், அதாவது வாழ்நாள் முழுவதும், என்ற எபிரெய மொழிவழக்கை இயல்பான தமிழில் தருகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைப்பெயரான நான்கு எழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், நவீன தமிழில் அறியப்பட்ட ஒலிபெயர்ப்பாக வழங்குகிறது.
theological_decisions:
- issue: தாவீதுக்கான ‘வீடு’ என்பதன் அரசமரபுப் பொருள்
  choice: முதன்மைப் பனுவலில் ‘நிலையான ஒரு வீடு’ என்ற உருவகத்தைப் பேணி, அடிக்குறிப்பில் மரபுவழி குடும்பம்/அரச வம்சம் என்ற பொருளை விளக்குதல்
  alternative: ‘நீடித்த அரச வம்சம்’ என்று நேரடியாக மொழிபெயர்த்தல்
  rationale: எபிரெய ‘வீடு’ என்பது வெறும் கட்டிடத்தைக் குறிக்காமல் தாவீதின் நிலைபெற்ற மரபைக் குறிக்கிறது. உருவகத்தைப் பேணுவது பிற வேதாகமப் பகுதிகளுடனான சொல்லியல் தொடர்பை நிலைநிறுத்துகிறது; அடிக்குறிப்பு அதன் சூழற்பொருளைத் தெளிவாக்குகிறது.
- issue: רָעָה என்பதன் பொருள்
  choice: தீமை
  alternative: தீங்கு அல்லது துன்பம்
  rationale: இச்சூழலில் அபிகாயில் தாவீதின் ஒழுக்க நடத்தையையும் குற்றமற்ற நிலைப்பாட்டையும் முன்னிறுத்துகிறார். இருப்பினும் எபிரெயச் சொல்லின் பரந்த நிழற்பொருளை ‘தீமை’ ஓரளவு திறந்தே வைக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் கண்ணியமான நேரடி உரைநடை பயன்படுத்தப்பட்டுள்ளது. ‘உமது,’ ‘உம்மிடம்,’ ‘மன்னியும்’ ஆகிய மரியாதை வடிவங்கள் அபிகாயில் தாவீதிடம் பேசும் பணிவான தொனியைப் பேணுகின்றன; தேவையற்ற பழந்தமிழ் வடிவங்கள் தவிர்க்கப்பட்டுள்ளன.
