- from: அப்போது தாவீது தன் ஆட்களிடம், “ஒவ்வொருவரும் தன் வாளைக் கட்டிக்கொள்ளுங்கள்” என்றான். அதன்படி ஒவ்வொருவரும் தன் வாளைக் கட்டிக்கொண்டார்கள்; தாவீதும் தன் வாளைக் கட்டிக்கொண்டான். ஏறக்குறைய நானூறு பேர் தாவீதுக்குப் பின்னால் சென்றார்கள்; இருநூறு பேர் பொருட்களைக் காவல்காக்கத் தங்கினார்கள்.[a]
