base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/013.yaml
  text: Then David said to his men[a], “Each man strap on his sword.” So each man strapped on his sword, and David also strapped on his sword. About four hundred men went up after David, while two hundred stayed with the supplies.
translation:
  language: ta
  text: அப்போது தாவீது தன் ஆட்களிடம், “ஒவ்வொருவரும் தன் வாளைக் கட்டிக்கொள்ளுங்கள்” என்றான். அதன்படி ஒவ்வொருவரும் தன் வாளைக் கட்டிக்கொண்டார்கள்; தாவீதும் தன் வாளைக் கட்டிக்கொண்டான். ஏறக்குறைய நானூறு பேர் தாவீதைப் பின்தொடர்ந்து மேலே சென்றார்கள்; இருநூறு பேர் பொருட்களுடன் தங்கினார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது “சாமான்களுடன் தங்கினார்கள்” அல்லது “உபகரணங்களின் அருகில் தங்கினார்கள்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: חִגְרוּ / וַיַּחְגְּרוּ / וַיַּחְגֹּר
  choice: கட்டிக்கொள்ளுங்கள் / கட்டிக்கொண்டார்கள் / கட்டிக்கொண்டான்
  rationale: חגר என்பது போர்ச் சூழலில் வாளை இடுப்பில் கட்டிக்கொள்வதைக் குறிக்கிறது. ‘கட்டிக்கொள்’ என்பது செயலை இயல்பான நவீனத் தமிழில் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: אִישׁ אֶת־חַרְבּוֹ
  choice: ஒவ்வொருவரும் தன் வாளை
  rationale: இந்த எபிரெய விநியோக அமைப்பு ஒவ்வொரு நபரும் தன்தன் வாளைக் கட்டிக்கொண்டதை வலியுறுத்துகிறது; ‘ஒவ்வொருவரும் தன் வாளை’ அதைப் பாதுகாக்கிறது.
- source_word: לַאֲנָשָׁיו
  choice: தன் ஆட்களிடம்
  rationale: இங்கு אֲנָשִׁים என்பது தாவீதுடன் இருந்த போரிடும் ஆட்களைக் குறிக்கிறது. ‘தன் ஆட்கள்’ இயல்பானதும் சூழலுக்கு ஏற்றதும் ஆகும்.
- source_word: חַרְבּוֹ
  choice: தன் வாளை
  rationale: חֶרֶב என்பது பொதுவான ஆயுதத்தைக் காட்டிலும் குறிப்பாக வாளைக் குறிக்கிறது.
- source_word: גַּם
  choice: தாவீதும்
  rationale: ‘-உம்’ என்ற இணைப்புச் சொல் தாவீதும் மற்றவர்களுடன் சேர்ந்து ஆயுதம் தரித்ததை இயல்பாகக் காட்டுகிறது.
- source_word: וַיַּעֲלוּ אַחֲרֵי דָוִד
  choice: தாவீதுக்குப் பின்னால் சென்றார்கள்
  rationale: אַחֲרֵי என்பதன் பின்தொடர்தல் கருத்து பாதுகாக்கப்படுகிறது. இச்சூழலில் עלה-வின் ‘மேலே செல்லுதல்’ என்ற திசை நுணுக்கத்தைத் தமிழில் சொற்சொறாகச் சேர்ப்பது இயல்பற்றதாக இருப்பதால் ‘சென்றார்கள்’ என வழங்கப்பட்டுள்ளது.
- source_word: כְּאַרְבַּע מֵאוֹת אִישׁ
  choice: ஏறக்குறைய நானூறு பேர்
  rationale: எண்ணுக்கு முன் வரும் כְּ தோராயத்தைக் குறிக்கக்கூடும்; ‘ஏறக்குறைய’ அந்த நுணுக்கத்தை வெளிப்படுத்துகிறது.
- source_word: יָשְׁבוּ
  choice: தங்கினார்கள்
  rationale: சொல்லின் அடிப்படைப் பொருள் ‘உட்கார்ந்தார்கள்’ என்றாலும், இங்கு முன்னே செல்லாமல் பின்னால் தங்கியிருந்தார்கள் என்பதே சூழல்சார் பொருள்.
- source_word: עַל־הַכֵּלִים
  choice: பொருட்களைக் காவல்காக்க
  rationale: כֵּלִים என்பது உடைமைகள், சாமான்கள், கருவிகள் அல்லது பயணப் பொருட்கள் எனப் பரந்த பொருளுடையது. עַל உடன் இச்சூழலில் அவற்றின் பொறுப்பில் அல்லது அருகில் தங்கியிருத்தலைக் குறிக்கிறது; ‘காவல்காக்க’ என்பது சூழலால் உணர்த்தப்படும் பங்கைத் தெளிவாக்குகிறது, மாற்று நேரடி வடிவங்கள் அடிக்குறிப்பில் தரப்படுகின்றன.
