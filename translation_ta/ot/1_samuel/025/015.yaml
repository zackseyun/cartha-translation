base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/015.yaml
  text: Yet the men were very good to us[a], and we were not mistreated[b], nor did we miss anything all the days we went about with them while we were in the field.
translation:
  language: ta
  text: ஆனால் அந்த ஆட்கள் எங்களிடம் மிகவும் நல்லவர்களாக நடந்துகொண்டார்கள். நாங்கள் இழிவாக நடத்தப்படவில்லை[a]. நாங்கள் வயல்வெளியில் இருந்தபோது அவர்களுடன் நடமாடிய நாட்களிலெல்லாம், எங்களிடம் இருந்த எதுவும் காணாமற்போகவில்லை[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘நாங்கள் அவமானப்படுத்தப்படவில்லை’ / ‘எந்த இழிவையும் அனுபவிக்கவில்லை.’
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘எங்களிடம் எதுவும் குறையவில்லை.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָאֲנָשִׁים
  choice: ஆனால் அந்த ஆட்கள்
  rationale: וְ என்பது சூழலில் நாபாலின் பகைமையான மதிப்பீட்டுக்கு மாறான சாட்சியை அறிமுகப்படுத்துவதால் ‘ஆனால்’ என மொழிபெயர்க்கப்பட்டது; אֲנָשִׁים என்பதற்கு இயல்பான ‘ஆட்கள்’ பயன்படுத்தப்பட்டது.
- source_word: טֹבִים לָנוּ מְאֹד
  choice: எங்களிடம் மிகவும் நல்லவர்களாக நடந்துகொண்டார்கள்
  rationale: טוֹבִים לָנוּ என்பது அவர்களுடைய நன்மையான நடத்தையைக் குறிக்கிறது. தமிழில் வெறும் ‘எங்களுக்கு மிகவும் நல்லவர்களாக இருந்தார்கள்’ என்பதைவிட இத்தொடர் செயற்பொருளை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וְלֹא הָכְלַמְנוּ
  choice: நாங்கள் இழிவாக நடத்தப்படவில்லை
  rationale: כלם என்பதன் ஹொஃபால் வடிவம் அவமானம் அல்லது இழிவுக்கு உட்படுத்தப்படுதல் என்ற செயல்பாட்டுப் பொருளைக் கொண்டது. மூலத்தின் செயப்பாட்டு வடிவத்தையும் பொருளின் பரப்பையும் இம்மொழிபெயர்ப்பு காக்கிறது.
- source_word: וְלֹא פָקַדְנוּ מְאוּמָה
  choice: எங்களுடைய எதுவும் காணாமற்போகவில்லை
  rationale: எதிர்மறையுடன் வரும் פקד மற்றும் מְאוּמָה, அவர்களுடைய உடைமைகளில் எதுவும் தொலைந்தோ கணக்கில் குறைந்தோ போகவில்லை என்பதைக் குறிக்கிறது. தமிழில் ‘காணாமற்போகவில்லை’ என்பது இச்சூழலைத் தெளிவாகச் சொல்கிறது.
- source_word: כָּל יְמֵי הִתְהַלַּכְנוּ אִתָּם
  choice: அவர்களுடன் நடமாடிய நாட்களிலெல்லாம்
  rationale: הלך என்பதன் ஹித்பாயேல் வடிவத்திலுள்ள தொடர்ச்சியான நடமாட்டம் அல்லது சேர்ந்து இயங்குதல் என்ற நுணுக்கத்தை ‘நடமாடிய’ காக்கிறது; כָּל יְמֵי முழுக் காலத்தையும் ‘நாட்களிலெல்லாம்’ எனக் குறிக்கிறது.
- source_word: בִּהְיוֹתֵנוּ בַּשָּׂדֶה
  choice: நாங்கள் வயல்வெளியில் இருந்தபோது
  rationale: மேய்ச்சல் நடைபெறும் திறந்த வெளியில் அவர்கள் இருந்த காலத்தைக் குறிக்கும் இயல்பான, மூலத்திற்கு நெருக்கமான தமிழாக்கம்.
