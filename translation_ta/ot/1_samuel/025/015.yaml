translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் அதேவேளையில் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய உரையின் தொடர்ச்சியான நடமாட்டம், செயப்பாட்டு அவமதிப்பு, உடைமை எதுவும் காணாமற்போகாத நிலை ஆகிய நுணுக்கங்கள் பாதுகாக்கப்பட்டுள்ளன.
