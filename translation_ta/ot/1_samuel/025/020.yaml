revisions:
- from: அவள் கழுதையின்மேல் சவாரி செய்தபடி, மலையின் மறைவான பகுதியில் இறங்கிக்கொண்டிருந்தபோது[a], இதோ, தாவீதும் அவனுடைய ஆட்களும் அவளைச் சந்திக்க இறங்கி வந்துகொண்டிருந்தார்கள்; அவள் அவர்களை எதிர்கொண்டாள்.
  to: அவள் கழுதைமேல் ஏறி, மலையின் மறைவான பகுதியில் இறங்கிக்கொண்டிருந்தபோது[a], இதோ, தாவீதும் அவனுடைய ஆட்களும் அவளைச் சந்திக்க இறங்கி வந்துகொண்டிருந்தார்கள்; அவள் அவர்களைச் சந்தித்தாள்.
