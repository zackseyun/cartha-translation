    issue: The final rendering “அவள் அவர்களை எதிர்கொண்டாள்” is potentially adversarial.
    rationale: 'פגש is neutral here: Abigail meets David and his men. In modern Tamil, “எதிர்கொண்டாள்” may imply facing or confronting them, which can overstate a hostile nuance absent from the verb.'
  - severity: low
    issue: “சவாரி செய்தபடி” is less idiomatic than necessary.
    rationale: Although understandable, “கழுதைமேல் ஏறி” naturally conveys riding/mounted travel in modern standard Tamil and fits the continuing descent.
