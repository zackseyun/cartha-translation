  text: וְ/הָיָ֞ה הִ֣יא רֹכֶ֣בֶת עַֽל הַ/חֲמ֗וֹר וְ/יֹרֶ֨דֶת֙ בְּ/סֵ֣תֶר הָ/הָ֔ר וְ/הִנֵּ֤ה דָוִד֙ וַ/אֲנָשָׁ֔י/ו יֹרְדִ֖ים לִ/קְרָאתָ֑/הּ וַ/תִּפְגֹּ֖שׁ אֹתָֽ/ם׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/020.yaml
  text: And as she was riding on the donkey and going down under cover of the mountain[a], behold, David and his men were coming down to meet her, and she met them.
translation:
  language: ta
  text: அவள் கழுதைமேல் ஏறி, மலையின் மறைவான பகுதியில் இறங்கிக்கொண்டிருந்தபோது[a], இதோ, தாவீதும் அவனுடைய ஆட்களும் அவளைச் சந்திக்க இறங்கி வந்துகொண்டிருந்தார்கள்; அவள் அவர்களைச் சந்தித்தாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மலையின் மறைவுப் பக்கமாக.” எபிரெயச் சொற்றொடர் மலையின் கண்ணுக்குப் புலப்படாத அல்லது பாதுகாப்பான ஒரு பகுதியைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה הִיא
  choice: அவள் ... இருந்தபோது
  rationale: வாவ் + היה தரும் கதைநிகழ்வின் காலப் பின்னணியை, தமிழில் இயல்பான காலத் துணைவாக்கியமாக வெளிப்படுத்துகிறது.
- source_word: רֹכֶבֶת עַל הַחֲמוֹר
  choice: கழுதையின்மேல் சவாரி செய்தபடி
  rationale: רכב என்பதன் தொடர்ச்சியான ‘சவாரி செய்தல்’ என்ற செயற்பொருளையும், חמור என்பதன் சாதாரண ‘கழுதை’ என்ற பொருளையும் தெளிவாகத் தருகிறது.
- source_word: וְיֹרֶדֶת
  choice: இறங்கிக்கொண்டிருந்தபோது
  rationale: பெண்பால் ஒருமை நிகழ்காலப் பெயரெச்சம் காட்டும் தொடர்ந்து நடைபெறும் செயலை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: בְּסֵתֶר הָהָר
  choice: மலையின் மறைவான பகுதியில்
  rationale: סֵתֶר குறிக்கும் மறைவு அல்லது பாதுகாப்பான ஒதுக்குப்புறம் என்ற இடவியல் நுணுக்கத்தைத் தக்கவைக்கிறது; துல்லியமான நிலவடிவு உறுதியாக இல்லாததால் அடிக்குறிப்பில் மாற்றுப் பொருள் தரப்படுகிறது.
- source_word: וְהִנֵּה
  choice: இதோ
  rationale: புதிய, திடீர் காட்சியின்மேல் கவனத்தை ஈர்க்கும் הִנֵּה-வின் உரையாடல் செயல்பாட்டை dignified modern Tamil-ல் காக்கிறது.
- source_word: יֹרְדִים לִקְרָאתָהּ
  choice: அவளைச் சந்திக்க இறங்கி வந்துகொண்டிருந்தார்கள்
  rationale: יֹרְדִים காட்டும் கீழ்நோக்கிய தொடர்ச்சியான இயக்கத்தையும், לִקְרָאתָהּ காட்டும் அவளை நோக்கிய சந்திப்பு இயக்கத்தையும் வெளிப்படுத்துகிறது; இது முன்கூட்டிய நோக்கத்தை கட்டாயமாகக் குறிக்க வேண்டியதில்லை.
- source_word: וַתִּפְגֹּשׁ אֹתָם
  choice: அவள் அவர்களை எதிர்கொண்டாள்
  rationale: פגש என்பதன் ‘சந்தித்தல்/எதிர்கொள்ளுதல்’ பொருளை, முந்தைய ‘சந்திக்க’ என்பதுடன் தேவையற்ற சொல் மறுமொழியைத் தவிர்த்து இயல்பாகத் தருகிறது.
