translation_notes:
  register: நவீனத் தரத் தமிழ்; கதைநடைக்கேற்ற கண்ணியமான, எளிதில் புரியும் மொழிநடை. ‘இதோ’ மூலம் மூலத்தின் காட்சித் திருப்பம் காக்கப்பட்டுள்ளது. அடிக்குறிப்பு குறியீடு உரையில் இணைக்கப்பட்டுள்ளது.
