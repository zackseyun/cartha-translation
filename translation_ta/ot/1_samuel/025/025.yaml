  text: אַל נָ֣א יָשִׂ֣ים אֲדֹנִ֣/י אֶת לִבּ֡/וֹ אֶל אִישׁ֩ הַ/בְּלִיַּ֨עַל הַ/זֶּ֜ה עַל נָבָ֗ל כִּ֤י כִ/שְׁמ/וֹ֙ כֶּן ה֔וּא נָבָ֣ל שְׁמ֔/וֹ וּ/נְבָלָ֖ה עִמּ֑/וֹ וַֽ/אֲנִי֙ אֲמָ֣תְ/ךָ֔ לֹ֥א רָאִ֛יתִי אֶת נַעֲרֵ֥י אֲדֹנִ֖/י אֲשֶׁ֥ר שָׁלָֽחְתָּ־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/025.yaml
  text: 'Please[a], my lord, do not set your heart on this worthless man, on Nabal, for as his name is, so is he: Nabal is his name, and folly is with him. But I, your servant, did not see the young men of my lord whom you sent.'
translation:
  language: ta
  text: 'தயவுசெய்து, என் ஆண்டவரே, பயனற்ற இந்த மனிதனாகிய நாபாலைப் பொருட்படுத்த வேண்டாம். ஏனெனில், அவன் பெயர் எப்படியோ அப்படியே அவனும் இருக்கிறான்: அவன் பெயர் நாபால்; மூடத்தனமும் அவனோடு இருக்கிறது.[a] ஆனால், உங்கள் அடியாளாகிய நான், என் ஆண்டவர் அனுப்பிய இளைஞர்களைப் பார்க்கவில்லை.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “நாபால்” என்ற பெயர், “மூடன்” அல்லது “மூடத்தனம்” என்பதற்கான எபிரெயச் சொல்லை நினைவூட்டுகிறது; அபிகாயில் இங்கு வேண்டுமென்றே ஒரு சொல்விளையாட்டைப் பயன்படுத்துகிறார்.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָשִׂים אֶת־לִבּוֹ אֶל
  choice: பொருட்படுத்த வேண்டாம்
  rationale: ‘ஒருவரை நோக்கித் தன் இதயத்தை வைப்பது’ என்ற எபிரெய மரபுத்தொடர் இங்கு அவருக்கு முக்கியத்துவம் கொடுத்தல் அல்லது அவருடைய செயலை மனத்தில் எடுத்துக்கொள்ளுதல் எனப் பொருள்படுகிறது. இயல்பான நவீன தமிழில் ‘பொருட்படுத்த வேண்டாம்’ அந்தப் பொருளைத் தெளிவாகத் தருகிறது.
- source_word: אִישׁ הַבְּלִיַּעַל
  choice: பயனற்ற இந்த மனிதன்
  rationale: இங்கு בְּלִיַּעַל என்பது தனிப்பெயர் அல்ல; ஒருவரின் கீழ்மையான, தகுதியற்ற குணத்தைச் சுட்டும் கடுமையான மதிப்பீடு. ‘பயனற்ற’ என்பது மூலத்தின் அடிப்படை உருவகத்தையும் வசனத்தின் இகழ்ச்சித் தொனியையும் காக்கிறது.
- source_word: נָבָל
  choice: நாபால்
  rationale: தனிப்பெயர் ஒலிபெயர்க்கப்பட்டுள்ளது. அதனுடன் தொடர்புடைய ‘மூடத்தனம்’ என்ற சொல்விளையாட்டு அடுத்த கூறிலும் அடிக்குறிப்பிலும் பாதுகாக்கப்படுகிறது.
- source_word: כִּי כִשְׁמוֹ כֶּן הוּא
  choice: அவன் பெயர் எப்படியோ அப்படியே அவனும் இருக்கிறான்
  rationale: பெயருக்கும் குணத்திற்கும் இடையிலான வெளிப்படையான ஒப்புமையையும் மூலத்தின் பழமொழி போன்ற அமைப்பையும் காக்கிறது.
- source_word: וּנְבָלָה עִמּוֹ
  choice: மூடத்தனமும் அவனோடு இருக்கிறது
  rationale: נְבָלָה என்பதற்கு மூடத்தனம் அல்லது இழிவான நடத்தை என்ற பொருள் இருக்கலாம். இங்கு நாபால் என்ற பெயருடனான சொல்விளையாட்டால் ‘மூடத்தனம்’ ஏற்றதாகும்; ‘அவனோடு இருக்கிறது’ என்பது மூலத்தின் தனித்துவமான சொற்றொடரைப் பாதுகாக்கிறது.
- source_word: אֲמָתְךָ
  choice: உங்கள் அடியாளாகிய நான்
  rationale: பெண் பேச்சாளர் தன்னைத் தாழ்த்திக் குறிப்பிடும் மரியாதைச் சூத்திரம். தமிழில் ‘அடியாள்’ பெண்பாலையும் பணிவையும் இயல்பாக உணர்த்துகிறது.
- source_word: נַעֲרֵי
  choice: இளைஞர்கள்
  rationale: இவர்கள் பணியாளர்கள் அல்லது தூதர்களாகச் செயல்பட்டாலும், மூலச்சொல்லின் நேரடியான வயது சார்ந்த பொருளை ‘இளைஞர்கள்’ காக்கிறது.
- source_word: אֲדֹנִי
  choice: என் ஆண்டவர்
  rationale: அபிகாயில் தாவீதை மரியாதையுடன் அழைக்கும் சமூக மரியாதைச் சொல். தமிழில் ‘என் ஆண்டவர்’ அந்த மரியாதையைச் சரியாக வெளிப்படுத்துகிறது.
