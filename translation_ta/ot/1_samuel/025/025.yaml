translation_notes:
  register: நவீனத் தரமான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. அபிகாயிலின் பணிவான வேண்டுகோளும் நாபாலைப் பற்றிய கடுமையான மதிப்பீடும் ஒரே நேரத்தில் காக்கப்பட்டுள்ளன. சொல்விளையாட்டு தமிழில் முழுமையாக மறுஉருவாக்க முடியாததால், முதன்மை உரையில் ‘நாபால்/மூடத்தனம்’ தொடர்பு வைக்கப்பட்டு அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது.
