  yaml_path: translation/ot/1_samuel/025/024.yaml
  text: She fell at his feet and said[a], “On me, my lord, be the guilt. Please let your servant speak in your hearing[b], and hear the words of your servant.”
translation:
  language: ta
  text: அவள் அவனுடைய கால்களில் விழுந்து, “என் தலைவனே, இந்தக் குற்றம் என்மேல் இருக்கட்டும்.[a] உமது அடியாள் உமது செவிகளில் பேச அனுமதியுங்கள்; உமது அடியாளின் வார்த்தைகளைக் கேளுங்கள்” என்றாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என் தலைவனே, குற்றம் என்னுடையது.” எபிரெயத்தில் இது, “என்மேல், என் தலைவனே, குற்றம்” எனச் சுருக்கமாக உள்ளது; அபிகாயில் குற்றப்பொறுப்பைத் தன்மேல் ஏற்றுக்கொள்வதை இது குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּפֹּל עַל־רַגְלָיו
  choice: அவள் அவனுடைய கால்களில் விழுந்து
  rationale: எபிரெயச் சொற்றொடரின் மன்றாட்டையும் பணிவையும் காட்டும் உடல்நிலையை இயல்பான தமிழில் நேரடியாகப் பாதுகாக்கிறது.
- source_word: בִּי אֲנִי אֲדֹנִי הֶעָוֹן
  choice: என் தலைவனே, இந்தக் குற்றம் என்மேல் இருக்கட்டும்
  rationale: ‘என்மேல் ... குற்றம்’ என்ற எபிரெயச் சுருக்கமான பழமொழிநடையின் தன்னார்வக் குற்றப்பொறுப்பேற்பைத் தக்கவைக்கிறது; வாக்கியத்தின் வேண்டுகோள் நிழலை ‘இருக்கட்டும்’ வெளிப்படுத்துகிறது.
- source_word: אֲדֹנִי
  choice: என் தலைவனே
  rationale: இங்கு தாவீதிடம் காட்டப்படும் சமூக மரியாதையைக் குறிக்கிறது; இறைவனைக் குறிக்கும் பட்டமாகத் தவறாகப் புரிந்துகொள்ளாமல், பணிவான அழைப்பைத் தக்கவைக்கிறது.
- source_word: וּתְדַבֶּר־נָא
  choice: பேச அனுமதியும்
  rationale: נָא உடைய பணிவான வேண்டுகோளையும், எபிரெய வினை வடிவில் உள்ள அனுமதி கோருதலையும் மரியாதைமிக்க தமிழில் வெளிப்படுத்துகிறது.
- source_word: אֲמָתְךָ / אֲמָתֶךָ
  choice: உமது அடியாள்
  rationale: பெண்பால் பணியாளைக் குறிக்கும் சொல்லையும் அபிகாயிலின் தாழ்மையான சுயவிளிப்பையும் இயல்பான தமிழில் காக்கிறது; தமிழிலுள்ள ‘அடியாள்’ பெண்பால் வடிவைத் தெளிவாகக் காட்டுகிறது.
- source_word: בְּאָזְנֶיךָ
  choice: உமது செவிகேட்க
  rationale: சொல்லுக்கு நெருக்கமான ‘உமது செவிகளில்’ என்பதன் பொருளை, கேட்பதற்காகப் பேசுதல் என்ற எபிரெய மரபுத்தொடருக்கு ஏற்ற இயல்பான தமிழில் தருகிறது.
- source_word: וּשְׁמַע אֵת דִּבְרֵי
  choice: வார்த்தைகளைக் கேளும்
  rationale: கேட்கும்படியான நேரடி வேண்டுகோளையும் ‘வார்த்தைகள்’ என்ற மூலப்பெயர்ச்சொல்லையும் பாதுகாக்கிறது.
