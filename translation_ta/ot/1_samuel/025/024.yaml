translation_notes:
  register: நவீனத் தரத் தமிழில், வரலாற்றுக் கதையுரைக்கு ஏற்ற கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. அபிகாயிலின் பணிவான உரைக்கு ‘என் தலைவனே’, ‘உமது’, ‘அடியாள்’, ‘அனுமதியும்’, ‘கேளும்’ ஆகிய மரியாதை வடிவங்கள் தேர்ந்தெடுக்கப்பட்டுள்ளன. மூலத்தில் பெண்பால் குறிக்கும் אמה என்பதற்கு ‘அடியாள்’ பயன்படுத்தப்பட்டு, அதன் இருமுறைத் திருப்பமும் பாதுகாக்கப்பட்டுள்ளது.
