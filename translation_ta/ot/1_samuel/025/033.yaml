theological_decisions:
- issue: דָמִים என்பது இரத்தச்செயலையா இரத்தப்பழியையா குறிக்கிறது
  choice: இரத்தச்செயல்
  alternative: இரத்தப்பழி
  rationale: உடனடிச் சூழல் தாவீது செய்ய எண்ணிய வன்முறைக் கொலையை முன்னிறுத்துகிறது. அதேவேளையில், எபிரெயப் பன்மை வடிவம் அதனால் ஏற்படும் இரத்தப்பழியையும் குறிக்கக்கூடும்; அந்தத் தார்மீகப் பதற்றம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: וְהֹשֵׁעַ יָדִי לִי என்பதன் நேரடிப் பொருளா சூழற்பொருளா
  choice: என் சொந்தக் கையால் என்னையே மீட்டுக்கொள்வது
  alternative: என் சொந்தக் கையால் எனக்காகப் பழிவாங்குவது
  rationale: மூலத்தின் ‘மீட்பு’ மொழியை முதன்மை உரையில் தக்கவைத்து, இச்சூழலில் அது தனிப்பட்ட பழிவாங்குதலைக் குறிக்கிறது என்பதை அடிக்குறிப்பில் வெளிப்படுத்துகிறது.
translation_notes:
  register: நவீனத் தரத்தமிழில் கண்ணியமான வேதாகம நடை பயன்படுத்தப்பட்டுள்ளது. இரு ஆசிமொழிகளின் உயர்ந்த தொனியும், ‘இரத்தங்களுக்குள் வருதல்’ மற்றும் ‘தன் கையால் தன்னை மீட்டுக்கொள்ளுதல்’ ஆகிய எபிரெயச் சொற்படிமங்களின் முக்கிய கூறுகளும் இயல்பான தமிழுக்குள் பாதுகாக்கப்பட்டுள்ளன.
