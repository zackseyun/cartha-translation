base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/033.yaml
  text: And blessed be your judgment[a], and blessed be you[c][b], who have kept me this day from coming into bloodshed and from saving myself by my own hand.
translation:
  language: ta
  text: உன் பகுத்தறிவு[a] ஆசீர்வதிக்கப்படுவதாக! நீயும் ஆசீர்வதிக்கப்பட்டவளாக இருப்பாயாக! இன்று நான் இரத்தப்பொழிவில்[b] இறங்குவதிலிருந்தும், என் சொந்தக் கையால் என்னையே மீட்டுக்கொள்வதிலிருந்தும்[c] என்னைத் தடுத்தாய்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘உன் விவேகம்,’ ‘உன் நிதானம்,’ அல்லது ‘உன் நல்ல தீர்மானம்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில் நேரடியாக ‘இரத்தங்களுக்குள்’; இது ‘இரத்தப்பழிக்குள்’ என்ற பொருளையும் தரக்கூடும்.
    reason: lexical_alternative
  - marker: c
    text: சூழலின்படி, ‘என் சொந்தக் கையால் எனக்காகப் பழிவாங்குவதிலிருந்தும்’ என்றும் பொருள் கொள்ளலாம்.
    reason: lexical_alternative
