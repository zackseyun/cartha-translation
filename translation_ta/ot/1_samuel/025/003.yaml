base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/003.yaml
  text: The man's name was Nabal[a], and his wife's name was Abigail. The woman was intelligent and beautiful in appearance, but the man was harsh and evil in his dealings; he was a Calebite.
translation:
  language: ta
  text: அந்த மனிதனின் பெயர் நாபால்; அவனுடைய மனைவியின் பெயர் அபிகாயில். அந்தப் பெண் நல்ல அறிவுள்ளவளும் தோற்றத்தில் அழகானவளுமாயிருந்தாள். ஆனால் அந்த மனிதன் கடுமையானவனும் தீய செயல்களைச் செய்பவனுமாயிருந்தான்; அவன் காலேபின் குலத்தைச் சேர்ந்தவன்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மூலச்சொல் பெரும்பாலும் ‘காலேபியன்,’ அதாவது காலேபின் குலத்தைச் சேர்ந்தவன் என்று பொருள்படும். ஆனால் அதன் எழுத்து வடிவம் வழக்கத்துக்கு மாறானது; அதை வேறுவிதமாக வாசிக்கும் சாத்தியமும் இருப்பதாகச் சிலர் கருதுகின்றனர்.
    reason: textual_variant
lexical_decisions:
- source_word: נָבָל
  choice: நாபால்
  rationale: தனிப்பெயர் என்பதால் எபிரெய ஒலிப்பைத் தமிழில் இயல்பாக எழுத்துப்பெயர்த்துள்ளது.
- source_word: אֲבִגָיִל
  choice: அபிகாயில்
  rationale: தனிப்பெயரின் எபிரெய ஒலிப்பைத் தமிழில் தெளிவாக எழுத்துப்பெயர்த்துள்ளது.
- source_word: טוֹבַת שֶׂכֶל
  choice: நல்ல அறிவுள்ளவள்
  rationale: ‘புரிதலில்/அறிவில் நல்லவள்’ என்ற பாராட்டுப் பொருளை நவீனத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וִיפַת תֹּאַר
  choice: பார்ப்பதற்கு அழகானவள்
  rationale: உடல் தோற்றத்தின் அழகைக் குறிக்கும் மூலமொழிக் கருத்தைத் தெளிவாகக் காக்கிறது.
- source_word: קָשֶׁה
  choice: கடுமையானவன்
  rationale: மனிதர்களிடம் பழகும் விதத்தில் கடினமும் முரட்டுத்தன்மையும் கொண்ட இயல்பைச் சூழலுக்கேற்றவாறு தெரிவிக்கிறது.
- source_word: רַע מַעֲלָלִים
  choice: செயல்களில் தீயவன்
  rationale: מַעֲלָלִים என்பதன் செயல்கள், நடத்தை என்ற பொருளையும் רַע என்பதன் ஒழுக்கத் தீமையையும் நேரடியாகக் காக்கிறது.
- source_word: כלבו
  choice: காலேபியன்
  rationale: பாரம்பரிய வாசிப்பின்படி காலேபின் குலத்தைச் சேர்ந்தவன் என்ற இனக்குழு/வம்ச அடையாளமாக மொழிபெயர்க்கப்பட்டுள்ளது; எழுத்து வடிவத்தின் வழக்கத்துக்கு மாறான தன்மை அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
theological_decisions:
- issue: וְהוּא כלבו என்ற வாசகத்தின் பொருள்
  choice: அவன் காலேபியன்
  alternative: அவன் காலேபின் குலத்தைச் சேர்ந்தவன்; எழுத்து வடிவத்தை வேறுவிதமாகவும் வாசிக்கலாம்
  rationale: இது கோட்பாட்டுச் சிக்கலைவிட உரை மற்றும் சொற்பொருள் சார்ந்த சிக்கல். பாரம்பரிய வாசிப்பும் சூழலும் காலேபின் குல உறுப்பினர் என்ற பொருளை ஆதரிக்கின்றன; எனினும் அசாதாரண எழுத்து வடிவத்தால் உண்டாகும் நிச்சயமின்மை அடிக்குறிப்பில் குறிப்பிடப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. பெண்ணின் அறிவும் தோற்றமும் ஆணின் கடுமையும் தீய நடத்தையும் எதிரெதிராகக் காட்டும் மூலவாக்கிய அமைப்பு காக்கப்பட்டுள்ளது.
