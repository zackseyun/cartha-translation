base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/031/008.yaml
  text: The next day[a], the Philistines came to strip the slain, and they found Saul and his three sons fallen on Mount Gilboa.
translation:
  language: ta
  text: மறுநாள், போரில் கொல்லப்பட்டவர்களிடமிருந்து உடைகளையும் போர்க் கவசங்களையும் கழற்றி எடுத்துக்கொள்ள[a] பெலிஸ்தியர்கள் வந்தார்கள். சவுலையும் அவருடைய மூன்று மகன்களையும் கில்போவா மலையில் வீழ்ந்து கிடந்ததை அவர்கள் கண்டார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இதனை, “போரில் கொல்லப்பட்டவர்களைக் கொள்ளையிட” என்றும் மொழிபெயர்க்கலாம். இங்குள்ள எபிரெய வினை, போரில் இறந்தவர்களிடமிருந்து உடைகளையோ போர்க் கவசங்களையோ கழற்றி எடுத்துக்கொள்வதைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִמָּחֳרָת
  choice: மறுநாள்
  rationale: முன்பு விவரிக்கப்பட்ட போருக்கு அடுத்த நாளைக் குறிக்கும் இயல்பான, சுருக்கமான காலச் சொல்.
- source_word: לְפַשֵּׁט
  choice: உடைகளையும் போர்க் கவசங்களையும் கழற்றி எடுத்துக்கொள்ள
  rationale: போரில் இறந்தவர்களிடமிருந்து உடை அல்லது போர்க் கவசத்தை அகற்றி எடுத்துக்கொள்வதைக் குறிக்கும் வினையின் சூழல்சார் பொருளைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: הַחֲלָלִים
  choice: போரில் கொல்லப்பட்டவர்கள்
  rationale: பொதுவாக இறந்தவர்களை அல்ல, போரில் வெட்டுண்டு இறந்தவர்களைக் குறிக்கும் மூலமொழியின் இராணுவச் சூழலைப் பாதுகாக்கிறது.
- source_word: וַיִּמְצְאוּ
  choice: அவர்கள் கண்டார்கள்
  rationale: எபிரெயக் கதைநடையின் எளிய தொடர்வினையை இயல்பான தமிழில் தருகிறது.
- source_word: נֹפְלִים
  choice: வீழ்ந்து கிடப்பதை
  rationale: போரில் வீழ்ந்த நிலையைக் காட்டும் மூலமொழிப் படிமத்தைப் பாதுகாத்து, தமிழில் இயல்பாக வாசிக்கச் செய்கிறது.
- source_word: בְּהַר הַגִּלְבֹּעַ
  choice: கில்போவா மலையில்
  rationale: இடப்பெயரையும் மலையின்மேல் நிகழ்ந்ததையும் தெளிவாகவும் இயல்பாகவும் வழங்குகிறது.
- source_word: שְׁלֹשֶׁת בָּנָיו
  choice: அவருடைய மூன்று மகன்கள்
  rationale: எண்ணிக்கையையும் சவுலுடனான குடும்ப உறவையும் நேரடியாகப் பாதுகாக்கிறது.
