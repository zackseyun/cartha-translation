translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையும் கண்ணியமும் கொண்ட வரலாற்றுக் கதைநடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் ‘வீழ்ந்தவர்கள்’ என்ற படிமம் ‘வீழ்ந்து கிடப்பதை’ எனப் பாதுகாக்கப்பட்டுள்ளது; פשט என்பதன் சூழல்சார் பொருள் வாசகருக்குத் தெளிவாக இருக்க மிதமான விளக்க விரிவாக்கம் செய்யப்பட்டுள்ளது.
