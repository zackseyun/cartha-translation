  register: நவீன செந்தமிழுக்கு நெருக்கமான, பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளக்கூடிய கண்ணியமான நடையில் அமைக்கப்பட்டது. எபிரெயக் கதைத் தொடரைத் தமிழில் இயல்பாக்க ‘எடுத்துக்கொண்டு’ மற்றும் ‘பின்பு’ பயன்படுத்தப்பட்டன. மரவகைக்கான தமிழ் வழக்கு தெளிவற்றதால் அடிக்குறிப்பில் துல்லியம் வழங்கப்பட்டது.
