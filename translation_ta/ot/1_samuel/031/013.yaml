base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/031/013.yaml
  text: They took their bones and buried them under the tamarisk tree in Jabesh[b][a], and they fasted seven days.
translation:
  language: ta
  text: அவர்கள் அவர்களுடைய எலும்புகளை எடுத்து, யாபேசில் உள்ள தாமரிஸ்கு மரத்தின்[b] கீழ் அவற்றைப் புதைத்தார்கள்; பின்பு ஏழு நாட்கள் நோன்பிருந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: எபிரெயத்தில் குறிப்பிட்ட மரவகையான ‘தாமரிஸ்கு மரம்’ என்று உள்ளது; ‘தாமரிஸ்கு’ என்றும் மட்டும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַצְמֹתֵיהֶם
  choice: அவர்களுடைய எலும்புகள்
  rationale: עֶצֶם என்பதன் நேர்ப்பொருள் ‘எலும்பு’. முந்தைய வசனத்தில் உடல்கள் எரிக்கப்பட்ட பின்புலத்தில், பொதுவான ‘எஞ்சியவை’ என்பதற்குப் பதிலாக மூலத்தின் தெளிவான சொல்லைத் தக்கவைக்கிறது.
- source_word: וַיִּקְבְּרוּ
  choice: புதைத்தார்கள்
  rationale: קבר என்பது அடக்கம் செய்வதைக் குறிக்கும் வழக்கமான வினை; இங்கு இயல்பான நவீனத் தமிழில் ‘புதைத்தார்கள்’ பொருத்தமானது.
- source_word: תַחַת
  choice: கீழ்
  rationale: תַחַת என்பதன் இடவியல் பொருளைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: הָאֶשֶׁל
  choice: புளியமரம்
  rationale: אֶשֶׁל என்பது tamarisk மரத்தைக் குறிக்கிறது. தமிழில் ‘புளியமரம்’ வேறு இனத்தைக் குறிக்கக்கூடும் என்பதால், மூலமொழியின் குறிப்பிட்ட மரவகையை விளக்கும் அடிக்குறிப்பு இணைக்கப்பட்டுள்ளது.
- source_word: בְּיָבֵשָׁה
  choice: யாபேசில்
  rationale: இது இடப்பெயரான யாபேசைக் குறிக்கிறது; உடனுள்ள பின்புலத்தில் இது யாபேஸ்-கிலேயாத்தின் சுருக்கமான வடிவம்.
- source_word: וַיָּצֻמוּ
  choice: நோன்பிருந்தார்கள்
  rationale: צום என்பதன் எளிய வினைப்பொருளை இயல்பான தமிழில் நேரடியாக வழங்குகிறது.
- source_word: שִׁבְעַת יָמִים
  choice: ஏழு நாட்கள்
  rationale: எண்ணிக்கைக் குறிப்பை நேரடியாகவும் தெளிவாகவும் மொழிபெயர்க்கிறது.
- source_word: וַיִּקְחוּ
  choice: எடுத்துக்கொண்டு
  rationale: לקח என்பதன் ‘எடுத்தல்’ என்ற பொருளைத் தக்கவைத்து, தொடர்ச்சியான செயல்களை இயல்பான தமிழ் வாக்கியத்தில் இணைக்கிறது.
