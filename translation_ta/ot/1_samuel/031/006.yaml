base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/031/006.yaml
  text: So Saul died[a], and his three sons, and his armor-bearer, and all his men[b], together on that day.
translation:
  language: ta
  text: சவுலும், அவனுடைய மூன்று மகன்களும், அவனுடைய ஆயுதம் தாங்குபவனும், அவனுடைய ஆட்கள் அனைவரும்[a][b] அந்த நாளில் ஒருசேர இறந்தனர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அவனுடைய படைவீரர்கள் அனைவரும்’ என்றும் மொழிபெயர்க்கலாம். எபிரெயத்தில் ‘அவனுடைய ஆட்கள் அனைவரும்’ என்று உள்ளது; இந்தப் போர்ச் சூழலில், சவுலோடு தொடர்புடைய ஒவ்வொருவரையும் அல்ல, அவனுடைய போர்ப்படையினரையோ அவனுக்குப் பணியாற்றிய வீரர்களையோ இது குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: சில கிரேக்கச் சுவடிகளில் ‘அவனுடைய ஆட்கள் அனைவரும்’ என்பதற்குப் பதிலாக ‘அவனுடைய ஆயுதங்கள் அனைத்தும்’ என்று உள்ளது. எபிரெய மூலபாடம் ‘அவனுடைய ஆட்கள் அனைவரும்’ என்பதையே ஆதரிக்கிறது.
    reason: textual_variant
lexical_decisions:
- source_word: וַיָּמָת
  choice: இவ்வாறு ... இறந்தார்கள்
  rationale: வாவ் தொடர்வினை முந்தைய நிகழ்வின் விளைவாகக் கதையை முன்னெடுக்கிறது. கூட்டெழுவாய்க்கு ஏற்ற இயல்பான தமிழில் பன்மை வினை பயன்படுத்தப்பட்டுள்ளது.
- source_word: שָׁאוּל
  choice: சவுல்
  rationale: தமிழ் வேதாகம வழக்கில் பரவலாக அறியப்பட்ட பெயர்வடிவம்.
- source_word: וּשְׁלֹשֶׁת בָּנָיו
  choice: அவனுடைய மூன்று மகன்களும்
  rationale: எண்ணையும் உடைமைப் பின்னொட்டையும் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: וְנֹשֵׂא כֵלָיו
  choice: அவனுடைய ஆயுதம் தாங்குபவனும்
  rationale: சொற்றொடர் நேரடியாக அவனுடைய போர்க் கருவிகள் அல்லது ஆயுதங்களைத் தாங்குபவனைக் குறிக்கிறது; நவீன வாசகருக்குப் புரியும் இயல்பான இராணுவச் சொற்றொடர்.
- source_word: גַּם כָּל אֲנָשָׁיו
  choice: அவனுடைய ஆட்கள் அனைவரும்
  rationale: גם இறுதிக் குழுவையும் பட்டியலில் சேர்க்கிறது; தமிழ் ‘-உம்’ மற்றும் ‘அனைவரும்’ மூலம் அந்தச் சேர்க்கை இயல்பாக வெளிப்படுகிறது. אֲנָשָׁיו என்பதன் பரந்த ‘அவனுடைய ஆட்கள்’ என்ற வடிவம் பாதுகாக்கப்படுகிறது.
- source_word: בַּיּוֹם הַהוּא
  choice: அந்த நாளில்
  rationale: எபிரெய காலக் குறிப்பின் நேரடியான, இயல்பான தமிழ் வடிவம்.
- source_word: יַחְדָּו
  choice: ஒன்றாக
  rationale: அவர்கள் அனைவரும் அதே நாளில் சேர்ந்து இறந்தனர் என்ற இணைந்த நிகழ்வைத் துல்லியமாகத் தருகிறது.
