translation_notes:
  register: நவீன நிலையான தமிழில், கண்ணியமான ஆனால் பொதுவாசகருக்கு எளிதில் புரியும் நடையில் அமைக்கப்பட்டுள்ளது. எபிரெயத்தின் ஒருமை வினை வடிவத்தைச் சொற்சொல்லாகப் பின்பற்றாமல், பல எழுவாய்கள் கொண்ட தமிழ் வாக்கியத்திற்கு இயல்பான பன்மை வினை பயன்படுத்தப்பட்டுள்ளது. மூலத்தில் உள்ள பட்டியல் அமைப்பை ‘-உம்’ இணைப்பால் காத்துள்ளது.
