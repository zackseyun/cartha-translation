base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/031/001.yaml
  text: The Philistines were fighting against Israel[a], and the men of Israel fled from before the Philistines and fell slain on Mount Gilboa.
translation:
  language: ta
  text: பெலிஸ்தியர் இஸ்ரவேலுக்கு எதிராகப் போரிட்டுக்கொண்டிருந்தார்கள்; இஸ்ரவேலின் ஆண்கள் பெலிஸ்தியரிடமிருந்து[a] தப்பியோடி, கில்போவா மலையில் கொல்லப்பட்டவர்களாக விழுந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, சொல்லுக்கு சொல், “பெலிஸ்தியரின் முன்னிலையிலிருந்து.”
    reason: மִפְּנֵי பெலிஸ்தியர் என்ற எபிரெய மரபுத்தொடரின் நேரடியான ‘முன்னிலையிலிருந்து’ என்ற பொருளைத் தக்கவைக்கிறது.
lexical_decisions:
- source_word: וּ/פְלִשְׁתִּים
  choice: பெலிஸ்தியர்
  rationale: தொடக்க வாவ் தொடர்ச்சியைச் சுட்டினாலும், தனி வசனத்தின் இயல்பான நவீனத் தமிழில் கட்டாயமாக ‘மேலும்’ அல்லது ‘இப்போது’ சேர்க்கத் தேவையில்லை; மக்கள் பெயர் வழக்கமான தமிழாக்கத்தில் தரப்பட்டுள்ளது.
- source_word: נִלְחָמִים בְּ/יִשְׂרָאֵל
  choice: இஸ்ரவேலுக்கு எதிராகப் போரிட்டுக்கொண்டிருந்தார்கள்
  rationale: எபிரெயப் பங்கேற்புவினை நடந்துகொண்டிருந்த பின்னணி நடவடிக்கையைக் காட்டுவதால் ‘போரிட்டுக்கொண்டிருந்தார்கள்’ எனவும், בְּ இங்கு எதிர்ப்புப் பொருள் தருவதால் ‘எதிராக’ எனவும் மொழிபெயர்க்கப்பட்டது.
- source_word: וַ/יָּנֻסוּ
  choice: தப்பியோடி
  rationale: போர்ச் சூழலில் נוּס பின்வாங்கித் தப்பியோடுதலைக் குறிக்கிறது; ‘தப்பியோடி’ என்பது நவீனத் தமிழில் இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: אַנְשֵׁי יִשְׂרָאֵל
  choice: இஸ்ரவேல் ஆண்கள்
  rationale: மூலத்தில் உள்ள ஆண்பால் பன்மையான ‘இஸ்ரவேலின் ஆண்கள்’ என்ற நேரடியான பொருளைப் பாதுகாக்கிறது; ‘வீரர்கள்’ என்று இடுவது மூலத்தில் வெளிப்படையாக இல்லாத படைத்துறை அடையாளத்தைச் சேர்க்கக்கூடும்.
- source_word: מִ/פְּנֵי פְלִשְׁתִּים
  choice: பெலிஸ்தியரிடமிருந்து
  rationale: சொல்லுக்கு சொல் ‘பெலிஸ்தியரின் முகம்/முன்னிலையிலிருந்து’ என்றாலும், இச்சூழலில் அவர்களிடமிருந்து ஓடிச் சென்றதையே குறிக்கிறது; தமிழ் வழக்கில் ‘பெலிஸ்தியரிடமிருந்து’ அதைப் பொருள் இழப்பின்றி தெரிவிக்கிறது.
- source_word: וַ/יִּפְּלוּ חֲלָלִים
  choice: கொல்லப்பட்டவர்களாய் விழுந்தார்கள்
  rationale: חֲלָלִים போரில் கொல்லப்பட்டவர்களைக் குறிக்கிறது; ‘விழுந்தார்கள்’ என்ற மூலத்தின் காட்சித்தன்மையையும், அவர்கள் கொல்லப்பட்டார்கள் என்ற விளைவையும் இந்தச் சொற்றொடர் காக்கிறது.
- source_word: בְּ/הַר הַ/גִּלְבֹּעַ
  choice: கில்போவா மலையில்
  rationale: இடப்பெயருடன் வரும் הַר இயல்பாக ‘கில்போவா மலை’ என்றும், நிகழ்வு நடந்த இடம் ‘மலையில்’ என்றும் தமிழில் வழங்கப்படுகிறது.
