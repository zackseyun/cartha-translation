translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்கள் புரிந்துகொள்ளும் கண்ணியமான வரலாற்று உரைநடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் நடந்துகொண்டிருந்த போரையும் அதைத் தொடர்ந்து நிகழ்ந்த ஓட்டம் மற்றும் வீழ்ச்சியையும் தெளிவாகப் பிரிக்க இரண்டு வாக்கியங்கள் பயன்படுத்தப்பட்டுள்ளன. விளக்கக் குறிப்புத் தேவையில்லாத அளவில் எபிரெய மொழிமரபு இயல்பான தமிழில் நேரடியாகத் தரப்பட்டதால் அடிக்குறிப்பு சேர்க்கப்படவில்லை.
