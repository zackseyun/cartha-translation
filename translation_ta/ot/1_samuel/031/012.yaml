base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/031/012.yaml
  text: Then all the valiant men arose and went all night[a], and they took the body of Saul and the bodies of his sons from the wall of Beth-shan[b], and they came to Jabesh and burned them there.
translation:
  language: ta
  text: அப்போது வீரமிக்க ஆண்கள் அனைவரும் எழுந்து, இரவு முழுவதும் பயணம் செய்தார்கள். அவர்கள் பெத்-சானின் மதிலிலிருந்து சவுலின் உடலையும் அவன் மகன்களின் உடல்களையும்[a] எடுத்துக்கொண்டு, யாபேஸுக்கு[b] வந்து, அவற்றை அங்கே எரித்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘சடலத்தையும் … சடலங்களையும்’ என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் குறிப்பாக இறந்த உடல்களைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: விரிவான சூழலில் இங்குள்ள யாபேஸ் என்பது யாபேஸ்-கீலேயாத்தைக் குறிக்கிறது.
    reason: cross_reference
lexical_decisions:
- source_word: כָּל אִישׁ חַיִל
  choice: வீரமிக்க ஆண்கள் அனைவரும்
  rationale: இந்த எபிரெய மரபுத்தொடர் வீரமும் போர்த்திறனும் கொண்ட ஆண்களைக் குறிக்கிறது. இராணுவச் சூழலையும் மூலத்தின் ஆண்பால் குறிப்பையும் இயல்பான நவீனத் தமிழில் காக்கிறது.
- source_word: וַיָּק֜וּמוּ
  choice: எழுந்து
  rationale: வினைச்சொல்லின் நேரடிப் பொருளான ‘எழுதல்’ என்பதையும் தொடர்ச்சியான கதைநடையையும் காக்கிறது.
- source_word: וַיֵּלְכ֣וּ כָל הַלַּיְלָה
  choice: இரவு முழுவதும் பயணம் செய்தார்கள்
  rationale: இரவு முழுவதும் தொடர்ந்து சென்றதைத் தெரிவிக்கிறது; அவர்கள் எவ்வாறு சென்றார்கள் என்பதை மூலத்தைவிடக் கூடுதலாகக் குறிப்பிடவில்லை.
- source_word: גְּוִיַּת ... גְּוִיֹּת
  choice: உடலையும் ... உடல்களையும்
  rationale: எபிரெயச் சொல் இறந்த உடலைக் குறித்தாலும், ‘உடல்’ என்பது கண்ணியமானதும் இயல்பானதும் ஆகும். அதன் குறிப்பான பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: מֵחוֹמַת
  choice: மதிலிலிருந்து
  rationale: מִן முன்னொட்டும் חוֹמָה பெயர்ச்சொல்லும் சேர்ந்து ‘மதிலிலிருந்து’ என்ற நேரடிப் பொருளைத் தருகின்றன.
- source_word: בֵּית שָׁן
  choice: பெத்-சான்
  rationale: இடப்பெயரின் எபிரெய ஒலிவடிவத்தைத் தமிழில் தெளிவாக எழுத்துப்பெயர்க்கிறது.
- source_word: יָבֵשָׁה
  choice: யாபேசுக்கு
  rationale: திசையைக் குறிக்கும் இறுதி விகுதி யாபேசை நோக்கிய இயக்கத்தைக் காட்டுகிறது. இங்கு எபிரெய உரை ‘யாபேஸ்’ என்று மட்டுமே கூறுகிறது.
- source_word: וַיִּשְׂרְפ֥וּ אֹתָ֖ם שָׁם
  choice: அவற்றை அங்கே எரித்தார்கள்
  rationale: ‘எரித்தார்கள்’ என்பது வினையின் நேரடிப் பொருள். ‘அவற்றை’ என்பது முந்தைய உடல்களைக் குறிக்கும் மூலத்தின் சுட்டுப்பெயரைப் பாதுகாக்கிறது.
theological_decisions:
- issue: மீட்புப் பணியில் சென்றவர்களைக் குறிக்கும் ஆண்பால் கூட்டுச் சொற்றொடர்
  choice: வீரமிக்க ஆண்கள் அனைவரும்
  alternative: வீரர்கள் அனைவரும்
  rationale: எபிரெய உரை ஆண்பால் வடிவத்தைப் பயன்படுத்துவதோடு, இராணுவச் சூழலில் போரிடும் ஆண்களைக் குறிக்கிறது. ஆகவே மூலத்தின் பாலினக் குறிப்பை மறைக்காமல் இயல்பாக மொழிபெயர்க்கப்பட்டது.
translation_notes:
  register: நவீன நிலையான தமிழில், கண்ணியமான வேதாகமக் கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘சடலம்’ என்பதன் கடுமையைத் தவிர்த்து ‘உடல்’ முதன்மை உரையில் வைக்கப்பட்டு, மூலச்சொல்லின் துல்லியமான இறந்த-உடல் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது. எபிரெய வசனத்தின் தொடர்ச்சியான செயல்வரிசை தமிழில் தெளிவுக்காக இரண்டு வாக்கியங்களாக அமைக்கப்பட்டுள்ளது.
