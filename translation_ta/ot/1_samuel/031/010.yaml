base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/031/010.yaml
  text: They put his armor in the house of the Ashtaroths[c][b][a], and they fastened his body to the wall of Beth-shan.
translation:
  language: ta
  text: அவர்கள் அவனுடைய போர்ச் சாதனங்களை[a] அஸ்தரோத் ஆலயத்தில்[b] வைத்தார்கள்; அவனுடைய உடலைப் பெத்-சானின் மதிலில் பொருத்தினார்கள்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவனுடைய ஆயுதங்களை”; அல்லது இன்னும் பொதுவாக, “அவனுடைய கருவிகள்” அல்லது “சாதனங்களை.” எபிரெயச் சொல் பலவகையான போர்க் கருவிகளைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: சொல்லர்த்தமாக, “அஸ்தரோத்தின் வீட்டில்.” வழிபாட்டுச் சூழலில் “வீடு” என்பது ஆலயம் அல்லது திருத்தலத்தைக் குறிக்கிறது. “அஸ்தரோத்” என்ற எபிரெயப் பெயர் பன்மை வடிவில் உள்ளது.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, “அவனுடைய உடலைப் பெத்-சானின் மதிலில் அடித்துச் செருகினார்கள்.” எபிரெய வினைச்சொல் அடித்துச் செருகுதல் அல்லது உறுதியாகப் பொருத்துதல் என்று பொருள்படலாம்; உடல் எவ்வாறு வைக்கப்பட்டது என்பது துல்லியமாகக் குறிப்பிடப்படவில்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשִׂמוּ
  choice: வைத்தார்கள்
  rationale: שׂוּם என்பதன் அடிப்படைப் பொருள் ‘வை, இடு’. நேரடியான வரலாற்று நடைக்கு ‘வைத்தார்கள்’ இயல்பாக உள்ளது.
- source_word: כֵּלָיו
  choice: அவனுடைய கவசங்களை
  rationale: כְּלִי என்பது கருவிகள், ஆயுதங்கள், போர்ச் சாதனங்கள் எனப் பரந்த பொருள் தரலாம். தோற்கடிக்கப்பட்ட அரசனின் போர்ப் பொருட்கள் என்ற சூழலில் ‘கவசங்கள்’ இயல்பானது; பரந்த பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: בֵּית עַשְׁתָּרוֹת
  choice: அஸ்தரோத் ஆலயத்தில்
  rationale: בֵּית என்பதற்கு சொற்பொருளாக ‘வீடு’ என்றாலும், வழிபாட்டுச் சூழலில் அது ஆலயத்தைக் குறிக்கிறது. עַשְׁתָּרוֹת என்ற பெயர் ஒலிபெயர்ப்பாகத் தக்கவைக்கப்படுகிறது.
- source_word: גְּוִיָּתוֹ
  choice: அவனுடைய உடலை
  rationale: גְּוִיָּה உடலை, இச்சூழலில் இறந்த உடலை, குறிக்கிறது. சவுல் இறந்துவிட்டது சூழலில் தெளிவாக இருப்பதால் ‘உடல்’ இயல்பாகவும் கண்ணியமாகவும் உள்ளது.
- source_word: תָּקְעוּ
  choice: பொருத்தினார்கள்
  rationale: תקע என்பது அடித்துச் செருகுதல், ஊன்றுதல் அல்லது உறுதியாகப் பொருத்துதல் என்று பொருள்படலாம். உடல் எவ்வாறு காட்சிக்கு வைக்கப்பட்டது என்பதை மூலவாசகம் துல்லியமாகச் சொல்லாததால் ‘பொருத்தினார்கள்’ அந்தத் தெளிவின்மையைப் பாதுகாக்கிறது.
- source_word: בְּחוֹמַת
  choice: மதிலில்
  rationale: חוֹמָה நகரின் பாதுகாப்பு மதிலைக் குறிக்கிறது. בְּ முன்னிடைச்சொல் இங்கு உடல் மதிலோடு இணைக்கப்பட்டதைக் காட்டுகிறது.
- source_word: בֵּית שָׁן
  choice: பெத்-சான்
  rationale: இடப்பெயர் எபிரெய ஒலிவடிவத்தை அணுகும் வகையில் தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளது.
