translation_notes:
  register: நவீனத் தரத் தமிழில், கண்ணியமான மற்றும் பொதுவாசகர்களுக்குப் புரியும் கதைநடை பயன்படுத்தப்பட்டது. மூலத்தில் இருமுறை வரும் ‘இஸ்ரவேல் ஆண்கள்’ மற்றும் ‘மறுபுறம்’ ஆகிய மறுமொழிகள் தக்கவைக்கப்பட்டன. ஆங்கில ஆலோசனை உரையில் அடிக்குறிப்பு குறிகள் உள்ளடக்கத்துடன் பொருந்தாமல் இடமாற்றம் அடைந்திருப்பதாகத் தெரிகிறது; எபிரெய மூலத்துக்கு ஏற்ப ישב பற்றிய மாற்றுப் பொருள் மட்டும் [a] எனச் சரியான இடத்தில் தரப்பட்டது.
