base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/031/007.yaml
  text: When the men of Israel who were on the other side of the valley[a], and those on the other side of the Jordan, saw that the men of Israel had fled and that Saul and his sons were dead, they abandoned the cities and fled[b]; and the Philistines came and lived in them.
translation:
  language: ta
  text: பள்ளத்தாக்கின் மறுபுறத்திலும் யோர்தானின் மறுபுறத்திலும் இருந்த இஸ்ரவேல் ஆண்கள், இஸ்ரவேல் ஆண்கள் தப்பியோடிவிட்டதையும் சவுலும் அவனுடைய மகன்களும் இறந்துவிட்டதையும் கண்டபோது, நகரங்களைக் கைவிட்டுத் தப்பியோடினார்கள். பெலிஸ்தியர்கள் வந்து அவற்றில் குடியேறினார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவற்றில் வசித்தார்கள்.” எபிரெய வினைச்சொல் வசிப்பதையோ குடியேறுவதையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרְאוּ
  choice: கண்டபோது
  rationale: ראה என்பதன் அடிப்படைப் பொருள் ‘காணுதல்.’ இங்கு அவர்கள் கவனித்து அறிந்த நிகழ்வுகளைச் சுட்டுவதால், கதைநடையின் நேரடித்தன்மையை ‘கண்டபோது’ காக்கிறது.
- source_word: אַנְשֵׁי יִשְׂרָאֵל
  choice: இஸ்ரவேல் ஆண்கள்
  rationale: எபிரெயச் சொற்றொடர் நேரடியாக ‘இஸ்ரவேலின் ஆண்கள்’ எனப் பொருள்படும். போர்ச் சூழலில் பாலினக் குறிப்பையும் மூலத்தின் வடிவத்தையும் தக்கவைக்க இந்தத் தேர்வு செய்யப்பட்டது.
- source_word: בְּעֵבֶר הָעֵמֶק / בְּעֵבֶר הַיַּרְדֵּן
  choice: பள்ளத்தாக்கின் மறுபுறத்தில் / யோர்தானின் மறுபுறத்தில்
  rationale: עֵבֶר என்பது ஒரு குறிப்புப் புள்ளியிலிருந்து அப்பால் அல்லது மறுபுறம் உள்ள பகுதியைக் குறிக்கிறது. இரு இடங்களிலும் வரும் மறுமொழியைத் தமிழிலும் காத்துள்ளது.
- source_word: כִּי נָסוּ
  choice: தப்பியோடிவிட்டதை
  rationale: கவனித்த நேரத்திற்கு முன்பே நிகழ்ந்த செயல் என்பதைத் தமிழின் நிறைவுற்ற வினைவடிவம் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: מֵתוּ
  choice: இறந்துவிட்டதை
  rationale: מות மரணத்தை மட்டுமே குறிப்பிடுகிறது; கொல்லப்பட்ட விதத்தை வெளிப்படையாகச் சொல்லவில்லை. ஆகவே ‘கொல்லப்பட்டனர்’ என்று கூடுதல் பொருள் சேர்க்கப்படவில்லை.
- source_word: וַיַּעַזְבוּ אֶת־הֶעָרִים
  choice: நகரங்களைக் கைவிட்டு
  rationale: עזב என்பது விட்டுச் செல்லுதல் அல்லது கைவிடுதல். படையெடுப்பின் அவசரத்தையும் நகரங்கள் இழக்கப்பட்டதையும் ‘கைவிட்டு’ தெளிவாகத் தருகிறது.
- source_word: וַיָּנֻסוּ
  choice: தப்பியோடினார்கள்
  rationale: נוס என்பதற்கான இயல்பான கதைநடைத் தமிழ்; ஆபத்திலிருந்து ஓடிச் சென்றதைக் காட்டுகிறது.
- source_word: וַיָּבֹאוּ פְלִשְׁתִּים
  choice: பெலிஸ்தியர்கள் வந்து
  rationale: בוא என்பதன் பொதுவான ‘வருதல்’ என்ற பொருளைக் காக்கிறது; அடுத்த வாக்கியப்பகுதி அவர்கள் நகரங்களை ஆக்கிரமித்ததைக் குறிப்பாக்குகிறது.
- source_word: וַיֵּשְׁבוּ בָּהֶן
  choice: அவற்றில் குடியேறினார்கள்
  rationale: ישב என்பது அமர்தல், வசித்தல், குடியேறுதல் ஆகியவற்றைக் குறிக்கலாம். கைவிடப்பட்ட நகரங்களைப் பெலிஸ்தியர்கள் கைப்பற்றி வாழத் தொடங்கிய சூழலில் ‘குடியேறினார்கள்’ இயல்பாக உள்ளது; இருப்பினும் ‘வசித்தார்கள்’ என்பதும் சாத்தியம்.
