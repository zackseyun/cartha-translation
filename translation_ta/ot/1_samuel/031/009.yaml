source:
  edition: WLC
  text: וַֽ/יִּכְרְתוּ֙ אֶת רֹאשׁ֔/וֹ וַ/יַּפְשִׁ֖יטוּ אֶת כֵּלָ֑י/ו וַ/יְשַׁלְּח֨וּ בְ/אֶֽרֶץ פְּלִשְׁתִּ֜ים סָבִ֗יב לְ/בַשֵּׂ֛ר בֵּ֥ית עֲצַבֵּי/הֶ֖ם וְ/אֶת הָ/עָֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/031/009.yaml
  text: They cut off his head and stripped off his armor[a], and sent messengers throughout the land of the Philistines all around[b], to proclaim the good news to the house of their idols and to the people.
translation:
  language: ta
  text: அவர்கள் சவுலின் தலையைத் துண்டித்து, அவருடைய போர்க்கருவிகளைக்[a] கழற்றி எடுத்தார்கள். பின்னர், தங்கள் சிலைகளின் கோவிலுக்கும் மக்களுக்கும் வெற்றிச் செய்தியை அறிவிப்பதற்காக பெலிஸ்தியரின் நாடெங்கும் தூதர்களை[b] அனுப்பினார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கவசத்தையும் ஆயுதங்களையும்.” எபிரெயச் சொல் போர் உபகரணங்களைப் பொதுவாகக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “தூதர்களை” என்பது எபிரெய மூலத்தில் வெளிப்படையாக இல்லை; செய்தியை அறிவிப்பதற்காக அனுப்பப்பட்டவர்கள் என்பதால் பொருளடிப்படையில் சேர்க்கப்பட்டுள்ளது.
    reason: implicit_object
lexical_decisions:
- source_word: וַיִּכְרְתוּ אֶת־רֹאשׁוֹ
  choice: சவுலின் தலையை வெட்டி
  rationale: כרת என்பதற்கு ‘வெட்டு/துண்டி’ என்பது பொருள்; ‘அவனுடைய’ என்ற பின்னொட்டு முந்தைய சூழலில் சவுலைக் குறிக்கிறது. இயல்பான தமிழுக்காகப் பெயர் வெளிப்படையாகக் கொடுக்கப்பட்டது.
- source_word: וַיַּפְשִׁיטוּ אֶת־כֵּלָיו
  choice: அவருடைய போர்க்கருவிகளைக் கழற்றி எடுத்தார்கள்
  rationale: פשׁט என்பது உடலில் அணிந்திருந்தவற்றைக் கழற்றுவதைக் குறிக்கிறது. כֵּלִים என்பது கவசம், ஆயுதங்கள் உள்ளிட்ட போர்ச் சாதனங்களை உள்ளடக்கக்கூடிய விரிவான சொல்; ஆகவே ‘போர்க்கருவிகள்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: וַיְשַׁלְּחוּ
  choice: தூதர்களை அனுப்பினார்கள்
  rationale: எபிரெய வினைச்சொல் வெறுமனே ‘அனுப்பினார்கள்’ என்கிறது; நாடெங்கும் செய்தியை அறிவிக்கும் சூழல், அனுப்பப்பட்டவர்கள் தூதர்கள் என்பதை உணர்த்துகிறது.
- source_word: בְאֶרֶץ פְּלִשְׁתִּים סָבִיב
  choice: பெலிஸ்தியரின் நாடெங்கும்
  rationale: סָבִיב இங்கு செய்தி பெலிஸ்திய நாட்டின் எல்லாப் பகுதிகளிலும் பரப்பப்பட்டதைத் தெரிவிக்கிறது; ‘நாடெங்கும்’ என்பது இதற்கான இயல்பான தமிழ்.
- source_word: לְבַשֵּׂר
  choice: இந்த வெற்றிச் செய்தியை அறிவிப்பதற்காக
  rationale: בשׂר என்பது மகிழ்ச்சியான அல்லது நல்ல செய்தியை அறிவிப்பதைக் குறிக்கிறது. இங்கு அது பெலிஸ்தியரின் பார்வையில் வெற்றிச் செய்தி; ‘வெற்றிச் செய்தி’ சூழலைத் தெளிவாக்குகிறது, ஆனால் நிகழ்வை ஒழுக்கரீதியாக அங்கீகரிக்கவில்லை.
- source_word: בֵּית עֲצַבֵּיהֶם
  choice: தங்கள் சிலைகளின் கோவிலுக்கு
  rationale: בֵּית என்பதன் அடிப்படைப் பொருள் ‘வீடு’; வழிபாட்டுச் சூழலில் அது கோவில் அல்லது சன்னதியைக் குறிக்கும். עֲצַבִּים என்பது சிலைகள்/விக்கிரகங்கள்.
- source_word: וְאֶת־הָעָם
  choice: மக்களுக்கும்
  rationale: אֵת குறிக்கும் இரண்டாவது பெறுபொருள் ‘மக்கள்’; அறிவிக்கப்பட்ட செய்தி சிலைகளின் கோவிலுக்கும் மக்களுக்கும் சென்றது என்ற எபிரெய அமைப்பு காக்கப்பட்டது.
theological_decisions:
- issue: பெலிஸ்திய வழிபாட்டிடத்தையும் வழிபாட்டுப் பொருட்களையும் குறிப்பிடுதல்
  choice: தங்கள் சிலைகளின் கோவில்
  alternative: தங்கள் விக்கிரகங்களின் வீடு
  rationale: இச்சொற்றொடர் பெலிஸ்திய தெய்வங்களின் மெய்ம்மையை உறுதிப்படுத்துவதில்லை. ‘சிலைகள்’ என்பது עֲצַבִּים என்பதன் பொருளைக் காட்டுகிறது; வழிபாட்டுச் சூழலில் ‘கோவில்’ என்பது בֵּית என்பதன் இயல்பான தமிழ்.
- issue: בשׂר என்பதிலுள்ள ‘நற்செய்தி’ நுணுக்கம்
  choice: வெற்றிச் செய்தி
  alternative: நற்செய்தி
  rationale: இது பெலிஸ்தியருக்கு மகிழ்ச்சியளித்த போர்வெற்றிச் செய்தி என்பதைச் சூழலோடு தெரிவிக்கிறது; கிறிஸ்தவ ‘நற்செய்தி’ என்ற தொழில்நுட்பப் பொருளைத் தவிர்க்கிறது.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான, பொதுவாசகர்களுக்கு எளிதில் புரியும் தமிழ் பயன்படுத்தப்பட்டது. வன்முறைச் செயல் நேரடியாகவும் மிகைப்படுத்தாமலும் சொல்லப்பட்டுள்ளது; ‘வெற்றிச் செய்தி’ பெலிஸ்தியரின் பார்வையை மட்டும் குறிக்கிறது.
