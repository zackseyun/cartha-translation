  yaml_path: translation/ot/1_samuel/031/005.yaml
  text: When his armor-bearer saw that Saul was dead[a], he too fell on his sword and died with him.
translation:
  language: ta
  text: சவுல் இறந்துவிட்டதைக்[a] கண்ட சவுலின் ஆயுதம் தாங்குபவனும் தன் வாள்மேல் விழுந்து, அவனோடு இறந்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘சவுல் இறந்திருந்ததைக்.’ எபிரெயச் சொல் இறந்த நிலையையோ, ஆயுதம் தாங்குபவனின் செயலுக்கு முன்னரே நிறைவுற்ற மரண நிகழ்வையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: נֹשֵׂא כֵלָיו
  choice: அவனுடைய ஆயுதம் தாங்குபவன்
  rationale: இந்தக் கட்டமைப்பின் நேரடிப் பொருள் சவுலின் போர்க்கருவிகளைச் சுமப்பவன் என்பதாகும். நவீனத் தமிழில் இயல்பாகவும் அந்த இராணுவப் பணியைத் தெளிவாகவும் காட்டுகிறது.
- source_word: כִּי
  choice: என்பதை (-தைக்)
  rationale: சவுல் இறந்த நிலையை அவன் கண்டான் என்பதைக் கூறும் உள்ளடக்க இணைப்பாக இங்கு வருகிறது; காரணப் பொருளைத் தேவையின்றி சேர்க்கவில்லை.
- source_word: מֵת
  choice: இறந்துவிட்டதை
  rationale: மரணம் நிறைவுற்றதையும் அதன் விளைவான இறந்த நிலையையும் தமிழில் இயல்பாகக் காட்டுகிறது. ‘இறந்திருந்ததை’ என்பதும் எபிரெயில் சாத்தியம் என்பதால் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: גַּם הוּא
  choice: -உம்
  rationale: ஆயுதம் தாங்குபவனும் சவுலைப் போலவே செய்தான் என்ற சேர்க்கை வலியுறுத்தலைத் தமிழின் இயல்பான ‘உம்’ விகுதி காக்கிறது.
- source_word: עַל חַרְבּוֹ
  choice: தன் வாள்மேல்
  rationale: எபிரெயச் சொல்லாட்சியை நேரடியாகக் காத்து, செயல் எவ்வாறு நடந்தது என்பதையும் தெளிவாகக் கூறுகிறது.
- source_word: וַיָּמָת עִמּוֹ
  choice: அவனோடு இறந்தான்
  rationale: עִם கூறும் உடன்நிகழ்வை நேரடியாக வெளிப்படுத்துகிறது; இடத்தைப் பற்றிய கூடுதல் கருத்தைச் சேர்க்கவில்லை.
- source_word: וַיַּרְא
  choice: கண்ட ... -உம்
  rationale: முதலில் கண்டதும், அதன் பின்னர் விழுந்து இறந்ததும் ஆகிய கதைத் தொடரைத் தமிழில் இயல்பான வினையெச்ச அமைப்பால் இணைக்கிறது.
