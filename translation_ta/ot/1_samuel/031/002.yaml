  verdict: revise
  source_fidelity: 'முதல் வினைச்சொல்லுக்கான கருத்து சரியாக உள்ளது: பெலிஸ்தியர்கள் சவுலையும் அவன் மகன்களையும் நெருக்கமாகத் துரத்திச் சென்று எட்டினர். ஆனால் נכה என்பது ‘வெட்டுதல்’ என்று குறிப்பதில்லை; ‘வெட்டி வீழ்த்தினார்கள்’ என்பது மூலத்தில் இல்லாத ஆயுத/வெட்டும் செயலைச் சேர்க்கிறது. ‘தாக்கி வீழ்த்தினார்கள்’ மூலத்தின் தாக்குதல் பொருளையும் போர்ச் சூழலில் உள்ள மரண விளைவையும் பொருத்தமாகக் காக்கிறது.'
  naturalness: ‘நெருங்கிப் பிடித்தார்கள்’ புரியக்கூடியதாக இருந்தாலும், மனிதர்களைத் துரத்தி எட்டிய போர்ச் சூழலை ‘துரத்திச் சென்று பிடித்தார்கள்’ இன்னும் தெளிவாகவும் இயல்பாகவும் சொல்கிறது. இரண்டாவது வாக்கியத்தில் வெளிப்படையான எழுவாயாக ‘பெலிஸ்தியர்கள்’ என்பதை மீண்டும் இடுவது எபிரெய வாக்கிய அமைப்பையும் தெளிவான வரலாற்று நடையையும் காக்கிறது.
  terminology: பெலிஸ்தியர்கள், சவுல், யோனத்தான், அபினதாப், மல்கிசூவா ஆகிய பெயர்கள் ஏற்றவை. ‘சவுலின் மகன்களான’ என்பது இறுதியில் வரும் எபிரெய விளக்கத் தொடரை தமிழில் இயல்பாகத் தருகிறது.
