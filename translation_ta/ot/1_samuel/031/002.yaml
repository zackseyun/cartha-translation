translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான வரலாற்று-விவரண நடை பயன்படுத்தப்பட்டுள்ளது. முதல் வினையில் நெருங்கிய துரத்தல் இலக்கை அடைவது தெளிவாக்கப்பட்டுள்ளது; இரண்டாவது வினையில் மரண விளைவு தெரிவிக்கப்பட்டாலும், மூலத்தின் தாக்குதல் சார்ந்த வினைத் தோற்றம் காக்கப்பட்டுள்ளது.
