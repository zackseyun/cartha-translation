- from: பெலிஸ்தியர்கள் சவுலையும் அவன் மகன்களையும் நெருங்கிப் பிடித்தார்கள்[a]. அவர்கள் சவுலின் மகன்களான யோனத்தான், அபினதாப், மல்கிசூவா ஆகியோரை வெட்டி வீழ்த்தினார்கள்[b].
