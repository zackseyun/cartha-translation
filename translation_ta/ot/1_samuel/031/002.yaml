  text: The Philistines overtook Saul and his sons[a], and the Philistines struck down Jonathan, Abinadab, and Malchi-shua[b], the sons of Saul.
translation:
  language: ta
  text: பெலிஸ்தியர்கள் சவுலையும் அவன் மகன்களையும் துரத்திச் சென்று பிடித்தார்கள்[a]. பெலிஸ்தியர்கள் சவுலின் மகன்களான யோனத்தானையும் அபினதாபையும் மல்கிசூவாவையும் தாக்கி வீழ்த்தினார்கள்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சவுலையும் அவன் மகன்களையும் எட்டிப் பிடித்தார்கள்,” அல்லது “சவுலையும் அவன் மகன்களையும் விடாமல் நெருக்கமாகத் துரத்தினார்கள்.” எபிரெய வினைச்சொல் இலக்கை எட்டும் அளவுக்கு நெருக்கமாகத் துரத்துவதைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “யோனத்தான், அபினதாப், மல்கிசூவா ஆகியோரைக் கொன்றார்கள்.” எபிரெய வினைச்சொல்லின் நேரடிப் பொருள் “அடித்தார்கள்” அல்லது “தாக்கினார்கள்”; ஆனால் இந்தப் போர்ச் சூழலில் அது அவர்களுடைய மரணத்தைக் குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּדְבְּקוּ
  choice: நெருங்கிப் பிடித்தார்கள்
  rationale: דבק இங்கு போரில் விடாமல் நெருக்கமாகத் துரத்திச் சென்று இலக்கை எட்டுவதைக் குறிக்கிறது. ‘நெருங்கிப் பிடித்தார்கள்’ என்பது வெறும் பின்தொடர்தலைவிட இலக்கை அடைந்ததையும் இயல்பான தமிழில் உணர்த்துகிறது.
- source_word: פְלִשְׁתִּים
  choice: பெலிஸ்தியர்கள்
  rationale: அறியப்பட்ட மக்களினத்திற்கான தமிழில் வழக்கிலுள்ள பெயர்ப்பு.
- source_word: אֶת שָׁאוּל וְאֶת בָּנָיו
  choice: சவுலையும் அவன் மகன்களையும்
  rationale: בָּנָיו என்பது பொதுவான ‘பிள்ளைகள்’ என்பதல்ல, குறிப்பாக ‘அவன் மகன்கள்’ என்பதாகும்; அடுத்த பகுதியில் அவர்கள் பெயரிடப்படுவது இதை உறுதிப்படுத்துகிறது.
- source_word: וַיַּכּוּ
  choice: வெட்டி வீழ்த்தினார்கள்
  rationale: נכה என்பதன் அடிப்படைப் பொருள் தாக்குதல் அல்லது அடித்தல். இப்போர்ச் சூழலில் பெயரிடப்பட்டவர்கள் உயிரிழந்ததை இது குறிக்கிறது; ‘வெட்டி வீழ்த்தினார்கள்’ வன்முறைச் செயலையும் அதன் மரண விளைவையும் இயல்பாகத் தெரிவிக்கிறது, ஆனால் ‘கொன்றார்கள்’ என்பதைக் காட்டிலும் மூல வினையின் உருவகத்தை ஓரளவு காக்கிறது.
- source_word: יְהוֹנָתָן
  choice: யோனத்தான்
  rationale: எபிரெயப் பெயரின் தமிழில் நிலைபெற்ற வடிவம்.
- source_word: אֲבִינָדָב
  choice: அபினதாப்
  rationale: எபிரெயப் பெயரின் ஒலியமைப்பை நெருக்கமாகப் பிரதிபலிக்கும் தமிழ் வடிவம்.
- source_word: מַלְכִּי שׁוּעַ
  choice: மல்கிசூவா
  rationale: கூட்டுப் பெயரின் எபிரெய ஒலியமைப்பை வாசிக்க எளிய தமிழில் பிரதிபலிக்கிறது.
- source_word: בְּנֵי שָׁאוּל
  choice: சவுலின் மகன்களான
  rationale: பெயரிடப்பட்ட மூவரையும் சவுலின் மகன்கள் என்று அடையாளப்படுத்தும் மூலத்தின் விளக்கநிலைத் தொடரை இயல்பான தமிழில் காக்கிறது.
