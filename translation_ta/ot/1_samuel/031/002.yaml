  rationale: மூலத்தில் இல்லாத ‘வெட்டுதல்’ கருத்து நீக்கப்பட்டு, போர்ச் சூழலில் நכה வினையின் தாக்குதல் மற்றும் வீழ்த்துதல் பொருளைத் தரும் ‘தாக்கி வீழ்த்தினார்கள்’ பயன்படுத்தப்பட்டது. முதல் வாக்கியம் நெருக்கமான துரத்தல் எட்டிப் பிடிப்பில் முடிவடைவதைத் தெளிவாக வெளிப்படுத்துகிறது. குறிப்பு b-இல் மரண விளைவு சூழலால் ஊகிக்கப்படுவது என்பதால் ‘குறிக்கக்கூடும்’ என எச்சரிக்கையுடன் கூறப்பட்டுள்ளது.
