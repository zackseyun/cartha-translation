base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/031/004.yaml
  text: Then Saul said to his armor-bearer[a], “Draw your sword and thrust me through with it, lest these uncircumcised men come and thrust me through and mistreat me.” But his armor-bearer was not willing, because he was very afraid. So Saul took the sword and fell on it.
translation:
  language: ta
  text: அப்போது சவுல் தன் ஆயுதங்களைச் சுமப்பவனிடம், “உன் வாளை உருவி, அதனால் என்னைக் குத்து. இல்லாவிட்டால், விருத்தசேதனம் செய்யப்படாத இவர்கள் வந்து என்னைக் குத்தி, என்னை இழிவாக நடத்துவார்கள்[a]” என்றான். ஆனால் அவனுடைய ஆயுதங்களைச் சுமப்பவன் மிகவும் பயந்ததால் விரும்பவில்லை. எனவே சவுல் அந்த வாளை எடுத்து, அதன்மேல் விழுந்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என்னைத் துன்புறுத்துவார்கள்,” “என்னைக் கேலிக்குரியவனாக்குவார்கள்,” அல்லது “என்னை அவமானமாக நடத்துவார்கள்.”
    reason: எபிரேயச் சொல் அவமானகரமான அல்லது கொடுமையான நடத்தையைக் குறிக்கிறது; அதன் துல்லியமான வடிவத்தை உரை குறிப்பிடவில்லை.
lexical_decisions:
- source_word: נֹשֵׂא כֵלָיו
  choice: அவனுடைய ஆயுதங்களைச் சுமப்பவன்
  rationale: அரசரின் போர்க்கருவிகளைச் சுமக்கும் படைப் பணியாளரைக் குறிக்கும் எபிரேயச் சொல்லாட்சியைத் தெளிவாகவும் இயல்பாகவும் தருகிறது; தமிழில் அரிதான தொழில்நுட்பப் பட்டப்பெயரைத் தவிர்க்கிறது.
- source_word: שְׁלֹף
  choice: உருவி
  rationale: உறையிலிருந்து வாளை வெளியே எடுக்கும் செயலைச் சுருக்கமாகவும் போர்ச் சூழலுக்கு ஏற்றவாறும் தெரிவிக்கிறது.
- source_word: וְדָקְרֵנִי בָהּ / וּדְקָרֻנִי
  choice: அதனால் என்னைக் குத்திக் கொன்றுவிடு / என்னைக் குத்தி
  rationale: דקר என்பதன் துளைத்துக் குத்தும் பொருளைத் தக்கவைக்கிறது. முதல் இடத்தில் சவுலின் உயிரிழக்கும் நோக்கம் சூழலால் தெளிவாக இருப்பதால் ‘கொன்றுவிடு’ சேர்க்கப்பட்டது; இரண்டாம் இடத்தில் மூலத்தின் தொடர்ச்சியான அச்சுறுத்தல் இயல்பாகத் தரப்பட்டது.
- source_word: פֶּן
  choice: இல்லாவிட்டால்
  rationale: சவுல் அஞ்சும் விளைவை நவீன தமிழில் இயல்பான எச்சரிக்கை அமைப்பாக வெளிப்படுத்துகிறது.
- source_word: הָעֲרֵלִים הָאֵלֶּה
  choice: விருத்தசேதனம் செய்யப்படாத இவர்கள்
  rationale: ‘பெலிஸ்தியர்’ என்று விளக்கிச் சேர்க்காமல், மூலத்திலுள்ள இழிவான உடன்படிக்கைச் சார்ந்த அடையாளத்தை நேரடியாகத் தக்கவைக்கிறது.
- source_word: וְהִתְעַלְּלוּ בִי
  choice: என்னை இழிவாக நடத்துவார்கள்
  rationale: துன்புறுத்தல், கேலிக்குரியவனாக்குதல், அவமானப்படுத்துதல் ஆகிய சாத்தியங்களை ஒரு குறிப்பிட்ட வகையாகச் சுருக்காமல், அவமானகரமான தவறான நடத்தையைத் தெரிவிக்கிறது.
- source_word: וְלֹא אָבָה
  choice: அதற்குச் சம்மதிக்கவில்லை
  rationale: செய்ய மனமில்லாமை அல்லது மறுப்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: כִּי יָרֵא מְאֹד
  choice: மிகவும் பயந்ததால்
  rationale: மறுப்பிற்கான காரணத்தையும் מְאֹד என்ற வலியுறுத்தலையும் தெளிவாகக் காக்கிறது.
- source_word: וַיִּפֹּל עָלֶיהָ
  choice: அதன்மேல் விழுந்தான்
  rationale: ‘அதன்மேல் விழுந்தான்’ என்ற எபிரேயச் சொற்றொடரின் சுருக்கத்தையும் செயற்கையாக விரிவுபடுத்தாத தன்மையையும் தக்கவைக்கிறது.
theological_decisions:
- issue: சவுல் அஞ்சிய அவமதிப்பின் துல்லியமான தன்மை
  choice: என்னை இழிவாக நடத்துவார்கள்
  alternative: என்னைக் கேலி செய்வார்கள் / என்னைத் துன்புறுத்துவார்கள் / என்னை அவமானப்படுத்துவார்கள்
  rationale: எபிரேய வினை அவமானகரமான, கொடுமையான நடத்தையைக் குறிக்கிறது; ஆனால் அது கேலி, சித்திரவதை அல்லது வேறொரு குறிப்பிட்ட வடிவம் என்று உரை நிர்ணயிக்கவில்லை. ஆகவே அந்தத் தெளிவின்மை பாதுகாக்கப்பட்டது.
- issue: சவுலின் கட்டளையில் உயிரிழக்கும் நோக்கம்
  choice: என்னைக் குத்திக் கொன்றுவிடு
  alternative: என்னைக் குத்து / என்னை ஊடுருவக் குத்து
  rationale: அடுத்துவரும் சவுலின் செயலும் உடனடிச் சூழலும் உயிரைக் கொல்லும் நோக்கத்தைத் தெளிவாக்குகின்றன. தமிழில் வெறும் ‘குத்து’ என்பது உயிர்க்கொலை நோக்கத்தைத் தேவையற்ற அளவு மங்கச் செய்யக்கூடும்.
translation_notes:
  register: நவீன நிலையான தமிழில், கண்ணியமான வேதாகம நடையுடன் மொழிபெயர்க்கப்பட்டது. ‘ஆயுதங்களைச் சுமப்பவன்’ என்பது பொதுவாசகருக்குத் தெளிவாக இருக்கத் தேர்ந்தெடுக்கப்பட்டது. நேரடி உரையில் சவுலின் அவசரத்தையும் மூலத்தின் வினைமுறை மீளுரைப்பையும் இயன்றவரைத் தக்கவைத்துள்ளது.
