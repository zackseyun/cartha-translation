base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/031/003.yaml
  text: And the battle grew heavy against Saul[a], and the archers found him[b], and he was greatly wounded by the archers.
translation:
  language: ta
  text: போர் சவுலுக்கு எதிராகக் கடுமையடைந்தது. வில்லாளிகள் அவனைக் கண்டார்கள்[b]; வில்லாளிகளால் அவன் மிகவும் வேதனைக்குள்ளானான்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இதை, “வில்லாளிகளால் அவன் மிகவும் கடுமையாகக் காயமடைந்தான்” என்றும், “வில்லாளிகளால் அவன் மிகவும் நடுங்கினான்/கலக்கமடைந்தான்” என்றும் மொழிபெயர்க்கலாம். இங்குள்ள எபிரெய வினை கடும் உடல்வலி, நடுக்கம் அல்லது மனவேதனையைக் குறிக்கக்கூடும்.
    reason: lexical_alternative
  - marker: b
    text: 'எபிரெயத்தில் சொல்லுக்குச் சொல்: “எய்கிறவர்கள்—வில்லுடைய ஆட்கள்—அவனைக் கண்டார்கள்.” இயல்பான தமிழில் இது “வில்லாளிகள்” என்று சுருக்கப்பட்டுள்ளது.'
    reason: source_fullness
lexical_decisions:
- source_word: וַתִּכְבַּד הַמִּלְחָמָה אֶל שָׁאוּל
  choice: போர் சவுலுக்கு எதிராகக் கடுமையடைந்தது
  rationale: כבד என்பதன் அடிப்படைப் பொருள் ‘கனமாதல்’; போர்ச் சூழலில் அது போர் தீவிரமடைந்து சவுல்மீது கடுமையாக அழுத்தியதைக் குறிக்கிறது. இயல்பான தமிழுக்காக ‘கடுமையடைந்தது’ என வழங்கப்பட்டது.
- source_word: וַיִּמְצָאֻהוּ
  choice: அவனைக் கண்டார்கள்
  rationale: מצא என்பதன் நேரடிப் பொருளான ‘கண்டார்கள்’ என்பதைக் காத்திருக்கிறது; இச்சூழலில் வில்லாளிகள் அவனை அடையாளம் கண்டு நெருங்கியதையும் இது உணர்த்தலாம்.
- source_word: הַמּוֹרִים אֲנָשִׁים בַּקָּשֶׁת
  choice: வில்லாளிகள்
  rationale: ‘எய்கிறவர்கள்—வில்லுடைய ஆட்கள்’ என்ற எபிரெய விளக்கத் தொடரை, அதன் முழுப் பொருளையும் இயல்பாகத் தரும் ‘வில்லாளிகள்’ என்ற ஒரே தமிழ்ச் சொல்லில் வழங்குகிறது.
- source_word: וַיָּחֶל מְאֹד
  choice: அவன் மிகவும் வேதனைக்குள்ளானான்
  rationale: இங்குள்ள அரிய வினை வடிவம் உடற்காயம், கடும் வலி, நடுக்கம் அல்லது மனத்துயரம் ஆகியவற்றைக் குறிக்கக்கூடும். ‘வேதனைக்குள்ளானான்’ என்பது உடல் மற்றும் உள்ளார்ந்த துன்பம் இரண்டிற்கும் இடமளித்து மூலத்தின் தெளிவின்மையைப் பாதுகாக்கிறது.
- source_word: מֵהַמּוֹרִים
  choice: வில்லாளிகளால்
  rationale: מִן இங்கு சவுலின் நிலைக்கான காரணத்தையோ செயற்பாட்டாளர்களையோ குறிக்கிறது; தமிழில் ‘வில்லாளிகளால்’ என்பது இரண்டையும் சுருக்கமாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: சவுலின் நிலை உடற்காயமா அல்லது கடும் மன/உடல் வேதனையா
  choice: முதன்மை உரையில் ‘மிகவும் வேதனைக்குள்ளானான்’ என்று பரந்த பொருளில் மொழிபெயர்த்தல்
  alternative: ‘மிகவும் கடுமையாகக் காயமடைந்தான்’ அல்லது ‘மிகவும் கலக்கமடைந்தான்’
  rationale: எபிரெய வினை இவ்விடத்தில் பொருள் தெளிவற்றது. அடுத்த வசனத்தின் சூழலும் 1 நாளாகமம் 10:3-இன் இணை உரையும் உடற்காயத்தை ஆதரிக்கலாம்; இருப்பினும், இவ்வசனத்தின் சொல் அதையே மட்டும் கட்டாயப்படுத்தவில்லை. எனவே இறையியல் அல்லது கதைவிளக்கத் தீர்வை உரைக்குள் திணிக்காமல் ambiguity காக்கப்பட்டது.
translation_notes:
  register: நவீன பொதுத்தமிழில், எளிமையானதாயினும் கண்ணியமான வரலாற்றுக் கதைநடை பயன்படுத்தப்பட்டது. குறுகிய எபிரெய தொடர்கள் தமிழில் தெளிவாகப் பிரிக்கப்பட்டன; அரிய வினையின் உண்மையான பொருள் ஐயம் முதன்மை உரையிலும் அடிக்குறிப்பிலும் பாதுகாக்கப்பட்டது.
