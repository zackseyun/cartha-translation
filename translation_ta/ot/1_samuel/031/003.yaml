  source_fidelity: 'மூலத்தின் மூன்று முக்கிய கூறுகளும் துல்லியமாகக் காக்கப்பட்டுள்ளன: சவுலுக்கு எதிராகப் போர் கடுமையானது; வில்லாளிகள் அவனைக் கண்டடைந்தனர்; அதன்பின் வில்லாளிகளால் அவன் மிகுந்த வேதனை அல்லது துயர நிலைக்குள்ளானான். וַיָּחֶל என்ற அரிய, பொருளில் முழுமையாக உறுதியில்லாத வினைச்சொல்லை ‘வேதனைக்குள்ளானான்’ என மொழிபெயர்ப்பது உடற்காயத்தை மட்டும் கட்டாயப்படுத்தாமல் மூலத்தின் தெளிவின்மையை முறையாகப் பாதுகாக்கிறது.'
  naturalness: நவீன பொதுத்தமிழில் நடை தெளிவாகவும் கண்ணியமான வரலாற்றுக் கதைநடைக்கு ஏற்றவாறும் உள்ளது. ‘போர் சவுலுக்கு எதிராகக் கடுமையடைந்தது,’ ‘வில்லாளிகள் அவனைக் கண்டார்கள்’ ஆகியவை இயல்பாகப் புரியக்கூடியவை. குறுகிய வாக்கியப் பிரிப்பு எபிரெயக் கதைநடை ஓட்டத்திற்கும் தமிழ்வாசிப்பிற்கும் பொருந்துகிறது.
