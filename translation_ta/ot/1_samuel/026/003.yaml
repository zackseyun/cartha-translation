translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியக்கூடியதாயும் கண்ணியமானதாயும் அமைக்கப்பட்டுள்ளது. எபிரெய இடப்பெயர்கள் தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளன; வாக்கிய அமைப்பு இயல்பிற்காகப் பிரிக்கப்பட்டுள்ளது.
