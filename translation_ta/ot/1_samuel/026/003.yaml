base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/003.yaml
  text: And Saul camped on the hill of Hachilah[a], which is opposite Jeshimon, by the road. But David was staying in the wilderness, and he saw that Saul had come after him into the wilderness.
translation:
  language: ta
  text: சவுல், வழியருகே யெஷிமோனுக்கு எதிரே இருந்த அகிலா குன்றில்[a] முகாமிட்டார். தாவீதோ வனாந்தரத்தில் தங்கியிருந்தார். சவுல் தன்னைப் பின்தொடர்ந்து வனாந்தரத்திற்குள் வந்திருப்பதை அவர் கண்டார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “யெஷிமோன்” என்பதை இடப்பெயராக அல்லாமல், “பாழ்நிலம்” அல்லது “வனாந்தரம்” என்றும் புரிந்துகொள்ளலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּחַן
  choice: முகாமிட்டார்
  rationale: חנה என்பது பயணம் அல்லது படைச் சூழலில் முகாம் அமைத்துத் தங்குவதைக் குறிக்கிறது; ‘முகாமிட்டார்’ என்பது இயல்பான நவீனத் தமிழ்.
- source_word: בְּגִבְעַת הַחֲכִילָה
  choice: அகிலா குன்றில்
  rationale: גִּבְעָה என்பதைக் ‘குன்று’ என்று மொழிபெயர்த்து, חֲכִילָה என்ற இடப்பெயரை ‘அகிலா’ என ஒலிபெயர்ப்பது நிலவியல் குறிப்பைப் பாதுகாக்கிறது.
- source_word: אֲשֶׁר עַל פְּנֵי הַיְשִׁימֹן
  choice: யெஷிமோனுக்கு எதிரே இருந்த
  rationale: עַל־פְּנֵי இங்கு ‘எதிரே’ அல்லது ‘எதிர்நோக்கி’ என்ற இடவியல் உறவைக் குறிக்கிறது. הַיְשִׁימֹן இடப்பெயராக இருக்கக்கூடும் என்பதால் முதன்மை உரையில் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: עַל הַדָּרֶךְ
  choice: வழியருகே
  rationale: இடவியல் சூழலில் עַל என்பது சாலையின் மேல் என்றல்லாமல் அதன் அருகாமையைக் குறிக்கலாம்; ‘வழியருகே’ இதை இயல்பாகத் தெரிவிக்கிறது.
- source_word: יֹשֵׁב
  choice: தங்கியிருந்தார்
  rationale: ישב என்பதன் தொடர்நிலைப் பொருள் இங்கு இருப்பிடத்தில் தங்கியிருத்தலைக் குறிக்கிறது; ‘தங்கியிருந்தார்’ பங்கேற்புச் சொல்லின் நீடித்த நிலையையும் தருகிறது.
- source_word: בַּמִּדְבָּר
  choice: வனாந்தரத்தில்
  rationale: מִדְבָּר என்பது மணற்பாலை மட்டும் அல்லாமல் குடியிருப்பற்ற வனாந்தரப் பகுதியையும் குறிக்கும்; ‘வனாந்தரம்’ இச்சூழலுக்கு ஏற்றது.
- source_word: וַיַּרְא כִּי בָא שָׁאוּל אַחֲרָיו
  choice: சவுல் தன்னைத் தேடி ... வந்திருப்பதை அவர் கண்டார்
  rationale: בוא என்ற வருகை/இயக்கப் பொருளையும் אַחֲרָיו என்பதிலுள்ள ஒருவரைப் பின்தொடர்ந்து தேடும் சூழலையும் இது தெளிவாகத் தருகிறது; ‘துரத்தி’ என்று கடுமையாகக் குறிப்பாக்கவில்லை.
- source_word: הַמִּדְבָּרָה
  choice: வனாந்தரத்திற்குள்
  rationale: இறுதியில் உள்ள directional he வனாந்தரத்தை நோக்கிய அல்லது அதற்குள் சென்ற இயக்கத்தைக் காட்டுகிறது; ‘வனாந்தரத்திற்குள்’ அந்தத் திசைநுணுக்கத்தை வெளிப்படுத்துகிறது.
