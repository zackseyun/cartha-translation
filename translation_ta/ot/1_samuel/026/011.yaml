base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/011.yaml
  text: Far be it from me[a], by Yahweh, to stretch out my hand against Yahweh’s anointed. But now, please take the spear that is at his head, and the jar of water[c][b], and let us go.
translation:
  language: ta
  text: யாவே ஆணையாக[a], யாவே அபிஷேகம் செய்தவருக்கு[b] எதிராக என் கையை நீட்டுவது எனக்கு அறவே கூடாது. இப்போது, அவருடைய தலைமாட்டில் இருக்கும் ஈட்டியையும் தண்ணீர்க் குடுவையையும் எடுத்துக்கொள்; நாம் போகலாம்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயில், “யாவேயிடமிருந்து இது எனக்கு வெகுதூரமாக இருப்பதாக.” இது கடும் மறுப்பைக் குறிக்கும் மரபுத்தொடர். “யாவே ஆணையாக” என்பது இச்சூழலில் இருக்கக்கூடிய ஆணைத் தொனியை வெளிப்படுத்துகிறது; “யாவேயின் முன்னிலையில்” அல்லது “யாவேயின் பார்வையில்” என்றும் புரிந்துகொள்ளப்படலாம்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயில், “யாவேயின் அபிஷேகம் பெற்றவர்.” இச்சொல் “மேசியா” என்ற சொல்லோடு தொடர்புடையது; ஆனால் இங்கு யாவே அரசராக அபிஷேகம் செய்த சவுலைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: חָלִילָה לִּי
  choice: எனக்கு ஆகவே ஆகாது
  rationale: இந்த எபிரெயச் சொற்றொடர் கடும் மறுப்பையும் அருவருப்பையும் தெரிவிக்கிறது. நவீன தமிழில் இயல்பாகவும் வலிமையாகவும் அந்த உணர்வை வெளிப்படுத்தும் வகையில் மொழிபெயர்க்கப்பட்டது.
- source_word: מֵיְהוָה
  choice: யாவே சாட்சியாக
  rationale: מִן முன்னொட்டின் நேரடிப் பொருள் ‘யாவேயிடமிருந்து’ என்றாலும், இச்சொற்றொடரில் யாவேயை முன்வைக்கும் ஆணை போன்ற வலிமை இருக்கலாம். பிரதான உரை அந்த வலிமையை இயல்பான தமிழில் தருகிறது; வேறு சாத்தியம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: מִשְּׁלֹחַ יָדִי
  choice: நான் கைநீட்டுவது
  rationale: ஒருவரைத் தாக்குவதற்காகச் செயல்படுவதைக் குறிக்கும் எபிரெய மரபுத்தொடரின் உருவகத்தைத் தமிழிலும் தக்கவைக்கிறது.
- source_word: בִּמְשִׁיחַ יְהוָה
  choice: யாவே அபிஷேகம் செய்தவருக்கு எதிராக
  rationale: இங்கு מָשִׁיחַ என்பது சவுலை, யாவேயால் அபிஷேகம் செய்யப்பட்ட அரசராகக் குறிக்கிறது; பிற்காலத் தனிப்பெயரான ‘மேசியா’ என்று மிகைப்படுத்தாமல் மூலச் சொல்லின் தொடர்பைப் பாதுகாக்கிறது.
- source_word: קַח נָא
  choice: எடுத்துக்கொள்
  rationale: நָא கட்டளையை மென்மைப்படுத்துகிறது. சூழலில் தாவீது அபிசாயிடம் நேரடியாகக் கூறுவதால் ஒருமை வினை வடிவம் பயன்படுத்தப்பட்டது.
- source_word: אֲשֶׁר מראשתו
  choice: அவருடைய தலைமாட்டில் இருக்கும்
  rationale: தூங்கிக்கொண்டிருக்கும் சவுலின் தலை அருகே வைக்கப்பட்டிருந்த ஈட்டியின் இருப்பிடத்தை இயல்பான தமிழில் தெளிவாகக் குறிக்கிறது.
- source_word: צַפַּחַת הַמַּיִם
  choice: தண்ணீர்க் குடுவை
  rationale: தண்ணீரை வைத்திருக்கும் சிறிய பாத்திரத்தைக் குறிக்கும் பொதுவான, நவீன தமிழ்ச் சொற்றொடர்.
- source_word: וְנֵלֲכָה לָּנוּ
  choice: நாம் போகலாம்
  rationale: முதலாம் நபர் பன்மை cohortative வடிவத்தின் முன்மொழிவு அல்லது புறப்படுவதற்கான அழைப்பை இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூல உரையிலுள்ள தனிப்பட்ட இறைப் பெயரைப் பெயராகவே வெளிப்படுத்துகிறது; பட்டப்பெயராக மாற்றுவதில்லை.
- issue: மன்னருக்கான מָשִׁיחַ என்ற சொல்லின் பொருள்
  choice: அபிஷேகம் செய்தவர்
  alternative: அபிஷேகம் பெற்றவர்; மேசியா
  rationale: இந்த வரலாற்றுச் சூழலில் சொல் சவுல் அரசரைக் குறிக்கிறது. ‘மேசியா’ என மொழிபெயர்ப்பது இவ்விடத்தில் இல்லாத பிற்காலத் தனிப்பெயர் சார்ந்த பொருளை முன்வைக்கக்கூடும்.
- issue: מֵיְהוָה என்பதன் தொடர்பு
  choice: யாவே சாட்சியாக என்ற ஆணை போன்ற வாசிப்பு
  alternative: யாவேயிடமிருந்து/யாவேயின் பார்வையில் இது எனக்கு வெகுதூரமாக இருப்பதாக
  rationale: எபிரெயச் சொற்றொடர் யாவேயை நோக்கிய கடும் மறுப்பாகவும் ஆணை போன்ற வேண்டுகோளாகவும் புரிந்துகொள்ளப்படலாம். பிரதான உரை அதன் நடைமுறை வலிமையைத் தருகிறது; இலக்கண மாற்றுவாசிப்பு அடிக்குறிப்பில் விடப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டது. ‘ஆகவே ஆகாது’ கடும் மறுப்பை வலியுறுத்துகிறது; ‘கைநீட்டுவது’ மூல உருவகத்தைப் பாதுகாக்கிறது. ‘தலைமாட்டில்’ சூழலுக்கேற்ற இயல்பான இடவுரையாகும்.
