  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יֹּ֕אמֶר לָ֥/מָּה זֶּ֛ה אֲדֹנִ֥/י רֹדֵ֖ף אַחֲרֵ֣י עַבְדּ֑/וֹ כִּ֚י מֶ֣ה עָשִׂ֔יתִי וּ/מַה בְּ/יָדִ֖/י רָעָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/018.yaml
  text: And he said[a], “Why is my lord pursuing his servant like this? For what have I done[b], and what evil is in my hand?”
translation:
  language: ta
  text: 'அவன் சொன்னான்: “என் ஆண்டவர் ஏன் தமது அடியவனை இப்படி விரட்டித் தொடருகிறார்? நான் என்ன செய்தேன்? என் கையில் என்ன தீமை இருக்கிறது?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: அவன் சொன்னான்
  rationale: எபிரெயக் கதையோட்டத்தின் வழக்கமான வினை வடிவத்தை இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: לָמָּה זֶּה
  choice: ஏன் ... இப்படி
  rationale: ‘ஏன் இவ்வாறு?’ என்ற வலியுறுத்தலை இயல்பான தமிழில் காக்கிறது.
- source_word: אֲדֹנִי
  choice: என் ஆண்டவர்
  rationale: இங்கு சவுலை மரியாதையுடன் அழைக்கும் மனித மேலதிகாரிப் பட்டம்; இறைவனைக் குறிக்கும் பட்டமாக அல்ல.
- source_word: רֹדֵף אַחֲרֵי
  choice: விரட்டித் தொடருகிறார்
  rationale: பகைமையுடன் பின்தொடர்வதைத் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: עַבְדּוֹ
  choice: தமது அடியவனை
  rationale: மசோரெட்டிக் உரையிலுள்ள மூன்றாம் நபர் உடைமை வடிவமான ‘அவருடைய அடியவன்’ என்பதைக் காக்கிறது; நேரடி மரியாதை உரையில் ‘தமது’ இயல்பாக அமைகிறது.
- source_word: כִּי מֶה עָשִׂיתִי
  choice: நான் என்ன செய்தேன்?
  rationale: כִּי இங்கு விளக்கமளிக்கும் சொல்லாடல் பங்காற்றினாலும், தொடர்ச்சியான இரண்டு வினாக்களில் தமிழில் தனிச் சேர்ப்புச்சொல் இல்லாமல் இருப்பது இயல்பானது.
- source_word: וּמַה בְּיָדִי רָעָה
  choice: என் கையில் என்ன தீமை இருக்கிறது?
  rationale: குற்றம், தீங்கு செய்யும் நோக்கம் அல்லது ஆற்றலைக் குறிக்கக்கூடிய எபிரெய உருவகத்தை அப்படியே காக்கிறது.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழ்; சவுலை நோக்கிய தாவீதின் மரியாதையான அரசவைக் குரல் காக்கப்பட்டுள்ளது. மூலத்தின் ‘அவருடைய அடியவன்’ என்ற மூன்றாம் நபர் தாழ்மையான சுயகுறிப்பு ‘தமது அடியவனை’ என இயல்பாக்கப்பட்டுள்ளது; ‘என் கையில்’ என்ற எபிரெய உருவகம் விளக்கமாக மாற்றப்படாமல் பாதுகாக்கப்பட்டுள்ளது.
