base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/024.yaml
  text: And look[a], just as your life was precious in my eyes this day, so may my life be precious in the eyes of Yahweh, and may he deliver me from all distress.
translation:
  language: ta
  text: இதோ, இன்று உங்கள் உயிர் என் பார்வையில் எவ்வாறு அருமையானதாக இருந்ததோ, அவ்வாறே என் உயிரும் யாவேவின் பார்வையில் அருமையானதாக இருக்கட்டும்[a]; அவர் எல்லாத் துன்பங்களிலிருந்தும் என்னை விடுவிக்கட்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இன்று உங்கள் உயிர் என் பார்வையில் எவ்வாறு பெரியதாக இருந்ததோ, அவ்வாறே என் உயிரும் யாவேவின் பார்வையில் பெரியதாக இருக்கட்டும்.” ‘பெரியது’ என்ற எபிரெய மரபுத்தொடர் உயர்ந்த மதிப்பையோ அருமையையோ தெரிவிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: இதோ
  rationale: தொடர்ந்து சொல்லப்படுவதற்கு வலியுறுத்திக் கவனத்தை ஈர்க்கும் எபிரெய உரையாடல் செயல்பாட்டை, இயல்பானதும் கண்ணியமானதுமான தமிழில் வெளிப்படுத்துகிறது.
- source_word: כַּאֲשֶׁר ... כֵּן
  choice: எவ்வாறு ... அவ்வாறே
  rationale: முதல் கூற்றுக்கும் அதைத் தொடர்ந்து வரும் விருப்பம் அல்லது வேண்டுதலுக்கும் இடையிலான ஒப்புமையைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: גָּדְלָה נַפְשְׁךָ בְּעֵינַי
  choice: உங்கள் உயிர் என் பார்வையில் ... அருமையானதாக இருந்ததோ
  rationale: சொல்லுக்கு நெருக்கமாக ‘பெரிதாயிருந்தது’ என்றாலும், இந்தச் சூழலில் உயிரை உயர்வாக மதித்தல் அல்லது அருமையாகக் கருதுதல் என்பதே எபிரெய மரபுத்தொடரின் பொருள்.
- source_word: נֶפֶשׁ
  choice: உயிர்
  rationale: சவுலின் உயிரைத் தாவீது காப்பாற்றிய சூழலிலும் ஆபத்திலிருந்து தன் உயிர் விடுவிக்கப்பட வேண்டும் என்ற வேண்டுதலிலும், இது உடலிலிருந்து பிரிந்த ‘ஆத்துமா’ என்பதைவிட ஒருவருடைய உயிரையே குறிக்கிறது.
- source_word: הַיּוֹם הַזֶּה
  choice: இன்று
  rationale: கால வலியுறுத்தலை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: תִּגְדַּל נַפְשִׁי בְּעֵינֵי יְהוָה
  choice: என் உயிரும் யாவேவின் பார்வையில் அருமையானதாக இருக்கட்டும்
  rationale: இங்கு imperfect வடிவம் விருப்பம் அல்லது வேண்டுதலை வெளிப்படுத்துகிறது; முதல் பாதியின் ஒப்புமையையும் ‘உயர்வாக மதிக்கப்படுதல்’ என்ற மரபுத்தொடரின் பொருளையும் காக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய மூலத்தில் நேரடியாக இடம்பெறும் தேவனுடைய தனிப்பெயரைப் பெயராகவே ஒலிபெயர்க்கிறது.
- source_word: וְיַצִּלֵנִי
  choice: அவர் ... என்னை விடுவிக்கட்டும்
  rationale: נצל என்பதன் Hiphil வடிவம் ‘மீட்டல், விடுவித்தல்’ என்னும் பொருளைத் தருகிறது; இணையான விருப்ப அல்லது வேண்டுதல் நடையையும் தமிழில் காக்கிறது.
- source_word: מִכָּל צָרָה
  choice: எல்லாத் துன்பங்களிலிருந்தும்
  rationale: צָרָה குறிக்கும் இடுக்கண், நெருக்கடி, துயரம் ஆகிய பரந்த பொருள் வரம்பைச் சூழலுக்கு ஏற்ற இயல்பான தமிழில் தெரிவிக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூல உரையில் பொதுப் பட்டப்பெயர் அல்லாமல் நான்கெழுத்து இறைப்பெயர் நேரடியாக உள்ளது; ஆகவே அதை மறைக்காமல் தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளது.
- issue: תִּגְדַּל மற்றும் וְיַצִּלֵנִי ஆகிய வினைகளின் வேண்டுதல் தன்மை
  choice: இரண்டையும் ‘இருக்கட்டும் / விடுவிக்கட்டும்’ என்ற விருப்ப-வேண்டுதல் நடையில் வழங்குதல்
  alternative: உறுதியான எதிர்காலமாக ‘இருக்கும் / விடுவிப்பார்’ என்று வழங்குதல்
  rationale: சூழலில் தாவீது சவுலின் உயிரை மதித்ததற்கு ஒப்பாகத் தன் உயிரையும் யாவே மதித்து விடுவிக்க வேண்டும் என விரும்புகிறான். எபிரெய imperfect வடிவங்கள் உறுதியான எதிர்காலத்தையும் அனுமதிக்கக்கூடியவை என்றாலும், இங்கு வேண்டுதல் வாசிப்பு ஒப்புமைக்கும் உரையாடல் சூழலுக்கும் சிறப்பாகப் பொருந்துகிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; கண்ணியமான வேதாகம நடை, ஆனால் வழக்கொழிந்த சொற்களைத் தவிர்க்கிறது. சவுலை நோக்கிய உரை என்பதால் மரியாதைப் பன்மையான ‘உங்கள்’ பயன்படுத்தப்பட்டுள்ளது. ஒப்புமையின் இணை அமைப்பு இயன்றவரை தெளிவாகப் பாதுகாக்கப்பட்டுள்ளது.
