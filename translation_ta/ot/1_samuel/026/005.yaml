base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/005.yaml
  text: Then David arose and came to the place where Saul had camped[a], and David saw the place where Saul lay, and Abner son of Ner, the commander of his army. Saul was lying within the encampment, and the people were camped around him.
translation:
  language: ta
  text: பின்பு தாவீது எழுந்து, சவுல் முகாமிட்டிருந்த இடத்திற்குச் சென்றான். சவுல் படுத்திருந்த இடத்தையும், அவனுடைய படைத்தலைவனான நேரின் மகன் அப்னேரையும் தாவீது பார்த்தான். சவுல் முகாமின் வட்டத்திற்குள்[a] படுத்திருந்தான்; மக்கள் அவனைச் சுற்றி முகாமிட்டிருந்தனர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “வட்டத்திற்குள்.” இது முகாமின் மையப்பகுதியையோ, வட்ட வடிவில் அமைந்திருந்த முகாமின் உட்பகுதியையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם דָּוִד
  choice: பின்பு தாவீது எழுந்து
  rationale: קום என்ற வினை கதைத் தொடரில் அடுத்த செயலை அறிமுகப்படுத்துகிறது. ‘எழுந்து’ என்பது அதன் அடிப்படைப் பொருளையும் இயல்பான தமிழ் கதையோட்டத்தையும் காக்கிறது.
- source_word: וַיָּבֹא אֶל־הַמָּקוֹם אֲשֶׁר חָנָה שָׁם שָׁאוּל
  choice: சவுல் முகாமிட்டிருந்த இடத்திற்குச் சென்றான்
  rationale: בוא אֶל என்பது ஓர் இடத்தை நோக்கிய நகர்வைக் குறிக்கிறது; தமிழ் பார்வைக்கேற்ப ‘சென்றான்’ இயல்பானது. חנה என்பதற்கு ‘முகாமிட்டிருந்த’ என்பது முன்பே நிலவிய சூழலைத் தெளிவாகச் சொல்கிறது.
- source_word: וַיַּרְא דָּוִד אֶת־הַמָּקוֹם
  choice: இடத்தைத் தாவீது பார்த்தான்
  rationale: ראה என்பதன் நேரடியான காட்சிப் பொருளை ‘பார்த்தான்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: אֲשֶׁר שָׁכַב שָׁם שָׁאוּל וְאַבְנֵר בֶּן־נֵר שַׂר צְבָאוֹ
  choice: சவுலும் அவனுடைய படைத்தலைவனான நேரின் மகன் அப்னேரும் படுத்திருந்த இடத்தை
  rationale: சவுலையும் அப்னேரையும் இணைக்கும் וְ-ஐ வெளிப்படையாகக் காத்து, இருவரும் அந்த இடத்தில் படுத்திருந்ததாக இயல்பான தமிழில் தருகிறது. שַׂר צְבָאוֹ என்பதற்கு இன்றைய வாசகருக்கு தெளிவான ‘அவனுடைய படைத்தலைவன்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: וְשָׁאוּל שֹׁכֵב
  choice: சவுல் ... படுத்திருந்தான்
  rationale: שכב-இன் பங்கேற்பு வடிவம் அப்போது தொடர்ந்திருந்த உடல் நிலையைச் சுட்டுகிறது; ‘படுத்திருந்தான்’ அதைத் துல்லியமாக வெளிப்படுத்துகிறது.
- source_word: בַּמַּעְגָּל
  choice: முகாமின் வட்டத்திற்குள்
  rationale: מַעְגָּל என்பதன் ‘வட்டம்/வட்ட வடிவ அமைப்பு’ என்ற உருவகத்தை மறைக்காமல், சூழலுக்கேற்ற ‘முகாமின் வட்டம்’ என்று தரப்பட்டுள்ளது; அதன் சரியான கட்டமைப்பு தெளிவில்லாததால் அடிக்குறிப்பு சேர்க்கப்பட்டுள்ளது.
- source_word: וְהָעָם חֹנִים סְבִיבֹתָיו
  choice: மக்கள் அவனைச் சுற்றிலும் முகாமிட்டிருந்தார்கள்
  rationale: பங்கேற்பு வடிவமும் סביבתיו-வின் சுற்றியுள்ள இடவமைப்பும் இயல்பான தமிழில் முழுமையாகக் காக்கப்படுகின்றன.
