base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/001.yaml
  text: Then the Ziphites came to Saul at Gibeah[a], saying, “Is not David hiding on the hill of Hachilah, which is before the wasteland?”
translation:
  language: ta
  text: அப்போது சீப்பியர் கிபியாவில் இருந்த சவுலிடம் வந்து, “தாவீது பாழ்நிலத்திற்கு[a] எதிரே உள்ள ஹகீலா குன்றில் ஒளிந்திருக்கிறான் அல்லவா?” என்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யெசிமோனுக்கு எதிரே.” எபிரேயச் சொற்றொடரில் உள்ள הַיְשִׁימֹן என்பதை “பாழ்நிலம்” என்ற பொதுப்பெயராகவோ, “யெசிமோன்” என்ற வட்டாரப் பெயராகவோ புரிந்துகொள்ளலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: அப்போது ... வந்து
  rationale: வழக்கின் தொடர்ச்சியை முன்னெடுக்கும் wayyiqtol வடிவத்தை இயல்பான தமிழ் கதைநடையில் காட்டுகிறது; அடிப்படை இயக்கப் பொருளையும் காக்கிறது.
- source_word: הַזִּפִים
  choice: சீபியர்
  rationale: சீப் ஊரைச் சேர்ந்த மக்களைக் குறிக்கும் பன்மை இன/இடப்பெயர்ச்சொல்லைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: הַגִּבְעָתָה
  choice: கிபியாவில் இருந்த சவுலிடம்
  rationale: இடப்பெயருடன் சேர்ந்த திசைச்சுட்டு இறுதி கிபியாவை நோக்கிய இயக்கத்தைக் காட்டுகிறது; தமிழில் சவுல் அங்கே இருந்தார் என்பதை இவ்வமைப்பு தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: לֵאמֹר
  choice: என்றார்கள்
  rationale: நேர்கூற்றை அறிமுகப்படுத்தும் எபிரெய அமைப்பை இயல்பான தமிழ் உரையாடல் முடிவாக மாற்றுகிறது.
- source_word: הֲלוֹא
  choice: அல்லவா?
  rationale: உறுதிப்படுத்தும் பதிலை எதிர்பார்க்கும் வினாவின் வலிமையை இயல்பான தமிழில் காக்கிறது.
- source_word: מִסְתַּתֵּר
  choice: ஒளிந்திருக்கிறான்
  rationale: தன்னை மறைத்துக்கொண்டு தொடர்ந்து இருக்கும் நிலையைக் காட்டும் hitpael நிகழ்காலப் பங்கேற்புவினையின் பொருளைத் தெளிவாகத் தருகிறது.
- source_word: בְּגִבְעַת הַחֲכִילָה
  choice: அகிலா குன்றில்
  rationale: גִּבְעָה என்பதன் நிலவியல் பொருளான ‘குன்று’ என்பதையும், சூழலில் בְּ தரும் இடப்பொருளையும் காக்கிறது.
- source_word: עַל פְּנֵי הַיְשִׁימֹן
  choice: பாழ்நிலத்திற்கு எதிரே
  rationale: עַל־פְּנֵי என்பதன் இடம்சார் ‘முன்புறத்தில்/எதிரே’ என்ற பொருளைத் திசையை ஊகிக்காமல் காக்கிறது; הַיְשִׁימֹן என்பதன் பொதுப்பெயர் பொருளை ‘பாழ்நிலம்’ எனத் தருகிறது, இடப்பெயர் வாய்ப்பை அடிக்குறிப்பு பாதுகாக்கிறது.
