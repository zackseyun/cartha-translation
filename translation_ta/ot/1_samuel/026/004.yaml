  text: So David sent out scouts[a], and he learned that Saul had indeed come.
translation:
  language: ta
  text: அப்போது தாவீது வேவுபார்ப்பவர்களை அனுப்பி, சவுல் உண்மையாகவே வந்திருந்ததை அறிந்துகொண்டான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சவுல் வந்திருந்ததை அவன் உறுதியாக அறிந்துகொண்டான்.” எபிரெய உரையின் இறுதிச் சொல் உறுதி அல்லது உறுதிப்படுத்துதல் என்ற நுணுக்கத்தைச் சேர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: அனுப்பி
  rationale: שׁלח என்பதன் அடிப்படைப் பொருள் ‘அனுப்பு.’ தொடர்ச்சியான எபிரெய கதைநடையைத் தமிழில் இயல்பாக இணைக்க வினையெச்சம் பயன்படுத்தப்பட்டது.
- source_word: מְרַגְּלִים
  choice: வேவுபார்ப்பவர்கள்
  rationale: இந்தச் சூழலில் இச்சொல் எதிரியின் இருப்பிடத்தையும் நகர்வையும் அறிய அனுப்பப்படும் இராணுவ வேவுபார்ப்பவர்களைக் குறிக்கிறது; ‘உளவாளிகள்’ என்பதிலுள்ள அரசியல் அல்லது துரோகச் சாயலை இது தவிர்க்கிறது.
- source_word: וַיֵּדַע
  choice: அறிந்துகொண்டான்
  rationale: ידע பொதுவாக ‘அறி’ என்று பொருள்படும்; வேவுபார்ப்பவர்களை அனுப்பியபின் கிடைத்த தகவலால் தாவீது ஒரு செய்தியைத் தெரிந்துகொண்டதை இங்கு குறிக்கிறது.
- source_word: כִּי
  choice: …என்பதை
  rationale: தாவீது அறிந்துகொண்ட செய்தியின் உள்ளடக்கத்தை அறிமுகப்படுத்தும் இணைப்பாக כִּי செயல்படுகிறது; தமிழில் ‘…என்பதை’ என்ற அமைப்பு இயல்பானது.
- source_word: בָא
  choice: வந்திருந்ததை
  rationale: தாவீது அறிந்துகொண்ட நேரத்துக்கு முன்பே சவுலின் வருகை நிறைவடைந்திருந்ததைக் காட்டத் தமிழ் இறந்தகால நிறைவுநிலை பயன்படுத்தப்பட்டது.
- source_word: אֶל נָכוֹן
  choice: உண்மையாகவே
  rationale: சிக்கலான இத்தொடர் இங்கு சவுலின் வருகை உறுதிப்படுத்தப்பட்ட உண்மை என்பதை வலியுறுத்துவதாக எடுத்துக்கொள்ளப்பட்டது. அந்த உறுதியின் நுணுக்கம் வினையுடன் சேர்கிறதா அல்லது தாவீதின் அறிதலுடன் சேர்கிறதா என்ற ambiguity அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: דָּוִד
  choice: தாவீது
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் நிலைபெற்ற பெயர்வடிவம்.
- source_word: שָׁאוּל
  choice: சவுல்
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் நிலைபெற்ற பெயர்வடிவம்.
