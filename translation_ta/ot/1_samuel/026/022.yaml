base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/022.yaml
  text: David answered and said[a], “Here is the king’s spear[b]. Let one of the young men come over and take it.”
translation:
  language: ta
  text: 'தாவீது பதிலளித்துச் சொன்னான்: “இதோ, அரசனுடைய ஈட்டி! இளைஞர்களில்[a] ஒருவன் கடந்து வந்து[b] அதை எடுத்துக்கொள்ளட்டும்.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “இளைஞர்கள்” என்பதைச் சூழலுக்கேற்ப “பணியாளர்கள்” அல்லது “உதவியாளர்கள்” என்றும் மொழிபெயர்க்கலாம்; எபிரேயச் சொல் வயதையோ கீழ்நிலைப் பணியையோ குறிக்கக்கூடும்.
    reason: lexical_alternative
  - marker: b
    text: எபிரேய வினைச்சொல்லின் நேரடிப் பொருள் “கடந்து செல்/கடந்து வா” என்பதாகும்; இங்கு “இங்கே வரட்டும்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן וַיֹּאמֶר
  choice: பதிலளித்துச் சொன்னான்
  rationale: எபிரெய உரையில் உள்ள ‘பதிலளித்தான்’ மற்றும் ‘சொன்னான்’ என்ற இரு வினைகளையும் இயல்பான நவீனத் தமிழில் தக்கவைக்கிறது.
- source_word: הִנֵּה
  choice: இதோ
  rationale: ஈட்டி அங்கே இருப்பதைச் சுட்டிக்காட்டி கவனத்தை ஈர்க்கும் எபிரெய இடைச்சொல்லின் ஆற்றலைச் சுருக்கமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: הַחֲנִית הַמֶּלֶךְ
  choice: அரசனுடைய ஈட்டி
  rationale: ‘அரசனின் ஈட்டி’ என்ற உடைமைத் தொடர்பைத் தெளிவாகவும் இயல்பாகவும் தருகிறது; חֲנִית என்பதற்கு பொதுவாகப் புரியும் ‘ஈட்டி’ பொருத்தமானது.
- source_word: אֶחָד מֵהַנְּעָרִים
  choice: இளைஞர்களில் ஒருவன்
  rationale: אֶחָד என்பதன் ‘ஒருவன்’ என்ற எண்ணுப் பொருளையும் נְעָרִים என்பதன் முதன்மையான வயது சார்ந்த பொருளையும் தக்கவைக்கிறது; சூழலில் ‘பணியாளர்கள்’ அல்லது ‘உதவியாளர்கள்’ என்றும் புரிந்துகொள்ள வாய்ப்புள்ளது.
- source_word: וְיַעֲבֹר
  choice: இங்கே கடந்து வந்து
  rationale: עבר என்பதன் ‘கடந்து செல்/கடந்து வா’ என்ற அடிப்படைப் பொருளையும், தாவீது இருக்கும் பக்கம் வரவேண்டும் என்ற சூழ்நிலை நோக்கையும் ஒன்றாக வெளிப்படுத்துகிறது.
- source_word: וְיִקָּחֶהָ
  choice: அதை எடுத்துக்கொள்ளட்டும்
  rationale: לקח என்பதன் நேரடியான ‘எடு’ என்ற பொருளைத் தருகிறது; பெண்பால் ஒருமை பின்னொட்டு ஈட்டியைக் குறிக்கிறது. இணைந்த கட்டளை/விருப்ப வினை அமைப்பை ‘-ட்டும்’ தக்கவைக்கிறது.
