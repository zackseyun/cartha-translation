source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר דָּוִד֙ חַי יְהוָ֔ה כִּ֥י אִם יְהוָ֖ה יִגָּפֶ֑/נּוּ אֽוֹ יוֹמ֤/וֹ יָבוֹא֙ וָ/מֵ֔ת א֧וֹ בַ/מִּלְחָמָ֛ה יֵרֵ֖ד וְ/נִסְפָּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/010.yaml
  text: And David said[a], “As Yahweh lives, surely Yahweh will strike him, or his day will come to die[c][b], or he will go down into battle and perish.”
translation:
  language: ta
  text: 'தாவீது சொன்னான்: “யாவே உயிரோடிருக்கிறார் என்பதுபோல், நிச்சயமாக யாவே அவனைத் தாக்குவார்; அல்லது அவனுடைய நாள் வந்து அவன் இறப்பான்; அல்லது அவன் போருக்குள் இறங்கி அழிவான்.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חַי יְהוָה
  choice: யெகோவா உயிரோடிருப்பது உறுதி!
  rationale: எபிரெய வழக்கிலுள்ள ஆணையுறுதி மொழியின் கடுமையையும் இயல்பான நவீனத் தமிழையும் காக்கிறது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: திருப்பெயரான நான்கு எழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல் தமிழில் நிலைபெற்ற ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: כִּי אִם
  choice: யெகோவாவே
  rationale: ஆணைச் சூழலில் வரும் உறுதியான வலியுறுத்தலை ‘வே’ என்ற இடைச்சொல் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: יִגָּפֶנּוּ
  choice: அவனை அடிப்பார்
  rationale: நாகஃப் வினையின் தீர்க்கமான தாக்குதலைக் காட்டி, அதன் துல்லியமான முறையைத் திறந்துவைக்கிறது.
- source_word: יוֹמוֹ יָבוֹא וָמֵת
  choice: அவனுடைய நாள் வந்து அவன் இறந்துபோவான்
  rationale: ‘அவனுடைய நாள்’ என்ற எபிரெய உருவகத்தையும் அதைத் தொடரும் மரணத்தையும் தனித்தனியாகப் பாதுகாக்கிறது.
- source_word: בַמִּלְחָמָה יֵרֵד
  choice: அவன் போருக்குச் சென்று
  rationale: இராணுவ நகர்வைக் குறிக்கும் ‘இறங்குதல்’ தமிழில் நேரடியாக இயல்பில்லாததால், சூழலுக்கேற்ற ‘போருக்குச் சென்று’ பயன்படுத்தப்படுகிறது.
- source_word: וְנִסְפָּה
  choice: அழிந்துபோவான்
  rationale: முந்தைய ‘இறத்தல்’ என்பதிலிருந்து சொல்லியல் வேறுபாட்டைக் காத்து, போரில் முற்றாக ஒழிவதன் நிழற்பொருளை வழங்குகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யெகோவா
  alternative: யாவே
  rationale: இது பட்டப்பெயரான ‘கர்த்தர்’ என்பதற்குப் பதிலாக மூலத்திலுள்ள தனிப்பெயரைத் தக்கவைக்கிறது; தமிழில் பரவலாக அறியப்பட்ட ஒலிவடிவம் தேர்ந்தெடுக்கப்பட்டுள்ளது.
- issue: சவுலின் மரணம் நிகழும் விதம்
  choice: மூன்று மாற்று வாய்ப்புகளாகவே வைத்தல்
  alternative: அனைத்தையும் ஒரே முன்நியமிக்கப்பட்ட மரணவிளக்கமாக இணைத்தல்
  rationale: மூலத்தில் யெகோவாவின் நேரடித் தாக்கு, இயல்பான மரணநாள், போரில் அழிவு ஆகியவை ‘அல்லது’ என்பதால் வேறுபடுத்தப்பட்டுள்ளன; அந்தத் திறந்த நிலை காக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழ்; கண்ணியமான ஆனால் பொதுவாசகர்களுக்கு எளிதான நடை. நேரடி உரையின் ஆணையுறுதி வலிமையும் மூன்று மாற்று முடிவுகளின் இணை அமைப்பும் பாதுகாக்கப்பட்டுள்ளன.
