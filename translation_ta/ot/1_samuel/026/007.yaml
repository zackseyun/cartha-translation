translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியக்கூடிய கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘இதோ’ என்பது மூலத்தின் காட்சிச் சுட்டலைத் தக்கவைக்கிறது; ‘முகாமின் வட்டம்’ என்ற சொற்றொடரும் அடிக்குறிப்பும் எபிரெயச் சொல்லின் இடவியல் தெளிவின்மையைப் பாதுகாக்கின்றன.
