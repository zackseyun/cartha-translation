base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/007.yaml
  text: So David and Abishai came to the troops by night[a], and behold, Saul was lying asleep within the encampment, with his spear stuck in the ground at his head, and Abner and the troops were lying around him.
translation:
  language: ta
  text: ஆகவே தாவீதும் அபிசாயும் இரவில் படையினரிடம் வந்தார்கள். இதோ, சவுல் முகாமுக்குள்[a] படுத்துத் தூங்கிக்கொண்டிருந்தார். அவரது ஈட்டி அவரது தலைமாட்டில் தரையில் ஊன்றப்பட்டிருந்தது; அப்னேரும் படையினரும் அவரைச் சுற்றிப் படுத்திருந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘வட்டத்திற்குள்.’ எபிரெயச் சொல் முகாமின் வட்ட வடிவ அணிவகுப்பைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָעָם
  choice: படையினர்
  rationale: இராணுவச் சூழலில் இது பொதுவாக மக்களைக் குறிக்காமல் சவுலின் படையினரைக் குறிக்கிறது; இரு இடங்களிலும் இயல்பாகப் பொருந்துகிறது.
- source_word: לַיְלָה
  choice: இரவில்
  rationale: நிகழ்வு நடந்த காலத்தைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: וְהִנֵּה
  choice: இதோ
  rationale: தாவீதின் கண்முன் தோன்றிய காட்சியை உயிரோட்டத்துடன் சுட்டும் எபிரெயக் கதைநடைச் சொல்லின் வலிமையைத் தக்கவைக்கிறது.
- source_word: שֹׁכֵב יָשֵׁן
  choice: படுத்துத் தூங்கிக்கொண்டிருந்தார்
  rationale: சவுலின் படுத்திருந்த நிலை, தூங்கிய நிலை ஆகிய இரண்டையும் வெளிப்படுத்துகிறது.
- source_word: בַּמַּעְגָּל
  choice: முகாமின் வட்டத்திற்குள்
  rationale: முகாமின் வட்ட வடிவ அணிவகுப்பு அல்லது அதன் பாதுகாக்கப்பட்ட உட்பகுதி என்ற சாத்தியமான பொருளைத் தெளிவாகவும், மூலத்தின் உருவகத்தை மறைக்காமலும் தருகிறது.
- source_word: חֲנִיתוֹ
  choice: அவரது ஈட்டி
  rationale: சவுலைப் பற்றிய நிகழ்வுகளில் வரும் ஆயுதத்திற்கான இயல்பான நவீனத் தமிழ்ச் சொல்.
- source_word: מְעוּכָה בָאָרֶץ
  choice: தரையில் ஊன்றப்பட்டிருந்தது
  rationale: ஈட்டி தரைக்குள் அழுத்திச் செலுத்தப்பட்டு நிலைநிறுத்தப்பட்டிருந்ததை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: מְרַאֲשֹׁתָיו
  choice: அவரது தலைமாட்டில்
  rationale: ஒருவரின் தலை இருக்கும் பக்கத்திலுள்ள இடம் என்ற எபிரெய மரபுத்தொடருக்கு இயல்பான தமிழ்ச் சமமான சொல்.
- source_word: סביבתו
  choice: அவரைச் சுற்றி
  rationale: அப்னேரும் படையினரும் சவுலைச் சூழ்ந்து படுத்திருந்த இடவமைப்பைத் துல்லியமாகத் தருகிறது.
