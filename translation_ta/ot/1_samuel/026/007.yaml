    issue: The main rendering of בַּמַּעְגָּל as ‘முகாமின் வட்டத்திற்குள்’ is overly literal and makes a debated spatial image sound definite.
    rationale: The term likely refers contextually to the encampment/circular camp formation. A main-text rendering ‘முகாமுக்குள்’ communicates the contextual sense naturally, while a footnote preserves ‘வட்டத்திற்குள்’ as the lexical alternative.
