  text: לֹא ט֞וֹב הַ/דָּבָ֣ר הַ/זֶּה֮ אֲשֶׁ֣ר עָשִׂיתָ֒ חַי יְהוָ֗ה כִּ֤י בְנֵי מָ֨וֶת֙ אַתֶּ֔ם אֲשֶׁ֧ר לֹֽא שְׁמַרְתֶּ֛ם עַל אֲדֹנֵי/כֶ֖ם עַל מְשִׁ֣יחַ יְהוָ֑ה וְ/עַתָּ֣ה רְאֵ֗ה אֵֽי חֲנִ֥ית הַ/מֶּ֛לֶךְ וְ/אֶת צַפַּ֥חַת הַ/מַּ֖יִם אֲשֶׁ֥ר מראשת/ו־־־־־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/016.yaml
  text: This thing that you have done is not good. As Yahweh lives[a], you are sons of death, because you did not keep watch over your master, over Yahweh’s anointed. And now, look—where are the king’s spear and the water jar that were by his head?
translation:
  language: ta
  text: 'நீ செய்த இந்தக் காரியம் நல்லதல்ல. யாவே உயிரோடிருக்கிறார் என்பதன்மேல் ஆணையாக, நீங்கள் மரணத்துக்குரியவர்கள்[a]. ஏனெனில், உங்கள் எஜமானரை—யாவே அபிஷேகம் செய்தவரை—நீங்கள் காவல் காக்கவில்லை. இப்போது பார்: அரசனுடைய ஈட்டியும், அவருடைய தலைமாட்டில் இருந்த தண்ணீர்க் குடுவையும் எங்கே?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மொழியில் சொல்லுக்குச் சொல், “நீங்கள் மரணத்தின் மகன்கள்.” இது மரண தண்டனைக்குரியவர்கள் அல்லது மரணத்துக்குத் தகுதியானவர்கள் என்பதைக் குறிக்கும் மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא טוֹב הַדָּבָר הַזֶּה אֲשֶׁר עָשִׂיתָ
  choice: நீ செய்த இந்தக் காரியம் நல்லதல்ல
  rationale: எபிரெய மொழியின் நேரடியான மதிப்பீட்டையும் அப்னேரை நோக்கிய ஒருமை அழைப்பையும் இயல்பான தமிழில் காக்கிறது.
- source_word: חַי יְהוָה
  choice: யாவே உயிருள்ளவராக இருப்பது உறுதி
  rationale: இது யாவேயின் உயிரை முன்னிறுத்தும் எபிரெய ஆணைச் சூத்திரம்; அதன் உறுதியான, solemn force-ஐ தமிழில் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: בְנֵי מָוֶת אַתֶּם
  choice: நீங்கள் மரணத்துக்குரியவர்கள்[a]
  rationale: சொல்லுக்குச் சொல் ‘மரணத்தின் மகன்கள்’ என்றாலும், இங்கு மரண தண்டனைக்குத் தகுதியானவர்கள் என்ற நீதித்துறை சார்ந்த இடைமொழிப் பொருள் உள்ளது. பிரதான உரை பொருளைத் தெளிவாக்கி, சொல்லடக்கத்தை அடிக்குறிப்பு காக்கிறது.
- source_word: שְׁמַרְתֶּם עַל
  choice: காவல் காக்கவில்லை
  rationale: படைவீரர்கள் தங்கள் அரசனைப் பாதுகாக்க வேண்டிய சூழலில் விழிப்புடனான பாதுகாப்புக் காவலைக் குறிக்கிறது.
- source_word: אֲדֹנֵיכֶם
  choice: உங்கள் எஜமானரை
  rationale: இது சவுலை அவருடைய ஆட்களின் மேலதிகாரியாகக் குறிக்கிறது; தெய்வீகப் பட்டத்துடன் குழப்பம் வராத வகையில் ‘எஜமானர்’ பயன்படுத்தப்படுகிறது.
- source_word: מְשִׁיחַ יְהוָה
  choice: யாவே அபிஷேகம் செய்தவரை
  rationale: சவுலின் அரச-புனித நிலையைத் தெளிவாகக் காட்டுகிறது; உடனடி சூழல் கோராத பிற்கால மேசியா சார்ந்த பொருளைச் சேர்ப்பதில்லை.
- source_word: חֲנִית הַמֶּלֶךְ
  choice: அரசனுடைய ஈட்டி
  rationale: சொந்த உறவையும் ஆயுதத்தையும் இயல்பான நவீன தமிழில் தருகிறது.
- source_word: צַפַּחַת הַמַּיִם אֲשֶׁר מְרַאֲשֹׁתָיו
  choice: அவருடைய தலைமாட்டில் இருந்த தண்ணீர்க் குடுவை
  rationale: தண்ணீர் வைக்கும் பாத்திரத்தையும் அது சவுலின் தலைப்பக்கத்தில் இருந்த இடத்தையும் இயல்பாகக் குறிக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலத்தில் வரும் நான்கு எழுத்து உடன்படிக்கைப் பெயரை ஒரு பொதுப் பட்டமாக மாற்றாமல், தமிழில் பரவலாகப் புரியக்கூடிய ஒலிபெயர்ப்பால் காக்கிறது.
- issue: מְשִׁיחַ יְהוָה என்ற அரசப் பட்டம்
  choice: யாவே அபிஷேகம் செய்தவர்
  alternative: யாவேயின் அபிஷேகம் பெற்றவர் / யாவேயின் மேசியா
  rationale: சவுல் யாவேயால் அரசனாகத் தேர்ந்தெடுக்கப்பட்டு அபிஷேகம் செய்யப்பட்ட நிலையைப் பாதுகாக்கிறது; ‘மேசியா’ என்ற பிற்காலத் தலைப்பை இச்சூழலுக்குள் தேவையின்றி இறக்குமதி செய்யாது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. எபிரெய உரையில் முதலில் அப்னேரை நோக்கி ஒருமை (‘நீ செய்த’), பின்னர் காவலர்களை உள்ளடக்கி பன்மை (‘நீங்கள்’) வருவது பாதுகாக்கப்பட்டுள்ளது. ஆதாரப் பொருட்களில் அடிக்குறிப்பு குறியீடு ஆணைச் சூத்திரத்திற்குப் பின் தவறாக அமைந்திருந்ததால், அது விளக்கும் ‘மரணத்துக்குரியவர்கள்’ என்பதற்குப் பின் சரியாக வைக்கப்பட்டுள்ளது.
