base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/008.yaml
  text: Then Abishai said to David[a], “God has delivered your enemy into your hand today. So now, please let me pin him to the earth with the spear in one blow[c][b], and I will not strike him a second time.”
translation:
  language: ta
  text: அப்போது அபிசாய் தாவீதிடம், “இன்று கடவுள் உமது பகைவனை உமது கையில் ஒப்புக்கொடுத்திருக்கிறார்.[a] ஆகவே இப்போது, ஈட்டியால் ஒரே குத்தில் அவனைத் தரையில் பதித்துவிட தயவுசெய்து என்னை அனுமதியுங்கள்;[b] அவனை இரண்டாவது முறை குத்தமாட்டேன்” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இன்று கடவுள் உமது பகைவனை உமது அதிகாரத்திற்குள் ஒப்படைத்திருக்கிறார்.”
    reason: lexical_alternative
  - marker: b
    text: 'சொல்லுக்குச் சொல்: “ஈட்டியால், தரைக்குள், ஒரே முறை”; ஒரே குத்தில் அவனைத் தரையில் பதித்துவிடுவதாக அபிசாய் கூறுகிறான்.'
    reason: lexical_alternative
lexical_decisions:
- source_word: סִגַּר
  choice: ஒப்புக்கொடுத்திருக்கிறார்
  rationale: இச்சூழலில் பகைவனை ஒருவரின் பிடியிலும் அதிகாரத்திலும் ஒப்படைத்தல் என்ற பொருள் வருகிறது; ‘அடைத்துவிட்டார்’ என்பது தமிழில் இங்கு இயல்பாகத் தெளிவளிக்காது.
- source_word: אֱלֹהִים
  choice: கடவுள்
  rationale: ஒருமை வினையும் சூழலும் இஸ்ரவேலின் கடவுளைக் குறிக்கின்றன; நவீன பொதுத்தமிழில் இயல்பான சொல்.
- source_word: אוֹיִבְךָ
  choice: உமது பகைவனை
  rationale: பெயர்ச்சொல்லிலுள்ள இரண்டாம் நபர் ஒருமை உரிமை விகுதியை மரியாதையான நேரடி உரையாடலாகப் பாதுகாக்கிறது.
- source_word: בְּיָדֶךָ
  choice: உமது கையில்
  rationale: அதிகாரத்திற்குள் ஒப்படைத்தல் என்னும் எபிரெய உருவகத்தைத் தமிழிலும் புரியக்கூடிய வகையில் தக்கவைக்கிறது.
- source_word: אַכֶּנּוּ נָא
  choice: தயவுசெய்து என்னை அனுமதியுங்கள்
  rationale: தன்னார்வத்தையும் வேண்டுகோளையும் வெளிப்படுத்தும் cohortative வடிவத்தையும் נָא துகளையும் இயல்பான தமிழில் தெரிவிக்கிறது; தாக்கும் செயல் தொடர்ந்து வரும் சொற்றொடரில் கூறப்படுகிறது.
- source_word: בַּחֲנִית
  choice: ஈட்டியால்
  rationale: சூழலில் அருகிலிருந்த குறிப்பிட்ட ஈட்டியே கருவியாக உள்ளது; தமிழில் கருவிப்பொருள் வேற்றுமை இயல்பானது.
- source_word: וּבָאָרֶץ
  choice: தரையோடு சேர்த்துவிட
  rationale: ஈட்டி உடலூடாகச் சென்று அவனைத் தரையில் பதியச் செய்யும் செயலை இயல்பாக வெளிப்படுத்துகிறது; எபிரெயத்தின் சுருக்கமான அமைப்பை அளவுக்கு மீறி விளக்கவில்லை.
- source_word: פַּעַם אַחַת
  choice: ஒரே குத்தில்
  rationale: ஒரே முயற்சியில் ஈட்டியால் தாக்குவதாக அபிசாய் கூறும் பொருளைச் சூழலுக்கேற்ற தமிழில் தருகிறது.
- source_word: וְלֹא אֶשְׁנֶה לוֹ
  choice: அவனை இரண்டாவது முறை குத்தமாட்டேன்
  rationale: ‘மீண்டும் செய்யமாட்டேன்’ என்ற எபிரெய நீக்கவாக்கியத்தில் மறைந்துள்ள ஈட்டியால் குத்தும் செயலைத் தமிழில் தெளிவாக்குகிறது.
theological_decisions:
- issue: சவுல் பாதுகாப்பற்ற நிலையில் இருப்பதில் கடவுளின் செயற்பாடு
  choice: இன்று கடவுள் உமது பகைவனை உமது கையில் ஒப்புக்கொடுத்திருக்கிறார்
  alternative: இன்று கடவுள் உமது பகைவனை உமது அதிகாரத்திற்குள் ஒப்படைத்திருக்கிறார்
  rationale: இது அபிசாய் கூறும் நிகழ்வின் இறையியல் விளக்கம் மட்டுமே. அவன் முன்வைக்கும் கொலைத் திட்டத்துக்குக் கடவுள் ஒப்புதல் அளித்தார் என்று மொழிபெயர்ப்பு கூடுதலாகக் கூறாமல், மூலத்தின் பதற்றத்தைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன செந்தமிழுக்கு நெருக்கமான, சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. தாவீதிடம் அபிசாய் பேசுவதால் ‘உமது’, ‘அனுமதியுங்கள்’ என்ற மரியாதை ஒருமை நடை தேர்ந்தெடுக்கப்பட்டது. போர்ச்சூழலைத் தெளிவாக்க ‘குத்து’ பயன்படுத்தப்பட்டாலும், மூலத்தில் உள்ள ஒரே தாக்குதல்/இரண்டாவது தாக்குதல் என்ற இணைவு பாதுகாக்கப்பட்டுள்ளது.
