base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/017.yaml
  text: Then Saul recognized David’s voice and said, “Is this your voice, my son David?” And David said, “It is my voice, my lord the king.”
translation:
  language: ta
  text: அப்போது சவுல் தாவீதின் குரலை அடையாளம் கண்டு, “என் மகன் தாவீதே, இது உன் குரலா?” என்று சொன்னான். தாவீது, “என் குரல்தான், என் ஆண்டவராகிய அரசரே” என்றான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּכֵּר
  choice: அடையாளம் கண்டு
  rationale: נכר என்ற வினை இச்சூழலில் கேட்ட குரல் தாவீதுடையது என்று உணர்ந்து அடையாளம் காண்பதைக் குறிக்கிறது.
- source_word: קוֹל
  choice: குரல்
  rationale: பேசுகிற நபரைச் சவுல் அடையாளம் காணும் உரையாடல் சூழலில், பொதுவான ‘ஒலி’ என்பதைவிட ‘குரல்’ துல்லியமானது.
- source_word: הֲקוֹלְךָ זֶה
  choice: இது உன் குரலா?
  rationale: எபிரெய கேள்வியையும் சுட்டுச் சொல்லையும் இயல்பான நவீனத் தமிழில் நேரடியாகப் பிரதிபலிக்கிறது.
- source_word: בְּנִי
  choice: என் மகன்
  rationale: ஆண்பால் குடும்ப உறவுச் சொல்லையும், பகைமையின் நடுவிலும் சவுல் பயன்படுத்தும் பாசமிக்க உறவுமுறை அழைப்பின் கதைத் தாக்கத்தையும் காக்கிறது.
- source_word: קוֹלִי
  choice: இது என் குரல்தான்
  rationale: மூலத்தில் சொற்சுருக்கமாக ‘என் குரல்’ என்று உள்ளது. தமிழில் மறைமுக இணைப்பை வெளிப்படுத்தி, ‘குரல்’ என்ற சொல்லின் மீளுரைப்பையும் வலியுறுத்தலையும் காக்கிறது.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: என் அரசனாகிய ஆண்டவரே
  rationale: אֲדֹנִי இங்கு கடவுளுக்கான பட்டமல்ல; மனித அரசருக்குரிய மரியாதை அழைப்பு. தமிழில் ‘ஆண்டவரே’ மரியாதையையும் ‘அரசனாகிய’ அரசப் பட்டத்தையும் இயல்பாக இணைக்கிறது.
- source_word: דָּוִד / שָׁאוּל
  choice: தாவீது / சவுல்
  rationale: நவீனத் தமிழ் வேதாகமப் பயன்பாட்டில் பரவலாக அறியப்படும் பெயர் வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன.
theological_decisions:
- issue: சவுலின் உரையில் வரும் உறவுமுறை அழைப்பு בְּנִי
  choice: என் மகன்
  alternative: என் பிள்ளை
  rationale: பகைமையான சூழலிலும் சவுல் தாவீதை குடும்ப உறவுச் சொல்லால் அழைப்பதில் உள்ள கதைத் tension-ஐ இந்த ஆண்பால் சார்ந்த நேரடி மொழிபெயர்ப்பு காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியக்கூடிய அதேவேளையில் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. நேரடி உரையில் ‘தாவீதே’, ‘ஆண்டவரே’ ஆகிய விளி வடிவங்கள் இயல்பான தமிழுக்காகப் பயன்படுத்தப்பட்டுள்ளன; மூலத்தின் குரல்-மீளுரை பாதுகாக்கப்பட்டுள்ளது.
