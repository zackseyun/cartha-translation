base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/021.yaml
  text: Then Saul said[a], “I have sinned. Return, my son David, for I will not harm you again, because my life was precious in your eyes this day. Look[b], I have acted foolishly and have gone badly astray.”
translation:
  language: ta
  text: அப்பொழுது சவுல், “நான் பாவம் செய்தேன். என் மகனே தாவீதே, திரும்பி வா. இனி நான் உனக்குத் தீங்கு செய்யமாட்டேன்; ஏனெனில் இன்று என் உயிர்[a] உன் பார்வையில் மதிப்புமிக்கதாக இருந்தது. இதோ, நான் மூடத்தனமாக நடந்துகொண்டேன்; மிகவும் வழிதவறிப்போனேன்[b]” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என் ஆத்துமா.” இங்கு “ஆத்துமா” எனவும் மொழிபெயர்க்கப்படும் נֶפֶשׁ என்ற சொல், சூழலில் சவுலின் உயிரை அல்லது அவரையே குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “பெரிதும் தவறுசெய்தேன்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: חָטָאתִי
  choice: நான் பாவம் செய்தேன்
  rationale: חטא என்பதன் Qal perfect முதலாம் நபர் ஒருமை வடிவம்; சவுல் தன் குற்றத்தை நேரடியாக ஒப்புக்கொள்வதைத் தெளிவாகக் காட்டுகிறது.
- source_word: שׁוּב בְּנִי דָוִד
  choice: என் மகனே தாவீதே, திரும்பி வா
  rationale: கட்டளை வடிவத்தையும் நேரடி அழைப்பையும் இயல்பான தமிழில் காக்கிறது; எங்கு திரும்ப வேண்டும் என்பதை மூலவசனம் குறிப்பிடாததால் அதைச் சேர்க்கவில்லை.
- source_word: לֹא אָרַע לְךָ עוֹד
  choice: இனி நான் உனக்குத் தீங்கு செய்யமாட்டேன்
  rationale: רעע என்பதன் Hiphil வடிவம் இச்சூழலில் ஒருவருக்குத் தீங்கு செய்வதைக் குறிக்கிறது; எதிர்கால வாக்குறுதியும் ‘இனி’ என்பதால் தெளிவாகிறது.
- source_word: תַּחַת אֲשֶׁר
  choice: …இருந்ததால்
  rationale: சவுலின் வாக்குறுதிக்கான காரணத்தை அறிமுகப்படுத்தும் காரணத் தொடர்பை இயல்பான தமிழில் வழங்குகிறது.
- source_word: יָקְרָה נַפְשִׁי בְּעֵינֶיךָ
  choice: என் உயிர் உன் பார்வையில் அருமையானதாக இருந்ததால்
  rationale: தாவீது சவுலின் உயிரைக் காப்பாற்றிய கதைச்சூழலில் נֶפֶשׁ என்பது உயிரைக் குறிக்கிறது; ‘உன் பார்வையில் அருமையானது’ என்ற மூலமொழி உருவகமும் காக்கப்படுகிறது.
- source_word: הַיּוֹם הַזֶּה
  choice: இன்று
  rationale: எபிரெயச் சொற்றொடரின் காலக் குறிப்பை நவீன தமிழில் இயல்பாகத் தருகிறது.
- source_word: הִנֵּה
  choice: இதோ
  rationale: தொடர்ந்து வரும் ஒப்புதலுக்குக் கவனத்தை ஈர்க்கும் உரையாடல் குறியீட்டைச் சுருக்கமாகவும் கண்ணியமாகவும் தருகிறது.
- source_word: הִסְכַּלְתִּי
  choice: நான் மூடத்தனமாக நடந்துகொண்டேன்
  rationale: அறிவின்மையை மட்டும் அல்லாமல், முட்டாள்தனமாகச் செயல்பட்டதைக் குறிக்கும் வினைநுட்பத்தைப் பாதுகாக்கிறது.
- source_word: וָאֶשְׁגֶּה הַרְבֵּה מְאֹד
  choice: மிகவும் வழிதவறிப்போனேன்
  rationale: שגה என்பதிலுள்ள வழிதவறுதல் என்ற உருவகப் பொருளையும், הרבה מאד என்பதிலுள்ள தீவிரத்தையும் இயல்பான தமிழில் இணைக்கிறது.
theological_decisions:
- issue: נֶפֶשׁ என்பதன் பொருள்
  choice: என் உயிர்
  alternative: என் ஆத்துமா
  rationale: இந்தக் கதைச்சூழலில் தாவீது சவுலின் உடல் உயிரைக் காப்பாற்றியிருக்கிறான். எனவே இங்கு மனித இயல்பைப் பற்றிய தனிப்பட்ட இறையியல் கருத்தைச் சேர்க்காமல், சூழலுக்கேற்ற ‘உயிர்’ பயன்படுத்தப்பட்டது.
- issue: சவுலின் இறுதி ஒப்புதலில் שגה என்பதன் நுட்பம்
  choice: மிகவும் வழிதவறிப்போனேன்
  alternative: பெரிதும் தவறுசெய்தேன்
  rationale: தவறு செய்தல் என்ற பொதுப்பொருளைக் காட்டிலும், மூலச்சொல்லின் உருவகமான ‘வழிதவறுதல்’ பொருளை முதன்மை உரையில் காக்கிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘என் மகனே தாவீதே’ என்ற அழைப்பு உறவுமுறையையும் உணர்ச்சித் தொனியையும் காக்கிறது; ‘இதோ’ என்பது வேதாகம உரைக்கேற்ற கண்ணியத்தைத் தக்கவைத்தாலும் பழமையான நடையை அதிகப்படுத்தாது.
