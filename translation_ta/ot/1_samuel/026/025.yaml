base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/025.yaml
  text: Then Saul said to David[a], “Blessed are you, my son David. You will surely do, and you will surely prevail.” Then David went on his way, and Saul returned to his place.
translation:
  language: ta
  text: அப்போது சவுல் தாவீதிடம், “என் மகனாகிய தாவீதே, நீ ஆசீர்வதிக்கப்பட்டவன். நீ நிச்சயமாகச் செய்வாய்; நிச்சயமாக வெல்வாய்”[a] என்றான். பின்பு தாவீது தன் வழியில் சென்றான்; சவுலும் தன் இடத்திற்குத் திரும்பினான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொல்லுக்குச் சொல், ‘செய்தல் நீ செய்வாய்; இயலுதல் நீ இயல்வாய்.’ இவ்விரு வினை அமைப்புகளும் தாவீதின் எதிர்காலச் செயலிலும் வெற்றியிலும் உள்ள உறுதியை வலியுறுத்துகின்றன.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּרוּךְ אַתָּה
  choice: நீ ஆசீர்வதிக்கப்பட்டவன்
  rationale: தாவீதை நேரடியாக நோக்கிக் கூறப்படும் செயல்பாட்டு வினையெச்ச ஆசிமொழியின் அறிவிப்புத் தன்மையைப் பாதுகாக்கிறது; இதை வேண்டுதலாக மாற்றவில்லை.
- source_word: בְּנִי דָוִד
  choice: என் மகனாகிய தாவீதே
  rationale: சவுலின் குடும்ப/ஆதரவாளர் பாங்கிலான அழைப்பையும், தாவீதை நேரடியாக அழைக்கும் தமிழின் இயல்பான விளிவடிவையும் தக்கவைக்கிறது.
- source_word: גַּם עָשֹׂה תַעֲשֶׂה
  choice: நீ செய்வதை நிச்சயமாகச் செய்வாய்
  rationale: மூலத்தில் வெளிப்படையாக இல்லாத ‘பெரிய காரியங்கள்’ என்பதைச் சேர்க்காமல், infinitive absolute + imperfect அமைப்பின் வலியுறுத்தலை ‘நிச்சயமாக’ என்பதால் காட்டுகிறது.
- source_word: וְגַם יָכֹל תּוּכָל
  choice: வெற்றியும் நிச்சயமாகப் பெறுவாய்
  rationale: சொல்லளவில் ‘முடியக் கூடியவனாய் இருப்பாய்’ என்றாலும், சூழலில் தடைகளை வென்று வெற்றியடைவதைக் குறிக்கிறது; இரண்டாவது வலியுறுத்தலையும் காக்கிறது.
- source_word: וַיֵּלֶךְ דָּוִד לְדַרְכּוֹ
  choice: தாவீது தன் வழியே சென்றான்
  rationale: பிரிந்து தன் வழியில் செல்வதைக் குறிக்கும் எபிரெய மரபுத்தொடரை இயல்பான தமிழில் தருகிறது.
- source_word: וְשָׁאוּל שָׁב לִמְקוֹמוֹ
  choice: சவுலும் தன் இடத்திற்குத் திரும்பினான்
  rationale: ‘வீடு’ என்று மூலத்தில் இல்லாத குறிப்பைச் சேர்க்காமல், ‘தன் இடம்’ என்பதைக் காக்கிறது.
