translation_notes:
  register: நவீன தரத் தமிழில் இயல்பான, கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. சவுலின் ஆசிமொழி அறிவிப்பாகவே வைக்கப்பட்டு, மூல எபிரெயத்தின் இரட்டை வலியுறுத்தல் அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது. அடிக்குறி [a] அது விளக்கும் முழு கூற்றுக்குப் பின் வைக்கப்பட்டுள்ளது.
