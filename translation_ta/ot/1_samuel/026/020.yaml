  source_fidelity: மூலத்தின் முக்கிய உருவகங்களான “என் இரத்தம்,” “ஒரே ஒரு தெள்ளுப்பூச்சி,” மற்றும் மலைகளில் கவுதாரியைத் துரத்தும் ஒப்புமை ஆகியவை தக்கவைக்கப்பட்டுள்ளன. ஆனால் “புறப்பட்டு வந்திருக்கிறார்” என்பது தாவீதின் இடத்தை நோக்கி வந்தார் என்ற தேவையற்ற நுணுக்கத்தை உணர்த்தலாம்; יָצָא என்பதற்கு “புறப்பட்டிருக்கிறார்” பொருத்தமானது. ஒப்புமையிலும் செய்பவர் வெளிப்படையாக இருக்க வேண்டும்.
  naturalness: “மலைகளில் ஒரு கவுதாரியைத் துரத்துவதுபோல” என்ற தொடர் யார் துரத்துகிறார் என்பதில் சற்றே தொங்கலாக உள்ளது. “மலைகளில் ஒருவர் கவுதாரியைத் துரத்துவதுபோல்” என்பது நவீனத் தரத் தமிழில் இயல்பாகவும் மூலத்தின் பொதுப்படையான ஒப்புமையைத் துல்லியமாகவும் தருகிறது. அடிக்குறி அது விளக்கும் சொல்லுக்கருகில் வைக்கப்பட்டுள்ளது.
  terminology: யְהוָה-க்கு “யாவே” என்பது தொடர்ச்சியாகவும் ஏற்றதாகவும் உள்ளது. “தெள்ளுப்பூச்சி” இங்கு பிளேவைச் சுட்டும் இயல்பான சொல்லாகப் பயன்படுகிறது. “கவுதாரி” மரபான அடையாளத்தைத் தருகிறது; இன அடையாள ஐயத்தை அடிக்குறிப்பு உரியவாறு குறிப்பிடுகிறது.
