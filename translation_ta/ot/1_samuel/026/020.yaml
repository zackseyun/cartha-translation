base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/020.yaml
  text: So now[a], do not let my blood fall to the ground away from the presence of Yahweh, for the king of Israel has come out to seek a single flea[b], as one hunts a partridge in the mountains.
translation:
  language: ta
  text: ஆகவே இப்போது, யாவேயின் முன்னிலையிலிருந்து தொலைவில்[a] என் இரத்தம் தரையில் விழாதிருக்கட்டும். ஏனெனில், மலைகளில் ஒருவர் கவுதாரியைத் துரத்துவதுபோல்[b], இஸ்ரவேலின் அரசர் ஒரே ஒரு தெள்ளுப்பூச்சியைத் தேடிப் புறப்பட்டிருக்கிறார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இதனை, “யாவேயின் திருமுன்னிலிருந்து விலகி என் இரத்தம் தரையில் விழாதிருக்கட்டும்” என்றும் மொழிபெயர்க்கலாம்.
    reason: מִנֶּגֶד פְּנֵי என்ற எபிரெயச் சொற்றொடர் ‘முன்னிலையிலிருந்து தொலைவில்’ அல்லது ‘முன்னிலையிலிருந்து விலகி’ என்ற இடவியல் நுட்பத்தைத் தருகிறது.
  - marker: b
    text: “கவுதாரி” என மொழிபெயர்க்கப்பட்ட எபிரெயச் சொல் சொல்லாட்சிப்படி “கூவும் பறவை” எனப் பொருள்படலாம்; இங்கு குறிக்கப்படும் பறவை இனம் உறுதியாகத் தெரியவில்லை.
    reason: הַקֹּרֵא என்பதன் மரபான அடையாளம் கவுதாரி என்றாலும், அதன் துல்லியமான பறவைவகை குறித்த சொற்பொருள் ஐயம் உண்மையாக உள்ளது.
lexical_decisions:
- source_word: דָּמִי
  choice: என் இரத்தம்
  rationale: வன்முறையான மரணத்தையும் அதனால் உண்டாகும் இரத்தப்பழியையும் உணர்த்தும் மூலமொழியின் நேரடியான உருவகத்தைத் தக்கவைக்கிறது; ‘என் உயிர்’ என்பது அந்த உருவகத்தை அளவுக்கு மீறி மென்மையாக்கும்.
- source_word: אַל יִפֹּל ... אַרְצָה
  choice: தரையில் விழாதிருக்கட்டும்
  rationale: இரத்தம் சிந்தப்பட்டு நிலத்தில் விழும் தெளிவான எபிரெய உருவகத்தை இயல்பான தமிழ் வாக்கிய அமைப்பில் தக்கவைக்கிறது.
- source_word: מִנֶּגֶד פְּנֵי יְהוָה
  choice: யாவேயின் முன்னிலையிலிருந்து தொலைவில்
  rationale: தேவனுடைய முன்னிலையிலிருந்து விலகியிருக்கும் இடவியல் உணர்வை இயல்பான தமிழில் வெளிப்படுத்துகிறது; இது நாட்டிலிருந்தும் வழிபாட்டிடத்திலிருந்தும் அகற்றப்பட்ட நிலையைச் சூழலில் நினைவூட்டக்கூடும், ஆனால் அதை மொழிபெயர்ப்பிலேயே கட்டாய விளக்கமாக்கவில்லை.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய மூலத்தில் வரும் தேவனுடைய தனிப்பெயரை ஒரு பட்டப்பெயரால் மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: יָצָא
  choice: புறப்பட்டு வந்திருக்கிறார்
  rationale: அரசர் ஒருவரைத் தேடித் துரத்துவதற்காகத் தமது இடத்திலிருந்து கிளம்பிய செயலைத் தமிழில் இயல்பாகக் கூறுகிறது; நிறைவுற்ற செயலின் தற்போதைய விளைவையும் வெளிப்படுத்துகிறது.
- source_word: לְבַקֵּשׁ
  choice: தேட
  rationale: சொல்லின் பரந்த பொருளைத் தக்கவைக்கிறது; ‘வேட்டையாட’ அல்லது ‘கொல்லத் தேட’ என்று மொழிபெயர்த்து நோக்கத்தை மூலத்தைவிட வெளிப்படையாகத் தீர்மானிப்பதைத் தவிர்க்கிறது.
- source_word: פַּרְעֹשׁ אֶחָד
  choice: ஒரே ஒரு தெள்ளுப்பூச்சி
  rationale: தாவீது தம்மை மிக அற்பமானவராகக் காட்டும் உருவகத்தையும் אֶחָד தரும் வலியுறுத்தலையும் தக்கவைக்கிறது.
- source_word: הַקֹּרֵא
  choice: ஒரு கவுதாரி
  rationale: வேட்டையாடப்படும் பறவையைக் குறிக்கும் இச்சொல்லின் மரபான மற்றும் சூழலுக்குப் பொருத்தமான அடையாளம் ‘கவுதாரி’; பறவை இனத்தின் துல்லியமான அடையாளம் உறுதியல்ல என்பதால் அடிக்குறிப்பில் மாற்றுப் பொருள் தரப்படுகிறது.
- source_word: יִרְדֹּף ... בֶּהָרִים
  choice: மலைகளில் ... துரத்துவதுபோல
  rationale: மலைப்பகுதியில் பறவையைத் தொடர்ந்து வேட்டையாடும் ஒப்புமையை மூலத்திற்கு நெருக்கமாகவும் இயல்பான தமிழிலும் வழங்குகிறது.
theological_decisions:
- issue: יְהוָה என்ற தேவனுடைய பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூல வசனத்தில் பொதுவான பட்டப்பெயர் அல்ல, நான்கு எபிரெய மெய்யெழுத்துகளால் குறிக்கப்படும் தேவனுடைய தனிப்பெயர் வருகிறது; ஆகவே அதைத் தமிழில் ஒலிபெயர்த்து தனிப்பெயராகவே தக்கவைக்கிறது.
- issue: யாவேயின் முன்னிலையிலிருந்து தொலைவில் இரத்தம் விழுதல்
  choice: இடவியல் மற்றும் உடன்படிக்கைச் சார்ந்த பதற்றத்தைத் திறந்தவாறு தக்கவைத்தல்
  alternative: யாவேயின் பார்வைக்கு அப்பால் கொல்லப்படுதல்
  rationale: மூலச்சொற்றொடர் தேவன் காண முடியாத இடம் உண்டு என்று நேரடியாகக் கற்பிப்பதில்லை; தாவீது யாவேயின் நிலம் அல்லது வழிபாட்டு மையத்திலிருந்து அகற்றப்பட்டிருக்கும் சூழலைக் குறிக்கலாம். மொழிபெயர்ப்பு அந்தச் சாத்தியத்தை விளக்கவுரையால் ஒரே பொருளாக முடிவுசெய்யவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், மரியாதையும் வேதாகமச் செறிவும் கொண்ட நடை பயன்படுத்தப்பட்டுள்ளது. ‘என் இரத்தம்’, ‘ஒரே ஒரு தெள்ளுப்பூச்சி’, ‘மலைகளில் ... துரத்துவது’ ஆகிய மூல உருவகங்கள் மென்மையாக்கப்படாமல் தக்கவைக்கப்பட்டுள்ளன. ‘அரசர்’ என்பது மֶלֶךְ என்பதற்கான இயல்பான நவீனத் தமிழ்; தேவனுடைய பெயர் ‘யாவே’ என்று தனிப்பெயராக வழங்கப்பட்டுள்ளது.
