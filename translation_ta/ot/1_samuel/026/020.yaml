revisions:
- from: ஆகவே இப்போது, யாவேயின் முன்னிலையிலிருந்து தொலைவில் என் இரத்தம் தரையில் விழாதிருக்கட்டும்.[a] ஏனெனில், மலைகளில் ஒரு கவுதாரியைத் துரத்துவதுபோல, இஸ்ரவேலின் அரசர் ஒரே ஒரு தெள்ளுப்பூச்சியைத் தேடிப் புறப்பட்டு வந்திருக்கிறார்.[b]
  to: ஆகவே இப்போது, யாவேயின் முன்னிலையிலிருந்து தொலைவில்[a] என் இரத்தம் தரையில் விழாதிருக்கட்டும். ஏனெனில், மலைகளில் ஒருவர் கவுதாரியைத் துரத்துவதுபோல்[b], இஸ்ரவேலின் அரசர் ஒரே ஒரு தெள்ளுப்பூச்சியைத் தேடிப் புறப்பட்டிருக்கிறார்.
  rationale: மூலத்தின் சொல்லாட்சியையும் திறந்த இடவியல் உணர்வையும் மாற்றாமல், יָצָא-வின் இயக்க நுணுக்கத்தில் “வந்திருக்கிறார்” சேர்க்கும் தேவையற்ற திசையைக் களைந்துள்ளேன். ஒப்புமையின் பொதுப்படையான செய்பவரைத் தெளிவுபடுத்தி, இரு அடிக்குறிகளையும் அவை விளக்கும் சொற்றொடர்களில் பொருத்தியுள்ளேன்.
