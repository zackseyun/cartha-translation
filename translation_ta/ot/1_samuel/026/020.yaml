  revised_text: ஆகவே இப்போது, யாவேயின் முன்னிலையிலிருந்து தொலைவில்[a] என் இரத்தம் தரையில் விழாதிருக்கட்டும். ஏனெனில், மலைகளில் ஒருவர் கவுதாரியைத் துரத்துவதுபோல்[b], இஸ்ரவேலின் அரசர் ஒரே ஒரு தெள்ளுப்பூச்சியைத் தேடிப் புறப்பட்டிருக்கிறார்.
