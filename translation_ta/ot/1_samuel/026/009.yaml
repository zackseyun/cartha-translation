  text: וַ/יֹּ֧אמֶר דָּוִ֛ד אֶל אֲבִישַׁ֖י אַל תַּשְׁחִיתֵ֑/הוּ כִּ֠י מִ֣י שָׁלַ֥ח יָד֛/וֹ בִּ/מְשִׁ֥יחַ יְהוָ֖ה וְ/נִקָּֽה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/009.yaml
  text: But David said to Abishai[a], “Do not destroy him, for who can stretch out his hand against Yahweh’s anointed and remain guiltless?”
translation:
  language: ta
  text: ஆனால் தாவீது அபிசாயிடம், “அவரை அழித்துவிடாதே. ஏனெனில் யாவேவால் அபிஷேகம் செய்யப்பட்டவருக்கு[a] எதிராகத் தன் கையை நீட்டிக் குற்றமற்றவனாய் இருக்கக்கூடியவன் யார்?” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அபிஷேகம் செய்யப்பட்டவர்” என்பதற்கான எபிரெயச் சொல், பிற்காலத்தில் “மேசியா” என்பதோடு தொடர்புடைய அதே சொற்குடும்பத்தைச் சேர்ந்தது. இங்கு அது யாவேவால் அரசனாக அபிஷேகம் செய்யப்பட்ட சவுலைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: ஆனால் தாவீது ... என்றார்
  rationale: தொடர்கதைச் செயலையும், சவுலைக் கொல்லும் அபிசாயின் முன்மொழிவுக்கு தாவீது தெரிவிக்கும் எதிர்ப்பையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: אַל תַּשְׁחִיתֵהוּ
  choice: அவரை அழித்துவிடாதே
  rationale: שׁחת என்பதன் ‘அழித்தல்’ என்ற பரந்த பொருளைப் பேணுகிறது; உடனடிச் சூழலில் அது உயிரைக் கொல்வதைக் குறிக்கிறது.
- source_word: שָׁלַח יָדוֹ
  choice: தன் கையை நீட்டிவிட்டு
  rationale: ஒருவருக்கு எதிராக வன்முறையாகச் செயல்படுவதைக் குறிக்கும் எபிரெய மரபுத்தொடரின் உருவகத்தைப் பேணுகிறது.
- source_word: בִּמְשִׁיחַ יְהוָה
  choice: யெகோவாவால் அபிஷேகம் செய்யப்பட்டவருக்கு எதிராக
  rationale: מָשִׁיחַ என்பதன் அடிப்படைப் பொருளையும், இங்கு யெகோவாவால் அரசனாக அபிஷேகம் செய்யப்பட்ட சவுலையே அது குறிப்பதையும் தெளிவாகக் காட்டுகிறது.
- source_word: וְנִקָּה
  choice: குற்றமற்றவனாய் இருக்கக்கூடியவன்
  rationale: குற்றப்பொறுப்பிலிருந்து விடுபட்டிருத்தல் என்ற பொருளைப் பேணுகிறது; வெறும் தண்டனையிலிருந்து தப்புவதை மட்டும் குறிப்பதாகச் சுருக்கவில்லை.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: தெய்வீகப் பெயரை தமிழில் நிலைபெற்ற ஒலிபெயர்ப்பு வடிவில் வழங்குகிறது.
theological_decisions:
- issue: சவுலைக் குறிக்கும் מְשִׁיחַ என்ற சொல்லின் மொழிபெயர்ப்பு
  choice: யெகோவாவால் அபிஷேகம் செய்யப்பட்டவர்
  alternative: யெகோவாவின் மேசியா
  rationale: இச்சூழலில் இந்தச் சொல் யெகோவாவால் அரசனாக அபிஷேகம் செய்யப்பட்ட சவுலைக் குறிக்கிறது. ‘மேசியா’ என்று வழங்குவது பிற்காலத் தனிப்பட்ட பட்டப்பெயரின் பொருளை இங்கு தேவையின்றி புகுத்தக்கூடும்; அதே சொற்குடும்பத் தொடர்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், மரியாதையும் கதைநடை இயல்பும் கொண்ட மொழி பயன்படுத்தப்பட்டுள்ளது. எபிரெய மரபுத்தொடரான ‘கையை நீட்டுதல்’ அதன் உருவகத்துடன் பேணப்பட்டுள்ளது.
