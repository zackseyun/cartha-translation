    issue: The divine name is rendered ‘யெகோவா.’
    rationale: The supplied source/audit context explicitly identifies ‘Yahweh’ as the project default. ‘யெகோவா’ represents ‘Jehovah,’ one of the listed alternatives, and is therefore inconsistent with the stated lexical decision.
