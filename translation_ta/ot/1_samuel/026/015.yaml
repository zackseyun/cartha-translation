base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/015.yaml
  text: David said to Abner[b][a], “Are you not a man? And who is like you in Israel? Why then have you not kept watch over your lord the king? For one of the people came to destroy the king your lord.”
translation:
  language: ta
  text: தாவீது அப்னேரிடம், “நீ ஒரு ஆண்மகன் அல்லவா? இஸ்ரவேலில் உன்னைப் போன்றவன் யார்?[a] அப்படியிருக்க, உன் தலைவனாகிய அரசனை நீ ஏன் காவல் காக்கவில்லை? மக்களில் ஒருவன்[b] உன் தலைவனான அரசனை அழிப்பதற்காக வந்தான்” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இஸ்ரவேலில் உனக்கு இணையானவன் யார்?”
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில் “மக்களில் ஒருவன்”; அதாவது, முகாமிலிருந்தவர்களில் ஒருவன்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלוֹא אִישׁ אַתָּה
  choice: நீ ஒரு ஆண்மகன் அல்லவா?
  rationale: אִישׁ என்பதன் நேரடிப் பொருள் ‘ஆண்/ஆண்மகன்.’ சூழலில் அப்னேரின் வீரத்தையும் பொறுப்பையும் கேள்விக்குள்ளாக்கும் ஏளனம் இருந்தாலும், மூலத்தில் இல்லாத ‘வீரன்’ என்ற அடைமொழி சேர்க்கப்படவில்லை.
- source_word: וּמִי כָמוֹךָ בְּיִשְׂרָאֵל
  choice: இஸ்ரவேலில் உன்னைப் போன்றவன் யார்?
  rationale: כָמוֹךָ என்பதன் ஒப்பீட்டு வடிவமான ‘உன்னைப் போன்ற’ என்பது பாதுகாக்கப்பட்டுள்ளது; அப்னேருக்கு இணையானவர் இல்லை என்ற உட்பொருளை வெளிப்படையாகத் தீர்மானிக்காமல் விடுகிறது.
- source_word: וְלָמָּה לֹא שָׁמַרְתָּ אֶל
  choice: அப்படியிருக்க, ... நீ ஏன் காவல் காக்கவில்லை?
  rationale: שׁמר இங்கு பாதுகாப்புடன் விழிப்பாகக் காவல் காப்பதைக் குறிக்கிறது. முந்தைய வினாக்களின் அடிப்படையில் வரும் கண்டனத் தொடரை וְ இயல்பாக இணைப்பதால் ‘அப்படியிருக்க’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: אֲדֹנֶיךָ הַמֶּלֶךְ
  choice: உன் தலைவனாகிய அரசனை
  rationale: אדון இங்கு அப்னேருக்கு மேலான அதிகாரியான சவுலைக் குறிக்கிறது. ‘தலைவன்’ என்பது நவீன தமிழில் அதிகார உறவை இயல்பாகக் காட்டுகிறது; ‘அரசன்’ என்ற இணைப்பெயரும் பாதுகாக்கப்பட்டுள்ளது.
- source_word: כִּי בָא אַחַד הָעָם
  choice: மக்களில் ஒருவன் ... வந்தானே
  rationale: אַחַד הָעָם என்பதன் ‘மக்களில் ஒருவன்’ என்ற வடிவம் காக்கப்பட்டுள்ளது. כִּי இங்கு அப்னேரின் தவறுக்கான ஆதாரத்தை வலியுறுத்துவதால், தமிழ் வாக்கிய இறுதியிலுள்ள ‘வந்தானே’ அந்த விளக்க மற்றும் கண்டனத் தொனியை இயல்பாகத் தருகிறது.
- source_word: לְהַשְׁחִית
  choice: அழிப்பதற்காக
  rationale: שׁחת என்பதன் ஹிப்ஃபீல் வடிவம் ‘அழித்தல்’ எனப் பொருள்படும். சூழலில் கொல்வது நோக்கமாக இருந்தாலும், மூலத்தின் விரிவான சொல்லைச் சுருக்கி ‘கொல்ல’ என்று தீர்மானிக்கவில்லை.
- source_word: הַמֶּלֶךְ אֲדֹנֶיךָ
  choice: உன் தலைவனான அரசனை
  rationale: மூலத்தில் மீண்டும் வரும் ‘அரசன்—உன் தலைவன்’ என்ற அதிகார உறவும் மறுபடியும் வலியுறுத்தப்படுவது தமிழிலும் பாதுகாக்கப்பட்டுள்ளது; இயல்பான தமிழ் சொல் வரிசைக்காக உறவு முன்வைக்கப்பட்டுள்ளது.
