    issue: முதன்மை உரையில் செயப்படுபொருள் உறவு தளர்த்தப்பட்டுள்ளது.
    rationale: יָשִׁיב לָאִישׁ אֶת־צִדְקָתוֹ וְאֶת־אֱמֻנָתוֹ என்பது ‘ஒவ்வொருவனுக்கும் அவனுடைய நீதியையும் உண்மையையும் திருப்பியளிப்பார்’ என அமைந்துள்ளது. ‘நீதிக்கும் ... ஏற்ப கைம்மாறு அளிப்பார்’ பொருளைத் தருகிறது; ஆனால் நேரடி செயப்படுபொருள்களை அளவுகோல் சொற்றொடராக மாற்றுகிறது.
