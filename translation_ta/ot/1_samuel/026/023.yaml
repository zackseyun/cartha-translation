base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/023.yaml
  text: And Yahweh will repay each man for his righteousness and his faithfulness[a], because Yahweh gave you into my hand today[b], but I was not willing to stretch out my hand against Yahweh’s anointed.
translation:
  language: ta
  text: யாவே ஒவ்வொருவனுக்கும் அவனுடைய நீதியையும் உண்மையையும் திருப்பியளிப்பார்[a]. யாவே இன்று உன்னை என் கையில் ஒப்புக்கொடுத்தபோதிலும், யாவேயின் அபிஷேகம் செய்யப்பட்டவருக்கு எதிராக என் கையை நீட்ட நான் விரும்பவில்லை[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யாவே ஒவ்வொருவனுக்கும் அவனுடைய நீதி மற்றும் உண்மைக்கு ஏற்ப கைம்மாறு அளிப்பார்.”
    reason: שׁוב என்பதன் ஹிஃபில் வடிவம் இங்கு ‘திருப்பியளித்தல்’ அல்லது நடத்திக்கேற்ப கைம்மாறு அளித்தல் என்ற பொருளை உடையது.
  - marker: b
    text: எபிரெயத்தில், “யாவேயின் அபிஷேகம் செய்யப்பட்டவர்”; அதாவது, யாவேயால் அரசராக அபிஷேகம் செய்யப்பட்டவர்.
    reason: இது சவுலின் அரச பதவியைக் குறிக்கும் பண்பாட்டு மற்றும் வரலாற்று விளக்கம்; பின்னாளைய ‘மேசியா’ என்ற சிறப்புப் பட்டத்தை இங்கு நேரடியாகக் குறிக்கவில்லை.
lexical_decisions:
- source_word: וַיהוָה
  choice: யாவே
  rationale: உடன்படிக்கையின் தெய்வீகப் பெயரான יהוה-ஐ பட்டப்பெயராக மாற்றாமல், ‘யாவே’ என்று ஒலிபெயர்க்கிறது; וַ என்பது தமிழ் வாக்கிய ஓட்டத்தில் தனியே மொழிபெயர்க்கப்பட வேண்டியதில்லை.
- source_word: יָשִׁיב לָאִישׁ
  choice: ஒவ்வொருவனுக்கும் … கைம்மாறு அளிப்பார்
  rationale: שׁוב என்பதன் ஹிஃபில் வடிவம் இங்கு ஒருவனுடைய நடத்தைக்கு ஏற்ப திருப்பியளித்தல் அல்லது பலனளித்தல் என்ற பொருளைக் கொண்டுள்ளது. பொதுமைப்படுத்தும் ஆண்பால் ஒருமையான אִישׁ, ‘ஒவ்வொருவன்’ என்று பாதுகாக்கப்பட்டுள்ளது.
- source_word: צִדְקָתוֹ
  choice: அவனுடைய நீதி
  rationale: இங்கு צְדָקָה என்பது ஒருவரின் நேர்மையான, ஒழுக்கமுள்ள நடத்தை அல்லது நீதியைக் குறிக்கிறது; ‘நீதி’ அதன் நெறிசார் கனத்தைப் பாதுகாக்கிறது.
- source_word: וְאֶת אֱמֻנָתוֹ
  choice: உண்மைத்தன்மை
  rationale: אֱמוּנָה இச்சூழலில் நம்பகத்தன்மை, விசுவாசம், உறுதிப்பற்று ஆகியவற்றைக் குறிக்கிறது. சவுலுக்குத் தீங்கு செய்யாமல் இருந்த தாவீதின் நம்பகமான நடத்தையை ‘உண்மைத்தன்மை’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: אֲשֶׁר נְתָנְךָ יְהוָה הַיּוֹם בְּיָד
  choice: ஏனெனில், யாவே இன்று உன்னை என் கையில் ஒப்புக்கொடுத்தும்
  rationale: ‘கையில் கொடுத்தல்’ என்ற எபிரெய மரபுத்தொடரின் அதிகாரத்திற்குள் ஒப்புக்கொடுத்தல் என்ற கருத்தையும் கை உருவகத்தையும் பாதுகாக்கிறது. அடுத்த கூறுடன் உள்ள வாய்ப்பு–மறுப்பு முரணை ‘ஒப்புக்கொடுத்தும்’ இயல்பாகக் காட்டுகிறது; ‘என்’ என்பது முதல் நபர் சூழலிலிருந்து தெளிவாகிறது.
- source_word: וְלֹא אָבִיתִי
  choice: நான் விரும்பவில்லை
  rationale: אבה என்பது மனமிருத்தல் அல்லது விரும்புதல் என்பதைக் குறிக்கிறது. எதிர்மறையில், வன்முறை செய்யத் தாவீதுக்கு மனமில்லை என்பதை நேரடியாகக் கூறுகிறது; ‘மறுத்தேன்’ என்பதைக் காட்டிலும் மூலத்தின் நுணுக்கத்திற்கு நெருக்கமானது.
- source_word: לִשְׁלֹחַ יָדִי
  choice: என் கையை நீட்ட
  rationale: தாக்குதல் அல்லது தீங்கு செய்தல் எனும் எபிரெய மரபுத்தொடரின் கை உருவகத்தைத் தமிழிலும் புரியத்தக்க வகையில் பாதுகாக்கிறது.
- source_word: בִּמְשִׁיחַ יְהוָה
  choice: யாவேயால் அபிஷேகம் செய்யப்பட்டவருக்கு எதிராக
  rationale: מָשִׁיחַ இங்கு பின்னாளைய தனிப்பட்ட மேசியா பட்டத்தை நேரடியாகக் குறிக்காமல், யாவேயால் அரசராக அபிஷேகம் செய்யப்பட்ட சவுலைக் குறிக்கிறது.
theological_decisions:
- issue: יהוה என்ற தெய்வீகப் பெயரின் மொழியாக்கம்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் உடன்படிக்கையின் தனிப்பெயர் நேரடியாக இருப்பதால், அதை ஒரு பட்டப்பெயராக மாற்றாமல் ‘யாவே’ என்று வழங்குவது மூலத்தின் தனித்துவத்தைப் பாதுகாக்கிறது.
- issue: אִישׁ என்ற பொதுமைப்படுத்தும் ஆண்பால் ஒருமை
  choice: ஒவ்வொருவன்
  alternative: ஒவ்வொருவரும்
  rationale: எபிரெயச் சொல்லின் இலக்கண ஆண்பால் ஒருமையையும் அதன் பிரதிநிதித்துவமான பொதுப் பொருளையும் தமிழில் பாதுகாக்கிறது.
- issue: சவுலைக் குறிக்கும் מְשִׁיחַ
  choice: யாவேயால் அபிஷேகம் செய்யப்பட்டவர்
  alternative: யாவேயின் மேசியா
  rationale: இச்சரித்திரச் சூழலில் இந்தச் சொல் அபிஷேகம் செய்யப்பட்ட அரசனான சவுலைக் குறிக்கிறது; ‘மேசியா’ என்று வழங்குவது பின்னாளைய கிறிஸ்துவியல் சிறப்புப் பொருளை தேவையின்றி இங்கு புகுத்தக்கூடும்.
- issue: אֲשֶׁר கூறின் தர்க்கத் தொடர்பு
  choice: ஏனெனில்
  alternative: அப்போது / என்றாலும்
  rationale: இந்த உறவுப்பெயரெச்சக் கூறு தாவீதின் நீதியும் உண்மைத்தன்மையும் வெளிப்பட்ட நிகழ்வை விளக்குகிறது. இருப்பினும், வாய்ப்பு இருந்தபோதும் அவர் தாக்கவில்லை என்ற முரண் ‘ஒப்புக்கொடுத்தும்’ என்பதால் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியக்கூடிய மதிப்புமிக்க நடையைப் பயன்படுத்துகிறது. ‘கைம்மாறு அளிப்பார்’ என்பது இயல்பான தமிழில் recompense என்ற பொருளைத் தருகிறது; ‘என் கையில் ஒப்புக்கொடுத்தும்’ மற்றும் ‘என் கையை நீட்ட’ என்பவை மூலத்தின் கை உருவகத்தைப் பாதுகாக்கின்றன. எல்லா அடிக்குறிப்புக் குறிகளும் உரிய சொற்றொடர்களுக்குப் பின் முதன்மை உரையில் இடப்பட்டுள்ளன.
