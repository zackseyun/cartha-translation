    rationale: இங்கு אֱמוּנָה என்பது தாவீதின் நம்பகமான/உண்மையான நடத்தையைக் குறிக்கிறது. ‘உண்மை’ நவீன நிலையான தமிழில் இவ்விணைப்பில் இயல்பாக வாசிக்கப்படுகிறது.
  revised_text: யாவே ஒவ்வொருவனுக்கும் அவனுடைய நீதியையும் உண்மையையும் திருப்பியளிப்பார்[a]. யாவே இன்று உன்னை என் கையில் ஒப்புக்கொடுத்தபோதிலும், யாவேயின் அபிஷேகம் செய்யப்பட்டவருக்கு எதிராக என் கையை நீட்ட நான் விரும்பவில்லை[b].
  revised_footnotes:
  - marker: a
    text: அல்லது, “யாவே ஒவ்வொருவனுக்கும் அவனுடைய நீதி மற்றும் உண்மைக்கு ஏற்ப கைம்மாறு அளிப்பார்.”
    reason: שׁוב என்பதன் ஹிஃபில் வடிவம் இங்கு ‘திருப்பியளித்தல்’ அல்லது நடத்திக்கேற்ப கைம்மாறு அளித்தல் என்ற பொருளை உடையது.
  - marker: b
    text: எபிரெயத்தில், “யாவேயின் அபிஷேகம் செய்யப்பட்டவர்”; அதாவது, யாவேயால் அரசராக அபிஷேகம் செய்யப்பட்டவர்.
    reason: இது சவுலின் அரச பதவியைக் குறிக்கும் பண்பாட்டு மற்றும் வரலாற்று விளக்கம்; பின்னாளைய ‘மேசியா’ என்ற சிறப்புப் பட்டத்தை இங்கு நேரடியாகக் குறிக்கவில்லை.
  revision_rationale: மூலத்தின் நேரடிச் செயப்படுபொருள் அமைப்பை முதன்மை உரையில் மீட்டமைத்துள்ளேன்; கைம்மாறு-என்ற விளக்கமான மாற்றை அடிக்குறிப்புக்கு மாற்றியுள்ளேன். ‘உண்மைத்தன்மை’ என்பதற்குப் பதிலாக, சூழலில் விசுவாசமான நடத்தையைக் குறிக்கும் இயல்பான ‘உண்மை’ பயன்படுத்தப்பட்டுள்ளது. இரண்டாம் வாக்கியத்தில் ‘ஒப்புக்கொடுத்தபோதிலும்’ எபிரெயச் சூழலில் உள்ள வாய்ப்பு–தன்னடக்கம் முரணைத் தெளிவாக்குகிறது; ‘யாவேயின் அபிஷேகம் செய்யப்பட்டவர்’ மூலத்தின் உரிமைத் தொடர்பை நேரடியாகக் காக்கிறது.
