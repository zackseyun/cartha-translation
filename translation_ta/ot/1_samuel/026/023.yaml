  naturalness: ‘உண்மைத்தன்மை’ என்பது நவீன தமிழில் பெரும்பாலும் authenticity/தன்மை என்ற நிழற்பொருளைத் தரக்கூடும். இச்சூழலில் நடத்தையில் காட்டப்படும் אֱמוּנָה-விற்கு ‘உண்மை’ இயல்பாகவும், ‘நீதி’யுடன் இணைந்தும் ஒலிக்கிறது. ‘ஒப்புக்கொடுத்தபோதிலும்’ வாய்ப்புக்கும் தாவீதின் மறுப்புக்கும் உள்ள முரணைத் தெளிவாகத் தருகிறது.
  terminology: ‘யாவே’, ‘நீதி’, ‘அபிஷேகம் செய்யப்பட்டவர்’ ஆகியவை பொருத்தமானவை. ‘யாவேயின் அபிஷேகம் செய்யப்பட்டவர்’ என்பது மூலத்தின் உரிமைத் தொடர்பை நேரடியாகப் பாதுகாக்கிறது; அடிக்குறிப்பு இது அரசனைக் குறிக்கிறது என்பதைச் சரியாக விளக்குகிறது.
  issues:
