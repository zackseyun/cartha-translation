base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/012.yaml
  text: So David took the spear and the jar of water from beside Saul’s head[a], and they went away. No one saw it, and no one knew it, and no one awoke, for they were all sleeping[b], because a deep sleep from Yahweh had fallen on them.
translation:
  language: ta
  text: தாவீது ஈட்டியையும் தண்ணீர்க் குடுவையையும் சவுலின் தலைமாட்டிலிருந்து[a] எடுத்துக்கொண்டார்; பிறகு அவர்கள் அங்கிருந்து சென்றுவிட்டார்கள். ஒருவரும் பார்க்கவில்லை; ஒருவருக்கும் தெரியவில்லை; ஒருவரும் விழித்துக்கொள்ளவில்லை. ஏனெனில் அவர்கள் அனைவரும் தூங்கிக்கொண்டிருந்தார்கள்; யாவேயிடமிருந்து வந்த ஆழ்ந்த உறக்கம்[b] அவர்கள்மேல் விழுந்திருந்தது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சவுலின் தலைக்கு அருகிலிருந்து.” எபிரெயச் சொற்றொடர், அவர் படுத்திருந்தபோது அவரது தலை இருந்த பகுதியைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “யாவேயின் ஆழ்ந்த உறக்கம் அவர்கள்மேல் விழுந்திருந்தது.” இந்தச் சொற்றொடர் அந்த உறக்கம் யாவேயிடமிருந்து வந்ததையும், அவரது செயலால் ஏற்பட்டதையும் குறிக்கிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: הַחֲנִית
  choice: ஈட்டி
  rationale: சூழலில் חֲנִית என்பது குத்தும் நீண்ட ஆயுதமான ஈட்டியைக் குறிக்கிறது; நவீன தமிழில் இயல்பான சொல்.
- source_word: צַפַּחַת הַמַּיִם
  choice: தண்ணீர்க் குடுவை
  rationale: צַפַּחַת என்பது தண்ணீர் வைக்கும் சிறிய பாத்திரம் அல்லது குடுவை; ‘தண்ணீர்க் குடுவை’ தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: מֵרַאֲשֹׁתֵי שָׁאוּל
  choice: சவுலின் தலைமாட்டிலிருந்து
  rationale: இந்த எபிரெயச் சொற்றொடர் தூங்கிக்கொண்டிருந்த சவுலின் தலை இருந்த இடத்தையோ தலைக்கு அருகிலிருந்த பகுதியையோ குறிக்கிறது; ‘தலைமாட்டிலிருந்து’ அந்த இடவுணர்வைச் சுருக்கமாகக் காக்கிறது.
- source_word: וַיֵּלְכוּ לָהֶם
  choice: அவர்கள் அங்கிருந்து சென்றுவிட்டார்கள்
  rationale: பன்மை வினை தாவீதையும் அபிசாயையும் குறிக்கிறது; לָהֶם உடன் வரும் சொற்றொடர் அவர்கள் அங்கிருந்து அகன்று சென்றதை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וְאֵין רֹאֶה ... וְאֵין יוֹדֵעַ ... וְאֵין מֵקִיץ
  choice: ஒருவரும் அதைப் பார்க்கவில்லை; ஒருவரும் அதை அறியவில்லை; ஒருவரும் விழித்துக்கொள்ளவில்லை
  rationale: மும்முறை வரும் אֵין + வினையெச்ச அமைப்பின் வலியுறுத்தலையும் இணைநிலையையும் தமிழில் மீளுரைப்பதன் மூலம் காக்கிறது.
- source_word: כִּי כֻלָּם יְשֵׁנִים
  choice: ஏனெனில், அவர்கள் அனைவரும் தூங்கிக்கொண்டிருந்தார்கள்
  rationale: அவர்கள் எவரும் விழிக்காததற்கான உடனடி காரணத்தைத் தொடர்நிலையான உறக்கமாகத் தெளிவுபடுத்துகிறது.
- source_word: תַּרְדֵּמַת יְהוָה
  choice: யாவே உண்டாக்கிய ஆழ்ந்த உறக்கம்
  rationale: תַּרְדֵּמָה ஆழ்ந்த, இயல்புக்கு மீறிய உறக்கத்தைக் குறிக்கிறது; தெய்வப்பெயருடன் வரும் சார்புநிலை மூலத்தையோ காரணத்தையோ குறிக்கக்கூடும். தமிழில் காரணவுணர்வை இயல்பாகத் தருகிறது; மாற்று வடிவம் அடிக்குறிப்பில் காக்கப்படுகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய மூலத்தில் நேரடியாக வரும் தெய்வீகத் தனிப்பெயரான יהוה என்பதை ஒரு பட்டத்தால் மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: נָפְלָה עֲלֵיהֶם
  choice: அவர்கள்மேல் விழுந்திருந்தது
  rationale: ‘மேல் விழுதல்’ என்ற மூல உருவகத்தைப் பேணுகிறது; நிகழ்வுக்கு முன்பே அந்த உறக்கம் நிலவியதை ‘விழுந்திருந்தது’ காட்டுகிறது.
theological_decisions:
- issue: יהוה என்ற தெய்வீகப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூல உரை ஒரு பொதுப்பட்டத்தை அல்ல, நான்கெழுத்துத் தெய்வீகத் தனிப்பெயரைப் பயன்படுத்துகிறது; ஆகவே தனிப்பெயராக ஒலிபெயர்க்கப்பட்டது.
- issue: תַּרְדֵּמַת יְהוָה என்பதில் தெய்வீகச் செயலாற்றல்
  choice: யாவே உண்டாக்கிய ஆழ்ந்த உறக்கம்
  alternative: யாவேயிடமிருந்து வந்த ஆழ்ந்த உறக்கம் / யாவேயின் ஆழ்ந்த உறக்கம்
  rationale: எபிரெயச் சார்புநிலை மூலத்தையும் காரணத்தையும் சுட்டலாம். சூழலில் யாவேயின் செயலால் படையினர் உறங்கினர் என்பது வலுவாகத் தெரிகிறது; இருப்பினும் சொற்றொடரின் வடிவரீதியான மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘ஒருவரும்’ என்ற மும்முறை மீளுரை மூலத்தின் வலியுறுத்தலைக் காக்கிறது. ‘தலைமாட்டு’ என்பது படுத்திருப்பவரின் தலைப்பக்க இடத்தைக் குறிக்கும் இயல்பான தமிழ்ச் சொல்; சாத்தியமான இடவியல் மாற்று அடிக்குறிப்பில் தரப்பட்டுள்ளது.
