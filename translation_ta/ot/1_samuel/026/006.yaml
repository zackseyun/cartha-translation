base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/006.yaml
  text: Then David answered and said to Ahimelech the Hittite and to Abishai son of Zeruiah[a], Joab’s brother, “Who will go down with me to Saul, to the camp?” And Abishai said, “I will go down with you.”
translation:
  language: ta
  text: 'அப்போது தாவீது, இத்தியனான அகிமெலேக்கிடமும் செருயாவின் மகனும் யோவாபின் சகோதரனுமான அபிசாயிடமும் பதிலளித்துச் சொன்னான்: “சவுலிடம், முகாமுக்கு[a] என்னுடன் இறங்கிச் செல்பவர் யார்?” அதற்கு அபிசாய், “நான் உங்களுடன் இறங்கிச் செல்வேன்” என்றான்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இதை இன்னும் இயல்பாக, “முகாமிலுள்ள சவுலிடம்” என்றும் மொழிபெயர்க்கலாம். எபிரெயத்தில் “சவுல்” என்பதற்கு முன்பும் “முகாம்” என்பதற்கு முன்பும் אֶל (எல்) என்னும் இடைச்சொல் மீண்டும் வருகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמֶר
  choice: பதிலளித்துச் சொன்னான்
  rationale: எபிரெயக் கதைநடைச் சூத்திரத்தின் ‘பதிலளித்து—சொன்னான்’ என்ற இரு கூறுகளையும் இயல்பான நவீனத் தமிழில் தக்கவைக்கிறது.
- source_word: אֲחִימֶלֶךְ הַחִתִּי
  choice: இத்தியனான அகிமெலேக்கு
  rationale: தனிப்பெயர் ஒலிபெயர்க்கப்பட்டு, இன அடையாளமான ‘இத்தியன்’ தமிழில் பெயரடையாக வழங்கப்படுகிறது.
- source_word: אֲבִישַׁי בֶּן צְרוּיָה אֲחִי יוֹאָב
  choice: செருயாவின் மகனும் யோவாபின் சகோதரனுமான அபிசாய்
  rationale: இரு குடும்ப உறவுகளையும் தெளிவாகப் பாதுகாத்து, தமிழுக்கு இயல்பான தொடர்பெயர் அமைப்பில் தருகிறது.
- source_word: מִי יֵרֵד אִתִּי
  choice: என்னுடன் இறங்கிச் செல்பவர் யார்?
  rationale: ירד என்பதிலுள்ள கீழ்நோக்கிய இயக்கத்தை ‘இறங்கிச் செல்’ தக்கவைக்கிறது; மரியாதையான ஒருமைச் சுட்டான ‘செல்பவர்’ கேள்வியை இயல்பாக்குகிறது.
- source_word: אֶל שָׁאוּל אֶל הַמַּחֲנֶה
  choice: சவுலிடம், முகாமுக்கு
  rationale: אֶל இருமுறை வருவதை இரு இலக்கு வேற்றுமைகளால் பிரதிபலித்து, சவுலும் அவன் இருக்கும் முகாமும் நோக்கங்கள் என்பதைத் தக்கவைக்கிறது.
- source_word: הַמַּחֲנֶה
  choice: முகாம்
  rationale: நவீனத் தமிழில் இராணுவத் தங்குமிடத்தைக் குறிக்கும் தெளிவான, பொதுவழக்கான சொல்.
- source_word: אֲנִי אֵרֵד עִמָּךְ
  choice: நான் உங்களுடன் இறங்கிச் செல்வேன்
  rationale: முந்தைய கேள்வியிலுள்ள அதே இயக்க வினையை மீண்டும் வழங்குகிறது; அபிசாய் தாவீதிடம் பேசுவதால் நவீன மரியாதை வடிவமான ‘உங்களுடன்’ பயன்படுத்தப்படுகிறது.
