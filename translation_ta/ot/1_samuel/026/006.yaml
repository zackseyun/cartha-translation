    rationale: The current note says that ‘one postposition’ is repeated before both Tamil expressions. In fact, the translation uses different Tamil case forms (‘-ிடம்’ and ‘-க்கு’); what is repeated is the Hebrew preposition אֶל. Naming it explicitly prevents a misleading grammatical claim while preserving the lexical alternative.
