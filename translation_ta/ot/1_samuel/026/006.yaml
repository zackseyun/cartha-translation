translation_notes:
  register: நவீன நிலையான தமிழில், கண்ணியமான ஆனால் பொதுவாசகருக்கு எளிதான நடையில் அமைக்கப்பட்டது. பெயர்கள் வழக்கமான தமிழ் வேதாகம ஒலிப்பெயர்ப்பு மரபுக்கு அண்மையாக வழங்கப்பட்டுள்ளன; எபிரெயத்தின் மீளுருவாக்கம் பொருள் குழப்பமின்றி இயன்றவரை பாதுகாக்கப்பட்டுள்ளது.
