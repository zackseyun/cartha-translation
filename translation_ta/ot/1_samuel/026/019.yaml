base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/019.yaml
  text: And now[a], please let my lord the king hear the words of his servant. If Yahweh has stirred you up against me, may he accept an offering; but if it is men, they are cursed before Yahweh, because they have driven me out today from having a share in Yahweh’s inheritance, saying, ‘Go[b], serve other gods.’
translation:
  language: ta
  text: இப்போது, என் ஆண்டவராகிய அரசர் தமது அடியானின் வார்த்தைகளைக் தயவுசெய்து கேட்பாராக. யெகோவா உம்மை எனக்கு எதிராகத் தூண்டியிருந்தால், அவர் ஒரு காணிக்கையை ஏற்றுக்கொள்வாராக[a]. ஆனால் மனிதர்கள் உம்மைத் தூண்டியிருந்தால், அவர்கள் யெகோவாவின் முன்னிலையில் சபிக்கப்பட்டவர்கள். ஏனெனில், இன்று என்னை யெகோவாவின் சுதந்தரத்தில் பங்குபெறுவதிலிருந்து விரட்டியிருக்கிறார்கள்; அதாவது, ‘நீ போய் வேறு தெய்வங்களை வழிபடு’ என்று சொல்வதுபோல் செய்திருக்கிறார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லர்த்தமாக, ‘அவர் ஒரு காணிக்கையை முகர்வாராக.’ இது ஒரு பலியையோ காணிக்கையையோ ஏற்றுக்கொள்வதைக் குறிக்கும் மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: இப்போது
  rationale: தாவீதின் வேண்டுகோளில் புதிய கட்டத்தை அறிமுகப்படுத்தும் இயல்பான உரையாடல் மாற்றமாக உள்ளது; எபிரெய இணைப்பின் தொடர்ச்சியையும் சூழல் உணர்த்துகிறது.
- source_word: יִשְׁמַע נָא
  choice: தயவுசெய்து கேட்பாராக
  rationale: נָא உடன் வரும் வேண்டுகோள் வடிவம் அரசரிடம் பணிவுடன் செய்யப்படும் விண்ணப்பத்தை வெளிப்படுத்துகிறது.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: என் ஆண்டவராகிய அரசர்
  rationale: சவுலை நோக்கிய மரியாதையான அரசவை அழைப்பைத் தக்கவைக்கிறது; இங்கு ‘ஆண்டவர்’ என்பது அரசருக்கான மரியாதைப் பட்டமே.
- source_word: דִּבְרֵי עַבְדּוֹ
  choice: தமது அடியானின் வார்த்தைகளை
  rationale: தாவீது தன்னை மூன்றாம் நபரில் தாழ்த்திப் பேசும் எபிரெய அரசவை நடையை இயல்பான தமிழில் பாதுகாக்கிறது.
- source_word: אִם יְהוָה הֱסִיתְךָ בִי
  choice: யெகோவா உம்மை எனக்கு எதிராகத் தூண்டியிருந்தால்
  rationale: הסית என்பதன் தூண்டுதல் அல்லது கிளர்த்துதல் என்ற காரணவினைப் பொருளைத் தக்கவைத்து, தெய்வீகச் செயலின் தன்மையை மேலதிகமாக விளக்கவில்லை.
- source_word: יָרַח מִנְחָה
  choice: அவர் ஒரு காணிக்கையை ஏற்றுக்கொள்வாராக
  rationale: சொல்லர்த்தமாக ‘காணிக்கையை முகர்வாராக’ என்ற பலியியல் மரபுத்தொடரின் கருத்தை நவீன வாசகருக்குத் தெளிவாகத் தருகிறது; சொல்லர்த்தம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: וְאִם בְּנֵי הָאָדָם
  choice: ஆனால் மனிதர்கள்தான் உம்மைத் தூண்டியிருந்தால்
  rationale: யெகோவாவுக்கும் மனித முகவர்களுக்கும் இடையிலான வேறுபாட்டைத் தெளிவாக்குகிறது; தமிழில் இயல்பாக இருக்கச் சூழலிலிருந்து புரியும் வினை மீண்டும் சேர்க்கப்பட்டுள்ளது.
- source_word: אֲרוּרִים הֵם לִפְנֵי יְהוָה
  choice: அவர்கள் யெகோவாவின் முன்னிலையில் சபிக்கப்பட்டவர்கள்
  rationale: இது ஒரு விருப்ப வேண்டுதலாக அல்லாமல், எபிரெயில் உள்ளதுபோல் அவர்களைக் குறித்த அறிவிப்பாக மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: גֵרְשׁוּנִי
  choice: என்னைத் துரத்திவிட்டு
  rationale: தாவீது வலுக்கட்டாயமாக வெளியேற்றப்பட்டதைக் காட்டும் வலிமையான, இயல்பான தமிழ் வினை.
- source_word: מֵהִסְתַּפֵּחַ בְּנַחֲלַת יְהוָה
  choice: யெகோவாவின் உரிமைச் சொத்தில் பங்குபெறுவதிலிருந்து
  rationale: இறைவனுக்குரிய நிலத்திலும் உடன்படிக்கை மக்களிலும் இணைந்திருத்தல் என்ற பரந்த கருத்தைத் தருகிறது; ‘உரிமைச் சொத்து’ נחלה என்பதன் ஒதுக்கப்பட்ட உடைமை அல்லது சுதந்தரப் பொருளை நவீன தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: לֵאמֹר לֵךְ עֲבֹד אֱלֹהִים אֲחֵרִים
  choice: ‘நீ போய் வேறு தெய்வங்களை வழிபடு’ என்று சொல்கிறார்கள்
  rationale: அவர்களுடைய வெளியேற்றும் செயல் ஏற்படுத்திய மதரீதியான விளைவை நேரடிக் கூற்றின் வலிமையோடு தக்கவைக்கிறது.
theological_decisions:
- issue: யெகோவா சவுலைத் தாவீதுக்கு எதிராகத் தூண்டியிருக்கக்கூடும் என்ற நிபந்தனை
  choice: தெய்வீகக் காரணத்திற்கும் மனிதப் பொறுப்பிற்கும் உள்ள தொடர்பை விளக்கித் தீர்க்காமல், மூலத்தின் நிபந்தனைக் கூற்றை அப்படியே தக்கவைத்தல்
  alternative: இதை நேரடியான தெய்வீகத் தூண்டுதலாகவோ, வெறும் அனுமதிக்கும் பராமரிப்பாகவோ விளக்குதல்
  rationale: எபிரெய உரை தெய்வீக ஈடுபாட்டின் இயல்பை விளக்கவில்லை; ஆகவே அதன் இறையியல் இழுபறி பாதுகாக்கப்படுகிறது.
- issue: ‘யெகோவாவின் உரிமைச் சொத்து’ என்பதன் வரம்பு
  choice: நிலத்தையும் உடன்படிக்கை மக்களோடு இணைந்திருப்பதையும் உள்ளடக்கக்கூடிய பரந்த சொல்லாக்கம்
  alternative: குறிப்பை நிலத்திற்கு மட்டும் அல்லது பரிசுத்த இட வழிபாட்டிற்கான அணுகலுக்கு மட்டும் கட்டுப்படுத்துதல்
  rationale: נחלה மற்றும் הסתפח ஆகிய சொற்கள் நிலம், மக்கள், அவர்களோடு இணைந்திருத்தல் ஆகிய கருத்துகளை ஒருங்கே சுட்டக்கூடும்; மொழிபெயர்ப்பு அவற்றைத் தேவையின்றிக் குறுக்கவில்லை.
translation_notes:
  register: மொழிநடை நவீன, தெளிவான, கண்ணியமான பொதுத்தமிழில் அமைக்கப்பட்டுள்ளது. அரசரிடம் தாவீது காட்டும் பணிவுக்காக மரியாதைப் பன்மையும் மூன்றாம் நபர் அரசவை நடையும் தக்கவைக்கப்பட்டுள்ளன. தெய்வப் பெயர் יהוה ஒலிபெயர்ப்பாக ‘யெகோவா’ என்று வழங்கப்பட்டுள்ளது.
