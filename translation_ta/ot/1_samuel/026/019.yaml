  to: இப்போது, என் ஆண்டவராகிய அரசர் தமது அடியானின் வார்த்தைகளைக் தயவுசெய்து கேட்பாராக. யெகோவா உம்மை எனக்கு எதிராகத் தூண்டியிருந்தால், அவர் ஒரு காணிக்கையை ஏற்றுக்கொள்வாராக[a]. ஆனால் மனிதர்கள் உம்மைத் தூண்டியிருந்தால், அவர்கள் யெகோவாவின் முன்னிலையில் சபிக்கப்பட்டவர்கள். ஏனெனில், இன்று என்னை யெகோவாவின் சுதந்தரத்தில் பங்குபெறுவதிலிருந்து விரட்டியிருக்கிறார்கள்; அதாவது, ‘நீ போய் வேறு தெய்வங்களை வழிபடு’ என்று சொல்வதுபோல் செய்திருக்கிறார்கள்.
