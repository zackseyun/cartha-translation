base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/014.yaml
  text: Then David called to the troops and to Abner son of Ner, saying, “Will you not answer, Abner?” Abner answered and said, “Who are you, calling to the king?”
translation:
  language: ta
  text: அப்போது தாவீது படைவீரர்களையும் நேரின் மகனான அப்னேரையும் நோக்கிக் கூப்பிட்டு, “அப்னேரே, நீ பதில் சொல்லமாட்டாயா?” என்றான். அப்னேர் பதிலளித்து, “அரசனை நோக்கிக் கூப்பிடும் நீ யார்?” என்றான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָעָם
  choice: படைவீரர்கள்
  rationale: இந்தச் சூழலில் அந்தச் சொல் சவுலுடன் முகாமிட்டிருந்த படையினரைக் குறிக்கிறது; பொதுவான ‘மக்கள்’ என்பதைவிட ‘படைவீரர்கள்’ சூழலுக்குத் தெளிவாகப் பொருந்துகிறது.
- source_word: קָרָאתָ אֶל הַמֶּלֶךְ
  choice: அரசனை நோக்கிக் கூப்பிடுகிற
  rationale: எபிரெய மொழியின் ‘அரசனை நோக்கிக் கூப்பிடுதல்’ என்ற அமைப்பையும், செயல் நிகழும் சூழலையும் இயல்பான தமிழில் தருகிறது.
- source_word: הֲלוֹא תַעֲנֶה
  choice: நீ பதில் சொல்லமாட்டாயா?
  rationale: எதிர்பார்ப்பும் கண்டிப்பின் தொனியும் கலந்த எபிரெய வினாவை இயல்பாகப் பிரதிபலிக்கிறது.
theological_decisions: []
translation_notes:
  register: நவீன செந்தமிழ் நடை; உரையாடல் இயல்பாகவும் கண்ணியமாகவும் வைக்கப்பட்டுள்ளது. எபிரெய மூலத்தின் ‘பதில் கூறி, சொன்னான்’ என்ற மறுமொழியைத் தமிழில் தேவையற்ற இரட்டிப்பைத் தவிர்த்து ‘மறுமொழியாக … என்றான்’ என வழங்கப்பட்டுள்ளது.
