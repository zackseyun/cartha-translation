translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் மரியாதையான கதைநடை பயன்படுத்தப்பட்டது. மூலத்தில் இருமுறை வரும் ‘சீப் வனாந்தரம்’ வலியுறுத்தல் மற்றும் இடத் துல்லியத்திற்காக இருமுறையும் தக்கவைக்கப்பட்டது.
