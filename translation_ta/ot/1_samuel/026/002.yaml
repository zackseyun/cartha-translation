source:
  edition: WLC
  text: וַ/יָּ֣קָם שָׁא֗וּל וַ/יֵּ֨רֶד֙ אֶל מִדְבַּר זִ֔יף וְ/אִתּ֛/וֹ שְׁלֹֽשֶׁת אֲלָפִ֥ים אִ֖ישׁ בְּחוּרֵ֣י יִשְׂרָאֵ֑ל לְ/בַקֵּ֥שׁ אֶת דָּוִ֖ד בְּ/מִדְבַּר זִֽיף־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/002.yaml
  text: Then Saul arose and went down to the wilderness of Ziph[a], and with him were three thousand chosen men of Israel, to seek David in the wilderness of Ziph.
translation:
  language: ta
  text: அப்போது சவுல், சீப் வனாந்தரத்தில் தாவீதைத் தேடுவதற்காக, எழுந்து சீப் வனாந்தரத்துக்கு இறங்கிச் சென்றார்; அவருடன் இஸ்ரவேலின் தேர்ந்தெடுக்கப்பட்ட மூவாயிரம் பேர் இருந்தனர்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּקָם
  choice: எழுந்து
  rationale: קום என்பதன் கால் தொடர் வினை வடிவம் கதையில் தீர்மானமான செயல் தொடங்குவதைக் குறிக்கிறது; ‘எழுந்து’ என்பது அந்த எபிரேயக் கதைநடையை இயல்பாகக் காக்கிறது.
- source_word: וַיֵּרֶד
  choice: சென்றார்
  rationale: ירד என்பதில் கீழ்நோக்கிய நகர்வு அடங்கினாலும், தமிழில் இவ்விடப் பயணத்தை ‘இறங்கிச் சென்றார்’ என்று கூறுவது தேவையற்ற நிலவர ஊகத்தை வலுப்படுத்தலாம்; இயல்பான கதைநடைக்காக ‘சென்றார்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: מִדְבַּר זִיף
  choice: சீப் வனாந்தரம்
  rationale: מִדְבָּר என்பது மணற்பாலை மட்டும் அல்லாமல் மக்கள் குடியிருப்பு குறைந்த திறந்த வறண்ட நிலப்பகுதியையும் குறிக்கும்; ‘வனாந்தரம்’ புவியியல் பொருளைச் சுருக்கமாகக் காக்கிறது.
- source_word: וְאִתּוֹ
  choice: அவருடன் சென்றனர்
  rationale: சவுலுடன் அந்த ஆட்கள் சென்ற துணைநிலையை நவீன தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: שְׁלֹשֶׁת אֲלָפִים אִישׁ בְּחוּרֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் தேர்ந்த வீரர்கள் மூவாயிரம் பேர்
  rationale: בְּחוּרֵי என்பது தேர்ந்தெடுக்கப்பட்ட சிறந்த ஆட்களைக் குறிக்கிறது; சூழல் படை நடவடிக்கை என்பதால் ‘தேர்ந்த வீரர்கள்’ என்பது இயல்பாகவும் துல்லியமாகவும் உள்ளது, மேலும் ‘மூவாயிரம் பேர்’ எண்ணிக்கையையும் மனிதர்களைக் குறிக்கும் אִישׁ என்பதையும் பிரதிபலிக்கிறது.
- source_word: לְבַקֵּשׁ אֶת דָּוִד
  choice: தாவீதைத் தேடுவதற்காக
  rationale: בקש இங்கு ஒருவரைக் கண்டுபிடிக்க நோக்கமுடன் தேடுவதைக் குறிக்கிறது; நோக்கத்தைக் காட்டும் לְ வடிவம் ‘தேடுவதற்காக’ எனத் தெளிவாக வழங்கப்பட்டது.
