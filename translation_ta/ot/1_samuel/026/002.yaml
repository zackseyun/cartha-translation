revisions:
- from: அப்போது சவுல் எழுந்து சீப் வனாந்தரத்திற்குச் சென்றார்; சீப் வனாந்தரத்தில் தாவீதைத் தேடுவதற்காக, இஸ்ரவேலின் தேர்ந்த வீரர்கள் மூவாயிரம் பேர் அவருடன் சென்றனர்.
  to: அப்போது சவுல், சீப் வனாந்தரத்தில் தாவீதைத் தேடுவதற்காக, எழுந்து சீப் வனாந்தரத்துக்கு இறங்கிச் சென்றார்; அவருடன் இஸ்ரவேலின் தேர்ந்தெடுக்கப்பட்ட மூவாயிரம் பேர் இருந்தனர்.
  rationale: The revision restores the explicit ‘went down’ of the Hebrew, retains both occurrences of ‘wilderness of Ziph,’ and uses a non-over-specified rendering for the chosen men. The purpose clause remains applicable to Saul’s expedition without adding interpretive detail.
