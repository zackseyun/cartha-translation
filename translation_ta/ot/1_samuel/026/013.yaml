source:
  edition: WLC
  text: וַ/יַּעֲבֹ֤ר דָּוִד֙ הָ/עֵ֔בֶר וַ/יַּעֲמֹ֥ד עַל רֹאשׁ הָ/הָ֖ר מֵֽ/רָחֹ֑ק רַ֥ב הַ/מָּק֖וֹם בֵּינֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/013.yaml
  text: Then David crossed over to the other side and stood on the top of the mountain at a distance[a]; there was a great space between them.
translation:
  language: ta
  text: பின்பு தாவீது மறுபக்கத்திற்குக் கடந்து சென்று, தொலைவில் ஒரு மலையின் உச்சியில் நின்றான்; அவர்களுக்கிடையில் மிகுந்த இடைவெளி இருந்தது.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்களுக்கிடையேயான இடைவெளி பெரிதாயிருந்தது.” எபிரெயத்தில் சொல்லர்த்தமாக, “அவர்களுக்கிடையில் இடம் பெரிதாயிருந்தது.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲבֹר
  choice: கடந்து சென்று
  rationale: עבר என்பதன் ஒரு பக்கத்திலிருந்து மறுபக்கத்திற்குச் செல்லும் திசைசார் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: הָעֵבֶר
  choice: மறுபக்கம்
  rationale: கதைச் சூழலில் எதிர்ப்புறம் அல்லது அப்பால் உள்ள பக்கத்தைக் குறிக்கிறது.
- source_word: וַיַּעֲמֹד
  choice: நின்றான்
  rationale: எபிரெய வினையின் அடிப்படைப் பொருளை மேலதிக விளக்கமின்றி நேரடியாகத் தருகிறது.
- source_word: עַל רֹאשׁ הָהָר
  choice: மலையுச்சியில்
  rationale: רֹאשׁ என்பதன் நிலவியல் பயன்பாட்டை ‘உச்சி’ என்றும் הָהָר என்பதைக் ‘மலை’ என்றும் இயல்பாக மொழிபெயர்க்கிறது.
- source_word: מֵרָחֹק
  choice: தொலைவில் இருந்த
  rationale: தாவீது நின்ற இடம் மற்றவர்களிடமிருந்து விலகியிருந்ததைத் தெளிவாகக் காட்டுகிறது.
- source_word: רַב הַמָּקוֹם
  choice: மிகுந்த தொலைவு இருந்தது
  rationale: சொல்லர்த்தமாக ‘இடம் பெரிதாயிருந்தது’; இச்சூழலில் அது இரு தரப்பினருக்கிடையேயான கணிசமான இடைவெளியைக் குறிக்கிறது.
- source_word: בֵּינֵיהֶם
  choice: அவர்களுக்கு இடையே
  rationale: தாவீதுக்கும் முகாமிலிருந்தவர்களுக்கும் இடையேயான பிரிவை நேரடியாகக் குறிக்கிறது.
