translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையில் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. எபிரெய வாக்கியத்தின் இடவியல் தகவலும் இறுதி கூறின் சொல்லர்த்த மாற்றுவாய்ப்பும் பாதுகாக்கப்பட்டுள்ளன.
