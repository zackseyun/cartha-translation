base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/013.yaml
  text: The three oldest sons of Jesse had gone after Saul to the battle. And the names of his three sons who had gone to the battle were Eliab the firstborn[a], his second Abinadab, and the third Shammah.
translation:
  language: ta
  text: 'ஈசாயின் மூத்த மூன்று மகன்கள் சவுலைப் பின்தொடர்ந்து[a] போருக்குச் சென்றிருந்தார்கள். போருக்குச் சென்றிருந்த அவருடைய மூன்று மகன்களின் பெயர்கள்: முதற்பேறான எலியாப், இரண்டாமவன் அபினதாப், மூன்றாமவன் சம்மா.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “சவுலைப் பின்தொடர்ந்து” என்பதற்கு, சொல்லுக்குச் சொல் “சவுலுக்குப் பின்னால்” என்றும் பொருள் கொள்ளலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלְכוּ / הָלְכוּ
  choice: சென்றிருந்தார்கள்
  rationale: הלך என்பது இங்கு போருக்குச் செல்லுதல் அல்லது சவுலுடன் படையெடுத்துச் செல்லுதல் என்ற பொருளில் வருகிறது. சுற்றியுள்ள கதையின் பின்னணிச் செய்தியாக இருப்பதால் தமிழில் இறந்தகால நிறைவைக் காட்டும் ‘சென்றிருந்தார்கள்’ இயல்பாக உள்ளது.
- source_word: שְׁלֹשֶׁת בְּנֵי יִשַׁי הַגְּדֹלִים
  choice: ஈசாயின் மூத்த மகன்கள் மூவரும்
  rationale: குடும்பச் சூழலில் הַגְּדֹלִים என்பது உடல் அளவையோ பெருமையையோ அல்ல, வயது அல்லது பிறப்பு வரிசையில் மூத்தவர்களைக் குறிக்கிறது.
- source_word: אַחֲרֵי שָׁאוּל
  choice: சவுலுக்குப் பின்னால்
  rationale: אַחֲרֵי என்பதன் அடிப்படை இடவியல் உருவகமான ‘பின்னால்’ என்பதைக் காக்கிறது; சூழலில் இது சவுலைப் பின்தொடர்ந்து அல்லது அவரது தலைமையில் சென்றதைக் குறிக்கலாம்.
- source_word: לַמִּלְחָמָה / בַּמִּלְחָמָה
  choice: போருக்கு
  rationale: מִלְחָמָה என்பது போர் அல்லது குறிப்பிட்ட போரிடுதலைக் குறிக்கலாம். இங்கு நடைபெறும் குறிப்பிட்ட படை மோதலுக்கும் தமிழின் இயல்பான சொல்லாட்சிக்கும் ‘போர்’ பொருந்துகிறது.
- source_word: וְשֵׁם
  choice: பெயர்கள்
  rationale: எபிரெயத்தில் ‘பெயர்’ ஒருமையில் இருந்தாலும் தொடர்ந்து மூன்று பெயர்கள் பட்டியலிடப்படுவதால் தமிழில் பன்மையான ‘பெயர்கள்’ இயல்பானது.
- source_word: בָּנָיו
  choice: அவருடைய மூன்று மகன்கள்
  rationale: உடைமை விகுதி ஈசாயைக் குறிக்கிறது. மரியாதை ஒருமையான ‘அவருடைய’ என்பது தமிழில் இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: הַבְּכוֹר
  choice: முதற்பேறான
  rationale: בכור என்பது வயதில் மூத்தவர் என்பதை மட்டும் அல்லாமல் குடும்பத்தில் முதற்பேறானவர் என்ற நிலையையும் துல்லியமாகக் குறிக்கிறது.
- source_word: וּמִשְׁנֵהוּ
  choice: அவனுக்கு அடுத்தவனான
  rationale: முதற்பேறான எலியாபுக்குப் பிறகு வரிசையில் இரண்டாவது மகன் என்பதைக் காட்டும் உடைமைத் தொடர்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: וְהַשְּׁלִשִׁי
  choice: மூன்றாமவனான
  rationale: சகோதரர்களின் பிறப்பு அல்லது வயது வரிசையில் மூன்றாவது நபரைத் தெளிவாகக் குறிக்கிறது.
- source_word: אֱלִיאָב / אֲבִינָדָב / שַׁמָּה
  choice: எலியாப் / அபினதாப் / சம்மா
  rationale: எபிரெயத் தனிப்பெயர்களின் ஒலியமைப்புக்கு ஏற்ற, தமிழில் வாசிக்க இயல்பான எழுத்துப்பெயர்ப்புகள்.
