translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையைப் பயன்படுத்துகிறது. ‘கவண்’ என்பது sling என்பதற்கான வழக்கமான துல்லியச் சொல். மூலத்தின் தொடர்ச்சியான செயல்வரிசையும், இறுதி இணைப்பின் உண்மையான பொருள் நெகிழ்வும் பாதுகாக்கப்பட்டுள்ளன.
