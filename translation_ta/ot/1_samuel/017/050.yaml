- from: இவ்வாறு தாவீது ஒரு கவணாலும் ஒரு கல்லாலும் பெலிஸ்தியனை வென்றான்; பெலிஸ்தியனை அடித்துக் கொன்றான்[a]; தாவீதின் கையில் வாள் இருக்கவில்லை.
