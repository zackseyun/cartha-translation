base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/050.yaml
  text: So David prevailed over the Philistine with a sling and with a stone; he struck the Philistine and killed him[a], though there was no sword in David’s hand.
translation:
  language: ta
  text: இவ்வாறு தாவீது ஒரு கவணாலும் ஒரு கல்லாலும் பெலிஸ்தியனை வென்றான்; பெலிஸ்தியனை அடித்துக் கொன்றான்; தாவீதின் கையில் வாள் இல்லாதிருந்தபோதிலும்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தாவீதின் கையில் வாள் இருக்கவில்லை.” எபிரெய இணைப்புச்சொல் எளிமையாக “மற்றும்” என்றும் வாசிக்கப்படலாம்; சூழலில், தாவீதின் கையில் வாள் இல்லாத நிலையிலும் அவன் வென்றான் என்ற பொருளை முதன்மை உரை வெளிப்படுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּחֱזַק דָּוִד מִן הַפְּלִשְׁתִּי
  choice: தாவீது ... பெலிஸ்தியனை வென்றான்
  rationale: חזק உடன் வரும் מִן இங்கு எதிராளியைவிட வலிமை பெற்றிருப்பதை அல்லது அவனை மேற்கொள்வதைச் சுட்டுகிறது. போர்ச் சூழலில் இயல்பான நவீனத் தமிழாக ‘வென்றான்’ பொருந்துகிறது.
- source_word: בַּקֶּלַע וּבָאֶבֶן
  choice: ஒரு கவணாலும் ஒரு கல்லாலும்
  rationale: ב இங்கு கருவியைக் குறிக்கிறது. இரு பெயர்களும் எபிரெயில் ஒருமையில் இருப்பதால், குறிப்பாக ஒரே கல் பயன்படுத்தப்பட்டதைத் தெளிவாகப் பாதுகாக்க ‘ஒரு’ சேர்க்கப்பட்டுள்ளது.
- source_word: וַיַּךְ אֶת־הַפְּלִשְׁתִּי
  choice: பெலிஸ்தியனை அடித்து
  rationale: נכה என்பதன் அடிப்படைப் பொருள் ‘அடி/தாக்கு’. இங்கு ‘அடித்து’ என்பது தெளிவான, இயல்பான தமிழாக்கம்.
- source_word: וַיְמִיתֵהוּ
  choice: கொன்றான்
  rationale: Hiphil வடிவிலுள்ள מות ‘சாகச் செய்/கொல்’ என்று பொருள்படும். ‘கொன்றான்’ நேரடியும் இயல்புமான தேர்வு.
- source_word: וְחֶרֶב אֵין בְּיַד דָּוִד
  choice: தாவீதின் கையில் வாள் இருக்கவில்லை
  rationale: வாக்கியத்தின் எளிய இணைப்புத் தன்மையையும் ‘கையில்’ என்ற உயிரோட்டமான உருவகத்தையும் பாதுகாக்கிறது. சூழலில் எதிர்மறை அல்லது வியப்பூட்டும் தொடர்பு உணரப்பட்டாலும், וְ என்பதைக் கட்டாயமாக ‘ஆனால்/இருந்தபோதிலும்’ என்று தீர்மானிக்காமல் விடுகிறது.
