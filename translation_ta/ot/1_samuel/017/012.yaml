translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையும் எளிய வாசிப்புத்தன்மையும் கொண்ட நடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தில் இல்லாத தொடக்கக் கால/உரையாடல் இடைச்சொல் சேர்க்கப்படவில்லை. கடினமான இறுதி மரபுத்தொடரின் இயல்பான பொருள் முதன்மை உரையிலும் அதன் உண்மையான தெளிவின்மை அடிக்குறிப்பிலும் வைக்கப்பட்டுள்ளது.
