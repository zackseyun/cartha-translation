base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/012.yaml
  text: David was the son of an Ephrathite from Bethlehem of Judah[a], whose name was Jesse, and he had eight sons. In the days of Saul, the man was old, advanced in years.
translation:
  language: ta
  text: தாவீது, யூதாவிலுள்ள பெத்லகேமைச் சேர்ந்த இந்த எப்பிராத்தியரின் மகன். அவருடைய பெயர் ஈசாய்; அவருக்கு எட்டு மகன்கள் இருந்தார்கள். சவுலின் நாட்களில் அந்த மனிதர் முதியவராக இருந்தார்; வயதில் மிகவும் முன்னேறியிருந்தார்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய சொற்றொடர் அரிதானது; சொல்லுக்கு சொல், “மனிதர்களுக்குள் வந்திருந்தார்” என்று பொருள்படும். இங்கு அது மிகவும் முதிர்ந்த வயதைச் சுட்டுவதாகத் தெரிகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶפְרָתִי
  choice: எப்பிராத்தியர்
  rationale: யூதாவிலுள்ள பெத்லகேமுடன் இணைத்துக் கூறப்படுவதால், இது எப்பிராயீம் கோத்திரத்தவரைக் குறிக்காமல் எப்பிராத்தா/பெத்லகேமைச் சேர்ந்தவரைக் குறிக்கிறது. புவியியல்-இன அடையாளத்தைத் தமிழில் இயல்பாகப் பாதுகாக்கும் வடிவம்.
- source_word: מִבֵּית לֶחֶם יְהוּדָה
  choice: யூதாவிலுள்ள பெத்லகேமைச் சேர்ந்த
  rationale: இதே பெயருடைய வேறு ஊர்களிலிருந்து இதை வேறுபடுத்தும் புவியியல் குறிப்பைத் தெளிவான நவீனத் தமிழில் தருகிறது.
- source_word: וּשְׁמוֹ יִשַׁי
  choice: அவருடைய பெயர் ஈசாய்
  rationale: எபிரெய இணைப்பை நேராகவும் இயல்பாகவும் வழங்குகிறது; சுட்டுப்பெயர் தந்தையையே குறிக்கிறது.
- source_word: וְלוֹ שְׁמֹנָה בָנִים
  choice: அவருக்கு எட்டு மகன்கள் இருந்தார்கள்
  rationale: எபிரெய மொழியின் உடைமை அமைப்பை பொருள் இழப்பின்றி இயல்பான தமிழில் தருகிறது.
- source_word: בִּימֵי שָׁאוּל
  choice: சவுலின் நாட்களில்
  rationale: மூலத்தின் காலக் குறிப்பை நெருக்கமாகவும் தமிழில் புரியத்தக்கவாறும் பாதுகாக்கிறது.
- source_word: זָקֵן
  choice: முதியவராகி
  rationale: முதுமையை நேரடியாகக் குறிக்கிறது; அதைத் தொடர்ந்து வரும் வயது பற்றிய அரிய சொற்றொடருடன் இயல்பாக இணைகிறது.
- source_word: בָּא בַאֲנָשִׁים
  choice: வயதில் மிகவும் முன்னேறியிருந்தார்
  rationale: சொல்லுக்கு சொல் பார்த்தால் அரிதும் தெளிவற்றதுமான எபிரெய மரபுத்தொடர். சூழலில் முதிர்ந்த வயதைச் சுட்டுவதாகப் பொதுவாகப் புரிந்துகொள்ளப்படுவதால், வாசிக்க இயல்பான பொருள் முதன்மை உரையில் தரப்பட்டு, அதன் நேரடி உருவகம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: וְהָאִישׁ
  choice: அந்த மனிதர்
  rationale: மூலத்தில் ஈசாயை மீண்டும் ‘அந்த மனிதர்’ என்று குறிப்பிடும் உரையோட்டத்தைப் பாதுகாக்கிறது.
