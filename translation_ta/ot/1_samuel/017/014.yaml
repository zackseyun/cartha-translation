base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/014.yaml
  text: David was the youngest[a], and the three oldest had gone after Saul.
translation:
  language: ta
  text: தாவீது இளையவன்[a]; மூத்த மூவரும் சவுலைப் பின்தொடர்ந்து சென்றிருந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தாவீது இளையவன்; மூத்த மூவரும் சவுலைப் பின்தொடர்ந்து சென்றார்கள்.” எபிரேய இணைப்புச்சொல்லை “மேலும்” என்றும் மொழிபெயர்க்கலாம்; வினைச்சொல்லையும் முன்னிறந்தகாலப் பொருள் இல்லாமல் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/דָוִד
  choice: தாவீது
  rationale: வாவ் இணைப்புச்சொல் இங்கு பின்னணியை விளக்கும் உரையோட்ட இணைப்பாக உள்ளது; தமிழில் தனியே ‘மேலும்’ அல்லது ‘இப்போது’ என்று சேர்க்காமல் இயல்பாக விடப்பட்டுள்ளது.
- source_word: הוּא הַ/קָּטָן
  choice: இளையவன்
  rationale: சகோதரர்களுக்கிடையிலான வயது ஒப்பீட்டில் ‘சிறியவன்/இளையவன்’ என்ற எபிரேயச் சொற்றொடர் குடும்பத்தின் இளையவனைக் குறிக்கிறது.
- source_word: וּ/שְׁלֹשָׁה הַ/גְּדֹלִים
  choice: மூத்த மூவரும்
  rationale: குடும்பச் சூழலில் הַגְּדֹלִים வயதில் மூத்த சகோதரர்களைக் குறிக்கிறது; தமிழில் ‘மூத்த மூவர்’ என்பது தெளிவும் இயல்பும் உடையது.
- source_word: הָלְכוּ אַחֲרֵי
  choice: பின்தொடர்ந்து சென்றிருந்தார்கள்
  rationale: சொல்லர்த்தத்தில் ‘பின்னால் சென்றார்கள்’; இங்கு சவுலோடு போருக்குச் சென்றதைச் சுட்டுகிறது. பின்னணியில் ஏற்கெனவே நிகழ்ந்த செயலைத் தமிழில் ‘சென்றிருந்தார்கள்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: שָׁאוּל
  choice: சவுல்
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் பரவலாக அறியப்பட்ட பெயர்வடிவம்.
theological_decisions: []
translation_notes:
  register: நவீனத் தரத் தமிழில், எளிமையும் கண்ணியமும் கொண்ட உரை. எபிரேய வசனத்தின் இரு இணையான கூற்றுகளும் பாதுகாக்கப்பட்டுள்ளன; தமிழின் இயல்பிற்காக இரண்டாம் இணைப்பில் ‘-உம்’ பயன்படுத்தப்பட்டுள்ளது.
