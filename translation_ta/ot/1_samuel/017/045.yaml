  text: וַ/יֹּ֤אמֶר דָּוִד֙ אֶל הַ/פְּלִשְׁתִּ֔י אַתָּה֙ בָּ֣א אֵלַ֔/י בְּ/חֶ֖רֶב וּ/בַ/חֲנִ֣ית וּ/בְ/כִיד֑וֹן וְ/אָנֹכִ֣י בָֽא אֵלֶ֗י/ךָ בְּ/שֵׁם֙ יְהוָ֣ה צְבָא֔וֹת אֱלֹהֵ֛י מַעַרְכ֥וֹת יִשְׂרָאֵ֖ל אֲשֶׁ֥ר חֵרַֽפְתָּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/045.yaml
  text: Then David said to the Philistine[a], “You come to me with a sword, with a spear, and with a javelin, but I come to you in the name of Yahweh of Armies, the God of the armies of Israel[c][b], whom you have defied.”
translation:
  language: ta
  text: அப்போது தாவீது அந்தப் பெலிஸ்தியனிடம், “நீ வாளோடும் ஈட்டியோடும் எறிவேலோடும் என்னிடம் வருகிறாய். நானோ படைகளின் யாவே[a], இஸ்ரவேலின் போரணிகளின் கடவுள்[b], என்ற பெயரில் உன்னிடம் வருகிறேன்; அவரையே நீ இகழ்ந்து எதிர்த்தாய்[c]” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “படைகளின் யாவே” என்பதைப் பாரம்பரியமாக “சேனைகளின் ஆண்டவர்” என்றும் மொழிபெயர்ப்பார்கள்.
    reason: lexical_alternative
  - marker: b
    text: “இஸ்ரவேலின் போரணிகள்” என்பது போருக்காக அணிவகுத்த இஸ்ரவேலின் படைவரிசைகளைக் குறிக்கலாம்; “இஸ்ரவேலின் படைகள்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: “இகழ்ந்து எதிர்த்தாய்” என்பதற்கு “நிந்தித்தாய்,” “அவமதித்தாய்,” அல்லது “சவால் செய்தாய்” என்றும் மொழிபெயர்க்கலாம். இங்கு இது யாவே, இஸ்ரவேலின் கடவுளுக்கு எதிரான இகழ்ச்சியான எதிர்ப்பைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: அப்போது ... என்றான்
  rationale: வாவ் தொடர்வினை கதையை அடுத்த நிகழ்வுக்கு நகர்த்துகிறது; ‘அப்போது’ என்பது அதன் தொடர்ச்சியை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: הַפְּלִשְׁתִּי
  choice: அந்தப் பெலிஸ்தியன்
  rationale: மூலத்தில் கோலியாத் இன அடையாளத்தால் குறிப்பிடப்படுகிறான்; ‘வீரன்’ போன்ற விளக்கச் சொல்லைச் சேர்க்காமல் அதையே தக்கவைக்கிறது.
- source_word: בָּא אֵלַי / בָא אֵלֶיךָ
  choice: என்னிடம் வருகிறாய் / உன்னிடம் வருகிறேன்
  rationale: பங்கேற்புவினை நிகழ்கால அல்லது உடனடி செயலைக் குறிக்கிறது; பகைமைச் சூழல் ஏற்கெனவே தெளிவாக இருப்பதால் ‘எதிராக’ என்று சேர்க்கப்படவில்லை.
- source_word: בְּחֶרֶב
  choice: வாளோடு
  rationale: ב கருவி அல்லது சாதனத்தைக் குறிக்கிறது; தமிழில் ஆயுதத்தை ஏந்திவருவதை இயல்பாகத் தெரிவிக்கிறது.
- source_word: וּבַחֲנִית
  choice: ஈட்டியோடு
  rationale: חֲנִית என்பது நீளமான ஈட்டி அல்லது வேல் வகை ஆயுதம்; தெளிவான பொதுத் தமிழ்ச் சொல் தேர்ந்தெடுக்கப்பட்டது.
- source_word: וּבְכִידוֹן
  choice: எறிவேலோடு
  rationale: כִּידוֹן இலகுவாக எறியப்படும் வேல் வகையைக் குறிக்கிறது; இதனை חֲנִית என்பதிலிருந்து வேறுபடுத்துகிறது.
- source_word: בְּשֵׁם
  choice: என்ற பெயரில்
  rationale: அதிகாரம், பிரதிநிதித்துவம், சார்பு ஆகியவற்றை உள்ளடக்கும் எபிரெய மரபுத்தொடரின் இறையியல் நிறையைத் தக்கவைக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இது பொதுப்பட்டம் அல்ல, இஸ்ரவேலின் கடவுளுடைய தனிப்பெயர்; தமிழில் அறியப்பட்ட ஒலிபெயர்ப்பு பயன்படுத்தப்படுகிறது.
- source_word: צְבָאוֹת
  choice: படைகளின்
  rationale: צְבָאוֹת என்பதன் இராணுவப் பொருளை நவீன வாசகர்களுக்குத் தெளிவாகத் தருகிறது; பழைய ‘சேனைகள்’ என்பதைக் காட்டிலும் பொதுவாகப் புரிகிறது.
- source_word: אֱלֹהֵי מַעַרְכוֹת יִשְׂרָאֵל
  choice: இஸ்ரவேலின் போரணிகளுடைய கடவுள்
  rationale: מַעַרְכוֹת என்பது வெறும் பொதுவான படைகளை மட்டுமல்லாமல் போருக்காக அணிவகுத்த வரிசைகளையும் குறிக்கிறது; ‘போரணிகள்’ அந்தக் குறிப்பிட்ட படிமத்தைப் பாதுகாக்கிறது.
- source_word: אֲשֶׁר חֵרַפְתָּ
  choice: அவரையே நீ இகழ்ந்து சவால் விட்டாய்
  rationale: חרף என்பது வெறும் நிந்தனை அல்ல; இச்சூழலில் கடவுளை அவமதித்து எதிர்ப்பதையும் குறிக்கிறது. ‘இகழ்ந்து சவால் விட்டாய்’ அதன் இரு நுணுக்கங்களையும் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூலத்தில் தனிப்பட்ட உடன்படிக்கைப் பெயர் நேரடியாக உள்ளது; அதைப் பொதுப்பட்டமாக மாற்றாமல் ஒலிபெயர்ப்பது மூல வேறுபாட்டைப் பாதுகாக்கிறது.
- issue: יְהוָה צְבָאוֹת என்ற பட்டப்பெயர்
  choice: படைகளின் யாவே
  alternative: சேனைகளின் ஆண்டவர்
  rationale: பாரம்பரியச் சொற்றொடரின் பழக்கத்தை மட்டும் பின்பற்றாமல், צְבָאוֹת என்பதன் வெளிப்படையான இராணுவப் பொருளையும் יְהוָה என்ற தனிப்பெயரையும் தக்கவைக்கிறது.
- issue: אֲשֶׁר חֵרַפְתָּ என்பதன் தொடர்பும் வலிமையும்
  choice: கடவுளைக் குறிக்கும் ‘அவரையே நீ இகழ்ந்து சவால் விட்டாய்’
  alternative: ‘நீ இகழ்ந்த இஸ்ரவேலின் போரணிகள்’
  rationale: இலக்கண ரீதியில் தொடர்புப்பெயர் பாலினம் அல்லது எண்ணை வெளிப்படுத்தாததால் ஓரளவு தொடர்புமயக்கம் உள்ளது. உடனடிச் சூழலும் வசனத்தின் இறையியல் மையமும் சவால் இறுதியில் இஸ்ரவேலின் கடவுளுக்கு எதிரானது என்பதைக் காட்டுகின்றன; அடிக்குறிப்பில் நுணுக்கம் தெரிவிக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், உரையாடலுக்கேற்ற இயல்பும் வேதாகம உரைக்கேற்ற கண்ணியமும் இணைக்கப்பட்டுள்ளன. ‘வாள்—ஈட்டி—எறிவேல்’ என்ற மூன்று ஆயுதங்களின் வேறுபாடும், ‘போரணிகள்’ என்ற போர்க்களப் படிமமும் பாதுகாக்கப்பட்டுள்ளன. இறைப்பெயர் பட்டமாக மாற்றப்படாமல் ‘யாவே’ என வழங்கப்பட்டுள்ளது.
