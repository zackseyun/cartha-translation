  to: அப்போது தாவீது அந்தப் பெலிஸ்தியனிடம், “நீ வாளோடும் ஈட்டியோடும் எறிவேலோடும் என்னிடம் வருகிறாய். நானோ படைகளின் யாவே[a], இஸ்ரவேலின் போரணிகளின் கடவுள்[b], என்ற பெயரில் உன்னிடம் வருகிறேன்; அவரையே நீ இகழ்ந்து எதிர்த்தாய்[c]” என்றான்.
  rationale: மூல எபிரெயத்தின் ஒரே ‘பெயரில்’ தொடரையும், யாவேக்கு இணைநிலையாக வரும் ‘இஸ்ரவேலின் போரணிகளின் கடவுள்’ என்ற அமைப்பையும் மீட்டமைத்துள்ளேன். தொடர்புப்பெயர் குறித்த தவறான இலக்கண-மயக்கக் குறிப்பு நீக்கப்பட்டு, சூழலுக்கு ஏற்றும் இலக்கணத்திற்கு முரணில்லாதும் உள்ள விளக்கம் தரப்பட்டுள்ளது. எந்தக் கோட்பாட்டு விளக்கமும் சேர்க்கப்படவில்லை.
