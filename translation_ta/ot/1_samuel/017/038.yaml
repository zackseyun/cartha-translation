base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/038.yaml
  text: Then Saul clothed David with his garments[a], put a bronze helmet on his head[b], and clothed him with armor.
translation:
  language: ta
  text: அப்போது சவுல் தன் ஆடைகளைத் தாவீதுக்கு அணிவித்து,[a] அவனுடைய தலையில் ஒரு வெண்கலத் தலைக்கவசத்தை வைத்து, அவனுக்கு உடற்கவசத்தையும் அணிவித்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘தன் போருடையை.’ இங்கு பயன்படுத்தப்பட்டுள்ள எபிரேயச் சொல் பொதுவான ஆடைகளையோ, பதவி அல்லது போருடன் தொடர்புடைய உடையையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּלְבֵּשׁ
  choice: அணிவித்து / அணிவித்தான்
  rationale: לבשׁ என்பதன் ஹிஃபில் வடிவம் ஒருவரை ஒன்றை அணியச் செய்வதைக் குறிக்கிறது. வசனத்தில் இருமுறை வரும் வினைச்சொல்லையும் தமிழில் இயல்பாகப் பாதுகாக்கிறது.
- source_word: מַדָּיו
  choice: தன் ஆடைகளை
  rationale: מַד என்பது பொதுவான ஆடைகளையோ பதவி அல்லது போருடன் தொடர்புடைய உடையையோ குறிக்கலாம். பின்னர் தலைக்கவசமும் உடற்கவசமும் தனித்தனியாகக் கூறப்படுவதால், அவற்றுடன் இதை ஒன்றாக்காமல் ‘ஆடைகள்’ என மொழிபெயர்க்கப்பட்டது; மூன்றாம் நபர் ஆண்பால் ஒருமை பின்னொட்டு சவுலைக் குறிப்பதால் ‘தன்’ பயன்படுத்தப்பட்டது.
- source_word: קוֹבַע נְחֹשֶׁת
  choice: ஒரு வெண்கலத் தலைக்கவசம்
  rationale: קוֹבַע என்பது தலைக்கவசம்; பண்டைய போர்க்கருவிகளின் சூழலில் נְחֹשֶׁת என்பதை ‘வெண்கலம்’ என வழங்குவது பொருத்தமானது.
- source_word: עַל רֹאשׁוֹ
  choice: அவனுடைய தலையில்
  rationale: எபிரேய முன்னிலைத் தொடரை இயல்பான நவீனத் தமிழில் நேரடியாக வழங்குகிறது.
- source_word: שִׁרְיוֹן
  choice: உடற்கவசம்
  rationale: இச்சொல் உடலில் அணியும் போர்க்கவசத்தைக் குறிக்கிறது. அதன் துல்லியமான அமைப்பை மூலவசனம் குறிப்பிடாததால், குறிப்பிட்ட வகையைத் திணிக்காமல் ‘உடற்கவசம்’ எனத் தெளிவாக வழங்கப்பட்டது.
