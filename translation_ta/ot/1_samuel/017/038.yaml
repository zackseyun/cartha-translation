translation_notes:
  register: நவீனத் தரமான, கண்ணியமான தமிழ். எபிரேய வசனத்தின் தொடர்ச்சியான மூன்று செயல்களும், ‘அணிவித்தல்’ என்ற வினைச்சொல்லின் மீளுரைப்பும் இயன்றவரை பாதுகாக்கப்பட்டுள்ளன. ஆங்கில ஆலோசனை உரையின் [b] குறிப்பு தலைக்கவசத்தின் பின்னர் இருந்தாலும் அதன் உள்ளடக்கம் உடற்கவசத்துக்கான மாற்றுப் பெயர்களைக் குறித்ததால், தவறான குறிப்பு இணைப்பைத் தவிர்க்க அது சேர்க்கப்படவில்லை.
