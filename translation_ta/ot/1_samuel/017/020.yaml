translation_notes:
  register: நவீன பொதுத்தமிழில், வரலாற்றுக் கதையாடலுக்கேற்ற கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. எபிரெய வாக்கியத்தின் தொடர்ச்சியான செயல்கள் தமிழில் இயல்பாக இணைக்கப்பட்டுள்ளன; தெளிவுக்காக முந்தைய வசனத்திலிருந்து ஊகிக்கப்படும் ‘பொருள்களை’ மட்டும் வெளிப்படையாகச் சேர்த்துள்ளோம். அடிக்குறிப்பு குறிகள் அவை விளக்கும் சொற்கள் மற்றும் சொற்றொடர்களின் அருகே வைக்கப்பட்டுள்ளன.
