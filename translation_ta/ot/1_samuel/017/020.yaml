base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/020.yaml
  text: So David rose early in the morning[a], left the sheep with a keeper, took the supplies, and went, just as Jesse had commanded him[b]. He came to the encampment as the army was going out to the battle line and shouting the war cry.
translation:
  language: ta
  text: தாவீது அதிகாலையில் எழுந்து, ஆடுகளை ஒரு காவலரிடம் விட்டுவிட்டு, உணவுப் பொருள்களை எடுத்துக்கொண்டு, ஈசாய் அவனுக்குக் கட்டளையிட்டபடியே புறப்பட்டான். படை போர் அணிவரிசைக்குப் புறப்பட்டு, போர்முழக்கம் எழுப்பிக்கொண்டிருந்தபோது[b], அவன் பாளையத்தை[a] வந்தடைந்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘வட்ட வடிவிலான பாளையம்’ அல்லது ‘வண்டிகளால் அமைக்கப்பட்ட சுற்றரண்’ என்றும் மொழிபெயர்க்கலாம்; எபிரெயச் சொல் பாளையத்தின் வட்ட அமைப்பையோ அதன் தற்காப்புச் சுற்றெல்லையையோ குறிப்பாகக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: 'எழுத்துப்படி: ‘அவர்கள் போரில் முழக்கமிட்டார்கள்’; சூழலுக்கு ஏற்ப, ‘போருக்காக முழக்கமிட்டார்கள்’ என்றும் பொருள்கொள்ளலாம்.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁכֵּם דָּוִד בַּבֹּקֶר
  choice: தாவீது அதிகாலையில் எழுந்து
  rationale: השׁכים என்பது அதிகாலையில் எழுதல் அல்லது செயலைத் தொடங்குதல் என்பதைக் குறிக்கிறது; בבקר உடன் வருவதால் ‘அதிகாலையில் எழுந்து’ என்பது இயல்பாகவும் தாவீதின் உடனடியான செயலையும் தெளிவாகவும் வெளிப்படுத்துகிறது.
- source_word: וַיִּטֹּשׁ אֶת־הַצֹּאן עַל־שֹׁמֵר
  choice: ஆடுகளை ஒரு காவலாளியிடம் விட்டுவிட்டு
  rationale: ஆடுகளை வேறொருவரின் பொறுப்பில் விட்டுச் சென்றதையே எபிரெயச் சொற்றொடர் குறிக்கிறது. மேய்ப்புச் சூழலில் ‘காவலாளி’ தெளிவான நவீனத் தமிழ்.
- source_word: וַיִּשָּׂא
  choice: பொருள்களை எடுத்துக்கொண்டு
  rationale: வினைச்சொல் நேரடியாக ‘தூக்கினான்/எடுத்தான்’ என்று பொருள்படும்; அதன் செயப்படுபொருள் இவ்வசனத்தில் கூறப்படாவிட்டாலும் முந்தைய வசனத்தில் சொல்லப்பட்ட உணவுப் பொருள்களே சூழலால் குறிக்கப்படுகின்றன. வாசிப்புத் தெளிவுக்காக ‘பொருள்களை’ சேர்க்கப்பட்டுள்ளது.
- source_word: כַּאֲשֶׁר צִוָּהוּ יִשָׁי
  choice: ஈசாய் தனக்குக் கட்டளையிட்டபடியே
  rationale: צוה என்பதன் ‘கட்டளையிடு’ என்ற வலிமையைப் பாதுகாக்கிறது; כאשר குறிக்கும் ஒத்திசைவை ‘படியே’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: הַמַּעְגָּלָה
  choice: பாளையம்
  rationale: இராணுவம் முகாமிட்டிருந்த இடத்தை ‘பாளையம்’ இயல்பாகக் குறிக்கிறது. மூலச்சொல் வட்ட அமைப்பு அல்லது தற்காப்புச் சுற்றரணைக் குறிப்பதாக இருக்கக்கூடிய நுணுக்கம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
- source_word: הַחַיִל הַיֹּצֵא אֶל־הַמַּעֲרָכָה
  choice: படை போரணிக்குப் புறப்பட்டு
  rationale: החיל இச்சூழலில் படையையும், מערכה போருக்காக ஒழுங்குபடுத்தப்பட்ட அணிவரிசையையும் குறிக்கின்றன. தொடர்நிலைச் செயலைத் தமிழில் சூழலோடு இணைத்து இயல்பாக வழங்குகிறது.
- source_word: וְהֵרֵעוּ בַּמִּלְחָמָה
  choice: போர்முழக்கம் எழுப்பிக்கொண்டிருந்தபோது
  rationale: רוע என்பதன் ஹிஃபீல் வடிவம் போர்ச் சூழலில் உரத்த முழக்கம் எழுப்புதலைக் குறிக்கிறது. ‘போர்முழக்கம்’ அதன் இராணுவப் பொருளைத் தெளிவாக்குகிறது; நேரடியான வடிவம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
