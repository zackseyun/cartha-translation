base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/055.yaml
  text: When Saul saw David going out to meet the Philistine[a], he said to Abner, the commander of the army, “Whose son is this young man, Abner?” And Abner said, “As your soul lives, O king, I do not know.”
translation:
  language: ta
  text: சவுல், தாவீது அந்தப் பெலிஸ்தியனை எதிர்கொள்ளப் புறப்பட்டுச் செல்வதைக் கண்டபோது, படைத்தலைவனான அப்னேரிடம், “அப்னேரே, இந்த இளைஞன் யாருடைய மகன்?” என்று கேட்டான். அதற்கு அப்னேர், “அரசே, உமது உயிர்மேல் ஆணையாக[a], எனக்குத் தெரியாது” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: நேரடியாக, “உமது உயிர் வாழ்வதுபோல.” இது “நீர் உயிரோடிருப்பது எவ்வளவு உறுதியோ அவ்வளவு உறுதியாக” என்ற பொருளுடைய எபிரேய ஆணைமொழி.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כִ/רְאוֹת
  choice: கண்டபோது
  rationale: இணைப்புச் சொல்லுடன் வரும் வினையெச்ச வடிவம் காலத்தைக் குறிக்கும் துணைவாக்கியத்தை அறிமுகப்படுத்துகிறது; ‘கண்டபோது’ என்பது இயல்பான நவீனத் தமிழ்.
- source_word: יֹצֵא לִ/קְרַאת
  choice: எதிர்கொள்ளப் புறப்பட்டுச் செல்வதை
  rationale: יֹצֵא வெளிநோக்கிய இயக்கத்தையும், לִקְרַאת ஒருவரைச் சந்திக்க அல்லது எதிர்கொள்ளச் செல்வதையும் குறிக்கின்றன. போர்ச் சூழலில் ‘எதிர்கொள்ள’ பொருத்தமானது; அதேவேளை மூலத்தில் இல்லாத ‘போரிட’ என்ற கருத்தைச் சேர்ப்பதில்லை.
- source_word: הַ/פְּלִשְׁתִּי
  choice: அந்தப் பெலிஸ்தியனை
  rationale: எபிரேயத்தில் இனப்பெயர் ஒருமையில் சுட்டுடனுள்ளது. சூழலில் முன்பே அறிமுகமான நபரைத் தமிழில் இயல்பாகச் சுட்ட ‘அந்த’ பயன்படுத்தப்பட்டது; மூலத்தில் இல்லாத ‘வீரன்’ அல்லது ‘மாவீரன்’ சேர்க்கப்படவில்லை.
- source_word: שַׂר הַ/צָּבָא
  choice: படைத்தலைவன்
  rationale: இது இராணுவத்தின் தலைமைப் பதவியைக் குறிக்கிறது. ‘படைத்தலைவன்’ சுருக்கமான, தெளிவான நவீனத் தமிழ்.
- source_word: בֶּן מִי זֶה הַ/נַּעַר
  choice: இந்த இளைஞன் யாருடைய மகன்?
  rationale: சொல்லமைப்பின் பொருள் ‘இந்த இளைஞன் யாருடைய மகன்?’ என்பதே. נַעַר இங்கு போருக்குச் செல்லும் இளவயதினரைக் குறிப்பதால் ‘சிறுவன்’ என்பதைவிட ‘இளைஞன்’ ஏற்றது.
- source_word: חֵי נַפְשְׁ/ךָ
  choice: உமது உயிர்மேல் ஆணையாக
  rationale: இது முகவரின் உயிரை முன்வைக்கும் எபிரேய ஆணைமொழி. தமிழில் புரியத்தக்க ஆணைமொழியாக மொழிபெயர்க்கப்பட்டது; அதன் நேரடியான உருவகம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: אִם יָדָעְתִּי
  choice: எனக்குத் தெரியாது
  rationale: ஆணைமொழிச் சூழலில் אִם எதிர்மறை உறுதிப்பாட்டை மறைமுகமாக வெளிப்படுத்துகிறது. ‘எனக்குத் தெரியாது’ அதன் பொருளை இயல்பாகத் தருகிறது; ‘எனக்குத் தெரிந்தால்’ என்று சொற்சொல்லாக மொழிபெயர்ப்பது தமிழில் முழுமையற்றதாக இருக்கும்.
