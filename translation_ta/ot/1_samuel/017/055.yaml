  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் வரலாற்றுக் கதையாடலுக்குரிய கண்ணியத்துடனும் மொழிபெயர்க்கப்பட்டது. அரசனை நோக்கிய மரியாதைப் பன்மையை ‘உமது’ என்பதால் காத்துள்ளது.
