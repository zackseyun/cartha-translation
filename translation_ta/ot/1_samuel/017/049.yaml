base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/049.yaml
  text: Then David reached his hand into the bag[a], took a stone from there, slung it, and struck the Philistine on his forehead. The stone sank into his forehead[c][b], and he fell on his face to the ground.
translation:
  language: ta
  text: பின்பு தாவீது தன் கையைப் பைக்குள் விட்டு, அங்கிருந்து ஒரு கல்லை எடுத்து, கவணால் எறிந்து, பெலிஸ்தியனின் நெற்றியில் அடித்தான். அந்தக் கல் அவனுடைய நெற்றிக்குள் பதிந்தது[b]; அவன் முகங்குப்புறத் தரையில் விழுந்தான்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: அல்லது, ‘அந்தக் கல் அவனுடைய நெற்றிக்குள் புதைந்தது.’
    reason: lexical_alternative
  - marker: c
    text: எபிரெயத்தில், ‘அவன் தன் முகத்தின்மேல், தரையை நோக்கி விழுந்தான்.’
    reason: literal_rendering
lexical_decisions:
- source_word: וַיִּשְׁלַח ... אֶת־יָדוֹ אֶל־הַכֶּלִי
  choice: தன் கையைப் பைக்குள் விட்டு
  rationale: எபிரெயச் சொற்றொடர் நேரடியாக ‘தன் கையை அந்தக் கலன்/பொருளை நோக்கி நீட்டினான்’ என்றாலும், சூழலில் கற்கள் வைக்கப்பட்டிருந்த பைக்குள் கையை விடுவதையே குறிக்கிறது. இத்தமிழாக்கம் இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: הַכֶּלִי
  choice: பை
  rationale: כְּלִי என்பது கலன், கருவி, பொருள், உடைமை போன்ற பரந்த பொருளுடைய சொல். இங்கு கற்களை வைத்திருந்த கொள்கலனைக் குறிப்பதால் ‘பை’ என்பது சூழலுக்கு ஏற்ற பொதுவான சொல்; மூலச்சொல்லின் பரந்த தன்மை அடிக்குறிப்பில் காக்கப்படுகிறது.
- source_word: אֶבֶן
  choice: ஒரு கல்
  rationale: எறிகவணில் பயன்படுத்தப்பட்ட தனிப்பட்ட கல்லை எளிமையாகவும் துல்லியமாகவும் குறிக்கிறது.
- source_word: וַיְקַלַּע
  choice: கவணால் எறிந்து
  rationale: இந்த வினை கவணைப் பயன்படுத்தி எறிதலைக் குறிக்கிறது. தமிழில் கருவியை வெளிப்படையாகச் சொல்வது செயலைத் தெளிவாக்குகிறது; தேவையற்ற விவரம் சேர்க்கப்படவில்லை.
- source_word: וַיַּךְ אֶת־הַפְּלִשְׁתִּי אֶל־מִצְחוֹ
  choice: பெலிஸ்தியனின் நெற்றியில் அடித்தான்
  rationale: אֶל இங்கு தாக்கிய இடத்தைக் குறிக்கிறது. ‘நெற்றியில் அடித்தான்’ என்பது இயல்பான தமிழாகவும் மூலத்தின் பொருளுக்கு நெருக்கமாகவும் உள்ளது.
- source_word: וַתִּטְבַּע הָאֶבֶן בְּמִצְחוֹ
  choice: அந்தக் கல் அவனுடைய நெற்றிக்குள் புதைந்தது
  rationale: טבע இங்கு கல் உள்ளே சென்று பதிந்ததை அல்லது புதைந்ததைச் சித்தரிக்கிறது. ‘புதைந்தது’ மூலத்தின் உயிரோட்டத்தைக் காக்கிறது; மருத்துவ ரீதியான கூடுதல் விவரத்தைத் திணிக்கவில்லை.
- source_word: וַיִּפֹּל עַל־פָּנָיו אָרְצָה
  choice: அவன் முகங்குப்புறத் தரையில் விழுந்தான்
  rationale: ‘தன் முகத்தின்மேல் தரையை நோக்கி விழுந்தான்’ என்ற எபிரெய உருவகத்தை இயல்பான நவீன தமிழில் சுருக்கமாகவும் துல்லியமாகவும் தெரிவிக்கிறது.
