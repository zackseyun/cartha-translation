  text: וַ/יִּשְׁמַ֤ע אֱלִיאָב֙ אָחִ֣י/ו הַ/גָּד֔וֹל בְּ/דַבְּר֖/וֹ אֶל הָ/אֲנָשִׁ֑ים וַ/יִּֽחַר אַף֩ אֱלִיאָ֨ב בְּ/דָוִ֜ד וַ/יֹּ֣אמֶר לָ/מָּה זֶּ֣ה יָרַ֗דְתָּ וְ/עַל מִ֨י נָטַ֜שְׁתָּ מְעַ֨ט הַ/צֹּ֤אן הָ/הֵ֨נָּה֙ בַּ/מִּדְבָּ֔ר אֲנִ֧י יָדַ֣עְתִּי אֶת זְדֹנְ/ךָ֗ וְ/אֵת֙ רֹ֣עַ לְבָבֶ֔/ךָ כִּ֗י לְמַ֛עַן רְא֥וֹת הַ/מִּלְחָמָ֖ה יָרָֽדְתָּ־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/028.yaml
  text: Eliab his oldest brother heard him speaking to the men[a], and Eliab’s anger burned against David, and he said, “Why have you come down here? And with whom have you left those few sheep in the wilderness? I know your presumption and the evil of your heart[b], for you have come down to see the battle.”
translation:
  language: ta
  text: தாவீது அந்த ஆண்களிடம் பேசிக்கொண்டிருந்ததை அவனுடைய மூத்த சகோதரன் எலியாப் கேட்டான். அப்போது எலியாபின் கோபம் தாவீதின் மேல் பற்றியெரிந்தது. அவன், “நீ எதற்காக இங்கே இறங்கி வந்தாய்? வனாந்தரத்தில் இருக்கும் அந்தச் சில ஆடுகளை யாரிடம் விட்டுவிட்டு வந்தாய்? உன் அகந்தையையும் உன் இதயத்தின் தீமையையும்[a] நான் அறிவேன். போரைப் பார்ப்பதற்காக நீ இறங்கி வந்தாய்” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “உன் இதயத்தின் பொல்லாப்பையும்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּ/דַבְּר֖/וֹ אֶל הָ/אֲנָשִׁ֑ים
  choice: தாவீது அந்த ஆண்களிடம் பேசிக்கொண்டிருந்ததை
  rationale: ב prefixed infinitive construct expresses concurrent action; the Tamil progressive verbal noun naturally conveys Eliab hearing David while he was speaking. ஆண்கள் retains the source's general term rather than specifying soldiers.
- source_word: וַ/יִּֽחַר אַף
  choice: கோபம் பற்றியெரிந்தது
  rationale: This preserves the Hebrew image of burning anger in a natural, vivid Tamil idiom.
- source_word: לָ/מָּה זֶּ֣ה יָרַ֗דְתָּ
  choice: நீ எதற்காக இங்கே இறங்கி வந்தாய்?
  rationale: இங்கே reflects the demonstrative force of זֶה, while இறங்கி வந்தாய் preserves ירד and the viewpoint at Eliab's location.
- source_word: וְ/עַל מִ֨י נָטַ֜שְׁתָּ
  choice: யாரிடம் விட்டுவிட்டு வந்தாய்?
  rationale: This gives the practical contextual sense of leaving the flock in another person's care without strengthening the verb to total abandonment.
- source_word: מְעַ֨ט הַ/צֹּ֤אן הָ/הֵ֨נָּה֙
  choice: அந்தச் சில ஆடுகளை
  rationale: சில conveys fewness and அந்த reflects the feminine plural demonstrative, preserving Eliab's dismissive tone.
- source_word: בַּ/מִּדְבָּ֔ר
  choice: வனாந்தரத்தில்
  rationale: A standard dignified Tamil equivalent for uncultivated wilderness or grazing country in the biblical setting.
- source_word: זְדֹנְ/ךָ֗
  choice: உன் அகந்தையை
  rationale: זָדוֹן can denote presumption, pride, arrogance, or insolence. அகந்தை is natural modern Tamil and conveys Eliab's accusation of arrogant self-assertion.
- source_word: רֹ֣עַ לְבָבֶ֔/ךָ
  choice: உன் இதயத்தின் தீமையை
  rationale: A close and idiomatic rendering that locates moral evil in the inner person without narrowing it to malice.
- source_word: לְמַ֛עַן רְא֥וֹת הַ/מִּלְחָמָ֖ה
  choice: போரைப் பார்ப்பதற்காகத்தானே
  rationale: பார்ப்பதற்காக expresses purpose. The Tamil emphatic interrogative தானே naturally conveys Eliab's accusatory assertion without adding the stronger idea 'merely to watch.'
