base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/032.yaml
  text: And David said to Saul[a], “Let no man's heart fail because of him[b]. Your servant will go and fight with this Philistine.”
translation:
  language: ta
  text: தாவீது சவுலிடம், “அவனால் யாரும் மனம் தளர வேண்டாம்.[a] உமது அடியான் போய் இந்தப் பெலிஸ்தியனோடு போரிடுவேன்” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இந்தப் பெலிஸ்தியனால் யாரும் மனம் தளர வேண்டாம்.” எபிரெய மூலத்தில் “அவனால்” என்று உள்ளது; அது யாரைக் குறிக்கிறது என்பது சூழலிலிருந்து அறியப்படுகிறது. “மனம் தளர” என்பதற்கான எபிரெய மரபுத்தொடர் சொல்லுக்குச் சொல் “ஒரு மனிதனின் இதயம் விழ” என்பதாகும்.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמֶר דָּוִד אֶל שָׁאוּל
  choice: தாவீது சவுலிடம் ... என்றான்
  rationale: வாவ் தொடர்வினை கதைநடையை முன்னெடுக்கிறது. தமிழில் இயல்பான உரையாடல் அமைப்புக்கேற்ப பேச்சின் முடிவில் ‘என்றான்’ வைக்கப்பட்டுள்ளது.
- source_word: אַל יִפֹּל לֵב אָדָם
  choice: யாரும் மனம் தளர வேண்டாம்
  rationale: ‘ஒரு மனிதனின் இதயம் விழாதிருக்கட்டும்’ என்ற எபிரெய உருவகத்தின் பொருளை, நவீனத் தமிழில் இயல்பாகவும் தெளிவாகவும் ‘மனம் தளர வேண்டாம்’ எனத் தருகிறது. אָדָם இங்கு பொதுப்பொருளில் வருவதால் ‘யாரும்’ பொருத்தமானது.
- source_word: עָלָיו
  choice: அவனைப் பார்த்து
  rationale: சூழலில் இப்பெயர்ச்சுட்டு கோலியாத்தை, அதாவது அந்தப் பெலிஸ்தியனை, குறிக்கிறது. அச்சம் அல்லது மனத்தளர்ச்சிக்கான காரணத்தைத் தமிழில் இயல்பாக வெளிப்படுத்த ‘அவனைப் பார்த்து’ பயன்படுத்தப்பட்டுள்ளது; பெயர்ச்சுட்டின் சூழல்சார் தன்மை காக்கப்படுகிறது.
- source_word: עַבְדְּךָ
  choice: உமது அடியான்
  rationale: அரசனிடம் தன்னைத் தாழ்த்திக் குறிப்பிடும் அரசவைக் கூற்று இது. ‘உமது அடியான்’ அந்த மரியாதை மற்றும் தாழ்மையை இயல்பான, கண்ணியமான தமிழில் காக்கிறது.
- source_word: יֵלֵךְ
  choice: போய்
  rationale: இங்கு முற்றுப்பெறாத வினை தாவீதின் உறுதியான நோக்கத்தை வெளிப்படுத்துகிறது. அடுத்த வினையோடு இணைந்து தமிழில் ‘போய் ... போரிடுவேன்’ என இயல்பாக அமைகிறது.
- source_word: וְנִלְחַם
  choice: போரிடுவேன்
  rationale: இவ்வினை இங்கு தாவீதின் தீர்மானத்தை குறிக்கிறது; முதல் நபர் ஒருமை எதிர்கால வடிவம் தமிழில் அதைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: עִם הַפְּלִשְׁתִּי הַזֶּה
  choice: இந்தப் பெலிஸ்தியனோடு
  rationale: עִם என்பதன் அடிப்படைப் பொருளான ‘உடன்/ஓடு’ என்பதைக் காத்து, போர்ச் சூழலில் எதிரியுடன் மோதுவதைத் தமிழில் இயல்பாகத் தெரிவிக்கிறது.
