translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. சவுலை நோக்கிய மரியாதையை ‘உமது’ என்றும், அரசவைக்குரிய தாழ்மையான சுயகுறிப்பை ‘அடியான்’ என்றும் வழங்குகிறது. எபிரெய மரபுத்தொடர் வாசகருக்குத் தெளிவாக ‘மனம் தளர’ என மொழிபெயர்க்கப்பட்டு, அதன் சொல்லடியான உருவகம் அடிக்குறிப்பில் பதிவு செய்யப்பட்டுள்ளது.
