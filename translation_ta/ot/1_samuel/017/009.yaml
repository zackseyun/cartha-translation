translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் வகையிலும் உரையின் சவால் நிறைந்த, மரியாதையான தொனியையும் இணைநிலை வாக்கிய அமைப்பையும் காக்கும் வகையிலும் மொழியாக்கம் செய்யப்பட்டது. ‘வீழ்த்த’ மற்றும் ‘வெல்ல வல்லவன்’ ஆகியவை எபிரெய உரையின் பொருள் விரிவை முற்றிலும் சுருக்காமல் வைத்திருக்கின்றன.
