base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/009.yaml
  text: If he is able to fight with me and strike me down[a], then we will be your servants. But if I prevail against him and strike him down[c][b], then you will be our servants and serve us.
translation:
  language: ta
  text: அவன் என்னோடு போரிட்டு என்னை வீழ்த்த[a] முடிந்தால், நாங்கள் உங்களுக்கு அடிமைகளாவோம்[b]. ஆனால் நான் அவனை வென்று[c], அவனை வீழ்த்தினால், நீங்கள் எங்களுக்கு அடிமைகளாகி எங்களுக்குப் பணிசெய்வீர்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “வீழ்த்த” என்பதற்கான எபிரெய வினைச்சொல் இரு இடங்களிலும் சூழலுக்கேற்ப “அடித்துக் கொல்” அல்லது “தோற்கடி” என்றும் மொழிபெயர்க்கப்படலாம்.
    reason: lexical_alternative
  - marker: b
    text: “அடிமைகள்” என்பதற்குப் பதிலாக “பணியாட்கள்” என்றும் மொழிபெயர்க்கலாம்; ஆனால் இங்கு போருக்குப் பிந்தைய ஒரு மக்களின் கட்டாயக் கீழ்ப்படிதல் குறிக்கப்படுகிறது.
    reason: lexical_alternative
  - marker: c
    text: “அவனை வென்று” என்பதற்கான எபிரெயச் சொல் இன்னும் சொல்லுக்குச் சொல்லாக “அவனுக்கு எதிராக என்னால் முடிந்தால்” எனக் கூறப்படலாம்; போர்ச் சூழலில் இது அவனை மேற்கொண்டு வெல்லுதலைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: יוּכַל לְהִלָּחֵם אִתִּי
  choice: என்னோடு போரிட்டு ... வல்லவனானால்
  rationale: יכל திறன் அல்லது ஆற்றலைக் குறிக்கிறது; לחם என்பதன் நிபால் வடிவமும் אִתִּי என்பதும் நேருக்கு நேர் பரஸ்பரப் போரைக் காட்டுகின்றன. தமிழில் இயல்பான நிபந்தனை வாக்கியமாக அமைக்கப்பட்டது.
- source_word: וְהִכָּנִי / וְהִכִּיתִיו
  choice: என்னை வீழ்த்த / அவனை வீழ்த்த
  rationale: נכה என்பது அடித்தல், வீழ்த்துதல், சூழலின்படி கொல்லுதல் ஆகிய பொருள்களைக் கொள்ளலாம். இங்கு சண்டையின் தீர்மானமான முடிவைக் காட்டவும், ‘கொல்லுதல்’ என்று தேவைக்கு மேல் குறிப்பாக்காமல் இருக்கவும் ‘வீழ்த்த’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: עֲבָדִים
  choice: அடிமைகள்
  rationale: ஒரு மக்கள் மற்றொரு மக்களுக்குப் போரின் விளைவாகக் கட்டுப்பட்டுப் பணியாற்றும் நிலை இங்கு பேசப்படுவதால், ‘வேலையாட்கள்’ அல்லது ‘ஊழியர்கள்’ என்பதைக் காட்டிலும் ‘அடிமைகள்’ மூலச்சொல்லின் சமூக நிலையைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: אֲנִי אוּכַל לוֹ
  choice: நான் அவனை வெல்ல வல்லவனாகி
  rationale: יכל + ל ஒருவருக்கு எதிராக மேலோங்கும் ஆற்றலைக் குறிக்கலாம். ‘வெல்ல வல்லவன்’ என்பது திறன் என்ற அடிப்படை நுணுக்கத்தையும் போரில் மேலோங்குதல் என்ற சூழல்சார் பொருளையும் இணைத்துப் பாதுகாக்கிறது.
- source_word: וַעֲבַדְתֶּם אֹתָנוּ
  choice: எங்களுக்குப் பணிசெய்வீர்கள்
  rationale: עבד வினைச்சொல் அடிமை அல்லது கீழ்ப்பட்டவர் செய்யும் சேவையைக் குறிக்கிறது. ‘பணிசெய்வீர்கள்’ என்பது முன் வரும் ‘அடிமைகளாகி’ என்பதுடன் இயல்பாக இணைகிறது.
