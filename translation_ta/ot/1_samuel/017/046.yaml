  text: הַ/יּ֣וֹם הַ/זֶּ֡ה יְסַגֶּרְ/ךָ֩ יְהוָ֨ה בְּ/יָדִ֜/י וְ/הִכִּיתִ֗/ךָ וַ/הֲסִרֹתִ֤י אֶת רֹֽאשְׁ/ךָ֙ מֵ/עָלֶ֔י/ךָ וְ/נָ֨תַתִּ֜י פֶּ֣גֶר מַחֲנֵ֤ה פְלִשְׁתִּים֙ הַ/יּ֣וֹם הַ/זֶּ֔ה לְ/ע֥וֹף הַ/שָּׁמַ֖יִם וּ/לְ/חַיַּ֣ת הָ/אָ֑רֶץ וְ/יֵֽדְעוּ֙ כָּל הָ/אָ֔רֶץ כִּ֛י יֵ֥שׁ אֱלֹהִ֖ים לְ/יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/046.yaml
  text: This day Yahweh will deliver you into my hand[a], and I will strike you down and remove your head from you. And this day I will give the corpses of the Philistine camp to the birds of the sky and to the wild animals of the earth, so that all the earth may know that there is a God for Israel.
translation:
  language: ta
  text: இன்றே யாவே உன்னை என் கையில் ஒப்புவிப்பார்; நான் உன்னை வீழ்த்தி, உன் தலையை உன்னிடமிருந்து அகற்றுவேன். இன்றே பெலிஸ்தியப் பாளையத்தின் பிணங்களை வானத்துப் பறவைகளுக்கும் நிலத்தின் காட்டு விலங்குகளுக்கும் கொடுப்பேன். அதனால், இஸ்ரவேலுக்காகக் கடவுள் இருக்கிறார்[a] என்பதை உலகமெங்கும் அறிந்துகொள்வார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இஸ்ரவேலில் கடவுள் இருக்கிறார்.” எபிரெயில் சொல்லர்த்தமாக “இஸ்ரவேலுக்காக” என்று உள்ளது; இது இஸ்ரவேலுடன் கடவுளுக்குள்ள உறவையோ, இஸ்ரவேலின் சார்பில் அவர் இருப்பதையோ குறிக்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: יְסַגֶּרְךָ ... בְּיָדִי
  choice: உன்னை என் கையில் ஒப்புவிப்பார்
  rationale: ஹிஃபில் வடிவம் ஒருவரை மற்றொருவரின் அதிகாரத்திற்குள் ஒப்புவிப்பதைக் குறிக்கிறது; ‘என் கையில்’ என்ற எபிரெய உருவகமும் தமிழில் இயல்பாகத் தக்கவைக்கப்படுகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இது இறைப்பட்டம் அல்ல, தனிப்பெயரைக் குறிக்கும் நான்கெழுத்துத் திருப்பெயர்; அதன் வழக்கமான தமிழ் ஒலிபெயர்ப்பு பயன்படுத்தப்படுகிறது.
- source_word: וְהִכִּיתִךָ
  choice: நான் உன்னை வீழ்த்தி
  rationale: נכה என்பதன் தாக்குதல் சார்ந்த பொருளையும், போர்ச் சூழலில் அதன் உயிர்க்கொல்லும் விளைவையும் தேவையின்றி விரிவாக்காமல் வெளிப்படுத்துகிறது.
- source_word: וַהֲסִרֹתִי אֶת־רֹאשְׁךָ מֵעָלֶיךָ
  choice: உன் தலையை உன்னிடமிருந்து அகற்றுவேன்
  rationale: மூலத்தில் வெளிப்படையான ‘வெட்டுதல்’ வினை இல்லாமல் ‘அகற்றுதல்’ பயன்படுத்தப்பட்டுள்ளதால், அந்தச் சொல் தேர்வை நெருக்கமாகப் பாதுகாக்கிறது.
- source_word: פֶּגֶר מַחֲנֵה פְלִשְׁתִּים
  choice: பெலிஸ்தியப் பாளையத்தின் பிணங்களை
  rationale: ஒருமை வடிவிலுள்ள פֶּגֶר இங்கு கூட்டு அர்த்தத்தில் வருகிறது; சூழலுக்கேற்ற இயல்பான தமிழில் பன்மையாக வழங்கப்பட்டுள்ளது.
- source_word: לְעוֹף הַשָּׁמַיִם וּלְחַיַּת הָאָרֶץ
  choice: வானத்துப் பறவைகளுக்கும் நிலத்தின் காட்டு விலங்குகளுக்கும்
  rationale: இரு எபிரெய இணைச்சொற்றொடர்களின் உருவகத்தையும் சமநிலையையும் தெளிவான நவீன தமிழில் காக்கிறது.
- source_word: וְיֵדְעוּ כָּל־הָאָרֶץ
  choice: அப்போது ... பூமியெங்கும் உள்ளவர்கள் அறிந்துகொள்வார்கள்
  rationale: וְ + குறைநிலை வினையின் விளைவு சார்ந்த ஓட்டத்தை ‘அப்போது’ காட்டுகிறது; ‘பூமியெங்கும் உள்ளவர்கள்’ என்பது உயிரற்ற பூமி அறிவதாகத் தோன்றாமல் எபிரெய உலகளாவிய சொல்லாட்சியை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: יֵשׁ אֱלֹהִים לְיִשְׂרָאֵל
  choice: இஸ்ரவேலுக்காக ஒரு கடவுள் இருக்கிறார்
  rationale: לְ என்ற முன்னிடைச்சொல்லின் ‘இஸ்ரவேலுக்காக/இஸ்ரவேலுக்கு’ என்னும் உறவுப் பொருளை நேரடியாகக் காக்கிறது; இடப்பொருள் வாசிப்பு அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலம் தனிப்பட்ட இறைப்பெயரைப் பயன்படுத்துவதால் அதை ஒரு பட்டத்தால் மாற்றாமல் ஒலிபெயர்க்கிறது; மாற்று உச்சரிப்பை உரைக்குள் திணிக்கவில்லை.
- issue: לְיִשְׂרָאֵל குறிக்கும் உறவு
  choice: இஸ்ரவேலுக்காக ஒரு கடவுள் இருக்கிறார்
  alternative: இஸ்ரவேலில் ஒரு கடவுள் இருக்கிறார்
  rationale: לְ என்பதன் நேரடியான உறவு அல்லது ஆதரவு சார்ந்த பொருளை முதன்மை உரை காக்கிறது. இடப்பொருள் வாசிப்பும் இலக்கணரீதியாக ஏற்கத்தக்கதால் அதை அடிக்குறிப்பில் பாதுகாக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழ்; போர்ச் சொல்லாட்சியின் தீவிரம் மென்மையாக்கப்படவில்லை. அதே நேரத்தில், மூலத்தில் இல்லாத ‘தலையை வெட்டுவேன்’ என்ற வெளிப்படையான வினை சேர்க்கப்படவில்லை. வாக்கிய ஓட்டம் சாதாரண வாசகர்களுக்குத் தெளிவாகவும், வேதாகம வாசிப்புக்கேற்ற கண்ணியத்துடனும் அமைக்கப்பட்டுள்ளது.
