translation_notes:
  register: நவீனத் தரமான, எளிதில் புரியும், கண்ணியமான தமிழ். எபிரெயின் தொடர்ச்சியான செயல்வரிசையும் கையில் இருந்த பொருட்கள் மீதான வலியுறுத்தலும் பாதுகாக்கப்பட்டுள்ளன. ‘பை—சிறு பை’ என்ற சற்றே மீளுரைப்பான அமைப்பு மூலத்தின் כְּלִי/יַלְקוּט இரட்டைச் சொல்லாக்கத்தை மறைக்காமல் தருகிறது.
