base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/040.yaml
  text: He took his staff in his hand and chose for himself five smooth stones from the wadi[a], and put them in the shepherd’s bag that he had, in the pouch; and his sling was in his hand[b]. Then he approached the Philistine.
translation:
  language: ta
  text: அவன் தன் கோலைக் கையில் எடுத்துக்கொண்டு, ஓடையிலிருந்து[a] வழவழப்பான ஐந்து கற்களைத் தனக்காகத் தேர்ந்தெடுத்தான். அவற்றைத் தனக்கிருந்த மேய்ப்பரின் பையில், அதாவது சிறுபையில்[b] வைத்தான். அவனுடைய கவண் அவன் கையில் இருந்தது. பின்பு அவன் அந்தப் பெலிஸ்தியனை அணுகினான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ஓடை” என்பதற்கான எபிரெயச் சொல் נַחַל; இது பருவகால நீரோடை, ஓடைப் படுகை, அல்லது பள்ளத்தாக்கு நீர்வழியையும் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “சிறுபை” என்பதற்கான எபிரெயச் சொல் יַלְקוּט; இது பொருட்களை எடுத்துச் செல்லப் பயன்படும் சிறிய பை, கைப்பை, அல்லது தோள்பையைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַקְלוֹ
  choice: தன் கோலை
  rationale: מַקֵּל என்பது கோல் அல்லது தடி; மேய்ப்புச் சூழலுக்கு இயல்பாகவும் மரியாதையான நடையிலும் ‘கோல்’ பொருந்துகிறது.
- source_word: וַיִּבְחַר לוֹ
  choice: தனக்காகத் தேர்ந்தெடுத்தான்
  rationale: לוֹ தரும் தனக்கெனத் தேர்வு செய்த நுணுக்கத்தை வெளிப்படையாகப் பாதுகாக்கிறது.
- source_word: חֲמִשָּׁה חַלֻּקֵי אֲבָנִים
  choice: வழவழப்பான ஐந்து கற்கள்
  rationale: חַלֻּקֵי கற்களின் தேய்ந்து மிருதுவான தன்மையைக் குறிக்கிறது; ‘வழவழப்பான’ என்பது தமிழில் தெளிவான இயல்பான வருணனை.
- source_word: מִן הַנַּחַל
  choice: ஓடையிலிருந்து
  rationale: נַחַל ஓடை, பருவகால நீரோடை அல்லது அதன் படுகையைக் குறிக்கலாம். முதன்மை உரையில் வாசிக்க எளிய ‘ஓடை’ பயன்படுத்தப்பட்டு, பரந்த பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: בִּכְלִי הָרֹעִים אֲשֶׁר לוֹ וּבַיַּלְקוּט
  choice: தன்னிடமிருந்த மேய்ப்பனின் பையில், அதாவது சிறு பையில்
  rationale: כְּלִי הָרֹעִים என்ற பொதுவான கொள்கலன் சொல்லை ‘மேய்ப்பனின் பை’ என்றும், יַלְקוּט அதனை மேலும் குறிப்பதாக ‘சிறு பை’ என்றும் மொழிபெயர்த்து எபிரெயச் சொல்லடுக்கைப் பாதுகாக்கிறது.
- source_word: וְקַלְּעוֹ בְיָדוֹ
  choice: அவனுடைய கவண் அவன் கையில் இருந்தது
  rationale: எபிரெயில் வினையில்லாத உடைமை/இருப்புக் கூற்றைத் தமிழில் தெளிவாகத் தருகிறது; ‘கவண்’ கல் எறியும் sling கருவிக்கான துல்லியமான தமிழ் சொல்.
- source_word: וַיִּגַּשׁ אֶל הַפְּלִשְׁתִּי
  choice: பின்பு அவன் அந்தப் பெலிஸ்தியனை நோக்கி நெருங்கிச் சென்றான்
  rationale: נגשׁ என்பதன் ‘அணுகுதல், நெருங்குதல்’ என்ற இயக்கத்தையும் தொடரும் கதைநடையையும் இயல்பான தமிழில் தருகிறது.
