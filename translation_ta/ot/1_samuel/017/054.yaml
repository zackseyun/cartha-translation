  text: וַ/יִּקַּ֤ח דָּוִד֙ אֶת רֹ֣אשׁ הַ/פְּלִשְׁתִּ֔י וַ/יְבִאֵ֖/הוּ יְרוּשָׁלִָ֑ם וְ/אֶת כֵּלָ֖י/ו שָׂ֥ם בְּ/אָהֳלֽ/וֹ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/054.yaml
  text: David took the head of the Philistine and brought it to Jerusalem[b][a], and he put his weapons in his tent.
translation:
  language: ta
  text: தாவீது பெலிஸ்தியனின் தலையை எடுத்தான்; அதை எருசலேமுக்குக் கொண்டுவந்தான்[b]. பெலிஸ்தியனுடைய போர்க் கருவிகளை[a]த் தன் கூடாரத்தில் வைத்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அவனுடைய ஆயுதங்கள்,’ ‘அவனுடைய படைக்கலங்கள்,’ அல்லது ‘அவனுடைய உபகரணங்கள்’ என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் ஆயுதங்கள், கவசம், பிற படைக்கலப் பொருட்கள் ஆகியவற்றை உள்ளடக்கக்கூடிய விரிவான பொருளுடையது.
    reason: lexical_alternative
  - marker: b
    text: இந்தக் கதை நிகழும் கட்டத்தில் எருசலேம் இன்னும் முழுமையாக இஸ்ரவேலரின் கட்டுப்பாட்டில் இல்லை என்பதால், ‘எருசலேமுக்குக் கொண்டுவந்தான்’ என்பதில் காலவரிசைச் சிக்கல் இருப்பதாகச் சில வாசகர்கள் கருதுகின்றனர். அதை ஒத்திசைக்காமல் எபிரெய வாசகமே இங்கு பாதுகாக்கப்பட்டுள்ளது.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּקַּח
  choice: எடுத்துக்கொண்டு
  rationale: לקח என்பதன் இயல்பான கதைநடைப் பொருள் ‘எடுத்தல்’; அடுத்த செயலைத் தமிழில் இயல்பாக இணைக்க ‘எடுத்துக்கொண்டு’ என வழங்கப்பட்டது.
- source_word: רֹאשׁ
  choice: தலை
  rationale: கோலியாத்தின் மரணத்துக்குப் பிந்தைய நேரடியான உடற்பகுதியையே குறிக்கிறது.
- source_word: הַפְּלִשְׁתִּי
  choice: அந்தப் பெலிஸ்தியன்
  rationale: குறிப்பிட்ட பெலிஸ்தியனான கோலியாத்தைக் குறிக்கும் இனப்பெயர்; தமிழ் கதைநடையில் ‘அந்தப்’ என்பது குறிப்புத்தன்மையை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וַיְבִאֵהוּ
  choice: அதை ... கொண்டுவந்தான்
  rationale: எபிரெய ஆண்பால் ஒருமை பின்னொட்டு, எபிரெயத்தில் ஆண்பாலான ‘தலை’ என்ற பெயர்ச்சொல்லைக் குறிக்கிறது; தமிழில் உயிரற்ற துண்டிக்கப்பட்ட தலையை ‘அதை’ எனக் குறிப்பிடுவது இயல்பு.
- source_word: יְרוּשָׁלִָם
  choice: எருசலேம்
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் பரவலாக அறியப்பட்ட இடப்பெயர் வடிவம்.
- source_word: כֵּלָיו
  choice: அவனுடைய போர்க் கருவிகள்
  rationale: כְּלִי என்பது ஆயுதங்கள், கவசம் மற்றும் பிற படைக்கலப் பொருட்களையும் உள்ளடக்கக்கூடிய விரிவான சொல். போர்ச் சூழலைத் தக்கவைத்தபடி ‘போர்க் கருவிகள்’ அந்த அகலப் பொருளை ஓரளவு பாதுகாக்கிறது; ‘அவனுடைய’ என்பது பெலிஸ்தியனைக் குறிக்கிறது.
- source_word: שָׂם
  choice: வைத்தான்
  rationale: ஒரு பொருளை ஓர் இடத்தில் வைப்பதைக் குறிக்கும் எளிய வினை; நவீன தமிழில் இயல்பான வடிவம்.
- source_word: בְּאָהֳלוֹ
  choice: தன் கூடாரத்தில்
  rationale: אָהֶל என்பதற்கு ‘கூடாரம்’ நேரடியான பொருள். சூழலின்படி பின்னொட்டு தாவீதைக் குறிக்கும் வாசிப்பைத் தமிழின் தற்சுட்டுப் பெயரான ‘தன்’ தெளிவாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: இறுதி வாக்கியத்திலுள்ள உடைமைப் பின்னொட்டுகளின் சுட்டுப்பொருள்
  choice: போர்க் கருவிகள் பெலிஸ்தியனுடையவை; கூடாரம் தாவீதுடையது.
  alternative: இரண்டும் தாவீதுடையவை; அல்லது கூடாரம் பொதுவான படை முகாம் கூடாரத்தைக் குறிக்கலாம்.
  rationale: உடனடிச் சூழல் தாவீது கோலியாத்திடமிருந்து வெற்றிச் சின்னங்களை எடுத்துக்கொள்வதைப் பற்றியது. ஆகவே கருவிகள் பெலிஸ்தியனுடையவை என்றும், அவை வைக்கப்பட்ட கூடாரம் தாவீதுடையது என்றும் வாசிப்பது மிக இயல்பானது.
- issue: எருசலேமைப் பற்றிய தோற்றகால வரிசைச் சிக்கல்
  choice: ‘எருசலேமுக்குக் கொண்டுவந்தான்’ என்று எபிரெய வாசகத்தை நேரடியாகப் பாதுகாத்தல்.
  alternative: ‘பின்னர் எருசலேமுக்குக் கொண்டுவருவான்’ அல்லது ‘எருசலேமை நோக்கிக் கொண்டுவந்தான்’ என்று ஒத்திசைத்தல்.
  rationale: எபிரெய கதைநடை செயலை நேரடியாகக் கூறுகிறது. வரலாற்று அல்லது இலக்கியக் காலவரிசைச் சிக்கலை மொழிபெயர்ப்பிலேயே தீர்க்காமல், மூலத்தின் பதற்றத்தைப் பாதுகாக்க வேண்டும்.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் தமிழ். எபிரெய இணைப்புகளைத் தமிழில் இயல்பான இரு வாக்கியங்களாக வழங்கினாலும் செயல்வரிசை மாற்றப்படவில்லை. அடிக்குறி குறியீடுகள் தத்தம் சொற்றொடர்களின் உடனடிப் பின்னர் வைக்கப்பட்டுள்ளன.
