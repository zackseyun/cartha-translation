- from: தாவீது அந்தப் பெலிஸ்தியனின் தலையை எடுத்துக்கொண்டு, அதை எருசலேமுக்குக் கொண்டுவந்தான்[b]. அவனுடைய போர்க் கருவிகளை[a]த் தன் கூடாரத்தில் வைத்தான்.
  to: தாவீது பெலிஸ்தியனின் தலையை எடுத்தான்; அதை எருசலேமுக்குக் கொண்டுவந்தான்[b]. பெலிஸ்தியனுடைய போர்க் கருவிகளை[a]த் தன் கூடாரத்தில் வைத்தான்.
  rationale: The revision makes the two principal Hebrew narrative verbs explicit and removes a potentially misleading Tamil possessive antecedent. It retains the translation's contextual reading that the equipment belongs to the Philistine and the tent to David, while preserving the Hebrew's direct statement concerning Jerusalem and retaining both correctly anchored footnotes.
