  register: நவீனத் தரத் தமிழில், படைவீரர்களிடையே பரவும் நேரடி உரையாடலின் ஓட்டத்தையும் அரசர் அறிவித்த வெகுமதிகளின் கண்ணியமான தொனியையும் காக்கும் வகையில் மொழிபெயர்க்கப்பட்டுள்ளது. மூலத்தின் தொடர்ச்சியான ‘மேலே வருதல்’ இருமுறையும் பாதுகாக்கப்பட்டுள்ளது.
