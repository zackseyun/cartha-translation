  text: וַ/יֹּ֣אמֶר אִ֣ישׁ יִשְׂרָאֵ֗ל הַ/רְּאִיתֶם֙ הָ/אִ֤ישׁ הָֽ/עֹלֶה֙ הַ/זֶּ֔ה כִּ֛י לְ/חָרֵ֥ף אֶת יִשְׂרָאֵ֖ל עֹלֶ֑ה וְֽ֠/הָיָה הָ/אִ֨ישׁ אֲשֶׁר יַכֶּ֜/נּוּ יַעְשְׁרֶ֥/נּוּ הַ/מֶּ֣לֶךְ עֹ֣שֶׁר גָּד֗וֹל וְ/אֶת בִּתּ/וֹ֙ יִתֶּן ל֔/וֹ וְ/אֵת֙ בֵּ֣ית אָבִ֔י/ו יַעֲשֶׂ֥ה חָפְשִׁ֖י בְּ/יִשְׂרָאֵֽל׀־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/025.yaml
  text: And the men of Israel said[a], “Have you seen this man who is coming up? Surely he is coming up to defy Israel. And it shall be that the man who strikes him down, the king will enrich him with great riches, and will give him his daughter, and will make his father’s house free in Israel.”
translation:
  language: ta
  text: இஸ்ரவேலர், “மேலே வந்துகொண்டிருக்கிற இந்த மனிதனைப் பார்த்தீர்களா? இஸ்ரவேலை இகழ்வதற்காகவே அவன் மேலே வருகிறான். அவனை வீழ்த்துகிறவனை அரசர் மிகுந்த செல்வந்தனாக்கி, தன் மகளை அவனுக்குக் கொடுத்து, இஸ்ரவேலில் அவனுடைய தந்தையின் குடும்பத்தைச் சுதந்திரமானதாக ஆக்குவார்[a]” என்று சொன்னார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இஸ்ரவேலில் அவனுடைய தந்தையின் குடும்பத்துக்கு விலக்கு அளிப்பார்.” இது வரி அல்லது அரசருக்குச் செய்ய வேண்டிய பிற சேவைக் கடமைகளிலிருந்து விலக்கு அளிப்பதைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ יִשְׂרָאֵל
  choice: இஸ்ரவேல் வீரர்கள்
  rationale: இலக்கணத்தில் ஒருமையாக இருந்தாலும், சூழலில் இஸ்ரவேல் படைவீரர்களின் பொதுவான உரையாடலைக் குறிக்கிறது. ‘வீரர்கள்’ என்பது சூழலை இயல்பாகத் தெளிவுபடுத்துகிறது.
- source_word: הַרְּאִיתֶם
  choice: பார்த்தீர்களா?
  rationale: இரண்டாம் நபர் ஆண்பால் பன்மை வினாவை இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: הָאִישׁ הָעֹלֶה הַזֶּה
  choice: மேலே வந்துகொண்டிருக்கிற இந்த மனிதனை
  rationale: עֹלֶה என்ற நிகழ்காலப் பங்கேற்பு வடிவத்தின் தொடரும் செயலைப் பாதுகாக்கிறது.
- source_word: כִּי
  choice: -வே
  rationale: இங்கு காரணத்தைக் காட்டுவதைவிட உறுதியும் வலியுறுத்தலும் மேலோங்குகின்றன; தமிழின் ‘வே’ அதனை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: לְחָרֵף
  choice: பழித்துப் பேசுவதற்காக
  rationale: חרף என்பதிலுள்ள பகிரங்க இகழ்ச்சி, நிந்தனை, சவால் ஆகிய நுணுக்கங்களைச் சுருக்காமல் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: יַכֶּנּוּ
  choice: அவனை வீழ்த்துகிறவனை
  rationale: נכה என்பதற்கு அடித்தல், வீழ்த்துதல், கொல்லுதல் ஆகிய பொருள்கள் இருக்கலாம். ‘வீழ்த்துதல்’ தீர்மானமான வெற்றியைச் சொல்கிறது; ‘கொல்லுதல்’ என்று தேவைக்கு மீறித் துல்லியப்படுத்தவில்லை.
- source_word: יַעְשְׁרֶנּוּ ... עֹשֶׁר גָּדוֹל
  choice: மிகுந்த செல்வந்தனாக்கி
  rationale: வினைச்சொல்லும் அதனுடன் தொடர்புடைய பெயர்ச்சொல்லும் தரும் தீவிரத்தை இயல்பான தமிழில் பாதுகாக்கிறது.
- source_word: בֵּית אָבִיו
  choice: அவனுடைய தந்தையின் குடும்பத்துக்கு
  rationale: ‘தந்தையின் வீடு’ என்ற சொல்லுக்குச் சொல் வடிவத்தைவிட, விரிந்த தந்தைவழிக் குடும்பம் அல்லது குடும்பத்தார் என்ற பொருளை நவீனத் தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: יַעֲשֶׂה חָפְשִׁי בְּיִשְׂרָאֵל
  choice: இஸ்ரவேலில் ... விலக்கு அளிப்பார்
  rationale: חָפְשִׁי இங்கு அரச வரி அல்லது சேவைக் கடமைகளிலிருந்து விடுதலை/விலக்கைக் குறிக்க வாய்ப்புள்ளது. ‘விலக்கு’ நிர்வாகப் பொருளை இயல்பாகத் தருகிறது; அதன் உறுதியற்ற தன்மை அடிக்குறிப்பில் குறிப்பிடப்படுகிறது.
