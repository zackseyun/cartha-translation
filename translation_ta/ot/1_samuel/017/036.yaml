base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/036.yaml
  text: Your servant struck down both the lion and the bear[a], and this uncircumcised Philistine will be like one of them, because he has defied the battle lines of the living God.
translation:
  language: ta
  text: உமது அடியான் சிங்கத்தையும் கரடியையும் அடித்து வீழ்த்தினான். விருத்தசேதனம் செய்யப்படாத இந்தப் பெலிஸ்தியனும் அவற்றில் ஒன்றைப் போலவே ஆவான்; ஏனெனில் அவன் உயிருள்ள கடவுளின் போர்வரிசைகளை[a] நிந்தித்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘உயிருள்ள கடவுளின் படைகளை.’ எபிரெயச் சொல் ‘போர்வரிசைகள்,’ ‘அணிவகுப்புகள்,’ அல்லது விரிவான பொருளில் ‘படைகள்’ எனப் பொருள்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִכָּה
  choice: அடித்து வீழ்த்தினான்
  rationale: נכה என்பது அடித்தல் அல்லது அடித்து வீழ்த்துதல் எனப் பொருள்படும். கொடிய விலங்குகளைத் தாவீது வென்ற சூழலை இது தெளிவாகக் காட்டுகிறது; ஆனால் வினைச்சொல்லிலேயே வெளிப்படையாக இல்லாத ‘கொன்றான்’ என்ற குறுகிய பொருளைத் திணிக்கவில்லை.
- source_word: עַבְדֶּךָ
  choice: உமது அடியான்
  rationale: சவுலிடம் மரியாதையுடன் தன்னைக் குறிப்பிடும் வழக்காக இங்கு வருகிறது. ‘அடிமை’ என்பதைவிட ‘அடியான்’ இந்தப் பணிவான நேரடி உரையாடலுக்கு இயல்பானது.
- source_word: הָאֲרִי ... הַדּוֹב
  choice: சிங்கத்தையும் கரடியையும்
  rationale: எபிரெயத்தில் இரு பெயர்ச்சொற்களும் குறிப்புச் சுட்டுடன் வருகின்றன; தாவீது எதிர்கொண்ட அந்த இரு விலங்குகளையும் தமிழ் இயல்புக்கு ஏற்றவாறு குறிப்பிடுகிறது.
- source_word: וְהָיָה
  choice: ஆவான்
  rationale: சூழலில் இது எதிர்கால முடிவைப் பற்றிய தாவீதின் உறுதியைத் தெரிவிக்கிறது.
- source_word: הֶעָרֵל
  choice: விருத்தசேதனம் செய்யப்படாத
  rationale: மூலத்தின் உடல்சார்ந்த உடன்படிக்கை அடையாளத்தை நேரடியாகத் தக்கவைத்து, அதை ‘உடன்படிக்கைக்குப் புறம்பானவன்’ போன்ற விளக்கவுரையாக மாற்றாமல் இருக்கிறது.
- source_word: כְּאַחַד מֵהֶם
  choice: அவற்றில் ஒன்றைப் போல
  rationale: பெலிஸ்தியனின் முடிவைச் சிங்கம், கரடி ஆகியவற்றில் ஒன்றின் முடிவோடு ஒப்பிடும் மூலத்தின் பகிர்ந்தெடுக்கும் ஒருமைப் பொருளைத் தக்கவைக்கிறது.
- source_word: חֵרֵף
  choice: நிந்தித்தான்
  rationale: חרף என்பது பழித்தல், இகழ்தல், நிந்தித்தல் அல்லது எதிர்த்து அவமதித்தல் எனும் கருத்தைக் கொண்டது. கடவுளின் போரணிகளுக்கு எதிரான அவமதிப்பை ‘நிந்தித்தான்’ சுருக்கமாகவும் வலிமையாகவும் தெரிவிக்கிறது.
- source_word: מַעַרְכֹת
  choice: போரணிகள்
  rationale: מערכה என்பதன் பன்மை வடிவம் போருக்கு அணிவகுத்த வரிசைகள் அல்லது அணிகளைக் குறிக்கிறது. ‘படைகள்’ என விரிவுபடுத்தாமல் மூலத்தின் கண்முன் நிற்கும் இராணுவப் படிமத்தை இது காக்கிறது.
- source_word: אֱלֹהִים חַיִּים
  choice: உயிருள்ள கடவுள்
  rationale: சிலைத் தெய்வங்களுக்கு மாறாக உண்மையாக வாழ்ந்து செயல்படும் கடவுளை வலியுறுத்தும் வழக்கமான எபிரெயச் சொற்றொடரை இயல்பாகத் தருகிறது.
theological_decisions:
- issue: கோலியாத்தை ‘விருத்தசேதனம் செய்யப்படாதவன்’ என்று குறிப்பிடுவதிலுள்ள உடன்படிக்கை சார்ந்த வலிமை
  choice: ‘விருத்தசேதனம் செய்யப்படாத’ என்ற நேரடிச் சொல்லை முதன்மை உரையில் தக்கவைத்தல்
  alternative: ‘உடன்படிக்கைக்குப் புறம்பான’ அல்லது ‘கடவுளற்ற’ பெலிஸ்தியன்
  rationale: மூலம் உடன்படிக்கையின் உடல்சார்ந்த அடையாளத்தையே இகழ்ச்சிக்குரிய எதிர்மறை விளக்கமாகப் பயன்படுத்துகிறது. நேரடி மொழிபெயர்ப்பு அந்த இறையியல் எதிர்மறையைக் விளக்கவுரையால் தீர்த்துவிடாமல் காக்கிறது.
- issue: மַעַרְכֹת என்பது கடவுளோடு தொடர்புபடுத்தப்படும் விதம்
  choice: ‘போரணிகள்’ என்று மொழிபெயர்த்தல்
  alternative: ‘உயிருள்ள கடவுளின் படைகள்’ அல்லது ‘படைவரிசைகள்’
  rationale: இச்சொல் போருக்கு அணிவகுத்த இஸ்ரவேலரின் வரிசைகளைச் சுட்டுகிறது. ‘போரணிகள்’ மூலத்தின் இராணுவப் படிமத்தையும் அவை உயிருள்ள கடவுளுக்குரியவை என்ற உறவையும் தக்கவைக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், மரியாதையான நேரடி உரைக்கேற்ற ‘உமது அடியான்’ பயன்படுத்தப்பட்டுள்ளது. ‘போரணிகள்’ மூலத்தின் இராணுவப் படிமத்தைச் சுருக்கமாகக் காக்கிறது; அதன் மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது. அடிக்குறிப்பு குறியீடு அது விளக்கும் சொல்லுக்குப் பின்னரே வைக்கப்பட்டுள்ளது.
