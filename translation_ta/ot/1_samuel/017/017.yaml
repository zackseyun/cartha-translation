  yaml_path: translation/ot/1_samuel/017/017.yaml
  text: And Jesse said to David his son[a], “Please take to your brothers this ephah of roasted grain and these ten loaves[b], and run to the camp to your brothers.”
translation:
  language: ta
  text: ஈசாய் தன் மகன் தாவீதிடம், “தயவுசெய்து, இந்த ஏப்பா[a] அளவு வறுத்த தானியத்தையும்[b] பத்து அப்பங்களையும் உன் சகோதரர்களிடம் எடுத்துக்கொண்டு, முகாமிலிருக்கும் உன் சகோதரர்களிடம் ஓடிச் செல்” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ஏப்பா என்பது பண்டைய காலத்து உலர் பொருள் அளவை. அது ஏறத்தாழ 22 லிட்டர்.
    reason: cultural_note
  - marker: b
    text: அல்லது, “வாட்டிய தானியம்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: קַח נָא
  choice: தயவுசெய்து … எடுத்துக்கொண்டு
  rationale: கட்டளையை மென்மைப்படுத்தும் נָא என்பதன் மரியாதை கலந்த வேண்டுகோள் தொனியை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: לְאַחֶיךָ
  choice: உன் சகோதரர்களுக்காக / உன் சகோதரர்களிடம்
  rationale: முதல் இடத்தில் பொருளைப் பெறுபவர்களையும், இரண்டாம் இடத்தில் சென்றடைய வேண்டியவர்களையும் சூழலுக்கு ஏற்ற தமிழில் வேறுபடுத்திக் காட்டுகிறது; எபிரெய உரையிலுள்ள இருமுறை கூறுதலும் காக்கப்படுகிறது.
- source_word: אֵיפַת
  choice: ஓர் ஏப்பா அளவு
  rationale: பண்டைய உலர் அளவையான ‘ஏப்பா’வைத் தக்கவைத்து, அது ஓர் அளவைச் சுட்டுகிறது என்பதைத் தமிழ் வாசகருக்கு தெளிவாக்குகிறது.
- source_word: הַקָּלִיא
  choice: வறுத்த தானியம்
  rationale: தீயில் வறுத்து அல்லது வாட்டித் தயாரிக்கப்பட்ட தானியத்தைச் சுட்டும் சொல்லுக்கு தெளிவான நவீனத் தமிழ் இணை.
- source_word: וַעֲשָׂרָה לֶחֶם
  choice: இந்தப் பத்து அப்பங்கள்
  rationale: உணவுப் பொருட்களை அனுப்பும் இச்சூழலில் לֶחֶם என்பதை எண்ணிக்கைக்கேற்ற தனித்தனி அப்பங்களாக இயல்பாக வழங்குகிறது.
- source_word: וְהָרֵץ
  choice: ஓடிச் செல்
  rationale: விரைவாகச் செல்லும்படி கூறும் கட்டளையின் உயிரோட்டத்தையும் அவசரத்தையும் விளக்கவுரை சேர்க்காமல் காக்கிறது.
- source_word: הַמַּחֲנֶה
  choice: முகாம்
  rationale: இராணுவத்தினர் தங்கியுள்ள இடத்தைக் குறிக்கும் இயல்பான, பொதுவாகப் புரியும் தமிழ் சொல்.
- source_word: בְּנוֹ
  choice: தன் மகன்
  rationale: தாவீதுக்கும் ஈசாய்க்கும் உள்ள உறவை எபிரெய மொழியின் இணைப்புப் பெயர்ச்சொல் அமைப்புக்கு ஏற்றவாறு தெளிவாகக் காட்டுகிறது.
