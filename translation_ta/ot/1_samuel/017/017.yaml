translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான உரைநடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் மீளுரையும் ‘ஓடிச் செல்’ என்ற உயிரோட்டமான கட்டளையும் காக்கப்பட்டுள்ளன. வழங்கப்பட்ட ஆங்கில உரையில் அடிக்குறிப்பு குறியீடுகள் அவற்றின் குறிப்புகளுடன் இடமாற்றமாக இருந்ததால், [a] ‘ஏப்பா’விற்குப் பின்னும் [b] ‘வறுத்த தானியம்’ என்பதற்குப் பின்னும் பொருளுக்கு ஏற்ற இடங்களில் அமைக்கப்பட்டுள்ளன.
