  yaml_path: translation/ot/1_samuel/017/056.yaml
  text: And the king said[a], “You, inquire whose son this young man is.”
translation:
  language: ta
  text: அப்போது அரசன், “இந்த இளைஞன் யாருடைய மகன் என்று நீ விசாரி” என்றான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: அப்போது ... என்றான்
  rationale: வாவ் தொடர்வினை கதைநிகழ்வை முன்னெடுத்துச் செல்கிறது; இயல்பான தமிழில் ‘அப்போது’ அந்தத் தொடர்ச்சியை வெளிப்படுத்துகிறது.
- source_word: הַמֶּלֶךְ
  choice: அரசன்
  rationale: எபிரெய உரை சவுலின் பெயரைச் சொல்லாமல் திட்டவட்டமான பட்டத்தையே பயன்படுத்துகிறது; தமிழிலும் அதைப் பேணுகிறது.
- source_word: שְׁאַל
  choice: விசாரி
  rationale: இந்த கட்டளை வினை ‘கேள்’ அல்லது ‘விசாரி’ எனப் பொருள்படலாம்; ஒருவரின் தந்தை யார் என்பதை அறியும்படி கட்டளையிடும் சூழலில் ‘விசாரி’ இயல்பாகவும் மூலத்துக்கு நெருக்கமாகவும் உள்ளது.
- source_word: אַתָּה
  choice: நீ
  rationale: எபிரெயத்தில் தனிப்பட்ட சுட்டுப்பெயர் வெளிப்படையாக வந்து வலியுறுத்துகிறது; தமிழில் ‘நீ’ என்பதைக் குறிப்பிட்டு அந்த வலியுறுத்தல் பேணப்படுகிறது.
- source_word: בֶּן מִי
  choice: யாருடைய மகன்
  rationale: இது தந்தைவழி அடையாளத்தைப் பற்றிக் கேட்கும் எபிரெய மரபுத்தொடர்; ‘யாருடைய மகன்’ என்பது நேரான, இயல்பான தமிழ் இணை.
- source_word: זֶה
  choice: இந்த
  rationale: அருகிலுள்ள அல்லது கண்முன் உள்ள நபரைச் சுட்டும் ஆண்பால் ஒருமைச் சுட்டுச்சொல்லின் பொருள் தமிழில் ‘இந்த’ எனத் தெளிவாக வருகிறது.
- source_word: הָעָלֶם
  choice: இளைஞன்
  rationale: இச்சொல் இளம் ஆணைக் குறிக்கிறது; ‘இளைஞன்’ நவீன, கண்ணியமான, இயல்பான தமிழ்.
