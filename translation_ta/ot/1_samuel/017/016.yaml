base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/016.yaml
  text: The Philistine came forward morning and evening and took his stand for forty days[a].
translation:
  language: ta
  text: அந்தப் பெலிஸ்தியன் நாற்பது நாட்களாகக் காலையிலும் மாலையிலும் முன்வந்து, தன்னை நிலைநிறுத்திக்கொண்டான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நாற்பது நாட்களாக அதிகாலையிலும் மாலையிலும் அணுகிவந்து, தன்னை நிலைநிறுத்திக்கொண்டான்.”
    reason: וַיִּגַּשׁ என்பதற்கான ‘அணுகிவருதல்,’ הַשְׁכֵּם என்பதற்கான ‘அதிகாலை,’ மற்றும் וַיִּתְיַצֵּב என்பதற்கான ‘தன்னை நிலைநிறுத்திக்கொள்ளுதல்’ ஆகிய சொற்சார்ந்த மாற்றுகளை வழங்குகிறது.
lexical_decisions:
- source_word: וַיִּגַּשׁ
  choice: முன்வந்து
  rationale: נגשׁ என்பதன் ‘அணுகுதல்/அருகில் வருதல்’ என்ற பொருளை, இரு படைகளுக்கும் இடையே அவன் சவால்விட முன்வந்த இந்தப் போர்ச் சூழலில் இயல்பாகத் தெரிவிக்கிறது.
- source_word: הַפְּלִשְׁתִּי
  choice: அந்தப் பெலிஸ்தியன்
  rationale: எபிரெய உரை இங்கு கோலியாத்தின் பெயரையோ ‘வீரன்’ என்ற அடைமொழியையோ சேர்க்காமல் ‘அந்தப் பெலிஸ்தியன்’ என்று மட்டுமே குறிப்பிடுகிறது.
- source_word: הַשְׁכֵּם וְהַעֲרֵב
  choice: காலை மாலை
  rationale: ஒவ்வொரு நாளும் இரு வேளைகளிலும் நிகழ்ந்த செயலை நவீனத் தமிழில் இயல்பான இணைச்சொற்றொடராகக் காட்டுகிறது; הַשְׁכֵּם தரும் அதிகாலை நிழற்பொருளை அடிக்குறிப்பில் குறிப்பிடுகிறது.
- source_word: וַיִּתְיַצֵּב
  choice: தன் இடத்தில் நின்றான்
  rationale: יצב என்பதன் ஹித்பயேல் வடிவிலுள்ள தன்னை நிலைநிறுத்திக்கொள்ளுதல் அல்லது குறிப்பிட்ட இடத்தில் நிற்றல் என்ற தற்சார்பு நுணுக்கத்தை இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: אַרְבָּעִים יוֹם
  choice: நாற்பது நாட்கள்
  rationale: மீண்டும் மீண்டும் நடந்த செயலின் காலநீட்சியைத் தமிழில் நேரடியாகவும் இயல்பாகவும் குறிக்கிறது.
