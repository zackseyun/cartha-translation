translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையும் கண்ணியமும் கொண்ட உரை. ‘பெலிஸ்திய வீரன்’ என்று அண்டை வசனத்தின் சொல்லை இறக்குமதி செய்யாமல், மூலத்தின் ‘அந்தப் பெலிஸ்தியன்’ என்பதே பாதுகாக்கப்பட்டது. பிரதான உரையில் இயல்பான ‘காலை மாலை’ பயன்படுத்தப்பட்டு, ‘அதிகாலை’ என்ற நுணுக்கம் அடிக்குறிப்பில் தரப்பட்டது.
