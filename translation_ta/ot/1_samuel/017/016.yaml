revisions:
- from: அந்தப் பெலிஸ்தியன் நாற்பது நாட்கள் காலை மாலை முன்வந்து, தன் இடத்தில் நின்றான்.[a]
  to: அந்தப் பெலிஸ்தியன் நாற்பது நாட்களாகக் காலையிலும் மாலையிலும் முன்வந்து, தன்னை நிலைநிறுத்திக்கொண்டான்.[a]
  rationale: The revision removes the unsupported ‘his place,’ clarifies the repeated duration and temporal setting, and retains the Hebrew’s formal self-positioning nuance without introducing material from neighboring verses. The footnote preserves the legitimate lexical alternatives and is aligned with the revised syntax.
