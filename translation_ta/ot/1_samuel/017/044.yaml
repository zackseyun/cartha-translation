base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/044.yaml
  text: And the Philistine said to David[a], “Come to me[b], and I will give your flesh to the birds of the heavens and to the beasts of the field.”
translation:
  language: ta
  text: அப்போது அந்தப் பெலிஸ்தியன் தாவீதிடம், “என்னிடம் வா; உன் சதையை வானத்துப் பறவைகளுக்கும் வயல்வெளியின் விலங்குகளுக்கும் கொடுப்பேன்” என்றான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַפְּלִשְׁתִּי
  choice: அந்தப் பெலிஸ்தியன்
  rationale: குறிப்பிட்ட கோலியாத்தைக் குறிக்கும் எபிரெயக் குறிப்புச் சுட்டை வெளிப்படுத்துகிறது; இவ்வசனத்தில் இல்லாத ‘வீரன்’ என்ற சொல்லைச் சேர்க்கவில்லை.
- source_word: לְכָה אֵלַי
  choice: என்னிடம் வா
  rationale: சவாலாகப் பயன்படுத்தப்பட்ட நேரடியான கட்டளையை இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: וְאֶתְּנָה
  choice: கொடுப்பேன்
  rationale: முதலாம் நபரின் உறுதியான அச்சுறுத்தலைத் தமிழில் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: בְּשָׂרְךָ
  choice: உன் சதையை
  rationale: ‘உடல்’ என மென்மைப்படுத்தாமல், בשר என்பதன் நேரடியானதும் கொடூரமானதுமான படிமத்தைப் பாதுகாக்கிறது.
- source_word: לְעוֹף הַשָּׁמַיִם
  choice: வானத்துப் பறவைகளுக்கும்
  rationale: עוֹף என்பதற்கு சூழலுக்கேற்ற ‘பறவைகள்’ என்றும், הַשָּׁמַיִם என்பதற்கு இயல்பான ‘வானம்’ என்றும் மொழிபெயர்க்கிறது.
- source_word: וּלְבֶהֱמַת הַשָּׂדֶה
  choice: வயல்வெளி விலங்குகளுக்கும்
  rationale: בְּהֵמָה என்பதன் பொதுவான ‘விலங்குகள்’ என்ற பொருளையும் הַשָּׂדֶה என்பதன் திறந்த வெளி/வயல்வெளி உணர்வையும் பாதுகாக்கிறது.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழ்; நேரடியான, கண்ணியமான கதைநடை. அச்சுறுத்தலின் கடுமை தணிக்கப்படவில்லை. ‘இரையாக’ என்பது ‘சதையைப் பறவைகளுக்கும் விலங்குகளுக்கும் கொடுப்பது’ என்ற தமிழின் இயல்பான பொருளைத் தெளிவாக்கும் சூழல்சார் சேர்க்கை.
