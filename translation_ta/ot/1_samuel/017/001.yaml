base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/001.yaml
  text: The Philistines gathered their armies for battle[a], and they assembled at Socoh, which belongs to Judah, and camped between Socoh and Azekah[b], at Ephes-dammim.
translation:
  language: ta
  text: பெலிஸ்தியர்கள் போருக்காகத் தங்கள் படைகளைத் திரட்டினார்கள்[a]. அவர்கள் யூதாவுக்குச் சொந்தமான சோக்கோவில்[b] ஒன்றுகூடி, சோக்கோவுக்கும் அசெக்காவுக்கும் இடையிலுள்ள எபேஸ்-தம்மீமில் முகாமிட்டார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “தங்கள் முகாம்களை” என்றும் மொழிபெயர்க்கலாம்; இதற்கான எபிரெயச் சொல் இராணுவ முகாம்களையோ படைகளையோ குறிக்கக்கூடும்.
    reason: lexical_alternative
  - marker: b
    text: சோக்கோ யூதாவின் பிரதேசத்திலிருந்த ஒரு பட்டணம்.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּאַסְפוּ
  choice: திரட்டினார்கள்
  rationale: אָסַף என்பதன் ‘சேர்த்தல்/திரட்டுதல்’ என்ற பொருளை, போருக்காகப் படைகளை ஒருங்கிணைக்கும் சூழலில் இயல்பான நவீன தமிழில் தருகிறது.
- source_word: פְלִשְׁתִּים
  choice: பெலிஸ்தியர்கள்
  rationale: இம்மக்கள் இனத்திற்குத் தமிழில் வழக்கிலுள்ள பெயர்ப்பு வடிவம்.
- source_word: מַחֲנֵיהֶם
  choice: தங்கள் படைகளை
  rationale: מַחֲנֶה என்பது ‘முகாம்’ அல்லது ‘படை’ எனப் பொருள்படலாம்; ‘போருக்காகத் திரட்டினார்கள்’ என்ற சூழலில் ‘படைகள்’ இயல்பாக உள்ளது. மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: לַמִּלְחָמָה
  choice: போருக்காக
  rationale: உடனடி இராணுவ மோதலுக்கான ஆயத்தத்தைத் தெளிவாகவும் சுருக்கமாகவும் தெரிவிக்கிறது.
- source_word: וַיֵּאָסְפוּ
  choice: ஒன்றுகூடி
  rationale: முதல் வினையின் பொருளைத் தக்கவைத்தபடியே தமிழில் தேவையற்ற சொல் மறுபடியையும் தொடர்ச்சியான நீண்ட வாக்கியத்தையும் தவிர்க்கிறது.
- source_word: שֹׂכֹה
  choice: சோக்கோ
  rationale: எபிரெய இடப்பெயரின் ஒலியைத் தமிழில் தெளிவாகக் குறிக்கும் எழுத்துப்பெயர்ப்பு.
- source_word: אֲשֶׁר לִיהוּדָה
  choice: யூதாவுக்குச் சொந்தமான
  rationale: லாமேத் கட்டமைப்பிலுள்ள பிரதேசச் சார்பு அல்லது உடைமையை நேரடியாகப் பாதுகாக்கிறது.
- source_word: וַיַּחֲנוּ
  choice: முகாமிட்டார்கள்
  rationale: חנה என்பதன் ‘முகாமிடுதல்’ என்ற இராணுவச் சூழலுக்கேற்ற இயல்பான தமிழ்ப் பொருள்.
- source_word: בֵּין ... וּבֵין
  choice: …க்கும் …க்கும் இடையிலுள்ள
  rationale: இரு இடங்களுக்கு இடையேயான தொடர்பைத் தமிழில் இயல்பாகக் காட்டுகிறது; எபேஸ்-தம்மீமின் இருப்பிடத்துடன் தெளிவாக இணைக்கிறது.
- source_word: עֲזֵקָה
  choice: அசெக்கா
  rationale: எபிரெய இடப்பெயருக்கான தெளிவான தமிழ் எழுத்துப்பெயர்ப்பு.
- source_word: בְּאֶפֶס דַּמִּים
  choice: எபேஸ்-தம்மீமில்
  rationale: சொற்பொருளாக மொழிபெயர்க்காமல் இடப்பெயராகக் கருதி, முகாமிட்ட இடத்தைத் தமிழின் இடவேற்றுமையால் குறிக்கிறது.
