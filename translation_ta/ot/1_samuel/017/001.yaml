translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. எபிரெய உரையில் தனியான ‘இப்போது’ என்ற காலக் குறிச்சொல் இல்லாததால் அது சேர்க்கப்படவில்லை. இடப்பெயர்கள் எழுத்துப்பெயர்க்கப்பட்டுள்ளன; מַחֲנֵיהֶם என்பதிலுள்ள உண்மையான சொற்பொருள் நெகிழ்வு அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
