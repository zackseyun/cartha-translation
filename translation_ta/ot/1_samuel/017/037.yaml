source:
  edition: WLC
  text: וַ/יֹּאמֶר֮ דָּוִד֒ יְהוָ֗ה אֲשֶׁ֨ר הִצִּלַ֜/נִי מִ/יַּ֤ד הָֽ/אֲרִי֙ וּ/מִ/יַּ֣ד הַ/דֹּ֔ב ה֣וּא יַצִּילֵ֔/נִי מִ/יַּ֥ד הַ/פְּלִשְׁתִּ֖י הַ/זֶּ֑ה וַ/יֹּ֨אמֶר שָׁא֤וּל אֶל דָּוִד֙ לֵ֔ךְ וַֽ/יהוָ֖ה יִהְיֶ֥ה עִמָּֽ/ךְס־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/037.yaml
  text: David said[a], “Yahweh, who delivered me from the paw of the lion and from the paw of the bear, he will deliver me from the hand of this Philistine.” Then Saul said to David, “Go, and may Yahweh be with you.”
translation:
  language: ta
  text: தாவீது, “சிங்கத்தின் பிடியிலிருந்தும் கரடியின் பிடியிலிருந்தும் என்னை விடுவித்த யாவே, அவரே இந்தப் பெலிஸ்தியனின் கையிலிருந்தும் என்னை விடுவிப்பார்” என்றான். அப்போது சவுல் தாவீதிடம், “போ; யாவே உன்னோடு இருப்பாராக[a]” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யாவே உன்னோடு இருப்பார்.” எபிரெய வாக்கியத்தை ஓர் ஆசீர்வாதம் அல்லது விருப்பமாகவும், சாதாரண எதிர்காலக் கூற்றாகவும் வாசிக்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய மூலத்தில் வரும் இறைத் திருப்பெயரை ஒரு பட்டப்பெயரால் மாற்றாமல், தமிழில் அதன் ஒலிப்பெயர்ப்பாக வழங்குகிறது.
- source_word: הִצִּלַנִי / יַצִּילֵנִי
  choice: என்னை விடுவித்த / என்னை விடுவிப்பார்
  rationale: נצל என்பதன் காரணவினை வடிவம் ஆபத்திலிருந்து மீட்பதைக் குறிக்கிறது. கடந்த கால விடுதலையையும் எதிர்கால நம்பிக்கையையும் ஒரே வினைச்சொல் இணைக்கிறது.
- source_word: מִיַּד
  choice: பிடியிலிருந்து / கையிலிருந்து
  rationale: விலங்குகளைப் பொறுத்தவரை ‘பிடியிலிருந்து’ என்பது இயல்பான தமிழாகவும் ஆபத்தின் பிடியைத் தெளிவாகவும் காட்டுகிறது; மனித எதிரியைப் பொறுத்தவரை எபிரெய மொழியின் ‘கை’ உருவகத்தை ‘கையிலிருந்து’ எனப் பாதுகாக்கிறது.
- source_word: הָאֲרִי / הַדֹּב
  choice: சிங்கம் / கரடி
  rationale: குறிப்பிட்ட இரு விலங்குகளையும் நேரடியாகவும் இயல்பாகவும் மொழிபெயர்க்கிறது.
- source_word: הוּא
  choice: யாவே ... விடுவிப்பார்
  rationale: தனி சுட்டுப்பெயரின் வலியுறுத்தலைத் தமிழில் எழுவாயான ‘யாவே’யைத் தொடர்ந்த வாக்கிய அமைப்பாலும் உறுதியான எதிர்கால வினையாலும் வெளிப்படுத்துகிறது.
- source_word: הַפְּלִשְׁתִּי הַזֶּה
  choice: இந்தப் பெலிஸ்தன்
  rationale: சுட்டுப்பெயரின் குறிப்புத்தன்மையை இயல்பான தமிழ் சொல்வரிசையில் பாதுகாக்கிறது.
- source_word: לֵךְ
  choice: போ
  rationale: சவுலின் சுருக்கமான, நேரடியான கட்டளையைத் தக்கவைக்கிறது.
- source_word: יִהְיֶה עִמָּךְ
  choice: உன்னோடு இருப்பாராக
  rationale: இச்சூழலில் இறுதி வாக்கியம் அனுப்பிவைக்கும் ஆசீர்வாதமாக இயல்பாகப் புரிகிறது; எபிரெயத்தின் சாதாரண எதிர்கால வாசிப்பும் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைத் திருப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூலத்தில் ஒரு பட்டப்பெயர் அல்லாமல் இறைவனின் தனிப்பெயர் நேரடியாக உள்ளது; ஆகவே அதைத் தமிழில் ஒலிப்பெயர்த்து வழங்குகிறது.
- issue: சவுலின் இறுதி கூற்றின் பொருள் வலிமை
  choice: 'ஆசீர்வாதம் அல்லது விருப்பம்: ‘யாவே உன்னோடு இருப்பாராக’'
  alternative: 'எதிர்காலக் கூற்று: ‘யாவே உன்னோடு இருப்பார்’'
  rationale: எபிரெய நிறைவுறா வினை இச்சூழலில் விருப்பம்/ஆசீர்வாதமாகவும் சாதாரண எதிர்காலக் கூற்றாகவும் வாசிக்கப்படலாம். முதன்மை உரை இயல்பான அனுப்பிவைக்கும் ஆசீர்வாதத்தைத் தேர்ந்தெடுக்கிறது; மாற்று வாசிப்பு அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையில் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. தாவீதின் உறுதியும் சவுலின் சுருக்கமான அனுப்பிவைப்பும் பாதுகாக்கப்பட்டுள்ளன.
