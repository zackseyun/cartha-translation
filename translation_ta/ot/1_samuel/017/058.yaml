base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/058.yaml
  text: Saul said to him[a], “Whose son are you, young man?” And David said, “I am the son of your servant Jesse the Bethlehemite.”
translation:
  language: ta
  text: சவுல் அவனிடம், “இளைஞனே, நீ யாருடைய மகன்?” என்றான். அதற்குத் தாவீது, “பெத்லெகேமைச் சேர்ந்த உமது பணியாளர் ஈசாயின் மகன் நான்[a]” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லுக்கு நெருக்கமாக, “பெத்லெகேமியனான உமது பணியாளர் ஈசாயின் மகன்.” எபிரெயப் பதிலில் “நான்” என்பது வெளிப்படையாக இல்லை; பொருளிலிருந்து விளங்குகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן מִי
  choice: யாருடைய மகன்
  rationale: தந்தைவழி அடையாளத்தை நேரடியாகக் கேட்கும் எபிரெயச் சொற்றொடரை இயல்பான தமிழில் அதே வம்சத் தொடர்புடன் தருகிறது.
- source_word: הַנָּעַר
  choice: இளைஞனே
  rationale: נַעַר என்பது சிறுவன், வாலிபன், இளைஞன் ஆகிய பொருள்களை ஏற்கலாம்; இச்சூழலில் தாவீதின் இளமையையும் அவனைச் சிறுவனாக மட்டும் சித்தரிக்காத நிலையையும் ‘இளைஞன்’ சமநிலையுடன் வெளிப்படுத்துகிறது.
- source_word: עַבְדְּךָ
  choice: உமது பணியாளர்
  rationale: அரசவையில் பணிவுடன் தன்னைத் தாழ்த்திக் கூறும் மரியாதை வழக்கை இது வெளிப்படுத்துகிறது; இங்கு கட்டாய அடிமைத்தனத்தை வலியுறுத்துவது பொருத்தமல்ல.
- source_word: בֵּית הַלַּחְמִי
  choice: பெத்லெகேமைச் சேர்ந்த
  rationale: ஈசாயின் ஊர்சார் அடையாளத்தைக் குறிக்கும் எபிரெயப் பெயரடையை நவீனத் தமிழில் இயல்பாகத் தருகிறது.
- source_word: וַיֹּאמֶר ... וַיֹּאמֶר
  choice: என்றான் ... என்றான்
  rationale: இரு இடங்களிலும் உள்ள பொதுவான ‘சொல்’ வினையைப் பேணுகிறது; முதல் கூற்றின் கேள்வி வடிவமே அதன் விசாரணைத் தன்மையைத் தெளிவாக்குகிறது.
- source_word: בֶּן עַבְדְּךָ יִשַׁי
  choice: உமது பணியாளர் ஈசாயின் மகன் நான்
  rationale: எபிரெயத்தில் வெளிப்படையான இணைப்பு வினை இல்லை. தமிழிலும் பெயர்ப்பயனிலை வாக்கியம் இயல்பானதால் தேவையற்ற ‘இருக்கிறேன்’ சேர்க்காமல், பதிலில் மறைந்துள்ள முதலாம் நபரை ‘நான்’ எனத் தெளிவாக்குகிறது.
