  source_fidelity: மூல எபிரெயத்தின் வினா வடிவமான “நீ யாருடைய மகன், இளைஞனே?” என்பதையும், தாவீதின் சுயஅடக்கமான அடையாளக் கூறலையும் மொழிபெயர்ப்பு துல்லியமாகக் காக்கிறது. בֶּן־מִי என்பதிலுள்ள தந்தைவழி/குடும்ப அடையாளக் கவனம் ‘யாருடைய மகன்?’ என்பதில் தெளிவாக உள்ளது. பதிலில் வெளிப்படையான இணைப்பு வினை இல்லாத மூலத்தின் பெயர்ப்பயனிலை அமைப்புக்கு ஏற்ப ‘...மகன் நான்’ என்பது இயல்பாகவும் நெருக்கமாகவும் உள்ளது.
  naturalness: நடை நவீனத் தரமான தமிழில் தெளிவாக உள்ளது. ‘இளைஞனே’ என்ற விளிப்பும், அரசனை நோக்கிய ‘உமது’ என்ற மரியாதை வடிவமும் சூழலுக்கு ஏற்றவை. ‘பெத்லெகேமைச் சேர்ந்த’ என்பது இன/ஊர்சார் அடையாளத்தை வாசகருக்கு இயல்பாக வெளிப்படுத்துகிறது.
  terminology: ‘பணியாளர்’ என்பது இச்சூழலில் עַבְדְּךָ-வின் அரசவைப் பணிவு மொழியைச் சரியாகக் காட்டுகிறது; தேவையற்ற வகையில் கட்டாய அடிமை நிலையை முன்னிறுத்தவில்லை. ஈசாய், தாவீது, சவுல், பெத்லெகேம் ஆகிய பெயர்வடிவங்கள் நிலையான தமிழ் வேதாகமப் பயன்பாட்டுடன் ஒத்திருக்கின்றன. அடிக்குறிப்பு மூலத்தில் வெளிப்படையான முதலாம் நபர்/இணைப்பு கூறு இல்லை என்பதைச் சரியாகக் குறிக்கிறது.
