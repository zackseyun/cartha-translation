  naturalness: The Tamil is clear and reads naturally in a modern, dignified narrative register. Replacing ‘முன்னேறி’ with ‘வந்து’ retains the two movements while avoiding an unnecessarily military-specific nuance.
  terminology: ‘பெலிஸ்தியன்,’ ‘தாவீது,’ and ‘போரணி’ are suitable. ‘போரணியை நோக்கி’ appropriately renders the directional use of the singular ‘battle array/line.’
