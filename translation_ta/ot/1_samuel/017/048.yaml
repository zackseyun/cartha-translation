revisions:
- from: பெலிஸ்தியன் எழுந்து தாவீதை எதிர்கொள்ள முன்னேறி நெருங்கியபோது, தாவீது விரைந்து பெலிஸ்தியனை எதிர்கொள்ளப் போரணியை நோக்கி[a] ஓடினான்.
  to: பெலிஸ்தியன் எழுந்து தாவீதை எதிர்கொள்ள வந்து நெருங்கியபோது, தாவீது விரைந்து பெலிஸ்தியனை எதிர்கொள்ளப் போரணியை நோக்கி[a] ஓடினான்.
  rationale: The revision preserves the Hebrew’s two successive movement verbs with ‘வந்து நெருங்கியபோது,’ without importing the stronger sense of military advance. The footnote is adjusted to retain the singular form of the Hebrew noun while still explaining its possible collective sense.
