    issue: ‘முன்னேறி’ adds a slight ‘advance’ nuance.
    rationale: וַיֵּלֶךְ is the ordinary verb ‘went/came.’ In this context, ‘வந்து’ conveys movement toward David without strengthening the action beyond the source.
  - severity: low
