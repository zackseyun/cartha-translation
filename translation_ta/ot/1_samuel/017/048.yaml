  text: וְ/הָיָה֙ כִּֽי קָ֣ם הַ/פְּלִשְׁתִּ֔י וַ/יֵּ֥לֶךְ וַ/יִּקְרַ֖ב לִ/קְרַ֣את דָּוִ֑ד וַ/יְמַהֵ֣ר דָּוִ֔ד וַ/יָּ֥רָץ הַ/מַּעֲרָכָ֖ה לִ/קְרַ֥את הַ/פְּלִשְׁתִּֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/048.yaml
  text: And when the Philistine rose and came and drew near to meet David[a], David hurried and ran toward the battle line to meet the Philistine.
translation:
  language: ta
  text: பெலிஸ்தியன் எழுந்து தாவீதை எதிர்கொள்ள வந்து நெருங்கியபோது, தாவீது விரைந்து பெலிஸ்தியனை எதிர்கொள்ளப் போரணியை நோக்கி[a] ஓடினான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “படைவரிசையை நோக்கி.” எபிரெயச் சொல் போருக்கான அணிவரிசையையோ அணிவகுத்த படையையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: …போது
  rationale: எபிரெயக் கதைநடைத் தொடரின் காலத் தொடர்பை இயல்பான நவீனத் தமிழில் காட்டுகிறது; சொற்சொல்லான ‘அப்போது நிகழ்ந்தது’ போன்ற கடின நடையைத் தவிர்க்கிறது.
- source_word: קָם
  choice: எழுந்து
  rationale: பெலிஸ்தியன் எழுந்து செயல்படத் தொடங்கிய இயக்கத்தை நேரடியாக வெளிப்படுத்துகிறது.
- source_word: הַפְּלִשְׁתִּי
  choice: பெலிஸ்தியன்
  rationale: மூலத்தில் உள்ளபடியே இனப்பெயரை மட்டும் தருகிறது; சூழலிலிருந்து ‘வீரன்’ அல்லது ‘சவால்வீரன்’ என்பதைச் சேர்க்கவில்லை.
- source_word: וַיֵּלֶךְ וַיִּקְרַב
  choice: முன்னேறி நெருங்கியபோது
  rationale: 'இரு தொடர்ச்சியான இயக்கங்களையும் வேறுபடுத்திக் காக்கிறது: அவன் முன்னே சென்று, பின்னர் தாவீதுக்கு அருகில் வந்தான்.'
- source_word: לִקְרַאת
  choice: எதிர்கொள்ள
  rationale: ஒருவரை நோக்கிச் சென்று நேருக்கு நேர் சந்திக்கும் பொருளை இரு இடங்களிலும் இயல்பாகத் தருகிறது; போர்ச் சூழலில் உள்ள மோதல் நிழற்பொருளையும் அளவுக்கு மீறாமல் காக்கிறது.
- source_word: וַיְמַהֵר
  choice: விரைந்து
  rationale: விரைவாகச் செயல்பட்டதைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: וַיָּרָץ
  choice: ஓடினான்
  rationale: வினையின் நேரடியான பொருளைத் தெளிவாகத் தருகிறது.
- source_word: הַמַּעֲרָכָה
  choice: போரணியை நோக்கி
  rationale: இச்சொல் போருக்காக அணிவகுத்த வரிசையையோ படையணிகளையோ குறிக்கலாம். தாவீது மோதல் நடைபெறும் அணிவரிசையை நோக்கி ஓடிய இயக்கத்தை இத்தேர்வு இயல்பாகக் காட்டுகிறது.
