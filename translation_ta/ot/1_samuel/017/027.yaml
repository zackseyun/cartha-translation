- from: மக்கள் அவனிடம் அதே காரியத்தைச் சொல்லி, “அவனை வீழ்த்துகிற மனிதனுக்கு இப்படியே செய்யப்படும்” என்றார்கள்.
  to: மக்கள் அவனிடம் அதே காரியத்தைச் சொல்லி, “அவனை வீழ்த்தும் மனிதனுக்கு இவ்வாறு செய்யப்படும்” என்றார்கள்.
