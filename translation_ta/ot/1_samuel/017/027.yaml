  text: The people told him the same thing, saying, “This is what will be done for the man who strikes him down.”
translation:
  language: ta
  text: மக்கள் அவனிடம் அதே காரியத்தைச் சொல்லி, “அவனை வீழ்த்தும் மனிதனுக்கு இவ்வாறு செய்யப்படும்” என்றார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כַּדָּבָר הַזֶּה
  choice: அதே காரியத்தை
  rationale: முன்பு கூறப்பட்ட பரிசைப் பற்றிய செய்தியையே மக்கள் மீண்டும் சொன்னார்கள் என்பதைக் சூழலுக்கு ஏற்ற இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: יַכֶּנּוּ
  choice: அவனை வீழ்த்துகிற
  rationale: נכה என்பது பொதுவாக ‘அடித்தல்’ எனினும், இங்கு கோலியாத்தைக் கொன்று வெல்வதைக் குறிக்கிறது; ‘வீழ்த்துகிற’ என்பது அந்தச் சூழலைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: כֹּה יֵעָשֶׂה
  choice: இப்படியே செய்யப்படும்
  rationale: எபிரேயச் செயலப்பாட்டு வடிவத்தையும், முன்பு விவரிக்கப்பட்ட வெகுமதிகளைச் சுட்டும் தன்மையையும் காக்கிறது.
