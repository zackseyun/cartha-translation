base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/003.yaml
  text: The Philistines were standing on the mountain on one side[a], and Israel was standing on the mountain on the other side[b], with the valley between them.
translation:
  language: ta
  text: பெலிஸ்தியர்கள் ஒருபுறமுள்ள மலையின்மேல்[a] நின்றிருந்தார்கள்; இஸ்ரவேலர்கள் மறுபுறமுள்ள மலையின்மேல் நின்றிருந்தார்கள்; அவர்களுக்கு இடையே பள்ளத்தாக்கு[b] இருந்தது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘மலை’ என்பதற்குப் பதிலாக, இவ்வசனத்தில் வரும் הַר என்ற சொல்லின் இரு இடங்களிலும் ‘குன்று’ என்றும் மொழிபெயர்க்கலாம்; சூழலைப் பொறுத்து எபிரெயச் சொல் இரண்டையும் குறிக்கக்கூடும்.
    reason: lexical_alternative
  - marker: b
    text: ‘பள்ளத்தாக்கு’ என்பதற்குப் பதிலாக ‘செங்குத்தான பள்ளம்’ என்றும் மொழிபெயர்க்கலாம்; எபிரெயச் சொல் גַּיְא செங்குத்தான பக்கங்களையுடைய பள்ளத்தாக்கைக் குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפְלִשְׁתִּים
  choice: பெலிஸ்தியர்கள்
  rationale: மக்கள் இனத்தின் பெயரை நவீனத் தமிழில் இயல்பாகக் குறிக்கிறது. தொடக்க வாவைத் தனியாக ‘மேலும்’ என்று மொழிபெயர்ப்பது தமிழில் தேவையற்றதாக இருப்பதால், காட்சிவருணனை நேரடியாகத் தொடங்குகிறது.
- source_word: עֹמְדִים
  choice: நின்றிருந்தார்கள்
  rationale: எபிரெயப் பங்கேற்புவினை காட்டும் தொடர்ந்த நிலையை இயல்பான தமிழில் வெளிப்படுத்துகிறது; ‘நிறுத்தப்பட்டிருந்தார்கள்’ என்பது மூலத்தின் அடிப்படைப் பொருளைவிட அதிகமான இராணுவ விளக்கத்தைச் சேர்க்கும்.
- source_word: אֶל הָהָר מִזֶּה
  choice: ஒருபுறமுள்ள மலையின்மேல்
  rationale: עמד உடன் வரும் אֶל இங்கு இடநிலையைக் குறிக்கிறது. மִזֶּה...מִזֶּה என்ற எதிரமைப்பை ‘ஒருபுறம்...மறுபுறம்’ எனத் தெளிவாகவும் இயல்பாகவும் வழங்குகிறது.
- source_word: וְיִשְׂרָאֵל
  choice: இஸ்ரவேலர்கள்
  rationale: ‘இஸ்ரவேல்’ என்பது இங்கு கூட்டாக மக்களையோ படையையோ குறிக்கிறது; பன்மை வினையுடன் பொருந்தவும் தமிழில் மனிதக் குழுவை இயல்பாகச் சுட்டவும் ‘இஸ்ரவேலர்கள்’ பயன்படுத்தப்படுகிறது.
- source_word: וְהַגַּיְא בֵּינֵיהֶם
  choice: அவர்களுக்கு இடையே பள்ளத்தாக்கு இருந்தது
  rationale: גַּיְא என்பதன் பொதுவான இடவியல் பொருளையும் בֵּינֵיהֶם என்பதன் உறவுநிலையையும் தெளிவான தமிழில் தருகிறது.
