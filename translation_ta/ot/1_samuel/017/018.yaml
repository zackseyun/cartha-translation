translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான கட்டளைநடை பயன்படுத்தப்பட்டுள்ளது. ‘படைப்பிரிவு’ என்ற சொல் ஆயிரம் பேர் கொண்ட இராணுவ அலகைத் தெளிவாக்குகிறது; עֲרֻבָּתָם என்பதிலுள்ள உண்மையான சொற்பொருள் ஐயம் அடிக்குறிப்பில் வைக்கப்பட்டுள்ளது.
