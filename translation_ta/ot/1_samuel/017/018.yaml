source:
  edition: WLC
  text: וְ֠/אֵת עֲשֶׂ֜רֶת חֲרִצֵ֤י הֶֽ/חָלָב֙ הָ/אֵ֔לֶּה תָּבִ֖יא לְ/שַׂר הָ/אָ֑לֶף וְ/אֶת אַחֶ֨י/ךָ֙ תִּפְקֹ֣ד לְ/שָׁל֔וֹם וְ/אֶת עֲרֻבָּתָ֖/ם תִּקָּֽח־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/018.yaml
  text: Also bring these ten cuts of cheese to the commander of the thousand[a], check on your brothers’ welfare, and bring back some token from them.
translation:
  language: ta
  text: இந்தப் பத்துப் பாலாடைக்கட்டித் துண்டுகளையும் ஆயிரம் வீரர்களைக் கொண்ட படைப்பிரிவின் தளபதியிடம் கொண்டுபோ. உன் சகோதரர்கள் நலமாக இருக்கிறார்களா என்று விசாரித்து, அவர்களிடமிருந்து ஓர் அடையாளத்தைக் கொண்டுவா.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்களுடைய பிணையை எடுத்துக்கொள்.” எபிரெயச் சொல்லின் பொருள் உறுதியானதல்ல; சகோதரர்களின் நிலையை உறுதிப்படுத்தும் பொருள் அல்லது குறி இங்கு குறிக்கப்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲרִצֵי הֶחָלָב
  choice: பாலாடைக்கட்டித் துண்டுகள்
  rationale: חֲרִצִים என்பது வெட்டப்பட்ட துண்டுகள் அல்லது வடிவமைக்கப்பட்ட கட்டிகளைக் குறிக்கலாம்; הֶחָלָב உடன் இது பாலால் செய்யப்பட்ட உறைந்த உணவுப் பகுதிகளைக் குறிக்கிறது. நவீனத் தமிழில் ‘பாலாடைக்கட்டித் துண்டுகள்’ என்பது தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: שַׂר הָאָלֶף
  choice: ஆயிரம் வீரர்களைக் கொண்ட படைப்பிரிவின் தளபதி
  rationale: שַׂר என்பது தலைவர் அல்லது தளபதி; הָאָלֶף என்பது ஆயிரம் பேர் கொண்ட இராணுவ அலகைக் குறிக்கிறது. அலகின் இராணுவத் தன்மையைத் தமிழில் தெளிவாக்க இந்த வடிவம் பயன்படுத்தப்பட்டது.
- source_word: תִּפְקֹד לְשָׁלוֹם
  choice: நலமாக இருக்கிறார்களா என்று விசாரி
  rationale: פקד இங்கு ஒருவரின் நிலையை அறிதல் அல்லது கவனித்தல் என்றும், לְשָׁלוֹם அவர்களின் நலநிலையையும் குறிக்கிறது. இந்தத் தமிழாக்கம் பொருளை இயல்பான நடையில் தருகிறது.
- source_word: עֲרֻבָּתָם
  choice: அவர்களிடமிருந்து ஓர் அடையாளம்
  rationale: இச்சொல் பிணை, சான்று, அடையாளம் ஆகிய பொருள்களைக் கொள்ளக்கூடிய அரிதான வடிவம். சூழலில் சகோதரர்களின் நிலையை உறுதிப்படுத்த அவர்களிடமிருந்து திரும்பக் கொண்டுவரப்படும் பொருள் அல்லது குறி எனப் பொருள்படுகிறது; உறுதியற்ற தன்மை அடிக்குறிப்பில் பாதுகாக்கப்பட்டது.
- source_word: תִּקָּח
  choice: கொண்டுவா
  rationale: לקח என்பதன் அடிப்படைப் பொருள் ‘எடு’; ஆனால் ஈசாயிடம் திரும்பக் கொண்டுவர வேண்டும் என்பது சூழலால் உணரப்படுகிறது. தமிழில் திசையை இயல்பாக வெளிப்படுத்த ‘கொண்டுவா’ தேர்ந்தெடுக்கப்பட்டது.
