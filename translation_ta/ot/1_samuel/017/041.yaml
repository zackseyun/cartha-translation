revisions:
- from: அந்தப் பெலிஸ்தியன் தொடர்ந்து முன்னேறி, தாவீதிடம் நெருங்கி வந்தான்[a]. கேடயத்தைச் சுமந்த மனிதன் அவனுக்கு முன்னால் சென்றான்[b].
  to: அந்தப் பெலிஸ்தியன் முன்னேறிக்கொண்டே தாவீதிடம் நெருங்கி வந்தான்[a]; கேடயத்தைச் சுமந்த மனிதன் அவனுக்கு முன்னால் இருந்தான்[b].
  rationale: முதல் வாக்கியத்தில் தொடர்ச்சியான முன்னேற்றமும் தாவீதை நோக்கிய நெருங்குதலும் தெளிவாக வைக்கப்பட்டுள்ளன. இரண்டாம் கூற்று, கேடயம் சுமந்த மனிதன் பெலிஸ்தியனுக்கு முன்னால் இருந்த சூழ்நிலையைக் குறிக்கிறது; ஆகவே ‘சென்றான்’ என்பதற்குப் பதிலாக ‘இருந்தான்’ பயன்படுத்தப்பட்டுள்ளது.
