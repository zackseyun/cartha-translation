translation_notes:
  register: நவீன தரமான தமிழில், சாதாரண வாசகர்களுக்குத் தெளிவாகவும் கண்ணியமான வரலாற்றுக் கதைநடையிலும் மொழிபெயர்க்கப்பட்டது. ‘வீரன்’ போன்ற இவ்வசனத்தில் இல்லாத பட்டம் சேர்க்கப்படவில்லை. எபிரெய வாக்கியத்தின் சூழ்நிலைத் துணைக்கூற்றை இயல்பான தமிழுக்காகத் தனி வாக்கியமாக அமைத்துள்ளோம்.
