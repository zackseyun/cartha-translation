  yaml_path: translation/ot/1_samuel/017/041.yaml
  text: And the Philistine came on[a], coming closer to David[b], with the man carrying the shield before him.
translation:
  language: ta
  text: அந்தப் பெலிஸ்தியன் முன்னேறிக்கொண்டே தாவீதிடம் நெருங்கி வந்தான்[a]; கேடயத்தைச் சுமந்த மனிதன் அவனுக்கு முன்னால் இருந்தான்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய உரையில் ஒரு முற்றுவினையைத் தொடர்ந்து பங்கேற்புவினைகள் வருகின்றன; அவன் முன்னேறிக்கொண்டே தாவீதிடம் நெருங்கிய தொடர்ச்சியான நகர்வை இவை சித்தரிக்கின்றன.
    reason: source_structure
  - marker: b
    text: ‘கேடயம்’ என்பதற்கான எபிரெயச் சொல் (צִנָּה) குறிப்பாகப் பெரிய கேடயத்தைக் குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ הַפְּלִשְׁתִּי הֹלֵךְ וְקָרֵב
  choice: அந்தப் பெலிஸ்தியன் தொடர்ந்து முன்னேறி, ... நெருங்கி வந்தான்
  rationale: முற்றுவினையைத் தொடர்ந்து வரும் இரு பங்கேற்புவினைகள் நீடித்த முன்னோக்கிய நகர்வையும் படிப்படியான நெருங்குதலையும் சித்தரிக்கின்றன. நவீன தமிழில் இயல்பாக இதை வெளிப்படுத்த ‘தொடர்ந்து முன்னேறி, நெருங்கி வந்தான்’ பயன்படுத்தப்பட்டது.
- source_word: אֶל דָּוִד
  choice: தாவீதிடம்
  rationale: אֶל தாவீதை நோக்கிய நகர்வைக் குறிக்கிறது; சூழலில் ‘தாவீதிடம் நெருங்கி வந்தான்’ இயல்பான தமிழ்.
- source_word: וְהָאִישׁ נֹשֵׂא הַצִּנָּה
  choice: கேடயத்தைச் சுமந்த மனிதன்
  rationale: נֹשֵׂא என்பது சுமப்பவர் அல்லது ஏந்துபவர் என்பதையும், צִנָּה பொதுவாகப் பெரிய பாதுகாப்புக் கேடயத்தையும் குறிக்கிறது. எளிய முதன்மை உரையில் ‘கேடயம்’ வைக்கப்பட்டு அதன் அளவு அடிக்குறிப்பில் தெரிவிக்கப்பட்டது.
- source_word: לְפָנָיו
  choice: அவனுக்கு முன்னால்
  rationale: கேடயத்தைச் சுமந்தவன் பெலிஸ்தியனுக்கு முன்பாக இருந்த நிலையைத் தெளிவாகக் குறிக்கிறது.
