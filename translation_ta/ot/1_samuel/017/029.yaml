    rationale: Although the Hebrew noun דָּבָר itself does not contain an adverb for ‘only,’ the rhetorical question in context minimizes the alleged offense, and the audited English rendering makes this force explicit. Tamil ‘வெறும்’ conveys it without closing off the footnoted ‘matter’ sense.
