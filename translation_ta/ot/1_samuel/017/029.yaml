language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר דָּוִ֔ד מֶ֥ה עָשִׂ֖יתִי עָ֑תָּה הֲ/ל֖וֹא דָּבָ֥ר הֽוּא׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/029.yaml
  text: David said[a], “What have I done now? Was it not just a word?”
translation:
  language: ta
  text: தாவீது, “இப்போது நான் என்ன செய்துவிட்டேன்? நான் சொன்னது வெறும் ஒரு வார்த்தைதானே?” என்றான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: என்றான்
  rationale: நேரடிக் கூற்றை அறிமுகப்படுத்தும் எபிரெயக் கதைநடை வினை; தமிழில் மேற்கோளுக்குப் பின் வரும் ‘என்றான்’ இயல்பான இணை.
- source_word: דָּוִד
  choice: தாவீது
  rationale: தமிழ் வேதாகம மரபிலும் பொதுப் பயன்பாட்டிலும் நிலைபெற்ற பெயர்வடிவம்.
- source_word: מֶה עָשִׂיתִי עָתָּה
  choice: இப்போது நான் என்ன செய்துவிட்டேன்?
  rationale: கண்டிப்புக்கு எதிரான தாவீதின் எரிச்சலுடனான மறுப்புக் கேள்வியை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது; முடிந்த செயல் தற்போதைய குற்றச்சாட்டோடு தொடர்புடையது என்பதையும் ‘செய்துவிட்டேன்’ காட்டுகிறது.
- source_word: הֲלוֹא
  choice: தானே?
  rationale: உடன்பாடான பதிலை எதிர்பார்க்கும் மறுப்புக் கேள்வியின் வலிமையைத் தமிழில் இயல்பாகப் பாதுகாக்கிறது.
- source_word: דָּבָר
  choice: ஒரு வார்த்தை
  rationale: இச்சூழலில் தாவீது தன் செயலை வெறும் பேச்சாகக் குறைத்துக் கூறுகிறான் என்று புரிந்துகொள்ளலாம்; ஆயினும் எபிரெயச் சொல் ‘விஷயம்’ என்றும் பொருள்படக்கூடியதால் மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: הוּא
  choice: நான் சொன்னது
  rationale: எபிரெயத்தில் உள்ள ‘அது’ என்ற சுட்டுப்பெயரின் பொருளை, தமிழில் தெளிவும் இயல்பும் பெறச் சூழலுக்கேற்ப வெளிப்படுத்துகிறது; இது பேச்சைக் குறிக்கிறது என்ற முதன்மை வாசிப்பை பிரதிபலிக்கிறது.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழில், உரையாடலுக்கேற்ற இயல்பையும் வேதாகமக் கதைநடைக்குரிய கண்ணியத்தையும் இணைக்கும் வடிவம். דָּבָר என்பதிலுள்ள உண்மையான பொருள் தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
