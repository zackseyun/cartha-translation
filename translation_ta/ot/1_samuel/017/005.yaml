translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் வரலாற்றுப் போர்க் கவசத்தின் தன்மையைத் துல்லியமாகக் காட்டும் வகையிலும் மொழிபெயர்க்கப்பட்டுள்ளது. ‘சேக்கல்’ முதன்மை உரையில் பாதுகாக்கப்பட்டு, அதன் தோராயமான நவீன எடை அடிக்குறிப்பில் தரப்பட்டுள்ளது.
