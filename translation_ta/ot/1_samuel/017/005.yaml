base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/005.yaml
  text: He had a bronze helmet on his head[a], and he was clothed with a coat of scale armor[b]; and the weight of the coat was five thousand shekels of bronze.
translation:
  language: ta
  text: அவன் தலையில் வெண்கலத் தலைக்கவசம் அணிந்திருந்தான்; செதில்களாலான கவச உடையையும் அணிந்திருந்தான்[a]. அந்தக் கவச உடையின் எடை ஐயாயிரம் சேக்கல் வெண்கலமாக இருந்தது[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அதாவது, ஒன்றன்மேல் ஒன்று படியும்படி அமைக்கப்பட்ட உலோகச் செதில்களால் செய்யப்பட்ட கவச உடை. சில மொழிபெயர்ப்புகள் இதை ‘அஞ்சல் கவசம்’ என்று கூறுகின்றன; ஆனால் மூல எபிரெயச் சொல் செதில்களைக் குறிப்பாகச் சுட்டுகிறது.
    reason: lexical_alternative
  - marker: b
    text: ஐயாயிரம் சேக்கல் என்பது ஏறத்தாழ 57 கிலோகிராம்.
    reason: cultural_note
lexical_decisions:
- source_word: כּוֹבַע
  choice: தலைக்கவசம்
  rationale: போர்ச் சூழலில் தலையைப் பாதுகாக்கும் அணிகலனைக் குறிக்கிறது; நவீனத் தமிழில் தெளிவான, இயல்பான சொல்.
- source_word: נְחֹשֶׁת
  choice: வெண்கலம்
  rationale: வேதாகமக் கால உலோகப் பயன்பாட்டில் செம்பு அல்லது வெண்கலத்தைக் குறிக்கக்கூடிய சொல்; இங்குள்ள போர்க் கவசச் சூழலில் ‘வெண்கலம்’ பொருத்தமானது.
- source_word: שִׁרְיוֹן
  choice: கவச உடை
  rationale: உடலில் அணியும் பாதுகாப்புக் கவசத்தைக் குறிக்கிறது. ‘மார்புக்கவசம்’ என்பது பொருளை அளவுக்கு மீறிக் குறுக்கிவிடும்.
- source_word: קַשְׂקַשִּׂים
  choice: செதில்களால் ஆன
  rationale: சொல்லின் நேர்ப்பொருள் ‘செதில்கள்’; ஒன்றன்மேல் ஒன்று படியும் உலோகத் தகடுகளால் செய்யப்பட்ட கவச அமைப்பைத் தெளிவாக எடுத்துரைக்கிறது.
- source_word: הוּא לָבוּשׁ
  choice: அணிந்திருந்தான்
  rationale: கவசத்தை அணிந்த நிலையில் இருந்தான் என்ற எபிரெய நிலைப்பொருளை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: מִשְׁקַל
  choice: எடையுள்ளதாக இருந்தது
  rationale: அளக்கப்பட்ட கனத்தை இயல்பாகவும் தெளிவாகவும் தெரிவிக்கிறது.
- source_word: חֲמֵשֶׁת אֲלָפִים שְׁקָלִים
  choice: ஐயாயிரம் சேக்கல்
  rationale: மூல உரையிலுள்ள பண்டைய எடை அலகை முதன்மை உரையில் அப்படியே பாதுகாக்கிறது; நவீன மதிப்பீடு அடிக்குறிப்பில் தரப்படுகிறது.
