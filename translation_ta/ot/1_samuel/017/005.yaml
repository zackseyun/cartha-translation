revisions:
- from: அவன் தன் தலையில் வெண்கலத் தலைக்கவசம் அணிந்திருந்தான்; செதில்களால் ஆன கவச உடையையும் அணிந்திருந்தான்[a]. அந்தக் கவச உடை ஐயாயிரம் சேக்கல் வெண்கலம் எடையுள்ளதாக இருந்தது[b].
  to: அவன் தலையில் வெண்கலத் தலைக்கவசம் அணிந்திருந்தான்; செதில்களாலான கவச உடையையும் அணிந்திருந்தான்[a]. அந்தக் கவச உடையின் எடை ஐயாயிரம் சேக்கல் வெண்கலமாக இருந்தது[b].
