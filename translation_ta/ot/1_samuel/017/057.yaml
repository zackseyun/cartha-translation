base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/057.yaml
  text: When David returned from striking down the Philistine[a], Abner took him and brought him before Saul, with the Philistine’s head in his hand.
translation:
  language: ta
  text: தாவீது அந்தப் பெலிஸ்தியனை வீழ்த்திவிட்டுத் திரும்பியபோது, அப்னேர் அவனை அழைத்துச் சவுலின் முன்னிலையில் கொண்டுவந்தான்; அந்தப் பெலிஸ்தியனின் தலை அவன் கையில் இருந்தது.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இதைச் சூழ்நிலையைக் குறிக்கும் தொடராக, ‘அந்தப் பெலிஸ்தியனின் தலை அவன் கையில் இருக்க’ என்றும் மொழிபெயர்க்கலாம். எபிரெயத்தில் இது வினைச்சொல் இல்லாத வாக்கியம்; ஆகவே இதை இணையான தனி வாக்கியமாகவோ சூழ்நிலையைக் குறிக்கும் தொடராகவோ அமைக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּכְשׁוּב
  choice: திரும்பியபோது
  rationale: வாவ் இணைப்புடன் வரும் שׁוב என்பதன் infinitive construct காலத்தைக் குறிக்கும் துணைவாக்கியத்தை அறிமுகப்படுத்துகிறது. ‘திரும்பியபோது’ என்பது இயல்பான நவீனத் தமிழில் அந்தக் கால உறவைத் தெளிவாகக் காட்டுகிறது.
- source_word: מֵהַכּוֹת
  choice: வீழ்த்திவிட்டு
  rationale: נכה என்பதன் அடிப்படைப் பொருள் ‘அடி, தாக்கு’; இச்சூழலில் அது பெலிஸ்தியனைக் கொன்று வீழ்த்தியதைக் குறிக்கிறது. ‘வீழ்த்திவிட்டு’ என்பது நிகழ்வின் உயிர்க்கொல்லும் முடிவைச் சூழலுக்கு ஏற்றபடி உணர்த்துவதோடு, வெறும் ‘தோற்கடித்து’ என்பதைக் காட்டிலும் மூலத்தின் செயற்பாட்டுத் தீவிரத்தைப் பேணுகிறது.
- source_word: הַפְּלִשְׁתִּי
  choice: அந்தப் பெலிஸ்தியன்
  rationale: எபிரெய உரை கோலியாத்தின் பெயரைப் பயன்படுத்தாமல் ‘அந்தப் பெலிஸ்தியன்’ என்றே கூறுகிறது. குறிப்பிட்ட நபரைச் சுட்டும் எபிரெய definite article-ஐ தமிழில் இயல்பாக வெளிப்படுத்த ‘அந்த’ சேர்க்கப்பட்டுள்ளது.
- source_word: וַיִּקַּח אֹתוֹ
  choice: அப்னேர் அவனை அழைத்து
  rationale: לקח இங்கு ஒருவரைத் தன்னுடன் கூட்டிச் செல்வதைக் குறிக்கிறது. தமிழில் ‘அழைத்து’ என்பது சூழலுக்கேற்ற இயல்பான தேர்வு; ‘பிடித்துக்கொண்டு’ என்பது மூலத்தில் இல்லாத வலுக்கட்டாய உணர்வை ஏற்படுத்தக்கூடும்.
- source_word: וַיְבִאֵהוּ לִפְנֵי שָׁאוּל
  choice: சவுலின் முன்னிலையில் கொண்டுவந்தான்
  rationale: hiphil வடிவிலுள்ள בוא ‘கொண்டுவருதல்’ என்று பொருள்படும்; לִפְנֵי என்பது இங்கு ஒருவரின் முன்னிலையையோ சந்நிதியையோ குறிக்கிறது. இத்தொடர் இரண்டையும் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: וְרֹאשׁ הַפְּלִשְׁתִּי בְּיָדוֹ
  choice: அந்தப் பெலிஸ்தியனின் தலை அவன் கையில் இருந்தது
  rationale: இது வினைச்சொல் இல்லாத எபிரெய வாக்கியம். தமிழில் ‘இருந்தது’ என்பதை வெளிப்படையாகச் சேர்ப்பது இயல்பான முழு வாக்கியத்தைத் தருகிறது. ‘அவன்’ என்று வைத்திருப்பது கையின் உரிமையாளரைத் தாவீது என்று பெயரிட்டு மூலத்தில் உள்ள மறைமுகச் சுட்டுதலை தேவையின்றி தீர்த்துவிடாமல் காக்கிறது.
