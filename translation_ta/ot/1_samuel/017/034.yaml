translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான உரைநடை பயன்படுத்தப்பட்டுள்ளது. அரசனிடம் பேசும் பணிவைக் காட்ட ‘உங்கள் அடியான்’ என்றும், தொடர்ச்சியான கடந்தகால மேய்ப்புப் பணியைக் காட்ட ‘மேய்த்து வந்தான்’ என்றும் மொழிபெயர்க்கப்பட்டுள்ளது. வசனம் அடுத்த வசனத்துடன் இலக்கண ரீதியாகத் தொடருவதால் முடிவில் காற்புள்ளி வைக்கப்பட்டுள்ளது.
