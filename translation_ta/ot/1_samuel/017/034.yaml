  text: וַ/יֹּ֤אמֶר דָּוִד֙ אֶל שָׁא֔וּל רֹעֶ֨ה הָיָ֧ה עַבְדְּ/ךָ֛ לְ/אָבִ֖י/ו בַּ/צֹּ֑אן וּ/בָ֤א הָֽ/אֲרִי֙ וְ/אֶת הַ/דּ֔וֹב וְ/נָשָׂ֥א שֶׂ֖ה מֵ/הָ/עֵֽדֶר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/034.yaml
  text: David said to Saul[a], “Your servant was tending his father’s sheep[b], and when a lion or a bear would come and carry off a lamb from the flock,”
translation:
  language: ta
  text: தாவீது சவுலிடம், “உங்கள் அடியான் தன் தந்தைக்காக மந்தையை மேய்த்து வந்தான். ஒரு சிங்கமோ கரடியோ[a] வந்து மந்தையிலிருந்து ஓர் ஆட்டை[b] தூக்கிக்கொண்டு போகும்போது,” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொல்லுக்கு சொல், ‘சிங்கமும் கரடியும்.’ ஆனால் இங்கு இரண்டில் ஏதேனும் ஒரு வேட்டைவிலங்கு வருவது பொருளாக இருக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘ஓர் ஆடு’ என்பது ஓர் ஆட்டுக்குட்டியையோ, மந்தையிலுள்ள ஒரு செம்மறியாட்டையோ வெள்ளாட்டையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: רֹעֶה הָיָה
  choice: மந்தையை மேய்த்து வந்தான்
  rationale: இது தாவீதின் கடந்தகாலத் தொடர்ச்சியான மேய்ப்புப் பணியைக் குறிக்கிறது; தமிழில் இயல்பான வினைத் தொடராக அளிக்கப்பட்டுள்ளது.
- source_word: עַבְדְּךָ
  choice: உங்கள் அடியான்
  rationale: அரசனிடம் பணிவுடன் தன்னைக் குறிப்பிடும் மரபான சொற்றொடர்; இங்கு அடிமைநிலையை வலியுறுத்த வேண்டியதில்லை.
- source_word: לְאָבִיו
  choice: தன் தகப்பனுக்காக
  rationale: தாவீது தன் தகப்பனுக்காகச் செய்த மேய்ப்புப் பணியை לְ குறிக்கிறது.
- source_word: וּבָא
  choice: வந்து ... போகும்போது
  rationale: கடந்தகாலத்தில் நிகழ்ந்து வந்த வழக்கமான சம்பவத்தைத் தமிழ் இயல்பாக வெளிப்படுத்துகிறது; அடுத்த வசனத்திற்குத் தொடரும் வாக்கிய அமைப்பும் காக்கப்பட்டுள்ளது.
- source_word: הָאֲרִי וְאֶת הַדּוֹב
  choice: ஒரு சிங்கமோ கரடியோ
  rationale: எபிரெயத்தில் ‘மற்றும்’ இருந்தாலும், ஒருமை வினையும் சூழலும் இரு வகை விலங்குகளில் ஏதேனும் ஒன்று வருவதைப் பகிர்நிலையாகக் காட்டுகின்றன.
- source_word: וְנָשָׂא
  choice: தூக்கிக்கொண்டு போகும்போது
  rationale: இரையைப் பிடித்து எடுத்துச் செல்வதைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: שֶׂה
  choice: ஓர் ஆட்டை
  rationale: இந்த எபிரெயச் சொல் மந்தையிலுள்ள ஒரு செம்மறியாட்டையோ வெள்ளாட்டையோ, அவசியமாகக் குட்டி மட்டுமல்லாமல், குறிக்கக்கூடும்; ‘ஆடு’ அந்தப் பரப்பை ஓரளவு காக்கிறது.
- source_word: מֵהָעֵדֶר
  choice: மந்தையிலிருந்து
  rationale: மந்தையிலுள்ள ஓர் உயிரை வேட்டைவிலங்கு எடுத்துச் சென்றதைத் துல்லியமாகக் குறிக்கிறது.
