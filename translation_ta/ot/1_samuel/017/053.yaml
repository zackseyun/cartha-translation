source:
  edition: WLC
  text: וַ/יָּשֻׁ֨בוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל מִ/דְּלֹ֖ק אַחֲרֵ֣י פְלִשְׁתִּ֑ים וַ/יָּשֹׁ֖סּוּ אֶת מַחֲנֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/053.yaml
  text: The sons of Israel returned from pursuing the Philistines[a], and they plundered their camps.
translation:
  language: ta
  text: இஸ்ரவேலர் பெலிஸ்தியர்களைத் துரத்திவிட்டுத் திரும்பிவந்து, அவர்களுடைய முகாம்களைக் கொள்ளையிட்டார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இஸ்ரவேலர் பெலிஸ்தியர்களைப் பின்தொடர்ந்து துரத்தியபின் திரும்பிவந்து, அவர்களுடைய முகாமை (அல்லது முகாம்களை) சூறையாடினார்கள்.”
    reason: துரத்துதலைக் குறிக்கும் சொற்றொடருக்கும், முகாம் என்பது ஒருமையா பன்மையா என்ற சூழல்சார் புரிதலுக்கும் உள்ள மொழிபெயர்ப்பு மாற்றுகளைப் பதிவு செய்கிறது.
lexical_decisions:
- source_word: וַיָּשֻׁבוּ
  choice: திரும்பிவந்து
  rationale: שוב என்பதன் அடிப்படைப் பொருளான ‘திரும்புதல்’ என்பதையும், துரத்திச் சென்ற இடத்திலிருந்து வந்த இயக்கத்தையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலர்
  rationale: சொல்லுக்குச் சொல் ‘இஸ்ரவேலின் மகன்கள்’ என்றாலும், இங்கு உடன்படிக்கை மக்களைக் குறிக்கும் வழக்கமான இனப்பெயராக இருப்பதால் நவீனத் தமிழில் ‘இஸ்ரவேலர்’ தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: מִדְּלֹק אַחֲרֵי
  choice: துரத்திவிட்டு
  rationale: דלק மற்றும் אַחֲרֵי இணைந்து தீவிரமாகப் பின்தொடர்ந்து துரத்துவதைச் சுட்டுகின்றன; ‘துரத்திவிட்டு’ என்பது முடிந்த செயலைத் தொடர்ந்து அவர்கள் திரும்பியதை இயல்பாக இணைக்கிறது.
- source_word: פְלִשְׁתִּים
  choice: பெலிஸ்தியர்கள்
  rationale: இம்மக்களினத்திற்கான தமிழில் பரவலாக அறியப்பட்ட பெயர்வடிவம்.
- source_word: וַיָּשֹׁסּוּ
  choice: கொள்ளையிட்டார்கள்
  rationale: שסס என்பதன் போர்ச் சூழலிலான ‘சூறையாடுதல்/கொள்ளையிடுதல்’ என்ற பொருளைத் தெளிவான நவீனத் தமிழில் தருகிறது.
- source_word: מַחֲנֵיהֶם
  choice: அவர்களுடைய முகாம்களை
  rationale: மசோரா உரையின் எழுத்துவடிவம் பன்மையைக் காட்டுவதால் ‘முகாம்கள்’ என மொழிபெயர்க்கப்பட்டுள்ளது; சூழலில் ஒரே பாளையமாகவும் புரிந்துகொள்ள வாய்ப்புள்ளதால் அடிக்குறிப்பில் மாற்று தரப்பட்டுள்ளது.
