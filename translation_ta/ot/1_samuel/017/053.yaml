  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் கண்ணியமான வரலாற்று நடையைக் கொண்டது. எபிரெய மொழியின் சொற்றொடரைக் கட்டாயமாகப் பின்பற்றி ‘இஸ்ரவேலின் மகன்கள்’ என்று இடாமல், இயல்பான இனப்பெயரான ‘இஸ்ரவேலர்’ பயன்படுத்தப்பட்டுள்ளது.
