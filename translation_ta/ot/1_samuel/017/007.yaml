base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/007.yaml
  text: The shaft of his spear was like a weaver’s beam[a], and the iron head of his spear weighed six hundred shekels; and the bearer of the shield went before him.
translation:
  language: ta
  text: அவனுடைய ஈட்டியின் தண்டு நெசவாளரின் தறிமரத்தைப் போல இருந்தது. அவனுடைய ஈட்டியின் இரும்பு முனை அறுநூறு சேக்கல் எடை இருந்தது; கேடயத்தை[a] சுமந்தவன் அவனுக்கு முன்னால் சென்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘பெரிய கேடயத்தை’; இங்கு வரும் எபிரெயச் சொல் சிறிய கைக்கேடயத்தைக் காட்டிலும் முழு உடலை மறைக்கும் பெரிய கேடயத்தைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: חץ חניתו
  choice: அவனுடைய ஈட்டியின் தண்டு
  rationale: חץ என்பது பொதுவாக ‘அம்பு’ எனப் பொருள்படலாம்; ஆனால் இங்கு חניתו என்பதுடனும் பாவுமர ஒப்புமையுடனும் வருவதால் ஈட்டியின் நீண்ட தண்டையே குறிக்கிறது.
- source_word: כמנור ארגים
  choice: நெசவாளர்களின் பாவுமரத்தைப் போல
  rationale: מנור ארגים என்பது நெசவுத் தறியின் கனமான பாவுமரத்தைக் குறிக்கிறது. ‘பாவுமரம்’ என்ற தமிழ்ச் சொல் மூலத்தின் உருவகத்தையும் ஈட்டித் தண்டின் பருமனையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: להבת חניתו
  choice: அவனுடைய ஈட்டியின் ... முனை
  rationale: להבת என்பதன் அடிப்படைப் பொருள் சுடர் அல்லது கூரிய அலகு; ஆயுதச் சூழலில் அது ஈட்டியின் தாக்கும் உலோக முனையைக் குறிக்கிறது. தமிழில் ‘ஈட்டியின் முனை’ இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: שש מאות שקלים ברזל
  choice: இரும்பு முனை அறுநூறு சேக்கல் எடையிருந்தது
  rationale: எபிரெய உரை ‘அறுநூறு சேக்கல் இரும்பு’ எனச் சுருக்கமாக உள்ளது. தமிழில் பொருளைத் தெளிவுபடுத்த ‘எடையிருந்தது’ சேர்க்கப்பட்டுள்ளது; ברזל முனையின் பொருளாகக் காட்டப்பட்டுள்ளது.
- source_word: נשא הצנה
  choice: கேடயத்தைச் சுமந்தவன்
  rationale: இது கோலியாத்தின் கேடயத்தை ஏந்திச் சென்ற உதவியாளரைக் குறிக்கிறது. ‘சுமந்தவன்’ என்பது தொடர்ச்சியாக அதை எடுத்துச் சென்ற செயலை இயல்பாகச் சொல்கிறது.
- source_word: צנה
  choice: கேடயம்
  rationale: צנה பெரும்பாலும் முழு உடலை மறைக்கும் பெரிய கேடயத்தைக் குறிக்கலாம். வாசிப்பின் இயல்புக்காக பொதுவான ‘கேடயம்’ முதன்மை உரையில் வைக்கப்பட்டு, குறிப்பான பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: הלך לפניו
  choice: அவனுக்கு முன்னால் சென்றான்
  rationale: கேடயம் சுமந்தவன் கோலியாத்துக்கு முன்னே நகர்ந்ததை இந்தச் சொற்றொடர் நேரடியாகவும் இயல்பாகவும் தெரிவிக்கிறது.
