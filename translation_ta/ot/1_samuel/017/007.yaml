translation_notes:
  register: நவீன செந்தமிழ் நடையில், சாதாரண வாசகர்களுக்குப் புரியும் வகையில் மொழிபெயர்க்கப்பட்டுள்ளது. ஆயுத மற்றும் நெசவுத் தொழில்நுட்பச் சொற்களில் மூல உருவகம் காக்கப்பட்டுள்ளது. அடிக்குறிப்பு குறி அது விளக்கும் צנה (‘கேடயம்’) என்பதற்குப் பின்னர் வைக்கப்பட்டுள்ளது.
