  text: וְ/שָׁא֤וּל וְ/הֵ֨מָּה֙ וְ/כָל אִ֣ישׁ יִשְׂרָאֵ֔ל בְּ/עֵ֖מֶק הָֽאֵלָ֑ה נִלְחָמִ֖ים עִם פְּלִשְׁתִּֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/019.yaml
  text: Saul and they and all the men of Israel were in the Valley of Elah[a], fighting with the Philistines.
translation:
  language: ta
  text: சவுலும் அவர்களும் இஸ்ரவேலின் எல்லா ஆண்களும் ஏலா பள்ளத்தாக்கில் பெலிஸ்தியரோடு[a] போரிட்டுக்கொண்டிருந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பெலிஸ்தியருக்கு எதிராக.” எபிரெய முன்னிடைச்சொல் சொல்லுக்குச் சொல் “உடன்” என்று பொருள்படும்; ஆனால் போர் பற்றிய சூழலில் அது எதிர்த்துப் போரிடுவதைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/שָׁאוּל
  choice: சவுலும்
  rationale: வாவ் இணைப்பைத் தமிழின் இயல்பான ‘-உம்’ இணைப்பால் காட்டி, பெயரை ‘சவுல்’ என ஒலிபெயர்த்துள்ளது.
- source_word: וְ/הֵמָּה
  choice: அவர்களும்
  rationale: எபிரெயத்தில் வெளிப்படையாக உள்ள பன்மைச் சுட்டுப்பெயரை நீக்காமல் வைத்திருக்கிறது; முந்தைய சூழலில் குறிப்பிடப்பட்டவர்களை இது சுட்டுகிறது.
- source_word: וְ/כָל אִישׁ יִשְׂרָאֵל
  choice: இஸ்ரவேல் ஆண்கள் அனைவரும்
  rationale: சொல்லுக்குச் சொல் ‘இஸ்ரவேலின் ஒவ்வொரு ஆணும்’ என்ற பொருளைத் தரும் சொற்றொடரை, அதன் ஒட்டுமொத்தப் பொருளையும் பாலினக் குறிப்பையும் காத்து இயல்பான நவீனத் தமிழில் வழங்குகிறது.
- source_word: בְּ/עֵמֶק הָאֵלָה
  choice: ஏலா பள்ளத்தாக்கில்
  rationale: עֵמֶק என்பதற்கு ‘பள்ளத்தாக்கு’ என்று மொழிபெயர்த்து, ஏலா என்ற இடப்பெயரை ஒலிபெயர்த்துள்ளது.
- source_word: נִלְחָמִים
  choice: போரிட்டுக்கொண்டிருந்தார்கள்
  rationale: எபிரெயப் பங்கேற்புவினை குறிக்கும் தொடர்ச்சியான, நடந்துகொண்டிருந்த செயலைத் தமிழில் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: עִם פְּלִשְׁתִּים
  choice: பெலிஸ்தியரோடு
  rationale: עִם என்பதன் அடிப்படைப் பொருளான ‘உடன்/ஓடு’ என்பதைப் பேணுகிறது; ‘போரிடு’ என்ற வினை பகைமை சார்ந்த உறவைத் தெளிவாக்குகிறது.
