  to: அவன் அவர்களோடு பேசிக்கொண்டிருக்கையில், இதோ, பெலிஸ்தியரின் படையணிகளிலிருந்து[b] காத் ஊரைச் சேர்ந்த, கோலியாத் என்னும் பெலிஸ்தியனாகிய தனிப்போர் வீரன்[a] முன்னே வந்தான். அவன் அந்த வார்த்தைகளைச் சொன்னான்; தாவீது கேட்டான்.
  rationale: சிறிய நடை மற்றும் தெளிவாக்கத் திருத்தங்கள் மட்டுமே செய்யப்பட்டுள்ளன. மூலத்தின் அடையாளத் தொடர், படையணியிலிருந்து முன்னே வருதல், முன்கூறிய வார்த்தைகளை மீண்டும் கூறுதல், தாவீது கேட்டல் ஆகியவை மாற்றமின்றிப் பாதுகாக்கப்பட்டுள்ளன. அடிக்குறிப்பு a-இல் ‘இரண்டிற்கும்’ என்ற தெளிவற்ற குறிப்புக்குப் பதிலாக ‘இரு தரப்புகளுக்கு’ எனச் சொல்லி மூலச் சொல்லாட்சியின் கருத்து தெளிவாக்கப்பட்டுள்ளது.
