base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/023.yaml
  text: While he was speaking with them[a], behold, the champion came up—the Philistine named Goliath, from Gath, from the ranks of the Philistines—and he spoke these words[b], and David heard.
translation:
  language: ta
  text: அவன் அவர்களோடு பேசிக்கொண்டிருக்கையில், இதோ, பெலிஸ்தியரின் படையணிகளிலிருந்து[b] காத் ஊரைச் சேர்ந்த, கோலியாத் என்னும் பெலிஸ்தியனாகிய தனிப்போர் வீரன்[a] முன்னே வந்தான். அவன் அந்த வார்த்தைகளைச் சொன்னான்; தாவீது கேட்டான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயில் சொல்லுக்குச் சொல், ‘இரு தரப்புகளுக்கு இடையிலுள்ள மனிதன்’; இரு படைகளுக்கிடையில் தன் தரப்பின் பிரதிநிதியாகத் தனிப்போரில் ஈடுபடும் வீரனைக் குறிக்கும் மரபுத்தொடர்.
    reason: lexical_alternative
  - marker: b
    text: இங்குள்ள எபிரெய வாசிப்பு கடினமானது. இது பெலிஸ்தியரின் போரணிகள் அல்லது படையணிகளைக் குறிப்பதாகத் தெரிகிறது; சிலர் ‘பெலிஸ்தியரின் முகாம்களிலிருந்து’ என மொழிபெயர்க்கின்றனர்.
    reason: alternative_reading
lexical_decisions:
- source_word: מְדַבֵּר עִמָּם
  choice: அவர்களோடு பேசிக்கொண்டிருக்கையில்
  rationale: הוּא உடன் வரும் நிகழ்காலப் பங்கேற்புவினை, அப்போது தொடர்ந்து நடந்துகொண்டிருந்த செயலைக் குறிக்கிறது; עִם உரையாடலின் பரஸ்பரத் தன்மையைத் தக்கவைக்க ‘அவர்களோடு’ என மொழிபெயர்க்கப்பட்டது.
- source_word: וְהִנֵּה
  choice: இதோ
  rationale: காட்சியில் திடீரென நிகழும் மாற்றத்தையும் கதையின் உயிரோட்டத்தையும் குறிக்கும் எபிரெய உரையாடல் அடையாளத்தை இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: אִישׁ הַבֵּנַיִם
  choice: தனிப்போர் வீரன்
  rationale: இரு படைகளுக்கிடையில் வந்து தன் தரப்பின் பிரதிநிதியாக ஒற்றைப் போரில் ஈடுபடும் வீரனைக் குறிக்கும் மரபுத்தொடர். சொல்லுக்குச் சொல் பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: עוֹלֶה
  choice: முன்னே வந்தான்
  rationale: படையணியிலிருந்து போர்க்களத்தின் நடுப்பகுதியை நோக்கி வந்த செயலை நவீனத் தமிழில் இயல்பாகக் காட்டுகிறது; எபிரெயில் உள்ள இயக்கத்தின் கருத்தும் தக்கவைக்கப்படுகிறது.
- source_word: גָּלְיָת הַפְּלִשְׁתִּי שְׁמוֹ מִגַּת
  choice: காத்தைச் சேர்ந்த கோலியாத் என்னும் பெலிஸ்தியத்…வீரன்
  rationale: பெயர், இன அடையாளம், ஊர் ஆகிய மூன்றையும் தமிழின் இயல்பான அடைமொழி வரிசையில் வழங்குகிறது.
- source_word: ממערות פְּלִשְׁתִּים
  choice: பெலிஸ்தியரின் படையணிகளிலிருந்து
  rationale: கடினமான எழுத்து/வாசிப்பு மரபைக் கொண்ட இத்தொடர் சூழலில் பெலிஸ்தியப் போரணியைக் குறிப்பதாகப் புரிந்துகொள்ளப்படுகிறது; வேறு சாத்தியமான வாசிப்பு அடிக்குறிப்பில் குறிப்பிடப்பட்டுள்ளது.
- source_word: וַיְדַבֵּר כַּדְּבָרִים הָאֵלֶּה
  choice: அவன் இந்த வார்த்தைகளைச் சொன்னான்
  rationale: முன்னர் பதிவான கோலியாத்தின் சவால் வார்த்தைகளைச் சுட்டும் எபிரெயக் குறிப்பைத் தெளிவாக்காமல் அல்லது விரிவாக்காமல் தக்கவைக்கிறது.
- source_word: וַיִּשְׁמַע דָּוִד
  choice: தாவீது அதைக் கேட்டான்
  rationale: கேட்டதன் பொருள் சூழலிலிருந்து தெளிவாக இருப்பதால், தமிழில் இயல்பாக ‘அதை’ எனச் சுட்டப்பட்டுள்ளது.
