  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘இதோ’ என்பது எபிரெயக் கதையாடலின் திடீர் காட்சிமாற்றத்தைப் பாதுகாக்கிறது. ‘தனிப்போர் வீரன்’ மரபுத்தொடரின் போர்ச் சூழல் பொருளை இயல்பாக வெளிப்படுத்துகிறது; மூலத்தின் சொற்படிமம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
