base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/051.yaml
  text: Then David ran and stood over the Philistine[a], took his sword, drew it from its sheath, and killed him; then he cut off his head with it. When the Philistines saw that their champion was dead[b], they fled.
translation:
  language: ta
  text: பின்பு தாவீது ஓடிச் சென்று அந்தப் பெலிஸ்தியனின் அருகே நின்று[a], அவனுடைய வாளை எடுத்து, அதை அதன் உறையிலிருந்து உருவி, அவனைக் கொன்றான்; பின்பு அதைக் கொண்டு அவனுடைய தலையை வெட்டினான். தங்கள் மாவீரன்[b] இறந்துவிட்டதைக் கண்ட பெலிஸ்தியர்கள் தப்பியோடினார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அந்தப் பெலிஸ்தியனின் மேல் நின்று.’ எபிரெயச் சொற்றொடர் அவனருகில் நிலைகொண்டதையோ, விழுந்திருந்த அவனுக்கு மேலாக நின்றதையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘மாவீரன்’ என்பதற்கான எபிரெயச் சொல்லை ‘வலிமைமிக்கவன்’ அல்லது ‘போர்வீரன்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּרָץ
  choice: ஓடிப்போய்
  rationale: רוץ என்பதன் அடிப்படைப் பொருளான ஓடுதலை இயல்பான தமிழ் தொடர்வினை வடிவில் தருகிறது.
- source_word: וַיַּעֲמֹד אֶל הַפְּלִשְׁתִּי
  choice: அந்தப் பெலிஸ்தியனின் அருகே நின்று
  rationale: עמד אל என்பது விழுந்திருந்த பெலிஸ்தியனிடம் சென்று அவன் அருகில் அல்லது அவன்மேல் நிலைகொள்வதைக் குறிக்கலாம்; எபிரெயச் சொல்லின் இடவியல் தெளிவின்மையை மிகையாகத் தீர்மானிக்காமல் ‘அருகே’ என மொழிபெயர்க்கப்பட்டது.
- source_word: חַרְבּוֹ
  choice: அவனுடைய வாளை
  rationale: உடைமைப் பின்னொட்டு பெலிஸ்தியனுடைய சொந்த வாளைக் குறிக்கிறது.
- source_word: וַיִּשְׁלְפָהּ מִתַּעְרָהּ
  choice: அதை அதன் உறையிலிருந்து உருவி
  rationale: שלף ஆயுதத்தை உறையிலிருந்து உருவுதலையும் תער வாளுறையையும் குறிக்கின்றன; ‘உருவி’ என்பது இயல்பான தமிழ்ப் பயன்பாடு.
- source_word: וַיְמֹתְתֵהוּ
  choice: அவனைக் கொன்றான்
  rationale: מות என்பதன் இவ்வடிவம் கொல்லுதல் அல்லது சாகடித்தலைக் குறிக்கிறது. முந்தைய வசனத்துடன் தோன்றும் பதற்றத்தைச் சமப்படுத்தாமல், மூலத்தின் நிகழ்வுவரிசை அப்படியே வைக்கப்படுகிறது.
- source_word: וַיִּכְרָת בָּהּ אֶת רֹאשׁוֹ
  choice: அதைக் கொண்டு அவனுடைய தலையை வெட்டினான்
  rationale: כרת את ראשו தலை வெட்டுதலைக் குறிக்கிறது; בָּהּ முன் குறிப்பிடப்பட்ட வாளைச் சுட்டுகிறது.
- source_word: גִּבּוֹרָם
  choice: தங்கள் மாவீரன்
  rationale: גבור என்பதற்கு வலிமைமிக்கவன் அல்லது போர்வீரன் என்று பொருள் இருக்கலாம்; இவ்வதிகாரத்தில் கோலியாத் பிரதிநிதிப் போராளியாக இருந்த சூழலை ‘மாவீரன்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וַיָּנֻסוּ
  choice: தப்பியோடினார்கள்
  rationale: இராணுவத் தோல்விக்குப் பின் உயிர்தப்ப ஓடுவதைக் குறிக்கும் נוס என்பதற்கு இயல்பான தமிழாக்கம்.
theological_decisions:
- issue: முந்தைய வசனத்தில் கோலியாத் தரையில் விழுந்ததற்கும் இவ்வசனத்தில் தாவீது அவனைக் கொன்றதாகக் கூறுவதற்கும் இடையிலான நிகழ்வியல் பதற்றம்
  choice: ‘அவனைக் கொன்றான்’ என்று நேரடியாக மொழிபெயர்க்கப்பட்டது
  alternative: ‘அவனைக் சாகடித்தான்’ அல்லது ‘அவனுக்கு இறுதி அடி கொடுத்தான்’
  rationale: மூல எபிரெயச் சொல் கொல்லுதலைத் தெளிவாகக் கூறுகிறது; முந்தைய வசனத்தோடு ஒத்திசைக்க விளக்கச் சொற்களைச் சேர்ப்பது genuine narrative tension-ஐ மறைக்கும்.
translation_notes:
  register: நவீனத் தரத்தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘பெலிஸ்தியன்,’ ‘வாள்,’ ‘உறை,’ ‘மாவீரன்’ போன்ற வழக்கமான வேதாகம மற்றும் பொதுத் தமிழ்ச் சொற்கள் தேர்ந்தெடுக்கப்பட்டுள்ளன; மூலத்தின் தொடர்ச்சியான வினைநடை தமிழ் இயல்புக்கு ஏற்ப இணைக்கப்பட்டுள்ளது.
