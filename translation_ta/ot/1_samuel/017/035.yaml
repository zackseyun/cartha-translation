translation_notes:
  register: நவீனத் தரமான, எளிதில் புரியும், கண்ணியமான தமிழ். விலங்கைக் குறிக்கும் எபிரெய ஆண்பால் ஒருமை விகுதிகள் தமிழில் இயல்பாக ‘அது/அதன்’ என வழங்கப்பட்டன. அடித்தல் மற்றும் கொல்லுதல் என்ற தொடர்ச்சியான செயல்கள் தனித்தனியாகப் பேணப்பட்டன. எல்லா அடிக்குறிப்பு குறியீடுகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
