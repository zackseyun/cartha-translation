base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/035.yaml
  text: I went out after it and struck it and rescued it from its mouth[a]; and when it rose up against me[b], I seized it by its beard and struck it and killed it.
translation:
  language: ta
  text: நான் அதன் பின்னால் சென்று, அதை அடித்து, அதன் வாயிலிருந்து ஆட்டுக்குட்டியை மீட்டேன். அது எனக்கு எதிராக எழுந்தபோது, அதன் தாடியைப் பிடித்து, அதை அடித்துக் கொன்றேன்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயில் ‘அதன் தாடி’ என்று உள்ளது; சில மொழிபெயர்ப்புகள் இதை விளக்கமாக ‘அதன் பிடரி மயிர்’ அல்லது ‘அதன் தாடைப்பகுதி’ என்று வழங்குகின்றன.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָצָאתִי אַחֲרָיו
  choice: நான் அதைத் துரத்திச் சென்று
  rationale: יצא אחרי என்பதன் நேரடியான கருத்து ‘அதன் பின்னால் புறப்பட்டுச் சென்றேன்’; வேட்டையாடும் விலங்கைத் தொடர்ந்து சென்ற செயலை இயல்பான நவீனத் தமிழில் ‘துரத்திச் சென்று’ எனத் தருகிறது.
- source_word: וְהִכִּתִיו
  choice: அதை அடித்து
  rationale: נכה என்பது தாக்குதல் அல்லது அடித்தலைக் குறிக்கும் பரந்த வினை. பின்னர் வரும் ‘கொன்றேன்’ என்பதிலிருந்து இதை வேறுபடுத்த ‘அடித்து’ என மொழிபெயர்க்கப்பட்டது.
- source_word: וְהִצַּלְתִּי מִפִּיו
  choice: அதன் வாயிலிருந்து ஆட்டுக்குட்டியை மீட்டேன்
  rationale: נצל என்பதற்கு ‘மீட்பது’ என்றும், מִפִּיו என்பதற்கு சொற்பட ‘அதன் வாயிலிருந்து’ என்றும் பொருள். எபிரெயில் விடுபட்டுள்ள செயப்படுபொருள் முந்தைய வசனத்திலுள்ள ஆட்டுக்குட்டி என்பதால் தமிழில் தெளிவுக்காக வெளிப்படுத்தப்பட்டது.
- source_word: וַיָּקָם עָלַי
  choice: அது என்மேல் பாய்ந்தபோது
  rationale: קום על என்பது பகைமையுடன் ஒருவருக்கு எதிராக எழுவதைக் குறிக்கிறது. இங்கு விலங்கின் தாக்குதலை இயல்பாகக் காட்ட ‘என்மேல் பாய்ந்தபோது’ என வழங்கப்பட்டுள்ளது.
- source_word: וְהֶחֱזַקְתִּי בִּזְקָנוֹ
  choice: அதன் தாடியைப் பிடித்து
  rationale: חזק என்பதன் ஹிஃபில் வடிவம் உறுதியாகப் பற்றிக்கொள்வதைக் குறிக்கிறது; זקן என்பதன் வழக்கமான பொருள் ‘தாடி’. ‘பிடித்து’ என்பது இயல்பான தமிழ்; மூலத்தின் உயிரோட்டமான உருவகத்தைப் பேண ‘தாடி’ தக்கவைக்கப்பட்டது.
- source_word: וַהֲמִיתִּיו
  choice: கொன்றேன்
  rationale: מות என்பதன் ஹிஃபில் வடிவம் ‘சாகச் செய்தல்’, அதாவது ‘கொல்லுதல்’ எனத் தெளிவாகக் குறிக்கிறது; இது முந்தைய ‘அடித்தேன்’ என்பதிலிருந்து வேறுபட்ட இறுதி செயல்.
