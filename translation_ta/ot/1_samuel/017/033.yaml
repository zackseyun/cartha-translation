base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/033.yaml
  text: Saul said to David[a], “You are not able to go against this Philistine to fight with him, because you are a youth[b], and he has been a man of war from his youth.”
translation:
  language: ta
  text: சவுல் தாவீதிடம், “இந்தப் பெலிஸ்தியனுக்கு எதிராகப் போய் அவனோடு போரிட உன்னால் முடியாது. ஏனெனில், நீ ஓர் இளைஞன்[a]; அவனோ தன் இளமை முதலே போர்வீரனாக இருந்துவருகிறான்” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “இளைஞன்” என்று மொழிபெயர்க்கப்பட்ட எபிரெயச் சொல் இளம் வயதினரையும், சில சூழல்களில் சிறுவனையும் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא תוּכַל
  choice: உன்னால் முடியாது
  rationale: இது தடையை அல்ல, இயலாமையை வெளிப்படுத்துகிறது; தமிழில் இயல்பாகவும் மூலத்தின் வலிமையோடும் அமைகிறது.
- source_word: לָלֶכֶת אֶל
  choice: எதிராகப் போய்
  rationale: போர்ச் சூழலில் வெறுமனே ஒருவரிடம் செல்வதைவிட, எதிரியை எதிர்கொள்ள முன்னேறிச் செல்வதைக் குறிக்கிறது.
- source_word: הַפְּלִשְׁתִּי הַזֶּה
  choice: இந்தப் பெலிஸ்தியன்
  rationale: சுட்டுப்பெயரும் இனப்பெயரும் தமிழில் நேரடியாகவும் இயல்பாகவும் இவ்வாறு வெளிப்படுகின்றன.
- source_word: לְהִלָּחֵם עִמּוֹ
  choice: அவனோடு போரிட
  rationale: עִם என்ற உடனிகழ்வுப் பொருளைக் காத்து, நேருக்கு நேர் போரில் ஈடுபடுவதைக் குறிக்கிறது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: தாவீதின் இயலாமைக்கான காரணத்தை சவுல் கூறுவதைத் தெளிவாகக் காட்டுகிறது.
- source_word: נַעַר
  choice: இளைஞன்
  rationale: இந்தச் சூழலில் சிறுவன் முதல் இளம் ஆண் வரை பொருளளிக்கக்கூடிய சொல்லை, தாவீதின் இளவயதையும் போரனுபவக் குறைவையும் காட்டும் இயல்பான தமிழ்ச் சொல்லால் மொழிபெயர்க்கிறது.
- source_word: אִישׁ מִלְחָמָה
  choice: போர்வீரன்
  rationale: சொல்லுக்கு சொல் அமைப்பைவிட, போரைத் தொழிலாகவும் அனுபவமாகவும் கொண்ட மனிதன் என்ற எபிரெய மரபுத்தொடரின் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: מִנְּעֻרָיו
  choice: தன் இளமைமுதலே
  rationale: கோலியாத்தின் போரனுபவம் இளமையில் தொடங்கி நீடித்ததைத் தெரிவிக்கிறது; ‘முதலே’ நீண்டகால எதிர்மறை ஒப்பீட்டையும் வலுப்படுத்துகிறது.
