  register: நவீன நிலையான தமிழில், கண்ணியமான ஆனால் சாதாரண வாசகர்களுக்கு எளிதில் புரியும் நடையில் மொழிபெயர்க்கப்பட்டது. எபிரெயக் கதையோட்டம் இயல்பான தமிழ் வாக்கியத் தொடர்புகளால் காக்கப்பட்டுள்ளது.
