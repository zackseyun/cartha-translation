  text: וַ/יִּטֹּשׁ֩ דָּוִ֨ד אֶת הַ/כֵּלִ֜ים מֵ/עָלָ֗י/ו עַל יַד֙ שׁוֹמֵ֣ר הַ/כֵּלִ֔ים וַ/יָּ֖רָץ הַ/מַּעֲרָכָ֑ה וַ/יָּבֹ֕א וַ/יִּשְׁאַ֥ל לְ/אֶחָ֖י/ו לְ/שָׁלֽוֹם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/022.yaml
  text: So David left the supplies with the keeper of the supplies[a], and ran to the battle line[c][b]. When he arrived, he asked his brothers how they were.
translation:
  language: ta
  text: தாவீது தான் சுமந்துவந்த சாமான்களைச் சாமான்களைக் காப்பவரின் பொறுப்பில் வைத்துவிட்டு, போர்வரிசைக்கு ஓடினான். அங்கு வந்ததும், தன் சகோதரர்கள் நலமாக இருக்கிறார்களா என்று விசாரித்தான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּטֹּשׁ
  choice: விட்டுவிட்டு
  rationale: இச்சூழலில் பொருட்களைக் கைவிடுதல் அல்ல, காவலாளியிடம் தற்காலிகமாக விட்டுச் செல்லுதல் என்பதால் இத்தேர்வு இயல்பாகப் பொருளைத் தருகிறது.
- source_word: הַכֵּלִים מֵעָלָיו
  choice: தான் சுமந்துவந்த பொருட்களை
  rationale: כֵּלִים என்பது பொருட்கள், சாமான்கள், உபகரணங்கள் ஆகியவற்றைக் குறிக்கும் பரந்த சொல்; מֵעָלָיו அவை தாவீதின் மேல் இருந்து இறக்கப்பட்டவை, அதாவது அவன் சுமந்துவந்தவை என்பதைத் தெளிவாக்குகிறது.
- source_word: עַל יַד שׁוֹמֵר הַכֵּלִים
  choice: காவலாளியிடம்
  rationale: ‘காப்பவரின் கையில்/பொறுப்பில்’ என்ற எபிரெய மரபுத்தொடரின் பாதுகாப்புப் பொறுப்பு தமிழில் இயல்பாக வெளிப்படுகிறது; அதே ‘பொருட்கள்’ என்பதை மீண்டும் கூறாமல் பொருள் காக்கப்படுகிறது.
- source_word: וַיָּרָץ הַמַּעֲרָכָה
  choice: போரணியை நோக்கி ஓடினான்
  rationale: מַעֲרָכָה இங்கு ஒழுங்குபடுத்தப்பட்ட படையணி அல்லது போர்வரிசையைக் குறிக்கிறது. இயக்கத்தின் இலக்கைத் தமிழில் தெளிவாக்க ‘நோக்கி’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: וַיָּבֹא
  choice: அங்கு வந்ததும்
  rationale: எபிரெயக் கதைத்தொடரின் ‘வந்து’ என்பதை இயல்பான தமிழ் காலத் தொடர்பாக மாற்றி, அடுத்த செயல் வந்தவுடன் நிகழ்ந்ததைத் தெரிவிக்கிறது.
- source_word: וַיִּשְׁאַל לְאֶחָיו לְשָׁלוֹם
  choice: தன் சகோதரர்கள் நலமாக இருக்கிறார்களா என்று விசாரித்தான்
  rationale: சொல்லெழுத்தாக ‘சமாதானத்தைப் பற்றி கேட்டான்’ என்பதற்குப் பதிலாக, ஒருவரின் நலனை விசாரித்தல் என்ற எபிரெய மரபுத்தொடரின் உண்மைப் பொருளை நவீன தமிழில் தருகிறது.
