base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/043.yaml
  text: And the Philistine said to David[a], “Am I a dog[b], that you come to me with sticks?” And the Philistine cursed David by his gods.
translation:
  language: ta
  text: பெலிஸ்தியன் தாவீதிடம், “நான் நாயா, நீ தடிகளுடன்[a] என்னிடம் வருகிறாய்?” என்றான். பெலிஸ்தியன் தன் தெய்வங்களின் பெயரால்[b] தாவீதைச் சபித்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கோல்களுடன்.” எபிரெயச் சொல் தடிகள், கோல்கள் அல்லது ஊன்றுகோல்களைக் குறிக்கலாம்; இங்கு அது பெலிஸ்தியனின் இகழ்ச்சியை வெளிப்படுத்துகிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “தன் தெய்வங்களால்.” இங்கு பெலிஸ்தியன் தன் தெய்வங்களை அழைத்து தாவீதைச் சபிக்கிறான்.
    reason: alternative_reading
lexical_decisions:
- source_word: הַפְּלִשְׁתִּי
  choice: பெலிஸ்தியன்
  rationale: கோலியாத்தின் இன அடையாளத்தைக் குறிக்கும் பெயர்ச்சொல். ‘வீரன்’ போன்ற விளக்கச் சொல்லைச் சேர்க்காமல் எபிரெய உரையின் எளிய கதைநடையைப் பேணுகிறது.
- source_word: הֲכֶלֶב אָנֹכִי
  choice: நான் ஒரு நாயா?
  rationale: அவமதிக்கப்பட்டதாக உணர்ந்த கோபத்தையும் ஏளனத்தையும் வெளிப்படுத்தும் வினா. பண்பாட்டு மற்றும் கதைசார் முக்கியத்துவமுள்ள ‘நாய்’ என்ற உருவகத்தை நேரடியாகப் பேணுகிறது.
- source_word: כִּי אַתָּה בָא אֵלַי
  choice: நீ ... என்னிடம் வருகிறாயே!
  rationale: நிகழ்காலச் செயலைக் காட்டும் எபிரெய வடிவத்தையும், முந்தைய வினாவுக்கான கோபமான காரணவிளக்கத் தொனியையும் இயல்பான தமிழ் வாக்கிய முடிவு பேணுகிறது.
- source_word: בַּמַּקְלוֹת
  choice: தடிகளுடன்
  rationale: מַקֵּל என்பது தடி, கோல் போன்ற பொருள்களைக் குறிக்கும். இங்குள்ள பன்மை பெலிஸ்தியனின் இகழ்ச்சித் தொனியை வெளிப்படுத்துவதால் ‘தடிகள்’ இயல்பாகவும் பொருத்தமாகவும் உள்ளது.
- source_word: וַיְקַלֵּל
  choice: சபித்தான்
  rationale: இச்சூழலில் வெறும் பழித்தலைவிடத் தெய்வங்களை முன்வைத்து சாபமிடும் வலுவான சமயப் பொருளை வினைச்சொல் கொண்டுள்ளது.
- source_word: בֵּאלֹהָיו
  choice: தன் தெய்வங்களின் பெயரால்
  rationale: בְּ முன்னிடைச்சொல் இங்கு கருவி அல்லது தொடர்பைக் குறிக்கிறது; பெலிஸ்தியன் தன் தெய்வங்களை அழைத்து தாவீதைச் சபிப்பதைக் கருத்துத் தெளிவுடன் இயல்பான தமிழில் தெரிவிக்கிறது. எபிரெயிலுள்ள பன்மைப் பொருளும் பேணப்படுகிறது.
theological_decisions:
- issue: பெலிஸ்தியச் சூழலில் 3ஆம் நபர் ஒருமை ஆண்பால் பின்னொட்டுடன் வரும் אֱלֹהִים என்பதன் எண்
  choice: தன் தெய்வங்கள்
  alternative: தன் தெய்வம்
  rationale: אֱלֹהִים சில இடங்களில் ஒருமைப் பொருளில் வரக்கூடும். ஆனால் இஸ்ரவேலரல்லாத பெலிஸ்தியச் சூழலில் பன்மைப் பொருள் இயல்பானது; உரைக்குள் ஒருமைக் கடவுள் நம்பிக்கையை வலிந்து புகுத்தாமல் மூலத்தின் வடிவத்தையும் பதற்றத்தையும் இது பேணுகிறது.
- issue: בֵּאלֹהָיו என்பதிலுள்ள בְּ முன்னிடைச்சொல்லின் தொடர்பு
  choice: தன் தெய்வங்களின் பெயரால்
  alternative: தன் தெய்வங்களைக் கொண்டு
  rationale: சாபத்தில் தெய்வங்களை அழைப்பது என்ற கருத்தை முதன்மை மொழிபெயர்ப்பு இயல்பான தமிழில் தருகிறது; கருவிப்பொருளை இன்னும் நேரடியாகக் காட்டும் மாற்று அடிக்குறிப்பில் வழங்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையான, கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. நேரடி பேச்சில் ‘வருகிறாயே!’ என்பது எபிரெய வினாவின் கோபத்தையும் இகழ்ச்சியையும் இயல்பாக வெளிப்படுத்துகிறது. ‘தெய்வங்கள்’ என்ற பன்மை திட்டமிட்டு பேணப்பட்டுள்ளது.
