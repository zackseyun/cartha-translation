lexical_decisions:
- source_word: וַתַּעֲרֹךְ
  choice: போரணிவகுத்து… நிறுத்தப்பட்டனர்
  rationale: ערך என்பதன் இராணுவச் சூழலிலுள்ள படைகளைப் போருக்காக ஒழுங்குபடுத்தும் பொருளை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது. எபிரெய வினை ஒருமையில் இருந்தாலும், இணைக்கப்பட்ட இரு தரப்புகளைக் குறிக்கும் தமிழ்த் தொடரில் பன்மை இயல்பானது.
- source_word: יִשְׂרָאֵל
  choice: இஸ்ரவேலர்
  rationale: தேசியக் குழுவைக் குறிக்கும் பெயராகத் தமிழில் நிலைபெற்ற வடிவம்; பெலிஸ்தியருடன் இணையான மக்கள்-குறிப்பு வடிவம் பயன்படுத்தப்பட்டது.
- source_word: וּפְלִשְׁתִּים
  choice: பெலிஸ்தியரும்
  rationale: மக்கள் இனத்தின் பெயருக்கான வழக்கமான தமிழாக்கம்; இணைப்பும்மை மூலம் இஸ்ரவேலருடன் இணைக்கப்படுகிறது.
- source_word: מַעֲרָכָה
  choice: அணி
  rationale: இங்கு போருக்காக ஒழுங்குபடுத்தப்பட்ட படையணி அல்லது போரணி என்ற பொருள். முதலிடத்தில் 'போரணிவகுத்து' என்று இராணுவச் சூழல் தெளிவாக்கப்பட்டதால், மீளுரையில் 'அணி' இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: לִקְרַאת
  choice: எதிராக
  rationale: அடிப்படையில் 'எதிர்கொள்ள/சந்திக்க நோக்கி' என்றாலும், இப்போர்ச் சூழலில் ஒன்றையொன்று எதிர்நோக்கும் பகை அணிகளைக் குறிக்கிறது; 'எதிராக' அதன் எதிர்ப்புற உறவைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: מַעֲרָכָה
  choice: மற்றோர் அணி
  rationale: மூலத்தின் מַעֲרָכָה…מַעֲרָכָה மீளுரையை 'ஓர் அணி…மற்றோர் அணி' எனப் பேணி, இரு எதிரெதிர் படை அமைப்புகளையும் இயல்பான தமிழில் காட்டுகிறது.
