translation:
  language: ta
  text: இஸ்ரவேலரும் பெலிஸ்தியரும், ஒரு போரணிக்கு எதிராக மற்றொரு போரணியாக அணிவகுத்து நின்றனர்.[a]
  philosophy: optimal-equivalence
