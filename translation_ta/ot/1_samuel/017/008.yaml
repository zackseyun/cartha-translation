  text: וַֽ/יַּעֲמֹ֗ד וַ/יִּקְרָא֙ אֶל מַעַרְכֹ֣ת יִשְׂרָאֵ֔ל וַ/יֹּ֣אמֶר לָ/הֶ֔ם לָ֥/מָּה תֵצְא֖וּ לַ/עֲרֹ֣ךְ מִלְחָמָ֑ה הֲ/ל֧וֹא אָנֹכִ֣י הַ/פְּלִשְׁתִּ֗י וְ/אַתֶּם֙ עֲבָדִ֣ים לְ/שָׁא֔וּל בְּרוּ לָ/כֶ֥ם אִ֖ישׁ וְ/יֵרֵ֥ד אֵלָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/008.yaml
  text: He stood and called out to the battle lines of Israel and said to them[a], “Why do you come out to array yourselves for battle? Am I not the Philistine, and are you not servants of Saul? Choose a man for yourselves[b], and let him come down to me.”
translation:
  language: ta
  text: அவன் நின்று, இஸ்ரவேலின் படை அணிவரிசைகளை நோக்கி உரக்கக் கூப்பிட்டு, அவர்களிடம், “நீங்கள் போருக்கு அணிவகுக்க ஏன் வெளியே வருகிறீர்கள்? நான் அந்தப் பெலிஸ்தியன் அல்லவா? நீங்கள் சவுலின் அடிமைகள்[a] அல்லவா? உங்களுக்காக ஒரு மனிதனைத் தேர்ந்தெடுங்கள்; அவன் என்னிடம் இறங்கி வரட்டும்” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சவுலின் பணியாளர்கள்” அல்லது “சவுலின் ஊழியர்கள்.” எபிரெயச் சொல் கீழ்ப்பட்ட பணியாளர் அல்லது அடிமை என்ற இரு பொருள்களையும் கொள்ளலாம்; இங்கு இது இகழ்ச்சியான சவால் என்பதால் “அடிமைகள்” என மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲמֹד
  choice: அவன் நின்று
  rationale: עמד என்பதன் நேரடியான உடல் நிலையையும் எதிர்கொள்ளும் தோரணையையும் இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: וַיִּקְרָא
  choice: கூப்பிட்டு
  rationale: எதிரணியின் வரிசைகளுக்குக் கேட்கும்படி உரத்த குரலில் அழைத்துப் பேசியதைச் சூழலுக்கேற்றவாறு தெரிவிக்கிறது.
- source_word: מַעַרְכוֹת יִשְׂרָאֵל
  choice: இஸ்ரவேலின் போரணிகள்
  rationale: מַעַרְכוֹת என்பது பொதுவாகப் படைகளைக் காட்டிலும் போருக்காக ஒழுங்குபடுத்தப்பட்ட அணிவரிசைகளைக் குறிக்கிறது.
- source_word: לַעֲרֹךְ מִלְחָמָה
  choice: போருக்கு அணிவகுத்து நிற்க
  rationale: ערך + מלחמה என்பதில் உள்ள போருக்காக ஒழுங்குபடுத்தி வரிசையில் நிறுத்தும் படிமத்தை இயல்பான தமிழில் பாதுகாக்கிறது.
- source_word: אָנֹכִי הַפְּלִשְׁתִּי
  choice: நான் அந்தப் பெலிஸ்தியன் அல்லவா?
  rationale: எபிரெய definite article-ஐ ‘அந்தப்’ என்று காட்டி, கோலியாத் தன்னைப் பெலிஸ்தியரின் பிரதிநிதிப் போர்வீரனாக முன்வைக்கும் வலியுறுத்தலைப் பாதுகாக்கிறது.
- source_word: עֲבָדִים לְשָׁאוּל
  choice: சவுலின் அடிமைகள்
  rationale: עֲבָדִים என்பதற்கு ‘ஊழியர்கள்/பணியாளர்கள்’ என்றும் பொருள் இருக்கலாம்; ஆனால் இகழ்ச்சியான சவாலில் கீழ்ப்பட்ட நிலையைக் கடுமையாகச் சுட்டும் ‘அடிமைகள்’ பொருத்தமானது.
- source_word: בְּרוּ לָכֶם אִישׁ
  choice: உங்களுக்காக ஒரு மனிதனைத் தேர்ந்தெடுங்கள்
  rationale: אִישׁ என்ற ஆண்பால் ஒருமையையும் தனிப்போருக்கான ஒரே ஆண் பிரதிநிதியைத் தேர்ந்தெடுக்கும் கருத்தையும் வெளிப்படையாகத் தக்கவைக்கிறது.
- source_word: וְיֵרֵד אֵלָי
  choice: அவன் என்னிடம் இறங்கி வரட்டும்
  rationale: ירד என்பதன் கீழ்நோக்கிய இயக்கத்தையும் கட்டளையைத் தொடரும் வேண்டுகோள்/அனுமதி நுணுக்கத்தையும் தக்கவைக்கிறது.
theological_decisions:
- issue: עֲבָדִים என்ற சமூக நிலைக் குறிச்சொல்லின் மொழிபெயர்ப்பு
  choice: அடிமைகள்
  alternative: பணியாளர்கள் / ஊழியர்கள்
  rationale: சொல் இரு பொருள்களையும் ஏற்கக்கூடியது. இங்கு கோலியாத்தின் இகழ்ச்சியும் சவுலுக்குக் கீழ்ப்பட்டவர்கள் என்ற தாழ்வுபடுத்தலும் முன்னிலையில் இருப்பதால் ‘அடிமைகள்’ அந்த வலிமையைச் சிறப்பாகக் காக்கிறது.
- issue: אִישׁ என்ற பாலினம் குறிக்கப்பட்ட ஒருமைப் பெயர்
  choice: ஒரு மனிதன்
  alternative: ஒருவர் / ஒரு போர்வீரன்
  rationale: மூலத்தில் ஆண்பால் ஒருமை வெளிப்படையாக உள்ளது; தனிப்போருக்காகத் தேர்ந்தெடுக்கப்படும் ஆண் போராளியைப் பற்றிய சூழல் என்பதால் அதை நடுநிலைப்படுத்தவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்கு விளங்கும் வகையில் கண்ணியமான நேரடி உரை. ‘போரணிகள்’, ‘அணிவகுத்து நிற்க’ ஆகியவை இராணுவ அணிவரிசைப் படிமத்தைப் பாதுகாக்கின்றன; ‘அடிமைகள்’ கேலியின் கடுமையைத் தக்கவைக்கிறது.
