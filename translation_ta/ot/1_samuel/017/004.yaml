  text: וַ/יֵּצֵ֤א אִֽישׁ הַ/בֵּנַ֨יִם֙ מִ/מַּחֲנ֣וֹת פְּלִשְׁתִּ֔ים גָּלְיָ֥ת שְׁמ֖/וֹ מִ/גַּ֑ת גָּבְה֕/וֹ שֵׁ֥שׁ אַמּ֖וֹת וָ/זָֽרֶת־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/004.yaml
  text: Then a champion came out from the camps of the Philistines[a]; his name was Goliath, from Gath[b]. His height was six cubits and a span.
translation:
  language: ta
  text: அப்போது பெலிஸ்தியர்களின் முகாம்களிலிருந்து ஒரு தனிப்போர் வீரன்[a] புறப்பட்டு வந்தான். காத் ஊரைச் சேர்ந்த அவன் பெயர் கோலியாத். அவனுடைய உயரம் ஆறு முழமும் ஒரு சாணும்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், ‘இடையில் உள்ள மனிதன்.’ இரு படைகளின் அணிவரிசைகளுக்கும் இடையே வந்து, தன் தரப்பின் சார்பாகத் தனிப்போர் புரியும் வீரனை இது குறித்திருக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: ஆறு முழமும் ஒரு சாணும் என்பது, பயன்படுத்தப்பட்ட முழத்தின் நீளத்தைப் பொறுத்து, ஏறத்தாழ 9 அடி 9 அங்குலம் (சுமார் 3.0 மீட்டர்).
    reason: cultural_note
lexical_decisions:
- source_word: אִישׁ הַבֵּנַיִם
  choice: தனிப்போர் வீரன்
  rationale: இந்த எபிரெயச் சொற்றொடரின் நேரடிப் பொருள் ‘இடையில் உள்ள மனிதன்’ என்பதாகும். இரு படைகளுக்கும் இடையே வந்து பிரதிநிதியாகத் தனிப்போர் புரியும் வீரனைச் சூழல் குறிப்பதால், இயல்பாகவும் தெளிவாகவும் ‘தனிப்போர் வீரன்’ என மொழிபெயர்க்கப்பட்டது; அதன் சொல்லடிப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: וַיֵּצֵא
  choice: புறப்பட்டு வந்தான்
  rationale: வினைச்சொல் ‘வெளியே சென்றான்/வந்தான்’ என்று பொருள்படும். பெலிஸ்திய முகாம்களிலிருந்து போர்க்களத்துக்கு அவன் வெளிப்பட்டதைத் தமிழில் இயல்பாகக் காட்டுகிறது.
- source_word: מִמַּחֲנוֹת פְּלִשְׁתִּים
  choice: பெலிஸ்தியர்களின் முகாம்களிலிருந்து
  rationale: மூலத்தில் ‘முகாம்கள்’ என்பது பன்மையில் இருப்பதால் அது தக்கவைக்கப்பட்டது.
- source_word: גָּלְיָת
  choice: கோலியாத்
  rationale: தமிழில் பரவலாக அறியப்பட்ட பெயரெழுத்தாக்கம் பயன்படுத்தப்பட்டது.
- source_word: שְׁמוֹ
  choice: அவன் பெயர்
  rationale: ‘அவனுடைய பெயர்’ என்ற எபிரெய அமைப்பை இயல்பான தமிழில் நேரடியாகத் தருகிறது.
- source_word: מִגַּת
  choice: காத் ஊரைச் சேர்ந்த
  rationale: மூலம் இனப்பெயரை அல்ல, அவன் வந்த இடத்தை நேரடியாக ‘காத்திலிருந்து’ என்று குறிப்பிடுகிறது.
- source_word: גָּבְהוֹ
  choice: அவனுடைய உயரம்
  rationale: பெயர்ச்சொல்லின் பொருளான உயரம் அல்லது உடலளவை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: שֵׁשׁ אַמּוֹת וָזָרֶת
  choice: ஆறு முழமும் ஒரு சாணும்
  rationale: மூலத்திலுள்ள பழங்கால அளவுகள் முதன்மை உரையில் பாதுகாக்கப்பட்டுள்ளன; நவீன அளவின் தோராய மதிப்பு அடிக்குறிப்பில் தரப்படுகிறது.
