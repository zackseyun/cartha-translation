translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. மூலத்தின் பன்மையான ‘முகாம்கள்’ மற்றும் பழங்கால அளவுகள் தக்கவைக்கப்பட்டன. அடிக்குறிப்பு [a] அது விளக்கும் ‘தனிப்போர் வீரன்’ என்பதற்குப் பின்னும், [b] அளவுக்குப் பின்னும் வைக்கப்பட்டுள்ளன.
