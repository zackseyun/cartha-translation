  yaml_path: translation/ot/1_samuel/017/015.yaml
  text: David went back and forth from Saul to shepherd his father's flock at Bethlehem[a].
translation:
  language: ta
  text: தாவீது சவுலிடமிருந்து பெத்லெகேமுக்குச் சென்று, அங்குள்ள தன் தந்தையின் மந்தையை மேய்த்துவிட்டு, மீண்டும் சவுலிடம் திரும்பி வருவான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது, முறையான நடையில்: “தாவீது சவுலிடமிருந்து போய்த் திரும்பி, பெத்லெகேமில் தன் தந்தையின் மந்தையை மேய்த்துவந்தான்.”'
    reason: எபிரெயத்தின் ‘போய்த் திரும்புதல்’ என்ற நெருக்கமான வடிவத்தை மாற்றுரையாகக் காட்டுகிறது; முதன்மை உரை அதன் வழக்கமான, மீண்டும் நிகழும் இயக்கத்தைத் தெளிவாக வெளிப்படுத்துகிறது.
lexical_decisions:
- source_word: הֹלֵךְ וָשָׁב
  choice: போவதும்… திரும்புவதுமாக இருந்தான்
  rationale: இணைந்து வரும் இவ்வினை வடிவங்கள் ஒரே முறை நிகழ்ந்த பயணத்தைவிட, வழக்கமாக அல்லது மீண்டும் மீண்டும் நடந்த போக்குவரத்தைக் குறிக்கின்றன. தமிழில் இந்தத் தொடர் அதன் தொடர்ச்சியான இயல்பைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: מֵעַל שָׁאוּל
  choice: சவுலிடமிருந்து
  rationale: சொல்லடிப்படையில் ‘சவுலின் மேலிருந்து’ என்ற அமைப்பு இருந்தாலும், இச்சூழலில் சவுலின் உடனிருப்பு அல்லது பணியிடத்திலிருந்து புறப்படுவதைக் குறிக்கும் மரபுத்தொடராக உள்ளது.
- source_word: לִרְעוֹת
  choice: மேய்ப்பதும்
  rationale: רעה என்பதன் வினைச்செயல் மேய்ப்பனின் பணியை, அதாவது மந்தையை மேய்த்துப் பராமரிப்பதை, நேரடியாகக் குறிக்கிறது.
- source_word: צֹאן
  choice: மந்தை
  rationale: צֹאן என்பது செம்மறியாடுகள் மற்றும் வெள்ளாடுகள் போன்ற சிறுகால்நடைகளைத் தொகுப்பாகக் குறிக்கக்கூடும்; மேய்த்தல் என்ற சூழலில் ‘மந்தை’ இயல்பான கூட்டுப்பெயர்.
- source_word: אָבִיו
  choice: தன் தந்தையின்
  rationale: எழுவாயான தாவீதையே உடைமையாளர் சுட்டுப்பெயர் குறிக்கிறது என்பதைத் தமிழில் ‘தன்’ இயல்பாகவும் தெளிவாகவும் காட்டுகிறது.
- source_word: בֵּית לָחֶם
  choice: பெத்லெகேம்
  rationale: இந்த இடப்பெயரின் தமிழில் நிலைபெற்ற ஒலிபெயர்ப்பு பயன்படுத்தப்பட்டுள்ளது.
- source_word: וְ
  choice: தனி இணைப்புச்சொல் சேர்க்கப்படவில்லை
  rationale: எபிரெய இணைப்பெழுத்து இங்கு விவரணக் கூற்றைத் தொடர்கிறது. தமிழில் வசனத்தின் தொடக்கத்தில் ‘மேலும்’ அல்லது ‘அப்போது’ சேர்க்காமல் இருப்பது இயல்பானது; மூலத்தில் வெளிப்படையான காலக்குறிப்பும் இல்லை.
