  register: நவீன நிலையான தமிழில், எளிமையும் கண்ணியமும் கொண்ட உரை. மீண்டும் மீண்டும் சவுலிடமிருந்து பெத்லெகேமுக்குச் சென்று திரும்பிய பொருள் முதன்மை உரையில் தெளிவுபடுத்தப்பட்டுள்ளது; ‘பெத்லெகேமுக்கு’ மற்றும் ‘சவுலிடம்’ ஆகிய திசைக் குறிப்புகள் சூழலிலிருந்து இயல்பாக நிறைவு செய்யப்பட்டவை.
