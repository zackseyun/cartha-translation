  text: And every man of Israel, when they saw the man, fled from before him and were very afraid.
translation:
  language: ta
  text: இஸ்ரவேலைச் சேர்ந்த ஆண்கள் அனைவரும் அந்த மனிதனைப் பார்த்தபோது, அவனைவிட்டு ஓடிப்போய் மிகவும் பயந்தார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כֹל אִישׁ יִשְׂרָאֵל
  choice: இஸ்ரவேலைச் சேர்ந்த ஆண்கள் அனைவரும்
  rationale: ‘இஸ்ரவேலின் ஒவ்வொரு ஆணும்’ என்ற எபிரெய தனிநபர் வடிவத்தையும், அதைத் தொடர்ந்து வரும் பன்மை வினைகளையும் இயல்பான தமிழில் கூட்டாக வெளிப்படுத்துகிறது.
- source_word: הָאִישׁ
  choice: அந்த மனிதன்
  rationale: முன்னரே குறிப்பிடப்பட்ட கோலியாத்தைச் சுட்டும் குறிப்பிட்ட பெயர்ச்சொல்லை நேரடியாகப் பாதுகாக்கிறது.
- source_word: וַיָּנֻסוּ מִפָּנָיו
  choice: அவனைவிட்டு ஓடிப்போய்
  rationale: சொற்படியாக ‘அவன் முன்னிலையிலிருந்து தப்பியோடினர்’; நவீன தமிழில் அதே பொருளை இயல்பாகக் கூறுகிறது.
- source_word: וַיִּירְאוּ מְאֹד
  choice: மிகவும் பயந்தார்கள்
  rationale: பயத்தின் தீவிரத்தைச் சுட்டும் מְאֹד என்பதையும் பன்மை வினையையும் தெளிவாகப் பிரதிபலிக்கிறது.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழில், எளிமையானதும் கண்ணியமானதுமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. எபிரெயத்தில் ‘ஒவ்வொரு ஆணும்’ என ஒருமையில் தொடங்கி பன்மை வினைகளுக்கு மாறும் கூட்டுப்பொருள், தமிழில் இயல்பான பன்மை அமைப்பாக வழங்கப்பட்டுள்ளது.
