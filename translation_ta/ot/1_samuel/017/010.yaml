  yaml_path: translation/ot/1_samuel/017/010.yaml
  text: Then the Philistine said[a], “I have defied the ranks of Israel this day. Give me a man[c][b], and let us fight together.”
translation:
  language: ta
  text: அப்போது பெலிஸ்தியன், “இன்று நான் இஸ்ரவேலின் போர்வரிசைகளை[a] இகழ்ந்தேன்.[b] எனக்கு ஒரு மனிதனைக் கொடுங்கள்; நாமிருவரும் ஒருவரோடொருவர் போரிடுவோம்” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “போர்வரிசைகள்” என்பதற்கு “போர் அணிவகுப்புகள்” என்றும், விரிவான பொருளில் “படைகள்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
