  text: When the words that David had spoken were heard[a], they reported them before Saul, and he sent for him.
translation:
  language: ta
  text: தாவீது பேசிய வார்த்தைகள் கேட்கப்பட்டபோது, அவற்றைச் சவுலிடம் தெரிவித்தார்கள்; சவுல் தாவீதை அழைத்து வரச் செய்தான்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, சொல்லடிப்படையில், ‘அவனை எடுத்துக்கொண்டான்.’ எபிரெயத்தில் இங்கு சவுல் தாவீதைத் தன் முன்னிலைக்கு அழைத்து வரச் செய்தான் என்பதே சாத்தியமான பொருள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְּשָּׁמְעוּ
  choice: கேட்கப்பட்டபோது
  rationale: எபிரெய வினை இலக்கணரீதியாகச் செயப்பாட்டு வடிவில் இருந்தாலும், இங்கு செய்பவர் குறிப்பிடப்படாத பொதுப்பொருளைத் தருகிறது. தமிழில் ‘கேட்கப்பட்டபோது’ என்பது அதைக் காத்து, அடுத்துள்ள பன்மை வினைக்குத் தேவையற்ற புதிய எழுவாயை அறிமுகப்படுத்துவதில்லை.
- source_word: הַדְּבָרִים
  choice: வார்த்தைகள்
  rationale: இங்கு דְּבָרִים என்பது தாவீது பேசிய கருத்துகளைக் குறிக்கிறது; ‘வார்த்தைகள்’ பேச்சுச் சூழலை நேரடியாகக் காக்கிறது.
- source_word: אֲשֶׁר דִּבֶּר דָּוִד
  choice: தாவீது பேசிய
  rationale: உறவுநிலைத் தொடரை இயல்பான தமிழில் சுருக்கமாகத் தருகிறது; தாவீது முன்பு கூறிய பேச்சே குறிப்பிடப்படுகிறது.
- source_word: וַיַּגִּדוּ
  choice: தெரிவித்தார்கள்
  rationale: נגד இங்கு ஒரு செய்தியை அதிகாரியிடம் கொண்டு சென்று அறிவித்தல் என்ற பொருளில் வருகிறது. ‘தெரிவித்தார்கள்’ நவீன தமிழில் இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: לִפְנֵי שָׁאוּל
  choice: சவுலிடம்
  rationale: சொல்லுக்கு சொல் ‘சவுலின் முன்னிலையில்’ என்றாலும், இந்தச் சூழலில் சவுலுக்குத் தகவல் தெரிவிக்கப்பட்டது என்பதே இயல்பான பொருள்; ‘சவுலிடம்’ அதனைத் தெளிவாகத் தருகிறது.
- source_word: וַיִּקָּחֵהוּ
  choice: அவன் தாவீதை அழைத்துவரச் செய்தான்
  rationale: சொல்லடிப்படையில் ‘அவன் அவனை எடுத்தான்/கொண்டான்.’ அரசவைக் சூழலில் சவுல் தாவீதைத் தன் முன்னிலைக்கு அழைத்துவரச் செய்தான் என்பதே சாத்தியமான இடியோமப் பொருள். தெளிவுக்காகப் பிரதிப்பெயருக்குப் பதில் ‘தாவீதை’ பயன்படுத்தப்பட்டது.
