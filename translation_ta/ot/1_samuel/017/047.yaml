base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/047.yaml
  text: and all this assembly will know that Yahweh does not save by sword or by spear[a]; for the battle belongs to Yahweh[c][b], and he will give you into our hand.
translation:
  language: ta
  text: இந்தக் கூட்டத்தார் அனைவரும், யாவே வாளினாலோ ஈட்டியினாலோ மீட்பதில்லை[a] என்பதை அறிந்துகொள்வார்கள். ஏனெனில், போர் யாவேக்குரியது[b]; அவர் உங்களை எங்கள் கையில் ஒப்புக்கொடுப்பார்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யாவே வாளாலும் ஈட்டியாலும் விடுவிப்பதில்லை.”
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில், “போர் யாவேவுடையது.”
    reason: lexical_alternative
  - marker: c
    text: “எங்கள் கையில்” என்பது “எங்கள் அதிகாரத்தில்” அல்லது “எங்களிடம்” என்று பொருள்படும் எபிரெய மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֵדְעוּ
  choice: அறிந்துகொள்வார்கள்
  rationale: Qal முற்றுப்பெறா வினை இங்கு தாவீதின் பேச்சில் வருங்கால விளைவைக் குறிக்கிறது; கூட்டத்தார் இதன் மூலம் உணர்ந்து அறிவார்கள் என்பதைக் இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: כָּל הַקָּהָל הַזֶּה
  choice: இந்தக் கூட்டத்தார் அனைவரும்
  rationale: கָהָל என்பது இப்போர்க்களத்தில் கூடியிருப்போரைக் குறிக்கிறது. சமயச் சாயல் ஏற்படக்கூடிய ‘சபை’ என்பதைவிட ‘கூட்டத்தார்’ இச்சூழலுக்கு இயல்பானது; அனைவரும் என்பது כָּל என்பதைக் காட்டுகிறது.
- source_word: לֹא בְּחֶרֶב וּבַחֲנִית
  choice: வாளினாலோ ஈட்டியினாலோ ... இல்லை
  rationale: בְּ கருவி அல்லது வழிமுறையைக் குறிக்கிறது. எதிர்மறை வாக்கியத்தில் ‘-ஆலோ ... -ஆலோ’ என்பது வாள், ஈட்டி ஆகிய இரண்டினாலும் அல்ல என்ற பொருளை இயல்பாகத் தருகிறது.
- source_word: יְהוֹשִׁיעַ
  choice: மீட்பதில்லை
  rationale: ישׁע என்பதன் Hiphil வடிவம் காப்பாற்றுதல் அல்லது விடுவித்தல் என்ற விரிவான பொருளைக் கொண்டது. ‘மீட்பது’ போர்ச் சூழலிலுள்ள விடுதலையையும் சொல்லின் பரந்த இறையியல் ஒலிப்பையும் காக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய தனிப்பெயரான יהוה ஒரு பட்டப்பெயரால் மாற்றப்படாமல், தமிழில் பரவலாக அறியப்படும் ‘யாவே’ என்ற ஒலிபெயர்ப்பில் தரப்படுகிறது.
- source_word: כִּי לַיהוָה הַמִּלְחָמָה
  choice: ஏனெனில், போர் யாவேக்குரியது
  rationale: இரண்டாவது כִּי காரணத்தை அறிமுகப்படுத்துகிறது; לַיהוָה உடைமை அல்லது உரிமையைத் தெரிவிக்கிறது. இந்த மொழிபெயர்ப்பு போரின் முடிவு யாவேவின் அதிகாரத்தில் இருப்பதைத் தெளிவாகக் காக்கிறது.
- source_word: וְנָתַן
  choice: அவர் ... ஒப்புக்கொடுப்பார்
  rationale: வடிவத்தில் qatal ஆனாலும், வருங்காலத்தை நோக்கிய உரையில் இது உறுதியான முன்னறிவிப்பாகச் செயல்படுகிறது. ‘ஒப்புக்கொடுப்பார்’ என்பது எதிரியை மற்றவரின் அதிகாரத்துக்குள் கொடுப்பதைக் காட்டுகிறது.
- source_word: אֶתְכֶם בְּיָדֵנוּ
  choice: உங்களை எங்கள் கையில்
  rationale: ‘கையில் கொடுத்தல்’ என்பது ஒருவரின் அதிகாரத்துக்குள் ஒப்புக்கொடுத்தல் என்ற எபிரெய மரபுத்தொடர். ஒருமை ‘கை’ மூலத்தின் வடிவத்தையும் தமிழில் புரிந்துகொள்ளத்தக்க உருவகத்தையும் காக்கிறது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலவசனம் நான்கெழுத்து இறைப்பெயரை நேரடியாகப் பயன்படுத்துகிறது. ‘யாவே’ என்பது அதை ஒரு பட்டப்பெயராக மாற்றாமல் தனிப்பெயராகக் காக்கிறது.
- issue: יְהוֹשִׁיעַ என்பதன் போர்ச் சூழலிலான பொருள்
  choice: மீட்பதில்லை
  alternative: விடுவிப்பதில்லை; வெற்றியளிப்பதில்லை
  rationale: சூழல் போரில் கிடைக்கும் விடுதலையைச் சுட்டினாலும், ‘வெற்றியளித்தல்’ என்று குறுக்காமல் மூலவினையின் பரந்த காப்பாற்றுதல் அல்லது மீட்டல் பொருளைக் காக்கிறது.
- issue: לַיהוָה הַמִּלְחָמָה என்பதிலுள்ள உடைமை அமைப்பு
  choice: போர் யாவேக்குரியது
  alternative: போர் யாவேவுடையது
  rationale: போர் யாவேவின் அதிகாரத்துக்கும் தீர்மானத்துக்கும் உரியது என்ற மூலத்தின் சுருக்கமான கூற்றைத் தீர்த்து விரிவாக்காமல் காக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. போர்க்களச் சூழலுக்கு ஏற்ற ‘கூட்டத்தார்’, ‘போர்’, ‘ஈட்டி’ போன்ற சொற்கள் பயன்படுத்தப்பட்டுள்ளன. எபிரெய மரபுத்தொடரான ‘எங்கள் கையில்’ முதன்மை உரையில் பாதுகாக்கப்பட்டு அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது.
