base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/011.yaml
  text: When Saul and all Israel heard these words of the Philistine[a], they were dismayed and greatly afraid.
translation:
  language: ta
  text: சவுலும் இஸ்ரவேலர் அனைவரும் அந்தப் பெலிஸ்தியன் சொன்ன இந்த வார்த்தைகளைக் கேட்டபோது, மனந்தளர்ந்து மிகவும் பயந்தார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: கேட்டபோது
  rationale: שׁמע என்பதன் இயல்பான பொருள் ‘கேள்’; தொடர்ச்சியான எபிரெயக் கதையமைப்பைத் தமிழில் இயல்பான காலச் சார்பு வாக்கியமாக வழங்குகிறது.
- source_word: שָׁאוּל
  choice: சவுல்
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் பரவலாக அறியப்படும் பெயர்வடிவம்.
- source_word: וְכָל יִשְׂרָאֵל
  choice: இஸ்ரவேலர் அனைவரும்
  rationale: ‘இஸ்ரவேல் முழுவதும்’ என்ற கூட்டுப்பொருளை, இங்கு படையினரைக் குறிக்கும் சூழலுக்கேற்ற இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: דִּבְרֵי הַפְּלִשְׁתִּי הָאֵלֶּה
  choice: அந்தப் பெலிஸ்தியனின் இந்த வார்த்தைகள்
  rationale: பேசப்பட்டவற்றை ‘வார்த்தைகள்’ என நேரடியாக வழங்கி, பெயர்ச்சொல்லின் குறிப்புத்தன்மையையும் ‘இந்த’ என்ற சுட்டையும் காக்கிறது.
- source_word: וַיֵּחַתּוּ
  choice: மனந்தளர்ந்து
  rationale: חתת இச்சூழலில் திகைப்பு, மனமுறிவு அல்லது மனந்தளர்ச்சி அடைவதைக் குறிக்கிறது; அடுத்துள்ள பயம் என்ற வினையுடன் தேவையற்ற மறுபடிதலைத் தவிர்த்து இயல்பாக அமைகிறது.
- source_word: וַיִּירְאוּ מְאֹד
  choice: மிகவும் பயந்தார்கள்
  rationale: ירא என்பதன் ‘பயப்படு’ என்ற நேரடிப் பொருளையும் מְאֹד தரும் தீவிரத்தையும் தெளிவாகக் காக்கிறது.
theological_decisions: []
translation_notes:
  register: நவீனத் தரமான, எளிதில் புரியும், மரியாதைமிக்க கதைநடை. எபிரெய தொடர்வினை அமைப்பு தமிழில் இயல்பாக ‘கேட்டபோது ... மனந்தளர்ந்து ... பயந்தார்கள்’ என வழங்கப்பட்டது.
