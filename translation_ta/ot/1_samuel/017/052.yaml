  text: וַ/יָּקֻ֣מוּ אַנְשֵׁי֩ יִשְׂרָאֵ֨ל וִ/יהוּדָ֜ה וַ/יָּרִ֗עוּ וַֽ/יִּרְדְּפוּ֙ אֶת הַ/פְּלִשְׁתִּ֔ים עַד בּוֹאֲ/ךָ֣ גַ֔יְא וְ/עַ֖ד שַׁעֲרֵ֣י עֶקְר֑וֹן וַֽ/יִּפְּל֞וּ חַֽלְלֵ֤י פְלִשְׁתִּים֙ בְּ/דֶ֣רֶךְ שַׁעֲרַ֔יִם וְ/עַד גַּ֖ת וְ/עַד עֶקְרֽוֹן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/052.yaml
  text: Then the men of Israel and Judah rose up and shouted[a], and they pursued the Philistines as far as Gai and as far as the gates of Ekron. The slain Philistines fell along the road to Shaaraim[b], as far as Gath and as far as Ekron.
translation:
  language: ta
  text: அப்போது இஸ்ரவேல் மற்றும் யூதாவின் ஆண்கள் எழுந்து போர்முழக்கமிட்டு[a], பெலிஸ்தியர்களைப் பள்ளத்தாக்கின் நுழைவிடம்[b] வரையிலும் எக்ரோனின் வாசல்கள் வரையிலும் துரத்தினார்கள். கொல்லப்பட்ட பெலிஸ்தியர்கள் ஷாராயிமுக்குச் செல்லும் வழிநெடுகிலும், காத் வரையிலும் எக்ரோன் வரையிலும் விழுந்துகிடந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘உரக்கக் கத்தி.’ இங்குள்ள எபிரெய வினைச்சொல் போருக்குரிய முழக்கத்தைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயில் எழுத்துப்படியான பொருள், ‘பள்ளத்தாக்கிற்குள் நீ வரும் வரை.’ இச்சொற்றொடர் உரை மற்றும் இலக்கண ரீதியில் கடினமானது; சிலர் ‘காய் வரை’ என்று இதை ஓர் இடப்பெயராகப் புரிந்துகொள்கிறார்கள்.
    reason: textual_variant
lexical_decisions:
- source_word: וַיָּקֻמוּ
  choice: எழுந்து
  rationale: קום என்பதன் தொடர் நிகழ்வைக் குறிக்கும் வடிவம்; கோலியாத் வீழ்ந்ததும் படைவீரர்கள் உடனே செயல்படத் தொடங்கியதை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: אַנְשֵׁי יִשְׂרָאֵל וִיהוּדָה
  choice: இஸ்ரவேல், யூதா வீரர்கள்
  rationale: மூலத்தில் ‘இஸ்ரவேல் மற்றும் யூதாவின் ஆண்கள்’ என்று இருந்தாலும், இங்கு போர்க்களச் சூழல் என்பதால் ‘வீரர்கள்’ என்பது பாலினத்தையும் சூழலையும் இயல்பாகக் காட்டுகிறது.
- source_word: וַיָּרִיעוּ
  choice: போர்முழக்கமிட்டு
  rationale: רוע இச்சூழலில் சாதாரணமாகக் கத்துவதைக் காட்டிலும் போருக்குரிய உரத்த முழக்கத்தைக் குறிக்கிறது.
- source_word: וַיִּרְדְּפוּ
  choice: துரத்தினார்கள்
  rationale: רדף என்பதன் படைச்சூழலுக்குரிய இயல்பான, துல்லியமான தமிழ் இணை.
- source_word: עַד בּוֹאֲךָ גַיְא
  choice: பள்ளத்தாக்கின் நுழைவிடம் வரையிலும்
  rationale: சொற்றொடர் இலக்கண ரீதியிலும் உரை ரீதியிலும் கடினமானது. גיא என்பதன் வழக்கமான பொருளான ‘பள்ளத்தாக்கு’ என்பதையும், בואך என்பதன் எல்லை அல்லது அணுகுமிடம் சார்ந்த பயன்பாட்டையும் இணைத்து வாசிக்கத்தக்க தமிழில் தரப்பட்டுள்ளது; ஐயம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: וְעַד שַׁעֲרֵי עֶקְרוֹן
  choice: எக்ரோனின் வாசல்கள் வரையிலும்
  rationale: நகரத்தின் நுழைவாயில்கள் வரை சென்ற பின்தொடர்தலின் புவியியல் எல்லையை நேரடியாகக் காட்டுகிறது.
- source_word: וַיִּפְּלוּ חַלְלֵי פְלִשְׁתִּים
  choice: பெலிஸ்தியர்களில் கொல்லப்பட்டவர்கள் ... விழுந்துகிடந்தார்கள்
  rationale: חַלְלֵי என்பது வெறுமனே காயமடைந்தவர்களை அல்ல, போரில் குத்துண்டு அல்லது வெட்டுண்டு கொல்லப்பட்டவர்களைக் குறிக்கிறது. ‘விழுந்துகிடந்தார்கள்’ என்பது பாதையெங்கும் கிடந்த சடலங்களைக் கடுமையைக் கூட்டாமல் தெளிவாகச் சொல்கிறது.
- source_word: בְּדֶרֶךְ שַׁעֲרַיִם
  choice: ஷாராயிமுக்குச் செல்லும் வழிநெடுகிலும்
  rationale: בדרך உடன் வரும் இடப்பெயர் அந்த இடத்தை நோக்கிச் செல்லும் பாதையைக் குறிக்கிறது; ‘வழிநெடுகிலும்’ என்பது பலர் பாதையில் வீழ்ந்திருந்ததை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: שַׁעֲרַיִם
  choice: ஷாராயிம்
  rationale: இடப்பெயர் மொழிபெயர்க்கப்படாமல், எபிரெய ஒலிப்புக்கு நெருக்கமாகத் தமிழில் எழுத்துப்பெயர்க்கப்பட்டுள்ளது.
- source_word: וְעַד גַּת וְעַד עֶקְרוֹן
  choice: காத் வரையிலும் எக்ரோன் வரையிலும்
  rationale: மூலத்தின் இருமுறை வரும் עַד என்பதைக் ‘வரையிலும்’ என்று இருமுறையும் வழங்கி, இழப்புகள் பரவியிருந்த எல்லையைப் பாதுகாக்கிறது.
