translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளும் மரியாதையான வரலாற்று-விவரிப்பு நடை பயன்படுத்தப்பட்டுள்ளது. படைச்சூழலைத் தெளிவாக்க ‘ஆண்கள்’ என்பதற்குப் பதிலாக ‘வீரர்கள்’ என்றும், רוע என்பதற்கு ‘போர்முழக்கமிட்டு’ என்றும் வழங்கப்பட்டுள்ளது. கடினமான புவியியல் சொற்றொடரின் ஐயம் அடிக்குறிப்பில் வெளிப்படையாகப் பாதுகாக்கப்பட்டுள்ளது.
