translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையான, கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘பார்த்து, ... கண்டான்’ என்ற தொடரால் மூல எபிரெயத்தில் உள்ள இரு தனித்த வினைகளும் காக்கப்பட்டுள்ளன; நிறத்தைக் குறிக்கும் சொல்லின் உண்மையான பொருள் தெளிவின்மை அடிக்குறிப்பில் வெளிப்படுத்தப்பட்டுள்ளது.
