  text: וַ/יַּבֵּ֧ט הַ/פְּלִשְׁתִּ֛י וַ/יִּרְאֶ֥ה אֶת דָּוִ֖ד וַ/יִּבְזֵ֑/הוּ כִּֽי הָיָ֣ה נַ֔עַר וְ/אַדְמֹנִ֖י עִם יְפֵ֥ה מַרְאֶֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/042.yaml
  text: When the Philistine looked and saw David[a], he despised him, because he was a youth, ruddy and handsome in appearance.
translation:
  language: ta
  text: அந்தப் பெலிஸ்தியன் பார்த்து, தாவீதைக் கண்டான். தாவீது ஓர் இளைஞனாகவும், சிவந்த நிறமுடையவனாகவும்[a], அழகிய தோற்றமுடையவனாகவும் இருந்ததால், அவனை இகழ்ந்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘செந்நிற முடி கொண்டவனாகவும்’; எபிரெயப் பெயரடை பொதுவாகச் சிவப்புச் சாயலைக் குறிக்கலாம்; அது முடியின் நிறத்தை மட்டுமே குறிக்க வேண்டியதில்லை.
    reason: אַדְמֹנִי என்ற சொல்லின் நிறக் குறிப்பு துல்லியமாக எதைக் குறிக்கிறது என்பது தெளிவாக இல்லாததால், சாத்தியமான மாற்றுப் பொருள் வழங்கப்படுகிறது.
lexical_decisions:
- source_word: וַיַּבֵּט
  choice: பார்த்து
  rationale: נבט என்பது பார்வையைச் செலுத்துவதைக் குறிக்கிறது. அடுத்து வரும் ‘கண்டான்’ என்ற வினையிலிருந்து இதை வேறுபடுத்தி, எபிரெய உரையின் வினைத் தொடரை இயல்பான தமிழில் காக்கிறது.
- source_word: הַפְּלִשְׁתִּי
  choice: அந்தப் பெலிஸ்தியன்
  rationale: எபிரெய உரை இங்கு கோலியாத்தை பெயராலோ ‘வீரன்’ என்ற அடைமொழியாலோ குறிப்பிடாமல், இனப்பெயரால் மட்டுமே குறிப்பிடுகிறது; ‘அந்த’ என்பது முன்பே அறிமுகமான நபரைத் தமிழில் இயல்பாகச் சுட்டுகிறது.
- source_word: וַיִּרְאֶה אֶת דָּוִד
  choice: தாவீதைக் கண்டான்
  rationale: ראה என்பதன் பொதுவான பொருள் ‘காணுதல்’. முந்தைய ‘பார்த்து’ என்பதற்குப் பின் வரும் நிகழ்வுத் தொடரும் இவ்வாறு காக்கப்படுகிறது.
- source_word: וַיִּבְזֵהוּ
  choice: அவனை இகழ்ந்தான்
  rationale: בזה என்பது ஒருவரைத் தாழ்வாகக் கருதி அலட்சியம் அல்லது வெறுப்பு காட்டுவதைக் குறிக்கிறது. ‘இகழ்ந்தான்’ சுருக்கமாகவும் இயல்பாகவும் தனிநபர் சுட்டுப்பொருளையும் காக்கிறது.
- source_word: כִּי
  choice: இருந்ததால்
  rationale: כִּי இங்கு பெலிஸ்தியன் தாவீதை இகழ்ந்ததற்கான காரணத்தை அறிமுகப்படுத்துகிறது. காரணத் தொடர்பைத் தமிழில் தெளிவாக வெளிப்படுத்த ‘இருந்ததால்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: הָיָה נַעַר
  choice: ஓர் இளைஞனாக ... இருந்ததால்
  rationale: נַעַר என்பது சூழலுக்கேற்ப சிறுவன், இளைஞன், அல்லது இளம் மனிதன் எனப் பொருள்படும். தாவீதைச் சிறு குழந்தையாகக் காட்டாமல் அவனுடைய இளமையைத் தெரிவிக்க ‘இளைஞன்’ பொருத்தமானது.
- source_word: אַדְמֹנִי
  choice: சிவந்த நிறமுடையவன்
  rationale: இந்தப் பெயரடை சிவப்பு அல்லது செந்நிறச் சாயலைக் குறிக்கிறது; அது முகநிறத்தையோ பொதுவான உடல் நிறத்தையோ முடி நிறத்தையோ குறிக்கக்கூடும். ‘சிவந்த நிறமுடையவன்’ அந்தத் தெளிவின்மையைப் பாதுகாக்கிறது.
- source_word: עִם יְפֵה מַרְאֶה
  choice: அழகிய தோற்றமுடையவன்
  rationale: சொற்றொடர் நல்ல அல்லது அழகிய தோற்றத்தைக் குறிக்கிறது. ‘அழகிய தோற்றமுடையவன்’ என்பது மரியாதையான நவீனத் தமிழில் இயல்பாகவும் மூலத்தின் விளக்கத் தன்மைக்கு நெருக்கமாகவும் உள்ளது.
