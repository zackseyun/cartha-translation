  text: Then he turned away from him toward another and said the same thing[a], and the people answered him as before.
translation:
  language: ta
  text: பின்பு அவன் அவனைவிட்டு வேறொருவரை நோக்கித் திரும்பி, அதே காரியத்தைச் சொன்னான்; மக்களும் அவர்கள் முன்பு கூறியதுபோலவே அவனுக்குப் பதிலளித்தார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லர்த்தமாக, “மக்கள் முதல் வார்த்தையைப் போன்ற வார்த்தையால் அவனுக்குப் பதிலளித்தார்கள்”; அதாவது, முன்பு அளித்த அதே பதிலை மீண்டும் கூறினார்கள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסֹּב מֵאֶצְלוֹ
  choice: அவனைவிட்டு ... திரும்பி
  rationale: சவுல் அல்ல, முந்தைய வசனத்தில் பேசின எலியாபிடமிருந்து தாவீது விலகி மற்றொருவரை நோக்கித் திரும்பிய உடல் இயக்கத்தையும் உரையாடல் மாற்றத்தையும் இயல்பாகத் தெரிவிக்கிறது.
- source_word: אֶל מוּל אַחֵר
  choice: வேறொருவரை நோக்கி
  rationale: מוּל என்பதிலுள்ள எதிர்நோக்கும் திசைநுட்பத்தைக் காக்கும் இயல்பான தமிழ் சொற்றொடர்.
- source_word: וַיֹּאמֶר כַּדָּבָר הַזֶּה
  choice: அதே காரியத்தைக் கேட்டான்
  rationale: சொல்லர்த்தமாக 'இதே வார்த்தையின்படி சொன்னான்'; சூழலில் தாவீது முன்பு கேட்ட கேள்வியையே மற்றொருவரிடமும் கேட்கிறான். ஆகவே தமிழில் 'கேட்டான்' என்பது பேச்சுச் செயலைத் தெளிவாக்குகிறது.
- source_word: וַיְשִׁבֻהוּ הָעָם
  choice: மக்களும் ... அவனுக்குப் பதிலளித்தார்கள்
  rationale: שׁוב என்பதன் இச்செயப்பாட்டு வடிவம் இங்கு பதில் கூறுதலைக் குறிக்கிறது; הָעָם என்பதை தேவையின்றி 'வீரர்கள்' என்று குறுக்காமல் 'மக்கள்' என வைத்துள்ளது.
- source_word: דָּבָר כַּדָּבָר הָרִאשׁוֹן
  choice: முன்பு சொன்னதுபோலவே
  rationale: சொல்லர்த்தமான 'முதல் வார்த்தையைப் போன்ற வார்த்தை' என்பது முந்தைய பதிலையே அவர்கள் மீண்டும் கூறியதைக் குறிக்கிறது; இயல்பான தமிழில் அதன் பொருளைச் சுருக்கமாகத் தருகிறது.
