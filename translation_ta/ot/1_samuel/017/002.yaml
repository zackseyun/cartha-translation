  yaml_path: translation/ot/1_samuel/017/002.yaml
  text: And Saul and the men of Israel gathered together and camped in the Valley of Elah[a], and they drew up for battle against the Philistines.
translation:
  language: ta
  text: சவுலும் இஸ்ரவேல் ஆண்களும் ஒன்றுகூடி, ஏலா பள்ளத்தாக்கில் முகாமிட்டு, பெலிஸ்தியரை எதிர்கொள்ளப் போரணிவகுத்து நின்றார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பெலிஸ்தியருக்கு எதிராக” / “பெலிஸ்தியருக்கு எதிரே.”
    reason: לִקְרַאת என்பதற்கான ‘எதிர்கொள்ள,’ ‘எதிராக,’ ‘எதிரே’ ஆகிய சூழல்சார் மாற்றுப் பொருள்களைப் பதிவு செய்கிறது.
lexical_decisions:
- source_word: וְשָׁאוּל
  choice: சவுலும்
  rationale: இணைப்புச் சொல் முந்தைய நிகழ்வுடன் தொடர்ச்சியை ஏற்படுத்துகிறது; தமிழில் ‘-உம்’ இயல்பாக அந்த இணைப்பைப் பேணுகிறது.
- source_word: וְאִישׁ יִשְׂרָאֵל
  choice: இஸ்ரவேல் வீரர்களும்
  rationale: ஒருமை வடிவிலுள்ள אִישׁ இங்கு கூட்டுப்பொருளில் இஸ்ரவேல் ஆண்களைக், குறிப்பாகப் போருக்குத் திரண்டவர்களைக் குறிக்கிறது; சூழலுக்கேற்ற இயல்பான தமிழாக ‘வீரர்கள்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: נֶאֶסְפוּ
  choice: ஒன்றுகூடி
  rationale: நிபால் வடிவத்தின் கூடிவருதல் அல்லது திரளுதல் என்ற கூட்டுச் செயற்பாட்டைப் புரிந்துகொள்ளத்தக்க நவீன தமிழில் தெரிவிக்கிறது.
- source_word: וַיַּחֲנוּ
  choice: முகாமிட்டு
  rationale: படையினர் ஓரிடத்தில் முகாம் அமைத்ததை இயல்பாகவும் சுருக்கமாகவும் குறிக்கிறது.
- source_word: בְּעֵמֶק הָאֵלָה
  choice: ஏலா பள்ளத்தாக்கில்
  rationale: עֵמֶק என்பதற்கு ‘பள்ளத்தாக்கு’ பொருத்தமானது; הָאֵלָה இங்கு இடப்பெயராக ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: וַיַּעַרְכוּ מִלְחָמָה
  choice: போரணிவகுத்து நின்றார்கள்
  rationale: சொற்றொடர் போருக்காகப் படைகளை ஒழுங்குபடுத்தி அணிவகுத்தல் என்னும் இராணுவப் பொருளைக் கொண்டது; வெறும் ‘போருக்குத் தயாரானார்கள்’ என்பதைவிட மூலத்தின் காட்சியை நெருக்கமாகப் பேணுகிறது.
- source_word: לִקְרַאת פְּלִשְׁתִּים
  choice: பெலிஸ்தியரை எதிர்கொள்ள
  rationale: לִקְרַאת என்பதன் ‘சந்திக்க/எதிர்கொள்ள/எதிரே’ என்ற பொருள் வரம்பையும் இங்குள்ள பகைமைச் சூழலையும் பேணுகிறது; ‘எதிராக’ என மட்டும் மொழிபெயர்ப்பதைவிட மூலத்தின் வடிவத்துக்கு நெருக்கமானது.
