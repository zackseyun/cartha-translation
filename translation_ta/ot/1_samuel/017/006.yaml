translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகருக்குப் புரியக்கூடியதும் கண்ணியமானதுமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘Greaves’ என்பதற்கு அரிதான தொழில்நுட்பச் சொல்லுக்குப் பதிலாக விளக்கமான ‘கீழ்க்கால் கவசங்கள்’ தேர்ந்தெடுக்கப்பட்டது. ஆயுதத்தின் நிலையை விளக்குவதற்காக மூலத்தில் இல்லாத ‘தொங்கவிடப்பட்ட’ என்ற கருத்து சேர்க்கப்படவில்லை.
