  yaml_path: translation/ot/1_samuel/017/006.yaml
  text: And he had bronze greaves on his legs[a], and a bronze javelin between his shoulders.
translation:
  language: ta
  text: அவன் கால்களில் வெண்கலக் கீழ்க்கால் கவசங்களை அணிந்திருந்தான்; அவன் தோள்களுக்கு இடையில் ஒரு வெண்கல எறியீட்டி[a] இருந்தது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘வெண்கல ஈட்டி’. எபிரேயச் சொல் இலகுவான ஈட்டி போன்ற ஓர் ஆயுதத்தைக் குறிக்கலாம். வேறுவகையான ஆயுதம் என்றும் சிலர் புரிந்துகொள்கிறார்கள்; ஆனால் இச்சூழலில் ‘எறியீட்டி’ என்பது சிறப்பாகப் பொருந்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִצְחַת
  choice: கீழ்க்கால் கவசங்கள்
  rationale: இந்தச் சொல் முழங்காலுக்குக் கீழேயுள்ள கால்பகுதியைப் பாதுகாக்கும் கவசத்தைக் குறிக்கிறது. நவீனத் தமிழில் ‘கீழ்க்கால் கவசங்கள்’ என்பது பொருளைத் தெளிவாகவும் வரலாற்றுச் சூழலுக்கு ஏற்றவாறும் தெரிவிக்கிறது.
- source_word: נְחֹשֶׁת
  choice: வெண்கலம்
  rationale: பண்டைய போர்க்கருவிகள் மற்றும் கவசங்களின் சூழலில் இந்தச் சொல் பொதுவாக வெண்கலத்தைக் குறிக்கிறது; ‘பித்தளை’ வரலாற்றுக் காலத்துக்கு ஒவ்வாததாக இருக்கக்கூடும்.
- source_word: עַל רַגְלָיו
  choice: அவன் கால்களில்
  rationale: רֶגֶל என்பது பாதத்தையோ காலையோ குறிக்கலாம்; கீழ்க்கால் கவசங்கள் அணியப்படும் இடம் என்பதால் இங்கு ‘கால்களில்’ இயல்பானது.
- source_word: כִידוֹן
  choice: எறியீட்டி
  rationale: இந்தச் சொல் ஈட்டியைப் போன்ற, எறியக்கூடிய இலகுவான ஆயுதத்தைக் குறிக்கலாம். இதே பகுதியில் பின்னர் குறிப்பிடப்படும் பெரிய ஈட்டியிலிருந்து இதை வேறுபடுத்த ‘எறியீட்டி’ பொருத்தமானது; இருப்பினும் ‘ஈட்டி’ என்பதும் சாத்தியம்.
- source_word: בֵּין כְּתֵפָיו
  choice: அவன் தோள்களுக்கு இடையில்
  rationale: எபிரேய உரையின் ‘அவன் தோள்களுக்கு இடையில்’ என்ற உருவகத்தைப் பாதுகாக்கிறது. ஆயுதம் முதுகில் சுமக்கப்பட்டிருந்ததாக இருக்கலாம்; ஆனால் ‘தொங்கவிடப்பட்டிருந்தது’ போன்ற விவரம் மூலத்தில் வெளிப்படையாக இல்லை.
