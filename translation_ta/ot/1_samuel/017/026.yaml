base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/026.yaml
  text: And David said to the men standing with him, “What will be done for the man who strikes down this Philistine and removes disgrace from Israel? For who is this uncircumcised Philistine, this one who has defied the battle lines of the living God?”
translation:
  language: ta
  text: தாவீது தன்னுடன் நின்றுகொண்டிருந்த ஆண்களிடம், “இந்தப் பெலிஸ்தியனை அடித்து வீழ்த்தி, இஸ்ரவேல்மீதிருந்த இழிவை நீக்குகிறவனுக்கு என்ன செய்யப்படும்? உயிருள்ள கடவுளின் போர்வரிசைகளைப் பழித்திருக்கிற இந்த விருத்தசேதனம் செய்யப்படாத பெலிஸ்தியன் யார்?” என்று கேட்டான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יַכֶּה
  choice: வீழ்த்தி
  rationale: இச்சூழலில் எதிரியைத் தாக்கிக் கொல்வதைக் குறிக்கிறது; தமிழில் இயல்பாகவும், வினையின் விளைவைத் தெளிவாகவும் தருகிறது.
- source_word: חֶרְפָּה
  choice: அவமானம்
  rationale: இஸ்ரவேல்மீது சுமத்தப்பட்ட பொதுப்பழியையும் இழிவையும் குறிக்கும் இயல்பான நவீனத் தமிழ் சொல்.
- source_word: הֶעָרֵל
  choice: விருத்தசேதனம் செய்யப்படாத
  rationale: உடன்படிக்கை அடையாளம் இல்லாதவன் என்ற இழிவூட்டும் அடையாளப்படுத்தலை விளக்கமாகவும் நேரடியாகவும் பாதுகாக்கிறது.
- source_word: מַעַרְכוֹת
  choice: போரணிகள்
  rationale: போருக்காக அணிவகுத்த படைத்தொகுதிகள் அல்லது போர்வரிசைகள் என்ற பன்மைப் பொருளைப் பாதுகாக்கிறது.
- source_word: אֱלֹהִים חַיִּים
  choice: உயிருள்ள கடவுள்
  rationale: எபிரேய மொழியின் நிலையான தெய்வீக அடைமொழியை இயல்பான தமிழில் நேரடியாகத் தருகிறது.
- source_word: חֵרֵף
  choice: பழித்த
  rationale: இகழ்தல், நிந்தித்தல், சவால்விடுதல் ஆகிய நிழற்பொருள்களில், இங்கு கடவுளின் படையணிகளை வாயால் அவமதித்த செயலைச் சுருக்கமாகக் காட்டுகிறது.
theological_decisions:
- issue: ‘விருத்தசேதனம் செய்யப்படாதவன்’ என்ற சொல்லின் உடன்படிக்கை சார்ந்த தாக்கம்
  choice: விருத்தசேதனம் செய்யப்படாத பெலிஸ்தியன்
  alternative: அந்நியப் பெலிஸ்தியன்
  rationale: மூலத்தின் உடல்சார்ந்த மற்றும் உடன்படிக்கை சார்ந்த சொல்லை பொதுவான ‘அந்நியன்’ என்று மென்மைப்படுத்தாமல் பாதுகாக்கிறது.
- issue: ‘உயிருள்ள கடவுளின் போரணிகள்’ என்பது படையையா கடவுளையா மையப்படுத்துகிறது
  choice: உயிருள்ள கடவுளின் போரணிகள்
  alternative: உயிருள்ள கடவுளுடைய படை
  rationale: மூலத்தில் உள்ள பன்மையையும், இஸ்ரவேலின் போர்வரிசைகள் கடவுளுக்குரியவை என்ற இறையியல் உரிமையையும் காக்கிறது.
- issue: כִּי ... כִּי அமைப்பின் உறவு
  choice: முதல் கேள்விக்குப் பின் காரண/வியப்புத் தொனியுள்ள இரண்டாவது கேள்வியாக வழங்கப்பட்டது
  alternative: ‘அவன் ... பழிப்பதற்கு யார்?’ என்ற நோக்கவாக்கியம்
  rationale: எபிரேயத்தின் தீவிர வினாவையும் இயல்பான தமிழ் நடையையும் காக்கிறது; கோலியாத்தின் செயலை அனுமதி குறிக்கும் வகையில் மாற்றவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழ்; மரியாதைமிக்க ஆனால் பொதுவாசகர்களுக்கு எளிதான நடை. ‘ஆண்கள்’, ‘போரணிகள்’, ‘விருத்தசேதனம்’ ஆகியவை மூலத்தின் குறிப்புத்தன்மையைப் பாதுகாக்கத் தேர்ந்தெடுக்கப்பட்டன.
