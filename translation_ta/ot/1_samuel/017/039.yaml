translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் dignified நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘சோதித்துப் பார்த்தல்’ என்பது வெறும் பழக்கமின்மை என்று விளக்கிவிடாமல், எபிரெய נסה வினையின் சோதனை/அனுபவ ambiguity-ஐக் காக்கிறது. ‘சவுல்’ என்ற பெயர்வடிவம் தமிழ் வேதாகமப் பயன்பாட்டோடு இயைகிறது.
