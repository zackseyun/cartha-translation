base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/039.yaml
  text: And David strapped his sword over his armor and tried to go[a], for he had not tested them. But David said to Saul, “I cannot go with these[b], for I have not tested them.” So David removed them from himself.
translation:
  language: ta
  text: தாவீது தன் கவச உடைக்கு[b] மேல் வாளைக் கட்டிக்கொண்டு நடந்து பார்க்க முயன்றான்[a]; ஏனெனில் அவற்றை அவன் முன்பு சோதித்துப் பார்த்திருக்கவில்லை. ஆனால் தாவீது சவுலிடம், “இவற்றை அணிந்துகொண்டு என்னால் போக முடியாது; ஏனெனில் இவற்றை நான் சோதித்துப் பார்த்ததில்லை” என்றான். எனவே தாவீது அவற்றைக் கழற்றிவிட்டான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “நடந்து பார்க்கத் தொடங்கினான்” அல்லது “போக முனைந்தான்” என்றும் மொழிபெயர்க்கலாம்; எபிரெயச் சொற்றொடர் ஒன்றை மேற்கொள்வது, அதற்கு முனைவது அல்லது முயன்று பார்ப்பது ஆகிய பொருள்களைத் தரக்கூடும்.
    reason: lexical_alternative
  - marker: b
    text: “கவச உடை” என்று மொழிபெயர்க்கப்பட்ட எபிரெயச் சொல் பொதுவாக உடைகள் அல்லது அணியும் ஆடைகள் என்றும் பொருள்படலாம்; ஆனால் இங்குள்ள போர்ச் சூழல் கவச உடையைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּחְגֹּר
  choice: கட்டிக்கொண்டு
  rationale: חגר என்பது ஆயுதத்தை இடுப்பில் கட்டிக்கொள்வதையோ அணிந்துகொள்வதையோ குறிக்கிறது; வாளைப் பற்றிய இச்சூழலில் ‘கட்டிக்கொண்டு’ என்பது இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: חַרְבּוֹ
  choice: தன் வாள்
  rationale: חֶרֶב என்பதன் வழக்கமான பொருள் ‘வாள்’; மூன்றாம் ஆண்பால் ஒருமை பின்னொட்டு தாவீதின் உடைமையைக் குறிக்கிறது.
- source_word: מֵעַל לְמַדָּיו
  choice: தன் கவச உடைக்கு மேல்
  rationale: מַדִּים என்பது உடை அல்லது அணிகலனைக் குறிக்கக்கூடும்; முந்தைய வசனத்தில் சவுலின் போர்க் கவசம் தாவீதுக்கு அணிவிக்கப்பட்டதால் இங்கு ‘கவச உடை’ சூழலுக்கு ஏற்றது. ‘மேல்’ என்ற சொல் எபிரெய முன்னிடைச்சொல்லின் இடத்தொடர்பைக் காக்கிறது.
- source_word: וַיֹּאֶל לָלֶכֶת
  choice: நடந்து பார்க்க முயன்றான்
  rationale: יאל + வினையெச்ச அமைப்பு ஒன்றை மேற்கொள்ளுதல் அல்லது முயன்று பார்த்தல் எனப் பொருள்படலாம். அறிமுகமில்லாத கவசத்தில் தாவீது நகர்ந்து பார்க்கும் கதையோட்டத்தை இம்மொழிபெயர்ப்பு இயல்பாக வெளிப்படுத்துகிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: כִּי לֹא נִסָּה
  choice: ஏனெனில் அவற்றை அவன் முன்பு சோதித்துப் பார்த்திருக்கவில்லை
  rationale: נסה என்பதன் பியேல் வடிவம் ‘சோதித்தல், முயன்று பார்த்தல்’ எனப் பொருள்படும். தமிழில் மறைபொருளாக உள்ள பன்மைச் செயப்படுபொருளை ‘அவற்றை’ என்று வெளிப்படுத்துவது கவசத்தையும் ஆயுதங்களையும் தெளிவாகச் சுட்டுகிறது; ‘முன்பு’ என்பது நிறைவுற்ற அனுபவமின்மையை இயல்பாக உணர்த்துகிறது.
- source_word: לֹא אוּכַל לָלֶכֶת בָּאֵלֶּה
  choice: இவற்றை அணிந்துகொண்டு என்னால் போக முடியாது
  rationale: הלך இங்கு நகர்தல் அல்லது போருக்குப் போதல் என்ற விரிவான பொருளைக் கொண்டது. בָּאֵלֶּה என்பதன் கருவி/சூழ்நிலை உறவைத் தமிழில் ‘இவற்றை அணிந்துகொண்டு’ என்பது தெளிவாக வெளிப்படுத்துகிறது.
- source_word: לֹא נִסִּיתִי
  choice: இவற்றை நான் சோதித்துப் பார்த்ததில்லை
  rationale: முந்தைய נסה வினையின் முதலாம் நபர் வடிவம் என்பதால் அதே ‘சோதித்துப் பார்த்தல்’ என்ற சொல்லாக்கம் தொடர்ச்சியாக வைக்கப்படுகிறது.
- source_word: וַיְסִרֵם ... מֵעָלָיו
  choice: அவற்றைக் கழற்றிவிட்டான்
  rationale: סור என்பதன் ஹிஃபில் வடிவம் அகற்றுதலைக் குறிக்கிறது. அணிந்திருந்த போர்ச் சாதனங்களை உடலிலிருந்து நீக்கும் செயலைத் தமிழில் ‘கழற்றிவிட்டான்’ இயல்பாகவும் சுருக்கமாகவும் தெரிவிக்கிறது.
