  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: צֹאנְ/כֶ֖ם יַעְשֹׂ֑ר וְ/אַתֶּ֖ם תִּֽהְיוּ ל֥/וֹ לַ/עֲבָדִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/008/017.yaml
  text: He will take a tenth of your flocks[a], and you will become his servants.
translation:
  language: ta
  text: உங்கள் ஆட்டு மந்தைகளில் பத்தில் ஒன்றை அவன் எடுத்துக்கொள்வான்; நீங்களோ அவனுக்கு அடிமைகளாக இருப்பீர்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பணியாட்களாக.”
    reason: עֲבָדִים என்ற எபிரெயச் சொல் அடிமைகளையோ பணியாட்களையோ குறிக்கலாம்; இங்கு அரசனின் கட்டாய ஆதிக்கத்தைச் சூழல் வலியுறுத்துகிறது.
lexical_decisions:
- source_word: צֹאנְכֶם
  choice: உங்கள் ஆட்டு மந்தைகளில்
  rationale: צֹאן என்பது குறிப்பாகச் செம்மறியாடுகளையும் வெள்ளாடுகளையும் உள்ளடக்கிய சிறுகால்நடை மந்தைகளைக் குறிக்கிறது. தமிழில் ‘ஆட்டு மந்தைகள்’ என்பது இயல்பாகவும் கூட்டுப் பொருளைத் தக்கவைத்தும் உள்ளது.
- source_word: יַעְשֹׂר
  choice: பத்தில் ஒன்றை அவன் எடுத்துக்கொள்வான்
  rationale: இவ்வினை பத்தில் ஒன்றை வசூலிப்பதை அல்லது எடுத்துக்கொள்வதைச் சுட்டுகிறது. அரசனின் கட்டாயப் பறிப்பைப் பற்றிய சூழலில், வழிபாட்டுச் சார்ந்த அல்லது மனமுவந்த காணிக்கை என்ற எண்ணத்தைத் தவிர்க்க இவ்வாறு வெளிப்படையாக மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: וְאַתֶּם תִּהְיוּ לוֹ
  choice: நீங்களோ அவனுக்கு ... இருப்பீர்கள்
  rationale: எபிரெய உரையின் எளிய ‘இருத்தல்’ வினையைத் தக்கவைத்தபடியே, முந்தைய அரச நடவடிக்கைகளின் விளைவாக மக்களுக்கு ஏற்படும் நிலையை இச்சொற்றொடர் இயல்பான தமிழில் காட்டுகிறது.
- source_word: לַעֲבָדִים
  choice: அடிமைகளாக
  rationale: עֲבָדִים என்பதற்கு பணியாட்கள் என்றும் பொருள் வரலாம். ஆனால் அரசனின் கட்டாய வசூலும் மக்களின் சுதந்திர இழப்பும் வலியுறுத்தப்படும் இச்சூழலில் ‘அடிமைகள்’ என்பதே எச்சரிக்கையின் கடுமையைத் தெளிவாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: அரசனுக்குக் கீழ்ப்படுத்தப்படும் சூழலில் עֲבָדִים என்பதன் மொழிபெயர்ப்பு
  choice: அடிமைகளாக
  alternative: பணியாட்களாக
  rationale: இந்த வசனம் சாதாரணப் பணியை அல்ல, அரசனின் கோரிக்கைகளால் மக்கள் சுதந்திரத்தை இழந்து அவனுக்குக் கட்டுப்பட்டவர்களாகும் நிலையை எச்சரிக்கிறது. அதே நேரத்தில் மூலச்சொல்லின் பரந்த பொருள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் எச்சரிக்கையின் கடுமையைத் தக்கவைக்கும் வகையிலும் அமைக்கப்பட்டது. ‘தசமபாகம் வாங்குவான்’ போன்ற வழிபாட்டுச் சாயல் தரக்கூடிய சொல்லாக்கத்துக்குப் பதிலாக ‘பத்தில் ஒன்றை எடுத்துக்கொள்வான்’ பயன்படுத்தப்பட்டது.
