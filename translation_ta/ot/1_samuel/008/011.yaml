  to: 'அவர் கூறினார்: “உங்களை அரசாளப்போகிற அரசனின் நடைமுறை[a] இதுதான்: அவன் உங்கள் மகன்களை[b] எடுத்துக்கொண்டு, அவர்களைத் தன் தேர்ப்படையிலும் குதிரைப்படையிலும் தனக்காகப் பணியமர்த்துவான்; அவர்கள் அவனுடைய தேருக்கு[c] முன்னால் ஓடுவார்கள்.”'
