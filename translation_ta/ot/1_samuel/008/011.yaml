source:
  edition: WLC
  text: וַ/יֹּ֕אמֶר זֶ֗ה יִֽהְיֶה֙ מִשְׁפַּ֣ט הַ/מֶּ֔לֶךְ אֲשֶׁ֥ר יִמְלֹ֖ךְ עֲלֵי/כֶ֑ם אֶת בְּנֵי/כֶ֣ם יִקָּ֗ח וְ/שָׂ֥ם ל/וֹ֙ בְּ/מֶרְכַּבְתּ֣/וֹ וּ/בְ/פָרָשָׁ֔י/ו וְ/רָצ֖וּ לִ/פְנֵ֥י מֶרְכַּבְתּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/008/011.yaml
  text: 'He said[a], “This will be the custom of the king who will reign over you: he will take your sons and assign them to his chariots and among his horsemen[c][b], and they will run before his chariots.”'
translation:
  language: ta
  text: 'அவர் கூறினார்: “உங்களை அரசாளப்போகிற அரசனின் நடைமுறை[a] இதுதான்: அவன் உங்கள் மகன்களை[b] எடுத்துக்கொண்டு, அவர்களைத் தன் தேர்ப்படையிலும் குதிரைப்படையிலும் தனக்காகப் பணியமர்த்துவான்; அவர்கள் அவனுடைய தேருக்கு[c] முன்னால் ஓடுவார்கள்.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அரசனுக்குரிய சட்ட உரிமை’ என்றும் மொழிபெயர்க்கலாம். எபிரெயத்தில் உள்ள மிஷ்பாட் என்ற சொல் வழக்கமான நடைமுறை, சட்ட உரிமை, அல்லது நியாயத்தீர்ப்பு ஆகியவற்றைக் குறிக்கலாம்; இங்கு அரசன் மக்களிடம் பொதுவாக எவ்வாறு நடந்துகொள்வான் என்பதை விவரிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில் குறிப்பாக ‘உங்கள் மகன்கள்’ என்று உள்ளது; அரசனுடைய படைப் பணியைப் பற்றிய இந்தச் சூழலுக்கு அது பொருந்துகிறது.
    reason: cultural_note
  - marker: c
    text: முந்தைய இடத்திலும் இங்கும் எபிரெயச் சொல் இலக்கணப்படி ஒருமையில் உள்ளது. அது ஒரு தேரையோ, தொகுதிப்பொருளில் அரசனுடைய தேர்களையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשְׁפַּט
  choice: நடைமுறை
  rationale: இங்கு இச்சொல் நீதித்தீர்ப்பைக் குறிக்காமல், அரசன் மக்களிடம் வழக்கமாக நடந்துகொள்ளும் முறையைக் குறிக்கிறது. ‘நடைமுறை’ என்பது அரசனின் செயற்பாட்டை இயல்பான நவீன தமிழில் தெரிவிக்கிறது; அதேவேளை அது சட்டப்படி நியாயமான உரிமை என்று தீர்மானித்துவிடுவதில்லை.
- source_word: הַמֶּלֶךְ אֲשֶׁר יִמְלֹךְ עֲלֵיכֶם
  choice: உங்களை அரசாளப்போகிற அரசன்
  rationale: מָלַךְ என்பதன் அரசாட்சிச் சார்ந்த பொருளையும் עַל என்பதன் ‘உங்கள்மேல்’ என்ற ஆளுகை உறவையும் இயல்பான தமிழில் காக்கிறது.
- source_word: אֶת־בְּנֵיכֶם יִקָּח
  choice: அவன் உங்கள் மகன்களை எடுத்துக்கொண்டு
  rationale: בְּנֵיכֶם என்பது குறிப்பாக ஆண் பிள்ளைகளைக் குறிக்கிறது; அடுத்துவரும் அரசப் படைப் பணியின் சூழலுக்கும் ‘மகன்கள்’ பொருந்துகிறது. ‘எடுத்துக்கொண்டு’ என்பது அரசன் அவர்களைத் தன் சேவைக்காகக் கைப்பற்றுவதைத் தெளிவாக்குகிறது.
- source_word: וְשָׂם לוֹ
  choice: தனக்காகப் பணியமர்த்துவான்
  rationale: שׂים என்பதன் ‘வைத்தல்/நியமித்தல்’ பொருளையும் לוֹ என்பதன் ‘தனக்காக’ என்ற அரச சேவை நோக்கையும் வாசிக்க இயல்பான முறையில் வெளிப்படுத்துகிறது.
- source_word: בְּמֶרְכַּבְתּוֹ
  choice: தன் தேர்ப்படையில்
  rationale: எபிரெயச் சொல் ஒருமையில் இருந்தாலும் இங்கு தொகுதிப்பொருளில் தேர்களைக் கொண்ட அரசப் படைப்பிரிவைக் குறிக்கலாம். ‘தேர்ப்படை’ அந்த இராணுவச் சூழலைச் சுருக்கமாகவும் தெளிவாகவும் தருகிறது.
- source_word: וּבְפָרָשָׁיו
  choice: குதிரைவீரர்களின் நடுவில்
  rationale: פָרָשִׁים என்பது குதிரைவீரர்களை அல்லது குதிரைப்படையைக் குறிக்கிறது. ‘நடுவில்’ என்பது בְּ முன்னிடைச்சொல்லையும் அந்தப் படைப்பிரிவில் சேர்க்கப்படுவதையும் காக்கிறது.
- source_word: וְרָצוּ לִפְנֵי מֶרְכַּבְתּוֹ
  choice: அவர்கள் அவனுடைய தேருக்கு முன்னால் ஓடுவார்கள்
  rationale: அரசனுடைய தேருக்கு முன்னால் ஓடும் அரச சேவையாளர்களின் காட்சியை நேரடியாகப் பாதுகாக்கிறது. இறுதியில் உள்ள ஒருமை வடிவமும் தமிழில் ஒருமையாக வைக்கப்பட்டுள்ளது.
theological_decisions:
- issue: מִשְׁפַּט என்பது அரசனுக்குக் கடவுளால் அளிக்கப்பட்ட சட்ட உரிமையா, அல்லது அரசன் கடைப்பிடிக்கும் வழக்கமான செயல்முறையா?
  choice: முதன்மை உரையில் ‘நடைமுறை’
  alternative: ‘அரசனின் சட்ட உரிமை’ அல்லது ‘அரசனுக்குரிய உரிமை’
  rationale: இந்தப் பகுதி அரசன் மக்களிடம் என்ன செய்வான் என்ற எச்சரிக்கையாக அமைந்துள்ளது. ஆகவே அவனுடைய செயல்களைத் தெய்வீகமாக அங்கீகரிக்கப்பட்ட உரிமைகள் என முன்கூட்டியே தீர்மானிக்காமல், எபிரெயச் சொல்லின் வேறு சாத்தியத்தை அடிக்குறிப்பில் வைத்திருக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் dignified narrative register பயன்படுத்தப்பட்டுள்ளது. ‘அரசாளப்போகிற’, ‘பணியமர்த்துவான்’, ‘தேர்ப்படை’, ‘குதிரைவீரர்கள்’ ஆகியவை சாதாரண வாசகருக்குப் புரியும் வகையில் இராணுவ மற்றும் அரசாட்சிச் சூழலைத் தெளிவாக்குகின்றன. மூலத்தின் எச்சரிக்கைத் தொனி காக்கப்பட்டுள்ளது; அரசனின் செயல் சட்டபூர்வமானதா என்ற ambiguity அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
