base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/008/016.yaml
  text: He will take your male servants[a], your female servants, your best young men, and your donkeys, and use them for his work.
translation:
  language: ta
  text: அவன் உங்கள் ஆண் அடிமைகளையும்[a], பெண் அடிமைகளையும், சிறந்த இளைஞர்களையும், கழுதைகளையும் எடுத்துக்கொண்டு, தன் வேலைக்கு பயன்படுத்துவான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஆண் பணியாளர்களையும் … பெண் பணியாளர்களையும்.” எபிரெயச் சொற்கள் பொதுவாகப் பணியாளர்களையும் குறிக்கலாம்; ஆனால் அரசன் கட்டாயமாக எடுத்துக்கொள்ளும் இச்சூழல் “அடிமைகள்” என்ற பொருளுக்கு வலுசேர்க்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַבְדֵיכֶם
  choice: உங்கள் ஆண் அடிமைகள்
  rationale: עֶבֶד என்பதற்கு ‘பணியாளர்’ அல்லது ‘அடிமை’ என்று பொருள் வரலாம். அரசன் கட்டாயமாக அவர்களை எடுத்துக்கொள்ளும் இச்சூழலில் ‘அடிமை’ என்பது பொருத்தமானது; அடுத்துவரும் பெண்பால் சொல்லுடனான வேறுபாட்டையும் ‘ஆண்’ காக்கிறது.
- source_word: שִׁפְחוֹתֵיכֶם
  choice: உங்கள் பெண் அடிமைகள்
  rationale: שִׁפְחָה என்பது பெண் அடிமை அல்லது பெண் பணியாளரைக் குறிக்கிறது. இங்குள்ள கட்டாய அரச எடுத்துக்கொள்ளல் சூழலில் ‘பெண் அடிமைகள்’ பொருத்தமானது.
- source_word: בַּחוּרֵיכֶם הַטּוֹבִים
  choice: உங்கள் சிறந்த இளைஞர்கள்
  rationale: בָּחוּר என்பது பொதுவாக வாலிபப் பருவத்திலுள்ள ஆணைக் குறிக்கிறது; הַטּוֹבִים ‘சிறந்த’ என்ற தரத்தைக் கூட்டுகிறது. இந்தத் தமிழாக்கம் வயதையும் தரத்தையும் காக்கிறது.
- source_word: חֲמוֹרֵיכֶם
  choice: உங்கள் கழுதைகள்
  rationale: இச்சொல்லின் இயல்பான பொருள் ‘கழுதைகள்’; நவீனத் தமிழில் நேரடியும் தெளிவுமான சொல் இதுவே.
- source_word: יִקָּח
  choice: எடுத்துக்கொண்டு
  rationale: לקח என்பதன் அடிப்படைப் பொருள் ‘எடுத்துக்கொள்’. தீர்க்கதரிசன எச்சரிக்கையின் எதிர்காலச் செயலை வாக்கிய முடிவிலுள்ள ‘பயன்படுத்துவான்’ உடன் இயல்பாக இணைக்கிறது.
- source_word: וְעָשָׂה לִמְלַאכְתּוֹ
  choice: தன் வேலைக்கு பயன்படுத்துவான்
  rationale: சொற்றொடர் அரசன் மனிதர்களையும் விலங்குகளையும் தனது பணிக்காக ஒதுக்கிப் பயன்படுத்துவதை உணர்த்துகிறது. ‘தன் வேலைக்கு பயன்படுத்துவான்’ என்பது இயல்பான நவீனத் தமிழில் அந்த உடைமையாக்கும் நோக்கைக் காட்டுகிறது.
