  text: וְ/הָיִ֥ינוּ גַם אֲנַ֖חְנוּ כְּ/כָל הַ/גּוֹיִ֑ם וּ/שְׁפָטָ֤/נוּ מַלְכֵּ֨/נוּ֙ וְ/יָצָ֣א לְ/פָנֵ֔י/נוּ וְ/נִלְחַ֖ם אֶת מִלְחֲמֹתֵֽ/נוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/008/020.yaml
  text: so that we too may be like all the nations[b][a], and our king may judge us and go out before us and fight our battles.
translation:
  language: ta
  text: நாமும் மற்ற எல்லா நாடுகளைப் போல இருப்போம்[a]; நம் அரசன் நம்மை நியாயம் விசாரிப்பான்[b], நமக்கு முன்பாகச் சென்று நம் போர்களில் போரிடுவான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நாமும் மற்ற எல்லா நாடுகளைப் போல ஆகும்படியாக.” எபிரேய வடிவம் எதிர்காலத் தொடராக மொழிபெயர்க்கப்படலாம்; இங்கு அது அரசன் வேண்டுமென்ற மக்களின் நோக்கத்தையும் வெளிப்படுத்தலாம்.
    reason: lexical_alternative
  - marker: b
    text: “நம்மை நியாயம் விசாரிப்பான்” என்பது “நம்மை ஆட்சி செய்வான்” அல்லது “நம்மை நிர்வகிப்பான்” என்ற விரிந்த பொருளையும் தரலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיִינוּ גַם אֲנַחְנוּ
  choice: நாமும் ... இருப்போம்
  rationale: இணைப்புடன் வந்த நிறைவுவினை இங்கு முந்தைய கோரிக்கையின் நோக்கம் அல்லது எதிர்பார்க்கப்படும் விளைவைத் தொடர்கிறது. தமிழில் இயல்பான எதிர்கால வடிவம் இதைத் தெளிவாகத் தருகிறது; நோக்கப் பொருளும் சூழலில் விளங்குகிறது.
- source_word: כְּכָל הַגּוֹיִם
  choice: மற்ற எல்லா நாடுகளைப் போல
  rationale: גּוֹיִם இங்கு சுற்றியுள்ள மக்களினங்களையும் நாடுகளையும் குறிக்கிறது; பிற்கால சமயத் தொழில்நுட்பப் பொருளைத் தவிர்த்து, இஸ்ரவேல் பிற நாடுகளைப் போல இருக்க விரும்பிய பதற்றத்தைப் பாதுகாக்கிறது.
- source_word: וּשְׁפָטָנוּ
  choice: நமக்கு நீதி வழங்கி
  rationale: שׁפט என்பது தீர்ப்பளித்தல், நீதி நிர்வகித்தல், ஆட்சி செய்தல் ஆகிய பரப்பைக் கொண்டது. ‘நீதி வழங்கி’ என்பது நீதித்துறைச் சாயலைப் பாதுகாக்கிறது; விரிந்த ஆட்சிப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: מַלְכֵּנוּ
  choice: நம் அரசன்
  rationale: மக்கள் விரும்பும் அரசியல் அமைப்பையும் உடைமைப் பன்மைத் தொடர்பையும் நேரடியாகக் காட்டுகிறது.
- source_word: וְיָצָא לְפָנֵינוּ
  choice: நமக்கு முன்பாகச் சென்று
  rationale: இராணுவத் தலைமையைக் குறிக்கும் எபிரேய உருவகத்தை இயல்பான தமிழில் நெருக்கமாகப் பாதுகாக்கிறது.
- source_word: וְנִלְחַם אֶת מִלְחֲמֹתֵינוּ
  choice: நம் போர்களை நடத்துவான்
  rationale: ஒரே வேர்ச்சொல்லை மீளக் கொண்ட ‘போர்களைப் போரிடுதல்’ என்ற எபிரேய அமைப்பை தமிழில் இயல்பாக ‘போர்களை நடத்துதல்’ எனத் தருகிறது; அரசன் அவர்களுக்காகப் போரிடும் கருத்து நிலைக்கிறது.
theological_decisions:
- issue: இஸ்ரவேலின் அரசன் கோரிக்கையில் גּוֹיִם என்பதன் பொருள்
  choice: நாடுகள்
  alternative: புறஜாதியார்
  rationale: இவ்வசனம் இஸ்ரவேலைச் சுற்றியுள்ள அரசியல்-பண்பாட்டு மக்களினங்களோடு ஒப்பிடுகிறது. ‘நாடுகள்’ என்பது மூலச்சொல்லின் சூழல்சார் பொருளையும், மற்றவர்களைப் போல ஆகவேண்டும் என்ற மக்களின் விருப்பத்திலுள்ள இறையியல் பதற்றத்தையும் பாதுகாக்கிறது.
- issue: וּשְׁפָטָנוּ என்பதின் நீதித்துறை மற்றும் ஆட்சிப் பொருள்
  choice: நமக்கு நீதி வழங்கி
  alternative: நம்மை ஆட்சி செய்து
  rationale: ‘நீதி வழங்கி’ என்பது שׁפט என்ற சொல்லின் அடிப்படை நீதிசார் தொடர்பையும் இந்நூலின் முந்தைய நீதித்தலைவர் மரபுடனான ஒலிப்பையும் காக்கிறது; அதே நேரத்தில் அதன் விரிந்த ஆட்சிப் பொருளை அடிக்குறிப்பு ஏற்றுக்கொள்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டது. எபிரேய இராணுவ உருவகம் ‘நமக்கு முன்பாகச் சென்று’ எனப் பாதுகாக்கப்பட்டது; שׁפט என்பதின் பொருள் பரப்பு அடிக்குறிப்பில் குறிப்பிடப்பட்டது.
