  variant: modern standard Tamil
source:
  edition: WLC
  text: וְ/לֹֽא הָלְכ֤וּ בָנָי/ו֙ ב/דרכ/ו וַ/יִּטּ֖וּ אַחֲרֵ֣י הַ/בָּ֑צַע וַ/יִּ֨קְחוּ שֹׁ֔חַד וַ/יַּטּ֖וּ מִשְׁפָּֽט־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/008/003.yaml
  text: But his sons did not walk in his ways[a]; they turned aside after dishonest gain, took bribes[b], and perverted justice.
translation:
  language: ta
  text: ஆனால் அவனுடைய மகன்கள் அவனுடைய வழிகளில் நடக்கவில்லை. அவர்கள் முறைகேடான ஆதாயத்தை நாடி விலகிப்போய்[a], கையூட்டுகளை வாங்கி, நீதியைப் புரட்டினார்கள்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அநியாய ஆதாயத்தை நாடி’ அல்லது ‘பேராசையைப் பின்தொடர்ந்து’ என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் தவறான அல்லது சுரண்டலான முறையில் தேடப்படும் இலாபத்தைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: 'சொல்லுக்குச் சொல்: ‘நியாயத்தீர்ப்பை விலக்கினார்கள்.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָלְכוּ ... בִדְרָכוֹ
  choice: அவனுடைய வழிகளில் நடக்கவில்லை
  rationale: הלך என்பதுடன் דרך சேர்ந்துள்ள எபிரெய மரபுத்தொடர் ஒருவரின் நடத்தை அல்லது வாழ்க்கை முறையைக் குறிக்கிறது. தமிழிலும் ‘வழிகளில் நடத்தல்’ என்ற உருவகம் புரிந்துகொள்ளத்தக்கதாக இருப்பதால் அது பாதுகாக்கப்பட்டுள்ளது.
- source_word: וַיִּטּוּ
  choice: விலகிப்போய்
  rationale: נטה இங்கு நேரான அல்லது சரியான போக்கிலிருந்து விலகுவதைக் குறிக்கிறது. தொடர்ந்து வரும் ஊழல் நடத்தைகளோடு இயல்பாக இணைவதற்காக ‘விலகிப்போய்’ என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: אַחֲרֵי הַבָּצַע
  choice: முறைகேடான ஆதாயத்தை நாடி
  rationale: בצע என்பது இச்சூழலில் பேராசையாலோ அநீதியான வழியிலோ தேடப்படும் இலாபத்தைக் குறிக்கிறது. ‘முறைகேடான ஆதாயம்’ பொருளாதாரப் பயனையும் அதன் ஒழுக்கக்கேடான தன்மையையும் ஒருங்கே தெரிவிக்கிறது.
- source_word: וַיִּקְחוּ שֹׁחַד
  choice: கையூட்டுகளை வாங்கி
  rationale: שֹׁחַד என்பது குறிப்பாக தீர்ப்பு அல்லது அதிகாரச் செயல்பாட்டைத் தாக்கும் கையூட்டைக் குறிக்கிறது. இது தொடர்ந்து நடந்த பழக்கமாக விவரிக்கப்படுவதால் தமிழில் பன்மை பயன்படுத்தப்பட்டுள்ளது.
- source_word: וַיַּטּוּ מִשְׁפָּט
  choice: நீதியைப் புரட்டினார்கள்
  rationale: இந்த எபிரெய மரபுத்தொடர் சட்டத் தீர்ப்பைத் தவறான திசைக்குத் திருப்பி நீதியைச் சீர்குலைப்பதைக் குறிக்கிறது. ‘நீதியைப் புரட்டினார்கள்’ என்பது சட்டச்சார்ந்த வலிமையைத் தக்கவைக்கும் இயல்பான தமிழ் நடை.
- source_word: בָּנָיו
  choice: அவனுடைய மகன்கள்
  rationale: எபிரெயச் சொல் ஆண்பால் பன்மையாக இருந்து, சூழலில் சாமுவேலின் மகன்களையே குறிப்பாகச் சுட்டுகிறது.
theological_decisions:
- issue: சாமுவேலின் மகன்கள்மீதான ஒழுக்க மற்றும் சட்டக் குற்றச்சாட்டு
  choice: முறைகேடான ஆதாயம், கையூட்டு, நீதியைப் புரட்டுதல் ஆகிய நீதித்துறை ஊழல் சொற்களைத் தெளிவாகப் பாதுகாத்தல்
  alternative: ‘பேராசைப்பட்டார்கள்’ அல்லது ‘அநியாயமாக நடந்தார்கள்’ போன்ற பொதுவான ஒழுக்க மொழியைப் பயன்படுத்துதல்
  rationale: மூல உரை அநியாய ஆதாயத்தை நாடுதல், கையூட்டு வாங்குதல், தீர்ப்பைத் திசைதிருப்புதல் என்ற சட்டச்சார்ந்த ஊழல் செயல்களை ஒன்றன்பின் ஒன்றாகக் குறிப்பிடுகிறது. அவற்றை பொதுவான குணக்கேடாக மென்மைப்படுத்தாமல் அதன் நீதித்துறைத் தன்மை பாதுகாக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன தரத் தமிழில், சாதாரண வாசகர்கள் புரிந்துகொள்ளக்கூடிய கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘வழிகளில் நடக்கவில்லை’ என்ற எபிரெய உருவகம் பாதுகாக்கப்பட்டாலும், நீதித்துறை ஊழலைக் குறிக்கும் இறுதி சொற்றொடர்கள் இயல்பான தமிழில் தரப்பட்டுள்ளன. ஆலோசனை ஆங்கில உரையில் அடிக்குறிப்பு குறிகள் பொருளுக்கேற்ற சொற்றொடர்களுக்கு அடுத்ததாக இல்லாததால், [a] முறைகேடான ஆதாயத்திற்குப் பின்னும் [b] நீதியைப் புரட்டியதற்குப் பின்னும் பொருத்தமாக வைக்கப்பட்டுள்ளன.
