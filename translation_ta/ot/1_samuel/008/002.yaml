  yaml_path: translation/ot/1_samuel/008/002.yaml
  text: The name of his firstborn was Joel, and the name of his second was Abijah; they were judges in Beersheba.
translation:
  language: ta
  text: அவருடைய முதற்பேறான மகனின் பெயர் யோவேல்; அவருடைய இரண்டாவது மகனின் பெயர் அபியா. அவர்கள் பெயெர்செபாவில் நீதிபதிகளாக இருந்தார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי שֶׁם
  choice: பெயர் ...
  rationale: எபிரெயப் பெயரிடும் வாய்ப்பாட்டைத் தமிழில் இயல்பாகக் கூற, தனியாக வினைச்சொல் சேர்க்காமல் ‘பெயர் யோவேல்’ என்ற அமைப்பு பயன்படுத்தப்பட்டது.
- source_word: בְּנוֹ הַבְּכוֹר
  choice: அவனுடைய முதற்பேறானவன்
  rationale: ‘அவனுடைய மகன்’ என்ற உறவையும் ‘முதற்பேறு’ என்ற பிறப்பு வரிசையையும் சூழலில் தெளிவாகக் காக்கிறது; மூலத்தின் சுருக்கமான பெயர்ச்சொல் அமைப்பையும் பிரதிபலிக்கிறது.
- source_word: יוֹאֵל
  choice: யோவேல்
  rationale: எபிரெயப் பெயரின் ஒலியமைப்பைத் தமிழில் அணுக்கமாக எழுத்துப்பெயர்த்தது.
- source_word: מִשְׁנֵהוּ
  choice: இரண்டாமவன்
  rationale: வரிசையில் இரண்டாவது மகனைக் குறிக்கும் சொல்லை இயல்பான, சுருக்கமான தமிழில் வழங்குகிறது.
- source_word: אֲבִיָּה
  choice: அபியா
  rationale: எபிரெயப் பெயரைத் தமிழில் ஒலிப்புக்கு அணுக்கமாக எழுத்துப்பெயர்த்தது.
- source_word: שֹׁפְטִים
  choice: நீதிபதிகளாக இருந்தார்கள்
  rationale: ஆண்பால் பன்மைப் பங்கேற்புச் சொல் குறிக்கும் தொடர்ந்த பணி அல்லது பதவியைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: בִּבְאֵר שָׁבַע
  choice: பெயெர்செபாவில்
  rationale: இடப்பெயரை எபிரெய உச்சரிப்புக்கு அணுக்கமாக எழுத்துப்பெயர்த்து, בְּ முன்னிடைச்சொல்லை ‘-இல்’ வேற்றுமையால் இயல்பாகக் காட்டுகிறது.
