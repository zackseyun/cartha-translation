base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/008/006.yaml
  text: But the matter was displeasing in Samuel’s eyes when they said[b][a], “Give us a king to judge us.” And Samuel prayed to Yahweh.
translation:
  language: ta
  text: ஆனால், “எங்களை நியாயந்தீர்க்க[b] எங்களுக்கு ஓர் அரசனைத் தாரும்” என்று அவர்கள் சொன்னபோது, அந்தக் காரியம் சாமுவேலின் பார்வையில் தீயதாக இருந்தது.[a] சாமுவேல் யாவேவிடம் ஜெபித்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொல்லுக்குச் சொல், அந்தக் காரியம் சாமுவேலின் பார்வையில் “தீயதாக இருந்தது” என்று வருகிறது. இதை “சாமுவேலுக்கு மனவருத்தமளித்தது” என்றும் மொழிபெயர்க்கலாம்; ஆனால் மூலவாக்கியம் அவரது வலுவான எதிர்மறை மதிப்பீட்டை வெளிப்படுத்துகிறது.
    reason: lexical_alternative
  - marker: b
    text: “நியாயந்தீர்க்க” என்பது இங்கு “ஆட்சி செய்ய” அல்லது “ஆள” என்ற விரிவான பொருளையும் கொண்டிருக்கலாம்.
    reason: lexical_alternative
