- source_word: תְּנָה לָּנוּ
  choice: எங்களுக்குத் தாரும்
  rationale: நேரடியான கட்டளை வடிவத்தின் எளிமையையும் வலிமையையும் காக்கிறது.
- source_word: מֶלֶךְ
  choice: ஓர் அரசன்
  rationale: מֶלֶךְ என்பதற்கான தெளிவான நவீனத் தமிழ் இணை.
- source_word: לְשָׁפְטֵנוּ
  choice: எங்களை நியாயந்தீர்க்க
  rationale: שׁפט என்பதன் அடிப்படை நீதித்தீர்ப்பு சார்ந்த பொருளையும், இஸ்ரவேலின் நியாயாதிபதிகள் பற்றிய நூல்சார் தொடர்பையும் தக்கவைக்கிறது; ஆட்சி செய்வது என்ற விரிவான பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: וַיִּתְפַּלֵּל
  choice: மன்றாடினார்
  rationale: இறைவனை நோக்கிச் செபித்தல் என்ற பொருளை மரியாதையான, இயல்பான தமிழில் தருகிறது; குறிப்பாக பரிந்துபேசினார் என்று பொருளைச் சுருக்கவில்லை.
- source_word: אֶל יְהוָה
  choice: யாவேவிடம்
  rationale: தெய்வீகப் பெயரைப் பெயராகவே ஒலிபெயர்த்து, אֶל குறிக்கும் நோக்கை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: וַיֵּרַע என்பதில் சாமுவேலின் எதிர்மறை மதிப்பீட்டின் வலிமை
  choice: சாமுவேலின் பார்வையில் தீயதாக இருந்தது
  alternative: சாமுவேலுக்கு மனவருத்தமளித்தது
  rationale: மூலத்தில் வெறும் உணர்ச்சியைக் காட்டிலும் நன்மை–தீமை சார்ந்த மதிப்பீடு உள்ளது. அதேவேளையில் ‘சாமுவேலின் பார்வையில்’ என்பது இது சாமுவேலின் மதிப்பீடு என்பதைத் தெளிவாக்குகிறது.
- issue: יהוה என்ற தெய்வீகப் பெயர்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் உள்ள தனிப்பெயரை மறைக்காமல் தமிழில் ஒலிபெயர்க்கிறது.
- issue: לְשָׁפְטֵנוּ என்பதன் நீதித்தீர்ப்பு மற்றும் ஆட்சி சார்ந்த பொருள் பரப்பு
  choice: எங்களை நியாயந்தீர்க்க
  alternative: எங்களை ஆட்சி செய்ய
  rationale: அடிப்படைச் சொல்லின் நீதித்தீர்ப்பு சார்ந்த பொருளை முதன்மை உரையில் காக்கிறது; அரசன் ஆளும் பணி குறித்த விரிவான பொருளை அடிக்குறிப்பில் தெரிவிக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையும் கண்ணியமும் பேணப்பட்டுள்ளன. கோரிக்கையின் நேரடித் தன்மைக்காக மேற்கோள் வடிவம் காக்கப்பட்டுள்ளது. ‘சாமுவேலின் பார்வையில்’ என்ற சொற்றொடர் எபிரெய மதிப்பீட்டு மொழியுருவை இயல்பாகப் பிரதிபலிக்கிறது.
