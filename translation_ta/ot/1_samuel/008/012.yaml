base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/008/012.yaml
  text: He will appoint for himself commanders of thousands and commanders of fifties[a], and some to plow his ground and reap his harvest[c][b], and to make his weapons of war and the equipment of his chariots.
translation:
  language: ta
  text: அவன் தனக்காக ஆயிரம்பேருக்குத் தலைவர்களையும் ஐம்பதுபேருக்குத் தலைவர்களையும் நியமிப்பான்[a]. சிலரைத் தன் நிலத்தை உழவும் தன் விளைச்சலை அறுவடை செய்யவும்[b], தன் போராயுதங்களையும் தன் தேர்ப்படையின் உபகரணங்களையும் செய்யவும் நியமிப்பான்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஆயிரம்பேருக்குப் படைத்தலைவர்களையும் ஐம்பதுபேருக்குப் படைத்தலைவர்களையும்.”
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில் சொல்லுக்குச் சொல், “தன் உழவை உழவும் தன் அறுவடையை அறுக்கவும்.” இந்த அமைப்பு அரசனுக்காகச் செய்யப்படும் உழைப்பை வலியுறுத்துகிறது.
    reason: lexical_alternative
  - marker: c
    text: “தன் போராயுதங்களையும் தன் தேர்ப்படையின் உபகரணங்களையும்” என்பதை “தன் இராணுவச் சாதனங்களையும் தன் தேர்ப்படையின் உபகரணங்களையும்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָשׂוּם לוֹ
  choice: அவன் தனக்காக ... நியமிப்பான்
  rationale: முந்தைய வசனத்திலிருந்து தொடரும் எபிரெய முடிவிலா வினையைத் தமிழில் இயல்பான முறையில் முற்றுவினையாகக் கொடுக்கிறது; לוֹ அரசன் தன் பயன்பாட்டுக்காக நியமிப்பதைச் சுட்டுகிறது.
- source_word: שָׂרֵי אֲלָפִים וְשָׂרֵי חֲמִשִּׁים
  choice: ஆயிரம்பேருக்குத் தலைவர்களையும் ஐம்பதுபேருக்குத் தலைவர்களையும்
  rationale: שַׂר என்பதன் தலைமை அல்லது படைத்தலைமைப் பொருளையும், எபிரெய இராணுவ-நிர்வாக எண்ணிக்கைக் குழுக்களையும் தெளிவாகப் பாதுகாக்கிறது.
- source_word: וְלַחֲרֹשׁ חֲרִישׁוֹ
  choice: தன் நிலத்தை உழவும்
  rationale: சொல்லுக்குச் சொல் ‘தன் உழவை உழவும்’ எனும் ஒரே வேர்ச்சொல் அமைப்பை இயல்பான தமிழாக்கமாக்கி, அரசனுக்குரிய வேளாண் உழைப்பை வெளிப்படுத்துகிறது.
- source_word: וְלִקְצֹר קְצִירוֹ
  choice: தன் விளைச்சலை அறுவடை செய்யவும்
  rationale: கதிர் அல்லது அறுவடை என்ற பெயர்ச்சொல்லுடன் வரும் ஒரே வேர்ச்சொல் அமைப்பின் பொருளை நவீனத் தமிழில் இயல்பாகத் தருகிறது.
- source_word: וְלַעֲשׂוֹת כְּלֵי מִלְחַמְתּוֹ
  choice: தன் போராயுதங்களைச் செய்யவும்
  rationale: כְּלִי என்பது கருவி அல்லது சாதனம் எனப் பரந்த பொருள் கொண்டாலும், போர்ச் சூழலில் ‘போராயுதங்கள்’ தெளிவான முதன்மை வாசகமாக அமைகிறது.
- source_word: וּכְלֵי רִכְבּוֹ
  choice: தேர்ப்படைக்கான கருவிகளையும்
  rationale: רֶכֶב தேர், தேர்ப்படை அல்லது தேரணி எனப் பொருள்படலாம்; இங்கு அரசனின் தேர்ப்படையோடு தொடர்புடைய சாதனங்களைப் பரந்த வகையில் குறிக்கிறது.
