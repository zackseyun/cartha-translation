  register: நவீனத் தரத்தமிழில் தெளிவான, கண்ணியமான உரைநடை பயன்படுத்தப்பட்டுள்ளது. முந்தைய வசனத்திலிருந்து தொடரும் அரசனின் செயல்களைத் தமிழில் முழுமையான வாக்கியங்களாகத் தருவதற்காக ‘சிலரை’ மற்றும் இரண்டாவது ‘நியமிப்பான்’ வெளிப்படையாகச் சேர்க்கப்பட்டுள்ளன; அவை புதிய கருத்தைச் சேர்க்காமல் எபிரெய தொடரமைப்பைத் தெளிவாக்குகின்றன.
