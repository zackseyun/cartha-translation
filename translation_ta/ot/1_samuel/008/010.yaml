- from: அப்போது சாமுவேல், தன்னிடம் ஓர் அரசனைக் கேட்டுக்கொண்டிருந்த[a] மக்களிடம் யாவேயின் வார்த்தைகள் அனைத்தையும் சொன்னான்.
  to: சாமுவேல், தன்னிடம் ஓர் அரசனைக் கேட்டுக்கொண்டிருந்த மக்களிடம், யாவேயின் எல்லா வார்த்தைகளையும் சொன்னான்.[a]
