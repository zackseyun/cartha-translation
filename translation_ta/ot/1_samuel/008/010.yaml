  text: וַ/יֹּ֣אמֶר שְׁמוּאֵ֔ל אֵ֖ת כָּל דִּבְרֵ֣י יְהוָ֑ה אֶל הָ/עָ֕ם הַ/שֹּׁאֲלִ֥ים מֵ/אִתּ֖/וֹ מֶֽלֶךְ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/008/010.yaml
  text: So Samuel spoke all the words of Yahweh to the people who were asking him for a king[a].
translation:
  language: ta
  text: சாமுவேல், தன்னிடம் ஓர் அரசனைக் கேட்டுக்கொண்டிருந்த மக்களிடம், யாவேயின் எல்லா வார்த்தைகளையும் சொன்னான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தன்னிடம் ஓர் அரசனைக் கேட்டிருந்த.” எபிரெயப் பங்கேற்பெயர், தொடர்ந்து நடந்துகொண்டிருந்த செயலையோ, இந்தக் கோரிக்கையால் அடையாளப்படுத்தப்பட்ட மக்களையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: சொன்னான்
  rationale: எபிரெய வினைச்சொல்லின் அடிப்படைப் பொருள் ‘சொன்னான்.’ ‘வார்த்தைகள் அனைத்தையும்’ என்பதோடு இயல்பான தமிழில் இது செய்தியை எடுத்துரைக்கும் பொருளையும் தருகிறது.
- source_word: אֵת כָּל דִּבְרֵי יְהוָה
  choice: யாவேயின் வார்த்தைகள் அனைத்தையும்
  rationale: தெய்வீகச் செய்தியின் முழுமையை வலியுறுத்தும் כָּל என்பதையும், ‘யாவேயின் வார்த்தைகள்’ என்ற வேதாகமச் சொல்லமைப்பையும் தெளிவாகப் பாதுகாக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய மூலத்தில் வரும் இறைவனின் தனிப்பெயரை ஒரு பட்டப்பெயராக மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: אֶל הָעָם
  choice: மக்களிடம்
  rationale: இச்சூழலில் אֶל குறிக்கும் பேச்சின் பெறுநர்களை இயல்பான தமிழில் காட்டுகிறது.
- source_word: הַשֹּׁאֲלִים מֵאִתּוֹ מֶלֶךְ
  choice: தன்னிடம் ஓர் அரசனைக் கேட்டுக்கொண்டிருந்த
  rationale: מֵאִתּוֹ கோரிக்கை சாமுவேலிடம் வைக்கப்பட்டதைத் தெரிவிக்கிறது; நிகழ்காலப் பங்கேற்பெயரின் தொடரும் அல்லது பண்புரீதியான நுணுக்கத்தை ‘கேட்டுக்கொண்டிருந்த’ பாதுகாக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூலவசனம் இறைவனின் தனிப்பெயரான நான்கெழுத்துப் பெயரை நேரடியாகப் பயன்படுத்துகிறது. எனவே அதை ஒரு பட்டப்பெயரால் மாற்றாமல் ஒலிபெயர்ப்பது மூலத்தின் வேறுபாட்டைப் பாதுகாக்கிறது.
- issue: மக்கள் அரசனைக் கேட்ட செயல் தொடர்ந்ததா அல்லது ஏற்கெனவே முடிந்ததா
  choice: கேட்டுக்கொண்டிருந்த
  alternative: கேட்டிருந்த
  rationale: הַשֹּׁאֲלִים என்பது பங்கேற்பெயர் வடிவம்; அது நடந்துகொண்டிருந்த கோரிக்கையையோ, அந்தக் கோரிக்கையால் அடையாளப்படுத்தப்பட்ட மக்களையோ குறிக்கலாம். முதன்மை உரை தொடரும் நுணுக்கத்தைத் தருகிறது; மாற்று வாய்ப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் மரியாதைமிக்க நடையிலும் அமைக்கப்பட்டுள்ளது. ‘வார்த்தைகள் அனைத்தையும்’ என்பது மூலத்தின் முழுமை வலியுறுத்தலைத் தக்கவைக்கிறது; ‘யாவே’ தனிப்பெயராக ஒலிபெயர்க்கப்பட்டுள்ளது.
