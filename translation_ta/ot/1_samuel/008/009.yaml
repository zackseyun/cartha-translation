    text: ‘அரசனின் முறை’ என்றும் மொழிபெயர்க்கலாம்; எபிரேயச் சொல் ‘நீதி’, ‘சட்ட உரிமை’ அல்லது ‘வழக்கமான நடைமுறை’ என்றும் பொருள்படலாம்.
