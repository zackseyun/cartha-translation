  text: So now[a], listen to their voice; only, you must solemnly warn them and tell them the justice of the king who will reign over them.
translation:
  language: ta
  text: இப்போது, அவர்களுடைய குரலுக்குச் செவிகொடு; ஆயினும், அவர்களைத் திட்டவட்டமாக எச்சரித்து, அவர்கள்மேல் அரசாளப்போகும் அரசனின் நடைமுறை[a] என்ன என்பதை அவர்களுக்குத் தெரிவி.
  philosophy: optimal-equivalence
