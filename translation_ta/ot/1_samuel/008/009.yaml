lexical_decisions:
- source_word: שְׁמַע בְּקוֹלָם
  choice: அவர்களுடைய குரலுக்குச் செவிகொடு
  rationale: எபிரேய மரபுத்தொடரின் ‘குரலுக்குச் செவிகொடு’ என்ற வடிவத்தையும், கோரிக்கைக்கு இணங்குதல் என்ற சூழல்சார் பொருளையும் காக்கிறது; அவர்களின் கோரிக்கையை அங்கீகரித்தல் என்ற கூடுதல் கருத்தைத் திணிப்பதில்லை.
- source_word: אַךְ כִּי
  choice: ஆனால்
  rationale: முந்தைய கட்டளையைத் தொடர்ந்து வரும் வலுவான வரையறையையும் எதிர்மறைத் திருப்பத்தையும் இயல்பான நவீன தமிழில் காட்டுகிறது.
- source_word: הָעֵד תָּעִיד
  choice: திடமாக எச்சரித்து
  rationale: வினையெச்ச முழுவடிவமும் முற்றுவினையும் இணைந்து தரும் வலியுறுத்தலை ‘திடமாக’ வெளிப்படுத்துகிறது; இச்சூழலில் வேர்ச்சொல் முறையான எச்சரிப்பைக் குறிக்கிறது.
- source_word: בָּהֶם
  choice: அவர்களை
  rationale: எச்சரிப்புப் பெறுவோரை இயல்பான தமிழ் செயப்படுபொருளாகக் காட்டுகிறது; ‘அவர்களுக்கு எதிராக’ என்று மொழிபெயர்த்து தேவையற்ற குற்றச்சாட்டு நுணுக்கத்தைச் சேர்ப்பதைத் தவிர்க்கிறது.
- source_word: וְהִגַּדְתָּ לָהֶם
  choice: அவர்களுக்குத் தெரிவி
  rationale: தெரியப்படுத்துதல் அல்லது அறிவித்தல் என்ற ஹிபில் வினையின் பொருளைத் தெளிவாகவும் dignified நவீன தமிழிலும் தருகிறது.
- source_word: מִשְׁפַּט הַמֶּלֶךְ
  choice: அரசனின் நடைமுறை
  rationale: மִשְׁפָּט என்பதன் ‘நீதி, சட்ட உரிமை, வழக்கமான நடைமுறை’ என்ற பொருள் வரம்பில், பின்வரும் அரச நடவடிக்கைகளை விவரிக்கும் சூழலுக்கு ‘நடைமுறை’ ஏற்றது; அவற்றிற்கு தெய்வீக அல்லது அறச்சார்ந்த சட்டப்பூர்வ அங்கீகாரம் இருப்பதாக முன்கூட்டியே தீர்மானிப்பதில்லை. மாற்றுப் பொருள்கள் அடிக்குறிப்பில் தரப்படுகின்றன.
- source_word: אֲשֶׁר יִמְלֹךְ עֲלֵיהֶם
  choice: அவர்கள்மேல் அரசாளப்போகும்
  rationale: מלך என்பதின் அரசனாக ஆளுதல் என்ற குறிப்பிட்ட அரச நுணுக்கத்தையும், எதிர்காலச் செயற்பாட்டையும் காக்கிறது.
theological_decisions:
- issue: מִשְׁפַּט הַמֶּלֶךְ என்பது அரசனின் சட்ட உரிமையைக் குறிக்கிறதா அல்லது அவனது வழக்கமான செயல்முறையைக் குறிக்கிறதா?
  choice: அரசனின் நடைமுறை
  alternative: அரசனின் நீதி; அரசனின் சட்ட உரிமை; அரசனின் முறை
  rationale: அடுத்த வசனங்கள் அரசன் மக்களிடமிருந்து எடுப்பவற்றையும் அவர்கள்மீது சுமத்துபவற்றையும் எச்சரிக்கையாக விவரிக்கின்றன. ‘சட்ட உரிமை’ என்பது அந்தச் செயல்களுக்கு தேவையற்ற தெய்வீக அல்லது அற அங்கீகாரத்தை உணர்த்தக்கூடும்; ‘நடைமுறை’ எச்சரிப்புத் தொனியையும் விவரிப்புத் தன்மையையும் காத்து, சொல் கொண்டுள்ள உண்மையான தெளிவின்மையை அடிக்குறிப்பில் வெளிப்படுத்துகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான கட்டளைநடை பயன்படுத்தப்பட்டுள்ளது. ‘அவர்களுடைய குரலுக்குச் செவிகொடு’ என்பது எபிரேய மரபுத்தொடரின் உருவகத்தைத் தக்கவைக்கிறது; ‘அரசனின் நடைமுறை’ அரசியல்-இறையியல் தீர்ப்பை மொழிபெயர்ப்பில் திணிக்காமல் சூழலைத் தெளிவாக்குகிறது.
