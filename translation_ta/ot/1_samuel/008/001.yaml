translation_notes:
  register: நவீனத் தரத்தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் அதேவேளையில் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘முதுமையடைந்தபோது’ மூலத்தின் மாற்றநிலைப் பொருளைக் காக்கிறது; ‘நியமித்தார்’ பதவி அளித்த செயலை இயல்பாகத் தெரிவிக்கிறது. לְיִשְׂרָאֵל என்பதிலுள்ள உண்மையான இலக்கணப் பொருள் நெகிழ்வு அடிக்குறிப்பில் வெளிப்படையாகப் பாதுகாக்கப்பட்டுள்ளது.
