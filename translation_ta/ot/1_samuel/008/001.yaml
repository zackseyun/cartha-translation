base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/008/001.yaml
  text: When Samuel grew old[a], he appointed his sons as judges over Israel.
translation:
  language: ta
  text: சாமுவேல் முதுமையடைந்தபோது, தன் மகன்களை இஸ்ரவேலுக்கு நீதிபதிகளாக நியமித்தார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “தன் மகன்களை இஸ்ரவேல்மேல் நீதிபதிகளாக வைத்தார்” என்றும் மொழிபெயர்க்கலாம். “நியமித்தார்” என்பதற்கான எபிரெய வினைச்சொல்லின் நேரடிப் பொருள் “வைத்தார்”; “இஸ்ரவேல்” என்பதற்கு முன் வரும் முன்னொட்டு, இந்த நியமனம் புரிந்துகொள்ளப்படும் விதத்தைப் பொறுத்து “இஸ்ரவேலுக்கு” அல்லது “இஸ்ரவேல்மேல்” எனப் பொருள்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר
  choice: …போது
  rationale: எபிரெயக் கதைநடைத் தொடர் ஒரு காலச் சூழலை அறிமுகப்படுத்துகிறது. அதன் சொல்லடித் தொடக்கமான ‘அப்போது நிகழ்ந்தது’ என்பதை இயல்பற்ற வகையில் பிரதிபலிக்காமல், தமிழில் இயல்பான கால இணைப்பாக மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: זָקֵן
  choice: முதுமையடைந்த
  rationale: இது வெறுமனே முதியவராக இருந்த நிலையை மட்டும் அல்லாமல், முதுமையை அடைந்ததையும் குறிக்கும் வினைச்சொல்; ‘முதுமையடைந்த’ என்பது அந்த மாற்றநிலையைத் தெளிவாகக் காக்கிறது.
- source_word: שְׁמוּאֵל
  choice: சாமுவேல்
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் நிலைபெற்றுள்ள பெயர்வடிவம் பயன்படுத்தப்பட்டுள்ளது.
- source_word: וַיָּשֶׂם
  choice: நியமித்தார்
  rationale: அடிப்படைப் பொருள் ‘வைத்தார்’ என்றாலும், இங்கு ஒரு பொறுப்புப் பதவியில் அமர்த்துவதே சூழல்சார் பொருள். ‘நியமித்தார்’ அதை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: אֶת בָּנָיו
  choice: தன் மகன்களை
  rationale: எபிரெயச் சொல் ஆண் பிள்ளைகளைக் குறிப்பாகக் குறிக்கிறது. ஒரே வாக்கியத்தின் எழுவாயான சாமுவேலைத் திரும்பச் சுட்டுவதால் ‘தன்’ இயல்பான தமிழ் வடிவமாகும்.
- source_word: שֹׁפְטִים
  choice: நீதிபதிகள்
  rationale: நீதிவழங்கும் மற்றும் ஆளுகை சார்ந்த பொறுப்பை வகிப்பவர்களைக் குறிக்கும் சொல்லுக்கு, பொதுவாகப் புரிந்துகொள்ளக்கூடிய ‘நீதிபதிகள்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: לְיִשְׂרָאֵל
  choice: இஸ்ரவேலருக்கு
  rationale: לְ என்னும் முன்னொட்டு இங்கு ‘இஸ்ரவேலருக்காக/இஸ்ரவேலரைச் சார்ந்து’ அவர்கள் நீதிபதிகளாகச் செயல்பட நியமிக்கப்பட்டதை இயல்பாக வெளிப்படுத்தலாம். அதிகார உறவை முன்னிறுத்தினால் ‘இஸ்ரவேலர்மேல்’ என்றும் கொள்ளலாம்; அந்த மாற்று அடிக்குறிப்பில் காக்கப்பட்டுள்ளது.
