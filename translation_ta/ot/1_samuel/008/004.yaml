lexical_decisions:
- source_word: וַיִּתְקַבְּצוּ
  choice: ஒன்றுகூடி
  rationale: התפעל வடிவம் அவர்கள் ஒரு குழுவாகக் கூடிவந்ததைக் குறிக்கிறது; “ஒன்றுகூடி” என்பது அந்தக் கூட்டுச் செயலை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: כֹּל
  choice: அனைவரும்
  rationale: இது இஸ்ரவேலின் மூப்பர்கள் முழுக் குழுவையும் குறிக்கிறது; மனிதர்களைக் குறிக்கும் இயல்பான தமிழ்ச் சொல் “அனைவரும்.”
- source_word: זִקְנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் மூப்பர்கள்
  rationale: இது இஸ்ரவேலின் மூத்த பிரதிநிதித் தலைவர்களைக் குறிக்கும் வழக்கமான சமூக-அரசியல் பட்டப்பெயர்; “மூப்பர்கள்” அதன் அதிகாரப்பூர்வமான பொருளைப் பாதுகாக்கிறது.
- source_word: וַיָּבֹאוּ אֶל
  choice: சாமுவேலிடம் வந்தார்கள்
  rationale: בוא உடன் אֶל வருவது ஒருவரை நோக்கிச் சென்று அவரிடம் சேர்வதைக் குறிக்கிறது; தமிழ்க் கதைநடையில் “இடம் வந்தார்கள்” இயல்பாக உள்ளது.
- source_word: שְׁמוּאֵל
  choice: சாமுவேல்
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் நிலைபெற்றுள்ள பெயர் வடிவம் பயன்படுத்தப்பட்டது.
- source_word: הָרָמָתָה
  choice: ராமாவில் இருந்த
  rationale: இடப்பெயருடன் இணைந்த திசைகாட்டும் ה ராமாவை நோக்கிய இயக்கத்தைக் குறிக்கிறது. அவர்கள் ராமாவுக்குச் சென்று அங்கிருந்த சாமுவேலைச் சந்தித்தார்கள் என்ற உறவை இயல்பான தமிழில் “ராமாவில் இருந்த” என்று வெளிப்படுத்துகிறது.
