  language: ta
  text: அப்போது இஸ்ரவேலின் மூப்பர்கள் அனைவரும் ஒன்றுகூடி, ராமாவில் இருந்த சாமுவேலிடம் வந்தார்கள்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “ராமாவுக்கு.” இங்கு அவர்கள் சென்ற இடமே சாமுவேல் இருந்த இடம் என்பதைக் காட்ட, இயல்பான தமிழில் “ராமாவில் இருந்த” என்று மொழிபெயர்க்கப்பட்டுள்ளது.
