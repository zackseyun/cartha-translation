source:
  edition: WLC
  text: וּ/זְעַקְתֶּם֙ בַּ/יּ֣וֹם הַ/ה֔וּא מִ/לִּ/פְנֵ֣י מַלְכְּ/כֶ֔ם אֲשֶׁ֥ר בְּחַרְתֶּ֖ם לָ/כֶ֑ם וְ/לֹֽא יַעֲנֶ֧ה יְהוָ֛ה אֶתְ/כֶ֖ם בַּ/יּ֥וֹם הַ/הֽוּא־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/008/018.yaml
  text: And in that day you will cry out because of your king, whom you have chosen for yourselves, but Yahweh will not answer you in that day.
translation:
  language: ta
  text: அந்நாளில், தங்களுக்காக நீங்கள் தேர்ந்தெடுத்த உங்கள் அரசன் காரணமாக நீங்கள் கூக்குரலிடுவீர்கள்; ஆனால் அந்நாளில் யாவே உங்களுக்குப் பதிலளிக்கமாட்டார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּזְעַקְתֶּם
  choice: நீங்கள் கதறுவீர்கள்
  rationale: זעק என்பது துயரத்தில் உதவி நாடி எழுப்பும் தீவிரக் கூக்குரலைக் குறிக்கிறது. ‘கதறுவீர்கள்’ அதன் தீவிரத்தை இயல்பான தமிழில் தருகிறது; வேண்டுகோளின் பொருளை தேவையின்றி வெளிப்படையாகச் சேர்ப்பதில்லை.
- source_word: בַּיּוֹם הַהוּא
  choice: அந்நாளில்
  rationale: இது காலத்தைக் குறிக்கும் வழக்கமான எபிரெயச் சொற்றொடர். வசனத்தின் தொடக்கத்திலும் முடிவிலும் வரும் மறுபடியுரைத்தலைத் தமிழிலும் காக்கிறது.
- source_word: מִלִּפְנֵי
  choice: உங்கள் அரசனால்
  rationale: சொல்லுக்குச் சொல் ‘முன்னிலையிலிருந்து’ என்றாலும், இச்சூழலில் அரசன் காரணமாக எழும் துயரக் கூக்குரலைக் குறிக்கிறது. தமிழில் காரணப்பொருளை இயல்பாகத் தெரிவிக்க ‘அரசனால்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: מַלְכְּכֶם
  choice: உங்கள் அரசன்
  rationale: உடைமைப்பொருளை நேரடியாகவும் இயல்பாகவும் தருகிறது.
- source_word: אֲשֶׁר בְּחַרְתֶּם לָכֶם
  choice: உங்களுக்காக நீங்கள் தேர்ந்தெடுத்த
  rationale: அரசனைத் தேர்ந்தெடுத்ததில் இஸ்ரவேலருக்கே இருந்த பொறுப்பையும், לָכֶם என்பதிலுள்ள ‘தங்களுக்காக’ என்ற வலியுறுத்தலையும் காக்கிறது.
- source_word: וְלֹא יַעֲנֶה
  choice: ஆனால் ... பதிலளிக்கமாட்டார்
  rationale: வாவ் இணைப்புச் சொல் இங்கு மக்களின் கதறலுக்கும் யாவே பதிலளிக்காததற்கும் இடையிலான முரண்பாட்டைத் தருகிறது; ஆகவே ‘ஆனால்’ இயல்பானது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரான நான்கெழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், நவீன தமிழில் அதன் ஒலிபெயர்ப்பாகத் தருகிறது.
- source_word: אֶתְכֶם
  choice: உங்களுக்குப்
  rationale: ענה என்ற வினையுடன் தமிழில் ‘உங்களுக்குப் பதிலளிக்க’ என்பதே இயல்பான வேற்றுமை அமைப்பு.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: யெகோவா
  rationale: மூலத்தில் தனிப்பட்ட தெய்வீகப் பெயர் நேரடியாக உள்ளது. அதை ‘கர்த்தர்’ போன்ற பட்டமாக மாற்றாமல், பொதுவாக ஏற்கப்படும் ஒலிப்புக்கு நெருக்கமாக ‘யாவே’ என்று வழங்கப்பட்டுள்ளது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் தீர்க்கமான எச்சரிக்கையின் கண்ணியமான தொனியைத் தக்கவைத்தும் மொழிபெயர்க்கப்பட்டுள்ளது. எபிரெயத்தில் இருமுறை வரும் ‘அந்நாளில்’ அப்படியே காக்கப்பட்டுள்ளது.
