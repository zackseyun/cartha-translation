base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/008/007.yaml
  text: And Yahweh said to Samuel[a], “Listen to the voice of the people in all that they say to you, for they have not rejected you, but they have rejected me from being king over them.”
translation:
  language: ta
  text: யாவே சாமுவேலிடம், “மக்கள் உன்னிடம் சொல்வதெல்லாவற்றிலும் அவர்களுடைய குரலுக்குச் செவிகொடு. ஏனெனில், அவர்கள் உன்னை நிராகரிக்கவில்லை; அவர்கள்மேல் நான் அரசாளாதபடி என்னையே நிராகரித்தார்கள்.[a]” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்கள்மேல் நான் அரசனாக இருக்காதபடி என்னையே நிராகரித்தார்கள்.”
    reason: מִמְּלֹךְ עֲלֵיהֶם என்பதில் அரசாளுதல்/ஆட்சி செய்தல் என்ற வினைநிலையும், அரசனாக இருத்தல் என்ற தனிப்பட்ட அரசர் அம்சமும் அடங்கும். மாற்று வாசகம் இரண்டாவது அம்சத்தை நேரடியாகக் காட்டுகிறது.
lexical_decisions:
- source_word: יְהוָה
  choice: யாவே
  rationale: இஸ்ரவேலின் இறைவனுடைய தனிப்பெயரை ஒரு பட்டப்பெயரால் மாற்றாமல், எபிரெய நான்கெழுத்துப் பெயரின் பரவலான ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: שְׁמַע בְּקוֹל הָעָם
  choice: மக்களின் குரலுக்குச் செவிகொடு
  rationale: ‘குரலுக்குச் செவிகொடு’ என்ற எபிரெயச் சொற்றொடரின் உருவகத்தைத் தக்கவைத்தபடியே, அவர்கள் கூறுவதை ஏற்று அதன்படி செயல்பட வேண்டிய சூழல்சார்ந்த பொருளையும் இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: לְכֹל אֲשֶׁר יֹאמְרוּ אֵלֶיךָ
  choice: மக்கள் உன்னிடம் சொல்வதெல்லாவற்றிலும்
  rationale: לְכֹל என்பதன் முழுமையான விரிவை ‘எல்லாவற்றிலும்’ என்பதால் பாதுகாத்து, தமிழில் இயல்பான தொடரமைப்பைக் கொண்டுள்ளது.
- source_word: מָאַס
  choice: புறக்கணித்திருக்கிறார்கள்
  rationale: இங்கு ஒருவரையும் அவருடைய அதிகாரத்தையும் ஏற்க மறுக்கும் ‘நிராகரித்தல்/ஒதுக்குதல்’ என்ற பொருளை ‘புறக்கணித்தல்’ தெளிவாக வெளிப்படுத்துகிறது; நிறைவேற்றப்பட்ட செயல் தற்போதைய நிலையை உருவாக்கியிருப்பதை நிகழ்நிறை வடிவம் காட்டுகிறது.
- source_word: כִּי לֹא אֹתְךָ מָאָסוּ כִּי אֹתִי מָאֲסוּ
  choice: அவர்கள் உன்னைப் புறக்கணிக்கவில்லை; … என்னையே புறக்கணித்திருக்கிறார்கள்
  rationale: எபிரெயத்தின் வலியுறுத்தப்பட்ட ‘உன்னை அல்ல—என்னையே’ என்ற முரண்பாட்டைத் தமிழில் ‘என்னையே’ என்பதன் மூலம் தெளிவாகப் பாதுகாக்கிறது.
- source_word: מִמְּלֹךְ עֲלֵיהֶם
  choice: அவர்கள்மேல் நான் அரசாளுவதை ஏற்காமல்
  rationale: 'מן உடன் வரும் מלך வினையெச்சத்தின் கருத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது: மக்கள் யாவேயின் அரசாட்சியை ஏற்க மறுத்ததன் மூலம் அவரையே புறக்கணித்தார்கள். ‘அரசாளுதல்’ மூலத்தின் வினைத் தன்மையைத் தக்கவைக்கிறது.'
theological_decisions:
- issue: மனித அரசனுக்கான கோரிக்கையில் இறைவனுடைய அரசாட்சி நிராகரிக்கப்படுதல்
  choice: மக்கள் சாமுவேலை மட்டுமல்ல, தங்கள்மேல் யாவே அரசாளுவதையே ஏற்காமல் அவரைப் புறக்கணித்தார்கள் என்று வசனம் கூறுகிறது.
  alternative: மக்கள் யாவேயை நேரடியாகப் புறக்கணிக்காமல், சாமுவேலின் தலைமையை மட்டுமே நிராகரித்தார்கள்.
  rationale: எபிரெய உரை ‘உன்னை அல்ல, என்னையே’ என்று வெளிப்படையாக முரண்படுத்தி, அவர்களுடைய கோரிக்கையின் ஆழமான பொருளை யாவேயின் அரசாட்சியை நிராகரிப்பதாக அடையாளப்படுத்துகிறது. இதற்கு அப்பாற்பட்ட கோட்பாட்டு விளக்கம் சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் மரியாதையான நடையைப் பயன்படுத்துகிறது. ‘யாவே’ தனிப்பெயராகவும், ‘செவிகொடு’ உயர்வான ஆனால் இயல்பான கட்டளையாகவும், ‘அரசாளுதல்’ இறை அரசாட்சிக்குரிய தெளிவான பொதுச்சொல்லாகவும் பயன்படுத்தப்பட்டுள்ளன.
