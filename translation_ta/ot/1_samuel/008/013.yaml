source:
  edition: WLC
  text: וְ/אֶת בְּנוֹתֵי/כֶ֖ם יִקָּ֑ח לְ/רַקָּח֥וֹת וּ/לְ/טַבָּח֖וֹת וּ/לְ/אֹפֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/008/013.yaml
  text: He will take your daughters to be perfumers[a], cooks, and bakers.
translation:
  language: ta
  text: அவன் உங்கள் மகள்களை நறுமணக் கலவைகள் தயாரிப்பவர்களாகவும்[a], சமையல்காரர்களாகவும், அப்பம் சுடுபவர்களாகவும் எடுத்துக்கொள்வான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நறுமண எண்ணெய்கள் அல்லது களிம்புகள் தயாரிப்பவர்களாக.” எபிரெயச் சொல் வாசனைத் திரவியங்கள் உட்படப் பலவகை மணமிக்க கலவைகளைத் தயாரிப்பவர்களைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶת
  choice: '[தனியாக மொழிபெயர்க்கப்படவில்லை]'
  rationale: இது ‘உங்கள் மகள்களை’ என்பதைக் ‘அழைத்துச் செல்வான்’ என்ற வினையின் நேரடிச் செயப்படுபொருளாகக் குறிக்கிறது; தமிழில் இதற்குத் தனிச்சொல் தேவையில்லை, ‘-ஐ’ வேற்றுமையுருபு அந்தப் பணியைச் செய்கிறது.
- source_word: בְּנוֹתֵיכֶם
  choice: உங்கள் மகள்களை
  rationale: ‘மகள்’ என்ற சொல்லின் பன்மையுடன் இரண்டாம் நபர் ஆண்பால் பன்மை உடைமை விகுதி சேர்ந்துள்ளது. அரசனின் கட்டாயப் பணியமர்த்தலைப் பற்றிய சூழலில் குடும்ப உறவைக் குறிக்கும் ‘உங்கள் மகள்கள்’ என்பதே முதன்மையான பொருள்.
- source_word: יִקָּח
  choice: அழைத்துச் செல்வான்
  rationale: Qal imperfect இங்கு சாமுவேல் எச்சரிக்கும் எதிர்காலச் செயலைக் குறிக்கிறது. எபிரெயச் சொல் ‘எடுத்துக்கொள்வான்’ அல்லது ‘கொண்டு செல்வான்’ என்ற வலிமையைக் கொண்டது; தமிழில் மனிதர்களைக் கட்டாயச் சேவைக்குக் கொண்டு செல்வதை ‘அழைத்துச் செல்வான்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: לְרַקָּחוֹת
  choice: நறுமணக் கலவைகள் தயாரிப்பவர்களாக
  rationale: இச்சொல் வாசனைத் திரவியங்கள், நறுமண எண்ணெய்கள் அல்லது களிம்புகள் போன்ற மணமிக்க கலவைகளைத் தயாரிக்கும் பெண்களைக் குறிக்கலாம். மூலத்தின் பரந்த பொருளைச் சுருக்காமல் காக்க இந்த வடிவம் தேர்ந்தெடுக்கப்பட்டது.
- source_word: וּלְטַבָּחוֹת
  choice: சமையல்காரர்களாக
  rationale: உணவு தயாரிக்கும் பெண்களைக் குறிக்கும் பெண்பால் பன்மைப் பெயர். ‘மகள்கள்’ என்பதால் பாலினம் ஏற்கெனவே தெளிவாக உள்ளது; நவீன தமிழில் ‘சமையல்காரர்கள்’ இயல்பான தொழிற்பெயர்.
- source_word: וּלְאֹפוֹת
  choice: அப்பம் சுடுகிறவர்களாக
  rationale: ‘சுடுதல்’ என்ற வினையிலிருந்து உருவான, சுடும் தொழில் செய்யும் பெண்களைக் குறிக்கும் வடிவம். பண்டைய சூழலில் முதன்மையாக அப்பம் சுடுவோரைக் குறிப்பதால் ‘அப்பம்’ வெளிப்படையாகச் சேர்க்கப்பட்டது.
theological_decisions:
- issue: அரசன் மகள்களை ‘எடுப்பது’ என்பதன் தன்மை
  choice: பணியமர்த்துவதற்காக அழைத்துச் செல்வான்
  alternative: எடுத்துக்கொள்வான்
  rationale: இது அரச சேவைக்கான கட்டாய ஆட்சேர்ப்பைப் பற்றிய எச்சரிக்கை என்பதை சூழல் காட்டுகிறது. ‘பணியமர்த்துவதற்காக’ நோக்கத்தைத் தெளிவாக்குகிறது; ‘அழைத்துச் செல்வான்’ மூலத்தில் உள்ள அதிகார வலிமையையும் முற்றிலும் மென்மையாக்காமல் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. அரசனின் கட்டாய ஆட்சேர்ப்பு என்ற தொனி காக்கப்பட்டுள்ளது. ‘நறுமணக் கலவைகள்’ என்பது மூலச்சொல்லின் பொருள் பரப்பைத் தக்கவைக்கிறது; அடிக்குறிப்பு மாற்றுப் பொருளை விளக்குகிறது.
