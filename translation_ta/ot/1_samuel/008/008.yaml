    reason: lexical_alternative
  revision_rationale: The revision replaces the non-comparative “செயல்களின்படியே” with “செயல்களைப் போலவே,” which accurately carries the Hebrew comparison completed by “அவ்வாறே/so” in the apodosis. It removes the unnecessary progressive nuance, uses the conventional Exodus expression “வெளியே கொண்டு வந்த,” and retains the Hebrew's open-ended “அவர்கள் உனக்கும் செய்கிறார்கள்.” The temporal-alternative footnote is omitted because “இந்நாள்வரை” already conveys the source expression and no materially distinct Tamil alternative needs anchoring.
