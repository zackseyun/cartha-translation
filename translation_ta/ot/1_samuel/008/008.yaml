base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/008/008.yaml
  text: According to all the deeds that they have done from the day I brought them up out of Egypt to this day[a], forsaking me and serving other gods[b], so they are also doing to you.
translation:
  language: ta
  text: நான் அவர்களை எகிப்திலிருந்து வெளியே கொண்டு வந்த நாள்முதல் இந்நாள்வரை அவர்கள் செய்த எல்லாச் செயல்களைப் போலவே—என்னைக் கைவிட்டு வேறு தெய்வங்களுக்குச் சேவை செய்து[a]—அவர்கள் உனக்கும் செய்கிறார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “வேறு தெய்வங்களுக்குச் சேவை செய்து” என்பதை “வேறு தெய்வங்களை வழிபட்டு” என்றும் கூறலாம்; எபிரேய வினைச்சொல்லின் நேரடிப் பொருள் “சேவை செய்” என்பதாகும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּכָל הַמַּעֲשִׂים אֲשֶׁר עָשׂוּ
  choice: அவர்கள் செய்துவரும் எல்லாச் செயல்களின்படியே
  rationale: כְּכָל என்பதன் ஒப்பீட்டு/ஒத்திசைவு வலிமையை ‘எல்லாச் செயல்களின்படியே’ எனக் காக்கிறது; கடந்த காலத்திலிருந்து தொடரும் நடத்தை ‘செய்துவரும்’ என்பதால் இயல்பாக வெளிப்படுகிறது.
- source_word: מִיּוֹם הַעֲלֹתִי אֹתָם מִמִּצְרַיִם
  choice: நான் அவர்களை எகிப்திலிருந்து கொண்டுவந்த நாள்முதல்
  rationale: Hiphil הַעֲלֹתִי-யின் காரணவினைப் பொருளைத் தெளிவாகக் காட்டி, வெளியேற்ற நிகழ்வைக் குறிக்கும் எபிரேய சொல்லாட்சியை இயல்பான தமிழில் தருகிறது.
- source_word: וְעַד הַיּוֹם הַזֶּה
  choice: இந்நாள்வரை
  rationale: குறிப்பிட்ட கடந்த நாளிலிருந்து பேசப்படும் தற்போதைய நாள்வரையிலான கால எல்லையைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: וַיַּעַזְבֻנִי
  choice: என்னைக் கைவிட்டு
  rationale: עָזַב என்பதன் விட்டுவிடுதல்/துறத்தல் பொருளையும் உடன்படிக்கைத் துரோகத்தின் கனத்தையும் மிகைவிளக்கமின்றிக் காக்கிறது.
- source_word: וַיַּעַבְדוּ אֱלֹהִים אֲחֵרִים
  choice: வேறு தெய்வங்களுக்குப் பணிசெய்தார்கள்
  rationale: עבד என்பதன் அடிப்படைப் ‘பணிசெய்/சேவைசெய்’ பொருளைக் காக்கிறது; தெய்வங்களைப் பொறுத்த சூழலில் வழிபாட்டு விசுவாசத்தையும் உணர்த்துகிறது.
- source_word: כֵּן הֵמָּה עֹשִׂים גַּם לָךְ
  choice: அவ்வாறே உனக்கும் செய்கிறார்கள்
  rationale: Samuel எதிர்கொள்ளும் செயல் ஆண்டவருக்கு எதிரான முந்தைய நடத்தைக்கு ஒத்தது என்பதைத் தெரிவிக்கிறது; ‘என்ன செய்கிறார்கள்’ என்ற எபிரேய வாக்கியத்தின் விடுபாட்டை விளக்கிச் சேர்க்காமல் காக்கிறது.
theological_decisions:
- issue: சாமுவேலை அவர்கள் நடத்தும் விதத்துக்கும் ஆண்டவரை அவர்கள் நிராகரித்த தொடர்ச்சியான நடத்தைக்கும் உள்ள உறவு
  choice: ‘அவ்வாறே உனக்கும் செய்கிறார்கள்’ என்று ஒப்புமையை மட்டும் வெளிப்படுத்துதல்
  alternative: ‘எனக்கு எதிராகக் கலகம் செய்ததுபோல் உனக்கும் எதிராகக் கலகம் செய்கிறார்கள்’ என்று விளக்கமாக மொழிபெயர்த்தல்
  rationale: மூல எபிரேயம் ஆண்டவரைக் கைவிட்டு வேறு தெய்வங்களுக்குப் பணிசெய்த வரலாற்றையும் சாமுவேலுக்குச் செய்யப்படுவதையும் ஒப்பிடுகிறது; ஆனால் ‘கலகம்’ போன்ற கூடுதல் விளக்கச் சொல்லை நேரடியாகப் பயன்படுத்தவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான நடை. ‘பணிசெய்தார்கள்’ என்பது மூலச்சொல்லுக்கு நெருக்கமாக இருக்க, அடிக்குறிப்பு அதன் வழிபாட்டுப் பொருளை விளக்குகிறது. இறுதி சொற்றொடரின் திட்டமிட்ட விடுபாடு தமிழிலும் காக்கப்பட்டுள்ளது.
