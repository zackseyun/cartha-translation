source:
  edition: WLC
  text: וַ/יִּשְׁמַ֣ע שְׁמוּאֵ֔ל אֵ֖ת כָּל דִּבְרֵ֣י הָ/עָ֑ם וַֽ/יְדַבְּרֵ֖/ם בְּ/אָזְנֵ֥י יְהוָֽה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/008/021.yaml
  text: Samuel heard all the words of the people[b][a], and he spoke them in the ears of Yahweh.
translation:
  language: ta
  text: சாமுவேல் மக்களின் எல்லா வார்த்தைகளையும் கேட்டார்; அவற்றை யாவேயின் செவிகளில் சொன்னார்.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “யாவேயின் செவிகளில்”; அதாவது, யாவே கேட்கும்படி அல்லது அவருடைய முன்னிலையில்.
    reason: lexical_alternative
  - marker: b
    text: இங்கு வரும் இறைப்பெயர் எபிரெயத்தில் יהוה (YHWH). இம்மொழிபெயர்ப்பில் அது “யாவே” என வழங்கப்படுகிறது; பாரம்பரியமாக “யெகோவா” என்றும், பல மொழிபெயர்ப்புகளில் “கர்த்தர்” என்றும் வழங்கப்படுகிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: கேட்டார்
  rationale: שׁמע இங்கு தொடர்கதை வடிவில் மக்கள் சொன்னவற்றைச் சாமுவேல் கேட்டதைக் குறிக்கிறது; ‘கேட்டார்’ இயல்பானதும் மூலத்திற்கு நெருக்கமானதும் ஆகும்.
- source_word: כָּל דִּבְרֵי הָעָם
  choice: மக்களின் எல்லா வார்த்தைகளையும்
  rationale: כָּל என்பதன் முழுமையையும் דִּבְרֵי என்பதன் ‘வார்த்தைகள்’ என்ற வடிவத்தையும் தக்கவைக்கிறது; தமிழிலும் தெளிவாக உள்ளது.
- source_word: וַיְדַבְּרֵם
  choice: அவற்றை ... சொன்னார்
  rationale: ஆண்பால் பன்மை பின்னொட்டு மக்களின் வார்த்தைகளைக் குறிக்கிறது. ‘அவற்றைச் சொன்னார்’ என்பது எபிரெயக் கட்டமைப்பைப் பிரதிபலிக்கிறது; ‘அறிவித்தார்’ எனப் பொருளை விரிவாக்கவில்லை.
- source_word: בְּאָזְנֵי
  choice: செவிகளில்
  rationale: ‘செவிகளில்’ என்ற எபிரெய மொழிமரபின் உருவகத்தைத் தக்கவைக்கிறது; இதன் பொருள் அவருடைய செவிப்பட அல்லது அவருடைய முன்னிலையில் என்பதாகும்.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் நன்கு அறியப்பட்ட தனிப்பெயர் வடிவம்; மூலத்திலுள்ள יהוה என்ற இறைப்பெயரை ஒரு பட்டத்தால் மாற்றாமல் வெளிப்படுத்துகிறது. உச்சரிப்பு உறுதியற்றது என்பதால் மாற்று வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: שְׁמוּאֵל
  choice: சாமுவேல்
  rationale: தமிழில் நிலைபெற்றுள்ள வேதாகமப் பெயர்வடிவம்.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யெகோவா
  alternative: யாவே; கர்த்தர்
  rationale: மூல உரை இறைவனுடைய தனிப்பெயரை நேரடியாகக் கொண்டுள்ளது. தமிழில் பரவலாக அறியப்பட்ட ‘யெகோவா’ பயன்படுத்தப்பட்டு, சாத்தியமான ‘யாவே’ உச்சரிப்பு அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது; ‘கர்த்தர்’ என்பது பெயருக்குப் பதிலான பட்டமாகும்.
- issue: בְּאָזְנֵי என்ற உருவக மொழிமரபு
  choice: யெகோவாவின் செவிகளில்
  alternative: யெகோவாவின் முன்னிலையில்; யெகோவாவிடம்
  rationale: மூலத்தின் உடலுறுப்பு உருவகத்தைப் பாதுகாக்கிறது; இதை இறைவனுடைய உடலமைப்பு குறித்த கோட்பாட்டுக் கூற்றாக அல்லாமல், அவர் கேட்கும்படி அல்லது அவர் முன்னிலையில் என்ற மொழிமரபாக அடிக்குறிப்பு விளக்குகிறது.
translation_notes:
  register: நவீனத் தரத்தமிழில் எளிமையும் கண்ணியமும் பேணப்பட்டுள்ளன. ‘செவிகளில்’ என்ற சற்றே முறையான சொற்றொடர் மூல எபிரெய உருவகத்தைத் தக்கவைக்கத் திட்டமிட்டே பயன்படுத்தப்பட்டுள்ளது; அதன் பொருள் அடிக்குறிப்பில் தெளிவுபடுத்தப்படுகிறது.
