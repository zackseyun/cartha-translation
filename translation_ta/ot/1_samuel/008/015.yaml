  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. எபிரெய வாக்கியத்தின் எதிர்கால எச்சரிக்கைத் தொனியும் ‘பத்தில் ஒரு பங்கு’ என்ற அளவும் தெளிவாகப் பாதுகாக்கப்பட்டுள்ளன.
