  yaml_path: translation/ot/1_samuel/008/015.yaml
  text: He will take a tenth of your seed and your vineyards and give it to his officials and his servants[a].
translation:
  language: ta
  text: உங்கள் விதைகளிலும் உங்கள் திராட்சைத்தோட்டங்களிலும் பத்தில் ஒரு பங்கை அவன் எடுத்துத் தன் அதிகாரிகளுக்கும்[a] தன் பணியாளர்களுக்கும் கொடுப்பான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தன் அண்ணகர்களுக்கும்”; எபிரெயச் சொல் அரசவை அதிகாரிகளையோ அண்ணகர்களையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: זַרְעֵיכֶם
  choice: உங்கள் விதைகள்
  rationale: זֶרַע என்பதன் அடிப்படைப் பொருள் ‘விதை’; இங்கு திராட்சைத்தோட்டங்களுடன் இணைந்து, விதைப்புக்கான விதை அல்லது அதன் வேளாண் விளைச்சலைக் குறிக்கலாம். மூலத்தின் சொல்லாட்சியையும் அதன் பொருள் விரிவையும் காக்க ‘விதைகள்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: כַרְמֵיכֶם
  choice: உங்கள் திராட்சைத்தோட்டங்கள்
  rationale: כֶּרֶם வழக்கமாகத் திராட்சைத்தோட்டத்தைக் குறிக்கிறது; நேரடியான இயல்பான தமிழ் வடிவம் தேர்ந்தெடுக்கப்பட்டது.
- source_word: יַעְשֹׂר
  choice: பத்தில் ஒரு பங்கை ... எடுத்துத்
  rationale: Hiphil வடிவிலுள்ள עשר இங்கு பத்தில் ஒரு பங்கை வசூலிப்பதை அல்லது எடுத்துக்கொள்வதைக் குறிக்கிறது. அரசனின் கட்டாயப் பறிப்பைப் பற்றிய எச்சரிக்கைச் சூழலுக்கு இவ்வடிவம் பொருந்துகிறது.
- source_word: וְנָתַן
  choice: கொடுப்பான்
  rationale: முன்னுள்ள எதிர்கால வினையின் தொடர்ச்சியாக, அரசன் எடுத்த பங்கைத் தனது ஆட்களுக்குக் கொடுப்பான் என்ற எதிர்காலச் செயலை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: לְסָרִיסָיו
  choice: தன் அதிகாரிகளுக்கும்
  rationale: סָרִיס என்பது ‘அண்ணகர்’ என்றும், விரிவாக அரசவையின் ‘அதிகாரி’ என்றும் பொருள்படலாம். நிர்வாகச் சூழலில் ‘அதிகாரிகள்’ இயல்பானது; உடல்நிலையைத் தேவையின்றி குறிப்பதையும் தவிர்க்கிறது. மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டது.
- source_word: וְלַעֲבָדָיו
  choice: தன் பணியாளர்களுக்கும்
  rationale: עֶבֶד என்பது சூழலுக்கேற்ப பணியாளர், ஊழியர் அல்லது அடிமை எனப் பொருள்படும். இங்கு அரசனுக்குச் சேவை செய்யும் ஆட்களைப் பொதுவாகக் குறிப்பதால் ‘பணியாளர்கள்’ தேர்ந்தெடுக்கப்பட்டது.
