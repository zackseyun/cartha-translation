base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/008/022.yaml
  text: And Yahweh said to Samuel[a], “Listen to their voice and make a king for them.” Then Samuel said to the men of Israel, “Go[b], each man to his city.”
translation:
  language: ta
  text: யாவே சாமுவேலிடம், “அவர்களுடைய குரலுக்குச் செவிகொடு[a]; அவர்களுக்கு ஓர் அரசனை நியமி” என்றார். பின்பு சாமுவேல் இஸ்ரவேலின் ஆண்களிடம்[b], “அவரவர் தம் நகரத்துக்குப் போங்கள்” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அவர்களுடைய குரலுக்குச் செவிகொடு’ என்ற எபிரெய மரபுத்தொடர், ‘அவர்கள் சொல்வதைக் கேள்’ அல்லது ‘அவர்களுடைய வேண்டுகோளுக்கு இணங்கு’ என்றும் பொருள்படலாம்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில், ‘இஸ்ரவேலின் ஆண்கள்.’ இச்சொற்றொடர் அங்கே கூடியிருந்த இஸ்ரவேலரைப் பிரதிநிதித்துவமாகக் குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைப்பெயரான நான்கெழுத்துப் பெயரை ஒரு பட்டமாக மாற்றாமல், தமிழில் வழக்கமான ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: שְׁמַע בְּקוֹלָם
  choice: அவர்களுடைய குரலுக்குச் செவிகொடு
  rationale: எபிரெய மரபுத்தொடரின் உருவகத்தைத் தக்கவைத்தபடியே, அவர்களுடைய வேண்டுகோளை ஏற்றுச் செயல்படு என்ற சூழல்சார்ந்த பொருளையும் உணர்த்துகிறது.
- source_word: וְהִמְלַכְתָּ לָהֶם מֶלֶךְ
  choice: அவர்களுக்கு ஓர் அரசனை நியமி
  rationale: מלך என்பதன் ஹிஃபீல் வடிவம் ஒருவரை அரசனாக ஏற்படுத்துதல் அல்லது பதவியில் அமர்த்துதல் என்பதைக் குறிக்கிறது; ‘நியமி’ என்பது இதை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: אַנְשֵׁי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் ஆண்கள்
  rationale: மூலத்தின் வெளிப்படையான ஆண்பால் சொல்லைத் தக்கவைக்கிறது; அதேவேளையில் இது கூடியிருந்த இஸ்ரவேலரைப் பிரதிநிதித்துவமாகக் குறிக்கக்கூடும்.
- source_word: לְכוּ
  choice: போங்கள்
  rationale: பன்மை ஏவல் வடிவத்தை இயல்பான தமிழில் நேரடியாக வழங்குகிறது.
- source_word: אִישׁ לְעִירוֹ
  choice: அவரவர் தம் நகரத்துக்கு
  rationale: אִישׁ என்பதன் பகிர்நிலைப் பொருளான ‘ஒவ்வொருவரும்’ என்பதையும், ஒவ்வொருவரும் தமக்குரிய நகரத்திற்குத் திரும்ப வேண்டும் என்பதையும் இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை வழங்குதல்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலத்தில் தனிப்பட்ட இறைப்பெயர் நேரடியாக இருப்பதால், அதை ஒரு பட்டத்தால் மாற்றாமல் ஒலிபெயர்ப்பது உரையின் தன்மையைப் பாதுகாக்கிறது.
- issue: אַנְשֵׁי יִשְׂרָאֵל என்பதிலுள்ள பாலினக் குறிப்பு
  choice: இஸ்ரவேலின் ஆண்கள்
  alternative: இஸ்ரவேலர்; இஸ்ரவேல் மக்கள்
  rationale: மூலத்தின் வெளிப்படையான ஆண்பால் வடிவத்தை முதன்மை உரையில் காக்கிறது; அதன் பிரதிநிதித்துவப் பயன்பாட்டை அடிக்குறிப்பு சுட்டுகிறது.
translation_notes:
  register: நவீனத் தரத்தமிழில் இயல்பான, கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய மரபுத்தொடரின் உருவகம் தேவையான இடத்தில் தக்கவைக்கப்பட்டு, அதன் விரிந்த பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது. ‘அவரவர் தம் நகரத்துக்குப் போங்கள்’ என்பது பகிர்நிலை கட்டளையை இயல்பாக வெளிப்படுத்துகிறது.
