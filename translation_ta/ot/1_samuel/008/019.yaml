  text: וַ/יְמָאֲנ֣וּ הָ/עָ֔ם לִ/שְׁמֹ֖עַ בְּ/ק֣וֹל שְׁמוּאֵ֑ל וַ/יֹּאמְר֣וּ לֹּ֔א כִּ֥י אִם מֶ֖לֶךְ יִֽהְיֶ֥ה עָלֵֽי/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/008/019.yaml
  text: But the people refused to listen to the voice of Samuel[a], and they said, “No, but there shall be a king over us.”
translation:
  language: ta
  text: ஆனால் மக்கள் சாமுவேலின் குரலுக்குச் செவிகொடுக்க மறுத்து[a], “வேண்டாம்! எங்கள்மேல் ஓர் அரசன் இருக்க வேண்டும்” என்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘சாமுவேலுக்குக் கீழ்ப்படிய மறுத்து.’ ‘ஒருவரின் குரலுக்குச் செவிகொடு’ என்ற எபிரெய மரபுத்தொடர், வெறுமனே கேட்பதை மட்டுமல்லாமல் அவர் சொல்வதைக் கவனித்து ஏற்றுக்கொள்வதையோ கீழ்ப்படிவதையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְמָאֲנוּ
  choice: மறுத்து
  rationale: מָאֵן என்பது மனமின்மையை மட்டுமல்ல, திட்டவட்டமான மறுப்பையும் குறிக்கிறது. ‘மறுத்து’ என்பது இங்குள்ள மக்களின் எதிர்ப்பை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: הָעָם
  choice: மக்கள்
  rationale: இங்கு עַם என்பது அரசனைக் கோரிய இஸ்ரவேலரை ஒட்டுமொத்தமாகக் குறிக்கிறது; ‘மக்கள்’ என்பது இயல்பான கூட்டுப்பெயர்.
- source_word: לִשְׁמֹעַ בְּקוֹל שְׁמוּאֵל
  choice: சாமுவேலின் குரலுக்குச் செவிகொடுக்க
  rationale: שׁמע בקול என்ற எபிரெய மரபுத்தொடர் கேட்டல், கவனித்தல், கீழ்ப்படிதல் ஆகிய பொருள் நிழல்களைக் கொண்டது. ‘குரலுக்குச் செவிகொடுக்க’ என்பது மூல உருவகத்தையும் கீழ்ப்படிதல் சார்ந்த உட்பொருளையும் தக்கவைக்கிறது.
- source_word: שְׁמוּאֵל
  choice: சாமுவேல்
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் நிலைபெற்ற பெயர்வடிவம்.
- source_word: וַיֹּאמְרוּ
  choice: என்றார்கள்
  rationale: אָמַר என்பது பொதுவான பேச்சு வினை; மேற்கோளுக்குப் பின் ‘என்றார்கள்’ என்பது இயல்பான தமிழ் கதைநடை.
- source_word: לֹא
  choice: வேண்டாம்!
  rationale: தனித்து நிற்கும் לֹא, சாமுவேலின் எச்சரிக்கையை மக்கள் வலுவாக நிராகரிப்பதைச் சுட்டுகிறது. தமிழில் இச்சூழலில் ‘வேண்டாம்!’ என்பது வெறும் ‘இல்லை’ என்பதைவிட இயல்பான மறுப்பு.
- source_word: כִּי אִם
  choice: அதற்குப் பதிலாக வரும் வலியுறுத்தல்; தனிச் சொல் சேர்க்காமல் அடுத்த வாக்கியத்தின் எதிர்மறைத் திருப்பில் வெளிப்படுத்தப்பட்டது
  rationale: לֹא כִּי אִם என்பது ‘இல்லை; மாறாக/ஆனால்’ என்ற வலுவான எதிர்மறை அமைப்பு. தமிழில் ‘வேண்டாம்! எங்கள்மேல்...’ என்ற தொடரே அந்த முரண்பாட்டை இயல்பாகத் தருவதால் செயற்கையான இணைப்புச்சொல் தவிர்க்கப்பட்டது.
- source_word: מֶלֶךְ יִהְיֶה עָלֵינוּ
  choice: எங்கள்மேல் ஓர் அரசன் இருக்க வேண்டும்
  rationale: יִהְיֶה இங்கு சாதாரண எதிர்காலத்தைவிட மக்களின் உறுதியான கோரிக்கையை வெளிப்படுத்துகிறது. ‘இருக்க வேண்டும்’ அந்த வற்புறுத்தலைத் தருகிறது; ‘எங்கள்மேல்’ அரசனின் ஆட்சியுறவைப் பாதுகாக்கிறது.
theological_decisions:
- issue: மக்கள் சாமுவேலுக்குச் செவிகொடுக்காதது கேட்டலா அல்லது கீழ்ப்படியாமையா?
  choice: முதன்மை உரையில் ‘குரலுக்குச் செவிகொடுக்க’ என்று மூல மரபுத்தொடரைப் பாதுகாத்து, அடிக்குறிப்பில் கீழ்ப்படிதல் பொருளைக் குறிப்பது
  alternative: ‘சாமுவேலுக்குக் கீழ்ப்படிய மறுத்து’
  rationale: சூழலில் கீழ்ப்படியாமை தெளிவாக இருந்தாலும், எபிரெயச் சொற்றொடரின் கேட்டல்/கவனித்தல் உருவகத்தையும் அதன் பொருள் பரப்பையும் ஒரே பொருளாகச் சுருக்காமல் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘சாமுவேலின் குரலுக்குச் செவிகொடுக்க’ என்பது மூல எபிரெய உருவகத்தைத் தக்கவைக்கிறது; ‘ஓர் அரசன்’ என்பது உயிரெழுத்துக்கு முன் இயல்பான வடிவம். மக்களின் பிடிவாதத்தை உணர்த்த ‘வேண்டாம்!’ மற்றும் ‘இருக்க வேண்டும்’ பயன்படுத்தப்பட்டுள்ளன.
