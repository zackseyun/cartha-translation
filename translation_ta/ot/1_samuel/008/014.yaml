translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்கு எளிதில் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய வாக்கியத்தின் வேளாண் சொத்துப் பட்டியலும், அரசன் அவற்றை எடுத்துத் தன் பணியாளர்களுக்குக் கொடுப்பான் என்ற நேரடியான எச்சரிக்கைத் தொனியும் பேணப்பட்டுள்ளன. அடிக்குறிப்பு குறிகள் அவை விளக்கும் சொற்களோடு சரியாக இணைக்கப்பட்டுள்ளன.
