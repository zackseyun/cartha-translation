  source_fidelity: எபிரெய மூலத்தின் சொத்துப் பட்டியல்—உங்கள் வயல்கள், திராட்சைத்தோட்டங்கள், சிறந்த ஒலிவத் தோப்புகள்—துல்லியமாகப் பேணப்பட்டுள்ளது. הַטּוֹבִים என்பது கடைசியாக வரும் ஒலிவ உடைமைகளோடு இணைவது இயல்பான வாசிப்பு; ‘சிறந்த ஒலிவத் தோப்புகள்’ இதைச் சரியாக வெளிப்படுத்துகிறது. יִקָּח ... וְנָתַן என்பதன் எதிர்கால எச்சரிக்கைத் தொடரும் ‘எடுத்துத் ... கொடுப்பான்’ என விசுவாசமாக உள்ளது.
