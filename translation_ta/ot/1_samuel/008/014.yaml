  text: וְ/אֶת שְׂ֠דֽוֹתֵי/כֶם וְ/אֶת כַּרְמֵי/כֶ֧ם וְ/זֵיתֵי/כֶ֛ם הַ/טּוֹבִ֖ים יִקָּ֑ח וְ/נָתַ֖ן לַ/עֲבָדָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/008/014.yaml
  text: He will take your fields[a], your vineyards, and your best olive groves[b], and give them to his servants.
translation:
  language: ta
  text: அவன் உங்கள் வயல்களையும், திராட்சைத்தோட்டங்களையும், சிறந்த ஒலிவத் தோப்புகளையும்[a] எடுத்துத் தன் பணியாளர்களுக்குக்[b] கொடுப்பான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது ‘ஒலிவ மரங்களையும்’ அல்லது ‘ஒலிவத் தோட்டங்களையும்’; எபிரெயச் சொல் வேளாண் சொத்தாகிய ஒலிவப் பயிரிடுதலைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது ‘அடிமைகளுக்கு’; எபிரெயச் சொல் சூழலைப் பொறுத்து பணியாளர்களையோ அடிமைகளையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂדֹתֵיכֶם
  choice: உங்கள் வயல்கள்
  rationale: שָׂדֶה என்பது பொதுவாகப் பயிரிடப்படும் வயல் அல்லது நிலப்பரப்பைக் குறிக்கிறது; வேளாண் சொத்துகளின் இந்தப் பட்டியலில் ‘வயல்கள்’ என்பது நேரடியும் இயல்பானதுமான மொழிபெயர்ப்பு.
- source_word: כַּרְמֵיכֶם
  choice: உங்கள் திராட்சைத்தோட்டங்கள்
  rationale: כֶּרֶם வழக்கமாகத் திராட்சைத்தோட்டத்தைக் குறிக்கிறது; நவீனத் தமிழில் இது தெளிவான, துல்லியமான சொல்.
- source_word: זֵיתֵיכֶם
  choice: உங்கள் ஒலிவத் தோப்புகள்
  rationale: זַיִת என்பது ஒலிவ மரங்களையோ அவை பயிரிடப்பட்ட தோப்புகளையோ கூட்டாகக் குறிக்கலாம். வயல்கள், திராட்சைத்தோட்டங்கள் ஆகியவற்றுக்கு இணையாக வருவதால், வேளாண் உடைமையைக் குறிக்கும் ‘ஒலிவத் தோப்புகள்’ பொருத்தமானது.
- source_word: הַטּוֹבִים
  choice: சிறந்த
  rationale: טוֹב அடிப்படையில் ‘நல்ல’ என்று பொருள்பட்டாலும், அரசன் சொத்துகளை எடுத்துக்கொள்ளும் இச்சூழலில் மிகவும் விரும்பத்தக்க அல்லது தரமான தோப்புகளைக் குறிக்கும் ‘சிறந்த’ என்பது இயல்பானது.
- source_word: יִקָּח
  choice: எடுத்துக் கொள்வான்
  rationale: לָקַח என்பதன் எளிய பொருள் ‘எடுத்தல்’. சூழல் அதன் கட்டாயத் தன்மையை வெளிப்படுத்துவதால், ‘பறித்துக்கொள்வான்’ என வலுப்படுத்தாமல் மூலத்தின் சொற்பொருள் எளிமை பேணப்படுகிறது.
- source_word: וְנָתַן
  choice: கொடுப்பான்
  rationale: נָתַן என்பதன் வழக்கமான பொருள் ‘கொடுத்தல்’; வாக்கியத்தின் எளிய எச்சரிக்கை நடைக்கும் இது ஏற்றது.
- source_word: לַעֲבָדָיו
  choice: தன் பணியாளர்களுக்கு
  rationale: עֶבֶד என்பது சூழலைப் பொறுத்து பணியாளர் அல்லது அடிமை எனப் பொருள்படும். இங்கு அரசனிடமிருந்து கைப்பற்றப்பட்ட சொத்தைப் பெறும் அரண்மனைப் பணியாளர்கள் அல்லது ஏவலர்கள் குறிக்கப்படுவதால் ‘பணியாளர்கள்’ முதன்மைத் தேர்வாகிறது; ‘அடிமைகள்’ என்ற சாத்தியம் அடிக்குறிப்பில் பேணப்படுகிறது.
