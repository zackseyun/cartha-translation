  text: וַ/יֹּאמְר֣וּ אֵלָ֗י/ו הִנֵּה֙ אַתָּ֣ה זָקַ֔נְתָּ וּ/בָנֶ֕י/ךָ לֹ֥א הָלְכ֖וּ בִּ/דְרָכֶ֑י/ךָ עַתָּ֗ה שִֽׂימָ/ה לָּ֥/נוּ מֶ֛לֶךְ לְ/שָׁפְטֵ֖/נוּ כְּ/כָל הַ/גּוֹיִֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/008/005.yaml
  text: They said to him[a], “Look, you have grown old, and your sons have not walked in your ways. Now appoint for us a king to judge us, like all the nations.”
translation:
  language: ta
  text: அவர்கள் அவரிடம், “இதோ, நீர் முதுமையடைந்துவிட்டீர்; உமது மகன்களோ உமது வழிகளில் நடக்கவில்லை. இப்போது, எல்லா தேசங்களையும் போல எங்களை நியாயந்தீர்க்க ஓர் அரசனை எங்களுக்கு நியமியும்” என்றார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה
  choice: இதோ
  rationale: எபிரெயச் சொல்லின் கவனத்தை ஈர்க்கும், நிலைமையைச் சுட்டிக்காட்டும் வலிமையைப் பேணும் இயல்பான தமிழ் உரையாடல் குறியீடு.
- source_word: זָקַנְתָּ
  choice: நீர் முதுமையடைந்துவிட்டீர்
  rationale: வினைச்சொல் காட்டும் முதுமையடையும் நிகழ்வையும் அதன் தற்போதைய விளைவுநிலையையும் எடுத்துரைக்கிறது.
- source_word: הָלְכוּ בִּדְרָכֶיךָ
  choice: உமது வழிகளில் நடக்கவில்லை
  rationale: ஒழுக்கமான வாழ்க்கையை ‘வழியில் நடப்பது’ எனக் கூறும் எபிரெய உருவகத்தைத் தெளிவான தமிழில் பேணுகிறது.
- source_word: שִׂימָה לָּנוּ
  choice: எங்களுக்கு ... நியமியும்
  rationale: அரசியல் தலைவரை ஏற்படுத்தும் கோரிக்கையை ‘நியமி’ துல்லியமாகத் தெரிவிக்கிறது; ஒருமை மரியாதை ஏவல் வடிவம் சாமுவேலிடம் நேரடியாகப் பேசுவதைப் பேணுகிறது.
- source_word: מֶלֶךְ
  choice: ஓர் அரசன்
  rationale: முடியாட்சி ஆட்சியாளரைக் குறிக்கும் பொதுப்பெயரின் நேரான, இயல்பான தமிழ் மொழிபெயர்ப்பு.
- source_word: לְשָׁפְטֵנוּ
  choice: எங்களுக்கு நியாயந்தீர்க்க
  rationale: שׁפט என்பதன் அடிப்படை நீதித்துறைப் பொருளைப் பிரதான உரையில் பேணுகிறது; இச்சூழலில் உள்ள விரிவான ஆட்சி அதிகாரம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: כְּכָל הַגּוֹיִם
  choice: மற்ற எல்லா தேசங்களுக்கும் இருப்பதுபோல
  rationale: சுற்றியுள்ள பிற மக்களினங்களின் முடியாட்சி அமைப்பை இஸ்ரவேலர் பின்பற்ற விரும்பிய ஒப்பீட்டை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: சுற்றியுள்ள மக்களைப் போல முடியாட்சியை நாடும் அரசியல் கோரிக்கை
  choice: மற்ற எல்லா தேசங்களுக்கும் இருப்பதுபோல
  alternative: மற்ற எல்லா பிற இனத்தாருக்கும் இருப்பதுபோல
  rationale: இங்கு גּוֹיִם என்பது பிற அரசியல் மக்களினங்களைக் குறிக்கிறது. ‘தேசங்கள்’ என்பது உடன்படிக்கைச் சூழலில் உள்ள வேறுபாட்டைப் பேணுவதோடு, பிற்கால மதச்சார்பு கொண்ட சொல்லாட்சியைத் தேவையின்றி புகுத்துவதில்லை.
- issue: அரசன் ‘நியாயந்தீர்ப்பது’ என்பதன் பரப்பு
  choice: எங்களுக்கு நியாயந்தீர்க்க
  alternative: எங்களை ஆள
  rationale: மூலச்சொல்லின் நீதித்துறைப் பொருளை மறைக்காமல் வைத்திருக்கிறது; அதேவேளை இச்சூழலில் அது பரந்த நிர்வாக மற்றும் ஆட்சி அதிகாரத்தையும் உள்ளடக்கலாம் என்பதை அடிக்குறிப்பு வெளிப்படையாகக் குறிப்பிடுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாமுவேலிடம் பேசுவதற்குரிய மரியாதையைப் பேணும் வகையில் ‘நீர்/உமது’ மற்றும் ஒருமை மரியாதை ஏவல் வடிவமான ‘நியமியும்’ பயன்படுத்தப்பட்டுள்ளன. நடையின் கண்ணியத்தையும் எபிரெய உருவகத்தையும் காக்கும் போதும் வாக்கியம் பொதுவாசகர்களுக்குத் தெளிவாக அமைக்கப்பட்டுள்ளது.
