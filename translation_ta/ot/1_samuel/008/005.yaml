revisions:
- from: அவர்கள் அவரிடம், “இதோ, நீர் முதுமையடைந்துவிட்டீர்; உமது மகன்களோ உமது வழிகளில் நடக்கவில்லை. இப்போது, மற்ற எல்லா தேசங்களுக்கும் இருப்பதுபோல, எங்களுக்கு நியாயந்தீர்க்க[a] ஓர் அரசனை நியமியும்” என்றார்கள்.
  to: அவர்கள் அவரிடம், “இதோ, நீர் முதுமையடைந்துவிட்டீர்; உமது மகன்களோ உமது வழிகளில் நடக்கவில்லை. இப்போது, எல்லா தேசங்களையும் போல எங்களை நியாயந்தீர்க்க ஓர் அரசனை எங்களுக்கு நியமியும்” என்றார்கள்.
  rationale: “எங்களை” is substituted for the second “எங்களுக்கு” to preserve the Hebrew object ‘us’ in ‘to judge us,’ while “எங்களுக்கு” remains with ‘appoint’ to represent ‘for us.’ The nations comparison is made more direct and idiomatic. The lexical footnote is retained, with only punctuation adjusted.
