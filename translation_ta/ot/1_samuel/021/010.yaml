  rationale: எபிரெயக் கட்டமைப்பிலுள்ள உடைமை உறவையும், கோலியாத்தின் இன அடையாளத்தையும் இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: הִכִּיתָ
  choice: நீ ... வீழ்த்திய
  rationale: נכה என்பதன் அடித்தல்/போரில் தோற்கடித்தல் என்ற வலிமையைத் தக்கவைத்து, இச்சூழலில் உயிரிழப்பைத் தேவைக்கு அதிகமாக வெளிப்படையாகச் சேர்க்காமல் கூறுகிறது.
- source_word: בְּעֵמֶק הָאֵלָה
  choice: ஏலா பள்ளத்தாக்கில்
  rationale: இடப்பெயரை ஒலிபெயர்த்து, עֵמֶק என்பதை நவீனத் தமிழில் தெளிவாகப் பெயர்க்கிறது.
- source_word: הִנֵּה
  choice: இதோ
  rationale: கேட்பவரின் கவனத்தைப் பொருளின்மீது திருப்பும் சுட்டிடைச்சொல்லின் செயல்பாட்டை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: לוּטָה בַשִּׂמְלָה
  choice: ஓர் ஆடையில் சுற்றி வைக்கப்பட்டிருக்கிறது
