  yaml_path: translation/ot/1_samuel/021/010.yaml
  text: And the priest said[a], “The sword of Goliath the Philistine, whom you struck down in the Valley of Elah—behold, it is wrapped in a cloth behind the ephod. If you will take that for yourself, take it, for there is no other here except it.” And David said, “There is none like it; give it to me.”
translation:
  language: ta
  text: 'ஆசாரியன் சொன்னான்: “நீ ஏலா பள்ளத்தாக்கில் வீழ்த்திய பெலிஸ்தியனான கோலியாத்தின் வாள் இதோ, அது ஏபோத்துக்குப் பின்னால் ஓர் ஆடையில்[a] சுற்றப்பட்டிருக்கிறது. அதை உனக்கென்று எடுத்துக்கொள்வாயானால், எடுத்துக்கொள்; இங்கே அதைத் தவிர வேறு வாள் எதுவும் இல்லை.” தாவீது, “அதற்கு இணையானது வேறொன்றும் இல்லை; அதை எனக்குக் கொடு” என்றான்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ஆடை” என்பதற்கான எபிரெயச் சொல் “மேலங்கி” அல்லது “மேலாடை” என்றும் மொழிபெயர்க்கப்படலாம்.
    reason: lexical_alternative
