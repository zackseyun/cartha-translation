base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/021/005.yaml
  text: The priest answered David and said[a], “There is no ordinary bread on hand, but there is holy bread—if the young men have kept themselves from women.”
translation:
  language: ta
  text: ஆசாரியன் தாவீதுக்குப் பதிலளித்து, “என்னிடம் சாதாரண அப்பம் இல்லை; ஆனால் பரிசுத்த அப்பம் இருக்கிறது—இளைஞர்கள் குறைந்தபட்சம் பெண்களிடமிருந்தாவது தங்களை விலக்கிக்கொண்டிருந்தால்[a]” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஒரு பெண்ணிடமிருந்து”; அதாவது, சடங்குசார் தூய்மைக்காகப் பாலுறவைத் தவிர்த்திருந்தால்.
    reason: எபிரேயத்தில் ‘பெண்’ என்பது ஒருமையில் இருந்தாலும் தொகுப்புப் பொருளில் அமையலாம்; சூழலில் இது பாலுறவிலிருந்து விலகியிருப்பதைக் குறிக்கிறது.
lexical_decisions:
- source_word: לֶחֶם חֹל
  choice: சாதாரண அப்பம்
  rationale: חֹל என்பது קֹדֶשׁ என்பதற்கு எதிராக, பரிசுத்தமாக ஒதுக்கப்படாத பொதுப் பயன்பாட்டு அப்பத்தைக் குறிக்கிறது; ஒழுக்கரீதியாகத் தீட்டானது என்று பொருள்படாது.
- source_word: אֶל תַּחַת יָדִי
  choice: என்னிடம்
  rationale: ‘என் கைக்குக் கீழே’ என்ற எபிரேய மரபுத்தொடர் இங்கு கைவசம் அல்லது உடைமையில் இருப்பதைக் குறிக்கிறது; ‘என்னிடம்’ என்பது இயல்பான தமிழ்.
- source_word: כִּי אִם
  choice: ஆனால் ... மட்டுமே
  rationale: சாதாரண அப்பம் இல்லை என்பதற்கும் பரிசுத்த அப்பம் இருக்கிறது என்பதற்கும் இடையிலான விதிவிலக்கையும் முரணையும் வெளிப்படுத்துகிறது.
- source_word: לֶחֶם קֹדֶשׁ
  choice: பரிசுத்த அப்பம்
  rationale: வழிபாட்டுப் பயன்பாட்டிற்காகத் தனியே ஒதுக்கப்பட்ட அப்பம் என்ற கருத்தை நேரடியாகவும் தெளிவாகவும் தருகிறது.
- source_word: אִם נִשְׁמְרוּ
  choice: விலக்கிக்கொண்டிருந்தால்
  rationale: நிபால் வடிவம் ஒருவரிடமிருந்து அல்லது ஒன்றிலிருந்து தன்னைக் காத்துக்கொள்வது, அதாவது விலகியிருப்பது என்ற பொருளைத் தருகிறது.
- source_word: הַנְּעָרִים
  choice: இளைஞர்கள்
  rationale: இந்தச் சொல் இளைஞர்களையோ உடனிருந்த பணியாளர்களையோ குறிக்கலாம்; சூழலில் தாவீதின் உடனிருந்தவர்களைக் குறித்தாலும், ‘இளைஞர்கள்’ மூலச்சொல்லின் இயல்பான பரப்பைத் தக்கவைக்கிறது.
- source_word: אַךְ
  choice: தங்களை விலக்கிக்கொண்டிருந்தால்
  rationale: אַךְ இங்கு நிபந்தனையை வரையறுக்கிறது. தமிழில் தனியே ‘குறைந்தபட்சம்’ என்று சேர்ப்பது தேவையற்ற விளக்க நுணுக்கத்தை உருவாக்கக்கூடும்; நிபந்தனை வாக்கிய அமைப்பிலேயே அதன் கட்டுப்படுத்தும் வலிமை வெளிப்படுகிறது.
- source_word: מֵאִשָּׁה
  choice: பெண்களிடமிருந்து
  rationale: מן உடன் வரும் ஒருமைச் சொல் தொகுப்புப் பொருளில் அமையலாம். ‘பெண்களிடமிருந்து’ என்பது எபிரேயத்தின் சுருக்கத்தையும் இயல்பான தமிழையும் காக்கிறது; குறிப்பான பொருள் அடிக்குறிப்பில் விளக்கப்படுகிறது.
theological_decisions:
- issue: பரிசுத்த அப்பத்தைப் பெறுவதற்கான வழிபாட்டுத் தூய்மை நிபந்தனை
  choice: இளைஞர்கள் பெண்களிடமிருந்து தங்களை விலக்கிக்கொண்டிருக்க வேண்டும் என்ற நிபந்தனையை, மூலத்தில் உள்ள சுருக்கத்தோடு வழங்குதல்.
  alternative: ‘வழிபாட்டுத் தூய்மைக்காகப் பெண்களுடன் உடலுறவு கொள்ளாமல் இருந்திருந்தால்’ என்று வெளிப்படையாக விரித்துரைத்தல்.
  rationale: இவ்வசனம் வழிபாட்டுத் தூய்மை மற்றும் பரிசுத்தம் சார்ந்த சூழலைக் குறிக்கிறது; பெண்களையோ பாலுறவையோ பொதுவாகத் தீட்டானவை என்று கூறவில்லை. ஆகவே பிரதான உரை மூலத்தின் சுருக்கத்தையும் இறையியல் பதற்றத்தையும் காக்கிறது; தேவையான விளக்கம் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், கண்ணியமான வேதாகம நடையுடன் வடிவமைக்கப்பட்டுள்ளது. ‘சாதாரண அப்பம் / பரிசுத்த அப்பம்’ என்ற வழிபாட்டுசார் எதிர்மறை இணை பாதுகாக்கப்பட்டுள்ளது. எபிரேய வாக்கியத்தின் இறுதி நிபந்தனை வெளிப்படையாக நிரப்பப்படாமல் விடப்பட்டிருப்பதால், மூலத்தின் சுருக்கமும் உண்மையான தெளிவின்மையும் தக்கவைக்கப்பட்டுள்ளன.
