- from: ஆசாரியன் தாவீதுக்குப் பதிலளித்து, “என்னிடம் சாதாரண அப்பம் இல்லை; பரிசுத்த அப்பம் மட்டுமே இருக்கிறது—இளைஞர்கள் பெண்களிடமிருந்து தங்களை விலக்கிக்கொண்டிருந்தால்[a]” என்றான்.
