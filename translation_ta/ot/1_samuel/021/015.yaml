source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר אָכִ֖ישׁ אֶל עֲבָדָ֑י/ו הִנֵּ֤ה תִרְאוּ֙ אִ֣ישׁ מִשְׁתַּגֵּ֔עַ לָ֛/מָּה תָּבִ֥יאוּ אֹת֖/וֹ אֵלָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/021/015.yaml
  text: And Achish said to his servants[a], “Look, you see a man acting like a madman. Why do you bring him to me?”
translation:
  language: ta
  text: ஆகீஷ் தன் பணியாளர்களிடம், “இதோ, பைத்தியம் பிடித்தவனைப்போல் நடந்துகொள்ளும் ஒரு மனிதனை நீங்கள் பார்க்கிறீர்கள்.[a] ஏன் அவனை என்னிடம் கொண்டுவருகிறீர்கள்?” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பைத்தியம் பிடித்த ஒரு மனிதன்.” எபிரெயச் சொல் உண்மையான பைத்தியத்தையோ பைத்தியம் பிடித்ததுபோல் காட்டிக்கொள்ளும் நடத்தையையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: என்றான்
  rationale: எபிரெயக் கதைநடையின் தொடர்ச்சியைத் தமிழில் இயல்பான இறுதி உரையாடல் வினையால் வெளிப்படுத்துகிறது; தனியாக ‘அப்போது’ அல்லது ‘மேலும்’ சேர்த்து தொடர்பை மிகையாக விளக்கவில்லை.
- source_word: אָכִישׁ
  choice: ஆகீஷ்
  rationale: எபிரெயப் பெயரின் ஒலியை நவீன தமிழில் எழுத்துப்பெயர்த்துள்ளது.
- source_word: עֲבָדָיו
  choice: தன் பணியாளர்களிடம்
  rationale: அரசவையில் அரசனுக்குப் பணிபுரிபவர்களைக் குறிக்கும் சொல்லை நேரடியாகவும் இயல்பாகவும் வழங்குகிறது.
- source_word: הִנֵּה תִרְאוּ
  choice: இதோ, ... நீங்கள் பார்க்கிறீர்கள்
  rationale: கவனத்தை ஈர்க்கும் הִנֵּה என்பதையும் இரண்டாம் நபர் பன்மை வினையையும் இரண்டையும் காக்கிறது.
- source_word: אִישׁ
  choice: ஒரு மனிதனை
  rationale: மூலத்தில் உள்ள பொதுவான ஆண்பால் மனிதர் குறிக்கும் சொல்லைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: מִשְׁתַּגֵּעַ
  choice: பைத்தியம் பிடித்தவனைப்போல் நடந்துகொள்ளும்
  rationale: இது உண்மையான மனநிலையையோ பைத்தியம்போல் காட்டிக்கொள்ளும் நடத்தையையோ குறிக்கக்கூடிய தொடர்நிலைப் பங்கேற்புச் சொல்; தமிழில் நடத்தை சார்ந்த பொருளை இயல்பாகத் தருகிறது.
- source_word: לָמָּה תָּבִיאוּ אֹתוֹ אֵלָי
  choice: ஏன் அவனை என்னிடம் கொண்டுவருகிறீர்கள்?
  rationale: கேள்வியையும் இரண்டாம் நபர் பன்மை முற்றாத வினையின் நேரடி நிகழ்காலத் தாக்கத்தையும் இயல்பான தமிழில் காக்கிறது.
theological_decisions:
- issue: מִשְׁתַּגֵּעַ என்பது உண்மையான பைத்தியமா அல்லது நடித்த நடத்தையா
  choice: பைத்தியம் பிடித்தவனைப்போல் நடந்துகொள்ளும்
  alternative: பைத்தியம் பிடித்த மனிதன்
  rationale: சூழலில் தாவீது அவ்வாறு நடித்தாலும், இந்த வடிவம் செயலை விவரிக்கிறது; ஆகீஷ் அவனுடைய உள்ளார்ந்த நிலையைத் தீர்மானித்ததாக மொழிபெயர்க்காமல் மூலத்தின் நுட்பத்தைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியக்கூடியதும் கண்ணியமானதுமான உரைநடை பயன்படுத்தப்பட்டுள்ளது. அரசவைக் சூழலுக்கேற்றவாறு עֲבָדָיו என்பதற்கு ‘பணியாளர்கள்’ தேர்ந்தெடுக்கப்பட்டது; பேச்சு நேரடியாகவும் இயல்பாகவும் வைக்கப்பட்டது.
