base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/021/002.yaml
  text: David came to Nob, to Ahimelech the priest. Ahimelech trembled when he met David and said to him, “Why are you alone, and no man is with you?”
translation:
  language: ta
  text: தாவீது நோபுக்கு வந்து, ஆசாரியனான அகிமெலேக்கிடம் சென்றார். அகிமெலேக்கு தாவீதைச் சந்தித்தபோது நடுங்கி, அவரிடம், “நீர் ஏன் தனியாக இருக்கிறீர்? உம்முடன் யாரும் இல்லையே?” என்று கேட்டார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֶּחֱרַד
  choice: நடுங்கி
  rationale: இந்த வினைச்சொல் பயம் அல்லது கலக்கத்தால் உடல் நடுங்குவதைக் குறிக்கலாம்; மூலத்தின் தீவிரத்தைத் தக்கவைக்கிறது.
- source_word: לִקְרַאת דָּוִד
  choice: தாவீதைச் சந்தித்தபோது
  rationale: எதிர்கொண்டு சந்திக்கச் செல்வது என்ற எபிரெயச் சொல்லாக்கத்தை இயல்பான தமிழில் தருகிறது.
- source_word: וְאִישׁ אֵין אִתָּךְ
  choice: உம்முடன் ஒருவரும் இல்லையே?
  rationale: אִישׁ என்பதைக் கட்டாயமாக ஆண் பாலுக்குள் சுருக்காமல், இச்சூழலில் தாவீதுடன் துணையாக யாரும் இல்லாததை இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழில், வேதாகம உரைக்கு ஏற்ற கண்ணியமான நடையைப் பேணுவதற்காக மரியாதை ஒருமை வடிவங்களான “நீர்/உம்முடன்” பயன்படுத்தப்பட்டுள்ளன. இடப்பெயர் நோபுடன் இயல்பான ஏழாம் வேற்றுமை இணைக்கப்பட்டுள்ளது.
