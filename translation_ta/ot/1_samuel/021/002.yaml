revisions:
- from: தாவீது நோபிலிருந்த ஆசாரியனான அகிமெலேக்கிடம் வந்தார். அகிமெலேக்கு தாவீதைச் சந்தித்தபோது நடுங்கி, அவரிடம், “நீர் ஏன் தனியாக இருக்கிறீர்? உம்முடன் ஒருவரும் இல்லையே?” என்று கேட்டார்.
  to: தாவீது நோபுக்கு வந்து, ஆசாரியனான அகிமெலேக்கிடம் சென்றார். அகிமெலேக்கு தாவீதைச் சந்தித்தபோது நடுங்கி, அவரிடம், “நீர் ஏன் தனியாக இருக்கிறீர்? உம்முடன் யாரும் இல்லையே?” என்று கேட்டார்.
  rationale: The first clause has been recast so that நோபு is unambiguously David's destination, while preserving the source's sequential reference to Ahimelech the priest. The remainder is retained apart from the small idiomatic refinement from “ஒருவரும்” to “யாரும்.”
