  rationale: The revised text moves [b] to its proper anchor, uses a broader Tamil term for כְּלֵי, and removes the added comparative and exclamatory force from the final difficult clause. It retains the source’s ambiguity regarding both the young men’s ‘vessels/gear’ and the meaning of בַּכֶּלִי.
