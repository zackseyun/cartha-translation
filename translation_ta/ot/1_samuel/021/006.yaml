base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/021/006.yaml
  text: David answered the priest and said to him[a], “Indeed, women have been kept from us as before, when I went out, and the young men’s vessels are holy, though it is an ordinary journey[d][c][b]. How much more today will it be made holy in the vessel.”
translation:
  language: ta
  text: 'தாவீது ஆசாரியனுக்குப் பதிலளித்து அவனிடம்[a] சொன்னான்: “பெண்கள் எங்களிடமிருந்து விலக்கப்பட்டிருக்கிறார்கள்; நான் புறப்பட்டபோது முன்பிருந்ததுபோலவே[b], இளைஞர்களின் பொருள்கள்[c] பரிசுத்தமானவை. இது சாதாரணமான பயணமாக இருந்தாலும்[d], இன்று அது அந்தப் பொருளில் பரிசுத்தமாக்கப்படும்.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது “ஒரு பெண் எங்களிடமிருந்து விலக்கப்பட்டிருக்கிறாள்,” அல்லது “நாங்கள் பெண்களிடமிருந்து விலகியிருந்தோம்.” பரிசுத்தமானவற்றைக் கையாள ஆயத்தமாகப் பாலுறவைத் தவிர்த்திருப்பதை எபிரெயச் சொற்றொடர் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: எழுத்துப்படி, “நேற்றும் மூன்று நாட்களுக்கு முன்பும் இருந்ததுபோல.” இது முந்தைய நாட்களைக் குறிக்கும் எபிரெய மரபுத்தொடர்; சிலர் இதை இன்னும் குறிப்பாக “சுமார் மூன்று நாட்களாக” எனப் புரிந்துகொள்கிறார்கள்.
    reason: lexical_alternative
  - marker: c
    text: “பொருள்கள்” என்பது இளைஞர்களின் உபகரணங்களைக் குறிக்கலாம்; சிலர் இதை அவர்களது உடல்கள் அல்லது அவர்களையே மறைமுகமாகக் குறிப்பதாகப் புரிந்துகொள்கிறார்கள்.
    reason: lexical_alternative
  - marker: d
    text: இறுதிப் பகுதியின் எபிரெய வாசகம் கடினமானது. “பயணம் சாதாரணமானதாக இருந்தாலும், இன்று பாத்திரம் அல்லது உபகரணத்தைப் பொறுத்தவரை அது பரிசுத்தமாக இருக்கும்” என்பதுபோலவும் இதைப் புரிந்துகொள்ளலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: אִשָּׁה עֲצֻרָה לָנוּ
  choice: பெண்கள் எங்களிடமிருந்து விலக்கப்பட்டிருந்தார்கள்
  rationale: இந்தச் சொற்றொடர் பரிசுத்தமானவற்றைக் கையாளுவதற்கான ஆயத்தமாகப் பெண்களோடு பாலுறவு கொள்ளாமல் இருந்ததைக் குறிக்கிறது. எபிரெய ஒருமை பொதுப்பொருளில் வரக்கூடும்; சூழலுக்கேற்ப தமிழில் பன்மை இயல்பாக உள்ளது. செயப்பாட்டு வடிவமும் பாதுகாக்கப்படுகிறது.
- source_word: כִּתְמוֹל שִׁלְשֹׁם
  choice: முன்பிருந்ததுபோலவே
  rationale: எழுத்துப்படி முந்தைய நாட்களைக் குறிக்கும் இந்த எபிரெய மரபுத்தொடர் சரியான நாட்கணக்கை கட்டாயப்படுத்தாமல், ஏற்கெனவே தொடர்ந்திருந்த விலகியிருத்தலைக் காட்டுகிறது.
- source_word: בְּצֵאתִי
  choice: நான் புறப்பட்டபோது
  rationale: முன்னிடைச்சொல்லுடன் கூடிய வினையெச்ச வடிவம் புறப்பட்ட நேரத்தைக் குறிக்கிறது; இத்தமிழாக்கம் இயல்பாக அந்தக் காலப்பொருளைத் தருகிறது.
- source_word: כְלֵי הַנְּעָרִים
  choice: இளைஞர்களின் பாத்திரங்கள்
  rationale: כְּלִי என்பது பாத்திரம், பொருள், கருவி அல்லது உடைமை எனப் பொருள்படலாம். இங்கு உபகரணங்களையோ மறைமுகமாக அவர்களது உடல்/ஆட்களையோ குறிக்கக்கூடிய தெளிவின்மையை ‘பாத்திரங்கள்’ காக்கிறது.
- source_word: קֹדֶשׁ
  choice: பரிசுத்தமானவை
  rationale: இச்சொல் புனிதப் பயன்பாட்டுக்கென்று பிரிக்கப்பட்ட நிலையைக் குறிக்கிறது. ‘சுத்தமானவை’ என்பது சடங்குத் தூய்மைக்கு மட்டும் பொருளைச் சுருக்கிவிடும்.
- source_word: וְהוּא דֶּרֶךְ חֹל
  choice: இது சாதாரணமான ஒரு பயணமாக இருந்தாலும்
  rationale: חֹל இங்கு ஒழுக்கரீதியான தீமையை அல்ல, பரிசுத்தத்துக்கு எதிரான சாதாரண நிலையைக் குறிக்கிறது; דֶּרֶךְ சூழலில் பயணம் என இயல்பாகப் பொருள்படுகிறது.
- source_word: וְאַף כִּי
  choice: இன்னும் எவ்வளவு அதிகமாக
  rationale: இச்சொற்றொடர் பொதுவாக வாதத்தை வலுப்படுத்தும் ‘எவ்வளவு அதிகமாக’ என்ற தொடர்ச்சியைக் காட்டுகிறது; இங்குள்ள இலக்கண அமைப்பு சுருக்கமானதும் விவாதத்திற்குரியதும் ஆகும்.
- source_word: הַיּוֹם יִקְדַּשׁ
  choice: இன்று ... பரிசுத்தமாக்கப்படும்
  rationale: קדשׁ என்பதன் நிறைவுறா வினைவடிவம் இச்சூழலில் செயப்பாட்டு அல்லது தற்சார்புப் பொருளில் அமையலாம். செயப்பாட்டு தமிழாக்கம் அதன் வினைத் தன்மையைப் பாதுகாக்கிறது.
- source_word: בַּכֶּלִי
  choice: பாத்திரத்தில்
  rationale: இந்த முன்னிடைச்சொல் தொடர் மிகவும் தெளிவற்றது. முன்பு வந்த כְּלֵי என்பதுடன் சொல் தொடர்பை வைத்துக்கொண்டு, உபகரணம், உடல் அல்லது வேறொரு பொருள் ஆகியவற்றுள் ஒன்றைத் தீர்மானித்துவிடாமல் ‘பாத்திரத்தில்’ என மொழிபெயர்க்கப்படுகிறது.
theological_decisions:
- issue: பரிசுத்த அப்பத்துடன் தொடர்புடைய சடங்குத் தூய்மையும் பாலுறவு விலக்கமும்
  choice: வசனத்தைச் சடங்குசார் பரிசுத்தம் மற்றும் அர்ப்பணிக்கப்பட்ட நிலை என்ற மொழியில் வழங்குதல்
  alternative: இதனை முதன்மையாக ஒழுக்கத் தூய்மை என்றோ வெறும் நடைமுறைச் சுத்தம் என்றோ விளக்குதல்
  rationale: சூழல் அர்ப்பணிக்கப்பட்ட அப்பத்தைப் பெறுவதற்கான தகுதியைப் பற்றியது. எபிரெய உரை பரிசுத்த நிலையையும் சாதாரண நிலையையும் வேறுபடுத்துகிறது; பாலுறவு விலக்கமும் சடங்குசார் ஆயத்தமும் இதில் தொடர்புடையதாகத் தெரிகின்றன. பிற்காலக் கோட்பாட்டுப் பிரிவுகளை உரைக்குள் புகுத்தாமல் அந்தப் பின்னணி பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான நடையுடன் மொழிபெயர்க்கப்பட்டுள்ளது. ‘ஆசாரியன்,’ ‘பரிசுத்தம்’ போன்ற பரவலாக அறியப்படும் வேதாகமச் சொற்கள் வைக்கப்பட்டுள்ளன. கடினமான இறுதிக் கூற்றின் தெளிவின்மையும் ‘பாத்திரங்கள்’ என்ற சொல்லின் இருபொருள் வாய்ப்பும் அடிக்குறிப்புகளால் பாதுகாக்கப்பட்டுள்ளன. அனைத்து அடிக்குறிப்பு குறிகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
