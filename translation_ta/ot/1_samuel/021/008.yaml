base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/021/008.yaml
  text: A man of Saul’s servants was there that day[a], detained before Yahweh; his name was Doeg the Edomite, the chief of Saul’s shepherds.
translation:
  language: ta
  text: அன்று சவுலின் ஊழியர்களில் ஒருவன் அங்கே இருந்தான். அவன் யாவேக்கு முன்பாகத் தடுத்து வைக்கப்பட்டிருந்தான்[a]. அவனுடைய பெயர் ஏதோமியனாகிய தோயேகு; அவன் சவுலின் மேய்ப்பர்களுக்குத் தலைவனாக இருந்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “யாவேக்கு முன்பாகக் கட்டுப்படுத்தப்பட்டிருந்தான்” அல்லது “யாவேக்கு முன்பாகத் தங்கவைக்கப்பட்டிருந்தான்” என்றும் மொழிபெயர்க்கலாம். தோயேகு ஏன் தடுத்து வைக்கப்பட்டிருந்தான் என்பதை எபிரெய உரை குறிப்பிடவில்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁם אִישׁ מֵעַבְדֵי שָׁאוּל בַּיּוֹם הַהוּא
  choice: அன்று சவுலின் ஊழியர்களில் ஒருவன் அங்கே இருந்தான்
  rationale: மִן குறிக்கும் பகுதியுறவை ‘ஊழியர்களில் ஒருவன்’ எனத் தெளிவாகவும், שָׁם மற்றும் temporal expression-ஐ இயல்பான தமிழ் சொல் வரிசையிலும் வழங்குகிறது. தொடக்க וְ தனியாக ‘மேலும்’ என்று மொழிபெயர்க்கப்படாமல் கதையின் தொடர்ச்சியில் இயல்பாக உட்பொதிகிறது.
- source_word: נֶעְצָר לִפְנֵי יְהוָה
  choice: யாவேக்கு முன்பாகத் தடுத்து வைக்கப்பட்டிருந்தான்
  rationale: נֶעְצָר என்பது தடுக்கப்பட்ட அல்லது அங்கேயே வைக்கப்பட்ட நிலையைச் சுட்டுகிறது; காரணம் மூலத்தில் கூறப்படாததால் அதைச் சேர்க்காமல் விடுகிறது. לִפְנֵי என்பதன் முன்னிலை/சந்நிதி நுணுக்கத்தை ‘முன்பாக’ காக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய தனிப்பெயரான தெய்வீகப் பெயரை ஒரு பட்டமாக மாற்றாமல், நவீன தமிழில் நேரடி ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: וּשְׁמוֹ דֹּאֵג הָאֲדֹמִי
  choice: அவன் பெயர் ஏதோமியனான தோவேக்கு
  rationale: பெயரிடும் சூத்திரத்தையும் இன அடையாளத்தையும் இயல்பான தமிழில் வழங்குகிறது. דֹּאֵג என்பதன் எபிரெய உச்சரிப்பை அணுகும் வகையில் ‘தோவேக்கு’ பயன்படுத்தப்படுகிறது.
- source_word: אַבִּיר הָרֹעִים אֲשֶׁר לְשָׁאוּל
  choice: அவன் சவுலின் மேய்ப்பர்களுக்குத் தலைவனாக இருந்தான்
  rationale: இந்த நிர்வாகச் சூழலில் אַבִּיר உடல் வலிமையைவிட முதன்மை அல்லது அதிகார நிலையைக் குறிக்க வாய்ப்புள்ளதால் ‘தலைவன்’ என வழங்கப்படுகிறது; אֲשֶׁר לְשָׁאוּל மேய்ப்பர்கள் சவுலைச் சேர்ந்தவர்கள் என்பதைத் தெளிவாக்குகிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரின் மொழியாக்கம்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் தனிப்பெயர் நேரடியாக இருப்பதால், அதை பொதுப் பட்டமாக மாற்றாமல் ஒலிபெயர்ப்பது உரையின் தன்மையைப் பாதுகாக்கிறது.
- issue: נֶעְצָר לִפְנֵי יְהוָה என்பதன் பொருள்
  choice: யாவேக்கு முன்பாகத் தடுத்து வைக்கப்பட்டிருந்தான்
  alternative: யாவேக்கு முன்பாகத் தங்கவைக்கப்பட்டிருந்தான்
  rationale: அவன் ஏன் அல்லது எந்தச் சடங்கு காரணத்தால் அங்கே இருந்தான் என்பதை உரை விளக்கவில்லை. ஆகவே காரணத்தை ஊகிக்காமல், கட்டுப்படுத்தப்பட்டிருந்த நிலையை மட்டும் மொழிபெயர்க்கிறது.
- issue: אַבִּיר הָרֹעִים என்பதன் பொருள்
  choice: மேய்ப்பர்களுக்குத் தலைவன்
  alternative: மேய்ப்பர்களில் வலிமைமிக்கவன்
  rationale: சவுலின் பணியாளர்களைப் பற்றிய சூழலில் பதவி அல்லது முதன்மை இயல்பாகப் பொருந்துகிறது; இருப்பினும் எபிரெயச் சொல்லுக்கு ‘வலிமைமிக்கவன்’ என்ற சொற்பொருள் வாய்ப்பும் உள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழ்; மரியாதையும் இயல்பும் கொண்ட கதைநடை. நீண்ட எபிரெய வாக்கியம் வாசிப்புத் தெளிவுக்காக மூன்று தமிழ் வாக்கியங்களாகப் பிரிக்கப்பட்டுள்ளது. ‘ஊழியர்’, ‘மேய்ப்பர்’, ‘தலைவன்’ ஆகியவை பொதுவாசகர்களுக்குப் புரியும் சொற்களாகத் தேர்ந்தெடுக்கப்பட்டுள்ளன.
