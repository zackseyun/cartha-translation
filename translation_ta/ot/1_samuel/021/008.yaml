    issue: The rendering of Doeg’s name as ‘தோவேக்கு’ is inaccurate.
    rationale: Hebrew דֹּאֵג is Doeg; the draft’s medial ‘வ’ introduces a consonant not represented in the source. The revised ‘தோயேகு’ more closely represents the name without importing an unsupported sound.
