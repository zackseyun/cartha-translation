  yaml_path: translation/ot/1_samuel/021/011.yaml
  text: So David arose and fled that day from Saul, and he came to Achish king of Gath.
translation:
  language: ta
  text: அன்று தாவீது எழுந்து, சவுலிடமிருந்து தப்பி ஓடி, காத் அரசனான ஆகீசிடம் சென்றார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּקָם
  choice: எழுந்து
  rationale: קום என்பதன் அடிப்படைப் பொருளான ‘எழுதல்’ என்பதையும் எபிரெயக் கதைத் தொடரையும் இயல்பான தமிழில் காக்கிறது.
- source_word: וַיִּבְרַח
  choice: தப்பியோடி
  rationale: ברח குறிக்கும் அவசரமான ஓட்டத்தையும் ஆபத்திலிருந்து தப்பிச் செல்லுதலையும் நவீன தமிழில் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: בַּיּוֹם הַהוּא
  choice: அன்று
  rationale: ‘அந்த நாளில்’ என்ற காலக் குறிப்பைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: מִפְּנֵי שָׁאוּל
  choice: சவுலிடமிருந்து
  rationale: சொல்லுக்குச் சொல் ‘சவுலின் முன்னிலையிலிருந்து’ என்றாலும், இச்சூழலில் சவுலிடமிருந்து தப்பிச் சென்றார் என்பதே இயல்பான பொருள்.
- source_word: וַיָּבֹא אֶל
  choice: சென்றார்
  rationale: בוא + אֶל இலக்கை நோக்கிச் செல்லுதல் அல்லது அங்கு வந்து சேர்தலைக் குறிக்கும்; தமிழ்க் கதைநடையில் ‘சென்றார்’ இயல்பானது.
- source_word: אָכִישׁ
  choice: ஆகீசு
  rationale: எபிரெயப் பெயரின் ஒலியைத் தமிழில் தெளிவாக எழுத்துப்பெயர்க்கிறது.
- source_word: מֶלֶךְ גַּת
  choice: காத்தின் அரசனாகிய
  rationale: இணைநிலை அமைப்பிலுள்ள அரசப் பதவியையும் காத்துடனான தொடர்பையும் தெளிவாகக் காட்டுகிறது.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய மொழியின் தொடர்ச்சியான வினை அமைப்பு தமிழில் வினையெச்சத் தொடராக வழங்கப்பட்டுள்ளது; தேவையற்ற விளக்கமோ சமயப் பிரிவுசார் பொருளோ சேர்க்கப்படவில்லை.
