  text: וַ/יֹּ֨אמְר֜וּ עַבְדֵ֤י אָכִישׁ֙ אֵלָ֔י/ו הֲ/לוֹא זֶ֥ה דָוִ֖ד מֶ֣לֶךְ הָ/אָ֑רֶץ הֲ/ל֣וֹא לָ/זֶ֗ה יַעֲנ֤וּ בַ/מְּחֹלוֹת֙ לֵ/אמֹ֔ר הִכָּ֤ה שָׁאוּל֙ ב/אלפ/ו וְ/דָוִ֖ד ב/רבבת/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/021/012.yaml
  text: And the servants of Achish said to him[a], “Is this not David, the king of the land? Is this not the one of whom they sang in the dances, saying, ‘Saul has struck down his thousands[b], and David his ten thousands’?”
translation:
  language: ta
  text: ஆகீசின் பணியாளர்கள் அவனிடம், “இவன் நாட்டின் அரசனான தாவீது அல்லவா? ‘சவுல் ஆயிரம் பேரைக் கொன்றுவீழ்த்தினார்; தாவீது பதினாயிரம் பேரைக் கொன்றுவீழ்த்தினார்’ என்று நடனங்களின்போது இவனைப் பற்றிப் பாடினார்கள்[a] அல்லவா?” என்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நடனங்களின்போது ஒருவருக்கொருவர் மறுமொழியாகப் பாடினார்கள்.”
    reason: ענה என்ற வினைச்சொல் இச்சூழலில் மாறிமாறி அல்லது மறுமொழியாகப் பாடுவதைக் குறிக்கக்கூடும்.
lexical_decisions:
- source_word: עַבְדֵי
  choice: பணியாளர்கள்
  rationale: இச்சொல் ஆகீசின் அரண்மனை அல்லது அரசவையைச் சேர்ந்தவர்களைக் குறிக்கலாம். ‘அதிகாரிகள்’ என்று செயல்பாட்டைச் சுருக்காமல், எபிரெயச் சொல்லின் பரந்த பொருளை ‘பணியாளர்கள்’ காக்கிறது.
- source_word: הֲלוֹא
  choice: அல்லவா? / தானே ...?
  rationale: ஒப்புதலை எதிர்பார்க்கும் வினாவடிவத்தை இயல்பான நவீனத் தமிழில் காக்கிறது.
- source_word: מֶלֶךְ הָאָרֶץ
  choice: இந்த நாட்டின் அரசன்
  rationale: சொற்றொடரை நேரடியாகப் பிரதிபலிக்கிறது; தாவீது அப்போது முறைப்படி அரசனாக இருந்தாரா அல்லது ஆகீசின் பணியாளர்கள் மிகைப்படுத்திப் பேசினார்களா என்பதை மொழிபெயர்ப்பு தீர்மானிக்கவில்லை.
- source_word: יַעֲנוּ
  choice: பாடினார்கள்
  rationale: நடனச் சூழலில் இவ்வினைச்சொல் பாடுவதையோ மறுமொழியாகப் பாடுவதையோ குறிக்கிறது. முதன்மை உரையில் இயல்பான ‘பாடினார்கள்’ பயன்படுத்தப்பட்டு, மறுமொழிப் பாடலின் சாத்தியம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: בַמְּחֹלוֹת
  choice: நடனங்களின்போது
  rationale: நடனக் கொண்டாட்டங்களின் சூழலைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: הִכָּה
  choice: வீழ்த்தினார்
  rationale: வெற்றிப் பாடலின் போர்ச் சூழலில் கொன்று வீழ்த்தியதைக் குறிக்கிறது; அதேவேளை தமிழில் கண்ணியமான, இயல்பான சொல்லாக உள்ளது.
- source_word: באלפו
  choice: ஆயிரக்கணக்கானோரை
  rationale: சவுலுக்குரிய போர்வெற்றியின் எண்ணிக்கையை இயல்பான தமிழில் தெரிவித்து, அடுத்த எண்ணுடன் உள்ள இணை அமைப்பைக் காக்கிறது.
- source_word: ברבבתו
  choice: பதினாயிரக்கணக்கானோரை
  rationale: רבבה என்பதன் ‘பத்தாயிரம்/எண்ணற்ற பெருந்தொகை’ பொருளையும் ‘ஆயிரக்கணக்கானோர்’ என்பதுடனான பாடல் இணை அமைப்பையும் காக்கிறது.
theological_decisions:
- issue: தாவீதை ‘நாட்டின் அரசன்’ என்று கூறுவது முறையான பட்டமா அல்லது பெலிஸ்தியப் பணியாளர்களின் பார்வையா?
  choice: இந்த நாட்டின் அரசனாகிய தாவீது
  alternative: இந்த நாட்டின் முதன்மையானவன் என்று கருதப்படும் தாவீது
  rationale: எபிரெய உரை பணியாளர்களின் சொற்களை விளக்கமின்றி அப்படியே பதிவு செய்கிறது. எனவே அவர்களுடைய கூற்று முறையான அரசுரிமையையா, மக்கள் பார்வையையா, மிகைப்படுத்தலையா குறிக்கிறது என்ற பதற்றம் தீர்க்கப்படாமல் விடப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், வாசிக்க எளிதானதாயும் கண்ணியமானதாயும் வடிவமைக்கப்பட்டது. மேற்கோளுக்குள் உள்ள வெற்றிப் பாடலின் இணை அமைப்பு காக்கப்பட்டுள்ளது. மூலத்தின் வினாவடிவமும் தாவீதின் நிலையைப் பற்றிய தெளிவின்மையும் விளக்கிச் சீராக்கப்படவில்லை.
