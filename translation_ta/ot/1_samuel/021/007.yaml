revisions:
- from: அதனால் ஆசாரியன் அவனுக்குப் பரிசுத்த அப்பத்தைக் கொடுத்தான். ஏனெனில், அங்கே யாவேயின் திருமுன்னிலிருந்து அகற்றப்பட்டிருந்த திருமுன்னிலை அப்பத்தைத்[a] தவிர வேறு அப்பம் இருக்கவில்லை. அது அகற்றப்பட்ட நாளில் அங்கே சூடான அப்பத்தை வைப்பதற்காக அகற்றப்பட்டிருந்தது.
