  text: וַ/יִּתֶּן ל֥/וֹ הַ/כֹּהֵ֖ן קֹ֑דֶשׁ כִּי֩ לֹא הָ֨יָה שָׁ֜ם לֶ֗חֶם כִּֽי אִם לֶ֤חֶם הַ/פָּנִים֙ הַ/מּֽוּסָרִים֙ מִ/לִּ/פְנֵ֣י יְהוָ֔ה לָ/שׂוּם֙ לֶ֣חֶם חֹ֔ם בְּ/י֖וֹם הִלָּקְחֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/021/007.yaml
  text: So the priest gave him holy bread[a], for there was no bread there except the bread of the Presence, which had been removed from before Yahweh, to put hot bread there on the day it was taken away.
translation:
  language: ta
  text: அதனால் ஆசாரியன் அவனுக்குப் பரிசுத்த அப்பத்தைக் கொடுத்தான். ஏனெனில், யாவேயின் திருமுன்னிலையிலிருந்து அகற்றப்பட்ட திருமுன்னிலை அப்பத்தைத் தவிர வேறு அப்பம் அங்கே இருக்கவில்லை. அது அகற்றப்பட்ட நாளில் அங்கே சூடான அப்பத்தை வைப்பதற்காக அந்த அப்பம் அகற்றப்பட்டிருந்தது.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קֹדֶשׁ
  choice: பரிசுத்த அப்பம்
  rationale: எபிரெயச் சொல் தனியே ‘பரிசுத்தமானது’ என்று பொருள்பட்டாலும், இச்சூழலில் அது அர்ப்பணிக்கப்பட்ட அப்பத்தையே குறிக்கிறது; ஆகவே குறிப்பைத் தெளிவாக்க ‘அப்பம்’ சேர்க்கப்பட்டுள்ளது.
- source_word: לֶחֶם הַפָּנִים
  choice: திருமுன்னிலை அப்பம்
  rationale: தேவனுடைய திருமுன்னிலையில் வைக்கப்பட்ட வழிபாட்டு அப்பம் என்ற எபிரெயத் தொடரின் கருத்தை, இன்றைய வாசகருக்குப் புரியும் வகையிலும் சொல்லின் வழிபாட்டுச் சிறப்பைத் தக்கவைத்தும் வழங்குகிறது.
- source_word: הַמּוּסָרִים
  choice: அகற்றப்பட்டிருந்த
  rationale: இது வழிபாட்டு முறையில் யாவேயின் திருமுன்னிலிருந்து அகற்றப்பட்ட அப்பத்தைக் குறிக்கும் செயப்பாட்டு வினையெச்சம்; தமிழ் வாக்கியத்தில் அதன் பண்புரைப்புச் செயல்பாடு பாதுகாக்கப்பட்டுள்ளது.
- source_word: מִלִּפְנֵי יְהוָה
  choice: யாவேயின் திருமுன்னிலிருந்து
  rationale: இடத்தையும் வழிபாட்டுச் சூழலையும் குறிக்கும் ‘முன்னிலிருந்து’ என்ற எபிரெய வழக்கை இயல்பான தமிழில் நெருக்கமாகப் பிரதிபலிக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய மூலத்தில் உள்ள தேவனுடைய தனிப்பெயரை ஒரு பட்டப்பெயரால் மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: לֶחֶם חֹם
  choice: சூடான அப்பம்
  rationale: חֹם என்பதன் நேரடிப் பொருள் ‘சூடான’; அது புதிதாகச் சுடப்பட்ட அப்பம் என்பதைச் சூழல் உணர்த்தினாலும், மூலத்தின் சொற்பொருள் பாதுகாக்கப்பட்டுள்ளது.
- source_word: בְּיוֹם הִלָּקְחוֹ
  choice: அது அகற்றப்பட்ட நாளில்
  rationale: அப்பம் அகற்றப்படும் நாளைக் குறிக்கும் காலத் தொடரின் செயப்பாட்டுப் பொருளைத் தெளிவாக வழங்குகிறது.
theological_decisions:
- issue: יְהוָה என்ற தேவப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூல உரை தேவனுடைய தனிப்பெயரையே பயன்படுத்துவதால், அதை ஒரு பட்டப்பெயராக மாற்றாமல் ஒலிபெயர்ப்பது மூலத்தின் வேறுபாட்டைப் பாதுகாக்கிறது.
- issue: לֶחֶם הַפָּנִים என்ற வழிபாட்டுச் சொல்லின் பொருள்
  choice: திருமுன்னிலை அப்பம்
  alternative: சமுகத்து அப்பம்
  rationale: தேவனுடைய முன்னிலையில் வைக்கப்பட்ட அப்பம் என்ற அடிப்படைப் பொருளை வெளிப்படையாக வைத்துக்கொண்டு, குறிப்பிட்ட சமய மரபின் தனிச்சொல்லை மட்டும் சாராமல் உள்ளது.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகருக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. வழிபாட்டுச் சூழலின் தொழில்நுட்பப் பொருள் தக்கவைக்கப்பட்டு, பழைய மரபுச் சொல் அடிக்குறிப்பில் வழங்கப்பட்டுள்ளது.
