base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/021/014.yaml
  text: So he changed his behavior before their eyes and acted like a madman in their hands[b][a]; he made marks on the doors of the gate and let his saliva run down onto his beard.
translation:
  language: ta
  text: அவன் அவர்கள் கண்முன் தன் நடத்தையை மாற்றிக்கொண்டு, அவர்களுடைய கையில் இருந்தபோது பைத்தியக்காரனைப்போல் நடந்துகொண்டான்[a]. வாசலின் கதவுகளில் குறிகள் இட்டான்[b]; தன் உமிழ்நீரைத் தாடியில் வழியவிட்டான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பைத்தியம் பிடித்தவன்போல் நடித்தான்.” இங்கு வரும் எபிரெய வினைச்சொல் பித்துப்பிடித்ததுபோல் நடந்துகொள்வதைக் குறிக்கிறது; சுற்றியுள்ள கதைச்சூழல் இது வேண்டுமென்றே செய்யப்பட்டதைக் காட்டுகிறது.
    reason: lexical_alternative
  - marker: b
    text: “குறிகள் இட்டான்” என்று மொழிபெயர்க்கப்பட்டுள்ள எபிரெய வினைச்சொல்லின் பொருள் உறுதியற்றது; “கீறினான்” அல்லது “கிறுக்கினான்” என்றும் இதைப் புரிந்துகொள்ளலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְשַׁנּוֹ
  choice: மாற்றிக்கொண்டு
  rationale: שנה என்பதன் பியெல் வடிவம் திட்டமிட்ட மாற்றத்தைக் குறிக்கிறது; தமிழ் தொடரில் இயல்பாக அமைய வினையெச்ச வடிவம் பயன்படுத்தப்பட்டது.
- source_word: טַעְמוֹ
  choice: தன் நடத்தையை
  rationale: இச்சொல் பொதுவாகச் ‘சுவை’, ‘பகுத்தறிவு’ போன்ற பொருள்களைத் தரலாம்; ஆனால் இக்கதையில் பிறருக்குப் புலப்பட்ட தாவீதின் தோற்றப்பாங்கு அல்லது நடத்தை குறிக்கப்படுகிறது. உள்ளார்ந்த மனநிலையைத் தீர்மானிக்காமல் ‘நடத்தை’ அதைத் தெரிவிக்கிறது.
- source_word: בְּעֵינֵיהֶם
  choice: அவர்கள் கண்முன்
  rationale: ‘அவர்களுடைய கண்களில்’ என்ற எபிரெய உருவகத்தின் தெளிவையும், ‘அவர்கள் முன்னிலையில்’ என்ற பொருளையும் இயல்பான தமிழில் காக்கிறது.
- source_word: וַיִּתְהֹלֵל
  choice: பைத்தியக்காரனைப்போல் நடந்துகொண்டான்
  rationale: הלל என்பதன் ஹித்பயேல் வடிவம் இங்கு பித்துப்பிடித்ததுபோன்ற நடத்தையைக் குறிக்கிறது. சூழல் அது வேண்டுமென்றே நடித்த நடத்தை எனக் காட்டினாலும், வினைச்சொல் மட்டுமே அந்த நோக்கத்தை வெளிப்படையாகச் சொல்லாததால் ஒப்புமை வடிவம் பயன்படுத்தப்பட்டது.
- source_word: בְּיָדָם
  choice: அவர்களுடைய கையில் இருந்தபோது
  rationale: ‘அவர்களுடைய கையில்’ என்ற எபிரெய உருவகத்தைப் பாதுகாக்கிறது; அது அவர்களது அதிகாரத்தில் அல்லது பிடியில் இருந்ததையும் உணர்த்தலாம்.
- source_word: ויתו
  choice: குறிகள் இட்டான்
  rationale: இந்த அரிய, உரைநிலையில் கடினமான வினைச்சொல் கீறுதல் அல்லது கிறுக்குதல் எனப் புரிந்துகொள்ளப்படலாம். உறுதியாகக் கூறக்கூடிய அளவை மீறாமல் இருக்கப் பரந்த பொருளுடைய மொழிபெயர்ப்பு தேர்ந்தெடுக்கப்பட்டது.
- source_word: דַּלְתוֹת הַשַּׁעַר
  choice: வாசலின் கதவுகளில்
  rationale: நகரவாசலின் கதவுப் பலகைகளைக் குறிக்கும் சொற்றொடரின் நேரடியான, இயல்பான தமிழ் வடிவம்.
- source_word: וַיּוֹרֶד רִירוֹ
  choice: தன் உமிழ்நீரை ... வழியவிட்டான்
  rationale: ירד என்பதன் ‘கீழே செல்லுதல்’ என்ற இயக்கத்தை, இச்சூழலில் இயல்பான தமிழில் செயப்படுபொருள் அமைப்புடன் தெரிவிக்கிறது.
- source_word: אֶל זְקָנוֹ
  choice: தாடியில்
  rationale: உமிழ்நீர் கீழிறங்கித் தாடியை அடைவதைச் சுருக்கமான, இயல்பான தமிழில் தெரிவிக்கிறது.
