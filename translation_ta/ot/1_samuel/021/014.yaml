  source_fidelity: மூல எபிரெயத்தின் தொடர்ச்சியும் பொருளும் துல்லியமாகப் பாதுகாக்கப்பட்டுள்ளன. טַעְמוֹ என்பதற்கான «தன் நடத்தை», בְּעֵינֵיהֶם என்பதற்கான «அவர்கள் கண்முன்», בְּיָדָם என்பதற்கான «அவர்களுடைய கையில் இருந்தபோது» ஆகியவை உரைநிலைக்கு ஏற்றவை. וַיִּתְהֹלֵל-ஐ «பைத்தியக்காரனைப்போல் நடந்துகொண்டான்» எனக் கூறுவது, வினைச்சொல்லின் வெளிப்படையான நடத்தைப் பொருளைக் காக்கிறது; திட்டமிட்ட நடிப்பு என்ற சூழல்-அனுமானம் அடிக்குறிப்பில் மட்டுமே தரப்பட்டுள்ளது. வினைச்சொல் ויתו-வின் உறுதியற்ற நுணுக்கமும் «குறிகள் இட்டான்» மற்றும் அடிக்குறிப்பு மூலம் எச்சரிக்கையுடன் கையாளப்பட்டுள்ளது.
  naturalness: நடை நவீன நிலையான தமிழில் தெளிவாகவும் கண்ணியமாகவும் உள்ளது. «அவர்கள் கண்முன்», «வாசலின் கதவுகளில் குறிகள் இட்டான்», «தன் உமிழ்நீரைத் தாடியில் வழியவிட்டான்» என்பன இயல்பாக வாசிக்கப்படுகின்றன. «அவர்களுடைய கையில் இருந்தபோது» என்பது எபிரெய உருவகத்தையும் அதிகாரம்/காவல் என்ற சூழல் உணர்வையும் தேவையற்ற விளக்கமின்றிக் காக்கிறது.
  terminology: «பைத்தியக்காரனைப்போல்» இவ்வரலாற்று விவரணையில் மூலத்தின் பித்துநிலை-போன்ற வெளிப்புற நடத்தைப் பொருளை நேரடியாகத் தருகிறது; அது மருத்துவத் தீர்ப்பாக அமையவில்லை. «உமிழ்நீர்», «தாடி», «குறிகள் இட்டான்» ஆகிய சொற்கள் தகுந்த பதிவிலும் பொருளிலும் உள்ளன. அடிக்குறிப்புகளில் எபிரெய வினைச்சொல் குறித்த விளக்கம், மாற்றுவாசிப்புகள், மற்றும் சுட்டிக்குறி இடங்கள் அனைத்தும் பொருத்தமானவை.
