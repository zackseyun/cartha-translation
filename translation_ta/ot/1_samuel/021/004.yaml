translation_notes:
  register: நவீனத் தரத் தமிழில் தெளிவாகவும் கண்ணியமாகவும் மொழிபெயர்க்கப்பட்டுள்ளது. ஆசாரியரை நோக்கிய ஒருமை உரையாதலின் மரியாதையைத் தக்கவைக்க ‘உம்மிடம்’, ‘கொடும்’ பயன்படுத்தப்பட்டுள்ளன; எபிரெய மரபுத்தொடர்களின் நேரடி வடிவங்கள் அடிக்குறிப்புகளில் பாதுகாக்கப்பட்டுள்ளன.
