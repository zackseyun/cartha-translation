reference: 1 Samuel 21:4
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וְ/עַתָּ֗ה מַה יֵּ֧שׁ תַּֽחַת יָדְ/ךָ֛ חֲמִשָּׁה לֶ֖חֶם תְּנָ֣/ה בְ/יָדִ֑/י א֖וֹ הַ/נִּמְצָֽא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/021/004.yaml
  text: Now then[a], what do you have on hand? Give me five loaves of bread[c][b], or whatever is available.
translation:
  language: ta
  text: இப்போது, உம்மிடம் என்ன இருக்கிறது?[a] ஐந்து அப்பங்களை எனக்குக் கொடும்[b]; அல்லது கிடைப்பது எதுவோ அதைக் கொடும்.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லுக்குச் சொல், “உமது கைக்குக் கீழே என்ன இருக்கிறது?” இது உடனடியாகக் கிடைப்பதையோ ஒருவரது வசத்தில் இருப்பதையோ குறிக்கும் எபிரெய மரபுத்தொடர்.
    reason: lexical_alternative
  - marker: b
    text: சொல்லுக்குச் சொல், “என் கையில் கொடும்”; அதாவது, “எனக்குக் கொடும்.”
    reason: lexical_alternative
  - marker: c
    text: அல்லது, “காணப்படுவது எதுவோ அது.”
    reason: alternative_reading
lexical_decisions:
- source_word: וְעַתָּה
  choice: இப்போது
  rationale: காலத்தையும் முந்தைய உரையாடலிலிருந்து உடனடியான வேண்டுகோளுக்கான மாற்றத்தையும் இயல்பாகக் காட்டுகிறது.
- source_word: מַה יֵּשׁ תַּחַת יָדְךָ
  choice: உம்மிடம் என்ன இருக்கிறது?
  rationale: ‘உமது கைக்குக் கீழே என்ன இருக்கிறது?’ என்ற எபிரெய மரபுத்தொடர், ஒருவரிடம் உடனடியாக இருப்பதையோ கிடைப்பதையோ குறிக்கிறது. தமிழில் ‘உம்மிடம்’ என்பது அந்தப் பொருளைத் தெளிவாக வழங்குகிறது.
- source_word: חֲמִשָּׁה לֶחֶם
  choice: ஐந்து அப்பங்களை
  rationale: எபிரெய மொழியில் ‘அப்பம்’ தொகுப்புப்பெயராக வந்தாலும், எண்ணிக்கையோடு வரும் இந்த இடத்தில் தமிழில் பன்மை இயல்பானது.
- source_word: תְּנָה בְיָדִי
  choice: எனக்குக் கொடும்
  rationale: சொல்லுக்குச் சொல் ‘என் கையில் கொடும்’ என இருந்தாலும், பெறுபவரைக் குறிக்கும் இயல்பான தமிழ் வடிவம் ‘எனக்குக் கொடும்’ ஆகும். ஒருமை மரியாதை ஏவல் வடிவம் ஆசாரியரிடம் பேசும் சூழலுக்கு ஏற்றது.
- source_word: אוֹ הַנִּמְצָא
  choice: அல்லது கிடைப்பது எதுவோ அதைக் கொடும்
  rationale: מצא வினையின் செயப்பாட்டு எச்சம் ‘காணப்படுவது/கிடைப்பது’ என்று பொருள்படும். வாக்கியத்தில் மறைந்திருக்கும் ‘கொடும்’ என்பதைத் தமிழில் மீண்டும் கூறுவது கருத்தை இயல்பாகவும் தெளிவாகவும் நிறைவு செய்கிறது.
