translation_notes:
  register: மொழிநடை நவீனச் செந்தமிழுக்கு அண்மையான, பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளக்கூடிய கண்ணியமான உரைநடை. அகிமெலேக்கிடம் பேசும்போது மரியாதைப் பன்மையான ‘உம்மிடம்’ பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் தெளிவின்மைகள் அடிக்குறிப்புகளில் பாதுகாக்கப்பட்டுள்ளன.
