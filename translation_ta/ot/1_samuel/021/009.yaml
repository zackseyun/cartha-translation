base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/021/009.yaml
  text: And David said to Ahimelech[a], “Is there not here under your hand a spear or a sword? For I did not take my sword or my weapons in my hand[c][b], because the king’s matter was urgent.”
translation:
  language: ta
  text: தாவீது அகிமெலேக்கிடம், “உம்மிடம்[a] இங்கே ஈட்டியோ வாளோ இல்லையா? அரசனுடைய காரியம்[c] அவசரமாக இருந்ததால், என் வாளையும் என் ஆயுதங்களையும்[b] நான் கையில் எடுத்துக்கொள்ளவில்லை” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “உமது கைக்குக் கீழ்”; இது “உமது வசத்தில்” அல்லது “உமது உடைமையில்” என்று பொருள்படும் மரபுத்தொடர்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “என் வாளையும் என் கருவிகளையும்/உபகரணங்களையும்.” இங்குள்ள எபிரெயச் சொல் பொதுவாகக் கருவிகள் அல்லது உபகரணங்களைக் குறிக்கலாம்; இச்சூழலில் அது பெரும்பாலும் ஆயுதங்களைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, “அரசனுடைய விவகாரம்” அல்லது “அரசனுடைய கட்டளை.” எபிரெயச் சொல் ‘சொல், காரியம், விவகாரம்’ எனப் பரந்த பொருளுடையது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר דָּוִד לַאֲחִימֶלֶךְ
  choice: தாவீது அகிமெலேக்கிடம் ... என்றான்
  rationale: எபிரெயக் கதைநடையின் வழக்கமான நேர்கூற்றுத் தொடக்கத்தை இயல்பான நவீனத் தமிழ்ச் சொல்வரிசையில் தருகிறது.
- source_word: וְאִין יֶשׁ פֹּה
  choice: இங்கே ... இல்லையா?
  rationale: இருப்பின்மையை வினவும் எபிரெய மரபுத்தொடரைத் தெளிவான இயல்பான தமிழில் வழங்குகிறது.
- source_word: תַּחַת יָדְךָ
  choice: உம்மிடம்
  rationale: சொல்லுக்கு சொல் ‘உமது கைக்குக் கீழ்’ என்றாலும், இங்கு பொருள் ‘உமது வசத்தில்/உடைமையில்’ என்பதாகும்; ‘உம்மிடம்’ இரண்டையும் இயல்பாக உள்ளடக்குகிறது.
- source_word: חֲנִית אוֹ חָרֶב
  choice: ஈட்டியோ வாளோ
  rationale: இரு ஆயுதப் பெயர்களையும் ஒருமை வடிவிலும் மாற்றுத் தேர்வைக் காட்டும் வினா அமைப்பிலும் நேரடியாக வழங்குகிறது.
- source_word: גַּם חַרְבִּי וְגַם כֵּלַי
  choice: என் வாளையோ என் ஆயுதங்களையோ
  rationale: மறுப்புச் சூழலில் மீண்டும் வரும் גַּם ... גַּם அமைப்பைத் தமிழில் இயல்பான ‘...யோ ...யோ’ வடிவில் தருகிறது; כְּלִי என்ற பரந்த சொல்லுக்கு இச்சூழலில் ‘ஆயுதங்கள்’ பொருத்தமானது.
- source_word: לֹא לָקַחְתִּי בְיָדִי
  choice: நான் கையில் எடுத்துவரவில்லை
  rationale: ‘கையில் எடுக்கவில்லை’ என்ற மூலத்தின் உருவகத்தைத் தக்கவைத்தபடியே, உடன் கொண்டுவராததைக் குறிக்கும் இயல்பான தமிழை வழங்குகிறது.
- source_word: דְבַר הַמֶּלֶךְ
  choice: அரசனுடைய காரியம்
  rationale: דָּבָר என்பதன் ‘சொல், காரியம், விவகாரம், கட்டளை’ என்ற பரந்த பொருளை ஒரு குறிப்பிட்ட விளக்கமாகச் சுருக்காமல் ‘காரியம்’ தக்கவைக்கிறது.
- source_word: נָחוּץ
  choice: அவசரமானதாக இருந்ததால்
  rationale: அழுத்தமான, உடனடிக் கவனம் தேவைப்படும் நிலையை நவீனத் தமிழில் தெளிவாகக் குறிக்கிறது.
