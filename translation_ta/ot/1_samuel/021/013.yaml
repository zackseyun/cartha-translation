  register: நவீனத் தரத் தமிழில், எளிதில் புரியும் அதேவேளையில் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. எபிரெய மரபுத்தொடரின் உருவகமும் பொருளும் முதன்மை உரை மற்றும் அடிக்குறிப்பு மூலம் பாதுகாக்கப்பட்டுள்ளன.
