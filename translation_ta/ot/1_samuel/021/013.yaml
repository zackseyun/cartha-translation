id: 1SA.21.13
reference: 1 Samuel 21:13
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יָּ֧שֶׂם דָּוִ֛ד אֶת הַ/דְּבָרִ֥ים הָ/אֵ֖לֶּה בִּ/לְבָב֑/וֹ וַ/יִּרָ֣א מְאֹ֔ד מִ/פְּנֵ֖י אָכִ֥ישׁ מֶֽלֶךְ גַּֽת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/021/013.yaml
  text: David took these words to heart[a], and he was very much afraid of Achish king of Gath.
translation:
  language: ta
  text: தாவீது இந்த வார்த்தைகளை மனதில் கொண்டார்[a]; காத்தின் அரசன் ஆகீசுக்கு மிகவும் பயந்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தாவீது இந்தக் காரியங்களைத் தன் இதயத்தில் வைத்தார்.” இந்த எபிரெய மரபுத்தொடர், அவர் கேட்ட செய்தியைத் தீவிரமாக எடுத்துக்கொண்டு உள்ளத்தில் சிந்தித்தார் என்பதைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֶׂם ... בִּלְבָבוֹ
  choice: மனதில் கொண்டார்
  rationale: ‘இதயத்தில் வைத்தார்’ என்ற எபிரெய உருவகத்தை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது; கேட்ட வார்த்தைகளைத் தீவிரமாக எடுத்துக்கொண்டு உள்ளத்தில் சிந்தித்தார் என்ற பொருளையும் தக்கவைக்கிறது.
- source_word: אֶת־הַדְּבָרִים הָאֵלֶּה
  choice: இந்த வார்த்தைகளை
  rationale: דְּבָרִים என்பதற்கு ‘வார்த்தைகள்,’ ‘காரியங்கள்’ ஆகிய பொருள்கள் உண்டு. முந்தைய வசனத்தில் பணியாளர்கள் சொன்னவற்றையே இங்கு சுட்டுவதால் ‘இந்த வார்த்தைகளை’ என்பது சூழலுக்கு ஏற்றது.
- source_word: וַיִּרָא מְאֹד
  choice: மிகவும் பயந்தார்
  rationale: מְאֹד பயத்தின் தீவிரத்தை வலுப்படுத்துகிறது; ‘மிகவும் பயந்தார்’ என்பது தெளிவான, இயல்பான தமிழ்.
- source_word: מִפְּנֵי
  choice: ஆகீசுக்கு
  rationale: பயத்தைக் குறிக்கும் தமிழ்ச் சொல்லுடன் காரணமாக அல்லது அச்சத்துக்குரியவராக உள்ள நபரை நான்காம் வேற்றுமையில் குறிப்பிடுவது இயல்பானது.
- source_word: אָכִישׁ
  choice: ஆகீசு
  rationale: எபிரெய தனிப்பெயரின் ஒலியைத் தமிழில் இயல்பாக எழுத்துப்பெயர்த்துள்ளது.
- source_word: מֶלֶךְ גַּת
  choice: காத்தின் அரசன்
  rationale: எபிரெயச் சார்புநிலைத் தொடரைத் தெளிவான தமிழில் அளிக்கிறது; ‘காத்’ நகரத்தின் அரசன் என்ற உறவைத் தக்கவைக்கிறது.
