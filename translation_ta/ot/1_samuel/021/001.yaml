  text: וַ/יָּ֖קָם וַ/יֵּלַ֑ךְ וִ/יהוֹנָתָ֖ן בָּ֥א הָ/עִֽיר׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/021/001.yaml
  text: Then he arose and went away[a], and Jonathan entered the city.
translation:
  language: ta
  text: அவன் எழுந்து புறப்பட்டுச் சென்றான்; யோனத்தான் நகரத்திற்குள் சென்றான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “நகரத்திற்குள் வந்தான்.”
    reason: בָּא என்ற வினைச்சொல்லின் மூல நோக்குநிலையைப் பாதுகாக்கும் சொற்பொருள் மாற்று.
lexical_decisions:
- source_word: וַיָּקָם
  choice: அவன் எழுந்து
  rationale: קום என்பதன் கால் தொடர்-இறந்தகால வடிவம், கதை நிகழ்வின் அடுத்த செயலைக் குறிக்கிறது. தமிழில் இயல்பான தொடருக்காக வெளிப்படையாக உள்ள ஆண்பால் ஒருமை எழுவாயுடன் ‘எழுந்து’ என மொழிபெயர்க்கப்பட்டது.
- source_word: וַיֵּלַךְ
  choice: புறப்பட்டுச் சென்றான்
  rationale: הלך என்பது ‘செல்/நட’ எனப் பொருள்படும். முந்தைய பிரிவுக்குப் பின் அந்த இடத்தைவிட்டுச் செல்வதை இயல்பான தமிழில் தெரிவிக்க ‘புறப்பட்டுச் சென்றான்’ என வழங்கப்பட்டது; ‘புறப்பட்டான்’ மட்டும் என்பதைக் காட்டிலும் செல்லும் செயலை இது தெளிவாக வைத்திருக்கிறது.
- source_word: וִיהוֹנָתָן
  choice: யோனத்தான்
  rationale: எபிரெயப் பெயரான יְהוֹנָתָן தமிழில் வழக்கமான வேதாகம ஒலிபெயர்ப்பு வடிவில் வழங்கப்பட்டது.
- source_word: בָּא
  choice: நகரத்திற்குள் சென்றான்
  rationale: בוא என்பதற்கு ‘வரு,’ ‘செல்,’ அல்லது ‘உட்புகு’ என்ற சூழல்சார் பொருள்கள் உண்டு. நகரம் இலக்காக வருவதால், தமிழில் இயல்பாக ‘நகரத்திற்குள் சென்றான்’ என வழங்கப்பட்டது; மூலத்தின் ‘வந்தான்’ என்ற நோக்குநிலை அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: הָעִיר
  choice: நகரம்
  rationale: עִיר என்பது நகரம் அல்லது ஊரைக் குறிக்கலாம். இங்கு திட்டவட்ட விகுதியுடன் இருப்பதால் ‘நகரம்’ என்பதே நேரடியான, பொதுவான தமிழ் இணை.
