translation_notes:
  register: நவீனத் தரமான, எளிதில் புரியும், கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. முதல் எழுவாயின் பெயர் மூலத்தில் குறிப்பிடப்படாததால் ‘அவன்’ என்று மட்டும் வைக்கப்பட்டு, சூழலிலிருந்து பெயர் சேர்க்கப்படவில்லை. இரண்டு செயல்களையும் தெளிவாகப் பிரிக்க அரைப்புள்ளி பயன்படுத்தப்பட்டுள்ளது.
