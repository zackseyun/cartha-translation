- from: அகீஸ், “எனக்குப் பைத்தியக்காரர்கள் குறைவா? இவனை எனக்கு முன்பாகப் பைத்தியக்காரனைப்போல் நடந்துகொள்ளும்படி[a] அழைத்து வந்தீர்களே! இவன் என் வீட்டுக்குள் வர வேண்டுமா?” என்றான்.
  to: “எனக்குப் பைத்தியக்காரர்கள் குறைவா? இவனை எனக்கு முன்பாகப் பைத்தியக்காரனைப்போல் நடந்துகொள்ள அழைத்து வந்தீர்களா? இவன் என் வீட்டுக்குள் வர வேண்டுமா?”
