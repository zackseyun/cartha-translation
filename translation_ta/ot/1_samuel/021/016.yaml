translation_notes:
  register: நவீனத் தரத்தமிழில், அரசனின் கோபமும் ஏளனமும் தெளிவாகக் கேட்கும் வகையில் நேரடியான பேச்சுநடை பயன்படுத்தப்பட்டுள்ளது. ‘பைத்தியக்காரர்’ என்பது மூலத்தின் கடுமையான, இழிவான சொல்லாட்சியை மென்மைப்படுத்தாமல் தருகிறது. வசனம் தனியாக மேற்கோள் கொள்ளப்படும்போதும் பேச்சாளர் தெளிவாக இருக்க ‘அகீஸ்’ சேர்க்கப்பட்டுள்ளது.
