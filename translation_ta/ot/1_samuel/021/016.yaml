source:
  edition: WLC
  text: חֲסַ֤ר מְשֻׁגָּעִים֙ אָ֔נִי כִּי הֲבֵאתֶ֣ם אֶת זֶ֔ה לְ/הִשְׁתַּגֵּ֖עַ עָלָ֑/י הֲ/זֶ֖ה יָב֥וֹא אֶל בֵּיתִֽ/י־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/021/016.yaml
  text: Do I lack madmen[a], that you have brought this one to act like a madman before me? Shall this one come into my house?
translation:
  language: ta
  text: “எனக்குப் பைத்தியக்காரர்கள் குறைவா? இவனை எனக்கு முன்பாகப் பைத்தியக்காரனைப்போல் நடந்துகொள்ள அழைத்து வந்தீர்களா? இவன் என் வீட்டுக்குள் வர வேண்டுமா?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חֲסַר מְשֻׁגָּעִים אֲנִי
  choice: எனக்குப் பைத்தியக்காரர்கள் குறைவா?
  rationale: எபிரெய மொழியின் கூர்மையான ஏளனக் கேள்வியை இயல்பான நவீனத் தமிழில் காக்கிறது; ‘குறைவா’ என்பது ‘எனக்குப் பற்றாக்குறையா?’ என்ற பொருளைச் சுருக்கமாக வெளிப்படுத்துகிறது.
- source_word: הֲבֵאתֶם אֶת זֶה
  choice: இவனை ... அழைத்து வந்தீர்களே!
  rationale: אֶת זֶה என்பதன் இழிவுபடுத்தும் சுட்டுதலை ‘இவனை’ காக்கிறது. வினாவாக இருந்தாலும், குற்றஞ்சாட்டும் வியப்புத் தொனியைத் தமிழின் ‘வந்தீர்களே!’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: לְהִשְׁתַּגֵּעַ
  choice: பைத்தியக்காரனைப்போல் நடந்துகொள்ளும்படி
  rationale: Hitpael வடிவம் பைத்தியமாக நடந்துகொள்வதைச் சுட்டுகிறது; சூழலில் தாவீது பைத்தியம் பிடித்ததுபோல் நடித்தாலும், வினைச்சொல் தனியாகவே திட்டமிட்ட நடிப்பைத் தெளிவாகக் கூறவில்லை.
- source_word: עָלָי
  choice: எனக்கு முன்பாக
  rationale: சொல்லுக்குச் சொல் ‘என்மேல்’ என்றாலும், இச்சூழலில் அரசனின் முன்னிலையில் அல்லது அவனை நோக்கி நடந்துகொள்வதைக் குறிக்கிறது; ‘எனக்கு முன்பாக’ இயல்பான சூழற்பொருளைத் தருகிறது.
- source_word: הֲזֶה יָבוֹא אֶל־בֵּיתִי
  choice: இவன் என் வீட்டுக்குள் வர வேண்டுமா?
  rationale: மீண்டும் வரும் இழிவான சுட்டுப்பெயரை ‘இவன்’ காக்கிறது; אֶל உடன் வரும் இயக்கத்தை ‘வீட்டுக்குள்’ தெளிவாக வெளிப்படுத்துகிறது.
