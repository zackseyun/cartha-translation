base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/021/003.yaml
  text: David said to Ahimelech the priest[a], “The king has charged me with a matter and said to me[b], ‘Let no man know anything about the matter for which I am sending you and with which I have charged you.’ And I have directed the young men to a certain place.”
translation:
  language: ta
  text: தாவீது ஆசாரியரான அகிமெலேக்கிடம், “அரசர் ஒரு காரியத்தைக் குறித்து எனக்குக் கட்டளையிட்டு, ‘நான் உன்னை அனுப்புகிற காரியத்தையும் உனக்குக் கட்டளையிட்ட காரியத்தையும் பற்றி யாரும்[a] எதையும் அறியக் கூடாது’ என்று என்னிடம் சொன்னார். இளைஞர்களுக்காக ஒரு குறிப்பிட்ட இடத்தை ஏற்பாடு செய்துள்ளேன்[b]” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொல்லுக்குச் சொல், “எந்த மனிதனும் எதையும் அறிய வேண்டாம்.” இங்கு இது பொதுவாக, “யாரும் எதையும் அறியக் கூடாது” என்று பொருள்படுகிறது.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில் சொல்லுக்குச் சொல், “இன்ன-அன்ன இடம்”; இது குறிப்பிடப்படாத அல்லது வெளிப்படுத்தப்படாத ஓர் இடத்தைக் குறிக்கும் மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: צִוַּנִי דָבָר
  choice: ஒரு காரியத்தைச் செய்யும்படி எனக்குக் கட்டளையிட்டு
  rationale: צוה என்பதன் ‘கட்டளையிடு’ என்ற வலிமையையும் דָבָר குறிக்கும் காரியம் அல்லது பணி என்ற பொருளையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: אִישׁ אַל יֵדַע מְאוּמָה
  choice: யாரும் எதையும் அறியக் கூடாது
  rationale: אִישׁ என்பது சொல்லுக்குச் சொல் ‘ஒரு ஆண்/மனிதன்’ என்றாலும், இத்தடை பொதுவாக எவரையும் குறிக்கிறது; ‘யாரும்’ என்பது நவீனத் தமிழில் இயல்பாகவும் பொருள்துல்லியமாகவும் உள்ளது.
- source_word: הַדָּבָר
  choice: காரியம்
  rationale: இங்கு דָבָר ஒரு சொல் அல்லது பொருளை அல்ல, அரசன் கொடுத்ததாகத் தாவீது கூறும் பணி அல்லது விவகாரத்தைக் குறிக்கிறது.
- source_word: אֲשֶׁר אָנֹכִי שֹׁלֵחֲךָ
  choice: நான் உன்னை அனுப்பியுள்ள காரியம்
  rationale: காரியத்துக்கும் அனுப்புதலுக்கும் உள்ள தொடர்பைத் தமிழில் தெளிவாகக் காட்டுகிறது; மூலத்தின் உறவுச்சொற்றொடர் இயல்பான தமிழுக்காகச் சற்றே மறுவடிவமைக்கப்பட்டுள்ளது.
- source_word: וַאֲשֶׁר צִוִּיתִךָ
  choice: உனக்குக் கட்டளையிட்டது
  rationale: முன்னர் வந்த צוה என்பதோடு ஒரே சொல்லாட்சியைப் பேணி, அரச கட்டளையின் வலிமையைத் தக்கவைக்கிறது.
- source_word: וְאֶת־הַנְּעָרִים
  choice: இளைஞர்கள்
  rationale: נְעָרִים என்பதன் நேரடியான பொருளைத் தருகிறது; அவர்கள் ஊழியர்களா, உடனிருந்தவர்களா என்பதைத் தேவையின்றி முடிவுசெய்யவில்லை.
- source_word: יוֹדַעְתִּי
  choice: அவர்களிடம் தெரிவித்திருக்கிறேன்
  rationale: ידע என்பதன் ஹிஃபில் வடிவத்தின் அடிப்படைப் பொருளான ‘தெரியப்படுத்து’ என்பதைப் பேணுகிறது; இடத்திற்குச் செல்லும் நடைமுறை அறிவுறுத்தல் சூழலால் தெளிவாகிறது.
- source_word: אֶל־מְקוֹם פְּלֹנִי אַלְמוֹנִי
  choice: ஒரு குறிப்பிட்ட இடத்திற்கு
  rationale: இந்த இணைச்சொல் குறிப்பிடப்படாத அல்லது வெளிப்படுத்தப்படாத ஓர் இடத்தைக் குறிக்கும் மரபுத்தொடர்; முதன்மை உரையில் இயல்பான தமிழும் அடிக்குறிப்பில் நேரடியான வடிவமும் தரப்படுகின்றன.
theological_decisions:
- issue: தாவீதின் கூற்றின் வரலாற்று அல்லது ஒழுக்க மதிப்பீடு
  choice: இதைத் தாவீது அகிமெலேக்கிடம் கூறிய கூற்றாக மட்டும் மொழிபெயர்த்தல்
  alternative: அரசன் உண்மையில் இவ்வாறு கட்டளையிட்டதாக உரையிலேயே உறுதிப்படுத்துதல் அல்லது தாவீது பொய் சொன்னதாக விளக்குதல்
  rationale: எபிரெய உரை தாவீதின் நேரடி உரையைப் பதிவு செய்கிறது; இந்த வசனம் தானாகவே அவரது கூற்றின் உண்மைத்தன்மையை விளக்கவில்லை. மொழிபெயர்ப்பு அந்தத் திறந்த நிலையைப் பேணுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், நேரடி உரையின் மரியாதையும் பதற்றமும் பேணப்பட்டுள்ளன. ‘ஆசாரியன்’, ‘அரசர்’, ‘கட்டளையிடு’ ஆகிய சொற்கள் பொதுவாகப் புரியும் கண்ணியமான நடையில் பயன்படுத்தப்பட்டுள்ளன; தேவையற்ற சமயப்பிரிவு சார்ந்த சொற்கள் தவிர்க்கப்பட்டுள்ளன.
