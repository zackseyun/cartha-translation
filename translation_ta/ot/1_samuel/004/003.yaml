  text: וַ/יָּבֹ֣א הָ/עָם֮ אֶל הַֽ/מַּחֲנֶה֒ וַ/יֹּֽאמְרוּ֙ זִקְנֵ֣י יִשְׂרָאֵ֔ל לָ֣/מָּה נְגָפָ֧/נוּ יְהוָ֛ה הַ/יּ֖וֹם לִ/פְנֵ֣י פְלִשְׁתִּ֑ים נִקְחָ֧ה אֵלֵ֣י/נוּ מִ/שִּׁלֹ֗ה אֶת אֲרוֹן֙ בְּרִ֣ית יְהוָ֔ה וְ/יָבֹ֣א בְ/קִרְבֵּ֔/נוּ וְ/יֹשִׁעֵ֖/נוּ מִ/כַּ֥ף אֹיְבֵֽי/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/004/003.yaml
  text: When the people came into the camp[a], the elders of Israel said, “Why has Yahweh struck us down today before the Philistines? Let us bring here from Shiloh the ark of the covenant of Yahweh, so that it may come into our midst and save us from the hand of our enemies.”
translation:
  language: ta
  text: மக்கள் முகாமுக்கு வந்தபோது, இஸ்ரவேலின் மூப்பர்கள், “யாவே இன்று பெலிஸ்தியரின் முன்பாக நம்மை வீழ்த்தினார் ஏன்? சீலோவிலிருந்து யாவேயின் உடன்படிக்கைப் பெட்டியை இங்கே கொண்டுவருவோம்; அது[a] நம் நடுவில் வந்து, நம் எதிரிகளின் கையிலிருந்து நம்மைக் காப்பாற்றட்டும்” என்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர் நம் நடுவில் வந்து, நம்மைக் காப்பாற்றட்டும்.” ஒருமை வினைச்சொற்கள், உடன்படிக்கைப் பெட்டியுடன் தொடர்புடைய யாவேயின் பிரசன்னத்தைக் குறிப்பதாக இவ்வாறு புரிந்துகொள்ளலாம்.
    reason: 'மாற்று வாசிப்பு: ஒருமை வினைச்சொற்கள் உடன்படிக்கைப் பெட்டியையோ, அதனுடன் தொடர்புடைய யாவேயின் பிரசன்னத்தையோ குறிப்பதாகப் புரிந்துகொள்ளும் வாய்ப்பைப் பாதுகாக்கிறது.'
lexical_decisions:
- source_word: הָעָם
  choice: மக்கள்
  rationale: அடிப்படைப் பொருளான ‘மக்கள்’ என்பதைக் காக்கிறது; சூழல் இவர்களை இஸ்ரவேல் படையினராக அடையாளப்படுத்துவதால், மொழிபெயர்ப்பிலேயே ‘படைவீரர்கள்’ என்று மிகுதியாகக் குறிப்பாக்க வேண்டியதில்லை.
- source_word: הַמַּחֲנֶה
  choice: முகாம்
  rationale: போர்ச் சூழலில் இயல்பாகவும் தெளிவாகவும் பயன்படும் நவீனத் தமிழ்ச் சொல்.
- source_word: זִקְנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் மூப்பர்கள்
  rationale: மக்களின் அங்கீகரிக்கப்பட்ட தலைவர்களைக் குறிக்கும் எபிரேயச் சொல்லின் வழக்கமான, மரியாதையான மொழிபெயர்ப்பு.
- source_word: נְגָפָנוּ
  choice: நம்மை வீழ்த்தியது
  rationale: போரில் கடுமையாகத் தாக்கப்பட்டுத் தோற்கடிக்கப்படுவதை வெளிப்படுத்துகிறது; வெறும் ‘தோற்கடித்தது’ என்பதைவிட மூலவினையின் தாக்கத்தைத் தக்கவைக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைப்பட்டத்தால் மாற்றாமல், எபிரேய நான்கெழுத்துத் திருப்பெயரைத் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: לִפְנֵי פְלִשְׁתִּים
  choice: பெலிஸ்தியருக்கு முன்பாக
  rationale: போரில் பெலிஸ்தியரை எதிர்கொண்ட நிலையில் ஏற்பட்ட தோல்வியைக் குறிக்கும் மூலத்தின் ‘முன்பாக’ என்ற உருவகத்தைப் பாதுகாக்கிறது.
- source_word: נִקְחָה אֵלֵינוּ
  choice: இங்கே கொண்டுவருவோம்
  rationale: முகாமிலுள்ள தங்களிடம் பெட்டியைக் கொண்டுவரும் முன்மொழிவை இயல்பான தமிழில் தருகிறது.
- source_word: מִשִּׁלֹה
  choice: சீலோவிலிருந்து
  rationale: இடப்பெயரைத் தமிழில் ஒலிபெயர்த்து, புறப்படும் இடத்தைக் குறிக்கும் உருபைத் தெளிவாகத் தருகிறது.
- source_word: אֲרוֹן בְּרִית יְהוָה
  choice: யாவேயின் உடன்படிக்கைப் பெட்டி
  rationale: אֲרוֹן என்பதற்கு இயல்பான ‘பெட்டி’ என்பதையும், அது யாவேயின் உடன்படிக்கையோடு தொடர்புடைய புனிதப் பெட்டி என்பதையும் சுருக்கமாகப் பாதுகாக்கிறது.
- source_word: וְיָבֹא בְקִרְבֵּנוּ
  choice: அது நம் நடுவில் வந்து
  rationale: உடன்படிக்கைப் பெட்டியே உடனடியான இலக்கண எழுவாய் என்பதைக் காட்டுகிறது; בְּקִרְבֵּנוּ என்பதன் இடவியல் நுணுக்கத்தை ‘நம் நடுவில்’ தக்கவைக்கிறது.
- source_word: וְיֹשִׁעֵנוּ
  choice: நம்மைக் காப்பாற்றட்டும்
  rationale: ישׁע என்பதன் மீட்பு அல்லது விடுதலைப் பொருளைத் தருகிறது; முன்மொழிவைத் தொடரும் விருப்பநிலையை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: מִכַּף אֹיְבֵינוּ
  choice: நம் எதிரிகளின் கையிலிருந்து
  rationale: அதிகாரம் அல்லது பிடியைக் குறிக்கும் எபிரேய ‘கை’ உருவகத்தை வாசிக்கத்தக்க தமிழில் அப்படியே பாதுகாக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற திருப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூலத்தில் தனிப்பட்ட திருப்பெயர் நேரடியாக இருப்பதால், அதை ஒரு பட்டத்தால் மாற்றாமல் ஒலிபெயர்த்துள்ளது.
- issue: וְיָבֹא ... וְיֹשִׁעֵנוּ என்பவற்றின் எழுவாய்
  choice: உடன்படிக்கைப் பெட்டியைக் குறிக்கும் ‘அது’
  alternative: யாவேயைக் குறிக்கும் ‘அவர்’
  rationale: உடனடியான இலக்கண முன்னிலைச் சொல் உடன்படிக்கைப் பெட்டி என்பதால் முதன்மை உரையில் ‘அது’ எனத் தரப்பட்டுள்ளது. இருப்பினும், பெட்டியுடன் தொடர்புடைய யாவேயின் பிரசன்னத்தை மூப்பர்கள் மனதில் கொண்டிருக்கலாம் என்பதால் தனிப்பட்ட இறை எழுவாய் வாசிப்பும் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; எளிதில் புரியக்கூடியதாயினும் வேதாகம உரைக்கு ஏற்ற கண்ணியமான நடை. போர்ச் சூழலையும் எபிரேய உருவகங்களையும் பாதுகாத்து, தேவையற்ற பழமையான சொற்கள் தவிர்க்கப்பட்டுள்ளன.
