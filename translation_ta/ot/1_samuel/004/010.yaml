translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான வரலாற்று நடையில் மொழிபெயர்க்கப்பட்டது. எபிரெய வாக்கியங்களின் தொடர்ச்சியான கதை ஓட்டம் காக்கப்பட்டுள்ளது. ‘கூடாரம்’ மற்றும் ‘வீழ்ந்தார்கள்’ போன்ற மூலத்தின் உறுதியான போரியல் சொற்படிமங்கள் தக்கவைக்கப்பட்டுள்ளன; உண்மையான சொற்பொருள் மாற்றுகள் அடிக்குறிப்புகளில் தரப்பட்டுள்ளன.
