base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/004/010.yaml
  text: So the Philistines fought[a], and Israel was defeated, and each man fled to his tent. The slaughter was very great[b], and thirty thousand foot soldiers from Israel fell.
translation:
  language: ta
  text: அப்பொழுது பெலிஸ்தியர்கள் போரிட்டார்கள்; இஸ்ரவேலர் தோற்கடிக்கப்பட்டார்கள். ஒவ்வொருவரும் தம் கூடாரத்துக்கு ஓடிப்போனார்கள்.[a] மிகப் பெரிய படுகொலை ஏற்பட்டது.[b] இஸ்ரவேலரில் முப்பதாயிரம் காலாட்படை வீரர்கள் வீழ்ந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஒவ்வொருவரும் தம் வீட்டுக்கு ஓடிப்போனார்கள்.” எபிரெய மொழியில் நேரடியாக “தம் கூடாரத்துக்கு” என்று உள்ளது; இது ஒருவரின் வசிப்பிடத்தைக் குறிக்கும் மரபுத்தொடராகவும் பயன்படலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “தோல்வி மிகவும் கடுமையானதாக இருந்தது.” எபிரெய மொழியில் நேரடியாக “அடி/தாக்குதல் மிகவும் பெரியதாக இருந்தது” என்று உள்ளது; போர்ச் சூழலில் அது படுகொலையைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּלָּחֲמוּ פְלִשְׁתִּים
  choice: பெலிஸ்தியர்கள் போரிட்டார்கள்
  rationale: לחם என்பதன் இக்கதை வடிவம் நேரடியான இராணுவப் போரைக் குறிக்கிறது; இயல்பான நவீனத் தமிழில் ‘போரிட்டார்கள்’ சுருக்கமாகவும் தெளிவாகவும் உள்ளது.
- source_word: וַיִּנָּגֶף יִשְׂרָאֵל
  choice: இஸ்ரவேலர் தோற்கடிக்கப்பட்டார்கள்
  rationale: போர்ச் சூழலில் נָגַף எதிரியின் முன் தோல்வியுறுவதைக் குறிக்கிறது. அடுத்துவரும் ஓட்டத்தை முன்கூட்டியே மிகைப்படுத்தாமல் இராணுவ முடிவைத் துல்லியமாகச் சொல்கிறது.
- source_word: וַיָּנֻסוּ אִישׁ לְאֹהָלָיו
  choice: ஒவ்வொருவரும் தங்கள் கூடாரத்துக்கு ஓடிப்போனார்கள்
  rationale: אִישׁ இங்கு பகிர்வுப் பொருளில் ‘ஒவ்வொருவரும்’ என வருகிறது; אֹהֶל என்பதன் நேரடிப் பொருளான ‘கூடாரம்’ எபிரெய உருவகத்தையும் முகாம் சார்ந்த சூழலையும் காக்கிறது.
- source_word: וַתְּהִי הַמַּכָּה גְּדוֹלָה מְאֹד
  choice: படுகொலை மிகவும் பெரிதாயிருந்தது
  rationale: מַכָּה நேரடியாக ‘அடி/தாக்குதல்’ என்றாலும், போர்ச் சூழலும் உடன்வரும் உயிரிழப்பு எண்ணிக்கையும் இங்கு கொடிய படுகொலையைக் குறிக்கின்றன.
- source_word: וַיִּפֹּל מִיִּשְׂרָאֵל
  choice: இஸ்ரவேலரில் ... வீழ்ந்தார்கள்
  rationale: போரில் மனிதர்களைக் குறித்து נפל பயன்படுத்தப்படும்போது உயிரிழந்தார்கள் என்ற பொருளுடைய ‘வீழ்ந்தார்கள்’ என்பது மூலத்தின் போரியல் நடையைப் பாதுகாக்கிறது.
- source_word: שְׁלֹשִׁים אֶלֶף רַגְלִי
  choice: முப்பதாயிரம் காலாட்படை வீரர்கள்
  rationale: எண்ணிக்கையை நேரடியாகத் தருவதோடு, רַגְלִי குதிரை அல்லது தேர்ப்படைக்கு மாறாகக் கால்நடையாகப் போரிடும் வீரர்களைக் குறிக்கிறது என்பதைத் தெளிவாக்குகிறது.
