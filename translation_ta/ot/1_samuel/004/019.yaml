base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/004/019.yaml
  text: His daughter-in-law[a], the wife of Phinehas, was pregnant, about to give birth. When she heard the report that the ark of God had been taken, and that her father-in-law and her husband were dead, she bowed down and gave birth[c][b], because her labor pains came upon her.
translation:
  language: ta
  text: அவருடைய மருமகளான பினெகாஸின் மனைவி, பிள்ளை பெறும் காலம் நெருங்கிய கர்ப்பிணியாக இருந்தாள். தேவனுடைய பேழை கைப்பற்றப்பட்டதாகவும்[a], தன் மாமனாரும் கணவனும் இறந்துவிட்டதாகவும்[b] வந்த செய்தியை அவள் கேட்டபோது, குனிந்து குழந்தையைப் பெற்றெடுத்தாள்; ஏனெனில் பிரசவ வேதனைகள் அவளைப் பற்றிக்கொண்டன[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தேவனுடைய பேழை கைப்பற்றப்பட்டதைப் பற்றிய செய்தியை.” எபிரெய அமைப்பு, செய்தியின் உள்ளடக்கமாகவோ பேழை கைப்பற்றப்பட்டதைப் பற்றிய செய்தியாகவோ புரிந்துகொள்ளப்படலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “தன் மாமனாரும் கணவனும் இறந்திருந்ததாகவும்.” எபிரெய சொல் மரணம் நிகழ்ந்ததையோ அவர்கள் இறந்த நிலையில் இருந்ததையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: சொல்லுக்குச் சொல், “அவளுடைய வேதனைகள் அவள்மேல் திரும்பின.” இது பிரசவ வேதனைகள் அவளை வந்தடைந்து தாக்கியதைக் குறிக்கும் மரபுத்தொடர்.
    reason: idiom_explanation
lexical_decisions:
- source_word: וְכַלָּתוֹ אֵשֶׁת פִּינְחָס
  choice: அவருடைய மருமகளான பினெகாசின் மனைவி
  rationale: כַּלָּה என்பது இங்கு ‘மருமகள்’ என்று பொருள்படும்; அடுத்து வரும் சொற்றொடர் அவளைப் பினெகாசின் மனைவி என்று குறிப்பாக அடையாளப்படுத்துகிறது. தொடக்க וְ தனியாக மொழிபெயர்க்கப்படாமல் தமிழ் உரைநடையின் இயல்பான தொடர்ச்சியில் எடுத்துரைக்கப்பட்டுள்ளது.
- source_word: הָרָה לָלַת
  choice: பிள்ளை பெறும் காலம் நெருங்கிய கர்ப்பிணியாக இருந்தாள்
  rationale: הָרָה கர்ப்பநிலையையும், לָלַת பிள்ளைப்பேறு நெருங்கியிருப்பதையும் குறிக்கின்றன; இரு கூறுகளும் இயல்பான நவீன தமிழில் தக்கவைக்கப்பட்டுள்ளன.
- source_word: וַתִּשְׁמַע אֶת־הַשְּׁמֻעָה
  choice: செய்தியை அவள் கேட்டபோது
  rationale: שְׁמוּעָה என்பதற்கு இச்சூழலில் ‘செய்தி’ இயல்பான பொருத்தம். தொடர் நிகழ்வைக் காட்டும் வினை வடிவம் தமிழில் காலத் துணைவாக்கியமாக வழங்கப்பட்டுள்ளது.
- source_word: אֶל הִלָּקַח אֲרוֹן הָאֱלֹהִים
  choice: தேவனுடைய பெட்டி கைப்பற்றப்பட்டதையும் … பற்றிய
  rationale: הִלָּקַח என்பதன் செயப்பாட்டு பொருளை ‘கைப்பற்றப்பட்டது’ காக்கிறது. אֶל அறிக்கையின் உள்ளடக்கத்தையோ அது பற்றிய பொருளையோ அறிமுகப்படுத்தலாம்; தமிழ் அமைப்பு இரண்டிற்கும் இடமளிக்கிறது.
- source_word: וּמֵת חָמִיהָ וְאִישָׁהּ
  choice: தன் மாமனாரும் கணவனும் இறந்துவிட்டதையும்
  rationale: מֵת மரணத்தை நிகழ்ந்த சம்பவமாகவோ அதன் விளைவுநிலையாகவோ காட்டக்கூடும். ‘இறந்துவிட்டனர்’ முன்பே நிகழ்ந்த மரணத்தையும் அதன் நிலைத்த விளைவையும் இயல்பாக உணர்த்துகிறது.
- source_word: וַתִּכְרַע וַתֵּלֶד
  choice: குனிந்து குழந்தையைப் பெற்றெடுத்தாள்
  rationale: כרע என்பது குனிதல், மண்டியிடுதல் அல்லது கீழே சாய்தல் என்ற உடல் இயக்கத்தைக் குறிக்கும். பிரசவச் சூழலில் அதிகமாக விளக்கம் சேர்க்காமல் ‘குனிந்து’ என்று வழங்கப்பட்டுள்ளது; ילד என்பதற்கு ‘பெற்றெடுத்தாள்’ நேரான இயல்பான இணை.
- source_word: כִּי נֶהֶפְכוּ עָלֶיהָ צִרֶיהָ
  choice: ஏனெனில் அவளுடைய பிரசவ வேதனைகள் திடீரென அவளை ஆட்கொண்டன
  rationale: צִרֶיהָ இங்கு பிரசவ வேதனைகளைக் குறிக்கிறது. נֶהֶפְכוּ עָלֶיהָ என்பதை சொல்லுக்குச் சொல் மொழிபெயர்த்தால் ‘அவள்மேல் திரும்பின’ என்பதாகும்; சூழல்சார் திடீர் தாக்கத்தை ‘ஆட்கொண்டன’ இயல்பாக வெளிப்படுத்துகிறது.
