translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான வரலாற்று உரைநடை பயன்படுத்தப்பட்டுள்ளது. ‘தேவனுடைய பெட்டி’ என்பது மூலத்தின் אֲרוֹן הָאֱלֹהִים என்பதைக் கூடுதல் உடன்படிக்கைச் சொல்லைச் சேர்க்காமல் நேரடியாக வழங்குகிறது. ‘குனிந்து’ என்பது பிரசவ நிலை, மண்டியிடுதல் அல்லது சரிதல் ஆகியவற்றில் ஒன்றைத் தீர்மானமாகத் திணிக்காமல் எபிரெய வினையின் உடல் இயக்கத்தைத் தக்கவைக்கிறது.
