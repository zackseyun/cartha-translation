source:
  edition: WLC
  text: הִֽתְחַזְּק֞וּ וִֽ/הְי֤וּ לַֽ/אֲנָשִׁים֙ פְּלִשְׁתִּ֔ים פֶּ֚ן תַּעַבְד֣וּ לָ/עִבְרִ֔ים כַּ/אֲשֶׁ֥ר עָבְד֖וּ לָ/כֶ֑ם וִ/הְיִיתֶ֥ם לַ/אֲנָשִׁ֖ים וְ/נִלְחַמְתֶּֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/004/009.yaml
  text: Be strong and be men[a], O Philistines, lest you become servants to the Hebrews as they have been to you[b]. Be men and fight!
translation:
  language: ta
  text: பெலிஸ்தியர்களே, திடன்கொள்ளுங்கள்; ஆண்களாய் இருங்கள்[a]! எபிரெயர்கள் உங்களுக்கு அடிமைகளாய் இருந்ததுபோல, நீங்களும் அவர்களுக்கு அடிமைகளாகிவிடாதபடி பார்த்துக்கொள்ளுங்கள்[b]. ஆண்களாய் இருந்து போரிடுங்கள்!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ஆண்களாய் இருங்கள்” என்பது போர்த்துணிவைக் குறிக்கும் பாலினக் குறியீடுள்ள எபிரெய மரபுத்தொடர்; “ஆண்களைப்போல் நடந்துகொள்ளுங்கள்” அல்லது “ஆண்மையோடு நடந்துகொள்ளுங்கள்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “அடிமைகளாய் இருந்ததுபோல” என்பதற்கு எபிரெயத்தில் சொல்லுக்குச் சொல், “உங்களுக்குப் பணிசெய்ததுபோல” என்று உள்ளது; இச்சூழலில் அது கட்டாய அடக்கநிலையைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִתְחַזְּקוּ
  choice: வலிமைகொண்டு
  rationale: Hitpael பன்மை ஏவல் வடிவம் தங்களைத் திடப்படுத்திக்கொள்ளவும் துணிவுகொள்ளவும் அழைக்கிறது; போருக்கு முன் விடுக்கப்படும் ஊக்கவுரையில் ‘வலிமைகொண்டு’ என்பது சுருக்கமாகவும் இயல்பாகவும் உள்ளது.
- source_word: וִהְיוּ לַאֲנָשִׁים
  choice: ஆண்களாய் இருங்கள்
  rationale: எபிரெய மொழியின் பாலினக் குறியீடுள்ள போர்த்துணிவு மரபுத்தொடரை மறைக்காமல், நேரடியாக ஆண் வீரர்களிடம் சொல்லப்படும் சொல்லாகப் பாதுகாக்கிறது.
- source_word: פְּלִשְׁתִּים
  choice: பெலிஸ்தியர்களே
  rationale: தமிழின் ‘-ஏ’ விளி உருபு நேரடி அழைப்பை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: פֶּן
  choice: அடிமைகளாகிவிடாதபடி பார்த்துக்கொள்ளுங்கள்
  rationale: விரும்பத்தகாத விளைவைத் தவிர்க்கும் எச்சரிக்கையைத் தமிழில் தெளிவான ஊக்கவுரை நடையில் தருகிறது.
- source_word: תַּעַבְדוּ
  choice: அடிமைகளாகிவிட
  rationale: இராணுவத் தோல்விக்குப் பின்வரும் கட்டாய அடிமைத்தனமே சூழலில் முதன்மையானது; வெறும் ‘பணிசெய்தல்’ என்று மொழிபெயர்ப்பது அதன் வலிமையைக் குறைக்கும்.
- source_word: לָעִבְרִים
  choice: எபிரெயர்களுக்கு
  rationale: மூலத்தில் உள்ள ‘எபிரெயர்கள்’ என்ற வெளியார் வழக்குப் பெயரை ‘இஸ்ரவேலர்’ என்று ஒத்திசைக்காமல் காக்கிறது.
- source_word: כַּאֲשֶׁר עָבְדוּ לָכֶם
  choice: அவர்கள் உங்களுக்கு அடிமைகளாய் இருந்ததுபோல
  rationale: முன்னைய அரசியல் மற்றும் இராணுவ அடக்கநிலையைத் தெளிவாகக் கூறி, עבד என்பதன் இவ்விடத்திற்குரிய பொருளைத் தக்கவைக்கிறது.
- source_word: וִהְיִיתֶם לַאֲנָשִׁים
  choice: ஆண்களாய் இருந்து
  rationale: மூலத்தின் மீளுரைப்பையும் அதன் வலியுறுத்தலையும் காக்க, முன்பு பயன்படுத்திய அதே மரபுத்தொடர் தொடரப்படுகிறது.
- source_word: וְנִלְחַמְתֶּם
  choice: போரிடுங்கள்
  rationale: சூழலில் ஏவல் பொருளில் வரும் தொடரை நேரடியான, இயல்பான நவீனத் தமிழில் தருகிறது.
theological_decisions:
- issue: לַאֲנָשִׁים என்ற பாலினக் குறியீடுள்ள ஊக்கவுரை
  choice: ஆண்களாய் இருங்கள்
  alternative: துணிவுடன் இருங்கள் / ஆண்களைப்போல் நடந்துகொள்ளுங்கள்
  rationale: இது ஆண் பெலிஸ்திய வீரர்களை நோக்கிய, ஆண்மையான போர்த்துணிவைச் சுட்டும் குறியீடுள்ள மரபுத்தொடர். பாலினமற்ற சொற்றொடராக மாற்றுவது மூலத்தின் சொல்லாட்சியையும் சொல்லியல் இறுக்கத்தையும் தட்டையாக்கும்.
- issue: இராணுவ அடக்கநிலையில் עבד என்பதன் வலிமை
  choice: அடிமைகளாகிவிட
  alternative: பணிவிடை செய்ய / கீழ்ப்பட்டுவிட
  rationale: இங்கு விருப்பப் பணி அல்ல, போர்த் தோல்வியால் ஏற்படும் கட்டாய அடக்கமும் அடிமைநிலையும் அஞ்சப்படுகிறது; எனவே ‘அடிமை’ என்பது சூழலுக்குரிய வலிமையை வெளிப்படுத்துகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், போருக்கு முன் விடுக்கப்படும் நேரடியானதும் கண்ணியமானதுமான ஊக்கவுரை நடை பயன்படுத்தப்பட்டுள்ளது. ‘ஆண்களாய் இருங்கள்’ என்ற மீளுரை மூலத்தின் பாலினக் குறியீட்டையும் உரைத்திறனையும் பாதுகாக்கிறது; அதன் மரபுத்தொடர் பொருள் அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது.
