reference: 1 Samuel 4:7
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יִּֽרְאוּ֙ הַ/פְּלִשְׁתִּ֔ים כִּ֣י אָמְר֔וּ בָּ֥א אֱלֹהִ֖ים אֶל הַֽ/מַּחֲנֶ֑ה וַ/יֹּאמְרוּ֙ א֣וֹי לָ֔/נוּ כִּ֣י לֹ֥א הָיְתָ֛ה כָּ/זֹ֖את אֶתְמ֥וֹל שִׁלְשֹֽׁם־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/004/007.yaml
  text: The Philistines were afraid[a], for they said, “God has come into the camp.” And they said, “Woe to us! For nothing like this has happened before.”
translation:
  language: ta
  text: பெலிஸ்தியர்கள் பயந்தார்கள். ஏனெனில், “கடவுள்[a] முகாமுக்குள் வந்திருக்கிறார்” என்று அவர்கள் சொன்னார்கள். மேலும் அவர்கள், “ஐயோ, நமக்குக் கேடு! இதற்கு முன்பு இப்படிப்பட்ட ஒன்று நடந்ததே இல்லை” என்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஒரு தெய்வம் முகாமுக்குள் வந்திருக்கிறது.” எபிரெயப் பெயர்ச்சொல் வடிவத்தில் பன்மையாக இருந்தாலும், அதனுடன் வரும் வினைச்சொல் ஒருமையில் இருப்பதால் முதன்மை வாசகத்தில் “கடவுள்” என்று மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּֽרְאוּ
  choice: பயந்தார்கள்
  rationale: ירא என்பதன் இந்தக் கதைநடை வடிவம் பெலிஸ்தியர்களின் உடனடியான அச்சத்தைத் தெரிவிக்கிறது; ‘பயந்தார்கள்’ என்பது இயல்பான நவீனத் தமிழ்.
- source_word: הַפְּלִשְׁתִּים
  choice: பெலிஸ்தியர்கள்
  rationale: இந்த மக்கள் இனத்திற்கான தமிழில் வழக்கமான பெயர்.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: அவர்கள் பயந்ததற்கான காரணத்தை அறிமுகப்படுத்துகிறது.
- source_word: בָּא אֱלֹהִים
  choice: கடவுள் வந்திருக்கிறார்
  rationale: אֱלֹהִים வடிவத்தில் பன்மையாக இருந்தாலும், அதனுடன் வரும் בָּא வினைச்சொல் ஒருமையில் உள்ளது; ஆகவே ஒருமையான ‘கடவுள்’ முதன்மை வாசகமாகத் தேர்ந்தெடுக்கப்பட்டது. முடிவுற்ற வருகையின் தற்போதைய விளைவை ‘வந்திருக்கிறார்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: אֶל הַמַּחֲנֶה
  choice: முகாமுக்குள்
  rationale: இஸ்ரவேலரின் முகாமினுள் வந்த இயக்கத்தைத் தெளிவாகக் காட்டுகிறது.
- source_word: אוֹי לָנוּ
  choice: ஐயோ, நமக்குக் கேடு!
  rationale: வரப்போகும் அழிவைக் குறித்த ஆழ்ந்த பதற்றத்தையும் துயரக் கூக்குரலையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: לֹא הָיְתָה כָּזֹאת
  choice: இப்படிப்பட்ட ஒன்று நடந்ததே இல்லை
  rationale: இத்தகைய நிகழ்வு ஏற்பட்டதில்லை என்ற எபிரெய மொழிவழக்கின் கருத்தைத் தெளிவாக வழங்குகிறது.
- source_word: אֶתְמוֹל שִׁלְשֹׁם
  choice: இதற்கு முன்பு
  rationale: சொல்லுக்குச் சொல் ‘நேற்றும் முந்தின நாளும்’ என்றாலும், இவ்விணைச்சொல் இங்கு ‘முன்பு’ அல்லது ‘முன்னர்’ என்னும் மொழிவழக்குப் பொருளைக் கொண்டது.
theological_decisions:
- issue: பெலிஸ்தியர்களின் கூற்றில் אֱלֹהִים என்பதன் மொழிபெயர்ப்பு
  choice: கடவுள்
  alternative: ஒரு தெய்வம்; தெய்வங்கள்
  rationale: בָּא என்ற ஒருமை வினைச்சொல் ஒருமையான குறிப்பை வலுவாக ஆதரிக்கிறது. எனினும், பேசியவர்கள் பெலிஸ்தியர்கள் என்பதாலும் אֱלֹהִים வடிவத்தில் பன்மையாக இருப்பதாலும், ‘ஒரு தெய்வம்’ என்ற சாத்தியத்தை அடிக்குறிப்பில் பாதுகாக்கிறோம்; ‘தெய்வங்கள்’ என்பது வடிவியல் சாத்தியம் என்றாலும் ஒருமை வினையுடன் குறைவாகப் பொருந்துகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘ஐயோ, நமக்குக் கேடு!’ என்பது אוֹי לָנוּ என்பதன் அழிவு அச்சத்தை இயல்பாகத் தக்கவைக்கிறது. அடிக்குறிப்பு குறியீடு உரையில் உரிய இடத்தில் சேர்க்கப்பட்டுள்ளது.
