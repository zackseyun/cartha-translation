  text: וַ/תִּקְרָ֣א לַ/נַּ֗עַר אִֽי כָבוֹד֙ לֵ/אמֹ֔ר גָּלָ֥ה כָב֖וֹד מִ/יִּשְׂרָאֵ֑ל אֶל הִלָּקַח֙ אֲר֣וֹן הָ/אֱלֹהִ֔ים וְ/אֶל חָמִ֖י/הָ וְ/אִישָֽׁ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/004/021.yaml
  text: And she named the boy Ichabod[a], saying, “The glory has departed from Israel,” because the ark of God had been taken, and because of her father-in-law and her husband.
translation:
  language: ta
  text: அவள் அந்தப் பையனுக்கு இக்காபோத்[a] என்று பெயரிட்டு, “மகிமை இஸ்ரவேலைவிட்டு அகன்றுபோயிற்று” என்று சொன்னாள்; கடவுளின் பேழை கைப்பற்றப்பட்டதாலும், அவளுடைய மாமனாரையும் கணவனையும் முன்னிட்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘இக்காபோத்’ என்ற பெயர், ‘மகிமை இல்லை’ அல்லது ‘மகிமை எங்கே?’ என்பதோடு தொடர்புடைய எபிரெயச் சொற்கூறுகளால் அமைந்ததாக இருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּקְרָא לַנַּעַר
  choice: அவள் அந்தப் பையனுக்கு ... என்று பெயரிட்டு
  rationale: பெயரிடும் சூழலில் קרא + ל என்பது ஒருவருக்குப் பெயர் சூட்டுவதைக் குறிக்கிறது. இயல்பான நவீனத் தமிழில் இதை ‘பெயரிட்டு’ என்று வழங்குவது பொருத்தம்.
- source_word: אִי כָבוֹד
  choice: இக்காபோத்
  rationale: தனிப்பெயரைப் பொருளாக்காமல், எபிரெய ஒலிப்புக்கு நெருக்கமாகத் தமிழில் எழுத்துப்பெயர்த்துள்ளது; அதன் உறுதியற்ற சொற்பிறப்புப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: גָּלָה כָבוֹד מִיִּשְׂרָאֵל
  choice: மகிமை இஸ்ரவேலைவிட்டு அகன்றுபோயிற்று
  rationale: גלה பிரிதல் அல்லது அகன்றுபோதல் என்ற கருத்தைக் கொண்டுள்ளது. ‘அகன்றுபோயிற்று’ என்பது மகிமை நீங்கியதை இயல்பாகச் சொல்கிறது; כָבוֹד என்பதன் ‘மகிமை/மாண்பு’ என்ற ஒலிவட்டத்தைத் தேவையின்றிக் குறுக்கவில்லை.
- source_word: אֶל הִלָּקַח אֲרוֹן הָאֱלֹהִים
  choice: கடவுளின் உடன்படிக்கைப் பெட்டி கைப்பற்றப்பட்டதாலும்
  rationale: இங்கு אֶל காரணத்தைக் குறிக்கும் விதமாகப் புரிந்துகொள்ளப்படுகிறது. הִלָּקַח என்பதன் செயப்பாட்டு உணர்வை ‘கைப்பற்றப்பட்ட’ எனத் தெளிவாக வழங்குகிறது. ‘உடன்படிக்கைப் பெட்டி’ என்பது இப்புனிதப் பெட்டியைச் சாதாரணப் பெட்டியிலிருந்து தெளிவுபடுத்தும் இயல்பான தமிழ் வேதாகமச் சொல்.
- source_word: וְאֶל חָמִיהָ וְאִישָׁהּ
  choice: அவளுடைய மாமனாரும் கணவனும் இறந்ததாலும்
  rationale: மீண்டும் வரும் אֶל முந்தைய காரணவுணர்வைத் தொடர்கிறது. எபிரெயம் மரணத்தை இங்கு சுருக்கமாகச் சுட்டினாலும், உடனடியான சூழல் இருவரின் மரணத்தையே குறிக்கிறது; தமிழில் காரணத் தொடர்பை முழுமைப்படுத்த ‘இறந்ததாலும்’ சேர்க்கப்பட்டுள்ளது.
theological_decisions:
- issue: இஸ்ரவேலுடன் தொடர்புடைய ‘மகிமை’ என்பதன் பொருள்
  choice: ‘மகிமை’ என்று மட்டும் வைத்து, அது கடவுளின் வெளிப்பட்ட பிரசன்னமா, இஸ்ரவேலின் மாண்பா, அல்லது இரண்டுமா என்பதை வெளிப்படையாகத் தீர்மானிக்கவில்லை.
  alternative: ‘கடவுளின் மகிமை இஸ்ரவேலைவிட்டு அகன்றது’ அல்லது ‘இஸ்ரவேலின் மாண்பு அகன்றது’
  rationale: כָבוֹד என்ற எபிரெயச் சொல் இங்கு செறிவான பல்பொருள் தன்மையுடன் உள்ளது. பெட்டி கைப்பற்றப்பட்டதும் ஏலியின் வீட்டாரின் மரணங்களும் கடவுளின் பிரசன்ன இழப்பையும் இஸ்ரவேலின் வீழ்ச்சியையும் ஒன்றாக ஒலிக்கச் செய்கின்றன; மொழிபெயர்ப்பு அந்த இறையியல் பதற்றத்தைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்கு எளிதாகவும் மரியாதைமிக்க நடையிலும் அமைக்கப்பட்டுள்ளது. ‘மகிமை’ என்ற பாரம்பரியமும் புரிந்துகொள்ளத்தக்கதுமான சொல்லைத் தக்கவைத்து, மூலத்தின் இறையியல் பல்பொருள் தன்மை பாதுகாக்கப்பட்டுள்ளது.
