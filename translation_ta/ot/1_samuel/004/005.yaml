source:
  edition: WLC
  text: וַ/יְהִ֗י כְּ/ב֨וֹא אֲר֤וֹן בְּרִית יְהוָה֙ אֶל הַֽ/מַּחֲנֶ֔ה וַ/יָּרִ֥עוּ כָל יִשְׂרָאֵ֖ל תְּרוּעָ֣ה גְדוֹלָ֑ה וַ/תֵּהֹ֖ם הָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/004/005.yaml
  text: When the ark of the covenant of Yahweh came into the camp[a], all Israel shouted with a great shout, and the earth resounded.
translation:
  language: ta
  text: யாவேயின் உடன்படிக்கைப் பெட்டி முகாமுக்குள் வந்தபோது, இஸ்ரவேலர் அனைவரும் பெருமுழக்கமிட்டார்கள்; பூமி முழங்கியது[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘பூமி அதிர்ந்தது.’ எபிரெய வினைச்சொல் பேரொலியையோ கொந்தளிப்பையோ நடுக்கத்தையோ குறிக்கலாம்; இங்கு நிச்சயமான நிலநடுக்கம் ஏற்பட்டதாக உரை கட்டாயப்படுத்துவதில்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כְּבוֹא
  choice: வந்தபோது
  rationale: காலத்தைக் குறிக்கும் எபிரெயக் கதைத் தொடரை இயல்பான நவீனத் தமிழில் தருகிறது; தேவையற்ற வகையில் ‘அப்போது நிகழ்ந்ததாவது’ என்று நீட்டிக்கவில்லை.
- source_word: אֲרוֹן בְּרִית יְהוָה
  choice: யாவேயின் உடன்படிக்கைப் பெட்டி
  rationale: எபிரெயக் கட்டமைப்பின் உறவையும் உடன்படிக்கை சார்ந்த பொருளையும் தெளிவாகக் காக்கிறது; ‘பெட்டி’ என்பது சாதாரண வாசகர்களுக்குப் புரியும் இயல்பான சொல்.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைப்பட்டத்தால் மாற்றாமல், எபிரெயத் திருப்பெயரின் வழக்கமான தமிழ் ஒலிபெயர்ப்பைப் பயன்படுத்துகிறது.
- source_word: הַמַּחֲנֶה
  choice: முகாம்
  rationale: இராணுவச் சூழலில் இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: וַיָּרִיעוּ כָל־יִשְׂרָאֵל תְּרוּעָה גְדוֹלָה
  choice: இஸ்ரவேலர் அனைவரும் பெருமுழக்கமிட்டார்கள்
  rationale: வினைச்சொல்லும் அதே வேரிலான பெயர்ச்சொல்லும் சேர்ந்து தரும் தீவிரத்தை ‘பெருமுழக்கமிட்டார்கள்’ சுருக்கமாகவும் வலிமையாகவும் வெளிப்படுத்துகிறது; ‘போர்க்குரல்’ எனப் பொருளை மிகையாகக் குறிப்பாக்கவில்லை.
- source_word: וַתֵּהֹם הָאָרֶץ
  choice: பூமி முழங்கியது
  rationale: הום என்ற வினை குறிக்கும் பேரொலி அல்லது கொந்தளிப்பை வெளிப்படுத்துகிறது; நிச்சயமான நிலநடுக்கம் என்று தீர்மானிக்காமல் மூலத்தின் உருவகத் திறப்பைப் பாதுகாக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைபெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூல வசனம் தனிப்பட்ட உடன்படிக்கைப் பெயரையே பயன்படுத்துவதால், அதைப் பட்டப்பெயராக மாற்றாமல் ஒலிபெயர்ப்பது உரைக்கு நெருக்கமானது.
translation_notes:
  register: நவீன நிலையான தமிழ்; எளிமையானதாயினும் கண்ணியமான கதைநடை. ‘பெருமுழக்கம்’ நிகழ்வின் தீவிரத்தைக் காக்கிறது; கடைசி வாக்கியத்தில் உள்ள எபிரெயச் சொற்பொருள் தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
