base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/004/020.yaml
  text: And about the time of her death[a], the women standing by her said, “Do not fear, for you have borne a son.” But she did not answer, nor did she take it to heart.
translation:
  language: ta
  text: அவள் இறக்கும் வேளையில், அவளருகே நின்றுகொண்டிருந்த பெண்கள் அவளிடம், “அஞ்சாதே; நீ ஒரு மகனைப் பெற்றெடுத்திருக்கிறாய்” என்றார்கள். ஆனால் அவள் பதில் சொல்லவும் இல்லை; அதை மனத்தில் கொள்ளவும் இல்லை[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவள் அதில் தன் மனத்தைச் செலுத்தவில்லை”; அதாவது, அவர்கள் சொன்னதை அவள் கவனிக்கவில்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּכְעֵת מוּתָהּ
  choice: அவள் இறக்கும் வேளையில்
  rationale: இச்சொற்றொடர் அவளுடைய மரணம் நிகழ்ந்த காலச்சூழலைக் குறிக்கிறது. ‘இறக்கும் வேளையில்’ என்பது அவள் மரணத் தறுவாயில் இருந்ததை இயல்பாகவும் நேரடியாகவும் தெரிவிக்கிறது.
- source_word: וַתְּדַבֵּרְנָה
  choice: என்றார்கள்
  rationale: பெண்பால் பன்மை வினைச்சொல், அருகிலிருந்த பெண்கள் அவளிடம் கூறியதை அறிமுகப்படுத்துகிறது; நேர்க்கூற்றுக்குப் பின் ‘என்றார்கள்’ என்பது நவீன தமிழில் இயல்பானது.
- source_word: הַנִּצָּבוֹת עָלֶיהָ
  choice: அவளருகே நின்றுகொண்டிருந்த பெண்கள்
  rationale: நின்றிருந்த அல்லது அருகிருந்து கவனித்துக்கொண்டிருந்த பெண்களை இச்சொற்றொடர் குறிக்கிறது. மூலத்தின் தெளிவான ‘நிற்றல்’ படிமத்தையும் அருகாமையையும் இந்த மொழிபெயர்ப்பு காக்கிறது.
- source_word: אַל תִּירְאִי
  choice: அஞ்சாதே
  rationale: இது அச்சப்பட வேண்டாம் என்னும் நேரடி எதிர்மறைக் கட்டளை. ‘அஞ்சாதே’ சுருக்கமாகவும் கண்ணியமான நடையிலும் உள்ளது.
- source_word: כִּי בֵן יָלָדְתְּ
  choice: நீ ஒரு மகனைப் பெற்றெடுத்திருக்கிறாய்
  rationale: அவர்கள் அவளைத் தேற்றுவதற்கான காரணத்தை இவ்வாக்கியம் தருகிறது. ‘பெற்றெடுத்திருக்கிறாய்’ பிரசவ நிகழ்வையும் அதன் உடனடி விளைவையும் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: וְלֹא עָנְתָה
  choice: அவள் பதில் சொல்லவும் இல்லை
  rationale: ענה இங்கு பதிலளித்தல் என்னும் பொருளுடையது. தமிழ் இணைநிலை எதிர்மறை அமைப்பை அடுத்த கூற்றோடு இயல்பாக இணைக்க ‘பதில் சொல்லவும் இல்லை’ என மொழிபெயர்க்கப்பட்டது.
- source_word: וְלֹא שָׁתָה לִבָּהּ
  choice: அதை மனத்தில் கொள்ளவும் இல்லை
  rationale: சொல்லப்பட்டதை மனத்தில் வைத்தல், பொருட்படுத்தல் அல்லது கவனித்தல் என்னும் எபிரெய வழக்கை இது குறிக்கிறது. ‘மனத்தில் கொள்ளவில்லை’ என்பது மனம்/இதயம் சார்ந்த மூலப் படிமத்தைப் பாதுகாத்தபடி தமிழில் புரியத்தக்கதாக உள்ளது.
