  register: நவீனத் தரத் தமிழில், எளிதில் புரியும் ஆனால் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் இணை எதிர்மறை அமைப்பும் ‘மனம்’ சார்ந்த மொழிப்படிமமும் காக்கப்பட்டுள்ளன.
