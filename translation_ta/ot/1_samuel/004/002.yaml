translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான வரலாற்று-இராணுவ நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. எபிரெய வாக்கியத்தின் தொடர்ச்சியைத் தமிழில் தெளிவுபடுத்த, கடைசி வாக்கியத்தின் மறைமுக எழுவாய் ‘பெலிஸ்தியர்கள்’ என்று வெளிப்படுத்தப்பட்டுள்ளது.
