base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/004/002.yaml
  text: The Philistines drew up to meet Israel[a], and the battle spread out, and Israel was defeated before the Philistines; and they struck down about four thousand men in the battle line in the field.
translation:
  language: ta
  text: பெலிஸ்தியர்கள் இஸ்ரவேலை எதிர்கொள்ள அணிவகுத்தார்கள். போர் பரவியது[a]; இஸ்ரவேல் பெலிஸ்தியர்களுக்கு முன்பாகத் தோற்கடிக்கப்பட்டது. பெலிஸ்தியர்கள் களத்தில் போர் வரிசையில் இருந்த சுமார் நாலாயிரம் பேரைத் தாக்கி வீழ்த்தினார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “போர் மூண்டது.” இங்குள்ள எபிரெய வினைச்சொல் போர் தொடங்கியதையோ, மோதலாகப் பரவியதையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַרְכוּ
  choice: அணிவகுத்தார்கள்
  rationale: இராணுவச் சூழலில் படைகள் போருக்காக ஒழுங்கான அணியாக நிறுத்தப்பட்டதை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: לִקְרַאת
  choice: எதிர்கொள்ள
  rationale: எதிர்ப்படச் செல்லுதல் அல்லது சந்தித்தல் என்ற பொருளை, ஏற்கெனவே தெளிவாக உள்ள போர்ச் சூழலுக்கு ஏற்றவாறு தருகிறது.
- source_word: וַתִּטֹּשׁ הַמִּלְחָמָה
  choice: போர் பரவியது
  rationale: போர் தொடங்கி விரிந்து மோதலாக வளர்ந்தது என்ற எபிரெய உருவகத்தைப் பாதுகாக்கிறது; அதன் பொருள் வரம்பை அடிக்குறிப்பு சுட்டுகிறது.
- source_word: וַיִּנָּגֶף
  choice: தோற்கடிக்கப்பட்டது
  rationale: நிபால் வடிவம் எதிரியின் முன்னிலையில் தோல்வியடைந்ததைக் குறிக்கிறது; அடுத்த வாக்கியத்தில் வரும் உயிரிழப்புகளோடு இதை முன்கூட்டியே ஒன்றாக்காமல் காக்கிறது.
- source_word: לִפְנֵי
  choice: முன்பாக
  rationale: எதிரியின் முன்னிலையில் தோல்வியுறுதல் என்ற எபிரெய இராணுவ மரபுத்தொடரை நெருக்கமாகப் பாதுகாக்கிறது.
- source_word: וַיַּכּוּ
  choice: வெட்டி வீழ்த்தினார்கள்
  rationale: போரில் கொல்லுமளவுக்குத் தாக்கி வீழ்த்தியதைக் கண்ணியமான, தெளிவான தமிழில் தெரிவிக்கிறது.
- source_word: בַמַּעֲרָכָה
  choice: போரணியில்
  rationale: போருக்காக அமைக்கப்பட்ட அணி அல்லது வரிசை என்ற சொல்லின் இராணுவப் பொருளைச் சுருக்கமாகத் தருகிறது.
- source_word: בַּשָּׂדֶה
  choice: களத்தில்
  rationale: மூலத்தின் ‘வெளி/களம்’ என்ற பொருளை தேவையற்ற ‘திறந்த வெளி’ என்ற விரிவாக்கமின்றி, போர்ச் சூழலில் இயல்பாகக் காட்டுகிறது.
- source_word: כְּאַרְבַּעַת אֲלָפִים אִישׁ
  choice: சுமார் நாலாயிரம் பேர்
  rationale: כְּ எண்ணிக்கையின் தோராயத்தன்மையை ‘சுமார்’ என்பதால் காட்டுகிறது; אִישׁ இங்கு எண்ணப்படும் போர்வீரர்களைக் குறித்தாலும், தமிழில் இயல்பாக ‘பேர்’ என வழங்கப்பட்டுள்ளது.
