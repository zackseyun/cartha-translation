  text: அவள், “மகிமை இஸ்ரவேலைவிட்டு நீங்கிவிட்டது[a]; ஏனெனில் தேவனுடைய பெட்டி எடுத்துக்கொள்ளப்பட்டது[b],” என்றாள்.
  philosophy: optimal-equivalence
