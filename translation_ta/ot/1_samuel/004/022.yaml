theological_decisions:
- issue: ‘மகிமை’க்கும் இஸ்ரவேலுக்கும் தேவனுடைய பெட்டிக்கும் உள்ள தொடர்பு
  choice: தேவனுடைய பெட்டி எடுத்துக்கொள்ளப்பட்டதோடு தொடர்புடையதாக, இஸ்ரவேலிலிருந்து மகிமை நீங்கிவிட்டது என்று உரை கூறும் அளவிலேயே மொழிபெயர்க்கப்பட்டது.
  alternative: ‘மகிமை’ என்பது இஸ்ரவேலின் தேசிய கௌரவம் மட்டுமே என்று கொள்ளுதல்; அல்லது தேவன் தாமே முற்றிலும் இஸ்ரவேலைவிட்டு நீங்கினார் என்று வெளிப்படையாகக் கூறுதல்.
  rationale: உடனடிச் சூழல் மகிமை நீங்கியதைப் பெட்டி எடுத்துக்கொள்ளப்பட்டதோடு இணைக்கிறது. எனினும், தேவனுடைய பிரசன்னம் பெட்டிக்குள் கட்டுப்பட்டிருந்தது என்ற கோட்பாட்டை வசனம் வரையறுக்கவில்லை; ஆகவே அந்த இறையியல் இழுபறி தீர்க்கப்படாமல் பேணப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழ்; எளிதில் புரியக்கூடியதாயிருந்தும் கண்ணியமான வேதாகம நடையைப் பேணுகிறது. மூலத்தின் சொல் வரிசையை பெருமளவு காக்கிறது. ‘உடன்படிக்கைப் பெட்டி’ என்று விரிவாக்காமல், மூலத்தில் உள்ள ‘தேவனுடைய பெட்டி’ என்பதையே பயன்படுத்துகிறது.
