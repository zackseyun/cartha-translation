base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/004/013.yaml
  text: When he came[a], behold, Eli was sitting on the seat by the road, watching, because his heart trembled for the ark of God. And the man came to report it in the city[b], and the whole city cried out.
translation:
  language: ta
  text: அவன் வந்தபோது, இதோ, ஏலி சாலையின் ஓரத்தில்[a] ஓர் இருக்கையில் அமர்ந்து எதிர்நோக்கிக் காத்திருந்தான். ஏனெனில் தேவனுடைய பேழையைப் பற்றிய கவலையால் அவன் உள்ளம் நடுங்கிக்கொண்டிருந்தது[b]. அந்த மனிதன் நகரத்திற்குள் வந்து செய்தியை அறிவித்தான்; நகரம் முழுவதும் கூக்குரலிட்டது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மொழியில் சொல்லுக்குச் சொல், ‘சாலையின் கை/பக்கத்தில்’; அதாவது சாலையோரத்தில்.
    reason: cultural_note
  - marker: b
    text: அல்லது, ‘தேவனுடைய பேழையைப் பற்றி அவன் உள்ளம் பதற்றமடைந்திருந்தது.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: அவன் வந்தபோது
  rationale: தொடர்ந்து முன்னேறும் எபிரெயக் கதைநடையை அடுத்த காட்சியோடு இயல்பாக இணைக்கிறது; வருதல் என்ற அடிப்படைப் பொருளையும் காக்கிறது.
- source_word: וְהִנֵּה
  choice: இதோ
  rationale: காட்சியின்மீது திடீரெனக் கவனத்தை ஈர்க்கும் உரையாடல் குறியைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: יֹשֵׁב עַל־הַכִּסֵּא
  choice: ஓர் இருக்கையில் அமர்ந்து
  rationale: ஏலியின் அமர்ந்த நிலையைக் காட்டுகிறது. כִּסֵּא என்பதற்கு இங்கு அரசாசனம் என்ற மிகைநுட்பத்தைச் சேர்க்காமல் பொதுவான ‘இருக்கை’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: יַד דֶּרֶךְ
  choice: சாலையின் ஓரத்தில்
  rationale: சொல்லுக்குச் சொல் ‘சாலையின் கை/பக்கம்’ எனும் எபிரெய மரபுத்தொடரின் இடப்பொருளை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: מְצַפֶּה
  choice: எதிர்நோக்கிக் காத்திருந்தான்
  rationale: கவனமாக நோக்குதல் மற்றும் எதிர்பார்ப்புடன் காத்திருத்தல் ஆகிய இரு நுட்பங்களையும் சூழலுக்கேற்ற தமிழில் வெளிப்படுத்துகிறது.
- source_word: כִּי הָיָה לִבּוֹ חָרֵד
  choice: ஏனெனில் ... அவன் உள்ளம் நடுங்கிக்கொண்டிருந்தது
  rationale: חָרֵד என்பதிலுள்ள அச்சம், பதற்றம், நடுக்கம் ஆகிய உணர்வுகளைத் தீர்மானித்து ஒற்றைப் பொருளாக்காமல், எபிரெய மொழியின் உடல் சார்ந்த உருவகத்தைப் பாதுகாக்கிறது.
- source_word: עַל אֲרוֹן הָאֱלֹהִים
  choice: தேவனுடைய பெட்டியைப் பற்றிய கவலையால்
  rationale: עַל என்பது இங்கு கவலையின் பொருளைக் குறிக்கிறது. ‘உடன்படிக்கை’ அல்லது ‘புனித’ போன்ற மூலத்தில் இல்லாத அடைமொழிகள் சேர்க்கப்படவில்லை.
- source_word: וְהָאִישׁ
  choice: அந்த மனிதன்
  rationale: முன்னரே குறிப்பிடப்பட்ட செய்தியாளனைச் சுட்டுகிறது; ‘தூதன்’ போன்ற விளக்கச் சொல்லை மூலத்துக்கு மேலாகச் சேர்க்கவில்லை.
- source_word: לְהַגִּיד בָּעִיר
  choice: நகரத்திற்குள் வந்து செய்தியை அறிவித்தான்
  rationale: அவன் நகரில் வந்து அறிவித்த நிகழ்வை இயல்பான தமிழில் தருகிறது. அறிவிக்கப்பட்ட பொருள் சூழலில் போர் செய்தி என்பதால் பொதுவாக ‘செய்தி’ எனக் கூறப்பட்டுள்ளது.
- source_word: וַתִּזְעַק כָּל־הָעִיר
  choice: உடனே நகரம் முழுவதும் கதறியது
  rationale: זעק குறிக்கும் துயரம் அல்லது பேரச்சத்தின் கூக்குரலை ‘கதறியது’ வலிமையாக வெளிப்படுத்துகிறது; waw தொடர்ச்சியின் உடனடி விளைவையும் ‘உடனே’ இயல்பாகக் காட்டுகிறது.
theological_decisions:
- issue: אֲרוֹן הָאֱלֹהִים என்பதன் பெயர்ப்பு
  choice: தேவனுடைய பெட்டி
  alternative: தேவனுடைய உடன்படிக்கைப் பெட்டி
  rationale: இங்கு எபிரெய மூலத்தில் ‘உடன்படிக்கை’ என்ற சொல் இல்லை. அறியப்பட்ட புனிதப் பொருளையே இது குறித்தாலும், மூலத்தின் சுருக்கமான சொல்லாக்கத்தைப் பாதுகாக்க அந்த இறையியல் விளக்கம் பிரதான உரையில் சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியக்கூடியதாயும் கண்ணியமான கதைநடை கொண்டதாயும் வடிவமைக்கப்பட்டது. ‘இதோ’ மூலத்தின் காட்சித் தீவிரத்தைப் பாதுகாக்கிறது. ‘பெட்டி’ என்பது சாதாரண வாசகருக்குப் புரியும் நேரடியான சொல்; அதன் தனித்த புனிதப் பின்னணி சூழலிலிருந்து வெளிப்பட அனுமதிக்கப்பட்டுள்ளது.
