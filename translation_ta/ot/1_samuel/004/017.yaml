  text: וַ/יַּ֨עַן הַֽ/מְבַשֵּׂ֜ר וַ/יֹּ֗אמֶר נָ֤ס יִשְׂרָאֵל֙ לִ/פְנֵ֣י פְלִשְׁתִּ֔ים וְ/גַ֛ם מַגֵּפָ֥ה גְדוֹלָ֖ה הָיְתָ֣ה בָ/עָ֑ם וְ/גַם שְׁנֵ֨י בָנֶ֜י/ךָ מֵ֗תוּ חָפְנִי֙ וּ/פִ֣ינְחָ֔ס וַ/אֲר֥וֹן הָ/אֱלֹהִ֖ים נִלְקָֽחָה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/004/017.yaml
  text: The messenger answered and said[a], “Israel has fled before the Philistines, and there has also been a great slaughter among the people; and your two sons also are dead, Hophni and Phinehas[b]; and the ark of God has been taken.”
translation:
  language: ta
  text: அந்தச் செய்தியைக் கொண்டுவந்தவன் மறுமொழியாக, “இஸ்ரவேலர் பெலிஸ்தியருக்கு முன்பாக ஓடிப்போய்விட்டார்கள்; மக்களிடையே பெரும் படுகொலை நிகழ்ந்தது[a]. உன் இரு மகன்களும்—ஓப்னியும் பினெகாஸும்—இறந்துவிட்டார்கள்; கடவுளின் பெட்டி கைப்பற்றப்பட்டது[b]” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மக்களிடையே பெரும் தோல்வி நிகழ்ந்தது.” எபிரெயச் சொல் கடுமையான அடி, கொள்ளைநோய், அல்லது படுகொலையைக் குறிக்கலாம்; இங்கு போர்ச் சூழல் “படுகொலை” என்ற பொருளை ஆதரிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: நேரடியாக, “கடவுளின் பெட்டி எடுத்துக்கொள்ளப்பட்டது”; அல்லது, “பிடிக்கப்பட்டது.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמְבַשֵּׂר
  choice: அந்தச் செய்தியைக் கொண்டுவந்தவன்
  rationale: இச்செயப்பெயரெச்ச வடிவம் செய்தியைக் கொண்டுவருபவனைக் குறிக்கிறது. போர்க்கள அறிக்கையின் சூழலில் இது இயல்பாகவும் மூலத்துக்கு நெருக்கமாகவும் உள்ளது.
- source_word: נָס
  choice: தப்பியோடிவிட்டார்கள்
  rationale: வினைச்சொல் ஓடித் தப்புவதைக் குறிக்கிறது; நிறைவுற்ற அண்மை நிகழ்வாக அறிக்கையிடப்படுவதைத் தமிழ் வடிவம் வெளிப்படுத்துகிறது.
- source_word: לִפְנֵי פְלִשְׁתִּים
  choice: பெலிஸ்தியருக்கு முன்பாக
  rationale: எதிரியின் முன்னிலையிலிருந்து பின்வாங்கி ஓடுதல் என்ற எபிரெய மரபுத்தொடரின் படிமத்தைத் தக்கவைக்கிறது.
- source_word: מַגֵּפָה גְדוֹלָה
  choice: பெரும் படுகொலை
  rationale: இச்சொற்றொடர் கடும் அடி, கொள்ளைநோய், அல்லது உயிரிழப்புமிக்க பேரழிவைக் குறிக்கலாம்; இங்குள்ள போர்ச் சூழல் படுகொலையை ஆதரிக்கிறது.
- source_word: בָעָם
  choice: மக்களிடையே
  rationale: எபிரெய உரை நேரடியாக ‘மக்கள்’ என்கிறது; சூழலில் இவர்கள் இஸ்ரவேல் படைவீரர்களைக் குறித்தாலும் அந்த பொதுப்பெயர் தக்கவைக்கப்படுகிறது.
- source_word: שְׁנֵי בָנֶיךָ
  choice: உன் மகன்கள் இருவராகிய
  rationale: குறிப்பிட்ட இரு மகன்களையும் இயல்பான தமிழில் வலியுறுத்துகிறது.
- source_word: מֵתוּ
  choice: இறந்துவிட்டார்கள்
  rationale: நிறைவுற்ற இறப்பை அறிவிக்கும் எபிரெய வினையின் பொருளைத் தெளிவாகத் தருகிறது.
- source_word: חָפְנִי וּפִינְחָס
  choice: ஓப்னியும் பினெகாசும்
  rationale: தனிப்பெயர்கள் தமிழில் நிலைபெற்ற வேதாகம ஒலிபெயர்ப்பு மரபுக்கு ஏற்ப வழங்கப்பட்டுள்ளன.
- source_word: אֲרוֹן הָאֱלֹהִים
  choice: கடவுளின் உடன்படிக்கைப் பெட்டி
  rationale: ‘கடவுளின் பெட்டி’ என்பதன் வரலாற்று-வழிபாட்டு பொருளைச் சாதாரண வாசகர் உடனே உணர, தமிழில் நிலைபெற்ற ‘உடன்படிக்கைப் பெட்டி’ பயன்படுத்தப்படுகிறது.
- source_word: נִלְקָחָה
  choice: கைப்பற்றப்பட்டது
  rationale: செயப்பாட்டு வடிவத்தையும் போர்ச் சூழலில் எதிரியால் எடுத்துக்கொள்ளப்பட்டதையும் இயல்பான தமிழில் தெரிவிக்கிறது.
