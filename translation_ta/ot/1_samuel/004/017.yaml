  register: நவீன நிலையான தமிழில், சாதாரண வாசகருக்குப் புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டது. அறிக்கையின் தொடர்ச்சியான பேரழிவு ‘-உம்’ இணைப்புகளால் தக்கவைக்கப்பட்டது; தேவையற்ற சமயப்பிரிவு சார்ந்த சொற்கள் தவிர்க்கப்பட்டன.
