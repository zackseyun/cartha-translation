- from: அந்தச் செய்தியைக் கொண்டுவந்தவன் மறுமொழியாக, “இஸ்ரவேலர் பெலிஸ்தியருக்கு முன்பாகத் தப்பியோடிவிட்டார்கள்; மக்களிடையே பெரும் படுகொலையும் ஏற்பட்டது[a]. உன் மகன்கள் இருவராகிய ஓப்னியும் பினெகாசும் இறந்துவிட்டார்கள்; கடவுளின் உடன்படிக்கைப் பெட்டியும் கைப்பற்றப்பட்டது[b]” என்றான்.
  to: அந்தச் செய்தியைக் கொண்டுவந்தவன் மறுமொழியாக, “இஸ்ரவேலர் பெலிஸ்தியருக்கு முன்பாக ஓடிப்போய்விட்டார்கள்; மக்களிடையே பெரும் படுகொலை நிகழ்ந்தது[a]. உன் இரு மகன்களும்—ஓப்னியும் பினெகாஸும்—இறந்துவிட்டார்கள்; கடவுளின் பெட்டி கைப்பற்றப்பட்டது[b]” என்றான்.
  rationale: The revision removes the unsupported addition ‘உடன்படிக்கை’ and preserves the Hebrew’s straightforward ‘ark/chest of God.’ It retains the military-contextual rendering ‘கைப்பற்றப்பட்டது’ for the passive ‘was taken,’ while supplying a direct alternative in the footnote. The name spelling is normalized to the common Tamil biblical form “பினெகாஸ்,” and the sentence is smoothed without changing its meaning or emphases.
