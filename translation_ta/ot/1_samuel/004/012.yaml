  text: וַ/יָּ֤רָץ אִישׁ בִּנְיָמִן֙ מֵ/הַ/מַּ֣עֲרָכָ֔ה וַ/יָּבֹ֥א שִׁלֹ֖ה בַּ/יּ֣וֹם הַ/ה֑וּא וּ/מַדָּ֣י/ו קְרֻעִ֔ים וַ/אֲדָמָ֖ה עַל רֹאשֽׁ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/004/012.yaml
  text: Then a man of Benjamin ran from the battle line and came to Shiloh that same day[b][a], with his clothes torn and dirt on his head.
translation:
  language: ta
  text: அப்போது பென்யமீன் கோத்திரத்தைச் சேர்ந்த ஒருவன் போர்வரிசையிலிருந்து[a] ஓடி, அதே நாளில் சீலோவுக்கு வந்தான். அவனுடைய உடைகள் கிழிந்திருந்தன; அவன் தலையில் மண் இருந்தது.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘போரிலிருந்து’ அல்லது ‘படையணிகளிலிருந்து’ என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் குறிப்பாகப் போருக்காக அணிவகுக்கப்பட்ட வரிசையை அல்லது மோதல் வரியைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: உடைகளைக் கிழித்துக்கொள்வதும் தலையில் மண்ணைப் போட்டுக்கொள்வதும் துக்கம், கடுந்துயரம் அல்லது பேரழிவைக் காட்டும் அக்கால வழக்கமான அடையாளங்கள்.
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּרָץ
  choice: ஓடி
  rationale: רוּץ என்ற வினை விரைவாக ஓடுவதைக் குறிக்கிறது. அவன் தப்பியோடியதாக மூலச்சொல் கூறாததால், நோக்கத்தைச் சேர்க்காமல் ‘ஓடி’ என்று மொழிபெயர்க்கப்பட்டது.
- source_word: אִישׁ בִּנְיָמִן
  choice: பென்யமீன் கோத்திரத்தைச் சேர்ந்த ஒருவன்
  rationale: இது அந்த மனிதனின் கோத்திர அடையாளத்தைக் குறிக்கிறது. ‘பென்யமீனியன்’ என்பதைவிட இச்சொற்றொடர் இன்றைய பொதுவாசகருக்கு இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: מֵהַמַּעֲרָכָה
  choice: போர்வரிசையிலிருந்து
  rationale: מַעֲרָכָה என்பது பொதுவாகப் போரை மட்டும் அல்லாமல், போருக்காக அணிவகுக்கப்பட்ட வரிசை அல்லது மோதல் வரியைக் குறிக்கிறது. ‘போர்வரிசை’ அந்த இராணுவப் பொருளைச் சுருக்கமாகத் தக்கவைக்கிறது.
- source_word: וַיָּבֹא שִׁלֹה
  choice: சீலோவுக்கு வந்தான்
  rationale: בוא என்பது ஓர் இடத்தை நோக்கி வந்து சேர்வதைக் குறிக்கும் பொதுவான இயக்க வினை; தமிழ்க் கதைநடையில் ‘வந்தான்’ இயல்பான இணைச்சொல்.
- source_word: בַּיּוֹם הַהוּא
  choice: அதே நாளில்
  rationale: சொல்லுக்குச் சொல் ‘அந்த நாளில்’ என்றாலும், போர்வரிசையிலிருந்து புறப்பட்ட நாளிலேயே வந்தான் என்ற காலத் தொடர்ச்சியை ‘அதே நாளில்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וּמַדָּיו
  choice: அவனுடைய உடைகள்
  rationale: מַדִּים இங்கு அணிந்திருந்த ஆடைகளைக் குறிக்கும் பன்மைச்சொல். ‘உடைகள்’ நவீனத் தமிழில் தெளிவானதும் மிகக் குறுகிய குறிப்பிட்ட ஆடை வகையைச் சுட்டாததும் ஆகும்.
- source_word: קְרֻעִים
  choice: கிழிந்திருந்தன
  rationale: קרע என்ற வேரின் செயல்பாட்டு விளைவாக ஆடைகள் கிழிக்கப்பட்ட நிலையில் இருந்ததை இச்செயப்பாட்டு வடிவம் காட்டுகிறது; ‘கிழிந்திருந்தன’ அந்த நிலையைத் துல்லியமாகத் தருகிறது.
- source_word: וַאֲדָמָה עַל רֹאשׁוֹ
  choice: அவன் தலையில் மண் இருந்தது
  rationale: אֲדָמָה என்பது நிலம் அல்லது மண்ணைக் குறிக்கிறது. குறிப்பாக ‘தூசி’ என்று மூலச்சொல்லைச் சுருக்காமல், துக்க அடையாளமான செயலை ‘மண்’ என்ற பொதுவான இயற்கைத் தமிழ்ச்சொல் வெளிப்படுத்துகிறது.
