base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/004/008.yaml
  text: Woe to us! Who can deliver us from the hand of these mighty gods? These are the gods who struck Egypt with every plague in the wilderness[a][b].
translation:
  language: ta
  text: “ஐயோ, நமக்குக் கேடு! வல்லமையுள்ள இந்தத் தெய்வங்களின் கையிலிருந்து நம்மை விடுவிப்பவர் யார்? எகிப்தை ஒவ்வொரு வாதையாலும் வனாந்தரத்தில் தாக்கிய தெய்வங்கள் இவர்கள்தாம்.[a][b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “வல்லமையுள்ள இந்தத் தேவன்/தெய்வங்கள்.” எனினும், பெலிஸ்தியர் இங்கே பன்மை வடிவங்களில் பேசுவது, இஸ்ரவேலின் தேவனைப் பற்றிய அவர்களது சொந்தப் புரிதலைப் பிரதிபலிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில், “வனாந்தரத்தில்.” எகிப்தின்மீது வந்த வாதைகள் இஸ்ரவேலரின் வனாந்தரப் பயணத்துக்கு முன்பு நிகழ்ந்ததால், இச்சொற்றொடர் இச்சூழலில் விளக்குவதற்குக் கடினமானது. மொழிபெயர்ப்பு மசோரா உரையில் உள்ளபடியே தரப்பட்டுள்ளது.
    reason: textual_variant
lexical_decisions:
- source_word: א֣וֹי לָ֔נוּ
  choice: ஐயோ, நமக்குக் கேடு!
  rationale: துயரத்தையும் வரவிருக்கும் அழிவைப் பற்றிய அச்சத்தையும் வெளிப்படுத்தும் எபிரெய இடைச்சொல் தொடரின் வலிமையை இயல்பான நவீனத் தமிழில் காக்கிறது.
- source_word: מִ֣י יַצִּילֵ֔נוּ
  choice: நம்மை விடுவிப்பவர் யார்?
  rationale: נצל என்பதன் மீட்பது அல்லது விடுவிப்பது என்ற பொருளையும், நம்பிக்கையிழந்த வினாவின் சொல்லாட்சியையும் காக்கிறது.
- source_word: מִיַּד
  choice: கையிலிருந்து
  rationale: அதிகாரம் அல்லது கட்டுப்பாட்டைக் குறிக்கும் எபிரெய உருவகத்தைத் தமிழிலும் தெளிவாகப் பாதுகாக்கிறது.
- source_word: הָאֱלֹהִים הָאַדִּירִים הָאֵלֶּה
  choice: வல்லமையுள்ள இந்தத் தெய்வங்கள்
  rationale: பன்மை பெயரடை, சுட்டுப்பெயர், சூழலில் பெலிஸ்தியரின் பன்மைத்தெய்வப் புரிதல் ஆகியவற்றை வெளிப்படையாகக் காக்கிறது.
- source_word: אֵלֶּה הֵם הָאֱלֹהִים
  choice: தெய்வங்கள் இவர்கள்தாம்
  rationale: எபிரெய அடையாள வாக்கியத்தின் வலியுறுத்தலை இயல்பான தமிழ் அமைப்பில் தருகிறது.
- source_word: הַמַּכִּים אֶת מִצְרַיִם
  choice: எகிப்தை ... தாக்கிய
  rationale: கடந்தகாலத்தில் அறியப்பட்ட செயலைக் குறிக்கும் பங்கேற்புவினையை உறவுவாக்கியப் பொருளுடன் மொழிபெயர்க்கிறது; מַכִּים என்ற பன்மை வடிவத்திற்கும் தெய்வங்கள் என்ற எழுவாய்க்கும் ஒத்திசைவு உண்டு.
- source_word: בְּכָל מַכָּה
  choice: எல்லாவிதமான வாதைகளாலும்
  rationale: மַכָּה என்பதன் வாதை அல்லது தாக்குதல் என்ற பொருளையும் כָל தரும் முழுமையையும் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: בַּמִּדְבָּר
  choice: வனாந்தரத்தில்
  rationale: மசோரா உரையில் உள்ள இடக்குறிப்பை வரலாற்றுச் சிக்கல் காரணமாக மாற்றாமல் அப்படியே காக்கிறது.
theological_decisions:
- issue: பெலிஸ்தியரின் பேச்சில் אֱלֹהִים என்பதன் எண்ணிக்கை
  choice: தெய்வங்கள்
  alternative: தேவன் / இறைவன்
  rationale: இஸ்ரவேலின் தேவனையே குறிப்பிட்டாலும், இவ்வசனத்தில் பெயரடையும் பங்கேற்புவினையும் பன்மையில் உள்ளன; பெலிஸ்தியர் தங்கள் பன்மைத்தெய்வக் கண்ணோட்டத்தில் பேசுவதை மொழிபெயர்ப்பு இயல்பாக்காமல் பாதுகாக்கிறது.
- issue: בַּמִּדְבָּר என்ற வரலாற்றுச் சிக்கலுள்ள சொற்றொடர்
  choice: வனாந்தரத்தில்
  alternative: சொற்றொடரை விடுதல் அல்லது எகிப்தில் என ஒத்திசைத்தல்
  rationale: வாதைகள் எகிப்தில் நிகழ்ந்ததாக யாத்திராகம வரலாறு கூறினாலும், WLC மசோரா உரை இங்கே வனாந்தரத்தில் என வாசிக்கிறது. அந்தத் தளராத உரைச்சிக்கல் அடிக்குறிப்புடன் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான வேதாகம நடையைப் பயன்படுத்துகிறது. “ஐயோ, நமக்குக் கேடு” என்பது உணர்ச்சி வலிமையைத் தக்கவைக்கிறது; “கையிலிருந்து” மூல உருவகத்தைப் பாதுகாக்கிறது. பன்மைத் தெய்வக் குறிப்பும் வரலாற்றுச் சிக்கலுள்ள “வனாந்தரத்தில்” என்பதும் அமைதியாகச் சீராக்கப்படாமல் அடிக்குறிப்புகளுடன் வைக்கப்பட்டுள்ளன.
