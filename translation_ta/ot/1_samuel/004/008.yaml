  terminology: '''தெய்வங்கள்'' fittingly retains the plural forms in Philistine speech without imposing a theological harmonization. ''வாதை'' is a suitable biblical term for מַכָּה. Footnote a should state the actual singular/plural alternative rather than only the singular form.'
