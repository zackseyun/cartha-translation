base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/004/001.yaml
  text: And the word of Samuel came to all Israel[a]. Then Israel went out to meet the Philistines in battle, and they camped at Ebenezer[b], while the Philistines camped at Aphek.
translation:
  language: ta
  text: சாமுவேலின் வார்த்தை இஸ்ரவேலர் அனைவருக்கும் எட்டியது.[a] இஸ்ரவேலர் பெலிஸ்தியரைப் போரில் எதிர்கொள்ளப் புறப்பட்டார்கள்; அவர்கள் எபெனேசரில்[b] முகாமிட்டார்கள்; பெலிஸ்தியர் ஆப்பெக்கில் முகாமிட்டார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சாமுவேலைப் பற்றிய செய்தி இஸ்ரவேலர் அனைவருக்கும் எட்டியது.” எபிரெயச் சொற்றொடரைச் சாமுவேலின் வார்த்தை அல்லது செய்தி என்று புரிந்துகொள்ளலாம்; இச்சூழலில் அது அவருடைய தீர்க்கதரிசன வார்த்தையைக் குறிப்பதாகத் தெரிகிறது.
    reason: alternative_reading
  - marker: b
    text: “எபெனேசர்” என்பதற்கு “உதவியின் கல்” என்று பொருள். இங்கு அது ஓர் இடப்பெயர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי דְבַר שְׁמוּאֵל לְכָל יִשְׂרָאֵל
  choice: சாமுவேலின் வார்த்தை இஸ்ரவேலர் அனைவருக்கும் எட்டியது
  rationale: எபிரெயச் சொற்றொடரின் இயல்பான பொருளான சாமுவேலின் வார்த்தை அல்லது செய்தி முழு இஸ்ரவேலுக்கும் சென்றடைந்ததை நவீன தமிழில் தெரிவிக்கிறது; ‘வார்த்தை’ என்பதன் மூலம் தீர்க்கதரிசன உரையுடனான தொடர்பும் காக்கப்படுகிறது.
- source_word: וַיֵּצֵא יִשְׂרָאֵל
  choice: இஸ்ரவேலர் புறப்பட்டுச் சென்றார்கள்
  rationale: יצא என்பதன் பொதுவான இயக்கப் பொருளைக் காக்கிறது; அடுத்த சொற்றொடரே போர்ச் சூழலைத் தெளிவாக்குவதால் ‘படையெடுத்தார்கள்’ என மிகைப்படுத்தவில்லை.
- source_word: לִקְרַאת פְּלִשְׁתִּים לַמִּלְחָמָה
  choice: பெலிஸ்தியரைப் போரில் எதிர்கொள்ள
  rationale: לקראת என்பதிலுள்ள சந்திக்க அல்லது எதிர்கொள்ள என்ற பொருளையும், למלחמה என்பதிலுள்ள போர்நோக்கையும் இயல்பான தமிழில் ஒருங்கிணைக்கிறது.
- source_word: וַיַּחֲנוּ
  choice: முகாமிட்டார்கள்
  rationale: இராணுவப் பின்னணியில் தங்கிப் பாளயமிட்டதை நவீன, தெளிவான தமிழில் தருகிறது.
- source_word: עַל הָאֶבֶן הָעֵזֶר
  choice: எபெனேசரில்
  rationale: ‘உதவியின் கல்’ என்று பொருள்படும் கூறுகள் இங்கு இடப்பெயராகச் செயல்படுவதால் ஒலிபெயர்ப்பு பயன்படுத்தப்படுகிறது.
- source_word: בַאֲפֵק
  choice: ஆப்பெக்கில்
  rationale: இடப்பெயரை ஒலிபெயர்த்து, இருப்பிடத்தைக் காட்ட தமிழ் வேற்றுமை உருபு சேர்க்கப்பட்டுள்ளது.
theological_decisions:
- issue: דְבַר שְׁמוּאֵל என்பது சாமுவேலின் தீர்க்கதரிசன வார்த்தையையா அல்லது அவரைப் பற்றிய செய்தி/புகழையா குறிக்கிறது?
  choice: சாமுவேலின் வார்த்தை முழு இஸ்ரவேலுக்கும் எட்டியது
  alternative: சாமுவேலைப் பற்றிய செய்தி இஸ்ரவேல் முழுவதும் பரவியது
  rationale: முந்தைய அதிகாரத்தின் இறுதியில் ஆண்டவர் சாமுவேலின் வார்த்தையின் மூலம் தம்மை வெளிப்படுத்துவதும், அவர் தீர்க்கதரிசியாக அறியப்படுவதும் முதன்மை வாசிப்புக்கு ஆதரவளிக்கின்றன. எனினும் எபிரெயத் தொடரின் மாற்றுப் புரிதல் அடிக்குறிப்பில் காக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. இனப்பெயர்களுக்கு வழக்கமான தமிழ் வடிவங்களும், இடப்பெயர்களுக்கு தெளிவான ஒலிபெயர்ப்பும் பயன்படுத்தப்பட்டுள்ளன. ‘வார்த்தை’ என்ற சொல் இலக்கிய-தீர்க்கதரிசனத் தொடர்பைக் காக்கிறது.
