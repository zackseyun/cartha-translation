  yaml_path: translation/ot/1_samuel/004/011.yaml
  text: And the ark of God was captured, and the two sons of Eli died, Hophni and Phinehas.
translation:
  language: ta
  text: தேவனுடைய பேழை கைப்பற்றப்பட்டது; ஏலியின் இரண்டு மகன்களான ஒப்னியும் பினெகாஸும் இறந்தார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲרוֹן אֱלֹהִים
  choice: தேவனுடைய உடன்படிக்கைப் பெட்டி
  rationale: எபிரெயச் சொற்றொடர் நேரடியாக ‘தேவனுடைய பெட்டி’ என்று பொருள்படும். இச்சூழலில் அது உடன்படிக்கைப் பெட்டியைக் குறிப்பது தெளிவாக இருப்பதால், நவீன தமிழ் வாசகர்களுக்கு இயல்பாகவும் துல்லியமாகவும் இருக்க ‘உடன்படிக்கைப் பெட்டி’ என வழங்கப்பட்டது.
- source_word: נִלְקָח
  choice: கைப்பற்றப்பட்டது
  rationale: לקח என்பதன் நிஃபால் வடிவம் இங்கு செயப்பாட்டு வினையாக உள்ளது; போர்ச் சூழலில் பகைவரால் பிடித்துக்கொள்ளப்பட்டதைக் குறிக்கும் ‘கைப்பற்றப்பட்டது’ பொருத்தமானது.
- source_word: וּשְׁנֵי בְנֵי עֵלִי
  choice: ஏலியின் இரண்டு மகன்களான
  rationale: குறிப்பிட்ட இரு மகன்களையே சுட்டுகிறது. தொடர்ந்து வரும் பெயர்களுடன் தமிழில் இயல்பாக இணைக்க ‘மகன்களான’ பயன்படுத்தப்பட்டது.
- source_word: מֵתוּ
  choice: இறந்தார்கள்
  rationale: מות என்பதன் கால் நிறைவுவினை மரணத்தை நேரடியாக அறிவிக்கிறது. மனிதர்களைக் குறிக்கும் மரியாதையான நவீன தமிழில் ‘இறந்தார்கள்’ இயல்பானது.
- source_word: חָפְנִי וּפִינְחָס
  choice: ஒப்னியும் பினெகாசும்
  rationale: தனிப்பெயர்கள் தமிழ் வேதாகமப் பயன்பாட்டில் பரவலாக அறியப்படும் வடிவங்களில் ஒலிபெயர்க்கப்பட்டன; எபிரெய உரையின் விளக்கநிலை அமைப்பும் தக்கவைக்கப்பட்டது.
theological_decisions:
- issue: אֲרוֹן אֱלֹהִים என்பதிலுள்ள אֲרוֹן-ஐ வெளிப்படையாக ‘உடன்படிக்கைப் பெட்டி’ என வழங்குதல்
  choice: தேவனுடைய உடன்படிக்கைப் பெட்டி
  alternative: தேவனுடைய பெட்டி
  rationale: ‘உடன்படிக்கை’ என்ற சொல் இவ்வசனத்தில் வெளிப்படையாக இல்லாவிட்டாலும், Samuel நூலின் உடனடி சூழலில் אֲרוֹן என்பது யெகோவாவின் உடன்படிக்கைப் பெட்டியையே குறிக்கிறது. ‘பெட்டி’ மட்டும் நவீன தமிழில் பொருளைத் தெளிவுபடுத்தாது; ஆகவே அடையாளத்தை விளக்கும் நிலையான பெயர் பயன்படுத்தப்பட்டது, ஆனால் ‘தேவனுடைய’ என்பதும் பாதுகாக்கப்பட்டது.
translation_notes:
  register: நவீன நிலையான தமிழில் எளிமையான, கண்ணியமான வரலாற்று நடையில் மொழிபெயர்க்கப்பட்டது. எபிரெய வாக்கியத்தின் இரு துயரச் செய்திகளும் அரைப்புள்ளியால் சமநிலையுடன் இணைக்கப்பட்டுள்ளன; தேவையற்ற விளக்கமோ போரில் அவர்கள் கொல்லப்பட்டார்கள் என்ற வெளிப்படையற்ற தகவலோ சேர்க்கப்படவில்லை.
