- from: தேவனுடைய உடன்படிக்கைப் பெட்டி கைப்பற்றப்பட்டது; ஏலியின் இரண்டு மகன்களான ஒப்னியும் பினெகாசும் இறந்தார்கள்.
  to: தேவனுடைய பேழை கைப்பற்றப்பட்டது; ஏலியின் இரண்டு மகன்களான ஒப்னியும் பினெகாஸும் இறந்தார்கள்.
  rationale: The revision removes the unsupported explicit qualifier “உடன்படிக்கை,” rendering אֲרוֹן אֱלֹהִים directly as “தேவனுடைய பேழை.” It retains the passive military sense of capture, the definite pair of Eli’s sons, and the plain report that they died, without adding circumstances of their deaths.
