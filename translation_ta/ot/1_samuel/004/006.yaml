source:
  edition: WLC
  text: וַ/יִּשְׁמְע֤וּ פְלִשְׁתִּים֙ אֶת ק֣וֹל הַ/תְּרוּעָ֔ה וַ/יֹּ֣אמְר֔וּ מֶ֠ה ק֣וֹל הַ/תְּרוּעָ֧ה הַ/גְּדוֹלָ֛ה הַ/זֹּ֖את בְּ/מַחֲנֵ֣ה הָ/עִבְרִ֑ים וַ/יֵּ֣דְע֔וּ כִּ֚י אֲר֣וֹן יְהוָ֔ה בָּ֖א אֶל הַֽ/מַּחֲנֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/004/006.yaml
  text: When the Philistines heard the sound of the shouting[a], they said[b], “What is this great sound of shouting in the camp of the Hebrews?” And they knew that the ark of Yahweh had come into the camp.
translation:
  language: ta
  text: பெலிஸ்தியர்கள் ஆரவாரத்தின் ஒலியைக் கேட்டபோது, “எபிரெயர்களின் முகாமில் கேட்கும் இந்தப் பெரிய ஆரவார ஒலி என்ன?” என்று கேட்டார்கள். யாவேயின் பேழை முகாமுக்குள் வந்திருப்பதை அவர்கள் அறிந்துகொண்டார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קוֹל הַתְּרוּעָה
  choice: ஆரவாரத்தின் ஒலி
  rationale: קוֹל இங்கு கேட்கப்பட்ட ஒலியையும், תְּרוּעָה உரத்த கூச்சல் அல்லது ஆரவாரத்தையும் குறிக்கிறது. முந்தைய வசனத்தில் பெட்டி வந்தபோது எழுந்த மகிழ்ச்சிக் கூச்சலுடன் இச்சொல் தொடர்புடையதால், போர் முழக்கம் என்று மிகையாகக் குறிப்பாக்காமல் மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: מֶה קוֹל ... הַגְּדוֹלָה הַזֹּאת
  choice: இந்தப் பேராரவாரத்தின் பொருள் என்ன?
  rationale: எபிரெயக் கேள்வி அந்தப் பெரும் ஒலியின் தன்மை அல்லது காரணத்தை விசாரிக்கிறது. இயல்பான நவீன தமிழில் அதன் நோக்கத்தைத் தெளிவாகக் காட்டும் வகையில் அமைக்கப்பட்டுள்ளது.
- source_word: מַחֲנֵה הָעִבְרִים
  choice: எபிரெயர்களின் முகாம்
  rationale: பெலிஸ்தியர்களின் பார்வையில் பயன்படுத்தப்பட்ட הָעִבְרִים என்ற இனப்பெயர், ‘இஸ்ரவேலர்கள்’ என்று பொதுமைப்படுத்தப்படாமல் பாதுகாக்கப்படுகிறது.
- source_word: וַיֵּדְעוּ
  choice: அறிந்துகொண்டார்கள்
  rationale: புதிய தகவலை அப்போது தெரிந்துகொண்டார்கள் என்ற நிகழ்வுநிலைப் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: אֲרוֹן יְהוָה
  choice: யாவேயின் உடன்படிக்கைப் பெட்டி
  rationale: אֲרוֹן என்பதற்கு வெறும் ‘பெட்டி’ என்பதைவிட அதன் வேதாகமச் சூழலைத் தெளிவாக்க ‘உடன்படிக்கைப் பெட்டி’ பயன்படுத்தப்பட்டுள்ளது; יְהוָה தனிப்பட்ட இறைப்பெயராக ‘யாவே’ என்று ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: בָּא אֶל הַמַּחֲנֶה
  choice: முகாமுக்குள் வந்திருப்பதை
  rationale: பெலிஸ்தியர்கள் அறிந்துகொண்ட நேரத்துக்கு முன்னரே வருகை நிகழ்ந்திருந்ததைத் தமிழின் நிறைவுநிலை வினைவடிவம் இயல்பாகக் காட்டுகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழியாக்கம்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் உள்ள நான்கு எழுத்து இறைப்பெயரை ஒரு பட்டப்பெயராக மாற்றாமல், வழக்கமான தமிழ் ஒலிபெயர்ப்பில் பாதுகாக்கிறது.
- issue: אֲרוֹן என்பதன் அடையாளம்
  choice: உடன்படிக்கைப் பெட்டி
  alternative: பெட்டி
  rationale: இச்சூழலில் குறிப்பிடப்படுவது யாவேயின் புனிதப் பெட்டி என்பதைத் தமிழ் வாசகருக்குத் தெளிவாக்குகிறது; எனினும் ‘உடன்படிக்கை’ என்ற சொல் இவ்வசனத்தின் எபிரெய உரையில் வெளிப்படையாக இல்லை என்பதால் அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
translation_notes:
  register: நவீன தரத் தமிழில், கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘எபிரெயர்கள்’ என்ற பேச்சாளர்-பார்வைச் சொல் பாதுகாக்கப்பட்டுள்ளது; ‘ஆரவாரம்’ என்பது மகிழ்ச்சிக் கூச்சல், உரத்த முழக்கம், அல்லது போர்க்கூச்சல் ஆகிய சாத்தியங்களை அளவுக்கு மீறி முடிவுசெய்யாமல் வைத்திருக்கிறது.
