base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/004/018.yaml
  text: And it happened[a], when he mentioned the ark of God, that Eli fell backward from the seat by the side of the gate, and his neck was broken and he died, for the man was old and heavy[b]. And he had judged Israel forty years.
translation:
  language: ta
  text: அவன் கடவுளின் பேழையைப் பற்றிக் குறிப்பிட்டபோது, ஏலி வாசலின் பக்கத்தில் இருந்த இருக்கையிலிருந்து பின்னோக்கி விழுந்தார். அவருடைய கழுத்து முறிந்தது; அவர் இறந்தார்; ஏனெனில் அவர் வயதானவராகவும் உடல் கனமானவராகவும் இருந்தார்[a]. அவர் இஸ்ரவேலை நாற்பது ஆண்டுகள் நியாயந்தீர்த்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: நேர்ச்சொல்லாக, “கனமானவர்.” வயதுடன் சேர்ந்து ஏலியின் உடல் எடையும் இந்த விழுதல் உயிர்க்கொல்லியாக அமைந்ததைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּהַזְכִּירוֹ
  choice: அவன் ... பற்றிக் குறிப்பிட்டபோது
  rationale: זכר என்பதன் ஹிஃபில் வடிவம் இங்கு ‘குறிப்பிடுதல்’ என்று பொருள்படுகிறது; כְּ காலத் தொடர்பைத் தருவதால் ‘குறிப்பிட்டபோது’ இயல்பான மொழிபெயர்ப்பு.
- source_word: אֲרוֹן הָאֱלֹהִים
  choice: கடவுளின் உடன்படிக்கைப் பெட்டி
  rationale: אֲרוֹן என்பது பெட்டியைக் குறிக்கிறது; தமிழில் வேதாகமச் சூழலைத் தெளிவுபடுத்த ‘உடன்படிக்கைப் பெட்டி’ என்ற நிலைபெற்ற, புரிந்துகொள்ளக்கூடிய சொற்றொடர் பயன்படுத்தப்பட்டது.
- source_word: וַיִּפֹּל ... אֲחֹרַנִּית
  choice: பின்னோக்கி விழுந்தார்
  rationale: אֲחֹרַנִּית என்ற வினையடை ‘பின்னோக்கி’ என நேரடியாகப் பொருள்படும்.
- source_word: הַכִּסֵּא
  choice: இருக்கை
  rationale: அரச அரியணைச் சூழல் இல்லாததால், நடுநிலையான ‘இருக்கை’ பொருத்தமானது.
- source_word: בְּעַד יַד הַשַּׁעַר
  choice: வாசலின் பக்கத்தில்
  rationale: ‘வாசலின் கை/பக்கம் அருகே’ என்ற எபிரெய மரபுத்தொடரின் இடப்பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: וַתִּשָּׁבֵר מַפְרַקְתּוֹ
  choice: அவருடைய கழுத்து முறிந்தது
  rationale: מַפְרֶקֶת கழுத்து அல்லது பிடரிப் பகுதியைக் குறிக்கிறது; நிகழ்வின் முடிவைத் தெளிவாகவும் மிகையான உடற்கூறு விளக்கமின்றியும் தருகிறது.
- source_word: כִּי זָקֵן הָאִישׁ וְכָבֵד
  choice: ஏனெனில் அவர் வயதானவராகவும் உடல் கனமானவராகவும் இருந்தார்
  rationale: כָבֵד என்பதன் அடிப்படைப் பொருளான ‘கனமான’ என்பதைப் பாதுகாத்து, தமிழில் இது உடல் எடையைக் குறிக்கிறது என்பதை ‘உடல்’ தெளிவுபடுத்துகிறது; ‘பருமனானவர்’ என்ற விளக்க மொழிபெயர்ப்பைத் தவிர்க்கிறது.
- source_word: שָׁפַט אֶת יִשְׂרָאֵל
  choice: இஸ்ரவேலை ... நியாயந்தீர்த்தார்
  rationale: שׁפט என்பதன் நீதிபதி/ஆட்சித் தலைமைப் பணியை நெருக்கமாகப் பாதுகாக்கிறது; நிறைவுற்ற பணிக்காலத்தை அடுத்துள்ள கால அளவு தெளிவுபடுத்துகிறது.
- source_word: אַרְבָּעִים שָׁנָה
  choice: நாற்பது ஆண்டுகள்
  rationale: எண்ணும் கால அளவும் நேரடியாக மொழிபெயர்க்கப்பட்டன.
theological_decisions:
- issue: אֱלֹהִים என்பதன் எண்ணும் குறிப்பும்
  choice: கடவுள்
  alternative: தெய்வங்கள்
  rationale: இக்கதையாடலில் இஸ்ரவேலின் கடவுளே குறிக்கப்படுவதால் ஒருமை வாசிப்பே சூழலுக்குப் பொருந்துகிறது.
- issue: אֲרוֹן என்பதற்கான தமிழ் பெயர்
  choice: உடன்படிக்கைப் பெட்டி
  alternative: கடவுளின் பெட்டி / பேழை
  rationale: மூலத்தில் ‘உடன்படிக்கை’ என்ற சொல் வெளிப்படையாக இல்லாவிட்டாலும், தமிழில் இப்புனிதப் பெட்டிக்கான வழக்கமான அடையாளப் பெயர் இது; சாதாரண பெட்டி எனத் தவறாகப் புரிந்துகொள்ளாமல் இருக்க உதவுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், மரியாதை வினைமுற்றுகளுடன் கண்ணியமான கதையாடல் நடை பயன்படுத்தப்பட்டது. வாசல் அருகிலுள்ள இருப்பிடத்தையும் பின்னோக்கி விழுந்ததையும் தெளிவாக வைத்துள்ளோம். மூலத்தின் ‘கனமானவர்’ என்ற சொல்லின் சாத்தியமான காரண விளக்கத்தை அடிக்குறிப்பில் பாதுகாத்துள்ளோம்.
