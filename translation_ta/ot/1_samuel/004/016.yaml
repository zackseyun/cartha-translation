source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר הָ/אִ֜ישׁ אֶל עֵלִ֗י אָֽנֹכִי֙ הַ/בָּ֣א מִן הַ/מַּעֲרָכָ֔ה וַ/אֲנִ֕י מִן הַ/מַּעֲרָכָ֖ה נַ֣סְתִּי הַ/יּ֑וֹם וַ/יֹּ֛אמֶר מֶֽה הָיָ֥ה הַ/דָּבָ֖ר בְּנִֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/004/016.yaml
  text: The man said to Eli[a], “I am the one who came from the battle line, and I fled from the battle line today.” And he said, “What happened, my son?”
translation:
  language: ta
  text: அந்த மனிதன் ஏலியிடம், “போரணியிலிருந்து[a] வந்தவன் நான்தான்; இன்று போரணியிலிருந்து தப்பியோடினேன்” என்றான். அதற்கு ஏலி, “என்ன நடந்தது, என் மகனே?” என்று கேட்டார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “போரிலிருந்து,” “படைவரிசையிலிருந்து,” அல்லது “முகாமிலிருந்து” என்றும் மொழிபெயர்க்கலாம்; எபிரெயச் சொல் ஒழுங்குபடுத்தப்பட்ட போரணி அல்லது படை அமைப்பைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאִישׁ
  choice: அந்த மனிதன்
  rationale: இது ‘மனிதன்’ என்பதற்கான பொதுவான எபிரெயச் சொல். சூழலில் அவர் செய்தி கொண்டுவருபவராக இருந்தாலும், மூலத்தில் ‘தூதன்’ என்பதற்கான சிறப்புச் சொல் பயன்படுத்தப்படவில்லை.
- source_word: הַבָּא
  choice: வந்தவன்
  rationale: 'சுட்டுப்பெயருடன் வரும் இப்பெயரெச்சம் பேசுபவரை அடையாளப்படுத்துகிறது: ‘வந்தவன் நான்தான்.’ அவர் ஏற்கெனவே ஏலியிடம் வந்துவிட்டதால், நிறைவுற்ற செயலைத் தெரிவிக்கும் இவ்வடிவம் தமிழில் இயல்பாக உள்ளது.'
- source_word: מִן הַמַּעֲרָכָה
  choice: போரணியிலிருந்து
  rationale: מַעֲרָכָה என்பது பொதுவாக ஒழுங்குபடுத்தப்பட்ட படைவரிசை அல்லது போர் அணியைக் குறிக்கிறது. ‘போரணியிலிருந்து’ என்பது வெறும் ‘போரிலிருந்து’ என்பதைவிட அந்தப் படை அமைப்பு நுணுக்கத்தைப் பாதுகாக்கிறது.
- source_word: נַסְתִּי
  choice: தப்பியோடினேன்
  rationale: נוּס என்ற வினை ஓடிப்போதல் அல்லது தப்பியோடுதலைக் குறிக்கிறது. ‘தப்பியோடினேன்’ என்பது இச்சூழலில் நேரடியும் இயல்புமான தமிழ் நடை.
- source_word: הַיּוֹם
  choice: இன்று
  rationale: தப்பியோடிய நேரத்தைச் சுட்டும் சொல்லை நவீனத் தமிழில் இயல்பாகத் தருகிறது.
- source_word: מֶה הָיָה הַדָּבָר
  choice: என்ன நடந்தது
  rationale: சொல்லுக்குச் சொல் ‘காரியம் என்னவாயிற்று?’ என்ற பொருள் இருந்தாலும், நிகழ்ந்தவற்றின் செய்தியை ஏலி கேட்கும் இச்சூழலில் ‘என்ன நடந்தது?’ என்பது இயல்பாக அதன் வலிமையை வெளிப்படுத்துகிறது.
- source_word: בְּנִי
  choice: என் மகனே
  rationale: முதல் நபர் உடைமை விகுதி மூலத்தில் வெளிப்படையாக உள்ளது. வயதில் இளையவரிடம் ஏலி அன்புடனோ மரியாதையுடனோ பேசும் அழைப்புமுறையை இது பாதுகாக்கிறது.
