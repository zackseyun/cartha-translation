  source_fidelity: மூல எபிரெயத்தின் வாக்கிய அமைப்பும் முக்கியச் சொற்களும் நன்றாகப் பாதுகாக்கப்பட்டுள்ளன. הָאִישׁ என்பதற்கு ‘அந்த மனிதன்,’ மַעֲרָכָה என்பதற்கு படை அமைப்பின் நுணுக்கத்தைச் சுமக்கும் ‘போரணி,’ נַסְתִּי என்பதற்கு ‘தப்பியோடினேன்,’ மற்றும் בְּנִי என்பதற்கு ‘என் மகனே’ ஆகியவை சூழலுக்கும் மூலத்திற்கும் பொருந்துகின்றன. ‘என்ன நடந்தது?’ என்பது מֶה הָיָה הַדָּבָר என்பதன் இயல்பான, பொருள்தவறாத வடிவம்.
  naturalness: நடை நவீனத் தரத் தமிழில் தெளிவாகவும் கண்ணியமாகவும் உள்ளது. ‘வந்தவன் நான்தான்’ மற்றும் ‘என் மகனே’ ஆகியவை உரையாடலுக்கு இயல்பானவை. ‘அதற்கு ஏலி’ என்பது இணைப்பாகச் சீராக அமைகிறது.
