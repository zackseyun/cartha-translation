    issue: The causal suffix in “நிலைகுத்தியிருந்ததால்” adds an explicit causal linkage.
    rationale: 'The source has coordinated clauses: Eli''s eyes were fixed/set, and he could not see. Although the relationship is readily inferred, the Hebrew does not use a causal particle. Recasting as coordinated clauses preserves the ambiguity and sequence.'
