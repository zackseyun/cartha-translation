    text: அல்லது, “நிலைத்துப்போயிருந்தன” அல்லது “விறைத்துப்போயிருந்தன”; எபிரேயத்தில் அவரது கண்களின் நிலை பார்வையின்மையைக் குறிக்கும் வகையில் விவரிக்கப்படுகிறது.
    reason: lexical_alternative
