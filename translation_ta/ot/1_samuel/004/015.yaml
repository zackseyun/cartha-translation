  choice: தொண்ணூற்றெட்டு வயது
  rationale: ‘X ஆண்டுகளின் மகன்’ என்ற எபிரேய வயதுக் கூறுமுறையை நவீனத் தமிழில் இயல்பாக ‘X வயது’ என்று வழங்குகிறது.
- source_word: וְעֵינָיו
  choice: அவருடைய கண்கள்
  rationale: பன்மை பெயர்ச்சொல்லையும் மூன்றாம் நபர் ஆண்பால் ஒருமை உடைமைப் பின்னொட்டையும் நேரடியாக வெளிப்படுத்துகிறது.
- source_word: קָמָה
  choice: நிலைகுத்தியிருந்ததால்
  rationale: קום என்பதன் இச்சூழல் வடிவம் கண்கள் நிலைத்துப்போன அல்லது விறைத்துப்போன நிலையைக் குறிக்கிறது; ‘நிலைகுத்தியிருந்த’ என்பது அந்தத் திடமான உருவகத்தைத் தக்கவைத்து, அடுத்த கூற்றுடன் இயல்பான காரணத் தொடர்பை உருவாக்குகிறது.
- source_word: וְלֹא יָכֹל לִרְאוֹת
  choice: அவரால் பார்க்க முடியவில்லை
  rationale: பார்க்க இயலாத நிலையை இயல்பான நவீனத் தமிழில் தெளிவாகக் கூறுகிறது.
- source_word: וְ
  choice: தனி மொழிபெயர்ப்பு இல்லை
  rationale: தொடக்க waw இங்கு கதைத் தொடர்ச்சியைச் சுட்டுகிறது; தமிழில் செயற்கையான ‘மேலும்/இப்போது’ என்பதைக் கூட்டாமல் வாக்கியத் தொடர்ச்சியால் அதை உணர்த்துவது இயல்பு.
