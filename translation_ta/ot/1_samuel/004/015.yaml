  text: Eli was ninety-eight years old[a], and his eyes were fixed so that he could not see.
translation:
  language: ta
  text: ஏலிக்கு தொண்ணூற்றெட்டு வயது; அவருடைய கண்கள் நிலைகுத்தியிருந்தன[a]; அவரால் பார்க்க முடியவில்லை.
  philosophy: optimal-equivalence
  footnotes:
