base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/004/004.yaml
  text: So the people sent to Shiloh[a], and they carried from there the ark of the covenant of Yahweh of hosts, who is enthroned above the cherubim. And the two sons of Eli, Hophni and Phinehas[b], were there with the ark of the covenant of God.
translation:
  language: ta
  text: ஆகவே மக்கள் சீலோவுக்கு ஆள்களை அனுப்பி, அங்கிருந்து கேரூபீன்கள் மேல் அரியணையில் வீற்றிருப்பவரான படைகளின் யாவேயின் உடன்படிக்கைப் பெட்டியைச் சுமந்துகொண்டு வந்தார்கள்.[a] ஏலியின் இரு மகன்களான ஒப்னியும் பினெகாசும் தேவனுடைய உடன்படிக்கைப் பெட்டியுடன் அங்கே இருந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘கேரூபீன்கள் மேல் அரியணையில் வீற்றிருப்பவரான’ என்பதை ‘கேரூபீன்களுக்கு இடையே அரியணையில் வீற்றிருப்பவரான’ என்றும் புரிந்துகொள்ளலாம்; எபிரெயத்தில் இடத்தொடர்பு வெளிப்படையாகச் சொல்லப்படவில்லை.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשְׁלַח הָעָם שִׁלֹה
  choice: மக்கள் சீலோவுக்கு ஆளனுப்பி
  rationale: வினையின் வெளிப்படாத செயப்படுபொருளைத் தமிழில் இயல்பாக உணர்த்த ‘ஆளனுப்பி’ பயன்படுத்தப்பட்டது; ஒருவரா பலரா என்பதை உரை குறிப்பிடாததால் எண்ணிக்கை கூறப்படவில்லை.
- source_word: וַיִּשְׂאוּ מִשָּׁם
  choice: அங்கிருந்து சுமந்துகொண்டு வந்தார்கள்
  rationale: נשא என்பதன் தூக்கிச் சுமத்தல் என்ற உடல்சார்ந்த பொருளையும், முகாமை நோக்கிக் கொண்டுவரப்பட்ட நிகழ்வையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: אֲרוֹן בְּרִית
  choice: உடன்படிக்கைப் பெட்டி
  rationale: ‘பெட்டி’ மற்றும் அதன் உடன்படிக்கைத் தொடர்பு ஆகிய இரண்டையும் தெளிவாகக் காக்கும் வழக்கமான தமிழ் இணைச்சொல்.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைத் திருப்பெயரை ‘கர்த்தர்’ போன்ற பட்டப்பெயரால் மாற்றாமல், எபிரெயத் தனிப்பெயரின் தமிழ் ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: צְבָאוֹת
  choice: படைகளின்
  rationale: தெய்வீகப் பட்டத்தில் வரும் பன்மைச் சொல்லின் படைத்திரள்/படைகள் என்ற விரிவான பொருளை நவீனத் தமிழில் தெளிவாக வழங்குகிறது.
- source_word: יֹשֵׁב הַכְּרֻבִים
  choice: கேருபீன்களுக்கு மேலாக அரியணையில் வீற்றிருக்கும்
  rationale: יֹשֵׁב என்பதிலுள்ள அரசருக்குரிய அரியணை உருவகத்தை வெளிப்படுத்துகிறது; கேருபீன்களோடு உள்ள இடத்தொடர்பின் வேறு சாத்தியத்தை அடிக்குறிப்பு காக்கிறது.
- source_word: עִם אֲרוֹן בְּרִית הָאֱלֹהִים
  choice: தேவனுடைய உடன்படிக்கைப் பெட்டியுடன்
  rationale: עִם என்பதன் பொதுவான உடனிருப்பு பொருளைக் காக்கிறது; குறிப்பாக ‘அருகில்’ என்று இடத்தை மிகுதியாக நிர்ணயிக்கவில்லை.
- source_word: חָפְנִי וּפִינְחָס
  choice: ஓப்னியும் பினெகாசும்
  rationale: எபிரெயத் தனிப்பெயர்களைத் தமிழில் வாசிக்கத்தக்க வகையில் ஒலிபெயர்க்கிறது.
theological_decisions:
- issue: יְהוָה צְבָאוֹת என்ற இறைப் பட்டப்பெயர்
  choice: படைகளின் யாவே
  alternative: படைத்திரள்களின் யாவே / சேனைகளின் யாவே
  rationale: יְהוָה என்பதைத் தனிப்பெயராகவே காத்து, צְבָאוֹת என்பதை ஒரு குறிப்பிட்ட மனிதப் படையாக மட்டுப்படுத்தாமல் பன்மையான படைகளைக் குறிக்கும் சொல்லாக மொழிபெயர்க்கிறது.
- issue: יֹשֵׁב הַכְּרֻבִים என்ற அரியணைச் சூத்திரம்
  choice: கேருபீன்களுக்கு மேலாக அரியணையில் வீற்றிருக்கும்
  alternative: கேருபீன்களுக்கு இடையே அரியணையில் வீற்றிருக்கும்
  rationale: இறைவனின் அரசாட்சியையும் பேழையோடு தொடர்புடைய பிரசன்னத்தையும் வெளிப்படுத்துகிறது; எபிரெயத்தில் இடத்தொடர்பு வெளிப்படையாகக் குறிக்கப்படாததால் மாற்று வாசிப்பு அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன, மரியாதைமிக்க பொதுத்தமிழ் பயன்படுத்தப்பட்டது. ‘அரியணையில் வீற்றிருக்கும்’ என்பது அரசாட்சிச் சாயலைக் காக்கிறது; ‘ஆளனுப்பி’ என்பது தமிழில் இயல்பாக இருந்தாலும் அனுப்பப்பட்டோரின் எண்ணிக்கையை நிர்ணயிக்காது. அடிக்குறி [a] இறைப் பட்டத்தின் பின்னரும் [b] கேருபீன் சொற்றொடரைக் கொண்ட வாக்கியத்தின் முடிவிலும் வைக்கப்பட்டுள்ளன.
