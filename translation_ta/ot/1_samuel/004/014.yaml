  text: וַ/יִּשְׁמַ֤ע עֵלִי֙ אֶת ק֣וֹל הַ/צְּעָקָ֔ה וַ/יֹּ֕אמֶר מֶ֛ה ק֥וֹל הֶ/הָמ֖וֹן הַ/זֶּ֑ה וְ/הָ/אִ֣ישׁ מִהַ֔ר וַ/יָּבֹ֖א וַ/יַּגֵּ֥ד לְ/עֵלִֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/004/014.yaml
  text: When Eli heard the sound of the outcry[a], he said, “What is this sound of the uproar?” And the man hurried and came and told Eli.
translation:
  language: ta
  text: ஏலி அந்தக் கூக்குரலின்[a] ஓசையைக் கேட்டபோது, “இந்த அமளியின் ஓசை என்ன?” என்று கேட்டார். அந்த மனிதன் விரைந்து வந்து ஏலியிடம் சொன்னான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அந்தக் கதறலின்.”
    reason: צְעָקָה என்பதற்கு உரத்த துயரக்குரல் அல்லது கதறல் என்ற நுண்பொருளும் உண்டு.
lexical_decisions:
- source_word: ק֣וֹל
  choice: ஓசை
  rationale: קוֹל என்பது குரல், சத்தம், ஓசை ஆகியவற்றைக் குறிக்கலாம். இங்கு கூக்குரலும் அமளியும் கேட்கப்படும் நிகழ்வுகளாக இருப்பதால், இயல்பான ‘ஓசை’ பொருத்தமானது.
- source_word: הַצְּעָקָה
  choice: அந்தக் கூக்குரல்
  rationale: צְעָקָה என்பது பெரும்பாலும் துயரம் அல்லது அதிர்ச்சியால் எழும் உரத்த கூக்குரலைக் குறிக்கிறது. நகரத்தின் பேரிடர்ச் செய்திக்கான எதிர்வினையை இது நன்கு வெளிப்படுத்துகிறது.
- source_word: מֶה
  choice: என்ன?
  rationale: இந்தக் கேள்விச்சொல் ஓசையின் தன்மை அல்லது காரணத்தை விசாரிக்கிறது. ‘இந்த அமளியின் ஓசை என்ன?’ என்பது எபிரெயக் கட்டமைப்புக்கு நெருக்கமாகவும் தமிழில் புரியத்தக்கதாகவும் உள்ளது.
- source_word: הֶהָמוֹן
  choice: அமளி
  rationale: הָמוֹן இங்கு மக்கள் எழுப்பும் இரைச்சலான பரபரப்பை அல்லது கலகலப்பைக் குறிக்கிறது. ‘அமளி’ அதன் பொதுவான, தீவிரமான இரைச்சலை இயல்பாகத் தருகிறது.
- source_word: וְהָאִישׁ
  choice: அந்த மனிதன்
  rationale: எபிரெயம் நேரடியாக ‘அந்த மனிதன்’ என்கிறது; முந்தைய வசனத்தில் வந்த பென்யமீனியனைச் சுட்டுகிறது. ‘தூதுவன்’ என மொழிபெயர்ப்பது தேவையற்ற விளக்கச் சேர்க்கையாகும்.
- source_word: מִהַר
  choice: விரைந்து
  rationale: இந்த வினை விரைவாகச் செயல்படுதல் அல்லது விரைதலைக் குறிக்கிறது. ‘விரைந்து’ என்பது நடப்பு உரைநடையில் தெளிவாகவும் கண்ணியமாகவும் உள்ளது.
- source_word: וַיַּגֵּד לְעֵלִי
  choice: ஏலியிடம் செய்தியைத் தெரிவித்தான்
  rationale: נגד என்பதன் ஹிஃபில் வடிவம் சொல்லுதல் அல்லது செய்தி அறிவித்தலைக் குறிக்கிறது. சூழலில் போர்க்களச் செய்தி தெரிவிக்கப்படுவதால், ‘செய்தியைத் தெரிவித்தான்’ இயல்பாக உள்ளது.
- source_word: עֵלִי
  choice: ஏலி
  rationale: தனிப்பெயர் நவீனத் தமிழில் வழக்கமான ஒலிபெயர்ப்பு முறையில் தரப்பட்டுள்ளது.
