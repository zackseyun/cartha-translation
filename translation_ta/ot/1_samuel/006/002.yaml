base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/006/002.yaml
  text: So the Philistines called for the priests and the diviners[a], saying, “What shall we do with the ark of Yahweh? Tell us with what we should send it to its place.”
translation:
  language: ta
  text: அதனால் பெலிஸ்தியர்கள் ஆசாரியர்களையும் குறி சொல்பவர்களையும் அழைத்து, “யாவேயின் பெட்டியை நாம் என்ன செய்வோம்? அதை அதன் இடத்துக்கு எதன் மூலம் அனுப்ப வேண்டும் என்று எங்களுக்குச் சொல்லுங்கள்” என்றார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְרְאוּ
  choice: அழைத்து
  rationale: இங்கு வினைச்சொல் ஆலோசனை பெறுவதற்காகச் சமய வல்லுநர்களை வரவழைப்பதைக் குறிக்கிறது; ‘அழைத்து’ என்பது இயல்பான தமிழ்.
- source_word: פְלִשְׁתִּים
  choice: பெலிஸ்தியர்கள்
  rationale: மக்களினத்திற்கான வழக்கமான தமிழ் ஒலிபெயர்ப்பு.
- source_word: לַכֹּהֲנִים
  choice: ஆசாரியர்களை
  rationale: எபிரெயச் சொல் சமயச் சடங்குகளை நடத்தும் குருமாரைக் குறிக்கிறது; சூழலில் இவர்கள் பெலிஸ்திய ஆசாரியர்கள் என்பது தெளிவு.
- source_word: וְלַקֹּסְמִים
  choice: குறிசொல்பவர்களை
  rationale: קֹסְמִים என்பது குறி அல்லது சகுனம் பார்த்து மறைவான அறிவைப் பெற முயல்பவர்களைக் குறிக்கிறது; இச்சொல் நவீன வாசகருக்குப் புரியும் வகையிலும் மதிப்பீட்டுச் சாயலைச் சேர்க்காமலும் உள்ளது.
- source_word: מַה נַּעֲשֶׂה
  choice: நாம் என்ன செய்வோம்?
  rationale: முதலாம் நபர் பன்மையில் ஆலோசனை கோரும் கேள்வியை நேரடியாகப் பிரதிபலிக்கிறது.
- source_word: לַאֲרוֹן יְהוָה
  choice: யாவேயின் பெட்டியை
  rationale: ל என்பதன் தொடர்பு தமிழில் ‘பெட்டியை என்ன செய்வோம்?’ என்ற இயல்பான அமைப்பால் வெளிப்படுகிறது; אָרוֹן என்பதற்கு இங்கு கூடுதல் விளக்கச் சொற்களைச் சேர்க்காமல் ‘பெட்டி’ என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: יְהוָה
  choice: யாவே
  rationale: திருப்பெயரான நான்கெழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: הוֹדִיעֻנוּ
  choice: எங்களுக்குச் சொல்லுங்கள்
  rationale: ‘எங்களுக்கு அறியச் செய்யுங்கள்’ என்ற பொருளை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: בַּמֶּה
  choice: எதனுடன்
  rationale: எபிரெயச் சொற்றொடரின் ‘எதனுடன்/எதன் மூலம்’ என்ற கருவி அல்லது உடன்சேர்க்கைப் பொருளைத் தக்கவைத்து, வெறுமனே ‘எப்படி’ என்று பொதுமைப்படுத்தவில்லை.
- source_word: נְשַׁלְּחֶנּוּ
  choice: அதை ... அனுப்ப வேண்டும்
  rationale: ஆலோசனை கோரும் சூழலில் நோக்கமுள்ள எதிர்காலச் செயலை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: לִמְקוֹמוֹ
  choice: அதன் இடத்துக்கு
  rationale: ‘அதன் இடத்துக்கு’ என்ற மூலத்தின் நேரடிப் பொருளைப் பாதுகாக்கிறது; சூழலால் உணரப்படும் ‘திரும்ப’ என்பதை முதன்மை உரையில் சேர்க்கவில்லை.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழியாக்கம்
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூலத்தில் தனிப்பட்ட இறைப்பெயர் நேரடியாக இடம்பெறுவதால், அதை ஒரு பட்டமாக மாற்றாமல் ஒலிபெயர்த்துள்ளது.
- issue: אָרוֹן என்பதற்குக் ‘உடன்படிக்கைப் பெட்டி’ என்ற விரிவாக்கத்தைச் சேர்ப்பது
  choice: பெட்டி
  alternative: உடன்படிக்கைப் பெட்டி
  rationale: இவ்வசனத்தில் ‘உடன்படிக்கை’ என்ற சொல் இல்லை. அடையாளத்தை வாசகர் சூழலிலிருந்து அறிய முடியும் என்பதால் மூலத்தில் இல்லாத தெய்வவியல் விளக்கத்தைச் சேர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், கதைநடைக்கு ஏற்ற கண்ணியமான மற்றும் எளிதில் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. ‘எதனுடன்’ என்ற சற்றே நேரடி வடிவம் மூலத்தின் கருவி/உடன்சேர்க்கை சார்ந்த தெளிவின்மையைப் பாதுகாக்கிறது; அடிக்குறிப்பு அதன் இயல்பான பொருள் வரம்பை விளக்குகிறது.
