source:
  edition: WLC
  text: וַֽ/יִּשְׁלְחוּ֙ מַלְאָכִ֔ים אֶל יוֹשְׁבֵ֥י קִרְיַת יְעָרִ֖ים לֵ/אמֹ֑ר הֵשִׁ֤בוּ פְלִשְׁתִּים֙ אֶת אֲר֣וֹן יְהוָ֔ה רְד֕וּ הַעֲל֥וּ אֹת֖/וֹ אֲלֵי/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/006/021.yaml
  text: So they sent messengers to the inhabitants of Kiriath-jearim[a], saying, “The Philistines have returned the ark of Yahweh. Come down; bring it up to yourselves.”
translation:
  language: ta
  text: ஆகவே அவர்கள் கீரியாத்-யாரீமில் குடியிருந்தவர்களிடம் தூதுவர்களை அனுப்பி, “பெலிஸ்தியர்கள் யாவேயின் பேழையைத் திருப்பி அனுப்பிவிட்டார்கள். கீழே இறங்கி வாருங்கள்; அதை மேலே உங்களிடம் எடுத்துச் செல்லுங்கள்[a]” என்று சொன்னார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கீழே இறங்கிப் போங்கள்; அதை மேலே உங்களிடம் எடுத்துச் செல்லுங்கள்.” எபிரெய மொழியில் நிலப்பரப்பைக் குறிக்கும் ‘கீழே இறங்கு’ மற்றும் ‘மேலே கொண்டுபோ’ என்ற வினைச்சொற்கள் உள்ளன; அவை பெத்-ஷெமேசுக்கும் கீரியாத்-யாரீமுக்கும் இடையிலான நில அமைப்பைக் காட்டக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלְחוּ
  choice: ஆகவே அவர்கள் ... அனுப்பி
  rationale: தொடர்கதை நிகழ்வை முன்னெடுக்கும் wayyiqtol வடிவத்தின் தொடர்ச்சியையும், முந்தைய நிகழ்வின் விளைவாக இது நடந்ததையும் இயல்பான தமிழில் காட்டுகிறது.
- source_word: מַלְאָכִים
  choice: தூதுவர்கள்
  rationale: இங்கு மனிதர்களிடையே செய்தி எடுத்துச் செல்பவர்களே குறிக்கப்படுகிறார்கள்; ‘தேவதூதர்கள்’ என்பது சூழலுக்குப் பொருந்தாது.
- source_word: יוֹשְׁבֵי קִרְיַת יְעָרִים
  choice: கீரியாத்-யாரீமில் குடியிருந்தவர்கள்
  rationale: எபிரெயச் சொற்றொடரின் ‘அங்கே வசிப்பவர்கள்’ என்ற பொருளை இயல்பான நவீன தமிழில் தருகிறது; இடப்பெயர் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: הֵשִׁבוּ
  choice: திருப்பி அனுப்பிவிட்டார்கள்
  rationale: שׁוב என்பதன் Hiphil வடிவம் ‘திரும்பச் செய்தல்/திருப்பி அனுப்புதல்’ எனப் பொருள்படும். முடிந்த செயலும் அதன் தற்போதைய விளைவும் தமிழின் ‘விட்டார்கள்’ வடிவில் வெளிப்படுகின்றன.
- source_word: אֲרוֹן יְהוָה
  choice: யாவேயின் பேழை
  rationale: אֲרוֹן என்பதற்கு இச்சமயச் சூழலில் கண்ணியமான ‘பேழை’ தேர்ந்தெடுக்கப்பட்டுள்ளது; மூலத்தில் இல்லாத ‘உடன்படிக்கை’ என்ற விளக்கம் சேர்க்கப்படவில்லை.
- source_word: רְדוּ
  choice: கீழே இறங்கி வாருங்கள்
  rationale: ירד என்பதன் பன்மை ஏவல் வடிவத்தையும், பேசுகிறவர்களை நோக்கிய வருகையையும், நிலப்பரப்பு சார்ந்த கீழ்நோக்கிய இயக்கத்தையும் காக்கிறது.
- source_word: הַעֲלוּ אֹתוֹ אֲלֵיכֶם
  choice: அதை மேலே உங்களிடம் எடுத்துச் செல்லுங்கள்
  rationale: עלה என்பதன் Hiphil வடிவிலுள்ள மேல்நோக்கிய இயக்கத்தையும், אֲלֵיכֶם என்பதன் ‘உங்களிடம்’ என்ற இலக்கையும் தெளிவாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலத்தில் நான்கு எழுத்துகளைக் கொண்ட தனிப்பட்ட இறைப் பெயர் நேரடியாக உள்ளது. அதை பொதுப்பட்டப் பெயராக மாற்றாமல், பரவலாக ஏற்றுக்கொள்ளப்பட்ட உச்சரிப்பின் தமிழ் ஒலிபெயர்ப்பாக ‘யாவே’ என வழங்கப்பட்டுள்ளது; மூல உச்சரிப்பு முழு உறுதியுடன் அறியப்படவில்லை என்பதும் ஏற்றுக்கொள்ளப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘கீழே/மேலே’ என்ற நிலப்பரப்புச் சொற்கள் இயல்புக்கு மாறாகச் சீராக்கப்படாமல் பாதுகாக்கப்பட்டுள்ளன; רְדוּ என்பதில் ‘வாருங்கள்/போங்கள்’ என்ற நோக்குநிலைத் தெளிவின்மை அடிக்குறிப்பில் குறிப்பிடப்பட்டுள்ளது.
