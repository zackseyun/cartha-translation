  to: அப்படியானால் ஏன் எகிப்தும் பார்வோனும் தங்கள் இதயங்களைக் கடினப்படுத்தியதுபோல் நீங்களும் உங்கள் இதயங்களைக் கடினப்படுத்துகிறீர்கள்?[a] அவர் அவர்களைக் கடுமையாக நடத்தியபோது, அவர்கள் இவர்களை அனுப்பிவிட்டார்கள்; இவர்கள் போய்விட்டார்களே அல்லவா?[b]
