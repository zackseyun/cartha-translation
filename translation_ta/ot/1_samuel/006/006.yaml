  text: וְ/לָ֤/מָּה תְכַבְּדוּ֙ אֶת לְבַבְ/כֶ֔ם כַּ/אֲשֶׁ֧ר כִּבְּד֛וּ מִצְרַ֥יִם וּ/פַרְעֹ֖ה אֶת לִבָּ֑/ם הֲ/לוֹא֙ כַּ/אֲשֶׁ֣ר הִתְעַלֵּ֣ל בָּ/הֶ֔ם וַֽ/יְשַׁלְּח֖וּ/ם וַ/יֵּלֵֽכוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/006/006.yaml
  text: Why then do you harden your hearts[a], as Egypt and Pharaoh hardened their hearts? Was it not when he dealt harshly with them that they sent them away[b], and they went?
translation:
  language: ta
  text: அப்படியானால் ஏன் எகிப்தும் பார்வோனும் தங்கள் இதயங்களைக் கடினப்படுத்தியதுபோல் நீங்களும் உங்கள் இதயங்களைக் கடினப்படுத்துகிறீர்கள்?[a] அவர் அவர்களைக் கடுமையாக நடத்தியபோது, அவர்கள் இவர்களை அனுப்பிவிட்டார்கள்; இவர்கள் போய்விட்டார்களே அல்லவா?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'சொல்லுக்குச் சொல்: “உங்கள் இதயங்களைக் கனமாக்குகிறீர்கள்”; எபிரெய மரபுத்தொடரில் ‘கனமாக்குதல்’ இதயத்தைக் கடினப்படுத்துதலைக் குறிக்கிறது.'
    reason: lexical_alternative
  - marker: b
    text: “அவர் அவர்களை” என்பதில் “அவர்களை” என்பது எகிப்தையும் பார்வோனையும் குறிக்கிறது; “அவர்கள் இவர்களை அனுப்பிவிட்டார்கள்” என்பதில் “அவர்கள்” எகிப்தையும் பார்வோனையும், “இவர்கள்” இஸ்ரவேலரையும் குறிக்கின்றன.
    reason: cross_reference
lexical_decisions:
- source_word: תְכַבְּדוּ / כִּבְּדוּ
  choice: இதயங்களைக் கடினப்படுத்துகிறீர்கள் / கடினப்படுத்தியது
  rationale: כבד என்பதன் பியேல் வடிவம் ‘இதயம்’ என்பதுடன் வரும்போது, ‘இதயத்தைக் கனமாக்குதல்,’ அதாவது பிடிவாதமாகக் கடினப்படுத்துதல் என்ற எபிரெய மரபுத்தொடரைக் குறிக்கிறது. நவீன தமிழில் ‘கடினப்படுத்துதல்’ அதன் கருத்தை இயல்பாகத் தருகிறது.
- source_word: לְבַבְכֶם / לִבָּם
  choice: உங்கள் இதயங்கள் / தங்கள் இதயங்கள்
  rationale: לֵבָב என்பது உள்ளார்ந்த மனம், சித்தம், தீர்மானம் ஆகியவற்றை உள்ளடக்கும். ‘இதயம்’ என்ற வழக்கமான வேதாகமத் தமிழ் இவ்விரிவை மிகையாக விளக்காமல் காக்கிறது.
- source_word: מִצְרַיִם וּפַרְעֹה
  choice: எகிப்தும் பார்வோனும்
  rationale: எபிரெயத்தில் ‘எகிப்து’ என்பது அதன் மக்களையோ ஆட்சிச் சக்தியையோ கூட்டாகக் குறிக்கிறது; இடப்பெயரை அப்படியே வைத்திருப்பது மூலத்தின் வடிவத்தைப் பாதுகாக்கிறது.
- source_word: הִתְעַלֵּל בָּהֶם
  choice: அவர் அவர்களைக் கடுமையாக நடத்தினபோது
  rationale: இவ்விடத்தில் עלל என்பதன் ஹித்பயேல் வடிவம் கடுமையாக அல்லது தீவிரமாக நடத்துவதைச் சுட்டுகிறது. எழுவாய் எபிரெயத்தில் வெளிப்படையாக இல்லை; ஆண்பால் ஒருமை வினைவடிவத்தை ‘அவர்’ என்று காத்து, தேவன் என்ற அடையாளத்தை உரைக்குள் சேர்க்கவில்லை.
- source_word: וַיְשַׁלְּחוּם
  choice: அவர்கள் இவர்களை அனுப்பிவிட
  rationale: שלח என்பது அனுப்பிவிடுதல் அல்லது விடுவித்தல். முதல் பன்மைச் சுட்டு எகிப்து மற்றும் பார்வோனையும், வினையின் பொருள் இஸ்ரவேலரையும் குறிக்கும்; தமிழில் ‘அவர்கள்/இவர்கள்’ மூலம் குழப்பத்தை ஓரளவு குறைத்தும் அடையாளங்களை உரைக்குள் விரிவாக்காமலும் உள்ளது.
- source_word: וַיֵּלֵכוּ
  choice: இவர்கள் போய்விட்டார்கள்
  rationale: הלך என்பதன் எளிய இயக்கப் பொருளை ‘போ’ தருகிறது. தொடரின் விளைவையும் நிறைவுற்ற நிகழ்வையும் இயல்பான தமிழில் ‘போய்விட்டார்கள்’ வெளிப்படுத்துகிறது.
theological_decisions:
- issue: הִתְעַלֵּל என்பதன் மறைந்த எழுவாய்
  choice: ‘அவர்’ என்று மட்டும் மொழிபெயர்த்து, சூழலில் தேவனைச் சுட்ட விடுதல்
  alternative: ‘தேவன் அவர்களைக் கடுமையாக நடத்தினபோது’ என்று வெளிப்படையாகக் கூறுதல்; அல்லது எழுவாயற்ற விதமாக ‘அவர்கள் கடுமையாகத் துன்புறுத்தப்பட்டபோது’ என்று மொழிபெயர்த்தல்
  rationale: யாத்திராகம நிகழ்ச்சிச் சூழல் தேவனை எழுவாயாக உணர்த்துகிறது; ஆனால் எபிரெய வசனம் அவரை பெயரால் குறிப்பிடவில்லை. ‘அவர்’ என்பது அந்த மறைமுகத்தையும் இறையியல் தொடர்பையும் காக்கிறது.
- issue: וַיְשַׁלְּחוּם மற்றும் וַיֵּלֵכוּ ஆகியவற்றிலுள்ள பன்மைச் சுட்டுப்பெயர்களின் குறிப்பு
  choice: அனுப்புகிறவர்கள் ‘அவர்கள்’ (எகிப்தும் பார்வோனும்), அனுப்பப்படுகிறவர்கள் ‘இவர்கள்’ (இஸ்ரவேலர்) என வேறுபடுத்துதல்
  alternative: இரு தரப்பையும் ‘அவர்கள்’ என மொழிபெயர்த்து அடிக்குறிப்பில் மட்டும் தெளிவுபடுத்துதல்
  rationale: தமிழில் ஒரே வாக்கியத்தில் இரு வேறு குழுக்களுக்கும் ‘அவர்கள்’ பயன்படுத்தினால் பொருள் மிகுந்த குழப்பமடையும். அருகாமை வேறுபாட்டுச் சுட்டுகள் மூலக் குறிப்பை மாற்றாமல் வாசிப்பைத் தெளிவாக்குகின்றன; அடிக்குறிப்பு அடையாளங்களை உறுதிப்படுத்துகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான நடையைப் பயன்படுத்தியது. ‘பார்வோன்,’ ‘இதயம்’ போன்ற பரவலாக அறியப்பட்ட வேதாகமச் சொற்கள் காக்கப்பட்டன. மூலத்தின் வினாவடிவமும், மறைந்த எழுவாயும், சுட்டுப்பெயர் மாறுபாடும் இயன்றவரை பாதுகாக்கப்பட்டுள்ளன.
