  yaml_path: translation/ot/1_samuel/006/007.yaml
  text: Now then[a], take and make one new cart, and two nursing cows on which no yoke has come, and hitch the cows to the cart[b], but take their calves away from them to the house.
translation:
  language: ta
  text: இப்போது, ஒரு புதிய வண்டியை எடுத்து ஆயத்தப்படுத்துங்கள். கன்றுகளுக்குப் பாலூட்டும் இரண்டு பசுக்களையும்[a] எடுத்துக்கொள்ளுங்கள்; அவற்றின்மேல் இதுவரை நுகம் ஏறியிருக்காதிருக்க வேண்டும்[b]. அந்தப் பசுக்களை வண்டியில் பூட்டி, அவற்றின் கன்றுகளை அவற்றிடமிருந்து பிரித்து வீட்டுக்குத் திருப்பி அனுப்புங்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பால் கொடுத்துக்கொண்டிருக்கும் இரண்டு பசுக்கள்.”
    reason: lexical_alternative
  - marker: b
    text: சொல்லுக்குச் சொல், “அவற்றின்மேல் நுகம் ஏறியிராத.” அதாவது, வண்டி இழுப்பது போன்ற வேலைக்கு இதுவரை பயன்படுத்தப்படாத பசுக்கள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: இப்போது
  rationale: அடுத்த செயன்முறையை அறிமுகப்படுத்தும் உரைமாற்றத்தை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: קְחוּ וַעֲשׂוּ
  choice: எடுத்து ஆயத்தப்படுத்துங்கள்
  rationale: இரு எபிரெய வினைகளையும் சுருக்கிவிடாமல் காக்கிறது; வண்டியைப் பயன்பாட்டுக்குத் தயாராக்கும் சூழலுக்கும் பொருந்துகிறது.
- source_word: עֲגָלָה חֲדָשָׁה אֶחָת
  choice: ஒரு புதிய வண்டி
  rationale: பெயர்ச்சொல், பெயரடை, எண் ஆகிய மூன்றையும் தெளிவாகப் பாதுகாக்கிறது.
- source_word: שְׁתֵּי פָרוֹת עָלוֹת
  choice: கன்றுகளுக்குப் பாலூட்டிக்கொண்டிருக்கும் இரண்டு பசுக்கள்
  rationale: עָלוֹת என்பதன் பால் கொடுக்கும் அல்லது கன்றுகளுக்குப் பாலூட்டும் நிலையைக் குறிப்பாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: אֲשֶׁר לֹא עָלָה עֲלֵיהֶם עֹל
  choice: அவற்றின்மேல் இதுவரை நுகம் ஏற்றப்பட்டிருக்கக் கூடாது
  rationale: எபிரெய மொழியின் உருவக அமைப்பைத் தமிழில் புரியும்படி வழங்கி, முன்பு உழைப்புக்குப் பயன்படுத்தப்படாத பசுக்கள் என்பதைக் காட்டுகிறது.
- source_word: וַאֲסַרְתֶּם אֶת־הַפָּרוֹת בָּעֲגָלָה
  choice: அந்தப் பசுக்களை வண்டியில் பூட்டி
  rationale: வரைவிலங்குகளை வண்டியுடன் இணைக்கும் செயலைக் குறிக்கும் இயல்பான தமிழ்ச் சொல் ‘பூட்டி’ ஆகும்.
- source_word: בְּנֵיהֶם
  choice: அவற்றின் கன்றுகள்
  rationale: சொல்லுக்குச் சொல் ‘அவற்றின் குட்டிகள்’ என்றாலும், பசுக்களின் இளங்குட்டிகளைக் குறிக்கும் சூழல்சார் சரியான தமிழ்ச் சொல் ‘கன்றுகள்’ ஆகும்.
- source_word: וַהֲשֵׁיבֹתֶם ... מֵאַחֲרֵיהֶם הַבָּיְתָה
  choice: அவற்றிடமிருந்து பிரித்து வீட்டுக்குத் திருப்பி அனுப்புங்கள்
  rationale: Hiphil வினையின் பிறவினைப் பொருளையும், தாய்ப்பசுக்களைப் பின்தொடராதபடி கன்றுகளைப் பிரித்து வீட்டுக்கு அனுப்பும் திசையையும் தெளிவாகக் காக்கிறது.
