    issue: The divine name is rendered ‘யெகோவா’ rather than the project-audited form corresponding to ‘Yahweh.’
    rationale: The English audit trail explicitly sets Yahweh as the project rendering for יְהוָה. Tamil should preserve that same named, rather than titular, rendering as ‘யாவே.’
  - severity: low
    issue: ‘பெட்டி’ is overly generic for אֲרוֹן in this biblical cultic context.
    rationale: ‘பேழை’ is a conventional, recognizable Tamil biblical term for the sacred ark and better preserves the register without adding interpretive content.
