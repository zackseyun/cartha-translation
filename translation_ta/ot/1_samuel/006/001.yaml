source:
  edition: WLC
  text: וַ/יְהִ֧י אֲרוֹן יְהוָ֛ה בִּ/שְׂדֵ֥ה פְלִשְׁתִּ֖ים שִׁבְעָ֥ה חֳדָשִֽׁים־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/006/001.yaml
  text: And the ark of Yahweh was in the territory of the Philistines seven months[a].
translation:
  language: ta
  text: யாவேயின் பேழை பெலிஸ்தியர்களின் நாட்டில் ஏழு மாதங்கள் இருந்தது[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மொழியில் சொல்லுக்கு சொல், “பெலிஸ்தியர்களின் வயலில்.” இங்கு அது அவர்களுடைய நாடு அல்லது ஆட்சிப்பகுதியைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: இருந்தது
  rationale: எபிரெயக் கதைத் தொடரில் அடுத்த நிலையை அறிமுகப்படுத்தும் வடிவம். தமிழில் இயல்பான இறந்தகால வாக்கியமாக மொழிபெயர்க்கப்பட்டுள்ளது; தனியாக ‘அப்போது’ சேர்க்கத் தேவையில்லை.
- source_word: אֲרוֹן יְהוָה
  choice: யெகோவாவின் பெட்டி
  rationale: אֲרוֹן என்பதற்கு இந்த வழிபாட்டுச் சூழலில் ‘பெட்டி’ என்பது எளிமையான, துல்லியமான சொல்; இறைப்பெயருடனான எபிரெயக் கட்டமைப்பு தமிழில் உடைமை வேற்றுமையால் தரப்பட்டுள்ளது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: இது ஒரு பட்டமல்ல, இஸ்ரவேலின் கடவுளுடைய தனிப்பெயர் என்பதைக் காக்கும் வகையில் தமிழில் வழக்கிலுள்ள ‘யெகோவா’ என்ற ஒலிபெயர்ப்பு பயன்படுத்தப்பட்டுள்ளது.
- source_word: בִּשְׂדֵה פְלִשְׁתִּים
  choice: பெலிஸ்தியர்களின் நாட்டில்
  rationale: שָׂדֶה என்பதன் அடிப்படைப் பொருள் ‘வயல்/வெளி’; இங்கு ஒரு தனி வயலை அல்ல, பெலிஸ்தியர் கட்டுப்பாட்டிலிருந்த நிலப்பரப்பைச் சுட்டுவது சூழலுக்கு ஏற்றது. அந்த விரிவான புவியியல் பொருளை இயல்பான தமிழில் ‘நாட்டில்’ எனத் தருகிறது.
- source_word: שִׁבְעָה חֳדָשִׁים
  choice: ஏழு மாதங்கள்
  rationale: மூலத்தின் எண்ணிக்கையும் கால அளவும் நேரடியாகப் பாதுகாக்கப்பட்டுள்ளன.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யெகோவா
  alternative: யாவே; கர்த்தர்
  rationale: மூலத்தில் தனிப்பெயர் இருப்பதால் அதை ‘கர்த்தர்’ என்ற பட்டமாக மாற்றாமல் தமிழில் பரவலாக அறியப்பட்ட ஒலிபெயர்ப்பால் வழங்குகிறது. ‘யாவே’ என்பது மூல உச்சரிப்பை மீட்டமைக்கும் மற்றொரு சாத்தியமான வடிவம்.
translation_notes:
  register: நவீன பொதுத்தமிழில் சுருக்கமாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘பெலிஸ்தியர்’ என்ற நிலைபெற்ற வேதாகமப் பெயரும், சாதாரண வாசகருக்குப் புரியும் ‘பெட்டி’ மற்றும் ‘நாடு’ என்ற சொற்களும் பயன்படுத்தப்பட்டுள்ளன.
