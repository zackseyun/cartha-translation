translation_notes:
  register: நவீன தரநிலைத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் dignified narrative register பயன்படுத்தப்பட்டுள்ளது. ‘வண்டியில் பூட்டினார்கள்’ என்பது மாடுகளை வண்டியோடு இணைப்பதற்கான இயல்பான தமிழ் வழக்கு. எபிரெய உரையில் உள்ள ‘வீடு’ அப்படியே காக்கப்பட்டு, ‘தொழுவம்’ என்ற சூழல்சார் ஊகம் பிரதான உரைக்குள் சேர்க்கப்படவில்லை.
