source:
  edition: WLC
  text: וַ/יַּעֲשׂ֤וּ הָ/אֲנָשִׁים֙ כֵּ֔ן וַ/יִּקְח֗וּ שְׁתֵּ֤י פָרוֹת֙ עָל֔וֹת וַ/יַּאַסְר֖וּ/ם בָּ/עֲגָלָ֑ה וְ/אֶת בְּנֵי/הֶ֖ם כָּל֥וּ בַ/בָּֽיִת־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/006/010.yaml
  text: 'So the men did so: they took two milk cows and harnessed them to the cart[b][a], and shut up their calves in the house.'
translation:
  language: ta
  text: அந்த மனிதர்கள் அவ்வாறே செய்தார்கள். கன்றுகளைப் பாலூட்டும் இரண்டு பசுக்களை எடுத்துக்கொண்டு, அவற்றை வண்டியில் பூட்டினார்கள்; அவற்றின் கன்றுகளை வீட்டில் அடைத்து வைத்தார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲשׂוּ ... כֵּן
  choice: அந்த மனிதர்கள் அவ்வாறே செய்தார்கள்
  rationale: முன்பு கொடுக்கப்பட்ட அறிவுறுத்தலின்படியே அவர்கள் நடந்ததை இயல்பான, சுருக்கமான தமிழில் தெரிவிக்கிறது.
- source_word: הָאֲנָשִׁים
  choice: அந்த மனிதர்கள்
  rationale: இங்கு குறிப்பிட்ட ஆண் செயற்பாட்டாளர்களைக் குறிக்கும் எபிரெயச் சொல்லின் பாலினத்தையும் சூழலையும் காக்கிறது.
- source_word: שְׁתֵּי פָרוֹת עָלוֹת
  choice: கன்றுகளுக்குப் பால் கொடுத்துக்கொண்டிருந்த இரண்டு பசுக்கள்
  rationale: עָלוֹת என்பது பால் சுரக்கும், கன்றுகளைப் பாலூட்டும் பசுக்களைக் குறிக்கிறது; அடுத்த செயலில் கன்றுகளைப் பிரிப்பது முக்கியமாதலால் இதை வெளிப்படையாக மொழிபெயர்க்கிறது.
- source_word: וַיַּאַסְרוּם בָּעֲגָלָה
  choice: அவற்றை வண்டியில் பூட்டினார்கள்
  rationale: இழுவை விலங்குகளை வண்டியோடு கட்டி இணைப்பதற்கான வழக்கமான, இயல்பான தமிழ்ச் சொற்றொடர்; אסר என்பதன் கட்டுதல் என்ற அடிப்படை உணர்வையும் சூழல்சார் செயலையும் தருகிறது.
- source_word: וְאֶת בְּנֵיהֶם
  choice: அவற்றின் கன்றுகளையோ
  rationale: בנים என்பதன் சொற்பொருள் ‘மகன்கள்/பிள்ளைகள்’ என்றாலும், பசுக்களின் குட்டிகளை இங்கு இயல்பாக ‘கன்றுகள்’ என்று மொழிபெயர்ப்பது துல்லியம்.
- source_word: כָּלוּ בַּבָּיִת
  choice: வீட்டிற்குள் அடைத்து வைத்தார்கள்
  rationale: כלה இங்கு வெளியே வராமல் கட்டுப்படுத்தி அடைத்துவைத்தலைக் குறிக்கிறது; בַּבָּיִת என்பதன் ‘வீட்டில்/வீட்டிற்குள்’ என்ற வடிவத்தைத் தொழுவம் என ஊகித்து மாற்றாமல் காக்கிறது.
