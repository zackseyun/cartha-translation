revisions:
- from: அந்த மனிதர்கள் அவ்வாறே செய்தார்கள். கன்றுகளுக்குப் பால் கொடுத்துக்கொண்டிருந்த இரண்டு பசுக்களைக் கொண்டுவந்து, அவற்றை வண்டியில் பூட்டினார்கள்; அவற்றின் கன்றுகளையோ வீட்டிற்குள் அடைத்து வைத்தார்கள்.
  to: அந்த மனிதர்கள் அவ்வாறே செய்தார்கள். கன்றுகளைப் பாலூட்டும் இரண்டு பசுக்களை எடுத்துக்கொண்டு, அவற்றை வண்டியில் பூட்டினார்கள்; அவற்றின் கன்றுகளை வீட்டில் அடைத்து வைத்தார்கள்.
  rationale: 'The changes are stylistic and syntactic refinements only. They remove an unneeded contrastive marker, use a natural modern Tamil expression for lactating cows, and preserve every relevant element of the Hebrew narrative: the men, the two cows with calves, their attachment to the cart, and the calves’ confinement in the house.'
