base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/006/014.yaml
  text: The cart came into the field of Joshua the Beth-shemite and stopped there[a], where there was a large stone[c][b]. Then they split up the wood of the cart and offered up the cows as a burnt offering to Yahweh.
translation:
  language: ta
  text: அந்த வண்டி பெத்-ஷெமேசைச் சேர்ந்த யோசுவாவின்[a] வயலுக்கு வந்து, அங்கே நின்றது.[b] அங்கே ஒரு பெரிய கல் இருந்தது. அவர்கள் வண்டியின் மரப்பகுதிகளைப் பிளந்து, அந்தப் பசுக்களை யாவேக்குத் தகனபலியாகச் செலுத்தினார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பெத்-ஷெமேசின் யோசுவாவின் வயல்.” எபிரெயம் யோசுவாவை பெத்-ஷெமேசுடன் தொடர்புபடுத்தும் பெயரடை வடிவைப் பயன்படுத்துகிறது.
    reason: lexical_alternative
  - marker: b
    text: “நின்றது” என்பது எபிரெயத்தின் நேரடியான சொல்; இங்கு வண்டி வந்து நின்றதைக் குறிக்கிறது.
    reason: lexical_clarification
lexical_decisions:
- source_word: הָעֲגָלָה
  choice: வண்டி
  rationale: பெட்டியையும் குற்றநிவாரணக் காணிக்கைகளையும் ஏற்றிச் சென்ற வாகனத்தை இயல்பான நவீனத் தமிழில் குறிக்கிறது.
- source_word: שְׂדֵה יְהוֹשֻׁעַ בֵּית הַשִּׁמְשִׁי
  choice: பெத்-ஷெமேசைச் சேர்ந்த யோசுவாவின் வயல்
  rationale: எபிரெயப் பெயரடை வடிவம் யோசுவாவை பெத்-ஷெமேசுடன் தொடர்புபடுத்துகிறது; தமிழில் இயல்பாகவும் துல்லியமாகவும் இந்தத் தொடர்பை வெளிப்படுத்துகிறது.
- source_word: וַתַּעֲמֹד שָׁם
  choice: அங்கே நின்றது
  rationale: עמד என்பதன் அடிப்படைப் பொருளான ‘நில்’ என்பதையும், நகர்ந்துகொண்டிருந்த வண்டி அங்கே வந்து நின்ற சூழலையும் ஒருங்கே காக்கிறது.
- source_word: וְשָׁם אֶבֶן גְּדוֹלָה
  choice: அங்கே ஒரு பெரிய கல் இருந்தது
  rationale: இடத்தைக் குறிக்கும் எபிரெய வாக்கியத்தைத் தெளிவான இயல்பான தமிழில் தருகிறது.
- source_word: וַיְבַקְּעוּ אֶת עֲצֵי הָעֲגָלָה
  choice: வண்டியின் மரங்களைப் பிளந்து
  rationale: בקע என்பதன் பிளத்தல் அல்லது கூறுபடுத்துதல் என்ற பொருளையும், வண்டியின் மரப்பகுதிகள் எரிபொருளாகப் பயன்படுத்தப்பட்டதையும் காட்டுகிறது.
- source_word: הַפָּרוֹת
  choice: பசுக்கள்
  rationale: பெண் மாடுகளைக் குறிக்கும் பொதுவான சொல்லின் நேரான, சூழலுக்கு ஏற்ற தமிழாக்கம்.
- source_word: הֶעֱלוּ עֹלָה
  choice: தகனபலியாகச் செலுத்தினார்கள்
  rationale: முழுவதும் எரிக்கப்படும் பலியைச் செலுத்தும் சடங்குசார் பொருளைச் சுருக்கமாகவும் தெளிவாகவும் தருகிறது.
- source_word: לַיהוָה
  choice: யாவேக்கு
  rationale: יהוה என்ற தனிப்பட்ட இறைப் பெயரைப் பட்டப்பெயராக மாற்றாமல், தமிழில் வழக்கமான ஒலிபெயர்ப்பில் தருகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலத்தில் தனிப்பட்ட உடன்படிக்கைப் பெயர் நேரடியாக இருப்பதால் அதைப் பட்டப்பெயரால் மாற்றாமல் ஒலிபெயர்த்துள்ளது; ‘யாவே’ என்பது மூல உச்சரிப்பை அணுகும் பரவலான வடிவம்.
- issue: பசுக்களைப் பலியாகச் செலுத்திய செயலை விவரித்தல்
  choice: தகனபலியாகச் செலுத்தினார்கள்
  alternative: தகனபலியாகப் பலியிட்டார்கள்
  rationale: עלה/עֹלָה என்ற இணைப்பின் பலிசார் பொருளைக் காக்கிறது; செயலில் குறிப்பிடப்படாத கூடுதல் சடங்கு விவரங்களைச் சேர்க்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘தகனபலி’ என்ற நிலைபெற்ற வேதாகமச் சொல் சடங்குசார் துல்லியத்திற்காக வைக்கப்பட்டுள்ளது; வாக்கிய அமைப்பு இயல்பான தமிழ் நடைக்கு ஏற்ப அமைக்கப்பட்டுள்ளது.
