translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘ஆட்சியாளர்கள்’ என்பது பெலிஸ்தியப் பட்டத்தின் அரசியல் பொருளைத் தெளிவாகப் பாதுகாக்கிறது; ‘அன்றே’ என்பதற்கான சொல்லுக்கு நெருக்கமான மாற்று அடிக்குறிப்பில் தரப்பட்டுள்ளது.
