source:
  edition: WLC
  text: וַ/חֲמִשָּׁ֥ה סַרְנֵֽי פְלִשְׁתִּ֖ים רָא֑וּ וַ/יָּשֻׁ֥בוּ עֶקְר֖וֹן בַּ/יּ֥וֹם הַ/הֽוּא־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/006/016.yaml
  text: When the five rulers of the Philistines saw it[b][a], they returned to Ekron that same day.
translation:
  language: ta
  text: பெலிஸ்தியர்களின் ஐந்து ஆட்சியாளர்களும்[b] அதைக் கண்டபின், அன்றே[a] எக்ரோனுக்குத் திரும்பினார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது: “அந்த நாளில்.”'
    reason: lexical_alternative
  - marker: b
    text: பெலிஸ்தியர்களின் பட்டமான எபிரெயச் சொல் סַרְנֵי என்பதற்கு “பிரபுக்கள்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַ/חֲמִשָּׁה
  choice: ஐந்து
  rationale: அடுத்து வரும் அதிகாரப் பட்டத்தைக் குறிப்பிடும் எண்ணுப்பெயர். ஏற்கெனவே அறிமுகமான குறிப்பிட்ட ஐவரைக் குறிக்கும் தன்மை தமிழில் சூழலாலும் ‘-உம்’ விகுதியாலும் இயல்பாக வெளிப்படுகிறது.
- source_word: סַרְנֵי
  choice: ஆட்சியாளர்கள்
  rationale: பெலிஸ்திய நகரங்களை ஆண்டவர்களுக்குரிய அதிகாரப்பூர்வப் பட்டம். ‘பிரபுக்கள்’ என்பதைவிட இன்றைய வாசகர்களுக்கு தெளிவாக அரசியல் அதிகாரத்தை உணர்த்துகிறது.
- source_word: פְלִשְׁתִּים
  choice: பெலிஸ்தியர்களின்
  rationale: இது ‘பெலிஸ்தியர்களின் ஆட்சியாளர்கள்’ என்ற உடைமைத் தொடர்பை நிறைவு செய்யும் பன்மைச் சொல்.
- source_word: רָאוּ
  choice: அதைக் கண்டபின்
  rationale: எபிரெயத்தில் வினைக்கு வெளிப்படையான செயப்படுபொருள் இல்லை; உடனுள்ள சூழலில் முன்பு நிகழ்ந்தவற்றையே அவர்கள் கண்டதாக உள்ளது. தமிழில் இயல்புக்காக ‘அதை’ சேர்க்கப்பட்டு, தொடர் நிகழ்வை ‘கண்டபின்’ வெளிப்படுத்துகிறது.
- source_word: וַ/יָּשֻׁבוּ
  choice: திரும்பினார்கள்
  rationale: கதைத் தொடரில் שוב என்பது அவர்கள் மீண்டும் சென்றதைக் குறிக்கிறது; ‘திரும்பினார்கள்’ இயல்பான, சுருக்கமான தமிழாக்கம்.
- source_word: עֶקְרוֹן
  choice: எக்ரோனுக்கு
  rationale: இடப்பெயர் ஒலிபெயர்க்கப்பட்டுள்ளது. எபிரெயத்தில் முன்னிடைச்சொல் இல்லாவிட்டாலும் இயக்க வினையுடன் இலக்கு நேரடியாக வருகிறது; தமிழில் நான்காம் வேற்றுமை உருபு தேவைப்படுகிறது.
- source_word: בַּ/יּוֹם הַ/הוּא
  choice: அன்றே
  rationale: சொல்லுக்கு நெருக்கமாக ‘அந்த நாளில்’; இங்கு அதே நாளில் உடனடியாகத் திரும்பிய காலத் தொடர்பை ‘அன்றே’ இயல்பாகவும் சுருக்கமாகவும் தெரிவிக்கிறது.
