  text: וְ/עַכְבְּרֵ֣י הַ/זָּהָ֗ב מִסְפַּ֞ר כָּל עָרֵ֤י פְלִשְׁתִּים֙ לַ/חֲמֵ֣שֶׁת הַ/סְּרָנִ֔ים מֵ/עִ֣יר מִבְצָ֔ר וְ/עַ֖ד כֹּ֣פֶר הַ/פְּרָזִ֑י וְ/עַ֣ד אָבֵ֣ל הַ/גְּדוֹלָ֗ה אֲשֶׁ֨ר הִנִּ֤יחוּ עָלֶ֨י/הָ֙ אֵ֚ת אֲר֣וֹן יְהוָ֔ה עַ֚ד הַ/יּ֣וֹם הַ/זֶּ֔ה בִּ/שְׂדֵ֥ה יְהוֹשֻׁ֖עַ בֵּֽית הַשִּׁמְשִֽׁי־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/006/018.yaml
  text: and the golden mice[a], according to the number of all the cities of the Philistines belonging to the five rulers, from fortified city to unwalled village, and as far as the great stone on which they set down the ark of Yahweh, which remains to this day in the field of Joshua the Beth-shemite.
translation:
  language: ta
  text: பெலிஸ்தியரின் ஐந்து ஆட்சியாளர்களுக்குட்பட்ட எல்லாப் பட்டணங்களின் எண்ணிக்கைக்கு ஏற்பத் தங்க எலிகள் இருந்தன; அரணமைந்த பட்டணம் முதல் மதிலில்லாத கிராமம் வரையிலும், யாவேயின் பெட்டியை அவர்கள் இறக்கிவைத்த பெருங்கல்[a] வரையிலும். அந்தக் கல் பெத்-ஷெமேசைச் சேர்ந்த யோசுவாவின் வயலில் இன்றுவரை இருக்கிறது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பெரிய ஆபேல் வரையிலும்.” எபிரெயச் சொற்றொடர் ஓர் இடப்பெயராகவும் வாசிக்கப்படலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: עַכְבְּרֵי הַזָּהָב
  choice: தங்க எலிகள்
  rationale: עַכְבָּר என்பது எலி அல்லது பெருச்சாளியைக் குறிக்கலாம். இங்கு செய்யப்பட்ட உருவங்களைக் குறிக்க இயல்பான, பரவலான சொல்லாக ‘எலிகள்’ பயன்படுத்தப்பட்டுள்ளது; தங்கத்தால் செய்யப்பட்டவை என்பதால் ‘தங்க எலிகள்’ என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: מִסְפַּר כָּל עָרֵי פְלִשְׁתִּים
  choice: பெலிஸ்தியர்களின் ... எல்லாப் பட்டணங்களின் எண்ணிக்கைப்படியே
  rationale: מִסְפַּר இங்கு எண்ணிக்கையில் ஒத்திருப்பதைக் காட்டுகிறது. ‘எண்ணிக்கைப்படியே’ என்பது அந்த அளவுச் correspondence-ஐ இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: לַחֲמֵשֶׁת הַסְּרָנִים
  choice: ஐந்து ஆட்சியாளர்களுக்கு உட்பட்ட
  rationale: סְרָנִים என்பது பெலிஸ்தியரின் தலைமை ஆட்சியாளர்களுக்குரிய சிறப்புப் பட்டம். ‘ஆட்சியாளர்கள்’ என்பது நடுநிலையான நவீனத் தமிழ்; לַ־ காட்டும் தொடர்பு ‘உட்பட்ட’ என்பதால் தெரிவிக்கப்பட்டுள்ளது.
- source_word: מֵעִיר מִבְצָר וְעַד כֹּפֶר הַפְּרָזִי
  choice: அரணுள்ள பட்டணம் தொடங்கி மதிலில்லாத கிராமம் வரையிலும்
  rationale: מִבְצָר பாதுகாப்பு அரண் கொண்ட குடியிருப்பையும், כֹּפֶר הַפְּרָזִי திறந்த அல்லது மதிலில்லாத கிராமத்தையும் குறிக்கின்றன. இரண்டிற்குமுள்ள வேறுபாடு தெளிவாகப் பாதுகாக்கப்பட்டுள்ளது.
- source_word: וְעַד אָבֵל הַגְּדוֹלָה
  choice: பெருங்கல்[a] வரையிலும்
  rationale: மசோரா மெய்யெழுத்துகள் ‘பெரிய ஆபேல்’ என்ற இடப்பெயராக வாசிக்கப்படலாம். ஆனால் அடுத்துவரும் ‘அதன்மேல் பெட்டியை இறக்கிவைத்தார்கள்’ என்ற தொடர்பு வாக்கியம் ஒரு பெரிய கல்லைக் குறிப்பதைச் சூழல் ஆதரிக்கிறது. உண்மையான உரை ambiguity அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
- source_word: אֲשֶׁר הִנִּיחוּ עָלֶיהָ אֵת אֲרוֹן יְהוָה
  choice: அவர்கள் யாவேயின் பெட்டியை இறக்கிவைத்த
  rationale: הִנִּיחוּ என்பது இச்சூழலில் ‘இறக்கிவைத்தார்கள்/வைத்தார்கள்’ என்று பொருள்படும். பயணத்திற்குப் பின் பெட்டியை ஒரு மேற்பரப்பில் வைத்த செயலை ‘இறக்கிவைத்த’ இயல்பாகக் காட்டுகிறது.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: இன்றுவரை ... இருக்கிறது
  rationale: இந்த எபிரெய மரபுத்தொடர் எழுதப்பட்ட காலம்வரை அந்த அடையாளம் தொடர்ந்து இருந்ததைக் குறிக்கிறது. தமிழில் முழுமையான வாக்கியமாக இயல்பாக அமைய ‘இருக்கிறது’ சேர்க்கப்பட்டுள்ளது.
- source_word: בִּשְׂדֵה יְהוֹשֻׁעַ בֵּית הַשִּׁמְשִׁי
  choice: பெத்-ஷெமேசைச் சேர்ந்த யோசுவாவின் வயலில்
  rationale: בֵּית הַשִּׁמְשִׁי என்பது பெத்-ஷெமேசைச் சேர்ந்த ஒருவரைக் குறிக்கும் குடிப்பெயர் வடிவம். தமிழில் தெளிவாகப் புரிய ‘பெத்-ஷெமேசைச் சேர்ந்த’ என விரிக்கப்பட்டுள்ளது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: ஆண்டவர் / யெகோவா
  rationale: மூல உரையில் நான்கெழுத்து இறைப்பெயர் நேரடியாக உள்ளது. அதை பொதுப்பட்டமான ‘ஆண்டவர்’ என்று மாற்றாமல், ‘Yahweh’ என்பதற்குரிய தமிழ் ஒலிபெயர்ப்பாக ‘யாவே’ பயன்படுத்தப்பட்டுள்ளது.
- issue: אֲרוֹן என்பதன் மொழிபெயர்ப்பு
  choice: பெட்டி
  alternative: உடன்படிக்கைப் பெட்டி / பேழை
  rationale: இவ்வசனத்தில் אֲרוֹן மட்டுமே உள்ளது; ‘உடன்படிக்கை’ என்ற சொல் வெளிப்படையாக இல்லை. சூழலில் அது புனிதப் பெட்டி என்பது தெளிவாக இருப்பதால், மூலத்தின் சொற்பரப்பை மீறாமல் ‘யாவேயின் பெட்டி’ என வழங்கப்பட்டுள்ளது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் வேதாகம வரலாற்றுரைக்கு ஏற்ற கண்ணியமான நடையிலும் மொழிபெயர்க்கப்பட்டுள்ளது. நீண்ட எபிரெய வாக்கியம் தெளிவுக்காக இரண்டு தமிழ் வாக்கியங்களாகப் பிரிக்கப்பட்டுள்ளது; பட்டணங்களின் பரப்பைக் காட்டும் ‘தொடங்கி ... வரையிலும்’ அமைப்பு பாதுகாக்கப்பட்டுள்ளது.
