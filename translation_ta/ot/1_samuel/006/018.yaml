- from: 'பெலிஸ்தியர்களின் ஐந்து ஆட்சியாளர்களுக்கு உட்பட்ட எல்லாப் பட்டணங்களின் எண்ணிக்கைப்படியே தங்க எலிகளும் இருந்தன: அரணுள்ள பட்டணம் தொடங்கி மதிலில்லாத கிராமம் வரையிலும், அவர்கள் யாவேயின் பெட்டியை இறக்கிவைத்த பெருங்கல்[a] வரையிலும். அந்தக் கல் இன்றுவரை பெத்-ஷெமேசைச் சேர்ந்த யோசுவாவின் வயலில் இருக்கிறது.'
