translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்கு எளிதாகவும் கண்ணியமாகவும் இருக்கும் நடை பயன்படுத்தப்பட்டுள்ளது. எபிரேயக் கதைநடையின் தொடர்ச்சியைத் தமிழில் மிகையாக ‘மேலும்’ அல்லது ‘அப்போது’ என்று சேர்க்காமல், இயல்பான வாக்கியப் பிரிப்பால் வெளிப்படுத்தியுள்ளது.
