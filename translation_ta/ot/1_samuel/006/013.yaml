    text: எபிரேய மொழியில், “தங்கள் கண்களை உயர்த்தினார்கள்”; இது அவர்கள் நிமிர்ந்து பார்த்தார்கள் என்னும் பொருளுடைய மரபுத்தொடர்.
    reason: lexical_alternative
