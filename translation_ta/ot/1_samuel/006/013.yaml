  text: וּ/בֵ֣ית שֶׁ֔מֶשׁ קֹצְרִ֥ים קְצִיר חִטִּ֖ים בָּ/עֵ֑מֶק וַ/יִּשְׂא֣וּ אֶת עֵינֵי/הֶ֗ם וַ/יִּרְאוּ֙ אֶת הָ֣/אָר֔וֹן וַֽ/יִּשְׂמְח֖וּ לִ/רְאֽוֹת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/006/013.yaml
  text: The people of Beth-shemesh were reaping the wheat harvest in the valley[a], and they lifted up their eyes and saw the ark, and they rejoiced to see it.
translation:
  language: ta
  text: பெத்-ஷெமேஷ் மக்கள் பள்ளத்தாக்கில் கோதுமையை அறுவடை செய்துகொண்டிருந்தார்கள். அவர்கள் கண்களை உயர்த்திப் பார்த்தார்கள்[a]; பேழையைக் கண்டார்கள்; அதைக் கண்டு மகிழ்ந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரேய மொழியில், “தங்கள் கண்களை உயர்த்தினார்கள்”; இது அவர்கள் நிமிர்ந்து பார்த்தார்கள் என்னும் பொருளுடைய மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבֵית שֶׁמֶשׁ
  choice: பெத்-ஷெமேஷைச் சேர்ந்தவர்கள்
  rationale: இடப்பெயரே எழுவாயாக வந்தாலும், அதனுடன் பன்மை வினை வடிவங்கள் இருப்பதால் அந்த ஊரின் மக்களைக் குறிக்கும் ஆகுபெயராகப் புரிந்துகொள்ளப்படுகிறது. பாலினத்தைத் தேவையின்றிக் குறிப்பிடாமல் இதை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: קֹצְרִים קְצִיר חִטִּים
  choice: கோதுமையை அறுவடை செய்துகொண்டிருந்தார்கள்
  rationale: பன்மைப் பங்கேற்புவினை அப்போது தொடர்ந்து நடைபெற்றுக்கொண்டிருந்த பின்னணிச் செயலைக் காட்டுகிறது; தமிழ் தொடர்நிலை வடிவம் அதை இயல்பாகப் பாதுகாக்கிறது.
- source_word: בָּעֵמֶק
  choice: பள்ளத்தாக்கில்
  rationale: עֵמֶק என்பது பள்ளத்தாக்கை அல்லது விரிந்த தாழ்நிலப் பகுதியைக் குறிக்கலாம்; இங்கு ‘பள்ளத்தாக்கு’ நேரடியான, பொதுவாகப் புரியும் தெரிவாகும்.
- source_word: וַיִּשְׂאוּ אֶת עֵינֵיהֶם
  choice: அவர்கள் நிமிர்ந்து பார்த்தபோது[a]
  rationale: சொல்லுக்கு சொல் வடிவத்தைத் திணிக்காமல், மேலே அல்லது முன்புறம் பார்வையை உயர்த்திப் பார்த்தார்கள் என்ற எபிரேய மரபுத்தொடரின் இயல்பான தமிழ் பொருளைத் தருகிறது; மூலத்தின் உருவகம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: וַיִּרְאוּ אֶת הָאָרוֹן
  choice: பெட்டியைக் கண்டார்கள்
  rationale: אָרוֹן என்பதன் அடிப்படைப் பொருள் பெட்டி அல்லது பேழை. முந்தைய நிகழ்ச்சிகள் எந்தப் பெட்டியைக் குறிக்கின்றன என்பதைத் தெளிவாக்குவதால், மூலத்தில் இல்லாத ‘உடன்படிக்கை’ அல்லது ‘தேவனுடைய’ என்ற விளக்கத்தை இங்கு சேர்க்கவில்லை.
- source_word: וַיִּשְׂמְחוּ לִרְאוֹת
  choice: அதைக் கண்டு மகிழ்ந்தார்கள்
  rationale: לִרְאוֹת என்பது அவர்கள் மகிழ்ந்ததற்கான சந்தர்ப்பத்தைச் சுட்டுகிறது. எபிரேயத்தில் மறைமுகமாக உள்ள செயப்படுபொருள் தமிழில் முன்சொன்ன பெட்டியைக் குறிக்கும் ‘அது’ என இயல்பாக வெளிப்படுத்தப்பட்டுள்ளது.
