base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/006/011.yaml
  text: Then they put the ark of Yahweh on the cart[a], along with the box and the gold mice and the images of their tumors.
translation:
  language: ta
  text: பின்பு அவர்கள் யாவேயின் உடன்படிக்கைப் பெட்டியையும், அந்தப் பெட்டியையும், தங்க எலிகளையும், அவர்களுடைய வீக்கங்களின்[a] உருவங்களையும் வண்டியின்மேல் வைத்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘கட்டிகள்’; ஒருவேளை ‘மூலநோய்க் கட்டிகள்.’
    reason: טְחֹרִים குறிக்கும் நோயின் துல்லியமான தன்மை உறுதியில்லை; ‘வீக்கங்கள்,’ ‘கட்டிகள்,’ அல்லது குறிப்பாக மூலநோயுடன் தொடர்புடைய வீக்கங்கள் எனப் புரிந்துகொள்ளலாம்.
lexical_decisions:
- source_word: וַיָּשִׂמוּ
  choice: பின்பு அவர்கள் ... வைத்தார்கள்
  rationale: வழக்குரைத்தொடரின் அடுத்த நிகழ்வை wayyiqtol முன்னெடுக்கிறது; ‘பின்பு’ அதன் தொடர்ச்சியைக் காட்டுகிறது, ‘வைத்தார்கள்’ இயல்பான நவீனத் தமிழ்.
- source_word: אֲרוֹן יְהוָה
  choice: யாவேயின் உடன்படிக்கைப் பெட்டி
  rationale: இச்சூழலில் אֲרוֹן இஸ்ரவேலின் புனிதப் பெட்டியைக் குறிக்கிறது. சாதாரண பெட்டியிலிருந்து தெளிவாக வேறுபடுத்த ‘உடன்படிக்கைப் பெட்டி’ பயன்படுத்தப்படுகிறது; יְהוָה தனிப்பட்ட இறைப்பெயராக ‘யாவே’ என ஒலிபெயர்க்கப்படுகிறது.
- source_word: אֶל הָעֲגָלָה
  choice: வண்டியின்மேல்
  rationale: வண்டி என்ற மேற்பரப்பு/வாகனத்தில் பொருளை வைப்பதை இயல்பான தமிழில் ‘வண்டியின்மேல்’ தெரிவிக்கிறது.
- source_word: הָאַרְגַּז
  choice: அந்தப் பெட்டி
  rationale: காணிக்கைப் பொருட்களை வைத்த கொள்கலனைச் சுட்டுகிறது. ‘அந்தப் பெட்டி’ தெளிவான நவீனச் சொல்; அது உடன்படிக்கைப் பெட்டியுடன் குழப்பமடையாமல் முன்னைய சொல்லாக்கம் வேறுபடுத்துகிறது.
- source_word: עַכְבְּרֵי הַזָּהָב
  choice: தங்க எலிகள்
  rationale: ‘தங்கத்தால் செய்யப்பட்ட எலிகள்’ என்ற பொருளைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: צַלְמֵי
  choice: உருவங்கள்
  rationale: செய்யப்பட்ட பிரதிநிதித்துவ வடிவங்கள் அல்லது மாதிரிகளைக் குறிக்கும் צֶלֶם என்பதற்கு ‘உருவங்கள்’ இயல்பானதும் துல்லியமானதும்.
- source_word: טְחֹרֵיהֶם
  choice: அவர்களுடைய வீக்கங்கள்
  rationale: நோயின் துல்லியமான மருத்துவ இயல்பு விவாதத்திற்குரியது. ‘வீக்கங்கள்’ மூலச்சொல்லின் பரந்த பொருளைப் பாதுகாத்து தேவையற்ற மருத்துவத் துல்லியத்தைத் தவிர்க்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் பட்டப்பெயர் அல்ல, நான்கு எழுத்துகளைக் கொண்ட தனிப்பட்ட இறைப்பெயரே நேரடியாக உள்ளது. எனவே அதை ஒரு பட்டப்பெயரால் மாற்றாமல் தமிழில் ஒலிபெயர்க்கப்படுகிறது.
- issue: אֲרוֹן என்பதன் அடையாளம்
  choice: உடன்படிக்கைப் பெட்டி
  alternative: பேழை
  rationale: இது வழக்கமான பெட்டி அல்ல, இஸ்ரவேலின் புனித உடன்படிக்கைப் பெட்டி என்பதைச் சூழல் தெளிவாக்குகிறது. ‘உடன்படிக்கைப் பெட்டி’ சாதாரண வாசகருக்கு அதன் அடையாளத்தைத் தெளிவாகக் காட்டுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் எளிமையும் கண்ணியமும் பேணப்பட்டுள்ளன. ஒரே வசனத்தில் வரும் புனித אֲרוֹן மற்றும் சாதாரண אַרְגַּז ஆகியவற்றை முறையே ‘உடன்படிக்கைப் பெட்டி’ மற்றும் ‘அந்தப் பெட்டி’ என வேறுபடுத்தியுள்ளோம். நோயின் தெளிவற்ற அடையாளம் முதன்மை உரையிலும் அடிக்குறிப்பிலும் பாதுகாக்கப்பட்டுள்ளது.
