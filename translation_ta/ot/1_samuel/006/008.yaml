translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான அறிவுறுத்தல் நடை பயன்படுத்தப்பட்டுள்ளது. ‘வையுங்கள்,’ ‘அனுப்பிவிடுங்கள்,’ ‘போகட்டும்’ ஆகியவை பன்மை/மரியாதைக் கட்டளை வடிவத்தை ஒரே சீராகப் பேணுகின்றன. ஆங்கில ஆலோசனை உரையில் அடிக்குறிப்பு குறிகள் தவறான சொற்களுடன் இணைக்கப்பட்டிருந்ததால், தமிழில் [a] தங்கப் பொருட்கள், [b] பெட்டி, [c] போகட்டும் ஆகியவற்றோடு பொருத்தமாக அமைக்கப்பட்டுள்ளன.
