- source_word: כְּלֵי הַזָּהָב
  choice: தங்கப் பொருட்கள்
  rationale: כְּלִי என்பது பொருள், பாத்திரம், கருவி போன்ற பரந்த பொருளுடைய சொல். சூழலில் உருவங்களைக் குறிப்பதால், குறிப்பிட்ட வகையைத் திணிக்காத ‘பொருட்கள்’ ஏற்றது.
- source_word: הֲשֵׁבֹתֶם לוֹ
  choice: அவருக்கு நீங்கள் திருப்பி அனுப்பும்
  rationale: שוב என்பதன் ஹிஃபில் வடிவம் இங்கு ‘திருப்பிக் கொடுத்தல்/அனுப்புதல்’ என்று பொருள்படுகிறது. ஆண்பால் ஒருமைப் பெயர்ச்சுட்டை யாவேயைக் குறிப்பதாக ‘அவருக்கு’ என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: אָשָׁם
  choice: குற்றநிவாரணக் காணிக்கை
  rationale: இது குற்றத்தோடும் அதற்கான ஈடுசெய்தலோடும் தொடர்புடைய பலிவகையைக் குறிக்கும் வழிபாட்டுச் சொல். ‘குற்றநிவாரணக் காணிக்கை’ அந்தச் சிறப்புப் பொருளைத் தக்கவைக்கிறது.
- source_word: בָאַרְגַּז
  choice: ஒரு பெட்டியில்
  rationale: אַרְגָּז என்பது பெட்டி அல்லது பேழையைக் குறிக்கிறது. இங்கு ‘பெட்டி’ எளிமையான நவீனத் தமிழாகும்.
- source_word: מִצִּדּוֹ
  choice: உடன்படிக்கைப் பெட்டியின் பக்கத்தில்
  rationale: பின்னொட்டு இயல்பாக முன் குறிப்பிடப்பட்ட யாவேயின் பெட்டியைக் குறிக்கிறது. தமிழில் சுட்டுப்பெயர் குழப்பத்தைத் தவிர்க்க பெயர் மீண்டும் கூறப்பட்டுள்ளது.
- source_word: וְשִׁלַּחְתֶּם אֹתוֹ
  choice: அதை அனுப்பிவிடுங்கள்
  rationale: שׁלח இங்கு அனுப்புதல் அல்லது விடுவித்தல் என்னும் பொருளில் வருகிறது. ‘அனுப்பிவிடுங்கள்’ அறிவுறுத்தலின் இயல்பான தமிழ்நடையைத் தருகிறது.
- source_word: וְהָלָךְ
  choice: அது போகட்டும்
  rationale: சொல்லுக்குச் சொல் ‘அது போகும்’ என்றாலும், கட்டளைகளின் தொடரில் இது அனுமதி அல்லது இறுதி அறிவுறுத்தலாகச் செயல்படுகிறது. ‘போகட்டும்’ அந்தத் தொனியைப் பாதுகாக்கிறது.
