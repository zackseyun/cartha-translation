base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/006/008.yaml
  text: Then take the ark of Yahweh and place it on the cart[a], and put the gold objects that you are returning to him as a guilt offering in a box beside it. Then send it away[c][b], and let it go.
translation:
  language: ta
  text: பின்பு யாவேயின் பேழையை எடுத்து அந்த வண்டியில் வையுங்கள். அவருக்குக் குற்றநிவாரணக் காணிக்கையாக நீங்கள் திருப்பிச் செலுத்தும் தங்கப் பொருட்களை[a] ஒரு பெட்டியில்[b] வைத்து, அதைப் பேழையின் பக்கத்தில் வையுங்கள். பிறகு அதை அனுப்பிவிடுங்கள்; அது போகட்டும்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘தங்கப் பொருட்கள்’ என்பதை ‘தங்கத்தாலான பொருள்கள்’ அல்லது ‘தங்கப் பாத்திரங்கள்’ என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் பலவகையான பொருட்களைக் குறிக்கக்கூடிய பரந்த சொல்.
    reason: lexical_alternative
  - marker: b
    text: ‘ஒரு பெட்டியில்’ என்பதை ‘ஒரு பேழையில்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: எபிரெயத்தில் நேரடியாக, ‘அது போகும்.’ அறிவுறுத்தல்களின் இத்தொடரில், ‘அதை அனுப்பிவிடுங்கள்; அது போகட்டும்’ என்ற இறுதிக் கட்டளையின் பொருளில் வருகிறது.
    reason: lexical_alternative
