  register: நவீனத் தரத் தமிழில், கண்ணியமான வரலாற்றுக் கதைநடை பயன்படுத்தப்பட்டுள்ளது. இடப்பெயர் ‘பெத்-ஷெமேஸ்’ என ஒலிபெயர்க்கப்பட்டுள்ளது. மூலத்தின் தொடர்ச்சியான நகர்வும் பாதையிலிருந்து விலகாமையும் தெளிவாகப் பாதுகாக்கப்பட்டுள்ளன.
