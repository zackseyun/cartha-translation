base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/006/012.yaml
  text: And the cows went straight on the road toward Beth-shemesh[a], along one highway; they went on, lowing as they went, and did not turn aside to the right or to the left[c][b]. And the lords of the Philistines were walking behind them as far as the border of Beth-shemesh.
translation:
  language: ta
  text: அந்தப் பசுக்கள் பெத்-ஷெமேசுக்குச் செல்லும் பாதையில் நேராகச் சென்றன. அவை ஒரே சாலையில், கனைத்துக்கொண்டே தொடர்ந்து சென்றன; வலப்புறமோ இடப்புறமோ விலகவில்லை. பெலிஸ்திய ஆட்சியாளர்கள் அவற்றின் பின்னால் பெத்-ஷெமேசின் எல்லைவரை நடந்து சென்றார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִשַּׁרְנָה
  choice: நேராகச் சென்றன
  rationale: ישר வினை இங்கு நேரான, விலகாத பயணத்தைச் சுட்டுகிறது; நவீனத் தமிழில் இயல்பாகவும் துல்லியமாகவும் அமைகிறது.
- source_word: הַפָּרוֹת
  choice: அந்தப் பசுக்கள்
  rationale: உடனடி சூழலில் வண்டியில் பூட்டப்பட்ட கறவைப் பசுக்கள் குறிக்கப்படுகின்றன; ‘பசுக்கள்’ என்பது இயல்பான பொதுப்பெயர்.
- source_word: בַּדֶּרֶךְ עַל דֶּרֶךְ בֵּית שֶׁמֶשׁ
  choice: பெத்-ஷெமேசுக்குச் செல்லும் பாதையில்
  rationale: எபிரெயச் சொற்றொடர் குறிப்பிட்ட இலக்கை நோக்கிய பாதையை வலியுறுத்துகிறது; தமிழில் தேவையற்ற மறுபடியுரைத்தலைத் தவிர்த்து இலக்கையும் வழியையும் காக்கிறது.
- source_word: בִּמְסִלָּה אַחַת
  choice: ஒரே சாலையில்
  rationale: מְסִלָּה என்பது அமைக்கப்பட்ட சாலை அல்லது பெருவழியைக் குறிக்கலாம்; אַחַת அவை ஒரே வழியையே பின்பற்றியதை வலியுறுத்துகிறது.
- source_word: הָלְכוּ הָלוֹךְ
  choice: தொடர்ந்து சென்றன
  rationale: முற்றுவினையுடன் சேர்ந்த வினையெச்சத்தின் நீடித்த செயல் வலிமையை ‘தொடர்ந்து’ தெளிவாக வெளிப்படுத்துகிறது.
- source_word: וְגָעוֹ
  choice: கத்திக்கொண்டே
  rationale: இது மாடுகள் எழுப்பும் குரலைக் குறிக்கிறது. ‘கத்திக்கொண்டே’ என்பது சாதாரண வாசகர்களுக்குப் புரியும் இயல்பான தமிழ்; பயணம் முழுவதும் ஒலி தொடர்ந்ததையும் காட்டுகிறது.
- source_word: וְלֹא סָרוּ יָמִין וּשְׂמֹאול
  choice: வலப்புறமோ இடப்புறமோ விலகவில்லை
  rationale: סור என்பதின் பாதையிலிருந்து விலகுதல் என்ற பொருளையும், எபிரெய மொழிமரபின் இருபக்கக் குறிப்பையும் காக்கிறது.
- source_word: וְסַרְנֵי פְלִשְׁתִּים
  choice: பெலிஸ்திய ஆட்சியாளர்கள்
  rationale: סֶרֶן என்பது பெலிஸ்திய நகர-அரசியல் தலைவர்களுக்கான தனிப்பட்ட பட்டம்; ‘ஆட்சியாளர்கள்’ அதன் அரசியல் பணியை இயல்பாகத் தெரிவிக்கிறது.
- source_word: הֹלְכִים אַחֲרֵיהֶם
  choice: அவற்றின் பின்னால் ... நடந்து சென்றார்கள்
  rationale: பங்கேற்புவினையின் தொடர்ச்சியையும் பசுக்களை உடல்முறையில் பின்தொடர்ந்ததையும் வெளிப்படுத்துகிறது.
- source_word: עַד גְּבוּל בֵּית שָׁמֶשׁ
  choice: பெத்-ஷெமேசின் எல்லைவரை
  rationale: גְּבוּל இங்கு அப்பகுதியின் எல்லை அல்லது வரம்பைக் குறிக்கிறது; ‘எல்லைவரை’ சுருக்கமாகவும் புவியியல் சூழலுக்குப் பொருத்தமாகவும் உள்ளது.
