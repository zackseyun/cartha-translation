source:
  edition: WLC
  text: וּ/רְאִיתֶ֗ם אִם דֶּ֨רֶךְ גְּבוּל֤/וֹ יַֽעֲלֶה֙ בֵּ֣ית שֶׁ֔מֶשׁ ה֚וּא עָ֣שָׂה לָ֔/נוּ אֶת הָ/רָעָ֥ה הַ/גְּדוֹלָ֖ה הַ/זֹּ֑את וְ/אִם לֹ֗א וְ/יָדַ֨עְנוּ֙ כִּ֣י לֹ֤א יָד/וֹ֙ נָ֣גְעָה בָּ֔/נוּ מִקְרֶ֥ה ה֖וּא הָ֥יָה לָֽ/נוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/006/009.yaml
  text: 'And watch: if it goes up by the way of its territory to Beth-shemesh[a], then he is the one who has done this great harm to us; but if not, then we will know that it was not his hand that struck us[b]; it happened to us by chance.'
translation:
  language: ta
  text: 'நீங்கள் கவனித்துப் பாருங்கள்: அது அதற்குரிய எல்லை வழியாக பெத்-ஷெமேஷுக்கு ஏறிச் சென்றால், இந்தப் பெரும் தீங்கை நமக்குச் செய்தவர் அவரே; அப்படி இல்லையென்றால், நம்மைத் தாக்கியது அவருடைய கை அல்ல என்பதை நாம் அறிந்துகொள்வோம்; அது தற்செயலாக நமக்கு நேர்ந்தது.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “தற்செயலாக நமக்கு நேர்ந்தது” என்பதை “இது நமக்கு நேர்ந்த ஒரு தற்செயல் நிகழ்வு” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּרְאִיתֶם
  choice: நீங்கள் கவனித்துப் பாருங்கள்
  rationale: ראה என்பதன் பன்மை ஏவல் வடிவம் இங்கு வண்டியின் போக்கைக் கவனித்து சோதனையின் முடிவை அறியும்படி அழைக்கிறது.
- source_word: דֶּרֶךְ גְּבוּלוֹ
  choice: தனது எல்லைக்குச் செல்லும் பாதையில்
  rationale: דֶּרֶךְ என்பது பாதை/வழி என்றும் גְּבוּל என்பது எல்லை அல்லது ஆட்சிப்பகுதி என்றும் பொருள்படும். பின்னொட்டு எதைக் குறிக்கிறது என்பதில் சிறு தெளிவின்மை உள்ளதால், மூலத்தின் வடிவம் இயன்றவரை காக்கப்படுகிறது.
- source_word: יַעֲלֶה
  choice: ஏறிச் சென்றால்
  rationale: עלה என்பதன் அடிப்படை இயக்கப் பொருளான ‘மேலே செல்லுதல்/ஏறிச் செல்லுதல்’ பெத்-ஷெமேசை நோக்கிய நிலவியல் பயணத்திற்குப் பொருந்துகிறது.
- source_word: בֵּית שֶׁמֶשׁ
  choice: பெத்-ஷெமேஸ்
  rationale: இடப்பெயர் நவீனத் தமிழில் ஒலிபெயர்க்கப்பட்டது.
- source_word: הוּא עָשָׂה לָנוּ
  choice: நமக்குச் செய்தவர் அவரே
  rationale: தனியே வரும் הוּא தரும் வலியுறுத்தலை ‘அவரே’ என்பதன் மூலம் காக்கிறது.
- source_word: הָרָעָה הַגְּדוֹלָה הַזֹּאת
  choice: இந்தப் பெரும் தீங்கு
  rationale: רָעָה இச்சூழலில் ஒழுக்கத் தீமையை மட்டும் அல்லாமல் தீங்கு, பேரிடர், கடும் துன்பம் ஆகியவற்றையும் குறிக்கலாம்; ‘தீங்கு’ செயற்பாட்டின் கடுமையை இயல்பாகத் தெரிவிக்கிறது.
- source_word: יָדוֹ נָגְעָה בָּנוּ
  choice: நம்மைத் தாக்கியது அவருடைய கை
  rationale: ‘கை’ என்ற மூல உருவகத்தைத் தக்கவைத்து, נגע என்பதன் இச்சூழலிலான தண்டனை/வாதிப்பு வலிமையை ‘தாக்கியது’ தெரிவிக்கிறது.
- source_word: מִקְרֶה הוּא הָיָה לָנוּ
  choice: அது தற்செயலாக நமக்கு நேர்ந்தது
  rationale: מִקְרֶה என்பதன் ‘தற்செயல் நிகழ்வு’ என்ற பொருளை இயல்பான நவீனத் தமிழில் அளிக்கிறது.
theological_decisions:
- issue: தெய்வச் செயலுடன் தொடர்புடைய רָעָה என்பதன் மொழிபெயர்ப்பு
  choice: இந்தப் பெரும் தீங்கு
  alternative: இந்தப் பெரும் பேரிடர் / இந்தப் பெரும் கேடு
  rationale: தேவன் ஒழுக்கத் தீமை செய்தார் என்று தேவையின்றிக் குறிப்பதைக் தவிர்த்து, அதேவேளை வசனம் கூறும் கடுமையான தாக்கத்தையும் நீதித்தீர்ப்பின் பதற்றத்தையும் மென்மைப்படுத்தாமல் காக்கிறது.
- issue: நிகழ்வு தேவனுடைய செயலா அல்லது தற்செயலா என்ற பெலிஸ்தியரின் சோதனை
  choice: அவருடைய கை அல்ல ... தற்செயலாக
  alternative: அவர் நம்மை வாதிக்கவில்லை ... இது ஒரு தற்செயல் நிகழ்வு
  rationale: பேசுவோரின் மாற்று விளக்கங்கள் இரண்டையும் தீர்மானித்து விடாமல், வசனத்தில் உள்ள இறையியல் பதற்றத்தோடு அப்படியே முன்வைக்கிறது.
translation_notes:
  register: மரியாதையும் இயல்பும் கொண்ட நவீனத் தரத் தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘அவரே’, ‘அவருடைய கை’ என்பவை சூழலில் இஸ்ரவேலின் தேவனைக் குறிக்கின்றன. அனைத்து அடிக்குறிப்பு குறிகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
