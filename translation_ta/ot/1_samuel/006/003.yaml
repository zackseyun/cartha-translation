base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/006/003.yaml
  text: And they said[a], “If you are sending away the ark of the God of Israel, do not send it away empty, for you must surely return to him a guilt offering. Then you will be healed[b], and it will be made known to you why his hand has not turned away from you.”
translation:
  language: ta
  text: அவர்கள், “இஸ்ரவேலின் கடவுளுடைய பெட்டியை அனுப்பிவிடுகிறீர்கள் என்றால், அதை ஒன்றுமில்லாமல் அனுப்பாதீர்கள். அவருக்குக் குற்றநிவாரணக் காணிக்கையை[a] கண்டிப்பாகச் செலுத்த வேண்டும். அப்போது நீங்கள் குணமடைவீர்கள்; அவருடைய கை[b] உங்களைவிட்டு ஏன் விலகவில்லை என்பது உங்களுக்குத் தெரியவரும்” என்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ஈடுசெய்யும் காணிக்கை’ என்றும் மொழிபெயர்க்கலாம்; மரபாக, ‘குற்றநிவாரணப் பலி.’
    reason: lexical_alternative
  - marker: b
    text: ‘அவருடைய கை’ என்பது கடவுள் தமது வல்லமையால் தண்டிப்பதைக் குறிக்கும் பொதுவான எபிரெய மரபுத்தொடர்.
    reason: cultural_note
lexical_decisions:
- source_word: מְשַׁלְּחִים / תְּשַׁלְּחוּ
  choice: அனுப்பிவிடுகிறீர்கள் / அனுப்பாதீர்கள்
  rationale: பெலிஸ்தியரின் கட்டுப்பாட்டிலிருந்து பெட்டியை வெளியே அனுப்புவதைக் குறிக்கும் சூழலை ‘அனுப்பிவிடு’ இயல்பாக வெளிப்படுத்துகிறது; எபிரெயச் சொல்லின் மீளுருவாக்கமும் தமிழில் காக்கப்படுகிறது.
- source_word: אֲרוֹן אֱלֹהֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் கடவுளுடைய பெட்டி
  rationale: மூலத்திலுள்ள உரிமைத் தொடர்பை நேரடியாகக் காக்கிறது; இவ்வசனத்தில் இல்லாத ‘உடன்படிக்கைப் பெட்டி’ என்ற விரிவாக்கத்தைச் சேர்க்கவில்லை.
- source_word: רֵיקָם
  choice: ஒன்றுமில்லாமல்
  rationale: பெட்டியுடன் ஈடுசெய்யும் காணிக்கை எதுவும் இல்லாமல் அனுப்பக்கூடாது என்ற பொருளைத் தெளிவான, இயல்பான தமிழில் தருகிறது.
- source_word: הָשֵׁב תָּשִׁיבוּ
  choice: கண்டிப்பாகச் செலுத்த வேண்டும்
  rationale: வினைமுற்றுடன் வரும் எபிரெய infinitive absolute தரும் வலியுறுத்தலையும் கடமையையும் தமிழில் இயல்பாக வெளிப்படுத்துகிறது. காணிக்கையைத் ‘திருப்பிக் கொடுப்பது’ என்ற சொற்படி வடிவத்தைவிட, ஈடுசெய்யும் சூழலில் ‘செலுத்துதல்’ தெளிவாக உள்ளது.
- source_word: לּוֹ
  choice: அவருக்கு
  rationale: ஆண்பால் ஒருமை பின்னொட்டு மிக இயல்பாக இஸ்ரவேலின் கடவுளைக் குறிக்கிறது; பெட்டியை உயிரற்ற பொருளாகக் குறிக்கும் ‘அதற்கு’ என்பதைத் தவிர்க்கிறது.
- source_word: אָשָׁם
  choice: குற்றநிவாரணக் காணிக்கை
  rationale: குற்றத்திற்கான பொறுப்பையும் அதற்காகச் செய்யப்படும் ஈடுசெய்தலையும் உள்ளடக்கும் சொல்லாகும். இச்சூழலில் பொன்னால் செய்யப்பட்ட பொருட்கள் கொடுக்கப்படுவதால் ‘பலி’ என்பதைக் காட்டிலும் ‘காணிக்கை’ பொருத்தமானது.
- source_word: תֵּרָפְאוּ
  choice: நீங்கள் குணமடைவீர்கள்
  rationale: רפא என்பதன் Niphal வடிவத்திலுள்ள செயல்பாட்டு விளைவையும், தாக்குதலிலிருந்து விடுபட்டு நலம்பெறும் சூழலையும் காக்கிறது.
- source_word: וְנוֹדַע לָכֶם
  choice: உங்களுக்குத் தெரியவரும்
  rationale: எபிரெய மொழியின் செயப்படுபொருள்/தனிப்பட்ட எழுவாயில்லாத அமைப்பை இயல்பான தமிழில் பிரதிபலிக்கிறது.
- source_word: לָמָּה לֹא תָסוּר יָדוֹ מִכֶּם
  choice: அவருடைய கை உங்களைவிட்டு ஏன் விலகவில்லை
  rationale: தீர்ப்பளிக்கும் கடவுளின் வல்லமையைக் குறிக்கும் ‘கை’ என்ற முக்கிய எபிரெய உருவகத்தை விளக்க மொழிபெயர்ப்பால் மாற்றாமல் காக்கிறது.
