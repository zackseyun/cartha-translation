  rationale: இந்த உருவகம் பழைய ஏற்பாட்டில் முக்கியமானதும் இங்கு புரிந்துகொள்ளக்கூடியதுமாக இருப்பதால், அதை விளக்கப் பொருளால் மாற்றுவது தேவையற்ற பொருள் தீர்மானத்தைச் சேர்க்கும்.
