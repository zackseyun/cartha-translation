  text: וַ/עֲשִׂיתֶם֩ צַלְמֵ֨י עפלי/כם וְ/צַלְמֵ֣י עַכְבְּרֵי/כֶ֗ם הַ/מַּשְׁחִיתִם֙ אֶת הָ/אָ֔רֶץ וּ/נְתַתֶּ֛ם לֵ/אלֹהֵ֥י יִשְׂרָאֵ֖ל כָּב֑וֹד אוּלַ֗י יָקֵ֤ל אֶת יָד/וֹ֙ מֵֽ/עֲלֵי/כֶ֔ם וּ/מֵ/עַ֥ל אֱלֹהֵי/כֶ֖ם וּ/מֵ/עַ֥ל אַרְצְ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/006/005.yaml
  text: So make images of your tumors and images of your mice that are ravaging the land[a], and give glory to the God of Israel. Perhaps he will lighten his hand from upon you, and from upon your gods, and from upon your land.
translation:
  language: ta
  text: ஆகவே, உங்கள் கட்டிகளைப் போன்ற உருவங்களையும், நாட்டை அழித்துவரும் உங்கள் எலிகளைப் போன்ற உருவங்களையும் செய்து, இஸ்ரவேலின் கடவுளுக்கு மகிமை செலுத்துங்கள். ஒருவேளை அவர் தம் கையின் பாரத்தை உங்கள்மேலிருந்தும், உங்கள் தெய்வங்கள்மேலிருந்தும், உங்கள் நாட்டின்மேலிருந்தும் குறைப்பார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַעֲשִׂיתֶם
  choice: ஆகவே ... செய்து
  rationale: தொடர்ச்சியில் விளையும் அறிவுறுத்தலைக் காட்டும் வினைவடிவம்; சூழலின் காரணவிளைவு தொடர்பை ‘ஆகவே’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: צַלְמֵי
  choice: உருவங்கள்
  rationale: செய்து வைக்கப்படும் பிரதிகள் அல்லது வடிவங்களைக் குறிக்கும் צלם என்பதற்கு இயல்பான தமிழ் சொல்.
- source_word: עפליכם
  choice: உங்கள் கட்டிகள்
  rationale: உடலில் ஏற்பட்ட வீக்கங்கள் அல்லது கட்டிகளைக் குறிக்கும் பொதுவான வாசிப்பு; குறிப்பிட்ட உடல்நிலையாகத் தீர்மானிப்பதைத் தவிர்க்கிறது.
- source_word: וְצַלְמֵי עַכְבְּרֵיכֶם
  choice: உங்கள் எலிகளின் உருவங்களையும்
  rationale: עכבר என்பதன் வழக்கமான பொருள் எலி; உருவங்களைச் செய்யும் அறிவுறுத்தலைத் தெளிவாகக் காக்கிறது.
- source_word: הַמַּשְׁחִיתִם אֶת הָאָרֶץ
  choice: நாட்டை அழித்துவரும்
  rationale: நடந்துகொண்டிருக்கும் அழிவுச் செயலை எபிரேயப் பங்கேற்புவினை உணர்த்துவதால் ‘அழித்துவரும்’ என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: וּנְתַתֶּם ... כָּבוֹד
  choice: மகிமை செலுத்துங்கள்
  rationale: கடவுளின் வல்லமையை ஏற்றுக்கொண்டு அவருக்கு כבוד அளிப்பதைக் குறிக்கும் இயல்பான, இறையியல் நிறை கொண்ட தமிழ் வெளிப்பாடு.
- source_word: לֵאלֹהֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் கடவுளுக்கு
  rationale: எபிரேய இணைப்புத் தொடரின் நேரான, நவீனத் தமிழ் மொழிபெயர்ப்பு.
- source_word: אוּלַי
  choice: ஒருவேளை
  rationale: உறுதியல்லாத நம்பிக்கை அல்லது சாத்தியத்தைக் குறிக்கும் மூலத்தின் தன்மையைப் பாதுகாக்கிறது.
- source_word: יָקֵל אֶת יָדוֹ
  choice: தமது கையின் பாரத்தைக் குறைப்பார்
  rationale: ‘கையை இலகுவாக்குதல்’ என்ற எபிரேய உருவகத்தை தமிழில் புரியும்படி ‘கையின் பாரத்தைக் குறைத்தல்’ என வழங்கி, ‘கை’ என்ற தெய்வீகச் செயலாற்றல் உருவகத்தையும் காக்கிறது.
- source_word: מֵעֲלֵיכֶם וּמֵעַל אֱלֹהֵיכֶם וּמֵעַל אַרְצְכֶם
  choice: உங்கள்மேலும், உங்கள் தெய்வங்கள்மேலும், உங்கள் நாட்டின்மேலும் இருக்கும்
  rationale: மூலத்தில் மூன்று முறை வரும் ‘மேலிருந்து’ என்ற அமைப்பின் வலியுறுத்தலையும், பெலிஸ்தரின் தெய்வங்களும் அந்தக் கையின் கீழ் இருப்பதையும் காக்கிறது.
theological_decisions:
- issue: עפלים குறிக்கும் நோயின் துல்லியமான தன்மை
  choice: கட்டிகள்
  alternative: மூலநோய்க் கட்டிகள்; வீக்கங்கள்
  rationale: எபிரேயச் சொல் உடல் வீக்கங்கள் அல்லது கட்டிகளைக் குறிக்கிறது; ‘மூலநோய்’ என்பது சாத்தியமான பாரம்பரிய விளக்கம் என்றாலும் உறுதியானதல்ல. எனவே பொதுவான பொருள் முதன்மை உரையில் வைக்கப்பட்டு, குறிப்பான மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- issue: ‘அவருடைய கை’ என்ற மனிதஉருவக மொழி
  choice: தமது கையின் பாரம்
  alternative: தமது வல்லமை; தமது தண்டனை
  rationale: மூலத்தின் ‘கை’ உருவகம் தெய்வீக வல்லமையையும் தாக்கத்தையும் சுமக்கிறது. அதை விளக்கவுரையாக மாற்றாமல், தமிழில் புரிய ‘பாரம்’ என்பதுடன் காக்கப்பட்டுள்ளது.
- issue: பெலிஸ்தரின் தெய்வங்கள் குறிப்பிடப்படுதல்
  choice: உங்கள் தெய்வங்கள்
  alternative: உங்கள் சிலைகள்
  rationale: אֱלֹהֵיכֶם என்பது நேரடியாக ‘உங்கள் தெய்வங்கள்’ என்று கூறுகிறது; அவற்றை ‘சிலைகள்’ என மாற்றுவது மூலத்தின் இறையியல் மற்றும் சொல்லாட்சித் தாக்கத்தைச் சுருக்கும்.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘மகிமை செலுத்துங்கள்’, ‘தமது கையின் பாரம்’ போன்ற சொற்றொடர்கள் மூலத்தின் இறையியல் நிறையையும் உருவகத்தையும் காக்கின்றன; தேவையற்ற பழந்தமிழ் அல்லது சமயப்பிரிவுச் சொற்கள் தவிர்க்கப்பட்டுள்ளன.
