revisions:
- from: ஆகவே, உங்கள் கட்டிகளின்[a] உருவங்களையும், நாட்டை அழித்துவரும் உங்கள் எலிகளின் உருவங்களையும் செய்து, இஸ்ரவேலின் கடவுளுக்கு மகிமை செலுத்துங்கள். ஒருவேளை அவர் உங்கள்மேலும், உங்கள் தெய்வங்கள்மேலும், உங்கள் நாட்டின்மேலும் இருக்கும் தமது கையின் பாரத்தைக் குறைப்பார்.
  to: ஆகவே, உங்கள் கட்டிகளைப் போன்ற உருவங்களையும், நாட்டை அழித்துவரும் உங்கள் எலிகளைப் போன்ற உருவங்களையும் செய்து, இஸ்ரவேலின் கடவுளுக்கு மகிமை செலுத்துங்கள். ஒருவேளை அவர் தம் கையின் பாரத்தை உங்கள்மேலிருந்தும், உங்கள் தெய்வங்கள்மேலிருந்தும், உங்கள் நாட்டின்மேலிருந்தும் குறைப்பார்.
  rationale: The revision improves idiomatic Tamil and makes the referential force of the Hebrew construct phrases explicit. It also more closely preserves the repeated ‘from upon’ structure in the final clause. No change is made to the source sense, ambiguity, theological terminology, or footnote scope.
