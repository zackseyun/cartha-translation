  text: וַ/יַּ֞ךְ בְּ/אַנְשֵׁ֣י בֵֽית שֶׁ֗מֶשׁ כִּ֤י רָאוּ֙ בַּ/אֲר֣וֹן יְהוָ֔ה וַ/יַּ֤ךְ בָּ/עָם֙ שִׁבְעִ֣ים אִ֔ישׁ חֲמִשִּׁ֥ים אֶ֖לֶף אִ֑ישׁ וַ/יִּֽתְאַבְּל֣וּ הָ/עָ֔ם כִּֽי הִכָּ֧ה יְהוָ֛ה בָּ/עָ֖ם מַכָּ֥ה גְדוֹלָֽה־־
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/006/019.yaml
  text: And he struck down some of the men of Beth-shemesh because they had looked into the ark of Yahweh[a]. He struck down seventy men among the people, fifty thousand men[b], and the people mourned because Yahweh had struck the people with a great blow.
translation:
  language: ta
  text: பெத்-ஷேமேசின் சில ஆண்களை யாவேவின் பெட்டிக்குள் பார்த்ததால்[a] அவர் அடித்துக் கொன்றார். மக்களில் எழுபது பேரையும், ஐம்பதாயிரம் பேரையும்[b] அவர் அடித்துக் கொன்றார். யாவே மக்களைப் பெரும் அடியால் தாக்கியதால் மக்கள் துயருற்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யாவேவின் பெட்டியைப் பார்த்ததால்.” எபிரேய முன்னிடைச்சொல்லை பொதுவாக இவ்வாறும் புரிந்துகொள்ளலாம்; இச்சூழலில் “பெட்டிக்குள் பார்த்ததால்” என்பது குற்றத்தின் தன்மையை அதிக வாய்ப்புடன் வெளிப்படுத்துகிறது.
    reason: lexical_alternative
  - marker: b
    text: எபிரேய உரை, “எழுபது பேர், ஐம்பதாயிரம் பேர்” என்று வாசிக்கிறது; இது பொருள் காணக் கடினமான சொற்றொடர். “ஐம்பதாயிரம் பேரில் எழுபது பேர்” அல்லது “ஐம்பதாயிரத்து எழுபது பேர்” என்று இதைப் புரிந்துகொள்ளலாம்; உரைச்சிக்கலும் இருக்கக்கூடும். சில பழங்காலச் சான்றுகள் மிகவும் குறைந்த எண்ணிக்கையை ஆதரிக்கின்றன.
    reason: textual_variant
lexical_decisions:
- source_word: וַיַּךְ
  choice: அடித்துக் கொன்றார்
  rationale: נכה என்பதன் அடிப்படைப் பொருள் ‘அடி/தாக்கு’; இங்கு உயிரிழப்பை ஏற்படுத்திய தண்டனைச் சூழல் உள்ளதால் ‘அடித்துக் கொன்றார்’ என்பது இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: בְּאַנְשֵׁי בֵית שֶׁמֶשׁ
  choice: பெத்-ஷேமேசின் மனிதர்களில் சிலர்
  rationale: בְּ என்பதின் பகுதியைக் குறிக்கும் நுட்பத்தை ‘மனிதர்களில் சிலர்’ வெளிப்படுத்துகிறது; אַנְשֵׁי என்பதற்கேற்ப ஆண்பால் குறிப்பு தக்கவைக்கப்படுகிறது.
- source_word: כִּי רָאוּ בַּאֲרוֹן יְהוָה
  choice: யாவேவின் பெட்டிக்குள் பார்த்ததால்
  rationale: ראה + ב இங்கு ‘பெட்டிக்குள் பார்த்தல்’ என்று பொருள்பட வாய்ப்புள்ளது; ‘பெட்டியைப் பார்த்தல்’ என்பதும் இலக்கண ரீதியாகச் சாத்தியம் என்பதால் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: אֲרוֹן יְהוָה
  choice: யாவேவின் பெட்டி
  rationale: אֲרוֹן என்பதற்கு இச்சூழலில் இயல்பான தமிழ் ‘பெட்டி’; உடன்படிக்கைப் பெட்டியைக் குறித்தாலும் மூலத்தில் இல்லாத ‘உடன்படிக்கை’ இங்கு சேர்க்கப்படவில்லை.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறை பெயரான יהוה ஒரு பட்டமாக மாற்றப்படாமல் ‘யாவே’ என ஒலிபெயர்க்கப்படுகிறது.
- source_word: שִׁבְעִים אִישׁ חֲמִשִּׁים אֶלֶף אִישׁ
  choice: எழுபது பேரை, ஐம்பதாயிரம் பேரை
  rationale: மசோரா எபிரெய உரையின் கடினமான எண் வரிசையைச் சீராக்காமல் முதன்மை உரையில் நேரடியாகப் பாதுகாக்கிறது.
- source_word: וַיִּתְאַבְּלוּ
  choice: துக்கம் அனுசரித்தார்கள்
  rationale: אבל என்பதன் துயருறுதல் அல்லது மரணத்தை முன்னிட்டு துக்கம் அனுசரித்தல் என்ற பொருளை நவீனத் தமிழில் இயல்பாக வழங்குகிறது.
- source_word: מַכָּה גְדוֹלָה
  choice: பெரும் அடி
  rationale: מַכָּה என்பதன் ‘அடி/தாக்கு’ பொருளையும் נכה வினையுடனான சொல் தொடர்பையும் காக்கிறது; ‘கொள்ளைநோய்’ போன்ற குறிப்பிட்ட காரணத்தைப் புகுத்தவில்லை.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் தனிப்பட்ட இறைப் பெயர் நேரடியாக இருப்பதால் அதனைப் பட்டத்தால் மாற்றாமல் ஒலிபெயர்ப்பது மூலச் சான்றுக்கு அணுக்கமானது.
- issue: கடினமான உயிரிழப்பு எண்ணிக்கை
  choice: ‘எழுபது பேரை, ஐம்பதாயிரம் பேரை’ என்ற மசோரா உரை வரிசையைப் பாதுகாத்தல்
  alternative: ‘ஐம்பதாயிரம் பேரில் எழுபது பேர்’ அல்லது ‘ஐம்பதாயிரத்து எழுபது பேர்’ என்று விளக்குதல்
  rationale: எபிரெயச் சொற்றொடர் தெளிவற்றதும் உரை வரலாற்றில் சிக்கலானதும் ஆகும்; எந்த ஓர் விளக்கத்தையும் முதன்மை உரையில் மறைமுகமாகத் தீர்மானிக்காமல் மாற்றுகளை அடிக்குறிப்பில் தெரிவிக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகருக்குப் புரியும் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. கடினமான எண் வரிசை திட்டமிட்டு சீராக்கப்படவில்லை; [a], [b] குறிகள் முதன்மை உரையில் இணைக்கப்பட்டுள்ளன.
