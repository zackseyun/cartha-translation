base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/006/017.yaml
  text: 'And these are the golden tumors that the Philistines returned as a guilt offering to Yahweh: one for Ashdod[a], one for Gaza, one for Ashkelon, one for Gath, one for Ekron.'
translation:
  language: ta
  text: 'பெலிஸ்தியர்கள் யாவேவுக்குக் குற்றநிவாரணக் காணிக்கையாகத் திருப்பி அளித்த தங்கத்தால் செய்யப்பட்ட கட்டி உருவங்கள் இவையே: அஸ்தோத்துக்காக ஒன்று, காசாவுக்காக ஒன்று, அஸ்கலோனுக்காக ஒன்று, காத்துக்காக ஒன்று, எக்ரோனுக்காக ஒன்று.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: இவையே
  rationale: முந்தைய நிகழ்வுடன் தொடர்புபடுத்தி, இப்போது விளக்கப் பட்டியலை அறிமுகப்படுத்தும் எபிரெயச் சொற்றொடரின் வலியுறுத்தலை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: טְחֹרֵי הַזָּהָב
  choice: தங்கக் கட்டி உருவங்கள்
  rationale: טְחֹרִים உடலில் ஏற்பட்ட கட்டிகள் அல்லது வீக்கங்களைக் குறிக்கிறது; இங்கு அவற்றைப் பிரதிநிதித்துவப்படுத்திய தங்க நேர்த்திப் பொருட்கள் குறிப்பிடப்படுவதால், அவை வெறும் தங்கக் கட்டிகள் என்ற தவறான புரிதலைத் தவிர்க்க ‘உருவங்கள்’ சேர்க்கப்பட்டுள்ளது.
- source_word: אֲשֶׁר הֵשִׁיבוּ
  choice: திருப்பி அனுப்பிய
  rationale: שׁוב என்பதன் ஹிபீல் வடிவம் இச்சூழலில் ‘திரும்பக் கொடுத்தல்/அனுப்புதல்’ என்று பொருள்படுகிறது; பெட்டி திருப்பி அனுப்பப்பட்ட சூழலுக்கும் இச்சொல் பொருந்துகிறது.
- source_word: פְלִשְׁתִּים
  choice: பெலிஸ்தியர்கள்
  rationale: இந்த மக்களினத்திற்கான பரவலாக அறியப்படும் நவீன தமிழ்ப் பெயர்.
- source_word: אָשָׁם
  choice: குற்றநிவாரணக் காணிக்கை
  rationale: குற்றத்திற்கான ஈடு அல்லது பரிகாரத்துடன் தொடர்புடைய காணிக்கையைச் சுட்டுகிறது; இங்கு தங்க உருவங்களே காணிக்கையாக இருப்பதால் ‘காணிக்கை’ இயல்பாக உள்ளது.
- source_word: לַיהוָה
  choice: யாவேவுக்கு
  rationale: எபிரெய மூலத்தில் உள்ள தனிப்பட்ட இறைபெயரான יהוה என்பதைப் பட்டப்பெயராக மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: לְאַשְׁדּוֹד אֶחָד ... לְעֶקְרוֹן אֶחָד
  choice: அஸ்தோத்துக்காக ஒன்று ... எக்ரோனுக்காக ஒன்று
  rationale: ஒவ்வொரு பெலிஸ்திய நகரத்திற்கும் ஒவ்வொரு உருவம் வழங்கப்பட்டதை, மீண்டும் வரும் לְ மற்றும் אֶחָד ஆகியவற்றுக்கு ஏற்ப தெளிவாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: יהוה என்ற இறைபெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலவசனம் உடன்படிக்கையின் தனிப்பட்ட இறைபெயரை நேரடியாகப் பயன்படுத்துகிறது; ‘யாவே’ என்பது அதன் பொதுவாக ஏற்கப்படும் ஒலிப்பைத் தமிழில் பாதுகாக்கிறது.
- issue: אָשָׁם என்பதன் பலிசார் பொருள்
  choice: குற்றநிவாரணக் காணிக்கை
  alternative: குற்றநிவாரணப் பலி / பரிகாரக் காணிக்கை
  rationale: குற்றம் மற்றும் ஈடுசெய்தல் ஆகிய இரு கருத்துகளையும் தக்கவைத்தபடி, இங்கு கொடுக்கப்பட்ட தங்கப் பொருட்களுக்குப் பொருந்தும் மொழியைப் பயன்படுத்துகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. நகரப் பெயர்கள் வழக்கமான வேதாகமத் தமிழ் ஒலிப்புகளுக்கு நெருக்கமாக அமைக்கப்பட்டுள்ளன; பட்டியலின் எபிரெய மீளுருவாக்கமும் தமிழில் பாதுகாக்கப்பட்டுள்ளது.
