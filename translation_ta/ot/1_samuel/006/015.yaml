- from: லேவியர்கள் யாவேயின்[a] பெட்டகத்தையும், அதனுடன் இருந்ததும் தங்கப் பொருட்கள்[b] வைக்கப்பட்டிருந்ததுமான பெட்டியையும் இறக்கி, அவற்றைப் பெரிய கல்லின்மேல்[c] வைத்தார்கள். பெத்-ஷெமேசின் ஆண்கள் அன்று யாவேக்கு எரிபலிகளைச் செலுத்தி, பலிகளைப் பலியிட்டார்கள்[d].
  to: லேவியர்கள் யாவேயின்[a] பெட்டகத்தையும், அதனுடன் இருந்த, அதில் தங்கப் பொருட்கள் இருந்த பெட்டியையும் இறக்கி, அவற்றைப் பெரிய கல்லின்மேல் வைத்தார்கள். பெத்-ஷெமேசின் ஆண்கள் அன்று யாவேக்கு எரிபலிகளைச் செலுத்தி, பலிகளைப் பலியிட்டார்கள்[d].
  rationale: The revision only clarifies the two Hebrew relative clauses describing the separate box and its contents. It retains the source’s distinctions, the divine-name policy represented in the draft, masculine ‘ஆண்கள்,’ the large stone as the most likely location, and the marked cognate sacrificial expression. The unneeded location footnote is removed; the lexical footnote for gold objects remains applicable but is not anchored in the supplied main-text markup.
