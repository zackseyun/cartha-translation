base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/006/015.yaml
  text: And the Levites took down the ark of Yahweh[a], and the box that was with it, in which were the gold objects, and set them on the great stone[c][b]. And the men of Beth-shemesh offered burnt offerings and sacrificed sacrifices on that day to Yahweh.
translation:
  language: ta
  text: லேவியர்கள் யாவேயின்[a] பெட்டகத்தையும், அதனுடன் இருந்த, அதில் தங்கப் பொருட்கள் இருந்த பெட்டியையும் இறக்கி, அவற்றைப் பெரிய கல்லின்மேல் வைத்தார்கள். பெத்-ஷெமேசின் ஆண்கள் அன்று யாவேக்கு எரிபலிகளைச் செலுத்தி, பலிகளைப் பலியிட்டார்கள்[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரெயத்தில்: YHWH (יהוה); பாரம்பரியமாக ‘கர்த்தர்’ என்று வழங்கப்படுகிறது.'
    reason: alternative_reading
  - marker: d
    text: இன்னும் இயல்பாக, ‘பலிகளைச் செலுத்தினார்கள்.’ எபிரெயம் ஒரே வேரிலிருந்து வரும் வினையையும் பெயரையும் சேர்த்து, சொல்லுக்குச் சொல் ‘பலிகளைப் பலியிட்டார்கள்’ என்று கூறுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַלְוִיִּם
  choice: லேவியர்கள்
  rationale: லேவி குலத்தைச் சேர்ந்தவர்களைக் குறிக்கும் வழக்கமான, தெளிவான தமிழ்ச் சொல்.
- source_word: הוֹרִידוּ
  choice: இறக்கி
  rationale: வண்டியிலிருந்த பெட்டகத்தையும் பெட்டியையும் கீழே எடுத்த செயலை இயல்பாகக் குறிக்கிறது.
- source_word: אֲרוֹן יְהוָה
  choice: யாவேயின் பெட்டகம்
  rationale: אֲרוֹן என்பதன் வழிபாட்டுச் சூழலை ‘பெட்டகம்’ வேறுபடுத்திக் காட்டுகிறது; இறைபெயர் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: הָאַרְגַּז
  choice: பெட்டி
  rationale: பெட்டகத்துடன் வந்த தனியான கொள்கலனை எளிய நவீன தமிழில் குறிக்கிறது.
- source_word: אֲשֶׁר אִתּוֹ
  choice: அதனுடன் இருந்த
  rationale: இரு பொருட்களுக்கிடையிலான எளிய தொடர்பை மிகைப்படுத்தாமல் காக்கிறது.
- source_word: אֲשֶׁר בּוֹ כְלֵי זָהָב
  choice: தங்கப் பொருட்கள் வைக்கப்பட்டிருந்த
  rationale: כְלִי என்பது பாத்திரங்கள், கருவிகள் அல்லது பொருட்கள் எனப் பரந்த பொருளுடையதால், குறிப்பிட்ட வடிவை ஊகிக்காமல் ‘பொருட்கள்’ என மொழிபெயர்க்கப்படுகிறது.
- source_word: וַיָּשִׂמוּ אֶל הָאֶבֶן הַגְּדוֹלָה
  choice: அவற்றைப் பெரிய கல்லின்மேல் வைத்தார்கள்
  rationale: சூழலில் எபிரெய முன்சொல் אֶל, שׂים என்பதுடன் சேர்ந்து கல்லின்மேல் அல்லது கல்லருகே வைப்பதைக் குறிக்கலாம்; தொடர்ச்சியான கதையோட்டத்தில் ‘கல்லின்மேல்’ இயல்பான முதன்மை வாசகம்.
- source_word: וְאַנְשֵׁי בֵית שֶׁמֶשׁ
  choice: பெத்-ஷெமேசின் ஆண்கள்
  rationale: אַנְשֵׁי என்பதன் இலக்கண ஆண்பால் குறிப்பைத் தக்கவைக்கிறது; பொதுவாக ‘மக்கள்’ என்று மாற்றவில்லை.
- source_word: הֶעֱלוּ עֹלוֹת
  choice: எரிபலிகளைச் செலுத்தி
  rationale: முழுவதும் எரிக்கப்படும் பலிக்கான நிலையான பலியியல் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: וַיִּזְבְּחוּ זְבָחִים
  choice: பலிகளைப் பலியிட்டார்கள்
  rationale: எபிரெயத்தில் ஒரே வேரிலிருந்து வரும் வினை-பெயர் மீளுருவாக்கத்தைத் தமிழிலும் ஓரளவு வெளிப்படையாகத் தக்கவைக்கிறது.
- source_word: בַּיּוֹם הַהוּא
  choice: அன்று
  rationale: ‘அந்த நாளில்’ என்பதன் இயல்பான, சுருக்கமான நவீன தமிழ் வடிவம்.
- source_word: לַיהוָה
  choice: யாவேக்கு
  rationale: பலிகளின் பெறுநரைச் சுட்டும் ל முன்சொல்லைத் தெளிவாகக் காட்டுகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைபெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் வரும் நான்கெழுத்து இறைபெயரை பொதுப்பட்டப் பெயராக மாற்றாமல், covenant பெயராக ஒலிபெயர்க்கிறது; பாரம்பரிய மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- issue: אַנְשֵׁי என்பதிலுள்ள பாலினக் குறிப்பு
  choice: பெத்-ஷெமேசின் ஆண்கள்
  alternative: பெத்-ஷெமேசின் மக்கள்
  rationale: எபிரெயச் சொல் ஆண்பால் பன்மையாக இருப்பதையும், இச்சூழலில் பலிச் செயலில் ஈடுபடுவோரைக் குறிப்பதையும் தக்கவைக்கிறது; சூழல் கட்டாயப்படுத்தாத இடத்தில் பாலினத்தைப் பொதுமைப்படுத்தவில்லை.
- issue: אֶל הָאֶבֶן என்பதன் இடவியல் பொருள்
  choice: பெரிய கல்லின்மேல்
  alternative: பெரிய கல்லருகே
  rationale: אֶל வழக்கமாக ‘நோக்கி/அருகே’ எனவும் வரலாம்; ஆனால் ‘வைத்தார்கள்’ என்ற வினையுடனும் இக்கதைக் சூழலிலும் கல்லின்மேல் வைத்தனர் என்பது வலுவான வாசிப்பு. உண்மையான மாற்று சாத்தியம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையைப் பயன்படுத்துகிறது. ‘பெட்டகம்’ மற்றும் ‘பெட்டி’ என்ற வேறுபாடு மூலத்தில் உள்ள இரு தனிப்பட்ட கொள்கலன்களையும் தெளிவாக்குகிறது. எபிரெயத்தின் வினை-பெயர் மீளுருவாக்கம் பிரதான உரையில் பாதுகாக்கப்பட்டு, இயல்பான மாற்று அடிக்குறிப்பில் தரப்பட்டுள்ளது.
