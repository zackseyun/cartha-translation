  text: וַ/יֹּֽאמְרוּ֙ אַנְשֵׁ֣י בֵֽית שֶׁ֔מֶשׁ מִ֚י יוּכַ֣ל לַ/עֲמֹ֔ד לִ/פְנֵ֨י יְהוָ֧ה הָ/אֱלֹהִ֛ים הַ/קָּד֖וֹשׁ הַ/זֶּ֑ה וְ/אֶל מִ֖י יַעֲלֶ֥ה מֵ/עָלֵֽי/נוּ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/006/020.yaml
  text: Then the men of Beth-shemesh said[a], “Who is able to stand before Yahweh, this holy God? And to whom shall he go up from us?”
translation:
  language: ta
  text: அப்போது பெத்-ஷேமேசின் ஆண்கள், “இந்தப் பரிசுத்தக் கடவுளாகிய யாவேக்கு முன்பாக நிற்க யாரால் முடியும்? நம்மிடமிருந்து யாரிடம் ஏறிச் செல்லும்[a]?” என்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அது நம்மிடமிருந்து யாரிடம் ஏறிச் செல்லும்?” எபிரெயத்தில் எழுவாய் வெளிப்படையாகக் குறிப்பிடப்படவில்லை; சூழலில் அது யாவேயின் உடன்படிக்கைப் பெட்டியைக் குறிக்கலாம்.
    reason: יַעֲלֶה என்பதற்கு வெளிப்படையான எழுவாய் இல்லை. முதன்மை உரை அந்தத் தெளிவின்மையைப் பாதுகாக்கிறது; சூழலால் சாத்தியமான உடன்படிக்கைப் பெட்டி குறிப்பு அடிக்குறிப்பில் தரப்படுகிறது.
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: அப்போது ... என்றார்கள்
  rationale: வாவ்-தொடர்வினை கதையின் அடுத்த நிகழ்வை முன்னெடுக்கிறது; நவீனத் தமிழில் இயல்பான நிகழ்வரிசையை ‘அப்போது’ காட்டுகிறது.
- source_word: אַנְשֵׁי בֵית שֶׁמֶשׁ
  choice: பெத்-ஷேமேசின் ஆண்கள்
  rationale: אַנְשֵׁי என்பதன் ஆண்பால் பன்மைப் பொருளைத் துல்லியமாகக் காக்கிறது; நகரப் பெயர் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: מִי יוּכַל לַעֲמֹד לִפְנֵי
  choice: முன்பாக நிற்க யாரால் முடியும்?
  rationale: יכולת குறிக்கும் יוּכַל என்பதையும், ஒருவரின் முன்னிலையில் நிற்பதைக் குறிக்கும் எபிரெய மரபுத்தொடரையும் இயல்பான தமிழில் காக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைப்பட்டத்தால் மாற்றாமல், எபிரெய நான்கெழுத்துத் திருப்பெயரைத் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: הָאֱלֹהִים הַקָּדוֹשׁ הַזֶּה
  choice: பரிசுத்தரான இந்தக் கடவுள்
  rationale: கடவுளின் பரிசுத்தத்தையும் הַזֶּה என்பதன் ‘இந்த’ என்ற அண்மைச் சுட்டையும் காக்கிறது.
- source_word: וְאֶל מִי יַעֲלֶה מֵעָלֵינוּ
  choice: அவர் நம்மிடமிருந்து யாரிடம் ஏறிச் செல்வார்?
  rationale: עָלָה என்பதன் ‘ஏறிச் செல்’ பொருளையும், מֵעָלֵינוּ என்பதன் விலகிச் செல்லும் பொருளையும் தருகிறது. வெளிப்படையாகக் கூறப்படாத எழுவாயை ஆண்பால் ஒருமை வினை வடிவுக்கு ஏற்ப ‘அவர்’ என முதன்மை உரையில் காட்டி, சூழலில் சாத்தியமான மாற்றுப் பொருளைக் குறிப்பில் தருகிறது.
theological_decisions:
- issue: יְהוָה என்ற திருப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூல உரையில் தனிப்பட்ட திருப்பெயர் நேரடியாக உள்ளது; அதை ஒரு பட்டத்தால் மாற்றாமல் ஒலிபெயர்ப்பது மூலத்தின் வேறுபாட்டைக் காக்கிறது.
- issue: יַעֲלֶה என்ற வினையின் மறைந்த எழுவாய்
  choice: அவர் ... ஏறிச் செல்வார்
  alternative: அது ... ஏறிச் செல்லும்—உடன்படிக்கைப் பெட்டியைக் குறிக்கும்
  rationale: எபிரெய வினை ஆண்பால் ஒருமையில் இருந்தாலும் எழுவாய் வெளிப்படையாக இல்லை. இலக்கண வடிவுக்கு நெருக்கமான வாசிப்பு முதன்மை உரையில் வைக்கப்படுகிறது; சூழலால் மிகவும் சாத்தியமான உடன்படிக்கைப் பெட்டி வாசிப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘பரிசுத்தரான’ என்பது வழிபாட்டு மரபில் அறிமுகமான சொல்லாக இருந்தாலும் இன்றைய வாசகருக்கும் தெளிவானது. ‘ஏறிச் செல்வார்’ என்பது עָלָה-வின் திசைநுணுக்கத்தை காக்கிறது.
