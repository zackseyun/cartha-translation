  text: וַ/יֹּאמְר֗וּ מָ֣ה הָ/אָשָׁם֮ אֲשֶׁ֣ר נָשִׁ֣יב ל/וֹ֒ וַ/יֹּאמְר֗וּ מִסְפַּר֙ סַרְנֵ֣י פְלִשְׁתִּ֔ים חֲמִשָּׁה֙ עפלי זָהָ֔ב וַ/חֲמִשָּׁ֖ה עַכְבְּרֵ֣י זָהָ֑ב כִּֽי מַגֵּפָ֥ה אַחַ֛ת לְ/כֻלָּ֖/ם וּ/לְ/סַרְנֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/006/004.yaml
  text: 'And they said[a], “What is the guilt offering that we should return to him?” They said, “According to the number of the Philistine rulers: five golden tumors and five golden mice[c][b], for one plague was on all of them and on your rulers.”'
translation:
  language: ta
  text: அவர்கள், “நாம் திருப்பிக் கொடுக்க வேண்டிய குற்றநிவாரணக் காணிக்கை[a] என்ன?” என்று கேட்டார்கள். அதற்கு அவர்கள், “பெலிஸ்திய ஆட்சியாளர்களின் எண்ணிக்கைக்கு ஏற்ப, ஐந்து பொன் கட்டிகளும்[b] ஐந்து பொன் எலிகளும்; ஏனெனில் ஒரே வாதை அவர்கள் அனைவர்மீதும் உங்கள் ஆட்சியாளர்கள்மீதும் வந்தது” என்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது “இழப்பீட்டுக் காணிக்கை”; அல்லது “குற்றப்பரிகாரக் காணிக்கை.”
    reason: lexical_alternative
  - marker: b
    text: எபிரெயச் சொல் நோயால் ஏற்பட்ட வீக்கங்கள் அல்லது கட்டிகளைக் குறிக்கலாம்; சிலர் இதை இன்னும் குறிப்பாக “மூலநோய்க் கட்டிகள்” என்று மொழிபெயர்க்கின்றனர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאָשָׁם
  choice: குற்றநிவாரணக் காணிக்கை
  rationale: இந்தச் சூழலில் אָשָׁם என்பது குற்றத்திற்குப் பரிகாரமாகவும் இழப்பீடாகவும் செலுத்தப்படும் காணிக்கையைக் குறிக்கிறது. ‘குற்றநிவாரணக் காணிக்கை’ அதன் வழிபாட்டு மற்றும் ஈடுசெய்யும் அம்சங்களைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: נָשִׁיב לוֹ
  choice: நாங்கள் அவருக்குத் திருப்பிச் செலுத்த வேண்டிய
  rationale: שוב என்பதன் ஹிஃபில் வடிவம் ‘திருப்பிக் கொடுத்தல்/செலுத்துதல்’ என்று பொருள்படும். ஆண்பால் ஒருமைச் சுட்டுப்பெயரைப் பாதுகாத்து, இஸ்ரவேலின் தேவனைக் குறிப்பதாக ‘அவருக்கு’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: מִסְפַּר סַרְנֵי פְלִשְׁתִּים
  choice: பெலிஸ்திய ஆட்சியாளர்களின் எண்ணிக்கைக்கு ஏற்ப
  rationale: இந்த இணைப்புத் தொடர், காணிக்கைகளின் எண்ணிக்கை பெலிஸ்தியத் தலைவர்களின் எண்ணிக்கைக்கு ஒத்திருக்க வேண்டும் என்பதைக் குறிக்கிறது.
- source_word: סַרְנֵי
  choice: ஆட்சியாளர்கள்
  rationale: இது பெலிஸ்தியர்களின் உயர்மட்ட அரசியல் தலைவர்களுக்குரிய தனிப்பட்ட பதவி. ‘ஆட்சியாளர்கள்’ என்பது பிற்கால நிலப்பிரபுத்துவக் கருத்துகளைச் சேர்க்காமல் அதிகாரத்தை இயல்பாகத் தெரிவிக்கிறது.
- source_word: עפלי זָהָב
  choice: தங்கத்தினாலான ஐந்து கட்டிகள்
  rationale: עפלים என்பது நோயோடு தொடர்புடைய உடல் வீக்கங்கள் அல்லது கட்டிகளைக் குறிக்கிறது. சரியான உடற்கூறு இடத்தைத் தேவையின்றி குறிப்பாக்காமல் ‘கட்டிகள்’ என்று மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: עַכְבְּרֵי זָהָב
  choice: தங்கத்தினாலான ஐந்து எலிகள்
  rationale: עַכְבָּר என்பதன் நேரடிப் பொருள் ‘எலி’; உருவங்களாகச் செய்யப்பட்ட பொருட்கள் என்பது சூழலிலிருந்து தெளிவாகிறது.
- source_word: מַגֵּפָה אַחַת
  choice: ஒரே கொள்ளைநோய்
  rationale: אַחַת என்பது அனைவரையும் தாக்கியது ஒரே பேரிடர் என்பதை வலியுறுத்துகிறது; மַגֵּפָהக்கு இச்சூழலில் ‘கொள்ளைநோய்’ இயல்பானது.
- source_word: לְכֻלָּם וּלְסַרְנֵיכֶם
  choice: உங்கள் எல்லார்மீதும் உங்கள் ஆட்சியாளர்கள்மீதும்
  rationale: לְ இங்கு நோய் யார்மீது வந்தது என்பதைக் குறிக்கிறது. இரண்டாம் நபர் பன்மை உரிமை விகுதியை ‘உங்கள்’ என்று வெளிப்படையாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: לוֹ என்ற சுட்டுப்பெயரின் குறிப்பு
  choice: ‘அவருக்கு’—இஸ்ரவேலின் தேவனைக் குறிப்பதாக மொழிபெயர்த்தல்
  alternative: ‘அதற்கு’—உடன்படிக்கைப் பெட்டியைக் குறிப்பதாக மொழிபெயர்த்தல்
  rationale: எபிரெயத்தில் ஆண்பால் ஒருமை உள்ளது. உடன்படிக்கைப் பெட்டி தொடர்பான குற்றத்திற்காக இஸ்ரவேலின் தேவனுக்கு ஈடுசெய்வதே உரையாடலின் கருத்தாக இருப்பதால், ஆளைக் குறிக்கும் ‘அவருக்கு’ பொருத்தமானது; இருப்பினும் பெட்டியைக் குறிக்கும் வாசிப்பும் இலக்கண ரீதியில் சாத்தியம்.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் வடிவமைக்கப்பட்டுள்ளது. எபிரெயத்தின் கேள்வி–பதில் அமைப்பு காக்கப்பட்டு, இயல்பான தமிழுக்காக இரண்டாவது பதிலில் மறைந்துள்ள கட்டளை ‘செலுத்துங்கள்’ என்று வெளிப்படுத்தப்பட்டுள்ளது. ‘கட்டிகள்’ என்பது நோயின் தன்மையை அளவுக்கு மீறிக் குறிப்பாக்காமல் மூலத்தின் பரந்த பொருளைக் காக்கிறது.
