  to: 'அவன் இஸ்ரவேல் மக்களிடம்[a], “இஸ்ரவேலின் கடவுளாகிய யாவே இவ்வாறு கூறுகிறார்: நானே இஸ்ரவேலை எகிப்திலிருந்து மேலே கொண்டுவந்தேன்; எகிப்தியரின் கையிலிருந்தும், உங்களை ஒடுக்கிவந்த எல்லா ராஜ்யங்களின் கையிலிருந்தும் உங்களை விடுவித்தேன்” என்றான்.'
  rationale: ‘அரசுகள்’ என்பதற்குப் பதிலாக ‘ராஜ்யங்கள்’ என மாற்றி, எபிரெய மַמְלָכוֹת-இன் அரசியல் அலகு பொருள் பாதுகாக்கப்பட்டது. அறிவிப்பு-சூத்திரம் நவீன நிலையான தமிழில் மேலும் இயல்பாக அமைய ‘இவ்வாறு கூறுகிறார்’ எனச் சீரமைக்கப்பட்டது. பிற கூறுகள் மூலத்திற்கும் ஆங்கில ஆய்வுத் தடத்திற்கும் இணங்க உள்ளன.
