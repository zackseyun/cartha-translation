source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֶל בְּנֵ֣י יִשְׂרָאֵ֗ל כֹּֽה אָמַ֤ר יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל אָנֹכִ֛י הֶעֱלֵ֥יתִי אֶת יִשְׂרָאֵ֖ל מִ/מִּצְרָ֑יִם וָ/אַצִּ֤יל אֶתְ/כֶם֙ מִ/יַּ֣ד מִצְרַ֔יִם וּ/מִ/יַּד֙ כָּל הַ/מַּמְלָכ֔וֹת הַ/לֹּחֲצִ֖ים אֶתְ/כֶֽם׀־פ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/018.yaml
  text: 'And he said to the sons of Israel[a], “Thus says Yahweh, the God of Israel: I brought Israel up from Egypt, and I delivered you from the hand of the Egyptians and from the hand of all the kingdoms that were oppressing you.”'
translation:
  language: ta
  text: 'அவன் இஸ்ரவேல் மக்களிடம்[a], “இஸ்ரவேலின் கடவுளாகிய யாவே இவ்வாறு கூறுகிறார்: நானே இஸ்ரவேலை எகிப்திலிருந்து மேலே கொண்டுவந்தேன்; எகிப்தியரின் கையிலிருந்தும், உங்களை ஒடுக்கிவந்த எல்லா ராஜ்யங்களின் கையிலிருந்தும் உங்களை விடுவித்தேன்” என்றான்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'சொல்லுக்குச் சொல்: “இஸ்ரவேலின் மகன்களிடம்”; மரபாக, “இஸ்ரவேலின் பிள்ளைகளிடம்.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்கள்
  rationale: சொல்லுக்குச் சொல் வடிவம் ‘இஸ்ரவேலின் மகன்கள்’ என்றாலும், இங்கு இது முழு இஸ்ரவேல் சமூகத்தைக் குறிக்கும் மரபுவழி இனப்பெயர். நவீனத் தமிழில் இயல்பாகவும் பொருள் துல்லியமாகவும் ‘இஸ்ரவேல் மக்கள்’ என வழங்கப்பட்டது; நேரடி வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: כֹּה אָמַר
  choice: கூறுவது இதுவே
  rationale: தூதர் அல்லது தீர்க்கதரிசன அறிவிப்புக்குரிய நிலையான சூத்திரத்தின் அதிகாரபூர்வமான வலிமையை இயல்பான தமிழில் காக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெயத் தனிப்பெயரான நான்கு எழுத்துத் திருப்பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் பரவலாகப் புரிந்துகொள்ளத்தக்க ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் கடவுள்
  rationale: இஸ்ரவேலுடன் யாவே கொண்டுள்ள அடையாள உறவை வெளிப்படுத்தும் நேரடியான இணைப்புத் தொடர்.
- source_word: הֶעֱלֵיתִי
  choice: மேலே கொண்டுவந்தேன்
  rationale: עלה என்பதன் ஹிஃபில் வடிவத்திலுள்ள ‘மேலே கொண்டுவருதல்’ என்ற வெளியேற்ற நிகழ்வுக்குரிய திசை உருவகத்தைத் தக்கவைக்கிறது.
- source_word: אֶת יִשְׂרָאֵל
  choice: இஸ்ரவேலை
  rationale: எபிரெயத்தில் உள்ள ஒருமை கூட்டுப்பெயரான ‘இஸ்ரவேல்’ அப்படியே பாதுகாக்கப்படுகிறது.
- source_word: וָאַצִּיל
  choice: விடுவித்தேன்
  rationale: பகைமைமிக்க அதிகாரத்திலிருந்து மீட்டல் அல்லது விடுவித்தல் என்ற நצל ஹிஃபில் வினையின் பொருளைச் சூழலுக்கேற்ற முறையில் தெரிவிக்கிறது.
- source_word: מִיַּד
  choice: கையிலிருந்து
  rationale: அதிகாரம் அல்லது கட்டுப்பாட்டைக் குறிக்கும் எபிரெய உருவகத்தைத் தமிழிலும் புரியத்தக்கவாறு தக்கவைக்கிறது.
- source_word: מִצְרַיִם
  choice: எகிப்தியர்
  rationale: ‘எகிப்தின் கை’ என்பது நாட்டின் ஆட்சியதிகாரத்தை ஆகுபெயராகக் குறிக்கிறது; தமிழில் ‘எகிப்தியரின் கை’ என்பது இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: כָּל הַמַּמְלָכוֹת
  choice: எல்லா அரசுகள்
  rationale: பன்மையையும் முழுமையான பரப்பையும் கூடுதல் சூழல்சார் சொற்களைச் சேர்க்காமல் காக்கிறது.
- source_word: הַלֹּחֲצִים אֶתְכֶם
  choice: உங்களை ஒடுக்கிவந்த
  rationale: பங்கேற்புவினை காட்டும் தொடர்ச்சியான அல்லது வழக்கமான ஒடுக்குதலை ‘ஒடுக்கிவந்த’ துல்லியமாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூல உரை ஒரு பொதுப் பட்டத்தை அல்ல, இறைவனின் தனிப்பெயரைப் பயன்படுத்துகிறது. ஆகவே அந்தத் தனிப்பெயர் ஒலிபெயர்க்கப்பட்டு, பெயரும் பட்டமும் வேறுபடுத்தப்படுகின்றன.
- issue: בְּנֵי יִשְׂרָאֵל என்ற பாலினக் குறியுள்ள இனப்பெயர்
  choice: இஸ்ரவேல் மக்கள்
  alternative: இஸ்ரவேலின் மகன்கள்
  rationale: இத்தொடர் சூழலில் ஆண் பிள்ளைகளை மட்டும் சுட்டாமல் இஸ்ரவேல் சமூகத்தைக் குறிக்கும் நிலையான இனப்பெயராக உள்ளது. பிரதான உரையில் இயல்பான கூட்டுப்பொருள் வழங்கப்பட்டு, வடிவரீதியான மாற்று அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: விடுதலையை விவரிக்கும் ‘கை’ உருவகம்
  choice: கையிலிருந்து
  alternative: அதிகாரத்திலிருந்து
  rationale: மூலத்தின் அதிகாரம் மற்றும் கட்டுப்பாடு சார்ந்த உருவகம் தமிழிலும் தெளிவாக இருப்பதால் அதைச் சுருக்காமல் தக்கவைத்துள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகருக்குப் புரியும் கண்ணியமான அறிவிப்பு நடையில் வடிவமைக்கப்பட்டது. ‘கூறுவது இதுவே’ என்பது தூதர் அறிவிப்பின் மேன்மையைத் தக்கவைக்கிறது; ‘மேலே கொண்டுவந்தேன்’ மற்றும் ‘கையிலிருந்து’ ஆகியவை மூல எபிரெய உருவகங்களை இயன்றவரை பாதுகாக்கின்றன.
