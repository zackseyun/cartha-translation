source:
  edition: WLC
  text: וַ/יִּקַּ֨ח שְׁמוּאֵ֜ל אֶת פַּ֥ךְ הַ/שֶּׁ֛מֶן וַ/יִּצֹ֥ק עַל רֹאשׁ֖/וֹ וַ/יִּשָּׁקֵ֑/הוּ וַ/יֹּ֕אמֶר הֲ/ל֗וֹא כִּֽי מְשָׁחֲ/ךָ֧ יְהוָ֛ה עַל נַחֲלָת֖/וֹ לְ/נָגִֽיד־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/001.yaml
  text: Then Samuel took the flask of oil and poured it on his head and kissed him[a], and said, “Has not Yahweh anointed you as ruler over his inheritance?”
translation:
  language: ta
  text: பின்பு சாமுவேல் சிறு எண்ணெய்க் குடுவையை எடுத்து, சவுலின் தலையின்மேல் எண்ணெயை ஊற்றி, அவரை முத்தமிட்டு, “யாவே தமது சுதந்தரத்தின் தலைவராக உம்மை அபிஷேகம் செய்திருக்கிறார் அல்லவா?[a]” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “தலைவர்” என்பதற்கு “ஆட்சியாளர்” அல்லது “இளவரசர்” என்றும் மொழிபெயர்க்கலாம். இங்குள்ள எபிரெயச் சொல் ஆட்சி செய்ய நியமிக்கப்பட்டவரைக் குறிக்கிறது; பின்னர் வரும் “ராஜா” என்ற பட்டத்துடன் அதன் பொருள் நுட்பம் முற்றிலும் ஒன்றல்ல.
    reason: lexical_alternative
lexical_decisions:
- source_word: פַּךְ הַשֶּׁמֶן
  choice: எண்ணெய்க் குப்பி
  rationale: פַּךְ என்பது சிறிய பாத்திரம் அல்லது குப்பியைக் குறிக்கிறது. ‘எண்ணெய்க் குப்பி’ என்பது தெளிவான, இயல்பான நவீனத் தமிழ்.
- source_word: וַיִּצֹק עַל רֹאשׁוֹ
  choice: சவுலின் தலையின்மேல் எண்ணெயை ஊற்றி
  rationale: יצק என்பதன் நேரடிப் பொருள் ‘ஊற்று’. எபிரெய மூலத்தில் பிரதிப்பெயர் மட்டுமே இருந்தாலும், தமிழில் யாருடைய தலை என்பது தெளிவாக இருக்க ‘சவுலின்’ எனப் பெயர் வெளிப்படுத்தப்பட்டது.
- source_word: וַיִּשָּׁקֵהוּ
  choice: அவரை முத்தமிட்டு
  rationale: נשׁק இங்கு நேரடியாக ‘முத்தமிடு’ என்று பொருள்படுகிறது; அபிஷேக நிகழ்விலுள்ள இந்தச் செயல் மறைக்கப்படவில்லை.
- source_word: הֲלוֹא כִּי
  choice: அல்லவா?
  rationale: இணைப்பு வினாவடிவிலான உறுதிப்பாட்டை வெளிப்படுத்துகிறது. தமிழ் வாக்கிய இறுதியில் ‘அல்லவா?’ என்பது அந்த வலியுறுத்தலை இயல்பாகப் பாதுகாக்கிறது.
- source_word: מְשָׁחֲךָ
  choice: உம்மை ... அபிஷேகம் செய்திருக்கிறார்
  rationale: משׁח என்பது சடங்கையும் ஆட்சிப் பொறுப்புக்கான நியமனத்தையும் குறிக்கும் நிலையான சொல். ‘அபிஷேகம்’ தமிழ் வேதாகம நடையில் அறியப்பட்டதுடன் இவ்விரு பரிமாணங்களையும் காக்கிறது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: தமிழில் பரவலாக அறியப்படும் தனிப்பெயர் வடிவமான ‘யெகோவா’ பயன்படுத்தப்பட்டு, பொதுப்பட்டமான ‘கர்த்தர்’ என்பதற்குப் பதிலாக மூலத்தின் இறைப்பெயர் தன்மை பாதுகாக்கப்படுகிறது.
- source_word: נַחֲלָתוֹ
  choice: தமது உரிமைச் சொத்து
  rationale: נַחֲלָה என்பது சுதந்தரம், ஒதுக்கப்பட்ட உடைமை அல்லது உரிமைச் சொத்து எனப் பொருள்படும். இங்கு இஸ்ரவேல் யெகோவாவுக்குச் சொந்தமான மக்கள் என்ற உடன்படிக்கைச் சார்ந்த கருத்தை ‘உரிமைச் சொத்து’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: לְנָגִיד
  choice: ஆளுநராக
  rationale: נָגִיד ஆள நியமிக்கப்பட்ட தலைவரைக் குறிக்கிறது; அது מֶלֶךְ (‘ராஜா’) என்பதோடு முற்றிலும் ஒன்றல்ல. ‘ஆளுநர்’ ஆட்சிப் பொறுப்பைத் தெரிவிக்கிறது; பின்னாளைய அதிகாரபூர்வ ராஜ பட்டத்தை முன்கூட்டியே புகுத்துவதில்லை.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யெகோவா
  alternative: யாவே / கர்த்தர்
  rationale: மூலத்தில் தனிப்பட்ட உடன்படிக்கைப் பெயர் நேரடியாக உள்ளது. தமிழில் பரவலாக அறியப்படும் பெயர்வடிவம் தேர்ந்தெடுக்கப்பட்டு, அதை ஒரு பட்டமாக மாற்றுவது தவிர்க்கப்பட்டது.
- issue: அரச நியமனச் சூழலில் נָגִיד என்பதன் பொருள்
  choice: ஆளுநர்
  alternative: தலைவர் / இளவரசர் / ராஜா
  rationale: சவுல் பொதுவாக ராஜாவாக நிறுவப்படுவதற்கு முன்பான நியமனம் இது. ஆகவே ஆட்சி அதிகாரத்தைத் தெரிவித்து, ‘ராஜா’ என்ற வேறொரு எபிரெயச் சொல்லின் முழு நுட்பத்தோடு இதை ஒன்றாக்காத சொல் தேர்ந்தெடுக்கப்பட்டது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான வேதாகம நடை பயன்படுத்தப்பட்டுள்ளது. சாமுவேல் சவுலை நேரடியாகச் சொல்வதால் மரியாதை ஒருமை (‘உம்மை’) கையாளப்பட்டது. மூலத்தில் உள்ள தொடர்ச்சியான செயல்கள் தமிழ் இயல்புக்கேற்ப வினையெச்சங்களால் இணைக்கப்பட்டுள்ளன; பிரதிப்பெயரின் சுட்டு தெளிவாக இருக்க ‘சவுலின்’ என வெளிப்படுத்தப்பட்டுள்ளது.
