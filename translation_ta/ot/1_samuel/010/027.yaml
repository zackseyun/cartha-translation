revisions:
- from: ஆனால் கயவர்கள், “இவன் எப்படி நம்மைக் காப்பாற்றுவான்?” என்று சொல்லி, அவனை இகழ்ந்தார்கள்; அவனுக்கு அன்பளிப்பு எதையும் கொண்டுவரவில்லை. ஆனால் அவனோ மௌனமாக இருப்பவனைப் போல் இருந்தான்.[a]
