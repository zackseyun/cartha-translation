base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/027.yaml
  text: But worthless men said[a], “How can this man save us?” And they despised him and did not bring him a gift. But he was like one keeping silent.
translation:
  language: ta
  text: ஆனால் கயவர்கள், “இவன் எப்படி நம்மைக் காப்பாற்றுவான்?” என்று சொல்லி, அவனை இகழ்ந்தார்கள்; அவனுக்குப் பரிசு எதையும் கொண்டுவரவில்லை. ஆனால் அவனோ மௌனமாக இருப்பவனைப்போல் இருந்தான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “செவிடனைப் போல் இருந்தான்.” இந்த எபிரெயச் சொற்றொடர் தூண்டுதலுக்கு எதிராக வேண்டுமென்றே பதில் சொல்லாமல் இருப்பதையும் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְנֵי בְלִיַּעַל
  choice: கயவர்கள்
  rationale: சொல்லுக்கு சொல் மொழிபெயர்த்தால் ‘பயனற்றதின் மகன்கள்’ என வரும் இந்த எபிரெய மரபுத்தொடர், ஒழுக்கக்கேடான அல்லது கீழ்த்தரமானவர்களைக் குறிக்கிறது. ‘கயவர்கள்’ என்பது அதன் இகழ்ச்சித் தன்மையை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: מַה יֹּשִׁיעֵנוּ זֶה
  choice: இவன் எப்படி நம்மைக் காப்பாற்றுவான்?
  rationale: இந்த வினா உண்மையான தகவல் கோரலாக இல்லாமல், சவுலின் ஆற்றலை ஏளனத்துடன் கேள்விக்குள்ளாக்குகிறது. ‘இவன்’ என்பது זֶה என்பதிலுள்ள இகழ்ச்சித் தொனியைத் தக்கவைக்கிறது.
- source_word: וַיִּבְזֻהוּ
  choice: அவனை இகழ்ந்தார்கள்
  rationale: בזה என்பது ஒருவரை அற்பமாகக் கருதுதல் அல்லது அவமதித்தலைக் குறிக்கிறது; ‘இகழ்ந்தார்கள்’ சுருக்கமாகவும் இயல்பாகவும் இதை வெளிப்படுத்துகிறது.
- source_word: מִנְחָה
  choice: அன்பளிப்பு
  rationale: இங்கு அரசனிடம் கொண்டுவரப்படும் பரிசு அல்லது மரியாதையை வெளிப்படுத்தும் கொடை குறிக்கப்படுகிறது; வழிபாட்டுச் ‘காணிக்கை’ என்ற பொருளைத் தேவையின்றி ஏற்படுத்தாமல் ‘அன்பளிப்பு’ சூழலுக்கு ஏற்றதாக உள்ளது.
- source_word: כְּמַחֲרִישׁ
  choice: மௌனமாக இருப்பவனைப் போல்
  rationale: חרשׁ என்ற வடிவம் இங்கு மௌனமாக இருப்பதைக் குறிக்கிறது; כְּ என்ற ஒப்புமையையும் மொழிபெயர்ப்பு தக்கவைக்கிறது. ‘செவிடனைப் போல்’ என்பது சாத்தியமான மற்றொரு புரிதல் என்பதால் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: וַיְהִי
  choice: அவனோ ... இருந்தான்
  rationale: היה இங்கு சவுலின் பதிலளிக்காத நிலையை அறிமுகப்படுத்துகிறது. ‘இருந்தான்’ என்பது ஒப்புமைத் தொடருடன் நேரடியாகப் பொருந்துகிறது; ‘அவனோ’ முந்தையவர்களின் இகழ்ச்சிக்கும் அவனுடைய அமைதிக்கும் உள்ள மாறுபாட்டை இயல்பாகக் காட்டுகிறது.
theological_decisions:
- issue: சவுலின் பதிலின் சித்தரிப்பு
  choice: அவன் இகழ்ச்சிக்கு மறுமொழி கூறாமல் மௌனமாக இருந்தான்
  alternative: அவர்களுடைய இகழ்ச்சியைக் கேளாத செவிடனைப் போல நடந்துகொண்டான்
  rationale: כְּמַחֲרִישׁ என்பது மௌனத்தையோ, கேளாதவன்போல் நடந்துகொள்வதையோ குறிக்கலாம். முதன்மை உரை நேரடியான ‘மௌனம்’ என்ற பொருளைத் தக்கவைக்கிறது; மாற்றுப் புரிதல் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. எபிரெய வினாவின் ஏளனத் தொனியை ‘இவன்’ தக்கவைக்கிறது; அரசியல் சூழலிலுள்ள மִנְחָה வழிபாட்டுக் காணிக்கையாகத் தவறாகப் புரியாதபடி ‘அன்பளிப்பு’ என வழங்கப்பட்டது. அடிக்குறிப்பு குறி தொடர்புடைய இறுதி தொடருக்குப் பின்னர் இடப்பட்டுள்ளது.
