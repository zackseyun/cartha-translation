id: 1SA.10.6
reference: 1 Samuel 10:6
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וְ/צָלְחָ֤ה עָלֶ֨י/ךָ֙ ר֣וּחַ יְהוָ֔ה וְ/הִתְנַבִּ֖יתָ עִמָּ֑/ם וְ/נֶהְפַּכְתָּ֖ לְ/אִ֥ישׁ אַחֵֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/006.yaml
  text: Then the Spirit of Yahweh will rush upon you[a], and you will prophesy with them[b], and be turned into another man.
translation:
  language: ta
  text: அப்போது யாவேவின் ஆவி உன்மேல் வல்லமையோடு இறங்கும்[a]. நீ அவர்களோடு சேர்ந்து இறைவாக்குரைப்பாய்; வேறொரு மனிதனாக மாற்றப்படுவாய்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘உன்மேல் ஆற்றலுடன் வரும்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְצָלְחָה
  choice: வல்லமையோடு இறங்கும்
  rationale: יהוהவின் ஆவியை எழுவாயாகக் கொண்ட இந்தச் சூழலில் צלח என்பது வெற்றியடைவதை அல்ல, ஒருவர்மேல் ஆற்றலுடன் வருவதைக் குறிக்கிறது. தமிழில் ‘வல்லமையோடு இறங்கும்’ என்பது அந்த வலிமையான நிகழ்வை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: עָלֶיךָ
  choice: உன்மேல்
  rationale: இங்குள்ள עַל, ஆவி சவுல்மேல் வருவதை நேரடியாகக் குறிக்கிறது; ‘உன்மேல்’ இதைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: רוּחַ יְהוָה
  choice: யாவேவின் ஆவி
  rationale: רוּחַ இங்கு காற்றையோ மூச்சையோ அல்ல, தேவனுடைய ஆவியைக் குறிக்கிறது. தேவப்பெயர் יהוה ‘யாவே’ என்று ஒலிபெயர்க்கப்படுகிறது.
- source_word: וְהִתְנַבִּיתָ
  choice: இறைவாக்குரைப்பாய்
  rationale: נבא என்பதன் ஹித்பயேல் வடிவம் இச்சூழலில் தீர்க்கதரிசிகளோடு நிகழும் இறைவாக்குச் செயல்பாட்டைக் குறிக்கிறது. ‘இறைவாக்குரைப்பாய்’ நவீன தமிழில் தெளிவாகவும் சுருக்கமாகவும் உள்ளது.
- source_word: עִמָּם
  choice: அவர்களோடு சேர்ந்து
  rationale: עם இங்கு உடன்சேர்ந்து செயல்படுவதைக் குறிக்கிறது. ‘அவர்களோடு சேர்ந்து’ என்பது சவுல் அந்தக் குழுவுடன் இறைவாக்குரைப்பதைத் தெளிவாக்குகிறது.
- source_word: וְנֶהְפַּכְתָּ
  choice: மாற்றப்படுவாய்
  rationale: הפך என்பதன் நிஃபால் வடிவம் நிலைமாற்றத்தைச் சுட்டும் செயப்பாட்டு பொருளைக் கொண்டது. ‘மாற்றப்படுவாய்’ அந்தப் பொருளை மிகைப்படுத்தாமல் காக்கிறது.
- source_word: לְאִישׁ אַחֵר
  choice: வேறொரு மனிதனாக
  rationale: אִישׁ אַחֵר என்பதன் நேர்பொருள் ‘வேறொரு மனிதன்’. இது மாற்றத்தின் தன்மை அல்லது நிரந்தரத்தைக் கூடுதலாக வரையறுக்காமல் எபிரெய மொழிநடையைப் பாதுகாக்கிறது.
theological_decisions:
- issue: சவுலின் மாற்றத்தின் தன்மை
  choice: ஆவியால் நிகழும் உண்மையான மாற்றம் என மொழிபெயர்க்கப்படுகிறது; ஆனால் அதன் துல்லியமான உளவியல், ஒழுக்க அல்லது இரட்சிப்பியல் தன்மை வரையறுக்கப்படவில்லை.
  alternative: இது வெளிப்புற பரவச அனுபவம் மட்டுமே எனவோ, முழுமையான உள்ளார்ந்த ஆன்மிகப் புதுப்பித்தல் எனவோ வெளிப்படையாக விளக்குதல்.
  rationale: சவுல் இறைவாக்குரைத்து ‘வேறொரு மனிதனாக மாற்றப்படுவான்’ என்று எபிரெய உரை கூறுகிறது; அந்த மாற்றத்தின் எல்லையையோ நிலைத்தன்மையையோ அது விளக்கவில்லை. ஆகவே உரையிலுள்ள இறையியல் பதற்றம் அப்படியே வைக்கப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பான, மரியாதைமிக்க நடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய வாக்கியத்தின் மூன்று தொடர்ச்சியான நிகழ்வுகளும் பாதுகாக்கப்பட்டுள்ளன; சவுலின் மாற்றம் குறித்து மூல உரை சொல்லாத இறையியல் முடிவு சேர்க்கப்படவில்லை.
