- source_word: בְּלֶכְתְּךָ הַיּוֹם מֵעִמָּדִי
  choice: இன்று நீ என்னைவிட்டுப் புறப்பட்டுச் செல்லும்போது
  rationale: ב + infinitive construct temporal clause-ஐக் குறிக்கிறது; מֵעִמָּדִי என்பது சாமுவேலின் அருகிலிருந்து சவுல் புறப்படுவதைச் சுட்டுகிறது. நவீன தமிழில் இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: וּמָצָאתָ
  choice: காண்பாய்
  rationale: சாமுவேல் முன்கூறுகிற அடுத்த நிகழ்வை எபிரெய qatal குறிக்கிறது; தமிழில் எதிர்கால வினை இயல்பாக இதை வெளிப்படுத்துகிறது.
- source_word: שְׁנֵי אֲנָשִׁים
  choice: இரண்டு மனிதர்கள்
  rationale: எண்ணும் ஆண்பால் பொதுப்பெயரும் நேரடியாகப் பிரதிபலிக்கப்படுகின்றன.
- source_word: עִם קְבֻרַת רָחֵל
  choice: ராகேலின் கல்லறைக்கு அருகே
  rationale: இடத்தைக் குறிக்கும் עִם இங்கு ‘அருகே’ என்று பொருள்படுகிறது; קְבֻרָה பெயரிடப்பட்ட அடக்கத் தலத்தைச் சுட்டுகிறது.
- source_word: בִּגְבוּל בִּנְיָמִן
  choice: பென்யமீனின் எல்லைப்பகுதியில்
  rationale: גְּבוּל என்பதன் ‘எல்லை’ மற்றும் ‘பிரதேசம்’ என்ற இரு சாத்தியங்களையும் ‘எல்லைப்பகுதி’ ஓரளவு தக்கவைத்து, இடவிளக்கமாக இயல்பாக அமைகிறது.
- source_word: בְּצֶלְצַח
  choice: செல்சாகில்
  rationale: இடப்பெயர் தமிழில் ஒலிபெயர்க்கப்பட்டு, இடவேற்றுமையுடன் தரப்பட்டுள்ளது.
- source_word: נִמְצְאוּ הָאֲתֹנוֹת אֲשֶׁר הָלַכְתָּ לְבַקֵּשׁ
  choice: நீ தேடிச் சென்ற கழுதைகள் கிடைத்துவிட்டன
  rationale: எபிரெய மொழியில் பெண் கழுதைகள் என்றாலும் பாலினம் இங்கு கருத்துக்கு அவசியமில்லை; முடிவுற்ற நிலையை ‘கிடைத்துவிட்டன’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וְהִנֵּה
  choice: இதோ
  rationale: புதிய, கவனத்திற்குரிய நிலையை அறிமுகப்படுத்தும் உரையாடல் விசையைச் சுருக்கமாகத் தக்கவைக்கிறது.
- source_word: נָטַשׁ אָבִיךָ אֶת דִּבְרֵי הָאֲתֹנוֹת
  choice: உன் தந்தை கழுதைகளைப் பற்றிய கவலையை விட்டுவிட்டு
  rationale: சொல்லுக்குச் சொல் ‘கழுதைகளின் காரியத்தை விட்டுவிட்டார்’; சூழலில் அவற்றைப் பற்றிய கவனத்திலிருந்து விலகியிருப்பதை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: וְדָאַג לָכֶם
  choice: உங்கள் இருவரையும் குறித்து கவலைப்பட்டு
  rationale: לָכֶם இரண்டாம் நபர் ஆண்பால் பன்மை. சூழலில் சவுலையும் அவன் உடனிருந்த பணியாளனையும் குறிக்கும் என்பதால் தமிழில் பன்மை வெளிப்படையாகக் காட்டப்பட்டுள்ளது.
- source_word: מָה אֶעֱשֶׂה לִבְנִי
  choice: என் மகனுக்காக நான் என்ன செய்வேன்?
  rationale: לִבְנִי என்பதன் இயல்பான தமிழாக்கம்; தந்தையின் பதற்றமான கேள்வியை நேரடியாகத் தக்கவைக்கிறது.
