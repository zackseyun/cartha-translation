translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்கு எளிதில் புரியும் கண்ணியமான நடையைக் கடைப்பிடிக்கிறது. நேரடி உரை தெளிவாக அமைக்கப்பட்டுள்ளது. எபிரெயப் பன்மை தமிழில் வெளிப்படையாகக் காட்டப்பட்டுள்ளது; גְּבוּל என்பதிலுள்ள இடவியல் தெளிவின்மை முதன்மை உரையிலும் அடிக்குறிப்பிலும் பாதுகாக்கப்பட்டுள்ளது.
