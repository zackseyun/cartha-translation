base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/002.yaml
  text: When you leave me today[a], you will find two men near Rachel’s tomb in the territory of Benjamin at Zelzah, and they will say to you, ‘The donkeys that you went to look for have been found, and look, your father has stopped caring about the donkeys and is anxious about you, saying[c][b], “What shall I do about my son?”’
translation:
  language: ta
  text: இன்று நீ என்னைவிட்டுப் புறப்பட்டுச் செல்லும்போது, பென்யமீனின் எல்லைப்பகுதியில்[c] உள்ள செல்சாகில், ராகேலின் கல்லறைக்கு அருகே இரண்டு மனிதர்களைக் காண்பாய். அவர்கள் உன்னிடம், “நீ தேடிச் சென்ற பெண் கழுதைகள் கிடைத்துவிட்டன. இதோ, உன் தந்தை பெண் கழுதைகளைப் பற்றிய கவலையை விட்டுவிட்டு[a], உங்களைப் பற்றி[b] கவலைப்பட்டு, ‘என் மகனுக்காக நான் என்ன செய்வேன்?’ என்று கூறுகிறார்” என்பார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லுக்குச் சொல், “பெண் கழுதைகளைப் பற்றிய காரியத்தை விட்டுவிட்டார்.”
    reason: lexical_alternative
  - marker: b
    text: “உங்களை” என்பது எபிரெய மொழியில் பன்மை; இது சவுலையும் அவனுடன் பயணம் செய்த பணியாளனையும் குறிக்கலாம்.
    reason: lexical_clarification
  - marker: c
    text: “பென்யமீனின் எல்லைப்பகுதியில்” என்பதற்கு “பென்யமீனின் பிரதேசத்தில்” என்றும் மொழிபெயர்க்கலாம்; எபிரெயச் சொல் எல்லையையோ பிரதேசத்தையோ குறிக்கக்கூடும்.
    reason: lexical_alternative
