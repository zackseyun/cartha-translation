  text: When he had finished prophesying[a], he came to the high place.
translation:
  language: ta
  text: அவன் தீர்க்கதரிசனம் உரைப்பதை முடித்தபின், உயர்ந்த வழிபாட்டிடத்திற்கு[a] வந்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மேட்டிலுள்ள வழிபாட்டிடம்.” எபிரெயத்தில் “உயர்ந்த இடம்”; இது பொதுவாக உயரமான இடத்தில் அமைந்திருந்த வழிபாட்டுத் தலத்தைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְכַל
  choice: முடித்தபோது
  rationale: כּלה இங்கு முந்தைய செயல் நிறைவடைந்ததைக் குறிக்கிறது. அடுத்த நிகழ்வுக்கு முன் அது முடிந்தது என்பதை இயல்பான தமிழில் காலவாக்கியமாகத் தருகிறது.
- source_word: מֵהִתְנַבּוֹת
  choice: தீர்க்கதரிசனம் உரைப்பதை
  rationale: מן உடன் வரும் נבא வினையின் பெயரெச்ச வடிவம், தீர்க்கதரிசனச் செயலை நிறுத்துதல் அல்லது முடித்தல் என்பதைக் குறிக்கிறது. இச்சூழலில் இந்த மொழிபெயர்ப்பு செயலை நேரடியாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: וַיָּבֹא
  choice: வந்தான்
  rationale: בוא என்பது பார்வைநிலைக்கேற்ப ‘வருதல்’ அல்லது ‘செல்லுதல்’ எனப் பொருள்படும். கதையின் நகர்வை அளவுக்கு மீறி விளக்காமல் ‘வந்தான்’ என்பது எபிரெயச் சொல்லை நேரடியாகப் பிரதிபலிக்கிறது.
- source_word: הַבָּמָה
  choice: மேட்டிடம்
  rationale: במה என்பது பொதுவாக உயரமான இடத்திலுள்ள வழிபாட்டிடத்தைக் குறிக்கிறது. ‘மேட்டிடம்’ அதன் உருவகத் தன்மையைப் பாதுகாக்கிறது; அதன் வழிபாட்டுச் சார்பை அடிக்குறிப்பு தெளிவுபடுத்துகிறது.
theological_decisions:
- issue: הַבָּמָה என்பதன் வழிபாட்டுச் சார்பு
  choice: மேட்டிடம்
  alternative: உயர்ந்த வழிபாட்டிடம்
  rationale: இச்சொல் ஒரு வழிபாட்டிடத்தைக் குறித்தாலும், அந்த இடத்தின் தன்மை அல்லது நியாயத்தன்மை குறித்த விரிவான விளக்கத்தை வசனம் தரவில்லை. ஆகவே பிரதான உரை சொற்பொருளைத் தக்கவைத்து, தேவையான பின்னணியை அடிக்குறிப்பில் வழங்குகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘தீர்க்கதரிசனம் உரைத்தல்’ என்பது மதச்சூழலுக்கு ஏற்றதும் பொதுவாசகர்களுக்குப் புரியக்கூடியதுமான சொற்றொடர். ‘மேடை’ என்று மொழிபெயர்த்தால் நிகழ்ச்சி அரங்கு என்ற நவீனப் பொருள் தோன்றக்கூடும் என்பதால் ‘மேட்டிடம்’ தேர்ந்தெடுக்கப்பட்டது.
