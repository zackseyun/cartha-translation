source:
  edition: WLC
  text: אַ֣חַר כֵּ֗ן תָּבוֹא֙ גִּבְעַ֣ת הָ/אֱלֹהִ֔ים אֲשֶׁר שָׁ֖ם נְצִבֵ֣י פְלִשְׁתִּ֑ים וִ/יהִי֩ כְ/בֹאֲ/ךָ֨ שָׁ֜ם הָ/עִ֗יר וּ/פָגַעְתָּ֞ חֶ֤בֶל נְבִיאִים֙ יֹרְדִ֣ים מֵֽ/הַ/בָּמָ֔ה וְ/לִ/פְנֵי/הֶ֞ם נֵ֤בֶל וְ/תֹף֙ וְ/חָלִ֣יל וְ/כִנּ֔וֹר וְ/הֵ֖מָּה מִֽתְנַבְּאִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/005.yaml
  text: After that you will come to Gibeath-ha-Elohim[a], where the Philistine garrison is. And when you enter there, into the city, you will meet a band of prophets coming down from the high place, with harp, tambourine, flute, and lyre before them[c][b], and they will be prophesying.
translation:
  language: ta
  text: அதன்பின் நீ கிபியத்-ஹா-எலோகிம்[a] என்ற இடத்துக்கு வருவாய்; அங்கே பெலிஸ்தியரின் படைக்காவல்[b] இருக்கிறது. நீ அங்கே நகரத்துக்குள் வரும்போது, மேடான வழிபாட்டு இடத்திலிருந்து இறங்கி வரும் இறைவாக்கினர்களின் ஒரு குழுவைச் சந்திப்பாய். அவர்களுக்கு முன்பாக யாழ், கஞ்சிரா, குழல், வீணை இருக்கும்; அவர்கள் இறைவாக்குரைத்துக்கொண்டிருப்பார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தேவனுடைய மேடு” அல்லது “தேவனுடைய கிபியா.” எபிரெயத் தொடர் ஓர் இடப்பெயராகவோ அந்த இடத்தை விவரிக்கும் பெயராகவோ புரிந்துகொள்ளப்படலாம்.
    reason: alternative_reading
  - marker: b
    text: அல்லது, “பெலிஸ்தியரின் காவல்நிலையம்” அல்லது “பெலிஸ்திய அதிகாரிகள்.” எபிரெயச் சொல் ஓர் இராணுவக் காவலிடத்தையோ அதிகாரிகளையோ குறிக்கலாம்; இச்சூழலில் படைக்காவல் என்பது அதிகம் பொருந்துகிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: גִּבְעַת הָאֱלֹהִים
  choice: கிபியாத்-ஹா-எலோகிம்
  rationale: இத்தொடர் இங்கு இடப்பெயராகச் செயல்பட வாய்ப்புள்ளதால் ஒலிபெயர்க்கப்பட்டது; அதன் விளக்கப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: נְצִבֵי פְלִשְׁתִּים
  choice: பெலிஸ்தியரின் படைக்காவல்
  rationale: נְצִיב என்பது அதிகாரிகளையோ நிலைநிறுத்தப்பட்ட இராணுவக் காவலிடத்தையோ குறிக்கலாம்; இச்சூழல் இராணுவப் பொருளை ஆதரிக்கிறது.
- source_word: וִיהִי כְבֹאֲךָ שָׁם הָעִיר
  choice: நீ அங்கே நகரத்துக்குள் வரும்போது
  rationale: எபிரெய காலக் கட்டமைப்பை இயல்பான நவீனத் தமிழில் வழங்கி, שָׁם மற்றும் הָעִיר இரண்டையும் பிரதிபலிக்கிறது.
- source_word: וּפָגַעְתָּ
  choice: சந்திப்பாய்
  rationale: இச்சூழலில் எதிர்ப்படுதல் அல்லது சந்தித்தல் என்ற பொருளை இயல்பாகத் தருகிறது.
- source_word: חֶבֶל נְבִיאִים
  choice: இறைவாக்கினர்களின் ஒரு குழு
  rationale: חֶבֶל இங்கு ஒன்றாகச் செல்லும் கூட்டம் அல்லது குழுவைக் குறிக்கிறது; 'குழு' பொதுவாசகருக்குத் தெளிவானது.
- source_word: יֹרְדִים מֵהַבָּמָה
  choice: மேட்டுத் திருத்தலத்திலிருந்து இறங்கி வரும்
  rationale: בָּמָה வழிபாட்டுக்குரிய உயர்ந்த இடத்தைக் குறிக்கிறது; 'மேட்டுத் திருத்தலம்' அதன் நிலவியல் மற்றும் வழிபாட்டுச் சிறப்பை இரண்டையும் வெளிப்படுத்துகிறது.
- source_word: נֵבֶל
  choice: யாழ்
  rationale: பண்டைய நரம்பிசைக் கருவிக்கான பரிச்சயமான தமிழ் அண்மைப்படுத்தல்; துல்லியமான அடையாளம் உறுதியற்றது என்பதை அடிக்குறிப்பு தெரிவிக்கிறது.
- source_word: תֹף
  choice: கஞ்சிரா
  rationale: கையில் ஏந்தி இசைக்கப்படும் தாளக் கருவி என்ற பொருளை நவீனத் தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: חָלִיל
  choice: குழல்
  rationale: ஊதுகருவியை இயல்பான, பரவலாகப் புரியும் தமிழில் குறிக்கிறது.
- source_word: כִּנּוֹר
  choice: வீணை
  rationale: נֵבֶל என்பதிலிருந்து வேறுபட்ட மற்றொரு நரம்பிசைக் கருவியாகத் தமிழில் இயல்பாக வேறுபடுத்துகிறது; இது அண்மைப்படுத்தப்பட்ட பெயர்.
- source_word: וְהֵמָּה מִתְנַבְּאִים
  choice: இறைவாக்குரைத்துக்கொண்டிருப்பார்கள்
  rationale: தீர்க்கதரிசனச் செயல்பாட்டைத் தெரிவிக்கிறது; அது பரவச நிலையா, இசையோடு கூடிய தூண்டுதலா என்பதைத் தீர்மானிக்காமல் விடுகிறது.
theological_decisions:
- issue: מִתְנַבְּאִים குறிக்கும் இறைவாக்குச் செயலின் இயல்பு
  choice: இறைவாக்குரைத்துக்கொண்டிருப்பார்கள்
  alternative: பரவச நிலையில் இறைவாக்கினர்களைப் போல நடந்துகொண்டிருப்பார்கள்; இறைத்தூண்டுதலுடன் இசைத்துப் புகழ்ந்துகொண்டிருப்பார்கள்
  rationale: வினைச்சொல் இறைவாக்குச் செயல்பாட்டைத் தெளிவாகக் குறித்தாலும், அதன் துல்லியமான வெளிப்பாட்டை உரை வரையறுக்கவில்லை. ஆகவே அந்தத் திறந்த தன்மை பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர் புரிந்துகொள்ளும் வகையிலும் வேதாகம உரைக்கேற்ற கண்ணியமான நடையிலும் மொழிபெயர்க்கப்பட்டது. இடப்பெயரின் இருபொருள் தன்மை மற்றும் இறைவாக்குச் செயலின் விவரிக்கப்படாத இயல்பு பாதுகாக்கப்பட்டுள்ளன. இசைக்கருவிப் பெயர்கள் வாசிக்க எளிய தமிழ் அண்மைப்படுத்தல்களாக வழங்கப்பட்டு, தொல்லியல்-சொற்பொருள் உறுதியின்மை அடிக்குறிப்பில் குறிப்பிடப்பட்டுள்ளது.
