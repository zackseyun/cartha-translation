- from: அவர்கள் மீண்டும் யாவேயிடம் விசாரித்து, “அந்த மனிதன் இதற்குள் இங்கே வந்திருக்கிறானா?” என்று கேட்டார்கள். அதற்கு யாவே, “இதோ, அவன் சாமான்களுக்கு நடுவே ஒளிந்திருக்கிறான்[a]” என்றார்.
  to: 'அவர்கள் மீண்டும் யாவேயிடம் விசாரித்தார்கள்: “அந்த மனிதன் இதற்குள் இங்கே வந்திருக்கிறானா?” அதற்கு யாவே, “இதோ, அவன் சாமான்களுக்கு நடுவே ஒளிந்திருக்கிறான்[a]” என்றார்.'
  rationale: 'The revision removes a Tamil stylistic redundancy while retaining all source-level elements: renewed consultation of Yahweh, the ‘yet/by now’ sense of the arrival question, the demonstrative force of ‘இதோ,’ the present concealed state, and the deliberately broad sense of כֵּלִים in the note.'
