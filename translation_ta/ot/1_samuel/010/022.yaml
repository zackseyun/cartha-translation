source:
  edition: WLC
  text: וַ/יִּשְׁאֲלוּ עוֹד֙ בַּֽ/יהוָ֔ה הֲ/בָ֥א ע֖וֹד הֲלֹ֣ם אִ֑ישׁ וַ/יֹּ֣אמֶר יְהוָ֔ה הִנֵּה ה֥וּא נֶחְבָּ֖א אֶל הַ/כֵּלִֽים־ס־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/022.yaml
  text: So they inquired of Yahweh again[a], “Has the man come here yet?” And Yahweh said, “Behold, he has hidden himself among the baggage.”
translation:
  language: ta
  text: 'அவர்கள் மீண்டும் யாவேயிடம் விசாரித்தார்கள்: “அந்த மனிதன் இதற்குள் இங்கே வந்திருக்கிறானா?” அதற்கு யாவே, “இதோ, அவன் சாமான்களுக்கு நடுவே ஒளிந்திருக்கிறான்[a]” என்றார்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘சாமான்கள்’ என்பதற்கான எபிரெயச் சொல் பாத்திரங்கள், பொருட்கள், கருவிகள் அல்லது உடைமைகள் என்பவற்றையும் பொதுவாகக் குறிக்கலாம். இங்கே அது கூடியிருந்த மக்களின் பயணச் சாமான்கள் அல்லது தேவைக்கான பொருட்களைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁאֲלוּ ... בַּיהוָה
  choice: யாவேயிடம் விசாரித்து
  rationale: שׁאל என்பதுடன் בַּיהוָה வருவதால் இது சாதாரணமாகக் கேட்பதை அல்ல, இறைவனிடமிருந்து பதிலை நாடுவதைக் குறிக்கிறது; ‘விசாரித்து’ அந்த ஆலோசனை நாடும் தன்மையைத் தக்கவைக்கிறது.
- source_word: עוֹד
  choice: மீண்டும்
  rationale: முதல் עוֹד விசாரித்த செயல் திரும்பச் செய்யப்பட்டதைக் குறிக்கிறது.
- source_word: הֲבָא עוֹד הֲלֹם אִישׁ
  choice: அந்த மனிதன் இதற்குள் இங்கே வந்திருக்கிறானா?
  rationale: வினாவிடைத் துகளுடன் வரும் בוא வினையின் நிறைவுற்ற வடிவம் வருகை நிகழ்ந்துவிட்டதா என்று கேட்கிறது; இரண்டாம் עוֹד-ன் ‘yet/by now’ பொருளை ‘இதற்குள்’ இயல்பாக வெளிப்படுத்துகிறது. சூழலில் אִישׁ குறிப்பிட்ட மனிதனாகிய சவுலைக் குறிக்கிறது.
- source_word: הִנֵּה
  choice: இதோ
  rationale: அடுத்து சொல்லப்படுவதன்மீது கவனத்தை ஈர்க்கும் எபிரெய வலியுறுத்தலை இயல்பான தமிழ் நடையில் தக்கவைக்கிறது.
- source_word: נֶחְבָּא
  choice: ஒளிந்திருக்கிறான்
  rationale: Niphal வடிவம் இச்சூழலில் தானே மறைந்துகொண்டதையும் அதன் தற்போதைய விளைவு நிலையையும் குறிக்கிறது.
- source_word: אֶל הַכֵּלִים
  choice: சாமான்களுக்கு நடுவே
  rationale: כֵּלִים என்பது பாத்திரங்கள், பொருட்கள், கருவிகள் அல்லது பயண உடைமைகள் எனப் பரந்த பொருளுடையது; மக்கள் கூடிவந்த இச்சூழலில் ‘சாமான்கள்’ இயல்பாகவும் தெளிவாகவும் உள்ளது.
theological_decisions:
- issue: יְהוָה என்ற இறைபெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: எபிரெய மூலத்தில் நான்கெழுத்து இறைபெயர் நேரடியாக வருகிறது; அதை ஒரு பட்டப்பெயராக மாற்றாமல், உடன்படிக்கையின் தனிப்பெயராகத் தமிழில் ஒலிபெயர்க்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய மூலத்தின் மறுமுறை விசாரணை, கவன ஈர்ப்பு, மற்றும் சவுல் ஒளிந்திருக்கும் நிலை ஆகியவை தெளிவாகத் தக்கவைக்கப்பட்டுள்ளன.
