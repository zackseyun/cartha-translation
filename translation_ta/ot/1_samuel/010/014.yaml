  register: நவீன நிலையான தமிழில், எளிமையும் கண்ணியமும் கொண்ட கதைநடை பயன்படுத்தப்பட்டுள்ளது. உரையாடலில் கேள்வி இருவரை நோக்குவதால் பன்மை மரியாதை வடிவமும், பதில் சவுலுடையதாகத் தெளிவுபடுத்த அவரது பெயரும் சேர்க்கப்பட்டுள்ளன. மூலத்தின் பாலின மற்றும் இயக்கவினை நுட்பங்கள் அடிக்குறிப்புகளில் பாதுகாக்கப்பட்டுள்ளன.
