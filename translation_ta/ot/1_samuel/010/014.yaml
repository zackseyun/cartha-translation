base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/014.yaml
  text: Then Saul’s uncle said to him and to his young man[a], “Where did you go?” And he said, “To seek the donkeys. When we saw that they were nowhere to be found[b], we went to Samuel.”
translation:
  language: ta
  text: அப்போது சவுலின் உறவினர் சவுலிடமும் அவனுடன் இருந்த இளைஞனிடமும், “நீங்கள் எங்கே போயிருந்தீர்கள்?” என்று கேட்டார். அதற்குச் சவுல், “கழுதைகளைத் தேடிப் போனோம்[a]. அவை எங்கும் கிடைக்கவில்லை என்று கண்டதும், சாமுவேலிடம் போனோம்[b]” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் இங்குள்ள சொல் குறிப்பாகப் பெண் கழுதைகளைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “சாமுவேலிடம் வந்தோம்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: דּוֹד שָׁאוּל
  choice: சவுலின் மாமா
  rationale: דּוֹד என்பது இக்குடும்பச் சூழலில் பொதுவாக ‘மாமா/சித்தப்பா போன்ற நெருங்கிய ஆண் உறவினர்’ என்பதைக் குறிக்கிறது. இயல்பான நவீன தமிழில் குறிப்பான உறவுமுறையை ஊகிக்காமல் ‘மாமா’ என வழங்கப்பட்டுள்ளது.
- source_word: אֵלָיו וְאֶל נַעֲרוֹ
  choice: அவனிடமும் அவனுடைய இளைஞனிடமும்
  rationale: נַעַר என்பதற்கு இளைஞன், உதவியாளர், பணியாள் ஆகிய பொருள்கள் உண்டு. இங்கு சவுலுடன் பயணித்த இளைஞனைக் குறிப்பதால், பணிநிலையைத் தேவையின்றி உறுதிப்படுத்தாமல் ‘இளைஞன்’ என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: אָן הֲלַכְתֶּם
  choice: நீங்கள் எங்கே போயிருந்தீர்கள்?
  rationale: கேள்வி இருவரையும் நோக்கிய பன்மையில் உள்ளது. திரும்பிவந்தவர்களிடம் கேட்கப்படும் இயல்பான தமிழ் வினாவாக ‘எங்கே போயிருந்தீர்கள்?’ அமைந்துள்ளது.
- source_word: לְבַקֵּשׁ אֶת הָאֲתֹנוֹת
  choice: கழுதைகளைத் தேடிப் போனோம்
  rationale: בקשׁ என்பது ‘தேடு’ என்று பொருள்படும். אֲתֹנוֹת குறிப்பாகப் பெண் கழுதைகளைக் குறித்தாலும், முதன்மை உரையில் இயல்பான பொதுப்பெயர் பயன்படுத்தப்பட்டு, அந்த நுட்பம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: וַנִּרְאֶה כִי אַיִן
  choice: அவை எங்கும் கிடைக்கவில்லை என்று கண்டதும்
  rationale: சொல்லுக்கு நெருக்கமாக ‘அவை இல்லை என்று கண்டோம்’ எனலாம்; சூழலில் தேடிய கழுதைகள் கிடைக்காததை இயல்பாகவும் தெளிவாகவும் இவ்வாறு தெரிவிக்கிறது.
- source_word: וַנָּבוֹא אֶל שְׁמוּאֵל
  choice: சாமுவேலிடம் போனோம்
  rationale: בוא அடிப்படையில் ‘வரு’ என்றாலும் இலக்கை நோக்கிய நகர்வைச் சூழலுக்கேற்ற தமிழில் ‘போனோம்’ என்று கூறுவது இயல்பு. நேரடியான ‘வந்தோம்’ என்ற மாற்று அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
