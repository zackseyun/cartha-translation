base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/024.yaml
  text: Then Samuel said to all the people[a], “Do you see the one whom Yahweh has chosen? There is no one like him among all the people.” And all the people shouted and said[b], “Long live the king!”
translation:
  language: ta
  text: அப்போது சாமுவேல் மக்கள் அனைவரிடமும்[a], “யாவே தேர்ந்தெடுத்தவரைப் பார்க்கிறீர்களா? மக்கள் அனைவருக்குள்ளும் அவரைப் போன்றவர் வேறு யாரும் இல்லை” என்றார். மக்கள் அனைவரும் ஆர்ப்பரித்து, “அரசர் வாழ்க!” என்று சொன்னார்கள்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யாவே தேர்ந்தெடுத்தவரைப் பார்த்தீர்களா?”
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில், “அரசர் வாழ்வாராக!”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: அப்போது ... என்றார்
  rationale: வாவ் தொடர்வினை கதை நிகழ்வை முன்னோக்கிக் கொண்டுசெல்கிறது; ‘அப்போது’ என்பது அதன் தொடர்ச்சிப் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: הַרְּאִיתֶם
  choice: பார்க்கிறீர்களா?
  rationale: வடிவில் இறந்தகால நிறைவுவினையாக இருந்தாலும், இச்சூழலில் சவுலைச் சுட்டிக்காட்டி மக்களின் கவனத்தை ஈர்க்கும் கேள்வியாகச் செயல்படுகிறது; ‘பார்த்தீர்களா?’ என்பதும் சாத்தியம் என்பதால் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: אֲשֶׁר בָּחַר בּוֹ יְהוָה
  choice: யெகோவா தேர்ந்தெடுத்தவர்
  rationale: தொடர்புச் சொற்றொடர் சவுலை அடையாளப்படுத்துகிறது. முடிவுற்ற தெய்வீகத் தேர்வை ‘தேர்ந்தெடுத்தவர்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: எபிரெய தனிப்பெயரான יהוה-ஐ ஒரு பட்டப்பெயரால் மாற்றாமல், தமிழில் பரவலாக அறியப்படும் ‘யெகோவா’ என்ற பெயர்வடிவில் தருகிறது.
- source_word: כִּי אֵין כָּמֹהוּ
  choice: அவரைப் போன்றவர் வேறு யாரும் இல்லை
  rationale: சவுலுக்கு ஒப்பானவர் மக்களிடையே இல்லை என்ற பொருளை இயல்பான தமிழில் தருகிறது. כִּי-யின் விளக்கத் தொடர்பு தனி வாக்கியத்தின் அமைப்பிலேயே வெளிப்படுகிறது.
- source_word: בְּכָל הָעָם
  choice: மக்கள் அனைவரிலும்
  rationale: கூடியிருந்த மொத்த மக்களுக்குள் செய்யப்படும் ஒப்பீட்டைத் தெளிவாகக் காட்டுகிறது.
- source_word: וַיָּרִעוּ ... וַיֹּאמְרוּ
  choice: உரத்த குரலில் ... என்று முழங்கினார்கள்
  rationale: இரண்டு எபிரெய வினைகளும் மக்களின் உரத்த, கூட்டு வாழ்த்தொலியை விவரிக்கின்றன; தமிழில் தேவையற்ற இரட்டிப்பைத் தவிர்த்து இரண்டின் கூறுகளையும் ஒருங்கிணைக்கிறது.
- source_word: יְחִי הַמֶּלֶךְ
  choice: அரசர் வாழ்க!
  rationale: அரசரின் வாழ்வையும் ஆட்சியையும் வாழ்த்தும் எபிரெய விருப்பவினையை இயல்பான தமிழ் அரச வாழ்த்தாகத் தருகிறது.
theological_decisions:
- issue: יהוה என்ற இறைபெயரை மொழிபெயர்த்தல்
  choice: யெகோவா
  alternative: யாவே
  rationale: மூலத்தில் தனிப்பெயர் நேரடியாக இருப்பதால் ‘ஆண்டவர்’ என்ற பட்டத்தால் மாற்றப்படவில்லை. உச்சரிப்பு முழுமையாக உறுதியற்ற நிலையில், தமிழில் பரவலாக அறியப்படும் பெயர்வடிவம் முதன்மை உரையில் பயன்படுத்தப்பட்டது.
- issue: சவுலின் ஒப்பற்ற தன்மையின் வரம்பு
  choice: மக்கள் அனைவரிலும் அவரைப் போன்றவர் வேறு யாரும் இல்லை
  alternative: உலகிலேயே அவரைப் போன்றவர் இல்லை
  rationale: בְּכָל הָעָם ஒப்பீட்டை அங்கு குறிப்பிடப்படும் மக்களுக்குள் வரையறுக்கிறது; முழுமையான அல்லது ஆன்மீக மேன்மையை உரையில் சேர்க்கக்கூடாது.
translation_notes:
  register: நவீன செந்தமிழுக்கு நெருக்கமான, பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளக்கூடிய கண்ணியமான நடை. அரச வாழ்த்துக்கு இயல்பான ‘அரசர் வாழ்க’ பயன்படுத்தப்பட்டுள்ளது; இறைபெயர் பட்டமாக மாற்றப்படவில்லை.
