  source_fidelity: 'The verse is substantially represented: Samuel addresses the whole people, identifies the one chosen by the divine name, states his uniqueness within the people, and the people raise a collective royal acclamation. The Tamil rendering of the divine name, however, should align with the source-oriented POB convention reflected in the audit trail: Yahweh, not Jehovah.'
