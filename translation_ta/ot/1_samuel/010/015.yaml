  yaml_path: translation/ot/1_samuel/010/015.yaml
  text: Then Saul’s uncle said[a], “Please tell me what Samuel said to you.”
translation:
  language: ta
  text: அப்போது சவுலின் மாமன், “சாமுவேல் உங்களிடம் என்ன சொன்னார் என்று தயவுசெய்து எனக்குச் சொல்” என்றார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: அப்போது ... என்றார்
  rationale: வாவ் தொடர்வினை கதை நிகழ்வை அடுத்த கட்டத்துக்கு நகர்த்துகிறது; நவீன தமிழில் அதன் தொடர்ச்சியை இயல்பாகக் காட்ட ‘அப்போது’ பயன்படுத்தப்பட்டது.
- source_word: דּוֹד שָׁאוּל
  choice: சவுலின் மாமா
  rationale: דּוֹד இக்குடும்ப உறவுச் சூழலில் ‘மாமா’ எனப் பொருள்படுகிறது; உடைமைத் தொடர்பு தமிழில் இயல்பாக ‘சவுலின் மாமா’ என வழங்கப்பட்டது.
- source_word: הַגִּידָה נָּא לִי
  choice: தயவுசெய்து என்னிடம் சொல்
  rationale: נגד என்பதன் ஹிஃபில் ஏவல் வடிவம் ‘சொல்/தெரிவி’ என்பதையும் נָא பணிவான வேண்டுகோளையும் குறிக்கிறது.
- source_word: מָה
  choice: என்ன
  rationale: கேள்விப் பொருளைக் குறிக்கும் எளிய நேரடி வடிவம்.
- source_word: אָמַר
  choice: சொன்னார்
  rationale: אמר என்பதன் அடிப்படைப் பொருளான ‘சொல்’ பாதுகாக்கப்படுகிறது; சாமுவேலுக்குரிய மரியாதைப் பன்மை தமிழில் இயல்பாக உள்ளது.
- source_word: לָכֶם
  choice: உங்கள் இருவரிடமும்
  rationale: இது இரண்டாம் ஆண்பால் பன்மை வடிவம். சூழலில் சவுலும் அவனுடைய வேலைக்காரனும் குறிக்கப்படுவதால், தமிழில் பன்மையைத் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்த ‘உங்கள் இருவரிடமும்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: שְׁמוּאֵל
  choice: சாமுவேல்
  rationale: தமிழ் வேதாகமப் பெயர் மரபில் பரவலாக அறியப்பட்ட ஒலிபெயர்ப்பு பயன்படுத்தப்பட்டது.
