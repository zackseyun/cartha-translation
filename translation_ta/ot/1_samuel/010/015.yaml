- from: அப்போது சவுலின் மாமா, “சாமுவேல் உங்கள் இருவரிடமும் என்ன சொன்னார் என்று தயவுசெய்து என்னிடம் சொல்” என்றார்.
  to: அப்போது சவுலின் மாமன், “சாமுவேல் உங்களிடம் என்ன சொன்னார் என்று தயவுசெய்து எனக்குச் சொல்” என்றார்.
