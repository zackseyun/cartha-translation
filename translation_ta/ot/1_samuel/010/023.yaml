revisions:
- from: அவர்கள் ஓடிப்போய், அவனை அங்கிருந்து அழைத்து வந்தார்கள்[a]. அவன் மக்களின் நடுவில் நின்றான். அவன் தோள்முதல் மேல்நோக்கி மற்ற எல்லா மக்களையும்விட உயரமாக இருந்தான்.
  to: அவர்கள் ஓடிப்போய், அவனை அங்கிருந்து அழைத்து வந்தார்கள்[a]. அவன் மக்களின் நடுவில் நின்றான். அவன் எல்லா மக்களையும்விட, தன் தோள்களிலிருந்து மேல்நோக்கி உயரமாக இருந்தான்.
  rationale: The revision removes an unsupported comparative element (“other”) and gives the shoulder-upward idiom a clearer, source-faithful Tamil form. The contextual rendering “அழைத்து வந்தார்கள்” and its more literal lexical alternative are retained.
