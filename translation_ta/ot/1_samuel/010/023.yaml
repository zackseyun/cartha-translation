base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/023.yaml
  text: So they ran and took him from there[a], and he stood in the midst of the people. And he was taller than all the people from his shoulders upward.
translation:
  language: ta
  text: அவர்கள் ஓடிப்போய், அவனை அங்கிருந்து அழைத்து வந்தார்கள்[a]. அவன் மக்களின் நடுவில் நின்றான். அவன் எல்லா மக்களையும்விட, தன் தோள்களிலிருந்து மேல்நோக்கி உயரமாக இருந்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவனை அங்கிருந்து எடுத்துக்கொண்டு வந்தார்கள்.” எபிரெய வினை பொதுவாக “எடுத்துக்கொள்” என்று பொருள்படும்; இச்சூழலில், அவன் மறைந்திருந்த இடத்திலிருந்து அவனை அழைத்து வந்ததைக் குறிக்கலாம் (வசனம் 22 பார்க்கவும்).
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּרֻצוּ
  choice: அவர்கள் ஓடிப்போய்
  rationale: ரוץ என்ற வினை ஓடுதல் அல்லது விரைந்து செல்லுதல் என்பதைக் குறிக்கிறது; நிகழ்ச்சியின் உயிரோட்டத்தை நேரடியாகப் பாதுகாக்கிறது.
- source_word: וַיִּקָּחֻהוּ מִשָּׁם
  choice: அவனை அங்கிருந்து அழைத்து வந்தார்கள்
  rationale: לקח என்பதன் அடிப்படைப் பொருள் ‘எடுத்துக்கொள்’; இச்சூழலில் மறைந்திருந்த சவுலைத் தேடிப்பிடித்து கூட்டத்திடம் கொண்டுவந்த செயலை இயல்பான தமிழில் ‘அழைத்து வந்தார்கள்’ எனத் தெரிவிக்கிறது. நேரடியான மாற்று அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: וַיִּתְיַצֵּב
  choice: நின்றான்
  rationale: ஹித்பயேல் வடிவம் தன்னை நிலைநிறுத்துதல் அல்லது நின்றுகொள்ளுதல் எனப் பொருள்படும்; இங்கு சடங்குசார் நுணுக்கம் சேர்க்காமல் எளிய இயல்பான சொல்லாக ‘நின்றான்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: בְּתוֹךְ הָעָם
  choice: மக்களின் நடுவில்
  rationale: בְּתוֹךְ என்பதன் ‘நடுவில்’ என்ற இடப்பொருளைத் துல்லியமாகவும் இயல்பாகவும் தருகிறது.
- source_word: וַיִּגְבַּהּ מִכָּל הָעָם
  choice: மற்ற எல்லா மக்களையும்விட உயரமாக இருந்தான்
  rationale: ஒப்பீட்டு உயரத்தைத் தமிழில் தெளிவாக வெளிப்படுத்துகிறது; הָעָם என்பதைக் குறுக்காமல் ‘மக்கள்’ எனப் பாதுகாக்கிறது.
- source_word: מִשִּׁכְמוֹ וָמָעְלָה
  choice: அவன் தோள்முதல் மேல்நோக்கி
  rationale: சவுலின் உயரம் மற்றவர்களின் தோளுக்கு மேலாகத் தென்பட்டது என்ற எபிரெயச் சொற்றொடரின் உருவக அமைப்பை நெருக்கமாகப் பாதுகாக்கிறது.
