  text: וַ/יְהִ֗י כָּל יֽוֹדְע/וֹ֙ מֵ/אִתְּמ֣וֹל שִׁלְשׁ֔וֹם וַ/יִּרְא֕וּ וְ/הִנֵּ֥ה עִם נְבִאִ֖ים נִבָּ֑א וַ/יֹּ֨אמֶר הָ/עָ֜ם אִ֣ישׁ אֶל רֵעֵ֗/הוּ מַה זֶּה֙ הָיָ֣ה לְ/בֶן קִ֔ישׁ הֲ/גַ֥ם שָׁא֖וּל בַּ/נְּבִיאִֽים־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/011.yaml
  text: And it happened that all who had known him formerly saw[a], and behold, he was prophesying with the prophets. So the people said, each man to his neighbor[b], “What has happened to the son of Kish? Is Saul also among the prophets?”
translation:
  language: ta
  text: முன்பே சவுலை அறிந்திருந்தவர்கள் அனைவரும்[a] அவரைக் கண்டார்கள்; இதோ, அவர் இறைவாக்கினர்களோடு இறைவாக்குரைத்துக்கொண்டிருந்தார். அப்போது மக்கள் ஒவ்வொருவரும் தம் அயலானிடம், “கீசின் மகனுக்கு என்ன நேர்ந்தது? சவுலும் இறைவாக்கினர்களில் இருக்கிறாரா?[b]” என்று சொன்னார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'சொல்லுக்குச் சொல்: “நேற்றும் முந்தின நாளும் முதல் அவரை அறிந்திருந்தவர்கள்”; இது அவரை முன்பே அறிந்திருந்தவர்களைக் குறிக்கும் எபிரெய மரபுத்தொடர்.'
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “சவுல்கூட இறைவாக்கினர்களில் இருக்கிறாரா?”
    reason: lexical_alternative
lexical_decisions:
- source_word: יֹדְעוֹ מֵאִתְּמוֹל שִׁלְשׁוֹם
  choice: முன்பே சவுலை அறிந்திருந்த அனைவரும்
  rationale: ‘நேற்றும் முந்தின நாளும் முதல்’ என்ற எபிரெய மரபுத்தொடர், முன்னர் அறிந்திருந்ததைக் குறிக்கிறது. தமிழில் இயல்பாக இருக்கவும், சவுலை என்பதைக் தெளிவுபடுத்தவும் இவ்வாறு மொழிபெயர்க்கப்பட்டது.
- source_word: וַיְהִי
  choice: தனி வார்த்தையாக மொழிபெயர்க்காமல் நிகழ்வின் தொடர்ச்சியில் வெளிப்படுத்தப்பட்டது
  rationale: இது எபிரெயக் கதைநடையின் தொடர்ச்சிக் கட்டமைப்பு. தமிழில் ‘அது நிகழ்ந்தது’ எனத் தனியே சேர்ப்பது செயற்கையாக இருப்பதால் வாக்கிய ஓட்டத்தில் உட்பொதிக்கப்பட்டது.
- source_word: וַיִּרְאוּ וְהִנֵּה
  choice: அவர் ... இறைவாக்குரைத்துக்கொண்டிருப்பதைக் கண்டார்கள்
  rationale: וְהִנֵּה வெளிப்படுத்தும் திடீர் கவனிப்பும் வியப்பும் தமிழில் காட்சியை நேரடியாக முன்வைக்கும் வாக்கிய அமைப்பால் தெரிவிக்கப்படுகிறது.
- source_word: עִם נְבִאִים
  choice: இறைவாக்கினர்களோடு
  rationale: עִם என்பதன் அடிப்படைப் பொருளான ‘உடன்/ஓடு’ பாதுகாக்கப்படுகிறது; இறுதி கேள்வியிலுள்ள בַּנְּבִיאִים என்பதிலிருந்து இது வேறுபடுத்தப்படுகிறது.
- source_word: נִבָּא
  choice: இறைவாக்குரைத்துக்கொண்டிருப்பதை
  rationale: நடந்துகொண்டிருந்த இறைவாக்குச் செயல்பாட்டைச் சுட்டுகிறது; நிலையான இறைவாக்கினர் பதவியை இதனால் உறுதிப்படுத்தவில்லை.
- source_word: אִישׁ אֶל רֵעֵהוּ
  choice: ஒருவரையொருவர் நோக்கி
  rationale: எபிரெயப் பகிர்வு மரபுத்தொடரை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: מַה זֶּה הָיָה לְבֶן קִישׁ
  choice: கீசின் மகனுக்கு என்ன நேர்ந்தது?
  rationale: சவுலின் மாறுபட்ட நடத்தையைக் குறித்த வியப்பை இயல்பாகவும் மூலத்திற்கு நெருக்கமாகவும் தெரிவிக்கிறது.
- source_word: הֲגַם שָׁאוּל בַּנְּבִיאִים
  choice: சவுலும்கூட இறைவாக்கினர்களில் ஒருவரா?
  rationale: גם என்பதிலுள்ள ‘கூட/மேலும்’ என்ற வியப்புணர்வையும், בַּנְּבִיאִים என்பதிலுள்ள குழுவினுள் இருப்பதையும் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: சவுலின் இறைவாக்குச் செயல்பாடு நிலையான இறைவாக்கினர் பதவியைக் குறிக்கிறதா?
  choice: இறைவாக்கினர்களோடு இறைவாக்குரைத்துக்கொண்டிருப்பது
  alternative: இறைவாக்கினரைப்போல் நடந்துகொண்டிருப்பது / பரவசநிலையில் இருந்தது
  rationale: மூலம் சவுல் இறைவாக்குச் செயல்பாட்டில் ஈடுபட்டதைச் சொல்கிறது; அது நிரந்தரப் பதவியா அல்லது வெறும் பரவச நிலையா என்பதைத் தீர்மானிக்கவில்லை. ஆகவே அந்தத் தெய்வியல் இழுபறி பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டது. ‘இறைவாக்கினர்/இறைவாக்குரைத்தல்’ என்பது נביא/נבא என்ற ஒரே சொல் வேரின் தொடர்பைத் தமிழிலும் இயன்றவரை வெளிப்படுத்துகிறது. தேவையற்ற பழமையான கதைத் தொடக்கச் சொற்கள் தவிர்க்கப்பட்டன.
