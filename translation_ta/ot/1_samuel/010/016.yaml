base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/016.yaml
  text: Saul said to his uncle[b][a], “He plainly told us that the donkeys had been found.” But he did not tell him about the matter of the kingship that Samuel had spoken of.
translation:
  language: ta
  text: சவுல் தன் மாமாவிடம், “பெண் கழுதைகள்[a] கண்டுபிடிக்கப்பட்டுவிட்டன என்று அவர் எங்களிடம் திட்டவட்டமாகச் சொன்னார்” என்றான். ஆனால் சாமுவேல் சொன்ன அரசப் பதவியைப் பற்றிய விஷயத்தை[b] சவுல் அவனிடம் சொல்லவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் குறிப்பாக ‘பெண் கழுதைகள்’ என்று உள்ளது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘அரசாட்சியைப் பற்றிய விஷயத்தை.’ இங்கு எபிரெயச் சொல் ஒரு ராஜ்யத்தின் நிலப்பரப்பைவிட சவுலின் அரசப் பதவி அல்லது அரசனாதலைக் குறிப்பதாகத் தெரிகிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: דּוֹדוֹ
  choice: தன் மாமாவிடம்
  rationale: இச்சூழலில் דּוֹד என்பது காதலனையோ நேசத்துக்குரியவனையோ அல்ல, குடும்ப உறவான ‘மாமா/தந்தையின் சகோதரன்’ என்பதைக் குறிக்கிறது. இயல்பான நவீன தமிழுக்காக ‘மாமா’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: הַגֵּד הִגִּיד
  choice: திட்டவட்டமாகச் சொன்னார்
  rationale: வினையெச்சப் பெயருடன் அதே வேரின் வினை வருவது கூற்றை வலியுறுத்துகிறது; ‘திட்டவட்டமாக’ என்பது அந்த வலியுறுத்தலை இயல்பான தமிழில் தருகிறது.
- source_word: נִמְצְאוּ
  choice: கண்டுபிடிக்கப்பட்டுவிட்டன
  rationale: מצא என்பதன் இங்குள்ள செயப்பாட்டு பொருளையும், கழுதைகள் ஏற்கெனவே கிடைத்துவிட்டதாக அறிவிக்கப்பட்ட நிறைவுநிலையையும் இது வெளிப்படுத்துகிறது.
- source_word: הָאֲתֹנוֹת
  choice: பெண் கழுதைகள்
  rationale: எபிரெயச் சொல் கழுதைகளின் பெண்பாலைக் குறிப்பாகச் சொல்கிறது; தமிழில் இதை இயல்பாகவே வெளிப்படுத்த முடிவதால் மூலத்தின் விவரம் பிரதான உரையில் வைக்கப்பட்டுள்ளது.
- source_word: דְּבַר הַמְּלוּכָה
  choice: அரசுரிமை பற்றிய காரியம்
  rationale: דָּבָר இங்கு ‘சொல்’ என்பதைவிட ‘காரியம்/விவகாரம்’ என்றும், מְלוּכָה இச்சூழலில் நிலப்பரப்பான ராஜ்யத்தைவிட சவுலுக்குரிய அரசப் பதவி அல்லது அரசுரிமை என்றும் பொருள்படுகிறது.
- source_word: לֹא הִגִּיד לוֹ
  choice: சவுல் அவனிடம் சொல்லவில்லை
  rationale: எபிரெயத்தில் மறைமுகமாகத் தொடரும் எழுவாய் தமிழில் குழப்பமின்றி இருக்க ‘சவுல்’ மீண்டும் வெளிப்படையாகக் கொடுக்கப்பட்டுள்ளது.
- source_word: אֲשֶׁר אָמַר שְׁמוּאֵל
  choice: சாமுவேல் சொன்ன
  rationale: சார்பு வாக்கியம் அரசுரிமை பற்றிய காரியத்தையே விளக்குகிறது; எபிரெயத்தின் சுருக்கமும் பொருள் தொடர்பும் தமிழில் காக்கப்பட்டுள்ளன.
theological_decisions:
- issue: מְלוּכָה என்பதன் இச்சூழலிலான பொருள்
  choice: அரசுரிமை
  alternative: அரசாட்சி / ராஜ்யம்
  rationale: சாமுவேல் சவுலை அரசனாக அபிஷேகம் செய்த உடனடியான சூழலில், இச்சொல் ஒரு நிலப்பரப்பு ராஜ்யத்தைவிட அரசனாக ஆளும் பதவியையும் உரிமையையும் முதன்மையாகக் குறிக்கிறது. இருப்பினும் ‘அரசாட்சி’ என்ற பரந்த பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் மரியாதைமிக்க கதைநடையிலும் வடிவமைக்கப்பட்டது. மேற்கோள் பேச்சின் வலியுறுத்தல் காக்கப்பட்டுள்ளது; கடைசி வாக்கியத்தில் எழுவாய் குழப்பத்தைத் தவிர்க்க ‘சவுல்’ மீண்டும் கூறப்பட்டுள்ளது.
