base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/026.yaml
  text: Saul also went to his home at Gibeah[b][a], and with him went the valiant men whose hearts God had touched.
translation:
  language: ta
  text: சவுலும் கிபியாவில் உள்ள தன் வீட்டுக்குச் சென்றார். கடவுள் அவர்களுடைய உள்ளங்களைத் தொட்ட வீரர்களும் அவருடன் சென்றார்கள்.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘வீரமுள்ள ஆட்கள்,’ ‘போர்வீரர்கள்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில், ‘கடவுள் அவர்களுடைய உள்ளங்களைத் தொட்டார்.’ இந்த உருவகம் கடவுள் அவர்களுடைய உள்ளார்ந்த மனப்பாங்கில் தாக்கம் செலுத்தியதைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: சவுலும்
  rationale: கதையின் தொடர்ச்சியையும் சவுலும் சென்றார் என்ற சேர்க்கைப் பொருளையும் இயல்பான தமிழ் ‘உம்’ விகுதி வெளிப்படுத்துகிறது.
- source_word: הָלַךְ לְבֵיתוֹ גִּבְעָתָה
  choice: கிபியாவிலிருந்த தன் வீட்டுக்குச் சென்றார்
  rationale: לְבֵיתוֹ என்பதிலுள்ள ‘தன் வீடு’ என்ற தனிப்பட்ட இலக்கையும், திசை குறிக்கும் גִּבְעָתָה என்பதிலுள்ள கிபியா என்ற இடத்தையும் தெளிவான நவீன தமிழில் காக்கிறது.
- source_word: וַיֵּלְכוּ עִמּוֹ
  choice: அவருடன் சென்றார்கள்
  rationale: எபிரெயக் கதையோட்டத்தின் அடுத்த நிகழ்வையும் சவுலுடன் சென்ற துணைநிலையையும் இயல்பாகக் கூறுகிறது.
- source_word: הַחַיִל
  choice: வீரமிக்க ஆட்கள்
  rationale: இங்கு ஒரு முழுப் படை அமைப்பைவிட, திறனும் வீரமும் கொண்ட ஆட்களின் குழுவையே இச்சொல் குறிக்கிறது. ‘வீரமிக்க ஆட்கள்’ என்பது போர்திறன் மற்றும் தகுதி ஆகிய இரு நுணுக்கங்களையும் பொதுவாசகர்களுக்குப் புரியும் தமிழில் தருகிறது.
- source_word: אֲשֶׁר נָגַע אֱלֹהִים בְּלִבָּם
  choice: கடவுள் உள்ளங்களைத் தொட்டிருந்த
  rationale: தெய்வீகத் தாக்கத்தைச் சுட்டும் மூல உருவகத்தைப் பாதுகாக்கிறது. பன்மை உடைமைப் பின்னொட்டைத் தமிழில் இயல்பாக ‘உள்ளங்களை’ என்று தருகிறது; மனமாற்றம், கட்டாயம் அல்லது வெறும் உணர்ச்சி என்று மேலதிகமாக விளக்கவில்லை.
- source_word: אֱלֹהִים
  choice: கடவுள்
  rationale: இங்கு இஸ்ரவேலின் கடவுளைக் குறிக்கும் வழக்கமான, தெளிவான தமிழ் இணைச்சொல்.
- source_word: לֵב
  choice: உள்ளம்
  rationale: எபிரெயச் சிந்தனையில் எண்ணம், விருப்பம், மனப்பாங்கு உள்ளிட்ட அக மனிதனை இச்சொல் குறிக்க முடியும். தமிழ் ‘உள்ளம்’ அந்த விரிவையும் உருவகத்தையும் இயல்பாகத் தக்கவைக்கிறது.
theological_decisions:
- issue: கடவுள் அந்த ஆட்களின் உள்ளங்களைத் தொட்டதன் இயல்பு
  choice: தெய்வீக முன்முயற்சியையும் அகநிலை மீதான தாக்கத்தையும் உருவகப்படியே மொழிபெயர்த்தல்
  alternative: ‘கடவுள் உள்ளங்களைத் தூண்டிய’ அல்லது ‘மனங்களை ஏவிய’ என்று விளக்கமாக மொழிபெயர்த்தல்
  rationale: கடவுள் அவர்களுடைய அகநிலையை சவுலை நோக்கித் திருப்பியதாக வசனம் கூறுகிறது; ஆனால் அது மறுபிறப்பு, தவிர்க்க முடியாத கட்டாயம் அல்லது உணர்ச்சிப்பூர்வ ஊக்கம் என்று எந்தக் கோட்பாட்டு முறையையும் குறிப்பிடவில்லை. ஆகவே மூலத்தின் இறையியல் பதற்றமும் வரையறுக்கப்படாத தன்மையும் காக்கப்படுகின்றன.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியக்கூடியதாயும் மரியாதைமிக்கதாயும் வடிவமைக்கப்பட்டது. ‘தொட்டிருந்த’ என்ற மூல உருவகம் திட்டமிட்டு வைக்கப்பட்டுள்ளது; அதன் பொருள் அடிக்குறிப்பில் அளவோடு விளக்கப்படுகிறது. இரு அடிக்குறிப்பு குறிகளும் அவற்றுக்குரிய சொற்றொடர்களுக்குப் பின்பாக முதன்மை உரையில் இடம்பெற்றுள்ளன.
