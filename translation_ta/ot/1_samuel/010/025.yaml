source:
  edition: WLC
  text: וַ/יְדַבֵּ֨ר שְׁמוּאֵ֜ל אֶל הָ/עָ֗ם אֵ֚ת מִשְׁפַּ֣ט הַ/מְּלֻכָ֔ה וַ/יִּכְתֹּ֣ב בַּ/סֵּ֔פֶר וַ/יַּנַּ֖ח לִ/פְנֵ֣י יְהוָ֑ה וַ/יְשַׁלַּ֧ח שְׁמוּאֵ֛ל אֶת כָּל הָ/עָ֖ם אִ֥ישׁ לְ/בֵיתֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/025.yaml
  text: Then Samuel told the people the rights and duties of the kingship[a], and he wrote them in the book and laid it before Yahweh. Then Samuel sent all the people away[b], each man to his house.
translation:
  language: ta
  text: பின்பு சாமுவேல் அரசாட்சியின் விதிமுறைகளை[a] மக்களிடம் கூறினார். அவற்றை நூலில் எழுதி, யாவேக்கு முன்பாக வைத்தார். பின்னர் சாமுவேல் மக்கள் அனைவரையும் அனுப்பிவிட்டார்; ஒவ்வொருவரும் தம் வீட்டுக்குச் சென்றனர்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அரசாட்சியின் முறைமை” அல்லது “அரசாட்சியின் வழக்கம்.” எபிரெயச் சொற்றொடர் அரசாட்சியை ஒழுங்குபடுத்தும் சட்டவிதிகளையோ நிலைபெற்ற நடைமுறையையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில், “ஒவ்வொருவன் தன் வீட்டுக்கு.” மக்கள் தனித்தனியாக அவரவர் வீடுகளுக்குப் புறப்பட்டுச் சென்றதைக் குறிக்கும் விநியோகத் தொடர் இது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: எடுத்துச் சொன்னார்
  rationale: דבר இங்கு மக்களிடம் ஓர் உள்ளடக்கத்தை விளக்கிக் கூறுவதைக் குறிக்கிறது; இயல்பான நவீனத் தமிழில் ‘எடுத்துச் சொன்னார்’ இதைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: מִשְׁפַּט הַמְּלֻכָה
  choice: அரசாட்சிக்குரிய உரிமைகளையும் கடமைகளையும்
  rationale: מִשְׁפַּט என்பது சட்டமுறை, உரிமை, கடமை அல்லது நிலைபெற்ற நடைமுறை ஆகிய பொருள்களைத் தரலாம்; מְלֻכָה இங்கு ஒரு நிலப்பரப்பைவிட அரசாட்சியின் அமைப்பைக் குறிக்கிறது. முதன்மை உரை சட்டரீதியான இருபக்கக் கட்டுப்பாடுகளை இயல்பாகத் தெரிவிக்கிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: וַיִּכְתֹּב בַּסֵּפֶר
  choice: அவற்றை ஓர் ஆவணத்தில் எழுதி
  rationale: குறிப்பிடப்பட்ட விதிமுறைகளைத் தமிழில் பன்மையாகச் சுட்டுவது இயல்பு. סֵפֶר என்பது நூல், சுருள் அல்லது எழுத்து ஆவணமாக இருக்கலாம்; ‘ஆவணம்’ அதன் வடிவத்தைத் தேவையின்றிக் குறிப்பாக்காமல் சூழலுக்குப் பொருந்துகிறது.
- source_word: וַיַּנַּח לִפְנֵי יְהוָה
  choice: யாவேக்கு முன்பாக வைத்தார்
  rationale: נוח என்பதன் காரணவினை வடிவம் இங்கு எழுதப்பட்ட ஆவணத்தை யாவேயின் முன்னிலையில் வைப்பதைக் குறிக்கிறது; ‘முன்பாக வைத்தார்’ எளிமையாகவும் நெருக்கமாகவும் உள்ளது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய தனிப்பெயரான יהוה-ஐ ஒரு பட்டத்தால் மாற்றாமல், நவீனத் தமிழில் பரவலாகப் புரிந்துகொள்ளத்தக்க ‘யாவே’ என ஒலிபெயர்க்கிறது.
- source_word: וַיְשַׁלַּח
  choice: அனுப்பிவிட்டார்
  rationale: இங்கு ஒரு பணிக்காக அனுப்புதல் அல்ல, கூட்டத்தை முடித்து மக்கள் புறப்படும்படி விடுவித்தல் பொருள்; ‘அனுப்பிவிட்டார்’ அதை இயல்பாகக் காட்டுகிறது.
- source_word: אִישׁ לְבֵיתוֹ
  choice: ஒவ்வொருவரும் தத்தம் வீட்டுக்குச் சென்றனர்
  rationale: எபிரெய மொழியின் ஒருமை விநியோகத் தொடர் ஒவ்வொருவரும் அவரவர் வீட்டிற்குத் திரும்பியதைச் சொல்கிறது. தமிழில் ‘ஒவ்வொருவரும் தத்தம் வீட்டுக்கு’ அதே விநியோகப் பொருளை இயல்பாகத் தருகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் பட்டமல்ல, நான்கு எழுத்துகளாலான தனிப்பெயர் நேரடியாக உள்ளது; ஆகவே அதைத் தமிழில் ஒலிபெயர்த்து தனிப்பெயரின் தன்மையைப் பாதுகாக்கிறது.
- issue: מִשְׁפַּט הַמְּלֻכָה என்பதன் வரம்பு
  choice: அரசாட்சிக்குரிய உரிமைகளையும் கடமைகளையும்
  alternative: அரசாட்சியின் முறைமை / வழக்கம்
  rationale: இந்தச் சொற்றொடர் அரசரின் ஒருதலைப்பட்ச உரிமைகளை மட்டும் குறிக்க வேண்டியதில்லை; அரசாட்சியை ஒழுங்குபடுத்தும் விதிகள் அல்லது நிலைபெற்ற நடைமுறையையும் குறிக்கலாம். முதன்மை வாசகம் சட்டரீதியான உள்ளடக்கத்தைத் தருகிறது; தெளிவின்மை அடிக்குறிப்பில் விடப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான உரைநடை பயன்படுத்தப்பட்டுள்ளது. ‘அரசாட்சி’ என்பது מְלֻכָה-வை நிலப்பரப்பு சார்ந்த ‘ராஜ்யம்’ என்பதற்குப் பதிலாக ஆட்சிநிறுவனமாகக் காட்டுகிறது. ஆண் ஒருமை வடிவத்தைச் சொற்சொறாகச் சுமத்தாமல், தமிழின் இயல்பான விநியோகத் தொடரில் பொருள் பாதுகாக்கப்பட்டுள்ளது.
