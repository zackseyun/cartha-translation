base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/009.yaml
  text: And it happened[a], when he turned his back to go from Samuel, that God gave him another heart[b], and all these signs came to pass on that day.
translation:
  language: ta
  text: சாமுவேலைவிட்டுப் புறப்பட்டுச் செல்ல அவர் திரும்பியபோது[a], கடவுள் அவருடைய இதயத்தை வேறொரு இதயமாக மாற்றினார்[b]; இந்த அடையாளங்கள் அனைத்தும் அந்த நாளில் நிகழ்ந்தன.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொல்லுக்கு சொல், ‘தன் தோளைத் திருப்பியபோது.’ இது புறப்பட்டுச் செல்வதைக் குறிக்கும் மரபுத்தொடர்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில், ‘கடவுள் அவருக்காக வேறொரு இதயத்தை மாற்றினார்’ என்ற அமைப்பு உள்ளது. அதாவது, கடவுள் அவருடைய உள்ளநிலையை வேறுபடுத்தினார்; அந்த மாற்றத்தின் துல்லியமான தன்மையை இவ்வசனம் விளக்கவில்லை.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהָיָה
  choice: …போது
  rationale: இந்த எபிரெயக் கதைத் தொடர் அமைப்பு அடுத்த காலவாக்கியத்துடன் இணைகிறது. தமிழில் தனியாக ‘அது நிகழ்ந்தது’ என்று சேர்ப்பதைவிட ‘…போது’ என்ற அமைப்பு இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: כְּהַפְנֹתוֹ שִׁכְמוֹ
  choice: தன் முதுகைத் திருப்பியபோது
  rationale: சொல்லுக்கு சொல் ‘தன் தோளைத் திருப்பியபோது’ என்றாலும், இங்கு புறப்பட்டுச் செல்வதைக் குறிக்கும் மரபுத்தொடர். ‘முதுகைத் திருப்புதல்’ நவீன தமிழில் அந்தச் செயலை இயல்பாகத் தெரிவிக்கிறது; மூல உருவகம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: לָלֶכֶת מֵעִם שְׁמוּאֵל
  choice: சாமுவேலைவிட்டுப் போக
  rationale: ‘சாமுவேலிடமிருந்து போக’ என்பதன் பொருளை இயல்பான தமிழில் சுருக்கமாகத் தருகிறது.
- source_word: וַיַּהֲפָךְ
  choice: மாற்றினார்
  rationale: ஹிஃபில் வினை இங்கு ‘திருப்பினார்/மாற்றினார்’ என்று பொருள்படும். ‘தந்தார்’ என்று மொழிபெயர்ப்பதைவிட மூல வினையின் மாற்றச் செயலை இது நேரடியாகப் பாதுகாக்கிறது.
- source_word: לֵב אַחֵר
  choice: வேறொரு இதயம்
  rationale: ‘புதிய இதயம்’ என்று கூறி பிற்கால உடன்படிக்கை அல்லது மறுபிறப்பு சார்ந்த கருத்தைச் சேர்க்காமல், எபிரெயின் ‘மற்றொரு/வேறொரு இதயம்’ என்ற வெளிப்பாட்டைப் பாதுகாக்கிறது.
- source_word: כָּל הָאֹתוֹת הָאֵלֶּה
  choice: இந்த அடையாளங்கள் அனைத்தும்
  rationale: முன்னர் சாமுவேல் கூறிய அடையாளங்களைக் குறிப்பதற்கான நேரடியான, தெளிவான மொழிபெயர்ப்பு.
- source_word: וַיָּבֹאוּ
  choice: நிகழ்ந்தன
  rationale: அடையாளங்கள் நடந்தேறியதை இயல்பான தமிழில் தெரிவிக்கிறது; ‘நிறைவேறின’ என்று மொழிபெயர்த்து மூல வினையைவிட அதிகமான விளக்கத்தைச் சேர்ப்பதைத் தவிர்க்கிறது.
- source_word: בַּיּוֹם הַהוּא
  choice: அந்த நாளில்
  rationale: காலத்தைக் குறிக்கும் எபிரெயச் சொற்றொடரின் நேரடியான தமிழ் வடிவம்.
theological_decisions:
- issue: சவுலின் இதயத்தில் கடவுள் செய்த மாற்றத்தின் தன்மை
  choice: கடவுள் அவருடைய இதயத்தை வேறொரு இதயமாக மாற்றினார்
  alternative: கடவுள் அவருக்குப் புதிய இதயத்தைக் கொடுத்தார்
  rationale: மூல உரை உண்மையான இறைச் செயலைக் கூறுகிறது; ஆனால் அதை மறுபிறப்பு, மனமாற்றம் அல்லது வெறும் அரசத் துணிவு என்று வரையறுக்கவில்லை. ‘வேறொரு இதயம்’ என்ற திறந்த வெளிப்பாட்டையும் ‘மாற்றினார்’ என்ற வினையையும் வைத்திருப்பது அந்த இறையியல் பதற்றத்தைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில் இயல்பாகவும் மரியாதைமிக்கதாகவும் அமைக்கப்பட்டது. ‘முதுகைத் திருப்புதல்’ என்ற இயல்பான தமிழ் மரபுத்தொடர் பயன்படுத்தப்பட்டு, எபிரெயின் ‘தோள்’ உருவகம் அடிக்குறிப்பில் தரப்பட்டது. ‘வேறொரு இதயம்’ மற்றும் ‘மாற்றினார்’ என்பவை மூல உரையின் தெளிவையும் இறையியல் திறந்த நிலையையும் பாதுகாக்கின்றன.
