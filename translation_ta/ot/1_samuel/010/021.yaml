source:
  edition: WLC
  text: וַ/יַּקְרֵ֞ב אֶת שֵׁ֤בֶט בִּנְיָמִן֙ ל/משפחת/ו וַ/תִּלָּכֵ֖ד מִשְׁפַּ֣חַת הַ/מַּטְרִ֑י וַ/יִּלָּכֵד֙ שָׁא֣וּל בֶּן קִ֔ישׁ וַ/יְבַקְשֻׁ֖/הוּ וְ/לֹ֥א נִמְצָֽא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/021.yaml
  text: Then he brought the tribe of Benjamin near by its clans[a], and the clan of the Matrites was taken. Then Saul son of Kish was taken, but when they sought him[b], he could not be found.
translation:
  language: ta
  text: பின்பு அவர் பென்யமீன் கோத்திரத்தை அதன் குலங்களின்படி[a] அருகே வரச்செய்தார். மத்ரியரின் குலம் சீட்டினால் தெரிந்தெடுக்கப்பட்டது[b]. அதன்பின் கீசின் மகன் சவுல் சீட்டினால் தெரிந்தெடுக்கப்பட்டார்; ஆனால் அவரைத் தேடியபோது, அவர் காணப்படவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இன்னும் சொல்லுக்கு நெருக்கமாக, “அதன் குடும்பங்களின்படி.” இங்குள்ள எபிரேயச் சொல் ஒரு கோத்திரத்திற்குள் உள்ள விரிவான குடும்பக் குழுக்களையோ குலங்களையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “தெரிந்தெடுக்கப்பட்டது” என்பது சீட்டுப் போடுதலின் மூலம் சுட்டிக்காட்டப்பட்டதைக் குறிக்கிறது. இதற்கான எபிரேயச் சொல் சொல்லுக்கு நெருக்கமாக “பிடிக்கப்பட்டது” எனப் பொருள்படலாம்; இங்கு போர் அல்லது கைது குறிக்கப்படவில்லை.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּקְרֵב
  choice: அருகே வரச்செய்தார்
  rationale: קרב என்பதன் ஹிப்ஈல் வடிவம் ‘அருகே கொண்டுவருதல்/வரச்செய்தல்’ என்று பொருள்படும். சீட்டுப் போடும் நடைமுறைக்காகக் குழுக்களை முன்வரச் செய்ததை இச்சொல் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: שֵׁבֶט בִּנְיָמִן
  choice: பென்யமீன் கோத்திரம்
  rationale: இஸ்ரவேலின் பழங்குடி அமைப்பைக் குறிக்கும் שֵׁבֶט என்பதற்கு நவீனத் தமிழ் வேதாகம நடையில் புரிந்துகொள்ளத்தக்க ‘கோத்திரம்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: לְמִשְׁפְּחֹתָיו
  choice: அதன் குலங்களின்படி
  rationale: מִשְׁפָּחָה இங்கு தனிக்குடும்பத்தைவிட கோத்திரத்திற்குள் உள்ள விரிவான உறவுக்குழுவைக் குறிக்கிறது; לְ என்பதன் பகிர்வு/வகைப்பாட்டு உணர்வை ‘-களின்படி’ காட்டுகிறது.
- source_word: וַתִּלָּכֵד / וַיִּלָּכֵד
  choice: சீட்டினால் தெரிந்தெடுக்கப்பட்டது / தெரிந்தெடுக்கப்பட்டார்
  rationale: לכד என்பதன் நிப்அல் வடிவம் சொற்படியாக ‘பிடிக்கப்பட்டது’ என்றாலும், இச்சூழலில் சீட்டினால் சுட்டிக்காட்டப்பட்டுத் தேர்வானதைக் குறிக்கிறது. தமிழில் ‘பிடிபட்டது’ குற்றம் அல்லது வன்முறையான கைப்பற்றலைத் தவறாக உணர்த்தக்கூடும் என்பதால் சூழற்பொருள் தெளிவுபடுத்தப்பட்டுள்ளது.
- source_word: מִשְׁפַּחַת הַמַּטְרִי
  choice: மத்ரியரின் குலம்
  rationale: הַמַּטְרִי என்பது ஒரு குழு/வம்சப்பெயர். அதை ஒரே மூதாதையின் பெயராக மாற்றாமல் ‘மத்ரியர்’ என்ற குழுப்பெயராகப் பாதுகாக்கிறது.
- source_word: שָׁאוּל בֶּן־קִישׁ
  choice: கீசின் மகன் சவுல்
  rationale: எபிரேயத் தந்தைவழிப் பெயரடையாளத்தை இயல்பான தமிழில் நேரடியாக வழங்குகிறது.
- source_word: וַיְבַקְשֻׁהוּ
  choice: அவரைத் தேடியபோது
  rationale: בקשׁ என்பதன் ‘தேடுதல்’ என்ற பொருளையும், அடுத்த கூற்றுடன் உள்ள காலத் தொடர்பையும் இயல்பான தமிழில் காட்டுகிறது.
- source_word: וְלֹא נִמְצָא
  choice: அவர் காணப்படவில்லை
  rationale: מצא என்பதன் நிப்அல் செயப்பாட்டு வடிவத்தைப் பாதுகாக்கும் நேரடியான, இயல்பான தமிழ்.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான வரலாற்று-விவரண நடை பயன்படுத்தப்பட்டுள்ளது. ‘கோத்திரம் → குலம் → தனிநபர்’ என்ற தேர்வின் படிநிலை தெளிவாக வைக்கப்பட்டுள்ளது. மூலத்தின் ஒரே לכד வினை இருமுறையும் வருவதைத் தமிழிலும் ஒரே ‘சீட்டினால் தெரிந்தெடுக்கப்படுதல்’ என்ற தொடரால் பிரதிபலித்துள்ளது; அடிக்குறிப்பு அதன் சொற்பொருள் மற்றும் சூழற்பொருள் இடையிலான வேறுபாட்டைக் காக்கிறது.
