  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יַּצְעֵ֤ק שְׁמוּאֵל֙ אֶת הָ/עָ֔ם אֶל יְהוָ֖ה הַ/מִּצְפָּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/017.yaml
  text: Then Samuel called the people together to Yahweh at Mizpah[a].
translation:
  language: ta
  text: பின்பு சாமுவேல் மக்களை மிஸ்பாவில் யாவேயிடம் ஒன்றுகூடும்படி அழைத்தார்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மிஸ்பாவில் யாவேயிடம் மக்களை வரவழைத்தார்.” எபிரெய வினைச்சொல் ஒரு கூட்டத்தைக் கூடிவருமாறு அழைப்பதையோ வரவழைப்பதையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּצְעֵק
  choice: ஒன்றுகூடும்படி அழைத்தார்
  rationale: צעק என்பதன் பொதுவான பொருள் ‘கதறுதல்/கூக்குரலிடுதல்’ என்றாலும், இங்கு ‘மக்களை’ என்ற நேரடிச் செயப்படுபொருளோடு வருவதால் மக்களைக் கூட்டமாக வரவழைப்பதைக் குறிக்கிறது. நவீன தமிழில் ‘ஒன்றுகூடும்படி அழைத்தார்’ என்பது அந்தச் சூழலை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: אֶת הָעָם
  choice: மக்களை
  rationale: עָם இங்கு இஸ்ரவேல் மக்களைக் குறிக்கிறது; ‘மக்களை’ என்பது நேரடியும் சூழலுக்கு ஏற்றதுமான மொழிபெயர்ப்பு.
- source_word: אֶל
  choice: யாவேயிடம்
  rationale: אֶל என்பதன் அடிப்படைத் திசைப் பொருளான ‘நோக்கி/இடம்’ என்பதைப் பாதுகாக்க ‘யாவேயிடம்’ என மொழிபெயர்க்கப்பட்டுள்ளது; ‘முன்னிலையில்’ என்று மாற்றி அதன் உறவைத் தீர்மானமாக விளக்குவது தவிர்க்கப்பட்டுள்ளது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இது தேவனுடைய தனிப்பெயரான நான்கெழுத்துப் பெயர்; ஒரு பட்டப்பெயரால் மாற்றாமல் தமிழில் ‘யாவே’ என்று ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: הַמִּצְפָּה
  choice: மிஸ்பாவில்
  rationale: מִצְפָּה இங்கு ஓர் இடப்பெயர். தமிழில் ‘மிஸ்பா’ என்று ஒலிபெயர்த்து, கூடுகை நடைபெற்ற இடத்தைக் காட்ட ‘மிஸ்பாவில்’ என வழங்கப்பட்டுள்ளது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: எபிரெய உரையில் இறைவனுடைய தனிப்பெயர் நேரடியாக உள்ளது. ஆகவே அதை ஒரு பட்டப்பெயரால் மாற்றாமல் ‘யாவே’ என்று ஒலிபெயர்ப்பது மூல உரையின் தன்மையைப் பாதுகாக்கிறது.
- issue: மக்கள் யாவேயோடு கொண்டுள்ள இடவியல்/வழிபாட்டு உறவு
  choice: யாவேயிடம்
  alternative: யாவே முன்னிலையில்
  rationale: אֶל என்பதிலுள்ள ‘நோக்கி/இடம்’ என்ற வடிவை முடிந்தவரை பாதுகாக்கிறது. ‘முன்னிலையில்’ என்பது சூழலுக்கு ஏற்ற விளக்கமாக இருக்கலாம்; ஆனால் அது மூலத்தில் வெளிப்படையாக இல்லாத ஒரு பொருள் விளக்கத்தை உறுதிப்படுத்தும் என்பதால் முதன்மை உரையில் தவிர்க்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியும் அதேவேளையில் மரியாதைமிக்க நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. எபிரெயச் சொல்லமைப்பின் அசட்டுத்தனத்தைத் தவிர்க்க இடப்பெயர் தமிழுக்கேற்ற இடவேற்றுமையுடன் வழங்கப்பட்டுள்ளது; אֶל என்பதன் உண்மையான தெளிவின்மை ‘யாவேயிடம்’ என்பதன் மூலம் காக்கப்பட்டுள்ளது.
