  text: וַ/יַּקְרֵ֣ב שְׁמוּאֵ֔ל אֵ֖ת כָּל שִׁבְטֵ֣י יִשְׂרָאֵ֑ל וַ/יִּלָּכֵ֖ד שֵׁ֥בֶט בִּנְיָמִֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/020.yaml
  text: Then Samuel brought near all the tribes of Israel[a], and the tribe of Benjamin was taken.
translation:
  language: ta
  text: பின்பு சாமுவேல் இஸ்ரவேலின் எல்லாக் கோத்திரங்களையும் முன்னே வரச் செய்தார்; பென்யமீன் கோத்திரம் பிடிக்கப்பட்டது[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தேர்ந்தெடுக்கப்பட்டது.” எபிரேய மொழியில் எழுத்துப்படி “பிடிக்கப்பட்டது”; இங்கே இது சீட்டினால் தேர்ந்தெடுக்கப்பட்டதைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּקְרֵב
  choice: முன்னே வரச் செய்தார்
  rationale: קרב என்பதன் ஹிபீல் வடிவம் ‘அருகே கொண்டுவருதல்/முன்னிலைப்படுத்துதல்’ என்று பொருள்படும். சீட்டுப்போட்டுத் தேர்ந்தெடுக்கும் இச்சூழலில், கோத்திரங்களைத் தேர்வுக்காக முன்னே வரச் செய்ததை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: שְׁמוּאֵל
  choice: சாமுவேல்
  rationale: தமிழில் வழக்கில் நிலைபெற்றுள்ள பெயர் வடிவம்.
- source_word: כָּל שִׁבְטֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் எல்லாக் கோத்திரங்களையும்
  rationale: כָּל என்பதன் முழுமையான கூட்டு வரம்பையும், எபிரேய இணைப்புத் தொடரின் பொருளையும் தெளிவாகக் காக்கிறது.
- source_word: וַיִּלָּכֵד
  choice: பிடிக்கப்பட்டது
  rationale: לכד என்பதன் நிஃபால் வடிவத்திலுள்ள ‘பிடிக்கப்படுதல்’ என்ற நேரடிப் படிமத்தைப் பாதுகாக்கிறது. இச்சூழலில் அது சீட்டினால் தேர்ந்தெடுக்கப்பட்டதைக் குறிக்கிறது; அந்த விளக்கம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: שֵׁבֶט בִּנְיָמִן
  choice: பென்யமீன் கோத்திரம்
  rationale: ஒரு குறிப்பிட்ட கோத்திரம் மற்ற கோத்திரங்களிலிருந்து அடையாளம் காணப்படுவதை இயல்பான தமிழில் கூறுகிறது.
theological_decisions:
- issue: தெய்வீகத் தேர்வுச் செயல்முறையை வினையில் வெளிப்படையாகச் சேர்த்தல்
  choice: ‘பிடிக்கப்பட்டது’ என்ற மூலத்தின் செயப்பாட்டு வடிவத்தைப் பேணுதல்
  alternative: ‘தேர்ந்தெடுக்கப்பட்டது’ அல்லது ‘ஆண்டவரால் தேர்ந்தெடுக்கப்பட்டது’
  rationale: மூல எபிரேய உரை செயலைச் செய்தவரையோ சீட்டையோ இவ்வசனத்தில் வெளிப்படையாகக் குறிப்பிடவில்லை. ஆகவே அந்தத் தெளிவின்மையைப் பாதுகாத்து, தேவையற்ற இறையியல் விளக்கத்தை முதன்மை உரையில் சேர்க்கவில்லை.
translation_notes:
  register: நவீன தரத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘முன்னே வரச் செய்தார்’ என்பது சடங்கு அல்லது தேர்வு சூழலைத் தெளிவாக்குகிறது; ‘பிடிக்கப்பட்டது’ மூலத்தின் உருவகத்தையும் செயப்பாட்டு அமைப்பையும் காக்கிறது.
