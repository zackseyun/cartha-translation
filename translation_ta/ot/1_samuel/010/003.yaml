  rationale: חלף மற்றும் הָלְאָה ஆகிய இரண்டும் அடுத்த இடத்தை நோக்கித் தொடர்ந்து முன்னே செல்லும் இயக்கத்தைக் காட்டுகின்றன. தமிழ் நடையில் அவற்றின் ஒருங்கிணைந்த வலியுறுத்தலை இயல்பாகப் பாதுகாக்கிறது.
- source_word: אֵלוֹן תָּבוֹר
  choice: தாபோரின் பெருமரம்
  rationale: אֵלוֹן என்பது ஓக் அல்லது டெரிபிந்த் போன்ற குறிப்பிடத்தக்க பெரிய மரத்தைக் குறிக்கலாம். குறிப்பிட்ட மரவகையைத் தீர்மானிக்காமல் மூலத்தின் தெளிவின்மையைப் பாதுகாக்க ‘பெருமரம்’ பயன்படுத்தப்பட்டது.
- source_word: וּמְצָאוּךָ
  choice: உன்னைச் சந்திப்பார்கள்
  rationale: வினைச்சொல்லின் அடிப்படைப் பொருள் ‘உன்னைக் கண்டடைவார்கள்’ என்றாலும், இச்சூழலில் எதிரே வந்து சந்திப்பதையே இயல்பான தமிழில் குறிக்கிறது.
- source_word: עֹלִים אֶל־הָאֱלֹהִים בֵּית אֵל
  choice: பெத்தேலில் கடவுளிடம் ஏறிச் செல்லும்
  rationale: எபிரெயச் சொல்லமைப்பில் உள்ள கடவுளை நோக்கிய திசையையும் பெத்தேலுடனான தொடர்பையும் பாதுகாக்கிறது; மூலத்தில் வெளிப்படையாக இல்லாத ‘வழிபட’ அல்லது ‘பலியிட’ என்பவற்றைச் சேர்க்கவில்லை.
- source_word: גְדָיִים
