base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/003.yaml
  text: 'Then you will pass on from there and go farther[a], and you will come to the oak of Tabor. There three men going up to God at Bethel will meet you: one carrying three young goats, another carrying three loaves of bread[c][b], and another carrying a wineskin.'
translation:
  language: ta
  text: பின்பு நீ அங்கிருந்து தொடர்ந்து இன்னும் அப்பால் சென்று, தாபோரின் பெருமரத்திடம்[a] வருவாய். அங்கே பெத்தேலில் கடவுளிடம் ஏறிச் செல்லும்[b] மூன்று மனிதர்கள் உன்னைச் சந்திப்பார்கள். அவர்களில் ஒருவன் மூன்று வெள்ளாட்டுக் குட்டிகளையும், இன்னொருவன் மூன்று அப்பங்களையும், மற்றொருவன் திராட்சரசத் தோல் பையையும்[c] சுமந்துவருவான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயச் சொல் ஓக் அல்லது டெரிபிந்த் போன்ற ஒரு பெரிய மரத்தைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: 'சொல்லுக்குச் சொல்: ‘கடவுளிடம் ஏறிச் செல்கிறவர்கள்—பெத்தேல்.’ இது பெத்தேலில் இருந்த ஒரு வழிபாட்டிடத்திற்குச் செல்வதைக் குறிக்கலாம்.'
    reason: cultural_note
  - marker: c
    text: அல்லது ‘திராட்சரசம் கொண்ட தோல் பை.’ இது திராட்சரசத்தை வைத்துச் செல்லும் தோலாலான கொள்கலன்.
    reason: lexical_alternative
lexical_decisions:
