  rationale: இச்சொல் இளம் ஆடுகளை, குறிப்பாக வெள்ளாட்டுக் குட்டிகளை, தெளிவாகக் குறிக்கிறது.
- source_word: כִּכְּרוֹת לֶחֶם
  choice: அப்பங்கள்
  rationale: כִּכָּר என்பது வட்டமான அப்பம் அல்லது அப்பக் கட்டியைக் குறிக்கலாம். ‘அப்பங்கள்’ என்பது இங்கு இயல்பானதும் போதுமான துல்லியமுடையதும் ஆகும்.
- source_word: נֵבֶל יָיִן
  choice: திராட்சரசம் நிறைந்த தோற்பை
  rationale: נֵבֶל இச்சூழலில் திரவத்தை, இங்கு திராட்சரசத்தை, வைத்துச் செல்லும் தோலாலான கொள்கலனைக் குறிக்கிறது. தமிழ் வாசகருக்குப் பொருளைத் தெளிவாக்க ‘நிறைந்த’ என்பது உடைமைத் தொடர்பை இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: ‘பெத்தேலில் கடவுளிடம் ஏறிச் செல்லும்’ என்பதன் பொருள்
  choice: பெத்தேலுடன் தொடர்புடைய இடத்தில் கடவுளை நோக்கிச் செல்லும் பயணமாக மொழிபெயர்க்கப்பட்டது.
  alternative: ‘பெத்தேலில் கடவுளை வழிபடச் செல்லும்’ அல்லது ‘பெத்தேலில் உள்ள கடவுளின் இல்லத்திற்குச் செல்லும்’
  rationale: இது ஒரு வழிபாட்டுப் பயணமாக இருக்கலாம்; ஆனால் இவ்வாக்கியத்தில் ‘வழிபாடு’, ‘பலி’ அல்லது ‘கடவுளின் இல்லம்’ என்பவை வெளிப்படையாகக் கூறப்படவில்லை. ஆகவே மத நோக்கைத் தக்கவைத்தபடியே கூடுதல் சடங்கு விவரங்கள் சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீனத் தரமான, மரியாதைமிக்க, பொதுவாசகர்களுக்குப் புரியும் தமிழ் பயன்படுத்தப்பட்டது. ‘பெருமரம்’ மூலத்தின் மரவகைத் தெளிவின்மையைப் பாதுகாக்கிறது. வாக்கியத்தின் தொடர்ச்சியான இயக்கம் மற்றும் மூன்று மனிதர்களின் இணையான சுமைகள் தெளிவாக அமைக்கப்பட்டுள்ளன.
