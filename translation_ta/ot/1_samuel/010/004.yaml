translation_notes:
  register: நவீனத் தரத் தமிழில், எளிதில் புரியும் அதேவேளையில் வேதாகம உரைக்கேற்ற கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. முன்னறிவிப்பின் எதிர்காலத் தன்மை தெளிவாக வைக்கப்பட்டு, எபிரெய மரபுத்தொடர்களின் மாற்றுப் பொருள்கள் அடிக்குறிப்புகளில் பாதுகாக்கப்பட்டுள்ளன.
