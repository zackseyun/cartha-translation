id: 1SA.10.4
reference: 1 Samuel 10:4
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וְ/שָׁאֲל֥וּ לְ/ךָ֖ לְ/שָׁל֑וֹם וְ/נָתְנ֤וּ לְ/ךָ֙ שְׁתֵּי לֶ֔חֶם וְ/לָקַחְתָּ֖ מִ/יָּדָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/004.yaml
  text: They will ask you about your welfare and give you two loaves of bread[c][b][a], and you shall receive them from their hand.
translation:
  language: ta
  text: அவர்கள் உன் நலனை விசாரித்து[a], இரண்டு அப்பங்களை உனக்குக் கொடுப்பார்கள்[b]; நீ அவற்றை அவர்களுடைய கையிலிருந்து பெற்றுக்கொள்வாய்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்கள் உனக்கு வாழ்த்துச் சொல்வார்கள்.” எபிரெய மரபுத்தொடர் சொல்லர்த்தமாக நலன் அல்லது சமாதானத்தைப் பற்றி விசாரிப்பதைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: சொல்லர்த்தமாக, “இரண்டு அப்பம்”; எண்ணிக்கையுடன் வருவதால் தமிழில் “இரண்டு அப்பங்கள்” என்று தரப்பட்டுள்ளது.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, “நீ அவற்றை அவர்களுடைய கையிலிருந்து எடுத்துக்கொள்வாய்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁאֲלוּ לְךָ לְשָׁלוֹם
  choice: அவர்கள் உன் நலனை விசாரித்து
  rationale: שׁאל ... לְשָׁלוֹם என்பது ஒருவருடைய நலத்தை விசாரிப்பதையோ அவரை வாழ்த்துவதையோ குறிக்கும் எபிரெய மரபுத்தொடர். தமிழில் ‘நலனை விசாரித்து’ என்பது அதன் நேரடியான உறவாடல் பொருளை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: שָׁלוֹם
  choice: நலன்
  rationale: இச்சூழலில் שָׁלוֹם என்பது பொதுவான ‘சமாதானம்’ என்பதைக் காட்டிலும் ஒருவரின் நல்வாழ்வு அல்லது நிலைமையைக் குறிக்கிறது.
- source_word: וְנָתְנוּ לְךָ
  choice: உனக்குக் கொடுப்பார்கள்
  rationale: தொடர்வினை வடிவம் சாமுவேல் முன்னறிவிக்கும் எதிர்கால நிகழ்வைத் தொடர்கிறது; தமிழில் வெளிப்படையான எதிர்கால வினை இயல்பானது.
- source_word: שְׁתֵּי לֶחֶם
  choice: இரண்டு அப்பங்கள்
  rationale: எண்ணிக்கையுடன் வரும் לֶחֶם தனித்தனி அப்பங்களைக் குறிக்கிறது. ‘இரண்டு அப்பங்கள்’ என்பது நவீன தமிழில் சுருக்கமாகவும் இயல்பாகவும் உள்ளது.
- source_word: וְלָקַחְתָּ מִיָּדָם
  choice: நீ அவற்றை அவர்களுடைய கையிலிருந்து பெற்றுக்கொள்வாய்
  rationale: לקח அடிப்படையில் ‘எடு’ என்று பொருள்பட்டாலும், கொடுக்கப்படும் அப்பங்களை ஏற்றுக்கொள்வது இச்சூழலின் செயல். ‘பெற்றுக்கொள்வாய்’ இதை இயல்பாகக் காட்டுகிறது; ‘கையிலிருந்து’ மூலத்தின் உருவகத்தையும் காக்கிறது.
- source_word: מִיָּדָם
  choice: அவர்களுடைய கையிலிருந்து
  rationale: எபிரெயத்தில் ‘கை’ ஒருமையாகவும் உடைமைப் பின்னொட்டு பன்மையாகவும் உள்ளது. தமிழிலும் கூட்டுப் பொருளில் ஒருமையான ‘கை’ புரியத்தக்கதாக இருப்பதால் மூல உருவகம் பாதுகாக்கப்படுகிறது.
