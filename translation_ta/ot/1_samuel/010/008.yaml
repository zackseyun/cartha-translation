base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/008.yaml
  text: And you shall go down before me to Gilgal. And behold[a], I am coming down to you to offer burnt offerings and to sacrifice peace offerings. You shall wait seven days, until I come to you and make known to you what you shall do.
translation:
  language: ta
  text: நீ எனக்கு முன்னதாகக் கில்காலுக்கு இறங்கிச் செல். இதோ, முழுதகனப் பலிகளைச் செலுத்தவும் சமாதானப் பலிகளை[a] பலியிடவும் நான் உன்னிடம் இறங்கி வருவேன். நான் உன்னிடம் வரும்வரை ஏழு நாட்கள் காத்திரு; நீ என்ன செய்ய வேண்டும் என்பதை உனக்குத் தெரிவிப்பேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “உறவுப் பலிகள்” அல்லது “நல்வாழ்வுப் பலிகள்” என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் சமாதானம், முழுநலம் மற்றும் பகிர்ந்துறவு ஆகியவற்றோடு தொடர்புடைய பலிகளைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָרַדְתָּ
  choice: இறங்கிச் செல்
  rationale: இடம் சார்ந்த ‘இறங்குதல்’ என்ற பொருளைப் பேணுகிறது; அறிவுறுத்தல் தொடரில் வரும் எபிரெய வடிவத்தை இயல்பான தமிழ் கட்டளையாக வழங்குகிறது.
- source_word: לְפָנַי
  choice: எனக்கு முன்னதாக
  rationale: சவுல் சாமுவேலுக்கு முன்பே கில்காலுக்குச் செல்ல வேண்டும் என்ற கால மற்றும் இட முன்னுரிமையைத் தெளிவாகக் காட்டுகிறது.
- source_word: הַגִּלְגָּל
  choice: கில்கால்
  rationale: இடப்பெயர் தமிழில் ஒலிபெயர்க்கப்பட்டது.
- source_word: וְהִנֵּה
  choice: இதோ
  rationale: கவனத்தை ஈர்க்கும் எபிரெயச் சொல்லின் உயிரோட்டத்தையும் வலியுறுத்தலையும் இயல்பான நவீன தமிழில் பேணுகிறது.
- source_word: יֹרֵד
  choice: இறங்கி வருவேன்
  rationale: சாமுவேல் சவுல் இருக்கும் இடத்தை நோக்கி வருவதையும், மூலத்தின் ‘இறங்குதல்’ என்ற இடவுணர்வையும் இணைத்துக் காட்டுகிறது.
- source_word: לְהַעֲלוֹת עֹלוֹת
  choice: தகனபலிகளைச் செலுத்த
  rationale: முழுவதும் எரிக்கப்படும் பலிகளைச் செலுத்துவதைக் குறிக்கும் வழக்கமான பலியியல் சொற்றொடர்.
- source_word: לִזְבֹּחַ זִבְחֵי שְׁלָמִים
  choice: சமாதானப் பலிகளைப் பலியிட
  rationale: வினைச்சொல்–பெயர்ச்சொல் தொடர்பைப் பேணுவதோடு, שְׁלָמִים என்பதன் மரபான பொருளையும் வழங்குகிறது; அதன் விரிந்த பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: שִׁבְעַת יָמִים תּוֹחֵל
  choice: ஏழு நாட்கள் காத்திரு
  rationale: இச்சூழலில் יחל என்பது ‘நம்பிக்கைகொள்’ என்பதைக் காட்டிலும் ‘காத்திரு’ என்று பொருள்படுகிறது.
- source_word: עַד בּוֹאִי אֵלֶיךָ
  choice: நான் உன்னிடம் வந்து
  rationale: அடுத்த வாக்கியத்துடன் இயல்பாக இணைக்கப்பட்டாலும், சாமுவேல் வரும்வரை காத்திருக்க வேண்டும் என்ற எல்லையைச் சூழல் தெளிவாகப் பேணுகிறது.
- source_word: וְהוֹדַעְתִּי לְךָ
  choice: உனக்குத் தெரிவிப்பேன்
  rationale: ידע என்பதன் ஹிபீல் வடிவமான ‘அறியச் செய்’ என்பதற்கு இயல்பான தமிழ் இணை.
- source_word: אֵת אֲשֶׁר תַּעֲשֶׂה
  choice: நீ என்ன செய்ய வேண்டும் என்பதை
  rationale: தொடர்ந்து செய்ய வேண்டிய செயலை அறிவுறுத்தும் பொருளைத் தெளிவான நவீன தமிழில் தருகிறது.
theological_decisions:
- issue: שְׁלָמִים என்ற பலியியல் சொல்லின் மொழிபெயர்ப்பு
  choice: சமாதானப் பலிகள்
  alternative: உறவுப் பலிகள்; நல்வாழ்வுப் பலிகள்
  rationale: இச்சொல் சமாதானம், முழுநலம், நல்வாழ்வு, பகிர்ந்துண்ணும் உறவு ஆகிய கருத்துகளுடன் தொடர்புடைய பலிவகையைக் குறிக்கிறது. மரபாக அறியப்படும் ‘சமாதானப் பலிகள்’ முதன்மை உரையில் வைக்கப்பட்டு, பொருள் வரம்பைச் சுருக்காமல் மாற்றுகள் அடிக்குறிப்பில் தரப்படுகின்றன.
translation_notes:
  register: நவீனத் தரத் தமிழில், மரியாதையும் வேதாகமச் செறிவும் கொண்ட எளிய நடை பயன்படுத்தப்பட்டுள்ளது. ஒருமை இரண்டாம் நபர் வடிவங்கள் சாமுவேல் சவுலிடம் நேரடியாகப் பேசுவதைப் பேணுகின்றன. ஆங்கில ஆலோசனை உரையில் தவறான இடத்தில் இருந்த அடிக்குறிப்பு குறியீடு, அதன் பொருளுக்குரிய ‘சமாதானப் பலிகள்’ என்பதற்குப் பின் வைக்கப்பட்டுள்ளது.
