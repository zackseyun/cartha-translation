  text: וַ/יָּבֹ֤אוּ שָׁם֙ הַ/גִּבְעָ֔תָ/ה וְ/הִנֵּ֥ה חֶֽבֶל נְבִאִ֖ים לִ/קְרָאת֑/וֹ וַ/תִּצְלַ֤ח עָלָי/ו֙ ר֣וּחַ אֱלֹהִ֔ים וַ/יִּתְנַבֵּ֖א בְּ/תוֹכָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/010.yaml
  text: When they came there to the hill[a], behold, a band of prophets came to meet him, and the Spirit of God rushed upon him, and he prophesied among them.
translation:
  language: ta
  text: அவர்கள் அங்கே அந்தக் குன்றுக்கு[a] வந்தபோது, இதோ, இறைவாக்கினர்களின் ஒரு குழு அவனைச் சந்திக்க வந்தது. அப்போது கடவுளின் ஆவி அவன்மேல் வல்லமையோடு இறங்கியது; அவனும் அவர்கள் நடுவில் இறைவாக்குரைத்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘கிபியாவுக்கு.’ எபிரெய வடிவத்தை ஓர் இடப்பெயராகவும், ‘அந்தக் குன்றுக்கு’ என்றும் வாசிக்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: הַגִּבְעָתָה
  choice: அந்தக் குன்றுக்கு
  rationale: இச்சொல்லில் திசையைக் குறிக்கும் முடிவொட்டு உள்ளது; இதை பொதுப்பெயராக ‘அந்தக் குன்றுக்கு’ என்றும், இடப்பெயராக ‘கிபியாவுக்கு’ என்றும் புரிந்துகொள்ளலாம். எபிரெயச் சொல்லிலுள்ள சுட்டியுடன் கூடிய வரையறை உருபை இயல்பான தமிழில் ‘அந்த’ என வெளிப்படுத்துவது உடனடிச் சூழலுக்கு ஏற்றது.
- source_word: חֶבֶל נְבִאִים
  choice: இறைவாக்கினர்களின் ஒரு குழு
  rationale: חֶבֶל இங்கு கயிறு என்ற பொருளில் அல்லாமல் ஒரு கூட்டத்தைக் குறிக்கிறது. ‘ஒரு குழு’ என்பது இயல்பான நவீனத் தமிழ்; נְבִאִים என்பதற்கு ‘இறைவாக்கினர்கள்’ என்பது அவர்களது பணியைத் தெளிவாகக் காட்டுகிறது.
- source_word: לִקְרָאתוֹ
  choice: அவனைச் சந்திக்க வந்தது
  rationale: இந்த அமைப்பு சவுலை எதிர்கொண்டு சந்திப்பதற்கான இயக்கத்தைக் குறிக்கிறது; தமிழில் ‘சந்திக்க வந்தது’ என்பது இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: רוּחַ אֱלֹהִים
  choice: கடவுளின் ஆவி
  rationale: இக்கதையில் கடவுள் அருளும் அடையாளமும் வல்லமையளிப்பும் முன்னிலையில் உள்ளதால், இந்த இணைச்சொல் கடவுளுக்குரிய ஆவியைக் குறிப்பதாக மொழிபெயர்க்கப்பட்டது; எபிரெயத்தை மீறிய பிற்காலக் கோட்பாட்டு நுணுக்கம் சேர்க்கப்படவில்லை.
- source_word: וַתִּצְלַח עָלָיו
  choice: அவன்மேல் வல்லமையோடு இறங்கியது
  rationale: רוּחַ என்பதுடன் வரும் צלח, சாமுவேல் நூல்களில் திடீரான, வலிமையான ஆவி வருகையையும் செயல்படுத்துதலையும் குறிக்கிறது. ‘வல்லமையோடு இறங்கியது’ அந்தத் தீவிரத்தை இயல்பான தமிழில் காக்கிறது.
- source_word: וַיִּתְנַבֵּא
  choice: அவன் இறைவாக்குரைத்தான்
  rationale: இந்த வடிவம் இறைவாக்குச் செயல்பாட்டைக் குறிக்கிறது. அதன் முறை அல்லது உள்ளடக்கத்தை உரை விளக்காததால், ‘இறைவாக்குரைத்தான்’ என்று பொதுவாகவே வைக்கப்பட்டது.
- source_word: בְּתוֹכָם
  choice: அவர்கள் நடுவில்
  rationale: சவுல் அந்த இறைவாக்கினர் குழுவுக்குள் கலந்து இறைவாக்குரைத்ததை இச்சொற்றொடர் காட்டுகிறது; ‘அவர்கள் நடுவில்’ என்பது மூலத்தின் இடவுணர்வைத் தெளிவாகக் காக்கிறது.
- source_word: וְהִנֵּה
  choice: இதோ
  rationale: הִנֵּה திடீர் காட்சியைக் கவனத்திற்குக் கொண்டுவருகிறது. ‘இதோ’ என்பது அதன் உரையாடல் வலிமையை நவீன, கண்ணியமான தமிழில் இயல்பாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: רוּחַ אֱלֹהִים என்பதன் பொருள்
  choice: கடவுளின் ஆவி
  alternative: கடவுளிடமிருந்து வந்த ஓர் ஆவி
  rationale: சவுலுக்குக் கொடுக்கப்பட்ட தெய்வீக அடையாளமும் அவனை ஆட்கொள்ளும் வல்லமையும் இச்சூழலில் பேசப்படுவதால், ‘கடவுளின் ஆவி’ என்பதே இயல்பான வாசிப்பு. ஆயினும், பிற்காலத் திரித்துவச் சொற்பிரயோகத்தின் முழு துல்லியத்தையும் இந்தப் பழைய ஏற்பாட்டு சொற்றொடர்மேல் திணிக்காமல் மொழிபெயர்க்கப்பட்டுள்ளது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான வேதாகம நடையைப் பயன்படுத்துகிறது. ‘இதோ’ மூலத்தின் கவன ஈர்ப்பைத் தக்கவைக்கிறது; ‘இறைவாக்குரைத்தான்’ என்பது செயலை அளவுக்கு மீறி விளக்காமல் விடுகிறது. அடிக்குறிப்பு குறியீடு பிரதான உரையில் இணைக்கப்பட்டுள்ளது.
