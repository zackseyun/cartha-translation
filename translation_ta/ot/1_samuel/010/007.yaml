base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/007.yaml
  text: And when these signs come to you[a], do whatever your hand finds to do, for God is with you.
translation:
  language: ta
  text: இந்த அடையாளங்கள் உனக்கு நேரிடும்போது, உன்னால் செய்ய முடிவதைச் செய்[a]; ஏனெனில் கடவுள் உன்னோடு இருக்கிறார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கிடைக்கும் வாய்ப்பின்படி செய்.” எபிரெய மொழிமரபில் சொல்லுக்கு சொல், “உன் கை கண்டடைவதைச் செய்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: நிகழும்போது
  rationale: எதிர்காலத்தில் உருவாகும் சூழ்நிலையை அறிமுகப்படுத்தும் எபிரெயக் கட்டமைப்பை இயல்பான நவீனத் தமிழில் காலப் பொருளுடன் தருகிறது.
- source_word: תבאינה הָאֹתוֹת הָאֵלֶּה לָךְ
  choice: இந்த அடையாளங்கள் உனக்கு நிகழும்போது
  rationale: அடையாளங்களை எழுவாய் ஆக்கும் בוא இங்கு அவை வந்து நிறைவேறுவதை அல்லது நிகழ்வதைச் சுட்டுகிறது; தமிழில் ‘நிகழும்போது’ தெளிவாக உள்ளது.
- source_word: עֲשֵׂה לְךָ
  choice: செய்
  rationale: לְךָ தனிப்பட்ட ஈடுபாட்டை வலியுறுத்தினாலும், தமிழில் ‘உனக்காகச் செய்’ என்பது தவறாக சுயநல நோக்கைக் குறிக்கக்கூடும்; கட்டளையின் இயல்பான வலிமையை ‘செய்’ காக்கிறது.
- source_word: אֲשֶׁר תִּמְצָא יָדֶךָ
  choice: உன் கைக்கு எது கிடைக்கிறதோ அதை
  rationale: ‘கை கண்டடைவது’ என்ற எபிரெய மொழிமரபின் உருவகத்தைத் தமிழில் இயன்றவரை காக்கிறது; அதன் பொருள் ஒருவரால் செய்ய வாய்ப்புள்ள அல்லது ஆற்றலுள்ள செயல்.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய கட்டளைக்கான காரணத்தைத் தெளிவாக அறிமுகப்படுத்துகிறது.
- source_word: הָאֱלֹהִים
  choice: கடவுள்
  rationale: இங்குள்ள வரையறைச் சுட்டியுடன் கூடிய பெயர் இஸ்ரவேலின் கடவுளைத் திட்டவட்டமாகக் குறிக்கிறது; தமிழில் இயல்பாக ‘கடவுள்’ என வழங்கப்படுகிறது.
- source_word: עִמָּךְ
  choice: உன்னோடு இருக்கிறார்
  rationale: சவுலின் செயலுக்கு ஆதரவாக இருக்கும் தெய்வீக உடனிருப்பை நேரடியாகவும் மரியாதையாகவும் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: הָאֱלֹהִים என்பதில் உள்ள வரையறைச் சுட்டி
  choice: கடவுள்
  alternative: அந்தக் கடவுள்
  rationale: எபிரெயத்தில் வரையறைச் சுட்டி இருந்தாலும், இச்சூழலில் அது இஸ்ரவேலின் கடவுளைக் குறிக்கும் வழக்கமான திட்டவட்டப் பயன்பாடு; ‘அந்தக் கடவுள்’ என்பது தமிழில் தேவையற்ற ஒப்பீடு அல்லது தூரத்தை உண்டாக்கும்.
- issue: தெய்வீக உடனிருப்புக்கும் சவுலின் செயல் சுதந்திரத்திற்கும் இடையிலான தொடர்பு
  choice: கட்டளையையும் அதன் காரணமாகிய ‘கடவுள் உன்னோடு இருக்கிறார்’ என்பதையும் இணைத்தே வைத்தல்
  alternative: கடவுள் ஒரு குறிப்பிட்ட செயலை முன்கூட்டியே அங்கீகரிக்கிறார் என்று விரிவாக்குதல்
  rationale: மூலம் சவுலுக்கு செயலாற்ற இடமளித்தாலும் எந்தக் குறிப்பிட்ட செயலையும் பெயரிடவில்லை; அந்தத் திறந்த தன்மையையும் இறையியல் பதற்றத்தையும் மொழிபெயர்ப்பு காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையும் எளிமையும் கொண்ட நடை. சவுலை ஒருமை இரண்டாம் நபரில் அணுகுவதால் ‘உனக்கு/உன்/உன்னோடு’ பயன்படுத்தப்பட்டுள்ளது. முதன்மை உரையில் எபிரெய உருவகம் ஓரளவு காக்கப்பட்டு, அதன் இயல்பான பொருள் அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது.
