revisions:
- from: இந்த அடையாளங்கள் உனக்கு நிகழும்போது, உன் கைக்கு எது கிடைக்கிறதோ அதைச் செய்[a]; ஏனெனில் கடவுள் உன்னோடு இருக்கிறார்.
  to: இந்த அடையாளங்கள் உனக்கு நேரிடும்போது, உன்னால் செய்ய முடிவதைச் செய்[a]; ஏனெனில் கடவுள் உன்னோடு இருக்கிறார்.
