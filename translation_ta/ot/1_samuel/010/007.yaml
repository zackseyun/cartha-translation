    reason: lexical_alternative
  revision_rationale: The revision replaces an ambiguous literal Tamil phrasing of the Hebrew hand idiom with a natural equivalent meaning “do what you are able to do,” while preserving the literal imagery and an opportunity-based alternative in the footnote. It also uses a more idiomatic Tamil expression for the signs coming to pass.
