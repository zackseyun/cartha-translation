review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys the temporal circumstance, the arrival/occurrence of the signs, the open-ended imperative, and the reason grounded in God's presence. However, “உன் கைக்கு எது கிடைக்கிறதோ அதைச் செய்” can naturally be understood as acting on whatever object comes into one's hand, rather than the Hebrew idiom for whatever one is able or has opportunity to do. A modest idiomatic revision conveys the intended scope more reliably.
  naturalness: “இந்த அடையாளங்கள் உனக்கு நேரிடும்போது” is a more idiomatic modern Tamil expression for signs coming to pass to someone. “உன்னால் செய்ய முடிவதைச் செய்” is clear, natural Tamil and communicates the Hebrew idiom without introducing a self-interested sense.
  terminology: “அடையாளங்கள்,” “கடவுள்,” and “உன்னோடு இருக்கிறார்” are appropriate modern-standard Tamil choices. The singular familiar address consistently reflects the Hebrew second-person singular address to Saul. The footnote retains the hand idiom as a literal-form explanation.
  issues:
  - severity: medium
    issue: The main rendering of the hand idiom is potentially misleading.
    rationale: “உன் கைக்கு எது கிடைக்கிறதோ அதைச் செய்” may refer to an object that comes to hand, whereas אֲשֶׁר תִּמְצָא יָדֶךָ idiomatically refers to what one is able or finds an occasion to do. Rendering it as what one can do is more accurate in Tamil.
  - severity: low
    issue: The expression for the signs is somewhat wooden.
    rationale: “உனக்கு நிகழும்போது” is understandable, but “உனக்கு நேரிடும்போது” more naturally expresses that these signs come to pass to Saul.
  revised_text: இந்த அடையாளங்கள் உனக்கு நேரிடும்போது, உன்னால் செய்ய முடிவதைச் செய்[a]; ஏனெனில் கடவுள் உன்னோடு இருக்கிறார்.
  revised_footnotes:
