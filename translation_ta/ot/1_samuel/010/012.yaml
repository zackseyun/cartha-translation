base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/012.yaml
  text: 'Then a man from there answered and said[a], “And who is their father?” Therefore it became a proverb: “Is Saul also among the prophets?”'
translation:
  language: ta
  text: 'அப்போது அந்த இடத்தைச் சேர்ந்த ஒருவன் பதிலளித்துச் சொன்னான்: “அவர்களுடைய தந்தை யார்?”[a] இதனால்தான், “சவுலும் தீர்க்கதரிசிகளுள் ஒருவனா?” என்பது பழமொழியாயிற்று.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவனுடைய தந்தை யார்?” சில மொழிபெயர்ப்புகள் இந்தக் கேள்வி சவுலை மட்டும் குறிப்பதாகக் கொள்கின்றன; ஆனால் மசோரா உரையில் “அவர்களுடைய தந்தை” என்ற பன்மை வடிவமே உள்ளது.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעַן
  choice: மறுமொழியாக ... என்றான்
  rationale: ענה என்பதன் கதைநடைப் பயன்பாடு ஒருவரின் பதிலை அறிமுகப்படுத்துகிறது; நவீன தமிழில் இயல்பாக இருக்க இவ்வாறு வழங்கப்பட்டது.
- source_word: אִישׁ מִשָּׁם
  choice: அங்கிருந்த ஒருவன்
  rationale: பெயர் குறிப்பிடப்படாத அந்த இடத்தைச் சேர்ந்த ஓர் ஆணைக் குறிக்கிறது; சொல்லுக்குச் சொல் அமைப்பைவிட தமிழில் இது இயல்பானது.
- source_word: וּמִי אֲבִיהֶם
  choice: அவர்களுடைய தந்தை யார்?
  rationale: மசோரா உரையில் உள்ள மூன்றாம் நபர் ஆண்பால் பன்மை பின்னொட்டைத் தக்கவைத்து, தீர்க்கதரிசிகளின் குழுவைக் குறிப்பிடுகிறது.
- source_word: עַל כֵּן
  choice: இதனால்தான்
  rationale: அந்தக் கூற்று பழமொழியாக உருவானதற்கான காரணவிளைவை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: הָיְתָה לְמָשָׁל
  choice: பழமொழியாயிற்று
  rationale: מָשָׁל இங்கு நீண்ட உவமையையல்ல, வழக்கில் நிலைத்த ஒரு பழமொழிக் கூற்றைக் குறிக்கிறது.
- source_word: הֲגַם
  choice: '...உம் ... ஒருவனா?'
  rationale: கேள்விக்குறியுடன் கூடிய גַּם வியப்புடன் ஒருவரையும் அந்தக் குழுவில் சேர்த்துக் கேட்கிறது; தமிழில் ‘சவுலும்’ இதைக் காட்டுகிறது.
- source_word: בַּנְּבִאִים
  choice: தீர்க்கதரிசிகளுள்
  rationale: ב இங்கு ஒரு குழுவுக்குள் இடம்பெறுதலைக் குறிக்கிறது; ‘தீர்க்கதரிசிகளுள்’ சுருக்கமாகவும் துல்லியமாகவும் உள்ளது.
theological_decisions:
- issue: “அவர்களுடைய தந்தை” என்பதன் சுட்டுப்பொருள்
  choice: மசோரா உரையின் பன்மையைத் தக்கவைத்து, தீர்க்கதரிசிகளின் குழுவைக் குறிக்கும் “அவர்களுடைய தந்தை” என்று மொழிபெயர்த்தல்
  alternative: கேள்வி சவுலை மட்டும் குறிக்கிறது எனக் கொண்டு, “அவனுடைய தந்தை யார்?” என்று மொழிபெயர்த்தல்
  rationale: எபிரெய வடிவியல் பன்மைப் பின்னொட்டை ஆதரிக்கிறது. தீர்க்கதரிசனச் செயல்பாடு குறிப்பிட்ட தந்தைவழி மரபால் தீர்மானிக்கப்படுவதில்லை என்ற சூழல்சார் கருத்தையும் இது இயல்பாகக் கொண்டுள்ளது. ஒருமை வாசிப்பு மொழிபெயர்ப்பு மரபில் காணப்படுவதால் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘தீர்க்கதரிசி’ என்பது பொதுவாக அறியப்பட்ட வேதாகமச் சொல் என்பதால் தக்கவைக்கப்பட்டது. எபிரெயத்தின் பன்மை வாசிப்பு பிரதான உரையில் பாதுகாக்கப்பட்டு, ஒருமை விளக்கம் அடிக்குறிப்பில் வழங்கப்பட்டுள்ளது.
