revisions:
- from: அப்போது அங்கிருந்த ஒருவன் மறுமொழியாக, “அவர்களுடைய தந்தை யார்?”[a] என்றான். இதனால்தான், “சவுலும் தீர்க்கதரிசிகளுள் ஒருவனா?” என்பது பழமொழியாயிற்று.
