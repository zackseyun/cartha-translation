- from: ஆனால் இன்று, உங்கள் எல்லாத் தீங்குகளிலிருந்தும் நெருக்கடிகளிலிருந்தும் உங்களை மீட்கிற உங்கள் கடவுளை நீங்கள் புறக்கணித்துவிட்டு, அவரிடம், “இல்லை, எங்கள்மேல் ஓர் அரசனை ஏற்படுத்தும்” என்று சொன்னீர்கள். ஆகவே இப்போது உங்கள் கோத்திரங்களின்படியும் உங்கள் ஆயிரப்பிரிவுகளின்படியும்[a] யாவேக்கு முன்பாக வந்து நில்லுங்கள்.
  to: ஆனால் இன்று, உங்கள் எல்லாப் பேரிடர்களிலிருந்தும் நெருக்கடிகளிலிருந்தும் உங்களை மீட்கிற உங்கள் கடவுளை நீங்கள் நிராகரித்தீர்கள். நீங்கள் அவரிடம், “எங்கள்மேல் ஒரு அரசனை நியமியும்” என்று சொன்னீர்கள். ஆகவே இப்போது உங்கள் கோத்திரங்களின்படியும் உங்கள் ஆயிரங்களின்படியும்[a] யாவேக்கு முன்னால் நிற்குங்கள்.
  rationale: The revision strengthens the rendering of rejection, avoids making one contested interpretation of כִּי explicit, removes an added motion verb, and retains the ambiguity of אֶלֶף through a correctly anchored footnote. It also uses more natural modern Tamil syntax without altering the verse’s meaning.
