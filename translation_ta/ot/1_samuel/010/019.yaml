base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/019.yaml
  text: But today you have rejected your God[a], who himself saves you from all your calamities and distresses, and you have said to him, ‘No[b], but set a king over us.’ So now present yourselves before Yahweh by your tribes and by your thousands.
translation:
  language: ta
  text: ஆனால் இன்று, உங்கள் எல்லாப் பேரிடர்களிலிருந்தும் நெருக்கடிகளிலிருந்தும் உங்களை மீட்கிற உங்கள் கடவுளை நீங்கள் நிராகரித்தீர்கள். நீங்கள் அவரிடம், “எங்கள்மேல் ஒரு அரசனை நியமியும்” என்று சொன்னீர்கள். ஆகவே இப்போது உங்கள் கோத்திரங்களின்படியும் உங்கள் ஆயிரங்களின்படியும்[a] யாவேக்கு முன்னால் நிற்குங்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ஆயிரங்கள்” என்பது குலங்கள் அல்லது ஆயிரம் பேர் கொண்ட சமூக அல்லது இராணுவப் பிரிவுகள் என்றும் பொருள்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְאַסְתֶּם
  choice: புறக்கணித்துவிட்டு
  rationale: מָאַס என்பது நிராகரித்தல் அல்லது ஒதுக்குதல் என்ற வலுவான பொருளைக் கொண்டது. இங்கு கடவுளின் ஆட்சியை ஏற்க மறுத்த உடன்படிக்கைச் சூழலை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: אֱלֹהֵיכֶם
  choice: உங்கள் கடவுள்
  rationale: வடிவத்தில் பன்மையாக இருந்தாலும், ஒருமைச் சுட்டுப்பெயராலும் சூழலாலும் இஸ்ரவேலின் ஒரே கடவுளையே குறிக்கிறது.
- source_word: מוֹשִׁיעַ
  choice: மீட்கிற
  rationale: பங்கேற்புவினை கடவுளின் தொடர்ந்த அல்லது இயல்பான மீட்புச் செயலைக் குறிக்கிறது; நிகழ்கால உறவெச்சம் இதைத் தெளிவாகக் காட்டுகிறது.
- source_word: מִכָּל רָעוֹתֵיכֶם
  choice: உங்கள் எல்லாத் தீங்குகளிலிருந்தும்
  rationale: רָעוֹת என்பது அனுபவிக்கப்படும் தீங்கு, துன்பம் அல்லது பேரிடரைக் குறிக்கலாம். ‘தீங்குகள்’ மூலச்சொல்லின் பரப்பைத் தக்கவைக்கிறது.
- source_word: וְצָרֹתֵיכֶם
  choice: நெருக்கடிகளிலிருந்தும்
  rationale: צָרוֹת என்பது இடுக்கண், நெருக்கடி, துன்பநிலை ஆகியவற்றைக் குறிக்கிறது; முந்தைய சொல்லுடன் வேறுபாட்டையும் இணைப்பையும் காக்கிறது.
- source_word: כִּי
  choice: இல்லை
  rationale: மக்களின் வலியுறுத்தலான எதிர்மறைத் திருப்பத்தைச் சூழல் உணர்த்துகிறது. ‘இல்லை’ என்பது அந்த எதிர்ப்பை இயல்பான நேரடிக் கூற்றாக வெளிப்படுத்துகிறது; எனினும் இது எபிரெயச் சொல்லின் ஒரே சாத்தியமான பொருள் அல்ல.
- source_word: תָּשִׂים
  choice: ஏற்படுத்தும்
  rationale: שׂוּם என்பதன் ‘வை/நியமி’ என்ற பொருளை, அரசனை ஆட்சியில் அமைக்கும் சூழலில் இயல்பாகக் காட்டுகிறது.
- source_word: הִתְיַצְּבוּ
  choice: வந்து நில்லுங்கள்
  rationale: தேர்ந்தெடுக்கும் நிகழ்வுக்காக யாவேக்கு முன் முறையாகத் தங்களை நிறுத்திக்கொள்ளும் செயலைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரான நான்கெழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: לְשִׁבְטֵיכֶם
  choice: உங்கள் கோத்திரங்களின்படி
  rationale: לְ இங்கு குழுக்களாக ஒழுங்குபடுத்தப்படுவதைச் சுட்டுகிறது.
- source_word: וּלְאַלְפֵיכֶם
  choice: உங்கள் ஆயிரப்பிரிவுகளின்படி
  rationale: אֶלֶף என்பது வெறும் எண்ணிக்கையை மட்டுமல்லாமல் சமூக அல்லது இராணுவ நிர்வாகப் பிரிவையும் குறிக்கக்கூடும்; ‘ஆயிரப்பிரிவுகள்’ அந்த இரு அம்சங்களையும் ஓரளவு தக்கவைக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் தனிப்பட்ட தெய்வீகப் பெயர் நேரடியாக உள்ளது; ஆகவே அதைப் பட்டமாக மாற்றாமல் ஒலிபெயர்ப்பது மூலத்திற்கு நெருக்கமானது.
- issue: மக்களின் வேண்டுகோளில் כִּי என்பதன் வலிமை
  choice: “இல்லை, எங்கள்மேல் ஓர் அரசனை ஏற்படுத்தும்”
  alternative: “எங்கள்மேல் ஓர் அரசனை ஏற்படுத்தும்”
  rationale: சூழலில் கடவுளின் மீட்பை நிராகரித்து அரசனை வற்புறுத்தும் முரண்பாடு உள்ளது. ‘இல்லை’ அந்த வலிமையை வெளிப்படுத்துகிறது; ஆனால் எபிரெயத்தில் அது தனிப்பட்ட மறுப்புச் சொல்லாகத் தெளிவாக இல்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியுமாறு மரியாதையும் வேதாகமச் செறிவும் கொண்ட நடை பயன்படுத்தப்பட்டது. ‘கோத்திரம்’, ‘யாவே’ போன்ற நிலைபெற்ற வேதாகமச் சொற்கள் தக்கவைக்கப்பட்டன; நிர்வாகப் பொருளின் தெளிவுக்காக ‘ஆயிரப்பிரிவுகள்’ பயன்படுத்தப்பட்டது.
