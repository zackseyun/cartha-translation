  text: וַ/יֹּ֤אמֶר שְׁמוּאֵל֙ לַ/טַּבָּ֔ח תְּנָ/ה֙ אֶת הַ/מָּנָ֔ה אֲשֶׁ֥ר נָתַ֖תִּי לָ֑/ךְ אֲשֶׁר֙ אָמַ֣רְתִּי אֵלֶ֔י/ךָ שִׂ֥ים אֹתָ֖/הּ עִמָּֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/023.yaml
  text: Then Samuel said to the cook[a], “Bring the portion that I gave you, of which I said to you, ‘Set it aside with you.’”
translation:
  language: ta
  text: அப்போது சாமுவேல் சமையற்காரனிடம்[a], “நான் உன்னிடம் கொடுத்து, ‘இதை உன்னிடமே வைத்திரு’ என்று சொன்ன அந்தப் பங்கை எடுத்துக்கொண்டு வா” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது, “அந்தப் பங்கைக் கொடு … அதை உன்னிடம் வைத்திரு.” எபிரெயச் சொற்களை இன்னும் நேரடியாக மொழிபெயர்த்தால்: “நான் உனக்குக் கொடுத்த பங்கைக் கொடு; அதைக் குறித்து நான் உன்னிடம், ‘அதை உன்னுடன் வை’ என்று சொன்னேன்.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: טַּבָּח
  choice: சமையற்காரன்
  rationale: பலியுணவு விருந்தின் சூழலில் இறைச்சியைத் தயார் செய்து பரிமாறும் நபரை இயல்பாகக் குறிக்கிறது; ‘கசாப்புக்காரன்’ என்பது சொல்லியல் வாய்ப்பாக இருந்தாலும் இச்சூழலுக்கு குறைவாகப் பொருந்துகிறது.
- source_word: תְּנָה
  choice: எடுத்துக்கொண்டு வா
  rationale: அடிப்படைப் பொருள் ‘கொடு’ என்றாலும், முன்பே ஒதுக்கி வைக்கப்பட்ட உணவுப் பங்கை இப்போது கொண்டுவருமாறு சொல்லும் சூழ்நிலைப் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: מָּנָה
  choice: பங்கு
  rationale: உணவில் ஒருவருக்காக நியமிக்கப்பட்ட அல்லது ஒதுக்கப்பட்ட பகுதியைக் குறிக்கிறது.
- source_word: אֲשֶׁר נָתַתִּי לָךְ
  choice: நான் உன்னிடம் கொடுத்து
  rationale: சாமுவேல் அந்தப் பங்கை முன்னதாகவே சமையற்காரனிடம் கொடுத்திருந்தார் என்ற எளிய வினைப் பொருளைப் பாதுகாக்கிறது.
- source_word: שִׂים אֹתָהּ עִמָּךְ
  choice: இதை உன்னிடமே வைத்திரு
  rationale: ‘அதை உன்னுடன் வை’ என்ற எபிரெயச் சொல்லமைப்பை இயல்பான தமிழில் தருவதோடு, பின்னர் பயன்படுத்துவதற்காக வைத்திருக்குமாறு கூறிய கருத்தையும் பாதுகாக்கிறது.
