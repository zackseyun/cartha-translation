translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையும் வாசிப்பின் இயல்பும் காக்கப்பட்டுள்ளன. உரையாடலில் ஒருமை நெருக்குச் சுட்டான ‘உன்/உன்னிடம்’ பயன்படுத்தப்பட்டு, எபிரெய மூலத்தின் ஒருமை இரண்டாம் நபர் வடிவம் பிரதிபலிக்கப்பட்டுள்ளது.
