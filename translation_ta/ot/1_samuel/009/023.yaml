  source_fidelity: மூல எபிரெயத்தின் தொடர்ச்சியான கட்டளை, ‘பங்கு’ என்ற உணவுப் பகிர்வு, முன்பு கொடுக்கப்பட்டதையும் அதைத் தன்னிடத்தில் வைக்கும்படி சொல்லப்பட்டதையும் குறிக்கும் இரு தொடர்புத் தொடர்கள் ஆகியவை துல்லியமாகப் பாதுகாக்கப்பட்டுள்ளன. “எடுத்துக்கொண்டு வா” என்பது תְּנָה (‘கொடு’) என்பதன் விருந்துச் சூழலுக்கேற்ற இயல்பான செயல்பாட்டு மொழியாகும்; பொருளை மீறவில்லை.
  naturalness: நவீன நிலையான தமிழில் வாசிப்பு இயல்பாக உள்ளது. “சமையற்காரன்,” “அந்தப் பங்கு,” “எடுத்துக்கொண்டு வா” ஆகியவை உரையாடல் சூழலுக்கு ஏற்றவை. “உன்னிடமே வைத்திரு” என்பது மூலத்தின் ‘உன்னுடன்/உன்னிடத்தில் வை’ என்ற சொல்லமைப்பைத் தமிழில் தெளிவாகத் தருகிறது.
  terminology: சாமுவேல் என்ற பெயரும், விருந்தில் ஒதுக்கப்பட்ட உணவுப் பகுதியைக் குறிக்கும் “பங்கு” என்பதும் பொருத்தமானவை. இறையியல் அல்லது கோட்பாட்டு நிறமூட்டல் எதுவும் சேர்க்கப்படவில்லை.
