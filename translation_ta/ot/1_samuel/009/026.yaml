translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. எபிரேயத்தின் காலத் தொடரும் ‘அவனும் சாமுவேலும் ஆகிய இருவரும்’ என்ற வலியுறுத்தலும் முடிந்தவரை காக்கப்பட்டுள்ளன. ஆங்கில ஆலோசனை உரையில் அடிக்குறிப்பு குறிகள் பொருந்தாத இடங்களில் இருந்ததால், [a] விடியற்காலைச் சொற்றொடருடனும் [b] வழியனுப்புதல் சொற்றொடருடனும் பொருளுக்கேற்ப இணைக்கப்பட்டுள்ளன.
