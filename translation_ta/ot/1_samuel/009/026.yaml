base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/026.yaml
  text: They rose early[a], and when the dawn was breaking, Samuel called to Saul on the roof, saying, “Get up, and I will send you on your way.” So Saul got up, and the two of them, he and Samuel[b], went outside.
translation:
  language: ta
  text: அவர்கள் அதிகாலையில் எழுந்தார்கள். பொழுது விடியத் தொடங்கியபோது[a], சாமுவேல் வீட்டின் மொட்டைமாடியில் இருந்த சவுலை அழைத்து, “எழுந்திரு; நான் உன்னை வழியனுப்புவேன்[b]” என்றார். சவுல் எழுந்தான்; அவனும் சாமுவேலும் ஆகிய இருவரும் வெளியே சென்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இன்னும் சொல்லுக்குச் சொல் முறையில், “விடியல் எழும்பியபோது.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது “நான் உன்னை அனுப்பிவிடுவேன்.” எபிரேயச் சொல் ஒருவரைப் புறப்பட அனுப்புவதையோ விடை கொடுத்து அனுப்புவதையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁכִּמוּ
  choice: அவர்கள் அதிகாலையில் எழுந்தார்கள்
  rationale: שׁכם என்பதன் ஹிஃபில் வடிவம் அதிகாலையில் எழுதல் அல்லது நாளை முன்கூட்டியே தொடங்குதல் என்ற கருத்தைத் தருகிறது. தமிழில் இயல்பாகவும் காலக் குறிப்பைத் தெளிவாகவும் தெரிவிக்கிறது.
- source_word: כַּעֲלוֹת הַשַּׁחַר
  choice: பொழுது விடியத் தொடங்கியபோது
  rationale: சொல்லுக்குச் சொல் பொருள் ‘விடியல் எழும்பியபோது.’ தேர்ந்தெடுத்த நடை அந்த உருவகத்தை இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: הַגָּג
  choice: வீட்டின் மொட்டைமாடியில்
  rationale: பண்டைய வீடுகளின் தட்டையான கூரை தங்கவும் பயன்படுத்தப்பட்ட இடம். வெறும் ‘கூரை’ என்பதைவிட ‘மொட்டைமாடி’ தமிழில் சூழலைத் தெளிவாக உணர்த்துகிறது; ‘வீட்டின்’ என்பது தமிழில் இயல்புக்காக வெளிப்படுத்தப்பட்ட சூழல்சார் தகவல்.
- source_word: קוּמָה
  choice: எழுந்திரு
  rationale: எழ அல்லது எழுந்து நிற்கும்படி கூறும் கட்டளை. நேரடியான பேச்சில் இயல்பான நவீனத் தமிழ்.
- source_word: וַאֲשַׁלְּחֶךָּ
  choice: நான் உன்னை வழியனுப்புகிறேன்
  rationale: שׁלח இங்கு ஒருவரைப் புறப்பட அனுப்புதல் அல்லது விடை கொடுத்து அனுப்புதல் எனப் பொருள்படலாம். ‘வழியனுப்புகிறேன்’ மரியாதையான பிரிவுச் சூழலைப் பொருத்தமாக வெளிப்படுத்துகிறது.
- source_word: וַיֵּצְאוּ ... הַחוּצָה
  choice: வெளியே சென்றார்கள்
  rationale: வினைச்சொல்லும் திசைச் சொல்லும் சேர்ந்து வெளியே செல்லுதலைக் குறிக்கின்றன; சென்ற இடத்தை ஊகித்துச் சேர்க்காமல் மொழிபெயர்க்கிறது.
- source_word: שְׁנֵיהֶם הוּא וּשְׁמוּאֵל
  choice: அவனும் சாமுவேலும் ஆகிய இருவரும்
  rationale: ‘அவர்கள் இருவரும்—அவனும் சாமுவேலும்’ என்ற எபிரேய அழுத்தத்தை இயல்பான தமிழில் காக்கிறது; ‘அவன்’ என்பது முன் குறிப்பிடப்பட்ட சவுலைக் குறிக்கிறது.
