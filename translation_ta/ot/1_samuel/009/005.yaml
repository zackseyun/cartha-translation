source:
  edition: WLC
  text: הֵ֗מָּה בָּ֚אוּ בְּ/אֶ֣רֶץ צ֔וּף וְ/שָׁא֥וּל אָמַ֛ר לְ/נַעֲר֥/וֹ אֲשֶׁר עִמּ֖/וֹ לְכָ֣/ה וְ/נָשׁ֑וּבָה פֶּן יֶחְדַּ֥ל אָבִ֛/י מִן הָ/אֲתֹנ֖וֹת וְ/דָ֥אַג לָֽ/נוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/005.yaml
  text: When they came into the land of Zuph[a], Saul said to his young man who was with him, “Come, let us return[b], lest my father stop caring about the donkeys and become anxious about us.”
translation:
  language: ta
  text: அவர்கள் சூப் நாட்டுக்கு வந்தபோது, சவுல் தன்னுடன் இருந்த இளைஞனிடம்[a], “வா, நாம் திரும்பிப் போவோம். இல்லையென்றால் என் தந்தை பெண் கழுதைகளைப் பற்றிக் கவலைப்படுவதை விட்டுவிட்டு[b], நம்மைக் குறித்துக் கவலைப்படுவார்[c]” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “இளைஞன்” என்பதற்கு “உதவியாளர்” அல்லது “வேலைக்காரன்” என்றும் பொருள் கொள்ளலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது “பெண் கழுதைகளைக் கவனிப்பதை நிறுத்திவிட்டு.” எபிரெயத்தில் நேரடியாக “பெண் கழுதைகளிலிருந்து விலகி/நிறுத்தி” என்று உள்ளது; அவற்றைப் பற்றிய அக்கறையை நிறுத்துவது என்பது பொருள்.
    reason: lexical_alternative
  - marker: c
    text: அல்லது “நம்மைப் பற்றி மனக்கலக்கம் அடைவார்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּאוּ בְּאֶרֶץ צוּף
  choice: சூப் நாட்டுக்கு வந்தபோது
  rationale: בוא உடன் בְּ இடத்தை அடைந்து நுழைவதைக் குறிக்கிறது. தமிழில் நிகழ்வுகளின் தொடர்பை இயல்பாகக் காட்ட “வந்தபோது” பயன்படுத்தப்பட்டது; צוּף என்ற இடப்பெயர் “சூப்” என ஒலிபெயர்க்கப்பட்டது.
- source_word: נַעֲרוֹ
  choice: தன்னுடன் இருந்த இளைஞன்
  rationale: נַעַר என்பதன் அடிப்படைப் பொருள் இளைஞன்; சூழலில் அவன் சவுலுடன் சென்ற உதவியாளனாக இருந்தாலும், சமூக நிலையைத் தேவையின்றி குறிப்பாக்காமல் மூலச்சொல்லின் பரப்பை வைத்திருக்கிறது.
- source_word: לְכָה וְנָשׁוּבָה
  choice: வா, நாம் திரும்பிப் போவோம்
  rationale: கட்டளையும் cohortative வடிவமும் சேர்ந்த அழைப்புத் தொனியை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: פֶּן
  choice: இல்லையென்றால்
  rationale: எதிர்பார்க்கப்படும் விரும்பத்தகாத விளைவை அறிமுகப்படுத்தும் פֶּן என்பதன் எச்சரிக்கைத் தொனியைத் தெளிவாகக் காட்டுகிறது.
- source_word: יֶחְדַּל ... מִן הָאֲתֹנוֹת
  choice: பெண் கழுதைகளைப் பற்றிக் கவலைப்படுவதை விட்டுவிட்டு
  rationale: חָדַל என்பது நிறுத்துதல் அல்லது விலகுதல்; מִן உடன், கழுதைகள் மீதான கவனத்தை நிறுத்துவது என்ற எபிரெய வழக்கை இயல்பான தமிழில் தருகிறது. אֲתֹנוֹת பெண்பால் கழுதைகளைத் தெளிவாகக் குறிப்பதால் “பெண் கழுதைகள்” என மொழிபெயர்க்கப்பட்டது.
- source_word: וְדָאַג לָנוּ
  choice: நம்மைக் குறித்துக் கவலைப்படுவார்
  rationale: דאג கவலை அல்லது மனக்கலக்கத்தைக் குறிக்கிறது; לָנוּ கவலையின் பொருளாக “நம்மை”ச் சுட்டுகிறது. தந்தையின் கவனம் கழுதைகளிலிருந்து அவர்களிடம் மாறுவதைத் தெளிவாக வெளிப்படுத்துகிறது.
