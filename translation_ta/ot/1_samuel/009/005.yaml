translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்கு எளிதாகவும் மரியாதைமிக்க கதையாடல் நடையிலும் வடிவமைக்கப்பட்டது. உரையாடலில் இயல்பான “வா, நாம் திரும்பிப் போவோம்” பயன்படுத்தப்பட்டது. மூலத்தில் உள்ள பெண் கழுதைகள் என்ற குறிப்பும் נַעַר மற்றும் דאג ஆகியவற்றின் பொருள் நுணுக்கங்களும் அடிக்குறிப்புகளில் பாதுகாக்கப்பட்டன.
