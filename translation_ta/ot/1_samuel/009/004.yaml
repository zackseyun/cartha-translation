  register: நவீன பொதுத்தரத் தமிழில், வாசிக்க எளிதான ஆனால் கண்ணியமான உரைநடை பயன்படுத்தப்பட்டது. பயணத்தின் தொடர்ச்சியை ‘பின்பு’, ‘பின்னர்’ என்பவை காட்டுகின்றன. எபிரெய உரையில் மாறிமாறி வரும் ஒருமை ‘அவன்’ மற்றும் பன்மை ‘அவர்கள்’ திட்டமிட்டே பாதுகாக்கப்பட்டுள்ளன.
