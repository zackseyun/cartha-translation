  source_fidelity: 'எபிரெய மூலத்தின் பயணத் தொடர் துல்லியமாகக் காக்கப்பட்டுள்ளது: முதல் இரண்டு பயண வினைகள் ஒருமையிலும், அடுத்த தேடல்/பயண வினைகள் பன்மையிலும், இறுதி பயண வினை மீண்டும் ஒருமையிலும் மொழிபெயர்க்கப்பட்டுள்ளன. காணாமற்போன கழுதைகளைச் சுட்டும் மறைமுகச் செயப்படுபொருள் ‘அவற்றை’ என இயல்பாக வழங்கப்பட்டுள்ளது. וָאַיִן என்பதன் சுருக்கமான, சூழல்சார் பொருளான ‘அவை அங்கே இல்லை’ என்பதும் பொருத்தமானது.'
  naturalness: நவீன பொதுத்தரத் தமிழில் உரை தெளிவாகவும் இயல்பாகவும் உள்ளது. ‘பின்பு,’ ‘பின்னர்’ ஆகியவை தேடல் பயணத்தின் தொடர்ச்சியைச் சுமையாக இல்லாமல் காட்டுகின்றன. ‘மலைநாடு,’ ‘நாட்டின் வழியாகச் சென்றான்/சென்றார்கள்’ என்பன புவியியல் சூழலுக்கேற்றவை.
  terminology: எப்பிராயீம், சாலிசா, சாலீம், பென்யமீன் ஆகிய இடப்பெயர்கள் ஒலிபெயர்ப்பாக ஒருமையாகக் கையாளப்பட்டுள்ளன. ‘மலைநாடு’ மற்றும் ‘நாடு’ ஆகிய சொற்கள் הַר, אֶרֶץ ஆகியவற்றின் இச்சூழல் புவியியல் பொருளை நன்றாகத் தருகின்றன. அடிக்குறிப்புகள் முறையே மறைமுகச் செயப்படுபொருளையும் வா-ஆயின் என்ற நீள்விடப்பட்ட சொல்லாட்சியையும் விளக்குகின்றன.
