  text: וַ/יַּעֲבֹ֧ר בְּ/הַר אֶפְרַ֛יִם וַ/יַּעֲבֹ֥ר בְּ/אֶֽרֶץ שָׁלִ֖שָׁה וְ/לֹ֣א מָצָ֑אוּ וַ/יַּעַבְר֤וּ בְ/אֶֽרֶץ שַׁעֲלִים֙ וָ/אַ֔יִן וַ/יַּעֲבֹ֥ר בְּ/אֶֽרֶץ יְמִינִ֖י וְ/לֹ֥א מָצָֽאוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/004.yaml
  text: He passed through the hill country of Ephraim and passed through the land of Shalishah[a], but they did not find them. Then they passed through the land of Shaalim, but they were not there. Then he passed through the land of Benjamin[b], but they did not find them.
translation:
  language: ta
  text: அவன் எப்பிராயீமின் மலைநாட்டைக் கடந்து, சாலிசா நாட்டின் வழியாகச் சென்றான்; ஆனால் அவர்கள் அவற்றைக் கண்டுபிடிக்கவில்லை[a]. பின்பு அவர்கள் சாலீம் நாட்டின் வழியாகச் சென்றார்கள்; ஆனால் அவை அங்கே இல்லை[b]. பின்னர் அவன் பென்யமீன் நாட்டின் வழியாகச் சென்றான்; ஆனால் அவர்கள் அவற்றைக் கண்டுபிடிக்கவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அவற்றை’ என்பது எபிரெய மூலத்தில் வெளிப்படையாக இல்லை; முந்தைய சூழலில் காணாமற்போன கழுதைகளையே இது குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில் சொற்பட, ‘அங்கே எதுவும் இல்லை’ அல்லது ‘இல்லை’ என்று உள்ளது; கழுதைகள் அங்கே இல்லை என்பதே சூழல்சார் பொருள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲבֹר / וַיַּעַבְרוּ
  choice: வழியாகச் சென்றான் / வழியாகச் சென்றார்கள்; கடந்து
  rationale: עבר என்பதும் בְ முன்னொட்டும் ஒரு பகுதியின் வழியாகப் பயணிப்பதைக் குறிக்கின்றன. முதல் தொடரில் வரும் மலைப்பகுதிக்கு இயல்பான தமிழாக ‘கடந்து’ என்றும், பெயரிடப்பட்ட நிலப்பகுதிகளுக்கு ‘வழியாகச் சென்றான்/சென்றார்கள்’ என்றும் மொழிபெயர்க்கப்பட்டது; எபிரெய ஒருமை–பன்மை மாற்றமும் காக்கப்பட்டது.
- source_word: בְּהַר אֶפְרַיִם
  choice: எப்பிராயீமின் மலைநாடு
  rationale: הַר இங்கு தனி மலையைக் காட்டாமல் பரந்த மலைப்பாங்கான பகுதியைக் குறிக்கிறது. ஆகவே ‘மலைநாடு’ புவியியல் பொருளைத் தெளிவாகத் தருகிறது.
- source_word: אֶרֶץ שָׁלִשָׁה
  choice: சாலிசா நாடு
  rationale: אֶרֶץ பெயரிடப்பட்ட நிலப்பகுதியைக் குறிக்கிறது. அதன் அரசியல் நிலையை ஊகிக்காமல் ‘நாடு’ என்று வழங்கப்பட்டு, இடப்பெயர் ஒலிபெயர்க்கப்பட்டது.
- source_word: וְלֹא מָצָאוּ
  choice: ஆனால் அவர்கள் அவற்றைக் கண்டுபிடிக்கவில்லை
  rationale: பன்மை வினை சவுலையும் அவனுடைய வேலைக்காரனையும் குறிக்கிறது. செயப்படுபொருள் எபிரெயத்தில் வெளிப்படையாக இல்லை; முந்தைய சூழலிலுள்ள காணாமற்போன கழுதைகளைக் குறிக்கும் ‘அவற்றை’ தமிழில் இயல்புக்காகச் சேர்க்கப்பட்டது.
- source_word: אֶרֶץ שַׁעֲלִים
  choice: சாலீம் நாடு
  rationale: இது பெயரிடப்பட்ட நிலப்பகுதி என்பதால் ‘நாடு’ என வழங்கப்பட்டு, שַׁעֲלִים என்ற இடப்பெயர் ‘சாலீம்’ என ஒலிபெயர்க்கப்பட்டது.
- source_word: וָאַיִן
  choice: ஆனால் அவை அங்கே இல்லை
  rationale: எபிரெயச் சொற்றொடர் சொற்பட ‘அங்கே எதுவும் இல்லை’ அல்லது ‘இல்லை’ எனச் சுருக்கமாக உள்ளது. தேடப்பட்ட கழுதைகளே அங்கே இல்லை என்ற சூழல்சார் பொருள் இயல்பான தமிழில் வெளிப்படுத்தப்பட்டது; அடிப்படைச் சுருக்கம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டது.
- source_word: אֶרֶץ יְמִינִי
  choice: பென்யமீன் நாடு
  rationale: יְמִינִי என்பது பென்யமீனுடன் தொடர்புடைய இன/பெயரடை வடிவம். புவியியல் சூழலில் ‘பென்யமீன் நாடு’ தெளிவான இயல்பான தமிழாகும்.
