base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/021.yaml
  text: Saul answered and said[a], “Am I not a Benjaminite, from the smallest of the tribes of Israel? And is not my clan the least of all the clans of the tribe of Benjamin? So why have you spoken to me in this way?”
translation:
  language: ta
  text: 'சவுல் பதிலளித்துச் சொன்னான்: “நான் இஸ்ரவேலின் மிகச் சிறிய கோத்திரங்களில் ஒன்றான பென்யமீன் கோத்திரத்தைச் சேர்ந்தவன் அல்லவா? என் குலமும் பென்யமீன் கோத்திரத்திலுள்ள எல்லாக் குலங்களிலும் மிகச் சிறியது அல்லவா? அப்படியிருக்க, என்னிடம் ஏன் இப்படிப் பேசினீர்?[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இப்படிப்பட்ட ஒரு காரியத்தை ஏன் என்னிடம் சொன்னீர்?”
    reason: כַּדָּבָר הַזֶּה என்பது பேசப்பட்ட விதத்தையோ பேசப்பட்ட காரியத்தையோ குறிக்கலாம்.
lexical_decisions:
- source_word: הֲלוֹא
  choice: அல்லவா?
  rationale: ஒப்புதலை எதிர்பார்க்கும் எபிரெய மறைமுக வினாவை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: בֶן־יְמִינִי
  choice: பென்யமீன் கோத்திரத்தைச் சேர்ந்தவன்
  rationale: இது பென்யமீனின் நேரடி மகன் என்பதைக் குறிக்காமல், அந்தக் கோத்திரத்தைச் சேர்ந்தவர் என்ற இனக்குழு அடையாளத்தைக் குறிக்கிறது.
- source_word: מִקַּטַנֵּי שִׁבְטֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் கோத்திரங்களிலேயே சிறிய ஒன்றான
  rationale: மூலத்தின் பன்மை வடிவம் ‘சிறியவற்றுள் ஒன்று’ என்ற கருத்தைத் தருவதால், ஒரே ‘மிகச் சிறிய’ கோத்திரம் என்று தேவையின்றி உறுதிப்படுத்தாமல் அளவு அல்லது அந்தஸ்தின் தாழ்வைத் தக்கவைக்கிறது.
- source_word: וּמִשְׁפַּחְתִּי
  choice: என் குலமும்
  rationale: מִשְׁפָּחָה இங்கு தனிக்குடும்பத்தைவிடப் பெரியதும் கோத்திரத்தைவிடச் சிறியதுமான உறவினக் குழுவைக் குறிக்கிறது; ‘குலம்’ அதற்கு இயல்பான தமிழ் இணை.
- source_word: הַצְּעִרָה
  choice: மிகச் சிறியது
  rationale: அளவு அல்லது சமூக முக்கியத்துவத்தில் தாழ்ந்தது என்ற மூலத்தின் பொருள் நுணுக்கத்தை, மிகைப்படுத்திய விளக்கம் சேர்க்காமல் வெளிப்படுத்துகிறது.
- source_word: מִכָּל מִשְׁפְּחוֹת שִׁבְטֵי בִנְיָמִן
  choice: பென்யமீன் கோத்திரத்திலுள்ள எல்லாக் குலங்களிலும்
  rationale: மசோரா உரையில் ‘பென்யமீனின் கோத்திரங்கள்’ எனப் பன்மை வடிவம் இருந்தாலும், சூழலில் பென்யமீன் என்ற ஒரே கோத்திரத்தின் உட்பிரிவுகளே குறிக்கப்படுகின்றன; தமிழ் மொழிபெயர்ப்பு அந்தச் சூழல் பொருளைத் தெளிவாக வழங்குகிறது.
- source_word: וְלָמָּה
  choice: அப்படியிருக்க, ... ஏன்
  rationale: முந்தைய தாழ்மையான சுயவிளக்கத்திலிருந்து எழும் முடிவுறு வினாவை இயல்பான தமிழில் இணைக்கிறது.
- source_word: דִּבַּרְתָּ אֵלַי
  choice: என்னிடம் ... பேசினீர்
  rationale: דבר + אל என்பதன் நேரடியான தொடர்பாடல் பொருளைக் கண்ணியமான ஒருமை முன்னிலை வடிவில் தருகிறது.
- source_word: כַּדָּבָר הַזֶּה
  choice: இப்படிப்
  rationale: சாமுவேல் கூறிய வார்த்தைகளின் முறை அல்லது உள்ளடக்கம் இரண்டையும் குறிக்கக்கூடிய மூலத்தின் நெகிழ்வை இயல்பாகத் தக்கவைக்கிறது; உள்ளடக்கத்தை வலியுறுத்தும் மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
