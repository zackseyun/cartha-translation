base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/017.yaml
  text: When Samuel saw Saul[a], Yahweh answered him, “Look, this is the man of whom I spoke to you. This one shall rule over my people.”
translation:
  language: ta
  text: சாமுவேல் சவுலைக் கண்டபோது, யாவே அவருக்குப் பதிலளித்து, “இதோ, நான் உன்னிடம் குறித்து கூறிய மனிதன் இவன்தான். இவனே என் மக்களை ஆள்வான்[a]” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய வினையை “கட்டுப்படுத்துவான்” அல்லது “தடுத்து நிறுத்துவான்” என்றும் மொழிபெயர்க்கலாம். அந்த வினை தடுத்து வைத்தல், கட்டுப்படுத்துதல், ஆளுதல் ஆகிய பொருள்களைக் கொள்ளக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: רָאָה
  choice: கண்டபோது
  rationale: கதையோட்டத்தில் நேரடியான பார்வைப் புலனை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: וַיהוָה
  choice: யெகோவா
  rationale: எபிரெய மூலத்தில் நேரடியாக வரும் தேவனுடைய தனிப்பெயரான יהוה என்பதைப் பெயராகவே தமிழில் ஒலிபெயர்க்கிறது.
- source_word: עָנָהוּ
  choice: அவருக்குப் பதிலளித்து
  rationale: ענה என்பதன் ‘பதில் கூறுதல்’ என்ற அடிப்படைப் பொருளைப் பாதுகாக்கிறது; முந்தைய இறைத் தொடர்பைச் சூழல் வழங்குகிறது.
- source_word: הִנֵּה
  choice: இதோ
  rationale: கவனத்தைச் சுட்டிக் காட்டும் எபிரெய இடைச்சொல்லின் வலிமையை இயல்பான, கண்ணியமான தமிழில் தருகிறது.
- source_word: הָאִישׁ אֲשֶׁר אָמַרְתִּי אֵלֶיךָ
  choice: நான் உன்னிடம் சொன்ன மனிதன்
  rationale: முன்பு சாமுவேலிடம் குறிப்பிடப்பட்ட மனிதனைச் சுட்டும் உறவுநிலைத் தொடரைச் சுருக்கமாகவும் தெளிவாகவும் தருகிறது.
- source_word: זֶה
  choice: இவனே
  rationale: சவுலை வலியுறுத்திச் சுட்டும் demonstrative-இன் அழுத்தத்தைப் பாதுகாக்கிறது.
- source_word: יַעְצֹר
  choice: ஆள்வான்
  rationale: עצר என்பதற்கு ‘கட்டுப்படுத்துதல்/தடுத்து வைத்தல்’ என்ற சொற்பொருள் இருந்தாலும், இங்கு அரசாட்சிச் சூழலில் மக்கள்மீது கட்டுப்பாட்டு அதிகாரம் செலுத்துவதை ‘ஆள்வான்’ இயல்பாகத் தெரிவிக்கிறது; சொற்பொருள் நுணுக்கம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: בְּעַמִּי
  choice: என் மக்களை
  rationale: இவ்வினையுடன் வரும் בְ ஆளுகைக்குட்படும் மக்களைக் குறிக்கிறது; தமிழ் வினை அமைப்பில் நேரடி செயப்படுபொருளாக இயல்பாக வருகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரின் மொழிபெயர்ப்பு
  choice: யெகோவா
  alternative: கர்த்தர்; யாவே
  rationale: மூலத்தில் உள்ள தனிப்பெயரை பொதுப் பட்டமாக மாற்றாமல் பெயராகக் காட்டுகிறது; தமிழ் வேதாகமப் பயன்பாட்டில் பரவலாக அறியப்படும் வடிவம் தேர்ந்தெடுக்கப்பட்டது.
- issue: சவுலின் அரசாட்சியுடன் தொடர்புடைய יַעְצֹר என்பதன் பொருள்
  choice: என் மக்களை ஆள்வான்
  alternative: என் மக்களைக் கட்டுப்படுத்துவான் / தடுத்து நிறுத்துவான்
  rationale: உடனடி சூழல் சவுலின் தலைமை மற்றும் அரச அதிகாரத்தைப் பற்றியது. எனவே ‘ஆள்வான்’ சூழற்பொருளைத் தெளிவாகத் தருகிறது; வினையின் கட்டுப்படுத்தும் நுணுக்கத்தை அடிக்குறிப்பு வெளிப்படையாகக் குறிப்பிடுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், வேதாகமக் கதையுரைக்கேற்ற கண்ணியமான நடை. ‘இதோ’ மற்றும் ‘இவனே’ ஆகியவை மூலத்தின் இரட்டைச் சுட்டல் அழுத்தத்தைப் பாதுகாக்கின்றன; ஒருமை உரையாடலில் ‘உன்னிடம்’ பயன்படுத்தப்பட்டுள்ளது.
