  to: சாமுவேல் சவுலைக் கண்டபோது, யாவே அவருக்குப் பதிலளித்து, “இதோ, நான் உன்னிடம் குறித்து கூறிய மனிதன் இவன்தான். இவனே என் மக்களை ஆள்வான்[a]” என்றார்.
