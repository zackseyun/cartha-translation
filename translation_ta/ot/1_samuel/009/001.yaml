  text: וַֽ/יְהִי אִ֣ישׁ מ/בן ימין וּ֠/שְׁמ/וֹ קִ֣ישׁ בֶּן אֲבִיאֵ֞ל בֶּן צְר֧וֹר בֶּן בְּכוֹרַ֛ת בֶּן אֲפִ֖יחַ בֶּן אִ֣ישׁ יְמִינִ֑י גִּבּ֖וֹר חָֽיִל־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/001.yaml
  text: There was a man of Benjamin[a], and his name was Kish son of Abiel, son of Zeror, son of Becorath, son of Aphiah, son of a Benjaminite, a mighty man of valor.
translation:
  language: ta
  text: பென்யமீன் கோத்திரத்தைச் சேர்ந்த ஒருவர் இருந்தார். அவர் பெயர் கீஸ். அவர் அபியேலின் மகன்; அபியேல் செரோரின் மகன்; செரோர் பெகோராத்தின் மகன்; பெகோராத் அபியாகின் மகன்; அபியாக் பென்யமீன் கோத்திரத்தைச் சேர்ந்த ஒருவரின் மகன். கீஸ் மிகுந்த வல்லமையுடையவர்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இதனை ‘வீரமிக்க போர்வீரர்,’ ‘சமுதாயத்தில் உயர்ந்த நிலையிலிருந்தவர்,’ அல்லது ‘செல்வமும் செல்வாக்கும் மிக்கவர்’ என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொற்றொடர் சூழலைப் பொறுத்து இராணுவ வலிமை, சமூக நிலை, அல்லது பொருளாதார வளம் ஆகியவற்றைக் குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: இருந்தார்
  rationale: புதிய கதைப்பகுதியை அறிமுகப்படுத்தும் எபிரெய வினைமுறை தமிழில் இயல்பாக ‘இருந்தார்’ என்று தரப்படுகிறது; மூலத்தில் இல்லாத ‘இப்போது’ போன்ற காலச்சொல் சேர்க்கப்படவில்லை.
- source_word: אִישׁ מִבֶּן־יָמִין
  choice: பென்யமீன் கோத்திரத்தைச் சேர்ந்த ஒருவர்
  rationale: இது அந்த மனிதரின் கோத்திரச் சார்பைச் சுட்டுகிறது. ‘கோத்திரம்’ என்பது தமிழ்வாசகருக்கு பொருளைத் தெளிவாக்கும் இயல்பான குறுகிய விரிவாக்கம்.
- source_word: וּשְׁמוֹ קִישׁ
  choice: அவர் பெயர் கீஸ்
  rationale: எபிரெய பெயரிடும் வாய்பாட்டை தெளிவான நவீன தமிழில் தருகிறது; கீஸ் என்ற தனிப்பெயர் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: בֶּן ... בֶּן ...
  choice: மகன்; ... மகன்
  rationale: மீண்டும் வரும் வம்சவரிசை அமைப்பு ஒவ்வொரு தலைமுறையின் உறவையும் தெளிவாகக் காட்டுமாறு பாதுகாக்கப்பட்டுள்ளது; ‘வம்சத்தவர்’ என்று பொதுமைப்படுத்தப்படவில்லை.
- source_word: אֲבִיאֵל / צְרוֹר / בְּכוֹרַת / אֲפִיחַ
  choice: அபியேல் / செரோர் / பெகோராத் / அபியாக்
  rationale: தனிப்பெயர்கள் எபிரெய ஒலிகளுக்கு அண்மையாகவும் தமிழில் வாசிக்க இயலுமாறும் ஒலிபெயர்க்கப்பட்டுள்ளன.
- source_word: בֶּן־אִישׁ יְמִינִי
  choice: பென்யமீனியர் ஒருவரின் மகன்
  rationale: வம்சவரிசையின் முடிவில் வரும் ‘ஒரு பென்யமீனிய மனிதரின் மகன்’ என்ற அடையாளத்தை இயல்பான தமிழில் பாதுகாக்கிறது.
- source_word: גִּבּוֹר חָיִל
  choice: வலிமையும் செல்வாக்கும் மிக்கவர்
  rationale: இந்தச் சொற்றொடர் போர்த்திறன், சமூக மதிப்பு, ஆற்றல் அல்லது செல்வவளம் ஆகிய பல நிழற்பொருள்களைக் கொண்டிருக்கலாம். முதன்மை உரை அதன் பரந்த பொருளை இயன்றவரை திறந்தவையாக வைக்கிறது; மாற்றுப் பொருள்கள் அடிக்குறிப்பில் தரப்படுகின்றன.
