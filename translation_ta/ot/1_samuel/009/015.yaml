source:
  edition: WLC
  text: וַֽ/יהוָ֔ה גָּלָ֖ה אֶת אֹ֣זֶן שְׁמוּאֵ֑ל י֣וֹם אֶחָ֔ד לִ/פְנֵ֥י בֽוֹא שָׁא֖וּל לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/015.yaml
  text: Yahweh had revealed to Samuel one day before Saul came[a], saying,
translation:
  language: ta
  text: 'சவுல் வருவதற்கு ஒரு நாள் முன்பு, யாவே சாமுவேலிடம் இவ்வாறு வெளிப்படுத்தியிருந்தார்[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொல்லுக்கு சொல், “சாமுவேலின் காதைத் திறந்திருந்தார்.” இது அவருக்கு ஒன்றை வெளிப்படுத்தினார் அல்லது தெரிவித்தார் என்று பொருள்படும் மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיהוָה
  choice: யாவே
  rationale: வாக்கியத் தொடக்கத்தில் உள்ள וַ־ இங்கு கதைத் தொடர்ச்சியைக் குறிக்கிறது; தமிழில் தனியான இணைப்புச்சொல் இன்றியே இயல்பாக வெளிப்படுகிறது. יהוה என்பது கடவுளின் தனிப்பெயராக ‘யாவே’ என்று ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: גָּלָה אֶת אֹזֶן שְׁמוּאֵל
  choice: சாமுவேலிடம் ... வெளிப்படுத்தியிருந்தார்
  rationale: சொல்லுக்கு சொல் ‘சாமுவேலின் காதைத் திறந்தார்/வெளிப்படுத்தினார்’ எனும் எபிரெய மரபுத்தொடர், ஒருவருக்கு ஒரு செய்தியைத் தெரிவித்தல் அல்லது வெளிப்படுத்தல் என்று பொருள். தமிழில் பொருளை இயல்பாகத் தரும் வகையில் மொழிபெயர்க்கப்பட்டு, மூல உருவகம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: יוֹם אֶחָד לִפְנֵי בּוֹא שָׁאוּל
  choice: சவுல் வருவதற்கு ஒரு நாள் முன்பு
  rationale: காலத் தொடர்பைத் தெளிவாகவும் இயல்பான நவீனத் தமிழிலும் அளிக்கிறது.
- source_word: לֵאמֹר
  choice: 'இவ்வாறு ... :'
  rationale: அடுத்த வசனத்தில் வரும் நேரடிக் கூற்றை அறிமுகப்படுத்தும் எபிரெய வடிவம். தமிழில் ‘இவ்வாறு’ என்பதும் முக்காற்புள்ளியும் அந்தத் தொடர்பை இயல்பாகக் காட்டுகின்றன.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் பொதுப் பட்டப்பெயர் அல்ல, நான்கெழுத்து இறைத்தனிப்பெயர் நேரடியாக உள்ளது. ஆகவே உடன்படிக்கைப் பெயரை மறைக்காமல் ‘யாவே’ என்று ஒலிபெயர்க்கப்படுகிறது.
- issue: இறைவெளிப்பாட்டின் செயலைக் குறிக்கும் גָּלָה אֶת אֹזֶן
  choice: வெளிப்படுத்தியிருந்தார்
  alternative: தெரிவித்திருந்தார்
  rationale: ‘வெளிப்படுத்துதல்’ என்பது கடவுள் சாமுவேலுக்குச் செய்தியை அறியச் செய்தார் என்ற பொருளைத் தருகிறது; ஆனால் தகவல் எந்த முறையில் வழங்கப்பட்டது என்பதை மூலத்தைவிட அதிகமாக வரையறுக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிமையும் மரியாதைமிக்க வேதாகம நடையும் சமநிலைப்படுத்தப்பட்டுள்ளன. முற்கால நிகழ்வைக் காட்ட ‘வெளிப்படுத்தியிருந்தார்’ பயன்படுத்தப்பட்டுள்ளது; அடுத்த வசனத்தின் நேரடிக் கூற்றைத் திறக்க முக்காற்புள்ளி வைக்கப்பட்டுள்ளது.
