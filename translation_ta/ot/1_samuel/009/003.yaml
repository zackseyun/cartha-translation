  text: וַ/תֹּאבַ֨דְנָה֙ הָ/אֲתֹנ֔וֹת לְ/קִ֖ישׁ אֲבִ֣י שָׁא֑וּל וַ/יֹּ֨אמֶר קִ֜ישׁ אֶל שָׁא֣וּל בְּנ֗/וֹ קַח נָ֤א אִתְּ/ךָ֙ אֶת אַחַ֣ד מֵֽ/הַ/נְּעָרִ֔ים וְ/ק֣וּם לֵ֔ךְ בַּקֵּ֖שׁ אֶת הָ/אֲתֹנֹֽת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/003.yaml
  text: The donkeys belonging to Kish[a], Saul’s father, were lost. So Kish said to Saul his son, “Please take with you one of the young men, and get up, go[b], seek the donkeys.”
translation:
  language: ta
  text: சவுலின் தந்தையான கீஷுக்குச் சொந்தமான கழுதைகள்[a] காணாமல் போயின. கீஷ் தன் மகன் சவுலிடம், “தயவுசெய்து இளைஞர்களில் ஒருவனை[b] உன்னுடன் அழைத்துக்கொண்டு எழுந்து சென்று, கழுதைகளைத் தேடு” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் குறிப்பாக ‘பெண் கழுதைகள்’ என்று உள்ளது.
    reason: lexical_alternative
  - marker: b
    text: ‘இளைஞர்கள்’ என்பதற்கான எபிரெயச் சொல் சூழலின்படி ‘பணியாளர்கள்’ அல்லது ‘உதவியாளர்கள்’ என்றும் பொருள்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאבַדְנָה
  choice: காணாமற்போயின
  rationale: அவை இறந்துவிட்டதாகப் பொருள்கொள்ளாமல், கண்டுபிடிக்க முடியாதபடி தொலைந்துபோன நிலையை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: הָאֲתֹנוֹת
  choice: பெண் கழுதைகள்
  rationale: எபிரெயச் சொல் கழுதைகளின் பெண்பாலைத் தெளிவாகக் குறிக்கிறது; தமிழிலும் இதை இயல்பாகத் தக்கவைக்க முடிகிறது.
- source_word: לְקִישׁ
  choice: கீசுக்குச் சொந்தமான
  rationale: இங்குள்ள לְ உடைமை அல்லது தொடர்பைக் குறிக்கிறது; உரிமைத் தொடர்பைத் தமிழில் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: אֲבִי שָׁאוּל
  choice: சவுலின் தந்தையான
  rationale: எபிரெயக் கட்டமைப்பை இயல்பான தமிழ் உறவுத் தொடராக வழங்குகிறது.
- source_word: וַיֹּאמֶר
  choice: என்றான்
  rationale: ஆண் ஒருமை எழுவாயுடன் வரும் வழக்கமான கதைநடைப் பேச்சுவினை.
- source_word: בְּנוֹ
  choice: தன் மகன்
  rationale: கீசுக்கும் சவுலுக்கும் உள்ள தந்தை–மகன் உறவைத் தெளிவாகவும் இயல்பாகவும் காட்டுகிறது.
- source_word: קַח נָא אִתְּךָ
  choice: தயவுசெய்து … உன்னுடன் அழைத்துக்கொண்டு
  rationale: נָא கட்டளையை மென்மைப்படுத்துவதால் ‘தயவுசெய்து’ என வழங்கப்பட்டுள்ளது; ஒருவரை உடன் கூட்டிச் செல்வதைத் தமிழில் ‘அழைத்துக்கொண்டு’ என்பது இயல்பாகச் சொல்கிறது.
- source_word: אַחַד מֵהַנְּעָרִים
  choice: இளைஞர்களில் ஒருவனை
  rationale: נְעָרִים என்பதன் அடிப்படை வயதுசார் பொருளைத் தக்கவைத்து, பணிநிலையை உரையில் தேவையின்றி தீர்மானிக்காமல் விடுகிறது.
- source_word: וְקוּם לֵךְ
  choice: எழுந்து சென்று
  rationale: இரண்டு கட்டளை வினைகளையும் தெளிவான, இயல்பான நவீன தமிழில் தக்கவைக்கிறது.
- source_word: בַּקֵּשׁ
  choice: தேடு
  rationale: காணாமற்போன விலங்குகளைத் தேடும் நடைமுறைச் சூழலுக்கு நேரான, இயல்பான தமிழ் வினை.
