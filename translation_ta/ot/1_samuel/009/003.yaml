  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. எபிரெயத்தின் கதைநடை வரிசையும் கட்டளையின் மென்மையும் தக்கவைக்கப்பட்டுள்ளன; ‘எழுந்து சென்று’ என்பது மூலத்திலுள்ள இணை கட்டளைகளை சுருக்காமல் வழங்குகிறது.
