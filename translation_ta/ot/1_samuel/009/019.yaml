  to: சாமுவேல் சவுலுக்குப் பதிலளித்து, “நான்தான் காண்பவர்.[a] நீ எனக்கு முன்னால் மேட்டிலுள்ள வழிபாட்டு இடத்துக்கு மேலே செல்; இன்று நீ என்னோடு உணவருந்துவாய்.[b] காலையில் நான் உன்னை வழியனுப்புவேன்; உன் உள்ளத்தில் இருப்பதையெல்லாம் உனக்குத் தெரிவிப்பேன்” என்றார்.
  rationale: மூலத்தில் வெளிப்படையாக உள்ள ‘மேலே செல்’ என்ற கட்டளையை மீட்டெடுத்தேன். சவுலை நோக்கிய ஒருமை உரையாடல் தமிழில் தடையின்றி அமைய முதன்மை உரையில் ஒருமையை வைத்தேன்; எபிரெயப் பன்மை அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது. ‘காண்பவர்’ என்பது பழைய பதவிப்பெயரின் சொற்தன்மையை இயல்பாகக் காக்கிறது. ஆங்கில POB அடிக்குறிப்பில் இடம் மாறியுள்ளபோதிலும், தமிழில் அடிக்குறிப்புகள் தொடர்புடைய சொற்களிலேயே சரியாக நங்கூரமிடப்பட்டுள்ளன.
