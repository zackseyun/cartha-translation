base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/019.yaml
  text: Samuel answered Saul and said[a], “I am the seer. Go up before me to the high place, and eat with me today. In the morning I will send you on your way[b], and I will tell you all that is in your heart.”
translation:
  language: ta
  text: சாமுவேல் சவுலுக்குப் பதிலளித்து, “நான்தான் காண்பவர்.[a] நீ எனக்கு முன்னால் மேட்டிலுள்ள வழிபாட்டு இடத்துக்கு மேலே செல்; இன்று நீ என்னோடு உணவருந்துவாய்.[b] காலையில் நான் உன்னை வழியனுப்புவேன்; உன் உள்ளத்தில் இருப்பதையெல்லாம் உனக்குத் தெரிவிப்பேன்” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தீர்க்கதரிசி.” எபிரெயத்தில் உள்ள ‘காண்பவர்’ என்பது பழைய பதவிப்பெயர்; 1 சாமுவேல் 9:9-இல், இன்று ‘தீர்க்கதரிசி’ எனப்படுபவர் முன்பு ‘காண்பவர்’ என அழைக்கப்பட்டார் என்று விளக்கப்படுகிறது.
    reason: alternative_reading
  - marker: b
    text: எபிரெய வினைச்சொல் பன்மையில் உள்ளது; அது சவுலோடு அவனுடைய ஊழியனையும் உள்ளடக்கியிருக்கலாம்.
    reason: grammatical_number
lexical_decisions:
- source_word: הָרֹאֶה
  choice: தரிசனக்காரன்
  rationale: எபிரெயச் சொல் சொற்படியாக ‘காண்பவர்’ என்பதைக் குறிக்கிறது; 1 சாமுவேல் 9:9 விளக்கும் பழைய தீர்க்கதரிசனப் பதவிப்பெயரைத் தனித்துவமாகப் பாதுகாக்க ‘தரிசனக்காரன்’ பயன்படுத்தப்பட்டது.
- source_word: הַבָּמָה
  choice: மேடான வழிபாட்டிடம்
  rationale: במה என்பது பொதுவாக உயரமான அல்லது மேடான பகுதியில் அமைந்த வழிபாட்டிடத்தைக் குறிக்கிறது. ‘மேடான வழிபாட்டிடம்’ என்பது உயரம் மற்றும் வழிபாட்டுப் பயன்பாடு இரண்டையும் நவீனத் தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: עֲלֵה לְפָנַי
  choice: நீ எனக்கு முன்னால் ... போ
  rationale: ஒருமை ஆண்பால் கட்டளையையும், சாமுவேல் வருவதற்கு முன் சவுல் செல்ல வேண்டிய இடநிலையையும் பாதுகாக்கிறது; மேலே செல்லும் கருத்தை அடுத்துள்ள ‘மேடான’ என்பதும் சூழலும் தெரிவிக்கின்றன.
- source_word: וַאֲכַלְתֶּם עִמִּי הַיּוֹם
  choice: இன்று நீங்கள் என்னோடு உணவருந்துவீர்கள்
  rationale: வினைச்சொல் இரண்டாம் நபர் ஆண்பால் பன்மையில் உள்ளது; ஆகவே சவுலுடன் அவனுடைய வேலைக்காரனும் உட்படுவதை வெளிப்படுத்த ‘நீங்கள்’ பயன்படுத்தப்பட்டது. வடிவத்தின் எதிர்கால/உறுதியான கூற்றுத் தன்மையும் பாதுகாக்கப்பட்டது.
- source_word: וְשִׁלַּחְתִּיךָ בַבֹּקֶר
  choice: காலையில் நான் உன்னை வழியனுப்புவேன்
  rationale: ‘அனுப்புதல்’ என்ற அடிப்படைப் பொருளை, இச்சூழலில் புறப்பட அனுமதித்து அனுப்பிவைப்பது என்ற இயல்பான தமிழில் ‘வழியனுப்புவேன்’ தெரிவிக்கிறது; ‘காலையில்’ என்பது மூலத்தின் நேரக் குறிப்பை மட்டும் தருகிறது.
- source_word: וְכֹל אֲשֶׁר בִּלְבָבְךָ
  choice: உன் உள்ளத்தில் இருப்பதையெல்லாம்
  rationale: לבב எண்ணங்கள், விருப்பங்கள், நோக்கங்கள் அடங்கிய அகமனிதனைக் குறிக்க முடியும். ‘உள்ளம்’ எபிரெய உருவகத்தை இயல்பான தமிழில் பாதுகாக்கிறது.
- source_word: אַגִּיד לָךְ
  choice: உனக்குத் தெரிவிப்பேன்
  rationale: נגד என்பதன் ஹிஃபில் வடிவம் ஒன்றை அறியச் செய்வதைக் குறிக்கிறது; ‘தெரிவிப்பேன்’ உரையாடல் சூழலுக்கு இயல்பாகவும் பொருளுக்கு துல்லியமாகவும் உள்ளது.
theological_decisions:
- issue: הָרֹאֶה என்பதை ‘தீர்க்கதரிசி’ என்று பொதுமைப்படுத்துவதா, பழைய பதவிப்பெயரைப் பாதுகாப்பதா
  choice: தரிசனக்காரன்
  alternative: தீர்க்கதரிசி
  rationale: 1 சாமுவேல் 9:9 இந்தச் சொல்லை ‘தீர்க்கதரிசி’ என்பதற்குப் பயன்படுத்தப்பட்ட முந்தைய பெயராகவே விளக்குகிறது. ஆகவே கதையின் வரலாற்றுச் சொல்வேறுபாட்டை அழிக்காமல் பாதுகாக்கப்பட்டது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, மரியாதைமிக்க கதைநடை பயன்படுத்தப்பட்டது. ஒருமையான ‘நீ/உன்னை’ என்பதிலிருந்து பன்மையான ‘நீங்கள்’ என்பதற்கான மூலமொழி மாற்றம் திட்டமிட்டு வெளிப்படையாகப் பாதுகாக்கப்பட்டது. ‘தரிசனக்காரன்’ வரலாற்றுப் பதவிப்பெயராக இருப்பதால் சிறிது வேறுபட்ட சொல்நயம் ஏற்றுக்கொள்ளப்பட்டது; அதன் பொருள் அடிக்குறிப்பில் விளக்கப்படுகிறது.
