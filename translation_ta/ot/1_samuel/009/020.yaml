base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/020.yaml
  text: And as for the donkeys that were lost to you three days ago[a], do not set your heart on them, for they have been found[b]. And for whom is all the desire of Israel? Is it not for you and for all your father's house?
translation:
  language: ta
  text: மூன்று நாட்களுக்கு முன்பு காணாமற்போன உன் பெண் கழுதைகளைப் பற்றி உன் மனத்தைச் செலுத்தாதே; ஏனெனில் அவை கிடைத்துவிட்டன. இஸ்ரவேலின் விருப்பமெல்லாம் யாருக்குரியது?[a] அது உனக்கும் உன் தந்தையின் வீட்டார் அனைவருக்கும் அல்லவா?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இஸ்ரவேலில் விரும்பத்தக்க அனைத்தும் யாருக்குரியது?” எபிரெயத் தொடர், இஸ்ரவேல் விரும்புவதையோ இஸ்ரவேலில் மதிப்புமிக்கதாக இருப்பதையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “தந்தையின் வீட்டார்” என்பது எபிரெயப் பண்பாட்டில் அணுக்குடும்பத்தை மட்டும் அல்லாமல், விரிவான தந்தைவழிக் குடும்பம் அல்லது குலப்பிரிவையும் குறிக்கக்கூடிய சொற்றொடர்.
    reason: cultural_note
lexical_decisions:
- source_word: אֲתֹנוֹת
  choice: பெண் கழுதைகள்
  rationale: எபிரெயச் சொல் பெண் கழுதைகளைத் தெளிவாகக் குறிக்கிறது. நவீன தமிழிலும் இந்த விவரம் இயல்பாகச் சொல்லக்கூடியதால் அது தக்கவைக்கப்பட்டது.
- source_word: הָאֹבְדוֹת
  choice: காணாமற்போன
  rationale: விலங்குகள் தொலைந்து, அவற்றின் இருப்பிடம் தெரியாமல் இருந்த நிலையை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: הַיּוֹם שְׁלֹשֶׁת הַיָּמִים
  choice: மூன்று நாட்களுக்கு முன்பு
  rationale: சொல்லுக்குச் சொல் வடிவத்தை அல்லாமல், மூன்று நாட்களுக்கு முந்தைய காலத்தைக் குறிக்கும் எபிரெய மரபுத்தொடரின் பொருளைத் தெளிவாக வழங்குகிறது.
- source_word: אַל תָּשֶׂם אֶת־לִבְּךָ לָהֶם
  choice: அவற்றின்மேல் உன் மனத்தை வைக்காதே
  rationale: கவனம் அல்லது அக்கறையின் மையமாக ‘மனம்’ இருப்பதாகக் கூறும் எபிரெய உருவகத்தைத் தக்கவைக்கிறது; ‘கவலைப்படாதே’ என்று பொருளை மிகுதியாக விளக்கவில்லை.
- source_word: נִמְצָאוּ
  choice: அவை கண்டுபிடிக்கப்பட்டுவிட்டன
  rationale: நிபால் நிறைவுவினையின் செயப்பாட்டு மற்றும் முடிவுற்ற நிலைப் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: וּלְמִי כָּל חֶמְדַּת יִשְׂרָאֵל
  choice: இஸ்ரவேலின் விருப்பமெல்லாம் யாருக்குரியது?
  rationale: חֶמְדַּת என்பது விருப்பம், விரும்பத்தக்கது அல்லது மதிப்புக்குரியது என்ற பொருட்களை ஏற்கக்கூடும். ‘விருப்பமெல்லாம்’ என்ற சுருக்கமான வடிவம் மூலத்தின் சொல்லியல் தெளிவின்மையை ஓரளவு தக்கவைக்கிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: הֲלוֹא
  choice: அல்லவா?
  rationale: ஒப்புதலை எதிர்பார்க்கும் எபிரெய வினாவடிவத்தை இயல்பான தமிழ் வினாவாகத் தக்கவைக்கிறது.
- source_word: לְךָ וּלְכֹל בֵּית אָבִיךָ
  choice: உனக்கும் உன் தந்தையின் வீட்டார் அனைவருக்கும்
  rationale: ‘தந்தையின் வீடு’ என்ற எபிரெய சமூக-உறவுமுறைச் சொல்லாக்கத்தை ‘வீட்டார்’ மூலம் தக்கவைக்கிறது; அது அணுக்குடும்பத்தைவிட விரிவான பிரிவாக இருக்கலாம் என்பது அடிக்குறிப்பில் விளக்கப்படுகிறது.
theological_decisions:
- issue: ‘இஸ்ரவேலின் விருப்பம்’ என்ற சாமுவேலின் கூற்றின் பொருள்
  choice: சவுலையும் அவனுடைய தந்தைவழிக் குடும்பத்தையும் நோக்கிச் சுட்டும் உயர்ந்த, திட்டமிட்டுச் சுருக்கப்பட்ட வினாவாக மொழிபெயர்க்கப்பட்டது; அரசாட்சியை நேரடியாகச் சேர்க்கவில்லை.
  alternative: இஸ்ரவேல் விரும்பிய அரசாட்சியை நேரடியாகக் குறிக்கிறது; அல்லது இஸ்ரவேலில் உள்ள விரும்பத்தக்க அனைத்தும் சவுலின் குடும்பத்துக்குரியது என்று பொருள்.
  rationale: உடனடிச் சூழல் சவுலின் வரவிருக்கும் நியமனத்தைச் சுட்டினாலும், இந்த வசனம் ‘அரசாட்சி’ என்று வெளிப்படையாகக் கூறவில்லை. ஆகவே மொழிபெயர்ப்பு அந்த இறையியல் மற்றும் சொல்லியல் அழுத்தத்தைத் தீர்த்துவிடாமல் தக்கவைக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையுடன் மொழிபெயர்க்கப்பட்டது. ‘மனத்தை வைக்காதே’ மற்றும் ‘தந்தையின் வீட்டார்’ போன்ற மூல உருவகங்களும் பண்பாட்டு சொல்லாக்கங்களும் தேவையான விளக்கங்களுடன் தக்கவைக்கப்பட்டுள்ளன.
