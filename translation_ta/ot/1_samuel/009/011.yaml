source:
  edition: WLC
  text: הֵ֗מָּה עֹלִים֙ בְּ/מַעֲלֵ֣ה הָ/עִ֔יר וְ/הֵ֨מָּה֙ מָצְא֣וּ נְעָר֔וֹת יֹצְא֖וֹת לִ/שְׁאֹ֣ב מָ֑יִם וַ/יֹּאמְר֣וּ לָ/הֶ֔ן הֲ/יֵ֥שׁ בָּ/זֶ֖ה הָ/רֹאֶֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/011.yaml
  text: As they were going up the ascent to the city[a], they found young women coming out to draw water, and they said to them, “Is the seer here?”
translation:
  language: ta
  text: அவர்கள் நகரத்துக்குச் செல்லும் ஏற்றப்பாதையில் ஏறிக்கொண்டிருந்தபோது, தண்ணீர் எடுக்க வெளியே வந்துகொண்டிருந்த இளம் பெண்களைச் சந்தித்து, அவர்களிடம், “தரிசனக்காரர்[a] இங்கே இருக்கிறாரா?” என்று கேட்டார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘தீர்க்கதரிசி.’ எபிரெய மொழியில் இங்கே குறிப்பாக ‘தரிசனக்காரர்’ என்று உள்ளது; பிற்காலத்தில் ‘தீர்க்கதரிசி’ என்று அழைக்கப்பட்டவருக்குப் பயன்படுத்தப்பட்ட பழைய பெயர் இது.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֹלִים
  choice: ஏறிக்கொண்டிருந்தபோது
  rationale: சுட்டுப்பெயருடன் வரும் எபிரெயப் பங்கேற்புவினை, கதையின் சூழலில் தொடர்ந்து நடந்துகொண்டிருந்த செயலைக் குறிக்கிறது; இத்தமிழாக்கம் அந்த முன்னேற்றச் செயலை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: בְּמַעֲלֵה הָעִיר
  choice: நகரத்துக்குச் செல்லும் ஏற்றப்பாதையில்
  rationale: מַעֲלֶה என்பது மேலே செல்லும் ஏற்றத்தையோ ஏற்றப்பாதையையோ குறிக்கிறது; நகரத்தை நோக்கிய நிலவியல் ஏற்றத்தைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: מָצְאוּ
  choice: சந்தித்து
  rationale: அடிப்படைப் பொருள் ‘கண்டார்கள்’ என்றாலும், வழியில் மனிதர்களை எதிர்கொண்ட இச்சூழலில் ‘சந்தித்து’ என்பது இயல்பான நவீனத் தமிழ்; மூலத்தின் நிகழ்வை மாற்றுவதில்லை.
- source_word: נְעָרוֹת
  choice: இளம் பெண்கள்
  rationale: பெண் இளையோரைச் சுட்டும் சொல்லை, மிகவும் குறைந்த வயதைக் குறிப்பதாகத் தோன்றும் சொல்லையும் பழமையான நடையையும் தவிர்த்து இயல்பாக வழங்குகிறது.
- source_word: יֹצְאוֹת לִשְׁאֹב מָיִם
  choice: தண்ணீர் எடுக்க வெளியே வந்துகொண்டிருந்த
  rationale: பங்கேற்புவினையும் நோக்கத்தைக் குறிக்கும் வினையெச்சமும் இணைந்து, தண்ணீர் எடுப்பதற்காக அவர்கள் வெளியே வந்துகொண்டிருந்த செயலைக் காட்டுகின்றன.
- source_word: הֲיֵשׁ בָּזֶה
  choice: இங்கே இருக்கிறாரா?
  rationale: குறிப்பிட்ட இடத்தில் ஒருவர் இருக்கிறாரா என்று கேட்கும் எபிரெய மரபுத்தொடருக்கான சுருக்கமான, இயல்பான தமிழாக்கம்.
- source_word: הָרֹאֶה
  choice: தரிசனக்காரர்
  rationale: ‘காண்பவர்/தரிசிப்பவர்’ என்ற குறிப்பிட்ட பழைய பதவிப்பெயரைப் பாதுகாக்கிறது; பொதுவான ‘தீர்க்கதரிசி’ என்று மாற்றாமல், அடுத்த வசனத்தின் வரலாற்றுச் சொல்லியல் விளக்கத்திற்கும் இடமளிக்கிறது.
theological_decisions:
- issue: הָרֹאֶה என்ற பதவிப்பெயரின் மொழிபெயர்ப்பு
  choice: முதன்மை உரையில் ‘தரிசனக்காரர்’ என்று வைத்தல்
  alternative: ‘தீர்க்கதரிசி’ என்று மொழிபெயர்த்தல்
  rationale: மூலம் இங்கு குறிப்பாக ‘காண்பவர்/தரிசிப்பவர்’ என்ற பழைய பெயரைப் பயன்படுத்துகிறது. அதை ‘தீர்க்கதரிசி’ என்று அமைதியாக ஒரே பொருளாக்குவது வரலாற்றுச் சொல்லியல் வேறுபாட்டை மறைக்கும்; அடிக்குறிப்பு தொடர்பை விளக்குகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘ஏற்றப்பாதை’ நிலவியல் குறிப்பைப் பாதுகாக்கிறது; ‘தரிசனக்காரர்’ மூலத்தின் பழைய தொழிற்பெயரைத் தக்கவைக்கிறது. அடிக்குறிப்பு குறியீடு முதன்மை உரையில் இணைக்கப்பட்டுள்ளது.
