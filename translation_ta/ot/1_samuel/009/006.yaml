reference: 1 Samuel 9:6
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר ל֗/וֹ הִנֵּה נָ֤א אִישׁ אֱלֹהִים֙ בָּ/עִ֣יר הַ/זֹּ֔את וְ/הָ/אִ֣ישׁ נִכְבָּ֔ד כֹּ֥ל אֲשֶׁר יְדַבֵּ֖ר בּ֣וֹא יָב֑וֹא עַתָּה֙ נֵ֣לֲכָה שָּׁ֔ם אוּלַי֙ יַגִּ֣יד לָ֔/נוּ אֶת דַּרְכֵּ֖/נוּ אֲשֶׁר הָלַ֥כְנוּ עָלֶֽי/הָ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/006.yaml
  text: He said to him, “Look now, there is a man of God in this city, and the man is held in honor; everything that he says surely comes to pass. Now let us go there. Perhaps he will tell us the way we should go.”
translation:
  language: ta
  text: அவன் சவுலிடம், “இதோ, இந்த நகரத்தில் கடவுளின் மனிதர் ஒருவர் இருக்கிறார். அவர் மிகவும் மதிக்கப்படுகிறவர்; அவர் சொல்வதெல்லாம் தவறாமல் நிறைவேறும். இப்போது நாம் அங்கே போவோம். நாம் செல்லவேண்டிய வழியை ஒருவேளை அவர் நமக்குச் சொல்வார்” என்றான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִישׁ אֱלֹהִים
  choice: கடவுளின் மனிதர்
  rationale: தீர்க்கதரிசி அல்லது இறைத்தூதர் என்று விளக்கமாக மாற்றாமல், எபிரேயச் சொல்லாட்சியின் மரியாதைமிக்க பதவிப்பெயரை நேரடியாகப் பாதுகாக்கிறது.
- source_word: נִכְבָּד
  choice: மிகவும் மதிக்கப்படுகிறவர்
  rationale: அந்த மனிதர் சமூகத்தில் பெருமதிப்பைப் பெற்றவர் என்ற பொருளை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: בּוֹא יָבוֹא
  choice: தவறாமல் நிறைவேறும்
  rationale: எபிரேய வினைச்சொல் வலியுறுத்தும் உறுதியைத் தமிழில் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: אֶת דַּרְכֵּנוּ אֲשֶׁר הָלַכְנוּ עָלֶיהָ
  choice: நாம் செல்லவேண்டிய வழி
  rationale: சொல்லுக்கு சொல் வடிவில் ‘நாம் சென்றிருக்கிற வழி’ என வந்தாலும், சூழலில் அவர்கள் இனி மேற்கொள்ள வேண்டிய பயணம் அல்லது நடவடிக்கையை அறிதலே கருத்து; WLC-இன் வெளிப்பாட்டை இயல்பான இலக்கு நோக்கிய தமிழில் வழங்குகிறது.
theological_decisions:
- issue: ‘கடவுளின் மனிதர்’ என்பவரின் அடையாளம்
  choice: கடவுளின் மனிதர்
  alternative: தீர்க்கதரிசி
  rationale: மூல உரை இங்கு אִישׁ אֱלֹהִים என்று கூறுவதால், பின்னைய விளக்கப் பதவிப்பெயரை உட்புகுத்தாமல் அதன் தனித்துவமான வேதாகமச் சொல்லாட்சியைப் பாதுகாக்கிறது.
- issue: அவர் சொல்வதன் நிறைவேற்ற உறுதி
  choice: அவர் சொல்வதெல்லாம் தவறாமல் நிறைவேறும்
  alternative: அவர் சொல்வதெல்லாம் நடக்கும்
  rationale: இரட்டிக்கப்பட்ட எபிரேய வினையின் வலியுறுத்தலைக் காக்கிறது; அதேவேளை இது மனிதரின் தனிப்பட்ட சக்தி என்று கூடுதல் கோட்பாட்டை உரையில் சேர்ப்பதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழ்; உரையாடலுக்கு இயல்பானதாயும், வேதாகமச் சூழலுக்கேற்ற கண்ணியத்துடனும் வடிவமைக்கப்பட்டது. பெயரெச்சத் தொடர்களில் தேவையற்ற பழமையான நடை தவிர்க்கப்பட்டது.
