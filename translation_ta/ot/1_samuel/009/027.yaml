base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/027.yaml
  text: As they were going down to the edge of the city[a], Samuel said to Saul, “Tell the young man to go on ahead of us.” And he went on ahead. “But you, stand here now[b], and I will let you hear the word of God.”
translation:
  language: ta
  text: அவர்கள் நகரத்தின் எல்லைப்பகுதிக்கு இறங்கிக்கொண்டிருந்தபோது, சாமுவேல் சவுலிடம், “அந்த இளைஞனை[a] நமக்கு முன்னால் செல்லச் சொல்” என்றார். அவனும் முன்னால் சென்றான். பின்பு சாமுவேல், “நீயோ இப்போது அங்கேயே நில்[b]; கடவுளின் வார்த்தையை நான் உனக்குக் கேட்கச் செய்வேன்” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “பணியாளனை” அல்லது “உதவியாளனை” என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் נַעַר ஓர் இளைஞனையோ, உதவியாளனையோ, பணியாளனையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில், “இப்போது/இந்நேரத்தில் நில்” என்று உள்ளது. தற்போதைக்கு நின்று அங்கேயே இருக்க வேண்டும் என்பது இச்சொற்றொடரின் பொருள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֹרְדִים
  choice: இறங்கிக்கொண்டிருந்தபோது
  rationale: எபிரெயப் பங்கேற்புவினை தொடர்ந்துகொண்டிருந்த செயலைக் குறிக்கிறது; கதைநடையில் இயல்பாக அதைப் பாதுகாக்கிறது.
- source_word: בִּקְצֵה הָעִיר
  choice: நகரத்தின் எல்லையை நோக்கி
  rationale: קָצֶה என்பது ஓரம் அல்லது எல்லைப்பகுதியைக் குறிக்கிறது; இயக்கத்தைக் காட்டும் சூழலில் இத்தேர்வு இயல்பானது.
- source_word: לַנַּעַר
  choice: அந்த இளைஞனை
  rationale: נַעַר என்பதற்கு இளைஞன், உதவியாளர், பணியாள் ஆகிய பொருள்கள் இருக்கலாம். அடிப்படைச் சொல்லின் பரந்த பொருளைப் பாதுகாத்து, சூழலுக்குரிய மாற்றுப் பொருளை அடிக்குறிப்பு தருகிறது.
- source_word: וְיַעֲבֹר לְפָנֵינוּ
  choice: நமக்கு முன்னால் போக
  rationale: עבר உடன் לִפְנֵי வருவது ஒருவருக்கு முன்னே செல்வதைக் குறிக்கிறது; நவீன தமிழில் இது இயல்பான வடிவம்.
- source_word: וַיַּעֲבֹר
  choice: அவனும் முன்னால் சென்றான்
  rationale: இளைஞன் கட்டளைக்குக் கீழ்ப்படிந்து முன்னே சென்றதைத் தெளிவாகவும் தொடர்ச்சியாகவும் தெரிவிக்கிறது.
- source_word: עֲמֹד כַּיּוֹם
  choice: இப்போது அங்கேயே நில்
  rationale: சொற்றொடர் சொற்சொல்லாக கடினமானது; இச்சூழலில் தற்போதைக்கு நின்று அங்கேயே இருக்கும்படி கூறும் இடைநிறுத்தக் கட்டளையாக உள்ளது.
- source_word: וְאַשְׁמִיעֲךָ
  choice: நான் உனக்குக் கேட்கச் செய்வேன்
  rationale: שׁמע என்பதன் ஹிஃபில் வடிவிலுள்ள காரணவினைத் தன்மையை மொழிபெயர்ப்பு பாதுகாக்கிறது; ‘அறிவிப்பேன்’ என்று மட்டும் கூறுவதைவிட மூலத்திற்கு நெருக்கமானது.
- source_word: דְּבַר אֱלֹהִים
  choice: கடவுளின் வார்த்தை
  rationale: தீர்க்கதரிசன வெளிப்பாட்டின் வலிமையைப் பாதுகாக்கும் வெளிப்படையான மரபான மொழிபெயர்ப்பு; ‘செய்தி’ என்பதும் சாத்தியம் என்றாலும் அது מעט விளக்கமானது.
- source_word: אֱלֹהִים
  choice: கடவுள்
  rationale: இங்கு இஸ்ரவேலின் கடவுளைக் குறிக்கும் ஒருமைப் பயன்பாடு; நவீன நிலையான தமிழில் பொதுவான தேர்வு.
theological_decisions:
- issue: דְּבַר אֱלֹהִים என்ற வெளிப்பாட்டு மொழிநடையின் மொழிபெயர்ப்பு
  choice: கடவுளின் வார்த்தை
  alternative: கடவுளின் செய்தி
  rationale: சாமுவேல் சவுலுக்கு வெளிப்படுத்தவிருக்கும் இறை வெளிப்பாட்டின் தீர்க்கதரிசனச் செறிவை மிகைப்படுத்தாமலும் குறைக்காமலும் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்கு புரியும் dignified கதைநடை பயன்படுத்தப்பட்டுள்ளது. நேரடிப் பேச்சின் ஓட்டத்திற்காக இரண்டாவது உரையின் பேச்சாளராக சாமுவேல் மீண்டும் குறிப்பிடப்பட்டுள்ளார்; இது பொருளை மாற்றாத தெளிவாக்கம். காரணவினையான וְאַשְׁמִיעֲךָ மூலத்துக்கு நெருக்கமாகப் பாதுகாக்கப்பட்டுள்ளது.
