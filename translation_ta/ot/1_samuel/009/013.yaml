  source_fidelity: மூல எபிரெயத்தின் காலவரிசை, பன்மை முகவரி, பலி உணவின் ஒழுங்கு ஆகியவை வரைவில் பெரும்பாலும் துல்லியமாக உள்ளன. ஆனால் כְהַיּוֹם என்பதற்கான முதன்மை மொழிபெயர்ப்பாக ‘இந்த நேரத்தில்’ என்பது ‘இன்று’ என்ற நேரடியான வாசிப்பைத் தேவையின்றி ஒதுக்குகிறது. முதன்மை உரையில் ‘இன்றே’ என வைத்து, மாற்று வாசிப்பை அடிக்குறிப்பில் வழங்குவது மூலத்தின் சாத்தியமான இருபொருளையும் சிறப்பாகப் பேணும்.
  naturalness: நடை நவீன பொதுத் தமிழுக்கு ஏற்றதாக உள்ளது. ‘பலியின்மேல் ஆசி கூறுபவர்’ என்பதற்குப் பதிலாக ‘பலிக்கு ஆசீர்வாதம் கூறுபவர்’ என்பது தமிழ் இணைப்பிலும் சடங்குசார் சூழலிலும் இயல்பாக ஒலிக்கிறது. ‘மேட்டிலுள்ள வழிபாட்டு இடம்’ புரியக்கூடியது; அதற்கான சுருக்கமான பண்பாட்டு அடிக்குறிப்பு உதவும்.
  terminology: במה-க்கு ‘மேட்டிலுள்ள வழிபாட்டு இடம்’ என்பது ‘ஆலயம்’ போன்ற மிகக் குறுகிய பொருளைச் சுமத்தாமல் பாதுகாப்பானது. זבח-க்கு ‘பலி’, ברך-க்கு ‘ஆசீர்வாதம் கூறுதல்’ என்பன பொருத்தமானவை. அழைக்கப்பட்டவர்களைக் ‘அழைக்கப்பட்டவர்கள்’ என மொழிபெயர்ப்பது passive participle-ஐப் பேணுகிறது.
