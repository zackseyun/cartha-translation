  text: כְּ/בֹאֲ/כֶ֣ם הָ/עִ֣יר כֵּ֣ן תִּמְצְא֣וּ/ן אֹת֡/וֹ בְּ/טֶרֶם֩ יַעֲלֶ֨ה הַ/בָּמָ֜תָ/ה לֶ/אֱכֹ֗ל כִּ֠י לֹֽא יֹאכַ֤ל הָ/עָם֙ עַד בֹּא֔/וֹ כִּֽי הוּא֙ יְבָרֵ֣ךְ הַ/זֶּ֔בַח אַחֲרֵי כֵ֖ן יֹאכְל֣וּ הַ/קְּרֻאִ֑ים וְ/עַתָּ֣ה עֲל֔וּ כִּֽי אֹת֥/וֹ כְ/הַ/יּ֖וֹם תִּמְצְא֥וּ/ן אֹתֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/013.yaml
  text: As soon as you enter the city[a], you will find him, before he goes up to the high place to eat. For the people will not eat until he comes, because he is the one who blesses the sacrifice; afterward those who are invited eat. So go up now[c][b], for today you will find him.
translation:
  language: ta
  text: நீங்கள் நகருக்குள் நுழைந்தவுடன் அவரைக் காண்பீர்கள். அவர் உணவு உண்ண மேட்டிலுள்ள வழிபாட்டு இடத்துக்கு[b] மேலே போவதற்கு முன்பே அவரைக் காண்பீர்கள். ஏனெனில் அவர் வரும்வரை மக்கள் உணவு உண்ணமாட்டார்கள்; பலிக்கு[c] ஆசீர்வாதம் கூறுபவர் அவரே. அதன்பின் அழைக்கப்பட்டவர்கள் உண்பார்கள். ஆகவே இப்போதே மேலே செல்லுங்கள்; இன்றே[a] நீங்கள் அவரைக் காண்பீர்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘இன்றே’ என்பதற்குப் பதிலாக ‘இந்த நேரத்தில்’ என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொற்றொடர் (כְהַיּוֹם) நாளைக் குறிப்பதோடு, உடனடித் தன்மையையும் வலியுறுத்தக்கூடும்.
    reason: lexical_alternative
  - marker: b
    text: ‘மேட்டிலுள்ள வழிபாட்டு இடம்’ என்பது பலிகள் செலுத்தப்பட்டு பலியுணவுகள் நடத்தப்பட்ட உயரமான வழிபாட்டுத் தலத்தைக் குறிக்கிறது.
    reason: cultural_note
  - marker: c
    text: ‘பலிக்கு ஆசீர்வாதம் கூறுதல்’ என்பது அழைக்கப்பட்டவர்கள் உண்பதற்கு முன் பலியுணவோடு தொடர்புடைய ஆசீர்வாதத்தை உரைப்பதைக் குறிக்கலாம்.
    reason: cultural_note
lexical_decisions:
- source_word: כְּבֹאֲכֶם הָעִיר
  choice: நீங்கள் நகருக்குள் நுழைந்தவுடன்
  rationale: כ + infinitive construct இங்குத் தற்காலத் தொடர்பைக் குறிக்கிறது; சூழலின் உடனடித் தன்மையை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: כֵּן תִּמְצְאוּן אֹתוֹ
  choice: அவரைக் காண்பீர்கள்
  rationale: כֵּן உறுதியையும் உடனடி விளைவையும் வலியுறுத்துகிறது; தமிழில் முன்னுள்ள ‘நுழைந்தவுடன்’ என்பதே தொடரைத் தெளிவாக்குவதால் தனியே ‘அப்போது’ சேர்க்கத் தேவையில்லை.
- source_word: בְּטֶרֶם יַעֲלֶה
  choice: அவர் ... போவதற்கு முன்பே
  rationale: בְּטֶרֶם குறிக்கும் முந்திய நேர உறவைத் தெளிவாகத் தருகிறது; ‘முன்பே’ உடனடித் தன்மையையும் பேணுகிறது.
- source_word: הַבָּמָתָה
  choice: மேட்டிலுள்ள வழிபாட்டு இடத்துக்கு
  rationale: במה என்பது பொதுவாக உயரமான இடத்திலிருந்த பலி மற்றும் வழிபாட்டுத் தலத்தைக் குறிக்கிறது. வெறும் ‘மேடான இடம்’ என்பதைக் காட்டிலும் இச்சூழலில் பொருள் தெளிவாகும்; ‘ஆலயம்’ என்று மிகக் குறுகலாக்கவில்லை.
- source_word: לֶאֱכֹל
  choice: உணவு உண்ண
  rationale: எபிரெய வினையின் எளிமையைப் பேணும் நேரடியான, இயல்பான தமிழ்.
- source_word: לֹא יֹאכַל הָעָם עַד בֹּאוֹ
  choice: அவர் வரும்வரை மக்கள் உணவு உண்ணமாட்டார்கள்
  rationale: சூழலில் imperfect எதிர்கால நிகழ்வைக் குறிக்கிறது; עַד + infinitive construct தமிழில் இயல்பான காலவரம்புச் சொற்றொடராக மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: כִּי הוּא יְבָרֵךְ הַזֶּבַח
  choice: பலியின்மேல் ஆசி கூறுபவர் அவரே
  rationale: הוּא தரும் வலியுறுத்தலை ‘அவரே’ பேணுகிறது. ברך இங்கு பலியுணவுக்கு முன் ஆசி உரைப்பதைக் குறித்தாலும், முதன்மை உரை ‘பலியின்மேல் ஆசி கூறுதல்’ என்ற திறந்த வடிவத்தையே வைத்திருக்கிறது.
- source_word: הַקְּרֻאִים
  choice: அழைக்கப்பட்டவர்கள்
  rationale: קרא என்பதன் passive participle-ஐ நேரடியாகப் பேணுகிறது; ‘விருந்தினர்கள்’ என்ற சூழல்சார் விளக்கத்தைத் தேவையின்றிச் சேர்க்கவில்லை.
- source_word: וְעַתָּה עֲלוּ
  choice: ஆகவே இப்போதே மேலே செல்லுங்கள்
  rationale: இணைப்பின் முடிவுரைப் பொருளையும், עלה என்பதிலுள்ள மேல்நோக்கிய நகர்வையும் பேணுகிறது.
- source_word: כְהַיּוֹם
  choice: இந்த நேரத்தில்
  rationale: இந்த அரிதான சொற்றொடர் நாள்காட்டி சார்ந்த ‘இன்று’ என்பதையோ ‘இப்போதே/இந்த நேரத்தில்’ என்ற உடனடித் தன்மையையோ உணர்த்தலாம்; சூழலுக்கு ஏற்ற இரண்டாவது பொருள் முதன்மை உரையில் தேர்ந்தெடுக்கப்பட்டது.
theological_decisions:
- issue: יְבָרֵךְ הַזֶּבַח என்பதன் சடங்குசார் துல்லியம்
  choice: பலியின்மேல் ஆசி கூறுபவர்
  alternative: பலியுணவுக்கு முன் ஆசி கூறுபவர்
  rationale: உணவோடு தொடர்புடைய சடங்கு என்பது சூழலில் தெளிவாக இருந்தாலும், எபிரெய உரை நேரடியாக ‘பலியை ஆசீர்வதித்தல்’ என்றே கூறுகிறது; ஆகவே விளக்கத்தை உரைக்குள் முழுமையாகச் சேர்க்காமல் மூலத்தின் இறுக்கத்தைப் பேணுகிறது.
translation_notes:
  register: நவீன பொதுத் தமிழில் மரியாதையும் கதைநடைத் தெளிவும் பேணப்பட்டுள்ளன. ‘மேட்டிலுள்ள வழிபாட்டு இடம்’ என்பது பழங்கால במה-வின் உயரமான, பலி செலுத்தப்பட்ட வழிபாட்டுத் தலப் பொருளை சாதாரண வாசகருக்குத் தெளிவாக்குகிறது. பன்மை கட்டளை ‘செல்லுங்கள்’ மற்றும் பன்மை முகவரி முழுவதும் ஒருமையாகப் பேணப்பட்டுள்ளன.
