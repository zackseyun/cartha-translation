  revised_text: நீங்கள் நகருக்குள் நுழைந்தவுடன் அவரைக் காண்பீர்கள். அவர் உணவு உண்ண மேட்டிலுள்ள வழிபாட்டு இடத்துக்கு[b] மேலே போவதற்கு முன்பே அவரைக் காண்பீர்கள். ஏனெனில் அவர் வரும்வரை மக்கள் உணவு உண்ணமாட்டார்கள்; பலிக்கு[c] ஆசீர்வாதம் கூறுபவர் அவரே. அதன்பின் அழைக்கப்பட்டவர்கள் உண்பார்கள். ஆகவே இப்போதே மேலே செல்லுங்கள்; இன்றே[a] நீங்கள் அவரைக் காண்பீர்கள்.
