translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘மேடான வழிபாட்டிடம்’ வழிபாட்டுச் சூழலைக் காக்கிறது; ‘மொட்டைமாடி’ பண்டைய தட்டையான வீட்டுக்கூரையை இயல்பாகக் குறிக்கிறது. எபிரெயத்தில் பெயர் மீண்டும் சொல்லப்படாததால், பேசுபவரை ‘சாமுவேல்’ என்று வெளிப்படையாகச் சேர்க்காமல் ‘அவர்’ என வைத்துள்ளது.
