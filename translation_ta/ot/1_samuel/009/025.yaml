  yaml_path: translation/ot/1_samuel/009/025.yaml
  text: When they came down from the high place into the city[a], he spoke with Saul on the roof.
translation:
  language: ta
  text: அவர்கள் மேட்டிலிருந்த வழிபாட்டிடத்திலிருந்து நகரத்துக்குள் இறங்கி வந்தபோது[a], அவர் சவுலுடன் வீட்டுக் கூரையின்மேல் பேசினார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அவர்கள் மேட்டிலிருந்த வழிபாட்டிடத்திலிருந்து நகரத்துக்குள் இறங்கி வந்தார்கள்; அவர் சவுலுடன் வீட்டுக் கூரையின்மேல் பேசினார்” என்றும் மொழிபெயர்க்கலாம்.
    reason: எபிரெய வாக்கியத்தின் தொடர்ச்சியான நிகழ்வுகளைத் தனித்தனி வாக்கியங்களாகக் காட்டும் மாற்று அமைப்பு.
lexical_decisions:
- source_word: וַיֵּרְדוּ
  choice: அவர்கள் … இறங்கி வந்தபோது
  rationale: தொடர்ந்து வரும் ஒருமை வினையுடன் நிகழ்வுகளின் காலத் தொடர்பை இயல்பான தமிழில் காட்டுகிறது; அதேவேளையில் ירד குறிக்கும் இறங்குதலைப் பாதுகாக்கிறது.
- source_word: מֵהַבָּמָה
  choice: மேடான வழிபாட்டிடத்திலிருந்து
  rationale: בָּמָה என்பது பொதுவாக உயரமான இடத்திலிருந்த பலியிட அல்லது வழிபாட்டிடத்தைக் குறிக்கிறது. வெறும் ‘மேடு’ என்று கூறாமல் அதன் வழிபாட்டுச் சூழலைத் தெளிவாக்குகிறது.
- source_word: הָעִיר
  choice: நகரத்துக்குள்
  rationale: இயக்க வினையுடன் வரும் திசைசார் பயன்பாட்டை இயல்பான தமிழில் வெளிப்படுத்தி, உயரமான வழிபாட்டிடத்திலிருந்து நகருக்குள் சென்றதைச் சுட்டுகிறது.
- source_word: וַיְדַבֵּר
  choice: அவர் … பேசினார்
  rationale: எபிரெய வினை ஒருமைக்கு மாறுவதைப் பாதுகாக்கிறது. சூழலுக்கு அப்பாற்பட்ட உரையாடல் உள்ளடக்கம் எதையும் சேர்க்கவில்லை.
- source_word: עִם שָׁאוּל
  choice: சவுலுடன்
  rationale: עִם என்பதன் அடிப்படைப் பொருளான ‘உடன்’ என்பதைப் பாதுகாத்து, ஒருதலைப்பட்சமாக உரையாற்றினார் என்பதற்குப் பதிலாக உரையாடலுக்கான வாய்ப்பைத் திறந்துவைக்கிறது.
- source_word: עַל הַגָּג
  choice: மொட்டைமாடியில்
  rationale: גָּג குறிக்கும் வீட்டின் தட்டையான கூரைப்பகுதியை இன்றைய தமிழில் தெளிவாகவும் இயல்பாகவும் குறிக்கிறது.
