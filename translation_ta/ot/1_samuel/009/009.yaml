base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/009.yaml
  text: Formerly in Israel[a], when a man went to inquire of God, he would say, “Come, and let us go to the seer,” for the prophet of today was formerly called the seer.
translation:
  language: ta
  text: முன்பு இஸ்ரவேலில்[a], ஒரு மனிதன் கடவுளிடம் விசாரிக்கச் செல்லும்போது, “வாருங்கள், நாம் தரிசகரிடம் போவோம்” என்று சொல்வான். ஏனெனில், இன்று ‘இறைவாக்கினர்’ என்று அழைக்கப்படுபவர் முன்பு ‘தரிசகர்’ என்று அழைக்கப்பட்டார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “முந்தைய காலங்களில் இஸ்ரவேலில், ஒரு மனிதன் கடவுளைத் தேடிச் செல்லும்போது, ‘வாருங்கள், நாம் தரிசகரிடம் போவோம்’ என்று சொல்வான்.”
    reason: לְפָנִים என்பதை ‘முந்தைய காலங்களில்’ என்றும், לִדְרֹשׁ אֱלֹהִים என்பதை இன்னும் நேரடியாக ‘கடவுளைத் தேட’ என்றும் மொழிபெயர்க்கக்கூடிய சொற்பொருள் மாற்று.
lexical_decisions:
- source_word: לְפָנִים
  choice: முன்னாளில்
  rationale: கடந்த கால வழக்கைக் குறிக்கும் temporal adverb; வசனத்தின் இரு இடங்களிலும் ஒரே சொல்லைப் பயன்படுத்தி ‘இன்று’ என்பதுடனான வேறுபாடு காக்கப்படுகிறது.
- source_word: בְּיִשְׂרָאֵל
  choice: இஸ்ரவேலில்
  rationale: அந்த வழக்கம் நிலவிய இடத்தைக் குறிக்கும் நேரடியான இடவுருபுத் தொடர்.
- source_word: כֹּה אָמַר
  choice: என்று சொல்வான்
  rationale: கடந்த காலத்தில் வழக்கமாக நிகழ்ந்த செயலை எபிரெயச் சூழல் குறிக்கிறது; தமிழில் இயல்பான வழக்கநிலை வினையாக மொழிபெயர்க்கப்பட்டது.
- source_word: הָאִישׁ
  choice: ஒரு மனிதன்
  rationale: குறிப்பிட்ட நபரை அல்லாமல் பொதுவகையாக ஒரு ஆணைக் குறிக்கும் எபிரெய ஆண்பால் ஒருமை வடிவம் காக்கப்படுகிறது.
- source_word: בְּלֶכְתּוֹ
  choice: செல்லும்போது
  rationale: சுட்டுப்பெயர் பின்னொட்டுடன் உள்ள infinitive construct காலச்சூழலைக் குறிக்கிறது; தமிழில் இயல்பான கால எச்சமாக வழங்கப்பட்டது.
- source_word: לִדְרֹשׁ אֱלֹהִים
  choice: கடவுளிடம் விசாரிக்க
  rationale: இச்சூழலில் இறை வழிகாட்டுதலை நாடி விசாரிப்பதே பொருள்; பொதுவான ‘தேட’ என்பதைவிட ஆலோசனை நாடும் நுண்பொருளை இது தெளிவாகக் காட்டுகிறது.
- source_word: לְכוּ וְנֵלְכָה
  choice: வாருங்கள், நாம் … போவோம்
  rationale: பன்மை ஏவலும் cohortative வடிவமும் தனித்தனியாகக் காக்கப்பட்டுள்ளன.
- source_word: עַד הָרֹאֶה
  choice: தரிசகரிடம்
  rationale: עַד இங்கு ஒருவரை நோக்கிய இயக்கத்தைக் குறிக்கிறது. רֹאֶה என்பது ‘காண்பவர்’ என்ற அடிப்படையிலிருந்து வந்த பழைய தீர்க்கதரிசனப் பட்டம்; ‘தரிசகர்’ அதன் பட்டப்பெயர் நுண்பொருளைக் காக்கிறது.
- source_word: לַנָּבִיא
  choice: இறைவாக்கினர்
  rationale: נָבִיא என்பதற்கான பொருளை, எதிர்காலம் கூறுபவர் என்ற அளவுக்குச் சுருக்காமல், கடவுளின் செய்தியை உரைப்பவர் என்ற பரந்த பொருளில் தருகிறது.
- source_word: הַיּוֹם
  choice: இன்று
  rationale: கதைசொல்லியின் காலத்தில் பயன்பட்ட பெயரையும் முன்னைய பெயரையும் நேரடியாக எதிர்நிறுத்துகிறது.
- source_word: יִקָּרֵא
  choice: அழைக்கப்படுபவர் … அழைக்கப்பட்டார்
  rationale: எபிரெய passive வடிவமும், தற்போதைய பெயர் மற்றும் முன்னைய பெயருக்கிடையேயான கால வேறுபாடும் தமிழில் தெளிவாக வெளிப்படுத்தப்படுகின்றன.
- source_word: הָרֹאֶה
  choice: தரிசகர்
  rationale: רֹאֶה என்ற பழைய தொழில்நுட்பப் பட்டத்தைக் குறிக்கும் சுருக்கமான, மரியாதையான தமிழ்ச் சொல்.
theological_decisions:
- issue: הָאִישׁ என்ற பொதுப்பொருள் ஆண்பால் ஒருமையை மொழிபெயர்த்தல்
  choice: ஒரு மனிதன்
  alternative: ஒருவர்
  rationale: மூலத்தின் ஆண்பால் ஒருமை பொதுப்பயன்பாட்டை மறைக்காமல், தமிழில் புரியக்கூடிய வகையில் காக்கிறது.
- issue: דָּרַשׁ אֱלֹהִים என்பதன் தீர்க்கதரிசனச் சூழல்
  choice: கடவுளிடம் விசாரிக்க
  alternative: கடவுளைத் தேட
  rationale: தரிசகர் வழியாக இறை வழிகாட்டுதலை நாடும் சூழலை இது வெளிப்படுத்துகிறது; அதேவேளை விசாரிப்பு எவ்வாறு நடந்தது என்பது பற்றி கூடுதல் கோட்பாட்டைச் சேர்ப்பதில்லை.
- issue: נָבִיא மற்றும் רֹאֶה ஆகிய பட்டங்களின் வேறுபாடு
  choice: இறைவாக்கினர் / தரிசகர்
  alternative: தீர்க்கதரிசி / காண்பவர்
  rationale: கதைசொல்லி விளக்கும் பழைய மற்றும் பிந்தைய பட்டங்களின் வேறுபாட்டைக் காக்கிறது; נָבִיא என்பதை எதிர்கால முன்னறிவிப்புக்கு மட்டும் கட்டுப்படுத்துவதையும், רֹאֶה என்பதை சாதாரண பார்வையாளராகத் தவறாகப் புரிவதையும் தவிர்க்கிறது.
translation_notes:
  register: நவீன தரத்தமிழில், பொதுவாசகர்களுக்குப் புரியும் மரியாதையான நடை பயன்படுத்தப்பட்டுள்ளது. பழைய மற்றும் தற்போதைய தீர்க்கதரிசனப் பட்டங்களைத் தெளிவுபடுத்த மேற்கோள் குறிகள் பயன்படுத்தப்பட்டுள்ளன; மிகப் பழமையான ‘ஞானதிருஷ்டிக்காரன்’ போன்ற வடிவங்கள் தவிர்க்கப்பட்டுள்ளன.
