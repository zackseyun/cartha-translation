translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்கு எளிதாகவும் வேதாகம உரைக்கு ஏற்ற கண்ணியத்துடனும் வடிவமைக்கப்பட்டது. எபிரெயத்தில் பேச்சாளரைக் குறிக்கும் பெயர் மீண்டும் வராததால் ‘அவர்’ எனும் பிரதிப்பெயர் வைத்துப் genuine ambiguity பாதுகாக்கப்பட்டது; சூழலில் அது சாமுவேலைச் சுட்டுகிறது. ‘அதன்மேல் இருந்தது’ என்ற தெளிவற்ற குறிப்பும் மூலத்தில் இருப்பதுபோலவே விடப்பட்டுள்ளது.
