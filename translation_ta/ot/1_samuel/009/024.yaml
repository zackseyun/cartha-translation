  naturalness: ‘குறிக்கப்பட்ட நேரத்திற்காக’ என்பதைவிட ‘குறித்த நேரத்திற்காக’ நவீன நிலையான தமிழில் இயல்பானது. ‘உனக்காக வைத்திருந்தது’ என்ற சொல் மறுபடியும் வருவது பொருளில் தவறல்ல; ஆனால் ‘ஒதுக்கி வைக்கப்பட்டிருந்தது’ என்பது இச்சூழலில் உள்ள முன்கூட்டிய ஒதுக்கீட்டைத் தெளிவாகவும் இயல்பாகவும் காட்டுகிறது.
