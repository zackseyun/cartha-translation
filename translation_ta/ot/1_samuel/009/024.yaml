base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/024.yaml
  text: So the cook took up the leg and what was on it and set it before Saul[a]. And he said, “Look, what has been kept is set before you. Eat, because it was kept for you for the appointed time, from when I said[d][c][b], ‘I have invited the people.’” So Saul ate with Samuel that day.
translation:
  language: ta
  text: அப்போது சமையற்காரன் கால்பகுதியையும்[a] அதன்மேல் இருந்ததையும்[b] எடுத்து சவுலின் முன் வைத்தான். அவர், “இதோ, உனக்காக ஒதுக்கி வைக்கப்பட்டிருந்தது[c] உன் முன் வைக்கப்பட்டுள்ளது. சாப்பிடு; ஏனெனில், ‘நான் மக்களை அழைத்திருக்கிறேன்[d]’ என்று நான் சொன்னபோது, குறித்த நேரத்திற்காக அது உனக்கென ஒதுக்கி வைக்கப்பட்டிருந்தது” என்றார். அன்று சவுல் சாமுவேலுடன் சாப்பிட்டான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘தொடைப்பகுதி.’ எபிரெயச் சொல் விலங்கின் கால் சார்ந்த இறைச்சிப் பகுதியைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில் சொல்லுக்குச் சொல், ‘கால்பகுதியும் அதன்மேல் இருந்ததும்.’ அதனுடன் இருந்த பகுதி எது என்று உரை வெளிப்படையாகக் கூறவில்லை.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, ‘மீதியிருந்தது.’ எபிரெயச் சொல் எஞ்சியதையோ ஒதுக்கி வைக்கப்பட்டதையோ குறிக்கலாம்; இங்கு சவுலுக்காகச் சிறப்பாக வைத்திருந்த பகுதி என்பதையே சூழல் சுட்டுகிறது.
    reason: alternative_reading
  - marker: d
    text: அல்லது, ‘நான் மக்களைக் கூப்பிட்டிருக்கிறேன்.’ விருந்து நிகழும் சூழலில் ‘அழைத்திருக்கிறேன்’ என்பது கருத்தை இயல்பாக வெளிப்படுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַטַּבָּח
  choice: சமையற்காரன்
  rationale: பலியுணவுக்கான இறைச்சியைத் தயாரித்து பரிமாறும் நபரை இச்சூழலில் இயல்பாகக் குறிக்கிறது; ‘இறைச்சி வெட்டுபவன்’ என்பதும் சொற்பொருளாகச் சாத்தியம், ஆனால் இங்கு பரிமாறும் செயல் முன்னிலையில் உள்ளது.
- source_word: הַשּׁוֹק
  choice: கால்பகுதி
  rationale: விலங்கின் கால் சார்ந்த இறைச்சிப் பகுதியைக் குறிக்கும் பொதுவான சொல். ‘தொடைப்பகுதி’ என்று குறிப்பாக வரையறுக்காமல் எபிரெயச் சொல்லின் பரப்பைப் பாதுகாக்கிறது.
- source_word: וְהֶעָלֶיהָ
  choice: அதன்மேல் இருந்தது
  rationale: எபிரெய உரை உடன் இருந்த பொருள் என்ன என்பதைப் பெயரிட்டுக் கூறவில்லை. எனவே அது கொழுப்பு அல்லது வேறு குறிப்பிட்ட பகுதி என்று ஊகிக்காமல் மூலத்தின் பொதுமையைப் பாதுகாக்கிறது.
- source_word: הַנִּשְׁאָר
  choice: உனக்காக வைத்திருந்தது
  rationale: இது ‘மீதியானது’ என்றும் ‘ஒதுக்கி வைக்கப்பட்டது’ என்றும் பொருள்படலாம். சவுலுக்காக முன்கூட்டியே வைத்த சூழலைத் தெளிவாக்குகிறது; மாற்று பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: שִׂים לְפָנֶיךָ
  choice: உன் முன் வைக்கப்பட்டுள்ளது
  rationale: சொல்லுக்குச் சொல் கட்டளையாகத் தருவதைக் காட்டிலும், பரிமாறப்பட்ட பகுதி சவுலின் முன் இருப்பதைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: לַמּוֹעֵד
  choice: குறிக்கப்பட்ட நேரத்திற்காக
  rationale: முன்னரே தீர்மானிக்கப்பட்ட நேரம் அல்லது நிகழ்வை உணர்த்துகிறது; இதை ஒரு குறிப்பிட்ட திருவிழாவாகத் தேவையின்றி சுருக்கவில்லை.
- source_word: שָׁמוּר לְךָ
  choice: உனக்கென வைக்கப்பட்டிருந்தது
  rationale: அந்தப் பகுதி சவுலுக்காகப் பாதுகாத்து ஒதுக்கப்பட்டிருந்த நிலையை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: לֵאמֹר הָעָם קָרָאתִי
  choice: ‘நான் மக்களை அழைத்திருக்கிறேன்’ என்று நான் சொன்னதிலிருந்து
  rationale: குறுகிய எபிரெயத் தொடரின் காலத் தொடர்பைத் தமிழில் தெளிவாக்குகிறது. விருந்து சூழலில் קרא என்பதற்கு ‘அழைத்தல்’ என்பது இயல்பானது.
- source_word: עִם שְׁמוּאֵל
  choice: சாமுவேலுடன்
  rationale: இருவரும் ஒன்றாக உணவருந்தியதை நேரடியாகவும் இயல்பாகவும் தெரிவிக்கிறது.
