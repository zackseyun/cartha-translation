base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/010.yaml
  text: Then Saul said to his young man[a], “Your word is good. Come[b], let us go.” So they went to the city where the man of God was.
translation:
  language: ta
  text: அப்போது சவுல் தன் இளைஞனிடம், “நீ சொன்னது நல்லது.[a] வா, போவோம்” என்றான். எனவே, அவர்கள் தேவனுடைய மனிதர் அங்கே இருந்த நகரத்திற்குச் சென்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “உன் சொல் நல்லது”; அதாவது, “நீ சொன்னது நல்லது.”
    reason: lexical_alternative
lexical_decisions:
- source_word: נַעַר
  choice: தன்னுடன் வந்த இளைஞன்
  rationale: இச்சொல்லின் அடிப்படைப் பொருளான ‘இளைஞன்’ என்பதைக் காத்து, கதையின் சூழலில் அவன் சவுலுடன் வந்தவன் என்பதை இயல்பான தமிழில் தெரிவிக்கிறது; ‘பணியாளன்’ என்று அவனுடைய பங்கைத் தேவையின்றிக் குறுக்கவில்லை.
- source_word: טוֹב דְּבָרְךָ
  choice: நீ சொன்னது நல்லது
  rationale: முந்தைய வசனத்தில் இளைஞன் கூறிய ஆலோசனையைச் சவுல் ஏற்றுக்கொள்வதை இயல்பான தமிழில் வெளிப்படுத்துகிறது. ‘உன் சொல் நல்லது’ என்ற எபிரெய வடிவம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: לְכָה נֵלֵכָה
  choice: வா, போவோம்
  rationale: அழைப்பையும் சேர்ந்து செல்லும் தீர்மானத்தையும் கொண்ட எபிரெயக் கூற்றின் ஊக்குவிக்கும் தன்மையைச் சுருக்கமாகவும் இயல்பாகவும் காக்கிறது.
- source_word: הָעִיר
  choice: நகரம்
  rationale: עִיר என்பதற்கான வழக்கமான நேரடிப் பொருள்; குறிப்பிட்ட நகரத்தைக் குறிக்கும் எபிரெய வரையறையையும் வாக்கிய அமைப்பு தெரிவிக்கிறது.
- source_word: אִישׁ הָאֱלֹהִים
  choice: தேவனுடைய மனிதர்
  rationale: இது தீர்க்கதரிசியையோ தேவனுக்காகப் பேசுகிறவரையோ குறிக்கும் எபிரெயப் பட்டப்பெயர். ‘தீர்க்கதரிசி’ என்று விளக்கமாக மாற்றாமல் மூலத்தின் சொற்றொடரையும் இறையியல் நயத்தையும் காக்கிறது.
- source_word: אֲשֶׁר שָׁם
  choice: இருந்த
  rationale: ‘அங்கே இருந்த’ என்ற கருத்தைத் தமிழில் தேவையற்ற மீளுரையின்றி இயல்பான பெயரெச்சத் தொடராக அளிக்கிறது.
theological_decisions:
- issue: אִישׁ הָאֱלֹהִים என்ற பட்டப்பெயரை மொழிபெயர்த்தல்
  choice: தேவனுடைய மனிதர்
  alternative: தீர்க்கதரிசி
  rationale: இந்தத் தொடர் பொதுவாக ஒரு தீர்க்கதரிசியையோ தேவனுக்காகப் பேசுகிறவரையோ குறித்தாலும், இங்கு மூல உரை பயன்படுத்தும் பட்டப்பெயரையே நேரடியாகக் காப்பது விளக்கத்தை மொழிபெயர்ப்புக்குள் புகுத்துவதைத் தவிர்க்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான கதையாடல் நடை பயன்படுத்தப்பட்டுள்ளது. ‘தன்னுடன் வந்த’ என்பது נַעַר என்பவனின் சூழல்சார் தொடர்பைத் தெளிவாக்குகிறது; ‘தேவனுடைய மனிதர்’ என்ற மூலப் பட்டப்பெயர் மாற்றமின்றிக் காக்கப்பட்டுள்ளது.
