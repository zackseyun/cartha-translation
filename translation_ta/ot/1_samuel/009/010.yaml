revisions:
- from: அப்போது சவுல் தன்னுடன் வந்த இளைஞனிடம், “நீ சொன்னது நல்லது.[a] வா, போவோம்” என்றான். எனவே, அவர்கள் தேவனுடைய மனிதர்[b] இருந்த நகரத்திற்குச் சென்றார்கள்.
  to: அப்போது சவுல் தன் இளைஞனிடம், “நீ சொன்னது நல்லது.[a] வா, போவோம்” என்றான். எனவே, அவர்கள் தேவனுடைய மனிதர் அங்கே இருந்த நகரத்திற்குச் சென்றார்கள்.
