revisions:
- from: 'அவர்கள் அவர்களுக்குப் பதிலளித்துச் சொன்னார்கள்: “ஆம், பாருங்கள்—அவர் உங்களுக்குச் சற்று முன்னால் இருக்கிறார். இப்போதே விரைந்து செல்லுங்கள்; ஏனெனில் அவர் இன்று நகரத்துக்கு வந்திருக்கிறார். இன்று மக்களுக்காக மேட்டிலுள்ள வழிபாட்டிடத்தில்[a] ஒரு பலி செலுத்தப்படுகிறது.”'
  to: 'அவர்கள் அவர்களுக்குப் பதிலளித்துச் சொன்னார்கள்: “ஆம், பாருங்கள்—அவர் உங்களுக்குச் சற்று முன்னால் இருக்கிறார். இப்போதே விரைந்து செல்லுங்கள்; ஏனெனில் அவர் இன்று நகரத்துக்கு வந்திருக்கிறார்; ஏனெனில் இன்று மக்களுக்காக மேட்டிலுள்ள வழிபாட்டிடத்தில்[a] ஒரு பலி இருக்கிறது.”'
  rationale: The revision retains the draft's natural modern Tamil and its careful rendering of the high place, while restoring the source's second explanatory connector and using an existential expression for the sacrifice clause. No doctrinal interpretation has been added.
