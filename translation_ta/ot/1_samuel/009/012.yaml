reference: 1 Samuel 9:12
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/תַּעֲנֶ֧ינָה אוֹתָ֛/ם וַ/תֹּאמַ֥רְנָה יֵּ֖שׁ הִנֵּ֣ה לְ/פָנֶ֑י/ךָ מַהֵ֣ר עַתָּ֗ה כִּ֤י הַ/יּוֹם֙ בָּ֣א לָ/עִ֔יר כִּ֣י זֶ֧בַח הַ/יּ֛וֹם לָ/עָ֖ם בַּ/בָּמָֽה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/012.yaml
  text: They answered them and said[a], “Yes, look—he is just ahead of you. Hurry now, because he came to the city today[b], because today there is a sacrifice for the people at the high place.”
translation:
  language: ta
  text: 'அவர்கள் அவர்களுக்குப் பதிலளித்துச் சொன்னார்கள்: “ஆம், பாருங்கள்—அவர் உங்களுக்குச் சற்று முன்னால் இருக்கிறார். இப்போதே விரைந்து செல்லுங்கள்; ஏனெனில் அவர் இன்று நகரத்துக்கு வந்திருக்கிறார்; ஏனெனில் இன்று மக்களுக்காக மேட்டிலுள்ள வழிபாட்டிடத்தில்[a] ஒரு பலி இருக்கிறது.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “மேட்டிலுள்ள வழிபாட்டிடம்” என்பது உயரமான இடத்தில் அமைந்திருந்த ஓர் உள்ளூர் வழிபாட்டுத் தலத்தைக் குறிக்கிறது.
    reason: cultural_note
lexical_decisions:
- source_word: וַתַּעֲנֶינָה ... וַתֹּאמַרְנָה
  choice: அவர்கள் அவர்களுக்குப் பதிலளித்துச் சொன்னார்கள்
  rationale: பெண்பால் பன்மை வினை வடிவங்கள் இளம்பெண்களைக் குறிக்கின்றன; தமிழில் பால்வேறுபாடு வெளிப்படாத இயல்பான பன்மை வடிவத்துடன் எபிரெய உரையாடல் இணைப்பு பாதுகாக்கப்படுகிறது.
- source_word: יֵשׁ הִנֵּה
  choice: ஆம், பாருங்கள்
  rationale: יֵשׁ முந்தைய கேள்விக்கான உறுதிப்பதில் ஆகவும், הִנֵּה கவனத்தை ஈர்க்கும் சொல்லாகவும் இங்கு செயல்படுகின்றன.
- source_word: לְפָנֶיךָ
  choice: உங்களுக்குச் சற்று முன்னால்
  rationale: சொற்பொருள் ‘உங்களுக்கு முன்பாக’; பயணச் சூழலில் அருகிலுள்ள முன்னிடத்தைக் குறிக்கும் இயல்பான தமிழ் வடிவம்.
- source_word: מַהֵר עַתָּה
  choice: இப்போதே விரைந்து செல்லுங்கள்
  rationale: கட்டளை மற்றும் உடனடி அவசரம் இரண்டையும் நவீன, கண்ணியமான தமிழில் வெளிப்படுத்துகிறது.
- source_word: כִּי הַיּוֹם בָּא לָעִיר
  choice: ஏனெனில் அவர் இன்று நகரத்துக்கு வந்திருக்கிறார்
  rationale: בָּא குறிக்கும் அன்றைய வருகையின் தற்போதைய தொடர்பைத் தமிழின் நிறைவுநிலை வடிவம் இயல்பாகத் தருகிறது.
- source_word: זֶבַח
  choice: ஒரு பலி செலுத்தப்படுகிறது
  rationale: זֶבַח என்பதன் பலி சார்ந்த பொருளைப் பாதுகாக்கிறது; விருந்து என்ற கருத்தை வசனத்திற்குள் கூடுதலாகச் சேர்க்கவில்லை.
- source_word: לָעָם
  choice: மக்களுக்காக
  rationale: சமூகத்திற்காக அல்லது அவர்கள் பங்கேற்கும் வகையில் நடைபெறும் பலியைக் குறிக்கும் நேரடியான மொழிபெயர்ப்பு.
- source_word: בַּבָּמָה
  choice: மேட்டிலுள்ள வழிபாட்டிடத்தில்
  rationale: במה என்பது உயரமான இடத்திலிருந்த உள்ளூர் வழிபாட்டுத் தலத்தைக் குறிக்கும்; ‘மேடு’ மட்டும் என்பதால் உண்டாகக்கூடிய தெளிவின்மையைத் தவிர்க்கிறது.
theological_decisions:
- issue: அரசாட்சி உருவாகுமுன் இருந்த வழிபாட்டுச் சூழலில் במה என்பதன் மொழிபெயர்ப்பு
  choice: மேட்டிலுள்ள வழிபாட்டிடம்
  alternative: உயர்ந்த இடம்; மேட்டுச் சன்னதி
  rationale: இது அங்கீகரிக்கப்பட்ட உள்ளூர் வழிபாட்டுத் தலத்தைக் குறிக்கிறது. பின்னாளைய எதிர்மறை மதிப்பீட்டை இவ்வசனத்தில் திணிக்காமல், அதன் நிலவியல் மற்றும் வழிபாட்டுப் பண்புகளை வெளிப்படுத்துகிறது.
translation_notes:
  register: நவீன தரநிலைத் தமிழ்; உரையாடலில் இயல்பான மரியாதைப் பன்மையும், வரலாற்றுக் கதையாடலுக்கேற்ற கண்ணியமான நடையும் பயன்படுத்தப்பட்டுள்ளன. எபிரெய மூலத்தின் இரு காரணக் கிளவிகளும் தனித்தனி வாக்கியங்களாகத் தெளிவுபடுத்தப்பட்டுள்ளன.
