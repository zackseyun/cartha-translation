- from: அப்போது சவுல் வாசலின் நடுப்பகுதியில் சாமுவேலை அணுகி, “காண்பவரின்[a] வீடு எங்கே இருக்கிறது என்று தயவுசெய்து எனக்குச் சொல்லுங்கள்[b]” என்றான்.
  to: அப்போது சவுல் வாசலின் நடுப்பகுதியில் சாமுவேலை அணுகி, “தரிசியின்[a] வீடு எங்கே இருக்கிறது என்று தயவுசெய்து எனக்குச் சொல்லுங்கள்” என்றான்.
