reference: 1 Samuel 9:18
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יִּגַּ֥שׁ שָׁא֛וּל אֶת שְׁמוּאֵ֖ל בְּ/ת֣וֹךְ הַ/שָּׁ֑עַר וַ/יֹּ֨אמֶר֙ הַגִּֽידָ/ה נָּ֣א לִ֔/י אֵי זֶ֖ה בֵּ֥ית הָ/רֹאֶֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/018.yaml
  text: Then Saul approached Samuel in the midst of the gate and said[b][a], “Please tell me where the seer’s house is.”
translation:
  language: ta
  text: அப்போது சவுல் வாசலின் நடுப்பகுதியில் சாமுவேலை அணுகி, “தரிசியின்[a] வீடு எங்கே இருக்கிறது என்று தயவுசெய்து எனக்குச் சொல்லுங்கள்” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “தரிசி” என்பது பிற்காலத்தில் பொதுவாக “தீர்க்கதரிசி” என்று அழைக்கப்பட்டவருக்கான பழைய பெயர்; இதை 1 சாமுவேல் 9:9 விளக்குகிறது.
    reason: cross_reference
lexical_decisions:
- source_word: וַיִּגַּשׁ
  choice: அணுகி
  rationale: நגשׁ என்பது ஒருவரிடம் நெருங்கிச் செல்வதைக் குறிக்கிறது; ‘அணுகி’ என்பது இயல்பான நவீனத் தமிழில் அந்த இயக்கத்தைத் தெளிவாகக் காக்கிறது.
- source_word: בְּתוֹךְ הַשָּׁעַר
  choice: வாசலின் நடுப்பகுதியில்
  rationale: எபிரெயச் சொற்றொடரின் ‘வாசலின் நடுவில்’ என்ற இடக்குறிப்பைத் தக்கவைக்கிறது; இங்கு ‘வாசல்’ என்பது வெறும் கதவை மட்டுமல்ல, வாசல் வளாகத்தையும் குறிக்கக்கூடும்.
- source_word: הַגִּידָה נָּא לִי
  choice: தயவுசெய்து எனக்குச் சொல்லுங்கள்
  rationale: கட்டளை வினையுடன் வரும் נָא-வின் மரியாதையான வேண்டுகோள் நயத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: אֵי זֶה
  choice: எங்கே இருக்கிறது
  rationale: சூழலில் இது அடையாளத்தைவிட இருப்பிடத்தைக் கேட்பதால், தமிழில் இயல்பான இடவினாவாக மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: בֵּית הָרֹאֶה
  choice: காண்பவரின் வீடு
  rationale: רֹאֶה என்பதன் ‘காண்பவர்’ என்ற பழைய பதவிப்பெயரை நேரடியாகத் தக்கவைத்து, எபிரெயக் கட்டிணைப்பை இயல்பான தமிழ் உடைமைத் தொடராக வழங்குகிறது.
theological_decisions:
- issue: רֹאֶה என்ற பழைய பதவிப்பெயரின் மொழிபெயர்ப்பு
  choice: காண்பவர்
  alternative: தீர்க்கதரிசி
  rationale: வசனம் 9:9 தானே இந்தப் பழைய சொல்லுக்கும் பின்னர் வழக்கான ‘தீர்க்கதரிசி’ என்ற சொல்லுக்கும் உள்ள தொடர்பை விளக்குவதால், இரண்டையும் இங்கே ஒன்றாக்காமல் கதையின் வரலாற்றுச் சொல்லாட்சியைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சவுலின் மரியாதையான வேண்டுகோளைப் பன்மை மரியாதை வினையால் வெளிப்படுத்தியுள்ளோம். ‘காண்பவர்’ சற்றுப் புதுமையாக ஒலித்தாலும், மூலத்தின் பழைய பதவிப்பெயரையும் 9:9-இன் விளக்கத்தையும் காக்கிறது.
