    reason: cross_reference
  revision_rationale: The revision preserves the Hebrew’s older title רֹאֶה with the established Tamil biblical term “தரிசி,” while the note supplies the chapter’s own explanation of its relation to “தீர்க்கதரிசி.” The remaining wording accurately and naturally represents Saul’s respectful request in the gate area.
