base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/007.yaml
  text: Then Saul said to his young man[a], “But look, if we go, what will we bring to the man? For the bread is gone from our bags, and there is no gift to bring to the man of God[b]. What do we have?”
translation:
  language: ta
  text: அப்போது சவுல் தன்னுடன் இருந்த இளைஞனிடம்[a], “நாம் போனால், அந்த மனிதருக்கு என்ன கொண்டுபோவோம்? இதோ, நம் பைகளிலிருந்த அப்பம் தீர்ந்துவிட்டது; இறைவனின் மனிதருக்குக் கொண்டுபோக அன்பளிப்பும்[b] இல்லை. நம்மிடம் என்ன இருக்கிறது?” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘இளம் உதவியாளனிடம்.’ எபிரெயச் சொல் ஓர் இளைஞனையோ இளம் பணியாளனையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘பரிசும்.’ எபிரெயச் சொல் மதிப்புக்குரிய ஒருவரிடம் கொண்டுசெல்லப்படும் அன்பளிப்பைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: נַעַר
  choice: இளைஞன்
  rationale: இச்சொல் வயதில் இளைய ஒருவரையோ இளம் உதவியாளரையோ குறிக்கலாம். சூழலில் அவர் சவுலின் பணியாளர் என்பது தெரிந்தாலும், மூலச்சொல்லுக்கு அப்பாற்பட்டு அடிமை அல்லது வேலைக்காரன் என்ற நிலையைத் திணிக்காமல் வயது சார்ந்த நுட்பத்தைப் பாதுகாக்கிறது.
- source_word: וְהִנֵּה
  choice: இதோ
  rationale: சவுல் முன்வைக்கும் நடைமுறைச் சிக்கலுக்கு கவனத்தை ஈர்க்கும் எபிரெயத் துகளின் இயல்பை நவீன, கண்ணியமான தமிழில் வெளிப்படுத்துகிறது.
- source_word: נֵלֵךְ
  choice: நாம் போனால்
  rationale: இங்கு வினை நிபந்தனை போன்ற பொருளில் வருகிறது; தமிழில் ‘போனால்’ என்பது இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: נָּבִיא
  choice: கொண்டுபோவோம்
  rationale: ஒருவரிடம் எதையாவது எடுத்துச் செல்வதை இங்குள்ள ஹிஃபில் வடிவம் குறிக்கிறது; தமிழ்ச் சூழலில் இலக்கிடத்தை நோக்கிய இயக்கத்தை ‘கொண்டுபோ’ இயல்பாகத் தெரிவிக்கிறது.
- source_word: לָאִישׁ
  choice: அந்த மனிதருக்கு
  rationale: ஆண்பால் ஒருமையையும் குறிப்பிட்ட நபரான சாமுவேலைச் சுட்டுவதையும் பாதுகாக்கிறது; மரியாதைப் பன்மையைப் பயன்படுத்தாமல் ‘மனிதருக்கு’ என்பது கண்ணியமான தமிழாக உள்ளது.
- source_word: לֶחֶם
  choice: அப்பம்
  rationale: மூலத்தில் பொதுவான உணவுப்பொருள் என்பதற்குப் பதிலாக நேரடியாக ‘அப்பம்’ உள்ளது; அந்தத் திடமான உருவகத்தை முதன்மை உரையில் காக்கிறது.
- source_word: אָזַל
  choice: தீர்ந்துவிட்டது
  rationale: கையிருப்பு முழுவதும் பயன்படுத்தப்பட்டு இனி இல்லை என்ற பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: כְּלִי
  choice: பைகள்
  rationale: அடிப்படையில் பாத்திரங்கள் அல்லது கொள்கலன்கள் என்றாலும், பயண உணவை வைத்துச் சென்ற சூழலில் ‘பைகள்’ தெளிவான இயல்பான இணைச்சொல்.
- source_word: תְּשׁוּרָה
  choice: அன்பளிப்பு
  rationale: மதிப்புக்குரிய ஒருவரிடம் எடுத்துச் செல்லப்படும் பரிசைக் குறிக்கிறது; ‘காணிக்கை’ என்ற வழிபாட்டுச் சார்பைத் தேவையின்றி புகுத்தாமல் சமூக மரியாதையின் நுட்பத்தைத் தருகிறது.
- source_word: אִישׁ הָאֱלֹהִים
  choice: இறைவனின் மனிதர்
  rationale: இது தெய்வீகப் பணிக்காக நியமிக்கப்பட்டவரைக் குறிக்கும் எபிரெயப் பட்டப்பெயர். அதை ‘தீர்க்கதரிசி’ என்று விளக்கிவிடாமல் மூலத்தின் சொல்லமைப்பைத் தக்கவைக்கிறது.
- source_word: מָה אִתָּנוּ
  choice: நம்மிடம் என்ன இருக்கிறது?
  rationale: அவர்களுடன் தற்போது கிடைக்கக்கூடியது என்ன என்று கேட்கும் எபிரெய மரபுத்தொடரை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: אִישׁ הָאֱלֹהִים என்ற பட்டப்பெயர்
  choice: இறைவனின் மனிதர்
  alternative: தீர்க்கதரிசி
  rationale: சாமுவேல் தீர்க்கதரிசி என்பது சூழலுக்கு ஏற்ப உண்மையானாலும், இவ்வசனம் பயன்படுத்தும் குறிப்பிட்ட பட்டப்பெயரை மாற்றாமல் பாதுகாக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழ்; எளிதில் புரியும், கண்ணியமான கதைநடை. ‘இதோ’ என்ற கவன ஈர்ப்புச் சொல் இயல்பான இடத்தில் வைக்கப்பட்டுள்ளது. நேரடி உரையின் நடைமுறைச் சிக்கலும் மூலத்தின் மீளுரையும் பாதுகாக்கப்பட்டுள்ளன.
