base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/016.yaml
  text: About this time tomorrow I will send to you a man from the land of Benjamin[a], and you shall anoint him as ruler over my people Israel. He will save my people from the hand of the Philistines, for I have seen my people[b], because their cry has come to me.
translation:
  language: ta
  text: நாளை இதே நேரத்தில் நான் பென்யமீன் கோத்திரத்தின் நிலப்பகுதியிலிருந்து ஒரு மனிதனை உன்னிடம் அனுப்புவேன். நீ அவனை என் மக்களாகிய இஸ்ரவேலின்மேல் ஆட்சியாளனாக[a] அபிஷேகம் செய்ய வேண்டும். அவன் என் மக்களைப் பெலிஸ்தியரின் கையிலிருந்து விடுவிப்பான். ஏனெனில், அவர்களுடைய கூக்குரல் என்னிடம் வந்துள்ளதால், நான் என் மக்களைக் கண்டிருக்கிறேன்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ஆட்சியாளனாக” என்பதற்கான எபிரேயச் சொல் நாகீத்; “தலைவராக” அல்லது பாரம்பரியமாக “இளவரசனாக” என்றும் மொழிபெயர்க்கலாம். இது ஆளுவதற்காக நியமிக்கப்பட்ட ஒருவரைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: எபிரேயில் சொல்லுக்குச் சொல், “அவனுடைய கூக்குரல் என்னிடம் வந்துள்ளது.” இங்குள்ள ஒருமைச் சுட்டு, “என் மக்கள்” என்ற கூட்டுப்பெயரைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּעֵת מָחָר
  choice: நாளை ஏறக்குறைய இதே நேரத்தில்
  rationale: כְּ־ உடன் வரும் עֵת காலத்தை அண்மித்த அளவில் குறிக்கலாம்; மָחָר உடன் சேர்ந்து நாளை இதே நேரத்தைச் சுற்றிய காலப்புள்ளியை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: אֶשְׁלַח אֵלֶיךָ
  choice: உன்னிடம் அனுப்புவேன்
  rationale: אֶל என்பதன் ‘உன்னிடமாக’ என்ற திசைநோக்கிய நுணுக்கத்தை இயல்பான தமிழில் காக்கிறது.
- source_word: מֵאֶרֶץ בִּנְיָמִן
  choice: பென்யமீன் நாட்டிலிருந்து
  rationale: אֶרֶץ இங்கு பென்யமீன் கோத்திரத்தின் நிலப்பகுதியைக் குறிக்கிறது; ‘நாடு’ என்பது சூழலுக்கேற்ற சுருக்கமான புவியியல் சொல்.
- source_word: וּמְשַׁחְתּוֹ
  choice: நீ அவனை ... அபிஷேகம் செய்ய வேண்டும்
  rationale: வாவ் இணைந்த perfect இங்கு சாமுவேலுக்கான தெய்வீக அறிவுறுத்தல் அல்லது கட்டளையின் வலிமையைக் கொண்டுள்ளது.
- source_word: לְנָגִיד
  choice: ஆளுநராக
  rationale: נָגִיד நியமிக்கப்பட்ட ஆட்சித் தலைவரைக் குறிக்கிறது; ‘ராஜா’ என்று முன்கூட்டியே குறிப்பாக்காமலும், வெறும் பொதுவான ‘தலைவர்’ என்பதைவிட ஆட்சிப் பொறுப்பைத் தெளிவாகவும் காட்டுகிறது.
- source_word: וְהוֹשִׁיעַ
  choice: அவன் ... விடுவிப்பான்
  rationale: יָשַׁע பகைவரின் அதிகாரத்திலிருந்து மீட்பதை இங்கு குறிக்கிறது; ‘விடுவிப்பான்’ என்பது இராணுவ-அரசியல் சூழலை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: מִיַּד פְּלִשְׁתִּים
  choice: பெலிஸ்தியரின் கையிலிருந்து
  rationale: ‘கை’ என்பது அதிகாரம் அல்லது கட்டுப்பாட்டுக்கான எபிரேய உருவகத்தைப் பாதுகாக்கிறது; தமிழிலும் புரிந்துகொள்ளத்தக்கது.
- source_word: כִּי רָאִיתִי אֶת עַמִּי
  choice: ஏனெனில், நான் என் மக்களைக் கண்டேன்
  rationale: ரָאָה என்பதன் நேரடியான ‘காணுதல்’ மொழியைப் பாதுகாத்து, தேவன் மக்களின் நிலையை கவனித்தார் என்ற சூழல்நுணுக்கத்தை வாசகருக்குத் திறந்தவாறே வைக்கிறது.
- source_word: צַעֲקָתוֹ
  choice: அவர்களுடைய கூக்குரல்
  rationale: எபிரேயில் ஒருமை பின்னொட்டு இருந்தாலும், அதன் முன்னோடி ‘என் மக்கள்’ என்ற கூட்டுப்பெயர்; நவீன தமிழில் பன்மைச் சுட்டு பொருளைத் தெளிவாக்குகிறது.
theological_decisions:
- issue: נָגִיד என்பதன் மூலம் சவுலின் பதவியைச் சித்தரித்தல்
  choice: ஆளுநர்
  alternative: தலைவர்; அதிபதி; இளவரசன்
  rationale: இந்தச் சொல் தேவனால் நியமிக்கப்பட்ட ஆட்சியதிகாரத்தைச் சுட்டுகிறது; ஆயினும் இவ்விடத்தில் מֶלֶךְ (‘ராஜா’) என்ற சொல்லைப் பயன்படுத்தவில்லை. ஆகவே அரசாட்சியை மிகையாகக் குறிப்பாக்காமல் ஆளும் பொறுப்பைத் தெரிவிக்கிறது.
- issue: 'וְהוֹשִׁיעַ என்பதன் தொடர்பு: விளைவா அல்லது நோக்கமா'
  choice: அவன் ... விடுவிப்பான்
  alternative: அவன் ... விடுவிக்கும்படியாக
  rationale: வடிவம் நியமனத்தின் எதிர்கால விளைவாகவும் நோக்கமாகவும் புரிந்துகொள்ளப்படலாம். முதன்மை உரை இயல்பான எதிர்காலக் கூற்றைப் பயன்படுத்துகிறது; நோக்க நுணுக்கத்தை மறுப்பதில்லை.
- issue: צַעֲקָתוֹ-வில் உள்ள கூட்டொருமை
  choice: அவர்களுடைய கூக்குரல்
  alternative: அவனுடைய கூக்குரல்; அதன் கூக்குரல்
  rationale: ஒருமை பின்னொட்டு கூட்டொருமையான ‘என் மக்கள்’ என்பதைக் குறிக்கிறது. தமிழில் ‘அவர்களுடைய’ என்பது மக்களின் கூட்டு முறையீட்டைத் தெளிவாகவும் மரியாதையாகவும் தெரிவிக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான வேதாகம நடையைப் பயன்படுத்துகிறது. ‘அபிஷேகம்’, ‘பெலிஸ்தியர்’ போன்ற பரவலாக அறியப்பட்ட வேதாகமச் சொற்கள் தக்கவைக்கப்பட்டுள்ளன. தெய்வீக உரையின் நேரடித்தன்மையும் எபிரேய உருவகமான ‘கையிலிருந்து’ என்பதும் பாதுகாக்கப்பட்டுள்ளன.
