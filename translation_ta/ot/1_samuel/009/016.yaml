revisions:
- from: நாளை ஏறக்குறைய இதே நேரத்தில், பென்யமீன் நாட்டிலிருந்து ஒரு மனிதனை உன்னிடம் அனுப்புவேன். நீ அவனை என் மக்களாகிய இஸ்ரவேலின்மேல் ஆளுநராக[a] அபிஷேகம் செய்ய வேண்டும். அவன் என் மக்களைப் பெலிஸ்தியரின் கையிலிருந்து விடுவிப்பான். ஏனெனில், நான் என் மக்களைக் கண்டேன்; அவர்களுடைய கூக்குரல் என்னிடம் வந்துள்ளது[b].
  to: நாளை இதே நேரத்தில் நான் பென்யமீன் கோத்திரத்தின் நிலப்பகுதியிலிருந்து ஒரு மனிதனை உன்னிடம் அனுப்புவேன். நீ அவனை என் மக்களாகிய இஸ்ரவேலின்மேல் ஆட்சியாளனாக[a] அபிஷேகம் செய்ய வேண்டும். அவன் என் மக்களைப் பெலிஸ்தியரின் கையிலிருந்து விடுவிப்பான். ஏனெனில், அவர்களுடைய கூக்குரல் என்னிடம் வந்துள்ளதால், நான் என் மக்களைக் கண்டிருக்கிறேன்[b].
  rationale: The revision retains the draft’s meaning and register while correcting the territorial nuance of ‘land of Benjamin,’ avoiding the potentially narrower modern administrative sense of ‘governor’ for נָגִיד, and expressing the causal relation of the final clause more directly. The footnote at a is updated to correspond to the revised main-text term; the collective-singular note remains necessary and correctly anchored.
