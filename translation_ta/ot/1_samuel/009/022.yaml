translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையான வேதாகம நடையையும் பொதுவாசகர்களுக்கான தெளிவையும் இணைக்கும் வகையில் மொழியாக்கப்பட்டது. சாமுவேலுக்கான மரியாதைப் பன்மை வினைமுற்று பயன்படுத்தப்பட்டது. மூலத்தின் எண்ணிக்கைச் சொற்றொடர் தனி வாக்கியமாக வைக்கப்பட்டு அதன் சுட்டுப்பெயர் தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்பட்டது.
