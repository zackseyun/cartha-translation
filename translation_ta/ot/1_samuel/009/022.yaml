base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/022.yaml
  text: Then Samuel took Saul and his young man and brought them into the hall[a], and gave them a place at the head of those who had been invited[c][b]; and they were about thirty men.
translation:
  language: ta
  text: பின்பு சாமுவேல் சவுலையும் அவனுடைய பணியாளனையும்[a] கூட்டிக்கொண்டு விருந்து மண்டபத்திற்குள்[b] அழைத்துச் சென்றார். அழைக்கப்பட்டிருந்தவர்களின் முதன்மையான இடத்தில் அவர்களுக்கு இடம் கொடுத்தார். அவர்கள் ஏறக்குறைய முப்பது பேர்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவனுடைய இளைஞனையும்” அல்லது “அவனுடைய உதவியாளனையும்.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அறைக்குள்.” எபிரெயச் சொல் ஓர் அறையையோ கூடத்தையோ குறிக்கலாம்; இங்கு விருந்து நடைபெறும் பெரிய இடமாக இருக்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: எபிரெயில், “அவர்கள் ஏறக்குறைய முப்பது ஆண்கள்.” ‘அவர்கள்’ என்பது அழைக்கப்பட்டிருந்த விருந்தினர்களைக் குறிக்கலாம்.
    reason: referent_ambiguity
lexical_decisions:
- source_word: נַעֲרוֹ
  choice: அவனுடைய பணியாளன்
  rationale: נַעַר என்பது இளைஞன், பணியாளன் அல்லது உதவியாளர் எனப் பொருள்படலாம். முந்தைய கதைச்சூழலில் சவுலுடன் கீழ்நிலையில் துணையாகச் சென்றவரைக் குறிக்கும் என்பதால், இயல்பான தமிழில் ‘பணியாளன்’ எனத் தேர்ந்தெடுக்கப்பட்டது; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: לִשְׁכָּתָה
  choice: விருந்து மண்டபத்திற்குள்
  rationale: לִשְׁכָּה என்பது அறை, கூடம் அல்லது மண்டபத்தைக் குறிக்கலாம். இங்கு சுமார் முப்பது அழைக்கப்பட்டோர் அமரும் விருந்து நிகழ்வாக இருப்பதால், சூழலைத் தெளிவாக்கும் ‘விருந்து மண்டபம்’ இயல்பான தேர்வு.
- source_word: מָקוֹם
  choice: இடம்
  rationale: מָקוֹם என்பதன் நேர்ப்பொருள் ‘இடம்.’ விருந்து அமர்வு சூழலில் இருக்கையையோ அமரும் நிலையையோ உணர்த்தினாலும், எபிரெயச் சொல்லின் விரிவை ‘இடம்’ பாதுகாக்கிறது.
- source_word: בְּרֹאשׁ
  choice: முதன்மையான இடத்தில்
  rationale: ‘தலையில்/முன்னிலையில்’ என்ற உருவகச் சொற்றொடர் இங்கு மரியாதைக்குரிய பிரதான இடத்தைக் குறிக்கிறது. ‘முதன்மையான இடத்தில்’ என்பது நவீன தமிழில் இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: הַקְּרוּאִים
  choice: அழைக்கப்பட்டிருந்தவர்கள்
  rationale: קרא வினையின் செயப்பாட்டு எச்சம் விருந்துக்கு அழைக்கப்பட்டவர்களைக் குறிக்கிறது. ‘அழைக்கப்பட்டிருந்தவர்கள்’ மூல வடிவத்தையும் விருந்து சூழலையும் காக்கிறது.
- source_word: וְהֵמָּה כִּשְׁלֹשִׁים אִישׁ
  choice: அவர்கள் ஏறக்குறைய முப்பது பேர்
  rationale: ‘அவர்கள்’ என்பது அண்மையில் குறிப்பிடப்பட்ட அழைக்கப்பட்டிருந்தவர்களைக் குறிக்கும் வாய்ப்பு மிகுதி. தமிழில் ‘முப்பது பேர்’ பாலினக் குறியீட்டைத் திணிக்காமல் மனிதர்களை இயல்பாக எண்ணுகிறது; எபிரெயில் אִישׁ இருப்பதையும் அடிக்குறிப்பு விளக்குகிறது.
- source_word: וַיִּקַּח
  choice: அழைத்துக்கொண்டு
  rationale: לקח என்பதன் அடிப்படைப் பொருள் ‘எடுத்துக்கொள்/கொண்டுசெல்.’ மனிதர்களை அடுத்த இடத்துக்கு உடன் கூட்டிச் செல்லும் இச்சூழலில் ‘அழைத்துக்கொண்டு’ என்பது தமிழில் இயல்பான தொடராகும்.
- source_word: וַיְבִיאֵם
  choice: அவர்களைக் கொண்டுவந்தார்
  rationale: בוא என்பதன் ஹிஃபில் வடிவம் ‘உள்ளே கொண்டுவருதல்/அழைத்துவருதல்’ எனப் பொருள்படும். இலக்கிடச் சொற்றொடருடன் ‘கொண்டுவந்தார்’ இயக்கத்தைத் தெளிவாகத் தருகிறது.
