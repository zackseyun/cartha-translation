    issue: The phrase 'நாம் செல்லவேண்டிய வழி' is interpretively specific.
    rationale: The Hebrew אֶת־דַּרְכֵּנוּ literally means 'our way' and can encompass the route ahead or the action to take. The proposed wording selects the route sense in the main text, despite the footnote recognizing the broader ambiguity.
