  edition: WLC
  text: וַ/יֹּ֤סֶף הַ/נַּ֨עַר֙ לַ/עֲנ֣וֹת אֶת שָׁא֔וּל וַ/יֹּ֕אמֶר הִנֵּה֙ נִמְצָ֣א בְ/יָדִ֔/י רֶ֖בַע שֶׁ֣קֶל כָּ֑סֶף וְ/נָֽתַתִּי֙ לְ/אִ֣ישׁ הָ/אֱלֹהִ֔ים וְ/הִגִּ֥יד לָ֖/נוּ אֶת דַּרְכֵּֽ/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/008.yaml
  text: The young man answered Saul again and said[a], “Look, I have in my hand a quarter shekel of silver. I will give it to the man of God, and he will tell us our way.”
translation:
  language: ta
  text: இளைஞன் சவுலுக்குப் மீண்டும் பதிலளித்து, “இதோ, என் கையில் கால் சேக்கல் வெள்ளி இருக்கிறது. அதை இறைவனுடைய மனிதருக்குக் கொடுப்பேன்; அவர் நமக்கு நம் வழியை[a] சொல்வார்” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மூலத்தில், “நம் வழி.” இது அடுத்து செல்லவேண்டிய பாதையையோ மேற்கொள்ளவேண்டிய நடவடிக்கையையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּסֶף ... לַעֲנוֹת
  choice: மீண்டும் பதிலளித்து
  rationale: יסף + வினையெச்சம் மீண்டும் அல்லது தொடர்ந்து செய்வதைக் குறிக்கிறது; முந்தைய சவுலின் மறுப்புக்குப் பின்வரும் பதில் என்பதால் ‘மீண்டும் பதிலளித்து’ இயல்பாக உள்ளது.
- source_word: הַנַּעַר
  choice: அந்த இளைஞன்
  rationale: נער என்பது இளைஞன், பணியாள், உதவியாளர் ஆகிய பொருள்களைக் கொண்டிருக்கலாம். இங்கே சமூகப் பங்கை அளவுக்கு மீறி விளக்காமல் அடிப்படைப் பொருளைப் பாதுகாக்கிறது.
- source_word: הִנֵּה
  choice: இதோ
  rationale: கவனத்தை ஈர்க்கும் எபிரெய இடைச்சொல்லுக்கு நவீனத் தமிழில் இயல்பான, சுருக்கமான இணை.
- source_word: נִמְצָא בְיָדִי
  choice: என் கையில் ... இருக்கிறது
  rationale: சொல்லெழுத்தாக ‘என் கையில் காணப்படுகிறது’ என்றாலும், உடைமையையும் கையிருப்பையும் இயல்பான தமிழில் இவ்வாறு தெரிவிக்கிறது.
- source_word: רֶבַע שֶׁקֶל כָּסֶף
  choice: கால் சேக்கல் வெள்ளி
  rationale: எடையை அடிப்படையாகக் கொண்ட பண மதிப்பைத் துல்லியமாகவும் சுருக்கமாகவும் தெரிவிக்கிறது.
- source_word: וְנָתַתִּי
  choice: அதை ... கொடுப்பேன்
  rationale: உரையாடல் சூழலில் qatal வடிவம் எதிர்கால நோக்கத்தைக் காட்டுகிறது; ‘அதை’ என்பது வெள்ளியைக் குறிக்கிறது எனத் தமிழில் தெளிவுபடுத்துகிறது.
- source_word: לְאִישׁ הָאֱלֹהִים
  choice: இறைவனின் மனிதருக்கு
  rationale: தீர்க்கதரிசி அல்லது தெய்வீகப் பணிப்பைப் பெற்றவரைக் குறிக்கும் எபிரெயப் பட்டத்தை வெளிப்படையாகப் பாதுகாக்கிறது.
- source_word: וְהִגִּיד לָנוּ
  choice: அவர் ... நமக்குச் சொல்வார்
  rationale: נגד என்பதன் Hiphil வடிவம் அறிவித்தல் அல்லது சொல்லுதல்; இக்கதைச் சூழலில் ‘சொல்வார்’ இயல்பானது.
- source_word: אֶת דַּרְכֵּנוּ
  choice: நாம் செல்லவேண்டிய வழி
  rationale: சொல்லெழுத்தான ‘நமது வழி’ என்பது செல்லும் பாதையையோ மேற்கொள்ளவேண்டிய நடவடிக்கையையோ குறிக்கலாம்; தமிழில் பொருள் விளங்க ‘நாம் செல்லவேண்டிய வழி’ என வழங்கப்பட்டுள்ளது, ambiguity அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
