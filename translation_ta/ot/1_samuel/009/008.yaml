  register: நவீனத் தரத் தமிழ்; கண்ணியமான, பொதுவாசகருக்கு எளிதில் புரியும் கதைநடை. ‘இதோ,’ ‘சேக்கல்,’ ‘இறைவனின் மனிதர்’ ஆகியவை மூலத்தின் சொல் வடிவத்தையும் பண்பாட்டு அமைப்பையும் பாதுகாக்கின்றன.
