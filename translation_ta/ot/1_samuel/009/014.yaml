base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/014.yaml
  text: So they went up to the city. As they were entering the city[a], behold, Samuel was coming out to meet them, to go up to the high place.
translation:
  language: ta
  text: அவர்கள் நகரத்திற்கு ஏறிச் சென்றார்கள். அவர்கள் நகருக்குள் நுழைந்துகொண்டிருந்தபோது[a], இதோ, சாமுவேல் அவர்களைச் சந்திக்க வெளியே வந்துகொண்டிருந்தார்; உயர்ந்த வழிபாட்டிடத்திற்குச் செல்ல.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நகரின் நடுவே வந்துகொண்டிருந்தபோது.” எபிரெயத்தில் சொற்பொருளாக, “நகரின் நடுவில்” என்று உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲלוּ
  choice: சென்றார்கள்
  rationale: עלה உயரமான இடத்தை நோக்கிய இயக்கத்தைக் குறிக்கிறது. தமிழில் ‘நகரத்திற்குச் சென்றார்கள்’ இயல்பாக உள்ளது; நிலத்தின் உயர்நோக்கிய இயக்கம் சூழலில் உணரப்படுகிறது.
- source_word: הָעִיר
  choice: நகரம்
  rationale: עיר என்பது நகரம் அல்லது ஊரைக் குறிக்கலாம்; இக்கதைச் சூழலில் ‘நகரம்’ நேரடியான, வழக்கமான மொழிபெயர்ப்பு.
- source_word: הֵמָּה בָּאִים
  choice: அவர்கள் ... நுழைந்துகொண்டிருந்தபோது
  rationale: தனிப்பட்ட சுட்டுப்பெயருடன் வரும் பங்கேற்புவினை தொடர்ந்துகொண்டிருந்த செயலைக் காட்டுகிறது; நகருக்குள் வரும் சூழலில் ‘நுழைந்துகொண்டிருந்தபோது’ இயல்பாக அதை வெளிப்படுத்துகிறது.
- source_word: בְּתוֹךְ הָעִיר
  choice: நகருக்குள்
  rationale: בתוך என்பதன் சொற்பொருள் ‘நடுவில்/உள்ளே’. இங்கு நகரின் சரியான மையப்பகுதியை அவசியம் குறிக்காமல், நகருக்குள் நுழைவதைக் குறிக்கும் இடவழக்காக இருக்கலாம்; சொற்பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: וְהִנֵּה
  choice: இதோ
  rationale: הנה திடீரெனக் கண்ணில் படும் முக்கிய காட்சியின்மேல் கவனத்தை ஈர்க்கிறது; ‘இதோ’ அதன் கதைசொல்லல் வலிமையைத் தக்கவைக்கிறது.
- source_word: יֹצֵא
  choice: வெளியே வந்துகொண்டிருந்தார்
  rationale: יצא வெளியே செல்லுதல் அல்லது வருதலைக் குறிக்கிறது; பங்கேற்புவினையின் தொடர்நிலையையும், சவுலையும் ஊழியனையும் நோக்கிய இயக்கத்தையும் இவ்வடிவம் காட்டுகிறது.
- source_word: לִקְרָאתָם
  choice: அவர்களைச் சந்திக்க
  rationale: לקראת என்பது ஒருவரை நோக்கிச் சென்று சந்திப்பதைக் குறிக்கிறது; ‘சந்திக்க’ இயல்பான தமிழ் இணை.
- source_word: לַעֲלוֹת
  choice: செல்லவிருந்தார்
  rationale: இது நோக்கத்தைக் காட்டும் வினையெச்சம். தமிழில் வாக்கியத் தொடர்பைத் தெளிவாக்க ‘செல்லவிருந்தார்’ என வழங்கப்படுகிறது; உயர்நோக்கிய இயக்கம் அடுத்த பெயர்ச்சொல் மொழிபெயர்ப்பில் வெளிப்படுகிறது.
- source_word: הַבָּמָה
  choice: மேட்டிலுள்ள வழிபாட்டிடம்
  rationale: במה என்பது வழிபாட்டுக்குரிய உயரமான இடம். ‘மேட்டிலுள்ள வழிபாட்டிடம்’ அதன் நிலவியல் மற்றும் வழிபாட்டு இயல்பை, இன்றைய வாசகருக்குப் புரியும் வகையில் தெரிவிக்கிறது.
theological_decisions:
- issue: במה என்னும் வழிபாட்டிடச் சொல்லின் மொழிபெயர்ப்பு
  choice: மேட்டிலுள்ள வழிபாட்டிடம்
  alternative: உயர்ந்த இடம்
  rationale: இங்கு அச்சொல் வெறும் உயரமான நிலப்பகுதியை அல்ல, அங்கீகரிக்கப்பட்ட வழிபாட்டிடத்தைக் குறிக்கிறது. ‘மேட்டிலுள்ள வழிபாட்டிடம்’ பிற்கால மதிப்பீட்டை வசனத்துக்குள் புகுத்தாமல் வரலாற்று-வழிபாட்டு பொருளைத் தெளிவாக்குகிறது.
translation_notes:
  register: நவீன தரத் தமிழ்; இயல்பான கதைநடை மற்றும் மரியாதை விகுதி பயன்படுத்தப்பட்டுள்ளன. ‘இதோ’ மூலம் எபிரெயக் கதைசொல்லலின் திடீர் கவனஈர்ப்பு பாதுகாக்கப்பட்டுள்ளது.
