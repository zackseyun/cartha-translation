  text: וְ/ל/וֹ הָיָ֨ה בֵ֜ן וּ/שְׁמ֤/וֹ שָׁאוּל֙ בָּח֣וּר וָ/ט֔וֹב וְ/אֵ֥ין אִ֛ישׁ מִ/בְּנֵ֥י יִשְׂרָאֵ֖ל ט֣וֹב מִמֶּ֑/נּוּ מִ/שִּׁכְמ֣/וֹ וָ/מַ֔עְלָ/ה גָּבֹ֖הַּ מִ/כָּל הָ/עָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/002.yaml
  text: And he had a son whose name was Saul[a], a young man and handsome. There was not a man among the sons of Israel more handsome than he[b]; from his shoulders upward he was taller than all the people.
translation:
  language: ta
  text: அவனுக்கு சவுல் என்ற பெயருடைய ஒரு மகன் இருந்தான். அவன் இளைஞனும் அழகானவனுமாய் இருந்தான். இஸ்ரவேல் மக்களில் அவனைவிட அழகான ஆண் ஒருவனும் இல்லை; அவன் தோள்முதல் மேலாக எல்லா மக்களையும்விட உயரமாய் இருந்தான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֵן
  choice: மகன்
  rationale: கீசின் நேரடியான ஆண் பிள்ளையைக் குறிக்கும் குடும்ப உறவுச் சொல்.
- source_word: וּשְׁמוֹ
  choice: என்ற பெயருடைய
  rationale: ‘அவன் பெயர்’ என்ற பொருளைத் தமிழில் இயல்பாக மகனுடன் இணைக்கிறது.
- source_word: שָׁאוּל
  choice: சவுல்
  rationale: தமிழ் வேதாகம மரபில் நிலைபெற்ற பெயரெழுத்தாக்கம்.
- source_word: בָּחוּר
  choice: இளைஞன்
  rationale: வாழ்க்கையின் இளமைப் பருவத்தில் உள்ள ஆணைக் குறிக்கும் இயல்பான நவீனத் தமிழ் சொல்.
- source_word: טוֹב / וָטוֹב
  choice: அழகானவன்
  rationale: அடுத்துவரும் ஒப்பீடும் உடல் உயரம் பற்றிய குறிப்பும் இங்கு உடல் தோற்றத்தின் சிறப்பைக் காட்டுகின்றன.
- source_word: וְאֵין אִישׁ מִבְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்களிடையே ... ஆண் ஒருவனும் இல்லை
  rationale: אִישׁ என்பதன் ஆண்பால் குறிப்பையும், ‘இஸ்ரவேலின் மகன்கள்’ என்ற எபிரேய மரபுத்தொடரின் சமூகப் பொருளையும் தெளிவாகத் தருகிறது.
- source_word: טוֹב מִמֶּנּוּ
  choice: அவனைவிட அழகான
  rationale: முந்தைய טוֹב சொல்லின் உடல் அழகு சார்ந்த பொருளை ஒப்பீட்டு வடிவில் தொடர்கிறது.
- source_word: מִשִּׁכְמוֹ וָמַעְלָה
  choice: அவன் தோள்களிலிருந்து மேலாக
  rationale: சவுல் மற்றவர்களைவிட ஒரு தலை உயரமாக இருந்ததைக் காட்சிப்படுத்தும் எபிரேய உடலளவு மரபுத்தொடரை நெருக்கமாகப் பாதுகாக்கிறது.
- source_word: גָּבֹהַּ
  choice: உயரமாய் இருந்தான்
  rationale: மக்களுடன் செய்யப்படும் ஒப்பீட்டில் உடல் உயரத்தைக் குறிக்கிறது.
- source_word: מִכָּל הָעָם
  choice: எல்லா மக்களையும்விட
  rationale: முழு மக்கள் கூட்டத்துடனான ஒப்பீட்டை இயல்பான தமிழில் தருகிறது.
