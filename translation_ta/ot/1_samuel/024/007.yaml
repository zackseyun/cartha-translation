base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/024/007.yaml
  text: And he said to his men[a], “Far be it from me, because of Yahweh, that I should do this thing to my lord, Yahweh’s anointed, to stretch out my hand against him, for he is Yahweh’s anointed.”
translation:
  language: ta
  text: அவன் தன் ஆட்களிடம், “யெகோவா முன்னிலையில், என் ஆண்டவராகிய யெகோவாவால் அபிஷேகம் செய்யப்பட்டவருக்கு எதிராக இப்படிச் செய்வது—அவர்மேல் என் கையை நீட்டுவது—எனக்கு ஒருபோதும் ஆகாத காரியம்.[a] ஏனெனில், அவர் யெகோவாவால் அபிஷேகம் செய்யப்பட்டவர்” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: மரபுவழியாக, “யெகோவா இதைத் தடுக்கட்டும்” என்றும் மொழிபெயர்க்கலாம். எபிரெய மரபுத்தொடர், யெகோவாவுடனான உறவை முன்னிட்டு அத்தகைய செயலைக் கடுமையாக மறுப்பதை வெளிப்படுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: חָלִילָה לִּי מֵיְהוָה
  choice: யெகோவாவை முன்னிட்டு ... எனக்கு வெகு தொலைவாக இருப்பதாக
  rationale: חָלִילָה என்பது ஓர் செயலைக் கடுமையாக அருவருத்து மறுக்கும் மரபுத்தொடர். מֵיְהוָה அந்த மறுப்பு யெகோவாவுடனான உறவையும் அவருக்குரிய பயபக்தியையும் சார்ந்தது என்பதைக் காட்டுகிறது; தமிழில் இயல்பாகப் புரிய ‘யெகோவாவை முன்னிட்டு’ என வழங்கப்பட்டது.
- source_word: אִם אֶעֱשֶׂה
  choice: இப்படிச் செய்வதும் ... எனக்கு வெகு தொலைவாக இருப்பதாக
  rationale: חָלִילָה என்பதற்குப் பின் אִם நிபந்தனையாக அல்ல, உறுதியான மறுப்பை வெளிப்படுத்தும் வகையில் வருகிறது. தமிழ் வாக்கிய அமைப்பில் அந்த வலுவான மறுப்பு பாதுகாக்கப்பட்டது.
- source_word: הַדָּבָר הַזֶּה
  choice: இப்படிச் செய்வது
  rationale: דבר இங்கு எண்ணப்பட்ட செயலைக் குறிக்கிறது; ‘இப்படிச் செய்வது’ என்பது சூழலுக்கு இயல்பாகவும் மிகைப்படுத்தாமலும் உள்ளது.
- source_word: לַאדֹנִי
  choice: என் ஆண்டவருக்கு எதிராக
  rationale: ஆדוֹן மரியாதையுடன் சவுலைக் குறிக்கிறது. செயல் அவருக்கு விரோதமானது என்பதால் இலக்கு/எதிர்நிலைச் சார்பு தமிழில் தெளிவாக்கப்பட்டுள்ளது.
- source_word: לִמְשִׁיחַ יְהוָה
  choice: யெகோவாவால் அபிஷேகம் செய்யப்பட்டவர்
  rationale: מָשִׁיחַ இங்கு யெகோவாவால் அரசராகத் திருநிலைப்படுத்தப்பட்ட சவுலைக் குறிக்கிறது. ‘மேசியா’ என்று வழங்குவது பிற்காலக் கிறிஸ்துவியல் பொருளைத் தேவையின்றி இங்கு கொண்டுவரக்கூடும்.
- source_word: לִשְׁלֹחַ יָדִי בּוֹ
  choice: அவர்மேல் என் கையை நீட்டுவது
  rationale: வன்முறைக்காக ஒருவருக்கு எதிராகக் கையை நீட்டும் எபிரெய உருவகம் தமிழிலும் இயல்பாகப் பாதுகாக்கப்பட்டுள்ளது.
- source_word: כִּי מְשִׁיחַ יְהוָה הוּא
  choice: ஏனெனில், அவர் யெகோவாவால் அபிஷேகம் செய்யப்பட்டவர்
  rationale: כִּי காரணத்தைக் காட்டுகிறது. எபிரெய மூலத்திலுள்ள பட்டத்தின் மறுபடியும் கூறுதல் அதன் வலியுறுத்தலைப் பாதுகாக்கிறது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: நான்கு எழுத்துத் திருப்பெயர் ஒரு பொதுப் பட்டமாக மாற்றப்படாமல், தமிழில் நிலைபெற்ற தனிப்பெயர் வடிவமான ‘யெகோவா’ என வழங்கப்பட்டுள்ளது.
theological_decisions:
- issue: சவுலைக் குறிக்கும் מְשִׁיחַ என்பதன் மொழிபெயர்ப்பு
  choice: யெகோவாவால் அபிஷேகம் செய்யப்பட்டவர்
  alternative: யெகோவாவின் மேசியா
  rationale: இங்கு அந்தச் சொல் யெகோவாவால் அரசராக அபிஷேகம் செய்யப்பட்ட சவுலின் நிலையைச் சுட்டுகிறது. ‘மேசியா’ என்ற வடிவம் சூழல் கோராத பிற்காலக் கிறிஸ்துவியல் தொடர்பை ஏற்படுத்தலாம்.
- issue: מֵיְהוָה காட்டும் தொடர்பு
  choice: யெகோவாவை முன்னிட்டு
  alternative: யெகோவா இதைத் தடுக்கட்டும்
  rationale: மூலச் சொற்றொடர் யெகோவாவைச் சார்ந்த பயபக்தியின் அடிப்படையில் தாவீது அந்தச் செயலை வன்மையாக மறுப்பதை வெளிப்படுத்துகிறது. யெகோவாவே நேரடியாகச் செயலைத் தடுக்கிறார் என்று மொழிபெயர்ப்பில் கூடுதலாகத் தீர்மானிக்கப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையும் வேதாகமச் செறிவும் காக்கப்பட்டுள்ளன. ‘என் ஆண்டவர்’, ‘அபிஷேகம் செய்யப்பட்டவர்’, ‘கையை நீட்டுவது’ ஆகியவை மூலத்தின் அரசியல்-புனிதப் பொருளையும் உருவகத்தையும் தக்கவைக்கின்றன.
