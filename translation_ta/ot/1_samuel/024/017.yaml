source:
  edition: WLC
  text: וַ/יְהִ֣י כְּ/כַלּ֣וֹת דָּוִ֗ד לְ/דַבֵּ֞ר אֶת הַ/דְּבָרִ֤ים הָ/אֵ֨לֶּה֙ אֶל שָׁא֔וּל וַ/יֹּ֣אמֶר שָׁא֔וּל הֲ/קֹלְ/ךָ֥ זֶ֖ה בְּנִ֣/י דָוִ֑ד וַ/יִּשָּׂ֥א שָׁא֛וּל קֹל֖/וֹ וַ/יֵּֽבְךְּ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/024/017.yaml
  text: When David had finished speaking these words to Saul[a], Saul said, “Is this your voice, my son David?” Then Saul lifted up his voice and wept.
translation:
  language: ta
  text: தாவீது சவுலிடம் இந்த வார்த்தைகளைப் பேசி முடித்தபோது, சவுல், “என் மகன் தாவீதே[a], இது உன் குரல்தானா?” என்று கேட்டான். பின்பு சவுல் குரலெழுப்பி அழுதான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தாவீதே, என் மகனே.”
    reason: எபிரேயச் சொல் வரிசையை நெருக்கமாகப் பிரதிபலிக்கும் மாற்று அழைப்புமுறை.
lexical_decisions:
- source_word: וַיְהִי כְּכַלּוֹת דָּוִד לְדַבֵּר
  choice: தாவீது … பேசி முடித்தபோது
  rationale: כְּ + infinitive construct உடன் வரும் temporal construction, தாவீதின் பேச்சு முடிந்ததைத் தொடர்ந்து அடுத்த நிகழ்வு நடந்ததைக் குறிக்கிறது. நவீன தமிழில் இயல்பான காலவாக்கியமாக மொழிபெயர்க்கப்பட்டது.
- source_word: אֶת־הַדְּבָרִים הָאֵלֶּה
  choice: இந்த வார்த்தைகளை
  rationale: இங்கு דְּבָרִים என்பது உடனடியாக முந்திய தாவீதின் பேச்சைக் குறிக்கிறது; ஆகவே ‘வார்த்தைகள்’ என்பது சூழலுக்குப் பொருத்தமானது.
- source_word: אֶל־שָׁאוּל
  choice: சவுலிடம்
  rationale: பேச்சின் இலக்கை இயல்பான நவீன தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: הֲקוֹלְךָ זֶה
  choice: இது உன் குரல்தானா?
  rationale: קוֹל என்பதன் ‘குரல்’ என்ற பொருளையும், זֶה என்பதன் அண்மைச் சுட்டையும், அடையாளம் காண முயலும் வினாவின் தன்மையையும் காக்கிறது.
- source_word: בְּנִי דָוִד
  choice: என் மகன் தாவீதே
  rationale: சவுலின் பாசமும் உணர்ச்சியும் கலந்த நேரடி அழைப்பை இயல்பான தமிழ் விளிவேற்றுமையில் தருகிறது.
- source_word: וַיִּשָּׂא שָׁאוּל קֹלוֹ וַיֵּבְךְּ
  choice: சவுல் குரலெழுப்பி அழுதான்
  rationale: ‘தன் குரலை உயர்த்தினான்’ என்ற எபிரேய மரபுத்தொடரைத் தமிழில் இயல்பான ‘குரலெழுப்பி’ எனக் கொடுத்து, בכה என்பதன் குறிப்பான ‘அழுதல்’ பொருளைக் காக்கிறது.
theological_decisions:
- issue: சவுல் தாவீதை ‘என் மகன்’ என்று அழைத்தல்
  choice: உறவுணர்வும் உணர்ச்சியும் கொண்ட நேரடி அழைப்பாக அப்படியே வைக்கப்பட்டது.
  alternative: அரசியல் ஆதரவு அல்லது பாதுகாவலர் உறவை மட்டும் குறிக்கும் பட்டமாக விளக்குதல்.
  rationale: எபிரேய உரை வெளிப்படையாக மகன் சார்ந்த உறவுமொழியைப் பயன்படுத்துகிறது. அது உயிரியல் மகன்தன்மையையோ தனிப்பட்ட ஒரு கோட்பாட்டையோ கட்டாயப்படுத்தாமல், உரையின் உணர்ச்சிசார் மற்றும் சமூக உறவுநயத்தைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியும் அதேவேளையில் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘குரலெழுப்பி அழுதான்’ என்பது எபிரேய மரபுத்தொடரின் உணர்ச்சி வலிமையை இயல்பான தமிழில் காக்கிறது.
