base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/024/008.yaml
  text: David restrained his men with words and did not allow them to rise up against Saul[a]. Then Saul rose from the cave and went on his way.
translation:
  language: ta
  text: தாவீது வார்த்தைகளால் தன் ஆட்களைத் தடுத்து, சவுலுக்கு எதிராக எழும்ப அவர்களை அனுமதிக்கவில்லை.[a] பின்பு சவுல் குகையிலிருந்து எழுந்து தன் வழியில் சென்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தாவீது தன் ஆட்களை வார்த்தைகளால் கடுமையாகக் கண்டித்தார்.” இங்குள்ள எபிரெய வினைச்சொல் அரிதானது; சாதாரணமாக ‘தடுத்தார்’ என்பதைக் காட்டிலும் வலுவான பொருள் இதற்கு இருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְשַׁסַּע
  choice: கடுமையாகத் தடுத்து
  rationale: இந்த அரிய எபிரெய வினைச்சொல் வெறுமனே தடுத்தல் என்பதைக் காட்டிலும் வலுவான கண்டிப்பு அல்லது அடக்குதலைக் குறிக்கக்கூடும். சூழலில் தாவீது தன் ஆட்கள் சவுல்மீது நடவடிக்கை எடுப்பதைத் தடுக்கிறார்; ஆகவே செயல்விளைவையும் வலிமையையும் வெளிப்படுத்தும் இத்தொடர் தேர்ந்தெடுக்கப்பட்டது.
- source_word: אֲנָשָׁיו
  choice: தன் ஆட்களை
  rationale: இங்கு இச்சொல் குகையில் தாவீதோடு இருந்த அவருடைய ஆண் ஆதரவாளர்களைக் குறிக்கிறது. நவீன தமிழில் “தன் ஆட்கள்” இயல்பாகவும் சூழலுக்குப் பொருத்தமாகவும் உள்ளது.
- source_word: בַּדְּבָרִים
  choice: வார்த்தைகளால்
  rationale: தாவீது அவர்களைத் தடுத்த வழிமுறையை இத்தொடர் குறிப்பிடுகிறது. கருவிப்பொருளைத் தெளிவாகப் பாதுகாக்க “வார்த்தைகளால்” என மொழிபெயர்க்கப்பட்டது.
- source_word: וְלֹא נְתָנָם
  choice: அவர்களை அனுமதிக்கவில்லை
  rationale: נתן என்பதுடன் வினையெச்சம் வரும் இக்கட்டமைப்பு அனுமதித்தல் அல்லது இடங்கொடுத்தல் என்ற பொருளைத் தருகிறது.
- source_word: לָקוּם אֶל־שָׁאוּל
  choice: சவுலுக்கு எதிராக எழும்ப
  rationale: பகைமைச் சூழலில் קום + אֶל என்பது ஒருவருக்கு எதிராக நடவடிக்கை எடுப்பதைக் குறிக்கிறது. “எதிராக எழும்ப” மூலத்தின் சொற்படிமத்தையும் பகைநிலையையும் பாதுகாக்கிறது.
- source_word: קָם מֵהַמְּעָרָה
  choice: குகையிலிருந்து எழுந்து
  rationale: முன்னர் வந்த קום என்ற அதே வினை மீண்டும் பயன்படுத்தப்படுவதை முடிந்தவரை காக்க “எழுந்து” தேர்ந்தெடுக்கப்பட்டது.
- source_word: וַיֵּלֶךְ בַּדָּרֶךְ
  choice: தன் வழியே சென்றார்
  rationale: சொல்லுக்கு சொல் “வழியில் சென்றார்” என்றாலும், இங்கு புறப்பட்டுத் தனது பயணத்தைத் தொடர்ந்தார் என்பதே இயல்பான பொருள். “தன் வழியே சென்றார்” அதைத் தெளிவாகத் தருகிறது.
