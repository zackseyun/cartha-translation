translation_notes:
  register: நவீன தரத் தமிழில் இயல்பான, கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. அரிய எபிரெய வினையின் வலிமை முதன்மை உரையில் “கடுமையாகத் தடுத்து” என்றும், அதன் மாற்றுச் சாத்தியம் அடிக்குறிப்பிலும் பாதுகாக்கப்பட்டுள்ளது. மூலத்தில் קום இருமுறை வருவதால் “எழும்ப / எழுந்து” என்ற மீளுரை தக்கவைக்கப்பட்டது.
