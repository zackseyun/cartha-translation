translation_notes:
  register: நவீனத் தரத் தமிழில், இயல்பானதும் கண்ணியமானதுமான நடையில் வடிவமைக்கப்பட்டது. மூல எபிரேயத்தின் ‘இதயம்’ உருவகம் முதன்மை உரையில் பாதுகாக்கப்பட்டு, அதன் கருத்து அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது. ‘தான்’ என்பது தாவீதே அந்தச் செயலைச் செய்தார் என்பதைத் தமிழில் தெளிவாக்குகிறது.
