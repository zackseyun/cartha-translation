  yaml_path: translation/ot/1_samuel/024/006.yaml
  text: Afterward David’s heart struck him because he had cut off the corner of Saul’s robe[a][b].
translation:
  language: ta
  text: அதன் பிறகு தாவீது சவுலின் மேலங்கியின் ஓரத்தை வெட்டியதால் அவரது இதயம் அவரை உறுத்தியது.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரேயத்தில், “தாவீதின் இதயம் அவரை அடித்தது”; இது அவரது மனசாட்சி அவரை உறுத்தியதைக் காட்டும் சொற்றொடர்.
    reason: lexical_alternative
  - marker: b
    text: “ஓரம்” என்பதற்கு “விளிம்பு” அல்லது “கடைப்பகுதி” என்றும் மொழிபெயர்க்கலாம்; எபிரேயச் சொல் ஓர் ஆடையின் விளிம்பு அல்லது கடைப்பகுதியைக் குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי אַחֲרֵי כֵן
  choice: அதன் பிறகு
  rationale: முந்தைய செயலுக்குப் பின் நிகழ்ந்ததை இயல்பான நவீனத் தமிழில் குறிக்கிறது; எபிரேயக் கதைசொல்லல் சூத்திரத்தைச் சொல்லுக்குச் சொல் பின்பற்றாமல் காலத் தொடர்ச்சியைப் பாதுகாக்கிறது.
- source_word: וַיַּךְ לֵב דָּוִד אֹתוֹ
  choice: தாவீதின் இதயம் அவரைக் குத்தியது
  rationale: ‘தாவீதின் இதயம் அவரை அடித்தது’ என்ற எபிரேய உருவகத்தைத் தமிழில் புரியக்கூடிய உயிருள்ள மொழியாகப் பாதுகாக்கிறது. ‘மனசாட்சி உறுத்தியது’ என்பது பொருளைத் தெளிவாக்கினாலும் மூலத்தின் ‘இதயம்’ என்ற உருவகத்தை மாற்றிவிடும்.
- source_word: לֵב
  choice: இதயம்
  rationale: இங்கு உள்ளார்ந்த ஒழுக்க உணர்வையும் குற்றவுணர்வையும் உள்ளடக்கினாலும், மூலத்தின் திடமான சொல்லையும் அதன் பரந்த பொருள் வாய்ப்பையும் பாதுகாக்க ‘இதயம்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: עַל אֲשֶׁר
  choice: வெட்டியதால்
  rationale: தாவீதின் உள்ளார்ந்த வேதனைக்கான காரணத்தைத் தமிழில் இயல்பான காரண வினையெச்சத்தால் தெரிவிக்கிறது.
- source_word: כָּרַת
  choice: வெட்டிய
  rationale: வெட்டி அகற்றுதல் என்ற செயலைச் சூழல் தெளிவுபடுத்துகிறது; தமிழின் வினையெச்ச அமைப்பு நிகழ்வுகளின் முன்-பின் தொடர்பை இயல்பாகக் காட்டுகிறது.
- source_word: כָּנָף
  choice: ஓரம்
  rationale: ஆடையின் முனை, விளிம்பு, ஓரம் ஆகியவற்றைக் குறிக்கக்கூடிய சொல்லாக இருப்பதால் ‘ஓரம்’ தேவையற்ற குறிப்பாக்கமின்றி பொருந்துகிறது.
- source_word: אֶת כָּנָף אֲשֶׁר לְשָׁאוּל
  choice: சவுலின் மேலங்கியின் ஓரம்
  rationale: எபிரேயத்தில் ஆடையின் பெயர் இவ்வசனத்தில் வெளிப்படையாக இல்லாமல் முந்தைய சூழலிலிருந்து பெறப்படுகிறது. தமிழில் குறிப்பைத் தெளிவாக்க ‘மேலங்கி’ சேர்க்கப்பட்டுள்ளது.
