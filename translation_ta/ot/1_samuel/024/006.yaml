- from: அதன் பிறகு, சவுலின் மேலங்கியின் ஓரத்தைத் தான் வெட்டியதால் தாவீதின் இதயம் அவரைக் குத்தியது.[a][b]
  to: அதன் பிறகு தாவீது சவுலின் மேலங்கியின் ஓரத்தை வெட்டியதால் அவரது இதயம் அவரை உறுத்தியது.[a][b]
  rationale: The revision removes unsupported emphasis, identifies David unambiguously as the one who cut the garment edge, and replaces the overly concrete “குத்தியது” with idiomatic “உறுத்தியது.” The Hebrew ‘heart’ remains explicit in the main text, while footnote a transparently records the literal striking imagery.
