  yaml_path: translation/ot/1_samuel/024/009.yaml
  text: After that David rose and went out of the cave[a], and called after Saul, saying, “My lord the king!” When Saul looked behind him, David bowed with his face to the ground and prostrated himself.
translation:
  language: ta
  text: அதற்குப் பிறகு தாவீது எழுந்து குகையிலிருந்து வெளியே வந்து, சவுலுக்குப் பின்னாலிருந்து, “ராஜாவாகிய என் ஆண்டவரே!” என்று கூப்பிட்டான். சவுல் தனக்குப் பின்னால் பார்த்தபோது, தாவீது முகத்தைத் தரையை நோக்கிக் குனிந்து, நெடுஞ்சாண்கிடையாக விழுந்து வணங்கினான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “நெடுஞ்சாண்கிடையாக விழுந்து வணங்கினான்” என்பதற்கு “ஆழமாகப் பணிந்தான்” என்றும் மொழிபெயர்க்கலாம். எபிரெய வினைச்சொல் ஆழ்ந்த பணிவையோ மரியாதையையோ குறிக்கக்கூடும்; இங்கு அது சவுலுக்கு முன்பாகத் தாவீது கொண்ட உடல் நிலையைக் குறிக்கிறது; இறைவழிபாட்டை அல்ல.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: எழுந்து
  rationale: קום என்பதன் இயல்பான கதைநடைப் பொருள் ‘எழுதல்’; செயற்பாட்டின் தொடர்ச்சியையும் இது தெளிவாகக் காட்டுகிறது.
- source_word: אַחֲרֵי כֵן
  choice: அதற்குப் பிறகு
  rationale: நிகழ்வுகளின் நேர வரிசையைக் குறிக்கும் எபிரெய மரபுத்தொடரை இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: וַיֵּצֵא מִן־הַמְּעָרָה
  choice: குகையிலிருந்து வெளியே வந்து
  rationale: יצא என்பதன் வெளியே செல்லுதல்/வருதல் என்ற பொருளைத் தமிழ்க் கதைநடைக்கு ஏற்றவாறு வெளிப்படுத்துகிறது.
- source_word: וַיִּקְרָא אַחֲרֵי שָׁאוּל
  choice: சவுலுக்குப் பின்னால் ... கூப்பிட்டான்
  rationale: அகன்று சென்றுகொண்டிருந்த சவுலுக்குப் பின்னிருந்து தாவீது உரக்க அழைத்ததை אַחֲרֵי உடன் வரும் קרא குறிக்கிறது.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: ராஜாவாகிய என் ஆண்டவரே
  rationale: אֲדֹנִי வெளிப்படுத்தும் தனிப்பட்ட மரியாதையையும் הַמֶּלֶךְ என்ற அரச பட்டத்தையும் இயல்பான தமிழில் பாதுகாக்கிறது.
- source_word: וַיַּבֵּט שָׁאוּל אַחֲרָיו
  choice: சவுல் தனக்குப் பின்னால் பார்த்தபோது
  rationale: נבט என்பதற்கு ‘பார்’ என்றும் אַחֲרָיו என்பதற்கு ‘தனக்குப் பின்னால்’ என்றும் நேரடியாகப் பொருள் தருகிறது; ‘திரும்பி’ என்பதை மூலத்தில் வெளிப்படையாக இல்லாததால் சேர்க்கவில்லை.
- source_word: וַיִּקֹּד
  choice: முகங்குனிந்து
  rationale: קדד குறிக்கும் உடலைக் குனியும் முதல் அசைவைத் தொடர்ந்து வரும் முழுமையான பணிவிழுதலிலிருந்து வேறுபடுத்திக் காட்டுகிறது.
- source_word: אַפַּיִם אַרְצָה
  choice: தரைமட்டும் முகங்குனிந்து
  rationale: சொல்லுக்கு நெருக்கமாக ‘முகம் தரையை நோக்கி’ எனும் ஆழ்ந்த பணிவுத் தோற்றத்தை இயல்பான தமிழில் தருகிறது.
- source_word: וַיִּשְׁתָּחוּ
  choice: நெடுஞ்சாண்கிடையாக விழுந்து வணங்கினான்
  rationale: שׁחה குறிக்கும் முழு உடலுடனான ஆழ்ந்த பணிவையும் மரியாதையையும் பாதுகாக்கிறது; முந்தைய קדד உடன் பொருள் ஒன்றிப்போவதைத் தவிர்க்கிறது.
theological_decisions:
- issue: சவுலுக்கு முன்பாகத் தாவீது செய்த ஆழ்ந்த வணக்கத்தின் தன்மை
  choice: மனித அரசருக்கு வெளிப்படுத்திய ஆழ்ந்த மரியாதை மற்றும் பணிவின் உடல் நிலை
  alternative: இறைவனை வழிபடுவதுபோல ‘வழிபட்டான்’ என்று மொழிபெயர்த்தல்
  rationale: இவ்வெபிரெய வினைச்சொல் சூழலுக்கு ஏற்ப கடவுளுக்கான வழிபாட்டையோ மனிதருக்கான ஆழ்ந்த மரியாதையையோ குறிக்கலாம். இங்கு செயல் சவுலை நோக்கியதால், அதன் உடல்சார்ந்த தீவிரத்தைப் பாதுகாத்து, தெய்வ வழிபாடு என்ற தவறான எண்ணத்தைத் தவிர்க்க வேண்டும்.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘ராஜாவாகிய என் ஆண்டவரே’ என்பது அரச மரியாதையைக் காக்கிறது; ‘நெடுஞ்சாண்கிடையாக’ என்பது ஆழ்ந்த உடல் பணிவைத் தெளிவாகக் காட்டினாலும், அடிக்குறிப்பு மாற்று இயல்பான சொல்லாக்கத்தையும் வழிபாடு சார்ந்த தவறான புரிதலைத் தவிர்க்கும் விளக்கத்தையும் தருகிறது.
