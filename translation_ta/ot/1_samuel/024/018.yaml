  text: וַ/יֹּ֨אמֶר֙ אֶל דָּוִ֔ד צַדִּ֥יק אַתָּ֖ה מִמֶּ֑/נִּי כִּ֤י אַתָּה֙ גְּמַלְתַּ֣/נִי הַ/טּוֹבָ֔ה וַ/אֲנִ֖י גְּמַלְתִּ֥י/ךָ הָ/רָעָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/024/018.yaml
  text: And he said to David[a], “You are more righteous than I, for you have repaid me with good, while I have repaid you with evil.”
translation:
  language: ta
  text: அவன் தாவீதிடம், “என்னைவிட நீ நீதிமான்[a]; ஏனெனில் நீ எனக்கு நன்மையே செய்தாய், ஆனால் நான் உனக்குத் தீமையே செய்தேன்” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என்னைவிட உன் பக்கமே நியாயம்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֶל־דָּוִד
  choice: அவன் தாவீதிடம் ... என்றான்
  rationale: எபிரெயக் கதைநடையின் இயல்பான இறந்தகால வடிவத்தைத் தமிழில் இயற்கையாகத் தருகிறது. சூழலில் பேசுகிறவன் சவுல் என்றாலும், மூல வாக்கியம் ‘அவன்’ என்றே கூறுவதால் அதையே பாதுகாக்கிறது.
- source_word: צַדִּיק אַתָּה מִמֶּנִּי
  choice: என்னைவிட நீ நீதிமான்
  rationale: צַדִּיק என்பதன் அறநெறி சார்ந்த ‘நீதியுள்ளவன்/சரியான தரப்பில் இருப்பவன்’ என்ற பொருளையும், מִן குறிக்கும் ஒப்பீட்டையும் சுருக்கமாகப் பாதுகாக்கிறது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: சவுலின் முந்தைய மதிப்பீட்டுக்கான காரணத்தை அறிமுகப்படுத்தும் விளக்கத் தொடர்பைத் தெளிவாகக் காட்டுகிறது.
- source_word: גְּמַלְתַּנִי הַטּוֹבָה
  choice: நீ எனக்கு நன்மை செய்தாய்
  rationale: גמל என்பதன் ஒருவரிடம் ஒரு விதமாக நடந்துகொள்வது அல்லது அவருக்குத் தக்கதைச் செய்வது என்ற பொருளை நவீனத் தமிழில் இயல்பாகத் தருகிறது; הַטּוֹבָה-வின் பரந்த ‘நன்மை’ பொருளையும் காக்கிறது.
- source_word: וַאֲנִי
  choice: ஆனால் நான்
  rationale: இரு இணை வாக்கியங்களுக்கிடையிலுள்ள வலுவான முரண்பாட்டை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: גְּמַלְתִּיךָ הָרָעָה
  choice: நான் உனக்குத் தீமை செய்தேன்
  rationale: முந்தைய கூறின் அமைப்பை மீண்டும் பயன்படுத்தி, ‘நன்மை/தீமை’ என்ற மூலத்தின் நேரடியான எதிர்மறை இணையைப் பாதுகாக்கிறது.
theological_decisions:
- issue: צַדִּיק என்பதன் பொருள்
  choice: நீதிமான்
  alternative: என்னைவிட உன் பக்கமே நியாயம்
  rationale: ‘நீதிமான்’ என்பது அறநெறி சார்ந்த வலிமையைப் பாதுகாக்கிறது; அடிக்குறிப்பு சூழ்நிலை சார்ந்த ‘நியாயம் உன் பக்கம்’ என்ற பொருளையும் திறந்துவைக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கதைநடை. ‘நன்மை செய்தாய் / தீமை செய்தேன்’ என்ற இணை அமைப்பு எபிரெயச் சொல்லாட்சியின் மறுமொழியையும் எதிர்மறையையும் இயல்பாகப் பிரதிபலிக்கிறது.
