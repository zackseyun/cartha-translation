base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/024/005.yaml
  text: Then David’s men said to him[a], “Look, this is the day of which Yahweh said to you, ‘Look, I am giving your enemy into your hand, and you may do to him as seems good in your eyes.’” Then David arose and secretly cut off the corner of Saul’s robe.
translation:
  language: ta
  text: அப்போது தாவீதின் ஆட்கள் அவரிடம், “இதோ, யாவே உன்னிடம், ‘இதோ, உன் பகைவனை உன் கையில் ஒப்புக்கொடுக்கிறேன்; உனக்குச் சரியெனத் தோன்றுவதை நீ அவனுக்குச் செய்யலாம்’ என்று சொன்ன நாள் இதுதான்” என்றார்கள். தாவீது எழுந்து, சவுலின் மேலங்கியின் ஓரத்தை இரகசியமாக வெட்டி எடுத்தார்.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “உனக்குச் சரியெனத் தோன்றுவதை” என்பது சொல்லுக்குச் சொல், “உன் கண்களில் நல்லதாக இருப்பதை” என்று பொருள்.
    reason: idiomatic_expression
  - marker: b
    text: “மேலங்கியின் ஓரம்” என்பது அதன் தொங்கும் முனை அல்லது விளிம்பையும் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ אַנְשֵׁי דָוִד אֵלָיו
  choice: அப்போது தாவீதின் ஆட்கள் அவரிடம் ... என்றார்கள்
  rationale: தொடர்கதை முன்னேற்றத்தை וַ־ குறிக்கிறது; ‘அப்போது’ இயல்பான தமிழ் தொடரோட்டத்தைத் தருகிறது. אַנְשֵׁי דָוִד என்பது தாவீதின் உடனிருந்த ஆட்களைக் குறிக்கிறது.
- source_word: הִנֵּה ... הִנֵּה
  choice: இதோ ... இதோ
  rationale: இருமுறை வரும் கவன ஈர்ப்பையும் வலியுறுத்தலையும் தமிழில் தெளிவாகப் பாதுகாக்கிறது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: இறைப் பெயரை ஒரு பொதுப்பட்டமாக மாற்றாமல், தமிழில் பரவலாக அறியப்பட்ட பெயர்வடிவில் தருகிறது.
- source_word: נֹתֵן אֶת־אֹיִבְךָ בְּיָדֶךָ
  choice: உன் பகைவனை உன் கையில் ஒப்புக்கொடுக்கிறேன்
  rationale: நிகழப்போகும் செயலை உயிரோட்டமாகக் காட்டும் பங்கேற்புவினையின் அம்சத்தையும், ஒருவரை மற்றொருவரின் அதிகாரத்தில் ஒப்படைக்கும் ‘கையில்’ என்ற எபிரெய உருவகத்தையும் காக்கிறது.
- source_word: וְעָשִׂיתָ לּוֹ
  choice: நீ அவனுக்குச் செய்யலாம்
  rationale: இச்சூழலில் கட்டளையைவிட அனுமதிக்கப்பட்ட செயலைக் குறிக்கும் பொருளைத் தருகிறது; ஒருமைச் சுட்டு சவுலைக் குறிக்கிறது.
- source_word: כַּאֲשֶׁר יִטַב בְּעֵינֶיךָ
  choice: உன் பார்வைக்கு நல்லதாகத் தோன்றுவதை
  rationale: ‘உன் கண்களில் நல்லது’ என்ற எபிரெய மரபுத்தொடரின் உருவகத்தை ஓரளவு காத்தபடியே நவீன தமிழில் புரியும்படி மொழிபெயர்க்கிறது.
- source_word: וַיָּקָם דָּוִד
  choice: தாவீது எழுந்து
  rationale: செயல் வரிசையைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: וַיִּכְרֹת אֶת־כְּנַף הַמְּעִיל אֲשֶׁר לְשָׁאוּל בַּלָּט
  choice: சவுலின் மேலங்கியின் ஓரத்தை இரகசியமாக வெட்டி எடுத்தார்
  rationale: כָּנָף என்பது ஆடையின் ஓரம் அல்லது தொங்கும் முனை; בַּלָּט என்பது மறைவாக அல்லது இரகசியமாகச் செய்ததைக் குறிக்கிறது. ‘வெட்டி எடுத்தார்’ என்பது துண்டைப் பிரித்த செயலைத் தெளிவாக்குகிறது.
theological_decisions:
- issue: யெகோவா இதற்கு முன் உண்மையில் இப்படிக் கூறியிருந்தாரா, அல்லது தாவீதின் ஆட்கள் சூழ்நிலையை அவ்வாறு விளக்கினார்களா?
  choice: ஆட்களின் கூற்றை நேரடி மேற்கோளாக அப்படியே அறிக்கையிடுதல்
  alternative: இது ஆட்களின் விளக்கம் மட்டுமே என்று வெளிப்படையாகத் தள்ளிவைக்கும் விதத்தில் உரைமாற்றுதல்
  rationale: எபிரெய உரை தாவீதின் ஆட்கள் சொன்னதை மட்டும் பதிவு செய்கிறது; அவர்களின் கூற்றை உரையாளர் உறுதிப்படுத்தவும் மறுக்கவும் இல்லை. ஆகவே அந்த இறையியல் பதற்றம் தீர்க்கப்படாமல் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், மரியாதையும் கதைநடையின் வேகமும் காக்கப்பட்டுள்ளன. நேரடி உரையில் ஒருமை இரண்டாம் நபர் வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன; தேவையற்ற சமயக்குழுச் சொற்கள் தவிர்க்கப்பட்டுள்ளன.
