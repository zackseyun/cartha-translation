  text: May the LORD be judge and decide between me and you, see and plead my case, and vindicate me from your hand.
translation:
  language: ta
  text: ஆண்டவர் நீதிபதியாயிருந்து எனக்கும் உமக்கும் இடையே தீர்ப்பளிப்பாராக. அவர் என் நிலையைப் பார்த்து, என் வழக்கை வாதாடி, உமது கையிலிருந்து என்னை மீட்டு எனக்கு நீதி வழங்குவாராக.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: ஆண்டவர்
  rationale: இஸ்ரவேலின் இறைவனுடைய தனிப்பெயரைக் குறிக்கும் இடத்தில், நவீனத் தமிழில் மரியாதையுடனும் இயல்பாகவும் பயன்படும் மரபுவழிப் பதிப்பு.
- source_word: לְדַיָּן
  choice: நடுவராக
  rationale: நீதித் தீர்ப்பு வழங்குபவர் என்ற சட்டவியல் பொருளைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: וְשָׁפַט בֵּינִי וּבֵינֶךָ
  choice: எனக்கும் உமக்கும் இடையே தீர்ப்பளிப்பாராக
  rationale: இரு தரப்பினருக்கிடையே தீர்மானிப்பது என்ற எபிரெயச் சொற்றொடரின் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: וְיֵרֶא
  choice: என் நிலையைப் பார்த்து
  rationale: தனியாக ‘பார்த்து’ என்பது தமிழில் முழுமையற்றதாக ஒலிப்பதால், வழக்கின் சூழலைக் குறிக்கும் ‘என் நிலையை’ சேர்த்து இயல்பாக்கப்பட்டுள்ளது; இறைவன் வழக்கை ஆராய்வது என்ற கருத்து காக்கப்படுகிறது.
- source_word: וְיָרֵב אֶת־רִיבִי
  choice: என் வழக்கை நடத்தி
  rationale: ריב என்ற சொல்லின் ‘வழக்கு/வாதம்’ பொருளையும், அதை ஒருவருக்காக முன்னெடுப்பது என்ற வினையின் சட்டவியல் நுணுக்கத்தையும் காக்கிறது.
- source_word: וְיִשְׁפְּטֵנִי מִיָּדֶךָ
  choice: உமது கையிலிருந்து என்னை விடுவிக்கும் தீர்ப்பை வழங்குவாராக
  rationale: சொல்லுக்கு சொல் ‘உமது கையிலிருந்து என்னை நியாயந்தீர்ப்பாராக’ என்பது தமிழில் தெளிவற்றது. நீதித் தீர்ப்பின் மூலம் எதிரியின் அதிகாரத்திலிருந்து விடுவித்து நியாயம் வழங்குதல் என்ற பொருளை வெளிப்படுத்துகிறது.
theological_decisions:
- issue: இறைவன் நீதிபதியாகவும் வழக்கை முன்னெடுப்பவராகவும் வர்ணிக்கப்படுதல்
  choice: ‘நடுவராக’, ‘என் வழக்கை நடத்தி’ என்ற இரு நீதிமன்ற உருவகங்களும் காக்கப்பட்டன.
  alternative: இரண்டையும் பொதுவாக ‘எனக்கு நீதி செய்வாராக’ என்று சுருக்குதல்.
  rationale: மூலத்தில் உள்ள மாறுபட்ட நீதிமன்றப் பங்குகளையும் அவற்றுக்கிடையிலான இயல்பான இறையியல் பதற்றத்தையும் ஒன்றாக்காமல் பாதுகாக்கிறது.
- issue: מִיָּדֶךָ என்பதன் பொருள்
  choice: ‘உமது கையிலிருந்து என்னை விடுவிக்கும் தீர்ப்பு’
  alternative: ‘உமக்கு எதிராக எனக்கு நீதி வழங்குதல்’
  rationale: ‘கை’ என்பது அதிகாரம் அல்லது பிடியைக் குறிக்கும் எபிரெய மரபுத்தொடர்; அதேவேளையில் தீர்ப்பளித்தல் என்ற மூலத்தின் சட்டவியல் கருத்தும் விடப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், அரசனிடம் பேசும் சூழலுக்கேற்ற மரியாதை ஒருமை (‘உமக்கும்’, ‘உமது’) பயன்படுத்தப்பட்டுள்ளது. நடை கண்ணியமானது, ஆனால் சாதாரண வாசகருக்கும் எளிதில் புரியும்படி அமைக்கப்பட்டுள்ளது.
