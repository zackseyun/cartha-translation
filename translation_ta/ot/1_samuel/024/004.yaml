  yaml_path: translation/ot/1_samuel/024/004.yaml
  text: He came to the sheepfolds by the road[a], where there was a cave, and Saul went in to relieve himself. Now David and his men were sitting in the innermost parts of the cave.
translation:
  language: ta
  text: 'சவுல் வழியோரத்தில் உள்ள ஆட்டுத் தொழுவங்களிடம் வந்தார்; அங்கே ஒரு குகை இருந்தது. மலம் கழிக்க சவுல் அந்தக் குகைக்குள் சென்றார்.[a] தாவீதும் அவருடைய ஆட்களும் குகையின் மிக உட்புறமான பகுதிகளில் அமர்ந்திருந்தார்கள்.


    [a] எபிரெய மொழியில், “தன் கால்களை மூடுவதற்கு” என்று சொல்லப்பட்டுள்ளது; இது மலம் கழிப்பதைக் குறிக்கும் ஓர் எபிரெய மரபுத்தொடர்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மொழியில், “தன் கால்களை மூடுவதற்கு” என்று சொல்லப்பட்டுள்ளது; இது மலம் கழிப்பதைக் குறிக்கும் ஓர் எபிரெய மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: גִּדְרוֹת הַצֹּאן
  choice: ஆட்டுத் தொழுவங்கள்
  rationale: இச்சொற்றொடர் ஆடுகளை அடைத்து வைக்கும் வேலியிட்ட இடங்களைக் குறிக்கிறது. “ஆட்டுத் தொழுவங்கள்” என்பது காட்சியின் தெளிவான பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: עַל הַדֶּרֶךְ
  choice: வழியோரமிருந்த
  rationale: ஆட்டுத் தொழுவங்கள் சவுல் சென்ற பாதையின் அருகே இருந்தன என்ற இடத்தொடர்பைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: מְעָרָה
  choice: ஒரு குகை
  rationale: மூலச்சொல்லின் வழக்கமான, நேரடியான பொருள்.
- source_word: לְהָסֵךְ אֶת רַגְלָיו
  choice: மலங்கழிப்பதற்காக
  rationale: “கால்களை மூடுதல்” என்ற எபிரெய மரபுத்தொடரின் சூழல்சார் பொருளை நவீன வாசகர்களுக்குத் தெளிவாகவும் தேவையற்ற கடுமையின்றியும் தெரிவிக்கிறது; சொற்பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: בְּיַרְכְּתֵי הַמְּעָרָה
  choice: குகையின் மிக உட்புறமான பகுதிகளில்
  rationale: குகையின் தொலைவான, ஆழமான உட்பகுதிகளைக் குறிக்கும் இடவியல் வலிமையைப் பாதுகாக்கிறது.
- source_word: יֹשְׁבִים
  choice: அமர்ந்திருந்தார்கள்
  rationale: இங்கு நீண்டகாலக் குடியிருப்பைக் காட்டாமல், அந்த நேரத்தில் அவர்களுடைய நிலைப்பாட்டையும் இருப்பிடத்தையும் குறிக்கிறது.
- source_word: וַיָּבֹא ... וַיָּבֹא
  choice: வந்தார் ... சென்றார்
  rationale: முதல் வினை பயணத்தின் தொடர்ச்சியையும் இரண்டாவது வினை குகைக்குள் நுழைந்ததையும் இயல்பான தமிழில் வேறுபடுத்திக் காட்டுகிறது.
