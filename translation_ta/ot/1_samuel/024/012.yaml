source:
  edition: WLC
  text: וְ/אָבִ֣/י רְאֵ֔ה גַּ֗ם רְאֵ֛ה אֶת כְּנַ֥ף מְעִילְ/ךָ֖ בְּ/יָדִ֑/י כִּ֡י בְּ/כָרְתִ/י֩ אֶת כְּנַ֨ף מְעִֽילְ/ךָ֜ וְ/לֹ֣א הֲרַגְתִּ֗י/ךָ דַּ֤ע וּ/רְאֵה֙ כִּי֩ אֵ֨ין בְּ/יָדִ֜/י רָעָ֤ה וָ/פֶ֨שַׁע֙ וְ/לֹא חָטָ֣אתִי לָ֔/ךְ וְ/אַתָּ֛ה צֹדֶ֥ה אֶת נַפְשִׁ֖/י לְ/קַחְתָּֽ/הּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/024/012.yaml
  text: And[a], my father, see—yes, see the corner of your robe in my hand. For when I cut off the corner of your robe[b], I did not kill you. Know and see that there is no evil or transgression in my hand, and I have not sinned against you[c], though you are hunting my life to take it.
translation:
  language: ta
  text: “என் தந்தையே, பாருங்கள்—ஆம், என் கையில் இருக்கும் உங்கள் மேலங்கியின் ஓரத்தைப் பாருங்கள். உங்கள் மேலங்கியின் ஓரத்தை நான் வெட்டியபோதும் உங்களைக் கொல்லவில்லை. என் கையில் தீமையோ கலகமோ இல்லை என்பதையும், நான் உங்களுக்கு எதிராகப் பாவம் செய்யவில்லை என்பதையும் அறிந்து பாருங்கள். ஆனால் நீங்களோ என் உயிரை வேட்டையாடுகிறீர்கள்; அதை எடுத்துக்கொள்ளவே.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאָבִי
  choice: என் தந்தையே
  rationale: சவுலைத் தாவீது மரியாதையுடனும் உறவுசார் அரசியல் பணிவுடனும் அழைப்பதைப் பாதுகாக்கிறது; தொடக்க וְ உரையாடல் தொடர்ச்சியைச் சுட்டுவதால் தமிழில் தனியாக ‘மேலும்’ என்று மொழிபெயர்க்கப்படவில்லை.
- source_word: רְאֵה גַּם רְאֵה
  choice: பாருங்கள்—ஆம், ... பாருங்கள்
  rationale: இருமுறை வரும் கட்டளையையும் גַּם தரும் வலியுறுத்தலையும் இயல்பான நவீனத் தமிழில் பாதுகாக்கிறது.
- source_word: כְּנַף מְעִילְךָ
  choice: உங்கள் மேலங்கியின் ஓரம்
  rationale: כָּנָף ஆடையின் விளிம்பு, ஓரம் அல்லது மூலையைக் குறிக்கலாம்; இங்கு ‘ஓரம்’ தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: בְּיָדִי
  choice: என் கையில்
  rationale: தாவீது காட்டும் பொருள்சார் சான்றையும், பின்னர் வரும் செயற்பாடு/குற்றமின்மை சார்ந்த சொல்லாட்சியுடனான தொடர்பையும் பாதுகாக்கிறது.
- source_word: וְלֹא הֲרַגְתִּיךָ
  choice: உங்களைக் கொல்லவில்லை
  rationale: எளிய மறுப்பு வினையைத் தெளிவான நவீனத் தமிழில் நேரடியாகத் தருகிறது.
- source_word: דַּע וּרְאֵה
  choice: அறிந்து பாருங்கள்
  rationale: சான்றைக் கண்டு அதன் ஒழுக்கநெறி சார்ந்த முடிவை உணருமாறு அழைக்கும் இரு எபிரெய வினைகளையும் வைத்திருக்கிறது.
- source_word: אֵין בְּיָדִי רָעָה וָפֶשַׁע
  choice: என் கையில் தீமையோ கலகமோ இல்லை
  rationale: ‘என் கையில்’ என்ற உருவகத்தைத் தக்கவைக்கிறது. פֶשַׁע குற்றமீறலையும் அரசனுக்கு எதிரான கலகத்தையும் குறிக்கக்கூடியதால், சூழலின் அரசியல் பரிமாணத்திற்காக ‘கலகம்’ தேர்ந்தெடுக்கப்பட்டுள்ளது; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: וְלֹא חָטָאתִי לָךְ
  choice: நான் உங்களுக்கு எதிராகப் பாவம் செய்யவில்லை
  rationale: ஒரு நபருக்கு எதிரான ஒழுக்க மற்றும் சமயக் குற்றத்தைச் சுட்டும் חטא לְ கட்டமைப்பின் கனத்தைப் பாதுகாக்கிறது.
- source_word: וְאַתָּה צֹדֶה אֶת נַפְשִׁי לְקַחְתָּהּ
  choice: நீங்களோ என் உயிரைப் பறிப்பதற்காக என்னை வேட்டையாடுகிறீர்கள்
  rationale: צדה என்பதன் வேட்டை உருவகத்தை இயல்பான தமிழில் வைத்துக்கொண்டு, נֶפֶשׁ இங்கு உயிரைக் குறிக்கிறது என்பதையும் தெளிவுபடுத்துகிறது.
theological_decisions:
- issue: פֶשַׁע என்பதன் ஒழுக்க-அரசியல் நுணுக்கம்
  choice: கலகம்
  alternative: மீறுதல் / குற்றம்
  rationale: தாவீது பொதுவான தீச்செயலை மட்டுமல்ல, அபிஷேகம் செய்யப்பட்ட அரசனுக்கு எதிரான துரோக அல்லது கலக நோக்கத்தையும் மறுக்கிறார். இருப்பினும் சொல்லின் பரந்த குற்றமீறல் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: சவுலுக்கு எதிராகத் தாவீது செய்ததாகக் கூறப்படும் חטא
  choice: உங்களுக்கு எதிராகப் பாவம் செய்யவில்லை
  alternative: உங்களுக்குத் தீங்கு செய்யவில்லை
  rationale: மூலத்தின் ஒழுக்க-இறையியல் கனத்தைத் தளர்த்தாமல், குற்றம் ஒரு நபருக்கு எதிரானது என்பதைத் தெளிவாகக் காட்டுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் மரியாதைப் பன்மை பயன்படுத்தப்பட்டுள்ளது. தாவீதின் பணிவும் வலியுறுத்தலும் காக்கப்பட்டுள்ளன; வேட்டை உருவகம், ‘என் கையில்’ என்ற மீளுருவாக்கம், பாவம் மற்றும் கலகம் சார்ந்த ஒழுக்க-அரசியல் பதற்றம் ஆகியவை எளிமைப்படுத்தப்படாமல் தக்கவைக்கப்பட்டுள்ளன.
