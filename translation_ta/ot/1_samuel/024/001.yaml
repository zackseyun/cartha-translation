base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/024/001.yaml
  text: Then David went up from there and stayed in the strongholds of En-gedi.
translation:
  language: ta
  text: பின்பு தாவீது அங்கிருந்து மேலே சென்று, என்கேதியிலுள்ள பாதுகாப்பான அரணிடங்களில் தங்கினார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַל
  choice: மேலே சென்று
  rationale: עלה மேல்நோக்கிய நகர்வைக் குறிக்கிறது; தமிழில் இயல்பான கதைநடையுடன் அதன் திசை உணர்வையும் இது காக்கிறது.
- source_word: מִשָּׁם
  choice: அங்கிருந்து
  rationale: இடத்தைக் குறிக்கும் இந்தச் சொல்லுக்கு ‘அங்கிருந்து’ என்பது இயல்பானதும் துல்லியமானதுமான தமிழ் இணை.
- source_word: וַיֵּשֶׁב
  choice: தங்கினார்
  rationale: ישב என்பதற்கு உட்காருதல், குடியிருத்தல், தங்குதல் ஆகிய பொருள்கள் உண்டு; இங்குள்ள இடமாற்றக் கதைச்சூழலில் நிரந்தரக் குடியேற்றத்தை உணர்த்தாமல் தற்காலிகமாகத் தங்கியதை இது தெரிவிக்கிறது.
- source_word: בִּמְצָדוֹת
  choice: அரணான இடங்களில்
  rationale: מצדות பாதுகாப்பளிக்கும் உறுதியான இடங்களைக் குறிக்கிறது; கட்டப்பட்ட கோட்டைகள் என்று தேவையின்றி வரையறுக்காமல், இயற்கையான அல்லது அமைக்கப்பட்ட பாதுகாப்பிடங்கள் என்ற பரப்பை இந்த மொழிபெயர்ப்பு காக்கிறது.
- source_word: עֵין גֶּדִי
  choice: என்கேதி
  rationale: இது ஓர் இடப்பெயர்; ஆகவே பொருள் மொழிபெயர்ப்பு செய்யாமல், நவீனத் தமிழில் வாசிக்க ஏற்றவாறு ஒலிபெயர்க்கப்பட்டுள்ளது.
theological_decisions: []
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிதாகப் புரியும், கண்ணியமான கதைநடை. ‘அரணான இடங்கள்’ என்பது மனிதர் கட்டிய கோட்டைகளை மட்டும் குறிப்பதாகச் சுருக்காமல் எபிரேயச் சொல்லின் பொருள் அகலத்தைப் பாதுகாக்கிறது.
