  terminology: ‘தாவீது,’ ‘அங்கிருந்து,’ ‘மேலே சென்று,’ ‘தங்கினார்,’ and ‘என்கேதி’ are suitable. ‘அரணிடங்கள்’ retains the defensive sense of מְצָדוֹת while leaving open whether the places were natural or built.
