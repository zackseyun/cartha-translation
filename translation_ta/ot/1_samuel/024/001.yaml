  source_fidelity: 'The draft preserves the sequence and all principal Hebrew elements: David goes up from there, remains/stays, and the location is the strongholds of En-gedi. The plural sense of מְצָדוֹת is retained. A slight wording revision makes the stronghold/refuge sense clearer without implying only constructed fortresses.'
