base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/024/020.yaml
  text: For when a man finds his enemy and lets him go on his way safely[b][a], may Yahweh repay you with good for what you have done to me this day.
translation:
  language: ta
  text: ஒருவன் தன் பகைவனைக் கண்டால், அவனைப் பாதுகாப்பாக வழியனுப்புவானா?[a] இன்று நீ எனக்குச் செய்ததற்காக யாவே உனக்கு நன்மையால் கைம்மாறு செய்வாராக![b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஒருவன் தன் பகைவனைக் கண்டால், அவனை நல்ல வழியில் அனுப்பிவிடுவானா?” எபிரெயத்தில் சொல்லுக்குச் சொல், “ஒரு நல்ல வழியில் அனுப்புகிறான்.” இங்கு அது பாதுகாப்பாக அல்லது சமாதானமாக விடுவிப்பதைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “யாவே உனக்கு நன்மையால் கைம்மாறு செய்வார்.” எபிரெய வினைவடிவத்தை வேண்டுதல் அல்லது ஆசீர்வாதமாகவும், எதிர்காலத்தைப் பற்றிய உறுதிக்கூற்றாகவும் புரிந்துகொள்ளலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: וְכִי
  choice: ஒருவன் ... கண்டால், ... வழியனுப்புவானா?
  rationale: 'இங்கு சவுலின் பொதுவான கூற்று இயல்பாக ஒரு வினாவியல் வாக்கியமாக ஒலிக்கிறது: பகைவனைத் தன் வசத்தில் கண்டவன் வழக்கமாக அவனைப் பாதுகாப்பாக அனுப்பமாட்டான். எபிரெய வடிவத்தில் வினாவைக் குறிக்கும் தனிச்சொல் இல்லாததால், அதன் சாத்தியமான கூற்று நயத்தை அடிக்குறிப்பு சுட்டுகிறது.'
- source_word: יִמְצָא אִישׁ
  choice: ஒருவன் ... கண்டால்
  rationale: אִישׁ ஒருமை ஆண்பால் வடிவமாயினும் இங்கு பொதுப்பொருளில் உள்ளது. நவீன தமிழில் “ஒருவன்” மூலத்தின் ஒருமை வடிவத்தையும் பொதுவான மனிதரைக் குறிக்கும் நயத்தையும் இயல்பாகத் தக்கவைக்கிறது.
- source_word: אֶת אֹיְבוֹ
  choice: தன் பகைவனை
  rationale: மூன்றாம் நபர் ஒருமை உடைமைத் தொடர்பை தமிழில் இயல்பாக “தன்” என்பதால் காட்டுகிறது.
- source_word: וְשִׁלְּחוֹ בְּדֶרֶךְ טוֹבָה
  choice: அவனைப் பாதுகாப்பாக வழியனுப்புவானா?
  rationale: சொல்லுக்குச் சொல் “ஒரு நல்ல வழியில் அனுப்புதல்” என்ற உருவகத்தைக் கொண்டிருந்தாலும், சூழலில் தீங்கு செய்யாமல் பாதுகாப்பாக விடுவிப்பதே பொருள். “வழியனுப்பு” பாதை உருவகத்தையும் விடுவிக்கும் செயலையும் இணைக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இது பட்டப்பெயர் அல்ல, இஸ்ரவேலின் தேவனுடைய தனிப்பெயரான நான்கு எழுத்துப் பெயர். அதனை தமிழில் ஒலிபெயர்த்து வழங்குகிறது.
- source_word: יְשַׁלֶּמְךָ טוֹבָה
  choice: உனக்கு நன்மையால் கைம்மாறு செய்வாராக
  rationale: שׁלם வேரின் ஈடுசெய்தல் அல்லது கைம்மாறு செய்தல் என்ற நயத்தையும், טוֹבָה என்பதன் நன்மையான பலனையும் தக்கவைக்கிறது. “செய்வாராக” இதை ஆசீர்வாத வேண்டுதலாகக் காட்டுகிறது.
- source_word: תַּחַת הַיּוֹם הַזֶּה אֲשֶׁר עָשִׂיתָה לִי
  choice: இன்று நீ எனக்குச் செய்ததற்காக
  rationale: சொல்லுருவில் உள்ள பதிலீடு அல்லது பிரதிபலன் நயம் தமிழில் இயல்பான காரண-கைம்மாறு அமைப்பாக மொழிபெயர்க்கப்படுகிறது; “எனக்கு” என்பதும் “இன்று” என்பதும் தக்கவைக்கப்படுகின்றன.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரின் மொழியாக்கம்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் பொதுவான ஆண்டவர் என்ற பட்டப்பெயர் அல்ல, தேவனுடைய தனிப்பெயர் நேரடியாக உள்ளது; ஆகவே பட்டப்பெயரால் மாற்றாமல் ஒலிபெயர்க்கப்பட்டது.
- issue: יְשַׁלֶּמְךָ என்பதன் ஆசீர்வாத அல்லது முன்னறிவிப்பு நயம்
  choice: கைம்மாறு செய்வாராக
  alternative: கைம்மாறு செய்வார்
  rationale: சவுலின் பேச்சில் இது வேண்டுதல் அல்லது ஆசீர்வாதமாக இயல்பாகப் புரிகிறது. எனினும் எபிரெய yiqtol வடிவம் எதிர்கால உறுதிக்கூற்றாகவும் கேட்கக்கூடியதால் மாற்று அடிக்குறிப்பில் தரப்பட்டது.
- issue: முதல் கூறின் வினாவியல் நயம்
  choice: வழியனுப்புவானா?
  alternative: வழியனுப்புகிறான்
  rationale: சூழலில் இது தாவீதின் அசாதாரண இரக்கத்தை வலியுறுத்தும் வினாவியல் கூற்றாக நன்றாகப் பொருந்துகிறது. ஆயினும் וְכִי தொடர் விளக்கமான பொதுக்கூற்றாகவும் வாசிக்கப்படலாம்; அந்தத் தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்பட்டது.
translation_notes:
  register: நவீனத் தரத் தமிழில், மரியாதையும் உரையாடல் இயல்பும் கொண்ட நடை பயன்படுத்தப்பட்டுள்ளது. “பாதுகாப்பாக வழியனுப்பு” என்பது எபிரெயப் பாதை உருவகத்தை ஓரளவு காத்தபடி சூழலின் பாதுகாப்பான விடுதலைப் பொருளைத் தெளிவாக்குகிறது. யாவே என்பதற்கு மரியாதைப் பன்மை வினைமுற்று பயன்படுத்தப்பட்டுள்ளது.
