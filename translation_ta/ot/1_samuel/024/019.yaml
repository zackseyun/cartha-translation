source:
  edition: WLC
  text: ו/את הִגַּ֣דְתָּ הַ/יּ֔וֹם אֵ֛ת אֲשֶׁר עָשִׂ֥יתָה אִתִּ֖/י טוֹבָ֑ה אֵת֩ אֲשֶׁ֨ר סִגְּרַ֧/נִי יְהוָ֛ה בְּ/יָדְ/ךָ֖ וְ/לֹ֥א הֲרַגְתָּֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/024/019.yaml
  text: 'And you have declared today what good you have done to me: when Yahweh gave me into your hand[b][a], you did not kill me.'
translation:
  language: ta
  text: 'நீ இன்று எனக்குச் செய்த நன்மையை வெளிப்படுத்தியிருக்கிறாய்: யாவே என்னை உன் கையில் ஒப்புக்கொடுத்தபோது[a], நீ என்னைக் கொல்லவில்லை.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ஒப்புக்கொடுத்தார்” என்பதற்கு “கையளித்தார்” அல்லது “வசப்படுத்தினார்” என்றும் மொழிபெயர்க்கலாம். எபிரெய வினைச்சொல்லுக்கு “அடைத்தார்” என்ற அடிப்படைப் பொருளும் உண்டு; இங்கு சூழலுக்கு ஏற்ப யாரையாவது மற்றொருவரின் அதிகாரத்தில் ஒப்படைத்தல் என்ற பொருள் வருகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִגַּדְתָּ
  choice: தெரியப்படுத்தியிருக்கிறாய்
  rationale: נגד என்பதன் ஹிஃபில் வடிவம் பொதுவாக ‘அறிவி, தெரியப்படுத்து’ எனப் பொருள்படும். இங்கு தாவீதின் செயல் சவுலுக்கு அவர் செய்த நன்மையை வெளிப்படையாகக் காட்டியதையும் உள்ளடக்குகிறது.
- source_word: הַיּוֹם
  choice: இன்று
  rationale: இயல்பான நவீனத் தமிழில் நேரடியாகக் காலத்தைக் குறிக்கிறது.
- source_word: עָשִׂיתָה אִתִּי טוֹבָה
  choice: நீ எனக்கு எவ்வாறு நன்மை செய்தாய் என்பதை
  rationale: எபிரெயச் சொற்றொடரின் ‘என்னுடன்/எனக்கு நன்மை செய்தாய்’ என்ற பொருளை இயல்பான தமிழில் தருகிறது; ‘இரக்கம் காட்டினாய்’ என்று குறிப்பாக விளக்கிவிடாமல் அதன் பரந்த பொருளைப் பேணுகிறது.
- source_word: סִגְּרַנִי
  choice: என்னை ... ஒப்புக்கொடுத்தபோதும்
  rationale: סגר இச்சூழலில் ஒருவரை இன்னொருவரின் அதிகாரத்திற்குள் ஒப்புக்கொடுத்தல் அல்லது கையளித்தல் என்று பொருள்படுகிறது. ‘அடைத்தார்’ என்ற சொற்படி மொழிபெயர்ப்பைவிட இது சூழலுக்குப் பொருத்தமானது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இது எபிரெய வேதாகமத்தில் வரும் இறைநாமம்; அதைப் பொதுப் பட்டப்பெயராக மாற்றாமல் தமிழ் ஒலிபெயர்ப்பில் தருகிறது.
- source_word: בְּיָדְךָ
  choice: உன் கையில்
  rationale: எபிரெய உருவகத்தைப் பேணுகிறது; தமிழிலும் ஒருவருடைய அதிகாரம் அல்லது வசம் என்ற பொருள் தெளிவாகப் புரிகிறது.
- source_word: וְלֹא הֲרַגְתָּנִי
  choice: நீ என்னைக் கொல்லவில்லை
  rationale: எளிய மறுப்பு வினையைத் தெளிவான, தற்போதைய தமிழில் நேரடியாகத் தருகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைநாமத்தை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் தனிப்பட்ட இறைநாமம் நேரடியாக உள்ளது. அதை ஒரு பட்டப்பெயரால் மாற்றாமல் ஒலிபெயர்ப்பது மூலத்தின் தனித்துவத்தைப் பேணுகிறது.
- issue: யாவே சவுலைத் தாவீதின் கையில் ஒப்புக்கொடுத்தார் என்ற கூற்று
  choice: மூலத்தின் நேரடியான தெய்வீகச் செயற்பாட்டை அப்படியே பேணுதல்
  alternative: சவுல் தாவீதின் வசத்தில் அகப்பட்டதாக மட்டும் கூறுதல்
  rationale: எபிரெய உரை இதை யாவேயின் செயலாக நேரடியாகக் கூறுகிறது; அந்த இறையியல் வலிமையை மெலிதாக்காமல் வைத்திருக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையும் எளிய புரிதலும் இணைந்த நடை. ‘உன் கையில்’ என்ற எபிரெய உருவகம் தமிழிலும் இயல்பாக இருப்பதால் பேணப்பட்டுள்ளது. வாக்கியத்தின் இரண்டாம் பகுதியிலுள்ள וְ-ஐ சூழலுக்கேற்ப ‘போதும்’ எனக் கொடுத்து, சவுலைக் கொல்ல வாய்ப்பிருந்தும் தாவீது கொல்லவில்லை என்ற முரண்பாட்டைத் தெளிவாக்குகிறது.
