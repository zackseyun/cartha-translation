- from: 'நீ எனக்கு எவ்வாறு நன்மை செய்தாய் என்பதை இன்று தெரியப்படுத்தியிருக்கிறாய்: யாவே என்னை உன் கையில் ஒப்புக்கொடுத்தபோதும்[a], நீ என்னைக் கொல்லவில்லை.'
  to: 'நீ இன்று எனக்குச் செய்த நன்மையை வெளிப்படுத்தியிருக்கிறாய்: யாவே என்னை உன் கையில் ஒப்புக்கொடுத்தபோது[a], நீ என்னைக் கொல்லவில்லை.'
  rationale: The revision retains the source's sequence and assertions while using a direct Tamil object for David's beneficial action. It renders the handing-over clause as a temporal circumstance rather than adding an explicit concessive particle. The revised footnote preserves the lexical information without obscuring the idiomatic contextual sense.
