base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/024/022.yaml
  text: Now swear to me by Yahweh that you will not cut off my descendants after me[c][b][a], and that you will not wipe out my name from my father's house.
translation:
  language: ta
  text: 'இப்போது, யாவேவின் பேரில் எனக்கு ஆணையிட்டுச் சொல்: எனக்குப் பின் என் சந்ததியை[b] அழித்துவிடமாட்டாய் என்றும்[a], என் தந்தையின் குடும்பத்திலிருந்து என் பெயரை[c] ஒழித்துவிடமாட்டாய் என்றும்.


    [a] எபிரெய ஆணைச் சூத்திரத்தில் சொல்லுக்குச் சொல் “என்றால்” என்பது பயன்படுத்தப்பட்டுள்ளது. இங்கு அது சவுல் தாவீதிடம் ஆணையிட்டுக் கூறும்படி கேட்கும் உறுதிமொழியின் உள்ளடக்கத்தை அறிமுகப்படுத்துகிறது; ஆகவே “அழித்துவிடமாட்டாய் … என்றும்” என்று மொழிபெயர்க்கப்பட்டுள்ளது.


    [b] அல்லது, “என் வழித்தோன்றல்களை.”


    [c] இங்கு “என் பெயர்” என்பது சவுலின் குடும்ப வழி தொடர்ந்து நிலைப்பதையும், தன் குலத்திற்குள் அவர் நினைவுகூரப்படுவதையும் குறிக்கிறது.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய ஆணைச் சூத்திரத்தில் சொல்லுக்குச் சொல் “என்றால்” என்பது பயன்படுத்தப்பட்டுள்ளது. இங்கு அது சவுல் தாவீதிடம் ஆணையிட்டுக் கூறும்படி கேட்கும் உறுதிமொழியின் உள்ளடக்கத்தை அறிமுகப்படுத்துகிறது; ஆகவே “அழித்துவிடமாட்டாய் … என்றும்” என்று மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “என் வழித்தோன்றல்களை.”
    reason: lexical_alternative
  - marker: c
    text: இங்கு “என் பெயர்” என்பது சவுலின் குடும்ப வழி தொடர்ந்து நிலைப்பதையும், தன் குலத்திற்குள் அவர் நினைவுகூரப்படுவதையும் குறிக்கிறது.
    reason: cultural_note
lexical_decisions:
- source_word: וְעַתָּה
  choice: இப்போது
  rationale: சவுலின் இறுதி வேண்டுகோளை அறிமுகப்படுத்தும் உரையாடல் இணைப்பாக இயல்பான நவீனத் தமிழில் வழங்கப்பட்டது.
- source_word: הִשָּׁבְעָה לִּי
  choice: ஆணையிட்டு எனக்கு உறுதியளி
  rationale: שבע என்பதன் நிஃபால் கட்டளை வடிவம் ஆணை செய்யுமாறு கோருகிறது. தமிழில் வெறும் “எனக்கு ஆணையிடு” என்பதைவிட இச்சொற்றொடர் உறுதிமொழியின் நோக்கத்தை இயல்பாகத் தெரிவிக்கிறது.
- source_word: בַּיהוָה
  choice: யாவேமேல்
  rationale: ஆணையில் தெய்வீகப் பெயரான יהוה நேரடியாக அழைக்கப்படுகிறது; உடன்படிக்கைப் பெயரை மறைக்காமல் “யாவே” என்று ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: אִם / וְאִם
  choice: …மாட்டாய் என்றும் / …மாட்டாய் என்றும்
  rationale: இவை சாதாரண நிபந்தனையை அல்ல, கோரப்படும் ஆணையின் உள்ளடக்கத்தை அறிமுகப்படுத்துகின்றன. தமிழில் எதிர்மறை உறுதிமொழியாகத் தெளிவாக வழங்கப்பட்டது; சொல்லுக்குச் சொல் வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
- source_word: תַּכְרִית
  choice: அழித்துவிடமாட்டாய்
  rationale: כרת என்பதன் ஹிஃபில் வடிவம் இங்கு ஒருவரின் சந்ததி வழியை முடிவுக்குக் கொண்டுவருவதைக் குறிக்கிறது. தமிழில் தெளிவான, வலிமையான சொல் தேர்ந்தெடுக்கப்பட்டது.
- source_word: זַרְעִי
  choice: என் சந்ததி
  rationale: சொல்லுக்குச் சொல் “என் விதை” என்றாலும், இங்கு பின்வரும் தலைமுறையினரைக் குறிக்கிறது. “சந்ததி” சுருக்கமானதும் குடும்ப வழி சார்ந்த பொருளைத் தக்கவைப்பதும் ஆகும்.
- source_word: אַחֲרָי
  choice: எனக்குப் பின்
  rationale: சவுலுக்குப் பிறகு, குறிப்பாக அவர் இறந்த பின், அவரது சந்ததிக்கு என்ன நிகழும் என்ற காலப்பொருளை நேரடியாகப் பாதுகாக்கிறது.
- source_word: תַּשְׁמִיד
  choice: ஒழித்துவிடமாட்டாய்
  rationale: שמד என்பதன் ஹிஃபில் வடிவத்திலுள்ள முற்றான அழிவு எண்ணத்தைத் தருகிறது; “பெயர்” மறைந்து போவதுடன் தமிழில் இயல்பாக இணைகிறது.
- source_word: שְׁמִי
  choice: என் பெயர்
  rationale: நினைவுறும் அடையாளம் மற்றும் குடும்ப வழி என்ற எபிரெயப் பண்பாட்டு நுணுக்கத்தைத் தக்கவைக்க நேரடியாக மொழிபெயர்க்கப்பட்டது.
- source_word: מִבֵּית אָבִי
  choice: என் தந்தையின் குடும்பத்திலிருந்து
  rationale: “தந்தையின் வீடு” என்ற எபிரெய உறவுமுறைச் சொல்லாட்சி தந்தைவழிக் குடும்பம் அல்லது குலத்தைச் சுட்டுகிறது. நவீனத் தமிழில் புரியும் வகையில் “குடும்பம்” என வழங்கப்பட்டது.
theological_decisions:
- issue: ஆணைச் சூத்திரத்தில் יהוה என்ற தெய்வீகப் பெயரை வழங்குதல்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூல உரை நான்கு எழுத்துத் தெய்வீகப் பெயரை நேரடியாகக் கொண்டுள்ளது. அதை பட்டப்பெயராக மாற்றாமல், பரவலாக ஏற்கப்பட்ட ஒலிப்புக்கு அருகில் “யாவே” என்று வழங்குவது மூலத்தின் உடன்படிக்கைப் பெயரை வெளிப்படையாகப் பாதுகாக்கிறது.
- issue: אִם கொண்ட ஆணைச் சூத்திரத்தின் எதிர்மறைப் பொருள்
  choice: அழித்துவிடமாட்டாய் … ஒழித்துவிடமாட்டாய்
  alternative: அழித்துவிட்டால் … ஒழித்துவிட்டால்
  rationale: இச்சூழலில் אִם ஆணையின் உள்ளடக்கத்தை அறிமுகப்படுத்துகிறது; முழு ஆணைச் சூத்திரத்தில் மறைமுகமாக உள்ள எதிர்மறை உறுதியை தமிழில் வெளிப்படுத்தாவிட்டால் வாக்கியம் முழுமையற்றதாகவும் எதிர்ப்பொருள் தருவதாகவும் அமையும். அதேவேளை மூலத்தின் வடிவ வேறுபாடு அடிக்குறிப்பில் குறிப்பிடப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. “ஆணையிட்டு … உறுதியளி” என்பது பழமையான சட்ட மொழியைத் தவிர்த்து ஆணையின் வலிமையைத் தக்கவைக்கிறது. “தந்தையின் குடும்பம்” என்பது எபிரெய உறவுமுறை அமைப்பை புரியக்கூடிய தமிழில் வழங்குகிறது.
