  yaml_path: translation/ot/1_samuel/024/014.yaml
  text: As the ancient proverb says[a], ‘Wickedness comes out from the wicked,’ but my hand will not be against you.
translation:
  language: ta
  text: பண்டைய பழமொழி கூறுவதுபோல்[a], “தீயவர்களிடமிருந்து தீமை வெளிப்படும்.” ஆனால் என் கை உமக்கு எதிராக இருக்காது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “முன்னோர்களின் பழமொழி கூறுவதுபோல்.” எபிரெயச் சொல்லை “பண்டைய” என்றும், “முன்னோர்களின்” என்றும் புரிந்துகொள்ளலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּאֲשֶׁר יֹאמַר
  choice: சொல்வதுபோல்
  rationale: மேற்கோள் அறிமுகப்படுத்தும் ஒப்புமைத் தொடரையும், பொதுவாக எப்போதும் பொருந்தும் பழமொழியைச் சுட்டும் வினை வடிவையும் இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: מְשַׁל הַקַּדְמֹנִי
  choice: பண்டைய பழமொழி
  rationale: מְשַׁל என்பது இங்கு சுருக்கமான மரபுவழி நீதிமொழி. הַקַּדְמֹנִי என்பதன் முதன்மையான வாசிப்பை ‘பண்டைய’ என உரையில் தந்து, ‘முன்னோர்களின்’ என்ற உண்மையான மாற்றுப் புரிதலை அடிக்குறிப்பில் பாதுகாக்கிறது.
- source_word: מֵרְשָׁעִים יֵצֵא רֶשַׁע
  choice: தீயவர்களிடமிருந்தே தீமை வெளிப்படும்
  rationale: מִן காட்டும் மூலத்தை ‘இடமிருந்து’ என்பதால் வெளிப்படுத்தி, רְשָׁעִים / רֶשַׁע ஆகியவற்றின் சொல் தொடர்பை ‘தீயவர்கள் / தீமை’ எனத் தக்கவைக்கிறது. வலியுறுத்தும் ‘ஏ’ தமிழ் பழமொழியின் கருத்துத் தொடர்பை இயல்பாகக் காட்டுகிறது.
- source_word: וְיָדִי לֹא תִהְיֶה בָּךְ
  choice: ஆனால் என் கை உமக்கு எதிராக இருக்காது
  rationale: ‘கை’ என்ற எபிரெய உருவகத்தைத் தக்கவைத்து, בָּךְ என்பதன் பகைமை அல்லது தீங்கு விளைவிக்கும் திசையை ‘உமக்கு எதிராக’ எனத் தெளிவாக்குகிறது. சூழலிலுள்ள முரண்பாட்டால் וְ adversative ஆக ‘ஆனால்’ என மொழிபெயர்க்கப்பட்டுள்ளது.
