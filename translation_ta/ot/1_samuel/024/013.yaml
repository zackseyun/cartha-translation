base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/024/013.yaml
  text: May Yahweh judge between me and you[a], and may Yahweh avenge me on you[c][b]; but my hand will not be against you.
translation:
  language: ta
  text: யாவே எனக்கும் உமக்கும் இடையே தீர்ப்பளிப்பாராக; யாவே உம்மேல் எனக்காகப் பழிவாங்குவாராக[a]. ஆனால் என் கை உமக்கு எதிராக இருக்காது[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யாவே உம்மிடமிருந்து எனக்காகப் பழிவாங்குவாராக.”
    reason: lexical_alternative
  - marker: b
    text: 'சொல்லுக்குச் சொல்: “என் கை உமக்கு எதிராக இருக்காது.” இது பகைமையான நடவடிக்கையில் தானே ஈடுபடமாட்டேன் என்பதைக் குறிக்கும் எபிரெய மொழிவழக்கு.'
    reason: cultural_note
lexical_decisions:
- source_word: יִשְׁפֹּט
  choice: தீர்ப்பளிப்பாராக
  rationale: இங்குள்ள yiqtol வடிவம் வெறும் எதிர்காலத்தை அல்ல, தாவீதின் வேண்டுதலையும் அழைப்பையும் உணர்த்துகிறது; ‘தீர்ப்பளிப்பாராக’ அந்த வலிமையை இயல்பான தமிழில் தருகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய உரையில் வரும் இறைத் திருப்பெயரை ஒரு பட்டப்பெயரால் மாற்றாமல், நவீன தமிழில் பரவலாகப் புரிந்துகொள்ளக்கூடிய ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: בֵּינִי וּבֵינֶךָ
  choice: எனக்கும் உமக்கும் இடையே
  rationale: இரு தரப்பினருக்கிடையே தீர்ப்பிடும் நீதிமன்றத் தன்மையையும், எபிரெயத்தில் உள்ள நேரடியான தனிநபர் எதிரெதிர் அமைப்பையும் காக்கிறது.
- source_word: וּנְקָמַנִי ... מִמֶּךָּ
  choice: உம்மிடம் எனக்காகப் பழிவாங்குவாராக
  rationale: נקם என்பதன் பழிவாங்குதல் என்ற வலிமையை மெலிதாக்காமல் காக்கிறது; מן இங்கு பழிவாங்குதல் செலுத்தப்படும் நபரைச் சுட்டுவதால் ‘உம்மிடம்’ இயல்பான தமிழில் அதைத் தெரிவிக்கிறது.
- source_word: וְיָדִי לֹא תִהְיֶה בָּךְ
  choice: ஆனால் என் கை உமக்கு எதிராக இருக்காது
  rationale: ‘கை’ என்ற எபிரெய உருவகத்தைத் தக்கவைத்து, தாவீது தானே பகைச் செயலில் இறங்கமாட்டான் என்ற பொருளைச் சூழல் விளக்க அனுமதிக்கிறது; ‘ஆனால்’ இறைச் செயலுக்கும் தாவீதின் விலகலுக்கும் இடையிலான முரண்பாட்டை வெளிப்படுத்துகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூலத்தில் பட்டப்பெயர் அல்ல, நான்கெழுத்து இறைத் திருப்பெயரே நேரடியாக வருகிறது; ஆகவே அதை மறைக்காமல் ஒலிபெயர்த்துள்ளது.
- issue: தாவீதின் נקם வேண்டுகோளின் தன்மை
  choice: யாவே தாவீதுக்காகச் சவுலிடம் பழிவாங்க வேண்டும் என்ற வேண்டுகோள்
  alternative: தாவீதை நீதிமான் என்று மட்டும் மெய்ப்பித்தல்
  rationale: נקם என்பதன் வலிமையையும், கடவுள் பழிவாங்க வேண்டும் என்ற வேண்டுகோளுக்கும் தாவீது தன் கையால் தீங்கு செய்ய மறுப்பதற்கும் இடையிலான இறையியல் பதற்றத்தையும் மொழிபெயர்ப்பு காக்கிறது.
translation_notes:
  register: மரியாதைக்குரிய ஒருமையை உணர்த்த ‘உம்/உமக்கு’ பயன்படுத்தப்பட்டுள்ளது. நடை நவீனமும் கண்ணியமானதும்; நீதித் தீர்ப்பு, பழிவாங்குதல், ‘கை’ என்ற உருவகம் ஆகிய மூலத்தின் கூறுகள் விளக்கவுரையாக மாற்றப்படாமல் காக்கப்பட்டுள்ளன.
