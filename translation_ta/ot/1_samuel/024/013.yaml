revisions:
- from: யாவே எனக்கும் உமக்கும் இடையே தீர்ப்பளிப்பாராக; யாவே உம்மிடம் எனக்காகப் பழிவாங்குவாராக[a]. ஆனால் என் கை உமக்கு எதிராக இருக்காது[b].
  to: யாவே எனக்கும் உமக்கும் இடையே தீர்ப்பளிப்பாராக; யாவே உம்மேல் எனக்காகப் பழிவாங்குவாராக[a]. ஆனால் என் கை உமக்கு எதிராக இருக்காது[b].
  rationale: The revision changes only the prepositional expression governing “பழிவாங்குவாராக,” making Saul unmistakably the one upon whom Yahweh’s vengeance is to fall. It preserves the source’s judicial appeal, its request for divine vengeance, and David’s stated refusal to act personally.
