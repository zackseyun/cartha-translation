  to: இப்போது, இதோ, நீர் நிச்சயமாக அரசாளுவீர் என்றும், இஸ்ரவேலின் அரசாட்சி உமது கையில் நிலைபெறும் என்றும் நான் அறிந்திருக்கிறேன்.
