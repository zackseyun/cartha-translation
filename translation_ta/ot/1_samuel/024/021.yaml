  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וְ/עַתָּה֙ הִנֵּ֣ה יָדַ֔עְתִּי כִּ֥י מָלֹ֖ךְ תִּמְל֑וֹךְ וְ/קָ֨מָה֙ בְּ/יָ֣דְ/ךָ֔ מַמְלֶ֖כֶת יִשְׂרָאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/024/021.yaml
  text: And now, look, I know that you will surely reign, and the kingdom of Israel will be established in your hand.
translation:
  language: ta
  text: இப்போது, இதோ, நீர் நிச்சயமாக அரசாளுவீர் என்றும், இஸ்ரவேலின் அரசாட்சி உமது கையில் நிலைபெறும் என்றும் நான் அறிந்திருக்கிறேன்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעַתָּה
  choice: இப்போது
  rationale: கதைச்சூழலில் சவுலின் முடிவுரையை இயல்பாகத் தொடங்கும் காலச் சொல்.
- source_word: הִנֵּה
  choice: இதோ
  rationale: பேசுபவர் தாம் உணர்ந்த உண்மைக்கு கவனம் ஈர்க்கும் எபிரேய உரையாடல் குறியீட்டைப் பாதுகாக்கிறது.
- source_word: מָלֹךְ תִּמְלוֹךְ
  choice: நீர் நிச்சயமாக அரசாளுவீர்
  rationale: ஒரே வேர் சொல்லின் வினையெச்சமும் முற்றுவினையும் சேர்ந்த வலியுறுத்தலை ‘நிச்சயமாக’ என்று வெளிப்படுத்துகிறது.
- source_word: וְקָמָה
  choice: நிலைபெறும்
  rationale: அரசு உறுதியாக நிறுவப்பட்டு நீடிக்கும் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: בְּיָדְךָ
  choice: உமது கையில்
  rationale: ஆட்சி அதிகாரத்தைக் குறிக்கும் மூலமொழியின் உருவகத்தைத் தக்கவைக்கிறது.
- source_word: מַמְלֶכֶת יִשְׂרָאֵל
  choice: இஸ்ரவேலின் அரசு
  rationale: இங்கு ஆட்சிப்பரப்பு அல்லது அரசாட்சியைக் குறிக்கும் சொல்லுக்கு இயல்பான, சூழலுக்கேற்ற மொழிபெயர்ப்பு.
theological_decisions:
- issue: தாவீதின் எதிர்கால அரசாட்சி குறித்த சவுலின் உறுதி
  choice: ‘நீர் நிச்சயமாக அரசாளுவீர்’ என்ற வலியுறுத்தலை அப்படியே பேணுதல்
  alternative: ‘நீர் அரசராவீர்’
  rationale: מָלֹךְ תִּמְלוֹךְ என்ற எபிரேய வலியுறுத்தல் அமைப்பைத் தளர்த்தாமல், கூடுதல் இறையியல் விளக்கத்தையும் சேர்க்காமல் தருகிறது.
translation_notes:
  register: நவீன தரத் தமிழ்; அரசரிடம் பேசும் சூழலுக்கேற்ற மரியாதைப் பன்மை பயன்படுத்தப்பட்டுள்ளது. ‘இதோ’ மற்றும் ‘உமது கையில்’ என்பவை மூலத்தின் சொற்படிமத்தையும் கண்ணியமான வேதாகம நடையையும் காக்கின்றன.
