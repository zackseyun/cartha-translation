base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/024/023.yaml
  text: So David swore to Saul. Then Saul went to his house[a], but David and his men went up to the stronghold.
translation:
  language: ta
  text: தாவீது சவுலிடம் சத்தியம் செய்தான். பின்பு சவுல் தன் வீட்டுக்குச் சென்றான்; ஆனால் தாவீதும் அவனுடைய ஆட்களும் அரணுக்கு ஏறிச் சென்றார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தாவீதும் அவனுடைய ஆட்களும் அரணுக்கு ஏறிச் சென்றார்கள்.” எபிரெய மொழியில் உள்ள இணைப்புச்சொல் நேரடியாக “மற்றும்” என்பதாகும்; முதன்மை உரையில் உள்ள “ஆனால்” சவுலும் தாவீதும் வெவ்வேறு இடங்களுக்குச் சென்ற மாறுபாட்டைத் தெளிவுபடுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׁבַע
  choice: ஆணையிட்டுக் கொடுத்தான்
  rationale: שׁבע என்பதன் நிபால் வடிவம் இங்கு ஆணையிடுதல் அல்லது உறுதிமொழி அளித்தல் என்று பொருள்படுகிறது. முந்தைய வசனங்களில் சவுலிடம் தாவீது அளித்த வாக்குறுதியைத் தமிழில் இயல்பாக வெளிப்படுத்த இந்தச் சொற்றொடர் தேர்ந்தெடுக்கப்பட்டது.
- source_word: לְשָׁאוּל
  choice: சவுலுக்கு
  rationale: ל முன்னிடைச்சொல் ஆணை யாரிடம் அளிக்கப்பட்டதோ அவரைக் குறிக்கிறது; ‘சவுலுக்கு’ என்பது இயல்பான தமிழ் வடிவம்.
- source_word: וַיֵּלֶךְ שָׁאוּל אֶל־בֵּיתוֹ
  choice: பின்பு சவுல் தன் வீட்டுக்குச் சென்றான்
  rationale: בַּיִת என்பது வீடு அல்லது இல்லம் என்று பொருள்படலாம். ‘தன் வீட்டுக்கு’ என்பது எபிரெய நேரடியான உருவகத்தைப் பேணும் இயல்பான நவீனத் தமிழ்.
- source_word: וְדָוִד וַאֲנָשָׁיו
  choice: ஆனால் தாவீதும் அவனுடைய ஆட்களும்
  rationale: וְ என்பது அடிப்படையில் ‘மற்றும்/அப்போது’ என்ற இணைப்புச்சொல். இங்கு சவுலும் தாவீதும் வெவ்வேறு இடங்களுக்குச் செல்வதை விளக்கும் கதைமாந்தர் வேறுபாட்டை ‘ஆனால்’ இயல்பாக வெளிப்படுத்துகிறது. אֲנָשָׁיו என்பது இச்சூழலில் தாவீதின் உடனிருந்த போர்வீரர்களைக் குறிக்கும்; ‘ஆட்கள்’ அதற்கேற்ற இயல்பான சொல்.
- source_word: עָלוּ
  choice: சென்றார்கள்
  rationale: עָלָה என்பதன் அடிப்படைப் பொருள் ‘மேலே செல்லுதல்’. தமிழில் ‘அரணுக்குச் சென்றார்கள்’ என்பது இயல்பாக உள்ளது; எனினும் ‘மேலே சென்றார்கள்’ என்ற திசைநுட்பம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: הַמְּצוּדָה
  choice: அரண்
  rationale: מְצוּדָה என்பது பாதுகாப்பான அரண் அல்லது கோட்டை போன்ற புகலிடத்தைக் குறிக்கிறது. தாவீதின் வனாந்தரச் சூழலில் ‘அரண்’ சுருக்கமானதும் பொருத்தமானதும் ஆகும்.
