  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான வரலாற்று உரைநடை. மூலத்தின் ‘இதோ’ என்ற கவன ஈர்ப்புச் சொல்லும், தகவல் தெரிவித்தவர்களின் அடையாளம் குறிப்பிடப்படாத தன்மையும் பாதுகாக்கப்பட்டுள்ளன.
