  yaml_path: translation/ot/1_samuel/024/002.yaml
  text: When Saul returned from pursuing the Philistines, they told him, saying, “Look, David is in the wilderness of En-gedi.”
translation:
  language: ta
  text: சவுல் பெலிஸ்தியர்களைத் துரத்திச் சென்று திரும்பியபோது, அவர்கள் அவரிடம், “இதோ, தாவீது என்-கேதி வனாந்தரத்தில் இருக்கிறான்” என்று தெரிவித்தார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מֵאַחֲרֵי פְּלִשְׁתִּים
  choice: பெலிஸ்தியர்களைப் பின்தொடர்ந்து சென்றுவிட்டு
  rationale: מֵאַחֲרֵי என்பது இச்சூழலில் பெலிஸ்தியர்களைத் துரத்திச் சென்ற நடவடிக்கையைக் குறிக்கிறது; தமிழில் இயல்பாகவும் மூலத்தின் கருத்துக்கு நெருக்கமாகவும் வழங்கப்பட்டது.
- source_word: הִנֵּה
  choice: இதோ
  rationale: கவனத்தை ஈர்க்கும் மூல இடைச்சொல்லின் உரையாடல் வலிமையைப் பாதுகாக்கிறது.
- source_word: מִדְבַּר
  choice: வனாந்தரம்
  rationale: இங்கு பயிரிடப்படாத, மக்கள் குடியிருப்பு குறைந்த நிலப்பகுதியைக் குறிக்கிறது; வழக்கமான வேதாகமப் புவியியல் சொல்லாட்சி.
- source_word: עֵין גֶּדִי
  choice: என்-கேதி
  rationale: எபிரேய இடப்பெயரின் ஒலிபெயர்ப்பைத் தமிழில் தெளிவாக வழங்குகிறது.
- source_word: וַיַּגִּדוּ לוֹ
  choice: சிலர் அவரிடம் … தெரிவித்தார்கள்
  rationale: எபிரேய வினையின் குறிப்பிடப்படாத பன்மை எழுவாயைத் தமிழில் இயல்பாகக் காட்ட ‘சிலர்’ சேர்க்கப்பட்டது; யார் என்று மூலத்தில் அடையாளப்படுத்தப்படவில்லை.
