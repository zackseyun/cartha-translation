  register: நவீன நிலையான தமிழில், கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘வீரர்கள்’ இராணுவச் சூழலைத் தெளிவாக்குகிறது; ‘பாறை முகடுகள்’ மலைப்பாங்கான நில அமைப்பை சாதாரண வாசகருக்குப் புரியும் வகையில் தருகிறது. அடிக்குறிப்பு குறியீடு முதன்மை உரையில் சேர்க்கப்பட்டுள்ளது.
