base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/024/003.yaml
  text: Then Saul took three thousand chosen men from all Israel and went to seek David and his men in front of the rocks of the wild goats[a].
translation:
  language: ta
  text: அப்போது சவுல் இஸ்ரவேல் முழுவதிலுமிருந்து தேர்ந்தெடுக்கப்பட்ட மூவாயிரம் ஆட்களைத் தன்னுடன் கூட்டிக்கொண்டு, காட்டாடுகளின் பாறை முகடுகளுக்கு எதிரே[a] தாவீதையும் அவனுடைய ஆட்களையும் தேடிச் சென்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இதனை ‘காட்டாடுகளின் செங்குத்துப் பாறை முகடுகளின் முன்பாக’ என்றும் மொழிபெயர்க்கலாம்; இங்கு குறிப்பிடப்படும் விலங்கு குறிப்பாக ஐபெக்ஸ் வகைக் காட்டாடாக இருக்கலாம்.
    reason: צוּרֵי என்பதற்கு ‘பாறை முகடுகள்/செங்குத்துப் பாறைகள்’ என்பதும், יְעֵלִים என்பதற்கு ஐபெக்ஸ் எனும் குறிப்பான விலங்குப் பொருளும் சாத்தியமானவை; עַל־פְּנֵי-யின் இடவியல் உறவுக்கு ‘முன்பாக’ மாற்றாகும்.
lexical_decisions:
- source_word: וַיִּקַּח
  choice: அழைத்துக்கொண்டு
  rationale: இச்சூழலில் சவுல் படையெடுப்புக்காக ஆட்களைத் தன்னுடன் கூட்டிச் சென்றதைக் குறிக்கிறது; தமிழில் வெறும் ‘எடுத்தான்’ என்பதைவிட இது இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: שְׁלֹשֶׁת אֲלָפִים אִישׁ בָּחוּר
  choice: தேர்ந்தெடுக்கப்பட்ட மூவாயிரம் வீரர்கள்
  rationale: בָּחוּר என்பது தேர்ந்தெடுக்கப்பட்ட சிறந்த ஆட்களைக் குறிக்கிறது; இராணுவச் சூழலை ‘வீரர்கள்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: מִכָּל יִשְׂרָאֵל
  choice: இஸ்ரவேல் முழுவதிலுமிருந்து
  rationale: முழு இஸ்ரவேல் மக்களிடையிலிருந்தும் அவர்கள் தேர்ந்தெடுக்கப்பட்டனர் என்ற மூலப்பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: וַיֵּלֶךְ לְבַקֵּשׁ
  choice: தேடிச் சென்றான்
  rationale: தேடுவதற்காகச் சென்றான் என்ற நோக்குறவைச் சுருக்கமாகவும் இயல்பாகவும் காக்கிறது.
- source_word: אֶת דָּוִד וַאֲנָשָׁיו
  choice: தாவீதையும் அவனுடைய ஆட்களையும்
  rationale: தாவீதையும் அவனைப் பின்பற்றிய ஆட்களையும் நேரடியாகக் குறிக்கும் எளிய மொழிபெயர்ப்பு.
- source_word: עַל פְּנֵי
  choice: எதிரே
  rationale: சொல்லடியாக ‘முகப்பில்/முகத்திற்கு எதிரே’ எனும் இடவியல் உறவைக் குறிக்கும்; இலக்கு நிலப்பெயரா அல்லது துல்லியமான நிலப்பரப்பு விளக்கமா என்ற தெளிவின்மையை மிகையாகத் தீர்க்காமல் இயல்பான தமிழை வழங்குகிறது.
- source_word: צוּרֵי הַיְּעֵלִים
  choice: காட்டாடுகளின் பாறை முகடுகள்
  rationale: צוּרֵי என்பதன் பாறை அல்லது செங்குத்தான முகடு என்ற உணர்வையும், יְעֵלִים என்பதன் காட்டு ஆடுகள்—குறிப்பாக ஐபெக்ஸ் ஆக இருக்கக்கூடிய விலங்கு—என்ற பொருளையும் அணுகத்தக்க தமிழில் தருகிறது.
