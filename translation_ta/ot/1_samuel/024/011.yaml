base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/024/011.yaml
  text: Look[a], this day your own eyes have seen that Yahweh gave you today into my hand in the cave, and I said to kill you, but I spared you. I said, ‘I will not stretch out my hand against my lord[b], for he is Yahweh’s anointed.’
translation:
  language: ta
  text: 'இதோ, இன்று உமது கண்களே கண்டன: இன்று குகையில் யாவே உம்மை என் கையில் ஒப்புக்கொடுத்தார். உம்மைக் கொல்ல வேண்டும் என்று சொல்லப்பட்டது[a]; ஆனால் நான் உம்மைக் கொல்லாமல் விட்டேன்[b]. நான், ‘என் ஆண்டவர்மேல் கை நீட்டமாட்டேன்; ஏனெனில் அவர் யாவேயால் அபிஷேகம் செய்யப்பட்டவர்’ என்று சொன்னேன்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர் உம்மைக் கொல்லச் சொன்னார்,” “ஒருவர் நான் உம்மைக் கொல்ல வேண்டும் என்று சொன்னார்,” அல்லது “நான் உம்மைக் கொல்லச் சொன்னேன்.” எபிரெய வினை ஒருமையில் உள்ளது; ஆனால் அதன் எழுவாய் வெளிப்படையாகக் குறிப்பிடப்படவில்லை.
    reason: alternative_reading
  - marker: b
    text: அல்லது, “ஆனால் நான் உம்மீது இரக்கம் கொண்டேன்.” எபிரெய வினை இரக்கத்தால் ஒருவரைக் கொல்லாமல் விடுவதைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: இதோ
  rationale: கவனத்தை வலியுறுத்தி ஈர்க்கும் எபிரெயச் சொல்லின் சுட்டிக்காட்டும் தன்மையை இயல்பான நவீனத் தமிழில் தக்கவைக்கிறது.
- source_word: רָאוּ עֵינֶיךָ
  choice: உமது கண்களே கண்டன
  rationale: சவுல் நேரில் கண்டதற்கான வலியுறுத்தலைத் தரும் ‘உமது கண்கள்’ என்ற எபிரெய உருவகத்தைத் தமிழிலும் காக்கிறது.
- source_word: נְתָנְךָ יְהוָה ... בְּיָדִי
  choice: யாவே உம்மை என் கையில் ஒப்புக்கொடுத்ததை
  rationale: ஒருவரை மற்றொருவரின் அதிகாரத்திற்குள் கொடுப்பதைக் குறிக்கும் נתן + ביד idiom-ஐ தெளிவாக வெளிப்படுத்துகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரான நான்கு எழுத்துப் பெயரை பொதுப்பட்டமாக மாற்றாமல் ஒலிபெயர்க்கிறது.
- source_word: וְאָמַר לַהֲרָגֲךָ
  choice: உம்மைக் கொல்ல வேண்டும் என்று சொல்லப்பட்டது
  rationale: வெளிப்படையான எழுவாய் இல்லாத எபிரெய ஒருமை வினையின் தெளிவின்மையைத் தமிழ் செயப்பாட்டு வடிவம் காக்கிறது; யார் சொன்னார் என்பதை உரை தீர்மானிப்பதில்லை.
- source_word: וַתָּחָס עָלֶיךָ
  choice: ஆனால் நான் உம்மைக் கொல்லாமல் விட்டுவைத்தேன்
  rationale: இங்கு வினை இரக்கத்தால் உயிரைக் காப்பாற்றுதல் அல்லது கொல்லாமல் விடுதல் என்னும் கருத்தைத் தருகிறது; சூழலில் தாவீதையே மறைமுக எழுவாயாக எடுத்துக்கொள்கிறது.
- source_word: לֹא אֶשְׁלַח יָדִי
  choice: கைநீட்ட மாட்டேன்
  rationale: தீங்கு செய்ய எதிராகக் கைநீட்டுதல் என்னும் எபிரெய மரபுத்தொடரை இயல்பான தமிழிலும் தக்கவைக்கிறது.
- source_word: בַּאדֹנִי
  choice: என் ஆண்டவர்மேல்
  rationale: இது கடவுளைக் குறிக்கும் பட்டமல்ல; தாவீது சவுலைத் தன் அரசரும் மேலதிகாரியுமாக மரியாதையுடன் அழைப்பதை வெளிப்படுத்துகிறது.
- source_word: מְשִׁיחַ יְהוָה
  choice: யாவே அபிஷேகம் செய்தவர்
  rationale: இச்சூழலில் யாவேயால் அரசனாக அர்ப்பணிக்கப்பட்ட சவுலைக் குறிக்கிறது; பிற்கால இறுதிக்காலப் பட்டத்தை தேவையின்றி இங்கு புகுத்தாமல் அபிஷேகத்தின் இறையியல் முக்கியத்துவத்தைக் காக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூல உரை பொதுப்பட்டத்தை அல்ல, தெய்வீகப் பெயரையே பயன்படுத்துகிறது; எனவே பெயரின் தனித்தன்மை ஒலிபெயர்ப்பில் காக்கப்படுகிறது.
- issue: அரசரைச் சுட்டும் מְשִׁיחַ יְהוָה
  choice: யாவே அபிஷேகம் செய்தவர்
  alternative: யாவேயின் மேசியா
  rationale: கதைச்சூழலில் இது யாவேயால் அபிஷேகம் செய்யப்பட்ட அரசனாகிய சவுலைக் குறிக்கிறது. ‘மேசியா’ என்று ஒலிபெயர்ப்பது இங்கு தேவையற்ற பிற்காலப் பட்டப்பொருளை முன்னிறுத்தக்கூடும்.
- issue: וְאָמַר என்பதன் குறிப்பிடப்படாத எழுவாய்
  choice: சொல்லப்பட்டது
  alternative: நான் சொன்னேன் / அவர் சொன்னார் / ஒருவர் சொன்னார்
  rationale: மசோரெட்டிக் எபிரெய உரையில் வினை ஒருமையில் இருந்தாலும் எழுவாய் வெளிப்படையாக இல்லை. செயப்பாட்டு வடிவம் அந்த உண்மையான தெளிவின்மையைத் தீர்த்துவிடாமல் காக்கிறது.
translation_notes:
  register: நவீன, மரியாதைமிக்க உரைநடை பயன்படுத்தப்பட்டுள்ளது. சவுலை நோக்கிய ஒருமை மரியாதை வடிவங்களான ‘உம்மை/உமது’ என்பவை தாவீதின் பணிவையும் அரசவைக் கண்ணியத்தையும் காட்டுகின்றன. ‘இதோ,’ ‘கைநீட்டுதல்,’ ‘அபிஷேகம் செய்தவர்’ ஆகியவை மூலத்தின் உருவகத்தையும் இறையியல் நிறத்தையும் காக்கின்றன; தெளிவற்ற வினை அடிக்குறிப்புடன் செயப்பாட்டு வடிவில் வழங்கப்பட்டுள்ளது.
