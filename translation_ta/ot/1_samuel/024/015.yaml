translation_notes:
  register: நவீன பொதுத்தமிழில், அரசரிடம் பேசுவதற்கேற்ற கண்ணியமான இரண்டாம் நபர் வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன. அதேவேளையில் ‘செத்த நாய்’ என்ற மூலத்தின் நேரடியான, தன்னைத்தாழ்த்தும் வலிமை மென்மைப்படுத்தப்படவில்லை; எபிரெயத்தின் மீள்வரிசையும் இயன்றவரை காக்கப்பட்டுள்ளது.
