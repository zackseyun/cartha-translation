base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/024/015.yaml
  text: After whom has the king of Israel come out? After whom are you pursuing? After a dead dog[a], after a single flea.
translation:
  language: ta
  text: இஸ்ரவேலின் அரசர் யாருக்குப் பின்னால் புறப்பட்டு வந்திருக்கிறார்? யாருக்குப் பின்னால் விரட்டிச் செல்கிறீர்?[a] செத்த நாய் ஒன்றின் பின்னாலா? ஒரேயொரு தெள்ளுப்பூச்சியின் பின்னாலா?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இஸ்ரவேலின் அரசர் யாருக்கு எதிராகப் புறப்பட்டு வந்திருக்கிறார்? யாரை விரட்டிச் செல்கிறீர்?” துரத்துதலைக் குறிக்கும் பொருளில் எபிரெயம் ‘பின்னால்’ என்ற சொல்லைத் திரும்பத் திரும்பப் பயன்படுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחֲרֵי מִי
  choice: யாருக்குப் பின்னால்
  rationale: אַחֲרֵי என்பதன் அடிப்படைப் பொருளான ‘பின்னால்’ என்பதையும், இச்சூழலில் உள்ள துரத்திச் செல்லும் கருத்தையும் காத்து, எபிரெய உரையின் திரும்பவரும் வினா அமைப்பைப் பிரதிபலிக்கிறது.
- source_word: יָצָא
  choice: புறப்பட்டு வந்திருக்கிறார்
  rationale: வினைச்சொல் வெளியே செல்வதையோ வருவதையோ குறிக்கிறது; தாவீதைத் தேடி அரசர் படையெடுத்துப் புறப்பட்ட சூழலைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: இஸ்ரவேலின் அரசர்
  rationale: அரசரின் உயர்ந்த பதவிக்கும் அவர் துரத்தும் அற்பமான இலக்குக்கும் இடையிலான முரணைக் காக்கும் நேரடியான, கண்ணியமான மொழிபெயர்ப்பு.
- source_word: אַתָּה רֹדֵף
  choice: துரத்திக்கொண்டு வருகிறீர்
  rationale: רדף குறிக்கும் தொடர்ச்சியான, பகைமையான பின்தொடர்தலை வெளிப்படுத்துகிறது; சவுலை நேரடியாக அழைக்கும் மரியாதைப் பன்மையையும் காக்கிறது.
- source_word: כֶּלֶב מֵת
  choice: செத்த நாய் ஒன்று
  rationale: தாவீதின் தன்னைத்தாழ்த்தும் கடுமையான உருவகத்தை மென்மைப்படுத்தாமல், நவீன தமிழில் தெளிவாகத் தருகிறது.
- source_word: פַּרְעֹשׁ אֶחָד
  choice: ஒரேயொரு தெள்ளுப்பூச்சி
  rationale: אֶחָד வலியுறுத்தும் மிகச்சிறிய, அற்பமான தன்மையை ‘ஒரேயொரு’ இயல்பாக வெளிப்படுத்துகிறது; פַּרְעֹשׁ என்பதற்கு குறிப்பான பூச்சிப் பெயர் பயன்படுத்தப்பட்டுள்ளது.
- source_word: אַחֲרֵי ... אַחֲרֵי ... אַחֲרֵי ... אַחֲרֵי
  choice: பின்னால் ... பின்னால் ... பின்னாலா ... பின்னாலா
  rationale: எபிரெயத்தில் நான்கு முறை வரும் சொல்லின் சொல்லாட்சித் தாளத்தையும் ஏளனமான வலியுறுத்தலையும் தமிழில் இயன்றவரை காக்கிறது.
