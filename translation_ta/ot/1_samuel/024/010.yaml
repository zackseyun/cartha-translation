source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר דָּוִד֙ לְ/שָׁא֔וּל לָ֧/מָּה תִשְׁמַ֛ע אֶת דִּבְרֵ֥י אָדָ֖ם לֵ/אמֹ֑ר הִנֵּ֣ה דָוִ֔ד מְבַקֵּ֖שׁ רָעָתֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/024/010.yaml
  text: And David said to Saul[a], “Why do you listen to the words of a man who says, ‘Look[b], David is seeking your harm’?”
translation:
  language: ta
  text: தாவீது சவுலிடம், “இதோ, தாவீது உமக்குத் தீங்கு விளைவிக்க முயல்கிறான்’ என்று சொல்லும் ஒரு மனிதனின் வார்த்தைகளுக்கு[a] நீர் ஏன் செவிசாய்க்கிறீர்?” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ஒரு மனிதனின் வார்த்தைகள்” என்பதற்கு “மனிதப் பேச்சு” என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் ஒருமையில் இருந்தாலும், சில இடங்களில் மனிதர்களை பொதுவாகக் குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר דָּוִד לְשָׁאוּל
  choice: தாவீது சவுலிடம் ... என்றான்
  rationale: எபிரெயக் கதைநடையின் தொடர்ச்சியை இயல்பான தமிழ் சொல்வரிசையில் தருகிறது; לְ என்பது உரையின் பெறுநரைக் குறிக்கிறது.
- source_word: לָמָּה תִשְׁמַע
  choice: நீர் ஏன் கேட்கிறீர்?
  rationale: שׁמע இங்கு வெறுமனே ஒலியைக் கேட்பது அல்ல, ஒருவரின் கூற்றுக்குச் செவிசாய்ப்பதைக் குறிக்கிறது. அரசனான சவுலிடம் பேசுவதால் மரியாதைப் பன்மை பயன்படுத்தப்பட்டது.
- source_word: אֶת דִּבְרֵי אָדָם
  choice: ஒரு மனிதனின் வார்த்தைகளை
  rationale: אָדָם ஒருமையில் இருப்பதைப் பாதுகாக்கிறது; சூழலில் பழிசுமத்தும் குறிப்பிட்ட அல்லது வகைமையான ஒருவரின் பேச்சைக் குறிக்கலாம்.
- source_word: לֵאמֹר
  choice: என்று சொல்லும்
  rationale: மேற்கோள் உள்ளடக்கத்தை அறிமுகப்படுத்தும் infinitive-ஐ, தமிழில் பெயர்ச்சொல்லை இயல்பாகத் தொடர்புபடுத்தும் வினையெச்சத் தொடராக வழங்குகிறது.
- source_word: הִנֵּה
  choice: இதோ
  rationale: கவனத்தை ஈர்க்கும் எபிரெயச் சொல்லுக்கான இயல்பான, கண்ணியமான நவீனத் தமிழ் இணை.
- source_word: מְבַקֵּשׁ
  choice: தேடுகிறான்
  rationale: பங்கேற்புவினையின் தொடர்ச்சியான அல்லது பண்புசார் செயல் நுணுக்கத்தைத் தக்கவைக்கிறது.
- source_word: רָעָתֶךָ
  choice: உமக்குத் தீங்கு செய்ய
  rationale: רָעָה இங்கு சவுலுக்கு நேரவிருக்கும் கேடு அல்லது தீங்கைக் குறிக்கிறது; தமிழில் நோக்கத்தை இயல்பாக வெளிப்படுத்த வினைத்தொடராக மொழிபெயர்க்கப்பட்டுள்ளது.
theological_decisions:
- issue: אָדָם என்பதன் ஒருமை அல்லது பொதுமைப் பொருள்
  choice: ஒரு மனிதன்
  alternative: மனிதர்களின் வார்த்தைகள் / மனிதப் பேச்சு
  rationale: மூலத்தில் பெயர்ச்சொல் ஒருமையில் உள்ளது; இச்சூழலில் சவுலிடம் தாவீதைக் குறித்து குற்றஞ்சாட்டும் ஒருவரைக் குறிப்பிடுவது இயல்பான வாசிப்பு. இருப்பினும் பொதுவான மனிதப் பேச்சு என்ற சாத்தியம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: רָעָה என்பதன் பொருள்
  choice: தீங்கு
  alternative: தீமை
  rationale: உடனடிச் சூழல் தாவீது சவுலுக்குக் கேடு செய்ய முயல்வதாகக் கூறப்படும் குற்றச்சாட்டைப் பற்றியது; ‘தீங்கு’ இலக்கின் மீதான கேட்டைத் தெளிவாகச் சொல்கிறது, தேவையற்ற ஒழுக்கவியல் வலிமையைச் சேர்ப்பதில்லை.
translation_notes:
  register: நவீன, கண்ணியமான கதைநடை. சவுல் அரசன் என்பதாலும் தாவீது நேரடியாக அவரிடம் பேசுவதாலும் ‘நீர்/உமக்கு’ என்ற மரியாதை வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன. மூலத்தின் ஒருமை, கவன ஈர்ப்புச் சொல், தொடர்ச்சிச் செயல் ஆகியவை இயன்றவரை பாதுகாக்கப்பட்டுள்ளன.
