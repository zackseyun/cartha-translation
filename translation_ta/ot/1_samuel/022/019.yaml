source:
  edition: WLC
  text: וְ/אֵ֨ת נֹ֤ב עִיר הַ/כֹּֽהֲנִים֙ הִכָּ֣ה לְ/פִי חֶ֔רֶב מֵ/אִישׁ֙ וְ/עַד אִשָּׁ֔ה מֵ/עוֹלֵ֖ל וְ/עַד יוֹנֵ֑ק וְ/שׁ֧וֹר וַ/חֲמ֛וֹר וָ/שֶׂ֖ה לְ/פִי חָֽרֶב־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/022/019.yaml
  text: And Nob[a], the city of the priests, he struck with the edge of the sword, from man to woman, from child to nursing infant, and ox and donkey and sheep, with the edge of the sword.
translation:
  language: ta
  text: ஆசாரியர்களின் நகரமான நோபை அவன் வாளால்[a] கொன்றான்; ஆண் முதல் பெண் வரை, சிறு குழந்தை முதல் பால்குடி குழந்தை வரை, எருது, கழுதை, ஆடு ஆகியவற்றையும் வாளால் கொன்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொல்லர்த்தமாக, “வாளின் வாயால்”; இது வாளால் கொல்வதைக் குறிக்கும் மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: נֹב
  choice: நோபு
  rationale: இது ஓர் இடப்பெயர்; நவீனத் தமிழில் எபிரெய ஒலிப்புக்கு நெருக்கமாக ஒலிபெயர்க்கப்பட்டது.
- source_word: עִיר הַכֹּהֲנִים
  choice: ஆசாரியர்களின் நகரம்
  rationale: நோபு ஆசாரியர்களுக்குரிய அல்லது அவர்களால் சிறப்பாக அறியப்பட்ட நகரம் என்பதைத் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: הִכָּה
  choice: வெட்டிக் கொன்றான்
  rationale: வினைச்சொல் தனித்து ‘அடித்தான்/தாக்கினான்’ என்ற பரந்த பொருளுடையது; ஆனால் வாள் குறித்த தொடரும் பாதிக்கப்பட்டவர்களின் முழுப் பட்டியலும் இங்கு உயிர்க்கொலை நடந்ததைத் தெளிவாக்குவதால், தமிழில் சூழலுக்கேற்ற இயல்பான சொல்லாக்கம் தேர்ந்தெடுக்கப்பட்டது.
- source_word: לְפִי חֶרֶב / לְפִי חָרֶב
  choice: வாளால்
  rationale: சொல்லர்த்தமாக ‘வாளின் வாயால்’ என்றாலும், இது வாளால் கொல்வதைக் குறிக்கும் எபிரெய மரபுத்தொடர். ‘வாளால்’ என்பது தமிழில் தெளிவானதும் இயல்பானதும்; சொல்லுருவம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: מֵאִישׁ וְעַד אִשָּׁה
  choice: ஆண் முதல் பெண் வரையிலும்
  rationale: இரு பாலினத்தவரையும் உள்ளடக்கிய முழுமையைக் காட்டும் மூலமொழியின் இணைச்சொல் அமைப்பையும் ஒருமை வடிவங்களையும் பாதுகாக்கிறது.
- source_word: מֵעוֹלֵל וְעַד יוֹנֵק
  choice: சிறு குழந்தை முதல் பால்குடிக்கும் குழந்தை வரையிலும்
  rationale: עוֹלֵל என்பது சிறு குழந்தையையும் יוֹנֵק என்பது இன்னும் பால் குடிக்கும் குழந்தையையும் குறிக்கிறது; வயது வேறுபாட்டையும் கண்மூடித்தனமான படுகொலையின் கொடுமையையும் தெளிவாகத் தருகிறது.
- source_word: וְשׁוֹר וַחֲמוֹר וָשֶׂה
  choice: மாடு, கழுதை, ஆடு
  rationale: பட்டியலிடப்பட்ட வீட்டுவிலங்குகளை இயல்பான தமிழில் தருகிறது. שֶׂה செம்மறியாடு அல்லது வெள்ளாடு போன்ற சிறு கால்நடையைக் குறிக்கக்கூடியதால், ‘ஆடு’ என்ற பொதுவான சொல் அதன் பரப்பை தேவையின்றிக் குறுக்காது.
theological_decisions:
- issue: பாலினத்தைக் குறிக்கும் சொற்களால் முழுமையை வெளிப்படுத்துதல்
  choice: ஆண் முதல் பெண் வரையிலும்
  alternative: ஆண்கள், பெண்கள் அனைவரையும்
  rationale: எபிரெயத்தின் ஒருமை இணைச்சொல் அமைப்பைத் தக்கவைத்து, இது இரு பாலினத்தவரையும் உள்ளடக்கிய முழுமையைக் குறிக்கிறது; பாலினம் குறித்த தனிப்பட்ட கோட்பாட்டை இதில் சேர்க்கவில்லை.
- issue: படுகொலைச் சூத்திரத்தில் மூலத்தின் வலியுறுத்தலைத் தக்கவைத்தல்
  choice: வாள் குறித்த சொற்றொடரை இருமுறை தக்கவைத்து, மனிதர்களையும் விலங்குகளையும் மூலவரிசையில் பட்டியலிடுதல்
  alternative: ஒரே முறை ‘அனைவரையும் வாளால் கொன்றான்’ என்று சுருக்குதல்
  rationale: மீளுரையும் விரிவான பட்டியலும் அழிவின் முழுமையையும் நிகழ்வின் கொடுமையையும் வலியுறுத்துகின்றன; அவற்றைச் சுருக்குவது மூலத்தின் சொல்லாட்சிச் சுமையை இழக்கச் செய்யும்.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. ‘வெட்டிக் கொன்றான்’ என்பது நிகழ்வின் உயிர்க்கொலைத் தன்மையை இயல்பாகத் தெளிவாக்குகிறது; மூலத்தின் மீளுரை மற்றும் பாதிக்கப்பட்டோரின் வரிசை பாதுகாக்கப்பட்டுள்ளன.
