base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/022/011.yaml
  text: Then the king sent to summon Ahimelech son of Ahitub the priest[a], and all his father's house, the priests who were at Nob; and they all came to the king.
translation:
  language: ta
  text: பின்பு அரசன், அகித்தூபின் மகனான அகிமெலேக்கு என்ற ஆசாரியனையும், நோபில் இருந்த ஆசாரியர்களாகிய அவனுடைய தந்தைவழிக் குடும்பத்தார் அனைவரையும்[a] அழைத்துவர ஆள் அனுப்பினான். அவர்கள் அனைவரும் அரசனிடம் வந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “தந்தைவழிக் குடும்பத்தார்” என்பது அவனுடைய உடனடி குடும்பத்தை மட்டும் அல்லாமல், தந்தைவழி விரிந்த குடும்பத்தையோ குலத்தையோ குறிக்கிறது.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּשְׁלַח ... לִקְרֹא
  choice: அழைத்துவர ஆள் அனுப்பினான்
  rationale: அரசன் அதிகாரபூர்வமாகத் தன்னிடம் வரும்படி அழைத்த சூழலை இயல்பான தமிழில் தெரிவிக்கிறது; ‘அனுப்பினான்’ என்பதையும் தொடர்ந்து வரும் நோக்கவினையையும் காக்கிறது.
- source_word: אֲחִימֶלֶךְ בֶּן אֲחִיטוּב הַכֹּהֵן
  choice: அகித்தூபின் மகனான அகிமெலேக்கு என்ற ஆசாரியன்
  rationale: பெயர்களையும் மகன் என்ற உறவையும் நேரடியாகக் காத்து, הַכֹּהֵן குறிக்கும் பணியை ‘ஆசாரியன்’ என வழங்குகிறது.
- source_word: כָּל בֵּית אָבִיו
  choice: அவனுடைய தந்தைவழிக் குடும்பத்தார் அனைவரும்
  rationale: בֵּית אָב என்ற எபிரெய மரபுத்தொடர் உடனடி குடும்பத்தை மட்டும் அல்லாமல் தந்தைவழி விரிந்த குடும்பம் அல்லது குலத்தாரைக் குறிக்கக்கூடும்; நவீன தமிழில் ‘தந்தைவழிக் குடும்பத்தார்’ இதைத் தெளிவாகக் காட்டுகிறது.
- source_word: הַכֹּהֲנִים אֲשֶׁר בְּנֹב
  choice: நோபில் இருந்த ஆசாரியர்கள்
  rationale: அந்தத் தந்தைவழிக் குடும்பத்தாரை நோபில் இருந்த ஆசாரியர்கள் என மேலும் அடையாளப்படுத்தும் எபிரெய தொடரை இயல்பாகப் பிரதிபலிக்கிறது.
- source_word: וַיָּבֹאוּ כֻלָּם אֶל הַמֶּלֶךְ
  choice: அவர்கள் அனைவரும் அரசனிடம் வந்தார்கள்
  rationale: כֻלָּם தரும் முழுமையான குழு வலியுறுத்தலை ‘அனைவரும்’ காக்கிறது; אֶל என்பதற்கு இயக்கத்தைச் சுட்டும் ‘அரசனிடம்’ நேரான தேர்வு.
