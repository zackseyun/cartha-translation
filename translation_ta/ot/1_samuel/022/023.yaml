base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/022/023.yaml
  text: Stay with me[a]; do not be afraid, for he who seeks my life seeks your life also[b], for you are under my protection.
translation:
  language: ta
  text: என்னுடன் தங்கியிரு; அஞ்சாதே. என் உயிரைப் பறிக்க முயல்கிறவன் உன் உயிரையும் பறிக்க முயல்கிறான்; ஏனெனில், என்னுடன் நீ பாதுகாப்பில் இருக்கிறாய்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரேய மூலத்தில் இறுதித் தொடர் சுருக்கமான பெயர்ச்சொல் வாக்கியம்: ‘என்னுடன் நீ பாதுகாப்பில் இருக்கிறாய்.’ இதை ‘நீ என் பாதுகாப்பில் இருக்கிறாய்’ என்றும் மொழிபெயர்க்கலாம்.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁבָה אִתִּי
  choice: என்னுடன் தங்கியிரு
  rationale: ישׁב என்பதன் கட்டளை வடிவம் இச்சூழலில் உட்காருவதைக் குறிக்காமல், தாவீதுடன் தொடர்ந்து இருப்பதைக் குறிக்கிறது; ‘தங்கியிரு’ என்பது இயல்பான நவீனத் தமிழ்.
- source_word: אַל־תִּירָא
  choice: அஞ்சாதே
  rationale: எதிர்மறைக் கட்டளையைச் சுருக்கமாகவும் கண்ணியமாகவும் தெரிவிக்கிறது.
- source_word: אֲשֶׁר יְבַקֵּשׁ אֶת־נַפְשִׁי
  choice: என் உயிரைப் பறிக்க முற்படுகிறவன்
  rationale: ‘உயிரைத் தேடுதல்’ என்ற எபிரெய மரபுத்தொடர் ஒருவரைக் கொல்ல முயல்வதைக் குறிக்கிறது. சொல்லுக்குச் சொல் தமிழாக்கம் தவறான பொருளைத் தரக்கூடும் என்பதால் அதன் சூழற்பொருள் வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: יְבַקֵּשׁ אֶת־נַפְשֶׁךָ
  choice: உன் உயிரையும் பறிக்க முற்படுகிறான்
  rationale: முந்தைய இணை அமைப்பைத் தக்கவைத்து, தமிழின் ‘-உம்’ வழியாக இருவரின் உயிருக்கும் ஒரே ஆபத்து இருப்பதை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: מִשְׁמֶרֶת אַתָּה עִמָּדִי
  choice: என்னுடன் நீ பாதுகாப்பாக இருப்பாய்
  rationale: מִשְׁמֶרֶת என்பது காவல், பாதுகாப்பு அல்லது பாதுகாப்பான பொறுப்பு என்பதைக் குறிக்கலாம். இங்கு அபியத்தார் தன்னுடன் இருந்தால் பாதுகாப்பாக இருப்பார் என்று தாவீது உறுதியளிப்பதே சூழற்பொருள்.
theological_decisions:
- issue: தாவீது அளிக்கும் பாதுகாப்பு உறுதியின் வடிவம்
  choice: என்னுடன் நீ பாதுகாப்பாக இருப்பாய்
  alternative: நீ என்னுடைய பாதுகாப்பில் இருக்கிறாய்
  rationale: எபிரெய இறுதித் தொடர் சுருக்கமான பெயர்ச்சொல் வாக்கியமாகவும் பொருளில் ஓரளவு தெளிவற்றதாகவும் உள்ளது. அதை தாவீதின் பாதுகாப்பு வாக்குறுதியாக இயல்பாக மொழிபெயர்த்தாலும், அவர் முழுமையான பாதுகாப்பைத் தெய்வீக அதிகாரத்துடன் உறுதி செய்கிறார் என்ற கூடுதல் கருத்தைச் சேர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும் வகையில் இயல்பாகவும், வரலாற்றுக் கதையாடலுக்கேற்ற கண்ணியமான நடையிலும் அமைக்கப்பட்டுள்ளது. ‘உயிரைத் தேடுதல்’ என்ற எபிரெய மரபுத்தொடர் தமிழில் குழப்பமளிக்காமல் அதன் கொலைநோக்குப் பொருளில் மொழிபெயர்க்கப்பட்டுள்ளது.
