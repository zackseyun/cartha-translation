base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/022/005.yaml
  text: Then Gad the prophet said to David[a], “Do not stay in the stronghold. Go and come for yourself to the land of Judah.” So David went and came to the forest of Hereth.
translation:
  language: ta
  text: அப்போது இறைவாக்கினரான காத் தாவீதிடம், “நீ அரணில் தங்கியிருக்க வேண்டாம். புறப்பட்டு யூதா நாட்டுக்குள் நுழை[a]” என்றார். எனவே தாவீது புறப்பட்டு ஹேரேத் காட்டுக்குள் நுழைந்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “யூதா நாட்டுக்குச் செல்” என்றும் மொழிபெயர்க்கலாம். இங்குள்ள எபிரெய வினை, சூழலுக்கு ஏற்ப “வரு/உள்நுழை” என்றோ பொதுவாக “செல்” என்றோ பொருள்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנָּבִיא
  choice: இறைவாக்கினரான
  rationale: נָבִיא என்பதற்கான இயல்பான நவீனத் தமிழ் சொல்; வேறொரு எபிரெயச் சொல்லைக் குறிக்கும் ‘ஞானதிருஷ்டிக்காரர்’ போன்ற பொருளை இங்கு சேர்க்கவில்லை.
- source_word: לֹא תֵשֵׁב
  choice: தங்கியிருக்க வேண்டாம்
  rationale: இச்சூழலில் ישׁב என்பது உட்காருதல் என்பதைவிட ஓர் இடத்தில் தொடர்ந்து தங்கியிருப்பதைக் குறிக்கிறது; கட்டளையின் எதிர்மறை வலிமையையும் இத்தொடர் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: בַּמְּצוּדָה
  choice: இந்த அரணில்
  rationale: מְצוּדָה என்பது பாதுகாப்புக்குரிய அரண் அல்லது கோட்டையைக் குறிக்கிறது. முன் சூழலில் அறியப்பட்ட இடம் என்பதால் எபிரெய definite article-ஐ ‘இந்த’ என இயல்பாக வெளிப்படுத்தியது.
- source_word: לֵךְ
  choice: புறப்பட்டு
  rationale: הלך கட்டளையின் இயக்கத்தையும் அங்கிருந்து வெளியேற வேண்டிய சூழலையும் இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: וּבָאתָ לְּךָ אֶרֶץ יְהוּדָה
  choice: யூதா நாட்டுக்குள் நுழை
  rationale: בוא என்பதன் ‘வருதல்/உள்நுழைதல்’ பொருளில் இலக்கை மையப்படுத்தி ‘நுழை’ என மொழிபெயர்க்கப்பட்டது. לְךָ இங்கு தனிப்பட்ட திசை அல்லது வலியுறுத்தலை வழங்கும் மரபுத்தொடராக இருப்பதால் செயற்கையான தற்சுட்டுப் பதம் சேர்க்கப்படவில்லை.
- source_word: אֶרֶץ יְהוּדָה
  choice: யூதா நாடு
  rationale: אֶרֶץ + குலப்பெயர் என்பது யூதாவின் நிலப்பரப்பைக் குறிக்கிறது; வெறும் ‘யூதா’ என்பதைவிட ‘யூதா நாடு’ அந்தப் பிரதேசப் பொருளைத் தெளிவாகக் காக்கிறது.
- source_word: יַעַר חָרֶת
  choice: ஏரேத் காடு
  rationale: יַעַר என்பதற்கு ‘காடு’ நேரான இயல்பான இணை; חָרֶת இடப்பெயராக ‘ஏரேத்’ என ஒலிபெயர்க்கப்பட்டது.
- source_word: וַיָּבֹא
  choice: காட்டுக்குள் நுழைந்தான்
  rationale: முன்னைய בוא வினையுடன் ஒற்றுமை காத்து, காடு என்னும் பரப்பினுள் சென்ற இயக்கத்தைத் தெளிவாக வெளிப்படுத்துகிறது.
