base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/022/008.yaml
  text: For all of you have conspired against me[a], and no one informs me when my son makes a covenant with the son of Jesse, and none of you is grieved for me or informs me that my son has stirred up my servant against me to lie in wait[d][c][b], as at this day.
translation:
  language: ta
  text: நீங்கள் எல்லாரும் எனக்கு எதிராகச் சதி செய்திருக்கிறீர்கள். என் மகன் ஈசாயின் மகனோடு உடன்படிக்கை செய்தபோது, உங்களில் ஒருவனும் அதை எனக்குத் தெரிவிக்கவில்லை[a][d]. உங்களில் ஒருவனும் எனக்காக மனம் வருந்தவுமில்லை[b]; என் மகன் என் பணியாளனை எனக்கு எதிராகத் தூண்டி, இந்நாளில் இருப்பதுபோல பதுங்கிக் காத்திருக்கச் செய்திருக்கிறான்[c] என்பதையும் ஒருவனும் எனக்குத் தெரிவிக்கவில்லை[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மொழியில் சொற்சொல்லாக, ‘என் செவியைத் திறக்கவில்லை’; இது ‘எனக்குத் தெரிவிக்கவில்லை’ என்று பொருள்படும் மரபுத்தொடர்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘உங்களில் ஒருவனும் என்னைக் குறித்து அக்கறைகொள்ளவில்லை.’
    reason: lexical_alternative
  - marker: c
    text: அல்லது, ‘என் பணியாளனை எனக்கு எதிராகப் பதுங்குபவனாக நிறுத்தியிருக்கிறான்.’
    reason: lexical_alternative
  - marker: d
    text: ‘ஈசாயின் மகன்’ என்பது தாவீதைக் குறிக்கிறது; சவுல் தாவீதைப் பெயரால் அழைக்காமல் அவனுடைய தந்தையின் பெயரால் குறிப்பிடுகிறான்.
    reason: cultural_note
lexical_decisions:
- source_word: קְשַׁרְתֶּם
  choice: சதிசெய்திருக்கிறீர்கள்
  rationale: இச்சூழலில் קשר என்பது சாதாரணமாக ஒன்றுசேர்வதை அல்ல, சவுலுக்கு எதிரான துரோகச் சதியைக் குறிக்கிறது.
- source_word: גֹּלֶה אֶת אָזְנִי
  choice: எனக்குத் தெரிவிக்கவில்லை
  rationale: ‘என் செவியைத் திறத்தல்’ என்ற எபிரெய மரபுத்தொடர் தகவலை வெளிப்படுத்தி அறிவிப்பதைக் குறிக்கிறது; நவீன தமிழில் ‘தெரிவித்தல்’ இயல்பானது.
- source_word: בִּכְרָת
  choice: உடன்படிக்கை செய்யும்போது
  rationale: ב உடனான infinitive construct, உடன்படிக்கை நிகழும் காலம் அல்லது சூழ்நிலையைக் காட்டுகிறது; ‘உடன்படிக்கையை வெட்டுதல்’ என்ற சொற்சொல் வடிவத்தைவிட இது இயல்பான தமிழ்.
- source_word: בְּנִי עִם בֶּן יִשַׁי
  choice: என் மகன் ஈசாயின் மகனோடு
  rationale: சவுல் யோனத்தானை ‘என் மகன்’ என்றும் தாவீதைப் பெயரால் அழைக்காமல் ‘ஈசாயின் மகன்’ என்றும் குறிப்பிடும் தூரப்படுத்தும் பேச்சுமுறை பாதுகாக்கப்பட்டுள்ளது.
- source_word: חֹלֶה ... עָלַי
  choice: எனக்காக மனம் வருந்தவுமில்லை
  rationale: இங்கு חלה உடல்நோயைக் குறிக்காமல், சவுலுக்காக இரக்கத்தோடு வருந்துதல் அல்லது அக்கறைகொள்ளுதலைக் குறிக்கிறது.
- source_word: הֵקִים
  choice: தூண்டி ... செய்திருக்கிறான்
  rationale: இந்தச் சூழலில் ‘எழுப்பினான்’ என்பது எதிராகச் செயல்பட ஒருவரைத் தூண்டுதல் அல்லது நிறுத்துதல் என்ற குற்றச்சாட்டைக் கொண்டுள்ளது.
- source_word: עַבְדִּי
  choice: என் பணியாளனை
  rationale: தாவீது அரசவையில் சவுலுக்குக் கீழ்ப்பட்டிருந்த உறவை இது குறிக்கிறது; அடிமைத்தனத்தை முதன்மைப்படுத்தாத ‘பணியாளன்’ பொருத்தமானது.
- source_word: לְאֹרֵב
  choice: பதுங்கித் தாக்கக் காத்திருக்க
  rationale: ארב என்பது மறைந்து காத்திருந்து தாக்குவதைக் குறிக்கிறது; தமிழ் வாக்கியத்தில் குற்றச்சாட்டின் நோக்கம் தெளிவாக வெளிப்படுகிறது.
- source_word: כַּיּוֹם הַזֶּה
  choice: இன்றிருப்பதுபோல்
  rationale: இந்த மரபுத்தொடர் பேச்சாளரின் தற்போதைய நிலையைச் சுட்டுகிறது; இயல்பான தமிழில் நிகழ்கால நிலை பாதுகாக்கப்படுகிறது.
theological_decisions:
- issue: சவுலின் குற்றச்சாட்டு உண்மையா என்பது
  choice: குற்றச்சாட்டை சவுலின் நேரடி கூற்றாகவே மொழிபெயர்த்தல்
  alternative: யோனத்தான் உண்மையில் தாவீதைச் சவுலுக்கு எதிராகத் தூண்டினார் என உரையிலேயே உறுதிப்படுத்துதல்
  rationale: எபிரெய உரை சவுலின் பேச்சை பதிவு செய்கிறது; அதன் வரலாற்று உண்மைத்தன்மையை மொழிபெயர்ப்பு தனியாகத் தீர்மானிக்கக்கூடாது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சவுலின் குற்றஞ்சாட்டும் மற்றும் மனக்கசப்பான தொனி காக்கப்பட்டுள்ளது. ‘ஈசாயின் மகன்’ என்ற பெயர்ப்பதிலி அப்படியே வைக்கப்பட்டு, தாவீதின் பெயரைத் தவிர்க்கும் சவுலின் தூரப்படுத்தும் நடை பாதுகாக்கப்பட்டுள்ளது.
