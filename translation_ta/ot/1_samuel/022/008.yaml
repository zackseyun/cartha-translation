  verdict: revise
  source_fidelity: 'மையப் பொருள் நன்றாக உள்ளது: சவுல் அனைவரும் தனக்கு எதிராகச் சதி செய்ததாகக் குற்றஞ்சாட்டுகிறான்; யோனத்தான் ஈசாயின் மகனோடு உடன்படிக்கை செய்ததை யாரும் அவனுக்குத் தெரிவிக்கவில்லை என்றும், தாவீதைத் தனக்கு எதிராகப் பதுங்கியிருக்கத் தன் மகன் தூண்டியதாகவும் கூறுகிறான். ஆயினும், גֹּלֶה אֶת־אָזְנִי என்ற ஒரே மரபுத்தொடர் வசனத்தில் இருமுறை வருவதால் இரண்டாம் இடத்திலும் அதன் அடிக்குறிப்பு இணைப்பு தேவை. לְאֹרֵב என்பதற்கு ‘பதுங்கித் தாக்கக் காத்திருக்க’ என்பது தாக்குதலைச் சற்றே வெளிப்படையாகச் சேர்க்கிறது; ‘பதுங்கிக் காத்திருக்க’ என்பது மூலத்தின் ‘பதுங்குதல்/பதுங்கியிருத்தல்’ நுட்பத்தைப் பாதுகாக்கும்.'
