translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான அரசவைக் கூறுபாடு பயன்படுத்தப்பட்டுள்ளது. ‘அரசர்’ என்ற மூன்றாம் நபர் மரியாதைச் சுட்டிலிருந்து ‘உமது பணியாளன்’ என்ற நேரடி மரியாதைச் சுட்டுக்கு மூலத்தில் நிகழும் மாற்றம் பாதுகாக்கப்பட்டுள்ளது.
