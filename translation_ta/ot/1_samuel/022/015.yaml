source:
  edition: WLC
  text: הַ/יּ֧וֹם הַחִלֹּ֛תִי ל/שאול ל֥/וֹ בֵ/אלֹהִ֖ים חָלִ֣ילָ/ה לִּ֑/י אַל יָשֵׂם֩ הַ/מֶּ֨לֶךְ בְּ/עַבְדּ֤/וֹ דָבָר֙ בְּ/כָל בֵּ֣ית אָבִ֔/י כִּ֠י לֹֽא יָדַ֤ע עַבְדְּ/ךָ֙ בְּ/כָל זֹ֔את דָּבָ֥ר קָטֹ֖ן א֥וֹ גָדֽוֹל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/022/015.yaml
  text: Was today the first time that I inquired of God for him? Far be it from me! Let not the king impute anything to his servant or to all my father’s house[a], for your servant knew nothing of all this, whether small or great.
translation:
  language: ta
  text: “அவனுக்காக நான் கடவுளிடம் விசாரித்தது இன்றுதான் முதல்முறையா?[a] அப்படிப்பட்ட எண்ணமே எனக்கு இல்லை! அரசர் தமது பணியாளன்மீதும் என் தந்தையின் குடும்பத்தார் அனைவர்மீதும் எந்தப் பழியையும் சுமத்த வேண்டாம். ஏனெனில், சிறிதோ பெரிதோ, இந்தக் காரியத்தைப் பற்றி உமது பணியாளனாகிய எனக்கு எதுவுமே தெரியாது.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இன்னும் சொற்சொல்லாக, “அவனுக்காகக் கடவுளிடம் விசாரிக்க நான் இன்றுதான் தொடங்கினேனா?” இந்த எபிரெய வினா, அகிமெலேக்கு இதற்கு முன்பும் தாவீதுக்காக அவ்வாறு விசாரித்திருந்தார் என்பதை உணர்த்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַיּוֹם הַחִלֹּתִי
  choice: இன்றுதான் முதல்முறையா?
  rationale: எழுத்துப்படி ‘இன்று நான் தொடங்கினேனா?’ என்ற வினாவை, இது புதிய நடைமுறை அல்ல என்பதை உணர்த்தும் இயல்பான தமிழ் வினாவாகத் தருகிறது; அதன் முறையான மாற்று அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: לִשְׁאוֹל לוֹ בֵאלֹהִים
  choice: அவனுக்காக நான் கடவுளிடம் விசாரித்தது
  rationale: שׁאל בֵאלֹהִים என்பது கடவுளின் வழிகாட்டுதலை அல்லது தீர்ப்பை நாடுவதைக் குறிக்கிறது; לוֹ-வின் பயனாளிப் பொருளை ‘அவனுக்காக’ காக்கிறது.
- source_word: חָלִילָה לִּי
  choice: அப்படிப்பட்ட எண்ணமே எனக்கு இல்லை!
  rationale: பேச்சாளரின் வலுவான மறுப்பை இயல்பான, கண்ணியமான தமிழில் தெரிவிக்கிறது; சூழலில் குற்றச்சதியில் பங்கு கொண்டதாகக் கூறப்படுவதை அவர் முற்றிலும் மறுக்கிறார்.
- source_word: אַל יָשֵׂם ... בְּעַבְדּוֹ דָבָר
  choice: தமது பணியாளன்மீது எந்தப் பழியையும் சுமத்த வேண்டாம்
  rationale: שׂים + ב இங்கு ஒருவர்மீது ஒரு காரியத்தைச் சுமத்தும் குற்றஞ்சாட்டும் பொருளைக் கொண்டது; ‘பழி சுமத்துதல்’ அந்த நீதிசார் நுணுக்கத்தைத் தெளிவாகத் தருகிறது.
- source_word: בְּכָל בֵּית אָבִי
  choice: என் தந்தையின் குடும்பத்தார் அனைவர்மீதும்
  rationale: ‘தந்தையின் வீடு’ என்பது விரிவான குடும்பத்தார் அல்லது குலத்தாரைக் குறிக்கும் எபிரெய மரபுத்தொடர்; நவீன தமிழில் அதன் பொருளைத் தெளிவாக வழங்குகிறது.
- source_word: לֹא יָדַע עַבְדְּךָ בְּכָל זֹאת
  choice: இந்தக் காரியத்தைப் பற்றி உமது பணியாளனாகிய எனக்கு எதுவுமே தெரியாது
  rationale: அகிமெலேக்கின் மரியாதையான தன்னைக் குறிக்கும் சொல்லையும், முழுமையான அறியாமை மறுப்பையும் இயல்பான தமிழில் காக்கிறது.
- source_word: דָּבָר קָטֹן אוֹ גָדוֹל
  choice: சிறிதோ பெரிதோ
  rationale: முழுமையைக் குறிக்கும் ‘சிறியது அல்லது பெரியது’ என்ற இருமுனைச் சொல்லாட்சியைச் சுருக்கமான இயல்பான தமிழில் பாதுகாக்கிறது.
