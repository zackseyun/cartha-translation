  text: וַ/יֵּ֤לֶךְ דָּוִד֙ מִ/שָּׁ֔ם וַ/יִּמָּלֵ֖ט אֶל מְעָרַ֣ת עֲדֻלָּ֑ם וַ/יִּשְׁמְע֤וּ אֶחָי/ו֙ וְ/כָל בֵּ֣ית אָבִ֔י/ו וַ/יֵּרְד֥וּ אֵלָ֖י/ו שָֽׁמָּ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/022/001.yaml
  text: So David went from there and escaped to the cave of Adullam. When his brothers and all his father's household heard[a], they went down there to him.
translation:
  language: ta
  text: அதன்பின் தாவீது அங்கிருந்து புறப்பட்டு, அதுல்லாம் குகைக்குத் தப்பிச் சென்றார்.[a] அவருடைய சகோதரர்களும் அவருடைய தந்தையின் குடும்பத்தார் அனைவரும் அதைக் கேள்விப்பட்டபோது, அங்கே அவரிடம் இறங்கிச் சென்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அதுல்லாம் குகைக்கு ஓடினார்.” எபிரெய வினைச்சொல் தப்புவதையோ ஓடுவதையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ מִשָּׁם
  choice: அங்கிருந்து புறப்பட்டு
  rationale: הלך என்ற பொதுவான நகர்வுச் சொல்லையும் מן அங்கிருந்து என்ற இடக் குறிப்பையும் இயல்பான தமிழ் தொடர் வினையாகத் தருகிறது.
- source_word: וַיִּמָּלֵט
  choice: தப்பிச் சென்றார்
  rationale: מלט என்பதன் நிஃபால் வடிவம் ஆபத்திலிருந்து வெற்றிகரமாகத் தப்பியதைக் குறிக்கிறது; வெறும் ஓட்டமாகவோ புகலிடம் அடைந்ததாகவோ கூடுதலாக விளக்கவில்லை.
- source_word: מְעָרַת עֲדֻלָּם
  choice: அதுல்லாம் குகை
  rationale: இடப்பெயருடன் அமைந்த எபிரெயக் கூட்டுச்சொல்லை நேரடியாகவும் தமிழில் இயல்பாகவும் வழங்குகிறது.
- source_word: וַיִּשְׁמְעוּ
  choice: இதைக் கேள்விப்பட்டபோது
  rationale: கேட்ட செய்தியின் உள்ளடக்கம் எபிரெயத்தில் வெளிப்படையாகச் சொல்லப்படாவிட்டாலும், முந்தைய நிகழ்வைச் சுட்டும் ‘இதை’ தமிழில் தேவையான இயல்பான நிறைவைக் கொடுக்கிறது.
- source_word: אֶחָיו
  choice: அவருடைய சகோதரர்கள்
  rationale: ஆண்பால் பன்மையான மூலச்சொல்லைத் துல்லியமாகப் பிரதிபலிக்கிறது.
- source_word: כָל בֵּית אָבִיו
  choice: அவருடைய தந்தையின் குடும்பத்தார் அனைவரும்
  rationale: בֵּית אָבִיו இங்கு கட்டிடத்தை அல்ல, தந்தைவழிக் குடும்ப அலகைக் குறிக்கிறது; ‘குடும்பத்தார்’ நவீன தமிழில் அந்தப் பொருளைத் தெளிவாகத் தருகிறது.
- source_word: וַיֵּרְדוּ
  choice: இறங்கிச் சென்றார்கள்
  rationale: ירד என்பதிலுள்ள கீழ்நோக்கிய, ஒருவேளை நிலவியல் சார்ந்த நகர்வைத் தக்கவைக்கிறது.
- source_word: אֵלָיו שָׁמָּה
  choice: அங்கே அவரிடம்
  rationale: தாவீது இருந்த இடத்தையும் அவரை நோக்கிய நகர்வையும் தமிழின் இயல்பான சொல்வரிசையில் பாதுகாக்கிறது.
