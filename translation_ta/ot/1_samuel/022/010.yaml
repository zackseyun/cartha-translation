  yaml_path: translation/ot/1_samuel/022/010.yaml
  text: And he inquired of Yahweh for him[a], and gave him provisions, and gave him the sword of Goliath the Philistine.
translation:
  language: ta
  text: அவனுக்காக அவர் யாவேயிடம் விசாரித்தார்[a]; அவனுக்கு உணவுப் பொருள்களைக் கொடுத்தார்; பெலிஸ்தியனான கோலியாத்தின் வாளையும் அவனுக்குக் கொடுத்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவனுக்காக யாவேயிடம் ஆலோசனை கேட்டார்.”
    reason: שׁאל + ב + இறைபெயர் என்ற அமைப்பு இறைவனிடம் வழிகாட்டலை விசாரித்தல் அல்லது ஆலோசனை கேட்டல் என்ற பொருளைக் கொண்டிருக்கலாம்.
lexical_decisions:
- source_word: וַיִּשְׁאַל לוֹ בַּיהוָה
  choice: அவன் சார்பாக அவர் யெகோவாவிடம் விசாரித்தார்
  rationale: שׁאל + ב + இறைபெயர் என்பது இறைவனிடம் வழிகாட்டுதல் விசாரிப்பதைக் குறிக்கிறது; לוֹ இங்கே ‘அவன் சார்பாக’ எனப் பொருள்படுகிறது.
- source_word: בַּיהוָה
  choice: யெகோவாவிடம்
  rationale: மூலத்தில் உள்ள יהוה என்ற தனிப்பட்ட இறைபெயரைத் தமிழில் பரவலாக அறியப்படும் ‘யெகோவா’ என நேரடியாகப் பெயர்த்துள்ளது.
- source_word: צֵידָה
  choice: பயண உணவுப் பொருள்கள்
  rationale: இந்தச் சொல் பொதுவான உணவை மட்டும் அல்லாமல் பயணத்திற்கான உணவு அல்லது வாழ்வாதாரப் பொருள்களைக் குறிக்கலாம்; சூழலில் இயல்பாக இருக்க இவ்வாறு மொழிபெயர்க்கப்பட்டது.
- source_word: נָתַן לוֹ
  choice: அவனுக்குக் கொடுத்தார்
  rationale: எபிரெய உரையில் இருமுறை வரும் נתן அமைப்பைத் தமிழிலும் மீண்டும் பயன்படுத்தி குற்றச்சாட்டின் தொடரைத் தக்கவைத்துள்ளது.
- source_word: וְאֵת חֶרֶב גָּלְיָת הַפְּלִשְׁתִּי
  choice: பெலிஸ்தியனான கோலியாத்தின் வாளையும்
  rationale: உடைமைத் தொடர்பையும் கோலியாத்தை அடையாளப்படுத்தும் ‘பெலிஸ்தியன்’ என்பதையும் தெளிவாகவும் இயல்பாகவும் தருகிறது.
theological_decisions:
- issue: יהוה என்ற இறைபெயரின் மொழிபெயர்ப்பு
  choice: யெகோவா
  alternative: யாவே
  rationale: மூல உரை பொதுப்பட்டத்தை அல்ல, நான்கெழுத்து இறைபெயரையே பயன்படுத்துகிறது. அதை மறைக்காமல் தனிப்பட்ட பெயராகத் தமிழில் வழங்குகிறது; உச்சரிப்பு மரபுகள் வேறுபடுவதால் ‘யாவே’ மாற்றாகக் கொள்ளலாம்.
translation_notes:
  register: நவீனத் தரத் தமிழ்; மரியாதைமிக்க, பொதுவாசகர்களுக்குப் புரியும் நடை. ‘அவர்’ அகிமெலேக்கையும் ‘அவன்’ தாவீதையும் வேறுபடுத்த உதவுகிறது; மூலத்தின் தொடர்ச்சியான ‘கொடுத்தார்’ அமைப்பு பாதுகாக்கப்பட்டுள்ளது.
