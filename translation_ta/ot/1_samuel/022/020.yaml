base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/022/020.yaml
  text: But one son of Ahimelech son of Ahitub escaped[a], and his name was Abiathar, and he fled after David.
translation:
  language: ta
  text: ஆனால், அகித்தூபின் மகனாகிய அகிமெலேக்கின் மகன்களில் ஒருவன் தப்பினான்; அவன் பெயர் அபியத்தார்; அவன் தாவீதைப் பின்தொடர்ந்து ஓடிப்போனான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவன் தாவீதிடம் ஓடிப்போனான்.” எபிரெயில் சொல்லுக்குச் சொல், “அவன் தாவீதின் பின்னால் ஓடிப்போனான்”; இது அவருடன் சேர்வதற்காக அவரைப் பின்தொடர்ந்து சென்றதைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּמָּלֵט
  choice: தப்பித்தான்
  rationale: முந்தைய படுகொலையிலிருந்து வெற்றிகரமாகத் தப்பியதைக் குறிக்கும் நிஃபால் வடிவத்தின் பொருளை இயல்பாகத் தெரிவிக்கிறது.
- source_word: בֵּן אֶחָד
  choice: மகன்களில் ஒருவன்
  rationale: சொல்லுக்கு நெருக்கமாக ‘ஒரு மகன்’ என்றாலும், அகிமெலேக்கின் மகன்களில் ஒருவன் மட்டும் தப்பினான் என்ற வலியுறுத்தலைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: לַאֲחִימֶלֶךְ בֶּן אֲחִטוּב
  choice: அகித்தூபின் மகன் அகிமெலேக்கின்
  rationale: உறவைக் குறிக்கும் ל முன்னொட்டையும் எபிரெய மரபுவழி அடையாளத்தையும் தெளிவாகக் காக்கிறது.
- source_word: וּשְׁמוֹ אֶבְיָתָר
  choice: அவன் பெயர் அபியத்தார்
  rationale: எளிய பெயரிடும் வாக்கியத்தை நவீன தமிழில் நேரடியாக வழங்குகிறது.
- source_word: וַיִּבְרַח
  choice: தப்பியோடினான்
  rationale: ברח என்பதன் ‘ஓடிப்போதல்/தப்பியோடுதல்’ பொருளைத் தெரிவித்து, முன் வரும் ‘தப்பித்தான்’ என்பதிலிருந்து வினைச்சொல் வேறுபாட்டை இயன்றவரை காக்கிறது.
- source_word: אַחֲרֵי דָוִד
  choice: தாவீதுக்குப் பின்னால்
  rationale: எபிரெயின் நேரடியான ‘தாவீதுக்குப் பின்’ என்ற உருவகத்தைப் பாதுகாக்கிறது; அவருடன் சேர்வதற்காக அவரைப் பின்தொடர்ந்தான் என்ற சூழல்சார் பொருளையும் அனுமதிக்கிறது.
- source_word: וַ
  choice: ஆனால்
  rationale: முந்தைய படுகொலைக்கு மாறாக ஒருவன் தப்பியதைத் தொடக்க இணைப்புச் சொல் சுட்டுவதால், மென்மையான எதிர்மறைத் தொடர்பை வெளிப்படுத்துகிறது.
- source_word: אֶבְיָתָר / אֲחִימֶלֶךְ / אֲחִטוּב / דָוִד
  choice: அபியத்தார் / அகிமெலேக்கு / அகித்தூபு / தாவீது
  rationale: தமிழ் வேதாகமப் பெயர் ஒலிபெயர்ப்பு மரபுக்கு ஏற்ற வடிவங்கள்; உருபுகள் சேரும்போது இயல்பாக மாற்றப்பட்டுள்ளன.
theological_decisions:
- issue: அபியத்தார் தாவீதுக்குப் ‘பின்னால்’ ஓடியதன் நோக்கம்
  choice: மூலத்தின் ‘தாவீதுக்குப் பின்னால்’ என்ற தெளிவற்ற வடிவத்தை முதன்மை உரையில் காத்தல்
  alternative: ‘தாவீதிடம் தப்பியோடினான்’ அல்லது ‘தாவீதுடன் சேரும்படி ஓடினான்’
  rationale: சூழலில் தாவீதிடம் சென்று சேர்ந்தது சாத்தியமான பொருளாக இருந்தாலும், எபிரெய வாசகம் இலக்கைத் தெளிவாகச் சொல்லாமல் ‘பின்னால்/பின்’ என்கிறது; ஆகவே விளக்கத்தை அடிக்குறிப்பில் தருவது பொருத்தமானது.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் தமிழ் பயன்படுத்தப்பட்டுள்ளது. எபிரெய கதைநடைத் தொடர் தமிழில் சுருக்கமான வாக்கியங்களாகப் பிரிக்கப்பட்டுள்ளது; உண்மையான இடவியல்/நோக்கத் தெளிவின்மை அடிக்குறிப்புடன் பாதுகாக்கப்பட்டுள்ளது.
