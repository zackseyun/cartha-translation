base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/022/022.yaml
  text: David said to Abiathar[a], “I knew on that day, when Doeg the Edomite was there, that he would surely tell Saul[c][b]. I am responsible for all the lives of your father’s house.”
translation:
  language: ta
  text: தாவீது அபியத்தாரிடம், “ஏதோமியனான தோயேகு அங்கே இருந்தபோது[a], அவன் சவுலிடம் நிச்சயமாகச் சொல்வான்[b] என்று அன்றே எனக்குத் தெரிந்தது. உன் தந்தையின் குடும்பத்திலுள்ள ஒவ்வொருவரின் மரணத்திற்கும் நானே காரணம்[c]” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஏதோமியனான தோயேகு அங்கே இருந்ததை.” எபிரெய இணைப்புச்சொல் காலச் சூழ்நிலையைக் குறிப்பதாகவும், தாவீது அறிந்திருந்ததன் உள்ளடக்கத்தை அறிமுகப்படுத்துவதாகவும் கொள்ளப்படலாம்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில் அதே வேரின் முற்றா வினை வடிவமும் வினைமுற்றும் இணைந்து, சொல்லும் செயலை வலியுறுத்துகின்றன; சொல்லுக்குச் சொல், “சொல்லுதல், அவன் சொல்வான்.”
    reason: lexical_alternative
  - marker: c
    text: எபிரெயத்தில், சொல்லுக்குச் சொல், “உன் தந்தையின் வீட்டின் ஒவ்வோர் உயிருக்கும நானே காரணமானேன்.” இச்சூழலில், அவர்களுடைய மரணத்திற்குத் தாவீது காரணம் எனப் பொருள்படும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָדַעְתִּי
  choice: எனக்குத் தெரிந்தது
  rationale: ידע என்பதன் இறந்தகால அறிவை இயல்பான நவீனத் தமிழில் நேரடியாகக் காட்டுகிறது; தாவீது பின்னர் உணர்ந்தார் என்ற பொருளைச் சேர்க்கவில்லை.
- source_word: בַּיּוֹם הַהוּא
  choice: அன்றே
  rationale: குறிப்பிட்ட அந்த நாளிலேயே தாவீதுக்கு இது தெரிந்திருந்தது என்ற காலச் சுட்டையும் வலியுறுத்தலையும் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: כִּי שָׁם דויג הָאֲדֹמִי
  choice: ஏதோமியனான தோவேகு அங்கே இருந்தபோது
  rationale: முதல் כִּי-யைச் சூழ்நிலை அல்லது காலத் துணைவாக்கியமாக எடுத்துக்கொள்வது தொடரைத் தமிழில் தெளிவாக்குகிறது; அது அறிந்ததன் உள்ளடக்கத்தை அறிமுகப்படுத்தும் ‘இருந்ததை’ என்றும் கொள்ளலாம் என்பதால் அடிக்குறிப்பு தரப்பட்டுள்ளது.
- source_word: כִּי הַגֵּד יַגִּיד לְשָׁאוּל
  choice: அவன் சவுலிடம் நிச்சயமாகத் தெரிவிப்பான்
  rationale: முற்றுவினையுடன் வந்துள்ள infinitive absolute தரும் வலியுறுத்தலை ‘நிச்சயமாக’ என்பதால் காட்டுகிறது; எபிரெயத்தில் வெளிப்படையான செயப்படுபொருள் இல்லாததால் அதைச் சேர்க்கவில்லை.
- source_word: אָנֹכִי
  choice: நானே
  rationale: தனித்த சுட்டுப்பெயரின் வலியுறுத்தலைத் தமிழின் ‘-ஏ’ விகுதி இயல்பாக வெளிப்படுத்துகிறது.
- source_word: סַבֹּתִי
  choice: பொறுப்பு
  rationale: இங்கு סבב தாவீது நடந்த அழிவுக்குத் தானே காரணம் அல்லது பொறுப்பு என ஏற்றுக்கொள்வதைக் குறிக்கிறது; நவீனத் தமிழில் ‘பொறுப்பு’ இந்த ஒப்புதலைத் தெளிவாகத் தருகிறது.
- source_word: בְּכָל נֶפֶשׁ
  choice: அனைவரும் உயிரிழந்ததற்கு
  rationale: נֶפֶשׁ இங்கு குடும்பத்திலுள்ள ஒவ்வொரு உயிரையும் அல்லது நபரையும் குறிக்கிறது; உடனடி படுகொலைச் சூழலில் தமிழில் உயிரிழப்பைக் குறிப்பது பொருளை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: בֵּית אָבִיךָ
  choice: உன் தந்தையின் குடும்பத்தார்
  rationale: ‘தந்தையின் வீடு’ என்ற எபிரெய மரபுத்தொடர் கட்டிடத்தை அல்ல, குடும்பம் அல்லது வீட்டாரைக் குறிக்கிறது; ‘குடும்பத்தார்’ நவீனத் தமிழில் தெளிவானது.
theological_decisions:
- issue: தாவீதின் பொறுப்பின் தன்மை
  choice: ‘உயிரிழந்ததற்கு நானே பொறுப்பு’ என்று அவரது குற்றப்பொறுப்பு ஒப்புதலைக் காட்டுதல்
  alternative: ‘அனைவரையும் நானே கொன்றேன்’ அல்லது வெறும் ‘அவர்களின் உயிர்களுக்கு நான் பொறுப்பு’
  rationale: எபிரெயச் சொல் தாவீது நேரடியாகக் கொலை செய்தார் என்று கூறாமல், அந்த விளைவுக்குத் தானே காரணம் அல்லது பொறுப்பு என ஒப்புக்கொள்வதைக் குறிக்கிறது. ஆகவே நேரடிக் கொலைச் செயலை அவர்மீது சுமத்தாமலும் அவரது பொறுப்பை மங்கச் செய்யாமலும் மொழிபெயர்க்கப்பட்டுள்ளது.
translation_notes:
  register: மொழிநடை நவீனத் தரத் தமிழாகவும், உரையாடலுக்கு ஏற்ற இயல்புடனும், வேதாகம வரலாற்றுரைக்குரிய கண்ணியத்துடனும் அமைக்கப்பட்டுள்ளது. ‘ஏதோமியனான,’ ‘நிச்சயமாக,’ ‘நானே பொறுப்பு’ ஆகியவை மூலத்தின் அடையாளம், வலியுறுத்தல், பொறுப்பேற்றல் ஆகியவற்றைப் பாதுகாக்கின்றன.
