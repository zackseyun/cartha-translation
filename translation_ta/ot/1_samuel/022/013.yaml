base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/022/013.yaml
  text: Saul said to him[a], “Why have you and the son of Jesse conspired against me, by giving him bread and a sword and by inquiring of God for him, so that he has risen against me to lie in wait[b], as on this day?”
translation:
  language: ta
  text: சவுல் அவனிடம், “நீயும் ஈசாயின் மகனும் எனக்கு எதிராக ஏன் சதிசெய்தீர்கள்? நீ அவனுக்கு அப்பமும் வாளும் கொடுத்து, அவனுக்காகக் கடவுளிடம் விசாரித்து, இன்று இருப்பதுபோல அவன் எனக்கு எதிராக எழுந்து பதுங்கிக் காத்திருப்பதற்காகவா[a]?” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவன் எனக்கு எதிராக எழுந்து பதுங்கிக் காத்திருக்கிறான்; இன்று இருப்பதுபோல.”
    reason: லָקוּם ... לְאֹרֵב தொடர் நோக்கத்தையும் விளைவையும் குறிக்கக்கூடும்; כַּיּוֹם הַזֶּה தற்போதைய வெளிப்பட்ட நிலையைச் சுட்டுகிறது.
lexical_decisions:
- source_word: קְשַׁרְתֶּם
  choice: சதிசெய்தீர்கள்
  rationale: அரசனுக்கு எதிராகக் கூட்டாகத் திட்டமிடுதல் என்ற அரசியல் சூழலுக்குரிய பொருளைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: בֶן־יִשָׁי
  choice: ஈசாயின் மகன்
  rationale: தாவீதின் பெயரைச் சொல்லாமல் சவுல் பயன்படுத்தும் தந்தைவழிக் குறிப்பையும் அதிலுள்ள விலகிய, இகழ்ச்சியான தொனியையும் பாதுகாக்கிறது.
- source_word: בְּתִתְּךָ לוֹ לֶחֶם וְחֶרֶב
  choice: நீ அவனுக்கு அப்பமும் வாளும் கொடுத்து
  rationale: ב முன்னொட்டுடன் வரும் வினையெச்சத் தொடரின் வழிமுறை அல்லது உடனிகழ்வுப் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: וְשָׁאוֹל לוֹ בֵּאלֹהִים
  choice: அவனுக்காகக் கடவுளிடம் விசாரித்தாய்
  rationale: ஆசாரியர்மூலம் இறைவழிகாட்டுதலை நாடும் சூழலை ‘கடவுளிடம் விசாரித்தல்’ துல்லியமாகக் காட்டுகிறது.
- source_word: בֵּאלֹהִים
  choice: கடவுளிடம்
  rationale: மூலத்தில் יהוה அல்ல, אֱלֹהִים இருப்பதால் இறைப்பெயரை மாற்றாமல் ‘கடவுள்’ எனத் தரப்படுகிறது.
- source_word: לָקוּם אֵלַי
  choice: அவன் எனக்கு எதிராக எழுந்து
  rationale: சவுலுக்கு எதிரான செயலில் இறங்கியதாக அவன் முன்வைக்கும் குற்றச்சாட்டைத் தமிழில் தெளிவாகத் தருகிறது.
- source_word: לְאֹרֵב
  choice: பதுங்கிக் காத்திருக்கிறான்
  rationale: ארב என்பதன் பகைநோக்குடன் மறைந்து தாக்கக் காத்திருக்கும் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: כַּיּוֹם הַזֶּה
  choice: இப்போது
  rationale: காணக்கூடிய தற்போதைய நிலையைச் சுட்டும் எபிரெய மொழிமரபை நவீன தமிழில் இயல்பாகக் கொடுக்கிறது.
theological_decisions:
- issue: בֵּאלֹהִים என்பதில் வரும் இறைக் குறிப்பு
  choice: கடவுள்
  alternative: ஆண்டவர்
  rationale: மூல எபிரெய உரையில் உடன்படிக்கைப் பெயரான יהוה அல்லாமல் אֱלֹהִים உள்ளது; ஆகவே ‘கடவுள்’ என்பதே மூலச் சொல்லை நேரடியாகப் பிரதிபலிக்கிறது.
- issue: לָקוּם ... לְאֹרֵב தொடரின் விளைவு அல்லது நோக்கப் பொருள்
  choice: அதன் விளைவாக, இப்போது அவன் ... எழுந்து பதுங்கிக் காத்திருக்கிறான்
  alternative: அவன் ... எழுந்து பதுங்கிக் காத்திருக்கும்படி
  rationale: כַּיּוֹם הַזֶּה தற்போதைய நிலையை வலியுறுத்துவதால் முதன்மை உரையில் விளைவுப் பொருள் தேர்ந்தெடுக்கப்பட்டது; வினையெச்சத் தொடரில் சாத்தியமான நோக்கப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. சவுலின் குற்றஞ்சாட்டும் தொனியும் ‘ஈசாயின் மகன்’ என்ற விலகிய குறிப்பும் பாதுகாக்கப்பட்டுள்ளன.
