base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/022/018.yaml
  text: Then the king said to Doeg[a], “Turn and strike down the priests.” So Doeg the Edomite turned and struck down the priests, and on that day he put to death eighty-five men who wore a linen ephod.
translation:
  language: ta
  text: அப்போது அரசன் தோவேக்கிடம், “திரும்பி ஆசாரியர்களைத் தாக்கு[a]” என்றான். ஆகவே ஏதோமியனாகிய தோவேக்கு திரும்பி ஆசாரியர்களைத் தாக்கினான். அன்று அவன் சணல் துணியாலான ஏபோத்தை அணிந்திருந்த எண்பத்தைந்து பேரைக் கொன்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஆசாரியர்கள்மேல் பாய்ந்து விழு.” எபிரெய வினைச்சொல் பொதுவாக வன்முறையுடன் தாக்குவதைக் குறிக்கலாம். பின்னர் எண்பத்தைந்து பேரைக் ‘கொன்றான்’ என்று விளைவு தனியாகச் சொல்லப்படுவதால், இங்கே ‘தாக்கு’ என்று மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: סֹב
  choice: திரும்பி
  rationale: கட்டளையின் திடீர்மையையும் இலக்கை நோக்கித் திரும்பிச் செயல்படுவதையும் இயல்பான தமிழில் காட்டுகிறது.
- source_word: וּפְגַע / וַיִּפְגַּע
  choice: தாக்கு / தாக்கினான்
  rationale: פגע என்பதன் வன்முறைத் தாக்குதல் என்ற பரப்பைத் தக்கவைக்கிறது; பின்னர் வரும் causative מות என்பதோடு இதை நேரடியாக ‘கொல்’ என்று ஒன்றாக்குவதில்லை.
- source_word: הַכֹּהֲנִים
  choice: ஆசாரியர்கள்
  rationale: குறிப்பிட்ட பன்மைப் பெயரின் நேரடியான, வழக்கிலுள்ள வேதாகமத் தமிழ் இணைச்சொல்.
- source_word: הָאֲדֹמִי
  choice: ஏதோமியனான
  rationale: தோவேக்கின் இன அடையாளத்தைக் குறிப்பதற்கான இயல்பான தமிழ் வடிவம்.
- source_word: וַיָּמֶת
  choice: கொன்றான்
  rationale: ஹிஃபில் causative வடிவத்தின் ‘மரிக்கச் செய்தான்’ என்ற பொருளை இயல்பாகவும் தெளிவாகவும் அளிக்கிறது; முந்தைய ‘தாக்கினான்’ என்பதிலிருந்து விளைவை வேறுபடுத்துகிறது.
- source_word: שְׁמֹנִים וַחֲמִשָּׁה אִישׁ
  choice: எண்பத்தைந்து பேர்
  rationale: எண்ணுக்குப் பின் வரும் אישׁ-ஐ நவீன தமிழில் இயல்பாகவும் மனிதர்களைக் குறிக்கும் மரியாதைமிக்க வடிவிலும் தருகிறது.
- source_word: נֹשֵׂא אֵפוֹד בָּד
  choice: நாரினாலான ஏபோத்தை அணிந்திருந்த
  rationale: ஆடையைச் சுமத்தல்/அணிதல் என்ற נשא-வின் சூழல்சார் பொருளை ‘அணிந்திருந்த’ எனவும், בָּד-ஐ நார் துணி எனவும் வெளிப்படுத்துகிறது.
- source_word: וַיֹּאמֶר הַמֶּלֶךְ
  choice: அப்போது அரசன் ... என்றான்
  rationale: வாவ் தொடர்ச்சியின் கதை முன்னேற்றத்தை நவீன தமிழில் இயல்பாகக் காட்டுகிறது.
