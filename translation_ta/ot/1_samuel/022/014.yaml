base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/022/014.yaml
  text: Ahimelech answered the king and said[a], “And who among all your servants is as faithful as David, the king’s son-in-law, who has access to your council[b], and is honored in your house?”
translation:
  language: ta
  text: 'அகிமெலேக்கு அரசனுக்குப் பதிலளித்தான்: “உமது பணியாளர்கள் அனைவரிலும் தாவீதைப் போல் நம்பிக்கைக்குரியவர் யார்? அவர் அரசரின் மருமகனும், உமது ஆணைக்குச் செவிசாய்ப்பவரும்[a], உமது வீட்டில் மதிப்புப் பெற்றவரும்[b] அல்லவா?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “உமது ஆணைப்படி நடப்பவர்” என்றும் மொழிபெயர்க்கலாம். எபிரேயச் சொற்றொடர் சொல்லர்த்தமாக உமது ஆணை அல்லது அழைப்பை நோக்கித் திரும்பி, அதற்குச் செவிசாய்ப்பதைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: சொல்லர்த்தமாக, “உமது வீட்டில்.” இங்கு அது அரசரின் குடும்பத்தார், அரண்மனைப் பணியாளர் குழு அல்லது அரசவையைக் குறிக்கலாம்.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעַן אֲחִימֶלֶךְ אֶת־הַמֶּלֶךְ
  choice: அகிமெலேக்கு அரசனுக்குப் பதிலளித்தான்
  rationale: ענה என்பதன் வழக்கமான கதைநடைப் பொருளான ‘பதிலளித்தான்’ என்பதை இயல்பான தமிழில் தருகிறது; தனிப்பெயர் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: וּמִי בְכָל־עֲבָדֶיךָ
  choice: உமது பணியாளர்கள் அனைவரிலும் ... யார்?
  rationale: எபிரேயப் பகுதிப்பொருள் வினாவைத் தெளிவான தமிழில் தருகிறது; עֲבָדִים என்பதைக் குறிப்பிட்ட பதவி என மிகைப்படுத்தாமல் ‘பணியாளர்கள்’ என மொழிபெயர்க்கிறது.
- source_word: כְּדָוִד נֶאֱמָן
  choice: தாவீதைப் போல் நம்பிக்கைக்குரியவர்
  rationale: נֶאֱמָן குறிக்கும் நம்பகத்தன்மையையும் விசுவாசமான பற்றுறுதியையும் இச்சூழலில் ‘நம்பிக்கைக்குரியவர்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וַחֲתַן הַמֶּלֶךְ
  choice: அரசரின் மருமகன்
  rationale: தாவீதுக்கும் அரசனாகிய சவுலுக்கும் இடையிலான உறவை நேரடியாகக் கூறுகிறது.
- source_word: וְסָר אֶל־מִשְׁמַעְתֶּךָ
  choice: உமது ஆணைக்குச் செவிசாய்ப்பவர்
  rationale: סָר என்பதிலுள்ள ‘திரும்புதல்/சார்தல்’ கருத்தையும் מִשְׁמַעַת என்பதிலுள்ள கேட்டுக் கீழ்ப்படிதல் அல்லது ஆணை என்ற கருத்தையும் இயல்பான தமிழில் இணைக்கிறது; ‘அரசாலோசனையை அணுகுபவர்’ எனப் பொருளை உறுதிப்படுத்தவில்லை.
- source_word: וְנִכְבָּד בְּבֵיתֶךָ
  choice: உமது அரண்மனையில் மதிப்புப் பெற்றவர்
  rationale: נִכְבָּד என்பதற்கு ‘மதிப்புப் பெற்றவர்’ என்றும், அரசனைச் சார்ந்த בֵּיתֶךָ என்பதற்கு இச்சூழலில் இயல்பான ‘அரண்மனை’ என்றும் தருகிறது; ‘வீடு/குடும்பம்/அரசவை’ என்ற பொருள் பரப்பை அடிக்குறிப்பு பதிவு செய்கிறது.
theological_decisions:
- issue: וְסָר אֶל־מִשְׁמַעְתֶּךָ என்பதன் அரிதான சொற்றொடர்
  choice: உமது ஆணைக்குச் செவிசாய்ப்பவர்
  alternative: உமது ஆலோசனைக் குழுவை அணுகும் உரிமையுள்ளவர்
  rationale: எபிரேயச் சொற்கள் கேட்டுக் கீழ்ப்படிதல் அல்லது ஆணைக்குப் பதிலளித்தல் என்ற பொருளை நேரடியாக ஆதரிக்கின்றன. ‘ஆலோசனைக் குழு’ என்பது சாத்தியமான சூழல்சார் விளக்கமாக இருந்தாலும், மூலத்தில் வெளிப்படையாக இல்லாத அரசவைப் பொறுப்பை உரைக்குள் சேர்க்கும் என்பதால் தவிர்க்கப்பட்டது.
translation_notes:
  register: நவீனத் தரத் தமிழில் மரியாதையும் கதைநடைத் தெளிவும் பேணப்பட்டுள்ளன. ஒரே நீண்ட எபிரேய வினா, தமிழில் முதன்மை வினாவுக்குப் பின் தாவீதின் நிலைகளை வரிசைப்படுத்தி, இறுதியில் ‘அல்லவா?’ என முடியும் இயல்பான வினாவாக அமைக்கப்பட்டுள்ளது.
