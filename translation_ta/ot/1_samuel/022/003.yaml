base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/022/003.yaml
  text: Then David went from there to Mizpeh of Moab[a], and he said to the king of Moab[b], “Please let my father and my mother come out and stay with you until I know what God will do for me.”
translation:
  language: ta
  text: பின்பு தாவீது அங்கிருந்து மோவாபின் மிஸ்பேக்குச் சென்றான். அவன் மோவாபின் அரசனிடம், “கடவுள் எனக்கு என்ன செய்வார் என்பதை நான் அறிந்துகொள்ளும்வரை, தயவுசெய்து என் தந்தையும் என் தாயும் உங்களிடம் வந்து தங்கட்டும்[a]” என்று சொன்னான்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய வினைச்சொல்லின் நேர்ப்பொருள், “என் தந்தையும் என் தாயும் உங்களிடம் வரட்டும்” அல்லது “உங்களிடம் புறப்பட்டுச் செல்லட்டும்” என்பதாகவும் மொழிபெயர்க்கலாம்; இங்கு அவர்கள் மோவாபின் அரசனது பாதுகாப்பில் தங்குவதே கருத்து.
    reason: lexical_alternative
  - marker: b
    text: “கடவுள் என்னிடம் என்ன செய்வார்” அல்லது “கடவுள் என்னைக் கொண்டு என்ன செய்வார்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ ... מִשָּׁם
  choice: பின்பு ... அங்கிருந்து ... சென்றான்
  rationale: தொடர்ச்சியான கதை நிகழ்வையும், ஓரிடத்திலிருந்து மற்றோரிடத்திற்குச் சென்றதையும் இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: מִצְפֵּה מוֹאָב
  choice: மோவாபிலுள்ள மிஸ்பே
  rationale: இது மோவாபுடன் தொடர்புடைய இடப்பெயர். எபிரெய மெய்யொலிப்பை அடிப்படையாகக் கொண்டு ‘மிஸ்பே’ என ஒலிபெயர்க்கப்பட்டது.
- source_word: מֶלֶךְ מוֹאָב
  choice: மோவாபின் அரசன்
  rationale: அரசரையும் அவர் ஆளும் நாட்டையும் குறிக்கும் எளிய இணைப்புத் தொடராக மொழிபெயர்க்கப்பட்டது.
- source_word: יֵצֵא נָא ... אִתְּכֶם
  choice: தயவுசெய்து ... உங்களிடம் வந்து தங்கட்டும்
  rationale: יֵצֵא என்பதன் நேர்ப்பொருள் ‘வெளியே வருதல்/புறப்படுதல்.’ இச்சூழலில் தாவீதின் பெற்றோர் மோவாபின் அரசனது பாதுகாப்பில் தங்குவதே வேண்டுகோளின் நோக்கம்; ‘வந்து தங்கட்டும்’ என்பது இயக்கத்தையும் நடைமுறை நோக்கத்தையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: אָבִי וְאִמִּי
  choice: என் தந்தையும் என் தாயும்
  rationale: மூலத்தில் இருவரும் தனித்தனியாகக் குறிப்பிடப்பட்டுள்ளதால், ‘என் பெற்றோர்’ என்று சுருக்காமல் அந்த வடிவமும் வலியுறுத்தலும் காக்கப்பட்டன.
- source_word: עַד אֲשֶׁר אֵדַע
  choice: நான் அறிந்துகொள்ளும்வரை
  rationale: தங்கியிருக்க வேண்டிய கால எல்லையைக் குறிக்கும் மூலத்தொடரைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: מַה יַּעֲשֶׂה לִּי אֱלֹהִים
  choice: கடவுள் எனக்கு என்ன செய்வார்
  rationale: לִי என்பது ‘எனக்கு,’ ‘என்னிடம்,’ அல்லது சூழல்படி ‘என்னைப் பற்றி/எனக்காக’ என்ற நுணுக்கங்களை ஏற்கக்கூடும். ‘எனக்கு என்ன செய்வார்’ என்பது தமிழிலும் திறந்த பொருளை ஓரளவு காக்கிறது.
theological_decisions:
- issue: אֱלֹהִים என்ற சொல்லின் குறிப்பு
  choice: கடவுள்
  alternative: தெய்வம் / தேவர்கள்
  rationale: אֱלֹהִים வடிவில் பன்மையாக இருந்தாலும், இங்கு ஒருமை வினையுடன் வந்து இஸ்ரவேலின் கடவுளைக் குறிக்கிறது; ஆகவே ‘கடவுள்’ பொருத்தமானது.
- issue: לִי என்பதில் கடவுளின் செயல் தாவீதுக்கு சாதகமானதா என்பது
  choice: எனக்கு என்ன செய்வார்
  alternative: என்னை என்ன செய்வார் / எனக்காக என்ன செய்வார்
  rationale: மூலம் செயல் சாதகமானது என்று வெளிப்படையாகத் தீர்மானிக்கவில்லை. ‘எனக்காக’ என்று மட்டும் மொழிபெயர்த்தால் சாதகத் தன்மை அதிகமாகக் கூறப்படும்; தேர்ந்த வடிவம் அந்தத் திறந்த நிலையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், வாசிக்க எளிதான ஆனால் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டது. ‘அப்பா, அம்மா’ என்பதற்குப் பதில் மூலத்தின் முறையான வடிவத்துக்கு ஏற்ற ‘தந்தை, தாய்’ பயன்படுத்தப்பட்டது. பன்மை אִתְּכֶם-ஐக் காக்கவும் அரசனிடம் மரியாதையுடன் உரையாடுவதற்கும் ‘உங்களிடம்’ தேர்ந்தெடுக்கப்பட்டது.
