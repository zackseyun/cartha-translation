base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/022/017.yaml
  text: Then the king said to the runners who were standing around him[a], “Turn and kill the priests of Yahweh, because their hand also is with David[b], and because they knew that he was fleeing and did not disclose it to me.” But the king’s servants were not willing to put out their hand to strike the priests of Yahweh.
translation:
  language: ta
  text: அப்போது அரசன், தன்னைச் சூழ்ந்து நின்ற ஓட்டக்காரர்களிடம்[a], “நீங்கள் திரும்பி யாவேயின் ஆசாரியர்களைக் கொல்லுங்கள். ஏனெனில், அவர்களும் தாவீதின் பக்கம் இருக்கிறார்கள்[b]; அவன் தப்பியோடிக்கொண்டிருப்பதை அறிந்தும் அதை எனக்குத் தெரிவிக்கவில்லை[c]” என்றான். ஆனால் அரசனின் பணியாளர்கள் யாவேயின் ஆசாரியர்களைத் தாக்கத் தங்கள் கைகளை நீட்ட விரும்பவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரேயில், “ஓடுகிறவர்கள்.” அரசவையில் இவர்கள் அரச காவலர்களாகவோ தூதர்களாகவோ பணியாற்றியவர்களைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: எபிரேயில், “அவர்களுடைய கையும் தாவீதோடு இருக்கிறது”; அதாவது, அவர்கள் தாவீதுக்கு ஆதரவாக இருக்கிறார்கள் அல்லது அவன் பக்கம் சேர்ந்திருக்கிறார்கள்.
    reason: idiom
  - marker: c
    text: எபிரேயில், “என் செவியைத் திறக்கவில்லை”; அதாவது, “எனக்குத் தெரிவிக்கவில்லை.”
    reason: idiom
lexical_decisions:
- source_word: לָרָצִים הַנִּצָּבִים עָלָיו
  choice: தன்னைச் சூழ்ந்து நின்ற அரச காவலர்களிடம்
  rationale: רצים என்பதன் சொற்பொருள் ‘ஓடுகிறவர்கள்’; அரசவைச் சூழலில் அது அரசனருகே பணியாற்றிய காவலர் அல்லது தூதர்களைக் குறிக்கலாம். தமிழில் சூழலையும் அவர்களின் பணியையும் தெளிவாகக் காட்ட ‘அரச காவலர்கள்’ என்று மொழிபெயர்த்து, சொற்பொருளை அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: סֹבּוּ וְהָמִיתוּ
  choice: நீங்கள் திரும்பி ... கொன்றுபோடுங்கள்
  rationale: இரு கட்டளை வினைகளையும் நேரடியாகவும், சவுலின் கட்டளையிலுள்ள வன்மையை மென்மைப்படுத்தாமலும் வழங்குகிறது.
- source_word: כֹּהֲנֵי יְהוָה
  choice: யாவேயின் ஆசாரியர்கள்
  rationale: יְהוָה என்ற உடன்படிக்கைப் பெயரை பட்டப்பெயராக மாற்றாமல் ‘யாவே’ என ஒலிபெயர்க்கிறது; ‘ஆசாரியர்கள்’ என்பது தமிழ் வேதாகமப் பயன்பாட்டில் பரவலாக அறியப்படும் சொல்.
- source_word: כִּי גַם יָדָם עִם דָּוִד
  choice: அவர்களும் தாவீதின் பக்கம் சேர்ந்திருக்கிறார்கள்
  rationale: ‘அவர்களுடைய கையும் தாவீதோடு இருக்கிறது’ என்ற எபிரேய மரபுத்தொடர், ஆதரவு அல்லது உடந்தையைக் குறிக்கிறது. இயல்பான தமிழில் அதன் பொருள் தரப்பட்டு, மூல உருவகம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: וְכִי יָדְעוּ כִּי בֹרֵחַ הוּא
  choice: அவன் தப்பியோடிக்கொண்டிருந்ததை அவர்கள் அறிந்திருந்தும்
  rationale: בֹרֵחַ என்ற நிகழ்காலப் பங்கேற்புவினையின் தொடர்ச்சியான செயல்நிலையை ‘தப்பியோடிக்கொண்டிருந்ததை’ என்பது காக்கிறது.
- source_word: וְלֹא גָלוּ אֶת־אָזְנוֹ
  choice: அதை என்னிடம் தெரிவிக்கவில்லை
  rationale: ‘அவனுடைய/என்னுடைய செவியைத் திறக்கவில்லை’ என்ற எபிரேய மரபுத்தொடரின் பொருளை நவீன தமிழில் தெளிவாகத் தருகிறது; பேசுபவன் அரசன் என்பதால் முதல் நபர் வடிவம் பொருத்தமானது.
- source_word: וְלֹא אָבוּ עַבְדֵי הַמֶּלֶךְ
  choice: அரசனின் பணியாளர்கள் ... மனமில்லாதிருந்தார்கள்
  rationale: אבה என்பது விருப்பம் அல்லது சம்மதத்தைக் குறிக்கிறது. கட்டளைக்குக் கீழ்ப்படிய அவர்கள் விரும்பவில்லை என்ற நுணுக்கத்தை ‘மனமில்லாதிருந்தார்கள்’ காக்கிறது.
- source_word: לִשְׁלֹחַ אֶת־יָדָם לִפְגֹעַ
  choice: தாக்கக் கைநீட்ட
  rationale: ‘தங்கள் கையை நீட்டி தாக்குதல்’ என்ற வன்முறை உருவகத்தை இயல்பான, சுருக்கமான தமிழில் பாதுகாக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலத்தில் நான்கெழுத்து உடன்படிக்கைப் பெயர் நேரடியாக உள்ளது. அதனை பொதுப் பட்டப்பெயராக மாற்றாமல், நவீன தமிழில் மூல ஒலிக்கு அண்மையான ‘யாவே’ என வழங்குகிறது.
- issue: ஆசாரியர்களுக்கு எதிரான சவுலின் குற்றச்சாட்டு
  choice: சவுலின் கூற்றாகவே மேற்கோளுக்குள் வைத்தல்
  alternative: அவர்கள் உண்மையில் தாவீதின் உடந்தையாளர்கள் என்று உரையாளர் உறுதிப்படுத்துவது போல மொழிபெயர்த்தல்
  rationale: இது சவுலின் குற்றச்சாட்டு; மொழிபெயர்ப்பு அதை உரையாளரின் தீர்ப்பாக மாற்றாமல், பேச்சாளரின் பார்வையாகவே காக்கிறது.
translation_notes:
  register: நவீனத் தரமான, மரியாதைமிக்க, பொதுவாசகர்களுக்கு எளிதில் புரியும் தமிழ் பயன்படுத்தப்பட்டுள்ளது. அரசவைச் சூழலை விளக்க ‘அரச காவலர்கள்’ என்றும், பின்னர் வரும் עַבְדֵי הַמֶּלֶךְ என்பதற்கு வேறுபாட்டைக் காக்க ‘அரசனின் பணியாளர்கள்’ என்றும் வழங்கப்பட்டுள்ளது. மூலத்தின் கையுருவகங்கள் இயன்ற இடத்தில் பிரதான உரையிலும், இல்லாத இடத்தில் அடிக்குறிப்பிலும் பாதுகாக்கப்பட்டுள்ளன.
