revisions:
- from: அப்போது அரசன், தன்னைச் சூழ்ந்து நின்ற அரச காவலர்களிடம்[a], “நீங்கள் திரும்பி யாவேயின் ஆசாரியர்களைக் கொன்றுபோடுங்கள். ஏனெனில், அவர்களும் தாவீதின் பக்கம் சேர்ந்திருக்கிறார்கள்[b]. அவன் தப்பியோடிக்கொண்டிருந்ததை அவர்கள் அறிந்திருந்தும், அதை என்னிடம் தெரிவிக்கவில்லை[c]” என்றான். ஆனால் அரசனின் பணியாளர்கள் யாவேயின் ஆசாரியர்களைத் தாக்கக் கைநீட்ட மனமில்லாதிருந்தார்கள்.
  to: அப்போது அரசன், தன்னைச் சூழ்ந்து நின்ற ஓட்டக்காரர்களிடம்[a], “நீங்கள் திரும்பி யாவேயின் ஆசாரியர்களைக் கொல்லுங்கள். ஏனெனில், அவர்களும் தாவீதின் பக்கம் இருக்கிறார்கள்[b]; அவன் தப்பியோடிக்கொண்டிருப்பதை அறிந்தும் அதை எனக்குத் தெரிவிக்கவில்லை[c]” என்றான். ஆனால் அரசனின் பணியாளர்கள் யாவேயின் ஆசாரியர்களைத் தாக்கத் தங்கள் கைகளை நீட்ட விரும்பவில்லை.
  rationale: The revision restores the literal yet intelligible designation “ஓட்டக்காரர்கள்” for the royal attendants, retaining contextual alternatives in a properly anchored footnote. It makes Saul’s accusation syntactically closer to the Hebrew, avoids added concessive force, uses a more standard direct verb for the killing command, and retains the final hand idiom in clear Tamil. All existing footnote markers remain correctly anchored and their explanations match the anchored expressions.
