revisions:
- from: அப்பொழுது சவுல், “அகிதூபின் மகனே, தயவுசெய்து கேள்” என்றான். அதற்கு அவன், “இதோ, என் ஆண்டவனே” என்றான்.
  to: அப்பொழுது சவுல், “அகிதூபின் மகனே, தயவுசெய்து கேள்” என்றான். அவன் பதிலளித்து, “இதோ, நான் இருக்கிறேன், என் ஆண்டவரே” என்றான்.
  rationale: The revision supplies the first-person sense inherent in הִנְנִי while retaining the draft’s accurate rendering of Saul’s polite summons, the Hebrew vocative, and the human-respect sense of אֲדֹנִי. No footnotes are required.
