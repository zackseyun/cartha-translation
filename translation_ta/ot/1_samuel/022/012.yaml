source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר שָׁא֔וּל שְֽׁמַֽע נָ֖א בֶּן אֲחִיט֑וּב וַ/יֹּ֖אמֶר הִנְ/נִ֥י אֲדֹנִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/022/012.yaml
  text: Then Saul said, “Listen, please, son of Ahitub.” And he answered, “Here I am, my lord.”
translation:
  language: ta
  text: அப்பொழுது சவுல், “அகிதூபின் மகனே, தயவுசெய்து கேள்” என்றான். அவன் பதிலளித்து, “இதோ, நான் இருக்கிறேன், என் ஆண்டவரே” என்றான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שְׁמַע נָא
  choice: தயவுசெய்து கேள்
  rationale: שְׁמַע என்பது நேரடியான அழைப்பு/கட்டளை; נָא அதனை வேண்டுகோள் நயத்துடன் மென்மைப்படுத்துவதால், இயல்பான நவீனத் தமிழில் இவ்வாறு வழங்கப்பட்டது.
- source_word: בֶּן אֲחִיטוּב
  choice: அகிதூபின் மகனே
  rationale: எபிரேய அழைப்புமுறையைத் தமிழின் விளிவேற்றுமையுடன் இயல்பாகக் காக்கிறது.
- source_word: הִנְנִי
  choice: இதோ
  rationale: அழைப்புக்குப் பதிலாகத் தன்னை ஆயத்தமாக முன்வைக்கும் எபிரேயச் சொல்லின் சுருக்கமான மரபுப்பொருளைக் காக்கிறது.
- source_word: אֲדֹנִי
  choice: என் ஆண்டவனே
  rationale: சவுலை நோக்கிய மரியாதைமிக்க மனிதத் தலைப்பாக உள்ள 'என் எஜமான்/ஆண்டவன்' என்ற பொருளை, தெய்வப் பெயராக மாற்றாமல் வழங்குகிறது.
theological_decisions:
- issue: אֲדֹנִי என்பதன் குறிப்பு
  choice: என் ஆண்டவனே
  alternative: என் எஜமானே
  rationale: இங்கு அது சவுலுக்கு உரிய மரியாதைமிக்க அழைப்பு; கடவுளைக் குறிக்கும் சிறப்புப் பெயராகப் புரிந்துகொள்ளாதபடி சூழலைப் பின்பற்றுகிறது. இரு தமிழ்ச் சொற்களும் சாத்தியமானவை; கண்ணியமான நடைக்கு 'ஆண்டவனே' தேர்ந்தெடுக்கப்பட்டது.
translation_notes:
  register: நவீன நிலையான தமிழ்; நேரடியான அரசவைக் கலந்துரையாடலின் சுருக்கத்தையும் மரியாதை நயத்தையும் காக்கும் கண்ணியமான நடை.
