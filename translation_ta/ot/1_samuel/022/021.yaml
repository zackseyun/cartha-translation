  text: וַ/יַּגֵּ֥ד אֶבְיָתָ֖ר לְ/דָוִ֑ד כִּ֚י הָרַ֣ג שָׁא֔וּל אֵ֖ת כֹּהֲנֵ֥י יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/022/021.yaml
  text: Abiathar told David that Saul had killed the priests of Yahweh.
translation:
  language: ta
  text: அபியத்தார் தாவீதிடம், சவுல் யாவேவின் ஆசாரியர்களைக் கொன்றுவிட்டதாகத் தெரிவித்தார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּגֵּד
  choice: தெரிவித்தார்
  rationale: נגד என்பதன் ஹிஃபில் வடிவம் இங்கு ஒரு செய்தியை ஒருவருக்குத் தெரியப்படுத்துவதைக் குறிக்கிறது. ‘தெரிவித்தார்’ என்பது நவீனத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் உள்ளது.
- source_word: אֶבְיָתָר
  choice: அபியத்தார்
  rationale: எபிரேயத் தனிப்பெயரின் தமிழில் வழக்கமான ஒலிபெயர்ப்பு.
- source_word: לְדָוִד
  choice: தாவீதிடம்
  rationale: לְ முன்னொட்டு செய்தியைப் பெறுபவரைக் குறிக்கிறது; தமிழில் ‘தாவீதிடம்’ என இயல்பாக வெளிப்படுகிறது.
- source_word: כִּי
  choice: என்று / -தாக
  rationale: அபியத்தார் தெரிவித்த செய்தியின் உள்ளடக்கத்தை அறிமுகப்படுத்துகிறது; தமிழ் மறைமுகக் கூற்றில் ‘-தாக’ இயல்பான இணைப்பாகும்.
- source_word: הָרַג
  choice: கொன்றுவிட்டதாக
  rationale: அபியத்தார் தெரிவிப்பதற்கு முன்பே கொலை நிகழ்ந்துவிட்டதை ‘-விட்ட-’ நிறைவுக்கூறு சூழலுக்கேற்றவாறு காட்டுகிறது; மூலத்தின் நிகழ்வுக்கால உறவைத் தெளிவாக்குகிறது.
- source_word: שָׁאוּל
  choice: சவுல்
  rationale: எபிரேயத் தனிப்பெயரின் தமிழில் பரவலாக அறியப்பட்ட ஒலிபெயர்ப்பு.
- source_word: כֹּהֲנֵי יְהוָה
  choice: யாவேவின் ஆசாரியர்களை
  rationale: எபிரேய இணைநிலைத் தொடரின் உடைமை உறவை ‘யாவேவின்’ என்று இயல்பான தமிழில் காக்கிறது; כֹּהֵן என்பதற்கு வேதாகமச் சூழலில் புரிந்துகொள்ளப்படும் ‘ஆசாரியர்’ பயன்படுத்தப்படுகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: திருநாமத்தை ஒரு பட்டப்பெயரால் மாற்றாமல், எபிரேய நான்கெழுத்துத் திருநாமத்தின் ஒலிபெயர்ப்பாக வழங்குகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைத் திருநாமத்தின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூல உரையில் இறைவனின் தனிப்பட்ட திருநாமம் நேரடியாக உள்ளது. அதனைப் பட்டப்பெயராக மாற்றாமல் ஒலிபெயர்ப்பது மூலத்தின் வேறுபாட்டைக் காக்கிறது; ‘யாவே’ என்பது நவீன ஆய்வுலகில் பொதுவாக ஏற்கப்படும் மீளமைக்கப்பட்ட உச்சரிப்பின் தமிழ் வடிவம்.
translation_notes:
  register: நவீன நிலையான தமிழ்; எளிமையானதாயினும் கண்ணியமான நடையில் அமைந்துள்ளது. ‘தெரிவித்தார்’ என்பது உரையாடல் இயல்பையும் வரலாற்று விவரணையின் மரியாதைநிலையையும் சமநிலைப்படுத்துகிறது. இவ்வசனத்திற்கு தேவையான உரைவேறுபாடு அல்லது விளக்கக் குறிப்பு இல்லாததால் அடிக்குறிப்புகள் சேர்க்கப்படவில்லை.
