  text: But the king said[a], “You shall surely die, Ahimelech[b], you and all your father's house.”
translation:
  language: ta
  text: ஆனால் அரசன், “அகிமெலேக்கே, நீயும் உன் தந்தையின் வீட்டார் அனைவரும் நிச்சயமாகச் சாவீர்கள்” என்றான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר הַמֶּלֶךְ
  choice: ஆனால் அரசன் … என்றான்
  rationale: וַיֹּאמֶר என்பது எபிரெய வரலாற்று நடையில் வழக்கமான ‘என்றான்’; சூழலின் எதிர்மறைத் திருப்பத்தை இயல்பாகக் காட்ட ‘ஆனால்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: מוֹת תָּמוּת
  choice: நிச்சயமாகச் சாவீர்கள்
  rationale: முற்றுப்பெறா வினைக்கு முன் அதே வேரின் infinitive absolute வருவது மரணத் தீர்ப்பை வலுவாக வலியுறுத்துகிறது. பின்னர் வரும் கூட்டு எழுவாயை முன்னிட்டு தமிழில் மரியாதைப் பன்மை அல்ல, பலரைக் குறிக்கும் பன்மை வினை பயன்படுத்தப்பட்டுள்ளது.
- source_word: אֲחִימֶלֶךְ
  choice: அகிமெலேக்கே
  rationale: தனிப்பெயர் தமிழில் ஒலிபெயர்க்கப்பட்டு, நேரடி விளியைத் தெளிவாக்க விளிவேற்றுமை சேர்க்கப்பட்டுள்ளது.
- source_word: אַתָּה וְכָל בֵּית אָבִיךָ
  choice: நீயும் உன் தந்தையின் குடும்பத்தார் அனைவரும்
  rationale: வலியுறுத்தப்பட்ட אַתָּה-வை ‘நீயும்’ என்று தக்கவைத்து, ‘தந்தையின் வீடு’ என்ற எபிரெய மரபுத்தொடரை இங்கு தந்தைவழிக் குடும்பம் அல்லது குடும்பக் குழு என்ற பொருளில் இயல்பான தமிழில் வழங்குகிறது.
theological_decisions:
- issue: மரணக் கூற்றின் தன்மை
  choice: நிச்சயமாகச் சாவீர்கள்
  alternative: நீங்கள் சாகவேண்டும் / நீங்கள் கொல்லப்படுவீர்கள்
  rationale: எபிரெய அமைப்பு உறுதியான, வலியுறுத்தப்பட்ட மரணத் தீர்ப்பைக் கூறுகிறது; அது கடமைக்கட்டளையா அல்லது செயப்பாட்டு வடிவிலான கொலை அறிவிப்பா என்பதை மொழிபெயர்ப்பில் தேவையின்றி தீர்மானிக்கவில்லை.
translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான வரலாற்று நடை பயன்படுத்தப்பட்டுள்ளது. ‘உன் தந்தையின் வீடு’ என்ற சொல்லுக்குச் சொல் வடிவம் தமிழில் தவறாகப் புரியக்கூடும் என்பதால், அதன் குடும்ப/குலக் குழு பொருள் ‘உன் தந்தையின் குடும்பத்தார் அனைவரும்’ எனத் தெளிவாக்கப்பட்டுள்ளது.
