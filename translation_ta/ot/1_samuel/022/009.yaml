  text: וַ/יַּ֜עַן דֹּאֵ֣ג הָ/אֲדֹמִ֗י וְ/ה֛וּא נִצָּ֥ב עַל עַבְדֵֽי שָׁא֖וּל וַ/יֹּאמַ֑ר רָאִ֨יתִי֙ אֶת בֶּן יִשַׁ֔י בָּ֣א נֹ֔בֶ/ה אֶל אֲחִימֶ֖לֶךְ בֶּן אֲחִטֽוּב־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/022/009.yaml
  text: Then Doeg the Edomite[a], who was standing among Saul’s servants, answered and said, “I saw the son of Jesse coming to Nob, to Ahimelech son of Ahitub.”
translation:
  language: ta
  text: 'அப்போது, சவுலின் பணியாளர்களுடன் நின்றிருந்த ஏதோமியனான தோவேகு[a] பதிலளித்துச் சொன்னான்: “ஈசாயின் மகன் நோபுக்கு, அகிதூபின் மகனான அகிமெலேக்கிடம் வருவதை நான் பார்த்தேன்.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சவுலின் பணியாளர்களுக்கு மேலாக நியமிக்கப்பட்டிருந்த.” எபிரெயச் சொற்றொடர், தோவேகு சவுலின் பணியாளர்களுடன் நின்றிருந்ததையோ, அவர்கள் மேல் மேற்பார்வைப் பொறுப்பில் இருந்ததையோ குறிக்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעַן
  choice: பதிலளித்து
  rationale: ענה என்ற வினை கதை உரையாடலில் ஒருவரின் மறுமொழியை அறிமுகப்படுத்துகிறது. தமிழில் இயல்பாகவும் மூலத்தின் உரையாடல் தொடர்ச்சியைத் தக்கவைத்தும் இருக்க ‘பதிலளித்து’ என மொழிபெயர்க்கப்பட்டது.
- source_word: הָאֲדֹמִי
  choice: ஏதோமியனான
  rationale: குறிப்பிட்ட இன அடையாளமாக தோவேகின் பெயருடன் இணைந்து வருவதால் ‘ஏதோமியனான’ என்பது இயல்பான நவீனத் தமிழ் வடிவம்.
- source_word: וְהוּא נִצָּב עַל עַבְדֵי שָׁאוּל
  choice: சவுலின் பணியாளர்களிடையே நின்றுகொண்டிருந்த
  rationale: נִצָּב என்பது ‘நின்றிருந்த’ அல்லது ‘நியமிக்கப்பட்டிருந்த’ எனவும், עַל என்பது இங்கு ஒரு குழுவுடன் உள்ள இடநிலையையோ அவர்கள்மேல் உள்ள பொறுப்பையோ குறிக்கலாம். முதன்மை உரை அதிகாரப் பதவியை உறுதியாக்காமல் அவரது இருப்பிடத்தை வெளிப்படுத்துகிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: עַבְדֵי שָׁאוּל
  choice: சவுலின் பணியாளர்கள்
  rationale: עבדים என்பது பணியாளர்கள், சேவகர்கள் அல்லது அரசவை அலுவலர்கள் எனப் பொருள்படலாம். ‘பணியாளர்கள்’ நேரடியானதும் சூழலுக்கு ஏற்றதும், அவர்களின் துல்லியமான பதவியைத் தேவையின்றி நிர்ணயிக்காததும் ஆகும்.
- source_word: וַיֹּאמַר
  choice: சொன்னான்
  rationale: வசனத்தின் எபிரெய வினைத் தொடரை தமிழில் ‘பதிலளித்துச் சொன்னான்’ என்று இயல்பாகக் காக்கிறது.
- source_word: רָאִיתִי
  choice: நான் பார்த்தேன்
  rationale: கடந்த காலத்தில் நேரில் கண்டதைத் தெரிவிக்கும் நிறைவுற்ற வினைக்கு இயல்பான தமிழ் இறந்தகால வடிவம்.
- source_word: בֶּן יִשַׁי
  choice: ஈசாயின் மகன்
  rationale: மூலம் தாவீதின் பெயரைச் சொல்லாமல் உறவுமுறை அடையாளத்தையே திட்டமிட்டு பயன்படுத்துகிறது; அந்தச் சொல்லாட்சியும் அதன் உரையாடல் தாக்கமும் பாதுகாக்கப்பட்டுள்ளன.
- source_word: בָּא
  choice: வருவதை
  rationale: ‘நான் பார்த்தேன்’ என்பதுடன் இணைந்த பங்கேற்பு வடிவம், பார்த்துக்கொண்டிருந்த செயலைக் குறிக்கிறது; தமிழில் ‘வருவதை’ அதனை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: נֹבֶה
  choice: நோபுக்கு
  rationale: இடப்பெயருடன் சேர்ந்துள்ள திசை குறிக்கும் ה, நோபை நோக்கிய இயக்கத்தைக் காட்டுகிறது; தமிழ் வேற்றுமை உருபான ‘-க்கு’ இதை நேரடியாகத் தெரிவிக்கிறது.
- source_word: אֶל אֲחִימֶלֶךְ בֶּן אֲחִטוּב
  choice: அகிதூபின் மகனான அகிமெலேக்கிடம்
  rationale: אֶל என்பது அணுகிச் சென்ற நபரைக் குறிக்கும் ‘இடம்/அருகில்’ என்ற திசைப் பொருளை உடையது. தமிழில் நபருடன் ‘-இடம்’ பயன்படுத்துவது இயல்பானது; தந்தைவழி அடையாளமும் முழுமையாகக் காக்கப்பட்டுள்ளது.
