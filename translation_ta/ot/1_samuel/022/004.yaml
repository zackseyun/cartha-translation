base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/022/004.yaml
  text: He brought them before the king of Moab[a], and they stayed with him all the days that David was in the stronghold.
translation:
  language: ta
  text: அவன் அவர்களை மோவாபின் அரசன் முன்னிலையில் அழைத்துக்கொண்டு போனான்[a]. தாவீது அரணில் இருந்த காலமெல்லாம் அவர்கள் அவனோடு தங்கியிருந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்களை மோவாபின் அரசன் முன்னிலைக்கு வழிநடத்திச் சென்றான்.” எபிரெய வினைச்சொல் ஒருவரை வழிநடத்திச் செல்வதையோ, ஒருவருடைய முன்னிலைக்குக் கொண்டுவருவதையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּנְחֵם
  choice: அவர்களை ... அழைத்துக்கொண்டு போனான்
  rationale: இச்சூழலில் வினைச்சொல் தாவீதின் பெற்றோரை மோவாபின் அரசனுடைய முன்னிலைக்குக் கொண்டு செல்வதை அல்லது வழிநடத்திச் செல்வதைச் சுட்டுகிறது. நவீன தமிழில் இயல்பாகவும் தெளிவாகவும் இருப்பதால் இவ்வாறு மொழிபெயர்க்கப்பட்டது.
- source_word: אֶת־פְּנֵי
  choice: அரசனிடம்
  rationale: சொல்லளவில் ‘முகத்தின் முன்னே’ என்றிருந்தாலும், ஒருவருடைய முன்னிலைக்குக் கொண்டுசெல்வதைக் குறிக்கும் எபிரெய மரபுத்தொடர். தமிழில் ‘அரசனிடம்’ என்பது இயல்பாக அந்தப் பொருளைத் தருகிறது.
- source_word: מֶלֶךְ מוֹאָב
  choice: மோவாபின் அரசன்
  rationale: இடப்பெயருடனான எளிய உடைமைத் தொடர்; நவீன நிலையான தமிழில் இயல்பான வடிவம்.
- source_word: וַיֵּשְׁבוּ עִמּוֹ
  choice: அவர்கள் அவனோடு தங்கியிருந்தார்கள்
  rationale: ישב இங்கு உட்கார்வதை அல்ல, தொடர்ந்து தங்கியிருப்பதைக் குறிக்கிறது. காலநீட்சியை ‘தங்கியிருந்தார்கள்’ தெளிவாக வெளிப்படுத்துகிறது.
- source_word: כָּל יְמֵי הֱיוֹת דָּוִד
  choice: தாவீது ... இருந்த காலமெல்லாம்
  rationale: தாவீது அங்கே இருந்த முழுக் காலத்தையும் குறிக்கும் காலவியல் அமைப்பு; தமிழில் இயல்பான வாக்கியமாக மாற்றப்பட்டுள்ளது.
- source_word: בַּמְּצוּדָה
  choice: அரணான இடத்தில்
  rationale: מְצוּדָה பாதுகாப்பளிக்கும் அரண்மிக்க இடம் அல்லது கோட்டையைக் குறிக்கலாம். குறிப்பிட்ட கட்டடக் கோட்டை என்று தேவையின்றி வரையறுக்காமல், பாதுகாப்பான அரண் என்ற கதையியல் பொருளைத் தக்கவைக்கிறது.
