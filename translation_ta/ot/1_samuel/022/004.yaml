translation_notes:
  register: நவீன நிலையான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘அழைத்துக்கொண்டு போனான்’ பொதுவாசகருக்கு இயல்பானது; அடிக்குறிப்பு மூலத்தின் ‘வழிநடத்துதல்/முன்னிலைக்குக் கொண்டுவருதல்’ என்ற பொருள் நுணுக்கத்தைப் பாதுகாக்கிறது. ‘அரணான இடம்’ என்பது מְצוּדָה என்பதைக் குறிப்பிட்ட கட்டட வகையாக மிகையாக நிர்ணயிக்காமல் மொழிபெயர்க்கிறது.
