  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר שָׁא֗וּל לַֽ/עֲבָדָי/ו֙ הַ/נִּצָּבִ֣ים עָלָ֔י/ו שִׁמְעוּ נָ֖א בְּנֵ֣י יְמִינִ֑י גַּם לְ/כֻלְּ/כֶ֗ם יִתֵּ֤ן בֶּן יִשַׁי֙ שָׂד֣וֹת וּ/כְרָמִ֔ים לְ/כֻלְּ/כֶ֣ם יָשִׂ֔ים שָׂרֵ֥י אֲלָפִ֖ים וְ/שָׂרֵ֥י מֵאֽוֹת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/022/007.yaml
  text: Then Saul said to his servants who were standing around him, “Listen, please, sons of Benjamin! Will the son of Jesse also give all of you fields and vineyards? Will he make all of you commanders of thousands and commanders of hundreds?”
translation:
  language: ta
  text: அப்போது சவுல் தன்னைச் சுற்றி நின்றுகொண்டிருந்த தன் ஊழியர்களிடம், “பென்யமீனியரே, தயவுசெய்து கேளுங்கள்! ஈசாயின் மகனும் உங்கள் அனைவருக்கும் வயல்களையும் திராட்சைத்தோட்டங்களையும் கொடுப்பானா? உங்கள் அனைவரையும் ஆயிரம் பேருக்குத் தலைவர்களாகவும் நூறு பேருக்குத் தலைவர்களாகவும் நியமிப்பானா?” என்றான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֲבָדָיו
  choice: தன் ஊழியர்கள்
  rationale: இங்கு அரசனுக்குச் சேவை செய்யும் அதிகாரிகள் அல்லது பணியாளர்களைக் குறிக்கிறது; ‘அடிமைகள்’ என்பது சூழலில் தேவையற்ற அளவு குறுகிய பொருளைத் தரலாம்.
- source_word: הַנִּצָּבִים עָלָיו
  choice: தன்னைச் சுற்றி நின்றுகொண்டிருந்த
  rationale: அரசனருகே பணியில் நின்றிருந்தவர்களைக் குறிக்கும் எபிரெயச் சொற்றொடரின் இடவியல் மற்றும் சேவைச் சூழலை இயல்பான தமிழில் தருகிறது.
- source_word: שִׁמְעוּ נָא
  choice: தயவுசெய்து கேளுங்கள்
  rationale: שִׁמְעוּ என்பது பன்மை கட்டளை; נָא வேண்டுகோள் அல்லது வலியுறுத்தலின் மென்மையான துகளாக இருப்பதால் ‘தயவுசெய்து’ என வழங்கப்பட்டது.
- source_word: בְּנֵי יְמִינִי
  choice: பென்யமீனின் மக்களே
  rationale: சொல்லாட்சியில் ‘பென்யமீனின் மகன்களே’; இங்கு பென்யமீன் கோத்திரத்தைச் சேர்ந்தவர்களை அழைப்பதால் நவீன தமிழில் ‘மக்களே’ இயல்பாகவும் பொருள் தெளிவாகவும் உள்ளது.
- source_word: בֶּן יִשַׁי
  choice: ஈசாயின் மகன்
  rationale: தாவீதின் பெயரைச் சொல்லாமல் அவனை இழிவாக அல்லது தள்ளிப்பேசும் சவுலின் மூலச் சொல்லாட்சியைப் பாதுகாக்கிறது.
- source_word: שָׂרֵי אֲלָפִים וְשָׂרֵי מֵאוֹת
  choice: ஆயிரம் பேருக்குத் தலைவர்களாகவும் நூறு பேருக்குத் தலைவர்களாகவும்
  rationale: இவை படைப் பிரிவுகளின் தலைமைப் பதவிகளைக் குறிக்கும்; எண்ணிக்கை சார்ந்த மூல அமைப்பைத் தெளிவான தமிழில் காக்கிறது.
theological_decisions:
- issue: சவுலின் கேள்விகளின் நோக்கம்
  choice: இரண்டு வினாக்களையும் பதிலை எதிர்பாராத கேள்விகளாகவே வைத்தல்
  alternative: அவற்றை ‘அவன் கொடுக்கமாட்டான்/நியமிக்கமாட்டான்’ என்ற நேரடி கூற்றுகளாக மாற்றுதல்
  rationale: மூல எபிரெயம் கேள்வி வடிவத்தையே பயன்படுத்துகிறது; சவுலின் அரசியல் அழுத்தமும் கிண்டல் தொனியும் வாசகர் உணருமாறு அந்த வடிவம் பாதுகாக்கப்பட்டது.
translation_notes:
  register: நவீன நிலையான தமிழ்; அரசவைக் காட்சிக்கேற்ற கண்ணியமான, ஆனால் பொதுவாசகருக்கு எளிதில் புரியும் நடை. மூலத்தின் மறைமுக இகழ்ச்சி, வேண்டுகோள் துகள், கோத்திர அழைப்பு, இரட்டை வினா அமைப்பு ஆகியவை பாதுகாக்கப்பட்டுள்ளன.
