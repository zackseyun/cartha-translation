base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/022/002.yaml
  text: And everyone in distress[a], everyone who was in debt, and everyone bitter in soul gathered to him, and he became commander over them[b]. About four hundred men were with him.
translation:
  language: ta
  text: நெருக்கடியில் இருந்தவர்கள், கடன்பட்டவர்கள்[a], மனம் கசந்தவர்கள்[b] என அனைவரும் அவனிடம் ஒன்றுகூடினார்கள். அவன் அவர்களுக்குத் தலைவனானான். ஏறக்குறைய நானூறு ஆண்கள் அவனோடு இருந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொல்லுக்குச் சொல், ‘கடன் கொடுத்தவர் அல்லது கடனை வசூலிப்பவர் இருந்தவர்கள்’ என்று உள்ளது.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில், ‘உள்ளத்தில் கசந்தவர்கள்’; இது ஆழ்ந்த மனக்கசப்பு அல்லது மனவேதனையைக் குறிக்கும் மரபுத்தொடர்.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּתְקַבְּצוּ אֵלָיו
  choice: அவனிடம் ஒன்றுகூடினார்கள்
  rationale: התפעל வடிவம் பலர் ஒருவரிடம் வந்து குழுவாகச் சேர்ந்ததைக் குறிக்கிறது; ‘ஒன்றுகூடினார்கள்’ இயல்பாகவும் நேரடியாகவும் உள்ளது.
- source_word: כָּל אִישׁ מָצוֹק
  choice: நெருக்கடியில் இருந்தவர்கள்
  rationale: מָצוֹק என்பது அழுத்தம், இடுக்கண், துன்பமான சூழ்நிலை ஆகியவற்றை உள்ளடக்கும்; ‘நெருக்கடி’ அதன் பரந்த பொருளைத் தக்கவைக்கிறது.
- source_word: אֲשֶׁר לוֹ נֹשֶׁא
  choice: கடன் கொடுத்தவன் இருந்தவர்கள்
  rationale: எபிரெய உரை ‘கடன் கொடுத்தவன்/வசூலிப்பவன் இருந்தவர்’ என்று சொல்லுகிறது. ‘கடன்பட்டவர்கள்’ என்பது இயல்பான மாற்றாக இருந்தாலும், முதன்மை உரையில் மூலத்தின் சற்றே மறைமுகமான அமைப்பு தக்கவைக்கப்படுகிறது.
- source_word: מַר נֶפֶשׁ
  choice: உள்ளம் கசந்தவர்கள்
  rationale: ‘ஆத்துமாவில் கசந்தவர்’ என்ற எபிரெய உருவகத்தை இயல்பான நவீனத் தமிழில் பாதுகாக்கிறது; இது வெறும் அதிருப்தியை விட ஆழ்ந்த மனவேதனையையும் கசப்பையும் குறிக்கலாம்.
- source_word: וַיְהִי עֲלֵיהֶם לְשָׂר
  choice: அவன் அவர்களுக்குத் தலைவனானான்
  rationale: שַׂר என்பதற்கு தலைவர், அதிகாரி, படைத்தலைவர் என்ற பொருட்கள் உண்டு. இச்சூழல் போர்க்குழுவைச் சுட்டினாலும், ‘தலைவன்’ மூலச்சொல்லின் பொருள் வரம்பை தேவையின்றிக் குறுக்காது.
- source_word: כְּאַרְבַּע מֵאוֹת אִישׁ
  choice: ஏறக்குறைய நானூறு ஆண்கள்
  rationale: כְּ தோராய எண்ணைக் குறிக்கிறது; இங்கு אִישׁ தாவீதின் குழுவிலிருந்த வயதுவந்த ஆண்களை எண்ணுகிறது.
