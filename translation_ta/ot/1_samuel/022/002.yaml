translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் மதிப்புடனும் அமைக்கப்பட்டுள்ளது. மூலத்தின் மூன்று முறை வரும் כָּל אִישׁ என்ற பகிர்மான அமைப்பு, தமிழில் பட்டியலின் ஒவ்வொரு பிரிவையும் பன்மையில் கூறி இறுதியில் ‘அனைவரும்’ எனத் தொகுப்பதன் மூலம் வெளிப்படுத்தப்பட்டுள்ளது. ‘ஆண்கள்’ என்பது இறுதி எண்ணிக்கையில் மட்டும் பாலினக் குறிப்போடு வைக்கப்பட்டுள்ளது.
