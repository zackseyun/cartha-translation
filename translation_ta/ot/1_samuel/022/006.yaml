base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/022/006.yaml
  text: Saul heard that David and the men who were with him had become known[a]. Now Saul was sitting at Gibeah, under the tamarisk tree on the height, with his spear in his hand[b], and all his servants were standing around him.
translation:
  language: ta
  text: தாவீதும் அவனோடு இருந்த ஆட்களும் அறியப்பட்டதாகச் சவுல் கேள்விப்பட்டான்[a]. அப்போது சவுல் கிபியாவில், மேட்டின்மேல் இருந்த தாமரிஸ்க் மரத்தின் கீழ் உட்கார்ந்திருந்தான்[b]. அவனுடைய ஈட்டி அவன் கையில் இருந்தது; அவனுடைய பணியாளர்கள் அனைவரும் அவனைச் சுற்றி நின்றுகொண்டிருந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தாவீதும் அவனோடு இருந்த ஆட்களும் கண்டுபிடிக்கப்பட்டதாக” அல்லது “வெளிப்பட்டதாக.” எபிரேய வினைச்சொல் தாவீதின் இருப்பிடம் தெரியவந்தது என்ற கருத்தையும் தரக்கூடும்.
    reason: lexical_alternative
  - marker: b
    text: בָּרָמָה என்பதைப் பொதுப்பெயராக அல்லாமல் ராமா என்ற இடப்பெயராக எடுத்தால், “ராமாவில் தாமரிஸ்க் மரத்தின் கீழ்” என்றும் மொழிபெயர்க்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: கேள்விப்பட்டான்
  rationale: செய்தியை அறிதல் என்ற சூழலில் שׁמע என்பதன் இயல்பான நவீனத் தமிழ் வெளிப்பாடு; வெறும் ஒலியைக் கேட்டான் என்பதைக் காட்டிலும் பொருத்தமானது.
- source_word: כִּי נוֹדַע דָּוִד וַאֲנָשִׁים אֲשֶׁר אִתּוֹ
  choice: தாவீதும் அவனோடு இருந்த ஆட்களும் எங்கே இருக்கிறார்கள் என்பது தெரியவந்ததாக
  rationale: ידע என்பதன் நிஃபால் வடிவம் ‘அறியப்பட்டது/கண்டுபிடிக்கப்பட்டது’ என்ற பொருளைத் தரலாம். சூழலில் அவர்களின் இருப்பிடம் மறைவாக இல்லாமல் தெரியவந்தது என்ற உட்பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: יוֹשֵׁב
  choice: உட்கார்ந்திருந்தான்
  rationale: எபிரேயப் பங்கேற்புவினையின் பின்னணிக் காட்சியைத் தொடர்நிலையுடன் வெளிப்படுத்துகிறது.
- source_word: בַּגִּבְעָה
  choice: கிபியாவில்
  rationale: இங்கு גבעה இடப்பெயரான கிபியாவைக் குறிக்கிறது.
- source_word: תַּחַת הָאֶשֶׁל
  choice: புளியமரத்தின் கீழே
  rationale: אשל பொதுவாக tamarisk என அடையாளப்படுத்தப்படுகிறது; தமிழில் வாசகர்களுக்குப் பரிச்சயமான ‘புளியமரம்’ என்ற பெயர் பயன்படுத்தப்படுகிறது.
- source_word: בָּרָמָה
  choice: மேட்டின்மேல்
  rationale: இலக்கண அமைப்பும் சூழலும் இதை ‘உயரமான இடம்/மேடு’ என்ற பொதுப்பெயராகப் புரிந்துகொள்ள ஆதரிக்கின்றன; ‘ராமாவில்’ என்ற இடப்பெயர் வாசிப்பு அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: וַחֲנִיתוֹ בְיָדוֹ
  choice: அவனுடைய ஈட்டி அவன் கையில் இருந்தது
  rationale: வினையில்லா எபிரேய வாக்கியத்தின் காட்சியைத் தெளிவாகவும் நேரடியாகவும் பாதுகாக்கிறது.
- source_word: וְכָל עֲבָדָיו
  choice: அவனுடைய பணியாளர்கள் அனைவரும்
  rationale: அரசவையிலுள்ள עבדים என்பது பணியாளர்கள், ஏவலர்கள் அல்லது அதிகாரிகளைக் குறிக்கலாம்; ‘பணியாளர்கள்’ என்பது குறுகிய நிர்வாகப் பொருளைத் திணிக்காத பரந்த தமிழ் சொல்.
- source_word: נִצָּבִים עָלָיו
  choice: அவனைச் சுற்றி நின்றுகொண்டிருந்தார்கள்
  rationale: சவுலின் முன்னிலையில் அவனைச் சூழ்ந்து நிலைகொண்டிருந்த அரசவைப் பணியாளர்களின் காட்சியை இயல்பான தமிழில் தருகிறது.
