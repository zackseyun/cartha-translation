  text: וַ/יֹּ֨אמֶר שָׁא֜וּל אֶל דָּוִ֗ד הִנֵּה֩ בִתִּ֨/י הַ/גְּדוֹלָ֤ה מֵרַב֙ אֹתָ/הּ֙ אֶתֶּן לְ/ךָ֣ לְ/אִשָּׁ֔ה אַ֚ךְ הֱיֵה לִּ֣/י לְ/בֶן חַ֔יִל וְ/הִלָּחֵ֖ם מִלְחֲמ֣וֹת יְהוָ֑ה וְ/שָׁא֣וּל אָמַ֗ר אַל תְּהִ֤י יָדִ/י֙ בּ֔/וֹ וּ/תְהִי ב֖/וֹ יַד פְּלִשְׁתִּֽים־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/017.yaml
  text: Then Saul said to David, “Look, my older daughter Merab—I will give her to you as a wife. Only be a valiant man for me, and fight the LORD’s battles.” For Saul said, “Let not my hand be against him, but let the hand of the Philistines be against him.”
translation:
  language: ta
  text: 'அப்போது சவுல் தாவீதிடம், “இதோ, என் மூத்த மகளான மேரபை உனக்கு மனைவியாகக் கொடுப்பேன். நீ எனக்காக வீரனாய் இருந்து, ஆண்டவருடைய போர்களில் போராடு” என்றான். சவுல் இவ்வாறு சொல்லிக்கொண்டான்: “என் கை அவனுக்கு எதிராக இருக்க வேண்டாம்; பெலிஸ்தியரின் கையே அவனுக்கு எதிராக இருக்கட்டும்.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה
  choice: இதோ
  rationale: கவனத்தை ஈர்க்கும் எபிரேயச் சொல்லின் நேரடியான உரையாடல் வலிமையை இயல்பான தமிழில் காக்கிறது.
- source_word: הַגְּדוֹלָה
  choice: மூத்த
  rationale: மகள்களைப் பற்றிய சூழலில் ‘பெரியவள்’ என்பதைக் காட்டிலும் வயதில் மூத்தவர் என்ற பொருளைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: בֶן־חַיִל
  choice: வீரமுள்ளவனாய்
  rationale: சொல்லுக்கு சொல் ‘வலிமையின் மகன்’ என்பது தமிழில் இயல்பல்ல; இங்கு போர்த் துணிவும் திறனும் கொண்டவன் என்ற பொருள்.
- source_word: מִלְחֲמוֹת יְהוָה
  choice: ஆண்டவருடைய போர்கள்
  rationale: இறைநாமத்தை மரியாதைக்குரிய வழக்கமான தமிழ் வேதாகம வடிவில் தருகிறது; இவை ஆண்டவருக்குரிய போர்கள் என்ற மூலத்தின் உரிமைத் தொடர்பைக் காக்கிறது.
- source_word: וְשָׁאוּל אָמַר
  choice: ஏனெனில் சவுல் ... என்று எண்ணினான்
  rationale: இங்கு אָמַר என்பது சவுலின் உள்ளார்ந்த திட்டத்தை அறிமுகப்படுத்துகிறது; ‘எண்ணினான்’ என்பது தொடர்ச்சியில் அந்தப் பொருளை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: יַד
  choice: கை
  rationale: செயல் அல்லது வன்முறையின் கருவியைக் குறிக்கும் மூல உருவகத்தைத் தமிழிலும் காக்கிறது.
theological_decisions:
- issue: ‘ஆண்டவருடைய போர்கள்’ என்ற புனிதப் போர் மொழி
  choice: மூலத்தின் சொற்றொடரை அப்படியே பொருளுடன் காத்தல்
  alternative: ‘ஆண்டவருக்காகப் போர் செய்’ என்று பொதுமைப்படுத்தல்
  rationale: மூலம் போர்களை ஆண்டவருக்குரியவை என்று குறிப்பாகச் சொல்கிறது; அதன் இறையியல் பதற்றத்தை மென்மைப்படுத்தவோ விரிவாக்கவோ கூடாது.
- issue: சவுலின் நோக்கத்தின் வெளிப்பாடு
  choice: அவன் நேரடியாகத் தாவீதைக் கொல்லாமல் பெலிஸ்தரால் கொல்லப்படச் செய்ய எண்ணியதாக உரையின் எதிர்மறை இணைப்பைக் காத்தல்
  alternative: அவன் வெறும் ஆபத்தான பணியை அளித்தான் என மங்கலாக்கல்
  rationale: ‘என் கை... வேண்டாம்; பெலிஸ்தரின் கையே... இருக்கட்டும்’ என்பது மறைமுகமாகத் தீங்கு செய்யும் நோக்கத்தைத் தெளிவாக வெளிப்படுத்துகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், உரையாடலுக்கு இயல்பானதாயும் வரலாற்றுக் கதையின் கண்ணியமான தொனியைப் பேணுவதாகவும் வடிவமைக்கப்பட்டது. ‘இதோ’, ‘கை’ போன்ற மூல உருவகங்கள் வாசிக்கத் தெளிவாக இருப்பதால் காக்கப்பட்டன.
