  yaml_path: translation/ot/1_samuel/018/011.yaml
  text: Saul hurled the spear and said, “I will pin David to the wall.” But David dodged away from him twice.
translation:
  language: ta
  text: சவுல் ஈட்டியை எறிந்து, “தாவீதைச் சுவரில் குத்திப் பதித்துவிடுவேன்” என்று சொன்னான்.[a] ஆனால் தாவீது அவனிடமிருந்து இருமுறை விலகித் தப்பினான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயில் சொல் முறையாக, “தாவீதிலும் சுவரிலும் அடிப்பேன்” என்ற வடிவம் உள்ளது; இங்கு பொருள், ஈட்டியால் தாவீதைச் சுவரில் பதித்துவிடுதல்.
    reason: אַכֶּה בְדָוִד וּבַקִּיר என்ற சொல்லமைப்பின் நேரடி வடிவத்தையும், சூழலில் தெளிவாகும் வழக்குமொழிப் பொருளையும் பதிவு செய்கிறது.
lexical_decisions:
- source_word: וַיָּטֶל
  choice: எறிந்து
  rationale: இவ்வினைச்சொல் இங்கு ஈட்டியை வலுவாக வீசுவதைக் குறிக்கிறது; இயல்பான நவீனத் தமிழில் ‘எறிந்து’ தெளிவாக உள்ளது.
- source_word: אַכֶּה בְדָוִד וּבַקִּיר
  choice: தாவீதைச் சுவரோடு சேர்த்துக் குத்திவிடுவேன்
  rationale: எபிரெயச் சொற்றொடர் சொல் முறையில் ‘தாவீதையும் சுவரையும் தாக்குவேன்’ எனத் தோன்றினாலும், சூழலில் ஈட்டியால் தாவீதைச் சுவரில் குத்திப் பதிப்பதே நோக்கம். தமிழில் அந்தப் படிமத்தை இயல்பாகக் காக்கிறது.
- source_word: וַיִּסֹּב ... מִפָּנָיו
  choice: அவனிடமிருந்து விலகித் தப்பினான்
  rationale: சொல் முறையில் ‘அவன் முன்னிலையிலிருந்து திரும்பினான்’; தாக்குதலைத் தவிர்த்து விலகிய செயலைச் சூழலுக்கேற்ற தெளிவான தமிழில் வெளிப்படுத்துகிறது.
- source_word: פַּעֲמָיִם
  choice: இருமுறை
  rationale: எபிரெய இருமை எண்ணிக்கையை நேரடியாகவும் சுருக்கமாகவும் தருகிறது.
theological_decisions:
- issue: וַיֹּאמֶר என்பதன் வெளிப்பாடு
  choice: ‘என்று நினைத்தான்’
  alternative: ‘என்று சொன்னான்’
  rationale: எபிரெயில் ‘சொன்னான்’ என்ற வினை இருந்தாலும், இச்சூழலில் அது உள்ளார்ந்த எண்ணம் அல்லது தனக்குள் கூறியது எனப் புரியக்கூடும். செயல் நோக்கத்தை இயல்பாகத் தெரிவிக்க ‘நினைத்தான்’ எனத் தேர்ந்தெடுத்து, அடிக்குறிப்பில் நேரடியான மாற்றைத் தரப்பட்டுள்ளது.
- issue: தாவீதையும் சுவரையும் தாக்குதல் என்ற சொற்றொடரின் பொருள்
  choice: தாவீதைச் சுவரோடு சேர்த்துக் குத்துதல்
  alternative: தாவீதையும் சுவரையும் தாக்குதல்
  rationale: ஈட்டியால் சுவரில் பதியச் செய்வது என்ற சூழல்சார் பொருளைத் தருகிறது; எபிரெய வடிவின் தனித்தன்மையும் மாற்றுப் புரிதலும் அடிக்குறிப்பில் பாதுகாக்கப்படுகின்றன.
translation_notes:
  register: நவீன நிலையான தமிழ்; காட்சியின் தீவிரத்தை காக்கும் வகையில் இயல்பான, கண்ணியமான நடையில் அமைக்கப்பட்டுள்ளது. ‘ஈட்டி’, ‘சுவரோடு சேர்த்துக் குத்திவிடுவேன்’, ‘விலகித் தப்பினான்’ ஆகியவை சாதாரண வாசகர்களுக்கு உடனடியாகப் புரியும் சொற்கள்.
