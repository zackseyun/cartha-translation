base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/025.yaml
  text: Then Saul said[a], “Thus you shall say to David, ‘The king has no desire for a bride-price except a hundred Philistine foreskins[c][b], to take vengeance on the king’s enemies.’” Now Saul intended to make David fall by the hand of the Philistines.
translation:
  language: ta
  text: அப்போது சவுல், “நீங்கள் தாவீதிடம், ‘அரசருக்கு மணப்பரிசம்[a] எதுவும் வேண்டாம்; அரசரின் பகைவர்கள்மீது பழிவாங்குவதற்காக, நூறு பெலிஸ்தியரின் நுனித்தோல்கள் மட்டுமே வேண்டும்’ என்று சொல்லுங்கள்” என்றான். சவுலோ தாவீதைப் பெலிஸ்தியரின் கையால் வீழ்த்த நினைத்தான்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “மணப்பரிசம்” என்பது திருமணத்தை முன்னிட்டு மணமகன் அல்லது அவனது குடும்பம் மணமகளின் குடும்பத்துக்குக் கொடுக்கும் தொகை அல்லது பொருள்; இது நவீன பொருளிலுள்ள வரதட்சணை அல்ல.
    reason: cultural_note
  - marker: b
    text: “வீழ்த்த” என்பது இங்கு தாவீதின் மரணத்தை ஏற்படுத்துவதைக் குறிக்கலாம்; ஆனால் எபிரெய சொற்றொடர் அதை வெளிப்படையாகச் சொல்லவில்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֹהַר
  choice: மணப்பரிசம்
  rationale: திருமணத்தை முன்னிட்டு மணமகன் அல்லது அவனது குடும்பம் மணமகளின் குடும்பத்துக்குக் கொடுக்கும் தொகை அல்லது பொருளைக் குறிக்கிறது; நவீன வரதட்சணையுடன் குழப்பாமல் இருக்க ‘மணப்பரிசம்’ பயன்படுத்தப்பட்டது.
- source_word: אֵין חֵפֶץ לַמֶּלֶךְ ... כִּי
  choice: அரசருக்கு ... எதுவும் வேண்டாம்; ... மட்டுமே வேண்டும்
  rationale: இங்கு மறுப்பைத் தொடர்ந்து அதற்குப் பதிலாக வேண்டப்படுவது கூறப்படுகிறது. தமிழில் இயல்பாகவும் தெளிவாகவும் இந்த எதிர்மறை–மாற்று அமைப்பு தரப்பட்டது.
- source_word: בְּמֵאָה עָרְלוֹת פְּלִשְׁתִּים
  choice: பெலிஸ்தரின் நூறு நுனித்தோல்கள்
  rationale: எபிரெய உரையின் அதிர்ச்சியூட்டும் உடற்கூறு குறிப்பை மென்மைப்படுத்தாமல் நேரடியாகப் பாதுகாக்கிறது.
- source_word: לְהִנָּקֵם בְּאֹיְבֵי הַמֶּלֶךְ
  choice: அரசரின் பகைவர்களைப் பழிவாங்குவதற்காக
  rationale: נקם என்பதன் பழிவாங்கும் பொருளையும் நோக்கத்தைக் குறிக்கும் infinitive அமைப்பையும் இயல்பான தமிழில் தருகிறது.
- source_word: חָשַׁב
  choice: நினைத்தான்
  rationale: சூழலில் வெறும் எண்ணத்தைக் காட்டிலும் நோக்கம் கொண்ட திட்டத்தைச் சுட்டுகிறது; அடுத்துள்ள causative சொற்றொடருடன் சேர்ந்து தீய உள்நோக்கம் தெளிவாகிறது.
- source_word: לְהַפִּיל אֶת־דָּוִד
  choice: தாவீதை ... வீழ்த்த
  rationale: Hiphil வடிவத்தின் ‘விழச் செய்தல்’ என்ற உருவகத்தைப் பாதுகாக்கிறது; ‘கொல்ல’ என்று வெளிப்படையாக மாற்றி மூலத்தை மீறவில்லை.
- source_word: בְּיַד פְּלִשְׁתִּים
  choice: பெலிஸ்தரின் கையால்
  rationale: செயலின் கருவி அல்லது முகவரைக் குறிக்கும் எபிரெய மரபுத்தொடரை, தமிழிலும் புரியும் வேதாகமச் சொல்லாட்சியுடன் பாதுகாக்கிறது.
theological_decisions:
- issue: לְהִנָּקֵם என்ற Niphal வடிவத்தின் குரல் நுணுக்கம்
  choice: பழிவாங்குவதற்காக
  alternative: பழிதீர்த்துக்கொள்வதற்காக / பழிவாங்கப்படுவதற்காக
  rationale: இங்கு அரசன் தன் பகைவர்கள்மீது பழிவாங்குவது என்ற நோக்கம் சூழலில் தெளிவாக உள்ளது. செயப்பாட்டு வடிவில் மொழிபெயர்ப்பது தமிழில் பொருளை மங்கச் செய்யும்; அதேவேளை எந்தக் கோட்பாட்டு விளக்கமும் சேர்க்கப்படவில்லை.
- issue: ‘வீழ்த்துதல்’ மரணத்தையா தோல்வியையா குறிக்கிறது
  choice: வீழ்த்த
  alternative: கொல்ல
  rationale: சூழலில் தாவீதின் மரணம் நோக்கமாக இருக்கலாம்; எனினும் எபிரெய உருவகம் அதை வெளிப்படையாக ‘கொல்லுதல்’ என்று சொல்லாததால் அந்தத் திறந்த நுணுக்கம் பாதுகாக்கப்பட்டது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகருக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. ‘நுனித்தோல்கள்’ என்ற நேரடியான சொல் மூலத்தின் கடுமையைக் காக்கிறது. ‘சவுலோ’ என்பது உரையின் திருப்பத்தையும் அவனது மறைநோக்கையும் இயல்பாகக் காட்டுகிறது.
