translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. எபிரெயத்தின் தொடர்ச்சியான நிகழ்வு, ஒப்பீடு, ‘பெயர்’ என்ற உருவகம் ஆகியவை காக்கப்பட்டுள்ளன; שָׂכַל என்பதிலுள்ள விவேகம்–வெற்றி இருபொருள் அடிக்குறிப்பில் திறந்தவாறு வைக்கப்பட்டுள்ளது.
