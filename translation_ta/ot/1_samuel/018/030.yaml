base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/030.yaml
  text: Then the commanders of the Philistines went out[a], and as often as they went out, David acted more wisely than all the servants of Saul[c][b], so that his name was highly esteemed.
translation:
  language: ta
  text: பின்பு பெலிஸ்தியரின் படைத்தலைவர்கள் புறப்பட்டார்கள்[a]. அவர்கள் புறப்பட்ட ஒவ்வொரு முறையும், சவுலின் பணியாளர்கள் அனைவரையும்விட தாவீது அதிக விவேகத்துடன் செயல்பட்டார்[b]. அதனால் அவருடைய பெயர் மிகவும் மதிப்புக்குரியதாயிற்று[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘வெளியே வந்தார்கள்.’ எபிரெய வினைச்சொல் வெளியே செல்வதையோ வருவதையோ குறிக்கலாம்; இங்கு படை நடவடிக்கைக்காகப் புறப்படுவது சூழலுக்குப் பொருந்துகிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘மற்ற அனைவரையும்விட அதிக வெற்றி பெற்றார்.’ எபிரெய வினைச்சொல் விவேகத்துடன் செயல்படுவதையும், அதனால் வெற்றி அடைவதையும் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: சொல்லர்த்தமாக, ‘அவருடைய பெயர் மிகவும் அருமையானதாக அல்லது மதிப்புடையதாக ஆனது’; அதாவது, அவருடைய புகழ் மிகவும் உயர்வாக மதிக்கப்பட்டது.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂרֵי פְלִשְׁתִּים
  choice: பெலிஸ்தியரின் படைத்தலைவர்கள்
  rationale: שָׂרִים என்பது அதிகாரிகள் அல்லது தலைவர்களைக் குறிக்கலாம்; இங்குள்ள இராணுவச் சூழலில் ‘படைத்தலைவர்கள்’ இயல்பாகவும் துல்லியமாகவும் பொருந்துகிறது.
- source_word: וַיֵּצְאוּ
  choice: புறப்பட்டார்கள்
  rationale: יצא என்பதன் அடிப்படைப் பொருள் வெளியே செல்லுதல். இங்கு இராணுவத் தலைவர்களின் நடவடிக்கையை மிகையாக விவரிக்காமல் ‘புறப்பட்டார்கள்’ இயல்பாகக் காட்டுகிறது.
- source_word: מִדֵּי צֵאתָם
  choice: அவர்கள் புறப்பட்ட ஒவ்வொரு முறையும்
  rationale: இந்தத் தொடர் மீண்டும் மீண்டும் நிகழ்ந்த செயலை, அதாவது அவர்கள் புறப்பட்ட ஒவ்வொரு சந்தர்ப்பத்தையும், தெளிவாகக் குறிக்கிறது.
- source_word: שָׂכַל
  choice: அதிக விவேகத்துடன் செயல்பட்டார்
  rationale: இந்த வினைச்சொல் விவேகமாகச் செயல்படுவதையும் அதன் விளைவான வெற்றி அல்லது செழிப்பையும் குறிக்கக்கூடும். தமிழாக்கம் அதன் முதன்மையான விவேகப் பொருளைப் பாதுகாக்கிறது; மִכֹּל தரும் ஒப்பீட்டை ‘அனைவரையும்விட’ மற்றும் ‘அதிக’ வெளிப்படுத்துகின்றன.
- source_word: מִכֹּל עַבְדֵי שָׁאוּל
  choice: சவுலின் பணியாளர்கள் அனைவரையும்விட
  rationale: עֲבָדִים இங்கு அடிமைகளை மட்டும் அல்லாமல் அரசனுக்குப் பணியாற்றியவர்களையும் குறிக்கிறது. ‘பணியாளர்கள்’ அந்தப் பரந்த அரசவைக் கருத்தை இயல்பாகத் தருகிறது.
- source_word: וַיִּיקַר שְׁמוֹ מְאֹד
  choice: அவருடைய பெயர் மிகவும் மதிப்புக்குரியதாயிற்று
  rationale: ‘பெயர்’ என்ற எபிரெய உருவகத்தைப் பாதுகாத்தபடியே, יקר குறிப்பிடும் அருமை, கனம், மதிப்பு ஆகியவற்றை இச்சொற்றொடர் தெரிவிக்கிறது. מְאֹד என்பதன் வலியுறுத்தலை ‘மிகவும்’ தருகிறது.
