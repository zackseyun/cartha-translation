base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/006.yaml
  text: And it happened[a], as they were coming in, when David returned from striking down the Philistine, that the women came out from all the cities of Israel, singing and dancing, to meet King Saul with tambourines, with joy, and with three-stringed instruments.
translation:
  language: ta
  text: அவர்கள் வந்துகொண்டிருந்தபோது, அந்தப் பெலிஸ்தியனை வீழ்த்திவிட்டு தாவீது திரும்பிய வேளையில், இஸ்ரவேலின் எல்லா நகரங்களிலிருந்தும் பெண்கள் கைத்தப்புகளோடும் மகிழ்ச்சியோடும் மூன்று நாண்கள் கொண்ட இசைக்கருவிகளோடும்[a] பாடிக்கொண்டும் நடனமாடிக்கொண்டும் அரசன் சவுலைச் சந்திக்க வெளியே வந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயச் சொல் שָׁלִשִׁים (ஷாலிஷீம்) என்பதன் பொருள் உறுதியற்றது. இது மூன்று நாண்கள் கொண்ட இசைக்கருவிகளையோ, யாழ் வகைகளையோ, வேறொரு இசைத்துணையையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: …போது / …வேளையில்
  rationale: இது புதிய காட்சியை அறிமுகப்படுத்தும் எபிரெயக் கதைநடை வடிவம். தமிழில் தனியாக ‘அது நிகழ்ந்தது’ என்று கூறுவதைவிட, தொடர்ந்து வரும் காலநிலைத் தொடர்களோடு இயல்பாக இணைக்கப்பட்டது.
- source_word: בְּבוֹאָם
  choice: அவர்கள் வந்துகொண்டிருந்தபோது
  rationale: மூன்றாம் நபர் ஆண்பால் பன்மை விகுதி மூலத்தில் இருப்பதால், அதன் குறிப்பு இவ்வசனத்திலேயே தெளிவாக இல்லாவிட்டாலும் ‘அவர்கள்’ என்று தக்கவைக்கப்பட்டது.
- source_word: בְּשׁוּב דָּוִד
  choice: தாவீது … திரும்பிய வேளையில்
  rationale: שוב என்பதன் காலநிலைப் பொருளையும், தாவீது வெளிப்படையான எழுவாயாக இருப்பதையும் இயல்பான தமிழில் தருகிறது.
- source_word: מֵהַכּוֹת אֶת־הַפְּלִשְׁתִּי
  choice: அந்தப் பெலிஸ்தியனை வீழ்த்திவிட்டு
  rationale: נכה என்பது இச்சூழலில் தாக்கி வீழ்த்துதல் அல்லது கொல்லுதல் எனப் பொருள்படலாம். ‘வீழ்த்தி’ என்பது சம்பவத்தின் விளைவைத் தருவதோடு, வினையின் பொருளைத் தேவையின்றி மேலும் குறுக்குவதில்லை. ஒருமை வடிவம் ‘அந்தப் பெலிஸ்தியன்’ எனப் பாதுகாக்கப்பட்டது.
- source_word: וַתֵּצֶאנָה הַנָּשִׁים
  choice: பெண்கள் வெளியே வந்து
  rationale: பெண்கள் நகரங்களிலிருந்து புறப்பட்டு அரசனைச் சந்திக்க வருவதை இயல்பான தமிழில் குறிக்கிறது.
- source_word: מִכָּל עָרֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் எல்லா நகரங்களிலிருந்தும்
  rationale: மூலத்தின் தொகுப்பு அல்லது பகிர்வு சார்ந்த பொருளை நேரடியாகப் பாதுகாக்கிறது.
- source_word: לָשׁוּר וְהַמְּחֹלוֹת
  choice: பாடியும் நடனமாடியும்
  rationale: மூலத்தில் பாடுதலும் நடனங்களும் இணைக்கப்படுகின்றன. தமிழில் இணையான வினையெச்சங்களாகத் தருவது இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: לִקְרַאת שָׁאוּל הַמֶּלֶךְ
  choice: சவுல் அரசனைச் சந்திக்க
  rationale: לקראת என்பது ஒருவரை எதிர்கொண்டு சந்திப்பதற்கான நகர்வைக் குறிக்கிறது. ‘சந்திக்க’ என்பது வரவேற்பை மிகையாக விளக்காமல் அடிப்படைப் பொருளைத் தருகிறது.
- source_word: בְּתֻפִּים
  choice: கைத்தப்புகளை இசைத்து
  rationale: תֹּף என்பது கையால் வாசிக்கப்படும் சட்டகப் பறை அல்லது தம்புரின் போன்ற கருவி. ‘கைத்தப்பு’ நவீன வாசகர்களுக்குப் புரியக்கூடிய பொதுவான தமிழ்ச் சொல்.
- source_word: בְּשִׂמְחָה
  choice: மகிழ்ச்சியோடு
  rationale: பெயர்ச்சொல் வடிவிலுள்ள களிப்பு அல்லது மகிழ்ச்சி என்ற பொருளைத் தக்கவைக்கிறது.
- source_word: וּבְשָׁלִשִׁים
  choice: மூன்று நரம்பு இசைக்கருவிகளோடு[a]
  rationale: சொல்லின் துல்லியமான பொருள் உறுதியற்றது. மூன்று நரம்புகளைக் கொண்ட கருவி என்பது சாத்தியமான விளக்கம்; அந்த உறுதியின்மை அடிக்குறிப்பில் வெளிப்படையாகப் பாதுகாக்கப்பட்டது.
