translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியக்கூடிய அதேவேளையில் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் இரு இணைக் கூற்றுகளிலும் ‘சவுல்’ மீண்டும் வருவது பாதுகாக்கப்பட்டுள்ளது; காலநீடிப்பில் உள்ள பொருள் நுணுக்கம் அடிக்குறிப்பில் திறந்தவாறு வைக்கப்பட்டுள்ளது.
