base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/029.yaml
  text: Saul continued to fear David even more[b][a], and Saul was David’s enemy all his days.
translation:
  language: ta
  text: சவுல் தாவீதுக்கு இன்னும் அதிகமாக அஞ்சினான்[a]; சவுல் தாவீதுக்கு எல்லா நாள்களிலும் பகைவனாக இருந்தான்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சவுல் தாவீதுக்கு இன்னும் தொடர்ந்து அஞ்சினான்.” எபிரெய மொழியில் “மேலும் செய்தான்/தொடர்ந்தான்” என்பதற்கான மரபுத்தொடருடன் “இன்னும்” என்ற சொல்லும் சேர்ந்துள்ளது.
    reason: lexical_alternative
  - marker: b
    text: அதாவது, “சவுல் தாவீதுக்குத் தொடர்ந்து பகைவனாக இருந்தான்”; இதை “சவுல் தன் வாழ்நாளெல்லாம் தாவீதுக்குப் பகைவனாக இருந்தான்” என்றும் புரிந்துகொள்ளலாம். எபிரெயச் சொற்றொடர் சவுலின் முழு வாழ்நாளைக் கண்டிப்பாகக் குறிப்பதைவிட, பகைமை தொடர்ந்து நீடித்ததை வலியுறுத்தக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאסֶף ... לֵרֹא
  choice: இன்னும் அதிகமாக அஞ்சினான்
  rationale: יָסַף + வினையெச்ச அமைப்பு ஒரு செயல் தொடர்வதையோ மேலும் அதிகரிப்பதையோ குறிக்கிறது. עוֹד உடன் சேர்ந்து, முன்னரே இருந்த அச்சம் மேலும் தீவிரமானதை இச்சொற்றொடர் இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: מִפְּנֵי דָוִד
  choice: தாவீதுக்கு
  rationale: ירא உடன் வரும் מִפְּנֵי என்பது ஒருவரைக் கண்டு அல்லது ஒருவரைக் குறித்து அஞ்சுவதைச் சுட்டும் எபிரெய மரபுத்தொடர். தமிழில் ‘தாவீதுக்கு அஞ்சினான்’ என்பது இயல்பாக உள்ளது.
- source_word: וַיְהִי
  choice: இருந்தான்
  rationale: இங்கு היה சவுலின் நீடித்த நிலைப்பாட்டைச் சுருக்கிக் கூறுகிறது; ‘ஆனான்’ என்பதைக் காட்டிலும் ‘இருந்தான்’ அந்த நிலையைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: אֹיֵב אֶת דָּוִד
  choice: தாவீதுக்கு ... பகைவனாக
  rationale: אֹיֵב என்பது பகைவன் அல்லது எதிரி என்பதைக் குறிக்கிறது; אֶת דָּוִד இங்கு சவுலின் பகைமை யாரை நோக்கியது என்பதைச் சுட்டுகிறது.
- source_word: כָּל הַיָּמִים
  choice: எல்லா நாள்களிலும்
  rationale: எபிரெயச் சொற்றொடரின் காலநீடிப்பு சார்ந்த உண்மையான தெளிவின்மையைப் பாதுகாக்க இவ்வாறு மொழிபெயர்க்கப்பட்டது; இது ‘எப்போதும்/தொடர்ந்து’ அல்லது ‘வாழ்நாளெல்லாம்’ என்ற பொருளைக் கொள்ளலாம்.
