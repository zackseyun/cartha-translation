  text: And Saul eyed David from that day forward[a].
translation:
  language: ta
  text: சவுல் அந்த நாள்முதல் தாவீதை உற்றுநோக்கிவந்தான்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அதாவது, பொறாமை, சந்தேகம் அல்லது பகைமை கலந்த பார்வையுடன் அவனைத் தொடர்ந்து கவனித்துவந்தான் என்றும் பொருளாகலாம்.
    reason: மூலத்தில் உள்ள அரிய வினைச்சொல் சாதாரண பார்வையைவிட பகைமை அல்லது சந்தேகம் கலந்த தொடர்ந்த கவனிப்பைக் குறிக்கலாம்; துல்லியமான நிழற்பொருளைத் திறந்தவையாக வைத்திருக்கிறது.
lexical_decisions:
- source_word: וַיְהִי
  choice: பார்த்துவந்தான்
  rationale: היה என்பதன் தொடர்நிலை உணர்வைத் தமிழில் துணைவினை அமைப்பான ‘வந்தான்’ மூலம் இயல்பாக வெளிப்படுத்துகிறது; தனியே ‘நடந்தது’ என்று மொழிபெயர்க்கப்படவில்லை.
- source_word: שָׁאוּל
  choice: சவுல்
  rationale: தமிழ் வேதாகம மரபில் நிலைபெற்ற பெயர்வடிவம்.
- source_word: עון
  choice: சந்தேகக் கண்ணோடு பார்த்து
  rationale: இவ்வரிய எழுத்துவடிவம் நடுநிலையான பார்வையை அல்லாமல், பகைமை, பொறாமை அல்லது சந்தேகம் கலந்த தொடர்ந்த பார்வையைக் குறிக்கிறது. சூழலில் சவுலின் ஐயமும் வெறுப்பும் முன்னிலையில் இருப்பதால் இவ்வாறு மொழிபெயர்க்கப்பட்டது; சொல்லின் பரந்த நிழற்பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: אֶת
  choice: தாவீதை
  rationale: எபிரெய நேரடிச் செயப்படுபொருள் குறியைத் தனியே மொழிபெயர்க்காமல், தமிழின் ‘ஐ’ வேற்றுமை உருபால் காட்டுகிறது.
- source_word: דָּוִד
  choice: தாவீது
  rationale: தமிழ் வேதாகம மரபில் நிலைபெற்ற பெயர்வடிவம்; வாக்கியத்தில் ‘தாவீதை’ என வேற்றுமை பெற்றுள்ளது.
- source_word: מֵהַיּוֹם הַהוּא וָהָלְאָה
  choice: அன்று முதல்
  rationale: அந்த நாளைத் தொடக்கப் புள்ளியாகக் கொண்டு அதன்பின் தொடர்ந்த நிலையைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது; ‘பார்த்துவந்தான்’ தொடர்ச்சியை உறுதிப்படுத்துகிறது.
