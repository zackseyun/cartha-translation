- from: சவுல் அன்று முதல் தாவீதைச் சந்தேகக் கண்ணோடு பார்த்துவந்தான்[a].
  to: சவுல் அந்த நாள்முதல் தாவீதை உற்றுநோக்கிவந்தான்[a].
  rationale: முதன்மை உரையில் ‘உற்றுநோக்கிவந்தான்’ என்பதைப் பயன்படுத்துவதால் மூலத்தின் தொடர்ச்சியான, எதிர்மறைச் சாயலுள்ள கவனிப்பை இயல்பாகத் தெரிவிக்கிறது; ‘சந்தேகம்’ என்ற ஒரே விளக்கத்தில் அதைச் சுருக்குவதில்லை. அடிக்குறிப்பு பொறாமை, சந்தேகம், பகைமை ஆகிய சூழலியல் நிழற்பொருள்களைத் தெளிவுபடுத்துகிறது.
