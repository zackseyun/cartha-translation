  rationale: הוּא என்ற வெளிப்படையான வலியுறுத்தலை ‘தானும்’ காக்கிறது; ‘புறப்பட்டுச் சென்று’ என்பது தமிழ் கதைநடையில் இயல்பாக உள்ளது.
- source_word: וַיַּךְ בַּפְּלִשְׁתִּים מָאתַיִם אִישׁ
  choice: பெலிஸ்தியரில் இருநூறு பேரைக் கொன்றான்
