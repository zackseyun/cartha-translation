  register: நவீன நிலையான தமிழில், எளிதில் புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. வன்முறை மற்றும் உடற்கூறு குறித்த மூலத்தின் நேரடியான மொழி மென்மைப்படுத்தப்படவில்லை. ‘தானும்’ என்பது எபிரெய உரையின் வலியுறுத்தலைக் காக்கிறது.
