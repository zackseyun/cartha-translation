base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/027.yaml
  text: So David arose and went[a], he and his men, and struck down two hundred Philistine men. Then David brought their foreskins, and they counted them out in full to the king, so that he might become the king’s son-in-law. And Saul gave him Michal his daughter as a wife.
translation:
  language: ta
  text: தாவீது எழுந்து, தானும் தன் ஆட்களும் புறப்பட்டுச் சென்று, பெலிஸ்தியரான இருநூறு பேரைக் கொன்றான். தாவீது அவர்களுடைய நுனித்தோல்களைக் கொண்டுவந்தான்; அரசனின் மருமகனாவதற்காக அவர்கள் அவற்றை அரசனிடம் முழு எண்ணிக்கையாக ஒப்படைத்தார்கள்.[a] சவுல் தன் மகள் மீகாளை அவனுக்கு மனைவியாகக் கொடுத்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்கள் அவற்றை அரசனிடம் முழு எண்ணிக்கையாக அளித்தார்கள்.” எபிரெய வினைச்சொல் பொருள் காண்பதற்குக் கடினமானது; அது அவற்றை எண்ணி ஒப்படைத்ததையோ, அரசன் கேட்ட எண்ணிக்கையை முழுமையாக நிறைவு செய்ததையோ குறிக்கலாம்.
    reason: lexical_alternative
