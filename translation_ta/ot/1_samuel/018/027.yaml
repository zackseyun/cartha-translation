- source_word: וַיְמַלְאוּם לַמֶּלֶךְ
  choice: அவற்றை முழு எண்ணிக்கையாக அரசனிடம் ஒப்படைத்தார்கள்
  rationale: இலக்கண ரீதியாகக் கடினமான இத்தொடர், கோரப்பட்ட எண்ணிக்கையை நிறைவு செய்தல் அல்லது அரசன்முன் எண்ணி ஒப்படைத்தல் ஆகிய இரு நுணுக்கங்களையும் கொண்டிருக்கலாம். முதன்மை உரை பரிவர்த்தனைச் சூழலை இயல்பாகக் காட்டுகிறது; தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: לְהִתְחַתֵּן בַּמֶּלֶךְ
  choice: அரசனுக்கு மருமகனாவதற்காக
  rationale: חתן என்பதன் Hitpael வடிவம் திருமண உறவில் இணையுதலைக் குறிக்கிறது; இச்சூழலில் அரசனின் மகளை மணந்து அவனுக்கு மருமகனாவது என்பதே துல்லியமான பொருள்.
- source_word: וַיִּתֶּן לוֹ שָׁאוּל אֶת מִיכַל בִּתּוֹ לְאִשָּׁה
  choice: சவுல் தன் மகள் மீகாளை அவனுக்கு மனைவியாகக் கொடுத்தான்
  rationale: மூலத்தின் திருமணம் செய்து கொடுக்கும் மரபுத்தொடரை நவீனத் தமிழில் தெளிவாகவும் கண்ணியமாகவும் வழங்குகிறது.
