base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/010.yaml
  text: And it happened on the next day that an evil spirit from God rushed upon Saul[a], and he prophesied within the house while David was playing with his hand, as day by day[d][c][b]; and the spear was in Saul’s hand.
translation:
  language: ta
  text: மறுநாள், தேவனிடமிருந்து வந்த தீய ஆவி[a] சவுலின்மேல் பாய்ந்தது. அவன் வீட்டுக்குள் தீர்க்கதரிசனப் பரவசத்தில் இருந்தான்[b]. தாவீதோ வழக்கம்போல[d] தன் கையால் இசைத்துக்கொண்டிருந்தான்[c]. சவுலின் கையில் ஈட்டி இருந்தது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘தேவனிடமிருந்து வந்த தீங்கு விளைவிக்கும் ஆவி’ என்றும் மொழிபெயர்க்கலாம். எபிரெயத்தில் சொல்லுக்குச் சொல், ‘தேவனுடைய தீய ஆவி.’
    reason: lexical_alternative
  - marker: b
    text: ‘அவன் தீர்க்கதரிசனம் உரைத்தான்,’ ‘தீர்க்கதரிசன வெறியில் இருந்தான்,’ அல்லது ‘பரவச நிலையில் நடந்துகொண்டான்’ என்றும் மொழிபெயர்க்கலாம். இந்த வினை தீர்க்கதரிசனச் செயலையும் பரவசமான அல்லது கட்டுப்பாடற்ற நடத்தையையும் குறிக்கக்கூடும்.
    reason: alternative_reading
  - marker: c
    text: இந்த வசனத்தில் இசைக்கருவியின் பெயர் குறிப்பிடப்படவில்லை; அருகிலுள்ள வசனங்களில் அது அடையாளப்படுத்தப்படுகிறது.
    reason: cross_reference
  - marker: d
    text: எபிரெய மரபுத்தொடரின் பொருள், ‘அவன் நாள்தோறும் செய்ததுபோல.’
    reason: literal_idiom
lexical_decisions:
- source_word: מִמָּחֳרָת
  choice: மறுநாள்
  rationale: முந்தைய நிகழ்வுகளுக்கு அடுத்த நாளைக் குறிக்கும் இயல்பான தமிழ் காலச்சொல்.
- source_word: וַתִּצְלַח
  choice: வலிமையாக ஆட்கொண்டது
  rationale: ஆவி சவுல்மேல் திடீரெனவும் வல்லமையாகவும் வந்ததை வெளிப்படுத்துகிறது; வெறும் ‘வந்தது’ என்பதைவிட எபிரெய வினையின் தீவிரத்தைப் பேணுகிறது.
- source_word: רוּחַ אֱלֹהִים רָעָה
  choice: தேவனிடமிருந்து வந்த தீய ஆவி
  rationale: ‘தீய/தீங்கு விளைவிக்கும் ஆவி’ என்ற சொல்லாட்சியையும், அது தேவனிடமிருந்து வந்ததாக உரை கூறும் இறையியல் பதற்றத்தையும் மறைக்காமல் காக்கிறது.
- source_word: וַיִּתְנַבֵּא
  choice: தீர்க்கதரிசன வெறியில் நடந்துகொண்டான்
  rationale: வினையின் தீர்க்கதரிசனத் தொடர்பைக் காக்கும் அதேவேளையில், இச்சூழலில் அது கட்டுப்பாடற்ற பரவச அல்லது வெறிநிலையான நடத்தையைக் குறிக்கக்கூடும் என்பதையும் தெரிவிக்கிறது.
- source_word: בְּתוֹךְ הַבַּיִת
  choice: வீட்டுக்குள்
  rationale: இடத்தைக் குறிக்கும் சொற்றொடரின் இயல்பான நவீனத் தமிழ் வடிவம்.
- source_word: מְנַגֵּן בְּיָדוֹ
  choice: தன் கையால் இசைத்துக்கொண்டிருந்தான்
  rationale: இசைக்கருவி வாசித்தலைக் குறிக்கும் வினையையும் ‘தன் கையால்’ என்பதையும் பேணுகிறது; இவ்வசனத்தில் பெயரிடப்படாத கருவியைச் சேர்க்கவில்லை.
- source_word: כְּיוֹם בְּיוֹם
  choice: வழக்கம்போல
  rationale: நாள்தோறும் தொடர்ந்த வழக்கமான செயலைக் குறிக்கும் எபிரெய மரபுத்தொடரை இயல்பான தமிழில் தருகிறது.
- source_word: הַחֲנִית
  choice: ஈட்டி
  rationale: சவுலின் கையிலிருந்த ஆயுதத்திற்கான வழக்கமான தமிழ் இணைச்சொல்.
- source_word: בְּיַד שָׁאוּל
  choice: சவுலின் கையில்
  rationale: அடுத்த நிகழ்வுக்கு முன்னோட்டமாக நிற்கும் விவரத்தைத் தெளிவாகவும் இயல்பாகவும் காக்கிறது.
theological_decisions:
- issue: רוּחַ אֱלֹהִים רָעָה என்பதில் தேவனுடைய செயற்பாடும் ஆவியின் தீய அல்லது தீங்கு விளைவிக்கும் தன்மையும்
  choice: தேவனிடமிருந்து வந்த தீய ஆவி
  alternative: தேவனிடமிருந்து வந்த தீங்கு விளைவிக்கும் ஆவி; தேவனுடைய தீய ஆவி
  rationale: ஆவி தேவனிடமிருந்து வந்ததாக எபிரெய உரை கூறுவதைப் பேணுகிறது; அதேசமயம் ‘தேவனுடைய தீய ஆவி’ என்று கூறுவதால் தேவனுக்கே ஒழுக்கத் தீமையைச் சுமத்தும் தவறான புரிதலைத் தவிர்க்கிறது. மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- issue: וַיִּתְנַבֵּא உண்மையான தீர்க்கதரிசனத்தையா அல்லது பரவசமான வெறிநடத்தையையா குறிக்கிறது
  choice: தீர்க்கதரிசன வெறியில் நடந்துகொண்டான்
  alternative: தீர்க்கதரிசனம் உரைத்தான்; வெறிபிடித்தவன்போல் பிதற்றினான்
  rationale: மூலவினையின் தீர்க்கதரிசனத் தொடர்பை அழிக்காமல், தீய ஆவியும் தொடர்ந்து வரும் வன்முறையும் அமைக்கும் எதிர்மறைச் சூழலை வெளிப்படுத்துகிறது; தெளிவற்ற தன்மை அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘தீர்க்கதரிசன வெறி’ என்பது சற்றே செறிவான சொற்றொடராக இருந்தாலும், மூலத்தின் தீர்க்கதரிசனச் சொல்லையும் சூழலின் கட்டுப்பாடற்ற நிலையையும் ஒருசேர காக்கிறது. இசைக்கருவி உரையில் சேர்க்கப்படாமல் அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது.
