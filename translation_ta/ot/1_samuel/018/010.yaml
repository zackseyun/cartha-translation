revisions:
- from: மறுநாள், தேவனிடமிருந்து வந்த தீய ஆவி[a] சவுலை வலிமையாக ஆட்கொண்டது. அவன் வீட்டுக்குள் தீர்க்கதரிசன வெறியில் நடந்துகொண்டான்[b]. தாவீதோ வழக்கம்போல[d] தன் கையால் இசைத்துக்கொண்டிருந்தான்[c]. அப்போது சவுலின் கையில் ஈட்டி இருந்தது.
  to: மறுநாள், தேவனிடமிருந்து வந்த தீய ஆவி[a] சவுலின்மேல் பாய்ந்தது. அவன் வீட்டுக்குள் தீர்க்கதரிசனப் பரவசத்தில் இருந்தான்[b]. தாவீதோ வழக்கம்போல[d] தன் கையால் இசைத்துக்கொண்டிருந்தான்[c]. சவுலின் கையில் ஈட்டி இருந்தது.
  rationale: The revision more closely reflects the forceful onset denoted by וַתִּצְלַח and uses natural Tamil for Saul’s ambiguous prophetic/ecstatic activity. It preserves the textual ambiguity in footnote b, does not name David’s instrument, and retains all required footnote anchors.
