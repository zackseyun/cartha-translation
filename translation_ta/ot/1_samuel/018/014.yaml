base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/014.yaml
  text: And David was acting wisely in all his ways[a], and Yahweh was with him.
translation:
  language: ta
  text: தாவீது தன் வழிகளிலெல்லாம் விவேகத்துடன் நடந்துகொண்டார்[a]; யாவே அவரோடு இருந்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “வெற்றி பெற்றார்” / “செழித்தோங்கினார்”; எபிரேயச் சொல், வெற்றிக்கு வழிவகுக்கும் விவேகமான செயல்பாட்டைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: நடந்துகொண்டார்
  rationale: இங்கு היה வடிவம் தாவீதின் தொடர்ச்சியான நடத்தையை அறிமுகப்படுத்துகிறது; தமிழில் தனியாக ‘இருந்தார்’ எனக் கூறுவதைவிட அடுத்துள்ள מַשְׂכִּיל என்பதுடன் இயல்பாக இணைக்கப்பட்டது.
- source_word: דָוִד
  choice: தாவீது
  rationale: தமிழில் வழக்கமான வேதாகமப் பெயர்வடிவம்.
- source_word: לְכָל דָּרְכָו
  choice: தன் வழிகளிலெல்லாம்
  rationale: ‘வழி’ என்ற எபிரேய உருவகத்தைத் தக்கவைத்து, ஒருவரின் நடத்தை மற்றும் செயல்பாடுகள் அனைத்தையும் குறிக்கிறது.
- source_word: מַשְׂכִּיל
  choice: விவேகத்துடன் நடந்துகொண்டார்
  rationale: இந்தச் சொல் அறிவுடனும் மதிநுட்பத்துடனும் செயல்படுவதையும், அதன் விளைவாக வெற்றி பெறுவதையும் குறிக்கலாம். முதன்மையான செயற்பாட்டு நுணுக்கத்தை மொழிபெயர்ப்பு தக்கவைக்கிறது.
- source_word: וַיהוָה
  choice: யாவே
  rationale: மூலத்தில் வரும் இறைநாமமான יהוה என்பதை பட்டப்பெயராக மாற்றாமல் ஒலிபெயர்க்கிறது.
- source_word: עִמּוֹ
  choice: அவரோடு இருந்தார்
  rationale: உடனிருப்பு மற்றும் ஆதரவைக் குறிக்கும் எபிரேயச் சொல்லுக்கு இயல்பான தமிழ் வடிவம்.
theological_decisions:
- issue: יהוה என்ற இறைநாமத்தின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூல உரை தனிப்பட்ட உடன்படிக்கைப் பெயரை நேரடியாகப் பயன்படுத்துவதால், அதை பொதுவான பட்டப்பெயராக மாற்றாமல் ஒலிபெயர்த்துள்ளது.
- issue: தாவீதின் விவேகமும் வெற்றியும் இடையிலான தொடர்பு
  choice: முதன்மை உரையில் விவேகமான நடத்தையைச் சுட்டி, வெற்றி என்ற பொருளை அடிக்குறிப்பில் தருதல்
  alternative: தாவீது தன் செயல்களிலெல்லாம் வெற்றி பெற்றார்
  rationale: מַשְׂכִּיל என்பது விவேகமாகச் செயல்படுதல் மற்றும் அதன் விளைவான வெற்றி ஆகிய இரு நுணுக்கங்களையும் கொண்டுள்ளது; ஒன்றை மட்டும் இறுதியான பொருளாக நிர்ணயிக்காமல் மூலத்தின் பொருள் விரிவைத் தக்கவைக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான நடையைப் பயன்படுத்தியுள்ளது. ‘தன் வழிகளிலெல்லாம்’ என்பது மூல உருவகத்தைத் தக்கவைக்கிறது; ‘விவேகத்துடன் நடந்துகொண்டார்’ என்பது சாதாரண வாசகருக்குப் புரியும் வகையில் செயற்பாட்டு அர்த்தத்தை வெளிப்படுத்துகிறது.
