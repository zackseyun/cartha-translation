  yaml_path: translation/ot/1_samuel/018/024.yaml
  text: Saul’s servants told him[a], saying, “David spoke words like these.”
translation:
  language: ta
  text: சவுலின் ஊழியர்கள் அவரிடம், “தாவீது இப்படிப்பட்ட வார்த்தைகளைப் பேசினார்” என்று தெரிவித்தார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּגִּדוּ
  choice: தெரிவித்தார்கள்
  rationale: נגד என்பதன் ஹிஃபில் வடிவம் ‘தெரிவித்தல்/அறிவித்தல்’ என்று பொருள்படும்; அரசவைக் சூழலில் அறிக்கையிடும் செயலை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: עַבְדֵי שָׁאוּל
  choice: சவுலின் ஊழியர்கள்
  rationale: עבד என்பது ஊழியர்கள், பணியாளர்கள் அல்லது அரசவைப் பணியாளர்கள் எனப் பொருள்படலாம்; ‘ஊழியர்கள்’ பதவிநிலையை மிகையாகக் குறிப்பாக்காமல் அதன் பரந்த பொருளைக் காக்கிறது.
- source_word: לוֹ
  choice: அவரிடம்
  rationale: இப்பெயர்ப்பெயர் சவுலையே சுட்டுகிறது; தமிழில் ‘அவரிடம் தெரிவித்தார்கள்’ என்பது இயல்பான நடை.
- source_word: לֵאמֹר
  choice: என்று
  rationale: அறிக்கையின் உள்ளடக்கத்தை அறிமுகப்படுத்தும் எபிரெயச் சொல்லைத் தமிழின் இயல்பான மேற்கோள் இணைப்பான ‘என்று’ கொண்டு தருகிறது.
- source_word: כַּדְּבָרִים הָאֵלֶּה
  choice: இவ்வாறுதான்
  rationale: சொற்றொடர் சொல்லுக்குச் சொல் ‘இந்த வார்த்தைகளின்படி/இவற்றைப் போன்ற வார்த்தைகள்’ என அமையும்; முந்தைய வசனத்தில் கூறப்பட்ட பதிலின் சாரத்தைச் சுட்டுவதால் ‘இவ்வாறுதான்’ என்பது כ־ கூறின் ஒப்புமை/இணக்க நுணுக்கத்தைக் காத்து இயல்பாக உள்ளது.
- source_word: דִּבֶּר
  choice: பேசினார்
  rationale: דבר என்பதற்கு ‘பேசு’ நேரான இணை; தாவீதைக் குறிக்கும் மரியாதை ஒருமை தமிழில் இயல்பானது.
- source_word: דָּוִד
  choice: தாவீது
  rationale: தமிழ் வேதாகம மரபில் நிலைபெற்ற பெயர்வடிவம்.
