  source_fidelity: ‘இவ்வாறுதான் பேசினார்’ broadly conveys the sense, but it omits the explicit noun דְּבָרִים (‘words’) and the comparative/classifying force of כַּ־ (‘like/according to’). ‘இப்படிப்பட்ட வார்த்தைகளைப் பேசினார்’ preserves both elements naturally.
  naturalness: The revised wording is clear, idiomatic modern standard Tamil and retains the formal narrative register. ‘தெரிவித்தார்கள்’ and ‘ஊழியர்கள்’ are suitable in this court context.
  terminology: ‘சவுல்,’ ‘தாவீது,’ and ‘ஊழியர்கள்’ are appropriate established or broadly comprehensible forms. No theological terminology is involved.
  issues:
