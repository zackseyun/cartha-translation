  to: சவுலின் ஊழியர்கள் அவரிடம், “தாவீது இப்படிப்பட்ட வார்த்தைகளைப் பேசினார்” என்று தெரிவித்தார்கள்.
  rationale: ‘இவ்வாறுதான்’ என்பதற்குப் பதிலாக ‘இப்படிப்பட்ட வார்த்தைகளைப் பேசினார்’ என மாற்றப்பட்டுள்ளது. இது כַּדְּבָרִים הָאֵלֶּה என்பதிலுள்ள ஒப்புமை/இணக்கக் கூறையும் ‘வார்த்தைகள்’ என்ற வெளிப்படையான சொல்லையும் நவீனத் தமிழில் இயல்பாகக் காக்கிறது. அடிக்குறிப்பு எபிரெயச் சொற்றொடரின் நேரடி வடிவத்தைத் தருகிறது.
