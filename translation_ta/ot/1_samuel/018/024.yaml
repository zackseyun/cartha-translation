    issue: The phrase ‘இவ்வாறுதான்’ does not expressly translate ‘words’ (דְּבָרִים).
    rationale: The Hebrew says that David spoke ‘words like/according to these’; the draft reduces this to an adverbial ‘thus,’ losing a lexical element and slightly weakening the comparative nuance.
