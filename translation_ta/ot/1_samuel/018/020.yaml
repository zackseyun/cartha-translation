  yaml_path: translation/ot/1_samuel/018/020.yaml
  text: Michal[a], Saul's daughter, loved David, and they told Saul, and the matter pleased him.
translation:
  language: ta
  text: சவுலின் மகளான மீகாள் தாவீதை நேசித்தாள். அதைச் சவுலிடம் தெரிவித்தார்கள்; அந்தக் காரியம் அவருக்குப் பிடித்திருந்தது.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொற்சொல்லாக, “அந்தக் காரியம் அவருடைய பார்வையில் நேரானதாக/உவப்பானதாக இருந்தது.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֶּאֱהַב
  choice: நேசித்தாள்
  rationale: אהב என்ற வினை நேரடியாக அன்பு அல்லது நேசத்தைக் குறிக்கிறது. ‘காதலில் விழுந்தாள்’ என்பது சூழலில் சாத்தியமானாலும், எபிரேய வடிவில் வெளிப்படையாக இல்லாத தொடக்கநிலைக் கருத்தைச் சேர்க்கும்; எனவே ‘நேசித்தாள்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: מִיכַל
  choice: மீகாள்
  rationale: தனிப்பெயர் எபிரேய உச்சரிப்பை அண்மித்த, தமிழில் வாசிக்க இயல்பான வடிவில் ஒலிபெயர்க்கப்பட்டது.
- source_word: בַּת שָׁאוּל
  choice: சவுலின் மகள்
  rationale: எபிரேய இணைப்புத் தொடர் நவீன தமிழில் இயல்பான உடைமைத் தொடராக மொழிபெயர்க்கப்பட்டது.
- source_word: אֶת דָּוִד
  choice: தாவீதை
  rationale: אֶת என்னும் நேரடிச் செயப்படுபொருள் குறியீடு தனியே மொழிபெயர்க்கப்படாமல், தமிழின் வேற்றுமை உருபான ‘-ஐ’ மூலம் வெளிப்படுத்தப்பட்டது.
- source_word: וַיַּגִּדוּ לְשָׁאוּל
  choice: இதை அவர்கள் சவுலிடம் தெரிவித்தார்கள்
  rationale: נגד என்பதன் ஹிஃபில் வடிவம் ‘தெரிவி/அறிவி’ எனப் பொருள்படும். எபிரேயத்தில் உள்ள குறிப்பிடப்படாத மூன்றாம் நபர் பன்மை எழுவாயைப் பாதுகாக்க ‘அவர்கள்’ வைக்கப்பட்டது; ‘இதை’ என்பது முன்னர் கூறப்பட்ட செய்தியை இயல்பாகச் சுட்டுகிறது.
- source_word: וַיִּשַׁר הַדָּבָר בְּעֵינָיו
  choice: அந்தச் செய்தி அவருக்கு மகிழ்ச்சி அளித்தது
  rationale: ‘அந்தக் காரியம் அவன் கண்களில் நேரானதாக/நல்லதாக இருந்தது’ என்ற எபிரேய மரபுத்தொடர், இச்சூழலில் சவுலுக்கு அந்தச் செய்தி உவப்பாயிருந்ததைச் சொல்கிறது. தமிழில் இயல்பாக ‘மகிழ்ச்சி அளித்தது’ என வழங்கி, சொற்சொல் வடிவம் அடிக்குறிப்பில் தரப்பட்டது.
