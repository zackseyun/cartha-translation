base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/022.yaml
  text: So Saul commanded his servants[a], “Speak to David privately, saying, ‘Look, the king delights in you, and all his servants love you[b]. So now become the king’s son-in-law.’”
translation:
  language: ta
  text: 'சவுல் தன் பணியாளர்களுக்குக் கட்டளையிட்டான்: “தாவீதிடம் தனியாக[a], ‘இதோ, அரசர் உன்னிடம் பிரியமாயிருக்கிறார்; அவருடைய பணியாளர்கள் அனைவரும் உன்னை நேசிக்கிறார்கள். ஆகவே, இப்போது அரசரின் மருமகனாகு[b]’ என்று சொல்லுங்கள்.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது “மறைவாக” அல்லது “அமைதியாக.”
    reason: lexical_alternative
  - marker: b
    text: 'சொல்லுக்குச் சொல்: “அரசரோடு திருமண உறவை ஏற்படுத்திக்கொள்”; அல்லது “திருமணத்தின் மூலம் அரசரோடு உறவினனாகு.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו
  choice: கட்டளையிட்டு
  rationale: צוה என்பது அதிகாரத்துடன் கட்டளையிடுவதைக் குறிக்கிறது; சூழலின் கட்டளைத் தன்மையை இச்சொல் தெளிவாகக் காக்கிறது.
- source_word: עֲבָדוֹ / עֲבָדָיו
  choice: தன் பணியாளர்கள் / அவருடைய பணியாளர்கள்
  rationale: עבד என்பதற்கு பணியாளர், ஊழியர், அரண்மனைப் பணியாளர் போன்ற பொருள்கள் உண்டு. பதவிநிலையை மிகைப்படுத்தாமல் அரசவையின் சூழலுக்கு இயல்பாகப் பொருந்துவதால் ‘பணியாளர்கள்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: בַּלָּט
  choice: தனிப்பட்ட முறையில்
  rationale: இந்தச் சொல் பிறர் அறியாதபடி அல்லது அமைதியாகப் பேசுவதைக் குறிக்கலாம். இச்சமூகச் சூழலில் இயல்பாக உள்ள ‘தனிப்பட்ட முறையில்’ முதன்மை வாசகமாகவும், பிற சாத்தியங்கள் அடிக்குறிப்பிலும் தரப்பட்டுள்ளன.
- source_word: הִנֵּה
  choice: இதோ
  rationale: கவனத்தை ஈர்க்கும் எபிரெய உரையாடல் குறியீட்டின் சொல்லாட்சிச் சக்தியை இயல்பான நவீனத் தமிழில் காக்கிறது.
- source_word: חָפֵץ בְּךָ
  choice: உன்னிடம் பிரியமாயிருக்கிறார்
  rationale: חפץ + ב ஒருவர்மீது விருப்பமும் மகிழ்ச்சியும் கொண்டிருப்பதைக் குறிக்கிறது. காதல் அல்லது உடைமையாக்கும் விருப்பம் என்ற தவறான நிழற்பொருளைத் தவிர்த்து அரசரின் சாதகமான மனநிலையை இது வெளிப்படுத்துகிறது.
- source_word: אֲהֵבוּךָ
  choice: உன்னை நேசிக்கிறார்கள்
  rationale: אהב என்பதன் நேரடியான பொருள் ‘நேசி’; அரசவைச் சூழலில் இது அன்பு அல்லது ஆதரவைச் சுட்டினாலும், மூலத்தின் வலிமையை ‘நேசிக்கிறார்கள்’ காக்கிறது.
- source_word: וְעַתָּה
  choice: ஆகவே இப்போது
  rationale: முன்னர் கூறப்பட்ட அரசவையின் ஆதரவிலிருந்து அடுத்த நடவடிக்கைக்குச் செல்லும் காரணவிளைவு மற்றும் அறிவுறுத்தல் ஓட்டத்தை வெளிப்படுத்துகிறது.
- source_word: הִתְחַתֵּן בַּמֶּלֶךְ
  choice: அரசரின் மருமகனாகிவிடு
  rationale: חתן என்பதன் ஹித்பயேல் வடிவம் திருமண உறவுக்குள் நுழைவதைக் குறிக்கிறது. இச்சூழலில் தாவீது அரசரின் மகளை மணப்பதே நோக்கம் என்பதால், இயல்பான தமிழில் ‘அரசரின் மருமகனாகிவிடு’ என்று தரப்பட்டுள்ளது; மூலத்தின் விரிவான சொல்லமைப்பு அடிக்குறிப்பில் காக்கப்படுகிறது.
