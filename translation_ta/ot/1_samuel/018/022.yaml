translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் மரியாதையான உரைநடை பயன்படுத்தப்பட்டுள்ளது. அரசவையின் சூழலைக் காட்ட ‘அரசர்’ மற்றும் ‘பணியாளர்கள்’ பயன்படுத்தப்பட்டுள்ளன. மூலத்தில் உள்ள நேரடிப் பேச்சின் அடுக்கமைப்பும் கட்டளைத் தொனியும் காக்கப்பட்டுள்ளன; தேவையற்ற சமயப்பிரிவு சார்ந்த விளக்கம் சேர்க்கப்படவில்லை.
