source:
  edition: WLC
  text: וַ/יִּרָ֥א שָׁא֖וּל מִ/לִּ/פְנֵ֣י דָוִ֑ד כִּֽי הָיָ֤ה יְהוָה֙ עִמּ֔/וֹ וּ/מֵ/עִ֥ם שָׁא֖וּל סָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/012.yaml
  text: Saul was afraid of David[a], because Yahweh was with him and had departed from Saul.
translation:
  language: ta
  text: சவுல் தாவீதுக்குப் பயந்தான்[a]. ஏனெனில் யாவே அவனுடன் இருந்தார்; சவுலைவிட்டு அவர் விலகியிருந்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சவுல் தாவீதைக் கண்டு அஞ்சினான்.” எபிரெயத்தில் சொல்லுக்குச் சொல் “சவுல் தாவீதின் முன்னிலையிலிருந்து பயந்தான்” என்று உள்ளது; தாவீது சவுலின் பயத்திற்குரிய பொருளாக அல்லது காரணமாக இருந்தார் என்பதே இந்த மரபுத்தொடரின் பொருள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרָא
  choice: பயந்தான்
  rationale: ירא இங்கு அச்ச உணர்வைக் குறிக்கிறது. நவீனத் தமிழில் இயல்பாகவும் கதையின் உணர்ச்சி வலிமையைத் தக்கவைத்தும் ‘பயந்தான்’ என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: מִלִּפְנֵי
  choice: தாவீதுக்கு
  rationale: சொல்லுக்குச் சொல் ‘முன்னிலையிலிருந்து’ என்ற அமைப்பு இருந்தாலும், ירא என்பதுடன் இது அச்சத்தின் பொருளையோ காரணத்தையோ குறிக்கும் எபிரெய மரபுத்தொடர். ஆகவே இயல்பான தமிழில் ‘தாவீதுக்குப் பயந்தான்’ எனத் தரப்பட்டுள்ளது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: சவுலின் பயத்திற்கான காரணத்தை அறிமுகப்படுத்துவதால் தெளிவான காரண இணைப்பாக ‘ஏனெனில்’ தேர்ந்தெடுக்கப்பட்டுள்ளது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இது கடவுளின் தனிப்பெயரான நான்கெழுத்துப் பெயர். ஒரு பட்டத்தால் மாற்றாமல், தமிழில் அதன் ஒலிபெயர்ப்பான ‘யாவே’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: עִמּוֹ
  choice: அவனுடன்
  rationale: எபிரெய மூலத்தின் ஆண்பால் ஒருமைப் பதிலிடுபெயரைத் தக்கவைக்கிறது; சூழலில் அது தாவீதைக் குறிப்பது இயல்பாகத் தெரிகிறது.
- source_word: וּמֵעִם שָׁאוּל סָר
  choice: சவுலைவிட்டோ அவர் விலகியிருந்தார்
  rationale: סור என்பது விலகுதல் அல்லது அகலுதல் என்று பொருள்படும். முந்திய நிலையில் நிகழ்ந்த விலகுதல் இப்போதைய பயத்திற்குப் பின்னணியாக இருப்பதால் ‘விலகியிருந்தார்’ எனவும், இணையான இரு கூறுகளின் முரண்பாட்டைக் காட்ட ‘சவுலைவிட்டோ’ எனவும் தரப்பட்டுள்ளது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழியாக்கம்
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலவசனம் இறைவனின் தனிப்பெயரை நேரடியாகப் பயன்படுத்துகிறது. அதை ஒரு பட்டமாக மாற்றாமல் தனிப்பெயராகத் தக்கவைப்பது மூலத்திற்குச் செம்மையானது.
- issue: யாவே சவுலைவிட்டு விலகியதன் பொருள்
  choice: அவர் சவுலைவிட்டு விலகியிருந்தார் என்று வசனம் கூறும் அளவிலேயே மொழிபெயர்த்தல்
  alternative: யாவேயின் ஆவி சவுலைவிட்டு விலகியிருந்தார் / யாவேயின் ஆதரவு சவுலைவிட்டு விலகியிருந்தது
  rationale: இந்த வசனம் ‘ஆவி’ அல்லது ‘ஆதரவு’ என்று குறிப்பாகச் சொல்லவில்லை. அருகிலுள்ள வசனங்களின் விரிவான சொல்லாட்சியை இங்கு சேர்க்காமலும், கூற்றின் இறையியல் அழுத்தத்தைச் சுருக்காமலும் மூலத்தின் அமைப்பு பாதுகாக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் மரியாதையான நடையில் மொழிபெயர்க்கப்பட்டது. ‘அவனுடன்’ என்பது மூலத்தின் பதிலிடுபெயரைத் தக்கவைக்கிறது; ‘அவர்’ என்பது யாவேயைக் குறிக்கும் மரியாதைப் பதிலிடுபெயர். அரைப்புள்ளி இரு இணையான, ஆனால் முரண்படும் கூறுகளைத் தெளிவுபடுத்துகிறது.
