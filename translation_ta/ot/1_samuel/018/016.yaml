base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/016.yaml
  text: But all Israel and Judah loved David[a], because he went out and came in before them.
translation:
  language: ta
  text: ஆனால் இஸ்ரவேல் மக்கள் அனைவரும் யூதா மக்கள் அனைவரும் தாவீதை நேசித்தார்கள்; ஏனெனில் அவர் அவர்களுக்கு முன்பாகச் சென்றும் வந்தும் இருந்தார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர் அவர்களை வெளியே அழைத்துச் சென்று உள்ளே அழைத்து வந்தார்”; அதாவது, குறிப்பாகப் போரில், அவர்களுடைய பொதுத் தலைவராகச் செயல்பட்டார்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כָל
  choice: ஆனால் ... அனைவரும்
  rationale: முந்தைய சூழலில் சவுலின் அச்சத்துக்கும் பகைமைக்கும் எதிர்மாறாக மக்களின் மனநிலையை இணைப்புச்சொல் காட்டுவதால், நவீன தமிழில் ‘ஆனால்’ அதன் எதிர்மறைத் தொடர்பை இயல்பாக வெளிப்படுத்துகிறது; כָל என்பதன் முழுமையும் ‘அனைவரும்’ எனப் பாதுகாக்கப்படுகிறது.
- source_word: יִשְׂרָאֵל וִ/יהוּדָה
  choice: இஸ்ரவேலர் அனைவரும் யூதா மக்கள் அனைவரும்
  rationale: ‘இஸ்ரவேல்’ மற்றும் ‘யூதா’ எனும் இரு சமூக-அரசியல் குழுக்களையும் எபிரெய மூலத்தைப் போலத் தனித்தனியாக வைத்திருக்கிறது. ஒருமை வினையெச்சத்துடன் உள்ள கூட்டெழுவாயின் உள்ளடக்கத்தைத் தமிழில் தெளிவாகக் காட்ட இரு குழுக்களுக்கும் இயல்பான மக்கள் குறிப்பு பயன்படுத்தப்பட்டுள்ளது.
- source_word: אֹהֵב
  choice: நேசித்தார்கள்
  rationale: ஒருமைச் செயப்பெயரெச்சம் கூட்டெழுவாயைப் பற்றிய நீடித்த அல்லது பொதுவான மனநிலையைச் சொல்கிறது. தமிழ் உரைநடையில் ‘நேசித்தார்கள்’ இயல்பாகவும் கண்ணியமாகவும் அதைப் பதிவு செய்கிறது.
- source_word: אֶת דָּוִד
  choice: தாவீதை
  rationale: אֶת என்பது நேரடி செயப்படுபொருள் குறியீடு; தமிழில் பெயருடன் இரண்டாம் வேற்றுமை உருபைச் சேர்த்து ‘தாவீதை’ என வழங்கப்படுகிறது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: மக்கள் தாவீதை நேசித்ததற்கான காரணத்தை அறிமுகப்படுத்தும் காரணப் பொருள் தெளிவாகப் பாதுகாக்கப்படுகிறது.
- source_word: הוּא
  choice: அவர்
  rationale: மூலத்தில் வெளிப்படையாக உள்ள தனிப்பெயர்ச்சொல் தமிழிலும் மரியாதை ஒருமையாகத் தக்கவைக்கப்படுகிறது.
- source_word: יוֹצֵא וָ/בָא
  choice: போவதும் வருவதுமாக இருந்தார்
  rationale: சொல்லிணையின் வெளிப்படையான ‘புறப்படுதல்/செல்லுதல் மற்றும் வருதல்’ வடிவத்தைப் பாதுகாக்கிறது; மூலத்தில் வெளிப்படையாக இல்லாத ‘அவர்களை’ என்ற செயப்படுபொருளை முதன்மை உரையில் சேர்க்கவில்லை. பொதுத் தலைமை, குறிப்பாகப் படைத்தலைமை, என்ற மொழிவழக்குப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: לִ/פְנֵי/הֶם
  choice: அவர்களுக்கு முன்பாக
  rationale: ‘அவர்களுக்கு முன்பாக’ என்பது சொல்லுக்கு நெருக்கமான மொழிபெயர்ப்பு; மக்கள் முன்னிலையில் செயல்படுதல் அல்லது அவர்களுக்குத் தலைமை தாங்குதல் ஆகிய இரு சாத்தியங்களையும் தீர்மானிக்காமல் திறந்துவைக்கிறது.
