revisions:
- from: ஆனால் இஸ்ரவேலர் அனைவரும் யூதா மக்கள் அனைவரும் தாவீதை நேசித்தார்கள்; ஏனெனில் அவர் அவர்களுக்கு முன்பாகப் போவதும் வருவதுமாக இருந்தார்.[a]
  to: ஆனால் இஸ்ரவேல் மக்கள் அனைவரும் யூதா மக்கள் அனைவரும் தாவீதை நேசித்தார்கள்; ஏனெனில் அவர் அவர்களுக்கு முன்பாகச் சென்றும் வந்தும் இருந்தார்.[a]
  rationale: The revision corrects the coordination and parallelism of ‘all Israel and Judah,’ improves the naturalness of the literal main-text idiom while retaining its ambiguity, and corrects the explanatory wording in the lexical-alternative footnote. No unstated object is added to the main text.
