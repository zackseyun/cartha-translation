  text: Saul took him that day and did not allow him to return to his father's house[a].
translation:
  language: ta
  text: அந்த நாளில் சவுல் அவனைத் தன்னிடம் எடுத்துக்கொண்டான்; அவன் தன் தந்தையின் வீட்டுக்குத் திரும்பிச் செல்ல சவுல் அனுமதிக்கவில்லை.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவன் திரும்பிச் செல்ல அனுமதிக்கவில்லை.” எபிரேயத்தில் சொற்சொல்லாக, “திரும்பிச் செல்ல அவனைக் கொடுக்கவில்லை”; இங்கு נתן என்பது அனுமதிப்பதைக் குறிக்கும் மரபுத்தொடராக உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקָּחֵהוּ
  choice: அவனைத் தன்னுடன் வைத்துக்கொண்டான்
  rationale: לקח என்பதன் அடிப்படைப் பொருள் ‘எடுத்துக்கொள்.’ இச்சூழலில் சவுல் தாவீதைத் தன் அரசவையிலும் சேவையிலும் தன்னுடன் வைத்துக்கொண்டதை இயல்பான தமிழில் வெளிப்படுத்துகிறது; தேவையற்ற விரிவாக்கம் தவிர்க்கப்படுகிறது.
- source_word: שָׁאוּל
  choice: சவுல்
  rationale: தமிழ் வேதாகம மரபில் பரவலாக அறியப்படும் பெயர்வடிவம்.
- source_word: בַּיּוֹם הַהוּא
  choice: அன்றே
  rationale: ‘அந்த நாளில்’ என்ற காலக் குறிப்பைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது; ஏ விகுதி அன்றே நிகழ்ந்ததை வலியுறுத்துகிறது.
- source_word: וְלֹא נְתָנוֹ
  choice: அவனை அனுமதிக்கவில்லை
  rationale: נתן + வினையெச்ச அமைப்பு இங்கு அனுமதி கொடுப்பதைக் குறிக்கும் எபிரேய மரபுத்தொடர். சொற்சொல்லான ‘அவனைக் கொடுக்கவில்லை’ என்பது தமிழில் பொருளை மறைக்கும்.
- source_word: לָשׁוּב
  choice: திரும்பிச் செல்ல
  rationale: שׁוב என்பதன் நேரடியான பொருளான ‘திரும்புதல்’ என்பதை இலக்கிடத்தை நோக்கிய இயல்பான தமிழில் தருகிறது.
- source_word: בֵּית אָבִיו
  choice: அவனுடைய தந்தையின் வீட்டுக்கு
  rationale: தந்தையின் வீடு அல்லது குடும்ப இல்லம் என்னும் எபிரேய குடும்பச் சொல்லாட்சியைத் தெளிவாகவும் இயல்பாகவும் காக்கிறது.
