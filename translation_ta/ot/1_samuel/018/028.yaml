reference: 1 Samuel 18:28
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יַּ֤רְא שָׁאוּל֙ וַ/יֵּ֔דַע כִּ֥י יְהוָ֖ה עִם דָּוִ֑ד וּ/מִיכַ֥ל בַּת שָׁא֖וּל אֲהֵבַֽתְ/הוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/028.yaml
  text: Saul saw and knew that Yahweh was with David[a], and that Michal the daughter of Saul loved him.
translation:
  language: ta
  text: சவுல், யாவே தாவீதோடு இருந்தார் என்பதையும், சவுலின் மகள் மீகாள் அவனை நேசித்தாள் என்பதையும் கண்டு அறிந்தான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּרְא
  choice: கண்டு
  rationale: ראה என்பதன் அடிப்படைப் பொருள் ‘காண்’. அடுத்துவரும் וַיֵּדַע உடன் இணைந்து, கவனித்ததிலிருந்து அறிதலுக்கு நகரும் எபிரெய நடைமுறையை ‘கண்டு அறிந்துகொண்டான்’ இயல்பாகப் பாதுகாக்கிறது.
- source_word: וַיֵּדַע
  choice: அறிந்துகொண்டான்
  rationale: ידע இங்கு சவுல் தான் கண்டவற்றின் அடிப்படையில் உறுதியாக உணர்ந்ததைச் சுட்டுகிறது. ‘அறிந்துகொண்டான்’ என்பது தமிழ்க் கதைநடையில் இயல்பாகவும் ‘கண்டு’ என்பதோடு பொருத்தமாகவும் உள்ளது.
- source_word: כִּי
  choice: …என்பதை / …தையும்
  rationale: இங்கு כִּי சவுல் அறிந்ததன் உள்ளடக்கத்தை அறிமுகப்படுத்துகிறது. தமிழில் இணையான இரு செயப்படுபொருள் உட்பிரிவுகளையும் ‘…தையும் …தையும்’ என அமைப்பது இயல்பானது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: நான்கெழுத்துத் தெய்வீகப் பெயரை ஒரு பட்டமாக மாற்றாமல், தமிழில் பரவலாக அறியப்படும் தனிப்பெயர் வடிவமான ‘யெகோவா’ என வழங்குகிறது.
- source_word: עִם דָּוִד
  choice: தாவீதோடு இருந்ததையும்
  rationale: עִם என்பது உடனிருத்தல் அல்லது தொடர்பைக் குறிக்கிறது. ‘தாவீதோடு இருந்தார்’ என்று பாலைக் குறிப்பதைவிட, மூலத்தின் பாலினக் குறியீடற்ற வினை அமைப்பை ‘இருந்தது’ வடிவம் நெருக்கமாகப் பாதுகாக்கிறது; இச்சூழலில் தெய்வீக உடனிருப்பும் ஆதரவும் மறைமுகமாக நிலைக்கின்றன.
- source_word: וּמִיכַל בַּת שָׁאוּל
  choice: சவுலின் மகள் மீகாள்
  rationale: எபிரெயக் கட்டமைப்பு ‘சவுலின் மகள் மீகாள்’ என்பதாகும். தமிழில் உறவைக் காட்டும் இயல்பான உடைமை அமைப்பைப் பயன்படுத்தி, அந்த அடையாளத்தைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: אֲהֵבַתְהוּ
  choice: அவனை நேசித்ததையும்
  rationale: அன்புகூரும் தொடர்நிலை/நிலைமையைச் சுட்டும் வடிவம். ‘நேசித்தாள்’ என்ற எளிய இறந்தகாலப் பொருள் தமிழ்க் கதைநடையில் இயல்பானது; ‘காதலில் விழுந்தாள்’ என்பது மூலத்தில் இல்லாத தொடக்கநிலையைச் சேர்த்துவிடும்.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரின் மொழிபெயர்ப்பு
  choice: யெகோவா
  alternative: யாவே
  rationale: மூலத்தில் பட்டமான אֲדֹנָי அல்ல, தனிப்பெயரான நான்கெழுத்துப் பெயரே உள்ளது. தமிழில் நீண்டகாலமாக நிலைபெற்ற ‘யெகோவா’ என்ற ஒலிபெயர்ப்பு தனிப்பெயரின் தன்மையைப் பாதுகாக்கிறது; ‘யாவே’ என்பது கல்வியுலகில் பரவலான மாற்று ஒலிப்பாக்கம்.
- issue: யெகோவா தாவீதோடு ‘இருத்தல்’ என்பதன் பொருள்
  choice: தாவீதோடு இருந்தது
  alternative: தாவீதுக்கு ஆதரவாக இருந்தது
  rationale: עִם என்பதன் நேரடியான உடனிருப்பு மொழியைப் பாதுகாத்து, அது தெய்வீகப் பிரசன்னமா, ஆதரவா, அருளா என்பதைக் குறிப்பாக விரித்து விளக்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், எளிமையான ஆனால் கண்ணியமான கதைநடை. ‘கண்டு அறிந்துகொண்டான்’ என்ற இணைப்பு மூலத்தின் இரு வினைகளையும் பாதுகாக்கிறது. வசனத்திற்கு விளக்கக் குறிப்பு தேவையில்லை.
