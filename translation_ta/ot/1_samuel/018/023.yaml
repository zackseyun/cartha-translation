source:
  edition: WLC
  text: וַֽ/יְדַבְּר֞וּ עַבְדֵ֤י שָׁאוּל֙ בְּ/אָזְנֵ֣י דָוִ֔ד אֶת הַ/דְּבָרִ֖ים הָ/אֵ֑לֶּה וַ/יֹּ֣אמֶר דָּוִ֗ד הַֽ/נְקַלָּ֤ה בְ/עֵֽינֵי/כֶם֙ הִתְחַתֵּ֣ן בַּ/מֶּ֔לֶךְ וְ/אָנֹכִ֖י אִֽישׁ רָ֥שׁ וְ/נִקְלֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/023.yaml
  text: So Saul’s servants spoke these words in David’s hearing[a], and David said, “Does it seem to you a small thing to become the king’s son-in-law, when I am a poor and lightly regarded man?”
translation:
  language: ta
  text: சவுலின் பணியாளர்கள் இந்த வார்த்தைகளைத் தாவீதின் காதில் படும்படி சொன்னார்கள். அதற்குத் தாவீது, “நான் ஏழையும் அற்பமாகக் கருதப்படுகிறவனுமாய் இருக்கையில், அரசரின் மருமகனாவது உங்கள் பார்வையில் அற்பமான காரியமா?” என்றான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבְּרוּ
  choice: சொன்னார்கள்
  rationale: கதைநடையில் דּבר என்பதன் எளிய பேச்சுச் செயலை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: בְּאָזְנֵי דָוִד
  choice: தாவீதின் காதில் படும்படி
  rationale: ‘தாவீதின் காதுகளில்’ என்ற எபிரேய மரபுத்தொடரின் பொருளையும் செவிப்புலன் சார்ந்த உருவகத்தையும் இயல்பான தமிழில் காக்கிறது.
- source_word: אֶת־הַדְּבָרִים הָאֵלֶּה
  choice: இந்த வார்த்தைகளை
  rationale: உடனடியான செய்தியைக் குறிக்கும் எளிய, மூலத்துக்கு நெருக்கமான மொழிபெயர்ப்பு.
- source_word: הַנְקַלָּה בְעֵינֵיכֶם
  choice: உங்கள் பார்வையில் அற்பமான காரியமா
  rationale: ‘உங்கள் கண்களில் எளிதானது/அற்பமானது’ என்ற மதிப்பீட்டு மரபுத்தொடரையும் வினாவியல் வலிமையையும் காக்கிறது.
- source_word: הִתְחַתֵּן בַּמֶּלֶךְ
  choice: அரசரின் மருமகனாவது
  rationale: சூழலில் அரசரின் மகளை மணந்து அவருடைய மருமகனாவதைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: וְאָנֹכִי
  choice: நான் ... இருக்கையில்
  rationale: இணைப்புச் சொல்லின் சூழல்சார் முரண்பாட்டு அல்லது நிலையைக் காட்டும் வலிமையை, கண்டிப்பாகக் காரணவாக்கியமாக மாற்றாமல் காக்கிறது.
- source_word: אִישׁ רָשׁ
  choice: ஏழை
  rationale: தாவீதின் பொருளாதார மற்றும் சமூகத் தாழ்நிலையை நேரடியாகத் தெரிவிக்கிறது; தமிழில் ‘மனிதன்’ என்பதைச் சேர்ப்பது தேவையற்ற கனத்தை உண்டாக்கும்.
- source_word: וְנִקְלֶה
  choice: அற்பமாகக் கருதப்படுகிறவன்
  rationale: சமூகத்தில் மதிப்புக் குறைந்தவனாகக் கருதப்படுதல் என்ற பொருளைத் தருவதோடு, முந்தைய הַנְקַלָּה உடனான சொல்வேர்த் தொடர்பையும் ‘அற்பமான’ என்பதன் மூலம் காக்கிறது.
