translation_notes:
  register: நவீனத் தரமான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘அரசர்’ என்பது கதைநடை மரியாதைநிலைக்கு ஏற்றது. ஒரே קלל சொல்வேரின் மீளுருவாக்கத்தை ‘அற்பமான / அற்பமாக’ எனக் காத்து, தாவீதின் வினாவுக்கும் தன்னைப் பற்றிய மதிப்பீட்டுக்கும் உள்ள சொல் தொடர்பு வெளிப்படுத்தப்பட்டுள்ளது.
