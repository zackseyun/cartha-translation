  source_fidelity: 'மூல எபிரேயத்தின் கூறுகள் துல்லியமாகக் காக்கப்பட்டுள்ளன: சவுலின் பணியாளர்கள் தாவீது கேட்கும்படி பேசுதல், ‘உங்கள் பார்வையில்’ என்ற மதிப்பீட்டு வினா, அரசருடன் திருமண உறவு ஏற்படுத்துதல், தாவீதின் ஏழ்மை மற்றும் சமூக மதிப்புக் குறைவு ஆகிய அனைத்தும் இடம்பெறுகின்றன. ‘அரசரின் மருமகனாவது’ சூழலுக்கு உரிய தெளிவான மொழிபெயர்ப்பு.'
