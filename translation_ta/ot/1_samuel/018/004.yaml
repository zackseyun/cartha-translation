source:
  edition: WLC
  text: וַ/יִּתְפַּשֵּׁ֣ט יְהוֹנָתָ֗ן אֶֽת הַ/מְּעִיל֙ אֲשֶׁ֣ר עָלָ֔י/ו וַֽ/יִּתְּנֵ֖/הוּ לְ/דָוִ֑ד וּ/מַדָּ֕י/ו וְ/עַד חַרְבּ֥/וֹ וְ/עַד קַשְׁתּ֖/וֹ וְ/עַד חֲגֹרֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/004.yaml
  text: Then Jonathan stripped off the robe that was on him and gave it to David[a], along with his armor, and even his sword, his bow, and his belt.
translation:
  language: ta
  text: யோனத்தான் தான் அணிந்திருந்த மேலங்கியைக் கழற்றி தாவீதுக்குக் கொடுத்தான்; தன் உடைகளையும், தன் வாளையும், வில்லையும், இடுப்புக்கச்சையையும்கூடக் கொடுத்தான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “உடைகள்” என்பதற்குப் பதிலாக “போர்சார் உடைகள்” அல்லது “அலுவல்சார் உடைகள்” என்றும் மொழிபெயர்க்கலாம்; எபிரெயச் சொல் பொதுவாக உடைகளையும், குறிப்பாக அலுவல் அல்லது போர்சார் உடைகளையும் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְפַּשֵּׁט
  choice: கழற்றி
  rationale: התפעל வடிவம் ஒருவர் தாம் அணிந்திருப்பதைத் தாமே அகற்றுவதைக் குறிக்கிறது. தமிழில் ‘கழற்றி’ என்பது இயல்பாகவும் தெளிவாகவும் இருந்து, முற்றிலும் ஆடையின்றி ஆனார் என்ற தேவையற்ற பொருளைத் தராது.
- source_word: הַמְּעִיל
  choice: மேலங்கி
  rationale: מְעִיל என்பது பொதுவாக உடலின் மேல் அணியும் அங்கி அல்லது மேலாடையைக் குறிக்கும். ‘மேலங்கி’ நவீனத் தமிழில் தெளிவானதும் சூழலுக்கு ஏற்றதும் ஆகும்.
- source_word: אֲשֶׁר עָלָיו
  choice: தான் அணிந்திருந்த
  rationale: சொல்லுக்குச் சொல் ‘அவன்மேல் இருந்த’ என்பதற்குப் பதிலாக, அதே குறிப்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: וַיִּתְּנֵהוּ לְדָוִד
  choice: தாவீதுக்குக் கொடுத்தான்
  rationale: எளிய கதைநடை வினையாக மொழிபெயர்க்கப்பட்டுள்ளது; எதைச் கொடுத்தான் என்பது முன்வரும் ‘மேலங்கி’ மூலம் தெளிவாகிறது.
- source_word: וּמַדָּיו
  choice: தன் போருடைகளையும்
  rationale: מַדִּים என்பதற்கு உடைகள், குறிப்பாக அலுவல் அல்லது போர்சார் உடைகள் என்ற பொருள் உண்டு. வாள், வில், இடுப்புக்கச்சை ஆகியவை தொடர்வதால் ‘போருடைகள்’ சூழலைப் பிரதிபலிக்கிறது; ஆனால் மூலச்சொல்லின் விரிந்த பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: וְעַד
  choice: ஆகியவற்றையும்கூட
  rationale: மீண்டும் வரும் עַד கொடுக்கப்பட்ட பொருட்களின் பட்டியலை வாள், வில், கச்சை வரை விரிவாக்குகிறது. ‘ஆகியவற்றையும்கூட’ இந்த வலியுறுத்தலை இயல்பான தமிழில் காட்டுகிறது.
- source_word: חַרְבּוֹ
  choice: தன் வாள்
  rationale: חֶרֶב என்பதன் இச்சூழலுக்குரிய நேரான தமிழ் இணை.
- source_word: קַשְׁתּוֹ
  choice: வில்
  rationale: קֶשֶׁת என்பதன் வழக்கமான தமிழ் இணை; பட்டியலில் ஏற்கெனவே வரும் ‘தன்’ இதற்கும் பொருந்துகிறது.
- source_word: חֲגֹרוֹ
  choice: இடுப்புக்கச்சை
  rationale: חֲגוֹר என்பது இடுப்பைச் சுற்றிக் கட்டப்படும் பொருளைக் குறிக்கிறது. ‘இடுப்புக்கச்சை’ என்பது பொதுவான ‘கச்சை’ என்பதைவிடத் துல்லியமானது; பழமையான அல்லது தெளிவற்ற சொல்லாட்சியைத் தவிர்க்கிறது.
theological_decisions:
- issue: யோனத்தான் கொடுத்த பரிசுகளின் கதைசார் முக்கியத்துவம்
  choice: இச்செயல் உடன்படிக்கை நட்பையோ, அரசுரிமை மாற்றத்தையோ, தாவீதின் எதிர்கால அரசாட்சியை அங்கீகரிப்பதையோ வெளிப்படையாகக் குறிக்கிறது என்று வசனத்தில் சேர்க்காமல், நிகழ்ந்த செயல்களை மட்டும் விவரித்தல்.
  alternative: இந்தப் பரிசுகள் தாவீது எதிர்கால அரசன் என்பதை யோனத்தான் அங்கீகரித்ததன் அடையாளம் என்று வெளிப்படையாக மொழிபெயர்த்தல்; அல்லது இவை உடன்படிக்கை நட்பின் அடையாளங்கள் மட்டும் என்று கூறுதல்.
  rationale: எபிரெய உரை பொருட்கள் கொடுக்கப்பட்டதைக் கூறுகிறது; அவற்றின் குறியீட்டு அர்த்தத்தை இந்த வசனத்தில் நேரடியாக விளக்கவில்லை. எனவே கதை மற்றும் இறையியல் சார்ந்த இயல்பான பதற்றம் தீர்க்கப்படாமல் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரமான, மரியாதைமிக்க, எளிதில் புரியும் தமிழ் பயன்படுத்தப்பட்டுள்ளது. எபிரெயப் பட்டியலின் பெருக்கத்தையும் இறுதி வலியுறுத்தலையும் இயல்பான தமிழ் தொடரால் பாதுகாத்துள்ளது; வசனத்தில் இல்லாத குறியீட்டு விளக்கம் சேர்க்கப்படவில்லை.
