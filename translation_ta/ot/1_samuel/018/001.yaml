reference: 1 Samuel 18:1
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יְהִ֗י כְּ/כַלֹּת/וֹ֙ לְ/דַבֵּ֣ר אֶל שָׁא֔וּל וְ/נֶ֨פֶשׁ֙ יְה֣וֹנָתָ֔ן נִקְשְׁרָ֖ה בְּ/נֶ֣פֶשׁ דָּוִ֑ד ו/יאהבו יְהוֹנָתָ֖ן כְּ/נַפְשֽׁ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/001.yaml
  text: And it happened[a], when he had finished speaking to Saul, that Jonathan’s soul was bound to David’s soul[b], and Jonathan loved him as his own soul.
translation:
  language: ta
  text: தாவீது சவுலிடம் பேசி முடித்தபோது, யோனத்தானின் ஆத்துமா[b] தாவீதின் ஆத்துமாவோடு பிணைக்கப்பட்டது[a]; யோனத்தான் தாவீதைத் தன் ஆத்துமாவைப் போல நேசித்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யோனத்தானின் ஆத்துமா தாவீதின் ஆத்துமாவோடு பின்னப்பட்டது.”
    reason: lexical_alternative
  - marker: b
    text: 'இந்த வசனத்தில் “ஆத்துமா” (எபிரெயத்தில் நெஃபெஷ்) என்ற சொல் மூன்று முறை வருகிறது: “யோனத்தானின் ஆத்துமா ... தாவீதின் ஆத்துமா ... தன் ஆத்துமா.”'
    reason: lexical_repetition
lexical_decisions:
- source_word: וַיְהִי
  choice: —
  rationale: எபிரெயக் கதைத் தொடர் சூத்திரம் தமிழில் தனியே ‘நடந்தது’ என்று மொழிபெயர்க்கப்பட்டால் செயற்கையாக ஒலிக்கும்; காலவாக்கியத்துடன் இயல்பாக ஒருங்கிணைக்கப்பட்டது.
- source_word: כְּכַלֹּתוֹ לְדַבֵּר אֶל־שָׁאוּל
  choice: அவர் சவுலிடம் பேசி முடித்தபோது
  rationale: כְּ + வினையெச்சக் கட்டமைப்பு குறிக்கும் காலத் தொடரையும், אֶל குறிக்கும் பேச்சின் திசையையும் தெளிவாகக் காக்கிறது.
- source_word: נֶפֶשׁ
  choice: ஆத்துமா
  rationale: வசனத்தில் மூன்று முறை வரும் ஒரே எபிரெயச் சொல்லின் மீளுரையைப் பாதுகாக்கிறது; ஆழமான தனிப்பட்ட பிணைப்பையும் வெளிப்படுத்துகிறது.
- source_word: נִקְשְׁרָה
  choice: பிணைக்கப்பட்டது
  rationale: קשר என்பதன் ‘கட்டு/பிணை’ உருவகத்தை இயல்பான நவீனத் தமிழில் காக்கிறது.
- source_word: בְּנֶפֶשׁ דָּוִד
  choice: தாவீதின் ஆத்துமாவோடு
  rationale: בְּ இங்குக் காட்டும் இணைப்பை ‘-ஓடு’ இயல்பாக வெளிப்படுத்துகிறது; נֶפֶשׁ என்ற சொல்லையும் மறைக்கவில்லை.
- source_word: וַיֶּאֱהָבוֹ
  choice: யோனத்தான் அவரை ... நேசித்தார்
  rationale: பொருள் குழப்பம் தவிர்க்க யோனத்தானை வெளிப்படையான எழுவாயாகக் கொண்டு, ஆண்பால் ஒருமை பொருள் விகுதியை ‘அவரை’ எனத் தருகிறது.
- source_word: כְּנַפְשׁוֹ
  choice: தன் ஆத்துமாவைப் போல
  rationale: נֶפֶשׁ சொல்லின் மூன்றாவது நிகழ்வையும் ஒப்பீட்டின் வலிமையையும் காக்கிறது; ‘தன்னைப் போல’ என்று சுருக்கவில்லை.
theological_decisions:
- issue: தாவீதின்மீது யோனத்தானின் அன்பின் இயல்பு
  choice: ஆழமான தனிப்பட்ட பிணைப்பையும் அன்பையும் உரை கூறும் வலிமையோடு மொழிபெயர்த்தல்; பாலியல் அல்லது காதல் சார்ந்த பொருளைச் சேர்க்காமல் இருத்தல்.
  alternative: இதனை முதன்மையாக அரசியல் கூட்டணி எனவோ, காதல்/பாலியல் அன்பு எனவோ விளக்குதல்.
  rationale: נֶפֶשׁ மற்றும் אהב ஆழமான பாசத்தையும் தனிப்பட்ட பிணைப்பையும் தெரிவிக்கின்றன; ஆனால் இவ்வசனம் மட்டுமே அதன் இயல்பை அதற்கு மேல் வரையறுக்கவில்லை.
translation_notes:
  register: நவீன நிலையான, கண்ணியமான தமிழ். ‘ஆத்துமா’ என்ற சொல் சாதாரணப் பேச்சில் ஓரளவு சமயச் சாயல் கொண்டிருந்தாலும், மூலத்தின் திட்டமிட்ட மும்முறைச் சொல் மீளுரையையும் உறவின் தீவிரத்தையும் பாதுகாக்க இங்கு பயன்படுத்தப்பட்டுள்ளது. மரியாதை ஒருமை வினைமுற்றுகளும் சுட்டுப்பெயர்களும் இயல்பான தமிழ் நடை கருதி பயன்படுத்தப்பட்டன.
