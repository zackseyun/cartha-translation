  to: தாவீது சவுலிடம் பேசி முடித்தபோது, யோனத்தானின் ஆத்துமா[b] தாவீதின் ஆத்துமாவோடு பிணைக்கப்பட்டது[a]; யோனத்தான் தாவீதைத் தன் ஆத்துமாவைப் போல நேசித்தார்.
