base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/021.yaml
  text: Then Saul said[a], “I will give her to him, so that she may become a snare to him and the hand of the Philistines may be against him.” So Saul said to David, “By the second one you may become my son-in-law today.”
translation:
  language: ta
  text: அப்போது சவுல், “நான் அவளை அவனுக்குக் கொடுப்பேன்; அவள் அவனுக்குக் கண்ணியாக இருக்கவும், பெலிஸ்தியரின் கை அவனுக்கு எதிராக வரவும் செய்வேன்” என்று சொன்னான். பின்னர் சவுல் தாவீதிடம், “இரண்டாமவளின் மூலம்[a] நீ இன்று எனக்கு மருமகனாகலாம்” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இரண்டாவது முறையாக நீ இன்று எனக்கு மருமகனாகலாம்.” எபிரெயச் சொற்றொடர் சுருக்கமானதும் தெளிவற்றதுமாக உள்ளது; அது சவுலின் இரண்டாவது மகளையோ, சவுலின் குடும்பத்தில் திருமண உறவு ஏற்படுத்திக்கொள்ள தாவீதுக்குக் கிடைத்த இரண்டாவது வாய்ப்பையோ குறிக்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: אֶתְּנֶנָּה לּוֹ
  choice: நான் அவளை அவனுக்குக் கொடுப்பேன்
  rationale: திருமணச் சூழலில் மகளை மணமுடித்துக் கொடுப்பதை இச்சொற்றொடர் குறிக்கிறது; எபிரெயச் சொல்லமைப்பின் சுருக்கத்தையும் சூழல் தரும் திருமணப் பொருளையும் காக்கிறது.
- source_word: וּתְהִי לוֹ לְמוֹקֵשׁ
  choice: அவள் அவனுக்குக் கண்ணியாக இருப்பாள்
  rationale: מוֹקֵשׁ என்பதன் கண்ணி/பொறி உருவகத்தை ‘கண்ணி’ இயல்பாகவும் வேதாகம நடைக்கு ஏற்றவாறும் தக்கவைக்கிறது.
- source_word: וּתְהִי בוֹ יַד פְּלִשְׁתִּים
  choice: பெலிஸ்தரின் கை அவனுக்கு எதிராக இருக்கும்
  rationale: பகைமையான வல்லமை அல்லது தாக்குதலைக் குறிக்கும் ‘கை’ என்னும் எபிரெய உருவகத்தைப் பாதுகாத்து, ‘எதிராக’ என்பதன் மூலம் பொருளைத் தெளிவாக்குகிறது.
- source_word: בִּשְׁתַּיִם
  choice: இரண்டாவதின் மூலம்
  rationale: இது நீக்கக்கூறுடைய தெளிவற்ற சொற்றொடர். சூழலில் சவுலின் இரண்டாவது மகளைக் குறிக்க வாய்ப்பு அதிகம்; எனினும் ‘இரண்டாவது முறையாக’ என்ற வாசிப்பும் சாத்தியம் என்பதால் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: תִּתְחַתֵּן בִּי
  choice: நீ எனக்கு மருமகனாகலாம்
  rationale: חתן என்பதன் இவ்வடிவம் திருமண உறவுக்குள் நுழைவதைக் குறிக்கிறது; இங்கு குறிப்பாக சவுலின் மருமகனாவதை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: הַיּוֹם
  choice: இன்று
  rationale: சொல்லின் நேரடியான காலப் பொருளையும் சவுலின் பேச்சிலுள்ள உடனடித் தன்மையையும் காக்கிறது.
- source_word: וַיֹּאמֶר ... וַיֹּאמֶר
  choice: என்று நினைத்தான் ... என்றான்
  rationale: முதலாவது கூற்று சவுலின் உள்ளார்ந்த திட்டமாகச் சூழலில் அமைகிறது; இரண்டாவது தாவீதிடம் நேரடியாகச் சொல்லப்படுகிறது. தமிழில் இயல்பாக இந்த வேறுபாடு வெளிப்படுத்தப்படுகிறது.
