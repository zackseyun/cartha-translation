translation_notes:
  register: நவீன பொதுத்தரத் தமிழில் இயல்பான, கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘கண்ணி’, ‘கை’ ஆகிய மூல உருவகங்கள் பாதுகாக்கப்பட்டுள்ளன; கடைசி சொற்றொடரின் உண்மையான தெளிவின்மை அடிக்குறிப்பில் வைக்கப்பட்டுள்ளது.
