base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/007.yaml
  text: And the women who were celebrating sang responsively[a], saying, “Saul has struck down his thousands[c][b], and David his tens of thousands.”
translation:
  language: ta
  text: 'கொண்டாடிக்கொண்டிருந்த[b] பெண்கள் இவ்வாறு சொல்லி மாறிமாறிப் பாடினார்கள்[a]:


    “சவுல் ஆயிரக்கணக்கானோரை வீழ்த்தினான்;

    தாவீதோ பதினாயிரக்கணக்கானோரை.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஒருவருக்கொருவர் பதிலளித்துப் பாடினார்கள்.” இங்கு ஒருவர் பாட மற்றவர் பதிலளிக்கும் பாங்கிலான பாடல் குறிக்கப்பட்டிருக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: இந்த எபிரெயப் பெயரெச்ச வடிவம் விழாவாக விளையாடுதல், நடனமாடுதல் அல்லது மகிழ்ந்திருத்தல் ஆகியவற்றையும் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּעֲנֶינָה
  choice: மாறிமாறிப் பாடினார்கள்
  rationale: ענה என்பதன் அடிப்படைப் பொருள் ‘பதிலளித்தல்.’ பாடல் நிகழும் இச்சூழலில், ஒருவர் பாட மற்றவர் பதிலளிக்கும் பாங்கிலான பாடலை இது குறிக்கிறது; இயல்பான நவீனத் தமிழில் ‘மாறிமாறிப் பாடினார்கள்’ அந்த நிகழ்த்தல் நுட்பத்தைத் தெளிவாகத் தருகிறது.
- source_word: הַנָּשִׁים
  choice: பெண்கள்
  rationale: எபிரெயப் பன்மைப் பெயர்ச்சொல்லை நேரடியாகவும் வெளிப்படையாகவும் மொழிபெயர்க்கிறது.
- source_word: הַמְשַׂחֲקוֹת
  choice: கொண்டாடிக்கொண்டிருந்த
  rationale: שׂחק என்ற வினையின் பங்கேற்புவடிவம் இவ்விழாச் சூழலில் விளையாடுதல், ஆடுதல், மகிழ்தல் ஆகியவற்றை உள்ளடக்கலாம். அவற்றில் ஒன்றை மட்டும் தேவையின்றிக் குறிப்பாக்காமல், ‘கொண்டாடிக்கொண்டிருந்த’ என்ற பரந்த இயல்பான சொல் பயன்படுத்தப்படுகிறது.
- source_word: וַתֹּאמַרְןָ
  choice: இவ்வாறு சொல்லி
  rationale: மேற்கோள் பாடலுடன் இயல்பாக இணையும் வகையில், ‘அவர்கள் சொன்னார்கள்’ என்ற கதைத் தொடரைத் தமிழில் ‘இவ்வாறு சொல்லி’ என்று வழங்குகிறது.
- source_word: הִכָּה
  choice: வீழ்த்தியது
  rationale: נכה என்பதன் நேரடிப் பொருள் ‘அடித்தது’; இங்கு போர்ச் சூழலில் கொல்லுதல் அல்லது போரில் வீழ்த்துதல் என்ற வலிமை உள்ளது. ‘வீழ்த்தியது’ அந்த இராணுவப் பொருளைக் காக்கிறது; ‘கொன்றது’ என்று மட்டும் குறுக்குவதில்லை.
- source_word: בַּאֲלָפָו
  choice: ஆயிரக்கணக்கானோரை
  rationale: முன்னிடைச்சொல்லும் எண்ணும் இங்கு போரில் வீழ்த்தப்பட்டோரின் எண்ணிக்கையைச் சொல்லும் மரபுத்தொடராக உள்ளன. தமிழில் ‘ஆயிரக்கணக்கானோரை’ என்பது இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: בְּרִבְבֹתָיו
  choice: பதினாயிரக்கணக்கானோரை
  rationale: רבבה என்பது ‘பதினாயிரம்’ அல்லது மிகப் பெருந்தொகையைக் குறிக்கிறது. பன்மை வடிவத்தையும் சவுலின் ‘ஆயிரக்கணக்கானோர்’ என்பதுடனான கவிதை ஒப்புமையையும் ‘பதினாயிரக்கணக்கானோரை’ காக்கிறது.
