translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் அதேவேளையில் பாடல் வரியின் கண்ணியமும் இணை அமைப்பும் காக்கப்பட்டுள்ளன. இரண்டாம் அடியில் எபிரெய மூலத்தில் வினைச்சொல் விடுபட்டுள்ளதால், தமிழிலும் ‘வீழ்த்தியது’ மீண்டும் சேர்க்கப்படாமல் கவிதைச் சுருக்கம் பாதுகாக்கப்பட்டுள்ளது.
