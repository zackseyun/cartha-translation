translation:
  language: ta
  text: சவுல், அவன் மிகவும் வெற்றிகரமாகச் செயல்படுவதைக் கண்டபோது[a], அவனுக்கு அஞ்சினார்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவன் மிகவும் விவேகமாக நடந்துகொண்டதைக் கண்டபோது” அல்லது “அவன் மிகுந்த வெற்றி பெற்றதைக் கண்டபோது.” எபிரேய வினைச்சொல் விவேகமான நடத்தையையும் அதனால் விளையும் வெற்றியையும் குறிக்கக்கூடும்.
    reason: lexical_alternative
  - marker: b
    text: எபிரேயத்தில் சொல்லுக்குச் சொல், “அவன் முன்னிலையிலிருந்து அஞ்சினார்.” இது அவனை அஞ்சினார் என்பதைக் குறிக்கும் எபிரேய மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא שָׁאוּל
  choice: சவுல் ... கண்டபோது
  rationale: வாவ் தொடர்வினை கதையை முன்னெடுத்தாலும், அடுத்த வினையின் விளைவை அறிமுகப்படுத்தும் காலத் தொடர்பைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: אֲשֶׁר הוּא מַשְׂכִּיל מְאֹד
  choice: அவன் மிகவும் விவேகமாகச் செயல்பட்டு வெற்றி பெறுவதை
  rationale: שׂכל என்பதன் ஹிஃபில் வடிவம் விவேகமான நடத்தை மற்றும் அதனால் விளையும் வெற்றி ஆகிய இரண்டையும் குறிக்கக்கூடும். ஒன்றை மட்டும் தேர்ந்து மற்றதை மறைக்காமல், தமிழில் இரு பொருள் நிழல்களையும் சுருக்கமாகத் தக்கவைக்கிறது.
- source_word: וַיָּגָר מִפָּנָיו
  choice: அவனைக் கண்டு அஞ்சினார்
  rationale: மொழியுருவில் ‘அவன் முன்னிலையிலிருந்து அஞ்சினார்’ என இருந்தாலும், இது ஒருவரைக் குறித்த அச்சத்தைச் சொல்லும் எபிரேய மரபுத்தொடர். ‘அவனைக் கண்டு அஞ்சினார்’ என்பது இயல்பான தமிழில் அந்த உறவையும் காரணநிழலையும் தருகிறது.
