  source_fidelity: யோனத்தான் ஒருமைச் செய்பொருளாகத் தாவீதுடன் உடன்படிக்கை செய்தான் என்ற வினை அமைப்பைத் தமிழ் உரை துல்லியமாகக் காக்கிறது. כרת ברית என்ற மரபுத்தொடர் இயல்பான தமிழில் ‘உடன்படிக்கை செய்தான்’ எனச் சரியாக வழங்கப்பட்டுள்ளது. அன்பைக் குறிக்கும் தொடரில் உள்ள எபிரெய மூன்றாம் நபர் பிரதிப்பெயர்களின் முறையான தெளிவின்மையை அடிக்குறிப்பு பதிவு செய்கிறது; உடனடி சூழல் ஆதரிக்கும் யோனத்தான்–தாவீது வாசிப்பே முதன்மை உரையில் தரப்பட்டுள்ளது.
