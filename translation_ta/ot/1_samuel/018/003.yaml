base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/003.yaml
  text: Then Jonathan made a covenant with David[b][a], because he loved him as his own soul.
translation:
  language: ta
  text: யோனத்தான் தாவீதுடன் ஓர் உடன்படிக்கை செய்தான்[a]; ஏனெனில், அவன் தாவீதைத் தன் உயிரைப் போல நேசித்தான்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'சொல்லுக்குச் சொல்: “ஓர் உடன்படிக்கையை வெட்டினான்.”'
    reason: lexical_alternative
  - marker: b
    text: “அவன் அவன்மேல் கொண்டிருந்த அன்பினால்” என்றும் மொழிபெயர்க்கலாம். எபிரெயப் பிரதிப்பெயர்கள் இலக்கண வடிவில் தெளிவற்றவை; ஆனால் யோனத்தான் தாவீதைத் தன் உயிரைப் போல நேசித்தான் என்பதையே சூழல் ஆதரிக்கிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּכְרֹת
  choice: செய்தான்
  rationale: כרת ברית என்பதன் சொற்பொருள் ‘உடன்படிக்கையை வெட்டுதல்’ என்றாலும், தமிழில் ‘உடன்படிக்கை செய்தான்’ என்பதே இயல்பாகவும் தெளிவாகவும் அந்த மரபுத்தொடரின் பொருளை அளிக்கிறது.
- source_word: יְהוֹנָתָן
  choice: யோனத்தான்
  rationale: எபிரெயப் பெயரின் ஒலிப்பைத் தமிழில் வழக்கமான வேதாகமப் பெயருருவில் தருகிறது.
- source_word: וְדָוִד
  choice: தாவீதுடன்
  rationale: எபிரெய வாவ் இங்கு உடன்படிக்கையில் இணைந்த மற்ற நபரை அறிமுகப்படுத்துகிறது; ஒருமை வினைச்சொல்லின்படி யோனத்தானே செய்பொருள் என்பதைக் காட்ட ‘தாவீதுடன்’ என இயல்பான தமிழில் தரப்பட்டுள்ளது.
- source_word: בְּרִית
  choice: உடன்படிக்கை
  rationale: கட்டுப்படுத்தும், உறவுசார், முறையான ஒப்பந்தத்தின் வலிமையைப் பாதுகாக்கிறது.
- source_word: בְּאַהֲבָתוֹ אֹתוֹ
  choice: ஏனெனில், அவன் தாவீதை ... நேசித்தான்
  rationale: ב முன்னொட்டைச் சூழலுக்கேற்ப காரணப் பொருளில் எடுத்துள்ளது. எபிரெயப் பிரதிப்பெயர்களின் இலக்கணத் தெளிவின்மையை அடிக்குறிப்பில் காத்துக்கொண்டு, சூழல் சுட்டும் யோனத்தான்–தாவீது தொடர்பை முதன்மை உரையில் தெளிவாக்குகிறது.
- source_word: כְּנַפְשׁוֹ
  choice: தன் உயிரைப் போல
  rationale: נפשׁ இங்கு ‘உயிர்/தன்னையே’ என்ற ஆழ்ந்த தனிப்பட்ட பற்றை உணர்த்துகிறது. ‘தன் உயிரைப் போல’ என்பது எபிரெய உருவகத்தைப் பாதுகாக்கும் இயல்பான நவீனத் தமிழ்.
theological_decisions:
- issue: அன்பு செலுத்தியவர் மற்றும் அன்புக்குரியவர் குறித்த மூன்றாம் நபர் பிரதிப்பெயர்களின் தொடர்பு
  choice: யோனத்தான் தாவீதைத் தன் உயிரைப் போல நேசித்தான்
  alternative: தாவீது யோனத்தானைத் தன் உயிரைப் போல நேசித்தான்; அல்லது பிரதிப்பெயர்களைத் தெளிவுபடுத்தாமல் விடுதல்
  rationale: எபிரெயப் பிரதிப்பெயர்கள் தனியே பார்க்கையில் இலக்கணரீதியாகத் தெளிவற்றவை. ஆனால் 18:1–3 சூழலும் இவ்வசனத்தின் ஒருமை வினைச்சொல்லும் யோனத்தானை முதன்மைச் செய்பொருளாக வலுவாகச் சுட்டுகின்றன. உறவின் தன்மை குறித்து கூடுதல் கோட்பாட்டைச் சேர்க்காமல், மாற்று வாய்ப்பை அடிக்குறிப்பில் பதிவு செய்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான நடை. எபிரெய ஒருமை வினைச்சொல்லுக்கு ஏற்ப யோனத்தான் செய்பொருளாகவும் தாவீது உடன்படிக்கையின் இணைநபராகவும் தரப்பட்டுள்ளார். ‘உயிர்’ என்பது נפשׁ என்பதன் உருவக வலிமையைக் காத்து, சாதாரண வாசகருக்கும் தெளிவாக உள்ளது.
