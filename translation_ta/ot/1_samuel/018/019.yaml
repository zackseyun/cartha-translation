translation:
  language: ta
  text: ஆனால் சவுலின் மகள் மேரபைத் தாவீதுக்குக் கொடுக்கும் நேரம் வந்தபோது, அவள் மெகோலாவைச் சேர்ந்த அத்ரியேலுக்கு மனைவியாகக் கொடுக்கப்பட்டாள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי בְּעֵת תֵּת
  choice: கொடுக்க வேண்டிய நேரம் வந்தபோது
  rationale: இந்த எபிரேயக் காலக் கட்டமைப்பு ஒரு குறிப்பிட்ட நிகழ்வு நிகழ வேண்டிய நேரத்தை அறிமுகப்படுத்துகிறது. தமிழில் இயல்பாகவும், எதிர்பார்க்கப்பட்ட திருமண ஏற்பாட்டின் நேரத்தையும் தெளிவாகவும் தெரிவிக்கிறது.
- source_word: אֶת מֵרַב בַּת שָׁאוּל
  choice: சவுலின் மகள் மேரபை
  rationale: மேரபின் குடும்ப அடையாளத்தைத் தெளிவாகக் காத்து, இயல்பான தமிழ் சொல் வரிசையில் தருகிறது.
- source_word: לְדָוִד
  choice: தாவீதுக்கு
  rationale: திருமண ஏற்பாட்டில் நோக்கப்பட்ட பெறுநரை לְ முன்னிடைச்சொல் குறிக்கிறது.
- source_word: וְהִיא נִתְּנָה
  choice: அவள் ... கொடுக்கப்பட்டாள்
  rationale: எதிர்பாராத முடிவை மேரபின் மீது மையப்படுத்தும் எபிரேயச் செயப்பாட்டு வடிவத்தைத் தமிழிலும் காக்கிறது.
- source_word: לְעַדְרִיאֵל הַמְּחֹלָתִי
  choice: மெகோலாத்தியனான அதிரியேலுக்கு
  rationale: தனிப்பெயரையும், மெகோலாவைச் சேர்ந்தவர் என்பதைக் குறிக்கும் இன/ஊரடைப் பெயரையும் இயல்பான தமிழில் தருகிறது.
- source_word: לְאִשָּׁה
  choice: மனைவியாக
  rationale: இது திருமணத்தைக் குறிக்கும் வழக்கமான எபிரேயச் சொற்றொடர்; 'மனைவியாக' என்பது நேரடியும் இயல்பானதுமான தமிழ் வடிவம்.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியக்கூடிய அதேவேளையில் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. வசனத்தின் எதிர்பார்ப்பு–மாற்றம் 'ஆனால்' என்பதால் வெளிப்படுத்தப்பட்டுள்ளது; எபிரேய மூலத்தில் தனி உரைவேறுபாடு அல்லது விளக்கக் குறிப்பைத் தேவைப்படுத்தும் தெளிவின்மை இல்லாததால் அடிக்குறிப்பு சேர்க்கப்படவில்லை.
