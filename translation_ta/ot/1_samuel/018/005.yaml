base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/005.yaml
  text: David went out wherever Saul sent him[a], and he acted wisely. So Saul appointed him over the men of war[b], and this was good in the eyes of all the people and also in the eyes of Saul’s servants.
translation:
  language: ta
  text: சவுல் அவனை அனுப்பிய எல்லாக் காரியங்களிலும் தாவீது சென்று, விவேகமாகச் செயல்பட்டான்.[a] ஆகவே சவுல் அவனைப் போர்வீரர்களின் தலைவனாக நியமித்தான். இது மக்கள் அனைவரின் பார்வையிலும் சவுலின் பணியாளர்களின் பார்வையிலும் நல்லதாக இருந்தது.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “வெற்றி பெற்றான்.” எபிரெய மொழியில் உள்ள שׂכל என்பதன் ஹிபில் வடிவம் விவேகமாகச் செயல்படுவதையும், அதன் விளைவாக வெற்றி பெறுவதையும் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “இது மக்கள் அனைவருக்கும் சவுலின் பணியாளர்களுக்கும் விருப்பமாக இருந்தது.” எபிரெய உரை தாவீதையே குறிக்கிறதா, அவனுடைய நியமனத்தைக் குறிக்கிறதா, அல்லது இங்கு விவரிக்கப்பட்ட முழுச் சூழலையும் குறிக்கிறதா என்பது தெளிவாக இல்லை.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: சென்று
  rationale: יצא என்பதன் அடிப்படைப் பொருள் ‘வெளியே போதல்.’ இச்சூழலில் சவுல் கொடுத்த பணிகள் அல்லது படை நடவடிக்கைகளுக்காகத் தாவீது செல்வதைக் குறிக்கிறது; தமிழில் ‘சென்று’ என்பது இயல்பாகவும் தேவையற்ற விளக்கமின்றியும் இதைத் தெரிவிக்கிறது.
- source_word: בְּכֹל אֲשֶׁר יִשְׁלָחֶנּוּ שָׁאוּל
  choice: சவுல் அனுப்பிய இடமெல்லாம்
  rationale: எபிரெய சொற்றொடர் ‘சவுல் அவனை அனுப்பிய எல்லாவற்றிலும்’ என்ற விரிவான பொருளைக் கொண்டது. இக்கதைச் சூழலில் மீண்டும் மீண்டும் அனுப்பப்பட்ட பணிகள் அல்லது இடங்களை இயல்பான தமிழில் இது வெளிப்படுத்துகிறது.
- source_word: יַשְׂכִּיל
  choice: விவேகமாகச் செயல்பட்டான்
  rationale: שׂכל என்பதன் Hiphil வடிவம் விவேகத்துடன் நடந்துகொள்வதையும் அதன் விளைவாக வெற்றி பெறுவதையும் குறிக்கலாம். முதன்மை உரையில் விவேகத்தின் நுணுக்கம் வைக்கப்பட்டு, வெற்றி என்ற மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: וַיְשִׂמֵהוּ ... עַל
  choice: அவனை ... அதிகாரியாக நியமித்தான்
  rationale: שׂים உடன் עַל வரும்போது ஒருவரை மற்றவர்கள்மேல் பொறுப்பில் அமர்த்துதல் அல்லது நியமித்தல் என்று பொருள்படும். ‘அதிகாரியாக நியமித்தான்’ என்பது நிர்வாக மற்றும் படைத் தலைமையின் கருத்தைத் தெளிவாகச் சொல்கிறது; குறிப்பிட்ட பதவிப் பெயரை உரையில் சேர்ப்பதில்லை.
- source_word: אַנְשֵׁי הַמִּלְחָמָה
  choice: போர்வீரர்கள்
  rationale: சொல்லர்த்தமாக ‘போரின் மனிதர்கள்’; நவீனத் தமிழில் ‘போர்வீரர்கள்’ என்பது படை சார்ந்த பொருளை இயல்பாகவும் கண்ணியமாகவும் தருகிறது.
- source_word: וַיִּיטַב בְּעֵינֵי
  choice: பார்வையில் ... நல்லதாக இருந்தது
  rationale: ‘கண்களில் நல்லதாக இருந்தது’ என்ற எபிரெய மதிப்பீட்டு மரபுத்தொடரின் உருவகத்தை ‘பார்வையில்’ காக்கிறது. ‘இது’ என்பது தாவீதையோ, அவனுடைய நியமனத்தையோ, முந்தைய முழுச் சூழலையோ குறிப்பதாக இருக்கக்கூடிய தெளிவின்மையைத் தீர்மானிக்காமல் விடுகிறது.
- source_word: עַבְדֵי שָׁאוּל
  choice: சவுலின் பணியாளர்கள்
  rationale: עבדים என்பது அரசவையில் பணிபுரியும் ஊழியர்கள், உதவியாளர்கள் அல்லது அதிகாரிகளையும் குறிக்கலாம். ‘பணியாளர்கள்’ என்பது சமூக உறவைப் பாதுகாத்தபடி ‘அதிகாரிகள்’ என்று அளவுக்கு மீறிக் குறுக்காமல் இருக்கும் இயல்பான தமிழ்ச் சொல்.
