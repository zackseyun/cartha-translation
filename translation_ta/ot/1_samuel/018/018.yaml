base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/018.yaml
  text: And David said to Saul[a], “Who am I, and what is my life, or my father’s family in Israel, that I should become the king’s son-in-law?”
translation:
  language: ta
  text: தாவீது சவுலிடம், “நான் யார்? என் வாழ்க்கைக்கு என்ன மதிப்பு?[a] இஸ்ரவேலில் என் தந்தையின் குடும்பத்திற்கு என்ன மதிப்பு? நான் அரசரின் மருமகனாக எப்படி ஆவேன்?” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயச் சொற்றொடர் சொல்லர்த்தமாக, “என் வாழ்க்கை யார்?” என்று உள்ளது. இது தாவீதின் அற்பத்தன்மையை வலியுறுத்தலாம்; அடுத்துவரும் “என் தந்தையின் குடும்பம்” என்பதைக் கருத்தில் கொண்டு, “என் உறவினர் யார்?” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר דָּוִד אֶל שָׁאוּל
  choice: தாவீது சவுலிடம் ... என்றான்
  rationale: எபிரெயக் கதைநடையின் தொடர்ச்சியை இயல்பான நவீனத் தமிழ்ச் சொல்வரிசையில் தருகிறது.
- source_word: מִי אָנֹכִי
  choice: நான் யார்?
  rationale: தாவீதின் தாழ்வுணர்வை வெளிப்படுத்தும் நேரடியான வினாவை முறையாகவும் இயல்பாகவும் பாதுகாக்கிறது.
- source_word: וּמִי חַיַּי
  choice: என் வாழ்க்கை எம்மாத்திரம்?
  rationale: சொல்லர்த்தத்தில் கடினமான ‘என் வாழ்க்கை யார்?’ என்ற எபிரெயத் தொடரை, தாவீதின் அற்பத்தன்மை அல்லது தாழ்ந்த நிலையைச் சுட்டும் தமிழ்ச் சொல்லாட்சியாக அளிக்கிறது; உறவினரைக் குறிக்கும் சாத்தியம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: מִשְׁפַּחַת אָבִי בְּיִשְׂרָאֵל
  choice: இஸ்ரவேலில் என் தந்தையின் குடும்பம் எம்மாத்திரம்?
  rationale: மִשְׁפָּחָה என்பதன் குடும்பம்/குலம் சார்ந்த பொருளையும், இஸ்ரவேலில் அந்தக் குடும்பத்திற்குள்ள சமூக நிலையையும் தெளிவாகக் காட்டுகிறது.
- source_word: כִּי אֶהְיֶה חָתָן לַמֶּלֶךְ
  choice: நான் அரசரின் மருமகனாவதற்கு எனக்கு என்ன தகுதி?
  rationale: எதிர்காலத் திருமண உறவையும் தாழ்மையான சொல்லாட்சியின் விளைவையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது; ‘மருமகன்’ இச்சூழலில் அரசரின் மகளை மணப்பவனைக் குறிக்கிறது.
