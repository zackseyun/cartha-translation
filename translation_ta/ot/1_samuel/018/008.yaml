  text: וַ/יִּ֨חַר לְ/שָׁא֜וּל מְאֹ֗ד וַ/יֵּ֤רַע בְּ/עֵינָי/ו֙ הַ/דָּבָ֣ר הַ/זֶּ֔ה וַ/יֹּ֗אמֶר נָתְנ֤וּ לְ/דָוִד֙ רְבָב֔וֹת וְ/לִ֥/י נָתְנ֖וּ הָ/אֲלָפִ֑ים וְ/ע֥וֹד ל֖/וֹ אַ֥ךְ הַ/מְּלוּכָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/008.yaml
  text: Then Saul became very angry[a], and this matter displeased him. He said, “They have given David ten thousands, but to me they have given the thousands[b]; what more can he have but the kingdom?”
translation:
  language: ta
  text: அப்போது சவுல் மிகவும் கோபமடைந்தான்; இந்தப் பேச்சு அவனுக்குப் பிடிக்கவில்லை. அவன், “தாவீதுக்குப் பதினாயிரங்களைக் கொடுத்தார்கள்[a]; எனக்கோ ஆயிரங்களைக் கொடுத்தார்கள். இனி அவனுக்கு அரசாட்சி மட்டுமே எஞ்சியுள்ளது!”[b] என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இங்கே “கொடுத்தார்கள்” என்பது, தாவீது பதினாயிரங்களைக் கொன்றதாகப் பாடி, அந்தப் பெருமையை அவனுக்குக் கொடுத்தார்கள் என்ற பொருளில் வருகிறது.
    reason: lexical_alternative
  - marker: b
    text: எபிரெய வாசகம் சுருக்கமாக, “இன்னும் அவனுக்கு அரசாட்சி மட்டுமே” என்கிறது. சவுலின் பார்வையில், தாவீதுக்கு அடைய எஞ்சியிருப்பது அரசாட்சி மட்டுமே என்பதே பொருள்; இதை மறைமுகக் கேள்வியாகவும் புரிந்துகொள்ளலாம்.
    reason: ambiguity
lexical_decisions:
- source_word: וַיִּחַר לְשָׁאוּל מְאֹד
  choice: சவுல் மிகவும் கோபமடைந்தான்
  rationale: எபிரெய வினைச்சொல் சொற்படியாகக் கோபம் ‘எரிவதை’க் குறிக்கிறது; מְאֹד தீவிரத்தைச் சேர்க்கிறது. நவீனத் தமிழில் ‘மிகவும் கோபமடைந்தான்’ இயல்பாகவும் தெளிவாகவும் அந்த வலிமையை வெளிப்படுத்துகிறது.
- source_word: וַיֵּרַע בְּעֵינָיו
  choice: அவனுக்குப் பிடிக்கவில்லை
  rationale: சொற்படியான பொருள் ‘அவன் கண்களில் தீயதாக இருந்தது.’ இங்கு அது சவுலின் கடுமையான விருப்பமின்மையைக் குறிக்கும் எபிரெய மரபுத்தொடர்; தமிழில் இயல்பான இணை இது.
- source_word: הַדָּבָר הַזֶּה
  choice: இந்தப் பேச்சு
  rationale: דבר என்பதற்கு ‘வார்த்தை,’ ‘பேச்சு,’ ‘விஷயம்’ ஆகிய பொருள்கள் உண்டு. முந்தைய வசனத்தில் பெண்கள் பாடிய வார்த்தைகளையே இது சுட்டுவதால் ‘இந்தப் பேச்சு’ இயல்பாகப் பொருந்துகிறது.
- source_word: נָתְנוּ
  choice: கொடுத்தார்கள்
  rationale: மூல வினைச்சொல்லின் அடிப்படைப் பொருள் ‘கொடு.’ சூழலில் இது போர்வெற்றிக்கான பெருமையை ஒருவருக்குக் கணக்கிடுவதைக் குறித்தாலும், மூலத்தின் உருவகத்தை முதன்மை உரையில் பாதுகாத்து, விளக்கத்தை அடிக்குறிப்பில் தருகிறது.
- source_word: רְבָבוֹת
  choice: பதினாயிரங்கள்
  rationale: பன்மை வடிவம் பத்தாயிரக் கணக்குகளைக் குறிக்கிறது; தொடர்ந்து வரும் ‘ஆயிரங்கள்’ என்பதுடனான திட்டமிட்ட எண்ணிக்கை முரணை இது காக்கிறது.
- source_word: הָאֲלָפִים
  choice: ஆயிரங்கள்
  rationale: மூலத்தில் உள்ள எண்ணிக்கை எதிர்மறை ஒப்பீட்டைத் தெளிவாகவும் சுருக்கமாகவும் பாதுகாக்கிறது.
- source_word: וְעוֹד לוֹ אַךְ הַמְּלוּכָה
  choice: இனி அவனுக்கு அரசாட்சி மட்டும்தான் பாக்கி!
  rationale: 'எபிரெய வாசகம் மிகவும் சுருக்கமானது: ‘இன்னும் அவனுக்கு அரசாட்சி மட்டுமே.’ சவுலின் அச்சமும் குற்றச்சாட்டும் வெளிப்படும் வகையில் தமிழில் இயல்பான வியப்புரையாக வழங்கப்பட்டுள்ளது; கேள்வியாகப் புரிந்துகொள்ளும் வாய்ப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.'
- source_word: הַמְּלוּכָה
  choice: அரசாட்சி
  rationale: இங்கு நிலப்பரப்பான ‘ராஜ்யம்’ என்பதைவிட, அரசனாக ஆளும் அதிகாரமும் பதவியும் சவுலின் கவலையாக உள்ளன; ஆகவே ‘அரசாட்சி’ பொருத்தமானது.
theological_decisions:
- issue: சவுலின் இறுதி சொற்றொடர் வியப்புரையா அல்லது மறைமுகக் கேள்வியா
  choice: சவுலின் அச்சத்தை வெளிப்படுத்தும் வியப்புரையாக முதன்மை உரையில் வழங்குதல்
  alternative: “இனி அவனுக்கு அரசாட்சியைத் தவிர வேறு என்ன வேண்டும்?” என்ற மறைமுகக் கேள்வி
  rationale: மூல எபிரெயத்தில் வெளிப்படையான கேள்விக் குறியீடோ கேள்விச் சொல்லோ இல்லை; அது சுருக்கமான முடிவுரையாக உள்ளது. எனினும் சூழலில் மறைமுகக் கேள்வியாகவும் புரிந்துகொள்ள முடிவதால் அந்த வாய்ப்பு அடிக்குறிப்பில் குறிப்பிடப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் இயல்பான ஆனால் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘பாக்கி’ என்பது பேச்சுவழக்கில் பரவலாகப் புரியும் சொல்; சவுலின் நேரடிப் பேச்சின் உணர்ச்சியையும் எபிரெயத்தின் சுருக்கத்தையும் காக்கிறது. எண்ணிக்கை முரணைத் தெளிவாக வைத்திருக்க ‘பதினாயிரங்கள்/ஆயிரங்கள்’ என்ற இணை பாதுகாக்கப்பட்டுள்ளது.
