base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/013.yaml
  text: So Saul removed him from his presence and appointed him commander of a thousand[a], and he went out and came in before the people.
translation:
  language: ta
  text: சவுல் தாவீதைத் தன்னிடமிருந்து அகற்றி, அவரை ஆயிரம் பேருக்குத் தளபதியாக நியமித்தார். தாவீது மக்களுக்கு முன்பாகப் புறப்பட்டுச் சென்று திரும்பி வந்தார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “புறப்பட்டுச் சென்று திரும்பி வந்தார்” என்பது பொதுவான அல்லது படைத்துறைச் செயல்பாட்டைக் குறிக்கக்கூடிய எபிரெயச் சொற்றொடர்; மக்களை முன்னின்று வழிநடத்துதல் என்ற பொருளும் இதில் இருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְסִרֵהוּ
  choice: தாவீதைத் தன்னிடமிருந்து அகற்றி
  rationale: ஹிப்ரு வினையின் காரணவினைப் பொருள் ‘அகற்றுதல்’ என்பதாகும். சூழலில் யாரைக் குறிக்கிறது என்பது தெளிவாக இருப்பதால், தமிழில் இயல்புக்காக ‘அவரை’ என்பதற்குப் பதிலாக ‘தாவீதை’ என வெளிப்படுத்தப்பட்டது.
- source_word: מֵעִמּוֹ
  choice: தன்னிடமிருந்து
  rationale: சொல்லுக்குச் சொல் ‘தன்னுடன் இருந்த இடத்திலிருந்து’ என்ற கருத்தை, அரண்மனை/தனிப்பட்ட உடனிருப்பு சூழலுக்கு ஏற்ற இயல்பான தமிழில் தருகிறது.
- source_word: וַיְשִׂמֵהוּ לוֹ
  choice: அவரை ... நியமித்தார்
  rationale: שׂוּם மற்றும் மறைமுகச் செயப்படுபொருள் இணைந்து ஓர் அதிகாரப் பொறுப்பில் அமர்த்துவதைக் குறிக்கின்றன; ‘நியமித்தார்’ இதைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: שַׂר אָלֶף
  choice: ஆயிரம் பேருக்குத் தளபதி
  rationale: שַׂר என்பது இங்கு படைத்துறைத் தலைவரைக் குறிக்கிறது. ‘ஆயிரம் பேர்’ என்பது எண்ணிக்கையைப் பாதுகாக்கிறது; அது கட்டாயம் துல்லியமான படைவீரர் எண்ணிக்கையா அல்லது படைப்பிரிவின் பெயரா என்பதைத் தீர்மானிக்கவில்லை.
- source_word: וַיֵּצֵא וַיָּבֹא
  choice: புறப்பட்டுச் செல்வதும் திரும்பி வருவதுமாக இருந்தார்
  rationale: மூலத்தின் ‘வெளியே சென்றான், உள்ளே வந்தான்’ என்ற இணைச்சொற்றொடரை இயல்பான தமிழில் பாதுகாக்கிறது; அதை நேரடியாக ‘படையெடுப்புகளை நடத்தினார்’ என்று குறுக்காமல், பொதுச் செயற்பாடு அல்லது தலைமை என்ற விரிந்த பொருளை விடுகிறது.
- source_word: לִפְנֵי הָעָם
  choice: மக்களுக்கு முன்பாக
  rationale: இது ‘மக்களின் பார்வையில்’ அல்லது ‘மக்களை முன்னின்று வழிநடத்தி’ எனப் பொருள்படக்கூடும். ‘முன்பாக’ என்ற தேர்வு மூலத்தின் உண்மையான பொருள் விரிவைப் பாதுகாக்கிறது.
