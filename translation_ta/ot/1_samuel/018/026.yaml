translation_notes:
  register: நவீன தரத் தமிழில் கண்ணியமான, எளிதில் புரியும் நடையைக் கையாள்கிறது. ‘தாவீதின் பார்வையில்’ என்ற எபிரெய மரபுத்தொடர் அதன் மூல உருவகத்தோடு காக்கப்பட்டுள்ளது; மணவுறவுச் சொற்றொடரின் குறிப்பான சூழற்பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
