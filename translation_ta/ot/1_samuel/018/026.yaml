revisions:
- from: அவனுடைய பணியாளர்கள் இந்த வார்த்தைகளைத் தாவீதிடம் தெரிவித்தார்கள். அரசனுக்கு மணவுறவினனாவதற்கு[a] இந்தக் காரியம் தாவீதின் பார்வையில் நல்லதாக இருந்தது. குறிக்கப்பட்ட நாட்கள் இன்னும் நிறைவடையவில்லை[b].
  to: அவனுடைய பணியாளர்கள் இந்த வார்த்தைகளைத் தாவீதிடம் தெரிவித்தார்கள். அரசனின் மருமகனாவதற்கு இந்தக் காரியம் தாவீதின் பார்வையில் நல்லதாக இருந்தது. நாட்கள் இன்னும் நிறைவடையவில்லை[b].
  rationale: The revision replaces an unnatural and ambiguous marriage-relationship expression with the contextually precise ‘அரசனின் மருமகனாவதற்கு.’ It also removes the interpretive adjective ‘குறிக்கப்பட்ட’ from the main text, leaving the contextual explanation in the footnote. Footnote a is no longer needed because the primary wording now states the contextual sense directly; footnote b remains correctly anchored.
