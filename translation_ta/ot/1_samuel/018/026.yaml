base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/026.yaml
  text: So his servants told David these words[a], and the matter seemed right in David’s eyes, to become the king’s son-in-law[c][b]; and the days had not yet been fulfilled.
translation:
  language: ta
  text: அவனுடைய பணியாளர்கள் இந்த வார்த்தைகளைத் தாவீதிடம் தெரிவித்தார்கள். அரசனின் மருமகனாவதற்கு இந்தக் காரியம் தாவீதின் பார்வையில் நல்லதாக இருந்தது. நாட்கள் இன்னும் நிறைவடையவில்லை[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: அதாவது, குறிக்கப்பட்ட காலக்கெடு இன்னும் முடிவடையவில்லை.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּגִּדוּ
  choice: தெரிவித்தார்கள்
  rationale: நגד என்பதன் ஹிஃபில் வடிவம் இங்கு ஒன்றை அறியச் செய்தல் அல்லது தெரிவித்தல் என்பதைக் குறிக்கிறது; அரசவையினர் சவுலின் சொற்களைத் தாவீதிடம் எடுத்துச் சொல்வதற்கு இது இயல்பான தமிழ்.
- source_word: עֲבָדָיו
  choice: அவனுடைய பணியாளர்கள்
  rationale: சூழலில் இவர்கள் சவுலின் அரசவைப் பணியாளர்கள். ‘பணியாளர்கள்’ என்பது அடிமைத்தனத்தைத் தேவையின்றி வலியுறுத்தாமல் மூலச்சொல்லின் பணிசார் பொருளைத் தருகிறது.
- source_word: הַדְּבָרִים הָאֵלֶּה
  choice: இந்த வார்த்தைகளை
  rationale: דברים என்பது ‘வார்த்தைகள்’ அல்லது ‘காரியங்கள்’ எனப் பொருள்படலாம்; முந்தைய செய்தி வாய்மொழியாக எடுத்துச் சொல்லப்படுவதால் ‘இந்த வார்த்தைகள்’ பொருத்தமானது.
- source_word: וַיִּשַׁר הַדָּבָר בְּעֵינֵי דָוִד
  choice: இந்தக் காரியம் தாவீதின் பார்வையில் நல்லதாக இருந்தது
  rationale: ‘அவருடைய கண்களில் நேரானது’ என்ற எபிரெய மரபுத்தொடரை, அதன் மதிப்பீட்டுப் பொருளையும் மூல உருவகத்தையும் காக்கும் இயல்பான தமிழில் வழங்குகிறது.
- source_word: לְהִתְחַתֵּן בַּמֶּלֶךְ
  choice: அரசனுக்கு மணவுறவினனாவதற்கு
  rationale: חתן என்பதன் ஹித்பயேல் வடிவம் திருமணத்தின் மூலம் உறவு ஏற்படுத்துவதைக் குறிக்கிறது. சூழலில் தாவீது அரசனின் மருமகனாவதை இது குறித்தாலும், மூலத்தின் சற்றுப் பொதுவான மணவுறவுப் பொருளை முதன்மை உரை காக்கிறது.
- source_word: וְלֹא מָלְאוּ הַיָּמִים
  choice: குறிக்கப்பட்ட நாட்கள் இன்னும் நிறைவடையவில்லை
  rationale: நாட்கள் ‘நிறைதல்’ என்பது நிர்ணயிக்கப்பட்ட காலம் முடிவடைவதைக் குறிக்கும் எபிரெய மரபுத்தொடர். சூழலுக்குத் தேவையான ‘குறிக்கப்பட்ட’ என்பதைத் தெளிவுக்காகச் சேர்த்து, ‘நிறைவடையவில்லை’ மூலம் காலக்கெடு இன்னும் முடியாததை இயல்பாகக் கூறுகிறது.
