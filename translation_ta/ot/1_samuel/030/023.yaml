source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר דָּוִ֔ד לֹֽא תַעֲשׂ֥וּ כֵ֖ן אֶחָ֑/י אֵ֠ת אֲשֶׁר נָתַ֨ן יְהוָ֥ה לָ֨/נוּ֙ וַ/יִּשְׁמֹ֣ר אֹתָ֔/נוּ וַ/יִּתֵּ֗ן אֶֽת הַ/גְּד֛וּד הַ/בָּ֥א עָלֵ֖י/נוּ בְּ/יָדֵֽ/נוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/023.yaml
  text: But David said[a], “You must not do so, my brothers, with what Yahweh has given us[c][b]. He has preserved us and has given into our hand the raiding band that came against us.”
translation:
  language: ta
  text: ஆனால் தாவீது, “என் சகோதரர்களே, யாவே நமக்குத் தந்ததைக் குறித்து நீங்கள் இவ்வாறு செய்யக்கூடாது.[a] அவர் நம்மைப் பாதுகாத்து,[b] நமக்கு எதிராக வந்த கொள்ளைக்கூட்டத்தை நம் கையில் ஒப்புக்கொடுத்தார்.[c]” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யாவே நமக்குத் தந்ததைக் கொண்டு நீங்கள் இவ்வாறு செய்யக்கூடாது.” எபிரெயக் கட்டமைப்பு சுருக்கமாக இருந்து, தாவீது விவாதிக்கும் பொருளை அறிமுகப்படுத்துகிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “நம்மைக் காத்தார்.”
    reason: lexical_alternative
  - marker: c
    text: 'சொல்லுக்குச் சொல்: “நம் கையில் தந்தார்.” இது ஒருவரை மற்றொருவரின் அதிகாரத்திற்குள் கொடுப்பதைக் குறிக்கும் எபிரெய மரபுத்தொடர்.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא תַעֲשׂוּ כֵן
  choice: நீங்கள் இப்படிச் செய்யக்கூடாது
  rationale: பன்மையில் சொல்லப்பட்ட நேரடியான தடையை, தாவீதின் கண்டிப்பான தொனியுடன் இயல்பான நவீன தமிழில் தருகிறது.
- source_word: אֶחָי
  choice: என் சகோதரர்களே
  rationale: எபிரெயச் சொல்லின் நேரடியான உறவுமுறை அழைப்பைத் தக்கவைத்து, தாவீது தன் ஆட்களை சகோதரர்களாக அழைப்பதை வெளிப்படுத்துகிறது.
- source_word: אֵת אֲשֶׁר נָתַן יְהוָה לָנוּ
  choice: யாவே நமக்குத் தந்திருக்கிறதைப் பற்றி
  rationale: சுருக்கமான எபிரெயக் கட்டமைப்பு தாவீது பேசும் பொருளை அறிமுகப்படுத்துகிறது; ‘பற்றி’ என்பது கொள்ளைப் பொருளைப் பகிர்வது குறித்த சூழலுக்கு இயல்பாகப் பொருந்துகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைவனின் தனிப்பெயரான நான்கெழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: וַיִּשְׁמֹר אֹתָנוּ
  choice: அவர் நம்மைப் பாதுகாத்து
  rationale: שׁמר இங்கு போரிலும் ஆபத்திலும் காத்தலைக் குறிக்கிறது; ‘பாதுகாத்து’ என்பது தெளிவான, இயல்பான தமிழ்.
- source_word: הַגְּדוּד
  choice: கொள்ளைக்கூட்டம்
  rationale: இந்தச் சூழலில் தாக்கி கொள்ளையிட்ட பகைவர் குழுவைக் குறிப்பதால், பொதுவான ‘படை’ என்பதைவிடத் துல்லியமானது.
- source_word: הַבָּא עָלֵינוּ
  choice: நமக்கு எதிராக வந்த
  rationale: அந்தக் குழுவின் பகைமையான அணுகுதலை, தாக்குதல் என்று கூடுதலாக விளக்காமல் தக்கவைக்கிறது.
- source_word: בְּיָדֵנוּ
  choice: நம் கையில் ஒப்புக்கொடுத்தார்
  rationale: எபிரெய ‘கையில்’ என்ற அதிகாரம் அல்லது கட்டுப்பாட்டைக் குறிக்கும் உருவகத்தைத் தக்கவைத்து, தமிழில் பொருள் தெளிவாக இருக்க ‘ஒப்புக்கொடுத்தார்’ என வழங்குகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைபெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலத்தில் தனிப்பெயர் நேரடியாக உள்ளது. அதை பொதுப்பட்டமாக மாற்றாமல், பரவலாக அறியப்படும் தமிழ் ஒலிப்பெயர்ப்பில் தருவது மூல வேறுபாட்டைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியக்கூடிய கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. தாவீதின் நேரடியான தடையும், யாவே அளித்த பாதுகாப்பும் வெற்றியும் தெளிவாக வைக்கப்பட்டுள்ளன; சுருக்கமான אֵת கட்டமைப்பின் உண்மையான மாற்று புரிதல் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
