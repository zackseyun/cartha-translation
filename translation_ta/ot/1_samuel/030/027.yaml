  yaml_path: translation/ot/1_samuel/030/027.yaml
  text: to those in Bethel[a], to those in Ramoth-negeb, and to those in Jattir—
translation:
  language: ta
  text: பெத்தேலில் இருந்தவர்களுக்கும், ராமோத்-நெகேபில் இருந்தவர்களுக்கும்[a], யத்தீரில் இருந்தவர்களுக்கும்—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நெகேபிலுள்ள ராமோத்தில்,” அதாவது, “தெற்கு ராமோத்தில்.”
    reason: רָמוֹת נֶגֶב என்ற இடப்பெயரில் נֶגֶב என்பதைப் பிரதேசப் பெயராகவோ திசை அடைமொழியாகவோ புரிந்துகொள்ள முடியும் என்பதைக் காக்கிறது.
lexical_decisions:
- source_word: לַאֲשֶׁר
  choice: இருந்தவர்களுக்கும்
  rationale: לְ முன்னொட்டு பெறுநர்களைக் குறிக்கிறது; אֲשֶׁר உடன் சேர்ந்து, ஒவ்வொரு இடத்திலும் இருந்தவர்களைப் பகிர்ந்தளிப்பு முறையில் சுட்டுகிறது. சூழலில் முந்தைய வினையின் பொருள் தொடர்வதால், தமிழில் ‘இருந்தவர்களுக்கும்’ என்பது இயல்பாகவும் தத்துவார்த்த விளக்கத்தைச் சேர்க்காமலும் உள்ளது.
- source_word: בְּבֵית אֵל
  choice: பெத்தேலில்
  rationale: இங்கு இது ‘தேவனுடைய வீடு’ என்ற பொதுப்பெயர்ச் சொற்றொடர் அல்ல, பெத்தேல் என்னும் இடப்பெயர். בְּ இடத்தைக் குறிப்பதால் தமிழ் ஏழாம் வேற்றுமை உருபுடன் மொழிபெயர்க்கப்பட்டது.
- source_word: בְּרָמוֹת נֶגֶב
  choice: ராமோத்-நெகேபில்
  rationale: இந்த இணைப்பு ஓர் இடப்பெயராக எடுத்துக்கொள்ளப்பட்டது. נֶגֶב என்பது பிரதேசப் பெயரா அல்லது ‘தெற்கு’ என்னும் திசை அடைமொழியா என்ற சாத்தியமான இருபொருளையும் முதன்மை உரை தீர்மானிக்காமல் விடுகிறது; விளக்கமான மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: בְּיַתִּר
  choice: யத்தீரில்
  rationale: எபிரெய இடப்பெயரான יַתִּר என்பதன் ஒலியைத் தமிழில் ‘யத்தீர்’ எனப் பெயர்த்தெழுதி, בְּ என்பதற்கு இடவேற்றுமை உருபு சேர்க்கப்பட்டது.
- source_word: וְ
  choice: -உம்
  rationale: எபிரெய இணைப்புச் சொல்லின் பட்டியல் அமைப்பை இயல்பான தமிழில் ஒவ்வொரு பெறுநர் தொடரோடும் இணையும் ‘-உம்’ விகுதி வெளிப்படுத்துகிறது.
