translation_notes:
  register: நவீன நிலையான தமிழில், கண்ணியமான ஆனால் பொதுவாசகர்களுக்கு எளிதில் புரியும் கதைநடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய வாக்கியத்தின் நீண்ட தொடரை இரண்டு தமிழ் வாக்கியங்களாகப் பிரித்து வாசிப்புத் தெளிவு மேம்படுத்தப்பட்டுள்ளது; நிகழ்வுகளின் காலத் தொடர்பு இறந்தகால நிறைவுநிலையால் வெளிப்படுத்தப்பட்டுள்ளது.
