reference: 1 Samuel 30:1
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יְהִ֞י בְּ/בֹ֨א דָוִ֧ד וַ/אֲנָשָׁ֛י/ו צִֽקְלַ֖ג בַּ/יּ֣וֹם הַ/שְּׁלִישִׁ֑י וַ/עֲמָלֵקִ֣י פָֽשְׁט֗וּ אֶל נֶ֨גֶב֙ וְ/אֶל צִ֣קְלַ֔ג וַ/יַּכּוּ֙ אֶת צִ֣קְלַ֔ג וַ/יִּשְׂרְפ֥וּ אֹתָ֖/הּ בָּ/אֵֽשׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/001.yaml
  text: When David and his men came to Ziklag on the third day[a], the Amalekites had made a raid against the Negev and against Ziklag, and they had struck Ziklag and burned it with fire.
translation:
  language: ta
  text: தாவீதும் அவனுடைய ஆட்களும் மூன்றாம் நாளில் சிக்லாகுக்கு வந்தபோது, அமலேக்கியர்கள் நெகேவின்மீதும்[a] சிக்லாகின்மீதும் கொள்ளைத் தாக்குதல் நடத்தியிருந்தனர். அவர்கள் சிக்லாகைத் தாக்கி, அதைத் தீயால் எரித்திருந்தனர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தெற்குப் பகுதியின்மீதும்.” எபிரெய மொழியில் நெகேவ் என்பது பொதுவாகத் தெற்குப் பகுதியையோ, நெகேவ் என்று அழைக்கப்படும் குறிப்பிட்ட நிலப்பகுதியையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בְּבֹא
  choice: வந்தபோது
  rationale: היה உடன் வரும் בוא வினையெச்சக் கட்டமைப்பு, தாவீதின் வருகையை அடுத்த நிகழ்வுகளுக்கான காலச் சூழலாக அமைக்கிறது. நவீன தமிழில் இயல்பான ‘வந்தபோது’ இதைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: וַאֲנָשָׁיו
  choice: அவனுடைய ஆட்களும்
  rationale: இங்கு אֲנָשִׁים என்பது பொதுவாக மக்களைக் குறிக்காமல், தாவீதுடன் இருந்த போர்க்குழுவினரைக் குறிக்கிறது.
- source_word: צִקְלַג
  choice: சிக்லாக்
  rationale: இடப்பெயர் தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளது; வேற்றுமை உருபு சேரும்போது ‘சிக்லாகுக்கு/சிக்லாகை’ என இயல்பாக வடிவமைக்கப்பட்டுள்ளது.
- source_word: בַּיּוֹם הַשְּׁלִישִׁי
  choice: மூன்றாம் நாளில்
  rationale: எபிரெய காலக் குறிப்பின் நேரடியான, இயல்பான தமிழ் இணை.
- source_word: וַעֲמָלֵקִי
  choice: அமலேக்கியர்கள்
  rationale: சொல் வடிவில் ஒருமையாகத் தோன்றினாலும், தொடரும் பன்மை வினைகள் இதை ஓர் இனக்குழுவைக் குறிக்கும் கூட்டுப்பெயராகக் காட்டுகின்றன.
- source_word: פָשְׁטוּ
  choice: கொள்ளையிடுவதற்காகப் படையெடுத்திருந்தனர்
  rationale: இராணுவச் சூழலில் פשט என்பது கொள்ளைத் தாக்குதல் அல்லது படையெடுப்பைக் குறிக்கிறது. தாவீது வருவதற்கு முன்பே நிகழ்ந்த செயல் என்பதால் தமிழ் இறந்தகால நிறைவுநிலை பயன்படுத்தப்பட்டுள்ளது.
- source_word: אֶל נֶגֶב
  choice: நெகேவின்மீதும்
  rationale: נֶגֶב என்பது ‘தெற்கு’ என்ற பொதுப் பொருளையோ நெகேவ் என்ற குறிப்பிட்ட நிலப்பகுதியையோ குறிக்கலாம். முதன்மை உரையில் இடப்பெயர் வைக்கப்பட்டு, மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
- source_word: וַיַּכּוּ אֶת צִקְלַג
  choice: சிக்லாகைத் தாக்கி
  rationale: נכה என்பதன் பரந்த இராணுவப் பொருளை ‘தாக்கி’ இயல்பாகவும் மிகைப்படுத்தாமலும் தருகிறது.
- source_word: וַיִּשְׂרְפוּ אֹתָהּ בָּאֵשׁ
  choice: அதைத் தீயால் எரித்திருந்தனர்
  rationale: ‘தீயால் எரித்தனர்’ என்ற எபிரெய வலியுறுத்தலைச் சுருக்காமல் பாதுகாக்கிறது; முன்நிகழ்வைக் காட்ட இறந்தகால நிறைவுநிலை பயன்படுத்தப்பட்டுள்ளது.
