revisions:
- from: ஓர்மாவில் இருந்தவர்களுக்கும், போர்-ஆசானில் இருந்தவர்களுக்கும், அத்தாக்கில் இருந்தவர்களுக்கும் அனுப்பினான்.[a]
  to: ஓர்மாவில் உள்ளவர்களுக்கும், போர்-அஷானில் உள்ளவர்களுக்கும்[a], அத்தாக்கில் உள்ளவர்களுக்கும்.
  rationale: The revision preserves the Hebrew’s elliptical list of recipients without importing the preceding verse’s verb. It keeps the locative sense, uses readable modern Tamil, treats the names as names, and places the lexical footnote at its proper anchor.
