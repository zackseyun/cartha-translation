  yaml_path: translation/ot/1_samuel/030/030.yaml
  text: and to those in Hormah[a], and to those in Bor-ashan, and to those in Athach.
translation:
  language: ta
  text: ஓர்மாவில் உள்ளவர்களுக்கும், போர்-அஷானில் உள்ளவர்களுக்கும்[a], அத்தாக்கில் உள்ளவர்களுக்கும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “போர்-அஷான்” என்பது ஓர் இடப்பெயர். அதன் எபிரெயச் சொற்கூறுகள் நேரடியாகப் பொருள்கொண்டால் “புகையின் கிணறு/குழி” என்று பொருள்படலாம்; இங்கு அந்தப் பெயர் மொழிபெயர்க்கப்படாமல் ஒலிபெயர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלַאֲשֶׁר
  choice: இருந்தவர்களுக்கும்
  rationale: இணைப்புச்சொல், ל முன்னொட்டு, தொடர்புப்பெயர் ஆகியவை சேர்ந்த இக்கட்டமைப்பு, தாவீது பரிசுகளை அனுப்பிய இடங்களில் இருந்த பெறுநர்களைக் குறிக்கிறது. தமிழில் இயல்பாகவும், முந்தைய வாக்கியத்துடன் தொடரும் பட்டியலாகவும் ‘இருந்தவர்களுக்கும்’ என வழங்கப்பட்டது.
- source_word: בְּחָרְמָה
  choice: ஓர்மாவில்
  rationale: בְּ இடத்தைக் குறிக்கிறது; חָרְמָה என்பது ஊர்ப்பெயர் என்பதால் பொருள் மொழிபெயர்ப்பு செய்யாமல் தமிழ் ஒலிபெயர்ப்பாக வழங்கப்பட்டது.
- source_word: בְּבוֹר עָשָׁן
  choice: போர்-ஆசானில்
  rationale: இது இரு கூறுகளைக் கொண்ட ஊர்ப்பெயர். கூறுகளின் சொற்பொருளை மொழிபெயர்க்காமல், ஒரே இடப்பெயர் என்பதைத் தெளிவாக்க இணைப்புக்கோட்டுடன் ஒலிபெயர்க்கப்பட்டது.
- source_word: בַּעֲתָךְ
  choice: அத்தாக்கில்
  rationale: בְּ இடத்தைக் குறிக்கிறது; עֲתָךְ ஊர்ப்பெயராக ஒலிபெயர்க்கப்பட்டது.
theological_decisions: []
translation_notes:
  register: நவீன பொதுத்தமிழில், இடப்பெயர்களைப் பாதுகாக்கும் முறையான நடையுடன் மொழிபெயர்க்கப்பட்டது. இவ்வசனம் முந்தைய வசனங்களில் தொடங்கிய பெறுநர் பட்டியலின் தொடர்ச்சி என்பதால், தமிழில் முழுமையான வாக்கியமாக வாசிக்க ‘அனுப்பினான்’ சேர்க்கப்பட்டுள்ளது; இது உட்கிடையாக உள்ள செயலை வெளிப்படுத்துகிறது. அடிக்குறிப்பு குறி தொடர்புடைய ‘போர்-ஆசான்’ பெயருக்கு உடனே இடப்படுவதற்குப் பதிலாக வசன முடிவில் வைக்கப்பட்டுள்ளது.
