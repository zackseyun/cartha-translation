language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַֽ/יִּמְצְא֤וּ אִישׁ מִצְרִי֙ בַּ/שָּׂדֶ֔ה וַ/יִּקְח֥וּ אֹת֖/וֹ אֶל דָּוִ֑ד וַ/יִּתְּנוּ ל֥/וֹ לֶ֨חֶם֙ וַ/יֹּ֔אכַל וַ/יַּשְׁקֻ֖/הוּ מָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/011.yaml
  text: They found an Egyptian man in the field and brought him to David[a]. They gave him bread, and he ate[c][b], and they gave him water to drink.
translation:
  language: ta
  text: அவர்கள் வயல்வெளியில் ஓர் எகிப்தியனைக் கண்டு, அவனைத் தாவீதிடம் கொண்டுவந்தார்கள். அவனுக்கு அப்பம் கொடுத்தார்கள்; அவன் சாப்பிட்டான். அவனுக்குத் தண்ணீரும் குடிக்கக் கொடுத்தார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּמְצְאוּ
  choice: அவர்கள் கண்டு
  rationale: வழக்கமான எபிரெயக் கதைத் தொடரான wayyiqtol வடிவத்தை இயல்பான தமிழ் இறந்தகால நடையில் தருகிறது.
- source_word: אִישׁ מִצְרִי
  choice: ஓர் எகிப்தியன்
  rationale: אִישׁ மற்றும் மִצְרִי இணைந்து இங்கு எகிப்தைச் சேர்ந்த ஆண் ஒருவரைக் குறிக்கின்றன; தமிழில் ‘ஓர் எகிப்தியன்’ என்பது இயல்பாகவும் போதுமான தெளிவுடனும் உள்ளது.
- source_word: בַּשָּׂדֶה
  choice: வயல்வெளியில்
  rationale: שָׂדֶה என்பதன் ‘வெளி/வயல்வெளி’ என்ற இடப்பொருளை, பயிரிடப்பட்ட குறிப்பிட்ட வயல் என்று தேவையின்றி கட்டுப்படுத்தாமல் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וַיִּקְחוּ אֹתוֹ אֶל דָּוִד
  choice: அவனைத் தாவீதிடம் கொண்டுவந்தார்கள்
  rationale: לקח இச்சூழலில் ஒருவரை இலக்கிடத்திற்குக் கொண்டுசெல்லுதல் அல்லது கொண்டுவருதல் என அமையலாம்; தாவீதை நோக்கிய இயக்கத்தைத் தமிழில் இயல்பாகக் காட்ட ‘கொண்டுவந்தார்கள்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: וַיִּתְּנוּ לוֹ לֶחֶם
  choice: அவனுக்கு அப்பம் கொடுத்தார்கள்
  rationale: לֶחֶם என்பதன் நேரடியான ‘அப்பம்’ என்ற பொருளைப் பாதுகாக்கிறது; பொதுவான ‘உணவு’ என விரிவாக்க வேண்டிய சூழல் இல்லை.
- source_word: וַיֹּאכַל
  choice: அவன் சாப்பிட்டான்
  rationale: மூலத்தில் வெளிப்படையான செயப்படுபொருள் இல்லை; தமிழிலும் அதைச் சேர்க்காமல் இயல்பாகத் தருகிறது.
- source_word: וַיַּשְׁקֻהוּ מָיִם
  choice: அவனுக்குத் தண்ணீரும் குடிக்கக் கொடுத்தார்கள்
  rationale: שׁקה என்பதன் Hiphil வடிவிலுள்ள ‘குடிக்கச் செய்தல்/குடிக்கக் கொடுத்தல்’ என்ற காரணவினைப் பொருளை வற்புறுத்தலாக ஒலிக்காமல் இயல்பாகப் பாதுகாக்கிறது.
