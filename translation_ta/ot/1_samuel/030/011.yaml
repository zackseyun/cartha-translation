translation_notes:
  register: நவீன பொதுத்தமிழில், கண்ணியமான எளிய கதைநடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய வாக்கியத்தின் தொடர்ச்சியான நிகழ்வுகள் தமிழில் வாசிக்க எளிதாக இரண்டு வாக்கியங்களாக அமைக்கப்பட்டுள்ளன; இரண்டாவது செயலில் இயல்பான இணைப்புக்காக ‘-உம்’ சேர்க்கப்பட்டுள்ளது.
