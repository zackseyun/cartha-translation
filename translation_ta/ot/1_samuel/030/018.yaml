  yaml_path: translation/ot/1_samuel/030/018.yaml
  text: David recovered all that Amalek had taken[a], and David rescued his two wives.
translation:
  language: ta
  text: அமாலேக்கியர் எடுத்துச் சென்ற அனைத்தையும் தாவீது மீட்டான்[a]; தன் இரண்டு மனைவிகளையும் தாவீது மீட்டான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘விடுவித்தான்’ என்றும் மொழிபெயர்க்கலாம். எபிரெயத்தில் இரு வாக்கியப் பகுதிகளிலும் ஒரே வினைச்சொல் பயன்படுத்தப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּצֵּל / הִצִּיל (נצל)
  choice: மீட்டான் / மீட்டான்
  rationale: எபிரெய மூலத்தில் இரு இடங்களிலும் ஒரே வேர்ச்சொல் வருகிறது. பொருட்களையோ சிறைபிடிக்கப்பட்ட மனிதர்களையோ பகைவரிடமிருந்து திரும்பப் பெறுவதைக் குறிக்கத் தமிழில் ‘மீட்டான்’ இரு சூழல்களுக்கும் இயல்பாகப் பொருந்துவதால், மூலத்தின் சொல் மறுபயன்பாடும் காக்கப்படுகிறது.
- source_word: כָּל אֲשֶׁר לָקְחוּ עֲמָלֵק
  choice: அமாலேக்கியர் எடுத்துச் சென்ற அனைத்தையும்
  rationale: כָּל אֲשֶׁר என்பது ‘அனைத்தையும்’ என இயல்பாக மொழிபெயர்க்கப்படுகிறது. சூழலில் கொள்ளையிட்டவற்றை அவர்கள் தங்கள் இடத்துக்கு எடுத்துச் சென்றிருப்பதால் ‘எடுத்துச் சென்ற’ என்பது தமிழ் கதைநடையில் தெளிவாக உள்ளது.
- source_word: עֲמָלֵק
  choice: அமாலேக்கியர்
  rationale: எபிரெயத்தில் ‘அமாலேக்கு’ என்ற ஒருமை இனப்பெயர் கூட்டுப் பொருளில் வருகிறது. நவீனத் தமிழில் அந்த மக்களைக் குறிக்கும் ‘அமாலேக்கியர்’ தெளிவும் இயல்பும் உடையது.
- source_word: שְׁתֵּי נָשָׁיו
  choice: தன் இரண்டு மனைவிகளையும்
  rationale: மூலத்திலுள்ள ‘அவனுடைய இரண்டு மனைவிகள்’ என்ற எண்ணிக்கையையும் உறவையும் நேரடியாகக் காக்கிறது. வாக்கியத்தின் எழுவாய் தாவீது என்பதால் ‘தன்’ என்பது தமிழில் இயல்பானது.
- source_word: דָּוִד ... דָּוִד
  choice: தாவீது ... தாவீது
  rationale: மூலத்தில் தாவீதின் பெயர் இருமுறை வருவதால், இரண்டாவது இடத்தில் பதிலிப்பெயரைப் பயன்படுத்தாமல் பெயரையே மீண்டும் கூறி அதன் அழுத்தத்தையும் அமைப்பையும் காக்கிறது.
