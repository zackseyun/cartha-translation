  rationale: காட்சி திடீரென வாசகரின் கவனத்துக்கு வருவதை உணர்த்தும் எபிரெய உரையாடல் குறியீட்டின் உயிரோட்டத்தைப் பேணுகிறது.
- source_word: נְטֻשִׁים עַל־פְּנֵי כָל־הָאָרֶץ
  choice: அந்த நிலப்பரப்பு முழுவதும் பரவிக் கிடந்தார்கள்
  rationale: செயப்பாட்டு வினையெச்சம் அவர்கள் விரிந்த பரப்பில் சிதறிப் பரவியிருந்த நிலையைச் சுட்டுகிறது. சூழல் உள்ளூர் நிலப்பகுதியைக் குறிப்பதால் ‘பூமி முழுவதும்’ என்று மொழிபெயர்க்கப்படவில்லை.
- source_word: אֹכְלִים וְשֹׁתִים וְחֹגְגִים
  choice: சாப்பிட்டுக் குடித்துக் கொண்டாடிக்கொண்டிருந்தார்கள்
  rationale: மூன்று தொடரும் செயல்களையும் அவற்றின் நிகழ்நிலைத் தன்மையையும் இயல்பான நவீன தமிழில் காக்கிறது.
- source_word: בְּכֹל הַשָּׁלָל הַגָּדוֹל
  choice: பெரும் கொள்ளைப் பொருட்கள் அனைத்தையும் வைத்துக்
  rationale: בְּ என்னும் முன்னிடைச்சொல் கொண்டாட்டத்தின் காரணம், சந்தர்ப்பம் அல்லது அடிப்படையைக் குறிக்கக்கூடிய நெகிழ்வைத் திறந்துவைக்கிறது. ‘கொள்ளைப் பொருட்கள்’ என்பது போர்ச் சூழலிலுள்ள שׁלל என்பதற்குத் தெளிவான தமிழ்.
- source_word: אֲשֶׁר לָקְחוּ
  choice: தாங்கள் கைப்பற்றியிருந்த
