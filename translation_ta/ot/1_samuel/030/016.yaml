- source_word: וַיֹּרִדֵהוּ
  choice: அவன் அவரைக் கீழே அழைத்துச் சென்றபோது
  rationale: ஹிஃபில் வடிவிலுள்ள ירד, ‘கீழே செல்லச் செய்தல்/கீழே அழைத்துச் செல்லுதல்’ என்பதைக் குறிக்கிறது. வழிகாட்டி தாவீதை அந்த இடத்துக்கு அழைத்துச் செல்லும் சூழலை இயல்பான தமிழில் காட்டுவதோடு திசைப் பொருளையும் காக்கிறது.
- source_word: וְהִנֵּה
