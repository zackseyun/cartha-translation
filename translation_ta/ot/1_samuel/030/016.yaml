  yaml_path: translation/ot/1_samuel/030/016.yaml
  text: When he had led him down[a], behold, they were spread out over the face of all the land[b], eating and drinking and celebrating over all the great spoil that they had taken from the land of the Philistines and from the land of Judah.
translation:
  language: ta
  text: அவன் அவரைக் கீழே அழைத்துச் சென்றபோது, இதோ, அவர்கள் அந்த நிலப்பரப்பு முழுவதும் பரவிக் கிடந்தார்கள்[a]. அவர்கள் சாப்பிட்டுக் குடித்துக்கொண்டும், பெலிஸ்தியரின் நாட்டிலிருந்தும் யூதா நாட்டிலிருந்தும் தாங்கள் கைப்பற்றியிருந்த பெரும் கொள்ளைப் பொருட்கள் அனைத்தைக் குறித்து கொண்டாடிக்கொண்டும் இருந்தார்கள்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அந்த நிலப்பரப்பு முழுவதும் சிதறிக் கிடந்தார்கள்.” எபிரெய வினையெச்சம் சிதறியிருந்ததையோ பரந்த இடத்தில் விரவியிருந்ததையோ வலியுறுத்தலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “பெரும் கொள்ளைப் பொருட்கள் அனைத்தினிமித்தமும் கொண்டாடிக்கொண்டிருந்தார்கள்.” இங்குள்ள எபிரெய முன்னிடைச்சொல், அவர்களுடைய கொண்டாட்டத்திற்கான காரணத்தையோ சந்தர்ப்பத்தையோ அடிப்படையையோ குறிக்கலாம்.
    reason: lexical_alternative
