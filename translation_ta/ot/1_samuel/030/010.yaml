translation_notes:
  register: நவீனத் தரத்தமிழில், எளிதில் புரியும் அதேவேளையில் கண்ணியமான வரலாற்றுக் கதைநடை பயன்படுத்தப்பட்டுள்ளது. வினைமுற்றுகள் பன்மை எழுவாய்க்கு ஏற்ப அமைக்கப்பட்டுள்ளன; மூலத்தின் தொடர்துரத்தல், சோர்வு, கடக்க இயலாமை ஆகிய தொடர்புகள் பாதுகாக்கப்பட்டுள்ளன.
