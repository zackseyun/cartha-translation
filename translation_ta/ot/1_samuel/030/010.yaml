  yaml_path: translation/ot/1_samuel/030/010.yaml
  text: So David pursued[a], he and four hundred men, while two hundred men stayed behind[b], who were too exhausted to cross the Brook Besor.
translation:
  language: ta
  text: தாவீதும் அவருடன் நானூறு பேரும் துரத்திச் சென்றார்கள்; பெசோர் ஓடையைக்[b] கடக்க முடியாத அளவுக்குச் சோர்ந்துபோன[a] இருநூறு பேர் பின்னால் தங்கினார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இந்த எபிரேயச் சொல்லை, “தளர்ந்துபோன” அல்லது “சோர்வினால் பின்தங்கிய” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: எபிரேயில், “பெசோர் ஓடை”; இங்குள்ள சொல் ஓடை, பருவகால நீரோடை அல்லது ஓடைப்படுகையைக் குறிக்கலாம்.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּרְדֹּף
  choice: தொடர்ந்து துரத்திச் சென்றார்கள்
  rationale: רדף என்பதன் பின்தொடர்ந்து விரட்டுதல் என்ற இராணுவச் சூழல் பொருளை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: הוּא וְאַרְבַּע מֵאוֹת אִישׁ
  choice: தாவீதும் அவனுடன் நானூறு பேரும்
  rationale: தாவீதையும் அவருடன் சென்ற நானூறு பேரையும் தனித்துக் குறிப்பிடும் எபிரேய அமைப்பைப் பாதுகாக்கிறது.
- source_word: וַיַּעַמְדוּ
  choice: அங்கேயே நின்றுவிட்டார்கள்
  rationale: עמד என்பதன் அடிப்படைப் பொருளான ‘நிற்றல்’ என்பதையும், அவர்கள் தொடர்ந்து செல்லாமல் பின்னால் தங்கிய சூழலையும் ஒருங்கே வெளிப்படுத்துகிறது.
- source_word: אֲשֶׁר פִּגְּרוּ מֵעֲבֹר
  choice: கடக்க முடியாத அளவுக்குச் சோர்ந்துபோன
  rationale: פגרו என்பதிலுள்ள சோர்வு அல்லது தொடர்ந்து செல்ல இயலாமையையும், מֵעֲבֹר காட்டும் கடக்க முடியாத விளைவையும் இயல்பாக இணைக்கிறது.
- source_word: נַחַל הַבְּשׂוֹר
  choice: பெசோர் ஓடை
  rationale: נחל என்பது ஓடை, பருவகால நீரோடை அல்லது வறண்ட ஓடைப்படுகையைக் குறிக்கலாம்; ‘ஓடை’ வாசிக்க இயல்பானதும் பொருளளவில் போதுமான அகலமுடையதும் ஆகும்.
