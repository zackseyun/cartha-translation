translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் dignified நடையில் மொழிபெயர்க்கப்பட்டது. போர்ச் சூழலைத் தெளிவாக வைத்தபோதும், “goes down” என்ற எபிரெய வழக்கை தமிழில் இயல்பான “போருக்குச் செல்கிறவன்” என வழங்கியது. சமமான பங்கு என்ற கருத்தை ஒப்புமை அமைப்பு வெளிப்படுத்துகிறது; மூலத்தில் இல்லாத விளக்கத்தை முதன்மை உரையில் சேர்க்கவில்லை.
