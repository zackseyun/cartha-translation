base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/024.yaml
  text: And who will listen to you in this matter? For as is the share of the one who goes down into the battle[a], so is the share of the one who stays by the supplies[b]; together they shall divide.
translation:
  language: ta
  text: இந்தக் காரியத்தில் உங்களுக்குச் செவிகொடுப்பவர் யார்?[a] போருக்குச் செல்கிறவனின் பங்கு எப்படியோ, பொருட்களோடு தங்குகிறவனின்[b] பங்கும் அப்படியே; அவர்கள் ஒன்றாகப் பங்கிட்டுக்கொள்வார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “செவிகொடுப்பவர்” என்பதற்கு “உங்கள் பேச்சைக் கேட்பவர்,” “உங்கள் சொல்லுக்கு இணங்குபவர்,” அல்லது “உங்களுக்குக் கீழ்ப்படிபவர்” என்றும் மொழிபெயர்க்கலாம். எபிரெய வினைச்சொல் சூழலுக்கேற்ப கேட்டல், செவிகொடுத்தல், அல்லது கீழ்ப்படிதல் ஆகிய பொருள்களைத் தரலாம்.
    reason: lexical_alternative
  - marker: b
    text: “பொருட்கள்” என்பதற்கு “சுமைகள்,” “தளவாடங்கள்,” “உபகரணங்கள்,” அல்லது “விநியோகப் பொருட்கள்” என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் உடைமைகள், கருவிகள், படைக்கலன்கள், அல்லது சுமைகள் உள்ளிட்ட பலவகையான பொருள்களைக் குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִי יִשְׁמַע לָכֶם
  choice: நீங்கள் சொல்வதற்கு யார் செவிகொடுப்பார்?
  rationale: שׁמע with ל expresses listening to or heeding someone. “செவிகொடுப்பார்” naturally conveys the rhetorical sense that no one will accept or heed their proposal; the initial conjunction is not separately represented because the Tamil rhetorical transition is natural without it.
- source_word: לַדָּבָר הַזֶּה
  choice: இந்தக் காரியத்தில்
  rationale: דבר here denotes the matter or proposal under dispute rather than merely a spoken word. “இந்தக் காரியத்தில்” preserves that contextual breadth.
- source_word: כְּחֵלֶק
  choice: பங்கு எப்படியோ ... பங்கும் அப்படியே
  rationale: חֵלֶק is a share or allotted portion, here of recovered spoil. The correlative Tamil construction clearly preserves the Hebrew comparison and its equalizing force.
- source_word: הַיֹּרֵד בַּמִּלְחָמָה
  choice: போருக்குச் செல்கிறவன்
  rationale: The Hebrew literally depicts one who “goes down” into battle. In current Tamil, “போருக்குச் செல்கிறவன்” communicates participation in combat naturally without turning the idiom into an awkwardly literal geographical statement.
- source_word: הַיֹּשֵׁב עַל הַכֵּלִים
  choice: பொருட்களருகே தங்குகிறவன்
  rationale: יֹשֵׁב means sitting or remaining, while כֵּלִים can denote articles, equipment, gear, or baggage. The chosen wording preserves the broad term and indicates remaining beside the goods without adding an explicit guarding action.
- source_word: יַחְדָּו יַחֲלֹקוּ
  choice: அவர்கள் அனைவரும் ஒன்றாகப் பங்கிட்டுக்கொள்வார்கள்
  rationale: יַחְדָּו stresses joint participation, and חלק denotes dividing or sharing. “அனைவரும் ஒன்றாகப் பங்கிட்டுக்கொள்வார்கள்” is clear, natural Tamil and retains the collective distribution of the recovered goods.
