revisions:
- from: இந்தக் காரியத்தில் நீங்கள் சொல்வதற்கு யார் செவிகொடுப்பார்?[a] போருக்குச் செல்கிறவனுடைய பங்கு எப்படியோ, பொருட்களருகே தங்குகிறவனுடைய பங்கும் அப்படியே; அவர்கள் அனைவரும் ஒன்றாகப் பங்கிட்டுக்கொள்வார்கள்.[b]
  to: இந்தக் காரியத்தில் உங்களுக்குச் செவிகொடுப்பவர் யார்?[a] போருக்குச் செல்கிறவனின் பங்கு எப்படியோ, பொருட்களோடு தங்குகிறவனின்[b] பங்கும் அப்படியே; அவர்கள் ஒன்றாகப் பங்கிட்டுக்கொள்வார்கள்.
  rationale: The revision retains the source’s rhetorical and comparative structure while making the dative sense of “listen to/heed you” explicit in natural Tamil. It renders the one remaining with the equipment more precisely, removes an unexpressed “all,” and moves footnote b to the specific term it explains.
