  text: וַ/יֹּ֤אמֶר אֵלָי/ו֙ דָּוִ֔ד הֲ/תוֹרִדֵ֖/נִי אֶל הַ/גְּד֣וּד הַ/זֶּ֑ה וַ/יֹּ֡אמֶר הִשָּׁבְעָ/ה֩ לִּ֨/י בֵֽ/אלֹהִ֜ים אִם תְּמִיתֵ֗/נִי וְ/אִם תַּסְגִּרֵ֨/נִי֙ בְּ/יַד אֲדֹנִ֔/י וְ/אוֹרִֽדְ/ךָ֖ אֶל הַ/גְּד֥וּד הַ/זֶּֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/015.yaml
  text: David said to him[a], “Will you lead me down to this raiding party?” He said, “Swear to me by God that you will not kill me or hand me over into the hand of my master, and I will lead you down to this raiding party.”
translation:
  language: ta
  text: தாவீது அவனிடம், “இந்தச் சூறையாடும் படைக்குழுவிடம் என்னைக் கீழே அழைத்துச் செல்வாயா?” என்று கேட்டான். அதற்கு அவன், “நீர் என்னைக் கொல்லவோ என் எஜமானனிடம் ஒப்படைக்கவோ மாட்டீர் என்று கடவுளின் பெயரில் எனக்குச் சத்தியம் செய்யுங்கள். அப்போது இந்தச் சூறையாடும் படைக்குழுவிடம் உம்மைக் கீழே அழைத்துச் செல்வேன்” என்றான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֲתוֹרִדֵנִי / וְאוֹרִדְךָ
  choice: இருக்கும் இடத்துக்கு ... அழைத்துச் செல்
  rationale: ירד என்பதன் Hiphil வடிவம் ஒருவரை கீழ்நோக்கிக் கொண்டுசெல்வதைக் குறிக்கிறது. தமிழில் ‘கீழே அழைத்துச் செல்’ என்பது இச்சூழலில் இயல்பற்றதாகவும் தெளிவற்றதாகவும் இருக்கக்கூடும்; இலக்கிடம் நோக்கி வழிகாட்டும் சூழல்பொருளை ‘இருக்கும் இடத்துக்கு அழைத்துச் செல்’ இயல்பாகத் தெரிவிக்கிறது.
- source_word: הַגְּדוּד הַזֶּה
  choice: இந்தக் கொள்ளைக்கூட்டம்
  rationale: גְּדוּד இங்கு சீக்லாகைக் கொள்ளையிட்ட இடம்பெயரும் ஆயுதக் குழுவைக் குறிக்கிறது. ‘கொள்ளைக்கூட்டம்’ அதன் சூறையாடும் தன்மையைத் தெளிவாகக் காட்டுகிறது.
- source_word: הִשָּׁבְעָה לִּי בֵאלֹהִים
  choice: கடவுள்மேல் எனக்குச் சத்தியம் செய்து கொடும்
  rationale: இறைவனைச் சாட்சியாகக் கொண்டு உறுதிமொழி அளிக்குமாறு கேட்கும் எபிரெய ஆணை வடிவை இயல்பான, நேரடியான தமிழில் வெளிப்படுத்துகிறது.
- source_word: אִם תְּמִיתֵנִי וְאִם תַּסְגִּרֵנִי
  choice: என்னைக் கொல்லாமலும் ... ஒப்படைக்காமலும் இருப்பீர் என்று
  rationale: சத்தியச் சூத்திரத்தில் אִם எதிர்மறை நிபந்தனையை மறைமுகமாகக் கொண்டுள்ளது. தமிழில் கோரிக்கையின் பொருள் தெளிவாக இருக்க எதிர்மறை வடிவம் வெளிப்படையாக மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: תַּסְגִּרֵנִי בְּיַד אֲדֹנִי
  choice: என் எஜமானனிடம் ஒப்படைக்காமலும்
  rationale: ‘கையில்’ என்ற எபிரெய மரபுத்தொடர் அதிகாரத்துக்குள் ஒப்படைப்பதைக் குறிக்கிறது. தமிழில் ‘எஜமானனிடம் ஒப்படை’ அதே பொருளை இயல்பாகத் தருகிறது.
- source_word: אֲדֹנִי
  choice: என் எஜமானன்
  rationale: இது கடவுளையோ அரச பட்டத்தையோ அல்ல, அந்த எகிப்திய வேலைக்காரனின் மனித உரிமையாளரைக் குறிக்கிறது.
theological_decisions:
- issue: சத்தியச் சூத்திரத்தில் אִם என்பதன் மறைமுக எதிர்மறைப் பொருள்
  choice: ‘கொல்லாமலும் ... ஒப்படைக்காமலும் இருப்பீர்’ என்று வெளிப்படையாக மொழிபெயர்த்தல்
  alternative: ‘என்னைக் கொன்றால் அல்லது ... ஒப்படைத்தால்’ என்ற சொற்சார்ந்த நிபந்தனை வடிவம்
  rationale: இது தன்னைக் கொல்லவோ எஜமானனிடம் திருப்பி ஒப்படைக்கவோ கூடாது என்று தாவீதிடம் பாதுகாப்பு உறுதி கேட்கும் சத்தியச் சூத்திரம். எதிர்மறையை வெளிப்படுத்துவது பொருளைத் தெளிவாக்குகிறது; எந்தத் தனிப்பட்ட இறையியல் விளக்கத்தையும் சேர்ப்பதில்லை.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் மரியாதையுடனும் அமைக்கப்பட்டுள்ளது. தாவீது வேலைக்காரனை ‘நீ’ என்னும் ஒருமையில் அணுகும் நடை கேள்வியின் வினைமுற்றில் பிரதிபலிக்கிறது; வேலைக்காரன் தாவீதை ‘நீர்/உம்மை’ என்று மரியாதையுடன் அணுகுகிறான். நிலவியல் திசையைத் தமிழில் இயல்பற்ற முறையில் வற்புறுத்தாமல், வழிகாட்டி இலக்கிடத்துக்குக் கொண்டுசெல்லும் கருத்து முன்னிறுத்தப்பட்டுள்ளது.
