translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் வடிவமைக்கப்பட்டது. கதைநடைக்கு ஏற்ற ‘வந்தான்’, ‘வெளியே வந்தார்கள்’, ‘விசாரித்தான்’ போன்ற எளிய வினைமுற்றுகள் பயன்படுத்தப்பட்டன. ‘மக்கள்’ என்பது עָם என்பதன் அகலத்தைப் பேணுகிறது; பின்னர் வரும் ‘அந்த ஆட்கள்’ சூழலில் இருநூறு பேரைத் தெளிவாகச் சுட்டுகிறது. செய்பவர் வெளிப்படாத וַיֹּשִׁיבֻם என்பதன் மெல்லிய தெளிவின்மை தமிழிலும் காக்கப்பட்டுள்ளது.
