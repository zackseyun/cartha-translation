base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/021.yaml
  text: David came to the two hundred men who had become too exhausted to follow after David[a], and whom they had left at the Brook Besor. They came out to meet David and to meet the people who were with him[b], and David approached the people and asked them how they were.
translation:
  language: ta
  text: தாவீதைப் பின்தொடர்ந்து செல்ல முடியாத அளவுக்குக் களைத்துப்போயிருந்த இருநூறு பேரிடம் தாவீது வந்தான்[a]. அவர்களைப் பெசோர் ஓடைக்கரையில்[b] தங்கவிட்டிருந்தான். அவர்கள் தாவீதையும் அவனுடன் இருந்த மக்களையும் சந்திக்க வெளியே வந்தார்கள். தாவீது அந்த ஆட்களிடம் நெருங்கிச் சென்று, அவர்கள் நலமாக இருக்கிறார்களா என்று விசாரித்தான்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “தாவீதைப் பின்தொடர முடியாமல் பின்தங்கியிருந்த” என்றும் மொழிபெயர்க்கலாம்.
    reason: פִּגְּרוּ என்பது களைத்துப்போதல், தொடர்ந்து செல்ல இயலாமை அல்லது பின்தங்குதல் ஆகிய தொடர்புடைய கருத்துகளை வெளிப்படுத்தக்கூடும்.
  - marker: b
    text: எபிரெயச் சொல் பருவகால நீரோடை, ஓடைப் படுகை அல்லது பள்ளத்தாக்கையும் குறிக்கலாம்.
    reason: נחל என்பதன் புவியியல் பொருள் சூழலுக்கு ஏற்ப மாறுபடக்கூடியது.
  - marker: c
    text: சொல்லர்த்தமாக, “அவர்களுடைய சமாதானம் (நலம்) குறித்து விசாரித்தான்.”
    reason: שׁאל לְשָׁלוֹם என்ற எபிரெய மரபுத்தொடரின் உருவகத்தைச் சுட்டிக்காட்டுகிறது.
lexical_decisions:
- source_word: פִּגְּרוּ מִלֶּכֶת אַחֲרֵי דָוִד
  choice: தாவீதைப் பின்தொடர்ந்து செல்ல முடியாத அளவுக்குக் களைத்துப்போயிருந்த
  rationale: פּגר என்பது களைப்பால் தொடர்ந்து செல்ல இயலாத நிலையை இச்சூழலில் குறிக்கிறது. מן உடன் வரும் வினையெச்சத் தொடர், தாவீதுக்குப் பின்னால் தொடர்ந்து செல்வதிலிருந்து அவர்கள் நின்றுபோனதை விளக்குகிறது. தமிழில் காரணத்தையும் விளைவையும் இயல்பாகத் தெரிவிக்க இவ்வாறு மொழிபெயர்க்கப்பட்டது.
- source_word: וַיֹּשִׁיבֻם
  choice: அவர்களை … தங்கவிட்டிருந்தனர்
  rationale: ישׁב என்பதன் ஹிஃபீல் வடிவம் ஒருவரை ஓரிடத்தில் இருக்கச் செய்தல் அல்லது அங்கே தங்கவிடுதல் எனப் பொருள்படும். எபிரெய வினை பன்மையில் இருந்தாலும் செய்பவர்கள் வெளிப்படையாகப் பெயரிடப்படவில்லை; எனவே அந்தத் தெளிவின்மையைத் தமிழிலும் காக்கும் வகையில் பெயரிடாத பன்மை வினை பயன்படுத்தப்பட்டது.
- source_word: בְּנַחַל הַבְּשׂוֹר
  choice: பெசோர் ஓடையருகே
  rationale: נחל என்பது பருவகால நீரோடை, ஓடைப் படுகை அல்லது பள்ளத்தாக்கைக் குறிக்கலாம். இந்நிகழ்விடப் பெயரை வாசிக்க எளிதாகவும் புவியியல் பொருளை அளவுக்கு மீறி வரையறுக்காமலும் ‘பெசோர் ஓடை’ என வழங்கப்பட்டது.
- source_word: לִקְרַאת
  choice: சந்திக்க
  rationale: இச்சொல் ஒருவரை எதிர்கொண்டு வரவேற்கச் செல்வதைக் குறிக்கிறது. சூழலுக்கு நடுநிலையான இயல்பான தமிழாக ‘சந்திக்க’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: הָעָם אֲשֶׁר אִתּוֹ
  choice: அவனுடன் இருந்த மக்கள்
  rationale: עָם என்பதை ‘படைவீரர்கள்’ என்று குறுக்காமல், தாவீதுடன் வந்த குழுவைக் குறிக்கும் பொதுவான ‘மக்கள்’ என்ற சொல்லால் மொழிபெயர்த்தது.
- source_word: וַיִּגַּשׁ דָּוִד אֶת הָעָם
  choice: தாவீது அந்த ஆட்களிடம் நெருங்கிச் சென்று
  rationale: נגשׁ என்பதன் அடிப்படைப் பொருள் நெருங்குதல். அடுத்த வாக்கியப் பகுதியிலுள்ள நலம் விசாரித்தலை இதனுடன் கலக்காமல் தனி செயலாகக் காக்கப்பட்டது. முன்னர் குறிப்பிடப்பட்ட இருநூறு பேரையே இங்கு குறிக்கும் சூழலால் ‘அந்த ஆட்கள்’ பயன்படுத்தப்பட்டது.
- source_word: וַיִּשְׁאַל לָהֶם לְשָׁלוֹם
  choice: அவர்கள் நலமாக இருக்கிறார்களா என்று விசாரித்தான்
  rationale: ‘சமாதானம்/நலன் குறித்து கேட்பது’ என்ற எபிரெய மரபுத்தொடர் ஒருவருடைய நலத்தை விசாரிப்பதைக் குறிக்கிறது. அதன் உறவுசார் பொருளை இயல்பான நவீன தமிழில் இவ்வாறு வழங்கப்பட்டது.
