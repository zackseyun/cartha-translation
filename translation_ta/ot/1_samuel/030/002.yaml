base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/002.yaml
  text: They took captive the women who were in it[a], from small to great. They did not kill anyone, but led them away and went on their way.
translation:
  language: ta
  text: அதில் இருந்த பெண்களைச் சிறியோர் முதல் பெரியோர் வரை[a] சிறைப்பிடித்தார்கள். அவர்கள் யாரையும் கொல்லாமல், அவர்களை வழிநடத்திக்கொண்டு தங்கள் வழியில் சென்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘இளையோர் முதல் முதியோர் வரை.’ ‘சிறியோர் முதல் பெரியோர் வரை’ என்ற எபிரெய மரபுத்தொடர், எவரும் விடுபடாமல் முழு வரம்பையும் குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁבּוּ
  choice: சிறைப்பிடித்தார்கள்
  rationale: שׁבה என்பது போரில் மனிதர்களைச் சிறைபிடிப்பதைக் குறிக்கிறது; ‘சிறைப்பிடித்தார்கள்’ என்பது அந்த இராணுவச் சூழலையும் செயற்பாட்டையும் இயல்பாகத் தெரிவிக்கிறது.
- source_word: הַנָּשִׁים
  choice: பெண்களை
  rationale: எபிரெயச் சொல் பொதுவாக ‘பெண்கள்’ என்று பொருள்படும். சூழலில் மனைவியரும் அடங்கினாலும், ‘மனைவிகள்’ என்று குறுக்குவது மூலச்சொல்லைவிடச் சுருக்கமான பொருளாகிவிடும்.
- source_word: אֲשֶׁר בָּהּ
  choice: அதில் இருந்த
  rationale: பெண்பால் ஒருமைச் சுட்டுப்பெயர் முந்தைய வசனத்திலுள்ள சிக்லாக் நகரத்தைக் குறிக்கிறது; நகரத்தின் பெயரை மீண்டும் சேர்க்காமல் அதன் தொடர்பை இயல்பாகப் பேணுகிறது.
- source_word: מִקָּטֹן וְעַד גָּדוֹל
  choice: சிறியோர் முதல் பெரியோர் வரை
  rationale: இது ஒருவரும் விடுபடாத முழு வரம்பைக் குறிக்கும் எபிரெய மரபுத்தொடர். வயதை மட்டும் தீர்மானிக்காமல், மூலத்தின் ‘சிறியவர்—பெரியவர்’ என்ற திறந்த பொருளைத் தக்கவைக்கிறது.
- source_word: לֹא הֵמִיתוּ אִישׁ
  choice: யாரையும் கொல்லாமல்
  rationale: இங்கு אִישׁ என்பது ஆண் ஒருவரை மட்டும் அல்லாமல் ‘எவரையும்’ குறிக்கும் வரையறையற்ற பயன்பாடு; தமிழில் ‘யாரையும்’ அதனைத் தெளிவாகக் கொடுக்கிறது.
- source_word: וַיִּנְהֲגוּ
  choice: அவர்களைக் கொண்டுசென்று
  rationale: נהג என்பது வழிநடத்துதல் அல்லது ஓட்டிச்செல்லுதல் எனப் பொருள்படலாம். சிறைப்பட்டவர்களை அங்கிருந்து நகர்த்திய செயலை ‘கொண்டுசென்று’ இயல்பாகக் கூறுகிறது; வலுக்கட்டாயத்தின் அளவை தேவையின்றி மிகைப்படுத்தவில்லை.
- source_word: וַיֵּלְכוּ לְדַרְכָּם
  choice: தங்கள் வழியே சென்றார்கள்
  rationale: அவர்கள் புறப்பட்டுத் தங்கள் பயணத்தைத் தொடர்ந்தார்கள் என்ற எபிரெய மரபுத்தொடருக்கு இது இயல்பான நவீனத் தமிழ் இணை.
