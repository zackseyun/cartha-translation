  text: וַ/יַּ֜עַן כָּל אִֽישׁ רָ֣ע וּ/בְלִיַּ֗עַל מֵֽ/הָ/אֲנָשִׁים֮ אֲשֶׁ֣ר הָלְכ֣וּ עִם דָּוִד֒ וַ/יֹּאמְר֗וּ יַ֚עַן אֲשֶׁ֣ר לֹֽא הָלְכ֣וּ עִמִּ֔/י לֹֽא נִתֵּ֣ן לָ/הֶ֔ם מֵ/הַ/שָּׁלָ֖ל אֲשֶׁ֣ר הִצַּ֑לְנוּ כִּֽי אִם אִ֤ישׁ אֶת אִשְׁתּ/וֹ֙ וְ/אֶת בָּנָ֔י/ו וְ/יִנְהֲג֖וּ וְ/יֵלֵֽכוּ־־־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/022.yaml
  text: Then every wicked and worthless man from among the men who had gone with David answered and said[a], “Because they did not go with me, we will not give them any of the spoil that we recovered[c][b], except that each man may take his wife and his children and lead them away and go.”
translation:
  language: ta
  text: 'தாவீதுடன் சென்றிருந்த ஆட்களில் இருந்த தீயவர்களும் கயவர்களுமாக[a] இருந்த அனைவரும் பதிலளித்துச் சொன்னார்கள்: “அவர்கள் என்னுடன்[b] வராததால், நாம் மீட்டுக்கொண்ட கொள்ளைப்பொருளில்[c] எதையும் அவர்களுக்குக் கொடுக்கமாட்டோம். ஒவ்வொருவனும் தன் மனைவியையும் தன் பிள்ளைகளையும் மட்டும் கூட்டிக்கொண்டு புறப்பட்டுப் போகட்டும்.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “கயவர்கள்” என்பது இங்கு בְלִיַּעַל (பெலிய்யால்) என்ற சொல்லை மனிதர்களின் இழிவான குணத்தை விவரிக்கும் சொல்லாக மொழிபெயர்க்கிறது; “ஒழுக்கங்கெட்டவர்கள்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில் “என்னுடன்” என்று ஒருமையில் உள்ளது; பேசுகிறவர்கள் ஒரு குழுவாக இருந்தாலும் மூலத்தின் ஒருமை வடிவம் இங்கு தக்கவைக்கப்பட்டுள்ளது.
    reason: source_ambiguity
  - marker: c
    text: “கொள்ளைப்பொருள்” என்பதற்கு “சூறைப்பொருள்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמְרוּ
  choice: மறுமொழியாக ... என்றார்கள்
  rationale: எபிரெயக் கதையோட்டத்தில் பதிலை அறிமுகப்படுத்தும் இரு வினைகளின் செயல்பாட்டையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது; பன்மை வடிவமான ‘என்றார்கள்’ பேசும் குழுவைக் குறிக்கிறது.
- source_word: כָּל אִישׁ רָע וּבְלִיַּעַל
  choice: தீயவர்களும் கயவர்களுமாக இருந்த அனைவரும்
  rationale: רָע என்பதன் அறநெறிசார் தீமையையும் בְלִיַּעַל என்பதன் இழிவான குணவிவரிப்பையும் தக்கவைக்கிறது; பின்னாளைய ‘பேலியாள்’ என்ற தனிப்பெயர் பொருளை இங்கு புகுத்தவில்லை.
- source_word: מֵהָאֲנָשִׁים אֲשֶׁר הָלְכוּ עִם דָּוִד
  choice: தாவீதுடன் சென்றிருந்த ஆட்களில்
  rationale: מִן என்பதன் பகுதியைக் குறிக்கும் பொருளைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: יַעַן אֲשֶׁר לֹא הָלְכוּ עִמִּי
  choice: அவர்கள் என்னுடன் வராததால்
  rationale: காரண இணைப்பை தெளிவாகக் காட்டுவதோடு, குழுவினர் பேசினாலும் மூலத்தில் உள்ள முதலாம் நபர் ஒருமை ‘என்னுடன்’ என்பதைப் பாதுகாக்கிறது.
- source_word: לֹא נִתֵּן לָהֶם
  choice: எதையும் அவர்களுக்குக் கொடுக்கமாட்டோம்
  rationale: முதலாம் நபர் பன்மை முற்றுப்பெறாத வினையின் உறுதியான மறுப்பை இயல்பான தமிழில் தருகிறது.
- source_word: מֵהַשָּׁלָל אֲשֶׁר הִצַּלְנוּ
  choice: நாம் மீட்டுக்கொண்ட கொள்ளைப்பொருளில்
  rationale: שָׁלָל என்பது போரில் கைப்பற்றிய பொருட்களைக் குறிக்கிறது; נצל என்பதன் இச்சூழல்சார் பொருள் இழந்ததை மீட்டெடுத்தல் என்பதால் ‘மீட்டுக்கொண்ட’ என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: כִּי אִם
  choice: மட்டும்
  rationale: அவர்கள் அளிக்கும் ஒரே விதிவிலக்கை இயல்பான தமிழில் குறிக்கிறது.
- source_word: אִישׁ אֶת אִשְׁתּוֹ וְאֶת בָּנָיו
  choice: ஒவ்வொருவனும் தன் மனைவியையும் தன் பிள்ளைகளையும்
  rationale: אִישׁ என்பதன் பகிர்வுப் பொருளையும் குடும்ப மீட்புச் சூழலில் בָּנִים என்பதன் பொதுவான ‘பிள்ளைகள்’ பொருளையும் வெளிப்படுத்துகிறது.
- source_word: וְיִנְהֲגוּ וְיֵלֵכוּ
  choice: கூட்டிக்கொண்டு புறப்பட்டுப் போகட்டும்
  rationale: ‘வழிநடத்திக் கொண்டு செல்லுதல்’ மற்றும் ‘போதல்’ என்ற இரு வினைகளையும் இயல்பான தமிழ் தொடரில் தக்கவைக்கிறது.
theological_decisions:
- issue: בְלִיַּעַל என்பதன் பொருள்
  choice: கயவர்கள்
  alternative: ஒழுக்கங்கெட்டவர்கள்; பயனற்றவர்கள்; பேலியாள்
  rationale: இங்கு இச்சொல் தீய குணமுள்ள மனிதர்களை விவரிக்கிறது; பிற்காலத்தில் தோன்றிய தீய ஆவியின் தனிப்பெயர் என்ற பொருளை மூலச் சூழல் கோரவில்லை.
- issue: עִמִּי என்பதிலுள்ள ஒருமை
  choice: என்னுடன்
  alternative: எங்களுடன்
  rationale: பேசுகிறவர்கள் ஒரு குழுவாக இருந்தாலும் எபிரெய மூலத்தில் உள்ள முதலாம் நபர் ஒருமையை மாற்றாமல் வைத்திருப்பது அதன் உண்மையான இலக்கணப் பதற்றத்தைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கதையாடல் நடை பயன்படுத்தப்பட்டுள்ளது. நேரடி பேச்சில் குழுவின் கடுமையான மறுப்பும், ‘என்னுடன்’ என்ற மூலத்தின் எதிர்பாராத ஒருமையும் பாதுகாக்கப்பட்டுள்ளன.
