  register: நவீனத் தரத் தமிழில், பொதுவாசகருக்கு எளிதாகப் புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘அந்தக் கால்நடைகள்’ என்ற மூலத்தின் சுட்டுத் தன்மை பாதுகாக்கப்பட்டு, அது ‘மற்ற கால்நடைகள்’ என்று வசனத்துக்குள் விளக்கமாக மாற்றப்படவில்லை; சாத்தியமான பின்னணி அடிக்குறிப்பில் மட்டும் தரப்பட்டுள்ளது.
