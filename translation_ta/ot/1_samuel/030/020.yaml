base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/020.yaml
  text: David took all the flocks and the herds[a]. They drove them ahead of the other livestock, and said[b], “This is David’s spoil.”
translation:
  language: ta
  text: தாவீது ஆடுமாடுகள் அனைத்தையும் எடுத்துக்கொண்டான். அவற்றை அந்தக் கால்நடைகளுக்கு முன்னால் ஓட்டிச் சென்றார்கள். “இது தாவீதின் கொள்ளைப் பொருள்[a]” என்று சொன்னார்கள்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இது தாவீது கைப்பற்றிய சூறைப் பொருள்.”
    reason: lexical_alternative
  - marker: b
    text: இப்போது கைப்பற்றப்பட்ட ஆடுமாடுகளை, முன்பு மீட்கப்பட்ட கால்நடைகளுக்கு முன்னால் அனைவரும் காணும்படி ஓட்டிச் சென்று, அவை தாவீதின் கொள்ளைப் பொருள் என்று மக்கள் அறிவித்ததாக எபிரெய உரை பெரும்பாலும் புரிந்துகொள்ளப்படுகிறது.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּקַּח
  choice: எடுத்துக்கொண்டான்
  rationale: לקח என்பதன் இயல்பான கதைநடைப் பொருள் ‘எடுத்தான்’; இச்சூழலில் தன் வசமாக எடுத்துக்கொண்டதைத் தெளிவாகவும், மூலத்தில் வெளிப்படையாக இல்லாத வன்முறையைச் சேர்க்காமலும் கூறுகிறது.
- source_word: כָּל הַצֹּאן וְהַבָּקָר
  choice: ஆடுமாடுகள் அனைத்தையும்
  rationale: צאן என்பது பொதுவாக ஆடு, வெள்ளாடு போன்ற சிறு கால்நடைகளையும், בקר என்பது மாடுகளையும் குறிக்கிறது. ‘ஆடுமாடுகள்’ நவீனத் தமிழில் இவ்விரு வகைகளையும் இயல்பாகச் சுருக்கிக் கூறுகிறது; כָּל என்பதற்கான முழுமையும் ‘அனைத்தையும்’ என்பதால் காக்கப்படுகிறது.
- source_word: נָהֲגוּ
  choice: ஓட்டிச் சென்றார்கள்
  rationale: נהג இங்கு கால்நடைகளை முன்னோக்கி ஓட்டிச் செல்வதைக் குறிக்கிறது; வெறுமனே ‘அழைத்துச் சென்றார்கள்’ என்பதைவிட கால்நடை இயக்கத்தைத் துல்லியமாக வெளிப்படுத்துகிறது.
- source_word: לִפְנֵי הַמִּקְנֶה הַהוּא
  choice: அந்தக் கால்நடைகளுக்கு முன்னால்
  rationale: לִפְנֵי என்பதன் இடவியல் பொருளான ‘முன்னால்’ என்பதும், הַהוּא என்ற சுட்டுப்பெயரின் ‘அந்த’ என்பதும் நேரடியாகக் காக்கப்படுகின்றன. இது முன்பே மீட்கப்பட்ட கால்நடைகளைக் குறிக்கலாம்; ஆனால் அந்த விளக்கத்தை வசனத்துக்குள் உறுதியாக்கவில்லை.
- source_word: וַיֹּאמְרוּ
  choice: என்று சொன்னார்கள்
  rationale: எபிரெய மொழியின் பன்மை எழுவாயைப் பாதுகாக்கும் இயல்பான தமிழ் மேற்கோள் அமைப்பு.
- source_word: זֶה שְׁלַל דָּוִד
  choice: இது தாவீதின் கொள்ளைப் பொருள்
  rationale: זֶה என்பதன் ஒருமைச் சுட்டை ‘இது’ காக்கிறது. שְׁלַל என்பது போரிலோ தாக்குதலிலோ கைப்பற்றிய கொள்ளை/சூறைப் பொருளைக் குறிக்கிறது; ‘கொள்ளைப் பொருள்’ பொதுவாசகருக்குப் புரியும் கண்ணியமான சொல்.
