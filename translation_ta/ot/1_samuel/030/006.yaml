source:
  edition: WLC
  text: וַ/תֵּ֨צֶר לְ/דָוִ֜ד מְאֹ֗ד כִּֽי אָמְר֤וּ הָ/עָם֙ לְ/סָקְל֔/וֹ כִּֽי מָ֨רָה֙ נֶ֣פֶשׁ כָּל הָ/עָ֔ם אִ֖ישׁ עַל בנ/ו וְ/עַל בְּנֹתָ֑י/ו וַ/יִּתְחַזֵּ֣ק דָּוִ֔ד בַּ/יהוָ֖ה אֱלֹהָֽי/ו־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/006.yaml
  text: And David was greatly distressed[a], because the people spoke of stoning him, for the soul of all the people was bitter, each man because of his sons and his daughters. But David strengthened himself in Yahweh his God.
translation:
  language: ta
  text: தாவீது மிகுந்த நெருக்கடியில் இருந்தான். மக்கள் அவனைக் கல்லெறிய வேண்டும் என்று பேசினார்கள்; ஏனெனில் மக்கள் அனைவரின் உள்ளமும் கசந்திருந்தது; ஒவ்வொருவனும் தன் மகன்களையும் மகள்களையும் குறித்து அவ்வாறு இருந்தான். ஆனால் தாவீது தன் கடவுளாகிய யாவேயில் தன்னைத் திடப்படுத்திக்கொண்டான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֵּצֶר לְדָוִד מְאֹד
  choice: தாவீது மிகவும் நெருக்கடிக்குள்ளானான்
  rationale: צרר என்பதன் இந்த לְ உடனான அமைப்பு தாவீதுக்கு நிலைமை மிகுந்த நெருக்கடியும் துயரமும் அளித்ததைக் குறிக்கிறது; מְאֹד என்பதன் தீவிரமும் ‘மிகவும்’ மூலம் பாதுகாக்கப்படுகிறது.
- source_word: הָעָם
  choice: மக்கள்
  rationale: சூழலில் தாவீதின் போர்வீரர்களைக் குறித்தாலும், எபிரெய மூலத்தின் பொதுவான ‘மக்கள்’ என்ற சொல்லை மிகைப்படுத்தாமல் அப்படியே வைத்துள்ளது.
- source_word: אָמְרוּ הָעָם לְסָקְלוֹ
  choice: மக்கள் அவனைக் கல்லெறிந்து கொல்லப் பேசிக்கொண்டார்கள்
  rationale: אָמְרוּ உடன் வரும் வினையெச்சம் உடனடிச் செயலைவிட ஆலோசிக்கப்பட்ட நோக்கத்தைக் காட்டுகிறது; ‘கல்லெறிதல்’ தமிழில் தெளிவாக மரணதண்டனைச் செயல் எனத் தெரிய ‘கொல்ல’ சேர்க்கப்பட்டுள்ளது.
- source_word: מָרָה נֶפֶשׁ כָּל הָעָם
  choice: மக்கள் அனைவரும் மனங்கசந்திருந்தார்கள்
  rationale: சொல்லடியாக ‘அனைத்து மக்களின் உயிர்/ஆத்துமா கசந்தது’ என்ற எபிரெய மொழிநடையை இயல்பான நவீன தமிழில் ஆழ்ந்த மனக்கசப்பாக அளிக்கிறது; மாற்று சொல்லடி வாசிப்பு அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: אִישׁ עַל בָּנָיו וְעַל בְּנֹתָיו
  choice: ஒவ்வொருவனும் தன் மகன்களையும் மகள்களையும் நினைத்து
  rationale: אִישׁ என்பதன் பகிர்மான ஆண்பால் குறிப்பையும், עַל என்பதன் துயரத்திற்கான காரணத்தையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וַיִּתְחַזֵּק
  choice: தன்னைத் திடப்படுத்திக்கொண்டான்
  rationale: ஹித்பாயேல் வடிவின் தன்முக/இடைநிலைச் செயற்பாட்டைத் தக்கவைக்கிறது; வெறுமனே ‘தைரியம் பெற்றான்’ எனச் சுருக்கவில்லை.
- source_word: בַּיהוָה אֱלֹהָיו
  choice: தன் கடவுளாகிய யாவேக்குள்
  rationale: בְּ முன்னிடைச்சொல்லின் தளம் அல்லது ஆதாரம் என்ற திறப்பை ‘-க்குள்’ காக்கிறது; יהוה என்ற உடன்படிக்கைப் பெயர் ‘யாவே’ என நேரடியாக ஒலிபெயர்க்கப்படுகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலத்தில் நான்கு எழுத்து இறைப்பெயர் நேரடியாக உள்ளது. அதை ஒரு பட்டப்பெயராக மாற்றாமல், வழக்கமான அறிவார்ந்த உச்சரிப்பைத் தமிழில் ஒலிபெயர்ப்பது உடன்படிக்கைப் பெயரைப் பாதுகாக்கிறது.
- issue: தாவீது வலிமை பெற்ற விதம்
  choice: யாவேக்குள் தன்னைத் திடப்படுத்திக்கொண்டான்
  alternative: யாவேயால் பலப்படுத்தப்பட்டான் / யாவேயில் தைரியம் பெற்றான்
  rationale: וַיִּתְחַזֵּק என்ற தன்முக வடிவம் தாவீதின் செயற்பாட்டைத் தெரிவிக்கிறது; בְּ என்பது ஆதாரம் அல்லது உறவுத் தளம் ஆகிய இரண்டிற்கும் இடமளிப்பதால் அந்த இறையியல் நுணுக்கத்தைத் தீர்மானமாகச் சுருக்கவில்லை.
translation_notes:
  register: நவீன தரத் தமிழ்; சாதாரண வாசகர்களுக்குப் புரியும் வகையில் இயல்பாகவும், வேதாகம நிகழ்வுக்கேற்ற கண்ணியமான தொனியுடனும் அமைக்கப்பட்டது. ‘மனங்கசந்திருந்தார்கள்’ என்பது இயல்புக்காகத் தேர்ந்தெடுக்கப்பட்டு, மூலத்தின் உடற்கூறு சார்ந்த சொல்லடி உருவகம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
