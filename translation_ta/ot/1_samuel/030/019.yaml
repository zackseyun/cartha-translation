base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/019.yaml
  text: Nothing of theirs was missing[a], from small to great, sons and daughters, spoil, or anything that had been taken from them[b]; David brought back everything.
translation:
  language: ta
  text: அவர்களுக்குரிய எதுவும்—சிறியவர் முதல் பெரியவர் வரை[a], மகன்களும் மகள்களும், கொள்ளைப்பொருளும், அவர்களிடமிருந்து எடுத்துச் சென்ற எதுவும்[b]—இல்லாமல் போகவில்லை; தாவீது எல்லாவற்றையும் திரும்பக் கொண்டுவந்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “சிறியவர் முதல் பெரியவர் வரை” என்பதற்கு “மிகச் சிறியவர் முதல் மிகப் பெரியவர் வரை” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில், “அவர்கள் தங்களுக்காக எடுத்துக்கொண்ட அனைத்தும்”; சூழலில் இது அமலேக்கியர் தாவீதின் மக்களிடமிருந்து எடுத்தவற்றைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶעְדַּר
  choice: குறையவில்லை
  rationale: இங்கு עדר என்பதன் நிஃபால் வடிவம், மீட்புக்குப் பின் யாரும் எதுவும் இல்லாமற்போகவில்லை அல்லது விடுபடவில்லை என்பதைக் குறிக்கிறது. ‘குறையவில்லை’ என்பது மனிதர்களையும் பொருள்களையும் உள்ளடக்கும் இயல்பான தமிழ்.
- source_word: לָהֶם
  choice: அவர்களுக்குரிய
  rationale: எபிரெய தத்திவ உருபு இங்கு உடைமைப் பொருளைத் தருவதால், தமிழில் ‘அவர்களுக்குரிய’ என்று இயல்பாக வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: מִן הַקָּטֹן וְעַד הַגָּדוֹל
  choice: சிறியவர் முதல் பெரியவர் வரை
  rationale: மூலத்தின் இரு முனைகளையும் குறிப்பிடும் முழுமைப்பாட்டு சொற்றொடரை நெருக்கமாகப் பேணுகிறது; வயதையோ நிலையையோ மட்டும் தீர்மானித்துவிடாமல் அதன் இயல்பான தெளிவின்மையையும் காக்கிறது.
- source_word: בָּנִים וּבָנוֹת
  choice: மகன்களும் மகள்களும்
  rationale: மூலம் ஆண், பெண் பிள்ளைகளைத் தனித்தனியாகக் குறிப்பிடுவதால் அதே வேறுபாடு தமிழிலும் பேணப்பட்டுள்ளது.
- source_word: מִשָּׁלָל
  choice: கொள்ளைப்பொருள்
  rationale: தாக்குதலில் கைப்பற்றப்பட்ட உடைமைகளைச் சுட்டும் சொல்லுக்கு நவீனத் தமிழில் தெளிவான, சூழலுக்கேற்ற இணைச்சொல்.
- source_word: כָּל אֲשֶׁר לָקְחוּ לָהֶם
  choice: அவர்களிடமிருந்து எடுத்துச் சென்ற மற்ற எதுவும்
  rationale: சூழலில் அமலேக்கியர் தாவீதின் மக்களிடமிருந்து எடுத்தவற்றைச் சுட்டுகிறது. வாசிப்புத் தெளிவுக்காக பாதிக்கப்பட்டவர்களைத் தமிழில் வெளிப்படையாகக் குறிப்பிட்டாலும், மூலத்தின் சொற்சார்ந்த வடிவம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: הַכֹּל הֵשִׁיב
  choice: எல்லாவற்றையும் திரும்பக் கொண்டுவந்தான்
  rationale: שׁוב என்பதன் ஹிஃபில் வடிவம் ‘திரும்பும்படி செய்தல்’ என்ற செயற்பொருளைக் கொண்டது; கொள்ளையிடப்பட்ட அனைத்தையும் தாவீது மீட்டுத் திரும்பக் கொண்டுவந்த செயலை இது தெளிவாகத் தருகிறது.
- source_word: דָּוִד
  choice: தாவீது
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் நிலைபெற்ற பெயர்வடிவம்.
