revisions:
- from: அவர்களுக்குரிய எதுவும்—சிறியவர் முதல் பெரியவர் வரை[a], மகன்களும் மகள்களும், கொள்ளைப்பொருளும், அவர்களிடமிருந்து எடுத்துச் சென்ற மற்ற எதுவும்[b]—குறையவில்லை; தாவீது எல்லாவற்றையும் திரும்பக் கொண்டுவந்தான்.
  to: அவர்களுக்குரிய எதுவும்—சிறியவர் முதல் பெரியவர் வரை[a], மகன்களும் மகள்களும், கொள்ளைப்பொருளும், அவர்களிடமிருந்து எடுத்துச் சென்ற எதுவும்[b]—இல்லாமல் போகவில்லை; தாவீது எல்லாவற்றையும் திரும்பக் கொண்டுவந்தான்.
  rationale: A limited revision removes the unsupported ‘மற்ற’ and uses a more idiomatic expression for the source meaning that nothing was missing. The source’s ambiguity about whether ‘small and great’ concerns age, status, or comprehensive scope remains intact, as does the contextual clarification in footnote b.
