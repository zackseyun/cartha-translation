translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான வரலாற்றுநடை பயன்படுத்தப்பட்டுள்ளது. கோடுகளுக்குள் அமைந்த பட்டியல், எதுவும் குறையவில்லை என்ற முழுமைப்பாட்டைத் தெளிவாகக் காட்டுகிறது; ‘சிறியவர் முதல் பெரியவர் வரை’ என்பதில் வயது அல்லது சமூகநிலை என்ற இரு சாத்தியங்களும் கட்டாயமாகத் தீர்மானிக்கப்படவில்லை.
