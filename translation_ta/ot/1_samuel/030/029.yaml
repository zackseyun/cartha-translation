  text: and to those in Rakal[a], and to those in the towns of the Jerahmeelites, and to those in the towns of the Kenites.
translation:
  language: ta
  text: ராகாலில் உள்ளவர்களுக்கும், யெரக்மெயேலியரின் ஊர்களில் உள்ளவர்களுக்கும், கேனியரின் ஊர்களில் உள்ளவர்களுக்கும்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְלַאֲשֶׁר
  choice: இருந்தவர்களுக்கும்
  rationale: இந்தப் பரிசுப் பகிர்வுப் பட்டியலில், முன்னிடைச்சொல் לְ உடன் வரும் தொடர்புச் சொல், குறிப்பிட்ட இடங்களில் இருந்தவர்களைப் பெறுநர்களாகச் சுட்டுகிறது. தமிழில் ‘இருந்தவர்களுக்கும்’ என்பது இடத் தொடர்பையும் பெறுநர் பொருளையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: בְּרָכָל
  choice: ராக்காலில்
  rationale: இது ஓர் இடப்பெயர்; எபிரேய ஒலியமைப்புக்கு நெருக்கமாகத் தமிழில் எழுத்துப்பெயர்க்கப்பட்டுள்ளது.
- source_word: בְּעָרֵי
  choice: ஊர்களில்
  rationale: עִיר என்பது சூழலுக்கேற்ப நகரம் அல்லது ஊர் எனப் பொருள்படும். இங்குள்ள பிராந்தியக் குடியிருப்புகளின் பட்டியலில் ‘ஊர்கள்’ என்பது இயல்பாகவும் பொருத்தமாகவும் உள்ளது.
- source_word: הַיְּרַחְמְאֵלִי
  choice: யெரக்மெயேலியரின்
  rationale: வடிவத்தில் ஒருமை இனப்பெயராக இருந்தாலும், ‘ஊர்கள்’ என்பதோடு சேர்ந்து ஒரு மக்கள் குழுவைக் கூட்டாகக் குறிக்கிறது; ஆகவே தமிழில் பன்மை மரியாதை/மக்கள் வடிவம் பயன்படுத்தப்பட்டுள்ளது.
- source_word: הַקֵּינִי
  choice: கேனியரின்
  rationale: இவ்வினப்பெயரும் வடிவத்தில் ஒருமையாக இருந்தாலும், இங்கு மக்கள் குழுவை கூட்டாகக் குறிக்கிறது; ‘கேனியரின் ஊர்கள்’ என்பது இயல்பான தமிழ் அமைப்பு.
