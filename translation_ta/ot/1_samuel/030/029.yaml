translation_notes:
  register: நவீன நிலையான தமிழில், கண்ணியமானதும் சாதாரண வாசகர்களுக்கு எளிதில் புரியக்கூடியதுமான நடை. இவ்வசனம் முந்தைய வசனத்தில் தொடங்கிய வாக்கியத்தின் தொடர்ச்சி என்பதால், தமிழில் முழுமையான வாசிப்புக்காக ‘கொடுத்தனுப்பினான்’ சேர்க்கப்பட்டுள்ளது; அது உடனடி சூழலிலிருந்து பெறப்பட்டது, புதிய தகவலை அறிமுகப்படுத்துவதில்லை.
