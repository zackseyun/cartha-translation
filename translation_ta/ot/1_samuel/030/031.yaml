  text: and to those in Hebron[a], and to all the places where David and his men had gone about.
translation:
  language: ta
  text: எபிரோனில் இருந்தவர்களுக்கும், தாவீதும் அவனுடைய ஆட்களும் நடமாடிய எல்லா இடங்களுக்கும் அனுப்பினான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘சென்று திரிந்த’ அல்லது ‘சென்றுவந்த’ என்றும் மொழிபெயர்க்கலாம். எபிரெய வினைச்சொல் இடம்விட்டு இடம் மீண்டும் மீண்டும் சென்றதைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/לַ/אֲשֶׁר בְּ/חֶבְרוֹן
  choice: எப்ரோனில் இருந்தவர்களுக்கும்
  rationale: முந்தைய வசனத்தில் தொடங்கிய பரிசைப் பெற்றவர்களின் பட்டியலைத் தொடரும் சொற்றொடர். தமிழில் மறைந்திருக்கும் பன்மை மனிதக் குறிப்பை ‘இருந்தவர்களுக்கும்’ என்று இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וּֽ/לְ/כָל הַ/מְּקֹמוֹת אֲשֶׁר ... שָׁם
  choice: எல்லா இடங்களில் இருந்தவர்களுக்கும்
  rationale: எபிரெய உரை சொல்லர்த்தமாக ‘எல்லா இடங்களுக்கும்’ எனக் கூறினாலும், சூழலில் பரிசு இடங்களுக்கல்ல, அங்கிருந்த மூப்பர்களுக்கு அனுப்பப்படுகிறது. தமிழில் பொருள் தெளிவாக இருக்க மனிதப் பெறுநர்கள் இயல்பாக நிரப்பப்பட்டுள்ளனர்.
- source_word: הִתְהַלֶּךְ
  choice: சென்றுவந்த
  rationale: Hitpael வடிவம் ஒருமுறை சென்றதைக் காட்டிலும் இடமிடமாகத் தொடர்ந்து அல்லது வழக்கமாகச் சென்ற நடமாட்டத்தைச் சுட்டுகிறது; ‘சென்றுவந்த’ என்பது இதை இயல்பான தமிழில் தருகிறது.
- source_word: דָּוִד הוּא וַ/אֲנָשָׁיו
  choice: தாவீதும் அவனுடைய ஆட்களும்
  rationale: הוּא இங்கு தாவீதை மீண்டும் எடுத்துரைக்கும் appositional pronoun ஆகப் புரிந்துகொள்ளப்படுகிறது; தனியாக ‘தானே’ என வலியுறுத்துவது தேவையில்லை. אֲנָשָׁיו என்பது இச்சூழலில் தாவீதின் கூட்டத்தாரான ஆட்களைக் குறிக்கிறது.
