translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் வகையிலும் கண்ணியமான வேதாகம நடையிலும் மொழிபெயர்க்கப்பட்டது. மூலத்தின் பட்டியல் அமைப்பு முக்காற்புள்ளி மூலம் காக்கப்பட்டுள்ளது; ஊர்சார் பெண்பால் மற்றும் ஆண்பால் வடிவங்கள் தமிழில் இயல்பான ‘சேர்ந்த’ கட்டமைப்பாக வழங்கப்பட்டுள்ளன.
