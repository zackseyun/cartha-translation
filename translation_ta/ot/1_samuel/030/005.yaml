  yaml_path: translation/ot/1_samuel/030/005.yaml
  text: 'And David’s two wives had been taken captive: Ahinoam the Jezreelitess and Abigail[b][a], the wife of Nabal the Carmelite.'
translation:
  language: ta
  text: 'தாவீதின் இரண்டு மனைவிகளும் சிறைபிடித்துச் செல்லப்பட்டிருந்தார்கள்: யெஸ்ரயேலைச் சேர்ந்த அகினோவாம்[a], கர்மேலைச் சேர்ந்த நாபாலின் மனைவி அபிகாயில்[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யெஸ்ரயேல் பெண்ணான அகினோவாம்.”
    reason: lexical_alternative
  - marker: b
    text: இங்கே கர்மேல் என்பது ஓர் இடப்பெயர்; நாபால் அந்த இடத்தைச் சேர்ந்தவர் என்பதே பொருள்.
    reason: cultural_note
lexical_decisions:
- source_word: וּ/שְׁתֵּי נְשֵׁי דָוִד
  choice: தாவீதின் இரண்டு மனைவிகளும்
  rationale: வாவ் இணைப்பைத் தமிழில் இயல்பாக ‘-உம்’ வழியாகத் தொடர்ச்சியுடன் வெளிப்படுத்துகிறது; எபிரெயக் கட்டமைப்பின் பொருளான ‘தாவீதின் இரண்டு மனைவிகள்’ என்பதையும் தெளிவாகக் காக்கிறது.
- source_word: נִשְׁבּוּ
  choice: சிறைபிடிக்கப்பட்டிருந்தார்கள்
  rationale: שׁבה என்பதன் நிஃபால் வடிவம் அவர்கள் சிறைப்பட்டவர்களாகக் கொண்டு செல்லப்பட்டதைச் சுட்டுகிறது. முந்தைய தாக்குதலால் ஏற்கெனவே நிகழ்ந்திருந்த நிலையை இவ்வடிவம் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: אֲחִינֹעַם הַ/יִּזְרְעֵלִית
  choice: யெஸ்ரயேலைச் சேர்ந்த அகினோவாம்
  rationale: பெண்பால் குடியினப் பெயர் அகினோவாமின் ஊர் அல்லது பிறப்பிடத் தொடர்பைக் குறிக்கிறது; நவீன தமிழில் ‘யெஸ்ரயேலைச் சேர்ந்த’ என்பது தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: וַ/אֲבִיגַיִל
  choice: அபிகாயில்
  rationale: இணைப்புப் பொருள் பட்டியலின் தமிழ் அமைப்பில் வெளிப்படுகிறது; தனிப்பெயர் வழக்கமான தமிழ் ஒலிபெயர்ப்பில் தரப்பட்டுள்ளது.
- source_word: אֵשֶׁת נָבָל הַֽ/כַּרְמְלִי
  choice: கர்மேலைச் சேர்ந்த நாபாலின் மனைவி
  rationale: நாபாலுடனான திருமண அடையாளத்தையும், הַכַּרְמְלִי என்பது கர்மேல் ஊரைச் சேர்ந்தவர் என்ற புவியியல் குறிப்பையும் பாதுகாக்கிறது.
