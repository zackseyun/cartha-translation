source:
  edition: WLC
  text: אֲנַ֡חְנוּ פָּשַׁ֜טְנוּ נֶ֧גֶב הַ/כְּרֵתִ֛י וְ/עַל אֲשֶׁ֥ר לִֽ/יהוּדָ֖ה וְ/עַל נֶ֣גֶב כָּלֵ֑ב וְ/אֶת צִקְלַ֖ג שָׂרַ֥פְנוּ בָ/אֵֽשׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/014.yaml
  text: We raided the Negev of the Kerethites[a], and the territory that belongs to Judah, and the Negev of Caleb; and we burned Ziklag with fire.
translation:
  language: ta
  text: “நாங்கள் கெரேத்தியர்களின்[a] நெகேவுப் பகுதியிலும், யூதாவுக்குச் சொந்தமான பகுதியிலும், காலேபின் நெகேவுப் பகுதியிலும் சூறையாடினோம்; சிக்லாகை நெருப்பால் எரித்தோம்.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘கெரேத்தியர்’ என்பதற்கான மரபுவழி ஒலிபெயர்ப்பாக ‘செரேத்தியர்கள்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: פָּשַׁטְנוּ
  choice: கொள்ளையடித்தோம்
  rationale: இராணுவச் சூழலில் இவ்வினைச்சொல் கொள்ளையிடும் படையெடுப்பைக் குறிக்கிறது. இயல்பான தமிழில் ‘கொள்ளையடித்தோம்’ என்பது தாக்குதல் மற்றும் சூறையாடல் ஆகிய இரு நுணுக்கங்களையும் சுருக்கமாக வெளிப்படுத்துகிறது.
- source_word: נֶגֶב
  choice: நெகேவுப் பகுதி
  rationale: இங்கு இது வெறும் தென்திசையை அல்லாமல் தெற்கிலுள்ள வறண்ட நிலப்பகுதியைக் குறிக்கும் புவியியல் பெயராக உள்ளது. ‘பகுதி’ என்பதைச் சேர்ப்பது நவீன தமிழ் வாசகருக்குப் பொருளைத் தெளிவாக்குகிறது.
- source_word: הַכְּרֵתִי
  choice: கெரேத்தியர்கள்
  rationale: இது ஒரு மக்கள் குழுவின் பெயர். எபிரெய மெய்யெழுத்துகளுக்கு நெருக்கமான ஒலிபெயர்ப்பு பயன்படுத்தப்பட்டுள்ளது; மாற்று மரபுவழி ஒலிபெயர்ப்பு அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: וְעַל אֲשֶׁר לִיהוּדָה
  choice: யூதாவுக்குச் சொந்தமான பகுதியிலும்
  rationale: வினைச்சொல்லைத் தொடரும் עַל தாக்கப்பட்ட இடங்களின் பட்டியலை விரிக்கிறது; אֲשֶׁר לִיהוּדָה என்பது யூதாவுக்குச் சொந்தமான நிலப்பகுதியை இயல்பாகக் குறிக்கிறது.
- source_word: נֶגֶב כָּלֵב
  choice: காலேபின் நெகேவுப் பகுதி
  rationale: காலேபின் குலம் அல்லது அவர்களுடைய நிலப்பரப்புடன் தொடர்புடைய தெற்கு மாவட்டத்தைக் குறிக்கும் எபிரெய அமைப்பும் புவியியல் நுணுக்கமும் பாதுகாக்கப்படுகின்றன.
- source_word: שָׂרַפְנוּ בָאֵשׁ
  choice: நெருப்பால் எரித்தோம்
  rationale: ‘எரித்தோம்’ என்பதுடன் ‘நெருப்பால்’ என்பதையும் மூலமொழி வெளிப்படையாகக் கூறுகிறது. தமிழில் ஓரளவு மீளுரைப்பாகத் தோன்றினாலும், மூலத்தின் வலியுறுத்தலை இது பாதுகாக்கிறது.
- source_word: צִקְלַג
  choice: சிக்லாக்
  rationale: இடப்பெயரின் எபிரெய உச்சரிப்பைத் தொடர்ந்து வழங்கப்படும் தமிழ் ஒலிபெயர்ப்பு.
