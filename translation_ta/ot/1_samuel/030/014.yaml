translation_notes:
  register: நவீனத் தரத் தமிழில், நேரடியும் கண்ணியமுமான உரைநடை பயன்படுத்தப்பட்டுள்ளது. இடங்களின் தொடரைப் பிரதிபலிக்க ‘பகுதியிலும்’ என்ற இணை அமைப்பு மீண்டும் வருகிறது. மக்கள் பெயர் மூல எபிரெய ஒலிக்கு நெருக்கமாக வைக்கப்பட்டு, மரபுவழி வடிவம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
