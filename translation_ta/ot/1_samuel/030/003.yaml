  yaml_path: translation/ot/1_samuel/030/003.yaml
  text: When David and his men came to the city, behold, it had been burned with fire, and their wives, sons, and daughters had been taken captive.
translation:
  language: ta
  text: தாவீதும் அவனுடைய ஆட்களும் அந்த நகரத்துக்கு வந்தபோது, இதோ, அது நெருப்பால் எரிக்கப்பட்டிருந்தது; அவர்களுடைய மனைவிகளும் மகன்களும் மகள்களும் சிறைபிடித்துச் செல்லப்பட்டிருந்தார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִנֵּה
  choice: இதோ
  rationale: காட்சியின் அதிர்ச்சியையும் திடீர் உணர்வையும் வெளிப்படுத்தும் எபிரெயச் சுட்டுச் சொல்லைத் தக்கவைக்கிறது.
- source_word: שְׂרוּפָה בָּאֵשׁ
  choice: நெருப்பால் எரிக்கப்பட்டிருந்தது
  rationale: பெண்பால் செயல்பாட்டு பெயரெச்சத்தின் நிலைமையையும் בָּאֵשׁ என்பதன் கருவிப் பொருளையும் இயல்பான தமிழில் தருகிறது; அவர்கள் வந்ததற்கு முன்பே எரிப்பு நிகழ்ந்திருந்ததையும் சூழல் தெளிவாக்குகிறது.
- source_word: נִשְׁבּוּ
  choice: சிறைபிடித்துச் செல்லப்பட்டிருந்தார்கள்
  rationale: நִשְׁבָּה வினையின் நிஃபால் வடிவம் குறிக்கும் சிறைபிடிக்கப்பட்ட நிலையைத் தெளிவாகத் தருகிறது; நகரிலிருந்து அவர்கள் கொண்டு செல்லப்பட்டதை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
