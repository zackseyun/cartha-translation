base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/017.yaml
  text: David struck them down from the twilight until the evening of the next day[a], and not a man of them escaped, except four hundred young men who rode on the camels and fled.
translation:
  language: ta
  text: தாவீது மங்கல் பொழுதிலிருந்து[a] மறுநாள் மாலைவரை அவர்களைத் தாக்கி வீழ்த்தினான். ஒட்டகங்கள்மேல் சவாரி செய்து தப்பியோடிய நானூறு இளைஞர்களைத் தவிர, அவர்களில் ஒருவன்கூட தப்பவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘விடியற்காலையிலிருந்து.’ இங்குள்ள எபிரேயச் சொல் நாளின் தொடக்கத்திலோ முடிவிலோ உள்ள மங்கல் பொழுதைக் குறிக்கலாம். சிலர் இங்கே அதை மாலை மங்கலாக அல்ல, விடியல் மங்கலாகப் புரிந்துகொள்கிறார்கள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּכֵּם
  choice: அவர்களை வெட்டி வீழ்த்தினான்
  rationale: இராணுவச் சூழலில் נכה என்பது வன்மையாகத் தாக்கி வீழ்த்துவதைக் குறிக்கிறது. ‘வெட்டி வீழ்த்தினான்’ என்பது வினையின் வலிமையையும் ‘அவர்களை’ என்ற பொருள் சுட்டையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: מֵהַנֶּשֶׁף
  choice: மங்கல் பொழுதிலிருந்து
  rationale: נשף என்பது மாலை மங்கலையோ விடியல் மங்கலையோ குறிக்கக்கூடும். ‘மங்கல் பொழுது’ என்ற பொதுவான சொற்றொடர் மூலத்தின் தெளிவின்மையை ஓரளவு காக்கிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: וְעַד הָעֶרֶב לְמָחֳרָתָם
  choice: மறுநாள் மாலைவரை
  rationale: போர் அடுத்த நாளின் மாலைவரை நீடித்தது என்ற கால அளவைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: נִמְלַט מֵהֶם אִישׁ
  choice: அவர்களில் ஒருவன்கூட தப்பவில்லை
  rationale: எபிரேய ஒருமை ஆண்பால் சொல் இங்கு ஒவ்வொருவரையும் உள்ளடக்கும் வகையில் பயன்படுத்தப்பட்டுள்ளது. ‘ஒருவன்கூட’ என்பது அந்த வலியுறுத்தப்பட்ட முழுமையைத் தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: כִּי אִם
  choice: தவிர
  rationale: முந்தைய முழுமையான கூற்றுக்கு விதிவிலக்கை அறிமுகப்படுத்தும் எபிரேய மரபுத்தொடருக்கு இயல்பான தமிழ் இணை.
- source_word: אַרְבַּע מֵאוֹת אִישׁ נַעַר
  choice: நானூறு இளைஞர்கள்
  rationale: נַעַר என்பதற்கு சிறுவன், இளைஞன், பணியாள் போன்ற பொருள்கள் உண்டு. இங்கு ஒட்டகங்களில் தப்பிச் செல்லும் போராளிகள் என்பதால் ‘இளைஞர்கள்’ சூழலுக்கு மிகவும் பொருந்துகிறது.
- source_word: רָכְבוּ עַל הַגְּמַלִּים
  choice: ஒட்டகங்கள்மேல் சவாரி செய்து
  rationale: ‘ஒட்டகங்கள்மேல் ஏறிச் சென்றனர்’ என்ற மூலக் கருத்தை நவீனத் தமிழில் இயல்பாகவும் தெளிவாகவும் வெளிப்படுத்துகிறது.
- source_word: וַיָּנֻסוּ
  choice: தப்பியோடிய
  rationale: נוּס என்பது ஓடித் தப்புவதைக் குறிக்கிறது. ‘தப்பியோடிய’ என்பது முன்னுள்ள נמלט (‘தப்பவில்லை’) என்பதிலிருந்து வினை வேறுபாட்டை ஓரளவு காத்து, நிகழ்ச்சித் தொடரையும் இயல்பாக இணைக்கிறது.
