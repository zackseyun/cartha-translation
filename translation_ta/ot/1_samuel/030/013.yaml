translation_notes:
  register: நவீன நிலையான தமிழில், கண்ணியமான ஆனால் பொதுவாசகர்களுக்கு எளிதில் புரியும் நடையில் மொழிபெயர்க்கப்பட்டது. உரையாடலின் நேரடித்தன்மையும் எஜமான்–அடிமை சமூக உறவின் கடுமையும் மென்மைப்படுத்தப்படவில்லை.
