base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/013.yaml
  text: David said to him, “Whose are you, and where are you from?” He said, “I am an Egyptian young man, a servant of an Amalekite man, and my master abandoned me because I became sick three days ago.”
translation:
  language: ta
  text: தாவீது அவனிடம், “நீ யாருக்குச் சொந்தமானவன்? நீ எங்கிருந்து வந்தவன்?” என்று கேட்டான். அதற்கு அவன், “நான் ஓர் எகிப்திய இளைஞன்; ஓர் அமலேக்கியனின் அடிமை. மூன்று நாட்களுக்கு முன்பு நான் நோயுற்றதால் என் எஜமான் என்னைக் கைவிட்டுவிட்டார்” என்றான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְמִי אַתָּה
  choice: நீ யாருக்குச் சொந்தமானவன்?
  rationale: சொல்லுக்கு சொல் ‘நீ யாருடையவன்?’ என்ற பொருளை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது; இது குடும்பச் சார்பையோ எஜமான்–அடிமை உறவையோ குறிக்கக்கூடிய மூலத்தின் திறந்த தன்மையையும் காக்கிறது.
- source_word: נַעַר מִצְרִי
  choice: ஓர் எகிப்திய இளைஞன்
  rationale: נַעַר என்பதன் இச்சூழலுக்குரிய பொதுவான பொருள் ‘இளைஞன்’; அவனது இன/நாட்டுச் சார்பை ‘எகிப்திய’ எனத் தெளிவாக வைத்துள்ளது.
- source_word: עֶבֶד
  choice: அடிமை
  rationale: இங்கு அமலேக்கிய எஜமானுக்குச் சொந்தமான சார்புநிலையைக் குறிக்கும் வலுவான சமூகச் சொல்லாக இருப்பதால், மென்மைப்படுத்தும் ‘வேலைக்காரன்’ என்பதற்குப் பதிலாக ‘அடிமை’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: וַיַּעַזְבֵנִי
  choice: என்னைக் கைவிட்டுவிட்டார்
  rationale: עזב இங்கு நோயுற்ற அடிமையை விட்டுச்சென்ற செயலைக் குறிக்கிறது; ‘கைவிட்டார்’ அதன் உடல் ரீதியான விட்டுச்செல்லுதலையும் உறவுசார் புறக்கணிப்பையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: כִּי חָלִיתִי הַיּוֹם שְׁלֹשָׁה
  choice: மூன்று நாட்களுக்கு முன்பு நான் நோயுற்றதால்
  rationale: எபிரெயச் சொற்றொடர் ‘இன்று மூன்று நாட்கள்’ என்ற காலக்கணக்கைக் கொண்டது; சூழலில் அதை இயல்பான தமிழில் ‘மூன்று நாட்களுக்கு முன்பு’ என வழங்குகிறது.
