  source_fidelity: மொத்தத்தில் மொழிபெயர்ப்பு எபிரெய மூலத்திற்கு உண்மையுள்ளது. לְמִי אַתָּה என்பதன் உடைமை/சார்பு வினாவை «நீ யாருக்குச் சொந்தமானவன்?» துல்லியமாகக் காட்டுகிறது; עֶבֶד என்பதற்கான «அடிமை»யும், நோயுற்ற நிலையில் எஜமான் விட்டுச்சென்றதைச் சொல்வதும் சரியாக உள்ளன. ஆனால் וְאֵי מִזֶּה אָתָּה என்பது நிகழ்காலப் பயணத்தைப் பற்றிய «எங்கிருந்து வருகிறாய்?» என்பதைக் காட்டிலும், ஒருவரின் ஊர்/தோற்றத்தை விசாரிக்கும் «நீ எங்கிருந்து வந்தவன்?» என அமைவது நேரடியானது.
