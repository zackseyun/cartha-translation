  yaml_path: translation/ot/1_samuel/030/012.yaml
  text: They gave him a piece of fig cake and two clusters of raisins[a], and he ate, and his spirit returned to him[c][b], for he had not eaten bread or drunk water for three days and three nights.
translation:
  language: ta
  text: அவர்கள் அவனுக்கு அத்திப்பழ அடையின் ஒரு துண்டையும் இரண்டு உலர்திராட்சைத் திரள்களையும்[a] கொடுத்தார்கள். அவன் அவற்றைச் சாப்பிட்டான்; அவனுக்கு உயிர் திரும்பியது[b]. ஏனெனில், அவன் மூன்று நாட்களும் மூன்று இரவுகளும் அப்பம் சாப்பிடாமலும் தண்ணீர் குடிக்காமலும் இருந்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இரண்டு உலர்திராட்சை அடைகள்.”
    reason: lexical_alternative
  - marker: b
    text: அதாவது, அவன் புத்துயிர் பெற்றான் அல்லது அவனுடைய வலிமை திரும்பியது; சொல்லர்த்தமாக, “அவனுடைய உயிர் அவனிடம் திரும்பியது.”
    reason: lexical_alternative
lexical_decisions:
- source_word: פֶלַח דְּבֵלָה
  choice: அத்திப்பழ அடையின் ஒரு துண்டு
  rationale: פֶלַח என்பது துண்டைச் சுட்டுகிறது; דְּבֵלָה என்பது அத்திப்பழங்களை அழுத்திச் செய்யப்பட்ட அடை. இயல்பான தமிழில் பழங்கால உணவுப் பொருளைத் தெளிவாகக் காட்டுகிறது.
- source_word: שְׁנֵי צִמֻּקִים
  choice: இரண்டு திராட்சை வற்றல் திரள்கள்
  rationale: צִמֻּקִים என்பது உலர்ந்த திராட்சைகளைக் குறிக்கிறது; எண்ணப்பட்ட இரண்டு அலகுகள் எவ்வகையில் அமைந்திருந்தன என்பது உறுதியல்ல. ஆகவே ‘திரள்கள்’ என மொழிபெயர்த்து, ‘அடைகள்’ என்ற சாத்தியத்தை அடிக்குறிப்பில் தருகிறது.
- source_word: וַתָּשָׁב רוּחוֹ אֵלָיו
  choice: அவனுடைய உயிர் அவனுக்குத் திரும்பியது
  rationale: எபிரெய உருவகத்தை இயன்றவரை காக்கிறது. சூழலில் இது அவன் புத்துயிர் அல்லது வலிமை பெற்றதைக் குறிக்கலாம்; அந்த விளக்கம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: לֶחֶם
  choice: உணவு
  rationale: לֶחֶם என்பதன் அடிப்படைப் பொருள் ‘அப்பம்’ என்றாலும், இங்கு சாப்பிடுதலைப் பொதுவாகக் குறிக்கும் வாய்ப்பு உள்ளது. நவீன தமிழில் ‘உணவு சாப்பிடாமல்’ என்பது இயல்பாகவும் சூழலுக்குப் பொருத்தமாகவும் உள்ளது.
- source_word: שָׁתָה מַיִם
  choice: தண்ணீர் குடிக்காமல்
  rationale: மூலத்தின் குறிப்பான ‘தண்ணீர் குடித்தல்’ என்ற கருத்தை நேரடியாகப் பேணுகிறது.
- source_word: שְׁלֹשָׁה יָמִים וּשְׁלֹשָׁה לֵילוֹת
  choice: மூன்று பகலும் மூன்று இரவும்
  rationale: கால அளவைக் குறிக்கும் எபிரெய இணையை இயல்பான தமிழ் மரபில் நேரடியாக வழங்குகிறது.
theological_decisions:
- issue: רוּחַ என்ற சொல்லின் பொருள்
  choice: உயிர்
  alternative: ஆவி; வலிமை; அவன் புத்துயிர் பெற்றான்
  rationale: இங்கு பசி மற்றும் தாகத்தால் தளர்ந்த மனிதன் மீண்டு வருவதே சூழல். ‘உயிர் திரும்பியது’ மூல உருவகத்தையும் அதன் உடல் சார்ந்த சூழலையும் பேணுகிறது; தனிப்பட்ட தத்துவ அல்லது சமயக் கருத்தைத் திணிப்பதில்லை.
translation_notes:
  register: நவீன பொதுத்தரத் தமிழ்; எளிமையான, கண்ணியமான உரைநடை. பழங்கால உணவுப் பொருளுக்கு ‘அத்திப்பழ அடை’ என்றும், உறுதியற்ற திராட்சை வற்றல் அலகுக்கு ‘திரள்’ என்றும் பயன்படுத்தப்பட்டுள்ளது. எல்லா அடிக்குறிப்பு குறிகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
