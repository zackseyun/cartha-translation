source:
  edition: WLC
  text: וַ/יָּבֹ֤א דָוִד֙ אֶל צִ֣קְלַ֔ג וַ/יְשַׁלַּ֧ח מֵֽ/הַ/שָּׁלָ֛ל לְ/זִקְנֵ֥י יְהוּדָ֖ה לְ/רֵעֵ֣/הוּ לֵ/אמֹ֑ר הִנֵּ֤ה לָ/כֶם֙ בְּרָכָ֔ה מִ/שְּׁלַ֖ל אֹיְבֵ֥י יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/026.yaml
  text: When David came to Ziklag[a], he sent some of the plunder to the elders of Judah, his friends, saying, “Look, here is a gift for you from the plunder of the enemies of Yahweh.”
translation:
  language: ta
  text: தாவீது சிக்லாகுக்கு வந்தபோது, கொள்ளைப்பொருளில் ஒரு பகுதியை யூதாவின் மூப்பர்களான தன் நண்பர்களுக்கு அனுப்பி, “இதோ, யாவேயின் பகைவர்களின் கொள்ளைப்பொருளிலிருந்து உங்களுக்கான ஒரு பரிசு[a]” என்று கூறினான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஆசீர்வாதம்.” எபிரேயச் சொல் பொதுவாக “ஆசீர்வாதம்” எனப் பொருள்படும்; இங்கு கொள்ளைப்பொருளிலிருந்து அனுப்பப்பட்ட பொருள்சார் பரிசைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: வந்தபோது
  rationale: தொடர்ந்து வரும் அனுப்பும் செயலுடன் தாவீதின் வருகையை இயல்பான காலத் தொடர்பில் இணைக்கிறது.
- source_word: צִקְלַג
  choice: சிக்லாக்
  rationale: இடப்பெயர் தமிழில் ஒலிபெயர்க்கப்பட்டது; வேற்றுமை உருபுடன் ‘சிக்லாகுக்கு’ என வருகிறது.
- source_word: וַיְשַׁלַּח מֵהַשָּׁלָל
  choice: கொள்ளைப்பொருளில் ஒரு பகுதியை ... அனுப்பி
  rationale: מִן மொத்தக் கொள்ளைப்பொருளிலிருந்து ஒரு பகுதி அனுப்பப்பட்டதைக் குறிக்கிறது; ‘கொள்ளைப்பொருள்’ போரில் கைப்பற்றிய பொருட்கள் என்ற பொருளைத் தெளிவாக வழங்குகிறது.
- source_word: לְזִקְנֵי יְהוּדָה
  choice: யூதாவின் மூப்பர்களுக்கு
  rationale: இங்கு ‘மூப்பர்கள்’ என்பது யூதாவிலிருந்த அங்கீகரிக்கப்பட்ட தலைவர்களைக் குறிக்கிறது.
- source_word: לְרֵעֵהוּ
  choice: தன் நண்பர்களுக்கு
  rationale: רֵעַ என்பதன் உறவுசார் பொருளை இச்சூழலில் இயல்பாகக் காட்டுகிறது; ‘தோழர்கள்’ அல்லது ‘அயலார்’ என்பதும் சாத்தியம்.
- source_word: הִנֵּה לָכֶם
  choice: இதோ ... உங்களுக்கு
  rationale: הִנֵּה-யின் கவனத்தை ஈர்க்கும், சுட்டிக்காட்டும் வலிமையை நவீன தமிழில் இயல்பாகப் பாதுகாக்கிறது.
- source_word: בְּרָכָה
  choice: ஒரு பரிசு
  rationale: சொல்லின் அடிப்படைப் பொருள் ‘ஆசீர்வாதம்’; ஆனால் இங்கு கொள்ளைப்பொருளிலிருந்து அனுப்பப்பட்ட பொருள்சார் அன்பளிப்பைக் குறிக்கிறது. சொற்பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: מִשְּׁלַל
  choice: கைப்பற்றிய கொள்ளைப்பொருளிலிருந்து
  rationale: இராணுவ வெற்றியில் பெற்ற பொருட்கள் என்பதைக் காட்டுகிறது; ‘கைப்பற்றிய’ என்பது பகைவர்களுடனான தொடர்பைத் தமிழில் தெளிவாக்குகிறது.
- source_word: אֹיְבֵי יְהוָה
  choice: யெகோவாவின் பகைவர்கள்
  rationale: எபிரேய இணைப்புத் தொடரின் உடைமை/உறவுப் பொருளை நேரடியாகப் பாதுகாக்கிறது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: திருப்பெயரான יהוה-ஐ ஒரு பொதுப் பட்டத்தால் மாற்றாமல், தமிழில் பரவலாக அறியப்பட்ட தனிப்பெயர் வடிவில் வழங்குகிறது.
theological_decisions:
- issue: יהוה என்ற திருப்பெயரை எவ்வாறு வழங்குவது
  choice: யெகோவா
  alternative: கர்த்தர்; யாஹ்வே
  rationale: மூலத்தில் தனிப்பெயர் நேரடியாக இருப்பதால் அதை ‘கர்த்தர்’ என்ற பட்டமாக மாற்றவில்லை. நவீன தமிழ் வேதாகமப் பயன்பாட்டில் அறியப்பட்ட ‘யெகோவா’ வடிவம் தேர்ந்தெடுக்கப்பட்டது; ‘யாஹ்வே’ என்பது மாற்று ஒலிபெயர்ப்பு.
- issue: בְּרָכָה என்பதைக் ‘ஆசீர்வாதம்’ என்றா ‘பரிசு’ என்றா மொழிபெயர்ப்பது
  choice: பரிசு
  alternative: ஆசீர்வாதம்
  rationale: உடனடிச் சூழலில் தாவீது கொள்ளைப்பொருளிலிருந்து பொருட்களை அனுப்புகிறான்; எனவே பொருள்சார் குறிப்பை ‘பரிசு’ தெளிவாக வெளிப்படுத்துகிறது. எபிரேயச் சொல்லின் இறையியல் ஒலிநயம் அடிக்குறிப்பில் வைக்கப்படுகிறது.
translation_notes:
  register: நவீன, தெளிவான, கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘இதோ’ என்பது הִנֵּה-யின் வலிமையைப் பாதுகாக்கிறது; பழமையான நடையைத் தவிர்க்கிறது. ‘யூதாவின் மூப்பர்களாகிய தன் நண்பர்கள்’ என்பது மூப்பர்களே நண்பர்கள் என்ற இயல்பான தொடர்பைத் தெளிவாக்குகிறது.
