base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/007.yaml
  text: Then David said to Abiathar the priest[a], the son of Ahimelech[b], “Please bring me the ephod.” So Abiathar brought the ephod to David.
translation:
  language: ta
  text: அப்போது தாவீது, அகிமெலேக்கின் மகனான ஆசாரியர் அபியத்தாரிடம், “தயவுசெய்து ஏபோத்தை என்னிடம் கொண்டு வாருங்கள்[a]” என்றார். அபியத்தார் ஏபோத்தை[b] தாவீதிடம் கொண்டுவந்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘ஏபோத்தை என்னிடம் முன்வையுங்கள்.’ எபிரெய வினைச்சொல்லுக்கு ‘அருகில் கொண்டுவருதல்’ அல்லது ‘முன்வைத்தல்’ என்ற பொருள் உண்டு.
    reason: lexical_alternative
  - marker: b
    text: ‘ஏபோத்’ என்பது இஸ்ரவேலரின் வழிபாட்டில் பயன்படுத்தப்பட்ட ஆசாரியப் புனிதப் பொருள் அல்லது உடை.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: அப்போது ... என்றார்
  rationale: வாவ் தொடர் வடிவம் கதையின் அடுத்த நிகழ்வை முன்னெடுக்கிறது; ‘அப்போது’ இயல்பான தமிழ் கதைநடையில் நிகழ்வுகளின் வரிசையைத் தெளிவாக்குகிறது.
- source_word: הַכֹּהֵן
  choice: ஆசாரியர்
  rationale: அபியத்தாரின் சமயப் பணியைச் சுட்டும் உறுதியான பட்டப்பெயர்; தமிழ் வேதாகம வழக்கிலும் பொதுப் புரிதலிலும் நிலைபெற்ற சொல்.
- source_word: בֶּן אֲחִימֶלֶךְ
  choice: அகிமெலேக்கின் மகனான
  rationale: எபிரெயக் கட்டமைப்பு வம்ச உறவைக் குறிக்கிறது; தமிழில் பெயருடன் இயல்பாக இணையும் வகையில் பெயரெச்சத் தொடராக வழங்கப்பட்டுள்ளது.
- source_word: הַגִּישָׁה נָּא לִי
  choice: தயவுசெய்து ... என்னிடம் கொண்டுவாரும்
  rationale: נגשׁ என்பதன் ஹிஃபில் கட்டளை வடிவம் ‘அருகில் கொண்டுவருதல்/முன்வைத்தல்’ எனப் பொருள்படும்; נָא கூறும் பணிவை ‘தயவுசெய்து’ வெளிப்படுத்துகிறது.
- source_word: הָאֵפֹד
  choice: ஏபோத்தை
  rationale: இஸ்ரவேலரின் ஆசாரிய வழிபாட்டோடு தொடர்புடைய தனித்துவமான பொருள் அல்லது உடையைக் குறிக்கும் சொல்லுக்கு துல்லியமான தமிழ் இணை இல்லாததால் ஒலிபெயர்ப்பு பயன்படுத்தப்பட்டுள்ளது.
- source_word: וַיַּגֵּשׁ
  choice: கொண்டுவந்தார்
  rationale: அதே נגשׁ வேர்ச்சொல் கட்டளைக்குக் கீழ்ப்படிந்து பொருளைத் தாவீதிடம் கொண்டுவந்த செயலை இச்சூழலில் இயல்பாகக் குறிக்கிறது.
- source_word: אֶל דָּוִד
  choice: தாவீதிடம்
  rationale: தாவீதை நோக்கிய நகர்வைத் தமிழில் இயல்பாகவும் நேரடியாகவும் தெரிவிக்கிறது.
theological_decisions:
- issue: אֵפוֹד என்பதை ஆசாரிய விசாரணையோடு தொடர்புடைய வழிபாட்டுப் பொருளாக மொழிபெயர்த்தல்
  choice: முதன்மை உரையில் ‘ஏபோத்’ என்ற ஒலிபெயர்ப்பைத் தக்கவைத்தல்
  alternative: ‘ஆசாரிய உடை’ அல்லது ‘புனித உடை’ என்று விளக்கமாக மொழிபெயர்த்தல்
  rationale: இச்சொல் குறிப்பிட்ட இஸ்ரவேலிய ஆசாரியப் பொருள் அல்லது உடையைக் குறிக்கிறது; அடுத்த வசனத்தில் இறை வழிகாட்டுதலை நாடுவதுடன் இது தொடர்புடையதாக இருந்தாலும், இவ்வசனம் அதன் வடிவத்தையோ செயலையோ துல்லியமாக வரையறுக்கவில்லை. ஒலிபெயர்ப்பு தேவையற்ற மிகை விளக்கத்தைத் தவிர்த்து உரையின் வரலாற்று-சமயத் தன்மையையும் பொருளின் ஓரளவு தெளிவின்மையையும் காக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பான, கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘கொண்டுவாரும்’ என்பது பணிவையும் மரியாதையையும் காக்கும் இலக்கியப் பொதுநடை; ‘ஏபோத்’ வரலாற்று-சமயச் சொல்லாக ஒலிபெயர்க்கப்பட்டுள்ளது. அடிக்குறிப்பு குறிகள் அவை விளக்கும் சொற்றொடர்களுக்குப் பின்னரே வைக்கப்பட்டுள்ளன.
