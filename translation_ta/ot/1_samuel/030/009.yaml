source:
  edition: WLC
  text: וַ/יֵּ֣לֶךְ דָּוִ֗ד ה֚וּא וְ/שֵׁשׁ מֵא֥וֹת אִישׁ֙ אֲשֶׁ֣ר אִתּ֔/וֹ וַ/יָּבֹ֖אוּ עַד נַ֣חַל הַ/בְּשׂ֑וֹר וְ/הַ/נּֽוֹתָרִ֖ים עָמָֽדוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/009.yaml
  text: So David went[a], he and the six hundred men who were with him, and they came to the Brook Besor[b], where those who were left behind stayed.
translation:
  language: ta
  text: தாவீதும் அவரோடு இருந்த அறுநூறு ஆண்களும் புறப்பட்டு, பெசோர் ஓடை[a] வரை வந்தார்கள்; மீதமிருந்தவர்கள் தங்கினார்கள்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘பெசோர் ஓடை’ என்பதை ‘பெசோர் வறண்ட ஆற்றுப்படுகை’ என்றும் மொழிபெயர்க்கலாம்; இது பருவகாலத்தில் மட்டும் நீர் ஓடும் ஓடை அல்லது பள்ளத்தாக்கைக் குறிக்கலாம்.
    reason: cultural_note
  - marker: b
    text: ‘மீதமிருந்தவர்கள் நின்றார்கள்’ என்றும் மொழிபெயர்க்கலாம்; சொல்லுக்குச் சொல், ‘மீதமிருந்தவர்கள் நின்றார்கள்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: புறப்பட்டு
  rationale: הלך என்பதன் தொடர்கதை வடிவம் நிகழ்வை முன்னெடுத்துச் செல்கிறது. இங்கு பயணத்தைத் தொடங்கித் தொடர்ந்து சென்றதைக் குறிக்க இயல்பான தமிழில் ‘புறப்பட்டு’ என்று மொழிபெயர்க்கப்பட்டது.
- source_word: הוּא וְשֵׁשׁ מֵאוֹת אִישׁ אֲשֶׁר אִתּוֹ
  choice: தாவீதும் அவரோடு இருந்த அறுநூறு ஆண்களும்
  rationale: தாவீதையும் அவருடன் சென்ற அறுநூறு ஆண் போர்வீரர்களையும் இணைத்துக் காட்டும் எபிரெய அமைப்பை இயல்பான தமிழில் பாதுகாக்கிறது.
- source_word: וַיָּבֹאוּ עַד
  choice: வரை வந்தார்கள்
  rationale: பன்மை வினைச்சொல் தாவீதையும் அவருடைய ஆட்களையும் குறிக்கிறது; עַד இலக்கை அல்லது எல்லையைச் சுட்டுவதால் ‘வரை’ பயன்படுத்தப்பட்டது.
- source_word: נַחַל הַבְּשׂוֹר
  choice: பெசோர் ஓடை
  rationale: נַחַל என்பது ஓடை, பருவகால நீரோடை அல்லது பள்ளத்தாக்கு போன்ற பொருள்களைக் கொள்ளலாம். பொதுவாசகர்களுக்கு எளிதாகவும் பெயரிடப்பட்ட நீர்வழியைக் குறிக்கவும் ‘பெசோர் ஓடை’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: וְהַנּוֹתָרִים
  choice: மீதமிருந்தவர்கள்
  rationale: נותר என்பதன் பங்கேற்பு வடிவம் தொடர்ந்து செல்லாமல் எஞ்சியவர்களைக் குறிக்கிறது. அடுத்த வசனத்தின் தகவலை தேவையின்றி இங்கே சேர்க்காமல் மூலத்தின் சுருக்கம் காக்கப்பட்டது.
- source_word: עָמָדוּ
  choice: அங்கே தங்கினார்கள்
  rationale: עמד என்பதன் அடிப்படைப் பொருள் ‘நின்றார்கள்’ என்றாலும், பயணச் சூழலில் ஓரிடத்தில் நின்று அங்கேயே தங்கியதைக் குறிக்கிறது. தமிழில் பொருளைத் தெளிவாக்க ‘தங்கினார்கள்’ என்றும், சூழல் குறிக்கும் இடத்தை வெளிப்படுத்த ‘அங்கே’ என்றும் தரப்பட்டது.
