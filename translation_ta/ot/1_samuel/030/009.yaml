translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் இயல்பான ஆனால் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. எபிரெய தொடர்கதை ஓட்டமும் இறுதிக் கூற்றின் சுருக்கமும் காக்கப்பட்டுள்ளன; ‘ஓடை’ மற்றும் ‘தங்கினார்கள்’ என்பவற்றின் பொருள் விரிவு அடிக்குறிப்புகளில் தரப்பட்டுள்ளது.
