  source_fidelity: 'The Tamil accurately represents the Hebrew sequence and sense: David and the people with him raised their voice(s) and wept, continuing until they had no strength to weep. It retains the Hebrew repetition of the verb for weeping and does not narrow הָעָם (''the people'') to soldiers or men.'
