base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/004.yaml
  text: Then David and the people who were with him raised their voices and wept until they had no strength left to weep[a].
translation:
  language: ta
  text: அப்போது தாவீதும் அவரோடு இருந்த மக்களும் குரலெடுத்து அழுதார்கள்[a]; அழுவதற்கு அவர்களிடம் வலிமையே இல்லாமல் போகும்வரை அழுதார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொல்லர்த்தமாக, “தங்கள் குரலை உயர்த்தி அழுதார்கள்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׂא ... אֶת־קוֹלָם
  choice: குரலெடுத்து
  rationale: ‘குரலை உயர்த்துதல்’ என்ற எபிரெய மரபுத்தொடர் உரத்த குரலில் அழுததைக் குறிக்கிறது. ‘குரலெடுத்து’ என்பது அதன் வலிமையைக் காக்கும் இயல்பான நவீனத் தமிழ் வழக்கு.
- source_word: הָעָם אֲשֶׁר אִתּוֹ
  choice: அவரோடு இருந்த மக்கள்
  rationale: சூழலில் இவர்கள் தாவீதின் போர்வீரர்கள் என்றாலும், மூலத்தில் உள்ள עָם பொதுவாக ‘மக்கள்’ என்கிறது; ஆகவே மூலத்தின் பரந்த சொல்லாட்சியே காக்கப்பட்டுள்ளது.
- source_word: וַיִּבְכּוּ / לִבְכּוֹת
  choice: அழுதார்கள் / அழுவதற்கு
  rationale: בכה என்பதன் பொருள் அழுதல் அல்லது கண்ணீர்விடுதல். இரு இடங்களிலும் ‘அழு’ என்பதைப் பயன்படுத்துவது மூலத்தின் சொல் மறுபயன்பாட்டையும் துயரத்தின் தீவிரத்தையும் காக்கிறது.
- source_word: עַד אֲשֶׁר אֵין בָּהֶם כֹּחַ
  choice: அவர்களிடம் வலிமையே இல்லாமல் போகும்வரை
  rationale: முற்றிலும் சோர்ந்துபோன நிலையைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது. ‘வலிமையே’ என்பதில் உள்ள வலியுறுத்தல் אֵין ... כֹּחַ என்பதன் முழுமையான வலிமையின்மையை வெளிப்படுத்துகிறது.
theological_decisions: []
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும், துயரமான வரலாற்றுக் கதையாடலுக்கேற்ற கண்ணியமான நடையிலும் மொழிபெயர்க்கப்பட்டுள்ளது. மூலத்தின் ‘அழுதல்’ என்ற மறுபயன்பாடும் முழுமையான உடல் சோர்வும் பாதுகாக்கப்பட்டுள்ளன.
