base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/025.yaml
  text: 'And it was so from that day onward: he made it a statute and an ordinance for Israel to this day[a].'
translation:
  language: ta
  text: அந்த நாள்முதல் அவ்வாறே இருந்து வந்தது. தாவீது அதை இஸ்ரவேலுக்கு ஒரு சட்டமாகவும் நியமமாகவும் ஏற்படுத்தினார்; இந்நாள்வரை அப்படியே இருந்து வந்தது.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தாவீது அதை இஸ்ரவேலுக்கு ஒரு சட்டமாகவும் தீர்ப்பாகவும் நிறுவினார்; இந்நாள்வரை அப்படியே இருந்து வந்தது.”
    reason: מִשְׁפָּט என்பதற்கு ‘நியமம்’ என்பதோடு ‘தீர்ப்பு’ என்றும் பொருள் கொள்ளலாம்; שׂים என்பதையும் ‘நிறுவினார்’ என்று மொழிபெயர்க்கலாம்.
lexical_decisions:
- source_word: וַיְהִי
  choice: அவ்வாறே நடைமுறைக்கு வந்தது
  rationale: இச்சொற்றொடர் ஒரு நிகழ்வு நடந்ததை மட்டும் அல்லாமல், முன் கூறப்பட்ட நடைமுறை தொடர்ந்து அமலுக்கு வந்ததையும் சூழலில் குறிக்கிறது.
- source_word: מֵהַיּוֹם הַהוּא וָמָעְלָה
  choice: அந்த நாள்முதல்
  rationale: குறிப்பிட்ட நாளிலிருந்து முன்னோக்கித் தொடர்வதைக் குறிக்கும் எபிரெய காலச்சொற்றொடரை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: וַיְשִׂמֶהָ
  choice: தாவீது அதை ... ஏற்படுத்தினார்
  rationale: שׂים என்பதன் ‘வைத்தல், நிறுவுதல், ஏற்படுத்துதல்’ என்ற பொருள்களில், கட்டுப்படுத்தும் வழக்கை நிலைநாட்டிய சூழலுக்கு ‘ஏற்படுத்தினார்’ பொருந்துகிறது. சுற்றியுள்ள உரையிலிருந்து எழுவாய் தாவீது என்பது தெளிவாகச் சொல்லப்பட்டுள்ளது.
- source_word: לְחֹק
  choice: ஒரு சட்டமாக
  rationale: חֹק என்பது நிர்ணயிக்கப்பட்ட, அதிகாரபூர்வமான விதியைக் குறிக்கிறது; ‘சட்டம்’ அதன் கட்டுப்படுத்தும் தன்மையைத் தக்கவைக்கிறது.
- source_word: וּלְמִשְׁפָּט
  choice: நியமமாகவும்
  rationale: מִשְׁפָּט என்பதற்கு தீர்ப்பு, நீதி, சட்டமுறை, நியமம் ஆகிய பொருள்கள் உண்டு. חֹק உடன் இணையும் இச்சூழலில் நிலைநாட்டப்பட்ட ஒழுங்கு அல்லது கட்டுப்பாட்டு நெறி என்ற பொருளை ‘நியமம்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: לְיִשְׂרָאֵל
  choice: இஸ்ரவேலுக்கான
  rationale: இந்த விதி யாருக்குப் பொருந்துகிறது என்பதைக் குறிக்கும் לְ முன்னிடைச்சொல்லின் பயனைத் தெளிவாகத் தருகிறது.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: அது இந்நாள்வரை நிலைத்திருக்கிறது
  rationale: கதைசொல்லியின் காலம்வரை அந்த நடைமுறை தொடர்ந்ததைத் தெளிவான தமிழில் தெரிவிக்கிறது; ‘இந்நாள்வரை’ என்ற எபிரெய மரபுத்தொடரின் நோக்கமும் காக்கப்படுகிறது.
