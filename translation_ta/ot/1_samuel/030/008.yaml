  edition: WLC
  text: וַ/יִּשְׁאַ֨ל דָּוִ֤ד בַּֽ/יהוָה֙ לֵ/אמֹ֔ר אֶרְדֹּ֛ף אַחֲרֵ֥י הַ/גְּדוּד הַ/זֶּ֖ה הַֽ/אַשִּׂגֶ֑/נּוּ וַ/יֹּ֤אמֶר ל/וֹ֙ רְדֹ֔ף כִּֽי הַשֵּׂ֥ג תַּשִּׂ֖יג וְ/הַצֵּ֥ל תַּצִּֽיל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/008.yaml
  text: And David inquired of the LORD, saying, “Should I pursue this raiding party? Will I overtake them?” And he said to him, “Pursue, for you will surely overtake them, and you will surely rescue.”
translation:
  language: ta
  text: தாவீது ஆண்டவரிடம் விசாரித்து, “இந்தக் கொள்ளைக்கூட்டத்தைத் துரத்திச் செல்லவா? அவர்களைப் பிடித்துவிடுவேனா?” என்று கேட்டான். அவர் அவனிடம், “துரத்திச் செல்; நீ நிச்சயமாக அவர்களைப் பிடிப்பாய்; நிச்சயமாக மீட்பாய்” என்றார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁאַל ... בַּיהוָה
  choice: ஆண்டவரிடம் விசாரித்து
  rationale: இது வெறும் கேள்வி கேட்பதைவிட, இறைவனின் வழிநடத்தலை நாடுவதைக் குறிக்கிறது; יהוה என்பதற்கு தமிழில் மரியாதையான வழக்கமான பிரதிநிதியாக ‘ஆண்டவர்’ பயன்படுத்தப்பட்டது.
- source_word: הַגְּדוּד
  choice: கொள்ளைக்கூட்டம்
  rationale: சூழலில் இது அமலேக்கியரின் தாக்குதல் நடத்தி கொள்ளையிட்ட படைக்குழுவைக் குறிக்கிறது; ‘படையணி’ என்பதைக் காட்டிலும் இங்கு செயலின் தன்மையைத் தெளிவாகக் காட்டுகிறது.
- source_word: הַאַשִּׂגֶנּוּ / הַשֵּׂג תַּשִּׂיג
  choice: அவர்களைப் பிடித்துவிடுவேனா? / நிச்சயமாக அவர்களைப் பிடித்து
  rationale: נשׂג என்பது துரத்திச் சென்று எட்டிப்பிடித்தல் அல்லது முந்திப்பிடித்தலைக் குறிக்கிறது. எபிரெய வினையெச்ச-வினை அமைப்பின் வலியுறுத்தல் ‘நிச்சயமாக’ என வெளிப்படுத்தப்பட்டது.
- source_word: וְהַצֵּל תַּצִּיל
  choice: நிச்சயமாக மீட்டுக்கொள்வாய்
  rationale: נצל இங்கு பிடித்துச் செல்லப்பட்ட மனிதர்களையும் பொருட்களையும் எதிரியின் கையிலிருந்து மீட்பதைக் குறிக்கிறது. எபிரெய வலியுறுத்தும் அமைப்பு ‘நிச்சயமாக’ என்று பாதுகாக்கப்பட்டது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: ஆண்டவர்
  alternative: யெகோவா / யாவே
  rationale: தமிழ் வேதாகம நடையில் பரவலாக அறியப்படும் மரியாதைமிக்க பிரதிநிதியைப் பயன்படுத்துகிறது; குறிப்பிட்ட உச்சரிப்பைத் திணிக்கவில்லை.
- issue: இறுதி வாக்குறுதியின் பொருள்
  choice: மீட்டுக்கொள்வாய்
  alternative: விடுவிப்பாய்
  rationale: சூழலில் சிறைபிடிக்கப்பட்டவர்களும் கொள்ளையிடப்பட்டவையும் மீண்டும் பெறப்படுவது அடங்குகிறது; ‘மீட்டுக்கொள்’ இந்த விரிவை இயல்பாகத் தக்கவைக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில், எளிமையும் கண்ணியமும் இணைந்த உரை. தாவீதின் இரண்டு கேள்விகளும் இறைவனின் இரட்டை உறுதிமொழியும் தெளிவாகப் பாதுகாக்கப்பட்டுள்ளன; எபிரெய வலியுறுத்தும் infinitive absolute அமைப்புகள் ‘நிச்சயமாக’ என மொழிபெயர்க்கப்பட்டுள்ளன.
