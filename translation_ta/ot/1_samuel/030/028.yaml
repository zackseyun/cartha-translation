translation:
  language: ta
  text: அரோவேரில் இருந்தவர்களுக்கும், சிப்மோத்தில் இருந்தவர்களுக்கும், எஷ்தெமோவாவில் இருந்தவர்களுக்கும்,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְלַאֲשֶׁר
  choice: இருந்தவர்களுக்கும்
  rationale: இணைப்புச்சொல், முன்னிடைச்சொல், தொடர்புத்துகள் ஆகியவை சேர்ந்த இந்தத் தொடர், இச்சூழலில் ஒவ்வொரு ஊரிலும் இருந்த பரிசுப் பெறுநர்களைக் குறிக்கிறது. தமிழில் இயல்பாகவும் மூலத்தின் மீளுரைப்பைத் தக்கவைத்தும் ‘இருந்தவர்களுக்கும்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: בַּעֲרֹעֵר
  choice: அரோவேரில்
  rationale: ஊர்ப்பெயர் ஒலிபெயர்க்கப்பட்டு, முன்னிடைச்சொல்லின் இடப்பொருள் ‘-இல்’ விகுதியால் வெளிப்படுத்தப்பட்டது.
- source_word: בְּשִׂפְמוֹת
  choice: சிப்மோத்தில்
  rationale: ஊர்ப்பெயர் ஒலிபெயர்க்கப்பட்டு, முன்னிடைச்சொல்லின் இடப்பொருள் ‘-இல்’ விகுதியால் வெளிப்படுத்தப்பட்டது.
- source_word: בְּאֶשְׁתְּמֹעַ
  choice: எஷ்தெமோவாவில்
  rationale: ஊர்ப்பெயர் ஒலிபெயர்க்கப்பட்டு, முன்னிடைச்சொல்லின் இடப்பொருள் ‘-இல்’ விகுதியால் வெளிப்படுத்தப்பட்டது.
