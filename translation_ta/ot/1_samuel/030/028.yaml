translation_notes:
  register: நவீன தரத் தமிழில் இயல்பாக வாசிக்கும்படி அமைக்கப்பட்டுள்ளது. எபிரெய மூலத்தில் ஒவ்வொரு ஊருக்கும் முன் மீண்டும் வரும் וְלַאֲשֶׁר என்ற அமைப்பு, மூன்று முறையும் ‘இருந்தவர்களுக்கும்’ என்று வழங்கப்பட்டு அதன் பட்டியல் வலியுறுத்தல் பாதுகாக்கப்பட்டுள்ளது. வசனம் தொடரும் பட்டியலின் ஒரு பகுதியாக இருப்பதால் இறுதியில் காற்புள்ளி வைக்கப்பட்டுள்ளது.
