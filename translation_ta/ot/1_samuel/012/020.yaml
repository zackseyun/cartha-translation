  text: וַ/יֹּ֨אמֶר שְׁמוּאֵ֤ל אֶל הָ/עָם֙ אַל תִּירָ֔אוּ אַתֶּ֣ם עֲשִׂיתֶ֔ם אֵ֥ת כָּל הָ/רָעָ֖ה הַ/זֹּ֑את אַ֗ךְ אַל תָּס֨וּרוּ֙ מֵ/אַחֲרֵ֣י יְהוָ֔ה וַ/עֲבַדְתֶּ֥ם אֶת יְהוָ֖ה בְּ/כָל לְבַבְ/כֶֽם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/020.yaml
  text: And Samuel said to the people[a], “Do not be afraid. You have done all this evil. Yet do not turn aside from following Yahweh[b], but serve Yahweh with all your heart.”
translation:
  language: ta
  text: சாமுவேல் மக்களிடம், “அஞ்சாதீர்கள். நீங்கள் இந்த எல்லாத் தீமையையும் செய்திருக்கிறீர்கள். ஆனாலும், யாவேவைப் பின்பற்றுவதிலிருந்து விலகாதீர்கள்; உங்கள் முழு இருதயத்தோடும் யாவேவுக்குச் சேவை செய்யுங்கள்” என்றார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר שְׁמוּאֵל אֶל־הָעָם
  choice: சாமுவேல் மக்களிடம் ... என்றார்
  rationale: எபிரெயக் கதைநடையின் இயல்பான தொடர்ச்சியைத் தமிழில் தேவையற்ற இணைப்புச்சொல் இன்றி இயல்பாக வெளிப்படுத்துகிறது; הָעָם என்பது இங்கு கூடியிருந்த இஸ்ரவேல் மக்களைக் குறிக்கிறது.
- source_word: אַל־תִּירָאוּ
  choice: அஞ்சாதீர்கள்
  rationale: ירא வினையின் தடை ஆணையைச் சுருக்கமாகவும் கண்ணியமான நவீனத் தமிழிலும் தருகிறது.
- source_word: אַתֶּם עֲשִׂיתֶם אֵת כָּל־הָרָעָה הַזֹּאת
  choice: நீங்கள் இந்தத் தீமை அனைத்தையும் செய்திருக்கிறீர்கள்
  rationale: வலியுறுத்தப்பட்ட אַתֶּם என்பதற்காக ‘நீங்கள்’ வெளிப்படையாக வைக்கப்பட்டுள்ளது; רָעָה என்பதன் அறநெறிசார் தீவிரத்தை ‘தீமை’ காக்கிறது; நிறைவேறிய செயலின் தற்போதைய தொடர்பை ‘செய்திருக்கிறீர்கள்’ உணர்த்துகிறது.
- source_word: אַךְ
  choice: ஆனாலும்
  rationale: முன்னைய பாவ ஒப்புதலுக்குப் பின் வரும் வலுவான எதிர்மறை-விட்டுக்கொடுப்பு திருப்பத்தை இயல்பாகக் காட்டுகிறது.
- source_word: אַל־תָּסוּרוּ מֵאַחֲרֵי יְהוָה
  choice: யெகோவாவைப் பின்பற்றுவதிலிருந்து விலகாதீர்கள்
  rationale: ‘யெகோவாவின் பின்னிருந்து விலகுதல்’ என்ற எபிரெய மொழிமரபின் பின்பற்றுதல் சார்ந்த உருவகத்தைத் தமிழில் தெளிவாகக் காக்கிறது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: நான்கெழுத்துத் திருப்பெயரை ஒரு பட்டப்பெயரால் மாற்றாமல், தமிழில் பரவலாக அறியப்படும் தனிப்பெயர் வடிவில் தருகிறது.
- source_word: וַעֲבַדְתֶּם אֶת־יְהוָה
  choice: யெகோவாவுக்குச் சேவை செய்யுங்கள்
  rationale: עבד என்பதன் உடன்படிக்கைச் சூழலிலான விரிவான ‘சேவை செய்’ பொருளைக் காக்கிறது; அதை ‘வழிபடு’ என்று மட்டும் சுருக்கவில்லை. எதிர்மறை கட்டளைக்குப் பின் நேர்மறை கட்டளையாகத் தமிழில் இயல்பாக அமைகிறது.
- source_word: בְּכָל־לְבַבְכֶם
  choice: உங்கள் முழு இருதயத்தோடும்
  rationale: முழுமையான உள்ளார்ந்த அர்ப்பணிப்பையும் விசுவாசத்தையும் குறிக்கும் எபிரெய மொழிமரபை கண்ணியமான வேதாகமத் தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரின் மொழிபெயர்ப்பு
  choice: யெகோவா
  alternative: கர்த்தர் / யாவே
  rationale: மூலத்தில் பட்டப்பெயர் அல்லாமல் இறைவனின் தனிப்பெயர் நேரடியாக உள்ளது. அதைத் தமிழில் பரவலாக அறியப்படும் தனிப்பெயர் வடிவில் காப்பது மூலத்தின் வேறுபாட்டைப் பேணுகிறது; குறிப்பிட்ட சமயப் பிரிவின் விளக்கத்தைச் சேர்ப்பதில்லை.
- issue: רָעָה என்பதன் அறநெறிசார் வலிமை
  choice: தீமை
  alternative: தவறு / பொல்லாப்பு
  rationale: மக்களின் செயலை வெறும் பிழையாக மென்மைப்படுத்தாமல், மூலத்தின் அறநெறிசார் கண்டனத்தை ‘தீமை’ நேரடியாகக் காக்கிறது.
- issue: וַעֲבַדְתֶּם என்பதன் கட்டளைத் தன்மை
  choice: சேவை செய்யுங்கள்
  alternative: சேவை செய்வீர்கள் / வழிபடுங்கள்
  rationale: முன்னுள்ள தடை ஆணைக்கு இணையான நேர்மறை அறிவுறுத்தலாகச் சூழல் இதைக் காட்டுகிறது. ‘சேவை’ என்பது வழிபாட்டையும் உடன்படிக்கை விசுவாசத்தையும் உள்ளடக்கக்கூடியதால் பொருளைச் சுருக்காது.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்கள் புரிந்துகொள்ளும் வகையில் இயல்பான வாக்கிய அமைப்பு, அதேவேளை வேதாகம உரைக்கு ஏற்ற கண்ணியமான நடை. ‘இருதயம்’ என்பது இச்சூழலில் உணர்ச்சி மட்டும் அல்லாமல் முழு உள்ளார்ந்த மனநிலை மற்றும் அர்ப்பணிப்பைக் குறிக்கும் மரபுச் சொல். உரையில் அடிக்குறிப்புகள் இல்லாததால் குறியீடுகள் சேர்க்கப்படவில்லை.
