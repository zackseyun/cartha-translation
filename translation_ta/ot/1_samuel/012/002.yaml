base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/002.yaml
  text: And now[a], look, the king is walking before you, and I have grown old and gray, and here are my sons with you[c][b]. And I have walked before you from my youth until this day.
translation:
  language: ta
  text: இப்போதோ, பாருங்கள், அரசன் உங்கள் முன்னே நடந்துகொண்டிருக்கிறார்[a]. நானோ முதுமையடைந்து நரைத்துவிட்டேன்[b]; இதோ, என் மகன்கள் உங்களோடு இருக்கிறார்கள். நான் என் இளமை முதல் இந்நாள்வரை உங்கள் முன்னே நடந்துவந்திருக்கிறேன்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அரசன் உங்கள் முன்னே செல்கிறார்,” அல்லது “அரசன் உங்களை வழிநடத்துகிறார்.” “முன்னே நடப்பது” என்ற எபிரேய மரபுத்தொடர் பொதுத் தலைமையைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “நான் முதுமையடைந்து நரைமுடியுள்ளவனாகிவிட்டேன்.”
    reason: lexical_alternative
  - marker: c
    text: அல்லது, “நான் உங்கள் முன்னே சென்றுவந்தேன்,” அல்லது “நான் உங்களை வழிநடத்திவந்தேன்.” அரசனின் பொதுப் பங்கையும் தமது பொதுப் பங்கையும் சாமுவேல் ஒரே சொல்லாட்சியால் இணைத்துக் காட்டுகிறார்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: இப்போது
  rationale: சாமுவேல் தற்போதைய நிலையைச் சுட்டி தனது வேண்டுகோளைத் தொடங்கும் உரையாடல் அடையாளமாக இயல்பாக அமைகிறது; தமிழில் தனியான இணைப்புச்சொல் அவசியமில்லை.
- source_word: הִנֵּה
  choice: பாருங்கள்
  rationale: கவனத்தை ஈர்க்கும் எபிரேயச் சொல்லின் சுட்டும் வலிமையை, பழமையான நடையின்றி நவீன மரியாதைமிக்க தமிழில் வெளிப்படுத்துகிறது.
- source_word: הַמֶּלֶךְ
  choice: அரசன்
  rationale: புதிதாக ஏற்படுத்தப்பட்ட, குறிப்பிட்ட அரசனைக் குறிக்கும் திட்டமான பெயர்ச்சொல்.
- source_word: מִתְהַלֵּךְ לִפְנֵיכֶם
  choice: உங்கள் முன்னே நடந்துகொண்டிருக்கிறார்
  rationale: Hitpael நிகழ்காலப் பங்கேற்புவினையின் தொடர்நிலையையும் ‘உங்கள் முன்னே’ என்ற உருவகத்தையும் காக்கிறது; பொதுத் தலைமையின் உட்கருத்தை நேரடியாகத் தீர்மானிப்பதில்லை.
- source_word: זָקַנְתִּי וָשַׂבְתִּי
  choice: முதுமையடைந்து நரைத்துவிட்டேன்
  rationale: அடைந்த நிலையைக் குறிக்கும் இரு வினைகளையும் இயல்பான தமிழில் வேறுபடுத்திக் காக்கிறது.
- source_word: וּבָנַי הִנָּם אִתְּכֶם
  choice: இதோ, என் மகன்கள் உங்களோடு இருக்கிறார்கள்
  rationale: הִנָּם என்பதன் முன்வைக்கும் வலிமையை ‘இதோ’ என்பதன் மூலம் வெளிப்படுத்துகிறது.
- source_word: הִתְהַלַּכְתִּי לִפְנֵיכֶם
  choice: உங்கள் முன்னே நடந்துவந்திருக்கிறேன்
  rationale: அரசனைப் பற்றிய முந்தைய சொற்றொடருடன் வேண்டுமென்றே அமைந்த இணைப்பைத் தக்கவைக்கிறது; நீண்டகாலத் தொடர்ச்சியை ‘நடந்துவந்திருக்கிறேன்’ வெளிப்படுத்துகிறது.
- source_word: מִנְּעֻרַי עַד הַיּוֹם הַזֶּה
  choice: என் இளமை முதல் இந்நாள்வரை
  rationale: சாமுவேலின் இளமைக்காலம் தொடங்கி பேசும் நாள்வரை நீடித்த காலவரம்பைத் தெளிவாகக் காட்டுகிறது.
theological_decisions:
- issue: ‘உங்கள் முன்னே நடப்பது’ என்ற எபிரேய மரபுத்தொடரின் பொருள்
  choice: உருவகத்தை ‘உங்கள் முன்னே நடந்துகொண்டிருக்கிறார் / நடந்துவந்திருக்கிறேன்’ எனக் காத்தல்
  alternative: ‘உங்களை வழிநடத்துகிறார் / வழிநடத்திவந்தேன்’
  rationale: இது பொதுத் தலைமையைக் குறிக்கக்கூடும்; ஆயினும் அதை ‘வழிநடத்துதல்’ என்று மட்டும் முடிவுசெய்யாமல், அரசனுக்கும் சாமுவேலுக்கும் இடையிலான சொல்லாட்சிசார் இணைப்பையும் உண்மையான பொருள் விரிவையும் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும் மரியாதைமிக்க நடை. ‘இதோ’ என்பது இயல்பான முன்வைப்புச் சொல்லாக வைக்கப்பட்டுள்ளது. அரசனுக்கான ஒருமை மரியாதை வினைமுற்றும், மக்களுக்கான பன்மை இரண்டாம் நபரும் தெளிவாக வேறுபடுத்தப்பட்டுள்ளன.
