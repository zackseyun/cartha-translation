source:
  edition: WLC
  text: אִם תִּֽירְא֣וּ אֶת יְהוָ֗ה וַ/עֲבַדְתֶּ֤ם אֹת/וֹ֙ וּ/שְׁמַעְתֶּ֣ם בְּ/קֹל֔/וֹ וְ/לֹ֥א תַמְר֖וּ אֶת פִּ֣י יְהוָ֑ה וִ/הְיִתֶ֣ם גַּם אַתֶּ֗ם וְ/גַם הַ/מֶּ֨לֶךְ֙ אֲשֶׁ֣ר מָלַ֣ךְ עֲלֵי/כֶ֔ם אַחַ֖ר יְהוָ֥ה אֱלֹהֵי/כֶֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/014.yaml
  text: If you fear Yahweh and serve him and listen to his voice and do not rebel against the command of Yahweh[b][a], then both you and the king who reigns over you will follow Yahweh your God.
translation:
  language: ta
  text: நீங்கள் யாவேவுக்குப் பயந்து, அவருக்குப் பணிசெய்து, அவருடைய குரலுக்குச் செவிகொடுத்து[b], யாவேவின் கட்டளைக்கு எதிராகக் கலகம் செய்யாமல் இருந்தால், நீங்களும் உங்களை ஆளுகிற அரசனும் உங்கள் கடவுளாகிய யாவேவைப் பின்பற்றுவீர்கள்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொல்லுக்குச் சொல் முறையில், “நீங்களும் உங்களை ஆளுகிற அரசனும் உங்கள் கடவுளாகிய யாவேவுக்குப் பின்னால் இருப்பீர்கள்.” மக்கள் மற்றும் அரசன் இருவரும் யாவேக்கு உண்மையுள்ளவர்களாய் தொடர்ந்து அவரைப் பின்பற்றுவார்கள் என்பதே இதன் பொருளாக இருக்கலாம்.
    reason: alternative_reading
  - marker: b
    text: “அவருடைய குரலுக்குச் செவிகொடுத்து” என்பதை “அவருடைய குரலுக்குக் கீழ்ப்படிந்து” என்றும் புரிந்துகொள்ளலாம்; இந்த எபிரெயச் சொற்றொடர் பெரும்பாலும் கீழ்ப்படிந்து கேட்பதைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: இருந்தால்
  rationale: உடன்படிக்கை சார்ந்த நிபந்தனையை இயல்பான நவீனத் தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: תִּירְאוּ אֶת־יְהוָה
  choice: யெகோவாவுக்குப் பயந்து
  rationale: இறைவனை நோக்கிய அச்சமும் பயபக்தியும் அடங்கிய ירא என்பதன் கனத்தை ‘பயந்து’ காக்கிறது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: எபிரெய மெய்யெழுத்துப் பெயரான יהוה-ஐ ஒரு பட்டப்பெயரால் மாற்றாமல், தமிழில் வழக்கிலுள்ள தனிப்பெயர் வடிவில் தருகிறது.
- source_word: וַעֲבַדְתֶּם אֹתוֹ
  choice: அவருக்குப் பணிசெய்து
  rationale: עבד குறிக்கும் வழிபாடு உள்ளிட்ட முழுமையான சேவையை, ‘வழிபட்டு’ என்று குறுக்காமல் எடுத்துரைக்கிறது.
- source_word: וּשְׁמַעְתֶּם בְּקֹלוֹ
  choice: அவருடைய குரலுக்குச் செவிகொடுத்து
  rationale: சொல்லுக்குச் சொல் உருவகத்தைப் பேணுவதோடு, கீழ்ப்படிந்து கேட்கும் பொருளையும் இயல்பாக உணர்த்துகிறது.
- source_word: וְלֹא תַמְרוּ אֶת־פִּי יְהוָה
  choice: யெகோவாவின் கட்டளைக்கு எதிராகக் கலகம் செய்யாமல்
  rationale: ‘வாய்’ என்னும் எபிரெய மரபுத்தொடரைச் சூழலுக்கேற்ற ‘கட்டளை’ எனவும், מרה-ஐ சாதாரண கீழ்ப்படியாமையைவிட வலுவான ‘கலகம்’ எனவும் தருகிறது.
- source_word: גַּם אַתֶּם וְגַם הַמֶּלֶךְ
  choice: நீங்களும் ... அரசனும்
  rationale: இணையான גם ... וגם அமைப்பை இயல்பான தமிழ் இணைப்பால் பிரதிபலிக்கிறது.
- source_word: אֲשֶׁר מָלַךְ עֲלֵיכֶם
  choice: உங்களை ஆளுகிற
  rationale: தற்போது பதவியிலுள்ள அரசனைக் குறிக்கும் தொடர்புச் சொல்லை நவீனத் தமிழில் இயல்பாகத் தருகிறது.
- source_word: אַחַר יְהוָה אֱלֹהֵיכֶם
  choice: உங்கள் கடவுளாகிய யெகோவாவைப் பின்பற்றுவீர்கள்
  rationale: אַחַר இங்கு குறிக்கும் விசுவாசமான பின்பற்றுதலைத் தெளிவுபடுத்துகிறது; மூலத்தின் சற்றுக் கடினமான தொடரமைப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
theological_decisions:
- issue: இறுதி தொடரான וִהְיִתֶם ... אַחַר יְהוָה אֱלֹהֵיכֶם என்பதன் பொருள்
  choice: நிபந்தனையின் விளைவாக மக்களும் அரசனும் யெகோவாவைப் பின்பற்றுவார்கள் என மொழிபெயர்க்கப்பட்டது.
  alternative: சொல்லுக்குச் சொல் முறையில், ‘நீங்களும் ... அரசனும் உங்கள் கடவுளாகிய யெகோவாவுக்குப் பின்னால் இருப்பீர்கள்’ என்று பொருள் தெளிவுபடுத்தாமல் விடலாம்.
  rationale: ‘பின்பற்றுதல்’ என்பது אַחַר-ன் விசுவாச/பற்றுறுதி சார்ந்த பொருளை இயல்பான தமிழில் தருகிறது; ஆயினும் எபிரெய உரையின் இலக்கணக் கடினத்தன்மையும் உள்ளார்ந்த மறைபொருளும் அடிக்குறிப்பில் வெளிப்படையாகக் குறிப்பிடப்படுகின்றன.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான, பொதுமக்களுக்கு எளிதில் புரியும் தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘அரசன்’, ‘கலகம்’, ‘கட்டளை’, ‘செவிகொடுத்து’ போன்ற சொற்கள் வேதச் சூழலின் கனத்தைப் பேணுகின்றன; இறுதிக் கூறின் உண்மையான எபிரெயத் தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
