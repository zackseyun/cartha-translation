id: 1SA.12.10
reference: 1 Samuel 12:10
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יִּזְעֲק֤וּ אֶל יְהוָה֙ ו/יאמר חָטָ֔אנוּ כִּ֤י עָזַ֨בְנוּ֙ אֶת יְהוָ֔ה וַ/נַּעֲבֹ֥ד אֶת הַ/בְּעָלִ֖ים וְ/אֶת הָ/עַשְׁתָּר֑וֹת וְ/עַתָּ֗ה הַצִּילֵ֛/נוּ מִ/יַּ֥ד אֹיְבֵ֖י/נוּ וְ/נַעַבְדֶֽ/ךָּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/010.yaml
  text: Then they cried out to the LORD and said, “We have sinned, because we have forsaken the LORD and have served the Baals and the Ashtaroths. But now, deliver us from the hand of our enemies, and we will serve you.”
translation:
  language: ta
  text: அப்போது அவர்கள் ஆண்டவரை நோக்கிக் கூப்பிட்டு, “நாங்கள் பாவம் செய்தோம்; ஏனெனில், ஆண்டவரை விட்டுவிட்டு, பாகால்களையும் அஸ்தரோத்துகளையும் வழிபட்டோம். இப்போது எங்கள் பகைவர்களின் கையிலிருந்து எங்களை விடுவியும்; நாங்கள் உம்மை வழிபடுவோம்” என்றார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: ஆண்டவர்
  rationale: தேவனுடைய தனிப்பெயரைக் குறிக்கும் நான்கு எழுத்துப் பெயருக்கு, தமிழ் வேதாகம மரபிலும் பொதுவான வாசிப்பிலும் நிலைபெற்ற மரியாதைமிக்க பதிப்பு.
- source_word: הַבְּעָלִים
  choice: பாகால்கள்
  rationale: பன்மை வடிவத்தைத் தக்கவைத்து, பாகால் தெய்வத்தின் பல உள்ளூர் வடிவங்கள் அல்லது உருவங்களைச் சுட்டுகிறது.
- source_word: הָעַשְׁתָּרוֹת
  choice: அஸ்தரோத்துகள்
  rationale: எபிரெயப் பன்மைப் பெயரை ஒலிபெயர்த்து, பெண் தெய்வங்களையோ அவற்றின் உருவங்களையோ குறிக்கும் வரலாற்றுச் சிறப்பைத் தக்கவைக்கிறது.
- source_word: נַּעֲבֹד / נַעַבְדֶךָ
  choice: வழிபட்டோம் / உம்மை வழிபடுவோம்
  rationale: עבד என்பதன் ‘சேவை செய்/வழிபடு’ என்ற பொருட்பரப்பில், தெய்வங்களை நோக்கிய இச்சூழலுக்கு இயல்பான ‘வழிபடு’ தேர்ந்தெடுக்கப்பட்டது; இரு இடங்களிலும் சொல்லிணைவு பாதுகாக்கப்பட்டது.
- source_word: מִיַּד אֹיְבֵינוּ
  choice: எங்கள் பகைவர்களின் கையிலிருந்து
  rationale: ‘கை’ என்ற மூல உருவகத்தைத் தக்கவைத்து, அவர்களுடைய அதிகாரம் அல்லது பிடியிலிருந்து விடுதலை என்பதைக் காட்டுகிறது.
theological_decisions:
- issue: மனந்திரும்புதலுக்கான காரணத் தொடர்பு
  choice: “ஏனெனில்” என்று வெளிப்படையாகக் கொடுக்கப்பட்டது
  alternative: “ஆண்டவரை விட்டுவிட்டு... நாங்கள் பாவம் செய்தோம்” என மறுசீரமைத்தல்
  rationale: כִּי என்ற காரண இணைப்பை வெளிப்படையாகப் பாதுகாத்து, ஆண்டவரைக் கைவிட்டு பிற தெய்வங்களை வழிபட்டதே ஒப்புக்கொள்ளப்படும் பாவம் என்ற உரையின் வலியுறுத்தலைத் தக்கவைக்கிறது.
- issue: עבד என்பதன் சேவை–வழிபாடு பொருட்தொடர்பு
  choice: இரு கூறுகளிலும் “வழிபடு”
  alternative: “சேவித்தோம் / உமக்குச் சேவை செய்வோம்”
  rationale: சூழல் தெய்வநம்பிக்கைக்கும் வழிபாட்டுக்கும் உரியது. அதே வினையின் மறுமொழித் தொடர்பும் தமிழில் தெளிவாகப் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் மரியாதைமிக்க வேதாகம நடையைக் கொண்டுள்ளது. தேவனை நோக்கிய ஒருமை மரியாதை வடிவங்களாக ‘விடுவியும்’, ‘உம்மை’ பயன்படுத்தப்பட்டுள்ளன; மூலத்தின் நேரடி உரையும் பன்மைப் தெய்வப் பெயர்களும் பாதுகாக்கப்பட்டுள்ளன.
