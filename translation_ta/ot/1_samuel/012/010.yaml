  terminology: “ஆண்டவர்” consistently renders the divine name according to the supplied project convention. “பாகால்கள்” and “அஸ்தரோத்துகள்” preserve the plural divine names, and “வழிபடு” appropriately conveys the cultic sense of עבד in both coordinated clauses.
