base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/017.yaml
  text: Is it not wheat harvest today? I will call to Yahweh[a], and he will send thunder and rain, so that you may know and see that your wickedness is great[b], which you have done in the sight of Yahweh by asking for yourselves a king.
translation:
  language: ta
  text: இன்று கோதுமை அறுவடைக் காலம் அல்லவா? நான் யாவேயை நோக்கிக் கூப்பிடுவேன்; அவர் இடிமுழக்கங்களையும்[a] மழையையும் தருவார். அப்போது, உங்களுக்காக ஒரு அரசனை வேண்டியதன் மூலம் யாவேயின் பார்வையில் நீங்கள் செய்த உங்கள் தீமை மிகப் பெரியது என்பதை அறிந்து காணுங்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொற்படியாக, ‘குரல்களையும் மழையையும்’; இங்குள்ள வானிலைச் சூழலில் ‘குரல்கள்’ என்பது இடிமுழக்கங்களைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלוֹא קְצִיר חִטִּים הַיּוֹם
  choice: இன்று கோதுமை அறுவடைக் காலம் அல்லவா?
  rationale: எதிரிலுள்ளோர் ஒப்புக்கொள்ள வேண்டும் என எதிர்பார்க்கும் எபிரெய வினாவை ‘அல்லவா?’ என்று இயல்பாகத் தக்கவைக்கிறது; பருவச் சூழலையும் தெளிவாக்குகிறது.
- source_word: אֶקְרָא אֶל יְהוָה
  choice: நான் யாவேயை நோக்கிக் கூப்பிடுவேன்
  rationale: קרא אל என்பதிலுள்ள அழைத்தல் மற்றும் இறைவனை நோக்கிய திசை ஆகிய இரண்டையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: וְיִתֵּן קֹלוֹת וּמָטָר
  choice: அவர் இடிமுழக்கங்களையும் மழையையும் தருவார்
  rationale: נתן என்பதன் ‘தருதல்’ என்ற பொருளைத் தக்கவைக்கிறது. வானிலைச் சூழலில் קֹלוֹת என்பது ‘குரல்கள்’ அல்ல, இடிமுழக்கங்களைக் குறிக்கிறது.
- source_word: וּדְעוּ וּרְאוּ
  choice: அப்போது அறிந்து காணுங்கள்
  rationale: இரண்டு எபிரெய கட்டளைகளையும் தக்கவைத்து, முன்னறிவிக்கப்பட்ட அடையாளத்தின் விளைவைக் ‘அப்போது’ என்பதன் மூலம் இயல்பாக இணைக்கிறது.
- source_word: כִּי רָעַתְכֶם רַבָּה
  choice: நீங்கள் செய்த தீமை எவ்வளவு பெரியது
  rationale: רעה இங்கு ஒழுக்கத் தீமையைக் குறிக்கிறது; רבה அதன் தீவிரத்தைக் காட்டுகிறது. தமிழ் மறைமுக வாக்கிய அமைப்பில் வலிமை இயல்பாக வெளிப்படுகிறது.
- source_word: בְּעֵינֵי יְהוָה
  choice: யாவேயின் பார்வையில்
  rationale: ‘யாவேயின் கண்களில்’ என்ற சொற்படி வடிவத்தின் மதிப்பீட்டுப் பொருளை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: לִשְׁאוֹל לָכֶם מֶלֶךְ
  choice: உங்களுக்காக ஓர் அரசனைக் கேட்டதன் மூலம்
  rationale: அரசனை வேண்டிய செயல் அவர்களுக்காகவே செய்யப்பட்ட கோரிக்கை என்பதையும், அதுவே குற்றஞ்சாட்டப்படும் தீமை என்பதையும் தெளிவாகத் தக்கவைக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: யெகோவா / ஆண்டவர்
  rationale: மூலத்தில் உள்ள நான்கெழுத்து இறைப் பெயரை ஒரு பொதுப் பட்டப்பெயராக மாற்றாமல், ‘Yahweh’ என்பதற்குரிய பரவலான தமிழ் ஒலிபெயர்ப்பால் தருகிறது.
- issue: அரசனைக் கேட்ட செயலைத் ‘தீமை’ எனக் கூறுதல்
  choice: மூலத்தின் நேரடியான ஒழுக்கக் குற்றச்சாட்டைத் தக்கவைத்தல்
  alternative: ‘தவறு’ அல்லது ‘துரதிர்ஷ்டம்’ என மென்மைப்படுத்துதல்
  rationale: רעה மற்றும் רבה ஆகியவை இங்கு வலுவான ஒழுக்க மதிப்பீட்டை வெளிப்படுத்துகின்றன; உரையின் இறையியல் பதற்றத்தை மென்மைப்படுத்தாமல் காக்க வேண்டும்.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் வேதாகம உரைக்கேற்ற கண்ணியமான நடையிலும் வடிவமைக்கப்பட்டது. ‘அறிந்து காணுங்கள்’ என்ற இணைப்பு சற்றே செறிவானதாக இருந்தாலும், மூலத்தின் இரட்டை கட்டளையைப் பாதுகாக்கிறது.
