source:
  edition: WLC
  text: וְ/לֹ֖א תָּס֑וּרוּ כִּ֣י אַחֲרֵ֣י הַ/תֹּ֗הוּ אֲשֶׁ֧ר לֹֽא יוֹעִ֛ילוּ וְ/לֹ֥א יַצִּ֖ילוּ כִּי תֹ֥הוּ הֵֽמָּה׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/021.yaml
  text: And do not turn aside after worthless things that cannot profit or deliver[b][a], for they are worthless.
translation:
  language: ta
  text: வழிவிலகி பயனற்றவற்றைப் பின்பற்றாதீர்கள்[a]. அவை பயன் அளிக்கவோ விடுவிக்கவோ முடியாது; ஏனெனில் அவை பயனற்றவை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘பயனற்றவை’ என்பதை ‘வெறுமையானவை,’ ‘வீணானவை,’ அல்லது இச்சூழலில் ‘சிலைகள்’ என்றும் புரிந்துகொள்ளலாம். எபிரெயச் சொல் வெறுமை, வீண்தன்மை, அல்லது பயனின்மை கொண்டவற்றைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: תָּסוּרוּ
  choice: விலகிப்போகாதீர்கள்
  rationale: סור என்பதன் அடிப்படைப் பொருள் ‘விலகுதல்/வழிமாறுதல்.’ உடன்படிக்கைச் சூழலில் சரியான பற்றுறுதியிலிருந்து விலகுவதை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: אַחֲרֵי
  choice: பின்பற்றி
  rationale: சொல்லடியாக ‘பின்னால்/பின்’; இச்சூழலில் ஒன்றை நாடிப் பின்பற்றுதல் என்ற பொருள் இயல்பானது.
- source_word: הַתֹּהוּ / תֹהוּ
  choice: பயனற்றவற்றை / பயனற்றவை
  rationale: תֹהוּ வெறுமை, வீண் தன்மை, நிலைத்த சாரமின்மை ஆகியவற்றைக் குறிக்கிறது. குறிப்பாக ‘சிலைகள்’ என்று மொழிபெயர்க்காமல் மூலத்தின் பரந்த குறிப்பைத் தக்கவைத்து, இச்சூழலில் அவற்றின் செயலற்ற தன்மையை ‘பயனற்ற’ எனத் தெரிவிக்கிறது; இறுதியில் வரும் மறுபடியும் கூறுதலும் பாதுகாக்கப்படுகிறது.
- source_word: אֲשֶׁר לֹא יוֹעִילוּ
  choice: அவற்றால் நன்மை செய்ய முடியாது
  rationale: இவை எந்த நன்மையையும் அளிக்க இயலாதவை என்ற உறவுப்பிரிவின் கருத்தை தெளிவான தமிழில் தருகிறது.
- source_word: וְלֹא יַצִּילוּ
  choice: விடுவிக்க முடியாது
  rationale: Hiphil வடிவிலுள்ள נצל என்பது விடுவித்தல் அல்லது மீட்டல். ‘விடுவிக்க’ என்பது ஆபத்திலிருந்து காப்பாற்றும் கருத்தைத் தக்கவைத்து, தேவையற்ற பிற்கால இறையியல் நுண்பொருளைச் சேர்ப்பதைத் தவிர்க்கிறது.
- source_word: הֵמָּה
  choice: அவை
  rationale: முன்னர் குறிப்பிடப்பட்ட பயனற்ற பொருட்களைச் சுட்டும் ஆண்பால் பன்மைப் பெயர்ப்பதிலிக்கு இயல்பான தமிழ் வடிவம்.
theological_decisions:
- issue: ‘பயனற்றவை’ என்பதன் குறிப்பு
  choice: சிலைகள் அல்லது தவறாக நம்பிக்கை வைக்கப்படும் வெறுமையானவற்றை பொதுவாகக் குறிக்குமாறு ‘பயனற்றவை’ என மொழிபெயர்த்தல்
  alternative: ‘சிலைகள்,’ ‘வீணானவை,’ அல்லது ‘வெறுமையானவை’
  rationale: உடனடிச் சூழல் ஆண்டவரை விட்டுவிட்டு உதவவோ விடுவிக்கவோ இயலாதவற்றை நாடுவதைப் பற்றியது. ஆனால் எபிரெயச் சொல் சிலைகளுக்கான குறிப்பிட்ட பெயரல்ல; வெறுமை மற்றும் பயனின்மையைக் குறிக்கும் பரந்த சொல். ஆகவே சாத்தியமான சிலைச் சுட்டை மறுக்காமலும், மூலத்தைவிட மிகத் திட்டவட்டமாக்காமலும் மொழிபெயர்க்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; சாதாரண வாசகர்களுக்குப் புரியும், அதேவேளையில் கண்ணியமான அறிவுறுத்தல் நடை. எபிரெய மூலத்தின் ‘பின்பற்றி விலகுதல்’ என்ற உருவகமும், תֹהוּ என்ற சொல்லின் மறுபடியும் வருதலும் பாதுகாக்கப்பட்டுள்ளன.
