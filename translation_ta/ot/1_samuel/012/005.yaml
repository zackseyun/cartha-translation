base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/005.yaml
  text: And he said to them[a], “Yahweh is witness against you, and his anointed is witness this day, that you have found nothing in my hand.” And they said[c][b], “He is witness.”
translation:
  language: ta
  text: அவர் அவர்களிடம், “நீங்கள் என் கையில் எதையும் கண்டுபிடிக்கவில்லை என்பதற்கு யாவே உங்களுக்கு எதிராகச் சாட்சி[a]; அவருடைய அபிஷேகம் பெற்றவரும்[b] இன்று சாட்சி” என்றார். அதற்கு அவர்கள்[c], “அவர் சாட்சி” என்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'இன்னும் சொற்சொல்லாக, “யாவே உங்களிடையே/உங்களுடன் சாட்சியாக இருக்கிறார்.” இச்சூழலில் இது நீதிமன்றப் பொருளுடையது: அவர்களைச் சார்ந்த வழக்கில் யாவே சாட்சியாக நிற்கிறார்.'
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில், “அவருடைய அபிஷேகம் பெற்றவர்.” இங்கு இது அரசனாகிய சவுலைக் குறிக்கிறது; பிற்கால ‘மேசியா’ என்ற சிறப்புப் பட்டத்தை நேரடியாகக் குறிக்கவில்லை.
    reason: cultural_note
  - marker: c
    text: இறுதி எபிரெய வினை ஒருமையில் உள்ளது (“அவர் சொன்னார்”); ஆனால் சூழலில் அது மக்களின் கூட்டுப் பதிலாகச் செயல்படுவதால் “அவர்கள் என்றார்கள்” என்று மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: textual_note
lexical_decisions:
- source_word: עֵד
  choice: சாட்சி / சாட்சியாக இருக்கிறார்
  rationale: இச்சொல் சட்ட அல்லது உடன்படிக்கைச் சூழலில் சாட்சி அளிப்பவரைக் குறிக்கிறது. சாமுவேல் பொதுமக்கள் முன் தன் நேர்மையை உறுதிப்படுத்தும் இச்சூழலுக்கு ‘சாட்சி’ இயல்பாகப் பொருந்துகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெயத் திருப்பெயரை ஒரு பட்டப்பெயரால் மாற்றாமல், தனிப்பெயராகத் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: בָּכֶם
  choice: உங்களுக்கு எதிராக
  rationale: עֵד என்பதுடன் வரும் இச்சொற்றொடர் இங்கு நீதிமன்றப் பொருளில், அவர்களைச் சார்ந்த வழக்கில் சாட்சியாக நிற்பதைக் குறிக்கிறது. ‘உங்களிடையே’ அல்லது ‘உங்களுடன்’ என்பது சொற்சொல்லான மாற்றாகும்.
- source_word: מְשִׁיחוֹ
  choice: அவரால் அபிஷேகம் செய்யப்பட்டவர்
  rationale: இங்கு சவுல் அரசனே குறிப்பிடப்படுகிறார். ‘மேசியா’ என்ற பிற்காலச் சிறப்புப் பட்டத்தைத் திணிக்காமல், எபிரெயச் சொல்லின் அடிப்படைப் பொருளைப் பாதுகாக்கிறது.
- source_word: הַיּוֹם הַזֶּה
  choice: இன்று
  rationale: எபிரெயச் சொற்றொடரின் காலக் குறிப்பை நவீன தமிழில் இயல்பாகத் தெரிவிக்கிறது.
- source_word: מְצָאתֶם
  choice: கண்டுபிடிக்கவில்லை
  rationale: மக்கள் ஆராய்ந்து பார்த்தும் சாமுவேலிடம் குற்றத்திற்குரிய எதையும் காணவில்லை என்ற நிறைவு பெற்ற பரிசோதனையைத் தெரிவிக்கிறது.
- source_word: בְּיָדִי
  choice: என் கையில்
  rationale: உடைமை அல்லது கட்டுப்பாட்டைக் குறிக்கும் எபிரெய உருவகத்தைத் தமிழிலும் புரியத்தக்கவாறு பாதுகாக்கிறது.
- source_word: מְאוּמָה
  choice: எதையும்
  rationale: எதிர்மறை வாக்கியத்தில் ‘எதுவுமே இல்லை’ என்ற பொருளை இயல்பான தமிழில் வழங்குகிறது.
- source_word: וַיֹּאמֶר ... וַיֹּאמֶר
  choice: அவர் ... என்றார்; அவர்கள் ... என்றார்கள்
  rationale: முதல் ஒருமை வினை சாமுவேலைக் குறிக்கிறது. இறுதி எபிரெய வினை இலக்கணப்படி ஒருமையாக இருந்தாலும், சூழலில் அது மக்களின் கூட்டுப் பதிலாகச் செயல்படுவதால் தமிழில் பன்மையாக வழங்கப்படுகிறது.
theological_decisions:
- issue: மேசியா சாராத அரசச் சூழலில் מְשִׁיחוֹ என்பதை மொழிபெயர்த்தல்
  choice: அவரால் அபிஷேகம் செய்யப்பட்டவர்
  alternative: அவருடைய மேசியா
  rationale: உடனடிச் சூழலில் இச்சொல் அப்போது அரசனாக்கப்பட்ட சவுலைக் குறிக்கிறது. தேர்ந்தெடுத்த மொழிபெயர்ப்பு எபிரெயச் சொல்லின் பொருளைப் பாதுகாத்து, இவ்வசனம் நேரடியாகப் பிற்கால மேசியாவைக் குறிக்கிறது என்ற வாசிப்பைத் திணிக்காமல் விடுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான சட்டச் சாட்சி நடையைப் பயன்படுத்துகிறது. எபிரெயத்தின் ‘என் கையில்’ என்ற உருவகம் பாதுகாக்கப்பட்டுள்ளது; கடினமான சொற்சொல் அமைப்புகள் மட்டும் இயல்பான தமிழ் வாக்கிய வரிசைக்கு மாற்றப்பட்டுள்ளன.
