source:
  edition: WLC
  text: כַּֽ/אֲשֶׁר בָּ֥א יַעֲקֹ֖ב מִצְרָ֑יִם וַ/יִּזְעֲק֤וּ אֲבֽוֹתֵי/כֶם֙ אֶל יְהוָ֔ה וַ/יִּשְׁלַ֨ח יְהוָ֜ה אֶת מֹשֶׁ֣ה וְ/אֶֽת אַהֲרֹ֗ן וַ/יּוֹצִ֤יאוּ אֶת אֲבֹֽתֵי/כֶם֙ מִ/מִּצְרַ֔יִם וַ/יֹּשִׁב֖וּ/ם בַּ/מָּק֥וֹם הַ/זֶּֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/008.yaml
  text: When Jacob came into Egypt[a], your fathers cried out to Yahweh, and Yahweh sent Moses and Aaron[b], and they brought your fathers out of Egypt and settled them in this place.
translation:
  language: ta
  text: யாக்கோபு எகிப்துக்கு வந்தபோது, உங்கள் முன்னோர்கள்[a] யாவேவை நோக்கிக் கூக்குரலிட்டார்கள். யாவே மோசேயையும் ஆரோனையும் அனுப்பினார்; அவர்கள் உங்கள் முன்னோர்களை எகிப்திலிருந்து வெளியே கொண்டுவந்து, இந்த இடத்தில் குடியமர்த்தினார்கள்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயில் சொற்படியாக, ‘உங்கள் தந்தையர்’; ‘உங்கள் மூதாதையர்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘அவர்களை இங்கே வாழச் செய்தார்கள்’ அல்லது ‘இந்த இடத்தில் வசிக்கச் செய்தார்கள்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּאֲשֶׁר בָּא
  choice: வந்தபோது
  rationale: கடந்தகால நிகழ்வின் சூழலை அறிமுகப்படுத்தும் காலத் தொடரை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: יַעֲקֹב
  choice: யாக்கோபு
  rationale: எபிரெய தனிப்பெயரின் தமிழில் நிலைபெற்ற வடிவம்.
- source_word: מִצְרָיִם
  choice: எகிப்து
  rationale: இடப்பெயரின் தமிழில் பரவலாக அறியப்பட்ட வடிவம்.
- source_word: וַיִּזְעֲקוּ
  choice: கூக்குரலிட்டார்கள்
  rationale: உதவி வேண்டி எழுப்பப்படும் அவசரமான, துயரமிக்க கூக்குரலின் வலிமையைப் பாதுகாக்கிறது.
- source_word: אֲבוֹתֵיכֶם
  choice: உங்கள் முன்னோர்கள்
  rationale: சூழலில் முந்தைய தலைமுறையினரைக் குறிக்கும் இயல்பான உள்ளடக்கமிக்க தமிழ்ச் சொல்; எபிரெயின் சொற்படியான ‘தந்தையர்’ அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: אֶל יְהוָה
  choice: யாவேவை நோக்கி
  rationale: வேண்டுதல் யாரை நோக்கிச் செலுத்தப்பட்டது என்பதைத் தெளிவாகக் காட்டுவதோடு, உடன்படிக்கைப் பெயரையும் பெயராகவே வழங்குகிறது.
- source_word: וַיִּשְׁלַח יְהוָה
  choice: யாவே ... அனுப்பினார்
  rationale: இறைவன் மோசேயையும் ஆரோனையும் பணிக்காக அனுப்பிய செயலை நேரடியாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: וַיּוֹצִיאוּ
  choice: அவர்கள் ... வெளியே கொண்டுவந்து
  rationale: மோசேயும் ஆரோனும் இலக்கண ரீதியான பன்மை எழுவாய் என்பதைப் பாதுகாத்து, எகிப்திலிருந்து விடுவித்து அழைத்து வந்த பொருளைத் தருகிறது.
- source_word: וַיֹּשִׁבוּם
  choice: குடியமர்த்தினார்கள்
  rationale: ஹிஃபில் வடிவின் ‘வசிக்கச் செய்தார்கள்/நிலைகொள்ளச் செய்தார்கள்’ என்ற காரணவினைப் பொருளைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: בַּמָּקוֹם הַזֶּה
  choice: இந்த இடத்தில்
  rationale: சாமுவேல் பேசும் தற்போதைய நாட்டிடத்தைக் குறிக்கும் சுட்டுப்பொருளை நேரடியாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூலவசனம் நான்கெழுத்து உடன்படிக்கைப் பெயரை நேரடியாகப் பயன்படுத்துவதால், அதை பொதுப்பட்டமாக மாற்றாமல் தனிப்பெயராக வழங்குகிறது.
- issue: மோசேயும் ஆரோனும் வெளியே கொண்டுவந்ததாகக் கூறும் பன்மை வினை
  choice: அவர்கள் உங்கள் முன்னோர்களை ... வெளியே கொண்டுவந்து
  alternative: யாவே அவர்கள் மூலம் உங்கள் முன்னோர்களை வெளியே கொண்டுவந்து
  rationale: மூல எபிரெயில் வினை பன்மையில் இருந்து மோசேயையும் ஆரோனையும் நேரடி செயற்பாட்டாளர்களாகக் காட்டுகிறது; அதேவேளை முந்தைய வாக்கியம் அவர்களை அனுப்பியவர் யாவே என்று கூறுவதால் தெய்வீக முன்னெடுப்பும் மனிதச் செயற்பாடும் உள்ள பதற்றம் அப்படியே நிலைக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான வரலாற்றுரை நடை பயன்படுத்தப்பட்டுள்ளது. ‘முன்னோர்கள்’, ‘கூக்குரலிட்டார்கள்’, ‘குடியமர்த்தினார்கள்’ ஆகியவை இயல்பான தமிழையும் எபிரெயின் பொருள் வலிமையையும் சமநிலைப்படுத்துகின்றன. இறைப்பெயர் ‘யாவே’ என ஒரேவிதமாக வழங்கப்பட்டுள்ளது.
