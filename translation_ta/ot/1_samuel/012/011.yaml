base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/011.yaml
  text: And Yahweh sent Jerubbaal and Bedan and Jephthah and Samuel[a], and he delivered you from the hand of your enemies all around[b], and you lived in safety.
translation:
  language: ta
  text: யெகோவா எருபாகாலையும்[a], பெதானையும்[b], யெப்தாவையும், சாமுவேலையும் அனுப்பினார்; அவர் உங்களைச் சுற்றியிருந்த உங்கள் பகைவர்களின் கையிலிருந்து உங்களை விடுவித்தார்; நீங்கள் பாதுகாப்பாக வாழ்ந்தீர்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எருபாகால் என்பது கிதியோனின் மற்றொரு பெயர் (நியாயாதிபதிகள் 6:32; 7:1 பார்க்கவும்).
    reason: cross_reference
  - marker: b
    text: எபிரெய மூலத்தில் ‘பெதான்’ என்று உள்ளது. இவர் யார் என்பது உறுதியாகத் தெரியவில்லை; சிலர் இதைப் பாராக் என்றும், அரிதாக அப்தோன் என்றும் புரிந்துகொள்கிறார்கள்.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: யெகோவா
  rationale: தேவனுடைய தனிப்பட்ட உடன்படிக்கைப் பெயரைப் பொதுப்பட்ட பட்டப்பெயராக மாற்றாமல், தமிழில் நிலைபெற்ற ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: וַיִּשְׁלַח
  choice: அனுப்பினார்
  rationale: שׁלח என்பதன் நேரடியான பொருளை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: יְרֻבַּעַל
  choice: எருபாகால்
  rationale: மூல எபிரெய உரையிலுள்ள பெயரையே ஒலிபெயர்த்து, கிதியோனுடன் அதன் அடையாளத்தை அடிக்குறிப்பில் விளக்குகிறது.
- source_word: בְּדָן
  choice: பெதான்
  rationale: மசோரா உரையின் பெயரைத் திருத்தமின்றித் தக்கவைக்கிறது; நபரின் அடையாளம் உறுதியற்றது என்பதைக் குறிப்பில் தெரிவிக்கிறது.
- source_word: יִפְתָּח
  choice: யெப்தா
  rationale: எபிரெயத் தனிப்பெயருக்கான இயல்பான தமிழ் ஒலிபெயர்ப்பு.
- source_word: שְׁמוּאֵל
  choice: சாமுவேல்
  rationale: தமிழில் பரவலாக அறியப்படும் தனிப்பெயர் வடிவம்.
- source_word: וַיַּצֵּל
  choice: விடுவித்தார்
  rationale: ஆபத்திலிருந்தும் பகைவர்களின் அதிகாரத்திலிருந்தும் மீட்பதைச் சூழலுக்கு ஏற்றவாறு தெரிவிக்கிறது.
- source_word: מִיַּד אֹיְבֵיכֶם
  choice: உங்கள் பகைவர்களின் கையிலிருந்து
  rationale: அதிகாரம் அல்லது பிடியைக் குறிக்கும் எபிரெய உருவகத்தைத் தமிழிலும் புரியத்தக்க வகையில் தக்கவைக்கிறது.
- source_word: מִסָּבִיב
  choice: சுற்றிலும் இருந்த
  rationale: எல்லாப் பக்கங்களிலும் இருந்த பகைவர்களைக் குறிக்கும் இடவியல் பொருளை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וַתֵּשְׁבוּ בֶּטַח
  choice: நீங்கள் பாதுகாப்பாக வாழ்ந்தீர்கள்
  rationale: ישׁב என்பதன் குடியிருந்து வாழும் கருத்தையும் בטח என்பதன் அச்சமற்ற பாதுகாப்பையும் இயல்பான தமிழில் இணைக்கிறது.
theological_decisions:
- issue: בְּדָן என்பவரின் அடையாளம்
  choice: மசோரா உரையிலுள்ள ‘பெதான்’ என்பதை முதன்மை உரையில் தக்கவைத்தல்
  alternative: பாராக் அல்லது, அரிதாக, அப்தோன்
  rationale: மூல எபிரெய உரைக்கு முன்னுரிமை அளித்து, உறுதியற்ற அடையாளத்தை மொழிபெயர்ப்பிலேயே தீர்மானிக்காமல் அடிக்குறிப்பில் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியும் அதேவேளையில் கண்ணியமான நடையைப் பயன்படுத்துகிறது. எபிரெய இணைப்புச் சொற்களின் தொடர் அமைப்பை முழுவதும் செயற்கையாகப் பின்பற்றாமல், இரண்டு வாக்கியங்களாக அமைத்துள்ளது; எனினும் காரணம் அல்லது நோக்கம் போன்ற கூடுதல் உறவைச் சேர்க்கவில்லை. எல்லா அடிக்குறிப்பு குறிகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
