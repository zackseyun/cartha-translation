base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/024.yaml
  text: Only fear Yahweh and serve him faithfully with all your heart[a], for consider what great things he has done with you.
translation:
  language: ta
  text: யாவேக்கு மட்டும் அஞ்சி, உங்கள் முழு இதயத்தோடும் அவருக்கு உண்மையுடன் பணிசெய்யுங்கள்; ஏனெனில், அவர் உங்களோடு[a] எத்தகைய மாபெரும் செயல்களைச் செய்திருக்கிறார் என்பதை எண்ணிப்பாருங்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘உங்களுக்காக’ என்றும் மொழிபெயர்க்கலாம்; எபிரெயத்தில் ‘உங்களோடு’ என்று உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: இதை மட்டும் உறுதியாகச் செய்யுங்கள்
  rationale: இந்தத் துகள் முந்தைய எச்சரிக்கைக்குப் பின் வரும் வலியுறுத்தப்பட்ட வரையறுக்கப்பட்ட அறிவுரையாக உள்ளது. தமிழில் இயல்பாகவும் இரு கட்டளைகளையும் உள்ளடக்குமாறும் இவ்வாறு வெளிப்படுத்தப்பட்டது.
- source_word: יְרָאוּ אֶת יְהוָה
  choice: யாவேக்குப் பயந்து
  rationale: ירא என்பதில் பயபக்தியும் கீழ்ப்படிதலுள்ள அச்சமும் அடங்கும்; ‘பயந்து’ என்ற சொல் வேதாகமச் சொல்லாட்சியின் கனத்தைப் பாதுகாக்கிறது. יהוה என்பது பதவிப்பெயரால் மாற்றப்படாமல் ‘யாவே’ என ஒலிபெயர்க்கப்பட்டது.
- source_word: וַעֲבַדְתֶּם אֹתוֹ
  choice: அவருக்குப் பணிசெய்யுங்கள்
  rationale: עבד என்பதன் நேரடிப் பொருள் ‘பணிசெய்/சேவைசெய்’; வழிபாட்டை மட்டும் அல்லாமல் உடன்படிக்கை சார்ந்த முழுக் கீழ்ப்படிதலையும் இது உள்ளடக்குகிறது.
- source_word: בֶּאֱמֶת
  choice: உண்மையாய்
  rationale: இங்கு אֱמֶת என்பது உண்மை, நேர்மை, நம்பகத்தன்மை ஆகிய நுணுக்கங்களுடன் கடவுளுக்கான உண்மையுள்ள சேவையைச் சுட்டுகிறது.
- source_word: בְּכָל לְבַבְכֶם
  choice: உங்கள் முழு இதயத்தோடும்
  rationale: முழுமையான உள்ளார்ந்த அர்ப்பணிப்பைக் குறிக்கும் எபிரெய மரபுத்தொடரின் இயல்பான தமிழ் வடிவம்.
- source_word: רְאוּ
  choice: எண்ணிப்பாருங்கள்
  rationale: சொற்பொருள் ‘பாருங்கள்’ என்றாலும், இங்கு கடவுளின் செயல்களை உணர்ந்து சிந்திக்கும்படி அழைக்கும் கட்டளை; ‘எண்ணிப்பாருங்கள்’ அந்த நோக்கை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: אֵת אֲשֶׁר הִגְדִּיל
  choice: செய்த மாபெரும் செயல்களை
  rationale: גדל என்பதன் ஹிஃபில் வடிவம் இச்சூழலில் ‘மாபெரும் செயல்களைச் செய்தல்’ என்னும் மொழிவழக்குப் பொருளைக் கொண்டுள்ளது.
- source_word: עִמָּכֶם
  choice: உங்களோடு
  rationale: עם என்பதன் நேரடி உறவுப்பொருள் ‘உடன்/ஓடு’. கடவுள் இஸ்ரவேலரோடு மேற்கொண்ட செயல்களை இது திறந்தவையாகக் குறிக்கிறது; ‘உங்களுக்காக’ என்பதும் சூழல்சார் சாத்தியம்.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: எபிரெய உரையில் உடன்படிக்கைப் பெயரான יהוה நேரடியாக உள்ளது. அதை ஒரு பட்டப்பெயரால் மாற்றாமல், நவீன தமிழில் ‘யாவே’ என ஒலிபெயர்ப்பது தனிப்பட்ட இறைப்பெயரைப் பாதுகாக்கிறது.
- issue: בֶּאֱמֶת குறிக்கும் சேவையின் தன்மை
  choice: உண்மையாய்
  alternative: சத்தியத்தில் / உண்மையுடன்
  rationale: ‘உண்மையாய்’ என்பது கோட்பாட்டு ‘சத்தியம்’ என்று மட்டும் சுருக்காமல், நேர்மையும் நிலைத்த விசுவாசமும் கொண்ட சேவை என்ற பொருள் அகலத்தைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் மரியாதையான அறிவுறுத்தல் நடை பயன்படுத்தப்பட்டது. ‘பணிசெய்யுங்கள்,’ ‘எண்ணிப்பாருங்கள்’ ஆகியவை இயல்பானவையாகவும் மூலத்தின் உடன்படிக்கைச் சார்ந்த வலிமையைத் தக்கவைத்தவையாகவும் உள்ளன.
