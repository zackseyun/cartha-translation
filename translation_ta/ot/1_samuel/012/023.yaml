base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/023.yaml
  text: As for me[a], far be it from me that I should sin against Yahweh by ceasing to pray for you[c][b]; and I will instruct you in the good and upright way.
translation:
  language: ta
  text: என்னைப் பொறுத்தவரை, உங்களுக்காக ஜெபிப்பதை நிறுத்துவதன் மூலம் யாவேக்கு எதிராகப் பாவம் செய்வது ஒருபோதும் நடக்கக்கூடாது! நல்லதும் நேர்மையானதுமான வழியை நான் உங்களுக்குப் போதிப்பேன்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “போதிப்பேன்” என்பதற்கு “வழிகாட்டுவேன்” என்றும் மொழிபெயர்க்கலாம்; எபிரெய வினைச்சொல் கற்பித்தலையும் வழிநடத்தலையும் குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם אָנֹכִי
  choice: என்னைப் பொறுத்தவரை
  rationale: வலியுறுத்தப்பட்ட முதலாம் நபரையும், சூழலில் மக்களின் கடமைக்கு எதிராக சாமுவேலின் நிலைப்பாட்டையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: חָלִילָה לִּי
  choice: எனக்கு நேரிடாதிருப்பதாக!
  rationale: ஒரு செயலைக் கடுமையாக மறுத்து வெறுக்கும் எபிரெய மரபுத்தொடரின் வலிமையை இயல்பான, கண்ணியமான தமிழில் தருகிறது.
- source_word: מֵחֲטֹא לַיהוָה
  choice: யெகோவாவுக்கு எதிராகப் பாவம் செய்வது
  rationale: இது வெறும் கடமைத் தவறல்ல, இறைவனுக்கு எதிரான பாவம் என்று மூலமொழி நேரடியாகக் கூறுவதைப் பாதுகாக்கிறது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: தெய்வீகப் பெயரான நான்கெழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் பரவலாக அறியப்பட்ட ஒலிபெயர்ப்பால் தருகிறது.
- source_word: מֵחֲדֹל לְהִתְפַּלֵּל בַּעַדְכֶם
  choice: உங்களுக்காக வேண்டிக்கொள்வதை நிறுத்தி
  rationale: அவர்களுக்காகச் செய்யும் பரிந்துரைப் பிரார்த்தனையை நிறுத்துவதே பாவமாகும் என்ற தொடர்பைத் தெளிவாகத் தருகிறது.
- source_word: וְהוֹרֵיתִי אֶתְכֶם
  choice: நான் உங்களுக்குப் போதிப்பேன்
  rationale: ஹிஃபில் வடிவின் போதித்தல் மற்றும் வழிநடத்தல் சார்ந்த பொருள்களில், இச்சூழலுக்கு இயல்பான தமிழ்ச் சொல்லைத் தேர்ந்தெடுக்கிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: בְּדֶרֶךְ הַטּוֹבָה וְהַיְשָׁרָה
  choice: நல்லதும் நேர்மையானதுமான வழியில்
  rationale: வாழ்க்கை நடத்தைக்கான ‘வழி’ என்ற உருவகத்தையும், அதன் நன்மை மற்றும் ஒழுக்க நேர்மை ஆகிய இரு பண்புகளையும் பாதுகாக்கிறது.
theological_decisions:
- issue: சாமுவேல் பரிந்துரைப் பிரார்த்தனையை நிறுத்துவது வெறும் தலைமைப் பொறுப்பைப் புறக்கணிப்பதா அல்லது இறைவனுக்கு எதிரான பாவமா
  choice: யெகோவாவுக்கு எதிரான பாவம் என்று வெளிப்படையாக மொழிபெயர்த்தல்
  alternative: தலைமைப் பொறுப்பை நிறைவேற்றத் தவறுதல் என்று மென்மையாக்குதல்
  rationale: לַיהוָה என்பது பாவம் யெகோவாவுக்கு எதிரானது என்று நேரடியாகக் குறிக்கிறது; அந்த இறையியல் கனத்தைத் தணிக்கக் கூடாது.
- issue: יְהוָה என்ற தெய்வீகப் பெயரை எவ்வாறு வழங்குவது
  choice: யெகோவா
  alternative: யாவே; கர்த்தர்
  rationale: மூலத்தில் தனிப்பெயர் இருப்பதால் பட்டமான ‘கர்த்தர்’ என்பதைக் காட்டிலும் ஒலிபெயர்ப்பு ஏற்றது. தமிழில் வாசகர்களிடையே அறியப்பட்ட வடிவமாக ‘யெகோவா’ பயன்படுத்தப்படுகிறது; ‘யாவே’ மாற்றாகக் குறிப்பிடப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு விளங்கும் கண்ணியமான நடை. எபிரெய வாக்கியத்தின் வலியுறுத்தலும், பரிந்துரைப் பிரார்த்தனையை நிறுத்துவது பாவம் என்ற இறையியல் அழுத்தமும் பாதுகாக்கப்பட்டுள்ளன. ஒரே அடிக்குறிப்பு குறியீடு முதன்மை உரையிலும் இடம்பெற்றுள்ளது.
