- from: என்னைப் பொறுத்தவரை, உங்களுக்காக வேண்டிக்கொள்வதை நிறுத்தி, யெகோவாவுக்கு எதிராகப் பாவம் செய்வது எனக்கு நேரிடாதிருப்பதாக! நல்லதும் நேர்மையானதுமான வழியில் நான் உங்களுக்குப் போதிப்பேன்.[a]
