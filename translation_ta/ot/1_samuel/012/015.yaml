reference: 1 Samuel 12:15
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וְ/אִם לֹ֤א תִשְׁמְעוּ֙ בְּ/ק֣וֹל יְהוָ֔ה וּ/מְרִיתֶ֖ם אֶת פִּ֣י יְהוָ֑ה וְ/הָיְתָ֧ה יַד יְהוָ֛ה בָּ/כֶ֖ם וּ/בַ/אֲבֹתֵי/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/015.yaml
  text: But if you do not listen to the voice of Yahweh and rebel against the command of Yahweh[a], then the hand of Yahweh will be against you and against your fathers.
translation:
  language: ta
  text: ஆனால் நீங்கள் யாவேயின் குரலுக்குச் செவிகொடுக்காமல், யாவேயின் கட்டளைக்கு எதிராகக் கலகம் செய்தால், யாவேயின் கை உங்களுக்கும் உங்கள் தந்தையருக்கும்[a] எதிராக இருக்கும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரேய உரை: “உங்கள் தந்தையர்.” சில பழங்கால மொழிபெயர்ப்புகளும் பல விளக்கவுரையாளர்களும் “உங்கள் அரசன்” என்று வாசிக்கின்றனர்; மக்களையும் அவர்களுடைய அரசனையும் குறித்து சாமுவேல் எச்சரிக்கும் உடனடிச் சூழலுக்கு அது பொருந்துகிறது.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְאִם
  choice: ஆனால் ... செய்தால்
  rationale: முந்தைய வசனத்துக்கு மாறான நிபந்தனையை அறிமுகப்படுத்துவதால், இணைப்புச் சொல்லின் எதிர்மறைத் தொடர்பையும் நிபந்தனையையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: לֹא תִשְׁמְעוּ בְּקוֹל יְהוָה
  choice: யாவேயின் குரலுக்குச் செவிகொடுக்காமல்
  rationale: ‘குரலுக்குச் செவிகொடுத்தல்’ என்ற எபிரேய மரபுத்தொடரையும், அதிலுள்ள கீழ்ப்படிதலின் உட்பொருளையும் பாதுகாக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைபெயரான நான்கெழுத்துப் பெயரைப் பெயராகவே ஒலிபெயர்த்து வழங்குகிறது.
- source_word: וּמְרִיתֶם
  choice: எதிர்த்துக் கலகம் செய்தால்
  rationale: מרה என்பது சாதாரண கீழ்ப்படியாமையைவிட வலுவான எதிர்ப்பையும் கலகத்தையும் குறிக்கிறது.
- source_word: אֶת פִּי יְהוָה
  choice: யாவேயின் கட்டளையை
  rationale: சொல்லுக்கு சொல் ‘யாவேயின் வாயை’ என்றாலும், இங்கு அவர் உரைத்த கட்டளையை எதிர்ப்பது என்ற மரபுத்தொடர்ப் பொருளைத் தெளிவாக வழங்குகிறது.
- source_word: וְהָיְתָה יַד יְהוָה
  choice: யாவேயின் கை ... எதிராக இருக்கும்
  rationale: நியாயத்தீர்ப்பில் செயல்படும் இறைவல்லமையைக் குறிக்கும் ‘கை’ என்ற வேதாகம உருவகத்தைத் தக்கவைக்கிறது.
- source_word: בָּכֶם
  choice: உங்களுக்கு எதிராக
  rationale: நியாயத்தீர்ப்புச் சூழலில் உள்ள பகைமுகச் செயல்பாட்டை ‘எதிராக’ தெளிவுபடுத்துகிறது.
- source_word: וּבַאֲבֹתֵיכֶם
  choice: உங்கள் முன்னோர்களுக்கும்
  rationale: அச்சுப் பொருள் ‘உங்கள் தந்தையர்’; இங்கு இயல்பான நவீன தமிழில் தலைமுறை முன்னோர்களைக் குறிக்க ‘முன்னோர்கள்’ பயன்படுத்தப்படுகிறது. உரைவேறுபாடு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைபெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: யெகோவா
  rationale: மூலத்தில் உள்ள தனிப்பட்ட இறைபெயரை பொதுப்பட்டமான ‘கர்த்தர்’ என்று மாற்றாமல், நேரடியாக ஒலிபெயர்க்கிறது.
- issue: וּבַאֲבֹתֵיכֶם என்ற இறுதித் தொடர்
  choice: உங்கள் முன்னோர்களுக்கும்
  alternative: உங்கள் அரசனுக்கும்
  rationale: கொடுக்கப்பட்ட WLC/மசோரா உரையில் ‘உங்கள் தந்தையர்/முன்னோர்’ என்றே உள்ளது; ஆகவே முதன்மை உரை அதைப் பின்பற்றுகிறது. உடனடிச் சூழலுக்குப் பொருந்தும் பழைய மொழிபெயர்ப்பு மரபான ‘உங்கள் அரசன்’ அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. ‘குரலுக்குச் செவிகொடுத்தல்’ மற்றும் ‘யாவேயின் கை’ ஆகிய மூல உருவகங்கள் இயன்றவரை பாதுகாக்கப்பட்டுள்ளன; ‘வாயை எதிர்த்தல்’ மட்டும் தமிழில் தெளிவிற்காக ‘கட்டளையை எதிர்த்தல்’ என மொழிபெயர்க்கப்பட்டுள்ளது.
