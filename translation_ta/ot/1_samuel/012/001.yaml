id: 1SA.12.1
reference: 1 Samuel 12:1
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר שְׁמוּאֵל֙ אֶל כָּל יִשְׂרָאֵ֔ל הִנֵּה֙ שָׁמַ֣עְתִּי בְ/קֹֽלְ/כֶ֔ם לְ/כֹ֥ל אֲשֶׁר אֲמַרְתֶּ֖ם לִ֑/י וָ/אַמְלִ֥יךְ עֲלֵי/כֶ֖ם מֶֽלֶךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/001.yaml
  text: Then Samuel said to all Israel, “Look, I have listened to your voice in all that you have said to me, and I have made a king reign over you.”
translation:
  language: ta
  text: அப்போது சாமுவேல் இஸ்ரவேலர் அனைவரிடமும், “இதோ, நீங்கள் என்னிடம் சொன்ன எல்லாவற்றிலும் நான் உங்கள் குரலுக்குச் செவிகொடுத்து, உங்கள்மேல் ஆளுவதற்கு ஒரு அரசனை ஏற்படுத்தினேன்” என்றார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה
  choice: இதோ
  rationale: கவனத்தை ஈர்க்கும் எபிரெயச் சொல்லின் உரையாடல் வலிமையை dignified, இயல்பான தமிழில் காக்கிறது.
- source_word: שָׁמַעְתִּי בְקֹלְכֶם
  choice: நான் உங்கள் குரலுக்குச் செவிகொடுத்து
  rationale: ‘குரலைக் கேட்டேன்’ என்பதைக் காட்டிலும், கோரிக்கைக்கு இணங்கியதையும் உள்ளடக்கும் எபிரெய வழக்கின் பொருளைத் தெளிவாகத் தருகிறது; அதேவேளை ‘உங்கள் குரல்’ என்ற உருவகத்தையும் காக்கிறது.
- source_word: וָאַמְלִיךְ עֲלֵיכֶם מֶלֶךְ
  choice: உங்கள்மேல் ஓர் அரசனை ஆட்சி செய்ய வைத்தேன்
  rationale: ஹிஃபில் வினையின் காரணவினைப் பொருளையும், מֶלֶךְ என்பதுடன் உள்ள சொல்விளையாட்டையும் இயன்றவரை காக்கிறது; சாமுவேல் தானே அரசாட்சியின் இறுதி மூலாதாரம் என்று கூறுவதாக அதிகப்படுத்தவில்லை.
theological_decisions:
- issue: அரசனை ஏற்படுத்தியதில் சாமுவேலின் பங்கு
  choice: ஆட்சி செய்ய வைத்தேன்
  alternative: அரசனாக்கினேன்
  rationale: மூலத்தின் காரணவினை வடிவை நெருக்கமாகக் காத்து, அரசனை நியமித்ததில் சாமுவேலின் செயல்பாட்டை வெளிப்படுத்துகிறது; ஆனால் தெய்வீக அதிகாரம் குறித்த பின்னணியை இவ்வசனத்துக்குள் சேர்த்து பதற்றத்தைத் தீர்க்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழ்; பொதுவாசகர்களுக்குப் புரியும் வகையில் இயல்பாகவும், சாமுவேலின் பொது உரைக்கு ஏற்ற கண்ணியமான நடையிலும் அமைக்கப்பட்டுள்ளது.
