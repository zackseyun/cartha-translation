- from: அப்போது சாமுவேல் இஸ்ரவேலர் அனைவரிடமும், “இதோ, நீங்கள் என்னிடம் சொன்ன எல்லாவற்றிலும் நான் உங்கள் குரலுக்குச் செவிகொடுத்து, உங்கள்மேல் ஓர் அரசனை ஆட்சி செய்ய வைத்தேன்” என்றார்.
