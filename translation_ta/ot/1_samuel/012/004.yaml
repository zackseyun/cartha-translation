  register: நவீனத் தரத் தமிழில் மரியாதையான ‘நீங்கள்’ பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் மூன்று இணையான மறுப்புகளும் அரைப்புள்ளிகளால் தெளிவாகப் பாதுகாக்கப்பட்டுள்ளன; மொழிநடை பொதுவாசகர்களுக்கு இயல்பாகவும் பொது விசாரணையின் கண்ணியத்துக்கு ஏற்றதாகவும் உள்ளது.
