source:
  edition: WLC
  text: וַ/יֹּ֣אמְר֔וּ לֹ֥א עֲשַׁקְתָּ֖/נוּ וְ/לֹ֣א רַצּוֹתָ֑/נוּ וְ/לֹֽא לָקַ֥חְתָּ מִ/יַּד אִ֖ישׁ מְאֽוּמָה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/004.yaml
  text: And they said[a], “You have not oppressed us, and you have not mistreated us, and you have not taken anything from any man's hand.”
translation:
  language: ta
  text: அவர்கள், “நீங்கள் எங்களை ஒடுக்கவும் இல்லை; எங்களைத் துன்புறுத்தவும் இல்லை; எந்த மனிதனுடைய கையிலிருந்தும்[a] எதையும் பெற்றுக்கொள்ளவும் இல்லை” என்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “எந்த மனிதனுடைய கையிலிருந்தும்.” இச்சொற்றொடர் யாரிடமிருந்தாவது பணம், அன்பளிப்பு, அல்லது லஞ்சம் போன்றவற்றைப் பெற்றுக்கொண்டதைக் குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: அதற்கு அவர்கள் … என்றார்கள்
  rationale: வழக்கமான எபிரெயக் கதைத் தொடரை இயல்பான தமிழில் காட்டுகிறது; சூழலில் இது சாமுவேலின் கேள்விக்கான பதில் என்பதால் ‘அதற்கு’ பொருத்தமான இணைப்பாக உள்ளது.
- source_word: עֲשַׁקְתָּנוּ
  choice: நீங்கள் எங்களை ஒடுக்கவும் இல்லை
  rationale: அதிகாரத்தைத் தவறாகப் பயன்படுத்தி ஒடுக்குதல், சுரண்டுதல் அல்லது அநியாயம் செய்தல் ஆகிய பொருள் எல்லையை ‘ஒடுக்குதல்’ தெளிவாகவும் சுருக்கமாகவும் வெளிப்படுத்துகிறது.
- source_word: רַצּוֹתָנוּ
  choice: எங்களைத் துன்புறுத்தவும் இல்லை
  rationale: רצץ என்பதன் அடிப்படை வலிமையை உணர்த்தியபடியே, இங்கு உடல்ரீதியாக நொறுக்குதல் அல்லாமல் தவறாக நடத்துதல் அல்லது கொடுமைப்படுத்துதல் என்ற உருவகப் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: לָקַחְתָּ מִיַּד אִישׁ מְאוּמָה
  choice: எந்த மனிதனுடைய கையிலிருந்தும் எதையும் வாங்கவும் இல்லை
  rationale: ‘ஒரு மனிதனின் கையிலிருந்து’ என்ற மூலமொழியின் தெளிவான உருவகத்தைப் பாதுகாக்கிறது. ‘வாங்குதல்’ என்பது இங்கு ஒருவரிடமிருந்து ஏதாவது பெற்றுக்கொள்ளுதல் என்ற பொருளில் இயல்பாக உள்ளது; லஞ்சம் அல்லது அநியாய ஆதாயம் என்ற சாத்தியமான உட்குறிப்பு அடிக்குறிப்பில் விளக்கப்படுகிறது.
- source_word: אִישׁ
  choice: எந்த மனிதனுடைய
  rationale: மூலத்தின் ஒருமை ஆண்பால் வடிவத்தையும் அதன் பொதுப்பிரதிநிதித்துவப் பயன்பாட்டையும் தேவையின்றி மறைக்காமல் காட்டுகிறது.
- source_word: מְאוּמָה
  choice: எதையும்
  rationale: எதிர்மறை வாக்கியத்தில் ‘எந்த ஒன்றையும்’ அல்லது ‘சிறிதளவுகூட எதையும்’ குறிக்கும் இயல்பான நவீனத் தமிழ் சொல்.
