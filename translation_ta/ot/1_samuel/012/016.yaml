lexical_decisions:
- source_word: גַּם עַתָּה
  choice: ஆகவே இப்போதும்
  rationale: முந்தைய உரையிலிருந்து அடுத்த கடுமையான அழைப்புக்கு மாறும் இணைப்புச் சொல்லாக இது செயல்படுகிறது; גַּם என்பதன் ‘-உம்’ வலியுறுத்தலையும் עַתָּה என்பதன் ‘இப்போது’ பொருளையும் காக்கிறது.
- source_word: הִתְיַצְּבוּ
  choice: அசையாமல் நின்று
  rationale: Hitpael கட்டளை வடிவம் மக்கள் தங்கள் இடத்தில் உறுதியாக நின்று கவனிக்க வேண்டும் என அழைக்கிறது; சூழலில் நிகழவிருப்பதைப் பார்க்க அங்கேயே நிற்கும் கருத்து இயல்பாக வெளிப்படுகிறது.
- source_word: וּרְאוּ
  choice: பாருங்கள்
  rationale: நேரடியாகக் கண்கூடாகக் காணும்படி அழைக்கும் பன்மை கட்டளையை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: הַדָּבָר הַגָּדוֹל הַזֶּה
  choice: இந்த மாபெரும் செயல்
  rationale: דָּבָר என்பது ‘விஷயம்’, ‘நிகழ்வு’, ‘செயல்’ எனப் பரந்த பொருள் கொண்டது. இங்கு கடவுள் நிகழ்த்தும் அடையாளத்தைக் குறிப்பதால் ‘செயல்’ தெளிவாக இருக்கிறது; ‘மாபெரும்’ என்பது גָּדוֹל என்பதன் வலிமையைக் காக்கிறது.
- source_word: אֲשֶׁר יְהוָה עֹשֶׂה
  choice: யெகோவா செய்கிற
  rationale: עֹשֶׂה என்ற நிகழ்கால வினையெச்சம் செயலை நிகழ்ந்து கொண்டிருப்பதாக அல்லது உடனடியாக நிகழவிருப்பதாக உயிரோட்டத்துடன் காட்டுகிறது; தமிழின் ‘செய்கிற’ அந்த வடிவத்தைப் பாதுகாக்கிறது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: எபிரெயத் தனிப்பெயரான நான்கெழுத்துத் திருப்பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் பரவலாக அறியப்பட்ட ‘யெகோவா’ என்ற ஒலிபெயர்ப்பில் வழங்குகிறது.
- source_word: לְעֵינֵיכֶם
  choice: உங்கள் கண்முன்னே
  rationale: மக்கள் நேரடியாகவும் வெளிப்படையாகவும் காணவிருப்பதைச் சுட்டும் எபிரெய மரபுத்தொடரின் காட்சித்தன்மையை இயல்பான தமிழில் காக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யெகோவா
  alternative: கர்த்தர்; யாவே
  rationale: மூலத்தில் ஒரு பொதுப் பட்டம் அல்ல, கடவுளின் தனிப்பெயரான יהוה உள்ளது. ஆகவே அதை ‘கர்த்தர்’ என்று மாற்றாமல் ஒலிபெயர்க்கப்பட்டுள்ளது. உச்சரிப்பின் மீட்டுருவாக்கத்தில் நிலவும் வேறுபாட்டை அடிக்குறிப்பு வெளிப்படையாகக் குறிப்பிடுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் உரையின் கண்ணியமான, ஆணையிடும் தொனியையும் காக்கும் வகையிலும் வடிவமைக்கப்பட்டது. ‘அசையாமல் நின்று’ என்பது கட்டளையின் உடல் நிலை மற்றும் கவனநிலையை இணைக்கிறது; ‘கண்முன்னே’ பொதுவாகப் புரியும் உயிரோட்டமான மரபுத்தொடர்.
