  text: וַֽ/יִּשְׁכְּח֖וּ אֶת יְהוָ֣ה אֱלֹהֵי/הֶ֑ם וַ/יִּמְכֹּ֣ר אֹתָ֡/ם בְּ/יַ֣ד סִֽיסְרָא֩ שַׂר צְבָ֨א חָצ֜וֹר וּ/בְ/יַד פְּלִשְׁתִּ֗ים וּ/בְ/יַד֙ מֶ֣לֶךְ מוֹאָ֔ב וַ/יִּֽלָּחֲמ֖וּ בָּֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/009.yaml
  text: But they forgot Yahweh their God[a], and he sold them into the hand of Sisera, commander of the army of Hazor, and into the hand of the Philistines, and into the hand of the king of Moab; and they fought against them.
translation:
  language: ta
  text: ஆனால் அவர்கள் தங்கள் கடவுளாகிய யெகோவாவை மறந்தார்கள். அவர் அவர்களை ஆசோரின் படைத்தலைவனாகிய சிசெராவின் கையிலும், பெலிஸ்தியரின் கையிலும், மோவாபின் அரசனின் கையிலும் விற்றார்[a]. அவர்கள் இஸ்ரவேலருக்கு எதிராகப் போரிட்டார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்களை எதிரிகளின் அதிகாரத்துக்கு ஒப்புக்கொடுத்தார்.” எபிரெயத்தில் சொல்லுக்கு சொல், “அவர்களை விற்றார்”; இது ஒரு மக்களை அவர்களுடைய எதிரிகளின் அதிகாரத்துக்கு ஒப்புக்கொடுப்பதைக் குறிக்கும் உடன்படிக்கைத் தீர்ப்பின் சொல்லாட்சி.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכְּחוּ
  choice: மறந்தார்கள்
  rationale: שׁכח என்பதன் நேரடிப் பொருள் ‘மறத்தல்.’ உடன்படிக்கைச் சூழலில் புறக்கணிப்பு அல்லது விசுவாசமின்மையைக் குறிக்கக்கூடும்; எனினும் மூலத்தின் சொல்லாட்சியைப் பாதுகாக்க ‘மறந்தார்கள்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: இறைபெயராகிய நான்கு எழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் பரவலாக அறியப்பட்ட தனிப்பெயர் வடிவமான ‘யெகோவா’ என ஒலிபெயர்த்தது.
- source_word: אֱלֹהֵיהֶם
  choice: தங்கள் கடவுளாகிய
  rationale: மூன்றாம் நபர் பன்மை உடைமைப் பின்னொட்டையும் இஸ்ரவேலருக்கும் கடவுளுக்கும் உள்ள உறவையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: וַיִּמְכֹּר
  choice: விற்றுப்போட்டார்
  rationale: מכר என்பதன் அடிப்படை உருவகமான ‘விற்றல்’ பாதுகாக்கப்படுகிறது; இங்கு எதிரிகளின் அதிகாரத்துக்கு ஒப்புக்கொடுக்கும் உடன்படிக்கைத் தீர்ப்பைக் குறிக்கிறது.
- source_word: בְּיַד
  choice: கையில்
  rationale: அதிகாரம் அல்லது கட்டுப்பாட்டுக்குள் ஒப்புக்கொடுப்பதைக் குறிக்கும் எபிரெய உருவகத்தை தமிழிலும் புரியத்தக்க ‘கையில்’ என்ற வடிவில் பாதுகாக்கிறது.
- source_word: שַׂר צְבָא חָצוֹר
  choice: ஆசோரின் படைத்தலைவன்
  rationale: שַׂר צְבָא என்பது இராணுவத் தலைவரைக் குறிக்கிறது; தொடர்புச் சங்கிலியைச் சுருக்கமின்றி இயல்பான தமிழில் தருகிறது.
- source_word: וַיִּלָּחֲמוּ בָם
  choice: அவர்கள் இவர்களுக்கு எதிராகப் போரிட்டார்கள்
  rationale: பன்மை வினையின் எழுவாய் முன் குறிப்பிடப்பட்ட ஒடுக்குமுறை ஆட்சிகளாகவும், பன்மைச் சுட்டுப்பெயரின் குறிப்பு இஸ்ரவேலராகவும் இயல்பாகப் புரிகிறது; தமிழில் சுட்டுப்பெயர் குழப்பத்தைக் குறைக்க ‘இவர்களுக்கு’ பயன்படுத்தப்பட்டது.
theological_decisions:
- issue: ‘விற்றுப்போட்டார்’ என்பதன் எழுவாய்
  choice: மறைமுக ஒருமை எழுவாய் யெகோவா.
  alternative: செயப்பாட்டு வடிவில் ‘அவர்கள் விற்கப்பட்டார்கள்.’
  rationale: முந்தைய வாக்கியக்கூறு ‘தங்கள் கடவுளாகிய யெகோவா’ என்று குறிப்பிடுகிறது; தொடர்ந்து வரும் ஒருமை வினை இயல்பாக அவரையே எழுவாயாகக் கொண்டுள்ளது. இது உரையில் உள்ள நீதித்தீர்ப்பின் கடினத்தன்மையை மறைக்காமல் பாதுகாக்கிறது.
- issue: ‘யெகோவாவை மறந்தார்கள்’ என்பதன் வலிமை
  choice: உடன்படிக்கை விசுவாசமின்மையின் உட்பொருள் இருந்தாலும் ‘மறந்தார்கள்’ என்ற நேரடி சொல்லாட்சி.
  alternative: ‘யெகோவாவைக் கைவிட்டார்கள்’ அல்லது ‘புறக்கணித்தார்கள்.’
  rationale: சூழல் விசுவாசமின்மையை உணர்த்தினாலும், மூல வினை நேரடியாக ‘மறத்தல்’ என்கிறது; விளக்கமான வலிமையை முதன்மை உரைக்குள் சேர்க்காமல் மூலத்தின் பதற்றம் பாதுகாக்கப்பட்டது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. ‘கையில்’ மற்றும் ‘விற்றுப்போட்டார்’ ஆகிய மூல உருவகங்கள் பாதுகாக்கப்பட்டுள்ளன; இறுதி பன்மைச் சுட்டுப்பெயர்களின் குறிப்பு தமிழில் தெளிவாக இருக்க ‘இவர்களுக்கு’ பயன்படுத்தப்பட்டது.
