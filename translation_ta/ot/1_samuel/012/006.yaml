source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר שְׁמוּאֵ֖ל אֶל הָ/עָ֑ם יְהוָ֗ה אֲשֶׁ֤ר עָשָׂה֙ אֶת מֹשֶׁ֣ה וְ/אֶֽת אַהֲרֹ֔ן וַ/אֲשֶׁ֧ר הֶעֱלָ֛ה אֶת אֲבֹתֵי/כֶ֖ם מֵ/אֶ֥רֶץ מִצְרָֽיִם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/006.yaml
  text: Then Samuel said to the people[b][a], “Yahweh is the one who appointed Moses and Aaron and who brought your fathers up from the land of Egypt.”
translation:
  language: ta
  text: அப்போது சாமுவேல் மக்களிடம், “மோசேயையும் ஆரோனையும் நியமித்து[a], உங்கள் முன்னோர்களை[b] எகிப்து நாட்டிலிருந்து மேலே கொண்டுவந்தவர் யாவேதான்” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொற்சார்ந்து, “மோசேயையும் ஆரோனையும் செய்தவர்.” இங்கு அவர்களை அவர்களுடைய பணியில் ஏற்படுத்தியதை அல்லது நிலைநிறுத்தியதை இது குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: சொற்சார்ந்து, “உங்கள் தந்தையரை”; இங்கு “உங்கள் முன்னோர்களை” என்று பொருள் கொள்ளலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר שְׁמוּאֵל אֶל הָעָם
  choice: அப்போது சாமுவேல் மக்களிடம் ... என்றார்
  rationale: வாவ் தொடர் கதையின் அடுத்த நிகழ்வை முன்னெடுப்பதால், இயல்பான தமிழ் நடையில் ‘அப்போது’ என மொழிபெயர்க்கப்பட்டது; אמר என்பதற்கு ‘என்றார்’ என்பது நேரான பொருள்.
- source_word: יְהוָה
  choice: யாவே
  rationale: இது இறைவனின் தனிப்பெயரான நான்கு எழுத்துப் பெயர்; ஒரு பட்டப்பெயரால் மாற்றாமல் தமிழில் ஒலிபெயர்க்கப்பட்டது.
- source_word: אֲשֶׁר עָשָׂה אֶת מֹשֶׁה וְאֶת אַהֲרֹן
  choice: மோசேயையும் ஆரோனையும் நியமித்து
  rationale: עשה என்பதன் அடிப்படைப் பொருள் ‘செய்தார்’ என்றாலும், இங்கு மோசேயையும் ஆரோனையும் அவர்களுடைய தலைமைப் பணியில் ஏற்படுத்திய செயலைக் குறிக்கிறது. இயல்பான தமிழில் ‘நியமித்து’ எனத் தரப்பட்டு, சொற்சார்ந்த மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டது.
- source_word: וַאֲשֶׁר הֶעֱלָה
  choice: மேலே கொண்டுவந்தவர்
  rationale: עלה என்பதன் ஹிஃபில் வடிவிலுள்ள ‘மேலே கொண்டுவருதல்’ என்ற யாத்திராகமச் சொல்லாட்சியைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: אֶת אֲבֹתֵיכֶם
  choice: உங்கள் முன்னோர்களை
  rationale: אָבוֹת என்பது சொற்சார்ந்து ‘தந்தையர்’ என்றாலும், இச்சூழலில் முந்தைய தலைமுறையினரைக் குறிக்கிறது; நவீன தமிழில் ‘முன்னோர்கள்’ இயல்பாகவும் தெளிவாகவும் உள்ளது. சொற்சார்ந்த வடிவம் அடிக்குறிப்பில் தரப்பட்டது.
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: எகிப்து நாட்டிலிருந்து
  rationale: ‘எகிப்து நாட்டிலிருந்து’ என்பது மூலத்தின் אֶרֶץ מִצְרַיִם என்ற அமைப்பை நெருக்கமாகவும் இயல்பாகவும் பிரதிபலிக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் பட்டப்பெயர் அல்லாமல் இறைவனின் தனிப்பெயர் நேரடியாக உள்ளது; ஆகவே அந்தப் பெயர் ஒலிபெயர்க்கப்பட்டது.
- issue: மோசே, ஆரோன் தொடர்பாக עָשָׂה என்பதன் பொருள்
  choice: நியமித்து
  alternative: செய்து / ஏற்படுத்தி
  rationale: அவர்களை மனிதர்களாகப் படைத்ததை அல்ல, இஸ்ரவேலின் தலைவர்களாக நிலைநிறுத்திய இறைச்செயலைச் சூழல் குறிக்கிறது. எனினும் எபிரெயச் சொல்லின் பரந்த பொருள் அடிக்குறிப்பில் விடப்பட்டுள்ளது.
- issue: வினையில்லா எபிரெய அடையாள வாக்கியத்தின் வலியுறுத்தல்
  choice: யாவேதான்
  alternative: யாவே
  rationale: யாவேவையே இச்செயல்களின் கர்த்தாவாக அடையாளப்படுத்தும் வினையில்லா வாக்கியத்தின் வலியுறுத்தலைத் தமிழின் ‘தான்’ இயல்பாக வெளிப்படுத்துகிறது.
translation_notes:
  register: நவீன தரநிலைத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டது. எபிரெய வாக்கியத்தின் வலியுறுத்தல் ‘யாவேதான்’ என்பதால் வெளிப்படுத்தப்பட்டது; ‘மேலே கொண்டுவந்தவர்’ என்ற யாத்திராகமச் சொல்லாட்சி பாதுகாக்கப்பட்டது.
