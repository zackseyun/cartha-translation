base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/019.yaml
  text: 'Then all the people said to Samuel[a], “Pray to Yahweh your God for your servants, and do not let us die, for we have added to all our sins this evil: to ask for a king for ourselves.”'
translation:
  language: ta
  text: அப்போது மக்கள் அனைவரும் சாமுவேலிடம், “உமது அடியார்களான எங்களுக்காக, உமது கடவுளாகிய யாவேயிடம் நாங்கள் சாகாதபடி மன்றாடுங்கள். ஏனெனில், எங்களுக்காக ஒரு அரசனைக் கேட்ட இந்தத் தீமையை எங்கள் எல்லாப் பாவங்களுக்கும் மேலாகச் சேர்த்துக்கொண்டோம்” என்றார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִתְפַּלֵּל בְּעַד עֲבָדֶיךָ
  choice: உமது அடியார்களுக்காக ... மன்றாடும்
  rationale: התפלל என்பது ‘மன்றாடு/வேண்டிக்கொள்’ என்பதையும், בְּעַד என்பது பிறர் சார்பாகச் செய்யப்படும் பரிந்துரையையும் குறிக்கிறது. தமிழில் ‘அடியார்களுக்காக மன்றாடும்’ என்பது மக்களின் பணிவையும் பரிந்துரைச் சூழலையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைப்பெயரை ஒரு பட்டப்பெயரால் மாற்றாமல், எபிரேய நான்கெழுத்துப் பெயரின் வழக்கமான தமிழ் ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: אֱלֹהֶיךָ
  choice: உமது கடவுள்
  rationale: இரண்டாம் நபர் ஒருமை உரிமை விகுதியை நேரடியாகப் பாதுகாக்கிறது; ‘எங்கள் கடவுள்’ என்று மாற்றி உரையின் பதற்றத்தைத் தீர்க்கவில்லை.
- source_word: וְאַל נָמוּת
  choice: நாங்கள் சாகாதபடி வேண்டிக்கொள்ளும்
  rationale: எதிர்மறை வேண்டுதலின் நோக்கைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது. முன் வரும் மன்றாட்டுக் கட்டளையுடன் இணைத்து, மக்கள் மரணத்திலிருந்து காக்கப்பட வேண்டும் என்ற வேண்டுதலைத் தெளிவாக்குகிறது.
- source_word: יָסַפְנוּ עַל כָּל חַטֹּאתֵינוּ רָעָה
  choice: இந்தத் தீமையையும் எங்கள் எல்லாப் பாவங்களோடு சேர்த்துக்கொண்டோம்
  rationale: יסף על என்பதிலுள்ள ஏற்கெனவே உள்ள பாவங்களுக்கு மேலாக இன்னொன்றைச் சேர்த்துக் கொண்டோம் என்ற திரட்சிப் பொருளைப் பாதுகாக்கிறது; רָעָה என்பதன் அறவியல் தீவிரத்தை ‘தீமை’ தக்கவைக்கிறது.
- source_word: לִשְׁאֹל לָנוּ מֶלֶךְ
  choice: எங்களுக்கென்று ஓர் அரசனைக் கேட்ட
  rationale: לָנוּ என்பதன் தங்களுக்காக/தங்களுக்கென்று என்ற அழுத்தத்தையும், שאל என்பதன் ‘கேட்டல்’ பொருளையும் இயல்பான தமிழில் தருகிறது.
- source_word: כָל הָעָם
  choice: மக்கள் அனைவரும்
  rationale: கூட்டுமுழுமையை நவீனத் தமிழில் இயல்பாகக் குறிக்கிறது.
theological_decisions:
- issue: ‘உமது கடவுள்’ என்ற இரண்டாம் நபர் உறவுமுறை
  choice: உமது கடவுளாகிய யாவே
  alternative: எங்கள் கடவுளாகிய யாவே
  rationale: மக்கள் சாமுவேலைப் பரிந்துரையாளராக அணுகும் சொற்பயன்பாட்டையும் அதன் ஆன்மிகப் பதற்றத்தையும் காக்கிறது; யாவே இஸ்ரவேலின் கடவுள் அல்ல என்று இதனால் முடிவு செய்யப்படவில்லை.
- issue: அரசனைக் கேட்டது ‘தீமை’ எனப்படும் தன்மை
  choice: உரையில் உள்ளபடியே ‘இந்தத் தீமை’ என்று வழங்குதல்
  alternative: ‘இந்தத் தவறு’ என்று மென்மையாக்குதல்
  rationale: רָעָה என்பதன் அறவியல் எடையையும் மக்களின் குற்றஒப்புதலையும் தக்கவைக்கிறது; அரசாட்சி குறித்த விரிவான கோட்பாட்டை வசனத்திற்குள் சேர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான, கண்ணியமான தமிழ். சாமுவேலிடம் மக்கள் காட்டும் பணிவை வெளிப்படுத்த ‘உமது’, ‘அடியார்கள்’, ‘மன்றாடும்’ என்ற மரியாதை வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன. மூலத்தில் உண்மையான உரைமாற்று தேவைப்படாததால் அடிக்குறிப்பு சேர்க்கப்படவில்லை.
