  text: וְ/עַתָּ֗ה הִנֵּ֥ה הַ/מֶּ֛לֶךְ אֲשֶׁ֥ר בְּחַרְתֶּ֖ם אֲשֶׁ֣ר שְׁאֶלְתֶּ֑ם וְ/הִנֵּ֨ה נָתַ֧ן יְהוָ֛ה עֲלֵי/כֶ֖ם מֶֽלֶךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/013.yaml
  text: And now[a], here is the king whom you have chosen, whom you have asked for; and look, Yahweh has set a king over you.
translation:
  language: ta
  text: இப்போது, நீங்கள் தேர்ந்தெடுத்த, நீங்கள் வேண்டிக் கேட்ட அரசன் இதோ; பாருங்கள், யாவே உங்கள்மேல் ஓர் அரசனை வைத்திருக்கிறார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது, இன்னும் நேரடியாக: “யாவே உங்கள்மேல் ஓர் அரசனைக் கொடுத்திருக்கிறார்.”'
    reason: נתן என்பதன் நேரடிப் பொருளான ‘கொடு’ என்பதைப் பாதுகாக்கும் சொற்பொருள் மாற்று.
lexical_decisions:
- source_word: וְעַתָּה
  choice: இப்போது
  rationale: வசனத்தின் முடிவுரையை அறிமுகப்படுத்தும் கால–உரையாடல் குறிப்பை இயல்பான நவீனத் தமிழில் தருகிறது; எபிரெய இணைப்பின் தொடர்ச்சியும் சூழலில் வெளிப்படுகிறது.
- source_word: הִנֵּה
  choice: இதோ
  rationale: கேட்போரின் முன்னிலையில் இருக்கும் குறிப்பிட்ட அரசன்மீது கவனத்தைத் திருப்பும் சுட்டிடைச்சொல்லைச் சுருக்கமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: הַמֶּלֶךְ
  choice: அரசன்
  rationale: மக்கள் கேட்ட குறிப்பிட்ட நபரைக் குறிக்கும் definite noun; தமிழில் சூழலும் ‘இதோ’ என்பதும் அதன் குறிப்புத்தன்மையைத் தெளிவாக்குகின்றன.
- source_word: אֲשֶׁר בְּחַרְתֶּם
  choice: நீங்கள் தேர்ந்தெடுத்த
  rationale: בחר என்பதன் நேரடியான ‘தேர்ந்தெடு’ பொருளையும் மக்களின் முடிவுற்ற செயலையும் காக்கிறது; இறையியல் பதற்றத்தை வேறு சொல்லால் மென்மைப்படுத்தவில்லை.
- source_word: אֲשֶׁר שְׁאֶלְתֶּם
  choice: நீங்கள் கேட்டுக்கொண்ட
  rationale: இங்கு שׁאל என்பது ஒரு அரசனை வேண்டிக் கேட்டதைக் குறிக்கிறது. ‘கேட்டுக்கொண்ட’ என்பது வெறும் கேள்வி கேட்டதாகப் புரிந்துகொள்ளப்படுவதைத் தவிர்த்து கோரிக்கையின் பொருளை இயல்பாகத் தருகிறது.
- source_word: וְהִנֵּה
  choice: பாருங்கள்
  rationale: இரண்டாவது הִנֵּה மீண்டும் கவனத்தை ஈர்க்கிறது. முதல் இடத்தில் உள்ள ‘இதோ’ என்பதை அப்படியே மீளச் சொல்லாமல் அதன் வலியுறுத்தலைக் காக்கிறது.
- source_word: נָתַן יְהוָה
  choice: யாவே ... வைத்திருக்கிறார்
  rationale: נתן என்பதன் அடிப்படைப் பொருள் ‘கொடு’ என்றாலும், על மற்றும் ‘அரசன்’ என்பவற்றோடு இங்கு அதிகாரத்தில் ஒருவரை நிறுத்துதல்/அமர்த்துதல் என்ற பொருள் உண்டு. ‘வைத்திருக்கிறார்’ அந்த அமைப்பை நெருக்கமாகவும் இயல்பாகவும் தருகிறது; நேரடி மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய மெய்யெழுத்துப் பெயரான יהוה என்பதை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் வழக்கமான ஒலிபெயர்ப்பாகத் தருகிறது.
- source_word: עֲלֵיכֶם
  choice: உங்கள்மேல்
  rationale: அரசன் மக்கள்மீது செலுத்தும் ஆட்சியதிகார உறவை על இங்கு குறிக்கிறது.
- source_word: מֶלֶךְ
  choice: ஓர் அரசனை
  rationale: இரண்டாவது occurrence எபிரெயத்தில் article இன்றி வருகிறது. தமிழில் ‘ஓர்’ என்பது இயல்பான indefinite வடிவத்தையும் ஒலியோட்டத்தையும் தருகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூலத்தில் ஒரு பொதுப்பட்டம் அல்ல, உடன்படிக்கையின் தனிப்பெயரான יהוה நேரடியாக உள்ளது; ஆகவே அதை பட்டமாக மாற்றாமல் ஒலிபெயர்க்கப்பட்டுள்ளது.
- issue: மக்கள் அரசனைத் தேர்ந்தெடுத்ததாகக் கூறுதல்
  choice: நீங்கள் தேர்ந்தெடுத்த
  alternative: உங்களுக்காகத் தேர்ந்தெடுக்கப்பட்ட
  rationale: மூலத்தின் இரண்டாம் நபர் பன்மைச் செயப்பாட்டு வினையை அப்படியே காக்கிறது. சவுலை யார் தேர்ந்தெடுத்தார் என்ற விரிந்த கதைத் தொடர்பிலுள்ள பதற்றத்தை மொழிபெயர்ப்பு மறுபொருளாக்கவில்லை.
- issue: נתן என்பதன் ஆட்சிசார் பொருள்
  choice: வைத்திருக்கிறார்
  alternative: கொடுத்திருக்கிறார்
  rationale: על உடன் வரும் கட்டமைப்பு அரசனை மக்கள்மேல் ஆட்சியில் வைத்ததைக் குறிக்கலாம். அதேவேளையில் ‘கொடுத்தார்’ என்ற நேரடி பொருள் சாத்தியமாக இருப்பதால் அது அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் dignified நடையில் வடிவமைக்கப்பட்டது. ‘இதோ’ மற்றும் ‘பாருங்கள்’ ஆகியவை இரு הִנֵּה சொற்களின் கவன ஈர்ப்பு வேறுபாட்டைக் காக்கின்றன. தொடர்பெயர் அமைப்புகள் தமிழின் இயல்பான பெயரெச்சத் தொடராகச் சுருக்கப்பட்டுள்ளன.
