  rationale: மக்களின் தேர்வையும் வேண்டுகோளையும் தனித்தனி தொடர்பெயர் தொடர்களாகத் தெளிவாகக் கொடுத்துள்ளோம். இதனால் மூலத்தின் இணையான இரண்டு אֲשֶׁר-தொடர்களும், அவற்றின் நிறைவுற்ற கோரிக்கைப் பொருளும் காக்கப்படுகின்றன. யாவே என்ற பெயர், இரு கவனஈர்ப்பு கூறுகள் (‘இதோ’; ‘பாருங்கள்’), மற்றும் ‘அரசனை ... வைத்திருக்கிறார்’ என்ற ஆட்சிசார் நிறுவுதல் பொருள் மாற்றப்படவில்லை.
