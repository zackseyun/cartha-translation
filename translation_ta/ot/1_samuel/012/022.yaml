  text: כִּ֠י לֹֽא יִטֹּ֤שׁ יְהוָה֙ אֶת עַמּ֔/וֹ בַּ/עֲב֖וּר שְׁמ֣/וֹ הַ/גָּד֑וֹל כִּ֚י הוֹאִ֣יל יְהוָ֔ה לַ/עֲשׂ֥וֹת אֶתְ/כֶ֛ם ל֖/וֹ לְ/עָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/022.yaml
  text: For Yahweh will not forsake his people[a], for the sake of his great name[b], because Yahweh has been pleased to make you his people.
translation:
  language: ta
  text: ஏனெனில், யாவே தமது மகத்தான பெயரின் பொருட்டுத் தமது மக்களைக் கைவிடமாட்டார்[a]; ஏனெனில், உங்களைத் தமக்கென ஒரு மக்களாக ஆக்க யாவே மனமுவந்திருக்கிறார்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘விட்டுவிடமாட்டார்’ அல்லது ‘ஒதுக்கிவிடமாட்டார்.’
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘உங்களைத் தமக்கென ஒரு மக்களாக ஆக்க யாவே தேர்ந்தெடுத்தார்’ அல்லது ‘தீர்மானித்தார்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: יִטֹּשׁ
  choice: கைவிடமாட்டார்
  rationale: נטש என்பது இச்சூழலில் ஒரு மக்களை விட்டுவிடுதல் அல்லது புறக்கணித்தல் என்ற பொருளைக் கொண்டுள்ளது. ‘கைவிடமாட்டார்’ என்பது நவீன தமிழில் இயல்பாகவும் உடன்படிக்கை சார்ந்த கருத்தின் வலிமையைத் தக்கவைத்தும் உள்ளது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைத் திருப்பெயரான יהוה ஒரு பட்டப்பெயரால் மாற்றப்படாமல், தமிழில் தெளிவாக ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: עַמּוֹ
  choice: தமது மக்கள்
  rationale: עַם இங்கு யாவேயுடன் உறவுடைய உடன்படிக்கை மக்களைக் குறிக்கிறது. மரியாதை ஒருமையைப் பேண ‘தமது மக்கள்’ என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: בַּעֲבוּר
  choice: பொருட்டு
  rationale: இச்சொல் செயல் நிகழ்வதற்கான காரணம் அல்லது நோக்குக் கருத்தை வெளிப்படுத்துகிறது; ‘பெயரின் பொருட்டு’ என்பது எபிரேயச் சொல்லாட்சியை இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: שְׁמוֹ הַגָּדוֹל
  choice: தமது மகத்தான பெயர்
  rationale: தேவனுடைய வெளிப்படுத்தப்பட்ட புகழையும் மாண்பையும் குறிக்கும் ‘பெயர்’ என்ற எபிரேய உருவகத்தை நேரடியாகப் பேணுகிறது.
- source_word: הוֹאִיל
  choice: மனமுவந்தார்
  rationale: הוֹאִיל இங்கு விருப்பத்துடனான தீர்மானம் அல்லது இசைவை வெளிப்படுத்துகிறது. ‘மனமுவந்தார்’ என்பது அருளுள்ள தன்னார்வத்தையும் முடிவையும் இயல்பான தமிழில் தருகிறது.
- source_word: לַעֲשׂוֹת אֶתְכֶם לוֹ לְעָם
  choice: உங்களைத் தமக்கென ஒரு மக்களாக்க
  rationale: לוֹ என்பதிலுள்ள ‘தமக்காக/தமக்குரியவர்களாக’ என்ற கருத்தையும், இஸ்ரவேலைத் தமது மக்களாக அமைத்த செயலையும் வெளிப்படையாகப் பேணுகிறது.
theological_decisions:
- issue: יהוה என்ற இறைத் திருப்பெயரின் மொழியாக்கம்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூல உரை இறைவனின் தனிப்பட்ட உடன்படிக்கைப் பெயரைப் பயன்படுத்துவதால், அதை ஒரு பட்டப்பெயரால் மாற்றாமல் ஒலிபெயர்ப்பது மூலத்தின் வேறுபாட்டைப் பேணுகிறது.
- issue: הוֹאִיל வெளிப்படுத்தும் இறை விருப்பத்தின் நுட்பம்
  choice: மனமுவந்தார்
  alternative: தேர்ந்தெடுத்தார்; தீர்மானித்தார்
  rationale: இச்சொல் வெறும் தேர்வை மட்டுமல்லாமல் விருப்பத்துடன் முன்வந்து ஏற்றுக்கொண்ட தீர்மானத்தையும் குறிக்கலாம். ஒரு குறிப்பிட்ட இறையியல் கோட்பாட்டை உரைக்குள் சேர்க்காமல் அந்த நுட்பம் தக்கவைக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் dignified நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. யாவேயைக் குறிக்கும் சுட்டுப்பெயர்களில் மரியாதை ஒருமை பயன்படுத்தப்பட்டுள்ளது; எபிரேயத்தின் உடன்படிக்கை சார்ந்த ‘மக்கள்,’ ‘பெயர்’ ஆகிய உருவகங்கள் தக்கவைக்கப்பட்டுள்ளன.
