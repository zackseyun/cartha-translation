- from: ஏனெனில், யாவே தமது மகத்தான பெயரின் பொருட்டுத் தமது மக்களைக் கைவிடமாட்டார்[a]; உங்களைத் தமக்கென ஒரு மக்களாக்க யாவே மனமுவந்தார்[b].
  to: ஏனெனில், யாவே தமது மகத்தான பெயரின் பொருட்டுத் தமது மக்களைக் கைவிடமாட்டார்[a]; ஏனெனில், உங்களைத் தமக்கென ஒரு மக்களாக ஆக்க யாவே மனமுவந்திருக்கிறார்[b].
  rationale: The revision explicitly translates both occurrences of כִּי, retaining the Hebrew causal structure. It also makes a minor idiomatic adjustment to the infinitival phrase while preserving the sense that Yahweh willingly made Israel a people for himself. Footnote markers remain attached to the corresponding terms and alternatives.
