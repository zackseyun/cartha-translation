- from: 'இதோ, நான் இங்கே இருக்கிறேன். யாவே முன்னிலையிலும் அவர் அபிஷேகம் செய்தவரின் முன்னிலையிலும் எனக்கு எதிராகச் சாட்சி கூறுங்கள்: யாருடைய எருதை நான் எடுத்துக்கொண்டேன்? யாருடைய கழுதையை நான் எடுத்துக்கொண்டேன்? யாரை ஒடுக்கினேன்? யாரை நசுக்கினேன்[a]? யாருடைய கையிலிருந்து கையூட்டு[b] வாங்கி, அதனால் என் கண்களை மூடிக்கொண்டேன்? நான் உங்களுக்குத் திருப்பிக் கொடுப்பேன்.


