  text: הִנְ/נִ֣י עֲנ֣וּ בִ/י֩ נֶ֨גֶד יְהוָ֜ה וְ/נֶ֣גֶד מְשִׁיח֗/וֹ אֶת שׁוֹר֩ מִ֨י לָקַ֜חְתִּי וַ/חֲמ֧וֹר מִ֣י לָקַ֗חְתִּי וְ/אֶת מִ֤י עָשַׁ֨קְתִּי֙ אֶת מִ֣י רַצּ֔וֹתִי וּ/מִ/יַּד מִי֙ לָקַ֣חְתִּי כֹ֔פֶר וְ/אַעְלִ֥ים עֵינַ֖/י בּ֑/וֹ וְ/אָשִׁ֖יב לָ/כֶֽם־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/003.yaml
  text: 'Here I am[a]; testify against me before Yahweh and before his anointed: whose ox have I taken, or whose donkey have I taken? Whom have I oppressed? Whom have I mistreated? From whose hand have I taken a bribe[b], that I should hide my eyes with it? I will restore it to you.'
translation:
  language: ta
  text: 'இதோ, நான் இங்கே இருக்கிறேன்; யாவேக்கும் அவர் அபிஷேகம் செய்தவருக்கும் முன்பாக எனக்கு எதிராகச் சாட்சி கூறுங்கள்: யாருடைய எருதை நான் எடுத்துக்கொண்டேன்? யாருடைய கழுதையை நான் எடுத்துக்கொண்டேன்? யாரை ஒடுக்கினேன்? யாரை நசுக்கினேன்[a]? யாருடைய கையிலிருந்து கையூட்டு[b] வாங்கி, அதனால் என் கண்களை மூடிக்கொண்டேன்? நான் உங்களுக்குத் திருப்பிக் கொடுப்பேன்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யாருக்குத் தீங்கிழைத்தேன்?” இங்கு பயன்படுத்தப்பட்டுள்ள எபிரெய வினைச்சொல்லின் பொருள் தெளிவாக இல்லை; ஒருவரைக் கடுமையாக நடத்துவதையோ துன்புறுத்துவதையோ இது பொதுவாகக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “கையூட்டு” என்பதற்கான எபிரெயச் சொல் “மீட்புத்தொகை” அல்லது “பணம்” என்றும் பொருள்படலாம். ஆனால் அதைப் பெற்றதால் கண்களை மூடிக்கொள்வதாகக் கூறப்படும் இச்சூழல், நீதியைப் புரட்டும் முறைகேடான பணத்தையே குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנְנִי
  choice: இதோ, நான் இங்கே இருக்கிறேன்
  rationale: பொதுமக்கள் முன் தம்மை விசாரணைக்காக வெளிப்படையாக நிறுத்தும் சாமுவேலின் உரையை இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: עֲנוּ בִי
  choice: எனக்கு எதிராகச் சாட்சி கூறுங்கள்
  rationale: யாவே மற்றும் அபிஷேகம் செய்யப்பட்ட அரசன் முன்னிலையில் நடைபெறும் சட்டப்பூர்வமான பொதுச் சாட்சியின் நுட்பத்தை வெளிப்படுத்துகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய மூலத்தில் நேரடியாக வரும் இறைத் திருப்பெயரைத் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: מְשִׁיחוֹ
  choice: அவர் அபிஷேகம் செய்தவர்
  rationale: உடனடிச் சூழலில் அபிஷேகம் செய்யப்பட்ட அரசனைக் குறிக்கிறது; பின்னாளைய ‘மேசியா’ என்னும் சிறப்புப் பட்டத்தை இங்கு திணிக்கவில்லை.
- source_word: שׁוֹר
  choice: எருது
  rationale: சொத்துரிமைச் சூழலில் குறிப்பிடப்படும் ஒற்றை மாட்டினத்திற்கான துல்லியமான, வழக்கில் புரியக்கூடிய சொல்.
- source_word: עָשַׁקְתִּי
  choice: ஒடுக்கினேன்
  rationale: சமூக அல்லது பொருளாதாரச் சுரண்டல் உட்பட விரிந்த அநீதியைச் சுட்டும் வினையின் வலிமையைப் பேணுகிறது.
- source_word: רַצּוֹתִי
  choice: நசுக்கினேன்
  rationale: பொருள் கடினமான இவ்வினையின் தீவிரமான உருவக வலிமையைப் பேணுவதோடு, முந்தைய ‘ஒடுக்கினேன்’ என்பதிலிருந்து வேறுபடுத்துகிறது; பரந்த மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: כֹּפֶר
  choice: கையூட்டு
  rationale: இந்தச் சொல் மீட்புத்தொகை அல்லது ஈட்டுத்தொகையையும் குறிக்கலாம்; ஆனால் பணத்தைப் பெற்றுக்கொண்டு கண்களை மூடிக்கொள்ளும் நீதித்துறைச் சூழலில் ‘கையூட்டு’ மிகவும் பொருத்தமானது.
- source_word: אַעְלִים עֵינַי בּוֹ
  choice: அதனால் என் கண்களை மூடிக்கொண்டேன்
  rationale: முறைகேடான பணத்தினால் அநீதியைக் கண்டும் காணாதிருப்பதைக் குறிக்கும் மூலத்தின் கண் சார்ந்த உருவகத்தைப் பேணுகிறது.
- source_word: וְאָשִׁיב לָכֶם
  choice: நான் உங்களுக்குத் திருப்பிக் கொடுப்பேன்
  rationale: மூலத்தில் வெளிப்படையாகக் கூறப்படாத செயப்படுபொருளைச் சேர்க்காமல், இழப்பை ஈடுசெய்யத் தயாராக இருப்பதை இயல்பாகத் தருகிறது.
theological_decisions:
- issue: יְהוָה என்னும் இறைத் திருப்பெயர்
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூல எபிரெய உரை பொதுப்பட்டத்தை அல்ல, உடன்படிக்கையின் தனிப்பட்ட இறைத் திருப்பெயரையே பயன்படுத்துகிறது.
- issue: מְשִׁיחוֹ என்பதன் அரசியல்-வரலாற்றுப் பொருள்
  choice: அவர் அபிஷேகம் செய்தவர்
  alternative: அவருடைய மேசியா
  rationale: இங்கு நேரடியாகக் குறிக்கப்படுபவர் அபிஷேகம் செய்யப்பட்ட அரசன். ‘மேசியா’ என்று பெயர்ப்பது பின்னாளைய கிறிஸ்தவச் சிறப்புப் பொருளை தேவையின்றி முன்னிறுத்தக்கூடும்.
- issue: רַצּוֹתִי என்னும் கடினமான வினையின் பொருள்
  choice: நசுக்கினேன்
  alternative: தீங்கிழைத்தேன் / துன்புறுத்தினேன்
  rationale: மூலத்தின் தீவிரத்தையும் முந்தைய வினையிலிருந்து உள்ள வேறுபாட்டையும் முதன்மை உரை பேணுகிறது; அதன் நிச்சயமற்ற பரந்த பொருள் அடிக்குறிப்பில் வெளிப்படையாக வைக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளக்கூடிய அதேவேளையில் நீதிமன்றத் தன்மையும் பொதுப் பொறுப்புணர்வும் வெளிப்படும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. தொடர்ச்சியான கேள்விகள் மூலத்தின் விசாரணைத் தொனியைப் பேணுகின்றன; கடினமான எபிரெயச் சொற்களின் நிச்சயமின்மை அடிக்குறிப்புகளில் மறைக்காமல் தரப்பட்டுள்ளது.
