    [b] “கையூட்டு” என்பதற்கான எபிரெயச் சொல் “மீட்புத்தொகை” அல்லது “ஈட்டுத்தொகை” என்றும் பொருள்படலாம். ஆனால் அதைப் பெற்றதால் கண்களை மூடிக்கொள்வதாகக் கூறப்படும் இச்சூழல், நீதியைப் புரட்டும் முறைகேடான பணத்தையே குறிக்கிறது.'
  to: 'இதோ, நான் இங்கே இருக்கிறேன்; யாவேக்கும் அவர் அபிஷேகம் செய்தவருக்கும் முன்பாக எனக்கு எதிராகச் சாட்சி கூறுங்கள்: யாருடைய எருதை நான் எடுத்துக்கொண்டேன்? யாருடைய கழுதையை நான் எடுத்துக்கொண்டேன்? யாரை ஒடுக்கினேன்? யாரை நசுக்கினேன்[a]? யாருடைய கையிலிருந்து கையூட்டு[b] வாங்கி, அதனால் என் கண்களை மூடிக்கொண்டேன்? நான் உங்களுக்குத் திருப்பிக் கொடுப்பேன்.'
