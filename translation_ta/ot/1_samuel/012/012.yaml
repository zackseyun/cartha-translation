  text: וַ/תִּרְא֗וּ כִּֽי נָחָ֞שׁ מֶ֣לֶךְ בְּנֵֽי עַמּוֹן֮ בָּ֣א עֲלֵי/כֶם֒ וַ/תֹּ֣אמְרוּ לִ֔/י לֹ֕א כִּי מֶ֖לֶךְ יִמְלֹ֣ךְ עָלֵ֑י/נוּ וַ/יהוָ֥ה אֱלֹהֵי/כֶ֖ם מַלְכְּ/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/012.yaml
  text: When you saw that Nahash king of the Ammonites was coming against you[a], you said to me, ‘No, but a king shall reign over us’—though Yahweh your God was your king.
translation:
  language: ta
  text: அம்மோனியரின் அரசன் நாகாஸ் உங்களுக்கு எதிராக வருவதைக் கண்டபோது, நீங்கள் என்னிடம், ‘இல்லை, அதற்கு பதிலாக ஓர் அரசன் எங்களை ஆள வேண்டும்’ என்று சொன்னீர்கள். ஆனால் உங்கள் கடவுளாகிய யெகோவாவே உங்கள் அரசராக இருந்தார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “உங்கள் கடவுளாகிய யெகோவாவே உங்கள் அரசராக இருக்கிறார்” என்றும் மொழிபெயர்க்கலாம். எபிரெய வாக்கியத்தில் வெளிப்படையான வினைச்சொல் இல்லாததால், சூழலின் அடிப்படையில் கடந்தகாலத்தையோ நிகழ்காலத்தையோ சேர்த்துப் புரிந்துகொள்ளலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: וַתִּרְאוּ כִּי
  choice: …வருவதைக் கண்டபோது
  rationale: וַתִּרְאוּ என்பதன் நிகழ்வுக்காலச் சூழலையும், כִּי அறிமுகப்படுத்தும் பார்த்ததன் உள்ளடக்கத்தையும் இயல்பான தமிழில் இணைக்கிறது.
- source_word: נָחָשׁ מֶלֶךְ בְּנֵי עַמּוֹן
  choice: அம்மோனியரின் அரசனான நாகாஸ்
  rationale: இன-தேசியப் பொருளில் בְּנֵי עַמּוֹן என்பதை இயல்பாக ‘அம்மோனியர்’ என்றும், நபர்பெயரை ஒலிபெயர்த்தும் வழங்குகிறது.
- source_word: בָּא עֲלֵיכֶם
  choice: உங்களுக்கு எதிராக வருவதைக்
  rationale: போர்ச் சூழலில் בוא + עַל குறிக்கும் பகைமையான முன்னேற்றத்தைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: לֹא כִּי
  choice: இல்லை;
  rationale: மக்கள் முன்வைக்கும் வலியுறுத்தலான மறுப்பைத் தமிழில் இயல்பாகக் காட்டுகிறது; அடுத்து வரும் கோரிக்கையின் முரணை சூழல் தெளிவாக்குகிறது.
- source_word: מֶלֶךְ יִמְלֹךְ עָלֵינוּ
  choice: ஓர் அரசன் எங்களை ஆள வேண்டும்
  rationale: ஒரு மனித அரசன் தங்களை ஆள வேண்டும் என்ற மக்களின் உறுதியான கோரிக்கையை நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: וַיהוָה אֱלֹהֵיכֶם
  choice: ஆனால் உங்கள் கடவுளாகிய யெகோவாவே
  rationale: וַ என்னும் முரண்பாட்டை ‘ஆனால்’ எனவும், இறைநாமமான יהוה என்பதை பெயராக ‘யெகோவா’ எனவும் தருகிறது; ‘-வே’ மக்கள் நிராகரித்திருந்த உண்மையான அரசரை வலியுறுத்துகிறது.
- source_word: מַלְכְּכֶם
  choice: உங்கள் அரசராக இருந்தார்
  rationale: எபிரெய மொழியில் வெளிப்படையான வினைச்சொல் இல்லாத போதிலும், கடந்தகால நிகழ்வைச் சாமுவேல் நினைவூட்டும் சூழலுக்கு ‘இருந்தார்’ பொருந்துகிறது.
theological_decisions:
- issue: וַיהוָה אֱלֹהֵיכֶם מַלְכְּכֶם என்ற வினையற்ற வாக்கியத்தின் காலம்
  choice: உங்கள் அரசராக இருந்தார்
  alternative: உங்கள் அரசராக இருக்கிறார்
  rationale: மக்கள் மனித அரசனைக் கேட்ட நேரத்தில் நிலவிய உண்மையைச் சாமுவேல் எடுத்துரைப்பதால் கடந்தகால வாசிப்பு முதன்மை உரையில் பொருத்தமாகிறது. ஆயினும், எபிரெய வாக்கியத்தில் காலத்தைச் சுட்டும் வெளிப்படையான வினை இல்லை; தொடரும் நிகழ்கால வாசிப்பையும் அடிக்குறிப்பில் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. ‘ராஜா’ என்பதற்குப் பதில் இயல்பான ‘அரசன்/அரசர்’ பயன்படுத்தப்பட்டுள்ளது; இறைவனைக் குறிக்க மரியாதைப் பன்மை வினை வடிவம் வழங்கப்பட்டுள்ளது.
