  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וְ/אִם הָרֵ֖עַ תָּרֵ֑עוּ גַּם אַתֶּ֥ם גַּֽם מַלְכְּ/כֶ֖ם תִּסָּפֽוּ־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/025.yaml
  text: But if you persist in doing evil[b][a], both you and your king will be swept away.
translation:
  language: ta
  text: ஆனால் நீங்கள் தொடர்ந்து தீமை செய்தால்[a], நீங்களும் உங்கள் அரசனும் அழிந்துபோவீர்கள்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தீமை செய்தால்” அல்லது “பொல்லாப்பாக நடந்துகொண்டால்.” எபிரெய மொழியில் ஒரே வினை வலியுறுத்தும் அமைப்பில் பயன்படுத்தப்பட்டுள்ளது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அழிக்கப்படுவீர்கள்” அல்லது “அடியோடு அகற்றப்படுவீர்கள்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: ஆனால் ... செய்தால்
  rationale: முந்தைய வாக்குறுதியுடன் முரண்படும் நிபந்தனையை இயல்பான தமிழில் தெரிவிக்கிறது; எபிரெயச் சொற்களின் நேரடிப் பொருள் ‘மேலும்/மற்றும், என்றால்’ என்பதாக இருந்தாலும், இங்கு ‘ஆனால்’ என்ற எதிர்மறை இணைப்பு பொருத்தமானது.
- source_word: הָרֵעַ תָּרֵעוּ
  choice: தொடர்ந்து தீமை செய்தால்
  rationale: רעע வினையின் வினையெச்ச முழுவடிவமும் முற்றுவினையும் சேர்ந்த அமைப்பு செயலுக்கு வலியுறுத்தல் அளிக்கிறது. ‘தொடர்ந்து’ என்பது அந்த வலியுறுத்தலை இயல்பான தமிழில் வெளிப்படுத்துகிறது; இருப்பினும் தொடர்ச்சியே அதன் ஒரே சாத்தியமான நுண்பொருள் அல்ல என்பதால் அடிக்குறிப்பு தரப்பட்டுள்ளது.
- source_word: גַּם אַתֶּם גַּם מַלְכְּכֶם
  choice: நீங்களும் உங்கள் அரசனும்
  rationale: இருமுறை வரும் גַּם மக்களும் அவர்களுடைய அரசனும் எச்சரிக்கைக்குள் அடங்குவதைத் தெளிவுபடுத்துகிறது. ‘நீங்களும் ... அரசனும்’ என்பது தமிழில் இயல்பாக அந்த இணைப்பைத் தக்கவைக்கிறது.
- source_word: תִּסָּפוּ
  choice: அழிந்துபோவீர்கள்
  rationale: ספה என்பதன் நிஃபால் வடிவம் தீர்ப்பில் அகற்றப்படுதல், அழிக்கப்படுதல் அல்லது அழிந்துபோதல் ஆகிய பொருட்களை ஏற்கக்கூடும். ‘அழிந்துபோவீர்கள்’ என்பது தீர்ப்பின் தீவிரத்தைக் காட்டுகிறது; அதன் துல்லியமான விதத்தைச் சுருக்கிக் கட்டுப்படுத்தவில்லை.
theological_decisions:
- issue: மக்களுக்கும் அரசனுக்கும் அறிவிக்கப்படும் தீர்ப்பின் தன்மை
  choice: மக்களையும் அவர்களுடைய அரசனையும் ஒன்றாகச் சேர்த்துக் கூறும் பரந்த இறைத்தீர்ப்பு அல்லது அகற்றப்படுதல் பற்றிய எச்சரிக்கை
  alternative: இராணுவத் தோல்வி மட்டும்; அல்லது ஆவிக்குரிய அழிவு மட்டும்
  rationale: இந்த வசனம் தீர்ப்பு எந்த வடிவில் நிகழும் என்று குறிப்பாகச் சொல்லவில்லை. ஆகவே மொழிபெயர்ப்பு அதன் தீவிரத்தைக் காக்கிறது; ஆனால் அதை ஓர் குறிப்பிட்ட தீர்ப்பு முறையாக வரையறுக்கவில்லை.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டுள்ளது. ‘அரசன்’ என்பது מלך என்பதற்கான இயல்பான பொதுத் தமிழ் சொல். வினையின் வலியுறுத்தலும் தீர்ப்புச் சொல்லின் பொருள் பரப்பும் அடிக்குறிப்புகளில் பாதுகாக்கப்பட்டுள்ளன.
