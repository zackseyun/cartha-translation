  text: וַ/יִּקְרָ֤א שְׁמוּאֵל֙ אֶל יְהוָ֔ה וַ/יִּתֵּ֧ן יְהוָ֛ה קֹלֹ֥ת וּ/מָטָ֖ר בַּ/יּ֣וֹם הַ/ה֑וּא וַ/יִּירָ֨א כָל הָ/עָ֥ם מְאֹ֛ד אֶת יְהוָ֖ה וְ/אֶת שְׁמוּאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/018.yaml
  text: Then Samuel called to Yahweh[a], and Yahweh sent thunder and rain that day; and all the people greatly feared Yahweh and Samuel.
translation:
  language: ta
  text: அப்போது சாமுவேல் யாவேவை நோக்கிக் கூப்பிட்டார். அந்த நாளில் யாவே இடிமுழக்கங்களையும்[a] மழையையும் அனுப்பினார். மக்கள் அனைவரும் யாவேவுக்கும் சாமுவேலுக்கும் மிகவும் பயந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் நேரடியாக ‘குரல்கள்’ அல்லது ‘ஒலிகள்’; புயல் சூழலில் இது இடிமுழக்கங்களைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא ... אֶל יְהוָה
  choice: யாவேவை நோக்கிக் கூப்பிட்டார்
  rationale: קרא אל என்பது இங்கு யாவேவிடம் வேண்டுதலாகக் கூப்பிடுவதைக் குறிக்கிறது. ‘நோக்கிக் கூப்பிட்டார்’ என்பது அதன் நேரடியான திசையையும் ஜெபச் சூழலையும் இயல்பாகப் பாதுகாக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய தனிப்பெயரான יהוה-ஐ ஒரு பட்டப்பெயரால் மாற்றாமல், தமிழில் இயல்பான ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: וַיִּתֵּן
  choice: அனுப்பினார்
  rationale: சொற்பொருளில் ‘கொடுத்தார்’ என்றாலும், புயல் சார்ந்த இச்சூழலில் இடிமுழக்கத்தையும் மழையையும் நிகழச் செய்தார் என்பதைக் ‘அனுப்பினார்’ இயல்பாகத் தெரிவிக்கிறது.
- source_word: קֹלוֹת
  choice: இடிமுழக்கங்கள்
  rationale: קוֹל என்பதன் அடிப்படைப் பொருள் ‘குரல்/ஒலி’; ஆனால் மழையுடன் வரும் வானிலைச் சூழலில் பன்மையான קֹלוֹת இடிமுழக்கங்களைக் குறிக்கிறது. மூலத்தின் பன்மையும் பாதுகாக்கப்படுகிறது.
- source_word: וּמָטָר
  choice: மழை
  rationale: מָטָר என்பதன் நேரான பொருள் ‘மழை’; மூலத்தில் இல்லாத தீவிரத்தைச் சேர்க்கவில்லை.
- source_word: בַּיּוֹם הַהוּא
  choice: அந்த நாளில்
  rationale: குறிப்பிட்ட நாளைச் சுட்டும் எபிரெய சொற்றொடரின் இயல்பான தமிழ் வடிவம்.
- source_word: וַיִּירָא ... מְאֹד
  choice: மிகவும் பயந்தார்கள்
  rationale: ירא இங்கு தெய்வீக அடையாளத்தால் ஏற்பட்ட பயத்தைக் குறிக்கிறது; מְאֹד அதன் தீவிரத்தை வலுப்படுத்துகிறது.
- source_word: כָל הָעָם
  choice: மக்கள் அனைவரும்
  rationale: மக்கள் முழுவதையும் உள்ளடக்கும் கூட்டுப் பொருளை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: אֶת יְהוָה וְאֶת שְׁמוּאֵל
  choice: யாவேவுக்கும் சாமுவேலுக்கும்
  rationale: ஒரே ירא வினையின் இரு நேர்பொருள்களையும் இணையாக வைத்துப், மூலத்தில் உள்ள பதற்றத்தை விளக்கித் தீர்க்காமல் பாதுகாக்கிறது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரை வழங்குதல்
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலத்தில் வரும் உடன்படிக்கைத் தனிப்பெயரைப் பட்டப்பெயராக மாற்றாமல் ஒலிபெயர்த்து வழங்குகிறது.
- issue: யாவேவுக்கும் சாமுவேலுக்கும் மக்கள் பயந்ததாகக் கூறுதல்
  choice: இருவருக்கும் ஒரே ‘பயந்தார்கள்’ என்ற வினையைப் பயன்படுத்துதல்
  alternative: யாவேவுக்குப் பயந்து, சாமுவேலை மதித்தார்கள்
  rationale: எபிரெயத்தில் ஒரே வினை இரு பொருள்களோடும் வருகிறது. இருவரின் நிலை சமம் என்று சேர்த்துக் கூறாமலும், பயம் மற்றும் மரியாதை எனப் பிரித்து மூலத்தின் இறையியல் பதற்றத்தைத் தீர்க்காமலும் அந்த அமைப்பு பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான நடை. எபிரெய தொடர் வாக்கிய அமைப்பு தமிழில் இயல்பாக மூன்று வாக்கியங்களாகப் பிரிக்கப்பட்டுள்ளது; பொருள் உறவுகள் பாதுகாக்கப்பட்டுள்ளன.
