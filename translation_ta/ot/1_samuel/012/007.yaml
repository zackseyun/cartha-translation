revisions:
- from: ஆகையால் இப்போது, நீங்கள் முன்வந்து நில்லுங்கள். யாவே உங்களுக்கும் உங்கள் மூதாதையருக்கும் செய்த நீதியான செயல்கள்[b] அனைத்தையும் குறித்து, அவருடைய முன்னிலையில் உங்களோடு நான் வழக்காடுவேன்[a].
  to: எனவே இப்போது, நில்லுங்கள்; யாவே முன்னிலையில், யாவே உங்களுக்கும் உங்கள் மூதாதையருக்கும் செய்த நீதியான செயல்கள்[b] அனைத்தைக் குறித்து நான் உங்களோடு வழக்காடுவேன்[a].
