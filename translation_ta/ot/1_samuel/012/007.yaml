  text: Now therefore[a], stand here[b], and I will contend with you before Yahweh concerning all the righteous acts of Yahweh that he did for you and for your fathers.
translation:
  language: ta
  text: எனவே இப்போது, நில்லுங்கள்; யாவே முன்னிலையில், யாவே உங்களுக்கும் உங்கள் மூதாதையருக்கும் செய்த நீதியான செயல்கள்[b] அனைத்தைக் குறித்து நான் உங்களோடு வழக்காடுவேன்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘உங்களை நான் நியாயந்தீர்ப்பேன்,’ ‘உங்களோடு நியாயம் பேசுவேன்,’ அல்லது ‘உங்களிடம் என் வழக்கை எடுத்துரைப்பேன்’ என்றும் மொழிபெயர்க்கலாம். எபிரேயச் சொற்றொடர், யாவே முன்னிலையில் ஒரு வழக்கில் ஈடுபடும் நீதிமன்றத் தன்மையைக் கொண்டுள்ளது.
    reason: lexical_alternative
  - marker: b
    text: ‘நீதியான செயல்கள்’ என்பது யாவே தமது மக்களுக்காகச் செய்த நீதியும் உடன்படிக்கை உண்மைத்தன்மையும் கொண்ட செயல்களைக் குறிக்கிறது.
    reason: cultural_note
lexical_decisions:
- source_word: וְעַתָּה
  choice: ஆகையால் இப்போது
  rationale: இது சாமுவேலின் உரையில் காலத்தைக் குறிப்பதோடு, முன் கூறியவற்றிலிருந்து ஒரு முடிவுக்கும் முறையான விசாரணைக்கும் மாறுவதைக் காட்டுகிறது.
- source_word: הִתְיַצְּבוּ
  choice: முன்வந்து நில்லுங்கள்
  rationale: ஹித்பயேல் பன்மை கட்டளை வடிவம்; முறையான விசாரணைக்காகத் தங்கள் இடத்தை எடுத்துக்கொள்ளுமாறு அழைக்கிறது. தமிழ் வாசகருக்கு இயல்பாக இருக்கவும், வெறும் ‘நில்லுங்கள்’ என்பதைக் காட்டிலும் இச்சூழலை வெளிப்படுத்தவும் இவ்வாறு மொழிபெயர்க்கப்பட்டது.
- source_word: וְאִשָּׁפְטָה אִתְּכֶם
  choice: உங்களோடு நான் வழக்காடுவேன்
  rationale: שפט என்ற வினை இச்சூழலில் தீர்ப்பளிப்பதை மட்டும் அல்லாமல், யாவே முன்னிலையில் ஒரு வழக்கை எடுத்துரைத்து விவாதிக்கும் நீதிமன்றத் தன்மையையும் கொண்டுள்ளது. ‘வழக்காடுவேன்’ அந்தச் சட்டப்பூர்வ நிழலைப் பாதுகாக்கிறது.
- source_word: לִפְנֵי יְהוָה
  choice: யாவே ... முன்னிலையில்
  rationale: உடன்படிக்கை மற்றும் நீதிவிசாரணைச் சூழலில் ஒருவரின் முன்னிலையில் நடைபெறுவதைக் குறிக்கும் வழக்கமான எபிரெய வெளிப்பாடு.
- source_word: יְהוָה
  choice: யாவே
  rationale: திருநாமமாகிய நான்கு எழுத்துப் பெயரை பொதுப்பட்டமான ‘ஆண்டவர்’ என்று மாற்றாமல், அதன் பெயர்த் தன்மையைப் பாதுகாக்கிறது.
- source_word: אֵת כָּל צִדְקוֹת יְהוָה
  choice: யாவே ... செய்த நீதியான செயல்கள் அனைத்தையும்
  rationale: צִדְקוֹת என்பது இங்கு கருத்தளவிலான நீதியை அல்ல, யாவேயின் நீதி மற்றும் உடன்படிக்கை உண்மைத்தன்மையை வரலாற்றில் வெளிப்படுத்திய செயல்களைக் குறிக்கிறது. ‘மீட்புச் செயல்கள்’ என்பது பொருளைத் தேவையின்றி குறுக்கிவிடும்.
- source_word: אֲשֶׁר עָשָׂה אִתְּכֶם וְאֶת אֲבוֹתֵיכֶם
  choice: உங்களுக்கும் உங்கள் மூதாதையருக்கும் செய்த
  rationale: எழுத்துப்படி ‘உங்களோடும் உங்கள் பிதாக்களோடும் செய்த’ என்றாலும், இங்கு அந்தச் செயல்கள் அவர்களுடைய நன்மைக்காக நிகழ்ந்தவை. ‘உங்களுக்கும்’ என்பது பயனாளிகளைக் காட்டும் இயல்பான தமிழ்; ‘மூதாதையர்’ முன்னோர் தலைமுறைகளைக் தெளிவாகக் குறிக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: ஆண்டவர் / யெகோவா
  rationale: மூல வசனம் உடன்படிக்கைப் பெயரை நேரடியாகப் பயன்படுத்துகிறது. ‘யாவே’ அதன் தனிப்பெயர்த் தன்மையைப் பாதுகாக்கிறது; ‘ஆண்டவர்’ என்பது பட்டப்பெயராகிவிடும்.
- issue: צִדְקוֹת יְהוָה என்பதன் பொருள்
  choice: யாவேயின் நீதியான செயல்கள்
  alternative: யாவேயின் மீட்புச் செயல்கள் / நீதிச் செயல்கள்
  rationale: இந்தப் பன்மைச் சொல், இஸ்ரவேலின் வரலாற்றில் யாவே செய்த நீதி நிறைந்த, உடன்படிக்கைக்கு உண்மையான செயல்களைக் குறிக்கிறது. ‘நீதியான செயல்கள்’ அதன் சொற்பொருள் அகலத்தையும் இறையியல் நெருக்கடியையும் பாதுகாக்கிறது.
- issue: וְאִשָּׁפְטָה אִתְּכֶם என்ற நீதிமன்ற உருவகம்
  choice: உங்களோடு நான் வழக்காடுவேன்
  alternative: உங்களை நான் நியாயந்தீர்ப்பேன் / உங்களோடு நியாயம் பேசுவேன்
  rationale: சாமுவேல் உடனடியாகத் தண்டனைத் தீர்ப்பு வழங்குவதாக அல்லாமல், யாவேயின் செயல்களை ஆதாரமாக வைத்து மக்களுடன் வழக்கை எடுத்துரைப்பதாகச் சூழல் காட்டுகிறது. ஆகவே தீர்ப்பை முன்கூட்டியே நிர்ணயிக்காமல் சட்டப்பூர்வத் தன்மை பாதுகாக்கப்பட்டது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகருக்குப் புரியும் dignified நடையில் அமைக்கப்பட்டது. ‘முன்வந்து நில்லுங்கள்’ முறையான விசாரணைச் சூழலை உணர்த்துகிறது; ‘வழக்காடுவேன்’ நீதிமன்ற உருவகத்தைப் பாதுகாக்கிறது. இறைப் பெயர் ‘யாவே’ எனத் தொடர்ச்சியாக வழங்கப்பட்டது.
