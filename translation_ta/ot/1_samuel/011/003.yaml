  source_fidelity: הֶרֶף לָנוּ என்பதன் நேரடியான பொருள், ஏழு நாட்களுக்கு அவர்களை விட்டுவிடுதல்/தொந்தரவு செய்யாமை ஆகும். «அவகாசம் கொடு» சூழலுக்கு ஏற்றதாக இருந்தாலும், எதிரியிடம் நடவடிக்கையை நிறுத்துமாறு கோரும் மூலத்தின் சொல்லாட்சியை ஓரளவு மென்மையாக்குகிறது. திருத்தத்தில் அது நேரடியாகக் காக்கப்பட்டுள்ளது. மற்ற நிபந்தனை அமைப்பும், மீட்பவருக்கான திறந்த குறிப்பு மற்றும் வெளியே வருதல் ஆகியவை மூலத்துடன் பொருந்துகின்றன.
