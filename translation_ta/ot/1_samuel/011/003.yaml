  yaml_path: translation/ot/1_samuel/011/003.yaml
  text: The elders of Jabesh said to him, “Leave us alone for seven days, and we will send messengers throughout all the territory of Israel. Then, if there is no one to save us, we will come out to you.”
translation:
  language: ta
  text: யாபேசின் மூப்பர்கள் அவனிடம், “ஏழு நாட்களுக்கு எங்களை விட்டுவிடு. இஸ்ரவேல் நாடு முழுவதும் தூதுவர்களை அனுப்புவோம். எங்களைக் காப்பாற்ற யாரும் இல்லையென்றால், உன்னிடம் வெளியே வருவோம்” என்றார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֶרֶף לָנוּ
  choice: எங்களுக்கு ... அவகாசம் கொடு
  rationale: இந்தச் சூழலில் முற்றுகை நடவடிக்கையைத் தற்காலிகமாக நிறுத்தி இடைவெளி அளிக்குமாறு கேட்பதை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: בְּכֹל גְּבוּל יִשְׂרָאֵל
  choice: இஸ்ரவேலின் எல்லாப் பகுதிகளுக்கும்
  rationale: גְּבוּל என்பது இங்கு எல்லைக்கோட்டை மட்டும் அல்லாமல் இஸ்ரவேலின் நிலப்பரப்பு முழுவதையும் குறிக்கிறது.
- source_word: מוֹשִׁיעַ
  choice: காப்பாற்ற
  rationale: எதிரியின் ஆபத்திலிருந்து விடுவித்தல் அல்லது மீட்டல் என்ற சூழல்சார் பொருளைத் தெளிவாகத் தருகிறது.
- source_word: וְיָצָאנוּ אֵלֶיךָ
  choice: உன்னிடம் வெளியே வருவோம்
  rationale: நகரிலிருந்து எதிரியிடம் வெளியே வந்து சரணடைவதைக் குறிப்பாக விளக்கிச் சேர்க்காமல், எபிரெயச் சொல்லாட்சியின் மறைபொருளையும் பதற்றத்தையும் காக்கிறது.
