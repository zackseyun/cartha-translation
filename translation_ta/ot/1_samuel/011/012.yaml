base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/011/012.yaml
  text: Then the people said to Samuel[a], “Who is it that said, ‘Shall Saul reign over us?’ Hand over the men, and we will put them to death.”
translation:
  language: ta
  text: அப்போது மக்கள் சாமுவேலிடம், “சவுல் எங்களை ஆளுவாரா?[a] என்று சொன்னவன் யார்? அந்த மனிதர்களை எங்களிடம் ஒப்படையுங்கள்; நாங்கள் அவர்களைக் கொன்றுவிடுவோம்” என்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சவுல் எங்களை ஆள்வார்.” எபிரேய நிறைவுறாத வினைவடிவத்தை எதிர்காலச் சாயலுள்ள கேள்வியாகவும், இச்சூழலில் சற்றுக் குறைவான சாத்தியத்துடன் ஒரு கூற்றாகவும் மொழிபெயர்க்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמֶר הָעָם
  choice: அப்போது மக்கள் ... என்றார்கள்
  rationale: தொடர்கதை முன்னேற்றத்தை வாவ் வடிவம் குறிக்கிறது; தமிழில் இயல்பான தொடர்ச்சிக்காக ‘அப்போது’ பயன்படுத்தப்பட்டு, கூட்டுப்பொருளான ‘மக்கள்’ என்பதற்கேற்ப வினை பன்மையில் அமைக்கப்பட்டது.
- source_word: אֶל שְׁמוּאֵל
  choice: சாமுவேலிடம்
  rationale: பேச்சு சாமுவேலை நோக்கிச் சொல்லப்படுவதை இயல்பான நவீனத் தமிழில் குறிக்கிறது.
- source_word: מִי הָאֹמֵר
  choice: என்று சொன்னவன் யார்?
  rationale: குறிப்பிட்ட எதிர்ப்பாளரை அடையாளம் காட்டுமாறு கேட்கும் வினாவின் உடனடித் தன்மையையும், பெயர்ச்சொல் தன்மையில் வரும் எபிரெயப் பங்கேற்பு வடிவத்தையும் காக்கிறது.
- source_word: שָׁאוּל יִמְלֹךְ עָלֵינוּ
  choice: சவுல் எங்களை ஆளுவாரா?
  rationale: מלך என்பதன் அரசாட்சிப் பொருளை ‘ஆளு’ வெளிப்படுத்துகிறது. இச்சூழலில் imperfect வடிவத்தை எதிர்ப்புக் கேள்வியாக வாசிப்பது பொருத்தமானது; அதன் வேறு சாத்தியம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: תְּנוּ הָאֲנָשִׁים
  choice: அந்த மனிதர்களை எங்களிடம் ஒப்படையுங்கள்
  rationale: தண்டனைக்காகக் குறிப்பிட்ட நபர்களைத் தங்களிடம் ஒப்படைக்குமாறு கோரும் சூழ்நிலைப் பொருளைத் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: וּנְמִיתֵם
  choice: நாங்கள் அவர்களைக் கொன்றுபோடுவோம்
  rationale: מות என்பதன் Hiphil வடிவமான ‘சாகச் செய்தல்/கொல்லுதல்’ என்ற வலுவான பொருளை நேரடியாகக் காக்கிறது; மக்கள் தாமே அதைச் செய்வோம் என்று கூறும் வாக்குறுதியும் வெளிப்படுகிறது.
