source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר שָׁא֔וּל לֹֽא יוּמַ֥ת אִ֖ישׁ בַּ/יּ֣וֹם הַ/זֶּ֑ה כִּ֥י הַ/יּ֛וֹם עָשָֽׂה יְהוָ֥ה תְּשׁוּעָ֖ה בְּ/יִשְׂרָאֵֽל־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/011/013.yaml
  text: But Saul said[a], “Not a man shall be put to death on this day, for today Yahweh has brought salvation in Israel.”
translation:
  language: ta
  text: ஆனால் சவுல், “இன்று ஒருவரும் கொல்லப்படக் கூடாது; ஏனெனில் இன்று யாவே இஸ்ரவேலில் மீட்பை நிகழ்த்தியிருக்கிறார்[a]” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யாவே விடுதலையை நிறைவேற்றியிருக்கிறார்”; அல்லது, “யாவே இஸ்ரவேலில் வெற்றியைத் தந்திருக்கிறார்.”
    reason: תְּשׁוּעָה மற்றும் עשה תשועה என்ற சொற்றொடர் இச்சூழலில் ‘மீட்பு’, ‘விடுதலை’, அல்லது ‘வெற்றி’ என்று பொருள்படலாம்.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: ஆனால் சவுல் … என்றான்
  rationale: தொடர்கதை அமைப்பில் வாவ் நிகழ்வை முன்னெடுத்தாலும், முந்தைய வசனத்தில் மக்களால் முன்வைக்கப்பட்ட கொலைக் கோரிக்கைக்கு சவுலின் பதில் முரண்படுவதால், ‘ஆனால்’ என்பது சூழலுக்கு இயல்பாகப் பொருந்துகிறது.
- source_word: לֹא יוּמַת אִישׁ
  choice: ஒருவரும் கொல்லப்படக் கூடாது
  rationale: יוּמַת என்பது מות வேரின் காரணவினைச் செயப்பாட்டு வடிவம்; சட்டத் தீர்ப்பைப் போன்ற தடையுத்தரவைத் தமிழில் இயல்பாகவும் துல்லியமாகவும் வெளிப்படுத்துகிறது. אִישׁ இங்கு பொதுப்படையான ஒருமை; அதனால் ‘ஒருவரும்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: בַּיּוֹם הַזֶּה / הַיּוֹם
  choice: இன்று / இன்று
  rationale: இரண்டு காலக் குறிப்புகளும் ஒரே நாளை வலியுறுத்துகின்றன. தமிழில் இரண்டையும் ‘இன்று’ எனக் கூறுவது இயல்பானது; மறுமொழியின் வலியுறுத்தலும் காக்கப்படுகிறது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: சவுல் ஏன் அவர்களைக் கொல்லக்கூடாது என்று கூறுகிறான் என்பதற்கான காரணத்தை அறிமுகப்படுத்துகிறது.
- source_word: עָשָׂה יְהוָה תְּשׁוּעָה
  choice: யாவே … மீட்பை நிகழ்த்தியிருக்கிறார்
  rationale: עשה תשועה என்பது மீட்பு அல்லது விடுதலையைச் செயல்படுத்துதல் என்ற சொற்றொடர். ‘மீட்பை நிகழ்த்தியிருக்கிறார்’ என்பது தெய்வீகச் செயலையும் תְּשׁוּעָה என்பதன் பரந்த பொருளையும் காக்கிறது; இராணுவச் சூழலில் ‘வெற்றி’ என்பதும் சாத்தியம் என்பதால் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய தனிப்பெயரான நான்கு எழுத்துத் திருப்பெயரை ஒரு பொதுப் பட்டத்தால் மாற்றாமல், தமிழில் அறியத்தக்க ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: בְּיִשְׂרָאֵל
  choice: இஸ்ரவேலில்
  rationale: בְּ முன்னொட்டின் நேரடியான இடப்பொருளைத் தக்கவைக்கிறது. ‘இஸ்ரவேலுக்காக’ என்ற பயனாளிப் பொருளும் சூழலில் சாத்தியம்; ஆனால் அது சற்றே விளக்கவுரையானது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழியாக்கம்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலத்தில் பட்டமல்ல, தனிப்பெயரே உள்ளது. ஆகவே அந்த உடன்படிக்கைப் பெயரை ஒலிபெயர்த்து, குறிப்பிட்ட சமய மரபின் மாற்றுப்பெயரைத் தவிர்க்கிறது.
- issue: இராணுவ மீட்புச் சூழலில் תְּשׁוּעָה என்பதன் பொருள்
  choice: மீட்பு
  alternative: விடுதலை; வெற்றி
  rationale: உடனடிச் சூழல் இராணுவ வெற்றியாக இருந்தாலும், எபிரெயச் சொல் வெற்றியை மட்டுமல்லாமல் காப்பாற்றுதல் மற்றும் விடுவித்தல் என்ற பரந்த பொருளையும் கொண்டுள்ளது. ‘மீட்பு’ அந்தப் பொருள் அகலத்தையும், செயல் யாவேக்குரியது என்பதையும் காக்கிறது.
- issue: לֹא יוּמַת என்பதன் கட்டளைத் தன்மை
  choice: கொல்லப்படக் கூடாது
  alternative: கொல்லப்பட மாட்டார்
  rationale: சூழலில் சவுல் எதிர்காலத்தை முன்னறிவிப்பதல்ல; மக்களின் கொலைக் கோரிக்கையைத் தடுத்து அரசத் தீர்ப்பை அறிவிக்கிறான். எனவே தமிழில் தடைப் பொருள் வெளிப்படையாகத் தரப்பட்டுள்ளது.
translation_notes:
  register: நவீனத் தரத் தமிழ்; பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. சவுலின் நேரடி அரசத் தடையுத்தரவு தெளிவாகவும், எபிரெய மூலத்தின் இருமுறை வரும் ‘இன்று’ என்ற வலியுறுத்தல் அப்படியேவும் வைக்கப்பட்டுள்ளன.
