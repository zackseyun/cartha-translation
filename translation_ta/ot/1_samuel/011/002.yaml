source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֲלֵי/הֶ֗ם נָחָשׁ֙ הָ/עַמּוֹנִ֔י בְּ/זֹאת֙ אֶכְרֹ֣ת לָ/כֶ֔ם בִּ/נְק֥וֹר לָ/כֶ֖ם כָּל עֵ֣ין יָמִ֑ין וְ/שַׂמְתִּ֥י/הָ חֶרְפָּ֖ה עַל כָּל יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/011/002.yaml
  text: 'Nahash the Ammonite said to them, “On this condition I will make a treaty with you: that every right eye of yours be gouged out, and I will make it a disgrace upon all Israel.”'
translation:
  language: ta
  text: 'அம்மோனியனான நாகாஸ் அவர்களிடம், “இந்த நிபந்தனையின்பேரில் உங்களோடு உடன்படிக்கை செய்வேன்: உங்கள் ஒவ்வொருவருடைய வலது கண்ணையும் பிடுங்கி, இஸ்ரவேல் முழுவதற்கும் அதை அவமானமாக்குவேன்” என்றான்.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֶכְרֹת לָכֶם
  choice: உங்களோடு உடன்படிக்கை செய்வேன்
  rationale: எபிரெய மொழியில் சொல்லர்த்தமாக ‘உங்களுக்காக வெட்டுவேன்’ என்பது உடன்படிக்கை ஏற்படுத்துவதற்கான மரபுத்தொடர்; இயல்பான தமிழில் அதன் பொருள் தெளிவாக வழங்கப்பட்டது.
- source_word: בִּנְקוֹר לָכֶם כָּל־עֵין יָמִין
  choice: உங்கள் ஒவ்வொருவருடைய வலது கண்ணையும் பிடுங்கி
  rationale: נקר என்பதன் வன்மையான உடற்கேடு விளைவிக்கும் பொருளை ‘பிடுங்கி’ இயல்பாக வெளிப்படுத்துகிறது; כָּל־עֵין יָמִין என்ற பகிர்வுப் பொருள் ‘ஒவ்வொருவருடைய வலது கண்’ என்று தரப்பட்டது.
- source_word: וְשַׂמְתִּיהָ חֶרְפָּה עַל כָּל־יִשְׂרָאֵל
  choice: இஸ்ரவேல் முழுவதற்கும் அதை அவமானமாக்குவேன்
  rationale: பெண்பால் சுட்டுப்பெயரான הָ முந்தைய செயலை அல்லது அதன் விளைவைச் சுட்டுகிறது; அதைத் தெளிவுபடுத்தாமல் ‘அதை’ என வைத்து மூலத்தின் சுட்டு நெகிழ்வை காக்கிறது.
theological_decisions:
- issue: நாகாஸின் கூற்றில் உள்ள இரண்டு தொடர்ச்சியான செயல்களின் தொடர்பு
  choice: ‘பிடுங்கி ... அவமானமாக்குவேன்’ என்று செய்பவர் நாகாஸ் என்பதைக் காத்தல்
  alternative: ‘பிடுங்கப்பட வேண்டும்; அதை அவமானமாக்குவேன்’ என்ற செயப்பாட்டு வடிவம்
  rationale: בִּנְקוֹר என்ற infinitive construction நாகாஸ் விதிக்கும் நிபந்தனையை அவனது செயலாக இயல்பாகக் காட்டுகிறது; וְשַׂמְתִּיהָ எனும் முதல் நபர் வினையும் அதையே உறுதிப்படுத்துகிறது. எந்தக் கூடுதல் இறையியல் விளக்கமும் சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழ்; வரலாற்றுக் கதைநடைக்கு ஏற்ற கண்ணியமான, நேரடியான மொழிநடை. ‘அம்மோனியனான’ மற்றும் ‘இஸ்ரவேல்’ ஆகியவை பொதுவாகப் புரியும் வேதாகமப் பெயர்வழக்கில் வைக்கப்பட்டுள்ளன.
