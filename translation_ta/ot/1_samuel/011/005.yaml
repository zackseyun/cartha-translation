  naturalness: நவீன நிலையான தமிழில் கண்ணியமான, தெளிவான கதைநடை. ‘இதோ,’ ‘வந்துகொண்டிருந்தார்,’ ‘தெரிவித்தார்கள்’ ஆகியவை சூழலுக்கு ஏற்றவை. சவுலுக்கான மரியாதைப் பன்மை தமிழின் வழக்கமான நடைக்கு ஒத்தது.
