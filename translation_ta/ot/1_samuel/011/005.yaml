base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/011/005.yaml
  text: And behold[a], Saul was coming from the field behind the cattle, and Saul said, “What is wrong with the people[b], that they are weeping?” And they told him the words of the men of Jabesh.
translation:
  language: ta
  text: இதோ, சவுல் வயல்வெளியிலிருந்து மாடுகளுக்குப் பின்னால் வந்துகொண்டிருந்தார்.[a] அவர், “மக்களுக்கு என்ன ஆயிற்று? ஏன் அழுதுகொண்டிருக்கிறார்கள்?” என்று கேட்டார். அப்போது யாபேசின் ஆண்கள் சொன்னவற்றை அவர்கள் அவருக்குத் தெரிவித்தார்கள்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “மாடுகளைப் பின்தொடர்ந்து” என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொற்றொடர் சவுல் வயல்வெளியிலிருந்து மாடுகளுக்குப் பின்னால் வந்ததைச் சித்தரிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: “யாபேசின் ஆண்களுடைய செய்தியை” என்றும் மொழிபெயர்க்கலாம். சொல்லர்த்தமாக, “யாபேசின் ஆண்களுடைய சொற்களை.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: இதோ
  rationale: காட்சிமாற்றத்தையும் நிகழ்வின் உயிரோட்டத்தையும் குறிக்கும் எபிரெய உரையாடல் அடையாளத்தை இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: בָּא
  choice: வந்துகொண்டிருந்தார்
  rationale: பின்னணியில் தொடர்ந்துகொண்டிருந்த செயலைக் காட்டும் எபிரெயப் பங்கேற்புவினையின் நீடித்த தன்மையை வெளிப்படுத்துகிறது.
- source_word: אַחֲרֵי הַבָּקָר
  choice: மாடுகளுக்குப் பின்னால்
  rationale: אַחֲרֵי என்பதன் இடவியல் பொருளான ‘பின்னால்’ என்பதையும், בָּקָר என்பதன் பொதுவான மாட்டினப் பொருளையும் காக்கிறது.
- source_word: מִן הַשָּׂדֶה
  choice: வயல்வெளியிலிருந்து
  rationale: சவுல் வந்த இடத்தைத் தெளிவாகவும் இயல்பாகவும் குறிக்கிறது.
- source_word: מַה לָעָם כִּי יִבְכּוּ
  choice: மக்களுக்கு என்ன ஆயிற்று? ஏன் அழுதுகொண்டிருக்கிறார்கள்?
  rationale: ‘மக்களுக்கு என்ன?’ என்ற எபிரெய மரபுத்தொடரையும் அழுகையின் தொடர்நிலையையும் இயல்பான நவீனத் தமிழில் இரண்டு தொடர்புடைய கேள்விகளாக வழங்குகிறது.
- source_word: וַיְסַפְּרוּ לוֹ
  choice: அவர்கள் அவருக்குத் தெரிவித்தார்கள்
  rationale: கேட்ட செய்தியை சவுலிடம் எடுத்துரைத்த செயலைத் தெளிவாகக் காட்டுகிறது.
- source_word: דִּבְרֵי אַנְשֵׁי יָבֵישׁ
  choice: யாபேசின் ஆண்கள் சொன்னவற்றை
  rationale: דִּבְרֵי என்பதன் ‘சொற்கள்/சொன்னவை’ என்ற பொருளையும் אַנְשֵׁי என்பதன் ஆண்பால் குறிப்பையும் இயல்பான தமிழில் காக்கிறது.
