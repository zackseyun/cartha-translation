  text: וַ/תִּצְלַ֤ח רֽוּחַ אֱלֹהִים֙ עַל שָׁא֔וּל ב/שמע/ו אֶת הַ/דְּבָרִ֣ים הָ/אֵ֑לֶּה וַ/יִּ֥חַר אַפּ֖/וֹ מְאֹֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/011/006.yaml
  text: And the Spirit of God rushed upon Saul when he heard these words[b][a], and his anger burned greatly.
translation:
  language: ta
  text: சவுல் இந்த வார்த்தைகளைக் கேட்டபோது, கடவுளின் ஆவி அவர்மேல் வல்லமையுடன் இறங்கியது[a]; அவருடைய கோபம் மிகவும் கொழுந்துவிட்டு எரிந்தது[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘சவுல்மேல் வலிமையாகப் பாய்ந்தது’ என்றும் மொழிபெயர்க்கலாம். இங்குள்ள எபிரெய வினைச்சொல், ஆவி ஒருவர்மேல் வலிமையாக வருவதைக் குறிக்கக்கூடும்.
    reason: lexical_alternative
  - marker: b
    text: சொல்லர்த்தமாக, ‘அவருடைய மூக்கு மிகவும் எரிந்தது.’ இது கடும் கோபத்தைக் குறிக்கும் எபிரெய மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּצְלַח
  choice: வல்லமையுடன் இறங்கியது
  rationale: ஆவி ஒருவர்மேல் வருவதைக் குறிக்கும் இச்சூழலில், צלח என்பது வெறும் வருகையை அல்லாமல் திடீரான, வலிமைமிக்க ஆட்கொள்ளுதலையும் ஆற்றலளித்தலையும் உணர்த்துகிறது. இயல்பான நவீன தமிழில் இதை ‘வல்லமையுடன் இறங்கியது’ என்று மொழிபெயர்த்துள்ளது.
- source_word: רוּחַ אֱלֹהִים
  choice: கடவுளின் ஆவி
  rationale: இந்த இணைப்புச் சொற்றொடர் தெய்வீக ஆவியைக் குறிக்கிறது. ‘கடவுளின் ஆவி’ என்பது தெளிவான, இயல்பான தமிழ்; மூலத்தின் இறையியல் முக்கியத்துவத்தையும் காக்கிறது.
- source_word: עַל
  choice: அவர்மேல்
  rationale: ஆவி ஒரு நபர்மேல் வல்லமையுடன் வருவதைச் சுட்டும் எபிரெயச் சொல்லாட்சியைத் தமிழில் இயல்பாகக் காட்டுகிறது.
- source_word: בְּשָׁמְעוֹ
  choice: கேட்டபோது
  rationale: ב முன்னொட்டுடன் வரும் வினையெச்ச வடிவம் இங்கு காலத்தைக் குறிக்கிறது; ‘கேட்டபோது’ நிகழ்வுகளின் தொடர்பைத் தெளிவாகத் தருகிறது.
- source_word: הַדְּבָרִים הָאֵלֶּה
  choice: இந்த வார்த்தைகளை
  rationale: דברים என்பதற்கு ‘காரியங்கள்’ என்றும் பொருள் வரலாம்; ஆனால் உடனடி சூழலில் சொல்லப்பட்ட செய்தியைக் குறிக்கும் காரணத்தால் ‘வார்த்தைகள்’ பொருத்தமானது.
- source_word: וַיִּחַר אַפּוֹ
  choice: அவருடைய கோபம் ... கொழுந்துவிட்டு எரிந்தது
  rationale: ‘மூக்கு எரிந்தது’ என்ற எபிரெய உருவகச் சொல்லாட்சி கடும் கோபத்தைக் குறிக்கிறது. ‘கோபம் கொழுந்துவிட்டு எரிந்தது’ என்பது அந்த எரிதல் உருவகத்தைத் தக்கவைத்துக்கொண்டு இயல்பான தமிழாக உள்ளது.
- source_word: מְאֹד
  choice: மிகவும்
  rationale: முந்தைய வினையை வலுப்படுத்தும் சொல்லாக இருப்பதால், தீவிரத்தின் அளவை இயல்பாகக் காட்ட ‘மிகவும்’ பயன்படுத்தப்பட்டுள்ளது.
theological_decisions:
- issue: இந்தக் கதையில் רוּחַ אֱלֹהִים என்பதன் தன்மை
  choice: சவுலுக்கு ஆற்றலளிக்கும் கடவுளின் ஆவி
  alternative: கடவுளிடமிருந்து வந்த ஓர் ஆவி
  rationale: விடுதலைக்கான தலைமைச் செயல்பாட்டுக்கும் உடனடியாக எழும் தீவிரத்துக்கும் உரிய இச்சூழலில், இந்தச் சொற்றொடர் சவுல்மேல் வரும் கடவுளின் ஆவியையே குறிக்கிறது. உரை கூறுவதைத் தாண்டி அதன் செயல்முறையை வரையறுக்காமல் இவ்வாசிப்பு தெய்வீக ஆற்றலளித்தலைக் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. மூலத்தின் வலிமையான ஆவி வருகையும் ‘கோபம் எரிதல்’ என்ற உருவகமும் இயன்றவரை காக்கப்பட்டுள்ளன; சொல்லர்த்தமான எபிரெய மரபுத்தொடர் அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது.
