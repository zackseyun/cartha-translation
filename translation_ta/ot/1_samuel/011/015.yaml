base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/011/015.yaml
  text: So all the people went to Gilgal[a], and there they made Saul king before Yahweh at Gilgal. There they sacrificed peace offerings before Yahweh, and there Saul and all the men of Israel rejoiced greatly.
translation:
  language: ta
  text: மக்கள் அனைவரும் கில்காலுக்குச் சென்றார்கள். அங்கே கில்காலில் யாவேயின் முன்னிலையில் சவுலை அரசனாக்கினார்கள். அங்கே யாவேயின் முன்னிலையில் சமாதானப் பலிகளை[a]ச் செலுத்தினார்கள். சவுலும் இஸ்ரவேலின் ஆண்கள் அனைவரும் அங்கே மிகவும் மகிழ்ந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ஐக்கியப் பலிகள்” அல்லது “நல்வாழ்வுப் பலிகள்” என்றும் மொழிபெயர்க்கலாம். இந்த எபிரெயச் சொல் சமாதானம், முழுமை, நல்வாழ்வு, ஒன்றுகூடிப் பகிர்ந்துண்ணும் கொண்டாட்டம் ஆகியவற்றுடன் தொடர்புடைய ஒரு வகைச் சமூகப் பலியைக் குறிக்கிறது.
    reason: lexical_alternative
