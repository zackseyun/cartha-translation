  choice: இஸ்ரவேலின் ஆண்கள் அனைவரும்
  alternative: இஸ்ரவேலர் அனைவரும்; இஸ்ரவேல் மக்கள் அனைவரும்
  rationale: எபிரெயச் சொற்றொடரின் சொற்பொருள் ஆண்பாலைக் குறிப்பதால், அதை நடுநிலை மக்கள் தொகைக் குறிப்பாக மாற்றாமல் வைத்திருக்கிறது.
- issue: שְׁלָמִים என்ற பலிவகையின் பொருள் பரப்பு
  choice: சமாதானப் பலிகள்
  alternative: ஐக்கியப் பலிகள்; நல்வாழ்வுப் பலிகள்
  rationale: ஒரே சொல்லால் முழுப் பொருள் பரப்பையும் முடிவாக நிர்ணயிக்காமல், பழக்கமான முதன்மை வடிவத்துடன் மாற்றுப் பொருள்களை அடிக்குறிப்பில் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. இடப்பெயரும் ஆட்பெயரும் வழக்கமான தமிழ் வேதாகம ஒலிப்புகளுக்கு அருகில் தரப்பட்டுள்ளன. மூலத்தின் மீளுரையான ‘கில்காலில்’ மற்றும் ‘அங்கே’ இயன்றவரை காக்கப்பட்டுள்ளன; வாக்கியங்கள் தமிழ் வாசிப்பிற்காகப் பிரிக்கப்பட்டுள்ளன.
