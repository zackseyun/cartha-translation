  rationale: எபிரெய இடப்பெயரின் தமிழ் ஒலிபெயர்ப்பு.
- source_word: וַיַּמְלִכוּ ... אֶת שָׁאוּל
  choice: சவுலை அரசனாக்கினார்கள்
  rationale: מלך என்பதன் ஹிஃபில் வடிவம் ஒருவரை ஆளச்செய்தல் அல்லது அரசனாக்குதல் என்று பொருள்படும்; மூலத்தில் இல்லாத அபிஷேகக் கருத்தைச் சேர்க்கவில்லை.
- source_word: לִפְנֵי יְהוָה
  choice: யாவேயின் முன்னிலையில்
  rationale: இறைவனுடைய பிரசன்னத்தில் நிகழ்ந்த பொது மற்றும் வழிபாட்டுச் செயலை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: திருநான்கெழுத்துத் தெய்வீகப் பெயரை ஒரு பட்டப்பெயரால் மாற்றாமல், அதன் தனிப்பெயர் தன்மையைத் தமிழ் ஒலிபெயர்ப்பில் காக்கிறது.
- source_word: וַיִּזְבְּחוּ
  choice: பலிகளைச் செலுத்தினார்கள்
  rationale: பலியிடும் சூழலில் זבח என்பதையும் அதனைத் தொடர்ந்து வரும் பலிவகையையும் இயல்பான தமிழ் வழிபாட்டு நடையில் இணைக்கிறது.
- source_word: זְבָחִים שְׁלָמִים
  choice: சமாதானப் பலிகள்
  rationale: שְׁלָמִים என்பதற்கான பழக்கமான, சுருக்கமான பெயர்; சமாதானம், முழுமை, பகிர்ந்துண்ணும் கொண்டாட்டம் ஆகிய பொருள் வட்டத்தை அடிக்குறிப்பு விளக்குகிறது.
- source_word: וַיִּשְׂמַח
  choice: மிகவும் மகிழ்ந்தார்கள்
  rationale: ஒருமை வினை வடிவத்தைத் தொடர்ந்து வரும் கூட்டெழுவாயுடன் தமிழில் இயல்பான பன்மையாக அமைத்து, עַד מְאֹד தரும் தீவிரத்தையும் காக்கிறது.
- source_word: וְכָל אַנְשֵׁי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் ஆண்கள் அனைவரும்
  rationale: אַנְשֵׁי என்பதன் வெளிப்படையான ஆண்பால் பொருளை பொதுவான பால்நடுநிலைச் சொல்லாக மாற்றாமல் காக்கிறது.
- source_word: עַד מְאֹד
  choice: மிகவும்
  rationale: மகிழ்ச்சியின் மிகுதியை நவீனத் தமிழில் இயல்பாகத் தீவிரப்படுத்துகிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: ஆண்டவர்; யெகோவா
  rationale: மூல எபிரெய உரையில் தனிப்பெயரான திருநான்கெழுத்து நேரடியாக வருகிறது. அதனைப் பட்டப்பெயராக மாற்றாமல், பரவலாக ஏற்கப்பட்ட ஒலிப்புக்கு நெருக்கமான தமிழ் வடிவத்தில் தருகிறது.
