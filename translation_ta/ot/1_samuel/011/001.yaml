  yaml_path: translation/ot/1_samuel/011/001.yaml
  text: Then Nahash the Ammonite went up and encamped against Jabesh-gilead. And all the men of Jabesh said to Nahash[a], “Make a covenant with us, and we will serve you.”
translation:
  language: ta
  text: பின்பு அம்மோனியனான நாகாஷ் மேலே வந்து, யாபேஷ்-கிலெயாத்துக்கு எதிராக முகாமிட்டான். யாபேஷின் ஆண்கள் அனைவரும் நாகாஷிடம், “எங்களோடு ஓர் உடன்படிக்கை செய்துகொள்ளுங்கள்[a]; நாங்கள் உமக்குப் பணி செய்வோம்” என்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொல்லுக்குச் சொல், “எங்களோடு ஓர் உடன்படிக்கையை வெட்டுங்கள்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: படையெடுத்து வந்து
  rationale: עלה என்பதன் அடிப்படை இயக்கக் கருத்தையும் இங்குள்ள இராணுவச் சூழலையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது; வெறும் ‘மேலே வந்தான்’ என்பது தமிழில் தவறான நிலவியல் எண்ணத்தைத் தரக்கூடும்.
- source_word: נָחָשׁ הָעַמּוֹנִי
  choice: அம்மோனியனான நாகாஸ்
  rationale: தனிப்பெயரை ஒலிபெயர்த்து, இன அடையாளத்தை நேரடியாகக் காட்டுகிறது.
- source_word: וַיִּחַן עַל
  choice: எதிராக முகாமிட்டான்
  rationale: חנה עם על என்பதன் இராணுவப் பொருளைத் துல்லியமாகத் தருகிறது; ‘முற்றுகையிட்டான்’ என்று வினையில் இல்லாத வலுவான கருத்தைச் சேர்க்கவில்லை.
- source_word: יָבֵשׁ גִּלְעָד
  choice: கீலேயாத்திலுள்ள யாபேஸ்
  rationale: இரண்டு இடப்பெயர்களின் தொடர்பை நவீன தமிழில் தெளிவாகக் காட்டுகிறது; எபிரெயச் சேர்க்கைப் பெயரின் பொருளையும் காக்கிறது.
- source_word: כָּל אַנְשֵׁי יָבֵישׁ
  choice: யாபேசின் ஆண்கள் அனைவரும்
  rationale: אַנְשֵׁי என்பதிலுள்ள ஆண்பால் குறிப்பை பொதுமைப்படுத்தாமல் நேரடியாகக் காக்கிறது.
- source_word: כְּרָת לָנוּ בְרִית
  choice: எங்களோடு ஓர் உடன்படிக்கை செய்துகொள்ளும்
  rationale: ‘உடன்படிக்கையை வெட்டு’ என்ற எபிரெய மரபுத்தொடரின் பொருளை இயல்பான தமிழில் தருகிறது; ברית என்பதற்கான உடன்படிக்கைச் சொல்லையும் காக்கிறது.
- source_word: וְנַעַבְדֶךָּ
  choice: நாங்கள் உமக்குப் பணிசெய்வோம்
  rationale: עבד என்பதன் நேரடியான ‘பணிசெய்/சேவைசெய்’ பொருளைத் தருகிறது; ‘அடிபணிவோம்’ போன்ற விளக்கவுரையைச் சேர்க்கவில்லை.
