source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר שְׁמוּאֵל֙ אֶל הָ/עָ֔ם לְכ֖וּ וְ/נֵלְכָ֣ה הַ/גִּלְגָּ֑ל וּ/נְחַדֵּ֥שׁ שָׁ֖ם הַ/מְּלוּכָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/011/014.yaml
  text: Then Samuel said to the people[a], “Come, let us go to Gilgal, and there renew the kingship.”
translation:
  language: ta
  text: அப்போது சாமுவேல் மக்களிடம், “வாருங்கள், நாம் கில்காலுக்குப் போய், அங்கே அரசாட்சியைப் புதுப்பிப்போம்[a]” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது “அரசாட்சியை உறுதிப்படுத்துவோம்”; அல்லது “அரசைப் புதுப்பிப்போம்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: அப்போது ... என்றார்
  rationale: வாவ் தொடர்வினை கதைநிகழ்வை அடுத்த கட்டத்துக்கு நகர்த்துகிறது; நவீன தமிழில் இயல்பான நிகழ்வுத் தொடரை ‘அப்போது’ வெளிப்படுத்துகிறது.
- source_word: שְׁמוּאֵל
  choice: சாமுவேல்
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் நிலைபெற்ற பெயர்வடிவம்.
- source_word: אֶל־הָעָם
  choice: மக்களிடம்
  rationale: இங்கு עָם என்பது கூடிவந்த இஸ்ரவேல் மக்களைக் குறிக்கிறது; ‘மக்கள்’ அதன் இயல்பான பொதுப்பொருளைத் தருகிறது.
- source_word: לְכוּ וְנֵלְכָה
  choice: வாருங்கள், நாம் ... போய்
  rationale: கட்டளை வடிவமும் முதலாம் நபர் பன்மை விருப்பவினையும் சேர்ந்து அனைவரையும் கூட்டாகச் செல்ல அழைக்கின்றன; ‘வாருங்கள், நாம் ... போய்’ என்பது அந்த அழைப்பை இயல்பான தமிழில் தருகிறது.
- source_word: הַגִּלְגָּל
  choice: கில்கால்
  rationale: இடப்பெயரின் தமிழ் ஒலிபெயர்ப்பு.
- source_word: שָׁם
  choice: அங்கே
  rationale: கில்காலைச் சுட்டும் இடவினையடை.
- source_word: וּנְחַדֵּשׁ
  choice: புதுப்பிப்போம்
  rationale: חדש என்பதன் பியேல் வடிவம் ‘புதிதாக்குதல்/புதுப்பித்தல்’ என்று பொருள்படும். சவுலின் ஆட்சி ஏற்கெனவே தொடங்கியுள்ள சூழலில், அதை மீண்டும் பொதுவாக நிலைநாட்டும் நுணுக்கத்தை இது தக்கவைக்கிறது.
- source_word: הַמְּלוּכָה
  choice: அரசாட்சி
  rationale: מְלוּכָה என்பது அரச பதவி, அரச அதிகாரம், அல்லது அரசாட்சி அமைப்பு ஆகியவற்றைக் குறிக்கலாம். ‘அரசாட்சி’ சவுலின் ஆட்சியைக் குறிக்கும் அதேவேளையில் மூலத்தின் பொருள் விரிவையும் ஓரளவு காக்கிறது.
theological_decisions:
- issue: הַמְּלוּכָה என்பதைப் ‘புதுப்பித்தல்’ என்பதன் பொருள்
  choice: அரசாட்சியைப் புதுப்பிப்பது
  alternative: சவுலின் அரச அதிகாரத்தை உறுதிப்படுத்துவது; அல்லது அரசை மீண்டும் புதுப்பிப்பது
  rationale: யாபேஸ் கிலேயாத்தை சவுல் விடுவித்த பின்னர் மக்கள் அவரை புதிதாக ஆதரிக்கும் சூழல் இது. எனினும், ஒரு குறிப்பிட்ட முடிசூட்டு சடங்கையோ அரசியல் நடைமுறையையோ மூலவசனம் வெளிப்படையாகச் சொல்லாததால், மொழிபெயர்ப்பு அதை மிகத் துல்லியப்படுத்தாமல் மூலத்தின் இறையியல் மற்றும் அரசியல் நெருக்கடியைக் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. ‘வாருங்கள், நாம் ...’ என்ற அமைப்பு எபிரேய அழைப்பையும் கூட்டுச் செயலையும் இயல்பாக வெளிப்படுத்துகிறது; ‘அரசாட்சி’ என்பது அரச பதவி, அதிகாரம், அமைப்பு ஆகியவற்றுக்கிடையிலான மூலமொழி நெகிழ்வைத் தக்கவைக்கிறது.
