  text: וַ/יָּבֹ֤אוּ הַ/מַּלְאָכִים֙ גִּבְעַ֣ת שָׁא֔וּל וַ/יְדַבְּר֥וּ הַ/דְּבָרִ֖ים בְּ/אָזְנֵ֣י הָ/עָ֑ם וַ/יִּשְׂא֧וּ כָל הָ/עָ֛ם אֶת קוֹלָ֖/ם וַ/יִּבְכּֽוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/011/004.yaml
  text: When the messengers came to Gibeah of Saul and spoke these words in the hearing of the people[a], all the people lifted up their voices and wept.
translation:
  language: ta
  text: தூதர்கள் சவுலின் கிபியாவுக்கு வந்து, இந்தச் செய்தியை மக்கள் கேட்கும்படி சொன்னார்கள். அப்போது மக்கள் அனைவரும் உரத்த குரலில் அழுதார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַמַּלְאָכִים
  choice: தூதர்கள்
  rationale: இங்கு யாபேசிலிருந்து அனுப்பப்பட்ட மனிதத் தூதர்களையே குறிக்கிறது; தேவதூதர்களை அல்ல. தமிழில் சூழலுக்கேற்ற இயல்பான சொல்.
- source_word: גִּבְעַת שָׁאוּל
  choice: சவுலின் கிபியா
  rationale: சவுலோடு தொடர்புடைய ஊர் என்பதை எபிரெயக் கட்டமைப்புக்கு நெருக்கமாகவும் தமிழில் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: וַיְדַבְּרוּ הַדְּבָרִים
  choice: இந்தச் செய்தியை ... சொன்னார்கள்
  rationale: சொல்லாட்சியில் 'இந்த வார்த்தைகளைப் பேசினார்கள்' என்று இருந்தாலும், முந்தைய வசனத்தின் செய்தியைக் குறிப்பிடுவதால் நவீன தமிழில் இது தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: בְּאָזְנֵי הָעָם
  choice: மக்கள் கேட்கும்படி
  rationale: சொல்லாட்சியான 'மக்களின் காதுகளில்' என்பதன் பொதுவான, கேட்போர் முன்னிலையில் அறிவித்தல் என்ற பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: וַיִּשְׂאוּ ... אֶת קוֹלָם
  choice: உரத்த குரலில்
  rationale: சொல்லாட்சியாக 'தங்கள் குரலை உயர்த்தினார்கள்' என்ற எபிரெய மரபுத்தொடர், இங்கு அனைவரும் சத்தமிட்டு அழுததைச் சுட்டுகிறது; தமிழில் 'உரத்த குரலில் அழுதார்கள்' இயல்பான இணைப்பு.
- source_word: וַיִּבְכּוּ
  choice: அழுதார்கள்
  rationale: துயரத்தால் கண்ணீர் விட்டுப் புலம்புவதைத் தெளிவாகத் தெரிவிக்கிறது.
- source_word: כָל הָעָם
  choice: மக்கள் அனைவரும்
  rationale: கூட்டத்திலிருந்த அனைவரையும் குறிக்கும் כָל என்பதன் முழுமையை இயல்பான தமிழில் காக்கிறது.
