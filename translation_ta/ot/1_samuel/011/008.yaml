source:
  edition: WLC
  text: וַֽ/יִּפְקְדֵ֖/ם בְּ/בָ֑זֶק וַ/יִּהְי֤וּ בְנֵֽי יִשְׂרָאֵל֙ שְׁלֹ֣שׁ מֵא֣וֹת אֶ֔לֶף וְ/אִ֥ישׁ יְהוּדָ֖ה שְׁלֹשִׁ֥ים אָֽלֶף־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/011/008.yaml
  text: He mustered them at Bezek[a], and the sons of Israel were three hundred thousand, and the men of Judah thirty thousand.
translation:
  language: ta
  text: அவன் அவர்களைப் பெசேக்கில் அணிவகுத்துக் கணக்கிட்டான். இஸ்ரவேல் புத்திரர் மூன்று இலட்சம் பேரும், யூதாவின் ஆட்கள் முப்பதாயிரம் பேரும் இருந்தனர்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּפְקְדֵם
  choice: அவன் அவர்களை அணிவகுத்துக் கணக்கிட்டான்
  rationale: פקד என்பது இங்கு போருக்காகத் திரண்டவர்களைப் படைமுறையில் கணக்கெடுப்பதைக் குறிக்கிறது. வெறும் எண்ணிக்கையிடுதல் அல்ல, படைத்திரட்டலின் சூழலையும் இந்தச் சொற்றொடர் வெளிப்படுத்துகிறது.
- source_word: בְּבָזֶק
  choice: பெசேக்கில்
  rationale: בזק என்பது இடப்பெயர்; தமிழ் ஒலிபெயர்ப்பாக ‘பெசேக்’ என்றும், ב முன்னிடைச்சொல் இயல்பாக ‘-இல்’ என்றும் தரப்பட்டுள்ளது.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் புத்திரர்
  rationale: எபிரெய மூலத்தின் குடும்பவழிக் கூட்டுப் பெயரை வெளிப்படையாகப் பாதுகாக்கிறது; இவ்விடத்தில் இது யூதாவின் ஆட்களிலிருந்து வேறுபடுத்திக் காட்டப்படும் இஸ்ரவேல் கூட்டத்தைக் குறிக்கிறது.
- source_word: שְׁלֹשׁ מֵאוֹת אֶלֶף
  choice: மூன்று இலட்சம் பேர்
  rationale: எண்ணிக்கையை நேரடியாகவும் இயல்பான தமிழ் எண்ணுமுறையிலும் தருகிறது; மனிதர்களைக் குறிக்கும் ‘பேர்’ தெளிவுக்காகச் சேர்க்கப்பட்டுள்ளது.
- source_word: וְאִישׁ יְהוּדָה
  choice: யூதாவின் ஆட்கள்
  rationale: איש ஒருமை வடிவில் இருந்தாலும் இங்கு கூட்டுப்பொருளில் யூதாவைச் சேர்ந்த ஆண்களைக் குறிக்கிறது; ‘ஆட்கள்’ என்பது அதனை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: שְׁלֹשִׁים אָלֶף
  choice: முப்பதாயிரம் பேர்
  rationale: எண்ணிக்கையை நேரடியாகத் தருகிறது; மனிதர்களைக் குறிக்கும் ‘பேர்’ தெளிவை அளிக்கிறது.
theological_decisions:
- issue: בְנֵי יִשְׂרָאֵל என்ற குல/கூட்டுச் சொல்லின் மொழிபெயர்ப்பு
  choice: இஸ்ரவேல் புத்திரர்
  alternative: இஸ்ரவேலர்
  rationale: கோட்பாட்டுச் சிக்கல் எதுவும் இல்லை. எனினும், மூலத்திலுள்ள ஆண்பால் குடும்பவழிக் கூட்டுச் சொல்லையும் இஸ்ரவேலுக்கும் யூதாவுக்கும் இடையிலான இலக்கிய வேறுபாட்டையும் ‘இஸ்ரவேல் புத்திரர்’ தெளிவாகப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. ‘அணிவகுத்துக் கணக்கிட்டான்’ என்பது படைத்திரட்டல் மற்றும் கணக்கெடுப்பு ஆகிய இரு கூறுகளையும் இயல்பாக இணைக்கிறது; ‘இலட்சம்’ தமிழ் வாசகர்களுக்குப் பழக்கமான எண்ணுமுறை.
