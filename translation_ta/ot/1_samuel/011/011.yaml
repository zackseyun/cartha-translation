translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதாகவும் கண்ணியமான வரலாற்றுக் கதைநடையிலும் மொழிபெயர்க்கப்பட்டது. இராணுவச் சூழலைத் தெளிவாக்க ‘படைப்பிரிவுகள்’, ‘காவல் வேளை’ போன்ற சொற்கள் பயன்படுத்தப்பட்டன. மூலத்தின் காலக் குறிப்பில் உள்ள சிறிய நிச்சயமின்மை அடிக்குறிப்பில் காக்கப்பட்டுள்ளது.
