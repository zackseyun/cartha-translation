  source_fidelity: மூல எபிரெயத்தின் காலவரிசை, சவுல் மக்களை மூன்று இராணுவப் பிரிவுகளாக ஒழுங்குபடுத்தியது, அதிகாலை காவல் வேளையில் முகாமின் உட்பகுதிக்குள் நுழைந்தது, பகல் சூடாகும்வரை அம்மோனியரைத் தாக்கியது, உயிர்தப்பியோர் சிதறிப்போனது, இருவர்கூட ஒன்றாக எஞ்சாத முழுமையான சிதறல் ஆகிய அனைத்தும் துல்லியமாகக் காக்கப்பட்டுள்ளன. எபிரெயக் கதைசொல்லல் சூத்திரமான வַיְהִי நவீனத் தமிழ் நடைக்கேற்ப இயல்பாகச் சுருக்கப்பட்டுள்ளது; பொருள் இழப்பு இல்லை.
  naturalness: நடை நவீன நிலையான தமிழில் தெளிவாகவும் இயல்பாகவும் உள்ளது. “மூன்று படைப்பிரிவுகளாக அமைத்தான்,” “அதிகாலை காவல் வேளையில்,” “முகாமின் நடுவே புகுந்து,” “சிதறிப்போனார்கள்” ஆகியவை வரலாற்று-இராணுவச் சூழலுக்கு ஏற்ற கண்ணியமான சொற்களாக உள்ளன.
