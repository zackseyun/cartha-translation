  text: וַ/יְהִ֣י מִֽ/מָּחֳרָ֗ת וַ/יָּ֨שֶׂם שָׁא֣וּל אֶת הָ/עָם֮ שְׁלֹשָׁ֣ה רָאשִׁים֒ וַ/יָּבֹ֤אוּ בְ/תוֹךְ הַֽ/מַּחֲנֶה֙ בְּ/אַשְׁמֹ֣רֶת הַ/בֹּ֔קֶר וַ/יַּכּ֥וּ אֶת עַמּ֖וֹן עַד חֹ֣ם הַ/יּ֑וֹם וַ/יְהִ֤י הַ/נִּשְׁאָרִים֙ וַ/יָּפֻ֔צוּ וְ/לֹ֥א נִשְׁאֲרוּ בָ֖/ם שְׁנַ֥יִם יָֽחַד־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/011/011.yaml
  text: And it happened on the next day that Saul set the people in three groups[a], and they came into the midst of the camp during the morning watch and struck Ammon until the heat of the day. And it happened that the survivors were scattered[c][b], so that no two of them were left together.
translation:
  language: ta
  text: மறுநாள், சவுல் மக்களை மூன்று படைப்பிரிவுகளாக[a] அமைத்தான். அவர்கள் அதிகாலை காவல் வேளையில்[b] முகாமின் நடுவே புகுந்து, பகல் சூடாகும் வரை[c] அம்மோனியரைத் தாக்கினர். தப்பிப்பிழைத்தவர்கள் சிதறிப்போனார்கள்; அவர்களில் இருவர்கூட ஒன்றாக எஞ்சியிருக்கவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொற்சொல்லாக ‘மூன்று தலைகள்’; இது மூன்று படைப்பிரிவுகள் அல்லது அணிகள் என்பதற்கான மரபுத்தொடர்.
    reason: lexical_alternative
  - marker: b
    text: இது விடியற்காலத்தை ஒட்டிய அதிகாலை இராணுவக் காவல் நேரத்தைக் குறிக்கிறது.
    reason: cultural_note
  - marker: c
    text: அல்லது, ‘பகலின் சூடு வரை’; இது நண்பகலை நெருங்கிய நேரத்தைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִמָּחֳרָת
  choice: மறுநாள்
  rationale: முந்தைய நிகழ்வுகளுக்கு அடுத்த நாளைக் குறிக்கும் இயல்பான, சுருக்கமான நவீனத் தமிழ் வடிவம்.
- source_word: וַיָּשֶׂם ... שְׁלֹשָׁה רָאשִׁים
  choice: மக்களை மூன்று படைப்பிரிவுகளாக அமைத்தான்
  rationale: எபிரெய மொழியில் சொற்சொல்லாக ‘மூன்று தலைகள்’ என்று இருந்தாலும், இங்கு அது மூன்று இராணுவப் பிரிவுகளைக் குறிக்கும் மரபுத்தொடர். ‘படைப்பிரிவுகள்’ சூழலைத் தெளிவாக்குகிறது.
- source_word: בְתוֹךְ הַמַּחֲנֶה
  choice: முகாமின் நடுவே புகுந்து
  rationale: எதிரியின் முகாமுக்குள் நுழைந்து அதன் உட்பகுதியை அடைந்த செயலின் இயக்கத்தையும் வலிமையையும் வெளிப்படுத்துகிறது.
- source_word: בְּאַשְׁמֹרֶת הַבֹּקֶר
  choice: அதிகாலை காவல் வேளையில்
  rationale: விடியற்காலத்தை ஒட்டிய இராணுவக் காவல் நேரத்தைக் குறிக்கும் சொற்றொடரை இயல்பான தமிழில் தருகிறது.
- source_word: וַיַּכּוּ אֶת עַמּוֹן
  choice: அம்மோனியரைத் தாக்கினர்
  rationale: ‘அம்மோன்’ என்பது இங்கு அம்மோனியப் படையினரை மொத்தமாகக் குறிக்கிறது. ‘தாக்கினர்’ மூல வினையின் இராணுவச் சூழலுக்குப் பொருத்தமாகவும், தேவையற்ற முடிவைச் சேர்க்காமலும் உள்ளது.
- source_word: עַד חֹם הַיּוֹם
  choice: பகல் சூடாகும் வரை
  rationale: ‘பகலின் சூடு வரை’ என்ற மூல மொழியின் உருவகத்தை இயல்பான தமிழில் காக்கிறது; இதைத் திட்டவட்டமாக ‘நண்பகல்’ என்று குறுக்கவில்லை.
- source_word: הַנִּשְׁאָרִים
  choice: தப்பிப்பிழைத்தவர்கள்
  rationale: போர்த் தாக்குதலுக்குப் பின் உயிருடன் எஞ்சியவர்களைச் சூழலுக்கு ஏற்றவாறு தெளிவாகக் குறிக்கிறது.
- source_word: וַיָּפֻצוּ
  choice: சிதறிப்போனார்கள்
  rationale: தோல்விக்குப் பின் படை முழுமையாகப் பிரிந்து பல திசைகளில் சிதறியதை இயல்பாகக் காட்டுகிறது.
- source_word: וְלֹא נִשְׁאֲרוּ בָם שְׁנַיִם יָחַד
  choice: அவர்களில் இருவர்கூட ஒன்றாக எஞ்சியிருக்கவில்லை
  rationale: எதிரிப்படை முற்றிலும் சிதறியதால் இருவர்கூட சேர்ந்து நிற்கவில்லை என்ற எபிரெய வலியுறுத்தலைக் காக்கிறது.
- source_word: וַיְהִי ... וַיְהִי
  choice: தமிழ் கதைநடையில் தனியே மொழிபெயர்க்காமல் நிகழ்வுகளின் தொடர்ச்சியாக வழங்கப்பட்டது
  rationale: எபிரெய கதைசொல்லல் சூத்திரத்தை ஒவ்வொரு முறையும் ‘அது நடந்தது’ என்று நேரடியாக வழங்குவது நவீன தமிழில் செயற்கையாக இருக்கும்; வாக்கியத் தொடர்ச்சி அதன் உரையாடல் பணியைத் தக்கவைக்கிறது.
