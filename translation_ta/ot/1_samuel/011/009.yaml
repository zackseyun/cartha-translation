  text: וַ/יֹּאמְר֞וּ לַ/מַּלְאָכִ֣ים הַ/בָּאִ֗ים כֹּ֤ה תֹֽאמְרוּ/ן֙ לְ/אִישׁ֙ יָבֵ֣ישׁ גִּלְעָ֔ד מָחָ֛ר תִּהְיֶֽה לָ/כֶ֥ם תְּשׁוּעָ֖ה ב/חם הַ/שָּׁ֑מֶשׁ וַ/יָּבֹ֣אוּ הַ/מַּלְאָכִ֗ים וַ/יַּגִּ֛ידוּ לְ/אַנְשֵׁ֥י יָבֵ֖ישׁ וַ/יִּשְׂמָֽחוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/011/009.yaml
  text: 'They said to the messengers who were coming[a], “Thus you shall say to the men of Jabesh-gilead: Tomorrow, by the heat of the sun, you will have deliverance.” So the messengers came and told the men of Jabesh[b], and they rejoiced.'
translation:
  language: ta
  text: 'அவர்கள் வந்திருந்த தூதர்களிடம், “யாபேஸ்-கீலேயாத் மக்களிடம் நீங்கள் இப்படிச் சொல்லுங்கள்: நாளை வெயில் கடுமையாக இருக்கும் நேரத்தில் உங்களுக்கு மீட்பு கிடைக்கும்” என்றார்கள். தூதர்கள் வந்து யாபேஸ் மக்களிடம் அதைத் தெரிவித்தார்கள்; அவர்கள் மகிழ்ந்தார்கள்.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַמַּלְאָכִים הַבָּאִים
  choice: வந்திருந்த தூதர்கள்
  rationale: இச்சூழலில் מַלְאָכִים என்பது விண்ணுலகத் தூதர்களை அல்ல, மனிதத் தூதுவர்களைக் குறிக்கிறது. הַבָּאִים என்ற எபிரெயப் பங்கேற்புவினையின் சூழல்சார் பொருளை ‘வந்திருந்த’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: כֹּה תֹאמְרוּן
  choice: நீங்கள் சொல்ல வேண்டியது இதுதான்
  rationale: நேரடிக் கூற்றை அறிமுகப்படுத்தும் எபிரெய மரபுத்தொடரைத் தெளிவான நவீன தமிழில் அளிக்கிறது.
- source_word: לְאִישׁ יָבֵישׁ גִּלְעָד
  choice: யாபேஸ் கீலேயாத் மக்களிடம்
  rationale: אִישׁ ஒருமையில் இருந்தாலும், நகரவாசிகளைத் தொகுப்பாகக் குறிக்கிறது. தமிழில் ‘மக்களிடம்’ என்பது தவறான தனிநபர் பொருளைத் தவிர்க்கிறது.
- source_word: תִּהְיֶה לָכֶם תְּשׁוּעָה
  choice: உங்களுக்கு விடுதலை கிடைக்கும்
  rationale: இங்கு תְּשׁוּעָה முற்றுகையிலிருந்தும் இராணுவ அச்சுறுத்தலிலிருந்தும் கிடைக்கும் மீட்பைக் குறிக்கிறது. ‘விடுதலை’ அந்தச் சூழலைத் தெளிவாகக் காட்டுவதுடன், தேவையற்ற பிற்கால இறையியல் பொருளைத் திணிக்காது.
- source_word: בְחֹם הַשָּׁמֶשׁ
  choice: வெயில் சூடேறும் வேளையில்
  rationale: சூரிய வெப்பம் அதிகரிக்கும் பகல்நேரத்தை இயல்பான தமிழில் குறிக்கிறது; ‘நண்பகல்’ என்று தேவைக்கு அதிகமாகத் துல்லியப்படுத்தவில்லை.
- source_word: וַיַּגִּידוּ
  choice: தெரிவித்தார்கள்
  rationale: செய்தியை அறிவித்தல் என்ற கதைச்சூழலுக்கு இயல்பான தமிழ் வினை.
- source_word: לְאַנְשֵׁי יָבֵישׁ
  choice: யாபேசில் அங்கிருந்த ஆண்களிடம்
  rationale: אַנְשֵׁי என்பதன் வெளிப்படையான ‘ஆண்கள்’ பொருளைப் பாதுகாக்கிறது; இடப்பொருளை இயல்பாக்க வாக்கியத்தில் ‘யாபேசுக்கு வந்து, அங்கிருந்த ஆண்களிடம்’ என அமைக்கப்பட்டுள்ளது.
- source_word: וַיִּשְׂמָחוּ
  choice: அவர்கள் மகிழ்ச்சியடைந்தார்கள்
  rationale: செய்தியைப் பெற்றவர்களின் மகிழ்ச்சியை இயல்பான, கண்ணியமான நடையில் வெளிப்படுத்துகிறது.
