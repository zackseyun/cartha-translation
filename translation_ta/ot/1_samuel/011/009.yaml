translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. இடப்பெயர்கள் ‘யாபேஸ்’, ‘கீலேயாத்’ என ஒலிபெயர்க்கப்பட்டுள்ளன. மூலத்தின் தொகுப்பு ஒருமையும் வெப்பநேரச் சொல்லாட்சியும் அடிக்குறிப்புகளில் பாதுகாக்கப்பட்டுள்ளன.
