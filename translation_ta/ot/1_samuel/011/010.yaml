base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/011/010.yaml
  text: So the men of Jabesh said[a], “Tomorrow we will come out to you, and you may do to us whatever seems good in your eyes.”
translation:
  language: ta
  text: அப்போது யாபேஸின் ஆண்கள், “நாளை நாங்கள் உங்களிடம் வெளியே வருவோம்[a]. உங்கள் பார்வையில் எது நல்லதாகத் தோன்றுகிறதோ, அதையெல்லாம் எங்களுக்குச் செய்யுங்கள்” என்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நாங்கள் உங்களிடம் புறப்பட்டு வருவோம்.” எபிரெயத்தில் “சரணடைவோம்” என்று வெளிப்படையாகச் சொல்லப்படவில்லை; ஆனால் சூழல் அவர்கள் அடிபணிவதாகக் காட்டுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: அப்போது ... என்றார்கள்
  rationale: தொடர்ச்சியாக முன்னேறும் கதைநடையை இயல்பான நவீனத் தமிழில் காட்டுகிறது; காரணவிளைவைத் தேவையின்றி வலுப்படுத்தவில்லை.
- source_word: אַנְשֵׁי יָבֵישׁ
  choice: யாபேசின் ஆண்கள்
  rationale: இந்த வசனத்தில் உள்ள இடப்பெயரையும், אַנְשֵׁי என்பதன் குறிப்பான ‘ஆண்கள்’ என்ற பொருளையும் தக்கவைக்கிறது; ‘யாபேஸ்-கீலேயாத்’ என்ற விரிவான பெயர் இங்கு மூலத்தில் இல்லை.
- source_word: מָחָר
  choice: நாளை
  rationale: அடுத்த நாளைக் குறிக்கும் காலவினையடை; நேரடியான இயல்பான மொழிபெயர்ப்பு.
- source_word: נֵצֵא אֲלֵיכֶם
  choice: நாங்கள் உங்களிடம் வெளியே வருவோம்
  rationale: יצא என்பதன் ‘வெளியே செல்லுதல்/வருதல்’ என்ற வெளிப்படையான பொருளைப் பாதுகாக்கிறது. சூழல் சரணடைவதைக் குறிப்பதாக இருந்தாலும், அதை மூலச்சொல்லுக்குள் சேர்க்கவில்லை.
- source_word: וַעֲשִׂיתֶם לָּנוּ
  choice: எங்களுக்குச் செய்யுங்கள்
  rationale: பேசுவோர் எதிரிகளுக்குத் தங்களை ஒப்புக்கொடுப்பதன் சூழலில், தமிழில் இயல்பான அனுமதி சார்ந்த கட்டளை வடிவம்; கண்டிப்பான ஆணையாகப் புரிந்துகொள்ள வேண்டியதில்லை.
- source_word: כְּכָל הַטּוֹב בְּעֵינֵיכֶם
  choice: உங்கள் கண்களுக்கு எது நல்லதாகத் தோன்றுகிறதோ, அதையெல்லாம்
  rationale: ‘உங்கள் பார்வையில் நல்லது’ என்ற எபிரெய மரபுத்தொடரின் உருவகத்தைப் பாதுகாக்கிறது; வெறுமனே ‘உங்களுக்கு விருப்பமானதை’ என்று பொருளைச் சுருக்கவில்லை.
