  register: நவீன பொதுத்தமிழில், ஆனால் வேதாகமக் கதைநடைக்கு ஏற்ற கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. மூலத்தின் ‘உங்கள் கண்களுக்கு நல்லதாக’ என்ற உருவகம் வாசிக்கத்தக்க வகையில் தக்கவைக்கப்பட்டது; சூழல் உணர்த்தும் ‘சரணடைதல்’ முதன்மை உரைக்குள் விளக்கமாகச் சேர்க்கப்படவில்லை.
