base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/027/011.yaml
  text: David left alive neither man nor woman to bring to Gath[a], saying, “Otherwise they might report about us, saying, ‘This is what David did[b], and this was his practice all the days that he lived in the country of the Philistines.’”
translation:
  language: ta
  text: காத்துக்குக் கொண்டுவர யாரும் உயிரோடு இருக்காதபடி, தாவீது எந்த ஆணையும் பெண்ணையும் உயிரோடு விட்டுவைக்கவில்லை. “இல்லையென்றால் அவர்கள், ‘தாவீது இப்படிச் செய்தான்; பெலிஸ்தியரின் நாட்டில்[a] அவன் குடியிருந்த காலமெல்லாம் இதுவே அவனுடைய வழக்கம்[b]’ என்று எங்களைப் பற்றி அறிவித்துவிடுவார்கள்” என்று அவன் எண்ணினான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் நேரடியாக, “பெலிஸ்தியரின் வயலில்/வெளியில்”; இங்கு பெலிஸ்தியரின் பிரதேசம் அல்லது நாட்டுப்புறம் என்று பொருள்.
    reason: cultural_note
  - marker: b
    text: அல்லது “அவனுடைய நடைமுறை”; இங்குள்ள எபிரெயச் சொல் சூழலைப் பொறுத்து முறை, வழக்கம், நியமம், தீர்ப்பு ஆகிய பொருள்களைத் தரக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִישׁ וְאִשָּׁה
  choice: எந்த ஆணையும் பெண்ணையும்
  rationale: எபிரெய ஒற்றைச் சொல் இணை இங்கு பகிர்ந்தளிக்கும் பொருளில், ஆணோ பெண்ணோ யாரும் விதிவிலக்கல்ல என்பதைக் குறிக்கிறது. இயல்பான நவீனத் தமிழில் அந்த முழுமையை இச்சொற்றொடர் தருகிறது.
- source_word: לֹא יְחַיֶּה
  choice: உயிரோடு விடவில்லை
  rationale: חיה என்பதன் பியேல் வடிவம் இங்கு ஒருவரை உயிருடன் காப்பாற்றுதல் அல்லது தப்பவிடுதல் என்ற பொருள் தருகிறது; ‘உயிரோடு விடவில்லை’ என்பது தெளிவான இயல்பான தமிழ்.
- source_word: לְהָבִיא גַת
  choice: காத்துக்குக் கொண்டுவரும்படி
  rationale: 'நோக்கம் அல்லது விளைவைக் குறிக்கும் எபிரெய வினையெச்ச அமைப்பைப் பேணுகிறது: காத்துக்குக் கொண்டுவரப்படக்கூடிய உயிர்பிழைத்தவர் எவரையும் தாவீது விட்டுவைக்கவில்லை.'
- source_word: פֶּן יַגִּדוּ עָלֵינוּ
  choice: இல்லையென்றால் அவர்கள் … நம்மைப் பற்றி அறிவித்துவிடலாம்
  rationale: פֶּן குறிக்கும் தவிர்க்கப்பட வேண்டிய சாத்தியத்தையும், נגד என்பதன் ‘தெரிவித்தல்/அறிவித்தல்’ பொருளையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: כֹּה עָשָׂה דָוִד
  choice: தாவீது இப்படிச் செய்தான்
  rationale: כֹּה என்பதன் சுட்டுப்பொருளை நேரடியாகவும் இயல்பாகவும் பேணுகிறது.
- source_word: וְכֹה מִשְׁפָּטוֹ
  choice: இதுவே அவனுடைய வழக்கம்
  rationale: מִשְׁפָּט இச்சூழலில் தீர்ப்பு அல்லது சட்டம் என்பதைக் காட்டிலும் தொடர்ந்து பின்பற்றிய நடைமுறை அல்லது வழக்கத்தைக் குறிக்கிறது; அதன் பரந்த சொற்பொருள் சாத்தியத்தை அடிக்குறிப்பு குறிப்பிடுகிறது.
- source_word: בִּשְׂדֵה פְלִשְׁתִּים
  choice: பெலிஸ்தியரின் நிலப்பகுதியில்
  rationale: שָׂדֶה என்பதன் நேர்ப்பொருள் ‘வயல்/வெளி’; இங்கு அது பெலிஸ்தியரின் பிரதேசம் அல்லது நாட்டுப்புறப் பகுதி என்ற விரிந்த புவியியல் பொருளில் வருகிறது.
theological_decisions:
- issue: לֵאמֹר அறிமுகப்படுத்தும் தாவீதின் காரணவிளக்கம்
  choice: என்று எண்ணினான்
  alternative: என்று கூறினான்
  rationale: எபிரெயச் சொல் நேரடியாக ‘சொல்லி’ என்றாலும், இங்கு யாரிடமும் உரைக்கப்பட்ட பேச்சை விட தாவீதின் செயலுக்கான உள்ளார்ந்த காரணத்தை அறிமுகப்படுத்துகிறது. வெளிப்படையான பேச்சாளரை உருவாக்காமல் சூழலின் பொருளைத் தமிழில் தெளிவாக்குகிறது.
- issue: மேற்கோளின் எல்லை
  choice: ‘இதுவே அவனுடைய வழக்கம்’ என்பதையும் சாத்தியமான தகவலறிக்கைக்குள் வைத்தல்
  alternative: அதை உரையாளர் தரும் தனி விளக்கமாக அமைத்தல்
  rationale: எபிரெயத்தில் நவீன மேற்கோள் குறிகள் இல்லாததால் எல்லை முழுமையாக வெளிப்படையல்ல. ஆனால் இரண்டாவது כֹּה, முதல் כֹּה עָשָׂה דָוִד உடன் இணைந்து உயிர்பிழைத்தவர்கள் அளிக்கக்கூடிய அறிக்கையின் தொடர்ச்சியாக இயல்பாக வாசிக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. ‘காத்’, ‘பெலிஸ்தியர்’ போன்ற வழக்கமான வேதாகமப் பெயர்வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன; மூலத்தின் கடுமையான நிகழ்வும் காரணவிளக்கமும் மென்மைப்படுத்தப்படவில்லை.
