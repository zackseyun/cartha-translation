base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/027/006.yaml
  text: So Achish gave him Ziklag that day[b][a]. Therefore Ziklag has belonged to the kings of Judah to this day.
translation:
  language: ta
  text: அன்று ஆகீஸ் அவனுக்குச் சிக்லாகைக் கொடுத்தான். ஆகையால் சிக்லாக் இன்றுவரை யூதாவின் அரசர்களுக்குச் சொந்தமாக இருந்து வருகிறது.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּתֶּן
  choice: கொடுத்தான்
  rationale: இந்தக் கதைச்சூழலில் נתן என்பதன் இயல்பான பொருள் ‘கொடுத்தான்’; ‘ஒதுக்கிக் கொடுத்தான்’ என்ற நுணுக்கம் சாத்தியமானாலும் அவசியமில்லை.
- source_word: לּוֹ
  choice: அவனுக்கு
  rationale: மூன்றாம் நபர் ஆண்பால் ஒருமை பின்னொட்டு உடனடிச் சூழலில் தாவீதைக் குறிக்கிறது.
- source_word: אָכִישׁ
  choice: ஆகீஸ்
  rationale: தனிப்பெயர் தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: בַּיּוֹם הַהוּא
  choice: அன்று
  rationale: ‘அந்த நாளில்’ என்பதற்கு இயல்பான நவீனத் தமிழ் காலவினையடை; காலக் குறிப்பின் தனித்தன்மையையும் காக்கிறது.
- source_word: אֶת צִקְלָג
  choice: சிக்லாகை
  rationale: אֶת நேரடி செயப்படுபொருள் குறியீடு தனியாக மொழிபெயர்க்கப்படவில்லை; இடப்பெயர் ஒலிபெயர்க்கப்பட்டு வேற்றுமை உருபு சேர்க்கப்பட்டுள்ளது.
- source_word: לָכֵן
  choice: ஆகையால்
  rationale: ஆகீஸ் அந்த நகரத்தைக் கொடுத்ததன் விளைவைக் குறிக்கும் காரண–விளைவு இணைப்பைத் தெளிவாகக் காக்கிறது.
- source_word: הָיְתָה ... לְמַלְכֵי יְהוּדָה
  choice: யூதாவின் அரசர்களுக்குச் சொந்தமாக இருந்து வருகிறது
  rationale: ‘இன்றுவரை’ என்பதுடன் சேர்ந்து, அந்த இடம் தொடர்ந்து யூத அரசர்களின் உடைமையில் இருந்த நிலையைக் காட்டுகிறது.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: இன்றுவரை
  rationale: கதைசொல்லியின் காலம்வரை நிலை தொடர்ந்ததைக் குறிக்கும் இயல்பான தமிழ் மரபுத்தொடர்.
theological_decisions:
- issue: ‘இன்றுவரை’ மற்றும் ‘யூதாவின் அரசர்கள்’ என்பவை உணர்த்தும் வரலாற்றுப் பின்னோக்கு
  choice: கதைசொல்லியின் பின்னோக்குக் குறிப்பை விளக்கமோ இசைவாக்கமோ இன்றித் தக்கவைத்தல்
  alternative: இது பிற்கால யூத அரசாட்சி நோக்கை வெளிப்படுத்துகிறது என்று மொழிபெயர்ப்பிலேயே விரிவாக்குதல்
  rationale: எபிரெய உரை வரலாற்று நிலையை மட்டும் கூறுகிறது; நூலாசிரியர் அல்லது தொகுப்புக் காலம் குறித்த கோட்பாட்டை மொழிபெயர்ப்பில் சேர்க்கக் கூடாது.
translation_notes:
  register: நவீன தரநிலைத் தமிழ்; எளிமையானதாயினும் கண்ணியமான வேதாகம நடையில் அமைந்துள்ளது. சொந்தத்தையும் தொடர்நிலையையும் இயல்பாக வெளிப்படுத்த ‘சொந்தமாக இருந்து வருகிறது’ பயன்படுத்தப்பட்டுள்ளது.
