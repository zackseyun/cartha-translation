translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான வரலாற்று நடையைக் கையாள்கிறது. ‘கொள்ளையடிக்கும் படையெடுப்புகள்’ என்பது தாக்குதல்களின் இராணுவ மற்றும் கொள்ளை நோக்கங்களை இரண்டையும் வெளிப்படுத்துகிறது. மக்களினப் பெயர்கள் தமிழ் ஒலியமைப்புக்கு ஏற்றவாறு தரப்பட்டுள்ளன.
