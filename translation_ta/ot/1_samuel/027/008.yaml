base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/027/008.yaml
  text: Then David and his men went up and made raids against the Geshurites[a], the Girzites, and the Amalekites, for these were the inhabitants of the land from ancient times, as you go to Shur[b], even to the land of Egypt.
translation:
  language: ta
  text: பின்பு தாவீதும் அவனுடைய ஆட்களும் ஏறிச் சென்று, கெஷூரியர், கிர்சியர்[a], அமலேக்கியர் ஆகியோர்மீது கொள்ளையடிக்கும் தாக்குதல்களை நடத்தினர். ஏனெனில், பழங்காலந்தொட்டே சூரை நோக்கிச் செல்லும் வழியில் எகிப்து நாடுவரையுள்ள அந்த நிலத்தில் குடியிருந்தவர்கள் இவர்களே.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இந்த மக்களினப் பெயரின் எபிரெய வடிவமும் அதன் ஒலிபெயர்ப்பும் உறுதியற்றவை; “கெஸ்ரியர்” என்றும் வாசிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெய் நிலவியல் தொடரை, “சூரை அடையும் திசையில், எகிப்து நாடுவரை” என்றும் மொழிபெயர்க்கலாம்.
    reason: textual_ambiguity
lexical_decisions:
- source_word: וַיַּעַל
  choice: ஏறிப்போய்
  rationale: עלה என்ற வினையின் திசை உணர்வைத் தக்கவைக்கிறது; வெறுமனே ‘புறப்பட்டு’ என்று பொதுமைப்படுத்தவில்லை.
- source_word: וַיִּפְשְׁטוּ אֶל
  choice: மீது கொள்ளையடிக்கும் படையெடுப்புகளை நடத்தினர்
  rationale: இராணுவச் சூழலில் פשט என்பது கொள்ளையிடும் திடீர்த் தாக்குதல் அல்லது படையெடுப்பைக் குறிக்கிறது; אֶל பகைமை நோக்கிய இலக்கைச் சுட்டுவதால் ‘மீது’ என வழங்கப்பட்டது.
- source_word: הַגְּשׁוּרִי
  choice: கெசூரியர்
  rationale: மக்களினப் பெயரை நவீனத் தமிழில் இயல்பான பன்மை வடிவில் ஒலிபெயர்க்கிறது.
- source_word: הגרזי
  choice: கிர்சியர்
  rationale: கொடுக்கப்பட்ட எபிரெய் மெய்யெழுத்து வடிவமான גרזי-ஐ நெருக்கமாகப் பின்பற்றும் மக்களினப் பெயர்; உரை மற்றும் பெயர்ப்பில் உள்ள ஐயத்தை அடிக்குறிப்பு தெரிவிக்கிறது.
- source_word: הָעֲמָלֵקִי
  choice: அமலேக்கியர்
  rationale: அமலேக் மக்களைக் குறிக்கும் வழக்கமான தமிழ் மக்களினப் பெயர்.
- source_word: כִּי הֵנָּה יֹשְׁבוֹת הָאָרֶץ
  choice: நிலப்பகுதியில் குடியிருந்தவர்கள் இவர்களே
  rationale: பெண்பால் பன்மைச் சுட்டுப்பெயரும் வினையெச்சமும் கூட்டாகக் கருதப்படும் மக்கள் குழுக்களைக் குறிப்பதை இயல்பான தமிழில் வெளிப்படுத்துகிறது; הֵנָּה-வின் சுட்டும் வலியுறுத்தலை ‘இவர்களே’ தக்கவைக்கிறது.
- source_word: מֵעוֹלָם
  choice: பழங்காலந்தொட்டு
  rationale: இங்கு காலமற்ற நித்தியத்தை அல்ல, மிகப் பழைய காலத்திலிருந்து தொடரும் குடியிருப்பைக் குறிக்கிறது.
- source_word: בּוֹאֲךָ שׁוּרָה וְעַד אֶרֶץ מִצְרָיִם
  choice: சூருக்குச் செல்லும் வழியிலிருந்து எகிப்து நாடுவரையுள்ள
  rationale: בואך என்ற வழக்காற்றை நிலவியல் எல்லைக் குறிப்பாக இயல்பான தமிழில் வழங்கி, שׁוּר முதல் எகிப்து நிலம் வரையான பரப்பை வெளிப்படுத்துகிறது.
