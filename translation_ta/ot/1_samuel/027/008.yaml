  source_fidelity: திருத்தம் தேவை. தற்போதைய மொழிபெயர்ப்பில் நிலவியல் தொடரான בּוֹאֲךָ שׁוּרָה וְעַד אֶרֶץ מִצְרָיִם, ‘சூருக்குச் செல்லும் வழியிலிருந்து’ என்று தொடக்க எல்லையாக மாற்றப்பட்டுள்ளது. எபிரெயில் ‘முதல்’ என்பதற்கான சொல் சூருக்கு முன் இல்லை; இது ‘சூரை நோக்கிச் செல்லும் வழியில்/சூரை அடையும் திசையில், எகிப்து நாடுவரை’ என்ற வழக்காற்றுத் தொடராகவே பாதுகாக்கப்பட வேண்டும். கிர்சியர் என்ற பெயருக்கு உரைமரபு மற்றும் ஒலிபெயர்ப்பு ஐயம் இருப்பதை அடிக்குறிப்பு முறையாகச் சுட்டுகிறது.
  naturalness: ‘ஏறிப்போய்’ மற்றும் ‘கொள்ளையடிக்கும் படையெடுப்புகளை நடத்தினர்’ புரியக்கூடியவை; ஆனால் ‘ஏறிச் சென்று’ மற்றும் ‘கொள்ளையடிக்கும் தாக்குதல்களை நடத்தினர்’ நவீன நிலையான தமிழில் அதிக இயல்பாக உள்ளன. திருத்தப்பட்ட வாக்கிய அமைப்பு நிலப்பரப்பின் எல்லையைத் தெளிவாகவும், மூலத்தின் வழக்காற்று நுணுக்கத்தைப் பாதுகாத்தும் வழங்குகிறது.
