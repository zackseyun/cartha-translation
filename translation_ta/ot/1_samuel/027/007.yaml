  register: நவீனத் தரத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. எபிரெய மொழியின் காலச் சுருக்கச் சொற்றொடரைத் தமிழில் தேவையற்ற கடினத்தன்மையின்றி வழங்கி, அதன் சொற்படியான வடிவத்தை [a] அடிக்குறிப்பில் பதிவு செய்துள்ளது.
