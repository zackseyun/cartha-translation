source:
  edition: WLC
  text: וַֽ/יְהִי֙ מִסְפַּ֣ר הַ/יָּמִ֔ים אֲשֶׁר יָשַׁ֥ב דָּוִ֖ד בִּ/שְׂדֵ֣ה פְלִשְׁתִּ֑ים יָמִ֖ים וְ/אַרְבָּעָ֥ה חֳדָשִֽׁים־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/027/007.yaml
  text: The number of days that David lived in the territory of the Philistines was a year and four months[a].
translation:
  language: ta
  text: தாவீது பெலிஸ்தியரின் நாட்டில் குடியிருந்த காலம் ஓராண்டும் நான்கு மாதங்களும்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மொழியில் சொற்படியாக, “நாட்களும் நான்கு மாதங்களும்.” கால அளவைக் குறிக்கும் இத்தகைய சொற்றொடரில் “நாட்கள்” என்பது “ஓராண்டு” என்பதைக் குறிக்கும் மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי מִסְפַּר הַיָּמִים
  choice: காலம் ...
  rationale: எபிரெயச் சொற்றொடர் சொற்படியாக ‘நாட்களின் எண்ணிக்கை ... இருந்தது’ எனினும், இங்கு தங்கியிருந்த கால அளவைச் சுருக்கமாகக் கூறுகிறது. இயல்பான நவீன தமிழில் ‘காலம்’ அதையே தெளிவாகத் தெரிவிக்கிறது.
- source_word: אֲשֶׁר יָשַׁב דָּוִד
  choice: தாவீது ... குடியிருந்த
  rationale: יָשַׁב இச்சூழலில் உட்கார்ந்திருப்பதைக் குறிக்காமல், ஒரு பகுதியில் வசித்தல் அல்லது தங்கியிருத்தலைக் குறிக்கிறது. நீண்டகால வசிப்பை ‘குடியிருந்த’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: בִּשְׂדֵה פְלִשְׁתִּים
  choice: பெலிஸ்தியரின் நாட்டில்
  rationale: שְׂדֵה என்பதன் அடிப்படைப் பொருள் ‘வெளி/வயல்’ என்றாலும், ஓர் இனத்துடன் வரும் இக்கட்டமைப்பில் அவர்களுடைய நிலப்பகுதி அல்லது நாட்டைக் குறிக்கிறது. ‘நாட்டில்’ தமிழில் புவியியல் பொருளைத் தெளிவாக அளிக்கிறது.
- source_word: יָמִים וְאַרְבָּעָה חֳדָשִׁים
  choice: ஓராண்டும் நான்கு மாதங்களும்
  rationale: கால அளவைக் குறிக்கும் இத்தகைய எபிரெயச் சொற்றொடரில் יָמִים (‘நாட்கள்’) என்பது வழக்குப்படி ‘ஓராண்டு’ என்று பொருள்படும். அந்த உவமைவழக்கின் பொருளை முதன்மை உரையில் கொடுத்து, சொற்படியான வடிவத்தை அடிக்குறிப்பில் பாதுகாக்கிறோம்.
