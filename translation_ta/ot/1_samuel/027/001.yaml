  text: וַ/יֹּ֤אמֶר דָּוִד֙ אֶל לִבּ֔/וֹ עַתָּ֛ה אֶסָּפֶ֥ה יוֹם אֶחָ֖ד בְּ/יַד שָׁא֑וּל אֵֽין לִ֨/י ט֜וֹב כִּ֣י הִמָּלֵ֥ט אִמָּלֵ֣ט אֶל אֶ֣רֶץ פְּלִשְׁתִּ֗ים וְ/נוֹאַ֨שׁ מִמֶּ֤/נִּי שָׁאוּל֙ לְ/בַקְשֵׁ֤/נִי עוֹד֙ בְּ/כָל גְּב֣וּל יִשְׂרָאֵ֔ל וְ/נִמְלַטְתִּ֖י מִ/יָּדֽ/וֹ־־־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/027/001.yaml
  text: Then David said in his heart[a], “Now I will one day perish by the hand of Saul. There is nothing better for me than that I should surely escape to the land of the Philistines. Then Saul will despair of seeking me any longer in all the territory of Israel[c][b], and I will escape from his hand.”
translation:
  language: ta
  text: தாவீது தனக்குள், “இப்போது ஒருநாள் நான் சவுலின் கையால் அழிந்துபோவேன். பெலிஸ்தியரின் நாட்டிற்குத் தப்பிச் செல்வதே எனக்கு நல்லது வேறொன்றுமில்லை[b]. அப்போது சவுல் இஸ்ரவேலின் எல்லாப் பகுதிகளிலும் என்னை இனித் தேடுவதை கைவிட்டுவிடுவான்[c]; நான் அவன் கையிலிருந்து தப்புவேன்” என்று சொல்லிக்கொண்டான்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தன் உள்ளத்தில்.” எபிரேயத்தில் நேரடியாக “தன் உள்ளத்திடம்” என்று உள்ளது.
    reason: lexical_alternative
  - marker: b
    text: எபிரேயத்தில் “தப்புதல், நான் தப்புவேன்” என்ற வினை இருமுறை அமைந்து, தப்பிச் செல்லும் கருத்தை வலியுறுத்துகிறது.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, “அப்போது என்னை இனித் தேடுவதில் சவுல் நம்பிக்கையிழப்பான்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶל־לִבּוֹ
  choice: தன் உள்ளத்தில் ... சொல்லிக்கொண்டான்
  rationale: உள்ளார்ந்த பேச்சைக் குறிக்கும் எபிரேய மரபுத்தொடரின் உருவகத்தைக் காத்து, தமிழில் இயல்பாக உள்மன உரையாடலை வெளிப்படுத்துகிறது.
- source_word: אֶסָּפֶה
  choice: அழிந்துபோவேன்
  rationale: நிபால் வடிவிலுள்ள ספָה இங்கு முற்றிலும் அகற்றப்படுதல் அல்லது அழிவுறுதல் என்ற பொருள் தருகிறது. ‘அழிந்துபோவேன்’ என்பது தமிழில் இயல்பாகவும் அச்சுறுத்தலின் தீவிரத்துடனும் உள்ளது; ‘அடித்துச் செல்லப்படுவேன்’ என்ற உருவக வாய்ப்பு அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: יוֹם אֶחָד
  choice: என்றாவது ஒருநாள்
  rationale: குறிப்பிடப்படாத எதிர்கால நாளைச் சுட்டும் காலவழக்கை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: בְּיַד שָׁאוּל
  choice: சவுலின் கையால்
  rationale: சவுலின் செயலாற்றலையும் அதிகாரத்தையும் குறிக்கும் ‘கை’ உருவகத்தைப் பாதுகாக்கிறது.
- source_word: אֵין לִי טוֹב כִּי
  choice: '... தவிர எனக்கு நல்லது வேறொன்றுமில்லை'
  rationale: ஒப்பீட்டு நன்மையைக் கூறும் எபிரேய அமைப்பை இயல்பான தமிழில், அதிகப்படியாக விளக்காமல் தருகிறது.
- source_word: הִמָּלֵט אִמָּלֵט
  choice: தப்பியோடுவதை
  rationale: முற்றுவினையெச்சமும் வினையும் இணையும் எபிரேய வலியுறுத்தல் தமிழில் நேரடியாகப் பிரதிபலித்தால் செயற்கையாகும்; அதன் உறுதியான நோக்கம் சூழலில் வெளிப்படுகிறது, மேலும் வடிவியல் வலியுறுத்தல் அடிக்குறிப்பில் குறிப்பிடப்படுகிறது.
- source_word: אֶל אֶרֶץ פְּלִשְׁתִּים
  choice: பெலிஸ்தியரின் நாட்டிற்கு
  rationale: புவியியல் சொற்றொடரைத் தெளிவாகவும் மூலத்திற்கு நெருக்கமாகவும் தருகிறது.
- source_word: וְנוֹאַשׁ מִמֶּנִּי שָׁאוּל
  choice: சவுல் கைவிட்டுவிடுவான்
  rationale: יאשׁ இச்சூழலில் நம்பிக்கையிழந்து ஒரு முயற்சியை விட்டுவிடுதல் என்று பொருள்படும். தமிழில் ‘கைவிட்டுவிடுவான்’ தொடர்ந்த தேடலை நிறுத்துவதைத் தெளிவாகக் காட்டுகிறது; ‘நம்பிக்கையிழந்துவிடுவான்’ என்ற மாற்று அடிக்குறிப்பில் உள்ளது.
- source_word: לְבַקְשֵׁנִי עוֹד
  choice: என்னைத் தொடர்ந்து தேடுவதை
  rationale: עוֹד குறிக்கும் தொடர்ச்சியான தேடலை ‘தொடர்ந்து’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: בְּכָל גְּבוּל יִשְׂרָאֵל
  choice: இஸ்ரவேலின் எல்லாப் பகுதிகளிலும்
  rationale: גְּבוּל இங்கு எல்லைக்கோட்டை மட்டும் அல்லாமல் நாட்டின் முழுப் பரப்பையும் குறிக்கிறது.
- source_word: וְנִמְלַטְתִּי מִיָּדוֹ
  choice: நான் அவன் கையிலிருந்து தப்புவேன்
  rationale: மீண்டும் வரும் தப்புதல் கருத்தையும், சவுலின் அதிகாரத்தைக் குறிக்கும் ‘கை’ உருவகத்தையும் பாதுகாக்கிறது.
theological_decisions:
- issue: தாவீதின் உள்ளார்ந்த முடிவை தெய்வீக வழிநடத்தலாகவோ நம்பிக்கையின்மையாகவோ மதிப்பிடுதல்
  choice: வசனம் கூறும் உள்ளார்ந்த சிந்தனையையும் திட்டத்தையும் மட்டும் மொழிபெயர்த்தல்
  alternative: அதை வெளிப்படையாக விசுவாசக் குறைவு அல்லது தேவ வழிநடத்தல் என விளக்குதல்
  rationale: எபிரேய உரை இவ்வசனத்தில் தாவீதின் முடிவைத் தெரிவிக்கிறது; அதற்குத் தெய்வியல் தீர்ப்பு வழங்கவில்லை. ஆகவே அந்தத் திறந்த நிலை பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான உரைநடை பயன்படுத்தப்பட்டுள்ளது. ‘உள்ளம்’, ‘கை’ ஆகிய மூல உருவகங்கள் புரிதலைத் தடைக்காத இடங்களில் காக்கப்பட்டுள்ளன. ‘எல்லாப் பகுதிகளிலும்’ என்பது எல்லைக்கோடு என்ற தவறான புரிதலைத் தவிர்த்து நாட்டின் முழுப் பரப்பைத் தருகிறது.
