base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/027/009.yaml
  text: David struck the land and left alive neither man nor woman[a], and he took sheep, cattle, donkeys, camels, and clothing. Then he returned and came to Achish.
translation:
  language: ta
  text: தாவீது அந்தப் பகுதியைத் தாக்கி, ஆணோ பெண்ணோ ஒருவரையும் உயிரோடு விடவில்லை[a]. ஆடுகள், மாடுகள், கழுதைகள், ஒட்டகங்கள், உடைகள் ஆகியவற்றை எடுத்துக்கொண்டு, திரும்பி ஆகீசிடம் வந்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஆணையும் பெண்ணையும் வாழ விடவில்லை.”
    reason: חיה என்பதன் ஹிஃபில் வடிவத்தின் நேரடியான மாற்று மொழிபெயர்ப்பு.
lexical_decisions:
- source_word: וְהִכָּה
  choice: தாக்கி
  rationale: נכה என்பதன் ஹிஃபில் வடிவம் தாக்குதல் அல்லது அடித்து வீழ்த்துதலைக் குறிக்கலாம். சூழலில் இராணுவத் தாக்குதல் தெளிவாக இருப்பதால், கூடுதல் விவரத்தைச் சேர்க்காமல் ‘தாக்கி’ என மொழிபெயர்க்கப்பட்டது.
- source_word: הָאָרֶץ
  choice: அந்தப் பகுதியை
  rationale: இங்கு אֶרֶץ என்பது பூமியை அல்ல, தாக்கப்பட்ட மக்கள் வாழ்ந்த நிலப்பகுதியைக் குறிக்கிறது. நவீனத் தமிழில் ‘அந்தப் பகுதி’ இயல்பாகவும் சூழலுக்கேற்றவாறும் உள்ளது.
- source_word: וְלֹא יְחַיֶּה אִישׁ וְאִשָּׁה
  choice: ஆணோ பெண்ணோ ஒருவரையும் உயிரோடு விடவில்லை
  rationale: חיה என்பதன் ஹிஃபில் வடிவம் ‘உயிரோடு வைத்திருத்தல்/வாழ விடுதல்’ எனப் பொருள்படும். எபிரெய உரையிலுள்ள ஆண்–பெண் இணைப்பையும் யாரும் தப்பவிடப்படவில்லை என்ற கடுமையையும் இச்சொற்றொடர் இயல்பான தமிழில் காக்கிறது.
- source_word: וְלָקַח
  choice: எடுத்துக்கொண்டு
  rationale: לקח என்பதன் அடிப்படைப் பொருள் ‘எடுத்தல்’. கொள்ளைச் சூழல் வாசகத்திலேயே தெளிவாக இருப்பதால் ‘கைப்பற்றினான்’ போன்ற வலுவூட்டலைச் சேர்க்கவில்லை.
- source_word: צֹאן וּבָקָר
  choice: ஆடுகள், மாடுகள்
  rationale: צֹאן சிறிய கால்நடைகளையும் בָקָר மாட்டினத்தையும் குறிக்கின்றன. பட்டியலைத் தெளிவான, வழக்கமான தமிழில் வழங்க ‘ஆடுகள், மாடுகள்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: חֲמֹרִים וּגְמַלִּים וּבְגָדִים
  choice: கழுதைகள், ஒட்டகங்கள், உடைகள்
  rationale: மூன்று சொற்களுக்கும் நேரான, நவீனத் தமிழ் இணைகள் பயன்படுத்தப்பட்டு, கொள்ளைப் பொருட்களின் பட்டியல் பாதுகாக்கப்பட்டது.
- source_word: וַיָּשָׁב וַיָּבֹא אֶל אָכִישׁ
  choice: திரும்பி ஆகீசிடம் வந்தான்
  rationale: எபிரெயத்தில் உள்ள ‘திரும்பினான்’ மற்றும் ‘வந்தான்’ ஆகிய இரு தொடர் செயல்களும் சுருக்கமான, இயல்பான தமிழில் காக்கப்பட்டுள்ளன.
- source_word: אָכִישׁ
  choice: ஆகீசு
  rationale: எபிரெயப் பெயரின் ஒலியை நெருக்கமாகக் காக்கும் தமிழ் ஒலிபெயர்ப்பு; வேற்றுமை உருபுடன் ‘ஆகீசிடம்’ என வருகிறது.
theological_decisions:
- issue: வன்முறையான செயலை மென்மைப்படுத்தாமலும் மிகைப்படுத்தாமலும் மொழிபெயர்த்தல்
  choice: தாவீது தாக்கியதையும் ஆணோ பெண்ணோ ஒருவரையும் உயிரோடு விடாததையும் நேரடியாகக் கூறுதல்
  alternative: கொலையை மறைக்கும் மென்மையான மொழி அல்லது எபிரெயத்தைவிடக் கடுமையான விரிவாக்கம்
  rationale: வசனம் ஒழுக்கரீதியாகக் கடினமான வரலாற்றுச் செயலை வெளிப்படையாக விவரிக்கிறது. மொழிபெயர்ப்பு அதை மறைக்கவோ பரபரப்பூட்டவோ கூடாது; மூலத்தின் கடுமையை அப்படியே காக்க வேண்டும்.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும் இயல்பான நடை, அதேவேளையில் வேதாகம உரைக்கு ஏற்ற கண்ணியமான தொனி. வன்முறையை மறைக்காமல், மூலத்தில் இல்லாத விவரங்களையும் சேர்க்காமல் வழங்கப்பட்டுள்ளது.
