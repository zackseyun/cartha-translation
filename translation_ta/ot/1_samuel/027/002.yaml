revisions:
- from: தாவீது எழுந்து, தன்னுடன் இருந்த அறுநூறு பேரோடு காத்தின் அரசனான மாகோக்கின் மகன் ஆகீசிடம் எல்லையைக் கடந்து சென்றான்.
  to: தாவீது எழுந்து, அவனும் அவனோடு இருந்த அறுநூறு ஆண்களும் காத்தின் அரசனான மாவோக்கின் மகன் ஆகீசிடம் கடந்து சென்றார்கள்.
  rationale: The revision removes the unsupported reference to a border, explicitly represents David together with his six hundred men, and preserves the masculine reference to the men. It retains the source’s concise movement expression and the patronymic and royal designation of Achish.
  reviewer_model: gpt-5.6-terra
