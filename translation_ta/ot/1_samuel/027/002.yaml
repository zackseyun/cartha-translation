source:
  edition: WLC
  text: וַ/יָּ֣קָם דָּוִ֔ד וַ/יַּעֲבֹ֣ר ה֔וּא וְ/שֵׁשׁ מֵא֥וֹת אִ֖ישׁ אֲשֶׁ֣ר עִמּ֑/וֹ אֶל אָכִ֥ישׁ בֶּן מָע֖וֹךְ מֶ֥לֶךְ גַּֽת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/027/002.yaml
  text: So David arose and crossed over, he and the six hundred men who were with him, to Achish son of Maoch, king of Gath.
translation:
  language: ta
  text: தாவீது எழுந்து, அவனும் அவனோடு இருந்த அறுநூறு ஆண்களும் காத்தின் அரசனான மாவோக்கின் மகன் ஆகீசிடம் கடந்து சென்றார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּקָם
  choice: எழுந்து
  rationale: קום என்ற வினையின் கால் தொடர் வடிவம் தீர்மானமான செயல் தொடங்குவதைச் சுட்டுகிறது; எபிரெயக் கதைநடையின் இயல்பையும் தமிழில் சுருக்கமாகத் தக்கவைக்கிறது.
- source_word: וַיַּעֲבֹר
  choice: எல்லையைக் கடந்து சென்றான்
  rationale: עבר என்பதன் அடிப்படைப் பொருள் ‘கடந்து செல்’. இச்சூழலில் தாவீது இஸ்ரவேலரின் பகுதியிலிருந்து பெலிஸ்தியப் பகுதிக்குச் செல்வதால், தமிழில் தேவையான பொருள் நிறைவுக்காக ‘எல்லை’ வெளிப்படையாகச் சேர்க்கப்பட்டுள்ளது.
- source_word: הוּא וְשֵׁשׁ מֵאוֹת אִישׁ
  choice: தன்னுடன் இருந்த அறுநூறு பேரோடு
  rationale: தாவீதும் அவனோடு இருந்த அறுநூறு ஆண்களும் ஒன்றாகச் சென்றனர் என்பதைக் காலத்திற்கேற்ற இயல்பான தமிழில் தெரிவிக்கிறது; தனித்த சுட்டுப்பெயரின் வலியுறுத்தல் கூட்டுச் சொற்றொடரில் பிரதிபலிக்கிறது.
- source_word: אֲשֶׁר עִמּוֹ
  choice: தன்னுடன் இருந்த
  rationale: உறவுப்பெயரெச்சத் தொடரை நேரடியாகவும் இயல்பாகவும் மொழிபெயர்க்கிறது; ‘உடன் சென்ற’ என்று மாற்றி இயக்கத்தை அதிகமாக விளக்கவில்லை.
- source_word: אֶל אָכִישׁ
  choice: ஆகீசிடம்
  rationale: אֶל ஒரு நபரை நோக்கிய இயக்கத்தைக் குறிக்கிறது; தமிழில் மனித இலக்கிற்கு ‘-இடம்’ இயல்பான இணை.
- source_word: בֶּן מָעוֹךְ
  choice: மாகோக்கின் மகன்
  rationale: எபிரெயத் தந்தைவழி அடையாள அமைப்பை நேரடியாகத் தக்கவைக்கிறது.
- source_word: מֶלֶךְ גַּת
  choice: காத்தின் அரசன்
  rationale: எபிரெயக் கட்டுநிலைத் தொடரை இயல்பான தமிழ் உடைமைத் தொடராக வழங்குகிறது.
