translation_notes:
  register: நவீன தரத் தமிழில் இயல்பான, கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. பாரம்பரிய வேதாகமப் பெயரெழுத்துகளுக்கு அண்மையாக ‘தாவீது’, ‘ஆகீஸ்/ஆகீசு’ மரபைக் கருத்தில் கொண்டு, மூலத்தின் இறுதி மெய்யைத் தெளிவாகக் காட்ட ‘ஆகீசு’ அல்லாது உருபு சேர்க்க ஏதுவான ‘ஆகீஸ்’ வடிவம் பரிசீலிக்கப்பட்டது; இறுதி உரையில் ‘ஆகீசிடம்’ எனப் புணர்க்கப்பட்டுள்ளது. ‘காத்’ என்பதற்குப் புணர்ச்சி காரணமாக ‘காத்தின்’ பயன்படுத்தப்பட்டுள்ளது.
