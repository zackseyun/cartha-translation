  text: When it was reported to Saul that David had fled to Gath[b][a], he no longer continued to seek him.
translation:
  language: ta
  text: தாவீது காத்திற்குத் தப்பியோடினான் என்று சவுலுக்கு அறிவிக்கப்பட்டபோது, அவனைத் தேடுவதை அவன் இனிமேலும் தொடரவில்லை.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֻּגַּד לְשָׁאוּל
  choice: சவுலுக்கு அறிவிக்கப்பட்டபோது
  rationale: எபிரெய வினையின் செயப்பாட்டு வடிவம் செய்தியை அறிவித்தவர் யார் என்று குறிப்பிடவில்லை. தமிழிலும் இயல்பான செயப்பாட்டு அமைப்பைப் பயன்படுத்தி அந்தத் தெளிவின்மையைப் பாதுகாக்கிறது.
- source_word: כִּי בָרַח דָּוִד גַּת
  choice: தாவீது காத்துக்குத் தப்பியோடிவிட்டான் என்று
  rationale: בָרַח என்பது ஆபத்திலிருந்து தப்பியோடுவதைக் குறிக்கிறது; குறிக்கோள் இடமாக வரும் גַּת என்பதற்கு இயல்பான தமிழில் நான்காம் வேற்றுமை உருபு சேர்க்கப்பட்டுள்ளது. முடிந்த செயலைக் குறிக்க ‘விட்டான்’ பயன்படுத்தப்பட்டது.
- source_word: וְלֹא יֹסֶף עוֹד
  choice: இனி தொடரவில்லை
  rationale: יסף + עוד என்ற எபிரெய மரபுத்தொடர் ஒரு செயலை மேலும் செய்யாமை அல்லது தொடராமையைக் குறிக்கிறது. ‘இனி தொடரவில்லை’ என்பது அதன் நிறுத்தப்பொருளையும் ‘தொடர்தல்’ அடுக்கையும் இயல்பான தமிழில் காக்கிறது.
- source_word: לְבַקְשׁוֹ
  choice: அவனைத் தேடுவதை
  rationale: בקש என்பதன் அடிப்படைப் பொருள் ‘தேடு.’ ‘பின்தொடர்ந்து வேட்டையாடு’ போன்ற சூழல்சார் விளக்கத்தைச் சேர்க்காமல் மூலத்தின் பரந்த பொருளைத் தக்கவைக்கிறது.
