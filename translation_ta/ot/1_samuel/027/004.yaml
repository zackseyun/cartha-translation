  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதாகவும் கண்ணியமாகவும் அமைக்கப்பட்டது. சவுலைக் குறிக்கும் இடத்தில் மரியாதை ஒருமை ‘அவர்’ பயன்படுத்தப்பட்டுள்ளது; தகவலை அறிவித்தவர் குறிப்பிடப்படாத மூலத்தின் செயப்பாட்டு அமைப்பு பாதுகாக்கப்பட்டுள்ளது.
