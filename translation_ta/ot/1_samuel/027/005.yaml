translation_notes:
  register: நவீனத் தரத் தமிழில், அரசனிடம் பேசும் பணிவான அரசவைத் தொனியைத் தக்கவைக்க ‘உமது’, ‘உம்மோடு’, ‘அடியான்’ ஆகிய மரியாதை வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன. வாக்கியம் சாதாரண வாசகர்களுக்குப் புரியும் வகையில் இயல்பாக அமைக்கப்பட்டாலும், மூலத்தின் சொல்லாட்சிக் கேள்வியும் குறிப்பிடப்படாத பன்மைச் செய்பவர்களும் தேவையின்றி விளக்கித் தீர்க்கப்படவில்லை.
