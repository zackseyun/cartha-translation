review_pass:
  verdict: revise
  source_fidelity: 'The verse’s core sense is accurately conveyed: David makes a deferential conditional request for a place in a rural town and supports it with a rhetorical question about remaining with Achish in the royal city. The indefinite plural request is acceptably represented by a Tamil passive. However, footnote a inaccurately glosses שָׂדֶה as “வெளி” (outside); in this context it is “field/countryside.”'
  naturalness: The courtly register is appropriate and readable. “நாட்டுப்புற நகரங்கள்” is somewhat more current and neutral than “நாட்டுப்புறப் பட்டணங்கள்,” while retaining the contrast with the royal city.
  terminology: “உமது அடியான்,” “உம்மோடு,” and “அரச நகரம்” appropriately preserve David’s deferential court speech and the source’s royal-city expression. The literal wording in footnote a needs correction.
  issues:
