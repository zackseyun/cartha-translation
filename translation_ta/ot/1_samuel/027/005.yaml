base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/027/005.yaml
  text: Then David said to Achish[a], “If I have now found favor in your eyes, let them give me a place in one of the towns in the countryside, so that I may live there[c][b]. For why should your servant live with you in the royal city?”
translation:
  language: ta
  text: அப்போது தாவீது ஆகீசிடம், “உமது பார்வையில் எனக்குத் தயவு கிடைத்திருந்தால், நாட்டுப்புற நகரங்களில் ஒன்றில் எனக்கு ஓர் இடம் கொடுக்கப்படட்டும்[a]; நான் அங்கே குடியிருப்பேன்[b]. உமது அடியான் உம்மோடு அரச நகரத்தில்[c] ஏன் குடியிருக்க வேண்டும்?” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொல்லர்த்தமாக, “வயல்வெளியின் நகரங்களில் ஒன்றில்”; இது அரச நகரத்துக்கு மாறான நாட்டுப்புற நகரத்தைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “நான் அங்கே வசிப்பேன்.”
    reason: lexical_alternative
  - marker: c
    text: எபிரெயத்தில் சொல்லர்த்தமாக, “அரசாட்சியின் நகரத்தில்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מָצָאתִי חֵן בְּעֵינֶיךָ
  choice: உமது பார்வையில் எனக்குத் தயவு கிடைத்திருந்தால்
  rationale: ஒப்புதலையும் ஆதரவையும் பெறுவதைக் குறிக்கும் எபிரெய மரபுத்தொடரின் ‘உமது பார்வையில்’ என்ற உருவகத்தை இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: נָא
  choice: வேண்டுகோளின் பணிவான தொனியில் உட்பொருளாக்கப்பட்டது
  rationale: இங்கு נָא காலத்தைக் குறிக்கும் ‘இப்போது’ என்பதைக் காட்டிலும் வேண்டுகோளை மென்மையாக்குகிறது; நிபந்தனை வாக்கியமும் தொடரும் வேண்டுகோள் வடிவமும் அந்தப் பணிவை தமிழில் வெளிப்படுத்துகின்றன.
- source_word: יִתְּנוּ לִי
  choice: எனக்கு ஓர் இடம் கொடுக்கப்படட்டும்
  rationale: மூலத்தின் குறிப்பிடப்படாத பன்மைச் செய்பவர்களைத் தமிழில் செயற்கையாக ‘அவர்கள்’ என்று அறிமுகப்படுத்தாமல், பணிவான வேண்டுகோளின் பொருளைத் தக்கவைக்கும் இயல்பான வடிவம்.
- source_word: מָקוֹם
  choice: ஓர் இடம்
  rationale: குறிப்பிட்ட குடியிருப்பையோ சொத்தையோ தேவையின்றி மிகைப்படுத்தாத பொதுவான பொருள்.
- source_word: בְּאַחַת עָרֵי הַשָּׂדֶה
  choice: நாட்டுப்புறத்திலுள்ள பட்டணங்களில் ஒன்றில்
  rationale: சொல்லர்த்தமான ‘வெளியின் பட்டணங்கள்’ என்பதை அரச நகரத்துக்கு மாறான நாட்டுப்புறப் பட்டணங்கள் என்று தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: וְאֵשְׁבָה שָּׁם
  choice: நான் அங்கே குடியிருப்பேன்
  rationale: ישב என்பதன் இச்சூழலுக்குரிய வாழ்தல் அல்லது வசித்தல் என்ற பொருளைத் தெளிவாகத் தருவதோடு, மூலத்தின் இணைப்புவாக்கிய அமைப்பையும் பாதுகாக்கிறது.
- source_word: לָמָּה יֵשֵׁב
  choice: ஏன் குடியிருக்க வேண்டும்?
  rationale: தாவீதின் காரணத்தை வலியுறுத்தும் சொல்லாட்சிக் கேள்வியை இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: עַבְדְּךָ
  choice: உமது அடியான்
  rationale: இது அடிமைநிலையை வலியுறுத்துவதைவிட அரசவையில் பேசப்படும் பணிவான தற்சுட்டு; ‘அடியான்’ அந்த மரியாதைத் தொனியைத் தக்கவைக்கிறது.
- source_word: בְּעִיר הַמַּמְלָכָה
  choice: அரச நகரத்தில்
  rationale: சொல்லர்த்தமான ‘அரசாட்சியின் நகரம்’ என்பதைத் தலைநகரம் என்று தேவையின்றி குறிப்பாக்காமல், அரசனுக்குரிய நகரம் என்ற பொருளில் இயல்பாக வழங்குகிறது.
- source_word: עִמָּךְ
  choice: உம்மோடு
  rationale: தாவீது தவிர்க்க விரும்பும் அரசனுடனான இடநெருக்கத்தையும் தொடர்பையும் நேரடியாகக் காட்டுகிறது.
