base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/027/012.yaml
  text: And Achish trusted David[a], saying, “He has surely made himself stink among his people in Israel[b], so he will be my servant forever.”
translation:
  language: ta
  text: ஆகீஸ் தாவீதை நம்பி, “அவன் தன் மக்களான இஸ்ரவேலரிடையே தன்னை முற்றிலும் அருவருப்புக்குரியவனாக ஆக்கிக்கொண்டான்[a]. ஆகவே, அவன் என்றென்றும் எனக்கு ஊழியனாக இருப்பான்[b]” என்று சொன்னான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மொழியில் நேரடியாக, “தன்னை முற்றிலும் நாற்றமடையச் செய்துகொண்டான்.” இது மற்றவர்களின் பார்வையில் வெறுக்கத்தக்கவனாக அல்லது அருவருப்புக்குரியவனாக ஆகிவிடுவதைக் குறிக்கும் மரபுத்தொடர்.
    reason: lexical_alternative
  - marker: b
    text: “ஊழியன்” என்பதை “அடிமை” என்றும் மொழிபெயர்க்கலாம். இங்கு உடைமையாகக் கருதப்படும் அடிமைநிலையைவிட, ஆகீஸுக்குக் கீழ்ப்பட்டு நிலையாகச் சேவை செய்வதே சூழலில் முன்னிலையாகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּאֲמֵן ... בְּדָוִד
  choice: ஆகீஸ் தாவீதை நம்பி
  rationale: אמן என்பதன் ஹிஃபில் வடிவம் ב முன்னிடைச்சொல்லுடன் ஒருவர்மீது நம்பிக்கை வைப்பதைக் குறிக்கிறது. தமிழில் ‘தாவீதை நம்பி’ என்பது இயல்பான தனிப்பட்ட நம்பிக்கையின் பொருளைத் தருகிறது.
- source_word: לֵאמֹר
  choice: என்று சொன்னான்
  rationale: இது மேற்கோளை அறிமுகப்படுத்தும் வழக்கமான எபிரெயச் சொல்லமைப்பு. சூழலில் உள்ளார்ந்த எண்ணமாகவும் இருக்கக்கூடும்; எனினும் மூலத்தின் வெளிப்படையான ‘சொல்லுதல்’ வடிவம் காக்கப்பட்டது.
- source_word: הַבְאֵשׁ הִבְאִישׁ
  choice: தன்னை முற்றிலும் அருவருப்புக்குரியவனாக்கிக் கொண்டான்
  rationale: வினையெச்ச முழுவடிவமும் வினைமுற்றும் இணைவதால் வலியுறுத்தல் ஏற்படுகிறது. நேரடிப் படிமம் ‘நாற்றமெடுக்கச் செய்தான்’ என்பதாக இருந்தாலும், சமூக வெறுப்புக்குரியவனாதல் என்ற மரபுத்தொடரின் பொருளை இயல்பான தமிழில் முதன்மை உரை தருகிறது; மூலப் படிமம் அடிக்குறிப்பில் காக்கப்படுகிறது.
- source_word: בְּעַמּוֹ בְיִשְׂרָאֵל
  choice: தன் மக்களான இஸ்ரவேலரிடையே
  rationale: இரண்டாவது சொற்றொடர் ‘அவன் மக்கள்’ யார் என்பதை விளக்கும் தேசிய அடையாளமாகப் புரிந்துகொள்ளப்படுகிறது. ‘இடையே’ என்பது அந்தக் குழுவினுள் ஏற்பட்ட வெறுப்பை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וְהָיָה לִי
  choice: ஆகவே, அவன் ... எனக்கு ... இருப்பான்
  rationale: இங்குள்ள וְ அடுத்த நிகழ்வை மட்டும் அல்லாமல் ஆகீஸ் எடுத்த முடிவின் விளைவையும் காட்டுகிறது; ‘ஆகவே’ அந்தத் தொடர்பைத் தெளிவாகத் தருகிறது.
- source_word: לְעֶבֶד
  choice: ஊழியன்
  rationale: עֶבֶד என்பது ஊழியன் அல்லது அடிமை எனப் பொருள்படலாம். இச்சூழலில் ஆகீஸுக்குக் கீழ்ப்பட்ட நீடித்த அரசியல்/படைச் சேவை முன்னிலையாக இருப்பதால் ‘ஊழியன்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: עוֹלָם
  choice: என்றென்றும்
  rationale: நீடித்து முடிவில்லாமல் தொடரும் என ஆகீஸ் எதிர்பார்த்ததைத் தமிழில் இயல்பாகக் காட்டுகிறது.
