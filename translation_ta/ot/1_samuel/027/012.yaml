  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான நடையைப் பயன்படுத்துகிறது. எபிரெய மொழியின் ‘நாற்றம்’ என்ற படிமம் முதன்மை உரையில் சொல்லுக்குச் சொல் தரப்படாமல், அதன் சமூகப் பொருள் வழங்கப்பட்டு அடிக்குறிப்பில் படிமம் பாதுகாக்கப்பட்டுள்ளது. ‘ஊழியன்’ என்பது இச்சூழலின் கீழ்ப்பட்ட சேவையைச் சுட்டுகிறது; ‘அடிமை’ என்ற சாத்தியமும் அடிக்குறிப்பில் திறந்துவைக்கப்பட்டுள்ளது.
