  edition: WLC
  text: וַ/יֹּ֣אמֶר אָכִ֔ישׁ אַל פְּשַׁטְתֶּ֖ם הַ/יּ֑וֹם וַ/יֹּ֣אמֶר דָּוִ֗ד עַל נֶ֤גֶב יְהוּדָה֙ וְ/עַל נֶ֣גֶב הַ/יַּרְחְמְאֵלִ֔י וְ/אֶל נֶ֖גֶב הַ/קֵּינִֽי־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/027/010.yaml
  text: Then Achish said[a], “Where have you made a raid today?” And David said, “Against the Negev of Judah, against the Negev of the Jerahmeelites[b], and against the Negev of the Kenites.”
translation:
  language: ta
  text: அப்போது ஆகீஷ், “இன்று நீங்கள் எங்கே தாக்கிக் கொள்ளையடித்தீர்கள்?”[a] என்று கேட்டான். அதற்குத் தாவீது, “யூதாவின் நெகேவுப் பகுதியின் மீதும், யெரக்மெயேலியரின் நெகேவுப் பகுதியின் மீதும், கேனியரின் நெகேவுப் பகுதியின் மீதும் தாக்கிக் கொள்ளையடித்தோம்”[b] என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய உரையைச் சொற்சொல்லாக வாசித்தால், “இன்று நீங்கள் கொள்ளையடிக்கவில்லையா?” என்பது போன்ற பொருள் கிடைக்கும். ஆனால் இச்சூழலில் அது, “இன்று நீங்கள் எங்கே தாக்கிக் கொள்ளையடித்தீர்கள்?” என்ற கேள்வியாகப் புரிந்துகொள்ளப்படுகிறது.
    reason: textual_variant
  - marker: b
    text: அல்லது, “யூதாவின் தென்பகுதியின் மீதும், யெரக்மெயேலியரின் தென்பகுதியின் மீதும், கேனியரின் தென்பகுதியின் மீதும் தாக்கிக் கொள்ளையடித்தோம்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל פְּשַׁטְתֶּם הַיּוֹם
  choice: இன்று நீங்கள் எங்கே கொள்ளையடிக்கச் சென்றீர்கள்?
  rationale: மசோரா மெய்யெழுத்து உரையில் אַל பொதுவாக ‘வேண்டாம்/இல்லை’ எனப் பொருள்படும்; ஆனால் பண்டைய மொழிபெயர்ப்புகளும் கதைச் சூழலும் ஆகீஸ் தாக்குதல் நடந்த இடத்தைக் கேட்பதைக் காட்டுகின்றன. פשט என்பதன் படையெடுப்பு மற்றும் கொள்ளையிடுதல் சார்ந்த பொருளை இயல்பான தமிழில் இவ்வாறு வழங்குகிறது.
- source_word: נֶגֶב
  choice: நெகேவு
  rationale: இச்சொல் ‘தெற்கு’ அல்லது ‘தென்பகுதி’ என்பதையும், வறண்ட தெற்குப் பிரதேசமான நெகேவையும் குறிக்கலாம். இங்கு அது இனக்குழு மற்றும் நிலப்பெயர்களோடு மீண்டும் வருவதால் புவியியல் பெயராக ஒலிபெயர்க்கப்பட்டது.
- source_word: עַל
  choice: எதிராக
  rationale: தாவீது கூறும் கொள்ளைத் தாக்குதல்களின் இலக்குகளைச் சுட்டுவதால், வெறும் திசையைவிட பகைமைச் செயலை வெளிப்படுத்தும் ‘எதிராக’ பொருத்தமானது.
- source_word: יְהוּדָה
  choice: யூதா
  rationale: கோத்திரம் மற்றும் பிரதேசத்திற்கான வழக்கமான தமிழ்ப் பெயர்.
- source_word: הַיַּרְחְמְאֵלִי
  choice: யெரக்மெயேலியர்
  rationale: யெரக்மெயேலின் வழிவந்த மக்கள் அல்லது குலத்தைக் குறிக்கும் இனப்பெயர் வடிவம்.
- source_word: הַקֵּינִי
  choice: கேனியர்
  rationale: கேனிய மக்களைக் குறிக்கும் இனப்பெயர்; தெளிவான, வழக்கமான தமிழ் வடிவம்.
- source_word: וַיֹּאמֶר
  choice: கேட்டான் / என்றான்
  rationale: எபிரெய மூலத்தில் பொதுவான ‘சொன்னான்’ என்ற வினை இருமுறையும் வருகிறது. இயல்பான தமிழில் உரையாடலின் செயல்பாட்டுக்கேற்ப ஆகீஸுக்கு ‘கேட்டான்’ என்றும் தாவீதுக்கு ‘என்றான்’ என்றும் வழங்கப்பட்டது.
theological_decisions: []
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. ‘நெகேவு’ புவியியல் பெயராக வைக்கப்பட்டு, ‘தென்பகுதி’ என்ற பொருள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது. கேள்வியின் உரைச்சிக்கலும் மறைக்கப்படாமல் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
