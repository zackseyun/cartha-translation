translation_notes:
  register: நவீனத் தரத் தமிழில், கண்ணியமான கதைநடை பயன்படுத்தப்பட்டது. ‘தத்தம் வீட்டார்’ பகிர்நிலை அமைப்பைச் சுருக்கமாகவும் தெளிவாகவும் காட்டுகிறது. எபிரெய வாக்கியத்தின் நீண்ட இணைப்பை தமிழின் வாசிப்புத் தெளிவுக்காக இரண்டு வாக்கியங்களாகப் பிரித்தாலும், தகவல் வரிசையும் உறவுகளும் காக்கப்பட்டுள்ளன.
