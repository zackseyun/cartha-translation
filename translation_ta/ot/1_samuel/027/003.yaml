base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/027/003.yaml
  text: So David stayed with Achish in Gath[a], he and his men, each man with his household—David with his two wives, Ahinoam the Jezreelite and Abigail[b], the wife of Nabal the Carmelite.
translation:
  language: ta
  text: தாவீது காத்தில் ஆகீசுடன் தங்கியிருந்தான்[a]. அவனும் அவனுடைய ஆட்களும் ஒவ்வொருவரும் தத்தம் வீட்டாருடன் இருந்தார்கள்[b]; அதாவது, தாவீதும் அவனுடைய இரு மனைவிகளான யெஸ்ரயேலைச் சேர்ந்த அகினோவாமும், நாபாலின் மனைவியும் கர்மேலைச் சேர்ந்தவளுமான அபிகாயிலும் இருந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘காத்தில் ஆகீசுடன் குடியிருந்தான்’ என்றும் மொழிபெயர்க்கலாம். எபிரெய வினைச்சொல் குடியிருப்பதையோ ஒரு காலம் தங்கியிருப்பதையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: நேரடியாக, ‘ஒவ்வொரு மனிதனும் அவனுடைய வீட்டாரும்.’ இது ஒவ்வொருவரும் தம் வீட்டாரோடு இருந்ததைக் குறிக்கும் பகிர்நிலைச் சொற்றொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּשֶׁב
  choice: தங்கியிருந்தான்
  rationale: ישׁב என்பது உட்காருதல், குடியிருத்தல், தங்கியிருத்தல் ஆகிய பொருள்களைத் தரும். இக்கதைச் சூழலில் நிரந்தரக் குடியேற்றத்தை வலியுறுத்தாமல், ஒரு காலம் அங்கே வசித்ததை இயல்பாகத் தெரிவிக்கிறது.
- source_word: עִם אָכִישׁ בְּגַת
  choice: காத்தில் ஆகீசுடன்
  rationale: עִם உடனிருப்பதையும், בְּ நகருக்குள் அமைந்த இடத்தையும் குறிக்கின்றன; தமிழில் இவ்வரிசை இயல்பாக உள்ளது.
- source_word: הוּא וַאֲנָשָׁיו
  choice: அவனும் அவனுடைய ஆட்களும்
  rationale: אֲנָשָׁיו என்பதன் நேரடிப் பொருள் ‘அவனுடைய ஆட்கள்.’ அவர்கள் ஆயுதமேந்திய பின்தொடர்பவர்கள் என்ற சூழல் இருந்தாலும், மூலத்தின் பொதுவான சொல்லை இது காக்கிறது.
- source_word: אִישׁ וּבֵיתוֹ
  choice: ஒவ்வொருவரும் தத்தம் வீட்டாருடன்
  rationale: אִישׁ இங்கு பகிர்நிலைப் பொருளில் ‘ஒவ்வொருவரும்’ என வருகிறது; בֵּיתוֹ கட்டடத்தை அல்ல, அவரவர் குடும்பம் அல்லது வீட்டாரைக் குறிக்கிறது.
- source_word: וּשְׁתֵּי נָשָׁיו
  choice: அவனுடைய இரு மனைவிகளான
  rationale: இந்தச் சொற்றொடர் தாவீதின் வீட்டாரைத் தனிப்படக் குறிப்பிடுகிறது; பெயர்களோடு இயல்பாக இணைக்க ‘இரு மனைவிகளான’ என்று வழங்கப்பட்டது.
- source_word: הַיִּזְרְעֵאלִית
  choice: யெஸ்ரயேலைச் சேர்ந்த
  rationale: பெண்பால் குடிப்பெயர் அகினோவாமின் ஊர்ச் சார்பைக் குறிக்கிறது. தமிழில் இயல்பாகவும் தெளிவாகவும் இருக்க ‘சேர்ந்த’ என மொழிபெயர்க்கப்பட்டது.
- source_word: אֵשֶׁת נָבָל הַכַּרְמְלִית
  choice: கர்மேலைச் சேர்ந்த நாபாலின் மனைவி
  rationale: எபிரெயத்தில் ‘நாபாலின் மனைவி, கர்மேலைச் சேர்ந்தவள்’ என்ற அமைப்பு உள்ளது. தமிழில் தொடர்புகள் தெளிவாக இருக்க இடப்பெயர் அடையாளம் முன்வைக்கப்பட்டது; அது அபிகாயிலைக் குறிக்கிறது.
