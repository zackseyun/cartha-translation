  text: וַ/יֹּ֣אמֶר שְׁמוּאֵ֗ל אֶל כָּל בֵּ֣ית יִשְׂרָאֵל֮ לֵ/אמֹר֒ אִם בְּ/כָל לְבַבְ/כֶ֗ם אַתֶּ֤ם שָׁבִים֙ אֶל יְהוָ֔ה הָסִ֜ירוּ אֶת אֱלֹהֵ֧י הַ/נֵּכָ֛ר מִ/תּוֹכְ/כֶ֖ם וְ/הָ/עַשְׁתָּר֑וֹת וְ/הָכִ֨ינוּ לְבַבְ/כֶ֤ם אֶל יְהוָה֙ וְ/עִבְדֻ֣/הוּ לְ/בַדּ֔/וֹ וְ/יַצֵּ֥ל אֶתְ/כֶ֖ם מִ/יַּ֥ד פְּלִשְׁתִּֽים־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/007/003.yaml
  text: Then Samuel said to all the house of Israel[a], “If you are returning to Yahweh with all your heart, remove the foreign gods and the Ashtaroths from among you, and direct your heart to Yahweh and serve him alone[d][c][b], and he will deliver you from the hand of the Philistines.”
translation:
  language: ta
  text: அப்போது சாமுவேல் இஸ்ரயேல் குடும்பத்தினர் அனைவரிடமும், “நீங்கள் முழு இதயத்தோடும் யாவேவிடம் திரும்பிவருகிறீர்கள்[a] என்றால், உங்கள் நடுவிலிருந்து அந்நிய தெய்வங்களையும் அஸ்தரோத்துகளையும்[b] அகற்றுங்கள். உங்கள் இதயத்தை யாவேவை நோக்கி உறுதிப்படுத்துங்கள்[c]; அவருக்கு மட்டுமே சேவை செய்யுங்கள். அப்போது அவர் உங்களைப் பெலிஸ்தியர்களின் கையிலிருந்து[d] விடுவிப்பார்” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “யாவேவிடம் முழு இதயத்தோடும் திரும்பி வருகிறீர்கள்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “அஸ்தரோத்துகள்” என்பது அஸ்தரோத் அல்லது அஸ்தார்த்தே என அறியப்பட்ட பெண் தெய்வத்துடன் தொடர்புடைய உருவங்கள், உள்ளூர் வெளிப்பாடுகள் அல்லது வழிபாட்டு வடிவங்களைக் குறித்திருக்கலாம்.
    reason: cultural_note
  - marker: c
    text: “உங்கள் இதயத்தை யாவேவுக்காக ஆயத்தப்படுத்துங்கள்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: d
    text: “பெலிஸ்தியர்களின் கையிலிருந்து” என்பது அவர்களுடைய அதிகாரம் அல்லது பிடியிலிருந்து விடுவிப்பதைக் குறிக்கும் எபிரெய மரபுத்தொடர்.
    reason: idiom_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: அப்போது சாமுவேல் ... என்றார்
  rationale: தொடர்கதை வரிசையைக் காட்டும் waw-consecutive-ஐ இயல்பான நவீனத் தமிழில் “அப்போது” என வெளிப்படுத்துகிறது.
- source_word: כָּל בֵּית יִשְׂרָאֵל
  choice: இஸ்ரயேல் குடும்பத்தார் அனைவரும்
  rationale: “இஸ்ரயேலின் முழு வீடு” என்ற எபிரெயக் கூட்டுக்குடும்ப உருவகத்தைச் சொற்சொல்லாகக் கடினப்படுத்தாமல், உடன்படிக்கைச் சமூகத்தின் கூட்டுத்தன்மையைத் தக்கவைக்கிறது.
- source_word: אִם בְּכָל לְבַבְכֶם אַתֶּם שָׁבִים אֶל יְהוָה
  choice: நீங்கள் உங்கள் முழு இதயத்தோடும் யாவேவிடம் திரும்புகிறீர்கள் என்றால்
  rationale: பங்கேற்புவினை வடிவின் தொடர்நிலை உணர்வையும், முழுமனதான உடன்படிக்கை விசுவாசத்திற்குத் திரும்பும் பொருளையும் பாதுகாக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: திருநாமமாகிய நான்கெழுத்துப் பெயரைப் பொதுப்பட்டமான “ஆண்டவர்” என்று மாற்றாமல் பெயராக ஒலிபெயர்க்கிறது.
- source_word: הָסִירוּ אֶת אֱלֹהֵי הַנֵּכָר מִתּוֹכְכֶם
  choice: உங்கள் நடுவிலிருந்து அந்நிய தெய்வங்களை ... அகற்றிவிட்டு
  rationale: சமூகத்தின் மத்தியிலிருந்து அவற்றை நீக்க வேண்டும் என்ற கட்டளையைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: וְהָעַשְׁתָּרֹת
  choice: அஸ்தரோத்துகள்
  rationale: எபிரெயில் உள்ள பன்மை வடிவை விளக்கவுரையாக ஒருமைப்படுத்தாமல் ஒலிபெயர்த்து, அதன் துல்லியமான பண்பாட்டு குறிப்பு குறித்து அடிக்குறிப்பில் விளக்குகிறது.
- source_word: וְהָכִינוּ לְבַבְכֶם אֶל יְהוָה
  choice: உங்கள் இதயத்தை யாவேவிடம் நிலைநிறுத்தி
  rationale: כּוּן என்பதன் ‘உறுதியாக அமைத்தல்/ஒருமுகப்படுத்தல்’ என்ற பரப்பைத் தக்கவைத்து, யாவேவை நோக்கிய உறுதியான உள்ளார்ந்த திருப்பத்தை இயல்பான தமிழில் கூறுகிறது.
- source_word: וְעִבְדֻהוּ לְבַדּוֹ
  choice: அவர் ஒருவருக்கே பணிசெய்யுங்கள்
  rationale: עבד என்பதிலுள்ள வழிபாடு, கீழ்ப்படிதல், விசுவாசமான சேவை ஆகிய விரிந்த பொருளை “வழிபடுங்கள்” என்று மட்டும் குறுக்காமல் பாதுகாக்கிறது.
- source_word: וְיַצֵּל אֶתְכֶם
  choice: அப்போது அவர் உங்களை ... விடுவிப்பார்
  rationale: கட்டளைகளுக்குப் பின்வரும் எதிர்பார்க்கப்பட்ட விளைவைக் குறிக்கும் இணைப்பை இயல்பான தமிழில் “அப்போது” என்றும், נצל என்பதைக் “விடுவிப்பார்” என்றும் வழங்குகிறது.
- source_word: מִיַּד פְּלִשְׁתִּים
  choice: பெலிஸ்தியர்களின் கையிலிருந்து
  rationale: அவர்களுடைய அதிகாரம் அல்லது பிடியிலிருந்து விடுதலை என்பதைக் குறிக்கும் எபிரெய உருவகத்தைத் தக்கவைக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற திருநாமத்தின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூலத்தில் நேரடியாக வரும் உடன்படிக்கைத் திருநாமத்தை ஒரு பட்டமாக மாற்றாமல், தமிழில் தெளிவான பெயராக வழங்குகிறது.
- issue: שָׁבִים குறிக்கும் இஸ்ரயேலின் செயல்
  choice: திரும்புகிறீர்கள்
  alternative: மனந்திரும்புகிறீர்கள்
  rationale: “திரும்புதல்/திரும்பி வருதல்” என்ற மூல உருவகத்தையும் உடன்படிக்கை விசுவாசத்திற்கான மீள்திருப்பத்தையும் காக்கிறது; பின்னாளைய தொழில்நுட்ப இறையியல் சொல்லைத் திணிக்கவில்லை.
- issue: עבד என்பதன் சூழல்சார் பொருள்
  choice: பணிசெய்யுங்கள்
  alternative: வழிபடுங்கள்
  rationale: இங்கு வேண்டப்படுவது வழிபாடு மட்டும் அல்லாமல் யாவேவுக்கான தனிப்பட்ட விசுவாசம் மற்றும் கீழ்ப்படிதலையும் உள்ளடக்குவதால் விரிந்த பொருளுடைய சொல்லைத் தேர்ந்தெடுக்கிறது.
- issue: וְיַצֵּל என்பதன் தொடர்பு
  choice: அப்போது அவர் ... விடுவிப்பார்
  alternative: அவர் ... விடுவிக்கும்படியாக
  rationale: கட்டளைகளின் விளைவாக வரும் உறுதியான வாக்குறுதியை வாசிக்க இடமளிக்கிறது; நோக்கம் அல்லது விளைவு என்ற இலக்கண நுணுக்கத்தை மிகைப்படுத்தவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில் மரியாதையும் வாசிப்புத் தெளிவும் கொண்ட நடை. “இஸ்ரயேல் குடும்பத்தார்” என்பது மூலத்தின் கூட்டுக்குடும்பச் சாயலை இயல்பாகத் தக்கவைக்கிறது. கட்டளைகளின் தொடரைத் தமிழில் சரளமாக்க “அகற்றிவிட்டு ... நிலைநிறுத்தி ... பணிசெய்யுங்கள்” என்ற அமைப்பு பயன்படுத்தப்பட்டுள்ளது; மூலத்தின் இறையியல் பதற்றங்களும் சொற்பொருள் மாற்றுகளும் அடிக்குறிப்புகளில் பாதுகாக்கப்பட்டுள்ளன.
