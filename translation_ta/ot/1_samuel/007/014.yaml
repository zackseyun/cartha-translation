source:
  edition: WLC
  text: וַ/תָּשֹׁ֣בְנָה הֶ/עָרִ֡ים אֲשֶׁ֣ר לָֽקְחוּ פְלִשְׁתִּים֩ מֵ/אֵ֨ת יִשְׂרָאֵ֤ל לְ/יִשְׂרָאֵל֙ מֵ/עֶקְר֣וֹן וְ/עַד גַּ֔ת וְ/אֶ֨ת גְּבוּלָ֔/ן הִצִּ֥יל יִשְׂרָאֵ֖ל מִ/יַּ֣ד פְּלִשְׁתִּ֑ים וַ/יְהִ֣י שָׁל֔וֹם בֵּ֥ין יִשְׂרָאֵ֖ל וּ/בֵ֥ין הָ/אֱמֹרִֽי־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/007/014.yaml
  text: And the cities that the Philistines had taken from Israel were restored to Israel[a], from Ekron to Gath; and Israel delivered its territory from the hand of the Philistines. And there was peace between Israel and the Amorites.
translation:
  language: ta
  text: பெலிஸ்தியர்கள் இஸ்ரவேலிடமிருந்து கைப்பற்றியிருந்த பட்டணங்கள், எக்ரோன் முதல் காத் வரை, இஸ்ரவேலுக்குத் திரும்பக் கிடைத்தன; அவற்றின் நிலப்பகுதியையும் இஸ்ரவேல் பெலிஸ்தியர்களின் கையிலிருந்து மீட்டது. இஸ்ரவேலுக்கும் அமோரியருக்கும்[a] இடையே சமாதானம் நிலவியது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இங்கு ‘அமோரியர்’ என்பது அந்த நாட்டின் மக்களைக் குறிக்கும் பரந்த பெயராகப் புரிந்துகொள்ளப்பட்டால், ‘கானானியர்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: וַתָּשֹׁבְנָה
  choice: திரும்பக் கிடைத்தன
  rationale: பட்டணங்களே வினையின் எழுவாய். அவை மீண்டும் இஸ்ரவேலின் உடைமையாக வந்ததைக் காட்டும் இயல்பான தமிழாக்கம்; செயப்படுபொருள் அமைப்பைத் திணிக்காமல் எபிரெய அர்த்தத்தைப் பாதுகாக்கிறது.
- source_word: הֶעָרִים
  choice: பட்டணங்கள்
  rationale: அரசியல் மற்றும் நிலப்பரப்பு சார்ந்த சூழலில் ערים என்பதற்குப் பொருத்தமான, பொதுவாகப் புரியும் சொல்.
- source_word: לָקְחוּ
  choice: கைப்பற்றியிருந்த
  rationale: பட்டணங்கள் திரும்பக் கிடைப்பதற்கு முன்பே நடந்த செயலைக் காட்டுவதால் இறந்தகால முன்னிலைத் தொடர்பு தமிழில் வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: מֵאֵת יִשְׂרָאֵל ... לְיִשְׂרָאֵל
  choice: இஸ்ரவேலிடமிருந்து ... இஸ்ரவேலுக்கு
  rationale: எபிரெய மூலத்தின் தேசிய-நிலப்பரப்பு உணர்வையும் வலியுறுத்தும் மறுபயன்பாட்டையும் தக்கவைக்கிறது.
- source_word: מֵעֶקְרוֹן וְעַד גַּת
  choice: எக்ரோன் முதல் காத் வரை
  rationale: மீட்கப்பட்ட பட்டணங்களின் புவியியல் எல்லையை நேரடியாகவும் இயல்பாகவும் காட்டுகிறது.
- source_word: וְאֶת גְּבוּלָן
  choice: அவற்றின் நிலப்பகுதியையும்
  rationale: பெண்பால் பன்மை பின்னொட்டு பட்டணங்களைக் குறிக்கிறது. גבול இங்கு வெறும் எல்லைக்கோட்டை அல்ல, அவற்றைச் சேர்ந்த நிலப்பரப்பையும் குறிக்கிறது.
- source_word: הִצִּיל
  choice: மீட்டது
  rationale: நצל என்பதன் ஹிஃபீல் வடிவம் பகைவரின் கட்டுப்பாட்டிலிருந்து விடுவித்தல் அல்லது மீட்டல் என்ற பொருளைக் கொண்டது; நிலப்பரப்புச் சூழலில் ‘மீட்டது’ இயல்பானது.
- source_word: מִיַּד פְּלִשְׁתִּים
  choice: பெலிஸ்தியர்களின் கையிலிருந்து
  rationale: பகைமையான அதிகாரத்தையும் கட்டுப்பாட்டையும் குறிக்கும் எபிரெய உருவகத்தைத் தமிழிலும் புரியத்தக்க வகையில் தக்கவைக்கிறது.
- source_word: וַיְהִי שָׁלוֹם
  choice: சமாதானம் நிலவியது
  rationale: போர் இல்லாத நிலையையும் நிலையான நல்லுறவையும் சுருக்கமாகவும் கண்ணியமான நடையிலும் வெளிப்படுத்துகிறது.
- source_word: הָאֱמֹרִי
  choice: அமோரியர்
  rationale: எபிரெயில் குறிப்பாக உள்ள இனப்பெயரையே முதன்மை உரையில் பாதுகாக்கிறது; ஒருமை வடிவம் கூட்டுப்பொருளில் வருவதால் தமிழில் இயல்பான பன்மை பயன்படுத்தப்பட்டுள்ளது.
theological_decisions:
- issue: வசனத்தின் முடிவிலுள்ள הָאֱמֹרִי என்ற இனப்பெயர்
  choice: அமோரியர்
  alternative: கானானியர்
  rationale: மூல எபிரெய உரை குறிப்பாக ‘அமோரியர்’ என்று கூறுவதால் அதுவே முதன்மை உரையில் வைக்கப்பட்டுள்ளது. இதை நாட்டின் மக்களுக்கான பரந்த பெயராகக் கருதும் வாய்ப்பு அடிக்குறிப்பில் மட்டும் தரப்பட்டு, வரலாற்று விளக்கத் தெளிவின்மை தீர்த்துவைக்கப்படவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான வேதாகம நடையைப் பயன்படுத்துகிறது. எபிரெய வாக்கியத்தின் தொடர்ச்சியைப் பேணியபடியே நீண்ட முதல் கூற்றைத் தெளிவாக அமைத்துள்ளது; ‘அவற்றின்’ என்பது பட்டணங்களையே சுட்டுகிறது.
