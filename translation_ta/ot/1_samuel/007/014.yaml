  source_fidelity: மூல எபிரெயத்தின் வாக்கிய அமைப்பும் பொருளும் துல்லியமாகப் பாதுகாக்கப்பட்டுள்ளன. பெலிஸ்தியர் கைப்பற்றிய நகரங்கள் இஸ்ரவேலுக்குத் திரும்பக் கிடைத்தன என்பதும், அந்த நகரங்களின் நிலப்பகுதியை இஸ்ரவேல் பெலிஸ்தியரின் அதிகாரத்திலிருந்து மீட்டது என்பதும் சரியாக வெளிப்படுகின்றன. ‘அவற்றின்’ என்பது גְּבוּלָן என்பதிலுள்ள பன்மைப் பின்னொட்டுக்கு ஏற்றவாறு நகரங்களையே சுட்டுகிறது.
