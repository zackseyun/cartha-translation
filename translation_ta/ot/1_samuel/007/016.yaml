  text: וְ/הָלַ֗ךְ מִ/דֵּ֤י שָׁנָה֙ בְּ/שָׁנָ֔ה וְ/סָבַב֙ בֵּֽית אֵ֔ל וְ/הַ/גִּלְגָּ֖ל וְ/הַ/מִּצְפָּ֑ה וְ/שָׁפַט֙ אֶת יִשְׂרָאֵ֔ל אֵ֥ת כָּל הַ/מְּקוֹמ֖וֹת הָ/אֵֽלֶּה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/007/016.yaml
  text: And he would go year by year and make the circuit of Bethel[a], Gilgal, and Mizpah[b], and he judged Israel in all these places.
translation:
  language: ta
  text: அவர் ஆண்டுதோறும் பெத்தேல், கில்கால், மிஸ்பா ஆகிய இடங்களைச் சுற்றிவந்து, இவ்விடங்களிலெல்லாம் இஸ்ரவேலுக்கு நீதி வழங்கினார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהָלַךְ
  choice: சென்று வந்தார்
  rationale: தொடர்ந்து வரும் ஆண்டுதோறும் என்ற காலக் குறிப்புடன், இது ஒருமுறை நடந்த செயலை அல்லாமல் சாமுவேலின் வழக்கமான கடந்தகாலச் செயலைக் குறிக்கிறது; தமிழில் தொடர்ச்சிப் பொருள் இயல்பாக வெளிப்படுகிறது.
- source_word: מִדֵּי שָׁנָה בְּשָׁנָה
  choice: ஆண்டுதோறும்
  rationale: ஒவ்வோர் ஆண்டும் தவறாமல் நிகழ்ந்த வழக்கத்தைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: וְסָבַב
  choice: சுற்றுப்பயணம் செய்து
  rationale: குறிப்பிட்ட நகரங்களை ஒழுங்காகச் சுற்றிவந்த நிலையான பயணப்பாதையைச் சுட்டுகிறது; வெறுமனே ‘சுற்றி’ என்பதைக் காட்டிலும் இச்சூழலில் தெளிவானது.
- source_word: בֵּית אֵל
  choice: பெத்தேல்
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் பரவலாக அறியப்படும் இடப்பெயர் வடிவம்.
- source_word: הַגִּלְגָּל
  choice: கில்கால்
  rationale: எபிரெய இடப்பெயரின் வழக்கமான தமிழ் ஒலிபெயர்ப்பு.
- source_word: הַמִּצְפָּה
  choice: மிஸ்பா
  rationale: எபிரெய இடப்பெயரின் வழக்கமான தமிழ் ஒலிபெயர்ப்பு.
- source_word: וְשָׁפַט
  choice: நீதி வழங்கிவந்தார்
  rationale: இங்கு שׁפט என்பது நீதித்துறை சார்ந்த தலைமைச் செயல்பாட்டைக் குறிக்கிறது. ‘நியாயந்தீர்த்தார்’ என்பதைவிட நவீனத் தமிழில் இயல்பாகவும், தொடர்ச்சியான செயலாகவும் இதை வெளிப்படுத்துகிறது; ஆட்சிசெய்தார் எனப் பொருளை மிகுதியாக விரிவாக்கவில்லை.
- source_word: אֶת יִשְׂרָאֵל
  choice: இஸ்ரவேலுக்கு
  rationale: நீதி வழங்குதல் என்ற தமிழ் வினைத்தொடருடன் இயல்பாக அமையும் வேற்றுமை வடிவம்; இஸ்ரவேல் மக்கள் சமூகத்தைக் குறிக்கிறது.
- source_word: אֵת כָּל הַמְּקוֹמוֹת הָאֵלֶּה
  choice: இந்த இடங்களிலெல்லாம்
  rationale: மசோரெட்டிக் உரையில் אֵת இருந்தாலும், இச்சொற்றொடர் அவர் நீதி வழங்கிய இடங்களைக் குறிக்கும் வினையடைப் பயன்பாடாகப் புரிந்துகொள்ளப்படுகிறது.
