base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/007/010.yaml
  text: And as Samuel was offering up the burnt offering[a], the Philistines drew near for battle against Israel. But Yahweh thundered with a great sound on that day against the Philistines and threw them into confusion, and they were defeated before Israel.
translation:
  language: ta
  text: சாமுவேல் தகனபலியைச் செலுத்திக்கொண்டிருந்தபோது, பெலிஸ்தியர்கள் இஸ்ரவேலுக்கு எதிராகப் போரிட நெருங்கிவந்தார்கள். ஆனால் அன்று யாவே பெலிஸ்தியர்களுக்கு எதிராகப் பேரொலியுடன்[a] இடிமுழங்கி, அவர்களைக் குழப்பமடையச் செய்தார்; அவர்கள் இஸ்ரவேலின் முன்பாகத் தோற்கடிக்கப்பட்டார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “வல்ல இடிமுழக்கத்துடன்” அல்லது “பெரும் இரைச்சலுடன்.” இபிரெயத்தில் சொல்லுக்குச் சொல், “பெரிய ஒலியுடன்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מַעֲלֶה הָעוֹלָה
  choice: தகனபலியைச் செலுத்திக்கொண்டிருந்தபோது
  rationale: இபிரெயப் பங்கேற்புவினை நடந்து கொண்டிருந்த பலிச் செயலைக் குறிக்கிறது; עֹלָה என்பதற்கு வழக்கமான பலியியல் பதமாக ‘தகனபலி’ பயன்படுத்தப்பட்டது.
- source_word: נִגְּשׁוּ לַמִּלְחָמָה בְּיִשְׂרָאֵל
  choice: இஸ்ரவேலுக்கு எதிராகப் போரிட நெருங்கிவந்தார்கள்
  rationale: இராணுவச் சூழலில் அணுகி வருவதையும், בְּ இங்கு பகைமை உறவைக் குறிப்பதையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: וַיַּרְעֵם
  choice: இடிமுழங்கி
  rationale: רעם என்பதன் நேரடியான சூழல்சார் பொருள் இடிமுழங்குதல்; இறைவனை எழுவாயாகக் கொண்ட வினைத் தாக்கத்தையும் காக்கிறது.
- source_word: בְּקוֹל גָּדוֹל
  choice: பேரொலியுடன்
  rationale: קוֹל என்பதன் ‘ஒலி/குரல்’ என்ற பொருள் அகலத்தை ‘ஒலி’ காக்கிறது; இடி என்று மீண்டும் மிகையாகக் குறிப்பதைத் தவிர்க்கிறது.
- source_word: וַיְהֻמֵּם
  choice: அவர்களைக் குழப்பமடையச் செய்தார்
  rationale: போரில் குழப்பம் அல்லது திகில் ஏற்படுத்தும் காரணவினைப் பொருளை வெளிப்படுத்துகிறது; அடுத்த தோல்விக் கூற்றுடன் ஒன்றாக்கப்படவில்லை.
- source_word: וַיִּנָּגְפוּ לִפְנֵי יִשְׂרָאֵל
  choice: அவர்கள் இஸ்ரவேலுக்கு முன்பாகத் தோற்கடிக்கப்பட்டார்கள்
  rationale: நிபால் வடிவத்தின் செயப்பாட்டு இராணுவப் பொருளையும் לִפְנֵי என்ற ‘முன்பாக’ என்னும் மொழிவடிவத்தையும் காக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: நான்கெழுத்துத் தெய்வீகப் பெயரை ஒரு பட்டப்பெயரால் மாற்றாமல், தமிழில் பரவலாகப் புரியக்கூடிய ஒலிபெயர்ப்பாக வழங்குகிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலத்தில் தனிப்பட்ட தெய்வீகப் பெயர் நேரடியாக இருப்பதால் அதை பட்டப்பெயராக மாற்றாமல் ஒலிபெயர்க்கிறது; ‘யெகோவா’வைக் காட்டிலும் ‘யாவே’ மூல உச்சரிப்புக்கான கல்வியியல் மறுகட்டமைப்புக்கு நெருக்கமானது.
- issue: தெய்வீக இடிமுழக்கத்தின் சொற்றொடர்
  choice: பேரொலியுடன் இடிமுழங்கி
  alternative: வல்ல இடிமுழக்கத்துடன் இடிமுழங்கி; உரத்த குரலில் முழங்கி
  rationale: மூலத்தின் ‘பெரிய ஒலியுடன் இடிமுழங்கினார்’ என்ற கட்டமைப்பையும் அதன் ஓரளவு திறந்த பொருளையும் காக்கிறது; அதை தெய்வீகப் பேச்சாகவோ வெறும் இயற்கை நிகழ்வாகவோ தீர்மானிக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையும் வாசிப்புத் தெளிவும் கொண்ட நடை. ‘தகனபலி’, ‘இடிமுழங்கி’ போன்ற வேதாகமச் சூழலுக்கு ஏற்ற சொற்கள் பயன்படுத்தப்பட்டுள்ளன; தேவையற்ற பழமையான வினைமுற்றுகள் தவிர்க்கப்பட்டுள்ளன.
