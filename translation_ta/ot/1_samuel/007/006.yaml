base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/007/006.yaml
  text: So they gathered at Mizpah[a], drew water, and poured it out before Yahweh. They fasted on that day and said there[c][b], “We have sinned against Yahweh.” And Samuel judged the sons of Israel at Mizpah.
translation:
  language: ta
  text: அவர்கள் மிஸ்பாவுக்குக் கூடிவந்தார்கள்[a]. தண்ணீரை மொண்டு, அதை யாவேக்கு முன்பாக ஊற்றினார்கள்[b]. அன்று அவர்கள் நோன்பிருந்தார்கள்; “நாங்கள் யாவேக்கு எதிராகப் பாவம் செய்தோம்” என்று அங்கே சொன்னார்கள். சாமுவேல் மிஸ்பாவில் இஸ்ரயேல் மக்களை[c] நியாயந்தீர்த்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: முதல் இடத்தில் வரும் எபிரெய வடிவில் திசையைக் குறிக்கும் முடிவு உள்ளது; எனவே இதை “மிஸ்பாவுக்கு” என்று மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: யாவேக்கு முன்பாகத் தண்ணீர் ஊற்றியது மனந்திரும்புதல் அல்லது புலம்பலுடன் தொடர்புடைய ஒரு சடங்குச் செயலாக இருக்கலாம்; ஆனால் அதன் குறியீட்டுப் பொருளை உரை வெளிப்படையாக விளக்கவில்லை.
    reason: cultural_note
  - marker: c
    text: எபிரெயத்தில் சொல்லுக்குச் சொல், “இஸ்ரயேலின் மகன்கள்.” இங்கு அது இஸ்ரயேல் மக்களை ஒட்டுமொத்தமாகக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקָּבְצוּ הַמִּצְפָּתָה
  choice: மிஸ்பாவுக்குக் கூடிவந்தார்கள்
  rationale: נפעל வடிவம் மக்கள் ஒன்றுகூடியதைக் குறிக்கிறது; இடப்பெயருடன் சேர்ந்துள்ள திசைச்சுட்டும் முடிவை ‘மிஸ்பாவுக்கு’ என்பதால் வெளிப்படுத்துகிறது.
- source_word: וַיִּשְׁאֲבוּ מַיִם
  choice: தண்ணீர் மொண்டு
  rationale: שׁאב என்பது கிணறு அல்லது நீர்நிலையிலிருந்து தண்ணீர் எடுப்பதைக் குறிக்கிறது; ‘மொண்டு’ என்பது இயல்பான, சுருக்கமான தமிழ்.
- source_word: וַיִּשְׁפְּכוּ לִפְנֵי יְהוָה
  choice: அதை யாவேக்கு முன்பாக ஊற்றினார்கள்
  rationale: முந்திய ‘தண்ணீர்’ என்பதைக் குறிக்க ‘அதை’ சேர்க்கப்பட்டுள்ளது; לִפְנֵי என்பதன் ‘முன்பாக/முன்னிலையில்’ என்ற பொருள் காக்கப்படுகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைப்பெயரான நான்கெழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் அறியத்தக்க ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: וַיָּצוּמוּ
  choice: உண்ணாநோன்பிருந்து
  rationale: צום குறிக்கும் நோன்பிருத்தலைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: חָטָאנוּ לַיהוָה
  choice: நாங்கள் யாவேக்கு எதிராகப் பாவம் செய்தோம்
  rationale: חטא + ל இங்கு ஒருவருக்கு எதிராகப் பாவம் செய்வதைக் குறிக்கிறது; ஒப்புக்கொள்ளப்பட்ட குற்றத்தை நேரடியாக வெளிப்படுத்துகிறது.
- source_word: וַיִּשְׁפֹּט
  choice: நியாயந்தீர்த்தார்
  rationale: שׁפט என்பதன் நீதிவழங்குதல் மற்றும் நீதித்தலைவராகச் செயல்படுதல் ஆகிய பரப்பைத் தக்கவைக்கிறது; அதை வெறும் ஆட்சி அல்லது நீதிமன்றத் தீர்ப்பு எனக் குறுக்கவில்லை.
- source_word: אֶת־בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரயேல் மக்களை
  rationale: சொல்லுக்குச் சொல் ‘இஸ்ரயேலின் மகன்கள்’ என்றாலும், இங்கு முழு இஸ்ரயேல் சமூகத்தையும் குறிக்கிறது; ‘மக்கள்’ என்பது இயல்பான உள்ளடக்கிய தமிழ்.
theological_decisions:
- issue: தண்ணீர் ஊற்றிய சடங்கின் பொருள்
  choice: செயலை மட்டும் நேரடியாக மொழிபெயர்த்து, அதன் குறியீட்டுப் பொருளை முதன்மை உரையில் நிர்ணயிக்காமல் விடுதல்
  alternative: மனந்திரும்புதலின் அடையாளம், புலம்பலின் வெளிப்பாடு, அல்லது தம்மை முழுமையாக அர்ப்பணித்தல் என்று விளக்குதல்
  rationale: எபிரெய உரை செயலைப் பதிவு செய்கிறது; ஆனால் அதன் குறியீட்டுப் பொருளை விளக்கவில்லை. எனவே உண்மையான தெளிவின்மை பாதுகாக்கப்படுகிறது.
- issue: יְהוָה என்ற இறைப்பெயர்
  choice: யாவே
  alternative: கர்த்தர் அல்லது யெகோவா
  rationale: மூலத்தில் உள்ள தனிப்பட்ட இறைப்பெயரைப் பட்டத்தால் மாற்றாமல் ஒலிபெயர்த்து வழங்குகிறது.
- issue: சாமுவேலின் שׁפט செயல்
  choice: நியாயந்தீர்த்தார்
  alternative: ஆட்சி செய்தார் அல்லது நீதியை நிர்வகித்தார்
  rationale: சாமுவேலின் நீதித்தலைவர் பணியைக் காக்கும் அதேவேளையில், உரை கூறாத நிர்வாக விவரங்களைச் சேர்க்கவில்லை.
translation_notes:
  register: நவீன பொதுத்தமிழில், ஆனால் வேதாகம உரைக்கு ஏற்ற கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. ‘கூடிவந்தார்கள்’, ‘தண்ணீர் மொண்டு’ போன்ற இயல்பான சொற்றொடர்கள் பயன்படுத்தப்பட்டுள்ளன; இறைப்பெயர் ‘யாவே’ என ஒலிபெயர்க்கப்பட்டுள்ளது. சடங்கின் விளக்கம் உரைக்குள் சேர்க்கப்படாமல் அடிக்குறிப்பில் மட்டும் சுட்டப்பட்டுள்ளது.
