base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/007/017.yaml
  text: Then he would return to Ramah[a], for his house was there, and there he judged Israel. He built there an altar to Yahweh.
translation:
  language: ta
  text: பின்பு அவர் ராமாவுக்குத் திரும்பி வருவார்[a]; ஏனெனில் அங்கே அவருடைய வீடு இருந்தது. அங்கே அவர் இஸ்ரவேலை நியாயந்தீர்த்தார். அங்கே அவர் யாவேக்கு ஒரு பலிபீடத்தைக் கட்டினார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொற்சொல்லாக, “அவருடைய திரும்புதல் ராமாவுக்கு இருந்தது.”
    reason: וּתְשֻׁבָתוֹ என்பது வினைச்சொல் அல்ல, ‘அவருடைய திரும்புதல்’ என்ற பெயர்ச்சொல் அமைப்பு என்பதைத் தெரிவிக்கும் சொற்சொல் மாற்று.
lexical_decisions:
- source_word: וּתְשֻׁבָתוֹ
  choice: பின்பு அவர் ... திரும்பிவருவார்
  rationale: எபிரெயச் சொற்றொடரின் நேரடிப் பொருள் ‘அவருடைய திரும்புதல்’. முந்தைய வசனத்தில் கூறப்பட்ட வழக்கமான சுற்றுப்பயணத்தின் பின்னணியில், தொடர்ச்சியாக நிகழ்ந்த செயலை இயல்பான தமிழில் இவ்வாறு வினைச்சொல்லாக்குவது பொருத்தமானது.
- source_word: הָרָמָתָה
  choice: ராமாவுக்கு
  rationale: இடப்பெயருடன் சேர்ந்துள்ள திசைகாட்டும் ה, ராமாவை நோக்கிய இயக்கத்தைக் குறிக்கிறது; தமிழில் ‘ராமாவுக்கு’ என இயல்பாகத் தரப்படுகிறது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: சாமுவேல் ராமாவுக்குத் திரும்பியதற்கான காரணத்தை அறிமுகப்படுத்துகிறது.
- source_word: בֵּיתוֹ
  choice: அவருடைய வீடு
  rationale: בַּיִת இங்கு அவர் வசித்த இடத்தைக் குறிக்கிறது; ‘வீடு’ என்பது துல்லியமும் இயல்பும் உடைய தமிழ்.
- source_word: וְשָׁם
  choice: அங்கே
  rationale: ராமாவை சாமுவேலின் பணித்தளமாக வலியுறுத்தும் שָׁם என்ற சொல்லின் மறுபயன்பாடு தமிழிலும் பாதுகாக்கப்படுகிறது.
- source_word: שָׁפַט אֶת־יִשְׂרָאֵל
  choice: இஸ்ரவேலுக்கு நீதித்தீர்ப்பு வழங்கினார்
  rationale: שׁפט என்பது சாமுவேலின் நீதிபதி வேடத்தைச் சுட்டுகிறது. ‘நீதித்தீர்ப்பு வழங்கினார்’ என்பது வெறும் அரசாட்சியாக மாற்றாமல் அதன் அடிப்படை நீதிசார் கருத்தைப் பாதுகாக்கிறது.
- source_word: וַיִּבֶן
  choice: கட்டினார்
  rationale: வாவ் தொடர்நிலை கதைநடையை முன்னெடுக்கிறது. மூலத்தில் தனியான ‘மேலும்’ இல்லாததால் அது சேர்க்கப்படவில்லை.
- source_word: מִזְבֵּחַ
  choice: ஒரு பலிபீடம்
  rationale: מִזְבֵּחַ என்பதற்கான வழக்கமான, தெளிவான தமிழ் இணைச்சொல்.
- source_word: לַיהוָה
  choice: யெகோவாவுக்கு
  rationale: לְ அர்ப்பணிப்பை அல்லது நோக்கத்தைச் சுட்டுகிறது; יהוה என்ற தனிப்பெயர் தமிழில் பரவலாக அறியப்பட்ட ‘யெகோவா’ என ஒலிபெயர்க்கப்படுகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யெகோவா
  alternative: யாவே; கர்த்தர்
  rationale: மூல உரை நான்கு எழுத்துகளைக் கொண்ட இறைத்தனிப்பெயரை நேரடியாகப் பயன்படுத்துகிறது. பட்டப்பெயரான ‘கர்த்தர்’ என்று மாற்றாமல் தனிப்பெயராகப் பாதுகாக்கப்பட்டது. எபிரெய உயிரொலி மரபு உறுதியற்றதால் ‘யாவே’ என்பதும் சாத்தியம்; தமிழ் வாசகர்களுக்கு பரவலாக அறிமுகமான ‘யெகோவா’ தேர்ந்தெடுக்கப்பட்டது.
- issue: சாமுவேலின் שׁפט செயற்பாட்டின் பரப்பு
  choice: நீதித்தீர்ப்பு வழங்கினார்
  alternative: இஸ்ரவேலை நியாயந்தீர்த்தார்; இஸ்ரவேலை ஆட்சி செய்தார்
  rationale: இச்சொல் நீதிவழங்குதல் மட்டுமன்றி தலைமைப் பொறுப்பையும் உள்ளடக்கக்கூடும். ஆனால் ‘ஆட்சி செய்தார்’ என்பது நீதிபதி என்ற வேதாகமப் பங்கைக் குறைவாக வெளிப்படுத்தும்; தேர்ந்த சொற்றொடர் அடிப்படைப் பொருளைத் தக்கவைக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் வேதாகமக் கதைநடைக்கு ஏற்ற கண்ணியத்துடனும் வடிவமைக்கப்பட்டது. ‘அங்கே’ என்ற மறுபயன்பாடு மூலத்தின் இடவலியுறுத்தலைக் காக்கிறது; வாக்கியங்கள் தமிழின் இயல்புக்காகப் பிரிக்கப்பட்டுள்ளன.
