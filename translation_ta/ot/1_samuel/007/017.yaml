  source_fidelity: மூலத்தின் தொடர்ச்சியான/வழக்கமான செயலைக் காட்டும் சூழலுக்கு ‘திரும்பி வருவார்’ பொருந்துகிறது. ஆனால் שָׁפַט אֶת־יִשְׂרָאֵל என்பது ‘இஸ்ரவேலுக்கு நீதித்தீர்ப்பு வழங்கினார்’ என்பதைவிட, சாமுவேல் இஸ்ரவேலின்மேல் நீதிபதியாகச் செயல்பட்ட பரந்த பொருளை உடையது; ‘இஸ்ரவேலை நியாயந்தீர்த்தார்’ அதனைச் சிறப்பாகக் காக்கிறது. יהוה-வை ஆங்கில POB தடத்தில் உள்ள ‘Yahweh’க்கு இணங்க ‘யாவே’ எனத் தருவது தனிப்பெயரையும் காக்கிறது.
