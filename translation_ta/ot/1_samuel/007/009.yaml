  source_fidelity: 'மூல எபிரெயத்தின் முக்கியக் கூறுகள் அனைத்தும் துல்லியமாகக் காக்கப்பட்டுள்ளன: טְלֵה חָלָב என்பது பால் குடிக்கும் இளம் ஆட்டுக்குட்டியாகவும், עוֹלָה כָּלִיל என்பது முழுவதுமாகச் செலுத்தப்படும் தகனபலியாகவும், זעק என்பது தீவிரக் கூக்குரலாகவும் மொழிபெயர்க்கப்பட்டுள்ளது. בְּעַד יִשְׂרָאֵל என்பதன் ‘இஸ்ரவேலுக்காக’ என்ற பரிந்துரைப் பொருளும், இறுதியில் சாமுவேலுக்கே பதில் அளிக்கப்பட்டது என்பதும் தெளிவாக உள்ளன.'
