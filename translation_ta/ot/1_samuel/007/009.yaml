source:
  edition: WLC
  text: וַ/יִּקַּ֣ח שְׁמוּאֵ֗ל טְלֵ֤ה חָלָב֙ אֶחָ֔ד ו/יעלה עוֹלָ֛ה כָּלִ֖יל לַֽ/יהוָ֑ה וַ/יִּזְעַ֨ק שְׁמוּאֵ֤ל אֶל יְהוָה֙ בְּעַ֣ד יִשְׂרָאֵ֔ל וַֽ/יַּעֲנֵ֖/הוּ יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/007/009.yaml
  text: So Samuel took one nursing lamb and offered it as a whole burnt offering to Yahweh. And Samuel cried out to Yahweh on behalf of Israel[a], and Yahweh answered him.
translation:
  language: ta
  text: சாமுவேல் பால் குடிக்கும் ஆட்டுக்குட்டி ஒன்றை[a] எடுத்து, அதை முழுவதுமாக யாவேக்குத் தகனபலியாகச் செலுத்தினார். பின்னர் சாமுவேல் இஸ்ரவேலுக்காக யாவேவை நோக்கிக் கூக்குரலிட்டார்; யாவே அவருக்குப் பதிலளித்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “பால் மறக்காத ஆட்டுக்குட்டி ஒன்று” என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொற்றொடர் இன்னும் பால் குடித்துக்கொண்டிருக்கும் ஆட்டுக்குட்டியைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: טְלֵה חָלָב אֶחָד
  choice: பால் குடிக்கும் ஆட்டுக்குட்டி ஒன்று
  rationale: இந்த எபிரெயச் சொற்றொடர் இன்னும் பால் குடிக்கும் இளம் ஆட்டுக்குட்டியைக் குறிக்கிறது. தமிழில் இயல்பாகவும் தெளிவாகவும் அதன் இளமையை வெளிப்படுத்துகிறது.
- source_word: וַיַּעֲלֵה
  choice: செலுத்தினார்
  rationale: עלה என்பதன் ஹிஃபில் வடிவம் இங்கு பலியைச் செலுத்துவதற்கான வழக்கமான பலியியல் வினைச்சொல். தமிழில் ‘பலியாகச் செலுத்தினார்’ என்பது இயல்பான சமயச் சூழல் மொழியாகும்.
- source_word: עוֹלָה כָּלִיל
  choice: முழுவதுமாக ... தகனபலியாக
  rationale: עוֹלָה என்பது எரித்துச் செலுத்தப்படும் பலியையும், כָּלִיל அந்தப் பலி முழுமையாகச் செலுத்தப்பட்டதையும் குறிக்கிறது. இவ்விரு கூறுகளையும் இந்த மொழிபெயர்ப்பு வெளிப்படுத்துகிறது.
- source_word: לַיהוָה
  choice: யாவேக்கு
  rationale: יְהוָה என்ற தனிப்பெயரை தமிழில் ஒலிபெயர்த்து, மூலத்தின் உடன்படிக்கைப் பெயரை நேரடியாகப் பாதுகாக்கிறது.
- source_word: וַיִּזְעַק
  choice: கூக்குரலிட்டார்
  rationale: זעק என்பது உதவியை நாடும் தீவிரமான அழுகுரலைக் குறிக்கிறது. வெறுமனே ‘வேண்டினார்’ என்பதைவிட இதன் உணர்ச்சி வலிமையைப் பாதுகாக்கிறது.
- source_word: בְּעַד יִשְׂרָאֵל
  choice: இஸ்ரவேலுக்காக
  rationale: בְּעַד இங்கு இஸ்ரவேலின் நலனுக்காகச் செய்யப்படும் பரிந்துரையைச் சுருக்கமாகவும் இயல்பாகவும் குறிக்கிறது.
- source_word: וַיַּעֲנֵהוּ יְהוָה
  choice: யாவே அவருக்குப் பதிலளித்தார்
  rationale: வினைச்சொல்லிலுள்ள ஆண்பால் ஒருமை பின்னொட்டு சாமுவேலையே பதில் பெற்றவராகச் சுட்டுகிறது; தமிழ் உரை இதைத் தெளிவாகக் காக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழியாக்கம்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: இவ்வசனம் நான்கெழுத்து இறைப்பெயரை நேரடியாகப் பயன்படுத்துவதால், பொதுப்பட்டத்தை இடாமல் அந்தத் தனிப்பெயரைத் தமிழில் ஒலிபெயர்த்துள்ளது.
- issue: சாமுவேலின் செயலை பரிந்துரை ஜெபமாக வெளிப்படுத்துதல்
  choice: இஸ்ரவேலுக்காக ... கூக்குரலிட்டார்
  alternative: இஸ்ரவேலின் சார்பாக ... மன்றாடினார்
  rationale: மூலத்தில் உள்ள தீவிர அழைப்பையும் בְּעַד குறிக்கும் ‘அவர்களுக்காக’ என்ற உறவையும் காக்கிறது; சாமுவேலின் நடுநிலைப் பணியைத் தேவைக்கு மீறி கோட்பாட்டாக்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. பலியியல் சொற்களில் துல்லியத்தையும், சாமுவேலின் தீவிர அழைப்பில் மூலத்தின் உணர்ச்சி வலிமையையும் சமநிலைப்படுத்தப்பட்டுள்ளது.
