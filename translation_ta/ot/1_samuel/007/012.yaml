  text: Then Samuel took one stone and set it between Mizpah and Shen, and he called its name Ebenezer, for he said, “Up to this point the LORD has helped us.”
translation:
  language: ta
  text: பின்பு சாமுவேல் ஒரு கல்லை எடுத்து, அதை மிஸ்பாவுக்கும் சேனுக்கும் நடுவே நாட்டி, அதற்கு எபெனேசர்[a] என்று பெயரிட்டார். ஏனெனில், “இதுவரை யெகோவா நமக்கு உதவி செய்தார்” என்று அவர் சொன்னார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “எபெனேசர்” என்பதற்கு “உதவியின் கல்” என்று பொருள்.
    reason: அடுத்துள்ள சாமுவேலின் கூற்றுடன் தொடர்புடைய எபிரெயப் பெயர்ச்சொல் விளையாட்டை வாசகர் புரிந்துகொள்ள உதவுகிறது.
lexical_decisions:
- source_word: אֶבֶן אַחַת
  choice: ஒரு கல்
  rationale: எபிரெய உரையில் உள்ள எண்ணுச் சொல்லை இயல்பான தமிழில் தெளிவாகப் பிரதிபலிக்கிறது.
- source_word: וַיָּשֶׂם
  choice: நாட்டி
  rationale: நினைவுச் சின்னமாகக் கல்லை ஓர் இடத்தில் நிலைநிறுத்திய செயலை இயல்பாக உணர்த்துகிறது.
- source_word: אֶבֶן הָעָזֶר
  choice: எபெனேசர்
  rationale: இடப்பெயராக ஒலிபெயர்க்கப்படுகிறது; அதன் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: עַד הֵנָּה
  choice: இதுவரை
  rationale: இடம் அல்லது காலத்தின் இந்தப் புள்ளிவரை என்ற மூலத்தின் நெகிழ்வைச் சுருக்கமாகத் தக்கவைக்கிறது.
- source_word: עֲזָרָנוּ
  choice: நமக்கு உதவிசெய்தார்
  rationale: முதல் நபர் பன்மை பின்னொட்டையும் இறைவனின் உதவியையும் நேரடியாகக் காட்டுகிறது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: எபிரெய தனிப்பெயரைத் தமிழில் பரவலாக அறியப்பட்ட தனிப்பெயர் வடிவில் வழங்குகிறது; பொதுப்பட்டமான ‘கர்த்தர்’ என்று மாற்றவில்லை.
theological_decisions:
- issue: ‘இதுவரை’ என்பதன் இட/கால நுணுக்கம்
  choice: இதுவரை
  alternative: இந்த இடம்வரை
  rationale: עַד הֵנָּה சூழலில் புவியியல் எல்லையையும் நிகழ்வுகளின் இப்புள்ளிவரையையும் சுட்டக்கூடும்; ‘இதுவரை’ அந்த நெகிழ்வைத் தக்கவைக்கிறது.
- issue: தெய்வீகப் பெயர் יהוה
  choice: யெகோவா
  alternative: ஆண்டவர்
  rationale: மூலத்தில் பொதுப்பட்டம் அல்ல, தனிப்பெயர் உள்ளது; ஆகவே தமிழில் அறியப்பட்ட தனிப்பெயர் வடிவம் பயன்படுத்தப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையும் கண்ணியமும் பேணப்பட்டுள்ளன. தொடர் வினையெச்சங்கள் எபிரெயக் கதைநடையின் செயல்வரிசையை இயல்பான தமிழில் வழங்குகின்றன; மூலத்தின் பொருள் நெகிழ்வு தேவையின்றி தீர்மானிக்கப்படவில்லை.
