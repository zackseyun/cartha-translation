base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/007/013.yaml
  text: So the Philistines were subdued and did not again come into the territory of Israel[a]. And the hand of Yahweh was against the Philistines all the days of Samuel.
translation:
  language: ta
  text: இவ்வாறு பெலிஸ்தியர் அடக்கப்பட்டார்கள்; அவர்கள் மீண்டும் இஸ்ரவேலின் நாட்டுப்பகுதிக்குள் வரவில்லை. சாமுவேலின் நாட்களெல்லாம் யாவேயின் கை பெலிஸ்தியருக்கு எதிராக இருந்தது[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மொழியில், “யாவேயின் கை பெலிஸ்தியர்மேல் இருந்தது.” இங்குள்ள “கை” என்பது யாவேயின் செயல்படும் வல்லமையைக் குறிக்கும் மரபுத்தொடர்; இச்சூழலில் அந்த வல்லமை அவர்களுக்கு எதிராகச் செயல்பட்டது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּכָּנְעוּ
  choice: அடக்கப்பட்டார்கள்
  rationale: נכנע என்பதன் நிஃபால் வடிவம் தோல்விக்குப் பின் கீழ்ப்படுத்தப்பட்ட நிலையைக் குறிக்கிறது. இராணுவ-அரசியல் சூழலில் ‘அடக்கப்பட்டார்கள்’ என்பது அதன் செயப்பாட்டு விளைவைக் இயல்பாகத் தெரிவிக்கிறது.
- source_word: הַפְּלִשְׁתִּים
  choice: பெலிஸ்தியர்
  rationale: இந்த இனக்குழுவுக்கான வழக்கமான தமிழ் வேதாகமப் பெயர்.
- source_word: וְלֹא יָסְפוּ עוֹד
  choice: மீண்டும் … வரவில்லை
  rationale: יסף + עוד என்ற எபிரெய மரபுத்தொடர் ஒரு செயல் மறுபடியும் நிகழவில்லை என்பதைக் குறிக்கிறது.
- source_word: בִּגְבוּל יִשְׂרָאֵל
  choice: இஸ்ரவேலின் நாட்டுப்பகுதிக்குள்
  rationale: גְּבוּל என்பது எல்லைக்கோட்டையும் ஆட்சிப்பகுதியையும் குறிக்கலாம்; இங்கு வெறும் எல்லைக்கோட்டை அணுகுவது அல்ல, இஸ்ரவேலின் நிலப்பகுதிக்குள் நுழைவதே கருத்து.
- source_word: וַתְּהִי יַד יְהוָה
  choice: யாவேயின் கை … இருந்தது
  rationale: தெய்வீகச் செயலாற்றலையும் வல்லமையையும் குறிக்கும் எபிரெய உருவகத்தைத் தமிழிலும் காக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: நான்கு எழுத்துகளாலான தெய்வீகத் திருப்பெயரை ஒரு பட்டப்பெயரால் மாற்றாமல், தமிழில் ஒலிபெயர்த்துள்ளது.
- source_word: בַּפְּלִשְׁתִּים
  choice: பெலிஸ்தியருக்கு எதிராக
  rationale: இந்த இராணுவச் சூழலில் בְּ முன்னிடைச்சொல்லுடன் வரும் ‘கை’ மரபுத்தொடர் அவர்களுக்கு எதிரான தெய்வீக நடவடிக்கையைக் குறிக்கிறது.
- source_word: כֹּל יְמֵי שְׁמוּאֵל
  choice: சாமுவேலின் நாட்களெல்லாம்
  rationale: மூலத்தின் காலக் குறிப்பை நெருக்கமாகவும் தமிழில் புரியும்படியாகவும் காக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் பட்டப்பெயர் அல்ல, கடவுளின் தனிப்பெயரே உள்ளது; ஆகவே அதை ஒலிபெயர்ப்பது மூல வேறுபாட்டைக் காக்கிறது.
- issue: ‘யாவேயின் கை பெலிஸ்தியர்மேல் இருந்தது’ என்ற மரபுத்தொடரின் பொருள்
  choice: பெலிஸ்தியருக்கு எதிராக இருந்தது
  alternative: பெலிஸ்தியர்மேல் இருந்தது
  rationale: சூழல் இது ஆதரவையல்ல, எதிரான வல்லமையான நடவடிக்கையைக் குறிக்கிறது. ‘எதிராக’ என்பது அந்தச் சூழல்சார் பொருளைத் தெளிவுபடுத்துகிறது; ‘கை’ என்ற மூல உருவகத்தையும் காக்கிறது.
translation_notes:
  register: நவீன தரநிலைத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘கை’ என்ற வேதாகம உருவகம் காக்கப்பட்டு, அதன் எதிர்மறைச் சூழல்சார் வலிமை ‘எதிராக’ என்பதால் தெளிவாக்கப்பட்டுள்ளது.
