  source_fidelity: மூலத்தின் நிகழ்வுவரிசை, போருக்குச் சென்ற ‘இஸ்ரவேலின் ஆண்கள்,’ மிஸ்பா, பெலிஸ்தியர்கள், மற்றும் பெத்-காருக்குக் கீழான நிலவியல் குறிப்பு ஆகியவை வரைவில் துல்லியமாக உள்ளன. ஆனால் וַיַּכּוּם என்பதற்கு முதன்மை உரையில் ‘முறியடித்தார்கள்’ என்பது சாத்தியமானாலும் ‘தாக்கினார்கள்/அடித்தார்கள்’ என்பதைக் காட்டிலும் விளக்கமான போர்விளைவைச் சேர்க்கிறது. மூலத்தின் திறந்த பொருளைத் தக்கவைக்க ‘தாக்கினார்கள்’ சிறந்தது.
