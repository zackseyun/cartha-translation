  yaml_path: translation/ot/1_samuel/007/011.yaml
  text: Then the men of Israel went out from Mizpah[a], pursued the Philistines[b], and struck them down as far as below Beth-car.
translation:
  language: ta
  text: அப்போது இஸ்ரவேலின் ஆண்கள் மிஸ்பாவிலிருந்து புறப்பட்டு, பெலிஸ்தியர்களைத் துரத்திச் சென்று, பெத்-காருக்குக் கீழே வரை அவர்களைத் தாக்கினார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அவர்களை முறியடித்தார்கள்” என்றும் மொழிபெயர்க்கலாம். இங்குள்ள எபிரெய வினைச்சொல் போரில் தாக்குவதையோ முறியடிப்பதையோ குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצְאוּ
  choice: புறப்பட்டு
  rationale: יצא என்பதன் தொடர் இறந்தகால வடிவம் வெளியே செல்லுதல் அல்லது புறப்படுதலைக் குறிக்கிறது; இப்போர்ச் சூழலில் ‘புறப்பட்டு’ இயல்பாக உள்ளது.
- source_word: אַנְשֵׁי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் ஆண்கள்
  rationale: எபிரெயின் நேரடிப் பொருள் ‘இஸ்ரவேலின் ஆண்கள்’; போருக்குச் சென்ற ஆண்களைத் தெளிவாகக் குறிக்க இதைப் பாதுகாக்கிறது.
- source_word: מִן הַמִּצְפָּה
  choice: மிஸ்பாவிலிருந்து
  rationale: மிஸ்பா ஓர் இடப்பெயர் என்பதால் பொருளாக்காமல் தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: וַיִּרְדְּפוּ
  choice: துரத்திச் சென்று
  rationale: רדף போர்ச் சூழலில் எதிரியைப் பின்தொடர்ந்து துரத்துவதைக் குறிக்கிறது; நவீன தமிழில் இச்சொற்றொடர் இயல்பாக உள்ளது.
- source_word: פְּלִשְׁתִּים
  choice: பெலிஸ்தியர்கள்
  rationale: இந்த மக்களினத்திற்கான வழக்கமான தமிழ் பெயர்.
- source_word: וַיַּכּוּם
  choice: அவர்களை முறியடித்தார்கள்
  rationale: נכה போர்ச் சூழலில் தாக்குதல் அல்லது தோற்கடித்தலைக் குறிக்கலாம்; எல்லாரும் கொல்லப்பட்டார்கள் என்று மிகைப்படுத்தாமல் போர்த் தோல்வியின் பொருளைத் தருகிறது.
- source_word: עַד מִתַּחַת לְבֵית כָּר
  choice: பெத்-காருக்குக் கீழே உள்ள இடம்வரை
  rationale: עַד எல்லையைச் சுட்டுகிறது; מִתַּחַת என்பது பெத்-காரைவிடத் தாழ்வான இடத்தைக் குறிக்கும் நிலவியல் வெளிப்பாடு.
