  text: And Samuel judged Israel all the days of his life[a].
translation:
  language: ta
  text: சாமுவேல் தன் வாழ்நாளெல்லாம் இஸ்ரவேலுக்கு நியாயம் விசாரித்தார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இஸ்ரவேலை நியாயந்தீர்த்தார்”; அல்லது, “இஸ்ரவேலுக்கு நியாயாதிபதியாக வழிநடத்தினார்/ஆட்சி செய்தார்.” எபிரெய வினை நீதித்தீர்ப்பு வழங்குதல் மற்றும் நியாயாதிபதியாக நிர்வகித்தல் ஆகிய நுணுக்கங்களைக் கொண்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁפֹּט
  choice: நியாயம் விசாரித்து வழிநடத்தினார்
  rationale: שׁפט என்ற எபிரெய வினை இங்கு நீதித்தீர்ப்பு வழங்குதல் மட்டுமன்றி, நியாயாதிபதியாக மக்களை ஆளுதல் அல்லது வழிநடத்துதல் என்ற பொருளையும் கொண்டுள்ளது. இரு நுணுக்கங்களையும் இயல்பான தமிழில் காக்க இச்சொற்றொடர் பயன்படுத்தப்பட்டது.
- source_word: שְׁמוּאֵל
  choice: சாமுவேல்
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் பரவலாக நிலைபெற்றுள்ள பெயர் வடிவம்.
- source_word: אֶת יִשְׂרָאֵל
  choice: இஸ்ரவேலை
  rationale: אֶת என்பது நேரடிச் செயப்படுபொருள் குறியீடு; தமிழில் வேற்றுமை உருபுடன் ‘இஸ்ரவேலை’ என வழங்கப்படுகிறது.
- source_word: כֹּל יְמֵי חַיָּיו
  choice: தன் வாழ்நாளெல்லாம்
  rationale: ‘அவனுடைய வாழ்வின் எல்லா நாட்களிலும்’ என்ற எபிரெய மரபுத்தொடரை, முழு வாழ்நாள் காலத்தையும் தெளிவாகக் குறிக்கும் இயல்பான நவீனத் தமிழில் வழங்குகிறது.
theological_decisions:
- issue: சாமுவேலின் பணியை நீதித்தீர்ப்பாக மட்டுமா அல்லது ஆட்சித் தலைமையாகவுமா வெளிப்படுத்துவது
  choice: நியாயம் விசாரித்து வழிநடத்தினார்
  alternative: நியாயந்தீர்த்தார்; ஆட்சி செய்தார்
  rationale: மூல வினையின் நீதித்துறை மற்றும் தலைமை/ஆட்சி சார்ந்த பரப்பை ஒரே குறுகிய தமிழ்ச் சொல் முழுமையாகப் பிடிக்காது. ஆகவே வரலாற்றுச் ‘நியாயாதிபதி’ பணியின் இரு அம்சங்களையும் வெளிப்படுத்தும் சொற்றொடர் தேர்ந்தெடுக்கப்பட்டது; அடிக்குறிப்பு மாற்று மொழிபெயர்ப்புகளைக் காட்டுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. ‘நியாயம் விசாரித்து வழிநடத்தினார்’ என்பது மூலத்தின் நீதித்துறை மற்றும் ஆட்சித் தலைமை நுணுக்கங்களைச் சமநிலைப்படுத்துகிறது; அடிக்குறிப்பு உண்மையான சொற்பொருள் பரப்பைப் பாதுகாக்கிறது.
