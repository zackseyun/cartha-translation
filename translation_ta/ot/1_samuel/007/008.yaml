  text: וַ/יֹּאמְר֤וּ בְנֵֽי יִשְׂרָאֵל֙ אֶל שְׁמוּאֵ֔ל אַל תַּחֲרֵ֣שׁ מִמֶּ֔/נּוּ מִ/זְּעֹ֖ק אֶל יְהוָ֣ה אֱלֹהֵ֑י/נוּ וְ/יֹשִׁעֵ֖/נוּ מִ/יַּ֥ד פְּלִשְׁתִּֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/007/008.yaml
  text: Then the sons of Israel said to Samuel[a], “Do not be silent for us from crying out to Yahweh our God, that he may save us from the hand of the Philistines.”
translation:
  language: ta
  text: அப்போது இஸ்ரவேல் மக்கள் சாமுவேலிடம், “எங்களுக்காக நம் கடவுளாகிய யாவேயை நோக்கிக் கூப்பிடுவதை நிறுத்தாதீர்; அவர் எங்களைப் பெலிஸ்தியரின் கையிலிருந்து காப்பாற்றும்படி வேண்டிக்கொள்ளுங்கள்” என்றார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்கள்
  rationale: எபிரெய மொழியில் சொற்படியாக ‘இஸ்ரவேலின் மகன்கள்’ என்றாலும், இங்கு முழு சமூகத்தையும் குறிக்கிறது. நவீன தமிழில் ‘இஸ்ரவேல் மக்கள்’ இயல்பாகவும் உள்ளடக்கமாகவும் பொருளைத் தருகிறது.
- source_word: אַל תַּחֲרֵשׁ ... מִזְּעֹק
  choice: கூப்பிடுவதில் மௌனமாயிராதீர்
  rationale: חרשׁ என்பதன் ‘மௌனமாயிரு’ என்ற சொல்லுருவத்தையும், זעק என்பதன் உதவி வேண்டிய வலிய கூக்குரலையும் முடிந்தவரை பாதுகாக்கிறது. எபிரெயத் தொடரின் அசாதாரண அமைப்பும் முற்றிலும் மறைக்கப்படவில்லை.
- source_word: מִמֶּנּוּ
  choice: எங்களுக்காக
  rationale: இங்கு இடவியல் ‘எங்களிடமிருந்து’ என்பதல்ல; இஸ்ரவேலரின் சார்பாகச் செய்யப்படும் வேண்டுதலைக் குறிக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இது பட்டப்பெயர் அல்ல, எபிரெய வேதத்தில் வரும் தனிப்பட்ட இறைப்பெயர்; ஆகவே தமிழில் ‘யாவே’ என ஒலிபெயர்க்கப்படுகிறது.
- source_word: אֱלֹהֵינוּ
  choice: நம் கடவுளாகிய
  rationale: முதல் நபர் பன்மை உடைமைப் பொருளை இயல்பான தமிழில் காட்டி, இஸ்ரவேலின் உடன்படிக்கை உறவையும் பாதுகாக்கிறது.
- source_word: וְיֹשִׁעֵנוּ
  choice: எங்களைக் ... காப்பாற்றும்படி
  rationale: சாமுவேல் கூப்பிடுவதன் நோக்கம் அல்லது எதிர்பார்க்கப்படும் விளைவு யாவே அவர்களைக் காப்பாற்றுவது என்பதைக் காட்டுகிறது.
- source_word: מִיַּד פְּלִשְׁתִּים
  choice: பெலிஸ்தியர்களின் கையிலிருந்து
  rationale: ஆட்சி அல்லது அதிகாரத்திலிருந்து விடுவிப்பதைக் குறிக்கும் எபிரெய உருவகத்தை ‘கையிலிருந்து’ என்று பாதுகாக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் தனிப்பட்ட இறைப்பெயர் நேரடியாக உள்ளது. பட்டப்பெயரால் மாற்றாமல் ஒலிபெயர்ப்பது மூலத்தின் வேறுபாட்டைப் பாதுகாக்கிறது.
- issue: சாமுவேலின் வேண்டுதல் தொடர வேண்டுமா, அல்லது அவர் மௌனமாயிருக்கக் கூடாதா?
  choice: கூப்பிடுவதில் மௌனமாயிராதீர்
  alternative: கூப்பிடுவதை நிறுத்தாதீர்
  rationale: சூழலில் தொடர்ந்து வேண்டுதல் செய்யுமாறு கேட்பதே நடைமுறைப் பொருள். எனினும் மூல வினைச்சொல்லின் ‘மௌனம்’ என்ற உருவகத்தை முதன்மை உரை பாதுகாக்கிறது; தெளிவான பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன தரமான, மரியாதைமிக்க தமிழ் பயன்படுத்தப்பட்டுள்ளது. சாமுவேலை நோக்கிய உரையில் ‘மௌனமாயிராதீர்’ என்ற மரியாதைப் பன்மை உள்ளது. ‘இஸ்ரவேல் மக்கள்’ என்பது இயல்பான சமூகக் குறிப்பாகத் தேர்ந்தெடுக்கப்பட்டது; ‘கையிலிருந்து’ என்ற எபிரெய உருவகம் பாதுகாக்கப்பட்டது.
