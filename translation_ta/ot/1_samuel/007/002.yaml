  rationale: முக்கிய உரையில் எபிரெயத்தின் ‘நாட்கள் பெருகின’ உருவகம் தக்கவைக்கப்பட்டுள்ளது; ஆனால் இருபது ஆண்டுகள் என்ற கால அளவு தமிழில் தெளிவாகவும் இயல்பாகவும் அமைக்கப்பட்டுள்ளது. யாவேயுடனான இஸ்ரவேலின் உறவைச் சொல்கின்ற இறுதித் தொடரில், விளக்கமான ‘நாடி’ என்பதற்குப் பதிலாக மூலத்தின் திசைநோக்கு மற்றும் பொருள்-தெளிவின்மையைப் பாதுகாக்கும் ‘நோக்கி’ பயன்படுத்தப்பட்டுள்ளது. திருத்தப்பட்ட உரையில் [a] அடிக்குறிப்புக்கான ஆதாரம் இல்லாததால் அது நீக்கப்பட்டுள்ளது; ‘நாட்கள் பெருகின’ என்பது முதன்மை உரையிலேயே போதுமான தெளிவுடன் உள்ளது.
