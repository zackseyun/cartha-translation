- from: பேழை கிரியாத்-யாரீமில் தங்கிய நாள் முதல், நாட்கள் பெருகி[a] இருபது ஆண்டுகள் ஆயின. இஸ்ரவேல் குடும்பத்தார் அனைவரும் யாவேயை நாடிப் புலம்பினார்கள்[b].
