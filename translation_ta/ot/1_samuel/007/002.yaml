  text: וַ/יְהִ֗י מִ/יּ֞וֹם שֶׁ֤בֶת הָֽ/אָרוֹן֙ בְּ/קִרְיַ֣ת יְעָרִ֔ים וַ/יִּרְבּוּ֙ הַ/יָּמִ֔ים וַ/יִּֽהְי֖וּ עֶשְׂרִ֣ים שָׁנָ֑ה וַ/יִּנָּה֛וּ כָּל בֵּ֥ית יִשְׂרָאֵ֖ל אַחֲרֵ֥י יְהוָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/007/002.yaml
  text: From the day the ark remained at Kiriath-jearim[a], the days became many, and they were twenty years[b]; and all the house of Israel lamented after Yahweh.
translation:
  language: ta
  text: பேழை கிரியாத்-யாரீமில் தங்கிய நாள் முதல், நாட்கள் பெருகின; அது இருபது ஆண்டுகளாயிற்று. இஸ்ரவேல் குடும்பத்தார் அனைவரும் யாவேயை நோக்கிப் புலம்பினார்கள்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: அல்லது, ‘யாவேக்காக ஏங்கினார்கள்’ அல்லது ‘யாவேயைத் தேடிப் புலம்பினார்கள்.’ எபிரெயத்தில் சொல்லுக்குச் சொல், ‘யாவேக்குப் பின்னாகப் புலம்பினார்கள்’; இது துயரத்தையும் அவரை நோக்கிய திரும்புதலையும் வெளிப்படுத்தும் சொற்றொடராக இருக்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: שֶׁבֶת
  choice: தங்கிய
  rationale: ישׁב என்ற வினையின் இவ்வடிவம், பேழை அந்த இடத்தில் தொடர்ந்து இருந்ததைக் குறிக்கிறது. உயிரற்ற பொருளைப் பற்றிய தமிழில் ‘தங்கிய’ என்பது இயல்பாகவும் தொடர்ந்திருத்தலைத் தெளிவாகவும் தெரிவிக்கிறது.
- source_word: הָאָרוֹן
  choice: பேழை
  rationale: எபிரெயத்தில் இங்கு கூடுதல் அடைமொழியின்றி ‘பேழை’ என்றே உள்ளது. ஆகவே ‘தேவனுடைய பேழை’ அல்லது ‘உடன்படிக்கைப் பேழை’ என்று மூலத்தில் இல்லாத விளக்கத்தைச் சேர்க்கவில்லை.
- source_word: בְּקִרְיַת יְעָרִים
  choice: கிரியாத்-யாரீமில்
  rationale: எபிரெய இடப்பெயர் தமிழில் ஒலிபெயர்க்கப்பட்டு, בְ குறிக்கும் இடம் ‘-இல்’ வேற்றுமையால் இயல்பாகத் தரப்பட்டுள்ளது.
- source_word: וַיִּרְבּוּ הַיָּמִים
  choice: நாட்கள் பெருகி
  rationale: ‘நாட்கள் மிகுந்தன/பெருகின’ என்ற எபிரெய உருவகத்தைத் தக்கவைத்தபடியே காலம் நீண்டதைக் குறிக்கிறது. இயல்பான மாற்றுரையாக ‘பல நாட்கள் கடந்தன’ என்பதைக் குறிப்பில் தருகிறது.
- source_word: וַיִּהְיוּ עֶשְׂרִים שָׁנָה
  choice: இருபது ஆண்டுகள் ஆயின
  rationale: முந்தைய ‘நாட்கள்’ என்பதன் கால அளவு இருபது ஆண்டுகளாக ஆனதை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: וַיִּנָּהוּ
  choice: புலம்பினார்கள்
  rationale: נהה என்பதன் முதன்மையான துயரம்/புலம்பல் உணர்வைத் தக்கவைக்கிறது; வெறும் ‘ஏங்கினார்கள்’ என்று மட்டும் மொழிபெயர்த்து மனந்திரும்புதலின் திசையை முன்கூட்டியே தீர்மானிப்பதைத் தவிர்க்கிறது.
- source_word: כָּל בֵּית יִשְׂרָאֵל
  choice: இஸ்ரவேல் குடும்பத்தார் அனைவரும்
  rationale: ‘இஸ்ரவேலின் வீடு’ என்னும் கூட்டு தேசிய-குடும்பக் கருத்தை, நவீன தமிழில் புரியும் ‘இஸ்ரவேல் குடும்பத்தார்’ எனப் பாதுகாக்கிறது.
- source_word: אַחֲרֵי יְהוָה
  choice: யாவேயை நாடி
  rationale: அடிப்படையில் ‘யாவேக்குப் பின்னால்/பின்’ எனும் அமைப்பு இச்சூழலில் அவரை நோக்கித் திரும்புதல் அல்லது அவருக்காக ஏங்குதல் என்ற இடைநிலையான பொருளைக் கொண்டிருக்கலாம். ‘நாடி’ அந்தத் திசையை இயல்பான தமிழில் காட்டுகிறது; புலம்பல் என்ற வினையுடன் அதன் தெளிவின்மை ஓரளவு தக்கவைக்கப்படுகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: יהוה என்ற தனிப்பெயரை ஒரு பட்டப்பெயரால் மாற்றாமல், தமிழில் பரவலாகப் புரியக்கூடிய ஒலிபெயர்ப்பாக வழங்குகிறது.
theological_decisions:
- issue: וַיִּנָּהוּ ... אַחֲרֵי יְהוָה என்பதில் இஸ்ரவேலின் பதிலின் தன்மை
  choice: ‘யாவேயை நாடிப் புலம்பினார்கள்’ என்று, துயரத்தையும் யாவேயை நோக்கிய இயக்கத்தையும் ஒன்றாக வைத்தல்
  alternative: ‘யாவேக்காக ஏங்கினார்கள்’ அல்லது ‘யாவேயை நோக்கிப் புலம்பினார்கள்’
  rationale: இந்த வசனம் முழுமையான மனந்திரும்புதலுக்கான வழக்கமான சொற்றொடரைப் பயன்படுத்தவில்லை. எனவே அடுத்த வசனங்களின் கருத்தை இங்கே முன்கூட்டியே சேர்க்காமல், துயரம், ஏக்கம், யாவேயை நோக்கித் திரும்புதல் ஆகியவற்றுக்கிடையிலான எபிரெயச் சொற்றொடரின் இறையியல் அழுத்தத்தைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன, கண்ணியமான பொதுத் தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘பேழை’ என்பது வேதாகமச் சூழலில் நிலைபெற்ற சொல்லாக இருந்தாலும் மிகப் பழமையான நடையை உருவாக்காது. எபிரெயத்தின் கால உருவகம் முதன்மை உரையில் தக்கவைக்கப்பட்டு, இயல்பான தமிழ் மாற்றுரை அடிக்குறிப்பில் தரப்பட்டுள்ளது. இறைபெயர் ‘யாவே’ என ஒலிபெயர்க்கப்பட்டுள்ளது.
