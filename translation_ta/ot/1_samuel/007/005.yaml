- from: பின்பு சாமுவேல், “இஸ்ரவேலர் அனைவரையும் மிஸ்பாவுக்குக் கூட்டிவாருங்கள்; நான் உங்கள் சார்பாக யாவேயிடம் மன்றாடுவேன்” என்றார்.
  to: பின்பு சாமுவேல், “இஸ்ரவேலர் அனைவரையும் மிஸ்பாவுக்குக் கூட்டுங்கள்; நான் உங்கள் சார்பாக யாவேயிடம் வேண்டிக்கொள்வேன்” என்றார்.
