id: 1SA.7.5
reference: 1 Samuel 7:5
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר שְׁמוּאֵ֔ל קִבְצ֥וּ אֶת כָּל יִשְׂרָאֵ֖ל הַ/מִּצְפָּ֑תָ/ה וְ/אֶתְפַּלֵּ֥ל בַּעַדְ/כֶ֖ם אֶל יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/007/005.yaml
  text: Then Samuel said[a], “Gather all Israel to Mizpah, and I will pray to Yahweh on your behalf.”
translation:
  language: ta
  text: பின்பு சாமுவேல், “இஸ்ரவேலர் அனைவரையும் மிஸ்பாவுக்குக் கூட்டுங்கள்; நான் உங்கள் சார்பாக யாவேயிடம் வேண்டிக்கொள்வேன்” என்றார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: பின்பு ... என்றார்
  rationale: வாவ் தொடர் வடிவம் நிகழ்வை அடுத்த கட்டத்துக்கு நகர்த்துகிறது; நவீன தமிழில் ‘பின்பு’ அந்த வரிசையை இயல்பாகக் காட்டுகிறது.
- source_word: קִבְצוּ
  choice: கூட்டிவாருங்கள்
  rationale: இது பன்மை ஏவல் வடிவம். மக்களை ஒரு குறிப்பிட்ட இடத்துக்கு ஒன்றுகூட்டும் அழைப்பைத் தமிழில் நேரடியாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: כָּל יִשְׂרָאֵל
  choice: இஸ்ரவேலர் அனைவரையும்
  rationale: இஸ்ரவேல் மக்கள் முழுவதையும் குறிக்கும் கூட்டுப் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: הַמִּצְפָּתָה
  choice: மிஸ்பாவுக்கு
  rationale: இடப்பெயருடன் உள்ள திசைசுட்டும் முடிவு, அந்த இடத்தை நோக்கிய நகர்வைக் குறிக்கிறது; ஆகவே ‘மிஸ்பாவுக்கு’ என்று மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: וְאֶתְפַּלֵּל
  choice: நான் ... மன்றாடுவேன்
  rationale: ஏவலைத் தொடர்ந்து சாமுவேல் செய்யவிருக்கும் செயலை முதலாம் நபர் வடிவம் குறிக்கிறது. ‘மன்றாடுவேன்’ என்பது தேவனிடம் செய்யப்படும் தீவிர வேண்டுதலைத் தெளிவாகக் காட்டுகிறது.
- source_word: בַּעַדְכֶם
  choice: உங்கள் சார்பாக
  rationale: எளிய ‘உங்களுக்காக’ என்பதைக் காட்டிலும், பிறருக்காகப் பரிந்து வேண்டுதல் செய்யும் நுட்பத்தை ‘உங்கள் சார்பாக’ தெளிவாகப் பாதுகாக்கிறது.
- source_word: אֶל יְהוָה
  choice: யாவேயிடம்
  rationale: אֶל என்பது வேண்டுதல் செலுத்தப்படும் நபரைச் சுட்டுகிறது; தமிழில் ‘-யிடம்’ இயல்பான இணைப்பு. יהוה என்ற தனிப்பெயர் ‘யாவே’ என ஒலிபெயர்க்கப்பட்டுள்ளது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: எபிரெய மூலத்தில் இறைவனின் தனிப்பெயரான יהוה நேரடியாக உள்ளது. பொதுப்பட்டமான ‘கர்த்தர்’ என்று மாற்றாமல், உடன்படிக்கைப் பெயரைத் தமிழில் ஒலிபெயர்ப்பது மூலத்தின் தனித்துவத்தைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘கூட்டிவாருங்கள்’ என்பது பன்மை ஏவலையும் மிஸ்பாவை நோக்கிய நகர்வையும் தெளிவாக்குகிறது; ‘உங்கள் சார்பாக மன்றாடுவேன்’ என்பது பரிந்துரை வேண்டுதலின் பொருளைப் பாதுகாக்கிறது.
