source:
  edition: WLC
  text: וַ/יָּבֹ֜אוּ אַנְשֵׁ֣י קִרְיַ֣ת יְעָרִ֗ים וַֽ/יַּעֲלוּ֙ אֶת אֲר֣וֹן יְהוָ֔ה וַ/יָּבִ֣אוּ אֹת֔/וֹ אֶל בֵּ֥ית אֲבִינָדָ֖ב בַּ/גִּבְעָ֑ה וְ/אֶת אֶלְעָזָ֤ר בְּנ/וֹ֙ קִדְּשׁ֔וּ לִ/שְׁמֹ֖ר אֶת אֲר֥וֹן יְהוָֽה׀־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/007/001.yaml
  text: Then the men of Kiriath-jearim came and brought up the ark of Yahweh[a], and they brought it into the house of Abinadab on the hill[b]. And they consecrated Eleazar his son to keep the ark of Yahweh.
translation:
  language: ta
  text: அப்போது கீரியாத்-யெயாரீமின் ஆட்கள் வந்து, யாவேயின்[a] பேழையை மேலே கொண்டுபோனார்கள். அதை மேட்டில் இருந்த அபினதாபின் வீட்டுக்குள் கொண்டுவந்தார்கள். யாவேயின் பேழையைக் காவல் காக்க அபினதாபின் மகன் எலெயாசாரைப் பரிசுத்தப் பணிக்காக அர்ப்பணித்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மூலத்தில் இங்கு יהוה (YHWH) என்ற இறைத்திருப்பெயர் உள்ளது; அது இங்கே “யாவே” என வழங்கப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: வந்து
  rationale: בוא என்ற வினையின் வழக்கமான கதைநடைப் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: אַנְשֵׁי קִרְיַת יְעָרִים
  choice: கீரியாத்-யெயாரீமின் ஆட்கள்
  rationale: אַנְשֵׁי என்பது குறிப்பாக அந்த ஊரின் ஆட்களைக் குறிக்கிறது; இடப்பெயர் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: וַיַּעֲלוּ
  choice: மேலே கொண்டுபோனார்கள்
  rationale: עלה என்பதில் உள்ள மேல்நோக்கிய நகர்வைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: אֲרוֹן יְהוָה
  choice: யாவேயின் பேழை
  rationale: אֲרוֹן என்பதன் வழிபாட்டுச் சூழலுக்கு ஏற்ற, மரியாதையான தமிழ்ச்சொல் ‘பேழை’; יהוה என்ற திருப்பெயர் ‘யாவே’ என ஒலிபெயர்க்கப்படுகிறது.
- source_word: וַיָּבִאוּ אֹתוֹ אֶל בֵּית אֲבִינָדָב
  choice: அதை ... அபினதாபின் வீட்டுக்குள் கொண்டுவந்தார்கள்
  rationale: இலக்கை நோக்கி உள்ளே கொண்டுவரும் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: בַּגִּבְעָה
  choice: மேட்டின்மேல்
  rationale: சுட்டுருபுடன் வரும் גִּבְעָה-வை முதன்மையாகப் பொதுப்பெயரான ‘மேடு’ என்று எடுத்துக்கொள்கிறது; இடப்பெயர் வாசிப்பு அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: קִדְּשׁוּ
  choice: தூய பணிக்கென ஒதுக்கினார்கள்
  rationale: קדשׁ என்பதன் புனித நோக்கத்திற்காக ஒருவரைத் தனியே ஒதுக்கும் பொருளை, இன்றைய வாசகர்களுக்குப் புரியும் வகையில் தருகிறது.
- source_word: לִשְׁמֹר
  choice: காவல்காக்க
  rationale: שׁמר இங்கு பேழையைப் பாதுகாத்துப் பராமரிக்கும் பொறுப்பைக் குறிக்கிறது.
theological_decisions:
- issue: יהוה என்ற இறைத்திருப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: எபிரெய மூலத்தில் உள்ள தனிப்பட்ட இறைத்திருப்பெயரை மறைக்காமல் ஒலிபெயர்க்கிறது; எந்த ஒரு சமயக்குழுவின் தனிப்பட்ட வழக்கையும் திணிப்பதில்லை.
- issue: בַּגִּבְעָה என்பது பொதுப்பெயரா இடப்பெயரா
  choice: மேட்டின்மேல்
  alternative: கிபியாவில்
  rationale: எபிரெய வடிவில் சுட்டுருப்பு இருப்பதால் ‘மேடு’ என்ற பொதுப்பெயர் வாசிப்பு நேரடியானது; இருப்பினும் இடப்பெயராகப் புரிந்துகொள்ளும் சாத்தியம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: קִדְּשׁוּ என்பதன் சடங்கு சார்ந்த பொருள்
  choice: தூய பணிக்கென ஒதுக்கினார்கள்
  alternative: பரிசுத்தப்படுத்தினார்கள்
  rationale: எலெயாசார் ஒழுக்கரீதியாக மாற்றப்பட்டார் என்று கூறாமல், பேழையைக் காக்கும் புனிதப் பொறுப்புக்காக நியமிக்கப்பட்டார் என்ற சூழல்சார் பொருளை வெளிப்படுத்துகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, மரியாதையான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘பேழை’ வழிபாட்டுச் சூழலின் கண்ணியத்தைப் பாதுகாக்கிறது; ‘தூய பணிக்கென ஒதுக்கினார்கள்’ என்பது அரிதான சடங்குச் சொல்லை விடத் தெளிவாக உள்ளது. இடப்பெயர்களின் ஒலிபெயர்ப்பு மூல எபிரெய உச்சரிப்புக்கு நெருக்கமாக வைக்கப்பட்டுள்ளது.
