revisions:
- from: அப்போது கீரியாத்-யெயாரீமின் ஆட்கள் வந்து, யாவேயின்[a] பேழையை மேலே கொண்டுபோனார்கள். அதை மேட்டின்மேல்[b] இருந்த அபினதாபின் வீட்டுக்குள் கொண்டுவந்தார்கள். யாவேயின் பேழையைக் காவல்காக்க அபினதாபின் மகன் எலெயாசாரைத் தூய பணிக்கென ஒதுக்கினார்கள்.
  to: அப்போது கீரியாத்-யெயாரீமின் ஆட்கள் வந்து, யாவேயின்[a] பேழையை மேலே கொண்டுபோனார்கள். அதை மேட்டில் இருந்த அபினதாபின் வீட்டுக்குள் கொண்டுவந்தார்கள். யாவேயின் பேழையைக் காவல் காக்க அபினதாபின் மகன் எலெயாசாரைப் பரிசுத்தப் பணிக்காக அர்ப்பணித்தார்கள்.
  rationale: Minor idiomatic and terminological refinements improve modern Tamil readability and make the consecratory sense explicit. The footnote set is retained, including the unresolved common-noun/place-name ambiguity of בַּגִּבְעָה. Footnote b remains anchored to “மேட்டில்” in the revised text.
