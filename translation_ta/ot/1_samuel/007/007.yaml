  text: וַ/יִּשְׁמְע֣וּ פְלִשְׁתִּ֗ים כִּֽי הִתְקַבְּצ֤וּ בְנֵֽי יִשְׂרָאֵל֙ הַ/מִּצְפָּ֔תָ/ה וַ/יַּעֲל֥וּ סַרְנֵֽי פְלִשְׁתִּ֖ים אֶל יִשְׂרָאֵ֑ל וַֽ/יִּשְׁמְעוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל וַ/יִּֽרְא֖וּ מִ/פְּנֵ֥י פְלִשְׁתִּֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/007/007.yaml
  text: When the Philistines heard that the sons of Israel had gathered at Mizpah[a], the rulers of the Philistines went up against Israel. When the sons of Israel heard it[b], they were afraid because of the Philistines.
translation:
  language: ta
  text: இஸ்ரவேல் மக்கள் மிஸ்பாவில்[a] ஒன்றுகூடியிருந்தார்கள் என்று பெலிஸ்தியர்கள் கேள்விப்பட்டார்கள். அப்போது பெலிஸ்திய ஆட்சியாளர்கள்[b] இஸ்ரவேலுக்கு எதிராகச் சென்றார்கள். இஸ்ரவேல் மக்கள் இதைக் கேள்விப்பட்டபோது, பெலிஸ்தியர்களுக்குப் பயந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘மிஸ்பாவுக்கு’ என்றும் மொழிபெயர்க்கலாம். எபிரெய வடிவத்தில் திசையைக் குறிக்கும் முடிவொட்டு உள்ளது; ஆனால் மக்கள் அங்கே ஒன்றுகூடியிருந்ததாகச் சூழல் காட்டுகிறது.
    reason: lexical_alternative
  - marker: b
    text: ‘பெலிஸ்தியப் பிரபுக்கள்’ என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் பெலிஸ்தியரின் அங்கீகரிக்கப்பட்ட ஆட்சித் தலைவர்களைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמְעוּ
  choice: கேள்விப்பட்டார்கள்
  rationale: செய்தியை அறிந்துகொள்வதைக் குறிக்கும் שׁמע என்பதன் இயல்பான நவீனத் தமிழ் வடிவம்; வசனத்தில் வரும் வினைச்சொல் மறுமுறையையும் காக்கிறது.
- source_word: פְלִשְׁתִּים
  choice: பெலிஸ்தியர்கள்
  rationale: இந்த மக்கள் இனத்தின் பெயருக்கான பரவலாக அறியப்பட்ட தமிழ் வடிவம்.
- source_word: הִתְקַבְּצוּ
  choice: ஒன்றுகூடியிருப்பது
  rationale: קבץ என்பதன் இத்பயேல் வடிவம் மக்கள் தாங்களாக ஒன்றுகூடியதைக் காட்டுகிறது; முன்னரே நிகழ்ந்த செயலும் தமிழ் தொடரில் இயல்பாக வெளிப்படுகிறது.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்கள்
  rationale: எபிரெய மொழிமரபுச் சொல்லான ‘இஸ்ரவேலின் மகன்கள்’ என்பது இங்கு இஸ்ரவேல் சமூகத்தினரைக் குறிக்கிறது; ‘இஸ்ரவேல் மக்கள்’ என்பது அதன் பொருளை இயல்பான, உள்ளடக்கமான நவீனத் தமிழில் தருகிறது.
- source_word: הַמִּצְפָּתָה
  choice: மிஸ்பாவில்
  rationale: இடப்பெயரிலுள்ள திசைநோக்கி முடிவு ‘மிஸ்பாவுக்கு’ என மொழிபெயர்க்கப்படலாம்; ஆனால் அவர்கள் அங்கே ஒன்றுகூடியிருந்ததாகச் சூழல் காட்டுவதால் ‘மிஸ்பாவில்’ பொருத்தமானது.
- source_word: וַיַּעֲלוּ
  choice: படையெடுத்து வந்தார்கள்
  rationale: עלה என்பதன் அடிப்படை உணர்வு ‘மேலே செல்லுதல்’; இங்குள்ள பகைமைமிக்க இராணுவ நகர்வை இயல்பான தமிழில் ‘படையெடுத்து வந்தார்கள்’ என்று தெரிவிக்கிறது.
- source_word: סַרְנֵי פְלִשְׁתִּים
  choice: பெலிஸ்திய ஆட்சியாளர்கள்
  rationale: סְרָנִים என்பது பெலிஸ்தியரின் அங்கீகரிக்கப்பட்ட அரசியல் மற்றும் இராணுவத் தலைவர்களைக் குறிக்கிறது; ‘ஆட்சியாளர்கள்’ தெளிவான நவீனத் தமிழ்.
- source_word: אֶל יִשְׂרָאֵל
  choice: இஸ்ரவேலுக்கு எதிராக
  rationale: אֶל பொதுவாக ‘நோக்கி’ எனினும், இங்குள்ள இராணுவச் சூழலில் பகைமை நோக்கத்தை ‘எதிராக’ தெளிவாக வெளிப்படுத்துகிறது.
- source_word: וַיִּירְאוּ
  choice: பயந்தார்கள்
  rationale: ירא குறிக்கும் அச்சத்தை எளிய, நேரடியான தமிழில் தருகிறது.
- source_word: מִפְּנֵי פְלִשְׁתִּים
  choice: பெலிஸ்தியர்களுக்குப் பயந்தார்கள்
  rationale: சொல்லுக்குச் சொல் வடிவம் ‘பெலிஸ்தியர்களின் முகத்திற்கு முன்பிருந்து’ என்றாலும், இச்சூழலில் அவர்களால் உண்டான அச்சமே பொருள்; தமிழ் மரபில் ‘அவர்களுக்குப் பயந்தார்கள்’ இயல்பானது.
