source:
  edition: WLC
  text: וַ/יָּסִ֨ירוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל אֶת הַ/בְּעָלִ֖ים וְ/אֶת הָ/עַשְׁתָּרֹ֑ת וַ/יַּעַבְד֥וּ אֶת יְהוָ֖ה לְ/בַדּֽ/וֹ־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/007/004.yaml
  text: So the sons of Israel removed the Baals and the Ashtaroths[a], and they served Yahweh alone.
translation:
  language: ta
  text: அதனால் இஸ்ரவேல் மக்கள் பாகால்களையும் அஸ்தரோத்துகளையும் அகற்றினார்கள்; யாவேக்கு மட்டுமே சேவித்தார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யாவே ஒருவரையே வழிபட்டார்கள்.” இந்த வினைக்கு யாவே செயப்படுபொருளாக வரும்போது, அது சேவித்தலையும் வழிபடுதலையும் குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּסִירוּ
  choice: அகற்றிவிட்டு
  rationale: ஹிஃபில் வடிவில் இந்த வினை ‘அகற்றுதல்’ அல்லது ‘நீக்குதல்’ என்று பொருள்படும். சிலைகளைத் தங்களிடமிருந்து ஒழித்த செயலை இயல்பான நவீன தமிழில் இது தெளிவாகக் காட்டுகிறது.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்கள்
  rationale: சொல்லுக்கு சொல் ‘இஸ்ரவேலின் மகன்கள்’ என்றாலும், இங்கு அது உடன்படிக்கை மக்களைக் குறிக்கும் வழக்கமான இனப்பெயர். ‘இஸ்ரவேல் மக்கள்’ என்பது பாலினத்தைக் காரணமின்றிக் குறுக்காமல், நவீன தமிழில் இயல்பாக அந்தக் கூட்டத்தைக் குறிக்கிறது.
- source_word: הַבְּעָלִים
  choice: பாகால்கள்
  rationale: எபிரெய உரையின் பன்மையைப் பாதுகாக்கிறது; இது பாகாலின் பல உள்ளூர் வடிவங்களையா அல்லது அவனுடைய வழிபாட்டுச் சிலைகளையா குறிக்கிறது என்பதைத் தேவையின்றி முடிவுசெய்வதில்லை.
- source_word: הָעַשְׁתָּרֹת
  choice: அஸ்தரோத்துகள்
  rationale: குறிப்பிட்ட அந்நிய தெய்வ வழிபாட்டைக் குறிக்கும் எபிரெயப் பன்மைப் பெயரை ஒலிபெயர்ப்பாகத் தக்கவைக்கிறது; பொதுவாக ‘பெண் தெய்வங்கள்’ என்று மாற்றி அதன் தனித்துவத்தை இழக்கவில்லை.
- source_word: וַיַּעַבְדוּ
  choice: பணிசெய்தார்கள்
  rationale: עבד என்பதன் அடிப்படை ‘பணிசெய்தல்/சேவித்தல்’; கடவுள் செயப்படுபொருளாக வரும்போது வழிபாட்டையும் உள்ளடக்கலாம். ‘பணிசெய்தார்கள்’ என்பது வழிபாட்டோடு உடன்படிக்கை சார்ந்த முழு விசுவாசத்தையும் திறந்தவாறு வைத்திருக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தலைப்புப் பெயரால் மாற்றாமல், எபிரெயத் தெய்வீகத் தனிப்பெயரைத் தமிழில் நேரடியாக ஒலிபெயர்க்கிறது.
- source_word: לְבַדּוֹ
  choice: மட்டுமே
  rationale: இங்கு யாவேக்கு உரிய தனிப்பட்ட, பகிரப்படாத பற்றுறுதியை இயல்பான தமிழில் தெளிவாகத் தெரிவிக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: உரையில் பொதுப் பட்டப்பெயர் அல்ல, உடன்படிக்கையின் தனிப்பெயரான நான்கு எழுத்துப் பெயரே உள்ளது. ஆகவே தனிப்பெயரின் தன்மையைப் பாதுகாக்க ‘யாவே’ பயன்படுத்தப்பட்டது.
- issue: עבד என்பதை ‘பணிசெய்தார்கள்’ என்றா ‘வழிபட்டார்கள்’ என்றா கொடுப்பது
  choice: யாவேக்கு மட்டுமே பணிசெய்தார்கள்
  alternative: யாவே ஒருவரையே வழிபட்டார்கள்
  rationale: இந்த வினை கடவுளைச் சார்ந்த சூழலில் வழிபாட்டைக் குறிக்கக்கூடும்; அதேவேளையில் பணிவு, சேவை, உடன்படிக்கை விசுவாசம் ஆகிய விரிவான கருத்துகளையும் தாங்குகிறது. முதன்மை உரை அந்த விரிவை வைத்திருக்கிறது; வழிபாடு என்ற சாத்தியம் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டது. ‘பாகால்கள்’, ‘அஸ்தரோத்துகள்’ என்ற பன்மைகள் மூலமொழியின் திட்டமிட்ட பன்மையைப் பாதுகாக்கின்றன. ‘அகற்றிவிட்டு’ என்பது சிலைகளை ஒழித்ததற்குப் பின் யாவேக்கு மட்டும் பணிசெய்தார்கள் என்ற செயல் தொடர்ச்சியை இயல்பாக வெளிப்படுத்துகிறது.
