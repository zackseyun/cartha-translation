  text: וַ/יֹּ֨אמֶר שָׁא֜וּל אֶל שְׁמוּאֵ֗ל אֲשֶׁ֤ר שָׁמַ֨עְתִּי֙ בְּ/ק֣וֹל יְהוָ֔ה וָ/אֵלֵ֕ךְ בַּ/דֶּ֖רֶךְ אֲשֶׁר שְׁלָחַ֣/נִי יְהוָ֑ה וָ/אָבִ֗יא אֶת אֲגַג֙ מֶ֣לֶךְ עֲמָלֵ֔ק וְ/אֶת עֲמָלֵ֖ק הֶחֱרַֽמְתִּי־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/020.yaml
  text: Saul said to Samuel[a], “But I did obey the voice of Yahweh, and I went on the way that Yahweh sent me, and I brought Agag king of Amalek[b], and I devoted Amalek to destruction.”
translation:
  language: ta
  text: சவுல் சாமுவேலிடம், “ஆனால் நான் யாவேயின் குரலுக்குக் கீழ்ப்படிந்தேன்[a]. யாவே என்னை அனுப்பிய வழியில் சென்றேன்; அமலேக்கின் அரசனான ஆகாகைக் கொண்டுவந்தேன்; அமலேக்கை அழிவுக்கென அர்ப்பணித்தேன்[b]” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயில், “யாவேயின் குரலைக் கேட்டேன்.” இங்கு அந்தச் சொற்றொடர் அவருடைய குரலைக் கேட்டு அதன்படி நடப்பதை, அதாவது கீழ்ப்படிவதை, குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: “முற்றிலும் அழித்தேன்” அல்லது “தடையாணையின் கீழ் வைத்தேன்” என்றும் மொழிபெயர்க்கலாம். எபிரெய வினை, ஒன்றை அழிவுக்காக ஒதுக்கி அர்ப்பணிக்கும் பொருளைக் கொண்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמַעְתִּי בְּקוֹל
  choice: யாவேயின் குரலுக்குக் கீழ்ப்படிந்தேன்
  rationale: שׁמע בקול என்பது ஒருவரின் குரலைக் கேட்டு அதன்படி நடப்பதை, அதாவது கீழ்ப்படிவதை, குறிக்கும். ‘குரலுக்குக் கீழ்ப்படிந்தேன்’ என்பது எபிரெய மொழிவடிவத்தையும் பொருளையும் தக்கவைக்கிறது; சூழலிலுள்ள சவுலின் மறுப்புத் தொனியை ‘ஆனால்’ வெளிப்படுத்துகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைத் திருப்பெயரான நான்கெழுத்துப் பெயரை ஒரு பட்டப்பெயராக மாற்றாமல், தமிழில் தெளிவான ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: וָאֵלֵךְ בַּדֶּרֶךְ
  choice: வழியில் சென்றேன்
  rationale: ‘வழியில் சென்றேன்’ என்பது எபிரெய உருவகத்தைத் தக்கவைத்து இயல்பான தமிழாகவும் உள்ளது; ‘பணியை நிறைவேற்றச் சென்றேன்’ போன்ற விளக்கத்தைச் சேர்ப்பதில்லை.
- source_word: אֲשֶׁר שְׁלָחַנִי יְהוָה
  choice: யாவே என்னை அனுப்பிய
  rationale: இந்தத் தொடர்புச் சொற்றொடர் ‘வழி’ என்பதை இயல்பான தமிழில் வரையறுக்கிறது; அனுப்பப்பட்ட பணி என்ற கருத்தைத் தேவைக்கு மேல் விரிவாக்குவதில்லை.
- source_word: וָאָבִיא
  choice: கொண்டுவந்தேன்
  rationale: בוא என்பதன் ஹிஃபீல் வடிவம் ‘வரச் செய்தல்/கொண்டுவருதல்’ என்பதைக் குறிக்கிறது. சூழலில் திரும்பக் கொண்டுவந்தது தெரிந்தாலும், வினையில் வெளிப்படையாக இல்லாத ‘திரும்ப’ என்பதைச் சேர்க்கவில்லை.
- source_word: אֲגַג מֶלֶךְ עֲמָלֵק
  choice: அமலேக்கின் அரசனான ஆகாக்
  rationale: எபிரெய இணைப்பைத் தெளிவான, இயல்பான தமிழில் நேரடியாக அளிக்கிறது.
- source_word: הֶחֱרַמְתִּי
  choice: அழிவுக்கென அர்ப்பணித்தேன்
  rationale: חרם என்பதன் ஹிஃபீல் வடிவம் தடையாணையின் கீழ் ஒன்றை அழிவுக்காக ஒதுக்கி வைப்பதைக் குறிக்கிறது. இந்த மொழிபெயர்ப்பு வெறும் ‘அழித்தேன்’ என்பதைவிட அதன் அர்ப்பணிப்பு/நியமிப்பு நுணுக்கத்தையும் தக்கவைக்கிறது.
- source_word: וְאֶת עֲמָלֵק
  choice: அமலேக்கை
  rationale: மூலத்தில் உள்ள ஒருமை இயற்பெயரைத் தக்கவைக்கிறது; இங்கு அது அமலேக்கிய மக்களை ஒட்டுமொத்தமாகக் குறிக்கிறது.
theological_decisions:
- issue: புனிதப் போர் சூழலில் חרם என்ற வினையின் பொருள்
  choice: அமலேக்கை அழிவுக்கென அர்ப்பணித்தேன்
  alternative: அமலேக்கை முற்றிலும் அழித்தேன்; அமலேக்கைத் தடையாணையின் கீழ் வைத்தேன்
  rationale: ‘அழிவுக்கென அர்ப்பணித்தேன்’ என்பது கட்டளையின்படி முழுமையான அழிவுக்கு ஒதுக்குதல் என்ற நீதித்தீர்ப்பு மற்றும் வழிபாட்டுச் சார்ந்த வலிமையைத் தக்கவைக்கிறது. சவுல் உண்மையில் அதை முழுமையாகச் செய்தான் என்று மொழிபெயர்ப்பாளர் உறுதிப்படுத்தாமல், அவன் கூறும் உரிமைக்கூற்றாகவே விடுகிறது.
- issue: சவுலின் வலியுறுத்தலான தற்காப்பு
  choice: ஆனால் நான் ... கீழ்ப்படிந்தேன்
  alternative: நான் ... கீழ்ப்படிந்தேன்; உண்மையில் நான் ... கீழ்ப்படிந்தேன்
  rationale: வசனச் சூழலில் சவுல் சாமுவேலின் குற்றச்சாட்டை எதிர்த்து வாதிடுகிறான். ‘ஆனால்’ அந்த எதிர்மறைத் தொடர்பை இயல்பான தமிழில் காட்டுகிறது; மூலத்தில் இல்லாத கூடுதல் காரணத்தைச் சேர்ப்பதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் வேதாகம உரைக்கு ஏற்ற கண்ணியமான நடையிலும் வடிவமைக்கப்பட்டது. சவுலின் தற்காப்புத் தொனி ‘ஆனால்’ மூலம் காட்டப்பட்டுள்ளது. ‘அழிவுக்கென அர்ப்பணித்தேன்’ என்ற சற்றே செறிவான சொற்றொடரின் அர்த்தம் அடிக்குறிப்பில் விளக்கப்படுகிறது.
