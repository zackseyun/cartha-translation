  text: Then Saul struck Amalek[a], from Havilah as you go to Shur[b], which is opposite Egypt.
translation:
  language: ta
  text: பின்பு சவுல், ஆவிலா முதல் எகிப்துக்கு எதிரே இருக்கும் சூரை அடையும் இடம்வரை அமலேக்கை[a] தாக்கினான்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அமலேக்கியர்களை’; எபிரெயத்தில் ‘அமலேக்கு’ என்று உள்ளது. முன்னோரின் பெயர் இங்கு அந்த மக்களைக் கூட்டாகக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘எகிப்துக்குக் கிழக்கே இருக்கும் சூர்’ அல்லது ‘எகிப்துக்கு முன்பாக இருக்கும் சூர்’; எபிரெயத் தொடர் எகிப்தை நோக்கியோ அதற்கு எதிரேயோ அமைந்த இடத்தைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּךְ
  choice: தாக்கினான்
  rationale: נכה என்பது ‘அடி, தாக்கு, முறியடி’ என்ற பரந்த பொருளுடையது. இந்தக் கூறிலேயே வெற்றியின் அளவை மிகைப்படுத்தாமல், வினையின் நேரடியான வலிமையை ‘தாக்கினான்’ காக்கிறது.
- source_word: עֲמָלֵק
  choice: அமலேக்கு
  rationale: எபிரெயத்தில் முன்னோரின் ஒருமைப் பெயரான ‘அமலேக்கு’ இங்கு அந்த மக்களைக் கூட்டாகக் குறிக்கிறது; மூல வடிவத்தைப் பாதுகாக்க இப்பெயரே பயன்படுத்தப்பட்டுள்ளது.
- source_word: מֵחֲוִילָה
  choice: ஆவிலா முதல்
  rationale: מִן என்ற முன்னொட்டு புவியியல் எல்லையின் தொடக்கத்தைக் குறிக்கிறது; தமிழில் ‘முதல்’ இயல்பான நேரடி இணை.
- source_word: בּוֹאֲךָ
  choice: செல்லும் வழிவரை
  rationale: ‘நீ செல்லும்போது’ என்ற சொற்பொருளுடைய இவ்வடிவம் புவியியல் வழித்தடத்தைச் சுட்டும் மரபுத்தொடர். இலக்கு எல்லையைக் காட்டும் சூழலில் ‘செல்லும் வழிவரை’ இயல்பாக உள்ளது.
- source_word: שׁוּר
  choice: சூர்
  rationale: இடப்பெயர் தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: אֲשֶׁר עַל־פְּנֵי מִצְרַיִם
  choice: எகிப்துக்கு எதிரே இருக்கும்
  rationale: עַל־פְּנֵי என்பது ஒரு இடத்திற்கு முன்பாக, எதிராக அல்லது அதை நோக்கிய நிலையில் இருப்பதைக் குறிக்கலாம். குறிப்பிட்ட திசையைத் தேவையின்றி நிர்ணயிக்காமல் ‘எதிரே’ அந்த இடவியல் நெகிழ்வைப் பாதுகாக்கிறது.
- source_word: שָׁאוּל
  choice: சவுல்
  rationale: நபரின் பெயர் தமிழில் வழக்கமான வேதாகம ஒலிபெயர்ப்பின்படி தரப்பட்டுள்ளது.
