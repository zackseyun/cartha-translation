  text: נִחַ֗מְתִּי כִּֽי הִמְלַ֤כְתִּי אֶת שָׁאוּל֙ לְ/מֶ֔לֶךְ כִּֽי שָׁב֙ מֵ/אַֽחֲרַ֔/י וְ/אֶת דְּבָרַ֖/י לֹ֣א הֵקִ֑ים וַ/יִּ֨חַר֙ לִ/שְׁמוּאֵ֔ל וַ/יִּזְעַ֥ק אֶל יְהוָ֖ה כָּל הַ/לָּֽיְלָה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/011.yaml
  text: I regret that I made Saul king[a], because he has turned back from following me and has not carried out my words. And Samuel burned with anger[d][c][b], and he cried out to Yahweh all night.
translation:
  language: ta
  text: “சவுலை அரசனாக்கியதை எண்ணி நான் வருந்துகிறேன்[a]. ஏனெனில், அவன் என்னைப் பின்பற்றுவதிலிருந்து விலகிவிட்டான்[b]; என் வார்த்தைகளை நிறைவேற்றவில்லை[c].” சாமுவேலுக்குக் கோபம் மூண்டது[d]; அவர் இரவு முழுவதும் யாவேயை நோக்கிக் கூக்குரலிட்டார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “எனக்கு வருத்தமாக இருக்கிறது” அல்லது “நான் மனம் மாறுகிறேன்” என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் சவுலை அரசனாக்கியதைக் குறித்த யாவேயின் ஆழ்ந்த வருத்தத்தை வெளிப்படுத்துகிறது.
    reason: lexical_alternative
  - marker: b
    text: சொல்லர்த்தமாக, “எனக்குப் பின்னாலிருந்து திரும்பிவிட்டான்”; இது யாவேயைப் பின்பற்றுவதை விட்டுவிட்டு விலகுவதைக் குறிக்கும் எபிரெய மரபுத்தொடர்.
    reason: lexical_alternative
  - marker: c
    text: “என் வார்த்தைகளைச் செயல்படுத்தவில்லை” அல்லது “என் வார்த்தைகளுக்குக் கீழ்ப்படியவில்லை” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: d
    text: எபிரெய மரபுத்தொடர் சொல்லர்த்தமாகக் கோபம் மூள்வதை அல்லது எரிவதைக் குறிக்கிறது. இச்சூழலில் சிலர் இதை ஆழ்ந்த துயரம் அல்லது கடும் மனக்கசப்பு என்றும் புரிந்துகொள்கிறார்கள்.
    reason: alternative_reading
lexical_decisions:
- source_word: נִחַמְתִּי
  choice: நான் வருந்துகிறேன்
  rationale: நחם என்பதன் நிஃபால் வடிவம் இங்கு சவுலின் அரசாட்சியைப் பற்றிய இறைவருத்தத்தையும் துயரத்தையும் வெளிப்படுத்துகிறது. கடவுள் ஒழுக்கத் தவறு செய்தார் என்று உணர்த்தாமல், மூலத்தின் உணர்ச்சிசார் வலிமையை இச்சொல் இயல்பான தமிழில் காக்கிறது.
- source_word: הִמְלַכְתִּי אֶת־שָׁאוּל לְמֶלֶךְ
  choice: சவுலை அரசனாக்கியதை
  rationale: מלך என்பதன் ஹிஃபீல் வடிவம் ஒருவரை அரசனாக ஏற்படுத்துவதையோ நிறுவுவதையோ குறிக்கிறது. ‘அரசனாக்கினேன்’ என்பது நேரடியான, இயல்பான தமிழ்.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: இரண்டாவது כִּי இறைவருத்தத்திற்கான காரணத்தை அறிமுகப்படுத்துவதால், தெளிவான காரண இணைப்புச்சொல் பயன்படுத்தப்பட்டது.
- source_word: שָׁב מֵאַחֲרַי
  choice: என்னைப் பின்பற்றுவதிலிருந்து விலகிவிட்டான்
  rationale: ‘எனக்குப் பின்னாலிருந்து திரும்பினான்’ என்ற எபிரெய மரபுத்தொடர், ஒருவரைப் பின்பற்றுவதை விட்டுவிடுதல் அல்லது அவரிடமிருந்து விலகுதல் என்று பொருள்படும். தமிழ் வடிவம் பின்பற்றுதல் என்ற மூலப்படிமத்தைத் தக்கவைக்கிறது.
- source_word: וְאֶת־דְּבָרַי לֹא הֵקִים
  choice: என் வார்த்தைகளை நிறைவேற்றவில்லை
  rationale: ‘வார்த்தைகளை நிலைநிறுத்துதல்’ என்பது அவற்றைச் செயல்படுத்தி நிறைவேற்றுவதைக் குறிக்கிறது. ‘கீழ்ப்படியவில்லை’ என்பதைவிட ‘நிறைவேற்றவில்லை’ என்பது மூலத்தின் செயற்படுத்துதல் சார்ந்த பொருளை நெருக்கமாகக் காக்கிறது.
- source_word: וַיִּחַר לִשְׁמוּאֵל
  choice: சாமுவேலுக்குக் கோபம் மூண்டது
  rationale: חרה ל என்ற மரபுத்தொடர் கோபம் எரிவதை அல்லது மூள்வதைச் சுட்டுகிறது. இத்தமிழாக்கம் எபிரெயச் சொல்லோவியத்தையும் இயல்பான தமிழ் நடையையும் ஒருங்கே காக்கிறது.
- source_word: וַיִּזְעַק אֶל־יְהוָה
  choice: யாவேயை நோக்கிக் கூக்குரலிட்டார்
  rationale: זעק என்பது துயரத்திலோ அவசர வேண்டுதலிலோ எழுப்பப்படும் வலிய கூக்குரலைக் குறிக்கிறது. ‘கூக்குரலிட்டார்’ அதன் தீவிரத்தை வெளிப்படுத்துகிறது; அதை வெறுமனே ‘ஜெபித்தார்’ என்று விளக்கிக் குறுக்கவில்லை.
- source_word: יְהוָה
  choice: யாவே
  rationale: நான்கெழுத்து இறைப்பெயர் ஒரு பொதுப்பட்டத்தால் மாற்றப்படாமல், தமிழில் தனிப்பெயராக ஒலிபெயர்க்கப்பட்டது.
- source_word: כָּל־הַלַּיְלָה
  choice: இரவு முழுவதும்
  rationale: முழு இரவையும் குறிக்கும் இயல்பான நவீனத் தமிழ் வடிவம்.
theological_decisions:
- issue: கடவுளைப் பற்றிய נִחַמְתִּי என்பதன் பொருள்
  choice: நான் வருந்துகிறேன்
  alternative: நான் மனம் மாறுகிறேன் / எனக்கு வருத்தமாக இருக்கிறது / நான் இரங்குகிறேன்
  rationale: மூலவசனம் வெளிப்படுத்தும் உண்மையான இறைவருத்தத்தையும் அதன் இறையியல் பதற்றத்தையும் இவ்வடிவம் தக்கவைக்கிறது. கடவுள் பாவம் செய்தார் என்ற கருத்தையும், மறுபுறம் அவரது உணர்வை வெறும் உருவகமாகத் தணிக்கும் விளக்கத்தையும் மொழிபெயர்ப்பு புகுத்தவில்லை.
- issue: וַיִּחַר לִשְׁמוּאֵל என்பதில் சாமுவேலின் உணர்ச்சி
  choice: சாமுவேலுக்குக் கோபம் மூண்டது
  alternative: சாமுவேல் மிகவும் துயரமடைந்தார் / கடும் மனக்கசப்படைந்தார்
  rationale: எபிரெய மரபுத்தொடரின் முதன்மையான சொற்பொருள் கோபத்தைச் சுட்டுகிறது. சூழலில் துயரமோ ஆழ்ந்த மனக்கசப்போ உடனிருக்கலாம் என்பதைக் குறிப்பில் வைத்துள்ளோம்; பிரதான உரையில் அதை மட்டும் கொண்டு கோபத்தின் lexical force-ஐ மறைக்கவில்லை.
translation_notes:
  register: நடை நவீன பொதுத்தமிழில் இயல்பாகவும், வேதாகம வாசிப்புக்கு ஏற்ற கண்ணியத்துடனும் அமைக்கப்பட்டுள்ளது. நேரடி இறைக்கூற்று மேற்கோள் குறிகளுக்குள் வைக்கப்பட்டுள்ளது. ‘யாவே’ தனிப்பெயராகப் பாதுகாக்கப்பட்டுள்ளது; அரிதான சமயக் கலைச்சொற்கள் தவிர்க்கப்பட்டுள்ளன.
