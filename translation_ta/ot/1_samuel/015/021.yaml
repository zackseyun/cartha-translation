revisions:
- from: ஆனால் மக்கள் கொள்ளைப் பொருளிலிருந்து ஆடுமாடுகளையும், அழித்தொழிக்கும்படி அர்ப்பணிக்கப்பட்டவற்றில் மிகச் சிறந்தவற்றையும்[a] எடுத்துக்கொண்டார்கள்; கில்காலில் உங்கள் கடவுளாகிய யெகோவாவுக்குப் பலியிடுவதற்காகவே அவற்றை எடுத்துக்கொண்டார்கள்.
  to: ஆனால் மக்கள் கொள்ளைப் பொருளிலிருந்து, அழிவுக்கென ஒதுக்கப்பட்டவற்றில் மிகச் சிறந்த ஆடுகளையும் மாடுகளையும்[a], கில்காலில் உங்கள் கடவுளாகிய யாவேக்கு பலியிடுவதற்காக எடுத்துக்கொண்டார்கள்.
  rationale: The revision follows the Hebrew’s single finite verb and its appositional description of the animals, without adding a second assertion. It retains the contrastive “ஆனால்,” the purpose clause, Gilgal, and Saul’s “your God.” The footnote remains anchored to the phrase that renders רֵאשִׁית הַחֵרֶם.
