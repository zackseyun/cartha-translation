base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/021.yaml
  text: But the people took from the spoil sheep and cattle[a], the best of what had been devoted to destruction[c][b], to sacrifice to Yahweh your God at Gilgal.
translation:
  language: ta
  text: ஆனால் மக்கள் கொள்ளைப் பொருளிலிருந்து, அழிவுக்கென ஒதுக்கப்பட்டவற்றில் மிகச் சிறந்த ஆடுகளையும் மாடுகளையும்[a], கில்காலில் உங்கள் கடவுளாகிய யாவேக்கு பலியிடுவதற்காக எடுத்துக்கொண்டார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “அழிவுக்கென ஒதுக்கப்பட்டவற்றின் முதல் அல்லது மிகச் சிறந்த பகுதி.” இது அழிக்கப்பட வேண்டியவையாக ஒதுக்கப்பட்ட விலங்குகளைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: எடுத்துக்கொண்டார்கள்
  rationale: לקח என்பதன் நேரடியான பொருள் ‘எடுத்தல்’. எபிரெயத்தில் கூட்டுப்பெயரான ‘மக்கள்’ ஒருமை வினையுடன் வந்தாலும், இயல்பான தமிழில் பன்மை வினை பயன்படுத்தப்பட்டது.
- source_word: הָעָם
  choice: மக்கள்
  rationale: இச்சூழலில் சவுலின் படைவீரர்களைக் குறித்தாலும், பழியை அவர்கள்மீது சுமத்தும் எபிரெயச் சொல்லாட்சியைப் பேண ‘மக்கள்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: מֵהַשָּׁלָל
  choice: கொள்ளைப் பொருளிலிருந்து
  rationale: שׁלל என்பது போரில் கைப்பற்றப்பட்ட கொள்ளைப் பொருளைக் குறிக்கிறது; நவீன தமிழில் தெளிவாகப் புரியும் வடிவம் தேர்ந்தெடுக்கப்பட்டது.
- source_word: צֹאן וּבָקָר
  choice: ஆடுமாடுகள்
  rationale: சிறிய மற்றும் பெரிய கால்நடைகளைக் குறிக்கும் எபிரெய இணைச்சொல்லை இயல்பான, சுருக்கமான தமிழில் தருகிறது.
- source_word: רֵאשִׁית
  choice: மிகச் சிறந்தவை
  rationale: רֵאשִׁית என்பதற்கு ‘முதல்’ என்ற அடிப்படைப் பொருள் இருந்தாலும், இங்கு கால்நடைகளில் தேர்ந்த அல்லது மிகச் சிறந்த பகுதியைக் குறிக்கிறது.
- source_word: הַחֵרֶם
  choice: அழித்தொழிக்கும்படி அர்ப்பணிக்கப்பட்டவை
  rationale: חֵרֶם என்பது கடவுளுக்கென ஒதுக்கப்பட்டு அழிக்கப்பட வேண்டியவற்றைக் குறிக்கிறது; அர்ப்பணிப்பும் அழிவும் ஆகிய இரு கூறுகளையும் மொழிபெயர்ப்பு காக்கிறது.
- source_word: לִזְבֹּחַ
  choice: பலியிடுவதற்காக
  rationale: நோக்கத்தை வெளிப்படுத்தும் எபிரெய வினையெச்சத்தின் இயல்பான தமிழாக்கம்.
- source_word: לַיהוָה
  choice: யெகோவாவுக்கு
  rationale: יהוה என்ற தனிப்பட்ட இறைப் பெயரை பொதுப்பட்டமான ‘கர்த்தர்’ என மாற்றாமல், தமிழில் பரவலாக அறியப்படும் ஒலிபெயர்ப்பால் வெளிப்படுத்துகிறது.
- source_word: אֱלֹהֶיךָ
  choice: உங்கள் கடவுளாகிய
  rationale: சவுல் சாமுவேலை நோக்கி ‘உங்கள் கடவுள்’ என்று கூறும் இரண்டாம் நபர் ஒருமை உரிமை வடிவத்தின் முக்கியத்துவம் பேணப்படுகிறது; மரியாதைத் தமிழ் காரணமாக ‘உங்கள்’ பயன்படுத்தப்பட்டது.
- source_word: בַּגִּלְגָּל
  choice: கில்காலில்
  rationale: இடப்பெயருடன் வரும் בְּ முன்னொட்டின் இயல்பான தமிழாக்கம்.
theological_decisions:
- issue: חֵרֶם என்ற சொல்லின் புனிதப்போர் சார்ந்த பொருள்
  choice: அழித்தொழிக்கும்படி அர்ப்பணிக்கப்பட்டவை
  alternative: அழிவுக்கென ஒதுக்கப்பட்டவை
  rationale: இவை சாதாரண கொள்ளைப் பொருட்கள் அல்ல; கடவுளுக்கென ஒதுக்கப்பட்டதால் அழிக்கப்பட வேண்டியவை என்ற இறையியல் பதற்றத்தைத் தெளிவாகவும் தீர்த்துவிடாமலும் பேணுகிறது.
- issue: יהוה என்ற இறைப் பெயரின் மொழிபெயர்ப்பு
  choice: யெகோவா
  alternative: யாவே; கர்த்தர்
  rationale: மூலத்தில் தனிப்பட்ட இறைப் பெயர் இருப்பதை வாசகர் அறியும்படி ஒலிபெயர்ப்பு தேர்ந்தெடுக்கப்பட்டது; ‘கர்த்தர்’ என்பது பெயரைப் பட்டமாக மாற்றிவிடும், ‘யாவே’ என்பது சாத்தியமான மாற்று ஒலிபெயர்ப்பு.
- issue: ‘உங்கள் கடவுள்’ என்ற சவுலின் சொல்லாட்சி
  choice: உங்கள் கடவுளாகிய யெகோவா
  alternative: நம் கடவுளாகிய யெகோவா
  rationale: சவுலின் வார்த்தைகளில் காணப்படும் சாத்தியமான இடைவெளியை விளக்கித் தீர்க்காமல், மூலத்தின் இரண்டாம் நபர் உரிமை வடிவத்தை அப்படியே பேணுகிறது.
translation_notes:
  register: நவீன தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் வேதாகம உரைக்கு ஏற்ற கண்ணியத்துடனும் அமைக்கப்பட்டது. சவுல் மக்கள்மீது பழியை மாற்றும் தொனியைப் பேண ‘ஆனால்’ பயன்படுத்தப்பட்டது. நீண்ட எபிரெய வாக்கியத்தின் நோக்கத் தொடர்பைத் தெளிவாக்க இரண்டாவது கூறில் வினை மீண்டும் சொல்லப்பட்டுள்ளது.
