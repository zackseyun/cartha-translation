  yaml_path: translation/ot/1_samuel/015/026.yaml
  text: And Samuel said to Saul, “I will not return with you, because you have rejected the word of Yahweh, and Yahweh has rejected you from being king over Israel.”
translation:
  language: ta
  text: சாமுவேல் சவுலிடம், “நான் உன்னுடன் திரும்பி வரமாட்டேன். ஏனெனில் நீ யாவேவின் வார்த்தையைப் புறக்கணித்தாய்; யாவேவும் உன்னை இஸ்ரவேலின்மேல் அரசனாக இராதபடி புறக்கணித்தார்” என்றார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: என்றார்
  rationale: வாவ் தொடர்வினை கதையை முன்னெடுக்கிறது. தமிழில் மேற்கோளின் முடிவில் ‘என்றார்’ என்பது இயல்பான கதைநடை.
- source_word: לֹא אָשׁוּב עִמָּךְ
  choice: நான் உன்னுடன் திரும்பி வரமாட்டேன்
  rationale: שׁוּב என்பது ‘திரும்புதல்’; עִמָּךְ என்பது ‘உன்னுடன்’. உடன் செல்வதை சாமுவேல் மறுக்கும் உடனடி சூழலை இது தெளிவாகக் காட்டுகிறது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: சாமுவேலின் மறுப்புக்கான காரணத்தை அறிமுகப்படுத்துகிறது; நவீன தரமான தமிழில் தெளிவான காரண இணைப்புச்சொல்.
- source_word: מָאַסְתָּה / וַיִּמְאָסְךָ
  choice: புறக்கணித்தாய் / புறக்கணித்துவிட்டார்
  rationale: 'இரு இடங்களிலும் வரும் מאס என்ற ஒரே எபிரெய வேரின் திட்டமிட்ட மறுமொழியைத் தமிழிலும் காக்கிறது: சவுல் யாவேவின் வார்த்தையைப் புறக்கணித்தான்; யாவே சவுலைப் புறக்கணித்தார். ‘நிராகரி’ என்பதைவிட ‘புறக்கணி’ சாதாரண வாசகருக்கு இயல்பாகவும், ஏற்க மறுக்கும் வலிமையுடனும் உள்ளது.'
- source_word: דְּבַר יְהוָה
  choice: யாவேவின் வார்த்தை
  rationale: דָּבָר இங்கு அறிவிக்கப்பட்ட கட்டளையைக் குறித்தாலும், ‘வார்த்தை’ என்பது மூலத்தின் பரப்பையும் பழக்கமான வேதாகமச் சொல்லாட்சியையும் காக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இது ஒரு பட்டமல்ல, தேவனுடைய தனிப்பெயரான நான்கு எழுத்துப் பெயர்; அதனைத் தமிழில் ஒலிபெயர்த்து வழங்குகிறது.
- source_word: מֵהְיוֹת מֶלֶךְ עַל יִשְׂרָאֵל
  choice: இஸ்ரவேலின்மேல் அரசனாக இருப்பதிலிருந்து
  rationale: מִן + היה வினையெச்சம் ஒரு நிலையிலிருந்து நீக்கப்படுவதைக் குறிக்கிறது; עַל என்பதன் ‘மேல் ஆட்சி’ உணர்வையும் நேரடியாகக் காக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலத்தில் தனிப்பெயர் நேரடியாக உள்ளது. பட்டமாக மாற்றாமல் தனிப்பெயராக ஒலிபெயர்ப்பது மூல வேறுபாட்டைக் காக்கிறது.
- issue: מאס என்ற வேரின் பரஸ்பர மறுபயன்பாடு
  choice: இரு கூறுகளிலும் ‘புறக்கணி’ என்ற ஒரே வேர்ச்சொல்
  alternative: முதல் கூறில் ‘அவமதி’, இரண்டாவது கூறில் ‘நிராகரி’ போன்ற வேறுபட்ட சொற்கள்
  rationale: சவுலின் செயலும் யாவேவின் எதிர்செயலும் ஒரே எபிரெய வேரால் இணைக்கப்பட்டுள்ளன. அந்த அளவான பரஸ்பரத் தொடர்பைத் தமிழிலும் வெளிப்படுத்த ஒரே வேர்ச்சொல் பயன்படுத்தப்பட்டுள்ளது.
- issue: மன்னராட்சிப் பதவியிலிருந்து நீக்கப்படுதல்
  choice: அரசனாக இருப்பதிலிருந்து புறக்கணித்துவிட்டார்
  alternative: இனி நீ அரசனாக இருக்காதபடி நிராகரித்தார்
  rationale: מֵהְיוֹת என்பதன் சுருக்கமான அமைப்பையும் பதவியிலிருந்து விலக்கப்படும் கருத்தையும் காக்கிறது; இதன் காலநிலை சார்ந்த பதற்றத்தை மேலதிக விளக்கத்தால் தீர்க்கவில்லை.
translation_notes:
  register: நவீன தரமான, கண்ணியமான தமிழ். உரையாடல் இயல்புக்காக மேற்கோளுக்குள் இரண்டு வாக்கியங்கள் பயன்படுத்தப்பட்டன. ‘இஸ்ரவேலின்மேல் அரசன்’ என்பது மூலத்தின் עַל அமைப்பைத் தக்கவைத்துள்ள முறையான வேதாகம நடை.
