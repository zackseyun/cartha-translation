translation_notes:
  register: நவீன தரநிலைத் தமிழ்; மரியாதையும் இயல்பும் கொண்ட உரைநடை. எபிரெய வாக்கியத்தின் சவாலான தொனியும் ‘என் காதுகளில்’ என்ற உயிரோட்டமான சொல்லாட்சியும் பேணப்பட்டுள்ளன. அடிக்குறிப்பு குறியீடு முதன்மை உரையில் சேர்க்கப்பட்டுள்ளது.
