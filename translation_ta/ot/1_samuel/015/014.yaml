base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/014.yaml
  text: But Samuel said[a], “Then what is this sound of sheep in my ears, and the sound of cattle that I hear?”
translation:
  language: ta
  text: ஆனால் சாமுவேல், “அப்படியானால், என் காதுகளில் விழுகிற இந்த ஆடுகளின் சத்தமும், நான் கேட்கிற மாடுகளின் சத்தமும் என்ன?” என்று கேட்டார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘சத்தம்’ என்பதற்குப் பதிலாக இரண்டு இடங்களிலும் ‘குரல்’ என்றும் மொழிபெயர்க்கலாம். எபிரெய மொழியில் இரு இடங்களிலும் கோல் (qol) என்ற ஒரே சொல் வருகிறது; இங்கு அது விலங்குகள் எழுப்பும் ஒலியைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: ஆனால் சாமுவேல் ... என்று கேட்டார்
  rationale: தொடர்ச்சியைக் குறிக்கும் வாவ் இங்கு சவுலின் முந்தைய கூற்றுக்கு எதிரான சாமுவேலின் மறுப்பை அறிமுகப்படுத்துகிறது; உரை கேள்வியாக இருப்பதால் தமிழில் ‘என்று கேட்டார்’ இயல்பானது.
- source_word: וּמֶה
  choice: அப்படியானால் ... என்ன?
  rationale: விளக்கம் கோரும் சவாலான வினாவையும் இணைப்புச் சொல்லின் தர்க்கத் தொடர்ச்சியையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: קוֹל
  choice: சத்தம்
  rationale: இங்கு விலங்குகள் எழுப்பும் கேட்கக்கூடிய ஒலியைக் குறிக்கிறது; ‘குரல்’ என்பதும் சாத்தியம் என்பதால் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: הַצֹּאן
  choice: ஆடுகள்
  rationale: இந்தக் கூட்டுப்பெயர் செம்மறியாடுகளையும் வெள்ளாடுகளையும் குறிக்கக்கூடும்; தமிழில் மாடுகளுடன் எதிரிணையாக வரும் பொதுவான, இயல்பான தேர்வு ‘ஆடுகள்’.
- source_word: הַזֶּה
  choice: இந்த
  rationale: அப்போதே நேரடியாகக் கேட்கும் சத்தத்தைச் சுட்டும் அண்மைச் சுட்டுப்பெயரின் வலிமையைப் பேணுகிறது.
- source_word: בְּאָזְנָי
  choice: என் காதுகளில் கேட்கிற
  rationale: எபிரெய மொழியின் உயிரோட்டமான ‘என் காதுகளில்’ என்ற உருவகத்தைத் தமிழில் புரியத்தக்க முறையில் தக்கவைக்கிறது.
- source_word: וְקוֹל הַבָּקָר
  choice: மாடுகளின் சத்தமும்
  rationale: בקר என்பது மாட்டினத்தைக் குறிக்கும் கூட்டுப்பெயர்; ‘மாடுகள்’ நவீனத் தமிழில் பரந்தும் இயல்பாகவும் உள்ளது.
- source_word: אֲשֶׁר אָנֹכִי שֹׁמֵעַ
  choice: நான் கேட்கிற
  rationale: தொடர்ந்து கேட்கப்படும் நேரடி சான்றை இயல்பான நிகழ்காலத் தமிழில் வெளிப்படுத்துகிறது; אָנֹכִי-யின் வெளிப்படையான ‘நான்’ வினாவின் குற்றஞ்சாட்டும் வலிமையை ஆதரிக்கிறது.
