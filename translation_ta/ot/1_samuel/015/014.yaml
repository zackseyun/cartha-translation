  to: ஆனால் சாமுவேல், “அப்படியானால், என் காதுகளில் விழுகிற இந்த ஆடுகளின் சத்தமும், நான் கேட்கிற மாடுகளின் சத்தமும் என்ன?” என்று கேட்டார்.[a]
  rationale: The revision only clarifies the Tamil rendering of “in my ears,” changing it to the idiomatic “என் காதுகளில் விழுகிற.” It retains the source's rhetorical structure, the explicit first-person hearing in the second clause, and the existing lexical alternative footnote.
