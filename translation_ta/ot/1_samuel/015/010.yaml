  register: நவீனத் தரத் தமிழ்; பொதுவாசகர்களுக்கு தெளிவான, கண்ணியமான நடை. பழமையான ‘உண்டாயிற்று/சம்பவித்தது’ போன்ற சொற்றொடர்கள் தவிர்க்கப்பட்டுள்ளன; அடுத்த வசனத்தில் வரும் நேரடி உரைக்கான அறிமுகம் இரட்டைப்புள்ளியால் குறிக்கப்படுகிறது.
