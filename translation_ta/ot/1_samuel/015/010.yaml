  text: Then the word of Yahweh came to Samuel[a], saying,
translation:
  language: ta
  text: 'பின்பு, யாவேயின்[a] வார்த்தை சாமுவேலுக்கு வந்தது:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரேயத்தில்: “YHWH”; பாரம்பரியமாக “கர்த்தர்” என்று மொழிபெயர்க்கப்படுகிறது.'
    reason: யְהוָה என்ற இறைப்பெயரின் பாரம்பரிய மாற்றைத் தெரிவிக்கிறது.
lexical_decisions:
- source_word: וַיְהִי
  choice: பின்பு ... கூறியதாவது
  rationale: இந்த வடிவம் கதையில் அடுத்த நிகழ்வை அறிமுகப்படுத்துகிறது. தமிழில் பழமையான ‘சம்பவித்தது’ என்ற நடையைத் தவிர்த்து, தொடர்ச்சியை ‘பின்பு’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: דְּבַר יְהוָה
  choice: யாவே ... கூறியதாவது
  rationale: இது யாவேயிடமிருந்து வந்த வெளிப்பாட்டு உரை என்பதைக் கருத்துத் துல்லியத்துடன் இயல்பான தமிழில் தெரிவிக்கிறது. ‘யாவேயின் வார்த்தை வந்தது’ என்பது மூல வடிவத்துக்கு நெருக்கமான மாற்று; ஆனால் இங்கு தேர்ந்த வடிவம் தமிழில் தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரேய மெய்யெழுத்துப் பெயரான YHWH-ஐ ஒரு பட்டப்பெயரால் மாற்றாமல், பொதுவாக ஏற்றுக்கொள்ளப்படும் உச்சரிப்பைத் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: אֶל שְׁמוּאֵל
  choice: சாமுவேலிடம்
  rationale: தெய்வீக உரையின் பெறுநரை நவீனத் தமிழில் இயல்பாகக் குறிக்கிறது.
- source_word: לֵאמֹר
  choice: கூறியதாவது
  rationale: அடுத்து வரும் நேரடி உரையை அறிமுகப்படுத்தும் எபிரேய வடிவத்தின் பணியைத் தமிழில் தெளிவாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலத்தில் தனிப்பட்ட இறைப்பெயரே உள்ளது. ஆகவே அதை ஒரு பட்டப்பெயராக மாற்றாமல் ஒலிபெயர்த்து, பாரம்பரிய மாற்றை அடிக்குறிப்பில் தருகிறது.
- issue: דְּבַר יְהוָה என்ற தீர்க்கதரிசனச் சூத்திரத்தின் வடிவம்
  choice: யாவே ... கூறியதாவது
  alternative: யாவேயின் வார்த்தை சாமுவேலுக்கு வந்தது
  rationale: தெய்வீக வெளிப்பாடு சாமுவேலுக்கு வந்தது என்ற பொருளை இயல்பான தமிழில் தெரிவிக்கிறது; இருப்பினும் மூலத்தின் ‘வார்த்தை’ என்ற பெயர்ச்சொல் வடிவத்தை மாற்று மொழிபெயர்ப்பு வெளிப்படுத்துகிறது.
