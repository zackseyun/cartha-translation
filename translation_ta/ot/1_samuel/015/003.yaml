  source_fidelity: மூலத்தின் கட்டளைத் தொடர், ‘அமலேக்கு/அவன்’ என்ற கூட்டு ஒருமை, இரக்கம் காட்டாமை, மற்றும் மனிதர்/விலங்குகளின் முழுமைப் பட்டியல் ஆகியவை சரியாகப் பிரதிபலிக்கப்படுகின்றன. ஆனால் חָרַם என்பதற்கு ‘அர்ப்பணித்துவிடு’ என்பது தமிழில் சாதாரணமாக நேர்மறையான காணிக்கை அல்லது அர்ப்பணிப்பைக் குறிக்கக்கூடும்; இங்கு உள்ள மீளப்பெற முடியாத அழிவுக்கு ஒதுக்கும் நீதித்தீர்ப்பு நுணுக்கத்தைத் தெளிவாகத் தர ‘அழிவுக்கென்று ஒதுக்கிவிடு’ பாதுகாப்பானது.
  naturalness: நடை நவீன நிலையான தமிழில் நேரடியும் கண்ணியமுமானதுமாக உள்ளது. ‘அழிவுக்கென்று ஒதுக்கிவிடு’ என்பது ‘அழிவுக்கென்று அர்ப்பணித்துவிடு’ என்பதைவிட இச்சூழலில் இயல்பானதும் தவறான வழிபாட்டு/காணிக்கைத் தொடர்பைத் தவிர்ப்பதுமானது.
  terminology: ‘அமலேக்கு’ என்ற பெயரும் அதன் கூட்டு ஒருமையும் தக்கவைக்கப்பட வேண்டும். חרם-சொல்லுக்குத் தொழில்நுட்பமான ஆனால் இயல்பான ‘அழிவுக்கென்று ஒதுக்கிவிடு’ பயன்படுத்தப்படுகிறது. ‘மாடு ... ஆடு’ என்பது שׁוֹר மற்றும் שֶׂה ஆகியவற்றுக்கான போதுமான பொதுவகைச் சொற்களாகும்.
  issues:
  - severity: medium
    issue: ‘அழிவுக்கென்று அர்ப்பணித்துவிடு’ என்ற முதன்மை உரைச் சொல்
    rationale: ‘அர்ப்பணித்தல்’ தமிழில் காணிக்கை அல்லது நேர்மறை மதச் செயலை முதன்மையாக உணர்த்தலாம். ஹீப்ரு חרם இங்கே தெய்வீகத் தீர்ப்பின் கீழ் அழிவுக்கு மீளப்பெற முடியாதவாறு ஒதுக்குவதைக் குறிக்கிறது. ‘அழிவுக்கென்று ஒதுக்கிவிடு’ அந்தக் கருத்தைச் சிறப்பாகவும் இயல்பாகவும் தருகிறது.
  revised_text: இப்போது நீ போய் அமலேக்கை[a]த் தாக்கு. அவனுக்குச் சொந்தமான அனைத்தையும் அழிவுக்கென்று ஒதுக்கிவிடு[b]. அவன்மீது இரக்கம் காட்டாதே; ஆண் முதல் பெண் வரை, சிறு பிள்ளை முதல் பால்குடிக்கும் குழந்தை வரை, மாடு முதல் ஆடு வரை, ஒட்டகம் முதல் கழுதை வரை அனைத்தையும் கொன்றுவிடு.
