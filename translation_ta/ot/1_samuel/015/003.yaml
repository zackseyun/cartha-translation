base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/003.yaml
  text: Now go and strike Amalek[a], and devote to destruction all that belongs to him. Do not spare him, but put to death from man to woman, from child to nursing infant, from ox to sheep[b], from camel to donkey.
translation:
  language: ta
  text: இப்போது நீ போய் அமலேக்கை[a]த் தாக்கு. அவனுக்குச் சொந்தமான அனைத்தையும் அழிவுக்கென்று ஒதுக்கிவிடு[b]. அவன்மீது இரக்கம் காட்டாதே; ஆண் முதல் பெண் வரை, சிறு பிள்ளை முதல் பால்குடிக்கும் குழந்தை வரை, மாடு முதல் ஆடு வரை, ஒட்டகம் முதல் கழுதை வரை அனைத்தையும் கொன்றுவிடு.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அமலேக்கு’ என்பது இங்கு அமலேக்கிய மக்களை ஒரே கூட்டு அலகாகக் குறிக்கிறது; எனவே எபிரெய உரை இவ்வசனம் முழுவதும் ‘அவன்’ என்ற ஒருமையையும் பயன்படுத்துகிறது.
    reason: lexical_alternative
  - marker: b
    text: ‘முற்றிலும் அழித்துவிடு’ அல்லது ‘அழிவுத் தடையின் கீழ் வை’ என்றும் மொழிபெயர்க்கலாம். எபிரெய வினைச்சொல், தெய்வீகத் தீர்ப்பின்கீழ் ஒன்றை மீளப்பெற முடியாதவாறு அழிவுக்கென்று ஒதுக்குவதைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַתָּה
  choice: இப்போது
  rationale: கட்டளைத் தொடரை அறிமுகப்படுத்தும் கால/உரையாடல் குறியீட்டை இயல்பாகவும் நேரடியாகவும் தருகிறது.
- source_word: לֵךְ
  choice: நீ போய்
  rationale: எபிரெய ஒருமை ஆணையைத் தெளிவாகவும் நவீன தமிழில் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: וְהִכִּיתָה
  choice: தாக்கு
  rationale: נכה என்பதன் போர்ச் சூழலுக்குரிய ‘அடி/தாக்கு’ பொருளை, செயற்கையான பழமொழிநடை இல்லாமல் தருகிறது.
- source_word: עֲמָלֵק
  choice: அமலேக்கு
  rationale: எபிரெயத்தில் உள்ள ஒருமை இனப்பெயரைத் தக்கவைக்கிறது; இங்கு அது அமலேக்கிய மக்களை ஒரு கூட்டு அலகாகக் குறிக்கிறது.
- source_word: וְהַחֲרַמְתֶּם
  choice: அழிவுக்கென்று அர்ப்பணித்துவிடு
  rationale: חרם என்பதில் உள்ள, தெய்வீகத் தீர்ப்பின்கீழ் மீளப்பெற முடியாதவாறு அழிவுக்கு ஒதுக்கும் சமய-நியாயத்தீர்ப்பு நுணுக்கத்தை வெறும் ‘முற்றிலும் அழி’ என்பதைக் காட்டிலும் நன்றாகப் பாதுகாக்கிறது.
- source_word: כָּל אֲשֶׁר לוֹ
  choice: அவனுக்குச் சொந்தமான அனைத்தையும்
  rationale: அமலேக்கின் உடைமைகளையும் அவனோடு சேர்ந்த அனைத்தையும் உள்ளடக்கும் விரிவான சொற்றொடராக உள்ளது.
- source_word: וְלֹא תַחְמֹל עָלָיו
  choice: அவன்மீது இரக்கம் காட்டாதே
  rationale: חמל என்பதிலுள்ள இரங்குதல் மற்றும் அதனால் உயிரோடு விட்டுவைத்தல் ஆகிய இரு நிழற்பொருள்களையும் இயல்பான தமிழில் எடுத்துரைக்கிறது.
- source_word: וְהֵמַתָּה
  choice: அனைத்தையும் கொன்றுவிடு
  rationale: ஹிபில் வடிவின் ‘சாகச் செய்/கொல்’ பொருளை நேரடியாகவும் கடுமையை மறைக்காமலும் தருகிறது; பட்டியலின் மொத்தப் பரப்பையும் ‘அனைத்தையும்’ தெளிவாக்குகிறது.
- source_word: מֵאִישׁ עַד אִשָּׁה
  choice: ஆண் முதல் பெண் வரை
  rationale: முழுமையைக் குறிக்கும் ‘முதல் ... வரை’ அமைப்பையும் பாலின வகைப்பாட்டையும் காக்கிறது.
- source_word: מֵעֹלֵל וְעַד יוֹנֵק
  choice: சிறு பிள்ளை முதல் பால்குடிக்கும் குழந்தை வரை
  rationale: עולל குறிக்கும் சிறு பிள்ளைக்கும் יונק குறிக்கும் பால்குடிக்கும் குழந்தைக்கும் இடையிலான வேறுபாட்டைப் பாதுகாக்கிறது.
- source_word: מִשּׁוֹר וְעַד שֶׂה
  choice: மாடு முதல் ஆடு வரை
  rationale: שור என்பதைக் கால்நடை வகையாகவும், שה என்பதைக் செம்மறியாடு அல்லது வெள்ளாட்டை உள்ளடக்கக்கூடிய சிறுகால்நடை வகையாகவும் இயல்பான தமிழில் தருகிறது.
- source_word: מִגָּמָל וְעַד חֲמוֹר
  choice: ஒட்டகம் முதல் கழுதை வரை
  rationale: விலங்கு வகைகளைச் சுட்டும் ஒருமை வடிவங்களையும் மீளும் முழுமை அமைப்பையும் நேரடியாகக் காக்கிறது.
theological_decisions:
- issue: חרם என்ற போரியல்-நியாயத்தீர்ப்பு சொல்லின் மொழிபெயர்ப்பு
  choice: அழிவுக்கென்று அர்ப்பணித்துவிடு
  alternative: முற்றிலும் அழித்துவிடு; அழிவுத் தடையின் கீழ் வை
  rationale: இது சாதாரணப் போரழிவை மட்டும் அல்லாமல், தெய்வீகத் தீர்ப்பில் ஒன்றை மீளப்பெற முடியாதவாறு அழிவுக்கு ஒதுக்கும் கருத்தையும் கொண்டுள்ளது. விளக்கத்தை முதன்மை உரையில் மிகைப்படுத்தாமல் அந்த அழுத்தம் தக்கவைக்கப்படுகிறது.
- issue: ‘அமலேக்கு/அவன்’ என்ற கூட்டு ஒருமை
  choice: அமலேக்கு ... அவன்
  alternative: அமலேக்கியர்கள் ... அவர்கள்
  rationale: மூலத்தின் ஒருமை வடிவம் ஒரு மக்களை அல்லது அரசியல்-இனக் கூட்டத்தை ஒரே கூட்டு அலகாகக் குறிப்பிடுகிறது. அதைத் தக்கவைத்து அடிக்குறிப்பில் தெளிவுபடுத்துவது மூலவடிவத்தையும் வாசிப்புத் தெளிவையும் சமநிலைப்படுத்துகிறது.
- issue: மனித வகைகளைக் பாலினத்துடன் வெளிப்படுத்துதல்
  choice: ஆண் முதல் பெண் வரை
  alternative: எல்லா மக்களும்
  rationale: மூலம் ஆண், பெண் ஆகிய இரு வகைகளையும் வெளிப்படையாகக் குறிப்பிடுகிறது; பொதுப்படுத்தி அந்தச் சொற்களை நீக்காமல் முழுமையைக் குறிக்கும் அமைப்பு பாதுகாக்கப்படுகிறது.
- issue: וְהַחֲרַמְתֶּם என்பதிலுள்ள இலக்கண எண்ணிக்கை மாறுதல்
  choice: தமிழ் முதன்மை உரையில் சவுலுக்கான ஒருமைக் கட்டளையாக ‘அர்ப்பணித்துவிடு’
  alternative: ‘அர்ப்பணித்துவிடுங்கள்’ என்ற பன்மை வடிவம்
  rationale: வசனத்தின் மற்ற கட்டளைகள் சவுலை நோக்கிய ஒருமையில் உள்ளன; ஒரே பன்மை வடிவத்தை அப்படியே தமிழில் புகுத்துவது இயல்பற்ற நபர் மாற்றமாக ஒலிக்கும். அது சவுலோடு சேர்ந்த படையினரையும் உள்ளடக்கும் கட்டளையாக இருக்கலாம்; கருத்தைத் தீர்மானித்து விரிவாக்காமல் ஒருமைக் கட்டளைத் தொடரில் மொழிபெயர்க்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில் நேரடியான, கண்ணியமான கட்டளைநடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் கடுமை மென்மையாக்கப்படவில்லை. தொடர்ச்சியான ‘முதல் ... வரை’ அமைப்பு எபிரெய மெரிஸத்தின் முழுமைப் பொருளை இயல்பான தமிழில் தக்கவைக்கிறது; ‘அமலேக்கு/அவன்’ என்ற கூட்டு ஒருமை அடிக்குறிப்புடன் பாதுகாக்கப்பட்டுள்ளது.
