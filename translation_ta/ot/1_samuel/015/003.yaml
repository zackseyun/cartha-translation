  revision_rationale: முதன்மை உரையில் חרם-சொல்லின் தமிழாக்கம் மட்டும் மாற்றப்பட்டுள்ளது. இது காணிக்கை சார்ந்த பொருளுணர்வைத் தவிர்த்து, மூலத்தில் உள்ள அழிவுக்கு ஒதுக்கும் தொழில்நுட்பமான நீதித்தீர்ப்பு கருத்தைத் தெளிவாகக் காக்கிறது. மற்ற சொற்றொடர்களும் அடிக்குறிப்பு இடங்களும் மூலத்திற்கும் வரைவு அமைப்பிற்கும் ஏற்பத் தக்கவைக்கப்பட்டுள்ளன.
