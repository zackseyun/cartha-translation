base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/033.yaml
  text: Samuel said[a], “As your sword has made women childless[b], so your mother will be childless among women.” And Samuel hacked Agag to pieces before Yahweh at Gilgal.
translation:
  language: ta
  text: சாமுவேல், “உன் வாள் பெண்களைப் பிள்ளையிழக்கச் செய்ததுபோல், பெண்களுள் உன் தாயும் பிள்ளையிழந்தவளாவாள்” என்றார்.[a] பின்பு சாமுவேல் கில்காலில் யாவேக்கு முன்பாக ஆகாகைத் துண்டுதுண்டாக வெட்டினார்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘பெண்களைப் பிள்ளையிழந்தவர்களாக்கியது … உன் தாயும் பெண்களுள் பிள்ளையிழந்தவளாவாள்’ என்றும் மொழிபெயர்க்கலாம். எபிரேயத்தில் இரு வாக்கியப் பகுதிகளிலும் ஒரே வினைச்சொல் பயன்படுத்தப்பட்டு, செயலுக்கேற்ற பதில்தீர்ப்பு வலியுறுத்தப்படுகிறது.
    reason: lexical_alternative
  - marker: b
    text: ‘ஆகாகைத் துண்டுகளாக வெட்டினார்’ என்றும் மொழிபெயர்க்கலாம். எபிரேய வினைச்சொல் வெறுமனே கொல்வதைவிட உடலை வெட்டித் துண்டாக்கும் கடுமையான செயலைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁכְּלָה / תִּשְׁכַּל
  choice: பிள்ளையிழக்கச் செய்தது / பிள்ளையிழந்தவளாவாள்
  rationale: எபிரேய வேர்ச்சொல் இரு வாக்கியப் பகுதிகளிலும் மீண்டும் வந்து, ஆகாகின் செயலுக்கேற்ற பதில்தீர்ப்பை வலியுறுத்துகிறது. ‘பிள்ளையிழத்தல்’ என்பது மரணத்தால் பிள்ளைகளை இழக்கும் துயரத்தைத் தெளிவாகக் கூறுகிறது; வெறுமனே பிள்ளைகள் இல்லாத நிலையையோ மலட்டுத்தன்மையையோ குறிக்காது.
- source_word: חַרְבֶּךָ
  choice: உன் வாள்
  rationale: இது நேரடியான மொழிபெயர்ப்பு; ஆகாக் செய்த வன்முறைகளை ‘வாள்’ ஆகுபெயராகக் குறிக்கிறது.
- source_word: מִנָּשִׁים
  choice: பெண்களுள்
  rationale: ஒப்பீட்டுச் சொற்றொடரில் מן என்பதன் பொருளை இயல்பான, சுருக்கமான தமிழில் தருகிறது.
- source_word: וַיְשַׁסֵּף
  choice: துண்டுதுண்டாக வெட்டினார்
  rationale: שׁסף என்ற வினைச்சொல்லின் கடுமையான, உடலைத் துண்டாக்கும் பொருளை மென்மைப்படுத்தாமலும் தேவையின்றி மிகைப்படுத்தாமலும் வெளிப்படுத்துகிறது.
- source_word: לִפְנֵי יְהוָה
  choice: யாவே முன்னிலையில்
  rationale: לִפְנֵי என்பதன் முன்னிலை அல்லது சந்நிதி சார்ந்த பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: மூலத்தில் இடம்பெறும் இறைத் திருப்பெயரைப் பட்டப்பெயராக மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: בַּגִּלְגָּל
  choice: கில்காலில்
  rationale: நிகழ்வு நடந்த இடத்தைக் குறிக்கும் இயல்பான தமிழ் வேற்றுமை வடிவம்.
theological_decisions:
- issue: வன்முறையான தண்டனைச் செயலை மென்மைப்படுத்தாமலும் பரபரப்பூட்டாமலும் மொழிபெயர்த்தல்
  choice: சாமுவேல் ஆகாகைத் ‘துண்டுதுண்டாக வெட்டினார்’ என்று நேரடியாகக் கூறுதல்
  alternative: ‘ஆகாகைக் கொன்றார்’ அல்லது ‘வெட்டிக் கொன்றார்’
  rationale: மூல எபிரேயம் செயலைச் சாமுவேலுக்கே நேரடியாகக் கூறுவதுடன் வலுவான வினைச்சொல்லைப் பயன்படுத்துகிறது. பொதுவான ‘கொன்றார்’ என்பது அதன் சொற்பொருள் தீவிரத்தை இழக்கச் செய்யும்; தேர்ந்த வடிவம் கூடுதல் நியாயப்படுத்தலையும் விளக்கத்தையும் சேர்க்காது.
- issue: இறைத் திருப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர் அல்லது யெகோவா
  rationale: இவ்வசனம் יהוה என்ற தனிப்பட்ட இறைத் திருப்பெயரைப் பயன்படுத்துகிறது. ‘யாவே’ என்பது அதைத் தமிழில் தெளிவாக ஒலிபெயர்த்து, பொதுப் பட்டப்பெயருடன் கலந்து விடாமல் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளும் கண்ணியமான நடையில் அமைக்கப்பட்டுள்ளது. இரு இணை வாக்கியங்களிலும் ‘பிள்ளையிழ’ என்ற ஒரே சொல்வேரைப் பயன்படுத்தி எபிரேயச் சொல்லிணைப்பு காக்கப்பட்டுள்ளது. வன்முறையின் தீவிரம் மென்மைப்படுத்தப்படவில்லை; அதேவேளை மூலத்தில் இல்லாத உணர்ச்சி அல்லது நியாயப்படுத்தல் சேர்க்கப்படவில்லை.
