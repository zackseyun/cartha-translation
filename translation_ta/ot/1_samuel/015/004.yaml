reference: 1 Samuel 15:4
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יְשַׁמַּ֤ע שָׁאוּל֙ אֶת הָ/עָ֔ם וַֽ/יִּפְקְדֵ/ם֙ בַּ/טְּלָאִ֔ים מָאתַ֥יִם אֶ֖לֶף רַגְלִ֑י וַ/עֲשֶׂ֥רֶת אֲלָפִ֖ים אֶת אִ֥ישׁ יְהוּדָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/004.yaml
  text: 'So Saul summoned the people and mustered them at Telaim: two hundred thousand foot soldiers[a], and ten thousand men of Judah.'
translation:
  language: ta
  text: 'அப்போது சவுல் மக்களை அழைத்துக் கூட்டி, தெலாயீமில்[a] அவர்களைக் கணக்கெடுத்தான்: காலாட்படை வீரர்கள் இரண்டு இலட்சம்; யூதா கோத்திரத்தைச் சேர்ந்த ஆண்கள் பத்தாயிரம்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: בַּטְּלָאִים என்பதை இடப்பெயராக அல்லாமல் அதன் நேர்பொருளில் எடுத்தால், “ஆட்டுக்குட்டிகளுடன்” என்றும் மொழிபெயர்க்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְשַׁמַּע
  choice: அழைத்துக் கூட்டி
  rationale: שׁמע என்பதன் ஹிப்ஈல் வடிவம் இங்குப் படைச் சூழலில் மக்களை அழைத்துத் திரட்டுவதைக் குறிக்கிறது; வெறுமனே ‘கேட்கச் செய்தான்’ என்பதல்ல.
- source_word: הָעָם
  choice: மக்களை
  rationale: எபிரெயச் சொல் நேரடியாக ‘மக்கள்’ எனப் பொருள்படும். சூழலில் அவர்கள் போருக்காகத் திரட்டப்பட்டவர்கள் என்றாலும், மூலத்தில் இல்லாத ‘இராணுவம்’ என்ற சொல்லைச் சேர்க்காமல் உள்ளது.
- source_word: וַיִּפְקְדֵם
  choice: அவர்களைக் கணக்கெடுத்தான்
  rationale: פקד இங்கு படையினரைத் திரட்டி எண்ணிப் பதிவு செய்வதைக் குறிக்கிறது. நவீனத் தமிழில் ‘கணக்கெடுத்தான்’ இயல்பாகவும் தெளிவாகவும் அந்தச் செயலை வெளிப்படுத்துகிறது.
- source_word: בַּטְּלָאִים
  choice: தெலாயீமில்
  rationale: சூழலுக்கு ஏற்றபடி இது படையினர் கணக்கெடுக்கப்பட்ட இடத்தின் பெயராகப் புரிந்துகொள்ளப்படுகிறது. இதன் நேர்பொருளான ‘ஆட்டுக்குட்டிகளுடன்’ என்ற சாத்தியம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
- source_word: מָאתַיִם אֶלֶף
  choice: இரண்டு இலட்சம்
  rationale: தமிழில் வழக்கமான எண்ணிக்கை முறையில் 200,000 துல்லியமாக வழங்கப்பட்டுள்ளது.
- source_word: רַגְלִי
  choice: காலாட்படை வீரர்கள்
  rationale: இராணுவக் கணக்கெடுப்பில் רַגְלִי என்பது கால்நடையாகப் போரிடும் படைவீரர்களைக் குறிக்கிறது; ‘காலாட்படை வீரர்கள்’ என்பது தெளிவான நவீனத் தமிழ்.
- source_word: וַעֲשֶׂרֶת אֲלָפִים
  choice: பத்தாயிரம்
  rationale: மூலத்தின் எண்ணிக்கை நேரடியாகவும் இயல்பாகவும் மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: אֶת אִישׁ יְהוּדָה
  choice: யூதாவின் ஆண்கள்
  rationale: אִישׁ இங்கு யூதா கோத்திரத்தைச் சேர்ந்த ஆண்களைத் தொகுப்பாகக் குறிக்கிறது; கோத்திர அடையாளத்தை இந்தத் தேர்வு பாதுகாக்கிறது.
