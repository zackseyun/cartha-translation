revisions:
- from: 'அப்போது சவுல் மக்களை அழைத்துக் கூட்டி, தெலாயீமில்[a] அவர்களைக் கணக்கெடுத்தான்: காலாட்படை வீரர்கள் இரண்டு இலட்சம்; யூதாவின் ஆண்கள் பத்தாயிரம்.'
  to: 'அப்போது சவுல் மக்களை அழைத்துக் கூட்டி, தெலாயீமில்[a] அவர்களைக் கணக்கெடுத்தான்: காலாட்படை வீரர்கள் இரண்டு இலட்சம்; யூதா கோத்திரத்தைச் சேர்ந்த ஆண்கள் பத்தாயிரம்.'
