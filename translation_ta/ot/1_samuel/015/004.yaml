translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் கண்ணியமான வரலாற்று நடையில் அமைக்கப்பட்டுள்ளது. ‘மக்கள்’ என்ற மூலச்சொல் பாதுகாக்கப்பட்டதுடன், இராணுவச் சூழலை ‘காலாட்படை வீரர்கள்’ தெளிவுபடுத்துகிறது. உரையின் உண்மையான சொற்பொருள் ஐயம் அடிக்குறிப்பில் வெளிப்படையாக வைக்கப்பட்டுள்ளது.
