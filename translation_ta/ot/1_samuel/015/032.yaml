base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/032.yaml
  text: Then Samuel said[a], “Bring Agag king of Amalek to me.” And Agag came to him trembling, and Agag said, “Surely the bitterness of death has turned aside.”
translation:
  language: ta
  text: அப்போது சாமுவேல், “அமலேக்கியரின் அரசனாகிய ஆகாகை என்னிடம் கொண்டுவாருங்கள்” என்றார். ஆகாக் நடுங்கியபடி[a] அவரிடம் வந்து, “நிச்சயமாக, மரணத்தின் கசப்பு விலகிவிட்டது” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: מַעֲדַנֹּת என்ற எபிரெயச் சொல்லின் பொருள் உறுதியற்றது. இதை ‘மென்மையாக’, ‘நம்பிக்கையுடன்’, அல்லது ‘சங்கிலிகளுடன்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַגִּישׁוּ
  choice: என்னிடம் கொண்டுவாருங்கள்
  rationale: נגשׁ என்பதன் ஹிஃபில் பன்மை ஏவல் வடிவம்; பணியாளர்கள் ஆகாகை சாமுவேலின் முன்னிலையில் கொண்டுவர வேண்டும் என்ற கட்டளையை இயல்பான தமிழில் தருகிறது.
- source_word: אֲגַג מֶלֶךְ עֲמָלֵק
  choice: அமலேக்கின் அரசனான ஆகாக்
  rationale: எபிரெயக் கட்டமைப்பில் வரும் அரசப் பதவியையும் தனிப்பெயரையும் தெளிவான நவீன தமிழில் அடையாளப்படுத்துகிறது.
- source_word: וַיֵּלֶךְ אֵלָיו
  choice: அவரிடம் வந்து
  rationale: வினைச்சொல்லின் அடிப்படைப் பொருள் ‘சென்றான்’ என்றாலும், சாமுவேல் தன்னிடம் அழைத்த சூழலில் ‘அவரிடம் வந்து’ என்பது இயல்பாகவும் பொருள் மாறாமலும் உள்ளது.
- source_word: מַעֲדַנֹּת
  choice: நடுங்கியபடி
  rationale: இச்சொல்லின் பொருள் உறுதியற்றது. பண்டைய கிரேக்க மொழிபெயர்ப்பு ‘நடுங்கியபடி’ என்ற புரிதலை ஆதரிக்கிறது; வேறு விளக்கங்கள் மென்மையாக, நம்பிக்கையுடன், அல்லது கட்டுண்ட நிலையில் வந்ததாகக் கொள்கின்றன. முதன்மை உரையில் சூழலுக்கு ஏற்ற வாசிப்பு தரப்பட்டு, ஐயம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: אָכֵן
  choice: நிச்சயமாக
  rationale: ஆகாகின் உறுதியான மதிப்பீட்டை அல்லது நம்பிக்கையை வெளிப்படுத்தும் வலியுறுத்தல் சொல்லாக மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: סָר
  choice: விலகிவிட்டது
  rationale: סור என்பதன் கால் நிறைவுவடிவம்; ஆபத்து தன்னைவிட்டு அகன்றுவிட்டதாக ஆகாக் கருதுவதை இயல்பான தமிழில் எடுத்துரைக்கிறது.
- source_word: מַר הַמָּוֶת
  choice: மரணத்தின் கசப்பு
  rationale: மரணத்தின் கசப்பான அனுபவம் அல்லது அச்சுறுத்தல் என்ற உருவகத்தை விளக்கிச் சொல்லாமல் நேரடியாகப் பாதுகாக்கிறது.
