  text: וַ/יַּחְמֹל֩ שָׁא֨וּל וְ/הָ/עָ֜ם עַל אֲגָ֗ג וְ/עַל מֵיטַ֣ב הַ/צֹּאן֩ וְ/הַ/בָּקָ֨ר וְ/הַ/מִּשְׁנִ֤ים וְ/עַל הַ/כָּרִים֙ וְ/עַל כָּל הַ/טּ֔וֹב וְ/לֹ֥א אָב֖וּ הַחֲרִימָ֑/ם וְ/כָל הַ/מְּלָאכָ֛ה נְמִבְזָ֥ה וְ/נָמֵ֖ס אֹתָ֥/הּ הֶחֱרִֽימוּ־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/009.yaml
  text: But Saul and the people spared Agag and the best of the sheep and cattle[a], and the fattened calves, and the lambs, and all that was good, and they were not willing to devote them to destruction[b]. But every despised and worthless thing they devoted to destruction.
translation:
  language: ta
  text: ஆனால் சவுலும் மக்களும் ஆகாகையும், ஆடுமாடுகளில் சிறந்தவற்றையும், கொழுத்த விலங்குகளையும்[a], செம்மறியாட்டுக் கடாக்களையும், நல்லவை அனைத்தையும் அழிக்காமல் விட்டுவைத்தார்கள். அவற்றை அழிவுக்கென்று ஒதுக்க அவர்கள் விரும்பவில்லை[b]. ஆனால் இகழப்பட்டதும் பயனற்றதுமான அனைத்தையும் அழிவுக்கென்று ஒதுக்கினார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “கொழுத்த விலங்குகள்” என மொழிபெயர்க்கப்பட்டுள்ள எபிரெயச் சொல்லின் பொருள் உறுதியற்றது; “இரண்டாம் தரமானவை” அல்லது “இரண்டாவதாகப் பிறந்தவை” என்றும் பொருள் கொள்ளலாம்.
    reason: lexical_alternative
  - marker: b
    text: “அழிவுக்கென்று ஒதுக்குதல்” என்பது ஒன்றை அழிப்பதற்கான தடைக்கட்டளையின் கீழ் வைப்பதைக் குறிக்கும் எபிரெயத் தொழில்நுட்பச் சொற்றொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּחְמֹל
  choice: கொல்லாமல் விட்டுவைத்தார்கள்
  rationale: இந்தச் சூழலில் கட்டளையிடப்பட்ட அழிவை நிறைவேற்றாமல் உயிரோடு அல்லது அப்படியே விட்டுவைத்த செயலைக் குறிக்கிறது; வெறும் உள்ளுணர்வான இரக்கமாக மட்டும் மொழிபெயர்ப்பதைத் தவிர்க்கிறது.
- source_word: עַל אֲגָג
  choice: ஆகாகை
  rationale: எபிரெய தனிப்பெயரைத் தமிழில் இயல்பாக ஒலிபெயர்த்து, வேற்றுமை உருபுடன் வழங்குகிறது.
- source_word: מֵיטַב הַצֹּאן וְהַבָּקָר
  choice: ஆடுமாடுகளில் சிறந்தவற்றை
  rationale: מֵיטַב என்பதன் ‘மிகச் சிறந்த பகுதி’ என்ற மதிப்பீட்டுப் பொருளையும், ஆடுகளும் மாடுகளும் என்ற இரு கால்நடை வகைகளையும் இயல்பான தமிழில் தருகிறது.
- source_word: הַמִּשְׁנִים
  choice: கொழுத்த விலங்குகளை
  rationale: இந்த அரிய எபிரெயச் சொல்லின் துல்லியப் பொருள் உறுதியற்றது. கால்நடைப் பட்டியலின் சூழலில் ஏற்ற பாரம்பரியப் புரிதலை முதன்மை உரையில் வழங்கி, நிச்சயமின்மையையும் மாற்றுப் பொருளையும் அடிக்குறிப்பில் பாதுகாக்கிறது.
- source_word: הַכָּרִים
  choice: செம்மறியாட்டுக் கடாக்களை
  rationale: இந்தச் சூழலில் ஆண் செம்மறியாடுகளைக் குறிக்கும் பொருளைத் துல்லியமாகவும் பொதுவாசகருக்குப் புரியுமாறும் தருகிறது.
- source_word: כָּל הַטּוֹב
  choice: நல்லவை அனைத்தையும்
  rationale: பட்டியலிடப்பட்ட கால்நடைகளைத் தாண்டி விரும்பத்தக்கவை அனைத்தையும் உள்ளடக்கும் பரந்த தர மதிப்பீட்டைப் பாதுகாக்கிறது.
- source_word: לֹא אָבוּ
  choice: அவர்கள் விரும்பவில்லை
  rationale: இயலாமையை அல்ல, மனவிருப்பமின்மையையும் திட்டமிட்ட மறுப்பையும் குறிக்கும் வினையின் கருத்தைப் பாதுகாக்கிறது.
- source_word: הַחֲרִימָם / הֶחֱרִימוּ
  choice: அழிவுக்கென்று ஒதுக்கிவிட / அழிவுக்கென்று ஒதுக்கினார்கள்
  rationale: חרם என்பதிலுள்ள அழிப்பதற்காகத் தனியே ஒதுக்கும் தொழில்நுட்பக் கருத்தை வெறும் ‘அழித்தல்’ என்று தட்டையாக்காமல் தருகிறது.
- source_word: כָל־הַמְּלָאכָה נְמִבְזָה וְנָמֵס
  choice: மதிப்பற்றதும் பயனற்றதுமான அனைத்தையும்
  rationale: இங்கு מְלָאכָה என்பது ‘வேலை’ அல்ல, பொருட்கள் அல்லது உடைமைகளைத் தொகுப்பாகக் குறிக்கிறது; தொடரும் சொற்கள் அவை இகழப்பட்டு தகுதியற்றவையாகக் கருதப்பட்டதைச் சொல்கின்றன.
theological_decisions:
- issue: போர்ச் சூழலில் חרם என்பதன் மொழிபெயர்ப்பு
  choice: அழிவுக்கென்று ஒதுக்குதல்
  alternative: முற்றிலும் அழித்தல்; அழிவுத் தடையின் கீழ் வைத்தல்
  rationale: சவுல் மீறியது சாதாரணமாகக் கொல்லும் கட்டளையை மட்டுமல்ல; அழிப்பதற்கென ஒதுக்கப்பட்டதை நிறைவேற்ற வேண்டிய கட்டளையாகும். தேர்ந்த சொற்றொடர் அதன் தொழில்நுட்ப வலிமையையும் கடுமையையும் மறைக்காமல் இயல்பான தமிழில் தருகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகருக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. கால்நடைப் பட்டியல் இயல்பாகச் சுருக்கப்பட்டாலும் மூலத்தின் கூறுகள் பாதுகாக்கப்பட்டுள்ளன; அரிய சொல்லின் உண்மையான நிச்சயமின்மை அடிக்குறிப்பில் வெளிப்படையாக வைக்கப்பட்டுள்ளது.
