base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/025.yaml
  text: Now please forgive my sin[a], and return with me[b], so that I may bow down to Yahweh.
translation:
  language: ta
  text: இப்போது, தயவுசெய்து என் பாவத்தை மன்னித்து, நான் யாவேக்கு முன்பாகப் பணிந்து வணங்கும்படி என்னோடு திரும்பி வாரும்.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொல்லுக்குச் சொல், “என் பாவத்தை எடுத்துக்கொள்ளும்”; இது “என் பாவத்தை மன்னியும்” என்று பொருள்படும் மரபுத்தொடர்.
    reason: lexical_alternative
  - marker: b
    text: “நான் யாவேவை வழிபடும்படி” என்றும் மொழிபெயர்க்கலாம். எபிரெய வினை உடலைத் தாழ்த்திப் பணிவதைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: இப்போது
  rationale: சாமுவேலின் கண்டிப்புக்குப் பதிலாக சவுல் முன்வைக்கும் உடனடியான வேண்டுகோளை இயல்பான நவீன தமிழில் அறிமுகப்படுத்துகிறது.
- source_word: שָׂא נָא
  choice: தயவுசெய்து ... மன்னித்து
  rationale: נָשָׂא என்பதன் அடிப்படைப் பொருள் ‘தூக்கு/சுமந்து அகற்று’; ஆனால் חַטָּאת உடன் இது பாவத்தை மன்னித்தல் என்ற மரபுத்தொடர் பொருளைக் கொடுக்கிறது. נָא குறிக்கும் பணிவான வேண்டுகோளை ‘தயவுசெய்து’ வெளிப்படுத்துகிறது.
- source_word: אֶת חַטָּאתִי
  choice: என் பாவத்தை
  rationale: சூழலில் சவுல் ஒப்புக்கொள்ளும் தனிப்பட்ட பாவத்தையே குறிக்கிறது; ‘குற்றம்’ என்பதைவிட ‘பாவம்’ மூலச்சொல்லின் சமய மற்றும் நெறிப் பரிமாணத்தைத் தெளிவாகக் காக்கிறது.
- source_word: וְשׁוּב עִמִּי
  choice: என்னோடு திரும்பி வாரும்
  rationale: שׁוּב என்பதன் ‘திரும்பு’ என்ற பொருளையும், சாமுவேல் தன்னுடன் வரவேண்டும் என்ற சவுலின் கோரிக்கையையும் காக்கிறது. மரியாதை ஒருமை வினைமுற்று உரையாடலுக்கு ஏற்றது.
- source_word: וְאֶשְׁתַּחֲוֶה
  choice: அப்போது நான் ... பணிந்துகொள்வேன்
  rationale: வினை உடலைத் தாழ்த்தி வணங்குவதைக் குறிக்கிறது. ‘பணிந்துகொள்வேன்’ உடல் செயலும் வழிபாட்டு நோக்கமும் இரண்டையும் இயல்பான தமிழில் தாங்குகிறது; கட்டளைத் தொடருக்குப் பிந்தைய வாவ் இங்கு எதிர்பார்க்கப்படும் விளைவு அல்லது நோக்காகப் புரிந்துகொள்ளப்படலாம்.
- source_word: לַיהוָה
  choice: யெகோவாவைப்
  rationale: மூலத்தில் உள்ள தனிப்பெயரான יהוה-ஐ பொதுப்பட்டமான ‘கர்த்தர்’ என்று மாற்றாமல் தமிழில் நிலைபெற்ற ‘யெகோவா’ வடிவில் தருகிறது; -ל குறிக்கும் இலக்கைத் தமிழ் இரண்டாம் வேற்றுமை இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யெகோவா
  alternative: கர்த்தர் / யாவே
  rationale: மூல உரை உடன்படிக்கைத் தனிப்பெயரை நேரடியாகப் பயன்படுத்துவதால் அதை ஒரு பட்டமாக மாற்றாமல் தனிப்பெயராகவே வழங்குகிறது. ‘யெகோவா’ தமிழ்க் கிறிஸ்தவ வாசகர்களிடையே பரவலாக அறியப்படும் வடிவம்.
- issue: וְאֶשְׁתַּחֲוֶה-இன் நோக்கம் அல்லது விளைவு நுணுக்கம்
  choice: அப்போது நான் ... பணிந்துகொள்வேன்
  alternative: நான் ... பணிந்துகொள்வதற்காக
  rationale: எபிரெய வாவ் இங்கு கட்டளைத் தொடரின் எதிர்பார்க்கப்படும் தொடர்ச்சி, நோக்கம், அல்லது விளைவைச் சுட்டலாம். முதன்மை உரை இயல்பான தமிழில் தொடர்ச்சியைத் தருகிறது; அடிக்குறிப்பு வழிபாட்டு அர்த்தத்தை விளக்குகிறது, ஆனால் காரணவியல் நுணுக்கத்தை மிகத் தீர்மானமாக்கவில்லை.
translation_notes:
  register: நவீன தரநிலைத் தமிழில், மரியாதையும் எளிய புரிதலும் இணையும் நடையைப் பயன்படுத்துகிறது. சாமுவேலை நோக்கிய வேண்டுகோளில் மரியாதை ஒருமை வடிவம் காக்கப்பட்டுள்ளது; அரிதான இலக்கியச் சொற்கள் தவிர்க்கப்பட்டுள்ளன.
