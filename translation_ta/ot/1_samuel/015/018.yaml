  text: וַ/יִּשְׁלָחֲ/ךָ֥ יְהוָ֖ה בְּ/דָ֑רֶךְ וַ/יֹּ֗אמֶר לֵ֣ךְ וְ/הַחֲרַמְתָּ֞ה אֶת הַֽ/חַטָּאִים֙ אֶת עֲמָלֵ֔ק וְ/נִלְחַמְתָּ֣ ב֔/וֹ עַ֥ד כַּלּוֹתָ֖/ם אֹתָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/018.yaml
  text: And Yahweh sent you on a mission and said[a], ‘Go and devote the sinners, the Amalekites, to destruction[b], and fight against them until they are consumed.’
translation:
  language: ta
  text: யாவே உன்னை ஒரு பணிக்காக அனுப்பி, “நீ போய், பாவிகளான அமலேக்கியர்களை[b] அழிவுக்காக ஒதுக்கிவிடு[a]; அவர்களோடு போரிட்டு, அவர்களை அழித்துமுடிக்கும் வரை போரிடு” என்று சொன்னார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “முற்றிலும் அழி.” எபிரெய வினை, ஒன்றை அழிவுக்காக ஒதுக்குவதைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில், “பாவிகளை, அமலேக்கை.” இங்கு “அமலேக்கு” என்பது “பாவிகள்” யார் என்பதை அடையாளப்படுத்தும் இணைப்பெயராக வருகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלָחֲךָ
  choice: உன்னை ... அனுப்பி
  rationale: שלח என்பதன் நேரடியான பொருள் ‘அனுப்பு’; இங்கு சவுலுக்குக் கொடுக்கப்பட்ட கட்டளையையும் பணியமர்த்துதலையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: בְּדָרֶךְ
  choice: ஒரு பணிக்காக
  rationale: דרך என்பதற்கு அடிப்படையில் ‘வழி’ என்று பொருள் இருந்தாலும், ‘அனுப்பு’ என்பதுடன் வரும் இச்சூழலில் அது ஒப்படைக்கப்பட்ட பணி அல்லது நடவடிக்கையைக் குறிக்கிறது.
- source_word: לֵךְ
  choice: நீ போய்
  rationale: הלך வினையின் கட்டளை வடிவத்தைத் தமிழில் நேரடியாகவும் இயல்பாகவும் தருகிறது.
- source_word: וְהַחֲרַמְתָּה
  choice: அழிவுக்கென்று அர்ப்பணி
  rationale: חרם இங்கு ஒருவரையோ ஒன்றையோ தடை ஆணையின் கீழ் அழிவுக்கு ஒதுக்குவதைக் குறிக்கும் தொழில்நுட்பச் சொல். ‘முற்றிலும் அழி’ என்பது விளைவைக் கூறினாலும், அர்ப்பணிப்பு/ஒதுக்கீடு என்ற மூலச்சொல்லின் நுட்பத்தை இழக்கிறது.
- source_word: הַחַטָּאִים אֶת עֲמָלֵק
  choice: பாவிகளான அமலேக்கியர்களை
  rationale: ‘பாவிகள்’ என்ற ஒழுக்க மதிப்பீட்டைத் தக்கவைத்து, ‘அமலேக்கு’ எனும் கூட்டு மக்கள்பெயரை நவீனத் தமிழில் புரியக்கூடிய ‘அமலேக்கியர்கள்’ என்று வழங்குகிறது.
- source_word: וְנִלְחַמְתָּ בוֹ
  choice: அவர்களோடு போரிடு
  rationale: எபிரெயத்தில் ஒருமை பின்னொட்டு வந்தாலும் அது ‘அமலேக்கு’ என்ற கூட்டு மக்களைக் குறிக்கிறது; தமிழில் பன்மைக் குறிப்பு இயல்பானது.
- source_word: עַד כַּלּוֹתָם אֹתָם
  choice: அவர்கள் அழிந்தொழியும்வரை
  rationale: כלה இங்கு முழுமையாக முடிவுக்கு வருதல் அல்லது ஒழிந்துபோதலைக் குறிக்கிறது. தமிழாக்கம் முழுமையான அழிவைத் தெளிவாகச் சொல்கிறது; எபிரெயச் சொற்றொடரின் சுருக்கமான அமைப்பை தேவையின்றி விரிவாக்கவில்லை.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் நான்கு எழுத்துகளைக் கொண்ட தனிப்பட்ட இறைப்பெயர் நேரடியாக உள்ளது. அதை பொதுப் பட்டப்பெயராக மாற்றாமல், தமிழில் பரவலாக அறியப்படும் ஒலிபெயர்ப்பான ‘யாவே’ என்று வழங்குகிறது.
- issue: חרם என்ற சொல்லில் அர்ப்பணிப்பும் அழிவும் இணைந்திருத்தல்
  choice: அழிவுக்கென்று அர்ப்பணி
  alternative: முற்றிலும் அழி
  rationale: இச்சொல் வெறும் கொலை அல்லது அழிப்பை மட்டுமல்லாமல், தடை ஆணையின் கீழ் அழிவுக்காக ஒதுக்கப்படுதலையும் குறிக்கிறது. எனவே அதன் கடினமான இறையியல் பதற்றத்தை மென்மைப்படுத்தாமல் இரு கூறுகளையும் வைத்திருக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் வேதவசனத்துக்குரிய கண்ணியத்துடனும் வடிவமைக்கப்பட்டது. ‘அழிவுக்கென்று அர்ப்பணி’ என்ற சற்றே அசாதாரணமான சொற்றொடர் חרם என்பதன் தொழில்நுட்பப் பொருளையும் இறையியல் பதற்றத்தையும் காக்க நோக்கமுடன் பயன்படுத்தப்பட்டது. எல்லா அடிக்குறிப்பு குறிகளும் உரையில் இடம்பெற்றுள்ளன.
