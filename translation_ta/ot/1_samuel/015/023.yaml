  alternative: கலகமே குறிசொல்லும் பாவம்; பிடிவாதமே அக்கிரமமும் தெராபீமுமாகும்
  rationale: எபிரெயத்தில் வெளிப்படையான ‘போன்றது’ இல்லை என்றாலும், இணையான கவிதை அமைப்பு இரு பகுதிகளிலும் ஒப்புமைப் பொருளை வலுவாக ஆதரிக்கிறது; சமத்துவத்தைத் தேவையின்றி கடுமையாக்காமல் சாமுவேலின் கண்டன வலிமையைப் பாதுகாக்கிறது.
- issue: מִמֶּלֶךְ என்பதன் தீர்ப்புப் பொருள்
  choice: அரசனாக இருப்பதிலிருந்து புறக்கணித்தல்
  alternative: அரசனாக உன்னைப் புறக்கணித்தல்
  rationale: מן முன்னொட்டு அரச நிலையை இழக்கச் செய்வதைக் குறிக்கக்கூடும்; மாற்று வாசிப்பும் சாத்தியமாதலால் அடிக்குறிப்பில் தரப்படுகிறது.
