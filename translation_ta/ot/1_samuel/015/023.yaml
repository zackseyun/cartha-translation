- from: கலகம் செய்வது குறிசொல்லும் பாவத்தைப் போன்றது[a]; பிடிவாதம் செய்வது அக்கிரமத்தையும் வீட்டுத் தெய்வச் சிலைகளையும் போன்றது[b]. நீ யெகோவாவின் வார்த்தையைப் புறக்கணித்ததால், அவரும் உன்னை அரசனாக இருப்பதிலிருந்து புறக்கணித்துவிட்டார்[c].
