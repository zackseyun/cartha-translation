  register: நவீன நிலையான தமிழில், உரையின் கண்டனத் தொனியையும் கவிதை இணைநிலையையும் காக்கும் கண்ணியமான நடை. ‘போன்றது’ இரு அரையடிகளிலும் வெளிப்படுத்தப்பட்டு பொருள் தெளிவாக்கப்பட்டுள்ளது; மָאַס வினையின் மறுபடி ‘புறக்கணித்தல்’ மூலம் பாதுகாக்கப்பட்டுள்ளது.
