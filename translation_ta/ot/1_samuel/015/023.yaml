- source_word: כִּי
  choice: ஏனெனில் என்ற தொடர்பை வெளிப்படுத்தும் வகையில் முதல் கூற்று காரணவிளக்கமாக அமைக்கப்பட்டது
  rationale: முந்தைய கண்டிப்புக்கான காரணத்தை அறிமுகப்படுத்துகிறது; தமிழில் தனியே ‘ஏனெனில்’ சேர்ப்பதைவிட பழமொழித் தன்மையுள்ள காரணவிளக்கம் இயல்பாக உள்ளது.
- source_word: חַטַּאת קֶסֶם
  choice: குறிசொல்லும் பாவம்
  rationale: קֶסֶם என்பது தடைசெய்யப்பட்ட வழிகளில் மறைவான அறிவை நாடும் குறிகேட்டல் அல்லது குறிசொல்லுதலைக் குறிக்கிறது; ‘சூனியம்’ என்பதைக் காட்டிலும் இதன் பரந்த பொருளை இது காக்கிறது.
- source_word: מֶרִי
  choice: கலகம் செய்வது
  rationale: அதிகாரத்துக்கு எதிராகக் கீழ்ப்படிய மறுக்கும் செயலைக் குறிக்கிறது; சவுலின் கீழ்ப்படியாமைக்கு ஏற்ற தெளிவான நவீனத் தமிழ்.
- source_word: וְאָוֶן
  choice: அக்கிரமம்
  rationale: இச்சூழலில் வெறும் துன்பம் அல்லது பயனின்மை அல்ல, ஒழுக்கத் தீமை என்ற வலிமையைத் தருகிறது.
- source_word: וּתְרָפִים
  choice: வீட்டுத் தெய்வச் சிலைகள்
  rationale: தெராபீம் என்பது குடும்ப அல்லது வீட்டு வழிபாட்டில் பயன்படுத்தப்பட்ட சிலைகள்; வாசகருக்கு பொருள் நேரடியாகப் புரியுமாறு மொழிபெயர்க்கப்பட்டது.
- source_word: הַפְצַר
  choice: பிடிவாதம் செய்வது
  rationale: விட்டுக்கொடுக்காமல் வற்புறுத்தும், தன்னிச்சையான மனப்பாங்கை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: יַעַן
  choice: …தால்
  rationale: தீர்ப்புக்கான வெளிப்படையான காரணத்தைத் தமிழில் இயல்பான காரண விகுதியால் குறிக்கிறது.
- source_word: מָאַסְתָּ אֶת דְּבַר יְהוָה
  choice: நீ யெகோவாவின் வார்த்தையைப் புறக்கணித்ததால்
  rationale: מָאַס என்பதன் நிராகரித்தல் அல்லது மதியாமை என்ற பொருளை ‘புறக்கணித்தல்’ வெளிப்படுத்துகிறது; அடுத்த அரையடியிலும் அதே வினைச்சொல் மீண்டும் வருவதைப் பாதுகாக்கிறது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: திருப்பெயரை ஒரு பொதுப்பட்டமாக மாற்றாமல் பெயராகவே வழங்குகிறது; நவீனத் தமிழில் பரவலாக அறியப்படும் வடிவம்.
- source_word: וַיִּמְאָסְךָ מִמֶּלֶךְ
  choice: அவரும் உன்னை அரசனாக இருப்பதிலிருந்து புறக்கணித்துவிட்டார்
  rationale: முந்தைய מָאַס வினையின் மறுபடியையும் מן கூறும் அரசாட்சியிலிருந்து நீக்கப்படுதல் என்ற நுணுக்கத்தையும் காக்கிறது.
theological_decisions:
