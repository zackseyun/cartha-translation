base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/023.yaml
  text: For rebellion is like the sin of divination[a], and stubbornness is like wickedness and household idols. Because you have rejected the word of Yahweh[c][b], he has also rejected you from being king.
translation:
  language: ta
  text: கலகம் குறிகேட்டலின் பாவத்தைப் போன்றது[a]; பிடிவாதம் அக்கிரமத்தையும் வீட்டுத் தெய்வச் சிலைகளையும் போன்றது[b]. நீ யாவேயின் வார்த்தையை நிராகரித்ததால், அவரும் உன்னை அரசனாக இருக்காதபடி நிராகரித்தார்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘சூனியத்தின் பாவத்தைப் போன்றது.’ எபிரெயச் சொல் தடைசெய்யப்பட்ட வழிகளில் மறைவான அறிவைத் தேடும் குறிகேட்டலைப் பொதுவாகக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில் ‘தெராபீம்’; இவை வீட்டு அல்லது குடும்ப வழிபாட்டில் பயன்படுத்தப்பட்ட தெய்வச் சிலைகள்.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, ‘அரசனாக உன்னை நிராகரித்தார்.’
    reason: alternative_reading
