base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/006.yaml
  text: Then Saul said to the Kenite[a], “Go, turn aside, go down from among the Amalekites, lest I sweep you away with them[c][b]. For you showed kindness to all the sons of Israel when they came up from Egypt.” So the Kenite turned aside from among the Amalekites.
translation:
  language: ta
  text: அப்போது சவுல் கேனியரிடம்[a], “நீங்கள் புறப்பட்டு, அமலேக்கியரின் நடுவிலிருந்து விலகிக் கீழே செல்லுங்கள்; இல்லையென்றால் அவர்களோடு உங்களையும் சேர்த்து அகற்றிவிடுவேன்[b]. ஏனெனில், இஸ்ரவேல் மக்கள் எல்லாரும் எகிப்திலிருந்து மேலே வந்தபோது நீங்கள் அவர்களுக்கு நன்மை செய்தீர்கள்[c]” என்றான். எனவே கேனியர் அமலேக்கியரின் நடுவிலிருந்து விலகிச் சென்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் ‘கேனியன்’ என்று ஒருமையில் இருந்தாலும், அது கேனிய மக்களைக் கூட்டாகக் குறிக்கிறது; தொடர்ந்து வரும் கட்டளைகள் பன்மையில் உள்ளன.
    reason: lexical_alternative
  - marker: b
    text: 'அல்லது: ‘அவர்களோடு உங்களையும் வாரிக்கொண்டு போய்விடுவேன்.’ இங்குள்ள எபிரெய வினை, தீர்ப்பில் மற்றவர்களோடு சேர்த்து அகற்றப்படுதல் அல்லது அழிக்கப்படுதல் என்ற பொருளைக் கொள்ளலாம்.'
    reason: lexical_alternative
  - marker: c
    text: ‘நன்மை’ என்பதற்கான எபிரெயச் சொல் (חֶסֶד, கெசெத்) ‘தயவு’, ‘பற்றுறுதி’, ‘மாறாத அன்பு’ ஆகிய நிழற்பொருள்களையும் கொண்டது.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַקֵּינִי / קֵינִי
  choice: கேனியர்
  rationale: எபிரெயத்தில் ஒருமை இனப்பெயர் கூட்டுப் பொருளில் வருகிறது. தமிழில் அந்த மக்கள்குழுவைக் குறிக்க மரியாதைப் பன்மை வடிவமான ‘கேனியர்’ இயல்பாக உள்ளது.
- source_word: לְכוּ סֻּרוּ רְדוּ
  choice: புறப்பட்டு, விலகிக் கீழே செல்லுங்கள்
  rationale: மூன்று கட்டளைகளின் இயக்கத் தொடரையும், ירד என்பதிலுள்ள ‘கீழே செல்’ என்ற திசைநுட்பத்தையும் காக்கிறது.
- source_word: מִתּוֹךְ עֲמָלֵקִי / מִתּוֹךְ עֲמָלֵק
  choice: அமலேக்கியரின் நடுவிலிருந்து
  rationale: மக்கள்குழுவின் மத்தியிலிருந்து பிரிந்து செல்லும் பொருளைத் தெளிவாகவும் இரு இடங்களிலும் ஒரேவிதமாகவும் தருகிறது.
- source_word: פֶּן אֹסִפְךָ עִמּוֹ
  choice: இல்லையென்றால் அவர்களோடு உங்களையும் அழித்துவிடுவேன்
  rationale: நியாயத்தீர்ப்புச் சூழலில் אסף என்பது சேர்த்துக்கொள்வதைவிட அகற்றுதல் அல்லது அழிவில் உட்படுத்துதல் என்ற பொருளைக் கொண்டிருக்கிறது; தமிழ் வாக்கியம் எச்சரிக்கையின் நோக்கத்தை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: חֶסֶד
  choice: இரக்கம் காட்டினீர்கள்
  rationale: இச்சூழலில் இஸ்ரவேலருக்கு முன்பு செய்த நன்மைமிக்க, உண்மையுள்ள உதவியை இயல்பான தமிழில் குறிக்கிறது; முறையான உடன்படிக்கை உறவைத் தேவையின்றி முன்வைப்பதைத் தவிர்க்கிறது.
- source_word: כָּל בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்கள் எல்லாரும்
  rationale: இது முழு நாட்டுமக்களையும் குறிக்கும் வழக்கமான தேசியப் பதம். சொற்படியான ‘இஸ்ரவேலின் மகன்கள்’ என்பதைக் காட்டிலும் நவீன தமிழில் பொருளைத் தெளிவாகத் தருகிறது.
- source_word: בַּעֲלוֹתָם מִמִּצְרָיִם
  choice: எகிப்திலிருந்து மேலே வந்தபோது
  rationale: யாத்திராகமச் சூழலில் עלה கொண்டுள்ள மேலேறும் இயக்க மொழியைப் பாதுகாக்கிறது.
- source_word: וַיָּסַר
  choice: விலகிச் சென்றார்கள்
  rationale: முன்னர் வந்த סור என்ற கட்டளையோடு சொல்லிணைப்பைப் பேணுவதுடன், கேனியர் கட்டளைக்குக் கீழ்ப்படிந்ததை இயல்பான தமிழில் காட்டுகிறது.
theological_decisions:
- issue: חֶסֶד என்பதன் பொருள்
  choice: இரக்கம் காட்டினீர்கள்
  alternative: உடன்படிக்கைப் பற்றுறுதி காட்டினீர்கள் / அன்புள்ள நன்மை செய்தீர்கள்
  rationale: கேனியர் இஸ்ரவேலரிடம் காட்டிய வரலாற்றுச் செயலைக் குறிக்கும் இவ்விடத்தில், எபிரெயச் சொல் இரக்கம், நன்மை, விசுவாசமுள்ள பற்றுறுதி ஆகிய நிழற்பொருள்களைத் தாங்குகிறது. ‘இரக்கம்’ இயல்பானது; முறையான உடன்படிக்கை நிலையை உறுதிப்படுத்தாமல் அந்த நன்மைமிக்க மனப்பான்மையை வெளிப்படுத்துகிறது.
- issue: בְּנֵי יִשְׂרָאֵל என்ற தேசியச் சொற்றொடர்
  choice: இஸ்ரவேல் மக்கள்
  alternative: இஸ்ரவேலின் மகன்கள்
  rationale: இங்கு ஆண்களை மட்டும் அல்லாமல் இஸ்ரவேல் சமூகத்தையே குறிக்கும் மரபுவழி தேசியப் பயன்பாடு உள்ளது. தமிழில் ‘மக்கள்’ என்பதே அதன் குறிப்பு வரம்பைத் துல்லியமாகவும் இயல்பாகவும் தருகிறது.
- issue: கேனியைக் குறிக்கும் எபிரெய ஒருமை இனப்பெயர்
  choice: கேனியர் என்ற கூட்டுப் பொருள்
  alternative: கேனியன் என்ற பிரதிநிதி ஒருமை
  rationale: கட்டளைகள் எபிரெயத்தில் பன்மையில் இருப்பதால் சவுல் ஒரு மக்கள்குழுவை நோக்கிப் பேசுகிறார். தமிழ் கூட்டுப் பயன்பாடு இலக்கணத் தொடர்பையும் வரலாற்றுச் சூழலையும் தெளிவாக்குகிறது.
translation_notes:
  register: நவீன தரமான, கண்ணியமான தமிழ். வரலாற்றுக் கதையாடலுக்கேற்ற ‘என்றான்’ பயன்படுத்தப்பட்டுள்ளது. எபிரெய இயக்கச் சொற்களின் தொடரும் ‘மேலே வந்தார்கள்’ என்ற நிலவியல் மொழியும் பாதுகாக்கப்பட்டுள்ளன; குழுவைக் குறிக்கும் இடங்களில் தமிழ் மரியாதை/கூட்டுப் பன்மை இயல்பாகப் பயன்படுத்தப்பட்டுள்ளது.
