base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/001.yaml
  text: Then Samuel said to Saul[a], “Yahweh sent me to anoint you as king over his people, over Israel. So now, listen to the words of Yahweh.”
translation:
  language: ta
  text: பின்பு சாமுவேல் சவுலிடம், “யாவே தம் மக்களின்மேல், இஸ்ரவேலின்மேல், உன்னை அரசனாக அபிஷேகம் செய்ய என்னை அனுப்பினார். ஆகவே, இப்போது யாவேயின் வார்த்தைகளுக்குச் செவிகொடு[a]” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மொழியில், “யாவேயின் வார்த்தைகளின் குரலுக்குச் செவிகொடு” என்று இன்னும் சொல்லர்த்தமாக உள்ளது. இத்தொடர் வெறுமனே கேட்பதை மட்டுமல்ல, கேட்டுக் கீழ்ப்படிவதையும் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: பின்பு ... என்றார்
  rationale: வாவ் தொடர்வினை கதையின் அடுத்த நிகழ்வை முன்னெடுக்கிறது; நவீன தமிழில் இயல்பான கதைத் தொடர்ச்சியை ‘பின்பு’ காட்டுகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இது எபிரெய வேதநூலில் வரும் இறைத் திருப்பெயரான יהוה-ஐ ஒரு பட்டப்பெயராக மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: לִמְשָׁחֳךָ
  choice: உன்னை ... திருப்பொழிவு செய்ய
  rationale: משׁח அரச பதவிக்காக எண்ணெய் பொழிந்து நியமிப்பதைக் குறிக்கிறது; ‘திருப்பொழிவு’ அந்தச் சடங்கு மற்றும் பதவி நியமனம் ஆகிய இரண்டையும் காக்கிறது.
- source_word: לְמֶלֶךְ
  choice: அரசனாக
  rationale: லாமேத் இங்கு நியமிக்கப்படும் பங்கு அல்லது விளைவைக் குறிக்கிறது; தமிழில் ‘அரசனாக’ இயல்பானது.
- source_word: עַל עַמּוֹ עַל יִשְׂרָאֵל
  choice: தம் மக்களின்மேல், இஸ்ரவேலின்மேல்
  rationale: மூலத்தில் עַל இருமுறை வருவதையும், ‘அவருடைய மக்கள்’ என்பவர்கள் இஸ்ரவேல் எனத் தெளிவுபடுத்தும் இணை அமைப்பையும் காக்கிறது.
- source_word: שְׁמַע לְקוֹל דִּבְרֵי יְהוָה
  choice: யாவேயின் வார்த்தைகளுக்குச் செவிகொடு
  rationale: ‘வார்த்தைகளின் குரல்’ என்ற எபிரெய மரபுத்தொடரை இயல்பான தமிழாக்கமாக வழங்குகிறது; ‘செவிகொடு’ கேட்பதோடு கவனித்து ஏற்றுக்கொள்வதையும் உணர்த்துகிறது. சொல்லர்த்த வடிவம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
theological_decisions:
- issue: יהוה என்ற இறைத் திருப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: ஆண்டவர் / யெகோவா
  rationale: மூல உரை இறைவனின் தனிப்பெயரை நேரடியாகப் பயன்படுத்துவதால், அதை ஒரு பட்டப்பெயரால் மாற்றாமல் எபிரெய உச்சரிப்புக்கு அண்மையான தமிழ் ஒலிபெயர்ப்பாக வழங்குகிறது.
- issue: ‘கேள்’ என்ற கட்டளையில் உள்ள கீழ்ப்படிதல் நிழற்பொருள்
  choice: வார்த்தைகளுக்குச் செவிகொடு
  alternative: வார்த்தைகளைக் கேள் / வார்த்தைகளின் குரலுக்குச் செவிகொடு
  rationale: שׁמע இச்சூழலில் ஒலியைக் கேட்பதைத் தாண்டி கவனித்துக் கீழ்ப்படிதலை உள்ளடக்கலாம். முதன்மை உரை அதை இயல்பாகக் காக்கிறது; எபிரெயின் அபூர்வமான முழு வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன செந்தமிழுக்கு அண்மையான, ஆனால் பொதுவாசகர்களுக்கு எளிதில் புரியும் மரியாதைமிக்க நடை பயன்படுத்தப்பட்டுள்ளது. ‘தம்’ இறைவனைக் குறிக்கும் மரியாதைப் பன்மையை இயல்பாக வெளிப்படுத்துகிறது. மூலத்தின் மீளுரைத்தலை ‘தம் மக்களின்மேல், இஸ்ரவேலின்மேல்’ என்று திட்டமிட்டு காத்துள்ளோம்.
