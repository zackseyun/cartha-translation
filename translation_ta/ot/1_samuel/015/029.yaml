id: 1SA.15.29
reference: 1 Samuel 15:29
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וְ/גַם֙ נֵ֣צַח יִשְׂרָאֵ֔ל לֹ֥א יְשַׁקֵּ֖ר וְ/לֹ֣א יִנָּחֵ֑ם כִּ֣י לֹ֥א אָדָ֛ם ה֖וּא לְ/הִנָּחֵֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/029.yaml
  text: Moreover[a], the Glory of Israel will not lie, nor will he relent, for he is not a man[b], that he should relent.
translation:
  language: ta
  text: மேலும், இஸ்ரவேலின் மகிமை[a] பொய் சொல்லமாட்டார்; மனம் மாறமாட்டார்[b]. ஏனெனில், மனம் மாறுகிற மனிதர் அவர் அல்ல.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இஸ்ரவேலின் நித்தியமானவர்,” “இஸ்ரவேலின் வலிமை,” அல்லது “இஸ்ரவேலின் வெற்றி.” எபிரேயப் பட்டச்சொல்லுக்குப் பரந்த பொருள் வரம்பு உண்டு.
    reason: lexical_alternative
  - marker: b
    text: “மனம் மாறுதல்” என்பதற்கு, “வருந்துதல்” அல்லது “தமது முடிவிலிருந்து பின்வாங்குதல்” என்றும் பொருள் கொள்ளலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: மேலும்
  rationale: முந்தைய கண்டனத்துடன் இணைந்து இன்னொரு வலியுறுத்தப்பட்ட கூற்றைச் சேர்ப்பதை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: נֵצַח יִשְׂרָאֵל
  choice: இஸ்ரவேலின் மகிமையானவர்
  rationale: נֵצַח என்பதன் மகிமை, நிலைத்த தன்மை, வலிமை, வெற்றி ஆகிய பரந்த பொருள் வரம்பை முழுவதும் சுருக்காமல், உயர்வான இறைப்பட்டமாக இயல்பாக வழங்குகிறது; பிற சாத்தியங்கள் அடிக்குறிப்பில் பாதுகாக்கப்படுகின்றன.
- source_word: יְשַׁקֵּר
  choice: பொய் சொல்லமாட்டார்
  rationale: שקר என்பதன் பியேல் வடிவத்துக்குரிய நேரடியான பொருளைத் தருவதுடன், மனித நம்பகமின்மைக்கு எதிரான கருத்தையும் தெளிவாகக் காட்டுகிறது.
- source_word: וְלֹא יִנָּחֵם
  choice: மனம் மாறவும் மாட்டார்
  rationale: נחם என்பதன் நிஃபால் வடிவம் மனம் மாறுதல், வருந்துதல், முடிவிலிருந்து பின்வாங்குதல் ஆகியவற்றைக் குறிக்கலாம். சவுலைப் பற்றிய தீர்ப்பின் சூழலில் ‘மனம் மாறுதல்’ இயல்பானதும், மூலத்தின் பொருள் நெகிழ்வை ஓரளவு தக்கவைப்பதும் ஆகும்.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய கூற்றிற்கான காரணத்தைத் தெளிவாகவும் இயல்பாகவும் அறிமுகப்படுத்துகிறது.
- source_word: לֹא אָדָם הוּא
  choice: அவர் மனிதர் அல்ல
  rationale: இங்கு אָדָם என்பது ஓர் ஆண் நபரை மட்டும் அல்லாமல் பொதுவாக மனித இயல்பைக் குறிக்கிறது; ஆகவே ‘மனிதர்’ என்பது பாலினத்தை தேவையின்றி முன்னிறுத்தாமல் ஒப்பீட்டைச் சரியாகத் தருகிறது.
- source_word: לְהִנָּחֵם
  choice: மனம் மாறுவதற்கு
  rationale: முந்தைய יִנָּחֵם உடன் சொற்பொருள் ஒற்றுமையைப் பேணி, மனிதரைப் போல முடிவை மாற்றுபவர் அல்ல என்ற ஒப்பீட்டை நிறைவு செய்கிறது.
theological_decisions:
- issue: இறைவனின் மாறாத தன்மையைச் சூழலைத் தாண்டி மிகைப்படுத்தாமல் மொழிபெயர்த்தல்
  choice: ‘பொய் சொல்லமாட்டார்; மனம் மாறவும் மாட்டார்’ என்று சவுலின் நிராகரிப்பைப் பற்றிய உடனடித் தீர்ப்புச் சூழலில் வழங்குதல்
  alternative: ‘வருந்தமாட்டார்’ அல்லது ‘பின்வாங்கமாட்டார்’
  rationale: இவ்வசனம் சவுலின் அரசாட்சி நிராகரிக்கப்பட்ட தீர்ப்பில் இறைவனின் நம்பகத்தன்மையையும் மாற்றமின்மையையும் வலியுறுத்துகிறது. அதே அதிகாரத்தில் נחם வேறு விதமாகப் பயன்படுத்தப்படுவதால், விரிவான தத்துவ முடிவைச் சேர்க்காமல் உரையின் பதற்றத்தைப் பாதுகாக்கிறது.
- issue: נֵצַח יִשְׂרָאֵל என்ற இறைப்பட்டத்தின் பொருள்
  choice: இஸ்ரவேலின் மகிமையானவர்
  alternative: இஸ்ரவேலின் நித்தியமானவர் / வல்லமையானவர் / வெற்றியானவர்
  rationale: நֵצַח இங்கு விவாதத்திற்குரிய பரந்த பொருள் வரம்பைக் கொண்டுள்ளது. முதன்மை உரையில் உயர்வான ஒரு பொருளைத் தேர்ந்தெடுத்து, மற்ற சாத்தியங்களை அடிக்குறிப்பில் தருவது தெளிவையும் உண்மையான தெளிவின்மையையும் ஒருங்கே பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. இறைப்பட்டத்தின் உயர்வான தன்மைக்காக ‘மகிமையானவர்’ என்றும், אָדָם என்பதன் பொதுமனிதப் பொருளுக்காக ‘மனிதர்’ என்றும் பயன்படுத்தப்பட்டுள்ளது. மூலத்தில் נחם இருமுறை வருவதால் ‘மனம் மாறு’ இருமுறையும் ஒரேபோல் வழங்கப்பட்டுள்ளது.
