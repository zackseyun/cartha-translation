base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/035.yaml
  text: And Samuel did not see Saul again until the day of his death[a], for Samuel mourned over Saul. And Yahweh regretted that he had made Saul king over Israel.
translation:
  language: ta
  text: அதன்பின் சாமுவேல் தன் இறப்பு நாள்வரை சவுலை மீண்டும் பார்க்கவில்லை; ஏனெனில் சாமுவேல் சவுலைப் பற்றித் துக்கம் கொண்டார். சவுலை இஸ்ரவேலின் அரசனாக ஆக்கியதற்காக யாவே மனம் வருந்தினார்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “துயரமடைந்தார்,” “வருந்தினார்,” அல்லது “மனம் மாறினார்” என்றும் மொழிபெயர்க்கலாம். எபிரெய வினை சூழலுக்கேற்ப பல நுண்பொருள்களைக் கொள்ளும்; இங்கு சவுலை அரசனாக்கியதைக் குறித்த யாவேயின் வருத்தத்தை அது வெளிப்படுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָסַף ... לִרְאוֹת
  choice: மீண்டும் பார்க்கவில்லை
  rationale: மறுப்புடன் வரும் יָסַף + வினையெச்ச அமைப்பு, அந்தச் செயலை இனி செய்யவில்லை என்பதைக் குறிக்கிறது. ‘மீண்டும் பார்க்கவில்லை’ என்பது இயல்பான தமிழில் இதைத் தெளிவாகத் தருகிறது.
- source_word: לִרְאוֹת אֶת שָׁאוּל
  choice: சவுலைப் பார்க்க
  rationale: ראה என்பதன் நேரடிப் பொருள் ‘பார்’. சூழலில் இது இனி நேரில் சந்திக்கவில்லை என்பதையும் உணர்த்தினாலும், மூலச்சொல்லின் பரப்பைச் சுருக்காமல் ‘பார்க்க’ என்று மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: עַד יוֹם מוֹתוֹ
  choice: அவன் இறந்த நாள்வரை
  rationale: எபிரெயச் சொற்றொடரின் கால எல்லையையும் solemn tone-ஐயும் இயல்பான நவீனத் தமிழில் காக்கிறது; ‘அவன்’ என்பது அருகிலுள்ள சவுலைக் குறிக்கிறது.
- source_word: הִתְאַבֵּל
  choice: துக்கப்பட்டார்
  rationale: אבל என்பதன் Hitpael வடிவம் ஆழ்ந்த துக்கம் அல்லது புலம்பலைக் குறிக்கிறது. இங்கு சவுலின் நிலையைப் பற்றிய சாமுவேலின் துயரத்தை ‘துக்கப்பட்டார்’ நேரடியாக வெளிப்படுத்துகிறது.
- source_word: אֶל שָׁאוּל
  choice: சவுலைக் குறித்து
  rationale: அடிப்படையில் ‘நோக்கி’ எனப் பொருள்படும் אֶל, துக்கத்தைச் சுட்டும் வினையுடன் இங்கு அந்தத் துக்கத்தின் பொருளைக் குறிக்கிறது. ‘சவுலைக் குறித்து’ என்பது சவுலின் நிலையும் முடிவும் குறித்த துக்கத்தை இயல்பாகத் தருகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: திருநாமத்தை ஒரு பட்டப்பெயராக மாற்றாமல், எபிரெய நான்கெழுத்துத் திருநாமத்தின் பரவலான தமிழ் ஒலிபெயர்ப்பாக ‘யாவே’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: נִחָם
  choice: மனம் வருந்தினார்
  rationale: இந்தச் சூழலில் சவுலை அரசனாக்கியதைக் குறித்த தெய்வீக வருத்தமே முன்னிலைப்படுகிறது. ‘மனம் வருந்தினார்’ அந்த உணர்வுசார் வலிமையையும் உரையின் இறையியல் பதற்றத்தையும் மென்மைப்படுத்தாமல் காக்கிறது.
- source_word: הִמְלִיךְ
  choice: அரசனாக்கியதற்காக
  rationale: מלך என்பதன் Hiphil வடிவம் ஒருவரை அரசனாக்குவதைக் குறிக்கிறது. காரணவாக்கியத்தோடு இணையும் தமிழில் இவ்வடிவம் இயல்பாக உள்ளது.
- source_word: עַל יִשְׂרָאֵל
  choice: இஸ்ரவேலின்மேல்
  rationale: அரச அதிகாரத்தின் ஆளுகைத் தளத்தை עַל குறிக்கிறது. ‘இஸ்ரவேலின்மேல்’ மூலத்தின் அரசாட்சிச் சார்ந்த உறவைப் பாதுகாக்கிறது.
theological_decisions:
- issue: נִחָם என்ற வினை கடவுளுக்குப் பயன்படுத்தப்படுதல்
  choice: மனம் வருந்தினார்
  alternative: மனம் மாறினார் / துயரமடைந்தார்
  rationale: வசனம் யாவேக்கு உண்மையான வருத்த மொழியைப் பயன்படுத்துகிறது. அதை வெறும் நிர்வாக முடிவு மாற்றமாக மென்மைப்படுத்தாமலும், கடவுளின் மாறாத தன்மை பற்றிய ஒரு கோட்பாட்டு தீர்வை மொழிபெயர்ப்புக்குள் புகுத்தாமலும், மூல உரையின் இறையியல் பதற்றம் அப்படியே வைக்கப்பட்டுள்ளது.
