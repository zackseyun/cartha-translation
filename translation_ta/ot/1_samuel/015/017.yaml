base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/017.yaml
  text: And Samuel said[a], “Though you were small in your own eyes, were you not the head of the tribes of Israel? And Yahweh anointed you king over Israel.”
translation:
  language: ta
  text: 'சாமுவேல் சொன்னார்: “உன் பார்வையில் நீ சிறியவனாக இருந்தபோதிலும்[a], இஸ்ரவேலின் கோத்திரங்களுக்குத் தலைவன் நீ அல்லவா? மேலும், யாவே உன்னை இஸ்ரவேலின்மேல் அரசனாக அபிஷேகம் செய்தார்.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உன் பார்வையில் நீ சிறியவனாக இருந்தாலும்.” எபிரெயச் சொற்றொடரைச் சிறிய நுணுக்க வேறுபாட்டுடன் புரிந்துகொள்ளலாம்; சவுல் தன்னை முக்கியமற்றவனாகக் கருதியதை இது நினைவூட்டுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלוֹא
  choice: அல்லவா?
  rationale: ஒப்புதலை எதிர்பார்க்கும் எபிரெய வினாவை இயல்பான தமிழ் சொல்லாட்சியில் வெளிப்படுத்துகிறது.
- source_word: אִם קָטֹן אַתָּה בְּעֵינֶיךָ
  choice: உன் பார்வையில் நீ சிறியவனாக இருந்தபோதிலும்
  rationale: சவுல் தன்னைத் தாழ்ந்தவனாகக் கருதியதைச் சுட்டும் எபிரெய உருவகத்தைப் பாதுகாத்து, சூழலில் உள்ள விட்டுக்கொடுப்பு நுணுக்கத்தையும் தெரிவிக்கிறது.
- source_word: קָטֹן
  choice: சிறியவன்
  rationale: தாழ்ந்த நிலை அல்லது முக்கியமின்மையைக் குறிக்கும் மூல உருவகத்தை மிகையாக விளக்காமல் நேரடியாகப் பாதுகாக்கிறது.
- source_word: בְּעֵינֶיךָ
  choice: உன் பார்வையில்
  rationale: ஒருவர் தன்னை எவ்வாறு மதிப்பிடுகிறார் என்பதைக் குறிக்கும் எபிரெய மரபுத்தொடருக்கு இயல்பான தமிழ் இணை.
- source_word: רֹאשׁ שִׁבְטֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் கோத்திரங்களுக்குத் தலைவன்
  rationale: רֹאשׁ என்பதன் ‘தலை’ உருவகத்தை புரிந்துகொள்ளக்கூடிய தலைமைப் பொருளில் வைத்திருக்கிறது.
- source_word: וַיִּמְשָׁחֲךָ
  choice: உன்னை ... அபிஷேகம் செய்தார்
  rationale: அரசருக்குரிய எண்ணெய்பூசும் செயலைக் குறிக்கும் משׁח வினையின் சடங்கு மற்றும் இறையியல் முக்கியத்துவத்தைப் பாதுகாக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தலைப்புப் பெயரால் மாற்றாமல், இறைத் திருப்பெயரான நான்கெழுத்துப் பெயரைத் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: לְמֶלֶךְ עַל יִשְׂרָאֵל
  choice: இஸ்ரவேலின்மேல் அரசனாக
  rationale: அபிஷேகத்தின் விளைவையும் ஆட்சிப் பரப்பையும் சுருக்கமாகவும் தெளிவாகவும் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைத் திருப்பெயரின் மொழியாக்கம்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் பொதுப் பட்டம் அல்ல, இறைவனின் தனிப்பெயரே நேரடியாக வருகிறது; ஆகவே அதை ஒலிபெயர்த்து வழங்குகிறது.
- issue: சவுலின் முன்னைய தாழ்ந்த சுயமதிப்பீடும் அவனது தலைமை நிலையும் இடையிலான பதற்றம்
  choice: ‘உன் பார்வையில் ... சிறியவன்’ என்ற உருவகத்தையும் ‘தலைவன்’ என்ற எதிர்மறை ஒப்புமையையும் பாதுகாத்தல்
  alternative: ‘நீ உன்னை முக்கியமற்றவன் என்று நினைத்தாலும்’ என்று விளக்கமாக மொழிபெயர்த்தல்
  rationale: தாழ்மை, சமூக நிலை, அல்லது சுயமதிப்பீடு ஆகியவற்றில் ஒன்றை மட்டும் தீர்மானிக்காமல் மூலத்தின் திறந்த நுணுக்கத்தை வைத்திருக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டது. ‘கோத்திரம்’, ‘அபிஷேகம்’ ஆகியவை இச்சூழலில் பொதுவாகப் புரிந்துகொள்ளப்படும் வேதாகமச் சொற்களாக இருப்பதால் பயன்படுத்தப்பட்டன; எபிரெய உருவகங்களான ‘உன் பார்வையில் சிறியவன்’ மற்றும் ‘தலைவன்’ பாதுகாக்கப்பட்டன.
