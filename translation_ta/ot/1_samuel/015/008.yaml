  text: וַ/יִּתְפֹּ֛שׂ אֶת אֲגַ֥ג מֶֽלֶךְ עֲמָלֵ֖ק חָ֑י וְ/אֶת כָּל הָ/עָ֖ם הֶחֱרִ֥ים לְ/פִי חָֽרֶב־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/008.yaml
  text: He captured Agag king of Amalek alive[a], and devoted all the people to destruction with the edge of the sword.
translation:
  language: ta
  text: அவன் அமலேக்கின் அரசனான ஆகாகை உயிரோடு பிடித்தான்; மக்கள் அனைவரையும் வாளின் கூர்மையால் அழிவுக்கு ஒப்படைத்தான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மக்கள் அனைவரையும் முற்றிலும் அழித்தான்.” இங்குள்ள எபிரெய வினைச்சொல், தடையாணையின் கீழ் ஒன்றை அழிவுக்கு ஒப்படைப்பதைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְפֹּשׂ
  choice: பிடித்தான்
  rationale: போர்ச் சூழலில் ஒருவரைக் கைப்பற்றுவதைக் குறிக்கும் இயல்பான நவீனத் தமிழ் சொல்.
- source_word: אֲגַג
  choice: ஆகாகு
  rationale: எபிரெயத் தனிப்பெயரின் ஒலியைத் தமிழில் தெளிவாகப் பெயர்த்தெழுதுகிறது; வேற்றுமை உருபுடன் முதன்மை உரையில் ‘ஆகாகை’ என வருகிறது.
- source_word: מֶלֶךְ עֲמָלֵק
  choice: அமலேக்கின் அரசன்
  rationale: எபிரெயக் கட்டமைப்பின் ‘அமலேக்கின் அரசன்’ என்ற உறவை இயல்பான தமிழில் காக்கிறது.
- source_word: חָי
  choice: உயிரோடு
  rationale: ஆகாகு கொல்லப்படாமல் உயிருடன் பிடிக்கப்பட்டான் என்பதைத் தெளிவாகக் காட்டுகிறது.
- source_word: כָּל הָעָם
  choice: மக்கள் அனைவரும்
  rationale: עָם என்பதன் பரந்த பொருளைத் தக்கவைத்து, படைவீரர்கள் அல்லது பொதுமக்கள் என்று தேவையின்றிக் குறுக்கவில்லை.
- source_word: הֶחֱרִים
  choice: அழிவுக்கென்று அர்ப்பணித்தான்
  rationale: חרם என்ற தடையாணை சார்ந்த போர்மொழியின் அர்ப்பணித்தல் மற்றும் அழித்தல் ஆகிய இரு கூறுகளையும் முடிந்தவரை காக்கிறது.
- source_word: לְפִי חָרֶב
  choice: வாளின் முனையால்
  rationale: சொல்லுக்குச் சொல் ‘வாளின் வாயால்’ என்ற எபிரெய மரபுத்தொடரின் உருவகத்தை இயல்பான தமிழில் எடுத்துரைக்கிறது.
theological_decisions:
- issue: חרם என்ற போர்மொழியின் மொழிபெயர்ப்பு
  choice: மக்கள் அனைவரையும் அழிவுக்கென்று அர்ப்பணித்தான்
  alternative: மக்கள் அனைவரையும் முற்றிலும் அழித்தான்
  rationale: தேர்ந்தெடுத்த வாசகம் வெறும் கொலை அல்லது இராணுவ அழிப்பு என்பதைக் கடந்த, தடையாணையின் கீழ் அழிவுக்கென ஒதுக்கும் இறையியல் நிறையைத் தக்கவைக்கிறது. அதே நேரத்தில் ‘முற்றிலும் அழித்தான்’ என்ற பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. חרם என்பதன் இறையியல் பதற்றத்தைத் தட்டையாக்காமல் ‘அழிவுக்கென்று அர்ப்பணித்தான்’ என்று வழங்கி, எளிய மாற்றுப் பொருளை அடிக்குறிப்பில் கொடுத்துள்ளது.
