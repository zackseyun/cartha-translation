  to: 'படைகளின் யாவே இவ்வாறு கூறுகிறார்: “அமாலேக்கு இஸ்ரவேலுக்குச் செய்ததையும், இஸ்ரவேல் எகிப்திலிருந்து வந்தபோது வழியில் அதற்கு எதிராக நின்றதையும் நான் கவனத்தில் கொண்டுள்ளேன்[a][c][b].”'
