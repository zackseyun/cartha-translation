source:
  edition: WLC
  text: כֹּ֤ה אָמַר֙ יְהוָ֣ה צְבָא֔וֹת פָּקַ֕דְתִּי אֵ֛ת אֲשֶׁר עָשָׂ֥ה עֲמָלֵ֖ק לְ/יִשְׂרָאֵ֑ל אֲשֶׁר שָׂ֥ם ל/וֹ֙ בַּ/דֶּ֔רֶךְ בַּ/עֲלֹת֖/וֹ מִ/מִּצְרָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/002.yaml
  text: 'Thus says Yahweh of hosts: ‘I have taken note of what Amalek did to Israel[c][b][a], how he opposed him on the way when he came up from Egypt.’'
translation:
  language: ta
  text: 'படைகளின் யாவே இவ்வாறு கூறுகிறார்: “அமாலேக்கு இஸ்ரவேலுக்குச் செய்ததையும், இஸ்ரவேல் எகிப்திலிருந்து வந்தபோது வழியில் அதற்கு எதிராக நின்றதையும் நான் கவனத்தில் கொண்டுள்ளேன்[a][c][b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “கவனத்தில் கொண்டுள்ளேன்” என்பதற்கு “நினைவுகூர்ந்துள்ளேன்” அல்லது சூழலின்படி “தண்டனைக்காக விசாரித்துள்ளேன்” என்றும் மொழிபெயர்க்கலாம். எபிரெய வினை கவனித்தல், நினைவுகூருதல், தீர்ப்புடன் அணுகுதல் ஆகிய பொருள்களைத் தரக்கூடும்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில் “இஸ்ரவேல்” ஒரு மக்களைக் குறித்தாலும், இலக்கணத்தில் ஒருமையாகக் கொள்ளப்படுகிறது.
    reason: cultural_note
  - marker: c
    text: “எதிராக நின்றதையும்” என்பதற்கு “வழியில் அதைத் தடுத்ததையும்” என்றும், சாத்தியமாக “அதற்காக வழியில் பதுங்கியிருந்ததையும்” என்றும் பொருள் கொள்ளலாம். இது எகிப்திலிருந்து வந்த இஸ்ரவேலுக்கு எதிராக அமாலேக்கு செய்த பகைமையான செயலைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: கூறுவது இதுவே
  rationale: தூதுரைப் பாணியிலான எபிரெயச் சூத்திரத்தின் வலிமையைத் தக்கவைத்துக்கொண்டு, நவீனத் தமிழில் இயல்பாக ஒலிக்கிறது.
- source_word: יְהוָה צְבָאוֹת
  choice: படைகளின் யெகோவா
  rationale: தெய்வீகப் பெயரை ஒலிபெயர்ப்பாகத் தக்கவைத்து, צְבָאוֹת என்பதன் பரந்த படை/சேனைப் பொருளையும் மிகையாகக் குறுக்காமல் வெளிப்படுத்துகிறது.
- source_word: פָּקַדְתִּי
  choice: நான் கவனத்தில் கொண்டிருக்கிறேன்
  rationale: இந்த வினை நினைவுகூருதல், கவனம் செலுத்துதல், தண்டனைக்காக விசாரித்தல் ஆகிய பொருள் நிழல்களைக் கொண்டது. அடுத்த வசனத்தில் வரும் தீர்ப்பை இங்கேயே வெளிப்படையாகச் சேர்க்காமல், நோக்கமுள்ள தெய்வீகக் கவனத்தைத் தக்கவைக்கிறது.
- source_word: אֵת אֲשֶׁר עָשָׂה עֲמָלֵק לְיִשְׂרָאֵל
  choice: அமாலேக்கு இஸ்ரவேலுக்குச் செய்ததை
  rationale: மூலத்தின் பொதுவான பொருட்சொற்றொடரை இயல்பான தமிழில் தருகிறது; பகைமையின் குறிப்பிட்ட வடிவத்தை மிகையாக விளக்கவில்லை.
- source_word: אֲשֶׁר שָׂם לוֹ בַּדֶּרֶךְ
  choice: வழியில் அவனை எதிர்த்து நின்றதை
  rationale: சுருக்கமான எபிரெய மரபுத்தொடரில் உள்ள பகைமையான தடுப்பு அல்லது எதிர்ப்பைத் தெரிவிக்கிறது; ‘பதுங்கித் தாக்கினான்’ என்ற குறுகிய போர்த் தந்திரப் பொருளை பிரதான உரையில் கட்டாயப்படுத்தவில்லை.
- source_word: לוֹ ... בַּעֲלֹתוֹ
  choice: இஸ்ரவேல் ... அவனை
  rationale: எபிரெயத்தில் இஸ்ரவேல் ஒருமை ஆண்பால் கூட்டுப்பெயராகக் கருதப்படுகிறது. தமிழில் முன்னிலையைத் தெளிவாக்க ‘இஸ்ரவேல்’ மீண்டும் சொல்லப்பட்டு, பின்னர் ஒருமைச் சுட்டுப்பெயர் தக்கவைக்கப்படுகிறது.
- source_word: מִמִּצְרַיִם
  choice: எகிப்திலிருந்து புறப்பட்டு வந்தபோது
  rationale: எகிப்திலிருந்து ‘மேலே வருதல்’ என்ற எபிரெய வழக்கை, புவியியல் திசையை செயற்கையாக வலியுறுத்தாமல் இயல்பான தமிழில் வழங்குகிறது.
theological_decisions:
- issue: יְהוָה צְבָאוֹת என்ற தெய்வீகப் பெயரும் பட்டமும்
  choice: படைகளின் யெகோவா
