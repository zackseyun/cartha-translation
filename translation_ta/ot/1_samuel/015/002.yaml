  alternative: நான் நினைவுகூர்ந்தேன்; நான் தண்டிக்கத் தீர்மானித்தேன்
  rationale: அமாலேக்கின் கடந்தகாலக் குற்றத்தைச் செயல்பூர்வமாகக் கவனிப்பதும் வரவிருக்கும் தீர்ப்பும் இடையிலான பதற்றத்தைத் தக்கவைக்கிறது; இவ்வசனத்திலேயே தண்டனையை முழுமையாக வெளிப்படுத்தவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், வேதாகம உரைக்கு ஏற்ற கண்ணியமான ஆனால் எளிதில் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. ‘படைகளின் யெகோவா’ என்ற அமைப்பு தெய்வீகப் பெயரையும் பட்டத்தின் பரந்த பொருளையும் தக்கவைக்கிறது. மூலத்தின் கூட்டொருமையை முற்றிலும் மறைக்காமல், தமிழ் வாசகருக்கான முன்னிலைத் தெளிவு வழங்கப்பட்டுள்ளது.
