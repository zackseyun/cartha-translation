base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/031.yaml
  text: So Samuel went back after Saul[a], and Saul bowed down to Yahweh.
translation:
  language: ta
  text: அப்போது சவுலுக்குப் பின் சாமுவேல் திரும்பிச் சென்றார்; சவுல் ஆண்டவரை நோக்கித் தாழ்ந்து வணங்கினான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஆண்டவரை வழிபட்டான்.” எபிரெய வினைச்சொல் சூழலுக்கேற்ப தாழ்ந்து வணங்குவதையோ வழிபடுவதையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: திரும்பிச் சென்றார்
  rationale: שׁוב என்பதன் ‘திரும்புதல்’ என்ற பொருளையும், இச்சூழலில் சாமுவேல் மீண்டும் சவுலுடன் செல்ல முனைந்த இயக்கத்தையும் இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: אַחֲרֵי
  choice: சவுலுக்குப் பின்னால்
  rationale: ‘பின்னால்/பின்’ என்ற எபிரெயச் சொல்லின் இடவியல் உருவகத்தைப் பாதுகாக்கிறது; ‘சவுலோடு’ என்று மட்டும் மொழிபெயர்த்து உடன்செல்லுதலை மிகையாகத் தீர்மானிப்பதைத் தவிர்க்கிறது.
- source_word: וַיִּשְׁתַּחוּ
  choice: தலைவணங்கினான்
  rationale: שׁחה குறிக்கும் உடலைத் தாழ்த்தி வணங்கும் செயலை நேரடியாக வெளிப்படுத்துகிறது. சூழலில் இது வழிபாட்டுச் செயல் என்றாலும், முதன்மை உரையில் அந்தப் பொருளை மட்டும் கட்டாயப்படுத்தாமல் எபிரெயச் சொல்லின் உடல்சார் நுணுக்கத்தையும் காக்கிறது.
- source_word: לַיהוָה
  choice: ஆண்டவரை நோக்கி
  rationale: ל முன்னொட்டு வணக்கத்தின் திசை அல்லது இலக்கைக் குறிக்கிறது. יהוה என்ற தெய்வீகப் பெயருக்கான மரியாதைமிக்க தமிழாக்கமாக ‘ஆண்டவர்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: שְׁמוּאֵל
  choice: சாமுவேல்
  rationale: தமிழில் நிலைபெற்றுள்ள பெயர் வடிவம்.
- source_word: שָׁאוּל
  choice: சவுல்
  rationale: தமிழில் நிலைபெற்றுள்ள பெயர் வடிவம்.
theological_decisions:
- issue: וַיִּשְׁתַּחוּ என்பது வெளிப்படையாக ‘வழிபட்டான்’ என்பதைக் குறிக்கிறதா, அல்லது உடலைத் தாழ்த்திய செயலைக் குறிக்கிறதா?
  choice: முதன்மை உரையில் ‘தலைவணங்கினான்’
  alternative: ‘ஆண்டவரை வழிபட்டான்’
  rationale: இந்த வினைச்சொல் சூழலுக்கேற்ப தலைவணங்குதல், நெடுஞ்சாண்கிடையாக விழுதல், அல்லது வழிபடுதல் ஆகிய பொருள்களைக் கொள்ளலாம். இங்கு செயல் ஆண்டவரை நோக்கியதால் வழிபாட்டு உணர்வு தெளிவாக இருந்தாலும், உடல்சார் செயலை முன்னிறுத்தும் மூலமொழியின் நுணுக்கத்தை முதன்மை உரை பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பாகவும், வேதாகம உரைக்கேற்ற கண்ணியத்துடனும் வடிவமைக்கப்பட்டுள்ளது. ‘சவுலுக்குப் பின்னால்’ என்பது மூலத்தின் சொற்படிமத்தைத் தக்கவைக்கிறது; ‘தலைவணங்கினான்’ என்பது உடல்சார் செயலும் வழிபாட்டு உணர்வும் இடையிலான மூலமொழி நுணுக்கத்தைப் பாதுகாக்கிறது.
