  text: וַ/יִּסֹּ֥ב שְׁמוּאֵ֖ל לָ/לֶ֑כֶת וַ/יַּחֲזֵ֥ק בִּ/כְנַף מְעִיל֖/וֹ וַ/יִּקָּרַֽע־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/027.yaml
  text: As Samuel turned to go[a], he seized the edge of his robe, and it tore.
translation:
  language: ta
  text: சாமுவேல் போகத் திரும்பியபோது, சவுல் அவருடைய மேலங்கியின் ஓரத்தைப் பிடித்தான்[a]; அது கிழிந்தது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அவருடைய மேலங்கியின் மூலையை’ அல்லது ‘அவருடைய மேலங்கியின் கீழோரத்தை.’ எபிரெயச் சொல் ஓர் ஆடையின் விளிம்புப் பகுதியைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסֹּב
  choice: திரும்பியபோது
  rationale: סבב இங்கு புறப்படுவதற்காகத் திரும்பிய செயலைக் குறிக்கிறது. அடுத்துள்ள לָלֶכֶת உடன் சேர்த்து தமிழில் இயல்பான காலவினைத் தொடராக மொழிபெயர்க்கப்பட்டது.
- source_word: לָלֶכֶת
  choice: புறப்பட்டுப் போக
  rationale: הלך இன் தொழிற்பெயர் வடிவம் சாமுவேல் அங்கிருந்து செல்ல எண்ணியதை வெளிப்படுத்துகிறது. ‘புறப்பட்டுப் போக’ என்பது சூழலிலுள்ள விலகிச் செல்லும் பொருளை இயல்பாகக் கொடுக்கிறது.
- source_word: וַיַּחֲזֵק
  choice: பற்றிக்கொண்டான்
  rationale: חזק இன் ஹிஃபில் வடிவம் உறுதியாகப் பிடித்துக்கொள்வதைக் குறிக்கிறது. ‘பற்றிக்கொண்டான்’ திடீரான, வலுவான செயலை நவீன தமிழில் இயல்பாகத் தெரிவிக்கிறது.
- source_word: בִּכְנַף
  choice: ஓரத்தை
  rationale: כָּנָף என்பதன் அடிப்படைப் பொருள் ‘சிறகு’; ஆடையைப் பொறுத்தவரை அதன் விளிம்பு, மூலை அல்லது கீழோரத்தைக் குறிக்கலாம். ‘ஓரம்’ தேவையற்ற துல்லியப்படுத்தலைத் தவிர்க்கும் விரிவான இயல்பான சொல்.
- source_word: מְעִילוֹ
  choice: அவருடைய மேலங்கி
  rationale: מְעִיל ஒரு வெளிப்புற ஆடை அல்லது நீண்ட மேலங்கியைக் குறிக்கிறது. ‘மேலங்கி’ இன்றைய வாசகருக்குத் தெளிவாகவும் நிகழ்வுச் சூழலுக்கு ஏற்றதாகவும் உள்ளது. உரையாடல் சூழலின் அடிப்படையில் இது சாமுவேலுடைய ஆடை என்றும், பிடித்தவன் சவுல் என்றும் வெளிப்படையாகக் கொடுக்கப்பட்டுள்ளது.
- source_word: וַיִּקָּרַע
  choice: அது கிழிந்தது
  rationale: קרע இன் நிஃபால் வடிவம் ஆடை கிழிந்த நிகழ்வைச் செயப்படுபொருள் சார்ந்த அல்லது தன்வினைத் தன்மையில் தெரிவிக்கிறது. ‘அது கிழிந்தது’ காரணமுறையை மிகையாக விளக்காமல் நிகழ்வை நேரடியாகக் கூறுகிறது.
theological_decisions:
- issue: பிடித்தவன் மற்றும் மேலங்கியின் உரிமையாளர் குறித்த எபிரெயப் பிரதிப்பெயர் குறிப்புகள்
  choice: முந்தைய உரையாடல் மற்றும் அடுத்த வசனத்தின் அடையாளச் செயலை அடிப்படையாகக் கொண்டு, பிடித்தவன் ‘சவுல்’ என்றும் மேலங்கி சாமுவேலுடையது என்றும் உரையில் தெளிவுபடுத்தப்பட்டது.
  alternative: ‘அவன் தன் மேலங்கியின் ஓரத்தைப் பற்றிக்கொண்டான்’ என்று எபிரெயச் சொற்றொடரின் மேற்பரப்பு இலக்கணத் தெளிவின்மையை அப்படியே வைப்பது.
  rationale: எபிரெய வினையில் எழுவாய் பெயரிடப்படவில்லை; உடை உரிமையும் ஆண்பால் ஒருமைப் பின்னொட்டால் மட்டுமே குறிக்கப்படுகிறது. ஆயினும் தொடர்ச்சியான நிகழ்வுச் சூழலில் சவுல் சாமுவேலைத் தடுத்து, சாமுவேலின் மேலங்கியைப் பிடித்ததாகவே இயல்பாகப் புரிகிறது. தமிழில் தெளிவற்ற பிரதிப்பெயர்கள் தவறாக ஒரே நபரைக் குறிக்கும் வாய்ப்புள்ளதால், கதைச் சூழல் வழங்கும் குறிப்பை வெளிப்படுத்துவது சிறந்த சமநிலை மொழிபெயர்ப்பு.
translation_notes:
  register: நவீனத் தரத் தமிழில், எளிதில் புரியும் ஆனால் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘பற்றிக்கொண்டான்’ செயலில் உள்ள வலிமையைத் தெரிவிக்கிறது; ‘அது கிழிந்தது’ எபிரெய நிஃபால் வடிவத்தின் காரணத்தைக் கூடுதலாக நிர்ணயிக்காமல் விடுகிறது.
