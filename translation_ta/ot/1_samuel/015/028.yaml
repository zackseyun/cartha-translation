  text: וַ/יֹּ֤אמֶר אֵלָי/ו֙ שְׁמוּאֵ֔ל קָרַ֨ע יְהוָ֜ה אֶֽת מַמְלְכ֧וּת יִשְׂרָאֵ֛ל מֵ/עָלֶ֖י/ךָ הַ/יּ֑וֹם וּ/נְתָנָ֕/הּ לְ/רֵעֲ/ךָ֖ הַ/טּ֥וֹב מִמֶּֽ/ךָּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/028.yaml
  text: And Samuel said to him[a], “Yahweh has torn the kingdom of Israel away from you today and has given it to your neighbor[b], who is better than you.”
translation:
  language: ta
  text: சாமுவேல் அவனிடம், “யாவே இன்று இஸ்ரவேலின் அரசாட்சியை உன்னிடமிருந்து கிழித்தெடுத்து, உன்னைவிடச் சிறந்த உன் அயலானுக்கு[a] அதைக் கொடுத்துவிட்டார்” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘உன் தோழனுக்கு’ அல்லது ‘உன் சக மனிதனுக்கு’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלָיו שְׁמוּאֵל
  choice: சாமுவேல் அவனிடம் ... என்றார்
  rationale: தொடர்கதை அமைப்பை இயல்பான தமிழ்ச் சொல்லொழுங்கில் தருகிறது; வாவ் தொடர்ச்சியைத் தனியே ‘அப்போது’ என்று வலுப்படுத்தத் தேவையில்லை.
- source_word: קָרַע
  choice: கிழித்தெடுத்து
  rationale: முந்தைய வசனத்தில் ஆடை கிழிந்த நிகழ்வோடு உள்ள உருவகத் தொடர்பையும், சவுலிடமிருந்து அரசாட்சி அகற்றப்படுவதையும் காக்கிறது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: தெய்வீகப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், நவீனத் தமிழில் பரவலாக அறியப்படும் ஒலிபெயர்ப்பால் தருகிறது.
- source_word: מַמְלְכוּת יִשְׂרָאֵל
  choice: இஸ்ரவேலின் அரசாட்சி
  rationale: இங்கு நாட்டின் நிலப்பரப்பைவிட சவுலிடமிருந்து பறிக்கப்பட்டு மற்றொருவருக்குக் கொடுக்கப்படும் அரச அதிகாரமே முன்னிலையில் இருப்பதால் ‘அரசாட்சி’ பொருத்தமானது.
- source_word: מֵעָלֶיךָ
  choice: உன்னிடமிருந்து
  rationale: சவுலின் வசத்திலிருந்த அரசாட்சி அகற்றப்படுவதை இயல்பான தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: הַיּוֹם
  choice: இன்று
  rationale: தீர்ப்பின் உடனடித்தன்மையை நேரடியாகப் பேணுகிறது.
- source_word: וּנְתָנָהּ
  choice: அதைக் கொடுத்துவிட்டார்
  rationale: எபிரெய நிறைவுற்ற வினையின் தீர்மானிக்கப்பட்ட, மாற்ற முடியாத தெய்வீகச் செயல் என்ற வலிமையைப் பேணுகிறது.
- source_word: לְרֵעֲךָ
  choice: உன் சக மனிதனுக்கு
  rationale: רֵעַ என்பதன் ‘அயலான்/தோழன்/சக மனிதன்’ என்ற பரப்பை இச்சூழலில் தவறாக நெருங்கிய நண்பன் எனக் குறுக்காமல் வெளிப்படுத்துகிறது.
- source_word: הַטּוֹב מִמֶּךָּ
  choice: உன்னைவிடச் சிறந்த
  rationale: ஒப்பீட்டை நேரடியாகப் பேணி, அது அரசாட்சி கொடுக்கப்படும் நபரை விவரிப்பதைத் தமிழ்ச் சொல்லொழுங்கில் தெளிவாக்குகிறது.
theological_decisions:
- issue: தெய்வீகத் தீர்ப்பு நிறைவேறிய செயலாகவா அல்லது எதிர்காலச் செயலாகவா தரப்பட வேண்டும்
  choice: ‘கிழித்தெடுத்து ... கொடுத்துவிட்டார்’ என நிறைவேறிய/தீர்மானிக்கப்பட்ட செயலாகத் தரப்பட்டது
  alternative: ‘கிழித்தெடுப்பார் ... கொடுப்பார்’ என எதிர்காலமாகத் தரலாம்
  rationale: எபிரெய நிறைவுற்ற வினைகள், வரலாற்று நிறைவேற்றம் பின்னர் நிகழ்ந்தாலும், கடவுளின் தீர்ப்பு ஏற்கெனவே உறுதியாகிவிட்டது என்ற வலிமையை வெளிப்படுத்துகின்றன.
translation_notes:
  register: நவீன நிலையான தமிழ்; மரியாதையும் இயல்பும் கொண்ட நேரடி உரை. ‘கிழித்தெடுத்து’ என்ற சொல் சூழலிலுள்ள அடையாளச் செயலைப் பேணுகிறது. அடிக்குறிப்பு குறியீடு அது விளக்கும் ‘உன் சக மனிதனுக்கு’ என்பதற்குப் பின் வைக்கப்பட்டுள்ளது.
