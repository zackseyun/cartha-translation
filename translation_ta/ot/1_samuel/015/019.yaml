revisions:
- from: அப்படியிருக்க, நீ ஏன் யெகோவாவின் குரலுக்குக் கீழ்ப்படியாமல், கொள்ளைப்பொருள்மேல் பேராசையுடன் பாய்ந்து, யெகோவாவின் பார்வையில் தீமையானதைச் செய்தாய்?[a]
  to: அப்படியிருக்க, நீ ஏன் யாவேயின் குரலுக்குக் கீழ்ப்படியாமல், கொள்ளைப் பொருள்மீது பாய்ந்து, யாவேயின் பார்வையில் தீமையானதைச் செய்தாய்?[a]
  rationale: The revision aligns the divine name with the project’s Yahweh policy, avoids making greed more explicit than the Hebrew wording requires, and retains the source’s forceful image through ‘பாய்ந்து.’ The footnote preserves the verb’s eager, grasping nuance as a lexical alternative.
