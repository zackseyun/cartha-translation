  text: וְ/לָ֥/מָּה לֹא שָׁמַ֖עְתָּ בְּ/ק֣וֹל יְהוָ֑ה וַ/תַּ֨עַט֙ אֶל הַ/שָּׁלָ֔ל וַ/תַּ֥עַשׂ הָ/רַ֖ע בְּ/עֵינֵ֥י יְהוָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/019.yaml
  text: Why then did you not obey the voice of Yahweh[a], but rush upon the spoil and do what was evil in the eyes of Yahweh?
translation:
  language: ta
  text: அப்படியிருக்க, நீ ஏன் யாவேயின் குரலுக்குக் கீழ்ப்படியாமல், கொள்ளைப் பொருள்மீது பாய்ந்து, யாவேயின் பார்வையில் தீமையானதைச் செய்தாய்?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “கொள்ளைப் பொருள்மீது பாய்ந்து” என்பதை “கொள்ளைப் பொருளை நோக்கி வேகமாகப் பாய்ந்து” அல்லது “கொள்ளைப் பொருளின்மேல் பாய்ந்து கைப்பற்ற முயன்று” என்றும் மொழிபெயர்க்கலாம். எபிரெய வினைச்சொல் போர்க் கொள்ளையை நோக்கிய ஆர்வமிக்க, பற்றிக்கொள்ளும் வேகமான இயக்கத்தைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָמָּה
  choice: அப்படியிருக்க, ஏன்
  rationale: முந்தைய சூழலில் கூறப்பட்ட கட்டளையோடு சாமுவேலின் கண்டனக் கேள்வியை இணைக்கும் וְ என்பதன் தொடர்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: שָׁמַעְתָּ בְּקוֹל
  choice: குரலுக்குக் கீழ்ப்படி
  rationale: இங்கு שׁמע என்பது வெறுமனே கேட்பதை அல்ல, கொடுக்கப்பட்ட கட்டளைக்குக் கீழ்ப்படிவதைக் குறிக்கிறது; அதேவேளையில் ‘குரல்’ என்ற எபிரெய உருவகமும் காக்கப்படுகிறது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: தேவனுடைய தனிப்பெயரான நான்கெழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் பரவலாக அறியப்படும் ஒலிபெயர்ப்பால் வழங்குகிறது.
- source_word: וַתַּעַט אֶל
  choice: பேராசையுடன் பாய்
  rationale: வினைச்சொல் கொள்ளைப்பொருளை நோக்கிய அவசரமான, பற்றிக்கொள்ளும் இயக்கத்தை உணர்த்துகிறது; ‘பாய்ந்து’ அதன் உயிரோட்டத்தையும் ‘பேராசையுடன்’ அதன் சூழல்சார் எதிர்மறை நிழலையும் வெளிப்படுத்துகிறது.
- source_word: הַשָּׁלָל
  choice: கொள்ளைப்பொருள்
  rationale: போரில் கைப்பற்றப்படும் பொருட்களைக் குறிக்கும் தெளிவான, இயல்பான நவீனத் தமிழ் சொல்.
- source_word: וַתַּעַשׂ הָרַע
  choice: தீமையானதைச் செய்
  rationale: ‘தீமையைச் செய்’ என்ற கருத்தை இயல்பாகத் தருவதோடு, பெயரடைக்கு முன் உள்ள எபிரெய சுட்டுத்தன்மையையும் ஓரளவு காக்கிறது.
- source_word: בְּעֵינֵי יְהוָה
  choice: யெகோவாவின் பார்வையில்
  rationale: தேவனுடைய மதிப்பீட்டில் தீமையானது என்ற எபிரெய உருவகத்தைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரின் மொழிபெயர்ப்பு
  choice: யெகோவா
  alternative: யாவே
  rationale: மூலத்தில் பட்டம் அல்ல, தேவனுடைய தனிப்பெயர் நேரடியாக உள்ளது. அதை ‘கர்த்தர்’ என மாற்றாமல் பெயராகவே வழங்கப்படுகிறது; ‘யெகோவா’ நவீனத் தமிழ் வேதாகமப் பயன்பாட்டில் பரவலாக அறியப்படும் வடிவம்.
translation_notes:
  register: நவீன நிலையான தமிழில், நேரடியான தீர்க்கதரிசனக் கண்டனத்தின் வலிமையைத் தக்கவைக்கும் கண்ணியமான நடை. எபிரெய மொழியின் ‘குரலுக்குக் கீழ்ப்படிதல்’ மற்றும் ‘பார்வையில்’ ஆகிய உருவகங்கள் இயல்பான தமிழில் பாதுகாக்கப்பட்டுள்ளன.
