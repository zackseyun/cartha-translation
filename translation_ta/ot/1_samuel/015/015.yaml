  text: וַ/יֹּ֨אמֶר שָׁא֜וּל מֵ/עֲמָלֵקִ֣י הֱבִיא֗וּ/ם אֲשֶׁ֨ר חָמַ֤ל הָ/עָם֙ עַל מֵיטַ֤ב הַ/צֹּאן֙ וְ/הַ/בָּקָ֔ר לְמַ֥עַן זְבֹ֖חַ לַ/יהוָ֣ה אֱלֹהֶ֑י/ךָ וְ/אֶת הַ/יּוֹתֵ֖ר הֶחֱרַֽמְנוּ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/015.yaml
  text: And Saul said[a], “They brought them from the Amalekites, because the people spared the best of the sheep and the cattle, in order to sacrifice them to Yahweh your God; but the rest we devoted to destruction.”
translation:
  language: ta
  text: சவுல், “அவற்றை அமலேக்கியர்களிடமிருந்து கொண்டுவந்தார்கள். ஏனெனில், உம்முடைய கடவுளாகிய யாவேக்குப் பலியிடுவதற்காக ஆடுமாடுகளில் சிறந்தவற்றை மக்கள் அழிக்காமல் விட்டுவைத்தார்கள்; மற்றவற்றையோ அழிவுக்கென்று அர்ப்பணித்தோம்[a]” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “முற்றிலும் அழித்தோம்.” இங்குள்ள எபிரேயச் சொல், தடை ஆணையின்கீழ் ஒன்றை அழிவுக்காக அர்ப்பணிப்பதைக் குறிக்கும் தொழில்நுட்பச் சொல்லாகும்.
    reason: חרם என்பதன் மாற்று மொழிபெயர்ப்பையும் அதன் சிறப்புப் பொருளையும் விளக்குகிறது.
lexical_decisions:
- source_word: הֱבִיאוּם
  choice: அவற்றைக் கொண்டுவந்தார்கள்
  rationale: הביא என்பது இங்கு ‘கொண்டுவருதல்’ என்ற காரணவினைப் பொருளில் வருகிறது; 3ஆம் நபர் பன்மை எழுவாயும் பன்மை பொருள் பின்னொட்டும் தமிழில் இயல்பாகப் பாதுகாக்கப்பட்டுள்ளன.
- source_word: מֵעֲמָלֵקִי
  choice: அமலேக்கியர்களிடமிருந்து
  rationale: இது இடப்பெயரைக் காட்டிலும் அமலேக்கிய மக்கள் இனத்தைக் குறிக்கும் இனப்பெயர் வடிவம்.
- source_word: חָמַל ... עַל
  choice: அழிக்காமல் விட்டுவைத்தார்கள்
  rationale: தடை விதித்து அழிக்கப்பட வேண்டியவற்றை அழிக்காது காப்பாற்றிய செயலை இச்சூழலில் தெளிவாகக் காட்டுகிறது; வெறும் உணர்ச்சிசார் ‘இரக்கம் காட்டினர்’ என்பதைவிட துல்லியமானது.
- source_word: מֵיטַב הַצֹּאן וְהַבָּקָר
  choice: ஆடுமாடுகளில் சிறந்தவற்றை
  rationale: ஆடுகள் மற்றும் மாடுகளின் தேர்ந்த, உயர்தரமான பகுதியைக் குறிக்கும் எபிரேயத் தொடரை இயல்பான தமிழில் சுருக்கமாக வெளிப்படுத்துகிறது.
- source_word: לְמַעַן זְבֹחַ
  choice: பலியிடுவதற்காக
  rationale: לְמַעַן குறிக்கும் நோக்கத்தைத் தெளிவாகப் பாதுகாக்கிறது; பலியின் பொருள் முன் வரும் விலங்குகள் என்பதும் தமிழில் தெளிவாக உள்ளது.
- source_word: לַיהוָה אֱלֹהֶיךָ
  choice: உம்முடைய கடவுளாகிய யாவேக்கு
  rationale: יהוה என்ற தனிப்பெயர் ‘யாவே’ என்று ஒலிபெயர்க்கப்பட்டுள்ளது. இரண்டாம் நபர் ஒருமை பின்னொட்டு சவுல் சாமுவேலிடம் ‘உம்முடைய கடவுள்’ என்று கூறும் குறிப்பிடத்தக்க சொல்லாட்சியைப் பாதுகாக்கிறது.
- source_word: הַיּוֹתֵר
  choice: மற்றவற்றையோ
  rationale: அழிக்காமல் விடப்பட்ட சிறந்த விலங்குகளைத் தவிர எஞ்சிய அனைத்தையும் இயல்பான தமிழில் குறிக்கிறது.
- source_word: הֶחֱרַמְנוּ
  choice: அழிவுக்கென்று அர்ப்பணித்தோம்
  rationale: חרם என்ற வினை சாதாரணமாக அழிப்பதை மட்டுமல்லாமல், தெய்வீகத் தீர்ப்பின்கீழ் அழிவுக்காக ஒதுக்குவதைச் சுட்டுகிறது; இத்தொழில்நுட்ப நுணுக்கத்தை மொழிபெயர்ப்பு தக்கவைக்கிறது.
theological_decisions:
- issue: புனிதப் போர்ச் சூழலில் חרם என்பதன் மொழிபெயர்ப்பு
  choice: அழிவுக்கென்று அர்ப்பணித்தோம்
  alternative: முற்றிலும் அழித்தோம்
  rationale: இவ்வினை சாதாரண அழிவைவிட அதிகமாக, கடவுளின் தீர்ப்பின்கீழ் அழிவுக்காக ஒதுக்கப்படுதலைக் குறிக்கிறது. முதன்மை மொழிபெயர்ப்பு அந்த இறையியல் நுணுக்கத்தைத் தக்கவைக்கிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- issue: יהוה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் வரும் உடன்படிக்கைத் தனிப்பெயரை பொதுப்பட்டப் பெயராக மாற்றாமல், தமிழில் அதன் உச்சரிப்புக்கு நெருக்கமாக ஒலிபெயர்க்கிறது.
- issue: אֱלֹהֶיךָ என்பதிலுள்ள இரண்டாம் நபர் ஒருமை
  choice: உம்முடைய கடவுள்
  alternative: நமது கடவுள்
  rationale: சவுல் சாமுவேலிடம் ‘உம்முடைய கடவுள்’ என்று கூறுவதால் தோன்றும் சொல்லாட்சிசார் இடைவெளியை மாற்றாமல் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், மரியாதையும் வாசிப்புத் தெளிவும் கொண்ட உரை. சாமுவேலை நோக்கிய ஒருமை மரியாதை வடிவமான ‘உம்முடைய’ பயன்படுத்தப்பட்டுள்ளது. ‘ஆடுமாடுகள்’ என்பது மூலத்திலுள்ள இரு கால்நடை வகைகளையும் இயல்பாக இணைக்கிறது; חרם என்பதன் தொழில்நுட்ப நுணுக்கம் முதன்மை உரையிலும் அடிக்குறிப்பிலும் பாதுகாக்கப்பட்டுள்ளது.
