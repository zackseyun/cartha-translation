source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר שְׁמוּאֵ֗ל הַ/חֵ֤פֶץ לַֽ/יהוָה֙ בְּ/עֹל֣וֹת וּ/זְבָחִ֔ים כִּ/שְׁמֹ֖עַ בְּ/ק֣וֹל יְהוָ֑ה הִנֵּ֤ה שְׁמֹ֨עַ֙ מִ/זֶּ֣בַח ט֔וֹב לְ/הַקְשִׁ֖יב מֵ/חֵ֥לֶב אֵילִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/022.yaml
  text: And Samuel said, “Does the LORD delight in burnt offerings and sacrifices as much as in obeying the voice of the LORD? Look, to obey is better than sacrifice, and to listen than the fat of rams.”
translation:
  language: ta
  text: 'சாமுவேல் சொன்னார்: “எரிபலிகளிலும் பலிகளிலும் ஆண்டவர் மகிழ்ச்சி கொள்வதைப்போல, ஆண்டவரின் குரலுக்குக் கீழ்ப்படிவதிலும் அவர் மகிழ்ச்சி கொள்கிறாரா? இதோ, பலியைவிடக் கீழ்ப்படிவது சிறந்தது; கடாக்களின் கொழுப்பைவிடச் செவிசாய்ப்பது சிறந்தது.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַחֵפֶץ
  choice: மகிழ்ச்சி ... இருக்கிறதா?
  rationale: חפץ என்பது விருப்பம், மகிழ்ச்சி அல்லது பிரியம் கொள்வதைச் சுட்டுகிறது; கேள்வியின் ஒப்பீட்டு வலிமையை இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: בְעֹלוֹת וּזְבָחִים
  choice: எரிபலிகளிலும் மற்ற பலிகளிலும்
  rationale: עֹלוֹת என்பதை முழுவதும் எரிக்கப்படும் பலிகளாகத் தனிப்படுத்தி, זְבָחִים என்ற பொதுவான பலி வகையிலிருந்து வேறுபடுத்துகிறது.
- source_word: כִּשְׁמֹעַ בְּקוֹל יְהוָה
  choice: ஆண்டவரின் குரலுக்குக் கீழ்ப்படிவதில் இருப்பதற்கு இணையானதா?
  rationale: שמע בקול என்ற எபிரேய மரபுத்தொடர் வெறும் கேட்பதை அல்ல, கேட்டுக் கீழ்ப்படிவதை குறிக்கிறது; כִּ இங்கு ஒப்பீட்டை அறிமுகப்படுத்துகிறது.
- source_word: הִנֵּה
  choice: இதோ
  rationale: கவனத்தை ஈர்த்து அடுத்து வரும் தீர்ப்பை வலியுறுத்தும் எபிரேயச் சொல்லின் செயல்பாட்டைத் தக்கவைக்கிறது.
- source_word: לְהַקְשִׁיב
  choice: கவனித்துக் கேட்பது
  rationale: קשב என்பது செவிசாய்த்து கவனம் செலுத்துவதைக் குறிக்கிறது; முதல் அரையடியில் உள்ள கீழ்ப்படிதலுடன் தொடர்பை வைத்தபடியே சொற்சார்ந்த வேறுபாட்டை பாதுகாக்கிறது.
- source_word: מֵחֵלֶב אֵילִים
  choice: செம்மறியாட்டுக் கடாக்களின் கொழுப்பைச் செலுத்துவதைவிட
  rationale: பலியில் மதிப்புமிக்க பகுதியாகிய கடாக்களின் கொழுப்பைச் சுட்டும் ஒப்பீட்டைத் தெளிவுபடுத்துகிறது; 'செலுத்துவது' என்பது தமிழில் மறைந்திருக்கும் பலிச் செயலை வெளிப்படுத்துகிறது.
- source_word: יְהוָה
  choice: ஆண்டவர்
  rationale: தெய்வீகப் பெயரை நவீனத் தமிழ் வேதாகம நடையில் பரவலாக அறியப்படும் மரியாதைத் தலைப்பால் வழங்குகிறது; வாக்கியத்தில் இருமுறையும் ஒரேபோல் மொழிபெயர்க்கப்பட்டுள்ளது.
theological_decisions:
- issue: பலிக்கும் கீழ்ப்படிதலுக்கும் இடையிலான ஒப்பீடு
  choice: பலியை முற்றிலும் நிராகரிப்பதாக அல்லாமல், கீழ்ப்படிதல் அதைவிட மேலானது என மொழிபெயர்த்தல்
  alternative: எல்லா பலிகளும் ஆண்டவருக்கு மகிழ்ச்சியற்றவை என முழுமையாகக் கூறுதல்
  rationale: எபிரேய உரை ஒப்பீட்டு கேள்வியையும் מִן மூலம் 'அதைவிடச் சிறந்தது' என்ற அமைப்பையும் பயன்படுத்துகிறது; ஆகவே சடங்கை முழுவதுமாக மறுப்பதை உரைக்குள் சேர்க்கக்கூடாது.
- issue: שמע என்பதின் இரு பயன்பாடுகள்
  choice: முதலில் 'கீழ்ப்படிவது', பின்னர் 'கவனித்துக் கேட்பது'
  alternative: இரண்டையும் ஒரேபோல் 'கேட்பது' அல்லது 'கீழ்ப்படிவது' என வழங்குதல்
  rationale: முதல் பயன்பாட்டில் בקול உடன் வரும் மரபுத்தொடர் கீழ்ப்படிதலைக் குறிக்கிறது; இரண்டாவது הקשיב கவனமாகச் செவிசாய்ப்பதைச் சொல்கிறது. கவிதை இணைப்பையும் சொல் வேறுபாட்டையும் சேர்த்து பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும் வகையில் இயல்பான, மரியாதைமிக்க நடை. எபிரேயக் கவிதை ஒப்புமையும் இரு பகுதி வலியுறுத்தலும் பாதுகாக்கப்பட்டுள்ளன. அடிக்குறிப்புகள் தேவையில்லை.
