- from: பின்பு சாமுவேல் ராமாவுக்குப் போனார்; சவுலோ சவுலின் கிபியாவிலிருந்த[a] தன் வீட்டுக்கு ஏறிச் சென்றார்.
  to: பின்பு சாமுவேல் ராமாவுக்குப் போனார்; சவுல் சவுலின் கிபியாவில் உள்ள தன் வீட்டுக்கு ஏறிச் சென்றார்.[a]
