  yaml_path: translation/ot/1_samuel/015/034.yaml
  text: Then Samuel went to Ramah[a], and Saul went up to his house in Gibeah of Saul.
translation:
  language: ta
  text: பின்பு சாமுவேல் ராமாவுக்குப் போனார்; சவுல் சவுலின் கிபியாவில் உள்ள தன் வீட்டுக்கு ஏறிச் சென்றார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சவுலுடைய கிபியா.” எபிரெயத்தில் இவ்விடப்பெயர் “கிபியாத் சவுல்” என்ற வடிவில் உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: போனார்
  rationale: கதைத் தொடரை முன்னெடுக்கும் wayyiqtol வடிவிலுள்ள הלך என்பதன் இயல்பான பொருள் ‘போனார்’ என்பதாகும்.
- source_word: הָרָמָתָה
  choice: ராமாவுக்குப்
  rationale: இடப்பெயருடன் இணைந்த திசைகாட்டும் ה, ராமாவை நோக்கிய இயக்கத்தைக் குறிக்கிறது; நவீன தமிழில் இது ‘ராமாவுக்கு’ என்று இயல்பாக வெளிப்படுகிறது.
- source_word: עָלָה
  choice: ஏறிச் சென்றார்
  rationale: עלה என்பதில் உள்ள ‘மேலே செல்/ஏறிச் செல்’ என்ற நிலவியல் நுணுக்கத்தைத் தமிழிலும் தக்கவைக்கிறது.
- source_word: בֵּיתוֹ
  choice: தன் வீட்டுக்கு
  rationale: בַּיִת என்பதுடன் மூன்றாம் நபர் ஆண்பால் ஒருமை உடைமைப் பின்னொட்டு சேர்ந்துள்ளது. வாக்கியத்தின் எழுவாய் சவுலே என்பதால், தமிழில் ‘தன் வீடு’ என்பது தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: גִּבְעַת שָׁאוּל
  choice: சவுலின் கிபியா
  rationale: எபிரெய வடிவிலுள்ள இடப்பெயரையும் அதன் தொடர்புநிலையையும் காக்கும் அதேவேளையில், தமிழில் புரியக்கூடிய இயல்பான சொல்லமைப்பாக உள்ளது.
