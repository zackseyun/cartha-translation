translation_notes:
  register: நவீனத் தரத் தமிழில், எளிதில் புரியும் ஆனால் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. சாமுவேலுக்கும் சவுலுக்கும் மரியாதைப் பன்மை வினைமுற்றுகள் பயன்படுத்தப்பட்டுள்ளன. எபிரெய மூலத்தின் நிலவியல் நுணுக்கத்தைத் தக்கவைக்க ‘ஏறிச் சென்றார்’ என்றும், இடப்பெயரின் தொடர்புநிலையைத் தக்கவைக்க ‘சவுலின் கிபியா’ என்றும் வழங்கப்பட்டுள்ளது.
