base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/030.yaml
  text: And he said[a], “I have sinned. Now please honor me before the elders of my people and before Israel, and return with me, so that I may bow down to Yahweh your God.”
translation:
  language: ta
  text: அவன், “நான் பாவம் செய்தேன். இப்போது, என் மக்களின் மூப்பர்கள் முன்னிலையிலும் இஸ்ரவேலின் முன்னிலையிலும் தயவுசெய்து என்னைக் கௌரவப்படுத்தும். யாவேவுக்குப் பணிந்துகொள்வதற்காக என்னுடன் திரும்பி வாரும்[a]” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என்னுடன் திரும்பி வாரும்; நான் உமது கடவுளாகிய யாவேவுக்குப் பணிந்துகொள்வேன்.” எபிரெய வடிவத்தை முந்தைய வேண்டுகோளின் நோக்கமாகவோ, அதைத் தொடரும் எளிய வாக்கியமாகவோ புரிந்துகொள்ளலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: חָטָאתִי
  choice: நான் பாவம் செய்தேன்
  rationale: கால் முற்றுவினை முதலாம் நபர் ஒருமை வடிவம் பாவத்தை நேரடியாக ஒப்புக்கொள்கிறது; நவீனத் தமிழில் முடிந்த செயலை இயல்பாகத் தெரிவிக்கிறது.
- source_word: עַתָּה
  choice: இப்போது
  rationale: ஒப்புக்கொள்ளுதலைத் தொடர்ந்து சவுல் உடனடியாக வைக்கும் வேண்டுகோளைச் சுட்டும் கால வினையடை.
- source_word: כַּבְּדֵנִי נָא
  choice: தயவுசெய்து என்னைக் கௌரவப்படுத்தும்
  rationale: כבד என்பதன் பியேல் கட்டளை வடிவம் பொதுமக்கள் முன் மரியாதை அளிக்கும்படி கோருகிறது; נָא என்பதன் வேண்டுகோள் நயம் ‘தயவுசெய்து’ என்பதால் வெளிப்படுகிறது.
- source_word: נֶגֶד
  choice: முன்பாக
  rationale: பிறர் காணும் பொது முன்னிலையை இயல்பான தமிழில் குறிக்கிறது.
- source_word: זִקְנֵי עַמִּי
  choice: என் மக்களின் மூப்பர்கள்
  rationale: சவுலின் ‘என் மக்கள்’ என்ற அரசியல் சார்ந்த உடைமைத் தொடர்பைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: וְנֶגֶד יִשְׂרָאֵל
  choice: இஸ்ரவேல் முன்பாகவும்
  rationale: எபிரெயத்தில் இல்லாத ‘அனைத்து’ என்பதைச் சேர்க்காமல், இஸ்ரவேலின் பொது முன்னிலையைப் பாதுகாக்கிறது.
- source_word: וְשׁוּב עִמִּי
  choice: என்னுடன் திரும்பி வாரும்
  rationale: שׁוב என்பது திரும்புவதைக் குறிக்கிறது; இச்சூழலில் சாமுவேல் சவுலுடன் மீண்டும் செல்ல வேண்டும் என்ற வேண்டுகோளை இயல்பாகத் தருகிறது.
- source_word: וְהִשְׁתַּחֲוֵיתִי
  choice: பணிந்துகொள்வதற்காக
  rationale: שׁחה உடலைத் தாழ்த்திப் பணிவதைக் குறிக்கிறது. சூழலில் இது வழிபாட்டுச் செயலாக இருந்தாலும், உடல்சார்ந்த படிமத்தை ‘பணிந்துகொள்’ பாதுகாக்கிறது. இணைப்பின் நோக்கப் பொருள் முதன்மை உரையில் தரப்பட்டு, தொடர்ச்சிப் பொருள் அடிக்குறிப்பில் வைக்கப்படுகிறது.
- source_word: לַיהוָה
  choice: யாவேவுக்கு முன்பாக
  rationale: לְ குறிக்கும் இலக்கைத் தமிழில் இயல்பாக வெளிப்படுத்துவதோடு, உடலைத் தாழ்த்தும் செயல் யாவேவின் முன்னிலையில் நடைபெறுவதைத் தெளிவாக்குகிறது.
- source_word: אֱלֹהֶיךָ
  choice: உமது கடவுள்
  rationale: இரண்டாம் நபர் ஒருமை உடைமை விகுதியைப் பாதுகாக்கிறது; மரியாதையான ஒருமையை ‘உமது’ இயல்பாகத் தெரிவிக்கிறது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் உடன்படிக்கைப் பெயரான நான்கெழுத்து இறைப்பெயர் நேரடியாக உள்ளது; அதை ஒரு பட்டமாக மாற்றாமல் பெயராகப் பாதுகாக்கிறது.
- issue: אֱלֹהֶיךָ என்பதிலுள்ள ‘உமது கடவுள்’ என்ற சொற்றொடர்
  choice: உமது கடவுள்
  alternative: நமது கடவுள்
  rationale: எபிரெயம் இரண்டாம் நபர் ஒருமையைத் தெளிவாகக் கொண்டுள்ளது. சவுல் யாவேவைத் தன்னுடையவர் என்று இங்கு சொல்லாமல் சாமுவேலின் கடவுள் என்று கூறுவதிலுள்ள கதைசார் மற்றும் இறையியல் பதற்றத்தை இது பாதுகாக்கிறது.
- issue: וְהִשְׁתַּחֲוֵיתִי இணைப்பின் செயல்பாடு
  choice: 'நோக்கம்: ‘பணிந்துகொள்வதற்காக’'
  alternative: 'எளிய தொடர்ச்சி: ‘நான் பணிந்துகொள்வேன்’'
  rationale: முந்தைய கட்டளை வேண்டுகோளுக்குப் பின் இவ்வடிவத்தை நோக்கமாகப் புரிந்துகொள்ளலாம்; அதேவேளை எளிய தொடர் வாக்கியமாகவும் கொள்ள முடிவதால் மாற்று அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. சாமுவேலிடம் பேசும் ஒருமை மரியாதை வடிவங்களான ‘உமது’, ‘வாரும்’, ‘கௌரவப்படுத்தும்’ பயன்படுத்தப்பட்டுள்ளன. ‘பணிந்துகொள்’ என்பது வழிபாட்டையும் மூலத்தின் உடல்சார்ந்த வணக்கப் படிமத்தையும் ஒருங்கே தக்கவைக்கிறது.
