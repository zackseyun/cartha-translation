  text: וַ/יֹּ֨אמֶר שָׁא֤וּל אֶל שְׁמוּאֵל֙ חָטָ֔אתִי כִּֽי עָבַ֥רְתִּי אֶת פִּֽי יְהוָ֖ה וְ/אֶת דְּבָרֶ֑י/ךָ כִּ֤י יָרֵ֨אתִי֙ אֶת הָ/עָ֔ם וָ/אֶשְׁמַ֖ע בְּ/קוֹלָֽ/ם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/024.yaml
  text: Then Saul said to Samuel[a], “I have sinned, for I transgressed the command of Yahweh and your words[b], for I feared the people and listened to their voice.”
translation:
  language: ta
  text: அப்போது சவுல் சாமுவேலிடம், “நான் பாவம் செய்தேன்; ஏனெனில், யாவேயின் கட்டளையையும்[a] உமது வார்த்தைகளையும் மீறினேன்; மக்களுக்குப் பயந்து அவர்களுடைய குரலுக்குச் செவிகொடுத்தேன்[b]” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் நேர்சொல்லாக, “யாவேயின் வாய்.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அவர்களுக்குக் கீழ்ப்படிந்தேன்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: חָטָאתִי
  choice: நான் பாவம் செய்துவிட்டேன்
  rationale: முடிந்துபோன தனது தவறைச் சவுல் இப்போது ஒப்புக்கொள்வதை எபிரெய நிறைவுவினை காட்டுகிறது. ‘செய்துவிட்டேன்’ என்பது தனிப்பட்ட குற்றப்பொறுப்பையும் நிகழ்ந்த செயலின் நிறைவையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: עָבַרְתִּי
  choice: மீறிவிட்டேன்
  rationale: இவ்வினை அடிப்படையில் ‘கடந்து செல்லுதல்’ என்று பொருள்பட்டாலும், கட்டளையை மீறும் சூழலில் ஒழுக்க மற்றும் ஆணை சார்ந்த வலிமையை ‘மீறிவிட்டேன்’ இயல்பாகக் காக்கிறது.
- source_word: פִּי יְהוָה
  choice: யாவேயின் கட்டளையை
  rationale: நேர்சொல்லாக ‘யாவேயின் வாய்’ என்ற எபிரெய மரபுத்தொடர், யாவே கூறிய கட்டளையைக் குறிக்கிறது. இச்சூழலில் ‘கட்டளை’ என்பது அதன் பொருளைத் தெளிவாக்குகிறது; நேரடி வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரான நான்கு எபிரெய எழுத்துகளின் பெயரொலி தமிழில் ‘யாவே’ என வழங்கப்படுகிறது; பொதுவான ஒரு பட்டப்பெயரால் அது மாற்றப்படவில்லை.
- source_word: דְּבָרֶיךָ
  choice: உமது வார்த்தைகள்
  rationale: இரண்டாம் நபர் ஆண்பால் ஒருமை உரிமை விகுதியுடன் வரும் பன்மை வடிவத்தை இது காக்கிறது; சாமுவேல் கூறியவற்றையே குறிக்கிறது.
- source_word: יָרֵאתִי
  choice: பயந்து
  rationale: மக்களைப் பற்றிய சவுலின் பயத்தைத் தெளிவாகவும் இயல்பான தமிழ் வாக்கிய ஓட்டத்துடனும் தெரிவிக்கிறது.
- source_word: הָעָם
  choice: மக்கள்
  rationale: இச்சொல்லின் வழக்கமான விரிவான பொருள் ‘மக்கள்.’ சூழலில் போர்வீரர்களும் உட்படலாம்; ஆனால் ‘படை’ என்று குறுக்குவது மூலத்தைவிடக் குறிப்பானதாகிவிடும்.
- source_word: וָאֶשְׁמַע בְּקוֹלָם
  choice: அவர்களுடைய குரலுக்குச் செவிகொடுத்தேன்
  rationale: ‘அவர்களுடைய குரலைக் கேட்டேன்’ என்ற எபிரெய மரபுத்தொடரின் உருவகத்தை இது காக்கிறது. இங்கு வெறுமனே கேட்டல் அல்ல, அவர்களுக்குக் கீழ்ப்படிதல் உட்பொருளாக உள்ளது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் தனிப்பட்ட தெய்வீகப் பெயர் நேரடியாக உள்ளது. அதை ஒரு பட்டப்பெயராக மாற்றாமல், பெயராகவே ஒலிபெயர்ப்பது மூல வடிவத்தைக் காக்கிறது.
- issue: פִּי יְהוָה என்ற மரபுத்தொடர்
  choice: யாவேயின் கட்டளை
  alternative: யாவேயின் வாய்
  rationale: ‘வாய்’ என்பது எபிரெய நேர்சொல் வடிவம்; இங்கு யாவே உரைத்த குறிப்பிட்ட ஆணையையே அது குறிக்கிறது. பொருள் தெளிவுக்காக ‘கட்டளை’ முதன்மை உரையில் தரப்பட்டு, நேர்சொல் வடிவம் அடிக்குறிப்பில் வைக்கப்பட்டுள்ளது.
- issue: சவுல் கூறும் காரணத்தின் தன்மை
  choice: அவனது சொந்த விளக்கமாகவே மொழிபெயர்த்தல்
  alternative: அவனது பயத்தை நியாயமான காரணமாக விளக்குதல்
  rationale: כִּי தொடர்கள் சவுலின் ஒப்புக்கொள்ளுதலையும் அவன் கூறும் காரணத்தையும் இணைக்கின்றன. மொழிபெயர்ப்பு அவனது வார்த்தைகளைப் பதிவு செய்கிறது; அவனது காரணத்தை ஏற்றுக்கொள்ளவோ நிராகரிக்கவோ கூடுதல் விளக்கம் சேர்க்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில் மரியாதையும் எளிமையும் இணைந்த நடை பயன்படுத்தப்பட்டுள்ளது. சாமுவேலை நோக்கிய ஒருமை மரியாதை வடிவமாக ‘உமது’ தேர்ந்தெடுக்கப்பட்டுள்ளது. ‘குரலுக்குச் செவிகொடுத்தேன்’ என்பது எபிரெய உருவகத்தையும் தமிழின் இயல்பான வேதாகமச் சொல்லாட்சியையும் காக்கிறது.
