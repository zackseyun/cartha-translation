  text: Saul came to the city of Amalek and lay in wait in the wadi[a][b][c].
translation:
  language: ta
  text: சவுல் அமாலேக்கின் நகரம் வரை வந்து, நீரோடைப் பள்ளத்தில் பதுங்கிக் காத்திருந்தார்[a][b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நீரோடைப் பள்ளத்தில் பதுங்கித் தாக்குவதற்காகக் காத்திருந்தார்.” இங்குள்ள எபிரெய வினை புரிந்துகொள்வதற்குக் கடினமானது; “போராடினார்” அல்லது “மோதினார்” என்றும் இதைப் புரிந்துகொண்டுள்ளனர். ஆனால் சூழல் பதுங்கித் தாக்கும் பொருளை ஆதரிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: “நீரோடைப் பள்ளம்” என்பது மழைக்காலத்தில் மட்டும் நீர் ஓடக்கூடிய நீரோடைப் படுகை அல்லது பள்ளத்தாக்கைக் குறிக்கிறது.
    reason: cultural_note
  - marker: c
    text: அல்லது, “அமாலேக்கியரின் நகரம்.”
    reason: alternative_reading
lexical_decisions:
- source_word: וַיָּבֹא
  choice: வந்து
  rationale: בוא என்பது பார்வைக்கோணத்தைப் பொறுத்து ‘வருதல்/செல்லுதல்/அடைதல்’ எனப் பொருள்படும்; இலக்கை நோக்கிய தொடர்ச்சியான நகர்வை இங்கு ‘வந்து’ இயல்பாகத் தெரிவிக்கிறது.
- source_word: עַד
  choice: நகரம்வரை
  rationale: இலக்குடன் வரும் עַד ‘வரை/அளவுக்கு’ என்ற எல்லைப் பொருளைக் கொண்டது; தமிழில் வினையுடன் இணைந்த ‘நகரம்வரை வந்து’ மூலத்தின் நுணுக்கத்தைத் தெளிவாகக் காக்கிறது.
- source_word: עִיר עֲמָלֵק
  choice: அமாலேக்கின் நகரம்
  rationale: இது எபிரெயக் கட்டுப்பெயர்த் தொடரின் நேரடியான வடிவம். עֲמָלֵק மக்கள் குழுவையும் குறிக்கக்கூடும் என்பதால் மாற்று வாசிப்பு அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: וַיָּרֶב
  choice: பதுங்கியிருந்தார்
  rationale: இந்த எபிரெய வினை கடினமானது; ‘போராடினார்/மோதினார்’ என்றும் புரிந்துகொள்ளலாம். ஆனால் இராணுவச் சூழலும் பழைய மொழிபெயர்ப்பு மரபும் பதுங்கித் தாக்கக் காத்திருக்கும் பொருளை ஆதரிக்கின்றன; ‘பதுங்கியிருந்தார்’ செயலை மிகையாக விவரிக்காமல் அதைத் தெரிவிக்கிறது.
- source_word: בַּנָּחַל
  choice: ஓடைக்குப் பள்ளத்தாக்கில்
  rationale: נחל என்பது மழைக்காலத்தில் நீர் ஓடக்கூடிய, மற்ற காலங்களில் வறண்டிருக்கக்கூடிய நீரோடைப் படுகை அல்லது பள்ளத்தாக்கைக் குறிக்கும். ‘ஓடைக்குப் பள்ளத்தாக்கு’ தமிழ்வாசகருக்கு நில அமைப்பைத் தெளிவாக உணர்த்துகிறது.
