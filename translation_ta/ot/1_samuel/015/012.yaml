  text: וַ/יַּשְׁכֵּ֧ם שְׁמוּאֵ֛ל לִ/קְרַ֥את שָׁא֖וּל בַּ/בֹּ֑קֶר וַ/יֻּגַּ֨ד לִ/שְׁמוּאֵ֜ל לֵ/אמֹ֗ר בָּֽא שָׁא֤וּל הַ/כַּרְמֶ֨לָ/ה֙ וְ/הִנֵּ֨ה מַצִּ֥יב ל/וֹ֙ יָ֔ד וַ/יִּסֹּב֙ וַֽ/יַּעֲבֹ֔ר וַ/יֵּ֖רֶד הַ/גִּלְגָּֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/012.yaml
  text: Samuel rose early in the morning to meet Saul[a], and it was reported to Samuel, saying, “Saul came to Carmel, and look, he has set up a monument for himself; then he turned and passed on and went down to Gilgal.”
translation:
  language: ta
  text: சவுலைச் சந்திப்பதற்காகச் சாமுவேல் காலையிலேயே எழுந்தார். அப்போது சாமுவேலுக்கு, “சவுல் கர்மேலுக்கு வந்தான்; இதோ, அவன் தனக்காக ஒரு நினைவுத்தூணை[a] நிறுவியிருக்கிறான். பின்பு அவன் திரும்பி, தொடர்ந்து சென்று, கில்காலுக்குக் கீழிறங்கினான்” என்று தெரிவிக்கப்பட்டது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மொழியில் சொல்லுக்குச் சொல், “தனக்காக ஒரு கை.” இங்கே “கை” என்பது நினைவுக்குறி அல்லது நினைவுத்தூணைக் குறிக்கும் மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁכֵּם ... בַּבֹּקֶר
  choice: காலையிலேயே எழுந்தார்
  rationale: எபிரெயச் சொற்றொடர் அதிகாலையில் அல்லது காலையிலேயே எழுவதைக் குறிக்கிறது. தமிழில் தேவையற்ற மறுபடியுரைத்தலைத் தவிர்த்து நேர வலியுறுத்தலை இயல்பாகத் தருகிறது.
- source_word: לִקְרַאת
  choice: சந்திப்பதற்காக
  rationale: ל முன்னொட்டுடன் வரும் இச்சொல் நோக்கத்தைக் குறிக்கிறது; சாமுவேல் எழுந்ததன் நோக்கம் சவுலைச் சந்திப்பதே என்பதைத் தெளிவாகக் காட்டுகிறது.
- source_word: וַיֻּגַּד לִשְׁמוּאֵל לֵאמֹר
  choice: சாமுவேலுக்கு ... என்று தெரிவிக்கப்பட்டது
  rationale: எபிரெய மொழியின் செயப்பாட்டு வடிவத்தைப் பேணி, செய்தியைத் தெரிவித்தவர் யார் என்பதைச் சேர்க்காமல் விடுகிறது; தமிழில் இயல்பான நேரடி உரை அமைப்பாக உள்ளது.
- source_word: בָּא שָׁאוּל הַכַּרְמֶלָה
  choice: சவுல் கர்மேலுக்கு வந்தான்
  rationale: இடத்தை நோக்கிய இயக்கத்தைக் குறிக்கும் திசை வடிவத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: וְהִנֵּה
  choice: இதோ
  rationale: கவனத்தை ஈர்க்கும் எபிரெய உரையாடல் துகளின் சுட்டும் வலிமையை, நவீனமும் கண்ணியமுமான தமிழில் தக்கவைக்கிறது.
- source_word: מַצִּיב
  choice: நிறுவியிருக்கிறான்
  rationale: הִנֵּה என்பதற்குப் பின் வரும் பங்கேற்புவினை, நிகழ்வின் தெளிவான தற்போதைய விளைவை உணர்த்தலாம்; தமிழ் நிறைவுநிலை வடிவம் அந்த நுணுக்கத்தை இயல்பாகத் தருகிறது.
- source_word: יָד
  choice: நினைவுத்தூண்
  rationale: சொல்லுக்குச் சொல் பொருள் ‘கை’ என்றாலும், இச்சூழலில் தனக்காக அமைக்கப்பட்ட நினைவுச் சின்னம் அல்லது தூணைக் குறிக்கும் மரபுத்தொடராகும்.
- source_word: לּוֹ
  choice: தனக்காக
  rationale: சவுல் தன் பெருமைக்காக அல்லது தன்னை நினைவுகூரும் வகையில் அதை நிறுவினான் என்ற தன்மறிச் சுட்டை வெளிப்படுத்துகிறது.
- source_word: וַיִּסֹּב וַיַּעֲבֹר
  choice: திரும்பி, தொடர்ந்து சென்று
  rationale: திரும்புதல் மற்றும் அங்கிருந்து பயணத்தைத் தொடருதல் ஆகிய வரிசையான இரு இயக்கங்களையும் தனித்தனியாகப் பேணுகிறது.
- source_word: וַיֵּרֶד הַגִּלְגָּל
  choice: கில்காலுக்குக் கீழிறங்கினான்
  rationale: ירד என்பதிலுள்ள நிலவியல் இறக்கத்தின் நுணுக்கத்தையும் இலக்கை நோக்கிய இயக்கத்தையும் தக்கவைக்கிறது.
