translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான வரலாற்று உரைநடை பயன்படுத்தப்பட்டுள்ளது. செய்தியைக் கூறியவர் குறிப்பிடப்படாத செயப்பாட்டு அமைப்பும், ‘இதோ’ என்ற கவன ஈர்ப்பும், பயண வினைகளின் வரிசையும் பாதுகாக்கப்பட்டுள்ளன.
