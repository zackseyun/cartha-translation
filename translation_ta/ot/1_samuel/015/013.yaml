source:
  edition: WLC
  text: וַ/יָּבֹ֥א שְׁמוּאֵ֖ל אֶל שָׁא֑וּל וַ/יֹּ֧אמֶר ל֣/וֹ שָׁא֗וּל בָּר֤וּךְ אַתָּה֙ לַֽ/יהוָ֔ה הֲקִימֹ֖תִי אֶת דְּבַ֥ר יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/013.yaml
  text: Then Samuel came to Saul[a], and Saul said to him, “Blessed are you to Yahweh[b]; I have carried out the word of Yahweh.”
translation:
  language: ta
  text: பின்பு சாமுவேல் சவுலிடம் வந்தார். சவுல் அவரிடம், “யாவேயால் நீங்கள் ஆசீர்வதிக்கப்பட்டவர்.[a] யாவேயின் வார்த்தையை நான் நிறைவேற்றிவிட்டேன்[b]” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யாவே உங்களை ஆசீர்வதிப்பாராக.” எபிரெயத்தில் இது ஓர் ஆசிவாழ்த்துச் சூத்திரம்; சொற்சொல்லாக, “யாவேயால் ஆசீர்வதிக்கப்பட்டவர் நீங்கள்.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “செயல்படுத்தினேன்” அல்லது “நடைமுறைப்படுத்தினேன்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא שְׁמוּאֵל אֶל שָׁאוּל
  choice: பின்பு சாமுவேல் சவுலிடம் வந்தார்
  rationale: בוא என்பது இங்கு சவுல் இருந்த இடத்திற்குச் சாமுவேல் வந்ததைச் சொல்லும் எளிய கதைநடை வினை. தமிழில் இயல்பான தொடர்ச்சிக்காக וַ־ என்பதை “பின்பு” என வழங்கியுள்ளோம்.
- source_word: וַיֹּאמֶר לוֹ שָׁאוּל
  choice: சவுல் அவரிடம் … என்றான்
  rationale: לוֹ என்ற மறைமுகச் செயப்படுபொருளை “அவரிடம்” என வெளிப்படையாக வைத்துள்ளோம். சாமுவேலைக் குறிக்க மரியாதைப் பன்மையும், கதைநடையில் சவுலைக் குறிக்க ஒருமையும் பயன்படுத்தப்பட்டுள்ளன.
- source_word: בָּרוּךְ אַתָּה לַיהוָה
  choice: யாவே உங்களை ஆசீர்வதிப்பாராக
  rationale: எபிரெய ஆசிவாழ்த்துச் சூத்திரத்தின் கருத்தை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது. לַיהוָה என்பதன் உறவைத் தமிழில் மரத்தனமாக “யாவேக்கு” என்று தராமல், யாவேயை ஆசீர்வாதத்தின் மூலமாகக் காட்டுகிறது; மேலும் நேரடியான வடிவம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: יְהוָה
  choice: யாவே
  rationale: நான்கு எழுத்துத் தெய்வீகப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் பரவலாகப் புரிந்துகொள்ளக்கூடிய ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: הֲקִימֹתִי
  choice: நான் நிறைவேற்றிவிட்டேன்
  rationale: קום என்பதன் ஹிஃபீல் வடிவம், “வார்த்தை” என்பதுடன் இங்கு அதைச் செயல்படுத்துதல் அல்லது நடைமுறைப்படுத்துதல் என்ற பொருளைக் கொடுக்கிறது. “நிறைவேற்றிவிட்டேன்” என்பது சவுலின் முழு கீழ்ப்படிதல் குறித்த வலுவான கூற்றையும் முடிவுற்ற செயலையும் இயல்பாகத் தெரிவிக்கிறது.
- source_word: דְּבַר יְהוָה
  choice: யாவேயின் வார்த்தை
  rationale: דָּבָר இச்சூழலில் கட்டளையைக் குறித்தாலும், “வார்த்தை” என்ற விரிவான எபிரெயச் சொல்லாட்சியைப் பாதுகாக்கிறது; அது கட்டளை என்பதைச் சூழல் தெளிவாக்குகிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரை வழங்குதல்
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூல உரையில் தனிப்பட்ட தெய்வீகப் பெயர் நேரடியாக உள்ளது. அதை ஒரு பட்டமாக மாற்றாமல் ஒலிபெயர்ப்பது மூலத்தின் வேறுபாட்டைப் பாதுகாக்கிறது.
- issue: சவுலின் கீழ்ப்படிதல் குறித்த கூற்றை உரையாசிரியர் தீர்ப்பாக மாற்றாமல் வைத்தல்
  choice: “நான் நிறைவேற்றிவிட்டேன்” என்ற சவுலின் முழுமையான கூற்றைப் பாதுகாத்தல்
  alternative: “நிறைவேற்ற முயன்றேன்” அல்லது பகுதியளவு நிறைவேற்றியதாக மெலிதாக்குதல்
  rationale: இந்த வசனம் சவுலின் கூற்றை அப்படியே பதிவு செய்கிறது; அடுத்துவரும் கதை அந்தக் கூற்றை மதிப்பிடுகிறது. மொழிபெயர்ப்பு அந்த இறையியல் பதற்றத்தை முன்கூட்டியே தீர்க்கக்கூடாது.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. சாமுவேலை நோக்கிய நேரடி உரையில் “உங்களை” என்ற மரியாதை வடிவம் உள்ளது. தெய்வீகப் பெயர் “யாவே” என ஒரேமுறையாக வழங்கப்பட்டுள்ளது; மூலத்தின் ஆசிவாழ்த்துச் சூத்திரமும் சவுலின் வலுவான தன்னறிக்கையும் அடிக்குறிப்புகளுடன் பாதுகாக்கப்பட்டுள்ளன.
