base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/016.yaml
  text: Then Samuel said to Saul[a], “Stop, and I will tell you what Yahweh said to me last night.” And he said to him, “Speak.”
translation:
  language: ta
  text: அப்போது சாமுவேல் சவுலிடம், “நிறுத்து! கடந்த இரவில் யாவே என்னிடம் சொன்னதை உனக்குச் சொல்கிறேன்” என்றார். அதற்கு சவுல்[a], “சொல்லுங்கள்” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய எழுத்து வடிவத்தில், “அவர்கள் அவனிடம் சொன்னார்கள்” என்று பன்மையில் உள்ளது; ஆனால் சூழலின்படி பேசுபவர் சவுல் என்பதால் பொருள் ஒருமையாக, “அவன் … என்றான்” என்று கொள்ளப்படுகிறது.
    reason: textual_variant
lexical_decisions:
- source_word: הֶרֶף
  choice: நிறுத்து!
  rationale: רפה என்பதன் கட்டளை வடிவம் இங்கு பேசுவதை அல்லது செயலை உடனடியாக நிறுத்தும்படி கூறும் கடுமையான கட்டளையாக உள்ளது; ‘நிறுத்து!’ என்பது அந்தத் தொனியை இயல்பாகத் தருகிறது.
- source_word: וְאַגִּידָה לְּךָ
  choice: உனக்குச் சொல்கிறேன்
  rationale: נגד என்பதன் ஹிஃபில் வடிவம் ‘அறிவி/சொல்’ என்ற பொருளுடையது. முன்வரும் கட்டளையுடன் இணைந்து சாமுவேலின் உடனடியான நோக்கத்தை நவீன தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: אֵת אֲשֶׁר דִּבֶּר
  choice: சொன்னதை
  rationale: இறைவன் கூறிய செய்தியின் உள்ளடக்கத்தை அறிமுகப்படுத்தும் எபிரெயக் கட்டமைப்பைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: நான்கு எழுத்துகளைக் கொண்ட இறைப் பெயரை ஒரு பொதுப்பட்டமாக மாற்றாமல், தமிழில் பரவலாக அறியப்படும் தனிப்பெயர் வடிவில் வழங்குகிறது.
- source_word: הַלָּיְלָה
  choice: கடந்த இரவில்
  rationale: முன்வரும் நிறைவேற்றப்பட்ட வினையுடன் இது கதைநேரத்திற்கு முந்திய இரவைக் குறிக்கிறது.
- source_word: ויאמרו לו
  choice: அதற்கு அவன் … என்றான்
  rationale: எழுதப்பட்ட மெய்யெழுத்து வடிவம் பன்மையாக இருந்தாலும், சூழலில் பதிலளிப்பவர் சவுல் ஒருவரே; ஆகவே ஒருமைப் பொருள் முதன்மை உரையில் தரப்பட்டு, எழுத்து வடிவ வேறுபாடு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: דַּבֵּר
  choice: சொல்லுங்கள்
  rationale: சாமுவேலைத் தொடர்ந்து பேசும்படி அழைக்கும் சுருக்கமான கட்டளை. சவுல் சாமுவேலிடம் பேசுவதால் தமிழின் இயல்பான மரியாதைப் பன்மை பயன்படுத்தப்பட்டுள்ளது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரின் மொழிபெயர்ப்பு
  choice: யெகோவா
  alternative: யாவே / கர்த்தர்
  rationale: மூலத்தில் உள்ள தனிப்பெயரை ஒரு பட்டத்தால் மாற்றாமல் பாதுகாக்கிறது. தமிழில் அறிமுகமான ஒலிபெயர்ப்பைத் தேர்ந்தெடுப்பது எந்தத் தனிப்பட்ட பிரிவின் கோட்பாட்டையும் உரையில் சேர்ப்பதற்காக அல்ல.
translation_notes:
  register: நவீனத் தரத் தமிழ்; சாமுவேலின் கண்டிப்பான தொனிக்காக ‘நிறுத்து!’ என்றும், சவுலின் பதிலில் இயல்பான மரியாதைக்காக ‘சொல்லுங்கள்’ என்றும் வழங்கப்பட்டுள்ளது. மூலத்தின் சுருக்கமும் நேரடித்தன்மையும் காக்கப்பட்டுள்ளன.
