  text: Then Yahweh called to Samuel[a], and he said, “Here I am.”
translation:
  language: ta
  text: அப்போது யாவே சாமுவேலை அழைத்தார். அவன், “இதோ, நான் இருக்கிறேன்” என்றான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: கூப்பிட்டார்
  rationale: קרא என்பதன் Qal wayyiqtol வடிவம்; இச்சூழலில் கேட்கக்கூடிய அழைப்பை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: தெய்வீகப் பெயரான நான்கு எழுத்துப் பெயரை ஒரு பட்டமாக மாற்றாமல், தமிழில் பரவலாக அறியப்படும் பெயர்வடிவில் தருகிறது; 'யாவே' என்பதும் மாற்று ஒலிபெயர்ப்பு.
- source_word: אֶל שְׁמוּאֵל
  choice: சாமுவேலை
  rationale: אֶל அழைப்பின் பெறுநரைக் குறிக்கிறது; தமிழ் வினையமைப்பில் செயப்படுபொருள் வேற்றுமை இயல்பாக அமைகிறது.
- source_word: וַיֹּאמֶר
  choice: அதற்கு அவன் … என்றான்
  rationale: אמר என்பதன் தொடர்கதை வடிவம். எபிரெயத்தில் எழுவாய் வெளிப்படையாக இல்லாவிட்டாலும், மறுமொழியின் சூழலால் அது சாமுவேல் எனப் புரிகிறது; 'அவன்' இதைத் தெளிவாக்குகிறது.
- source_word: הִנֵּנִי
  choice: இதோ, நான் இருக்கிறேன்
  rationale: தன் இருப்பையும் உடனடி பதிலளிக்கும் தயார் நிலையையும் காட்டும் எபிரெய மறுமொழிச் சூத்திரத்தை, அதன் 'இதோ' கூறையும் காத்து இயல்பான தமிழில் தருகிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரை மொழிபெயர்த்தல்
  choice: யெகோவா
  alternative: யாவே; கர்த்தர்
  rationale: மூலத்தில் தனிப்பட்ட தெய்வீகப் பெயர் நேரடியாக உள்ளது. அதை 'கர்த்தர்' என்ற பட்டத்தால் மாற்றாமல் பெயராகவே வழங்கப்படுகிறது; உச்சரிப்பு மறுகட்டமைப்பின் வேறுபாடு அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
- issue: וַיֹּאמֶר என்பதன் மறைமுக எழுவாய்
  choice: சாமுவேலைக் குறிக்கும் 'அவன்'
  alternative: எழுவாயைக் குறிப்பிடாமல் 'என்றார்/என்றான்' என மட்டும் தருதல்
  rationale: அடுத்த வசனத்தில் சாமுவேல் ஏலியிடம் ஓடிச் செல்வதாலும், הִנֵּנִי என்பது அழைக்கப்பட்டவரின் பதிலாக இருப்பதாலும், பேசுபவன் சாமுவேல் என்பது சூழலில் தெளிவு. தெய்வீகப் பேச்சாகத் தவறாகப் புரிவதை இது தவிர்க்கிறது.
translation_notes:
  register: நவீன, கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் தமிழ். கதைத் தொடரை 'அப்போது' காட்டுகிறது; சாமுவேலின் பதிலில் மூலத்தின் மரியாதைமிக்க வேதாகமத் தொனி காக்கப்படுகிறது.
