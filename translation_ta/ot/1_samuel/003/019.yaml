  yaml_path: translation/ot/1_samuel/003/019.yaml
  text: And Samuel grew[a], and Yahweh was with him and let none of his words fall to the ground.
translation:
  language: ta
  text: சாமுவேல் வளர்ந்துவந்தான். யாவே அவனோடு இருந்தார்; அவனுடைய வார்த்தைகளில் ஒன்றையும் தரையில் விழவிடவில்லை.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அதாவது, ‘அவனுடைய வார்த்தைகளில் ஒன்றையும் பொய்த்துப்போக விடவில்லை.’ எபிரெய மரபுத்தொடரின் நேரடிப் பொருள், ‘அவனுடைய வார்த்தைகளில் ஒன்றையும் தரையில் விழவிடவில்லை’ என்பதாகும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגְדַּל
  choice: வளர்ந்துவந்தான்
  rationale: גדל இங்கு சாமுவேலின் தொடர்ந்த வளர்ச்சியையும் முதிர்ச்சியையும் குறிக்கிறது. ‘வளர்ந்துவந்தான்’ என்பது உடல் வளர்ச்சிக்கு மட்டும் அல்லது பெருமை அடைந்ததற்கு மட்டும் பொருளைக் குறுக்காமல் இயல்பாகத் தெரிவிக்கிறது.
- source_word: שְׁמוּאֵל
  choice: சாமுவேல்
  rationale: தமிழில் வழக்கிலுள்ள தனிப்பெயர் வடிவம்.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய மூலத்தில் வரும் தேவனுடைய தனிப்பெயரை ஒரு பட்டத்தால் மாற்றாமல் ஒலிபெயர்த்துள்ளது.
- source_word: הָיָה עִמּוֹ
  choice: அவனோடு இருந்தார்
  rationale: தேவனுடைய உடனிருப்பையும் ஆதரவையும் வெளிப்படுத்தும் எபிரெய சொல்லமைப்பை இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: וְלֹא הִפִּיל
  choice: விழவிடவில்லை
  rationale: 'נפל என்பதன் ஹிஃபில் வினைவடிவிலுள்ள காரணவினை நுட்பத்தைத் தக்கவைக்கிறது: யாவே அவற்றை விழ அனுமதிக்கவில்லை.'
- source_word: מִכָּל דְּבָרָיו
  choice: அவனுடைய வார்த்தைகளில் ஒன்றையும்
  rationale: ‘அவனுடைய எல்லா வார்த்தைகளிலிருந்தும் ஒன்றையும் இல்லை’ என்ற எபிரெயப் பொருளைத் தெளிவான தமிழில் தருகிறது; ‘தீர்க்கதரிசனங்கள்’ என்று பொருளைக் குறுக்கவில்லை.
- source_word: אָרְצָה
  choice: தரையில்
  rationale: ‘தரையை நோக்கி’ என்ற திசைப்பொருளை, தமிழில் இயல்பான ‘தரையில் விழுதல்’ என்ற உருவகத் தொடராக வழங்குகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூல உரை ஒரு பொதுப் பட்டத்தை அல்ல, நான்கு எழுத்துகளைக் கொண்ட இறைத்தனிப்பெயரைப் பயன்படுத்துகிறது. ஆகவே தனிப்பெயர் ஒலிபெயர்க்கப்பட்டுள்ளது.
- issue: ‘அவனுடைய வார்த்தைகளில் ஒன்றையும் தரையில் விழவிடவில்லை’ என்ற மரபுத்தொடரின் பொருள்
  choice: எபிரெய உருவகத்தை முதன்மை உரையில் தக்கவைத்தல்
  alternative: அவனுடைய வார்த்தைகளில் ஒன்றையும் பொய்த்துப்போக விடவில்லை
  rationale: சூழல் சாமுவேலின் தீர்க்கதரிசன நம்பகத்தன்மையைச் சுட்டினாலும், மூல உரையின் விரிவான மற்றும் உயிரோட்டமுள்ள உருவகத்தைச் சுருக்கி ‘தீர்க்கதரிசனங்கள் நிறைவேறின’ என்று விளக்கவில்லை. அதன் கருத்தை அடிக்குறிப்பு தெளிவுபடுத்துகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையும் கண்ணியமும் கொண்ட நடையைப் பயன்படுத்துகிறது. எபிரெய இணைப்புத் தொடர்களை அப்படியே மிகைப்படுத்தாமல், வாக்கியப் பிரிப்பும் அரைப்புள்ளியும் கொண்டு இயல்பான தமிழாக்கம் செய்யப்பட்டுள்ளது; மூல உருவகம் பாதுகாக்கப்பட்டுள்ளது.
