  text: וְ/הַ/נַּ֧עַר שְׁמוּאֵ֛ל מְשָׁרֵ֥ת אֶת יְהוָ֖ה לִ/פְנֵ֣י עֵלִ֑י וּ/דְבַר יְהוָ֗ה הָיָ֤ה יָקָר֙ בַּ/יָּמִ֣ים הָ/הֵ֔ם אֵ֥ין חָז֖וֹן נִפְרָֽץ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/003/001.yaml
  text: The boy Samuel was ministering to Yahweh before Eli[a], and the word of Yahweh was rare in those days; visions were not widespread.
translation:
  language: ta
  text: சிறுவன் சாமுவேல் ஏலியின் முன்னிலையில் யாவேவுக்குப் பணிவிடை செய்துகொண்டிருந்தான்; அந்நாட்களில் யாவேயின் வார்த்தை அரிதாயிருந்தது; தரிசனங்கள் பரவலாக நிகழவில்லை[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “தரிசனம் அடிக்கடி நிகழவில்லை” அல்லது “தரிசனம் உடைத்துக்கொண்டு வெளிப்படவில்லை” என்றும் மொழிபெயர்க்கலாம். வெளிப்படுத்தும் தரிசனங்கள் அரிதாக இருந்தன; அவை பொதுவாக நிகழவில்லை என்பதே இந்த எபிரெய மொழிவழக்கின் கருத்து.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/הַ/נַּעַר
  choice: சிறுவனான
  rationale: הַנַּעַר என்பது சிறுவன் அல்லது இளைஞன் எனப் பொருள்படும்; இக்கதைச் சூழலில் சாமுவேலின் வயதுநிலைக்கு “சிறுவன்” பொருத்தமானது. தொடக்க וְ தனியாக மொழிபெயர்க்கப்படாமல் இயல்பான தமிழ் உரைநடையில் இணைக்கப்படுகிறது.
- source_word: מְשָׁרֵת
  choice: பணிவிடை செய்துகொண்டிருந்தான்
  rationale: எபிரெயப் பங்கேற்புவினை தொடர்ச்சியான செயலைக் குறிக்கிறது. “பணிவிடை” என்பது சாதாரண சேவையையும் விட இங்குள்ள வழிபாட்டிடச் சேவையின் நுட்பத்தைக் காக்கிறது.
- source_word: אֶת יְהוָה
  choice: யாவேக்குப்
  rationale: מְשָׁרֵת என்பதுடன், யாருக்குப் பணிவிடை செய்தான் என்பதை אֶת குறிக்கிறது. יְהוָה என்ற உடன்படிக்கைப் பெயர் “யாவே” என ஒலிபெயர்க்கப்படுகிறது.
- source_word: לִפְנֵי עֵלִי
  choice: ஏலியின் முன்னிலையில்
  rationale: לִפְנֵי என்பதன் நேரடிப் பொருள் “முன்னிலையில்.” இது ஏலியின் மேற்பார்வையின் கீழ் சாமுவேல் சேவை செய்தான் என்ற சூழற்பொருளையும் திறந்தவாறு வைத்திருக்கிறது.
- source_word: וּ/דְבַר יְהוָה
  choice: யாவேயின் வார்த்தை
  rationale: தெய்வீக வெளிப்பாட்டைக் குறிக்கும் எபிரெயச் சொற்றொடரின் வடிவத்தையும் வேதாகம வழக்கையும் தெளிவாகப் பேணுகிறது.
- source_word: יָקָר
  choice: அரிதாயிருந்தது
  rationale: יָקָר என்பதற்கு “விலையேறப்பெற்றது” என்ற பொருளும் உண்டு; ஆனால் வெளிப்பாடு கிடைப்பதன் குறைவைப் பேசும் இச்சூழலில் “அரிது” என்பதே பொருத்தமானது.
- source_word: בַּ/יָּמִים הָ/הֵם
  choice: அந்நாட்களில்
  rationale: காலத்தைக் குறிக்கும் எபிரெயச் சொற்றொடரின் இயல்பான, சுருக்கமான தமிழ் இணை.
- source_word: אֵין חָזוֹן נִפְרָץ
  choice: தரிசனம் பரவலாக வெளிப்படவில்லை
  rationale: חָזוֹן என்பது வெளிப்படுத்தும் தரிசனத்தைக் குறிக்கிறது; נִפְרָץ என்பதில் உடைத்துப் புறப்படுதல் அல்லது பரவுதல் என்ற படிமம் உள்ளது. இந்த மொழிபெயர்ப்பு, அத்தகைய தரிசனம் பொதுவாக நிகழவில்லை என்ற மொழிவழக்குப் பொருளைக் காக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலத்தில் நான்கெழுத்து இறைப்பெயர் நேரடியாக வருகிறது. அதனை ஒரு பட்டப்பெயராக மாற்றாமல், உடன்படிக்கைப் பெயராக “யாவே” என்று ஒலிபெயர்ப்பது மூலவடிவத்தை வெளிப்படையாகக் காக்கிறது.
- issue: לִפְנֵי עֵלִי குறிக்கும் உறவு
  choice: ஏலியின் முன்னிலையில்
  alternative: ஏலியின் கீழ்
  rationale: “ஏலியின் கீழ்” என்பது மேற்பார்வை என்ற சூழற்பொருளைத் தெளிவாக்கினாலும், மூலத்தின் இடவியல் மற்றும் உறவியல் இருபொருள் வாய்ப்பைச் சுருக்கிவிடும். “முன்னிலையில்” அந்தத் திறப்பைப் பேணுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான வேதாகம உரைநடை பயன்படுத்தப்பட்டுள்ளது. “பணிவிடை செய்துகொண்டிருந்தான்” தொடர்ச்சியான செயலைக் காட்டுகிறது; “தரிசனம் பரவலாக வெளிப்படவில்லை” என்பது மூல உருவகத்தையும் இயல்பான பொருளையும் சமநிலைப்படுத்துகிறது. அடிக்குறிப்புக் குறி அதற்குரிய தரிசனச் சொற்றொடருக்குப் பின்னர் வைக்கப்பட்டுள்ளது.
