base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/003/013.yaml
  text: And I have declared to him that I am judging his house forever for the iniquity that he knew[a], because his sons were cursing God, and he did not restrain them.
translation:
  language: ta
  text: அவன் அறிந்திருந்த அக்கிரமத்தினிமித்தமாக, அவனுடைய வீட்டின்மேல் என்றென்றும் தீர்ப்பளிக்கிறேன் என்று அவனுக்கு அறிவித்தேன். அவனுடைய மகன்கள் தங்களுக்கே சாபத்தை வரவழைத்துக்கொண்டிருந்தார்கள்[a]; அவனோ அவர்களைக் கட்டுப்படுத்தவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சில பண்டைய சாட்சிகளும் பல மொழிபெயர்ப்புகளும், “அவனுடைய மகன்கள் கடவுளைச் சபித்துக்கொண்டிருந்தார்கள்” அல்லது “கடவுளைத் தூஷித்துக்கொண்டிருந்தார்கள்” என்று வாசிக்கின்றன.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהִגַּדְתִּי
  choice: அவனுக்கு அறிவித்தேன்
  rationale: נגד என்பதன் ஹிஃபில் வடிவம் ஒன்றைத் தெரியப்படுத்துதல் அல்லது அறிவித்தல் எனப் பொருள்படும். நிறைவுற்ற செயலை இயல்பான நவீனத் தமிழில் இறந்தகாலமாக வழங்குகிறது.
- source_word: שֹׁפֵט אֲנִי
  choice: நியாயந்தீர்க்கிறேன்
  rationale: வெளிப்படையான முதலாம் நபர் சுட்டுப்பெயருடன் வரும் பங்கேற்புவினை, நடந்துகொண்டிருக்கும் அல்லது நெருங்கிய தீர்ப்புச் செயலைக் குறிக்கலாம். நிகழ்கால வடிவம் அதன் உடனடித் தீவிரத்தைப் பாதுகாக்கிறது.
- source_word: בֵּיתוֹ
  choice: அவனுடைய வீட்டை
  rationale: ‘வீடு’ என்ற எபிரெய மரபுத்தொடர் வீட்டாரையும் குடும்ப வழியையும் உள்ளடக்கக்கூடும். ‘குடும்பம்’ அல்லது ‘வம்சம்’ என்று குறுக்காமல் அதன் விரிவைத் தக்கவைக்கிறது.
- source_word: עַד עוֹלָם
  choice: என்றென்றும்
  rationale: நீடித்த கால அளவையும் தீர்ப்பின் கடுமையையும் இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: בַּעֲוֺן
  choice: அக்கிரமத்துக்காக
  rationale: עָוֹן என்பது பாவமான குற்றத்தையும் அதனுடன் தொடர்புடைய குற்றப்பழியையும் சுமக்கிறது; ‘அக்கிரமம்’ அதன் ஒழுக்கக் கடுமையைப் பாதுகாக்கிறது.
- source_word: אֲשֶׁר יָדַע
  choice: அவன் அறிந்திருந்த
  rationale: ஏலியின் பொறுப்புக்குரிய அறிவை நேரடியாகக் காட்டுகிறது; முன்பே அவனுக்குத் தெரிந்திருந்த நிலையைத் தமிழ் இறந்தகாலத் தொடர்வடிவம் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: מְקַלְלִים לָהֶם
  choice: தங்களுக்கே சாபத்தை வரவழைத்துக்கொண்டிருந்தார்கள்
  rationale: மசோரா மெய்யெழுத்துப் பாடத்தின் ‘தங்களுக்காக/தங்கள்மீது சபித்தல்’ என்ற கடினமான, தற்சுட்டுப் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது; ‘கடவுளைச் சபித்தார்கள்’ என்ற மாற்றுப் பாடத்தை முதன்மை உரைக்குள் கொண்டுவரவில்லை.
- source_word: וְלֹא כִהָה בָּם
  choice: அவனோ அவர்களைக் கட்டுப்படுத்தவில்லை
  rationale: כהה என்பதன் அடிப்படை எண்ணம் மழுங்கச் செய்தல் அல்லது வலிமையைக் குறைத்தல்; இச்சூழலில் மகன்களின் நடத்தையைத் தடுக்கவோ அடக்கவோ தவறியதைக் ‘கட்டுப்படுத்தவில்லை’ தெளிவாகக் கூறுகிறது.
theological_decisions:
- issue: மகன்களின் குற்றத்தைப் பற்றிய மசோரா பாடமா, பண்டைய சாட்சிகளில் காணப்படும் மாற்றுப் பாடமா என்பதைத் தேர்வுசெய்தல்
  choice: முதன்மை உரையில் ‘தங்களுக்கே சாபத்தை வரவழைத்துக்கொண்டிருந்தார்கள்’
  alternative: ‘கடவுளைச் சபித்துக்கொண்டிருந்தார்கள்’ அல்லது ‘கடவுளைத் தூஷித்துக்கொண்டிருந்தார்கள்’
  rationale: எபிரெய மெய்யெழுத்துப் பாடம் தற்சுட்டுப் பொருளை நேரடியாக ஆதரிக்கிறது. சில பண்டைய சாட்சிகளும் பல மொழிபெயர்ப்புகளும் கடவுளைச் சபித்தல் என்ற பொருளைக் காட்டுவதால், அந்த முக்கியமான மாற்று அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: ‘அவனுடைய வீடு’ என்பதன் பரப்பு
  choice: ‘அவனுடைய வீட்டை’ என்ற எபிரெய மரபுத்தொடரைத் தக்கவைத்தல்
  alternative: ‘அவனுடைய வீட்டாரை’ அல்லது ‘அவனுடைய குடும்ப வழியை’
  rationale: இந்தச் சொல் உடனடி வீட்டாரையும் தொடரும் குடும்ப வழியையும் குறிக்கக்கூடும். குறிப்பிட்ட ஒரே பொருளாகச் சுருக்காமல் மூலத்தின் விரிவைத் தக்கவைக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பாகவும் மதிப்புறு நடையிலும் வடிவமைக்கப்பட்டது. நீண்ட எபிரெய வாக்கியம் இரண்டு தமிழ் வாக்கியங்களாகப் பிரிக்கப்பட்டுள்ளது; இதனால் காரணத் தொடர்பும் ஏலியின் அறிந்த அலட்சியமும் தெளிவாகின்றன. ‘வீடு’ என்ற வேதாகம மரபுத்தொடரும் கடினமான மசோரா பாடமும் திட்டமிட்டு பாதுகாக்கப்பட்டுள்ளன.
