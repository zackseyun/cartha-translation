  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையைப் பயன்படுத்துகிறது. ‘தொடர்ந்து தோன்றிவந்தார்’ என்பது எபிரெய தொடர்ச்சிப் பொருளை இயல்பாக வெளிப்படுத்துகிறது; ‘தம்மை வெளிப்படுத்தினார்’ என்பது மரியாதை ஒருமையையும் சுயவெளிப்பாட்டையும் காக்கிறது.
