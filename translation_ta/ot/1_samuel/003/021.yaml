  yaml_path: translation/ot/1_samuel/003/021.yaml
  text: And Yahweh continued to appear at Shiloh[a], for Yahweh revealed himself to Samuel at Shiloh by the word of Yahweh.
translation:
  language: ta
  text: யாவே சீலோவில் தொடர்ந்து தோன்றிவந்தார். ஏனெனில், யாவே சீலோவில் யாவேயின் வார்த்தையின் மூலம் சாமுவேலுக்குத் தம்மை வெளிப்படுத்தினார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யாவேயின் வார்த்தையினால்.”
    reason: בְּ என்ற முன்னொட்டு இங்கு வழிமுறை அல்லது கருவியைக் குறிக்கலாம்; ‘மூலம்’ மற்றும் ‘-ஆல்’ இரண்டும் சாத்தியமான தமிழ் வடிவங்கள்.
lexical_decisions:
- source_word: וַיֹּסֶף
  choice: தொடர்ந்து ... வந்தார்
  rationale: יָסַף + வினையெச்சத்தின் தொடர்ச்சிப் பொருளை இயல்பான தமிழில் காட்டுகிறது; வெறுமனே ‘மீண்டும்’ என்பதைக் காட்டிலும் நிகழ்வின் தொடர்ச்சியைப் பாதுகாக்கிறது.
- source_word: לְהֵרָאֹה
  choice: தோன்றிவந்தார்
  rationale: ראה என்பதன் நிஃபால் வடிவம் இங்கு தெய்வீக வெளிப்பாட்டைக் குறிக்கிறது. ‘தோன்றினார்’ என்பது அதன் இயல்பான, குறிப்பிட்ட வெளிப்பாட்டு முறையை நிர்ணயிக்காத மொழிபெயர்ப்பு.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய தனிப்பெயரான יהוה-ஐ ஒரு பட்டப்பெயராக மாற்றாமல், நவீன தமிழில் பரவலாகப் புரியக்கூடிய ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: בְשִׁלֹה / בְשִׁלוֹ
  choice: சீலோவில்
  rationale: ב இங்கு இடத்தைக் குறிக்கிறது; ‘சீலோவில்’ என்பது இயல்பான தமிழ் இடவேற்றுமை வடிவம்.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய கூற்றுக்கான விளக்கக் காரணத்தை அறிமுகப்படுத்தும் தொடர்பைத் தெளிவாகக் காட்டுகிறது.
- source_word: נִגְלָה
  choice: தம்மை ... வெளிப்படுத்தினார்
  rationale: גלה என்பதன் நிஃபால் வடிவத்திலுள்ள சுயவெளிப்பாட்டுப் பொருளைப் பாதுகாக்கிறது; לְהֵרָאֹה-க்கு பயன்படுத்தப்பட்ட ‘தோன்றுதல்’ என்பதிலிருந்து சொற்பொருள் வேறுபாட்டையும் தக்கவைக்கிறது.
- source_word: אֶל שְׁמוּאֵל
  choice: சாமுவேலுக்கு
  rationale: אֶל குறிக்கும் தொடர்பின் திசையை இயல்பான தமிழ் நான்காம் வேற்றுமையில் வழங்குகிறது.
- source_word: בִּדְבַר יְהוָה
  choice: யாவேயின் வார்த்தையின் மூலம்
  rationale: בְּ-ஐ கருவி அல்லது வழிமுறையைக் குறிப்பதாக எடுத்துக்கொண்டு, வெளிப்பாடு யாவேயின் வார்த்தையின் மூலம் வந்தது என்ற செறிவான எபிரெய அமைப்பைப் பாதுகாக்கிறது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூல உரை இறைவனுடைய தனிப்பெயரை நேரடியாகப் பயன்படுத்துவதால், அதை ஒரு பட்டப்பெயரால் மாற்றாமல் ஒலிபெயர்க்கிறது.
- issue: தெய்வீக வெளிப்பாட்டின் தன்மை
  choice: ‘தோன்றிவந்தார்’ மற்றும் ‘வார்த்தையின் மூலம் தம்மை வெளிப்படுத்தினார்’ ஆகிய இரு கூறுகளையும் தக்கவைத்தல்
  alternative: முற்றிலும் தரிசன அனுபவம் என்று குறிப்பிடுதல்; உடல்சார்ந்த இறைத்தோற்றம் என்று குறிப்பிடுதல்
  rationale: மூல உரை தோற்றத்தையும் வார்த்தையின் வழியான சுயவெளிப்பாட்டையும் இணைக்கிறது; ஆனால் அதன் துல்லியமான முறையை நிர்ணயிக்கவில்லை. மொழிபெயர்ப்பு அந்தத் திறந்த நிலையையும் இறையியல் அழுத்தத்தையும் பாதுகாக்கிறது.
