source:
  edition: WLC
  text: וַ/יֹּ֗אמֶר מָ֤ה הַ/דָּבָר֙ אֲשֶׁ֣ר דִּבֶּ֣ר אֵלֶ֔י/ךָ אַל נָ֥א תְכַחֵ֖ד מִמֶּ֑/נִּי כֹּ֣ה יַעֲשֶׂה לְּ/ךָ֤ אֱלֹהִים֙ וְ/כֹ֣ה יוֹסִ֔יף אִם תְּכַחֵ֤ד מִמֶּ֨/נִּי֙ דָּבָ֔ר מִ/כָּל הַ/דָּבָ֖ר אֲשֶׁר דִּבֶּ֥ר אֵלֶֽי/ךָ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/003/017.yaml
  text: And he said[a], “What is the word that he spoke to you? Please do not hide it from me. May God do so to you, and more also, if you hide from me a word of all the word that he spoke to you.”
translation:
  language: ta
  text: அவன், “அவர் உன்னிடம் சொன்ன வார்த்தை என்ன? தயவுசெய்து அதை என்னிடம் மறைக்காதே. அவர் உன்னிடம் சொன்ன எல்லாவற்றிலும் எதையாவது என்னிடம் மறைத்தால், கடவுள் உனக்கு இவ்வாறும் அதற்கும் மேலுமாகச் செய்யட்டும்” என்றான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'இன்னும் சொற்சார்பாக: “அவர் உன்னிடம் சொன்ன முழு வார்த்தையிலிருந்தும் ஒரு வார்த்தையையாவது என்னிடம் மறைத்தால்.”'
    reason: மூலத்தில் דָּבָר (‘வார்த்தை’) ஒருமையில் மீண்டும் வருவதையும், முழுவதிலிருந்து எதையும் மறைக்காதிருப்பதன் வலியுறுத்தலையும் காட்டும் மாற்று மொழிபெயர்ப்பு.
lexical_decisions:
- source_word: מָה הַדָּבָר
  choice: சொன்ன வார்த்தை என்ன
  rationale: דָּבָר என்பதன் ‘வார்த்தை/செய்தி’ பொருள்களில், சுற்றியுள்ள இறைபேச்சுடனான சொல்லிணைப்பைப் பேண ‘வார்த்தை’ தேர்ந்தெடுக்கப்பட்டது; தமிழில் கேள்வி இயல்பாக அமைய ‘சொன்ன வார்த்தை என்ன’ என அமைக்கப்பட்டது.
- source_word: דִּבֶּר אֵלֶיךָ
  choice: உன்னிடம் சொன்ன
  rationale: דבר என்ற வினையின் பேச்சுச் செயலைத் தெளிவாகவும் இயல்பான நவீனத் தமிழிலும் தெரிவிக்கிறது.
- source_word: אַל נָא תְכַחֵד מִמֶּנִּי
  choice: தயவுசெய்து அதை என்னிடமிருந்து மறைக்காதே
  rationale: כחד என்பதன் ‘மறைத்தல்’ பொருளையும் נָא-வின் வேண்டுகோள் நயத்தையும் பேணுகிறது; முந்தைய ‘வார்த்தை’யைக் குறிக்க ‘அதை’ இயல்பாகச் சேர்க்கப்பட்டது.
- source_word: כֹּה יַעֲשֶׂה לְּךָ אֱלֹהִים וְכֹה יוֹסִיף
  choice: கடவுள் உனக்கு அதையும் அதற்கு மேலும்கூடச் செய்யட்டும்
  rationale: இது சாபத்துடன் கூடிய நிலையான ஆணைச் சூத்திரம். குறிப்பாகச் சொல்லப்படாத தண்டனையை விரித்துரைக்காமல் அதன் கடுமையையும் திறந்த தன்மையையும் பேணுகிறது.
- source_word: אִם תְּכַחֵד מִמֶּנִּי דָּבָר מִכָּל הַדָּבָר
  choice: அவர் உன்னிடம் சொன்ன எல்லாவற்றிலும் எதையாவது என்னிடமிருந்து மறைத்தால்
  rationale: எபிரெயச் சொற்றொடரின் நோக்கம் முழுச் செய்தியிலிருந்து ஒரு சிறு பகுதியைக்கூட மறைக்கக் கூடாது என்பதாகும். சொற்கூறு மீளுரையைத் தமிழில் மரத்துப்போன நடையாக மாற்றாமல், பொருளையும் வலியுறுத்தலையும் இயல்பாகத் தருகிறது.
theological_decisions:
- issue: ஆணைச் சூத்திரத்தில் אֱלֹהִים என்பதன் மொழிபெயர்ப்பு
  choice: கடவுள்
  alternative: தெய்வங்கள்
  rationale: சூழலில் ஏலி இஸ்ரவேலின் கடவுளை முன்வைத்து நிலையான ஆணைச் சூத்திரத்தைப் பயன்படுத்துகிறார்; பன்மைத் தோற்றத்தைக் கொண்டு ‘தெய்வங்கள்’ என மொழிபெயர்ப்பது இங்கு தவறான பலதெய்வப் பொருளைத் தரும்.
- issue: தெய்வீகப் பேச்சாளரின் சுட்டுப்பெயர்
  choice: அவர்
  alternative: அவன்
  rationale: முந்தைய சூழலில் பேசினவர் கடவுள் என்பதால் மரியாதை ஒருமையான ‘அவர்’ பயன்படுத்தப்பட்டது; இது மூலத்தின் ஆண்பால் ஒருமைச் சுட்டைத் தீர்க்காமல் இயல்பான தமிழ் மரபைப் பின்பற்றுகிறது.
translation_notes:
  register: நவீன நிலையான, எளிதில் புரியும், ஆனால் கண்ணியமும் ஆணையின் கடுமையும் கொண்ட தமிழ். ஏலி சாமுவேலிடம் பேசுவதால் ஒருமை ‘நீ’ வடிவங்கள் பயன்படுத்தப்பட்டன. முதன்மை உரையில் இயல்பான தமிழுக்கு முன்னுரிமை அளித்து, எபிரெயத்தின் திட்டமிட்ட ஒருமை மீளுரை அடிக்குறிப்பில் பாதுகாக்கப்பட்டது.
