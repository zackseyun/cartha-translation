    issue: The oath phrase “கடவுள் உனக்கு அதையும் அதற்கு மேலும்கூடச் செய்யட்டும்” uses “அதையும்” without a clear Tamil antecedent.
    rationale: The Hebrew oath formula deliberately leaves the threatened act unspecified. “இவ்வாறும் அதற்கும் மேலுமாகச் செய்யட்டும்” retains that openness while reading naturally in modern Tamil.
  - severity: low
    issue: “என்னிடமிருந்து மறைக்காதே” is understandable but less idiomatic than “என்னிடம் மறைக்காதே.”
    rationale: Tamil ordinarily construes மறைத்தல் with the person from whom information is concealed as “ஒருவரிடம் மறைத்தல்”; this makes no change in meaning.
