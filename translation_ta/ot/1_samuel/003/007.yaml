base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/003/007.yaml
  text: Samuel did not yet know Yahweh[b][a], and the word of Yahweh had not yet been revealed to him.
translation:
  language: ta
  text: சாமுவேல் யாவேவை[a] இன்னும் அறிந்திருக்கவில்லை[b]; யாவேயின் வார்த்தையும் இன்னும் அவனுக்கு வெளிப்படுத்தப்படவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் YHWH; மரபாக ‘கர்த்தர்’ என்று மொழிபெயர்க்கப்படுகிறது.
    reason: alternative_reading
  - marker: b
    text: ‘சாமுவேல் யாவேவை இன்னும் அடையாளம் கண்டுகொள்ளவில்லை’ என்றும் மொழிபெயர்க்கலாம். இங்குள்ள எபிரெய ‘அறிதல்’ என்பது, குறிப்பாக இறைவெளிப்பாட்டின் சூழலில், அனுபவம் அல்லது உறவின் மூலம் அறிதலைக் குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: טֶרֶם
  choice: இன்னும் … இல்லை
  rationale: கதையின் அந்தக் கட்டத்தில் நிகழாதிருந்த நிலையைக் குறிக்கும் எபிரெய காலப் பொருளை இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: יָדַע אֶת־יְהוָה
  choice: யாவேயை அறிந்திருக்கவில்லை
  rationale: יָדַע என்பது இங்கு வெறும் தகவலறிவை மட்டுமல்லாமல் அனுபவ அல்லது உறவுசார் அறிதலையும் குறிக்கக்கூடும். ‘அறிதல்’ என்ற சொல் அந்தப் பொருள் அகலத்தையும் வசனத்தின் தெளிவின்மையையும் காக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய மெய்யெழுத்துப் பெயரான YHWH-ஐ ஒரு பட்டப்பெயரால் மாற்றாமல், தமிழில் ஒலிபெயர்த்து வழங்குகிறது.
- source_word: יִגָּלֶה
  choice: வெளிப்படுத்தப்படவில்லை
  rationale: גלה என்பதன் நிஃபால் வடிவிலுள்ள செயப்பாட்டு பொருளைத் தெளிவாகக் காட்டுகிறது; யாவேயின் வார்த்தை சாமுவேலுக்கு வெளிப்படுத்தப்படாதிருந்தது என்பதே கருத்து.
- source_word: אֵלָיו
  choice: அவனுக்கு
  rationale: முன்னர் குறிப்பிடப்பட்ட சாமுவேலை இயல்பான தமிழில் சுட்டுகிறது.
- source_word: דְּבַר יְהוָה
  choice: யாவேயின் வார்த்தை
  rationale: தீர்க்கதரிசனச் சூழலில் வரும் எபிரெயச் சொற்றொடரின் வழக்கையும் இறையியல் ஒலியையும் காக்கிறது; ‘செய்தி’ என்று விளக்கமாகக் குறுக்கவில்லை.
- source_word: וּשְׁמוּאֵל … וְטֶרֶם
  choice: சாமுவேல் …; … வார்த்தையும் இன்னும்
  rationale: முதல் ו கதையின் விளக்கக் கூற்றைத் தொடங்குகிறது என்பதால் தேவையற்ற ‘இப்போது’ சேர்க்கப்படவில்லை. இரண்டாம் ו-இன் இணைப்புப் பணியை ‘வார்த்தையும்’ என்பதும் அரைப்புள்ளியும் இயல்பாக வெளிப்படுத்துகின்றன.
theological_decisions:
- issue: ‘சாமுவேல் யாவேயை இன்னும் அறிந்திருக்கவில்லை’ என்பதன் பொருள்
  choice: ‘அறிந்திருக்கவில்லை’ என்ற விரிந்த சொல்லாட்சியை முதன்மை உரையில் வைத்தல்
  alternative: ‘யாவேயை இன்னும் அடையாளம் கண்டுகொள்ளவில்லை’ அல்லது ‘யாவேயுடன் தனிப்பட்ட அனுபவம் பெறவில்லை’ என்று குறிப்பாக்குதல்
  rationale: அடுத்த இணைக் கூற்று யாவேயின் வார்த்தை சாமுவேலுக்கு இன்னும் வெளிப்படுத்தப்படவில்லை என்கிறது. ஆகவே நேரடி வெளிப்பாட்டு அனுபவம் அல்லது அதனை அடையாளம் காணுதல் இங்கு முக்கியமாக இருக்கலாம்; எனினும் மூல உரை அவனுடைய முழுமையான அறியாமையையோ ஆன்மிக நிலையையோ வெளிப்படையாகத் தீர்மானிக்கவில்லை. ‘அறிதல்’ அந்த இறையியல் இழுபறியைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் எளிமையும் கண்ணியமும் காக்கப்பட்டுள்ளன. ‘யாவே’, ‘வார்த்தை’, ‘வெளிப்படுத்தப்படுதல்’ ஆகியவை மூலத்தின் பெயர் மற்றும் தீர்க்கதரிசனச் சொற்றொடரைப் பாதுகாக்கின்றன; வாசகருக்கு தேவையற்ற கோட்பாட்டு விளக்கம் முதன்மை உரையில் சேர்க்கப்படவில்லை.
