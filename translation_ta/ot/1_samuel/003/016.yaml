source:
  edition: WLC
  text: וַ/יִּקְרָ֤א עֵלִי֙ אֶת שְׁמוּאֵ֔ל וַ/יֹּ֖אמֶר שְׁמוּאֵ֣ל בְּנִ֑/י וַ/יֹּ֖אמֶר הִנֵּֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/003/016.yaml
  text: Then Eli called Samuel and said, “Samuel, my son.” And he said, “Here I am.”
translation:
  language: ta
  text: அப்போது ஏலி சாமுவேலை அழைத்தார். “சாமுவேலே, என் மகனே,” என்றார். அதற்கு அவன், “இதோ, நான் இருக்கிறேன்,” என்றான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: அழைத்து
  rationale: קרא இச்சூழலில் ஒருவரை வாய்மொழியாக அழைப்பதைக் குறிக்கிறது. அடுத்துவரும் பேச்சுடன் இயல்பாக இணையத் தமிழில் ‘அழைத்து’ என மொழிபெயர்க்கப்பட்டது.
- source_word: עֵלִי
  choice: ஏலி
  rationale: எபிரெய தனிப்பெயர் நவீனத் தமிழில் வழக்கமான வடிவில் ஒலிபெயர்க்கப்பட்டது.
- source_word: אֶת שְׁמוּאֵל
  choice: சாமுவேலை
  rationale: אֶת என்னும் நேரடிச் செயப்படுபொருள் குறி தமிழில் தனியே மொழிபெயர்க்கப்படாமல், ‘சாமுவேல்’ என்ற பெயருடன் ஐ வேற்றுமை உருபு சேர்க்கப்பட்டது.
- source_word: וַיֹּאמֶר
  choice: என்றார் / என்றான்
  rationale: אמר என்பது வழக்கமான கதைநடைப் பேச்சு வினை. பேசுபவர்களின் வயது மற்றும் உறவுநிலைக்கு ஏற்ற தமிழ் மரியாதை வேறுபாட்டுடன் ஏலிக்கு ‘என்றார்’ என்றும் சாமுவேலுக்கு ‘என்றான்’ என்றும் வழங்கப்பட்டது.
- source_word: שְׁמוּאֵל בְּנִי
  choice: சாமுவேலே, என் மகனே!
  rationale: בְּנִי என்பதன் நேரடிப் பொருள் ‘என் மகனே.’ இது ஏலி இளம் சாமுவேலை அன்புடனும் உறவுணர்வுடனும் அழைப்பதைப் பாதுகாக்கிறது; விளிவேற்றுமை இயல்பான நேரடி அழைப்பைத் தருகிறது.
- source_word: הִנֵּנִי
  choice: இதோ, இருக்கிறேன்
  rationale: הִנֵּנִי என்பது இருப்பையும் உடனடி கவனத்தையும் ஆயத்தத்தையும் தெரிவிக்கும் மரபான பதில். ‘இதோ, இருக்கிறேன்’ அதன் சுட்டும் வலியுறுத்தலையும் பதிலளிக்கும் இயல்பையும் பாதுகாக்கிறது.
- source_word: וַ
  choice: அப்போது / அதற்கு
  rationale: தொடர்ச்சியான waw வடிவங்கள் கதைநிகழ்வை முன்னெடுக்கின்றன. முதலாவது ‘அப்போது’ என்றும், சாமுவேலின் பதிலை இயல்பாக இணைக்க அடுத்தது ‘அதற்கு’ என்றும் வழங்கப்பட்டது.
