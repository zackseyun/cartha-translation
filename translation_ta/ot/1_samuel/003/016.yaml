translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் dignified கதைநடை பயன்படுத்தப்பட்டது. எபிரெய மூலத்தின் நிகழ்வுவரிசை, அன்பான அழைப்பு, மற்றும் הִנֵּנִי என்பதிலுள்ள இருப்பு/ஆயத்த உணர்வு பாதுகாக்கப்பட்டுள்ளன.
