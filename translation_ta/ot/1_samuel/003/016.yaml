revisions:
- from: அப்போது ஏலி சாமுவேலை அழைத்து, “சாமுவேலே, என் மகனே!” என்றார். அதற்கு அவன், “இதோ, இருக்கிறேன்” என்றான்.
  to: அப்போது ஏலி சாமுவேலை அழைத்தார். “சாமுவேலே, என் மகனே,” என்றார். அதற்கு அவன், “இதோ, நான் இருக்கிறேன்,” என்றான்.
  rationale: The revision preserves every source element while using a finite verb for Eli’s call and a more idiomatic modern Tamil equivalent for Samuel’s response. The comma rather than an added exclamation mark avoids introducing emphasis not required by the Hebrew.
