source:
  edition: WLC
  text: וְ/לָ/כֵ֥ן נִשְׁבַּ֖עְתִּי לְ/בֵ֣ית עֵלִ֑י אִֽם יִתְכַּפֵּ֞ר עֲוֺ֧ן בֵּית עֵלִ֛י בְּ/זֶ֥בַח וּ/בְ/מִנְחָ֖ה עַד עוֹלָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/003/014.yaml
  text: 'Therefore I have sworn to the house of Eli: the iniquity of Eli’s house shall never be atoned for by sacrifice or offering[a][b].'
translation:
  language: ta
  text: 'ஆகையால், ஏலியின் வீட்டாரைக் குறித்து நான் சத்தியம் செய்திருக்கிறேன்: ஏலியின் வீட்டாரின் அக்கிரமம் பலியினாலோ காணிக்கையினாலோ[b] ஒருபோதும் பரிகரிக்கப்படாது[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ஏலியின் வீட்டாரின் அக்கிரமம் நிச்சயமாகப் பரிகரிக்கப்படாது” என்றும் மொழிபெயர்க்கலாம். “நான் சத்தியம் செய்திருக்கிறேன்” என்பதற்குப் பிறகு எபிரெய உரையில் வரும் “என்றால்” என்ற சொல், சத்தியச் சூத்திரத்தில் வலுவான மறுப்பைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: “காணிக்கை” என்று மொழிபெயர்க்கப்பட்ட எபிரெயச் சொல் பல இடங்களில் குறிப்பாகத் “தானியக் காணிக்கை”யைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָכֵן
  choice: ஆகையால்
  rationale: முந்தைய நியாயத்தீர்ப்பு அறிவிப்பின் விளைவை அறிமுகப்படுத்தும் காரணவிளைவு இணைப்பை இயல்பான, முறையான தமிழில் வெளிப்படுத்துகிறது.
- source_word: נִשְׁבַּעְתִּי
  choice: நான் ஆணையிட்டேன்
  rationale: முடிவுற்றதும் கட்டுப்படுத்தும் வலிமையுடையதுமான இறை ஆணையின் solemn தன்மையைத் தெளிவாகக் காட்டுகிறது.
- source_word: לְבֵית עֵלִי
  choice: ஏலியின் வீட்டாரைக் குறித்து
  rationale: ל முன்னிடைச்சொல் ஆணையின் இலக்கு அல்லது பொருளைக் குறிக்கிறது; தீர்ப்பின் எதிர்மறை உள்ளடக்கத்தை மிகைப்படுத்தாமல், குடும்பம்/வம்சம் என்ற ‘வீடு’ சார்ந்த பொருளையும் காக்கிறது.
- source_word: אִם
  choice: ஒருபோதும் … பரிகரிக்கப்படாது
  rationale: ஆணையிடும் வினைக்குப் பின் வரும் אִם எபிரெய மொழியில் வலுவான மறுப்பை வெளிப்படுத்தும் ஆணைச் சூத்திரமாகும்; சொல்லுக்குச் சொல் ‘என்றால்’ என்று மொழிபெயர்ப்பது தமிழில் பொருளை மறைக்கும்.
- source_word: יִתְכַּפֵּר
  choice: பரிகரிக்கப்படாது
  rationale: குற்றம் அல்லது பாவம் பலிசார் வழியில் நீக்கப்படுதல் என்ற כפר சொல்லின் கருத்தைத் தமிழில் பழக்கமான இறையியல் சார்ந்த சொல்லால் வெளிப்படுத்துகிறது; செயப்படுபொருள் நிலையும் காக்கப்படுகிறது.
- source_word: עֲוֺן
  choice: அக்கிரமம்
  rationale: தவறான செயலும் அதனால் உண்டாகும் குற்றப்பொறுப்பும் ஆகிய இரண்டையும் தாங்கக்கூடிய சொல்லின் கனத்தை காக்கிறது.
- source_word: בֵּית עֵלִי
  choice: ஏலியின் வீட்டார்
  rationale: ஒரே குடும்பம், வழித்தோன்றல்கள், குடும்ப அமைப்பு ஆகியவற்றைக் குறிக்கும் எபிரெய ‘வீடு’ என்ற சொல்லை இயல்பான தமிழில் தருகிறது.
- source_word: בְּזֶבַח
  choice: பலியினால்
  rationale: בְּ இங்கு கருவி அல்லது வழிமுறையைக் குறிக்கிறது; பலி இந்த அக்கிரமத்திற்குப் பரிகாரம் செய்ய முடியாது என்பதை வெளிப்படுத்துகிறது.
- source_word: וּבְמִנְחָה
  choice: காணிக்கையினால்
  rationale: מִנְחָה பலிசார் சூழலில் தானியக் காணிக்கையைச் சிறப்பாகக் குறிக்கக்கூடும்; இங்கு זֶבַח உடன் இணைந்திருப்பதால் வாசிக்க எளிதான பொதுச் சொல்லை முதன்மை உரையில் வைத்து, குறிப்பான பொருளை அடிக்குறிப்பில் தருகிறது.
- source_word: עַד עוֹלָם
  choice: ஒருபோதும்
  rationale: எதிர்மறை ஆணைச் சூழலில் பரிகாரம் நிகழாததன் நிலையான தன்மையை இயல்பான தமிழில் வலியுறுத்துகிறது.
theological_decisions:
- issue: ஏலியின் வீட்டார்மீதான தீர்ப்பின் வரம்பு
  choice: ஏலியின் வீட்டாரின் அக்கிரமத்திற்குப் பலி அல்லது காணிக்கை வழியாக ஒருபோதும் பரிகாரம் உண்டாகாது என்று வசனம் அறிவிக்கிறது.
  alternative: சில குறிப்பிட்ட பலிகளும் காணிக்கைகளும் மட்டுமே விலக்கப்படுகின்றன என்றும், இறைவனின் மன்னிப்புக்கான வேறு எந்த வாய்ப்பையும் வசனம் முற்றிலும் மறுக்கவில்லை என்றும் இதை இன்னும் குறுகலாக வாசிக்கலாம்.
  rationale: மூலவசனம் பலியையும் காணிக்கையையும் வெளிப்படையாகக் குறிப்பிடுவதால், இந்தக் குற்றத்திற்கு வழிபாட்டுச் சடங்கு வழிகள் போதாது என்ற கருத்து காக்கப்படுகிறது. அதேவேளை, உரை சொல்லாத அளவுக்கு இறைவனின் இரக்கத்தைப் பற்றிய விரிவான கோட்பாட்டு முடிவு மொழிபெயர்ப்பில் சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் வேதாகம உரைக்கு ஏற்ற கண்ணியமான நடையிலும் மொழிபெயர்க்கப்பட்டது. ‘வீட்டார்’, ‘அக்கிரமம்’, ‘பரிகரிக்கப்படுதல்’ ஆகியவை குடும்ப/வம்ச, நீதிசார், பலிசார் நுணுக்கங்களை மிகைப்படுத்தாமல் காக்கின்றன.
