  source_fidelity: 'முக்கிய திருத்தம் தேவை: נִשְׁבַּעְתִּי என்பது ‘நான் சத்தியம் செய்திருக்கிறேன் / சத்தியம் செய்தேன்’ என்பதே; வரைவிலுள்ள ‘நான் ஆணையிட்டேன்’ என்பது கட்டளையிடுதல் அல்லது ஆணை பிறப்பித்தல் என்ற வேறுபட்ட பொருளைத் தருகிறது. மற்றபடி, ஆணைச் சூத்திரத்தின் வலுவான மறுப்பு, பரிகாரத்தின் செயப்பாட்டு வடிவம், மற்றும் பலி/காணிக்கை வழிமுறை ஆகியவை நன்றாகக் காக்கப்பட்டுள்ளன.'
  naturalness: ‘ஏலியின் வீட்டார்’ மற்றும் ‘பலியினாலோ காணிக்கையினாலோ ஒருபோதும் பரிகரிக்கப்படாது’ என்பவை கண்ணியமான, புரிந்துகொள்ளத்தக்க நவீன நிலையான தமிழ். ‘சத்தியம் செய்திருக்கிறேன்’ என்பது இச்சூழலில் இயல்பாகவும் மூலத்தின் உறுதிமொழித் தொனிக்குச் சரியாகவும் உள்ளது.
  terminology: ‘அக்கிரமம்’ עָוֹן-இன் நீதிசார் கனத்தைத் தக்கவைக்கிறது. ‘பரிகரிக்கப்படாது’ כפר-இன் பலிசார் பொருளுக்குப் பொருத்தமானது. ‘காணிக்கை’க்கு அடிக்குறிப்பில் ‘தானியக் காணிக்கை’ என்ற குறிப்பை வைத்திருப்பது மִנְחָה-வின் குறிப்பான பயன்பாட்டைச் சரியாகத் தெரிவிக்கிறது.
