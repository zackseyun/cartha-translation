  rationale: நִשְׁבַּעְתִּי-க்கு ‘சத்தியம் செய்திருக்கிறேன்’ என மாற்றியதால், கட்டளையல்லாமல் இறை உறுதிமொழி என்ற மூலத்தின் பொருள் காக்கப்படுகிறது. எபிரெய אִם-இன் எதிர்மறைச் சத்தியச் சூத்திரம், עַד עוֹלָם-இன் நிலையான வலியுறுத்தல், மற்றும் பலி/காணிக்கை மூலம் பரிகாரம் இல்லை என்ற உரையின் வரம்பு மாற்றப்படவில்லை.
