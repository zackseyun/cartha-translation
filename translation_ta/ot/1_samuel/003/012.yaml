base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/003/012.yaml
  text: On that day I will carry out against Eli all that I have spoken concerning his house[b][a], from beginning to end.
translation:
  language: ta
  text: அந்நாளில், ஏலிக்கு எதிராக, அவனுடைய வீட்டைக் குறித்து நான் சொன்ன அனைத்தையும் நிறைவேற்றுவேன்[a][b]—தொடக்கமுதல் முடிவுவரை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ஏலிக்கு, அவனுடைய வீட்டைக் குறித்து நான் சொன்ன அனைத்தையும் நிறைவேற்றுவேன்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘அவனுடைய வீடு’ என்பதற்கான எபிரேயச் சொல் அவனுடைய வீட்டார், குடும்ப வம்சம் அல்லது குருத்துவக் குடும்பத்தைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הַהוּא
  choice: அந்நாளில்
  rationale: குறிப்பிட்ட ஓர் எதிர்கால நாளைச் சுட்டும் எபிரெய காலத் தொடரை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: אָקִים
  choice: நிறைவேற்றுவேன்
  rationale: קום என்பதன் ஹிஃபில் வடிவம் இங்கு தேவன் முன்பு சொன்னவற்றை நிலைபெறச் செய்து நிகழ்த்துவதைச் சுட்டுகிறது; ‘நிறைவேற்றுவேன்’ என்பது அந்தப் பொருளை இயல்பாகத் தருகிறது.
- source_word: אֶל עֵלִי
  choice: அவனுக்கு எதிராக
  rationale: אֶל என்பதன் அடிப்படைப் பொருள் ‘நோக்கி/இடம்’ என்றாலும், இங்குள்ள நியாயத்தீர்ப்புச் சூழலில் அறிவிக்கப்பட்டது ஏலிக்கு எதிராக நிகழ்த்தப்படுவதைக் காட்டுகிறது.
- source_word: אֵת כָּל אֲשֶׁר דִּבַּרְתִּי
  choice: நான் சொன்ன அனைத்தையும்
  rationale: כָּל אֲשֶׁר என்பதன் முழுமையையும் דבר என்பதன் நேரடியான சொற்பொருளையும் தெளிவாகப் பாதுகாக்கிறது.
- source_word: אֶל בֵּיתוֹ
  choice: அவனுடைய வீட்டைக் குறித்து
  rationale: דבר உடன் வரும் אֶל பேச்சின் பொருளைச் சுட்டலாம்; அதனால் தேவன் ஏலியின் வீட்டைப் பற்றிச் சொன்னதை இந்தத் தொடர் தெரிவிக்கிறது.
- source_word: בֵּיתוֹ
  choice: அவனுடைய வீடு
  rationale: בַּיִת என்பதில் வீட்டார், குடும்ப வழி, ஆசாரியக் குடும்பம் ஆகிய பரந்த சாத்தியங்கள் உள்ளன. ‘வீடு’ அவற்றில் ஒன்றை மட்டும் பிரதான உரையில் தீர்மானிப்பதைத் தவிர்க்கிறது.
- source_word: הָחֵל וְכַלֵּה
  choice: தொடக்கமுதல் முடிவுவரை
  rationale: தொடங்குவதையும் முடிப்பதையும் இணைக்கும் இந்த எபிரெய மரபுத்தொடர் அறிவிக்கப்பட்ட அனைத்தும் முழுமையாகச் செயல்படுத்தப்படும் என்பதை உணர்த்துகிறது.
theological_decisions:
- issue: ஏலியும் அவனுடைய வீட்டாரும் எதிர்கொள்ளும் நியாயத்தீர்ப்பின் வரம்பு
  choice: தேவன் ஏலியின் வீட்டைக் குறித்து முன்பு சொன்ன அனைத்தையும் முழுமையாக நிறைவேற்றுவார் என்று மொழிபெயர்த்து, ‘வீடு’ என்பதன் பரந்த பொருளைத் தக்கவைத்தல்.
  alternative: ‘வீடு’ என்பதை ஏலியின் உடனடிக் குடும்பம் என்று மட்டும் குறுக்குதல் அல்லது முழு ஆசாரிய அமைப்பாக விரிவுபடுத்துதல்.
  rationale: எபிரெய בֵּיתוֹ என்பது வீட்டார், குடும்ப வழி, சூழலின்படி ஆசாரியக் குடும்பம் ஆகியவற்றைக் குறிக்கலாம். பிரதான உரை இந்த வரம்பைத் தனிப்பட்ட விளக்கத்தால் தீர்மானிக்காமல் விடுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘வீடு’ என்ற சொல்லின் எபிரெயச் சொற்பரப்பையும் ‘தொடக்கமுதல் முடிவுவரை’ என்ற முழுமைக் கருத்தையும் பாதுகாக்கிறது.
