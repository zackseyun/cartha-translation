  text: וַ/יֹּ֨אמֶר עֵלִ֣י לִ/שְׁמוּאֵל֮ לֵ֣ךְ שְׁכָב֒ וְ/הָיָה֙ אִם יִקְרָ֣א אֵלֶ֔י/ךָ וְ/אָֽמַרְתָּ֙ דַּבֵּ֣ר יְהוָ֔ה כִּ֥י שֹׁמֵ֖עַ עַבְדֶּ֑/ךָ וַ/יֵּ֣לֶךְ שְׁמוּאֵ֔ל וַ/יִּשְׁכַּ֖ב בִּ/מְקוֹמֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/003/009.yaml
  text: Then Eli said to Samuel[a], “Go, lie down, and if he calls to you, you shall say, ‘Speak, Yahweh, for your servant is listening.’” So Samuel went and lay down in his place.
translation:
  language: ta
  text: அப்போது ஏலி சாமுவேலிடம், “நீ போய்ப் படுத்துக்கொள். உன்னை அழைத்தால், ‘யாவே[a], பேசும்; ஏனெனில் உமது அடியான் கேட்டுக்கொண்டிருக்கிறான்’ என்று சொல்” என்றார். ஆகவே சாமுவேல் போய்த் தன் இடத்தில் படுத்துக்கொண்டான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரேயத்தில் יהוה (YHWH) என்ற கடவுளுடைய தனிப்பெயர் உள்ளது; அது இங்கு ‘யாவே’ என ஒலிபெயர்க்கப்பட்டுள்ளது. சில மொழிபெயர்ப்புகள் இதை ‘ஆண்டவர்’ என்று வழங்குகின்றன.
    reason: தெய்வீகப் பெயரின் ஒலிபெயர்ப்பையும் பாரம்பரிய மாற்று வழங்கலையும் விளக்குதல்
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: அப்போது ஏலி ... என்றார்
  rationale: தொடர்ச்சியான எபிரேயக் கதைநடையை இயல்பான தமிழில் முன்னெடுக்க ‘அப்போது’ பயன்படுத்தப்பட்டுள்ளது; ஏலிக்குரிய மரியாதை வினைமுற்றில் காட்டப்பட்டுள்ளது.
- source_word: לֵךְ שְׁכָב
  choice: நீ போய்ப் படுத்துக்கொள்
  rationale: அடுத்தடுத்து வரும் இரு கட்டளைகளையும் நேரடியாகப் பாதுகாக்கிறது; மூலத்தில் இல்லாத ‘தூங்கு’ என்ற கருத்தைச் சேர்க்கவில்லை.
- source_word: וְהָיָה אִם יִקְרָא אֵלֶיךָ
  choice: உன்னைக் கூப்பிட்டால்
  rationale: நிபந்தனைப் பொருளை இயல்பான தமிழில் தருகிறது. எபிரேயத்தில் அழைப்பவரின் எழுவாய் வெளிப்படையாக இல்லாததால், தமிழிலும் எழுவாயைச் சேர்க்காமல் அந்த மறைபொருளைப் பாதுகாக்கிறது.
- source_word: וְאָמַרְתָּ
  choice: என்று சொல்
  rationale: நிபந்தனைக்குப் பின்வரும் ஏலியின் நேரடியான அறிவுறுத்தலைத் தெளிவாகத் தருகிறது.
- source_word: דַּבֵּר
  choice: பேசும்
  rationale: இறைவனை நோக்கிய நேரடி வேண்டுகோளை, நவீனத் தமிழில் இயல்பான மரியாதை ஏவல் வடிவில் வழங்குகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரேயத்தில் உள்ள நான்கெழுத்துத் தெய்வீகப் பெயரை ஒரு பொதுப் பட்டத்தால் மாற்றாமல், தமிழில் ஒலிபெயர்க்கிறது.
- source_word: כִּי שֹׁמֵעַ עַבְדֶּךָ
  choice: உமது அடியான் கேட்டுக்கொண்டிருக்கிறான்
  rationale: כִּי அறிமுகப்படுத்தும் காரணத்தையும், שֹׁמֵעַ என்னும் நிகழ்காலத் தொடர்ச்சியான கவனத்தையும் வெளிப்படுத்துகிறது. עֶבֶד இங்கு பணிவான சுயக்குறிப்பாக இருப்பதால் ‘அடியான்’ பொருத்தமானது.
- source_word: וַיֵּלֶךְ שְׁמוּאֵל וַיִּשְׁכַּב
  choice: ஆகவே சாமுவேல் போய்ப் ... படுத்துக்கொண்டான்
  rationale: ஏலியின் அறிவுறுத்தலுக்குப் பின்வரும் செயல்தொடரை இயல்பாகக் காட்டுகிறது.
- source_word: בִּמְקוֹמוֹ
  choice: தன் இடத்தில்
  rationale: சாமுவேலுக்குரிய இடத்தைக் குறிக்கும் மூலவாக்கியத்தை, ‘வழக்கமான’ போன்ற கூடுதல் விளக்கமின்றி வழங்குகிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரை வழங்குதல்
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூலத்தில் ஒரு பட்டம் அல்ல, இஸ்ரவேலின் கடவுளுடைய தனிப்பெயரான יהוה நேரடியாக வருகிறது. ஆகவே அதை ‘யாவே’ என ஒலிபெயர்த்து, வழக்கமான பட்டமொழியை அடிக்குறிப்பில் குறிப்பிடுகிறது.
- issue: יִקְרָא என்பதன் வெளிப்படாத எழுவாய்
  choice: தமிழிலும் எழுவாயை வெளிப்படையாகச் சேர்க்காமல் ‘உன்னைக் கூப்பிட்டால்’ என வழங்குதல்
  alternative: அவர் உன்னைக் கூப்பிட்டால்
  rationale: சூழலில் அழைப்பவர் யாவே என்பது தெளிவாக இருந்தாலும், எபிரேய வினையில் எழுவாய் பெயர்ச்சொல்லாக வெளிப்படவில்லை. தமிழில் எழுவாயை விடுவது இயல்பாகவும் மூலத்தின் அளவிலான மறைமுகத்தன்மையைப் பாதுகாப்பதாகவும் உள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியும் ஆனால் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ஏலியைக் குறிக்க மரியாதை வினைமுற்றும், யாவேயை நோக்கி ‘பேசும்/உமது’ என்ற மரியாதை வடிவங்களும் பயன்படுத்தப்பட்டுள்ளன; சாமுவேல் இளம் அடியான் என்பதால் அவனைச் சுட்டும் வினைமுற்றுகள் இயல்பான ஒருமையில் உள்ளன.
