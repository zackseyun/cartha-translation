  register: மரியாதைச் சூழலைக் கருத்தில் கொண்டு சாமுவேல் ஏலியிடம் பேசும்போது ‘நீங்கள்’ பயன்படுத்தப்பட்டுள்ளது; ஏலியின் கட்டளை ஒருமை வடிவில் உள்ளது. நடை நவீனமானதும் எளிமையானதும் கண்ணியமானதும் ஆகும்.
