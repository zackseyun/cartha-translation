  yaml_path: translation/ot/1_samuel/003/005.yaml
  text: He ran to Eli and said, “Here I am, because you called me.” But he said, “I did not call. Go back; lie down.” So he went and lay down.
translation:
  language: ta
  text: அவன் ஏலியிடம் ஓடி, “இதோ, நான் இங்கே இருக்கிறேன்; நீங்கள் என்னைக் கூப்பிட்டீர்களே” என்றான். அதற்கு அவர், “நான் கூப்பிடவில்லை. திரும்பிப் போய்ப் படுத்துக்கொள்” என்றார். அவனும் போய்ப் படுத்துக்கொண்டான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנְנִי
  choice: இதோ, நான் வந்திருக்கிறேன்
  rationale: அழைப்புக்குப் பதிலளித்து உடனிருப்பதையும் தயாராக இருப்பதையும் குறிக்கும் எபிரெயச் சொல்லை, இச்சூழலில் இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: כִּי קָרָאתָ לִּי
  choice: நீங்கள் என்னைக் கூப்பிட்டீர்களே
  rationale: כִּי இங்கு சாமுவேல் ஓடிவந்ததற்கான காரணத்தைச் சுட்டுகிறது; தமிழ் உரையாடலில் காரணத்தையும் முன் நிகழ்ந்த அழைப்பையும் இயல்பாக உணர்த்த ‘-ஏ’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: שׁוּב שְׁכָב
  choice: திரும்பிப் போய்ப் படுத்துக்கொள்
  rationale: שׁוּב என்பதன் ‘திரும்பு/மீண்டும்’ என்ற பொருளையும், שְׁכָב என்ற கட்டளையையும் இயல்பாகப் பேணுகிறது.
- source_word: וַיֵּלֶךְ וַיִּשְׁכָּב
  choice: அவனும் போய்ப் படுத்துக்கொண்டான்
  rationale: தொடர்ச்சியான இரண்டு செயல்களையும் சுருக்காமல், இயல்பான தமிழ்ச் சொல்லோட்டத்தில் தருகிறது.
