base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/003/010.yaml
  text: Then Yahweh came and stood there[a], and called as at the other times, “Samuel, Samuel!” And Samuel said, “Speak, for your servant is listening.”
translation:
  language: ta
  text: அப்போது யாவே வந்து அங்கே நின்று, முன்பு போலவே[a], “சாமுவேலே, சாமுவேலே!” என்று அழைத்தார். சாமுவேல், “பேசும்; உமது அடியான் கேட்கிறேன்” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “முன்புபோல்.” எபிரெயத் தொடர்மொழி இந்த அழைப்பை முந்தைய அழைப்புகளுடன் ஒப்பிடுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: யெகோவா
  rationale: இறைப் பெயரைத் தமிழில் வழக்கமான ஒலிபெயர்ப்பாக வழங்குகிறது; பொதுப்பெயரான ‘கர்த்தர்’ என்பதுடன் கலக்காமல் உடன்படிக்கையின் தனிப்பெயரைப் பாதுகாக்கிறது.
- source_word: וַיָּבֹא
  choice: வந்து
  rationale: בוא என்பதன் வருதல் என்ற நேரடியான கதைநடைப் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: וַיִּתְיַצַּב
  choice: அங்கே நின்று
  rationale: ஹித்பயேல் வடிவின் தம்மை ஒரு இடத்தில் நிலைநிறுத்திக்கொண்டு நிற்றல் என்ற காட்சிப்பூர்வமான பொருளைப் பாதுகாக்கிறது.
- source_word: וַיִּקְרָא
  choice: அழைத்தார்
  rationale: சாமுவேலைப் பெயர் சொல்லிக் கூப்பிடும் செயலை இயல்பாகக் குறிக்கிறது; ‘கூக்குரலிட்டார்’ போன்ற தீவிரத்தைக் காரணமின்றி சேர்க்கவில்லை.
- source_word: כְפַעַם בְּפַעַם
  choice: முன்பு போலவே
  rationale: முந்தைய அழைப்புகளுடன் ஒப்பிடும் எபிரெய மரபுத்தொடரின் பொருளைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது; அதன் சொற்சொல் அமைப்பை அடிக்குறிப்பு விளக்குகிறது.
- source_word: שְׁמוּאֵל שְׁמוּאֵל
  choice: சாமுவேலே! சாமுவேலே!
  rationale: பெயரின் இரட்டிப்பையும் நேரடி அழைப்பைக் காட்டும் தமிழின் ஏகார விளியையும் பாதுகாக்கிறது.
- source_word: דַּבֵּר
  choice: பேசும்
  rationale: எளிய கட்டளையை மரியாதையுடன் உரைக்கும் தமிழ் வடிவம்; சாமுவேலின் பணிவான பதிலுக்கு ஏற்றது.
- source_word: כִּי
  choice: —
  rationale: எபிரெயத்தில் காரணத்தை அறிமுகப்படுத்தினாலும், ‘உமது அடியான் கேட்டுக்கொண்டிருக்கிறேன்’ என்ற தொடர்ச்சியான தமிழ் வாக்கியத்தில் அந்த உறவு இயல்பாகவே வெளிப்படுகிறது; தனியான இணைப்புச்சொல் செயற்கையாக இருக்கும்.
- source_word: שֹׁמֵעַ
  choice: கேட்டுக்கொண்டிருக்கிறேன்
  rationale: பங்கேற்பு வடிவம் காட்டும் தொடர்ந்த கவனத்தையும் செவிசாய்க்கும் ஆயத்தத்தையும் வெளிப்படுத்துகிறது.
- source_word: עַבְדֶּךָ
  choice: உமது அடியான்
  rationale: பணிவு, கீழ்ப்படிதல், சேவை ஆகியவற்றைக் குறிக்கும் சூழலுக்கேற்ற மரியாதையான தமிழ் வழக்கைத் தேர்ந்தெடுக்கிறது.
theological_decisions:
- issue: யெகோவா வந்து நின்றார் என்ற மனித உருவகக் காட்சிப்படுத்தல்
  choice: ‘வந்து அங்கே நின்று’ என்ற திடமான கதை மொழியைப் பாதுகாத்தல்
  alternative: ‘தோன்றினார்’ அல்லது ‘தமது பிரசன்னத்தை வெளிப்படுத்தினார்’ என்று மென்மையாக்குதல்
  rationale: மூல எபிரெயம் இறைவனின் செயல்களைத் தெளிவான, தனிப்பட்ட செயல்களாகச் சொல்கிறது. இறையியல் சங்கடத்தைத் தவிர்க்க அந்த மொழியை மாற்றாமல் அதன் உண்மையான பதற்றத்தைக் காக்கிறது.
- issue: יְהוָה என்ற இறைப் பெயரின் மொழிபெயர்ப்பு
  choice: யெகோவா
  alternative: யாவே; கர்த்தர்
  rationale: தனிப்பெயரின் தன்மையை ஒலிபெயர்ப்பால் பாதுகாக்கிறது. பொதுப்பட்டமான ‘கர்த்தர்’ என்று மாற்றுவதால் மூலத்தில் உள்ள பெயர் மறையாமல் இருக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான வேதாகமக் கதைநடை பயன்படுத்தப்பட்டுள்ளது. இறைவனுக்கான மரியாதைப் பன்மையும், சாமுவேலின் பணிவைக் காட்ட ‘உமது அடியான்’ என்ற வடிவமும் காக்கப்பட்டுள்ளன.
