  source_fidelity: மூலத்தின் நிகழ்வுவரிசை, பெயரின் இரட்டிப்பு, யெகோவா வந்து நின்ற காட்சிமொழி, மற்றும் சாமுவேலின் பணிவான பதில் ஆகியவை பெரும்பாலும் துல்லியமாக உள்ளன. ஆனால் ‘உமது அடியான் கேட்டுக்கொண்டிருக்கிறேன்’ என்பதில் மூன்றாம் நபர் சுயக்குறிப்பும் முதல் நபர் வினைமுற்றும் இணைந்திருப்பதால் நவீனத் தமிழில் வழுவாகத் தோன்றுகிறது. ‘கேட்கிறேன்’ என்பது இவ்வகை பணிவான சுயக்குறிப்பில் நிலைபெற்ற, இயல்பான வடிவம். திட்டத்தின் ஆங்கில ஆய்வுத்தடத்தோடு ஒத்திசைய, யெகோவா பெயர் ‘யாவே’ என வழங்கப்பட்டுள்ளது.
