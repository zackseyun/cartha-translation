base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/003/015.yaml
  text: Samuel lay down until morning; then he opened the doors of the house of Yahweh[a]. But Samuel was afraid to tell the vision to Eli.
translation:
  language: ta
  text: சாமுவேல் காலைவரை படுத்திருந்தான். பின்பு அவன் யாவேயின் இல்லத்தின் கதவுகளைத் திறந்தான். ஆனால் சாமுவேல் அந்தத் தரிசனத்தை[a] ஏலியிடம் சொல்லப் பயந்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘தோற்றத்தை’. எபிரெயச் சொல் ஒரு தோற்றத்தையோ தரிசன வெளிப்பாட்டையோ குறிக்கலாம். இங்கு சாமுவேலுக்கு இரவில் கிடைத்த வெளிப்பாட்டைக் குறிப்பதால் ‘தரிசனம்’ என்பது சூழலுக்கு மிகவும் பொருந்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: படுத்திருந்தான்
  rationale: שׁכב என்பதன் அடிப்படைப் பொருள் ‘படுத்துக்கொள்/படுத்திரு’. சாமுவேல் தூங்கினான் என்று எபிரெய உரை வெளிப்படையாகச் சொல்லாததால், ‘தூங்கினான்’ என்ற விளக்கத்தைச் சேர்க்காமல் மூலத்தின் துல்லியம் காக்கப்படுகிறது.
- source_word: עַד הַבֹּקֶר
  choice: காலைவரை
  rationale: கால எல்லையைக் குறிக்கும் எபிரெயத் தொடரை இயல்பான நவீன தமிழில் நேரடியாகத் தருகிறது.
- source_word: וַיִּפְתַּח
  choice: திறந்தான்
  rationale: கதையின் அடுத்தடுத்த நிகழ்வைக் குறிக்கும் வினையை, மூலத்தில் இல்லாத நகர்வு போன்ற கருத்துகளைச் சேர்க்காமல் எளிய இறந்தகாலத்தில் தருகிறது.
- source_word: דַּלְתוֹת
  choice: கதவுகளை
  rationale: எபிரெயப் பன்மையை இயல்பாகப் பாதுகாக்கிறது; ‘வாசல்’ அல்லது ‘கோவில் கதவுகள்’ என்று தேவையற்ற குறிப்பாக்கம் செய்யப்படவில்லை.
- source_word: בֵּית יְהוָה
  choice: யாவேயின் இல்லம்
  rationale: בַּיִת என்பதற்கு ‘இல்லம்’ என்றும், יהוה என்ற தனிப்பெயருக்கு ‘யாவே’ என்றும் வழங்கி, இக்கால வரலாற்றுச் சூழலில் ‘ஆலயம்’ என மிகையாகக் குறிப்பாக்குவதைத் தவிர்க்கிறது.
- source_word: יָרֵא
  choice: பயந்தான்
  rationale: சாமுவேலின் அச்சத்தை இயல்பான, நேரடியான தமிழில் வெளிப்படுத்துகிறது.
- source_word: מֵהַגִּיד
  choice: சொல்லப்
  rationale: ירא உடன் வரும் מן + வினையெச்ச அமைப்பு, ஒன்றைச் செய்ய அஞ்சுவதைக் குறிக்கிறது; தமிழில் ‘சொல்லப் பயந்தான்’ என்பது இயல்பான இணைவு.
- source_word: הַמַּרְאָה
  choice: அந்தத் தரிசனம்
  rationale: מַרְאָה என்பது ‘தோற்றம்’ அல்லது தரிசன வெளிப்பாட்டைக் குறிக்கலாம். இங்கு இரவில் சாமுவேலுக்குக் கிடைத்த இறைவெளிப்பாட்டைச் சூழல் சுட்டுவதால் ‘தரிசனம்’ பொருத்தமானது; ‘அந்த’ என்பது குறிப்பிட்ட நிகழ்வைக் குறிக்கும் எபிரெய நிர்ணயச் சுட்டை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: אֶל עֵלִי
  choice: ஏலியிடம்
  rationale: ‘ஒருவரிடம் சொல்லுதல்’ என்பது இங்கு אֶל குறிக்கும் நோக்கை இயல்பான தமிழில் தருகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: எபிரெய உரையில் நான்கெழுத்து இறைப் பெயர் நேரடியாக உள்ளது. அதை ஒரு பட்டப்பெயராக மாற்றாமல், தமிழில் பரவலாக அறியத்தக்க ஒலிபெயர்ப்பான ‘யாவே’ என்று தருவது உடன்படிக்கைப் பெயரின் தனித்தன்மையைப் பாதுகாக்கிறது.
- issue: מַרְאָה என்பதன் பொருள்
  choice: தரிசனம்
  alternative: தோற்றம்
  rationale: இச்சொல்லுக்கு இரு பொருள்களும் சாத்தியம். இருப்பினும், இரவில் சாமுவேலுக்குக் கிடைத்த வெளிப்பாட்டைக் குறிக்கும் உடனடிச் சூழலில் ‘தரிசனம்’ சிறப்பாகப் பொருந்துகிறது; உண்மையான சொற்பொருள் மாற்று அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் வேதாகமக் கதையாடலுக்கேற்ற கண்ணியமான நடையிலும் மொழிபெயர்க்கப்பட்டது. சாமுவேல் தூங்கினான் என்று மூலத்தில் இல்லாத கருத்து சேர்க்கப்படவில்லை; ‘ஆலயம்’ என்ற காலச்சூழலை மிகையாகக் குறிப்பாக்கும் சொல்லும் தவிர்க்கப்பட்டது.
