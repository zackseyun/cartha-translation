  text: And all Israel from Dan to Beer-sheba knew that Samuel was established as a prophet of Yahweh[a].
translation:
  language: ta
  text: தாண் முதல் பெயெர்செபா வரையுள்ள இஸ்ரவேலர் அனைவரும், சாமுவேல் யாவேயின் தீர்க்கதரிசியாக உறுதிப்படுத்தப்பட்டார் என்பதை அறிந்துகொண்டார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சாமுவேல் யாவேயின் தீர்க்கதரிசியாக நிலைநிறுத்தப்பட்டார்” அல்லது “யாவேயின் தீர்க்கதரிசியாக நம்பத்தக்கவர் எனக் காணப்பட்டார்.” எபிரெயச் சொல் நம்பத்தக்கவராகக் காணப்படுதல், நிலைநிறுத்தப்படுதல், அல்லது உறுதிப்படுத்தப்படுதல் ஆகிய பொருள்களைக் கொண்டிருக்கலாம்.
    reason: נֶאֱמָן என்பதன் ‘நம்பத்தக்கவர்,’ ‘நிலைநிறுத்தப்பட்டவர்,’ ‘உறுதிப்படுத்தப்பட்டவர்’ ஆகிய பொருள் நிழல்களை, தீர்க்கதரிசிப் பங்குடன் இணைத்தே பாதுகாக்கிறது.
lexical_decisions:
- source_word: וַיֵּדַע
  choice: அறிந்துகொண்டார்கள்
  rationale: இந்த வினை இங்கு வெறும் தகவலறிவை மட்டுமல்லாமல், சாமுவேலின் தீர்க்கதரிசி நிலையை இஸ்ரவேலர் உணர்ந்து ஏற்றுக்கொண்டதையும் குறிக்கிறது.
- source_word: כָּל יִשְׂרָאֵל
  choice: இஸ்ரவேலர் அனைவரும்
  rationale: எபிரெய மொழியின் கூட்டு தேசியக் குறிப்பை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: מִדָּן וְעַד בְּאֵר שָׁבַע
  choice: தாண் முதல் பெயெர்செபா வரை இருந்த
  rationale: நாட்டின் வடக்கிலிருந்து தெற்குவரையுள்ள முழுப் பரப்பையும் குறிக்கும் புவியியல் சொல்லாட்சியை இடப்பெயர்களுடன் பாதுகாக்கிறது.
- source_word: נֶאֱמָן
  choice: உறுதிப்படுத்தப்பட்டார்
  rationale: Niphal வடிவம் இச்சூழலில் சாமுவேல் உண்மையான தீர்க்கதரிசி என யாவேயால் நிரூபிக்கப்பட்டு நிலைநிறுத்தப்பட்டதைச் சுட்டுகிறது; நம்பத்தக்கவர் என்ற பொருள்நிழலும் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: לְנָבִיא
  choice: தீர்க்கதரிசியாக
  rationale: லாமேத் இங்கு பங்கு அல்லது நிலையைச் சுட்டுவதால், இயல்பான தமிழில் இவ்வாறு வழங்கப்படுகிறது.
- source_word: לַיהוָה
  choice: யாவேயின்
  rationale: உடன்படிக்கையின் தெய்வீகப் பெயரான יהוה ஒலிபெயர்க்கப்படுகிறது; தொடர்பைக் குறிக்கும் லாமேத் தமிழில் உடைமை வடிவில் இயல்பாக வெளிப்படுகிறது.
theological_decisions:
- issue: יהוה என்ற தெய்வீகப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலத்தில் உள்ள தனிப்பட்ட உடன்படிக்கைப் பெயரை பொதுப்பட்டமாக மாற்றாமல் ஒலிபெயர்த்துப் பாதுகாக்கிறது.
- issue: נֶאֱמָן என்பதன் பொருள்
  choice: தீர்க்கதரிசியாக உறுதிப்படுத்தப்பட்டார்
  alternative: தீர்க்கதரிசியாக நிலைநிறுத்தப்பட்டார்; நம்பத்தக்க தீர்க்கதரிசி என்று நிரூபிக்கப்பட்டார்
  rationale: முந்தைய வசனத்தில் சாமுவேலின் வார்த்தைகள் நிறைவேறியதோடு இவ்வசனத்தை இணைத்து, அவரது தீர்க்கதரிசி நிலை உண்மையானது என உறுதியானதை வெளிப்படுத்துகிறது; சொல்லின் பிற உண்மையான பொருள்நிழல்கள் அடிக்குறிப்பில் தரப்படுகின்றன.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் வேதாகமக் கண்ணியத்துடனும் வடிவமைக்கப்பட்டது. புவியியல் சொல்லாட்சி மொழிபெயர்த்துச் சுருக்கப்படாமல் இடப்பெயர்களோடு வைக்கப்பட்டுள்ளது; ‘தீர்க்கதரிசி’ என்பது பரவலாக அறியப்பட்ட சொல்லாகப் பயன்படுத்தப்பட்டுள்ளது.
