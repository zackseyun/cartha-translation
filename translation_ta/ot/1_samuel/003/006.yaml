  text: וַ/יֹּ֣סֶף יְהוָ֗ה קְרֹ֣א עוֹד֮ שְׁמוּאֵל֒ וַ/יָּ֤קָם שְׁמוּאֵל֙ וַ/יֵּ֣לֶךְ אֶל עֵלִ֔י וַ/יֹּ֣אמֶר הִנְ/נִ֔י כִּ֥י קָרָ֖אתָ לִ֑/י וַ/יֹּ֛אמֶר לֹֽא קָרָ֥אתִי בְנִ֖/י שׁ֥וּב שְׁכָֽב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/003/006.yaml
  text: Then the LORD called Samuel again. Samuel got up and went to Eli and said, “Here I am, because you called me.” But he said, “I did not call, my son. Go back; lie down.”
translation:
  language: ta
  text: பின்பு ஆண்டவர் மீண்டும் சாமுவேலைக் கூப்பிட்டார். சாமுவேல் எழுந்து ஏலியிடம் சென்று, “இதோ, நான் வந்திருக்கிறேன்; நீங்கள் என்னைக் கூப்பிட்டீர்களே” என்றான். அதற்கு அவர், “நான் கூப்பிடவில்லை, என் மகனே. திரும்பிப் போய்ப் படுத்துக்கொள்” என்றார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: ஆண்டவர்
  rationale: இறைநாமத்தைத் தமிழில் மரியாதையுடனும் பொதுவாக அறியப்பட்ட முறையிலும் பிரதிபலிக்கிறது.
- source_word: קְרֹא
  choice: கூப்பிட்டார்
  rationale: ஒருவரைத் தம்மிடம் வருமாறு குரலெழுப்பி அழைப்பது என்ற சூழல்சார் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: הִנְנִי
  choice: இதோ, நான் இருக்கிறேன்
  rationale: எபிரேயச் சொற்றொடரின் உடனிருப்பு மற்றும் பதிலளிக்கத் தயாராக இருப்பது ஆகிய நுணுக்கங்களைப் பாதுகாக்கிறது.
- source_word: כִּי
  choice: நீங்கள் என்னைக் கூப்பிட்டீர்களே
  rationale: சாமுவேல் ஏலியிடம் வந்ததற்கான காரணத்தைத் தரும் பயன்பாட்டை, இயல்பான தமிழ் வலியுறுத்தலுடன் வெளிப்படுத்துகிறது.
- source_word: שׁוּב שְׁכָב
  choice: திரும்பிப் போய்ப் படுத்துக்கொள்
  rationale: மீண்டும் சென்று படுத்துக்கொள்ளும்படி ஏலி கூறும் இரு கட்டளைகளையும் இயல்பாக இணைக்கிறது.
theological_decisions:
- issue: יהוה என்ற உடன்படிக்கைப் பெயரின் மொழிபெயர்ப்பு
  choice: ஆண்டவர்
  alternative: யாவே
  rationale: மூலத்தில் தனிப்பட்ட இறைநாமம் இருப்பதை உணர்ந்தபடியே, தமிழ் வேதாகம வாசகர்களுக்கு பரிச்சயமான மரியாதைமிக்க வழக்கைப் பயன்படுத்துகிறது; இவ்வசனத்தில் எந்தச் சமயப்பிரிவு சார்ந்த விளக்கத்தையும் சேர்க்கவில்லை.
- issue: கூப்பிட்டவரைப் பற்றிய கதையியல் முரண்பாடு
  choice: ஆண்டவர் கூப்பிட்டதாக உரையாளர் கூறினாலும், சாமுவேல் ஏலியே கூப்பிட்டதாக எண்ணுவதை அப்படியே வைத்தல்
  alternative: சாமுவேலின் தவறான புரிதலை விளக்கிச் சேர்த்தல்
  rationale: மூலக் கதையின் நாடகத் தாமதத்தையும் சாமுவேலின் அப்போதைய அறியாமையையும் விளக்கமின்றிப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழ்; எளிமையானதாயினும் கண்ணியமான கதையாடல். ஏலியிடம் சாமுவேல் பேசுவதால் மரியாதைப் பன்மையான “நீங்கள்” பயன்படுத்தப்பட்டுள்ளது; ஏலி இளைய சாமுவேலை அன்புடன் ஒருமையில் அழைக்கிறார்.
