  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל שְׁמוּאֵ֔ל הִנֵּ֧ה אָנֹכִ֛י עֹשֶׂ֥ה דָבָ֖ר בְּ/יִשְׂרָאֵ֑ל אֲשֶׁר֙ כָּל שֹׁ֣מְע֔/וֹ תְּצִלֶּ֖ינָה שְׁתֵּ֥י אָזְנָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/003/011.yaml
  text: Then the LORD said to Samuel, "Look, I am about to do a thing in Israel that will make both ears of everyone who hears of it tingle."
translation:
  language: ta
  text: அப்போது ஆண்டவர் சாமுவேலிடம், “இதோ, நான் இஸ்ரவேலில் ஒரு செயலைச் செய்யப்போகிறேன்; அதைக் கேட்கிற ஒவ்வொருவருடைய இரு காதுகளும் குடையும்,” என்றார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: ஆண்டவர்
  rationale: தேவனுடைய உடன்படிக்கைப் பெயரைத் தமிழ் வேதாகம மரபுக்கு ஏற்றவாறு மரியாதையுடன் குறிக்கிறது; தனிப்பட்ட உச்சரிப்பைத் திணிக்கவில்லை.
- source_word: הִנֵּה
  choice: இதோ
  rationale: வரவிருக்கும் தெய்வீகச் செயலின் மீது கவனத்தைத் திருப்பும் எபிரேய அறிவிப்புச் சொல்லின் வலிமையைப் பாதுகாக்கிறது.
- source_word: אָנֹכִי עֹשֶׂה דָבָר
  choice: நான் ... ஒரு செயலைச் செய்யப்போகிறேன்
  rationale: நிகழவிருக்கும் செயலைக் குறிக்கும் எபிரேய நிகழ்காலப் பயன்பாட்டை இயல்பான தமிழ் எதிர்கால அண்மைப் பொருளில் தருகிறது.
- source_word: תְּצִלֶּינָה שְׁתֵּי אָזְנָיו
  choice: அவருடைய இரண்டு காதுகளும் அதிரும்
  rationale: அதிர்ச்சியூட்டும் செய்தியைக் கேட்பதால் காதுகள் அதிரும் என்ற உயிர்ப்பான எபிரேய மொழிப்படிமத்தை இயன்றவரை நேரடியாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: தெய்வீகப் பெயர் יהוה
  choice: ஆண்டவர்
  alternative: யெகோவா / யாவே
  rationale: நவீனத் தமிழில் பரவலாகப் புரியும் மரியாதைமிக்க வடிவத்தைப் பயன்படுத்தி, சர்ச்சைக்குரிய குறிப்பிட்ட உச்சரிப்பைத் தீர்மானிக்காமல் விடுகிறது.
- issue: வரவிருக்கும் நியாயத்தீர்ப்பின் இயல்பு
  choice: ஒரு செயல்
  alternative: ஒரு காரியம் / பயங்கரமான செயல்
  rationale: இந்த வசனம் தானாகவே அந்தச் செயலை ‘பயங்கரமானது’ என்று வரையறுக்கவில்லை; சூழல் தரும் பதற்றத்தை கூடுதல் விளக்கச் சொல்லால் முன்கூட்டியே தீர்மானிக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழ்; எளிமையானதாயும் கண்ணியமானதாயும் உள்ளது. மூலத்தின் ‘இதோ’ என்ற கவன ஈர்ப்பும், ‘இரண்டு காதுகளும் அதிரும்’ என்ற வலுவான மொழிப்படிமமும் பாதுகாக்கப்பட்டுள்ளன.
