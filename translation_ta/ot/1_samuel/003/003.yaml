base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/003/003.yaml
  text: And the lamp of God had not yet gone out[a], and Samuel was lying down in the temple of Yahweh, where the ark of God was.
translation:
  language: ta
  text: தேவனுடைய விளக்கு இன்னும் அணைந்து போகவில்லை; தேவனுடைய பேழை இருந்த யாவேயின் ஆலயத்தில்[a] சாமுவேல் படுத்திருந்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ஆலயம்” என்பதற்கு “வழிபாட்டிடம்” என்றும் மொழிபெயர்க்கலாம். இங்கு எபிரெயச் சொல் சீலோவிலிருந்த யாவேயின் உறைவிடத்தைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: נֵר אֱלֹהִים
  choice: தேவனுடைய விளக்கு
  rationale: נֵר என்பது பொதுவான ‘ஒளி’ அல்ல, குறிப்பாக ‘விளக்கு’ என்பதைக் குறிக்கிறது. ‘தேவனுடைய’ என்ற உடைமைத் தொடர்பு எபிரெயக் கட்டமைப்பையும் வழிபாட்டுச் சூழலையும் இயல்பாகத் தக்கவைக்கிறது.
- source_word: טֶרֶם יִכְבֶּה
  choice: இன்னும் அணைந்துபோகவில்லை
  rationale: טֶרֶם ஒரு செயல் இதுவரை நிகழவில்லை என்பதையும், כבה விளக்கைப் பொறுத்தவரை ‘அணைதல்’ என்பதையும் குறிக்கின்றன. இந்த வடிவம் காலநிலையையும் இயல்பான தமிழையும் காக்கிறது.
- source_word: שֹׁכֵב
  choice: படுத்திருந்தான்
  rationale: இந்த வினையெச்ச வடிவம் சாமுவேல் படுத்திருந்த நிலையைக் காட்டுகிறது. ‘தூங்கிக்கொண்டிருந்தான்’ என்பது மூலத்தில் வெளிப்படையாக இல்லாத கருத்தைச் சேர்க்கும்.
- source_word: הֵיכַל יְהוָה
  choice: யாவேயின் ஆலயம்
  rationale: הֵיכַל என்பதற்கு ஆலயம் அல்லது பரிசுத்த இடம் என்று பொருள் வரலாம். இங்கு வழிபாட்டிடத்தைக் குறிக்கும் இயல்பான தமிழாக ‘ஆலயம்’ பயன்படுத்தப்பட்டுள்ளது; சீலோவிலிருந்த இந்த இடம் பிற்கால சாலொமோன் ஆலயம் என்று தவறாகப் புரிந்துகொள்ளப்படாதபடி மாற்று மொழிபெயர்ப்பு அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைப்பட்டத்தை மாற்றாக இடாமல், எபிரெயத் தனிப்பெயரின் பரவலாக ஏற்கப்பட்ட ஒலிபெயர்ப்பு தமிழில் வழங்கப்பட்டுள்ளது.
- source_word: אֲשֶׁר שָׁם אֲרוֹן אֱלֹהִים
  choice: தேவனுடைய பேழை இருந்த
  rationale: சார்பு வாக்கியம் அந்த இடத்தை அங்கிருந்த தேவனுடைய பேழையின் மூலம் அடையாளப்படுத்துகிறது. ‘பேழை’ என்பது אָרוֹן என்பதன் வழிபாட்டுச் சூழலுக்கு ஏற்ற தமிழ்; மூலத்தில் இவ்விடத்தில் இல்லாத ‘உடன்படிக்கை’ என்ற சொல்லை உரையில் சேர்க்கவில்லை.
theological_decisions:
- issue: சீலோவிலிருந்த முடியாட்சிக்கு முந்தைய வழிபாட்டிடத்தில் הֵיכַל יְהוָה என்பதன் மொழிபெயர்ப்பு
  choice: யாவேயின் ஆலயம்
  alternative: யாவேயின் பரிசுத்த இடம்
  rationale: הֵיכַל என்பதற்கு ‘ஆலயம்’ என்பது செல்லத்தக்க நேரடி பொருள். இருப்பினும், இது சாலொமோனின் பிற்கால ஆலயம் அல்லாமல் சீலோவிலிருந்த யாவேயின் உறைவிடத்தைக் குறிக்கும் என்பதால், வரலாற்றுச் சூழலைத் தெளிவுபடுத்தும் மாற்று அடிக்குறிப்பில் வைக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையும் கண்ணியமும் இணைந்த நடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய வசனத்தின் தொடர்ச்சியை அரைப்புள்ளி காக்கிறது. ‘படுத்திருந்தான்’ என்பது தூக்கத்தை ஊகிக்காமல் உடல் நிலையையே தெரிவிக்கிறது; ‘யாவே’ இறைத்தனிப்பெயராக ஒலிபெயர்க்கப்பட்டுள்ளது.
