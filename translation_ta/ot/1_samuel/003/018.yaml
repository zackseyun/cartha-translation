base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/003/018.yaml
  text: So Samuel told him all the words and hid nothing from him[a]. And he said, “He is Yahweh[b]; let him do what is good in his eyes.”
translation:
  language: ta
  text: அப்போது சாமுவேல் அந்த வார்த்தைகள் அனைத்தையும் ஏலியிடம் தெரிவித்தான்; அவரிடமிருந்து எதையும் மறைக்கவில்லை. அதற்கு ஏலி, “அவரே யாவே; தம் பார்வையில் நல்லதாயிருப்பதை[b] அவர் செய்யட்டும்[a]” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தம் பார்வையில் நல்லதாயிருப்பதை அவர் செய்வார்.” எபிரெய நிறைவுறாத வினைவடிவத்தை, ஏற்றுக்கொள்ளும் விருப்பமாகிய “செய்யட்டும்” என்றும் சாதாரண எதிர்காலமாகிய “செய்வார்” என்றும் புரிந்துகொள்ளலாம்.
    reason: alternative_reading
  - marker: b
    text: எபிரெயில் சொல்லாட்சியாக, “அவருடைய கண்களில் நல்லதாயிருப்பதை”; இது அவருடைய சொந்த மதிப்பீட்டின்படி நல்லது, அல்லது அவருக்கு நல்லதாகத் தோன்றுவது என்பதைக் குறிக்கும் மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּגֶּד
  choice: தெரிவித்தான்
  rationale: נגד என்பதன் ஹிஃபில் வடிவம் ‘தெரிவித்தல், அறிவித்தல்’ என்று பொருள்படும். சாமுவேல் ஏலியிடம் செய்தியை முழுமையாகச் சொன்னதை இயல்பான நவீனத் தமிழில் இது வெளிப்படுத்துகிறது.
- source_word: אֶת כָּל הַדְּבָרִים
  choice: அந்த வார்த்தைகள் அனைத்தையும்
  rationale: דְּבָרִים என்பது ‘வார்த்தைகள்’ அல்லது ‘காரியங்கள்’ எனப் பொருள்படலாம். இங்கு சாமுவேலுக்குக் கூறப்பட்ட செய்தியின் வார்த்தைகளைச் சுட்டுவதால், மூலத்தின் சொல் அமைப்பை நெருக்கமாகப் பேணும் வகையில் ‘அந்த வார்த்தைகள் அனைத்தையும்’ என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: וְלֹא כִחֵד מִמֶּנּוּ
  choice: அவனிடமிருந்து எதையும் மறைக்கவில்லை
  rationale: כחד என்பது மறைத்தல் அல்லது தெரிவிக்காமல் வைத்திருத்தல் என்ற பொருளுடையது. சாமுவேல் செய்தியின் எந்தப் பகுதியையும் ஏலியிடமிருந்து மறைக்கவில்லை என்ற வலியுறுத்தலை இச்சொற்றொடர் காக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய உரையில் வரும் இறைப் பெயரான יהוה, ஒரு பட்டப்பெயரால் மாற்றப்படாமல் தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: הוּא
  choice: அவர்
  rationale: எபிரெய வலியுறுத்தும் சுட்டுப்பெயரைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது. ‘அவர் யாவே’ என்பது ஏலி யாவேயின் அடையாளத்தையும் அதிகாரத்தையும் ஏற்றுக்கொள்வதைப் பிரதிபலிக்கிறது.
- source_word: הַטּוֹב
  choice: நல்லதாக இருப்பதை
  rationale: ‘நல்லது’ என்பதைக் குறிக்கும் இச்சொல், தொடர்ந்து வரும் ‘அவருடைய பார்வையில்’ என்ற கருத்துடன் இணைக்கப்பட்டுள்ளது; அதன் மதிப்பீட்டுத் தன்மையைத் தீர்த்துவிடாமல் காக்கிறது.
- source_word: בְּעֵינָיו
  choice: தமது பார்வைக்கு
  rationale: சொல்லாட்சியாக ‘அவருடைய கண்களில்’ என்றாலும், ஒருவருடைய மதிப்பீட்டின்படி அல்லது அவருக்கு நல்லதாகத் தோன்றுவது என்ற எபிரெய மரபுத்தொடரின் பொருளை இயல்பான தமிழில் ‘தமது பார்வைக்கு’ வெளிப்படுத்துகிறது.
- source_word: יַעֲשֶׂה
  choice: அவர் செய்யட்டும்
  rationale: வடிவியல் அடிப்படையில் இது நிறைவுறாத வினைவடிவம். சூழலில் தீர்ப்பை ஏற்றுக்கொள்ளும் விருப்பவினைப் பொருள் இயல்பாக இருப்பதால் ‘செய்யட்டும்’ தேர்ந்தெடுக்கப்பட்டுள்ளது; சாதாரண எதிர்காலப் பொருளும் அடிக்குறிப்பில் காக்கப்பட்டுள்ளது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூல உரை இறைவனுடைய தனிப்பட்ட பெயரை நேரடியாகப் பயன்படுத்துகிறது. எனவே பட்டப்பெயரால் மாற்றாமல் ஒலிபெயர்ப்பது மூலத்தின் வேறுபாட்டைக் காக்கிறது.
- issue: ஏலியின் இறுதிக் கூற்றில் יַעֲשֶׂה என்பதன் வினை வலிமை
  choice: அடங்கிய ஒப்புதலை வெளிப்படுத்தும் ‘அவர் செய்யட்டும்’
  alternative: எதிர்காலக் கூற்றாக ‘அவர் செய்வார்’
  rationale: சூழல் ஏலி அறிவிக்கப்பட்ட தீர்ப்பை ஏற்றுக்கொள்வதைக் காட்டுவதால் விருப்பவினை முதன்மை உரையில் பொருத்தமானது. இருப்பினும் எபிரெய நிறைவுறாத வினைவடிவு சாதாரண எதிர்காலமாகவும் புரிந்துகொள்ளப்பட முடியும் என்பதால் அந்தத் தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், இயல்பானதாயும் கண்ணியமானதாயும் வடிவமைக்கப்பட்டுள்ளது. சாமுவேல் இளைஞன் என்பதால் அவனைச் சுட்ட ‘அவன்’ வடிவமும், ஏலி மற்றும் யாவேக்கு மரியாதை வடிவங்களும் பயன்படுத்தப்பட்டுள்ளன. மூலத்தின் நேரடி தன்மையைப் பேணியபடியே தமிழில் தேவையற்ற செயற்கைச் சொல்லாட்சி தவிர்க்கப்பட்டுள்ளது.
