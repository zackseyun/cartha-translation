base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/003/002.yaml
  text: On that day[a], Eli was lying down in his place, and his eyes had begun to grow dim; he could not see.
translation:
  language: ta
  text: அந்த நாளில், ஏலி தன் இடத்தில் படுத்திருந்தார். அவருடைய கண்கள் மங்கத் தொடங்கியிருந்தன[a]; அவரால் பார்க்க முடியவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவருடைய கண் மங்கத் தொடங்கியிருந்தது.” எபிரெய வடிவத்தை ஒருமையாகப் புரிந்துகொள்ளலாம்; ஆனால் அது பார்வைத்திறனை மொத்தமாகக் குறிக்கும் கூட்டுப் பயன்பாடாகவும் இருக்கலாம். அதனால் முதன்மை உரையில் “கண்கள்” என்று தரப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: தனி வார்த்தையாக மொழிபெயர்க்காமல், பின்னணியை அறிமுகப்படுத்தும் வாக்கிய அமைப்பில் வெளிப்படுத்தப்பட்டது
  rationale: இது கதையின் சூழலை அறிமுகப்படுத்தும் தொடர் வடிவம். ‘அப்போது’ போன்ற மூலத்தில் வெளிப்படையாக இல்லாத காலச் சொல்லைச் சேர்க்காமல், இயல்பான தமிழ் வாக்கிய அமைப்பே அதன் உரையாடல் செயல்பாட்டை ஏற்கிறது.
- source_word: בַּיּוֹם הַהוּא
  choice: அந்த நாளில்
  rationale: முன்னரே குறிப்பிடப்பட்ட அல்லது கதையால் சுட்டப்படும் நாளைக் குறிக்கும் நேரடியான காலச் சொற்றொடர்.
- source_word: שֹׁכֵב
  choice: படுத்திருந்தார்
  rationale: எலி தொடர்ந்து படுத்திருந்த நிலையைக் குறிக்கும் பங்கேற்பு வடிவத்தின் நீடித்த தன்மையை இயல்பான தமிழில் தருகிறது.
- source_word: בִּמְקֹמוֹ
  choice: தன் இடத்தில்
  rationale: מָקוֹם என்பதன் பொதுவான பொருளான ‘இடம்’ என்பதையே காக்கிறது; மூலத்தில் இல்லாத ‘அறை’ போன்ற குறிப்பைச் சேர்ப்பதில்லை.
- source_word: וְעֵינוֹ
  choice: அவருடைய கண்கள்
  rationale: எழுத்துவடிவம் ஒருமையாகப் புரிந்துகொள்ளப்படலாம்; ஆனால் தொடர்ந்து வரும் பன்மை வினைவடிவமும் பார்வைத்திறனைக் குறிக்கும் கூட்டுப் பயன்பாடும் காரணமாக, இயல்பான தமிழில் பன்மை பயன்படுத்தப்பட்டது. மாற்று வாசிப்பு அடிக்குறிப்பில் காக்கப்படுகிறது.
- source_word: הֵחֵלּוּ כֵהוֹת
  choice: மங்கத் தொடங்கியிருந்தன
  rationale: பார்வை மங்கும் செயல் தொடங்கி முன்னேறிக்கொண்டிருந்ததைச் சுட்டும் தொடக்க மற்றும் நீடிப்பு நுணுக்கங்களை இரண்டையும் காக்கிறது.
- source_word: לֹא יוּכַל לִרְאוֹת
  choice: அவரால் பார்க்க முடியவில்லை
  rationale: எலியின் குறைந்துவரும் பார்வையின் நடைமுறை விளைவைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
