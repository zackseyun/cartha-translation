  text: וַ/יֹּ֨סֶף יְהוָ֥ה קְרֹא שְׁמוּאֵל֮ בַּ/שְּׁלִשִׁית֒ וַ/יָּ֨קָם֙ וַ/יֵּ֣לֶךְ אֶל עֵלִ֔י וַ/יֹּ֣אמֶר הִנְ/נִ֔י כִּ֥י קָרָ֖אתָ לִ֑/י וַ/יָּ֣בֶן עֵלִ֔י כִּ֥י יְהוָ֖ה קֹרֵ֥א לַ/נָּֽעַר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/003/008.yaml
  text: And Yahweh called Samuel again a third time. So he got up and went to Eli and said, “Here I am, for you called me.” Then Eli understood that Yahweh was calling the boy.
translation:
  language: ta
  text: யாவே சாமுவேலை மூன்றாவது முறையாக அழைத்தார். சாமுவேல் எழுந்து ஏலியிடம் சென்று, “இதோ, நான் இருக்கிறேன்; நீங்கள் என்னை அழைத்தீர்களே” என்றான். அப்போது யாவே அந்தச் சிறுவனை அழைத்துக்கொண்டிருந்தார் என்று ஏலி புரிந்துகொண்டார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּסֶף ... קְרֹא
  choice: மீண்டும் அழைத்தார்
  rationale: יָסַף + வினையெச்சம் இங்கு செயல் மீண்டும் நிகழ்ந்ததைக் குறிக்கிறது. தமிழில் ‘மீண்டும் அழைத்தார்’ என்பது இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைப்பட்டமான ‘கர்த்தர்’ என்பதைக் கொண்டு மாற்றாமல், எபிரெய தனிப்பெயரான יהוה-ஐ நவீன தமிழில் வழக்கமான ஒலிபெயர்ப்பாக அளிக்கிறது.
- source_word: בַּשְּׁלִשִׁית
  choice: அது மூன்றாவது முறை
  rationale: மூன்றாவது நிகழ்வைத் தெளிவாகக் குறிக்கிறது; ‘மீண்டும்’ என்பதோடு ஒரே சொற்றொடரில் ஏற்படும் தமிழ்ச் சொல் மீளுரையைத் தவிர்க்க தனி உட்பிரிவாக வழங்கப்பட்டுள்ளது.
- source_word: וַיָּקָם
  choice: எழுந்து
  rationale: கதைநடையில் இயல்பான நவீனத் தமிழ்; சாமுவேல் படுத்திருந்த நிலையிலிருந்து எழுந்த செயலைக் குறிக்கிறது.
- source_word: וַיֵּלֶךְ אֶל־עֵלִי
  choice: ஏலியிடம் சென்று
  rationale: ஏலியை நோக்கிச் சென்ற இயக்கத்தைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: הִנֵּנִי
  choice: இதோ, நான் இருக்கிறேன்
  rationale: அழைப்புக்குப் பதிலளிக்கும் தயார் நிலையையும் தன்னை முன்வைப்பதையும் காக்கும் வழக்கமான வேதாகமத் தமிழ் வடிவம்.
- source_word: כִּי קָרָאתָ לִי
  choice: நீங்கள் என்னை அழைத்தீர்களே
  rationale: כִּי தரும் காரண உணர்வையும், ஏலிதான் அழைத்தார் என்ற சாமுவேலின் எண்ணத்தையும் இயல்பான தமிழ் உரையாடலில் வெளிப்படுத்துகிறது.
- source_word: וַיָּבֶן
  choice: புரிந்துகொண்டார்
  rationale: நிலையை அப்போது உணர்ந்து அறிந்துகொண்டார் என்ற பொருளை எளிய நவீன தமிழில் தருகிறது.
- source_word: קֹרֵא
  choice: அழைக்கிறார்
  rationale: எபிரெயப் பங்கேற்பு வடிவத்தின் அந்நேரத் தொடர்நிலை உணர்வைத் தமிழ் நிகழ்காலம் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: לַנָּעַר
  choice: சிறுவனை
  rationale: இந்தக் கதைச்சூழலில் ஏலியின் பராமரிப்பில் இருக்கும் இளம் சாமுவேலைக் குறிக்க ‘சிறுவன்’ பொருத்தமானது.
theological_decisions:
- issue: יהוה என்ற இறைத் தனிப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூல உரை இறைவனின் தனிப்பெயரை நேரடியாகப் பயன்படுத்துவதால், அதை ஒரு பட்டத்தால் மாற்றாமல் ஒலிபெயர்த்து, உரையின் பெயர்சார் தன்மையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; எளிமையான, கண்ணியமான கதைநடை. எபிரெய உரையின் மீள்நிகழ்வு, உரையாடலின் காரண உணர்வு, கடைசி வாக்கியத்தின் தொடர்நிலை ஆகியவை இயல்பான தமிழில் காக்கப்பட்டுள்ளன.
