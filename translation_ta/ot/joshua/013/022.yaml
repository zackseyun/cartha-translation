source:
  edition: WLC
  text: וְ/אֶת בִּלְעָ֥ם בֶּן בְּע֖וֹר הַ/קּוֹסֵ֑ם הָרְג֧וּ בְנֵֽי יִשְׂרָאֵ֛ל בַּ/חֶ֖רֶב אֶל חַלְלֵי/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/022.yaml
  text: And Balaam son of Beor[a], the diviner, the sons of Israel killed with the sword among their slain.
translation:
  language: ta
  text: குறிசொல்பவனான பேயோரின் மகன் பிலேயாமையும் இஸ்ரவேல் மக்கள் தங்களால் கொல்லப்பட்டவர்களிடையே வாளால் கொன்றார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தங்களால் கொல்லப்பட்டவர்களோடு சேர்த்து.” இறுதியில் வரும் எபிரேயச் சொற்றொடர் சற்று வழக்கத்திற்கு மாறானது; இஸ்ரவேல் மக்கள் கொன்ற மற்றவர்களுடன் தொடர்புடைய விதத்தில் பிலேயாமும் கொல்லப்பட்டான் என்பதை அது குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אֶת
  choice: பிலேயாமையும்
  rationale: וְ என்பதன் சேர்க்கைப் பொருளைத் தமிழ் இரண்டாம் வேற்றுமையுடன் இணைந்த ‘-உம்’ இயல்பாக வெளிப்படுத்துகிறது; אֶת தனியே மொழிபெயர்க்கப்படாமல் நேரடிச் செயப்படுபொருள் வடிவில் பிரதிபலிக்கிறது.
- source_word: בִּלְעָם
  choice: பிலேயாம்
  rationale: எபிரேயத் தனிப்பெயருக்கு தமிழில் பரவலாக நிலைபெற்ற ஒலிபெயர்ப்பு பயன்படுத்தப்பட்டுள்ளது.
- source_word: בֶּן בְּעוֹר
  choice: பேயோரின் மகன்
  rationale: எபிரேயத் தந்தைவழி அடையாளத்தை இயல்பான நவீனத் தமிழில் நேரடியாக வழங்குகிறது.
- source_word: הַקּוֹסֵם
  choice: குறிசொல்பவன்
  rationale: קֹסֵם என்பது மறைமுறையில் குறி பார்த்துச் சொல்பவனைக் குறிக்கிறது. ‘குறிசொல்பவன்’ சுருக்கமாகவும் பொதுவாகப் புரியுமாறும் உள்ளது; மூலத்தின் எதிர்மறைச் சூழலையும் மிகைப்படுத்தாமல் தக்கவைக்கிறது.
- source_word: הָרְגוּ
  choice: கொன்றார்கள்
  rationale: கொல்லுதல் என்ற பொதுவான பொருளைத் தெளிவான நவீனத் தமிழில் தருகிறது; மூலத்தில் இல்லாத அலங்காரத்தைச் சேர்க்கவில்லை.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்கள்
  rationale: சொல்லுக்குச் சொல் ‘இஸ்ரவேலின் மகன்கள்’ என்றாலும், இங்கு இஸ்ரவேல் சமூகத்தாரை ஒட்டுமொத்தமாகக் குறிக்கிறது. ‘இஸ்ரவேல் மக்கள்’ நவீனத் தமிழில் இயல்பாகவும் பொருள் துல்லியமாகவும் உள்ளது.
- source_word: בַּחֶרֶב
  choice: வாளால்
  rationale: கருவிப் பொருளிலுள்ள בְּ முன்னொட்டையும் חֶרֶב என்பதையும் சுருக்கமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: אֶל חַלְלֵיהֶם
  choice: தங்களால் கொல்லப்பட்டவர்களிடையே
  rationale: அசாதாரணமான எபிரேயச் சொற்றொடர், இஸ்ரவேலர் கொன்ற மற்றவர்களுடன் தொடர்புடைய விதத்தில் பிலேயாமும் கொல்லப்பட்டதைச் சுட்டுகிறது. ‘இடையே’ என்பது ‘among’ என்ற தொடர்பைத் தக்கவைத்து, ‘சேர்த்து’ என்று முழுமையாகத் தீர்மானிக்காமல் சிறு தெளிவின்மையையும் காக்கிறது.
