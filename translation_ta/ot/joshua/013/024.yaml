translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. எபிரெய மூலத்தில் கொடுக்கப்பட்ட பொருள் வெளிப்படையாக இல்லாததால், ‘நிலத்தை’ போன்ற சொல்லைச் சேர்க்கவில்லை. ஒரே பெறுநரை விளக்கும் இரு சொற்றொடர்களின் தொடர்பைத் தெளிவாக்க ‘அதாவது’ பயன்படுத்தப்பட்டுள்ளது.
