  yaml_path: translation/ot/joshua/013/024.yaml
  text: And Moses gave to the tribe of Gad[a], to the sons of Gad, according to their clans.
translation:
  language: ta
  text: மோசே காத் கோத்திரத்துக்கு, காதின் மக்களுக்கு[a], அவர்களுடைய குலங்களின்படி கொடுத்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் நேரடியாக, “காதின் மகன்களுக்கு” என்று உள்ளது; இது காதின் பிள்ளைகள் அல்லது சந்ததியினரைக் குறிக்கும் வழக்கமான கோத்திர மரபுச் சொல்லாட்சி.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: கொடுத்தார்
  rationale: நָתַן என்ற வினை இங்கு நிலப் பங்கீட்டுச் சூழலில் கொடுத்தல் அல்லது ஒதுக்கித்தருதல் எனப் பொருள்படும். எபிரெயத்தைப் போலவே கொடுக்கப்பட்ட பொருள் இவ்வசனத்தில் வெளிப்படையாகச் சொல்லப்படவில்லை.
- source_word: מֹשֶׁה
  choice: மோசே
  rationale: தமிழில் வழக்கிலுள்ள பெயர் வடிவம்.
- source_word: לְמַטֵּה גָד
  choice: காத் கோத்திரத்துக்கு
  rationale: מַטֶּה என்பதற்கு நேரடியாக ‘கோல்’ என்றும் பொருள் உண்டு; ஆனால் இங்குள்ள வம்ச மற்றும் நிலப்பங்கீட்டுச் சூழலில் அது ‘கோத்திரம்’ என்பதையே குறிக்கிறது.
- source_word: לִבְנֵי גָד
  choice: காதின் மக்களுக்கு
  rationale: בְּנֵי என்பதன் நேரடிப் பொருள் ‘மகன்கள்’; கோத்திர மரபுச் சொல்லாட்சியில் அது காதின் பிள்ளைகள் அல்லது சந்ததியினர் எனும் விரிவான பொருளில் வருகிறது. இயல்பான தமிழுக்காக ‘மக்கள்’ பயன்படுத்தப்பட்டு, நேரடிப் பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: לְמִשְׁפְּחֹתָם
  choice: அவர்களுடைய குலங்களின்படி
  rationale: מִשְׁפָּחָה இங்கு கோத்திரத்துக்குள் உள்ள குலப் பிரிவைக் குறிக்கிறது; முன்னொட்டு לְ பகிர்ந்தளித்தல் ஒவ்வொரு குலத்தின்படியும் நடந்தது என்ற பொருளைத் தருகிறது.
