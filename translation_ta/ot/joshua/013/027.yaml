translation_notes:
  register: நவீனத் தரத் தமிழில், மரியாதையும் வாசிப்புத் தெளிவும் கொண்ட புவியியல் உரைநடை பயன்படுத்தப்பட்டுள்ளது. நீண்ட எபிரெயப் பட்டியல் மூன்று வாக்கியங்களாகப் பிரிக்கப்பட்டாலும், ஊர்கள், அரசின் எஞ்சிய பகுதி, எல்லை, கிழக்குப்புற இருப்பிடம் ஆகிய தகவல்களின் தொடர்பு பாதுகாக்கப்பட்டுள்ளது.
