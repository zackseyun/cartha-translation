source:
  edition: WLC
  text: וּ/בָ/עֵ֡מֶק בֵּ֣ית הָרָם֩ וּ/בֵ֨ית נִמְרָ֜ה וְ/סֻכּ֣וֹת וְ/צָפ֗וֹן יֶ֚תֶר מַמְלְכ֗וּת סִיחוֹן֙ מֶ֣לֶךְ חֶשְׁבּ֔וֹן הַ/יַּרְדֵּ֖ן וּ/גְבֻ֑ל עַד קְצֵה֙ יָם כִּנֶּ֔רֶת עֵ֥בֶר הַ/יַּרְדֵּ֖ן מִזְרָֽחָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/027.yaml
  text: and in the valley[a], Beth-haram, Beth-nimrah, Succoth, and Zaphon—the rest of the kingdom of Sihon king of Heshbon—with the Jordan as its border, as far as the lower end of the Sea of Kinnereth, beyond the Jordan eastward.
translation:
  language: ta
  text: பள்ளத்தாக்கில் பெத்-ஹாராம், பெத்-நிம்ரா, சுக்கோத், சாபோன் ஆகிய ஊர்களும், எஸ்போனின் அரசனான சீகோனின் அரசின் எஞ்சிய பகுதியும் இருந்தன; யோர்தான் அதற்கான எல்லையாக, கின்னரேத் கடலின் கடைமுனைவரை[a] இருந்தது. இவை யோர்தானுக்கு அப்பால் கிழக்கே இருந்தன.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கின்னரேத் கடலின் ஓரம்,” அல்லது “முனை/கோடிவரை.”
    reason: קְצֵה என்பதற்கு ‘முனை, கடைசி எல்லை’ அல்லது ‘ஓரம்’ என்ற பொருள்கள் வரலாம்; மூலத்தில் திசை குறிப்பாகத் தரப்படவில்லை.
lexical_decisions:
- source_word: וּ/בָ/עֵמֶק
  choice: பள்ளத்தாக்கிலிருந்த
  rationale: עֵמֶק என்பது பள்ளத்தாக்கு அல்லது தாழ்நிலத்தைக் குறிக்கிறது; இங்கு பட்டியலிடப்படும் ஊர்களின் புவியியல் இருப்பிடத்தை இயல்பான தமிழில் அறிமுகப்படுத்துகிறது.
- source_word: בֵּית הָרָם ... וְ/צָפוֹן
  choice: பெத்-ஹாராம், பெத்-நிம்ரா, சுக்கோத், சாபோன்
  rationale: இவை ஊர்ப்பெயர்கள் என்பதால் பொருள் மொழிபெயர்ப்பு செய்யாமல், எபிரெய ஒலிப்புக்கு நெருக்கமாகத் தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளன; צָפוֹן இங்கு ‘வடக்கு’ என்ற திசைப்பெயர் அல்ல.
- source_word: יֶתֶר מַמְלְכוּת סִיחוֹן מֶלֶךְ חֶשְׁבּוֹן
  choice: எஸ்போனின் அரசனான சீகோனுடைய அரசின் எஞ்சிய பகுதி
  rationale: יֶתֶר என்பதன் ‘எஞ்சிய பகுதி’ என்ற பொருளையும், מַמְלָכוּת என்பதன் அரசியல் ஆட்சிப்பரப்பு சார்ந்த பொருளையும் தெளிவாகக் காக்கிறது.
- source_word: הַ/יַּרְדֵּן וּ/גְבֻל
  choice: யோர்தான் அதன் எல்லையாக இருந்தது
  rationale: சுருக்கமான எபிரெய இணைப்பை, யோர்தான் ஆறு எல்லையாகச் செயல்பட்டது என்ற பொருள் தெளிவாகும் வகையில் இயல்பான தமிழில் வழங்குகிறது.
- source_word: עַד קְצֵה יָם כִּנֶּרֶת
  choice: கின்னரேத் கடலின் கடைமுனைவரை[a]
  rationale: קְצֵה என்பதன் ‘முனை/கடைசி எல்லை’ பொருளை வைத்திருக்கிறது; ‘தென் முனை’ என்று மூலத்தில் வெளிப்படையாக இல்லாத திசையைச் சேர்க்கவில்லை. சொல்லின் ‘ஓரம்’ என்ற மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: עֵבֶר הַ/יַּרְדֵּן מִזְרָחָ/ה
  choice: யோர்தானுக்கு அப்பால் கிழக்கே
  rationale: யோர்தானின் கிழக்குப் பக்கத்தைக் குறிக்கும் வழக்கமான நிலவியல் தொடரைச் சுருக்கமாகவும் தெளிவாகவும் அளிக்கிறது.
