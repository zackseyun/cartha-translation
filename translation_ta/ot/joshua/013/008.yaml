source:
  edition: WLC
  text: עִמּ֗/וֹ הָ/רֽאוּבֵנִי֙ וְ/הַ/גָּדִ֔י לָקְח֖וּ נַחֲלָתָ֑/ם אֲשֶׁר֩ נָתַ֨ן לָ/הֶ֜ם מֹשֶׁ֗ה בְּ/עֵ֤בֶר הַ/יַּרְדֵּן֙ מִזְרָ֔חָ/ה כַּ/אֲשֶׁר֙ נָתַ֣ן לָ/הֶ֔ם מֹשֶׁ֖ה עֶ֥בֶד יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/008.yaml
  text: With him[a], the Reubenites and the Gadites received their inheritance, which Moses gave them beyond the Jordan eastward, just as Moses the servant of Yahweh gave them.
translation:
  language: ta
  text: அவர்களோடு, ரூபனியரும் காதியரும், யோர்தானுக்கு அப்பால் கிழக்கே[a] மோசே அவர்களுக்குக் கொடுத்த தங்கள் உரிமைப் பங்கை, யாவேயின் ஊழியரான மோசே அவர்களுக்குக் கொடுத்தபடியே பெற்றுக்கொண்டார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அதாவது, யோர்தான் ஆற்றின் கிழக்குக் கரையில்.
    reason: பண்டைய இஸ்ரவேலின் பார்வைநிலையிலிருந்து வரும் ‘யோர்தானுக்கு அப்பால்’ என்ற இடக்குறிப்பைத் தெளிவுபடுத்துகிறது.
lexical_decisions:
- source_word: עִמּוֹ
  choice: அவனோடு
  rationale: மூன்றாம் நபர் ஆண்பால் ஒருமை விகுதி கொண்ட ‘உடன்’ என்ற முன்னிடைச்சொல்; முந்தைய சூழலில் மனாசேயின் பாதிக் கோத்திரத்தைக் குறிக்கிறது. மூலத்தின் சுட்டுப்பெயர் தன்மை அப்படியே வைக்கப்படுகிறது.
- source_word: הָרְאוּבֵנִי וְהַגָּדִי
  choice: ரூபனியரும் காதியரும்
  rationale: எபிரெயத்தில் ஒருமை இனப்பெயர் வடிவங்கள் என்றாலும், இங்கே இரு கோத்திர மக்களையும் கூட்டாகக் குறிக்கின்றன; தமிழில் மரியாதை/கூட்டுப் பன்மை இயல்பானது.
- source_word: לָקְחוּ
  choice: பெற்றுக்கொண்டார்கள்
  rationale: வினைச்சொல்லுக்கு ‘எடுத்தார்கள்’ அல்லது ‘பெற்றார்கள்’ எனப் பொருள் வரலாம். உரிமைச்சொத்து வழங்கப்படும் சூழலில் ‘பெற்றுக்கொண்டார்கள்’ இயல்பாகவும், அவர்களது ஏற்றுக்கொள்ளும் செயலைக் காட்டுவதாகவும் உள்ளது.
- source_word: נַחֲלָתָם
  choice: தங்கள் உரிமைச்சொத்தை
  rationale: נחלה இங்கு கோத்திரத்துக்கு உரிமையாக வழங்கப்பட்ட நிலப்பகுதியைக் குறிக்கிறது. ‘உரிமைச்சொத்து’ நில உரிமையையும் மரபுரிமை நுணுக்கத்தையும் தக்கவைக்கிறது.
- source_word: אֲשֶׁר נָתַן לָהֶם מֹשֶׁה
  choice: அதை மோசே அவர்களுக்கு ... கொடுத்திருந்தார்
  rationale: இந்தக் கொடை அவர்கள் பெற்றுக்கொண்டதற்கு முன்பே நிகழ்ந்தது என்பதைத் தமிழில் இறந்தகால நிறைவுவினை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: בְּעֵבֶר הַיַּרְדֵּן מִזְרָחָה
  choice: யோர்தானுக்கு அப்பால், கிழக்குப் பகுதியில்
  rationale: ஆற்றின் மறுபக்கத்தையும் அது கிழக்குப் பக்கம் என்பதையும் வெளிப்படையாகக் காட்டுகிறது; பார்வைநிலையால் குழப்பம் ஏற்படாதபடி அடிக்குறிப்பு சேர்க்கப்பட்டுள்ளது.
- source_word: כַּאֲשֶׁר
  choice: கொடுத்தபடியே
  rationale: ஒப்புமையையும் உறுதிப்படுத்தலையும் காட்டும் இணைப்புச் சொல்லின் வலிமையைத் தக்கவைக்கிறது. எபிரெய மூலத்திலுள்ள மோசேயின் கொடை குறித்த மறுகூறலை நீக்கவில்லை.
- source_word: עֶבֶד יְהוָה
  choice: யாவேயின் ஊழியரான
  rationale: மோசேயின் மதிப்புக்குரிய பட்டத்தை இயல்பான தமிழில் தருகிறது; இங்கு அடிமைநிலை அல்ல, இறைபணி முன்னிறுத்தப்படுகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: திருநாமத்தை ஒரு பொதுப் பட்டமாக மாற்றாமல், எபிரெய நான்கெழுத்துத் திருநாமத்தின் பரவலான தமிழ் ஒலிபெயர்ப்பாக வழங்குகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைத் திருநாமத்தை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: ஆண்டவர் / யெகோவா
  rationale: மூலத்தில் ஒரு பட்டமல்ல, இறைவனின் தனிப்பட்ட திருநாமமே உள்ளது. ‘யாவே’ அதைத் தமிழில் நேரடியாக ஒலிபெயர்த்து, மூல வேறுபாட்டைப் பாதுகாக்கிறது.
- issue: மோசேயின் கொடை இருமுறை கூறப்படுதல்
  choice: இரு குறிப்புகளையும் தக்கவைத்தல்
  alternative: ஒரே குறிப்பாகச் சுருக்குதல்
  rationale: எபிரெய உரை ‘மோசே கொடுத்தது’ என்பதை மீண்டும் கூறுகிறது. தமிழில் சற்று மீளுரையாகத் தோன்றினாலும், மூலத்தின் வலியுறுத்தலையோ சாத்தியமான உரைநடைத் தளர்வையோ மறைத்துச் சீராக்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டது. கோத்திரப் பெயர்களுக்கு இயல்பான கூட்டுப் பன்மை பயன்படுத்தப்பட்டுள்ளது. எபிரெய மூலத்தில் உள்ள இறுதி மறுகூறல் சீராக்கப்படாமல் பாதுகாக்கப்பட்டுள்ளது.
