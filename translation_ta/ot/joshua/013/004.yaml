  text: from the south[a], all the land of the Canaanites, and Mearah that belongs to the Sidonians, as far as Aphek[b], to the border of the Amorites.
translation:
  language: ta
  text: தெற்கிலிருந்து, கானானியரின் நாடு முழுவதும், சீதோனியருக்குச் சொந்தமான மேயாராவும்[a], ஆப்பெக்கு வரை, எமோரியரின் எல்லை வரை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “மேயாரா” என்பதற்குப் பதிலாக, מְעָרָה என்பதை ஊர்ப்பெயராக அல்லாமல் பொதுப்பெயராக எடுத்தால், “சீதோனியருக்குச் சொந்தமான குகையும்” என மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִתֵּימָן
  choice: தெற்கிலிருந்து
  rationale: תֵּימָן பொதுவாகத் தெற்கு அல்லது தென்திசையைக் குறிக்கிறது; இங்கு நிலப்பரப்பின் எல்லையை விவரிக்கும் சூழலில் திசைசார் பொருள் இயல்பாக உள்ளது.
- source_word: כָּל אֶרֶץ הַכְּנַעֲנִי
  choice: கானானியரின் நாடு முழுவதும்
  rationale: எபிரெயத்தில் ஒருமை இனப்பெயர் கூட்டுப்பொருளில் வருகிறது; தமிழில் ‘கானானியர்’ எனப் பன்மை மரியாதையற்ற இனக்குழுக் குறிப்பாக வழங்குவது இயல்பானதும் மூலத்தின் அமைப்புக்கு நெருக்கமானதும் ஆகும்.
- source_word: וּמְעָרָה
  choice: மேயாராவும்
  rationale: இச்சொல் ‘குகை’ என்ற பொதுப்பெயராகவும் புரிந்துகொள்ளப்படலாம்; ஆனால் நிலப்பகுதிகளின் பட்டியலில் இது ஊர்ப்பெயராக இருப்பதற்கான வாய்ப்பு அதிகம் என்பதால் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: אֲשֶׁר לַצִּידֹנִים
  choice: சீதோனியருக்குச் சொந்தமான
  rationale: לְ இங்கு தொடர்பு அல்லது உடைமையைக் குறிக்கிறது; நவீன தமிழில் ‘சொந்தமான’ என்பது இதைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: עַד אֲפֵקָה
  choice: ஆப்பெக்குவரை
  rationale: עַד மற்றும் திசைச்சுட்டும் இறுதி எழுத்து ஒரு இடம் வரையிலான நீட்சியைச் சுட்டுகின்றன; ‘வரை’ அதைச் சுருக்கமாகத் தெரிவிக்கிறது.
- source_word: עַד גְּבוּל הָאֱמֹרִי
  choice: எமோரியரின் எல்லைவரை
  rationale: גְּבוּל நிலவிவர்ணனையில் எல்லை அல்லது வரம்பைக் குறிக்கிறது; ஒருமை இனப்பெயரின் கூட்டுப்பொருள் தமிழில் ‘எமோரியர்’ என்று இயல்பாக வழங்கப்பட்டுள்ளது.
