  to: கீலேயாதும், கேசூரியர் மற்றும் மாகாத்தியரின் பிரதேசமும்[a], எர்மோன் மலைப்பகுதி முழுவதும்[b], சல்கா வரையுள்ள பாசான் முழுவதும்—
