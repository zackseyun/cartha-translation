  yaml_path: translation/ot/joshua/013/011.yaml
  text: and Gilead[a], and the territory of the Geshurite and the Maacathite, and all Mount Hermon[b], and all Bashan as far as Salecah—
translation:
  language: ta
  text: கீலேயாதும், கேசூரியர் மற்றும் மாகாத்தியரின் பிரதேசமும்[a], எர்மோன் மலைப்பகுதி முழுவதும்[b], சல்கா வரையுள்ள பாசான் முழுவதும்—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கேசூரியர் மற்றும் மாகாத்தியரின் எல்லையும்.” எபிரெயச் சொல் ஓர் எல்லைக்கோட்டையையோ மக்களுக்குரிய நிலப்பரப்பையோ குறிக்கலாம்; இங்குள்ள பிரதேசப் பட்டியலில் “பிரதேசம்” என்பது நன்கு பொருந்துகிறது.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில், “எர்மோன் மலை முழுவதும்.” இது மலையின் சிகரத்தை மட்டும் அல்லாமல் எர்மோன் மலைத்தொடர் அல்லது மலைநாடு முழுவதையும் குறிக்கக்கூடும்.
    reason: cultural_note
lexical_decisions:
- source_word: הַגִּלְעָד
  choice: கீலேயாத்
  rationale: இது ஒரு பிரதேசத்தின் பெயர்; எபிரெய உரையிலுள்ள சுட்டிடைச்சொல்லைத் தமிழில் தனியாக மொழிபெயர்ப்பது இயல்பல்ல.
- source_word: גְבוּל
  choice: ஆட்சிப்பகுதி
  rationale: இங்கு வெறும் எல்லைக்கோட்டைவிட, கேசூரியரும் மாகாத்தியரும் சார்ந்த நிலப்பரப்பைக் குறிக்கிறது; அதேவேளையில் அடிக்குறிப்பில் ‘எல்லை’ என்ற பொருள் சாத்தியம் பாதுகாக்கப்படுகிறது.
- source_word: הַגְּשׁוּרִי וְהַמַּעֲכָתִי
  choice: கேசூரியர் மற்றும் மாகாத்தியர்
  rationale: எபிரெய ஒருமை இனப்பெயர்கள் கூட்டுப்பொருளில் வருகின்றன; தமிழில் மக்களைக் குறிக்கும் மரியாதைப் பன்மை இயல்பாக உள்ளது.
- source_word: כֹל הַר חֶרְמוֹן
  choice: எர்மோன் மலைப்பகுதி முழுவதும்
  rationale: הַר என்பது தனி மலையையும் மலைநாட்டையும் குறிக்கலாம். ‘முழுவதும்’ என்பதுடன் இங்கு மொத்த மலைத்தொடர் அல்லது மலைப்பகுதி என்ற நிலவியல் பொருள் பொருத்தமாகிறது.
- source_word: כָל הַבָּשָׁן
  choice: பாசான் முழுவதும்
  rationale: பாசான் ஒரு பிரதேசப் பெயர்; כָּל என்பதன் முழுமைப் பொருளை ‘முழுவதும்’ தெரிவிக்கிறது.
- source_word: עַד סַלְכָה
  choice: சல்கா வரை
  rationale: עַד குறிக்கும் நிலப்பரப்பின் இறுதி எல்லையை இயல்பான தமிழில் தெளிவாகத் தெரிவிக்கிறது.
