translation_notes:
  register: நவீனத் தரத் தமிழில், தொடரும் நிலப்பரப்புப் பட்டியலின் வாக்கிய அமைப்பு காக்கப்பட்டுள்ளது. இடப்பெயர்கள் வழக்கமான தமிழ் ஒலிபெயர்ப்பில் தரப்பட்டுள்ளன; இறுதியிலுள்ள நீண்ட கோடு வசனம் அடுத்த பட்டியல் கூறுடன் தொடர்வதைக் காட்டுகிறது.
