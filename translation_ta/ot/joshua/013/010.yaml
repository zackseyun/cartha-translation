translation_notes:
  register: நிலப்பகுதிப் பட்டியலின் தொடர்ச்சியான, வினையில்லா சொற்றொடர் அமைப்பு பாதுகாக்கப்பட்டுள்ளது. மொழிநடை நவீனமும் கண்ணியமானதும்; வசனம் அடுத்த அல்லது முந்தைய பட்டியல் கூறுடன் இணைந்திருப்பதை இறுதியிலுள்ள அரைப்புள்ளி உணர்த்துகிறது. ஆங்கில ஆலோசனை உரையில் அடிக்குறி ‘Amorites’ என்பதற்குப் பின் இருந்தாலும், அதன் உள்ளடக்கமும் எபிரெய மூலமும் அது בְּנֵי עַמּוֹן என்பதற்கே உரியது என்பதைத் தெளிவுபடுத்துவதால், தமிழில் சரியான இடத்தில் குறியிடப்பட்டுள்ளது.
