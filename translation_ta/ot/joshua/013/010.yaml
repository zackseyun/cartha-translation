source:
  edition: WLC
  text: וְ/כֹ֗ל עָרֵי֙ סִיחוֹן֙ מֶ֣לֶךְ הָ/אֱמֹרִ֔י אֲשֶׁ֥ר מָלַ֖ךְ בְּ/חֶשְׁבּ֑וֹן עַד גְּב֖וּל בְּנֵ֥י עַמּֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/010.yaml
  text: and all the cities of Sihon king of the Amorites[a], who reigned in Heshbon, as far as the border of the sons of Ammon.
translation:
  language: ta
  text: மேலும், எஸ்போனில் அரசாண்ட எமோரியரின் அரசனான சீகோனுடைய எல்லா நகரங்களும், அம்மோன் மக்களின்[a] எல்லைவரையும்;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது “அம்மோனியரின்.” எபிரெயத்தில் “அம்மோனின் மகன்களின்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכֹל עָרֵי
  choice: மேலும் ... எல்லா நகரங்களும்
  rationale: וְ முந்தைய நிலப்பகுதிப் பட்டியலுடன் இப்பகுதியை இணைக்கிறது; כֹל என்பதன் முழுமையையும் עָרֵי என்பதன் பன்மை அமைப்பையும் இயல்பான தமிழில் காக்கிறது.
- source_word: סִיחוֹן
  choice: சீகோன்
  rationale: தனிப்பெயர் நவீனத் தமிழில் தெளிவாக ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: מֶלֶךְ הָאֱמֹרִי
  choice: எமோரியரின் அரசனான
  rationale: எபிரெயச் சொற்றொடரில் ஒருமை வடிவம் இருந்தாலும் அது இங்கு மக்களினத்தைக் கூட்டாகக் குறிக்கிறது; தமிழில் இயல்பாகப் பன்மை இனப்பெயர் பயன்படுத்தப்படுகிறது.
- source_word: אֲשֶׁר מָלַךְ
  choice: அரசாண்ட
  rationale: מָלַךְ என்பதில் உள்ள அரசருக்குரிய ஆட்சிப் பொருளைச் சுருக்கமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: בְּחֶשְׁבּוֹן
  choice: எஸ்போனில்
  rationale: בְ இடத்தைக் குறிக்கிறது; நகரப்பெயருடன் ‘-இல்’ இயல்பான தமிழ் வடிவமாகும்.
- source_word: עַד גְּבוּל
  choice: எல்லைவரையும்
  rationale: עַד குறிக்கும் நிலப்பரப்பின் கடைசி அளவைத் தமிழில் துல்லியமாக வெளிப்படுத்துகிறது.
- source_word: בְּנֵי עַמּוֹן
  choice: அம்மோனின் மக்களுடைய
  rationale: எபிரெயத்தின் ‘அம்மோனின் மகன்கள்’ என்ற வழிவந்த இனக்குறிப்பைச் சொற்படியாகக் கடினமாக்காமல், அதன் உறவுப் பொருளைக் காக்கும் இயல்பான தமிழ் வடிவம்; ‘அம்மோனியர்’ என்ற சுருக்கமான இனப்பெயர் அடிக்குறிப்பில் தரப்படுகிறது.
