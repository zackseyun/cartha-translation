base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/016.yaml
  text: Their border was from Aroer[a], which is on the edge of the Valley of the Arnon, and the city that is in the middle of the valley[b], and all the tableland as far as Medeba.
translation:
  language: ta
  text: அவர்களுக்குரிய எல்லை அர்னோன் பள்ளத்தாக்கின் கரையிலுள்ள அரோவேரிலிருந்து தொடங்கி, அந்தப் பள்ளத்தாக்கின் நடுவிலுள்ள நகரத்தையும் மேதேபா வரையிலுள்ள மேட்டுநிலம் முழுவதையும் உள்ளடக்கியதாக இருந்தது.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “பள்ளத்தாக்கு” என்பதற்கான எபிரேயச் சொல் ஓடையையோ, பருவகால வற்றோடையையோ, பள்ளத்தாக்குப் பள்ளத்தையையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “மேட்டுநிலம்” என்பதை “பீடபூமி” அல்லது “சமநிலம்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי לָהֶם הַגְּבוּל
  choice: அவர்களுடைய எல்லை ... அமைந்திருந்தது
  rationale: எபிரேய மொழியின் உடைமைத் தொடரை இயல்பான நவீனத் தமிழில் எல்லை விவரிப்பாக வழங்குகிறது.
- source_word: מֵעֲרוֹעֵר
  choice: அரோவேரிலிருந்து
  rationale: מִן தொடக்கப் புள்ளியைக் குறிக்கிறது; இடப்பெயர் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: אֲשֶׁר עַל שְׂפַת נַחַל אַרְנוֹן
  choice: அர்னோன் பள்ளத்தாக்கின் விளிம்பில் உள்ள
  rationale: שָׂפָה என்பதன் விளிம்பு/கரை என்ற இடவியல் பொருளையும், נַחַל என்பதன் பள்ளத்தாக்கு அல்லது வற்றோடைப் பள்ளம் என்ற பரப்பையும் தெளிவாகக் காட்டுகிறது.
- source_word: וְהָעִיר אֲשֶׁר בְּתוֹךְ הַנַּחַל
  choice: அந்தப் பள்ளத்தாக்கின் நடுவில் உள்ள நகரத்திலிருந்தும்
  rationale: בְּתוֹךְ என்பதன் ‘நடுவில்/உள்ளே’ என்ற இடவியல் பொருளை நேரடியாகப் பாதுகாக்கிறது; தொடரிலுள்ள מִן அடுத்த கூறுகளுக்கும் பொருந்துவதாகத் தமிழில் வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: וְכָל הַמִּישֹׁר
  choice: மேட்டுநிலம் முழுவதிலிருந்தும்
  rationale: மִישׁוֹר இங்கு யோர்தானுக்கு கிழக்கேயுள்ள சமமான உயர்நிலப் பரப்பைக் குறிக்கிறது; ‘மேட்டுநிலம்’ என்பது வெறும் தாழ்நிலச் சமவெளி என்ற தவறான எண்ணத்தைத் தவிர்க்கிறது.
- source_word: עַל מֵידְבָא
  choice: மேதேபாவரை உள்ள
  rationale: எல்லை விவரிப்பில் עַל ஒரு இடம் வரையிலான பரப்பைக் குறிக்கலாம்; தமிழில் ‘வரை’ அந்த எல்லையை இயல்பாகத் தெரிவிக்கிறது.
