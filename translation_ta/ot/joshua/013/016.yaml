  register: நவீன நிலையான தமிழில், புவியியல் எல்லை விவரிப்பின் மரியாதைமிக்க உரைநடையைப் பேணியுள்ளோம். எபிரேயத் தொடரில் தொடக்கத்திலுள்ள מִן பின்வரும் இணைப்பு உறுப்புகளுக்கும் நீளுவதைத் தமிழில் ‘-இலிருந்தும்’ என வெளிப்படையாக்கியுள்ளோம்.
