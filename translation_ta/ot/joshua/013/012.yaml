base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/012.yaml
  text: all the kingdom of Og in Bashan[a], who reigned in Ashtaroth and in Edrei—he was left of the remnant of the Rephaim. Moses struck them down and dispossessed them.
translation:
  language: ta
  text: பாசானில் அஸ்தரோத்திலும் எத்ரேயியிலும் அரசாண்ட ஓகின் முழு அரசும்—அவன் ரெப்பாயீமியரில்[a] எஞ்சியிருந்தவர்களில் ஒருவனாக இருந்தான். மோசே அவர்களை முறியடித்து, அவர்களை உடைமையிழக்கச் செய்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘இராட்சதர்கள்.’ எபிரெயத்தில் ‘ரெப்பாயீம்’; இது பழங்கால மக்கள் குழு ஒன்றின் பெயராக இருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל מַמְלְכוּת עוֹג בַּבָּשָׁן
  choice: பாசானில் ... ஓகின் முழு அரசும்
  rationale: כָּל என்பதுடன் ஒருமை மַמְלְכוּת வருவதால், ஓகின் ஆட்சிப்பரப்பு முழுவதையும் குறிக்கும் வகையில் ‘முழு அரசும்’ என மொழிபெயர்க்கப்பட்டது; בַּבָּשָׁן இடத்தைக் குறிக்கும் ‘பாசானில்’ என வழங்கப்பட்டது.
- source_word: אֲשֶׁר מָלַךְ בְּעַשְׁתָּרוֹת וּבְאֶדְרֶעִי
  choice: அஸ்தரோத்திலும் எத்ரேயியிலும் அரசாண்ட
  rationale: מָלַךְ என்பதன் அரசருக்குரிய ஆட்சி நுட்பத்தை ‘அரசாண்ட’ காக்கிறது; இரு இடப்பெயர்களும் ஒலிபெயர்க்கப்பட்டுள்ளன.
- source_word: הוּא נִשְׁאַר מִיֶּתֶר הָרְפָאִים
  choice: அவன் ரெப்பாயீமியரில் எஞ்சியிருந்தவர்களில் ஒருவன்
  rationale: נִשְׁאַר என்பதன் ‘எஞ்சியிருத்தல்’ பொருளை இயல்பான தமிழில் தருகிறது. எபிரெயத்தில் வெளிப்படையாக இல்லாத ‘அவன் மட்டுமே’ என்ற கருத்தைச் சேர்க்காமல், மீந்திருந்த குழுவைச் சேர்ந்தவன் என்ற உறவைத் தெளிவாக்குகிறது.
- source_word: הָרְפָאִים
  choice: ரெப்பாயீமியர்
  rationale: இதை ‘இராட்சதர்கள்’ என்று விளக்கவுரைபோல் தீர்மானிக்காமல், பழங்கால மக்கள் குழுவின் பெயராக ஒலிபெயர்ப்பது மூலத்தின் தெளிவின்மையைக் காக்கிறது.
- source_word: וַיַּכֵּם מֹשֶׁה
  choice: மோசே அவர்களை முறியடித்து
  rationale: נכה என்பதன் போர்ச் சூழலிலான தாக்கி வீழ்த்துதல் அல்லது தோற்கடித்தல் என்ற வலிமையை ‘முறியடித்து’ இயல்பாக வெளிப்படுத்துகிறது; பன்மை பின்னொட்டு ‘அவர்களை’ எனக் காக்கப்பட்டுள்ளது.
- source_word: וַיֹּרִשֵׁם
  choice: அவர்களைத் தங்கள் நாட்டிலிருந்து அகற்றினார்
  rationale: Hifil வடிவிலுள்ள ירשׁ இங்கு அவர்களைத் தங்கள் உடைமையான நாட்டிலிருந்து நீக்குதல் என்ற பொருளைத் தருகிறது. ‘உடைமையிழக்கச் செய்தார்’ என்பதைக் காட்டிலும் இது இயல்பான நவீன தமிழாகவும், வெறும் ‘விரட்டினார்’ என்பதைக் காட்டிலும் நிலவுடைமை நுட்பத்தைத் தெளிவாகவும் தருகிறது.
theological_decisions:
- issue: רְפָאִים என்பதன் மொழிபெயர்ப்பு
  choice: ரெப்பாயீமியர்
  alternative: இராட்சதர்கள்
  rationale: இந்த எபிரெயச் சொல் அறியப்பட்ட பழங்கால மக்கள் குழுவின் பெயராகச் செயல்படுகிறது. அவர்களின் இயல்பைப் பற்றிய ஒரு குறிப்பிட்ட கருத்தை முதன்மை உரையில் திணிக்காமல், ஒலிபெயர்ப்பை வைத்துக் கொண்டு மாற்று விளக்கத்தை அடிக்குறிப்பில் தருவது பொருத்தமானது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டது. மூலத்தின் தொடர்ச்சியான பட்டியல் அமைப்பை நீண்ட கோடும் ‘முழு அரசும்’ என்ற வடிவமும் ஓரளவு காக்கின்றன. அடிக்குறிப்பு குறியீடு அது விளக்கும் ‘ரெப்பாயீமியர்’ என்ற சொல்லுக்குப் பின்பே வைக்கப்பட்டுள்ளது.
