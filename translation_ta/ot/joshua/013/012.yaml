- from: பாசானில் அஸ்தரோத்திலும் எத்ரேயியிலும் அரசாண்ட ஓகின் முழு அரசும்—அவன் ரெப்பாயீமியரில்[a] எஞ்சியிருந்தவர்களில் ஒருவன். மோசே அவர்களை முறியடித்து, அவர்களைத் தங்கள் நாட்டிலிருந்து அகற்றினார்.
  to: பாசானில் அஸ்தரோத்திலும் எத்ரேயியிலும் அரசாண்ட ஓகின் முழு அரசும்—அவன் ரெப்பாயீமியரில்[a] எஞ்சியிருந்தவர்களில் ஒருவனாக இருந்தான். மோசே அவர்களை முறியடித்து, அவர்களை உடைமையிழக்கச் செய்தார்.
