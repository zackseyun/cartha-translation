translation_notes:
  register: நவீனத் தரத் தமிழில், நகரப் பட்டியலுக்குரிய சுருக்கத்தையும் கண்ணியமான நடையையும் காக்கிறது. மூலத்தின் இணைப்புச் சொற்களைத் தமிழில் இயல்பாகத் தொடர்ந்து மீட்டுரைக்காமல் பட்டியலாக வழங்குகிறது; ‘இருந்த’ என்பது இடத்தொடரின் உறவைத் தெளிவுபடுத்துகிறது.
