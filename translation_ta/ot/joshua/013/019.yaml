lexical_decisions:
- source_word: קִרְיָתַיִם
  choice: கீரியாத்தாயிம்
  rationale: இது ஓர் இடப்பெயர் என்பதால் மொழிபெயர்க்காமல், எபிரெய ஒலிப்புக்கு ஏற்றவாறு தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: שִׂבְמָה
  choice: சிப்மா
  rationale: இடப்பெயராக இருப்பதால் எபிரெய உச்சரிப்பை அணுகும் வகையில் தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: צֶרֶת הַשַּׁחַר
  choice: செரேத்-சாகார்
  rationale: நகரங்களின் பட்டியலில் வரும் கூட்டிடப்பெயராகக் கருதி, அதன் இரு கூறுகளும் மொழிபெயர்க்கப்படாமல் ஒலிபெயர்க்கப்பட்டுள்ளன.
- source_word: בְּהַר הָעֵמֶק
  choice: பள்ளத்தாக்கின் குன்றின்மேல்
  rationale: בְּ என்பது இடத்தைக் குறிக்கும் ‘மேல்’ என்றும், הַר உள்ளூர் நிலவியல் சூழலில் இயல்பான ‘குன்று’ என்றும், construct தொடர் ‘பள்ளத்தாக்கின் குன்று’ என்றும் வழங்கப்பட்டுள்ளது.
