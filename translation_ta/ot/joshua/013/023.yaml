translation_notes:
  register: நவீன, செம்மையான, பொதுவாசகர்களுக்கு எளிதில் புரியும் தமிழ் பயன்படுத்தப்பட்டது. ‘ரூபன் மக்கள்’ இனக்குழுப் பொருளைத் தெளிவாக்குகிறது; ‘உரிமைப்பங்கு’ நிலப் பகிர்வுச் சூழலை இயல்பாக எடுத்துரைக்கிறது. மூலத்தின் சுருக்கத்தால் உள்ள எல்லைத் தொடரின் தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்பட்டது.
