  text: וַ/יְהִ֗י גְּבוּל֙ בְּנֵ֣י רְאוּבֵ֔ן הַ/יַּרְדֵּ֖ן וּ/גְב֑וּל זֹ֣את נַחֲלַ֤ת בְּנֵֽי רְאוּבֵן֙ לְ/מִשְׁפְּחֹתָ֔/ם הֶ/עָרִ֖ים וְ/חַצְרֵי/הֶֽן־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/023.yaml
  text: And the border of the sons of Reuben was the Jordan and its border. This was the inheritance of the sons of Reuben according to their clans[a], the cities and their villages.
translation:
  language: ta
  text: ரூபன் மக்களின் எல்லை யோர்தானும் அதன் எல்லையும் இருந்தது.[a] அவர்களுடைய குலங்களின்படி ரூபன் மக்களுக்குக் கிடைத்த உரிமைப்பங்கு இதுவே—பட்டணங்களும் அவற்றைச் சேர்ந்த கிராமங்களும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘யோர்தானே எல்லையாக இருந்தது’ என்றும் மொழிபெயர்க்கலாம். ‘யோர்தானும் எல்லையும்’ என்ற எபிரேயத் தொடர் சுருக்கமானது; யோர்தானையே எல்லைக்கோடாக அடையாளப்படுத்துவதாகவும் இதைப் புரிந்துகொள்ளலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: இருந்தன
  rationale: இந்த எல்லை விவரிப்புச் சூத்திரத்தில் היה, ஒன்று புதிதாக உருவானதைக் காட்டாமல் எல்லை எது என்பதைத் தெரிவிக்கிறது; தமிழில் இயல்பான இறந்தகால வடிவம் பயன்படுத்தப்பட்டது.
- source_word: גְּבוּל
  choice: எல்லை
  rationale: நிலப்பகுதியின் வரம்பைக் குறிக்கும் இச்சூழலில் ‘எல்லை’ துல்லியமாகவும் இயல்பாகவும் உள்ளது.
- source_word: בְּנֵי רְאוּבֵן
  choice: ரூபன் மக்கள்
  rationale: எபிரெய மரபுவழிச் சொற்றொடரின் இனக்குழுப் பொருளை நவீனத் தமிழில் தெளிவாகத் தெரிவிக்கிறது; ‘ரூபனின் மகன்கள்’ என்பது இங்கு தனிநபர் மகன்களைக் குறிப்பதாகத் தவறாகப் புரிந்துகொள்ளப்படலாம்.
- source_word: הַיַּרְדֵּן
  choice: யோர்தான்
  rationale: ஆற்றைக் குறிக்கும் வழக்கமான பெயர்; சூழலால் ‘ஆறு’ என்பது தெளிவாக இருப்பதால் பெயருடன் அதைச் சேர்க்கவில்லை.
- source_word: וּגְבוּל
  choice: அதன் எல்லைப்பகுதி
  rationale: மிகச் சுருக்கமான எபிரெயத் தொடரை இயல்பான தமிழில் வெளிப்படுத்துகிறது; எழுதப்பட்ட வடிவில் உடைமைப் பின்னொட்டு இல்லாததால் மாற்றுப் புரிதல் அடிக்குறிப்பில் பாதுகாக்கப்பட்டது.
- source_word: נַחֲלַת
  choice: உரிமைப்பங்கு
  rationale: யோசுவாவில் கோத்திரத்துக்குப் பகிர்ந்தளிக்கப்பட்ட நிலப்பங்கைக் குறிக்கிறது. நவீனத் தமிழில் வேறு பொருள் மேலோங்கியுள்ள ‘சுதந்தரம்’ என்பதைக் காட்டிலும் இது தெளிவானது.
- source_word: לְמִשְׁפְּחֹתָם
  choice: அவர்களுடைய குலங்களின்படி
  rationale: கோத்திரத்துக்குள் உள்ள வம்சக் குழுக்களை מִשְׁפָּחוֹת குறிக்கிறது; ‘குடும்பங்கள்’ என்பதைவிட ‘குலங்கள்’ இங்கு துல்லியமானது.
- source_word: הֶעָרִים
  choice: பட்டணங்கள்
  rationale: நிலப்பங்குப் பட்டியல்களில் வரும் குடியிருப்பு மையங்களைச் சுட்டும் இயல்பான தமிழ் சொல்.
- source_word: וְחַצְרֵיהֶן
  choice: அவற்றைச் சேர்ந்த கிராமங்கள்
  rationale: பட்டணங்களைச் சார்ந்த சிறிய, பொதுவாக மதிலற்ற குடியிருப்புகளைத் தெளிவாகக் குறிக்கிறது.
