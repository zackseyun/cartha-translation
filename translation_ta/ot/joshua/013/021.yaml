  text: וְ/כֹל֙ עָרֵ֣י הַ/מִּישֹׁ֔ר וְ/כָֽל מַמְלְכ֗וּת סִיחוֹן֙ מֶ֣לֶךְ הָ/אֱמֹרִ֔י אֲשֶׁ֥ר מָלַ֖ךְ בְּ/חֶשְׁבּ֑וֹן אֲשֶׁר֩ הִכָּ֨ה מֹשֶׁ֜ה אֹת֣/וֹ וְ/אֶת נְשִׂיאֵ֣י מִדְיָ֗ן אֶת אֱוִ֤י וְ/אֶת רֶ֨קֶם֙ וְ/אֶת צ֤וּר וְ/אֶת חוּר֙ וְ/אֶת רֶ֔בַע נְסִיכֵ֣י סִיח֔וֹן יֹשְׁבֵ֖י הָ/אָֽרֶץ־׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/021.yaml
  text: 'and all the cities of the plateau[a], and all the kingdom of Sihon king of the Amorites, who reigned in Heshbon, whom Moses struck down—him and the chiefs of Midian: Evi, Rekem, Zur, Hur, and Reba, the princes of Sihon[c][b], who lived in the land.'
translation:
  language: ta
  text: மேட்டு நிலத்தின் எல்லா நகரங்களும்[a], எஸ்போனில் ஆட்சி செய்த எமோரியரின் ராஜாவான சீகோனின் முழு ராஜ்யமும் இதில் அடங்கின. மோசே சீகோனையும், அந்த நாட்டில் வாழ்ந்த ஏவி, ரேக்கேம், சூர், ஊர், ரேபா ஆகிய மீதியானியத் தலைவர்களையும் வீழ்த்தினார்[b]; அவர்கள் சீகோனின் பிரபுக்கள்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘சமவெளியின் நகரங்கள்’ அல்லது ‘உயர்ந்த சமநிலப் பகுதியின் நகரங்கள்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயில் ‘அடித்தார்’; இந்தப் போர்ச் சூழலில் அது தீர்மானமாகத் தோற்கடித்து வீழ்த்தியதைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: c
    text: 'எபிரெயில் இரண்டு வேறுபட்ட பதவிச் சொற்கள் உள்ளன: ‘மீதியானியத் தலைவர்கள்’ (נְשִׂיאֵי), ‘சீகோனின் பிரபுக்கள்’ (נְסִיכֵי).'
    reason: lexical_alternative
lexical_decisions:
- source_word: עָרֵי הַמִּישֹׁר
  choice: மேட்டு நிலத்தின் எல்லா நகரங்கள்
  rationale: מִישׁוֹר இங்கு யோர்தானுக்குக் கிழக்கேயுள்ள சமமான உயர்நிலப் பகுதியைக் குறிக்கிறது; ‘மேட்டு நிலம்’ என்பது பொதுவான ‘சமவெளி’ என்பதைவிட நில அமைப்பைத் தெளிவாகக் காட்டுகிறது.
- source_word: מַמְלְכוּת סִיחוֹן
  choice: சீகோனின் முழு ராஜ்யம்
  rationale: מַמְלְכוּת என்பது அரசாட்சி நிலப்பரப்பாகிய ‘ராஜ்யம்’ என்று நேரடியாகப் பொருள்படும்; כָל என்பதற்காக ‘முழு’ சேர்க்கப்பட்டது.
- source_word: מֶלֶךְ הָאֱמֹרִי
  choice: எமோரியரின் ராஜாவாகிய
  rationale: எபிரெய கட்டமைப்பிலுள்ள உறவை நேரடியாகவும் இயல்பான தமிழிலும் வெளிப்படுத்துகிறது.
- source_word: אֲשֶׁר מָלַךְ בְּחֶשְׁבּוֹן
  choice: எஸ்போனில் ஆட்சி செய்த
  rationale: מָלַךְ என்பதன் அரசனாக ஆளுதல் என்ற கருத்தை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: אֲשֶׁר הִכָּה מֹשֶׁה אֹתוֹ
  choice: மோசே சீகோனை ... வீழ்த்தினார்
  rationale: נכה என்ற வினை இராணுவச் சூழலில் தீர்மானமாகத் தோற்கடித்தல் அல்லது வீழ்த்துதல் எனப் பொருள்படும். எபிரெய மீள்சுட்டுப் பெயர்ச்சொல்லை தமிழில் பெயரை மீண்டும் கூறி தெளிவாக்குகிறது.
- source_word: נְשִׂיאֵי מִדְיָן
  choice: மீதியானியத் தலைவர்கள்
  rationale: נָשִׂיא என்பதன் தலைமைப் பதவியைத் தெரிவிக்கிறது; பின்னர் வரும் வேறுபட்ட பதவிச் சொல்லோடு ஒன்றாக்காமல் இருக்கிறது.
- source_word: אֱוִי וְאֶת רֶקֶם וְאֶת צוּר וְאֶת חוּר וְאֶת רֶבַע
  choice: ஏவி, ரேக்கேம், சூர், ஊர், ரேபா
  rationale: எபிரெய தனிப்பெயர்கள் நவீன தமிழில் உச்சரிக்க ஏற்றவாறு ஒலிபெயர்க்கப்பட்டன.
- source_word: נְסִיכֵי סִיחוֹן
  choice: சீகோனுக்குக் கீழிருந்த ஆட்சியாளர்கள்
  rationale: נְסִיכֵי என்பது ஆளும் பதவியுடையவர்களைக் குறிக்கிறது. ‘கீழிருந்த’ என்பது construct உறவை, இவர்கள் சீகோனின் மேலாட்சிக்குட்பட்டவர்கள் என்ற இயல்பான தமிழில் தருகிறது; முந்தைய נְשִׂיאֵי என்பதிலிருந்து வேறுபாடு காக்கப்படுகிறது.
- source_word: יֹשְׁבֵי הָאָרֶץ
  choice: அந்த நாட்டில் வாழ்ந்த
  rationale: ישׁב வினையின் குடியிருத்தல் என்ற பொருளைத் தெளிவான நவீன தமிழில் தருகிறது.
theological_decisions:
- issue: மீதியானியத் தலைவர்களுக்கும் சீகோனுக்கும் உள்ள அரசியல் உறவு
  choice: ‘சீகோனுக்குக் கீழிருந்த ஆட்சியாளர்கள்’ என்று மொழிபெயர்த்து, சீகோனுடன் தொடர்புடைய அவர்களது பதவியை வெளிப்படுத்துதல்
  alternative: ‘சீகோனின் இளவரசர்கள்’ என்று நேரடியாக மொழிபெயர்த்தல்
  rationale: נְסִיכֵי סִיחוֹן என்பது சீகோனுக்குரிய அல்லது அவருக்குக் கீழ்ப்பட்ட ஆட்சியாளர்களைக் குறிக்கலாம்; ‘இளவரசர்கள்’ என்பது குடும்ப உறவைக் குறிக்கும் தவறான எண்ணத்தை ஏற்படுத்தக்கூடும். ஆகவே உரையில் இல்லாத வம்ச உறவைச் சேர்க்காமல் அரசியல் சார்பை மட்டும் தெரிவிக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாக வாசிக்கும்படி நீண்ட எபிரெய வாக்கியம் இரண்டு வாக்கியங்களாகப் பிரிக்கப்பட்டது. வரலாற்று-அரச மரியாதைத் தொனியைப் பேண ‘ராஜா’, ‘ராஜ்யம்’, ‘ஆட்சியாளர்கள்’ பயன்படுத்தப்பட்டன. அனைத்து அடிக்குறிப்பு குறியீடுகளும் உரையில் இடம்பெற்றுள்ளன.
