  text: This was the inheritance of the sons of Gad according to their clans—the cities and their villages[a].
translation:
  language: ta
  text: 'இதுவே காதின் மகன்களின் குலங்களின்படியான உரிமைப்பங்கு: நகரங்களும் அவற்றின் கிராமங்களும்.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது, “இது காதின் மகன்களின் குலங்களின்படியான உரிமைப்பங்காக இருந்தது: நகரங்களும் அவற்றின் கிராமங்களும்.” எபிரெயச் சுருக்க வாய்பாட்டில் காலத்தைக் குறிக்கும் இணைப்புவினை வெளிப்படையாக இல்லை.'
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹאת
  choice: இது ... ஆகும்
  rationale: பெண்பால் ஒருமைச் சுட்டுப்பெயர் முன்பு விவரிக்கப்பட்ட நிலப்பங்கைச் சுட்டுகிறது. எபிரெய மொழியில் காலத்தைக் குறிக்கும் இணைப்புவினை வெளிப்படையாக இல்லாததால், தமிழில் இயல்பான நிகழ்காலச் சுருக்கக் கூற்றாக வழங்கப்பட்டது; இறந்தகாலமும் சாத்தியம்.
- source_word: נַחֲלַת
  choice: உரிமைப்பங்கு
  rationale: நிலப் பகிர்வுச் சூழலில் மரபுரிமையாக அல்லது ஒதுக்கீடாகக் கிடைத்த உடைமைப் பகுதியைக் குறிக்கிறது. ‘உரிமைப்பங்கு’ நிலப்பங்கையும் அதற்கான உரிமையையும் தெளிவாகக் காக்கிறது.
- source_word: בְּנֵי גָד
  choice: காதின் மகன்கள்
  rationale: காதிலிருந்து வந்த கோத்திரத்தைக் குறிக்கும் மூலமொழியின் வம்சவழி மரபுத்தொடர் முறையாகப் பாதுகாக்கப்படுகிறது.
- source_word: לְמִשְׁפְּחֹתָם
  choice: அவர்களுடைய குலங்களின்படி
  rationale: לְ இங்கு பகிர்வு அல்லது வகைப்படுத்தலைக் குறிக்கிறது; מִשְׁפָּחוֹת கோத்திரத்திற்குள் உள்ள குலப் பிரிவுகளைக் குறிக்கிறது.
- source_word: הֶעָרִים
  choice: அந்த நகரங்கள்
  rationale: பங்கிடப்பட்ட நிலத்திலுள்ள நகரங்களைக் குறிக்கும் வழக்கமான சொல்; சுட்டுத்தன்மை தமிழ்ச் சுருக்க வாக்கியத்தில் பட்டியலுடன் உள்ள தொடர்பைத் தெளிவாக்குகிறது.
- source_word: וְחַצְרֵיהֶם
  choice: அவற்றின் கிராமங்கள்
  rationale: חָצֵר இத்தகைய நிலப்பகிர்வு வாய்பாடுகளில் நகரங்களைச் சார்ந்த சிறிய ஊரகக் குடியிருப்புகளைக் குறிக்கிறது; ‘கிராமங்கள்’ நவீன தமிழில் இயல்பாகவும் தெளிவாகவும் உள்ளது.
