  text: וּ/לְ/שֵׁ֨בֶט֙ הַ/לֵּוִ֔י לֹֽא נָתַ֥ן מֹשֶׁ֖ה נַחֲלָ֑ה יְהוָ֞ה אֱלֹהֵ֤י יִשְׂרָאֵל֙ ה֣וּא נַחֲלָתָ֔/ם כַּ/אֲשֶׁ֖ר דִּבֶּ֥ר לָ/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/033.yaml
  text: But to the tribe of Levi Moses gave no inheritance; Yahweh[a], the God of Israel, is their inheritance, just as he spoke to them.
translation:
  language: ta
  text: ஆனால் லேவி கோத்திரத்துக்கு மோசே சுதந்தரம் எதையும் கொடுக்கவில்லை; இஸ்ரவேலின் கடவுளாகிய யாவே தாமே அவர்களுடைய சுதந்தரம்; அவர் அவர்களிடம் சொன்னபடியே.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘சுதந்தரம்’ என்பதற்குப் பதிலாக, எபிரெய נַחֲלָה வரும் இரு இடங்களிலும் ‘பங்கு’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/לְ/שֵׁבֶט הַ/לֵּוִי
  choice: ஆனால் லேவி கோத்திரத்துக்கு
  rationale: וּ தொடர் இணைப்பாக இருந்தாலும், முந்தைய கோத்திரப் பங்கீடுகளுடன் உள்ள முரண்பாட்டைத் தமிழில் இயல்பாக வெளிப்படுத்த ‘ஆனால்’ பயன்படுத்தப்பட்டது. שֵׁבֶט הַלֵּוִי என்பது தனி லேவியரை அல்ல, லேவி கோத்திரத்தைச் சுட்டுகிறது.
- source_word: לֹא נָתַן מֹשֶׁה נַחֲלָה
  choice: மோசே எந்தச் சுதந்தரத்தையும் கொடுக்கவில்லை
  rationale: எபிரெயச் சொல்வரிசையின் நேரடியான கடந்தகால மறுப்பை இயல்பான நவீன தமிழில் வழங்குகிறது; ‘சுதந்தரம்’ நிலப் பங்கையும் உடன்படிக்கை சார்ந்த உரிமையையும் தக்கவைக்கிறது.
- source_word: יְהוָה אֱלֹהֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் கடவுளாகிய யாவே
  rationale: தெய்வீகப் பெயரான יהוה-வை ‘யாவே’ என ஒலிபெயர்த்து, אֱלֹהֵי יִשְׂרָאֵל என்பதை இயல்பான தமிழில் அடைமொழித் தொடராக வழங்குகிறது.
- source_word: הוּא נַחֲלָתָם
  choice: தாமே அவர்களுடைய சுதந்தரம்
  rationale: வெளிப்படையாக உள்ள הוּא-வின் வலியுறுத்தலை மரியாதை ஒருமை ‘தாமே’ தக்கவைக்கிறது; முதல் நிகழ்வுடன் ஒரே சொல்லை வைத்ததால் எபிரெய உருவகமும் இறையியல் பதற்றமும் பாதுகாக்கப்படுகின்றன.
- source_word: כַּאֲשֶׁר דִּבֶּר לָהֶם
  choice: அவர் அவர்களிடம் சொன்னபடியே
  rationale: דבר என்பதன் ‘பேசு/சொல்’ பொருளைத் தக்கவைத்து, உரையில் இல்லாத ‘வாக்குறுதி அளித்தார்’ என்ற வலுவான விளக்கத்தைச் சேர்க்கவில்லை.
theological_decisions:
- issue: יהוה என்ற தெய்வீகப் பெயரை வழங்குதல்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலத்தில் பட்டப்பெயர் அல்ல, தனிப்பட்ட உடன்படிக்கைப் பெயர் நேரடியாக உள்ளது; ஆகவே அதை மாற்றுப் பட்டப்பெயரால் மறைக்காமல் தமிழில் ஒலிபெயர்க்கப்பட்டது.
- issue: லேவியின் ‘சுதந்தரம்’ எது என்பதன் இயல்பு
  choice: யாவேதாமே அவர்களுடைய சுதந்தரம்
  alternative: யாவே அவர்களுடைய பங்கு
  rationale: கடவுளே லேவியின் சுதந்தரம் என்ற மூலத்தின் நேரடியான, உருவகமிக்க இறையியல் கூற்றை ஆசாரியச் சலுகைகள் போன்ற விளக்கமாகக் குறைக்காமல் தக்கவைக்கிறது.
- issue: כַּאֲשֶׁר דִּבֶּר לָהֶם என்பதன் தொடர்பு
  choice: அவர் அவர்களிடம் சொன்னபடியே இது நடந்தது
  alternative: அவர் அவர்களிடம் சொன்னபடியே
  rationale: எபிரெய தொடரின் சுருக்கம் தமிழில் யாருடைய சொல்லும் எதனுடன் தொடர்புபடுகிறது என்பதில் தடுமாற்றம் தரக்கூடும். ‘இது நடந்தது’ என்பது முன் கூற்றைத் திரும்பச் சுட்டி இயல்பாக்குகிறது; ‘வாக்குறுதி’ என்ற மேலதிக கருத்தைச் சேர்ப்பதில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளும் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. ‘கோத்திரம்’, ‘சுதந்தரம்’ ஆகிய வேதாகமச் சூழலில் பரவலாக அறியப்படும் சொற்கள் பயன்படுத்தப்பட்டுள்ளன. மரியாதை ஒருமை மூலம் கடவுளைக் குறிக்கும் சுட்டுப்பெயர்களும் வினை வடிவங்களும் ஒத்திசைக்கப்பட்டுள்ளன.
