- from: ஆனால் லேவி கோத்திரத்துக்கு மோசே எந்தச் சுதந்தரத்தையும் கொடுக்கவில்லை. இஸ்ரவேலின் கடவுளாகிய யாவேதாமே அவர்களுடைய சுதந்தரம்; அவர் அவர்களிடம் சொன்னபடியே இது நடந்தது.[a]
