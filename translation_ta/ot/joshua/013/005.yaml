base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/005.yaml
  text: and the land of the Gebalites[a], and all Lebanon toward the sunrise, from Baal-gad below Mount Hermon to Lebo-hamath,
translation:
  language: ta
  text: கெபாலியரின் நாடும், சூரியன் உதிக்கும் திசையில் உள்ள லெபனோன் முழுவதும், எர்மோன் மலைக்குக் கீழே உள்ள பாகால்-காத்திலிருந்து லெபோ-ஆமாத்[a] வரையும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஆமாத்தின் நுழைவிடம் வரை.” எபிரெயச் சொற்றொடரை ஒரு குறிப்பிட்ட இடப்பெயராக அல்லாமல், எல்லையை விவரிக்கும் சொற்றொடராகவும் புரிந்துகொள்ளலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: הָאָרֶץ הַגִּבְלִי
  choice: கெபாலியரின் நாடு
  rationale: הַגִּבְלִי என்பது கெபால் ஊருடன் தொடர்புடைய மக்களைக் குறிக்கும் இனப்பெயர்; ‘கெபாலியர்’ இடப்பெயருடனான தொடர்பைக் காக்கிறது. הָאָרֶץ இங்கு அவர்களுடைய நிலப்பகுதியைக் குறிக்கிறது.
- source_word: כָל הַלְּבָנוֹן
  choice: லெபனோன் முழுவதும்
  rationale: כָל என்பதன் முழுமைப் பொருளையும், லெபனோன் என்ற புவியியல் பெயரையும் இயல்பான தமிழில் தருகிறது.
- source_word: מִזְרַח הַשֶּׁמֶשׁ
  choice: சூரியன் உதிக்கும் திசையிலுள்ள
  rationale: சொல்லாட்சியின் ‘சூரிய உதயம்/கிழக்கு’ உருவகத்தைத் தக்கவைத்து, இங்கு லெபனோனின் கிழக்குப் பகுதியைக் குறிக்கும் புவியியல் தொடர்பை தெளிவாக வெளிப்படுத்துகிறது.
- source_word: מִבַּעַל גָּד
  choice: பாகால்-காத்திலிருந்து
  rationale: இடப்பெயரை ஒலிபெயர்த்து, מִן முன்னொட்டின் தொடக்க எல்லைப் பொருளை ‘இலிருந்து’ எனக் காட்டுகிறது.
- source_word: תַּחַת הַר חֶרְמוֹן
  choice: எர்மோன் மலைக்குக் கீழே உள்ள
  rationale: மலையுடன் ஒப்பிடுகையில் தாழ்வான இருப்பிடத்தைக் குறிக்கும் תַּחַת என்பதன் புவியியல் பொருளை, துல்லியமான நிலஅமைப்பை ஊகிக்காமல் தருகிறது.
- source_word: עַד לְבוֹא חֲמָת
  choice: லெபோ-ஆமாத் வரை
  rationale: இந்தத் தொடரை எல்லைக் குறிப்பாக வரும் இடப்பெயர் என முதன்மை உரையில் ஒலிபெயர்க்கிறது; ‘ஆமாத்தின் நுழைவிடம்’ என்ற பொருளையும் எபிரெயம் அனுமதிப்பதால் அதை அடிக்குறிப்பில் காக்கிறது.
