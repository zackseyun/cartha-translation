translation_notes:
  register: நவீனத் தரத் தமிழில், எல்லை விவரிப்பின் தொடர்ச்சியான வாக்கிய அமைப்பைத் தக்கவைக்கும் கண்ணியமான புவியியல் நடையில் மொழிபெயர்க்கப்பட்டது. ஆங்கில ஆலோசனை உரையில் அடிக்குறி ‘கெபாலியர்’ என்பதற்குப் பின் இருந்தாலும், அதன் உள்ளடக்கம் עַד לְבוֹא חֲמָת என்பதையே விளக்குவதால், மூலத்துக்கு ஏற்றவாறு ‘லெபோ-ஆமாத்’ என்பதற்குப் பின் வைக்கப்பட்டது.
