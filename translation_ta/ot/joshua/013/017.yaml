source:
  edition: WLC
  text: חֶשְׁבּ֥וֹן וְ/כָל עָרֶ֖י/הָ אֲשֶׁ֣ר בַּ/מִּישֹׁ֑ר דִּיבוֹן֙ וּ/בָמ֣וֹת בַּ֔עַל וּ/בֵ֖ית בַּ֥עַל מְעֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/017.yaml
  text: 'Heshbon and all its cities that are on the plateau: Dibon[a], Bamoth-baal, and Beth-baal-meon.'
translation:
  language: ta
  text: 'எஸ்போனும், மேட்டுநிலத்தில் இருந்த அதன் எல்லாப் பட்டணங்களும்: தீபோன்[a], பாமோத்-பாகால், பேத்-பாகால்-மேயோன்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சமவெளியில்” அல்லது “சமமான உயர்நிலத்தில்.” இங்குள்ள எபிரெயச் சொல் யோர்தானுக்கு அப்பாலுள்ள உயரமான, சமமான நிலப்பகுதியைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֶשְׁבּוֹן
  choice: எஸ்போன்
  rationale: இடப்பெயர் என்பதால், எபிரெய ஒலிப்பைத் தமிழில் இயன்றவரை பிரதிபலிக்கும் வகையில் ஒலிபெயர்க்கப்பட்டது.
- source_word: וְכָל עָרֶיהָ
  choice: அதன் எல்லாப் பட்டணங்களும்
  rationale: பெண்பால் ஒருமை பின்னொட்டு எஸ்போன் நகரத்தைக் குறிக்கிறது; நவீன தமிழில் உயிரற்ற இடத்துக்கு இயல்பான 'அதன்' பயன்படுத்தப்பட்டது.
- source_word: אֲשֶׁר בַּמִּישֹׁר
  choice: மேட்டுநிலத்தில் இருந்த
  rationale: இந்த யோர்தானுக்கு அப்பாலுள்ள நிலப்பரப்புச் சூழலில் מִישׁוֹר என்பது பொதுவான சமவெளியைவிட உயரமான, சமமான நிலப்பகுதியைக் குறிக்கிறது; 'மேட்டுநிலம்' அந்தப் புவியியல் பொருளைத் தெளிவாகத் தருகிறது.
- source_word: דִּיבוֹן
  choice: தீபோன்
  rationale: இடப்பெயர் ஒலிபெயர்க்கப்பட்டது.
- source_word: וּבָמוֹת בַּעַל
  choice: பாமோத்-பாகால்
  rationale: இங்கு இது 'பாகாலின் மேடைகள்' என்று மொழிபெயர்க்க வேண்டிய பொதுப்பெயர்த் தொடர் அல்ல, ஓர் இடப்பெயர்; இணைப்புக்குறி ஒருங்கிணைந்த பெயர் என்பதைத் தெளிவாக்குகிறது.
- source_word: וּבֵית בַּעַל מְעוֹן
  choice: பேத்-பாகால்-மேயோன்
  rationale: கூட்டு இடப்பெயராக ஒலிபெயர்க்கப்பட்டது; בֵּית என்பதைக் 'வீடு' என்று மொழிபெயர்க்காமல் பெயரின் ஓர் அங்கமாகப் பேணுகிறது.
