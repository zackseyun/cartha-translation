    reason: lexical_alternative
  revision_rationale: The revision retains the source’s deliberate repetition and its implicit object, while restoring the singular collective sense of “half-tribe.” It also replaces an awkward literary apposition with a natural Tamil genitive construction that directly reflects “the sons of Manasseh.”
