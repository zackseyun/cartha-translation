  text: וַ/יִּתֵּ֣ן מֹשֶׁ֔ה לַ/חֲצִ֖י שֵׁ֣בֶט מְנַשֶּׁ֑ה וַ/יְהִ֗י לַ/חֲצִ֛י מַטֵּ֥ה בְנֵֽי מְנַשֶּׁ֖ה לְ/מִשְׁפְּחוֹתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/029.yaml
  text: 'And Moses gave to the half-tribe of Manasseh[a], and it was for the half-tribe of the sons of Manasseh according to their clans:'
translation:
  language: ta
  text: 'மோசே மனாசேயின் பாதிக் கோத்திரத்திற்குக் கொடுத்தார்; அது மனாசேயின் மகன்களின்[a] பாதிக் கோத்திரத்திற்கு, அவர்களுடைய குலங்களின்படி உரியதாக இருந்தது:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் ‘மனாசேயின் மகன்கள்’; இந்த உறவுமுறைச் சொற்றொடர் மனாசேயின் கோத்திர வழித்தோன்றல்களைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: கொடுத்தார்
  rationale: நிலப் பங்கீட்டுச் சூழலிலும் נתן என்பதன் நேரடியான பொருளான ‘கொடுத்தார்’ இயல்பாகப் பொருந்துகிறது; ‘ஒதுக்கினார்’ என்பது சாத்தியமானாலும் மூல வினையின் எளிய பொருளை இது காக்கிறது.
- source_word: לַחֲצִי שֵׁבֶט מְנַשֶּׁה
  choice: மனாசேயின் பாதிக் கோத்திரத்திற்கு
  rationale: חֲצִי என்பது ‘பாதி’; שֵׁבֶט இங்கு ஆட்சிக்கோலையல்ல, இஸ்ரவேலின் கோத்திரப் பிரிவைக் குறிக்கிறது.
- source_word: וַיְהִי
  choice: உரியதாக இருந்தது
  rationale: சொல்லுக்கு நெருக்கமாக ‘இருந்தது’ என்றாலும், இந்நிலப் பங்கீட்டு வாய்பாட்டில் לַ உடன் அது குறிப்பிட்ட குழுவுக்கு உரியது என்ற பகிர்ந்தளிப்பு/உடைமைப் பொருளைத் தருகிறது.
- source_word: מַטֵּה
  choice: கோத்திரம்
  rationale: מַטֶּה என்பதற்கு ‘கோல்’ என்ற பொருள் இருந்தாலும், இங்கு நிர்வாக மற்றும் வம்சக் குழுவான ‘கோத்திரம்’ என்பதே சூழலுக்குரிய பொருள்.
- source_word: בְנֵי מְנַשֶּׁה
  choice: மனாசேயின் புதல்வர்கள்
  rationale: மூலத்தின் உறவுமுறைச் சொல்லான ‘மனாசேயின் மகன்கள்’ என்பதை நெருக்கமாகக் காக்க ‘புதல்வர்கள்’ பயன்படுத்தப்பட்டது; சூழலில் இது மனாசேயின் கோத்திர வழித்தோன்றல்களைக் குறிக்கிறது.
- source_word: לְמִשְׁפְּחוֹתָם
  choice: அவர்களுடைய குலங்களின்படி
  rationale: מִשְׁפָּחוֹת என்பது இங்கு கோத்திரத்திற்குள் உள்ள குலப் பிரிவுகள்; முன்னொட்டு לְ பகிர்ந்தளிப்பின் அடிப்படையைச் சுட்டுவதால் ‘குலங்களின்படி’ என மொழிபெயர்க்கப்பட்டது.
