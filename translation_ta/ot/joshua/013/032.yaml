base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/032.yaml
  text: These are what Moses apportioned as an inheritance in the plains of Moab[b][a], beyond the Jordan east of Jericho.
translation:
  language: ta
  text: மோவாபின் சமவெளிகளில், எரிகோவுக்கு கிழக்கே யோர்தானுக்கு அப்பால், மோசே உரிமைச்சொத்தாகப் பங்கிட்டவை இவையே.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘உரிமைச்சொத்தாகக் கொடுத்தவை’ அல்லது ‘உரிமைச்சொத்தாக ஒதுக்கியவை’ என்றும் மொழிபெயர்க்கலாம். எபிரெய வினை, நிலத்தை மரபுரிமையான உடைமையாகப் பகிர்ந்தளிப்பதை வலியுறுத்துகிறது.
    reason: lexical_alternative
  - marker: b
    text: ‘யோர்தானுக்கு மறுபுறம்’ என்றும் மொழிபெயர்க்கலாம். இது பார்வைநிலையைப் பொறுத்துப் பொருள் கொள்ளப்படும் வழக்கமான எபிரெய புவியியல் தொடர்; இங்கே ‘எரிகோவுக்கு கிழக்கே’ என்பது எந்தப் பகுதி என்பதைக் குறிப்பாக்குகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה אֲשֶׁר
  choice: பங்கிட்டவை இவையே
  rationale: பன்மைச் சுட்டுப்பெயரும் தொடர்புச் சொல்லும் சேர்ந்து முந்தைய நிலப்பகிர்வைச் சுருக்கிக் காட்டுகின்றன; தமிழில் இயல்பாக இருக்க வாக்கிய முடிவில் ‘இவையே’ வைக்கப்பட்டது.
- source_word: נִחַל
  choice: உரிமைச்சொத்தாகப் பங்கிட்டவை
  rationale: இச்சூழலில் எபிரெய causative வினை நிலத்தைச் சுதந்தரமான உடைமையாக ஒதுக்கிப் பகிர்ந்தளிப்பதைச் சுட்டுகிறது. ‘பங்கிட்டவை’ பகிர்வையும் ‘உரிமைச்சொத்தாக’ நிலையான உடைமையையும் வெளிப்படுத்துகிறது.
- source_word: מֹשֶׁה
  choice: மோசே
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் பரவலாக அறியப்பட்ட பெயர் வடிவம்.
- source_word: בְּעַרְבוֹת מוֹאָב
  choice: மோவாபின் சமவெளிகளில்
  rationale: עֲרָבוֹת என்பது இங்கு மோவாபின் பரந்த சமதளப் பகுதியைக் குறிக்கிறது; ‘சமவெளிகள்’ நவீனத் தமிழில் தெளிவான புவியியல் சொல்.
- source_word: מֵעֵבֶר לְיַרְדֵּן
  choice: யோர்தானுக்கு அப்பால்
  rationale: எபிரெய மொழியின் வழக்கமான புவியியல் தொடரை, பார்வைத்திசையைத் தேவையின்றி முடிவுசெய்யாமல் காக்கிறது.
- source_word: יְרִיחוֹ
  choice: எரிகோ
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் பரவலாக அறியப்பட்ட நகரப் பெயர் வடிவம்.
- source_word: מִזְרָחָה
  choice: எரிகோவுக்கு கிழக்கே
  rationale: திசைச்சொல் எரிகோவை ஒப்பீட்டுப் புள்ளியாகக் கொண்டு யோர்தானின் கிழக்குப் பகுதியைத் தெளிவுபடுத்துகிறது.
