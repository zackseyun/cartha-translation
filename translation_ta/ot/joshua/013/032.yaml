translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டது. நிலப் பகிர்வும் உரிமைச்சொத்தும் ஆகிய இரு கருத்துகளையும் காக்க ‘உரிமைச்சொத்தாகப் பங்கிட்டவை’ பயன்படுத்தப்பட்டது. புவியியல் அடுக்கைத் தெளிவாக்க தமிழ் வாக்கிய வரிசை மாற்றப்பட்டுள்ளது; மூலத்தின் பொருள் மற்றும் பார்வைநிலைத் தெளிவின்மை அடிக்குறிப்பில் காக்கப்பட்டுள்ளது.
