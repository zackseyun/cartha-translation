base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/002.yaml
  text: 'This is the land that remains: all the districts of the Philistines[b][a], and all the Geshurites—'
translation:
  language: ta
  text: 'எஞ்சியிருக்கும் நாடு இதுவே: பெலிஸ்தியர்களின் எல்லாப் பகுதிகளும்[a], கேசூரியர் அனைவரும்[b]—'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “பகுதிகள்” என்பதற்கு “வட்டாரங்கள்” என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் பெலிஸ்தியர்களுடன் தொடர்புடைய நிலப்பரப்புகளைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில் “கேசூரியன்” என்று ஒருமை வடிவம் இருந்தாலும், அது இங்கு ஒரு மக்கள் குழுவைக் கூட்டாகக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹאת הָאָרֶץ הַנִּשְׁאָרֶת
  choice: எஞ்சியிருக்கும் நாடு இதுவே
  rationale: எடுக்கப்படாமல் மீந்துள்ள நிலப்பரப்பைச் சுட்டும் எபிரெயப் பெயரெச்சத் தொடரையும், அறிமுகப்படுத்தும் சுட்டுச் சொல்லின் வலியுறுத்தலையும் இயல்பான தமிழில் தருகிறது.
- source_word: כָּל גְּלִילוֹת
  choice: எல்லாப் பகுதிகளும்
  rationale: גְּלִילוֹת என்பது புவியியல் சார்ந்த வட்டாரங்கள் அல்லது பகுதிகளைக் குறிக்கிறது; நவீனத் தமிழில் ‘பகுதிகள்’ இயல்பாகவும் தேவையற்ற நிர்வாக நுட்பமின்றியும் உள்ளது.
- source_word: הַפְּלִשְׁתִּים
  choice: பெலிஸ்தியர்களின்
  rationale: எபிரெயம் நிலப்பெயரைக் காட்டிலும் மக்களினத்தையே பெயரிட்டு, அவர்களுக்குரிய பகுதிகள் என்ற உறவை வெளிப்படுத்துகிறது.
- source_word: וְכָל הַגְּשׁוּרִי
  choice: கெசூரியர் அனைவரும்
  rationale: ஒருமை வடிவிலுள்ள இனப்பெயர் இங்கு கூட்டுப்பொருளில் வருகிறது; தமிழின் மரியாதை/மக்கள் பன்மை அமைப்பு அந்தக் கூட்டுப்பொருளை இயல்பாக வெளிப்படுத்துகிறது.
