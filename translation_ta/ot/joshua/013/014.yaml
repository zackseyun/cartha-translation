revisions:
- from: லேவி கோத்திரத்துக்கு மட்டும் அவர் உரிமைப் பங்கு எதையும் வழங்கவில்லை. இஸ்ரவேலின் கடவுளாகிய யெகோவாவுக்குச் செலுத்தப்படும் நெருப்புப் பலிகளே[a] அதன் உரிமைப் பங்கு[b]; அவர் அதனிடம் சொன்னபடியே இது நடந்தது.
  to: லேவி கோத்திரத்துக்கு மட்டும் அவர் உரிமைப் பங்கு எதையும் வழங்கவில்லை. அவர் அதனிடம் சொன்னபடியே, இஸ்ரவேலின் கடவுளாகிய யெகோவாவுக்குச் செலுத்தப்படும் நெருப்புப் பலிகளே[a] அதன் உரிமைப் பங்காக இருந்தன[b].
