  text: רַ֚ק לְ/שֵׁ֣בֶט הַ/לֵּוִ֔י לֹ֥א נָתַ֖ן נַחֲלָ֑ה אִשֵּׁ֨י יְהוָ֜ה אֱלֹהֵ֤י יִשְׂרָאֵל֙ ה֣וּא נַחֲלָת֔/וֹ כַּ/אֲשֶׁ֖ר דִּבֶּר לֽ/וֹ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/014.yaml
  text: Only to the tribe of Levi he gave no inheritance[a]; the offerings by fire to Yahweh, the God of Israel, are his inheritance[b], as he spoke to him.
translation:
  language: ta
  text: லேவி கோத்திரத்துக்கு மட்டும் அவர் உரிமைப் பங்கு எதையும் வழங்கவில்லை. அவர் அதனிடம் சொன்னபடியே, இஸ்ரவேலின் கடவுளாகிய யெகோவாவுக்குச் செலுத்தப்படும் நெருப்புப் பலிகளே[a] அதன் உரிமைப் பங்காக இருந்தன[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'இன்னும் சொற்சொல்லான மொழிபெயர்ப்பு: ‘யெகோவாவின் அக்கினிப் பலிகள்.’'
    reason: lexical_alternative
  - marker: b
    text: அருகிலுள்ள வசனங்களின் அடிப்படையில் சிலர், ‘இஸ்ரவேலின் கடவுளாகிய யெகோவாவே அதன் உரிமைப் பங்கு’ என்று புரிந்துகொள்கிறார்கள்.
    reason: alternative_reading
lexical_decisions:
- source_word: רַק
  choice: மட்டும்
  rationale: முந்தைய நிலப் பங்கீட்டிலிருந்து லேவி கோத்திரம் மட்டும் விலக்கப்பட்டதைத் தெளிவாகக் காட்டுகிறது.
- source_word: לְשֵׁבֶט הַלֵּוִי
  choice: லேவி கோத்திரத்துக்கு
  rationale: נתן என்ற ‘வழங்குதல்’ வினையுடன் வரும் לְ முன்னிடைச்சொல்லை இயல்பான தமிழில் நான்காம் வேற்றுமையாக மொழிபெயர்க்கிறது.
- source_word: לֹא נָתַן נַחֲלָה
  choice: உரிமைப் பங்கு எதையும் வழங்கவில்லை
  rationale: נַחֲלָה இங்கு நிலப் பங்கீட்டுச் சூழலில் பரம்பரை உரிமையாகக் கிடைக்கும் பங்கைக் குறிக்கிறது; தமிழில் ‘உரிமைப் பங்கு’ இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: אִשֵּׁי יְהוָה
  choice: யெகோவாவுக்குச் செலுத்தப்படும் நெருப்புப் பலிகள்
  rationale: אִשֵּׁי என்பதன் நெருப்பில் செலுத்தப்படும் பலிகள் என்ற மூலப் பொருளைத் தக்கவைத்து, பலிகள் யெகோவாவுக்கு அர்ப்பணிக்கப்படுவதை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: தெய்வீகப் பெயரை பெயராகவே ஒலிபெயர்க்கிறது; பொதுப்பட்டமான ‘ஆண்டவர்’ என்பதுடன் கலக்கவில்லை.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் கடவுள்
  rationale: எபிரேய இணைப்புத் தொடரை இயல்பான தமிழ் உடைமைத் தொடராக வழங்குகிறது; இது யெகோவாவை விளக்கும் அடைமொழியாக உள்ளது.
- source_word: הוּא נַחֲלָתוֹ
  choice: அதன் உரிமைப் பங்கு
  rationale: அருகிலுள்ள ‘பலிகள்’ என்பதையே உரிமைப் பங்காகப் புரிந்துகொள்ளும் முதன்மை வாசிப்பைப் பின்பற்றுகிறது. ‘அதன்’ என்பது லேவி கோத்திரத்தை ஒருமைத் தொகுதியாகக் குறிக்கிறது.
- source_word: כַּאֲשֶׁר דִּבֶּר לוֹ
  choice: அவர் அதனிடம் சொன்னபடியே
  rationale: ‘வாக்குறுதி அளித்தார்’ என்று விளக்கமாக்காமல் דִּבֶּר என்பதன் ‘சொன்னார்’ என்ற பொருளைத் தக்கவைக்கிறது; ஒருமைப் பெயர்ச்சுட்டு லேவி கோத்திரத்தைக் கூட்டொருமையாகக் குறிக்கிறது.
theological_decisions:
- issue: லேவியின் உரிமைப் பங்கு எது?
  choice: யெகோவாவுக்குச் செலுத்தப்படும் நெருப்புப் பலிகளே அதன் உரிமைப் பங்கு
  alternative: இஸ்ரவேலின் கடவுளாகிய யெகோவாவே அதன் உரிமைப் பங்கு
  rationale: இந்த வசனத்தின் உடனடி வாக்கிய அமைப்பில் אִשֵּׁי יְהוָה என்பதே הוּא נַחֲלָתוֹ என்பதற்கு மிக அருகிலுள்ள முன்னிலை. அருகிலுள்ள பிற வசனங்களோடு ஒத்திசைக்க யெகோவாவையே உரிமைப் பங்காக முதன்மை உரையில் மாற்றாமல், அந்தப் புரிதலை அடிக்குறிப்பில் பாதுகாக்கிறது.
- issue: ‘அவர்’ மற்றும் ‘அதன்’ என்பவற்றின் சுட்டுப்பொருள்
  choice: எபிரேய உரையின் பெயர்ச்சுட்டு வடிவங்களை வெளிப்படையாகத் தீர்மானிக்காமல் வைத்தல்
  alternative: பேசுபவர் மற்றும் பெறுபவரின் பெயர்களை விளக்கமாகச் சேர்த்தல்
  rationale: மூல உரையில் பெயர்ச்சுட்டுகள் மட்டுமே இருப்பதால், மொழிபெயர்ப்பில் பெயர்களைச் சேர்ப்பது மூலத்தில் இல்லாத விளக்கத்தை இறக்குமதி செய்யும்.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிதில் புரியும், அதேவேளையில் வேதாகம வெளியீட்டிற்கேற்ற கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. லேவி கோத்திரம் கூட்டொருமையாகக் கருதப்பட்டதால் ‘அதன்’, ‘அதனிடம்’ என வழங்கப்பட்டுள்ளது; மூல உரையின் இறையியல் பதற்றமும் பெயர்ச்சுட்டு தெளிவின்மையும் தேவையின்றித் தீர்க்கப்படவில்லை.
