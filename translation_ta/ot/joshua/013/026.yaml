  text: and from Heshbon to Ramath-mizpeh and Betonim[a], and from Mahanaim to the border of Debir.
translation:
  language: ta
  text: எஸ்போனிலிருந்து ராமத்-மிஸ்பே மற்றும் பெத்தோனீம் வரையும், மகனாயீமிலிருந்து தெபீரை நோக்கிய எல்லை வரையும்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தெபீரின் எல்லை வரையும்.” எபிரெயச் சொற்றொடர் தெபீரை நோக்கிய திசையையோ, தெபீருடன் தொடர்புடைய எல்லையையோ குறிக்கலாம்.
