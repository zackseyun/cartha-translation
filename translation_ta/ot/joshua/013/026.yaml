lexical_decisions:
- source_word: וּ/מֵ/חֶשְׁבּוֹן
  choice: எஸ்போனிலிருந்து
  rationale: וּ இணைப்புச்சொல்லின் தொடர்ச்சியை வசன அமைப்பே வெளிப்படுத்துகிறது; מִן ‘இலிருந்து’ எனவும், இடப்பெயர் חֶשְׁבּוֹן தமிழில் ‘எஸ்போன்’ எனவும் வழங்கப்பட்டது.
- source_word: עַד
  choice: வரையிலும்
  rationale: எல்லை விவரிப்பில் பரப்பின் முடிவைக் குறிக்கும் עַד என்பதற்கு இயல்பான தமிழ் இணை ‘வரையிலும்’.
- source_word: רָמַת הַמִּצְפֶּה
  choice: ராமாத்-மிஸ்பே
  rationale: ‘மிஸ்பேயின் உயரம்/காவற்குன்று’ என்ற கூறுகளைக் கொண்டிருந்தாலும், இங்கு இடப்பெயராகச் செயல்படுவதால் ஒலிபெயர்க்கப்பட்டது.
- source_word: וּ/בְטֹנִים
  choice: மற்றும் பெத்தோனீம்
  rationale: וּ ‘மற்றும்’ என வெளிப்படுத்தப்பட்டு, இடப்பெயர் בְטֹנִים ‘பெத்தோனீம்’ என ஒலிபெயர்க்கப்பட்டது.
- source_word: וּ/מִֽ/מַּחֲנַיִם
  choice: மகனாயீமிலிருந்து
  rationale: முன்னைய எல்லைத் தொடருடன் இணையும் வாக்கிய அமைப்பில், מִן ‘இலிருந்து’ என்றும் இடப்பெயர் ‘மகனாயீம்’ என்றும் வழங்கப்பட்டது.
- source_word: גְּבוּל
  choice: எல்லை
  rationale: நிலப் பங்கீட்டு சூழலில் גְּבוּל என்பது பிரதேச வரம்பைக் குறிக்கிறது; நவீன தமிழில் ‘எல்லை’ தெளிவும் இயல்பும் உடையது.
- source_word: לִדְבִר
  choice: தெபீரை நோக்கிய
  rationale: לְ முன்னொட்டின் திசைசார் வலிமையைப் பாதுகாக்க ‘தெபீரை நோக்கிய’ என மொழிபெயர்க்கப்பட்டது; இதனை ‘தெபீரின்’ என்ற உரிமைத் தொடர்பாகவும் புரிந்துகொள்ளலாம்.
