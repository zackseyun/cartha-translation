  register: நவீனத் தரத் தமிழில், நிலவியல் பட்டியலின் தொடர்ச்சியைப் பேணும் கண்ணியமான நடை. இவ்வசனம் அடுத்தடுத்த எல்லை விவரணத்தின் ஒரு பகுதியாக இருப்பதால் இறுதியில் முற்றுப்புள்ளிக்குப் பதிலாக காற்புள்ளி வைக்கப்பட்டுள்ளது.
