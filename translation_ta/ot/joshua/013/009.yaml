revisions:
- from: அர்னோன் பள்ளத்தாக்கின் விளிம்பில் உள்ள அரோவேரிலிருந்தும், பள்ளத்தாக்கின் நடுவில் உள்ள நகரத்திலிருந்தும், மேதேபா முதல் தீபோன் வரையுள்ள மேட்டுநிலம் முழுவதிலிருந்தும்,
  to: அர்னோன் பள்ளத்தாக்கின் விளிம்பில் உள்ள அரோவேர் தொடங்கி, பள்ளத்தாக்கின் நடுவில் உள்ள நகரமும், மேதேபா முதல் தீபோன் வரையுள்ள மேட்டுநிலம் முழுவதும்,
  rationale: The revision preserves the verse’s deliberately incomplete, comma-ended territorial-list syntax, while replacing the misleading repeated ablatives with a natural Tamil expression of the initial boundary and the coordinated areas that follow.
