  text: But the sons of Israel did not drive out the Geshurites or the Maacathites, and Geshur and Maacath lived among Israel to this day.
translation:
  language: ta
  text: ஆனால் இஸ்ரவேல் மக்கள் கெசூரியரையும் மாகாத்தியரையும் துரத்திவிடவில்லை. கெசூரும் மாகாத்தும் இந்நாள்வரை இஸ்ரவேலரின் நடுவில் குடியிருந்தன.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்கள்
  rationale: சொல்லுக்குச் சொல் ‘இஸ்ரவேலின் மகன்கள்’ என்றாலும், இங்கு நாட்டினரைக் குறிக்கும் இயல்பான நவீனத் தமிழ் வடிவம்.
- source_word: הוֹרִישׁוּ
  choice: துரத்திவிடவில்லை
  rationale: ஹிப்ரு வினைச்சொல் இச்சூழலில் ஒரு பகுதியிலிருந்து குடிகளை வெளியேற்றுதல் அல்லது அகற்றுதல் என்பதைக் குறிக்கிறது.
- source_word: הַגְּשׁוּרִי ... הַמַּעֲכָתִי
  choice: கெசூரியரையும் மாகாத்தியரையும்
  rationale: இவை கெசூர், மாகாத் மக்களைக் குறிக்கும் இனப்பெயர்கள்; தமிழ் பன்மை மனிதர் வடிவில் தரப்பட்டுள்ளன.
- source_word: וַיֵּשֶׁב
  choice: வாழ்ந்துவருகின்றனர்
  rationale: ஒரு மக்கள் குழு அங்கே குடியிருந்து தொடர்ந்து வாழ்வதைக் குறிக்கும்; ‘இந்நாள்வரை’ என்பதுடன் தொடர்நிலையை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: בְּקֶרֶב יִשְׂרָאֵל
  choice: இஸ்ரவேலரின் நடுவில்
  rationale: மூலத்தின் ‘இஸ்ரவேலின் மத்தியில்’ என்ற இடவியல் மற்றும் சமூக உறவைப் பாதுகாக்கிறது.
