  register: நவீன நிலையான தமிழில், எளிமையும் கண்ணியமும் கொண்ட வரலாற்று உரைநடை. இரண்டாம் வாக்கியத்தின் ‘எனவே’ மூலத்தில் உள்ள வாவ் இணைப்பின் விளைவுறவை இயல்பான தமிழில் வெளிப்படுத்துகிறது; இனப்பெயர்களுக்கும் நில/அரசியல் அலகுப் பெயர்களுக்கும் உள்ள வேறுபாடு காக்கப்பட்டுள்ளது.
