translation_notes:
  register: நவீனத் தரத் தமிழில், எல்லைப் பட்டியலுக்கேற்ற சுருக்கமான மற்றும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய மூலத்தில் திரும்பத் திரும்ப வரும் இணைப்புச் சொல், தமிழில் இயல்பாக ஒவ்வொரு இடப்பெயருடனும் ‘-உம்’ என வெளிப்படுத்தப்பட்டுள்ளது. அடிக்குறிப்பு குறியீடு அது விளக்கும் ‘சரிவுகள்’ என்ற சொல்லுக்குப் பின் வைக்கப்பட்டுள்ளது.
