base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/020.yaml
  text: and Beth-peor[a], and the slopes of Pisgah, and Beth-jeshimoth.
translation:
  language: ta
  text: பெத்-பேயோரும், பிஸ்காவின் சரிவுகளும்[a], பெத்-யெஷிமோத்தும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “சரிவுகள்” என்பதற்குப் பதிலாக, “நீரூற்றுகள்” அல்லது “மலையடிவாரங்கள்” என்றும் பொருள் கொள்ளலாம். எபிரெயச் சொல் ஒன்றுக்கு மேற்பட்ட நில அமைப்புகளைக் குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵית פְּעוֹר
  choice: பெத்-பெயோர்
  rationale: இது ஓர் இடப்பெயர் என்பதால், அதன் சொற்பொருளை மொழிபெயர்க்காமல் எபிரெய ஒலிப்புக்கு ஏற்றவாறு எழுத்துப்பெயர்க்கப்பட்டது.
- source_word: אַשְׁדּוֹת
  choice: சரிவுகள்
  rationale: பிஸ்கா என்னும் மலைப்பகுதியுடன் வரும் இந்த நிலவியல் சூழலில், மலைச் சரிவுகள் அல்லது கீழிறங்கும் நிலப்பகுதிகள் என்பதே இயல்பான பொருள். சொல்லுக்குள்ள பிற நிலவியல் சாத்தியங்கள் அடிக்குறிப்பில் தரப்பட்டுள்ளன.
- source_word: הַפִּסְגָּה
  choice: பிஸ்கா
  rationale: இங்கு இது ஒரு குறிப்பிட்ட நிலவியல் பெயராகப் பயன்படுவதால் எழுத்துப்பெயர்க்கப்பட்டது; எபிரெய மொழியிலுள்ள சுட்டுக் கட்டுரை தமிழில் தனியாக வெளிப்படுத்தப்படவில்லை.
- source_word: בֵית הַיְשִׁמוֹת
  choice: பெத்-யெஷிமோத்
  rationale: இது ஓர் இடப்பெயர் என்பதால், ‘பாழிடங்களின் வீடு’ என்ற சொற்பொருள் மொழிபெயர்ப்பை விட எழுத்துப்பெயர்ப்பு தேர்ந்தெடுக்கப்பட்டது.
