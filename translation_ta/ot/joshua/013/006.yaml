  to: லெபனோன் முதல் மிஸ்ரெபோத்-மாயிம்[a] வரையுள்ள மலைநாட்டில் குடியிருப்போர் அனைவரையும், சீதோனியர் அனைவரையும், நானே இஸ்ரவேல் மக்களின் முன்னிலையிலிருந்து துரத்திவிடுவேன்[b]. நான் உனக்குக் கட்டளையிட்டபடியே, நீ அந்த நாட்டை மட்டும் இஸ்ரவேலுக்குச் சுதந்தரப் பங்காகப் பங்கிட்டுக் கொடு[c].
