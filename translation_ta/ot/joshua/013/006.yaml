source:
  edition: WLC
  text: כָּל יֹשְׁבֵ֣י הָ֠/הָר מִֽן הַ/לְּבָנ֞וֹן עַד מִשְׂרְפֹ֥ת מַ֨יִם֙ כָּל צִ֣ידֹנִ֔ים אָֽנֹכִי֙ אוֹרִישֵׁ֔/ם מִ/פְּנֵ֖י בְּנֵ֣י יִשְׂרָאֵ֑ל רַ֠ק הַפִּלֶ֤/הָ לְ/יִשְׂרָאֵל֙ בְּֽ/נַחֲלָ֔ה כַּ/אֲשֶׁ֖ר צִוִּיתִֽי/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/006.yaml
  text: All the inhabitants of the hill country from Lebanon to Misrephoth-maim[a], all the Sidonians—I myself will drive them out before the sons of Israel. Only allot it to Israel as an inheritance[c][b], as I have commanded you.
translation:
  language: ta
  text: லெபனோன் முதல் மிஸ்ரெபோத்-மாயிம்[a] வரையுள்ள மலைநாட்டில் குடியிருப்போர் அனைவரையும், சீதோனியர் அனைவரையும், நானே இஸ்ரவேல் மக்களின் முன்னிலையிலிருந்து துரத்திவிடுவேன்[b]. நான் உனக்குக் கட்டளையிட்டபடியே, நீ அந்த நாட்டை மட்டும் இஸ்ரவேலுக்குச் சுதந்தரப் பங்காகப் பங்கிட்டுக் கொடு[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: மிஸ்ரெபோத்-மாயிம் என்பது ஓர் இடப்பெயர். அந்தப் பெயருக்கு ‘நீரின் எரிப்புகள்’ போன்ற பொருள் இருக்கலாம்; ஆனால் அதன் துல்லியமான பொருள் உறுதியில்லை.
    reason: cultural_note
  - marker: b
    text: அல்லது, “அவர்களை இஸ்ரவேல் மக்களின் முன்னிலையிலிருந்து உரிமையிழக்கச் செய்வேன்.”
    reason: lexical_alternative
  - marker: c
    text: “பங்கிட்டுக் கொடு” என்பதற்கான எபிரெயச் சொற்றொடர், பெரும்பாலும் சீட்டுப்போட்டு நிலத்தைப் பங்கிட்டு ஒதுக்குவதைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֹשְׁבֵי הָהָר
  choice: மலைநாட்டில் குடியிருப்போர்
  rationale: இங்கு הָהָר என்பது தனியொரு மலையைக் காட்டிலும் ஒரு புவியியல் மலைப்பகுதியைக் குறிக்கிறது; participial construct-இன் குடியிருப்போர் என்ற பொருளும் இயல்பாகப் பாதுகாக்கப்படுகிறது.
- source_word: מִן הַלְּבָנוֹן עַד מִשְׂרְפֹת מַיִם
  choice: லெபனோன் முதல் மிஸ்ரெபோத்-மாயிம் வரை
  rationale: இரண்டும் இடப்பெயர்கள். மִשְׂרְפֹת מַיִם என்பதன் சொற்பிறப்புப் பொருள் உறுதியற்றதால் பொருள் மொழிபெயர்ப்பிற்குப் பதிலாக ஒலிபெயர்ப்பு பயன்படுத்தப்பட்டது.
- source_word: כָּל צִידֹנִים
  choice: சீதோனியர் அனைவரையும்
  rationale: சீதோனைச் சேர்ந்த மக்களை ஒட்டுமொத்தமாகக் குறிக்கும் இன-புவியியல் பெயரும் כָּל என்பதன் முழுமைப் பொருளும் பாதுகாக்கப்படுகின்றன.
- source_word: אָנֹכִי אוֹרִישֵׁם
  choice: நானே ... துரத்திவிடுவேன்
  rationale: தனி சுட்டுப்பெயரான אָנֹכִי தரும் வலியுறுத்தலை நானே வெளிப்படுத்துகிறது. ירשׁ என்பதன் Hiphil வடிவம் இங்கு குடியிருப்பவர்களை அகற்றுதல் அல்லது உரிமையிழக்கச் செய்தல் என்று பொருள்படும்.
- source_word: מִפְּנֵי בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்களுக்கு முன்பாக
  rationale: எபிரெய உறவுசார் உருவகமான முன்பாக என்பதைக் காத்து, בְּנֵי יִשְׂרָאֵל என்பதை நவீன தமிழில் இயல்பான, கூட்டுமக்களைக் குறிக்கும் இஸ்ரவேல் மக்கள் என வழங்குகிறது.
- source_word: רַק הַפִּלֶהָ
  choice: நீ அந்த நாட்டை மட்டும் ... பங்கிட்டுக் கொடு
  rationale: רַק-இன் வரையறுக்கும் வலிமையை மட்டும் காட்டுகிறது. הַפִּלֶהָ என்பது நிலத்தைப் பங்கிட்டு ஒதுக்கும் causative lot-allotment idiom; பெண்பால் ஒருமை பின்னொட்டு சூழலில் நாட்டைக் குறிக்கிறது.
- source_word: לְיִשְׂרָאֵל בְּנַחֲלָה
  choice: இஸ்ரவேலுக்குச் சொத்துரிமையாக
  rationale: நַחֲלָה என்பது வழிவழியாக உரிமையுடன் கிடைக்கும் நிலப்பங்கைச் சுட்டுகிறது. தமிழில் சொத்துரிமையாக என்பது வெறும் உடைமையைவிட சட்ட-நில உரிமை நுணுக்கத்தை இயல்பாகத் தெரிவிக்கிறது.
- source_word: כַּאֲשֶׁר צִוִּיתִיךָ
  choice: நான் உனக்குக் கட்டளையிட்டபடியே
  rationale: முன்னரே யோசுவாவுக்குக் கொடுக்கப்பட்டு இன்னும் பொருந்தும் கட்டளையை நேரடியாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל என்பதன் மொழியாக்கம்
  choice: இஸ்ரவேல் மக்கள்
  alternative: இஸ்ரவேலின் மகன்கள்
  rationale: எபிரெய வடிவம் சொற்படியாக மகன்கள் என்றாலும், இந்த நிலப்பகிர்வு மற்றும் தேசியக் கூட்டுச் சூழலில் அது இஸ்ரவேல் மக்களைக் குறிக்கும் நிலையான சொற்றொடர். இஸ்ரவேல் மக்கள் என்பது பாலினத்தைப் பற்றிய தேவையற்ற முடிவை இறக்குமதி செய்யாமல் நவீன தமிழில் இயல்பாக இருக்கிறது.
- issue: נַחֲלָה என்பதன் நிலப்பங்குச் சூழல்
  choice: சொத்துரிமை
  alternative: சுதந்தரம்
  rationale: இங்கு வழங்கப்படும் நாடு வெறும் நிலப்பரப்பு அல்ல, உரிமையுடன் ஒதுக்கப்படும் பங்கு. சொத்துரிமை அந்த சட்டபூர்வ நில-உரிமை நுணுக்கத்தைத் தருகிறது; சுதந்தரம் என்ற சொல் நவீன தமிழில் விடுதலை என்ற பொருளுடன் குழப்பமளிக்கலாம்.
- issue: אוֹרִישֵׁם என்பதன் செயற்பொருள்
  choice: துரத்திவிடுவேன்
  alternative: அவர்களை உரிமையிழக்கச் செய்வேன்
  rationale: தெய்வீகச் செயலைத் தெளிவாகக் கூறுகிறது; ஆனால் அது எப்படிச் செயல்படும் என்பதை மேலதிகமாக விளக்கவில்லை. உரிமையிழக்கச் செய்வேன் என்ற மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் அதேவேளையில் வேதாகம உரைக்கு ஏற்ற கண்ணியமான நடை பயன்படுத்தப்பட்டது. நீ என்ற ஒருமை வடிவம் கட்டளை யோசுவாவைத் தனிப்பட்ட முறையில் நோக்குவதைப் பாதுகாக்கிறது. இடப்பெயர்கள் தமிழில் வாசிக்கத்தக்க ஒலிபெயர்ப்பில் தரப்பட்டுள்ளன.
