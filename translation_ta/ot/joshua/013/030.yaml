  text: וַ/יְהִ֣י גְבוּלָ֗/ם מִ/מַּחֲנַ֨יִם כָּֽל הַ/בָּשָׁ֜ן כָּֽל מַמְלְכ֣וּת ע֣וֹג מֶֽלֶךְ הַ/בָּשָׁ֗ן וְ/כָל חַוֺּ֥ת יָאִ֛יר אֲשֶׁ֥ר בַּ/בָּשָׁ֖ן שִׁשִּׁ֥ים עִֽיר־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/030.yaml
  text: 'Their territory was from Mahanaim: all Bashan[a], all the kingdom of Og king of Bashan[b], and all the villages of Jair that are in Bashan—sixty cities.'
translation:
  language: ta
  text: அவர்களுடைய நிலப்பகுதி மகனாயீமிலிருந்து தொடங்கி, பாசான் முழுவதையும், பாசானின் அரசனான ஓக்கின் அரசாட்சி முழுவதையும், பாசானிலுள்ள யாயீரின் குடியிருப்புகள் அனைத்தையும்—அதாவது அறுபது நகரங்களை—உள்ளடக்கியது.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: גְבוּלָם
  choice: அவர்களுடைய நிலப்பகுதி
  rationale: இந்தப் பங்கீட்டுச் சூழலில் இச்சொல் எல்லைக் கோட்டை மட்டும் அல்லாமல், அந்த எல்லைக்குள் அமைந்த நிலப்பரப்பைக் குறிக்கிறது.
- source_word: מִמַּחֲנַיִם
  choice: மக்னாயீமில் தொடங்கி
  rationale: מִן இங்கு நிலப்பகுதி விவரிப்பின் தொடக்க இடத்தைக் குறிக்கிறது; மக்னாயீம் என்ற இடப்பெயர் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: כָּל הַבָּשָׁן
  choice: பாசான் முழுவதையும்
  rationale: כָּל என்பதன் முழுமையான பரப்பை இயல்பான தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: מַמְלְכוּת עוֹג מֶלֶךְ הַבָּשָׁן
  choice: பாசானின் அரசனான ஓக்கின் அரசாட்சி முழுவதையும்
  rationale: מַמְלְכוּת என்பது அரசாட்சி அல்லது அரசைக் குறிக்கும்; இங்கு ஆளப்பட்ட நிலப்பரப்பைச் சுட்டுவதால் ‘அரசாட்சி’ பொருத்தமானது.
- source_word: חַוֹּת יָאִיר
  choice: யாவீரின் குடியிருப்புகள்
  rationale: חַוֹּת என்பது யாவீருடன் தொடர்புடைய குடியேற்றங்கள் அல்லது சிற்றூர்களைக் குறிக்கிறது. பாரம்பரிய ஒலிபெயர்ப்பு அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: שִׁשִּׁים עִיר
  choice: அறுபது நகரங்கள்
  rationale: עִיר என்பது நகரம் அல்லது ஊரைக் குறிக்கலாம்; நிலப்பகுதிப் பட்டியலின் வழக்கமான சொல்லாட்சியாக ‘நகரங்கள்’ பயன்படுத்தப்பட்டுள்ளது; இது நவீனப் பெருநகரங்களையே குறிக்க வேண்டியதில்லை.
