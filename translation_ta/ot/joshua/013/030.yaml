revisions:
- from: அவர்களுடைய நிலப்பகுதி மக்னாயீமில் தொடங்கி, பாசான் முழுவதையும், பாசானின் அரசனான ஓக்கின் அரசாட்சி முழுவதையும், பாசானிலிருந்த யாவீரின் குடியிருப்புகள்[a] அனைத்தையும் உள்ளடக்கியது—மொத்தம் அறுபது நகரங்கள்.
  to: அவர்களுடைய நிலப்பகுதி மகனாயீமிலிருந்து தொடங்கி, பாசான் முழுவதையும், பாசானின் அரசனான ஓக்கின் அரசாட்சி முழுவதையும், பாசானிலுள்ள யாயீரின் குடியிருப்புகள் அனைத்தையும்—அதாவது அறுபது நகரங்களை—உள்ளடக்கியது.
