translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்கு எளிதாகவும் வேதாகம நிலப்பகுதிப் பட்டியலுக்கேற்ற கண்ணியமான நடையிலும் மொழிபெயர்க்கப்பட்டுள்ளது. எபிரேய வாக்கியத்தின் சுருக்கமான பட்டியல் அமைப்பு தமிழில் இயல்பாக அமைய ‘தொடங்கி’ மற்றும் ‘உள்ளடக்கியது’ பயன்படுத்தப்பட்டுள்ளன.
