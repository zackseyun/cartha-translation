source:
  edition: WLC
  text: וִ/יהוֹשֻׁ֣עַ זָקֵ֔ן בָּ֖א בַּ/יָּמִ֑ים וַ/יֹּ֨אמֶר יְהוָ֜ה אֵלָ֗י/ו אַתָּ֤ה זָקַ֨נְתָּה֙ בָּ֣אתָ בַ/יָּמִ֔ים וְ/הָ/אָ֛רֶץ נִשְׁאֲרָ֥ה הַרְבֵּֽה מְאֹ֖ד לְ/רִשְׁתָּֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/001.yaml
  text: Joshua was old[a], advanced in years, and Yahweh said to him, “You are old, advanced in years, and very much of the land remains to be possessed.”
translation:
  language: ta
  text: யோசுவா முதிர்ந்தவராகவும், வயதில் மிகவும் முன்னேறியவராகவும் இருந்தார். யாவே அவரிடம், “நீ முதிர்ந்தவனாகவும், வயதில் மிகவும் முன்னேறியவனாகவும் இருக்கிறாய்; கைப்பற்றுவதற்கு[a] இன்னும் மிக மிகுதியான நிலம் எஞ்சியுள்ளது” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அதை உரிமையாகப் பெறுவதற்கு.” எபிரெய வினைச்சொல் நிலத்தைக் கைப்பற்றுதல் அல்லது அதை உரிமையாகப் பெறுதல் என்ற பொருளைக் கொள்ளலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: זָקֵן
  choice: முதிர்வயதடைந்து
  rationale: யோசுவாவின் முதுமை நிலையை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது; வெறும் ‘வயதானவர்’ என்பதைவிட வினைநிலையையும் தக்கவைக்கிறது.
- source_word: בָּא בַּיָּמִים
  choice: வயதில் மிகவும் முன்னேறியிருந்தார்
  rationale: ‘நாட்களுக்குள் வந்தவர்’ என்ற எபிரெய மரபுத்தொடரின் பொருள் முதிர்ந்த வயதை அடைந்திருப்பது; சொற்சொல்லான அச自然மான தமிழைத் தவிர்த்து அதன் வலியுறுத்தலைப் பாதுகாக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இது பட்டமல்ல, தேவனுடைய தனிப்பெயரைக் குறிக்கும் நான்கு எழுத்துப் பெயர்; தமிழில் பரவலாகப் புரியக்கூடிய ஒலிபெயர்ப்பு பயன்படுத்தப்படுகிறது.
- source_word: אַתָּה זָקַנְתָּה בָּאתָ בַיָּמִים
  choice: நீ முதிர்வயதடைந்து, வயதில் மிகவும் முன்னேறிவிட்டாய்
  rationale: விவரிப்பாளரின் கூற்றைத் தேவன் மீண்டும் கூறும் மூலத்தின் வலியுறுத்தலைத் தமிழிலும் மீளுரைப்பதன் மூலம் காக்கிறது.
- source_word: הָאָרֶץ
  choice: நிலம்
  rationale: யோசுவா நூலின் உடன்படிக்கை மற்றும் புவியியல் சூழலில் குறிப்பிட்ட நாட்டுநிலத்தைக் குறிக்கும் இயல்பான தமிழ்ச் சொல்.
- source_word: נִשְׁאֲרָה הַרְבֵּה מְאֹד
  choice: இன்னும் மிகுதியாக உள்ளது
  rationale: எஞ்சியுள்ள நிலத்தின் அளவு மிகப் பெரிது என்ற இரட்டை வலியுறுத்தலைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: לְרִשְׁתָּהּ
  choice: கைப்பற்றப்பட வேண்டிய
  rationale: இச்சூழலில் நிலத்தைத் தம் வசமாக்குதல் முதன்மை; இருப்பினும் ירשׁ என்பதில் உள்ள ‘உரிமைச் சொத்தாகப் பெறுதல்’ என்ற வாய்ப்பை அடிக்குறிப்பில் பாதுகாக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற தேவப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலத்தில் நேரடியாகத் தேவனுடைய தனிப்பெயர் உள்ளது. அதை ஒரு பட்டமாக மாற்றாமல் ஒலிபெயர்ப்பது மூலத்தின் தன்மையைப் பாதுகாக்கிறது.
- issue: ירשׁ என்பதன் நிலவுடைமை சார்ந்த பொருள்
  choice: கைப்பற்றப்பட வேண்டிய
  alternative: உரிமைச் சொத்தாகப் பெறப்பட வேண்டிய
  rationale: யோசுவாவின் உடனடி சூழலில் நிலத்தை வசப்படுத்துதல் முன்னிலையில் உள்ளது; அதேவேளை வாக்களிக்கப்பட்ட நிலத்தை உரிமையாகப் பெறும் நுண்பொருளைத் தீர்மானமாக நீக்காமல் அடிக்குறிப்பில் தருகிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. மூலத்தில் தனியான ‘இப்போது’ என்ற காலச்சொல் இல்லாததால் தொடக்கத்தில் அது சேர்க்கப்படவில்லை. எனினும் இரண்டு இணை வாவ் வடிவங்களுக்கிடையேயான கதைத் தொடர்ச்சியை இயல்பாக்க ‘அப்போது’ இரண்டாம் வாக்கியத்தில் பயன்படுத்தப்பட்டுள்ளது.
