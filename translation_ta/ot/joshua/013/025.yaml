  text: וַ/יְהִ֤י לָ/הֶם֙ הַ/גְּב֔וּל יַעְזֵר֙ וְ/כָל עָרֵ֣י הַ/גִּלְעָ֔ד וַ/חֲצִ֕י אֶ֖רֶץ בְּנֵ֣י עַמּ֑וֹן עַד עֲרוֹעֵ֕ר אֲשֶׁ֖ר עַל פְּנֵ֥י רַבָּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/025.yaml
  text: And their territory was Jazer[a], and all the cities of Gilead, and half the land of the Ammonites, as far as Aroer, which is opposite Rabbah.
translation:
  language: ta
  text: அவர்களுடைய நிலப்பரப்பு யாசேரும், கிலேயாத்தின் எல்லா நகரங்களும், அம்மோனியரின் நாட்டின் பாதியும், ரப்பாவுக்கு எதிரே[a] இருக்கும் அரோவேர் வரையிலும் இருந்தது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ரப்பாவை நோக்கி இருக்கும்.” எபிரேய மரபுத்தொடரின் நேரடிப் பொருள், “ரப்பாவின் முன்பாக இருக்கும்” என்பதாகும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי לָהֶם הַגְּבוּל
  choice: அவர்களுடைய நிலப்பரப்பு ... இருந்தது
  rationale: גְּבוּל என்பது எல்லையையும், அந்த எல்லைக்குள் உள்ள நிலப்பரப்பையும் குறிக்கலாம். தொடர்ந்து உட்பட்ட இடங்கள் பட்டியலிடப்படுவதால், நவீன தமிழில் இயல்பான ‘நிலப்பரப்பு’ பொருத்தமானது.
- source_word: יַעְזֵר
  choice: யாசேர்
  rationale: எபிரேய இடப்பெயரின் தமிழாக்க ஒலிபெயர்ப்பு.
- source_word: וְכָל עָרֵי הַגִּלְעָד
  choice: கிலேயாத்தின் எல்லா நகரங்கள்
  rationale: עָרֵי என்பது நகரங்கள் அல்லது ஊர்கள் எனப் பொருள்படலாம்; நிலப்பகுதிப் பட்டியலின் கண்ணியமான நடைக்கு ‘நகரங்கள்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: וַחֲצִי אֶרֶץ בְּנֵי עַמּוֹן
  choice: அம்மோனியரின் நாட்டில் பாதி
  rationale: בְּנֵי עַמּוֹן இங்கு அம்மோன் மக்களைக் குறிக்கும் இன-புவியியல் பெயர்; אֶרֶץ என்பதற்கு இச்சூழலில் ‘நாடு’ இயல்பானது.
- source_word: עַד עֲרוֹעֵר
  choice: அரோவேர் வரையிலும்
  rationale: עַד நிலப்பரப்பின் எல்லையைச் சுட்டுவதால் ‘வரையிலும்’ என மொழிபெயர்க்கப்பட்டது; עֲרוֹעֵר ‘அரோவேர்’ என ஒலிபெயர்க்கப்பட்டது.
- source_word: אֲשֶׁר עַל פְּנֵי רַבָּה
  choice: ரப்பாவுக்கு எதிரே உள்ள
  rationale: עַל־פְּנֵי என்ற இடவியல் மரபுத்தொடர் ‘முன்பாக’, ‘எதிரில்’ அல்லது ‘எதிர்நோக்கி’ எனப் பொருள்படலாம். திசையை ஊகிக்காமல் இடவியல் உறவைத் தெரிவிக்க ‘எதிரே’ பயன்படுத்தப்பட்டது.
