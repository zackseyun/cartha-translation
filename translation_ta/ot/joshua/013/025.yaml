revisions:
- from: அவர்களுடைய நிலப்பரப்பு யாசேர், கிலேயாத்தின் எல்லா நகரங்கள், அம்மோனியரின் நாட்டில் பாதி, ரப்பாவுக்கு எதிரே[a] உள்ள அரோவேர் வரையிலும் இருந்தது.
  to: அவர்களுடைய நிலப்பரப்பு யாசேரும், கிலேயாத்தின் எல்லா நகரங்களும், அம்மோனியரின் நாட்டின் பாதியும், ரப்பாவுக்கு எதிரே[a] இருக்கும் அரோவேர் வரையிலும் இருந்தது.
  rationale: The revision changes only the Tamil genitive construction needed to convey ‘half of the land’ and lightly regularizes coordination in the geographic list. The rendering ‘ரப்பாவுக்கு எதிரே’ and its note retain the source idiom’s spatial ambiguity without imposing a cardinal direction.
