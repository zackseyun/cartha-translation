base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/031.yaml
  text: and half of Gilead[a], and Ashtaroth and Edrei, the cities of the kingdom of Og in Bashan, belonged to the sons of Machir son of Manasseh—to half of the sons of Machir[b], according to their clans.
translation:
  language: ta
  text: கீலேயாத்தின் பாதியும், பாசானிலுள்ள ஓகின் அரசாட்சியின் நகரங்களாகிய[a] அஸ்தரோத்தும் எத்ரேயியும், மனாசேயின் மகனான மாகீரின் மகன்களுக்கு—மாகீரின் மகன்களில் பாதியினருக்கு[b]—அவர்களுடைய குலங்களின்படி ஒதுக்கப்பட்டன.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘பாசானிலுள்ள ஓகின் அரச நகரங்களாகிய.’ எபிரெயில் சொற்பொருளாக, ‘பாசானிலுள்ள ஓகின் அரசாட்சியின் நகரங்கள்’ என்று உள்ளது.
    reason: lexical_alternative
  - marker: b
    text: ‘மாகீரின் மகன்கள்’ என்பது மாகீரின் வழிவந்த சந்ததியினரைப் பொதுவாகக் குறிக்கக்கூடும்; எனினும், மொழிபெயர்ப்பு எபிரெயிலுள்ள குடும்ப உறவுச் சொல்லைப் பேணுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַחֲצִי הַגִּלְעָד
  choice: கீலேயாத்தின் பாதியும்
  rationale: இணைப்புச் சொல் முந்தைய வசனத்தின் பங்கீட்டுப் பட்டியலைத் தொடர்கிறது; நிலப்பரப்பைக் குறிக்கும் חֲצִי என்பதற்கு இயல்பாக ‘பாதி’ பயன்படுத்தப்பட்டது.
- source_word: וְעַשְׁתָּרוֹת וְאֶדְרֶעִי
  choice: அஸ்தரோத்தும் எத்ரேயியும்
  rationale: இவை இடப்பெயர்கள் என்பதால், எபிரெய ஒலியமைப்புக்கு நெருக்கமான தமிழெழுத்துப் பெயர்ப்பு பயன்படுத்தப்பட்டது.
- source_word: עָרֵי מַמְלְכוּת עוֹג בַּבָּשָׁן
  choice: பாசானிலுள்ள ஓகின் அரசின் நகரங்களான
  rationale: எபிரெயக் கட்டமைப்பிலுள்ள ‘அரசின் நகரங்கள்’ என்ற உறவைப் பேணி, அவை தலைநகரங்களா அல்லது அரசாட்சிக்குள் இருந்த நகரங்களா என்பதைத் தீர்மானிக்காமல் விடுகிறது.
- source_word: לִבְנֵי מָכִיר בֶּן מְנַשֶּׁה
  choice: மனாசேயின் மகனான மாகீரின் மக்களுக்கு
  rationale: לְ இங்கு பங்கு ஒதுக்கப்பட்டதைக் குறிக்கிறது; வினையற்ற எபிரெய வாக்கியம் தமிழில் நிறைவுபெற ‘ஒதுக்கப்பட்டன’ சேர்க்கப்பட்டது. בְּנֵי என்பதன் குடும்ப உறவு மொழி ‘மக்கள்’ எனப் பேணப்பட்டது.
- source_word: לַחֲצִי בְנֵי מָכִיר
  choice: மாகீரின் மக்களில் பாதிப்பேருக்கு
  rationale: மாகீரின் வழிமரபில் ஒரு பாதியினர் மட்டுமே குறிக்கப்படுவதைத் தெளிவாகச் சொல்கிறது; மூலத்தில் இல்லாத ‘அரைக்கோத்திரம்’ போன்ற சொல்லைச் சேர்க்கவில்லை.
- source_word: לְמִשְׁפְּחוֹתָם
  choice: அவர்களுடைய குலங்களின்படி
  rationale: நிலப் பங்கீட்டுச் சூழலில் מִשְׁפָּחוֹת என்பது தனிக் குடும்பங்களை விடக் கோத்திரத்துக்குள் உள்ள குலப் பிரிவுகளைக் குறிக்கிறது.
