source:
  edition: WLC
  text: מִֽן הַ/שִּׁיח֞וֹר אֲשֶׁ֣ר עַל פְּנֵ֣י מִצְרַ֗יִם וְ/עַ֨ד גְּב֤וּל עֶקְרוֹן֙ צָפ֔וֹנָ/ה לַֽ/כְּנַעֲנִ֖י תֵּחָשֵׁ֑ב חֲמֵ֣שֶׁת סַרְנֵ֣י פְלִשְׁתִּ֗ים הָ/עַזָּתִ֤י וְ/הָ/אַשְׁדּוֹדִי֙ הָ/אֶשְׁקְלוֹנִ֣י הַ/גִּתִּ֔י וְ/הָ/עֶקְרוֹנִ֖י וְ/הָ/עַוִּֽים־׀־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/003.yaml
  text: 'from the Shihor, which is east of Egypt, as far as the border of Ekron to the north—it is counted as Canaanite territory—the five rulers of the Philistines: the Gazite, the Ashdodite, the Ashkelonite, the Gittite, and the Ekronite, and the Avvim.'
translation:
  language: ta
  text: 'எகிப்துக்கு எதிரிலுள்ள சீகோரிலிருந்து எக்ரோனின் வடக்கு எல்லைவரை—அது கானானியருக்குரியதாகக் கணக்கிடப்படுகிறது—பெலிஸ்தியரின் ஐந்து ஆட்சியாளர்கள்: காசாவைச் சேர்ந்தவர், அஸ்தோத்தைச் சேர்ந்தவர், அஸ்கலோனைச் சேர்ந்தவர், காத் நகரைச் சேர்ந்தவர், எக்ரோனைச் சேர்ந்தவர்; மேலும் அவ்வீமியர்.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עַל־פְּנֵי מִצְרַיִם
  choice: எகிப்துக்குக் கிழக்கே
  rationale: இச்சூழலில் עַל־פְּנֵי என்பது எகிப்தின் முன்னால்/எதிரே என்பதிலிருந்து புவியியல் திசையாக ‘கிழக்கே’ எனப் புரிந்துகொள்ளப்படுகிறது; இயல்பான தமிழுக்காக இவ்வாறு மொழிபெயர்க்கப்பட்டது.
- source_word: סַרְנֵי
  choice: ஆட்சியாளர்கள்
  rationale: பெலிஸ்திய நகர-நாடுகளின் தலைவர்களைக் குறிக்கும் தனிச்சொல்; ‘அரசர்கள்’ என்பதைவிட பொதுவானதும் துல்லியமானதும்.
- source_word: לַכְּנַעֲנִי תֵּחָשֵׁב
  choice: கானானியருடையதாகக் கருதப்படுகிறது
  rationale: எபிரேய வினையின் செயல்படுபொருளற்ற வடிவத்தையும் நிலப்பகுதியின் வகைப்பாட்டையும் பாதுகாக்கிறது.
- source_word: הָעַזָּתִי ... הָעֶקְרוֹנִי
  choice: காசாவைச் சேர்ந்தவர் ... எக்ரோனைச் சேர்ந்தவர்
  rationale: இன/நகர அடைமொழிகளைத் தமிழில் இயல்பாக, ஒவ்வொரு நகர ஆட்சியாளரையும் குறிக்கும் வகையில் வழங்குகிறது.
- source_word: וְהָעַוִּים
  choice: அவ்வீமியரின் பகுதியும்
  rationale: வசனத்தின் நிலப்பகுதிப் பட்டியலுடன் தொடர்பைத் தமிழில் தெளிவாக்குகிறது; மூலத்தில் உள்ள அவ்வீமியர் என்ற மக்கள்பெயர் பாதுகாக்கப்படுகிறது.
theological_decisions:
- issue: கானானியர் எனக் கணக்கிடப்படும் பகுதியின் இலக்கணத் தொடர்பு
  choice: சீகோரிலிருந்து எக்ரோன் எல்லைவரையுள்ள பகுதி கானானியருடையதாகக் கருதப்படுகிறது
  alternative: எக்ரோனின் வடபகுதி மட்டும் கானானியருடையதாகக் கருதப்படுகிறது
  rationale: எபிரேய தொடரமைப்பில் முழு முன்கூறிய புவியியல் வரம்பே கணக்கிடப்படும் பகுதியாக இயல்பாகப் படிக்கப்படுகிறது; கூடுதல் இறையியல் விளக்கம் சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழ்; மரியாதைமிக்க ஆனால் பொதுவாசகர்களுக்குப் புரியும் நடை. நீண்ட எபிரேய பட்டியல் தமிழில் தெளிவாகப் படிக்க இரண்டு வாக்கியங்களாக அமைக்கப்பட்டது. இடப்பெயர்கள் பரவலாக அறியப்படும் தமிழ் வேதாகம ஒலிபெயர்ப்பு மரபுக்கு அண்மையாக வழங்கப்பட்டன.
