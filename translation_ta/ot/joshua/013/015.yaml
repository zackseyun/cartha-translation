base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/015.yaml
  text: And Moses gave to the tribe of the sons of Reuben according to their clans:[a]
translation:
  language: ta
  text: மோசே ரூபனின் மகன்களின் கோத்திரத்திற்கு அவர்களுடைய குலங்களின்படி கொடுத்தார்:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ரூபனியரின் கோத்திரத்திற்கு.” எபிரெய மொழியில் நேர்ப்பொருளாக “ரூபனின் மகன்களின் கோத்திரத்திற்கு” என்று உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: கொடுத்தார்
  rationale: נתן என்பதன் wayyiqtol வடிவம் கதைநிகழ்வை முன்னெடுக்கிறது. தமிழில் இயல்பான தொடர்ச்சியான வாக்கியமாக ‘கொடுத்தார்’ என மொழிபெயர்க்கப்பட்டது; வாக்கியத்தின் தொடக்கத்தில் தனியாக ‘மற்றும்’ சேர்ப்பது தேவையில்லை.
- source_word: מֹשֶׁה
  choice: மோசே
  rationale: இந்தத் தனிப்பெயரின் தமிழில் வழக்கமான வடிவம்.
- source_word: לְמַטֵּה
  choice: கோத்திரத்திற்கு
  rationale: நிலப்பங்கீட்டுச் சூழலில் מַטֶּה என்பது ‘கோத்திரம்’ என்று பொருள்படும்; முன்னொட்டு ל மறைமுகச் செயப்படுபொருளைக் குறிக்கிறது.
- source_word: בְנֵי רְאוּבֵן
  choice: ரூபனின் மகன்களுடைய
  rationale: எபிரெயச் சொற்றொடரின் நேர்ப்பொருள் ‘ரூபனின் மகன்கள்.’ அந்த உறவுமுறைச் சொல்லாட்சியைத் தெளிவாகப் பாதுகாக்கும் வகையில் உடைமை வடிவம் பயன்படுத்தப்பட்டது.
- source_word: לְמִשְׁפְּחֹתָם
  choice: அவர்களுடைய குலங்களின்படி
  rationale: מִשְׁפָּחָה இங்கு கோத்திரத்திற்குள் உள்ள குலப் பிரிவைக் குறிக்கிறது. ל முன்னொட்டின் பகிர்வு அல்லது ஒழுங்கமைப்பு சார்ந்த பொருளை ‘குலங்களின்படி’ இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions: []
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘கோத்திரம்’ மற்றும் ‘குலம்’ என்பவை முறையே tribe மற்றும் clan என்ற அமைப்புநிலைகளை வேறுபடுத்துகின்றன. மூலத்தின் வம்சவழிச் சொல்லாட்சியைப் பாதுகாக்க ‘ரூபனின் மகன்களுடைய’ முதன்மை உரையில் வைக்கப்பட்டுள்ளது.
