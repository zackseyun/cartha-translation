translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதாகவும் வேதாகமச் சூழலுக்கேற்ற கண்ணியத்துடனும் வடிவமைக்கப்பட்டது. ‘கோத்திரம்’ என்ற நிலைபெற்ற வேதாகமச் சொல் தக்கவைக்கப்பட்டது. கட்டளையின் நேரடித்தன்மையும் நிலத்தை உரிமைப் பங்காக ஒதுக்கும் கருத்தும் பாதுகாக்கப்பட்டுள்ளன.
