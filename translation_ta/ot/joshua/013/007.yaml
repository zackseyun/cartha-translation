source:
  edition: WLC
  text: וְ/עַתָּ֗ה חַלֵּ֞ק אֶת הָ/אָ֧רֶץ הַ/זֹּ֛את בְּ/נַחֲלָ֖ה לְ/תִשְׁעַ֣ת הַ/שְּׁבָטִ֑ים וַ/חֲצִ֖י הַ/שֵּׁ֥בֶט הַֽ/מְנַשֶּֽׁה־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/007.yaml
  text: Now divide this land as an inheritance to the nine tribes and the half-tribe of Manasseh[a].
translation:
  language: ta
  text: இப்போது இந்த நிலத்தை ஒன்பது கோத்திரங்களுக்கும் மனாசேயின் அரைக் கோத்திரத்துக்கும் மரபுரிமைப் பங்காகப் பிரித்துக் கொடு.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மேலும் இப்போது இந்த நிலத்தை ஒன்பது கோத்திரங்களுக்கும் மனாசே கோத்திரத்தின் பாதிக்கும் மரபுரிமையாகப் பிரித்துக் கொடு.”
    reason: וְעַתָּה என்பதற்கு ‘மேலும் இப்போது’ என்றும், בְּנַחֲלָה என்பதற்கு ‘மரபுரிமையாக’ என்றும், וַחֲצִי הַשֵּׁבֶט என்பதற்கு ‘கோத்திரத்தின் பாதி’ என்றும் மொழிபெயர்க்கலாம்.
lexical_decisions:
- source_word: וְעַתָּה
  choice: இப்போது
  rationale: அடுத்த கட்டளையை அறிமுகப்படுத்தும் உரைமாற்றத்தைக் குறிக்கிறது. தமிழில் இயல்பாக இருக்க இணைப்புச் சொல்லான ‘ஆகவே’ அல்லது ‘மேலும்’ சேர்க்கப்படவில்லை; ‘இப்போது’ என்பதே காலத்தையும் உரைநகர்வையும் தருகிறது.
- source_word: חַלֵּק
  choice: பிரித்துக் கொடு
  rationale: யோசுவாவை நோக்கிய ஒருமை ஆண்பால் கட்டளை. ‘பிரி’ என்ற அடிப்படைப் பொருளோடு, பெறுநர்களுக்கு ஒதுக்கிக் கொடுக்கும் சூழலைத் தமிழில் இயல்பாக வெளிப்படுத்த ‘பிரித்துக் கொடு’ பயன்படுத்தப்பட்டது.
- source_word: אֶת הָאָרֶץ הַזֹּאת
  choice: இந்த நாட்டை
  rationale: விவாதிக்கப்படும் கானான் நிலப்பரப்பைக் குறிக்கும் நேரடிச் செயப்படுபொருள். இங்கு ‘நாடு’ என்பது நவீன தமிழில் இயல்பானதும் போதிய அகலமுடையதும் ஆகும்.
- source_word: בְּנַחֲלָה
  choice: உரிமைப் பங்காக
  rationale: נַחֲלָה என்பது சாதாரண உடைமையை மட்டும் அல்லாமல், ஒதுக்கப்பட்டு தலைமுறை வழியாகக் கிடைக்கும் நில உரிமையையும் குறிக்கிறது. ‘உரிமைப் பங்கு’ சட்டபூர்வ ஒதுக்கீடும் பரம்பரை உரிமையும் இணைந்த பொருளைத் தெளிவாகத் தருகிறது.
- source_word: לְתִשְׁעַת הַשְּׁבָטִים
  choice: ஒன்பது கோத்திரங்களுக்கும்
  rationale: לְ பெறுநர்களைக் குறிக்கிறது. தமிழின் இணைப்பு அமைப்பில் ‘-க்கும்’ உரிய பெறுநர் உறவை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וַחֲצִי הַשֵּׁבֶט
  choice: அரைக் கோத்திரத்துக்கும்
  rationale: அங்கீகரிக்கப்பட்ட கோத்திரப் பிரிவைக் குறிக்கும். ‘அரைக் கோத்திரம்’ சுருக்கமாகவும் தெளிவாகவும் உள்ளது.
- source_word: הַמְנַשֶּׁה
  choice: மனாசேயின்
  rationale: தனிநபர்/கோத்திரப் பெயர் தமிழில் வழக்கிலுள்ள ஒலிபெயர்ப்பின்படி தரப்பட்டது; உடைமை வேற்றுமை அரைக் கோத்திரத்துடனான உறவைத் தெளிவாக்குகிறது.
