base_translation:
  language: en
  yaml_path: translation/ot/joshua/005/011.yaml
  text: 'And they ate some of the produce of the land on the day after the Passover: unleavened bread and roasted grain[b][a], on this very day.'
translation:
  language: ta
  text: அவர்கள் பஸ்காவுக்கு மறுநாளில் அந்த நாட்டின் விளைச்சலில் சிலவற்றை[a]—புளிப்பில்லாத அப்பங்களையும் வறுத்த தானியத்தையும்[b]—அந்த நாளிலேயே சாப்பிட்டார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அந்த நாட்டின் பழைய விளைச்சலிலிருந்து.’ எபிரெயச் சொல் நாட்டின் விளைச்சல் அல்லது மகசூலைக் குறிக்கலாம்; இச்சூழலில் அது முந்தைய அறுவடையிலிருந்து சேமிக்கப்பட்ட விளைச்சலைக் குறிப்பதாகச் சிலர் புரிந்துகொள்கிறார்கள்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘உலர்வறுத்த தானியத்தையும்.’ எபிரெயச் சொல் வறுத்து ஆயத்தப்படுத்தப்பட்ட தானியத்தைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאכְלוּ
  choice: சாப்பிட்டார்கள்
  rationale: אכל என்பதன் தொடர்கதை வடிவம் அடுத்த நிகழ்வை எடுத்துரைக்கிறது. தமிழில் இயல்பான இறந்தகால வினைச்சொல் எபிரெயக் கதை ஓட்டத்தைத் தெளிவாகக் கடத்துகிறது.
- source_word: מֵעֲבוּר הָאָרֶץ
  choice: அந்த நாட்டின் விளைச்சலில் சிலவற்றை
  rationale: עֲבוּר என்பது இங்கு நாட்டின் விளைச்சல் அல்லது மகசூலைக் குறிக்கிறது. מן முன்னொட்டு பகுதியுணர்வைக் கொண்டிருப்பதால், ‘சிலவற்றை’ என்பது அவர்கள் விளைச்சல் முழுவதையும் சாப்பிட்டார்கள் என்ற தவறான பொருளைத் தவிர்க்கிறது. முந்தைய அறுவடையில் சேமித்த பழைய விளைச்சல் என்ற சாத்தியம் அடிக்குறிப்பில் வைக்கப்பட்டுள்ளது.
- source_word: מִמָּחֳרַת הַפֶּסַח
  choice: பஸ்காவுக்கு மறுநாளில்
  rationale: காலத்தைக் குறிக்கும் சொற்றொடரை நவீனத் தமிழில் தெளிவாகவும் இயல்பாகவும் வழங்குகிறது.
- source_word: מַצּוֹת
  choice: புளிப்பில்லாத அப்பங்கள்
  rationale: பஸ்கா சூழலில் மַצּוֹת என்பதற்கான தெளிவான, வழக்கமான தமிழ் இணைச்சொல்.
- source_word: וְקָלוּי
  choice: வறுத்த தானியம்
  rationale: קָלוּי என்பது வெப்பத்தில் வறுத்து ஆயத்தப்படுத்தப்பட்ட தானியத்தைக் குறிக்கிறது. ‘வறுத்த தானியம்’ இன்றைய வாசகருக்கு உடனடியாகப் புரியும்.
- source_word: בְּעֶצֶם הַיּוֹם הַזֶּה
  choice: அந்த நாளிலேயே
  rationale: இந்த எபிரெய மரபுத்தொடர் குறிப்பிட்ட அதே நாளை வலியுறுத்துகிறது. தமிழ்க் கதைநடையின் பின்னோக்கு நோக்கிற்கு ‘அந்த’ இயல்பாகவும், ‘-லேயே’ வலியுறுத்தலைத் தக்கவைத்தும் உள்ளது.
