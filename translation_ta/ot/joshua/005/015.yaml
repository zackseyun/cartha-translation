base_translation:
  language: en
  yaml_path: translation/ot/joshua/005/015.yaml
  text: Then the commander of Yahweh’s army said to Joshua[a], “Take your sandal off your foot[b], because the place where you are standing is holy.” And Joshua did so.
translation:
  language: ta
  text: அப்போது யாவேயின் படைத்தலைவர் யோசுவாவிடம்[a], “உன் காலிலுள்ள செருப்பைக் கழற்று[b]; ஏனெனில் நீ நின்றுகொண்டிருக்கும் இடம் பரிசுத்தமானது” என்றார். யோசுவாவும் அவ்வாறே செய்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது “யாவேயின் படையின் தலைவர்.”
    reason: lexical_alternative
  - marker: b
    text: 'எபிரெயத்தில் ஒருமை: “உன் செருப்பு ... உன் கால்.” யாத்திராகமம் 3:5-இல் காணப்படும் பழக்கமான பன்மைச் சொல்லாக்கத்துடன் ஒப்பிடுக.'
    reason: cross_reference
lexical_decisions:
- source_word: שַׂר
  choice: படைத்தலைவர்
  rationale: צְבָא என்ற இராணுவச் சூழலில் தலைமை வகிப்பவரை இயல்பான நவீன தமிழில் தெளிவாகக் குறிக்கிறது.
- source_word: צְבָא יְהוָה
  choice: யாவேயின் படை
  rationale: צָבָא என்பதன் இராணுவப் பொருளை எளிதில் புரியக்கூடிய ‘படை’ என்ற சொல்லால் வெளிப்படுத்துகிறது; தெய்வீகப் பெயர் தனிப்பெயராகத் தக்கவைக்கப்படுகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெயத் தெய்வீகத் தனிப்பெயரை ஒரு பட்டத்தால் மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: שַׁל
  choice: கழற்று
  rationale: காலணியை அகற்றும் நேரடிக் கட்டளையைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: נַעַלְךָ
  choice: உன் ... செருப்பு
  rationale: பண்டைய காலணிக்கு ஏற்ற ‘செருப்பு’ என்பதையும் எபிரெய ஒருமையையும் தக்கவைக்கிறது.
- source_word: מֵעַל רַגְלְךָ
  choice: உன் காலிலுள்ள
  rationale: ‘உன் கால்’ என்ற எபிரெய ஒருமையைத் தக்கவைத்து, தமிழில் இயல்பான சொற்றொடராக அமைக்கிறது.
- source_word: הַמָּקוֹם
  choice: இடம்
  rationale: சுட்டுப்பெயரைச் சேர்க்காமல் வரையறுக்கப்பட்ட பெயர்ச்சொல்லை நேரடியாக வழங்குகிறது.
- source_word: עֹמֵד עָלָיו
  choice: நீ நின்றுகொண்டிருக்கும்
  rationale: பங்கேற்பு வடிவத்தின் தொடர்நிலையை இயல்பான தமிழில் வெளிப்படுத்துகிறது; ‘அதன்மேல்’ என்பது தமிழில் இங்கு தேவையின்றி மீளுரைப்பாக இருக்கும்.
- source_word: קֹדֶשׁ הוּא
  choice: பரிசுத்தமானது
  rationale: இடம் தெய்வீகப் பிரசன்னத்தால் புனிதமாக இருப்பதை வேதாகம மரியாதை நடையில் தெரிவிக்கிறது.
- source_word: וַיַּעַשׂ ... כֵּן
  choice: யோசுவாவும் அவ்வாறே செய்தார்
  rationale: யோசுவாவின் கீழ்ப்படிதலைக் குறிக்கும் எபிரெயக் கதைச் சூத்திரத்தை இயல்பான தமிழில் தக்கவைக்கிறது.
theological_decisions:
- issue: שַׂר צְבָא יְהוָה எனப்படும் பேச்சாளரின் அடையாளமும் நிலையும்
  choice: ‘யாவேயின் படைத்தலைவர்’ என்று விளக்கப் பட்டமாக மட்டும் மொழிபெயர்த்தல்
  alternative: தேவதூதப் படைத்தலைவர்; யாவேயின் வெளிப்பாடு; மனிதராகப் பிறப்பதற்கு முந்தைய கிறிஸ்துவின் தோற்றம்
  rationale: இவ்வசனம் அந்த நபரை இந்தப் பட்டத்திற்கு அப்பால் வெளிப்படையாக அடையாளப்படுத்தவில்லை. ஆகவே தேவதூதர், தேவத்தோற்றம், அல்லது கிறிஸ்துத்தோற்றம் என்று தீர்மானிக்காமல் மூலத்தின் இறையியல் இழுவையைத் தக்கவைக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும் இயல்பான, மரியாதைமிக்க வேதாகம நடை. எபிரெய ஒருமை திட்டமிட்டு தக்கவைக்கப்பட்டுள்ளது; பேச்சாளரின் அடையாளம் விளக்கவுரையால் தீர்மானிக்கப்படவில்லை.
