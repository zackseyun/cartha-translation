base_translation:
  language: en
  yaml_path: translation/ot/joshua/005/012.yaml
  text: And the manna ceased on the next day[a], after they had eaten from the produce of the land. There was no longer manna for the sons of Israel[b], and they ate from the yield of the land of Canaan that year.
translation:
  language: ta
  text: அவர்கள் நாட்டின் விளைச்சலை உண்ட மறுநாள் மன்னா நின்றது. இஸ்ரவேல் மக்களுக்கு இனி மன்னா இல்லை. அந்த ஆண்டில் அவர்கள் கானான் நாட்டின் விளைச்சலை உண்டனர்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁבֹּת
  choice: நின்றுபோனது
  rationale: שׁבת இங்கு ஓய்வுநாள் அனுசரிப்பதைக் குறிக்காமல், மன்னா தொடர்ந்து கிடைப்பது நின்றுவிட்டதைக் குறிக்கிறது.
- source_word: הַמָּן / מָן
  choice: மன்னா
  rationale: வனாந்தரத்தில் வழங்கப்பட்ட உணவுக்கான தமிழில் பரவலாக அறியப்பட்ட ஒலிபெயர்ப்பு.
- source_word: מִמָּחֳרָת
  choice: மறுநாளே
  rationale: முந்தைய வசனத்தில் குறிப்பிடப்பட்ட உணவுக்குப் பின்வந்த நாளைக் குறிக்கும் காலச் சொற்றொடர்; ஏ இறுதிச்சொல் நிகழ்வின் உடனடியான காலத்தொடர்பை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: בְּאָכְלָם
  choice: அவர்கள் ... சாப்பிட்ட
  rationale: בְּ + infinitive construct இங்கு காலத்தொடர்பைத் தருகிறது; தமிழில் எச்சவினை அமைப்பு இயல்பாக அந்தத் தொடர்பை வெளிப்படுத்துகிறது.
- source_word: מֵעֲבוּר הָאָרֶץ
  choice: நாட்டின் விளைச்சலில் இருந்து
  rationale: עֲבוּר நாட்டின் பயிர்விளைவை அல்லது சேமிக்கப்பட்ட விளைபொருளைக் குறிக்கலாம்; பொதுவான பொருள் முதன்மை உரையில் வைக்கப்பட்டு, குறிப்பான மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: וְלֹא הָיָה עוֹד
  choice: அதற்குப் பிறகு ... கிடைக்கவில்லை
  rationale: மன்னா இனி அவர்களுக்குக் கிடைக்கவில்லை என்ற எபிரெய இருப்பியல் வாக்கியத்தின் பொருளை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் மக்களுக்கு
  rationale: בְּנֵי என்பதன் சொற்பொருள் ‘மகன்கள்’ என்றாலும், இங்கு சமூகமெங்கும் குறிக்கப்படும் வழக்குச் சொற்றொடராக இருப்பதால் ‘மக்கள்’ என்பது இயல்பானதும் பொருள்துல்லியமானதும் ஆகும்; நேரடி வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: מִתְּבוּאַת
  choice: விளைச்சலை
  rationale: תְּבוּאָה நிலம் தரும் பயிர் அல்லது விளைபொருளைக் குறிக்கிறது; ‘விளைச்சல்’ வேளாண் பொருளைத் தெளிவாகத் தருகிறது.
- source_word: אֶרֶץ כְּנַעַן
  choice: கானான் நாடு
  rationale: எபிரெய கட்டமைப்பில் உள்ள நிலப்பெயரையும் ‘நாடு’ என்ற கூறையும் தெளிவாகப் பாதுகாக்கிறது.
- source_word: בַּשָּׁנָה הַהִיא
  choice: அந்த ஆண்டு
  rationale: காலச் சொற்றொடருக்கான சுருக்கமான, இயல்பான தமிழ் வடிவம்.
