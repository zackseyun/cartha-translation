  naturalness: நவீன நிலையான தமிழில் உரை கண்ணியமாகவும் இயல்பாகவும் உள்ளது. ‘முகம் தரையில் படுமாறு விழுந்து’ என்பது மூலத்தின் ‘அவன் முகத்தின்மேல் தரையை நோக்கி’ என்ற சொல்லமைப்பைத் தெளிவாகவும் இயல்பாகவும் தருகிறது. ‘பணிந்தார்’ செயலைக் குறிக்கிறது; அதனை ‘வழிபட்டார்’ என்று இறையியல் ரீதியாக முன்கூட்டியே வரையறுப்பதில்லை.
