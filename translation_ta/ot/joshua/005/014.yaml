  rationale: 'சிறிய, பாதுகாப்பான திருத்தங்கள் மட்டுமே செய்யப்பட்டுள்ளன: படையின் தளபதி என்ற மூல உடைமைத் தொடர்பு தெளிவுபடுத்தப்பட்டது; முகங்குப்புற விழுதலின் சொல்லமைப்பு இயல்பாக்கப்பட்டது; שחה வினைக்கான குறிப்பு அதன் பொருத்தமான சொல்லுக்குப் பின் நகர்த்தப்பட்டது. பேசுபவரின் அடையாளம் அல்லது யோசுவாவின் பணிதலின் இறையியல் பொருள் எதுவும் கூடுதலாக வரையறுக்கப்படவில்லை.'
