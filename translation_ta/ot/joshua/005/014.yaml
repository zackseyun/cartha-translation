base_translation:
  language: en
  yaml_path: translation/ot/joshua/005/014.yaml
  text: He said[a], “No; rather, I have now come as the commander of the army of Yahweh.” Then Joshua fell with his face to the ground and bowed down, and said to him[b], “What is my lord saying to his servant?”
translation:
  language: ta
  text: அவர்[a], “இல்லை; மாறாக, நான் இப்போது யெகோவாவின் படையின் தளபதியாக வந்திருக்கிறேன்” என்றார். அப்போது யோசுவா முகம் தரையில் படுமாறு விழுந்து, பணிந்தார்[b]. பின்னர் அவரிடம், “என் ஆண்டவர் தம் அடியேனிடம் என்ன சொல்கிறார்?” என்று கேட்டார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இரண்டுமல்ல; யெகோவாவின் படையின் தளபதியாக நான் இப்போது வந்திருக்கிறேன்.”
    reason: லֹא என்பது முந்தைய இருவாய்ப்புக் கேள்விக்கான நேரடியான ‘இல்லை’ என்றும், அதன் பொருளில் ‘இரண்டுமல்ல’ என்றும் புரிந்துகொள்ளப்படலாம்.
  - marker: b
    text: “பணிந்தார்” என்பதற்கான எபிரெய வினைச்சொல்லை “வழிபட்டார்” என்றும் மொழிபெயர்க்கலாம். இந்த வசனம் மட்டும் அந்த நபரின் அடையாளத்தைத் தீர்மானிக்காததால், முதன்மை உரை செயலைக் குறிப்பிடுகிறது; அதன் இறையியல் பொருளை முடிவுசெய்யவில்லை.
    reason: மாற்று வாசிப்பையும் வசனத்தில் நிலவும் இறையியல் தெளிவின்மையையும் பாதுகாக்கிறது.
lexical_decisions:
- source_word: לֹא
  choice: இல்லை
  rationale: யோசுவா முன்பு கேட்ட இருவாய்ப்புக் கேள்விக்கு நேரடியான மறுப்பாக உள்ளது; ‘இரண்டுமல்ல’ என்பது பொருளை விளக்கும் சாத்தியமான மாற்று.
- source_word: כִּי
  choice: மாறாக
  rationale: மறுப்பைத் தொடர்ந்து வரும் திருத்தம் அல்லது விளக்கத்தை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: שַׂר
  choice: படைத்தலைவர்
  rationale: צְבָא என்ற இராணுவச் சூழலில் அதிகாரமுள்ள தலைவரைத் தெளிவாகவும் இயல்பாகவும் குறிக்கிறது.
- source_word: צְבָא יְהוָה
  choice: யெகோவாவின் படை
  rationale: צָבָא என்பதன் இராணுவப் பொருளை நவீன தமிழில் தெளிவாகக் காக்கிறது; யெகோவா என்ற திருப்பெயரையும் நேரடியாகத் தருகிறது.
- source_word: עַתָּה בָאתִי
  choice: நான் இப்போது ... வந்திருக்கிறேன்
  rationale: வருகை நிறைவுற்றும் அதன் நிகழ்காலப் பொருத்தம் தொடர்வதையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: פָּנָיו אַרצה
  choice: முகங்குப்புறத் தரையில்
  rationale: முகம் தரையை நோக்கிய முழுப் பணிவின் உடல் நிலையைச் சுருக்கமாகவும் தெளிவாகவும் காட்டுகிறது.
- source_word: וַיִּשְׁתָּחוּ
  choice: பணிந்துகொண்டு
  rationale: வணக்கமாகத் தாழ்ந்து பணியும் செயலைக் காட்டுகிறது; இதைத் தனிப்படையாக இறைவழிபாடு என்று தீர்மானிக்கவில்லை.
- source_word: אֲדֹנִי
  choice: என் ஆண்டவர்
  rationale: முதல் நபர் உரிமை விகுதியுடன் வரும் மரியாதையான நேரடி அழைப்பைத் தருகிறது; அந்த நபரின் இயல்பை மொழிபெயர்ப்பிலேயே முடிவுசெய்யவில்லை.
- source_word: מְדַבֵּר אֶל עַבְדּוֹ
  choice: தமது அடியேனிடம் என்ன சொல்கிறார்
  rationale: உடனடி உரையாடலையும் யோசுவாவின் தாழ்மையான சுயக்குறிப்பையும் இயல்பான மரியாதைத் தமிழில் காக்கிறது.
theological_decisions:
- issue: யோசுவாவின் செயலை வெளிப்படையாக இறைவழிபாடு என்று மொழிபெயர்க்க வேண்டுமா
  choice: முதன்மை உரையில் ‘பணிந்துகொண்டு’ என்று மொழிபெயர்த்தல்
  alternative: ‘வழிபட்டு’ என்று மொழிபெயர்த்தல்
  rationale: שחה என்பது மரியாதையுடன் பணிவதையோ சில சூழல்களில் வழிபடுவதையோ குறிக்கலாம். இந்த வசனம் மட்டும் அந்த நபரின் அடையாளத்தையோ செயலின் துல்லியமான இறையியல் தன்மையையோ முடிவாக நிர்ணயிக்காததால், உடல் செயலைக் காத்து விளக்கத் திறந்துவைக்கப்படுகிறது.
- issue: பேசுகிறவரை ஒரு குறிப்பிட்ட தெய்வீக அல்லது தேவதூத உருவாக அடையாளப்படுத்த வேண்டுமா
  choice: ‘யெகோவாவின் படைத்தலைவர்’ என்ற எபிரெயத் தலைப்பை மட்டுமே தருதல்
  alternative: தேவதூதர், இறைத்தோற்றம், அல்லது கிறிஸ்துவின் முன்தோற்றம் எனக் குறிப்புணர்த்துதல்
  rationale: இந்த வசனத்தின் எபிரெய உரை அந்த நபருக்கு இத்தலைப்பைக் கொடுக்கிறது; ஆனால் அவரது இயல்பை வெளிப்படையாகத் தீர்மானிப்பதில்லை. ஆகவே மொழிபெயர்ப்பு உரைக்குள் அடங்கியதாகவே உள்ளது.
translation_notes:
  register: நவீன நிலையான, கண்ணியமான தமிழ். ‘அடியேன்’ என்பது யோசுவாவின் தாழ்மையான பணியாளர் மொழியை இயல்பாகக் காக்கிறது. தெய்வப் பெயர் יְהוָה ‘யெகோவா’ என ஒலிபெயர்க்கப்பட்டுள்ளது; பேசியவரின் இயல்பு மொழிபெயர்ப்பால் கூடுதலாக வரையறுக்கப்படவில்லை.
