base_translation:
  language: en
  yaml_path: translation/ot/joshua/005/004.yaml
  text: 'And this is the reason why Joshua circumcised them: all the people who came out of Egypt[a], the males, all the men of war[b], had died in the wilderness on the way after they came out of Egypt.'
translation:
  language: ta
  text: யோசுவா அவர்களுக்கு விருத்தசேதனம் செய்ததற்கான காரணம் இதுதான்:[a] எகிப்திலிருந்து புறப்பட்டு வந்த மக்களாகிய ஆண்களான போர்வீரர்கள்[b] அனைவரும், எகிப்திலிருந்து புறப்பட்ட பின்பு வனாந்தரத்தில் வழியிலே இறந்திருந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'இதை இன்னும் சொற்படியாக, “யோசுவா விருத்தசேதனம் செய்த காரியம் இதுதான்: எகிப்திலிருந்து புறப்பட்டு வந்த மக்கள் அனைவரும்…” என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொற்றொடர் இங்கு யோசுவாவின் செயலுக்கான காரணத்தை அறிமுகப்படுத்துகிறது.'
    reason: lexical_alternative
  - marker: b
    text: “போர்வீரர்கள்” என்பதை “போரிடும் ஆண்கள்” அல்லது “போர் மனிதர்கள்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזֶה הַדָּבָר אֲשֶׁר מָל יְהוֹשֻׁעַ
  choice: யோசுவா அவர்களுக்கு விருத்தசேதனம் செய்ததற்கான காரணம் இதுதான்
  rationale: எபிரெய மொழியின் சொற்படியான ‘யோசுவா விருத்தசேதனம் செய்த காரியம் இதுதான்’ என்ற அமைப்பு, இச்சூழலில் அவரது செயலுக்கான விளக்கத்தை அறிமுகப்படுத்துகிறது. இயல்பான தமிழில் அதன் விளக்கப் பொருளைத் தெளிவாகக் காட்டுகிறது.
- source_word: מָל
  choice: விருத்தசேதனம் செய்தார்
  rationale: மூல வினையின் துல்லியமான, பொதுவாகப் புரிந்துகொள்ளப்படும் வேதாகமத் தமிழ் இணை.
- source_word: כָּל הָעָם הַיֹּצֵא מִמִּצְרַיִם הַזְּכָרִים
  choice: எகிப்திலிருந்து புறப்பட்டு வந்த மக்களில் ஆண்களான
  rationale: הַזְּכָרִים என்பது பாலினத்தை வெளிப்படையாகக் குறிக்கிறது. தமிழில் தொடரின் உறவை இயல்பாக்க ‘மக்களில் ஆண்களான’ என அமைக்கப்பட்டுள்ளது.
- source_word: כֹּל אַנְשֵׁי הַמִּלְחָמָה
  choice: போர்வீரர்கள் அனைவரும்
  rationale: இராணுவ அடையாளத்தைத் தெளிவாகவும் இயல்பான நவீன தமிழிலும் தருகிறது; சொற்படியான ‘போரின் மனிதர்கள்’ என்பதைவிட வாசிக்க எளிது.
- source_word: מֵתוּ בַמִּדְבָּר בַּדֶּרֶךְ
  choice: வழியில் வனாந்தரத்தில் இறந்துபோயிருந்தார்கள்
  rationale: விருத்தசேதன நிகழ்வுக்கு முன்பே மரணம் நிகழ்ந்ததை ‘இறந்துபோயிருந்தார்கள்’ காட்டுகிறது. בַּדֶּרֶךְ பயணத்தின் போதைய ‘வழியில்’ என்ற பொருளில் தரப்பட்டுள்ளது.
- source_word: בְּצֵאתָם מִמִּצְרָיִם
  choice: எகிப்திலிருந்து புறப்பட்ட பின்பு
  rationale: எகிப்திலிருந்து வெளியேறியதைத் தொடர்ந்து பயணத்தில் அவர்கள் இறந்தனர் என்ற காலத் தொடர்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: הַזְּכָרִים மற்றும் אַנְשֵׁי הַמִּלְחָמָה ஆகியவற்றின் தொடர்பு
  choice: ‘ஆண்களான போர்வீரர்கள் அனைவரும்’—போர்வீரர்களை ஆண் மக்களுக்குள் அடையாளப்படுத்துதல்
  alternative: ‘ஆண்கள் அனைவரும், போர்வீரர்கள் அனைவரும்’ என இரண்டு தனிக் குழுக்கள்போல் அமைத்தல்
  rationale: எபிரெய தொடரில் ‘ஆண்கள்’ என்பதைக் ‘போர்வீரர்கள் அனைவரும்’ மேலும் குறிப்பதாகப் புரிந்துகொள்வது இலக்கணத்துக்கும் அடுத்த வசனத்தின் விளக்கத்துக்கும் ஏற்றது; தனித்தனி குழுக்களாகத் தவறாக உணர்த்துவதைத் தவிர்க்கிறது.
