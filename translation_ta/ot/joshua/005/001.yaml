  alternative: அவர்கள் கடந்துசெல்லும்வரை
  rationale: WLC மெய்யெழுத்து வடிவம் முதலாம் நபர் பன்மையை ஆதரிக்கிறது; மூன்றாம் நபர் வாசகம் முக்கியமான பாடவேறுபாடாக அடிக்குறிப்பில் தரப்படுகிறது.
- issue: בְנֵי יִשְׂרָאֵל என்ற தேசியச் சொற்றொடர்
  choice: இஸ்ரவேலின் மக்கள்
  alternative: இஸ்ரவேலின் புதல்வர்கள்
  rationale: இது முழு தேசியக் கூட்டத்தையும் குறிக்கும் வழக்குச் சொற்றொடர்; பாலினத்தைத் தவறாக விரிவுபடுத்தாமல் தமிழில் இயல்பாகத் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; கண்ணியமான வேதாகம நடை, ஆனால் பழமையான வாக்கிய அமைப்புகள் தவிர்க்கப்பட்டுள்ளன. நீண்ட எபிரேய வாக்கியத்தின் தொடர்புகள் தமிழில் தெளிவாக வைக்கப்பட்டுள்ளன. அடிக்குறி சுட்டிகள் தொடர்புடைய கூற்றுக்குப் பின் ஒன்றாக அமைக்கப்பட்டுள்ளன.
