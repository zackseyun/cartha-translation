base_translation:
  language: en
  yaml_path: translation/ot/joshua/005/001.yaml
  text: And it happened[a], when all the kings of the Amorites who were beyond the Jordan to the west, and all the kings of the Canaanites who were by the sea, heard that Yahweh had dried up the waters of the Jordan before the sons of Israel until we had crossed over, their heart melted[c][b], and there was no longer spirit in them because of the sons of Israel.
translation:
  language: ta
  text: யோர்தானுக்கு அப்பால் மேற்கே இருந்த எமோரியரின் அரசர்கள் அனைவரும், கடலோரத்தில்[a] இருந்த கானானியரின் அரசர்கள் அனைவரும், நாங்கள் கடந்துசெல்லும்வரை[b] யாவே யோர்தானின் நீரை இஸ்ரவேல் மக்களுக்கு முன்பாக வற்றச்செய்தார் என்பதைக் கேள்விப்பட்டபோது, அவர்களுடைய உள்ளம் கரைந்துபோனது[c]; இஸ்ரவேல் மக்களினால் அவர்களுக்குள் துணிவு சிறிதும் எஞ்சியிருக்கவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “கடலோரத்தில்” என்பது சொற்பட “கடலருகே”; இங்கு மத்தியதரைக் கடற்கரைப் பகுதி குறிக்கப்படுகிறது.
    reason: lexical_alternative
  - marker: b
    text: மசோரா மெய்யெழுத்து வாசகம் “நாங்கள் கடந்துசெல்லும்வரை” என உள்ளது. சில கையெழுத்துப் பிரதிகளும் பழங்கால மொழிபெயர்ப்புகளும் “அவர்கள் கடந்துசெல்லும்வரை” என வாசிக்கின்றன.
    reason: textual_variant
  - marker: c
    text: “அவர்களுடைய உள்ளம் கரைந்துபோனது” என்பது அவர்கள் பயத்தால் துணிவையும் மனவுறுதியையும் இழந்தார்கள் என்று பொருள்படும் எபிரேய உருவகம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִשְׁמֹעַ
  choice: கேள்விப்பட்டபோது
  rationale: வசனத்தின் காலச் சூழலை இயல்பான தமிழில் தெரிவிக்கிறது; தொடக்கத்திலுள்ள எபிரேயக் கதை இணைப்பை தனியாக மொழிபெயர்ப்பது தமிழில் தேவையற்றதாக இருக்கும்.
- source_word: בְּעֵבֶר הַיַּרְדֵּן יָמָּה
  choice: யோர்தானுக்கு அப்பால் மேற்கே
  rationale: עֵבֶר என்பதின் ‘அப்பால்’ என்ற இடப்பொருளையும் יָמָּה என்பதின் மேற்கு நோக்கிய திசையையும் காக்கிறது.
- source_word: אֲשֶׁר עַל הַיָּם
  choice: கடலோரத்தில் இருந்த
  rationale: சொல்லுக்கு நெருக்கமான ‘கடலருகே’ என்பதைக் காட்டிலும் இங்கு குறிக்கப்படும் கடற்கரைப் பகுதியைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: הוֹבִישׁ
  choice: வற்றச் செய்தார்
  rationale: יבש என்பதன் ஹிப்ஃபில் வடிவிலுள்ள காரணவினைப் பொருளைத் துல்லியமாகக் காக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைப்பெயராகிய நான்கு எழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் மக்கள்
  rationale: தேசிய-குடும்ப அடையாளத்தை இயல்பான நவீனத் தமிழில் தருகிறது; சூழலில் முழு இஸ்ரவேல் மக்களையும் குறிக்கிறது.
- source_word: עַד עברנו
  choice: இஸ்ரவேலின் மக்களாகிய நாங்கள் கடந்துசெல்லும்வரை
  rationale: மசோரா மெய்யெழுத்து வாசகத்தின் முதலாம் நபர் பன்மையைத் தக்கவைத்தபடி, ‘நாங்கள்’ யாரைக் குறிக்கிறது என்பதைத் தமிழில் தெளிவாக்குகிறது.
- source_word: וַיִּמַּס לְבָבָם
  choice: அவர்களுடைய உள்ளம் கரைந்துபோனது
  rationale: எபிரேயத்தின் ஒருமைத் தொகுப்பையும் ‘கரைதல்’ என்ற பய உருவகத்தையும் காக்கிறது.
- source_word: וְלֹא הָיָה בָם עוֹד רוּחַ
  choice: அவர்களுக்குள் துணிவு சிறிதும் எஞ்சியிருக்கவில்லை
  rationale: רוּחַ இங்கு உயிர்மூச்சை அல்ல, மனத்துணிவையும் உறுதியையும் குறிக்கும் மரபுத்தொடர்; அதன் சூழல்பொருளை இயல்பான தமிழில் தெரிவிக்கிறது.
