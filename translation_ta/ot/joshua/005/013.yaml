  text: וַ/יְהִ֗י בִּֽ/הְי֣וֹת יְהוֹשֻׁעַ֮ בִּ/ירִיחוֹ֒ וַ/יִּשָּׂ֤א עֵינָי/ו֙ וַ/יַּ֔רְא וְ/הִנֵּה אִישׁ֙ עֹמֵ֣ד לְ/נֶגְדּ֔/וֹ וְ/חַרְבּ֥/וֹ שְׁלוּפָ֖ה בְּ/יָד֑/וֹ וַ/יֵּ֨לֶךְ יְהוֹשֻׁ֤עַ אֵלָי/ו֙ וַ/יֹּ֣אמֶר ל֔/וֹ הֲ/לָ֥/נוּ אַתָּ֖ה אִם לְ/צָרֵֽי/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/005/013.yaml
  text: And it happened[a], when Joshua was by Jericho, that he lifted up his eyes and looked, and behold, a man was standing opposite him with his sword drawn in his hand. Joshua went to him and said to him, “Are you for us, or for our enemies?”
translation:
  language: ta
  text: யோசுவா எரிகோவுக்கு அருகில்[a] இருந்தபோது, அவர் தம் கண்களை ஏறெடுத்துப் பார்த்தார். இதோ, ஒரு மனிதர் அவருக்கு எதிரே, உருவிய வாளைக் கையில் பிடித்தபடி நின்றுகொண்டிருந்தார். யோசுவா அவரிடம் சென்று, “நீர் எங்கள் பக்கமா, எங்கள் எதிரிகளின் பக்கமா?” என்று கேட்டார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘எரிகோவில்’ அல்லது ‘எரிகோவிடத்தில்’ என்றும் மொழிபெயர்க்கலாம். எபிரேய முன்னிடைச்சொல் நகரத்தின் துல்லியமான உட்பகுதியை மட்டும் குறிக்காமல், பொதுவான இடத் தொடர்பையும் குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בִּהְיוֹת
  choice: இருந்தபோது
  rationale: היה என்பதன் கதைத் தொடர் வடிவமும் ב உடன் வரும் infinitive construct-உம் சேர்ந்து காலச் சூழலை அறிமுகப்படுத்துகின்றன. தனியாக ‘அப்போது நிகழ்ந்தது’ என்று கூறுவது தமிழில் தேவையற்றதாக இருப்பதால், இயல்பான காலத் தொடராக மொழிபெயர்க்கப்பட்டது.
- source_word: בִּירִיחוֹ
  choice: எரிகோவுக்கு அருகில்
  rationale: ב என்ற முன்னிடைச்சொல் இங்கு ‘உள்ளே’ என்று துல்லியமாகக் கட்டுப்படுத்தாமல் பொதுவான இடத் தொடர்பைக் குறிக்கலாம். இராணுவச் சூழலில் ‘அருகில்’ என்பது இயல்பானது; ஆயினும் மூலத்தின் இடவியல் நெகிழ்வை அடிக்குறிப்பு தெரிவிக்கிறது.
- source_word: וַיִּשָּׂא עֵינָיו וַיַּרְא
  choice: தம் கண்களை ஏறெடுத்துப் பார்த்தார்
  rationale: எபிரேய மொழியின் இரு பார்வை வினைகளையும் தமிழில் இயல்பான ஒருங்கிணைந்த சொற்றொடராகக் கொடுத்து, பார்வையை உயர்த்திய காட்சித்தன்மையைப் பாதுகாக்கிறது.
- source_word: וְהִנֵּה
  choice: இதோ
  rationale: திடீரென கவனத்துக்குக் கொண்டுவரும் மூலத் துகளின் உயிரோட்டத்தையும் கதைநடை வலியுறுத்தலையும் காக்கிறது.
- source_word: אִישׁ
  choice: ஒரு மனிதர்
  rationale: மூலம் அந்த உருவத்தை இவ்வசனத்தில் ‘மனிதன்’ என்றே அறிமுகப்படுத்துகிறது. தூதர் அல்லது தெய்வத் தோற்றம் என முன்கூட்டியே அடையாளப்படுத்தவில்லை.
- source_word: עֹמֵד לְנֶגְדּוֹ
  choice: அவருக்கு எதிரே ... நின்றுகொண்டிருந்தார்
  rationale: לְנֶגֶד குறிக்கும் நேரெதிர் இடநிலையையும் இச்சூழலின் எதிர்கொள்ளும் தன்மையையும் வெளிப்படுத்துகிறது.
- source_word: וְחַרְבּוֹ שְׁלוּפָה בְּיָדוֹ
  choice: உருவிய வாளைக் கையில் பிடித்தபடி
  rationale: שְׁלוּפָה என்பது உறையிலிருந்து உருவப்பட்ட அல்லது எடுக்கப்பட்ட நிலையைச் சுட்டுகிறது. தமிழ் கதைநடையில் இயல்பாகவும் தெளிவாகவும் அச்சுறுத்தும் தோற்றத்தை அளிக்கிறது.
- source_word: וַיֵּלֶךְ יְהוֹשֻׁעַ אֵלָיו
  choice: யோசுவா அவரிடம் சென்று
  rationale: அந்த மனிதரை நோக்கி யோசுவா நகர்ந்ததை எளிமையாகவும் மூலத்திற்கு நெருக்கமாகவும் காட்டுகிறது.
- source_word: הֲלָנוּ אַתָּה אִם לְצָרֵינוּ
  choice: நீர் எங்கள் பக்கமா, எங்கள் எதிரிகளின் பக்கமா?
  rationale: ל இங்கு சார்பு அல்லது அணிச்சேர்க்கையைக் குறிக்கிறது. ‘பக்கம்’ என்ற சொல் இராணுவச் சூழலில் இயல்பாக அந்தக் கேள்வியைத் தருகிறது.
theological_decisions:
- issue: யோசுவா சந்தித்த ‘மனிதரின்’ அடையாளம்
  choice: முதன்மை உரையில் ‘ஒரு மனிதர்’ என்று நடுநிலையாக மொழிபெயர்த்தல்
  alternative: ஒரு தேவதூதர்; யெகோவாவின் தூதர்; இறைத்தோற்றம் அல்லது கிறிஸ்துவின் முன்தோற்றம்
  rationale: இவ்வசனம் அவரை אִישׁ, ‘ஒரு மனிதர்,’ என்று மட்டுமே அறிமுகப்படுத்துகிறது. பின்வரும் சூழல் பல்வேறு இறையியல் விளக்கங்களுக்கு வழிவகுக்கலாம்; ஆனால் இவ்வசனத்தின் மொழிபெயர்ப்பு அந்த அடையாளத்தை முன்கூட்டியே தீர்மானிக்கக் கூடாது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. மரியாதை ஒருமை வடிவங்கள் தொடர்ச்சியாகப் பேணப்பட்டுள்ளன; மூலத்தில் வெளிப்படையாக இல்லாத இறையியல் அடையாளம் சேர்க்கப்படவில்லை.
