  text: And when all the nation had finished being circumcised[a], they remained in their places in the camp until they recovered.
translation:
  language: ta
  text: மக்கள் அனைவருக்கும் விருத்தசேதனம் செய்யப்பட்டு முடிந்தபின், அவர்கள் குணமடையும் வரை முகாமில் அவர்கள் இருந்த இடங்களிலேயே தங்கியிருந்தார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்கள் நலம்பெறும் வரை” அல்லது “அவர்கள் மீண்டும் வலிமைபெறும் வரை.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר
  choice: செய்து முடித்தபின்
  rationale: எபிரேயக் கதைத் தொடரின் கால உறவை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது; தனியே மொழிபெயர்த்தால் ஏற்படும் செயற்கையான ‘அப்போது நிகழ்ந்தது’ என்ற நடையைத் தவிர்க்கிறது.
- source_word: תַּמּוּ כָל הַגּוֹי לְהִמּוֹל
  choice: மக்கள் அனைவருக்கும் விருத்தசேதனம் செய்து முடித்தபின்
  rationale: கூட்டாகிய இஸ்ரவேல் மக்கள் முழுவதும் விருத்தசேதனம் பெற்ற செயல் நிறைவடைந்ததைத் தமிழில் தெளிவாகக் கூறுகிறது. எபிரேய நிபால் வடிவின் பொருளை ‘அனைவருக்கும் ... செய்து’ என்ற இயல்பான கட்டமைப்பு தருகிறது.
- source_word: וַיֵּשְׁבוּ
  choice: தங்கியிருந்தார்கள்
  rationale: சொல்லுக்கு ‘உட்கார்ந்தார்கள்’ என்றும் பொருள் இருக்கலாம்; இங்கு அறுவைச் செயலுக்குப் பின் தொடர்ந்து முகாமில் இருந்ததையே சூழல் குறிக்கிறது.
- source_word: תַחְתָּם
  choice: தங்கள் தங்கள் இடங்களிலேயே
  rationale: சொற்படியான ‘தங்களுக்குக் கீழே’ என்பது இங்கு பொருந்தாது; இருந்த இடத்தைவிட்டு நகராமல் இருந்தார்கள் என்ற எபிரேய மரபுத்தொடரின் பொருளை இது இயல்பாக அளிக்கிறது.
- source_word: בַּמַּחֲנֶה
  choice: முகாமில்
  rationale: இடத்தைக் குறிக்கும் முன்னிடைச்சொல் தொடரின் நேரான, இயல்பான மொழிபெயர்ப்பு.
- source_word: עַד חֲיוֹתָם
  choice: அவர்கள் குணமடையும் வரை
  rationale: חיה என்ற வினை இச்சூழலில் உடல்நலமும் வலிமையும் மீளுவதைச் சுட்டுகிறது; ‘குணமடையும்’ என்பது நவீனத் தமிழில் தெளிவான சூழல்சார் மொழிபெயர்ப்பு.
