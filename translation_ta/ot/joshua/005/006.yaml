  text: כִּ֣י אַרְבָּעִ֣ים שָׁנָ֗ה הָלְכ֣וּ בְנֵֽי יִשְׂרָאֵל֮ בַּ/מִּדְבָּר֒ עַד תֹּ֨ם כָּל הַ/גּ֜וֹי אַנְשֵׁ֤י הַ/מִּלְחָמָה֙ הַ/יֹּצְאִ֣ים מִ/מִּצְרַ֔יִם אֲשֶׁ֥ר לֹֽא שָׁמְע֖וּ בְּ/ק֣וֹל יְהוָ֑ה אֲשֶׁ֨ר נִשְׁבַּ֤ע יְהוָה֙ לָ/הֶ֔ם לְ/בִלְתִּ֞י הַרְאוֹתָ֣/ם אֶת הָ/אָ֗רֶץ אֲשֶׁר֩ נִשְׁבַּ֨ע יְהוָ֤ה לַֽ/אֲבוֹתָ/ם֙ לָ֣/תֶת לָ֔/נוּ אֶ֛רֶץ זָבַ֥ת חָלָ֖ב וּ/דְבָֽשׁ׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/005/006.yaml
  text: For the sons of Israel had walked in the wilderness forty years[a], until all the nation—the men of war who came out of Egypt—had come to an end, because they had not listened to the voice of Yahweh. Yahweh had sworn to them that he would not let them see the land that Yahweh had sworn to their fathers to give to us, a land flowing with milk and honey.
translation:
  language: ta
  text: ஏனெனில், இஸ்ரவேல் மக்கள் வனாந்தரத்தில் நாற்பது ஆண்டுகள் நடந்தார்கள்; எகிப்திலிருந்து வெளியேறிய போர்வீரர்களாகிய அந்த மக்கள் அனைவரும் முடிவுறும்வரை. அவர்கள் யாவேயின் குரலுக்குச் செவிகொடுக்கவில்லை; ஆகவே, யாவே அவர்களுக்கு, அவர்கள் அந்த நாட்டைக் காணவிடமாட்டேன் என்று சத்தியம் செய்திருந்தார். அந்த நாடு, யாவே அவர்களுடைய பிதாக்களுக்கு எங்களுக்குக் கொடுப்பதாகச் சத்தியம் செய்திருந்த பாலும் தேனும் வழிந்தோடும் நாடாகும்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரெய மூலப்பாடம்: “எங்களுக்குக் கொடுப்பதாக”; சில பழங்கால மொழிபெயர்ப்புகளும் பிற மொழிபெயர்ப்புகளும் “அவர்களுக்குக் கொடுப்பதாக” என வாசிக்கின்றன.'
    reason: textual_variant
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய வசனத்திற்கான விளக்கத்தை அறிமுகப்படுத்தும் காரணப்பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: הָלְכוּ ... בַּמִּדְבָּר
  choice: வனாந்தரத்தில் நடந்துதிரிந்தார்கள்
  rationale: הלך என்பதன் நடை/செலவு உருவகத்தையும், நீண்டகால வனாந்தர அலைச்சலின் சூழலையும் இயல்பாகப் பாதுகாக்கிறது.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்கள்
  rationale: சொல்லுக்குச் சொல் 'இஸ்ரவேலின் மகன்கள்' என்பதைவிட நவீனத் தமிழில் இயல்பாகவும், இங்கு குறிக்கப்படும் சமூகத்தைக் தெளிவாகவும் வழங்குகிறது.
- source_word: עַד תֹּם כָּל הַגּוֹי אַנְשֵׁי הַמִּלְחָמָה
  choice: போர்வீரர்களான அந்த மக்கள் அனைவரும் முற்றிலும் இல்லாமற்போகும்வரை
  rationale: תֹּם என்பதன் முடிவுறுதல் என்ற பொருளைப் பாதுகாக்கிறது; மரணத்தை நேரடியாகச் சேர்த்து மூலத்தின் சொல்லாட்சியை மிகையாக விளக்கவில்லை.
- source_word: לֹא שָׁמְעוּ בְּקוֹל יְהוָה
  choice: யாவேயின் குரலுக்குச் செவிகொடுக்கவில்லை
  rationale: கேட்டல் மற்றும் கீழ்ப்படிதல் இரண்டையும் உள்ளடக்கும் எபிரெய மரபுத்தொடரின் செவியுணர்வு உருவகத்தைப் பாதுகாக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: திருநாமத்தைப் பொதுப்பட்டப் பெயராக மாற்றாமல், எபிரெய நான்கெழுத்துத் திருநாமத்தின் வழக்கமான ஒலிப்பெயர்ப்பாக வழங்குகிறது.
- source_word: לְבִלְתִּי הַרְאוֹתָם
  choice: அவர்கள் காண அனுமதிக்கமாட்டேன்
  rationale: ראה என்பதன் காரணவினைப் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: אֶרֶץ זָבַת חָלָב וּדְבָשׁ
  choice: பாலும் தேனும் வழிந்தோடும் நாடு
  rationale: உருவகத்தைப் பாதுகாக்கும் தெளிவான, மரியாதையான தமிழ் மரபுத்தொடர்.
theological_decisions:
- issue: יְהוָה என்ற திருநாமத்தின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலத்தில் நேரடியாக வரும் உடன்படிக்கைத் திருநாமத்தைப் பட்டப்பெயராக மாற்றாமல் ஒலிப்பெயர்க்கிறது.
- issue: לָנוּ என்பதிலுள்ள முதலாம் நபர் பன்மை
  choice: எங்களுக்குக் கொடுப்பதாக
  alternative: அவர்களுக்குக் கொடுப்பதாக
  rationale: மசோரா மூலப்பாடத்தின் முதலாம் நபர் பன்மையைத் திருத்திச் சீராக்காமல் பாதுகாக்கிறது; மாற்றுப் பாடம் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. நீண்ட எபிரெய வாக்கியம் தமிழின் வாசிப்புத் தெளிவுக்காகச் சில வாக்கியங்களாகப் பிரிக்கப்பட்டுள்ளது; மூலத்தின் காரணத் தொடர்பும் உடன்படிக்கைச் சொற்களும் பாதுகாக்கப்பட்டுள்ளன.
