revisions:
- from: இஸ்ரவேல் மக்கள் நாற்பது ஆண்டுகள் வனாந்தரத்தில் நடந்துதிரிந்தார்கள். எகிப்திலிருந்து புறப்பட்டுவந்த போர்வீரர்களான அந்த மக்கள் அனைவரும் முற்றிலும் இல்லாமற்போகும்வரை அவர்கள் அங்கேயே இருந்தார்கள். ஏனெனில், அவர்கள் யாவேயின் குரலுக்குச் செவிகொடுக்கவில்லை. அதனால், யாவே அவர்களுடைய முன்னோர்களுக்கு எங்களுக்குக் கொடுப்பதாக[a] ஆணையிட்டிருந்த பாலும் தேனும் வழிந்தோடும் நாட்டை அவர்கள் காண அனுமதிக்கமாட்டேன் என்று அவர்களுக்கு ஆணையிட்டார்.
