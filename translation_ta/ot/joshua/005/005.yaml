base_translation:
  language: en
  yaml_path: translation/ot/joshua/005/005.yaml
  text: For all the people who came out had been circumcised[a], but all the people born in the wilderness on the way as they came out from Egypt had not been circumcised.
translation:
  language: ta
  text: ஏனெனில், எகிப்திலிருந்து வெளியேறிய மக்கள் அனைவரும் விருத்தசேதனம் செய்யப்பட்டிருந்தார்கள்; ஆனால் எகிப்திலிருந்து வெளியேறியபின் வனாந்தரப் பயணத்தில் பிறந்த மக்கள் அனைவருக்கும் விருத்தசேதனம் செய்யப்படவில்லை.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரெய மூலத்தை இன்னும் நேரடியாக மொழிபெயர்த்தால்: “அவர்களுக்கு விருத்தசேதனம் செய்யவில்லை.” செயலைச் செய்யாதவர்கள் யார் என்பது குறிப்பிடப்படவில்லை.'
    reason: மூலத்தில் உள்ள செயப்பாட்டு வினைக்கும் தமிழில் பயன்படுத்தப்பட்ட செயப்படுவினைக்கும் இடையிலான வேறுபாட்டையும், குறிப்பிடப்படாத செய்பவரையும் காட்டுகிறது.
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய வசனத்தில் கூறப்பட்ட செயலுக்கான விளக்கத்தை இச்சொல் அறிமுகப்படுத்துகிறது; தமிழில் உரையோட்டத்தை இயல்பாக இணைக்கிறது.
- source_word: מֻלִים הָיוּ
  choice: விருத்தசேதனம் செய்யப்பட்டிருந்தார்கள்
  rationale: היה என்பதுடன் வரும் செயல்பாட்டு நிலை, எகிப்திலிருந்து புறப்பட்டவர்கள் ஏற்கெனவே விருத்தசேதனம் செய்யப்பட்ட நிலையில் இருந்ததைச் சுட்டுகிறது.
- source_word: כָּל הָעָם
  choice: மக்கள் அனைவரும்
  rationale: மூலத்தின் கூட்டுப்பொருளைப் பாதுகாக்கிறது; சொற்களில் இல்லாத ‘ஆண்கள்’ என்ற குறுக்கத்தைச் சேர்க்கவில்லை.
- source_word: הַיֹּצְאִים
  choice: புறப்பட்டு வந்த மக்கள்
  rationale: எகிப்திலிருந்து வெளியேறிய தலைமுறையைக் குறிக்கும் பெயர்ச்சொல் சார்ந்த பங்கேற்புவினையை இயல்பான தமிழில் தருகிறது.
- source_word: וְכָל הָעָם הַיִּלֹּדִים
  choice: ஆனால் ... பிறந்த மக்கள் அனைவரும்
  rationale: וְ இங்கு இரு தலைமுறைகளுக்கிடையிலான முரண்பாட்டைக் குறிக்கிறது; ‘ஆனால்’ அதைத் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: בַּמִּדְבָּר
  choice: வனாந்தரத்தில்
  rationale: யாத்திரைப் பின்னணியிலுள்ள குடியிருப்பற்ற காட்டுப்பாலை நிலத்தைச் சுட்டும் மரியாதைமிக்க, பரவலாகப் புரியக்கூடிய தமிழ்ச் சொல்.
- source_word: בַּדֶּרֶךְ בְּצֵאתָם מִמִּצְרַיִם
  choice: எகிப்திலிருந்து புறப்பட்டு வந்த வழியில்
  rationale: எகிப்திலிருந்து வெளியேறிய பின்தொடர்ந்த பயணச் சூழலைச் சுருக்கமாகத் தருகிறது; பிறப்புகள் வெளியேறும் ஒரே தருணத்தில் நிகழ்ந்தன என்ற தவறான எண்ணத்தைத் தவிர்க்கிறது.
- source_word: לֹא מָלוּ
  choice: விருத்தசேதனம் செய்யப்படவில்லை
  rationale: எபிரெயத்தில் வினை செயப்பாட்டு வடிவில் இருந்தாலும் செய்பவர் குறிப்பிடப்படவில்லை; சூழலில் மக்களின் விருத்தசேதனம் செய்யப்படாத நிலையையே முன்னிறுத்துவதால் தமிழில் செயப்பாட்டு வடிவம் இயல்பாக உள்ளது.
theological_decisions:
- issue: ‘மக்கள் அனைவரும்’ என்பது சொற்பட பெண்களையும் உள்ளடக்குகிறதா என்ற சாத்தியம்
  choice: மூலத்தில் உள்ள கூட்டுப்பெயரான ‘மக்கள்’ என்பதையே வைத்தல்
  alternative: ‘ஆண்கள் அனைவரும்’ என்று மொழிபெயர்த்தல்
  rationale: விருத்தசேதனம் ஆண்களுக்குரியது என்பது சூழலால் தெளிவாக இருந்தாலும், எபிரெய மூலத்தில் עָם என்ற கூட்டுப்பெயரே உள்ளது; ஆகவே மூலத்தைவிடக் குறுகிய சொல்லை உரையில் சேர்க்கவில்லை.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் மரியாதைமிக்க நடையைப் பயன்படுத்துகிறது. ‘விருத்தசேதனம்’ மற்றும் ‘வனாந்தரம்’ ஆகியவை தமிழ்ச் வேதாகமப் பயன்பாட்டில் அறிமுகமான சொற்களாக இருப்பதுடன் இச்சூழலில் துல்லியத்தையும் காக்கின்றன.
