base_translation:
  language: en
  yaml_path: translation/ot/joshua/005/003.yaml
  text: So Joshua made for himself flint knives and circumcised the sons of Israel at Gibeath-haaraloth[a][b][c].
translation:
  language: ta
  text: அப்போது யோசுவா தனக்காகச் சிக்கிமுக்கிக் கல் கத்திகளை[a] செய்து, கிபியாத்-ஹஆரலோத்தில்[c] இஸ்ரவேலின் மகன்களுக்கு[b] விருத்தசேதனம் செய்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சிக்கிமுக்கிக் கல் வாள்கள்/வெட்டுக் கருவிகள்.” இங்கு “கத்திகள்” என மொழிபெயர்க்கப்பட்ட எபிரெயச் சொல் பொதுவாக “வாள்” என்றும் பொருள்படும்; இந்தச் சூழலில் அது விருத்தசேதனத்திற்குப் பயன்படுத்தப்பட்ட வெட்டுக் கருவிகளைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில், “இஸ்ரவேலின் மகன்கள்”; இதை “இஸ்ரவேலர்கள்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: “கிபியாத்-ஹஆரலோத்” என்ற எபிரெய இடப்பெயரின் பொருள் “முன்தோல்களின் குன்று.”
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעַשׂ לּוֹ
  choice: தனக்காக ... செய்து
  rationale: עשה என்பது இங்கு ‘செய்தல்/உருவாக்குதல்’ என்றும், לו சூழலில் யோசுவாவையே சுட்டும் தன்னிலைப் பொருளில் ‘தனக்காக’ என்றும் இயல்பாகப் பொருள்படுகிறது.
- source_word: חַרְבוֹת צֻרִים
  choice: சிக்கிமுக்கிக் கல் கத்திகள்
  rationale: חֶרֶב பொதுவாக ‘வாள்’ எனப் பொருள்படலாம்; ஆனால் விருத்தசேதனச் சூழலில் வெட்டும் கருவிகளான ‘கத்திகள்’ என்பதே தெளிவு. צֻרִים அவை கல்லால், குறிப்பாக flint வகைக் கல்லால் செய்யப்பட்டவை என்பதைக் குறிக்கிறது.
- source_word: וַיָּמָל
  choice: விருத்தசேதனம் செய்தான்
  rationale: מול என்பதன் நேரடியான பொருள் ‘விருத்தசேதனம் செய்தல்’; நவீன தரத் தமிழில் துல்லியமான, மரியாதையான சொற்றொடர் பயன்படுத்தப்பட்டது.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் மகன்கள்
  rationale: எபிரெயச் சொற்றொடரின் வெளிப்படையான ஆண்பால் பன்மை வடிவத்தைப் பாதுகாக்கிறது; இங்கு விருத்தசேதனம் பெறும் ஆண்களைக் குறிக்கிறது.
- source_word: אֶל גִּבְעַת הָעֲרָלוֹת
  choice: கிபியாத்-ஆரலோத்தில்
  rationale: אֶל இச்சூழலில் நிகழ்வு நடந்த இடத்தைக் குறிக்கும் தமிழின் ‘-இல்’ வேற்றுமையால் இயல்பாக மொழிபெயர்க்கப்பட்டது. இடப்பெயர் ஒலிபெயர்க்கப்பட்டு, அதன் வெளிப்படையான எபிரெயப் பொருள் அடிக்குறிப்பில் தரப்பட்டது.
