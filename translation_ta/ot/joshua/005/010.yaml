  text: וַ/יַּחֲנ֥וּ בְנֵֽי יִשְׂרָאֵ֖ל בַּ/גִּלְגָּ֑ל וַ/יַּעֲשׂ֣וּ אֶת הַ/פֶּ֡סַח בְּ/אַרְבָּעָה֩ עָשָׂ֨ר י֥וֹם לַ/חֹ֛דֶשׁ בָּ/עֶ֖רֶב בְּ/עַֽרְב֥וֹת יְרִיחֽוֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/005/010.yaml
  text: And the sons of Israel camped at Gilgal[a], and they kept the Passover on the fourteenth day of the month, in the evening, on the plains of Jericho.
translation:
  language: ta
  text: இஸ்ரவேலின் மகன்கள் கில்காலில் முகாமிட்டார்கள்[a]. அந்த மாதத்தின் பதினான்காம் நாள் மாலையில், எரிகோவின் சமவெளிகளில் பஸ்காவைக் கொண்டாடினார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘இஸ்ரவேலர்கள்’ அல்லது ‘இஸ்ரவேலின் பிள்ளைகள்.’ எபிரெய மொழியில் ‘இஸ்ரவேலின் மகன்கள்’ என்று உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּחֲנוּ
  choice: முகாமிட்டார்கள்
  rationale: חנה என்பது முகாமிடுதல் அல்லது தங்குவதற்காக முகாம் அமைத்தல் எனப் பொருள்படும். நவீனத் தமிழில் ‘முகாமிட்டார்கள்’ இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் மகன்கள்
  rationale: எபிரெயச் சொற்றொடரின் நேரடிப் பொருள் ‘இஸ்ரவேலின் மகன்கள்.’ அதன் குடும்ப உறவுச் சொல்லாக்கத்தையும் ஆண்பால் பன்மை வடிவத்தையும் தக்கவைக்கிறது.
- source_word: בַּגִּלְגָּל
  choice: கில்காலில்
  rationale: இடப்பெயருடன் வந்துள்ள முன்னிடைச்சொல்லைத் தமிழில் இயல்பான இடவேற்றுமையான ‘கில்காலில்’ என வழங்குகிறது.
- source_word: וַיַּעֲשׂוּ אֶת־הַפֶּסַח
  choice: பஸ்காவைக் கொண்டாடினார்கள்
  rationale: பஸ்காவுடன் עשה வருவது அதை அனுசரித்தல் அல்லது கொண்டாடுதல் என்னும் மரபுத்தொடர். ‘செய்தார்கள்’ என்ற சொற்சொல் மொழிபெயர்ப்பைவிட ‘கொண்டாடினார்கள்’ தமிழில் இயல்பாகப் பொருளைத் தெரிவிக்கிறது.
- source_word: הַפֶּסַח
  choice: பஸ்கா
  rationale: இந்த விழா மற்றும் பலியனுசரிப்பிற்குத் தமிழ்க் கிறிஸ்தவப் பயன்பாட்டில் பரவலாக அறியப்படும் பெயர் ‘பஸ்கா.’
- source_word: בְּאַרְבָּעָה עָשָׂר יוֹם לַחֹדֶשׁ
  choice: அந்த மாதத்தின் பதினான்காம் நாள்
  rationale: எபிரெய நாட்காட்டிக் குறிப்பைத் துல்லியமாகவும் இயல்பான தமிழிலும் தெரிவிக்கிறது.
- source_word: בָּעֶרֶב
  choice: மாலையில்
  rationale: இச்சூழலில் ערב அனுசரிப்பின் நேரத்தைக் குறிக்கிறது; ‘மாலையில்’ என்பது தெளிவான நவீனத் தமிழ்.
- source_word: בְּעַרְבוֹת יְרִיחוֹ
  choice: எரிகோவின் சமவெளிகளில்
  rationale: עַרְבוֹת என்பது சமவெளி அல்லது புல்வெளிப் பிரதேசங்களைக் குறிக்கும் பன்மை வடிவம். ‘சமவெளிகளில்’ பன்மையையும் புவியியல் தன்மையையும் தக்கவைக்கிறது.
theological_decisions:
- issue: בְנֵי יִשְׂרָאֵל என்பதன் மொழிபெயர்ப்பு
  choice: இஸ்ரவேலின் மகன்கள்
  alternative: இஸ்ரவேலர்கள்; இஸ்ரவேலின் பிள்ளைகள்
  rationale: இங்கு கோட்பாட்டுச் சர்ச்சை இல்லை. எனினும், எபிரெய மூலம் ஆண்பால் பன்மையிலும் குடும்ப உறவுச் சொல்லாக்கத்திலும் இருப்பதால், ‘இஸ்ரவேலின் மகன்கள்’ அதனை வெளிப்படையாகத் தக்கவைக்கிறது; இயல்பான மாற்றுகள் அடிக்குறிப்பில் தரப்படுகின்றன.
translation_notes:
  register: நவீன, தெளிவான, கண்ணியமான பொதுத் தமிழ் பயன்படுத்தப்பட்டுள்ளது. எபிரெயச் சொற்றொடரின் குடும்ப உறவுச் சொல்லாக்கம் முதன்மை உரையில் தக்கவைக்கப்பட்டு, இயல்பான தமிழ் மாற்றுகள் அடிக்குறிப்பில் வழங்கப்பட்டுள்ளன.
