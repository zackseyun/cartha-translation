  terminology: ‘பஸ்கா’ தமிழ்க் கிறிஸ்தவப் பயன்பாட்டில் அறியப்பட்ட, பொருத்தமான பெயராகும். ‘கில்கால்,’ ‘எரிகோ’ ஆகிய இடப்பெயர்கள் நிலையான தமிழ் எழுத்துமுறையுடன் வழங்கப்பட்டுள்ளன. அடிக்குறிப்பு மூலத்தின் சொற்சொல் வடிவத்தையும் இயல்பான மாற்றுகளையும் சரியாகக் குறிப்பிடுகிறது.
