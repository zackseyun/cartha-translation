source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל יְהוֹשֻׁ֔עַ הַ/יּ֗וֹם גַּלּ֛וֹתִי אֶת חֶרְפַּ֥ת מִצְרַ֖יִם מֵ/עֲלֵי/כֶ֑ם וַ/יִּקְרָ֞א שֵׁ֣ם הַ/מָּק֤וֹם הַ/הוּא֙ גִּלְגָּ֔ל עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/005/009.yaml
  text: And Yahweh said to Joshua[b][a], “Today I have rolled away the reproach of Egypt from upon you.” So the name of that place was called Gilgal to this day.
translation:
  language: ta
  text: யாவே யோசுவாவிடம், “இன்று எகிப்தின் அவமானத்தை[a] உங்கள் மேலிருந்து உருட்டி அகற்றிவிட்டேன்” என்றார். அதனால் அந்த இடத்திற்குக் கில்கால்[b] என்று பெயரிடப்பட்டது; அது இன்றுவரை கில்கால் என்று அழைக்கப்படுகிறது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “எகிப்தின் இழிவு,” “எகிப்து சுமத்திய பழி” என்றும் பொருள் கொள்ளலாம். இது இஸ்ரவேலர் எகிப்தில் அடைந்த அவமானத்தையோ, எகிப்தியரின் பழிச்சொல்லையோ, இப்போது நீக்கப்பட்ட உடன்படிக்கை சார்ந்த இழிவையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “கில்கால்” என்ற எபிரெயப் பெயர் “உருட்டி அகற்றினேன்” என்ற வினைச்சொல்லை ஒத்த ஓசையுடையது. இதனால் இந்தச் சொற்களுக்கிடையே ஒரு சொல் விளையாட்டு உருவாகிறது.
    reason: cultural_note
lexical_decisions:
- source_word: יְהוָה
  choice: யாவே
  rationale: தேவனுடைய தனிப்பெயரை அதன் எபிரெய ஒலிப்புக்கு நெருக்கமான, தமிழில் வாசிக்க இயல்பான வடிவில் எழுத்துப்பெயர்க்கிறது.
- source_word: גַּלּוֹתִי
  choice: உருட்டி அகற்றிவிட்டேன்
  rationale: גלל என்பதன் ‘உருட்டுதல்’ என்ற உருவகத்தைத் தக்கவைத்து, அகற்றப்பட்ட செயல் நிறைவுற்றதையும் தெளிவாக்குகிறது; மேலும் கில்கால் என்ற இடப்பெயருடனான சொல் விளையாட்டையும் ஓரளவு காக்கிறது.
- source_word: חֶרְפַּת מִצְרַיִם
  choice: எகிப்தின் அவமானத்தை
  rationale: חֶרְפָּה குறிக்கும் அவமானம், இழிவு, பழி ஆகிய பொருள் பரப்பை இயல்பான தமிழில் தருகிறது. ‘எகிப்தின்’ என்ற உடைமைத் தொடர்பை விளக்கிப் பொருள் கூறாமல் அப்படியே வைத்திருப்பதால் எபிரெய சொற்றொடரின் தெளிவின்மை பாதுகாக்கப்படுகிறது.
- source_word: מֵעֲלֵיכֶם
  choice: உங்கள்மேலிருந்து
  rationale: அவமானம் அவர்கள்மேல் இருந்தது போலவும் இப்போது அங்கிருந்து அகற்றப்பட்டது போலவும் அமைந்த மூல உருவகத்தைப் பாதுகாக்கிறது.
- source_word: וַיִּקְרָא שֵׁם הַמָּקוֹם הַהוּא גִּלְגָּל
  choice: அதனால் அந்த இடம் ... கில்கால் என்று அழைக்கப்படுகிறது
  rationale: பெயரிட்ட செயலின் விளைவை இயல்பான தமிழ் வினைமுறையில் தருகிறது; எபிரெயில் வெளிப்படையாகக் குறிப்பிடப்படாத செய்பவரைத் தேவையின்றி அடையாளப்படுத்துவதையும் தவிர்க்கிறது.
- source_word: גִּלְגָּל
  choice: கில்கால்
  rationale: இடப்பெயரை எபிரெய ஒலிப்புக்கு நெருக்கமாக எழுத்துப்பெயர்த்து, גלל என்ற வேருடனான ஒலித் தொடர்பை இயன்றவரை காக்கிறது.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: இன்றுவரை
  rationale: கதைசொல்லியின் காலநோக்கைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கும் நவீனத் தமிழ் வடிவம்.
theological_decisions:
- issue: ‘எகிப்தின் அவமானம்’ என்பதன் பொருள்
  choice: அது எகிப்தில் இஸ்ரவேலர் அடைந்த அவமானமா, எகிப்தியர் சுமத்திய பழியா, அல்லது உடன்படிக்கை அடையாளத்துடன் தொடர்புடைய இழிவா என்பதை முதன்மை உரை தீர்மானிக்காமல் விடுகிறது.
  alternative: அடிமைத்தனத்தின் அவமானம், எகிப்தியரின் பழிச்சொல், அல்லது விருத்தசேதனம் இல்லாதிருந்ததன் உடன்படிக்கை இழிவு என்று குறிப்பாக மொழிபெயர்த்தல்.
  rationale: חֶרְפַּת מִצְרַיִם என்ற எபிரெயத் தொடர் இவற்றில் ஒன்றை வெளிப்படையாகத் தேர்ந்தெடுக்கவில்லை; ஆகவே அதன் உண்மையான பொருள் திறப்பும் இறையியல் அழுத்தமும் பாதுகாக்கப்படுகின்றன.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியும் அதேவேளையில் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. ‘உருட்டி அகற்றிவிட்டேன்’ என்ற சற்று உருவகமிக்க சொற்றொடர் மூலத்தின் சொல் விளையாட்டைத் தக்கவைக்கிறது; செய்பவர் குறிப்பிடப்படாத பெயரிடும் கூற்று தமிழில் இயல்பான செயப்பாட்டு வடிவில் தரப்பட்டுள்ளது.
