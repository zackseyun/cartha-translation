base_translation:
  language: en
  yaml_path: translation/ot/joshua/005/007.yaml
  text: And Joshua circumcised their sons[a], whom he had raised up in their place, because they were uncircumcised, for they had not circumcised them on the way.
translation:
  language: ta
  text: அவர்களுக்குப் பதிலாக அவர் எழுப்பிய அவர்களுடைய மகன்களுக்கு[a] யோசுவா விருத்தசேதனம் செய்தார். ஏனெனில், அவர்கள் விருத்தசேதனம் செய்யப்படாதவர்களாக இருந்தார்கள்; வழியில் அவர்களுக்கு விருத்தசேதனம் செய்யவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்களுடைய இடத்தில்”; எபிரெயச் சொற்றொடர், இந்த மகன்கள் முந்தைய தலைமுறையினரின் இடத்தை ஏற்றதைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶת בְּנֵיהֶם
  choice: அவர்களுடைய மகன்களுக்கு
  rationale: விருத்தசேதனச் சூழலில் בְּנֵיהֶם ஆண் சந்ததியினரைக் குறிப்பதால், பொதுவான ‘பிள்ளைகள்’ என்பதற்குப் பதிலாக ‘மகன்கள்’ துல்லியமானது. தமிழில் ‘விருத்தசேதனம் செய்தார்’ என்பதோடு செயப்படுபொருளை இயல்பாக இணைக்க நான்காம் வேற்றுமை பயன்படுத்தப்பட்டுள்ளது.
- source_word: הֵקִים תַּחְתָּם
  choice: அவர்களுக்குப் பதிலாக அவர் எழும்பச் செய்த
  rationale: הֵקִים என்பதன் causative நுணுக்கத்தையும் תַּחְתָּם என்பதன் மாற்றீடு அல்லது தலைமுறைத் தொடர்ச்சி பொருளையும் காக்கிறது; ‘அவர்’ என்ற எழுவாய் எபிரெய உரையில் வெளிப்படையாகச் சொல்லப்படாமல் இருப்பதால் அதன் சுட்டு தெளிவின்மையும் அப்படியே விடப்படுகிறது.
- source_word: אֹתָם מָל יְהוֹשֻׁעַ
  choice: யோசுவா விருத்தசேதனம் செய்தார்
  rationale: מוּל என்பதற்கான நிலையான, கண்ணியமான தமிழ் வேதாகமச் சொல் ‘விருத்தசேதனம் செய்தல்’; செய்பவர் யோசுவா என்பதும் தெளிவாகக் காக்கப்படுகிறது.
- source_word: כִּי עֲרֵלִים הָיוּ
  choice: ஏனெனில், அவர்கள் விருத்தசேதனம் செய்யப்படாதவர்களாக இருந்தார்கள்
  rationale: முதல் כִּי காரணத்தைக் காட்டுகிறது. עֲרֵלִים இங்கு உருவகமல்ல, உடல்சார்ந்த உடன்படிக்கை அடையாளம் இல்லாத நிலையைக் குறிக்கிறது.
- source_word: כִּי לֹא מָלוּ אֹתָם
  choice: அவர்களுக்கு விருத்தசேதனம் செய்யப்படவில்லை
  rationale: எபிரெய வினையின் குறிப்பிடப்படாத பன்மைச் செய்பவரை தமிழில் தவறாக அடையாளப்படுத்தாமல், இயல்பான செயப்பாட்டு வடிவில் வழங்குகிறது.
- source_word: בַּדָּרֶךְ
  choice: வழியில்
  rationale: வனாந்தரப் பயணத்தின் போதைய காலத்தைக் குறிக்கும் சுருக்கமான, இயல்பான தமிழ் இணை.
theological_decisions:
- issue: உடன்படிக்கையைச் சார்ந்த உடல்நிலைக்கான சொல்
  choice: விருத்தசேதனம் செய்யப்படாதவர்கள்
  alternative: விருத்தசேதனம் அற்றவர்கள்
  rationale: இவ்வசனம் ஆன்மிக உருவகத்தை அல்ல, நேரடியான உடல் விருத்தசேதனத்தையே குறிக்கிறது; தேர்ந்த வடிவம் அந்த உடன்படிக்கைச் சூழலைத் தெளிவாகக் காக்கிறது.
- issue: முந்தைய தலைமுறைக்குப் பதிலாக மகன்கள் எழுப்பப்பட்டனர் என்பதன் முகவர்
  choice: ‘அவர்’ என்று மட்டும் வைத்து சுட்டைத் திறந்த நிலையில் வைத்தல்
  alternative: ‘கர்த்தர் எழும்பச் செய்த’ அல்லது ‘யோசுவா எழும்பச் செய்த’ என்று முகவரை வெளிப்படையாக நிரப்புதல்
  rationale: הֵקִים என்பது மூன்றாம் நபர் ஒருமை என்றாலும், இவ்வசனத் துணுக்கில் அதன் எழுவாய் பெயரிட்டு வழங்கப்படவில்லை. இறையியல் ஊகத்தின் மூலம் முகவரைச் சேர்க்காமல் மூலத்தின் தெளிவின்மையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘விருத்தசேதனம்’ என்பது பரவலாக அறியப்பட்ட வேதாகமச் சொல்லாக இருப்பதால் தக்கவைக்கப்பட்டது; எபிரெய உரையில் குறிப்பிடப்படாத செய்பவர் தேவையின்றி சேர்க்கப்படவில்லை.
