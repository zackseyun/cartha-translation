base_translation:
  language: en
  yaml_path: translation/ot/joshua/005/002.yaml
  text: At that time Yahweh said to Joshua[a], “Make for yourself flint knives, and circumcise the sons of Israel again[c][b], a second time.”
translation:
  language: ta
  text: அக்காலத்தில் யாவே யோசுவாவிடம், “உனக்காகச் சக்கிமுக்கிக் கல் கத்திகளைச் செய்து, இஸ்ரவேலின் மகன்களுக்கு மீண்டும் இரண்டாம் முறையாக விருத்தசேதனம் செய்[a]” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “மீண்டும் இரண்டாம் முறையாக” என்பது அதே நபர்களுக்கு இரண்டாவது தடவையாக விருத்தசேதனம் செய்வதைக் கட்டாயமாகக் குறிக்காது; இஸ்ரவேல் மக்களிடையே விருத்தசேதனத்தை மீண்டும் நடத்துவதைக் குறிக்கிறது.
    reason: cultural_note
lexical_decisions:
- source_word: בָּעֵת הַהִיא
  choice: அக்காலத்தில்
  rationale: கதை நிகழும் காலச் சூழலை அறிமுகப்படுத்தும் எபிரெய வழக்குத் தொடரை இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தலைப்பாக மாற்றாமல், எபிரெய மூலத்திலுள்ள இறைத் திருப்பெயரைத் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: עֲשֵׂה לְךָ
  choice: உனக்காக ... செய்து
  rationale: கட்டளை வினையையும் לְךָ என்பதன் பயனாளிப் பொருளையும் இயல்பான தமிழில் காக்கிறது.
- source_word: חַרְבוֹת צֻרִים
  choice: சிக்கிமுக்கிக் கல் கத்திகள்
  rationale: சூழலில் חַרְבוֹת என்பது வாள்களைவிட வெட்டும் கத்திகளைக் குறிக்கிறது; צֻרִים அவை சிக்கிமுக்கிக் கல்லால் ஆனவை என்பதைக் குறிப்பிடுகிறது.
- source_word: וְשׁוּב
  choice: மீண்டும்
  rationale: அடுத்துவரும் கட்டளையின் செயல் மறுபடியும் நிகழ்வதைக் குறிக்கும் வினையடைப் பயன்பாட்டைத் தெளிவாகத் தருகிறது.
- source_word: מֹל
  choice: விருத்தசேதனம் செய்
  rationale: உடன்படிக்கைச் சூழலில் உள்ள விருத்தசேதனச் செயலை நேரடியாகவும் வழக்கமான தமிழிலும் குறிக்கிறது.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் மகன்கள்
  rationale: இலக்கண ரீதியான ஆண்பால் வடிவத்தையும், இச்சூழலில் விருத்தசேதனம் பெறும் ஆண்களைக் குறிக்கும் குறிப்பையும் காக்கிறது.
- source_word: שֵׁנִית
  choice: இரண்டாம் முறையாக
  rationale: மூலத்தில் தனியே வலியுறுத்தப்பட்ட இரண்டாவது நிகழ்வை மறைக்காமல் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: יְהוָה என்னும் இறைத் திருப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலத்தில் பட்டப்பெயர் அல்லாமல் நான்கெழுத்துத் திருப்பெயரே இருப்பதால், அதைத் தலைப்பால் மாற்றாமல் ஒலிபெயர்க்கிறது.
- issue: בְּנֵי יִשְׂרָאֵל என்னும் பாலினக் குறிப்பு
  choice: இஸ்ரவேலின் மகன்கள்
  alternative: இஸ்ரவேலர் / இஸ்ரவேலின் பிள்ளைகள்
  rationale: விருத்தசேதனத்தின் உடனடிச் சூழலில் ஆண் சந்ததியாரே செயப்படுபொருளாக இருப்பதால் மூலத்தின் ஆண்பால் குறிப்பைப் பாதுகாக்கிறது.
- issue: மீண்டும் / இரண்டாம் முறை என்பதன் பொருள்
  choice: இரு கூறுகளையும் பிரதிபலித்து, மக்களாகிய இஸ்ரவேலரிடையே விருத்தசேதனத்தை மறுபடியும் நடத்துதல்
  alternative: அதே நபர்களுக்கு இரண்டாவது தடவையாக விருத்தசேதனம் செய்தல்
  rationale: וְשׁוּב மற்றும் שֵׁנִית ஆகிய இரு மறுநிகழ்வுக் குறிப்புகளையும் காக்கிறது; ஆனால் அதே நபர்களை இருமுறை விருத்தசேதனம் செய்யும்படி பொருள் கொள்ள வேண்டியதில்லை என்பதை அடிக்குறிப்பு தெளிவுபடுத்துகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பும் கண்ணியமும் காக்கப்பட்டுள்ளன. ‘சிக்கிமுக்கிக் கல்’ பொதுவாகப் புரியக்கூடிய வகையில் flint என்பதைக் குறிக்கிறது; ‘விருத்தசேதனம்’ இந்த உடன்படிக்கைச் சூழலுக்கான நிலையான சொல்லாகப் பயன்படுத்தப்பட்டுள்ளது.
