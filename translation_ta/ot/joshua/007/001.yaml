  text: וַ/יִּמְעֲל֧וּ בְנֵֽי יִשְׂרָאֵ֛ל מַ֖עַל בַּ/חֵ֑רֶם וַ/יִּקַּ֡ח עָכָ֣ן בֶּן כַּרְמִי֩ בֶן זַבְדִּ֨י בֶן זֶ֜רַח לְ/מַטֵּ֤ה יְהוּדָה֙ מִן הַ/חֵ֔רֶם וַ/יִּֽחַר אַ֥ף יְהוָ֖ה בִּ/בְנֵ֥י יִשְׂרָאֵֽל־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/001.yaml
  text: But the sons of Israel acted unfaithfully regarding the things devoted to destruction[a], for Achan son of Carmi, son of Zabdi, son of Zerah, of the tribe of Judah, took some of the things devoted to destruction; so the anger of Yahweh burned against the sons of Israel.
translation:
  language: ta
  text: ஆனால், அழிவுக்கென்று அர்ப்பணிக்கப்பட்டவற்றின்[a] விஷயத்தில் இஸ்ரவேல் மக்கள் நம்பிக்கைத் துரோகம் செய்தார்கள். ஏனெனில், யூதா கோத்திரத்தைச் சேர்ந்த சேராவின் மகன் சப்தியின் மகன் கர்மியின் மகனான ஆகான், அழிவுக்கென்று அர்ப்பணிக்கப்பட்டவற்றில் சிலவற்றை எடுத்துக்கொண்டான். அதனால் இஸ்ரவேல் மக்கள்மீது யாவேயின் கோபம் பற்றியெரிந்தது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அர்ப்பணிக்கப்பட்டவை’; இன்னும் சொற்சொல்லாக, ‘தடை விதிக்கப்பட்டவை.’ எபிரெயச் சொல் חֵרֶם, கடவுளுக்கென ஒதுக்கப்பட்டு அழிக்கப்பட வேண்டிய மனிதர்களையோ பொருட்களையோ, அல்லது சாதாரண மனிதப் பயன்பாட்டிலிருந்து முற்றிலும் நீக்கப்பட்டவற்றையோ குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּמְעֲלוּ ... מַעַל
  choice: நம்பிக்கைத் துரோகம் செய்தார்கள்
  rationale: מעל என்ற வினையும் அதே வேரிலான பெயர்ச்சொல்லும் உடன்படிக்கை சார்ந்த நம்பிக்கை மீறலை வலியுறுத்துகின்றன. தமிழில் இயல்பாகவும் அதன் தீவிரத்தைத் தக்கவைத்தும் இவ்வாறு மொழிபெயர்க்கப்பட்டது.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்கள்
  rationale: எபிரெய குடும்பச் சொல்லாட்சியின் கூட்டுப்பொறுப்பைத் தக்கவைத்தபடி, நவீனத் தமிழில் இயல்பாகப் புரியும் வடிவம்.
- source_word: בַּחֵרֶם / מִן הַחֵרֶם
  choice: அழிவுக்கென்று அர்ப்பணிக்கப்பட்டவை
  rationale: חֵרֶם என்பது கடவுளுக்கென ஒதுக்கப்பட்டு அழிக்கப்பட வேண்டியவற்றையோ சாதாரண மனிதப் பயன்பாட்டிலிருந்து முற்றிலும் நீக்கப்பட்டவற்றையோ குறிக்கிறது. சூழலில் அழிவின் அம்சத்தைத் தெளிவாகக் காட்டும் தேர்வு.
- source_word: וַיִּקַּח ... מִן
  choice: சிலவற்றை எடுத்துக்கொண்டான்
  rationale: מִן தரும் பகுதியைக் குறிக்கும் பொருளை தமிழில் இயல்பாக வெளிப்படுத்த ‘சிலவற்றை’ சேர்க்கப்பட்டது.
- source_word: לְמַטֵּה יְהוּדָה
  choice: யூதா கோத்திரத்தைச் சேர்ந்த
  rationale: வம்சப் பின்னணியில் מַטֶּה என்பதற்கான இயல்பான தமிழ் இணை ‘கோத்திரம்’.
- source_word: וַיִּחַר אַף יְהוָה
  choice: யாவேயின் கோபம் பற்றியெரிந்தது
  rationale: கோபம் எரிவதாகக் கூறும் எபிரெய உருவகத்தை இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரை ஒரு பட்டப்பெயரால் மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
theological_decisions:
- issue: ஒரு தனிநபரான ஆகானின் செயலுக்கிடையில் இஸ்ரவேல் மக்கள் அனைவரும் நம்பிக்கைத் துரோகம் செய்ததாகக் கூறப்படும் கூட்டுப்பொறுப்பு
  choice: முதன்மை வாக்கியத்தில் ‘இஸ்ரவேல் மக்கள்’ என்ற பன்மைக் கூட்டுப்பொருளைத் தக்கவைத்து, அடுத்த வாக்கியத்தில் ஆகானைத் தனிப்பட்ட செயல்வீரனாகக் குறிப்பிடுதல்
  alternative: குற்றத்தை ஆகானுக்கு மட்டுமே வரையறுத்தல் அல்லது ‘இஸ்ரவேல்’ என்று பொதுமைப்படுத்தி உள்ளார்ந்த முரண்பாட்டை மங்கச் செய்தல்
  rationale: எபிரெய உரை தனிநபரின் பாவத்தையும் சமூகத்தின் மீதான விளைவையும் வேண்டுமென்றே ஒன்றாக வைத்துள்ளது; அந்த இறையியல் பதற்றம் தீர்த்துவைக்கப்படாமல் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. வம்சவரிசை எபிரெய வரிசைப்படியே பாதுகாக்கப்பட்டுள்ளது; ‘ஆனால்’, ‘ஏனெனில்’, ‘அதனால்’ ஆகிய இணைப்புகள் உரையின் தர்க்கத் தொடரைத் தெளிவாக்குகின்றன.
