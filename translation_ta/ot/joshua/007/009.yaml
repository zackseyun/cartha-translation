base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/009.yaml
  text: For the Canaanites and all the inhabitants of the land will hear[a], and they will surround us and cut off our name from the earth[b]. And what will you do for your great name?
translation:
  language: ta
  text: கானானியரும் நாட்டில் வாழும் அனைவரும் இதைக் கேள்விப்பட்டு, எங்களைச் சூழ்ந்து, எங்கள் பெயரைப் பூமியிலிருந்து அழித்துவிடுவார்கள்.[a] உமது மகத்தான பெயருக்காக நீர் என்ன செய்வீர்?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “எங்கள் பெயரைப் பூமியிலிருந்து அழித்துவிடுதல்” என்பது ஒரு மக்களின் இருப்பையும் அவர்களைப் பற்றிய நினைவையும் முற்றிலும் ஒழிப்பதைக் குறிக்கும் எபிரெய மரபுத்தொடர்.
    reason: cultural_note
lexical_decisions:
- source_word: וְיִשְׁמְעוּ
  choice: இதைக் கேள்விப்பட்டு
  rationale: שׁמע என்பதன் பொருள் இங்கு இஸ்ரவேலின் தோல்விச் செய்தியை அறிந்துகொள்வது. தமிழில் இயல்பான காரண-விளைவு தொடருக்காக வினையெச்ச வடிவம் பயன்படுத்தப்பட்டது; ‘இதை’ என்பது உடனடி சூழலிலுள்ள செய்தியைக் குறிக்கிறது.
- source_word: הַכְּנַעֲנִי
  choice: கானானியரும்
  rationale: எபிரெயத்தில் ஒருமை வடிவம் இருந்தாலும் இது மக்களினத்தைக் கூட்டாகக் குறிக்கிறது; அதனால் தமிழில் பன்மை மரியாதையற்ற பொதுக் குழுவடிவம் இயல்பாக அமைகிறது.
- source_word: וְכֹל יֹשְׁבֵי הָאָרֶץ
  choice: நாட்டில் வாழும் அனைவரும்
  rationale: יֹשְׁבֵי என்பது ‘வாழ்பவர்கள்/குடியிருப்பவர்கள்’; இங்கு הָאָרֶץ உலகம் முழுவதையும் அல்ல, சூழ்ந்துள்ள நாட்டைச் சுட்டுகிறது.
- source_word: וְנָסַבּוּ עָלֵינוּ
  choice: எங்களைச் சூழ்ந்துகொண்டு
  rationale: נסב + עַל இராணுவ நோக்கில் சுற்றிவளைத்தலைக் குறிக்கிறது. ‘சூழ்ந்துகொண்டு’ அடுத்துவரும் அழித்தலை இயல்பாக இணைக்கிறது.
- source_word: וְהִכְרִיתוּ אֶת שְׁמֵנוּ מִן הָאָרֶץ
  choice: எங்கள் பெயரையே பூமியிலிருந்து அழித்துவிடுவார்கள்
  rationale: ‘பெயரை அறுத்துப்போடுதல்’ என்ற எபிரெய மரபுத்தொடர் ஒரு மக்களின் இருப்பையும் நினைவையும் முற்றிலும் ஒழிப்பதைக் குறிக்கிறது. ‘பெயரையே’ உருவகத்தைத் தக்கவைத்து அதன் முழுமையான அழிவு வலிமையையும் தமிழில் வெளிப்படுத்துகிறது.
- source_word: וּמַה תַּעֲשֶׂה
  choice: அப்போது ... நீர் என்ன செய்வீர்?
  rationale: நேரடியான கேள்வி பாதுகாக்கப்பட்டது. ‘அப்போது’ என்பது முன்கூறிய விளைவுக்கும் கேள்விக்கும் உள்ள தர்க்கத் தொடர்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: לְשִׁמְךָ הַגָּדוֹל
  choice: உமது மகத்தான பெயருக்காக
  rationale: לְ இங்கு தேவனுடைய பெயரின் நிமித்தம் அல்லது அதன் கௌரவத்திற்காக என்ற பொருளைத் தருகிறது. ‘பெயருக்காக’ அந்தப் பொதுக் கௌரவம் சார்ந்த வேண்டுகோளை மிகைப்படுத்தாமல் காக்கிறது.
theological_decisions:
- issue: ‘உமது மகத்தான பெயர்’ என்பதன் பொருள்
  choice: இஸ்ரவேலின் நிலைமையோடு தொடர்புடைய கடவுளின் பொதுக் கௌரவத்தை முன்னிறுத்தும் வேண்டுகோள்
  alternative: உடன்படிக்கை சார்ந்த எந்தத் தொடர்புமின்றி கடவுளின் பெயரைப் பற்றிய தனிப்பட்ட அக்கறை
  rationale: சுற்றியுள்ள மக்கள் இஸ்ரவேலின் அழிவைக் கேள்விப்படுவார்கள் என்பதே யோசுவாவின் கவலை. எனவே கடவுளின் பெயர் நாடுகளிடையே பெறும் கௌரவம் உட்கருத்தாக உள்ளது; மொழிபெயர்ப்பு இதை விளக்கவுரையாக விரிக்காமல் மூலத்தின் சுருக்கத்தைக் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டது. கடவுளை நோக்கிய உரையில் ‘உமது/நீர்’ வடிவங்கள் இடம்பெற்றுள்ளன. மூலத்தின் ‘பெயர்’ உருவகம் தக்கவைக்கப்பட்டு அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது.
