source:
  edition: WLC
  text: בִּ֖י אֲדֹנָ֑/י מָ֣ה אֹמַ֔ר אַ֠חֲרֵי אֲשֶׁ֨ר הָפַ֧ךְ יִשְׂרָאֵ֛ל עֹ֖רֶף לִ/פְנֵ֥י אֹיְבָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/008.yaml
  text: Please[a], Lord[b], what can I say after Israel has turned its back before its enemies?
translation:
  language: ta
  text: ஆண்டவரே, இஸ்ரவேல் தன் எதிரிகளுக்கு முன்பாகப் புறமுதுகு காட்டித் திரும்பிய பிறகு, நான் என்ன சொல்வேன்?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּי
  choice: தயவுசெய்து
  rationale: உயர்ந்தவரிடம் உருக்கமாக வேண்டிக்கொள்ளும் இடைச்சொல்; நவீன தமிழில் மரியாதையான மன்றாட்டை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: אֲדֹנָי
  choice: ஆண்டவரே
  rationale: கடவுளை நேரடியாக அழைக்கும் மரியாதைத் தெய்வீகப் பட்டம்; உடன்படிக்கைப் பெயரை இங்கு சேர்க்கவில்லை.
- source_word: מָה אֹמַר
  choice: நான் என்ன சொல்வேன்?
  rationale: எபிரெய வினை வடிவின் நேரடியான எதிர்கால/ஆலோசனைத் தன்மையையும் யோசுவாவின் திகைப்பையும் காக்கிறது.
- source_word: אַחֲרֵי אֲשֶׁר
  choice: பிறகு
  rationale: யோசுவாவின் கேள்விக்குக் காரணமான நிகழ்வை இயல்பான தமிழில் அறிமுகப்படுத்துகிறது.
- source_word: הָפַךְ ... עֹרֶף
  choice: புறமுதுகிட்டு ஓடிய
  rationale: சொல்லாட்சியின் அடிப்படை உருவகமான ‘பின்கழுத்து/முதுகைத் திருப்புதல்’ என்பதையும் போரில் தோற்று பின்வாங்கும் பொருளையும் தெளிவாகக் கடத்துகிறது.
- source_word: לִפְנֵי
  choice: முன்பாக
  rationale: போர்ச் சூழலில் எதிரிகளுக்கு எதிரே இருந்து பின்னர் பின்வாங்கிய உறவை வெளிப்படுத்துகிறது.
- source_word: אֹיְבָיו
  choice: தன் எதிரிகளுக்கு
  rationale: ஒருமை ஆண்பால் பின்னொட்டு கூட்டுப் பெயரான இஸ்ரவேலைச் சுட்டுவதால், தமிழில் இயல்பான தற்சுட்டுப் பெயரடை பயன்படுத்தப்பட்டுள்ளது.
theological_decisions:
- issue: אֲדֹנָי என்ற தெய்வீகப் பட்டத்தின் மொழிபெயர்ப்பு
  choice: ஆண்டவரே
  alternative: என் ஆண்டவரே
  rationale: இங்கு இது கடவுளுக்கான நிலையான மரியாதைப் பட்டமாகச் செயல்படுகிறது; தனிப்பட்ட உடைமைப் பொருளை அளவுக்கு மீறி வலியுறுத்தாமலும், மூலத்தில் இல்லாத உடன்படிக்கைப் பெயரைச் சேர்க்காமலும் உள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழ்; ஜெபத்திற்குரிய மரியாதையும் யோசுவாவின் துயரமான திகைப்பும் காக்கப்பட்டுள்ளன. ‘புறமுதுகிட்டு ஓடிய’ என்பது எபிரெயப் போர்ச் சொல்லாட்சியை சாதாரண வாசகருக்குத் தெளிவாக்குகிறது.
