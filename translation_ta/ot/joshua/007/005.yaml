revisions:
- from: ஆயி நகரத்து ஆட்கள் அவர்களில் ஏறக்குறைய முப்பத்தாறு பேரை வீழ்த்தினார்கள். நகரவாசலுக்கு முன்பிருந்து செபாரீம்வரை[a] அவர்களைத் துரத்தி, இறக்கத்தில் அவர்களை வீழ்த்தினார்கள். அதனால் மக்களின் இதயம் உருகித் தண்ணீர்போல் ஆனது.
  to: ஆயி நகரத்தார் அவர்களில் ஏறக்குறைய முப்பத்தாறு பேரை வீழ்த்தினார்கள். வாசலின் முன்னிலிருந்து ஷெபாரீம்வரை[a] அவர்களைத் துரத்தி, சரிவில் அவர்களை வீழ்த்தினார்கள். அதனால் மக்களின் இதயம் உருகித் தண்ணீர்போல் ஆனது.
  rationale: The revision makes the gate expression and topographical term more natural in modern standard Tamil, and standardizes the transliteration of the disputed term שברים. It preserves the source's syntax, military force, approximate casualty figure, metaphor, and the footnoted ambiguity.
