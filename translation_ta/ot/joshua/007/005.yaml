base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/005.yaml
  text: And the men of Ai struck down about thirty-six men from among them[a], and pursued them from before the gate as far as Shebarim, and struck them down on the descent. So the heart of the people melted and became like water.
translation:
  language: ta
  text: ஆயி நகரத்தார் அவர்களில் ஏறக்குறைய முப்பத்தாறு பேரை வீழ்த்தினார்கள். வாசலின் முன்னிலிருந்து ஷெபாரீம்வரை[a] அவர்களைத் துரத்தி, சரிவில் அவர்களை வீழ்த்தினார்கள். அதனால் மக்களின் இதயம் உருகித் தண்ணீர்போல் ஆனது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “குவாரிகள்வரை” அல்லது “உடைந்த இடங்கள்வரை.” שברים (ஷெபாரீம்) என்ற எபிரெயச் சொல்லை ஓர் இடப்பெயராகவோ விளக்கச் சொல்லாகவோ புரிந்துகொள்ளலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּכּוּ מֵהֶם
  choice: அவர்களில் ... பேரை வீழ்த்தினார்கள்
  rationale: מן அடங்கிய சொற்றொடர் இஸ்ரவேலரின் படையிலிருந்து உயிரிழந்தவர்களைக் குறிக்கிறது; போர் சூழலில் נכה என்பதன் வலிமையை ‘வீழ்த்தினார்கள்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: אַנְשֵׁי הָעַי
  choice: ஆயி நகரத்து ஆட்கள்
  rationale: ஆயியைச் சேர்ந்த போராளிகளைக் குறிக்கும் எபிரெயக் கட்டமைப்பை இயல்பான தமிழில் தருகிறது; ‘ஆட்கள்’ என்பது ஆண்களைச் சுட்டும் மூலச்சொல்லையும் சூழலையும் பாதுகாக்கிறது.
- source_word: כִּשְׁלֹשִׁים וְשִׁשָּׁה אִישׁ
  choice: ஏறக்குறைய முப்பத்தாறு பேர்
  rationale: எண்ணுக்கு முன் வரும் כְּ தோராயப் பொருளைக் கொண்டதால் ‘ஏறக்குறைய’ சேர்க்கப்பட்டுள்ளது.
- source_word: וַיִּרְדְּפוּם
  choice: அவர்களைத் துரத்தி
  rationale: רדף என்பதன் போர்ச் சூழலுக்குரிய தொடர்ந்த பின்துரத்தலை இயல்பாகக் குறிக்கிறது.
- source_word: לִפְנֵי הַשַּׁעַר
  choice: நகரவாசலுக்கு முன்பிருந்து
  rationale: לפני என்பதன் ‘வாசலின் முன்னிலிருந்து’ என்ற இடவியல் கருத்தைத் தெளிவாக்குகிறது; சூழலுக்கேற்ப அது நகரவாசல் எனக் குறிப்பிடப்படுகிறது.
- source_word: עַד הַשְּׁבָרִים
  choice: செபாரீம்வரை[a]
  rationale: שברים என்பது இடப்பெயராகவோ ‘கல் குவாரிகள்/உடைந்த இடங்கள்’ என்ற பொதுப்பெயராகவோ புரிந்துகொள்ளப்படலாம்; பிரதான உரையில் இடப்பெயர் ஒலிபெயர்க்கப்பட்டு, தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: בַּמּוֹרָד
  choice: இறக்கத்தில்
  rationale: מורד குறிக்கும் கீழ்நோக்கிய சரிவு அல்லது இறங்கும் வழியைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: וַיִּמַּס לְבַב הָעָם
  choice: மக்களின் இதயம் உருகி
  rationale: தைரியம் குலைந்ததைச் சுட்டும் எபிரெய உருவகத்தை விளக்கமாக மாற்றாமல் பாதுகாக்கிறது.
- source_word: וַיְהִי לְמָיִם
  choice: தண்ணீர்போல் ஆனது
  rationale: மக்களின் மனவுறுதி முற்றிலும் குலைந்ததைச் சுட்டும் உருவகத்தை இயல்பான தமிழில் தக்கவைக்கிறது.
