revisions:
- from: பின்பு யோசுவா சேராவின் மகன் ஆகானையும், வெள்ளியையும், மேலங்கியையும், நாக்கு வடிவத் தங்கக்கட்டியையும்[a], அவனுடைய மகன்களையும் மகள்களையும், அவனுடைய மாட்டையும் கழுதையையும் மந்தையையும் கூடாரத்தையும், அவனுக்குச் சொந்தமான அனைத்தையும் அழைத்துக்கொண்டார். இஸ்ரவேலர் அனைவரும் அவருடன் சென்று, அவர்களை ஆகோர் பள்ளத்தாக்குக்குக் கொண்டுபோனார்கள்[b].
  to: பின்பு யோசுவா, சேராவின் மகன் ஆகானையும், வெள்ளியையும், மேலங்கியையும், நாக்கு வடிவத் தங்கத் துண்டையும்[a], அவனுடைய மகன்களையும் மகள்களையும், அவனுடைய எருதையும் கழுதையையும் மந்தையையும் கூடாரத்தையும், அவனுக்குச் சொந்தமான அனைத்தையும் எடுத்துக்கொண்டார். இஸ்ரவேலர் அனைவரும் அவருடன் இருந்தார்கள்; அவர்கள் அவை அனைத்தையும் ஆகோர் பள்ளத்தாக்குக்கு ஏற்றிக்கொண்டு சென்றார்கள்[b].
  rationale: The revision renders וַיִּקַּח with an inclusive Tamil verb that can govern the people and possessions in the list. It uses 'எருது' for the singular שׁוֹר and retains the Hebrew's plural final action by stating that all Israel, with Joshua, took all the listed persons and things up to the Valley of Achor. The family members' role remains unexplained, as in the source. Footnote anchors and their intended lexical/cultural functions are retained.
