  text: וַ/יִּקַּ֣ח יְהוֹשֻׁ֣עַ אֶת עָכָ֣ן בֶּן זֶ֡רַח וְ/אֶת הַ/כֶּ֣סֶף וְ/אֶת הָ/אַדֶּ֣רֶת וְֽ/אֶת לְשׁ֣וֹן הַ/זָּהָ֡ב וְֽ/אֶת בָּנָ֡י/ו וְֽ/אֶת בְּנֹתָ֡י/ו וְ/אֶת שׁוֹר/וֹ֩ וְ/אֶת חֲמֹר֨/וֹ וְ/אֶת צֹאנ֤/וֹ וְ/אֶֽת אָהֳל/וֹ֙ וְ/אֶת כָּל אֲשֶׁר ל֔/וֹ וְ/כָל יִשְׂרָאֵ֖ל עִמּ֑/וֹ וַ/יַּעֲל֥וּ אֹתָ֖/ם עֵ֥מֶק עָכֽוֹר־־־־־־־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/024.yaml
  text: Then Joshua took Achan son of Zerah[a], and the silver, the cloak, the bar of gold, his sons, his daughters, his ox, his donkey, his flock, his tent[b], and all that belonged to him—and all Israel with him—and they brought them up to the Valley of Achor.
translation:
  language: ta
  text: பின்பு யோசுவா, சேராவின் மகன் ஆகானையும், வெள்ளியையும், மேலங்கியையும், நாக்கு வடிவத் தங்கத் துண்டையும்[a], அவனுடைய மகன்களையும் மகள்களையும், அவனுடைய எருதையும் கழுதையையும் மந்தையையும் கூடாரத்தையும், அவனுக்குச் சொந்தமான அனைத்தையும் எடுத்துக்கொண்டார். இஸ்ரவேலர் அனைவரும் அவருடன் இருந்தார்கள்; அவர்கள் அவை அனைத்தையும் ஆகோர் பள்ளத்தாக்குக்கு ஏற்றிக்கொண்டு சென்றார்கள்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் நேரடியாக, “தங்க நாக்கு”; அதாவது, நாக்கு வடிவிலான தங்கத் துண்டு. மரபாக, “தங்க ஆப்பு” என்றும் மொழிபெயர்க்கப்படுகிறது.
    reason: lexical_alternative
  - marker: b
    text: “ஆகோர்” என்ற பெயர், எபிரெயத்தில் “தொல்லை” என்பதற்கான சொல்லைப் போல ஒலிக்கிறது.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּקַּח
  choice: பின்பு யோசுவா ... அழைத்துக்கொண்டார்
  rationale: வாவ் தொடர்வினை கதை நகர்வைக் குறிக்கிறது; ‘பின்பு’ இயல்பாக வரிசையைத் தெரிவிக்கிறது. பட்டியலில் மனிதர்களும் பொருட்களும் இருப்பதால், தமிழில் ‘அழைத்துக்கொண்டார்’ என்ற வினை மனிதர்களுக்கு இயல்பாகவும், அடுத்த வாக்கியத்தின் ‘கொண்டுபோனார்கள்’ என்பதுடன் பொருந்துமாறும் பயன்படுத்தப்பட்டது.
- source_word: עָכָן בֶּן זֶרַח
  choice: சேராவின் மகன் ஆகான்
  rationale: எபிரெயப் பெயர்கள் தமிழில் ஒலிபெயர்க்கப்பட்டன; தந்தைவழி அடையாளம் இயல்பான தமிழ் சொல்வரிசையில் தரப்பட்டது.
- source_word: הַכֶּסֶף
  choice: வெள்ளி
  rationale: כֶּסֶף என்பதன் நேரடிப் பொருள் ‘வெள்ளி’; ‘பணம்’ என்று விளக்கமாக மாற்றப்படவில்லை.
- source_word: הָאַדֶּרֶת
  choice: மேலங்கி
  rationale: தனித்துவமான வெளிப்புற ஆடையைக் குறிக்கும் சொல்லுக்கு நவீன வாசகர்களுக்குப் புரியும் இயல்பான இணை.
- source_word: לְשׁוֹן הַזָּהָב
  choice: நாக்கு வடிவத் தங்கக்கட்டி
  rationale: לְשׁוֹן என்பதன் ‘நாக்கு’ என்ற உருவகத்தையும், இது ஒரு தங்கத் துண்டு என்பதையும் ஒருங்கே தெளிவுபடுத்துகிறது; குறிப்பிட்ட ‘ஆப்பு’ வடிவத்தைத் தேவையின்றி விதிக்கவில்லை.
- source_word: בָּנָיו ... בְּנֹתָיו
  choice: அவனுடைய மகன்களையும் மகள்களையும்
  rationale: மூலம் மகன்களையும் மகள்களையும் தனித்தனியாகக் குறிப்பிடுவதால் அந்தத் துல்லியம் காக்கப்பட்டது.
- source_word: שׁוֹרוֹ
  choice: அவனுடைய மாடு
  rationale: שׁוֹר என்பது ஒற்றை மாட்டின விலங்கைக் குறிக்கிறது; தமிழில் பொதுவாகவும் இயல்பாகவும் ‘மாடு’ என வழங்கப்பட்டது.
- source_word: חֲמֹרוֹ
  choice: கழுதை
  rationale: நவீனத் தமிழில் நேரடியான பொதுவழக்குச் சொல்.
- source_word: צֹאנוֹ
  choice: மந்தை
  rationale: செம்மறியாடுகள், வெள்ளாடுகள் உள்ளிட்ட சிறு கால்நடைகளின் கூட்டத்தைக் குறிக்கும் எபிரெயக் கூட்டுப்பொருள் காக்கப்பட்டது.
- source_word: אָהֳלוֹ
  choice: கூடாரம்
  rationale: மூலத்தின் எளிய நேரடிப் பொருள்.
- source_word: כָּל אֲשֶׁר לוֹ
  choice: அவனுக்குச் சொந்தமான அனைத்தும்
  rationale: உடைமைப் பொருளை இயல்பான நவீனத் தமிழில் சுருக்கமாகத் தெரிவிக்கிறது.
- source_word: וְכָל יִשְׂרָאֵל עִמּוֹ
  choice: இஸ்ரவேலர் அனைவரும் அவருடன்
  rationale: இங்குள்ள ஒருமைச் சுட்டுப்பெயர் முதன்மை எழுவாயான யோசுவாவைக் குறிப்பதாக இயல்பாகப் புரிகிறது; ஆகானுடன் குழப்பம் வராமல் மரியாதை ஒருமையான ‘அவருடன்’ பயன்படுத்தப்பட்டது.
- source_word: וַיַּעֲלוּ אֹתָם עֵמֶק עָכוֹר
  choice: அவர்களை ஆகோர் பள்ளத்தாக்குக்குக் கொண்டுபோனார்கள்
  rationale: ‘மேலே அழைத்துச் சென்றார்கள்’ என்பது எபிரெய மொழியின் இடநகர்வு வழக்கு; இலக்கு இடத்துக்குக் கொண்டுபோனார்கள் என இயல்பான தமிழில் வழங்கப்பட்டது. אֹתָם என்ற பன்மை ‘அவர்களை’ எனக் காக்கப்பட்டது.
theological_decisions:
- issue: ஆகானுடைய குடும்பத்தினரின் குற்றப்பங்கு அல்லது குற்றமின்மையை இவ்வசனம் தீர்மானிக்கிறதா
  choice: ‘அவனுடைய மகன்களையும் மகள்களையும்’ என்று எந்த விளக்கத் தகுதியும் சேர்க்காமல் நேரடியாகப் பட்டியலிடுதல்
  alternative: அவர்கள் உடந்தையினர் என்றோ, வெறுமனே உடன் அழைத்துச் செல்லப்பட்டவர்கள் என்றோ விளக்கத்தைச் சேர்த்தல்
  rationale: இவ்வசனம் அவர்களை அழைத்துச் சென்றதாகக் கூறினாலும், அவர்களுடைய அறிவு, பங்கு அல்லது குற்றப்பொறுப்பைத் தனியாகக் குறிப்பிடவில்லை. ஆகவே மூலத்தின் விளக்கத் திறந்தநிலை காக்கப்பட்டது.
- issue: אֹתָם என்ற பன்மைச் சுட்டின் பரப்பு
  choice: ‘அவர்களை’ என்று பன்மையைத் தெளிவாகக் காத்தல்
  alternative: ஆகானை மட்டும் கொண்டுபோனதாக ஒருமைப்படுத்துதல்
  rationale: மசோரெட்டிக் உரையில் வெளிப்படையாகப் பன்மை உள்ளது; பட்டியலிடப்பட்ட மனிதர்கள் மற்றும் உடைமைகள் முழுவதையும் அது பின்னோக்கிச் சுட்டுகிறது. அடுத்த வசனத்தின் நிகழ்வை முன்கூட்டியே விளக்காமல் இவ்வசனத்தின் இலக்கணம் காக்கப்பட்டது.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும், கண்ணியமான கதைநடை. நீண்ட எபிரெய இணைப்புப் பட்டியல் தமிழில் இரண்டு வாக்கியங்களாகப் பிரிக்கப்பட்டது. மனிதர்களையும் பொருட்களையும் ஒரே ‘எடுத்தார்’ வினைக்குள் இயல்பற்றவாறு அடக்காமல், முதலில் ‘அழைத்துக்கொண்டார்’, பின்னர் மூலத்தின் பன்மை வினைக்கேற்ப ‘கொண்டுபோனார்கள்’ என அமைக்கப்பட்டது. அனைத்து அடிக்குறிப்பு குறியீடுகளும் பிரதான உரையில் இடம்பெற்றுள்ளன.
