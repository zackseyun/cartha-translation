base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/021.yaml
  text: I saw among the spoil one beautiful cloak from Shinar[a], two hundred shekels of silver, and one bar of gold weighing fifty shekels. I coveted them and took them, and look, they are hidden in the ground inside my tent[c][b], with the silver underneath it.
translation:
  language: ta
  text: கொள்ளைப் பொருளில் சிநெயாரிலிருந்து வந்த அழகிய மேலாடை ஒன்றையும்[a], இருநூறு சேக்கல் வெள்ளியையும், ஐம்பது சேக்கல் எடையுள்ள ஒரு தங்கத் துண்டையும்[b] கண்டேன். அவற்றின்மேல் ஆசைகொண்டு அவற்றை எடுத்துக்கொண்டேன். இதோ, அவை என் கூடாரத்திற்குள் மண்ணில் மறைத்து வைக்கப்பட்டிருக்கின்றன; அதன் அடியில் வெள்ளியும் இருக்கிறது[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “மேலாடை” என்பதற்கான எபிரெயச் சொல் சிறப்பான வெளிப்புற ஆடை அல்லது போர்வை போன்ற ஆடையையும் குறிக்கலாம். இதை “சிநெயாரிலிருந்து வந்த சிறந்த ஆடை ஒன்று” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயில் நேர்ப்பொருளாக “தங்க நாக்கு”; நாக்கு வடிவிலான தங்கத் துண்டைக் குறிப்பதாக இருக்கலாம். பாரம்பரியமாக இது “தங்க ஆப்பு” என்றும் மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
  - marker: c
    text: “அதன் அடியில்” என்பதிலுள்ள எபிரெயச் சுட்டுப்பெயர் பெண்பால் ஒருமையில் உள்ளது. அது மேலாடையைக் குறிப்பதாக இருக்கலாம்; ஆனால் அதன் முன்னிலை குறிப்பு முற்றிலும் உறுதியானதல்ல.
    reason: referent_ambiguity
lexical_decisions:
- source_word: בַשָּׁלָל
  choice: கொள்ளைப்பொருள்களுக்குள்
  rationale: போரில் கைப்பற்றப்பட்ட பொருள்களைக் குறிக்கும் שָׁלָל என்பதையும், ב முன்னொட்டின் இடப்பொருளையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: אַדֶּרֶת שִׁנְעָר אַחַת טוֹבָה
  choice: சிநேயாரிலிருந்து வந்த அழகிய மேலாடை ஒன்று
  rationale: אַדֶּרֶת என்பது சிறப்பான வெளிப்புற ஆடை அல்லது போர்வை போன்ற மேலாடையைக் குறிக்கலாம்; שִׁנְעָר அதன் தோற்றிடமாகப் புரிந்துகொள்ளப்படுகிறது; טוֹבָה இங்கு அதன் சிறப்பையும் அழகையும் விவரிக்கிறது.
- source_word: וּמָאתַיִם שְׁקָלִים כֶּסֶף
  choice: இருநூறு சேக்கல் வெள்ளி
  rationale: பண்டைய எடை அலகை நவீன அளவாக மாற்றாமல் மூலத்தின் அளவீட்டைத் தக்கவைக்கிறது.
- source_word: וּלְשׁוֹן זָהָב אֶחָד
  choice: ஒரு தங்கக் கட்டி
  rationale: לְשׁוֹן என்பதன் நேர்ப்பொருள் ‘நாக்கு’; இங்கு நாக்கு வடிவிலான தங்கத் துண்டைக் குறிப்பதாகத் தெரிகிறது. ‘தங்கக் கட்டி’ நவீன தமிழில் பொருளை இயல்பாகத் தெரிவிக்கிறது; நேர்ப்பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: חֲמִשִּׁים שְׁקָלִים מִשְׁקָלוֹ
  choice: ஐம்பது சேக்கல் எடையுள்ள
  rationale: தங்கத் துண்டின் எடையைச் சுருக்கமாகவும் தெளிவாகவும் தருகிறது.
- source_word: וָאֶחְמְדֵם
  choice: அவற்றின்மேல் ஆசைகொண்டு
  rationale: חמד தீவிரமான விருப்பத்தைக் குறிக்கிறது; தவறான எடுத்துக்கொள்ளுதலின் சூழல் அதன் ஒழுக்கப் பதற்றத்தை வெளிப்படுத்துகிறது, ஆனால் மூலத்தைவிட மிகையாக ‘பேராசை’ என்று தீர்மானிக்கவில்லை.
- source_word: וָאֶקָּחֵם
  choice: அவற்றை எடுத்துக்கொண்டேன்
  rationale: לקח என்ற பொதுவான ‘எடுத்தல்’ வினையை இயல்பாகத் தருகிறது.
- source_word: וְהִנָּם
  choice: இதோ, அவை
  rationale: கவனத்தை உடனடியாக ஈர்க்கும் எபிரெயச் சுட்டிடைச்சொல்லின் வலிமையைப் பாதுகாக்கிறது.
- source_word: טְמוּנִים בָּאָרֶץ
  choice: மண்ணில் மறைத்து வைக்கப்பட்டிருக்கின்றன
  rationale: טְמוּנִים என்பதன் மறைக்கப்பட்ட நிலையும், אֶרֶץ இச்சூழலில் குறிக்கும் மண் அல்லது தரையும் இணைந்து இயல்பாக வெளிப்படுகின்றன; முற்றிலும் புதைக்கப்பட்டதா என்றதை அளவுக்கு மீறி நிர்ணயிப்பதில்லை.
- source_word: בְּתוֹךְ הָאֳהֳלִי
  choice: என் கூடாரத்திற்குள்
  rationale: கூடாரத்தின் உட்புற இடத்தைக் குறிக்கும் சொற்றொடரைத் தெளிவான நவீன தமிழில் தருகிறது.
- source_word: וְהַכֶּסֶף תַּחְתֶּיהָ
  choice: வெள்ளி அந்த மேலாடையின் அடியில் இருக்கிறது
  rationale: இறுதிப் பெண்பால் ஒருமை சுட்டுப்பெயர் மேலாடையைக் குறிப்பதாக மிக இயல்பாகப் புரிகிறது; அதனைத் தெளிவாகக் கூறி, இலக்கணத் தகவலை அடிக்குறிப்பிலும் பதிவு செய்கிறது.
