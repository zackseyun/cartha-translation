source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוֹשֻׁ֜עַ אֲהָ֣הּ אֲדֹנָ֣/י יְהוִ֗ה לָ֠/מָה הֵעֲבַ֨רְתָּ הַעֲבִ֜יר אֶת הָ/עָ֤ם הַ/זֶּה֙ אֶת הַ/יַּרְדֵּ֔ן לָ/תֵ֥ת אֹתָ֛/נוּ בְּ/יַ֥ד הָ/אֱמֹרִ֖י לְ/הַאֲבִידֵ֑/נוּ וְ/לוּ֙ הוֹאַ֣לְנוּ וַ/נֵּ֔שֶׁב בְּ/עֵ֖בֶר הַ/יַּרְדֵּֽן׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/007.yaml
  text: And Joshua said[a], “Ah, Lord GOD, why have you brought this people across the Jordan at all—to give us into the hand of the Amorites, to destroy us? If only we had been willing to dwell beyond the Jordan!”
translation:
  language: ta
  text: 'யோசுவா சொன்னார்: “ஐயோ, ஆண்டவராகிய யாவே[a], எங்களை எமோரியரின் கையில் ஒப்புக்கொடுத்து அழிப்பதற்காக ஏன் இந்த மக்களை யோர்தானைக் கடக்கச் செய்தீர்? நாங்கள் யோர்தானுக்கு அப்பால் குடியிருக்க இசைந்திருந்தால் நன்றாயிருந்திருக்கும்!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரேயத்தில் “அதோனாய் ய்ஹ்வ்ஹ்”; இது “ஆண்டவர்” என்ற பட்டத்தையும் யாவே என்ற இறைப் பெயரையும் இணைத்த அழைப்பு.
    reason: மூலத்தின் கூட்டு இறை அழைப்பில் உள்ள பட்டத்தையும் இறைப் பெயரையும் தெளிவுபடுத்துதல்.
lexical_decisions:
- source_word: אֲהָהּ
  choice: ஐயோ
  rationale: துயரத்தையும் மனக்கலக்கத்தையும் வெளிப்படுத்தும் திடீர் புலம்பல்; நவீனத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் உள்ளது.
- source_word: אֲדֹנָי יְהוִה
  choice: ஆண்டவராகிய யெகோவாவே
  rationale: אֲדֹנָי என்ற அதிகாரப் பட்டத்தையும் יהוה என்ற தனிப்பட்ட இறைப் பெயரையும் வேறுபடுத்திக் காக்கிறது; அழைப்புவேற்றுமை வடிவம் நேரடி வேண்டுதலை வெளிப்படுத்துகிறது.
- source_word: הֵעֲבַרְתָּ הַעֲבִיר
  choice: கடக்கச் செய்தீர்
  rationale: ஹிப்இல் வடிவத்தின் காரணவினைப் பொருளைத் தெளிவாகக் காட்டுகிறது. வினையுடன் வரும் infinitive absolute தரும் வலியுறுத்தல், தொடர்ந்து வரும் நோக்கக் கேள்வியின் தீவிரத்தால் தமிழில் வெளிப்படுகிறது.
- source_word: אֶת־הָעָם הַזֶּה
  choice: இந்த மக்களை
  rationale: עָם என்பதன் கூட்டுப்பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: לָתֵת אֹתָנוּ בְּיַד הָאֱמֹרִי
  choice: எங்களை எமோரியரின் கையில் ஒப்படைத்து
  rationale: ‘கையில் கொடுத்தல்’ என்ற எபிரேய அதிகார உருவகத்தைத் தக்கவைத்தபடியே, அதன் ஒப்படைத்தல் பொருளை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: לְהַאֲבִידֵנוּ
  choice: அழித்துப்போடுவதற்காக
  rationale: முழுமையான அழிவின் கடுமையை நேரடியாக வெளிப்படுத்துகிறது.
- source_word: וְלוּ הוֹאַלְנוּ וַנֵּשֶׁב
  choice: குடியிருக்க மனமுள்ளவர்களாய் இருந்திருக்கக் கூடாதா
  rationale: לוּ அறிமுகப்படுத்தும் நிறைவேறாத விருப்பத்தையும் הוֹאַלְנוּ என்பதிலுள்ள மனவிருப்பம்/இசைவு உணர்வையும் காக்கிறது; ‘திருப்தியாய்’ என்ற ஆதாரமற்ற பொருளைத் தவிர்க்கிறது.
- source_word: בְּעֵבֶר הַיַּרְדֵּן
  choice: யோர்தானுக்கு அப்பாலேயே
  rationale: பேசுபவரின் தற்போதைய மேற்குக் கரை நோக்கிலிருந்து ஆற்றின் மறுபக்கத்தைச் சுட்டுகிறது; ‘ஏ’ வலியுறுத்தல் அங்கேயே தங்கியிருக்க வேண்டுமென்ற ஏக்கத்தைத் தருகிறது.
theological_decisions:
- issue: אֲדֹנָי יְהוִה என்ற கூட்டு இறை அழைப்பை மொழிபெயர்த்தல்
  choice: ஆண்டவராகிய யெகோவாவே
  alternative: ஆண்டவராகிய கர்த்தரே / ஆண்டவராகிய யாவே
  rationale: மூலத்தில் அதிகாரப் பட்டமும் நான்கெழுத்து இறைப் பெயரும் இரண்டும் உள்ளன. தேர்ந்த வடிவம் அவற்றை ஒன்றாக்காமல் வேறுபடுத்துகிறது; தமிழ் வாசகர்களுக்குப் பரவலாக அறிமுகமான ‘யெகோவா’ ஒலிபெயர்ப்பு பயன்படுத்தப்படுகிறது. மூல வாசிப்பை அடிக்குறிப்பு தெளிவுபடுத்துகிறது.
- issue: யோசுவாவின் கேள்வியின் இறையியல் பதற்றம்
  choice: குற்றச்சாட்டு போன்ற புலம்பலின் நேரடியான வலிமையைத் தக்கவைத்தல்
  alternative: மரியாதைக்காக கேள்வியை மென்மைப்படுத்துதல்
  rationale: மூலம் யோசுவாவின் அதிர்ச்சியையும் கடவுளிடம் எழுப்பும் கடுமையான ‘ஏன்’ கேள்வியையும் மறைக்கவில்லை; மொழிபெயர்ப்பும் அதை விளக்கிச் சமனாக்காமல் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், நேரடியானதாயும் கண்ணியமானதாயும் அமைந்த புலம்பல் நடை. ‘செய்தீர்’ போன்ற மரியாதை ஒருமை இறைமுகப்பைப் பேணுகிறது; ‘மனமுள்ளவர்களாய்’ என்பது இலக்கியத் தன்மை இருந்தாலும் சாதாரண வாசகருக்குப் புரியும் வகையில் וְלוּ הוֹאַלְנוּ என்பதன் விருப்ப/இசைவு நுணுக்கத்தைத் தக்கவைக்கிறது.
