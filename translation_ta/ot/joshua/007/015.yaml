base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/015.yaml
  text: And the one who is taken with the devoted thing shall be burned with fire[a], he and all that belongs to him, because he has transgressed the covenant of Yahweh and because he has done an outrageous thing in Israel.
translation:
  language: ta
  text: அழிவுக்கென்று அர்ப்பணிக்கப்பட்ட பொருளுடன்[a] எவன் அகப்படுகிறானோ, அவனும் அவனுக்குரிய அனைத்தும் நெருப்பால் எரிக்கப்பட வேண்டும். ஏனெனில், அவன் யாவேயின் உடன்படிக்கையை மீறி, இஸ்ரவேலில் வெட்கக்கேடான செயலைச் செய்திருக்கிறான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, பாரம்பரியமாக, “சாபத்திற்குள்ளான பொருளுடன்.” எபிரெயத்தில் חֵרֶם (ḥērem); இது தெய்வீகத் தடையின் கீழ் வைக்கப்பட்டு அழிவுக்கென்று அர்ப்பணிக்கப்பட்ட ஒன்றைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנִּלְכָּד
  choice: எவன் அகப்படுகிறானோ
  rationale: לכד என்பதன் செயப்பாட்டு வடிவம், பரிசுத்தச் சீட்டு அல்லது விசாரணை முறையில் குற்றவாளியாக அடையாளம் காணப்படுகிறவனைக் குறிக்கிறது. ‘அகப்படுகிறான்’ என்பது போரில் சிறைப்பிடிக்கப்படுதல் என்று தேவையின்றி பொருள் கொள்ளாமல், குற்றம் வெளிப்படுவதை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: בַּחֵרֶם
  choice: அழிவுக்கென்று அர்ப்பணிக்கப்பட்ட பொருளுடன்
  rationale: חֵרֶם என்பது சாதாரண பயன்பாட்டிலிருந்து விலக்கப்பட்டு, கடவுளுக்கென ஒதுக்கப்பட்டு, பெரும்பாலும் அழிக்கப்பட வேண்டிய ஒன்றைக் குறிக்கிறது. இந்த மொழிபெயர்ப்பு அர்ப்பணிப்பு மற்றும் அழிவு ஆகிய இரு கருத்துகளையும் காக்கிறது; בְּ என்ற முன்னிடைச்சொல்லின் தொடர்புப் பொருளை ‘உடன்’ வெளிப்படுத்துகிறது.
- source_word: יִשָּׂרֵף בָּאֵשׁ
  choice: நெருப்பால் எரிக்கப்பட வேண்டும்
  rationale: செயப்பாட்டு வினையையும், நெருப்பைச் செயலின் கருவியாகக் காட்டும் எபிரெயச் சொற்றொடரையும் நேரடியாகவும் இயல்பாகவும் வழங்குகிறது.
- source_word: אֹתוֹ וְאֶת כָּל אֲשֶׁר לוֹ
  choice: அவனும் அவனுக்குரிய அனைத்தும்
  rationale: குற்றவாளியையும் அவனுக்குரிய அனைத்தையும் உள்ளடக்கும் மூலமொழியின் விரிந்த, திட்டவட்டமாக வரையறுக்கப்படாத பொருளைத் தக்கவைக்கிறது.
- source_word: עָבַר אֶת בְּרִית יְהוָה
  choice: யாவேயின் உடன்படிக்கையை மீறி
  rationale: עבר என்பது உடன்படிக்கையின் எல்லையை மீறுதல் அல்லது அதை உடைத்தல் என்ற சட்டப்பூர்வமான உடன்படிக்கைச் சார்ந்த கருத்தைத் தருகிறது. ‘மீறி’ என்பது இதை இயல்பான நவீன தமிழில் வழங்குகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரான நான்கெழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் அதன் பரவலான ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: נְבָלָה
  choice: வெட்கக்கேடான செயல்
  rationale: இச்சொல் வெறும் அறிவீனத்தையல்ல, சமூகத்திலும் உடன்படிக்கைச் சூழலிலும் தார்மீக அதிர்ச்சியையும் இழிவையும் ஏற்படுத்தும் செயலைக் குறிக்கிறது. ‘வெட்கக்கேடான செயல்’ அந்த ஒழுக்க வலிமையை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: בְּיִשְׂרָאֵל
  choice: இஸ்ரவேலில்
  rationale: குற்றம் உடன்படிக்கைச் சமூகத்திற்குள் செய்யப்பட்டதைச் சுட்டும் இடப்பொருளை நேரடியாகக் காக்கிறது.
theological_decisions:
- issue: உடன்படிக்கைத் தீர்ப்பின் சூழலில் חֵרֶם என்பதன் மொழிபெயர்ப்பு
  choice: அழிவுக்கென்று அர்ப்பணிக்கப்பட்ட பொருள்
  alternative: சாபத்திற்குள்ளான பொருள்; அழிப்பதற்கென ஒதுக்கப்பட்ட பொருள்; தடைக்குட்பட்ட பொருள்
  rationale: இச்சொல் தெய்வீகத் தடையின் கீழ் வைக்கப்பட்டு, கடவுளுக்கென ஒதுக்கப்பட்டதால் சாதாரண பயன்பாட்டுக்கு உரியதல்லாத ஒன்றைக் குறிக்கிறது. தேர்ந்தெடுக்கப்பட்ட மொழியாக்கம் அதன் அர்ப்பணிப்பு நிலையையும் அதனோடு இணைந்த அழிவையும் வெளிப்படுத்துகிறது; பாரம்பரிய மாற்று அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: יְהוָה என்ற தெய்வீகப் பெயரை வழங்குதல்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலத்தில் உள்ள தனிப்பட்ட தெய்வீகப் பெயரை ஒரு பொதுப்பட்டத்தால் மாற்றாமல் ஒலிபெயர்த்து, உரையின் பெயர் சார்ந்த தன்மையைத் தக்கவைக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளும் வகையில் கண்ணியமான நடையில் அமைக்கப்பட்டுள்ளது. ‘எவன் … அகப்படுகிறானோ’ என்ற அமைப்பு எபிரெய வாக்கியத்தின் நிபந்தனைத் தன்மையை இயல்பாகக் காக்கிறது. ‘அவனுக்குரிய அனைத்தும்’ என்பது யாரெல்லாம் அல்லது எவையெல்லாம் இதில் அடங்கும் என்பதை உரை கூறுவதைக் கடந்துத் தீர்மானிக்காமல் அதன் பரப்பைத் திறந்தவாறே வைக்கிறது.
