base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/003.yaml
  text: They returned to Joshua and said to him[a], “Do not have all the people go up. Let about two thousand men, or about three thousand men, go up and strike Ai. Do not weary all the people there[b], for they are few.”
translation:
  language: ta
  text: அவர்கள் யோசுவாவிடம் திரும்பிவந்து, “மக்கள்[a] எல்லாரும் ஏறிப்போக வேண்டாம். ஏறக்குறைய இரண்டாயிரம் பேர் அல்லது ஏறக்குறைய மூவாயிரம் பேர் ஏறிப்போய் ஆயியைத் தாக்கட்டும். மக்கள் எல்லாரையும் அங்கே களைப்படையச் செய்ய வேண்டாம்[b]; ஏனெனில் அவர்கள் சிலரே” என்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இங்கு ‘மக்கள்’ என்பது சூழலின்படி குறிப்பாகப் போருக்குச் செல்லும் படையினரைக் குறிக்கலாம்; ‘படைவீரர்கள்’ அல்லது ‘படை’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘மக்கள் எல்லாரையும் அங்கே சிரமப்பட வைக்க வேண்டாம்.’ எபிரெய வினைச்சொல் தேவையற்ற முயற்சியால் களைப்பையோ சுமையையோ உண்டாக்குவதைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֻׁבוּ אֶל־יְהוֹשֻׁעַ
  choice: அவர்கள் யோசுவாவிடம் திரும்பிவந்து
  rationale: שוב என்பதன் திரும்பிவருதல் என்ற இயக்கப் பொருளையும், தொடர்ச்சியான எபிரெயக் கதைநடையையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: אַל־יַעַל כָּל־הָעָם
  choice: மக்கள் எல்லாரும் ஏறிப்போக வேண்டாம்
  rationale: אַל உடனான வினை வடிவம் தடை அல்லது அறிவுரையைத் தெரிவிக்கிறது. עלה என்பதன் நிலவியல் மற்றும் படைநடவடிக்கை சார்ந்த ‘மேலே போதல்’ என்ற படிமத்தை ‘ஏறிப்போக’ தக்கவைக்கிறது.
- source_word: הָעָם
  choice: மக்கள்
  rationale: சூழலில் போரிடும் படையினரைக் குறிக்கக்கூடும்; இருப்பினும் எபிரெயச் சொல்லின் விரிவான பொருளைச் சுருக்காமல் ‘மக்கள்’ என வைக்கப்பட்டுள்ளது.
- source_word: כְּאַלְפַּיִם אִישׁ אוֹ כִּשְׁלֹשֶׁת אֲלָפִים אִישׁ
  choice: ஏறக்குறைய இரண்டாயிரம் பேர் அல்லது மூவாயிரம் பேர்
  rationale: כ முன்னொட்டு இங்கு தோராயமான எண்ணிக்கையைக் குறிக்கிறது. போருக்குச் செல்லும் ஆண்கள் என்பது சூழலில் தெளிவாக இருப்பதால் אִישׁ என்பதற்கு இயல்பான ‘பேர்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: יַעֲלוּ וְיַכּוּ אֶת־הָעָי
  choice: ஏறிப்போய் ஆயியைத் தாக்கட்டும்
  rationale: עלה என்பதுடன் உள்ள மீளுருவாக்கத்தைப் பேணுகிறது; נכה என்பதற்கு வெற்றி உறுதி செய்யப்பட்டதாகச் சொல்லாத ‘தாக்கு’ என்ற சூழலுக்கேற்ற சொல் தேர்ந்தெடுக்கப்பட்டுள்ளது.
- source_word: אַל־תְּיַגַּע שָׁמָּה אֶת־כָּל־הָעָם
  choice: மக்கள் எல்லாரையும் அங்கே சிரமப்பட வைக்க வேண்டாம்
  rationale: יגע என்பதன் பியேல் வடிவம் உழைப்பால் களைப்படைய அல்லது சிரமப்படச் செய்வதைக் குறிக்கிறது. தமிழில் காரணவினைப் பொருளைத் தெளிவாக வெளிப்படுத்த ‘சிரமப்பட வைக்க’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: כִּי מְעַט הֵמָּה
  choice: ஏனெனில் அவர்கள் சிலரே
  rationale: சுருக்கமான எபிரெயச் சொற்றொடரையும் பன்மைச் சுட்டுப்பெயரையும் பேணி, எண்ணிக்கையில் குறைவானவர்கள் என்ற பொருளை இயல்பான தமிழில் தருகிறது.
theological_decisions:
- issue: כִּי מְעַט הֵמָּה என்பதில் ‘அவர்கள்’ யாரைக் குறிக்கிறது
  choice: அவர்கள் சிலரே
  alternative: ஆயியின் மக்கள் சிலரே
  rationale: சூழல் ஆயியின் குடிகளையோ பாதுகாவலர்களையோ சுட்டினாலும், மூலத்தில் பெயர்ச்சொல் வெளிப்படையாக இல்லை. எனவே சுட்டுப்பெயரின் இயல்பான மறைபொருளையும் சிறிய தெளிவின்மையையும் பிரதான உரை பேணுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘ஏறிப்போக’ என்ற மீளுருவாக்கம் மூலத்தின் நிலவியல்/படைநடவடிக்கைச் சொல்லாட்சியைப் பேணுகிறது; ‘ஆயி’ வழக்கமான தமிழ் வேதாகம இடப்பெயர் வடிவமாக வைக்கப்பட்டுள்ளது.
