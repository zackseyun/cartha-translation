base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/014.yaml
  text: In the morning you shall come near by your tribes[a], and it shall be that the tribe that Yahweh selects shall come near by clans, and the clan that Yahweh selects shall come near by households[b], and the household that Yahweh selects shall come near man by man.
translation:
  language: ta
  text: காலையில் நீங்கள் உங்கள் கோத்திரங்களின்படி முன்வர வேண்டும். அப்போது யாவே தேர்ந்தெடுக்கும் கோத்திரம்[a] குலங்களின்படி முன்வர வேண்டும்; யாவே தேர்ந்தெடுக்கும் குலம் குடும்பங்களின்படி முன்வர வேண்டும்; யாவே தேர்ந்தெடுக்கும் குடும்பம் ஆண்கள் ஒவ்வொருவராக[b] முன்வர வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பிடிக்கிறாரோ.” எபிரெய வினைச்சொல் “பிடித்தல்” அல்லது “கைப்பற்றுதல்” எனவும் பொருள்படும்; இங்கு யாவே குறித்துக் காட்டும் கோத்திரம், குலம் அல்லது குடும்பத்தைக் குறிக்கிறது; இது பரிசுத்த சீட்டின் மூலம் நடந்திருக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில், “ஆண்களின்படி”; குடும்பத்துக்குள் உள்ள ஆண்கள் ஒவ்வொருவராக இறுதியில் அடையாளம் காணப்படுவதை இது குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנִקְרַבְתֶּם / יִקְרַב / תִּקְרַב
  choice: முன்வர வேண்டும்
  rationale: קרב என்பதன் முறையான அணுகுதல் அல்லது தம்மை முன்நிறுத்துதல் என்ற பொருளை இயல்பான தமிழில் தருகிறது; வசனம் முழுவதும் வரும் வினைச்சொல் மறுமொழியையும் காக்கிறது.
- source_word: לְשִׁבְטֵיכֶם
  choice: உங்கள் கோத்திரங்களின்படி
  rationale: ஒழுங்குபடுத்தப்பட்ட குழுவாரியான முன்வருதலைக் குறிக்கும் பகிர்வுப் பொருளைத் தெளிவாகத் தருகிறது.
- source_word: יִלְכְּדֶנּוּ / יִלְכְּדֶנָּה
  choice: யாரைத் தேர்ந்தெடுக்கிறாரோ
  rationale: לכד என்பதன் அடிப்படைப் பொருள் ‘பிடித்தல்/கைப்பற்றுதல்’; இச்சூழலில் பரிசுத்த சீட்டின் வழியாகக் குறித்துக் காட்டப்படும் குழுவைக் குறிப்பதால் ‘தேர்ந்தெடுக்கிறார்’ என்பது நடைமுறைப் பொருளைத் தருகிறது. அடிப்படைச் சொற்பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய தனிப்பெயரான நான்கெழுத்துத் திருப்பெயரை ஒரு பட்டமாக மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: לַמִּשְׁפָּחוֹת
  choice: குலங்களின்படி
  rationale: מִשְׁפָּחָה இங்கு கோத்திரத்தைவிடச் சிறியதும் தனிக் குடும்பத்தைவிடப் பெரியதுமான சமூகப் பிரிவைக் குறிக்கிறது.
- source_word: לַבָּתִּים
  choice: குடும்பங்களின்படி
  rationale: בַּיִת இங்கு கட்டிடங்களை அல்ல, குலத்துக்குள் உள்ள குடும்ப அல்லது வீட்டார் அலகுகளைக் குறிக்கிறது.
- source_word: לַגְּבָרִים
  choice: ஆண் ஆணாக
  rationale: גְּבָרִים என்பதன் ஆண்பால் மற்றும் ஒவ்வொருவராக என்ற பகிர்வுப் பொருளைத் துல்லியமாகக் காக்கிறது.
- source_word: וְהָיָה
  choice: அப்போது
  rationale: அடுத்து நிகழ வேண்டிய நடைமுறை விளைவை இயல்பான நவீன தமிழில் அறிமுகப்படுத்துகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலத்தில் வரும் உடன்படிக்கைத் தனிப்பெயரைப் பட்டத்தால் மாற்றாமல் ஒலிபெயர்க்கிறது.
- issue: לכד என்ற வினைச்சொல்லின் சூழல்சார் பொருள்
  choice: தேர்ந்தெடுக்கிறார்
  alternative: பிடிக்கிறார் / கைப்பற்றுகிறார்
  rationale: இங்கு உடல் ரீதியான பிடித்தலைவிட தெய்வீக அடையாளப்படுத்தல் அல்லது சீட்டுத் தேர்வு நடைமுறை கருதப்படுகிறது; இருப்பினும் மூலச்சொல்லின் வலிமை அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. கோத்திரம் → குலம் → குடும்பம் → தனி ஆண் என்ற குறுகிவரும் அமைப்பும், ‘முன்வர வேண்டும்’ என்ற மறுமொழியும் காக்கப்பட்டுள்ளன.
