- from: பின்பு அவர் அவனுடைய குடும்பத்தாரை ஆண் ஆணாக[a] அணுகிவரச் செய்தார். அப்போது யூதா கோத்திரத்தைச் சேர்ந்த, சேராவின் மகன் சப்தியின் மகன் கர்மியின் மகனான ஆகான் அகப்பட்டான்.
  to: பின்பு அவர் அவனுடைய குடும்பத்தாரை ஒவ்வோர் ஆணாக[a] முன்வரச் செய்தார். அப்போது, சேராவின் மகன் சப்தியின் மகன் கர்மியின் மகனான, யூதா கோத்திரத்தைச் சேர்ந்த ஆகான் அகப்பட்டான்.
