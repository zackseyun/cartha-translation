base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/018.yaml
  text: Then he brought his household near man by man[a], and Achan son of Carmi, son of Zabdi, son of Zerah, of the tribe of Judah, was taken.
translation:
  language: ta
  text: பின்பு அவர் அவனுடைய குடும்பத்தாரை ஒவ்வோர் ஆணாக[a] முன்வரச் செய்தார். அப்போது, சேராவின் மகன் சப்தியின் மகன் கர்மியின் மகனான, யூதா கோத்திரத்தைச் சேர்ந்த ஆகான் அகப்பட்டான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஆண்களின்படி.” எபிரெயச் சொற்றொடர் சுருக்கமானது; சீட்டுப்போடும் நடைமுறைக்காக அந்தக் குடும்பத்தார் ஆண் பிரிவுகளாக முன்வரச் செய்யப்பட்டதை இது குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּקְרֵב
  choice: அணுகிவரச் செய்தார்
  rationale: קרב என்பதன் ஹிஃபில் வடிவம் ‘அருகே கொண்டுவருதல்’ அல்லது ‘முன்னிறுத்துதல்’ என்று பொருள்படும். சீட்டினால் அடையாளம் காணும் சூழலில், எபிரெயச் சொல்லின் இயக்கத்தையும் நடைமுறையையும் இத்தேர்வு காக்கிறது.
- source_word: בֵּיתוֹ
  choice: அவனுடைய குடும்பத்தார்
  rationale: בַּיִת இங்கு கட்டடத்தைக் குறிக்காமல் குடும்ப அலகைக் குறிக்கிறது. ‘குடும்பத்தார்’ என்பது முன்வரச் செய்யப்பட்ட நபர்களையும் இயல்பாகக் குறிக்கிறது.
- source_word: לַגְּבָרִים
  choice: ஆண் ஆணாக
  rationale: இந்தச் சுருக்கமான எபிரெயச் சொற்றொடர் குடும்பம் தனித்தனி ஆண்களாக அல்லது ஆண் பிரிவுகளாக முன்வரச் செய்யப்பட்டதைச் சுட்டலாம். அதன் நடைமுறைப் பொருளையும் ஆண்பால் பன்மையையும் ‘ஆண் ஆணாக’ காக்கிறது.
- source_word: וַיִּלָּכֵד
  choice: அகப்பட்டான்
  rationale: לכד என்பதன் நிஃபால் வடிவத்தின் அடிப்படைப் பொருள் ‘பிடிபடுதல்/அகப்படுதல்.’ சீட்டினால் அடையாளம் காணப்பட்ட சூழலை மிகையாக விளக்காமல், அதிகாரத்தில் திரும்ப வரும் எபிரெய மரபுத்தொடரை ‘அகப்பட்டான்’ காக்கிறது.
- source_word: עָכָן
  choice: ஆகான்
  rationale: எபிரெயத் தனிப்பெயரின் ஒலியை நவீனத் தமிழில் தெளிவாக எழுத்துப்பெயர்க்கிறது.
- source_word: בֶּן כַּרְמִי בֶן זַבְדִּי בֶּן זֶרַח
  choice: சேராவின் மகன் சப்தியின் மகன் கர்மியின் மகனான
  rationale: எபிரெயில் தரப்பட்டுள்ள முழு வம்சத் தொடரைத் தமிழில் இயல்பான தலைமுறை வரிசையில் பாதுகாக்கிறது; இதனால் ஆகான் கர்மியின் மகன், கர்மி சப்தியின் மகன், சப்தி சேராவின் மகன் என்பது தெளிவாகிறது.
- source_word: לְמַטֵּה יְהוּדָה
  choice: யூதா கோத்திரத்தைச் சேர்ந்த
  rationale: מַטֶּה இங்கு ‘கோத்திரம்’ எனப் பொருள்படும். இந்தத் தேர்வு யூதாவுடனான கோத்திரச் சார்பைத் தெளிவாகத் தெரிவிக்கிறது.
