translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. ‘ஆண் ஆணாக’ என்ற சற்றே இறுக்கமான தொடர் மூலத்தின் சுருக்கத்தையும் தெளிவின்மையையும் காக்கிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
