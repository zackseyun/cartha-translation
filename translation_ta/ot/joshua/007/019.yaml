base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/019.yaml
  text: Then Joshua said to Achan[a], “My son, please give glory to Yahweh, the God of Israel, and give thanks to him. Please tell me what you have done; do not hide it from me.”
translation:
  language: ta
  text: அப்போது யோசுவா ஆகானிடம், “என் மகனே, தயவுசெய்து இஸ்ரவேலின் கடவுளாகிய யாவேக்கு மகிமை செலுத்து; அவருக்கு நன்றி செலுத்து[a]. நீ என்ன செய்தாய் என்பதைத் தயவுசெய்து என்னிடம் சொல்; அதை என்னிடமிருந்து மறைக்காதே” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவரைத் துதி செய்”; இச்சூழலில், “அவரிடம் உண்மையை அறிக்கையிடு” அல்லது “அவரிடம் ஒப்புக்கொள்” என்றும் பொருள்படலாம்.
    reason: תּוֹדָה என்ற எபிரேயச் சொல்லின் நன்றி, துதி, அறிக்கை/ஒப்புதல் ஆகிய பொருள் வாய்ப்புகளைப் பாதுகாக்கிறது.
lexical_decisions:
- source_word: בְּנִי
  choice: என் மகனே
  rationale: ஆண்பால் ஒருமை அழைப்பையும், யோசுவாவின் தந்தைபோன்ற தனிப்பட்ட வேண்டுகோள் தொனியையும் இயல்பான தமிழில் காக்கிறது.
- source_word: שִׂים נָא כָבוֹד
  choice: தயவுசெய்து ... மகிமை செலுத்தி
  rationale: சொல்லடியாக ‘மகிமையை வை’ என்ற எபிரேய மரபுத்தொடர், கடவுளின் மகிமையை ஒப்புக்கொள்ளுமாறு அழைக்கும் பொருளில் தமிழில் இயல்பாக வழங்கப்பட்டுள்ளது; נָא என்பதன் வேண்டுகோள் தொனியும் காக்கப்பட்டுள்ளது.
- source_word: לַיהוָה אֱלֹהֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் கடவுளாகிய யாவேக்கு
  rationale: தெய்வீகப் பெயரான יהוה என்பதை பொதுப்பட்டமாக மாற்றாமல் ‘யாவே’ என்று ஒலிபெயர்த்து, construct தொடரை இயல்பான தமிழில் வழங்குகிறது.
- source_word: וְתֶן לוֹ תוֹדָה
  choice: அவருக்கு நன்றி செலுத்து[a]
  rationale: תּוֹדָה என்பதன் நேரடியான நன்றி/நன்றியறிக்கை பொருளை முதன்மை உரையில் காக்கிறது. விசாரணைச் சூழலில் அதற்கு இருக்கக்கூடிய அறிக்கையிடுதல் அல்லது ஒப்புக்கொள்ளுதல் நிழற்பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: וְהַגֶּד נָא לִי
  choice: தயவுசெய்து என்னிடம் சொல்
  rationale: Hiphil கட்டளையின் ‘தெரிவி/சொல்’ பொருளையும் נָא என்பதன் பணிவான வேண்டுகோளையும் தெளிவான நவீன தமிழில் தருகிறது.
- source_word: מֶה עָשִׂיתָ
  choice: நீ என்ன செய்தாய் என்பதை
  rationale: முடிந்த செயலைக் குறிக்கும் எபிரேய வடிவத்தை இயல்பான தமிழ் இறந்தகால வினாவாக வழங்குகிறது.
- source_word: אַל תְּכַחֵד מִמֶּנִּי
  choice: அதை என்னிடமிருந்து மறைக்காதே
  rationale: כחד என்பதன் மறைத்தல் அல்லது ஒளித்துவைத்தல் பொருளை நேரடியாகக் காக்கிறது; தமிழில் தேவைப்படும் ‘அதை’ முன்சொல்லப்பட்ட செயலைச் சுட்டுகிறது.
theological_decisions:
- issue: ஒப்புதல் சூழலில் תּוֹדָה என்பதன் பொருள்
  choice: முதன்மை உரையில் ‘அவருக்கு நன்றி செலுத்து’
  alternative: ‘அவரிடம் அறிக்கையிடு’ அல்லது ‘அவரிடம் ஒப்புக்கொள்’
  rationale: இந்தச் சொல் நன்றி, துதி, அல்லது சில சூழல்களில் அறிக்கை/ஒப்புதல் ஆகியவற்றைக் குறிக்கலாம். ஆகானிடம் உண்மையைச் சொல்லுமாறு கேட்கப்படும் சூழல் ஒப்புதல் நிழற்பொருளை வலுப்படுத்தினாலும், அதை மட்டும் முதன்மை உரையில் நிர்ணயிக்காமல் எபிரேயத்தின் உண்மையான பொருள் விரிவை அடிக்குறிப்பில் காக்கிறது.
translation_notes:
  register: நவீன தரத்தமிழில், மரியாதையும் வேதாகம உரைக்கேற்ற கண்ணியமும் கொண்ட நேரடியான நடை பயன்படுத்தப்பட்டுள்ளது. யோசுவாவின் இரக்கமுள்ள அழைப்பையும் அதே நேரத்தில் விசாரணையின் தீவிரத்தையும் காக்கிறது.
