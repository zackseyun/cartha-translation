source:
  edition: WLC
  text: וַ/יֹּ֧אמֶר יְהוָ֛ה אֶל יְהוֹשֻׁ֖עַ קֻ֣ם לָ֑/ךְ לָ֣/מָּה זֶּ֔ה אַתָּ֖ה נֹפֵ֥ל עַל פָּנֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/010.yaml
  text: Yahweh said to Joshua[a], “Get up[b]. Why are you falling on your face?”
translation:
  language: ta
  text: யாவே யோசுவாவிடம், “எழுந்திரு! நீ ஏன் இப்படி முகங்குப்புற விழுந்து கிடக்கிறாய்?” என்றார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைபெயரான நான்கு எழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் பரவலாக அறியப்படும் ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: וַיֹּאמֶר
  choice: என்றார்
  rationale: எபிரெயக் கதைநடையில் אמר என்பதற்குரிய இயல்பான தமிழ் சொல்லாக்கம்; நேர்கூற்றுக்குப் பின் வருவது தமிழில் சரளமாக உள்ளது.
- source_word: יְהוֹשֻׁעַ
  choice: யோசுவா
  rationale: இப்பெயரின் நிலைபெற்ற தமிழ் வடிவம்.
- source_word: קֻם לָךְ
  choice: எழுந்திரு
  rationale: קום என்ற கட்டளையின் நேரடியான, இயல்பான தமிழ் வடிவம். לָךְ இங்கு கட்டளையை வலுப்படுத்தும் மரபுத்தொடர் என்பதால் தனியே மொழிபெயர்க்கப்படவில்லை.
- source_word: לָמָּה זֶּה
  choice: இப்படி … ஏன்
  rationale: לָמָּה என்பதன் ‘ஏன்’ என்ற கேள்வியையும், זֶּה தரும் சுட்டுதல் அல்லது வலியுறுத்தலையும் இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: אַתָּה
  choice: நீ
  rationale: மூலத்தில் வெளிப்படையாக உள்ள முன்னிலைப் பெயரைத் தக்கவைத்து உரையின் நேரடியான வலியுறுத்தலைப் பாதுகாக்கிறது.
- source_word: נֹפֵל עַל־פָּנֶיךָ
  choice: முகங்குப்புற விழுந்துகிடப்பது
  rationale: பங்கேற்புவினை சுட்டும் தொடர்நிலையையும், முகத்தைத் தரையில் வைத்துப் பணிந்திருக்கும் உடல்நிலையையும் தமிழில் தெளிவாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைபெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூலவசனம் பட்டத்தை அல்ல, இறைவனின் தனிப்பெயரைப் பயன்படுத்துகிறது; ஆகவே அந்த வேறுபாட்டை ஒலிபெயர்ப்பின் மூலம் காக்கிறது.
- issue: யோசுவாவின் உடல்நிலையை விவரித்தல்
  choice: விழுந்துகிடப்பது
  alternative: விழுவது
  rationale: נֹפֵל என்ற பங்கேற்புவினை நிகழும் செயல் அல்லது நீடிக்கும் நிலை என்ற இரண்டையும் அனுமதிக்கிறது. முந்தைய சூழலில் யோசுவா ஏற்கெனவே முகங்குப்புறக் கிடப்பதால், நீடிக்கும் நிலையை இயல்பாக வெளிப்படுத்தும் சொல்லாக்கம் தேர்ந்தெடுக்கப்பட்டது.
translation_notes:
  register: நவீன நிலையான தமிழில், சுருக்கமானதும் கண்ணியமானதும் நேரடியானதுமான இறைவாக்காக வடிவமைக்கப்பட்டது. ‘இப்படி … ஏன்’ என்பது எபிரெயத்தின் வலியுறுத்தலைப் பேச்சுத் தமிழாகத் தாழ்த்தாமல் இயல்பாகக் காக்கிறது.
