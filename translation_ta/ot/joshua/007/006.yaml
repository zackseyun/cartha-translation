  text: וַ/יִּקְרַ֨ע יְהוֹשֻׁ֜עַ שִׂמְלֹתָ֗י/ו וַ/יִּפֹּל֩ עַל פָּנָ֨י/ו אַ֜רְצָ/ה לִ/פְנֵ֨י אֲר֤וֹן יְהוָה֙ עַד הָ/עֶ֔רֶב ה֖וּא וְ/זִקְנֵ֣י יִשְׂרָאֵ֑ל וַ/יַּעֲל֥וּ עָפָ֖ר עַל רֹאשָֽׁ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/006.yaml
  text: Then Joshua tore his clothes and fell facedown to the ground before the ark of Yahweh until evening[a], he and the elders of Israel[b], and they put dust on their heads.
translation:
  language: ta
  text: அப்போது யோசுவா தன் ஆடைகளைக் கிழித்தார்; அவரும் இஸ்ரவேலின் மூப்பர்களும் யாவேயின் பெட்டிக்கு முன்பாகத் தரையில் முகங்குப்புற விழுந்து மாலைவரை இருந்தார்கள்[a]; அவர்கள் தங்கள் தலைகளின்மேல் புழுதியைப் போட்டுக்கொண்டார்கள்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் “அவரும் இஸ்ரவேலின் மூப்பர்களும்” என்பது யோசுவாவுடன் மூப்பர்களையும் இணைத்துக் குறிப்பிடுகிறது; அவர்கள் முன் கூறப்பட்ட செயலில் பங்கேற்றதை இவ்வாக்கியம் தெரிவிக்கிறது.
    reason: alternative_reading
  - marker: b
    text: தலையில் புழுதியைப் போட்டுக்கொள்வது துயரம், அவமானம் அல்லது புலம்பலை வெளிப்படுத்திய வழக்கமான அடையாளம்.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּקְרַע ... שִׂמְלֹתָיו
  choice: தன் ஆடைகளைக் கிழித்தார்
  rationale: துயரம் அல்லது கடும் மனவேதனையை வெளிப்படுத்த ஆடைகளைக் கிழிக்கும் உறுதியான செயலை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: וַיִּפֹּל עַל־פָּנָיו אַרְצָה
  choice: தரையில் முகங்குப்புற விழுந்து
  rationale: முகம் தரையை நோக்கியபடி முழுமையாகப் பணிந்து கிடக்கும் உடல்நிலையைத் தெளிவாகக் காட்டுகிறது.
- source_word: לִפְנֵי אֲרוֹן יְהוָה
  choice: யாவேயின் உடன்படிக்கைப் பெட்டிக்கு முன்பாக
  rationale: לִפְנֵי என்பதன் ‘முன்பாக/சந்நிதியில்’ என்ற பொருளையும், இச்சூழலில் אֲרוֹן குறிக்கும் புனித உடன்படிக்கைப் பெட்டியையும் தெளிவாக வழங்குகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரை ஒரு பட்டப்பெயரால் மாற்றாமல், எபிரெய நான்கெழுத்துப் பெயரின் பரவலாக ஏற்கப்பட்ட ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: עַד הָעֶרֶב
  choice: மாலைவரை
  rationale: கால எல்லையைக் குறிக்கும் எளிய, இயல்பான தமிழ் வடிவம்.
- source_word: הוּא וְזִקְנֵי יִשְׂרָאֵל
  choice: அவரும் இஸ்ரவேலின் மூப்பர்களும்
  rationale: யோசுவாவுடன் மூப்பர்களும் பணிந்து கிடந்தார்கள் என்பதை எபிரெயின் இணைப்புக் கட்டமைப்புக்கு ஏற்ப தெரிவிக்கிறது.
- source_word: וַיַּעֲלוּ עָפָר עַל־רֹאשָׁם
  choice: தங்கள் தலைகள்மேல் புழுதியைப் போட்டுக்கொண்டார்கள்
  rationale: சொல்லுக்குச் சொல் ‘புழுதியை மேலே ஏற்றினார்கள்’ என்பதற்குப் பதிலாக, அந்தத் துக்கச் செயலை இயல்பான தமிழில் தெரிவிக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூல உரை இறைவனின் தனிப்பட்ட பெயரைப் பயன்படுத்துவதால், அதை ஒரு பொதுவான பட்டப்பெயராக மாற்றாமல் ஒலிபெயர்த்துள்ளது.
- issue: யோசுவாவும் மூப்பர்களும் செய்த பணிவுச் செயல்
  choice: அவரும் மூப்பர்களும் முகங்குப்புற விழுந்து மாலைவரை இருந்தார்கள்
  alternative: யோசுவா மட்டும் முகங்குப்புற விழுந்தார்; மூப்பர்கள் வேறு விதமாக இணைந்தனர்
  rationale: הוּא וְזִקְנֵי יִשְׂרָאֵל என்ற பின்வரும் இணைப்பு, முன் கூறப்பட்ட செயலில் யோசுவாவோடு மூப்பர்களும் பங்கேற்றதை இயல்பாகக் குறிக்கிறது; எனினும் எபிரெய வாக்கியம் இலக்கண ரீதியாகச் சுருக்கமாக உள்ளது.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் வடிவமைக்கப்பட்டுள்ளது. ‘முகங்குப்புற’ என்பது பணிவின் உடல்நிலையைத் தெளிவாகக் காட்டுகிறது; ‘புழுதியைப் போட்டுக்கொண்டார்கள்’ என்பது செயற்கையான சொற்சொல் மொழிபெயர்ப்பைத் தவிர்த்து மூலச் செயலைப் பாதுகாக்கிறது.
