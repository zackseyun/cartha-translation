revisions:
- from: அப்போது யோசுவா தன் ஆடைகளைக் கிழித்தார். அவரும் இஸ்ரவேலின் மூப்பர்களும் யாவேயின் உடன்படிக்கைப் பெட்டிக்கு முன்பாகத் தரையில் முகங்குப்புற விழுந்து, மாலைவரை அங்கேயே இருந்தார்கள்[a]. பின்பு அவர்கள் தங்கள் தலைகள்மேல் புழுதியைப் போட்டுக்கொண்டார்கள்[b].
  to: அப்போது யோசுவா தன் ஆடைகளைக் கிழித்தார்; அவரும் இஸ்ரவேலின் மூப்பர்களும் யாவேயின் பெட்டிக்கு முன்பாகத் தரையில் முகங்குப்புற விழுந்து மாலைவரை இருந்தார்கள்[a]; அவர்கள் தங்கள் தலைகளின்மேல் புழுதியைப் போட்டுக்கொண்டார்கள்[b].
  rationale: The revision removes the unsupported addition “உடன்படிக்கை,” omits the unnecessary temporal connective “பின்பு,” and keeps the Hebrew sequence and shared participation explicit in idiomatic modern Tamil. Footnote a is adjusted to explain the compressed Hebrew construction more cautiously and accurately.
