translation_notes:
  register: நவீன நிலையான தமிழில், வரலாற்றுக் கதைநடைக்கேற்ற கண்ணியமான மற்றும் எளிதில் புரியும் நடையில் அமைக்கப்பட்டுள்ளது. ‘ஏறிச் சென்றார்கள்’ என்ற எபிரெய திசைநுட்பமும், ‘முன்பாக’ என்ற எதிரியின் முன்னிலையைக் குறிக்கும் அமைப்பும் இயன்றவரை இயல்பாகத் தக்கவைக்கப்பட்டுள்ளன.
