source:
  edition: WLC
  text: וַ/יַּעֲל֤וּ מִן הָ/עָם֙ שָׁ֔מָּ/ה כִּ/שְׁלֹ֥שֶׁת אֲלָפִ֖ים אִ֑ישׁ וַ/יָּנֻ֕סוּ לִ/פְנֵ֖י אַנְשֵׁ֥י הָ/עָֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/004.yaml
  text: So about three thousand men from the people went up there, but they fled before the men of Ai.
translation:
  language: ta
  text: எனவே, மக்களில் சுமார் மூவாயிரம் பேர் அங்கே ஏறிச் சென்றார்கள்; ஆனால் அவர்கள் ஆயி நகரத்து ஆட்களிடமிருந்து தப்பியோடினார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲלוּ
  choice: ஏறிச் சென்றார்கள்
  rationale: עלה என்பது ‘மேலே போதல்/ஏறிச் செல்லுதல்’ என்று பொருள்படும். ஆயியை நோக்கிய படை நகர்வின் திசைநுட்பத்தைத் தக்கவைத்து, வினைச்சொல்லுக்குள் தாக்குதல் என்ற கருத்தைச் சேர்க்காமல் ‘ஏறிச் சென்றார்கள்’ என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: מִן הָעָם
  choice: மக்களில்
  rationale: עם என்பதன் அடிப்படைப் பொருள் ‘மக்கள்.’ இங்கு இஸ்ரவேல் மக்களிலிருந்து சென்ற ஒரு குழுவைக் குறிக்கும் என்பதால், இயல்பான தமிழில் ‘மக்களில்’ என வழங்கப்பட்டுள்ளது.
- source_word: שָׁמָּה
  choice: அங்கே
  rationale: முன்பு குறிப்பிடப்பட்ட இடத்தை நோக்கிய திசையையோ அந்த இடத்தையோ குறிக்கும் வினையடை; தமிழில் ‘அங்கே’ என்பது சுருக்கமாகவும் இயல்பாகவும் உள்ளது.
- source_word: כִּשְׁלֹשֶׁת אֲלָפִים אִישׁ
  choice: சுமார் மூவாயிரம் பேர்
  rationale: כִּ எண் அளவைத் தோராயமாகக் காட்டுவதால் ‘சுமார்’ எனவும், எண்ணுக்குப் பின் வரும் אִישׁ நபர்களைக் கணக்கிடுவதால் இயல்பான தமிழில் ‘பேர்’ எனவும் வழங்கப்பட்டுள்ளது; ‘வீரர்கள்’ என்று மூலத்தில் இல்லாத குறிப்பைச் சேர்க்கவில்லை.
- source_word: וַיָּנֻסוּ
  choice: தப்பியோடினார்கள்
  rationale: נוס என்பது ஆபத்திலிருந்து ஓடித் தப்புவதை, அதாவது ‘flee’ என்பதைக் குறிக்கிறது. ‘தப்பியோடினார்கள்’ நவீனத் தமிழில் இதைத் தெளிவாகவும் கண்ணியமாகவும் தெரிவிக்கிறது.
- source_word: לִפְנֵי
  choice: முன்பாக
  rationale: தப்பியோடுதல் என்ற வினையுடன் இச்சொல் எதிரியின் முன்னிலையிலிருந்து பின்வாங்குவதைச் சுட்டுகிறது. காரணத்தையோ செய்முறையையோ கூடுதலாகச் சேர்க்காமல் எபிரெய அமைப்பை ‘முன்பாக’ தக்கவைக்கிறது.
- source_word: אַנְשֵׁי הָעָי
  choice: ஆயி நகரத்து ஆட்கள்
  rationale: இது ஆயியைச் சேர்ந்த ஆண்களை, சூழலில் அதன் போரிடும் ஆட்களை, குறிக்கிறது. ‘ஆட்கள்’ என்பது ‘வீரர்கள்’ என்று மிகையாகக் குறிப்பாக்காமல் மூலச்சொல்லின் பரப்பைத் தக்கவைக்கிறது; ‘நகரத்து’ என்பது ஆயி ஓர் இடப்பெயர் என்பதை வாசகருக்குத் தெளிவாக்குகிறது.
