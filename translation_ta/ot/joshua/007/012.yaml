base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/012.yaml
  text: Therefore the sons of Israel cannot stand before their enemies; they turn their backs before their enemies[a], because they have become devoted to destruction. I will no longer be with you unless you destroy the devoted thing from your midst.
translation:
  language: ta
  text: அதனால் இஸ்ரவேல் மக்கள் தங்கள் எதிரிகளுக்கு முன்பாக நிலைத்து நிற்க முடியாது; அவர்கள் தங்கள் எதிரிகளுக்கு முதுகைக் காட்டுவார்கள். ஏனெனில், அவர்கள் அழிவுக்கென அர்ப்பணிக்கப்பட்டவர்களாகிவிட்டார்கள்.[a] அழிவுக்கென அர்ப்பணிக்கப்பட்ட பொருளை உங்கள் நடுவிலிருந்து அழித்தொழிக்காவிட்டால், இனி நான் உங்களோடு இருக்கமாட்டேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரேயச் சொல் חֵרֶם (ஹேரேம்), கடவுளுக்கென்று தனியே ஒதுக்கப்பட்டு அழிக்கப்பட வேண்டிய ஒன்றையோ, அத்தகைய அழிவுத் தீர்ப்பின் கீழுள்ள நிலையையோ குறிக்கிறது. பாரம்பரிய மொழிபெயர்ப்புகள் சில இதை ‘சபிக்கப்பட்டது’ என்று வழங்குகின்றன.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்கள்
  rationale: எபிரேய மொழியின் சொற்படிவம் ‘இஸ்ரவேலின் மகன்கள்’ என்றாலும், அது இங்கு முழு இஸ்ரவேல் சமூகத்தைக் குறிக்கிறது. நவீனத் தமிழில் இயல்பாகவும் அனைவரையும் உள்ளடக்கும் கூட்டுப் பொருளுடனும் ‘இஸ்ரவேல் மக்கள்’ என வழங்கப்பட்டது.
- source_word: יֻכְלוּ
  choice: முடியாது
  rationale: தெய்வீகத் தீர்ப்பினால் ஏற்பட்ட தற்போதைய இயலாமையைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: לָקוּם לִפְנֵי אֹיְבֵיהֶם
  choice: தங்கள் எதிரிகளுக்கு முன்பாக நிலைத்து நிற்க
  rationale: எதிரிகளுக்கு எதிராகத் தங்கள் நிலையைத் தக்கவைத்துக்கொள்வது என்ற எபிரேய மரபுத்தொடரின் பொருளையும் அதன் காட்சியையும் பாதுகாக்கிறது.
- source_word: עֹרֶף יִפְנוּ
  choice: முதுகைக் காட்டுகிறார்கள்
  rationale: சொற்பொருளில் ‘கழுத்தின் பின்புறத்தைத் திருப்புதல்’ என்பதைக் குறிக்கும் இம்மரபுத்தொடர் தோல்வியுற்றுப் பின்வாங்குவதைக் குறிக்கிறது; தமிழில் ‘முதுகைக் காட்டுதல்’ அந்த உருவகத்தை இயல்பாகப் பாதுகாக்கிறது.
- source_word: הָיוּ לְחֵרֶם
  choice: அழிவுக்கென்று அர்ப்பணிக்கப்பட்டவர்களாகிவிட்டார்கள்
  rationale: חֵרֶם என்பது கடவுளுக்கெனத் தனியே வைக்கப்பட்டு அழிவுக்கு உட்படுத்தப்படும் நிலையைச் சுட்டுகிறது. இங்கு மக்கள் அந்தத் தீர்ப்பின் கீழ் வந்திருப்பதை இந்த மொழிபெயர்ப்பு தெளிவாக்குகிறது.
- source_word: לֹא אוֹסִיף לִהְיוֹת עִמָּכֶם
  choice: இனி நான் உங்களோடு இருக்கமாட்டேன்
  rationale: இறைவனின் உடனிருப்பு தொடராது என்ற பொருளை இயல்பான நவீனத் தமிழில் அளிக்கிறது.
- source_word: אִם לֹא
  choice: அழித்தொழிக்காவிட்டால்
  rationale: எதிர்மறை நிபந்தனையைத் தமிழில் இயல்பான ‘-விட்டால்’ அமைப்பில் தெரிவிக்கிறது.
- source_word: תַשְׁמִידוּ
  choice: அழித்தொழிக்க
  rationale: ஹிஃபில் வினையின் தீர்மானமான, முழுமையான அழிப்பு வலிமையை ‘அழித்தொழி’ தெளிவாகக் காட்டுகிறது.
- source_word: הַחֵרֶם
  choice: அழிவுக்கென்று அர்ப்பணிக்கப்பட்டதை
  rationale: முகாமின் நடுவில் உள்ள குறிப்பிட்ட தடைசெய்யப்பட்ட பொருளைச் சுட்டுகிறது; அதே வசனத்தின் முந்தைய חֵרֶם பயன்பாட்டுடனான சொற்பொருள் தொடர்பையும் காக்கிறது.
- source_word: מִקִּרְבְּכֶם
  choice: உங்கள் நடுவிலிருந்து
  rationale: சமூகத்திற்குள் இருப்பதை அகற்றுதல் என்ற உடன்படிக்கைச் சூழலின் மொழியை நேரடியாகவும் இயல்பாகவும் வழங்குகிறது.
theological_decisions:
- issue: ஒரே வசனத்தில் חֵרֶם என்பதன் நிலைசார் மற்றும் பொருள்சார் பயன்பாடுகள்
  choice: לְחֵרֶם என்பதற்கு ‘அழிவுக்கென்று அர்ப்பணிக்கப்பட்டவர்களாக’ என்றும் הַחֵרֶם என்பதற்கு ‘அழிவுக்கென்று அர்ப்பணிக்கப்பட்டதை’ என்றும் வழங்குதல்
  alternative: ‘சாபத்திற்குள்ளானவர்கள்’ / ‘சபிக்கப்பட்ட பொருள்’ அல்லது ‘தடையின் கீழுள்ளவர்கள்’ / ‘தடைசெய்யப்பட்ட பொருள்’
  rationale: முதல் பயன்பாட்டில் இஸ்ரவேல் மக்கள் חֵרֶם என்ற நீதித்தீர்ப்பு நிலைக்கு வந்திருப்பதும், இரண்டாவது பயன்பாட்டில் அவர்களிடையே ஒரு குறிப்பிட்ட חֵרֶם இருப்பதும் வேறுபடுத்தப்படுகின்றன. அதே நேரத்தில் ‘அர்ப்பணிக்கப்பட்ட’ என்ற இணைப்பால் எபிரேயச் சொல்லின் மீள்பயன்பாடு பாதுகாக்கப்படுகிறது; இதை வெறும் சாபமாகக் குறுக்கிவிடுவதும் தவிர்க்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. ‘முதுகைக் காட்டுதல்’ என்ற இயல்பான தமிழ் உருவகம் மூலத்தின் தோல்விப் பின்வாங்கல் காட்சியைப் பாதுகாக்கிறது. חֵרֶם என்ற சிக்கலான வழிபாட்டு-நீதித்தீர்ப்புக் கருத்துக்கு முதன்மை உரையில் தொடர்ச்சியான சொற்றொடரும் விளக்க அடிக்குறிப்பும் பயன்படுத்தப்பட்டுள்ளன.
