  text: וַ/יֹּ֤אמֶר יְהוֹשֻׁ֨עַ֙ מֶ֣ה עֲכַרְתָּ֔/נוּ יַעְכֳּרְ/ךָ֥ יְהוָ֖ה בַּ/יּ֣וֹם הַ/זֶּ֑ה וַ/יִּרְגְּמ֨וּ אֹת֤/וֹ כָל יִשְׂרָאֵל֙ אֶ֔בֶן וַ/יִּשְׂרְפ֤וּ אֹתָ/ם֙ בָּ/אֵ֔שׁ וַ/יִּסְקְל֥וּ אֹתָ֖/ם בָּ/אֲבָנִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/025.yaml
  text: And Joshua said[a], “Why have you troubled us? Yahweh will trouble you this day.” And all Israel stoned him with stones[c][b], and they burned them with fire and stoned them with stones.
translation:
  language: ta
  text: யோசுவா, “நீ ஏன் எங்களுக்குத் தொல்லை உண்டாக்கினாய்? இன்று யாவே உனக்குத் தொல்லை உண்டாக்குவார்” என்றார்.[a] இஸ்ரவேலர் அனைவரும் அவனைக் கல்லெறிந்தார்கள்.[b] பின்பு அவர்கள் அவர்களைத் தீயால் எரித்து, அவர்களைக் கற்களால் எறிந்தார்கள்.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “தொல்லை உண்டாக்கினாய் … தொல்லை உண்டாக்குவார்” என்பவற்றுக்கு எபிரெயத்தில் ஒரே வினை பயன்படுத்தப்பட்டு, கைம்மாறைக் காட்டும் சொல்விளையாட்டு அமைந்துள்ளது.
    reason: lexical_alternative
  - marker: b
    text: இங்கு ‘கல்லெறிந்தார்கள்’ என்றும், வசனத்தின் முடிவில் ‘கற்களால் எறிந்தார்கள்’ என்றும் மொழிபெயர்க்கப்பட்டுள்ள இடங்களில் எபிரெயம் இரண்டு வேறுபட்ட வினைகளைப் பயன்படுத்துகிறது; இரண்டுமே கற்களால் நிறைவேற்றப்பட்ட தண்டனையைக் குறிக்கின்றன.
    reason: lexical_alternative
  - marker: c
    text: எபிரெய உரை முதலில் ‘அவன்’ என்ற ஒருமையையும், பின்னர் ‘அவர்கள்’ என்ற பன்மையையும் பயன்படுத்துகிறது. அந்தப் பன்மை ஆகானோடு வேறு யாரை அல்லது எவற்றை உள்ளடக்குகிறது என்பதை இவ்வசனம் மட்டும் திட்டவட்டமாகக் கூறவில்லை; இந்த மாற்றம் மொழிபெயர்ப்பிலும் காக்கப்பட்டுள்ளது.
    reason: alternative_reading
lexical_decisions:
- source_word: עֲכַרְתָּנוּ / יַעְכֳּרְךָ
  choice: எங்களுக்குத் தொல்லை உண்டாக்கினாய் / உனக்குத் தொல்லை உண்டாக்குவார்
  rationale: עכר என்ற ஒரே வினை இருமுறை வருவதால், தமிழிலும் ஒரே சொற்றொடரைப் பயன்படுத்தி எதிரொலிக்கும் சொல்விளையாட்டையும் தண்டனையின் கைம்மாறையும் காக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: நான்கு எழுத்துகளைக் கொண்ட இறைப்பெயரை ஒரு பட்டப்பெயரால் மாற்றாமல், தமிழில் வழக்கமான ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: בַּיּוֹם הַזֶּה
  choice: இன்று
  rationale: எபிரெயச் சொற்றொடரின் உடனடி காலக் குறிப்பை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: וַיִּרְגְּמוּ אֹתוֹ ... אֶבֶן
  choice: அவன்மேல் கற்களை எறிந்தார்கள்
  rationale: רגם மற்றும் வெளிப்படையாக வரும் אֶבֶן ஆகியவற்றை இயல்பான தமிழில் பிரதிபலித்து, கல்லெறிதலைத் தெளிவாகக் கூறுகிறது.
- source_word: וַיִּשְׂרְפוּ אֹתָם בָּאֵשׁ
  choice: அவர்களைத் தீயில் எரித்து
  rationale: எபிரெயத்தில் ஒருமையிலிருந்து பன்மைக்கு மாறுவதை அப்படியே காத்து, தீ என்ற கருவிக் குறிப்பையும் வெளிப்படுத்துகிறது.
- source_word: וַיִּסְקְלוּ אֹתָם בָּאֲבָנִים
  choice: அவர்கள்மேல் கற்களைக் குவித்தார்கள்
  rationale: סקל என்பதன் கல்லிடுதல்/கற்களால் மூடுதல் சார்ந்த நுணுக்கத்தை, முதல் רגם வினையிலிருந்து ஓரளவு வேறுபடுத்திக் காட்டுகிறது; பன்மைச் சுட்டையும் காக்கிறது.
theological_decisions:
- issue: ஆகானைக் குறிக்கும் ஒருமையிலிருந்து பன்மைக்கு மாறுதல்
  choice: ‘அவன்’ என்பதிலிருந்து ‘அவர்கள்’ என்பதற்கான எபிரெய மாற்றத்தை முதன்மை உரையில் காத்தல்
  alternative: எல்லாச் சுட்டுப்பெயர்களையும் ஆகானை மட்டும் குறிக்கும் ஒருமையாக ஒத்திசைத்தல்; அல்லது பன்மையை அவனுடைய உடைமைகளுக்கு மட்டும் உரியதாக விளக்குதல்
  rationale: மசோரெட்டிக் உரை வெளிப்படையாக ஒருமையிலிருந்து பன்மைக்கு மாறுகிறது. சூழலில் குடும்பத்தாரும் உடைமைகளும் இருந்தாலும், இந்த வசனம் பன்மை யாரையெல்லாம் உள்ளடக்குகிறது என்பதைத் துல்லியமாகத் தீர்மானிப்பதில்லை; ஆகவே அந்தத் தெளிவின்மை காக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையும் உரையின் கடுமையும் குன்றாத வகையில் இயல்பான வாக்கிய அமைப்பு பயன்படுத்தப்பட்டது. ‘தொல்லை உண்டாக்கு’ என்ற மறுமொழி எபிரெயச் சொல்விளையாட்டைக் காக்கிறது. வன்முறைக் காட்சியை மறைக்காமல், அதே நேரத்தில் தேவையற்ற விளக்கத்தை முதன்மை உரையில் சேர்க்காமல் வழங்குகிறது.
