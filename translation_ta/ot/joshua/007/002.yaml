translation_notes:
  register: நவீன தரநிலைத் தமிழில் இயல்பான, மரியாதைமிக்க கதைநடை பயன்படுத்தப்பட்டுள்ளது. இடப்பெயர்கள் எரிகோ, ஆயி, பெத்தாவேன், பெத்தேல் என ஒலிபெயர்க்கப்பட்டுள்ளன. கட்டளையிலும் அதன் நிறைவேற்றத்திலும் வரும் עלה மற்றும் רגל ஆகிய வினைகளின் மறுபயன்பாடு தமிழிலும் பேணப்பட்டுள்ளது.
