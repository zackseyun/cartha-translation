base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/002.yaml
  text: And Joshua sent men from Jericho to Ai[a], which is near Beth-aven, east of Bethel, and said to them, “Go up and spy out the land.” So the men went up and spied out Ai.
translation:
  language: ta
  text: யோசுவா எரிகோவிலிருந்து ஆண்களை ஆயிக்கு அனுப்பினார். ஆயி பெத்தாவேனுக்கு அருகில்[a], பெத்தேலுக்குக் கிழக்கே இருந்தது. அவர் அவர்களிடம், “நீங்கள் மேலே சென்று அந்த நாட்டை உளவு பாருங்கள்” என்றார். எனவே அந்த ஆண்கள் மேலே சென்று ஆயியை உளவு பார்த்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பெத்தாவேனுக்குப் பக்கத்தில்.” எபிரெய மொழியில் சொற்பொருளாக “பெத்தாவேனுடன்” என்று உள்ளது; இங்கு பயன்படுத்தப்பட்ட முன்னிடைச்சொல் புவியியல் அருகாமையைக் குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: அனுப்பினார்
  rationale: שלח என்பதன் வழக்கமான கதைநடைப் பொருளை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: אֲנָשִׁים
  choice: சில ஆண்களை
  rationale: எபிரெயச் சொல் ஆண்பால் பன்மையைத் தெளிவாகக் குறிக்கிறது; தமிழ் வாக்கியத்தில் இயல்புக்காக எண்ணிக்கை குறிப்பிடாத பன்மை ‘சில’ என்பதால் வெளிப்படுத்தப்படுகிறது.
- source_word: מִירִיחוֹ
  choice: எரிகோவிலிருந்து
  rationale: இடப்பெயரைத் தமிழ் வழக்கில் ஒலிபெயர்த்து, מן முன்னிடைச்சொல்லின் தொடக்க இடத்தையும் காட்டுகிறது.
- source_word: הָעַי
  choice: ஆயி
  rationale: குறிப்பிட்ட இடப்பெயரின் ஒலிபெயர்ப்பு; எபிரெயக் குறிப்புச் சுட்டைத் தமிழில் தனியே காட்டுவது இயல்பல்ல.
- source_word: אֲשֶׁר עִם בֵּית אָוֶן
  choice: பெத்தாவேனுக்கு அருகில்
  rationale: עִם என்பதன் அடிப்படைப் பொருள் ‘உடன்’ என்றாலும், இந்தப் புவியியல் சூழலில் அருகாமையைக் குறிக்கிறது; உள்ளார்ந்த மாற்று நுணுக்கம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: מִקֶּדֶם לְבֵית אֵל
  choice: பெத்தேலுக்குக் கிழக்கே
  rationale: பெத்தேலை ஒப்புநிலையாகக் கொண்ட கிழக்குத் திசை அமைவிடத்தைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: עֲלוּ
  choice: மேலே சென்று
  rationale: עלה குறிக்கும் உயர்நிலையை நோக்கிய இயக்க நுணுக்கத்தைப் பாதுகாக்கிறது; அடுத்த கட்டளையுடன் இயல்பாக இணைகிறது.
- source_word: וְרַגְּלוּ
  choice: உளவுபாருங்கள்
  rationale: இந்தப் பியெல் வடிவம் இராணுவ நோக்கிலான வேவுபார்த்தலைக் குறிக்கிறது; ‘ஆராயுங்கள்’ என்பதைவிட ‘உளவுபாருங்கள்’ சூழலுக்குத் துல்லியம்.
- source_word: אֶת הָאָרֶץ
  choice: அந்த நாட்டை
  rationale: אָרֶץ இங்கு உளவுபார்க்க வேண்டிய நிலப்பரப்பைக் குறிக்கிறது; முன்னரே சுட்டப்பட்ட இலக்கைத் தமிழில் இயல்பாகக் காட்ட ‘அந்த’ பயன்படுத்தப்படுகிறது.
- source_word: וַיַּעֲלוּ
  choice: மேலே சென்று
  rationale: கட்டளையில் வந்த עלה-ஐ மீண்டும் எதிரொலித்து, திசை மற்றும் உயர்வு நுணுக்கத்தைப் பாதுகாக்கிறது.
- source_word: וַיְרַגְּלוּ אֶת הָעָי
  choice: ஆயியை உளவுபார்த்தார்கள்
  rationale: முந்தைய கட்டளையுடன் சொற்தொடர் ஒற்றுமையைப் பேணி, உளவு நடவடிக்கையின் இலக்காக ஆயியைக் காட்டுகிறது.
