base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/013.yaml
  text: 'Get up[a], consecrate the people, and say, ‘Consecrate yourselves for tomorrow, for thus says Yahweh, the God of Israel: There is something devoted to destruction in your midst, Israel. You cannot stand before your enemies until you remove the thing devoted to destruction from your midst.’'
translation:
  language: ta
  text: 'எழுந்திரு; மக்களைப் புனிதப்படுத்து. அவர்களிடம் சொல்: “நாளைக்காக உங்களைப் புனிதப்படுத்திக்கொள்ளுங்கள்; ஏனெனில் இஸ்ரவேலின் கடவுளாகிய யாவே இவ்வாறு கூறுகிறார்: இஸ்ரவேலே, அழிவுக்கென்று அர்ப்பணிக்கப்பட்ட ஒன்று[a] உன் நடுவில் இருக்கிறது. அழிவுக்கென்று அர்ப்பணிக்கப்பட்டதை உங்கள் நடுவிலிருந்து அகற்றும்வரை, உன் பகைவர்களுக்கு முன்பாக உன்னால் நிலைநிற்க முடியாது.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயச் சொல் חֵרֶם (ஹேரெம்), மரபாக ‘தடை விதிக்கப்பட்டது’ அல்லது ‘அர்ப்பணிக்கப்பட்டது’ என மொழிபெயர்க்கப்படுகிறது; மீளப்பெற முடியாதபடி அர்ப்பணிக்கப்பட்ட ஒன்றை இது குறிக்கிறது; இங்கு அது அழிவுக்காக அர்ப்பணிக்கப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: קֻם
  choice: எழுந்திரு
  rationale: யோசுவா உடனடியாகச் செயல்படுமாறு கட்டளையிடும் ஒருமை ஏவல்; நவீன தமிழில் இயல்பாகவும் அவசரத் தன்மையுடனும் உள்ளது.
- source_word: קַדֵּשׁ / הִתְקַדְּשׁוּ
  choice: புனிதப்படுத்து / உங்களைப் புனிதப்படுத்திக்கொள்ளுங்கள்
  rationale: முதல் வடிவின் பிறவினைச் செயற்பாட்டையும் இரண்டாவது வடிவின் தற்சுட்டுப் பொருளையும் காத்து, இரண்டிற்கும் இடையிலான ஒரே சொல்வேர்த் தொடர்பைப் புலப்படுத்துகிறது.
- source_word: לְמָחָר
  choice: நாளைக்காக
  rationale: மறுநாளை முன்னிட்டு ஆயத்தமாகும் நோக்கத்தை לְ என்ற முன்னொட்டுடன் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய தனிப்பெயரை ஒரு பட்டப்பெயரால் மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: חֵרֶם
  choice: அழிவுக்கென்று அர்ப்பணிக்கப்பட்ட ஒன்று / அழிவுக்கென்று அர்ப்பணிக்கப்பட்டது
  rationale: மீளப்பெற முடியாதபடி ஒதுக்கப்பட்ட அல்லது அர்ப்பணிக்கப்பட்ட பொருள் என்ற கருத்தையும், இச்சூழலில் அது அழிவுக்குரியது என்பதையும் தெளிவாக்குகிறது; தொழில்நுட்பச் சொல்லால் பொருளை மறைக்கவில்லை.
- source_word: בְּקִרְבְּךָ יִשְׂרָאֵל
  choice: இஸ்ரவேலே, ... உன் நடுவில்
  rationale: இஸ்ரவேலை ஒரு கூட்டு ஆளாக நேரடியாக அழைக்கும் ஒருமை வடிவையும் இடப்பொருளையும் காக்கிறது.
- source_word: לֹא תוּכַל לָקוּם לִפְנֵי אֹיְבֶיךָ
  choice: உன் பகைவர்களுக்கு முன்பாக உன்னால் நிலைநிற்க முடியாது
  rationale: பகைவர்களை எதிர்த்து நின்று வெல்ல இயலாமையைச் சுட்டும் எபிரெய மரபுத்தொடரைத் தெளிவான தமிழில் தருகிறது.
- source_word: עַד הֲסִירְכֶם
  choice: நீங்கள் ... அகற்றும்வரை
  rationale: தேவையான செயல் நிறைவேறும் வரையிலான கால-நிபந்தனை எல்லையையும், இங்கு வரும் பன்மை முகவரியையும் காக்கிறது.
theological_decisions:
- issue: חֵרֶם என்ற சொல்லின் உடன்படிக்கைத் தீர்ப்பு சார்ந்த பொருள்
  choice: அழிவுக்கென்று அர்ப்பணிக்கப்பட்ட ஒன்று
  alternative: தடைசெய்யப்பட்ட பொருள் / சாபத்துக்குரிய பொருள் / அர்ப்பணிக்கப்பட்ட பொருள்
  rationale: இச்சூழலில் இது வெறும் சாபமோ பொதுவான தடையோ அல்ல; மீளப்பெற முடியாத அர்ப்பணிப்பின் கீழ், அழிவுக்காக ஒதுக்கப்பட்டதைச் சுட்டுகிறது. தேர்ந்தெடுத்த மொழிபெயர்ப்பு அந்தப் பதற்றத்தைத் தெளிவாக வைத்திருக்கிறது.
- issue: יְהוָה என்ற இறைப் பெயர்
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலத்தில் உள்ள தனிப்பெயரைப் பட்டப்பெயராக மாற்றாமல், தமிழில் வெளிப்படையாக ஒலிபெயர்க்கிறது.
- issue: இஸ்ரவேலை நோக்கிய ஒருமையிலிருந்து மக்களை நோக்கிய பன்மைக்கான மாற்றம்
  choice: ‘உன்/உன்னால்’ என்பதையும் பின்னர் ‘நீங்கள்/உங்கள்’ என்பதையும் காத்தல்
  alternative: முழுவதையும் பன்மையாக ஒருமைப்படுத்துதல்
  rationale: எபிரெய உரை இஸ்ரவேலைக் கூட்டு ஆளாக ஒருமையில் அழைத்தபின் சமூக உறுப்பினர்களை பன்மையில் குறிப்பிடுகிறது; அந்த அர்த்தமுள்ள இலக்கண மாற்றத்தைச் சீராக்காமல் காக்கிறது.
translation_notes:
  register: நவீன செந்தமிழுக்கு அணுக்கமான, கண்ணியமான உரைநடை பயன்படுத்தப்பட்டுள்ளது. ‘புனிதப்படுத்து’ என்பது சடங்கு ஆயத்தத்தையும் பரிசுத்தத்திற்காகப் பிரித்துவைப்பதையும் உள்ளடக்குகிறது. நேரடி உரையின் அடுக்கைத் தெளிவாக்க இரட்டை மற்றும் ஒற்றை மேற்கோள்கள் பயன்படுத்தப்பட்டுள்ளன; மூலத்தின் ஒருமை–பன்மை மாற்றம் திட்டமிட்டு பாதுகாக்கப்பட்டுள்ளது.
