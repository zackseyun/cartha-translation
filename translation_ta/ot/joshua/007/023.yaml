  text: They took them from inside the tent and brought them to Joshua and to all the sons of Israel[c][b][a], and they laid them out before Yahweh.
translation:
  language: ta
  text: அவர்கள் அவற்றைக் கூடாரத்தின் உள்ளிருந்து எடுத்து, யோசுவாவிடமும் இஸ்ரவேல் மக்கள் அனைவரிடமும் கொண்டுவந்து, அவற்றை யாவேயின் முன்னிலையில் வைத்தார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘வைத்தார்கள்’ என்பதற்கு மாற்றாக, ‘கொட்டினார்கள்’ அல்லது ‘ஊற்றினார்கள்’ என்றும் மொழிபெயர்க்கலாம். எபிரெய வினை பொதுவாக ‘ஊற்று/கொட்டு’ என்று பொருள்படும்; இங்கு கூடாரத்திலிருந்து கொண்டுவரப்பட்ட பொருட்களை யாவேயின் முன்னிலையில் வைத்ததையோ வெளிப்படுத்தி வைத்ததையோ குறிக்கிறது.
    reason: lexical_alternative
