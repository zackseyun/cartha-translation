- source_word: מִתּוֹךְ הָאֹהֶל
  choice: கூடாரத்தின் உள்ளிருந்து
  rationale: מִתּוֹךְ என்பது வெறுமனே ‘கூடாரத்திலிருந்து’ என்பதைக் காட்டிலும், அதன் உள்ளிருந்து எடுத்ததைத் தெளிவாகக் குறிக்கிறது.
- source_word: וַיְבִאוּם
  choice: கொண்டுவந்து
  rationale: בוא வினையின் ஹிஃபில் வடிவம் பொதுவாக ‘கொண்டுவருதல்’ என்று பொருள்படும்; சடங்குமுறையான ‘சமர்ப்பித்தல்’ என்ற கருத்தை உரை கட்டாயப்படுத்தவில்லை.
- source_word: אֶל יְהוֹשֻׁעַ וְאֶל כָּל בְּנֵי יִשְׂרָאֵל
