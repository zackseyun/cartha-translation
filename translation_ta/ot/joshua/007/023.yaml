  rationale: மீண்டும் வரும் אֶל இரு இலக்குகளையும் குறிக்கிறது. בְּנֵי יִשְׂרָאֵל என்பதன் வடிவத்தை ‘இஸ்ரவேலின் மக்கள்’ இயல்பான தமிழில் நெருக்கமாகப் பாதுகாக்கிறது.
- source_word: וַיַּצִּקֻם
  choice: அவற்றைக் கொட்டிவைத்தார்கள்
  rationale: יצק அடிப்படையில் ‘ஊற்று/கொட்டு’ எனப் பொருள்படலாம்; இங்கு திரவமல்லாத மீட்கப்பட்ட பொருட்கள் குறிக்கப்படுவதால், ‘கொட்டிவைத்தார்கள்’ என்பது மூல வினையின் உருவகத்தையும் பொருட்களை முன்னே வைத்த செயலையும் ஒருங்கே தெரிவிக்கிறது.
- source_word: לִפְנֵי יְהוָה
  choice: யெகோவாவின் முன்னிலையில்
  rationale: לִפְנֵי என்பது ‘முன்னிலையில்/சந்நிதியில்’ எனப் பொருள்படும். தனிப்பெயராகிய יהוה தமிழில் நிலைபெற்ற ‘யெகோவா’ என ஒலிபெயர்க்கப்பட்டுள்ளது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யெகோவா
  alternative: யாவே
  rationale: உரையில் பட்டப்பெயர் அல்ல, நான்கெழுத்து இறைப்பெயரே உள்ளது. அதனைப் பட்டப்பெயரால் மாற்றாமல் தனிப்பெயராகப் பாதுகாக்கிறது; நவீனத் தமிழில் பரவலாக அறியப்படும் வடிவம் ‘யெகோவா’, ‘யாவே’ என்பது எபிரெய உச்சரிப்பை நெருக்கமாகப் பிரதிபலிக்கும் மாற்று வடிவம்.
- issue: בְּנֵי יִשְׂרָאֵל என்ற இனக்குழுப் பெயர்
  choice: இஸ்ரவேலின் மக்கள் அனைவரும்
  alternative: இஸ்ரவேலின் மகன்கள் அனைவரும்
  rationale: ‘மகன்கள்’ என்பது எபிரெய வடிவத்தைச் சொற்சொல்லாகக் காட்டினாலும், இங்கு முழு இஸ்ரவேல் சமூகத்தைக் குறிக்கும் நிலையான இனக்குழுப் பயன்பாடு. ‘மக்கள்’ என்பது அதன் பொருளை இயல்பான தமிழில் தருகிறது; ‘அனைவரும்’ כָּל என்பதைக் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியும் அதேவேளையில் கண்ணியமான வரலாற்று-விவரண நடையில் அமைக்கப்பட்டது. தொடர்ச்சியான எபிரெய வினைகள் இயல்பான தமிழ் வாக்கிய ஓட்டத்தில் இணைக்கப்பட்டுள்ளன.
