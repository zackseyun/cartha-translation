  text: וַ/יַּ֧עַן עָכָ֛ן אֶת יְהוֹשֻׁ֖עַ וַ/יֹּאמַ֑ר אָמְנָ֗ה אָנֹכִ֤י חָטָ֨אתִי֙ לַֽ/יהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל וְ/כָ/זֹ֥את וְ/כָ/זֹ֖את עָשִֽׂיתִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/020.yaml
  text: Achan answered Joshua and said[a], “Truly, I have sinned against Yahweh, the God of Israel, and this is what I did:”
translation:
  language: ta
  text: ஆகான் யோசுவாவுக்குப் பதிலளித்து, “உண்மையாகவே, நான் இஸ்ரவேலின் கடவுளாகிய யாவேக்கு எதிராகப் பாவம் செய்தேன். நான் செய்தது இதுதான்:[a]” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொற்சொல்லாக, “இப்படியும் இப்படியும் செய்தேன்.” இந்த எபிரேய மரபுத்தொடர், தான் செய்தவற்றின் விவரங்களை அடுத்து எடுத்துரைப்பதற்கான அறிமுகமாக வருகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמַר
  choice: பதிலளித்து, … என்றான்
  rationale: எபிரேயக் கதைநடையில் வரும் ‘பதிலளித்தான், சொன்னான்’ என்ற இரட்டை பேச்சு அறிமுகத்தை, தமிழில் இயல்பான உரையாடல் அமைப்பாக வழங்குகிறது; பதிலின் தன்மையும் ‘சொன்னான்’ என்பதன் கருத்தும் காக்கப்படுகின்றன.
- source_word: עָכָן
  choice: ஆகான்
  rationale: எபிரேயப் பெயரின் ஒலியை நவீனத் தமிழில் தெளிவாக எழுத்துப்பெயர்க்கிறது.
- source_word: אָמְנָה
  choice: உண்மையாகவே
  rationale: ஒப்புக்கொள்ளுதலை வலியுறுத்தும் உறுதிப்பாட்டு வினையடையின் ஆழ்ந்த தொனியை இயல்பான தமிழில் தருகிறது.
- source_word: אָנֹכִי חָטָאתִי
  choice: நான் … பாவம் செய்தேன்
  rationale: தனி எழுவாய்ப் பெயர்ச்சொல் தரும் ‘நான்’ என்ற வலியுறுத்தலைக் காக்கிறது; நிறைவுற்ற குற்றச்செயலை ஒப்புக்கொள்ளும் கருத்தையும் தெளிவாகத் தருகிறது.
- source_word: לַיהוָה
  choice: யாவேக்கு எதிராக
  rationale: חטא உடன் வரும் ל குற்றத்தால் பாதிக்கப்பட்டவரைக் குறிக்கிறது; தமிழில் ‘எதிராகப் பாவம் செய்தேன்’ என்பது அந்த உறவைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் கடவுள்
  rationale: இணைப்புநிலைத் தொடரை நேரடியாகவும் இயல்பாகவும் மொழிபெயர்க்கிறது.
- source_word: וְכָזֹאת וְכָזֹאת עָשִׂיתִי
  choice: நான் செய்தது இதுதான்
  rationale: அடுத்து குற்றத்தின் விவரங்களை அறிமுகப்படுத்தும் எபிரேய மரபுத்தொடரின் செயல்பாட்டை இயல்பான நவீனத் தமிழில் தருகிறது; சொற்சொல் வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் நேரடியாக வரும் நான்கெழுத்து இறைப் பெயரை ஒரு பட்டமாக மாற்றாமல், உடன்படிக்கைப் பெயராக ஒலிபெயர்த்துள்ளது.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான, பொதுவாசகர்களுக்கு எளிதில் புரியும் தமிழ் பயன்படுத்தப்பட்டுள்ளது. நேரடி ஒப்புக்கொள்ளுதலின் தீவிரமும், அடுத்த வசனத்தில் வரும் விவரங்களை நோக்கிச் செல்லும் இறுதி மரபுத்தொடரின் செயல்பாடும் காக்கப்பட்டுள்ளன.
