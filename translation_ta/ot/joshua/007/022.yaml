base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/022.yaml
  text: So Joshua sent messengers[a], and they ran to the tent; and behold, it was hidden in his tent, with the silver underneath it.
translation:
  language: ta
  text: அப்போது யோசுவா தூதுவர்களை அனுப்பினார். அவர்கள் கூடாரத்துக்கு ஓடினார்கள். இதோ, அது அவனுடைய கூடாரத்தில் மறைத்து வைக்கப்பட்டிருந்தது; வெள்ளி அதற்குக் கீழே இருந்தது.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'மாற்றாக: “அது அவனுடைய கூடாரத்தில் மறைத்து வைக்கப்பட்டிருந்தது; வெள்ளியும் அதற்குக் கீழே இருந்தது.” எபிரெயத்தில் “வெள்ளி” என்பது முந்தைய கூற்றுடன் ‘மற்றும்’ என்ற இணைப்பால் சேர்க்கப்பட்டுள்ளது; எனவே தமிழில் இதை கூடுதல் காட்சிவிவரமாகவோ தனி கூற்றாகவோ வெளிப்படுத்தலாம்.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: அனுப்பினார்
  rationale: கதைநடையில் שׁלח என்பதன் இயல்பான பொருளை நேரடியாகத் தருகிறது.
- source_word: מַלְאָכִים
  choice: தூதுவர்களை
  rationale: இங்கு மனிதர்களான அனுப்பப்பட்டவர்களையே குறிக்கிறது; சூழல் தெளிவாக இருப்பதால் ‘தூதுவர்கள்’ மூலச்சொல்லின் பொருளைத் தக்கவைக்கிறது.
- source_word: וַיָּרֻצוּ
  choice: ஓடினார்கள்
  rationale: רץ குறிக்கும் விரைவான உடல் இயக்கத்தை ‘விரைந்தார்கள்’ என்று மென்மைப்படுத்தாமல் உயிரோட்டமாகத் தருகிறது.
- source_word: הָאֹהֱלָה
  choice: கூடாரத்துக்கு
  rationale: திசைநோக்கிய ה இறுதி விகுதி கூடாரத்தை நோக்கிய இயக்கத்தைக் குறிக்கிறது; தமிழில் ‘-க்கு’ இயல்பாக அதைக் காட்டுகிறது.
- source_word: וְהִנֵּה
  choice: இதோ
  rationale: கண்டுபிடிக்கப்பட்ட காட்சியைக் கவனத்துக்கு கொண்டுவரும் எபிரெயக் கதைநடைச் சொல்லின் வலிமையைப் பாதுகாக்கிறது.
- source_word: טְמוּנָה
  choice: மறைத்து வைக்கப்பட்டிருந்தது
  rationale: பெண்பால் ஒருமை வடிவம் முந்தைய வசனத்தில் கூறப்பட்ட பொருளை, இயல்பாக ஆடையை, சுட்டுகிறது; ‘புதைக்கப்பட்டிருந்தது’ என்பது மூலச்சொல்லைவிடக் குறிப்பானதாகிவிடும்.
- source_word: בְּאָהֳלוֹ
  choice: அவனுடைய கூடாரத்தில்
  rationale: மூன்றாம் நபர் ஆண்பால் ஒருமை உரிமைச்சுட்டை நேரடியாகத் தருகிறது; சூழலில் அது ஆகானைக் குறிக்கிறது.
- source_word: וְהַכֶּסֶף
  choice: வெள்ளி
  rationale: வெள்ளியைப் பற்றிய கூடுதல் காட்சிவிவரமாக இயல்பான தமிழில் தனி உட்பிரிவாக அமைக்கப்பட்டுள்ளது; எபிரெய இணைப்பின் மாற்று வாசிப்பு அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: תַּחְתֶּיהָ
  choice: அதற்குக் கீழே
  rationale: பெண்பால் ஒருமை பின்னொட்டு முந்தைய வசனத்தில் கூறப்பட்ட ஆடையை இயல்பாகச் சுட்டுகிறது; தமிழில் பால்வேறுபாடு இல்லாத ‘அது’ அந்தக் குறிப்பை இயல்பாகத் தொடர்கிறது.
