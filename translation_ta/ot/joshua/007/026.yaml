base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/026.yaml
  text: And they raised over him a large heap of stones to this day[a], and Yahweh turned from the burning of his anger. Therefore the name of that place has been called the Valley of Achor to this day.
translation:
  language: ta
  text: அவன்மேல் ஒரு பெரிய கற்குவியலை எழுப்பினார்கள்; அது இந்நாள்வரையும் உள்ளது. அப்போது யாவே தமது கோபத்தின் கனலிலிருந்து விலகினார். அதனால், அந்த இடம் இந்நாள்வரையும் ஆகோர் பள்ளத்தாக்கு[a] என்று அழைக்கப்படுகிறது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ஆகோர்” என்பது எபிரெய மொழியில் “தொல்லை” என்பதைக் குறிக்கும் சொல்லுடன் ஒலித்தொடர்புடையது; யோசுவா 7:25-ஐ ஒப்பிடுக.
    reason: இடப்பெயருக்கும் עכר என்ற சொல்லுக்கும் இடையிலான சொல்விளையாட்டைத் துல்லியமாக விளக்குகிறது.
lexical_decisions:
- source_word: וַיָּקִימוּ עָלָיו
  choice: அவன்மேல் … எழுப்பினார்கள்
  rationale: קום என்பதன் ஹிஃபில் வடிவம் இங்கு ஒன்றை எழுப்புதல் அல்லது அமைத்தல் என்பதைக் குறிக்கிறது; עָלָיו கற்குவியல் ஆக்கான்மேல் எழுப்பப்பட்டதை நேரடியாகக் காட்டுகிறது.
- source_word: גַּל אֲבָנִים גָּדוֹל
  choice: பெரிய கற்குவியல் ஒன்று
  rationale: גַּל என்பது குவியல் அல்லது மேடு; אֲבָנִים உடன் வருவதால் இயல்பான நவீனத் தமிழில் ‘கற்குவியல்’ என வழங்கப்பட்டது.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: இந்நாள்வரை
  rationale: எழுத்தாளரின் காலம்வரை தொடர்ந்திருந்த நினைவுச்சின்னத்தையும் இடப்பெயர் வழக்கையும் குறிக்கும் எபிரெய மரபுத்தொடரைச் சுருக்கமாகப் பிரதிபலிக்கிறது.
- source_word: וַיָּשָׁב יְהוָה
  choice: யாவே … திரும்பினார்
  rationale: שׁוּב என்பதன் ‘திரும்புதல்’ உருவகத்தைத் தக்கவைத்து, இறைக்கோபம் தணிந்ததை விளக்கமாகத் தீர்மானித்துச் சொல்லாமல் மூலத்தின் மொழியையே பின்பற்றுகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: திருநாமமான நான்கு எபிரெய மெய்யெழுத்துகளை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் தெளிவான ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: מֵחֲרוֹן אַפּוֹ
  choice: தமது கோபக் கனலிலிருந்து
  rationale: חֲרוֹן אַף என்பதிலுள்ள எரியும் அல்லது கனலும் கோபம் என்ற உருவகத்தை இயல்பான, கண்ணியமான தமிழில் காக்கிறது.
- source_word: עַל כֵּן
  choice: அதனால்
  rationale: அடுத்து வரும் இடப்பெயருக்கான காரணத் தொடர்பைத் தெளிவாகக் காட்டுகிறது.
- source_word: קָרָא שֵׁם הַמָּקוֹם הַהוּא
  choice: அந்த இடம் … என்று அழைக்கப்படுகிறது
  rationale: பெயரிடும் எபிரெய மரபுத்தொடரைத் தமிழில் இயல்பான செயப்பாட்டு அமைப்பில் வழங்குகிறது; இந்நாள்வரை என்ற தொடர்ச்சி குறிப்பும் காக்கப்படுகிறது.
- source_word: עֵמֶק עָכוֹר
  choice: ஆகோர் பள்ளத்தாக்கு
  rationale: இடப்பெயரை மொழிபெயர்த்து மாற்றாமல் ஒலிபெயர்த்து, עכר உடனான சொல்விளையாட்டை அடிக்குறிப்பில் விளக்குகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைத் திருநாமத்தை வழங்குதல்
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூலத்தில் ஒரு பொதுப் பட்டம் அல்ல, இறைத் திருநாமமே உள்ளது; ஆகவே அதை ஒலிபெயர்த்து உரையின் தன்மையைப் பாதுகாக்கிறது.
- issue: מֵחֲרוֹן אַפּוֹ என்பதில் இறைக்கோபத்தின் உருவகம்
  choice: தமது கோபக் கனலிலிருந்து திரும்பினார்
  alternative: தமது கடுங்கோபத்தைத் தணித்தார்
  rationale: இறைக்கோபத்தைப் பற்றிய எபிரெய உருவகத்தையும் ‘திரும்பினார்’ என்ற செயலையும் மென்மைப்படுத்தாமலும் கோட்பாட்டு விளக்கமாக மாற்றாமலும் தக்கவைக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘கோபக் கனல்’ மூலத்தின் எரியும் கோபம் என்ற உருவகத்தைச் சுருக்கமாகக் காக்கிறது; ‘ஆகோர்’ இடப்பெயராகப் பாதுகாக்கப்பட்டு அதன் பொருளொலி அடிக்குறிப்பில் தரப்பட்டுள்ளது.
