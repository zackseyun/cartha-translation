base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/017.yaml
  text: Then he brought near the clan of Judah[a], and the clan of the Zerahites was taken. Then he brought near the clan of the Zerahites man by man, and Zabdi was taken.
translation:
  language: ta
  text: பின்பு அவர் யூதாவின் குலத்தை முன்வரச் செய்தார்; சேராகியரின் குலம் தேர்ந்தெடுக்கப்பட்டது. அதன்பின் அவர் சேராகியரின் குலத்தை ஒவ்வொரு ஆணாக[a] முன்வரச் செய்தார்; சப்தி தேர்ந்தெடுக்கப்பட்டார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘ஆண்களின்படி.’ எபிரெயச் சொற்றொடர் சேராகியரின் குலம் தனித்தனி ஆண்களாக முன்வரச் செய்யப்பட்டதைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּקְרֵב
  choice: முன்வரச் செய்தார்
  rationale: קרב என்பதன் ஹிபீல் வடிவம் ‘அருகில் கொண்டுவருதல்/முன்னிறுத்துதல்’ என்று பொருள்படும். இங்கு அடையாளம் காணும் நடைமுறைக்காகக் குழுக்களையும் ஆட்களையும் முன்வரச் செய்வதைக் குறிக்கிறது.
- source_word: מִשְׁפַּחַת
  choice: குலம்
  rationale: இச்சூழலில் இது கோத்திரத்துக்குள் உள்ள உறவுமுறைப் பிரிவைக் குறிக்கிறது; நவீன தமிழில் ‘குடும்பம்’ என்பதைவிட ‘குலம்’ பொருத்தமானது.
- source_word: יְהוּדָה
  choice: யூதா
  rationale: கோத்திர/நபர் பெயருக்கான தமிழில் நிலைபெற்ற ஒலிபெயர்ப்பு.
- source_word: וַיִּלְכֹּד / וַיִּלָּכֵד
  choice: தேர்ந்தெடுக்கப்பட்டது / தேர்ந்தெடுக்கப்பட்டார்
  rationale: இங்கு போரில் ‘பிடிபடுதல்’ அல்ல, சீட்டிடுதல் அல்லது இறைத் தெரிவின் வழியாக அடையாளம் காணப்படுதல் பொருள். ‘தேர்ந்தெடுக்கப்பட்டது’ இயல்பான தமிழில் செயல்முறையின் முடிவைத் தெரிவிக்கிறது; எபிரேயத்தின் செயப்பாட்டு நிலையும் பேணப்படுகிறது.
- source_word: הַזַּרְחִי
  choice: சேராகியரின் குலம்
  rationale: சேராகின் வழிவந்த உறவுக் குழுவைக் குறிக்கும் இன/குலப் பெயர். தமிழில் ‘சேராகியர்’ என்ற வடிவம் இயல்பாகப் புரியும்.
- source_word: לַגְּבָרִים
  choice: ஆள் ஆளாக
  rationale: சொல்லுக்கு நெருக்கமாக ‘ஆண்களின்படி’ எனலாம்; ஆனால் இங்கு குலத்தினர் ஒவ்வொருவராக முன்வைக்கப்பட்ட பகிர்வுப் பொருளை ‘ஆள் ஆளாக’ தெளிவாக வெளிப்படுத்துகிறது.
- source_word: זַבְדִּי
  choice: சப்தி
  rationale: எபிரேயப் பெயரின் தமிழ் ஒலிபெயர்ப்பு.
theological_decisions:
- issue: வַיִּלְכֹּד / וַיִּלָּכֵד என்பதன் தெரிவு சார்ந்த பொருள்
  choice: தேர்ந்தெடுக்கப்பட்டது / தேர்ந்தெடுக்கப்பட்டார்
  alternative: பிடிக்கப்பட்டது / பிடிக்கப்பட்டார்
  rationale: உடனுள்ள சூழல் குற்றவாளியைப் படிப்படியாக அடையாளம் காணும் தெரிவு நடைமுறையாகும். ‘பிடிக்கப்பட்டார்’ என்பது தமிழில் கைது அல்லது தற்செயலாக அகப்படுதல் என்ற தவறான எண்ணத்தைத் தரக்கூடும்; தெரிவின் துல்லியமான முறை வசனத்தில் வெளிப்படையாகக் கூறப்படாததால் அதைச் சேர்க்கவில்லை.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகருக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. எபிரேய உரையின் இருமுறை வரும் ‘முன்வரச் செய்தார்’ அமைப்பும் படிப்படியான தெரிவு நடைமுறையும் பேணப்பட்டுள்ளன.
