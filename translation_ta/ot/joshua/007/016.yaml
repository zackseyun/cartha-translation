  terminology: ‘யோசுவா,’ ‘இஸ்ரவேல்,’ ‘கோத்திரம்,’ and ‘யூதா’ are appropriate established Tamil biblical forms. ‘பிடிக்கப்பட்டது’ preserves the marked passive idiom; the footnote appropriately prevents a literal criminal-arrest sense from being imposed.
