  text: וַ/יַּשְׁכֵּ֤ם יְהוֹשֻׁ֨עַ֙ בַּ/בֹּ֔קֶר וַ/יַּקְרֵ֥ב אֶת יִשְׂרָאֵ֖ל לִ/שְׁבָטָ֑י/ו וַ/יִּלָּכֵ֖ד שֵׁ֥בֶט יְהוּדָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/016.yaml
  text: Joshua rose early in the morning and brought Israel near by its tribes[b][a], and the tribe of Judah was taken.
translation:
  language: ta
  text: யோசுவா அதிகாலையில் எழுந்து, இஸ்ரவேலை அதன் கோத்திரங்களின்படி முன்னே கொண்டுவந்தார்[a]. அப்போது யூதா கோத்திரம் பிடிக்கப்பட்டது[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இஸ்ரவேலை அதன் கோத்திரங்களின்படி அருகே கொண்டுவந்தார்.”
    reason: lexical_alternative
  - marker: b
    text: “பிடிக்கப்பட்டது” என்பது இந்தத் தேர்வு நடைமுறையில் தனியே பிரித்தறியப்பட்டது அல்லது அடையாளம் காணப்பட்டது என்று பொருள்படும் எபிரெய மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁכֵּם ... בַּבֹּקֶר
  choice: அதிகாலையில் எழுந்து
  rationale: שׁכם என்பதன் ஹிப்ஃபில் வடிவம் அதிகாலையில் எழுவதைக் குறிக்கிறது; בַּבֹּקֶר உடன் சேர்ந்து நேர வலியுறுத்தலை இயல்பான தமிழில் தருகிறது.
- source_word: וַיַּקְרֵב
  choice: முன்னே வரச் செய்தார்
  rationale: קרב என்பதன் ஹிப்ஃபில் வடிவம் ‘அருகே கொண்டுவருதல்/முன்னே கொண்டுவருதல்’ எனப் பொருள்படும். தேர்ந்தெடுக்கும் நடைமுறைச் சூழலில் ‘முன்னே வரச் செய்தார்’ இயல்பாகவும் மூலத்தின் பொருளுக்கு நெருக்கமாகவும் உள்ளது.
- source_word: אֶת יִשְׂרָאֵל
  choice: இஸ்ரவேலை
  rationale: உடன்படிக்கை மக்களை ஒட்டுமொத்தமாகக் குறிக்கும் ‘இஸ்ரவேல்’ என்ற நேரடி பெயர் வடிவம் தக்கவைக்கப்படுகிறது.
- source_word: לִשְׁבָטָיו
  choice: அதன் கோத்திரங்களின்படி
  rationale: לִ இங்கு கோத்திரப் பிரிவுகளின் அடிப்படையிலான ஒழுங்கைக் குறிக்கிறது. ‘கோத்திரங்களின்படி’ பகிர்ந்தமைந்த பொருளைத் தெளிவாகத் தருகிறது.
- source_word: וַיִּלָּכֵד
  choice: பிடிக்கப்பட்டது
  rationale: לכד என்பதன் நிஃபால் வடிவத்தின் நேரடிப் பொருள் ‘பிடிக்கப்பட்டது’. இச்சூழலில் அது நடைமுறையில் தனியே அடையாளம் காணப்பட்டதைக் குறித்தாலும், மூலத்தின் செயப்பாட்டு மரபுத்தொடரைத் தக்கவைக்கிறது.
- source_word: שֵׁבֶט יְהוּדָה
  choice: யூதா கோத்திரம்
  rationale: எபிரெயக் கட்டமைப்பின் இயல்பான, தெளிவான தமிழ் இணை.
theological_decisions:
- issue: וַיִּלָּכֵד குறிக்கும் தேர்வு நடைமுறையின் தன்மை
  choice: முதன்மை உரையில் ‘பிடிக்கப்பட்டது’ என்ற செயப்பாட்டு மரபுத்தொடரைத் தக்கவைத்தல்
  alternative: ‘தேர்ந்தெடுக்கப்பட்டது’, ‘சீட்டுப்போட்டுத் தேர்ந்தெடுக்கப்பட்டது’, அல்லது ‘அடையாளம் காணப்பட்டது’
  rationale: இந்தக் கூறில் தேர்வு எவ்வாறு நடைபெற்றது அல்லது யாரால் செய்யப்பட்டது என்பது வெளிப்படையாகச் சொல்லப்படவில்லை. ஆகவே ‘சீட்டுப்போட்டு’ அல்லது ‘கர்த்தரால்’ என்ற விளக்கத்தைச் சேர்க்காமல், மூலத்தின் தெளிவின்மையும் இறையியல் அழுத்தமும் பாதுகாக்கப்படுகின்றன.
translation_notes:
  register: நவீனத் தரமான, மரியாதைமிக்க, பொதுவாசகர்களுக்குப் புரியும் தமிழ். ‘கோத்திரம்’ என்ற பரவலாக அறியப்பட்ட வேதாகமச் சொல் பயன்படுத்தப்பட்டுள்ளது; மூலத்தின் நடைமுறைச் சார்ந்த செயப்பாட்டு மொழியும் உண்மையான தெளிவின்மையும் பாதுகாக்கப்பட்டுள்ளன.
