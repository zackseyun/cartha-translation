revisions:
- from: இஸ்ரவேல் பாவம் செய்திருக்கிறது. அதுமட்டுமல்ல, நான் அவர்களுக்குக் கட்டளையிட்ட என் உடன்படிக்கையை அவர்கள் மீறியிருக்கிறார்கள்; அழிவுக்கென ஒதுக்கப்பட்டவற்றிலிருந்து சிலவற்றை எடுத்திருக்கிறார்கள்[a]; திருடியிருக்கிறார்கள்; வஞ்சித்திருக்கிறார்கள்[b]; அவற்றைத் தங்கள் சொந்தப் பொருட்களோடு வைத்திருக்கிறார்கள்[c].
  to: இஸ்ரவேல் பாவம் செய்திருக்கிறது. மேலும், நான் அவர்களுக்குக் கட்டளையிட்ட என் உடன்படிக்கையை அவர்கள் மீறியிருக்கிறார்கள். மேலும், அழிவுக்கென ஒதுக்கப்பட்டவற்றிலிருந்து எடுத்திருக்கிறார்கள்[a]; மேலும், திருடியிருக்கிறார்கள்; மேலும், வஞ்சித்திருக்கிறார்கள்[b]; மேலும், அவற்றைத் தங்கள் உடைமைகளுக்குள் வைத்திருக்கிறார்கள்[c].
  rationale: ‘பொருட்களோடு’ என்பதை ‘உடைமைகளுக்குள்’ என மாற்றி בִּכְלֵיהֶם-ன் இடப்பொருளைத் துல்லியமாக்கினேன். மீண்டும் வரும் וְגַם-இன் அடுக்கான வலியுறுத்தலைக் காக்க ஒவ்வொரு குற்றச்சாட்டுக்கும் ‘மேலும்’ சேர்க்கப்பட்டது. அடிக்குறிப்புகள் புதிய சொற்களுக்கும் அடையாளங்களுக்கும் ஏற்ப முழுமையாக ஒத்திசைக்கப்பட்டன.
