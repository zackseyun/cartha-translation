base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/011.yaml
  text: Israel has sinned[a]. They have also transgressed my covenant that I commanded them, and they have also taken some of what was devoted to destruction, and they have also stolen, and they have also deceived[c][b], and they have also put it among their own belongings.
translation:
  language: ta
  text: இஸ்ரவேல் பாவம் செய்திருக்கிறது. மேலும், நான் அவர்களுக்குக் கட்டளையிட்ட என் உடன்படிக்கையை அவர்கள் மீறியிருக்கிறார்கள். மேலும், அழிவுக்கென ஒதுக்கப்பட்டவற்றிலிருந்து எடுத்திருக்கிறார்கள்[a]; மேலும், திருடியிருக்கிறார்கள்; மேலும், வஞ்சித்திருக்கிறார்கள்[b]; மேலும், அவற்றைத் தங்கள் உடைமைகளுக்குள் வைத்திருக்கிறார்கள்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இன்னும் சொல்லுக்குச் சொல் முறையில், “தடையிடப்பட்டவற்றிலிருந்து எடுத்திருக்கிறார்கள்” அல்லது “தடைக்குரியவற்றிலிருந்து எடுத்திருக்கிறார்கள்.”
    reason: חֵרֶם என்ற எபிரெயச் சொல்லின் தடை விதித்தல், அர்ப்பணித்தல், அழிவுக்கு ஒதுக்குதல் ஆகிய பொருள் நிழல்களைப் பாதுகாக்கும் மாற்று மொழிபெயர்ப்பு.
  - marker: b
    text: அல்லது, “பொய் சொல்லியிருக்கிறார்கள்” அல்லது “அதை மறுத்திருக்கிறார்கள்.”
    reason: כחש என்ற வினை வஞ்சித்தல், பொய் கூறுதல், மறுத்தல் ஆகிய பொருள்களைக் கொள்ளக்கூடும்.
  - marker: c
    text: எபிரெயில், “தங்கள் பாத்திரங்கள்/பொருட்களுக்குள் வைத்திருக்கிறார்கள்”; இங்கு அவற்றைத் தங்கள் உடைமைகளுக்குள் மறைத்து வைத்ததைக் குறிக்கிறது.
    reason: כְּלִים என்ற சொல்லின் நேரடிப் பொருளையும் சூழல்சார் பொருளையும் விளக்குகிறது.
lexical_decisions:
- source_word: חָטָא יִשְׂרָאֵל
  choice: இஸ்ரவேல் பாவம் செய்திருக்கிறது
  rationale: மூலத்தில் ‘இஸ்ரவேல்’ ஒருமைக் கூட்டுப்பெயராக வந்து, பாவம் முழு மக்களுக்கும் உரியதாகக் கூறப்படுகிறது. அதன் இறையியல் கனத்தையும் கூட்டுப்பொறுப்பையும் இவ்வாக்கியம் காக்கிறது.
- source_word: עָבְרוּ אֶת־בְּרִיתִי
  choice: என் உடன்படிக்கையை அவர்கள் மீறியிருக்கிறார்கள்
  rationale: உடன்படிக்கையின் வரம்பை மீறுதல் அல்லது அதைச் செல்லாததுபோல் நடத்துதல் என்ற பொருளை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: אֲשֶׁר צִוִּיתִי אוֹתָם
  choice: நான் அவர்களுக்குக் கட்டளையிட்ட
  rationale: ‘அவர்கள் கடைப்பிடிக்கும்படி’ என்பது பொருளில் உட்கிடந்தாலும் மூலத்தில் வெளிப்படையாக இல்லை; ஆகவே அதைச் சேர்க்கவில்லை.
- source_word: לָקְחוּ מִן־הַחֵרֶם
  choice: அழிவுக்கென ஒதுக்கப்பட்டவற்றிலிருந்து சிலவற்றை எடுத்திருக்கிறார்கள்
  rationale: חֵרֶם என்பது தடை விதிக்கப்பட்டு அழிவுக்காக ஒதுக்கப்பட்ட பொருட்களைக் குறிக்கிறது. מן என்பதன் பகுதி சார்ந்த பொருளை ‘சிலவற்றை’ தெளிவுபடுத்துகிறது.
- source_word: גָּנְבוּ
  choice: திருடியிருக்கிறார்கள்
  rationale: வினையின் நேரடியான ஒழுக்கநெறிப் பொருளைத் துல்லியமாகத் தருகிறது.
- source_word: כִּחֲשׁוּ
  choice: வஞ்சித்திருக்கிறார்கள்
  rationale: இச்சொல் பொய் கூறுதல், ஏமாற்றுதல் அல்லது மறுத்தல் ஆகிய பரப்பைக் கொண்டது. ‘வஞ்சித்தல்’ அந்தப் பரந்த பொருளைத் தீர்மானித்துவிடாமல் காக்கிறது.
- source_word: שָׂמוּ בִכְלֵיהֶם
  choice: அவற்றைத் தங்கள் சொந்தப் பொருட்களோடு வைத்திருக்கிறார்கள்
  rationale: כְּלִים என்பது பாத்திரங்கள், கருவிகள், உடைமைகள் போன்ற பரந்த பொருளுடையது. இச்சூழலில் தடைசெய்யப்பட்ட பொருட்களைத் தங்கள் உடைமைகளில் மறைத்து வைத்ததைக் குறிக்க இயல்பான தமிழாக்கம் பயன்படுத்தப்பட்டுள்ளது.
- source_word: וְגַם ... וְגַם ... וְגַם
  choice: அதுமட்டுமல்ல ... ; ... ; ...
  rationale: குற்றச்சாட்டுகள் ஒன்றன்மேல் ஒன்றாக அடுக்கப்படுவதை ‘அதுமட்டுமல்ல’ என்பதும் தொடர்ச்சியான அரைப்புள்ளிகளும் வெளிப்படுத்துகின்றன; ஒவ்வொரு இடத்திலும் ஒரே சொல்லை மீண்டும் பயன்படுத்துவதால் தமிழில் ஏற்படும் செயற்கைத்தன்மை தவிர்க்கப்படுகிறது.
theological_decisions:
- issue: ஒரு தனிநபரின் செயலை முழு இஸ்ரவேலின் பாவமாகக் கூறுதல்
  choice: ‘இஸ்ரவேல்’ என்ற கூட்டுப்பொருள் எழுவாயையும், பின்னர் வரும் ‘அவர்கள்’ என்ற பன்மையையும் அப்படியே காத்தல்
  alternative: குற்றத்தை ஆகானுக்கு மட்டும் உரியதாக வெளிப்படையாக மாற்றிக் கூறுதல்
  rationale: எபிரெய உரை பாவத்தை உடன்படிக்கை மக்களான இஸ்ரவேலுக்கே கூட்டாகச் சுமத்துகிறது. அந்த இறையியல் பதற்றத்தை மொழிபெயர்ப்பு தனிநபருக்கு மட்டும் சுருக்கித் தீர்க்கக்கூடாது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகருக்குப் புரியும் dignified நடையில் வடிவமைக்கப்பட்டது. ‘பாவம்’, ‘உடன்படிக்கை’ போன்ற நிலைபெற்ற வேதாகமச் சொற்கள் இறையியல் கனத்திற்காகத் தக்கவைக்கப்பட்டன. ஒருமைக் கூட்டுப்பெயரிலிருந்து பன்மைப் பிரதிப்பெயருக்கு மாறும் மூலத்தின் அமைப்பும் பாதுகாக்கப்பட்டது.
