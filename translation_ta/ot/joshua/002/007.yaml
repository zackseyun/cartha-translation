  yaml_path: translation/ot/joshua/002/007.yaml
  text: And the men pursued after them on the way to the Jordan[a], as far as the fords, and they shut the gate behind them as soon as the pursuers had gone out after them.
translation:
  language: ta
  text: அந்த ஆட்கள் அவர்களைப் பின்தொடர்ந்து, யோர்தானை நோக்கிய வழியாகக் கடவுத்துறைகள் வரை சென்றார்கள். அவர்களைப் பின்தொடர்ந்து துரத்திச் சென்றவர்கள் வெளியேறியவுடனே, வாயிலை மூடினார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהָאֲנָשִׁים
  choice: அந்த ஆட்கள்
  rationale: முன்னர் குறிப்பிடப்பட்ட அரசனின் ஆட்களைச் சுட்டும் எபிரெய வரையறைச் சொல்லை இயல்பான தமிழில் வெளிப்படுத்துகிறது; தொடர்ச்சியான וְ தனியே மொழிபெயர்க்கப்படாமல் கதைநடையில் இயல்பாக்கப்பட்டுள்ளது.
- source_word: רָדְפוּ אַחֲרֵיהֶם
  choice: அவர்களைப் பின்தொடர்ந்து ... சென்றார்கள்
  rationale: தேடிப் பிடிக்கும் நோக்கில் பின்னால் சென்ற செயலைத் தெளிவாகவும் இயல்பாகவும் கூறுகிறது.
- source_word: דֶּרֶךְ הַיַּרְדֵּן
  choice: யோர்தானுக்குச் செல்லும் வழியாக
  rationale: דֶּרֶךְ என்பதன் ‘வழி/சாலை’ பொருளையும், இச்சூழலில் யோர்தானை நோக்கிச் சென்ற பாதையையும் காக்கிறது.
- source_word: עַל הַמַּעְבְּרוֹת
  choice: ஆற்றின் கடவுத்துறைகள் வரை
  rationale: מַעְבָּרוֹת என்பது ஆற்றைக் கடக்கக்கூடிய ஆழமற்ற இடங்களைக் குறிக்கிறது; பயணச் சூழலில் עַל சென்றடைந்த எல்லையைச் சுட்டுவதால் ‘வரை’ என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: וְהַשַּׁעַר סָגָרוּ
  choice: வாயிற்கதவை மூடினார்கள்
  rationale: வரையறுக்கப்பட்ட ஒருமைச் சொல் நகர வாயிலின் கதவைக் குறிப்பதைச் சூழல் காட்டுகிறது; ‘வாயிற்கதவு’ என்பது கூடுதல் விளக்கமின்றி இயல்பான தமிழ்.
- source_word: כַּאֲשֶׁר יָצְאוּ
  choice: வெளியே சென்றவுடனே
  rationale: துரத்திச் சென்றவர்கள் வெளியேறியதும் வாயில் உடனடியாக மூடப்பட்ட கதைத் தொடர்ச்சியை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: הָרֹדְפִים אַחֲרֵיהֶם
  choice: அவர்களைப் பின்தொடர்ந்தவர்கள்
  rationale: பெயர்ச்சொல்லாகப் பயன்படும் எபிரெய வினையெச்சத்தையும், ஒற்றர்கள் மீண்டும் சுட்டப்படுவதையும் தெளிவாகப் பாதுகாக்கிறது.
