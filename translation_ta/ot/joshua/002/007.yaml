  source_fidelity: முதல் வாக்கியத்தில் துரத்தல், யோர்தானை நோக்கிய வழி, கடவுத்துறைகள் வரை என்ற கூறுகள் பொதுவாகச் சரியாக உள்ளன. ஆனால் இரண்டாம் வாக்கியத்தில் «அவர்களைப் பின்தொடர்ந்தவர்கள் ... வாயிற்கதவை மூடினார்கள்» என்பது வாயிலை மூடியவர்களைத் துரத்திச் சென்றவர்களாகத் தெளிவாகக் காட்டுகிறது. எபிரெயத்தில் சாகாரு என்ற பன்மை வினைச்சொல்லின் செய்பவர் வெளிப்படையாகக் குறிப்பிடப்படவில்லை; துரத்திச் சென்றவர்களே மூடினார்கள் என்று கட்டாயப்படுத்தப்படவில்லை. ஆகவே அந்தத் தெளிவாக்கத்தை நீக்க வேண்டும்.
  naturalness: «யோர்தானுக்குச் செல்லும் வழியாக ஆற்றின் கடவுத்துறைகள்» என்பது ஓரளவு கனமாகவும், யோர்தான் ஏற்கெனவே ஆறு என்பதைத் தேவையற்ற வகையில் மீண்டும் சொல்வதாகவும் உள்ளது. «யோர்தானை நோக்கிய வழியாகக் கடவுத்துறைகள் வரை» நவீனத் தரத் தமிழில் நேர்த்தியாக உள்ளது. «வாயிலை மூடினார்கள்» என்பது நகரவாயிலுக்குப் பொருத்தமான இயல்பான நடை.
