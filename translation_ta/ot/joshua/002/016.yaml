translation_notes:
  register: நவீனத் தரத் தமிழில், மரியாதைமிக்க ஆனால் பொதுவாசகர்களுக்கு எளிதில் புரியும் நடை பயன்படுத்தப்பட்டது. நேரடி உரையின் அவசரத் தன்மை சுருக்கமான ஏவல் வாக்கியங்களால் காக்கப்பட்டுள்ளது. மூலத்தில் இல்லாத இடக்குறிப்பு ‘உங்களை எதிர்கொள்ள’ என்பதற்குப் பின் சேர்க்கப்படவில்லை.
