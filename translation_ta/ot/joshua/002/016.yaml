base_translation:
  language: en
  yaml_path: translation/ot/joshua/002/016.yaml
  text: And she said to them[a], "Go to the hill country, lest the pursuers encounter you, and hide yourselves there three days, until the pursuers return[b]. Afterward you may go on your way."
translation:
  language: ta
  text: அவள் அவர்களிடம், “உங்களைத் துரத்துகிறவர்கள் உங்களைச் சந்திக்காதபடி மலைப்பகுதிக்குப்[a] போங்கள். அவர்கள் திரும்பிவரும்வரை மூன்று நாட்கள் அங்கே ஒளிந்திருங்கள்; அதன்பின் உங்கள் வழியில் செல்லுங்கள்” என்றாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மலைக்கு”; எபிரெயச் சொல் ஒரு குறிப்பிட்ட மலையையோ அதைச் சுற்றியுள்ள மலைப்பகுதியையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָהָרָה
  choice: மலைப்பகுதிக்கு
  rationale: הַר என்பது ஒரு குறிப்பிட்ட மலையையோ மலைகள் நிறைந்த பகுதியையோ குறிக்கலாம். இச்சூழலில் ஒளிந்துகொள்ள ஏற்ற அருகிலுள்ள கரடுமுரடான நிலப்பகுதி குறிக்கப்படுவதால், இயல்பான தமிழில் ‘மலைப்பகுதிக்கு’ என வழங்கப்பட்டது; மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: לֵּכוּ
  choice: போங்கள்
  rationale: הלך என்பதன் பன்மை ஏவல் வடிவத்தை நேரடியாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: פֶּן
  choice: எதிர்கொள்ளாதபடி
  rationale: פֶּן குறிக்கும் எதிர்மறை முன்னெச்சரிக்கை அல்லது தவிர்ப்பு நோக்கத்தை தமிழில் இயல்பான சார்பு அமைப்பால் தெரிவிக்கிறது.
- source_word: יִפְגְּעוּ בָכֶם
  choice: உங்களை எதிர்கொள்ள
  rationale: פגע ב என்பது சந்தித்தல், எதிர்ப்படுதல், வந்து மோதுதல் ஆகிய பொருள்களைக் கொள்ளலாம். துரத்தும் சூழலின் பகைமைத் தன்மையை மிகைப்படுத்தாமல் ‘எதிர்கொள்ள’ என்பது அடிப்படைச் சந்திப்பு உணர்வைப் பாதுகாக்கிறது.
- source_word: הָרֹדְפִים
  choice: உங்களைத் துரத்துகிறவர்கள்
  rationale: רדף என்பதன் பெயர்ச்செயலெச்சப் பயன்பாட்டையும் யாரைத் துரத்துகிறார்கள் என்ற சூழல் சார்ந்த குறிப்பையும் சாதாரண வாசகருக்கு தெளிவாகத் தருகிறது.
- source_word: וְנַחְבֵּתֶם
  choice: ஒளிந்திருங்கள்
  rationale: நிபால் வடிவத்தின் தம்மை மறைத்துக்கொள்ளும் பொருளை இயல்பான தமிழ் ஏவலாகக் காட்டுகிறது.
- source_word: שָׁמָּה
  choice: அங்கே
  rationale: முன்னர் குறிப்பிடப்பட்ட மலைப்பகுதியில் ஒளிந்திருக்க வேண்டிய இடத்தைக் குறிக்கும் இடவினையடை.
- source_word: שְׁלֹשֶׁת יָמִים
  choice: மூன்று நாட்கள்
  rationale: கால நீட்சியைக் குறிக்கும் எபிரெயச் சொற்றொடரின் நேரடியான, இயல்பான தமிழ் இணை.
- source_word: עַד שׁוֹב הָרֹדְפִים
  choice: அவர்கள் திரும்பிவரும்வரை
  rationale: עַד உடன் வரும் שוב இறுதி காத்திருப்பு எல்லையைச் சுட்டுகிறது. ‘அவர்கள்’ என்பது உடனடியாக முன்வந்த துரத்துகிறவர்களையே தெளிவாகக் குறிக்கிறது.
- source_word: וְאַחַר
  choice: அதன்பின்
  rationale: ஒளிந்திருக்கும் காலத்திற்குப் பிந்தைய அடுத்த நிகழ்வைச் சுருக்கமாகக் குறிக்கிறது.
- source_word: תֵּלְכוּ לְדַרְכְּכֶם
  choice: உங்கள் வழியில் செல்லுங்கள்
  rationale: சொல்லாட்சியில் ‘உங்கள் வழிக்குச் செல்லுங்கள்’ என்றாலும், இலக்கு நோக்கிய பயணத்தை இயல்பான தமிழில் ‘உங்கள் வழியில் செல்லுங்கள்’ என்று தருவது பொருளைப் பாதுகாக்கிறது.
