base_translation:
  language: en
  yaml_path: translation/ot/joshua/002/002.yaml
  text: And it was said to the king of Jericho[a], “Look, men have come here tonight from the Israelites to search out the land.”
translation:
  language: ta
  text: எரிகோவின் அரசனிடம், “இதோ, இஸ்ரவேல் மக்களைச் சேர்ந்த ஆண்கள் இந்த இரவில் இங்கே நாட்டை ஆராய்வதற்காக வந்திருக்கிறார்கள்[a]” என்று சொல்லப்பட்டது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “நாட்டை வேவு பார்ப்பதற்காக” என்றும் மொழிபெயர்க்கலாம். எபிரெய வினைச்சொல் தேடுதல் அல்லது ஆராய்தல் என்ற பொருளைக் கொண்டிருக்கலாம்; இச்சூழலில் அது உளவறியும் நோக்குடன் நிலப்பகுதியை ஆராய்வதைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּאָמַר
  choice: என்று சொல்லப்பட்டது
  rationale: செயலைச் செய்தவர் யார் என்பதை எபிரெய உரை குறிப்பிடவில்லை. எனவே ஊகமாக ஓர் எழுவாயைச் சேர்க்காமல், ஆளில்லாப் பாங்கைத் தக்கவைக்கிறது.
- source_word: לְמֶלֶךְ יְרִיחוֹ
  choice: எரிகோவின் அரசனிடம்
  rationale: அரசியல் பட்டத்தையும் எரிகோவுடனான உடைமைத் தொடர்பையும் இயல்பான நவீன தமிழில் தருகிறது.
- source_word: הִנֵּה
  choice: இதோ
  rationale: அவசரமான செய்தியின்மீது கவனத்தை ஈர்க்கும் சுட்டிடைச்சொல்லின் வலிமையைச் சுருக்கமாகப் பாதுகாக்கிறது.
- source_word: אֲנָשִׁים
  choice: ஆண்கள்
  rationale: இங்கு ஆண் நபர்களையே குறிக்கும் சொல்லை பாலினத் துல்லியத்துடன் மொழிபெயர்க்கிறது.
- source_word: בָּאוּ הֵנָּה
  choice: இங்கே வந்திருக்கிறார்கள்
  rationale: அவர்கள் வந்து சேர்ந்துவிட்டதையும் அந்த வருகை தற்போதைய சூழலுக்குப் பொருத்தமானதையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: הַלַּיְלָה
  choice: இந்த இரவில்
  rationale: அவர்கள் வந்த நடப்பு இரவைக் குறிக்கும் மூலச்சொல்லின் காலச் சுட்டைத் தெளிவாகக் காட்டுகிறது.
- source_word: מִבְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்களைச் சேர்ந்த
  rationale: ‘இஸ்ரவேலின் மகன்கள்’ என்ற சொல்லுக்குச் சொல் வடிவத்தைத் தவிர்த்து, இஸ்ரவேல் மக்களினத்துடனான அவர்களின் உறுப்பினர் தொடர்பைத் தெளிவாகத் தருகிறது.
- source_word: לַחְפֹּר
  choice: ஆராய்ந்து பார்ப்பதற்காக
  rationale: இந்தச் சூழலில் நிலப்பகுதியை உளவறியும் நோக்குடன் ஆராய்வதைக் குறிக்கிறது. பிரதான உரையில் ‘வேவுபார்க்க’ என்ற அதிக விளக்கமான சொல்லைத் தவிர்த்து, மூலச்சொல்லின் பரந்த தேடல்/ஆய்வு நுணுக்கத்தைப் பாதுகாக்கிறது.
- source_word: אֶת הָאָרֶץ
  choice: நாட்டை
  rationale: இங்கு ஆய்வுக்குரிய பிரதேசத்தைக் குறிக்கும் הָאָרֶץ என்பதற்கு இயல்பான, சூழலுக்கேற்ற தமிழ் இணைச்சொல்.
