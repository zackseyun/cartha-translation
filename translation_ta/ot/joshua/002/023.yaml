  register: நவீன நிலையான தமிழில், கண்ணியமானதும் பொதுவாசகர்களுக்கு எளிதில் புரியக்கூடியதுமான நடை. எபிரெய உரையின் தொடர் வினைநிகழ்வுகள் தமிழ் வினையெச்ச அமைப்பில் இயல்பாக வழங்கப்பட்டுள்ளன; மூலத்தில் சொல்லப்படாத ‘உளவாளிகள்’ அல்லது ‘யோர்தான்’ போன்ற விளக்கங்கள் சேர்க்கப்படவில்லை.
