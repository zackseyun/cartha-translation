base_translation:
  language: en
  yaml_path: translation/ot/joshua/002/023.yaml
  text: Then the two men returned[a], came down from the hill country, crossed over, and came to Joshua son of Nun; and they told him all that had happened to them.
translation:
  language: ta
  text: அப்போது அந்த இரண்டு மனிதர்களும் திரும்பி வந்து, மலைப்பகுதியிலிருந்து இறங்கி, கடந்து, நூனின் மகன் யோசுவாவிடம் வந்தார்கள். தங்களுக்கு நேரிட்ட அனைத்தையும்[a] அவரிடம் விவரித்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தங்களுக்கு நிகழ்ந்த எல்லாவற்றையும்”; இன்னும் சொற்சார்பாக, “தங்களைக் கண்டடைந்த அனைத்தையும்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֻׁבוּ
  choice: திரும்பி வந்து
  rationale: שוב என்பதன் தொடர்கதைச் சூழலிலான இயல்பான பொருள், பணிக்குப் பிறகு திரும்புதல். தமிழில் அடுத்தடுத்த வினைநிகழ்வுகளோடு இயல்பாக இணைய ‘திரும்பி வந்து’ என மொழிபெயர்க்கப்பட்டது.
- source_word: שְׁנֵי הָאֲנָשִׁים
  choice: அந்த இரண்டு மனிதர்களும்
  rationale: எபிரெய மூலத்தில் ‘உளவாளிகள்’ என்று அல்ல, ‘இரண்டு மனிதர்கள்’ என்றே உள்ளது; சூழலுக்கு அப்பாற்பட்ட அடையாளத்தைச் சேர்க்காமல் அதையே காக்கிறது.
- source_word: וַיֵּרְדוּ מֵהָהָר
  choice: மலைப்பகுதியிலிருந்து இறங்கி
  rationale: הָהָר என்பது ஓர் ஒற்றை மலையையும் மலைப்பாங்கான பகுதியையும் குறிக்கலாம். இங்குள்ள புவியியல் சூழலில் ‘மலைப்பகுதி’ இயல்பானதும் பொருத்தமானதும்.
- source_word: וַיַּעַבְרוּ
  choice: மறுகரைக்குக் கடந்து
  rationale: עבר என்பது ‘கடத்தல்/கடந்து செல்லுதல்’ என்று பொருள். எதைக் கடந்தார்கள் என்பதை மூலம் வெளிப்படையாகக் கூறாததால், யோர்தான் என்று சேர்க்காமல் கடப்பின் கருத்தைத் தெளிவாக்குகிறது.
- source_word: וַיָּבֹאוּ אֶל יְהוֹשֻׁעַ בִּן נוּן
  choice: நூனின் மகன் யோசுவாவிடம் வந்தார்கள்
  rationale: בוא + אֶל என்பதற்கு ‘அவரிடம் வந்தார்கள்’ இயல்பான தமிழ்; தந்தைவழி அடையாளமும் முழுமையாகத் தக்கவைக்கப்படுகிறது.
- source_word: וַיְסַפְּרוּ לוֹ
  choice: அவரிடம் விவரித்தார்கள்
  rationale: பியேல் வடிவிலுள்ள ספר இங்கு சொல்லுதல் அல்லது நடந்ததை விவரித்தல் என்று பொருள். அறிக்கைச் சூழலை இயல்பாக வெளிப்படுத்த ‘விவரித்தார்கள்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: אֵת כָּל הַמֹּצְאוֹת אוֹתָם
  choice: தங்களுக்கு நேரிட்ட அனைத்தையும்
  rationale: சொல்லுக்கு சொல் ‘அவர்களைக் கண்டடைந்த அனைத்தும்’ என்ற அமைப்பு, அவர்களுக்கு நிகழ்ந்த அல்லது நேரிட்ட அனைத்தையும் குறிக்கும் எபிரெய மரபுத்தொடர். ‘அனைத்தையும்’ என்பது כָּל-இன் முழுமையைப் பாதுகாக்கிறது.
