translation_notes:
  register: நவீனத் தரத் தமிழில், உரையாடலுக்கேற்ற இயல்பும் வேதாகமக் கதையுரைக்கேற்ற கண்ணியமும் பேணப்பட்டுள்ளன. வாசல் எரிகோவின் நகரவாசல் என்பது சூழலில் தெளிவாக இருப்பதால் விளக்கச் சொல் சேர்க்கப்படவில்லை.
