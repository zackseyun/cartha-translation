source:
  edition: WLC
  text: וַ/יְהִ֨י הַ/שַּׁ֜עַר לִ/סְגּ֗וֹר בַּ/חֹ֨שֶׁךְ֙ וְ/הָ/אֲנָשִׁ֣ים יָצָ֔אוּ לֹ֣א יָדַ֔עְתִּי אָ֥נָה הָלְכ֖וּ הָֽ/אֲנָשִׁ֑ים רִדְפ֥וּ מַהֵ֛ר אַחֲרֵי/הֶ֖ם כִּ֥י תַשִּׂיגֽוּ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/002/005.yaml
  text: And when the gate was about to be shut at dark[a], the men went out. I do not know where the men went. Pursue them quickly, for you will overtake them.
translation:
  language: ta
  text: இருள் சூழத் தொடங்கியபோது வாசல் மூடப்படவிருந்தது; அந்த மனிதர்கள் வெளியே சென்றார்கள். அந்த மனிதர்கள் எங்கே சென்றார்கள் என்று எனக்குத் தெரியாது. விரைவாக அவர்களைத் துரத்துங்கள்; நீங்கள் அவர்களை எட்டிப்பிடித்துவிடுவீர்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי ... לִסְגּוֹר
  choice: மூடப்படவிருந்த சமயத்தில்
  rationale: היה உடன் ל־ infinitive வருவது நிகழவிருந்த செயலைக் குறிக்கிறது. தமிழில் இயல்பான காலச்சூழல் வாக்கியமாக அமைக்கப்பட்டுள்ளது.
- source_word: הַשַּׁעַר
  choice: வாசல்
  rationale: இது எரிகோ நகரவாசலைக் குறித்தாலும், எபிரெய உரையைப் போலவே சூழலால் விளங்கும் பொதுச் சொல்லே வைக்கப்பட்டுள்ளது.
- source_word: בַּחֹשֶׁךְ
  choice: இருள் சூழத் தொடங்கியபோது
  rationale: வாசல் மூடப்பட்ட நேரமாக இருளின் தொடக்கத்தை இச்சொற்றொடர் குறிக்கிறது; வெறும் 'இருளில்' என்பதைக் காட்டிலும் காலப்பொருளைத் தெளிவாகத் தருகிறது.
- source_word: וְהָאֲנָשִׁים יָצָאוּ
  choice: அந்த மனிதர்கள் வெளியே சென்றுவிட்டார்கள்
  rationale: יצא என்பதன் நேரடியான இயக்கப்பொருளான 'வெளியே செல்' பாதுகாக்கப்பட்டுள்ளது; உரையாடலில் முடிந்த செயலை இயல்பாகக் காட்ட 'சென்றுவிட்டார்கள்' பயன்படுத்தப்பட்டுள்ளது.
- source_word: לֹא יָדַעְתִּי
  choice: எனக்குத் தெரியாது
  rationale: வடிவில் perfect என்றாலும், ராகாப் தன்னுடைய தற்போதைய அறியாமையைக் கூறுவதால் நவீனத் தமிழில் நிகழ்நிலை இயல்பானது.
- source_word: אָנָה הָלְכוּ הָאֲנָשִׁים
  choice: அவர்கள் எங்கே சென்றார்கள்
  rationale: אָנָה இலக்கை விசாரிக்கிறது. தமிழில் 'எங்கே சென்றார்கள்' என்பது இயல்பாக அந்த இலக்குப் பொருளை வெளிப்படுத்துகிறது; எபிரெயத்தில் பெயர்ச்சொல் மீண்டும் வந்தாலும் தமிழில் சுட்டுப்பெயர் தெளிவாக உள்ளது.
- source_word: רִדְפוּ מַהֵר אַחֲרֵיהֶם
  choice: அவர்களை விரைவாகத் துரத்திச் செல்லுங்கள்
  rationale: கட்டளையின் தீவிரத்தையும் பின்தொடரும் இயக்கத்தையும் 'துரத்திச் செல்லுங்கள்' இயல்பாகக் காக்கிறது; מַהֵר வினையடையாக 'விரைவாக' என வழங்கப்பட்டுள்ளது.
- source_word: כִּי תַשִּׂיגוּם
  choice: நீங்கள் அவர்களை எட்டிப்பிடித்துவிடுவீர்கள்
  rationale: כי காரணத்தை அறிமுகப்படுத்துகிறது; נשׂג என்பதன் பின்தொடர்ந்து எட்டுதல் என்ற பொருளை 'எட்டிப்பிடி' தெளிவாகத் தருகிறது.
