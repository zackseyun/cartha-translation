  text: וַ/תֹּ֨אמֶר֙ אֶל הָ֣/אֲנָשִׁ֔ים יָדַ֕עְתִּי כִּֽי נָתַ֧ן יְהוָ֛ה לָ/כֶ֖ם אֶת הָ/אָ֑רֶץ וְ/כִֽי נָפְלָ֤ה אֵֽימַתְ/כֶם֙ עָלֵ֔י/נוּ וְ/כִ֥י נָמֹ֛גוּ כָּל יֹשְׁבֵ֥י הָ/אָ֖רֶץ מִ/פְּנֵי/כֶֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/002/009.yaml
  text: And she said to the men[a], “I know that Yahweh has given you the land, and that the fear of you has fallen upon us[b], and that all the inhabitants of the land have melted away before you.”
translation:
  language: ta
  text: அவள் அந்த ஆண்களிடம், “யாவே இந்த நாட்டை உங்களுக்குக் கொடுத்திருக்கிறார் என்பதையும், உங்களைப் பற்றிய அச்சம் எங்கள்மேல் விழுந்துள்ளது[a] என்பதையும், இந்த நாட்டில் குடியிருப்போர் அனைவரும் உங்கள் முன்பாக உருகிப்போயிருக்கிறார்கள்[b] என்பதையும் நான் அறிவேன்” என்றாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உங்களைப் பற்றிய திகில் எங்கள்மேல் விழுந்துள்ளது.” אֵימָה என்பது கடும் அச்சம் அல்லது பேரச்சத்தைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அதாவது, “உங்களால் மனந்தளர்ந்துபோயிருக்கிறார்கள்.” எபிரெய வினைச்சொல்லின் நேர்ப்பொருள் “உருகியிருக்கிறார்கள்” என்பதாகும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר אֶל־הָאֲנָשִׁים
  choice: அவள் அந்த ஆண்களிடம் ... என்றாள்
  rationale: தொடர்ச்சியான எபிரெயக் கதைநடையை இயல்பான தமிழ்ச் சொல்வரிசையில் அளிக்கிறது; குறிப்பிட்ட ஆண்களாகிய ஒற்றர்களைக் குறிக்கும் definite article-ஐ ‘அந்த’ வெளிப்படுத்துகிறது.
- source_word: יָדַעְתִּי
  choice: நான் அறிவேன்
  rationale: முற்றுவினை இங்கு தற்போது பொருந்தும் உறுதியான அறிவைச் சுட்டுகிறது; தமிழின் நிகழ்கால நிலைவினை இதை இயல்பாகத் தருகிறது.
- source_word: נָתַן יְהוָה לָכֶם אֶת־הָאָרֶץ
  choice: யாவே இந்த நாட்டை உங்களுக்குக் கொடுத்திருக்கிறார்
  rationale: வெற்றி இன்னும் நடைபெறுகிறபோதும், கொடை நிறைவேறிய ஒன்றாக ராகாப் பேசுகிறாள். ‘கொடுத்திருக்கிறார்’ நிறைவையும் அதன் தற்போதைய விளைவையும் காக்கிறது; சூழலில் குறிப்பிட்ட நாட்டை ‘இந்த நாடு’ தெளிவாகக் குறிக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தலைப்பால் மாற்றாமல், எபிரெயத் தெய்வீகப் பெயரான YHWH-ஐ அதன் பரவலான தமிழ் ஒலிபெயர்ப்பில் வழங்குகிறது.
- source_word: נָפְלָה אֵימַתְכֶם עָלֵינוּ
  choice: உங்களைப் பற்றிய அச்சம் எங்கள்மேல் விழுந்துள்ளது
  rationale: ‘விழுதல்’ என்ற எபிரெய உருவகத்தையும், அச்சம் இஸ்ரவேலரைக் குறித்தது என்ற உறவையும் காக்கிறது. אֵימָה என்பதன் வலிமையான ‘திகில்/பேரச்சம்’ நிழற்பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: כָּל יֹשְׁבֵי הָאָרֶץ
  choice: இந்த நாட்டில் குடியிருப்போர் அனைவரும்
  rationale: பெயர்ச்சொல் தன்மையில் வரும் எபிரெயப் பங்கேற்புவினையை இயல்பான, உள்ளடக்கமான நவீன தமிழில் வழங்குகிறது.
- source_word: נָמֹגוּ
  choice: உருகிப்போயிருக்கிறார்கள்
  rationale: தைரியம் இழப்பதைக் குறிக்கும் எபிரெய ‘உருகுதல்’ உருவகத்தை உயிரோட்டத்துடன் காக்கிறது.
- source_word: מִפְּנֵיכֶם
  choice: உங்கள் முன்பாக
  rationale: இஸ்ரவேலரின் வருகை அல்லது இருப்பால் ஏற்பட்ட விளைவைக் குறிக்கக்கூடிய எபிரெயச் சொற்றொடரின் இடவியல் உருவகத்தையும் காரணவியல் தெளிவின்மையையும் காக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூல உரை தெய்வீகப் பெயரையே நேரடியாகப் பயன்படுத்துகிறது. ‘யாவே’ என்பது அதை ஒரு பட்டப்பெயரால் மாற்றாமல், நவீனத் தமிழில் பரவலாக அறியப்படும் ஒலிபெயர்ப்பில் காக்கிறது.
- issue: நாடு ஏற்கெனவே கொடுக்கப்பட்டதாக ராகாப் கூறுதல்
  choice: கொடுத்திருக்கிறார்
  alternative: கொடுக்கிறார்; கொடுத்தார்
  rationale: வெற்றி முழுமை பெறுவதற்கு முன்பே எபிரெய முற்றுவினை கொடையை உறுதியான, விளைவு நீடிக்கும் செயலாக முன்வைக்கிறது. அந்த இறையியல் பதற்றத்தை எதிர்காலமாக மாற்றாமல் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘விழுந்துள்ளது’ மற்றும் ‘உருகிப்போயிருக்கிறார்கள்’ ஆகிய மூல உருவகங்கள் வாசகருக்குப் புரியும் வகையில் காக்கப்பட்டுள்ளன; அவற்றின் மாற்றுப் பொருள்கள் அடிக்குறிப்புகளில் தரப்பட்டுள்ளன.
