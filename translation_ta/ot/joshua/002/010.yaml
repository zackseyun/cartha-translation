  text: כִּ֣י שָׁמַ֗עְנוּ אֵ֠ת אֲשֶׁר הוֹבִ֨ישׁ יְהוָ֜ה אֶת מֵ֤י יַם סוּף֙ מִ/פְּנֵי/כֶ֔ם בְּ/צֵאתְ/כֶ֖ם מִ/מִּצְרָ֑יִם וַ/אֲשֶׁ֣ר עֲשִׂיתֶ֡ם לִ/שְׁנֵי֩ מַלְכֵ֨י הָ/אֱמֹרִ֜י אֲשֶׁ֨ר בְּ/עֵ֤בֶר הַ/יַּרְדֵּן֙ לְ/סִיחֹ֣ן וּ/לְ/ע֔וֹג אֲשֶׁ֥ר הֶחֱרַמְתֶּ֖ם אוֹתָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/002/010.yaml
  text: For we have heard how Yahweh dried up the water of the Red Sea before you when you came out of Egypt[a], and what you did to the two kings of the Amorites who were beyond the Jordan—to Sihon and Og—whom you devoted to destruction.
translation:
  language: ta
  text: ஏனெனில், நீங்கள் எகிப்திலிருந்து புறப்பட்டபோது, யாவே உங்கள் முன்னால் செங்கடலின்[a] நீரை வற்றச்செய்ததையும், யோர்தானுக்கு அப்பால் இருந்த எமோரியரின் இரு அரசர்களான சீகோனுக்கும் ஓகுக்கும் நீங்கள் என்ன செய்தீர்கள் என்பதையும், அவர்களை அழிவுக்கு அர்ப்பணித்ததையும் நாங்கள் கேள்விப்பட்டோம்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் யாம் சூஃப்; பாரம்பரியமாக ‘செங்கடல்’ என்று மொழிபெயர்க்கப்படுகிறது; இன்னும் சொற்சார்ந்த பொருள் ‘நாணல் கடல்’.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய சூழலில் கூறப்பட்ட பயத்திற்கான காரணத்தை அறிமுகப்படுத்துகிறது.
- source_word: שָׁמַעְנוּ
  choice: நாங்கள் கேள்விப்பட்டோம்
  rationale: கடந்த காலத்தில் கேள்விப்பட்டு இப்போதும் தாக்கம் செலுத்தும் செய்தியை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: הוֹבִישׁ
  choice: வற்றச் செய்தார்
  rationale: יבש என்பதன் ஹிஃபில் வடிவம் ‘உலரச் செய்தல்/வற்றச் செய்தல்’ என்று பொருள்படும்; தண்ணீருக்குப் பொருத்தமான இயல்பான தமிழ் இது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய வேதாகமத்தில் உள்ள இறைத் திருப்பெயரை பொதுப்பட்டமாக மாற்றாமல் ஒலிபெயர்க்கிறது.
- source_word: מֵי יַם סוּף
  choice: செங்கடலின் தண்ணீர்
  rationale: தமிழில் நிலைபெற்ற புவியியல் பெயரை முதன்மை உரையில் பயன்படுத்தி, சொற்சார்ந்த மாற்றுப் பொருளை அடிக்குறிப்பில் தருகிறது.
- source_word: מִפְּנֵיכֶם
  choice: உங்கள் முன்னால்
  rationale: இஸ்ரவேலரின் முன்னிலையிலிருந்து நீர் அகற்றப்பட்டதை நெருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: בְּצֵאתְכֶם מִמִּצְרָיִם
  choice: நீங்கள் எகிப்திலிருந்து புறப்பட்டபோது
  rationale: ב உடனான infinitive construct குறிக்கும் காலத் தொடர்பைத் தெளிவான நவீன தமிழில் வழங்குகிறது.
- source_word: עֲשִׂיתֶם
  choice: நீங்கள் என்ன செய்தீர்கள்
  rationale: பின்னர் வரும் அழிவு குறித்த விளக்கத்திற்கு முன், மூலத்தின் பரந்த பொருளுடைய வினையைப் பாதுகாக்கிறது.
- source_word: לִשְׁנֵי מַלְכֵי הָאֱמֹרִי
  choice: எமோரியர்களின் இரண்டு அரசர்களுக்கு
  rationale: எபிரெய construct அமைப்பின் உறவைத் தெளிவாகவும் வாசிக்க எளிதாகவும் தருகிறது.
- source_word: בְּעֵבֶר הַיַּרְדֵּן
  choice: யோர்தானுக்கு அப்பால் இருந்த
  rationale: பேசுபவரின் பார்வையில் யோர்தானின் மறுபக்கத்தில் இருந்த பகுதியைக் குறிக்கிறது.
- source_word: לְסִיחֹן וּלְעוֹג
  choice: சீகோனுக்கும் ஓகுக்கும்
  rationale: இரண்டு அரசர்களின் பெயர்களை apposition ஆக அடையாளப்படுத்தும் ל அமைப்பைப் பாதுகாக்கிறது.
- source_word: הֶחֱרַמְתֶּם
  choice: அழிவுக்கு அர்ப்பணித்தீர்கள்
  rationale: חרם என்பதில் உள்ள ‘தடை/அர்ப்பணம் செய்து அழித்தல்’ என்ற தனிப்பட்ட கருத்தை வெறும் ‘அழித்தீர்கள்’ என்று தட்டையாக்காமல் காக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைத் திருப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலத்தில் நேரடியாக வரும் உடன்படிக்கைத் திருப்பெயரை பொதுப்பட்டமாக மாற்றாமல், ஏற்ற ஒலிபெயர்ப்பில் வழங்குகிறது.
- issue: חרם சார்ந்த மொழியின் மொழிபெயர்ப்பு
  choice: அழிவுக்கு அர்ப்பணித்தீர்கள்
  alternative: முற்றிலும் அழித்தீர்கள் / தடைக்குள் வைத்தீர்கள்
  rationale: இச்சொல்லிலுள்ள அர்ப்பணிப்பு மற்றும் அதனால் விளையும் அழிவு ஆகிய இரு கூறுகளையும் பாதுகாத்து, வெறும் இராணுவத் தோல்வியாகக் குறுக்காமல் வழங்குகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டது. நீண்ட எபிரெய வாக்கியத்தின் காரண–செய்தி அமைப்பு காக்கப்பட்டுள்ளது; இறுதியிலுள்ள חרם கருத்து கோடுகளுக்குள் விளக்க நிறைவாக வைக்கப்பட்டுள்ளது. அடிக்குறிப்பு குறியீடு முதன்மை உரையில் இடம்பெற்றுள்ளது.
