base_translation:
  language: en
  yaml_path: translation/ot/joshua/002/003.yaml
  text: So the king of Jericho sent to Rahab[a], saying, “Bring out the men who came to you, who entered your house, for they have come to search out all the land.”
translation:
  language: ta
  text: எனவே எரிகோவின் அரசன் ராகாபிடம் ஆளனுப்பி, “உன்னிடம் வந்து உன் வீட்டிற்குள் நுழைந்த அந்த ஆண்களை வெளியே கொண்டுவா; ஏனெனில் அவர்கள் நாடு முழுவதையும் ஆராய்ந்து அறிய வந்திருக்கிறார்கள்[a]” என்று சொன்னான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நாடு முழுவதையும் உளவு பார்க்க வந்திருக்கிறார்கள்.” இச்சூழலில் எபிரெய வினைச்சொல் உளவுநோக்குடன் ஆராய்வதையும் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: ஆளனுப்பி
  rationale: שׁלח என்பது ‘அனுப்புதல்’ என்று பொருள்படும். இங்கு அரசன் ராகாபுக்குச் செய்தி அனுப்பிய சூழலை இயல்பான தமிழில் ‘ஆளனுப்பி’ என்பது வெளிப்படுத்துகிறது; தூதரின் அடையாளத்தைத் தேவையின்றி குறிப்பதில்லை.
- source_word: מֶלֶךְ יְרִיחוֹ
  choice: எரிகோவின் அரசன்
  rationale: எபிரெயக் கட்டமைப்பிலுள்ள உடைமைத் தொடர்பைத் தெளிவாகவும் இயல்பாகவும் காட்டுகிறது.
- source_word: אֶל רָחָב
  choice: ராகாபிடம்
  rationale: אֶל இங்கு செய்தியைப் பெறுபவரைக் குறிக்கிறது; அதற்கு நவீனத் தமிழில் ‘ராகாபிடம்’ இயல்பானது.
- source_word: לֵאמֹר
  choice: என்று சொன்னான்
  rationale: நேர்க் கூற்றை அறிமுகப்படுத்தும் எபிரெய வழக்கைத் தமிழ் வாக்கிய முடிவில் இயல்பாக அமைக்கிறது.
- source_word: הוֹצִיאִי
  choice: வெளியே கொண்டுவா
  rationale: יצא என்பதன் ஹிஃபில் கட்டளை வடிவம் ‘வெளியே வரச் செய்’ என்ற வலிமையைக் கொண்டது; ‘வெளியே கொண்டுவா’ நேரடியான கட்டளையைப் பாதுகாக்கிறது.
- source_word: הָאֲנָשִׁים
  choice: அந்த ஆண்களை
  rationale: אֲנָשִׁים இங்கு குறிப்பிட்ட ஆண் நபர்களைக் குறிக்கிறது; முன்னறியப்பட்ட நபர்களைச் சுட்ட ‘அந்த’ சேர்ப்பது தமிழில் இயல்பானது.
- source_word: הַבָּאִים אֵלַיִךְ
  choice: உன்னிடம் வந்து
  rationale: பெயரெச்சத் தொடரின் கடந்தகாலக் குறிப்பைத் தமிழில் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: אֲשֶׁר בָּאוּ לְבֵיתֵךְ
  choice: உன் வீட்டிற்குள் நுழைந்த
  rationale: இரண்டாவது בוא அவர்களின் வீட்டுக்குள் வந்த செயலைத் தெளிவுபடுத்துகிறது; ‘நுழைந்த’ என்பது தேவையற்ற மறுபடியுரையைத் தவிர்க்கிறது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: கட்டளைக்கான காரணத்தைத் தெளிவாக அறிமுகப்படுத்துகிறது.
- source_word: לַחְפֹּר
  choice: உளவறிய
  rationale: חפר இச்சூழலில் ஒரு நாட்டைப் பற்றிய மறைமுக விசாரணை அல்லது உளவு ஆய்வைக் குறிக்கிறது. ‘உளவறிய’ என்பது நோக்கத்தை இயல்பாக வெளிப்படுத்தினாலும், சொல்லின் ‘ஆராய்ந்து அறிதல்’ நிழற்பொருளை அடிக்குறிப்பு பதிவு செய்கிறது.
- source_word: אֶת כָּל הָאָרֶץ
  choice: நாடு முழுவதையும்
  rationale: הָאָרֶץ இங்கு உலகத்தையல்ல, ஆய்வுக்குட்பட்ட நாட்டுப் பகுதியைக் குறிக்கிறது; ‘நாடு முழுவதையும்’ தமிழில் இயல்பானது.
- source_word: בָּאוּ
  choice: வந்திருக்கிறார்கள்
  rationale: அவர்கள் வந்ததன் தற்போதைய தொடர்பையும் அரசனின் குற்றச்சாட்டையும் தமிழ் நிறைவுநிலை வடிவம் வெளிப்படுத்துகிறது.
