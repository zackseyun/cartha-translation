  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்கு எளிதாகவும் அரச கட்டளைக்குரிய கண்ணியமான நேரடித் தொனியுடனும் மொழிபெயர்க்கப்பட்டது. எரிகோ என்பது வழக்கிலுள்ள தமிழ் வேதாகம இடப்பெயர் வடிவம்; ராகாப் என்பதற்குப் பதிலாக மூலமொழி இறுதி மெய்யை ஒலிக்கச் செய்யும் ‘ராகாப்’ வடிவமும் சாத்தியம் என்றாலும், விகுதி சேர்க்க ஏற்ற ‘ராகாப்’ அடிப்படையில் இங்கு ‘ராகாபிடம்’ பயன்படுத்தப்பட்டுள்ளது.
