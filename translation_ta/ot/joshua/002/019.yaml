  text: Anyone who goes out through the doors of your house, his blood will be on his own head, and we will be guiltless; but anyone who is with you in the house, his blood will be on our heads[a] if a hand is laid on him.
translation:
  language: ta
  text: உன் வீட்டின் கதவுகளைக் கடந்து வெளியே போகிறவர் யாராக இருந்தாலும், அவருடைய இரத்தம் அவருடைய தலையின்மேல் இருக்கும்; நாங்கள் குற்றமற்றவர்களாக இருப்போம். ஆனால் வீட்டில் உன்னோடு இருக்கிறவர் யாராக இருந்தாலும், அவருக்கு எதிராகக் கை ஓங்கினால், அவருடைய இரத்தம் எங்கள் தலைகளின்மேல் இருக்கும்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அவருடைய இரத்தம் அவருடைய தலையின்மேல் இருக்கும்’ என்பதும் ‘அவருடைய இரத்தம் எங்கள் தலைகளின்மேல் இருக்கும்’ என்பதும் இரத்தச்சிந்தல் அல்லது மரணத்துக்கான பொறுப்பு யாருக்கு என்பதைச் சுட்டும் சட்ட மரபுத்தொடர்கள்.
    reason: cultural_note
lexical_decisions:
- source_word: וְהָיָה
  choice: தனியாக மொழிபெயர்க்காமல் நிபந்தனைக் கூற்றின் அமைப்பில் வெளிப்படுத்தப்பட்டது
  rationale: இச்சொல் அடுத்த உடன்பாட்டு நிபந்தனையை அறிமுகப்படுத்துகிறது. தமிழில் தனியே ‘அப்போது நிகழும்’ என்று சேர்ப்பதைவிட நிபந்தனையை நேரடியாகக் கூறுவது இயல்பானது.
- source_word: כֹּל אֲשֶׁר
  choice: யாராக இருந்தாலும்
  rationale: சொல்லுக்குச் சொல் ‘அனைவரும்/எவரெல்லாம்’ என்றாலும், இங்கு ஒவ்வொரு நபருக்கும் தனித்தனியாகப் பொருந்தும் சட்ட நிபந்தனையை இயல்பான தமிழில் குறிக்கிறது.
- source_word: יֵצֵא מִדַּלְתֵי בֵיתֵךְ הַחוּצָה
  choice: உன் வீட்டின் கதவுகளைக் கடந்து வெளியே போகிறவர்
  rationale: வீட்டைவிட்டு வெளியேறும் இயக்கத்தைத் தெளிவாகக் கூறுகிறது; எபிரெய மொழியின் திசைச்சுட்டலைத் தேவையின்றி இருமுறை சொல்லவில்லை.
- source_word: דָּמוֹ בְרֹאשׁוֹ
  choice: அவருடைய இரத்தம் அவருடைய தலையின்மேல் இருக்கும்
  rationale: மரணம் அல்லது இரத்தச்சிந்தலுக்கான பொறுப்பைச் சுமத்தும் சட்ட மரபுத்தொடரின் உருவகத்தையும் வசனத்தின் solemn parallelism-ஐயும் பாதுகாக்கிறது; அடிக்குறிப்பு அதன் பொருளை விளக்குகிறது.
- source_word: וַאֲנַחְנוּ נְקִיִּם
  choice: நாங்கள் குற்றமற்றவர்களாக இருப்போம்
  rationale: சத்தியத்தின் கீழ் அச்சம்பவத்துக்கான பொறுப்பிலிருந்து விடுபட்டிருப்பதைச் சட்டரீதியாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: וְכֹל אֲשֶׁר יִהְיֶה אִתָּךְ בַּבַּיִת
  choice: ஆனால் வீட்டில் உன்னோடு இருக்கிறவர் யாராக இருந்தாலும்
  rationale: முந்தைய நிபந்தனைக்கு மாறாக, வீட்டுக்குள் ராகாபுடன் இருப்பவர் ஒவ்வொருவருக்கும் பாதுகாப்பு பொருந்துவதைத் தெளிவுபடுத்துகிறது.
- source_word: דָּמוֹ בְרֹאשֵׁנוּ
  choice: அவருடைய இரத்தம் எங்கள் தலைகளின்மேல் இருக்கும்
  rationale: முதல் பாதியிலுள்ள இணையான சட்ட மரபுத்தொடரை அப்படியே தக்கவைத்து, உளவாளிகள் பொறுப்பேற்பதை வெளிப்படுத்துகிறது.
- source_word: אִם יָד תִּהְיֶה בוֹ
  choice: அவர்மேல் கை வைக்கப்பட்டால்
  rationale: வன்முறை அல்லது தீங்கு நேர்வதைக் குறிக்கும் எபிரெய மரபுத்தொடரை, செய்பவரைச் சுட்டாமல் இயல்பான தமிழில் பாதுகாக்கிறது.
theological_decisions:
- issue: இரத்தம் தலையின்மேல் இருக்கும் என்ற சட்ட மரபுத்தொடரைத் தக்கவைத்தல்
  choice: ‘அவருடைய இரத்தம் அவருடைய தலையின்மேல் / எங்கள் தலைகளின்மேல் இருக்கும்’ என்று முதன்மை உரையில் பாதுகாக்கப்பட்டது
  alternative: ‘அவருடைய மரணத்துக்கு அவரே பொறுப்பு / நாங்களே பொறுப்பு’ என்று விளக்கமாக மொழிபெயர்த்தல்
  rationale: இது இரத்தச்சிந்தல் அல்லது மரணத்துக்கான பொறுப்பைச் சுமத்தும் சட்ட-நெறி மரபுத்தொடர். நேரடியாகப் பொறுப்பு என்று மாற்றுவது பொருளைத் தெளிவாக்கினாலும், மூலத்தின் உடன்பாட்டு solemnity மற்றும் இணை அமைப்பை இழக்கச் செய்யும்.
- issue: வரையறுக்கப்படாத ஒருமை நபருக்கான பாலினக் குறிப்பு
  choice: ‘யாராக இருந்தாலும் … அவர்/அவருடைய’ என்ற நவீனத் தமிழ்ப் பொதுப்பயன்பாடு
  alternative: ‘எவன் … அவன்/அவனுடைய’ என்ற வெளிப்படையான ஆண்பால் வடிவம்
  rationale: எபிரெயம் இலக்கண ஆண்பால் ஒருமையைப் பயன்படுத்தினாலும், நிபந்தனை வீட்டிலுள்ள எந்த நபருக்கும் பொருந்துகிறது. தமிழில் மரியாதை ஒருமையான ‘அவர்’ பாலினத்தைத் தேவையின்றி வரையறுக்காமல், தனிநபர் சார்ந்த சட்ட நிபந்தனையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன பொதுத்தரத் தமிழ்; எளிதில் புரியும், ஆனால் உடன்பாட்டு நிபந்தனைக்கேற்ற கண்ணியமும் சட்டரீதியான தீவிரமும் கொண்ட நடை. ‘கை வைக்கப்பட்டால்’ என்ற மரபுத்தொடர் செய்பவரை அடையாளப்படுத்தாமல் மூலத்தின் தெளிவின்மையைப் பாதுகாக்கிறது.
