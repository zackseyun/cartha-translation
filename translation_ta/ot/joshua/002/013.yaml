  text: and keep alive my father and my mother[a], and my brothers and my sisters, and all who belong to them[b]; and deliver our lives from death.
translation:
  language: ta
  text: என் தந்தையையும் தாயையும், என் சகோதரர்களையும் சகோதரிகளையும், அவர்களுக்குரிய அனைவரையும்[a] உயிருடன் காப்பாற்றுங்கள்; எங்கள் உயிர்களை மரணத்திலிருந்து மீட்குங்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்களுக்குச் சொந்தமான அனைத்தையும்.” இச்சூழலில் இது அவர்களுடைய குடும்பத்தாரையும் அவர்களைச் சார்ந்தவர்களையும் முதன்மையாகக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַחֲיִתֶם
  choice: உயிரோடு காப்பாற்றி
  rationale: חיה என்பதன் ஹிஃபீல் வடிவம் ‘உயிர்வாழச் செய்தல்’ அல்லது ‘உயிரோடு காத்தல்’ என்று பொருள்படும். உயிருக்கு ஆபத்தான இச்சூழலில் ‘உயிரோடு காப்பாற்றி’ என்பது அதன் காரணவினைப் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: אָבִי ... אִמִּי ... אַחַי ... אחותי
  choice: என் தந்தையையும் தாயையும், என் சகோதரர்களையும் சகோதரிகளையும்
  rationale: மூலத்தில் உறவுமுறைகள் ஒவ்வொன்றாக வலியுறுத்தப்படுவதால் அவை தனித்தனியாக மொழிபெயர்க்கப்பட்டுள்ளன. சகோதர உறவுகளின் பன்மையும் காக்கப்பட்டுள்ளது.
- source_word: כָּל אֲשֶׁר לָהֶם
  choice: அவர்களுக்குரிய அனைவரையும்
  rationale: மீட்கப்பட வேண்டிய குடும்பத்தாரும் அவர்களைச் சார்ந்தவர்களுமே சூழலில் முதன்மையாகக் குறிக்கப்படுவதால் ஆட்களைக் குறிக்கும் வகையில் மொழிபெயர்க்கப்பட்டுள்ளது; சொற்றொடரின் பரந்த மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: וְהִצַּלְתֶּם
  choice: மீட்பீர்கள்
  rationale: נצל என்பதன் ஹிஃபீல் வடிவம் ஆபத்திலிருந்து விடுவித்தல் அல்லது மீட்டல் என்று பொருள்படும். ‘மீட்பீர்கள்’ இங்கு மரண ஆபத்திலிருந்து காப்பதை இயல்பாகக் குறிக்கிறது.
- source_word: נַפְשֹׁתֵינוּ
  choice: எங்கள் உயிர்களை
  rationale: נפש இங்கு உடலிலிருந்து வேறான ‘ஆத்துமா’ என்பதைக் குறிக்காமல், மரண ஆபத்தில் உள்ள நபர்களின் உயிரைக் குறிக்கிறது.
- source_word: מִמָּוֶת
  choice: மரணத்திலிருந்து
  rationale: மூலத்தின் நேரடியான பொருளையும் உயிருக்கு நேர்ந்துள்ள ஆபத்தின் தீவிரத்தையும் காக்கிறது.
