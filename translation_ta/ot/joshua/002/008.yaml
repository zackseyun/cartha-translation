translation_notes:
  register: நவீனத் தரத் தமிழில், எளிமையும் கண்ணியமும் கொண்ட கதைநடை. மூலத்தின் சொற்பொருளை முதன்மை உரையில் காத்து, சூழலால் சாத்தியமான ‘உறங்கச் செல்வது’ என்ற பொருளை அடிக்குறிப்பில் வழங்குகிறது.
