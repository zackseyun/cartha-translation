  yaml_path: translation/ot/joshua/002/008.yaml
  text: Before they lay down[a], she went up to them on the roof.
translation:
  language: ta
  text: அவர்கள் படுத்துக்கொள்வதற்கு முன்[a], அவள் கூரையின்மேல் அவர்களிடம் ஏறிச் சென்றாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்கள் உறங்கச் செல்வதற்கு முன்.” எபிரெய வினைச்சொல்லின் நேர்ப்பொருள் “படுத்துக்கொள்ளுதல்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: טֶרֶם
  choice: முன்
  rationale: அடுத்த செயல் நிகழ்வதற்கு முன்னான நேரத்தைக் குறிக்கும் இயல்பான தமிழ்ச் சொல்.
- source_word: יִשְׁכָּבוּן
  choice: அவர்கள் படுப்பதற்கு
  rationale: שׁכב என்பதன் அடிப்படைப் பொருள் ‘படுத்தல்/படுத்துக்கொள்ளுதல்.’ சூழலில் உறங்கச் செல்வதைக் குறிக்கலாம்; ஆனால் மூலத்தில் ‘உறங்குதல்’ வெளிப்படையாக இல்லை என்பதால் உடல்செயலைப் பாதுகாக்கிறது.
- source_word: עָלְתָה
  choice: அவள் ... ஏறிச் சென்றாள்
  rationale: עלה என்ற வினையின் மேல்நோக்கிய இயக்கத்தை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: עֲלֵיהֶם
  choice: அவர்களிடம்
  rationale: இயக்க வினையுடன் நபர்களை நோக்கிய அணுகுதலை இங்கு குறிக்கிறது; ‘அவர்கள்மேல்’ என்பது தமிழில் தவறான பொருளுணர்வை ஏற்படுத்தலாம்.
- source_word: עַל הַגָּג
  choice: கூரையின்மேல்
  rationale: வீட்டின் தட்டையான கூரையில் அவர்கள் இருந்த இடத்தையும் அவள் சென்ற இடத்தையும் தெளிவாகக் குறிக்கிறது.
- source_word: וְהֵמָּה ... וְהִיא
  choice: அவர்கள் ... அவள்
  rationale: எபிரெய உரையில் வெளிப்படையாக உள்ள நபர் மாறுபாட்டைத் தமிழிலும் காக்கிறது.
