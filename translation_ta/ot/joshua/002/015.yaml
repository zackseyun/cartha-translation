  source_fidelity: மூல எபிரெயத்தின் வினைத் தொடர், கருவிப் பொருள், ஜன்னல் வழி இறக்குதல், மற்றும் மதில்-கட்டமைப்புடன் தொடர்புடைய குடியிருப்பு ஆகியவை துல்லியமாகக் காக்கப்பட்டுள்ளன. ‘மதிலுக்குள்’ என்பது בְקִיר הַחוֹמָה மற்றும் בַחוֹמָה ஆகியவற்றின் முதன்மையான ‘மதிலின் கட்டமைப்பில்/உள்ளே’ என்ற பொருளை இயல்பாகத் தருகிறது; ‘நகர’ என்பது சூழலில் நியாயமான தெளிவாக்கம் மட்டுமே.
