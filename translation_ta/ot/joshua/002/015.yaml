source:
  edition: WLC
  text: וַ/תּוֹרִדֵ֥/ם בַּ/חֶ֖בֶל בְּעַ֣ד הַֽ/חַלּ֑וֹן כִּ֤י בֵיתָ/הּ֙ בְּ/קִ֣יר הַֽ/חוֹמָ֔ה וּ/בַֽ/חוֹמָ֖ה הִ֥יא יוֹשָֽׁבֶת׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/002/015.yaml
  text: Then she let them down by a rope through the window[a], because her house was in the wall of the city, and she was living in the wall.
translation:
  language: ta
  text: பின்பு அவள் அவர்களைக் கயிற்றால் ஜன்னல் வழியாகக் கீழே இறக்கிவிட்டாள். ஏனெனில், அவளுடைய வீடு நகர மதிலுக்குள் அமைந்திருந்தது; அவள் அந்த மதிலுக்குள்ளேயே குடியிருந்தாள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவளுடைய வீடு நகர மதிலின்மேல் அமைந்திருந்தது; அவள் அந்த மதிலின்மேல் குடியிருந்தாள்.” எபிரெயச் சொற்றொடர் அவளுடைய குடியிருப்பு மதிலுக்குள் அல்லது மதிலின் மேல் அமைந்திருந்ததாகப் புரிந்துகொள்ள இடமளிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתּוֹרִדֵם
  choice: பின்பு அவள் அவர்களைக் கீழே இறக்கிவிட்டாள்
  rationale: ירד என்பதன் ஹிஃபில் வடிவம் ‘கீழே செல்லச் செய்தல், இறக்குதல்’ எனும் காரணவினைப் பொருளைக் கொண்டது. தொடர்கதை வாவை ‘பின்பு’ வெளிப்படுத்துகிறது.
- source_word: בַּחֶבֶל
  choice: கயிற்றால்
  rationale: חֶבֶל என்பது இங்கு ‘கயிறு’; בְּ கருவிப் பொருளைச் சுட்டுவதால் தமிழில் ‘கயிற்றால்’ இயல்பாக உள்ளது.
- source_word: בְּעַד הַחַלּוֹן
  choice: ஜன்னல் வழியாக
  rationale: בְּעַד என்பது ஓர் திறப்பின் வழியாகச் செல்வதைக் குறிக்கிறது; הַחַלּוֹן என்பது ‘ஜன்னல்’.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: ஜன்னல் வழியாக அவர்களை இறக்க முடிந்ததற்கான காரணத்தை இங்கு כִּי அறிமுகப்படுத்துகிறது.
- source_word: בֵיתָהּ בְּקִיר הַחוֹמָה
  choice: அவளுடைய வீடு நகர மதிலுக்குள் அமைந்திருந்தது
  rationale: இந்தச் சொற்றொடர் அவளுடைய வீடு மதிலின் கட்டமைப்பில் அமைந்திருந்ததைக் குறிக்கிறது. ‘அமைந்திருந்தது’ என்பது கட்டப்பட்டது என்று எபிரெயம் நேரடியாகச் சொல்லாததால் அதனைச் சேர்க்காமல் இடஅமைவை இயல்பாகத் தெரிவிக்கிறது; ‘நகர’ என்பது חוֹמָה குறிக்கும் பாதுகாப்பு மதிலின் சூழலைத் தெளிவாக்குகிறது.
- source_word: וּבַחוֹמָה הִיא יוֹשָׁבֶת
  choice: அவள் அந்த மதிலுக்குள்ளேயே குடியிருந்தாள்
  rationale: יָשַׁב இங்கு ‘குடியிருத்தல்’ என்று பொருள்படும்; பங்கேற்புவினை தொடர்ந்த குடியிருப்பைக் குறிக்கிறது. ‘-ஏ’ எபிரெயக் கிளையின் மறுபடியும் வலியுறுத்தும் தன்மையை இயல்பான தமிழில் காட்டுகிறது.
