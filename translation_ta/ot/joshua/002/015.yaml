translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘மதிலுக்குள்’ என்பதைக் கொண்டு கட்டமைப்புக்குள் இருந்த குடியிருப்பை முதன்மைப் பொருளாகக் காட்டி, ‘மதிலின்மேல்’ என்ற உண்மையான இடவியல் மாற்றுப் பொருளை அடிக்குறிப்பில் பாதுகாத்துள்ளது.
