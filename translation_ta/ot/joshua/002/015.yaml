  terminology: ‘கயிறு,’ ‘ஜன்னல்,’ ‘நகர மதில்,’ ‘குடியிருந்தாள்’ ஆகியவை பொருத்தமான, கண்ணியமான பொதுத் தமிழ் சொற்கள். ‘மதிலுக்குள்/மதிலின்மேல்’ என்ற இடவியல் மாற்று வாசிப்பை அடிக்குறிப்பு உரிய முறையில் காக்கிறது.
