translation_notes:
  register: நவீனத் தரத் தமிழில், மரியாதைமிக்க ஆனால் எளிதில் புரியும் நடையில் மொழிபெயர்க்கப்பட்டது. ராகாபை நோக்கிய பெண்பால் ஒருமை எபிரெய வடிவங்கள் தமிழில் சூழலால் வெளிப்படுகின்றன. உடன்பாட்டு அறிவுறுத்தலின் வலிமைக்காக ‘வேண்டும்’ பயன்படுத்தப்பட்டுள்ளது.
