base_translation:
  language: en
  yaml_path: translation/ot/joshua/002/018.yaml
  text: Look[a], when we come into the land, you shall tie this scarlet cord in the window through which you let us down, and you shall gather into your house your father, your mother, your brothers, and all your father's household.
translation:
  language: ta
  text: இதோ, நாங்கள் நாட்டிற்குள் வரும்போது, நீ எங்களை இறக்கிவிட்ட அந்தச் சாளரத்தில் இந்தச் சிவப்புநூலால் ஆன கயிற்றைக்[a] கட்ட வேண்டும். மேலும், உன் தந்தையையும் உன் தாயையும் உன் சகோதரர்களையும் உன் தந்தையின் வீட்டார் அனைவரையும் உன் வீட்டிற்குள் கூட்டி வர வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: மாற்றாக, இன்னும் நேரடியாக, “இந்தச் சிவப்புநூல் சரடை.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: இதோ
  rationale: கவனத்தை ஈர்க்கும் எபிரெயச் சொல்லின் சுட்டிக்காட்டும் வலிமையை, இயல்பான நவீனத் தமிழில் காக்கிறது.
- source_word: בָאִים בָּאָרֶץ
  choice: நாங்கள் இந்த நாட்டிற்குள் வரும்போது
  rationale: பங்கேற்பு வினைவடிவம் இச்சூழலில் எதிர்கால நுழைவைச் சுட்டுகிறது; ‘வரும்போது’ நிபந்தனை சார்ந்த கால உறவை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: תִּקְוַת חוּט הַשָּׁנִי הַזֶּה
  choice: இந்தச் சிவப்புநூல் கயிறு
  rationale: תִּקְוָה என்பது இங்கு கயிறு அல்லது நூற்கயிற்றைக் குறிக்கிறது; חוּט הַשָּׁנִי அதன் சிவப்புநூல் தன்மையை விளக்குகிறது. ‘சிவப்புநூல் கயிறு’ அடையாளமாகக் கட்டப்படும் பொருளைத் தெளிவாகக் காட்டுகிறது; சொற்றொடரின் நேரடியான அமைப்பு அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: תִּקְשְׁרִי
  choice: நீ ... கட்ட வேண்டும்
  rationale: இரண்டாம் நபர் பெண்பால் ஒருமை வினைவடிவம் உடன்பாட்டு அறிவுறுத்தலாக உள்ளது; ‘வேண்டும்’ அதன் கட்டாயத் தன்மையை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: בַּחַלּוֹן אֲשֶׁר הוֹרַדְתֵּנוּ בוֹ
  choice: நீ எங்களை இறக்கிவிட்ட அந்தச் சாளரத்தில்
  rationale: ஹிபில் வடிவின் ‘கீழே இறங்கச் செய்தல்’ என்ற பொருளை ‘இறக்கிவிட்ட’ என்பதும், தொடர்புச் சொல்லை தமிழுக்குரிய பெயரெச்ச அமைப்பும் இயல்பாக வழங்குகின்றன.
- source_word: תַּאַסְפִי אֵלַיִךְ הַבָּיְתָה
  choice: உன்னோடு வீட்டிற்குள் கூட்டிச் சேர்க்க வேண்டும்
  rationale: אָסַף என்பது ஒன்றுகூட்டுதலையும், אֵלַיִךְ என்பது அவளிடம்/அவளோடு சேர்வதையும், הַבָּיְתָה என்பது வீட்டை நோக்கிய இயக்கத்தையும் குறிக்கிறது; இத்தமிழாக்கம் மூன்றையும் காக்கிறது.
- source_word: אָבִיךְ ... אִמֵּךְ ... אַחַיִךְ
  choice: உன் தந்தை ... உன் தாய் ... உன் சகோதரர்கள்
  rationale: உறவுப் பெயர்களையும் ஆண்பால் பன்மையான ‘சகோதரர்கள்’ என்ற மூலவடிவத்தையும் துல்லியமாகப் பேணுகிறது.
- source_word: כָּל בֵּית אָבִיךְ
  choice: உன் தந்தையின் வீட்டார் அனைவரும்
  rationale: ‘வீடு’ என்ற கட்டடத்தைவிட குடும்ப அலகின் உறுப்பினர்களைக் குறிக்கும் பொருளை ‘வீட்டார்’ தெளிவாக வழங்குகிறது.
