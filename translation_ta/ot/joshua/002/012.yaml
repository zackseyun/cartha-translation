source:
  edition: WLC
  text: וְ/עַתָּ֗ה הִשָּֽׁבְעוּ נָ֥א לִ/י֙ בַּֽ/יהוָ֔ה כִּי עָשִׂ֥יתִי עִמָּ/כֶ֖ם חָ֑סֶד וַ/עֲשִׂיתֶ֨ם גַּם אַתֶּ֜ם עִם בֵּ֤ית אָבִ/י֙ חֶ֔סֶד וּ/נְתַתֶּ֥ם לִ֖/י א֥וֹת אֱמֶֽת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/002/012.yaml
  text: And now[a], please swear to me by Yahweh that, just as I have shown kindness to you, you also will show kindness to my father's house and give me a sure sign,
translation:
  language: ta
  text: “இப்போது, தயவுசெய்து, நான் உங்களுக்குத் தயவு காட்டியதுபோல, நீங்களும் என் தந்தையின் குடும்பத்துக்குத் தயவு காட்டுவீர்கள் என்றும், எனக்கு நம்பத்தகுந்த ஓர் அடையாளத்தைக்[a] கொடுப்பீர்கள் என்றும் யாவே பேரில் எனக்குச் சத்தியம் செய்யுங்கள்.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'வேறு விதமாக: “உறுதியான அடையாளம்,” “உண்மையான அடையாளம்,” அல்லது “நம்பகமான உத்தரவாதம்.”'
    reason: אוֹת אֱמֶת என்பது உண்மையான அல்லது நம்பத்தகுந்த அடையாளத்தையும் உறுதியளிக்கும் உத்தரவாதத்தையும் குறிக்கக்கூடும் என்பதால் இந்தச் சொற்பொருள் மாற்றுகள் தரப்படுகின்றன.
lexical_decisions:
- source_word: וְעַתָּה
  choice: இப்போது
  rationale: உரையாடலில் அடுத்த அவசரமான வேண்டுகோளுக்குச் செல்லும் இயல்பான மாற்றத்தைத் தருகிறது; தமிழ் நடையில் இணைப்புப் பொருள் சூழலால் வெளிப்படுகிறது.
- source_word: הִשָּׁבְעוּ נָא לִי
  choice: எனக்குச் சத்தியம் செய்யுங்கள்
  rationale: பன்மை கட்டளையையும் נָא தரும் பணிவான வேண்டுகோள் நயத்தையும் மரியாதைப் பன்மை வடிவம் இயல்பாகத் தாங்குகிறது.
- source_word: בַּיהוָה
  choice: யாவே மீது ஆணையிட்டு
  rationale: ஆணையின் சாட்சியாக யாவேயை அழைக்கும் பொருளைப் பாதுகாக்கிறது; יהוה என்ற தனிப்பெயர் ‘யாவே’ என ஒலிபெயர்க்கப்படுகிறது.
- source_word: עָשִׂיתִי עִמָּכֶם חָסֶד
  choice: நான் உங்களுக்குத் தயவு காட்டியதுபோல
  rationale: חֶסֶד இங்கு ராகாப் ஒற்றர்களிடம் காட்டிய உண்மையுள்ள நன்மையைக் குறிக்கிறது. ‘தயவு காட்டுதல்’ இயல்பான தமிழில் அதன் உறவுசார் நன்மையைத் தெரிவிக்கிறது; உடன்படிக்கை சார்ந்த தொழில்நுட்பப் பொருளைத் தேவையின்றி திணிப்பதில்லை.
- source_word: וַעֲשִׂיתֶם גַּם אַתֶּם
  choice: நீங்களும் ... தயவு காட்டுவீர்கள் என்றும்
  rationale: கட்டளையைத் தொடர்ந்து வரும் வேண்டப்பட்ட எதிர்காலச் செயலை ஆணையின் உள்ளடக்கமாக இயல்பாக வெளிப்படுத்துகிறது.
- source_word: בֵּית אָבִי
  choice: என் தந்தையின் குடும்பம்
  rationale: எபிரேய ‘தந்தையின் வீடு’ என்ற மரபுத்தொடரின் குடும்பம் அல்லது குடும்பத்தார் என்ற பொருளை நவீனத் தமிழில் தெளிவாகத் தருகிறது.
- source_word: אוֹת אֱמֶת
  choice: நம்பத்தகுந்த ஓர் அடையாளம்
  rationale: אוֹת என்பதன் ‘அடையாளம்’ என்ற அடிப்படைப் பொருளையும் אֱמֶת தரும் நம்பகத்தன்மை அல்லது உறுதிப்பாட்டையும் காக்கிறது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலத்தில் வரும் உடன்படிக்கைப் பெயரை ஒரு பட்டமாக மாற்றாமல், ஏற்றுக்கொள்ளப்பட்ட நவீன ஒலிப்புக்கு அருகில் ‘யாவே’ என வழங்குகிறது.
- issue: חֶסֶד என்பதன் உறவுசார் நயம்
  choice: தயவு
  alternative: மாறாத அன்பு; உடன்படிக்கை விசுவாசம்
  rationale: இச்சூழலில் ராகாபுக்கும் ஒற்றர்களுக்கும் இடையிலான பரஸ்பர நன்மையே முன்னிலையில் உள்ளது. ‘தயவு’ அந்தப் பொருளைத் தெளிவாகத் தருகிறது; பின்னாளைய உடன்படிக்கைத் தத்துவத்தை வசனத்துக்குள் சேர்ப்பதைத் தவிர்க்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையும் அவசர வேண்டுகோளின் நயமும் கொண்ட நேரடியான உரையாடல் நடை பயன்படுத்தப்பட்டுள்ளது. חֶסֶד இருமுறையும் ‘தயவு’ என ஒரேவிதமாக மொழிபெயர்க்கப்பட்டு மூலத்தின் மறுபடிப்பு பாதுகாக்கப்பட்டுள்ளது.
