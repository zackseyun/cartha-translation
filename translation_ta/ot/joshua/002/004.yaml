revisions:
- from: ஆனால் அந்தப் பெண் அந்த இரண்டு ஆண்களையும் அழைத்துச் சென்று மறைத்து வைத்திருந்தாள்.[a] அவள், “ஆம், அந்த ஆண்கள் என்னிடம் வந்தார்கள்; ஆனால் அவர்கள் எங்கிருந்து வந்தவர்கள் என்று எனக்குத் தெரியாது” என்றாள்.
  to: ஆனால் அந்தப் பெண் அந்த இரண்டு ஆண்களையும் அழைத்துக்கொண்டு, அவர்களை மறைத்து வைத்திருந்தாள்.[a] அவள், “ஆம், அந்த ஆண்கள் என்னிடம் வந்தார்கள்; ஆனால் அவர்கள் எங்கிருந்து வந்தார்கள் என்பது எனக்குத் தெரியவில்லை” என்றாள்.
  rationale: The revision removes the unstated directional nuance in “அழைத்துச் சென்று,” restores the past-time force of Rahab’s denial, and makes the textual footnote technically precise. It retains the contextual plural rendering of the Hebrew verb’s singular suffix and preserves the discourse-level contrast represented by “ஆனால்.”
  reviewer_model: gpt-5.6-terra
