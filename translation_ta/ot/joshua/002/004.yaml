source:
  edition: WLC
  text: וַ/תִּקַּ֧ח הָֽ/אִשָּׁ֛ה אֶת שְׁנֵ֥י הָ/אֲנָשִׁ֖ים וַֽ/תִּצְפְּנ֑/וֹ וַ/תֹּ֣אמֶר כֵּ֗ן בָּ֤אוּ אֵלַ/י֙ הָֽ/אֲנָשִׁ֔ים וְ/לֹ֥א יָדַ֖עְתִּי מֵ/אַ֥יִן הֵֽמָּה־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/002/004.yaml
  text: But the woman had taken the two men and hidden them[a], and she said, “Yes, the men came to me, but I did not know where they were from.”
translation:
  language: ta
  text: ஆனால் அந்தப் பெண் அந்த இரண்டு ஆண்களையும் அழைத்துக்கொண்டு, அவர்களை மறைத்து வைத்திருந்தாள்.[a] அவள், “ஆம், அந்த ஆண்கள் என்னிடம் வந்தார்கள்; ஆனால் அவர்கள் எங்கிருந்து வந்தார்கள் என்பது எனக்குத் தெரியவில்லை” என்றாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரேய வினைச்சொல்லில் ஒருமை பின்னொட்டு உள்ளது (“அவனை மறைத்தாள்”); ஆனால் சூழல் அந்த இரண்டு ஆண்களையும் கூட்டாகக் குறிக்கிறது. எனவே இங்கு பன்மையாக மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: textual_variant
lexical_decisions:
- source_word: וַתִּקַּח
  choice: அழைத்துச் சென்று
  rationale: இங்கு לקח என்பது அந்த ஆண்களைத் தன் பொறுப்பில் எடுத்துக்கொண்டு மறைவிடத்துக்கு அழைத்துச் சென்ற செயலைக் குறிக்கிறது. தமிழில் வெறும் ‘எடுத்தாள்’ என்பதைவிட ‘அழைத்துச் சென்று’ சூழலுக்கு இயல்பானது; தொடரின் முன்நிகழ்வை ‘மறைத்து வைத்திருந்தாள்’ வெளிப்படுத்துகிறது.
- source_word: הָאִשָּׁה
  choice: அந்தப் பெண்
  rationale: சூழலில் இது ராகாபை ஒரு பெண்ணாகச் சுட்டுகிறது; ‘மனைவி’ என்ற பொருள் இங்கு இல்லை.
- source_word: שְׁנֵי הָאֲנָשִׁים
  choice: அந்த இரண்டு ஆண்களையும்
  rationale: אֲנָשִׁים இங்கு இஸ்ரவேலிய உளவாளிகளான இரண்டு ஆண்களைக் குறிக்கிறது. குறிப்பிட்ட நபர்களைத் தொடர்ச்சியாகச் சுட்டுவதால் ‘அந்த’ சேர்க்கப்பட்டது.
- source_word: וַתִּצְפְּנוֹ
  choice: மறைத்து வைத்திருந்தாள்
  rationale: வினை மறைத்தல் அல்லது ஒளித்து வைத்தல் என்ற பொருளுடையது. எபிரெய வடிவில் ஒருமை பின்னொட்டு இருந்தாலும், சூழலில் பொருள் இரண்டு ஆண்கள்; தமிழ் மொழிபெயர்ப்பு பன்மையைத் தெளிவாகக் காட்டுகிறது. ‘வைத்திருந்தாள்’ என்பது தூதர்களிடம் பேசுவதற்கு முன்பே நிகழ்ந்த செயலை இயல்பாகப் பின்னணிப்படுத்துகிறது.
- source_word: כֵּן
  choice: ஆம்
  rationale: முன்வைக்கப்பட்ட விசாரணையை உறுதிப்படுத்தும் நேரடியான பதில்; நவீன தமிழில் ‘ஆம்’ இயல்பாகவும் கண்ணியமாகவும் உள்ளது.
- source_word: בָּאוּ אֵלַי הָאֲנָשִׁים
  choice: அந்த ஆண்கள் என்னிடம் வந்தார்கள்
  rationale: சொற்றொடரின் நேரடியான கருத்தையும் உரையாடலின் இயல்பான தமிழ் சொல் வரிசையையும் காக்கிறது.
- source_word: וְלֹא יָדַעְתִּי
  choice: ஆனால் ... எனக்குத் தெரியாது
  rationale: וְ முறையாக ‘மற்றும்’ என்றாலும், இங்கு வருகையை ஒப்புக்கொண்ட பின் அறிவை மறுக்கும் முரண்பாட்டை இணைக்கிறது; தமிழில் ‘ஆனால்’ அந்த உறவைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: מֵאַיִן הֵמָּה
  choice: அவர்கள் எங்கிருந்து வந்தவர்கள் என்று
  rationale: מֵאַיִן தோற்றம் அல்லது வந்த இடத்தை விசாரிக்கிறது. ‘எங்கிருந்து வந்தவர்கள்’ என்பது இயல்பான நவீனத் தமிழ்; வெறும் தற்போதைய இருப்பிடத்தை அல்ல, அவர்களின் பிறப்பிடம் அல்லது புறப்பட்ட இடத்தைச் சுட்டும் மூலத்தின் விரிவையும் தக்கவைக்கிறது.
