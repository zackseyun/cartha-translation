base_translation:
  language: en
  yaml_path: translation/ot/joshua/002/022.yaml
  text: So they went and came to the hill country[a], and stayed there three days, until the pursuers returned. The pursuers searched all along the road, but did not find them.
translation:
  language: ta
  text: அவர்கள் புறப்பட்டு மலைப்பகுதிக்குச்[a] சென்று, துரத்திவந்தவர்கள் திரும்பும்வரை மூன்று நாட்கள் அங்கே தங்கினார்கள். துரத்திவந்தவர்கள் வழியெங்கும் தேடியும் அவர்களைக் கண்டுபிடிக்கவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “மலைக்கு” அல்லது “மலைகளுக்குள்” என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் இங்கே ஒரு தனி மலைச்சிகரத்தைவிட எரிகோவுக்கு மேற்கிலுள்ள மலைப்பகுதியைக் குறிக்க வாய்ப்புள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלְכוּ וַיָּבֹאוּ
  choice: புறப்பட்டு… சென்று
  rationale: எபிரெய மொழியின் தொடர்ச்சியான இயக்கத்தை இயல்பான நவீனத் தமிழில் தருகிறது; இரண்டு வினைகளையும் காரணமின்றிச் சுருக்கவில்லை.
- source_word: הָהָרָה
  choice: மலைப்பகுதிக்கு
  rationale: திசையைக் குறிக்கும் வடிவம் மலைசார்ந்த நிலப்பகுதியை நோக்கிய இயக்கத்தைக் காட்டுகிறது; சூழலில் இது ஒரு தனி மலைச்சிகரத்தைக் காட்டிலும் எரிகோவுக்கு மேற்கிலுள்ள மலைப்பகுதியைக் குறிக்க வாய்ப்புள்ளது.
- source_word: וַיֵּשְׁבוּ שָׁם
  choice: அங்கே தங்கினார்கள்
  rationale: ישב இங்கு நிரந்தரக் குடியிருப்பை அல்ல, தற்காலிகமாகத் தங்கியிருப்பதைக் குறிக்கிறது.
- source_word: עַד שָׁבוּ הָרֹדְפִים
  choice: துரத்திவந்தவர்கள் திரும்பும்வரை
  rationale: רֹדְפִים பெயர்ச்சொல் மதிப்புடைய பங்கேற்பு வினையாகத் துரத்துவோரைக் குறிக்கிறது; שׁוב என்பதன் ‘திரும்புதல்’ பொருள் பாதுகாக்கப்பட்டுள்ளது.
- source_word: וַיְבַקְשׁוּ הָרֹדְפִים בְּכָל הַדֶּרֶךְ
  choice: துரத்திவந்தவர்கள் வழியெங்கும் தேடியும்
  rationale: தேடலின் பரப்பை בְּכָל הַדֶּרֶךְ குறிக்கிறது; ‘வழியெங்கும்’ என்பது தமிழில் இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: וְלֹא מָצָאוּ
  choice: அவர்களைக் கண்டுபிடிக்கவில்லை
  rationale: எபிரெயத்தில் வெளிப்படையாக இல்லாத செயப்படுபொருள் சூழலிலிருந்து தெளிவாகிறது; இயல்பான தமிழுக்காக ‘அவர்களை’ சேர்க்கப்பட்டுள்ளது.
