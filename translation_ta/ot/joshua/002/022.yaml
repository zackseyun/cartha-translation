  source_fidelity: எபிரெய மூலத்தின் தொடர்ச்சியான இயக்கம் (‘சென்று வந்தார்கள்’), மலைப்பகுதியை நோக்கிய திசை, தற்காலிகத் தங்குதல், மூன்று நாட்கள், துரத்திவந்தோர் திரும்புதல், வழியெங்கும் தேடுதல், கண்டுபிடிக்காதிருத்தல் ஆகிய அனைத்தும் துல்லியமாகப் பிரதிபலிக்கப்படுகின்றன. ‘அவர்களை’ என்பது சூழலால் தெளிவாகும் மறைமுகச் செயப்படுபொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
  naturalness: நடை நவீன நிலையான தமிழில் தெளிவாகவும் கதைநடைக்கேற்ற வகையிலும் உள்ளது. ‘புறப்பட்டு … சென்று’ என்ற இணைப்பு எபிரெயத் தொடர்வினை அமைப்பை தேவையற்ற சொல்லுக்குச்சொல் தன்மையின்றிப் பாதுகாக்கிறது. ‘தேடியும் அவர்களைக் கண்டுபிடிக்கவில்லை’ இயல்பான எதிர்மறை முடிவைத் தருகிறது.
  terminology: ‘மலைப்பகுதி’ சூழலுக்கும் எபிரெய הָהָרָה-வின் சாத்தியமான பிராந்தியப் பொருளுக்கும் ஏற்றது. மாற்றுச் சாத்தியங்களான தனி மலை மற்றும் மலைகளுக்குள் என்பவை அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளன. ‘துரத்திவந்தவர்கள்’ சூழலுக்கேற்ற, நடுநிலையான சொற்தேர்வாகும்.
