source:
  edition: WLC
  text: וְ/אִם תַּגִּ֖ידִי אֶת דְּבָרֵ֣/נוּ זֶ֑ה וְ/הָיִ֣ינוּ נְקִיִּ֔ם מִ/שְּׁבֻעָתֵ֖/ךְ אֲשֶׁ֥ר הִשְׁבַּעְתָּֽ/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/002/020.yaml
  text: But if you tell this matter of ours[b][a], then we will be free from your oath that you made us swear.
translation:
  language: ta
  text: ஆனால், எங்களுடைய இந்தக் காரியத்தை நீ வெளிப்படுத்தினால்,[a] நீ எங்களைச் சத்தியம் செய்யவைத்த சத்தியத்திலிருந்து நாங்கள் விடுபட்டவர்களாவோம்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எங்களுடைய இந்த விவகாரத்தை.” எபிரெயச் சொல் பொதுவாக ஒரு சொல், காரியம், அல்லது விவகாரத்தைக் குறிக்கலாம்; இச்சூழலில் அது ஒற்றர்களின் இரகசியமான பணியைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “நீ எங்களைச் சத்தியம் செய்யவைத்த சத்தியத்தைப் பொறுத்தவரை நாங்கள் குற்றமற்றவர்களாவோம்.” ராகாப் அவர்களுடைய காரியத்தை வெளிப்படுத்தினால், அந்தச் சத்தியம் இனி அவர்களைக் கட்டுப்படுத்தாது என்பதே எபிரெய மரபுத்தொடரின் பொருள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: ஆனால் ... என்றால்
  rationale: இணைப்புச்சொல்லும் நிபந்தனைத் துகளும் முந்தைய வாக்குறுதிக்கு விதிவிலக்கான, முரண்பாட்டுத் தன்மையுள்ள நிபந்தனையை அறிமுகப்படுத்துகின்றன.
- source_word: תַּגִּידִי
  choice: நீ வெளிப்படுத்தினால்
  rationale: נגד என்பதன் ஹிப்இல் வடிவம் ‘தெரிவி, அறிவி, வெளிப்படுத்து’ எனப் பொருள்படும்; இங்கு ஒற்றர்களின் இரகசியத்தை வெளியிடுவதைக் குறிப்பதால் ‘வெளிப்படுத்தினால்’ இயல்பாகவும் சூழலுக்குப் பொருத்தமாகவும் உள்ளது.
- source_word: אֶת דְּבָרֵנוּ זֶה
  choice: நாங்கள் சொன்ன இந்த இரகசியத்தை
  rationale: דבר என்பது ‘சொல், காரியம், விவகாரம்’ எனப் பலவாறு பொருள்படலாம். இங்கு ஒற்றர்கள் பகிர்ந்த இரகசிய ஏற்பாட்டைச் சுட்டுவதால், தமிழில் தெளிவாக ‘நாங்கள் சொன்ன இந்த இரகசியம்’ என வழங்கப்பட்டுள்ளது; அடிப்படையான சொற்பொருள் மாற்று அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: וְהָיִינוּ נְקִיִּם
  choice: நாங்கள் விடுபட்டவர்களாவோம்
  rationale: היה + נקי என்ற மரபுத்தொடர் ஒரு கடமை அல்லது பொறுப்பிலிருந்து கட்டுப்படாதிருத்தலைக் குறிக்கிறது; ‘விடுபட்டவர்களாவோம்’ அந்தச் சட்டப்பூர்வ/ஒழுக்கப் பொறுப்பு நீங்குவதை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: מִשְּׁבֻעָתֵךְ
  choice: நீ எங்களிடம் வாங்கிய சத்தியத்திலிருந்து
  rationale: இரண்டாம் நபர் பெண்பால் ஒருமை பின்னொட்டு ராகாபுடன் தொடர்புடைய சத்தியத்தைக் குறிக்கிறது. அடுத்த காரணவினை வடிவத்துடன் இணைத்து, தமிழில் ‘நீ எங்களிடம் வாங்கிய சத்தியம்’ என்பது அவள் அவர்களைச் சத்தியம் செய்ய வைத்ததைத் தெளிவாகக் காட்டுகிறது.
- source_word: אֲשֶׁר הִשְׁבַּעְתָּנוּ
  choice: நீ எங்களிடம் வாங்கிய
  rationale: 'שׁבע என்பதன் ஹிப்இல் வடிவம் காரணவினை: அவள் அவர்களைச் சத்தியம் செய்ய வைத்தாள். ‘எங்களிடம் சத்தியம் வாங்கிய’ என்பது இதற்கான இயல்பான நவீனத் தமிழ் வழக்கு.'
theological_decisions:
- issue: சத்தியத்திலிருந்து விடுதலை என்பதன் பொருள்
  choice: அவர்கள் சத்தியத்தின் கட்டுப்பாட்டிலிருந்து விடுபடுவார்கள் என மொழிபெயர்க்கப்பட்டது.
  alternative: அவர்கள் சத்தியத்தைப் பொறுத்தவரை குற்றமற்றவர்கள் ஆவார்கள்.
  rationale: נְקִיִּם என்பதில் ‘குற்றமற்றவர்’ என்ற நிழற்பொருள் இருந்தாலும், இச்சூழலில் ராகாப் இரகசியத்தை வெளியிட்டால் அவர்களின் சத்தியக் கடமை நீங்கும் என்பதே மரபுத்தொடரின் செயல்பாடு. மாற்றுப் பொருள் அடிக்குறிப்பில் வைக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், நேரடியான எச்சரிக்கையின் கண்ணியமான உரைநடை பேணப்பட்டுள்ளது. ‘சத்தியம் வாங்குதல்’ என்பது காரணவினையை இயல்பாகத் தெரிவிக்கும் பொதுவான தமிழ் வழக்கு. மூலத்தின் ‘காரியம்/விவகாரம்’ என்ற பரந்த சொல்லுக்குப் பதிலாக சூழலால் தெளிவாகும் ‘இரகசியம்’ முதன்மை உரையில் பயன்படுத்தப்பட்டு, மூலத்தின் சொற்பரப்பு அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
