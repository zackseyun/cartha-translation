  to: ஆனால், எங்களுடைய இந்தக் காரியத்தை நீ வெளிப்படுத்தினால்,[a] நீ எங்களைச் சத்தியம் செய்யவைத்த சத்தியத்திலிருந்து நாங்கள் விடுபட்டவர்களாவோம்.[b]
