  text: וַ/יִּשְׁלַ֣ח יְהוֹשֻׁ֣עַ בִּן נ֠וּן מִֽן הַ/שִּׁטִּ֞ים שְׁנַֽיִם אֲנָשִׁ֤ים מְרַגְּלִים֙ חֶ֣רֶשׁ לֵ/אמֹ֔ר לְכ֛וּ רְא֥וּ אֶת הָ/אָ֖רֶץ וְ/אֶת יְרִיח֑וֹ וַ/יֵּ֨לְכ֜וּ וַ֠/יָּבֹאוּ בֵּית אִשָּׁ֥ה זוֹנָ֛ה וּ/שְׁמָ֥/הּ רָחָ֖ב וַ/יִּשְׁכְּבוּ שָֽׁמָּ/ה־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/002/001.yaml
  text: Then Joshua son of Nun sent two men secretly from Shittim as spies[a], saying, “Go, see the land and Jericho.” So they went and came to the house of a prostitute whose name was Rahab[c][b], and they lay down there.
translation:
  language: ta
  text: நூனின் மகன் யோசுவா சித்தீமிலிருந்து இரண்டு ஆண்களை இரகசியமாக ஒற்றர்களாக அனுப்பி, “நீங்கள் போய், அந்த நாட்டையும் எரிகோவையும்[a] பாருங்கள்” என்றார். அவர்கள் போய், ராகாப் என்னும் விபச்சாரப் பெண்ணின்[b] வீட்டிற்கு வந்து, அங்கே படுத்தார்கள்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அந்த நாட்டை, குறிப்பாக எரிகோவை” என்றும் பொருள் கொள்ளலாம். எபிரெய உரை நாட்டைப் பொதுவாகவும் எரிகோவைத் தனிப்பட்ட முறையிலும் குறிப்பிடுவதாகப் புரிந்துகொள்ள இடமளிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது “விடுதிக்காரியான பெண்ணின்.” சூழல் அல்லது பிற்கால மரபின் அடிப்படையில் சிலர் இவ்வாறு பொருள் கூறியுள்ளனர்; ஆனால் எபிரெயச் சொல் பொதுவாக “விபச்சாரப் பெண்” என்றே பொருள்படும்.
    reason: alternative_reading
  - marker: c
    text: அல்லது “அங்கே தங்கினார்கள்.” எபிரெயில் சொல்லுக்குச் சொல் “அங்கே படுத்தார்கள்” என்று உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: அனுப்பி
  rationale: எபிரெயக் கதைநடையில் வரும் ‘அனுப்பினான்’ என்ற இயல்பான பொருளைத் தெளிவாகக் கொடுக்கிறது; தொடர்வினை அமைப்பு தமிழில் அடுத்துள்ள ‘என்றார்’ என்பதோடு இயல்பாக இணைகிறது.
- source_word: מִן הַשִּׁטִּים
  choice: சித்தீமிலிருந்து
  rationale: இது ஓர் இடப்பெயர் என்பதால் பொருளாக்காமல் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: שְׁנַיִם אֲנָשִׁים
  choice: இரண்டு ஆண்களை
  rationale: மூலத்தில் ஆண்பால் தெளிவாகக் குறிப்பிடப்படுவதால் அதையே பாதுகாக்கிறது.
- source_word: מְרַגְּלִים
  choice: ஒற்றர்களாக
  rationale: அவர்களுடைய உளவு பார்க்கும் பணியை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: חֶרֶשׁ
  choice: இரகசியமாக
  rationale: இச்சூழலில் வினையடையாக வந்து, பணியின் மறைவான தன்மையைக் குறிக்கிறது.
- source_word: לְכוּ רְאוּ
  choice: நீங்கள் போய் … பாருங்கள்
  rationale: இரண்டு கட்டளைகளையும் இயல்பான தமிழ் வாக்கிய அமைப்பில் பாதுகாக்கிறது.
- source_word: אֶת הָאָרֶץ וְאֶת יְרִיחוֹ
  choice: அந்த நாட்டையும் எரிகோவையும்
  rationale: மூலத்தின் இணைப்புச் சொல்லான ‘மற்றும்/உம்’ என்பதை விளக்கவுரை சேர்க்காமல் நேரடியாகப் பாதுகாக்கிறது.
- source_word: בֵּית אִשָּׁה זוֹנָה
  choice: விபச்சாரப் பெண்ணின் வீட்டிற்கு
  rationale: זוֹנָה என்பதன் வழக்கமான பொருள் ‘விபச்சாரப் பெண்’; ‘விடுதிக்காரி’ என்பது சூழலிலிருந்து பெறப்படும் மாற்று விளக்கம், அடிப்படைச் சொற்பொருள் அல்ல.
- source_word: וּשְׁמָהּ רָחָב
  choice: ராகாப் என்னும்
  rationale: பெண்ணின் பெயரைத் தமிழில் சுருக்கமாகவும் இயல்பாகவும் அறிமுகப்படுத்துகிறது.
- source_word: וַיִּשְׁכְּבוּ שָׁמָּה
  choice: அங்கே படுத்தார்கள்
  rationale: שכב என்பதன் நேரடியான ‘படுத்தல்’ என்ற பொருளைப் பாதுகாத்து, அவர்கள் அங்கே தங்கினார்கள் என்பதையோ பாலுறவு கொண்டார்கள் என்பதையோ மொழிபெயர்ப்பே தீர்மானிக்காமல் விடுகிறது.
theological_decisions:
- issue: ராகாபின் தொழிலைக் குறிக்கும் זוֹנָה என்பதன் பொருள்
  choice: விபச்சாரப் பெண்
  alternative: விடுதிக்காரி
  rationale: மூல எபிரெயச் சொல்லின் சாதாரண, நேரடியான பொருள் ‘விபச்சாரப் பெண்’. சமூக அல்லது ஒழுக்கத் தாக்கத்தை மென்மைப்படுத்துவதற்காக குறைந்த ஆதாரமுள்ள மாற்றுப் பொருளை முதன்மைப்படுத்தவில்லை.
- issue: וַיִּשְׁכְּבוּ שָׁמָּה என்பதன் உட்குறிப்பு
  choice: அங்கே படுத்தார்கள்
  alternative: அங்கே தங்கினார்கள்
  rationale: நேரடி சொற்பொருளைப் பாதுகாக்கிறது. இது பாலியல் செயலைக் கூறுவதாகவும், வெறுமனே முறையான தங்குமிடத்தைப் பெற்றதாகவும் மொழிபெயர்ப்பு மிகையாகத் தீர்மானிப்பதைத் தவிர்க்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் தொடர் நிகழ்வுகள் சுருக்கமாகப் பாதுகாக்கப்பட்டுள்ளன; இடப்பெயர்களும் ஆட்பெயர்களும் தமிழில் வழக்கமான வடிவில் ஒலிபெயர்க்கப்பட்டுள்ளன. தெளிவுபடுத்த முடியாத இடங்களில் முதன்மை உரை மிகையாக விளக்காமல், மாற்றுப் புரிதல்கள் அடிக்குறிப்புகளில் தரப்பட்டுள்ளன.
