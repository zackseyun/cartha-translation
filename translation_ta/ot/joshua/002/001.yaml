  source_fidelity: 'மூல எபிரெய உரையின் முக்கிய கூறுகள் துல்லியமாகப் பாதுகாக்கப்பட்டுள்ளன: யோசுவா நூனின் மகன், சித்தீமிலிருந்து இரு ஆண்களை இரகசியமாக ஒற்றர்களாக அனுப்புதல், நாடும் எரிகோவும், ராகாபின் வீட்டும், அவர்கள் அங்கே படுத்ததும் அனைத்தும் உரைக்கு ஏற்ப உள்ளன. זוֹנָה என்பதன் இயல்பான பொருளான “விபச்சாரப் பெண்” மாற்றப்படாமல் உள்ளது; וַיִּשְׁכְּבוּ என்பதின் உட்குறிப்பு மிகையாகத் தீர்மானிக்கப்படவில்லை.'
