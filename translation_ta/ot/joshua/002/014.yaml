base_translation:
  language: en
  yaml_path: translation/ot/joshua/002/014.yaml
  text: The men said to her[a], “Our lives for yours, even to death, if you do not tell this matter of ours. And when Yahweh gives us the land, we will deal with you in covenant faithfulness and truth.”
translation:
  language: ta
  text: அந்த ஆண்கள் அவளிடம், “நீங்கள் எங்கள் இந்தக் காரியத்தை வெளிப்படுத்தாவிட்டால், உங்கள் உயிர்களுக்குப் பதிலாக எங்கள் உயிர்கள் மரிக்கட்டும். யாவே இந்தத் தேசத்தை எங்களுக்குக் கொடுக்கும்போது, நாங்கள் உன்னிடம் பற்றுறுதியோடும் உண்மையோடும் நடந்துகொள்வோம்[a]” என்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நாங்கள் உன்னிடம் அன்போடும் நம்பகத்தன்மையோடும் நடந்துகொள்வோம்.” חֶסֶד וֶאֱמֶת என்ற எபிரெய இணைச்சொல் பற்றுறுதியான அன்பையும் நம்பத்தகுந்த தன்மையையும் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאֲנָשִׁים
  choice: அந்த ஆண்கள்
  rationale: எபிரெயச் சொல் பொதுவாக ‘ஆண்கள்’ என்கிறது; சூழல் அவர்களை உளவாளிகள் என்று அடையாளப்படுத்தினாலும், அதை வசனத்துக்குள் சேர்க்காமல் மூலத்தின் சொல்வடிவம் காக்கப்படுகிறது.
- source_word: נַפְשֵׁנוּ תַחְתֵּיכֶם לָמוּת
  choice: உங்களுக்குப் பதிலாக நாங்கள் சாவோம்
  rationale: נֶפֶשׁ இங்கு உயிரைக் குறிக்கிறது; תַּחַת பதிலீட்டையும் לָמוּת மரணத்தையும் வெளிப்படுத்துகின்றன. தமிழ் வாசகருக்குத் தெளிவான உறுதிமொழியாக மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: אִם לֹא תַגִּידוּ
  choice: நீங்கள் வெளியில் சொல்லாவிட்டால்
  rationale: נגד என்பதன் பொருள் ‘சொல்/தெரிவி’. எபிரெய வினை இரண்டாம் நபர் ஆண்பால் பன்மையில் இருப்பதால் ‘நீங்கள்’ எனக் காக்கப்பட்டது; இரகசியத்தை வெளியிடுதல் என்ற சூழற்பொருளை ‘வெளியில்’ தெளிவாக்குகிறது.
- source_word: אֶת דְּבָרֵנוּ זֶה
  choice: எங்களுடைய இந்தக் காரியத்தை
  rationale: דָּבָר என்பதற்கு ‘சொல்’, ‘காரியம்’, ‘விவகாரம்’ ஆகிய பொருள்கள் உண்டு. இங்கு உளவாளிகளின் இரகசியக் காரியத்தைக் குறிப்பதால் ‘காரியம்’ இயல்பானது.
- source_word: בְּתֵת יְהוָה לָנוּ אֶת הָאָרֶץ
  choice: யெகோவா இந்த நாட்டை எங்களுக்குக் கொடுக்கும்போது
  rationale: בְּ + infinitive construct காலச் சூழலைக் குறிக்கிறது. הָאָרֶץ சூழலில் வாக்குறுதியளிக்கப்பட்ட குறிப்பிட்ட நாட்டைக் குறிப்பதால் ‘இந்த நாடு’ என மொழிபெயர்க்கப்பட்டது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: திருப்பெயரை பொதுப்பட்டப் பெயராக மாற்றாமல், தமிழில் பரவலாக அறியப்படும் ‘யெகோவா’ என்ற பெயர்வடிவத்தில் தருகிறது.
- source_word: וְעָשִׂינוּ עִמָּךְ
  choice: நாங்கள் உனக்கு … காட்டுவோம்
  rationale: עשה עם என்பது ஒருவரிடம் ஒரு குறிப்பிட்ட விதத்தில் நடந்துகொள்வதைச் சுட்டுகிறது. தொடர்ந்து வரும் பெயர்ச்சொற்களுடன் இயல்பான தமிழுக்காக ‘காட்டுவோம்’ பயன்படுத்தப்பட்டது.
- source_word: חֶסֶד וֶאֱמֶת
  choice: உடன்படிக்கைப் பற்றுறுதியையும் உண்மையையும்
  rationale: חֶסֶד என்பதன் உறவுசார், பற்றுறுதிமிக்க கனத்தையும் אֱמֶת என்பதன் உண்மை/நம்பகத்தன்மையையும் தனித்தனியாகக் காக்கிறது; இதை வெறும் பொதுவான இரக்கமாகச் சுருக்கவில்லை.
theological_decisions:
- issue: יְהוָה என்ற திருப்பெயரின் மொழிபெயர்ப்பு
  choice: யெகோவா
  alternative: கர்த்தர்
  rationale: மூலத்தில் தனிப்பட்ட திருப்பெயர் நேரடியாக இருப்பதால், அதை ஒரு பட்டப்பெயரால் மாற்றாமல் பெயராகவே வழங்குகிறது.
- issue: חֶסֶד וֶאֱמֶת என்ற இணைச்சொல்லின் பொருள்
  choice: உடன்படிக்கைப் பற்றுறுதியையும் உண்மையையும்
  alternative: அன்பையும் நம்பகத்தன்மையையும்
  rationale: இணைச்சொல்லிலுள்ள உடன்படிக்கைசார் விசுவாசத்தையும் உண்மை/நம்பகத்தன்மையையும் காக்கிறது. வேறு இயல்பான வாசிப்பை அடிக்குறிப்பில் தருவதன் மூலம் சொல்லின் பொருள் வளம் ஒற்றைப்படுத்தப்படவில்லை.
- issue: திடீர் பன்மை மற்றும் ஒருமை முகவரி
  choice: ‘நீங்கள்/உங்களுக்கு’ என்பதையும் பின்னர் ‘உனக்கு’ என்பதையும் காத்தல்
  alternative: எங்கும் ‘நீ/உனக்கு’ என்று ஒருமைப்படுத்துதல்
  rationale: תַגִּידוּ மற்றும் תַחְתֵיכֶם பன்மையாகவும், עִמָּךְ ஒருமையாகவும் உள்ள மூலத்தின் இலக்கண மாற்றத்தை அமைதியாகச் சீராக்காமல் பிரதிபலிக்கிறது; பன்மை ராகாபின் வீட்டாரையும் உள்ளடக்கக்கூடும்.
translation_notes:
  register: நவீனத் தரத்தமிழில் எளிமையும் கண்ணியமும் காக்கப்பட்டுள்ளன. உறுதிமொழியின் தீவிரம் நேரடியாகத் தரப்பட்டுள்ளது. எபிரெய மூலத்திலுள்ள பன்மை முகவரியிலிருந்து ஒருமை முகவரிக்கான மாற்றம் நோக்கத்துடன் பாதுகாக்கப்பட்டுள்ளது.
