revisions:
- from: அந்த ஆண்கள் அவளிடம், “எங்களுடைய இந்தக் காரியத்தை நீங்கள் வெளியில் சொல்லாவிட்டால், உங்களுக்குப் பதிலாக நாங்கள் சாவோம். யெகோவா இந்த நாட்டை எங்களுக்குக் கொடுக்கும்போது, நாங்கள் உனக்கு உடன்படிக்கைப் பற்றுறுதியையும் உண்மையையும் காட்டுவோம்[a]” என்றார்கள்.
  to: அந்த ஆண்கள் அவளிடம், “நீங்கள் எங்கள் இந்தக் காரியத்தை வெளிப்படுத்தாவிட்டால், உங்கள் உயிர்களுக்குப் பதிலாக எங்கள் உயிர்கள் மரிக்கட்டும். யாவே இந்தத் தேசத்தை எங்களுக்குக் கொடுக்கும்போது, நாங்கள் உன்னிடம் பற்றுறுதியோடும் உண்மையோடும் நடந்துகொள்வோம்[a]” என்றார்கள்.
  rationale: The revision removes an added public/spatial nuance, makes the self-substitution oath explicit in natural Tamil, aligns the divine name with the POB audit trail, and renders חסד ואמת as an idiomatic paired expression without adding an explicit covenant noun. It preserves the source’s plural-to-singular shift in address.
