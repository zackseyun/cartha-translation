base_translation:
  language: en
  yaml_path: translation/ot/joshua/002/011.yaml
  text: When we heard it[a], our hearts melted, and no spirit remained in any man because of you, for Yahweh your God[b], he is God in the heavens above and on the earth below.
translation:
  language: ta
  text: அதை நாங்கள் கேட்டபோது, எங்கள் உள்ளங்கள் கரைந்துபோயின; உங்களால் எவரிடமும் இனி மனத்துணிவு எழவில்லை[a]. ஏனெனில், உங்கள் கடவுளாகிய யாவே[b]—அவரே மேலே வானங்களிலும் கீழே பூமியிலும் கடவுள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொல்லுக்குச் சொல், “எந்த மனிதனிலும் இனி ஆவி எழவில்லை.” அதாவது, எவருக்கும் இனி துணிவு இருக்கவில்லை.
    reason: lexical_alternative
  - marker: b
    text: “யாவே” என்பது எபிரெயத்தில் YHWH என எழுதப்படும் கடவுளின் தனிப்பெயர்; பல மொழிபெயர்ப்புகள் இதை “கர்த்தர்” என்று வழங்குகின்றன.
    reason: cultural_note
lexical_decisions:
- source_word: וַנִּשְׁמַע
  choice: அதை நாங்கள் கேட்டபோது
  rationale: தொடர்ச்சியைச் சுட்டும் வாவ் இங்கு அடுத்த எதிர்வினைக்கான காலச் சூழலை அறிமுகப்படுத்துகிறது. முந்தைய வசனத்தில் சொல்லப்பட்ட செய்தியைச் சுட்ட ‘அதை’ இயல்பாகச் சேர்க்கப்பட்டுள்ளது.
- source_word: וַיִּמַּס לְבָבֵנוּ
  choice: எங்கள் உள்ளங்கள் கரைந்துபோயின
  rationale: பயம் மற்றும் துணிவிழப்பைக் குறிக்கும் ‘இதயம் கரைதல்’ என்ற எபிரெய உருவகத்தை, தமிழில் இயல்பான ‘உள்ளம் கரைதல்’ என்பதன் மூலம் காக்கிறது.
- source_word: וְלֹא קָמָה עוֹד רוּחַ בְּאִישׁ
  choice: எவரிடமும் இனி மனத்துணிவு எழவில்லை
  rationale: רוּחַ இங்கு காற்றையோ பரிசுத்த ஆவியையோ அல்ல, ஒருவரின் உள்ளார்ந்த துணிவைக் குறிக்கிறது. ‘எழவில்லை’ என்பது קָמָה என்ற வினையின் உருவகத்தையும் ஓரளவு காக்கிறது.
- source_word: מִפְּנֵיכֶם
  choice: உங்களால்
  rationale: சொல்லுக்குச் சொல் ‘உங்கள் முன்னிலையிலிருந்து’ என்றாலும், இச்சூழலில் இஸ்ரவேலரால் உண்டான பயத்தின் காரணத்தைக் குறிக்கிறது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முன்னர் கூறப்பட்ட பயத்திற்கான காரணத்தை அறிமுகப்படுத்துகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரான YHWH-ஐ ஒரு பட்டப்பெயரால் மாற்றாமல், தமிழில் பரவலாகப் புரிந்துகொள்ளக்கூடிய ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: אֱלֹהֵיכֶם
  choice: உங்கள் கடவுளாகிய
  rationale: யாவே என்ற பெயருடன் இணைந்து, அவர் இஸ்ரவேலரின் கடவுள் என்பதை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: הוּא אֱלֹהִים
  choice: அவரே ... கடவுள்
  rationale: எபிரெயத்தின் வலியுறுத்தும் הוּא என்பதை ‘அவரே’ என வெளிப்படுத்துகிறது; மூலத்தில் நேரடியாக இல்லாத ‘ஒரே’ அல்லது ‘மெய்யான’ என்பதைச் சேர்க்கவில்லை.
- source_word: בַּשָּׁמַיִם מִמַּעַל
  choice: மேலே வானங்களிலும்
  rationale: שָׁמַיִם என்பதன் பன்மையையும், மேலே–கீழே என்ற இணை எதிர்மறை அமைப்பையும் காக்கிறது.
- source_word: וְעַל הָאָרֶץ מִתָּחַת
  choice: கீழே பூமியிலும்
  rationale: வானம்–பூமி என்ற முழுமையைக் குறிக்கும் சொற்றொடரையும் செங்குத்தான எதிரிணையையும் இயல்பான தமிழில் காக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூல எபிரெயம் தெய்வீகப் பெயரையே நேரடியாகப் பயன்படுத்துகிறது. அதை ஒரு பட்டப்பெயராக மாற்றாமல் ஒலிபெயர்ப்பது மூலத்தின் தனிப்பெயர்த் தன்மையைப் பாதுகாக்கிறது.
- issue: ராகாபின் அறிக்கையின் பரப்பு
  choice: அவரே மேலே வானங்களிலும் கீழே பூமியிலும் கடவுள்
  alternative: அவர் ஒருவரே மெய்யான கடவுள்
  rationale: வானம்–பூமி முழுமையின் வழியாக யாவேயின் உலகளாவிய இறைமையை வசனம் உறுதிப்படுத்துகிறது. ஆனால் மூலத்தில் வெளிப்படையாக இல்லாத ‘ஒருவரே’ அல்லது ‘மெய்யான’ போன்ற சொற்கள் சேர்க்கப்படவில்லை.
- issue: רוּחַ என்பதன் பொருள்
  choice: மனத்துணிவு
  alternative: ஆவி
  rationale: இச்சூழலில் அது மக்களின் அச்சத்தால் மறைந்த உள்ளார்ந்த துணிவைக் குறிக்கிறது. ‘ஆவி’ என்று மட்டும் மொழிபெயர்த்தால் பரிசுத்த ஆவி அல்லது உயிர்மூச்சு என்ற தவறான இறையியல் வாசிப்பு ஏற்படலாம்; நேரடி உருவகம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதாகவும் மரியாதைமிக்க நடையிலும் வடிவமைக்கப்பட்டது. ‘உள்ளங்கள் கரைந்துபோயின’ என்ற மூல உருவகம் காக்கப்பட்டு, தெளிவிற்காக רוּחַ ‘மனத்துணிவு’ என வழங்கப்பட்டுள்ளது. இறுதி கடவுள் அறிக்கையின் வலியுறுத்தலைக் காட்ட நீள்கோடு பயன்படுத்தப்பட்டுள்ளது.
