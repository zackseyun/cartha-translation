base_translation:
  language: en
  yaml_path: translation/ot/joshua/002/021.yaml
  text: And she said[a], “According to your words, so be it.” Then she sent them away, and they went; and she tied the scarlet cord in the window.
translation:
  language: ta
  text: அவள், “நீங்கள் சொன்னபடியே ஆகட்டும்” என்றாள். பின்பு அவர்களை அனுப்பிவிட்டாள்; அவர்கள் சென்றார்கள். அவள் அந்தச் சிவப்புக் கயிற்றை[a] சாளரத்தில் கட்டினாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சிவப்புச் சரடு.” எபிரெயச் சொல் காணக்கூடிய அடையாளமாகப் பயன்படுத்தப்படும் கயிறு, சரடு அல்லது கோட்டைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּדִבְרֵיכֶם
  choice: நீங்கள் சொன்னபடியே
  rationale: ‘உங்கள் சொற்களின்படி’ என்ற எபிரெய நேரடிப் பொருளை இயல்பான நவீனத் தமிழில் தருகிறது; ஒற்றர்கள் கூறிய நிபந்தனைகளை ராகாப் ஏற்றுக்கொள்வதையும் தெளிவாகக் காட்டுகிறது.
- source_word: כֵּן הוּא
  choice: ஆகட்டும்
  rationale: ஒப்புதல் தெரிவிக்கும் எபிரெய மரபுத்தொடரின் வலிமையைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וַתְּשַׁלְּחֵם
  choice: அவர்களை அனுப்பிவிட்டாள்
  rationale: שלח என்பதன் அடிப்படைப் பொருளான ‘அனுப்பு’ என்பதைச் சூழலுக்கு ஏற்ற நிறைவுணர்வுடன் தருகிறது.
- source_word: וַיֵּלֵכוּ
  choice: அவர்கள் சென்றார்கள்
  rationale: הלך என்ற எளிய இயக்க வினையை விளக்கச் சேர்க்காமல் நேரடியாக மொழிபெயர்க்கிறது.
- source_word: וַתִּקְשֹׁר
  choice: கட்டினாள்
  rationale: கயிற்றை ஒரு இடத்தில் இணைப்பதைக் குறிக்கும் קשר என்பதற்கு இயல்பான தமிழ்ச் சொல்.
- source_word: תִּקְוַת הַשָּׁנִי
  choice: அந்தச் சிவப்புக் கயிறு
  rationale: תִּקְוָה வேறு சூழல்களில் ‘நம்பிக்கை’ எனப் பொருள்படலாம்; இங்கே காணக்கூடிய அடையாளமாகப் பயன்படுத்தப்படும் கயிறு அல்லது சரட்டைக் குறிக்கிறது. הַשָּׁנִי அதன் சிவப்பு நிறத்தைச் சுட்டுகிறது.
- source_word: בַּחַלּוֹן
  choice: சாளரத்தில்
  rationale: ב என்ற முன்னிடைச்சொல் இங்கே இடத்தைக் குறிக்கிறது; ‘சாளரத்தில்’ என்பது நேரடியும் இயல்புமான மொழிபெயர்ப்பு.
