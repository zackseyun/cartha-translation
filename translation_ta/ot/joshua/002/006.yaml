  text: But she had brought them up to the roof and hidden them among the stalks of flax laid out for her on the roof.
translation:
  language: ta
  text: ஆனால் அவள் அவர்களை மொட்டைமாடிக்கு ஏற்றிக்கொண்டு போய், அங்கே தனக்காகப் பரப்பி வைக்கப்பட்டிருந்த சணல் தண்டுகளுக்குள் அவர்களை மறைத்து வைத்திருந்தாள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַגָּגָה / עַל־הַגָּג
  choice: மொட்டைமாடிக்கு / மொட்டைமாடியில்
  rationale: பண்டைய வீட்டின் தட்டையான மேற்புறத்தைக் குறிக்கும் இச்சூழலில், நவீனத் தமிழில் இயல்பாகவும் தெளிவாகவும் ‘மொட்டைமாடி’ பொருந்துகிறது.
- source_word: בְּפִשְׁתֵּי הָעֵץ
  choice: சணல் தண்டுகளுக்குள்
  rationale: פִשְׁתֵּי என்பது flax எனும் நார்ப்பயிரையும், עֵץ இங்கு அதன் தண்டுகளையும் குறிக்கிறது; மறைத்த இடத்தை இயல்பாகச் சொல்ல ‘தண்டுகளுக்குள்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: הָעֲרֻכוֹת לָהּ
  choice: தனக்காகப் பரப்பி வைக்கப்பட்டிருந்த
  rationale: לָהּ என்பதன் ‘அவளுக்காக/அவளிடம்’ என்ற நுண்பொருளை விடாமல் காத்து, உலர்த்துவதற்காக ஒழுங்காகப் பரப்பப்பட்டிருந்த நிலையை இயல்பான தமிழில் தெரிவிக்கிறது.
