source:
  edition: WLC
  text: וַ/יֹּאמְרוּ֙ אֶל יְהוֹשֻׁ֔עַ כִּֽי נָתַ֧ן יְהוָ֛ה בְּ/יָדֵ֖/נוּ אֶת כָּל הָ/אָ֑רֶץ וְ/גַם נָמֹ֛גוּ כָּל יֹשְׁבֵ֥י הָ/אָ֖רֶץ מִ/פָּנֵֽי/נוּ־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/joshua/002/024.yaml
  text: And they said to Joshua, “Surely the LORD has given all the land into our hands, and indeed all the inhabitants of the land have melted away before us.”
translation:
  language: ta
  text: அவர்கள் யோசுவாவிடம், “நிச்சயமாகவே ஆண்டவர் அந்த நாடு முழுவதையும் நம் கையில் கொடுத்துவிட்டார். அந்த நாட்டில் குடியிருப்பவர்கள் அனைவரும் நம்முன் மனம் தளர்ந்துபோயிருக்கிறார்கள்” என்றார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: நிச்சயமாகவே
  rationale: இங்கு உளவாளிகள் தங்கள் முடிவை உறுதியாக அறிவிப்பதைச் சூழல் காட்டுகிறது; எனவே காரணப்பொருளைக் காட்டிலும் வலியுறுத்தும் பொருள் இயல்பானது.
- source_word: יְהוָה
  choice: ஆண்டவர்
  rationale: தேவனுடைய உடன்படிக்கைப் பெயரைத் தமிழ் வேதாகம நடையில் மரியாதையுடன் பிரதிபலிக்கும் வழக்கமான வடிவம்.
- source_word: נָתַן ... בְּיָדֵנוּ
  choice: நம் கையில் கொடுத்துவிட்டார்
  rationale: எபிரெய மொழியின் கைப்பற்றும் அதிகாரத்தைக் குறிக்கும் உருவகத்தைத் தக்கவைத்து, நிறைவேறிய செயலை உணர்த்துகிறது.
- source_word: נָמֹגוּ
  choice: மனம் கரைந்துபோயிருக்கிறார்கள்
  rationale: சொற்பொருளான ‘கரைந்துபோனார்கள்’ என்பதிலுள்ள பயத்தால் தைரியம் இழக்கும் உருவகத்தை நவீன தமிழில் தெளிவுபடுத்துகிறது.
- source_word: מִפָּנֵינוּ
  choice: நம்மைக் கண்டு
  rationale: அவர்களுடைய முன்னிலையில் அல்லது அவர்களால் ஏற்பட்ட அச்சத்தை இயல்பான தமிழில் தெரிவிக்கிறது.
theological_decisions:
- issue: நிலம் ஏற்கெனவே கொடுக்கப்பட்டதாகக் கூறும் நிறைவேற்றப் பார்வை
  choice: கொடுத்துவிட்டார்
  alternative: கொடுப்பார்
  rationale: נָתַן என்பது நிறைவு வினை; நிலம் இன்னும் முழுமையாகக் கைப்பற்றப்படாதிருந்தாலும், உளவாளிகள் இறைவனுடைய கொடையை உறுதியான நிகழ்வாக அறிவிக்கிறார்கள். அந்த இறையியல் பதற்றம் தக்கவைக்கப்படுகிறது.
- issue: தெய்வீகப் பெயரின் மொழிபெயர்ப்பு
  choice: ஆண்டவர்
  alternative: யாவே
  rationale: தமிழில் பொதுவாகப் புரியும் மரியாதைமிக்க பிரதிநிதிப்பைத் தேர்ந்தெடுக்கிறது; குறிப்பிட்ட சமயப் பிரிவின் உச்சரிப்பு மரபைத் திணிக்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், உரையாடலுக்கேற்ற இயல்பும் வேதாகம உரைக்கேற்ற கண்ணியமும் பேணப்பட்டுள்ளன. ‘நம் கையில்’ மற்றும் ‘மனம் கரைந்துபோய்’ என்ற மூல உருவகங்கள் வாசகருக்குத் தெளிவாக இருக்கும் வகையில் தக்கவைக்கப்பட்டுள்ளன.
