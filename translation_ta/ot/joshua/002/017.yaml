  yaml_path: translation/ot/joshua/002/017.yaml
  text: And the men said to her[a], “We will be free from this oath of yours that you made us swear.”
translation:
  language: ta
  text: அந்த ஆண்கள் அவளிடம், “நீ எங்களைச் சத்தியம் செய்யவைத்த உனது இந்தச் சத்தியத்திலிருந்து நாங்கள் விடுபட்டவர்களாக இருப்போம்[a],” என்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உனது இந்தச் சத்தியத்தைப் பொறுத்தவரை நாங்கள் குற்றமற்றவர்களாக—அதாவது, அதற்குக் கட்டுப்படாதவர்களாக—இருப்போம்.” எபிரெயச் சொல் சட்ட அல்லது உடன்படிக்கைச் சூழலில் பொறுப்பு அல்லது கடப்பாட்டிலிருந்து விடுபட்டிருப்பதைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: என்றார்கள்
  rationale: வழக்கமான எபிரெயக் கதைத் தொடரை இயல்பான தமிழ் வாக்கிய அமைப்பில் தருகிறது.
- source_word: אֵלֶיהָ
  choice: அவளிடம்
  rationale: ராகாபை நோக்கிச் சொல்லப்பட்டதை நவீனத் தமிழில் இயல்பாகக் குறிக்கிறது.
- source_word: הָאֲנָשִׁים
  choice: அந்த ஆண்கள்
  rationale: மூலம் பொதுவாக ‘ஆண்கள்’ என்றே கூறுகிறது; சூழலிலிருந்து அறியப்படும் ‘உளவாளிகள்’ என்ற குறிப்பிட்ட பங்கை மொழிபெயர்ப்புக்குள் சேர்க்கவில்லை.
- source_word: נְקִיִּם
  choice: விடுபட்டவர்களாக இருப்போம்
  rationale: சத்தியத்தால் உண்டாகும் பொறுப்பு அல்லது கட்டுப்பாட்டிலிருந்து விடுதலை பெற்ற நிலையைத் தெரிவிக்கிறது. சூழலின் எதிர்நோக்கை ‘இருப்போம்’ வெளிப்படுத்துகிறது; ‘குற்றமற்றவர்கள்’ என்ற நேரடி மாற்று இங்கு பொதுவான ஒழுக்கக் குற்றமின்மையாகத் தவறாகப் புரியக்கூடும்.
- source_word: אֲנַחְנוּ
  choice: நாங்கள்
  rationale: மூலத்தில் வெளிப்படையாக உள்ள சுட்டுப்பெயரின் வலியுறுத்தலைத் தக்கவைக்கிறது.
- source_word: מִשְּׁבֻעָתֵךְ הַזֶּה
  choice: உனது இந்தச் சத்தியத்திலிருந்து
  rationale: מִן குறிக்கும் பிரிவு அல்லது விடுதலையையும், இரண்டாம் நபர் பெண்பால் உரிமையையும், ‘இந்த’ என்ற சுட்டையும் காக்கிறது.
- source_word: אֲשֶׁר הִשְׁבַּעְתָּנוּ
  choice: நீ எங்களைச் சத்தியம் செய்யவைத்த
  rationale: שׁבע என்பதன் ஹிஃபில் வடிவிலுள்ள காரணவினைப் பொருளையும் ‘எங்களை’ என்ற பின்னொட்டையும் தெளிவாகப் பிரதிபலிக்கிறது.
theological_decisions:
- issue: נְקִיִּם என்பதன் சட்ட/உடன்படிக்கை சார்ந்த பொருள்
  choice: சத்தியத்திலிருந்து ‘விடுபட்டவர்கள்’
  alternative: ‘குற்றமற்றவர்கள்’ அல்லது ‘பொறுப்பற்றவர்கள்’
  rationale: இங்கு பேச்சு பொதுவான ஒழுக்கத் தூய்மையைப் பற்றியதல்ல; சத்தியத்தின் கடப்பாட்டிலிருந்து விடுபடுவதைப் பற்றியது. இருப்பினும் மூலச் சொல்லின் ‘குற்றமற்ற/பழியற்ற’ நிழற்பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், இயல்பும் கண்ணியமும் உள்ள நேரடி உரை. ‘உளவாளிகள்’ என்று சூழல் தகவலைச் சேர்க்காமல் மூலத்தின் ‘ஆண்கள்’ என்பதைக் காத்துள்ளது; சத்தியத்தின் கடப்பாட்டிலிருந்து விடுதலை என்ற சட்ட/உடன்படிக்கை நுணுக்கம் தெளிவாகத் தரப்பட்டுள்ளது.
