base_translation:
  language: en
  yaml_path: translation/ot/joshua/011/012.yaml
  text: Joshua captured all the cities of these kings[a], and all their kings, and he struck them down with the edge of the sword. He devoted them to destruction, just as Moses the servant of Yahweh had commanded.
translation:
  language: ta
  text: இந்த அரசர்களுக்குச் சொந்தமான எல்லா நகரங்களையும், அந்நகரங்களின் எல்லா அரசர்களையும் யோசுவா கைப்பற்றினான்; அவர்களை வாளின் கூர்மையால் வெட்டி வீழ்த்தினான். அவர்களை அழிவுக்கென்று அர்ப்பணித்தான்[a]. யாவேயின் ஊழியனான மோசே கட்டளையிட்டபடியே அவன் செய்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்களை முற்றிலும் அழித்தான்.” இங்கு வரும் எபிரேய வினை, மனிதர்களையோ பொருட்களையோ மீட்க முடியாதபடி அழிவுக்கென்று ஒதுக்கிவைப்பதைக் குறிக்கும் தனிப்பட்ட சொல்லாகும்.
    reason: חרם என்ற சொல்லின் தொழில்நுட்பப் பொருளையும் இயல்பான மாற்று மொழிபெயர்ப்பையும் விளக்குகிறது.
lexical_decisions:
- source_word: עָרֵי הַמְּלָכִים הָאֵלֶּה
  choice: இந்த அரசர்களுக்குச் சொந்தமான எல்லா நகரங்கள்
  rationale: எபிரேய கட்டமைப்பு நேரடியாக ‘இந்த அரசர்களின் நகரங்கள்’ என்று பொருள்படும். நவீன தமிழில் உரிமைத் தொடர்பைத் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்த ‘அரசர்களுக்குச் சொந்தமான’ என மொழிபெயர்க்கப்பட்டது; ‘அரச நகரங்கள்’ என்ற கூடுதல் பொருள் தவிர்க்கப்பட்டது.
- source_word: לָכַד
  choice: கைப்பற்றி
  rationale: போர்ச் சூழலில் நகரங்களையும் அரசர்களையும் தன் கட்டுப்பாட்டுக்குள் கொண்டுவந்த செயலை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: וַיַּכֵּם
  choice: வெட்டி வீழ்த்தினான்
  rationale: נכה என்பது பரந்த பொருளுடைய வினை; தொடர்ந்து வரும் ‘வாள்முனையால்’ என்ற சொற்றொடர் இங்கு உயிர்க்கொல்லும் தாக்குதலைக் குறிக்கிறது. ‘வீழ்த்தினான்’ மட்டும் தோற்கடித்தான் என்ற மங்கலான பொருளைத் தரக்கூடும் என்பதால் ‘வெட்டி வீழ்த்தினான்’ என வழங்கப்பட்டது.
- source_word: לְפִי חֶרֶב
  choice: வாள்முனையால்
  rationale: சொல்லுக்கு சொல் ‘வாளின் வாயால்’ என்ற எபிரேய மரபுத்தொடர். அதன் தெளிவான உடல் சார்ந்த படிமத்தை நவீன தமிழில் ‘வாள்முனையால்’ இயல்பாகத் தக்கவைக்கிறது.
- source_word: הֶחֱרִים
  choice: அழிவுக்கென்று அர்ப்பணித்தான்
  rationale: חרם என்பதன் ஹிஃபில் வடிவம், மனிதர்களையோ பொருட்களையோ மீட்க முடியாதவாறு அழிவுக்கென ஒதுக்கிவைக்கும் தொழில்நுட்பமான வேதாகமக் கருத்தைக் கொண்டுள்ளது. பொதுவான ‘முற்றிலும் அழித்தான்’ என்பதைக் காட்டிலும் இந்தத் தேர்வு அதன் தனிப்பட்ட கருத்தழுத்தத்தையும் இறையியல் பதற்றத்தையும் தக்கவைக்கிறது.
- source_word: כַּאֲשֶׁר צִוָּה
  choice: கட்டளையிட்டபடியே
  rationale: யோசுவாவின் செயல் மோசே முன்பு கொடுத்த கட்டளைக்கு முழுமையாக ஒத்திருந்தது என்பதைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: עֶבֶד יְהוָה
  choice: யாவேயின் ஊழியன்
  rationale: மோசேக்குரிய மதிப்புமிக்க உடன்படிக்கைப் பட்டத்தை ‘ஊழியன்’ இயல்பாக வெளிப்படுத்துகிறது; இச்சூழலுக்குப் பொருந்தாத அடிமைத்தனச் சாயலைத் தவிர்க்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைப்பட்டத்தால் மாற்றாமல், எபிரேய நான்கெழுத்து இறைப்பெயரை நவீன தமிழில் பரவலாக அறியப்படும் ஒலிபெயர்ப்பில் வழங்குகிறது.
theological_decisions:
- issue: வெற்றிகொள்ளும் போர்ச் சூழலில் חרם என்ற சொல்லை மொழிபெயர்த்தல்
  choice: அழிவுக்கென்று அர்ப்பணித்தான்
  alternative: முற்றிலும் அழித்தான்; அழிவுத் தடைக்குள் வைத்தான்
  rationale: இது சாதாரண அழித்தலை மட்டும் குறிக்கும் வினை அல்ல; அழிவுக்கென மீட்க முடியாதபடி ஒதுக்கிவைக்கும் தனிப்பட்ட வேதாகமச் சொல்லாகும். தேர்ந்த மொழிபெயர்ப்பு அதன் அர்ப்பணிப்பு மற்றும் அழிவு ஆகிய இரு கூறுகளையும் வாசகருக்காகத் திறந்தே வைக்கிறது.
- issue: יְהוָה என்ற இறைப்பெயரை வழங்குதல்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலத்தில் தனிப்பட்ட உடன்படிக்கைப் பெயர் நேரடியாக உள்ளது. ஆகவே அதை ஒரு பட்டத்தால் மாற்றாமல் தமிழில் ஒலிபெயர்க்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் வேதாகம உரைக்கு ஏற்ற கண்ணியத்துடனும் மொழிபெயர்க்கப்பட்டது. வன்முறை அல்லது חרם கருத்தை மென்மைப்படுத்தாமல், அதேவேளையில் பழமையான ‘சங்காரம்’ போன்ற சொற்களைத் தவிர்க்கிறது.
