base_translation:
  language: en
  yaml_path: translation/ot/joshua/011/001.yaml
  text: When Jabin king of Hazor heard of it[a], he sent to Jobab king of Madon, and to the king of Shimron[c][b], and to the king of Achshaph.
translation:
  language: ta
  text: ஹாசோர் அரசன் யாபீன் இதைக் கேள்விப்பட்டபோது[a], அவன் மாதோன் அரசன் யோபாபிடமும், சிம்ரோன் அரசனிடமும்[b], அக்ஷாப் அரசனிடமும் அனுப்பினான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் இன்னும் முறையாக, “ஹாசோர் அரசன் யாபீன் கேள்விப்பட்டபோது, அது நிகழ்ந்தது” என உள்ளது. “இதை” என்பது முந்தைய நிகழ்வுகளைச் சூழலிலிருந்து குறிக்கிறது; எபிரெயத்தில் கேட்கப்பட்ட பொருள் வெளிப்படையாகக் கூறப்படவில்லை.
    reason: lexical_alternative
  - marker: b
    text: இங்குள்ள எபிரெய உரை “சிம்ரோன்” என்றே கூறுகிறது. சிலர் இதை யோசுவா 12:20-இல் வரும் “சிம்ரோன்-மெரோன்” என்பதுடன் அடையாளப்படுத்துகின்றனர்.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי כִּשְׁמֹעַ
  choice: இதைக் கேள்விப்பட்டபோது
  rationale: וַיְהִי + כִּ + வினையெச்ச அமைப்பு புதிய கதைச் சூழலைக் காலவுறவுடன் அறிமுகப்படுத்துகிறது. நவீன தமிழில் இயல்பாக ‘கேள்விப்பட்டபோது’ என வழங்கப்பட்டது. எபிரெயத்தில் கேட்கப்பட்ட பொருள் வெளிப்படையாக இல்லாவிட்டாலும், முந்தைய சூழலைச் சுட்ட ‘இதை’ சேர்க்கப்பட்டது.
- source_word: יָבִין
  choice: யாபீன்
  rationale: எபிரெய ஒலிப்புக்கு நெருக்கமாகத் தனிப்பெயர் எழுத்துப்பெயர்க்கப்பட்டது.
- source_word: מֶלֶךְ חָצוֹר
  choice: ஆட்சோர் அரசன்
  rationale: பெயர்ச்சொல் இணைப்பு தமிழின் இயல்பான இடப்பெயர் + அரசன் வரிசையில் வழங்கப்பட்டது.
- source_word: וַיִּשְׁלַח אֶל
  choice: ஆள் அனுப்பினான்
  rationale: சொல்லுக்கு சொல் ‘அனுப்பினான்’ என்றாலும், தமிழில் பெறுநரைக் குறிப்பிட்டு ‘அனுப்பினான்’ என்பதற்கு அனுப்பப்பட்டவர் அல்லது பொருள் தேவைப்படும். தூதர்கள் உட்குறிப்பாக இருப்பதை மிகைப்படுத்தாமல் இயல்பாக ‘ஆள் அனுப்பினான்’ என வழங்கப்பட்டது.
- source_word: יוֹבָב מֶלֶךְ מָדוֹן
  choice: மாதோன் அரசன் யோபாப்
  rationale: தனிப்பெயரும் இடப்பெயரும் எபிரெய ஒலிப்புக்கு நெருக்கமாக எழுத்துப்பெயர்க்கப்பட்டு, தமிழில் இயல்பான பட்டப்பெயர் அமைப்பு பயன்படுத்தப்பட்டது.
- source_word: שִׁמְרוֹן
  choice: சிம்ரோன்
  rationale: மசோரா உரையில் உள்ள வடிவமே பின்பற்றப்பட்டது; யோசுவா 12:20-இன் ‘சிம்ரோன்-மெரோன்’ இங்கு முதன்மை உரைக்குள் கொண்டுவரப்படவில்லை.
- source_word: אַכְשָׁף
  choice: அக்சாப்
  rationale: எபிரெய மெய்யொலிகளைத் தமிழில் வாசிக்கத்தக்க வகையில் எழுத்துப்பெயர்த்த வடிவம்.
