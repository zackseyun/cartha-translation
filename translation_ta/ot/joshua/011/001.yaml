translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான கதைநடை பயன்படுத்தப்பட்டது. அரச பட்டங்கள் தமிழின் இயல்பான இடப்பெயர் + ‘அரசன்’ அமைப்பில் தரப்பட்டன. ‘ஆள் அனுப்பினான்’ என்பது எபிரெயத்தில் உட்குறிப்பாக உள்ள தூதுச்செயலை தமிழில் தெளிவாக்குகிறது; ‘செய்தி அனுப்பினான்’ எனக் குறிப்பிட்ட செய்தியைச் சேர்ப்பது தவிர்க்கப்பட்டது.
