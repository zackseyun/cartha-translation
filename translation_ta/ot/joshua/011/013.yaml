revisions:
- from: ஆனால், தங்கள் மேடுகளின்மேல்[a] நிலைத்திருந்த நகரங்களில் எதையும் இஸ்ரவேல் எரிக்கவில்லை; ஆத்சோர் ஒன்றை மட்டும் யோசுவா எரித்தார்.
  to: ஆனால், தங்கள் மேடுகளின்மேல் இருந்த நகரங்களில் எதையும் இஸ்ரவேல் எரிக்கவில்லை; ஆசோர் ஒன்றை மட்டும் யோசுவா எரித்தார்.
  rationale: The revision corrects the place name, improves idiomatic Tamil for the participial description of the cities, and clarifies the lexical-alternative footnote for תֵּל while retaining the verse’s contrast, scope of negation, and sole exception.
