source:
  edition: WLC
  text: רַ֣ק כָּל הֶ/עָרִ֗ים הָ/עֹֽמְדוֹת֙ עַל תִּלָּ֔/ם לֹ֥א שְׂרָפָ֖/ם יִשְׂרָאֵ֑ל זוּלָתִ֛י אֶת חָצ֥וֹר לְ/בַדָּ֖/הּ שָׂרַ֥ף יְהוֹשֻֽׁעַ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/011/013.yaml
  text: But Israel did not burn any of the cities that stood on their mounds[a], except Hazor alone; Joshua burned it.
translation:
  language: ta
  text: ஆனால், தங்கள் மேடுகளின்மேல் இருந்த நகரங்களில் எதையும் இஸ்ரவேல் எரிக்கவில்லை; ஆசோர் ஒன்றை மட்டும் யோசுவா எரித்தார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רַק
  choice: ஆனால்
  rationale: முந்தைய நிகழ்வுடன் உள்ள மாறுபாட்டையும் தொடர்ந்து வரும் விதிவிலக்கையும் இயல்பான நவீன தமிழில் அறிமுகப்படுத்துகிறது.
- source_word: כָּל הֶעָרִים ... לֹא
  choice: நகரங்களில் எதையும் ... எரிக்கவில்லை
  rationale: எதிர்மறை வாக்கியத்தில் எபிரேய விநியோகப் பொருளைத் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: הָעֹמְדוֹת עַל תִּלָּם
  choice: தங்கள் மேடுகளின்மேல் நிலைத்திருந்த
  rationale: עֹמְדוֹת என்பதன் ‘நின்றிருந்த/நிலைத்திருந்த’ உருவகத்தையும், תֵּל என்பதன் குடியிருப்பு அடுக்குகளால் உருவான மேடு என்ற நிலவியல் பொருளையும் காக்கிறது.
- source_word: זוּלָתִי אֶת חָצוֹר לְבַדָּהּ
  choice: ஆத்சோர் ஒன்றை மட்டும்
  rationale: ஆத்சோர் மட்டுமே விதிவிலக்கு என்பதைக் זוּלָתִי மற்றும் לְבַדָּהּ ஆகியவற்றின் கூட்டு வலியுறுத்தலுடன் சுருக்கமாகத் தெரிவிக்கிறது.
- source_word: שָׂרַף יְהוֹשֻׁעַ
  choice: யோசுவா எரித்தார்
  rationale: எபிரேய வினையை நேரடியாக வழங்குகிறது; தமிழில் பொருள் முன்பே குறிப்பிடப்பட்டிருப்பதால் தனிப் பதிற்பெயர் தேவையில்லை.
theological_decisions: []
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் வடிவமைக்கப்பட்டது. தொல்லியல் தொழில்சொல்லை முதன்மை உரையில் தவிர்த்து, அதன் குறிப்பான பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது; ‘நிலைத்திருந்த’ என்பது மூலத்தின் பங்கேற்புவினை உருவகத்தைப் பாதுகாக்கிறது.
