base_translation:
  language: en
  yaml_path: translation/ot/joshua/011/020.yaml
  text: For it was from Yahweh to harden their hearts to meet Israel in battle[a], so that he might devote them to destruction, so that there would be no mercy for them, but so that he might destroy them[c][b], just as Yahweh had commanded Moses.
translation:
  language: ta
  text: ஏனெனில், இஸ்ரவேலை எதிர்த்துப் போரிட அவர்களுடைய உள்ளங்களை இறுகச் செய்வது யெகோவாவிடமிருந்தே வந்தது; அவர்களை அழிவுக்கென்று அர்ப்பணிக்கவும்,[b] அவர்களுக்கு இரக்கம் கிடைக்காதிருக்கவும்,[c] யெகோவா மோசேக்குக் கட்டளையிட்டபடியே அவர்களை அழிக்கவும் அப்படியே இருந்தது.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்களுடைய உள்ளங்களை உறுதியாக்குவது.” இங்குள்ள எபிரெயச் சொல் அடிப்படையில் “வலுப்படுத்துதல்” என்று பொருள்படும்; இச்சூழலில் அவர்கள் எதிர்ப்பில் உறுதியாகவும் பிடிவாதமாகவும் ஆனதைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயில் இது நியாயத்தீர்ப்புக்காக ஒருவரை அல்லது ஒன்றை முழுமையாக அழிவுக்கென்று ஒதுக்குவதைக் குறிக்கும் தொழில்நுட்பச் சொல். “முற்றிலும் அழிக்கவும்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, “அவர்களுக்காக இரக்க வேண்டுதல் எதுவும் இல்லாதிருக்கவும்.” எபிரெயச் சொற்றொடர் சுருக்கமானது; அது இரக்கம் கிடைக்காததையோ, இரக்கத்திற்கான வேண்டுதல் இல்லாததையோ குறிக்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: מֵאֵת יְהוָה
  choice: யெகோவாவிடமிருந்தே வந்தது
  rationale: எபிரெயச் சொற்றொடர் நிகழ்வின் மூலத்தை யெகோவாவுக்கே நேரடியாகக் கூறுகிறது; ‘-ஏ’ வலியுறுத்தலை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: לְחַזֵּק אֶת לִבָּם
  choice: அவர்களுடைய உள்ளங்களை இறுகச் செய்தது
  rationale: חזק என்பதன் அடிப்படைப் பொருள் ‘உறுதியாக்கு/வலுப்படுத்து’; இச்சூழலில் எதிர்ப்பில் பிடிவாதமாக்குதல் என்ற இடியோமப் பொருளை ‘உள்ளங்களை இறுகச் செய்தது’ இயல்பாகத் தருகிறது.
- source_word: לִקְרַאת הַמִּלְחָמָה אֶת יִשְׂרָאֵל
  choice: இஸ்ரவேலை எதிர்த்துப் போரிட வரும்படி
  rationale: לִקְרַאת மற்றும் போர்ச் சூழல் பகைமையான மோதலைக் குறிக்கின்றன; இத்தமிழாக்கம் அதன் இயக்கத்தையும் போர்நோக்கத்தையும் தெளிவாகக் காக்கிறது.
- source_word: לְמַעַן הַחֲרִימָם
  choice: அவர்கள் அழிவுக்கென்று அர்ப்பணிக்கப்படவும்
  rationale: חרם என்பது நியாயத்தீர்ப்பின்கீழ் அழிவுக்கென்று ஒதுக்கி வைக்கும் தொழில்நுட்பமான கருத்தைக் கொண்டது; வெறும் ‘அழித்தல்’ என்று சமப்படுத்தாமல் அதைப் பாதுகாக்கிறது.
- source_word: לְבִלְתִּי הֱיוֹת לָהֶם תְּחִנָּה
  choice: அவர்களுக்கு இரக்கம் கிடைக்காதிருக்கவும்
  rationale: תְּחִנָּה என்பது இரக்கத்திற்கான வேண்டுதல் அல்லது அருள்/இரக்கம் என்பதைக் குறிக்கலாம். சுருக்கமான எபிரெயச் சொற்றொடருக்குப் பொருத்தமான, இயல்பான தமிழாக்கம் இது; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: לְמַעַן הַשְׁמִידָם
  choice: அவர்கள் அழிக்கப்படவும்
  rationale: שמד முழுமையான அழிவைச் சுட்டுகிறது. எபிரெயில் வெளிப்படையாகச் சொல்லப்படாத செய்பவரைச் சேர்க்காமல், வலுவான பொருளைத் தெளிவாகக் காக்கும் தமிழாக்கம்.
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת מֹשֶׁה
  choice: யெகோவா மோசேக்குக் கட்டளையிட்டபடியே
  rationale: முன்னர் கொடுக்கப்பட்ட கட்டளைக்கும் இந்நிகழ்வுக்கும் உள்ள நேரடியான ஒப்புமையை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: கானானிய அரசர்களின் உள்ளங்களை இறுகச் செய்வதில் இறைச் செயல்பாடு
  choice: ‘அவர்களுடைய உள்ளங்களை இறுகச் செய்தது யெகோவாவிடமிருந்தே வந்தது’ என்று இறைச் செயல்பாட்டை வெளிப்படையாக வைத்தல்
  alternative: யெகோவா அவர்கள் பிடிவாதமாக இருக்க அனுமதித்தார்
  rationale: எபிரெயம் இதன் மூலத்தை நேரடியாக யெகோவாவுக்குக் கூறுகிறது. அதை வெறும் அனுமதியாக மாற்றுவது மூலத்தில் இல்லாத இறையியல் மென்மைப்படுத்தலாகிவிடும்.
- issue: חרם என்ற அழிவுக்கான அர்ப்பணிப்பு மொழி
  choice: ‘அழிவுக்கென்று அர்ப்பணிக்கப்படவும்’
  alternative: ‘முற்றிலும் அழிக்கப்படவும்’ அல்லது ‘தடையாணையின் கீழ் வைக்கப்படவும்’
  rationale: நியாயத்தீர்ப்புக்காக முற்றாக ஒதுக்கப்படுதல் என்ற தனிப்பட்ட கருத்தை இது பாதுகாக்கிறது; அதேவேளை புரியாத சமயத் தொழில்நுட்பச் சொல்லைத் தவிர்க்கிறது.
- issue: இறுதி அழிவைச் செய்பவர் யார் என்பதிலுள்ள இலக்கண மறைவு
  choice: ‘அவர்கள் அழிக்கப்படவும்’ என்ற செயப்பாட்டு வடிவம்
  alternative: ‘அவர் அவர்களை அழிக்கவும்’ அல்லது ‘இஸ்ரவேலர் அவர்களை அழிக்கவும்’
  rationale: எபிரெய வினையெச்சத்தில் செய்பவர் வெளிப்படையாகக் குறிப்பிடப்படவில்லை. செயப்பாட்டு வடிவம் தேவனின் நோக்கத்தையும் வரலாற்றில் இஸ்ரவேலின் செயலையும் செயற்கையாக ஒன்றாகத் தீர்மானிக்காமல் மூலத்தின் சுருக்கத்தைக் காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையைக் கையாளப்பட்டுள்ளது. ‘உள்ளம்’, ‘இறுகச் செய்தல்’, ‘அழிவுக்கென்று அர்ப்பணித்தல்’ ஆகியவை மூலத்தின் உருவகத்தையும் நியாயத்தீர்ப்பு மொழியையும் காக்கின்றன. யெகோவாவின் செயல்பாடு மென்மைப்படுத்தப்படவில்லை; வெளிப்படாத செய்பவர் தமிழில் செயற்கையாகச் சேர்க்கப்படவில்லை.
