translation_notes:
  register: நவீன நிலையான தமிழில், இயல்பான ஆனால் கண்ணியமான வரலாற்று நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. எபிரெய மூலத்தின் ‘தலை’ உருவகம் பாதுகாக்கப்பட்டுள்ளது; வாளால் தாக்கியதன் விளைவு ‘கொன்றான்’ என்று உரையில் தீர்மானிக்கப்படாமல் அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது. ஒவ்வொரு அடிக்குறிப்பு குறியும் முதன்மை உரையில் இடம்பெற்றுள்ளது.
