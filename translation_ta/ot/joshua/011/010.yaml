base_translation:
  language: en
  yaml_path: translation/ot/joshua/011/010.yaml
  text: At that time Joshua turned back and captured Hazor[a], and he struck its king with the sword[c][b], for formerly Hazor was the head of all these kingdoms.
translation:
  language: ta
  text: அந்தக் காலத்தில் யோசுவா திரும்பி, ஆசோரைக் கைப்பற்றி, அதன் அரசனை வாளால் தாக்கினான்[a]. ஏனெனில், முன்பு ஆசோர் இந்த அரசுகள் அனைத்திற்கும் தலைவாயிருந்தது[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘வாளால் தாக்கினான்’ என்பதற்கு, ‘வாளால் வெட்டினான்’ என்றும் மொழிபெயர்க்கலாம். சூழலில் இது அவனைக் கொன்றதைக் குறிக்கக்கூடும்; ஆனால் எபிரெய வினைச்சொல் நேரடியாக ‘தாக்கினான்’ என்பதையே குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அதாவது, ‘இந்த அரசுகள் அனைத்திலும் முதன்மையானதாக இருந்தது.’ எபிரெய மூலத்தில் முதன்மையைக் குறிக்க ‘தலை’ என்ற உருவகம் பயன்படுத்தப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: திரும்பிச் சென்று
  rationale: שׁוב என்பது படையெடுப்பின் போக்கில் திரும்பிச் சென்றதைக் குறிக்கிறது. நவீனத் தமிழில் இயக்கத்தின் திசைநயத்தை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: בָּעֵת הַהִיא
  choice: அந்தக் காலத்தில்
  rationale: குறுகிய ஒரு கணத்தை மட்டும் வலியுறுத்தாமல், எபிரெய temporal expression-இன் காலச்சுட்டை இயல்பாகத் தருகிறது.
- source_word: וַיִּלְכֹּד
  choice: கைப்பற்றி
  rationale: לכד என்பது இராணுவச் சூழலில் ஒரு நகரைக் கைப்பற்றுவதைக் குறிக்கிறது.
- source_word: חָצוֹר
  choice: ஆத்சோர்
  rationale: எபிரெயப் பெயரான חָצוֹר (Ḥāṣôr) என்பதன் தொடக்கத் தொண்டை உரசொலியையும் ṣ ஒலியையும் தமிழில் அண்மையாகப் பிரதிபலிக்கும் ஒலிபெயர்ப்பு.
- source_word: מַלְכָּהּ
  choice: அதன் அரசனை
  rationale: பெண்பால் ஒருமை பின்னொட்டு நகரத்தைக் குறிக்கிறது; தமிழில் நகரைக் குறிப்பிட இயல்பான வடிவம் ‘அதன் அரசன்.’
- source_word: הִכָּה בֶחָרֶב
  choice: வாளால் வெட்டினான்
  rationale: נכה என்பதன் அடிப்படை ‘அடி/தாக்கு’; வாளோடு வரும் இச்சூழலில் ‘வெட்டினான்’ இயல்பாகவும், ‘கொன்றான்’ என்று விளைவை வெளிப்படையாகச் சேர்க்காமல் கட்டுப்பாடாகவும் உள்ளது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: ஆத்சோரின் முக்கியத்துவத்தை விளக்கும் காரணக் கிளவியைத் தெளிவாக அறிமுகப்படுத்துகிறது.
- source_word: לְפָנִים
  choice: முன்பு
  rationale: முந்தைய நிலையைச் சுருக்கமாகவும் இயல்பாகவும் குறிக்கிறது.
- source_word: רֹאשׁ
  choice: தலை
  rationale: முதன்மையைக் குறிக்கும் எபிரெய உருவகத்தைத் தமிழிலும் பாதுகாக்கிறது.
- source_word: כָּל הַמַּמְלָכוֹת הָאֵלֶּה
  choice: இந்த அரசுகள் அனைத்திற்கும்
  rationale: முழுமையையும் சுட்டுப்பெயரின் பொருளையும் இயல்பான தமிழ் வரிசையில் தக்கவைக்கிறது.
