revisions:
- from: அந்தக் காலத்தில் யோசுவா திரும்பிச் சென்று, ஆத்சோரைக் கைப்பற்றி, அதன் அரசனை வாளால் வெட்டினான்[a]. ஏனெனில், முன்பு ஆத்சோர் இந்த அரசுகள் அனைத்திற்கும் தலையாக இருந்தது[b].
  to: அந்தக் காலத்தில் யோசுவா திரும்பி, ஆசோரைக் கைப்பற்றி, அதன் அரசனை வாளால் தாக்கினான்[a]. ஏனெனில், முன்பு ஆசோர் இந்த அரசுகள் அனைத்திற்கும் தலைவாயிருந்தது[b].
  rationale: The revision uses the customary Tamil form ‘ஆசோர்,’ removes the redundant motion expression, and renders the sword action as ‘தாக்கினான்’ so that the translation does not narrow the Hebrew verb beyond its stated sense. It also improves the naturalness of the final clause while preserving the Hebrew ‘head’ metaphor and its explanatory footnote.
