  text: וַ/יָּבֹ֣א יְהוֹשֻׁ֡עַ וְ/כָל עַם֩ הַ/מִּלְחָמָ֨ה עִמּ֧/וֹ עֲלֵי/הֶ֛ם עַל מֵ֥י מֵר֖וֹם פִּתְאֹ֑ם וַֽ/יִּפְּל֖וּ בָּ/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/011/007.yaml
  text: So Joshua[a], and all the people of war with him, came against them suddenly at the waters of Merom and fell upon them.
translation:
  language: ta
  text: அப்போது யோசுவாவும் அவரோடு இருந்த போர்வீரர்கள் அனைவரும் மேரோம் நீர்நிலையருகே அவர்களுக்கு எதிராகத் திடீரென வந்து, அவர்கள்மேல் பாய்ந்தார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹא
  choice: வந்து
  rationale: בוא என்பதன் Qal wayyiqtol வடிவம் பார்வைநிலைக்கேற்ப ‘வந்தான்’ அல்லது ‘சென்றான்’ என அமையலாம். எதிரியை நோக்கிய நகர்வைத் தமிழில் இயல்பாகக் காட்ட ‘அவர்களுக்கு எதிராகத் ... வந்து’ என மொழிபெயர்க்கப்பட்டது.
- source_word: עַם הַמִּלְחָמָה
  choice: போர்வீரர்கள் அனைவரும்
  rationale: சொல்லுக்கு நெருக்கமாக ‘போரின் மக்கள்’ என்றாலும், அது தமிழில் இயல்பாக இல்லை. கூட்டாகப் போரிடுவோரைக் குறிக்கும் பொருளைத் தெளிவாகவும் நவீனமாகவும் தர ‘போர்வீரர்கள் அனைவரும்’ தேர்ந்தெடுக்கப்பட்டது; ‘படை’ என்பது சற்றுக் கூடுதலான அமைப்புசார் பொருளைச் சேர்க்கக்கூடும்.
- source_word: עִמּוֹ
  choice: அவரோடு இருந்த
  rationale: உடனிருத்தலையும் துணைசெல்வதையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: עֲלֵיהֶם
  choice: அவர்களுக்கு எதிராக
  rationale: பகைமையான நகர்வுடன் வரும் עַל இங்கு ‘எதிராக’ என்ற பொருளைத் தருகிறது.
- source_word: עַל מֵי מֵרוֹם
  choice: மேரோம் நீர்நிலையருகே
  rationale: מֵי מֵרוֹם என்பது மேரோம் எனப்படும் நீர்ப்பகுதியைக் குறிக்கிறது. עַל இங்கு அதன் அருகிலான இடத்தைக் குறிப்பதால் ‘நீர்நிலையருகே’ எனத் தரப்பட்டது.
- source_word: פִּתְאֹם
  choice: திடீரென
  rationale: தாக்குதலின் எதிர்பாராத, வேகமான தன்மையை நேரடியாகப் பாதுகாக்கிறது.
- source_word: וַיִּפְּלוּ בָּהֶם
  choice: அவர்கள்மேல் பாய்ந்தார்கள்
  rationale: נפל + ב என்ற போர் மரபுத்தொடர் தாக்குவதற்காக ஒருவர்மேல் விழுதல் அல்லது பாய்தல் எனப் பொருள்படும். வெறும் ‘தாக்கினார்கள்’ என்பதைவிட மூலத்தின் உயிரோட்டமான படிமத்தை ‘பாய்ந்தார்கள்’ காக்கிறது.
- source_word: וְ
  choice: அப்போது
  rationale: தொடக்க waw கதைத் தொடர்ச்சியைக் குறிக்கிறது. நவீன தமிழில் தொடர்ச்சியை இயல்பாகக் காட்ட ‘அப்போது’ பயன்படுத்தப்பட்டது.
