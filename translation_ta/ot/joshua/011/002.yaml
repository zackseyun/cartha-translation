translation_notes:
  register: நவீன தரத் தமிழில், எளிதில் புரியும் ஆனால் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. முந்தைய வசனத்திலிருந்து தொடரும் வாக்கியத் துணுக்கு என்பதால் தொடக்கத்திலும் முடிவிலும் அதன் தொடர்ச்சி பாதுகாக்கப்பட்டுள்ளது. பட்டியலின் நீளத்தைத் தெளிவாக்க இடைக்கோடுகள் பயன்படுத்தப்பட்டுள்ளன; அரபா, கின்னரோத், தோர் ஆகிய நிலப்பெயர்கள் ஒலிபெயர்க்கப்பட்டுள்ளன.
