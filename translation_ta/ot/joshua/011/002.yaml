  text: and to the kings who were in the north[a], in the hill country, in the Arabah south of Kinneroth, in the lowland[b], and in the heights of Dor toward the west.
translation:
  language: ta
  text: மேலும் வடக்கிலிருந்த அரசர்களுக்கும்—மலைநாட்டிலும், கின்னரோத்துக்குத் தெற்கே உள்ள அரபாவிலும், தாழ்நிலத்திலும், மேற்கே[b] உள்ள தோரின் மேடுகளிலும்[a]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘தோரின் மாவட்டங்களில்,’ ‘தோர் பிராந்தியத்தில்,’ அல்லது ‘தோரின் சரிவுகளில்’ என்றும் மொழிபெயர்க்கலாம். இதற்கான எபிரெயச் சொல் அரிதானது; அதன் துல்லியமான நிலவியல் பொருள் குறித்து கருத்து வேறுபாடு உள்ளது.
    reason: lexical_alternative
  - marker: b
    text: சொல்லுக்கு சொல், ‘கடலிலிருந்து.’ எபிரெய நிலவியல் வழக்கில் இது பொதுவாக மேற்குத் திசையைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶל
  choice: மேலும் … அரசர்களுக்கும்
  rationale: இணைப்புச் சொல்லும் முன்னிடைச்சொல்லும் முந்தைய வசனத்தின் பட்டியலைத் தொடர்ந்து, மேலும் சில அரசர்களை அழைப்பின் பெறுநர்களாகக் குறிப்பிடுகின்றன. தமிழில் ‘மேலும் … அரசர்களுக்கும்’ என்பது அந்தத் தொடர்ச்சியை இயல்பாகக் காட்டுகிறது.
- source_word: הַמְּלָכִים
  choice: அரசர்கள்
  rationale: מֶלֶךְ என்பதன் நேரான பொருள் ‘அரசன்’; பன்மையில் ‘அரசர்கள்’ என்பது பொதுவான ‘ஆட்சியாளர்கள்’ என்பதைவிடத் துல்லியமானது.
- source_word: אֲשֶׁר מִצְּפוֹן
  choice: வடக்கிலிருந்த
  rationale: இந்த உறவுத்தொடர் அரசர்களின் புவியியல் இருப்பிடத்தை அடையாளப்படுத்துகிறது. ‘வடக்கிலிருந்த’ என்பது தமிழில் சுருக்கமாகவும் இயல்பாகவும் உள்ளது.
- source_word: בָּהָר
  choice: மலைநாட்டில்
  rationale: הַר தனி மலையையும் மலைப்பாங்கான பிராந்தியத்தையும் குறிக்கலாம்; யோசுவாவின் நிலவியல் பட்டியலில் பிராந்தியப் பொருளான ‘மலைநாடு’ பொருத்தமானது.
- source_word: וּבָעֲרָבָה
  choice: அரபாவில்
  rationale: עֲרָבָה இங்கு குறிப்பிட்ட புவியியல் பிராந்தியத்தின் பெயர். பொதுவான ‘சமவெளி’ என்று மாற்றாமல் ‘அரபா’ என ஒலிபெயர்ப்பது அந்தத் தனிப்பெயர்ச் சார்ந்த பொருளைப் பாதுகாக்கிறது.
- source_word: נֶגֶב כִּנֲרוֹת
  choice: கின்னரோத்துக்குத் தெற்கே உள்ள
  rationale: נֶגֶב இங்கு ‘நெகேவ்’ என்ற தென்பகுதியைக் குறிக்காமல், வடக்கிலுள்ள கின்னரோத்தை ஒட்டி திசைப் பொருளில் ‘தெற்கே’ என்று வருகிறது.
- source_word: וּבַשְּׁפֵלָה
  choice: தாழ்நிலத்தில்
  rationale: שְׁפֵלָה தாழ்வான அல்லது அடிவாரப் பிராந்தியத்தைக் குறிக்கிறது. ‘தாழ்நிலம்’ நவீன வாசகருக்குத் தெளிவாகவும் பிராந்தியத் தன்மையைத் தக்கவைத்தும் உள்ளது.
- source_word: וּבְנָפוֹת דּוֹר
  choice: தோரின் மேடுகளில்
  rationale: נָפוֹת என்ற அரிய சொல்லின் துல்லியமான நிலவியல் பொருள் விவாதத்திற்குரியது. ‘மேடுகள்’ என்பது சாத்தியமான உயர்நில அல்லது சரிவுப் பொருளைத் தக்கவைக்கிறது; மற்ற வாய்ப்புகள் அடிக்குறிப்பில் தரப்படுகின்றன.
- source_word: מִיָּם
  choice: மேற்கே
  rationale: יָם என்பதன் நேர்ப்பொருள் ‘கடல்’; எபிரெய நிலவியல் வழக்கில் மத்தியதரைக் கடல் மேற்கில் இருந்ததால் இது பொதுவாக ‘மேற்கு’ என்ற திசைப் பொருளைக் கொடுக்கிறது.
