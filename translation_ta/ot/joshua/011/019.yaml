base_translation:
  language: en
  yaml_path: translation/ot/joshua/011/019.yaml
  text: There was not a city that made peace with the sons of Israel[a], except the Hivites living in Gibeon[b]; they took all of them in battle.
translation:
  language: ta
  text: இஸ்ரவேல் மக்களுடன் சமாதானம் செய்துகொண்ட நகரம் எதுவும் இல்லை; கிபியோனில் வாழ்ந்த ஏவியர்களைத் தவிர, இஸ்ரவேல் மக்கள் அனைத்தையும் போரில் கைப்பற்றினார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மொழியில் கடைசிப் பகுதி சொற்பட, “அனைத்தையும் அவர்கள் போரில் எடுத்தார்கள்” என்று உள்ளது. “அனைத்தும்” என்பது சூழலில் கூறப்படும் நகரங்களையோ மக்களையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִשְׁלִימָה אֶל
  choice: சமாதானம் செய்துகொண்ட
  rationale: שׁלם என்பதன் ஹிஃபில் வடிவம் இங்கு சமாதான உறவை ஏற்படுத்துவதைக் குறிக்கிறது. கிபியோனியருடனான உடன்படிக்கையின் சூழலைப் பிரதிபலிக்கிறது; ‘சரணடைந்தது’ என்று தேவைக்கு அதிகமாகக் குறிப்பாக்கவில்லை.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்கள்
  rationale: எபிரெய மொழியில் சொற்பட ‘இஸ்ரவேலின் மகன்கள்’ என்றிருந்தாலும், நவீனத் தமிழில் முழு தேசியக் குழுவையும் இயல்பாகவும் துல்லியமாகவும் குறிக்க ‘இஸ்ரவேல் மக்கள்’ பயன்படுத்தப்பட்டது.
- source_word: בִּלְתִּי
  choice: தவிர
  rationale: முந்தைய மறுப்புக்குரிய ஒரே விதிவிலக்கைத் தெளிவாக அறிமுகப்படுத்துகிறது.
- source_word: הַחִוִּי יֹשְׁבֵי גִבְעוֹן
  choice: கிபியோனில் வாழ்ந்த ஏவியர்கள்
  rationale: יֹשְׁבֵי என்பதன் குடியிருக்கும்/வாழும் என்ற பங்கேற்பு வினைச் சார்ந்த பொருளை இயல்பான தமிழில் காக்கிறது.
- source_word: אֶת הַכֹּל
  choice: மற்ற அனைவரையும்
  rationale: הַכֹּל என்பது இங்கு விதிவிலக்காகக் கூறப்பட்ட கிபியோனியரைத் தவிர சூழலில் உள்ள மொத்த நகரங்களையோ மக்களையோ குறிக்கலாம். தமிழ் வாக்கியத்தில் மனிதக் குழுக்களை நோக்கிய வாசிப்பை இயல்பாக்குகிறது; மூலத்தின் சுருக்கத்தையும் குறிப்பீட்டுத் தெளிவின்மையையும் அடிக்குறிப்பு சுட்டுகிறது.
- source_word: לָקְחוּ
  choice: கைப்பற்றினார்கள்
  rationale: לקח என்பதன் அடிப்படைப் பொருள் ‘எடுத்தல்’; போர் சூழலில் தமிழ் மொழியில் ‘கைப்பற்றுதல்’ இயல்பானதும் தேவையற்ற மேலதிக விளக்கமின்றி இராணுவப் பொருளைத் தருவதுமாகும்.
- source_word: בַמִּלְחָמָה
  choice: போரில்
  rationale: நகரங்களும் மக்களும் போர் மூலமாகக் கைப்பற்றப்பட்ட சூழலைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
