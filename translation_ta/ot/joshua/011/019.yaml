  to: இஸ்ரவேல் மக்களுடன் சமாதானம் செய்துகொண்ட நகரம் எதுவும் இல்லை; கிபியோனில் வாழ்ந்த ஏவியர்களைத் தவிர, இஸ்ரவேல் மக்கள் அனைத்தையும் போரில் கைப்பற்றினார்கள்.[a]
  rationale: ‘மற்ற அனைவரையும்’ என்பதற்குப் பதிலாக ‘அனைத்தையும்’ என மாற்றி, மூலத்தின் பரந்த குறிப்பீட்டையும் தெளிவின்மையையும் காத்துள்ளோம். இறுதி வினைக்கான கர்த்தாவை ‘இஸ்ரவேல் மக்கள்’ என வெளிப்படையாகக் கூறியுள்ளோம். அடிக்குறிப்பு மூலத்தில் உள்ள ‘அனைத்தும்’ என்பதன் சூழல்சார் பரப்பைத் துல்லியமாக விளக்குவதால் தக்கவைக்கப்படுகிறது.
