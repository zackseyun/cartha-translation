translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதாகப் புரியும் கண்ணியமான உரைநடை பயன்படுத்தப்பட்டது. ‘இஸ்ரவேலின் மகன்கள்’ என்ற சொற்படியான வடிவத்தைவிட இயல்பான ‘இஸ்ரவேல் மக்கள்’ தேர்ந்தெடுக்கப்பட்டது. ‘ஏவியர்கள்’ என்பது חִוִּי என்ற இனப்பெயரின் வழக்கமான தமிழ் வேதாகம வடிவம்.
