base_translation:
  language: en
  yaml_path: translation/ot/joshua/011/014.yaml
  text: And all the spoil of these cities[a], along with the livestock, the sons of Israel plundered for themselves; only all the people they struck with the edge of the sword until they had destroyed them[d][c][b]. They left no breathing thing.
translation:
  language: ta
  text: இந்தப் பட்டணங்களின் கொள்ளைப்பொருட்கள் அனைத்தையும் கால்நடைகளையும் இஸ்ரவேல் மக்கள்[a] தங்களுக்கெனக் கொள்ளையாக எடுத்துக்கொண்டார்கள். ஆனால் மக்கள் அனைவரையும் வாளின் முனையால் வெட்டி, அவர்களை அழித்தொழிக்கும்வரை தாக்கினார்கள்[b]. உயிர்மூச்சுள்ள எவரையும் அவர்கள் விட்டுவைக்கவில்லை[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'சொல்லுக்கு சொல்: ‘இஸ்ரவேலின் மகன்கள்.’ இங்கு இச்சொற்றொடர் இஸ்ரவேல் மக்களை மொத்தமாகக் குறிக்கிறது.'
    reason: lexical_alternative
  - marker: b
    text: 'சொல்லுக்கு சொல்: ‘வாளின் வாயின்படி அடித்தார்கள்’; இது வாளின் முனை அல்லது விளிம்பால் கொல்வதைக் குறிக்கும் எபிரெய மரபுத்தொடர்.'
    reason: idiom
  - marker: c
    text: அல்லது, ‘சுவாசித்துக்கொண்டிருந்த ஒருவரையும் அவர்கள் உயிரோடு விட்டுவைக்கவில்லை.’
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁלַל
  choice: கொள்ளைப்பொருட்கள்
  rationale: போரில் கைப்பற்றப்படும் பொருட்களைக் குறிக்கிறது; நவீன தமிழில் தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: הֶעָרִים הָאֵלֶּה
  choice: இந்தப் பட்டணங்கள்
  rationale: முந்தைய வசனங்களில் குறிப்பிடப்பட்ட பட்டணங்களைச் சுட்டுகிறது; எபிரெயச் சுட்டுப்பெயரின் அண்மை உணர்வைப் பேணுகிறது.
- source_word: הַבְּהֵמָה
  choice: கால்நடைகள்
  rationale: கொள்ளையாகக் கைப்பற்றப்பட்ட வீட்டுவளர்ப்பு விலங்குகளைத் துல்லியமாகக் குறிக்கிறது.
- source_word: בָּזְזוּ לָהֶם
  choice: தங்களுக்காகக் கொள்ளையிட்டார்கள்
  rationale: கொள்ளையிடும் செயலையும் לָהֶם காட்டும் தமக்கான பயனையும் வெளிப்படுத்துகிறது.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்கள்
  rationale: சொல்லுக்கு சொல் வடிவம் ‘இஸ்ரவேலின் மகன்கள்’ என்றாலும், இங்கு முழு உடன்படிக்கை மக்களினத்தையும் குறிக்கும் இயல்பான தமிழ்ச் சொற்றொடர் தேர்ந்தெடுக்கப்பட்டது; நேரடி வடிவம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: כָּל הָאָדָם
  choice: மக்கள் அனைவரையும்
  rationale: கால்நடைகளுக்கு மாறாக நகரங்களின் மனிதக் குடிகளை மொத்தமாகக் குறிக்கும் கூட்டு ஒருமை; பெண்களையும் குழந்தைகளையும் தவறாக விலக்காத மொழிபெயர்ப்பு.
- source_word: הִכּוּ לְפִי חֶרֶב
  choice: வாளால் வெட்டினார்கள்
  rationale: ‘வாளின் வாயால் அடித்தார்கள்’ என்ற எபிரெய மரபுத்தொடரின் இயல்பான தமிழ்ப் பொருளைத் தருகிறது; சொல்லுரு அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
- source_word: עַד הִשְׁמִדָם אוֹתָם
  choice: அழித்தொழிக்கும்வரை
  rationale: שׁמד என்பதன் முற்றிலுமான அழிவு வலிமையைத் தெரிவிக்கிறது; இக்கூற்றில் இல்லாத חֵרֶם சார்ந்த அர்ப்பணிப்பு கருத்தைச் சேர்க்கவில்லை.
- source_word: לֹא הִשְׁאִירוּ כָּל נְשָׁמָה
  choice: உயிர்மூச்சுள்ள எவரையும் அவர்கள் விட்டுவைக்கவில்லை
  rationale: נְשָׁמָה என்பதிலுள்ள மூச்சின் தெளிவான படிமத்தையும், ஒருவரும் உயிருடன் எஞ்சவில்லை என்ற சூழல் பொருளையும் பேணுகிறது.
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל என்பதன் மொழிபெயர்ப்பு
  choice: இஸ்ரவேல் மக்கள்
  alternative: இஸ்ரவேலின் மகன்கள்
  rationale: இங்கு இது ஆண்களை மட்டும் தனிப்படுத்தாமல் இஸ்ரவேல் இனக்குழுவை மொத்தமாகக் குறிக்கிறது. இயல்பான, உள்ளடக்கமான தமிழை முதன்மை உரையில் பயன்படுத்தி, சொற்படியான குடும்பவழிச் சொல்லை அடிக்குறிப்பில் வைத்துள்ளது.
- issue: כָּל הָאָדָם என்பதன் எல்லை
  choice: மக்கள் அனைவரையும்
  alternative: ஒவ்வொரு மனிதனையும்
  rationale: אָדָם இங்கு கால்நடைகளுக்கு எதிராக மனிதக் குடிகளை மொத்தமாகக் குறிக்கிறது. கூட்டு அர்த்தத்தைத் தெளிவாக்குகிறது; அழிவின் பரப்பை பாலின அடிப்படையில் குறுக்கவில்லை.
- issue: לֹא הִשְׁאִירוּ כָּל נְשָׁמָה என்பதன் குறிப்பு
  choice: உயிர்மூச்சுள்ள எவரையும் அவர்கள் விட்டுவைக்கவில்லை
  alternative: சுவாசிக்கும் எதையும் அவர்கள் எஞ்சவிடவில்லை
  rationale: உடனடி சூழலில் கால்நடைகள் கொள்ளையாக உயிருடன் வைக்கப்பட்டதால், இச்சொற்றொடர் கொல்லப்பட்ட மனிதர்களைக் குறிப்பதாக இயல்பாகப் புரிகிறது. அதே நேரத்தில் ‘மூச்சு’ என்ற எபிரெயப் படிமம் பேணப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘பட்டணம்,’ ‘கொள்ளைப்பொருட்கள்,’ ‘உயிர்மூச்சு’ ஆகிய சொற்கள் போர்ச் சூழலின் தீவிரத்தையும் எபிரெய மூச்சுப் படிமத்தையும் பேணுகின்றன. வன்முறையை மென்மையாக்காமலும் மூலத்தில் இல்லாத சமயவியல் விளக்கத்தைச் சேர்க்காமலும் உரை அமைக்கப்பட்டுள்ளது.
