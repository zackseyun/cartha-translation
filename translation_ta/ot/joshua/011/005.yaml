translation_notes:
  register: நவீன நிலையான தமிழ்; எளிதில் புரியும் அதே நேரத்தில் கண்ணியமான கதைநடை. எபிரெய உரையின் தொடர் செயல்களை இயல்பான தமிழ்ச் சொற்றொடராக அமைத்து, கூட்டணியின் திட்டமிட்ட கூடுகையையும் ஒருமித்த முகாமிடுதலையும் வேறுபடுத்திப் பேணியுள்ளது.
