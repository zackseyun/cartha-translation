source:
  edition: WLC
  text: וַ/יִּוָּ֣עֲד֔וּ כֹּ֖ל הַ/מְּלָכִ֣ים הָ/אֵ֑לֶּה וַ/יָּבֹ֜אוּ וַ/יַּחֲנ֤וּ יַחְדָּו֙ אֶל מֵ֣י מֵר֔וֹם לְ/הִלָּחֵ֖ם עִם יִשְׂרָאֵֽל־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/011/005.yaml
  text: All these kings met by agreement[a], and they came and encamped together at the waters of Merom to fight against Israel.
translation:
  language: ta
  text: இந்த அரசர்கள் அனைவரும் முன் ஏற்பாட்டின்படி கூடி[a], மேரோம் நீர்நிலைகளின் அருகே வந்து, இஸ்ரவேலுக்கு எதிராகப் போரிடுவதற்காக ஒருமித்து முகாமிட்டார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “முன் ஏற்பாட்டின்படி ஒன்றுகூடி” அல்லது “ஒன்றாகக் கூடிவந்து.” எபிரெய வினை தற்செயலான சந்திப்பை அல்ல, ஒருங்கிணைக்கப்பட்ட கூடுகையைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּוָּעֲדוּ
  choice: முன்பே பேசி ஒன்றுகூடி
  rationale: இந்த நிஃபால் வினை தற்செயலான சந்திப்பை அல்ல, முன் ஏற்பாடு அல்லது பரஸ்பர உடன்பாட்டின்படி நிகழ்ந்த ஒருங்கிணைந்த கூடுகையைக் குறிக்கிறது. இயல்பான நவீனத் தமிழில் அந்த இரு கூறுகளையும் இச்சொற்றொடர் வெளிப்படுத்துகிறது.
- source_word: כֹּל הַמְּלָכִים הָאֵלֶּה
  choice: இந்த அரசர்கள் அனைவரும்
  rationale: הָאֵלֶּה என்பதன் அண்மைச் சுட்டுப் பொருளையும் כֹּל என்பதன் முழுமையையும் நேரடியாகப் பேணுகிறது.
- source_word: וַיָּבֹאוּ
  choice: வந்து
  rationale: בוא என்பதன் வழக்கமான கதைநடைப் பொருளான ‘வந்தார்கள்’ என்பதை அடுத்த வினையுடன் இயல்பாக இணைக்கிறது.
- source_word: וַיַּחֲנוּ
  choice: முகாமிட்டார்கள்
  rationale: חנה இங்கு படை முகாம் அமைத்துத் தங்குவதைக் குறிக்கிறது; ‘முகாமிட்டார்கள்’ நவீனத் தமிழில் தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: יַחְדָּו
  choice: ஒருமித்து
  rationale: கூட்டணியின் ஒருங்கிணைந்த செயலை வலியுறுத்துகிறது; முன்னரே வரும் ‘ஒன்றுகூடி’ என்பதுடன் தேவையற்ற சொல் மீளுருவைத் தவிர்க்கிறது.
- source_word: אֶל מֵי מֵרוֹם
  choice: மேரோம் நீர்நிலையருகே
  rationale: אֶל இலக்கைச் சுட்டினாலும், முகாமிட்ட இடத்தைக் குறிப்பிடும் தமிழ்ச் சூழலில் ‘அருகே’ இயல்பான இடவியல் வடிவம். מֵי என்ற பன்மை வடிவத்தை ஒரு குறிப்பிட்ட ‘ஏரி’ என்று மிகத் துல்லியமாக்காமல் ‘நீர்நிலை’ என்று தருகிறது.
- source_word: לְהִלָּחֵם עִם יִשְׂרָאֵל
  choice: இஸ்ரவேலுக்கு எதிராகப் போரிடுவதற்காக
  rationale: இராணுவச் சூழலில் לחם עם கொண்டுள்ள எதிர்த்துப் போரிடும் பொருளைத் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
