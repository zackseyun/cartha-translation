- from: இந்த அரசர்கள் அனைவரும் முன்பே பேசி ஒன்றுகூடி[a], இஸ்ரவேலுக்கு எதிராகப் போரிடுவதற்காக மேரோம் நீர்நிலையருகே வந்து, ஒருமித்து முகாமிட்டார்கள்.
  to: இந்த அரசர்கள் அனைவரும் முன் ஏற்பாட்டின்படி கூடி[a], மேரோம் நீர்நிலைகளின் அருகே வந்து, இஸ்ரவேலுக்கு எதிராகப் போரிடுவதற்காக ஒருமித்து முகாமிட்டார்கள்.
