- from: சேயீரை நோக்கி உயர்ந்துசெல்லும் ஆலாக் மலை[a] தொடங்கி, எர்மோன் மலைக்குக் கீழே லெபனோன் பள்ளத்தாக்கில்[b] இருந்த பாகால்-காத் வரை உள்ள நாடு முழுவதையும் யோசுவா கைப்பற்றினார். அங்கிருந்த அரசர்கள் அனைவரையும் அவர் பிடித்து, வீழ்த்திக் கொன்றார்.
