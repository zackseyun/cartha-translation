translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. வசனம் எபிரெயில் முந்தைய வாக்கியத்தின் நிலப்பரப்பு பட்டியலைத் தொடர்வதால், தனிவசனமாக வாசிக்கத் தெளிவாக ‘உள்ள நாடு முழுவதையும் யோசுவா கைப்பற்றினார்’ என மறைபொருள் வெளிப்படுத்தப்பட்டது; பின்னர் வரும் அரசர்களைப் பிடித்தல் தனியே பாதுகாக்கப்பட்டது. எல்லா அடிக்குறிப்பு குறிகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
