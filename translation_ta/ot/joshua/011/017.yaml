  yaml_path: translation/ot/joshua/011/017.yaml
  text: from Mount Halak[a], which rises toward Seir, as far as Baal-gad in the Valley of Lebanon below Mount Hermon[b]. And he captured all their kings and struck them down and put them to death.
translation:
  language: ta
  text: சேயீரை நோக்கி உயர்ந்திருக்கும் ஆலாக் மலை[a] முதல், எர்மோன் மலைக்குக் கீழுள்ள லெபனோன் பள்ளத்தாக்கிலிருக்கும்[b] பாகால்-காத் வரை; அவர்களுடைய எல்லா அரசர்களையும் அவர் பிடித்து, அவர்களைத் தாக்கிக் கொன்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘வழவழப்பான மலை.’ எபிரெயச் சொற்றொடரை ஒரு விளக்கமாகவும் புரிந்துகொள்ளலாம்; ஆனால் இங்கே அது ‘ஆலாக் மலை’ என்ற இடப்பெயராக இருக்க வாய்ப்பு அதிகம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘லெபனோன் சமவெளியில்.’ எபிரெயச் சொல் அகன்ற பள்ளத்தாக்கையோ சமவெளியையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָהָר הֶחָלָק
  choice: ஆலாக் மலை
  rationale: எல்லைச் சுருக்கத்தில் இது புவியியல் இடப்பெயராகச் செயல்படுவது இயல்பானது; எபிரெயச் சொல்லின் விளக்கப் பொருளை அடிக்குறிப்பில் தருகிறது.
- source_word: הָעֹלֶה שֵׂעִיר
  choice: சேயீரை நோக்கி உயர்ந்துசெல்லும்
  rationale: עלה என்ற பங்கேற்பு வடிவத்தின் நிலவியல் ஏற்றம் அல்லது மேல்நோக்கிய நீட்சியை இயல்பான தமிழில் காக்கிறது.
- source_word: וְעַד
  choice: தொடங்கி ... வரை
  rationale: வசனத் துணுக்கு முந்தைய வாக்கியத்துடன் தொடர்ந்தாலும், தமிழில் கைப்பற்றப்பட்ட நிலப்பரப்பின் எல்லையைத் தெளிவாகக் காட்டும் வகையில் தொடக்கமும் முடிவும் வெளிப்படுத்தப்பட்டன.
- source_word: בַּעַל גָּד
  choice: பாகால்-காத்
  rationale: புவியியல் இடப்பெயர் என்பதால் பொருள் மொழிபெயர்க்காமல் தமிழ் ஒலிபெயர்ப்பில் தரப்பட்டது.
- source_word: בְּבִקְעַת הַלְּבָנוֹן
  choice: லெபனோன் பள்ளத்தாக்கில்
  rationale: בִּקְעָה அகன்ற பள்ளத்தாக்கையோ சமவெளியையோ குறிக்கலாம்; இங்கு இயல்பான முதன்மைத் தேர்வாக ‘பள்ளத்தாக்கு’ கொள்ளப்பட்டது.
- source_word: תַּחַת הַר חֶרְמוֹן
  choice: எர்மோன் மலைக்குக் கீழே
  rationale: குறிப்பிடப்பட்ட மலையுடன் ஒப்பிடுகையில் தாழ்வான நிலவியல் இருப்பிடத்தை நேரடியாகக் காட்டுகிறது.
- source_word: וְאֵת כָּל מַלְכֵיהֶם לָכַד
  choice: அங்கிருந்த அரசர்கள் அனைவரையும் அவர் பிடித்து
  rationale: ‘அவர்கள்’ என்ற சுட்டின் நிலவியல் முன்னிலையை தமிழில் தெளிவாக்க ‘அங்கிருந்த’ என வழங்கி, ‘அனைவரும்’ என்ற முழுமையைப் பாதுகாக்கிறது.
- source_word: וַיַּכֵּם וַיְמִיתֵם
  choice: வீழ்த்திக் கொன்றார்
  rationale: נכה மற்றும் מות ஆகிய தொடர்ச்சியான இரு வினைகளையும் வேறுபடுத்தி, முதலாவது தாக்கி வீழ்த்துதலையும் இரண்டாவது மரணத்தை ஏற்படுத்துதலையும் சுருக்கமான இயல்பான தமிழில் காக்கிறது.
