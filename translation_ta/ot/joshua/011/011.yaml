- from: அதில் இருந்த ஒவ்வொருவரையும் அவர்கள் வாளின் முனையால் வெட்டி வீழ்த்தி, அழிவுக்கென்று அர்ப்பணித்தார்கள்.[a] உயிர்மூச்சுள்ள எதுவும் மீந்திருக்கவில்லை.[b] அவன் ஆத்சோரை நெருப்பால் எரித்தான்.[c]
  to: அதிலிருந்த அனைவரையும் அவர்கள் வாளின் கூர்மையால் வெட்டிக்கொன்று, அழிவுக்கென ஒதுக்கினார்கள்.[a] உயிருடன் எதுவும் மீதியாக இருக்கவில்லை.[b] அவன் ஆசோரை நெருப்பால் எரித்தான்.[c]
  rationale: The revision keeps the source’s severe military description and the plural-to-singular shift intact. It improves the Tamil expression of חרם, uses a less over-specified rendering of the battle verb in context, adopts the conventional Tamil form of the place name, and makes the no-survivor idiom smoother without narrowing its breadth.
