  yaml_path: translation/ot/joshua/011/011.yaml
  text: They struck down every person who was in it with the edge of the sword[a], devoting them to destruction; not a single breathing thing was left[c][b], and he burned Hazor with fire.
translation:
  language: ta
  text: அதிலிருந்த அனைவரையும் அவர்கள் வாளின் கூர்மையால் வெட்டிக்கொன்று, அழிவுக்கென ஒதுக்கினார்கள்.[a] உயிருடன் எதுவும் மீதியாக இருக்கவில்லை.[b] அவன் ஆசோரை நெருப்பால் எரித்தான்.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘முற்றிலும் அழித்தார்கள்’ அல்லது ‘அழிவுத் தடைக்குள் வைத்தார்கள்’ என்றும் மொழிபெயர்க்கலாம். இங்கு வரும் எபிரெய חרם என்ற சொல், அழிவுக்கென மாற்றமுடியாதபடி ஒதுக்கப்படுவதைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: சொல்லுக்குச் சொல், ‘எந்த மூச்சும் மீதியாக இருக்கவில்லை.’ உயிர்தப்பியவர் எவரும் இல்லை என்பதைக் குறிக்கும் எபிரெய மொழிமரபு.
    reason: lexical_alternative
  - marker: c
    text: எபிரெயத்தில் முதலில் பன்மை (‘அவர்கள் வெட்டிக்கொன்றார்கள்’), பின்னர் ஒருமை (‘அவன் எரித்தான்’) வருகிறது. இறுதிக் கூற்று குறிப்பாக யோசுவாவைக் குறிக்கக்கூடும்.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּכּוּ
  choice: அவர்கள் ... வெட்டி வீழ்த்தி
  rationale: נכה என்பதன் ஹிஃபில் வடிவம் போர்ச் சூழலில் ‘வெட்டி வீழ்த்துதல்’ அல்லது ‘கொல்லுதல்’ என்ற பொருளைத் தருகிறது. ‘வெட்டி வீழ்த்தி’ என்பது வெறும் தாக்குதலைவிட முடிவுற்ற போர்ச் செயலைத் தெளிவாகக் காட்டுகிறது.
- source_word: כָּל הַנֶּפֶשׁ אֲשֶׁר בָּהּ
  choice: அதில் இருந்த ஒவ்வொருவரையும்
  rationale: இங்கு נֶפֶשׁ உடலிலிருந்து தனியான ‘ஆத்துமா’ என்பதைக் குறிக்காமல், நகரத்தில் இருந்த உயிருள்ள மனிதர்களைக் குறிக்கிறது. நவீன தமிழில் ‘ஒவ்வொருவரையும்’ என்பது இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: לְפִי חֶרֶב
  choice: வாளின் முனையால்
  rationale: சொல்லுக்குச் சொல் ‘வாளின் வாயால்’ என்ற எபிரெய மொழிமரபை, அதன் போர்சார் உருவகத்தைத் தக்கவைத்தபடி தமிழில் இயல்பான ‘வாளின் முனையால்’ என்று வழங்குகிறது.
- source_word: הַחֲרֵם
  choice: அழிவுக்கென்று அர்ப்பணித்தார்கள்
  rationale: חרם என்பது சாதாரணமாகக் கொல்வதை மட்டும் அல்லாமல், ஒன்றைத் திரும்பப்பெற முடியாதபடி அழிவுக்கென ஒதுக்கிவிடும் கருத்தையும் கொண்டுள்ளது. ‘அர்ப்பணித்தார்கள்’ அந்தத் தனித்த கருத்தைத் தக்கவைக்கிறது; அடிக்குறிப்பு மாற்று விளக்கத்தை அளிக்கிறது.
- source_word: לֹא נוֹתַר כָּל נְשָׁמָה
  choice: உயிர்மூச்சுள்ள எதுவும் மீந்திருக்கவில்லை
  rationale: נְשָׁמָה என்பதன் அடிப்படைப் பொருள் ‘மூச்சு’. ‘உயிர்மூச்சுள்ள எதுவும்’ என்பது எவரும் உயிர்தப்பவில்லை என்ற மொழிமரபின் வலிமையையும், மூலத்தின் விரிவான சொல்லாட்சியையும் தக்கவைக்கிறது.
- source_word: חָצוֹר
  choice: ஆத்சோர்
  rationale: எபிரெய இடப்பெயரின் ஒலியமைப்பைத் தமிழில் அண்மையாக எழுத்துப்பெயர்க்கிறது.
- source_word: שָׂרַף בָּאֵשׁ
  choice: நெருப்பால் எரித்தான்
  rationale: எபிரெய வாக்கியத்தில் ‘எரித்தான்’ என்பதோடு ‘நெருப்பால்’ என்பதும் வெளிப்படையாக உள்ளது. தமிழ் மொழியிலும் அந்த வலியுறுத்தலைத் தக்கவைக்கிறது.
theological_decisions:
- issue: வெற்றிப்போர் சூழலில் חרם என்பதன் மொழிபெயர்ப்பு
  choice: அழிவுக்கென்று அர்ப்பணித்தார்கள்
  alternative: முற்றிலும் அழித்தார்கள்; அழிவுத் தடைக்குள் வைத்தார்கள்
  rationale: இந்தச் சொல் சாதாரணப் போர்க்கொலையைவிட, அழிவுக்கென மாற்றமுடியாதபடி ஒதுக்கப்படுதல் என்ற சமய-உடன்படிக்கை சார்ந்த நுணுக்கத்தையும் கொண்டுள்ளது. தேர்ந்தெடுக்கப்பட்ட வாசகம் அந்த நுணுக்கத்தை மறைக்காமலும், பிற்காலக் கோட்பாட்டைச் சேர்க்காமலும் வழங்குகிறது.
- issue: பன்மை எழுவாயிலிருந்து ஒருமை எழுவாய்க்கான மாற்றம்
  choice: அவர்கள் ... அவன் ஆத்சோரை ... எரித்தான்
  alternative: அவர்கள் ... அவர்கள் ஆத்சோரை ... எரித்தார்கள்
  rationale: மூல எபிரெயம் ‘அவர்கள் வெட்டி வீழ்த்தினார்கள்’ என்ற பன்மையிலிருந்து ‘அவன் எரித்தான்’ என்ற ஒருமைக்கு மாறுகிறது. இறுதி ஒருமை யோசுவாவைக் குறிக்கக்கூடும்; அதனை உறுதியாக விளக்காமல், மூலத்திலுள்ள மாற்றம் அப்படியே பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையைப் பயன்படுத்துகிறது. போரின் கடுமையை மென்மையாக்காமல் கூறுகிறது; அதேவேளை חרם என்ற சொல்லின் தனித்த நுணுக்கத்தை அடிக்குறிப்புடன் பாதுகாக்கிறது. மூலத்தில் காணப்படும் பன்மை–ஒருமை மாற்றம் சீராக்கப்படாமல் தக்கவைக்கப்பட்டுள்ளது.
