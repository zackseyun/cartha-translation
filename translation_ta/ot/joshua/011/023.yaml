base_translation:
  language: en
  yaml_path: translation/ot/joshua/011/023.yaml
  text: So Joshua took all the land[a], according to all that Yahweh had spoken to Moses, and Joshua gave it to Israel as an inheritance according to their divisions by their tribes[b]. And the land had rest from war.
translation:
  language: ta
  text: யோசுவா அந்த நாடு முழுவதையும்[a], யாவே மோசேயிடம் கூறியிருந்த அனைத்தின்படியும், எடுத்துக்கொண்டார். அதை இஸ்ரவேலருக்குச் சுதந்தரமாக, தங்கள் கோத்திரங்களுக்கான பங்கீடுகளின்படி கொடுத்தார். நாடு போரிலிருந்து ஓய்வுபெற்றது[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “முழு நாட்டையும்.” இச்சொற்றொடர் இங்கு விவரிக்கப்படும் நாட்டை யோசுவா எடுத்துக்கொண்டதைச் சுருக்கமாகக் கூறுகிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “போரினால் நாடு அமைதியாக இருந்தது.” எபிரெயச் சொற்றொடர் மோதலுக்குப் பிந்திய ஓய்வையும் அமைதியையும் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: கைப்பற்றினார்
  rationale: לקח என்பதன் அடிப்படைப் பொருள் ‘எடுத்தார்.’ ஒரு நாட்டை எடுத்துக்கொள்வதைச் சுருக்கமாகக் கூறும் இச்சூழலில், இயல்பான தமிழுக்காக ‘கைப்பற்றினார்’ பயன்படுத்தப்பட்டுள்ளது; இது அடுத்துவரும் நிலப் பகிர்வோடு பொருந்துகிறது.
- source_word: כָּל הָאָרֶץ
  choice: அந்த நாடு முழுவதையும்
  rationale: אָרֶץ என்பது இங்கு பூமி முழுவதையும் அல்ல, முன்னர் விவரிக்கப்பட்ட நாட்டைக் குறிக்கிறது. ‘முழுவதையும்’ என்ற சொல் எபிரெயச் சுருக்கக் கூற்றின் முழுமையுணர்வைப் பாதுகாக்கிறது; அதன் பரப்பை மொழிபெயர்ப்பு தானாக விளக்கித் தீர்க்கவில்லை.
- source_word: כְּכֹל אֲשֶׁר דִּבֶּר
  choice: கூறியிருந்த அனைத்தின்படியும்
  rationale: இந்தச் சொற்றொடர், முன்பு கூறப்பட்டதோடு செயல் ஒத்திருந்ததைக் குறிக்கிறது. ‘கூறியிருந்த’ என்பது முந்தைய உரையின் காலத் தொடர்பையும் காட்டுகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரை ஒரு பட்டப்பெயராக மாற்றாமல், יהוה என்பதற்கான தமிழ்ச் சீரெழுத்தாக்கமாக ‘யாவே’ தரப்பட்டுள்ளது.
- source_word: וַיִּתְּנָהּ
  choice: அதை ... கொடுத்தார்
  rationale: பெண்பால் ஒருமை பின்னொட்டு முன் குறிப்பிடப்பட்ட நாட்டைக் குறிக்கிறது. נתן என்பதன் நேரடியான பொருளான ‘கொடுத்தார்’ பாதுகாக்கப்பட்டுள்ளது.
- source_word: לְנַחֲלָה
  choice: உரிமைச்சொத்தாக
  rationale: נחלה என்பது தலைமுறை வழியாகக் கிடைக்கும் பங்கையும் நிலையான உடைமையையும் குறிக்கிறது. ‘உரிமைச்சொத்து’ என்பது நவீன தமிழில் இயல்பாக இருந்து அதன் சட்ட மற்றும் உடைமை நுண்ணுணர்வைப் பாதுகாக்கிறது.
- source_word: לְיִשְׂרָאֵל
  choice: இஸ்ரவேலருக்கு
  rationale: ל முன்னிடைச்சொல் பெறுபவரைக் குறிக்கிறது. மக்களைக் குறிக்கும் இஸ்ரவேல் என்ற பெயர் தமிழில் இயல்பாகப் பன்மை மனித வடிவில் தரப்பட்டுள்ளது.
- source_word: כְּמַחְלְקֹתָם לְשִׁבְטֵיהֶם
  choice: அவர்களுடைய கோத்திரப் பிரிவுகளின்படி
  rationale: இரு எபிரெயத் தொடர்களும் நிலம் கோத்திர அமைப்பின்படி பிரிக்கப்பட்டதைச் சொல்கின்றன. தமிழில் தேவையற்ற மறுமொழியைத் தவிர்த்து இரண்டின் பொருளும் ஒருங்கிணைக்கப்பட்டுள்ளது.
- source_word: שָׁקְטָה מִמִּלְחָמָה
  choice: போர் ஓய்ந்து நாடு அமைதி பெற்றது
  rationale: שקט என்பது மோதலுக்குப் பிந்திய ஓய்வு அல்லது அமைதியைக் குறிக்கிறது. இயல்பான தமிழில் காரணத் தொடர்பை வெளிப்படுத்தும் இவ்வாக்கியம், எல்லாக் காலத்திற்குமான முழுமையான சமாதானம் என்று மிகைப்படுத்துவதில்லை.
theological_decisions:
- issue: ‘நாடு முழுவதையும்’ என்ற வெற்றிச் சுருக்கத்தின் பரப்பு
  choice: யோசுவா மேற்கொண்ட வெற்றியைச் சுருக்கமாகக் கூறும் எபிரெய வாசகத்தின் முழுமையான மொழி அப்படியே பாதுகாக்கப்பட்டுள்ளது.
  alternative: ஒவ்வொரு பகுதியும் உடனடியாகவும் முழுமையாகவும் குடியேற்றப்பட்டது என்று விளக்குவது; அல்லது இதை வெளிப்படையாக மிகைப்படுத்தல் என்று பெயரிடுவது.
  rationale: மூல உரை ஒரு கதைச்சுருக்கத்தை அளிக்கிறது. மீதமிருந்த பகுதிகளைப் பற்றிய பிற வசனங்களோடு உள்ள பதற்றத்தை மொழிபெயர்ப்பு அமைதியாகத் தீர்க்காமல், ‘நாடு முழுவதையும்’ என்ற கூற்றைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் வடிவமைக்கப்பட்டுள்ளது. ‘கோத்திரம்,’ ‘உரிமைச்சொத்து’ போன்ற சொற்கள் வரலாற்று நிலப் பகிர்வின் பொருளைத் தெளிவாகக் காக்கின்றன. எபிரெய மூலத்தின் இறுதிப் பகுதியில் உள்ள ‘நாடு’ எழுவாய் தமிழிலும் பாதுகாக்கப்பட்டுள்ளது.
