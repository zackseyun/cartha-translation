  source_fidelity: திருத்தம் தேவை. வַיִּקַּח என்பதன் அடிப்படைப் பொருளான ‘எடுத்துக்கொண்டார்’ என்பதற்குப் பதிலாக ‘கைப்பற்றினார்’ என்பது இராணுவ வெற்றியின் முறையைச் சற்றே வெளிப்படையாகச் சேர்க்கிறது. மேலும், தொடக்கத்தில் உள்ள ‘ஆகவே’ மூலத்தில் இல்லை. இறுதி வாக்கியத்தில் ‘போர் ஓய்ந்து’ என்பது ஏற்றுக்கொள்ளத்தக்க விளக்கமாக இருந்தாலும், மூலத்தின் ‘நாடு போரிலிருந்து ஓய்வுபெற்றது’ என்ற அமைப்பை நேரடியாகக் காப்பது சிறந்தது.
  naturalness: திருத்தப்பட்ட உரை நவீன நிலையான தமிழில் இயல்பாக உள்ளது. ‘சுதந்தரமாக’ என்பது இச்சூழலில் நிலத்தின் மரபுரிமைப் பங்கைக் குறிக்கிறது; ‘தங்கள் கோத்திரங்களுக்கான பங்கீடுகளின்படி’ என்பது எபிரெயத்தின் பிரிவுகளையும் கோத்திர அமைப்பையும் தெளிவாக வெளிப்படுத்துகிறது.
  terminology: யாவே, யோசுவா, மோசே, இஸ்ரவேலர், கோத்திரங்கள் ஆகிய பெயர்களும் வரலாற்று-சமயச் சொற்களும் சீராக உள்ளன. נַחֲלָהக்கு ‘சுதந்தரமாக’ பயன்படுத்தப்பட்டுள்ளது; இது சட்டவழி மரபுரிமை நிலப்பங்கின் பொருளை ‘உரிமைச்சொத்து’ என்பதைக் காட்டிலும் இயல்பாகக் கொண்டுவருகிறது.
