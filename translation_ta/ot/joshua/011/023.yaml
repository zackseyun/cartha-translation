revisions:
- from: 'ஆகவே யோசுவா, யாவே மோசேயிடம் கூறியிருந்த அனைத்தின்படியும், அந்த நாடு முழுவதையும்[a] கைப்பற்றினார். அதை இஸ்ரவேலருக்கு உரிமைச்சொத்தாக, அவர்களுடைய கோத்திரப் பிரிவுகளின்படி கொடுத்தார். போர் ஓய்ந்து நாடு அமைதி பெற்றது[b].


    [a] அல்லது, “அந்த நாடு அனைத்தையும்.” இச்சொற்றொடர் இங்கு விவரிக்கப்படும் நாட்டை யோசுவா கைப்பற்றியதைச் சுருக்கமாகக் கூறுகிறது.


    [b] எபிரெய மொழியில், “போரிலிருந்து நாடு ஓய்வுபெற்றது” என்றும் மொழிபெயர்க்கலாம். இது போருக்குப் பிந்திய ஓய்வையும் அமைதியையும் குறிக்கிறது.'
  to: யோசுவா அந்த நாடு முழுவதையும்[a], யாவே மோசேயிடம் கூறியிருந்த அனைத்தின்படியும், எடுத்துக்கொண்டார். அதை இஸ்ரவேலருக்குச் சுதந்தரமாக, தங்கள் கோத்திரங்களுக்கான பங்கீடுகளின்படி கொடுத்தார். நாடு போரிலிருந்து ஓய்வுபெற்றது[b].
  rationale: மூலத்தில் இல்லாத ‘ஆகவே’ நீக்கப்பட்டது. வַיִּקַּח என்பதன் குறைவான விளக்கமுடைய அடிப்படைப் பொருளைத் தக்கவைக்க ‘எடுத்துக்கொண்டார்’ பயன்படுத்தப்பட்டது. நַחֲלָהவின் மரபுரிமை நிலப்பங்கு உணர்வுக்காக ‘சுதந்தரமாக’ இடப்பட்டுள்ளது. இறுதி வாக்கியம் எபிரெய எழுவாய் மற்றும் ‘போரிலிருந்து ஓய்வு’ என்ற சொல்லமைப்புக்கு நெருக்கமாகத் திருத்தப்பட்டு, அதற்கேற்ற உண்மையான மாற்றுச் சொல்லாக்கம் அடிக்குறிப்பில் வழங்கப்பட்டுள்ளது.
