  register: நவீனச் செந்தமிழுக்கு நெருக்கமான, பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளக்கூடிய கண்ணியமான நடை. முதல் மற்றும் இரண்டாம் கூறுகளின் ஒரே வேர் சார்ந்த ‘எஞ்சு’ சொல் தேர்வு எபிரெய உரையின் மீதமிருத்தல் என்ற கருத்துத் தொடர்ச்சியைப் பாதுகாக்கிறது.
