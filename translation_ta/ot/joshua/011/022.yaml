source:
  edition: WLC
  text: לֹֽא נוֹתַ֣ר עֲנָקִ֔ים בְּ/אֶ֖רֶץ בְּנֵ֣י יִשְׂרָאֵ֑ל רַ֗ק בְּ/עַזָּ֛ה בְּ/גַ֥ת וּ/בְ/אַשְׁדּ֖וֹד נִשְׁאָֽרוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/011/022.yaml
  text: No Anakim were left in the land of the sons of Israel[a]; only in Gaza, Gath[b], and Ashdod did some remain.
translation:
  language: ta
  text: இஸ்ரவேல் மக்களின் நாட்டில் ஏனாக்கியர் யாரும் எஞ்சியிருக்கவில்லை; காசா, காத்து, அஸ்தோத் ஆகிய இடங்களில் மட்டும் சிலர் எஞ்சியிருந்தனர்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נוֹתַר
  choice: எஞ்சியிருக்கவில்லை
  rationale: நிஃபால் வடிவம் போர்களுக்குப் பின் எவரும் மீதியாக விடப்படாத விளைவு நிலையைக் குறிக்கிறது; தமிழில் இச்சொல் இயல்பாக அதைப் பிரதிபலிக்கிறது.
- source_word: עֲנָקִים
  choice: ஏனாக்கியர்
  rationale: இது ஓர் இனக்குழுவின் பெயர். விளக்கமாக விரிக்காமல் எபிரெயப் பெயரைத் தமிழில் ஒலிபெயர்ப்பது பொருத்தமானது.
- source_word: בְּאֶרֶץ בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்களின் நாட்டில்
  rationale: சொல்லளவில் ‘இஸ்ரவேலின் மகன்கள்’ என்றாலும், இங்கு சமூகத்தைக் குறிக்கும் வழக்குச் சொற்றொடர்; ‘இஸ்ரவேல் மக்கள்’ என்பது நவீனத் தமிழில் இயல்பாகவும் மூலத்தின் கூட்டுப்பொருளுக்கு உண்மையாகவும் உள்ளது.
- source_word: רַק
  choice: மட்டும்
  rationale: குறிப்பிட்ட நகரங்களை மட்டும் விதிவிலக்காகக் கட்டுப்படுத்திக் காட்டும் பொருளைத் தெளிவாகத் தருகிறது.
- source_word: בְּעַזָּה בְּגַת וּבְאַשְׁדּוֹד
  choice: காசா, காத்து, அஸ்தோத் ஆகிய இடங்களில்
  rationale: இடப்பெயர்கள் தமிழ் வேதாகம வழக்கிற்கு ஏற்றவாறு ஒலிபெயர்க்கப்பட்டுள்ளன; திரும்பத் திரும்ப வரும் முன்னிடைச்சொல் பட்டியலுக்குப் பின் ஒருமுறை இயல்பாக வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: נִשְׁאָרוּ
  choice: சிலர் எஞ்சியிருந்தனர்
  rationale: பன்மை வினையின் மறைமுக எழுவாய் ஏனாக்கியர். தமிழில் ‘சிலர்’ என்பதைச் சேர்ப்பது அந்தக் குழுவில் ஒரு பகுதியினர் மட்டும் அந்நகரங்களில் மீந்தனர் என்பதை இயல்பாகத் தெளிவுபடுத்துகிறது.
