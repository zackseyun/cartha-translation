  source_fidelity: எபிரெய மூலத்தின் மக்கள்-குழுப் பட்டியல், கிழக்கு/மேற்கு புவியியல் குறிப்பு, மலைநாடு, எர்மோன் மலையின் கீழ்ப்பகுதி, மிஸ்பா பிரதேசம் ஆகியவை துல்லியமாகப் பிரதிபலிக்கப்படுகின்றன. எபிரெய கூட்டொருமை இனப்பெயர்களைத் தமிழில் பன்மையாக வழங்குவது பொருளுக்கு ஏற்ப இயல்பானது. வசனம் முந்தைய வசனத்தின் வினைத் தொடரைச் சார்ந்ததால் «இடமும்» என்ற தொடரமைப்பு பொருத்தமானது.
  naturalness: நவீன தரத் தமிழில் வாசிப்பிற்கு இயல்பானதாக உள்ளது. இனப்பெயர்கள் மற்றும் இடப்பெயர்களின் ஒலிபெயர்ப்புகள் நிலையான வேதாகமத் தமிழ்ப் பயன்பாட்டோடு பொருந்துகின்றன. பட்டியல் அமைப்பும் தொடர்வசனத் தன்மையும் தெளிவாகக் காக்கப்பட்டுள்ளன.
  terminology: «கானானியர்கள்», «எமோரியர்கள்», «ஏத்தியர்கள்», «பெரிசியர்கள்», «எபூசியர்கள்», «ஏவியர்கள்», «எர்மோன்», «மிஸ்பா» ஆகிய பெயர்கள் ஏற்றவை. «மலைநாடு» הָהָרின் பிரதேசப் பொருளை நன்றாகத் தருகிறது. «எர்மோன் மலைக்குக் கீழே» என்பது תַּחַת חֶרְמוֹן என்பதன் இடவியல் பொருளை நியாயமாக வெளிப்படுத்துகிறது.
