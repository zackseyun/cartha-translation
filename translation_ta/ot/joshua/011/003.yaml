translation_notes:
  register: நவீன தரத் தமிழில், மரியாதையும் வாசிப்புத் தெளிவும் கொண்ட நடையில் அமைக்கப்பட்டுள்ளது. எபிரெய கூட்டொருமை இனப்பெயர்கள் தமிழின் இயல்புக்கு ஏற்ப பன்மையில் தரப்பட்டுள்ளன; வசனம் முந்தைய வசனத்தில் தொடங்கிய அனுப்புதல்/அழைப்பு பட்டியலின் தொடராக இருப்பதால் ‘இடமும்’ உருபு பயன்படுத்தப்பட்டுள்ளது.
