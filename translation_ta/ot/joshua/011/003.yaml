base_translation:
  language: en
  yaml_path: translation/ot/joshua/011/003.yaml
  text: the Canaanite in the east and in the west[a], and the Amorite, the Hittite, the Perizzite, and the Jebusite in the hill country, and the Hivite below Hermon in the land of Mizpah.
translation:
  language: ta
  text: கிழக்கிலும் மேற்கிலும் இருந்த கானானியர்களிடமும்,[a] மலைநாட்டில் இருந்த எமோரியர்கள், ஏத்தியர்கள், பெரிசியர்கள், எபூசியர்கள் ஆகியோரிடமும், எர்மோன் மலைக்குக் கீழே மிஸ்பா நாட்டில் இருந்த ஏவியர்களிடமும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொற்படியாக, “கிழக்கிலிருந்தும் கடலிலிருந்தும்.” இங்கு “கடல்” என்பது மேற்குத் திசையைக் குறிக்கும் புவியியல் சொல்லாக இருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכְּנַעֲנִי
  choice: கானானியர்கள்
  rationale: எபிரெயத்தில் ஒருமை இனப்பெயர் கூட்டாக ஒரு மக்கள் குழுவைக் குறிக்கிறது; தமிழில் பன்மை இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: מִמִּזְרָח וּמִיָּם
  choice: கிழக்கிலும் மேற்கிலும்
  rationale: முன்னொட்டு சொற்படியாக ‘இருந்து’ எனப் பொருள்படலாம்; இங்கு புவியியல் இருப்பிடத்தைச் சுட்டுகிறது. ‘கடல்’ என்பது கானான் நாட்டின் புவியியலில் மேற்குத் திசையைக் குறிக்கும் வழக்கு.
- source_word: הָאֱמֹרִי וְהַחִתִּי וְהַפְּרִזִּי וְהַיְבוּסִי
  choice: எமோரியர்கள், ஏத்தியர்கள், பெரிசியர்கள், எபூசியர்கள்
  rationale: ஒவ்வொரு எபிரெய ஒருமை இனப்பெயரும் கூட்டுப் பொருளுடையது; தமிழில் மக்கள் குழுக்களைப் பன்மையில் வழங்குவது இயல்பு.
- source_word: בָּהָר
  choice: மலைநாட்டில்
  rationale: இது தனி மலையைக் காட்டிலும் உயர்நிலப் பிரதேசத்தைச் சுட்டுகிறது; ‘மலைநாடு’ இயல்பான புவியியல் மொழிபெயர்ப்பு.
- source_word: הַחִוִּי
  choice: ஏவியர்கள்
  rationale: கூட்டுப் பொருளுடைய ஒருமை இனப்பெயர் தமிழில் இயல்பாகப் பன்மையில் தரப்பட்டுள்ளது.
- source_word: תַּחַת חֶרְמוֹן
  choice: எர்மோன் மலைக்குக் கீழே
  rationale: תַּחַת இங்கு எர்மோனின் கீழ்ப்பகுதி அல்லது அடிவாரத்தைச் சார்ந்த இடத்தைக் குறிக்கிறது; ‘மலை’ என்பது தமிழில் இடத்தைத் தெளிவுபடுத்தும் இயல்பான சேர்ப்பு.
- source_word: בְּאֶרֶץ הַמִּצְפָּה
  choice: மிஸ்பா நாட்டில்
  rationale: אֶרֶץ ஒரு நிலப்பகுதி அல்லது பிரதேசத்தைக் குறிக்கிறது; மிஸ்பா இடப்பெயராக ஒலிபெயர்க்கப்பட்டுள்ளது.
