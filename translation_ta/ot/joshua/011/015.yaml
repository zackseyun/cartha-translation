base_translation:
  language: en
  yaml_path: translation/ot/joshua/011/015.yaml
  text: Just as Yahweh had commanded Moses his servant[a], so Moses commanded Joshua, and so Joshua did. He left nothing undone of all that Yahweh had commanded Moses.
translation:
  language: ta
  text: யாவே தம் ஊழியரான மோசேக்குக் கட்டளையிட்டபடியே, மோசே யோசுவாவுக்குக் கட்டளையிட்டார்; யோசுவாவும் அவ்வாறே செய்தார். யாவே மோசேக்குக் கட்டளையிட்ட எல்லாவற்றிலும் யோசுவா எதையும் விட்டுவிடவில்லை.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யாவே மோசேக்குக் கட்டளையிட்ட எல்லாவற்றிலிருந்தும் யோசுவா எதையும் நீக்கவில்லை.” எபிரெய மரபுத்தொடரின் சொல்லுக்குச் சொல் பொருள், “அவர் யாவே மோசேக்குக் கட்டளையிட்ட எல்லாவற்றிலிருந்தும் ஒரு காரியத்தையும் அகற்றவில்லை” என்பதாகும்.
    reason: எபிரெய לֹא הֵסִיר דָּבָר מִכֹּל அֲשֶׁר என்ற மரபுத்தொடரின் நேரடிப் பொருளையும் இயல்பான மாற்று மொழிபெயர்ப்பையும் பதிவு செய்கிறது.
lexical_decisions:
- source_word: כַּאֲשֶׁר
  choice: கட்டளையிட்டபடியே
  rationale: முன்னர் யாவே மோசேக்குக் கட்டளையிட்டதற்கும், மோசே யோசுவாவுக்குக் கட்டளையிட்டதற்கும் இடையிலான துல்லியமான ஒத்திசைவை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: צִוָּה
  choice: கட்டளையிட்டார்
  rationale: அதிகாரபூர்வமான ஆணையைச் சுட்டும் வினைச்சொல்; வசனத்தில் காணப்படும் அதிகாரத் தொடரைத் தெளிவாகப் பேணுகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தலைப்புப் பெயரை மாற்றாகப் பயன்படுத்தாமல், எபிரெயத் தெய்வீகப் பெயரான יהוה-ஐ தமிழில் ஒலிபெயர்க்கிறது.
- source_word: עַבְדּוֹ
  choice: தம் ஊழியரான
  rationale: மோசேயைக் குறித்த மரியாதைக்குரிய உடன்படிக்கைச் சூழலில் עבד என்பதன் ‘ஊழியர்’ பொருள் இயல்பாக அமைகிறது; அடிமை நிலையைக் தேவையின்றி முன்னிறுத்துவதில்லை.
- source_word: כֵּן
  choice: அவ்வாறே
  rationale: கட்டளைக்கும் அதை நிறைவேற்றிய செயலுக்கும் இடையிலான ஒத்திசைவைச் சுருக்கமாகவும் இயல்பாகவும் காட்டுகிறது.
- source_word: עָשָׂה
  choice: செய்தார்
  rationale: எபிரெய வினையின் சுருக்கத்தையும் பரந்த பொருளையும் பேணுகிறது; அடுத்த வாக்கியம் கீழ்ப்படிதலின் முழுமையை விளக்குகிறது.
- source_word: לֹא הֵסִיר דָּבָר
  choice: ஒன்றையும் அவர் விட்டுவிடவில்லை
  rationale: சொல்லுக்குச் சொல் ‘ஒரு காரியத்தையும் அகற்றவில்லை’ என்ற எபிரெய மரபுத்தொடர், இச்சூழலில் கட்டளையிடப்பட்ட எதையும் புறக்கணிக்காமல் முழுமையாகச் செய்தார் என்பதைக் குறிக்கிறது. ‘விட்டுவிடவில்லை’ என்பது அந்தப் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: מִכֹּל אֲשֶׁר
  choice: கட்டளையிட்ட அனைத்திலும்
  rationale: கட்டளையிடப்பட்டவற்றின் முழுத் தொகுதியையும் சுட்டுகிறது; ‘ஒன்றையும் ... விட்டுவிடவில்லை’ என்பதோடு தமிழில் இயல்பாக இணைகிறது.
- source_word: אֶת
  choice: '[தனியாக மொழிபெயர்க்கப்படவில்லை]'
  rationale: இது தனிப்பட்ட சொற்பொருள் இல்லாத நேர்செயப்படுபொருள் குறியீடு.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலவசனம் יהוה என்ற தனிப்பட்ட தெய்வீகப் பெயரையே பயன்படுத்துகிறது. ‘யாவே’ என்பது அதை ஒரு பட்டப்பெயரால் மாற்றாமல், தமிழில் நேரடியாக ஒலிபெயர்க்கிறது.
- issue: மோசேயின் עבד என்ற அடையாளம்
  choice: ஊழியர்
  alternative: அடிமை
  rationale: இங்கு மோசேயின் கடவுளுக்குரிய மரியாதைமிக்க சேவை நிலையே முன்னிலைப்படுகிறது; சட்டரீதியான அடிமைத்தனத்தை வலியுறுத்துவது சூழலுக்குப் பொருந்தாது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையில் மரியாதையும் சுருக்கமும் பேணப்பட்டுள்ளன. மோசே மற்றும் யோசுவாவைக் குறிக்க மரியாதைப் பன்மை வினைமுற்றுகள் பயன்படுத்தப்பட்டுள்ளன; யாவேயைக் குறிக்கும் ‘தம்’ தற்சுட்டு வடிவம் உறவைத் தெளிவாக்குகிறது. எபிரெய உரையின் இருமுறை வரும் ஒத்திசைவு அமைப்பு ‘படியே / அவ்வாறே’ மூலம் காக்கப்பட்டுள்ளது.
