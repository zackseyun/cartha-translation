  text: וַ/יִּתְּנֵ֨/ם יְהוָ֥ה בְּ/יַֽד יִשְׂרָאֵל֮ וַ/יַּכּוּ/ם֒ וַֽ/יִּרְדְּפ֞וּ/ם עַד צִיד֣וֹן רַבָּ֗ה וְ/עַד֙ מִשְׂרְפ֣וֹת מַ֔יִם וְ/עַד בִּקְעַ֥ת מִצְפֶּ֖ה מִזְרָ֑חָ/ה וַ/יַּכֻּ֕/ם עַד בִּלְתִּ֥י הִשְׁאִֽיר לָ/הֶ֖ם שָׂרִֽיד־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/011/008.yaml
  text: And Yahweh gave them into the hand of Israel[a], and they struck them down and pursued them as far as Great Sidon and as far as Misrephoth-maim and as far as the Valley of Mizpeh to the east[b]; and they struck them down until they had left them no survivor.
translation:
  language: ta
  text: யாவே அவர்களை இஸ்ரவேலின் கையில் ஒப்புக்கொடுத்தார். இஸ்ரவேலர் அவர்களைத் தாக்கி வீழ்த்தி, பெரிய சீதோன் வரையிலும், மிஸ்ரெபோத்-மாயிம்[a] வரையிலும், கிழக்கிலுள்ள மிஸ்பே பள்ளத்தாக்கு வரையிலும் துரத்திச் சென்றார்கள். அவர்களில் உயிர்பிழைத்தவர் எவரும் எஞ்சாதவரை அவர்களைத் தாக்கி வீழ்த்தினார்கள்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “மிஸ்ரெபோத்-மாயிம்” என்பது ஓர் இடப்பெயர்; எபிரெயத்தில் இதற்கு “நீரின் எரிப்புகள்” என்ற பொருள் இருக்கக்கூடும்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில் “விடுதல்” என்னும் வினை முடிவிலி வடிவில் உள்ளது; அதைச் செய்பவர் வெளிப்படையாகக் குறிப்பிடப்படவில்லை. இது இஸ்ரவேல் மக்களைக் கூட்டாகவோ, யோசுவாவைப் பிரதிநிதியாகவோ குறிக்கலாம்.
    reason: source_ambiguity
lexical_decisions:
- source_word: וַיִּתְּנֵם ... בְּיַד יִשְׂרָאֵל
  choice: அவர்களை இஸ்ரவேலின் கையில் ஒப்புக்கொடுத்தார்
  rationale: போர்ச் சூழலில் נתן ... ביד என்பது ஒருவரை மற்றொருவரின் அதிகாரத்திற்குள் ஒப்புக்கொடுப்பதைக் குறிக்கும். ‘கையில்’ என்ற மூல உருவகத்தையும் தமிழில் இயல்பாகப் பாதுகாக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய தனிப்பெயரான יהוה என்பதை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் பரவலாகப் புரியக்கூடிய ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: וַיַּכּוּם / וַיַּכֻּם
  choice: அவர்களை வெட்டிவீழ்த்தி / வெட்டிவீழ்த்தினார்கள்
  rationale: போர்ச் சூழலில் נכה தாக்கி வீழ்த்துவதையும் கொல்லுவதையும் குறிக்கலாம். ‘வெட்டிவீழ்த்தினர்’ அதன் வலிமையையும் இரு இடங்களிலுள்ள மறுபயன்பாட்டையும் பாதுகாக்கிறது.
- source_word: וַיִּרְדְּפוּם
  choice: அவர்களைத் துரத்திச் சென்றார்கள்
  rationale: רדף என்பதன் போர்ச் சூழலுக்குரிய நேரடியான, இயல்பான தமிழ் இணை.
- source_word: צִידוֹן רַבָּה
  choice: பெரிய சீதோன்
  rationale: רבה நகரப்பெயரைத் தகுதிப்படுத்துவதால், சொல்லமைப்பைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: מִשְׂרְפוֹת מַיִם
  choice: மிஸ்ரெபோத்-மாயிம்
  rationale: இது ஓர் இடப்பெயராக இருப்பதால் ஒலிபெயர்க்கப்படுகிறது; அதன் சாத்தியமான சொற்பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: בִּקְעַת מִצְפֶּה מִזְרָחָה
  choice: கிழக்கிலுள்ள மிஸ்பே பள்ளத்தாக்கு
  rationale: בקעה என்பது அகன்ற பள்ளத்தாக்கு அல்லது பள்ளத்தாக்குச் சமவெளியைக் குறிக்கும்; מזרחה இங்கு கிழக்குத் திசை அல்லது கிழக்குப் பகுதியைக் காட்டுகிறது.
- source_word: עַד בִּלְתִּי הִשְׁאִיר לָהֶם שָׂרִיד
  choice: அவர்களில் உயிர்பிழைத்தவர் ஒருவரையும் மீதியாக விடாதவரை
  rationale: ‘உயிர்தப்பிய எச்சம் எதையும் விடாமை’ என்ற பொருளை இயல்பான தமிழில் தருகிறது. எபிரெய முடிவிலி வினை வடிவில் செய்பவர் வெளிப்படையாகக் குறிப்பிடப்படாததால், தமிழ் தொடரிலும் தனிப்பட்ட ‘அவன்’ அல்லது ‘அவர்கள்’ என்பதைச் சேர்க்காமல் ambiguity பாதுகாக்கப்படுகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் பொதுப்பட்டம் அல்லாமல் இறைவனின் தனிப்பெயர் இடம்பெறுகிறது. ஆகவே பட்டத்தால் மாற்றாமல் ஒலிபெயர்க்கப்படுகிறது.
- issue: இறுதித் தொடரில் உயிர்பிழைத்தவர்களை மீதியாக விட்டவர் யார்?
  choice: செய்பவரைத் தனியாகச் சுட்டாமல் ‘மீதியாக விடாதவரை’
  alternative: ‘அவன் ஒருவரையும் மீதியாக விடாதவரை’ அல்லது ‘அவர்கள் ஒருவரையும் மீதியாக விடாதவரை’
  rationale: השאיר என்பது இங்கு முடிவிலி வினை வடிவம்; அதன் செய்பவர் வெளிப்படையாக இல்லை. சூழல் இஸ்ரவேலரை கூட்டாகக் குறிக்கலாம்; யோசுவாவையும் பிரதிநிதியாகக் கொள்ளலாம். ஒரு விளக்கத்தை மட்டும் மூலத்தில் இல்லாத அளவுக்கு உறுதிப்படுத்தாமல் விடப்படுகிறது.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான தமிழில் வரலாற்றுப் போர்விவரத்தின் தீவிரம் தணிக்கப்படாமல் வழங்கப்பட்டுள்ளது. இடப்பெயர்கள் தமிழ் ஒலியமைப்புக்கேற்ப ஒலிபெயர்க்கப்பட்டுள்ளன; நீண்ட எபிரெய வாக்கியம் வாசிப்புத் தெளிவுக்காக மூன்று வாக்கியங்களாகப் பிரிக்கப்பட்டுள்ளது.
