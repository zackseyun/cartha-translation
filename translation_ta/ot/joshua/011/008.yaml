- from: யாவே அவர்களை இஸ்ரவேலின் கையில் ஒப்புக்கொடுத்தார். இஸ்ரவேலர் அவர்களை வெட்டிவீழ்த்தி, பெரிய சீதோன்வரையிலும், மிஸ்ரெபோத்-மாயிம்[a] வரையிலும், கிழக்கிலுள்ள மிஸ்பே பள்ளத்தாக்குவரையிலும் துரத்திச் சென்றார்கள். அவர்களில் உயிர்பிழைத்தவர் ஒருவரையும் மீதியாக விடாதவரை அவர்களை வெட்டிவீழ்த்தினார்கள்.[b]
  to: யாவே அவர்களை இஸ்ரவேலின் கையில் ஒப்புக்கொடுத்தார். இஸ்ரவேலர் அவர்களைத் தாக்கி வீழ்த்தி, பெரிய சீதோன் வரையிலும், மிஸ்ரெபோத்-மாயிம்[a] வரையிலும், கிழக்கிலுள்ள மிஸ்பே பள்ளத்தாக்கு வரையிலும் துரத்திச் சென்றார்கள். அவர்களில் உயிர்பிழைத்தவர் எவரும் எஞ்சாதவரை அவர்களைத் தாக்கி வீழ்த்தினார்கள்.[b]
  rationale: The revision removes the unsupported implication of cutting from the two occurrences of the battle verb and recasts the final result clause so that it does not over-specify the actor of the Hebrew infinitive construction. It retains the verse's force, names, geographical sequence, divine name, and the two correctly placed footnote anchors.
