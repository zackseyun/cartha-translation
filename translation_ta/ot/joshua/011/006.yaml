  text: וַ/יֹּ֨אמֶר יְהוָ֣ה אֶל יְהוֹשֻׁעַ֮ אַל תִּירָ֣א מִ/פְּנֵי/הֶם֒ כִּֽי מָחָ֞ר כָּ/עֵ֣ת הַ/זֹּ֗את אָנֹכִ֞י נֹתֵ֧ן אֶת כֻּלָּ֛/ם חֲלָלִ֖ים לִ/פְנֵ֣י יִשְׂרָאֵ֑ל אֶת סוּסֵי/הֶ֣ם תְּעַקֵּ֔ר וְ/אֶת מַרְכְּבֹתֵי/הֶ֖ם תִּשְׂרֹ֥ף בָּ/אֵֽשׁ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/011/006.yaml
  text: And Yahweh said to Joshua[a], “Do not fear them, for tomorrow at this time I am giving all of them over before Israel as slain men[b]. You shall hamstring their horses and burn their chariots with fire.”
translation:
  language: ta
  text: யாவே யோசுவாவிடம், “அவர்களைப் பார்த்துப் பயப்படாதே; ஏனெனில், நாளை ஏறக்குறைய இதே நேரத்தில்[a] அவர்கள் அனைவரையும் இஸ்ரவேலுக்கு முன்பாகப் போரில் கொல்லப்பட்டவர்களாக ஒப்புக்கொடுக்கிறேன்.[b] அவர்களுடைய குதிரைகளின் தொடைநரம்புகளை வெட்டு; அவர்களுடைய போர்த் தேர்களை நெருப்பால் எரித்துவிடு” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நாளை இதே நேரத்தில்.”
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில், “அவர்கள் அனைவரையும் இஸ்ரவேலுக்கு முன்பாகப் போரில் கொல்லப்பட்டவர்களாக ஒப்புக்கொடுக்கிறேன்”; அதாவது, இஸ்ரவேல் அவர்களை வீழ்த்தும்படி அவர்களை ஒப்புக்கொடுக்கிறேன்.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: யெகோவா
  rationale: தெய்வீகப் பெயரைப் பொதுப்பட்டமாக மாற்றாமல், தமிழில் நீண்டகாலமாக அறியப்பட்ட தனிப்பெயர் வடிவில் தருகிறது.
- source_word: אַל תִּירָא מִפְּנֵיהֶם
  choice: அவர்களுக்குப் பயப்படாதே
  rationale: எபிரெயச் சொற்றொடரின் காரண/எதிர்நிலை உணர்வை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: מָחָר כָּעֵת הַזֹּאת
  choice: நாளை இதே நேரத்தில்
  rationale: அடுத்த நாளின் ஏறத்தாழ இதே நேரத்தைச் சுட்டும் எபிரெய காலச் சொற்றொடருக்கு இயல்பான இணை.
- source_word: אָנֹכִי נֹתֵן
  choice: ஒப்புக்கொடுப்பேன்
  rationale: பங்கேற்பு வினையின் உறுதியான, நெருங்கிவரும் செயல் உணர்வை தமிழ் வாக்குறுதி சூழலில் இயல்பான எதிர்கால வடிவில் தருகிறது.
- source_word: אֶת כֻּלָּם חֲלָלִים לִפְנֵי יִשְׂרָאֵל
  choice: அவர்கள் அனைவரையும் இஸ்ரவேலுக்கு முன்பாகப் போரில் கொல்லப்பட்டவர்களாக ஒப்புக்கொடுப்பேன்
  rationale: חֲלָלִים என்பதன் போரில் வீழ்த்தப்பட்டோர் என்ற குறிப்பையும், לִפְנֵי יִשְׂרָאֵל என்பதன் இடவியல் உருவகத்தையும் பாதுகாக்கிறது.
- source_word: תְּעַקֵּר
  choice: கால் நரம்புகளை வெட்டி முடமாக்கி
  rationale: குதிரைகளைப் போருக்குப் பயன்படாதவாறு நரம்புகளை வெட்டுவதைக் பொதுவாசகர் தெளிவாகப் புரிந்துகொள்ளும் வகையில் கூறுகிறது.
- source_word: מַרְכְּבֹתֵיהֶם
  choice: அவர்களுடைய தேர்களை
  rationale: போர்த் தேர்களைக் குறிக்கும் சொல்லுக்கான தெளிவான, வழக்கமான தமிழ் இணை.
- source_word: תִּשְׂרֹף בָּאֵשׁ
  choice: நெருப்பால் எரித்துவிடு
  rationale: மூலத்தில் வெளிப்படையாக உள்ள ‘நெருப்பால்’ என்ற வலியுறுத்தலைத் தக்கவைக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரை மொழிபெயர்த்தல்
  choice: யெகோவா
  alternative: யாவே
  rationale: மூலத்தில் உள்ள தனிப்பெயரை ‘கர்த்தர்’ போன்ற பட்டமாக மாற்றாமல் பாதுகாக்கிறது; தமிழில் பொதுவாக அறியப்பட்ட வடிவைத் தேர்ந்தெடுக்கிறது.
- issue: எதிரிகள் கொல்லப்படுதல் குறித்த கடவுளின் கூற்றின் செயற்பாட்டு வடிவம்
  choice: போரில் கொல்லப்பட்டவர்களாக ஒப்புக்கொடுப்பேன்
  alternative: அவர்களை நான் கொன்றுபோடுவேன்
  rationale: נֹתֵן ... חֲלָלִים என்ற மூலத்தின் ‘ஒப்புக்கொடுத்தல்’ உருவகத்தைப் பாதுகாத்து, கடவுள் நேரடியாகக் கொல்வதாக உரையை விட அதிகமாகத் தீர்மானிப்பதைத் தவிர்க்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; கண்ணியமான நேரடி உரை. போரியல் சொற்கள் பொதுவாசகருக்குப் புரியும் வகையில் தெளிவாக்கப்பட்டுள்ளன; மூலத்தின் உருவகங்களும் செயற்பாட்டு நுட்பமும் இயன்றவரை பாதுகாக்கப்பட்டுள்ளன.
