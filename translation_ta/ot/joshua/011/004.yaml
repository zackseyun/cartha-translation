  yaml_path: translation/ot/joshua/011/004.yaml
  text: They came out[a], they and all their camps with them, a great people, as numerous as the sand that is on the seashore[b], with very many horses and chariots.
translation:
  language: ta
  text: அவர்கள் தங்கள் எல்லாப் படைமுகாம்களோடும் புறப்பட்டு வந்தார்கள். அவர்கள் கடற்கரை மணலைப்போல் எண்ணிக்கையில் மிகுதியான பெருந்திரளான மக்கள்; குதிரைகளும் தேர்களும் மிக ஏராளமாக இருந்தன.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּצְאוּ
  choice: புறப்பட்டு வந்தன
  rationale: יצא என்பது வெளியே புறப்படுதலைக் குறிக்கிறது. சூழலில் அரசர்களும் அவர்களுடைய படைகளும் ஒன்றுகூடிப் புறப்பட்டு வருவதால், தமிழில் இயல்பாக ‘புறப்பட்டு வந்தன’ என வழங்கப்பட்டது; ‘அணிவகுத்து வந்தன’ போன்ற கூடுதல் இராணுவ நுட்பம் சேர்க்கப்படவில்லை.
- source_word: מַחֲנֵיהֶם
  choice: அவர்களுடைய எல்லாப் படைமுகாம்களும்
  rationale: מַחֲנֶה என்பதற்கு முகாம், படைமுகாம், அல்லது அந்த முகாமிலுள்ள படை என்ற பொருள்கள் உண்டு. எபிரெய உருவகத்தைத் தக்கவைத்தும் இராணுவச் சூழலைத் தெளிவாக்கியும் ‘படைமுகாம்கள்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: עַם רָב
  choice: மிகப் பெருந்திரளான மக்கள்
  rationale: עַם என்பது ‘மக்கள்’ என்றும் רָב இங்கு எண்ணிக்கையின் பெருக்கத்தையும் குறிக்கிறது. ‘மக்கள்’ என்ற கூட்டுப்பெயரைத் தக்கவைத்து, அதன் அளவை இயல்பான தமிழில் ‘மிகப் பெருந்திரளான’ என வெளிப்படுத்துகிறது.
- source_word: כַּחוֹל אֲשֶׁר עַל שְׂפַת הַיָּם לָרֹב
  choice: எண்ணிக்கையில் கடற்கரை மணலைப்போல்
  rationale: கடற்கரை மணல் என்ற எபிரெய உவமை அப்படியே தக்கவைக்கப்படுகிறது. לָרֹב காட்டும் எண்ணிக்கைப் பெருக்கத்தைத் தமிழில் தெளிவாக்க ‘எண்ணிக்கையில்’ சேர்க்கப்பட்டது.
- source_word: סוּס
  choice: குதிரைகள்
  rationale: எபிரெயில் ஒருமையாக இருந்தாலும் இது தொகுதிப் பொருளுடைய ஒருமை; தமிழில் இயல்பாகப் பன்மை பயன்படுத்தப்படுகிறது.
- source_word: רֶכֶב
  choice: தேர்கள்
  rationale: רֶכֶב என்பது தேர்கள் அல்லது தேர்ப்படையைக் குறிக்கலாம். இங்கு தெளிவான, நேரடியான ‘தேர்கள்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: רַב מְאֹד
  choice: மிக ஏராளமாக
  rationale: குதிரைகளும் தேர்களும் மிகுந்த எண்ணிக்கையில் இருந்ததை வலியுறுத்தும் சொற்றொடரை நவீனத் தமிழில் இயல்பாகவும் வலிமையுடனும் வழங்குகிறது.
