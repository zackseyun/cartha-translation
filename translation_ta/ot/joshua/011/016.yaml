- from: 'ஆகவே யோசுவா இந்த நாடு முழுவதையும் கைப்பற்றினார்: மலைநாடு, நெகேப் முழுவதும், கோசேன் நாடு[c] முழுவதும், தாழ்நிலம்[a], அரபா[b], இஸ்ரவேலின் மலைநாடு, அதன் தாழ்நிலம் ஆகியவற்றைக் கைப்பற்றினார்.'
  to: யோசுவா இந்த நிலப்பகுதி முழுவதையும்—மலைநாடு, நெகேப் முழுவதும், கோசேன் நாடு[c] முழுவதும், தாழ்நிலம்[a], அரபா[b], இஸ்ரவேலின் மலைநாடு, அதன் தாழ்நிலம் ஆகியவற்றை—கைப்பற்றினார்.
  rationale: மூலத்தில் ஒருமுறை மட்டுமே உள்ள வினைச்சொல் தமிழிலும் ஒருமுறை மட்டுமே வருமாறு வாக்கியம் மறுசீரமைக்கப்பட்டது. பட்டியலிடப்படும் பகுதிகளின் தொகுப்பைத் தெளிவாகச் சுட்ட ‘இந்த நிலப்பகுதி முழுவதையும்’ பயன்படுத்தப்பட்டது. பொருள், புவியியல் பெயர்கள், மற்றும் அடிக்குறிப்பு இணைப்புகள் அனைத்தும் பாதுகாக்கப்பட்டன; அடிக்குறிப்பு a-இல் பெயரொலிப்பும் மொழிபெயர்ப்பும் வேறுபடுத்தித் துல்லியப்படுத்தப்பட்டது.
