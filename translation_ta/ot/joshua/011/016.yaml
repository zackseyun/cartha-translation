  text: וַ/יִּקַּ֨ח יְהוֹשֻׁ֜עַ אֶת כָּל הָ/אָ֣רֶץ הַ/זֹּ֗את הָ/הָ֤ר וְ/אֶת כָּל הַ/נֶּ֨גֶב֙ וְ/אֵת֙ כָּל אֶ֣רֶץ הַ/גֹּ֔שֶׁן וְ/אֶת הַ/שְּׁפֵלָ֖ה וְ/אֶת הָ/עֲרָבָ֑ה וְ/אֶת הַ֥ר יִשְׂרָאֵ֖ל וּ/שְׁפֵלָתֹֽ/ה־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/011/016.yaml
  text: 'So Joshua took all this land: the hill country[a], all the Negev, all the land of Goshen, the lowland, the Arabah, the hill country of Israel[c][b], and its lowland.'
translation:
  language: ta
  text: யோசுவா இந்த நிலப்பகுதி முழுவதையும்—மலைநாடு, நெகேப் முழுவதும், கோசேன் நாடு[c] முழுவதும், தாழ்நிலம்[a], அரபா[b], இஸ்ரவேலின் மலைநாடு, அதன் தாழ்நிலம் ஆகியவற்றை—கைப்பற்றினார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘தாழ்நிலம்’ என்பதற்குப் பதிலாக எபிரெயப் பிரதேசப்பெயரான ‘ஷெஃபெலா’ என்பதையும் பயன்படுத்தலாம். எபிரெயச் சொல் மத்திய மலைநாட்டுக்கும் கடற்கரைச் சமவெளிக்கும் இடையிலுள்ள தாழ்ந்த குன்றுப்பகுதியைக் குறிக்கிறது; வசனத்தின் இறுதியிலும் இதே சொல் வருகிறது.
    reason: lexical_alternative
  - marker: b
    text: ‘அரபா’ என்பது ஒரு பிரதேசப் பெயர். இதைச் சிலர் சூழலுக்கேற்ப ‘யோர்தான் பள்ளத்தாக்கு’ அல்லது ‘பாலைவனச் சமவெளி’ என்று பொருள் விளக்கி மொழிபெயர்க்கின்றனர்.
    reason: lexical_alternative
  - marker: c
    text: இங்குள்ள ‘கோசேன் நாடு’ கானானிலிருந்த ஒரு பிரதேசத்தைக் குறிக்கிறது; இது எகிப்திலிருந்த கோசேன் பிரதேசம் என்று அவசியமாகக் கொள்ள வேண்டியதில்லை.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּקַּח
  choice: கைப்பற்றினார்
  rationale: לקח என்பதன் அடிப்படைப் பொருள் ‘எடுத்துக்கொள்’ என்பதாக இருந்தாலும், இங்கு போர்வெற்றியின் தொகுப்புரையில் ஒரு நாட்டைத் தன் கட்டுப்பாட்டுக்குள் கொண்டுவருவதைக் குறிக்கிறது. எனவே நவீனத் தமிழில் இயல்பான ‘கைப்பற்றினார்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: כָּל הָאָרֶץ הַזֹּאת
  choice: இந்த நாடு முழுவதையும்
  rationale: אֶרֶץ என்பது ‘நாடு,’ ‘நிலம்,’ அல்லது ‘பிரதேசம்’ எனப் பொருள்படலாம். தொடர்ந்து பல நிலப்பகுதிகள் பட்டியலிடப்படுவதால் ‘இந்த நாடு முழுவதையும்’ என்பது சுட்டுப்பெயரின் வலிமையையும் மொத்தப் பரப்பையும் தெளிவாகக் காட்டுகிறது.
- source_word: הָהָר
  choice: மலைநாடு
  rationale: இங்கு தனித்தனி மலைகளை அல்லாமல் உயர்நிலப் பிரதேசத்தைக் குறிக்கும் புவியியல் பயன்பாடு உள்ளது. ‘மலைநாடு’ சுருக்கமாகவும் இயல்பாகவும் உள்ளது.
- source_word: הַנֶּגֶב
  choice: நெகேப்
  rationale: இது வெறுமனே ‘தெற்கு’ என்பதைக் காட்டிலும் ஒரு குறிப்பிட்ட புவியியல் பிரதேசத்தின் பெயராக வருகிறது. ஆகவே பெயரொலிப்பு தக்கவைக்கப்பட்டது.
- source_word: אֶרֶץ הַגֹּשֶׁן
  choice: கோசேன் நாடு
  rationale: எபிரெயக் கட்டமைப்பை இயல்பான தமிழில் நேரடியாக வழங்குகிறது; அது எகிப்திலுள்ள கோசேன்தான் என்று முதன்மை உரை தீர்மானிப்பதில்லை.
- source_word: הַשְּׁפֵלָה
  choice: தாழ்நிலம்
  rationale: மத்திய மலைநாட்டுக்கும் கடற்கரைச் சமவெளிக்கும் இடையிலுள்ள தாழ்ந்த குன்றுப்பகுதியைக் குறிக்கும் பிரதேசச் சொல். வாசகருக்கு உடனே புரியும் வகையில் பொருள் மொழிபெயர்க்கப்பட்டது; குறிப்பிட்ட பிரதேசப் பெயரான ‘ஷெஃபெலா’ அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: הָעֲרָבָה
  choice: அரபா
  rationale: இது ஒரு குறிப்பிட்ட நீண்ட பள்ளத்தாக்குப் பிரதேசத்தைக் குறிக்கும் புவியியல் பெயராகப் பயன்படுவதால், ‘யோர்தான் பள்ளத்தாக்கு’ என்று வரம்புபடுத்தாமல் பெயரொலிப்பு தக்கவைக்கப்பட்டது.
- source_word: הַר יִשְׂרָאֵל
  choice: இஸ்ரவேலின் மலைநாடு
  rationale: הָהָר என்பதற்கான அதே பிரதேசப் பொருளைத் தக்கவைத்து, எபிரெய இணைப்பை இயல்பான தமிழில் வழங்குகிறது.
- source_word: וּשְׁפֵלָתוֹ
  choice: அதன் தாழ்நிலம்
  rationale: மூன்றாம் நபர் ஆண்பால் ஒருமை பின்னொட்டு முன்வரும் ‘இஸ்ரவேலின் மலைநாடு’ என்பதையே இயல்பாகச் சுட்டுகிறது. உயர்நிலம்–தாழ்நிலம் என்ற புவியியல் இணைப்பும் தக்கவைக்கப்படுகிறது.
