translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் அதேவேளையில் வேதாகம வரலாற்றுரைக்கு ஏற்ற கண்ணியமான நடை பயன்படுத்தப்பட்டது. ‘நெகேப்,’ ‘அரபா’ ஆகிய அங்கீகரிக்கப்பட்ட புவியியல் பெயர்கள் பெயரொலிப்பாகவும், הָהָר மற்றும் הַשְּׁפֵלָה போன்ற நிலவியல் சொற்கள் புரியத்தக்க தமிழ்ச் சொற்களாகவும் வழங்கப்பட்டன. எபிரெய மூலத்தில் ஒரே வாக்கியத்தில் וַיִּקַּח ஒருமுறை மட்டுமே இருந்தாலும், நீண்ட பட்டியலுக்குப் பின் தமிழில் வாக்கியத் தொடர்பைத் தெளிவாக்க ‘கைப்பற்றினார்’ மீண்டும் இடப்பட்டது.
