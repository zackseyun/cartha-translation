  yaml_path: translation/ot/joshua/011/018.yaml
  text: Joshua made war against all these kings for many days[a].
translation:
  language: ta
  text: யோசுவா இந்த அரசர்கள் அனைவருக்கும் எதிராகப் பல நாட்கள் போர் செய்தார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யோசுவா இந்த அரசர்கள் அனைவருக்கும் எதிராக நீண்ட காலம் போர் செய்தார்.” எபிரெயத்தில் நேரடியாக “பல நாட்கள்” என்று உள்ளது; மேலும், “போர் செய்தார்” என்னும் பொருளுடைய ஒரு மரபுத்தொடர் பயன்படுத்தப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָמִים רַבִּים
  choice: பல நாட்கள்
  rationale: எபிரெயச் சொற்றொடரின் நேரடிப் பொருள் ‘பல நாட்கள்’; இது நீண்ட காலத்தையும் குறிக்கலாம். தமிழில் இயல்பாகவும் மூலத்தின் வடிவத்திற்கு நெருக்கமாகவும் உள்ளது.
- source_word: עָשָׂה ... מִלְחָמָה
  choice: போர் செய்தார்
  rationale: ‘செய்’ மற்றும் ‘போர்’ சேர்ந்த எபிரெய மரபுத்தொடரை, இயல்பான நவீனத் தமிழில் ‘போர் செய்தார்’ என வழங்குகிறது.
- source_word: יְהוֹשֻׁעַ
  choice: யோசுவா
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் நிலைபெற்றுள்ள தனிப்பெயர் வடிவம்.
- source_word: אֶת כָּל הַמְּלָכִים הָאֵלֶּה
  choice: இந்த அரசர்கள் அனைவருக்கும் எதிராக
  rationale: போர் செய்யும் சூழலில் அரசர்கள் செயலின் எதிர்நிலையில் இருப்பதைத் தமிழில் தெளிவாகவும் இயல்பாகவும் காட்டுகிறது.
- source_word: מִלְחָמָה
  choice: போர்
  rationale: இச்சூழலில் போர் அல்லது போராட்டத்தைக் குறிக்கும் பொதுவான, தெளிவான தமிழ்ச் சொல்.
