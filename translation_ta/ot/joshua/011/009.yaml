base_translation:
  language: en
  yaml_path: translation/ot/joshua/011/009.yaml
  text: 'And Joshua did to them just as Yahweh had told him: he hamstrung their horses and burned their chariots with fire[a].'
translation:
  language: ta
  text: 'யாவே யோசுவாவுக்குச் சொன்னபடியே, யோசுவா அவர்களுக்குச் செய்தான்: அவர்களுடைய குதிரைகளின் கால் நரம்புகளை வெட்டினான்; அவர்களுடைய தேர்களை நெருப்பால் எரித்தான்.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அவர்களுடைய குதிரைகளை முடமாக்கினான்” என்றும் மொழிபெயர்க்கலாம்; எபிரெயச் சொல் இன்னும் குறிப்பாக அவற்றின் கால் நரம்புகளை வெட்டுவதைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ לָהֶם
  choice: யோசுவா அவர்களுக்குச் செய்தான்
  rationale: עשה + ל என்ற எபிரெயச் சொற்றொடர், இந்தப் போர்ச் சூழலில் அவர்களுக்காக நன்மை செய்தான் என்பதை அல்ல, அவர்களிடம் அல்லது அவர்களுக்கு இப்படிச் செய்தான் என்பதைக் குறிக்கிறது.
- source_word: כַּאֲשֶׁר אָמַר לוֹ
  choice: தனக்குச் சொன்னபடியே
  rationale: כַּאֲשֶׁר என்பதன் ஒப்புமைத் தன்மையை ‘சொன்னபடியே’ இயல்பாக வெளிப்படுத்துகிறது; ‘தனக்கு’ என்பது யாவே யோசுவாவிடம் சொன்னதைக் குறிக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இது ஒரு பட்டம் அல்ல, எபிரெய மூலத்தில் நேரடியாக இடம்பெறும் தேவனுடைய தனிப்பெயர்; அதன் பரவலான நவீன ஒலிபெயர்ப்பாக ‘யாவே’ பயன்படுத்தப்படுகிறது.
- source_word: סוּסֵיהֶם
  choice: அவர்களுடைய குதிரைகள்
  rationale: பன்மையிலுள்ள எபிரெயப் பெயர்ச்சொல்லையும் உடைமைப் பின்னொட்டையும் நேரடியாகவும் இயல்பாகவும் தருகிறது.
- source_word: עִקֵּר
  choice: கால் நரம்புகளை வெட்டினான்
  rationale: இந்த வினை விலங்குகளின் கால் நரம்புகளை வெட்டி அவற்றை இயங்க முடியாதபடி செய்வதைச் குறிப்பாகக் குறிக்கிறது; பொதுவான ‘முடமாக்கினான்’ என்பதைவிட இத்தேர்வு துல்லியமானது.
- source_word: מַרְכְּבֹתֵיהֶם
  choice: அவர்களுடைய தேர்கள்
  rationale: போரில் பயன்படுத்தப்பட்ட குதிரைத் தேர்களைக் குறிக்கும் எபிரெயச் சொல்லின் இயல்பான தமிழ் இணை.
- source_word: שָׂרַף בָּאֵשׁ
  choice: நெருப்பால் எரித்தான்
  rationale: எபிரெய மூலத்தில் ‘நெருப்பால்’ என்பது வெளிப்படையாக இருப்பதால், அதை விடாமல் மூலத்தின் சொல்லமைப்பும் வலியுறுத்தலும் பாதுகாக்கப்படுகின்றன.
theological_decisions:
- issue: יְהוָה என்ற தேவப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூல உரை பொதுவான பட்டத்தை அல்ல, நான்கு எபிரெய மெய்யெழுத்துகளால் எழுதப்படும் தேவனுடைய தனிப்பெயரைப் பயன்படுத்துகிறது. ஆகவே அதை ஒரு பட்டமாக மாற்றாமல் ஒலிபெயர்ப்பது மூலத்துக்கு நெருக்கமானது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. ‘கால் நரம்புகளை வெட்டினான்’ என்பது அரிதான தொழில்நுட்பச் சொல்லைத் தவிர்த்தபடியே எபிரெய வினையின் குறிப்பான பொருளைத் தக்கவைக்கிறது.
