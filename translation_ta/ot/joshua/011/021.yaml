base_translation:
  language: en
  yaml_path: translation/ot/joshua/011/021.yaml
  text: At that time Joshua came and cut off the Anakim from the hill country—from Hebron[a], from Debir, from Anab, and from all the hill country of Judah and from all the hill country of Israel. Joshua devoted them to destruction, together with their cities.
translation:
  language: ta
  text: அக்காலத்தில் யோசுவா வந்து, மலைநாட்டிலிருந்து—எபிரோனிலிருந்தும், தெபீரிலிருந்தும், ஆனாபிலிருந்தும், யூதாவின் மலைநாடு முழுவதிலிருந்தும், இஸ்ரவேலின் மலைநாடு முழுவதிலிருந்தும்—ஏனாக்கியர்களை ஒழித்தார். அவர்களையும் அவர்களுடைய நகரங்களையும் யோசுவா அழிவுக்கென அர்ப்பணித்தார்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இன்னும் சொல்லுக்கு நெருக்கமாக, “தடையின்கீழ் ஒதுக்கினார்.” இங்கு வரும் எபிரேய வினைச்சொல், மனிதர்களையோ பொருள்களையோ அழிவுக்கென முற்றிலும் ஒதுக்குவதைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: வந்து
  rationale: בוא என்ற வினைச்சொல் இங்கு தொடரும் நிகழ்வை அறிமுகப்படுத்துகிறது. தமிழில் ‘வந்து’ என்பது யோசுவா அங்கு சென்று நடவடிக்கை எடுத்ததை இயல்பாகத் தெரிவிக்கிறது.
- source_word: בָּעֵת הַהִיא
  choice: அக்காலத்தில்
  rationale: இது முந்தைய நிகழ்வுகளோடு வசனத்தை இணைக்கும் வழக்கமான காலக்குறிப்பு; ‘அக்காலத்தில்’ என்பது இயல்பான நவீனத் தமிழ்.
- source_word: וַיַּכְרֵת
  choice: ஒழித்தார்
  rationale: כרת என்பதன் அடிப்படைப் பொருள் ‘வெட்டுதல்/துண்டித்தல்’; இச்சூழலில் ஒரு மக்கள்குழுவை அந்தப் பகுதியிலிருந்து அகற்றியழிப்பதைக் குறிக்கிறது. ‘ஒழித்தார்’ இயல்பாகவும், பின்னர் வரும் חרם என்ற வலுவான தொழில்நுட்பச் சொல்லிலிருந்து வேறுபட்டும் உள்ளது.
- source_word: הָעֲנָקִים
  choice: ஏனாக்கியர்கள்
  rationale: மக்கள்குழுவின் பெயர் தமிழில் ஒலிபெயர்க்கப்பட்டு, மக்களைக் குறிக்கும் ‘-யர்கள்’ வடிவில் வழங்கப்படுகிறது.
- source_word: מִן הָהָר
  choice: மலைநாட்டிலிருந்த
  rationale: யோசுவா நூலில் הָהָר பெரும்பாலும் தனி மலையை அல்ல, உயர்நிலப் பிரதேசத்தைச் சுட்டுகிறது; ‘மலைநாடு’ அந்தப் புவியியல் பொருளைத் தெளிவாகக் காட்டுகிறது.
- source_word: מִן חֶבְרוֹן מִן דְּבִר מִן עֲנָב
  choice: எபிரோனிலிருந்தும், தெபீரிலிருந்தும், ஆனாபிலிருந்தும்
  rationale: இடப்பெயர்கள் ஒலிபெயர்க்கப்பட்டுள்ளன. எபிரேயத்தில் மீண்டும் மீண்டும் வரும் מִן என்பதின் வலியுறுத்தலை ‘-இலிருந்தும்’ என்ற தொடர் அமைப்பு காக்கிறது.
- source_word: וּמִכֹּל הַר יְהוּדָה
  choice: யூதாவின் மலைநாடு முழுவதிலிருந்தும்
  rationale: முழு உயர்நிலப் பகுதியையும் குறிக்கும் כֹּל הַר என்ற சொற்றொடரின் புவியியல் விரிவை இவ்வடிவம் காக்கிறது.
- source_word: וּמִכֹּל הַר יִשְׂרָאֵל
  choice: இஸ்ரவேலின் மலைநாடு முழுவதிலிருந்தும்
  rationale: ‘இஸ்ரவேல்’ என்பதை விளக்கவுரை சேர்க்காமல் புவியியல் பெயராகவே காக்கிறது.
- source_word: עִם עָרֵיהֶם
  choice: அவர்களையும் அவர்களுடைய நகரங்களையும்
  rationale: עִם உடனிணைப்பைக் குறிக்கிறது. தமிழ் வாக்கியத்தில் חרם வினையின் நேரடிப் பொருள்களாக இரண்டையும் இணைப்பது பொருளைத் தெளிவாகவும் இயல்பாகவும் வழங்குகிறது.
- source_word: הֶחֱרִימָם
  choice: அழிவுக்கென அர்ப்பணித்தார்
  rationale: חרם என்பதன் ஹிபீல் வடிவம் ஒருவரையோ ஒன்றையோ அழிவுக்காக முற்றிலும் ஒதுக்குவதைச் சுட்டுகிறது. ‘அழிவுக்கென அர்ப்பணித்தார்’ என்பது சாதாரண ‘அழித்தார்’ என்பதைக் காட்டிலும் அதன் தனிப்பட்ட அர்ப்பணிப்பு/தடைப் பொருளைத் தக்கவைக்கிறது.
theological_decisions:
- issue: חרם என்ற போர் சார்ந்த சொல்லின் மொழிபெயர்ப்பு
  choice: அழிவுக்கென அர்ப்பணித்தார்
  alternative: முற்றிலும் அழித்தார்; தடை ஆணைக்குள் வைத்தார்
  rationale: இவ்வசனத்தில் כרת மற்றும் חרם ஆகிய இரு வேறு வினைச்சொற்கள் வருகின்றன. அவற்றை ஒரே சொல்லால் சமப்படுத்தாமல், חרם என்பதிலுள்ள அழிவுக்காகத் தனியே ஒதுக்கும் கருத்தை முதன்மை உரை காக்கிறது. சொல்லுக்கு நெருக்கமான மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான வரலாற்று நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. எபிரேயப் பட்டியலின் மீளுருவாக்கம் ஓரளவு காக்கப்பட்டு, தமிழ் வாசிப்பின் தெளிவுக்காக முதன்மை வினை மீண்டும் சொல்லப்பட்டுள்ளது. חרם என்ற சொல்லின் பதற்றமான இறையியல்-சடங்கு நுணுக்கம் எளிய ‘அழித்தார்’ எனச் சமப்படுத்தப்படவில்லை.
