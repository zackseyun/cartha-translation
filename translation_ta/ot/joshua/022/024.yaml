id: JOS.22.24
reference: Joshua 22:24
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וְ/אִם לֹ֤א מִ/דְּאָגָה֙ מִ/דָּבָ֔ר עָשִׂ֥ינוּ אֶת זֹ֖את לֵ/אמֹ֑ר מָחָ֗ר יֹאמְר֨וּ בְנֵי/כֶ֤ם לְ/בָנֵ֨י/נוּ֙ לֵ/אמֹ֔ר מַה לָּ/כֶ֕ם וְ/לַֽ/יהוָ֖ה אֱלֹהֵ֥י יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/024.yaml
  text: No, rather, we did this out of anxious concern, saying, ‘In time to come your children may say to our children, “What have you to do with the LORD, the God of Israel?”’
translation:
  language: ta
  text: இல்லை; ஒரு காரியத்தைப் பற்றிய கவலையினாலேயே நாங்கள் இதைச் செய்தோம். ஏனெனில், ‘வருங்காலத்தில் உங்கள் பிள்ளைகள் எங்கள் பிள்ளைகளிடம், “உங்களுக்கும் இஸ்ரயேலின் கடவுளாகிய ஆண்டவருக்கும் என்ன தொடர்பு?” என்று சொல்லக்கூடும்’ என்று நினைத்தோம்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאִם־לֹא
  choice: இல்லை; ... தான்
  rationale: இங்கு வரும் எபிரெய மரபுத்தொடர் முந்தைய குற்றச்சாட்டை உறுதியாக மறுத்து, உண்மையான காரணத்தை வலியுறுத்துகிறது.
- source_word: מִדְּאָגָה מִדָּבָר
  choice: இதைப் பற்றிய கவலையினால்
  rationale: சொல்லுக்கு சொல் அமைப்பு இயல்பற்றதாக இருப்பதால், குறிப்பிட்ட ஒரு நிலை குறித்த ஆழ்ந்த கவலை என்ற பொருளைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: מָחָר
  choice: வருங்காலத்தில்
  rationale: நேரடியாக ‘நாளை’ என்றாலும், இச்சூழலில் எதிர்காலத் தலைமுறையின் காலத்தைக் குறிக்கிறது.
- source_word: מַה־לָּכֶם וְלַיהוָה
  choice: ஆண்டவருக்கும் உங்களுக்கும் என்ன தொடர்பு?
  rationale: இரு தரப்பினருக்கிடையிலான உரிமை அல்லது உறவை மறுக்கும் எபிரெய மொழிவழக்கின் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: יְהוָה
  choice: ஆண்டவர்
  rationale: தெய்வீகப் பெயருக்கான பரவலாக அறியப்பட்ட, மரியாதைக்குரிய தமிழ் வேதாகம வழக்கைத் தொடர்கிறது.
theological_decisions:
- issue: கிழக்குக் கோத்திரங்களுக்கும் ஆண்டவருக்கும் உள்ள உடன்படிக்கை உறவை மறுக்கும் எதிர்காலக் கூற்று
  choice: ‘ஆண்டவருக்கும் உங்களுக்கும் என்ன தொடர்பு?’ என்ற கேள்வியாகவே வைத்தல்
  alternative: ‘ஆண்டவர்மேல் உங்களுக்கு எந்த உரிமையும் இல்லை’ என்று விளக்கமாக மாற்றுதல்
  rationale: மூலத்தின் கேள்வி வடிவத்தையும் அதிலுள்ள உறவு, பங்கு, உரிமை ஆகிய பல்வேறு நிழற்பொருள்களையும் தீர்மானித்து விடாமல் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் இயல்பான ஆனால் கண்ணியமான நடை. மூலத்தின் காரணவியல் மற்றும் உள்ளடங்கிய மேற்கோள் அமைப்பு தெளிவாகப் பாதுகாக்கப்பட்டுள்ளது.
