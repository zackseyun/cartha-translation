source:
  edition: WLC
  text: וַ/יִּשְׁלְח֨וּ בְנֵֽי יִשְׂרָאֵ֜ל אֶל בְּנֵי רְאוּבֵ֧ן וְ/אֶל בְּנֵי גָ֛ד וְ/אֶל חֲצִ֥י שֵֽׁבֶט מְנַשֶּׁ֖ה אֶל אֶ֣רֶץ הַ/גִּלְעָ֑ד אֶת פִּינְחָ֖ס בֶּן אֶלְעָזָ֥ר הַ/כֹּהֵֽן־־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/013.yaml
  text: Then the sons of Israel sent Phinehas son of Eleazar the priest to the sons of Reuben[a], to the sons of Gad, and to the half-tribe of Manasseh, in the land of Gilead.
translation:
  language: ta
  text: பின்பு இஸ்ரவேல் மக்கள், ரூபேன் மக்களிடமும்[a], காத் மக்களிடமும், மனாசேயின் அரைக் கோத்திரத்தாரிடமும், கிலேயாத் நாட்டில் இருந்த அவர்களிடம் ஆசாரியனான எலெயாசாரின் மகன் பினெகாஸை அனுப்பினார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: மாற்றாக, “ரூபனியர், காதியர், மனாசேயின் அரைக் கோத்திரத்தார்” எனலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלְחוּ
  choice: பின்பு ... அனுப்பினார்கள்
  rationale: வாவ் தொடர்வினை கதைநிகழ்வை அடுத்த கட்டத்துக்கு நகர்த்துகிறது; நவீன தமிழில் ‘பின்பு’ அதன் தொடர்ச்சியை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் மக்கள்
  rationale: சொல்லுக்குச் சொல் ‘இஸ்ரவேலின் மகன்கள்’ என்றாலும், இங்கு முழு சமூகத்தைக் குறிக்கும் மரபுவழிச் சொற்றொடர்; ‘மக்கள்’ என்பது மூல உருவகத் தொடர்பை ஓரளவு காத்து, இயல்பான தமிழையும் தருகிறது.
- source_word: בְּנֵי רְאוּבֵן / בְּנֵי גָד
  choice: ரூபனின் மக்கள் / காதின் மக்கள்
  rationale: எபிரெயக் கட்டமைப்பைத் தெளிவாகப் பிரதிபலிக்கிறது; தமிழில் புரிந்துகொள்ளத்தக்கதாகவும் உள்ளது. இனக்குழுப் பெயராக்கம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: חֲצִי שֵׁבֶט מְנַשֶּׁה
  choice: மனாசேயின் அரைக் கோத்திரத்தார்
  rationale: கோத்திரத்தின் ஒரு பாதியைச் சேர்ந்தவர்களைச் சுருக்கமாகவும் தெளிவாகவும் குறிக்கிறது.
- source_word: אֶל אֶרֶץ הַגִּלְעָד
  choice: கிலேயாத் நாட்டிலிருந்த
  rationale: இரண்டாம் אֶל குழுக்கள் இருந்த இடத்தை விளக்கும் appositional நிலையை வகிக்கிறது; இலக்கு மக்களோடு ‘கிலேயாத் நாட்டிலிருந்த’ என்பதை இணைப்பது தமிழில் குழப்பமின்றி பொருளைத் தருகிறது.
- source_word: אֶת פִּינְחָס בֶּן אֶלְעָזָר הַכֹּהֵן
  choice: ஆசாரியனான எலெயாசாரின் மகன் பினெகாசை
  rationale: אֵת மொழிபெயர்க்கப்படாமல் தமிழின் இரண்டாம் வேற்றுமையால் குறிக்கப்படுகிறது. எபிரெயில் ‘ஆசாரியன்’ என்பது இலக்கண ரீதியாக அருகிலுள்ள எலெயாசாரை அடையாளப்படுத்துவது இயல்பான வாசிப்பு; தமிழிலும் அதே தொடர்பு காக்கப்படுகிறது.
theological_decisions:
- issue: הַכֹּהֵן (‘ஆசாரியன்’) யாரைச் சுட்டுகிறது?
  choice: 'எலெயாசாரைச் சுட்டுவதாக அமைத்தல்: ‘ஆசாரியனான எலெயாசார்’'
  alternative: பினெகாசைச் சுட்டுவதாக ‘எலெயாசாரின் மகனாகிய ஆசாரியன் பினெகாஸ்’ என அமைத்தல்
  rationale: எபிரெயச் சொல்லமைப்பில் הַכֹּהֵן உடனடியாக எலெயாசாருக்குப் பின் வருகிறது; ஆகவே அதை எலெயாசாரின் அறியப்பட்ட பதவியோடு இணைப்பது இயல்பானது. பினெகாசும் ஆசாரியர் என்பது வேறு இடங்களில் உண்மையாயினும், அதை இவ்வசனத்தில் கட்டாயமாக முன்வைக்கவில்லை.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் மரியாதைமிக்க நடையைப் பயன்படுத்துகிறது. ‘கோத்திரம்’, ‘ஆசாரியன்’ ஆகியவை வேதாகமச் சூழலில் பரவலாக அறியப்பட்ட சொற்களாக இருப்பதால் வைக்கப்பட்டுள்ளன. பெயர்கள் தமிழ் வேதாகமப் பயன்பாட்டுக்கு அருகான வடிவங்களில் ஒலிபெயர்க்கப்பட்டுள்ளன.
