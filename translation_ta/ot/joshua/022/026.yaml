base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/026.yaml
  text: So we said[b][a], ‘Let us now build for ourselves the altar—not for burnt offering and not for sacrifice.’
translation:
  language: ta
  text: ஆகவே நாங்கள், ‘இப்போது நமக்காக அந்தப் பலிபீடத்தைக் கட்டுவோம்[a]—தகனபலிக்காகவும் அல்ல, பலிக்காகவும் அல்ல’ என்று சொன்னோம்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரேய மொழியில் சொற்சொல்லாக, ‘நமக்காகச் செய்வோம், பலிபீடத்தைக் கட்டுவதற்கு.’ இது ‘நமக்காகப் பலிபீடத்தைக் கட்டுவோம்’ என்று பொருள்படும் மரபுத்தொடர்.
    reason: lexical_alternative
  - marker: b
    text: ‘ஆகவே நாங்கள் சொன்னோம்’ என்பதை ‘அப்போது நாங்கள் சொன்னோம்’ அல்லது ‘மேலும் நாங்கள் சொன்னோம்’ என்றும் மொழிபெயர்க்கலாம். எபிரேய இணைப்புச்சொல் முந்தைய வசனத்துடன் உள்ள தொடர்பைப் பொறுத்து பல விதமாக இயல்பாக மொழிபெயர்க்கப்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַנֹּאמֶר
  choice: ஆகவே ... என்று சொன்னோம்
  rationale: முந்தைய வசனத்தில் கூறப்பட்ட அச்சத்திலிருந்து விளைந்த தீர்மானத்தை wayyiqtol வடிவம் அறிமுகப்படுத்துகிறது; ‘ஆகவே’ அந்த விளைவு சார்ந்த தொடர்பை இயல்பான தமிழில் காட்டுகிறது. எபிரேய இணைப்பை ‘அப்போது’ அல்லது ‘மேலும்’ என்றும் சூழலுக்கேற்ப மொழிபெயர்க்கலாம்.
- source_word: נַעֲשֶׂה נָּא לָנוּ לִבְנוֹת
  choice: இப்போது நமக்காக ... கட்டுவோம்
  rationale: עשה என்பதன் விருப்பவினை வடிவமும் அதைத் தொடரும் בנה வினையெச்சமும் சேர்ந்து ஒரு தீர்மானம் அல்லது முன்மொழிவைக் குறிக்கின்றன. எபிரேய மொழியின் சொற்சொல் அமைப்பைத் தமிழில் அப்படியே பின்பற்றாமல், ‘கட்டுவோம்’ என இயல்பாக வழங்கப்பட்டுள்ளது; נָּא-வின் வலியுறுத்தல் ‘இப்போது’ என வெளிப்படுகிறது.
- source_word: אֶת הַמִּזְבֵּחַ
  choice: அந்தப் பலிபீடத்தை
  rationale: திட்டவட்ட உருபுடன் வரும் பெயர்ச்சொல் ஏற்கெனவே விவாதிக்கப்படும் குறிப்பிட்ட பலிபீடத்தைக் குறிக்கிறது. தமிழில் ‘அந்த’ என்பது இக்குறிப்புத்தன்மையைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: לֹא לְעוֹלָה
  choice: தகனபலிக்காக அல்ல
  rationale: עֹלָה என்பது முழுவதும் எரிக்கப்படும் பலியைக் குறிக்கும் நிலையான பலியியல் சொல்; ‘தகனபலி’ அதனைச் சுருக்கமாகவும் தெளிவாகவும் தருகிறது.
- source_word: וְלֹא לְזָבַח
  choice: வேறு பலிக்காகவும் அல்ல
  rationale: זֶבַח பொதுவான பலியைக் குறித்தாலும், முந்தைய ‘தகனபலி’யுடன் இணையும் இடத்தில் தமிழில் வெறும் ‘பலி’ என்பது அதையும் உள்ளடக்குவதாகத் தோன்றலாம். ‘வேறு பலி’ என்பது இரண்டாவது வகையை வேறுபடுத்துகிறது; அதன் எல்லையை மிகையாகக் குறிப்பதில்லை.
