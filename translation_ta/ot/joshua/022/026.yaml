translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘பலிபீடம்’ மற்றும் ‘தகனபலி’ ஆகிய நிலையான வேதாகமச் சொற்கள் தக்கவைக்கப்பட்டுள்ளன. எபிரேய வாக்கியத்தின் நோக்க மறுப்பு இரு இணையான கூறுகளாகப் பாதுகாக்கப்பட்டுள்ளது.
