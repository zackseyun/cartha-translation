  source_fidelity: எபிரெய மூலத்தின் தொடர்ச்சியான செயல்கள்—யோசுவா அவர்களை ஆசீர்வதித்தல், அனுப்பிவைத்தல், அவர்கள் தங்கள் கூடாரங்களுக்குச் செல்லுதல்—துல்லியமாகப் பிரதிபலிக்கப்படுகின்றன. ‘சென்றார்கள்’ என்பது הלך என்பதற்கேற்ப உள்ளது; மூலத்தில் இல்லாத ‘திரும்பிச்’ போன்ற கூடுதல் கருத்து சேர்க்கப்படவில்லை.
  naturalness: ‘பின்பு யோசுவா அவர்களை ஆசீர்வதித்து அனுப்பிவைத்தான்; அவர்கள் தங்கள் கூடாரங்களுக்குச் சென்றார்கள்’ என்பது நவீனத் தரத் தமிழில் இயல்பாகவும் கண்ணியமான வேதாகம நடையுடனும் உள்ளது. ஒருமை எழுவாயான யோசுவாவுக்கு ‘அனுப்பிவைத்தான்’ சரியாக அமைந்துள்ளது.
  terminology: ‘யோசுவா’ நிலைபெற்ற தமிழ்வேதாகமப் பெயர் வடிவமாகும். ‘ஆசீர்வதித்து’ மற்றும் ‘கூடாரங்கள்’ ஆகியவை பொருளுக்கும் வரலாற்றுச் சூழலுக்கும் ஏற்றவை. அடிக்குறிப்பு, ‘கூடாரங்கள்’ என்பதன் சொல்லர்த்தத்தைத் தெளிவுபடுத்தி ‘வீடுகள்’ என்னும் சூழல்சார் மாற்றை உரியவாறு வழங்குகிறது.
