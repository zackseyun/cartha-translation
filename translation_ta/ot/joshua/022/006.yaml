  yaml_path: translation/ot/joshua/022/006.yaml
  text: Then Joshua blessed them and sent them away[a], and they went to their tents.
translation:
  language: ta
  text: பின்பு யோசுவா அவர்களை ஆசீர்வதித்து அனுப்பிவைத்தான்; அவர்கள் தங்கள் கூடாரங்களுக்குச் சென்றார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தங்கள் வீடுகளுக்குச் சென்றார்கள்.” மூலமொழியில், “தங்கள் கூடாரங்களுக்குச் சென்றார்கள்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְבָרְכֵם
  choice: அவர்களை ஆசீர்வதித்து
  rationale: புறப்பட்டுச் செல்லும் மக்களுக்கு யோசுவா ஆசீர்வாதம் வழங்கிய செயலைச் சுருக்கமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: יְהוֹשֻׁעַ
  choice: யோசுவா
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் நிலைபெற்றுள்ள பெயர் வடிவம்.
- source_word: וַיְשַׁלְּחֵם
  choice: அனுப்பிவைத்தான்
  rationale: இங்குள்ள שׁלח அவர்கள் புறப்பட்டுச் செல்ல அனுமதித்து வழியனுப்பியதைக் குறிக்கிறது; நவீனத் தமிழில் ‘அனுப்பிவைத்தான்’ இயல்பாக உள்ளது.
- source_word: וַיֵּלְכוּ
  choice: சென்றார்கள்
  rationale: הלך என்பதன் நேரடியான பொருளைத் தருகிறது; ‘திரும்பிச் சென்றார்கள்’ என்று மூலத்தில் இல்லாத கருத்தைச் சேர்க்கவில்லை.
- source_word: אֶל
  choice: -க்குச்
  rationale: இலக்கை நோக்கிய இயக்கத்தைத் தமிழின் இயல்பான வேற்றுமை உருபால் குறிக்கிறது.
- source_word: אָהֳלֵיהֶם
  choice: தங்கள் கூடாரங்கள்
  rationale: மூலச் சொல்லின் நேரடிப் பொருளான ‘அவர்களுடைய கூடாரங்கள்’ என்பதைக் காக்கிறது; எழுவாயைக் குறிப்பதால் ‘தங்கள்’ என்பது தமிழில் இயல்பானது.
