translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையும் கண்ணியமும் காக்கப்பட்டுள்ளன. எபிரெய வினைத் தொடரை இயல்பான தமிழ்ச் சொற்றொடராக அமைத்து, ‘கூடாரங்கள்’ என்ற நேரடிப் படிமம் முதன்மை உரையில் பாதுகாக்கப்பட்டுள்ளது.
