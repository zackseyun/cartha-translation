base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/016.yaml
  text: 'Thus says the whole congregation of Yahweh: ‘What is this breach of faith that you have committed against the God of Israel[a], turning away today from following Yahweh by building for yourselves an altar, rebelling today against Yahweh?’'
translation:
  language: ta
  text: 'யாவேயின் முழுச் சபையும் இவ்வாறு கூறியது: “இஸ்ரவேலின் கடவுளுக்கு எதிராக நீங்கள் செய்த இந்த விசுவாசத் துரோகம் என்ன?[a] இன்று யாவேயைப் பின்பற்றுவதிலிருந்து விலகி, உங்களுக்கென்று ஒரு பலிபீடத்தைக் கட்டி, இன்று யாவேக்கு எதிராகக் கலகம் செய்வதற்காகவா?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “விசுவாசத் துரோகம்” என்பதற்கு “துரோகம்,” “உண்மையின்மை,” அல்லது “விசுவாச மீறல்” என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் உடன்படிக்கைக்கு அல்லது வழிபாட்டுக்கு உரிய விசுவாசமின்மையைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמְרוּ
  choice: கூறுவது இதுவே
  rationale: எபிரெயச் செய்தியாளர் சூத்திரத்தை இயல்பான நவீனத் தமிழில் தருகிறது; வினை வடிவத்தின் இறந்தகாலத் தோற்றத்தைவிட மேற்கோளை அறிமுகப்படுத்தும் செயல்பாடு முன்னிறுத்தப்படுகிறது.
- source_word: כֹּל עֲדַת יְהוָה
  choice: யாவேயின் சபை முழுவதும்
  rationale: עֵדָה என்பது உடன்படிக்கைச் சமூகமாகக் கூடிய மக்களைக் குறிக்கிறது; ‘சபை’ அதன் கூட்டு மற்றும் வழிபாட்டுச் சார்பைச் சுருக்கமாகக் காக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரான நான்கு எழுத்துப் பெயரை ஒரு பொதுப் பட்டத்தால் மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: מָה הַמַּעַל הַזֶּה אֲשֶׁר מְעַלְתֶּם
  choice: நீங்கள் செய்த இந்த நம்பிக்கைத் துரோகம் என்ன?
  rationale: பெயர்ச்சொல்-வினைச்சொல் சொற்பிறப்பு உறவை இயல்பான தமிழில் முழுமையாகப் பிரதிபலிக்க இயலாதபோதும், מַעַל குறிக்கும் உடன்படிக்கை மற்றும் வழிபாட்டு விசுவாசமின்மையின் தீவிரத்தை ‘நம்பிக்கைத் துரோகம்’ காக்கிறது.
- source_word: בֵּאלֹהֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் கடவுளுக்கு எதிராக
  rationale: מעל உடன் வரும் בְּ இங்கு குற்றத்தின் இலக்கைச் சுட்டுவதால் ‘எதிராக’ என்பது தமிழில் பொருத்தமானது.
- source_word: לָשׁוּב הַיּוֹם מֵאַחֲרֵי יְהוָה
  choice: இன்று யாவேயைப் பின்பற்றுவதிலிருந்து விலகி
  rationale: מֵאַחֲרֵי என்ற ‘பின்பற்றுதலிலிருந்து’ என்னும் உடன்படிக்கைப் பற்றுறுதி நயத்தைத் தக்கவைத்து, לָשׁוּב என்பதைக் ‘விலகி’ என இயல்பாகத் தருகிறது.
- source_word: בִּבְנוֹתְכֶם לָכֶם מִזְבֵּחַ
  choice: உங்களுக்காக ஒரு பலிபீடத்தைக் கட்டி
  rationale: ב prefixed infinitive குறிக்கும் வழிமுறை அல்லது சூழ்நிலையைத் தமிழ் தொடர்வினை வடிவில் தெளிவாக இணைக்கிறது; לָכֶם என்பதும் வெளிப்படையாகக் காக்கப்படுகிறது.
- source_word: לִמְרָדְכֶם הַיּוֹם בַּיהוָה
  choice: இன்று யாவேக்கு எதிராகக் கலகம் செய்கிறீர்களே
  rationale: מרד என்பதன் வெளிப்படையான கிளர்ச்சி அல்லது கலகப் பொருளையும், בְּ குறிக்கும் எதிர்ப்பின் இலக்கையும் காக்கிறது; ‘செய்கிறீர்களே’ குற்றச்சாட்டின் வினாவியல் வலிமையை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: מַעַל என்ற உடன்படிக்கை மீறல் சொல்லின் மொழிபெயர்ப்பு
  choice: நம்பிக்கைத் துரோகம்
  alternative: துரோகம்; உண்மையின்மை; விசுவாச மீறல்
  rationale: இங்கு குற்றச்சாட்டு பொதுவான பாவத்தை மட்டும் அல்லாமல், இஸ்ரவேலின் கடவுளுக்கு எதிரான வழிபாட்டு மற்றும் உடன்படிக்கை விசுவாசமின்மையைக் குறிக்கிறது. ‘நம்பிக்கைத் துரோகம்’ அந்த உறவுசார் கனத்தைத் தக்கவைக்கிறது; மாற்றுச் சொற்கள் அடிக்குறிப்பில் வழங்கப்படுகின்றன.
- issue: יְהוָה என்ற தெய்வீகப் பெயர்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலத்தில் தனிப்பெயர் இருப்பதால் அதைப் பட்டமாக மாற்றாமல் ஒலிபெயர்த்துள்ளது; இதனால் இஸ்ரவேலுடன் தொடர்புடைய உடன்படிக்கைப் பெயர் வெளிப்படையாக உள்ளது.
- issue: பலிபீடம் கட்டுதலின் நோக்கம் மற்றும் குற்றச்சாட்டின் தன்மை
  choice: பலிபீடம் கட்டுவதே விலகுதல் மற்றும் கலகம் எனப் பேச்சாளர்கள் குற்றஞ்சாட்டும் வகையில் தொடரமைப்பு காக்கப்பட்டது
  alternative: அவர்கள் உண்மையிலேயே வேறு கடவுளை வழிபட்டனர் என்று வெளிப்படையாகச் சேர்த்தல்
  rationale: வசனம் பேசுபவர்களின் குற்றச்சாட்டை மட்டும் தருகிறது; பலிபீடத்தின் உண்மையான நோக்கத்தை இங்கே தீர்மானிக்கவில்லை. ஆகவே பின்னர் வரும் விளக்கத்தை முன்கூட்டியே வசனத்தில் சேர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான வேதாகம நடை. மூலத்தின் இருமுறை வரும் ‘இன்று’ என்பதும், கடுமையான குற்றச்சாட்டு நயமும் காக்கப்பட்டுள்ளன.
