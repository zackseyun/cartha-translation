  text: וַ/יֹּ֣אמֶר אֲלֵי/הֶ֔ם אַתֶּ֣ם שְׁמַרְתֶּ֔ם אֵ֚ת כָּל אֲשֶׁ֣ר צִוָּ֣ה אֶתְ/כֶ֔ם מֹשֶׁ֖ה עֶ֣בֶד יְהוָ֑ה וַ/תִּשְׁמְע֣וּ בְ/קוֹלִ֔/י לְ/כֹ֥ל אֲשֶׁר צִוִּ֖יתִי אֶתְ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/002.yaml
  text: And he said to them[a], “You have kept all that Moses the servant of Yahweh commanded you, and you have listened to my voice in all that I commanded you.”
translation:
  language: ta
  text: அவர் அவர்களிடம், “யாவேயின் ஊழியரான மோசே உங்களுக்குக் கட்டளையிட்ட அனைத்தையும் நீங்கள் கடைப்பிடித்தீர்கள்; என் குரலுக்குச் செவிகொடுத்தீர்கள்; நான் உங்களுக்குக் கட்டளையிட்ட அனைத்திலும் அப்படியே செய்தீர்கள்[a]” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நான் உங்களுக்குக் கட்டளையிட்ட அனைத்திலும் எனக்குக் கீழ்ப்படிந்தீர்கள்.” “என் குரலுக்குச் செவிகொடுத்தீர்கள்” என்ற எபிரெய மொழிமரபு, பெரும்பாலும் கேட்டதற்கேற்பக் கீழ்ப்படிந்து நடப்பதைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֲלֵיהֶם
  choice: அவர் அவர்களிடம் ... என்றார்
  rationale: வாவ் தொடர்கதை நிகழ்வை முன்னெடுக்கிறது; தமிழில் இயல்பான உரையாடல் அமைப்புக்கேற்ப பேச்சைச் சூழ்ந்து ‘அவர் ... என்றார்’ என வழங்கப்பட்டது.
- source_word: שְׁמַרְתֶּם אֵת כָּל אֲשֶׁר
  choice: அனைத்தையும் நீங்கள் கடைப்பிடித்தீர்கள்
  rationale: கட்டளைகளின் சூழலில் שׁמר என்பது அவற்றைக் காத்துக் கடைப்பிடிப்பதைக் குறிக்கிறது; ‘கடைப்பிடித்தீர்கள்’ நவீன தமிழில் இயல்பாக அந்தக் கீழ்ப்படிதல் பொருளைத் தருகிறது.
- source_word: מֹשֶׁה עֶבֶד יְהוָה
  choice: யெகோவாவின் ஊழியரான மோசே
  rationale: עֶבֶד இங்கு மோசேயின் மதிப்புக்குரிய பணிப்பட்டமாக வருகிறது; அடிமை நிலையை அல்ல, கடவுளுக்கான நியமிக்கப்பட்ட பணியை முன்னிறுத்துவதால் ‘ஊழியர்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: எபிரெயத் தனிப்பெயரான நான்கெழுத்துத் திருப்பெயரை ஒரு பொதுப்பட்டமாக மாற்றாமல், தமிழில் பரவலாக அறியப்படும் தனிப்பெயர் வடிவில் வழங்குகிறது.
- source_word: וַתִּשְׁמְעוּ בְקוֹלִי
  choice: என் குரலுக்குச் செவிகொடுத்தீர்கள்
  rationale: எபிரெய மொழிமரபின் கேட்பதைக் குறிக்கும் உருவகத்தைப் பாதுகாக்கிறது; சூழலில் கீழ்ப்படிதலையும் இயல்பாக உணர்த்துகிறது.
- source_word: לְכֹל אֲשֶׁר צִוִּיתִי אֶתְכֶם
  choice: நான் உங்களுக்குக் கட்டளையிட்ட அனைத்திலும்
  rationale: לְכֹל אֲשֶׁר என்பதன் முழுமையான பரப்பையும் צִוִּיתִי என்பதன் அதிகாரமுள்ள கட்டளையையும் தெளிவாகக் காட்டுகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழியாக்கம்
  choice: யெகோவா
  alternative: யாவே / கர்த்தர்
  rationale: மூலத்தில் ஒரு தனிப்பெயர் உள்ளதால் பட்டமான ‘கர்த்தர்’ என்பதற்குப் பதிலாகத் தனிப்பெயரைப் பாதுகாக்கிறது. ‘யெகோவா’ நவீனத் தமிழ் வாசகர்களிடையே நிலைபெற்ற அடையாளமுடைய வடிவம்.
- issue: மோசேயைக் குறிக்கும் עֶבֶד
  choice: ஊழியர்
  alternative: அடிமை / பணியாளர்
  rationale: இங்கு இச்சொல் மோசேயின் கடவுள் சார்ந்த மதிப்புக்குரிய பணியையும் ஆணையையும் குறிக்கும் பட்டம்; சொத்துரிமை அல்லது கட்டாய அடிமைத்தனம் முன்னிறுத்தப்படவில்லை.
- issue: שׁמע בְּקוֹל என்ற மொழிமரபு
  choice: குரலுக்குச் செவிகொடுத்தீர்கள்
  alternative: கீழ்ப்படிந்தீர்கள்
  rationale: மூலத்தின் செவிகொடுத்தல் உருவகத்தையும் அதில் அடங்கிய கீழ்ப்படிதல் பொருளையும் ஒன்றாக வைத்திருக்கிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் தெளிவுபடுத்தப்படுகிறது.
translation_notes:
  register: நவீனச் செந்தமிழுக்கு ஏற்ற, கண்ணியமான ஆனால் பொதுவாசகர்களுக்குப் புரியக்கூடிய நடை பயன்படுத்தப்பட்டது. ‘கடைப்பிடித்தீர்கள்’, ‘கட்டளையிட்ட’, ‘செவிகொடுத்தீர்கள்’ ஆகியவை உடன்படிக்கைச் சூழலின் அதிகாரத்தையும் கீழ்ப்படிதலையும் இயல்பாகத் தக்கவைக்கின்றன.
