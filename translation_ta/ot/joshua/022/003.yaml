base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/003.yaml
  text: You have not forsaken your brothers these many days[a], up to this day, and you have kept the charge of the commandment of Yahweh your God.
translation:
  language: ta
  text: இத்தனை நாட்களாக, இன்றுவரை நீங்கள் உங்கள் சகோதரர்களைக்[a] கைவிடவில்லை; உங்கள் கடவுளாகிய யாவேயின் கட்டளையைக் கைக்கொள்ளும் பொறுப்பை நீங்கள் நிறைவேற்றி வந்தீர்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘உங்கள் சக இஸ்ரவேலர்களை.’ எபிரெய மொழியில் நேரடியாக ‘உங்கள் சகோதரர்களை’ என்று உள்ளது; இந்த ஆண்பால் பன்மை உறவுச்சொல் இஸ்ரவேல் மக்களை விரிவாகவும் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲזַבְתֶּם
  choice: கைவிடவில்லை
  rationale: עזב என்பது விட்டுவிடுதல், கைவிடுதல், புறக்கணித்தல் ஆகிய பொருள்களைக் கொண்டது. இங்கு நீண்டகால உறவுப் பற்றுறுதியைக் குறிக்கும் வகையில் ‘கைவிடவில்லை’ இயல்பாகவும் வலிமையாகவும் உள்ளது.
- source_word: אֲחֵיכֶם
  choice: உங்கள் சகோதரர்களை
  rationale: எபிரெயச் சொல் ஆண்பால் பன்மையில் நேரடியாக ‘உங்கள் சகோதரர்கள்’ என்று பொருள்படும். சூழலில் இது சக இஸ்ரவேலரைக் குறிக்கக்கூடும் என்பதால் அந்த விரிவான பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: זֶה יָמִים רַבִּים
  choice: இத்தனை நாட்களாக
  rationale: நீண்ட காலத் தொடர்ச்சியைச் சுட்டும் எபிரெய வழக்கை, நவீனத் தமிழில் இயல்பாகவும் அதன் வலியுறுத்தலைத் தக்கவைத்தும் வெளிப்படுத்துகிறது.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: இன்றுவரை
  rationale: கடந்த காலத்திலிருந்து பேசப்படும் நிகழ்காலம் வரை தொடர்ந்த நிலையைக் குறிக்கும் இயல்பான தமிழ் காலவுரை.
- source_word: וּשְׁמַרְתֶּם
  choice: கடைப்பிடித்து வந்தீர்கள்
  rationale: שׁמר இங்கு ஒரு பொறுப்பை உண்மையுடன் பேணிக் கடைப்பிடித்தலைக் குறிக்கிறது. தொடர்ந்த செயலைத் தமிழில் ‘வந்தீர்கள்’ தெளிவுபடுத்துகிறது.
- source_word: מִשְׁמֶרֶת
  choice: உங்களிடம் ஒப்படைக்கப்பட்ட கடமை
  rationale: מִשְׁמֶרֶת என்பது ஒருவரது காவலிலும் பொறுப்பிலும் வைக்கப்பட்ட கடமை அல்லது பொறுப்பைக் குறிக்கிறது. ‘ஒப்படைக்கப்பட்ட கடமை’ அந்தச் சாரத்தை இயல்பான தமிழில் தருகிறது.
- source_word: מִצְוַת
  choice: கட்டளையின்படி
  rationale: מִשְׁמֶרֶת מִצְוַת என்ற இறுக்கமான எபிரெய இணைப்பைச் சொற்படி தமிழாக்குவது இயல்பற்றதாகும். அந்தக் கடமை யாவேயின் கட்டளையிலிருந்து எழுகிறது என்பதை ‘கட்டளையின்படி’ தெளிவாகக் காட்டுகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இது இஸ்ரவேலின் கடவுளுடைய தனிப்பெயரான நான்கெழுத்துப் பெயர். பட்டப்பெயரால் மாற்றாமல் ‘யாவே’ என்று ஒலிபெயர்க்கப்படுகிறது.
- source_word: אֱלֹהֵיכֶם
  choice: உங்கள் கடவுள்
  rationale: உடன்படிக்கை உறவைச் சுட்டும் இரண்டாம் நபர் பன்மை உடைமைத் தொடரை நேரடியாகவும் இயல்பாகவும் தருகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலத்தில் பட்டப்பெயர் அல்ல, கடவுளுடைய தனிப்பெயரே உள்ளது. ஆகவே அதை ஒரு பட்டப்பெயரால் மாற்றாமல் ஒலிபெயர்ப்பது மூலச் சான்றுக்கு நெருக்கமானது.
- issue: אֲחֵיכֶם என்ற உடன்படிக்கை உறவுச் சொல்
  choice: உங்கள் சகோதரர்கள்
  alternative: உங்கள் சக இஸ்ரவேலர்
  rationale: மூலச் சொல் ஆண்பால் பன்மை உறவுச் சொல்லாக உள்ளது; அதைக் பிரதான உரையில் தக்கவைக்கப்படுகிறது. அது சக இஸ்ரவேலரை விரிவாகக் குறிக்கக்கூடிய சாத்தியம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: מִשְׁמֶרֶת מִצְוַת என்ற தொடர்பின் பொருள்
  choice: கட்டளையின்படி ஒப்படைக்கப்பட்ட கடமை
  alternative: கட்டளையின் காவல்; கட்டளையைக் கடைப்பிடித்தல்
  rationale: எபிரெயத் தொடர் கடமையையும் கட்டளையையும் ஒன்றோடொன்று இணைக்கிறது; அவற்றின் துல்லிய இலக்கண உறவு தமிழில் சொற்படியாக இயல்பாக வராது. கடமை கட்டளையால் வரையறுக்கப்பட்டது என்ற பொருளைத் தெளிவாகக் கூறி, தனியான புதிய இறையியல் கருத்தைச் சேர்க்காமல் மொழிபெயர்க்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘இத்தனை நாட்களாக இன்றுவரை’ காலத் தொடர்ச்சியை இயல்பாக வெளிப்படுத்துகிறது. எபிரெயத்தின் இறுக்கமான ‘கட்டளையின் காவல்/பொறுப்பு’ அமைப்பு, பொருளைத் தக்கவைத்து ‘கட்டளையின்படி உங்களிடம் ஒப்படைக்கப்பட்ட கடமை’ எனத் தமிழுக்கு ஏற்றவாறு அமைக்கப்பட்டுள்ளது.
