  text: וַ/יֹּ֣אמֶר פִּֽינְחָ֣ס בֶּן אֶלְעָזָ֣ר הַ/כֹּהֵ֡ן אֶל בְּנֵי רְאוּבֵ֨ן וְ/אֶל בְּנֵי גָ֜ד וְ/אֶל בְּנֵ֣י מְנַשֶּׁ֗ה הַ/יּ֤וֹם יָדַ֨עְנוּ֙ כִּֽי בְ/תוֹכֵ֣/נוּ יְהוָ֔ה אֲשֶׁ֛ר לֹֽא מְעַלְתֶּ֥ם בַּֽ/יהוָ֖ה הַ/מַּ֣עַל הַ/זֶּ֑ה אָ֗ז הִצַּלְתֶּ֛ם אֶת בְּנֵ֥י יִשְׂרָאֵ֖ל מִ/יַּ֥ד יְהוָֽה־־־־־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/031.yaml
  text: And Phinehas son of Eleazar the priest said to the sons of Reuben[a], and to the sons of Gad, and to the sons of Manasseh, “Today we know that Yahweh is among us, because you have not acted unfaithfully against Yahweh in this matter[c][b]. Then you have delivered the sons of Israel from the hand of Yahweh.”
translation:
  language: ta
  text: 'ஆசாரியனான எலெயாசாரின் மகன் பினெகாஸ், ரூபனின் மக்களிடமும் காதின் மக்களிடமும் மனாசேயின் மக்களிடமும் கூறினார்: “இன்று யாவே நம் நடுவில் இருக்கிறார் என்பதை அறிந்துகொண்டோம்; ஏனெனில், நீங்கள் யாவேக்கு எதிராக இந்தத் துரோகத்தைச் செய்யவில்லை. ஆகவே, இஸ்ரவேல் மக்களை யாவேயின் கையிலிருந்து விடுவித்துள்ளீர்கள்.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “யாவேயின் கையிலிருந்து” என்பது யாவேயின் வல்லமை அல்லது அவர் அளிக்கும் தீர்ப்பிலிருந்து தப்புவதைக் குறிக்கும் எபிரெய மரபுத்தொடர்.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: கூறியது
  rationale: எபிரெயக் கதைநடையின் தொடர்ச்சியை இயல்பான தமிழ் வாக்கிய அமைப்பில் தருகிறது.
- source_word: פִּינְחָס בֶּן אֶלְעָזָר הַכֹּהֵן
  choice: ஆசாரியனான எலெயாசாரின் மகன் பினெகாஸ்
  rationale: הַכֹּהֵן என்பது எலெயாசாரைக் குறிப்பதாகப் புரிந்துகொள்ளப்படும் அடையாளத் தொடரைத் தெளிவான தமிழில் பாதுகாக்கிறது.
- source_word: אֶל בְּנֵי רְאוּבֵן וְאֶל בְּנֵי גָד וְאֶל בְּנֵי מְנַשֶּׁה
  choice: ரூபனின் மக்களிடமும் காதின் மக்களிடமும் மனாசேயின் மக்களிடமும்
  rationale: בני என்பதன் பழங்குடி-சமூகப் பொருளை ‘மக்கள்’ என இயல்பாகத் தருவதோடு, மீண்டும் வரும் முன்னிடைச்சொல் அமைப்பையும் பிரதிபலிக்கிறது.
- source_word: הַיּוֹם יָדַעְנוּ
  choice: இன்று அறிந்துகொண்டோம்
  rationale: முன்னர் சந்தேகமாக இருந்த ஒன்று இப்போது உறுதிப்பட்டதை எபிரெய நிறைவுவினை சூழலில் வெளிப்படுத்துவதால், ‘அறிந்துகொண்டோம்’ இயல்பான தமிழ்.
- source_word: בְּתוֹכֵנוּ יְהוָה
  choice: யெகோவா நம் நடுவில் இருக்கிறார்
  rationale: சமூகத்தின் மத்தியில் இறை பிரசன்னம் இருப்பதைக் குறிக்கும் மொழியை நேரடியாகவும் இயல்பாகவும் தருகிறது.
- source_word: לֹא מְעַלְתֶּם בַּיהוָה הַמַּעַל הַזֶּה
  choice: நீங்கள் யெகோவாவுக்கு எதிராக இந்த நம்பிக்கைத் துரோகத்தைச் செய்யாததால்
  rationale: מעל என்ற வினை-பெயர் சேர்க்கையின் உடன்படிக்கை விசுவாசமின்மை அல்லது துரோகம் என்ற வலிமையைப் பாதுகாக்கிறது; காரணப்பொருளுடைய אֲשֶׁר-ஐ ‘செய்யாததால்’ எனத் தருகிறது.
- source_word: אָז
  choice: இவ்வாறு
  rationale: முந்தைய உண்மையிலிருந்து விளையும் முடிவைச் சுட்டுகிறது; தமிழில் ‘இவ்வாறு’ என்பது சூழலின் விளைவு/முடிவு உறவை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: הִצַּלְתֶּם אֶת בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்களை ... விடுவித்தீர்கள்
  rationale: Hiphil வினையின் மீட்பு அல்லது ஆபத்திலிருந்து காப்பாற்றுதல் என்ற பொருளை வாசிக்க எளிய முறையில் தருகிறது.
- source_word: מִיַּד יְהוָה
  choice: யெகோவாவின் கையிலிருந்து
  rationale: இறை வல்லமை அல்லது தண்டனைக்குரிய தீர்ப்பைக் குறிக்கும் எபிரெய மரபுத்தொடரைப் பாதுகாக்கிறது; அதன் பொருள் அடிக்குறிப்பில் விளக்கப்படுகிறது.
theological_decisions:
- issue: இறை பிரசன்னம் குறித்த கூற்று
  choice: யெகோவா நம் நடுவில் இருக்கிறார்
  alternative: யெகோவா நம்மிடையே இருக்கிறார்
  rationale: இஸ்ரவேல் சமூகத்தின் மத்தியில் யெகோவாவின் உடன்படிக்கைப் பிரசன்னம் இருப்பதாக உரை கூறுவதை, பிற்கால இறையியல் கருத்துகளைச் சேர்க்காமல் பாதுகாக்கிறது.
- issue: מעל மொழியின் உடன்படிக்கைப் பொருள்
  choice: யெகோவாவுக்கு எதிராக இந்த நம்பிக்கைத் துரோகத்தைச் செய்யாததால்
  alternative: யெகோவாவுக்கு எதிராக இந்தக் குற்றத்தைச் செய்யாததால்
  rationale: இது பொதுவான குற்றம் மட்டுமல்லாமல், யெகோவாவிடம் காட்ட வேண்டிய உண்மையை மீறும் துரோகத்தைக் குறிக்கிறது; பெயர்ச்சொல்-வினைச்சொல் மீளுரையை தமிழில் பொருள்சார் முறையில் சுருக்குகிறது.
- issue: யெகோவாவின் கையிலிருந்து விடுவித்தல்
  choice: எபிரெய மரபுத்தொடரை அப்படியே வைத்தல்
  alternative: யெகோவாவின் தண்டனையிலிருந்து காப்பாற்றினீர்கள்
  rationale: உரை தெய்வீகத் தீர்ப்பின் அபாயத்தை உணர்த்தினாலும் ‘தண்டனை’ என்று வெளிப்படையாகச் சொல்லவில்லை; ஆகவே உருவகத்தையும் அதன் இறையியல் பதற்றத்தையும் காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. பழங்குடிப் பெயர்களில் ‘மக்கள்’ பயன்படுத்தப்பட்டுள்ளது; உடன்படிக்கைத் துரோகம் மற்றும் தெய்வீகத் தீர்ப்பு ஆகிய உரையின் தீவிரம் மெலிதாக்கப்படவில்லை. தெய்வீகப் பெயர் திட்ட மரபுப்படி ‘யெகோவா’ என ஒலிபெயர்க்கப்பட்டுள்ளது.
