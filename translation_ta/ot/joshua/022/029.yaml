base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/029.yaml
  text: Far be it from us that we should rebel against Yahweh and turn away today from following Yahweh by building an altar for burnt offering[a], grain offering, or sacrifice, besides the altar of Yahweh our God that is before his tabernacle.
translation:
  language: ta
  text: யாவேக்கு எதிராகக் கலகம் செய்து, இன்று யாவேவைப் பின்பற்றுவதிலிருந்து விலகி, எரிபலி, தானியபலி அல்லது பலி செலுத்துவதற்காக, நம் கடவுளாகிய யாவேயின் உறைவிடத்திற்கு முன்பாக உள்ள பலிபீடத்தைத் தவிர வேறொரு பலிபீடத்தைக் கட்டுவது எங்களால் ஒருபோதும் ஆகாதிருக்கட்டும்!
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חָלִילָה לָּנוּ מִמֶּנּוּ
  choice: எங்களுக்கு ஒருபோதும் நேராதிருக்கட்டும்
  rationale: கடுமையான மறுப்பையும் அருவருப்பையும் வெளிப்படுத்தும் எபிரெய மரபுத்தொடரின் வலிமையை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: לִמְרֹד בַּיהוָה
  choice: யாவேக்கு எதிராகக் கலகம் செய்து
  rationale: מָרַד என்பதன் உடன்படிக்கைசார் எதிர்ப்புப் பொருளையும், ב முன்னிடைச்சொல்லின் எதிர்நிலைப் பொருளையும் காக்கிறது.
- source_word: וְלָשׁוּב הַיּוֹם מֵאַחֲרֵי יְהוָה
  choice: இன்று யாவேவைப் பின்பற்றுவதிலிருந்து விலகி
  rationale: சொல்லுக்குச் சொல் ‘யாவேக்குப் பின்னாலிருந்து திரும்புதல்’ என்ற எபிரெய மரபுத்தொடரின் பொருளைத் தெளிவாகவும், பின்பற்றுதலின் உறவுசார் நுணுக்கத்தைக் காத்தும் வழங்குகிறது.
- source_word: לִבְנוֹת מִזְבֵּחַ
  choice: ஒரு பலிபீடத்தைக் கட்டுவது
  rationale: நிராகரிக்கப்படும் செயலின் குறிப்பிட்ட வடிவத்தை நேரடியாகக் காட்டுகிறது.
- source_word: לְעֹלָה
  choice: எரிபலி
  rationale: עֹלָה என்ற தொழில்நுட்ப பலிச்சொல்லுக்கு நவீன தமிழில் தெளிவான இணை.
- source_word: לְמִנְחָה
  choice: தானியபலி
  rationale: பலிச்சூழலில் מִנְחָה என்பது பொதுவான காணிக்கையல்ல, தானியத்தால் செலுத்தப்படும் காணிக்கையைக் குறிக்கிறது.
- source_word: וּלְזָבַח
  choice: அல்லது வேறு பலி செலுத்துவதற்காக
  rationale: זֶבַח இங்கு ஒரு குறிப்பிட்ட துணைவகையைக் கட்டாயப்படுத்தாத பொதுவான பலிச்சொல்; ‘வேறு’ என்பது முன் சொல்லப்பட்ட இரு வகைகளிலிருந்து பட்டியலை இயல்பாக வேறுபடுத்துகிறது.
- source_word: מִלְּבַד
  choice: தவிர
  rationale: அங்கீகரிக்கப்பட்ட பலிபீடத்துக்கும் வேறு பலிபீடத்துக்கும் இடையிலான விலக்கைச் சுருக்கமாகக் காட்டுகிறது.
- source_word: מִזְבַּח יְהוָה אֱלֹהֵינוּ
  choice: நம் கடவுளாகிய யாவேயின் ... பலிபீடம்
  rationale: எபிரெய இணைப்புத் தொடரையும் ‘நம் கடவுள்’ என்ற உடன்படிக்கை அறிக்கையையும் இயல்பான தமிழில் காக்கிறது.
- source_word: אֲשֶׁר לִפְנֵי מִשְׁכָּנוֹ
  choice: அவரது உறைவிடத்திற்கு முன்பாக உள்ள
  rationale: מִשְׁכָּן என்பதன் அடிப்படைப் பொருளான கடவுளின் உறைவிடத்தையும், மூன்றாம் ஆண்பால் ஒருமை உடைமை விகுதியையும், இடத்தொடர்பையும் காக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலத்தில் நேரடியாக வரும் உடன்படிக்கைப் பெயரைப் பொதுப்பட்டமாக மாற்றாமல், தமிழில் பரவலாக ஏற்றுக்கொள்ளப்படும் ஒலிப்பெயர்ப்பால் வழங்குகிறது.
- issue: மாற்றுப் பலிபீடம் கட்டுவதன் நோக்கம்
  choice: அதில் பலி செலுத்துவதற்காகக் கட்டுதல் என வெளிப்படுத்தப்பட்டது
  alternative: எந்த நோக்கத்திற்காகவும் பலிபீடம் கட்டுவதை முற்றாக மறுத்தல்
  rationale: வசனம் பலிபீடத்தின் இருப்பை மட்டும் மறுப்பதில்லை; எரிபலி, தானியபலி, பிற பலி ஆகியவற்றைச் செலுத்துவதற்காக அதைக் கட்டியதாகிய குற்றச்சாட்டையே மறுக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழ்; வழிபாட்டுச் சூழலுக்கேற்ற கண்ணியமான நடை. கடுமையான மறுப்பின் உணர்வு இறுதி வியங்கோள் வடிவத்தால் காக்கப்பட்டுள்ளது. தொழில்நுட்ப பலிச்சொற்கள் புரியத்தக்க சுருக்கமான வடிவில் வழங்கப்பட்டுள்ளன.
