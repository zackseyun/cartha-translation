  rationale: The revision keeps the initial strong limitation/contrast, the singular “commandment” and “law,” Moses’ title, the divine name, and each of the five Hebrew infinitival obligations. It removes the extra final warning, uses a direct-object construction for loving Yahweh, and improves modern Tamil flow without expanding the source meaning.
