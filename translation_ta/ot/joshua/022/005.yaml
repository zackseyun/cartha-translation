base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/005.yaml
  text: 'Only be very careful to do the commandment and the law that Moses the servant of Yahweh commanded you: to love Yahweh your God[a], to walk in all his ways, to keep his commandments, to cling to him, and to serve him with all your heart and with all your soul.'
translation:
  language: ta
  text: '**யோசுவா 22:5**


    ஆனால், யாவேயின் ஊழியரான மோசே உங்களுக்கு விதித்த கட்டளையையும் சட்டத்தையும்[a] கடைப்பிடிப்பதில் மிகுந்த கவனமாயிருங்கள்: உங்கள் கடவுளாகிய யாவேவை நேசிக்கவும், அவருடைய எல்லா வழிகளிலும் நடக்கவும், அவருடைய கட்டளைகளைக் கடைப்பிடிக்கவும், அவரைப் பற்றிக்கொள்ளவும், உங்கள் முழு இதயத்தோடும் உங்கள் முழு உயிரோடும் அவருக்குப் பணிசெய்யவும் வேண்டும்.


    [a] அல்லது, “போதனையையும்” (எபிரெயம்: *தோரா*).'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது, “போதனையையும்” (எபிரெயம்: *தோரா*).'
    reason: תורה என்பதற்கு இச்சூழலில் “சட்டம்” என்பது பொருத்தமானது; “போதனை” அல்லது “அறிவுறுத்தல்” என்பதும் செல்லத்தக்க சொற்பொருள் என்பதால் மாற்றாகக் குறிக்கப்படுகிறது.
lexical_decisions:
- source_word: רַק
  choice: ஆனால்
  rationale: முந்தைய அனுப்பிவைத்தலுக்கும் ஆசீர்வாதத்துக்கும் பின் வரும் வலியுறுத்தப்பட்ட எச்சரிக்கையை இயல்பான தமிழில் அறிமுகப்படுத்துகிறது; இங்கு ‘மட்டும்’ என்பது செயற்கையாக ஒலிக்கும்.
- source_word: שִׁמְרוּ מְאֹד
  choice: மிகவும் கவனமாக இருங்கள்
  rationale: שׁמר plus מְאֹד என்ற சொற்றொடர் வெறும் ‘கைக்கொள்ளுங்கள்’ என்பதைக் காட்டிலும் மிகுந்த கவனத்துடன் செயல்பட வேண்டிய அவசரமான அறிவுறுத்தலைக் குறிக்கிறது.
- source_word: לַעֲשׂוֹת
  choice: கடைப்பிடிப்பதில்
  rationale: கட்டளையையும் தோராவையும் நடைமுறையில் நிறைவேற்றுவதே காட்டப்படும் கவனத்தின் உள்ளடக்கம் என்பதை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: הַמִּצְוָה
  choice: கட்டளை
  rationale: எபிரெய ஒருமையைத் தக்கவைத்து, உடன்படிக்கை சார்ந்த கட்டளையின் தன்மையைப் பாதுகாக்கிறது.
- source_word: הַתּוֹרָה
  choice: திருச்சட்டம்
  rationale: மோசேயின் உடன்படிக்கைச் சூழலில் அறியப்பட்ட பொருளைத் தருகிறது; ‘போதனை’ என்ற உண்மையான மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
- source_word: עֶבֶד יְהוָה
  choice: யாவேயின் ஊழியர்
  rationale: மோசேக்கு வழங்கப்படும் கண்ணியமிக்க பட்டத்தை இயல்பாகத் தருகிறது; இச்சூழலில் ‘அடிமை’ என்ற சமூகநிலைப் பொருள் முன்னிலையிலில்லை.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரான நான்கு எழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் ஏற்ற ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: וְלָלֶכֶת בְּכָל דְּרָכָיו
  choice: அவருடைய எல்லா வழிகளிலும் நடக்கவும்
  rationale: நெறிசார் வாழ்வைக் குறிக்கும் எபிரெய உருவகத்தைத் தெளிவான நவீன தமிழில் தக்கவைக்கிறது.
- source_word: וְלִשְׁמֹר מִצְוֺתָיו
  choice: அவருடைய கட்டளைகளைக் கடைப்பிடிக்கவும்
  rationale: கட்டளைகளுக்கு உண்மையுடன் கீழ்ப்படிவதைத் தெளிவாகவும் இயல்பாகவும் கூறுகிறது.
- source_word: וּלְדָבְקָה בּוֹ
  choice: அவரைப் பற்றிக்கொண்டிருக்கவும்
  rationale: דבק குறிக்கும் நெருக்கமான, தொடர்ச்சியான பற்றுதலை உறவுசார் தீவிரத்துடன் வெளிப்படுத்துகிறது.
- source_word: וּלְעָבְדוֹ
  choice: அவருக்குப் பணிசெய்யவும்
  rationale: வழிபாட்டையும் கீழ்ப்படிதலையும் உள்ளடக்கக்கூடிய עבד என்பதன் விரிவான சேவைப் பொருளைத் தக்கவைக்கிறது.
- source_word: בְּכָל לְבַבְכֶם וּבְכָל נַפְשְׁכֶם
  choice: உங்கள் முழு இருதயத்தோடும் உங்கள் முழு உயிரோடும்
  rationale: மனிதரின் உள்ளார்ந்த விருப்பமும் முழு உயிரும் அர்ப்பணிக்கப்படுவதைச் சொல்லும் இணை அமைப்பைத் தக்கவைக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலத்தில் தனிப்பட்ட உடன்படிக்கைப் பெயர் நேரடியாக இடம்பெறுவதால், அதை ஒரு பட்டமாக மாற்றாமல் ஒலிபெயர்த்துள்ளது.
- issue: உடன்படிக்கை சார்ந்த நெறி உருவகங்களைத் தக்கவைத்தல்
  choice: அவருடைய எல்லா வழிகளிலும் நடக்கவும்; அவரைப் பற்றிக்கொண்டிருக்கவும்
  alternative: அவருடைய வழிகளின்படி வாழவும்; அவருக்கு உறுதியாக உண்மையாயிருக்கவும்
  rationale: ‘நடத்தல்’ மற்றும் ‘பற்றிக்கொள்ளுதல்’ என்ற மூல உருவகங்கள் நெறிசார் கீழ்ப்படிதலையும் உறவுசார் நெருக்கத்தையும் ஒருங்கே சுமப்பதால் அவை தக்கவைக்கப்பட்டுள்ளன.
- issue: נפשׁ என்பதன் மொழிபெயர்ப்பு
  choice: உயிர்
  alternative: ஆத்துமா / முழு ஆளுமை
  rationale: ‘உயிர்’ என்பது இச்சூழலில் முழு உயிரோடு அர்ப்பணித்தலை இயல்பாக வெளிப்படுத்துகிறது; பிற்கால உடல்–ஆத்துமா பிரிவை மூலத்தில் இல்லாத அளவுக்கு வலியுறுத்துவதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. கடவுளைக் குறிக்கும் சுட்டுப்பெயர்களில் மரியாதைப் பன்மை பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் தொடர்ச்சியான ஐந்து நோக்கவினைகள் தமிழில் தெளிவாகத் தக்கவைக்கப்பட்டுள்ளன.
