base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/019.yaml
  text: But if the land of your possession is unclean[a], cross over for yourselves into the land of Yahweh’s possession, where Yahweh’s tabernacle dwells, and take possession among us. Only do not rebel against Yahweh, or against us[d][c][b], by building for yourselves an altar besides the altar of Yahweh our God.
translation:
  language: ta
  text: ஆனால், உங்கள் உடைமை நிலம்[a] தீட்டுள்ளதாக இருந்தால், யாவேயின் திருக்கூடாரம் அங்கே தங்கியிருக்கும்[b] யாவேக்குரிய உடைமை நிலத்துக்கு உங்களுக்காகக் கடந்து வாருங்கள்; எங்கள் நடுவே ஓர் உடைமையைப் பெற்றுக்கொள்ளுங்கள்[c]. நம் கடவுளாகிய யாவேயின் பலிபீடத்தைத் தவிர[d] உங்களுக்காக ஒரு பலிபீடத்தைக் கட்டி, யாவேக்கு எதிராகக் கலகம் செய்யாதீர்கள்; எங்களுக்கு எதிராகவும் கலகம் செய்யாதீர்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘உங்கள் பரம்பரை உரிமை நிலம்’ அல்லது ‘உங்கள் சுதந்தர நிலம்’ என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் தலைமுறை வழியாகக் கிடைக்கும் நிலவுடைமையையும் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘யாவேயின் திருக்கூடாரம் குடியிருக்கும் இடமான’ என்றும் மொழிபெயர்க்கலாம். எபிரெயில், யாவேயின் கூடாரம் அங்கே ‘தங்குகிறது’ என்று சொல்லப்படுகிறது.
    reason: lexical_alternative
  - marker: c
    text: ‘எங்கள் நடுவே குடியேறுங்கள்’ என்றும் மொழிபெயர்க்கலாம். எபிரெய வினை ஓர் உடைமையைப் பெறுதல் அல்லது ஓரிடத்தில் குடியேறுதல் ஆகிய இரு நுணுக்கங்களையும் கொண்டிருக்கலாம்.
    reason: lexical_alternative
  - marker: d
    text: ‘நம் கடவுளாகிய யாவேயின் பலிபீடத்திற்கு அப்பால்’ அல்லது ‘அதோடு கூடுதலாக’ என்றும் பொருள்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַךְ
  choice: ஆனால்
  rationale: முந்தைய குற்றச்சாட்டைத் தொடர்ந்து வரும் வலுவான நிபந்தனையை இயல்பான தமிழில் எதிர்மறைத் திருப்பமாகக் காட்டுகிறது.
- source_word: טְמֵאָה
  choice: தீட்டுள்ளதாக
  rationale: பொதுவான அசுத்தத்தை மட்டும் அல்லாமல் வழிபாட்டு அல்லது சடங்குசார் தூய்மையின்மையையும் சுட்டக்கூடிய எபிரெயச் சொல்லின் நுணுக்கத்தைப் பாதுகாக்கிறது.
- source_word: אֶרֶץ אֲחֻזַּתְכֶם
  choice: உங்களுக்குச் சொந்தமான நாடு
  rationale: אֲחֻזָּה என்பதன் உடைமை அல்லது பரம்பரை உரிமை நிலம் என்ற கருத்தை வாசிக்க இயல்பான தமிழில் தருகிறது; பரம்பரை உரிமை என்ற சாத்தியம் அடிக்குறிப்பில் வைக்கப்படுகிறது.
- source_word: עִבְרוּ לָכֶם
  choice: கடந்து வந்து
  rationale: யோர்தானைக் கடப்பதைக் குறிக்கும் வினையைத் தெளிவாகத் தருகிறது. לָכֶם-இன் நலன்பொருட்டான நுணுக்கம் அடுத்துள்ள ‘உங்களுக்கென’ என்பதில் இயல்பாக வெளிப்படுகிறது.
- source_word: אֶל אֶרֶץ אֲחֻזַּת יְהוָה
  choice: யாவேக்குச் சொந்தமான நாட்டுக்கு
  rationale: முன்னுள்ள ‘உங்களுக்குச் சொந்தமான நாடு’ என்பதோடு உள்ள திட்டமிட்ட ஒப்புமையைப் பேணுகிறது.
- source_word: אֲשֶׁר שָׁכַן שָׁם מִשְׁכַּן יְהוָה
  choice: யாவேயின் உறைவிடக் கூடாரம் தங்கியிருக்கும்
  rationale: שׁכן மற்றும் מִשְׁכָּן இடையிலான ‘தங்குதல்/உறைவிடம்’ தொடர்பை முடிந்தவரை வெளிப்படுத்தி, வழிபாட்டுக் கூடாரத்தைக் குறிக்கும் பொருளையும் காக்கிறது.
- source_word: וְהֵאָחֲזוּ בְּתוֹכֵנוּ
  choice: எங்கள் நடுவே உங்களுக்கென ஓர் உடைமையைப் பெற்றுக்கொள்ளுங்கள்
  rationale: வெறுமனே குடியேறுவதைவிட, ஒரு நிலப்பங்கு அல்லது உரிமைப் பகுதியைப் பெறுதல் என்ற நிலவுடைமை நுணுக்கத்தைப் பேணுகிறது.
- source_word: וּבַיהוָה אַל תִּמְרֹדוּ
  choice: யாவேக்கு எதிராகக் கலகம் செய்யாதீர்கள்
  rationale: בְּ குறிக்கும் எதிர்ப்பு நோக்கையும் מרד வினையின் கலகப் பொருளையும் நேரடியாகத் தருகிறது.
- source_word: וְאֹתָנוּ אַל תִּמְרֹדוּ
  choice: எங்களுக்கு எதிராகவும் கலகம் செய்யாதீர்கள்
  rationale: இணையான இரண்டாம் தடையைத் தமிழில் தெளிவாகக் காட்ட வினை மீண்டும் சொல்லப்படுகிறது.
- source_word: בִּבְנֹתְכֶם לָכֶם מִזְבֵּחַ
  choice: வேறொரு பலிபீடத்தை உங்களுக்காகக் கட்டி
  rationale: בְּ உடன் வரும் infinitive construct இங்கு வழி அல்லது செயல் சூழலைக் குறிப்பதால் ‘கட்டி’ என்பது இயல்பாக இணைக்கிறது.
- source_word: מִבַּלְעֲדֵי מִזְבַּח יְהוָה אֱלֹהֵינוּ
  choice: நம் கடவுளாகிய யாவேயின் பலிபீடத்தைத் தவிர
  rationale: அங்கீகரிக்கப்பட்ட பலிபீடத்திற்கு வெளியே அல்லது அதற்கு மேலாக இன்னொரு பலிபீடம் அமைப்பதைத் தடுக்கும் கருத்தைச் சுருக்கமாகத் தருகிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெயத் தெய்வீகப் பெயரை ஒரு பட்டப்பெயரால் மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
theological_decisions:
- issue: யோர்தானுக்குக் கிழக்கேயுள்ள நாட்டின் தீட்டின் தன்மை
  choice: ‘தீட்டுள்ளதாக இருந்தால்’ என்று மட்டும் மொழிபெயர்த்து, அந்தத் தீட்டு சடங்குசார், புவியியல்சார் அல்லது வாதத்திற்காகக் கூறப்பட்டதா என்பதைத் தீர்மானிக்காமல் விடுதல்
  alternative: அந்த நாடு மையத் திருத்தலத்துக்கு வெளியே இருப்பதால் வழிபாட்டுக்குத் தகாதது என்று வெளிப்படையாக விளக்குதல்
  rationale: எபிரெய வாசகம் தீட்டின் காரணத்தையோ தன்மையையோ விளக்கவில்லை; ஆகவே அதன் உண்மையான தெளிவின்மை பாதுகாக்கப்படுகிறது.
- issue: கூடுதல் பலிபீடத்தின் நிலை
  choice: யாவேயின் பலிபீடத்தைத் தவிர வேறொரு பலிபீடம் கட்டுவதற்கு எதிரான தடையாக மொழிபெயர்த்தல்
  alternative: எந்த நோக்கத்திற்காக அமைக்கப்படும் இரண்டாவது பலிபீடமும் தன்னிலேயே முற்றிலும் தடைசெய்யப்பட்டது என்று விரிவாக்குதல்
  rationale: வசனம் போட்டியான அல்லது அங்கீகரிக்கப்படாத பலிபீடத்தை எதிர்க்கிறது; ஆனால் தடையின் முழு எல்லையை இந்த வசனம் மட்டும் விளக்காததால் அதை மொழிபெயர்ப்பில் விரிவுபடுத்தவில்லை.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளும் கண்ணியமான நடையில் அமைக்கப்பட்டுள்ளது. ‘தீட்டு’, ‘உறைவிடக் கூடாரம்’, ‘பலிபீடம்’, ‘கலகம்’ ஆகிய சொற்கள் வேதாகம வழிபாட்டுச் சூழலின் நுணுக்கத்தைப் பேணுகின்றன. சொற்சொல்லான அமைப்பு தமிழில் கடினமாவதைத் தவிர்த்து, எபிரெய இணை அமைப்புகளும் கருத்துத் தெளிவின்மைகளும் இயன்றவரை காக்கப்பட்டுள்ளன.
