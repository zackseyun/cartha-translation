  text: וַֽ/יִּשְׁמְע֖וּ בְּנֵ֣י יִשְׂרָאֵ֑ל וַ/יִּקָּ֨הֲל֜וּ כָּל עֲדַ֤ת בְּנֵֽי יִשְׂרָאֵל֙ שִׁלֹ֔ה לַ/עֲל֥וֹת עֲלֵי/הֶ֖ם לַ/צָּבָֽא־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/012.yaml
  text: When the sons of Israel heard[b][a], the whole congregation of the sons of Israel assembled at Shiloh to go up against them for war.
translation:
  language: ta
  text: இஸ்ரவேல் மக்கள்[a] இதைக் கேள்விப்பட்டபோது, இஸ்ரவேல் மக்களின் சபை முழுவதும் அவர்களுக்கு எதிராகப் போருக்குப் புறப்பட்டுச் செல்ல சீலோவில் ஒன்றுகூடியது.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மொழியில் சொல்லுக்குச் சொல், ‘இஸ்ரவேலின் மகன்கள்.’ இங்கு அது இஸ்ரவேல் மக்களைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: எபிரெய மொழியில், ‘அவர்களுக்கு எதிராகப் போருக்காக மேலே செல்ல.’ இது இராணுவ நடவடிக்கைக்குச் செல்வதைக் குறிக்கும் வழக்குச் சொற்றொடர்.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּשְׁמְעוּ
  choice: இதைக் கேள்விப்பட்டபோது
  rationale: שׁמע என்பதன் இயல்பான கதைநடைப் பொருள் ‘கேள்விப்பட்டனர்.’ முந்தைய நிகழ்வைப் பற்றிய செய்தியை அவர்கள் அறிந்ததைக் குறிக்கத் தமிழில் ‘இதைக் கேள்விப்பட்டபோது’ இயல்பாக உள்ளது.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்கள்
  rationale: எபிரெயச் சொற்றொடர் சொல்லுக்குச் சொல் ‘இஸ்ரவேலின் மகன்கள்’ எனினும், இங்கு அது இஸ்ரவேல் சமூகத்தாரைக் குறிக்கும் வழக்குச் சொற்றொடர். நவீனத் தமிழில் இயல்பாகவும் அனைவரையும் உள்ளடக்கியதாகவும் ‘இஸ்ரவேல் மக்கள்’ தேர்ந்தெடுக்கப்பட்டது; நேரடிப் பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: וַיִּקָּהֲלוּ
  choice: ஒன்றுகூடியது
  rationale: קהל என்பது ஒரு நோக்கத்திற்காகச் சபையாகக் கூடுவதைக் குறிக்கிறது. ‘ஒன்றுகூடியது’ தெளிவான, இயல்பான தமிழ்.
- source_word: כָּל עֲדַת בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்களின் சபை முழுவதும்
  rationale: עֵדָה என்பது உடன்படிக்கைச் சமூகமாகிய சபையைக் குறிக்கிறது; כָּל அதன் முழுமையை வலியுறுத்துகிறது. கூட்டுப்பொருளைத் தக்கவைத்து இயல்பான தமிழில் இவ்வாறு மொழிபெயர்க்கப்பட்டது.
- source_word: שִׁלֹה
  choice: சீலோ
  rationale: இடப்பெயர் தமிழில் வழக்கமான ஒலிபெயர்ப்பு வடிவில் தரப்பட்டது.
- source_word: לַעֲלוֹת עֲלֵיהֶם לַצָּבָא
  choice: அவர்களுக்கு எதிராகப் போருக்குப் புறப்பட்டுச் செல்ல
  rationale: עלה על என்பது பகைமைச் சூழலில் ஒருவருக்கு எதிராகச் செல்வதையும், צבא இங்கு போர் நடவடிக்கையையும் குறிக்கிறது. ‘புறப்பட்டுச் செல்ல’ என்பது இயக்கத்தைத் தக்கவைக்கிறது; ‘போருக்கு’ அதன் இராணுவ நோக்கத்தைத் தெளிவாக்குகிறது.
