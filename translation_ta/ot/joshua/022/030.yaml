  text: וַ/יִּשְׁמַ֞ע פִּֽינְחָ֣ס הַ/כֹּהֵ֗ן וּ/נְשִׂיאֵ֨י הָ/עֵדָ֜ה וְ/רָאשֵׁ֨י אַלְפֵ֤י יִשְׂרָאֵל֙ אֲשֶׁ֣ר אִתּ֔/וֹ אֶת הַ֨/דְּבָרִ֔ים אֲשֶׁ֧ר דִּבְּר֛וּ בְּנֵי רְאוּבֵ֥ן וּ/בְנֵי גָ֖ד וּ/בְנֵ֣י מְנַשֶּׁ֑ה וַ/יִּיטַ֖ב בְּ/עֵינֵי/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/030.yaml
  text: When Phinehas the priest[a], the leaders of the congregation, and the heads of the thousands of Israel who were with him heard the words that the sons of Reuben, the sons of Gad, and the sons of Manasseh spoke[b], it was good in their eyes.
translation:
  language: ta
  text: ஆசாரியனாகிய பினெகாஸும், பினெகாஸுடன் இருந்த சபையின் தலைவர்களும் இஸ்ரவேலின் ஆயிரங்களின் தலைவர்களும்[a], ரூபனின் மக்களும், காத்தின் மக்களும், மனாசேயின் மக்களும் பேசிய வார்த்தைகளைக் கேட்டபோது, அது அவர்களுக்கு நன்றாகத் தோன்றியது[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொற்பொருளாக, ‘இஸ்ரவேலின் ஆயிரங்களின் தலைவர்கள்.’ இங்கு ‘ஆயிரங்கள்’ என்பது சரியாக ஆயிரம் பேர் கொண்ட அலகுகளைக் காட்டாமல், குல அல்லது கோத்திர உட்பிரிவுகளைக் குறிக்கக்கூடும்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘அது அவர்களுக்கு ஏற்புடையதாகத் தோன்றியது’ அல்லது ‘அது அவர்களை மகிழ்வித்தது.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: கேட்டபோது
  rationale: שׁמע என்பதன் இயல்பான கதைநடைப் பொருளான ‘கேட்டல்’ என்பதைக் காக்கிறது; தேவையற்ற கவனிப்புணர்வைச் சேர்க்கவில்லை.
- source_word: פִּינְחָס הַכֹּהֵן
  choice: ஆசாரியனாகிய பினெகாஸ்
  rationale: பெயரையும் definite title-ஐயும் இயல்பான நவீனத் தமிழ் அடைமொழி அமைப்பில் வழங்குகிறது.
- source_word: נְשִׂיאֵי הָעֵדָה
  choice: சபையின் தலைவர்கள்
  rationale: נְשִׂיאִים என்பதற்கு அங்கீகரிக்கப்பட்ட தலைவர்கள் என்றும் עֵדָה என்பதற்கு இஸ்ரவேல் சமூகச் சபை என்றும் தெளிவாகப் பொருள் தருகிறது.
- source_word: רָאשֵׁי אַלְפֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் ஆயிரங்களின் தலைவர்கள்
  rationale: אַלְפֵי என்ற மூலச்சொல்லின் வடிவத்தையும் அதன் நிர்வாக அல்லது குலப்பிரிவு சார்ந்த தெளிவின்மையையும் மொழிபெயர்ப்பிலேயே காக்கிறது; விளக்கம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: אֲשֶׁר אִתּוֹ
  choice: அவருடன் இருந்த
  rationale: எபிரெய உறவுத்தொடரை இயல்பாகக் காத்து, ‘அவர்’ என்பது பினெகாஸைக் குறிக்கத் தெளிவாக அமைக்கப்பட்டுள்ளது.
- source_word: הַדְּבָרִים אֲשֶׁר דִּבְּרוּ
  choice: பேசிய வார்த்தைகளை
  rationale: ‘வார்த்தைகள்’ மற்றும் ‘பேசினர்’ என்ற மூலத்தின் மீளுருவைத் தமிழில் வாசிக்கத்தக்க வகையில் காக்கிறது.
- source_word: בְּנֵי רְאוּבֵן וּבְנֵי גָד וּבְנֵי מְנַשֶּׁה
  choice: ரூபனின் சந்ததியினர், காதின் சந்ததியினர், மனாசேயின் சந்ததியினர்
  rationale: בְּנֵי என்பதன் குலவழி அடையாளத்தை ‘மகன்கள்’ என்று உயிரியல் ஆண் பிள்ளைகளாகத் தவறாகப் புரிந்துகொள்ளாமல், மூன்று கோத்திரங்களுக்கும் மூலத்தின் மீளுருவைப் பேணுகிறது.
- source_word: וַיִּיטַב בְּעֵינֵיהֶם
  choice: அது அவர்களின் பார்வையில் நல்லதாக இருந்தது
  rationale: ‘அவர்களின் கண்களில் நல்லதாக இருந்தது’ என்ற எபிரெய மொழிமரபை அர்த்தம் தெளிவாக இருக்கும் அளவுக்கு நெருக்கமாகப் பாதுகாக்கிறது.
