  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான வேதாகமக் கதைநடை பயன்படுத்தப்பட்டுள்ளது. எபிரெயத்தின் பட்டியல் அமைப்பும் இறுதி மொழிமரபும் இயன்றவரை காக்கப்பட்டுள்ளன; ‘ஆயிரங்கள்’ என்பதிலுள்ள உண்மையான சொற்பொருள் தெளிவின்மை அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது.
