source:
  edition: WLC
  text: הֲ/ל֣וֹא עָכָ֣ן בֶּן זֶ֗רַח מָ֤עַל מַ֨עַל֙ בַּ/חֵ֔רֶם וְ/עַֽל כָּל עֲדַ֥ת יִשְׂרָאֵ֖ל הָ֣יָה קָ֑צֶף וְ/הוּא֙ אִ֣ישׁ אֶחָ֔ד לֹ֥א גָוַ֖ע בַּ/עֲוֺנֽ/וֹ׀־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/020.yaml
  text: Was it not Achan son of Zerah who acted unfaithfully in the matter of what was devoted to destruction, and wrath came upon all the congregation of Israel? Yet he was not the only man who perished in his iniquity.
translation:
  language: ta
  text: சேராகின் மகன் ஆகான் அழிவுக்கென ஒதுக்கப்பட்டவற்றின் விஷயத்தில் விசுவாசத் துரோகம் செய்தபோது, இஸ்ரவேல் சபை முழுவதின்மேலும் கடுங்கோபம் வந்ததல்லவா? அவன் ஒருவன் மட்டும் அவனுடைய அக்கிரமத்தில் அழிந்துபோகவில்லையே.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מָעַל מַעַל
  choice: துரோகம் செய்ததால்
  rationale: ஒரே வேர்ச்சொல்லை வினைச்சொல் மற்றும் பெயர்ச்சொல் வடிவங்களில் இணைத்துப் பயன்படுத்தும் எபிரெய வலியுறுத்தலை, உடன்படிக்கைச் சூழலில் இயல்பான தமிழில் ‘துரோகம் செய்தான்’ எனத் தருகிறது.
- source_word: בַחֵרֶם
  choice: அழிப்புக்கென்று அர்ப்பணிக்கப்பட்ட பொருளின் காரியத்தில்
  rationale: חֵרֶם என்பது சாதாரணமாக அழிக்கப்பட்ட பொருள் மட்டுமல்ல; கடவுளுக்கென ஒதுக்கப்பட்டு அழிப்புக்கு உட்படுத்தப்பட்டதைச் சுட்டுகிறது. இரு கூறுகளையும் தமிழில் வெளிப்படுத்துகிறது.
- source_word: קָצֶף
  choice: கடுங்கோபம்
  rationale: தெய்வீக உக்கிரத்தைக் குறிக்கும் சொல்லின் தீவிரத்தை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: עֲדַת יִשְׂרָאֵל
  choice: இஸ்ரவேல் சபை
  rationale: ஒழுங்குபடுத்தப்பட்ட முழு இஸ்ரவேல் சமூகத்தைக் குறிக்கும் பாரம்பரியமானதும் புரியத்தக்கதுமான சொற்றொடர்.
- source_word: בַעֲוֺנוֹ
  choice: அவன் செய்த அக்கிரமத்தினால்
  rationale: בְּ முன்னொட்டின் காரணப் பொருளையும் עָוֹן என்பதன் குற்றம்/அக்கிரமம் சார்ந்த பொருளையும் தெளிவாகத் தருகிறது.
theological_decisions:
- issue: ஆகானின் அக்கிரமத்தின் சமூக விளைவு
  choice: அவன் ஒருவன் மட்டும் சாகவில்லையே
  alternative: அவன் தன் அக்கிரமத்தில் தனியாகச் சாகவில்லை
  rationale: וְהוּא אִישׁ אֶחָד לֹא גָוַע என்ற சொற்றொடர் ஆகான் மட்டுமே இறக்கவில்லை, பிறரும் அவன் குற்றத்தின் விளைவால் இறந்தனர் என்பதைக் குறிக்கிறது. தேர்ந்த வடிவம் இதை இயல்பான தமிழில் தருகிறது; யார் யார் இறந்தனர் என்ற விளக்கத்தை உரைக்குள் சேர்ப்பதில்லை.
- issue: கடுங்கோபத்தின் மூலத்தை வெளிப்படையாகக் குறிப்பிடுதல்
  choice: மூலத்தில் உள்ளபடி செய்பவரைச் சேர்க்காமல் ‘கடுங்கோபம் வந்தது’
  alternative: கடவுளின் கடுங்கோபம் வந்தது
  rationale: சூழலில் அது கடவுளின் கோபம் என்பது தெளிவாக இருந்தாலும், இவ்வசனத்தின் எபிரெய உரை கடவுளை வெளிப்படையான உடைமையாளராகச் சேர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும் வகையில் இயல்பான, கண்ணியமான நடை. முதல் வாக்கியத்தின் வினாவடிவமும் இரண்டாம் வாக்கியத்தின் வலியுறுத்தலும் எபிரெய உரைக்கு ஏற்ப பாதுகாக்கப்பட்டுள்ளன.
