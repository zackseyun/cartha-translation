  register: நவீன நிலையான தமிழில் இயல்பான, மரியாதைமிக்க உரைநடை பயன்படுத்தப்பட்டுள்ளது. எபிரெயத்தின் பகிர்ந்தளிக்கும் மறுமொழி ‘ஒரு தலைவர் வீதம்’ என்று இயல்பாக்கப்பட்டுள்ளது. אַלְפֵי என்பதிலுள்ள எண்ணியல்/நிர்வாக இருபொருள் முதன்மை உரையிலும் அடிக்குறிப்பிலும் பாதுகாக்கப்பட்டுள்ளது.
