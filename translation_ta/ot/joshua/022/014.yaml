base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/014.yaml
  text: and with him ten leaders[a], one leader for each ancestral house from all the tribes of Israel; and each of them was the head of his ancestral house among the thousands of Israel.
translation:
  language: ta
  text: அவருடன் பத்து தலைவர்கள் இருந்தார்கள்; இஸ்ரவேலின் ஒவ்வொரு கோத்திரத்திலிருந்தும் தந்தைவழிக் குடும்பத்தின் ஒரு தலைவர் வீதம் இருந்தார். அவர்கள் ஒவ்வொருவரும் இஸ்ரவேலின் ஆயிரக் குழுக்களில்[a] தங்கள் தந்தைவழிக் குடும்பத்தின் தலைவர்களாக இருந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “இஸ்ரவேலின் ஆயிரங்களில்.” இங்கு “ஆயிரங்கள்” என்பது இஸ்ரவேலுக்குள் இருந்த குலப் பிரிவுகளையோ பெரிய குடும்பக் குழுக்களையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: נְשִׂאִים / נָשִׂיא
  choice: தலைவர்கள் / தலைவர்
  rationale: இச்சொல் அதிகாரப்பூர்வமான குல அல்லது கோத்திரத் தலைமையைச் சுட்டுகிறது. நவீனத் தமிழில் இயல்பாகவும் தெளிவாகவும் இருப்பதால் ‘தலைவர்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: עִמּוֹ
  choice: அவருடன்
  rationale: முந்தைய வசனத்தில் குறிப்பிடப்பட்ட பினெகாசைச் சுட்டும் முன்னிடைச்சொல் மற்றும் பிரதிப்பெயர் பின்னொட்டின் நேரடியான பொருள்.
- source_word: נָשִׂיא אֶחָד נָשִׂיא אֶחָד
  choice: ஒவ்வொரு … ஒரு தலைவர் வீதம்
  rationale: எபிரெய மறுமொழி பகிர்ந்தளிக்கும் பொருளைத் தருகிறது; ஒவ்வொரு குடும்ப அலகிலிருந்தும் ஒருவர் என்பதைக் இயல்பான தமிழில் ‘ஒருவர் வீதம்’ வெளிப்படுத்துகிறது.
- source_word: לְבֵית אָב
  choice: ஒவ்வொரு மூதாதையர் குடும்பத்திற்கு
  rationale: בֵּית אָב என்பது தந்தைவழி உறவுமுறை சார்ந்த நிர்வாகக் குடும்ப அலகு. சொல்லுக்குச் சொல் ‘தந்தையின் வீடு’ என்பதைக் காட்டிலும் ‘மூதாதையர் குடும்பம்’ நவீனத் தமிழில் அதன் சமூகப் பொருளைத் தெளிவாகத் தருகிறது.
- source_word: לְכֹל מַטּוֹת יִשְׂרָאֵל
  choice: இஸ்ரவேலின் எல்லாக் கோத்திரங்களிலிருந்தும்
  rationale: தலைவர்கள் கோத்திரங்களைப் பிரதிநிதித்துவப்படுத்தி அவற்றிலிருந்து வந்தவர்கள் என்ற உறவைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וְאִישׁ
  choice: அவர்கள் ஒவ்வொருவரும்
  rationale: இங்கு אִישׁ பகிர்ந்தளிக்கும் விதத்தில் பத்து ஆண் பிரதிநிதிகளில் ஒவ்வொருவரையும் குறிக்கிறது; சூழலைத் தெளிவாக்கும் இயல்பான தமிழ் வடிவம் பயன்படுத்தப்பட்டது.
- source_word: רֹאשׁ בֵּית אֲבוֹתָם
  choice: தங்கள் மூதாதையர் குடும்பத்தின் தலைவராக
  rationale: רֹאשׁ என்பதன் தலைமைப் பொருளையும், בֵית אֲבוֹתָם என்பதன் உறவுமுறை அமைப்பையும் தெளிவாகப் பாதுகாக்கிறது.
- source_word: לְאַלְפֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் ஆயிரத்துக் குழுக்களில்[a]
  rationale: אֶלֶף என்பது எண்ணாகிய ‘ஆயிரம்’ என்பதையோ, சமூக அல்லது படை நிர்வாகப் பிரிவையோ குறிக்கக்கூடும். ‘ஆயிரத்துக் குழுக்கள்’ மூலச் சொல்லின் உருவத்தைப் பாதுகாக்கிறது; அடிக்குறிப்பு அதன் நிர்வாகப் பொருள் சாத்தியத்தை விளக்குகிறது.
