- from: அவருடன் பத்துத் தலைவர்களும் இருந்தார்கள்—இஸ்ரவேலின் எல்லாக் கோத்திரங்களிலிருந்தும் ஒவ்வொரு மூதாதையர் குடும்பத்திற்கு ஒரு தலைவர் வீதம் இருந்தார். அவர்கள் ஒவ்வொருவரும் இஸ்ரவேலின் ஆயிரத்துக் குழுக்களில்[a] தங்கள் மூதாதையர் குடும்பத்தின் தலைவராக இருந்தார்கள்.
  to: அவருடன் பத்து தலைவர்கள் இருந்தார்கள்; இஸ்ரவேலின் ஒவ்வொரு கோத்திரத்திலிருந்தும் தந்தைவழிக் குடும்பத்தின் ஒரு தலைவர் வீதம் இருந்தார். அவர்கள் ஒவ்வொருவரும் இஸ்ரவேலின் ஆயிரக் குழுக்களில்[a] தங்கள் தந்தைவழிக் குடும்பத்தின் தலைவர்களாக இருந்தார்கள்.
