  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַֽ/יַּעֲנוּ֙ בְּנֵי רְאוּבֵ֣ן וּ/בְנֵי גָ֔ד וַ/חֲצִ֖י שֵׁ֣בֶט הַֽ/מְנַשֶּׁ֑ה וַֽ/יְדַבְּר֔וּ אֶת רָאשֵׁ֖י אַלְפֵ֥י יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/021.yaml
  text: 'Then the sons of Reuben[a], the sons of Gad, and the half-tribe of Manasseh answered and spoke to the heads of the clans of Israel:'
translation:
  language: ta
  text: 'அப்போது ரூபனின் மக்களும், காதின் மக்களும், மனாசே கோத்திரத்தின் பாதியினரும் இஸ்ரவேலின் குலப்பிரிவுகளின் தலைவர்களிடம்[a] பதிலளித்துப் பேசினார்கள்:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் எழுத்துப்படி, “இஸ்ரவேலின் ஆயிரங்களின் தலைவர்கள்”; இது குல அல்லது கோத்திரப் பிரிவுகளின் தலைவர்களைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲנוּ
  choice: பதிலளித்து
  rationale: கால் வடிவிலுள்ள ענה உரையாடலில் முந்தைய கூற்றுக்கான பதிலை அறிமுகப்படுத்துகிறது; ‘பதிலளித்து’ அந்தத் தொடர்பைத் தெளிவாகக் காக்கிறது.
- source_word: בְּנֵי רְאוּבֵן וּבְנֵי גָד
  choice: ரூபனின் மக்களும், காதின் மக்களும்
  rationale: எபிரெய மொழியின் ‘மகன்கள்/மக்கள்’ என்ற குடும்பவழிச் சொல்லாட்சியை இயல்பான தமிழில் காக்கிறது.
- source_word: וַחֲצִי שֵׁבֶט הַמְנַשֶּׁה
  choice: மனாசே கோத்திரத்தின் பாதியினரும்
  rationale: மனாசே கோத்திரத்தின் ஒரு பாதியைச் சேர்ந்த மக்களைக் குறிக்கும் எபிரெயக் கட்டமைப்பைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: וַיְדַבְּרוּ
  choice: பேசினார்கள்
  rationale: דבר என்பதன் ‘பேசு’ என்ற பொருளைத் தக்கவைத்து, ‘பதிலளித்துப் பேசினார்கள்’ என்ற எபிரெய இருவினை அமைப்பையும் பிரதிபலிக்கிறது.
- source_word: רָאשֵׁי אַלְפֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் குலப்பிரிவுகளின் தலைவர்கள்
  rationale: רָאשֵׁי என்பது ‘தலைவர்கள்’; אַלְפֵי என்பதற்கு எழுத்துப்படி ‘ஆயிரங்கள்’ என்றாலும், இங்கு அது சமூக அல்லது நிர்வாகக் குலப்பிரிவுகளைக் குறிப்பதாகத் தெரிகிறது. பிரதான உரையில் புரியக்கூடிய செயல்பாட்டு மொழிபெயர்ப்பு பயன்படுத்தப்பட்டுள்ளது.
theological_decisions: []
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. எபிரெயத்தின் ‘பதிலளித்து—பேசினார்கள்’ என்ற இருவினைத் தொடர் காக்கப்பட்டது; ‘ஆயிரங்கள்’ என்ற நிர்வாகச் சொல்லின் தெளிவற்ற தன்மை அடிக்குறிப்பில் பதிவு செய்யப்பட்டது.
