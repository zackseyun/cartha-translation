  text: וּ/גְב֣וּל נָֽתַן יְ֠הוָה בֵּינֵ֨/נוּ וּ/בֵינֵי/כֶ֜ם בְּנֵי רְאוּבֵ֤ן וּ/בְנֵי גָד֙ אֶת הַ/יַּרְדֵּ֔ן אֵין לָ/כֶ֥ם חֵ֖לֶק בַּֽ/יהוָ֑ה וְ/הִשְׁבִּ֤יתוּ בְנֵי/כֶם֙ אֶת בָּנֵ֔י/נוּ לְ/בִלְתִּ֖י יְרֹ֥א אֶת יְהוָֽה־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/025.yaml
  text: For Yahweh has made the Jordan a boundary between us and you[a], sons of Reuben and sons of Gad. You have no portion in Yahweh. And so your sons might cause our sons to stop fearing Yahweh.
translation:
  language: ta
  text: ஏனெனில், “யாவே நமக்கும் உங்களுக்கும் இடையில் யோர்தானை ஓர் எல்லையாக வைத்திருக்கிறார், ரூபன் மக்களே, காத் மக்களே. யாவேவிடத்தில் உங்களுக்குப் பங்கு இல்லை[a]” என்று கூறி, உங்கள் பிள்ளைகள் எங்கள் பிள்ளைகள் யாவேக்குப் பயப்படுவதை நிறுத்திவிடும்படி செய்யலாம்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யாவேவிடத்தில் உங்களுக்கு உரிமைப்பங்கு இல்லை.”
    reason: חֵלֶק என்பது பொதுவான ‘பங்கு’ என்பதோடு, ஒதுக்கப்பட்ட உரிமைப்பங்கு அல்லது பங்கீட்டையும் குறிக்கலாம்; இவ்வசனத்தில் இரு நிழற்பொருள்களும் சாத்தியம்.
lexical_decisions:
- source_word: וּגְבוּל
  choice: ஓர் எல்லையாக
  rationale: גְּבוּל என்பது நிலப்பகுதிகளைப் பிரிக்கும் எல்லை அல்லது எல்லைக்கோட்டைக் குறிக்கிறது. இங்கு யோர்தான் இரு தரப்பினருக்கும் இடையிலான எல்லையாக அமைந்ததை இயல்பாகத் தெரிவிக்கிறது.
- source_word: נָתַן
  choice: வைத்திருக்கிறார்
  rationale: நேரடியாக ‘கொடுத்தார்’ என்று பொருள்படக்கூடிய נָתַן, גְּבוּל உடன் வரும்போது ஓர் எல்லையை ஏற்படுத்துதல் அல்லது வைத்தல் என்ற பொருளைத் தருகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய தனிப்பெயரான יהוה-ஐ ஒரு பொதுப் பட்டத்தால் மாற்றாமல், தமிழில் தெளிவான ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: אֶת הַיַּרְדֵּן
  choice: யோர்தானை
  rationale: ஆற்றின் தனிப்பெயரைத் தமிழில் வழக்கமான ‘யோர்தான்’ என வழங்குகிறது; சூழலில் அது ஆறு என்பது தெளிவாக இருப்பதால் ‘ஆறு’ என்பதைச் சேர்க்கவில்லை.
- source_word: בְּנֵי רְאוּבֵן וּבְנֵי גָד
  choice: ரூபன் மக்களே, காத் மக்களே
  rationale: இவை தனிப்பட்ட மகன்களைக் காட்டிலும் ரூபன், காத் கோத்திரத்தாரைக் குறிக்கும் அழைப்புகள். ‘மக்களே’ என்பது அந்தக் கோத்திர அடையாளத்தை நவீன தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: אֵין לָכֶם חֵלֶק בַּיהוָה
  choice: யாவேயில் உங்களுக்கு எந்தப் பங்கும் இல்லை
  rationale: חֵלֶק என்பதன் அடிப்படைப் பொருளான ‘பங்கு’ என்பதைத் தக்கவைத்து, யாவேயுடனான உடன்படிக்கைச் சார்ந்த பங்கேற்பை விளக்கிச் சுருக்காமல் விடுகிறது.
- source_word: וְהִשְׁבִּיתוּ
  choice: நிறுத்தும்படி செய்துவிடலாம்
  rationale: שבת என்பதன் ஹிஃபில் வடிவம் ‘நிறுத்தச் செய்தல்’ என்ற காரணவினைப் பொருளைக் கொண்டுள்ளது. சூழலிலுள்ள அச்சத்திற்குரிய எதிர்கால வாய்ப்பை ‘செய்துவிடலாம்’ தெரிவிக்கிறது.
- source_word: בְנֵיכֶם ... בָּנֵינוּ
  choice: உங்கள் பிள்ளைகள் ... எங்கள் பிள்ளைகள்
  rationale: בנים இங்கு வருங்காலத் தலைமுறையினரைக் குறிக்கிறது. ‘பிள்ளைகள்’ என்பது பாலினத்தைத் தேவையின்றிக் குறுக்காமல் தலைமுறை உறவை இயல்பாகக் காட்டுகிறது.
- source_word: לְבִלְתִּי יְרֹא אֶת יְהוָה
  choice: யாவேக்குப் பயப்படுவதை நிறுத்தும்படி
  rationale: இறைவனுக்கான பயபக்தியைச் சுட்டும் ירא-வை மென்மைப்படுத்தாமல் ‘பயப்படுதல்’ எனக் கொடுத்து, לבלתי உடன் வரும் நிறுத்துதல்/தடுத்தல் கருத்தையும் காக்கிறது.
theological_decisions:
- issue: יהוה என்ற இறைபெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் ஒரு பொதுப் பட்டம் அல்ல, நான்கு எழுத்துகளைக் கொண்ட இறைத் தனிப்பெயரே உள்ளது. ஆகவே அதைத் தமிழில் ஒலிபெயர்த்து, பட்டப்பெயரால் மாற்றவில்லை.
- issue: חֵלֶק בַּיהוָה என்பதன் உடன்படிக்கைச் சார்ந்த பொருள்
  choice: யாவேயில் உங்களுக்கு எந்தப் பங்கும் இல்லை
  alternative: யாவே உங்களுக்கு உரிமைச்சொத்து அல்ல
  rationale: ‘பங்கு’ என்பது மூலத்தின் உருவகத்தையும் அதன் இறையியல் பதற்றத்தையும் காக்கிறது; ‘உரிமைச்சொத்து’ என்பது வாரிசுரிமை அல்லது சொத்துரிமைக் கருத்தை மூலத்தைவிட அதிகமாகக் குறிப்பாக்கும்.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான நடையைப் பயன்படுத்துகிறது. கோத்திர அழைப்புகளுக்கு ‘மக்களே’ என்றும், வருங்காலத் தலைமுறைக்கு ‘பிள்ளைகள்’ என்றும் வேறுபடுத்தப்பட்டுள்ளது. மேற்கோள் அமைப்பு முந்தைய வசனத்திலிருந்து தொடரும் கற்பனைப் பேச்சைத் தெளிவாக்குகிறது; காரணவினையும் அச்சத்தைக் குறிக்கும் சாத்தியநிலையும் தக்கவைக்கப்பட்டுள்ளன.
