  terminology: ‘யெகோவா,’ ‘தகனபலிகள்,’ ‘பலிகள்,’ ‘சமாதானபலிகள்,’ ‘பங்கு’ ஆகியவை மூலத்தின் சொற்களையும் வேறுபாடுகளையும் பொருத்தமாகக் காக்கின்றன. ‘யெகோவாவின் முன்னிலையில்’ என்பது לְפָנָיו (‘அவருக்கு முன்பாக’) என்பதற்குத் தெளிவான இயல்பான வடிவம்.
