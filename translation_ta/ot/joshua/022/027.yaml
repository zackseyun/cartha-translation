  source_fidelity: மூலத்தில் பலிபீடம் ‘சாட்சியாக இருக்கிறது’ (எதிர்காலத்தில் இருக்கும் என்று அல்ல). மேலும், அதன் நோக்கம் இஸ்ரவேலரின் வழிபாட்டுப் பங்கையும் பிற்காலத்தில் மறுக்கப்படாமல் இருப்பதையும் உறுதிப்படுத்துவதாகக் கூறப்படுகிறது. திருத்தம் இவ்விரண்டையும் நேரடியாகக் காட்டுகிறது.
