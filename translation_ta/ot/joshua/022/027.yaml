revisions:
- from: மாறாக, அது நமக்கும் உங்களுக்கும் இடையிலும், நமக்குப் பின்வரும் தலைமுறைகளுக்கும் இடையிலும் ஒரு சாட்சியாக இருக்கும். இதனால், நாங்கள் எங்கள் தகனபலிகளாலும் பலிகளாலும் சமாதானபலிகளாலும் யெகோவாவின் திருமுன் அவருக்குரிய வழிபாட்டுப் பணியைச் செய்ய முடியும்; வருங்காலத்தில் உங்கள் பிள்ளைகள் எங்கள் பிள்ளைகளிடம், ‘யெகோவாவில் உங்களுக்குப் பங்கு இல்லை’ என்று சொல்ல முடியாது.
