base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/027.yaml
  text: Rather, it is a witness between us and you, and between our generations after us, that we may perform the service of the LORD before him with our burnt offerings, our sacrifices, and our peace offerings, so that your children may not say to our children in time to come, ‘You have no share in the LORD.’
translation:
  language: ta
  text: மாறாக, நாங்கள் யெகோவாவின் முன்னிலையில் எங்கள் தகனபலிகளோடும் பலிகளோடும் சமாதானபலிகளோடும் அவருக்கான வழிபாட்டுப் பணியைச் செய்வதற்கும், வருங்காலத்தில் உங்கள் பிள்ளைகள் எங்கள் பிள்ளைகளிடம், ‘யெகோவாவில் உங்களுக்குப் பங்கு இல்லை’ என்று சொல்லாதபடிக்கும், அது நமக்கும் உங்களுக்கும் இடையிலும் நமக்குப் பின்வரும் தலைமுறைகளுக்கும் இடையிலும் ஒரு சாட்சியாக இருக்கிறது.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: மாறாக
  rationale: முந்தைய வசனத்தில் மறுக்கப்பட்ட நோக்கத்துக்கு எதிராக உண்மையான நோக்கத்தை அறிமுகப்படுத்துவதால், இங்கு காரணவுரைச் சொல்லைவிட எதிர்மாற்றைக் காட்டும் சொல் இயல்பானது.
- source_word: עֵד
  choice: சாட்சி
  rationale: பலிபீடம் இரு தரப்பினருக்கும் அவர்களது பின்தலைமுறைகளுக்கும் உரிமையை உறுதிப்படுத்தும் சான்றாக இருப்பதை நேரடியாகக் காட்டுகிறது.
- source_word: לַעֲבֹד אֶת־עֲבֹדַת יְהוָה
  choice: யெகோவாவின் திருமுன் அவருக்குரிய வழிபாட்டுப் பணியைச் செய்ய
  rationale: வினைச்சொல்–பெயர்ச்சொல் இணைப்பின் வலியுறுத்தலை இயல்பான தமிழில் காக்கிறது; சூழலில் இது பலிசார்ந்த வழிபாட்டுச் சேவையை குறிக்கிறது.
- source_word: עֹלוֹתֵינוּ
  choice: எங்கள் தகனபலிகளாலும்
  rationale: முழுவதும் எரிக்கப்படும் பலி என்ற குறிப்பிட்ட பலிவகையைத் துல்லியமாகக் குறிக்கிறது.
- source_word: זְבָחֵינוּ
  choice: பலிகளாலும்
  rationale: பொதுவான பலிச் சொல்லை, அடுத்துள்ள குறிப்பிட்ட சமாதானபலியுடன் தேவையின்றி ஒன்றாக்காமல் காக்கிறது.
- source_word: שְׁלָמֵינוּ
  choice: சமாதானபலிகளாலும்
  rationale: שְׁלָמִים எனும் தொழில்நுட்ப பலிவகைக்கு தமிழ் வேதாகம நடையில் அறியத்தக்க, பொருத்தமான பெயர்.
- source_word: חֵלֶק בַּיהוָה
  choice: யெகோவாவில் உங்களுக்குப் பங்கு இல்லை
  rationale: ‘பங்கு’ என்ற மூல உருவகத்தையும், בַּ என்ற முன்னிடைச்சொல்லின் திறந்த இறையியல் நுணுக்கத்தையும் விளக்கிச் சுருக்காமல் காக்கிறது.
theological_decisions:
- issue: பலிபீடத்தின் நோக்கம்
  choice: அது ஒரு சாட்சி; தனிப் பலியிடமாக அல்ல
  alternative: அது பலி செலுத்துவதற்கான மற்றொரு பலிபீடம்
  rationale: வசனத்தின் நேரடி கூற்று பலிபீடத்தை தலைமுறைகளுக்கிடையிலான சாட்சியாகக் காட்டுகிறது; வழிபாட்டுப் பணி யெகோவாவின் திருமுன் நடைபெறுகிறது.
- issue: ‘யெகோவாவில் பங்கு’ என்பதன் பொருள்
  choice: மூலத்தின் ‘பங்கு’ உருவகத்தை அப்படியே வைத்தல்
  alternative: உடன்படிக்கையிலோ வழிபாட்டிலோ உரிமை இல்லை என்று விரிவாக விளக்குதல்
  rationale: இச்சொற்றொடர் வழிபாட்டு அணுகல், உடன்படிக்கைச் சேர்ந்திருத்தல், சமூக உரிமை ஆகியவற்றை ஒருங்கே உணர்த்தக்கூடும்; ஒரே விளக்கத்துக்குள் அதைச் சுருக்கவில்லை.
- issue: தெய்வீகப் பெயர் יהוה
  choice: யெகோவா
  alternative: கர்த்தர்
  rationale: எபிரெய தனிப்பெயரை பொதுப் பட்டமாக மாற்றாமல், தமிழில் பரவலாக அறியப்பட்ட ஒலிபெயர்ப்பால் வழங்குகிறது.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளும் மரியாதைமிக்க நடை. பலிசார் தொழில்நுட்பச் சொற்கள் தேவையான இடங்களில் மட்டும் பயன்படுத்தப்பட்டுள்ளன; மூலத்தின் நீண்ட நோக்கவாக்கியம் வாசிப்புத் தெளிவுக்காக இரண்டு வாக்கியங்களாக அமைக்கப்பட்டுள்ளது.
