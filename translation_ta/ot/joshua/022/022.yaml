id: JOS.22.22
reference: Joshua 22:22
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: אֵל֩ אֱלֹהִ֨ים יְהוָ֜ה אֵ֣ל אֱלֹהִ֤ים יְהוָה֙ ה֣וּא יֹדֵ֔עַ וְ/יִשְׂרָאֵ֖ל ה֣וּא יֵדָ֑ע אִם בְּ/מֶ֤רֶד וְ/אִם בְּ/מַ֨עַל֙ בַּֽ/יהוָ֔ה אַל תּוֹשִׁיעֵ֖/נוּ הַ/יּ֥וֹם הַ/זֶּֽה׀׀׀׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/022.yaml
  text: 'The Mighty One[a], God, Yahweh! The Mighty One, God, Yahweh! He knows, and Israel itself will know: if it was in rebellion, or if in unfaithfulness against Yahweh[b], do not save us this day.'
translation:
  language: ta
  text: வல்லவர்[a], தேவன், யாவே! வல்லவர், தேவன், யாவே! அவர் அறிந்திருக்கிறார்; இஸ்ரவேலும் அறிந்துகொள்ளும். நாங்கள் கலகம் செய்திருந்தாலோ, யாவேக்கு எதிராக நம்பிக்கைத் துரோகம்[b] செய்திருந்தாலோ, நீர் இன்று எங்களைக் காப்பாற்ற வேண்டாம்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் “வல்லவர், தேவன், யாவே” என்ற இறை அழைப்பு முழுவதுமாக இருமுறை கூறப்படுகிறது; இது சத்தியம் செய்வதைப் போன்ற வலியுறுத்தலுடைய அழைப்பு.
    reason: cultural_note
  - marker: b
    text: ‘நம்பிக்கைக்குத் துரோகம்’ அல்லது ‘விசுவாசமின்மை’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵל אֱלֹהִים יְהוָה
  choice: வல்லவர், தேவன், யாவே
  rationale: אֵל என்பதன் வல்லமை சார்ந்த தனிப்பட்ட பட்டப்பெயர் நுணுக்கத்தை ‘வல்லவர்’ காக்கிறது; אֱלֹהִים ‘தேவன்’ என்றும், உடன்படிக்கைப் பெயரான יְהוָה ‘யாவே’ என்றும் வழங்கப்படுகிறது. மூன்று பெயர்களும் ஒன்றாகச் சுருக்கப்படாமல் தனித்தனியாகவும், மூலத்தில் உள்ளபடி இருமுறையும் வருகின்றன.
- source_word: הוּא יֹדֵעַ
  choice: அவர் அறிந்திருக்கிறார்
  rationale: தேவன் இப்போதே அறிந்திருப்பதை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: וְיִשְׂרָאֵל הוּא יֵדָע
  choice: இஸ்ரவேலும் அறிந்துகொள்ளும்
  rationale: הוּא தரும் வலியுறுத்தலை ‘-உம்’ எடுத்துக்காட்டுகிறது; imperfect வடிவத்தின் வருங்காலப் பொருளை ‘அறிந்துகொள்ளும்’ தருகிறது.
- source_word: אִם בְּמֶרֶד
  choice: நாங்கள் கலகம் செய்திருந்தாலோ
  rationale: מֶרֶד என்பதன் கிளர்ச்சி அல்லது கலகம் என்ற பொருளைக் காக்கிறது; எபிரெய நிபந்தனைத் தொடரின் விடுபட்ட வினை தமிழில் இயல்பாக நிரப்பப்பட்டுள்ளது.
- source_word: וְאִם בְּמַעַל
  choice: நம்பிக்கைத் துரோகம் செய்திருந்தாலோ
  rationale: מַעַל குறிக்கும் விசுவாசமின்மை, ஒப்படைக்கப்பட்ட நம்பிக்கையை மீறுதல் என்ற உறவுசார் மற்றும் உடன்படிக்கை நுணுக்கத்தை ‘நம்பிக்கைத் துரோகம்’ தெளிவாகத் தருகிறது.
- source_word: בַּיהוָה
  choice: யாவேக்கு எதிராக
  rationale: கலகம் மற்றும் நம்பிக்கைத் துரோகம் என்ற சூழலில் בְ முன்னிடைச்சொல் எதிர்நிலையான உறவைக் குறிக்கிறது.
- source_word: אַל תּוֹשִׁיעֵנוּ
  choice: நீர் எங்களைக் காப்பாற்ற வேண்டாம்
  rationale: ישׁע என்பதன் Hiphil வடிவத்தையும், தேவனை நேரடியாக நோக்கிய எதிர்மறை வேண்டுதலின் வலிமையையும் காக்கிறது.
- source_word: הַיּוֹם הַזֶּה
  choice: இன்று
  rationale: ‘இந்த நாளில்’ என்பதைக் காட்டிலும் நவீனத் தமிழில் இயல்பாக இருந்து, காலக் குறிப்பை முழுமையாகத் தருகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழியாக்கம்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் நேரடியாக வரும் உடன்படிக்கைப் பெயரை ஒரு பட்டப்பெயரால் மாற்றாமல் ஒலிபெயர்த்துக் காக்கிறது.
- issue: மும்முறை இறைப்பெயர்த் தொடரை இருமுறை கூறுவதன் வலிமை
  choice: முழுத் தொடரையும் இருமுறை அப்படியே வைத்தல்
  alternative: ஒரே கூட்டு இறைப் பட்டப்பெயராகச் சுருக்குதல்
  rationale: எபிரெயத்தின் ஆணை அல்லது சத்திய அழைப்பைப் போன்ற ஆழ்ந்த வலியுறுத்தலைக் காக்கிறது; அதன் துல்லியமான சடங்கியல் பொருளைத் தேவையின்றி நிர்ணயிப்பதில்லை.
- issue: אַל תּוֹשִׁיעֵנוּ என்பதன் உரையாடல் நோக்கு
  choice: தேவனை நேரடியாக நோக்கி ‘நீர் ... காப்பாற்ற வேண்டாம்’
  alternative: ‘அவர் எங்களைக் காப்பாற்றாதிருப்பாராக’
  rationale: எபிரெய வினை இரண்டாம் நபர் ஒருமையில் இருப்பதால் நேரடி வேண்டுதலை வெளிப்படையாக வைத்துள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பாகவும், பொதுவாசகர்களுக்குப் புரியும்படியும், அதேவேளை வசனத்தின் சத்தியப்பிரமாணம் போன்ற கண்ணியமான தொனியைத் தக்கவைத்தும் வடிவமைக்கப்பட்டுள்ளது. இறை அழைப்பின் அசாதாரண அடுக்கமைப்பு மூலத்தின் வலியுறுத்தலுக்காக நோக்கத்துடன் பாதுகாக்கப்பட்டுள்ளது.
