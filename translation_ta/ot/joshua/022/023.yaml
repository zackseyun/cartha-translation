  yaml_path: translation/ot/joshua/022/023.yaml
  text: if we built for ourselves an altar to turn away from following Yahweh[a], or if to offer on it burnt offering or grain offering, or if to make on it sacrifices of peace offerings[b], may Yahweh himself require it.
translation:
  language: ta
  text: யாவேவைப் பின்பற்றுவதை விட்டு விலகுவதற்காக நாங்கள் எங்களுக்கென ஒரு பலிபீடத்தைக் கட்டியிருந்தாலோ, அல்லது அதன்மேல் தகனபலியையும் தானியபலியையும் செலுத்துவதற்காகக் கட்டியிருந்தாலோ, அல்லது அதன்மேல் சமாதானப் பலிகளை[b] செலுத்துவதற்காகக் கட்டியிருந்தாலோ, யாவே தாமே அதற்காக எங்களிடம் கணக்குக் கேட்கட்டும்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யாவே தாமே அதற்காக எங்களிடம் கணக்குக் கேட்பார்.”
    reason: இறுதி வினையைத் தம்மீது தீர்ப்பை வரவழைக்கும் வேண்டுதலாகவும் எளிய எதிர்கால அறிவிப்பாகவும் புரிந்துகொள்ள முடியும்.
  - marker: b
    text: “சமாதானப் பலிகள்” என்பதை “உறவுப் பலிகள்” என்றும் மொழிபெயர்க்கலாம்.
    reason: שְׁלָמִים என்பது சமாதானம், நலவாழ்வு மற்றும் கடவுளோடும் சமூகத்தோடும் பகிரும் உறவு ஆகியவற்றை உணர்த்தும் பலிவகை.
lexical_decisions:
- source_word: לִבְנוֹת לָנוּ מִזְבֵּחַ
  choice: நாங்கள் எங்களுக்கென ஒரு பலிபீடத்தைக் கட்டியிருந்தால்
  rationale: முந்தைய வசனத்தில் தொடங்கும் ஆணைச் சூழலில் இந்த இறந்தகால நிபந்தனை வடிவம் இயல்பான தமிழில் பொருளைத் தெளிவாக்குகிறது; לָנוּ என்பதன் பயனை ‘எங்களுக்கென’ காக்கிறது.
- source_word: לָשׁוּב מֵאַחֲרֵי יְהוָה
  choice: யாவேவைப் பின்பற்றுவதிலிருந்து விலகுவதற்காக
  rationale: ‘பின்னால் செல்வதிலிருந்து திரும்புதல்’ என்ற எபிரெய உருவகத்தையும், யாவேவைப் பின்பற்றுவதை விட்டுவிடும் விசுவாசத் துரோகப் பொருளையும் இயல்பான தமிழில் காக்கிறது.
- source_word: וְאִם לְהַעֲלוֹת עָלָיו עוֹלָה וּמִנְחָה
  choice: அதன்மேல் தகனபலியையும் தானியபலியையும் செலுத்துவதற்காகவோ
  rationale: הַעֲלוֹת என்பதன் பலியிடுதல் சார்ந்த பொருளை ‘செலுத்துதல்’ தெரிவிக்கிறது. עוֹלָה மற்றும் מִנְחָה இடையிலுள்ள וּ இணைப்பை ‘-யும் ... -யும்’ எனக் காக்கிறது.
- source_word: וְאִם לַעֲשׂוֹת עָלָיו זִבְחֵי שְׁלָמִים
  choice: அதன்மேல் சமாதானப் பலிகளைச் செலுத்துவதற்காகவோ
  rationale: עָשָׂה இங்கு பலியைச் செய்வது அல்லது செலுத்துவது என்ற வழிபாட்டுச் சார்ந்த பொருளில் உள்ளது. ‘சமாதானப் பலிகள்’ שְׁלָמִים என்ற மரபான சொல்லுணர்வைக் காக்கிறது; மாற்றுச் சொல்லாக்கம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: יְהוָה הוּא יְבַקֵּשׁ
  choice: யாவே தாமே அதற்காக எங்களிடம் கணக்குக் கேட்கட்டும்
  rationale: הוּא என்பதன் வலியுறுத்தலை ‘தாமே’ காட்டுகிறது. ஆணையுடன் இணைந்த தம்மீது வரவழைக்கும் தீர்ப்பின் வலிமையை ‘கணக்குக் கேட்கட்டும்’ காக்கிறது; வெறும் ‘தேடுதல்’ என்று மொழிபெயர்ப்பதைவிட இச்சூழலுக்கு ஏற்றது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் உடன்படிக்கைப் பெயரான நான்கெழுத்து இறைப் பெயர் நேரடியாக இருப்பதால், அதை ஒரு பட்டப்பெயராக மாற்றாமல் ஒலிபெயர்த்துள்ளது.
- issue: இறுதி வினையின் ஆணை/எதிர்கால வலிமை
  choice: யாவே தாமே அதற்காக எங்களிடம் கணக்குக் கேட்கட்டும்
  alternative: யாவே தாமே அதற்காக எங்களிடம் கணக்குக் கேட்பார்
  rationale: சுற்றியுள்ள உரை தம்மீது தீர்ப்பை வரவழைக்கும் ஆணையாக இருப்பதால் வேண்டுதல்/சாபவாக்கு வலிமை முதன்மையாகக் கொள்ளப்படுகிறது; எளிய எதிர்கால வாசிப்பும் இலக்கண ரீதியாகச் சாத்தியம் என்பதால் அடிக்குறிப்பில் காக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான வழிபாட்டு நடையுடன் மொழிபெயர்க்கப்பட்டுள்ளது. எபிரெய வாக்கியத்தின் நோக்கங்களின் தொடரை தமிழில் இயல்பாக அமைக்க முதன்மை வினை இறுதிக்குக் கொண்டுவரப்பட்டுள்ளது. ‘பலிபீடம்,’ ‘தகனபலி,’ ‘தானியபலி’ ஆகிய பரவலாக அறியப்பட்ட வேதாகமச் சொற்கள் காக்கப்பட்டுள்ளன.
