base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/015.yaml
  text: And they came to the sons of Reuben[a], and to the sons of Gad, and to the half-tribe of Manasseh, in the land of Gilead, and they spoke with them, saying[b],
translation:
  language: ta
  text: 'அவர்கள் கிலேயாத் நாட்டிலிருந்த ரூபேன் மக்களிடமும், காத் மக்களிடமும், மனாசே அரைக் கோத்திரத்தாரிடமும் வந்து, அவர்களோடு பேசினார்கள்[a], கூறினார்கள்:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்களிடம் பேசினார்கள்.” எபிரெயத்தில் “கிலேயாத் நாட்டிற்கு” என்றும் வாசிக்கலாம்; ஆனால் இங்கு அது கிழக்குக் கோத்திரத்தார் இருந்த இடத்தைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: சென்றார்கள்
  rationale: בוא என்பதன் கால் தொடர்-இறந்தகால வடிவம் வருதல்/செல்லுதல் என்ற இயக்கத்தைக் குறிக்கிறது. பேச்சாளரின் இருப்பிடத்தைச் சுட்டாத தமிழ் வருணனையில் ‘சென்றார்கள்’ இயல்பானது.
- source_word: בְּנֵי
  choice: மக்கள்
  rationale: கோத்திரப் பெயருடன் வரும் ‘மகன்கள்’ என்ற எபிரெய மரபுத்தொடர் இங்கு அந்தக் கோத்திரத்தைச் சேர்ந்தவர்களைக் குறிக்கிறது; நவீன தமிழில் ‘மக்கள்’ இயல்பாகவும் அனைவரையும் உள்ளடக்குவதாகவும் உள்ளது.
- source_word: חֲצִי שֵׁבֶט
  choice: அரைக் கோத்திரத்தார்
  rationale: மனாசே கோத்திரத்தின் ஒரு பாதியைச் சேர்ந்த மக்களைக் குறிக்கும் நிலையான கோத்திரப் பெயரிடலைச் சுருக்கமாக வெளிப்படுத்துகிறது.
- source_word: אֶל אֶרֶץ הַגִּלְעָד
  choice: கிலேயாத் நாட்டிற்கு
  rationale: אֶל என்பதன் வழக்கமான திசைநோக்குப் பொருளான ‘-க்கு’ என்பதைப் பாதுகாக்கிறது; இச்சொற்றொடரை முந்தைய பெறுநர் பட்டியலோடு இடவிளக்கமாக இணைத்தும் வாசிக்க முடியும்.
- source_word: וַיְדַבְּרוּ אִתָּם
  choice: அவர்களோடு பேசி
  rationale: דבר உடன் אֵת வருவது அவர்களோடு பேசுதல் அல்லது அவர்களிடம் பேசுதல் எனப் பொருள்படலாம்; ‘அவர்களோடு’ எபிரெய முன்னிடைச்சொல்லின் பரஸ்பரத் தொனியைப் பாதுகாக்கிறது.
- source_word: לֵאמֹר
  choice: 'கூறியது:'
  rationale: அடுத்த வசனத்தின் நேரடிக் கூற்றை அறிமுகப்படுத்தும் எபிரெய வாய்பாட்டை இயல்பான தமிழ் உரைநடையில் இணைக்கிறது.
