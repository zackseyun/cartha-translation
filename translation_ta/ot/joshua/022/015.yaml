  register: நவீன நிலையான தமிழில், எளிமையும் கண்ணியமும் கொண்ட வரலாற்று உரைநடை. கோத்திரச் சூழலில் ‘மக்கள்’ மற்றும் ‘அரைக் கோத்திரத்தார்’ என்பவை இயல்பான சமூகக் குறிப்புகளாகப் பயன்படுத்தப்பட்டுள்ளன; எபிரெயத்தின் இடவியல் மற்றும் உரையாடல் சார்ந்த இருமைகளுக்கு அடிக்குறிப்புகள் தரப்பட்டுள்ளன.
