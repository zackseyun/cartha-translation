base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/009.yaml
  text: So the sons of Reuben and the sons of Gad and the half-tribe of Manasseh returned and departed from the sons of Israel[a], from Shiloh, which is in the land of Canaan, to go to the land of Gilead, to the land of their possession, which they had taken possession of by the command of Yahweh through Moses.
translation:
  language: ta
  text: ரூபன் வம்சத்தாரும் காத் வம்சத்தாரும் மனாசேயின் பாதிக் கோத்திரத்தாரும் இஸ்ரவேல் மக்களிடமிருந்து, கானான் நாட்டிலுள்ள சீலோவிலிருந்து, திரும்பி, யாவே மோசேயின் மூலம் கட்டளையிட்டபடி தாங்கள் உரிமையாகப் பெற்றிருந்த[a] கீலேயாத் நாட்டிலுள்ள தங்கள் உரிமை நிலத்துக்குச் சென்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தங்கள் உடைமையாக்கியிருந்த.” எபிரெய வினைச்சொல் நிலத்தைப் பெற்று உரிமையுடன் வைத்திருப்பதையோ, அதைக் கைப்பற்றி உடைமையாக்குவதையோ வலியுறுத்தலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֻׁבוּ וַיֵּלְכוּ
  choice: புறப்பட்டு ... திரும்பிச் சென்றார்கள்
  rationale: שוב என்பதன் திரும்பிச் செல்லும் திசை உணர்வையும் הלך என்பதன் செல்லுதல் அல்லது புறப்படுதல் உணர்வையும் இயல்பான தமிழில் இரண்டையும் வெளிப்படுத்துகிறது.
- source_word: בְּנֵי רְאוּבֵן וּבְנֵי גָד וַחֲצִי שֵׁבֶט הַמְנַשֶּׁה
  choice: ரூபன் வம்சத்தாரும் காத் வம்சத்தாரும் மனாசேயின் பாதிக் கோத்திரத்தாரும்
  rationale: בני என்பதைச் சொற்சொல்லாக ‘மகன்கள்’ என்று மொழிபெயர்ப்பதைவிட, இங்கு இனக்குழுவைக் குறிக்கும் இயல்பான தமிழ் ‘வம்சத்தார்’ பொருத்தமானது; חצי שבט என்பதற்கு ‘பாதிக் கோத்திரம்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: מֵאֵת בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்களிடமிருந்து
  rationale: பெரிய இஸ்ரவேல் கூட்டத்திடமிருந்து பிரிந்து சென்றதைக் குறிக்கும் מֵאֵת என்பதன் பிரிவுப் பொருளைத் தெளிவாகக் காட்டுகிறது.
- source_word: מִשִּׁלֹה אֲשֶׁר בְּאֶרֶץ כְּנָעַן
  choice: கானான் நாட்டிலுள்ள சீலோவில்
  rationale: எபிரெய உறவுத்தொடரைச் சுருக்கமான, இயல்பான தமிழ் இடவமைப்பில் வழங்குகிறது; புறப்படும் இடம் சீலோ என்பதும் அது கானானில் இருப்பதும் தெளிவாகின்றன.
- source_word: אֶל אֶרֶץ הַגִּלְעָד אֶל אֶרֶץ אֲחֻזָּתָם
  choice: தாங்கள் உரிமையாகப் பெற்றிருந்த கீலேயாத் நாட்டுக்கு
  rationale: இரண்டு אֶל אֶרֶץ தொடர்களும் ஒரே இடத்தை விளக்கும் மறுகுறிப்பாக இருப்பதால் தமிழில் ஒருங்கிணைக்கப்பட்டுள்ளன; אֲחֻזָּה என்பதன் சட்டப்பூர்வ நிலவுரிமை உணர்வு ‘உரிமையாக’ என்பதில் பாதுகாக்கப்படுகிறது.
- source_word: אֲשֶׁר נֹאחֲזוּ בָהּ
  choice: தாங்கள் உரிமையாகப் பெற்றிருந்த[a]
  rationale: נחל அல்ல, אחז வேரின் நிபால் வடிவம்; நிலத்தைப் பெற்று அதில் உரிமையுடன் நிலைபெற்றிருந்த முடிவுநிலையை இத்தேர்வு காட்டுகிறது. கைப்பற்றுதல் என்ற செயற்பாட்டு நிழற்பொருள் சாத்தியமுள்ளதால் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: עַל פִּי יְהוָה
  choice: யாவே கட்டளையிட்டபடி
  rationale: עַל־פִּי என்ற மரபுத்தொடரின் ‘கட்டளையின்படி’ என்ற பொருளையும் יהוה என்ற உடன்படிக்கைப் பெயரையும் தெளிவாக வழங்குகிறது.
- source_word: בְּיַד מֹשֶׁה
  choice: மோசேயின் மூலம்
  rationale: ביד இங்கு கருவி அல்லது இடைமுக முகமையைக் குறிக்கிறது; கட்டளை மோசேயின் வழியாக வழங்கப்பட்டது என்பதை இயல்பான தமிழில் தெரிவிக்கிறது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரின் மொழியாக்கம்
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலத்தில் தனிப்பட்ட இறைப்பெயரான நான்கெழுத்துப் பெயர் நேரடியாக இருப்பதால், பட்டப்பெயராக மாற்றாமல் ‘Yahweh’ என்பதற்குரிய தமிழ் ஒலிபெயர்ப்பு பயன்படுத்தப்படுகிறது.
- issue: நிலத்தைப் பெற்ற விதத்துக்கும் யாவேயின் கட்டளைக்கும் உள்ள தொடர்பு
  choice: ‘கட்டளையிட்டபடி’ என்பதை நிலவுரிமை பெற்றிருந்ததுடன் இணைத்தல்
  alternative: அவர்கள் இப்போது திரும்பிச் சென்றதற்கான கட்டளையாக வாசித்தல்
  rationale: எபிரெய தொடரமைப்பில் עַל פי יהוה בְּיַד משֶׁה என்பது அருகிலுள்ள אֲשֶׁר נֹאחֲזוּ בָהּ-ஐ விளக்கி, மோசேயின் மூலம் வந்த யாவேயின் கட்டளையின்படி அவர்கள் அந்த நிலத்தை உரிமையாகப் பெற்றிருந்ததைச் சுட்டுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டுள்ளது. எபிரெய வாக்கியத்தின் இரட்டை இயக்க வினைகள் தமிழில் இயல்பாக மறுவரிசைப்படுத்தப்பட்டுள்ளன; இடப்பெயர்களும் கோத்திரப் பெயர்களும் பரவலாக அறியப்பட்ட தமிழ் வடிவங்களில் தரப்பட்டுள்ளன.
