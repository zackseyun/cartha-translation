  text: הַ/מְעַט לָ֨/נוּ֙ אֶת עֲוֺ֣ן פְּע֔וֹר אֲשֶׁ֤ר לֹֽא הִטַּהַ֨רְנוּ֙ מִמֶּ֔/נּוּ עַ֖ד הַ/יּ֣וֹם הַ/זֶּ֑ה וַ/יְהִ֥י הַ/נֶּ֖גֶף בַּ/עֲדַ֥ת יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/017.yaml
  text: Was the iniquity of Peor too little for us[a], from which we have not cleansed ourselves to this day[b], and the plague came upon the congregation of Yahweh?
translation:
  language: ta
  text: பெயோரின் அக்கிரமம் நமக்குப் போதாதா?[a][b] அதிலிருந்து இன்றுவரை நாம் நம்மைத் தூய்மைப்படுத்திக்கொள்ளவில்லை; யாவேயின் சபையின்மேல் கொள்ளைநோய் வந்ததல்லவா?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அக்கிரமம்’ என்பதற்கான எபிரெயச் சொல் ‘குற்றப்பழி’ என்றும், சில இடங்களில் அந்தக் குற்றத்தின் விளைவு என்றும் பொருள்படலாம்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெய மூலத்தில் ‘பெயோர்’ என்று மட்டுமே உள்ளது; தொடர்புடைய பிற பகுதிகளில் ‘பாகால்-பெயோர்’ என்ற விரிவான பெயர் வருகிறது.
    reason: cross_reference
lexical_decisions:
- source_word: הַמְעַט לָנוּ
  choice: நமக்குப் போதாதா?
  rationale: இது கண்டிக்கும் தொனியுள்ள சொல்லாட்சிக் கேள்வி. ‘நமக்குச் சிறிதாயிருந்ததா?’ என்பதைவிட நவீனத் தமிழில் இயல்பாகவும் அதே வலிமையுடனும் உள்ளது.
- source_word: עֲוֺן פְּעוֹר
  choice: பெயோரில் நடந்த அக்கிரமம்
  rationale: பெயோர் சம்பவத்துடன் தொடர்புடைய பாவக் குற்றத்தைச் சுட்டுகிறது. எபிரெயச் சொல்லிலுள்ள ‘அக்கிரமம்/குற்றப்பழி’ என்ற பொருள் விரிவை அடிக்குறிப்பில் பாதுகாக்கிறது.
- source_word: אֲשֶׁר לֹא הִטַּהַרְנוּ מִמֶּנּוּ
  choice: அதிலிருந்து ... நாம் நம்மைத் தூய்மைப்படுத்திக்கொள்ளவில்லை
  rationale: הִטַּהַרְנוּ என்பதன் தற்சுட்டுப் பொருளையும், சமூகமே அந்தத் தீட்டிலிருந்து இன்னும் தூய்மையடையவில்லை என்பதையும் வெளிப்படுத்துகிறது.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: இன்றுவரை
  rationale: பேசுபவரின் நிகழ்காலம்வரை நிலை தொடர்கிறது என்பதை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: וַיְהִי הַנֶּגֶף
  choice: கொள்ளைநோயும் வந்ததே
  rationale: வினைச்சொல்லுக்கு இல்லாத காரணத் தொடர்பைச் சேர்க்காமல், பெயோர் சம்பவத்தில் ஏற்பட்ட கொடிய நோய்த்தாக்குதலை நினைவூட்டுகிறது. ‘-தே’ கண்டிக்கும் நினைவூட்டல் தொனியைத் தருகிறது.
- source_word: בַּעֲדַת יְהוָה
  choice: யாவேயின் சபையின்மேல்
  rationale: עֵדָה என்பதன் உடன்படிக்கை மக்கள்சமூகப் பொருளை ‘சபை’ தருகிறது; יְהוָה என்ற திருப்பெயர் ‘யாவே’ என ஒலிபெயர்க்கப்படுகிறது.
theological_decisions:
- issue: עָוֹן என்பதன் பொருள் விரிவு
  choice: அக்கிரமம்
  alternative: குற்றப்பழி
  rationale: சொல் பாவச்செயலையும் அதனால் ஏற்பட்ட குற்றப்பழியையும் குறிக்கக்கூடும். முதன்மை உரை ஒழுக்கக் குற்றத்தை முன்னிறுத்துகிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- issue: יְהוָה என்ற இறைப்பெயர்
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூலத்தில் உள்ள தனிப்பட்ட உடன்படிக்கைப் பெயரை பொதுப்பட்டமாக மாற்றாமல் ஒலிபெயர்க்கிறது.
- issue: கொள்ளைநோய்க் கூற்றின் தொடர்பு
  choice: இணைப்புக் கூற்றாக வைத்தல்
  alternative: ‘அதனால் கொள்ளைநோய் வந்தது’
  rationale: மூலத்தில் காரணத்தைக் குறிக்கும் தனிச்சொல் இல்லை. ஆகவே காரணத் தொடர்பை வெளிப்படையாகச் சேர்க்காமல் உள்ளார்ந்த தொடர்பை வாசகரிடம் திறந்தே வைக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், கண்டிக்கும் சொல்லாட்சிக் கேள்வியின் வலிமையையும் வேதாகமத்திற்குரிய கண்ணியமான நடையையும் இணைக்கிறது. தேவையற்ற காரணவிளக்கத்தைச் சேர்க்காமல் மூலத்தின் தொடரமைப்பைப் பாதுகாக்கிறது.
