  source_fidelity: மூலத்தின் முக்கியப் பொருள்கள்—யாவே, ஓய்வு அளித்தல், சகோதரர்கள், கூடாரங்கள், உரிமை நிலம், யோர்தானுக்கு அப்பால்—பொதுவாகத் துல்லியமாகக் கொடுக்கப்பட்டுள்ளன. ஆனால் சகோதரர்கள் பற்றிய விளக்கக் குறிப்பின் குறியீடு வாக்கிய முடிவில் இருப்பதால், அது குறிக்கும் சொல்லுடன் நேரடியாக இணைக்கப்படவில்லை. மேலும், இடைக்கோட்டுக்குள் அமைந்த நீண்ட நிலவிளக்கம் தமிழில் வாசிப்போட்டத்தைத் தடைக்கிறது.
