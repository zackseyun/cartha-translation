  text: וְ/עַתָּ֗ה הֵנִ֨יחַ יְהוָ֤ה אֱלֹֽהֵי/כֶם֙ לַֽ/אֲחֵי/כֶ֔ם כַּ/אֲשֶׁ֖ר דִּבֶּ֣ר לָ/הֶ֑ם וְ/עַתָּ֡ה פְּנוּ֩ וּ/לְכ֨וּ לָ/כֶ֜ם לְ/אָהֳלֵי/כֶ֗ם אֶל אֶ֨רֶץ֙ אֲחֻזַּתְ/כֶ֔ם אֲשֶׁ֣ר נָתַ֣ן לָ/כֶ֗ם מֹשֶׁה֙ עֶ֣בֶד יְהוָ֔ה בְּ/עֵ֖בֶר הַ/יַּרְדֵּֽן־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/004.yaml
  text: And now Yahweh your God has given rest to your brothers[a], just as he spoke to them. So now turn and go to your tents, to the land of your possession[d][c][b], which Moses the servant of Yahweh gave you beyond the Jordan.
translation:
  language: ta
  text: இப்போது உங்கள் கடவுளாகிய யாவே, தாம் அவர்களிடம் கூறியபடியே, உங்கள் சகோதரர்களுக்கு[c] ஓய்வு அளித்திருக்கிறார். ஆகவே, இப்போது நீங்கள் உங்கள் உரிமை நிலத்திலுள்ள உங்கள் கூடாரங்களுக்குத்[a] திரும்பிச் செல்லுங்கள்; அந்த நிலத்தை யோர்தானுக்கு அப்பால்[b] யாவேயின் ஊழியரான மோசே உங்களுக்குக் கொடுத்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘உங்கள் வீடுகளுக்கு’ என்றும் மொழிபெயர்க்கலாம்; எபிரெயத்தில் நேரடியாக ‘உங்கள் கூடாரங்களுக்கு’ என்று உள்ளது.
    reason: lexical_alternative
  - marker: b
    text: ‘யோர்தானின் மறுபுறத்தில்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: ‘சகோதரர்கள்’ என்பது இவர்களுடைய சக இஸ்ரவேலரைக் குறிக்கிறது.
    reason: referent_clarification
lexical_decisions:
- source_word: הֵנִיחַ
  choice: ஓய்வு அளித்திருக்கிறார்
  rationale: நוח என்பதன் ஹிஃபீல் வடிவம் இங்கு போர் மற்றும் எதிரிகளிடமிருந்து ஓய்வு அல்லது நிம்மதி அளிப்பதைக் குறிக்கிறது; தமிழ் வழக்கில் இயல்பாகவும் மூலத்துக்கு நெருக்கமாகவும் உள்ளது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரான நான்கெழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் தெளிவான ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: אֱלֹהֵיכֶם
  choice: உங்கள் கடவுளாகிய
  rationale: இங்கு யாவேயைக் குறிக்கும் ஒருமைப் பொருள் தெளிவாக இருப்பதால், உடைமை உறவை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: לַאֲחֵיכֶם
  choice: உங்கள் சகோதரர்களுக்கு
  rationale: எபிரெய ஆண்பால் பன்மையைப் பாதுகாக்கிறது; சூழலில் இது மற்ற இஸ்ரவேலரைக் குறிக்கிறது.
- source_word: כַּאֲשֶׁר דִּבֶּר לָהֶם
  choice: தாம் அவர்களிடம் கூறியபடியே
  rationale: דבר என்பதன் அடிப்படைப் பொருளான ‘கூறுதல்/பேசுதல்’ என்பதைக் காக்கிறது; ‘வாக்களித்தபடியே’ என்பது சூழலுக்கு ஏற்றிருந்தாலும் விளக்கவுரை சார்ந்தது.
- source_word: פְּנוּ וּלְכוּ לָכֶם
  choice: நீங்கள் திரும்பி ... செல்லுங்கள்
  rationale: פנה என்பதிலுள்ள திரும்புதல் என்ற காட்சியையும், הלך என்பதிலுள்ள செல்லுதல் என்ற கட்டளையையும் இயல்பான தமிழில் காக்கிறது; לָכֶם என்ற நெறிசார் தத்துவேற்றுமைக்கு தனி சொல் தேவையில்லை.
- source_word: לְאָהֳלֵיכֶם
  choice: உங்கள் கூடாரங்களுக்கு
  rationale: ‘வீடுகள்’ என்ற இயல்பான பொருள் சாத்தியமானாலும், மூலத்தின் நேரடியான வரலாற்றுப் படிமத்தைப் பாதுகாக்கிறது.
- source_word: אֶל אֶרֶץ אֲחֻזַּתְכֶם
  choice: உங்கள் உரிமை நிலத்துக்கு
  rationale: אֲחֻזָּה என்பது சொந்தமாகப் பெற்ற நிலப்பங்கு அல்லது நிலவுடைமையைக் குறிக்கிறது; ‘உரிமை நிலம்’ சுருக்கமாகவும் தெளிவாகவும் உள்ளது, ‘சுதந்தரம்’ என்ற கூடுதல் இறையியல் நிறத்தைத் தவிர்க்கிறது.
- source_word: אֲשֶׁר נָתַן לָכֶם מֹשֶׁה
  choice: மோசே ... உங்களுக்குக் கொடுத்த
  rationale: נתן என்பதன் பொதுவான ‘கொடுத்தல்’ என்ற பொருளை நேரடியாகக் காக்கிறது.
- source_word: עֶבֶד יְהוָה
  choice: யாவேயின் ஊழியரான
  rationale: மோசேயின் கௌரவமிக்க உடன்படிக்கைப் பட்டமாக இருப்பதால் ‘அடிமை’ என்பதைக் காட்டிலும் ‘ஊழியர்’ சூழலுக்கு ஏற்றது.
- source_word: בְּעֵבֶר הַיַּרְדֵּן
  choice: யோர்தானுக்கு அப்பால்
  rationale: பேசுபவரின் இருப்பிடத்திலிருந்து யோர்தானின் மறுபுறத்தைக் குறிக்கும் சொற்றொடரைச் சுருக்கமாகக் காக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலத்தில் தனிப்பட்ட உடன்படிக்கைப் பெயர் நேரடியாக உள்ளது. அதை பொதுப் பட்டமாக மாற்றாமல் ஒலிபெயர்ப்பது மூல வேறுபாட்டைப் பாதுகாக்கிறது.
- issue: ‘கூறியபடியே’ என்பதா, ‘வாக்களித்தபடியே’ என்பதா
  choice: கூறியபடியே
  alternative: வாக்களித்தபடியே
  rationale: சூழலில் கூறியது வாக்குறுதியாகப் புரிந்துகொள்ளப்படலாம்; ஆயினும் דבר என்ற வினைச்சொல் நேரடியாக ‘கூறினார்’ என்பதால், மூலத்தின் சொல் சார்ந்த திறந்த தன்மை பாதுகாக்கப்படுகிறது.
- issue: אֲחֻזָּה என்பதற்கு ‘உரிமை நிலம்’ அல்லது ‘சுதந்தர நிலம்’
  choice: உரிமை நிலம்
  alternative: சுதந்தர நிலம்
  rationale: இச்சொல் நிலவுடைமை அல்லது ஒதுக்கப்பட்ட நிலப்பங்கைக் குறிக்கிறது. ‘சுதந்தரம்’ சாத்தியமானதாக இருந்தாலும், இங்கு தேவையற்ற இறையியல் விரிவாக்கத்தை ஏற்படுத்தலாம்.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய வாக்கியத்தின் நீண்ட நிலவிளக்கத் தொடரைத் தமிழில் புரிந்துகொள்ள உதவும் வகையில் இடைக்கோடுகளால் அமைத்துள்ளோம். ‘கூடாரங்கள்,’ ‘உரிமை நிலம்,’ ‘யாவே’ போன்ற சொற்கள் மூலத்தின் வரலாற்று மற்றும் சொற்பொருள் தன்மையைப் பாதுகாக்கின்றன.
