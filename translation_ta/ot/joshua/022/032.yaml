  text: וַ/יָּ֣שָׁב פִּֽינְחָ֣ס בֶּן אֶלְעָזָ֣ר הַ/כֹּהֵ֣ן וְ/הַ/נְּשִׂיאִ֡ים מֵ/אֵ֣ת בְּנֵֽי רְאוּבֵן֩ וּ/מֵ/אֵ֨ת בְּנֵי גָ֜ד מֵ/אֶ֧רֶץ הַ/גִּלְעָ֛ד אֶל אֶ֥רֶץ כְּנַ֖עַן אֶל בְּנֵ֣י יִשְׂרָאֵ֑ל וַ/יָּשִׁ֥בוּ אוֹתָ֖/ם דָּבָֽר־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/032.yaml
  text: Then Phinehas son of Eleazar the priest[a], and the leaders, returned from the sons of Reuben and from the sons of Gad, from the land of Gilead to the land of Canaan, to the sons of Israel[b], and brought back word to them.
translation:
  language: ta
  text: ஆசாரியனான எலெயாசாரின் மகன் பினெகாஸும் தலைவர்களும், ரூபன் கோத்திரத்தாரையும் காத் கோத்திரத்தாரையும் விட்டு, கீலேயாத் நாட்டிலிருந்து கானான் நாட்டிற்கு, இஸ்ரவேல் மக்களிடம் திரும்பி வந்து, அவர்களுக்குச் செய்தி தெரிவித்தார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்களிடம் விவகாரத்தைத் தெரிவித்தார்கள்.” எபிரெயச் சொல் דָּבָר என்பதற்கு இச்சூழலில் “சொல்,” “செய்தி,” அல்லது “விவகாரம்” என்று பொருள் கொள்ளலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: திரும்பி வந்து
  rationale: שׁוב என்ற வினையின் திரும்புதலை இயல்பான தமிழில் வெளிப்படுத்துகிறது; கீலேயாத்திலிருந்து கானானிலுள்ள இஸ்ரவேலரிடம் வந்த திசையையும் சூழல் தெளிவாக்குகிறது.
- source_word: פִּינְחָס בֶּן אֶלְעָזָר הַכֹּהֵן
  choice: ஆசாரியனான எலெயாசாரின் மகன் பினெகாஸ்
  rationale: எபிரெயத் தொடரில் ‘ஆசாரியன்’ என்பது இலக்கணப்படி எலெயாசாரை அடையாளப்படுத்துகிறது; தமிழ் சொல் வரிசை அந்த உறவைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: וְהַנְּשִׂיאִים
  choice: தலைவர்களும்
  rationale: נְשִׂיאִים என்பது இங்கு கோத்திரத் தலைவர்களைக் குறிக்கிறது; ‘தலைவர்கள்’ அரசாட்சியைத் தேவையின்றி உணர்த்தாத நவீன பொதுத் தமிழ்.
- source_word: מֵאֵת בְּנֵי רְאוּבֵן וּמֵאֵת בְּנֵי גָד
  choice: ரூபன் கோத்திரத்தாரையும் காத் கோத்திரத்தாரையும் விட்டு
  rationale: בְּנֵי + கோத்திரப் பெயர் என்பது அந்தக் கோத்திர மக்களைக் குறிக்கும் மரபுத்தொடர். ‘கோத்திரத்தார்’ தமிழில் இயல்பாகவும் துல்லியமாகவும் உள்ளது; מֵאֵת இங்குள்ள புறப்படுதலை ‘விட்டு’ தெரிவிக்கிறது.
- source_word: מֵאֶרֶץ הַגִּלְעָד אֶל אֶרֶץ כְּנַעַן
  choice: கீலேயாத் நாட்டிலிருந்து கானான் நாட்டிற்கு
  rationale: மூலத்தின் אֶרֶץ என்ற புவியியல் சொல்லையும், ‘இருந்து—நோக்கி’ என்ற இடமாற்ற வேறுபாட்டையும் பாதுகாக்கிறது.
- source_word: אֶל בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்களிடம்
  rationale: ‘இஸ்ரவேலின் மகன்கள்’ என்பது இங்கு இனக்குழுவைக் குறிக்கும் எபிரெய மரபுத்தொடர்; ‘இஸ்ரவேல் மக்கள்’ நவீன தமிழில் அதன் பொருளை இயல்பாக வழங்குகிறது.
- source_word: וַיָּשִׁבוּ אוֹתָם דָּבָר
  choice: நடந்ததை அவர்களுக்குத் தெரிவித்தார்கள்
  rationale: இந்தச் சூழலில் דָּבָר என்பது சொல், செய்தி அல்லது நிகழ்ந்த காரியம்/விவகாரம் எனப் பொருள்படலாம். முழுத் தொடர் தூதுக்குழு பதில் செய்தியை அறிவித்ததைக் குறிக்கிறது; தமிழில் இயல்பான வடிவம் தேர்ந்தெடுக்கப்பட்டது, மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
