translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. எபிரெயக் கோத்திர மரபுத்தொடர்கள் இயல்பான தமிழுக்காக ‘கோத்திரத்தார்’ மற்றும் ‘மக்கள்’ என வழங்கப்பட்டுள்ளன. வாக்கியத்தின் இடமாற்ற வரிசையும் அறிக்கை அளிக்கும் முடிவும் பாதுகாக்கப்பட்டுள்ளன.
