  text: וְ/אַתֶּם֙ תָּשֻׁ֣בוּ הַ/יּ֔וֹם מֵ/אַחֲרֵ֖י יְהוָ֑ה וְ/הָיָ֗ה אַתֶּ֞ם תִּמְרְד֤וּ הַ/יּוֹם֙ בַּֽ/יהוָ֔ה וּ/מָחָ֕ר אֶֽל כָּל עֲדַ֥ת יִשְׂרָאֵ֖ל יִקְצֹֽף־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/018.yaml
  text: And you are turning away today from following Yahweh[a]; and if you rebel today against Yahweh[c][b], tomorrow he will be angry with the whole congregation of Israel.
translation:
  language: ta
  text: நீங்களோ இன்று யாவேவைப் பின்பற்றுவதிலிருந்து[a] விலகிக்கொண்டிருக்கிறீர்கள்[b]; நீங்கள் இன்று யாவேக்கு எதிராகக் கிளர்ச்சி செய்தால், நாளை அவர்[c] இஸ்ரவேலின் முழுக் கூட்டத்தின்மீதும் கோபங்கொள்வார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லர்த்தமாக, ‘யாவேக்குப் பின்னாலிருந்து’; இது அவரைப் பின்பற்றுவதை நிறுத்துவதைக் குறிக்கும் எபிரெய மொழிநடை.
    reason: lexical_alternative
  - marker: b
    text: ‘திரும்புகிறீர்கள்’ என்றும் மொழிபெயர்க்கலாம். இச்சூழலில் அந்த எபிரெய வினை, விசுவாசமின்றி விலகிச் செல்வதைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: c
    text: எபிரெயத்தில் ‘கோபங்கொள்வார்’ என்ற வினை மட்டுமே உள்ளது; சூழலின்படி அதன் எழுவாய் யாவேவைக் குறிக்கிறது.
    reason: implicit_subject
lexical_decisions:
- source_word: תָּשֻׁבוּ
  choice: விலகிக்கொண்டிருக்கிறீர்கள்
  rationale: שׁוב என்பதற்கு பொதுவாக ‘திரும்புதல்’ என்று பொருள் இருந்தாலும், מֵאַחֲרֵי என்பதுடன் இங்கு யாவேவைப் பின்பற்றுவதை விட்டுவிலகும் விசுவாசமற்ற செயலைக் குறிக்கிறது. நிகழ்ந்துகொண்டிருக்கும் குற்றச்சாட்டின் தொனியைத் தமிழில் இயல்பாக வெளிப்படுத்த இந்த வடிவம் தேர்ந்தெடுக்கப்பட்டது.
- source_word: מֵאַחֲרֵי יְהוָה
  choice: யாவேவைப் பின்பற்றுவதிலிருந்து
  rationale: சொல்லர்த்தமாக ‘யாவேக்குப் பின்னாலிருந்து’ என்ற எபிரெய மொழிநடை, அவரைப் பின்பற்றுவதை நிறுத்துவதைக் குறிக்கிறது. தமிழ் வாசகருக்குத் தெளிவாகவும் மூல உருவகத்தை இயன்றவரை காத்தும் மொழிபெயர்க்கப்பட்டது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய நான்கெழுத்துத் திருப்பெயரின் பரவலாக ஏற்றுக்கொள்ளப்படும் ஒலிப்பைத் தமிழில் குறிக்கிறது; ‘கர்த்தர்’ என்ற பட்டத்தால் தனிப்பெயரை மாற்றவில்லை.
- source_word: וְהָיָה
  choice: செய்தால்
  rationale: சொல்லர்த்தமாக ‘அப்போது நிகழும்’ என இருந்தாலும், இவ்வமைப்பில் அடுத்துவரும் விளைவுக்கான நிபந்தனையை அறிமுகப்படுத்துகிறது. தமிழில் நிபந்தனை வினைமுற்று இயல்பாக உள்ளது.
- source_word: תִּמְרְדוּ
  choice: கிளர்ச்சி செய்தால்
  rationale: מרד என்பது உரிய அதிகாரத்திற்கு எதிரான வலுவான கலகத்தையும் உடன்படிக்கை விசுவாசமின்மையையும் குறிக்கிறது. ‘கிளர்ச்சி செய்தல்’ அதன் வலிமையை மிகைப்படுத்தாமல் காக்கிறது.
- source_word: בַּיהוָה
  choice: யாவேக்கு எதிராக
  rationale: מרד என்பதுடன் வரும் בְּ இங்கு எதிர்ப்புப் பொருளுடையது; எனவே தமிழில் ‘எதிராக’ என்று வெளிப்படையாகக் கொடுக்கப்பட்டது.
- source_word: וּמָחָר
  choice: நாளை
  rationale: உடனடியாக வரவிருக்கும் விளைவின் கால அவசரத்தை நேரடியாகக் காக்கிறது.
- source_word: יִקְצֹף
  choice: கோபங்கொள்வார்
  rationale: קצף கடுமையான கோபத்தை அல்லது சினத்தைச் சுட்டுகிறது. ‘கோபங்கொள்வார்’ நவீனத் தமிழில் கண்ணியமாகவும் தெளிவாகவும் உள்ளது.
- source_word: כָּל עֲדַת יִשְׂרָאֵל
  choice: இஸ்ரவேலின் முழுக் கூட்டத்தின்மீதும்
  rationale: עֵדָה தனிநபர்களை மட்டும் அல்லாமல் ஒன்றாகக் கருதப்படும் இஸ்ரவேல் சமூகக் கூட்டத்தைக் குறிக்கிறது. ‘முழுக் கூட்டம்’ அதன் கூட்டு அடையாளத்தைக் காக்கிறது; ‘சபை’ என்பதன் நவீன திருச்சபை சார்ந்த தவறான புரிதலையும் தவிர்க்கிறது.
theological_decisions:
- issue: יִקְצֹף என்பதன் வெளிப்படையாகக் கூறப்படாத எழுவாய்
  choice: சூழலில் யாவேதான் எழுவாய்; உரையில் ‘அவர்’ என்று வைத்தல்
  alternative: எழுவாயைக் குறிப்பிடாமல் ‘கோபம் உண்டாகும்’ என்று மொழிபெயர்த்தல்
  rationale: முந்தைய இரு சொற்றொடர்களிலும் யாவே பெயரிடப்படுகிறார்; அவருக்கு எதிரான விலகலும் கிளர்ச்சியும் முழு இஸ்ரவேல்மீது அவருடைய கோபத்தை வரவழைக்கும் என்பதே சூழலின் இயல்பான தொடர்பு. அதேவேளை, எபிரெயத்தில் பெயர் மீண்டும் வராததால் தமிழிலும் ‘யாவே’ என்று சேர்க்காமல் ‘அவர்’ என வைத்தோம்.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையைப் பயன்படுத்துகிறது. ‘நீங்களோ’ என்பது எபிரெயத்தின் வலியுறுத்தப்பட்ட אַתֶּם என்பதை வெளிப்படுத்துகிறது. முதல் கூறை கேள்வியாக மாற்றாமல் குற்றச்சாட்டாக வைத்திருப்பது, மூலத்தில் வெளிப்படையான கேள்விக்குறி இல்லாததையும் அதன் உரையாடல் சார்ந்த கேள்வித் தொனி சாத்தியத்தையும் தேவையின்றித் தீர்மானிக்காமல் காக்கிறது.
