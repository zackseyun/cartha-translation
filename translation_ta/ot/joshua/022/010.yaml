base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/010.yaml
  text: When they came to the region of the Jordan that is in the land of Canaan[b][a], the sons of Reuben and the sons of Gad and the half-tribe of Manasseh built there an altar by the Jordan—an altar great in appearance.
translation:
  language: ta
  text: அவர்கள் கானான் நாட்டிலுள்ள யோர்தான் வட்டாரத்திற்கு[a] வந்தபோது, ரூபனின் மக்களும் காதின் மக்களும் மனாசேயின் பாதிக் கோத்திரத்தினரும் அங்கே யோர்தான் அருகே ஒரு பலிபீடத்தைக் கட்டினார்கள்—தோற்றத்தில் பெரியதாய் இருந்த ஒரு பலிபீடம்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யோர்தானின் மாவட்டம்” அல்லது “யோர்தானின் எல்லைப் பகுதிகள்.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “காண்பதற்குப் பெரிய ஒரு பலிபீடம்”—அதாவது, பார்வைக்கு குறிப்பிடத்தக்க பெரிய பலிபீடம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: גְּלִילוֹת
  choice: வட்டாரம்
  rationale: சுற்றியுள்ள பகுதி அல்லது மாவட்டம் என்ற புவியியல் பொருளை இயல்பான நவீன தமிழில் தெரிவிக்கிறது; எபிரெயச் சொல்லின் பன்மை வடிவத்தைத் தமிழில் கட்டாயமாகப் பன்மையாக்குவது இங்கு இயல்பற்றதாக இருக்கும்.
- source_word: וַיָּבֹאוּ אֶל
  choice: வந்தபோது
  rationale: தொடர்ந்து நகரும் கதையோட்டத்தையும், முந்தைய நிகழ்வோடு இவ்வசனத்திற்குள்ள காலத் தொடர்பையும் இயல்பாகக் காட்டுகிறது.
- source_word: אֲשֶׁר בְּאֶרֶץ כְּנָעַן
  choice: கானான் நாட்டிலுள்ள
  rationale: குறிப்பிடப்படுவது எந்த யோர்தான் வட்டாரம் என்பதைத் தெளிவுபடுத்தும் எபிரெய உறவுநிலைக் கூற்றைச் சுருக்கமின்றி காக்கிறது.
- source_word: בְנֵי רְאוּבֵן / בְנֵי גָד
  choice: ரூபனின் மக்களும் காதின் மக்களும்
  rationale: குல வழிவந்த மக்களைக் குறிக்கும் எபிரெய குடும்ப மரபுச் சொல்லாட்சியை நவீன வாசகருக்குப் புரியும் இயல்பான தமிழில் தருகிறது.
- source_word: חֲצִי שֵׁבֶט הַמְנַשֶּׁה
  choice: மனாசேயின் பாதிக் கோத்திரத்தினர்
  rationale: மனாசே கோத்திரத்தின் ஒரு பாதியைக் குறிக்கும் மூலமொழிக் கட்டமைப்பைத் தெளிவாகவும் சுருக்கமாகவும் தெரிவிக்கிறது.
- source_word: מִזְבֵּחַ
  choice: பலிபீடம்
  rationale: பலியிடுவதுடன் தொடர்புடைய வழிபாட்டு அமைப்புக்கான வழக்கமான, தெளிவான தமிழ் இணைச்சொல்.
- source_word: עַל הַיַּרְדֵּן
  choice: யோர்தான் அருகே
  rationale: புவியியல் சூழலில் עַל குறிக்கும் அண்மையைத் தமிழில் இயல்பாகத் தருகிறது; ஆற்றின் மேலே கட்டப்பட்டது என்ற தவறான பொருளைத் தவிர்க்கிறது.
- source_word: מִזְבֵּחַ גָּדוֹל לְמַרְאֶה
  choice: தோற்றத்தில் பெரியதான ஒரு பலிபீடம்
  rationale: பலிபீடத்தின் காணத்தக்க பெருமையைக் கூறுகிறது; அதன் அளவா, பிரம்மாண்டத் தோற்றமா என்பதைக் தேவையின்றித் தீர்மானிக்காமல் மூலத்தின் நெகிழ்வைத் தக்கவைக்கிறது.
theological_decisions:
- issue: இது போட்டி வழிபாட்டுக்கான பலிபீடம் என்ற சாத்தியமான உட்குறிப்பு
  choice: கட்டப்பட்டதையும் அதன் குறிப்பிடத்தக்க தோற்றத்தையும் மட்டும் விவரித்தல்
  alternative: மாற்று வழிபாட்டுக்காக ஒரு பிரம்மாண்டமான பலிபீடத்தைக் கட்டினார்கள்
  rationale: இந்த வசனம் அதன் நோக்கத்தையோ முறையான தீர்ப்பையோ இன்னும் வெளிப்படுத்தவில்லை. ஆகவே அடுத்துவரும் கதையின் இறையியல் பதற்றத்தை முன்கூட்டியே தீர்க்காமல், செயலை நடுநிலையாக விவரிக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகருக்குப் புரியும் வகையில் எழுதப்பட்டுள்ளது. “கோத்திரம்,” “பலிபீடம்” போன்ற நிலைபெற்ற வேதாகமச் சொற்கள் கண்ணியமான சமயப் பதிவுக்காகத் தக்கவைக்கப்பட்டுள்ளன; செயற்கையான பழந்தமிழ் வினைமுற்றுகள் தவிர்க்கப்பட்டுள்ளன.
