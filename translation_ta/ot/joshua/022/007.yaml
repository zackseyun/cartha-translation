base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/007.yaml
  text: To the one half-tribe of Manasseh Moses had given land in Bashan[a], but to the other half Joshua gave land with their brothers beyond the Jordan westward. And when Joshua sent them away to their tents, he blessed them.
translation:
  language: ta
  text: மனாசே கோத்திரத்தின் ஒரு பாதிக்கு மோசே பாசானில் நிலம் கொடுத்திருந்தார்; மற்ற பாதிக்கோ யோர்தானுக்கு அப்பால், மேற்கே, அவர்களுடைய சகோதரர்களுடன் யோசுவா நிலம் கொடுத்தார்[a]. யோசுவா அவர்களை அவர்களுடைய கூடாரங்களுக்கு அனுப்பிவைத்தபோது, அவர்களை ஆசீர்வதித்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மொழியில், ‘அவர்களுடைய சகோதரர்களுடன்.’ இச்சொல் மற்ற கோத்திரங்களைச் சேர்ந்த அவர்களுடைய சக இஸ்ரவேலரைக் குறிக்கிறது.
    reason: ‘சகோதரர்கள்’ என்ற சொல்லின் சூழல்சார் விரிந்த குறிப்பை விளக்குகிறது.
lexical_decisions:
- source_word: וְלַחֲצִי שֵׁבֶט הַמְנַשֶּׁה
  choice: மனாசே கோத்திரத்தின் ஒரு பாதிக்கு
  rationale: மனாசே கோத்திரம் இரு பிரிவுகளாகப் பகுக்கப்பட்டிருப்பதைத் தெளிவாகவும் இயல்பான தமிழிலும் காட்டுகிறது.
- source_word: נָתַן מֹשֶׁה בַּבָּשָׁן
  choice: மோசே பாசானில் நிலம் கொடுத்திருந்தார்
  rationale: நிலம் என்பது பங்கீட்டுச் சூழலில் புரிந்துகொள்ளப்படும் செயப்படுபொருள்; ‘கொடுத்திருந்தார்’ என்பது யோசுவாவின் பின்னைய பங்கீட்டுக்கு முன்பே மோசே செய்த செயலைத் தமிழில் தெளிவாக்குகிறது.
- source_word: וּלְחֶצְיוֹ
  choice: அதன் மறுபாதிக்கோ
  rationale: பின்னொட்டு மனாசே கோத்திரத்தைக் குறிக்கிறது; ‘மறுபாதி’ முதல் பாதியுடனான எதிர்மறை ஒப்பீட்டை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: עִם אֲחֵיהֶם
  choice: அவர்களுடைய சகோதரர்களோடு
  rationale: எபிரெயச் சொல்லின் நேரடியான உறவுமுறைப் பொருளைத் தக்கவைக்கிறது; இங்கு அது மற்ற இஸ்ரவேல் கோத்திரத்தாரைக் குறிக்கிறது.
- source_word: מֵעֵבֶר הַיַּרְדֵּן יָמָּה
  choice: யோர்தானுக்கு அப்பால், மேற்கே
  rationale: ‘யோர்தானுக்கு அப்பால்’ என்ற இடக்குறிப்பையும் கடல் நோக்கிய திசையாகிய மேற்கையும் வெளிப்படையாகத் தக்கவைக்கிறது.
- source_word: שִׁלְּחָם ... אֶל אָהֳלֵיהֶם
  choice: அவர்களை அவர்களுடைய கூடாரங்களுக்கு அனுப்பிவைத்தபோது
  rationale: பீயேல் வடிவின் அனுப்பிவிடுதல் என்ற பொருளையும் ‘கூடாரங்கள்’ என்ற மூலப்படிமத்தையும் பாதுகாக்கிறது.
- source_word: וַיְבָרֲכֵם
  choice: அவர்களை ஆசீர்வதித்தார்
  rationale: சூழலுக்கேற்ற நேரடியான, வழக்கமான தமிழாக்கம்.
