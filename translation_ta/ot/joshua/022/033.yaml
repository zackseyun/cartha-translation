source:
  edition: WLC
  text: וַ/יִּיטַ֣ב הַ/דָּבָ֗ר בְּ/עֵינֵי֙ בְּנֵ֣י יִשְׂרָאֵ֔ל וַ/יְבָרֲכ֥וּ אֱלֹהִ֖ים בְּנֵ֣י יִשְׂרָאֵ֑ל וְ/לֹ֣א אָמְר֗וּ לַ/עֲל֤וֹת עֲלֵי/הֶם֙ לַ/צָּבָ֔א לְ/שַׁחֵת֙ אֶת הָ/אָ֔רֶץ אֲשֶׁ֛ר בְּנֵי רְאוּבֵ֥ן וּ/בְנֵי גָ֖ד יֹשְׁבִ֥ים בָּֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/033.yaml
  text: And the matter was good in the eyes of the sons of Israel[a], and the sons of Israel blessed God[c][b]. And they did not speak of going up against them in war to destroy the land where the sons of Reuben and the sons of Gad were living.
translation:
  language: ta
  text: அந்தக் காரியம் இஸ்ரவேல் மக்களுக்கு நல்லதாகத் தோன்றியது[a]. இஸ்ரவேல் மக்கள் கடவுளைப் போற்றினர்[b]. ரூபன் மக்களும் காத் மக்களும் வாழ்ந்து வந்த நாட்டை அழிப்பதற்காக, அவர்களுக்கு எதிராகப் போரிடச் செல்ல வேண்டும் என்று இஸ்ரவேல் மக்கள் கூறவில்லை[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லுக்குச் சொல், ‘இஸ்ரவேலின் மகன்கள்.’ இங்கு இது இஸ்ரவேல் மக்களைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: எபிரெய வினைச்சொல்லின் நேரடிப் பொருள் ‘வாழ்த்தினர்.’ கடவுளைச் செயப்படுபொருளாகக் கொண்ட இச்சூழலில் இது ‘போற்றினர்’ அல்லது ‘புகழ்ந்தனர்’ என்ற பொருளில் வருகிறது.
    reason: lexical_alternative
  - marker: c
    text: சொல்லுக்குச் சொல், ‘அவர்களுக்கு எதிராகப் போருக்குச் செல்ல வேண்டும் என்று கூறவில்லை.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּיטַב הַדָּבָר בְּעֵינֵי
  choice: அந்தக் காரியம் ... பார்வைக்கு நல்லதாக இருந்தது
  rationale: எபிரெய மொழியின் மதிப்பீட்டு மரபுத்தொடரான ‘கண்களில் நல்லதாக இருந்தது’ என்பதன் உருவகத்தை, தமிழில் புரிந்துகொள்ளத்தக்க ‘பார்வைக்கு நல்லதாக இருந்தது’ என்று தக்கவைக்கிறது; הַדָּבָר முன்பு கூறப்பட்ட விளக்கத்தைக் குறிக்கும் ‘காரியம்’ என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்கள்
  rationale: சொல்லுக்குச் சொல் வடிவம் ‘இஸ்ரவேலின் மகன்கள்’ என்றாலும், இங்கு முழு இஸ்ரவேல் சமூகத்தைக் குறிக்கும் இயல்பான நவீனத் தமிழ் வடிவம் தேர்ந்தெடுக்கப்பட்டது; நேரடி வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: וַיְבָרֲכוּ אֱלֹהִים
  choice: கடவுளை வாழ்த்தினர்
  rationale: ברך என்பதன் அடிப்படைச் செயற்பொருளான ‘வாழ்த்து/ஆசீர்வதி’ என்பதைத் தக்கவைக்கிறது. கடவுளைச் செயப்படுபொருளாகக் கொண்ட இச்சூழலில் ‘போற்றினர்’ என்பதும் பொருத்தமான விளக்கம் என்பதால் அது அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: וְלֹא אָמְרוּ
  choice: பேசவில்லை
  rationale: சொல்லுக்குச் சொல் ‘சொல்லவில்லை’ என்றாலும், இங்கு இராணுவ நடவடிக்கையை முன்மொழிவதையோ அதைப் பற்றிப் பேசுவதையோ நிறுத்தியதை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: לַעֲלוֹת עֲלֵיהֶם לַצָּבָא
  choice: அவர்களுக்கு எதிராகப் போருக்குச் செல்வதை
  rationale: עלה על என்ற இராணுவப் பயன்பாட்டின் ‘எதிராகச் செல்லுதல்’ என்ற இயக்க உருவகத்தையும், צבא என்பதன் போர்சார் பொருளையும் தக்கவைக்கிறது.
- source_word: לְשַׁחֵת אֶת הָאָרֶץ
  choice: நாட்டை அழிப்பதற்காக
  rationale: שׁחת என்பதன் வலுவான ‘அழித்தல்’ என்ற பொருளையும், אֶרֶץ இங்கு குறிக்கும் குடியிருப்புப் பிரதேசத்தையும் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: יֹשְׁבִים בָּהּ
  choice: வாழ்ந்துவந்த
  rationale: பங்கேற்பு வினை வடிவம் காட்டும் தொடர்ந்த குடியிருப்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: மனிதர்கள் கடவுளை ‘வாழ்த்துதல்’
  choice: கடவுளை வாழ்த்தினர்
  alternative: கடவுளைப் போற்றினர்
  rationale: மூல வினைச்சொல்லின் நேரடிப் பொருளை முதன்மை உரையில் தக்கவைத்து, இச்சூழலில் உள்ள புகழ்தல்/போற்றுதல் என்ற பொருளை அடிக்குறிப்பில் சுட்டுகிறது; குறிப்பிட்ட சமய மரபின் சொல்லாட்சியைத் திணிக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதாகவும் மதிப்புமிக்க நடையிலும் அமைக்கப்பட்டுள்ளது. எபிரெய மொழியின் ‘பார்வைக்கு நல்லது’ மற்றும் ‘எதிராகச் செல்லுதல்’ ஆகிய உருவகங்கள் தமிழில் புரிந்துகொள்ளத்தக்க அளவில் தக்கவைக்கப்பட்டுள்ளன; பெயர்கள் ‘ரூபன்,’ ‘காத்’ என வழக்கமான வேதாகமத் தமிழ் வடிவங்களில் தரப்பட்டுள்ளன.
