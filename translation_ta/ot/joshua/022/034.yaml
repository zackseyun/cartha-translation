base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/034.yaml
  text: And the sons of Reuben and the sons of Gad called the altar Witness[a], for it is a witness between us that Yahweh is God.
translation:
  language: ta
  text: ரூபேனின் மகன்களும் காத்தின் மகன்களும் அந்தப் பலிபீடத்துக்கு “சாட்சி”[a] என்று பெயரிட்டார்கள். ஏனெனில், யாவே கடவுள் என்பதற்கு அது நமக்கிடையே சாட்சியாக இருக்கிறது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, விளக்க வாக்கியத்தையும் பெயரின் ஒரு பகுதியாகக் கொண்டு, “அவர்கள் அந்தப் பலிபீடத்துக்கு ‘யாவே கடவுள் என்பதற்கு நமக்கிடையே ஒரு சாட்சி’ என்று பெயரிட்டார்கள்” என விரிவாக மொழிபெயர்க்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּקְרְאוּ
  choice: பெயரிட்டார்கள்
  rationale: קרא என்பதுடன் לַמִּזְבֵּחַ வருவதால், இங்கு ஒரு பொருளுக்குப் பெயர் சூட்டும் பொருள் தெளிவாக உள்ளது; நவீன தமிழில் ‘பெயரிட்டார்கள்’ இயல்பானதும் துல்லியமானதும் ஆகும்.
- source_word: בְּנֵי רְאוּבֵן וּבְנֵי גָד
  choice: ரூபேனின் மகன்களும் காத்தின் மகன்களும்
  rationale: எபிரெயச் சொற்றொடரின் வம்சாவளி வடிவத்தை வெளிப்படையாகப் பேணுகிறது; பழங்குடிப் பெயர்களாக மட்டும் மாற்றுவதில்லை.
- source_word: לַמִּזְבֵּחַ
  choice: அந்தப் பலிபீடத்துக்கு
  rationale: מִזְבֵּחַ என்பதற்கான வழக்கமான தமிழ் இணை ‘பலிபீடம்’; முன் உரையில் அறியப்பட்ட குறிப்பிட்ட பலிபீடம் என்பதால் ‘அந்த’ சேர்க்கப்பட்டது.
- source_word: עֵד
  choice: சாட்சி
  rationale: இந்தப் பெயர்ச்சொல் ‘சாட்சி’ அல்லது ‘சான்று’ எனப் பொருள்படும். பலிபீடத்துக்குக் கொடுக்கப்பட்ட பெயராகவும், தொடர்ந்து வரும் விளக்கத்துடனும் ‘சாட்சி’ நேரடியாகப் பொருந்துகிறது.
- source_word: כִּי עֵד הוּא בֵּינֹתֵינוּ
  choice: ஏனெனில் … அது நமக்கிடையே சாட்சியாக இருக்கிறது
  rationale: முதல் כִּי பெயருக்கான காரணத்தை அறிமுகப்படுத்துவதாக எடுத்துக்கொள்ளப்படுகிறது; הוּא பலிபீடத்தைக் குறிக்கிறது. ‘நமக்கிடையே’ என்பது בֵּינֹתֵינוּ-வின் உறவுப்பொருளைப் பேணுகிறது.
- source_word: כִּי יְהוָה הָאֱלֹהִים
  choice: யாவேதான் கடவுள் என்பதற்கு
  rationale: இரண்டாம் כִּי சாட்சி உறுதிப்படுத்தும் உள்ளடக்கத்தை அறிமுகப்படுத்துகிறது. வலியுறுத்தும் ‘தான்’ இயல்பான தமிழில் ‘யாவே கடவுள்’ என்ற அறிக்கையின் ஒப்புதல் வலிமையை வெளிப்படுத்துகிறது; தேவையற்ற சமயவிளக்கத்தைச் சேர்ப்பதில்லை.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், எபிரெய நான்கெழுத்துப் பெயரின் பரவலான தமிழ் ஒலிபெயர்ப்பாக வழங்குகிறது.
theological_decisions:
- issue: எஞ்சியுள்ள எபிரெய உரையைவிட நீளமான பலிபீடப் பெயரை முதன்மை உரையில் வழங்க வேண்டுமா?
  choice: முதன்மை உரையில் ‘சாட்சி’ என்பதை மட்டும் பெயராக வழங்குதல்
  alternative: முழு விளக்க வாக்கியத்தையும் ‘யாவேதான் கடவுள் என்பதற்கு நமக்கிடையே ஒரு சாட்சி’ என்ற நீண்ட பெயராகக் கொள்ளுதல்
  rationale: மசோரா உரையில் עֵד (‘சாட்சி’) என்பதற்குப் பின் வரும் பகுதி பெயருக்கான விளக்கமாகவும் வாசிக்கப்படலாம்; முழுப் பகுதியையும் முறையான பெயராகக் கொள்வது சாத்தியமாயினும் வெளிப்படையாகக் குறிக்கப்படவில்லை. ஆகவே சுருக்கமான பெயர் முதன்மை உரையிலும், விரிவான வாசிப்பு அடிக்குறிப்பிலும் வைக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. ‘பெயரிட்டார்கள்,’ ‘பலிபீடம்,’ ‘சாட்சி’ ஆகியவை இயல்பான வேதாகமத் தமிழ் சொற்களாக இருந்தாலும் பழமையான வாக்கிய அமைப்பு தவிர்க்கப்பட்டது. மூலத்தின் பெயர்–விளக்கம் தொடர்பிலுள்ள உண்மையான இருபொருள் வாய்ப்பு அடிக்குறிப்பில் பாதுகாக்கப்பட்டது.
