  text: וַ/יֹּ֨אמֶר אֲלֵי/הֶ֜ם לֵ/אמֹ֗ר בִּ/נְכָסִ֨ים רַבִּ֜ים שׁ֤וּבוּ אֶל אָֽהֳלֵי/כֶם֙ וּ/בְ/מִקְנֶ֣ה רַב מְאֹ֔ד בְּ/כֶ֨סֶף וּ/בְ/זָהָ֜ב וּ/בִ/נְחֹ֧שֶׁת וּ/בְ/בַרְזֶ֛ל וּ/בִ/שְׂלָמ֖וֹת הַרְבֵּ֣ה מְאֹ֑ד חִלְק֥וּ שְׁלַל אֹיְבֵי/כֶ֖ם עִם אֲחֵי/כֶֽם־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/008.yaml
  text: And he said to them[a], “Return to your tents with great wealth, with very much livestock, with silver and gold, with bronze and iron, and with very many garments[c][b]. Divide the plunder of your enemies with your brothers.”
translation:
  language: ta
  text: அவர் அவர்களிடம், “மிகுந்த செல்வத்தோடும், மிகவும் ஏராளமான கால்நடைகளோடும், வெள்ளி, தங்கம், வெண்கலம்[a], இரும்பு ஆகியவற்றோடும், மிகவும் ஏராளமான ஆடைகளோடும் உங்கள் கூடாரங்களுக்குத் திரும்பிச் செல்லுங்கள். உங்கள் எதிரிகளின் கொள்ளைப் பொருளை உங்கள் சகோதரர்களுடன்[b] பகிர்ந்துகொள்ளுங்கள்” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘வெண்கலம்’ என்பதை ‘செம்பு’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘சகோதரர்கள்’ என்பது மற்ற கோத்திரங்களைச் சேர்ந்த அவர்களுடைய சக இஸ்ரவேலரைக் குறிக்கிறது.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר אֲלֵיהֶם לֵאמֹר
  choice: அவர் அவர்களிடம் ... என்றார்
  rationale: எபிரேய உரையின் பேச்சு அறிமுகச் சூத்திரத்தின் முழுப் பொருளையும் இயல்பான நவீனத் தமிழில் தருகிறது; ‘கூறியதாவது’ போன்ற தேவையற்ற மறுபடியுரைத்தலைத் தவிர்க்கிறது.
- source_word: בִּנְכָסִים רַבִּים
  choice: மிகுந்த செல்வத்தோடும்
  rationale: נְכָסִים என்பது சொத்து, உடைமை, செல்வம் ஆகியவற்றைக் குறிக்கும் பரந்த சொல்; தொடர்ந்து வரும் குறிப்பிட்ட பொருட்களின் பட்டியலுக்கு முன் ‘செல்வம்’ இயல்பாக அமைகிறது.
- source_word: שׁוּבוּ אֶל אָהֳלֵיכֶם
  choice: உங்கள் கூடாரங்களுக்குத் திரும்பிச் செல்லுங்கள்
  rationale: ‘கூடாரங்கள்’ என்ற வரலாற்றுச் சூழலைப் பாதுகாத்து, பன்மை கட்டளையின் வலிமையையும் தெளிவாகத் தருகிறது.
- source_word: וּבְמִקְנֶה רַב מְאֹד
  choice: ஏராளமான கால்நடைகளோடும்
  rationale: מִקְנֶה என்பது மாடுகளை மட்டும் அல்லாமல் கால்நடைகளை ஒட்டுமொத்தமாகக் குறிக்கிறது; רַב מְאֹד என்பதன் மிகுதியை ‘ஏராளமான’ வெளிப்படுத்துகிறது.
- source_word: בְּכֶסֶף וּבְזָהָב
  choice: வெள்ளி, தங்கம்
  rationale: உலோகங்களுக்கான நேரடியான, பொதுவாகப் புரியும் தமிழ்ச் சொற்கள்.
- source_word: וּבִנְחֹשֶׁת וּבְבַרְזֶל
  choice: வெண்கலம், இரும்பு
  rationale: נְחֹשֶׁת என்பது செம்பையோ வெண்கலத்தையோ குறிக்கக்கூடும்; பழங்கால உலோகப் பட்டியல்களில் வழக்கமான ‘வெண்கலம்’ முதன்மை உரையில் வைக்கப்பட்டு மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: וּבִשְׂלָמוֹת הַרְבֵּה מְאֹד
  choice: மிக ஏராளமான ஆடைகளோடும்
  rationale: שְׂלָמוֹת என்பதன் பரந்த பொருளை ‘ஆடைகள்’ தருகிறது; הַרְבֵּה מְאֹד என்பதிலுள்ள தீவிர மிகுதியை ‘மிக ஏராளமான’ பாதுகாக்கிறது.
- source_word: חִלְקוּ שְׁלַל אֹיְבֵיכֶם
  choice: உங்கள் எதிரிகளிடமிருந்து கைப்பற்றிய கொள்ளைப் பொருளைப் பகிர்ந்துகொள்ளுங்கள்
  rationale: שָׁלָל என்பதன் போர்ச் சூழலிலான கொள்ளைப் பொருள் என்ற பொருளையும், חִלְקוּ என்பதன் பன்மை கட்டளையையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: עִם אֲחֵיכֶם
  choice: உங்கள் சகோதரர்களுடன்
  rationale: ஆண்பால் பன்மை உறவுச் சொல்லை முறையாகப் பாதுகாக்கிறது; சூழலில் அது மற்ற இஸ்ரவேலரைக் குறிக்கிறது என்பதை அடிக்குறிப்பு விளக்குகிறது.
theological_decisions:
- issue: אֲחֵיכֶם என்ற பாலினம் குறிக்கப்பட்ட உடன்பிறப்புச் சொல்
  choice: உங்கள் சகோதரர்களுடன்
  alternative: உங்கள் சக இஸ்ரவேலருடன்
  rationale: மூல உரையின் ஆண்பால் பன்மை உறவுச் சொல்லை நடுநிலைப்படுத்தாமல் முதன்மை உரையில் பாதுகாக்கிறது; இங்கு அது மற்ற கோத்திரங்களைச் சேர்ந்த சக இஸ்ரவேலரைக் குறிக்கும் சூழல்சார் பொருள் அடிக்குறிப்பில் தெளிவுபடுத்தப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான நடையைக் கடைப்பிடிக்கிறது. பட்டியலின் சேர்க்கைத் தன்மையை ‘-ஓடும்’ அமைப்பு பாதுகாக்கிறது; பழங்காலச் சூழலைக் காட்ட ‘கூடாரங்கள்’ தக்கவைக்கப்பட்டுள்ளது.
