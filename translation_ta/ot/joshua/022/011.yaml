base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/011.yaml
  text: And the sons of Israel heard it said[a], “Look, the sons of Reuben and the sons of Gad and the half-tribe of Manasseh have built the altar opposite the land of Canaan, in the region of the Jordan[d][c][b], on the side of the sons of Israel.”
translation:
  language: ta
  text: இஸ்ரவேல் மக்கள் இவ்வாறு கேள்விப்பட்டார்கள்:[a] “இதோ, ரூபன் வம்சத்தாரும் காத் வம்சத்தாரும் மனாசே கோத்திரத்தின் பாதியினரும் கானான் நாட்டுக்கு எதிரே, யோர்தானின் வட்டாரத்தில்,[b] இஸ்ரவேல் மக்களின் பக்கத்தில்[c] அந்தப் பலிபீடத்தைக் கட்டியிருக்கிறார்கள்.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “இஸ்ரவேல் மக்கள் கேட்டார்கள், சொல்லி” என்று உள்ளது. ‘சொல்லி’ என்பது தொடர்ந்து வரும் செய்தியை அறிமுகப்படுத்தும் வழக்கமான அறிக்கைச் சூத்திரம்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில், “யோர்தானின் வட்டாரங்கள்.” இச்சொற்றொடரின் துல்லியமான புவியியல் நுணுக்கம் உறுதியில்லை.
    reason: cultural_note
  - marker: c
    text: “இஸ்ரவேல் மக்களின் பக்கத்தில்” என்பதற்கு “இஸ்ரவேல் மக்களுக்கு எதிர்ப்புறத்தில்” என்றும் பொருள் கொள்ளலாம். இச்சிக்கலான புவியியல் சொற்றொடர், யோர்தானின் மேற்கே இஸ்ரவேலருக்குரிய பக்கத்தையோ அவர்களுக்கு எதிரான மறுபக்கத்தையோ குறிக்கக்கூடும்.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשְׁמְעוּ בְנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்கள் ... கேட்டார்கள்
  rationale: שׁמע என்பதன் இயல்பான கதைநடைப் பொருளைத் தருகிறது. בְנֵי יִשְׂרָאֵל என்பதைத் தமிழில் இயல்பாகவும் தேசியக் குழுவைக் குறிக்கும் வகையிலும் ‘இஸ்ரவேல் மக்கள்’ என்று மொழிபெயர்க்கிறது.
- source_word: לֵאמֹר
  choice: இவ்வாறு சொல்லப்படுவதைக்
  rationale: கேள்விப்பட்ட செய்தியை அறிமுகப்படுத்தும் எபிரெய அறிக்கைச் சூத்திரத்தை, தமிழில் இயல்பாகத் தருகிறது; அதன் சொற்சார்ந்த மாற்று அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: הִנֵּה
  choice: இதோ
  rationale: அறிக்கையின் உள்ளடக்கத்துக்கு கவனத்தை ஈர்க்கும் இடைச்சொல்லின் வலிமையைக் கண்ணியமான நவீன தமிழில் தக்கவைக்கிறது.
- source_word: בְנֵי רְאוּבֵן וּבְנֵי גָד
  choice: ரூபன் வம்சத்தாரும் காத் வம்சத்தாரும்
  rationale: இங்கு בְנֵי என்பது தனிநபரின் நேரடி மகன்களை மட்டுமல்லாமல் கோத்திர வழியினரைக் குறிப்பதால் ‘வம்சத்தார்’ தெளிவானதும் இயல்பானதும் ஆகும்.
- source_word: וַחֲצִי שֵׁבֶט הַמְנַשֶּׁה
  choice: மனாசேயின் பாதிக் கோத்திரத்தாரும்
  rationale: அரைப் பகுதி மக்களைக் குறிக்கும் எபிரெய அமைப்பைத் தமிழில் தெளிவாகவும் சுருக்கமாகவும் தருகிறது.
- source_word: בָנוּ
  choice: கட்டியிருக்கிறார்கள்
  rationale: முடிவுற்ற செயலின் தற்போதைய தொடர்பை வெளிப்படுத்தும் எபிரெய perfect வடிவத்தைத் தமிழின் நிறைவுநிலை வினையாகத் தருகிறது.
- source_word: הַמִּזְבֵּחַ
  choice: அந்தப் பலிபீடத்தை
  rationale: எபிரெய திட்டவட்டச் சுட்டைத் தமிழில் ‘அந்த’ என்று வெளிப்படுத்துகிறது; உரையாடலில் குறிப்பிட்ட பலிபீடமே சுட்டப்படுகிறது.
- source_word: אֶל מוּל אֶרֶץ כְּנַעַן
  choice: கானான் நாட்டுக்கு எதிரே
  rationale: מוּל குறிக்கும் எதிர்நிலை அல்லது முகப்புநிலையை திசை குறித்து அளவுக்கு மீறித் தீர்மானிக்காமல் தருகிறது.
- source_word: גְּלִילוֹת הַיַּרְדֵּן
  choice: யோர்தானின் வட்டாரத்தில்
  rationale: גְּלִילוֹת என்பதன் மாவட்டங்கள்/வட்டாரங்கள் என்ற புவியியல் பொருளை இயல்பான தமிழில் தருகிறது; துல்லியமான புவியியல் நுணுக்கம் உறுதியற்றது.
- source_word: אֶל עֵבֶר בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்களின் பக்கத்தில்
  rationale: சிக்கலான இறுதிப் புவியியல் தொடரின் ‘பக்கம்’ என்ற உறவுப் பொருளைப் பாதுகாக்கிறது; அது அவர்களுக்குரிய கரையையா அல்லது அவர்களுக்கு எதிர்ப்புறத்தையா குறிப்பதாகும் என்ற தெளிவின்மையை அடிக்குறிப்பு வெளிப்படுத்துகிறது.
