translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. கோத்திர அடையாளங்களுக்கு ‘வம்சத்தார்/கோத்திரத்தார்’ என்றும், வழிபாட்டுச் சொல்லுக்கு ‘பலிபீடம்’ என்றும் பொதுவாகப் புரியும் வடிவங்கள் தேர்ந்தெடுக்கப்பட்டுள்ளன. மூலத்தின் புவியியல் தெளிவின்மை தீர்த்துவிடப்படாமல் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது; அனைத்து அடிக்குறிப்பு குறிகளும் முதன்மை உரையில் இடம்பெறுகின்றன.
