  text: Then Joshua called the Reubenites, the Gadites, and the half-tribe of Manasseh,
translation:
  language: ta
  text: அப்போது, யோசுவா ரூபன் கோத்திரத்தாரையும், காத் கோத்திரத்தாரையும், மனாசேயின் அரைக் கோத்திரத்தாரையும் அழைத்தார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אָז
  choice: அப்போது
  rationale: அடுத்த நிகழ்வை அறிமுகப்படுத்தும் காலச் சுட்டுச் சொல்; நவீன தமிழில் இயல்பாகக் கதைத் தொடர்ச்சியைத் தருகிறது.
- source_word: יִקְרָא
  choice: அழைத்தார்
  rationale: இந்தச் சூழலில் குழுக்களைத் தம்மிடம் வருமாறு அழைப்பதைக் குறிக்கும் எளிய, நேரான தமிழ் சொல்; ‘வரவழைத்தார்’ என்பதைக் காட்டிலும் மூலத்தின் பொதுவான வினைப் பொருளைத் தக்கவைக்கிறது.
- source_word: יְהוֹשֻׁעַ
  choice: யோசுவா
  rationale: இப்பெயரின் வழக்கமான தமிழ் ஒலிபெயர்ப்பு.
- source_word: לָרֽאוּבֵנִי
  choice: ரூபன் கோத்திரத்தாரை
  rationale: ஒருமை வடிவிலுள்ள இனக்குழுப் பெயர் இங்கு மொத்தக் கோத்திரக் குழுவையும் குறிக்கிறது; தமிழில் ‘கோத்திரத்தார்’ என்பது அந்தக் கூட்டுப் பொருளைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: וְלַגָּדִי
  choice: காத் கோத்திரத்தாரை
  rationale: மூலத்தின் இனக்குழு ஒருமை இங்கு கூட்டாகப் பயன்படுகிறது; இயல்பான தமிழில் கோத்திர மக்களைக் குறிக்கும் வகையில் மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: וְלַחֲצִי מַטֵּה מְנַשֶּׁה
  choice: மனாசே கோத்திரத்தின் பாதிப்பேரை
  rationale: מַטֶּה என்பது இங்கு கோத்திரத்தைக் குறிக்கிறது. குறிப்பாக அந்தக் கோத்திரத்தின் ஒரு பாதியைச் சேர்ந்த மக்களை யோசுவா அழைத்தார் என்பதைக் ‘பாதிப்பேர்’ இயல்பாகவும் தெளிவாகவும் தெரிவிக்கிறது.
