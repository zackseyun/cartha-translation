  text: וַ/נֹּ֕אמֶר וְ/הָיָ֗ה כִּֽי יֹאמְר֥וּ אֵלֵ֛י/נוּ וְ/אֶל דֹּרֹתֵ֖י/נוּ מָחָ֑ר וְ/אָמַ֡רְנוּ רְא֣וּ אֶת תַּבְנִית֩ מִזְבַּ֨ח יְהוָ֜ה אֲשֶׁר עָשׂ֣וּ אֲבוֹתֵ֗י/נוּ לֹ֤א לְ/עוֹלָה֙ וְ/לֹ֣א לְ/זֶ֔בַח כִּי עֵ֣ד ה֔וּא בֵּינֵ֖י/נוּ וּ/בֵינֵי/כֶֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/028.yaml
  text: 'So we said[a], ‘If they should say to us or to our generations in time to come, then we will say: “Look at the pattern of the altar of Yahweh, which our fathers made—not for burnt offering and not for sacrifice, but it is a witness between us and you.”’'
translation:
  language: ta
  text: எனவே நாங்கள், “வருங்காலத்தில் அவர்கள் எங்களிடமோ எங்கள் தலைமுறையினரிடமோ இவ்வாறு சொன்னால், நாங்கள், ‘எங்கள் தந்தையர் செய்த யாவேயின் பலிபீடத்தின் மாதிரியை[a]ப் பாருங்கள். அது தகனபலிக்காகவும் அல்ல, பலிக்காகவும் அல்ல; மாறாக, அது எங்களுக்கும் உங்களுக்கும் இடையே ஒரு சாட்சி’ என்று சொல்வோம்” என்றோம்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “மாதிரி” என்பதற்கு “நகல்,” “வடிவம்,” அல்லது “பிரதியுரு” என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் ஒரு வடிவத்தையோ மாதிரியையோ குறிக்கிறது; இச்சூழலில் அது பலியிடுவதற்காக அல்லாமல் சாட்சியாக அமைக்கப்பட்ட பலிபீடத்தின் ஒத்த அமைப்பைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַנֹּאמֶר
  choice: எனவே நாங்கள் ... என்றோம்
  rationale: தொடர்கதை அமைப்பையும், முந்தைய விளக்கத்திலிருந்து வரும் முடிவுணர்வையும் இயல்பான தமிழில் காட்டுகிறது.
- source_word: וְהָיָה כִּי
  choice: '... சொன்னால்'
  rationale: எதிர்காலத்தில் நிகழக்கூடிய நிபந்தனையைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: מָחָר
  choice: வருங்காலத்தில்
  rationale: இங்கு சொல் நேரடியான ‘நாளை’ என்பதைவிடப் பிற்காலத்தைக் குறிக்கும் மரபுத்தொடராக உள்ளது.
- source_word: תַּבְנִית
  choice: வடிவம்
  rationale: மூலச் சொல் வடிவம், மாதிரி, பிரதியுரு ஆகிய பொருள்களைத் தருகிறது; இந்தப் பலிபீடம் பலியிடுவதற்கான அதிகாரப்பூர்வ பலிபீடமல்ல, சாட்சியாக அமைக்கப்பட்ட ஒத்த வடிவம் என்பதைக் கூடுதல் விளக்கமின்றி தக்கவைக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரை ஒரு பட்டப்பெயரால் மாற்றாமல், எபிரெயப் பெயரின் தமிழ் ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: אֲבוֹתֵינוּ
  choice: எங்கள் தந்தையர்
  rationale: மூலத்திலுள்ள ஆண்பால் குடும்பச் சொல்லைத் துல்லியமாகத் தக்கவைக்கிறது.
- source_word: לֹא לְעוֹלָה וְלֹא לְזֶבַח
  choice: தகனபலிக்காகவும் அல்ல, பலிக்காகவும் அல்ல
  rationale: இருமுறை வரும் மறுப்பைத் தக்கவைத்து, עֹלָה மற்றும் זֶבַח ஆகிய இரு பலிவகைச் சொற்களின் வேறுபாட்டையும் காட்டுகிறது.
- source_word: כִּי עֵד הוּא
  choice: மாறாக, அது ... ஒரு சாட்சி
  rationale: முந்தைய இரு மறுப்புகளுக்கு எதிராக அதன் உண்மையான நோக்கத்தைச் சுட்டுகிறது; மூலத்திலுள்ள ‘அது’ என்ற சுட்டுப்பெயரையும் தக்கவைக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலத்தில் தனிப்பட்ட உடன்படிக்கைப் பெயர் நேரடியாக இருப்பதால், அதைத் தலைப்பாக மாற்றாமல் தமிழ் ஒலிபெயர்ப்பில் தருகிறது.
- issue: אֲבוֹתֵינוּ என்ற பாலினம் குறிக்கப்பட்ட உறவுப்பெயர்
  choice: எங்கள் தந்தையர்
  alternative: எங்கள் மூதாதையர்
  rationale: மூலத்தின் ஆண்பால் பன்மை வடிவத்தைப் பொதுப்பாலாக்காமல் தக்கவைக்கிறது.
- issue: பலிபீடத்தின் நோக்கம்
  choice: பலிக்காக அல்ல; சாட்சியாக உள்ளது
  alternative: பலிபீடத்தின் பிரதியுரு என்பதால் பலியிட இயலாதது
  rationale: வசனம் கூறும் எதிர்மறை மற்றும் நேர்மறை நோக்கங்களை மட்டும் வெளிப்படுத்தி, அதன் சட்ட அல்லது வழிபாட்டு நிலையைப் பற்றி மூலத்தில் இல்லாத முடிவைச் சேர்க்கவில்லை.
translation_notes:
  register: நவீன செந்தமிழ் நடையில், சாதாரண வாசகர்களுக்குப் புரியக்கூடியதாயும் மரியாதைமிக்கதாயும் அமைக்கப்பட்டுள்ளது. அடுக்கப்பட்ட மேற்கோள்கள் தெளிவாக வைக்கப்பட்டுள்ளன; மூலத்தின் இரட்டை மறுப்பும் ‘அது ஒரு சாட்சி’ என்ற வாக்கிய அமைப்பும் பாதுகாக்கப்பட்டுள்ளன.
