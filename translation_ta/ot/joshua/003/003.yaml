- from: 'அவர்கள் மக்களுக்குக் கட்டளையிட்டுச் சொன்னது: “உங்கள் கடவுளாகிய யாவேயின் உடன்படிக்கைப் பெட்டியை லேவிய ஆசாரியர்கள்[a] சுமந்து செல்வதை நீங்கள் காணும்போது, நீங்கள் இருக்கும் இடத்திலிருந்து புறப்பட்டு, அதற்குப் பின்னால் செல்ல வேண்டும்.”'
  to: 'அவர்கள் மக்களுக்குக் கட்டளையிட்டார்கள்: “உங்கள் கடவுளாகிய யாவேயின் உடன்படிக்கைப் பெட்டியை லேவிய ஆசாரியர்கள்[a] சுமந்து செல்வதை நீங்கள் காணும்போது, நீங்கள் இருக்கும் இடத்திலிருந்து புறப்பட்டு, அதற்குப் பின்னால் செல்லுங்கள்.”'
  rationale: தொடக்கத்தில் இருந்த பன்மை–ஒருமை இலக்கண முரண்பாடு சரிசெய்யப்பட்டது. கட்டளையின் வலிமையைத் தமிழில் இயல்பாகத் தர இறுதி வடிவம் நேரடிக் கட்டளையாக மாற்றப்பட்டது; பெட்டியின் ‘பின்னால்’ செல்லும் மூலப் படிமம் தக்கவைக்கப்பட்டது. பொருள் அல்லது இறையியல் விளக்கம் எதுவும் சேர்க்கப்படவில்லை.
