source:
  edition: WLC
  text: וַ/יְצַוּוּ֮ אֶת הָ/עָ֣ם לֵ/אמֹר֒ כִּ/רְאֽוֹתְ/כֶ֗ם אֵ֣ת אֲר֤וֹן בְּרִית יְהוָה֙ אֱלֹ֣הֵי/כֶ֔ם וְ/הַ/כֹּֽהֲנִים֙ הַ/לְוִיִּ֔ם נֹשְׂאִ֖ים אֹת֑/וֹ וְ/אַתֶּ֗ם תִּסְעוּ֙ מִ/מְּק֣וֹמְ/כֶ֔ם וַ/הֲלַכְתֶּ֖ם אַחֲרָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/003/003.yaml
  text: And they commanded the people[a], saying, “When you see the ark of the covenant of Yahweh your God, and the Levitical priests carrying it, then you shall set out from your place and go after it.”
translation:
  language: ta
  text: 'அவர்கள் மக்களுக்குக் கட்டளையிட்டார்கள்: “உங்கள் கடவுளாகிய யாவேயின் உடன்படிக்கைப் பெட்டியை லேவிய ஆசாரியர்கள்[a] சுமந்து செல்வதை நீங்கள் காணும்போது, நீங்கள் இருக்கும் இடத்திலிருந்து புறப்பட்டு, அதற்குப் பின்னால் செல்லுங்கள்.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஆசாரியர்கள், அதாவது லேவியர்கள்.”
    reason: הַכֹּהֲנִים הַלְוִיִּם என்ற எபிரெயத் தொடரை பின்னிணைப்பு அமைப்பாக நேரடியாகப் புரிந்துகொள்ளும் lexical alternative.
lexical_decisions:
- source_word: וַיְצַוּוּ אֶת־הָעָם לֵאמֹר
  choice: அவர்கள் மக்களுக்குக் கட்டளையிட்டுச் சொன்னது
  rationale: צוה என்பதன் அதிகாரப்பூர்வமான கட்டளை உணர்வையும், לֵאמֹר நேரடி உரையை அறிமுகப்படுத்தும் எபிரெய நடைமுறையையும் இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: כִּרְאוֹתְכֶם
  choice: நீங்கள் காணும்போது
  rationale: כ + infinitive construct இங்குக் காலத்தைக் குறிக்கிறது. உடனடித்தன்மையைத் தேவையின்றி வலியுறுத்தாமல் ‘when you see’ என்ற பொருளைத் தெளிவாகத் தருகிறது.
- source_word: אֲרוֹן בְּרִית
  choice: உடன்படிக்கைப் பெட்டி
  rationale: אֲרוֹן என்பது இச்சூழலில் புனிதப் பெட்டியையும், בְּרִית என்பது உடன்படிக்கையையும் குறிக்கிறது; தமிழில் தெளிவான, நிலைபெற்ற சேர்க்கை.
- source_word: יְהוָה אֱלֹהֵיכֶם
  choice: உங்கள் கடவுளாகிய யாவே
  rationale: தெய்வீகப் பெயரான יהוה-வை ஒரு பட்டத்தால் மாற்றாமல் ‘யாவே’ என்று ஒலிபெயர்த்து, אֱלֹהֵיכֶם என்பதன் ‘உங்கள் கடவுள்’ என்ற உடன்படிக்கைச் சார்ந்த உறவையும் காக்கிறது.
- source_word: הַכֹּהֲנִים הַלְוִיִּם
  choice: லேவிய ஆசாரியர்கள்
  rationale: இரண்டு தனித்தனி குழுக்களைப் போலத் தோன்றாமல், ஆசாரியர்களின் லேவிய அடையாளத்தை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது; எபிரெயப் பின்னிணைப்பு அமைப்புக்கான மாற்று அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: נֹשְׂאִים אֹתוֹ
  choice: அதைச் சுமந்து செல்வதை
  rationale: נשא இங்கு பொருளைத் தூக்கிச் சுமப்பதைக் குறிக்கிறது. தொடரும் பயணச் சூழலை ‘செல்வதை’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: תִּסְעוּ מִמְּקוֹמְכֶם
  choice: நீங்கள் இருக்கும் இடத்திலிருந்து புறப்பட்டு
  rationale: נסע பயணத்தைத் தொடங்கிப் புறப்படுவதைக் குறிக்கிறது; מקום என்பதன் பரந்த பொருளை குறிப்பிட்ட முகாம் கலைத்தல் எனக் குறுக்காமல் வழங்குகிறது.
- source_word: וַהֲלַכְתֶּם אַחֲרָיו
  choice: அதற்குப் பின்னால் செல்ல வேண்டும்
  rationale: הלך אחרי என்பதன் இடவியல் படிமத்தைத் தக்கவைத்து, கட்டளையின் வலிமையை நவீன தமிழில் ‘செல்ல வேண்டும்’ எனத் தெளிவாகக் காட்டுகிறது.
theological_decisions:
- issue: יהוה என்ற தெய்வீகப் பெயரின் மொழியாக்கம்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூல உரை தெய்வீகப் பெயரை நேரடியாகப் பயன்படுத்துவதால், அதை ஒரு பட்டமாக மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
- issue: הַכֹּהֲנִים הַלְוִיִּם என்ற தொடரின் உறவு
  choice: லேவிய ஆசாரியர்கள்
  alternative: ஆசாரியர்கள், அதாவது லேவியர்கள்
  rationale: முதன்மை உரை இவர்களை இரண்டு குழுக்களாகப் பிரிக்காமல், ஆசாரியர்களை லேவியர்களாக அடையாளப்படுத்துகிறது; மூலத்தின் பின்னிணைப்பு வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: எதிர்கால வினை வடிவங்களின் கட்டளை வலிமை
  choice: புறப்பட்டு, அதற்குப் பின்னால் செல்ல வேண்டும்
  alternative: புறப்பட்டு, அதைப் பின்தொடருங்கள்
  rationale: முந்தைய ‘கட்டளையிட்டார்கள்’ என்ற உரைச்சூழலில் வினை வடிவங்கள் அறிவுறுத்தல்/கட்டளை வலிமை பெறுகின்றன. ‘வேண்டும்’ என்பது அதைத் தெளிவாகக் காட்டி, வெறும் எதிர்கால முன்னறிவிப்பாக மாற்றாமல் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையில் கண்ணியமான நடையுடன் மொழிபெயர்க்கப்பட்டது. ‘உடன்படிக்கைப் பெட்டி,’ ‘யாவே,’ ‘லேவிய ஆசாரியர்கள்’ ஆகியவை வேதாகமச் சூழலின் துல்லியத்தைத் தக்கவைக்கின்றன; வாக்கிய அமைப்பு தமிழில் இயல்பாக ஓடுமாறு சீரமைக்கப்பட்டுள்ளது.
