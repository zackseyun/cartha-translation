base_translation:
  language: en
  yaml_path: translation/ot/joshua/003/001.yaml
  text: Joshua rose early in the morning[a], and they set out from Shittim and came to the Jordan, he and all the sons of Israel, and they spent the night there before they crossed over.
translation:
  language: ta
  text: யோசுவா அதிகாலையில் எழுந்தார்; அவரும் இஸ்ரவேலின் மகன்கள் அனைவரும்[a] சித்தீமிலிருந்து புறப்பட்டு யோர்தானுக்கு வந்தார்கள்; யோர்தானைக் கடப்பதற்கு முன்பு அவர்கள் அங்கே இரவு தங்கினார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இஸ்ரவேலர் அனைவரும்.” எபிரெயத்தில், “இஸ்ரவேலின் மகன்கள் அனைவரும்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁכֵּם בַּבֹּקֶר
  choice: அதிகாலையில் எழுந்தார்
  rationale: שׁכם என்பதன் ஹிஃபில் வடிவம் சீக்கிரமாக எழுவதைச் சுட்டுகிறது; בַּבֹּקֶר உடன் சேர்ந்து வருவதால், நவீனத் தமிழில் இயல்பான ‘அதிகாலையில் எழுந்தார்’ என்ற சொற்றொடர் கால வலியுறுத்தலைத் தெளிவாகக் காக்கிறது.
- source_word: וַיִּסְעוּ
  choice: புறப்பட்டு
  rationale: பயணக் கதையாடலில் נסע முகாமை விட்டுப் பயணத்தைத் தொடங்குவதைக் குறிக்கிறது; ‘புறப்பட்டு’ என்பது சுருக்கமான, இயல்பான தமிழ் நடை.
- source_word: מֵהַשִּׁטִּים
  choice: சித்தீமிலிருந்து
  rationale: இது ஓர் இடப்பெயர் என்பதால், ‘சித்தீம்’ என ஒலிபெயர்க்கப்பட்டுள்ளது; அகேசியா மரங்களைக் குறிக்கும் சொற்பொருள் இங்கு மொழிபெயர்க்கப்படவில்லை.
- source_word: וַיָּבֹאוּ עַד הַיַּרְדֵּן
  choice: யோர்தானுக்கு வந்தார்கள்
  rationale: עד இங்கு ஆற்றை அடையும் எல்லையைக் குறிக்கிறது; ‘யோர்தானுக்கு வந்தார்கள்’ என்பது அந்த வருகையை இயல்பாகத் தெரிவிக்கிறது.
- source_word: הוּא וְכָל־בְּנֵי יִשְׂרָאֵל
  choice: அவரும் இஸ்ரவேலின் மகன்கள் அனைவரும்
  rationale: הוּא யோசுவாவை மீண்டும் குறிப்பதால் ‘அவரும்’ காக்கப்பட்டுள்ளது. בְּנֵי יִשְׂרָאֵל என்பதன் உறவுமுறை வடிவத்தை ‘இஸ்ரவேலின் மகன்கள்’ நேரடியாக வெளிப்படுத்துகிறது.
- source_word: וַיָּלִנוּ
  choice: இரவு தங்கினார்கள்
  rationale: לון இங்கு ஓரிரவு தங்குவதைக் குறிக்கிறது; ‘இரவு தங்கினார்கள்’ என்பது தெளிவான நவீனத் தமிழ்.
- source_word: טֶרֶם יַעֲבֹרוּ
  choice: அவர்கள் அதைக் கடந்து செல்வதற்கு முன்பு
  rationale: טֶרֶם முந்திய காலத்தைக் குறிக்கிறது; עבר யோர்தான் ஆற்றைக் கடப்பதைச் சுட்டுகிறது. தமிழில் தேவையான நேரடி செயப்படுபொருளாக ‘அதை’ சேர்க்கப்பட்டுள்ளது.
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל என்பதன் மொழிபெயர்ப்பு
  choice: இஸ்ரவேலின் மகன்கள்
  alternative: இஸ்ரவேலர்
  rationale: இங்கு கோட்பாட்டுச் சர்ச்சை இல்லை. இருப்பினும், எபிரெய மூலத்தின் ஆண்பால் பன்மை உறவுமுறை வடிவத்தை முதன்மை உரை வெளிப்படையாகக் காக்கிறது; இயல்பான கூட்டுப்பெயர் மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கதையாடல் நடை பயன்படுத்தப்பட்டுள்ளது. மரியாதைப் பன்மை வினைமுற்றுகள் மனிதர்களைக் குறிக்கும் வழக்கமான தமிழ்நடைக்கேற்ப அமைக்கப்பட்டுள்ளன; இடப்பெயர்கள் மொழிபெயர்க்கப்படாமல் ஒலிபெயர்க்கப்பட்டுள்ளன.
