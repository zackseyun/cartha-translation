source:
  edition: WLC
  text: הִנֵּה֙ אֲר֣וֹן הַ/בְּרִ֔ית אֲד֖וֹן כָּל הָ/אָ֑רֶץ עֹבֵ֥ר לִ/פְנֵי/כֶ֖ם בַּ/יַּרְדֵּֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/003/011.yaml
  text: Look[a], the ark of the covenant, the Lord of all the earth, is crossing ahead of you in the Jordan.
translation:
  language: ta
  text: இதோ, பூமி முழுவதற்கும் ஆண்டவரின் உடன்படிக்கைப் பெட்டி உங்கள் முன்னே யோர்தானில்[a] கடந்து செல்கிறது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யோர்தானுக்குள்.” எபிரெயத்தில் “யோர்தானில்” என்று இடப்பொருளாக உள்ளது; ஆனால் ‘கடந்து செல்கிறது’ என்ற வினையுடனும் இச்சூழலுடனும் ஆற்றுக்குள் நுழையும் திசைசார் பொருளும் சாத்தியம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: இதோ
  rationale: கவனத்தை உடனடியாக ஈர்க்கும் எபிரெயத் துகளின் உயிரோட்டத்தையும் வேதாகமத்திற்கேற்ற கண்ணியமான நடையையும் இயல்பான நவீனத் தமிழில் காக்கிறது.
- source_word: אֲרוֹן הַבְּרִית
  choice: உடன்படிக்கைப் பெட்டி
  rationale: சொற்களின் உடைமைத் தொடர்பைத் தெளிவாகக் காட்டும் இயல்பான தமிழாக்கம். ‘பேழை’ என்பதைக் காட்டிலும் ‘பெட்டி’ இன்றைய பொதுவாசகருக்கு உடனடியாகப் புரியும்.
- source_word: אֲדוֹן כָּל הָאָרֶץ
  choice: பூமி முழுவதற்கும் ஆண்டவர்
  rationale: אָדוֹן குறிக்கும் ஆட்சியுரிமையை ‘ஆண்டவர்’ தக்கவைக்கிறது; כָּל הָאָרֶץ என்பதன் உலகளாவிய பரப்பை ‘பூமி முழுவதற்கும்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: עֹבֵר
  choice: கடந்து செல்கிறது
  rationale: நிகழ்ந்துகொண்டிருக்கும் அல்லது உடனே நிகழவிருக்கும் நகர்வை எபிரெயப் பங்கேற்புவினை உயிரோட்டமாகச் சித்தரிக்கிறது.
- source_word: לִפְנֵיכֶם
  choice: உங்கள் முன்னே
  rationale: மக்களுக்கு முன்னால் வழிநடத்திச் செல்லும் திசைசார் பொருளைத் தெளிவாகக் காட்டுகிறது.
- source_word: בַּיַּרְדֵּן
  choice: யோர்தானுக்குள்
  rationale: בְּ என்பதன் அடிப்படை இடப்பொருள் ‘இல்’ என்றாலும், கடத்தலைக் குறிக்கும் வினையுடன் இங்கு ஆற்றுக்குள் நுழையும் திசைசார் பொருள் சூழலுக்கு இயல்பாக அமைகிறது; நேரடியான மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: אֲדוֹן כָּל הָאָרֶץ என்ற இறையாட்சிப் பட்டத்துக்கும் உடன்படிக்கைப் பெட்டிக்கும் உள்ள தொடரியல் தொடர்பு
  choice: பூமி முழுவதற்கும் ஆண்டவருடைய உடன்படிக்கைப் பெட்டி
  alternative: உடன்படிக்கைப் பெட்டி, பூமி முழுவதற்கும் ஆண்டவர்
  rationale: எபிரெயச் சொல் வரிசையும் மசோரா இடைநிறுத்தமும் மேலோட்டமாக இணைப்புப் பொருள் தரக்கூடும்; ஆனால் பெட்டியையே ‘ஆண்டவர்’ என்று அடையாளப்படுத்துவது சூழலுக்கு முரணாகும். அருகிலுள்ள யோசுவா 3:13 இதை ஆண்டவருக்குரிய பெட்டியாகத் தெளிவுபடுத்துகிறது. ஆகவே இறையாட்சிப் பட்டத்தை உரிமையாளருடன் இணைத்துள்ளோம்; கூடுதல் கோட்பாட்டுக் கருத்து எதையும் சேர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகருக்குப் புரியும் கண்ணியமான வேதாகம நடை. ‘இதோ’ மூலம் மூலத்தின் கவன ஈர்ப்பும், ‘கடந்து செல்கிறது’ மூலம் காட்சியின் உடனடித் தன்மையும் காக்கப்பட்டுள்ளன.
