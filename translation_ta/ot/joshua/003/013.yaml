  text: וְ/הָיָ֡ה כְּ/נ֣וֹחַ כַּפּ֣וֹת רַגְלֵ֣י הַ/כֹּהֲנִ֡ים נֹשְׂאֵי֩ אֲר֨וֹן יְהוָ֜ה אֲד֤וֹן כָּל הָ/אָ֨רֶץ֙ בְּ/מֵ֣י הַ/יַּרְדֵּ֔ן מֵ֤י הַ/יַּרְדֵּן֙ יִכָּ֣רֵת֔וּ/ן הַ/מַּ֥יִם הַ/יֹּרְדִ֖ים מִ/לְ/מָ֑עְלָ/ה וְ/יַעַמְד֖וּ נֵ֥ד אֶחָֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/003/013.yaml
  text: And when the soles of the feet of the priests carrying the ark of Yahweh[a], the Lord of all the earth, come to rest in the waters of the Jordan, the waters flowing down from above will be cut off in the Jordan[b], and they will stand in one heap.
translation:
  language: ta
  text: பூமி முழுவதற்கும் ஆண்டவரான யாவேவின் பெட்டியைச் சுமக்கும் ஆசாரியர்களின் பாதங்களின் உள்ளங்கால்கள் யோர்தான் நீரில் பதிந்தவுடன், யோர்தானின் நீர், மேலிருந்து பாய்ந்து வரும் நீர், துண்டிக்கப்படும்; அவை ஒரே குவியலாக நிற்கும்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'மற்றொரு வாசிப்பு: “பூமி முழுவதற்கும் ஆண்டவருடைய பெட்டி.” எபிரெயத் தொடரில் “பூமி முழுவதற்கும் ஆண்டவர்” என்பதைக் “பெட்டி” என்பதுடன் நெருக்கமாக இணைத்தும் வாசிக்கலாம்.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְהָיָה כְּנוֹחַ
  choice: பதிந்தவுடன்
  rationale: வரவிருக்கும் நிகழ்வை அறிமுகப்படுத்தும் וְהָיָה என்பதையும், ‘ஓய்தல்/பதிதல்’ என்ற נוח வினையின் காலப் பொருளையும் இயல்பான தமிழில் ஒருங்கிணைக்கிறது.
- source_word: כַּפּוֹת רַגְלֵי
  choice: உள்ளங்கால்கள்
  rationale: கால்களின் அடிப்பகுதியைக் குறிக்கும் எபிரெயச் சொல்லிணைப்பைச் சுருக்கமாகவும் துல்லியமாகவும் வழங்குகிறது.
- source_word: הַכֹּהֲנִים נֹשְׂאֵי אֲרוֹן
  choice: உடன்படிக்கைப் பெட்டியைச் சுமக்கிற ஆசாரியர்கள்
  rationale: நֹשְׂאֵי என்ற பங்கேற்பு வடிவத்தின் தொடர்ச்சியான ‘சுமத்தல்’ செயலை இயல்பாகக் காட்டுகிறது; இச்சூழலில் אָרוֹן என்பது உடன்படிக்கைப் பெட்டி.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரான நான்கெழுத்துப் பெயரை ஒரு பொதுப் பட்டமாக மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: אֲדוֹן כָּל הָאָרֶץ
  choice: பூமி முழுவதற்கும் ஆண்டவர்
  rationale: אֲדוֹן என்பதன் அதிகாரம் மற்றும் ஆளுகையைக் காட்டும் பட்டத்தை இயல்பான, கண்ணியமான தமிழில் தருகிறது.
- source_word: בְּמֵי הַיַּרְדֵּן
  choice: யோர்தானின் தண்ணீரில்
  rationale: בְּ என்பதன் இடம்/தொடுகை சார்ந்த பொருளையும் நதியின் நீருக்குள் கால்கள் பதியும் காட்சியையும் காக்கிறது.
- source_word: יִכָּרֵתוּן
  choice: துண்டிக்கப்படும்
  rationale: כרת நிஃபால் வடிவத்தின் ‘வெட்டித் துண்டிக்கப்படுதல்/நிறுத்தப்படுதல்’ என்ற வலுவான உருவகத்தைப் பாதுகாக்கிறது.
- source_word: הַמַּיִם הַיֹּרְדִים מִלְמָעְלָה
  choice: மேலிருந்து பாய்ந்து வரும் தண்ணீர்
  rationale: சொற்பொருளான ‘மேலிருந்து இறங்கி வரும்’ என்பதையும் நதிச் சூழலில் உள்ள மேலோட்டத் திசையையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וְיַעַמְדוּ נֵד אֶחָד
  choice: அது ஒரே குவியலாக நின்றுவிடும்
  rationale: நֵד குறிக்கும் குவிந்த நீர்த்திரளின் அற்புதக் காட்சியைத் தெளிவாகவும் உயிரோட்டமாகவும் தருகிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலத்தில் தனிப்பட்ட தெய்வீகப் பெயர் இருப்பதால், அதை ஒரு பட்டமாக மாற்றாமல் ஒலிபெயர்ப்பது மூல வேறுபாட்டைக் காக்கிறது.
- issue: ‘பூமி முழுவதற்கும் ஆண்டவர்’ என்பதன் இலக்கணத் தொடர்பு
  choice: யாவேவை விளக்கும் இணைப்பெயராக முதன்மை உரையில் வெளிப்படுத்துதல்
  alternative: ‘பூமி முழுவதற்கும் ஆண்டவருடைய பெட்டி’ என்று אָרוֹן உடன் நெருக்கமாக இணைத்தல்
  rationale: எபிரெயத் தொடரில் இரு தொடர்புகளுக்கும் இடமுண்டு. சூழலில் யாவேவின் உலகளாவிய ஆண்டமையை எடுத்துரைக்கும் இணைப்பெயர் வாசிப்பு இயல்பாக இருப்பினும், மாற்று வாசிப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன தரநிலைத் தமிழில் கண்ணியமான, பொதுவாசகருக்குப் புரியும் நடை. ‘ஆசாரியர்,’ ‘உடன்படிக்கைப் பெட்டி,’ ‘யோர்தான்’ ஆகிய பரவலாக அறியப்பட்ட வேதாகமச் சொற்கள் பயன்படுத்தப்பட்டுள்ளன. எபிரெயத்தில் உள்ள இலக்கணத் தெளிவின்மை அடிக்குறிப்பில் காக்கப்பட்டுள்ளது.
