- from: யாவேவின்[a] உடன்படிக்கைப் பெட்டியைச் சுமக்கிற ஆசாரியர்களுடைய உள்ளங்கால்கள் யோர்தானின் தண்ணீரில் பதிந்தவுடன், பூமி முழுவதற்கும் ஆண்டவரான யாவேவின் முன்னிலையில், மேலிருந்து பாய்ந்து வரும் தண்ணீர் யோர்தானில் துண்டிக்கப்படும்[b]; அது ஒரே குவியலாக நின்றுவிடும்.
  to: பூமி முழுவதற்கும் ஆண்டவரான யாவேவின் பெட்டியைச் சுமக்கும் ஆசாரியர்களின் பாதங்களின் உள்ளங்கால்கள் யோர்தான் நீரில் பதிந்தவுடன், யோர்தானின் நீர், மேலிருந்து பாய்ந்து வரும் நீர், துண்டிக்கப்படும்; அவை ஒரே குவியலாக நிற்கும்.[a]
  rationale: The revision restores the Hebrew syntax and sense by making “Lord of all the earth” a title of Yahweh rather than adding an unsupported phrase about his presence. It omits the contextually supplied but unexpressed “covenant,” preserves the repeated Jordan-water wording, and uses a plural final subject. The lexical alternative concerning upstream water is retained; its marker is supplied in the text.
