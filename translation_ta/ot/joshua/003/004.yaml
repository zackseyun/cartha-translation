  rationale: பேழையைக் குறிக்கும் பிரதிப்பெயரை உயிரற்ற பொருளுக்குரிய ‘அது’ என்று வழங்கி, பிரிப்பு அல்லது இடைவெளி நிலவ வேண்டும் என்ற எபிரெய அமைப்பையும் காக்கிறது.
