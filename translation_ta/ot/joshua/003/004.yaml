base_translation:
  language: en
  yaml_path: translation/ot/joshua/003/004.yaml
  text: Yet there shall be a distance between you and it[a], about two thousand cubits by measure. Do not come near it, so that you may know the way by which you shall go[b], for you have not passed this way before.
translation:
  language: ta
  text: ஆயினும், உங்களுக்கும் அதற்கும் இடையில் அளவின்படி ஏறக்குறைய இரண்டாயிரம் முழம்[a] தொலைவு இருக்க வேண்டும். நீங்கள் செல்லும் வழியை அறிந்துகொள்ளும்படி, அதற்கு அருகில் செல்லாதீர்கள்; ஏனெனில் இதற்கு முன்பு[b] நீங்கள் இந்த வழியில் சென்றதில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘முழம்’ என்பது பழங்காலத்தில் பயன்படுத்தப்பட்ட ஓர் அளவலகு; அது ஏறக்குறைய முழங்கையிலிருந்து நடுவிரல் நுனிவரையுள்ள நீளம்.
    reason: cultural_note
  - marker: b
    text: சொல்லர்த்தமாக, ‘நேற்றிலிருந்தும் முந்தாநாளிலிருந்தும்’; இது ‘முன்னர்’ அல்லது ‘இதற்கு முன்பு’ என்று பொருள்படும் ஒரு மரபுத்தொடர்.
    reason: lexical_alternative
