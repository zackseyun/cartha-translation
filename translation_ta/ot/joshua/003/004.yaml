translation_notes:
  register: நவீனத் தரத்தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான நடையைப் பயன்படுத்துகிறது. பழங்கால அளவலகான ‘முழம்’ முதன்மை உரையில் தக்கவைக்கப்பட்டு அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது. ஆங்கில ஆலோசனை உரையில் இடம்மாறியிருந்த அடிக்குறிப்பு குறிப்பான்கள், அவை விளக்கும் சொற்களுடன் சரியாகப் பொருத்தப்பட்டுள்ளன.
