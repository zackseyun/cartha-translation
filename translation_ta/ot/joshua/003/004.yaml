  rationale: செல்லவிருக்கும் பாதையை நடைமுறை வழிகாட்டுதலாகத் தெளிவுபடுத்துகிறது; ‘வழி’ என்பது דֶּרֶךְ என்பதற்கான இயல்பான இணை.
