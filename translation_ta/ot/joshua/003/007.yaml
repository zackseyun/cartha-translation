base_translation:
  language: en
  yaml_path: translation/ot/joshua/003/007.yaml
  text: And Yahweh said to Joshua[a], “Today I will begin to make you great in the sight of all Israel, so that they may know that just as I was with Moses, I will be with you.”
translation:
  language: ta
  text: யாவே யோசுவாவிடம், “இன்று, இஸ்ரவேலர் அனைவரின் பார்வையிலும் உன்னை மேன்மைப்படுத்தத் தொடங்குவேன்[a]. நான் மோசேயோடு இருந்ததுபோல உன்னோடும் இருப்பேன் என்பதை அவர்கள் அறிந்துகொள்ளும்படி அப்படிச் செய்வேன்” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இன்று, இஸ்ரவேலர் அனைவருக்கும் முன்பாக உன்னை உயர்த்தத் தொடங்குவேன்.”
    reason: גַּדֶּלְךָ என்பதற்கு ‘உயர்த்த’ என்றும், בְּעֵינֵי என்ற மரபுத்தொடருக்கு ‘அனைவருக்கும் முன்பாக’ என்றும் மொழிபெயர்க்கலாம்.
lexical_decisions:
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைப்பெயரான நான்கு எழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் அதன் ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: הַיּוֹם הַזֶּה
  choice: இன்று
  rationale: ‘இந்த நாள்’ என்ற கால வலியுறுத்தலை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: אָחֵל גַּדֶּלְךָ
  choice: உன்னை மேன்மைப்படுத்தத் தொடங்குவேன்
  rationale: ‘தொடங்கு’ என்பதையும், யோசுவாவின் நிலையை மக்கள்முன் உயர்த்தும் גדל வினையின் பொருளையும் பாதுகாக்கிறது.
- source_word: בְּעֵינֵי כָּל יִשְׂרָאֵל
  choice: இஸ்ரவேலர் அனைவரின் பார்வையிலும்
  rationale: ‘அனைத்து இஸ்ரவேலின் கண்களில்’ என்ற எபிரெய மரபுத்தொடரின் பொதுமக்கள் அறியும் வெளிப்படையான மதிப்பைக் குறிக்கும் பொருளை இயல்பாகத் தருகிறது.
- source_word: אֲשֶׁר יֵדְעוּן
  choice: இதனால் ... அவர்கள் அறிந்துகொள்வார்கள்
  rationale: இந்த இணைப்பின் நோக்கம் அல்லது விளைவைக் கட்டாயமாக ஒன்றாக மட்டும் தீர்மானிக்காமல், நிகழ்வின் விளைவாக வரும் அறிவை இயல்பாகத் தெரிவிக்கிறது.
- source_word: כַּאֲשֶׁר הָיִיתִי עִם מֹשֶׁה אֶהְיֶה עִמָּךְ
  choice: நான் மோசேயோடு இருந்ததுபோல உன்னோடும் இருப்பேன்
  rationale: மோசேயுடனான இறை உடனிருப்புக்கும் யோசுவாவுக்குக் கொடுக்கப்படும் வாக்குறுதிக்கும் இடையிலான நேரடி ஒப்புமையைப் பாதுகாக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: யெகோவா; கர்த்தர்
  rationale: மூலத்தில் தனிப்பட்ட உடன்படிக்கைப் பெயர் நேரடியாக இருப்பதால், அதை ஒரு பட்டமாக மாற்றாமல் ஒலிபெயர்க்கிறது.
- issue: யோசுவாவை ‘மேன்மைப்படுத்துதல்’ என்பதன் பொருள்
  choice: மக்களின் பார்வையில் அவரது நிலையை உயர்த்தும் இறைச் செயல்
  alternative: யோசுவாவுக்குத் தெய்வீக இயல்பை வழங்குதல்
  rationale: בְּעֵינֵי כָּל יִשְׂרָאֵל என்பது இஸ்ரவேலரிடையே யோசுவாவின் பொதுவான அங்கீகாரத்தையும் அதிகாரத்தையும் குறிக்கிறது; இயல்பு மாற்றத்தை அல்ல.
translation_notes:
  register: நவீன நிலையான தமிழ்; எளிமையானதாயினும் கண்ணியமான வேதாகம நடையைப் பயன்படுத்துகிறது. ‘யாவே’ என்ற ஒலிபெயர்ப்பு இறைப்பெயரைப் பாதுகாக்கிறது; ‘மேன்மைப்படுத்துதல்’ பொதுமக்கள்முன் யோசுவாவின் நிலையை உயர்த்துதல் என்ற பொருளில் வருகிறது.
