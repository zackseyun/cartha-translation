  choice: வந்தபோது / அடைந்தபோது
  rationale: இணைப்புச்சொல்லும் காலத்தைக் குறிக்கும் முன்னொட்டுடன் கூடிய வினையெச்ச வடிவமும் ஒரு காலத் துணைவாக்கியத்தைத் தொடங்குகின்றன. தமிழில் ‘அடைந்தபோது’ என்பது நிகழ்வின் வரிசையையும் குறிப்பிட்ட இடத்தை எட்டியதையும் இயல்பாகத் தெரிவிக்கிறது.
- source_word: נֹשְׂאֵי הָאָרוֹן
  choice: உடன்படிக்கைப் பெட்டியைச் சுமந்தவர்கள்
  rationale: பங்கேற்பு வினை வடிவம் பெட்டியைச் சுமப்பவர்களைக் குறிக்கிறது. எபிரெயத்தில் இங்கு ‘பெட்டி’ என்றே இருந்தாலும், சூழலில் ஏற்கெனவே அடையாளப்படுத்தப்பட்ட பெட்டி என்பதால் தமிழில் புரிதலுக்காக வழக்கமான ‘உடன்படிக்கைப் பெட்டி’ பயன்படுத்தப்பட்டது.
- source_word: עַד הַיַּרְדֵּן
  choice: யோர்தான் ஆற்றை அடைந்தபோது
  rationale: עַד என்பது நகர்ந்து ஒரு எல்லை அல்லது இடத்தை எட்டுவதைக் குறிக்கிறது. ‘அடைந்தபோது’ என்பது ஆற்றங்கரையை வந்து சேர்ந்த கருத்தை இயல்பான தமிழில் தருகிறது.
- source_word: וְרַגְלֵי הַכֹּהֲנִים
  choice: ஆசாரியர்களின் கால்கள்
  rationale: எபிரெயக் கட்டமைப்பையும் கால்கள்மீது உள்ள கவனத்தையும் நேரடியாகப் பாதுகாக்கிறது.
- source_word: נֹשְׂאֵי הָאָרוֹן
  choice: பெட்டியைச் சுமந்த
  rationale: எந்த ஆசாரியர்கள் குறிக்கப்படுகிறார்கள் என்பதைத் தெளிவாக்கும் இச்சொற்றொடரை எபிரெயம் மீண்டும் கூறுவதால், தமிழிலும் அது விடப்படாமல் மீண்டும் தரப்பட்டுள்ளது.
- source_word: נִטְבְּלוּ
  choice: இறங்கின
  rationale: טבל என்பதன் நிபால் வடிவம் நீருக்குள் படுதல் அல்லது அமிழ்தலைக் குறிக்கிறது. கால்கள் முழுவதும் மூழ்கியதாக மிகைப்படுத்தாமல், அவை நீருக்குள் நுழைந்ததை ‘இறங்கின’ இயல்பாகத் தெரிவிக்கிறது.
