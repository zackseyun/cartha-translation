base_translation:
  language: en
  yaml_path: translation/ot/joshua/003/015.yaml
  text: And when those carrying the ark came as far as the Jordan[a], and the feet of the priests carrying the ark were dipped in the edge of the water (now the Jordan was full over all its banks all the days of harvest)[b],
translation:
  language: ta
  text: உடன்படிக்கைப் பெட்டியைச் சுமந்தவர்கள் யோர்தானை அடைந்தபோது, பெட்டியைச் சுமந்த ஆசாரியர்களின் கால்கள் நீரின் ஓரத்தில் மூழ்கின[a]—அறுவடைக் காலம் முழுவதும் யோர்தான் தன் எல்லாக் கரைகளையும் கடந்து நிரம்பியிருந்தது[b]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லுக்கு நெருக்கமாக, ‘நீரின் விளிம்பில்’ என்று மொழிபெயர்க்கலாம். எபிரெயச் சொற்றொடர் ஆசாரியர்களின் கால்கள் கரையோர நீருக்குள் நுழைந்ததைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அதாவது, அறுவடைக் காலத்தில் யோர்தான் ஆறு வெள்ளப்பெருக்கு நிலையில் இருந்தது.
    reason: cultural_note
lexical_decisions:
