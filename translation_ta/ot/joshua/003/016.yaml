translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. இடப்பெயர்கள் ஆதாம், சர்தான், அரபா, எரிகோ என ஒலிபெயர்க்கப்பட்டுள்ளன. எபிரெய உரையின் நீர் ‘நின்றது/எழுந்தது’ என்ற உருவகம் விளக்கமாக மாற்றப்படாமல் பாதுகாக்கப்பட்டுள்ளது.
