base_translation:
  language: en
  yaml_path: translation/ot/joshua/003/016.yaml
  text: the waters flowing down from above stood still[a]; they rose up in one heap, very far away, at Adam, the city beside Zarethan. And those flowing down toward the Sea of the Arabah, the Salt Sea, were completely cut off[b], and the people crossed over opposite Jericho.
translation:
  language: ta
  text: மேலிருந்து பாய்ந்து வந்த நீர் நின்றது; அது வெகு தொலைவில், சாரேத்தானுக்கு அருகிலிருந்த ஆதாம் என்னும் நகரத்தில், ஒரே குவியலாக எழுந்தது[a]. அரபா கடலாகிய உப்புக் கடலை நோக்கிப் பாய்ந்து சென்ற நீரோ முற்றிலும் தடைபட்டது[b]; மக்கள் எரிகோவுக்கு எதிரே கடந்து சென்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அது ஒரே குவியலாக நின்றது.” தண்ணீர் ஒன்றாகத் திரண்டு, உயர்ந்த ஒரே தடுப்பாக நின்றதை எபிரெயச் சொல்லாட்சி சித்தரிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: “உப்புக் கடல்” என்பது பிற்காலத்தில் பொதுவாகச் “சவக்கடல்” என்று அழைக்கப்பட்ட நீர்நிலையாகும்.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעַמְדוּ
  choice: நின்றது
  rationale: עמד இங்கு ஆற்றுநீரின் வழக்கமான ஓட்டம் நிற்பதைக் குறிக்கிறது; ‘நின்றது’ என்பது உருவகத்தையும் சூழலுக்குரிய ஓட்டநிறுத்தத்தையும் இயல்பாகத் தருகிறது.
- source_word: הַמַּיִם הַיֹּרְדִים מִלְמַעְלָה
  choice: மேலிருந்து பாய்ந்து வந்த தண்ணீர்
  rationale: மேடான மேல்பகுதியிலிருந்து கீழ்நோக்கிப் பாயும் நீரைக் குறிக்கிறது; தமிழில் இயல்பான ஆற்றோட்ட மொழியாக அமைந்துள்ளது.
- source_word: קָמוּ נֵד אֶחָד
  choice: ஒரே குவியலாக எழுந்தது
  rationale: நீர் ஒன்றாகத் திரண்டு உயர்ந்து நின்ற தடுப்பு போன்ற எபிரெய உருவகத்தைப் பாதுகாக்கிறது.
- source_word: הַרְחֵק מְאֹד
  choice: வெகு தொலைவில்
  rationale: தொலைவை வலியுறுத்தும் எபிரெயச் சொல்லாட்சியைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: בְאָדָם
  choice: ஆதாம் நகரத்தினிடத்தில்
  rationale: אדם இங்கு மனிதனைக் குறிக்கும் பொதுப்பெயர் அல்ல, ஓர் இடப்பெயர்; அடுத்துள்ள ‘நகரம்’ என்பதையும் தமிழில் தெளிவாக இணைக்கிறது.
- source_word: הָעִיר אֲשֶׁר מִצַּד צָרְתָן
  choice: சர்தானுக்கு அருகிலிருந்த ஆதாம் நகரம்
  rationale: מִצַּד குறிக்கும் அண்மை அல்லது பக்கத்திலுள்ள நிலையை இயல்பான தமிழில் வழங்குகிறது.
- source_word: וְהַיֹּרְדִים עַל יָם הָעֲרָבָה
  choice: அரபா கடலை நோக்கிப் பாய்ந்த தண்ணீர்
  rationale: கீழ்நோக்கிச் செல்லும் நீரின் திசையையும் அரபா கடலுடனான கட்டமைப்பு உறவையும் தெளிவாகத் தருகிறது.
- source_word: יָם הַמֶּלַח
  choice: உப்புக் கடல்
  rationale: எபிரெயப் பெயரின் நேரடியான பொருளை முதன்மை உரையில் பாதுகாக்கிறது.
- source_word: תַּמּוּ נִכְרָתוּ
  choice: முற்றிலும் தடைபட்டு நின்றது
  rationale: இரு வினைகளும் சேர்ந்து கீழ்நோக்கிய ஓட்டம் முழுமையாக முடிவுற்று துண்டிக்கப்பட்டதை வலியுறுத்துகின்றன; தமிழ் நடை இரண்டின் கூட்டு வலிமையை வெளிப்படுத்துகிறது.
- source_word: וְהָעָם עָבְרוּ
  choice: மக்கள் கடந்து சென்றார்கள்
  rationale: யோர்தானைக் கடக்கும் கதைக்களச் செயலை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: נֶגֶד יְרִיחוֹ
  choice: எரிகோவுக்கு எதிரே
  rationale: ஒரு இடத்துக்கு நேரெதிரான புவியியல் நிலையை நேரடியாகக் குறிக்கிறது.
