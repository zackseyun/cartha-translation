  text: Joshua said to the sons of Israel[a], “Come here and hear the words of Yahweh your God.”
translation:
  language: ta
  text: யோசுவா இஸ்ரவேலின் மக்களிடம்[a], “இங்கே நெருங்கி வந்து, உங்கள் கடவுளாகிய யாவேயின் வார்த்தைகளைக் கேளுங்கள்” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'சொல்லுக்கு சொல்: “இஸ்ரவேலின் மகன்கள்”; இதை “இஸ்ரவேலின் பிள்ளைகள்” அல்லது “இஸ்ரவேலர்” என்றும் மொழிபெயர்க்கலாம்.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: என்றார்
  rationale: אמר என்பதன் வழக்கமான கதைநடை வடிவம் நேரடி உரையை அறிமுகப்படுத்துகிறது; தமிழில் உரையின் முடிவில் வரும் ‘என்றார்’ இயல்பான அமைப்பு.
- source_word: יְהוֹשֻׁעַ
  choice: யோசுவா
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் பரவலாக அறியப்படும் பெயர்வடிவம்.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் மக்கள்
  rationale: சொல்லுக்கு சொல் வடிவம் ‘இஸ்ரவேலின் மகன்கள்.’ இங்கு அது முழு இனக்குழுவைக் குறிக்கும் மரபுத்தொடர் என்பதால், ஆண்களை மட்டும் குறிக்கிறது என்ற தவறான எண்ணத்தைத் தவிர்த்து இயல்பான தமிழில் ‘மக்கள்’ என வழங்கப்பட்டது; நேரடி வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: גֹּשׁוּ הֵנָּה
  choice: இங்கே நெருங்கி வந்து
  rationale: நגשׁ என்ற பன்மை ஏவல் வினையும் הֵנָּה என்ற திசைச்சொல்லும், பேசுபவர் இருக்கும் இடத்தை நோக்கி அணுகும்படி அழைக்கின்றன; ‘நெருங்கி வந்து’ அந்த இயக்கத்தைத் தெளிவாகக் காக்கிறது.
- source_word: וְשִׁמְעוּ
  choice: கேளுங்கள்
  rationale: שׁמע என்பதன் பன்மை ஏவல் வடிவம்; சூழலில் கவனமாகக் கேட்பதையும் உள்ளடக்கும் இயல்பான தமிழ் சொல்.
- source_word: דִּבְרֵי
  choice: வார்த்தைகளை
  rationale: דבר என்பதன் பன்மை இணைப்புநிலை வடிவத்தை நேரடியாகக் காக்கிறது; ‘செய்தி’ என்பது தேவையற்ற விளக்க விரிவாக்கமாகும்.
- source_word: יְהוָה
  choice: யாவே
  rationale: நான்கெழுத்துத் தெய்வீகப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் இயல்பாக ஒலிபெயர்க்கிறது.
- source_word: אֱלֹהֵיכֶם
  choice: உங்கள் கடவுளாகிய
  rationale: இரண்டாம் நபர் ஆண்பால் பன்மை உடைமை வடிவத்துடன், இஸ்ரவேலின் கடவுளைக் குறிக்கும் ஒருமைப் பொருள்; ‘ஆகிய’ என்பது யாவே யார் என்பதை விளக்கும் இயல்பான தமிழ் இணைப்பு.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: எபிரெய உரை தனிப்பட்ட உடன்படிக்கைப் பெயரை நேரடியாகப் பயன்படுத்துகிறது. அதை ஒரு பட்டமாக மாற்றாமல் ஒலிபெயர்ப்பது மூலத்தின் வேறுபாட்டைக் காக்கிறது.
- issue: בְּנֵי יִשְׂרָאֵל என்ற மரபுத்தொடரின் பொருள்
  choice: இஸ்ரவேலின் மக்கள்
  alternative: இஸ்ரவேலின் மகன்கள் / இஸ்ரவேலர்
  rationale: இலக்கண வடிவம் ஆண்பால் பன்மையாக இருந்தாலும், இச்சூழலில் அது இஸ்ரவேல் இனக்குழுவை மொத்தமாகக் குறிக்கிறது. பிரதான உரையில் இயல்பான மற்றும் உள்ளடக்கமான இனக்குழுப் பொருள் தரப்பட்டு, நேரடி வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகருக்குப் புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ஏவல் வினைகள் மரியாதைப் பன்மையில் வழங்கப்பட்டுள்ளன; எபிரெயச் சொற்றொடரின் இயக்கமும் தெய்வீகப் பெயரும் காக்கப்பட்டுள்ளன.
