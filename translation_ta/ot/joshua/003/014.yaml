reference: Joshua 3:14
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יְהִ֗י בִּ/נְסֹ֤עַ הָ/עָם֙ מֵ/אָ֣הֳלֵי/הֶ֔ם לַ/עֲבֹ֖ר אֶת הַ/יַּרְדֵּ֑ן וְ/הַ/כֹּהֲנִ֗ים נֹֽשְׂאֵ֛י הָ/אָר֥וֹן הַ/בְּרִ֖ית לִ/פְנֵ֥י הָ/עָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/003/014.yaml
  text: And it happened[a], when the people set out from their tents to cross the Jordan, and the priests carrying the ark of the covenant were before the people,
translation:
  language: ta
  text: மக்கள் யோர்தானைக் கடப்பதற்காகத் தங்கள் கூடாரங்களிலிருந்து புறப்பட்டபோது, உடன்படிக்கைப் பெட்டியைச் சுமந்த ஆசாரியர்கள் மக்களுக்கு முன்னால்[a] இருந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மக்களுக்கு முன்னே.”
    reason: לִפְנֵי என்பது ‘முன்னால்’ அல்லது ‘முன்னே’ என்ற இடநிலைப் பொருளைத் தரலாம்.
lexical_decisions:
- source_word: וַיְהִי בִּנְסֹעַ
  choice: புறப்பட்டபோது
  rationale: וַיְהִי என்ற எபிரெயக் கதைத் தொடர் வடிவத்தைத் தமிழில் தனியே மொழிபெயர்த்தால் செயற்கையாக இருக்கும்; בִּנְסֹעַ உடன் இணைத்து இயல்பான காலநிலைத் துணைவாக்கியமாக வழங்கப்பட்டுள்ளது.
- source_word: הָעָם
  choice: மக்கள்
  rationale: இச்சூழலில் இஸ்ரவேலரை ஒட்டுமொத்தமாகக் குறிக்கும் பொதுவான, நேரடியான சொல்.
- source_word: מֵאָהֳלֵיהֶם
  choice: தங்கள் கூடாரங்களிலிருந்து
  rationale: אֹהֶל என்பதன் konkrete பொருளான ‘கூடாரம்’ பாதுகாக்கப்படுகிறது; பயண முகாமின் சூழலுக்கும் இது பொருந்துகிறது.
- source_word: לַעֲבֹר אֶת־הַיַּרְדֵּן
  choice: யோர்தானைக் கடப்பதற்காக
  rationale: לַעֲבֹר நோக்கத்தைக் குறிக்கிறது; ஆற்றைக் கடக்கும் சூழலில் ‘கடப்பதற்காக’ தெளிவும் இயல்பும் உடையது.
- source_word: הַכֹּהֲנִים נֹשְׂאֵי
  choice: சுமந்த ஆசாரியர்கள்
  rationale: נֹשְׂאֵי ஆசாரியர்களை விவரிக்கும் பெயரெச்சச் செயல்பாட்டைக் கொண்டுள்ளது; ‘சுமந்த’ என்பது தமிழில் சுருக்கமாகவும் இயல்பாகவும் உள்ளது.
- source_word: אֲרוֹן הַבְּרִית
  choice: உடன்படிக்கைப் பெட்டி
  rationale: ஆரோன் என்பது இங்கு வழிபாட்டுக்குரிய பெட்டி; הַבְּרִית என்பதன் வேதாகம உடன்படிக்கைப் பொருளைத் தக்கவைக்கிறது.
- source_word: לִפְנֵי הָעָם
  choice: மக்களுக்கு முன்னால்
  rationale: இது மக்களுடன் ஒப்பிடப்பட்ட இடநிலையை நேரடியாகக் குறிக்கிறது; இயக்கத்தைத் தெளிவாகச் சேர்க்காமல் மூலத்தின் அமைப்பைப் பாதுகாக்கிறது.
