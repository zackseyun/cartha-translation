translation_notes:
  register: நவீனத் தரத் தமிழில், எளிமையான ஆனால் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய வசனம் தொடர்ச்சியான வாக்கிய அமைப்பைக் கொண்டிருந்தாலும், தமிழில் தனி வசனமாக வாசிக்க இயலுமாறு இயற்கையான வாக்கியமாக வடிவமைக்கப்பட்டுள்ளது.
