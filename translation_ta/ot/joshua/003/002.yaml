translation_notes:
  register: நவீன நிலையான தமிழில், எளிமையானதாயினும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ஆங்கில ஆலோசனை உரையில் அடிக்குறி காலச்சொற்றொடருக்குப் பின் இருந்தாலும், அதன் உள்ளடக்கம் וַיַּעַבְרוּ என்ற வினைச்சொல்லுக்கான மாற்று மொழிபெயர்ப்பாக இருப்பதால், தமிழில் அடிக்குறி அதற்குரிய வினைச்சொல்லுக்குப் பின் வைக்கப்பட்டுள்ளது.
