- from: மூன்று நாட்கள் முடிந்தபோது, அதிகாரிகள் முகாமின் நடுவே சென்றார்கள்[a].
  to: மூன்று நாட்களின் முடிவில், அதிகாரிகள் முகாமின் நடுவாகச் சென்றார்கள்[a].
  rationale: The revision retains the concise modern register while more closely representing the temporal boundary expressed by מִקְצֵה and the movement-through sense of וַיַּעַבְרוּ בְּקֶרֶב. The footnote remains anchored to the verb and now states the alternative in a complete, unambiguous Tamil phrase.
