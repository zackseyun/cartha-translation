translation:
  language: ta
  text: மூன்று நாட்களின் முடிவில், அதிகாரிகள் முகாமின் நடுவாகச் சென்றார்கள்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “முகாமின் நடுவே கடந்து சென்றார்கள்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: …முடிந்தபோது
  rationale: இது அடுத்த நிகழ்வை அறிமுகப்படுத்தும் எபிரேயக் கதைத் தொடராக உள்ளது. பழமையான சொற்றொடரைச் சொற்சொல்லாக மொழிபெயர்க்காமல், காலவாக்கியத்துடன் இயல்பாக இணைக்கப்பட்டுள்ளது.
- source_word: מִקְצֵה
  choice: முடிந்தபோது
  rationale: இச்சூழலில் மூன்று நாட்கள் நிறைவடைந்த கால எல்லையைக் குறிக்கிறது; நவீன தமிழில் இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: שְׁלֹשֶׁת יָמִים
  choice: மூன்று நாட்கள்
  rationale: எண்ணிக்கையையும் கால அளவையும் நேரடியாகக் கூறும் சொற்றொடர்.
- source_word: וַיַּעַבְרוּ
  choice: சென்றார்கள்
  rationale: முகாமின் உட்பகுதி வழியாக நகர்ந்ததை இயல்பான தமிழில் தெரிவிக்கிறது. ‘கடந்து சென்றார்கள்’ என்பதும் சாத்தியமான மாற்று என்பதால் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: הַשֹּׁטְרִים
  choice: அதிகாரிகள்
  rationale: அறிவுறுத்தல்களை எடுத்துச் சொல்லி நடைமுறைப்படுத்தும் நிர்வாகப் பொறுப்புடையவர்களை இச்சொல் குறிக்கிறது; ‘அதிகாரிகள்’ என்பது சூழலுக்கேற்ற பொதுவான தமிழ்.
- source_word: בְּקֶרֶב
  choice: நடுவே
  rationale: முகாமின் உட்பகுதிக்குள் அல்லது அதன் மத்தியில் நிகழ்ந்த நகர்வைச் சுருக்கமாகப் பாதுகாக்கிறது.
- source_word: הַמַּחֲנֶה
  choice: முகாம்
  rationale: இஸ்ரவேலர் தங்கியிருந்த பாளையத்தைக் குறிக்கும் இயல்பான நவீனத் தமிழ் சொல்.
