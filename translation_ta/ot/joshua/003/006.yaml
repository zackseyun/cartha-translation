base_translation:
  language: en
  yaml_path: translation/ot/joshua/003/006.yaml
  text: Then Joshua said to the priests, “Take up the ark of the covenant and cross over before the people.” So they took up the ark of the covenant and went before the people.
translation:
  language: ta
  text: பின்பு யோசுவா ஆசாரியர்களிடம், “உடன்படிக்கைப் பெட்டியைத் தூக்குங்கள்; மக்களுக்கு முன்பாகக் கடந்து செல்லுங்கள்” என்றார். ஆகவே அவர்கள் உடன்படிக்கைப் பெட்டியைத் தூக்கினார்கள்; மக்களுக்கு முன்பாகச் சென்றார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: பின்பு ... என்றார்
  rationale: வாவ் தொடர்வினை கதை நிகழ்வை அடுத்த கட்டத்துக்கு நகர்த்துகிறது. ‘பின்பு’ இயல்பான தமிழ் கதை ஓட்டத்தில் நிகழ்வுகளின் வரிசையைத் தெளிவாகக் காட்டுகிறது.
- source_word: יְהוֹשֻׁעַ
  choice: யோசுவா
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் நிலைபெற்றுள்ள பெயர் வடிவம்.
- source_word: הַכֹּהֲנִים
  choice: ஆசாரியர்கள்
  rationale: இஸ்ரவேலின் வழிபாட்டுப் பணியாளர்களைக் குறிக்கும் definite plural பெயர்ச்சொல்லின் மரபானவும் தெளிவானவும் உள்ள தமிழ் வடிவம்.
- source_word: שְׂאוּ / וַיִּשְׂאוּ
  choice: தூக்கிக்கொண்டு ... / தூக்கிக்கொண்டு ...
  rationale: נשא இங்கு பெட்டியைத் தூக்கிச் சுமப்பதைக் குறிக்கிறது. கட்டளையிலும் அதன் நிறைவேற்றத்திலும் ஒரே சொற்றொடரைப் பயன்படுத்துவது எபிரெயச் சொல்லின் மீளுரைப்பைப் பேணுகிறது.
- source_word: אֲרוֹן הַבְּרִית
  choice: உடன்படிக்கைப் பெட்டி
  rationale: உடன்படிக்கையுடன் தொடர்புடைய புனிதப் பெட்டியைக் குறிக்கும் construct தொடரை இயல்பாகவும் வெளிப்படையாகவும் தருகிறது.
- source_word: וְעִבְרוּ
  choice: கடந்து செல்லுங்கள்
  rationale: עבר என்பதன் ‘கடந்து செல்’ என்ற அடிப்படைப் பொருளை யோர்தான் கடத்தல் சூழலில் இயல்பாக வெளிப்படுத்துகிறது; இலக்கை உரையில் இல்லாதபடி சேர்க்கவில்லை.
- source_word: לִפְנֵי הָעָם
  choice: மக்களுக்கு முன்னால்
  rationale: மக்களின் முன்புறத்தில் அல்லது அவர்களுக்கு முன்னணியாக இருப்பதைக் குறிக்கும் לִפְנֵי என்பதன் இடவியல் பொருளைப் பேணுகிறது.
- source_word: וַיֵּלְכוּ
  choice: சென்றார்கள்
  rationale: הלך என்பதன் சாதாரண நகர்வு பொருளை இயல்பான தமிழ் கதைநடையில் தருகிறது; ‘நடந்தார்கள்’ என தேவையற்ற முறையில் நடையின் விதத்தை வலியுறுத்தவில்லை.
theological_decisions:
- issue: வழிபாட்டுச் சூழலில் אֲרוֹן הַבְּרִית என்ற உடன்படிக்கைச் சொற்றொடரின் மொழிபெயர்ப்பு
  choice: உடன்படிக்கைப் பெட்டி
  alternative: உடன்படிக்கையின் பெட்டி
  rationale: எபிரெய construct தொடரைச் சுருக்கமாகவும் தெளிவாகவும் வழங்குகிறது. பெட்டியின் புனிதத் தன்மையையோ அதன் உள்ளடக்கத்தையோ மூலத்தில் இருப்பதைவிட மேலாக விளக்காமல், அது உடன்படிக்கையுடன் கொண்ட தொடர்பை மட்டும் பேணுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. கட்டளையின் மரியாதைப் பன்மையும், கட்டளை–நிறைவேற்றம் இடையிலான சொல் ஒற்றுமையும் பேணப்பட்டுள்ளன.
