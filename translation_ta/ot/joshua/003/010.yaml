  text: וַ/יֹּ֣אמֶר יְהוֹשֻׁ֔עַ בְּ/זֹאת֙ תֵּֽדְע֔וּ/ן כִּ֛י אֵ֥ל חַ֖י בְּ/קִרְבְּ/כֶ֑ם וְ/הוֹרֵ֣שׁ יוֹרִ֣ישׁ מִ֠/פְּנֵי/כֶם אֶת הַ/כְּנַעֲנִ֨י וְ/אֶת הַ/חִתִּ֜י וְ/אֶת הַ/חִוִּ֗י וְ/אֶת הַ/פְּרִזִּי֙ וְ/אֶת הַ/גִּרְגָּשִׁ֔י וְ/הָ/אֱמֹרִ֖י וְ/הַ/יְבוּסִֽי־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/003/010.yaml
  text: And Joshua said[a], “By this you will know that the living God is among you, and that he will surely drive out from before you the Canaanites, the Hittites, the Hivites, the Perizzites, the Girgashites, the Amorites, and the Jebusites.”
translation:
  language: ta
  text: 'யோசுவா சொன்னார்: “இதனால், உயிருள்ள கடவுள் உங்களிடையே இருக்கிறார் என்பதையும், அவர் கானானியர், ஏத்தியர், ஏவியர், பெரிசியர், கிர்காசியர், எமோரியர், எபூசியர் ஆகியோரை உங்கள்முன்னிருந்து நிச்சயமாகத் துரத்திவிடுவார்[a] என்பதையும் நீங்கள் அறிந்துகொள்வீர்கள்.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நிச்சயமாக அவர்களை உரிமையிழக்கச் செய்வார்.” எபிரெய வினை, அவர்கள் நாட்டிலிருந்து உறுதியாக அகற்றப்படுவதை வலியுறுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: சொன்னார்
  rationale: எபிரெயக் கதைநடையின் wayyiqtol வடிவத்தை இயல்பான நவீனத் தமிழில் தருகிறது; வசனத் தொடரில் தனியாக ‘பின்பு’ அல்லது ‘மேலும்’ சேர்க்க வேண்டிய அவசியமில்லை.
- source_word: בְּזֹאת
  choice: இதனால்
  rationale: அடுத்து நிகழும் அடையாளத்தின் மூலம் மக்கள் அறிந்துகொள்வார்கள் என்ற கருவிப் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: תֵּדְעוּן
  choice: நீங்கள் அறிந்துகொள்வீர்கள்
  rationale: இரண்டாம் நபர் பன்மை imperfect வடிவத்தின் எதிர்காலப் பொருளைப் பேணுகிறது.
- source_word: אֵל חַי
  choice: உயிருள்ள கடவுள்
  rationale: אֵל חַי என்பதன் நேரடியான, இயல்பான தமிழ் வடிவம்; இங்கு எழுதப்படாத உடன்படிக்கைப் பெயரைச் சேர்க்கவில்லை.
- source_word: בְּקִרְבְּכֶם
  choice: உங்கள் நடுவில்
  rationale: மக்களிடையே கடவுளின் இருப்பைக் குறிக்கிறது; தனிநபருக்குள் இருப்பதாகத் தவறாகப் புரிந்துகொள்ளப்படுவதைத் தவிர்க்கிறது.
- source_word: וְהוֹרֵשׁ יוֹרִישׁ
  choice: நிச்சயமாகத் துரத்திவிடுவார்
  rationale: வினைமுற்றுடன் வந்த infinitive absolute தரும் உறுதியான வலியுறுத்தலை ‘நிச்சயமாக’ என்பதால் வெளிப்படுத்துகிறது; துரத்தி அகற்றும் செயலையும் தெளிவாகக் கூறுகிறது.
- source_word: מִפְּנֵיכֶם
  choice: உங்கள் முன்னிலையிலிருந்து
  rationale: ‘உங்கள் முகத்திற்கு/முன்னிலைக்கு முன்பாக இருந்து’ என்ற இடவியல் அகற்றப் பொருளைத் தமிழில் நெருக்கமாகப் பேணுகிறது.
- source_word: הַכְּנַעֲנִי ... הַיְבוּסִי
  choice: கானானியர் ... எபூசியர்
  rationale: எபிரெயத்தில் ஒருமை வடிவிலுள்ள கூட்டினப் பெயர்களைத் தமிழில் மக்களினங்களைக் குறிக்கும் மரியாதைப் பன்மை வடிவில் இயல்பாக வழங்குகிறது.
theological_decisions:
- issue: אֵל חַי என்பதை மொழிபெயர்த்தல்
  choice: உயிருள்ள கடவுள்
  alternative: வாழும் இறைவன்
  rationale: இவ்வசனத்தில் יהוה அல்ல, אֵל என்றே உள்ளது. ஆகவே எழுதப்படாத திருப்பெயரை இறக்குமதி செய்யாமல், உயிரும் செயற்பாடும் உள்ள கடவுள் என்ற மூலக் கூற்றைப் பேணுகிறது.
- issue: நிலத்திலிருந்து அகற்றுவதைக் குறிக்கும் conquest வினையின் வலிமை
  choice: நிச்சயமாகத் துரத்திவிடுவார்
  alternative: நிச்சயமாக உரிமையிழக்கச் செய்வார்
  rationale: எபிரெய வினை பட்டியலிடப்பட்ட மக்களைத் தீர்மானமாக அகற்றுவதைக் கூறுகிறது. தேர்ந்த வடிவம் அந்த வலிமையை மென்மைப்படுத்தாமலும், மூலத்தில் இல்லாத நியாயவிளக்கத்தைச் சேர்க்காமலும் வாசிக்க எளிதாக வழங்குகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகருக்கு விளங்கும் கண்ணியமான உரைநடை. இனப்பெயர்களுக்கு தமிழ் வேதாகம மரபில் பரவலாக அறியப்படும் ஒலிபெயர்ப்புகள் பயன்படுத்தப்பட்டுள்ளன. மூலத்தின் உறுதியான வலியுறுத்தலும் கடவுள் மக்களின் நடுவில் இருப்பது என்ற கருத்தும் தெளிவாகப் பேணப்பட்டுள்ளன.
