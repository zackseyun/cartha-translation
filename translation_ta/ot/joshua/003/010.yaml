  source_fidelity: 'முதன்மை உரை எபிரெய மூலத்துக்கு உண்மையாயுள்ளது: בְּזֹאת-இன் கருவிப் பொருள், אֵל חַי-யின் ‘உயிருள்ள கடவுள்,’ மக்களிடையேயான இறை இருப்பு, வலியுறுத்தும் וְהוֹרֵשׁ יוֹרִישׁ, மற்றும் ஏழு மக்களினங்களின் பட்டியல் அனைத்தும் பேணப்பட்டுள்ளன. ஆனால் அடிக்குறிப்பில் ‘அவர்களுடைய உடைமையிலிருந்து’ என்று வருவது மூல வினைக்குப் பொருந்தாது; அகற்றப்படுவது பட்டியலிடப்பட்ட மக்களே, அவர்களுடைய உடைமையிலிருந்து அல்ல.'
