base_translation:
  language: en
  yaml_path: translation/ot/joshua/003/008.yaml
  text: And you shall command the priests who carry the ark of the covenant[a], saying, ‘When you come to the edge of the waters of the Jordan, you shall stand in the Jordan.’
translation:
  language: ta
  text: 'நீயோ, உடன்படிக்கைப் பெட்டியைச் சுமக்கிற ஆசாரியர்களுக்கு இவ்வாறு கட்டளையிட வேண்டும்: “நீங்கள் யோர்தானின் நீரின் ஓரத்தை[a] அடையும்போது, யோர்தானில் நின்றுகொள்ளுங்கள்.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யோர்தானின் நீரின் விளிம்பை.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתָּה
  choice: நீயோ
  rationale: இணைப்பையும் யோசுவாவின்மீது வைக்கப்படும் வலியுறுத்தலையும் சுருக்கமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: תְּצַוֶּה
  choice: கட்டளையிட வேண்டும்
  rationale: யோசுவா செய்ய வேண்டிய அறிவுறுத்தலைத் தெளிவாகக் காட்டுகிறது; நவீனத் தமிழில் இயல்பான கட்டளைநடையையும் காக்கிறது.
- source_word: הַכֹּהֲנִים נֹשְׂאֵי
  choice: சுமக்கிற ஆசாரியர்கள்
  rationale: எபிரெயப் பங்கேற்புவினை ஆசாரியர்களை விவரிப்பதால், தமிழில் இயல்பான பெயரெச்சத் தொடராக மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: אֲרוֹן הַבְּרִית
  choice: உடன்படிக்கைப் பெட்டி
  rationale: அரோன் என்பது புனிதப் பெட்டியைக் குறிக்கிறது; ‘உடன்படிக்கைப் பெட்டி’ மூலத்தின் இணைப்பைத் துல்லியமாகவும் தெளிவாகவும் தருகிறது.
- source_word: לֵאמֹר
  choice: இவ்வாறு
  rationale: அடுத்து வரும் நேரடிக் கூற்றை நவீனத் தமிழில் இயல்பாக அறிமுகப்படுத்துகிறது.
- source_word: כְּבֹאֲכֶם
  choice: நீங்கள் ... அடையும்போது
  rationale: כְּ உடன் வரும் வினையெச்ச அமைப்பின் காலப்பொருளைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: עַד קְצֵה מֵי הַיַּרְדֵּן
  choice: யோர்தானின் நீரின் ஓரத்தை
  rationale: நீரின் எல்லை அல்லது விளிம்பை அடைவதைக் குறிக்கும் மூலச் சொற்றொடரை இயல்பான தமிழில் தருகிறது; ‘விளிம்பு’ என்ற மாற்று அடிக்குறிப்பில் காக்கப்பட்டுள்ளது.
- source_word: בַּיַּרְדֵּן
  choice: யோர்தானில்
  rationale: בְּ இடத்தைக் குறிக்கிறது. சூழலில் யோர்தான் ஆறு என்பது தெளிவாக இருப்பதால் மூலத்துக்கு நெருக்கமாக ‘யோர்தானில்’ என வழங்கப்பட்டுள்ளது.
- source_word: תַּעֲמֹדוּ
  choice: நின்றுகொள்ளுங்கள்
  rationale: ஆசாரியர்கள் ஆற்றுக்குள் சென்று தங்கள் இடத்தில் நிற்க வேண்டும் என்ற கட்டளையை நேரடியாகத் தெரிவிக்கிறது.
