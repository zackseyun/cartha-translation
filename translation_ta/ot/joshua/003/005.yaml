  yaml_path: translation/ot/joshua/003/005.yaml
  text: Then Joshua said to the people, “Consecrate yourselves, because tomorrow the LORD will do wonders among you.”
translation:
  language: ta
  text: பின்பு யோசுவா மக்களிடம், “உங்களைப் பரிசுத்தப்படுத்திக்கொள்ளுங்கள்; ஏனெனில் நாளை ஆண்டவர்[a] உங்கள் நடுவில் அற்புதங்களைச் செய்வார்” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இங்கு எபிரெய மொழியில் கடவுளின் தனிப்பட்ட பெயரான יהוה (YHWH) உள்ளது.
    reason: ‘ஆண்டவர்’ என்பது மூலத்திலுள்ள தனிப்பட்ட இறைப் பெயரை மொழிபெயர்க்கிறது என்பதை வாசகருக்குத் தெளிவுபடுத்துகிறது.
lexical_decisions:
- source_word: הִתְקַדָּשׁוּ
  choice: உங்களைத் தூய்மைப்படுத்திக்கொள்ளுங்கள்
  rationale: எபிரெயச் சொல்லின் தன்னிலை/மறுமை கட்டளையையும், வரவிருக்கும் இறைச் செயலுக்காகத் தங்களைத் தூயவர்களாக ஆயத்தப்படுத்தும் பொருளையும் இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: கட்டளைக்கான காரணத்தை நேரடியாகக் குறிக்கிறது; ‘because/for’ என்ற காரணப் பொருளைப் பாதுகாக்கிறது.
- source_word: בְּקִרְבְּכֶם
  choice: உங்கள் நடுவில்
  rationale: ‘உங்களுக்குள்/உங்கள் மத்தியில்’ என்ற இடைநிலைப் பொருளைச் சுருக்காமல் நேரடியாகத் தருகிறது.
- source_word: נִפְלָאוֹת
  choice: அற்புதங்கள்
  rationale: மனித ஆற்றலை மீறும் வியப்பூட்டும் செயல்களைக் குறிக்கும் எபிரெயப் பன்மையை இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரின் மொழிபெயர்ப்பு
  choice: ஆண்டவர்[a]
  alternative: யாவே / யெகோவா
  rationale: மூலத்தில் தனிப்பட்ட இறைப் பெயர் இருப்பதை அடிக்குறிப்பில் வெளிப்படையாகக் குறிப்பதுடன், பொதுவாகப் புரிந்துகொள்ளப்படும் மரியாதையான தமிழ் வழக்கை முதன்மை உரையில் பயன்படுத்துகிறது; குறிப்பிட்ட உச்சரிப்பை உறுதிப்படுத்தவில்லை.
translation_notes:
  register: நவீன தரத் தமிழில் எளிமையான, மரியாதையான நடையைப் பயன்படுத்துகிறது. ‘பரிசுத்தப்படுத்திக்கொள்ளுங்கள்’ என்பதற்குப் பதிலாக பொதுவாசகருக்கு இயல்பாகப் புரியும் ‘தூய்மைப்படுத்திக்கொள்ளுங்கள்’ தேர்ந்தெடுக்கப்பட்டது; இருப்பினும் சடங்கு மற்றும் ஒழுக்கத் தூய்மை ஆகியவற்றில் ஒன்றை மட்டும் நிர்ணயிக்காமல் மூலத்தின் பரந்த பொருள் பாதுகாக்கப்பட்டுள்ளது.
