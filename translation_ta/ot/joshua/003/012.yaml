translation:
  language: ta
  text: இப்போது இஸ்ரவேலின் கோத்திரங்களிலிருந்து பன்னிரண்டு ஆண்களைத் தேர்ந்தெடுத்துக்கொள்ளுங்கள்—ஒவ்வொரு கோத்திரத்திலிருந்தும் ஓர் ஆண்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעַתָּה
  choice: இப்போது
  rationale: அடுத்த கட்டளைக்கான உரையாடல் மாற்றத்தை இயல்பான நவீன தமிழில் தெரிவிக்கிறது; எபிரெய இணைப்புச் சொல்லைத் தனியாக மொழிபெயர்க்க வேண்டிய அவசியமில்லை.
- source_word: קְחוּ לָכֶם
  choice: தேர்ந்தெடுத்துக்கொள்ளுங்கள்
  rationale: לקח என்ற கட்டளை இச்சூழலில் பிரதிநிதிகளை எடுத்தல் அல்லது தேர்வு செய்தலைக் குறிக்கிறது; לָכֶם தரும் தங்களுக்காக என்ற நுண்பொருள் தமிழ் வினையின் ‘கொள்ளுங்கள்’ பகுதியில் இயல்பாக வெளிப்படுகிறது.
- source_word: שְׁנֵי עָשָׂר אִישׁ
  choice: பன்னிரண்டு ஆண்களை
  rationale: இங்கு אִישׁ கோத்திரங்களைப் பிரதிநிதித்துவப்படுத்தும் ஆண்களைக் குறிக்கிறது; பாலினத்தைப் பொதுமைப்படுத்தாமல் மூலத்தின் குறிப்பைத் தக்கவைக்கிறது.
- source_word: מִשִּׁבְטֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் கோத்திரங்களிலிருந்து
  rationale: தேர்ந்தெடுக்கப்படுவோரின் மூலக் குழுவைத் தெளிவாகவும் இயல்பாகவும் காட்டுகிறது.
- source_word: אִישׁ אֶחָד אִישׁ אֶחָד לַשָּׁבֶט
  choice: ஒவ்வொரு கோத்திரத்திலிருந்தும் ஓர் ஆண்
  rationale: எபிரெயத்தின் பகிர்வுப் பொருளுடைய மறுபதிப்பை இயல்பான தமிழில் வெளிப்படுத்தி, ஒவ்வொரு கோத்திரத்திற்கும் ஒரே பிரதிநிதி என்ற பொருளைப் பாதுகாக்கிறது.
