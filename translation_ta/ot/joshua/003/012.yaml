  terminology: ‘இஸ்ரவேல்,’ ‘கோத்திரங்கள்,’ ‘பன்னிரண்டு ஆண்கள்’ ஆகியவை வேதாகமச் சூழலுக்கும் மூலத்தின் பாலினக் குறிப்புக்கும் ஏற்றவை. ‘ஓர் ஆண்’ என்ற சொல் இங்கு பிரதிநிதியாகத் தேர்ந்தெடுக்கப்படும் ஒருவரைத் தெளிவாகக் குறிக்கிறது.
