translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும் வகையில் இயல்பானதும் கண்ணியமானதும். ‘கோத்திரம்’ என்ற பரவலாக அறியப்பட்ட வேதாகமச் சொல் தக்கவைக்கப்பட்டுள்ளது. மூலத்தின் பகிர்வுக் கட்டமைப்பு தமிழில் தெளிவாகவே வெளிப்படுவதால் அடிக்குறிப்பு தேவையில்லை.
