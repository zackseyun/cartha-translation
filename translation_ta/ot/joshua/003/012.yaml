  source_fidelity: மூல எபிரெயத்தின் கட்டளைத் தன்மை, ‘இப்போது’ என்ற உரையாடல் மாற்றம், இஸ்ரவேலின் கோத்திரங்களிலிருந்து பன்னிரண்டு ஆண்களை எடுக்கும்/தேர்ந்தெடுக்கும் செயல், ஒவ்வொரு கோத்திரத்துக்கும் ஒருவர் என்ற பகிர்வுப் பொருள் ஆகியவை துல்லியமாகக் காக்கப்பட்டுள்ளன. ‘தேர்ந்தெடுத்துக்கொள்ளுங்கள்’ என்பது קְחוּ לָכֶם என்பதற்கு இச்சூழலில் பாதுகாப்பான, பொருத்தமான விளக்கமாகும்.
