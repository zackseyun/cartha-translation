base_translation:
  language: en
  yaml_path: translation/ot/joshua/003/017.yaml
  text: And the priests carrying the ark of the covenant of Yahweh stood firmly on dry ground in the middle of the Jordan[c][b][a], while all Israel was crossing on dry ground until the whole nation had finished crossing the Jordan.
translation:
  language: ta
  text: யாவேயின் உடன்படிக்கைப் பெட்டியை ஏந்திய ஆசாரியர்கள் யோர்தானின் நடுவில் உலர்ந்த தரையில் உறுதியாக நின்றார்கள்[a]; இஸ்ரவேலர் அனைவரும் உலர்ந்த தரையில் கடந்து சென்றுகொண்டிருந்தார்கள், முழு தேசமும் யோர்தானைக் கடந்து முடிக்கும்வரை[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘உறுதியாக’ என்பது ஆசாரியர்கள் ஆற்றுப்படுகையில் அசையாமல் நிலைத்து நின்றதை வலியுறுத்துகிறது.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில் ‘முழு தேசமும்’ என்பது இஸ்ரவேலைக் குறிக்கும் கூட்டு ஒருமைச் சொல்; ‘மக்கள் அனைவரும்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַמְדוּ
  choice: நின்றார்கள்
  rationale: עמד என்பதன் Qal தொடர் வினை வடிவம் நின்ற நிலையை எடுத்துக்கொள்வதையோ தொடர்ந்து நிலைத்திருப்பதையோ குறிக்கிறது; இயல்பான தமிழ் கதைநடையில் ‘நின்றார்கள்’ பொருந்துகிறது.
- source_word: הַכֹּהֲנִים נֹשְׂאֵי
  choice: சுமந்த ஆசாரியர்கள்
  rationale: נֹשְׂאֵי என்பது ஆசாரியர்களின் அப்போது தொடர்ந்த செயலைக் குறிக்கும் வினையெச்சம்; ‘சுமந்த’ என்பது இயல்பான நவீன தமிழ்.
- source_word: הָאָרוֹן בְּרִית יְהוָה
  choice: யெகோவாவின் உடன்படிக்கைப் பெட்டி
  rationale: எபிரெயக் கட்டமைப்பின் உறவைக் காக்கும் தெளிவான தமிழ்; ‘உடன்படிக்கைப் பெட்டி’ என்பது ark of the covenant என்பதற்கான புரிந்துகொள்ளத்தக்க மரபான சொற்றொடர்.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: தெய்வீகப் பெயரை ஒரு பட்டத்தால் மாற்றாமல் தமிழில் பரவலாக அறியப்பட்ட பெயர்வடிவில் தருகிறது.
- source_word: בֶּחָרָבָה
  choice: உலர்ந்த தரையில் / உலர்ந்த தரை வழியாக
  rationale: நீரிலிருந்து வெளிப்பட்ட வறண்ட நிலத்தைக் குறிக்கிறது; இரண்டு இடங்களிலும் தமிழ்ச் சூழலுக்கு ஏற்ப வேற்றுமை உருபு மட்டும் மாறுகிறது.
- source_word: בְּתוֹךְ הַיַּרְדֵּן
  choice: யோர்தானின் நடுவில்
  rationale: בְּתוֹךְ என்பதன் உள்ளகம் அல்லது நடுப்பகுதி என்ற இடப்பொருளைத் தெளிவாகக் காட்டுகிறது.
- source_word: הָכֵן
  choice: உறுதியாக
  rationale: இங்கு ஆயத்தம் என்பதைக் காட்டிலும் நிலையாக அசையாமல் நின்றதைக் குறிக்கும் வினையடைப் பொருள் சூழலுக்கு ஏற்றது.
- source_word: וְכָל יִשְׂרָאֵל עֹבְרִים
  choice: இஸ்ரவேலர் அனைவரும் ... கடந்துகொண்டிருந்தார்கள்
  rationale: வினையெச்ச வடிவம் தொடர்ந்த செயலைக் காட்டுகிறது; ஆசாரியர்கள் நின்றிருந்தபோது கடத்தல் நடைபெற்ற கால ஒற்றுமையைத் தமிழ் தொடர்வினை வெளிப்படுத்துகிறது.
- source_word: עַד אֲשֶׁר תַּמּוּ
  choice: கடந்து முடிக்கும்வரை
  rationale: תם நிறைவடைதலைக் குறிக்கிறது; அடுத்துள்ள கடத்தல் வினையுடன் இணைத்து இயல்பான தமிழில் தரப்பட்டுள்ளது.
- source_word: כָּל הַגּוֹי
  choice: மக்கள் அனைவரும்
  rationale: גוי இங்கு இஸ்ரவேலை ஒரு கூட்டு மக்களாகக் குறிக்கிறது; ‘மக்கள் அனைவரும்’ நவீன தமிழில் இயல்பாகவும் உள்ளடக்கமாகவும் உள்ளது.
- source_word: לַעֲבֹר אֶת הַיַּרְדֵּן
  choice: யோர்தானைக் கடந்து
  rationale: முடிவடைந்த செயலை ‘கடந்து முடிக்க’ என்ற இயல்பான தமிழ் வினைத்தொடராக வழங்குகிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரின் மொழிபெயர்ப்பு
  choice: யெகோவா
  alternative: யாவே; கர்த்தர்
  rationale: மூலத்தில் தனிப்பெயர் நேரடியாக இருப்பதால் பட்டமான ‘கர்த்தர்’ என்பதற்குப் பதிலாகத் தமிழில் பரவலாக அறியப்பட்ட ஒலிபெயர்ப்பான ‘யெகோவா’ பயன்படுத்தப்பட்டது; ‘யாவே’ என்பது மற்றொரு சாத்தியமான ஒலிபெயர்ப்பு.
- issue: כָּל הַגּוֹי என்பதன் கூட்டு ஒருமை
  choice: மக்கள் அனைவரும்
  alternative: முழு தேசமும்
  rationale: இங்கு גוי அரசியல் நிலப்பரப்பைக் காட்டிலும் இஸ்ரவேல் மக்களைக் கூட்டாகக் குறிக்கிறது; ‘மக்கள் அனைவரும்’ சூழலைத் தெளிவாக்குகிறது, ஆனால் மூலத்தின் கூட்டு ஒருமையை ‘முழு தேசமும்’ நெருக்கமாகக் காட்டலாம்.
translation_notes:
  register: நவீனத் தரத் தமிழில் dignified narrative register பயன்படுத்தப்பட்டுள்ளது. ‘ஆசாரியர்கள்’, ‘உடன்படிக்கைப் பெட்டி’, ‘யோர்தான்’ ஆகிய பரவலாகப் புரியக்கூடிய வேதாகமச் சொற்கள் தக்கவைக்கப்பட்டுள்ளன. நீண்ட எபிரெய வாக்கியம் வாசிப்புத் தெளிவுக்காக இரண்டு தமிழ் வாக்கியங்களாகப் பிரிக்கப்பட்டது; இரண்டாம் வாக்கியத்தின் இறுதியில் சேர்க்கப்பட்ட ‘அவர்கள் அங்கே நின்றார்கள்’ என்பது மூலத்தின் பிரதான வினையை இயல்பான தமிழில் தொடரச் செய்கிறது.
