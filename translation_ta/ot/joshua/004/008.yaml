  text: וַ/יַּעֲשׂוּ כֵ֣ן בְּנֵי יִשְׂרָאֵ֘ל כַּ/אֲשֶׁ֣ר צִוָּ֣ה יְהוֹשֻׁעַ֒ וַ/יִּשְׂא֡וּ שְׁתֵּֽי עֶשְׂרֵ֨ה אֲבָנִ֜ים מִ/תּ֣וֹךְ הַ/יַּרְדֵּ֗ן כַּ/אֲשֶׁ֨ר דִּבֶּ֤ר יְהוָה֙ אֶל יְהוֹשֻׁ֔עַ לְ/מִסְפַּ֖ר שִׁבְטֵ֣י בְנֵֽי יִשְׂרָאֵ֑ל וַ/יַּעֲבִר֤וּ/ם עִמָּ/ם֙ אֶל הַ/מָּל֔וֹן וַ/יַּנִּח֖וּ/ם שָֽׁם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/004/008.yaml
  text: And the sons of Israel did so[a], just as Joshua had commanded, and they carried twelve stones from the midst of the Jordan, just as Yahweh had spoken to Joshua, according to the number of the tribes of the sons of Israel[c][b]; and they brought them over with them to the lodging place and set them down there.
translation:
  language: ta
  text: இஸ்ரவேல் மக்கள் யோசுவா கட்டளையிட்டபடியே செய்தார்கள். யாவே யோசுவாவிடம் கூறியபடி, இஸ்ரவேலின் கோத்திரங்களின் எண்ணிக்கைக்கு ஏற்ப பன்னிரண்டு கற்களை யோர்தானின் நடுவிலிருந்து எடுத்துச் சுமந்தார்கள். அவற்றைத் தங்களோடு தங்குமிடத்துக்குக் கொண்டுபோய், அங்கே வைத்தார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் மக்கள்
  rationale: எபிரெயச் சொற்றொடரின் குடும்ப/வம்சத் தொடர்பைத் தக்கவைத்தபடியே, நவீனத் தமிழில் இயல்பாகவும் பாலினத்தைத் தேவையின்றிக் குறுக்காமலும் உள்ளது.
- source_word: וַיַּעֲשׂוּ כֵן
  choice: அப்படியே செய்தார்கள்
  rationale: கொடுக்கப்பட்ட கட்டளைக்கு இணங்க நடந்ததை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: צִוָּה
  choice: கட்டளையிட்ட
  rationale: அதிகாரபூர்வமான அறிவுறுத்தலைக் குறிக்கும் வினையின் வலிமையைப் பாதுகாக்கிறது.
- source_word: וַיִּשְׂאוּ
  choice: எடுத்துச் சுமந்தார்கள்
  rationale: கற்களைத் தூக்கி எடுத்துச் சென்ற இரு கூறுகளையும் சூழலுக்கேற்றவாறு வெளிப்படுத்துகிறது.
- source_word: שְׁתֵּי עֶשְׂרֵה אֲבָנִים
  choice: பன்னிரண்டு கற்கள்
  rationale: மூலத்தின் எண்ணிக்கையையும் பொருளையும் நேரடியாகத் தருகிறது.
- source_word: מִתּוֹךְ הַיַּרְדֵּן
  choice: யோர்தானின் நடுவிலிருந்து
  rationale: תּוֹךְ என்பதன் இடஞ்சார்ந்த பொருளை இயல்பான தமிழில் பாதுகாக்கிறது; இங்கு ஆற்றுப்படுகையின் நடுப்பகுதி குறிப்பாக இருக்கலாம்.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் பரவலாக அறியப்படும் தனிப்பெயர் வடிவில் நான்கெழுத்துத் தெய்வீகப் பெயரை மொழிபெயர்க்கிறது.
- source_word: דִּבֶּר ... אֶל יְהוֹשֻׁעַ
  choice: யோசுவாவிடம் கூறியபடி
  rationale: முன்னர் யோசுவாவிடம் உரைக்கப்பட்டதைத் தமிழில் சுருக்கமாகவும் இயல்பாகவும் காட்டுகிறது.
- source_word: לְמִסְפַּר
  choice: எண்ணிக்கைக்கு ஏற்ப
  rationale: கற்களின் எண்ணிக்கையும் கோத்திரங்களின் எண்ணிக்கையும் ஒத்திருந்ததைத் தெளிவாகத் தெரிவிக்கிறது.
- source_word: שִׁבְטֵי בְנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் கோத்திரங்கள்
  rationale: முழு எபிரெயச் சொற்றொடரின் பொருளைத் தேவையற்ற மீளுரையின்றி இயல்பான தமிழில் தருகிறது.
- source_word: וַיַּעֲבִרוּם
  choice: அவற்றை ஆற்றின் மறுகரைக்குக் கொண்டுபோனார்கள்
  rationale: ஹிஃபில் வடிவிலுள்ள கடத்திச் செல்லும் பொருளையும் யோர்தானைக் கடந்த சூழலையும் தெளிவாக்குகிறது.
- source_word: הַמָּלוֹן
  choice: தங்குமிடம்
  rationale: இரவு தங்குவதற்கான இடம் அல்லது முகாம் என்ற மூலச் சொல்லின் குறிப்பிட்ட பொருளைச் சுருக்கமாகத் தருகிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரின் மொழிபெயர்ப்பு
  choice: யெகோவா
  alternative: யாவே
  rationale: மூலத்தில் பொதுப்பட்டப்பெயர் அல்ல, தனிப்பட்ட உடன்படிக்கைப் பெயர் உள்ளது. தமிழில் மரபாகவும் பரவலாகவும் அறியப்படும் ‘யெகோவா’ வடிவைத் தேர்ந்தெடுத்து, பெயரை ‘கர்த்தர்’ என்று மாற்றவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. எபிரெய வாக்கியத்தின் தொடர்ச்சியான நிகழ்வோட்டம் குறுகிய தமிழ் வாக்கியங்களாகப் பிரிக்கப்பட்டுள்ளது. ‘தங்குமிடம்’ என்பது சாதாரண நிரந்தர வசிப்பிடத்தை அல்ல, அந்த இரவுக்கான முகாம் அல்லது தங்கும் இடத்தைக் குறிக்கிறது.
