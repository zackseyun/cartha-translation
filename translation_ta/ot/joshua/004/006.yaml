  text: so that this may be a sign among you[a]. When your children ask in time to come, saying[c][b], ‘What do these stones mean to you?’
translation:
  language: ta
  text: இது உங்கள் நடுவில் ஓர் அடையாளமாக இருக்கும்படி. வருங்காலத்தில்[c] உங்கள் பிள்ளைகள்[a], “இந்தக் கற்கள் உங்களுக்கு எதைக் குறிக்கின்றன?”[b] என்று கேட்கும்போது,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொற்படியாக, “உங்கள் மகன்கள்.” இங்கு அது அடுத்த தலைமுறையைப் பிரதிநிதித்துவமாகக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: இன்னும் சொற்படியாக, “இந்தக் கற்கள் உங்களுக்கு என்ன?”
    reason: lexical_alternative
  - marker: c
    text: எபிரெயத்தில் சொற்படியாக, “நாளை.” இங்கு அது “பிற்காலத்தில்” அல்லது “வருங்காலத்தில்” என்று பொருள்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַעַן תִּהְיֶה זֹאת
  choice: இது … இருப்பதற்காகவே
  rationale: לְמַעַן அறிமுகப்படுத்தும் நோக்கப் பொருளையும், תִּהְיֶה என்பதன் நோக்கப்பட்ட விளைவையும் தமிழில் இயல்பான நோக்கத் தொடரால் தெரிவிக்கிறது. முந்தைய வசனத்தின் செயலைச் சார்ந்திருக்கும் மூலவாக்கிய அமைப்பும் பாதுகாக்கப்படுகிறது.
- source_word: אוֹת
  choice: அடையாளம்
  rationale: நினைவூட்டும் குறியீடாகச் செயல்படும் ஒன்றைக் குறிக்கும் நேரடியான, பொதுவாகப் புரியும் தமிழ்ச் சொல்.
- source_word: בְּקִרְבְּכֶם
  choice: உங்கள் நடுவில்
  rationale: சமூகத்தின் மத்தியில் அல்லது அவர்களிடையே இருப்பதைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: בְּנֵיכֶם
  choice: உங்கள் பிள்ளைகள்
  rationale: எபிரெயச் சொல் சொற்படியாக ‘உங்கள் மகன்கள்’ என்றாலும், இச்சூழலில் நினைவுச் சின்னத்தைப் பற்றி விசாரிக்கும் அடுத்த தலைமுறையைக் பிரதிநிதித்துவமாகக் குறிக்கிறது.
- source_word: מָחָר
  choice: பிற்காலத்தில்
  rationale: சொற்பொருள் ‘நாளை’; இங்கு எதிர்காலத்தில் ஒரு காலத்தைச் சுட்டும் மரபுத்தொடராக இருப்பதால், ‘பிற்காலத்தில்’ என்று இயல்பாக மொழிபெயர்க்கப்படுகிறது.
- source_word: מָה הָאֲבָנִים הָאֵלֶּה לָכֶם
  choice: இந்தக் கற்கள் உங்களுக்கு என்ன பொருள்?
  rationale: சொல்லுக்குச் சொல் ‘இந்தக் கற்கள் உங்களுக்கு என்ன?’ என்ற கேள்வி, இங்கு அவற்றின் முக்கியத்துவம் அல்லது பொருளை விசாரிக்கிறது; தேர்ந்தெடுத்த வடிவம் அந்தக் கேள்வியின் வலிமையை இயல்பான தமிழில் தருகிறது.
theological_decisions:
- issue: בְּנֵיכֶם என்பதிலுள்ள பாலினக் குறிப்பு
  choice: உங்கள் பிள்ளைகள்
  alternative: உங்கள் மகன்கள்
  rationale: ஆண்பால் பன்மை வடிவம் இருந்தாலும், நினைவுச் சின்னத்தைப் பற்றி கேட்கும் அடுத்த தலைமுறையைக் கூட்டாகக் குறிக்கும் சூழல் இது. ஆகவே ஆண் பிள்ளைகளுக்கு மட்டும் வரம்பிடாமல் மூலத்தின் நோக்கப்பட்ட குறிப்பைத் தெரிவிக்கிறது.
- issue: מָחָר என்பதன் காலக் குறிப்பு
  choice: பிற்காலத்தில்
  alternative: நாளை
  rationale: இங்கு குறிப்பிட்ட அடுத்த நாளை மட்டும் குறிக்காமல், பின்வரும் தலைமுறை கேட்கும் எதிர்கால காலத்தைச் சுட்டுகிறது; இதன் மரபுத்தொடர் பொருள் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. வசனம் அடுத்த வசனத்தில் நிறைவுபெறும் நிபந்தனைத் தொடராக இருப்பதால் இறுதியில் காற்புள்ளி வைக்கப்பட்டுள்ளது; தொடக்க நோக்கத் தொடர் முந்தைய வசனத்தின் செயலைச் சார்ந்திருப்பதும் வெளிப்படையாக வைக்கப்பட்டுள்ளது.
