    rationale: Modern Tamil normally asks “என்ன அர்த்தம்?” for meaning, but that can imply lexical meaning. Since the Hebrew asks the stones’ significance, “எதைக் குறிக்கின்றன?” communicates the intended sense naturally while the literal alternative remains footnoted.
  - severity: low
    issue: “பிற்காலத்தில்” is somewhat less direct than “வருங்காலத்தில்” for the idiomatic future sense of מָחָר.
    rationale: “வருங்காலத்தில்” naturally denotes the future time anticipated in this intergenerational memorial context.
