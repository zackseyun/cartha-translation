translation_notes:
  register: நவீனத் தரநிலைத் தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான வரலாற்று உரைநடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய மூலத்தின் இயக்கத் திசையும் புவியியல் தொடர்பில் உள்ள சிறிய தெளிவின்மையும் அடிக்குறிப்புகள் மூலம் பாதுகாக்கப்பட்டுள்ளன.
