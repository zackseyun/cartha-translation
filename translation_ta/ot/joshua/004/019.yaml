  terminology: யோர்தான், எரிகோ, கில்கால் ஆகிய இடப்பெயர்கள் நிலையாகவும் புரிந்துகொள்ளத்தக்கவாறும் உள்ளன. “கிழக்கு எல்லையில்” என்பது בִּקְצֵה מִזְרַח יְרִיחוֹ என்பதற்கான ஏற்ற முறையான மொழிபெயர்ப்பு; அடிக்குறிப்பு மாற்று இடவியல் சொல்லாக்கத்தையும் பாதுகாக்கிறது.
