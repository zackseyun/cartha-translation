base_translation:
  language: en
  yaml_path: translation/ot/joshua/004/019.yaml
  text: And the people came up from the Jordan on the tenth day of the first month[b][a], and they camped at Gilgal on the eastern border of Jericho.
translation:
  language: ta
  text: மக்கள் முதல் மாதத்தின் பத்தாம் நாளில் யோர்தானிலிருந்து மேலே வந்தார்கள்[a]. அவர்கள் எரிகோவின் கிழக்கு எல்லையில் இருந்த கில்காலில் முகாமிட்டார்கள்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யோர்தானிலிருந்து மேலே சென்றார்கள்.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “எரிகோவுக்குக் கிழக்கே இருந்த கில்காலில் முகாமிட்டார்கள்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: עָלוּ
  choice: மேலே வந்தார்கள்
  rationale: עלה என்பது ‘மேலே செல்/வா’ என்ற இயக்கத்தைக் குறிக்கிறது. ஆற்றிலிருந்து கரைக்கு ஏறிவந்த திசை உணர்வை இயல்பான தமிழில் இது காக்கிறது.
- source_word: מִן הַיַּרְדֵּן
  choice: யோர்தானிலிருந்து
  rationale: מן என்பது இங்கு யோர்தான் ஆற்றிலிருந்து வெளியே வந்த இயக்கத்தைக் குறிக்கிறது; சூழலில் ‘யோர்தான்’ என்பதே ஆற்றைக் குறிக்கப் போதுமானது.
- source_word: בֶּעָשׂוֹר לַחֹדֶשׁ הָרִאשׁוֹן
  choice: முதல் மாதத்தின் பத்தாம் நாளில்
  rationale: எபிரெய தேதிக் குறிப்பைத் தெளிவான, இயல்பான தமிழ் நாள்காட்டி நடையில் வழங்குகிறது.
- source_word: וַיַּחֲנוּ
  choice: முகாமிட்டார்கள்
  rationale: חנה என்பதன் பொருள் முகாமிடுதல்; இச்சொல் நவீனத் தமிழில் தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: בַּגִּלְגָּל
  choice: கில்காலில்
  rationale: இடப்பெயர் ஒலிபெயர்க்கப்பட்டு, முகாமிட்ட இடத்தைக் குறிக்க ‘-இல்’ வேற்றுமை பயன்படுத்தப்பட்டுள்ளது.
- source_word: בִּקְצֵה מִזְרַח יְרִיחוֹ
  choice: எரிகோவின் கிழக்கு எல்லையில்
  rationale: קצה என்பது ‘எல்லை/ஓரம்’ என்றும் מזרח என்பது ‘கிழக்கு’ என்றும் பொருள்படும். இத்தொடர் எரிகோவின் கிழக்குப் பக்க எல்லையைக் குறிக்கும் வகையில் முறையான தமிழில் வழங்கப்பட்டுள்ளது.
