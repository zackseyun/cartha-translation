  choice: உடன்படிக்கைப் பெட்டியைச் சுமந்த
  rationale: தொடர்ந்து நிகழ்ந்த செயலைக் குறிக்கும் participial அமைப்பை இயல்பான தமிழில் தருகிறது. இச்சூழலில் אָרוֹן என்பது உடன்படிக்கைப் பெட்டி என்பதைத் தெளிவுபடுத்துகிறது.
- source_word: עֹמְדִים
  choice: நின்றுகொண்டிருந்தார்கள்
  rationale: எபிரெயப் பங்கேற்பெயரின் நீடித்த நிலையைத் தமிழில் துல்லியமாக வெளிப்படுத்துகிறது.
- source_word: בְּתוֹךְ הַיַּרְדֵּן
  choice: யோர்தானின் நடுவில்
  rationale: בְּתוֹךְ என்பதன் இடஞ்சார்ந்த ‘நடுவில்’ என்ற பொருளை நேரடியாகப் பாதுகாக்கிறது; யோர்தான் இங்கு ஆற்றைக் குறிக்கிறது.
- source_word: עַד תֹּם כָּל הַדָּבָר
  choice: காரியங்கள் அனைத்தும் நிறைவேறும்வரை
  rationale: சொல்லுக்குச் சொல் ‘முழுக் காரியம்/வார்த்தை முடிவடையும் வரை’; சூழலில் கட்டளையிடப்பட்ட அனைத்தின் நிறைவைச் சுட்டுவதால் வாசிக்க இயல்பாக இவ்வாறு தரப்படுகிறது. மூலத்தின் பரந்த பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
