base_translation:
  language: en
  yaml_path: translation/ot/joshua/004/010.yaml
  text: And the priests carrying the ark stood in the midst of the Jordan until everything was finished that Yahweh had commanded Joshua to speak to the people[a], according to all that Moses had commanded Joshua. And the people hurried and crossed over.
translation:
  language: ta
  text: உடன்படிக்கைப் பெட்டியைச் சுமந்த ஆசாரியர்கள், யாவே யோசுவாவுக்கு மக்களிடம் சொல்லும்படி கட்டளையிட்ட எல்லாக் காரியங்களும்[a]—மோசே யோசுவாவுக்குக் கட்டளையிட்ட எல்லாவற்றின்படியே—முடிவடையும்வரை, யோர்தானின் நடுவில் நின்றுகொண்டே இருந்தார்கள். மக்கள் விரைந்து ஆற்றைக் கடந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயில், “முழுக் காரியமும் முடிவடையும்வரை.” யாவே யோசுவாவுக்கு மக்களிடம் சொல்லும்படி கட்டளையிட்ட அனைத்தின் நிறைவை இச்சொற்றொடர் தொகுத்துக் கூறுகிறது.
    reason: lexical_alternative
