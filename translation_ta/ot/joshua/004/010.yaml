  choice: யாவே ... கட்டளையிட்ட
  rationale: கட்டளையின் முன்நிகழ்வைத் தமிழ் வினையெச்ச அமைப்பு இயல்பாகக் காட்டுகிறது; יהוה தனிப்பட்ட இறைப் பெயராக ஒலிபெயர்க்கப்படுகிறது.
- source_word: לְדַבֵּר אֶל הָעָם
  choice: மக்களுக்குச் சொல்லும்படி
  rationale: דבר אל என்ற பேச்சுச் செயலை இயல்பான நவீன தமிழில் தருகிறது; செய்தியின் உள்ளடக்கத்தைத் தேவையின்றி விரிவாக்கவில்லை.
- source_word: כְּכֹל אֲשֶׁר צִוָּה מֹשֶׁה אֶת יְהוֹשֻׁעַ
