  rationale: כְּכֹל குறிக்கும் முழுமையான ஒத்திசைவு அல்லது இணக்கத்தை ‘அனைத்தின்படியே’ பாதுகாக்கிறது.
- source_word: וַיְמַהֲרוּ
  choice: விரைந்து
  rationale: வினைச்சொல் குறிக்கும் அவசரத்தையும் வேகத்தையும் சுருக்கமான இயல்பான தமிழில் தருகிறது.
- source_word: וַיַּעֲבֹרוּ
  choice: ஆற்றைக் கடந்தார்கள்
  rationale: இச்சூழலில் עבר என்பது யோர்தான் ஆற்றைக் கடப்பதைக் குறிக்கிறது; தமிழில் பொருளைத் தெளிவாக்க ‘ஆற்றை’ சேர்க்கப்பட்டுள்ளது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலத்தில் நான்கெழுத்து இறைப் பெயர் நேரடியாக வருகிறது. அதை ஒரு பட்டப்பெயராக மாற்றாமல், தமிழில் பரவலாக அறியத்தக்க ஒலிபெயர்ப்பால் உடன்படிக்கைப் பெயராகப் பாதுகாக்கிறது.
- issue: הָאָרוֹן என்பதன் சூழல்சார் அடையாளம்
  choice: உடன்படிக்கைப் பெட்டி
  alternative: பெட்டி
  rationale: யோசுவா 3–4 அதிகாரங்களின் சூழலில் இது உடன்படிக்கைப் பெட்டியே. வெறும் ‘பெட்டி’ என்பது நவீன தமிழில் தேவையான அடையாளத்தை மறைக்கக்கூடும்; சேர்க்கப்பட்ட விளக்கம் புதிய கோட்பாட்டை இறக்குமதி செய்யவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் மரியாதைமிக்க கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘நின்றுகொண்டிருந்தார்கள்’ நீடித்த செயலைக் காக்கிறது; அடைப்புக்கோடுகளுக்கிடையிலான சொற்றொடர் எபிரெய வாக்கியத்தின் தொடர்பையும் மோசேயின் கட்டளையுடனான இணக்கத்தையும் தெளிவாக வைத்திருக்கிறது.
