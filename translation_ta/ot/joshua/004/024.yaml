  text: so that all the peoples of the earth may know that the hand of Yahweh is strong[b][a], and so that you may fear Yahweh your God all your days.
translation:
  language: ta
  text: பூமியிலுள்ள[a] எல்லா மக்களும் யாவேவின் கை வலிமையானது என்று அறியும்படியாகவும், நீங்கள் உங்கள் கடவுளாகிய யாவேவுக்கு உங்கள் வாழ்நாளெல்லாம் பயப்படும்படியாகவும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “பூமியிலுள்ள” என்பதற்குப் பதிலாக, இங்கு எபிரெயச் சொல்லை உள்ளூர் பொருளில் எடுத்தால் “நாட்டிலுள்ள” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַעַן דַּעַת
  choice: அறிந்துகொள்வதற்காக
  rationale: לְמַעַן அறிமுகப்படுத்தும் நோக்கத்தையும், דַּעַת என்பதன் ‘அறிதல்’ பொருளையும் இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: כָּל עַמֵּי הָאָרֶץ
  choice: பூமியிலுள்ள எல்லா மக்களும்
  rationale: עַמֵּי என்பது தனித்தனி மக்கள் இனங்களைக் குறிக்கிறது; இச்சூழலில் הָאָרֶץ உலகளாவிய ‘பூமி’ என்று முதன்மையாக எடுத்துக்கொள்ளப்படுகிறது. உள்ளூர் பொருளான ‘நாடு’ அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: יַד יְהוָה
  choice: யெகோவாவின் கை
  rationale: தெய்வீக வல்லமையைக் குறிக்கும் எபிரெய உருவகத்தை ‘வல்லமை’ என்று விளக்கிச் சமப்படுத்தாமல் அப்படியே பாதுகாக்கிறது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: தேவனுடைய உடன்படிக்கைப் பெயரான நான்கெழுத்துப் பெயரை பொதுப்பட்டமான ‘ஆண்டவர்’ என்று மாற்றாமல் பெயராக வழங்குகிறது.
- source_word: כִּי חֲזָקָה הִיא
  choice: வலிமையானது என்பதை
  rationale: חֲזָקָה என்பதன் நேரடியான ‘வலிமையான’ பொருளைப் பாதுகாக்கிறது; הִיא முன்வரும் ‘கை’யைக் குறிக்கிறது.
- source_word: יְרָאתֶם אֶת
  choice: பயந்து நடப்பதற்காக
  rationale: ירא என்பதன் ‘பயப்படுதல்’ என்ற நேரடிப் பொருளைப் பாதுகாக்கிறது. தமிழில் கடவுளை நோக்கிய தொடர்ந்த வாழ்க்கைநிலையை இயல்பாக உணர்த்த ‘நடப்பது’ சேர்க்கப்பட்டுள்ளது; இதில் பயபக்தியும் அச்சமும் அடங்கும் என்பதை அடிக்குறிப்பு விளக்குகிறது.
- source_word: אֱלֹהֵיכֶם
  choice: உங்கள் கடவுள்
  rationale: இங்கு יְהוָה என்பவரையே குறிக்கும் உடன்படிக்கைச் சூழலால் இலக்கண வடிவம் ஒருமைப் பட்டமாக மொழிபெயர்க்கப்படுகிறது.
- source_word: כָּל הַיָּמִים
  choice: உங்கள் வாழ்நாளெல்லாம்
  rationale: சொல்லுக்குச் சொல் ‘எல்லா நாட்களும்’ என்பதன் வாழ்நாள் முழுவதும் நீடிக்கும் பொருளை இயல்பான தமிழில் தெளிவாக வழங்குகிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரை மொழிபெயர்த்தல்
  choice: யெகோவா
  alternative: ஆண்டவர்
  rationale: மூலத்தில் தனிப்பட்ட உடன்படிக்கைப் பெயர் நேரடியாக உள்ளது; அதை ஒரு பொதுப் பட்டமாக மாற்றாமல் தமிழில் பரவலாக அறியப்பட்ட பெயர்வடிவில் பாதுகாக்கிறது.
- issue: ירא என்பதை அச்சமா அல்லது பயபக்தியா என்று வழங்குதல்
  choice: பயந்து நடக்க
  alternative: பயபக்தியுடன் இருக்க
  rationale: மூலச்சொல்லின் அச்சம், பிரமிப்பு, மரியாதை ஆகிய பொருள் இழுவிசையை ஒரே மென்மையான சொல்லால் தீர்த்துவிடாமல் ‘பயம்’ என்ற நேரடிக் கருத்தைப் பாதுகாக்கிறது; அதன் விரிந்த பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- issue: הָאָרֶץ என்பதன் பரப்பு
  choice: பூமி
  alternative: நாடு
  rationale: எல்லா மக்கள் இனங்களும் தேவனுடைய வலிமையை அறிவது என்ற பரந்த நோக்கம் உலகளாவிய வாசிப்பை ஆதரிக்கிறது; இருப்பினும் உள்ளூர் ‘நாடு’ என்ற சாத்தியம் உண்மையான சொற்பொருள் மாற்றாக அடிக்குறிப்பில் வைக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையும் கண்ணியமும் பேணப்பட்டுள்ளன. மூலத்தின் இரண்டு לְמַעַן நோக்குக் கூறுகளும் இணையான ‘…தற்காகவும்’ அமைப்பில் வைக்கப்பட்டுள்ளன. தனித்து மேற்கோள் கொள்ளப்படும் வசனம் தமிழில் முழுமையான வாக்கியமாக இருக்க, முந்தைய சூழலில் உள்ள செயலைச் சுட்டும் ‘அவர் இப்படிச் செய்தார்’ இறுதியில் வெளிப்படையாகச் சேர்க்கப்பட்டுள்ளது.
