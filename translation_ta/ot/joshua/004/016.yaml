  text: Command the priests who carry the ark of the testimony to come up from the Jordan[a].
translation:
  language: ta
  text: “சாட்சிப்பேழையைச் சுமக்கும் ஆசாரியர்கள் யோர்தானிலிருந்து மேலேறும்படி அவர்களுக்குக் கட்டளையிடு.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சாட்சியின் பேழை.” இங்கு எபிரெய மூலத்தில் “சாட்சி” என்றே உள்ளது; பேழையைக் குறிக்கும் பல பிற இடங்களில் காணப்படும் வழக்கமான “உடன்படிக்கை” என்ற சொல் இங்கு இல்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: צַוֵּה
  choice: கட்டளையிடு
  rationale: இது யோசுவாவை நோக்கிய இரண்டாம் நபர் ஆண்பால் ஒருமை கட்டளை வினை; அதன் நேரடியான வலிமையைத் தக்கவைக்கிறது.
- source_word: הַכֹּהֲנִים
  choice: ஆசாரியர்கள்
  rationale: குறிப்பிட்ட ஆசாரியர்களைக் குறிக்கும் எபிரெய வரையறைச் சுட்டுடன் இயல்பாகப் பொருந்தும் வழக்கமான தமிழ் வேதாகமச் சொல்.
- source_word: נֹשְׂאֵי
  choice: சுமக்கிற
  rationale: ஆசாரியர்களை விவரிக்கும் பன்மை நிகழ்காலப் பெயரெச்சத்தின் தொடர்ச்சியான செயற்பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: אֲרוֹן הָעֵדוּת
  choice: சாட்சிப்பேழை
  rationale: எபிரெய மூலத்தில் ‘உடன்படிக்கை’ என்பதற்குப் பதிலாக ‘சாட்சி/சான்று’ என்று இருப்பதை இசைவுபடுத்தாமல் தக்கவைக்கிறது; தமிழில் இயல்பான தொகைச்சொல்லாக அமைக்கப்பட்டுள்ளது.
- source_word: וְיַעֲלוּ
  choice: ஏறிவரும்படி
  rationale: עלה என்பதன் ‘மேலேறு/ஏறிவா’ என்ற இயக்கத்தை ஆற்றுப்படுகையிலிருந்து மேலே வருகிற சூழலில் தெளிவாகக் காட்டுகிறது.
- source_word: מִן הַיַּרְדֵּן
  choice: யோர்தானிலிருந்து
  rationale: מן குறிக்கும் நீங்கல் இயக்கத்தை நேரடியாக வெளிப்படுத்துகிறது; ‘யோர்தான்’ என்பது ஆற்றைக் குறிக்கும் பெயராகச் சூழலில் தெளிவாக உள்ளது.
theological_decisions:
- issue: אֲרוֹן הָעֵדוּת என்பதைக் ‘உடன்படிக்கைப் பேழை’ என்று வழக்கப்படுத்தலாமா
  choice: சாட்சிப்பேழை
  alternative: உடன்படிக்கைப் பேழை
  rationale: இவ்வசனத்தின் எபிரெய உரை עֵדוּת (‘சாட்சி/சான்று’) எனக் கூறுகிறது; பிற இடங்களிலுள்ள வழக்கமான ‘உடன்படிக்கை’ என்ற சொல்லோடு அமைதியாக இசைவுபடுத்தாமல் மூலத்தின் தனித்துவத்தைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையும் கண்ணியமும் பேணப்பட்டுள்ளன. ‘ஆசாரியர்கள்’ மற்றும் ‘பேழை’ போன்ற பரவலாக அறியப்பட்ட வேதாகமச் சொற்கள் பயன்படுத்தப்பட்டுள்ளன; கட்டளையின் நேரடி வலிமையும் ஆற்றிலிருந்து மேலே வரும் இயக்கமும் தெளிவாக வைக்கப்பட்டுள்ளன.
