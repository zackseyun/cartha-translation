base_translation:
  language: en
  yaml_path: translation/ot/joshua/004/021.yaml
  text: And he said to the sons of Israel[a], “When your children ask their fathers in time to come, saying[c][b], ‘What are these stones?’”
translation:
  language: ta
  text: 'அவர் இஸ்ரவேல் மக்களிடம் கூறினார்: “வருங்காலத்தில்[c] உங்கள் பிள்ளைகள்[b] தங்கள் தந்தைகளிடம், ‘இந்தக் கற்கள் என்ன?’[a] என்று கேட்கும்போது,”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, பொருளை விளக்கிக் கூறினால், “இந்தக் கற்கள் எதைக் குறிக்கின்றன?” எபிரெயத்தில் இன்னும் நேரடியாக, “இந்தக் கற்கள் என்ன?” என்று உள்ளது.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில் “உங்கள் மகன்கள்.” இங்கு இச்சொல் பொதுவாகப் பிள்ளைகளையோ பின்வரும் தலைமுறையினரையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: எபிரெயத்தில் “நாளை”; இங்கு அது பிற்காலத்தை அல்லது வரவிருக்கும் தலைமுறையைச் சுட்டும் மரபுத்தொடராகப் பயன்படுத்தப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: அவர் … கூறினார்
  rationale: தொடர்ச்சியான எபிரெய கதைநடையை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது; கால நுணுக்கத்தை அளவுக்கு மீறி விளக்கவில்லை.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் மக்கள்
  rationale: சொல்லுக்கு சொல் வடிவம் ‘இஸ்ரவேலின் மகன்கள்’ என்றாலும், இங்கு முழு இஸ்ரவேல் சமூகத்தைக் குறிக்கும் இயல்பான தமிழ்ச் சொற்றொடர் இது.
- source_word: לֵאמֹר
  choice: 'கூறினார்: / என்று'
  rationale: முதல் இடத்தில் நேரடிக் கூற்றை இரட்டைப் புள்ளியும் மேற்கோளும் இயல்பாக அறிமுகப்படுத்துகின்றன; இரண்டாம் இடத்தில் கேள்வியின் உள்ளடக்கத்தை ‘என்று’ அறிமுகப்படுத்துகிறது.
- source_word: אֲשֶׁר יִשְׁאָלוּן
  choice: கேட்கும்போது
  rationale: எதிர்காலத்தில் நிகழவிருக்கும் சூழலை அறிமுகப்படுத்தும் எபிரெய அமைப்பை இயல்பான தமிழில் நிபந்தனை-கால வினையெச்சமாக வழங்குகிறது.
- source_word: בְּנֵיכֶם
  choice: உங்கள் பிள்ளைகள்
  rationale: சொல்லுக்கு சொல் ‘உங்கள் மகன்கள்’; இச்சூழலில் பின்வரும் தலைமுறையினரான பிள்ளைகளைப் பொதுவாகக் குறிக்கிறது.
- source_word: מָחָר
  choice: வருங்காலத்தில்
  rationale: இங்கு ‘நாளை’ என்ற அடுத்த நாளை மட்டும் குறிக்காமல், பிற்காலத்தையோ அடுத்த தலைமுறையையோ குறிக்கும் மரபுத்தொடரான பயன்பாட்டை வெளிப்படுத்துகிறது.
- source_word: אֶת אֲבוֹתָם
  choice: தங்கள் தந்தையரிடம்
  rationale: பிள்ளைகள் தங்கள் தந்தையரிடம் கேட்கும் குடும்பச் சூழலை நேரடியாகப் பாதுகாக்கிறது; ‘மூதாதையர்’ என்று தேவையின்றி விரிவுபடுத்தவில்லை.
- source_word: מָה הָאֲבָנִים הָאֵלֶּה
  choice: இந்தக் கற்கள் என்ன?
  rationale: எபிரெயத்தின் நேரடியான அடையாளக் கேள்வியைப் பாதுகாக்கிறது; ‘இந்தக் கற்கள் எதைக் குறிக்கின்றன?’ என்ற விளக்கப் பொருளை முதன்மை உரையில் புகுத்தவில்லை.
