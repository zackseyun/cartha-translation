base_translation:
  language: en
  yaml_path: translation/ot/joshua/004/014.yaml
  text: On that day Yahweh made Joshua great in the eyes of all Israel[a], and they feared him just as they had feared Moses all the days of his life.
translation:
  language: ta
  text: அந்நாளில் யாவே இஸ்ரவேலர் அனைவரின் பார்வையில் யோசுவாவை மேன்மைப்படுத்தினார். மோசே வாழ்ந்த நாட்களெல்லாம் அவர்கள் மோசேயை அஞ்சியதுபோலவே, யோசுவாவையும் அஞ்சினார்கள்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்மீது அச்சம் கலந்த வியப்பு கொண்டார்கள்” / “அவரைப் பயபக்தியுடன் மதித்தார்கள்”; இங்குள்ள எபிரெய வினைச்சொல் சூழலுக்கேற்ப அச்சம், வியப்பு, அல்லது மரியாதையைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הַהוּא
  choice: அந்நாளில்
  rationale: எபிரெயக் கதைநடையின் காலக் குறிப்பை இயல்பான, சுருக்கமான தமிழில் தருகிறது.
- source_word: גִּדַּל
  choice: மேன்மைப்படுத்தினார்
  rationale: גדל என்பதன் பியேல் வடிவிலுள்ள காரணவினைப் பொருளைத் தக்கவைத்து, யோசுவா மக்களின் பார்வையில் உயர்ந்தவராகக் கருதப்படும்படி யாவே செய்தார் என்பதைத் தெரிவிக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைத் திருப்பெயரான நான்கெழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: בְּעֵינֵי כָּל יִשְׂרָאֵל
  choice: இஸ்ரவேலர் அனைவரின் கண்களிலும்
  rationale: பொதுமக்களின் பார்வை அல்லது மதிப்பீடு என்ற பொருளுடைய எபிரெய உருவகத்தைத் தமிழிலும் புரியத்தக்க வகையில் தக்கவைக்கிறது.
- source_word: וַיִּירְאוּ אֹתוֹ
  choice: யோசுவாவையும் அஞ்சினார்கள்
  rationale: ירא என்பதிலுள்ள அச்சம், வியப்பு, மரியாதை கலந்த விரிவான பொருளைச் சுருக்காமல் ‘அஞ்சினார்கள்’ எனத் தருகிறது; பெயரை மீண்டும் கூறுவது தமிழில் சுட்டுப்பெயர் குழப்பத்தைத் தவிர்க்கிறது.
- source_word: כַּאֲשֶׁר
  choice: அஞ்சியதுபோலவே
  rationale: மோசேக்கும் யோசுவாவுக்கும் மக்கள் காட்டிய எதிர்வினையின் நெருக்கமான ஒப்புமையை ‘போலவே’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: כָּל יְמֵי חַיָּיו
  choice: அவரது வாழ்நாளெல்லாம்
  rationale: ‘அவனுடைய வாழ்வின் எல்லா நாட்களிலும்’ என்ற எபிரெய மரபுத்தொடரின் முழுக் கால அளவை இயல்பான தமிழில் தெரிவிக்கிறது; சூழலில் ‘அவரது’ என்பது மோசேயைக் குறிக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைத் திருப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: யெகோவா
  rationale: மூல உரை தனிப்பட்ட இறைத் திருப்பெயரை நேரடியாகப் பயன்படுத்துவதால், அதை ‘கர்த்தர்’ போன்ற பட்டத்தால் மாற்றாமல் ஒலிபெயர்ப்பது உரைக்கு நெருக்கமானது.
- issue: யோசுவாவைப் பற்றிய ירא வினையின் நுட்பம்
  choice: அஞ்சினார்கள்
  alternative: அச்சம்கலந்த மரியாதை செலுத்தினார்கள் / பயபக்தியுடன் மதித்தார்கள்
  rationale: மூலச் சொல் அச்சம், வியப்பு, மரியாதை ஆகிய நுட்பங்களை ஏற்கக்கூடியது. ‘அஞ்சினார்கள்’ அதன் வலிமையையும் மோசேயுடனான இலக்கிய இணைப்பையும் காக்கிறது; சூழல் இதை வெறும் பீதியாக மட்டும் புரிந்துகொள்ள வேண்டாம் என்பதைக் காட்டுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான நடை. ‘கண்களிலும்’ என்ற எபிரெய உருவகம் புரியத்தக்கதால் தக்கவைக்கப்பட்டுள்ளது; வாக்கியத் தெளிவுக்காக யோசுவாவின் பெயர் இரண்டாம் வாக்கியத்தில் மீண்டும் கூறப்பட்டுள்ளது.
