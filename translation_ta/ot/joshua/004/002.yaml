translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. மூலத்தின் கட்டளைத் தொனியும் பாலினத் துல்லியமும் காக்கப்பட்டுள்ளன; எபிரெயப் பகிர்வு இரட்டிப்பு இயல்பான தமிழில் வழங்கப்பட்டு அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது.
