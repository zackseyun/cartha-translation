base_translation:
  language: en
  yaml_path: translation/ot/joshua/004/002.yaml
  text: Take for yourselves from the people twelve men[a], one man from each tribe.
translation:
  language: ta
  text: உங்களுக்காக மக்களிலிருந்து பன்னிரண்டு ஆண்களை எடுத்துக்கொள்ளுங்கள்—ஒவ்வொரு கோத்திரத்திலிருந்தும் ஓர் ஆண்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் பகிர்வைக் குறிக்கும் சொற்றொடர் சொல்லுக்குச் சொல், “ஓர் ஆண், ஒரு கோத்திரத்திலிருந்து ஓர் ஆண்” என்று மீண்டும் கூறப்படுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: קְחוּ
  choice: எடுத்துக்கொள்ளுங்கள்
  rationale: לקח என்பதன் கால் கட்டளைப் பன்மை வடிவம் அடிப்படையில் ‘எடுத்துக்கொள்ளுங்கள்’ என்று பொருள்படும். சூழலில் ஆண்களைத் தேர்ந்தெடுத்து நியமிக்கும் செயலையும் இது உள்ளடக்கலாம்; இருப்பினும் மூல வினையின் நேரடியான வலிமையை இச்சொல் காக்கிறது.
- source_word: לָכֶם
  choice: உங்களுக்காக
  rationale: לָכֶם என்பதில் பயன்நோக்கு அல்லது தம்மைச் சார்ந்த நுணுக்கம் உள்ளது; நவீனத் தமிழில் ‘உங்களுக்காக’ அதனை இயல்பாகத் தெரிவிக்கிறது.
- source_word: מִן הָעָם
  choice: மக்களிலிருந்து
  rationale: עם இச்சூழலில் இஸ்ரவேல் மக்களைக் குறிக்கிறது. ‘மக்களிலிருந்து’ என்பது மூலத்தின் சுருக்கத்தையும் அந்தக் கூட்டத்திலிருந்து எடுக்கும் பொருளையும் காக்கிறது.
- source_word: שְׁנֵים עָשָׂר אֲנָשִׁים
  choice: பன்னிரண்டு ஆண்களை
  rationale: אֲנָשִׁים இங்கு வயதுவந்த ஆண்களைக் குறிப்பதால் பாலினத் துல்லியத்துடன் ‘ஆண்கள்’ என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: אִישׁ אֶחָד אִישׁ אֶחָד
  choice: ஒவ்வொரு ... ஓர் ஆண்
  rationale: எபிரெயச் சொற்றொடரின் இரட்டிப்பு பகிர்வுப் பொருளை—ஒவ்வொரு அலகிலிருந்தும் ஒருவர்—குறிக்கிறது. தமிழில் ‘ஒவ்வொரு கோத்திரத்திலிருந்தும் ஓர் ஆண்’ என்பது இயல்பாக அதைப் பதிவு செய்கிறது; நேரடி இரட்டிப்பு அடிக்குறிப்பில் சுட்டப்பட்டுள்ளது.
- source_word: מִשָּׁבֶט
  choice: கோத்திரத்திலிருந்து
  rationale: שבט இங்கு இஸ்ரவேலின் கோத்திரங்களில் ஒன்றைக் குறிக்கிறது; ‘கோத்திரம்’ என்பது வேதாகமச் சூழலில் துல்லியமான, பரவலாகப் புரிந்துகொள்ளப்படும் தமிழ் சொல்.
