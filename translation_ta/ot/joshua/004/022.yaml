  text: וְ/הוֹדַעְתֶּ֖ם אֶת בְּנֵי/כֶ֣ם לֵ/אמֹ֑ר בַּ/יַּבָּשָׁה֙ עָבַ֣ר יִשְׂרָאֵ֔ל אֶת הַ/יַּרְדֵּ֖ן הַ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/004/022.yaml
  text: then you shall let your children know[a], saying, ‘Israel crossed this Jordan on dry ground.’
translation:
  language: ta
  text: அப்போது நீங்கள் உங்கள் பிள்ளைகளுக்கு[a], ‘இஸ்ரவேல் இந்த யோர்தானை வறண்ட நிலத்தில் கடந்தது’ என்று தெரிவிக்க வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘உங்கள் மகன்களுக்கு’. எபிரெயச் சொல் ஆண் பிள்ளைகளைச் சிறப்பாகவோ, பிள்ளைகளைப் பொதுவாகவோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוֹדַעְתֶּם
  choice: அப்போது நீங்கள் ... தெரிவிக்க வேண்டும்
  rationale: ידע என்பதன் ஹிஃபில் வடிவம் ‘அறியச் செய்தல், தெரிவித்தல்’ என்று பொருள்படும். இணைப்புச் சொல், அறிவுறுத்தலின் தொடர்ச்சியை இயல்பாகக் காட்ட ‘அப்போது’ என மொழிபெயர்க்கப்பட்டது.
- source_word: בְּנֵיכֶם
  choice: உங்கள் பிள்ளைகளுக்கு
  rationale: בנים என்பது சூழலைப் பொறுத்து ஆண் பிள்ளைகளை மட்டுமோ, பிள்ளைகளைப் பொதுவாகவோ குறிக்கலாம். நினைவுச் சம்பவத்தை அடுத்த தலைமுறைக்கு அறிவிக்கும் இச்சூழலில் ‘பிள்ளைகள்’ இயல்பான பரந்த பொருளைத் தருகிறது.
- source_word: לֵאמֹר
  choice: என்று
  rationale: பேச்சின் உள்ளடக்கத்தை அறிமுகப்படுத்தும் எபிரெய வழக்கு; தமிழில் மேற்கோளை முடிக்கும் ‘என்று’ இயல்பாக அதே பணியைச் செய்கிறது.
- source_word: בַּיַּבָּשָׁה
  choice: உலர்ந்த தரையில்
  rationale: நீர் விலகியதால் உலர்ந்த நிலம் அல்லது தரை ஏற்பட்டதை இச்சொல் குறிக்கிறது. ‘உலர்ந்த தரையில்’ என்பது தெளிவான நவீனத் தமிழ் நடை.
- source_word: עָבַר
  choice: கடந்தது
  rationale: עבר என்பது கடத்தல் அல்லது மறுகரைக்குச் செல்லுதல் எனப் பொருள்படும்; யோர்தானை நேரடி பொருளாகக் கொண்டதால் ‘கடந்தது’ பொருத்தமானது.
- source_word: יִשְׂרָאֵל
  choice: இஸ்ரவேல்
  rationale: மக்கள் இனத்தின் பெயருக்கான தமிழில் நிலைபெற்ற வேதாகமப் பெயர்ப்பு வடிவம்.
- source_word: הַיַּרְדֵּן הַזֶּה
  choice: இந்த யோர்தானை
  rationale: சுட்டுப்பெயர் நிகழ்விடத்தின் உடனடித் தன்மையை வலியுறுத்துகிறது. எபிரெய மூலத்தில் ஆற்றைக் குறிக்கும் தனிச்சொல் சேர்க்கப்படாததால், ‘இந்த யோர்தான்’ என்ற அமைப்பு காக்கப்படுகிறது; வேற்றுமை உருபுடன் ‘இந்த யோர்தானை’ என வருகிறது.
