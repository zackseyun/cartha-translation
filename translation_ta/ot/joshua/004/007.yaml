source:
  edition: WLC
  text: וַ/אֲמַרְתֶּ֣ם לָ/הֶ֗ם אֲשֶׁ֨ר נִכְרְת֜וּ מֵימֵ֤י הַ/יַּרְדֵּן֙ מִ/פְּנֵי֙ אֲר֣וֹן בְּרִית יְהוָ֔ה בְּ/עָבְר/וֹ֙ בַּ/יַּרְדֵּ֔ן נִכְרְת֖וּ מֵ֣י הַ/יַּרְדֵּ֑ן וְ֠/הָיוּ הָ/אֲבָנִ֨ים הָ/אֵ֧לֶּה לְ/זִכָּר֛וֹן לִ/בְנֵ֥י יִשְׂרָאֵ֖ל עַד עוֹלָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/004/007.yaml
  text: then you shall say to them[a], ‘The waters of the Jordan were cut off before the ark of the covenant of Yahweh. When it crossed over the Jordan, the waters of the Jordan were cut off.’ And these stones shall be a memorial to the sons of Israel forever.
translation:
  language: ta
  text: அப்போது நீங்கள் அவர்களிடம், “யாவேயின் உடன்படிக்கைப் பெட்டியின் முன்னிலையில் யோர்தானின் தண்ணீர் தடைப்பட்டது. அந்தப் பெட்டி யோர்தானைக் கடந்தபோது, யோர்தானின் தண்ணீர் தடைப்பட்டது” என்று சொல்லுங்கள். இந்தக் கற்கள் இஸ்ரவேல் மக்களுக்கு[a] என்றென்றும் ஒரு நினைவுச் சின்னமாக இருக்கும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொற்சொல்லாக, “இஸ்ரவேலின் மகன்களுக்கு”; அதாவது, இஸ்ரவேலர்களுக்கு.
    reason: lexical_alternative
lexical_decisions:
- source_word: נִכְרְתוּ
  choice: தடைப்பட்டது
  rationale: כרת என்பதன் நிபால் வடிவம் இங்கு ஆற்றுநீர் தொடர்ந்து பாயாமல் நிறுத்தப்பட்டதைக் குறிக்கிறது. இயல்பான தமிழில் ‘தடைப்பட்டது’ அந்தப் பொருளைத் தெளிவாகத் தருகிறது; வசனத்திலுள்ள மறுபயன்பாடும் காக்கப்படுகிறது.
- source_word: מֵימֵי / מֵי
  choice: யோர்தானின் தண்ணீர்
  rationale: எபிரெயப் பன்மை வடிவம் ஆற்றின் நீரோட்டத்தைக் குறிக்கும் வழக்குச் சொல்; தமிழில் ‘தண்ணீர்’ என்பது இயல்பான தொகைப்பெயர்.
- source_word: מִפְּנֵי
  choice: முன்பாக
  rationale: பெட்டியின் முன்னிலையில் அல்லது அதற்கு முன்புறத்தில் நிகழ்ந்ததைச் சுட்டும் இடவியல் பொருளைப் பேணுகிறது.
- source_word: אֲרוֹן בְּרִית יְהוָה
  choice: யாவே உடன்படிக்கைப் பெட்டி
  rationale: முழு உடன்படிக்கைத் தலைப்பையும் இயல்பான தமிழ் சொல் வரிசையில் வழங்குகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரான நான்கெழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: בְּעָבְרוֹ
  choice: அது ... கடந்தபோது
  rationale: மூன்றாம் ஆண்பால் ஒருமை பின்னொட்டு இலக்கண ரீதியில் ‘பெட்டி’யைக் குறிக்கிறது; தமிழில் அதற்குரிய இயல்பான சுட்டுப்பெயர் ‘அது’.
- source_word: וְהָיוּ
  choice: இருக்கும்
  rationale: அறிவுறுத்தலின் விளைவாக எதிர்காலத்தில் நிலைக்கும் நினைவுச் சின்னத்தைக் குறிக்கும் பொருளைத் தருகிறது.
- source_word: הָאֲבָנִים הָאֵלֶּה
  choice: இந்தக் கற்கள்
  rationale: சுட்டுப்பெயருடனான எளிய, நேரான தமிழ் இணை.
- source_word: לְזִכָּרוֹן
  choice: ஒரு நினைவுச் சின்னமாக
  rationale: வெறும் மன நினைவூட்டல் அல்லாமல், நீடித்த நினைவுப் பொருளைக் குறிக்கிறது.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்களுக்கு
  rationale: בני ישראל என்பது இஸ்ரவேல் சமூகத்தைக் குறிக்கும் நிலையான இனப்பெயர்ச்சொற்றொடர்; நவீன தமிழில் ‘இஸ்ரவேல் மக்கள்’ இயல்பாகவும் உள்ளடக்கமாகவும் உள்ளது. சொற்சொல்லான மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: עַד עוֹלָם
  choice: என்றென்றும்
  rationale: நீடித்த கால அளவைக் குறிக்கும் எபிரெய மரபுத்தொடருக்கான தெளிவான, கண்ணியமான தமிழ் இணை.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் தனிப்பட்ட உடன்படிக்கைப் பெயர் நேரடியாக வருகிறது; அதனை ஒரு பட்டத்தால் மாற்றாமல் ஒலிபெயர்ப்பது மூல வேறுபாட்டைப் பேணுகிறது.
- issue: לִבְנֵי יִשְׂרָאֵל என்பதன் மொழிபெயர்ப்பு
  choice: இஸ்ரவேல் மக்களுக்கு
  alternative: இஸ்ரவேலின் மகன்களுக்கு
  rationale: இந்த நிலையான எபிரெயச் சொற்றொடர் இங்கு முழு இஸ்ரவேல் சமூகத்தையும் குறிக்கிறது. இயல்பான தமிழில் சமூகப் பொருளைத் தெரிவுசெய்து, சொற்சொல்லான வடிவத்தை அடிக்குறிப்பில் பாதுகாக்கிறது.
- issue: בְּעָבְרוֹ என்பதிலுள்ள சுட்டின் தொடர்பு
  choice: அது—உடன்படிக்கைப் பெட்டி
  alternative: அவர் கடந்தபோது
  rationale: ஆண்பால் ஒருமைப் பின்னொட்டின் அருகிலுள்ள இலக்கண முன்னோடி אֲרוֹן, ‘பெட்டி’; ஆகவே மனிதச் செய்பவரைச் சேர்க்காமல் பெட்டியையே சுட்டுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டது. ஆற்றுநீரைப் பற்றிய தமிழின் இயல்பான ஒருமைத் தொகைப்பெயர் பயன்படுத்தப்பட்டு, எபிரெய வசனத்தின் மீளுரையும் உடன்படிக்கைச் சொல்லாட்சியும் பேணப்பட்டுள்ளன.
