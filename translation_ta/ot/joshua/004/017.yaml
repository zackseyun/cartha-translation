translation_notes:
  register: நவீன நிலையான தமிழில், சுருக்கமானதும் கண்ணியமானதும் இயல்பான கதைநடை கொண்டதுமான மொழிபெயர்ப்பு. ‘கட்டளையிட்டு’ அதிகாரத் தொனியைப் பேணுகிறது; ‘மேலே வாருங்கள்’ ஆற்றுப்படுகையிலிருந்து கரைக்கு ஏறும் இயக்கத்தைத் தெளிவாகக் காட்டுகிறது.
