  text: So Joshua commanded the priests, saying, “Come up out of the Jordan.”
translation:
  language: ta
  text: யோசுவா ஆசாரியர்களிடம், “யோர்தானிலிருந்து வெளியே மேலே வாருங்கள்” என்று கட்டளையிட்டார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְצַו
  choice: கட்டளையிட்டு
  rationale: צוה அதிகாரபூர்வமாகக் கட்டளையிடுவதைக் குறிக்கிறது. தொடர் கதைநடையை இயல்பான தமிழில் காட்ட, வினையெச்ச வடிவம் பயன்படுத்தப்பட்டது; וַ தொடர்ச்சியைச் சூழலுக்கேற்ற ‘அப்போது’ வெளிப்படுத்துகிறது.
- source_word: יְהוֹשֻׁעַ
  choice: யோசுவா
  rationale: எபிரேயப் பெயரின் தமிழில் நிலைபெற்ற வடிவம்.
- source_word: אֶת הַכֹּהֲנִים
  choice: ஆசாரியர்களுக்கு
  rationale: אֵת குறிக்கும் நேரடி செயப்படுபொருள், ‘கட்டளையிடு’ என்ற தமிழ் வினையின் இயல்பான வேற்றுமை அமைப்பில் நான்காம் வேற்றுமையால் வழங்கப்பட்டது.
- source_word: לֵאמֹר
  choice: என்றார்
  rationale: நேரடிக் கூற்றை அறிமுகப்படுத்தும் எபிரேய வடிவத்தை, தமிழ் கதைநடையில் இயல்பான மேற்கோள் முடிப்பு வினையால் வெளிப்படுத்துகிறது.
- source_word: עֲלוּ
  choice: மேலே வாருங்கள்
  rationale: עלה மேல்நோக்கி வருதல் அல்லது செல்லுதலைக் குறிக்கிறது. ஆசாரியர்கள் ஆற்றுப்படுகையிலிருந்து கரைக்கு வருமாறு அழைக்கப்படுவதால், ‘மேலே வாருங்கள்’ திசையையும் அழைப்பின் சூழலையும் காக்கிறது.
- source_word: מִן הַיַּרְדֵּן
  choice: யோர்தானிலிருந்து
  rationale: מן இங்கிருந்து வெளியேறும் இயக்கத்தைக் குறிக்கிறது. முந்தைய சூழலில் ஆசாரியர்கள் ஆற்றுக்குள் நிற்பது தெளிவாக இருப்பதால், இயல்பான தமிழில் ‘யோர்தானிலிருந்து’ போதுமானது.
