revisions:
- from: அப்போது யோசுவா ஆசாரியர்களுக்குக் கட்டளையிட்டு, “யோர்தானிலிருந்து மேலே வாருங்கள்” என்றார்.
  to: யோசுவா ஆசாரியர்களிடம், “யோர்தானிலிருந்து வெளியே மேலே வாருங்கள்” என்று கட்டளையிட்டார்.
  rationale: The revision removes the unwarranted temporal adverb, uses a more natural Tamil command-and-quotation construction, and explicitly retains the contextual sense of emerging from the Jordan. No footnote is needed because the wording is straightforward and undisputed in context.
