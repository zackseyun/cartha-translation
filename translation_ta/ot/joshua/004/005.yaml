source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר לָ/הֶם֙ יְהוֹשֻׁ֔עַ עִ֠בְרוּ לִ/פְנֵ֨י אֲר֧וֹן יְהוָ֛ה אֱלֹֽהֵי/כֶ֖ם אֶל תּ֣וֹךְ הַ/יַּרְדֵּ֑ן וְ/הָרִ֨ימוּ לָ/כֶ֜ם אִ֣ישׁ אֶ֤בֶן אַחַת֙ עַל שִׁכְמ֔/וֹ לְ/מִסְפַּ֖ר שִׁבְטֵ֥י בְנֵי יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/004/005.yaml
  text: And Joshua said to them[a], “Cross over before the ark of Yahweh your God into the middle of the Jordan, and let each man lift up one stone on his shoulder, according to the number of the tribes of the sons of Israel.”
translation:
  language: ta
  text: யோசுவா அவர்களிடம், “உங்கள் கடவுளாகிய யாவேயின் பேழைக்கு முன்பாக யோர்தானின் நடுப்பகுதிக்குள் கடந்து செல்லுங்கள். நீங்கள் ஒவ்வொருவரும் இஸ்ரவேலின் மகன்களுடைய[a] கோத்திரங்களின் எண்ணிக்கைக்கு ஏற்ப ஒரு கல்லைத் தங்கள் தோள்மேல் தூக்கிக்கொள்ளுங்கள்” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “இஸ்ரவேலின் மகன்கள்.” இது முறையான உடன்படிக்கைச் சொல்லாட்சி; இயல்பான தமிழில் “இஸ்ரவேலர்” என்றும் கூறலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: என்றார்
  rationale: எபிரெயக் கதைநடையின் தொடர்ச்சியைத் தமிழில் இயல்பான வாக்கிய முடிவாகக் காட்டுகிறது; தனியாக ‘அப்பொழுது’ என்று சேர்த்து காலத் தொடர்பை மிகையாக விளக்கவில்லை.
- source_word: עִבְרוּ לִפְנֵי
  choice: முன்பாக ... கடந்து செல்லுங்கள்
  rationale: பன்மை கட்டளையையும் உடன்படிக்கைப் பெட்டியுடன் தொடர்புடைய இடநிலையையும் நேரடியாகப் பாதுகாக்கிறது.
- source_word: אֲרוֹן יְהוָה אֱלֹהֵיכֶם
  choice: உங்கள் கடவுளாகிய யாவேயின் உடன்படிக்கைப் பெட்டி
  rationale: אֲרוֹן என்பதன் உடன்படிக்கைச் சூழலைத் தெளிவுபடுத்தி, יהוה என்பதைத் திருப்பெயரான ‘யாவே’ என வழங்குகிறது.
- source_word: אֶל תּוֹךְ הַיַּרְדֵּן
  choice: யோர்தானின் நடுப்பகுதிக்குள்
  rationale: תּוֹךְ குறிக்கும் உள்/நடுப் பகுதியை வெறும் ‘யோர்தானுக்குள்’ என்று தட்டையாக்காமல் காக்கிறது.
- source_word: וְהָרִימוּ לָכֶם אִישׁ אֶבֶן אַחַת
  choice: ஆளுக்கு ஒரு கல்லை ... தூக்கிக்கொள்ளட்டும்
  rationale: אִישׁ என்பதன் பகிர்ந்தளிக்கும் பொருளையும் לָכֶם என்பதன் தங்களுக்காக எடுத்துக்கொள்ளும் நுணுக்கத்தையும் இயல்பான தமிழில் தருகிறது.
- source_word: עַל שִׁכְמוֹ
  choice: தன் தோள்மேல்
  rationale: எபிரெய ஒற்றை உருபையும் ஒவ்வொருவரையும் குறிக்கும் பகிர்ந்தளிப்பு அமைப்பையும் காக்கிறது.
- source_word: לְמִסְפַּר שִׁבְטֵי בְנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் மகன்களுடைய கோத்திரங்களின் எண்ணிக்கைக்கு ஏற்ப
  rationale: கற்களின் எண்ணிக்கை கோத்திரங்களின் எண்ணிக்கையுடன் ஒத்திருக்க வேண்டும் என்பதையும் בְּנֵי יִשְׂרָאֵל என்ற முறையான உடன்படிக்கைச் சொல்லாட்சியையும் காக்கிறது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் வரும் தனிப்பட்ட உடன்படிக்கைப் பெயரைப் பொதுப் பட்டமாக மாற்றாமல் ஒலிபெயர்க்கிறது.
- issue: בְּנֵי יִשְׂרָאֵל என்ற சொல்லாட்சியின் வெளிப்பாடு
  choice: இஸ்ரவேலின் மகன்கள்
  alternative: இஸ்ரவேலர்
  rationale: மூலத்தின் முறையான வம்ச/உடன்படிக்கைச் சொல்லாட்சியைப் பாதுகாக்கிறது; இயல்பான சுருக்கமான மாற்றை அடிக்குறிப்பு உணர்த்துகிறது.
- issue: אִישׁ என்பதன் பாலினமும் பகிர்ந்தளிப்பு வலிமையும்
  choice: ஆளுக்கு
  alternative: ஒவ்வொரு மனிதனும்
  rationale: உடனடிச் சூழலில் கோத்திரப் பிரதிநிதிகள் ஆண்கள் என்றாலும், இங்கு சொல்லின் பகிர்ந்தளிப்பு செயல்பாட்டை இயல்பான தமிழில் முன்னிறுத்துகிறது; பாலினத் தகவலைத் தேவையின்றி மறுப்பதோ மிகைப்படுத்துவதோ இல்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் வடிவமைக்கப்பட்டுள்ளது. ‘உடன்படிக்கைப் பெட்டி’ என்பது பொதுவாசகருக்குச் சூழலைத் தெளிவாக்குகிறது. கட்டளையின் பன்மை, ஒவ்வொரு பிரதிநிதிக்கும் ஒரு கல் என்ற பகிர்ந்தளிப்பு, யோர்தானின் நடுப்பகுதி, கோத்திர எண்ணிக்கையுடனான ஒத்திசைவு ஆகியவை பாதுகாக்கப்பட்டுள்ளன.
