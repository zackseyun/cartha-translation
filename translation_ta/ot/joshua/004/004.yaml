translation:
  language: ta
  text: அப்போது யோசுவா, இஸ்ரவேலின் மகன்களிலிருந்து[b] நியமித்திருந்த[a] பன்னிரண்டு ஆண்களையும்—ஒவ்வொரு கோத்திரத்திலிருந்தும் ஒருவரை—அழைத்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஆயத்தப்படுத்தியிருந்த”; அல்லது, “தேர்ந்தெடுத்திருந்த.”
    reason: lexical_alternative
  - marker: b
    text: “இஸ்ரவேலின் மகன்கள்” என்பது இங்கு இஸ்ரவேல் மக்களைக் குறிக்கும் எபிரெய வழக்கு.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: அழைத்தார்
  rationale: קרא உடன் אֶל வந்துள்ளதால், தேர்ந்தெடுக்கப்பட்ட ஆண்களைத் தம்மிடம் அழைத்த செயலை இயல்பான நவீனத் தமிழில் இது தெரிவிக்கிறது; ‘வரவழைத்தார்’ என்பதும் சாத்தியம், ஆனால் அது சற்று வலுவான கட்டளைத் தொனியைத் தரலாம்.
- source_word: שְׁנֵים הֶעָשָׂר אִישׁ
  choice: பன்னிரண்டு ஆண்களையும்
  rationale: முந்தைய சூழலில் ஏற்கெனவே அடையாளப்படுத்தப்பட்ட குறிப்பிட்ட பன்னிரண்டு ஆண்களைக் குறிக்கிறது; אִישׁ ஆண்களைக் குறிப்பதால் பாலினத் தகவலும் தக்கவைக்கப்படுகிறது.
- source_word: אֲשֶׁר הֵכִין
  choice: தான் நியமித்து வைத்திருந்த
  rationale: הכין என்பதற்கு ‘ஆயத்தப்படுத்து,’ ‘நியமி,’ ‘தேர்ந்தெடுத்து வை’ என்ற பொருள் வரலாம். இச்சூழலில் ஒவ்வொரு கோத்திரத்தின் பிரதிநிதியாக முன்னரே நியமித்ததை இது தெளிவாகக் காட்டுகிறது; ‘தான்’ என்பது எபிரெய உரையில் உள்ள ஆண்பால் ஒருமை வினையின் எழுவாய் யோசுவா என்பதைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: מִבְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் மகன்களிலிருந்து
  rationale: ‘இஸ்ரவேலின் மகன்கள்’ என்ற எபிரெய மூல வடிவத்தைத் தக்கவைக்கிறது. இது இங்கு இஸ்ரவேல் மக்களைக் குறிக்கும் வழக்கமான இனக்குழுப் பெயர்.
- source_word: אִישׁ אֶחָד אִישׁ אֶחָד מִשָּׁבֶט
  choice: ஒவ்வொரு கோத்திரத்திலிருந்தும் ஒருவரை
  rationale: ‘ஒரு ஆண், ஒரு ஆண்’ என்ற எபிரெயப் பகிர்வு மறுமொழியை இயல்பான தமிழில் வழங்கி, ஒவ்வொரு கோத்திரத்திற்கும் ஒரு பிரதிநிதி என்ற பொருளைப் பாதுகாக்கிறது.
