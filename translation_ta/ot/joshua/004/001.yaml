base_translation:
  language: en
  yaml_path: translation/ot/joshua/004/001.yaml
  text: And it happened[a], when all the nation had finished crossing the Jordan, that Yahweh said to Joshua,
translation:
  language: ta
  text: மக்கள் அனைவரும் யோர்தானைக் கடந்து முடித்தபோது, யாவே யோசுவாவிடம் கூறினார்:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “முழு தேசமும்”; எபிரெயத்தில் இஸ்ரவேலைக் குறிக்கும் ஒருமை கூட்டுப்பெயர் உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: — (தமிழில் தனியாக மொழிபெயர்க்கப்படவில்லை)
  rationale: இது எபிரெயக் கதைநடையின் புதிய நிகழ்வுத் தொடரை அறிமுகப்படுத்தும் வழக்கமான வடிவம். தமிழில் ‘அப்போது நிகழ்ந்ததாவது’ என்று வெளிப்படையாகச் சேர்ப்பது இயல்பற்றதாக இருப்பதால், காலத் துணைவாக்கியத்திலிருந்து முதன்மை வாக்கியத்துக்குச் செல்லும் இயல்பான அமைப்பால் அதன் உரையாடல் செயல்பாடு வெளிப்படுத்தப்படுகிறது.
- source_word: כַּאֲשֶׁר תַּמּוּ
  choice: கடந்து முடித்தபோது
  rationale: כַּאֲשֶׁר காலத் தொடர்பைக் குறிக்கிறது; תמם செயல் முழுமையடைந்ததைச் சுட்டுகிறது. ‘முடித்தபோது’ இரண்டையும் இயல்பான தமிழில் இணைக்கிறது.
- source_word: כָל הַגּוֹי
  choice: இஸ்ரவேல் மக்கள் அனைவரும்
  rationale: גּוֹי இங்கு இஸ்ரவேலை ஒருமைக் கூட்டுப்பெயராகக் குறிக்கிறது. தமிழில் ‘தேசம் முழுவதும்’ என்பது நிலப்பரப்பைக் குறிக்கக்கூடும்; ‘இஸ்ரவேல் மக்கள் அனைவரும்’ குறிப்பிடப்படும் குழுவையும் முழுமையையும் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: לַעֲבוֹר אֶת הַיַּרְדֵּן
  choice: யோர்தானைக் கடந்து
  rationale: עבר இங்கு ஆற்றைக் கடக்கும் செயலைக் குறிக்கிறது. எபிரெயத்தில் ‘ஆறு’ என்ற சொல் இல்லாததால், புவியியல் பெயர் மட்டும் வைக்கப்படுகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: திருநான்கெழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், நவீனத் தமிழுக்கு ஏற்ற ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: וַיֹּאמֶר ... אֶל ... לֵאמֹר
  choice: 'யோசுவாவிடம் கூறியது:'
  rationale: எபிரெயப் பேச்சு அறிமுகச் சூத்திரத்தை இயல்பான தமிழில் வழங்குகிறது. அடுத்த வசனத்தில் வரும் உரையை எதிர்பார்க்க இரட்டைப்புள்ளி பயன்படுத்தப்படுகிறது.
- source_word: יְהוֹשֻׁעַ
  choice: யோசுவா
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் பரவலாக அறியப்பட்ட தனிப்பெயர் வடிவம்.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலத்தில் தனிப்பட்ட இறைப் பெயர் நேரடியாக உள்ளது. அதை ஒரு பட்டமாக மாற்றாமல் ஒலிபெயர்ப்பது மூலத்தின் வேறுபாட்டைப் பாதுகாக்கிறது; ‘யாவே’ என்பது ஏற்ற நவீனத் தமிழ் ஒலிவடிவம்.
- issue: כָל הַגּוֹי குறிக்கும் கூட்டுப்பொருள்
  choice: இஸ்ரவேல் மக்கள் அனைவரும்
  alternative: தேசம் முழுவதும்; மக்கள் அனைவரும்
  rationale: இங்கு ‘தேசம்’ என்பது நிலப்பரப்பு அல்ல, இஸ்ரவேல் மக்களைக் கூட்டாகக் குறிக்கிறது. ‘இஸ்ரவேல்’ என்பது சூழலிலிருந்து வெளிப்படும் குறிப்பைத் தெளிவுபடுத்துகிறது; எந்த இறையியல் தனிப்பொருளையும் சேர்ப்பதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழ்; கண்ணியமான, எளிதில் புரியும் கதைநடை. தனித்த எபிரெயக் கதைத் தொடக்கச் சொல்லை இயல்பற்ற தமிழில் நகலெடுக்காமல், அதன் செயல்பாட்டை வாக்கிய அமைப்பில் பாதுகாக்கிறது. அடுத்த வசனத்தில் நேரடி உரை தொடர்வதை இரட்டைப்புள்ளி காட்டுகிறது.
