  text: וּ/שְׁתֵּ֧ים עֶשְׂרֵ֣ה אֲבָנִ֗ים הֵקִ֣ים יְהוֹשֻׁעַ֮ בְּ/ת֣וֹךְ הַ/יַּרְדֵּן֒ תַּ֗חַת מַצַּב֙ רַגְלֵ֣י הַ/כֹּהֲנִ֔ים נֹשְׂאֵ֖י אֲר֣וֹן הַ/בְּרִ֑ית וַ/יִּ֣הְיוּ שָׁ֔ם עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/004/009.yaml
  text: And Joshua set up twelve stones in the midst of the Jordan[a], under the place where the feet of the priests carrying the ark of the covenant stood, and they are there to this day.
translation:
  language: ta
  text: யோசுவா பன்னிரண்டு கற்களை யோர்தானின் நடுவில், உடன்படிக்கைப் பெட்டியைச் சுமந்த ஆசாரியர்களின் கால்கள் நின்ற இடத்தின் கீழாக[a] நாட்டினார். அவை இன்றுவரை அங்கே இருக்கின்றன.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரேய சொற்றொடரை மிக நேரடியாக, ‘ஆசாரியர்களின் கால்களின் நிற்குமிடத்தின் கீழாக’ என்றும் மொழிபெயர்க்கலாம். உடன்படிக்கைப் பெட்டியைச் சுமந்தபோது அவர்கள் நின்ற குறிப்பிட்ட இடத்தையே இது குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵקִים
  choice: நாட்டினார்
  rationale: ஹிப்இல் வினை இங்கு நினைவுக் கற்களை நிலைநிறுத்தி அமைப்பதைக் குறிக்கிறது. கற்களைப் பற்றிய சூழலில் ‘நாட்டினார்’ என்பது இயல்பான, தெளிவான நவீனத் தமிழ்.
- source_word: בְּתוֹךְ הַיַּרְדֵּן
  choice: யோர்தானின் நடுவில்
  rationale: תּוֹךְ என்பதன் இடவியல் பொருளான ‘நடு/உட்பகுதி’ என்பதை நேரடியாகப் பாதுகாக்கிறது; கற்கள் யோர்தானுக்குள்ளேயே அமைக்கப்பட்டன என்ற எபிரெய உரையின் கூற்றைத் தெளிவாக வைத்திருக்கிறது.
- source_word: תַּחַת מַצַּב רַגְלֵי
  choice: கால்கள் நின்ற இடத்துக்குக் கீழே
  rationale: תַּחַת என்பதன் ‘கீழே’ என்ற இடவியல் வலிமையையும், מַצַּב என்பதன் ‘நின்ற இடம்/நிலையிடம்’ என்ற பொருளையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: נֹשְׂאֵי אֲרוֹן הַבְּרִית
  choice: உடன்படிக்கைப் பெட்டியைச் சுமந்த
  rationale: பங்கேற்பு வடிவம் ஆசாரியர்கள் பெட்டியைச் சுமந்தவர்களாக இருந்ததை விவரிக்கிறது. ‘சுமந்த’ என்பது தெளிவான நவீனத் தமிழ்.
- source_word: וַיִּהְיוּ שָׁם
  choice: அவை ... அங்கே இருக்கின்றன
  rationale: עַד הַיּוֹם הַזֶּה என்பதோடு சேர்ந்து, கதைசொல்லியின் காலம்வரை தொடரும் நிலையை இது குறிக்கிறது; தமிழின் நிகழ்கால வடிவம் அந்தத் தொடர்ச்சியை இயல்பாகக் காட்டுகிறது.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: இன்றுவரை
  rationale: கதைசொல்லியின் நிகழ்காலம்வரை நிலைத்திருப்பதைக் குறிக்கும் எபிரெய மரபுத்தொடருக்கு இது இயல்பான தமிழ் இணை.
theological_decisions:
- issue: சுற்றியுள்ள வசனங்களில் கில்காலில் நாட்டப்பட்ட பன்னிரண்டு கற்களுக்கும் இவ்வசனத்தில் யோர்தானில் நாட்டப்பட்ட பன்னிரண்டு கற்களுக்கும் இடையிலான கதைத் தளர்வு
  choice: யோசுவா யோர்தானின் நடுவிலேயே பன்னிரண்டு கற்களை நாட்டினார் என்று வசனத்தை நேரடியாக மொழிபெயர்த்தல்
  alternative: யோர்தானிலிருந்து எடுத்துச் செல்லப்பட்டு வேறிடத்தில் நாட்டப்பட்ட கற்களின் சுருக்கமாக இதைப் புரிந்துகொள்ளுதல் அல்லது இரண்டு நினைவுச் சின்னங்களையும் ஒன்றாக்குதல்
  rationale: எபிரெய உரை கற்கள் ‘யோர்தானின் நடுவில்’ நாட்டப்பட்டன என்று தெளிவாகச் சொல்கிறது. மொழிபெயர்ப்பு அந்தக் கூற்றை ஒத்திசைத்து மாற்றாமல் அதன் கதைத் தளர்வுடன் பாதுகாக்க வேண்டும்.
- issue: עַד הַיּוֹם הַזֶּה என்ற நினைவுச் சின்னத் தொடரின் கால வலிமை
  choice: கதைசொல்லியின் பார்வையில் தொடரும் நிலையாக ‘அவை இன்றுவரை அங்கே இருக்கின்றன’ என்று மொழிபெயர்த்தல்
  alternative: ‘அவை இன்றுவரை அங்கே இருந்தன’
  rationale: இது இன்றைய வாசகரின் காலத்தைக் குறித்த கூற்றாக மாற்றாமல், கதைசொல்லியின் காலம்வரை தொடர்ந்த நிலையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையில் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘உடன்படிக்கைப் பெட்டி’, ‘ஆசாரியர்கள்’, ‘யோர்தான்’ ஆகியவை பரவலாக அறியப்பட்ட வேதாகமச் சொற்களாகத் தக்கவைக்கப்பட்டுள்ளன; எபிரெய உரையின் இடவியல் குறிப்பும் கதைத் தளர்வும் ஒத்திசைக்கப்படாமல் பாதுகாக்கப்பட்டுள்ளன.
