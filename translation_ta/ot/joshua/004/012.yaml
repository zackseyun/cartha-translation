translation_notes:
  register: நவீனத் தரத் தமிழில் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய உறவுமுறைச் சொற்றொடர்கள் ‘மக்கள்’ என இயல்பாக்கப்பட்டாலும், அவற்றின் சொல்லர்த்த வடிவங்கள் அடிக்குறிப்புகளில் தரப்பட்டுள்ளன. வாக்கியத்தின் தொடக்கத்தில் மோசேயின் முந்தைய அறிவுறுத்தல் வைக்கப்பட்டிருப்பது தமிழின் இயல்பான ஓட்டத்திற்காக; மூலத்தின் பொருள் உறவு மாற்றப்படவில்லை.
