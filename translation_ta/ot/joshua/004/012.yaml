base_translation:
  language: en
  yaml_path: translation/ot/joshua/004/012.yaml
  text: And the sons of Reuben[a], the sons of Gad, and the half-tribe of Manasseh crossed over armed before the sons of Israel[c][b], just as Moses had spoken to them.
translation:
  language: ta
  text: ரூபேனியரும்[a] காதியரும் மனாசேயின் அரைக் கோத்திரத்தாரும் ஆயுதம் ஏந்தியவர்களாக[c] இஸ்ரவேல் மக்களுக்கு முன்பாக[b] கடந்தார்கள்; மோசே அவர்களிடம் கூறியபடியே நடந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ரூபேனின் மக்களும், காதின் மக்களும், மனாசேயின் அரைக் கோத்திரத்தாரும்.” எபிரெயத்தில் சொல்லர்த்தமாக, “ரூபேனின் மகன்கள் … காதின் மகன்கள் …” என்று உள்ளது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “இஸ்ரவேலருக்கு முன்பாக.” எபிரெயத்தில் சொல்லர்த்தமாக, “இஸ்ரவேலின் மகன்களுக்கு முன்பாக” என்று உள்ளது.
    reason: lexical_alternative
  - marker: c
    text: “ஆயுதம் ஏந்தியவர்களாக” என்பதற்கான எபிரெயச் சொல், போருக்குத் தயாராக அல்லது போரணியில் அணிவகுத்த நிலையையும் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַבְרוּ
  choice: ஆற்றைக் கடந்தார்கள்
  rationale: இக்கதைச் சூழலில் עבר என்பது யோர்தானைக் கடப்பதைக் குறிக்கிறது. எபிரெயத்தில் பொருள் வெளிப்படையாகக் குறிப்பிடப்படாவிட்டாலும், இயல்பான தமிழுக்காகச் சூழலிலிருந்து ‘ஆற்றை’ சேர்க்கப்பட்டுள்ளது.
- source_word: בְּנֵי רְאוּבֵן / וּבְנֵי גָד
  choice: ரூபேனின் மக்களும் / காதின் மக்களும்
  rationale: ‘மகன்கள்’ என்ற சொற்சொல் வடிவம் தமிழில் இங்கு ஆண் சந்ததியினரை மட்டும் குறிப்பதுபோல் ஒலிக்கலாம்; ‘மக்கள்’ என்பது குலத்தைச் சேர்ந்தவர்களைக் குறிக்கும் எபிரெய உறவுமுறைச் சொல்லைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: וַחֲצִי שֵׁבֶט הַמְנַשֶּׁה
  choice: மனாசேயின் அரைக் கோத்திரத்தாரும்
  rationale: கோத்திரத்தின் ஒரு பாதியைச் சேர்ந்த மக்களைக் குறிக்கும் கட்டமைப்பைச் சுருக்கமாகவும் தெளிவாகவும் தருகிறது.
- source_word: חֲמֻשִׁים
  choice: ஆயுதம் ஏந்தியவர்களாக
  rationale: இச்சொல் போருக்கு ஆயத்தமாக அல்லது போரணியில் ஒழுங்குபடுத்தப்பட்ட நிலையில் இருப்பதைக் குறிக்கலாம். சூழலுக்கு ஏற்ற முதன்மைப் பொருளாக ஆயுதமேந்திய நிலை தெரிவுசெய்யப்பட்டுள்ளது; மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
- source_word: לִפְנֵי
  choice: முன்பாக
  rationale: மற்ற இஸ்ரவேலருக்கு முன்னால் சென்று கடப்பதைக் குறிக்கும் இடநிலைப் பொருளைப் பாதுகாக்கிறது.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் மக்களுக்கு
  rationale: எபிரெயத்தின் உறவுமுறை வடிவத்தைத் தமிழில் இயல்பாகப் பிரதிபலிக்கிறது; ‘இஸ்ரவேலர்’ என்பதும் பொருத்தமான மாற்றாக அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: כַּאֲשֶׁר דִּבֶּר אֲלֵיהֶם מֹשֶׁה
  choice: மோசே அவர்களுக்குச் சொன்னபடியே
  rationale: அவர்கள் முன்பு பெற்ற மோசேயின் அறிவுறுத்தலுக்கு இணங்க நடந்தார்கள் என்ற ஒப்புமை மற்றும் முன்நிகழ்வை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
