- from: மோசே அவர்களுக்குச் சொன்னபடியே, ரூபேனின் மக்களும்[a] காதின் மக்களும் மனாசேயின் அரைக் கோத்திரத்தாரும் ஆயுதம் ஏந்தியவர்களாக[c] இஸ்ரவேலின் மக்களுக்கு முன்பாக[b] ஆற்றைக் கடந்தார்கள்.
  to: ரூபேனியரும்[a] காதியரும் மனாசேயின் அரைக் கோத்திரத்தாரும் ஆயுதம் ஏந்தியவர்களாக[c] இஸ்ரவேல் மக்களுக்கு முன்பாக[b] கடந்தார்கள்; மோசே அவர்களிடம் கூறியபடியே நடந்தார்கள்.
