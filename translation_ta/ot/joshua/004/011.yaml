source:
  edition: WLC
  text: וַ/יְהִ֛י כַּֽ/אֲשֶׁר תַּ֥ם כָּל הָ/עָ֖ם לַֽ/עֲב֑וֹר וַ/יַּעֲבֹ֧ר אֲרוֹן יְהוָ֛ה וְ/הַ/כֹּהֲנִ֖ים לִ/פְנֵ֥י הָ/עָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/004/011.yaml
  text: And when all the people had finished crossing over[a], the ark of Yahweh and the priests crossed over before the people.
translation:
  language: ta
  text: மக்கள் அனைவரும் கடந்து முடித்தபோது, யாவேவின் பேழையும் ஆசாரியர்களும் மக்களுக்கு முன்பாக[a] கடந்து சென்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மக்களின் முன்னிலையில்.” எபிரேயச் சொற்றொடர் மக்களுக்கு முன்னால் இருந்த இடத்தையோ, அவர்கள் முன்னிலையில் நிகழ்ந்ததையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר
  choice: …போது
  rationale: எபிரேயக் கதைநடையின் தொடர் மாற்றத்தைத் தமிழில் இயல்பாக வெளிப்படுத்த, வַיְהִי என்பதைக் கூடுதல் சொற்களால் மொழிபெயர்க்காமல் காலத்தைக் குறிக்கும் துணைவாக்கியத்துடன் இணைக்கிறது.
- source_word: תַּם כָּל הָעָם לַעֲבוֹר
  choice: மக்கள் அனைவரும் கடந்து முடித்த
  rationale: תמם குறிக்கும் நிறைவையும், כָּל வலியுறுத்தும் முழுமையையும், עבר குறிக்கும் கடத்தலையும் இயல்பான தமிழில் காக்கிறது.
- source_word: אֲרוֹן יְהוָה
  choice: யாவேவின் பேழை
  rationale: אֲרוֹן என்பது புனிதப் பெட்டி அல்லது பேழையைக் குறிக்கிறது; யְהוָה என்ற தனிப்பெயர் ‘யாவே’ என்று ஒலிபெயர்க்கப்படுகிறது.
- source_word: וְהַכֹּהֲנִים
  choice: ஆசாரியர்களும்
  rationale: וְ என்ற இணைப்பை வெளிப்படையாகக் காத்து, பேழையையும் ஆசாரியர்களையும் ஒருங்கிணைந்த எழுவாய்களாக மூலவாக்கியத்தைப் போலவே வழங்குகிறது.
- source_word: וַיַּעֲבֹר
  choice: கடந்து சென்றார்கள்
  rationale: முன்னர் வந்த עבר வேருடனான சொற்பொருள் தொடர்பைக் காக்கிறது; கூட்டு எழுவாய்க்கு ஏற்ற இயல்பான தமிழ் வினைமுற்று பயன்படுத்தப்பட்டுள்ளது.
- source_word: לִפְנֵי הָעָם
  choice: மக்களுக்கு முன்பாக
  rationale: לִפְנֵי என்பதன் ‘முன்/முன்னிலையில்’ என்ற இடவியல் அல்லது முன்னிலை சார்ந்த பொருளைத் தமிழிலும் ஓரளவு திறந்தவாறு வைத்திருக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூலத்தில் பொதுப்பட்டப் பெயர் அல்லாமல் நான்கெழுத்து உடன்படிக்கைப் பெயர் நேரடியாக இடம்பெறுவதால், அதைத் தனிப்பெயராக ஒலிபெயர்ப்பது மூல வேறுபாட்டைக் காக்கிறது.
- issue: לִפְנֵי הָעָם என்பதன் பொருள்
  choice: மக்களுக்கு முன்பாக
  alternative: மக்களின் முன்னிலையில்
  rationale: சொற்றொடர் இடவியல் ரீதியாக ‘மக்களுக்கு முன்னால்’ என்றும், உறவியல் ரீதியாக ‘மக்களின் முன்னிலையில்’ என்றும் பொருள்பட முடியும்; முதன்மை உரை இந்தத் திறந்தநிலையை முடிந்தவரை காக்கிறது, மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் மரியாதைமிக்க கதைநடைத் தொனியிலும் அமைக்கப்பட்டுள்ளது. மூலத்தில் வெளிப்படையாக இல்லாத ‘யோர்தான்’ அல்லது ‘உடன்படிக்கை’ போன்ற சொற்கள் சேர்க்கப்படவில்லை.
