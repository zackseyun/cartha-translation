base_translation:
  language: en
  yaml_path: translation/ot/joshua/004/003.yaml
  text: and command them[a], saying, ‘Take up for yourselves from here, from the midst of the Jordan, from the place where the priests’ feet stood firm, twelve stones[b], and carry them over with you and set them down at the lodging place where you will spend the night.’
translation:
  language: ta
  text: 'அவர்களிடம் கட்டளையிட்டுச் சொல்லுங்கள்: ‘இங்கிருந்து—யோர்தானின் நடுவில் ஆசாரியர்களின் கால்கள் உறுதியாக நிலைநின்ற இடத்திலிருந்து[a]—உங்களுக்காகப் பன்னிரண்டு கற்களை எடுத்துக்கொள்ளுங்கள். அவற்றை உங்களோடு அக்கரைக்குக் கொண்டுபோய், இன்று இரவு நீங்கள் தங்கும் இடத்தில்[b] வையுங்கள்.’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இதை இன்னும் சொல்லுக்குச் சொல்லாக, “ஆசாரியர்களின் கால்கள் உறுதியாகப் பதிந்திருந்த நிலையிடத்திலிருந்து” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “தங்கும் இடம்” என்பது யோர்தானைக் கடந்தபின் இஸ்ரவேலர் அந்த இரவு தங்கவிருந்த இடத்தைக் குறிக்கிறது; அது நிரந்தரக் குடியிருப்பு என்று அவசியமில்லை.
    reason: cultural_note
lexical_decisions:
- source_word: וְצַוּוּ
  choice: கட்டளையிட்டுச் சொல்லுங்கள்
  rationale: צוה என்பதன் பியேல் கட்டளை வடிவிலுள்ள நேரடியான வலிமையைத் தக்கவைக்கிறது; மென்மையான ‘அறிவுறுத்துங்கள்’ என்பதைக் காட்டிலும் பொருத்தமானது.
- source_word: שְׂאוּ לָכֶם
  choice: உங்களுக்காக ... எடுத்துக்கொள்ளுங்கள்
  rationale: கற்களை ஆற்றுப்படுகையிலிருந்து தூக்கி எடுத்துக்கொள்ளும் செயலும், לָכֶם குறிக்கும் அவர்களுடைய நேரடி பங்கேற்பும் வெளிப்படுகின்றன; தனியுரிமை என்ற பொருள் திணிக்கப்படவில்லை.
- source_word: מִזֶּה מִתּוֹךְ הַיַּרְדֵּן
  choice: இங்கிருந்து—யோர்தானின் நடுவில் ... இடத்திலிருந்து
  rationale: ‘இங்கிருந்து’ மற்றும் ‘யோர்தானின் நடுவிலிருந்து’ என்ற எபிரெய இரட்டை இடக்குறிப்பின் உயிரோட்டத்தையும் துல்லியத்தையும் இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: מִמַּצַּב רַגְלֵי הַכֹּהֲנִים הָכִין
  choice: ஆசாரியர்களின் கால்கள் உறுதியாக நிலைநின்ற இடத்திலிருந்து
  rationale: מַצָּב குறிக்கும் நிற்கும் இடத்தையும் הָכִין உணர்த்தும் உறுதியான நிலைப்பாட்டையும் தெளிவான, இயல்பான தமிழில் இணைக்கிறது.
- source_word: שְׁתֵּים עֶשְׂרֵה אֲבָנִים
  choice: பன்னிரண்டு கற்கள்
  rationale: எண்ணும் பெயர்ச்சொல்லும் நேரடியாகவும் விரிவாக்கமின்றியும் மொழிபெயர்க்கப்பட்டுள்ளன.
- source_word: וְהַעֲבַרְתֶּם אוֹתָם עִמָּכֶם
  choice: அவற்றை உங்களோடு அக்கரைக்குக் கொண்டுபோய்
  rationale: עבר என்பதன் கடந்து செல்லச் செய்யும் பொருளையும் עִמָּכֶם என்பதன் உடன்செல்லும் பொருளையும் சூழலுக்கு இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וְהִנַּחְתֶּם אוֹתָם
  choice: வையுங்கள்
  rationale: கற்களை குறிப்பிட்ட இடத்தில் இறக்கி வைக்கும் נוח என்பதன் காரணவினைப் பொருளை எளிய, தெளிவான தமிழில் தருகிறது.
- source_word: בַּמָּלוֹן אֲשֶׁר תָּלִינוּ בוֹ הַלָּיְלָה
  choice: இன்று இரவு நீங்கள் தங்கும் இடத்தில்
  rationale: מָלוֹן என்பது நிரந்தரக் குடியிருப்பை அல்ல, இரவுத் தங்குமிடத்தைக் குறிக்கிறது; பின்னுள்ள சார்பு வாக்கியத்துடன் இயல்பாக மொழிபெயர்க்கப்பட்டுள்ளது.
