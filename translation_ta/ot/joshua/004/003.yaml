translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் உரைக்கேற்ற கண்ணியத்துடனும் அமைக்கப்பட்டது. கட்டளையின் நேரடி வலிமை காக்கப்பட்டுள்ளது. எபிரெயத்தின் மீளுரைப்பை அசட்டுத் தனமாக்காமல் காட்ட இடைக்கோடுகள் பயன்படுத்தப்பட்டுள்ளன; ‘ஆசாரியர்கள்’, ‘யோர்தான்’ ஆகிய பொதுவாக அறியப்பட்ட வேதாகமச் சொற்கள் தக்கவைக்கப்பட்டுள்ளன.
