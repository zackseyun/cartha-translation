base_translation:
  language: en
  yaml_path: translation/ot/joshua/004/023.yaml
  text: For Yahweh your God dried up the waters of the Jordan before you until you crossed over[a], just as Yahweh your God did to the Sea of Reeds, which he dried up before us until we crossed over.
translation:
  language: ta
  text: உங்கள் கடவுளாகிய யாவே, நீங்கள் கடந்து செல்லும்வரை உங்கள் முன்னால் யோர்தான் நதியின் நீரை வற்றச் செய்ததுபோலவே, நாங்கள் கடந்து செல்லும்வரை எங்கள் முன்னால் நாணல் கடலின்[a] நீரையும் வற்றச் செய்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: மரபாக, “செங்கடல்” என்று மொழிபெயர்க்கப்படுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹבִישׁ
  choice: வற்றிப்போகச் செய்தார்
  rationale: இது יבש என்பதன் ஹிஃபில் வடிவம்; தண்ணீரை அகற்றி நிலத்தை உலரச் செய்த காரணவினைப் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது. வசனத்தில் இருமுறை வரும் வினை ஒரே விதமாக மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைத்திருப்பெயரான יהוה-வை ஒரு பட்டப்பெயரால் மாற்றாமல், தமிழில் பொதுவாகப் புரியக்கூடிய ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: אֱלֹהֵיכֶם
  choice: உங்கள் கடவுளாகிய
  rationale: יהוה உடன் வரும் ஒருமைப் பொருள் இஸ்ரயேலரின் கடவுளைக் குறிக்கிறது; தமிழில் பெயருடன் இயல்பாக இணையும் அமைப்பு பயன்படுத்தப்பட்டுள்ளது.
- source_word: מֵי הַיַּרְדֵּן
  choice: யோர்தானின் தண்ணீரை
  rationale: எபிரெயக் கட்டமைப்பின் தண்ணீர் என்ற தெளிவான படிமத்தைப் பேணுகிறது; ஆற்றின் பெயருடன் இயல்பான தமிழ் உரிமைத் தொடர்பைப் பயன்படுத்துகிறது.
- source_word: מִפְּנֵיכֶם / מִפָּנֵינוּ
  choice: உங்கள் முன்னால் / எங்கள் முன்னால்
  rationale: முகம் அல்லது முன்னிலை என்பதிலிருந்து உருவான இடவியல் மரபுத்தொடரை இயல்பான தமிழில் வெளிப்படுத்தி, இரு அரையடிகளின் இணை அமைப்பைப் பேணுகிறது.
- source_word: עַד עָבְרְכֶם / עַד עָבְרֵנוּ
  choice: நீங்கள் கடந்து செல்லும்வரை / நாங்கள் கடந்து செல்லும்வரை
  rationale: கடத்தல் நிறைவடையும் வரையிலான கால நீட்சியையும் עבר என்ற இயக்க வினையையும் பேணுகிறது.
- source_word: כַּאֲשֶׁר עָשָׂה
  choice: அதுபோலவே ... செய்தார்
  rationale: யோர்தான் நிகழ்வுக்கும் முந்தைய கடல் கடத்தலுக்கும் இடையிலான வெளிப்படையான ஒப்புமையை நவீன தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: יַם סוּף
  choice: நாணற்கடல்
  rationale: סוּף என்பதன் நேரடிப் பொருளான நாணல் அல்லது கோரைச் செடிகளைப் பேணுகிறது; மரபான பெயர் அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: יהוה என்ற இறைத்திருப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூல உரை இறைவனின் தனிப்பெயரை நேரடியாகப் பயன்படுத்துவதால், அதை பட்டப்பெயராக மாற்றாமல் ஒலிபெயர்ப்பது மூலமொழி முன்னுரிமையைப் பேணுகிறது.
- issue: יַם סוּף என்ற இடப்பெயரை மொழிபெயர்த்தல்
  choice: நாணற்கடல்
  alternative: செங்கடல்
  rationale: எபிரெயில் סוּף என்பது நாணலைக் குறிக்கிறது. பரவலாக அறியப்பட்ட மரபு மொழிபெயர்ப்பு வாசகர் அறிதலுக்காக அடிக்குறிப்பில் வைக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் கண்ணியமான, எளிதில் புரியும் நடை. மூலத்தின் ஒப்புமை, இரண்டாம் நபர்/முதல் நபர் பன்மை வேறுபாடு, மீளுரைத்தல் ஆகியவை பேணப்பட்டுள்ளன; [a] குறியீடு முதன்மை உரையில் இடம்பெற்றுள்ளது.
