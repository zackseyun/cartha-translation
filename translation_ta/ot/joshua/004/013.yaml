  text: כְּ/אַרְבָּעִ֥ים אֶ֖לֶף חֲלוּצֵ֣י הַ/צָּבָ֑א עָבְר֞וּ לִ/פְנֵ֤י יְהוָה֙ לַ/מִּלְחָמָ֔ה אֶ֖ל עַֽרְב֥וֹת יְרִיחֽוֹ׃ס
base_translation:
  language: en
  yaml_path: translation/ot/joshua/004/013.yaml
  text: About forty thousand armed for war crossed over before Yahweh for battle[a], to the plains of Jericho.
translation:
  language: ta
  text: ஆயுதமேந்திய சுமார் நாற்பதாயிரம் பேர் யாவேக்கு முன்பாகப் போரிடுவதற்காக எரிகோவின் சமவெளிகளுக்குக் கடந்துசென்றார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כְּאַרְבָּעִים אֶלֶף
  choice: சுமார் நாற்பதாயிரம்
  rationale: எண்ணுக்கு முன் வரும் כְּ தோராயமான அளவைக் குறிக்கிறது; ‘சுமார்’ அந்த நுட்பத்தை இயல்பான தமிழில் காக்கிறது.
- source_word: חֲלוּצֵי הַצָּבָא
  choice: போருக்கு ஆயுதம் ஏந்திய ... பேர்
  rationale: இச்சொற்றொடர் போருக்காக ஆயுதம் தரித்து ஆயத்தமாக இருந்தவர்களைக் குறிக்கிறது; சூழல் தெளிவாகக் காட்டாத ‘முன்னணிப் படை’ என்ற கூடுதல் பொருள் சேர்க்கப்படவில்லை.
- source_word: עָבְרוּ
  choice: கடந்து ... சென்றார்கள்
  rationale: யோசுவா 3–4 அதிகாரங்களின் சூழலில் இது யோர்தானைக் கடப்பதைக் குறிக்கிறது; தமிழில் இயல்பாக இருக்க இலக்கு வாக்கியத்தின் முடிவில் இணைக்கப்பட்டுள்ளது.
- source_word: לִפְנֵי יְהוָה
  choice: யாவேக்கு முன்பாக
  rationale: לִפְנֵי என்பதன் ‘முன்பாக/முன்னிலையில்’ என்ற இடத்தையும் உறவையும் நேரடியாகக் காக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய உரையிலுள்ள இறைநாமத்தைப் பட்டப்பெயராக மாற்றாமல், அதன் பரவலான தமிழ் ஒலிபெயர்ப்பால் தருகிறது.
- source_word: לַמִּלְחָמָה
  choice: போருக்கு
  rationale: இது அவர்கள் ஆயுதம் ஏந்தியதன் நோக்கத்தைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: אֶל עַרְבוֹת יְרִיחוֹ
  choice: எரிகோவின் சமவெளிகளுக்கு
  rationale: עַרְבוֹת என்பது எரிகோவைச் சார்ந்த யோர்தான் பள்ளத்தாக்குச் சமவெளிப் பகுதியைக் குறிக்கிறது; தொழில்நுட்பமான ‘புல்வெளி/ஸ்டெப்பி’ என்பதைக் காட்டிலும் இது பொதுவாசகருக்குத் தெளிவு.
theological_decisions:
- issue: יְהוָה என்ற இறைநாமத்தின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூல உரை உடன்படிக்கை இறைநாமத்தை நேரடியாகப் பயன்படுத்துவதால், அதை பொதுப்பட்டப்பெயரால் மாற்றாமல் ‘யாவே’ என்று ஒலிபெயர்க்கிறது.
translation_notes:
  register: நவீன செந்தமிழ் நடையில், பொதுவாசகருக்குப் புரியும் வகையில் அமைக்கப்பட்டுள்ளது. எபிரெய வாக்கியத்தின் தகவல் வரிசையைத் தமிழின் இயல்பான சொற்றொடர் அமைப்புக்கேற்ப சற்றே மாற்றியுள்ளபோதிலும், தோராய எண்ணிக்கை, போராயத்தம், யாவேக்கு முன்பாகக் கடத்தல், எரிகோ சமவெளிகள் என்ற இலக்கு ஆகிய அனைத்தும் காக்கப்பட்டுள்ளன.
