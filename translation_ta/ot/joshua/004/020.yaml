translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகருக்கு எளிதில் புரியும் கண்ணியமான உரைநடை. எபிரெயச் சொல் வரிசையை இயந்திரமாகப் பின்பற்றாமல், கற்களின் மூல இடம், எண்ணிக்கை, சுட்டுத்தன்மை, செய்பவர், நிறுவப்பட்ட இடம் ஆகிய அனைத்தையும் தெளிவாகப் பாதுகாக்கிறது.
