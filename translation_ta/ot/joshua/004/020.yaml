  text: And Joshua set up these twelve stones at Gilgal, which they had taken from the Jordan.
translation:
  language: ta
  text: யோசுவா யோர்தானிலிருந்து எடுத்த இந்தப் பன்னிரண்டு கற்களைக் கில்காலில் நாட்டினார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאֵת
  choice: -ஐயும்
  rationale: வாவ் இணைப்புச் சொல் முந்தைய நிகழ்வோடு வசனத்தை இணைக்கிறது; אֵת நேரடி தமிழ் இணை இல்லாத நேரடிச் செயப்படுபொருள் குறியீடு. இரண்டின் இயல்பான தாக்கமும் ‘கற்களையும்’ என்பதில் வெளிப்படுகிறது.
- source_word: שְׁתֵּים עֶשְׂרֵה הָאֲבָנִים הָאֵלֶּה
  choice: இந்தப் பன்னிரண்டு கற்களையும்
  rationale: எண்ணையும் சுட்டுப்பெயரடையையும் முழுமையாகப் பாதுகாத்து, இயல்பான தமிழ் சொல் வரிசையில் தருகிறது.
- source_word: אֲשֶׁר לָקְחוּ
  choice: அவர்கள் எடுத்துவந்த
  rationale: கற்களை முன்னதாக யோர்தானிலிருந்து எடுத்துச் சென்று இவ்விடத்துக்குக் கொண்டுவந்த நிகழ்வை இயல்பான தமிழில் குறிக்கிறது; எழுவாயான ‘அவர்கள்’ என்பதையும் வெளிப்படையாகப் பாதுகாக்கிறது.
- source_word: מִן הַיַּרְדֵּן
  choice: யோர்தானிலிருந்து
  rationale: מִן குறிக்கும் மூல இடத்தை ‘-இலிருந்து’ துல்லியமாகத் தருகிறது; யோர்தான் என்பது சூழலில் ஆற்றின் நிலையான பெயர் என்பதால் ‘ஆறு’ சேர்க்கப்படவில்லை.
- source_word: הֵקִים
  choice: நாட்டினார்
  rationale: நினைவுச் சின்னமாகக் கற்களை நிலைநிறுத்திய செயலைச் சுருக்கமாகவும் இயல்பாகவும் குறிக்கிறது; வெறுமனே ‘வைத்தார்’ என்பதைக் காட்டிலும் மூல வினையின் நிறுவும் நுணுக்கத்தைப் பாதுகாக்கிறது.
- source_word: יְהוֹשֻׁעַ
  choice: யோசுவா
  rationale: நவீனத் தமிழ் வேதாகமப் பயன்பாட்டில் அறியப்பட்ட பெயர் வடிவம்.
- source_word: בַּגִּלְגָּל
  choice: கில்காலில்
  rationale: בְ இடப்பொருளைத் தமிழின் ‘-இல்’ வேற்றுமை உருபால் இயல்பாகக் குறிக்கிறது.
