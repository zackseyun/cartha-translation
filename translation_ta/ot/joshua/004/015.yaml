lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: கூறினார்
  rationale: வாவ் தொடர்வினையுடன் வரும் ‘சொல்’ என்னும் வினை கதைநிகழ்வை முன்னெடுக்கிறது. தமிழில் முந்தைய வசனத்துடனான தொடர்ச்சி இயல்பாகவே புரிவதால், தனியாக ‘அப்போது’ அல்லது ‘மேலும்’ சேர்க்காமல் ‘கூறினார்’ என மொழிபெயர்ப்பது இயல்பாகவும் செம்மையாகவும் உள்ளது.
- source_word: יְהוָה
  choice: யாவே
  rationale: நான்கு எழுத்துகளாலான இறைப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், அதன் வழக்கமான தமிழ் ஒலிபெயர்ப்பான ‘யாவே’ என்று வழங்குகிறது.
- source_word: אֶל
  choice: -விடம்
  rationale: பேச்சு யாரை நோக்கிச் சொல்லப்பட்டது என்பதைக் குறிக்கும் முன்னிடைச்சொல்லை இயல்பான தமிழில் ‘யோசுவாவிடம்’ என்ற வேற்றுமை வடிவில் தருகிறது.
- source_word: יְהוֹשֻׁעַ
  choice: யோசுவா
  rationale: எபிரெயத் தனிப்பெயரின் தமிழில் நிலைபெற்ற வேதாகம வடிவம்.
- source_word: לֵאמֹר
  choice: ':'
  rationale: இந்த வினையெச்ச வடிவம் அடுத்த வசனத்தில் வரும் நேரடிப் பேச்சை அறிமுகப்படுத்துகிறது. தமிழில் ‘சொல்லியதாவது’ என்று சொல்லை மீண்டும் இடுவதற்குப் பதிலாக முக்காற்புள்ளி அதே பணியை இயல்பாகச் செய்கிறது; மூல வடிவம் அடிக்குறிப்பில் குறிப்பிடப்படுகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலவசனம் இறைவனின் தனிப்பெயரான יהוה என்பதையே பயன்படுத்துகிறது. அதை ஒரு பட்டமாக மாற்றாமல் ஒலிபெயர்ப்பது மூலத்தின் தனிப்பெயர் தன்மையைப் பாதுகாக்கிறது; ‘யாவே’ என்பது இன்றைய ஆய்வில் பொதுவாக ஏற்கப்படும் உச்சரிப்பைத் தமிழில் பிரதிபலிக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் செம்மையான நடை பயன்படுத்தப்பட்டுள்ளது. ‘கூறினார்’ மரியாதையையும் இயல்பான கதைநடையையும் காக்கிறது; அடுத்த வசனத்தின் நேரடிப் பேச்சை அறிமுகப்படுத்த முக்காற்புள்ளி பயன்படுத்தப்பட்டுள்ளது.
