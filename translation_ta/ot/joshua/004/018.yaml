base_translation:
  language: en
  yaml_path: translation/ot/joshua/004/018.yaml
  text: And it happened[a], when the priests carrying the ark of the covenant of Yahweh came up from the midst of the Jordan, and the soles of the priests’ feet were lifted up to the dry ground[b], that the waters of the Jordan returned to their place and went as before over all its banks.
translation:
  language: ta
  text: 'இவ்வாறு நிகழ்ந்தது: யாவேயின் உடன்படிக்கைப் பெட்டியைச் சுமந்த ஆசாரியர்கள் யோர்தானின் நடுவிலிருந்து மேலே வந்தபோது, ஆசாரியர்களின் பாத உள்ளங்கால்கள் வறண்ட தரையை நோக்கி உயர்ந்தன[a]; அப்பொழுது யோர்தானின் நீர் தன் இடத்திற்குத் திரும்பி, முன்புபோல[b] அதன் எல்லாக் கரைகளின்மேலும் ஓடியது.


    [a] எபிரெய மொழியில், “ஆசாரியர்களின் பாத உள்ளங்கால்கள் வறண்ட தரையை நோக்கி உயர்த்தப்பட்டபோது”; வினைச்சொல் ஆற்றிலிருந்து இழுத்தெடுக்கப்பட்ட இயக்கத்தையும் குறிக்கலாம்.


    [b] எபிரெய மொழியில், “நேற்றும் முந்தின நாளும் இருந்ததுபோல”; இது “முன்புபோல” என்று பொருள்படும் மரபுத்தொடர்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மொழியில், “ஆசாரியர்களின் பாத உள்ளங்கால்கள் வறண்ட தரையை நோக்கி உயர்த்தப்பட்டபோது”; வினைச்சொல் ஆற்றிலிருந்து இழுத்தெடுக்கப்பட்ட இயக்கத்தையும் குறிக்கலாம்.
    reason: נִתְּקוּ என்பதன் உயர்த்தப்படுதல்/இழுத்தெடுக்கப்படுதல் என்ற இயக்க நுணுக்கத்தைப் பாதுகாக்கிறது.
  - marker: b
    text: எபிரெய மொழியில், “நேற்றும் முந்தின நாளும் இருந்ததுபோல”; இது “முன்புபோல” என்று பொருள்படும் மரபுத்தொடர்.
    reason: כִתְמוֹל שִׁלְשׁוֹם என்ற எபிரெய மரபுத்தொடரின் சொற்சார்ந்த வடிவத்தையும் சூழல்சார் பொருளையும் தருகிறது.
lexical_decisions:
- source_word: וַיְהִי בַעֲלוֹת
  choice: மேலே வந்து ... தொட்டவுடனே
  rationale: ב + infinitive construct காலச் சூழலைக் குறிக்கிறது. தனியாக ஒரு கடினமான ‘அது நிகழ்ந்தது’ அமைப்பை உருவாக்காமல், தொடரின் நிகழ்வுநிலையை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: נֹשְׂאֵי אֲרוֹן בְּרִית יְהוָה
  choice: யாவேயின் உடன்படிக்கைப் பெட்டியைச் சுமந்த
  rationale: Construct தொடரை இயல்பான தமிழ் உடைமை அமைப்பில் தருகிறது; נשׂא என்பதன் செயற்பொருளை ‘சுமந்த’ தெளிவாக வெளிப்படுத்துகிறது.
- source_word: מִתּוֹךְ הַיַּרְדֵּן
  choice: யோர்தானின் நடுவிலிருந்து
  rationale: תוך ஆற்றின் உள்ளே அல்லது நடுவே இருந்த இடத்தைக் குறிக்கிறது; வெறும் கரையிலிருந்து என்பதல்ல.
- source_word: נִתְּקוּ כַּפּוֹת רַגְלֵי הַכֹּהֲנִים אֶל הֶחָרָבָה
  choice: அவர்களுடைய உள்ளங்கால்கள் வறண்ட தரையைத் தொட்டவுடனே[a]
  rationale: כפות רגלי என்பதைக் ‘உள்ளங்கால்கள்’ என்று துல்லியமாகத் தருகிறது. נתק இங்கு ஆற்றுப்படுகையிலிருந்து பாதங்கள் எடுக்கப்பட்டு வறண்ட தரைக்கு வந்த இயக்கத்தைக் குறிக்கிறது; இயல்பான தமிழுக்காக ‘தொட்டவுடனே’ பயன்படுத்தப்பட்டு, சொல்லுக்கு நெருக்கமான வடிவம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: וַיָּשֻׁבוּ מֵי הַיַּרְדֵּן לִמְקוֹמָם
  choice: யோர்தானின் நீர் தன் இடத்திற்குத் திரும்பி
  rationale: நீர் மீண்டும் தனது வழக்கமான இடத்திற்கு வந்ததை நேரடியாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: כִתְמוֹל שִׁלְשׁוֹם
  choice: முன்புபோல[b]
  rationale: சொல்லுக்கு சொல் ‘நேற்றும் முந்தின நாளும் இருந்ததுபோல’ என்றாலும், இது முந்தைய வழக்கமான நிலையைச் சுட்டும் எபிரெய மரபுத்தொடர். அதன் சொற்சார்ந்த வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
- source_word: עַל כָּל גְּדוֹתָיו
  choice: அதன் கரைகள் அனைத்திற்கும் மேலாக
  rationale: על இங்கு நீர் கரைகளைத் தாண்டி அல்லது அவற்றின் மேல் பெருகியோடியதைத் தெரிவிக்கிறது; வெறும் கரையோர ஓட்டம் என்று மங்கலாக்கப்படவில்லை.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: ஆண்டவர்; யெகோவா
  rationale: மூலத்தில் பட்டப்பெயர் அல்ல, நான்கு எழுத்துகளைக் கொண்ட தனிப்பெயர் உள்ளது. ‘யாவே’ என்பது Yahweh என்பதற்கான நவீன தமிழ் ஒலிபெயர்ப்பு; ‘ஆண்டவர்’ என்று மாற்றுவதோ ‘Jehovah’ மரபைத் தொடர்வதோ தவிர்க்கப்பட்டது.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்கு எளிதாகவும் வேதாகம உரைக்கு ஏற்ற கண்ணியத்துடனும் வடிவமைக்கப்பட்டது. ‘உடன்படிக்கைப் பெட்டி’, ‘ஆசாரியர்கள்’, ‘வறண்ட தரை’ ஆகிய சொற்கள் தெளிவான சமய-வரலாற்றுச் சொல்லாட்சியைப் பேணுகின்றன; வாக்கிய ஓட்டம் எபிரெய நிகழ்வுகளின் விரைவான தொடரை இயல்பான தமிழில் பிரதிபலிக்கிறது.
