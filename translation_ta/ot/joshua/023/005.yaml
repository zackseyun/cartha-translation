  text: וַ/יהוָ֣ה אֱלֹֽהֵי/כֶ֗ם ה֚וּא יֶהְדֳּפֵ֣/ם מִ/פְּנֵי/כֶ֔ם וְ/הוֹרִ֥ישׁ אֹתָ֖/ם מִ/לִּ/פְנֵי/כֶ֑ם וִֽ/ירִשְׁתֶּם֙ אֶת אַרְצָ֔/ם כַּ/אֲשֶׁ֥ר דִּבֶּ֛ר יְהוָ֥ה אֱלֹהֵי/כֶ֖ם לָ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/023/005.yaml
  text: And Yahweh your God[a], he himself will drive them out from before you and dispossess them from before you, and you will take possession of their land[b], just as Yahweh your God spoke to you.
translation:
  language: ta
  text: உங்கள் கடவுளாகிய யாவே தாமே அவர்களை உங்கள் முன்னிலையிலிருந்து துரத்தி, அங்கிருந்து அவர்களை உடைமையிழக்கச் செய்வார். உங்கள் கடவுளாகிய யாவே உங்களிடம் கூறியபடியே, நீங்கள் அவர்களுடைய நிலத்தை உரிமையாக்கிக் கொள்வீர்கள்.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அவர்களுடைய நிலத்தைச் சுதந்தரித்துக்கொள்வீர்கள்.’ எபிரெய வினைச்சொல் ‘சுதந்தரித்தல்’ அல்லது ‘உரிமையாக்கிக் கொள்தல்’ என்று பொருள்படலாம்; இங்கு நிலத்தைக் கைப்பற்றும் சூழலுக்கு ஏற்ப ‘உரிமையாக்கிக் கொள்வீர்கள்’ என்பது தேர்ந்தெடுக்கப்பட்டுள்ளது.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில், ‘உங்கள் கடவுளாகிய யாவே உங்களிடம் கூறியபடியே.’ இங்கு கூறியது வாக்குறுதியையும் உள்ளடக்குகிறது; என்றாலும் பிரதான உரை ‘கூறியபடியே’ என்ற நேரடியான பொருளைப் பாதுகாக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: யாவே
  rationale: உடன்படிக்கையின் தனிப்பெயரை பொதுப்பட்டமாக மாற்றாமல், எபிரெய ஒலிப்புக்கு நெருக்கமான தமிழாக்கமாகத் தருகிறது.
- source_word: אֱלֹהֵיכֶם
  choice: உங்கள் கடவுள்
  rationale: இங்கு யாவேயுடன் இணைந்துள்ளதால் ஒருமை பொருள் தெளிவாக உள்ளது; தமிழில் இயல்பாக ‘உங்கள் கடவுள்’ என வருகிறது.
- source_word: הוּא
  choice: தாமே
  rationale: தனித்த சுட்டுப்பெயரின் வலியுறுத்தலை மரியாதையும் இயல்பும் கொண்ட தமிழில் வெளிப்படுத்துகிறது.
- source_word: יֶהְדֳּפֵם
  choice: அவர்களை ... துரத்தி
  rationale: הדף என்பதன் வலுக்கட்டாயமாக அப்புறப்படுத்தும் பொருளை வெற்றிகொள்ளும் சூழலில் இயல்பாகத் தருகிறது.
- source_word: מִפְּנֵיכֶם / מִלִּפְנֵיכֶם
  choice: உங்கள் முன்னிலையிலிருந்து
  rationale: மீண்டும் வரும் எபிரெய இடவியல் சொல்லாட்சியை இரு இடங்களிலும் ஒரே விதமாகப் பாதுகாக்கிறது.
- source_word: וְהוֹרִישׁ אֹתָם
  choice: அவர்களை ... வெளியேற்றுவார்
  rationale: Hiphil வடிவம் முந்தைய குடிகளை அவர்களுடைய உடைமையிலிருந்து அகற்றுவதைச் சுட்டுகிறது; தமிழில் எளிதாகப் புரியும் சொல்லாகத் தேர்ந்தெடுக்கப்பட்டது.
- source_word: וִירִשְׁתֶּם
  choice: உடைமையாக்கிக்கொள்வீர்கள்
  rationale: Qal வடிவத்தின் ‘சுதந்தரித்தல்/உடைமைகொள்ளுதல்’ என்ற பொருள் வரம்பில், கைப்பற்றப்படும் நிலச் சூழலுக்கு ஏற்ற செயற்பாட்டுப் பொருளைத் தருகிறது.
- source_word: אֶת אַרְצָם
  choice: அவர்களுடைய நிலத்தை
  rationale: அந்த மக்களால் தற்போது பிடித்துவைக்கப்பட்டிருக்கும் நிலத்தைக் குறிக்கும் நேரடியான உடைமைத் தொடர்.
- source_word: כַּאֲשֶׁר דִּבֶּר ... לָכֶם
  choice: உங்களிடம் கூறியபடியே
  rationale: דבר என்பதன் அடிப்படை ‘பேசு/கூறு’ பொருளைப் பாதுகாத்து, வாக்குறுதி என்ற சூழலார்ந்த நுட்பத்தை மறைமுகமாகவே விடுகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழியாக்கம்
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலத்தில் வரும் தனிப்பட்ட உடன்படிக்கைப் பெயரைப் பொதுப்பட்டமாக மாற்றாமல் வெளிப்படையாகப் பாதுகாக்கிறது.
- issue: ירש வேரின் Hiphil மற்றும் Qal வடிவங்களுக்கிடையிலான நுட்ப வேறுபாடு
  choice: ‘வெளியேற்றுவார்’ / ‘உடைமையாக்கிக்கொள்வீர்கள்’
  alternative: இரண்டையும் ‘துரத்துதல்’ என வழங்குதல் அல்லது இரண்டாவது வடிவத்தை ‘சுதந்தரிப்பீர்கள்’ என வழங்குதல்
  rationale: கடவுள் முன் குடிகளை உடைமையிலிருந்து அகற்றுவதற்கும் இஸ்ரவேலர் அவர்களுடைய நிலத்தை உடைமைகொள்வதற்கும் இடையிலான வேறுபாட்டைப் பாதுகாக்கிறது.
- issue: דִּבֶּר என்பதில் வாக்குறுதி நுட்பம்
  choice: கூறியபடியே
  alternative: வாக்குறுதி அளித்தபடியே
  rationale: இந்தப் பேச்சு வாக்குறுதியின் செயல்பாட்டைக் கொண்டிருந்தாலும், மூல வினைச்சொல்லின் விரிந்த ‘கூறுதல்’ பொருளை பிரதான உரை பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. எபிரெயத்தில் மீண்டும் வரும் ‘உங்கள் முன்னிலையிலிருந்து’ என்ற தொடர் திட்டமிட்டு இருமுறையும் வைக்கப்பட்டுள்ளது. நீளமான எபிரெய வாக்கியம் தமிழின் இயல்புக்காக இரண்டு வாக்கியங்களாகப் பிரிக்கப்பட்டது; பொருள் வரிசை பாதுகாக்கப்பட்டுள்ளது. இரண்டு அடிக்குறிப்பு குறிகளும் அவை விளக்கும் இறுதி உடைமைகொள்ளுதல்/கூறுதல் பகுதிக்குப் பின் இணைக்கப்பட்டுள்ளன.
