source:
  edition: WLC
  text: וַ/יּ֤וֹרֶשׁ יְהוָה֙ מִ/פְּנֵי/כֶ֔ם גּוֹיִ֖ם גְּדֹלִ֣ים וַ/עֲצוּמִ֑ים וְ/אַתֶּ֗ם לֹא עָ֤מַד אִישׁ֙ בִּ/פְנֵי/כֶ֔ם עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/023/009.yaml
  text: For Yahweh has driven out from before you great and mighty nations[a], and as for you[b], not a man has stood before you to this day.
translation:
  language: ta
  text: யாவே பெரிய, வலிமைமிக்க மக்களினங்களை உங்கள் முன்பிலிருந்து துரத்திவிட்டார்[a]; உங்களையோ, இந்நாள்வரை ஒருவனாலும் எதிர்த்து நிற்க முடியவில்லை[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அவர்களை அவர்களுடைய நிலங்களிலிருந்து அகற்றினார்” அல்லது “விரட்டியடித்தார்” என்றும் மொழிபெயர்க்கலாம். எபிரெய வினைச்சொல், ஒரு மக்களை நிலத்திலிருந்து அகற்றி மற்றவர்கள் அதை உரிமையாக்கும்படி செய்வதை வலியுறுத்தக்கூடும்.
    reason: lexical_alternative
  - marker: b
    text: சொல்லளவில், “உங்கள் முன்பாக ஒரு மனிதனும் நிற்கவில்லை.” போர்ச் சூழலில் இது, உங்களை ஒருவராலும் எதிர்த்து நிலைக்க முடியவில்லை என்று பொருள்படும் மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹרֶשׁ
  choice: துரத்திவிட்டார்
  rationale: ஹிஃபில் வடிவிலுள்ள ירשׁ, பிறரை நிலத்திலிருந்து அகற்றி அதைக் கைப்பற்றச் செய்வதை இங்கு குறிக்கிறது. போர்ச் சூழலில் “துரத்திவிட்டார்” என்பது இயல்பான நவீனத் தமிழாகவும், முடிவுற்ற செயலைத் தெளிவாகவும் தெரிவிக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: திருநான்கெழுத்தாகிய இறைப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் பரவலாகப் புரிந்துகொள்ளக்கூடிய ஒலிபெயர்ப்பாக “யாவே” என்று வழங்குகிறது.
- source_word: מִפְּנֵיכֶם
  choice: உங்கள் முன்னிலையிலிருந்து
  rationale: מִן + פָּנִים என்ற எபிரெய மரபுத்தொடரின் ‘உங்கள் முன்பிலிருந்து/உங்கள் இருப்பிடத்திலிருந்து அகற்றுதல்’ என்ற கருத்தைத் தக்கவைக்கிறது.
- source_word: גּוֹיִם גְּדֹלִים וַעֲצוּמִים
  choice: பெரிய, வலிமைமிக்க மக்களினங்களை
  rationale: גּוֹיִם என்பது இங்கு நவீன அரசியல் நாடுகளைவிட மக்களினங்களைக் குறிக்கிறது; גְּדֹלִים மற்றும் עֲצוּמִים அவற்றின் பெருமையையும் வலிமையையும் தெரிவிக்கின்றன.
- source_word: וְאַתֶּם
  choice: உங்களையோ
  rationale: முன்னிலைப்படுத்தப்பட்ட சுட்டுப்பெயரின் வலியுறுத்தலையும் ஒப்பீட்டு நயத்தையும் தமிழில் “-ஓ” உருபு இயல்பாக வெளிப்படுத்துகிறது.
- source_word: לֹא עָמַד אִישׁ בִּפְנֵיכֶם
  choice: ஒருவனாலும் எதிர்த்து நிற்க முடியவில்லை
  rationale: சொல்லளவில் ‘ஒரு மனிதனும் உங்கள் முன் நிற்கவில்லை’ என்றாலும், போர்ச் சூழலில் இந்த மரபுத்தொடர் ‘உங்களை எதிர்த்து நிலைக்க முடியவில்லை’ என்று பொருள்படுகிறது. “ஒருவனாலும்” என்பது மூலத்தின் ஒருமை ஆண்பால் வடிவையும் தக்கவைக்கிறது.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: இந்நாள்வரை
  rationale: கதை சொல்லப்படும் தற்போதைய தருணம்வரை அந்த நிலை தொடர்ந்ததைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: யெகோவா
  rationale: மூலத்தில் தனிப்பட்ட இறைப் பெயரான திருநான்கெழுத்து நேரடியாக உள்ளது. அதை “ஆண்டவர்” போன்ற பட்டத்தால் மாற்றாமல் ஒலிபெயர்த்து, உடன்படிக்கையின் பெயர் என்ற தன்மையைப் பாதுகாக்கிறது.
- issue: வெற்றியின் செயற்பாட்டாளர்
  choice: மக்களினங்களைத் துரத்தியவர் யாவே என்று நேரடியாகக் கூறுதல்
  alternative: இஸ்ரவேல் அவர்களைத் துரத்தியதாக மென்மைப்படுத்துதல்
  rationale: மூல வாக்கியத்தின் எழுவாய் யாவே; ஆகவே வெற்றியை இறைச் செயலாகக் கூறும் அதன் இறையியல் வலியுறுத்தல் அப்படியே வைக்கப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், மரியாதையும் வேதாகமச் செறிவும் உள்ள நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. “ஜாதிகள்” என்ற சொல்லின் இன்றைய சாதிசார் குழப்பத்தைத் தவிர்க்க “மக்களினங்கள்” பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் வலியுறுத்தலை “உங்களையோ” என்றும், போர்ச் சூழலின் மரபுத்தொடரை இயல்பான தமிழில் “எதிர்த்து நிற்க முடியவில்லை” என்றும் வழங்கியுள்ளது.
