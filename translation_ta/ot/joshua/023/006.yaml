base_translation:
  language: en
  yaml_path: translation/ot/joshua/023/006.yaml
  text: Therefore be very strong to keep and to do all that is written in the Book of the Law of Moses[a], so as not to turn from it to the right or to the left.
translation:
  language: ta
  text: ஆகவே, மோசேயின் சட்டப் புத்தகத்தில்[a] எழுதப்பட்டுள்ள அனைத்தையும் கடைப்பிடிக்கவும் நிறைவேற்றவும் மிகவும் உறுதியாயிருங்கள்; அதிலிருந்து வலப்பக்கமோ இடப்பக்கமோ விலகாதபடி இருங்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘மோசேயின் போதனைப் புத்தகம்’ அல்லது ‘மோசேயின் அறிவுறுத்தல் புத்தகம்’ என்றும் மொழிபெயர்க்கலாம். எபிரெய மொழியில் தோரா என்ற சொல் ‘சட்டம்’ என்பதோடு ‘போதனை’ அல்லது ‘அறிவுறுத்தல்’ என்றும் பொருள்படும்; இங்கு அது குறிப்பாக மோசேயின் சட்டத் தொகுப்பைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַחֲזַקְתֶּם מְאֹד
  choice: மிகவும் உறுதியாயிருங்கள்
  rationale: חזק என்பதன் உறுதி அல்லது வலிமை சார்ந்த பொருளையும், பன்மை முன்னிலையோருக்கான அறிவுறுத்தல் வலிமையையும் இயல்பான நவீன தமிழில் தருகிறது. மְאֹד என்பதன் வலியுறுத்தலை ‘மிகவும்’ காக்கிறது.
- source_word: לִשְׁמֹר וְלַעֲשׂוֹת
  choice: கடைப்பிடித்து நிறைவேற்றுவதில்
  rationale: உடன்படிக்கைச் சட்டச் சூழலில் שׁמר என்பது கடைப்பிடித்தலையும் עשה என்பது எழுதப்பட்டதை நடைமுறையில் நிறைவேற்றுதலையும் குறிக்கிறது. இரண்டு வினைகளின் வேறுபாட்டையும் தமிழ் இயல்பையும் காக்கிறது.
- source_word: כָּל הַכָּתוּב
  choice: எழுதப்பட்டுள்ள அனைத்தையும்
  rationale: எழுத்தில் உள்ள முழு உள்ளடக்கத்தையும் குறிக்கும் எபிரெயக் கட்டமைப்பைத் தெளிவாகவும் முழுமையாகவும் வெளிப்படுத்துகிறது.
- source_word: בְּסֵפֶר תּוֹרַת מֹשֶׁה
  choice: மோசேயின் திருச்சட்டப் புத்தகத்தில்
  rationale: סֵפֶר என்பது புத்தகம் அல்லது சுருள் எனப் பொருள்படலாம்; இங்கு ‘புத்தகம்’ வாசகர்களுக்கு இயல்பானது. תּוֹרָה மோசேயோடு தொடர்புடைய உடன்படிக்கைச் சட்டத் தொகுப்பைக் குறிப்பதால் ‘திருச்சட்டம்’ என மொழிபெயர்க்கப்பட்டுள்ளது; அதன் விரிவான ‘போதனை/அறிவுறுத்தல்’ பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: לְבִלְתִּי סוּר מִמֶּנּוּ
  choice: அதைவிட்டு ... விலகாதிருங்கள்
  rationale: விலகாமலிருக்கும் நோக்கத்தையும் கட்டளையின் வலிமையையும் இயல்பான தமிழில் தருகிறது. ஒருமை பின்னொட்டு எழுதப்பட்ட திருச்சட்டத்தை ஒருங்கிணைந்த ஒன்றாகச் சுட்டுவதால் ‘அதை’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: יָמִין וּשְׂמֹאול
  choice: வலப்புறமோ இடப்புறமோ
  rationale: எந்தத் திசையிலும் நெறிவிலகாதிருப்பதைக் குறிக்கும் எபிரெய உருவகத்தைத் தமிழிலும் பாதுகாக்கிறது.
theological_decisions:
- issue: மோசேயின் உடன்படிக்கைச் சூழலில் תּוֹרָה என்பதன் மொழிபெயர்ப்பு
  choice: ‘மோசேயின் திருச்சட்டப் புத்தகம்’ என்பதில் ‘திருச்சட்டம்’
  alternative: ‘மோசேயின் போதனைப் புத்தகம்’ அல்லது ‘மோசேயின் அறிவுறுத்தல் புத்தகம்’
  rationale: תּוֹרָה என்பதற்கு பொதுவாகப் ‘போதனை’ அல்லது ‘அறிவுறுத்தல்’ என்ற பொருள் இருக்கலாம். ஆனால் இச்சூழலில் அது மோசேயோடு தொடர்புடைய எழுதப்பட்ட உடன்படிக்கைச் சட்டத் தொகுப்பைக் குறிப்பதால் ‘திருச்சட்டம்’ முதன்மை உரையில் பொருத்தமானது. சொற்பொருளின் விரிவை அடிக்குறிப்பு வெளிப்படையாகக் காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘நியாயப்பிரமாணம்’ போன்ற பழமையான சொல்லுக்குப் பதிலாக ‘திருச்சட்டம்’ தேர்ந்தெடுக்கப்பட்டது. வலது–இடது என்ற மூல உருவகமும், ‘கடைப்பிடித்து நிறைவேற்றுதல்’ என்ற இரட்டைச் செயற்பாடும் பாதுகாக்கப்பட்டுள்ளன.
