base_translation:
  language: en
  yaml_path: translation/ot/joshua/023/007.yaml
  text: so that you do not come among these nations[a], these that remain with you[b], and do not mention the name of their gods or make anyone swear by them or serve them or bow down to them.
translation:
  language: ta
  text: உங்களோடு எஞ்சியிருக்கும் இந்த மக்களினங்களிடையே நீங்கள் செல்லாதபடியும், அவர்களுடைய தெய்வங்களின் பெயரைக் குறிப்பிடாதபடியும்[a], அவற்றின் பெயரில் யாரையும் சத்தியம் செய்ய வைக்காதபடியும்[b], அவற்றுக்குச் சேவை செய்யாதபடியும், அவற்றின் முன் பணியாதபடியும் இருங்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்களுடைய தெய்வங்களின் பெயரைக் கூவி அழைக்காதபடியும்.” எபிரெய வினைச்சொல் ‘குறிப்பிடுதல்’ அல்லது இச்சூழலில் ‘பெயரைக் கூவி அழைத்தல்’ என்று பொருள்படலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அவற்றின் பெயரில் சத்தியம் செய்யாதபடியும்.” எபிரெய வினை காரணவினை வடிவில் இருப்பதால், சொல்லுக்குச் சொல் “சத்தியம் செய்ய வைக்காதபடியும்” என்று பொருள்; பிறரை அந்தத் தெய்வங்களின் பெயரில் சத்தியம் செய்ய வைப்பதும் இதில் அடங்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְבִלְתִּי בוֹא בַּגּוֹיִם הָאֵלֶּה
  choice: இந்த மக்களினங்களோடு நீங்கள் கலந்துறவாடாதபடியும்
  rationale: בוא + ב இங்கு வெறும் புவியியல் நுழைவைவிட எஞ்சிய மக்களோடு கலந்து தொடர்புகொள்வதைக் குறிக்கிறது. இயல்பான நவீனத் தமிழில் நோக்கம்/தடையைத் தெளிவாகச் சொல்கிறது.
- source_word: הַנִּשְׁאָרִים הָאֵלֶּה אִתְּכֶם
  choice: உங்களோடு எஞ்சியிருக்கிற இந்த மக்களினங்கள்
  rationale: שׁאר என்பதன் எஞ்சியிருத்தல் என்ற பொருளையும், אִתְּכֶם என்பதன் ‘உங்களோடு’ என்ற இணைவாழ்வு கருத்தையும் காக்கிறது.
- source_word: וּבְשֵׁם אֱלֹהֵיהֶם לֹא תַזְכִּירוּ
  choice: அவர்களுடைய தெய்வங்களின் பெயரைச் சொல்லாதபடியும்
  rationale: Hiphil הזכיר என்பதன் நேரடியான ‘குறிப்பிடு/சொல்’ பொருளை முதன்மைப்படுத்துகிறது; வழிபாட்டுச் சூழலில் ‘பெயரைச் சொல்லி வேண்டுதல்’ என்ற சாத்தியத்தைக் குறிப்பில் காக்கிறது.
- source_word: וְלֹא תַשְׁבִּיעוּ
  choice: அவற்றின்மேல் யாரையும் ஆணையிடச் செய்யாதபடியும்
  rationale: שׁבע என்பதன் Hiphil வடிவம் காரணவினை; ஆகவே வெறுமனே ‘ஆணையிடாதீர்கள்’ என்பதற்கு மாறாக ‘யாரையும் ஆணையிடச் செய்யாதீர்கள்’ என்று மொழிபெயர்க்கப்படுகிறது. வெளிப்படாத செயப்படுபொருள் தமிழில் தெளிவுக்காகச் சேர்க்கப்பட்டுள்ளது.
- source_word: וְלֹא תַעַבְדוּם
  choice: அவற்றுக்குச் சேவை செய்யாதபடியும்
  rationale: עבד என்பதன் ‘சேவை செய்’ என்ற பொருளைத் தக்கவைத்து, அடுத்துவரும் பணிதலிலிருந்து தனித்த செயலைக் காட்டுகிறது.
- source_word: וְלֹא תִשְׁתַּחֲווּ לָהֶם
  choice: அவற்றைப் பணிந்துகொள்ளாதபடியும்
  rationale: שׁחה உடலைத் தாழ்த்திப் பணிதலைக் குறிக்கிறது. ‘பணிந்துகொள்’ என்பது நவீனத் தமிழில் இயல்பாகவும் வழிபாட்டுச் செயலின் உடல்சார் தன்மையை உணர்த்துவதாகவும் உள்ளது.
theological_decisions:
- issue: விக்கிரக ஆராதனையுடன் தொடர்புடைய செயல்களின் வரிசை
  choice: பெயரைச் சொல்லுதல், ஆணையிடச் செய்தல், சேவை செய்தல், பணிந்துகொள்ளுதல் ஆகியவற்றைத் தனித்தனி தடைகளாக வைத்தல்
  alternative: எல்லாவற்றையும் பொதுவாக ‘வழிபடாதீர்கள்’ என்று சுருக்குதல்
  rationale: எபிரெய உரை பல்வேறு விசுவாச/வழிபாட்டுச் செயல்களைத் தனித்தனியாகப் பட்டியலிடுகிறது. அவற்றை வேறுபடுத்துவது உரையின் துல்லியத்தையும் அதன் இறையியல் அழுத்தத்தையும் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையும் உரைநடையின் கண்ணியமும் காக்கப்பட்டுள்ளன. ‘மக்களினங்கள்’ என்பது இங்குள்ள גּוֹיִם என்பதைக் குறிப்பிட்ட இனக்குழுக்களாகத் தெளிவாக வெளிப்படுத்துகிறது. தெய்வங்களைக் குறிக்கும் பின்னிடைச் சுட்டுகளில் தமிழின் இயல்புப்படி ‘அவற்றை/அவற்றுக்கு’ பயன்படுத்தப்பட்டுள்ளது.
