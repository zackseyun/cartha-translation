base_translation:
  language: en
  yaml_path: translation/ot/joshua/023/004.yaml
  text: See[a], I have allotted to you these nations that remain as an inheritance for your tribes, from the Jordan, along with all the nations that I have cut off, to the Great Sea toward the going down of the sun.
translation:
  language: ta
  text: பாருங்கள், யோர்தான் முதல் சூரியன் மறையும் திசையிலுள்ள பெருங்கடல் வரை, எஞ்சியிருக்கும் இந்த நாடுகளையும் நான் அழித்தொழித்த எல்லா நாடுகளையும் உங்கள் கோத்திரங்களுக்குச் சுதந்தர உரிமையாகப் பங்கிட்டுக் கொடுத்திருக்கிறேன்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மொழியில், “சூரியன் மறையும் திசை”; அதாவது, மேற்கு திசை.
    reason: lexical_alternative
lexical_decisions:
- source_word: רְאוּ
  choice: பாருங்கள்
  rationale: ראה என்பதன் பன்மை ஏவல் வடிவம் கவனத்தை வலியுறுத்துகிறது. ‘பாருங்கள்’ என்பது அதன் சுட்டிக்காட்டும் வலிமையை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: הִפַּלְתִּי
  choice: பங்கிட்டுக் கொடுத்திருக்கிறேன்
  rationale: נפל என்பதன் ஹிஃபில் வடிவம் இங்கு சீட்டுப்போட்டு உரிய பங்குகளை ஒதுக்குவதைக் குறிக்கும் மரபுத்தொடர். தமிழில் நிலப்பகிர்வுச் சூழலைத் தெளிவாகக் காட்ட இவ்வாறு மொழிபெயர்க்கப்பட்டது.
- source_word: בְּנַחֲלָה
  choice: சுதந்தரமாக
  rationale: נחלה என்பது தலைமுறை உரிமையாகக் கிடைக்கும் நில உடைமையைக் குறிக்கிறது; ‘சுதந்தரம்’ அந்த உடன்படிக்கை-நிலப் பொருளைத் தக்கவைக்கிறது.
- source_word: לְשִׁבְטֵיכֶם
  choice: உங்கள் கோத்திரங்களுக்கு
  rationale: לְ இங்கு பங்கீட்டின் பெறுநர்களைக் குறிக்கிறது. ‘உங்கள் கோத்திரங்களுக்கு’ என்பது பொருளை நேரடியாகவும் இயல்பாகவும் தருகிறது.
- source_word: הַגּוֹיִם הַנִּשְׁאָרִים הָאֵלֶּה
  choice: எஞ்சியிருக்கும் இந்த நாடுகள்
  rationale: נִשְׁאָרִים என்ற பங்கேற்பு வினை, இன்னும் அங்கே மீந்துள்ள நாடுகளைக் குறிக்கிறது. வினைத்தன்மையை ‘எஞ்சியிருக்கும்’ தக்கவைக்கிறது.
- source_word: מִן הַיַּרְדֵּן ... וְהַיָּם הַגָּדוֹל
  choice: யோர்தான் முதல் ... பெரிய கடல் வரை
  rationale: எபிரெயத்தில் இரண்டாம் எல்லைக்கு முன் இணைப்புச்சொல் இருந்தாலும், சூழலில் இது நிலப்பரப்பின் இரு எல்லைகளைக் குறிக்கும் ‘முதல் ... வரை’ அமைப்பு.
- source_word: וְכָל הַגּוֹיִם אֲשֶׁר הִכְרַתִּי
  choice: நான் அழித்தொழித்த எல்லா நாடுகளையும்
  rationale: כרת இச்சூழலில் வெட்டி அகற்றுதல் என்ற உருவகத்தின் வழியாக அழித்தொழித்தலைக் குறிக்கிறது. ‘அழித்தொழித்த’ என்பது செய்பவரையும் தீர்ப்பின் தீவிரத்தையும் மறைக்காமல் இயல்பான தமிழில் தருகிறது.
- source_word: מְבוֹא הַשָּׁמֶשׁ
  choice: சூரியன் மறையும் திசை
  rationale: சொல்லுக்கு நெருக்கமாக ‘சூரியன் சென்று உட்புகுதல்’ என்ற மேற்கு/சூரிய மறைவு மரபுத்தொடர். ‘சூரியன் மறையும் திசை’ அதன் காட்சியுருவைத் தக்கவைத்து புரிதலையும் அளிக்கிறது.
theological_decisions:
- issue: நாடுகளைச் சுதந்தரமாகப் பங்கிடுதல்
  choice: ‘நாடுகளையும் ... சுதந்தரமாகப் பங்கிட்டுக் கொடுத்திருக்கிறேன்’ என்று மூலத்தின் வெளிப்பாட்டைத் தக்கவைத்தல்
  alternative: ‘அந்த நாடுகளின் நிலங்களைச் சுதந்தரமாகப் பங்கிட்டேன்’ என்று விளக்குதல்
  rationale: மூல எபிரெயம் நேரடியாக ‘நாடுகள்’ என்கிறது; ‘நிலங்கள்’ என்பதைச் சேர்ப்பது பொருளை விளக்கினாலும் மூலத்திலுள்ள சொல்லாட்சி மற்றும் அதன் சாத்தியமான பரப்பைச் சுருக்கும்.
- issue: כרת என்ற தீர்ப்பு மொழியின் வலிமை
  choice: அழித்தொழித்த
  alternative: அகற்றிய
  rationale: மென்மையான ‘அகற்றிய’ என்பது மூலத்தில் உள்ள அழிவு/துண்டித்தல் வலிமையைக் குறைக்கும்; எனவே செயலும் அதன் தீவிரமும் வெளிப்படையாக வைக்கப்பட்டன.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையுடன் மொழிபெயர்க்கப்பட்டது. நிலப்பங்கீட்டுச் சூழலுக்கேற்ற ‘பங்கிட்டுக் கொடுத்திருக்கிறேன்’ பயன்படுத்தப்பட்டது; ‘சூரியன் மறையும் திசை’ என்ற எபிரெய உருவகம் அடிக்குறிப்பு விளக்கத்துடன் தக்கவைக்கப்பட்டது.
