source:
  edition: WLC
  text: אִישׁ אֶחָ֥ד מִ/כֶּ֖ם יִרְדָּף אָ֑לֶף כִּ֣י יְהוָ֣ה אֱלֹהֵי/כֶ֗ם ה֚וּא הַ/נִּלְחָ֣ם לָ/כֶ֔ם כַּ/אֲשֶׁ֖ר דִּבֶּ֥ר לָ/כֶֽם־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/023/010.yaml
  text: One man from among you will chase a thousand[a], because Yahweh your God is the one who fights for you[c][b], just as he spoke to you.
translation:
  language: ta
  text: உங்களில் ஒருவன் ஆயிரம் பேரைத் துரத்துவான்[a]; ஏனெனில், உங்கள் கடவுளாகிய யாவே[b], அவர் உங்களிடம் சொன்னபடியே[c], உங்களுக்காகப் போரிடுபவர் அவரே.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஆயிரம் பேரைப் பின்தொடர்வான்.”
    reason: lexical_alternative
  - marker: b
    text: “யாவே” என்பது எபிரெய மொழியிலுள்ள YHWH என்ற இறைப் பெயரின் ஒலிபெயர்ப்பு; பல மொழிபெயர்ப்புகள் இதை “கர்த்தர்” என்று வழங்குகின்றன.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, “அவர் உங்களுக்கு வாக்குக் கொடுத்தபடியே.” எபிரெயில் இன்னும் நேரடியாக, “அவர் உங்களிடம் பேசியபடியே.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ אֶחָד מִכֶּם
  choice: உங்களில் ஒருவன்
  rationale: எபிரெயச் சொல்லின் ஒருமை ஆண்பால் வடிவையும், குழுவிலிருந்து ஒருவன் என்ற பகுதி சார்ந்த பொருளையும் இயல்பான தமிழில் காக்கிறது.
- source_word: יִרְדָּף
  choice: துரத்துவான்
  rationale: רדף என்பதன் போர்ச் சூழலுக்குரிய ‘துரத்து/பின்தொடர்’ என்ற பொருளைத் தெளிவாகவும் உயிரோட்டமாகவும் தருகிறது.
- source_word: אָלֶף
  choice: ஆயிரம் பேரை
  rationale: மனித எதிரிகளைக் குறிக்கும் மறைமுகப் பொருளைத் தமிழில் தெளிவுபடுத்த ‘பேர்’ சேர்க்கப்பட்டுள்ளது; எண்ணின் வலிமை அப்படியே காக்கப்படுகிறது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: ஒருவன் ஆயிரம் பேரைத் துரத்துவதற்கான காரணத்தை அறிமுகப்படுத்தும் காரணவியல் இணைப்பாக உள்ளது.
- source_word: יְהוָה אֱלֹהֵיכֶם
  choice: உங்கள் கடவுளாகிய யாவே
  rationale: உடன்படிக்கைப் பெயரான יהוה-ஐ ‘யாவே’ என ஒலிபெயர்த்து, אֱלֹהֵיכֶם என்பதைக் ‘உங்கள் கடவுள்’ என நேரடியாக வழங்குகிறது.
- source_word: הוּא הַנִּלְחָם לָכֶם
  choice: உங்களுக்காகப் போரிடுகிறவர்
  rationale: வலியுறுத்தும் הוּא மற்றும் பண்புசார் தொடர்ச்சியை உணர்த்தும் பங்கேற்பு வடிவம் ஆகியவற்றை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: כַּאֲשֶׁר דִּבֶּר לָכֶם
  choice: அவர் உங்களிடம் சொன்னபடியே
  rationale: דבר என்பதன் நேரடியான ‘பேசு/சொல்’ பொருளைக் காக்கிறது; சூழலில் உள்ள வாக்குறுதி நுணுக்கத்தை மொழிபெயர்ப்பில் கட்டாயமாக்கவில்லை.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரின் மொழியாக்கம்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் பட்டப்பெயர் அல்ல, நான்கு எழுத்துகளைக் கொண்ட தனிப்பட்ட இறைப் பெயர் உள்ளது; ஆகவே அதை ஒலிபெயர்ப்பாகக் காக்கிறது.
- issue: אִישׁ אֶחָד என்பதிலுள்ள ஆண்பால் பிரதிநிதித்துவ மொழி
  choice: ஒருவன்
  alternative: ஒருவர்
  rationale: மூலத்தின் ஒருமை ஆண்பால் வடிவைத் தக்கவைத்தபடியே நவீன தமிழில் இயல்பாக உள்ளது.
- issue: דִּבֶּר என்பதன் சூழல்சார் வாக்குறுதி நுணுக்கம்
  choice: சொன்னபடியே
  alternative: வாக்குக் கொடுத்தபடியே
  rationale: சூழல் வாக்குறுதியைக் குறிக்கலாம்; ஆயினும் எபிரெய வினை நேரடியாக ‘பேசினார்/சொன்னார்’ என்பதால் அந்தத் திறந்த தன்மை காக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டது. போர்ச் சூழல் நேரடியாக வைக்கப்பட்டுள்ளது; வாக்குறுதி என்ற விளக்கம் முதன்மை உரையில் திணிக்கப்படாமல் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
