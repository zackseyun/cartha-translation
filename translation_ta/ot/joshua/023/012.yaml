base_translation:
  language: en
  yaml_path: translation/ot/joshua/023/012.yaml
  text: For if you indeed turn back and cling to the remnant of these nations[a], these that remain with you, and intermarry with them and go in to them, and they to you[b],
translation:
  language: ta
  text: ஏனெனில், நீங்கள் உண்மையாகவே பின்வாங்கி, இந்த மக்களினங்களின் மீதமுள்ளவர்களாகிய உங்களுடன் எஞ்சியிருப்பவர்களோடு பற்றிக்கொண்டு[a], அவர்களோடு திருமண உறவுகளை ஏற்படுத்திக்கொண்டு, அவர்களோடு உறவாடி, அவர்களும் உங்களோடு உறவாடினால்[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்களோடு நெருக்கமாக இணைந்துகொண்டு.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அவர்களிடையே சென்று, அவர்களும் உங்களிடையே வந்தால்” / “அவர்களோடு தொடர்புகொண்டு, அவர்களும் உங்களோடு தொடர்புகொண்டால்.” எபிரெய மரபுத்தொடர் வெறும் உடல்சார் இடமாற்றத்தைவிட விரிவான பொருளுடையது.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  choice: ஏனெனில், ... என்றால்
  rationale: முந்தைய வசனத்தின் எச்சரிக்கையைத் தொடர்ந்து, விளைவைக் கூறும் அடுத்த வசனத்துக்கான நிபந்தனையை அறிமுகப்படுத்துகிறது. ‘ஏனெனில்’ இணைப்பையும் ‘என்றால்’ நிபந்தனையையும் இயல்பான தமிழில் வெளிப்படுத்துகின்றன.
- source_word: שׁוֹב תָּשׁוּבוּ
  choice: உண்மையாகவே பின்வாங்கி
  rationale: வினையெச்ச முழுவடிவமும் வினைமுற்றும் சேர்ந்த எபிரெய அமைப்பு செயலை வலியுறுத்துகிறது. ‘உண்மையாகவே’ அந்த வலியுறுத்தலைக் காக்கிறது; ‘பின்வாங்கி’ என்பது உடன்படிக்கை உண்மைத்தன்மையிலிருந்து விலகுவதைச் சூழலுக்கேற்றபடி காட்டுகிறது.
- source_word: וּדְבַקְתֶּם
  choice: ஒட்டிக்கொண்டு
  rationale: דבק நெருக்கமாகப் பற்றிக்கொள்வதையும் இணைந்திருப்பதையும் குறிக்கிறது. ‘ஒட்டிக்கொண்டு’ அதன் வலுவான உறவுசார் பொருளை இயல்பாகத் தருகிறது.
- source_word: בְּיֶתֶר הַגּוֹיִם הָאֵלֶּה
  choice: இந்த இனங்களில் மீதியானவர்களோடு
  rationale: יֶתֶר என்பது எஞ்சிய பகுதியைக் குறிக்கிறது. தமிழில் ‘மீதியானவர்கள்’ என்பது இங்கு தப்பியிருந்து இன்னும் நாட்டில் உள்ள இனக்குழுக்களைத் தெளிவாகச் சுட்டுகிறது; ‘மீதியானோர்’ என்ற சொல்லுக்கு வேறு இடங்களில் இருக்கக்கூடிய நேர்மறை இறையியல் நுட்பத்தை இங்கு திணிக்கவில்லை.
- source_word: הַנִּשְׁאָרִים הָאֵלֶּה אִתְּכֶם
  choice: உங்களுடன் எஞ்சியிருக்கும்
  rationale: முன்னர் குறிப்பிடப்பட்ட இனங்களில் இன்னும் இஸ்ரவேலருடன் இருப்பவர்களைப் பங்கேற்பு வடிவம் மேலும் வரையறுக்கிறது. தமிழில் தேவையற்ற சுட்டுப்பெயர் இரட்டிப்பைத் தவிர்த்தும் அதே தகவலைப் பாதுகாக்கிறது.
- source_word: וְהִתְחַתַּנְתֶּם בָּהֶם
  choice: அவர்களோடு கலப்புமணம் செய்துகொண்டு
  rationale: חתן என்பதன் பரஸ்பர வினைவடிவம் திருமண உறவுகளை ஏற்படுத்துவதைக் குறிக்கிறது. ‘கலப்புமணம்’ வெவ்வேறு இனக்குழுக்களுக்கிடையேயான திருமணத்தைச் சுருக்கமாகவும் தெளிவாகவும் தெரிவிக்கிறது.
- source_word: וּבָאתֶם בָּהֶם
  choice: அவர்களோடு உறவாடி
  rationale: בוא ב என்ற எபிரெய மரபுத்தொடர் வெறும் இடமாற்றத்தைவிட விரிவான தொடர்பு, பழக்கம், சமூகக் கலப்பு ஆகியவற்றைக் குறிக்கக்கூடும். திருமணம் ஏற்கெனவே தனியே சொல்லப்பட்டுள்ளதால், ‘உறவாடி’ அதன் விரிவைத் தக்கவைக்கிறது; அதை பாலுறவுக்கான குறிப்பாக மட்டும் சுருக்குவதில்லை.
- source_word: וְהֵם בָּכֶם
  choice: அவர்களும் உங்களோடு உறவாடினால்
  rationale: சுருக்கமான எபிரெய இணை வாக்கியம் முந்தைய செயலைப் பரஸ்பரமாக்குகிறது. தமிழில் வினையை மீண்டும் கூறுவது பொருளைத் தெளிவாக்குகிறது; ‘அவர்களும்’ பரஸ்பரத் தன்மையைப் பாதுகாக்கிறது.
theological_decisions:
- issue: שׁוֹב תָּשׁוּבוּ என்பதிலுள்ள உடன்படிக்கை எச்சரிக்கை
  choice: பின்வாங்கி
  alternative: திரும்பி
  rationale: சூழலில் இது நடுநிலையான திரும்புதலை அல்ல, ஆண்டவருக்கான உண்மைத்தன்மையிலிருந்து விலகி எஞ்சிய இனங்களோடு இணைவதைக் குறிக்கிறது. ஆகவே ‘பின்வாங்கி’ எதிர்மறையான திசைமாற்றத்தை வெளிப்படுத்துகிறது; ஆனால் உள்ளார்ந்த நோக்கத்தை வசனத்திற்கு அப்பாற்பட்டு வரையறுப்பதில்லை.
- issue: יֶתֶר என்பதற்கு இறையியல் பொருளை மிகையாக ஏற்றுதல்
  choice: மீதியானவர்கள்
  alternative: மீதமுள்ளவர்கள்
  rationale: இங்கு சொல் எளிமையாக எஞ்சியுள்ள இனத்தாரைக் குறிக்கிறது. வேறு சூழல்களில் ‘மீதியானோர்’ பெறக்கூடிய மீட்புசார் சிறப்புப் பொருளை இந்த வசனத்தில் சேர்க்காமல், அடிப்படைச் சொற்பொருளே காக்கப்படுகிறது.
- issue: וּבָאתֶם בָּהֶם என்பதைக் பாலுறவாக மட்டும் குறுக்குதல்
  choice: உறவாடி
  alternative: அவர்களிடையே சென்று / அவர்களோடு தொடர்புகொண்டு
  rationale: எபிரெய மரபுத்தொடர் சமூகத் தொடர்பையும் பரஸ்பரக் கலப்பையும் உள்ளடக்கும் அளவு விரிவானது. முந்தைய சொற்றொடர் கலப்புமணத்தை ஏற்கெனவே குறிப்பிடுவதால், பாலியல் நயப்பொருளை மட்டும் தேர்ந்தெடுப்பது தேவையற்ற விளக்கத் தீர்மானமாகிவிடும்.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான எச்சரிக்கை நடையைப் பயன்படுத்துகிறது. இது அடுத்த வசனத்தில் நிறைவடையும் நிபந்தனை வாக்கியம் என்பதால் இறுதியில் காற்புள்ளி வைக்கப்பட்டுள்ளது. ‘இனம்’ என்பது இங்கு அரசியல்-இனக்குழுக்களைக் குறிக்கிறது; ‘உறவாடி’ என்பது மூலத்தின் திட்டமிட்ட விரிவையும் பரஸ்பரத் தன்மையையும் காக்கிறது.
