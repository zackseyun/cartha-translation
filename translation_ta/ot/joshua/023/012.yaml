revisions:
- from: ஏனெனில், நீங்கள் உண்மையாகவே பின்வாங்கி, உங்களுடன் எஞ்சியிருக்கும் இந்த இனங்களில் மீதியானவர்களோடு ஒட்டிக்கொண்டு[a], அவர்களோடு கலப்புமணம் செய்துகொண்டு, அவர்களோடு உறவாடி, அவர்களும் உங்களோடு உறவாடினால்[b],
  to: ஏனெனில், நீங்கள் உண்மையாகவே பின்வாங்கி, இந்த மக்களினங்களின் மீதமுள்ளவர்களாகிய உங்களுடன் எஞ்சியிருப்பவர்களோடு பற்றிக்கொண்டு[a], அவர்களோடு திருமண உறவுகளை ஏற்படுத்திக்கொண்டு, அவர்களோடு உறவாடி, அவர்களும் உங்களோடு உறவாடினால்[b],
  rationale: The revision keeps the source’s conditional and unfinished syntax, restores the explicit relation between the two descriptions of the surviving nations, and uses idiomatic modern Tamil for close attachment and intermarriage. It retains “உறவாடி” because the idiom following the explicit marriage clause can denote broader reciprocal association and should not be narrowed to a sexual euphemism or mere physical movement.
