base_translation:
  language: en
  yaml_path: translation/ot/joshua/023/013.yaml
  text: know for certain that Yahweh your God will no longer drive out these nations from before you[a], but they will become for you a trap and a snare, a scourge on your sides and thorns in your eyes[b], until you perish from off this good land that Yahweh your God has given you.
translation:
  language: ta
  text: 'நீங்கள் உறுதியாக அறிந்துகொள்ளுங்கள்: உங்கள் கடவுளாகிய யாவே இனி இந்த மக்களினங்களை உங்கள் முன்னிலையிலிருந்து துரத்திவிட மாட்டார். அவர்கள் உங்களுக்குக் கண்ணியாகவும் பொறியாகவும், உங்கள் விலாப் புறங்களில் சாட்டையாகவும்[a], உங்கள் கண்களில் முட்களாகவும் இருப்பார்கள்; உங்கள் கடவுளாகிய யாவே உங்களுக்குக் கொடுத்த இந்த நல்ல நிலத்திலிருந்து நீங்கள் அழிந்துபோகும்வரை.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “சாட்டை” என்று மொழிபெயர்க்கப்பட்டுள்ள எபிரேயச் சொல் அரிதானது; “உங்கள் விலாப் புறங்களில் வேதனை தரும் துன்பம்” என்றும் பொருள்கொள்ளலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָדוֹעַ תֵּדְעוּ
  choice: நீங்கள் உறுதியாக அறிந்துகொள்ளுங்கள்
  rationale: ידע என்பதன் வினையெச்ச முழுவடிவமும் வினைமுற்றும் இணைந்து தரும் வலியுறுத்தலை, இயல்பான நவீனத் தமிழில் ‘உறுதியாக’ என்பதன் மூலம் வெளிப்படுத்துகிறது.
- source_word: לֹא יוֹסִיף ... לְהוֹרִישׁ
  choice: இனி ... துரத்திவிட மாட்டார்
  rationale: יסף உடன் வரும் வினையெச்சம் முன்பு நடந்த செயல் இனி தொடராது என்பதைக் குறிக்கிறது; மக்களினங்களைப் பற்றிய வேற்றுமைச் சூழலில் הוריש என்பது அவர்களை வெளியேற்றுதல் அல்லது துரத்துதல் என்ற பொருளுடையது.
- source_word: מִלִּפְנֵיכֶם
  choice: உங்கள் முன்னிலையிலிருந்து
  rationale: எபிரேய இடவியல் உருவகத்தைப் பாதுகாத்தபடியே தமிழில் தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: לְפַח וּלְמוֹקֵשׁ
  choice: கண்ணியாகவும் பொறியாகவும்
  rationale: அடுத்தடுத்து வரும் இரு பிடிக்கும் கருவிகளின் உருவகங்களையும் ஒரே சொல்லாகச் சுருக்காமல் வேறுபடுத்திப் பாதுகாக்கிறது.
- source_word: לְשֹׁטֵט בְּצִדֵּיכֶם
  choice: உங்கள் விலாப்புறங்களில் சாட்டையாகவும்
  rationale: שֹׁטֵט அரிதானதும் பொருள் உறுதியாகாததுமான சொல். துன்புறுத்தும் அல்லது அடிக்கும் கருவி என்ற பாரம்பரியப் புரிதலை உடல்சார்ந்த உருவகத்துடன் பாதுகாக்கிறது; ஐயப்பாடு அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
- source_word: לִצְנִנִים בְּעֵינֵיכֶם
  choice: உங்கள் கண்களில் முட்களாகவும்
  rationale: கூர்மையான, தொடர்ந்து வேதனை தரும் பொருளின் உருவகத்தை நேரடியாகவும் புரியத்தக்க விதத்திலும் தருகிறது.
- source_word: עַד אֲבָדְכֶם מֵעַל הָאֲדָמָה הַטּוֹבָה הַזֹּאת
  choice: இந்த நல்ல நிலத்திலிருந்து நீங்கள் அழிந்துபோகும்வரை
  rationale: அச்சுறுத்தப்பட்ட விளைவின் இறுதி எல்லையையும், கடவுள் கொடுத்த நிலத்திலிருந்து நீக்கப்படுவதையும் தெளிவாகப் பாதுகாக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரேய நான்கெழுத்துத் திருப்பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் அதன் தனிப்பெயர் ஒலிப்பெயர்ப்பாக வழங்குகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூலத்தில் ஒரு பட்டம் அல்ல, இஸ்ரவேலின் கடவுளுடைய தனிப்பெயரே உள்ளது; எனவே அதனை ஒலிப்பெயர்ப்பாகப் பாதுகாக்கிறது.
- issue: எச்சரிக்கையின் இயல்பு
  choice: யாவே மக்களினங்களைத் தொடர்ந்து துரத்தாமல் இருப்பதும், அவர்கள் இஸ்ரவேலுக்குத் துன்பமாகி இறுதியில் கொடுக்கப்பட்ட நிலத்திலிருந்து இஸ்ரவேல் அழிந்துபோவதும்
  alternative: உடன்படிக்கைச் சார்பற்ற ஒரு சாதாரண இராணுவ முன்னறிவிப்பு
  rationale: இறைவனின் செயல் நிறுத்தப்படுதல், மக்களினங்களால் வரும் துன்பம், கொடுக்கப்பட்ட நல்ல நிலத்தை இழத்தல் ஆகியவற்றை வசனத்தின் தொடரமைப்பு நேரடியாக இணைக்கிறது; அதற்கு அப்பாற்பட்ட விளக்கத்தை மொழிபெயர்ப்பு சேர்க்கவில்லை.
- issue: שֹׁטֵט என்ற அரிய சொல்லின் பொருள்
  choice: சாட்டை
  alternative: வேதனை தரும் துன்பம் அல்லது விலாப்புறங்களில் குத்தும் முள்
  rationale: சொல்லின் துல்லியமான குறிப்பு உறுதியில்லை. உடல்ரீதியான வேதனையின் இணை உருவகத்தை முதன்மை உரை காக்கிறது; மாற்றுப் புரிதல் அடிக்குறிப்பில் திறந்துவைக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் வேதாகம எச்சரிக்கைக்கு ஏற்ற கண்ணியமான தொனியிலும் வடிவமைக்கப்பட்டது. ‘மக்களினங்கள்’ என்பது גּוֹיִם என்பதைக் தற்போதைய அரசியல் நாடுகளாகத் தவறாகப் புரிந்துகொள்வதைத் தவிர்க்கிறது. எபிரேய மொழியின் உடல்சார்ந்த உருவகங்கள் சீராக்கப்படாமல் பாதுகாக்கப்பட்டுள்ளன.
