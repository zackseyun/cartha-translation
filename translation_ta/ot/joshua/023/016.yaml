revisions:
- from: உங்கள் கடவுளாகிய யாவே உங்களுக்குக் கட்டளையிட்ட அவரது உடன்படிக்கையை நீங்கள் மீறி[a], வேறு தெய்வங்களைப் பின்பற்றிச் சென்று அவற்றுக்குப் பணிவிடை செய்து, அவற்றின் முன் பணிந்து வணங்கினால், யாவேயின் கோபம் உங்களுக்கு எதிராகப் பற்றியெரியும்; அவர் உங்களுக்குக் கொடுத்த இந்த நல்ல நாட்டிலிருந்து நீங்கள் விரைவில் அழிந்துபோவீர்கள்[b].
  to: உங்கள் கடவுளாகிய யாவே உங்களுக்குக் கட்டளையிட்ட உடன்படிக்கையை நீங்கள் மீறி[a], வேறு தெய்வங்களிடம் சென்று அவற்றுக்குப் பணிவிடை செய்து அவற்றை வணங்கினால், யாவேயின் கோபம் உங்களுக்கு எதிராகப் பற்றியெரியும்; அவர் உங்களுக்குக் கொடுத்த நல்ல நாட்டிலிருந்து நீங்கள் விரைவில் அழிந்துபோவீர்கள்[b].
  rationale: The revision removes two nonessential additions while preserving the Hebrew conditional syntax and the distinction between serving other gods and bowing to them. It retains the warning's force and the land-removal nuance reflected in the footnote.
