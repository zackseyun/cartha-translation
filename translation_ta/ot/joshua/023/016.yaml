  text: בְּ֠/עָבְרְ/כֶם אֶת בְּרִ֨ית יְהוָ֥ה אֱלֹהֵי/כֶם֮ אֲשֶׁ֣ר צִוָּ֣ה אֶתְ/כֶם֒ וַ/הֲלַכְתֶּ֗ם וַ/עֲבַדְתֶּם֙ אֱלֹהִ֣ים אֲחֵרִ֔ים וְ/הִשְׁתַּחֲוִיתֶ֖ם לָ/הֶ֑ם וְ/חָרָ֤ה אַף יְהוָה֙ בָּ/כֶ֔ם וַ/אֲבַדְתֶּ֣ם מְהֵרָ֔ה מֵ/עַל֙ הָ/אָ֣רֶץ הַ/טּוֹבָ֔ה אֲשֶׁ֖ר נָתַ֥ן לָ/כֶֽם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/023/016.yaml
  text: If you transgress the covenant of Yahweh your God[a], which he commanded you, and go and serve other gods and bow down to them, then the anger of Yahweh will burn against you[b], and you will perish quickly from the good land that he has given you.
translation:
  language: ta
  text: உங்கள் கடவுளாகிய யாவே உங்களுக்குக் கட்டளையிட்ட உடன்படிக்கையை நீங்கள் மீறி[a], வேறு தெய்வங்களிடம் சென்று அவற்றுக்குப் பணிவிடை செய்து அவற்றை வணங்கினால், யாவேயின் கோபம் உங்களுக்கு எதிராகப் பற்றியெரியும்; அவர் உங்களுக்குக் கொடுத்த நல்ல நாட்டிலிருந்து நீங்கள் விரைவில் அழிந்துபோவீர்கள்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உடன்படிக்கையை நீங்கள் மீறும்போது.” எபிரெயத் தொடக்கத்தை நிபந்தனையாகவும் (“மீறினால்”), காலவியல் பொருளிலும் (“மீறும்போது”) புரிந்துகொள்ளலாம்.
    reason: alternative_reading
  - marker: b
    text: எபிரெயத்தில், “நல்ல நாட்டின் மேலிருந்து”; யாவே கொடுத்த நாட்டிலிருந்து அவர்கள் அகற்றப்படுவதை இச்சொற்றொடர் வலியுறுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּעָבְרְכֶם
  choice: நீங்கள் மீறி ... வணங்கினால்
  rationale: ב plus infinitive construct இங்கு எச்சரிக்கையின் நிபந்தனைச் சூழலைக் குறிக்கிறது. עבר ברית என்பது உடன்படிக்கையை ‘மீறுதல்’ என்ற மரபுத்தொடர்; தமிழில் இயல்பான நிபந்தனை வாக்கியமாக இறுதியில் ‘-னால்’ கொண்டு வடிவமைக்கப்பட்டது.
- source_word: בְּרִית
  choice: உடன்படிக்கை
  rationale: இஸ்ரவேலுக்கும் யாவேக்கும் இடையிலான சட்டப்பூர்வமும் உறவுசார் தன்மையும் கொண்ட ஏற்பாட்டின் நிறையைப் பாதுகாக்கும் நிலையான தமிழ் சொல்.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரை ஒரு பட்டப்பெயரால் மாற்றாமல், எபிரெய நான்கெழுத்துப் பெயரின் பரவலாக ஏற்கப்பட்ட தமிழ் ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: אֱלֹהֵיכֶם
  choice: உங்கள் கடவுள்
  rationale: யாவே என்ற ஒருமை உடன்படிக்கைச் சூழலில் אֱלֹהִים ஒருமைப் பொருளில் ‘கடவுள்’ என்று அமைகிறது.
- source_word: אֲשֶׁר צִוָּה אֶתְכֶם
  choice: உங்களுக்குக் கட்டளையிட்ட
  rationale: உறவுப்பெயர் வாக்கியத்தைச் சுருக்கமான இயல்பான தமிழில் தருகிறது; மூலத்தில் இல்லாத ‘கைக்கொள்ளும்படி’ போன்ற விளக்கத்தைச் சேர்க்கவில்லை.
- source_word: וַהֲלַכְתֶּם וַעֲבַדְתֶּם
  choice: பின்பற்றிச் சென்று ... பணிவிடை செய்து
  rationale: ‘சென்று பணிவிடை செய்தல்’ என்ற இயக்கத்தையும் மதச்சார்ந்த சேவையையும் காக்கிறது. தமிழில் தனியே ‘சென்று’ என்பது நோக்கம் தெளிவின்றி இருப்பதால் ‘பின்பற்றிச்’ சேர்க்கப்பட்டுள்ளது; அடுத்துள்ள பணிந்து வணங்குதல் என்ற வினையிலிருந்து வேறுபாடும் காக்கப்படுகிறது.
- source_word: אֱלֹהִים אֲחֵרִים
  choice: வேறு தெய்வங்கள்
  rationale: போட்டி வழிபாட்டுக்குரிய பிற தெய்வங்களைக் குறிக்கும் வழக்கமான சொற்றொடரின் நேரான தமிழ் வடிவம்.
- source_word: וְהִשְׁתַּחֲוִיתֶם לָהֶם
  choice: அவற்றின் முன் பணிந்து வணங்கினால்
  rationale: வினை குறிக்கும் உடலைத் தாழ்த்திப் பணிதல் என்னும் செயலை வெளிப்படுத்துகிறது; முந்தைய ‘பணிவிடை’ என்பதோடு ஒன்றாக்கவில்லை.
- source_word: וְחָרָה אַף יְהוָה בָּכֶם
  choice: யாவேயின் கோபம் உங்களுக்கு எதிராகப் பற்றியெரியும்
  rationale: חרה אף என்னும் ‘கோபம் பற்றியெரிதல்’ உருவகத்தையும் அதன் தீவிரத்தையும் இயல்பான தமிழில் காக்கிறது.
- source_word: וַאֲבַדְתֶּם מְהֵרָה מֵעַל הָאָרֶץ הַטּוֹבָה
  choice: இந்த நல்ல நாட்டிலிருந்து நீங்கள் விரைவில் அழிந்துபோவீர்கள்
  rationale: אבד என்பதின் அழிவு/ஒழிந்துபோதல் கருத்தையும், מֵעַל மூலம் நாட்டிலிருந்து அகற்றப்படுதல் வலியுறுத்தப்படுவதையும் இணைக்கிறது. அருகிலுள்ள உரையாடல் சூழலுக்கேற்ப definite article ‘இந்த’ என இயல்பாக்கப்பட்டது.
- source_word: אֲשֶׁר נָתַן לָכֶם
  choice: அவர் உங்களுக்குக் கொடுத்த
  rationale: யாவே முன்பே வழங்கிய நாட்டைத் தெளிவாகக் குறிக்கும் நேரான மொழிபெயர்ப்பு.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயர்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் தனிப்பட்ட உடன்படிக்கைப் பெயர் நேரடியாக உள்ளது; அதை ஒரு பட்டப்பெயரால் மாற்றாமல் ஒலிபெயர்ப்பது மூல வேறுபாட்டைக் காக்கிறது.
- issue: உடன்படிக்கை எச்சரிக்கையின் தொடக்க அமைப்பு
  choice: 'நிபந்தனை: ‘மீறி ... வணங்கினால்’'
  alternative: 'காலவியல்/நிச்சயத்தன்மை: ‘மீறும்போது’'
  rationale: בְּעָבְרְכֶם என்பது ‘மீறும்போது’ என்றும் ‘மீறினால்’ என்றும் புரிந்துகொள்ளப்படலாம். அறிவுறுத்தல் சார்ந்த இச்சூழலில் எச்சரிக்கையின் நிபந்தனை வலிமையை ‘-னால்’ நன்றாக வெளிப்படுத்துகிறது; மாற்று வாசிப்பு அடிக்குறிப்பில் காக்கப்படுகிறது.
- issue: אבד மற்றும் நாட்டிலிருந்து அகற்றப்படுதல்
  choice: ‘நாட்டிலிருந்து ... அழிந்துபோவீர்கள்’
  alternative: ‘நாட்டிலிருந்து அகற்றப்படுவீர்கள்’
  rationale: மூல வினையின் அழிவு சார்ந்த வலிமையையும் מֵעַל குறிக்கும் நாட்டை இழத்தலையும் ஒன்றாகக் காக்கிறது; வெறும் நாடுகடத்தலாக மட்டும் குறுக்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகருக்குப் புரியும் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. ‘யாவே’ தெய்வீகப் பெயராகவும், ‘உடன்படிக்கை’, ‘பணிவிடை’, ‘பணிந்து வணங்குதல்’ ஆகியவை தனித்த மூலக் கருத்துகளைப் பாதுகாக்கவும் பயன்படுத்தப்பட்டுள்ளன. நீண்ட எபிரெய நிபந்தனைத் தொடரை தமிழின் இயல்புக்கேற்ப ‘-னால்’ என முடித்துள்ளோம்.
