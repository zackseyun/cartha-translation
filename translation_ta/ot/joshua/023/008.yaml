source:
  edition: WLC
  text: כִּ֛י אִם בַּ/יהוָ֥ה אֱלֹהֵי/כֶ֖ם תִּדְבָּ֑קוּ כַּ/אֲשֶׁ֣ר עֲשִׂיתֶ֔ם עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/023/008.yaml
  text: But you shall cling to Yahweh your God[a], just as you have done to this day.
translation:
  language: ta
  text: மாறாக, இந்நாள்வரை நீங்கள் செய்துவந்ததுபோலவே, உங்கள் கடவுளாகிய யாவேவை உறுதியாகப் பற்றிக்கொண்டிருங்கள்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “பற்றிக்கொண்டிருங்கள்” என்பதை “விடாமல் பிடித்துக்கொண்டிருங்கள்” என்றும் மொழிபெயர்க்கலாம்; எபிரெய வினை நெருக்கமான, உடன்படிக்கைச் சார்ந்த பற்றுறுதியைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  choice: மாறாக
  rationale: முந்தைய எச்சரிக்கைக்கு எதிரான வலுவான வேறுபாட்டை இச்சொற்றொடர் காட்டுகிறது; இங்கு இது நிபந்தனையைக் குறிக்கவில்லை.
- source_word: בַּיהוָה אֱלֹהֵיכֶם
  choice: உங்கள் கடவுளாகிய யாவேவை
  rationale: דבק வினையுடன் வரும் ב, பற்றிக்கொள்ளப்படும் நபரைக் குறிக்கிறது. யாவே என்பது உடன்படிக்கையின் தனிப்பெயர்; אֱלֹהֵיכֶם என்பது ஒருமைப் பொருளில் ‘உங்கள் கடவுள்’ எனக் கொள்ளப்படுகிறது.
- source_word: תִּדְבָּקוּ
  choice: உறுதியாகப் பற்றிக்கொண்டிருங்கள்
  rationale: דבק நெருக்கமான, நிலையான பற்றுறுதியைக் குறிக்கிறது. தமிழ் வினைவடிவம் தொடர்ந்த செயலை வலியுறுத்தும் அறிவுறுத்தலாக இயல்பாக அமைகிறது; ‘உறுதியாக’ என்பது உடன்படிக்கைச் சார்ந்த நிலைப்பாட்டை வெளிப்படுத்துகிறது.
- source_word: כַּאֲשֶׁר עֲשִׂיתֶם
  choice: நீங்கள் செய்துவந்ததுபோலவே
  rationale: கடந்த காலத்திலிருந்து பேச்சு நடைபெறும் காலம் வரை தொடர்ந்த அவர்களுடைய நடத்தையோடு ஒப்பிடுவதை இவ்வடிவம் வெளிப்படுத்துகிறது.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: இந்நாள்வரை
  rationale: பேசப்படும் தற்போதைய நாள் வரையிலான தொடர்ச்சியைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற உடன்படிக்கைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலவசனத்தில் பட்டப்பெயர் அல்ல, கடவுளின் தனிப்பெயரான நான்கெழுத்துப் பெயர் நேரடியாக உள்ளது. ஆகவே அதை ஒரு பட்டப்பெயரால் மாற்றாமல் தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளது.
- issue: דבק என்பதன் உடன்படிக்கைச் சார்ந்த கருத்து
  choice: உறுதியாகப் பற்றிக்கொண்டிருங்கள்
  alternative: விட்டுவிலகாதிருங்கள்
  rationale: மூலவினை வெறும் பிரியாமையை மட்டுமல்லாமல் நெருக்கமான, செயற்பாட்டுள்ள பற்றுறுதியையும் குறிக்கிறது; எனவே அதன் உறவுசார் வலிமை பாதுகாக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான அறிவுறுத்தல் நடை பயன்படுத்தப்பட்டுள்ளது. ‘யாவே’ தனிப்பெயராக ஒலிபெயர்க்கப்பட்டுள்ளது; ‘உறுதியாகப் பற்றிக்கொண்டிருங்கள்’ என்பது மூலத்தின் உறவுசார் மற்றும் தொடர்ச்சியான வலிமையைத் தக்கவைக்கிறது.
