  source_fidelity: 'எபிரெய மூலத்தின் கட்டளைத் தொனியும் வலியுறுத்தலும் துல்லியமாகக் காக்கப்பட்டுள்ளன: וְנִשְׁמַרְתֶּם מְאֹד என்பதற்கு ‘மிகுந்த கவனத்துடன் இருங்கள்,’ நோக்கத்தை உணர்த்தும் לְאַהֲבָה என்பதற்கு ‘நேசிப்பதற்கு,’ மற்றும் உடன்படிக்கை உறவை உணர்த்தும் ‘உங்கள் கடவுளாகிய’ என்பதும் பொருத்தமானவை. לְנַפְשֹׁתֵיכֶם-இன் தற்சுட்டு/முழு-நபர் வலிமையைத் தனியான, இயல்பற்ற சொற்றொடராகக் கல்க் செய்யாமல் கட்டளையில் உள்ளடக்கியிருப்பது ஆங்கில POB தீர்மானத்துடனும் மூலத்தின் பொருளுடனும் ஒத்துப்போகிறது.'
