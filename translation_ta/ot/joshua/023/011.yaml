  text: וְ/נִשְׁמַרְתֶּ֥ם מְאֹ֖ד לְ/נַפְשֹֽׁתֵי/כֶ֑ם לְ/אַהֲבָ֖ה אֶת יְהוָ֥ה אֱלֹהֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/023/011.yaml
  text: Therefore, take great care to love Yahweh your God.
translation:
  language: ta
  text: ஆகவே, உங்கள் கடவுளாகிய யாவேவை நேசிப்பதற்கு மிகுந்த கவனத்துடன் இருங்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְנִשְׁמַרְתֶּם
  choice: ஆகவே, ... மிகுந்த கவனத்துடன் இருங்கள்
  rationale: וְ־ இங்குள்ள முந்தைய அறிவுறுத்தலின் முடிவைத் தொடரும் விளைவுச் சார்பை உணர்த்துகிறது; נשׁמר என்ற வினை விழிப்புடன் தங்களைக் காத்துக்கொள்ளும் கட்டளையைத் தருகிறது. தமிழில் இச்சூழலில் ‘கவனத்துடன் இருங்கள்’ இயல்பாக உள்ளது.
- source_word: מְאֹד
  choice: மிகுந்த
  rationale: கட்டளையின் தீவிரத்தை வலியுறுத்தும் מְאֹד, ‘கவனம்’ என்பதுடன் இயல்பாகச் சேரும் ‘மிகுந்த’ என்று வழங்கப்பட்டது.
- source_word: לְנַפְשֹׁתֵיכֶם
  choice: ‘கவனத்துடன் இருங்கள்’ என்பதில் உள்ளடக்கப்பட்டது
  rationale: נפשׁ இங்கு பிரித்தறியப்பட்ட ‘ஆன்மா’ என்பதைவிட முழு மனிதரைக் குறிக்கும் தற்சுட்டுப் பொருளுடைய சொற்றொடராக உள்ளது. தமிழில் ‘உங்களைக் குறித்து நீங்கள் மிகுந்த கவனத்துடன் இருங்கள்’ என்பது தேவையற்ற சுமையைக் கொடுப்பதால், அதன் தற்சுட்டு வலிமை கட்டளையிலேயே இயல்பாக உள்ளடக்கப்பட்டுள்ளது.
- source_word: לְאַהֲבָה
  choice: நேசிப்பதற்கு
  rationale: לְ உடன் வரும் வினையெச்ச வடிவம், தங்களைக் கவனமாகக் காத்துக்கொள்வதன் நோக்கம் யாவேவை நேசிப்பதே என்பதை வெளிப்படுத்துகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரான நான்கெழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் பரவலாகப் புரியக்கூடிய ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: אֱלֹהֵיכֶם
  choice: உங்கள் கடவுளாகிய
  rationale: இரண்டாம் நபர் பன்மை உரிமை விகுதி உடன்படிக்கை உறவை நேரடியாகக் காட்டுகிறது; ‘உங்கள் கடவுளாகிய’ என்பது யாவே என்ற பெயருடன் இயல்பாக இணைகிறது.
theological_decisions:
- issue: உடன்படிக்கை அறிவுறுத்தலில் לְנַפְשֹׁתֵיכֶם என்பதன் பொருள்
  choice: முழு நபரையும் குறிக்கும் தற்சுட்டுப் பொருளை ‘கவனத்துடன் இருங்கள்’ என்பதில் உள்ளடக்குதல்
  alternative: உங்கள் ஆத்துமாக்களுக்காக / உங்கள் உயிர்களுக்காக / உங்களையே
  rationale: எபிரெயச் சொற்றொடர் உடலிலிருந்து வேறுபட்ட ஓர் அசரீரியான கூறைத் தனியாகச் சுட்டவில்லை; இஸ்ரவேலர் தங்களையே விழிப்புடன் காத்து, யாவேவுக்கு அன்பில் நிலைத்திருக்க வேண்டும் என்பதே கருத்து. ஆகவே தேவையற்ற மனித இயல்பியல் கோட்பாட்டை இறக்குமதி செய்யாமல் முழு நபரைக் குறிக்கும் வலிமை பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன தரத் தமிழ்; தெளிவான, கண்ணியமான கட்டளை நடை. ‘ஆகவே’ உரையாடல் தொடர்பைத் தக்கவைக்கிறது. ‘யாவே’ தெய்வீகப் பெயராக ஒலிபெயர்க்கப்பட்டுள்ளது. மூலத்தில் இல்லாத விளக்கச் சொற்களோ சமயப் பிரிவுக்குரிய தனிச்சொற்களோ சேர்க்கப்படவில்லை.
