  text: וְ/הִנֵּ֨ה אָנֹכִ֤י הוֹלֵךְ֙ הַ/יּ֔וֹם בְּ/דֶ֖רֶךְ כָּל הָ/אָ֑רֶץ וִ/ידַעְתֶּ֞ם בְּ/כָל לְבַבְ/כֶ֣ם וּ/בְ/כָל נַפְשְׁ/כֶ֗ם כִּ֣י לֹֽא נָפַל֩ דָּבָ֨ר אֶחָ֜ד מִ/כֹּ֣ל הַ/דְּבָרִ֣ים הַ/טּוֹבִ֗ים אֲשֶׁ֨ר דִּבֶּ֜ר יְהוָ֤ה אֱלֹהֵי/כֶם֙ עֲלֵי/כֶ֔ם הַ/כֹּל֙ בָּ֣אוּ לָ/כֶ֔ם לֹֽא נָפַ֥ל מִמֶּ֖/נּוּ דָּבָ֥ר אֶחָֽד־־־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/023/014.yaml
  text: And behold[a], today I am going the way of all the earth, and you know with all your heart and with all your soul that not one word has fallen from all the good words that Yahweh your God spoke concerning you. All of them have come to you[b]; not one word from them has fallen.
translation:
  language: ta
  text: இதோ, இன்று நான் பூமியிலுள்ள அனைவரும் செல்லும் வழியில் செல்கிறேன்.[a] உங்கள் கடவுளாகிய யாவே உங்களைக் குறித்து உரைத்த நன்மையான வார்த்தைகள் அனைத்திலும் ஒன்றுகூட நிறைவேறாமல் போகவில்லை[b] என்பதை உங்கள் முழு இதயத்தாலும் முழு உயிராலும் நீங்கள் அறிந்திருக்கிறீர்கள். அவை அனைத்தும் உங்களுக்கு வந்தடைந்தன; அவற்றில் ஒன்றுகூட நிறைவேறாமல் போகவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘பூமியிலுள்ள அனைவரும் செல்லும் வழி’ என்பது எல்லா மனிதர்களுக்கும் பொதுவான முடிவாகிய மரணத்தைக் குறிக்கும் எபிரெய மொழிமரபு.
    reason: cultural_note
  - marker: b
    text: அல்லது, ‘ஒரு வார்த்தைகூட தவறிப்போகவில்லை.’ எபிரெய மூலத்தில் சொற்பட, ‘ஒரு வார்த்தைகூட விழவில்லை’ என்று உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: இதோ
  rationale: உரையின் தொடக்கத்தில் கவனத்தை ஈர்க்கும் சொல்லின் வலிமையையும் சூழலின் பெருமிதமான தொனியையும் இயல்பான நவீனத் தமிழில் காக்கிறது.
- source_word: אָנֹכִי הוֹלֵךְ הַיּוֹם בְּדֶרֶךְ כָּל הָאָרֶץ
  choice: இன்று நான் பூமியிலுள்ள அனைவரும் செல்லும் வழியில் செல்கிறேன்
  rationale: இறப்பைக் குறிக்கும் எபிரெய உருவகத்தை நேரடியாக ‘நான் இறக்கப்போகிறேன்’ என்று தட்டையாக்காமல் காக்கிறது; தமிழில் பொருள் புரிவதற்காக ‘பூமியிலுள்ள அனைவரும்’ என்று வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: וִידַעְתֶּם
  choice: நீங்கள் அறிந்திருக்கிறீர்கள்
  rationale: அவர்கள் அனுபவத்தின் மூலம் ஏற்கெனவே உறுதியாக அறிந்திருக்கும் தற்போதைய உண்மையை இயல்பாகத் தெரிவிக்கிறது.
- source_word: בְּכָל לְבַבְכֶם וּבְכָל נַפְשְׁכֶם
  choice: உங்கள் முழு இதயத்தாலும் முழு உயிராலும்
  rationale: ‘இதயம்—உயிர்’ என்ற எபிரெய இணையைப் பேணுவதோடு, முழுமையான உள்ளார்ந்த உறுதியையும் நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: לֹא נָפַל דָּבָר אֶחָד
  choice: ஒன்றுகூட நிறைவேறாமல் போகவில்லை
  rationale: எபிரெய மொழிமரபின் கருத்தான ‘ஒரு சொல்லும் தவறவில்லை/நிறைவேறத் தவறவில்லை’ என்பதை இயல்பான தமிழில் தருகிறது; ‘விழவில்லை’ என்ற சொற்படி உருவம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: מִכֹּל הַדְּבָרִים הַטּוֹבִים
  choice: நன்மையான வார்த்தைகள் அனைத்திலும்
  rationale: דברים என்பதையும் அடுத்து வரும் ‘உரைத்த’ என்பதுடனான சொல் தொடர்பையும் ‘வார்த்தைகள்’ மூலம் காக்கிறது; அவற்றை வெளிப்படையாக ‘வாக்குத்தத்தங்கள்’ என்று விளக்கி விடவில்லை.
- source_word: אֲשֶׁר דִּבֶּר יְהוָה אֱלֹהֵיכֶם עֲלֵיכֶם
  choice: உங்கள் கடவுளாகிய யாவே உங்களைக் குறித்து உரைத்த
  rationale: עַל என்பதன் ‘உங்களைக் குறித்து’ என்ற தொடர்பையும், தெய்வீகப் பெயரையும், ‘பேசுதல்’ என்ற வினையையும் தெளிவாகப் பேணுகிறது.
- source_word: הַכֹּל בָּאוּ לָכֶם
  choice: அவை அனைத்தும் உங்களுக்கு வந்தடைந்தன
  rationale: வார்த்தைகள் அவர்களிடம் ‘வந்தன’ என்ற மூலமொழியின் நிறைவேற்ற உருவகத்தைத் தமிழில் இயன்றவரை காக்கிறது.
- source_word: לֹא נָפַל מִמֶּנּוּ דָּבָר אֶחָד
  choice: அவற்றில் ஒன்றுகூட நிறைவேறாமல் போகவில்லை
  rationale: முன் கூறப்பட்ட நன்மையான வார்த்தைகளில் எதுவும் தவறவில்லை என்ற மீளுரையைத் தெளிவாகவும் இயல்பாகவும் வழங்குகிறது.
theological_decisions:
- issue: יהוה என்ற தெய்வீகப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: ஆண்டவர் / யெகோவா
  rationale: மூலத்தில் வரும் நான்கு எழுத்துத் தெய்வீகப் பெயரை பொதுப்பட்டமாக மாற்றாமல், ஏற்றுக்கொள்ளப்பட்ட தமிழாக்க ஒலிபெயர்ப்பில் தருகிறது.
- issue: கடவுளுடைய நன்மையான דברים என்பவை
  choice: நன்மையான வார்த்தைகள்
  alternative: நன்மையான வாக்குத்தத்தங்கள்
  rationale: சூழலில் இவை நிறைவேற்றப்பட்ட வாக்குறுதிகளைக் குறித்தாலும், மூலத்தின் ‘வார்த்தைகள்/காரியங்கள்’ என்ற பரப்பையும் ‘உரைத்த’ என்பதுடனான தொடர்பையும் காக்கிறது; ‘வாக்குத்தத்தங்கள்’ என்று மட்டும் குறுக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான உரைநடை பயன்படுத்தப்பட்டுள்ளது. இறப்பைக் குறிக்கும் மூல உருவகமும், கடவுள் உரைத்த ‘வார்த்தைகள்’ என்ற சொல் தொடர்பும் காக்கப்பட்டுள்ளன; எபிரெயில் இயல்பான ஆனால் தமிழில் குழப்பமளிக்கக்கூடிய ‘விழுதல்’ மொழிமரபின் பொருள் முதன்மை உரையில் இயல்பாகத் தரப்பட்டு, சொற்படி வடிவம் அடிக்குறிப்பில் குறிப்பிடப்பட்டுள்ளது.
