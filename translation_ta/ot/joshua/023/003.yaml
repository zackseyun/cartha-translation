source:
  edition: WLC
  text: וְ/אַתֶּ֣ם רְאִיתֶ֗ם אֵת֩ כָּל אֲשֶׁ֨ר עָשָׂ֜ה יְהוָ֧ה אֱלֹהֵי/כֶ֛ם לְ/כָל הַ/גּוֹיִ֥ם הָ/אֵ֖לֶּה מִ/פְּנֵי/כֶ֑ם כִּ֚י יְהוָ֣ה אֱלֹהֵי/כֶ֔ם ה֖וּא הַ/נִּלְחָ֥ם לָ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/023/003.yaml
  text: And you yourselves have seen all that Yahweh your God has done to all these nations before you[a], for Yahweh your God is the one who has fought for you.
translation:
  language: ta
  text: 'நீங்களே பார்த்திருக்கிறீர்கள்: உங்கள் முன்னிலையிலிருந்து இந்த எல்லா தேசங்களையும் அகற்றும்படி உங்கள் கடவுளாகிய யாவே செய்த அனைத்தையும்; ஏனெனில் உங்கள் கடவுளாகிய யாவேதான் உங்களுக்காகப் போரிட்டவர்.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאַתֶּם
  choice: நீங்களே
  rationale: தனி இடப்பெயர் தரும் வலியுறுத்தலைத் தமிழில் இயல்பாகக் காட்டுகிறது; முன்சூழலின் தொடர்ச்சி வாக்கிய அமைப்பில் வெளிப்படுகிறது.
- source_word: רְאִיתֶם
  choice: பார்த்திருக்கிறீர்கள்
  rationale: முடிந்த கடந்தகால அனுபவம் நிகழ்காலத்திலும் பொருத்தமுடையது என்பதை நவீன தமிழில் உணர்த்துகிறது.
- source_word: אֵת כָּל אֲשֶׁר עָשָׂה
  choice: செய்த அனைத்தையும்
  rationale: எபிரெய வினையின் பொதுவான பொருளையும் செயலின் முழு வரம்பையும் அதிகப்படியாக விளக்காமல் காக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைத் திருப்பெயரை ஒரு பட்டத்தால் மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: אֱלֹהֵיכֶם
  choice: உங்கள் கடவுள்
  rationale: இரண்டாம் நபர் பன்மை உடைமை வடிவையும் உடன்படிக்கைச் சொல்லாட்சியையும் நேராகப் பாதுகாக்கிறது.
- source_word: לְכָל הַגּוֹיִם הָאֵלֶּה
  choice: இந்த எல்லா தேசங்களுக்கும்
  rationale: עשה உடன் வரும் לְ குறிக்கும் பாதிக்கப்பட்ட பொருளைத் தமிழில் இயல்பாகத் தருகிறது; செயலைச் சூழலைவிட அதிகமாகக் குறிப்பாக்கவில்லை.
- source_word: מִפְּנֵיכֶם
  choice: உங்களுக்கு முன்பிருந்த
  rationale: ‘உங்கள் முன்னிலையிலிருந்து’ என்ற அடிப்படை உருவகத்தை இயல்பான தமிழில் தருகிறது; அகற்றப்பட்டனர் என்ற விளக்கத்தை உரைக்குள் கட்டாயப்படுத்தவில்லை.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய கூற்றுக்கான காரணம் அல்லது விளக்கத்தை அறிமுகப்படுத்துகிறது.
- source_word: הוּא הַנִּלְחָם
  choice: யாவேதான் … போரிட்டவர்
  rationale: הוּא என்பதன் வலியுறுத்தலையும் பெயரெச்சத் தன்மையுள்ள ‘போரிடுகிறவர்’ என்ற வடிவத்தின் பின்னோக்குச் சூழலையும் இயல்பான தமிழில் இணைக்கிறது.
- source_word: לָכֶם
  choice: உங்களுக்காக
  rationale: இஸ்ரவேலருக்குப் பயனாகவும் அவர்கள் சார்பாகவும் நிகழ்ந்த போராட்டத்தைச் சுருக்கமாகக் காட்டுகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைத் திருப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலத்தில் வரும் தனிப்பட்ட உடன்படிக்கைப் பெயரைப் பட்டத்தால் மாற்றாமல், பொதுவாக ஏற்ற ஒலியமைப்பில் தமிழாக்குகிறது.
- issue: இறைவன் இஸ்ரவேலுக்காகப் போரிடுதல்
  choice: உங்களுக்காகப் போரிட்டவர்
  alternative: உங்கள் சார்பில் போரிடுகிறவர்
  rationale: பின்னோக்கிப் பேசும் சூழலில் கடந்த செயல்களைத் தெளிவாக்குகிறது; அதேவேளை இறைவனே போரிட்டார் என்ற வலியுறுத்தலைக் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் மரியாதையும் எளிமையும் கொண்ட உரை. ‘நீங்களே’ மற்றும் ‘யாவேதான்’ என்பவை மூலத்தின் இரட்டை வலியுறுத்தலைக் காக்கின்றன. மִפְּנֵיכֶם என்பதன் வெளியேற்றப் பொருள் சாத்தியமானதாயினும், தமிழின் ‘உங்களுக்கு முன்பிருந்த’ என்ற சொல்லாட்சி அந்த உருவகத்தைத் திறந்தவாறே வைக்கிறது.
