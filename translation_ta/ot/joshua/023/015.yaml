base_translation:
  language: en
  yaml_path: translation/ot/joshua/023/015.yaml
  text: And it shall happen that[a], just as every good word that Yahweh your God spoke to you has come upon you, so Yahweh will bring upon you every evil word, until he has destroyed you from off this good land that Yahweh your God has given to you.
translation:
  language: ta
  text: '15 இவ்வாறு நடைபெறும்: உங்கள் கடவுளாகிய யாவே உங்களுக்குச் சொன்ன ஒவ்வொரு நல்ல வார்த்தையும் உங்களுக்கு நிறைவேறியதுபோலவே, உங்கள் கடவுளாகிய யாவே உங்களுக்குக் கொடுத்த இந்த நல்ல நாட்டிலிருந்து உங்களை முற்றிலும் அழித்துப்போடும் வரை, அவர் ஒவ்வொரு தீய வார்த்தையையும்[a] உங்கள்மேல் கொண்டு வருவார்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஒவ்வொரு கேடான காரியத்தையும்,” அல்லது “எல்லாப் பேரழிவையும்.” எபிரேயத்தில் “ஒவ்வொரு தீய வார்த்தை/காரியம்”; இது முன்னுள்ள “ஒவ்வொரு நல்ல வார்த்தை” என்பதற்கு இணையாக அமைந்துள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה ... כַּאֲשֶׁר ... כֵּן
  choice: '...போலவே, ...'
  rationale: எபிரேயத்தின் ஒப்பீட்டு இணை அமைப்பை இயல்பான நவீன தமிழில் தொடர்ச்சியான ஒரு வாக்கியமாகக் காட்டுகிறது; வாக்கியத்தின் எதிர்கால எச்சரிக்கை வினைமுற்றில் தெளிவாகிறது.
- source_word: בָּא עֲלֵיכֶם
  choice: உங்களுக்கு நிறைவேறியதுபோலவே
  rationale: நல்ல ‘வார்த்தை’ மக்கள்மேல் வந்தது என்பது அது நிகழ்ந்து நிறைவேறியதைக் குறிக்கிறது; தமிழில் ‘நிறைவேறியது’ இந்தச் சூழலில் இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: כָּל הַדָּבָר הַטּוֹב
  choice: ஒவ்வொரு நல்ல வார்த்தையும்
  rationale: דָּבָר என்பதன் ‘வார்த்தை/காரியம்’ என்ற பரப்பை மனதில் வைத்து, பின்னர் வரும் ‘தீய வார்த்தை’ என்பதுடனான திட்டமிட்ட சொல் ஒற்றுமையைப் பாதுகாக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரேய நான்கெழுத்துத் தெய்வீகப் பெயரை ஒரு பொதுப் பட்டமாக மாற்றாமல், தமிழில் பரவலாகப் புரியக்கூடிய ஒலிபெயர்ப்பில் தருகிறது.
- source_word: יָבִיא ... עֲלֵיכֶם
  choice: உங்கள்மேல் வரச் செய்வார்
  rationale: ஹிஃபில் வடிவின் காரணவினைப் பொருளையும் עַל என்பதன் ‘மேல்’ என்ற இடைச்சொல் வலிமையையும் காக்கிறது.
- source_word: כָּל הַדָּבָר הָרָע
  choice: ஒவ்வொரு தீய வார்த்தையையும்
  rationale: ‘நல்ல வார்த்தை’ என்பதுடனான எபிரேயச் சமச்சீரைத் தக்கவைக்கிறது. இங்கு ‘தீய’ என்பது ஒழுக்கத் தீமையை அல்ல, அறிவிக்கப்பட்ட கேடு அல்லது பேரழிவைச் சுட்டலாம்; அதனால் அடிக்குறிப்பு வழங்கப்பட்டுள்ளது.
- source_word: עַד הַשְׁמִידוֹ אֹתְכֶם
  choice: உங்களை முற்றிலும் அழித்துப்போடும் வரை
  rationale: தீர்ப்பின் இறுதி எல்லையையும் השמיד வினையின் முழுமையான அழிப்பு வலிமையையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: מֵעַל הָאֲדָמָה הַטּוֹבָה הַזֹּאת
  choice: இந்த நல்ல நாட்டிலிருந்து
  rationale: אֲדָמָה இங்கு இஸ்ரவேலருக்குக் கொடுக்கப்பட்ட நிலப்பரப்பைக் குறிக்கிறது; ‘நாடு’ தமிழில் சூழலுக்கு ஏற்றது, ‘இலிருந்து’ அகற்றப்படுதலின் இடப்பொருளைத் தெளிவாக்குகிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலத்தில் தனிப்பட்ட உடன்படிக்கைப் பெயர் நேரடியாக உள்ளது; அதை பொதுப் பட்டமாக மாற்றாமல் ஒலிபெயர்ப்பது மூலத்தின் தன்மையைப் பாதுகாக்கிறது.
- issue: רָע என்பதை கடவுள் கொண்டுவரும் தீர்ப்பின் சூழலில் மொழிபெயர்த்தல்
  choice: தீய வார்த்தை
  alternative: கேடான காரியம் / பேரழிவு
  rationale: மூலத்தின் ‘நல்ல வார்த்தை—தீய வார்த்தை’ என்ற பத ஒற்றுமையைப் பாதுகாக்கிறது; அதேவேளையில் கடவுளுக்கு ஒழுக்கத் தீமையைச் சுமத்தாமல், சூழலில் இது தீர்ப்பாகிய கேடு அல்லது பேரழிவு எனப் புரியலாம் என்பதை அடிக்குறிப்பு தெரிவிக்கிறது.
translation_notes:
  register: நவீன தரமான, கண்ணியமான தமிழ். ‘சொன்ன’, ‘நிறைவேறிய’, ‘வரச் செய்வார்’ போன்ற வழக்கமான வடிவுகள் வாசிப்பை இயல்பாக்குகின்றன; ‘யாவே’ மூலத் தெய்வீகப் பெயரைப் பாதுகாக்கிறது. அடிக்குறிப்பு குறியீடு உரையில் உரிய இடத்தில் சேர்க்கப்பட்டுள்ளது.
