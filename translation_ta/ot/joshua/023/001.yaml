base_translation:
  language: en
  yaml_path: translation/ot/joshua/023/001.yaml
  text: And it happened[a], after many days, after Yahweh had given Israel rest from all their enemies around them, that Joshua was old[b], advanced in years.
translation:
  language: ta
  text: யாவே இஸ்ரவேலரைச் சுற்றியிருந்த அவர்களுடைய எல்லாப் பகைவர்களிடமிருந்தும் அவர்களுக்கு ஓய்வு அளித்த பிறகு பல நாட்கள் கடந்திருந்தன[a]; யோசுவா முதியவராகவும் வயதில் மிகவும் முதிர்ந்தவராகவும் இருந்தார்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பல நாட்களுக்குப் பின்.”
    reason: lexical_alternative
  - marker: b
    text: எபிரெய மரபுத்தொடர் சொற்சொல்லாக, “நாட்களில் வந்தவர்”; பொருள், வயதில் மிகவும் முதிர்ந்தவர்.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְהִי מִיָּמִים רַבִּים
  choice: பல காலம் கடந்தபின்
  rationale: புதிய நிகழ்வை அறிமுகப்படுத்தும் எபிரெயக் கதைநடையையும், கணிசமான கால இடைவெளியையும் இயல்பான நவீனத் தமிழில் ஒருங்கிணைக்கிறது. சொற்சொல்லான ‘பல நாட்களுக்குப் பின்’ என்பதும் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: אַחֲרֵי אֲשֶׁר הֵנִיחַ
  choice: ஓய்வு அளித்திருந்தார். அப்போது
  rationale: הֵנִיחַ என்பதன் காரணவினைப் பொருளான பகைவர்களிடமிருந்து விடுதலையும் அமைதியும் வழங்குதலை ‘ஓய்வு அளித்தார்’ வெளிப்படுத்துகிறது. முற்கால நிகழ்வுக்கும் யோசுவாவின் நிலைக்கும் உள்ள கால உறவை ‘அப்போது’ தெளிவாக்குகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இது ஒரு பட்டப்பெயர் அல்ல, இஸ்ரவேலின் தேவனுடைய தனிப்பெயரைக் குறிக்கும் நான்கெழுத்துத் திருப்பெயர்; ஆகவே தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: לְיִשְׂרָאֵל
  choice: இஸ்ரவேலருக்கு
  rationale: இங்கு இஸ்ரவேல் என்ற மக்கள் கூட்டத்தைக் குறிக்கும் பெயர்; தமிழில் இயல்பாக மக்களைக் குறிக்கும் வடிவில் வழங்கப்பட்டுள்ளது.
- source_word: מִכָּל אֹיְבֵיהֶם מִסָּבִיב
  choice: இஸ்ரவேலரைச் சுற்றியிருந்த அவர்களுடைய எல்லாப் பகைவர்களிடமிருந்தும்
  rationale: מִסָּבִיב என்பதிலுள்ள எல்லாப் பக்கங்களிலுமான சூழல் என்ற இடவியல் வலியுறுத்தலையும், מִכָּל என்பதிலுள்ள முழுமையையும் காக்கிறது.
- source_word: וִיהוֹשֻׁעַ זָקֵן
  choice: அப்போது யோசுவா முதுமையடைந்து
  rationale: זָקֵן யோசுவாவின் முதிர்ந்த வயதைக் குறிக்கிறது. நீண்ட கால முன்னுரைக்குப் பின் வரும் முதன்மைக் கூற்றை ‘அப்போது’ இயல்பாக இணைக்கிறது.
- source_word: בָּא בַּיָּמִים
  choice: வயது மிகவும் முதிர்ந்தவராக இருந்தார்
  rationale: ‘நாட்களுக்குள் வந்திருந்தார்’ என்ற எபிரெய மரபுத்தொடரின் பொருளை நவீனத் தமிழில் தெளிவாக அளிக்கிறது; அதன் சொற்சொல்லான உருவம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலவசனம் இறைவனுடைய தனிப்பெயரான நான்கெழுத்துப் பெயரை நேரடியாகப் பயன்படுத்துகிறது. அதை ஒரு பட்டப்பெயரால் மாற்றாமல் ‘யாவே’ என ஒலிபெயர்ப்பது மூலத்தின் தனிப்பெயர்த் தன்மையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘முதுமையடைந்து, வயது மிகவும் முதிர்ந்தவராக’ என்ற இணைப்பு மூலத்திலுள்ள זָקֵן மற்றும் בָּא בַּיָּמִים ஆகிய இரட்டை விவரிப்பையும் சுருக்காமல் காக்கிறது.
