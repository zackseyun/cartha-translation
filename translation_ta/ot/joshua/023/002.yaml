base_translation:
  language: en
  yaml_path: translation/ot/joshua/023/002.yaml
  text: Then Joshua called for all Israel—for its elders[a], its heads, its judges, and its officers—and said to them, “I am old[c][b]; I have advanced in years.”
translation:
  language: ta
  text: பின்பு யோசுவா இஸ்ரவேலர் அனைவரையும்—அவர்களுடைய மூப்பர்களையும், தலைவர்களையும், நீதிபதிகளையும், அதிகாரிகளையும்—அழைத்து[a], அவர்களிடம், “நான் முதுமையடைந்துவிட்டேன்; வயதில் மிகவும் முன்னேறியுள்ளேன்[b]” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அழைத்து’ என்பதற்கு ‘வரவழைத்து’ அல்லது ‘கூட்டி’ என்றும் மொழிபெயர்க்கலாம். இங்கு தலைவர்களைத் தம்மிடம் ஒன்றுகூடச் செய்தல் என்ற பொருள் உள்ளது.
    reason: lexical_alternative
  - marker: b
    text: எபிரெய மரபுத்தொடரைச் சொல்லுக்குச் சொல் மொழிபெயர்த்தால், ‘நான் நாட்களுக்குள் வந்துவிட்டேன்’; இதன் பொருள், ‘நான் வயதில் மிகவும் முன்னேறியுள்ளேன்’ என்பதாகும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא ... לְ
  choice: அழைத்து
  rationale: קרא என்பதுடன் לְ வரும்போது, ஒருவரைத் தன்னிடம் வருமாறு அழைப்பது அல்லது கூட்டுவது என்ற பொருள் உண்டு. இச்சூழலில் ‘அழைத்து’ என்பது இயல்பான தமிழில் அந்தப் பொருளைத் தருகிறது; ‘கூட்டிவரச் செய்து’ என்பது தேவையற்ற விரிவாக்கமாகும்.
- source_word: לְכָל יִשְׂרָאֵל
  choice: இஸ்ரவேலர் அனைவரையும்
  rationale: எபிரெய உரையில் உள்ள ‘இஸ்ரவேல் முழுவதையும்’ என்ற கூட்டு தேசியக் குறிப்பைத் தக்கவைக்கிறது. தொடர்ந்து வரும் பதவிப் பட்டியல் அவர்கள் பிரதிநிதிகளாக அழைக்கப்பட்டதை விளக்குகிறது.
- source_word: לִזְקֵנָיו
  choice: அவர்களுடைய மூப்பர்களையும்
  rationale: ஒருமை பின்னொட்டு, கூட்டு ஒருமையாகிய ‘இஸ்ரவேல்’ என்பதைக் குறிக்கிறது. தமிழில் மக்களைக் குறிக்கும் பன்மை இயல்புக்கு ஏற்ப ‘அவர்களுடைய’ என்று வழங்கப்பட்டுள்ளது.
- source_word: וּלְרָאשָׁיו
  choice: தலைவர்களையும்
  rationale: רֹאשׁ என்பதன் அடிப்படை உருவகம் ‘தலை’ என்றாலும், நிர்வாகப் பட்டியலில் அது முதன்மை வகிப்பவர்களைக் குறிக்கிறது. ‘தலைவர்கள்’ என்பது நவீன தமிழில் தெளிவாகவும் பிற பதவிகளிலிருந்து வேறுபட்டதாகவும் உள்ளது.
- source_word: וּלְשֹׁפְטָיו
  choice: நீதிபதிகளையும்
  rationale: இச்சமூக-நிர்வாகச் சூழலில் שׁפט வடிவம் நீதித் தீர்ப்பு வழங்கும் அலுவலர்களைக் குறிக்கிறது.
- source_word: וּלְשֹׁטְרָיו
  choice: அதிகாரிகளையும்
  rationale: שֹׁטְרִים என்பது கீழ்நிலை நிர்வாக அலுவலர்களைக் குறிக்கும். ‘அதிகாரிகள்’ என்பது நவீனத் தமிழில் பரந்தும் இயல்பாகவும் உள்ளது; ‘எழுத்தர்கள்’ என்பது இங்கு அளவுக்கு மீறிய குறுகிய பொருள்.
- source_word: אֲנִי זָקַנְתִּי
  choice: நான் முதுமையடைந்துவிட்டேன்
  rationale: எபிரெய நிறைவுவினை, முதுமை அடைந்த செயலின் விளைவாக உள்ள தற்போதைய நிலையை உணர்த்துகிறது. ‘முதுமையடைந்துவிட்டேன்’ அந்தச் செயல்முறையையும் தற்போதைய நிலையையும் காக்கிறது.
- source_word: בָּאתִי בַּיָּמִים
  choice: வயது முதிர்ந்துவிட்டேன்
  rationale: சொல்லுக்குச் சொல் ‘நாட்களுக்குள் வந்துவிட்டேன்’ என்ற எபிரெய மரபுத்தொடர், வயதில் மிகவும் முன்னேறியிருப்பதைக் குறிக்கிறது. இயல்பான தமிழில் ‘வயது முதிர்ந்துவிட்டேன்’ என வழங்கப்பட்டுள்ளது.
theological_decisions:
- issue: தொடரும் தலைமைப் பதவிப் பட்டியலின் வெளிச்சத்தில் ‘இஸ்ரவேலர் அனைவரும்’ என்பதன் குறிப்பு
  choice: ‘இஸ்ரவேலர் அனைவரையும்’ என்ற வெளிப்படையான கூட்டு தேசியக் குறிப்பு தக்கவைக்கப்பட்டு, அடுத்த பட்டியல் ‘அதாவது’ என்பதன் மூலம் அவர்களைப் பிரதிநிதித்துவப்படுத்தும் தலைவர்களை விளக்குவதாக வழங்கப்பட்டுள்ளது.
  alternative: ‘இஸ்ரவேலின் தலைவர்கள் அனைவரையும்’ என்று பிரதிநிதிகளை மட்டும் மொழிபெயர்த்தல்.
  rationale: எபிரெய உரை முதலில் ‘இஸ்ரவேல் முழுவதையும்’ என்று கூறி, பின்னர் மூப்பர்கள், தலைவர்கள், நீதிபதிகள், அதிகாரிகள் எனப் பட்டியலிடுகிறது. கூட்டு மக்களையும் அவர்களது பிரதிநிதிகளையும் ஒன்றாகக் காக்கும் மொழிபெயர்ப்பு, உரையின் பதற்றத்தைச் சுருக்கிவிடாமல் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘மூப்பர்கள், தலைவர்கள், நீதிபதிகள், அதிகாரிகள்’ என்ற நிர்வாகப் பட்டியல் தெளிவாக வேறுபடுத்தப்பட்டுள்ளது. கோடுகளுக்குள் ‘அதாவது’ சேர்த்தது, ‘இஸ்ரவேலர் அனைவரும்’ என்பதையும் தொடர்ந்து வரும் பிரதிநிதிப் பட்டியலையும் இயல்பான தமிழில் இணைக்கிறது. அனைத்து அடிக்குறிப்பு குறிகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
