source:
  edition: WLC
  text: וְ/לֹ֣א הוֹרִ֔ישׁוּ אֶת הַֽ/כְּנַעֲנִ֖י הַ/יּוֹשֵׁ֣ב בְּ/גָ֑זֶר וַ/יֵּ֨שֶׁב הַֽ/כְּנַעֲנִ֜י בְּ/קֶ֤רֶב אֶפְרַ֨יִם֙ עַד הַ/יּ֣וֹם הַ/זֶּ֔ה וַ/יְהִ֖י לְ/מַס עֹבֵֽד־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/016/010.yaml
  text: But they did not drive out the Canaanites who lived in Gezer, so the Canaanites have lived in the midst of Ephraim to this day and became forced laborers.
translation:
  language: ta
  text: ஆனால் கெசேரில் குடியிருந்த கானானியர்களை அவர்கள் வெளியேற்றவில்லை; கானானியர்கள் இன்றுவரை எப்பிராயீமின் நடுவில் குடியிருந்து வருகின்றனர்; அவர்கள் கட்டாய உழைப்புக்கு உட்பட்டவர்களாயினர்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הוֹרִישׁוּ
  choice: துரத்திவிடவில்லை
  rationale: ஹிஃபில் வடிவம் இங்கு அந்த நாட்டிலிருந்து வெளியேற்றுதல் என்ற பொருளைத் தருகிறது; நவீன தமிழில் இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: בְּקֶרֶב אֶפְרַיִם
  choice: எப்பிராயீமியர்களின் நடுவில்
  rationale: இங்கு אֶפְרַיִם என்பது நிலப்பகுதியைவிட எப்பிராயீம் மக்களைக் குறிக்கக்கூடியதால், தமிழில் மக்களுடனான வாழ்வைத் தெளிவாக்கும் வகையில் மொழிபெயர்க்கப்பட்டது.
- source_word: לְמַס עֹבֵד
  choice: கட்டாய வேலை செய்பவர்கள்
  rationale: מַס என்பது இச்சூழலில் வரி மட்டும் அல்லாமல் கட்டாய உழைப்பையும் குறிக்கிறது; עֹבֵד அதனைச் செயலில் ஈடுபடுவதாக விளக்குகிறது.
theological_decisions:
- issue: கானானியர்களை வெளியேற்றாததற்கும் அவர்கள் எப்பிராயீமின் நடுவில் வாழ்ந்ததற்கும் உள்ள தொடர்பு
  choice: எனவே
  alternative: அப்போது / மேலும்
  rationale: வַיֵּשֶׁב தொடர்ச்சியை மட்டும் குறிக்கலாம்; எனினும் சூழலில் வெளியேற்றத் தவறியதன் விளைவாக அவர்கள் தொடர்ந்து குடியிருந்தனர் என்பதால் மென்மையான விளைவுத் தொடர்பு இயல்பாகிறது.
- issue: வசனத்தின் இறுதி வினையின் காலம்
  choice: ஆனார்கள்
  alternative: ஆகியிருக்கிறார்கள் / இருந்து வந்தார்கள்
  rationale: וַיְהִי என்பது கதையாடல் தொடரில் ஒரு நிலை உருவானதைச் சுட்டுகிறது; עַד הַיּוֹם הַזֶּה நேரடியாக குடியிருப்பதையே மாற்றுகிறது. ஆகவே இறுதி வினையை இறந்தகாலமாக வைத்திருக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; எளிமையானதாயினும் கண்ணியமான வேதாகம நடையில் வடிவமைக்கப்பட்டது. மூலத்தின் இரண்டு தொடர்ச்சியான கூறுகளும் தெளிவான வாக்கியங்களாக வழங்கப்பட்டுள்ளன.
