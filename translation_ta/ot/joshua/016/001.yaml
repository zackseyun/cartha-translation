  yaml_path: translation/ot/joshua/016/001.yaml
  text: And the lot came out for the sons of Joseph from the Jordan at Jericho[a], to the waters of Jericho on the east, through the wilderness[b], going up from Jericho into the hill country of Bethel.
translation:
  language: ta
  text: 'யோசேப்பின் மகன்களுக்காகச் சீட்டு வெளிவந்தது: எரிகோவுக்கு அருகிலுள்ள யோர்தானிலிருந்து கிழக்கே, எரிகோவின் நீர்நிலைகள் வரை; அங்கிருந்து எரிகோவிலிருந்து பெத்தேலின் மலைநாட்டுக்கு ஏறிச் செல்லும் வனாந்தரத்தின் வழியாக அதன் எல்லை சென்றது.[a]


    [a] எபிரெய மொழியில், “யோசேப்பின் மகன்களுக்காகச் சீட்டு வெளிவந்தது.” நிலப் பங்கீட்டுச் சூழலில், இது அவர்களுக்கான பங்கீட்டின் முடிவைக் குறிக்கிறது.


    [b] “எரிகோவின் நீர்நிலைகள்” என்பது எரிகோவின் நீரூற்றை அல்லது நீராதாரத்தைக் குறிப்பாகக் குறிக்கலாம்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மொழியில், “யோசேப்பின் மகன்களுக்காகச் சீட்டு வெளிவந்தது.” நிலப் பங்கீட்டுச் சூழலில், இது அவர்களுக்கான பங்கீட்டின் முடிவைக் குறிக்கிறது.
    reason: lexical_alternative
