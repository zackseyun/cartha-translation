translation_notes:
  register: நவீன தரத் தமிழில், புவியியல் எல்லை விவரிப்புக்கேற்ற கண்ணியமான மற்றும் தெளிவான நடை பயன்படுத்தப்பட்டுள்ளது. இடப்பெயர்களும் இனப்பெயரும் ஒலிபெயர்க்கப்பட்டுள்ளன; தொழில்நுட்பமான எபிரெய மரபுத்தொடர் வாசிக்க எளிதாக முதன்மை உரையில் பொருள்வழியாகவும் அடிக்குறிப்பில் சொல்லுக்கு சொல்லாகவும் தரப்பட்டுள்ளது.
