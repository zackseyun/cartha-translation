  text: Then it went down westward to the border of the Japhletites[a], as far as the border of Lower Beth-horon, and as far as Gezer; and its goings out were at the sea.
translation:
  language: ta
  text: பின்பு அது மேற்கே இறங்கி, யப்லேத்தியரின் எல்லையை அடைந்து, கீழ் பெத்-ஓரோனின் எல்லை வரையிலும் கேசேர் வரையிலும் சென்றது; அதன் எல்லையின் முடிவிடங்கள் கடலை அடைந்தன.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மொழியில் சொல்லுக்கு சொல், “அதன் புறப்பாடுகள் கடலை நோக்கி இருந்தன.” இது ஓர் எல்லையின் முனைகள் அல்லது முடிவிடங்கள் கடலை அடைந்ததைக் குறிக்கும் எல்லை விவரிப்பு மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָרַד
  choice: பின்பு அது இறங்கி
  rationale: எல்லை விவரிப்பில் நிலப்பரப்பின் தாழ்வை நோக்கிய நகர்வை ירד குறிக்கிறது; இயல்பான தமிழில் அதன் நிலவியல் உணர்வைத் தக்கவைக்கிறது.
- source_word: יָמָּה
  choice: மேற்கே
  rationale: திசைகாட்டும் இவ்வடிவம், மத்தியதரைக் கடல் மேற்கில் இருப்பதால், இங்கு ‘மேற்கே’ என்று பொருள்படுகிறது.
- source_word: אֶל גְּבוּל הַיַּפְלֵטִי
  choice: யப்லேத்தியரின் எல்லையை அடைந்து
  rationale: גְּבוּל என்பது எல்லைக்கோட்டைக் குறிக்கிறது; யַפְלֵטִי என்பது மக்கள் அல்லது பிரதேசத்தைக் குறிக்கும் இனப்பெயர் வடிவம். ‘அடைந்து’ என்பது தொடர்ச்சியான எல்லைப் பயணத்தை இயல்பாக இணைக்கிறது.
- source_word: עַד גְּבוּל בֵּית חוֹרֹן תַּחְתּוֹן
  choice: கீழ் பெத்-ஓரோனின் எல்லைவரையிலும்
  rationale: עַד எல்லையின் நீட்சியைச் சுட்டுகிறது; תַּחְתּוֹן, மேல் பெத்-ஓரோனிலிருந்து வேறுபடுத்தும் ‘கீழ்’ என்ற இடப்பெயர்ச் சிறப்பைக் கொண்டது.
- source_word: וְעַד גָּזֶר
  choice: கேசேர்வரையிலும்
  rationale: மீண்டும் வரும் עַד எல்லை எவ்வளவு தூரம் நீள்கிறது என்பதைத் தொடர்கிறது.
- source_word: וְהָיוּ תֹצְאֹתָיו יָמָּה
  choice: அதன் எல்லை கடலில் முடிவடைந்தது
  rationale: எல்லைச் சூத்திரங்களில் תֹצְאֹתָיו என்பது எல்லையின் முடிவிடத்தைக் குறிக்கிறது; இறுதி יָמָּה இங்கு கடலை இறுதி முனையாகக் காட்டுகிறது.
