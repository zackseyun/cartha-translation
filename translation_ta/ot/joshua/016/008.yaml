- from: தப்புவாவிலிருந்து எல்லை மேற்கே கானா ஓடை[a] வரை சென்று, கடலில் முடிவடைகிறது. இதுவே எப்பிராயீமின் மக்களுடைய கோத்திரத்திற்கு, அவர்களுடைய குடும்பங்களின்படி கிடைத்த உரிமைச் சொத்து.
  to: தப்புவாவிலிருந்து எல்லை மேற்கே கானா ஓடை[a] வரை செல்கிறது; அதன் முடிவுகள் கடலில் உள்ளன. இது எப்பிராயீமின் மகன்களின் கோத்திரத்தாருக்கு, அவர்களுடைய குடும்பங்களின்படி, கிடைத்த சுதந்தரப் பங்கு.
