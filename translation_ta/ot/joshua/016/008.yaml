source:
  edition: WLC
  text: מִ/תַּפּ֜וּחַ יֵלֵ֨ךְ הַ/גְּב֥וּל יָ֨מָּ/ה֙ נַ֣חַל קָנָ֔ה וְ/הָי֥וּ תֹצְאֹתָ֖י/ו הַ/יָּ֑מָּ/ה זֹ֗את נַחֲלַ֛ת מַטֵּ֥ה בְנֵי אֶפְרַ֖יִם לְ/מִשְׁפְּחֹתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/016/008.yaml
  text: From Tappuah the border goes westward to the Brook of Kanah[a], and its end was at the sea[c][b]. This is the inheritance of the tribe of the sons of Ephraim according to their families.
translation:
  language: ta
  text: தப்புவாவிலிருந்து எல்லை மேற்கே கானா ஓடை[a] வரை செல்கிறது; அதன் முடிவுகள் கடலில் உள்ளன. இது எப்பிராயீமின் மகன்களின் கோத்திரத்தாருக்கு, அவர்களுடைய குடும்பங்களின்படி, கிடைத்த சுதந்தரப் பங்கு.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ஓடை” என்பதை “நீரோடைப் பள்ளம்” அல்லது “வாடி” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִתַּפּוּחַ
  choice: தப்புவாவிலிருந்து
  rationale: מִן தொடக்க இடத்தைக் குறிக்கிறது; தப்புவா என்ற இடப்பெயர் தமிழில் ஒலிபெயர்க்கப்பட்டது.
- source_word: יֵלֵךְ הַגְּבוּל
  choice: எல்லை ... சென்று
  rationale: நில எல்லை செல்லும் பாதையை விவரிக்கும் இயல்பான தமிழ் நடை.
- source_word: יָמָּה
  choice: மேற்கே
  rationale: கடலை நோக்கிய திசைவடிவம் இத்தகைய எல்லை விவரிப்புகளில் பொதுவாக மேற்குத் திசையைக் குறிக்கிறது.
- source_word: נַחַל קָנָה
  choice: கானா ஓடை
  rationale: נַחַל என்பது ஓடை, நீரோடைப் பள்ளம் அல்லது பருவகால நீர்ப்பாதையைக் குறிக்கலாம்; பொதுவாசகருக்குத் தெளிவாக ‘ஓடை’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: וְהָיוּ תֹצְאֹתָיו הַיָּמָּה
  choice: கடலில் முடிவடைகிறது
  rationale: எல்லையின் இறுதி கடலில் இருப்பதை இயல்பான தமிழில் தெரிவிக்கிறது; எபிரெயச் சொல் பன்மை வடிவில் இருந்தாலும் எல்லைக்கோட்டின் முடிவை ஒருமையாகக் கூறுவது தமிழில் இயல்பு.
- source_word: זֹאת נַחֲלַת
  choice: இதுவே ... கிடைத்த உரிமைச் சொத்து
  rationale: நிலப் பங்காக வழங்கப்பட்ட உடைமையை ‘உரிமைச் சொத்து’ தெளிவாகக் காட்டுகிறது.
- source_word: מַטֵּה בְנֵי אֶפְרַיִם
  choice: எப்பிராயீமின் மக்களுடைய கோத்திரத்திற்கு
  rationale: בְנֵי என்பதன் வம்சவழி இனக்குழுப் பொருளை இயல்பான தமிழில் ‘மக்கள்’ என்றும், מַטֵּה என்பதைக் ‘கோத்திரம்’ என்றும் வழங்குகிறது.
- source_word: לְמִשְׁפְּחֹתָם
  choice: அவர்களுடைய குடும்பங்களின்படி
  rationale: கோத்திரத்திற்குள் உள்ள குடும்ப அல்லது குலப் பிரிவுகளின்படி பங்கிடப்பட்டதைக் குறிக்கிறது.
theological_decisions:
- issue: בְנֵי אֶפְרַיִם என்ற கோத்திரக் குறிப்பு
  choice: எப்பிராயீமின் மக்கள்
  alternative: எப்பிராயீமின் மகன்கள் / எப்பிராயீமின் சந்ததியினர்
  rationale: சொல்லுருவில் ‘மகன்கள்’ என்றாலும், இங்கு முழுக் கோத்திரத்தையும் குறிக்கும் நிலையான வம்சவழிப் பயன்பாடு. ‘மக்கள்’ என்பது பாலினக் கருத்தைச் சேர்க்காமல் அந்தக் கூட்டுப் பொருளை இயல்பான தமிழில் தருகிறது.
translation_notes:
  register: நவீன தரமான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. எல்லை விவரிப்பின் நிலவியல் மொழி எளிமைப்படுத்தப்பட்டாலும், ‘மேற்கே’ மற்றும் ‘கடலில்’ என்ற இரு தனித்த கூறுகளும் பாதுகாக்கப்பட்டுள்ளன.
