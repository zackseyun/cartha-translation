base_translation:
  language: en
  yaml_path: translation/ot/joshua/016/005.yaml
  text: 'And the territory of the sons of Ephraim by their clans was as follows: the border of their inheritance on the east was Ataroth-addar[a], as far as Upper Beth-horon.'
translation:
  language: ta
  text: 'எப்பிராயீம் மக்களின் குலங்களுக்குரிய நிலப்பகுதி இதுவே: அவர்களுக்குப் பங்காகக் கிடைத்த நிலத்தின் கிழக்கு எல்லை அதரோத்-அதார் வரை, மேல் பெத்-ஓரோன் வரை இருந்தது.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்களுக்குப் பங்காகக் கிடைத்த நிலத்தின் எல்லை கிழக்குநோக்கி அதரோத்-அதாரிலிருந்து மேல் பெத்-ஓரோன் வரை இருந்தது.” எபிரெயச் சொற்றொடரமைப்பை இவ்வாறும் புரிந்துகொள்ளலாம்; புவியியல் பொருள் மாறுவதில்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: גְּבוּל
  choice: நிலப்பரப்பு / எல்லை
  rationale: இச்சொல் வசனத்தில் இருமுறை வருகிறது. முதலில் அது எப்பிராயீம் கோத்திரத்துக்குரிய முழு நிலப்பரப்பைக் குறிக்கிறது; இரண்டாவது இடத்தில் ஊர்ப் பெயர்களால் வரையறுக்கப்படும் எல்லைக்கோட்டைக் குறிக்கிறது. எனவே சூழலுக்கேற்ப முறையே ‘நிலப்பரப்பு’, ‘எல்லை’ என்று வழங்கப்பட்டுள்ளது.
- source_word: בְּנֵי אֶפְרַיִם
  choice: எப்பிராயீமின் மக்கள்
  rationale: எபிரெய மொழியின் ‘மகன்கள்’ என்ற மரபியல் சொல்லாட்சி இங்கு முழுக் கோத்திர மக்களையும் பிரதிநிதித்துவமாகக் குறிக்கிறது. நவீன தமிழில் தவறான பாலினக் கட்டுப்பாட்டை உணர்த்தாமல் அந்தக் கோத்திரப் பொருளைத் தெளிவாக்க ‘மக்கள்’ இயல்பாக உள்ளது.
- source_word: לְמִשְׁפְּחֹתָם
  choice: அவர்களுடைய குலங்களின்படி
  rationale: யோசுவாவின் நிலப்பங்கீட்டுச் சூழலில் מִשְׁפָּחָה என்பது கோத்திரத்துக்குள் உள்ள குலப் பிரிவைக் குறிக்கிறது; ‘குலங்களின்படி’ அந்த சமூக அமைப்பைத் துல்லியமாகக் காட்டுகிறது.
- source_word: נַחֲלָתָם
  choice: அவர்களுடைய உரிமைச்சொத்து
  rationale: נַחֲלָה என்பது பங்கிட்டுக் கிடைத்த மரபுரிமை நிலத்தைக் குறிக்கிறது. ‘உரிமைச்சொத்து’ நிலத்தின் உரிமை மற்றும் மரபுவழிப் பங்கு ஆகிய இரு நுணுக்கங்களையும் சுருக்கமாகத் தருகிறது.
- source_word: מִזְרָחָה
  choice: கிழக்கில்
  rationale: திசை வடிவம் எல்லையின் கிழக்குப் பக்கத்தை அல்லது கிழக்குத் திசையிலான அமைப்பைக் குறிக்கிறது. ‘கிழக்கில்’ தமிழில் இயல்பான புவியியல் சொல்லாட்சி.
- source_word: עַטְרוֹת אַדָּר
  choice: அதரோத்-அத்தார்
  rationale: இது ஓர் ஊர்ப்பெயர் என்பதால் மொழிபெயர்க்காமல், எபிரெய உச்சரிப்பை அணுகும் வகையில் ஒலிபெயர்க்கப்பட்டுள்ளது; இணைப்புக்குறி கூட்டுப் பெயரைத் தெளிவாக்குகிறது.
- source_word: עַד
  choice: வரை
  rationale: எல்லை விவரிப்பில் அதன் நீட்சி முடியும் இடத்தை இயல்பாகக் குறிக்கிறது.
- source_word: בֵּית חוֹרֹן עֶלְיוֹן
  choice: மேல் பெத்-ஓரோன்
  rationale: עֶלְיוֹן இவ்விடத்தை கீழ் பெத்-ஓரோனிலிருந்து வேறுபடுத்துகிறது. தமிழில் பெயரின் முன் ‘மேல்’ வருவது தெளிவான இடப்பெயர் வடிவம்.
