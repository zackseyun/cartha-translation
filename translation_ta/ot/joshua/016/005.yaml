translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான புவியியல் நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. எபிரெயச் சொல்லான גְּבוּל என்பதன் இரு சூழல் சார்ந்த பொருள்களும் வேறுபடுத்தப்பட்டுள்ளன; இடப்பெயர்கள் ஒலிபெயர்க்கப்பட்டுள்ளன.
