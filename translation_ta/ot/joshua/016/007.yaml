source:
  edition: WLC
  text: וְ/יָרַ֥ד מִ/יָּנ֖וֹחָ/ה עֲטָר֣וֹת וְ/נַעֲרָ֑תָ/ה וּ/פָגַע֙ בִּֽ/ירִיח֔וֹ וְ/יָצָ֖א הַ/יַּרְדֵּֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/016/007.yaml
  text: Then it went down from Janoah to Ataroth and Naarah[a], and reached Jericho[c][b], and ended at the Jordan.
translation:
  language: ta
  text: பின்பு எல்லை யனோவாவிலிருந்து அத்தரோத்துக்கும் நாராவுக்கும்[a] இறங்கி, எரிகோவைத் தொட்டு[b], யோர்தானில் முடிவடைந்தது[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் ‘நாரா’; சிலர் இந்த இடப்பெயரை யோசுவா 16:7–8-இல் வரும் ‘நாராத்’ என்ற வடிவத்துடன் தொடர்புபடுத்துகின்றனர்.
    reason: alternative_reading
  - marker: b
    text: அல்லது, ‘எரிகோவை அடைந்து’; எபிரெய வினைச்சொல் ஓர் எல்லைக்கோடு ஓர் இடத்தைச் சந்திப்பதையோ தொடுவதையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: சொற்படி, ‘யோர்தானுக்குச் சென்றது’; இந்த எபிரெய மரபுத்தொடர் எல்லைக்கோட்டின் போக்கையோ அதன் முடிவிடத்தையோ குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָרַד מִיָּנוֹחָה
  choice: பின்பு எல்லை யானோவாவிலிருந்து ... இறங்கி
  rationale: ירד என்பது எல்லை விவரிப்புகளில் நிலப்பரப்பு அல்லது திசை சார்ந்த இறக்கத்தைக் குறிக்கிறது. தமிழில் எழுவாய் தெளிவாக இருக்க ‘எல்லை’ சேர்க்கப்பட்டுள்ளது; தொடர் நிகழ்வைக் காட்ட வாவ் ‘பின்பு’ என வழங்கப்பட்டுள்ளது.
- source_word: עֲטָרוֹת
  choice: அத்தரோத்து
  rationale: இடப்பெயர் மொழிபெயர்க்கப்படாமல், தமிழில் இயல்பாக ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: וְנַעֲרָתָה
  choice: நாரா
  rationale: மசோரா உயிர்க்குறியீட்டின் வடிவம் நாரா என்பதையே ஆதரிக்கிறது; நாராத் என்ற தொடர்புடைய வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
- source_word: וּפָגַע בִּירִיחוֹ
  choice: எரிகோவைத் தொட்டு
  rationale: எல்லை விவரிப்பில் פגע என்பது ஓர் இடத்தை அடைதல், சந்தித்தல் அல்லது தொடுதல் என அமையலாம். ‘தொட்டு’ என்பது எல்லைக்கோட்டின் இடவியல் தொடர்பைத் தெளிவாகக் காட்டி, அது நகருக்குள் சென்றதாக மிகையாக விளக்காது.
- source_word: וְיָצָא הַיַּרְדֵּן
  choice: யோர்தானில் முடிவடைந்தது
  rationale: எல்லைச் சூத்திரங்களில் יצא எல்லைக்கோடு சென்று சேரும் முனையைக் குறிக்கக்கூடும். இயல்பான தமிழில் அதன் செயல்பாட்டை ‘முடிவடைந்தது’ தெளிவுபடுத்துகிறது; சொற்படி மாற்று அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: הַיַּרְדֵּן
  choice: யோர்தான்
  rationale: ஆற்றின் வழக்கமான தமிழ் பெயர் பயன்படுத்தப்பட்டுள்ளது; சூழலிலேயே அது ஆறு என்பது தெளிவாக இருப்பதால் ‘ஆறு’ சேர்க்கப்படவில்லை.
