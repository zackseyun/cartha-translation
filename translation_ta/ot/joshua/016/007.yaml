translation_notes:
  register: நவீனச் செந்தமிழுக்கு நெருக்கமான, பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. தொடர்ச்சியான எல்லை விவரிப்பில் மறைந்திருக்கும் எழுவாயைத் தெளிவுபடுத்த ‘எல்லை’ சேர்க்கப்பட்டுள்ளது. இடப்பெயர்கள் தமிழ் வேதாகமப் பயன்பாட்டுக்கு ஏற்றவாறு ஒலிபெயர்க்கப்பட்டுள்ளன.
