  yaml_path: translation/ot/joshua/016/004.yaml
  text: And the sons of Joseph[a], Manasseh and Ephraim, received their inheritance.
translation:
  language: ta
  text: யோசேப்பின் மக்களாகிய மனாசேயும் எப்பிராயீமும் தங்கள் உரிமைப் பங்கைப் பெற்றுக்கொண்டார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தங்கள் உரிமைப் பங்கைச் சுதந்தரித்துக்கொண்டார்கள்” அல்லது “அதைக் கைப்பற்றிக்கொண்டார்கள்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּנְחֲלוּ
  choice: தங்கள் உரிமைப் பங்கைப் பெற்றுக்கொண்டார்கள்
  rationale: נחל என்ற வினை இங்கு ஒதுக்கப்பட்ட நிலத்தை உரிமைப் பங்காகப் பெறுவதைக் குறிக்கிறது. தமிழில் பொருளை இயல்பாகவும் நிலப் பங்கீட்டுச் சூழலுக்கு ஏற்றவாறும் தெரிவிக்க, மூலத்தில் உள்ளடங்கிய செயப்படுபொருள் வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: בְנֵי יוֹסֵף
  choice: யோசேப்பின் மக்களாகிய
  rationale: சொல்லடிப்படையில் ‘யோசேப்பின் மகன்கள்’ என்றாலும், இங்கு மனாசே மற்றும் எப்பிராயீம் கோத்திர மக்களைக் குறிக்கும் மரபுவழிப் பயன்பாடு உள்ளது. ‘மக்களாகிய’ என்பது அந்தக் கூட்டு/வழித்தோன்றல் பொருளை இயல்பான தமிழில் காக்கிறது.
- source_word: מְנַשֶּׁה
  choice: மனாசே
  rationale: தமிழ் வேதாகமப் பெயர் மரபுக்கு ஏற்ற ஒலிபெயர்ப்பு.
- source_word: וְאֶפְרָיִם
  choice: எப்பிராயீமும்
  rationale: தமிழ் வேதாகமப் பெயர் மரபுக்கு ஏற்ற ஒலிபெயர்ப்பு; இணைப்பை ‘-உம்’ தொடரிணைப்பு இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וַ
  choice: தனி இணைப்புச்சொல் இன்றி வாக்கியத் தொடர்ச்சியில் வெளிப்படுத்தப்பட்டது
  rationale: எபிரெயக் கதைநடையின் wayyiqtol முன்னொட்டு நிகழ்வைத் தொடர்கிறது. இவ்வசனம் தனியாகவும் இயல்பாகவும் வாசிக்கத் தமிழில் கட்டாயமான ‘அப்போது/மேலும்’ சேர்க்கப்படவில்லை.
