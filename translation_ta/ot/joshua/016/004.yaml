translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘மக்களாகிய’ என்பது நேரடி உயிரியல் மகன்கள் மட்டுமல்லாமல் யோசேப்பின் கோத்திர வழித்தோன்றல்களையும் உள்ளடக்கும் வகையில் அமைந்துள்ளது; இருப்பினும் மனாசே, எப்பிராயீம் என்ற மூலப் பெயர்கள் அப்படியே காக்கப்பட்டுள்ளன.
