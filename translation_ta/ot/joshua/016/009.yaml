  text: And the cities set apart for the sons of Ephraim within the inheritance of the sons of Manasseh—all the cities and their villages[a].
translation:
  language: ta
  text: மனாசேயின் சந்ததியினருடைய உரிமைப்பங்கிற்குள் எப்பிராயீமின் சந்ததியினருக்காகப் பிரித்துவைக்கப்பட்ட நகரங்களும் இருந்தன—அந்த நகரங்கள் அனைத்தும் அவற்றைச் சேர்ந்த கிராமங்களும்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எப்பிராயீமின் சந்ததியினருக்காகத் தனியே வேறுபடுத்தப்பட்ட நகரங்கள்.” எபிரெயப் பங்கேற்புச் சொல், மனாசேயின் உரிமைப்பங்கிற்குள் இருந்த இந்நகரங்கள் எப்பிராயீமுக்காகத் தனியே ஒதுக்கப்பட்டவை என்பதை வலியுறுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶעָרִים
  choice: நகரங்கள்
  rationale: עִיר என்பது நகரம் அல்லது ஊரைக் குறிக்கலாம்; யோசுவாவின் நிலப்பகுதிப் பட்டியல்களில் தொடர்ச்சியையும் இயல்பான தமிழையும் காக்க ‘நகரங்கள்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: הַמִּבְדָּלוֹת
  choice: பிரித்துவைக்கப்பட்ட
  rationale: בדל என்ற வேர்ச்சொல் பிரித்தல் அல்லது வேறுபடுத்துதலைக் குறிக்கிறது. மனாசேயின் நிலப்பங்கிற்குள் இருந்தாலும் இந்நகரங்கள் எப்பிராயீமுக்கெனத் தனியே ஒதுக்கப்பட்டிருந்ததை இச்சொல் தெரிவிக்கிறது.
- source_word: לִבְנֵי אֶפְרַיִם
  choice: எப்பிராயீமின் சந்ததியினருக்காக
  rationale: בני என்பதன் நேர்ப்பொருள் ‘மகன்கள்’; இங்கு முழுக் கோத்திரத்தையும் குறிக்கும் மரபுவழிச் சொற்றொடர் என்பதால், நவீன தமிழில் உள்ளடக்கமானதும் வம்சத் தொடர்பைக் காப்பதுமான ‘சந்ததியினர்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: בְּתוֹךְ
  choice: உரிமைப்பங்கிற்குள்
  rationale: மற்றொரு கோத்திரத்தின் நிலப்பகுதியின் எல்லைக்குள் அமைந்திருந்ததைக் குறிக்கும் இயல்பான இடவியல் வடிவம்.
- source_word: נַחֲלַת
  choice: உரிமைப்பங்கு
  rationale: נַחֲלָה இங்கு கோத்திரத்துக்கு வாரிசுரிமையாக ஒதுக்கப்பட்ட நிலப்பகுதியைக் குறிக்கிறது. ‘உரிமைப்பங்கு’ என்பது நில ஒதுக்கீடும் பரம்பரை உரிமையும் ஆகிய இரு நுணுக்கங்களையும் சுருக்கமாக வெளிப்படுத்துகிறது.
- source_word: בְּנֵי מְנַשֶּׁה
  choice: மனாசேயின் சந்ததியினர்
  rationale: இது தனிப்பட்ட ஆண் மகன்களை அல்ல, மனாசே கோத்திரத்தை மொத்தமாகக் குறிக்கும் மரபுவழிச் சொற்றொடர்; ஆகவே ‘சந்ததியினர்’ தெளிவான நவீனத் தமிழ் வடிவமாகும்.
- source_word: כָּל הֶעָרִים
  choice: அந்த நகரங்கள் அனைத்தும்
  rationale: כָּל குறிக்கும் முழுமையைத் தெளிவாகக் காட்டுகிறது; முன் குறிப்பிடப்பட்ட நகரங்களையே சுட்டுவதற்கு ‘அந்த’ சேர்க்கப்பட்டது.
- source_word: וְחַצְרֵיהֶן
  choice: அவற்றைச் சேர்ந்த கிராமங்களும்
  rationale: חָצֵר நிலப்பகுதிப் பட்டியல்களில் நகரங்களைச் சார்ந்த சிற்றூர்கள் அல்லது மதிலில்லாத குடியிருப்புகளைக் குறிக்கிறது; ‘அவற்றைச் சேர்ந்த கிராமங்கள்’ அந்த சார்பையும் இயல்பாகத் தெரிவிக்கிறது.
