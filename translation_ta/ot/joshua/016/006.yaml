  register: நவீன நிலையான தமிழில், வேதாகம நிலவியல் எல்லை விவரிப்புக்கு ஏற்ற கண்ணியமான மற்றும் எளிதில் புரியும் நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. இடப்பெயர்கள் எபிரெய உச்சரிப்பை அணுகும் வகையில் ஒலிபெயர்க்கப்பட்டுள்ளன.
