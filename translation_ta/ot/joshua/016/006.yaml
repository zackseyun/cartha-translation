base_translation:
  language: en
  yaml_path: translation/ot/joshua/016/006.yaml
  text: Then the border went out westward to Michmethath on the north[a], and the border turned eastward to Taanath-shiloh, and passed it on the east to Janoah.
translation:
  language: ta
  text: பின்பு எல்லை மேற்கே சென்று, வடக்கிலுள்ள மிக்மெத்தாத்தை அடைந்தது.[a] பின்னர் எல்லை கிழக்கே தானாத்-சீலோவை நோக்கித் திரும்பி, அதன் கிழக்கே கடந்து சென்று யானோவாவை அடைந்தது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லர்த்தமாக, “கடலை நோக்கி”; எபிரெய மொழியில் இது “மேற்கே” என்பதற்கான வழக்குச் சொற்றொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָצָא
  choice: பின்பு ... சென்று
  rationale: எல்லை விவரிப்புகளில் יצא எல்லைக்கோடு தொடர்ந்து நீள்வதைக் குறிக்கிறது. தமிழில் ‘சென்று’ இயல்பாக அந்த நகர்வைத் தெரிவிக்கிறது; தொடக்க வாவ் ‘பின்பு’ எனத் தொடர்ச்சியாக வழங்கப்பட்டுள்ளது.
- source_word: הַגְּבוּל
  choice: எல்லை
  rationale: இங்கு கோத்திரப் பங்கின் எல்லைக்கோடு குறிக்கப்படுகிறது; நவீனத் தமிழில் ‘எல்லை’ தெளிவும் இயல்பும் உடையது.
- source_word: הַיָּמָּה
  choice: மேற்கே
  rationale: சொல்லர்த்தமாக ‘கடலை நோக்கி’ என்றாலும், இது மேற்குத் திசையைக் குறிக்கும் வழக்கமான எபிரெயச் சொற்றொடர். சொல்லர்த்தம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: הַמִּכְמְתָת
  choice: மிக்மெத்தாத்
  rationale: எபிரெய இடப்பெயர் தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: מִצָּפוֹן
  choice: மிக்மெத்தாத்துக்கு வடக்கே
  rationale: இச்சொற்றொடர் மிக்மெத்தாத்துடன் எல்லையின் இடவுறவைக் குறிப்பிடுவதாகப் புரிந்துகொள்ளப்பட்டுள்ளது. ‘வடக்கே’ என்பது இயல்பான தமிழாக்கம்; எபிரெயில் உள்ள ‘இருந்து/வடக்குப் பக்கத்தில்’ என்ற நுண்ணிய இடவியல் தெளிவின்மை முற்றிலும் தீர்க்கப்படவில்லை.
- source_word: וְנָסַב
  choice: திரும்பி
  rationale: எல்லைக்கோடு திசை மாறுவதை נסב குறிக்கிறது; ‘திரும்பி’ சுருக்கமான இயல்பான இணை.
- source_word: מִזְרָחָה
  choice: கிழக்கே
  rationale: திசை நோக்கிய நகர்வைத் தெளிவாகக் காட்டுகிறது.
- source_word: תַּאֲנַת שִׁלֹה
  choice: தானாத்-சீலோ
  rationale: கூட்டு இடப்பெயர் தமிழில் ஒலிபெயர்க்கப்பட்டு இணைப்புக்குறியுடன் தரப்பட்டுள்ளது.
- source_word: וְעָבַר אֹתוֹ מִמִּזְרַח
  choice: அதன் கிழக்குப் பக்கமாகக் கடந்து
  rationale: எல்லை தானாத்-சீலோவின் கிழக்குப் பக்கமாகத் தொடர்ந்து சென்றதைக் காட்டும் இயல்பான தமிழ். עבר என்பதன் நகர்வு உணர்வும் אֹתוֹ என்பதன் இடப்பெயர் சுட்டலும் காக்கப்படுகின்றன.
- source_word: יָנוֹחָה
  choice: யானோவா
  rationale: இடப்பெயரின் எபிரெய வடிவம் தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளது; இறுதி திசைச் சுட்டு தமிழில் ‘அடைந்தது’ என்ற இயல்பான இலக்காக வெளிப்படுத்தப்பட்டுள்ளது.
