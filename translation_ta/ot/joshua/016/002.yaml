base_translation:
  language: en
  yaml_path: translation/ot/joshua/016/002.yaml
  text: Then it went out from Bethel to Luz[a], and passed on to the border of the Arkites at Ataroth.
translation:
  language: ta
  text: பின்பு அந்த எல்லை பெத்தேலிலிருந்து லூசுக்குச் சென்று, அர்கியரின்[a] எல்லையாகிய அதரோத்துக்குச் சென்றது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அர்க்கியரின்.” எபிரெய இனப்பெயரான הָאַרְכִּי-யை ஒலிபெயர்க்கும் மற்றொரு முறை.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָצָא
  choice: பின்பு அந்த எல்லை ... சென்றது
  rationale: முந்தைய வசனத்தில் விவரிக்கப்படும் எல்லைக்கோடே மறைமுக எழுவாய். தமிழில் பொருள் தெளிவாக இருக்க ‘அந்த எல்லை’ வெளிப்படையாகச் சேர்க்கப்பட்டது; வாவ் தொடர்ச்சியை ‘பின்பு’ இயல்பாகக் காட்டுகிறது.
- source_word: מִבֵּית אֵל
  choice: பெத்தேலிலிருந்து
  rationale: בֵּית אֵל என்ற இடப்பெயரின் தமிழ் வேதாகம மரபில் பரவலாக அறியப்படும் ஒலிபெயர்ப்பு.
- source_word: לוּזָה
  choice: லூசுக்கு
  rationale: இறுதியில் உள்ள திசை குறிக்கும் ה, லூசை நோக்கிய நகர்வைக் காட்டுவதால் தமிழ் வேற்றுமை உருபுடன் மொழிபெயர்க்கப்பட்டது.
- source_word: וְעָבַר
  choice: கடந்து சென்றது
  rationale: எல்லைப் பாதையின் தொடர்ச்சியை עבר குறிக்கிறது. ‘கடந்து சென்றது’ அதன் நகர்வையும் எல்லை விவரிப்பையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: אֶל גְּבוּל
  choice: எல்லையை
  rationale: גְּבוּל இங்கு நிலப்பகுதியின் எல்லையைக் குறிக்கிறது; עבר உடன் இயல்பான தமிழ் வாக்கிய அமைப்புக்காக செயப்படுபொருள் வடிவில் கொடுக்கப்பட்டது.
- source_word: הָאַרְכִּי
  choice: அர்கியரின்
  rationale: இது ஓர் இனக்குழு அல்லது குலத்தைச் சுட்டும் பெயரடைப் பெயர். தமிழில் கூட்டத்தைக் குறிக்கும் மரியாதையான பன்மை வடிவம் பயன்படுத்தப்பட்டது.
- source_word: עֲטָרוֹת
  choice: அதரோத்தில்
  rationale: இடப்பெயர் தமிழ் ஒலியமைப்புக்கு ஏற்றவாறு ஒலிபெயர்க்கப்பட்டு, எல்லை அமைந்த இடம் என்பதைக் காட்ட இடவேற்றுமை சேர்க்கப்பட்டது.
