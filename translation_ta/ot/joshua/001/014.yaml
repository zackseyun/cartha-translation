base_translation:
  language: en
  yaml_path: translation/ot/joshua/001/014.yaml
  text: Your wives[a], your little ones, and your livestock shall remain in the land that Moses gave you beyond the Jordan. But you shall cross over before your brothers, armed, all the mighty men of valor[b], and you shall help them.
translation:
  language: ta
  text: உங்கள் மனைவிகளும் சிறு பிள்ளைகளும் கால்நடைகளும், யோர்தானுக்கு அப்பால் மோசே உங்களுக்குக் கொடுத்த நாட்டில் தங்கியிருக்கட்டும். ஆனால் நீங்கள் அனைவரும், வலிமைமிக்க போர்வீரர்களாய், ஆயுதம் ஏந்தி[b] உங்கள் சகோதரர்களுக்கு[a] முன்பாகக் கடந்து சென்று, அவர்களுக்கு உதவி செய்யுங்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உங்கள் சக இஸ்ரவேலருக்கு.” எபிரெயம் ஆண்பால் உறவுமுறைச் சொல்லைப் பிரதிநிதித்துவப் பொருளில் பயன்படுத்துகிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “போர் அணிவகுப்பில்” அல்லது “போருக்குத் தயாராய் அணிவகுத்து.”
    reason: alternative_reading
lexical_decisions:
- source_word: נְשֵׁיכֶם
  choice: உங்கள் மனைவிகள்
  rationale: இந்தக் குடும்ப மற்றும் படைச் சூழலில் இச்சொல் பொதுவாகப் பெண்களை அல்ல, ஆண்களின் மனைவிகளைக் குறிக்கிறது.
- source_word: טַפְּכֶם
  choice: உங்கள் சிறு பிள்ளைகள்
  rationale: טַף என்பது சிறு பிள்ளைகள் அல்லது சார்ந்திருப்போரைக் குறிக்கலாம்; இங்கு வயதை அளவுக்கு மீறிக் குறிப்பாக்காமல் அதன் நேரடியான குடும்பப் பொருள் தரப்பட்டுள்ளது.
- source_word: וּמִקְנֵיכֶם
  choice: உங்கள் கால்நடைகள்
  rationale: מִקְנֶה இங்கு வளர்ப்பு விலங்குகளையும் மந்தைகளையும் குறிக்கிறது; நவீன தமிழில் ‘கால்நடைகள்’ இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: יֵשְׁבוּ
  choice: தங்கியிருக்கட்டும்
  rationale: குடும்பத்தாரும் கால்நடைகளும் ஒதுக்கப்பட்ட நிலப்பகுதியில் பின்னால் தங்கியிருப்பதைச் சூழலுக்கேற்ற இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: בָּאָרֶץ
  choice: நாட்டில்
  rationale: אֶרֶץ இங்கு குடியேறுவதற்குக் கொடுக்கப்பட்ட நிலப்பகுதியைக் குறிக்கிறது; ‘நாடு’ தமிழில் தெளிவாக உள்ளது.
- source_word: אֲשֶׁר נָתַן לָכֶם מֹשֶׁה
  choice: மோசே உங்களுக்குக் கொடுத்த
  rationale: எபிரெய வினை முடிவுற்ற செயலைக் குறிப்பதால் தமிழில் இறந்தகால வடிவம் பயன்படுத்தப்பட்டுள்ளது.
- source_word: בְּעֵבֶר הַיַּרְדֵּן
  choice: யோர்தானுக்கு அப்பால்
  rationale: עֵבֶר என்பது யோர்தானின் மறுபுறப் பகுதியைக் குறிக்கிறது; மூலத்தில் உள்ள பார்வைத் திசையைத் தீர்மானிக்காமல் ‘அப்பால்’ பாதுகாக்கிறது.
- source_word: וְאַתֶּם תַּעַבְרוּ
  choice: ஆனால் ... நீங்கள் ... கடந்து சென்று
  rationale: பின்னால் தங்குபவர்களுக்கும் முன்னே செல்கிற போர்வீரர்களுக்கும் உள்ள முரண்பாட்டை ‘ஆனால்’ தெளிவாக்குகிறது; எதைக் கடக்கிறார்கள் என்பது உடனடி சூழலிலுள்ள யோர்தானிலிருந்து புரிகிறது.
- source_word: חֲמֻשִׁים
  choice: ஆயுதம் தரித்தவர்களாய்
  rationale: படைச் சூழலில் இச்சொல்லுக்கு ஆயுதம் ஏந்திய அல்லது போருக்கு அணிவகுத்த நிலை என்பதே மிகச் சாத்தியமான பொருள்; முதன்மைப் பொருள் உரையில் தரப்பட்டு மாற்று நுட்பங்கள் அடிக்குறிப்பில் வைக்கப்பட்டுள்ளன.
- source_word: לִפְנֵי אֲחֵיכֶם
  choice: உங்கள் சகோதரர்களுக்கு முன்னால்
  rationale: சக இஸ்ரவேலருக்கு முன்னணியில் செல்வதைச் சொல்லும் எபிரெய மொழிநடையை இயல்பான தமிழில் பாதுகாக்கிறது.
- source_word: אֲחֵיכֶם
  choice: உங்கள் சகோதரர்கள்
  rationale: மூலத்தின் ஆண்பால் உறவுமுறைச் சொல் அப்படியே வைக்கப்பட்டுள்ளது; அது இங்கு விரிவாக சக இஸ்ரவேலரைக் குறிக்கும் என்பதை அடிக்குறிப்பு விளக்குகிறது.
- source_word: כֹּל גִּבּוֹרֵי הַחַיִל
  choice: வலிமைமிக்க போர்வீரர்களான நீங்கள் அனைவரும்
  rationale: இத்தொடர் திறனும் வீரமும் கொண்ட போரிடும் ஆண்களைக் குறிக்கிறது; தமிழில் மரியாதையான, தெளிவான படைச் சொல்லாக்கம் பயன்படுத்தப்பட்டுள்ளது.
- source_word: וַעֲזַרְתֶּם אוֹתָם
  choice: அவர்களுக்கு உதவ வேண்டும்
  rationale: கட்டளையின் தொடர்ச்சியை நவீன தமிழில் இயல்பான கடமை வடிவில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: אֲחֵיכֶם என்பதிலுள்ள பாலினம் குறித்த உறவுமுறை மொழி
  choice: உங்கள் சகோதரர்கள்
  alternative: உங்கள் சக இஸ்ரவேலர்
  rationale: எபிரெயம் ஆண்பால் பன்மை உறவுமுறைச் சொல்லைப் பயன்படுத்தினாலும், அது உடன்படிக்கைச் சமூகத்திலுள்ள சக இஸ்ரவேலரைப் பிரதிநிதித்துவமாகக் குறிக்கிறது. மூலச் சொல்லை முதன்மை உரையில் காத்து, அதன் விரிவான குறிப்பை அடிக்குறிப்பில் தெரிவித்துள்ளோம்.
- issue: חֲמֻשִׁים என்ற படைச் சொல்லின் துல்லியமான நுட்பம்
  choice: ஆயுதம் தரித்தவர்களாய்
  alternative: போர் அணிவகுப்பில் / போருக்குத் தயாராய் அணிவகுத்து
  rationale: இச்சூழலில் போருக்கு ஆயுதம் ஏந்திய நிலையே மிகச் சாத்தியமான பொருள். எனினும் அணிவகுப்பு சார்ந்த நுட்பமும் சாத்தியமாதலால் அது அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் மரியாதையான நடை பயன்படுத்தப்பட்டுள்ளது. குடும்பத்தார் பின்னால் தங்குவதற்கும் போர்வீரர்கள் முன்னால் கடந்து செல்வதற்கும் இடையிலான வேறுபாடு இயல்பாகத் தெளிவாக்கப்பட்டுள்ளது. மூலத்தின் சொல்வரிசை தமிழின் இயல்புக்கேற்ப சற்றே மாற்றப்பட்டாலும் எல்லா கருத்துக் கூறுகளும் பாதுகாக்கப்பட்டுள்ளன.
