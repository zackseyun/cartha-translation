revisions:
- from: வனாந்தரத்திலிருந்தும் இந்த லெபனோனிலிருந்தும் பெரிய நதியாகிய யூபிராத்து நதிவரையிலும்—ஏத்தியர்களின் நாடு முழுவதும்—பெருங்கடல்[a] வரையிலும், சூரியன் மறையும் திசையை நோக்கி[b], உங்கள் எல்லை இருக்கும்.
  to: வனாந்தரமும் இந்த லெபனோனும் தொடங்கி, பெரிய நதியாகிய யூபிராத்து நதிவரையும், ஏத்தியரின் நாடு முழுவதும், சூரியன் மறையும் திசையில் உள்ள பெருங்கடல்[a] வரையும் உங்கள் எல்லை இதுவாக இருக்கும்.[b]
  rationale: The revision preserves every geographic element and the Hebrew demonstrative ‘this.’ It improves Tamil boundary-list syntax and directly links the sunset expression to the Great Sea. Footnote b remains anchored at the end of the clause because the main-text wording ‘சூரியன் மறையும் திசையில்’ expresses the same Hebrew idiom, while the note supplies both the conventional directional alternative and the literal sense.
