base_translation:
  language: en
  yaml_path: translation/ot/joshua/001/004.yaml
  text: From the wilderness and this Lebanon as far as the great river[a], the Euphrates River—all the land of the Hittites—and as far as the Great Sea, toward the going down of the sun[b], shall be your border.
translation:
  language: ta
  text: வனாந்தரமும் இந்த லெபனோனும் தொடங்கி, பெரிய நதியாகிய யூபிராத்து நதிவரையும், ஏத்தியரின் நாடு முழுவதும், சூரியன் மறையும் திசையில் உள்ள பெருங்கடல்[a] வரையும் உங்கள் எல்லை இதுவாக இருக்கும்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அதாவது, மத்தியதரைக் கடல்.
    reason: cross_reference
  - marker: b
    text: அல்லது, “மேற்கு நோக்கி”; சொல்லுக்கு நேராக, “சூரியன் மறையும் திசையை நோக்கி.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵהַמִּדְבָּר
  choice: வனாந்தரத்திலிருந்து
  rationale: מִדְבָּר என்பது குடியிருப்புகள் குறைந்த வறண்ட நிலப்பகுதியைக் குறிக்கிறது. வேதாகமப் புவியியல் சூழலில் இயல்பாகப் புரியும் ‘வனாந்தரம்’ என்பதைத் தேர்ந்தெடுத்தோம்; குறிப்பிட்ட பாலைவனமாக மிகையாக வரையறுக்கவில்லை.
- source_word: וְהַלְּבָנוֹן הַזֶּה
  choice: இந்த லெபனோனிலிருந்து
  rationale: எபிரெயத்தில் வெளிப்படையாக உள்ள הַזֶּה (‘இந்த’) பாதுகாக்கப்பட்டுள்ளது. லெபனோன் என்ற புவியியல் பெயர் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: וְעַד הַנָּהָר הַגָּדוֹל נְהַר פְּרָת
  choice: பெரிய நதியாகிய யூபிராத்து நதிவரையிலும்
  rationale: ‘பெரிய நதி’ என்பதைக் ‘யூபிராத்து நதி’ என அடையாளப்படுத்தும் எபிரெய இணைப்பமைப்பு தமிழில் ‘ஆகிய’ மூலம் தெளிவாகப் பாதுகாக்கப்பட்டுள்ளது; עַד எல்லையின் நீட்சியை ‘வரையிலும்’ எனக் காட்டுகிறது.
- source_word: כֹּל אֶרֶץ הַחִתִּים
  choice: ஏத்தியர்களின் நாடு முழுவதும்
  rationale: כֹּל என்பதின் முழுமை வலியுறுத்தப்படுகிறது; இன-புவியியல் பெயர் விளக்கக் குறுக்கீடின்றி ‘ஏத்தியர்கள்’ என வழங்கப்படுகிறது.
- source_word: וְעַד הַיָּם הַגָּדוֹל
  choice: பெருங்கடல் வரையிலும்
  rationale: எபிரெயத்தின் ‘பெரிய கடல்’ என்ற பாரம்பரியப் புவியியல் பெயர் இயல்பான தமிழில் ‘பெருங்கடல்’ எனப் பாதுகாக்கப்பட்டுள்ளது. அது மத்தியதரைக் கடலைக் குறிக்கும் தகவல் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: מְבוֹא הַשָּׁמֶשׁ
  choice: சூரியன் மறையும் திசையை நோக்கி
  rationale: இச்சொற்றொடர் மேற்குத் திசையைக் குறிக்கும் மரபுத்தொடராக இருந்தாலும், மூலத்தின் சூரிய மறைவு உருவகம் முதன்மை உரையில் பாதுகாக்கப்பட்டுள்ளது; ‘மேற்கு’ என்ற பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: יִהְיֶה גְּבוּלְכֶם
  choice: உங்கள் எல்லை இருக்கும்
  rationale: גְּבוּל இங்கு எல்லை வரம்பைக் குறிக்கிறது. எபிரெய இறந்தகாலமல்லாத வினையின் வாக்குறுதி/அறிவிப்பு நயம் தமிழில் இயல்பான ‘இருக்கும்’ என்பதால் வெளிப்படுகிறது.
