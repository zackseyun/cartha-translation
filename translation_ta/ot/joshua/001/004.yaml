translation_notes:
  register: நவீன செந்தமிழ் சார்ந்த, பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. எல்லைப் பட்டியலின் நீண்ட வாக்கிய அமைப்பைத் தெளிவாக்க இடைக்கோடுகள் பயன்படுத்தப்பட்டுள்ளன; மூலத்தின் புவியியல் பெயர்களும் சூரிய மறைவு உருவகமும் பாதுகாக்கப்பட்டுள்ளன.
