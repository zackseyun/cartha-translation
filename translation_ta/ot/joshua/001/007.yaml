  text: רַק֩ חֲזַ֨ק וֶֽ/אֱמַ֜ץ מְאֹ֗ד לִ/שְׁמֹ֤ר לַ/עֲשׂוֹת֙ כְּ/כָל הַ/תּוֹרָ֗ה אֲשֶׁ֤ר צִוְּ/ךָ֙ מֹשֶׁ֣ה עַבְדִּ֔/י אַל תָּס֥וּר מִמֶּ֖/נּוּ יָמִ֣ין וּ/שְׂמֹ֑אול לְמַ֣עַן תַּשְׂכִּ֔יל בְּ/כֹ֖ל אֲשֶׁ֥ר תֵּלֵֽךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/001/007.yaml
  text: Only be strong and very courageous[a], being careful to do according to all the law that Moses my servant commanded you. Do not turn from it to the right or to the left, so that you may act wisely wherever you go.
translation:
  language: ta
  text: முக்கியமாக, நீ மிகவும் வலிமையுடனும் துணிவுடனும் இரு. என் ஊழியனாகிய மோசே உனக்குக் கட்டளையிட்ட முழுச் சட்டத்தின்படி கவனமாகச் செயல்படு. அதைவிட்டு வலப்புறமோ இடப்புறமோ விலகாதே; நீ செல்லும் இடமெல்லாம் விவேகமாகச் செயல்படும்படி அவ்வாறு செய்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நீ செல்லும் இடமெல்லாம் செழிப்படையும்படி” அல்லது “வெற்றி பெறும்படி.”
    reason: תַּשְׂכִּיל என்பது விவேகமாகச் செயல்படுதல் என்ற முதன்மைப் பொருளுடன், செழிப்பு அல்லது வெற்றி என்ற விளைவுப் பொருளையும் குறிக்கக்கூடும்.
lexical_decisions:
- source_word: רַק
  choice: இருப்பதில் மட்டும் உறுதியாயிரு
  rationale: רַק கொடுக்கும் கட்டுப்படுத்தும் வலியுறுத்தலைத் தமிழில் தவறான சொல்லழுத்தமின்றி இயல்பாக வெளிப்படுத்துகிறது; ‘நீ மட்டும்’ என்று மொழிபெயர்த்தால் யோசுவாவையே தனிப்படுத்தும் தவறான பொருள் உண்டாகும்.
- source_word: חֲזַק וֶאֱמַץ מְאֹד
  choice: மிகவும் வலிமையுடனும் துணிவுடனும் இரு
  rationale: இரட்டை ஏவல்களின் உட்பொருளான வலிமையையும் மனத்துணிவையும் காத்து, מְאֹד என்பதன் தீவிரத்தை ‘மிகவும்’ என இயல்பாகத் தருகிறது.
- source_word: לִשְׁמֹר לַעֲשׂוֹת
  choice: கவனமாகச் செயல்படு
  rationale: கவனித்துக் காத்தல் மற்றும் அதன்படி செய்தல் ஆகிய இரு கருத்துகளையும், அடுத்துள்ள ‘சட்டத்தின்படியும்’ என்பதோடு சேர்ந்து, தெளிவான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: כְּכָל הַתּוֹרָה
  choice: முழுச் சட்டத்தின்படியும்
  rationale: இச்சூழலில் תּוֹרָה மோசே வழங்கிய உடன்படிக்கைச் சட்டத்தைக் குறிக்கிறது; כְּכָל அதன் முழுமையையும் அதற்கேற்ப நடக்க வேண்டியதையும் வலியுறுத்துகிறது.
- source_word: אֲשֶׁר צִוְּךָ מֹשֶׁה עַבְדִּי
  choice: என் ஊழியனாகிய மோசே உனக்குக் கட்டளையிட்ட
  rationale: உறவுப்பெயரெச்சத் தொடரையும், மோசேக்கு வழங்கப்படும் இறை அடையாளமான ‘என் ஊழியன்’ என்பதையும் நேரடியாகக் காக்கிறது.
- source_word: אַל תָּסוּר מִמֶּנּוּ יָמִין וּשְׂמֹאול
  choice: அதைவிட்டு வலப்புறமோ இடப்புறமோ விலகாதே
  rationale: குறிக்கப்பட்ட பாதையிலிருந்து எந்தத் திசையிலும் பிறழக்கூடாது என்ற எபிரெய உருவகத்தை இயல்பான தமிழில் காக்கிறது.
- source_word: לְמַעַן
  choice: செயல்படும்படி
  rationale: நோக்கம் அல்லது விளைவைச் சுட்டும் எபிரெய இணைப்பைத் தமிழில் இயல்பான நோக்கத் தொடராக வழங்குகிறது; இவ்விரு நுணுக்கங்களையும் தேவையின்றி கடுமையாகப் பிரிக்கவில்லை.
- source_word: תַּשְׂכִּיל
  choice: விவேகமாகச் செயல்பட
  rationale: שׂכל என்பதன் ஹிபில் வடிவின் முதன்மையான விவேகத்துடன் செயல்படும் கருத்தை முன்னிறுத்துகிறது; அதனால் விளையும் வெற்றி அல்லது செழிப்பு என்ற சாத்திய நுணுக்கம் அடிக்குறிப்பில் காக்கப்படுகிறது.
- source_word: בְּכֹל אֲשֶׁר תֵּלֵךְ
  choice: நீ செல்லும் இடமெல்லாம்
  rationale: הלך என்பதன் ‘செல்’ என்ற நேரடிப் பொருளையும், בְּכֹל என்பதன் அனைத்தையும் உள்ளடக்கும் பரப்பையும் இயல்பாகத் தருகிறது.
theological_decisions:
- issue: உடன்படிக்கைச் சூழலில் תּוֹרָה என்பதன் பொருள்
  choice: சட்டம்
  alternative: போதனை / அறிவுரை
  rationale: இங்கு மோசே கட்டளையிட்ட முழுத் தொகுப்பே நேரடியாகக் குறிப்பிடப்படுவதால், உடன்படிக்கை மற்றும் சட்ட நுணுக்கமுள்ள ‘சட்டம்’ முதன்மையானது; பரந்த ‘போதனை’ என்ற பொருள் இச்சூழலில் குறைவான துல்லியம் உடையது.
- issue: תַּשְׂכִּיל என்பதன் பொருள்
  choice: விவேகமாகச் செயல்படுதல்
  alternative: செழிப்படைதல் / வெற்றி பெறுதல்
  rationale: எபிரெயச் சொல் விவேகமான அல்லது திறமையான செயலையும், அதன் விளைவாக வரும் வெற்றியையும் குறிக்கக்கூடும். பொருளாதாரச் செழிப்பைத் தேவையின்றி முதன்மைப்படுத்தாமல், மூலத்தின் உண்மையான மாற்றுப் பொருளை அடிக்குறிப்பில் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் மரியாதைமிக்க நடையில் வடிவமைக்கப்பட்டது. ‘ஊழியன்’ மற்றும் ‘சட்டம்’ ஆகியவை வேதாகமச் சூழலின் கண்ணியத்தையும் உடன்படிக்கைத் தன்மையையும் காக்கின்றன; தேவையற்ற பழமையான வினைமுறைகள் தவிர்க்கப்பட்டுள்ளன.
