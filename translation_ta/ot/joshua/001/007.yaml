  to: முக்கியமாக, நீ மிகவும் வலிமையுடனும் துணிவுடனும் இரு. என் ஊழியனாகிய மோசே உனக்குக் கட்டளையிட்ட முழுச் சட்டத்தின்படி கவனமாகச் செயல்படு. அதைவிட்டு வலப்புறமோ இடப்புறமோ விலகாதே; நீ செல்லும் இடமெல்லாம் விவேகமாகச் செயல்படும்படி அவ்வாறு செய்.[a]
