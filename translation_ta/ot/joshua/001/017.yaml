source:
  edition: WLC
  text: כְּ/כֹ֤ל אֲשֶׁר שָׁמַ֨עְנוּ֙ אֶל מֹשֶׁ֔ה כֵּ֖ן נִשְׁמַ֣ע אֵלֶ֑י/ךָ רַ֠ק יִֽהְיֶ֞ה יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ עִמָּ֔/ךְ כַּ/אֲשֶׁ֥ר הָיָ֖ה עִם מֹשֶֽׁה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/001/017.yaml
  text: Just as we listened to Moses in everything[a], so we will listen to you. Only may Yahweh your God be with you, just as he was with Moses.
translation:
  language: ta
  text: 'நாங்கள் மோசேக்குச் எல்லாவற்றிலும் செவிகொடுத்ததுபோலவே, உமக்குச் செவிகொடுப்போம்.[a] ஒரே வேண்டுதல்: யாவே, உமது கடவுள், மோசேயோடு இருந்ததுபோல உம்மோடும் இருப்பாராக.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நாங்கள் மோசேக்குக் எல்லாவற்றிலும் கீழ்ப்படிந்ததுபோலவே, உமக்கும் கீழ்ப்படிவோம்.” எபிரெய வினைச்சொல் சூழலைப் பொறுத்து ‘செவிகொடு’ என்றும் ‘கீழ்ப்படி’ என்றும் பொருள்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמַעְנוּ / נִשְׁמַע
  choice: செவிகொடுத்தோம் / செவிகொடுப்போம்
  rationale: שׁמע இங்கு ஒருவருக்குச் செவிகொடுத்து அவர் சொல்வதன்படி நடப்பதையும் உட்பொருளாகக் கொண்டுள்ளது. ‘செவிகொடு’ என்ற மொழிபெயர்ப்பு கேட்பது என்ற அடிப்படைப் பொருளையும் கீழ்ப்படிதல் என்ற சூழல்சார் நுட்பத்தையும் தக்கவைக்கிறது.
- source_word: כְּכֹל אֲשֶׁר
  choice: எல்லாவற்றிலும் ... போலவே
  rationale: இந்த அமைப்பு ஒப்பீட்டையும் முழுமையான வரம்பையும் தெரிவிக்கிறது; இயல்பான தமிழ் நடையில் இரண்டையும் இச்சொற்றொடர் வெளிப்படுத்துகிறது.
- source_word: רַק
  choice: 'ஒன்று மட்டும்:'
  rationale: அடுத்து வரும் விருப்பத்தை உறுதிமொழிக்கான ஒரே வேண்டுதலாக அல்லது வரையறையாக அறிமுகப்படுத்தும் எபிரெயச் சொல்லின் ஆற்றலை இயல்பான தமிழில் காட்டுகிறது.
- source_word: יִהְיֶה
  choice: இருப்பாராக
  rationale: இங்கு இது சாதாரண எதிர்காலக் கூற்றாக இல்லாமல் ஒரு விருப்பம் அல்லது வேண்டுதலை வெளிப்படுத்துகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைத் திருப்பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழ் ஒலிமுறைக்கு ஏற்ற வகையில் பெயராகப் பதிக்கிறது.
- source_word: אֱלֹהֶיךָ
  choice: உமது கடவுள்
  rationale: இரண்டாம் நபர் ஆண்பால் ஒருமை உடைமைப் பின்னொட்டை மரியாதை ஒருமையுடன் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: עִמָּךְ / עִם
  choice: உம்மோடும் / மோசேயோடு
  rationale: עִם குறிக்கும் உடனிருப்பைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: כַּאֲשֶׁר
  choice: இருந்ததுபோல
  rationale: மோசேயுடன் யாவே இருந்ததையும் யோசுவாவுடன் அவர் இருக்க வேண்டும் என்பதையும் நேரடியாக ஒப்பிடுகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைத் திருப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூல உரை இறைவனின் தனிப்பட்ட திருப்பெயரை நேரடியாகப் பயன்படுத்துகிறது. எனவே அதை ஒரு பட்டமாக மாற்றாமல், ‘Yahweh’ என்பதற்கான இயல்பான தமிழ் ஒலிபெயர்ப்பாகத் தரப்பட்டுள்ளது.
- issue: שׁמע என்பதில் கேட்பதும் கீழ்ப்படிவதும் கொண்டுள்ள உறவு
  choice: செவிகொடு; மாற்றுப் பொருளை அடிக்குறிப்பில் குறிப்பிடுதல்
  alternative: கீழ்ப்படி
  rationale: இச்சூழலில் கீழ்ப்படிதல் தெளிவாக உட்பொருளாக இருந்தாலும், எபிரெயச் சொல்லின் உண்மையான பொருள் விரிவை ஒரே பொருளாகச் சுருக்காமல் தக்கவைக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. யோசுவாவை நோக்கிய ஒருமை உரைக்கு மரியாதை வடிவங்களான ‘உமது’, ‘உமக்கு’, ‘உம்மோடு’ பயன்படுத்தப்பட்டுள்ளன. ‘ஒன்று மட்டும்:’ என்பது רַק அறிமுகப்படுத்தும் வரையறை அல்லது வேண்டுதலைச் சுருக்கமாகவும் இயல்பாகவும் காட்டுகிறது.
