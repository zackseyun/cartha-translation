translation_notes:
  register: நவீன நிலையான தமிழில் எளிமையான, கண்ணியமான உரைநடை பயன்படுத்தப்பட்டுள்ளது. யோசுவாவை மரியாதையுடன் ஒருமையில் குறிப்பிட நவீன வழக்கிலுள்ள ‘நீங்கள்’ வடிவம் தேர்ந்தெடுக்கப்பட்டது; மூலத்தின் வாக்குறுதி வலிமையும் இரு இணையான கூற்றுகளின் அமைப்பும் பாதுகாக்கப்பட்டுள்ளன.
