  yaml_path: translation/ot/joshua/001/016.yaml
  text: And they answered Joshua[a], saying, “All that you have commanded us we will do, and wherever you send us we will go.”
translation:
  language: ta
  text: 'அவர்கள் யோசுவாவிடம் இவ்வாறு பதிலளித்தார்கள்: “நீங்கள் எங்களுக்குக் கட்டளையிட்ட அனைத்தையும் நாங்கள் செய்வோம்; எங்களை எங்கு அனுப்பினாலும்[a] அங்கு செல்வோம்.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'சொல்லுக்கு இன்னும் நெருக்கமாக: “நீங்கள் எங்களை அனுப்பும் ஒவ்வோர் இடத்திற்கும் நாங்கள் செல்வோம்.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲנוּ אֶת־יְהוֹשֻׁעַ לֵאמֹר
  choice: அவர்கள் யோசுவாவிடம் இவ்வாறு பதிலளித்தார்கள்
  rationale: ענה என்பதன் கால் wayyiqtol வடிவம் கதைநடையில் ஒரு பதிலை அறிமுகப்படுத்துகிறது. எபிரெய நேரடி-பொருள் குறியீடு இங்கு பதில் யோசுவாவை நோக்கிச் சொல்லப்பட்டதைக் காட்டுகிறது; לֵאמֹר என்பதையும் இயல்பான தமிழ் மேற்கோள் அறிமுகத்தில் ‘இவ்வாறு’ என்பதன் மூலம் வெளிப்படுத்துகிறது.
- source_word: כֹּל אֲשֶׁר צִוִּיתָנוּ
  choice: நீங்கள் எங்களுக்குக் கட்டளையிட்ட அனைத்தையும்
  rationale: כֹּל אֲשֶׁר கட்டளைகளின் முழுத் தொகுதியையும் குறிக்கிறது; צוה அதிகாரப்பூர்வமாகக் கட்டளையிடுதலைக் குறிக்கும். மரியாதையான நவீன தமிழில் ஒருமை முகவரியை ‘நீங்கள்’ என வழங்கியுள்ளது.
- source_word: נַעֲשֶׂה
  choice: நாங்கள் செய்வோம்
  rationale: עשה இங்கு கொடுக்கப்பட்ட கட்டளைகளைச் செய்வது அல்லது நிறைவேற்றுவது என்ற நேரடியான பொருளைக் கொண்டது. ‘செய்வோம்’ சுருக்கமாகவும் இயல்பாகவும் உள்ளது.
- source_word: וְאֶל כָּל אֲשֶׁר תִּשְׁלָחֵנוּ
  choice: எங்களை எங்கு அனுப்பினாலும்
  rationale: சொல்லுக்கு நெருக்கமாக இது ‘நீர் எங்களை அனுப்பும் ஒவ்வோர் இடத்திற்கும்’ என அமையும். שלח மற்றும் הלך உடன் வரும் இத்தொடர் எந்த இடத்திற்கு அனுப்பப்பட்டாலும் என்ற இடப்பொருளைத் தருவதால், ‘எங்கு ... அனுப்பினாலும்’ இயல்பான தமிழில் அதைப் பாதுகாக்கிறது.
- source_word: נֵלֵךְ
  choice: அங்கு செல்வோம்
  rationale: הלך என்பதன் அடிப்படைப் பொருள் ‘செல்’. முந்தைய இடப்பொருளோடு தமிழில் வாக்கியம் இயல்பாக இணைய ‘அங்கு’ சேர்க்கப்பட்டுள்ளது; இது மூலத்தில் ஏற்கெனவே உட்பொருளாக உள்ளது.
