  text: Every man who rebels against your command and does not listen to your words in all that you command him shall be put to death[a]. Only be strong and courageous.
translation:
  language: ta
  text: உன் கட்டளையை எதிர்த்து, நீ அவனுக்குக் கட்டளையிடுகிற எதிலும் உன் வார்த்தைகளுக்குச் செவிகொடுக்காத ஒவ்வொரு மனிதனும் கொல்லப்பட வேண்டும்.[a] நீயோ வலிமையுடனும் துணிவுடனும் இரு.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொற்சொல்லாக, “உன் வாயை எதிர்க்கிற ஒவ்வொரு மனிதனும்.” “உன் வாய்” என்ற எபிரெய மரபுத்தொடர் உன் கட்டளையை அல்லது அதிகாரபூர்வமான சொல்லைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל אִישׁ
  choice: ஒவ்வொரு மனிதனும்
  rationale: எபிரெயச் சொற்றொடரின் பகிர்ந்தளிக்கும் வலிமையையும் ஆண்பால் ஒருமை வடிவையும் இயல்பான தமிழில் காக்கிறது.
- source_word: יַמְרֶה
  choice: எதிர்த்து
  rationale: அதிகாரத்திற்கு எதிரான கலகம் அல்லது கீழ்ப்படியாமையைச் சுட்டுகிறது; வெறும் ‘கீழ்ப்படியாமை’ என்பதைவிட எதிர்ப்பின் வலிமையைக் காக்கிறது.
- source_word: אֶת פִּיךָ
  choice: உன் கட்டளையை
  rationale: சொல்லெழுத்தாக ‘உன் வாயை’ என்றாலும், இங்கு அது அதிகாரபூர்வமான சொல் அல்லது கட்டளையைக் குறிக்கும் எபிரெய மரபுத்தொடர்.
- source_word: וְלֹא יִשְׁמַע אֶת דְּבָרֶיךָ
  choice: உன் வார்த்தைகளுக்குச் செவிகொடுக்காத
  rationale: שׁמע என்பதின் கேட்பது, கவனிப்பது, கீழ்ப்படிவது ஆகிய பொருள் நிழல்களைத் தக்கவைத்து, முன்புள்ள ‘எதிர்த்து’ என்பதுடன் தேவையற்ற மறுபடிவைத் தவிர்க்கிறது.
- source_word: לְכֹל אֲשֶׁר תְּצַוֶּנּוּ
  choice: நீ அவனுக்குக் கட்டளையிடுகிற எதிலும்
  rationale: தேவையான கீழ்ப்படிதலின் முழு எல்லையையும் இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: יוּמָת
  choice: கொல்லப்பட வேண்டும்
  rationale: இது வெறுமனே இறப்பதைக் குறிக்காமல், விதிக்கப்படும் மரண தண்டனையைக் குறிக்கும் செயப்பாட்டு வடிவம்.
- source_word: רַק
  choice: மட்டும்
  rationale: யோசுவாவை நோக்கிய வலியுறுத்தும், வரையறுக்கும் அறிவுறுத்தல் மாறுதலைச் சுருக்கமாக வெளிப்படுத்துகிறது.
- source_word: חֲזַק וֶאֱמָץ
  choice: வலிமையுடனும் துணிவுடனும் இரு
  rationale: யோசுவா நூலில் மீண்டும் வரும் அறிவுறுத்தலின் உடல்/உள வலிமை மற்றும் திடத்துணிவு ஆகிய இரு கூறுகளையும் இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: பிரதிநிதித்துவ ஆண்பால் மொழி
  choice: ஒவ்வொரு மனிதனும்
  alternative: எவரும்
  rationale: אִישׁ என்ற ஆண்பால் ஒருமைச் சொல்லையும் அதன் பகிர்ந்தளிக்கும் அமைப்பையும் மறைக்காமல் காக்கிறது; அதேவேளை தமிழில் புரிந்துகொள்ளத்தக்கதாக உள்ளது.
- issue: நீதித்துறை மரண தண்டனையின் மொழிநடை
  choice: கொல்லப்பட வேண்டும்
  alternative: சாக வேண்டும்
  rationale: יוּמָת என்பது இயல்பான மரணத்தை அல்ல, பிறரால் நிறைவேற்றப்படும் தண்டனையைச் சுட்டுவதால் அதன் சட்டப்பூர்வ வலிமை காக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையும் நேரடியான சட்ட/உடன்படிக்கைத் தொனியும் காக்கப்பட்டுள்ளன. ‘செவிகொடுக்காத’ என்பது கேட்பதையும் கீழ்ப்படிவதையும் இணைக்கும் மூலச்சொல்லின் பொருள் நிழலைக் காக்கிறது. அடிக்குறிப்பு குறியீடு பிரதான உரையில் சேர்க்கப்பட்டுள்ளது.
