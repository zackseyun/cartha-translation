  text: 'பின்பு யோசுவா மக்களின் அதிகாரிகளுக்குக் கட்டளையிட்டு, இவ்வாறு சொன்னார்:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְצַו
  choice: பின்பு ... கட்டளையிட்டுச்
  rationale: צוה என்பதன் wayyiqtol வடிவம் கதை நிகழ்வை அடுத்த கட்டத்துக்கு நகர்த்துகிறது. ‘பின்பு’ அதன் தொடர்ச்சியைக் காட்டுகிறது; ‘கட்டளையிட்டார்’ என்பதற்குப் பதிலாக, அடுத்துவரும் לֵאמֹר உடன் இயல்பாக இணைய ‘கட்டளையிட்டுச்’ என வழங்கப்பட்டுள்ளது.
- source_word: יְהוֹשֻׁעַ
  choice: யோசுவா
  rationale: எபிரெய தனிப்பெயரின் தமிழில் நிலைபெற்ற வேதாகமப் பெயர்ப்பு வடிவம்.
- source_word: אֶת
  choice: '[தனியாக மொழிபெயர்க்கப்படவில்லை]'
  rationale: இது நேரடிச் செயப்படுபொருளைக் குறிக்கும் இலக்கணச் சுட்டி; தமிழில் தனிச் சொல்லாகத் தேவையில்லை. ‘மக்களின் அதிகாரிகளுக்கு’ என்பது வினையின் பெறுநராக அமைவதன் மூலம் அதன் பணி வெளிப்படுகிறது.
- source_word: שֹׁטְרֵי
  choice: அதிகாரிகள்
  rationale: இச்சொல் இராணுவத் தளபதிகளை அல்லாமல், மக்களிடையே நிர்வாகப் பொறுப்பு வகித்த அலுவலர்களைக் குறிக்கிறது. நவீனத் தமிழில் ‘அதிகாரிகள்’ அந்தப் பொருளை இயல்பாகத் தருகிறது.
- source_word: הָעָם
  choice: மக்களின்
  rationale: עָם இங்கு கூட்டாகிய மக்களைக் குறிக்கிறது. இணைப்புத் தொகையில் உள்ள construct உறவைத் தமிழில் உரிய வேற்றுமை வடிவுடன் ‘மக்களின் அதிகாரிகள்’ எனக் காட்டுகிறது.
- source_word: לֵאמֹר
  choice: 'சொன்னது:'
  rationale: அடுத்த வசனத்தில் வரும் நேரடிக் கூற்றை அறிமுகப்படுத்தும் எபிரெய வழக்குச் சூத்திரம். தமிழில் ‘கட்டளையிட்டுச் சொன்னது:’ என்பது அந்த உரையாடல் இணைப்பைத் தெளிவாகவும் இயல்பாகவும் காட்டுகிறது.
