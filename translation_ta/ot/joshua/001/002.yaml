base_translation:
  language: en
  yaml_path: translation/ot/joshua/001/002.yaml
  text: Moses my servant is dead. So now[a], arise, cross this Jordan—you and all this people—into the land that I am giving to them, to the sons of Israel.
translation:
  language: ta
  text: என் ஊழியனாகிய மோசே இறந்துவிட்டான். ஆகவே இப்போது எழுந்திரு; நீயும் இந்த மக்கள் அனைவரும் இந்த யோர்தான் ஆற்றைக் கடந்து, நான் அவர்களுக்கு—இஸ்ரவேலின் மகன்களுக்கு[a]—கொடுக்கிற நாட்டிற்குள் போ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘இஸ்ரவேலருக்கு’ அல்லது ‘இஸ்ரவேலின் பிள்ளைகளுக்கு.’ எபிரெயத்தில் சொல்லர்த்தமாக ‘இஸ்ரவேலின் மகன்களுக்கு’ என்று உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַבְדִּי
  choice: என் ஊழியனாகிய
  rationale: עֶבֶד என்பதற்கு ‘அடிமை’ அல்லது ‘ஊழியன்’ என்ற பொருள்கள் இருக்கலாம். இங்கு கடவுளுடன் மோசே கொண்டுள்ள உறவையும் மதிப்புக்குரிய பணியையும் குறிக்கும் பட்டமாக வருவதால், ‘ஊழியன்’ பொருத்தமானது.
- source_word: מֵת
  choice: இறந்துவிட்டான்
  rationale: எபிரெய வினை மோசேயின் மரணத்தை நிகழ்ந்து முடிந்த, தற்போது பொருத்தமுள்ள உண்மையாகத் தெரிவிக்கிறது. ‘இறந்துவிட்டான்’ என்பது இதை இயல்பான நவீனத் தமிழில் நேரடியாகக் கூறுகிறது.
- source_word: וְעַתָּה
  choice: ஆகவே இப்போது
  rationale: இணைப்புச்சொல்லும் கால வினையடையும் மோசேயின் மரணத்திலிருந்து யோசுவாவின் பணிக்கட்டளைக்கான தொடர்ச்சியையும் விளைவையும் குறிக்கின்றன.
- source_word: קוּם
  choice: எழுந்திரு
  rationale: ஒருமை ஏவல் வடிவம் யோசுவாவைத் தீர்மானமான செயலுக்கு அழைக்கிறது. ‘எழுந்திரு’ உயர்ந்த தொனியையும் ஒருமையையும் காக்கிறது.
- source_word: עֲבֹר
  choice: கடந்து
  rationale: யோர்தான் நேரடிப் பொருளாக வருவதால், இவ்வினை ஆற்றின் மறுபுறத்திற்குக் கடப்பதைக் குறிக்கிறது.
- source_word: אֶת הַיַּרְדֵּן הַזֶּה
  choice: இந்த யோர்தான் ஆற்றை
  rationale: ‘இந்த’ என்ற சுட்டுப்பெயர் பாதுகாக்கப்பட்டுள்ளது. தமிழில் இயல்பாகவும் தெளிவாகவும் இருக்க, யோர்தான் என்ற பெயருடன் ‘ஆறு’ சேர்க்கப்பட்டுள்ளது.
- source_word: אַתָּה וְכָל הָעָם הַזֶּה
  choice: நீயும் இந்த மக்கள் அனைவரும்
  rationale: யோசுவாவையும் முழு மக்களையும் தனித்துக் காட்டும் எபிரெய அமைப்பும் ‘இந்த’ என்ற சுட்டும் காக்கப்பட்டுள்ளன.
- source_word: אֶל הָאָרֶץ
  choice: நாட்டிற்குள்
  rationale: இயக்கத்தைக் குறிக்கும் சூழலில் אֶל, குறித்த நாட்டிற்குள் நுழைவதைச் சுட்டுகிறது; ‘நாட்டிற்குள்’ அந்த இயக்கத்தைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: אֲשֶׁר אָנֹכִי נֹתֵן לָהֶם
  choice: நான் அவர்களுக்குக் கொடுக்கிற
  rationale: נֹתֵן என்பது பங்கேற்பு வடிவமாக இருந்து, கொடுத்தல் நடைபெறுகிற அல்லது உடனடியாக நிறைவேறவுள்ள செயல் என்பதை முன்வைக்கிறது. ‘கொடுக்கிற’ அந்த அம்சத்தைத் தக்கவைக்கிறது.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் மகன்களுக்கு
  rationale: எபிரெயம் சொல்லர்த்தமாக ‘இஸ்ரவேலின் மகன்கள்’ என்று கூறுகிறது. அதன் ஆண்பால் வடிவம் முதன்மை உரையில் வெளிப்படையாகப் பாதுகாக்கப்பட்டு, இயல்பான மாற்றுகள் அடிக்குறிப்பில் தரப்பட்டுள்ளன.
theological_decisions:
- issue: לִבְנֵי יִשְׂרָאֵל என்ற உடன்படிக்கை மக்களைக் குறிக்கும் ஆண்பால் கூட்டுப்பெயர்
  choice: இஸ்ரவேலின் மகன்களுக்கு
  alternative: இஸ்ரவேலருக்கு; இஸ்ரவேலின் பிள்ளைகளுக்கு
  rationale: மூல எபிரெயம் ஆண்பால் பன்மையான ‘மகன்கள்’ என்பதையே வெளிப்படையாகப் பயன்படுத்துகிறது; அதேவேளையில் அதன் சூழல் குறிப்பு உடன்படிக்கை மக்களைக் கூட்டாகச் சுட்டுகிறது. முதன்மை உரை வடிவத்தைப் பாதுகாக்கிறது; அடிக்குறிப்பு வழக்கமான கூட்டுப்பொருள் மொழிபெயர்ப்புகளைத் தெரிவிக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் நேரடியான, கண்ணியமான இறைக்கட்டளைத் தொனி பயன்படுத்தப்பட்டுள்ளது. யோசுவாவை நோக்கிய எபிரெய ஒருமை ஏவல்கள் ‘எழுந்திரு’ மற்றும் ‘போ’ என ஒருமையில் வைக்கப்பட்டுள்ளன. கோடுகள் לָהֶם மற்றும் לִבְנֵי יִשְׂרָאֵל இடையிலான விளக்கவுரைத் தொடர்பை தெளிவாகக் காட்டுகின்றன.
