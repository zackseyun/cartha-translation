base_translation:
  language: en
  yaml_path: translation/ot/joshua/001/009.yaml
  text: Have I not commanded you? Be strong and courageous. Do not be terrified[a], and do not be dismayed, for Yahweh your God is with you wherever you go.
translation:
  language: ta
  text: “நான் உனக்குக் கட்டளையிடவில்லையா? வலிமையுடனும் துணிவுடனும் இரு. திகிலடையாதே; மனம் தளராதே. ஏனெனில், நீ எங்கு சென்றாலும் உன் கடவுளாகிய யாவே[a] உன்னுடன் இருக்கிறார்.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் YHWH என்ற இறைப்பெயர்; மரபாக “கர்த்தர்” என்று வழங்கப்படுகிறது.
    reason: இறைப்பெயரின் மரபான வழங்கலைத் தெரிவிக்கிறது.
lexical_decisions:
- source_word: הֲלוֹא צִוִּיתִיךָ
  choice: நான் உனக்குக் கட்டளையிடவில்லையா?
  rationale: எதிர்மறை வினாவாக அமைந்துள்ள வலியுறுத்தும் நினைவூட்டலைத் தமிழில் இயல்பாகவும் நேரடியாகவும் காக்கிறது.
- source_word: חֲזַק וֶאֱמָץ
  choice: வலிமையுடனும் துணிவுடனும் இரு
  rationale: இரண்டு கட்டளைச் சொற்களிலும் உள்ள வலிமை மற்றும் துணிவு என்ற தொடர்புடைய, ஆனால் வேறுபட்ட கருத்துகளை இயல்பான தமிழில் காக்கிறது.
- source_word: אַל־תַּעֲרֹץ
  choice: திகிலடையாதே
  rationale: பொதுவான அச்சத்தைவிடக் கடுமையான பயம் அல்லது திகில் என்ற עָרַץ சொல்லின் வலிமையை வெளிப்படுத்துகிறது.
- source_word: וְאַל־תֵּחָת
  choice: மனம் தளராதே
  rationale: חתת என்பதன் நொறுங்கிப்போதல், கலங்குதல், ஊக்கமிழத்தல் ஆகிய உணர்வுகளை நவீனத் தமிழில் புரியத்தக்க வகையில் தருகிறது.
- source_word: כִּי עִמְּךָ
  choice: ஏனெனில் ... உன்னுடன் இருக்கிறார்
  rationale: முந்தைய கட்டளைகளுக்கான காரணமாக இறைப் பிரசன்னத்தைத் தெளிவாகக் காட்டுகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய மெய்யெழுத்துப் பெயரான YHWH-ஐ ஒரு பொதுப் பட்டமாக மாற்றாமல், தமிழில் வழக்கமான ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: אֱלֹהֶיךָ
  choice: உன் கடவுளாகிய
  rationale: இரண்டாம் நபர் ஒருமை உடைமைப் பின்னொட்டைத் துல்லியமாகக் காத்து, அடுத்துவரும் இறைப்பெயருடன் இயல்பாக இணைக்கிறது.
- source_word: בְּכֹל אֲשֶׁר תֵּלֵךְ
  choice: நீ எங்கு சென்றாலும்
  rationale: யோசுவா செல்லும் ஒவ்வோர் இடத்தையும் உள்ளடக்கும் பகிர்ந்தளிக்கும் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் ஒரு பட்டம் அல்ல, தனிப்பட்ட உடன்படிக்கைப் பெயரே இடம்பெறுகிறது. ஆகவே அதன் பெயர்த் தன்மையை ஒலிபெயர்ப்பு காக்கிறது; வழக்கமான பட்டமொழிபெயர்ப்பு அடிக்குறிப்பில் குறிப்பிடப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழ்; ஒருமை ஆண்பால் நோக்கி உரைக்கப்படும் கட்டளைகளை இயல்பான ஒருமை வடிவில் வைத்துள்ளது. மொழிநடை கண்ணியமானதும் சாதாரண வாசகர்களுக்குத் தெளிவானதும் ஆகும்.
