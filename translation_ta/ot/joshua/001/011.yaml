base_translation:
  language: en
  yaml_path: translation/ot/joshua/001/011.yaml
  text: Go through the midst of the camp and command the people[a], saying, ‘Prepare provisions for yourselves, because within three days you are crossing this Jordan to go in to take possession of the land that Yahweh your God is giving you to possess it.’
translation:
  language: ta
  text: 'முகாமின் நடுவே சென்று, மக்களுக்குக் கட்டளையிட்டுச் சொல்லுங்கள்: “உங்களுக்குத் தேவையான பயண உணவுப் பொருட்களை ஆயத்தப்படுத்துங்கள். ஏனெனில் இன்னும் மூன்று நாட்களுக்குள்[a] நீங்கள் இந்த யோர்தானைக் கடந்து, உங்கள் கடவுளாகிய யாவே உங்களுக்குக் கொடுக்கிற நாட்டிற்குள் சென்று, அதை உரிமையாக்கிக்கொள்ளப் போகிறீர்கள்.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “இன்னும் மூன்று நாட்களில்” அல்லது “மூன்று நாட்களுக்குப் பின்” என்றும் மொழிபெயர்க்கலாம். எபிரேயச் சொற்றொடர் கடப்பதற்கு முன் மீதமுள்ள குறுகிய காலத்தைக் குறிக்கிறது.
    reason: காலக்குறிப்பான בְּעוֹד שְׁלֹשֶׁת יָמִים என்பதற்குச் சாத்தியமான மொழிபெயர்ப்பு வேறுபாடுகளைப் பதிவு செய்ய.
lexical_decisions:
- source_word: עִבְרוּ בְּקֶרֶב הַמַּחֲנֶה
  choice: முகாமின் நடுவே சென்று
  rationale: עבר என்பதன் இயக்கத்தையும் קֶרֶב என்பதன் ‘நடுவே/உள்ளே’ என்ற இடப்பொருளையும் இயல்பான நவீன தமிழில் காக்கிறது.
- source_word: וְצַוּוּ אֶת הָעָם לֵאמֹר
  choice: மக்களுக்குக் கட்டளையிட்டுச் சொல்லுங்கள்
  rationale: צוה என்பதிலுள்ள அதிகாரபூர்வமான கட்டளையின் வலிமையையும், לֵאמֹר என்ற மேற்கோள் அறிமுகத்தையும் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: הָכִינוּ לָכֶם צֵידָה
  choice: உங்களுக்குத் தேவையான பயண உணவுப் பொருட்களை ஆயத்தப்படுத்துங்கள்
  rationale: צֵידָה பொதுவான உணவை மட்டும் அல்லாமல் பயணத்திற்கான உணவு ஏற்பாட்டைக் குறிக்கிறது; לָכֶם என்பதும் ‘உங்களுக்குத் தேவையான’ என இயல்பாகப் பிரதிபலிக்கப்படுகிறது.
- source_word: כִּי בְּעוֹד שְׁלֹשֶׁת יָמִים
  choice: ஏனெனில் இன்னும் மூன்று நாட்களுக்குள்
  rationale: மீதமுள்ள குறுகிய காலத்தையும் உடனடித் தன்மையையும் காட்டுகிறது; காலக்குறிப்பின் சாத்தியமான வேறுபாடுகள் அடிக்குறிப்பில் வைக்கப்பட்டுள்ளன.
- source_word: אַתֶּם עֹבְרִים אֶת הַיַּרְדֵּן הַזֶּה
  choice: நீங்கள் இந்த யோர்தானைக் கடந்து ... போகிறீர்கள்
  rationale: எபிரேய நிகழ்காலப் பங்கேற்புச் சொல்லின் நெருங்கிய எதிர்கால உணர்வை தமிழில் இயல்பான ‘போகிறீர்கள்’ கட்டமைப்பால் தருகிறது; הַזֶּה என்பதற்கான ‘இந்த’ என்பதும் காக்கப்படுகிறது.
- source_word: לָבוֹא לָרֶשֶׁת אֶת הָאָרֶץ
  choice: நாட்டிற்குள் சென்று, அதை உரிமையாக்கிக்கொள்ள
  rationale: இரண்டு நோக்க வினையெச்சங்களையும் தனித்தனியாகக் காத்து, ירשׁ என்பதிலுள்ள கைப்பற்றி உரிமையாக்கும் கருத்தை வெளிப்படுத்துகிறது.
- source_word: יְהוָה אֱלֹהֵיכֶם
  choice: உங்கள் கடவுளாகிய யாவே
  rationale: יהוה என்ற உடன்படிக்கைப் பெயரை ‘யாவே’ என ஒலிபெயர்த்து, אֱלֹהֵיכֶם என்பதையும் இயல்பான தமிழ் உறவுத்தொடராக வழங்குகிறது.
- source_word: נֹתֵן לָכֶם לְרִשְׁתָּהּ
  choice: உங்களுக்கு உரிமையாக்கிக்கொள்ளக் கொடுக்கிற ... அதை உரிமையாக்கிக்கொள்ள
  rationale: נֹתֵן என்பதன் நடைபெறும்/உறுதியான கொடை உணர்வையும், לְרִשְׁתָּהּ என்பதன் வெளிப்படையான நோக்கத்தையும் காக்கிறது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூலத்தில் தனிப்பட்ட உடன்படிக்கைப் பெயரான יהוה நேரடியாக இடம்பெறுவதால், பட்டப்பெயராக மாற்றாமல் ‘யாவே’ என ஒலிபெயர்க்கப்பட்டது.
- issue: நாட்டைக் கொடுத்தலும் இஸ்ரவேல் அதை உரிமையாக்கிக்கொள்ளுதலும் இடையிலான உறவு
  choice: ‘யாவே ... கொடுக்கிற’ என்றும் மக்கள் ‘உரிமையாக்கிக்கொள்ளப் போகிறார்கள்’ என்றும் இரு கூறுகளும் காக்கப்பட்டன
  alternative: தெய்வீகக் கொடையையோ மனிதச் செயலையோ மட்டும் முன்னிறுத்துதல்
  rationale: வசனம் தெய்வீகக் கொடையையும் மக்களின் நுழைவு மற்றும் உரிமையாக்கும் செயலையும் ஒன்றாகக் கூறுகிறது; அந்த இறையியல் பதற்றம் விளக்கி நீக்கப்படவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையைப் பயன்படுத்துகிறது. ‘முகாம்’, ‘ஆயத்தப்படுத்துங்கள்’, ‘உரிமையாக்கிக்கொள்ள’ ஆகிய சொற்கள் வரலாற்று-இராணுவச் சூழலையும் மூலத்தின் அதிகாரபூர்வத் தொனியையும் காக்கின்றன.
