  text: זָכוֹר֙ אֶת הַ/דָּבָ֔ר אֲשֶׁ֨ר צִוָּ֥ה אֶתְ/כֶ֛ם מֹשֶׁ֥ה עֶֽבֶד יְהוָ֖ה לֵ/אמֹ֑ר יְהוָ֤ה אֱלֹהֵי/כֶם֙ מֵנִ֣יחַ לָ/כֶ֔ם וְ/נָתַ֥ן לָ/כֶ֖ם אֶת הָ/אָ֥רֶץ הַ/זֹּֽאת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/001/013.yaml
  text: Remember the word that Moses the servant of Yahweh commanded you[a], saying, ‘Yahweh your God is giving you rest and will give you this land.’
translation:
  language: ta
  text: 'யாவேயின் ஊழியரான மோசே உங்களுக்குக் கட்டளையிட்ட வார்த்தையை நினைவில் கொள்ளுங்கள்: “உங்கள் கடவுளாகிய யாவே உங்களுக்கு ஓய்வு அளிக்கிறார்; இந்த நிலத்தை உங்களுக்குக் கொடுத்திருக்கிறார்[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இந்த நிலத்தை உங்களுக்குக் கொடுப்பார்.” எபிரேய வினைச்சொல் நிறைவேறிய கொடையையோ உறுதியாக நிகழவிருக்கும் எதிர்காலத்தையோ குறிக்கலாம். யோர்தானுக்குக் கிழக்கேயுள்ள நிலம் இக்கோத்திரங்களுக்கு ஏற்கெனவே அளிக்கப்பட்டிருந்ததால், முதன்மை உரையில் “கொடுத்திருக்கிறார்” என்று மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: alternative_reading
lexical_decisions:
- source_word: זָכוֹר
  choice: நினைவில் கொள்ளுங்கள்
  rationale: இது முன்பு கொடுக்கப்பட்ட கட்டளையை மனத்தில் கொண்டு அதன்படி செயல்படுமாறு அழைக்கும் கட்டளை வினை. எபிரேயத்தில் ஒருமை வடிவம் இருந்தாலும், சூழலில் பல கோத்திரத்தாரை நோக்கிய கூட்டுப்பொருள் உள்ளதால் தமிழில் மரியாதை/பன்மை வடிவம் இயல்பாக உள்ளது.
- source_word: הַדָּבָר אֲשֶׁר צִוָּה ... לֵאמֹר
  choice: கட்டளையிட்டபோது சொன்னதை
  rationale: דָּבָר என்பது ‘வார்த்தை’, ‘காரியம்’, ‘சொன்னது’ எனப் பொருள்படலாம். צִוָּה மற்றும் לֵאמֹר ஆகியவற்றோடு சேரும் இவ்விடத்தில், மோசே கூறிய கட்டளையின் உள்ளடக்கத்தைக் குறிக்கும் இயல்பான தமிழாக்கம் இது.
- source_word: עֶבֶד יְהוָה
  choice: யாவேயின் ஊழியர்
  rationale: மோசேயின் இறைபணியையும் அவருக்குக் கொடுக்கப்பட்ட பொறுப்பையும் குறிக்கும் மரியாதைத் தலைப்பு; இங்கு ‘அடிமை’ என்பதைவிட ‘ஊழியர்’ சூழலுக்குப் பொருத்தமானது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைப்பட்டத்தை மாற்றாக இடாமல், எபிரேய இறைப்பெயரின் பரவலாக அறியப்பட்ட தமிழ் ஒலிபெயர்ப்பு பயன்படுத்தப்பட்டுள்ளது.
- source_word: אֱלֹהֵיכֶם
  choice: உங்கள் கடவுள்
  rationale: இரண்டாம் நபர் பன்மை உடைமை வடிவை நேரடியாகவும் இயல்பாகவும் தருகிறது.
- source_word: מֵנִיחַ
  choice: ஓய்வளிக்கிறார்
  rationale: ஹிஃபில் பங்கேற்பு வடிவம் ஓய்வு, நிம்மதி, நிலையான குடியேற்றம் ஆகிய நிழற்பொருள்களைக் கொண்டுள்ளது. ‘ஓய்வளிக்கிறார்’ அவற்றைச் சுருக்கமாகத் தக்கவைக்கிறது.
- source_word: וְנָתַן
  choice: கொடுத்திருக்கிறார்
  rationale: எபிரேய நிறைவு வடிவமும், யோர்தானுக்குக் கிழக்கே உள்ள நிலம் இக்கோத்திரங்களுக்கு ஏற்கெனவே அளிக்கப்பட்டிருந்த கதைக்களச் சூழலும் நிறைவேறிய கொடையைச் சுட்டுகின்றன. உறுதியான எதிர்கால வாசிப்பும் இலக்கண ரீதியாக சாத்தியம் என்பதால் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: הָאָרֶץ הַזֹּאת
  choice: இந்த நாடு
  rationale: குறிப்பிட்ட நிலப்பகுதியைச் சுட்டும் எளிய சொற்றொடர். வேதாகம நிலச் சூழலில் ‘நாடு’ இயல்பாகவும் புரிந்துகொள்ளத்தக்கதாகவும் உள்ளது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூலத்தில் தனிப்பட்ட இறைப்பெயர் நேரடியாக இருப்பதால், அதை ஒரு பட்டத்தால் மாற்றாமல் ஒலிபெயர்ப்பது மூல வேறுபாட்டைப் பாதுகாக்கிறது.
- issue: וְנָתַן என்பதன் காலம்/நோக்கு
  choice: கொடுத்திருக்கிறார்
  alternative: கொடுப்பார்
  rationale: வடிவம் நிறைவேறிய செயலையோ உறுதிப்படுத்தப்பட்ட எதிர்காலத்தையோ குறிக்கக்கூடும். யோர்தானுக்குக் கிழக்கேயுள்ள சுதந்தரம் ஏற்கெனவே வழங்கப்பட்ட கதைக்களச் சூழலால் நிறைவேறிய வாசிப்பு முதன்மை உரையில் தேர்ந்தெடுக்கப்பட்டது; எதிர்கால வாசிப்பு அடிக்குறிப்பில் பாதுகாக்கப்பட்டது.
- issue: מֵנִיחַ குறிக்கும் ‘ஓய்வு’
  choice: ஓய்வளிக்கிறார்
  alternative: நிம்மதியாகக் குடியமர்த்துகிறார்
  rationale: இச்சொல் போரிலிருந்து ஓய்வு, அலைச்சலின் முடிவு, பாதுகாப்பான குடியேற்றம் ஆகியவற்றை உள்ளடக்கக்கூடும். அவற்றில் ஒன்றை மட்டும் தீர்மானிக்காமல் பரந்த ‘ஓய்வு’ மொழி தக்கவைக்கப்பட்டது.
translation_notes:
  register: நவீன தரத் தமிழில் இயல்பான, கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. நீண்ட எபிரேய மேற்கோள் அறிமுகம் தமிழில் இயல்பாக அமைய ‘கட்டளையிட்டபோது சொன்னதை’ என வடிவமைக்கப்பட்டுள்ளது. இறைப்பெயர் ‘யாவே’ என ஒலிபெயர்க்கப்பட்டுள்ளது; மூலத்தின் காலத் தெளிவின்மை அடிக்குறிப்பில் வெளிப்படையாகப் பாதுகாக்கப்பட்டுள்ளது.
