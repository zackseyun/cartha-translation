  text: לֹֽא יִתְיַצֵּ֥ב אִישׁ֙ לְ/פָנֶ֔י/ךָ כֹּ֖ל יְמֵ֣י חַיֶּ֑י/ךָ כַּֽ/אֲשֶׁ֨ר הָיִ֤יתִי עִם מֹשֶׁה֙ אֶהְיֶ֣ה עִמָּ֔/ךְ לֹ֥א אַרְפְּ/ךָ֖ וְ/לֹ֥א אֶעֶזְבֶֽ/ךָּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/001/005.yaml
  text: No man will stand before you all the days of your life[a]. Just as I was with Moses, I will be with you[c][b]. I will not fail you or forsake you.
translation:
  language: ta
  text: உன் வாழ்நாளெல்லாம் எந்த மனிதனும் உனக்கு முன்பாக நிலைநிற்க முடியாது[a][b]. நான் மோசேயோடு இருந்ததுபோல உன்னோடும் இருப்பேன். நான் உன்னை நழுவவிடவும் மாட்டேன்[c]; உன்னைக் கைவிடவும் மாட்டேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘உனக்கு முன்பாக யாரும் நிலைநிற்க முடியாது.’ இந்த எபிரேயச் சொல்லாட்சி வெற்றிகரமாக எதிர்த்து நிற்க முடியாததைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘எந்த மனிதனும்’ என்பதற்கு மூல எபிரெயில் ஆண்பால் ஒருமை வடிவம் உள்ளது; ஆனால் இங்கு அது எந்த மனித எதிரியையும் பொதுவாகக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, ‘உன்மீதுள்ள பிடியைத் தளர்த்தவும் மாட்டேன்.’ முதல் வினை நழுவவிடுதல், பிடியைத் தளர்த்துதல் அல்லது ஆதரிக்கத் தவறுதல் என்ற கருத்தைத் தருகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִתְיַצֵּב
  choice: நிலைநிற்க முடியாது
  rationale: התפעל வடிவம் இங்கு ஒருவருக்கு எதிராக நின்று வெற்றிகரமாகத் தாக்குப்பிடிப்பதைக் குறிக்கிறது. எபிரெயச் சொல்லாட்சியைத் தக்கவைத்தபடியே, சூழலில் உள்ள இயலாமையைத் தமிழில் தெளிவாக்க ‘முடியாது’ சேர்க்கப்பட்டுள்ளது.
- source_word: אִישׁ
  choice: எந்த மனிதனும்
  rationale: இது இலக்கணப்படி ஆண்பால் ஒருமையாக இருந்தாலும், இச்சூழலில் எந்த மனித எதிரியையும் பொதுவாகக் குறிக்கிறது. ‘எந்த மனிதனும்’ என்பது அந்த வடிவத்தையும் பொதுவான பொருளையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: לְפָנֶיךָ
  choice: உனக்கு முன்பாக
  rationale: சொல்லுக்கு நேரான பொருள் ‘உன் முகத்துக்கு முன்பாக.’ இராணுவச் சூழலில் இது யோசுவாவை எதிர்த்து நிற்பதைக் குறித்தாலும், மூலமொழியின் சொல்லாட்சியைத் தமிழில் தக்கவைக்கிறது.
- source_word: כֹּל יְמֵי חַיֶּיךָ
  choice: உன் வாழ்நாளெல்லாம்
  rationale: ஒருவருடைய வாழ்நாள் முழுவதையும் குறிக்கும் எபிரெய வழக்கைச் சுருக்கமாகவும் இயல்பாகவும் வழங்குகிறது.
- source_word: כַּאֲשֶׁר הָיִיתִי עִם מֹשֶׁה
  choice: நான் மோசேயோடு இருந்ததுபோல
  rationale: כַּאֲשֶׁר குறிக்கும் ஒப்புமையைத் தெளிவாகக் காட்டி, மோசேயோடு இருந்த இறைப் பிரசன்னத்திற்கும் யோசுவாவுக்குக் கொடுக்கப்படும் வாக்குறுதிக்கும் உள்ள தொடர்ச்சியை வெளிப்படுத்துகிறது.
- source_word: אֶהְיֶה עִמָּךְ
  choice: உன்னோடும் இருப்பேன்
  rationale: היה உடன் עִם வருவது வாக்குறுதியளிக்கப்பட்ட உடனிருப்பை நேரடியாகக் குறிக்கிறது; தமிழிலும் இதுவே இயல்பான, பொருள் செறிந்த வடிவம்.
- source_word: אַרְפְּךָ
  choice: உன்னை நழுவவிடவும் மாட்டேன்
  rationale: רפה என்பதன் ஹிபீல் வடிவம் பிடியைத் தளர்த்துதல், விழவிடுதல் அல்லது ஆதரிக்கத் தவறுதல் என்ற கருத்தைக் கொண்டது. ‘நழுவவிட மாட்டேன்’ என்பது அடுத்துள்ள ‘கைவிட மாட்டேன்’ என்பதிலிருந்து வேறுபாட்டைத் தக்கவைத்து, ஆதரவைத் தளர்த்தாத பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: אֶעֶזְבֶךָּ
  choice: உன்னைக் கைவிடவும் மாட்டேன்
  rationale: עזב என்பது விட்டுச் செல்லுதல் அல்லது கைவிடுதல் என்று பொருள்படும். ‘கைவிட மாட்டேன்’ என்பது வாக்குறுதியின் உறுதியான தொனியையும் இரண்டாவது மறுப்பின் தனித்த பொருளையும் காக்கிறது.
theological_decisions:
- issue: אִישׁ என்ற பொதுப்பொருளுடைய ஆண்பால் ஒருமையை மொழிபெயர்த்தல்
  choice: எந்த மனிதனும்
  alternative: யாரும்
  rationale: மூலத்தில் ஆண்பால் ஒருமை வடிவம் இருந்தாலும் அது எந்த மனித எதிரியையும் உள்ளடக்கும் பொதுப்பொருளில் வருகிறது. முதன்மை உரை மூலத்தின் மனிதக் குறிப்பைத் தக்கவைக்கிறது; அடிக்குறிப்பு அதன் பொதுவான வரம்பைத் தெளிவுபடுத்துகிறது.
- issue: לֹא אַרְפְּךָ וְלֹא אֶעֶזְבֶךָּ என்ற இரட்டை வாக்குறுதியின் நுணுக்கம்
  choice: நான் உன்னை நழுவவிடவும் மாட்டேன்; உன்னைக் கைவிடவும் மாட்டேன்
  alternative: நான் உன்னை விட்டுவிடவும் மாட்டேன்; கைவிடவும் மாட்டேன்
  rationale: முதல் வினை ஆதரவின் பிடியைத் தளர்த்தாததையும், இரண்டாவது வினை முற்றிலும் கைவிடாததையும் குறிக்கிறது. இரண்டையும் ஒரே பொருளாக்காமல் வேறுபாட்டுடன் வழங்குவது இறைவனுடைய உண்மைத்தன்மையைப் பற்றிய வாக்குறுதியின் முழு வலிமையைக் காக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாக வாசிக்கக்கூடிய, அதேவேளையில் இறை வாக்குறுதிக்கேற்ற கண்ணியமான ஒருமை உரையாடல் நடை பயன்படுத்தப்பட்டுள்ளது. ‘உனக்கு முன்பாக நிலைநிற்க’ என்ற எபிரெயச் சொல்லாட்சி பாதுகாக்கப்பட்டு, அதன் எதிர்ப்புப் பொருள் அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது. இரட்டை மறுப்பின் இரண்டு வினைகளும் ஒன்றாக்கப்படாமல் தனித்த நுணுக்கங்களுடன் தரப்பட்டுள்ளன.
