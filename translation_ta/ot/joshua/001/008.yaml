base_translation:
  language: en
  yaml_path: translation/ot/joshua/001/008.yaml
  text: This book of the law shall not depart from your mouth[a], but you shall meditate on it day and night, so that you may be careful to do according to all that is written in it. For then you will make your way prosper, and then you will act wisely.
translation:
  language: ta
  text: இந்தச் சட்டப் புத்தகம் உன் வாயைவிட்டு நீங்கக்கூடாது. அதில் எழுதப்பட்டுள்ள அனைத்தின்படியும் கவனமாகச் செய்வதற்காக, இரவும் பகலும் அதைத் தியானித்துக்கொண்டிரு[a]. அப்போதுதான் உன் வழியை வெற்றிகரமாக்குவாய்; அப்போதுதான் விவேகமாகச் செயல்படுவாய்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அதை மெதுவாக ஓதிக்கொண்டிரு’ அல்லது ‘அதை முணுமுணுத்துக்கொண்டிரு’; எபிரெய வினைச்சொல் ஆழ்ந்து சிந்திப்பதோடு, மெல்லிய குரலில் திரும்பத் திரும்பச் சொல்வதையும் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָמוּשׁ
  choice: நீங்காதிருக்கட்டும்
  rationale: ‘நீங்குதல், விலகுதல்’ என்ற பொருளையும், வாயில் தொடர்ந்து நிலைத்திருக்கும் சொல்லுருவையும் இயல்பான தமிழில் காக்கிறது.
- source_word: סֵפֶר הַתּוֹרָה הַזֶּה
  choice: இந்தச் சட்டப் புத்தகம்
  rationale: סֵפֶר என்பதன் எழுதப்பட்ட நூல்/சுருள் என்ற கருத்தையும், இச்சூழலில் תּוֹרָה குறிக்கும் உடன்படிக்கைச் சட்டத்தையும் தெளிவாகத் தருகிறது.
- source_word: מִפִּיךָ
  choice: உன் வாயைவிட்டு
  rationale: பேசுதல் அல்லது ஓதுதல் சார்ந்த மூலமொழியின் concrete உருவகத்தைப் பாதுகாக்கிறது.
- source_word: וְהָגִיתָ
  choice: அதைத் தியானித்துக்கொண்டிரு
  rationale: הגה என்பதில் சிந்தித்தல் மட்டுமன்றி மெதுவாக உச்சரித்தல்/முணுமுணுத்தல் என்ற வாய்மொழி நுணுக்கமும் உள்ளது; முதன்மை உரை இயல்புக்காக ‘தியானி’ என்பதைப் பயன்படுத்தி, மாற்றுப் பொருளை அடிக்குறிப்பில் தருகிறது.
- source_word: יוֹמָם וָלַיְלָה
  choice: இரவும் பகலும்
  rationale: தொடர்ச்சியான பழக்கத்தைக் குறிக்கும் இணைச்சொல்லை இயல்பான தமிழ் வரிசையில் தருகிறது.
- source_word: לְמַעַן תִּשְׁמֹר לַעֲשׂוֹת
  choice: கவனமாகச் செய்வதற்காக
  rationale: நோக்கத்தையும், விழிப்புடன் கடைப்பிடித்துச் செயல்பட வேண்டும் என்ற கருத்தையும் சுருக்கமாக வெளிப்படுத்துகிறது.
- source_word: כְּכָל הַכָּתוּב בּוֹ
  choice: அதில் உள்ளபடியெல்லாம்
  rationale: அதில் எழுதப்பட்ட அனைத்திற்கும் ஏற்பச் செய்ய வேண்டும் என்ற முழுமையான வலியுறுத்தலை இயல்பான தமிழில் கொண்டுவருகிறது.
- source_word: תַּצְלִיחַ אֶת דְּרָכֶךָ
  choice: உன் வழியை வெற்றியடையச் செய்வாய்
  rationale: Hiphil வடிவத்தின் காரணவினைத் தன்மையைப் பாதுகாத்து, ஒருவரது வாழ்க்கைப் பாதை அல்லது முயற்சியை வெற்றிகரமாக நடத்துவதைச் சுட்டுகிறது.
- source_word: תַּשְׂכִּיל
  choice: ஞானமாகச் செயல்படுவாய்
  rationale: விவேகத்துடன் அல்லது நுண்ணறிவுடன் செயல்படுதல் என்ற பொருளைத் தருகிறது; முந்தைய צלח என்பதோடு இதையும் வெறும் ‘வெற்றி’ என ஒன்றாக்குவதைத் தவிர்க்கிறது.
theological_decisions:
- issue: உடன்படிக்கைச் சூழலில் תּוֹרָה என்பதன் பொருள்
  choice: சட்டம்
  alternative: போதனை / தோரா
  rationale: இங்கு யோசுவா கடைப்பிடிக்க வேண்டிய எழுதப்பட்ட உடன்படிக்கைச் சட்டத்தைக் குறிக்கிறது. ‘சட்டம்’ பொதுவாசகருக்குத் தெளிவாகவும் சூழலுக்கு ஏற்றதாகவும் உள்ளது.
- issue: הגה என்பதில் வாய்மொழி ஓதுதலும் உள்ளார்ந்த சிந்தனையும்
  choice: தியானித்துக்கொண்டிரு
  alternative: மெதுவாக ஓதிக்கொண்டிரு / முணுமுணுத்துக்கொண்டிரு
  rationale: இவ்வசனம் வாயில் வைத்திருப்பதையும் தொடர்ந்து ஆழ்ந்து ஈடுபடுவதையும் இணைக்கிறது. வாசிப்பின் இயல்புக்காக முதன்மை உரையில் ‘தியானி’ பயன்படுத்தப்பட்டாலும், வாய்மொழி நுணுக்கம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: செழிப்பு அல்லது வெற்றி குறித்த வாக்குறுதியின் தன்மை
  choice: உன் வழியை வெற்றியடையச் செய்வாய்
  alternative: நீ செழிப்படைவாய்
  rationale: மூலமொழி பொதுவான பொருளாதாரச் செழிப்பை நேரடியாக வாக்களிப்பதாகக் குறுக்காமல், யோசுவாவின் வழி/பணி வெற்றிகரமாக அமையும் என்ற காரணவினை அமைப்பைத் தருகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழ்; எளிதில் புரியக்கூடியதாயினும் கண்ணியமான வேதாகம நடையைப் பேணுகிறது. ஒருமை இரண்டாம் நபர் வடிவங்கள் யோசுவாவை நேரடியாக நோக்கும் மூல உரையைப் பின்பற்றுகின்றன. ‘அப்போதுதான்’ என்ற இருமுறை அமைப்பு אָז ... וְאָז என்ற வலியுறுத்தலைக் காக்கிறது.
