id: JOS.1.1
reference: Joshua 1:1
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יְהִ֗י אַחֲרֵ֛י מ֥וֹת מֹשֶׁ֖ה עֶ֣בֶד יְהוָ֑ה וַ/יֹּ֤אמֶר יְהוָה֙ אֶל יְהוֹשֻׁ֣עַ בִּן נ֔וּן מְשָׁרֵ֥ת מֹשֶׁ֖ה לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/001/001.yaml
  text: 'After the death of Moses[a], the servant of Yahweh, Yahweh said to Joshua son of Nun, the attendant of Moses, saying:'
translation:
  language: ta
  text: 'யாவேயின் ஊழியரான மோசே இறந்தபின், யாவே நூனின் மகனும் மோசேயின் உதவியாளருமான[a] யோசுவாவிடம் இவ்வாறு கூறினார்:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரேய மொழியில், ‘மோசேக்குப் பணிவிடை செய்தவர்’; ‘மோசேயின் பணியாளர்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: מְשָׁרֵת என்ற சொல்லின் சேவை மற்றும் துணைநிற்றல் சார்ந்த பொருள் நுணுக்கங்களைக் காட்டும் சொற்பொருள் மாற்றுவழிகள்.
lexical_decisions:
- source_word: וַיְהִי אַחֲרֵי מוֹת מֹשֶׁה
  choice: மோசே இறந்தபின்
  rationale: தொடக்க வினைச்சொல் கதைத் தொடர்ச்சியையும் புதிய நிகழ்வுக்கான பின்னணியையும் அமைக்கிறது. தமிழில் வெளிப்படையான ‘இப்போது’ என்பதைச் சேர்க்காமல், காலத் தொடர்பை இயல்பாகத் தெரிவிக்கும் வகையில் மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: עֶבֶד יְהוָה
  choice: யாவேயின் ஊழியரான
  rationale: இங்கு עֶבֶד என்பது மோசேயின் மதிப்புக்குரிய இறைப் பணியைக் குறிக்கும் பட்டமாக இருப்பதால், அடிமை நிலையை முன்னிறுத்தாமல் ‘ஊழியர்’ என வழங்கப்பட்டுள்ளது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைத் திருப்பெயரான நான்கெழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் பரவலாகப் புரிந்துகொள்ளக்கூடிய ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: יְהוֹשֻׁעַ בִּן נוּן
  choice: நூனின் மகன் ... யோசுவா
  rationale: எபிரேயப் பெயர்களும் தந்தைவழி அடையாளமும் தமிழின் இயல்பான உருபு மற்றும் சொல் வரிசையுடன் வழங்கப்பட்டுள்ளன.
- source_word: מְשָׁרֵת מֹשֶׁה
  choice: மோசேயின் உதவியாளர்
  rationale: מְשָׁרֵת என்பது ஒருவருக்குப் பணிவிடை செய்து துணைநிற்பவரைக் குறிக்கிறது. ‘உதவியாளர்’ என்பது இங்கு யோசுவாவின் பங்கை இயல்பாகவும் மதிப்புடனும் தெரிவிக்கிறது.
- source_word: וַיֹּאמֶר ... לֵאמֹר
  choice: 'இவ்வாறு கூறினார்:'
  rationale: நேரடிக் கூற்றை அறிமுகப்படுத்தும் எபிரேய அமைப்பு, தமிழில் ‘இவ்வாறு கூறினார்’ என்பதாலும் தொடர்ந்து வரும் இரட்டைப்புள்ளியாலும் தெளிவாக வெளிப்படுத்தப்பட்டுள்ளது.
theological_decisions:
- issue: יְהוָה என்ற இறைத் திருப்பெயரின் மொழியாக்கம்
  choice: யாவே
  alternative: ஆண்டவர் / யெகோவா
  rationale: மூலத்தில் தனிப்பட்ட இறைத் திருப்பெயர் நேரடியாக இருப்பதால், அதனைப் பட்டமாக மாற்றாமல் ஒலிபெயர்ப்பது பெயரின் தன்மையைப் பாதுகாக்கிறது.
- issue: மோசேயைக் குறிக்கும் עֶבֶד என்ற சொல்
  choice: ஊழியர்
  alternative: வேலைக்காரர் / அடிமை
  rationale: ‘யாவேயின் ஊழியர்’ என்பது இங்கு இழிவான அல்லது கட்டுண்ட அடிமை நிலையைக் காட்டாமல், உடன்படிக்கை சார்ந்த மதிப்புக்குரிய இறைப் பணியைச் சுட்டுகிறது.
- issue: யோசுவாவைக் குறிக்கும் מְשָׁרֵת என்ற சொல்
  choice: உதவியாளர்
  alternative: பணிவிடை செய்பவர் / பணியாளர்
  rationale: யோசுவா மோசேக்குத் துணைநின்று பணியாற்றிய பங்கைத் தெரிவிக்கிறது; பின்னாளைய சமயப் பதவிப் பொருளை தேவையின்றி இதில் புகுத்துவதில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான உரைநடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் பெயரடைத் தொடர்கள் தமிழில் வாசிக்க எளிதாக ஒருங்கிணைக்கப்பட்டுள்ளன; அடுத்த வசனத்தில் வரும் நேரடிக் கூற்றை எதிர்நோக்கி இரட்டைப்புள்ளி வைக்கப்பட்டுள்ளது.
