  text: חֲזַ֖ק וֶ/אֱמָ֑ץ כִּ֣י אַתָּ֗ה תַּנְחִיל֙ אֶת הָ/עָ֣ם הַ/זֶּ֔ה אֶת הָ/אָ֕רֶץ אֲשֶׁר נִשְׁבַּ֥עְתִּי לַ/אֲבוֹתָ֖/ם לָ/תֵ֥ת לָ/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/001/006.yaml
  text: Be strong and courageous[b][a], for you shall cause this people to inherit the land that I swore to their fathers to give to them.
translation:
  language: ta
  text: வலிமையுடனும் துணிவுடனும் இரு. ஏனெனில், நான் அவர்களுடைய தந்தையருக்கு[b] அவர்களுக்குக் கொடுப்பதாகச் சத்தியம் செய்த நாட்டை இந்த மக்களுக்கு உரிமையாகக் கிடைக்கச் செய்வது[a] நீதான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இந்த மக்களுக்கு அந்த நாட்டை உரிமையாகப் பங்கிட்டுக் கொடுப்பது.” எபிரெய வினை காரணவினை வடிவில் உள்ளது; மக்கள் அந்த நாட்டை உரிமையாகப் பெறும்படி செய்வதைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: “அவர்களுடைய தந்தையர்” என்பது இஸ்ரவேலின் முற்பிதாக்களை, குறிப்பாக ஆபிரகாம், ஈசாக்கு, யாக்கோபு ஆகியோரைச் சுட்டுகிறது; “அவர்களுடைய மூதாதையர்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲזַק וֶאֱמָץ
  choice: வலிமையாயும் துணிவாயும் இரு
  rationale: இரண்டு ஆண்பால் ஒருமை கட்டளைகளின் இணைந்த வலியுறுத்தலை இயல்பான நவீனத் தமிழில் தருகிறது; חזק என்பதன் வலிமையையும் אמץ என்பதன் துணிவையும் தனித்தனியாகப் பாதுகாக்கிறது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: கட்டளைக்கான காரணத்தை அறிமுகப்படுத்தும் எபிரெய இணைப்பின் காரணப் பொருளைத் தெளிவாகக் காட்டுகிறது.
- source_word: תַּנְחִיל
  choice: உரிமைச்சொத்தாகக் கிடைக்கச் செய்வது நீதான்
  rationale: נחל என்பதன் ஹிஃபில் காரணவினைப் பொருளை வெளிப்படையாகப் பாதுகாக்கிறது. ‘நீதான்’ என்பது எபிரெய மொழியில் வெளிப்படையாக வந்துள்ள אַתָּה என்ற எழுவாயின் வலியுறுத்தலைக் காட்டுகிறது.
- source_word: הָעָם הַזֶּה
  choice: இந்த மக்களுக்கு
  rationale: ‘இந்த மக்கள்’ என்ற குறிப்புடைய கூட்டுப் பொருளை இயல்பான தமிழ் வேற்றுமை வடிவில் தருகிறது.
- source_word: הָאָרֶץ
  choice: நாட்டை
  rationale: இந்த உடன்படிக்கைச் சூழலில் குறிப்பிட்ட வாக்குத்தத்த நாட்டைக் குறிக்கிறது; ‘நிலம்’ என்பதைவிட ‘நாடு’ இங்கு தமிழில் இயல்பாகவும் தேசிய-புவியியல் பொருளுடனும் அமைகிறது.
- source_word: נִשְׁבַּעְתִּי
  choice: நான் ... ஆணையிட்ட
  rationale: இறைவன் செய்த உறுதியான சத்தியத்தைச் சுருக்கமாகவும் கண்ணியமாகவும் தெரிவிக்கிறது.
- source_word: לַאֲבוֹתָם
  choice: அவர்களுடைய தந்தையருக்கு
  rationale: எபிரெயச் சொல்லின் ஆண்பால் பன்மை வடிவைத் தக்கவைக்கிறது; சூழலில் இது இஸ்ரவேலின் முற்பிதாக்களைக் குறிக்கிறது.
- source_word: לָתֵת לָהֶם
  choice: அவர்களுக்குக் கொடுப்பதாக
  rationale: சத்தியத்தின் உள்ளடக்கமான ‘அவர்களுக்குக் கொடுக்க’ என்பதைத் தமிழில் இயல்பான மேற்கோள் அமைப்பாகத் தருகிறது.
theological_decisions:
- issue: לַאֲבוֹתָם என்ற முற்பிதாக்கள் குறிப்பு
  choice: அவர்களுடைய தந்தையர்
  alternative: அவர்களுடைய மூதாதையர்
  rationale: மூலத்தில் ஆண்பால் பன்மை வெளிப்படையாக இருப்பதால் முதன்மை உரை அதைத் தக்கவைக்கிறது. அதேவேளையில், இச்சூழலில் உடனடி உயிரியல் தந்தையரை அல்ல, குறிப்பாக இஸ்ரவேலின் முற்பிதாக்களைக் குறிக்கும் பொருளை அடிக்குறிப்பு தெளிவுபடுத்துகிறது.
- issue: תַּנְחִיל என்பதன் காரணவினைப் பொருள்
  choice: உரிமைச்சொத்தாகக் கிடைக்கச் செய்வது
  alternative: உரிமைச்சொத்தாகப் பங்கிட்டுக் கொடுப்பது
  rationale: யோசுவா நாட்டின் இறுதி கொடையாளன் என்று சொல்லாமல், மக்கள் அதைச் சுதந்தரித்துக்கொள்ள அவர் வழிவகுப்பார் என்ற காரணவினைத் தன்மையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டது. ‘வலிமையாயும் துணிவாயும் இரு’ என்ற இணை கட்டளை மூலத்தின் இரட்டை வலியுறுத்தலைத் தக்கவைக்கிறது. ‘உரிமைச்சொத்து’ என்பது பரம்பரை உரிமையாகக் கிடைக்கும் நாட்டின் கருத்தை வெளிப்படுத்துகிறது; காரணவினைத் தன்மை அடிக்குறிப்புடன் பாதுகாக்கப்பட்டுள்ளது.
