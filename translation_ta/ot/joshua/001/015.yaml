source:
  edition: WLC
  text: עַ֠ד אֲשֶׁר יָנִ֨יחַ יְהוָ֥ה לַֽ/אֲחֵי/כֶם֮ כָּ/כֶם֒ וְ/יָרְשׁ֣וּ גַם הֵ֔מָּה אֶת הָ/אָ֕רֶץ אֲשֶׁר יְהוָ֥ה אֱלֹֽהֵי/כֶ֖ם נֹתֵ֣ן לָ/הֶ֑ם וְ/שַׁבְתֶּ֞ם לְ/אֶ֤רֶץ יְרֻשַּׁתְ/כֶם֙ וִֽ/ירִשְׁתֶּ֣ם אוֹתָ֔/הּ אֲשֶׁ֣ר נָתַ֣ן לָ/כֶ֗ם מֹשֶׁה֙ עֶ֣בֶד יְהוָ֔ה בְּ/עֵ֥בֶר הַ/יַּרְדֵּ֖ן מִזְרַ֥ח הַ/שָּֽׁמֶשׁ־׀־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/001/015.yaml
  text: until Yahweh gives your brothers rest[a], as he has given you, and they also take possession of the land that Yahweh your God is giving them. Then you shall return to the land of your possession and take possession of it, which Moses the servant of Yahweh gave you beyond the Jordan[b], toward the sunrise.
translation:
  language: ta
  text: யாவே உங்களுக்கு இளைப்பாறுதல் அளித்ததுபோல, உங்கள் சகோதரர்களுக்கும்[a] இளைப்பாறுதல் அளித்து, உங்கள் கடவுளாகிய யாவே அவர்களுக்கு அளிக்கும் நாட்டை அவர்களும் உரிமையாகப் பெற்றுக்கொள்ளும்வரை உதவுங்கள். பின்னர், யாவேயின் சேவகரான மோசே யோர்தானுக்கு அப்பால், சூரியன் உதிக்கும் திசையில்[b], உங்களுக்குக் கொடுத்த உங்கள் உரிமை நாட்டிற்குத் திரும்பி, அதை உரிமையாகப் பெற்றுக்கொள்ளுங்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘உங்கள் சக இஸ்ரவேலர்களுக்கும்.’ எபிரெயத்தில் ‘உங்கள் சகோதரர்களுக்கும்’; இங்கு இது மற்ற இஸ்ரவேல் கோத்திரத்தாரைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘கிழக்கே.’ சொல்லர்த்தமாக, ‘சூரியன் உதிக்கும் திசையில்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: יָנִיחַ
  choice: இளைப்பாறுதல் அளித்து
  rationale: நוח என்பதன் ஹிஃபில் வடிவம் இங்கு போர் மற்றும் குடியேற்றச் சூழலில் அமைதியையும் நிலைபெறுதலையும் வழங்குவதைக் குறிக்கிறது; ‘இளைப்பாறுதல் அளித்தல்’ மூல உருவகத்தையும் கருத்தையும் காக்கிறது.
- source_word: לַאֲחֵיכֶם
  choice: உங்கள் சகோதரர்களுக்கும்
  rationale: எபிரெயச் சொல் ஆண்பால் பன்மையில் ‘உங்கள் சகோதரர்கள்’ என உள்ளது; சூழலில் இது மற்ற இஸ்ரவேல் கோத்திரத்தாரைக் குறிக்கிறது.
- source_word: וְיָרְשׁוּ / וִירִשְׁתֶּם
  choice: உரிமையாக்கிக்கொள்ளுதல்
  rationale: ירשׁ என்பது இச்சூழலில் வழங்கப்பட்ட நாட்டைச் சுதந்தரமாகப் பெற்று உடைமையாக்குவதைக் குறிக்கிறது; ஒரே வினையின் இரு நிகழ்வுகளுக்கும் ஒரே தமிழ் சொற்றொடர் பயன்படுத்தப்பட்டுள்ளது.
- source_word: נֹתֵן
  choice: கொடுத்துக்கொண்டிருக்கும்
  rationale: நிகழ்காலப் பெயரெச்ச வடிவத்தின் தொடரும் அல்லது உடனடியாக நடைபெறும் தெய்வீகக் கொடையை வெளிப்படுத்துகிறது.
- source_word: אֶרֶץ יְרֻשַּׁתְכֶם
  choice: உங்கள் உரிமை நாடு
  rationale: அவர்களுக்கு ஒதுக்கப்பட்ட சுதந்தர உடைமையான நிலப்பகுதியைக் குறிக்கிறது; தமிழில் இயல்பாகவும் சுருக்கமாகவும் உள்ளது.
- source_word: עֶבֶד יְהוָה
  choice: யாவேயின் பணியாளரான
  rationale: மோசேயின் மதிப்புக்குரிய அதிகாரப்பூர்வ சேவையைக் குறிக்கும் பட்டம்; அடிமைத்தனத்தை முன்னிறுத்தாமல் சேவை உறவை வெளிப்படுத்துகிறது.
- source_word: בְּעֵבֶר הַיַּרְדֵּן
  choice: யோர்தானுக்கு அப்பால்
  rationale: மூலத்தின் வழக்கமான புவியியல் சொற்றொடரை நேரடியாகவும் இயல்பாகவும் தருகிறது.
- source_word: מִזְרַח הַשָּׁמֶשׁ
  choice: சூரியன் உதிக்கும் திசையில்
  rationale: ‘கிழக்கில்’ என்ற பொருளுடன் மூலத்தின் தெளிவான சூரிய உதய உருவகத்தையும் பாதுகாக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயர்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் உடன்படிக்கைப் பெயரான நான்கு எழுத்துத் திருப்பெயர் நேரடியாக உள்ளது; அதை பொதுப் பட்டமாக மாற்றாமல் ஒலிபெயர்த்து வழங்குகிறது.
- issue: אֲחֵיכֶם என்ற பாலினக் குறியுடைய உறவுச்சொல்
  choice: உங்கள் சகோதரர்கள்
  alternative: உங்கள் சக இஸ்ரவேலர்
  rationale: மூலத்தின் ஆண்பால் பன்மை வடிவத்தை முதன்மை உரையில் காத்து, சூழலில் உள்ள விரிந்த குறிப்பை அடிக்குறிப்பில் விளக்குகிறது.
translation_notes:
  register: நவீன தரமான, மரியாதைமிக்க தமிழ் பயன்படுத்தப்பட்டுள்ளது. எபிரெயச் செய்யுளின் காலவரிசையை இயல்பான தமிழ் வாக்கிய அமைப்பில் வெளிப்படுத்த தொடக்கத்தில் சூழலால் உணரப்படும் ‘உதவுங்கள்’ சேர்க்கப்பட்டுள்ளது; இது யோசுவா 1:14-இல் தொடங்கும் கட்டளையின் தொடர்ச்சியைத் தெளிவாக்குகிறது. தெய்வீகப் பெயர் ‘யாவே’ என ஒரேபடியாக வழங்கப்பட்டுள்ளது.
