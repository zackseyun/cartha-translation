    text: அல்லது, “உங்கள் உள்ளங்கால் எங்கு மிதிக்கிறதோ, அந்த ஒவ்வோர் இடத்தையும்.”
    reason: தொடர்புத் தொடரின் இயல்பான மாற்று மொழியாக்கம்
lexical_decisions:
- source_word: כָּל מָקוֹם
  choice: ஒவ்வோர் இடத்தையும்
  rationale: כָּל என்பதுடன் מָקוֹם சேர்ந்து ஒவ்வொரு இடத்தையும் தனித்தனியாகக் குறிக்கும் பகிர்வுப் பொருளைத் தருகிறது. தமிழில் ‘ஒவ்வோர் இடத்தையும்’ அந்த விரிவையும், முன்னிலைப்படுத்தப்பட்ட செயப்படுபொருள் அமைப்பையும் இயல்பாகப் பாதுகாக்கிறது.
- source_word: אֲשֶׁר ... בּוֹ
  choice: மிதிக்கும்
  rationale: எபிரெயத்தில் தொடர்புப்பெயரும் ‘அதில்’ என்ற முன்னிடைச்சொல் வடிவமும் சேர்ந்து ‘எந்த இடத்தில் ... மிதிக்கிறதோ’ என்ற பொருளைத் தருகின்றன. தமிழில் பெயரெச்சத் தொடரான ‘மிதிக்கும்’ இதைச் சுருக்கமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது; மாற்று அமைப்பு அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: תִּדְרֹךְ
  choice: மிதிக்கும்
  rationale: דרך என்பது காலால் மிதித்தல் அல்லது கால்பதித்தல் என்ற நேரடியான உருவகத்தைக் கொண்டது. நிலத்தின் மேல் உள்ளங்கால் படும் காட்சியை ‘மிதிக்கும்’ பாதுகாக்கிறது.
- source_word: כַּף רַגְלְכֶם
  choice: உங்கள் உள்ளங்கால்
  rationale: כַּף רֶגֶל என்பது காலின் அடிப்பகுதியை, அதாவது உள்ளங்காலை, குறிப்பாகக் குறிக்கிறது. பின்னொட்டு பன்மை உரியவர்களைக் குறித்தாலும், எபிரெய உருவகத்தைப் போல தமிழிலும் ‘உங்கள் உள்ளங்கால்’ என்ற ஒருமை பகிர்வுப் பொருளில் புரிகிறது.
- source_word: לָכֶם
  choice: உங்களுக்குக்
  rationale: இந்த முன்னிடைச்சொல் கொடையின் பெறுநர்களைக் குறிக்கிறது. ‘உங்களுக்குக்’ என்பது தமிழில் கொடுத்தல் வினையுடன் இயல்பாக அமைகிறது.
- source_word: נְתַתִּיו
  choice: கொடுத்திருக்கிறேன்
  rationale: எபிரெய நிறைவுவடிவம் கொடை உறுதியாக வழங்கப்பட்டதாக முன்வைக்கிறது. ‘கொடுத்திருக்கிறேன்’ நிறைவேற்றப்பட்ட கொடையையும் அதன் தற்போதைய செல்லுபடியையும் காட்டுகிறது; அதை எதிர்காலமாக மாற்றுவதில்லை.
- source_word: כַּאֲשֶׁר
  choice: சொன்னபடியே
  rationale: முன்பு மோசேயிடம் கூறப்பட்டதற்கும் இப்போதைய அறிவிப்பிற்கும் உள்ள ஒத்திசைவை ‘-படியே’ தெளிவாகக் காட்டுகிறது.
- source_word: דִּבַּרְתִּי אֶל מֹשֶׁה
  choice: மோசேயிடம் நான் சொன்ன
  rationale: דבר אל என்பதன் பொதுப் பொருள் ஒருவரிடம் பேசுதல் அல்லது சொல்லுதல். ‘சொன்ன’ என்பது இயல்பான தமிழ்; ‘வாக்குக் கொடுத்த’ என்று மொழிபெயர்த்து மூலத்தில் மறைமுகமாக உள்ள உள்ளடக்கத்தை வெளிப்படையாகச் சேர்ப்பதைத் தவிர்க்கிறது.
theological_decisions:
- issue: தெய்வீகக் கொடையின் காலநிலை மற்றும் நிறைவு
  choice: נְתַתִּיו என்பதை ‘கொடுத்திருக்கிறேன்’ என்று நிறைவுப் பொருளுடன் மொழிபெயர்த்தல்
  alternative: ‘கொடுக்கிறேன்’ அல்லது ‘கொடுப்பேன்’
  rationale: எபிரெய நிறைவுவடிவம் நிலத்தின் உடைமை வரலாற்றில் இன்னும் விரிவடைய வேண்டியிருந்தாலும், கொடை ஏற்கெனவே கடவுளால் உறுதிசெய்யப்பட்டதாகக் கூறுகிறது. எதிர்கால வடிவத்தைத் திணிக்காமல் இந்த உரையிலுள்ள உறுதிக்கும் வரலாற்று நிறைவேற்றத்திற்கும் இடையேயான இழுவிசை பாதுகாக்கப்படுகிறது.
