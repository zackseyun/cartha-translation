  yaml_path: translation/ot/joshua/001/003.yaml
  text: Every place on which the sole of your foot treads[a], I have given to you, just as I spoke to Moses.
translation:
  language: ta
  text: உங்கள் உள்ளங்கால் மிதிக்கும் ஒவ்வோர் இடத்தையும்[a] நான் உங்களுக்குக் கொடுத்திருக்கிறேன்; மோசேயிடம் நான் சொன்னபடியே.
  philosophy: optimal-equivalence
