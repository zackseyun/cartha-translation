lexical_decisions:
- source_word: וְ/לָ/רֽאוּבֵנִי
  choice: ரூபேனியரிடமும்
  rationale: இணைப்பிடைச்சொல்லும் முன்னிடைச்சொல்லும் ‘-இடமும்’ என்பதில் இயல்பாக வெளிப்படுகின்றன. ஒருமை இனப்பெயர் இங்கு ஒரு குழுவைக் கூட்டாகக் குறிப்பதால் ‘ரூபேனியர்’ எனப் பன்மைப் பொருளில் மொழிபெயர்க்கப்பட்டது.
- source_word: וְ/לַ/גָּדִי
  choice: காதியரிடமும்
  rationale: ஒருமை இனப்பெயர் காத் கோத்திரத்தாரைக் கூட்டாகக் குறிப்பதால் ‘காதியர்’ என வழங்கப்பட்டது; ‘-இடமும்’ என்பது இணைப்பையும் முகவரியையும் இயல்பாகக் காட்டுகிறது.
- source_word: וְ/לַ/חֲצִי שֵׁבֶט הַֽ/מְנַשֶּׁה
  choice: மனாசே கோத்திரத்தின் பாதிப்பேரிடமும்
  rationale: எபிரெயச் சொற்றொடர் ‘மனாசே கோத்திரத்தின் பாதி’ என்று பொருள்படும். தமிழில் அது மக்களில் பாதிப்பேரைக் குறிக்கிறது என்பதைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்க ‘கோத்திரத்தின் பாதிப்பேர்’ என வழங்கப்பட்டது.
- source_word: אָמַר
  choice: கூறியது
  rationale: אָמַר என்பதன் நேரடியான பொருள் ‘சொன்னான்/கூறினான்.’ அடுத்த வசனத்தில் தொடரும் உரையை அறிமுகப்படுத்தும் வாக்கிய அமைப்புக்கு ‘கூறியது’ இயல்பாக அமைகிறது.
- source_word: יְהוֹשֻׁעַ
  choice: யோசுவா
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் பரவலாக அறியப்படும் பெயர் வடிவம் பயன்படுத்தப்பட்டது.
- source_word: לֵ/אמֹר
  choice: ':'
  rationale: ‘சொல்லும்படி/சொல்லி’ என்ற பொருளுடைய இச்சொல் அடுத்த வசனத்தில் வரும் நேர்க் கூற்றை அறிமுகப்படுத்துகிறது. நவீன தமிழில் இதை முக்காற்புள்ளியால் இயல்பாக வெளிப்படுத்தலாம்; மூலத்தின் வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
