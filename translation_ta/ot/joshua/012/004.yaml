  source_fidelity: மூலத்தின் முக்கிய கூறுகள்—ஓகு, பாசான், ரெப்பாயீம், அஸ்தரோத், எத்ரேயி—பாதுகாக்கப்பட்டுள்ளன. ஆனால் தற்போதைய உரையில் “அவன் ரெப்பாயீமியரில் எஞ்சியவர்களில் ஒருவன்” தனி வாக்கியத் துண்டாக இருப்பதும், அதற்கு முன் உள்ள “ஆட்சிப்பகுதியும்” என்பதுடன் நிறுத்தற்குறியால் தவறாகப் பிரிக்கப்படுவதும் எபிரெயத் தொடரின் இணைப்பைத் தெளிவற்றதாக்குகிறது. திருத்தத்தில் ஓகு ரெப்பாயீமியரில் மீதியாயிருந்தவன் என்பதும், அவன் இரு இடங்களிலும் வாழ்ந்தான் என்பதும் தெளிவாகத் தக்கவைக்கப்பட்டுள்ளது.
  naturalness: ‘ஓகின்’ என்பதற்குப் பதிலாக பெயரின் அடிப்படை வடிவமான ‘ஓகு’க்கு உரிய வேற்றுமை வடிவமான ‘ஓகுவின்’ பயன்படுத்தப்பட்டுள்ளது. ‘ரெப்பாயீமியரில் எஞ்சியிருந்தவன்’ என்பது நவீன தரத் தமிழில் இயல்பாகவும் மூலத்தின் ஒருமைச் சுட்டுதலைத் தெளிவாகவும் வெளிப்படுத்துகிறது. வசனம் முந்தைய வசனத்திலிருந்து தொடரும் பட்டியல்-துண்டு என்பதை ‘-உம்’ காக்கிறது.
  terminology: ரெப்பாயீம் மக்களினப் பெயராகவே முதன்மை உரையில் வைக்கப்பட்டுள்ளது. மாற்று அடிக்குறிப்பு அதைத் தீர்மானமான இனவியல் விளக்கமாக்காமல், ‘பெரும் உருவத்தினர்’ என்னும் வாசிப்பு மாற்றை மட்டுமே தருகிறது. இடப்பெயர்களுக்கு அஸ்தரோத், எத்ரேயி என்ற ஒலிபெயர்ப்புகள் பயன்படுத்தப்பட்டுள்ளன.
