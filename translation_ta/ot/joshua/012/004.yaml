base_translation:
  language: en
  yaml_path: translation/ot/joshua/012/004.yaml
  text: and the territory of Og king of Bashan[a], from the remnant of the Rephaim, who lived in Ashtaroth and in Edrei.
translation:
  language: ta
  text: பாசானின் அரசனான ஓகுவின் ஆட்சிப்பகுதியும்; அவன் ரெப்பாயீமியரில்[a] எஞ்சியிருந்தவன்; அவன் அஸ்தரோத்திலும் எத்ரேயியிலும் வாழ்ந்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பெரும் உருவத்தினர்.” எபிரெயத்தில் வரும் “ரெப்பாயீம்” என்ற பெயர், வழக்கத்திற்கு மாறாகப் பெரிய உடலமைப்பு கொண்டவர்களாக நினைவுகூரப்பட்ட ஒரு பழங்கால மக்களைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/גְב֗וּל
  choice: ஆட்சிப்பகுதியும்
  rationale: இங்கு גְּבוּל என்பது ஓர் எல்லைக்கோட்டை மட்டும் அல்லாமல், ஓகின் ஆட்சிக்கு உட்பட்ட நிலப்பகுதியைக் குறிக்கிறது. முன்னுள்ள பட்டியலைத் தொடரும் ו இணைப்பை ‘-உம்’ வெளிப்படுத்துகிறது.
- source_word: ע֚וֹג
  choice: ஓகு
  rationale: தனிநபரின் பெயர்; எபிரெய ஒலிப்புக்கு அண்மையாகத் தமிழில் ஒலிபெயர்க்கப்பட்டது. வேற்றுமை உருபுடன் உரையில் ‘ஓகின்’ என வருகிறது.
- source_word: מֶ֣לֶךְ הַ/בָּשָׁ֔ן
  choice: பாசானின் அரசன்
  rationale: ஓகையும் அவன் அரசாண்ட பகுதியையும் அடையாளப்படுத்தும் நேரடியான உடைமைத் தொடர்; בָּשָׁן இடப்பெயராக ஒலிபெயர்க்கப்பட்டது.
- source_word: מִ/יֶּ֖תֶר
  choice: எஞ்சியவர்களில் ஒருவன்
  rationale: יֶתֶר எஞ்சிய பகுதி அல்லது மீதியானவர்களைக் குறிக்கிறது. ஓகு அந்தக் குழுவைச் சேர்ந்தவன் என்பதை இயல்பான தமிழில் வெளிப்படுத்த இவ்வாறு மொழிபெயர்க்கப்பட்டது.
- source_word: הָ/רְפָאִ֑ים
  choice: ரெப்பாயீமியர்
  rationale: விளக்கப் பொருளான ‘மாபெரும் உருவத்தினர்’ என்பதை முதன்மை உரையில் புகுத்தாமல், பழங்கால மக்களினப் பெயராகப் பாதுகாக்கப்பட்டது; விளக்க மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: הַ/יּוֹשֵׁ֥ב
  choice: அவன் ... வாழ்ந்தான்
  rationale: יֹשֵׁב என்னும் ஒருமை வினையெச்சம் கூட்டமாகிய ரெப்பாயீமியரை அல்ல, ஓகையே சுட்டுகிறது. ‘வாழ்ந்தான்’ என்பது நவீன தமிழில் இயல்பான குடியிருப்புச் சொல்.
- source_word: בְּ/עַשְׁתָּר֖וֹת
  choice: அஸ்தரோத்தில்
  rationale: இடப்பெயர் தமிழில் ஒலிபெயர்க்கப்பட்டு, בְּ என்னும் இடப்பொருள் ஏழாம் வேற்றுமையால் காட்டப்பட்டது.
- source_word: וּ/בְ/אֶדְרֶֽעִי
  choice: எத்ரேயியிலும்
  rationale: இடப்பெயர் ஒலிபெயர்க்கப்பட்டு, இணைப்பும் இடப்பொருளும் ‘-இலும்’ மூலம் வெளிப்படுத்தப்பட்டன.
theological_decisions:
- issue: רְפָאִים என்பது மக்களினப் பெயரா அல்லது உடல்வாகைக் குறிக்கும் சொல்லா?
  choice: முதன்மை உரையில் ‘ரெப்பாயீமியர்’ என்ற மக்களினப் பெயர்
  alternative: ‘மாபெரும் உருவத்தினர்’
  rationale: எபிரெயச் சொல் ஒரு பழங்கால மக்களைக் குறிக்கும் பெயராக இங்கு செயல்படுகிறது. அவர்களின் உடல்வாகைப் பற்றிய பாரம்பரியப் புரிதலை மொழிபெயர்ப்பில் தீர்மானமாக்காமல், மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன தரத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டது. மூலத்தின் பட்டியல் தொடர்ச்சியை ‘-உம்’ காக்கிறது. நீளமான எபிரெயத் தொடரைத் தெளிவுக்காக இரண்டு வாக்கியங்களாக அமைத்தாலும், ஒருமை வினையெச்சம் ஓகையே சுட்டுகிறது என்பதும் இடப்பெயர்கள் இரண்டும் அவனுடைய வாழ்விடங்களாக இருப்பதும் பாதுகாக்கப்பட்டுள்ளன.
