  yaml_path: translation/ot/joshua/012/007.yaml
  text: And these are the kings of the land whom Joshua and the sons of Israel struck down beyond the Jordan westward[a], from Baal-gad in the Valley of Lebanon as far as Mount Halak, which rises toward Seir[b]; and Joshua gave it to the tribes of Israel as an inheritance according to their divisions.
translation:
  language: ta
  text: யோர்தானுக்கு அப்பால், மேற்குத் திசையில், லெபனோன் பள்ளத்தாக்கிலுள்ள பாகால்-காத் முதல் சேயீரை நோக்கி உயர்ந்து செல்லும் ஹாலாக் மலை[a] வரை யோசுவாவும் இஸ்ரவேல் மக்களும் வீழ்த்திய நாட்டின் அரசர்கள் இவர்களே; அந்த நாட்டை யோசுவா இஸ்ரவேலின் கோத்திரங்களுக்கு அவரவர் பங்குகளின்படி சுதந்தரமாகக் கொடுத்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சேயீருக்குச் செல்லும் ஹாலாக் மலை.”
    reason: הָעֹלֶה שֵׂעִירָה என்பதன் பங்கேற்பு வடிவம் மலையின் உயர்வு/ஏற்றப்பாதையையும் சேயீரை நோக்கிய திசையையும் சுட்டுகிறது; «நோக்கி உயர்ந்து செல்லும்» என்ற முதன்மை வாசகம் இலக்கை உறுதியாக அடைவதாகக் கூறாமல் மூலத்தின் நுணுக்கத்தைக் காக்கிறது.
lexical_decisions:
- source_word: וְאֵלֶּה מַלְכֵי הָאָרֶץ
  choice: அந்த நாட்டின் அரசர்கள் இவர்களே
  rationale: பின்வரும் பட்டியலை அறிமுகப்படுத்தும் எபிரேய அமைப்பை இயல்பான நவீனத் தமிழில் தருகிறது; וְ என்ற இணைப்பு முந்தைய பகுதியுடன் தொடர்ச்சியை உணர்த்துகிறது.
- source_word: אֲשֶׁר הִכָּה
  choice: வீழ்த்திய
  rationale: போர்ச் சூழலில் נכה என்பதன் தாக்கி முறியடித்தல்/கொல்லுதல் சார்ந்த வலிமையைச் சுருக்கமாகத் தக்கவைக்கிறது.
- source_word: וּבְנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் மக்களும்
  rationale: சொல்லுக்கு சொல் 'இஸ்ரவேலின் மகன்கள்' என்றாலும், இங்கு மக்களினத்தைக் குறிக்கும் மரபுச் சொற்றொடரை இயல்பான தமிழில் உள்ளடக்கமாகத் தருகிறது.
- source_word: בְּעֵבֶר הַיַּרְדֵּן יָמָּה
  choice: யோர்தானுக்கு அப்பால் மேற்குப் பகுதியில்
  rationale: நதியின் மேற்குப் பக்கத்தைக் குறிக்கும் இடவியல் பார்வையையும் יָמָּה என்ற மேற்குத் திசைக் குறிப்பையும் தெளிவாகப் பாதுகாக்கிறது.
- source_word: מִבַּעַל גָּד בְּבִקְעַת הַלְּבָנוֹן
  choice: லெபனோன் பள்ளத்தாக்கிலுள்ள பாகால்-காத் முதல்
  rationale: இடப்பெயரை ஒலிபெயர்த்து, בִּקְעָה குறிக்கும் அகன்ற பள்ளத்தாக்கை இயல்பான தமிழில் தருகிறது.
- source_word: וְעַד הָהָר הֶחָלָק
  choice: ஆலாக் மலை வரை
  rationale: הֶחָלָק என்பதை இச்சூழலில் நிலைபெயராகக் கருதி ஒலிபெயர்க்கிறது; 'வழுவழுப்பான மலை' என விளக்கிப் பொருளைத் தீர்மானிப்பதைத் தவிர்க்கிறது.
- source_word: הָעֹלֶה שֵׂעִירָה
  choice: சேயீரை நோக்கி உயர்ந்து செல்லும்
  rationale: עֹלֶה என்பதின் ஏறுதல்/உயர்தல் பொருளையும், திசையைச் சுட்டும் שֵׂעִירָה என்பதையும் பாதுகாக்கிறது; இலக்கை முற்றாக அடைகிறது என்று மிகைப்படுத்தவில்லை.
- source_word: וַיִּתְּנָהּ יְהוֹשֻׁעַ
  choice: இருந்த நாட்டை யோசுவா ... கொடுத்தார்
  rationale: பெண்பால் ஒருமை பின்னொட்டு முன் வரும் 'நாடு' என்பதைக் குறிக்கிறது என்பதைத் தமிழில் தெளிவாக்குகிறது.
- source_word: לְשִׁבְטֵי יִשְׂרָאֵל יְרֻשָּׁה
  choice: இஸ்ரவேலின் கோத்திரங்களுக்கு ... உரிமைச்சொத்தாக
  rationale: கோத்திரப் பங்கீட்டுச் சூழலில் יְרֻשָּׁה குறிக்கும் தலைமுறை உரிமையுடன் வழங்கப்பட்ட நிலச்சொத்தைத் தெளிவாகக் காட்டுகிறது.
- source_word: כְּמַחְלְקֹתָם
  choice: அவரவர் பிரிவுகளின்படி
  rationale: கோத்திரங்களுக்குள் நிர்ணயிக்கப்பட்ட பங்குகள் அல்லது பிரிவுகளுக்கு ஏற்ப வழங்கப்பட்டதைப் பாதுகாக்கிறது.
theological_decisions:
- issue: יְרֻשָּׁה என்பதன் உடன்படிக்கை மற்றும் நிலப் பங்கீட்டு நுணுக்கம்
  choice: உரிமைச்சொத்தாக
  alternative: சுதந்தரமாக
  rationale: '''உரிமைச்சொத்து'' என்பது நவீனத் தமிழில் புரியக்கூடியதாக இருந்து, ஒதுக்கிக் கொடுக்கப்பட்ட நிலத்தின் நிலையான உடைமை நுணுக்கத்தைத் தருகிறது; குறிப்பிட்ட சமய மரபின் தொழில்நுட்பப் பொருளைத் திணிப்பதில்லை.'
translation_notes:
  register: நவீனத் தரத் தமிழ்; வரலாற்று-புவியியல் உரைக்கு ஏற்ற கண்ணியமான நடை. இடப்பெயர்கள் தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளன. நீண்ட எபிரேய வாக்கியம் வாசிப்புத் தெளிவுக்காக இரட்டைப் புள்ளியுடன் ஒழுங்குபடுத்தப்பட்டுள்ளது; பொருள் உறவுகள் காக்கப்பட்டுள்ளன.
