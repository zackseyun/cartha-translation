revisions:
- from: 'யோசுவாவும் இஸ்ரவேலின் மக்களும் யோர்தானுக்கு அப்பால் மேற்குப் பகுதியில் வீழ்த்திய அந்த நாட்டின் அரசர்கள் இவர்களே: லெபனோன் பள்ளத்தாக்கிலுள்ள பாகால்-காத் முதல் சேயீரை நோக்கி உயர்ந்து செல்லும் ஆலாக் மலை[a] வரை இருந்த நாட்டை யோசுவா இஸ்ரவேலின் கோத்திரங்களுக்கு அவரவர் பிரிவுகளின்படி உரிமைச்சொத்தாகக் கொடுத்தார்.'
  to: யோர்தானுக்கு அப்பால், மேற்குத் திசையில், லெபனோன் பள்ளத்தாக்கிலுள்ள பாகால்-காத் முதல் சேயீரை நோக்கி உயர்ந்து செல்லும் ஹாலாக் மலை[a] வரை யோசுவாவும் இஸ்ரவேல் மக்களும் வீழ்த்திய நாட்டின் அரசர்கள் இவர்களே; அந்த நாட்டை யோசுவா இஸ்ரவேலின் கோத்திரங்களுக்கு அவரவர் பங்குகளின்படி சுதந்தரமாகக் கொடுத்தார்.
  rationale: மூல எபிரேயத்தின் திசைக் குறிப்பு, «நாடு» என்ற சுட்டுப்பெயரின் முன்னிலை, மற்றும் இடப்பெயரின் ஒலிபெயர்ப்பு ஆகியவை துல்லியப்படுத்தப்பட்டன. வாக்கியத்தின் பட்டியல்-அறிமுக அமைப்பும், கோத்திரங்களுக்கான நில ஒதுக்கீட்டின் பொருளும் காக்கப்பட்டுள்ளன. இறையியல் விளக்கமோ கூடுதல் வரலாற்றுத் தகவலோ சேர்க்கப்படவில்லை.
