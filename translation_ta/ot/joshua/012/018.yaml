translation:
  language: ta
  text: ஆப்பேக்கின் அரசன், ஒருவன்; சாரோனின்[a] அரசன், ஒருவன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அந்தச் சாரோன் பகுதியின் அரசன்.” எபிரெயத்தில் ‘சாரோன்’ என்பதற்கு முன் குறிப்புப் பெயருருபு உள்ளது; ஆனால் தமிழில் இப்பகுதியின் பெயரைப் பொதுவாக ‘சாரோன்’ என்றே இயல்பாகக் குறிப்பிடலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֶלֶךְ
  choice: அரசன்
  rationale: வெற்றிகொள்ளப்பட்ட ஆட்சியாளர்களைப் பட்டியலிடும் இச்சூழலில், இயல்பான தமிழில் இடப்பெயருடன் ஆறாம் வேற்றுமை உருபை இணைத்து ‘ஆப்பேக்கின் அரசன்’ என வழங்குவது எபிரெயத் தொடரமைப்பைப் பாதுகாக்கிறது.
- source_word: אֲפֵק
  choice: ஆப்பேக்
  rationale: இது ஓர் இடப்பெயர்; பொருள் மொழிபெயர்ப்பு செய்யாமல், எபிரெய உச்சரிப்பை நெருங்கும் வகையில் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: אֶחָד
  choice: ஒருவன்
  rationale: ஒவ்வொரு நகரம் அல்லது பகுதிக்குரிய அரசர்களை எண்ணிக் குறிப்பிடும் பட்டியலில் இது எண்ணிக்கைச் சொல்லாக வருகிறது. ‘ஒருவன்’ என்பது சுருக்கமான பட்டியல் நடையையும், எண்ணப்படுவது மனித அரசன் என்பதையும் இயல்பான தமிழில் காட்டுகிறது.
- source_word: לַשָּׁרוֹן
  choice: சாரோனின்
  rationale: முன்னொட்டு அந்தப் பகுதியுடனான தொடர்பைக் குறிக்கிறது; ‘சாரோனின் அரசன்’ என்பது தமிழில் இயல்பான புவியியல் தொடர்பை வெளிப்படுத்துகிறது. எபிரெயத்தில் ‘சாரோன்’ என்பதோடு வரும் சுட்டு இடைச்சொல்லின் நுட்பம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
