  text: סִיחוֹן֙ מֶ֣לֶךְ הָ/אֱמֹרִ֔י הַ/יּוֹשֵׁ֖ב בְּ/חֶשְׁבּ֑וֹן מֹשֵׁ֡ל מֵ/עֲרוֹעֵ֡ר אֲשֶׁר֩ עַל שְׂפַת נַ֨חַל אַרְנ֜וֹן וְ/ת֤וֹךְ הַ/נַּ֨חַל֙ וַ/חֲצִ֣י הַ/גִּלְעָ֔ד וְ/עַד֙ יַבֹּ֣ק הַ/נַּ֔חַל גְּב֖וּל בְּנֵ֥י עַמּֽוֹן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/012/002.yaml
  text: Sihon king of the Amorites[a], who lived in Heshbon, ruling from Aroer, which is on the bank of the Arnon Valley, and from the middle of the valley, and half of Gilead, as far as the Jabbok Valley[b], the border of the sons of Ammon.
translation:
  language: ta
  text: எஸ்போனில் குடியிருந்த எமோரியரின் அரசனாகிய சீகோன், அர்னோன் பள்ளத்தாக்கின் கரையிலுள்ள ஆரோவேரிலிருந்து, அந்தப் பள்ளத்தாக்கின் நடுப்பகுதியையும் கீலேயாத்தின் பாதியையும் உட்படுத்தி, அம்மோனியரின்[a] எல்லையான யாப்போக்கு பள்ளத்தாக்குவரை ஆட்சி செய்தான்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொற்படி, “அம்மோனின் மகன்கள்”; அதாவது, அம்மோனியர்.
    reason: lexical_alternative
  - marker: b
    text: இங்கு “பள்ளத்தாக்கு” என்று மொழிபெயர்க்கப்பட்ட எபிரெயச் சொல் נחל, பள்ளத்தாக்கு, வாடி அல்லது நீரோடைப் படுகையைக் குறிக்கலாம். இங்கே அர்னோனும் யாப்போக்கும் நிலப்பரப்பு எல்லைகளாகக் குறிப்பிடப்படுகின்றன.
    reason: cultural_note
lexical_decisions:
- source_word: הַיּוֹשֵׁב
  choice: குடியிருந்த
  rationale: ישׁב என்பதன் இங்குள்ள பங்கேற்புவினை வடிவம் ஓரிடத்தில் வசித்தலைக் குறிக்கிறது; ‘குடியிருந்த’ என்பது இயல்பான நவீனத் தமிழ்.
- source_word: מֹשֵׁל
  choice: ஆளுகை செய்த பகுதி
  rationale: משׁל அரசியல் ஆட்சியைக் குறிக்கிறது. எபிரெய வாக்கியத்தின் பட்டியல் அமைப்பைத் தமிழில் தெளிவாக்க ‘ஆளுகை செய்த பகுதி’ என வழங்கப்பட்டது.
- source_word: מֵעֲרוֹעֵר
  choice: ஆரோவேர் தொடங்கி
  rationale: מִן என்ற முன்னொட்டு நிலப்பரப்பின் தொடக்கப் புள்ளியைக் குறிக்கிறது.
- source_word: שְׂפַת נַחַל אַרְנוֹן
  choice: அர்னோன் பள்ளத்தாக்கின் கரை
  rationale: שׂפה என்பது கரை/விளிம்பு என்றும் נחל என்பது பள்ளத்தாக்கு, வாடி அல்லது நீரோடைப் படுகை என்றும் குறிக்கலாம்; எல்லைச் சூழலில் ‘பள்ளத்தாக்கின் கரை’ பொருத்தமானது.
- source_word: וְתוֹךְ הַנַּחַל
  choice: அந்தப் பள்ளத்தாக்கின் நடுப்பகுதியையும் உள்ளடக்கி
  rationale: תוך என்பது நடுவை அல்லது உட்பகுதியைக் குறிக்கிறது. நிலப்பரப்புப் பட்டியலின் தொடர்பை இயல்பான தமிழில் வெளிப்படுத்த ‘உள்ளடக்கி’ சேர்க்கப்பட்டது.
- source_word: וַחֲצִי הַגִּלְעָד
  choice: கீலேயாத்தின் பாதியையும்
  rationale: חצי நேரடியாக பாதிப் பகுதியைக் குறிக்கிறது.
- source_word: וְעַד יַבֹּק הַנַּחַל
  choice: யாப்போக்கு பள்ளத்தாக்குவரை
  rationale: עד எல்லையின் இறுதிப் புள்ளியைக் குறிக்கிறது; נחל என்பதிலுள்ள நிலவியல் விரிவை ‘பள்ளத்தாக்கு’ காக்கிறது.
- source_word: גְּבוּל בְּנֵי עַמּוֹן
  choice: அம்மோனியரின் எல்லை
  rationale: בני עמון சொற்படி ‘அம்மோனின் மகன்கள்’; இங்கு அது அம்மோன் மக்களைக் குறிக்கும் இனப்பெயர் என்பதால் இயல்பான தமிழில் ‘அம்மோனியர்’ என வழங்கப்பட்டு, சொற்படி வடிவம் அடிக்குறிப்பில் தரப்பட்டது.
- source_word: הָאֱמֹרִי
  choice: எமோரியர்
  rationale: வடிவம் ஒருமையாக இருந்தாலும் ராஜா ஆட்சி செய்த மக்கள் இனத்தைக் குறிக்கிறது; ‘எமோரியரின் ராஜா’ என்பது இயல்பான தமிழ்.
