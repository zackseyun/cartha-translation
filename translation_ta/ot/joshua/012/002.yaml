revisions:
- from: 'எஸ்போனில் குடியிருந்த எமோரியரின் ராஜாவாகிய சீகோன் ஆளுகை செய்த பகுதி: அர்னோன் பள்ளத்தாக்கின் கரையிலுள்ள ஆரோவேர் தொடங்கி, அந்தப் பள்ளத்தாக்கின் நடுப்பகுதியையும் கீலேயாத்தின் பாதியையும் உள்ளடக்கி, அம்மோனியரின்[a] எல்லையான யாப்போக்கு பள்ளத்தாக்குவரை பரவியிருந்தது.[b]'
  to: எஸ்போனில் குடியிருந்த எமோரியரின் அரசனாகிய சீகோன், அர்னோன் பள்ளத்தாக்கின் கரையிலுள்ள ஆரோவேரிலிருந்து, அந்தப் பள்ளத்தாக்கின் நடுப்பகுதியையும் கீலேயாத்தின் பாதியையும் உட்படுத்தி, அம்மோனியரின்[a] எல்லையான யாப்போக்கு பள்ளத்தாக்குவரை ஆட்சி செய்தான்.[b]
  rationale: The revision makes சீகோன் the explicit subject of “ஆட்சி செய்தான்,” corresponding directly to מֹשֵׁל (“ruling”), rather than recasting the statement as an autonomous expansion of territory. It preserves the geographic list, the inclusion of the valley’s middle and half of Gilead, both footnote anchors, and the lexical ambiguity of נחל.
