translation_notes:
  register: நவீன நிலையான தமிழில், கண்ணியமானதும் பொதுவாசகர்களுக்கு எளிதில் புரிவதுமான நடையில் மொழிபெயர்க்கப்பட்டது. எபிரெய வசனத்தின் துண்டுத்தொடர் அமைப்பு தமிழில் முழுமையான வாக்கியமாக்கப்பட்டாலும், ஆட்சிப் பகுதியின் தொடக்கம், உள்ளடக்கம், முடிவு ஆகிய நிலவியல் தொடர்புகள் காக்கப்பட்டுள்ளன. எல்லா அடிக்குறிப்பு குறிகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
