lexical_decisions:
- source_word: מֶלֶךְ
  choice: அரசன்
  rationale: இடப்பெயரைத் தொடர்ந்து வரும் சார்பு அமைப்பைத் தமிழில் உடைமை வேற்றுமையால் இயல்பாகக் காட்டி, நகர-அரசின் ஆட்சியாளரைக் குறிக்க ‘அரசன்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: יַרְמוּת
