- source_word: אֶחָד
  choice: ஒருவன்
  rationale: தோற்கடிக்கப்பட்ட அரசர்களைக் கணக்கிடும் சுருக்கமான பட்டியல் வாய்பாட்டைத் தக்கவைத்து, மனித ஆட்சியாளருக்குரிய இயல்பான தமிழ்ச் சொல்லாகத் தேர்ந்தெடுக்கப்பட்டது.
- source_word: לָכִישׁ
  choice: லாகீசு
  rationale: எபிரெய இடப்பெயரின் ஒலிவடிவத்தைத் தமிழில் எழுத்துப்பெயர்த்தது; இறுதி மெய்யொலியை இயல்பாக வாசிக்க உதவும் தமிழ் வடிவம் பயன்படுத்தப்பட்டது.
