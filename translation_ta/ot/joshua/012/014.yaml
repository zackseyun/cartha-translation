translation:
  language: ta
  text: ஓர்மாவின் ராஜா, ஒருவன்; ஆராதின் ராஜா, ஒருவன்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מֶלֶךְ
  choice: ராஜா
  rationale: ஒவ்வொரு நகரத்தையும் ஆண்ட அரசனைக் குறிக்கும் பெயர்ச்சொல்; பட்டியலின் சுருக்கமான அமைப்பைத் தமிழிலும் காக்கிறது.
- source_word: חָרְמָה
  choice: ஓர்மா
  rationale: இடப்பெயர் என்பதால் பொருள் மொழிபெயர்ப்பு செய்யாமல், எபிரெய உச்சரிப்புக்கு நெருக்கமாக ஒலிபெயர்க்கப்பட்டது.
- source_word: אֶחָד
  choice: ஒருவன்
  rationale: தோற்கடிக்கப்பட்ட ராஜாக்களைத் தனித்தனியாக எண்ணும் சுருக்கப் பட்டியல் மொழிநடை; நபரைக் குறிப்பதால் இயல்பான தமிழ் ஆண்பால் எண்ணுப்பெயர் பயன்படுத்தப்பட்டது.
- source_word: עֲרָד
  choice: ஆராத்
  rationale: இடப்பெயர் என்பதால் எபிரெய வடிவத்திற்கு நெருக்கமாக ஒலிபெயர்க்கப்பட்டது; வேற்றுமை உருபுடன் ‘ஆராதின்’ என வருகிறது.
