  naturalness: “ஓர்மாவின் ராஜா, ஒருவன்; ஆராதின் ராஜா, ஒருவன்” என்பது வெற்றிபெற்ற அரசர்களின் எண்ணிக்கையைச் சுருக்கமாகப் பதிவு செய்யும் இப்பட்டியலின் நடைக்கு இயல்பான நவீனத் தரத் தமிழ் வடிவமாகும்.
  terminology: ‘ராஜா’ அரசரைக் குறிக்கத் தெளிவானதும் சூழலுக்கு ஏற்றதுமாகும். ‘ஓர்மா’ மற்றும் ‘ஆராத்’ நிலையான தமிழ் வேதாகம ஒலிவடிவங்களுடன் ஒத்திருக்கின்றன. இறுதிமெய்யுள்ள ‘ஆராத்’ பெயருக்கு ‘ஆராதின்’ என அமைத்தல் இயல்பானது.
