  rationale: எபிரெய இடப்பெயரின் ஒலிபெயர்ப்பு; தமிழில் வேற்றுமை உருபு சேரும்போது ‘தானாக்கின்’ என வருகிறது.
- source_word: אֶחָד
  choice: ஒருவன்
  rationale: மனித ஆட்சியாளர்களை எண்ணும் பட்டியல் சூழலில் ‘ஒன்று’ என்பதைக் காட்டிலும் ‘ஒருவன்’ இயல்பான தமிழ்; அதேவேளையில் மூலத்தின் சுருக்கமான கணக்கீட்டு முறையைத் தக்கவைக்கிறது.
- source_word: מֶלֶךְ
  choice: அரசன்
  rationale: இரண்டாவது பட்டியல் பதிவிலும் அதே இணைப்புநிலைச் சொல்லை ஒரேவிதமாக மொழிபெயர்க்கிறது.
- source_word: מְגִדּוֹ
  choice: மெகிதோ
  rationale: எபிரெய இடப்பெயரின் ஒலிபெயர்ப்பு.
- source_word: אֶחָד
  choice: ஒருவன்
  rationale: மூல எபிரெயத்தின் திரும்பவரும் எண்ணிக்கைச் சொல்லையும் பட்டியலின் இணை அமைப்பையும் காக்கிறது.
