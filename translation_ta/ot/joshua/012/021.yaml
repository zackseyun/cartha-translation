lexical_decisions:
- source_word: מֶלֶךְ
  choice: அரசன்
  rationale: ஒவ்வொரு நகர-அரசின் ஆட்சியாளரையும் குறிக்கும் இணைப்புநிலைப் பெயர்ச்சொல்; தமிழில் நகரப்பெயருடன் ‘-இன் அரசன்’ என இயல்பாக வழங்கப்படுகிறது.
- source_word: תַּעְנַךְ
