lexical_decisions:
- source_word: מֶלֶךְ
  choice: அரசன்
  rationale: ஒவ்வொரு நகர-அரசின் ஆட்சியாளரையும் குறிக்கும் எபிரெயக் கட்டமைப்பைத் தமிழில் இயல்பான உடைமைத் தொடராக வழங்குகிறது.
- source_word: מָדוֹן
  choice: மாதோன்
  rationale: இது ஓர் இடப்பெயர்; எபிரெய உச்சரிப்பை அணுகும் வகையில் ஒலிபெயர்க்கப்பட்டது.
- source_word: אֶחָד
  choice: ஒருவன்
  rationale: அரசர்களை எண்ணும் சுருக்கமான பட்டியல் நடையைத் தக்கவைத்து, மனிதரைக் குறிக்கும் இயல்பான தமிழ் எண்ணுப்பெயர் பயன்படுத்தப்பட்டது.
- source_word: חָצוֹר
  choice: ஆத்சோர்
  rationale: இது ஓர் இடப்பெயர்; எபிரெய חָצוֹר என்பதன் ஒலியை அணுகும் வகையில் ஒலிபெயர்க்கப்பட்டது.
