base_translation:
  language: en
  yaml_path: translation/ot/joshua/012/005.yaml
  text: and ruling over Mount Hermon[a], and Salecah, and all Bashan, as far as the border of the Geshurites and the Maacathites, and half of Gilead, to the border of Sihon king of Heshbon.
translation:
  language: ta
  text: எர்மோன் மலையிலும், சல்காவிலும், பாசான் முழுவதிலும் ஆட்சி செலுத்தினான்; கெசூரியர் மற்றும் மாகாத்தியரின் எல்லைவரையும், எஸ்போன் அரசன் சீகோனின் எல்லைவரையுள்ள கீலேயாத்தின் பாதியிலும் ஆட்சி செலுத்தினான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּמֹשֵׁל
  choice: அவன் ... ஆட்சி செய்தான்
  rationale: משל என்பதன் பங்கெச்ச வடிவம் முந்தைய வசனத்திலிருந்து ஓகின் ஆட்சிப்பரப்பைப் பற்றிய விளக்கத்தைத் தொடர்கிறது. தமிழில் இயல்பான தொடர்ச்சிக்காக வினைமுற்றாக வழங்கப்பட்டுள்ளது; பங்கெச்சத் தொடர்பு அடிக்குறிப்பில் சுட்டப்படுகிறது.
- source_word: בְּהַר חֶרְמוֹן
  choice: எர்மோன் மலை
  rationale: משל உடன் வரும் ב ஆட்சிக்குட்பட்ட பரப்பைக் குறிக்கிறது; தமிழில் ‘ஆட்சி செய்தான்’ என்பதே அந்த உறவைத் தெளிவாக்குகிறது.
- source_word: וּבְסַלְכָה
  choice: சல்கா
  rationale: ஓகின் ஆட்சிக்குட்பட்ட இடப்பெயர்; எபிரெய ஒலிப்பை நெருக்கமாகப் பிரதிபலிக்கும் தமிழ் எழுத்துப்பெயர்ப்பு.
- source_word: וּבְכָל הַבָּשָׁן
  choice: பாசான் முழுவதையும்
  rationale: כָל என்பது அந்தப் பகுதி முழுவதையும் குறிக்கிறது; தமிழ் வேற்றுமை உருபு ஆட்சியின் செயப்படுபொருள் உறவை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: עַד גְּבוּל
  choice: எல்லைவரையிலும்
  rationale: עַד + גְּבוּל ஆட்சிப்பரப்பின் எல்லையை அல்லது எட்டுமிடத்தைச் சுட்டுகிறது.
- source_word: הַגְּשׁוּרִי
  choice: கெசூரியர்
  rationale: ஒருமை இனப்பெயர் வடிவம் இங்கு அந்த மக்களையும் அவர்களுடைய எல்லையையும் கூட்டாகக் குறிக்கிறது.
- source_word: וְהַמַּעֲכָתִי
  choice: மற்றும் மாகாத்தியர்
  rationale: இனப்பெயர் வடிவம் எல்லையோடு தொடர்புடைய மக்களைக் குறிக்கிறது; தமிழில் மரியாதை/கூட்டுப்பன்மை வடிவம் இயல்பானது.
- source_word: וַחֲצִי הַגִּלְעָד
  choice: கீலேயாத்தின் பாதி
  rationale: கீலேயாத் பிரதேசத்தின் ஒரு பாதிப் பகுதியை நேரடியாகக் குறிக்கிறது.
- source_word: גְּבוּל סִיחוֹן מֶלֶךְ חֶשְׁבּוֹן
  choice: எஸ்போன் அரசன் சீகோனின் எல்லை
  rationale: இந்தச் சொற்றொடர் கீலேயாத்தின் பாதிப்பகுதியின் வரம்பை மேலும் வரையறுக்கிறது; எஸ்போன் என்பது சீகோனை அடையாளப்படுத்தும் அரசாட்சி இடம்.
