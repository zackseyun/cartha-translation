  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான வரலாற்று-புவியியல் நடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய வாக்கியத்தின் நீண்ட தொடரைத் தெளிவாக்க அரைப்புள்ளியும் ‘ஆட்சிப்பரப்பு பரவியிருந்தது’ என்ற இயல்பான தமிழ் அமைப்பும் பயன்படுத்தப்பட்டுள்ளன; எல்லை உறவுகள் பாதுகாக்கப்பட்டுள்ளன.
