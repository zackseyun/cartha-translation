translation:
  language: ta
  text: தெபீரின் ராஜா, ஒருவன்; கேதேரின் ராஜா, ஒருவன்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מֶלֶךְ
  choice: ராஜா
  rationale: தோற்கடிக்கப்பட்ட அரசர்களின் பட்டியலில், ஒவ்வொரு ஊர்ப்பெயருடனும் இணைந்து அந்த ஊரை ஆண்ட அரசனைக் குறிக்கிறது. தமிழில் ‘தெபீரின் ராஜா’ என்ற உடைமைத் தொடர் இயல்பாகவும் சுருக்கமாகவும் உள்ளது.
- source_word: דְּבִר
  choice: தெபீர்
  rationale: இது ஓர் இடப்பெயர்; எபிரெய ஒலிப்புக்கு நெருக்கமாகத் தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: אֶחָד
  choice: ஒருவன்
  rationale: இங்கு ஒவ்வோர் அரசனையும் தனித்தனியாக எண்ணிக் குறிப்பிடும் பட்டியல் நடை உள்ளது. நபரைக் குறிக்கும் இயல்பான தமிழாக ‘ஒருவன்’ அமைந்து, எபிரெயத்தின் சுருக்கமான கணக்கீட்டு நடையையும் காக்கிறது.
- source_word: גֶּדֶר
  choice: கேதேர்
  rationale: இது ஓர் இடப்பெயர்; எபிரெய மெய்யெழுத்து மற்றும் உயிரொலிகளுக்கு நெருக்கமாகத் தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளது.
theological_decisions: []
translation_notes:
  register: நவீன தரத் தமிழில், மூலத்தின் சுருக்கமான பட்டியல் அமைப்பும் இணைநடையும் பாதுகாக்கப்பட்டுள்ளன. அரசப் பதவிக்குப் பொதுவாகப் புரியும், கண்ணியமான ‘ராஜா’ பயன்படுத்தப்பட்டுள்ளது.
