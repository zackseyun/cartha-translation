  rationale: The revision removes the unsupported statement that the kings “ruled” the specified area and makes the eastern-Jordan geographic description modify “the land,” as in the Hebrew. All existing notes are retained; marker [b] is retained for the source-language explanation even though the literal wording is used in the text.
