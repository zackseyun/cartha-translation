lexical_decisions:
- source_word: וְאֵלֶּה
  choice: இவர்களே
  rationale: புதிய பட்டியலை அறிமுகப்படுத்துகிறது; எபிரெய இணைப்பை இயல்பான தமிழ் வாக்கிய அமைப்பில் வெளிப்படுத்துகிறது, மூலத்தில் இல்லாத காலச்சுட்டுச் சொல்லைச் சேர்க்கவில்லை.
- source_word: מַלְכֵי הָאָרֶץ
  choice: அரசர்கள்
  rationale: பின்வரும் நிலப்பரப்பு விளக்கத்தோடு இயல்பாக இணையும் வகையில் அரசர்களைக் குறிக்கிறது; அவர்கள் அந்தப் பகுதியில் ஆட்சி செய்தவர்கள் என்பது இறுதியில் தெளிவாக்கப்பட்டுள்ளது.
- source_word: אֲשֶׁר הִכּוּ
  choice: வீழ்த்தி
  rationale: இராணுவச் சூழலில் ‘தாக்கி முறியடித்தல்’ என்ற வலிமையைத் தருகிறது; ஒவ்வொரு அரசரும் தனிப்பட்ட முறையில் கொல்லப்பட்டார் என்று தேவையின்றி மிகைப்படுத்தாது.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: இஸ்ரயேல் மக்கள்
  rationale: சொல்லுக்குச் சொல் ‘இஸ்ரயேலின் மகன்கள்’ என்றாலும், நவீன தமிழில் முழு இனக்குழுவையும் இயல்பாகக் குறிக்கிறது; நேரடி வடிவம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: וַיִּרְשׁוּ אֶת אַרְצָם
  choice: அவர்களுடைய நாட்டைக் கைப்பற்றிய
  rationale: வெற்றிகொண்டு உடைமையாக்குதல் என்ற ירשׁ வினையின் வெற்றிப்போர் சார்ந்த பொருளைப் பாதுகாக்கிறது.
- source_word: בְּעֵבֶר הַיַּרְדֵּן
  choice: யோர்தானுக்கு அப்பால்
  rationale: ஆற்றின் மறுபக்கத்தைக் குறிக்கும் சுருக்கமான, பாரம்பரியத்துடனும் நவீனத் தமிழுடனும் ஒத்த இயல்பான வடிவம்; அடுத்த கிழக்குத் திசைக் குறிப்பு இடத்தைத் தெளிவாக்குகிறது.
- source_word: מִזְרְחָה הַשָּׁמֶשׁ
  choice: சூரியன் உதிக்கும் திசையில்
