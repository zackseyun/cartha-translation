- source_word: עַד הַר חֶרְמוֹן
  choice: எர்மோன் மலைவரையிலும்
  rationale: நிலப்பரப்பின் எல்லையைத் தெளிவாகக் குறிக்கிறது.
- source_word: וְכָל הָעֲרָבָה
  choice: அரபா பகுதி முழுவதிலும்
  rationale: עֲרָבָה என்பதை வெறும் பொதுவான ‘சமவெளி’ என்று தட்டையாக்காமல், குறிப்பிட்ட புவியியல் பெயராக வைத்திருக்கிறது.
- source_word: מִזְרָחָה
  choice: கிழக்கே உள்ள
  rationale: இறுதி நிலப்பரப்பு சுருக்கத்தை இயல்பான தமிழில் இடவியல் அடைமொழியாக வழங்குகிறது.
