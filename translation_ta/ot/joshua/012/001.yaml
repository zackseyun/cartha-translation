  yaml_path: translation/ot/joshua/012/001.yaml
  text: These are the kings of the land whom the sons of Israel struck down and whose land they took possession of beyond the Jordan[a], toward the sunrise, from the Wadi Arnon as far as Mount Hermon[d][c][b], and all the Arabah eastward.
translation:
  language: ta
  text: 'யோர்தானுக்கு அப்பால், சூரியன் உதிக்கும் திசையில், அர்னோன் நீரோடைப் பள்ளத்தாக்கிலிருந்து[c] எர்மோன் மலைவரை, கிழக்கேயுள்ள அரபா முழுவதும்[d] உள்ள நாட்டின் அரசர்கள் இவர்களே: இஸ்ரயேல் மக்கள்[a] வீழ்த்தி, அவர்களுடைய நாட்டைக் கைப்பற்றிக்கொண்டவர்கள்.


    [a] எபிரெய மொழியில், “இஸ்ரயேலின் மகன்கள்”; அதாவது, இஸ்ரயேல் மக்கள்.


    [b] எபிரெய மொழியில், “சூரியன் உதிக்கும் திசையில்”; அதாவது, கிழக்கே.


    [c] இங்கு “நீரோடைப் பள்ளத்தாக்கு” என்பது பருவகாலத்தில் நீர் பாயும் ஓடை அல்லது அதன் பள்ளத்தாக்கைக் குறிக்கலாம். இதை “அர்னோன் ஓடை” என்றும் மொழிபெயர்க்கலாம்.


    [d] “அரபா” என்பது பொதுவாக ஒரு சமவெளியைக் குறிக்கக்கூடும்; இங்கு அது யோர்தான் பிளவுப் பள்ளத்தாக்குப் பகுதியைக் குறிக்கும் புவியியல் பெயர்.'
  philosophy: optimal-equivalence
