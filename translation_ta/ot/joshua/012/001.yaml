- from: 'இஸ்ரயேல் மக்கள்[a] வீழ்த்தி, அவர்களுடைய நாட்டைக் கைப்பற்றிய அரசர்கள் இவர்களே: யோர்தானுக்கு அப்பால், சூரியன் உதிக்கும் திசையில்[b], அர்னோன் நீரோடைப் பள்ளத்தாக்கிலிருந்து[c] எர்மோன் மலைவரையிலும், கிழக்கே உள்ள அரபா பகுதி முழுவதிலும்[d] ஆட்சி செய்தவர்கள்.


