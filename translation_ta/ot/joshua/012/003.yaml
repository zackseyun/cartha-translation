base_translation:
  language: en
  yaml_path: translation/ot/joshua/012/003.yaml
  text: and the Arabah as far as the Sea of Kinnereth eastward[a], and as far as the Sea of the Arabah, the Salt Sea, eastward, by way of Beth-jeshimoth, and southward[b], below the slopes of Pisgah.
translation:
  language: ta
  text: அவன் அரபாப் பகுதியையும்[a], கிழக்கே கின்னரேத் கடல்வரையும், பெத்-யெஷிமோத் வழியாகக் கிழக்கே அரபாக் கடலாகிய உப்புக் கடல்வரையும்[b], தெற்கே[c] பிஸ்காவின் சரிவுகளுக்குக் கீழுள்ள பகுதியையும் ஆண்டான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அரபா’ என்பதற்கு ‘சமவெளி’ என்றும் பொருள் கொள்ளலாம்; இங்கு அது யோர்தான் பிளவுப் பள்ளத்தாக்குப் பகுதியைக் குறிக்கும் புவியியல் பெயராக இருக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘அரபாக் கடலாகிய உப்புக் கடல்’ என்பது பிற்காலத்தில் பொதுவாக ‘சவக்கடல்’ என்று அழைக்கப்பட்ட நீர்நிலையைக் குறிக்கிறது.
    reason: cultural_note
  - marker: c
    text: எபிரெயச் சொல்லை இன்னும் சொல்லர்த்தமாக ‘தெற்கிலிருந்து’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָעֲרָבָה
  choice: அரபா
  rationale: பொதுவான ‘சமவெளி’ என்று மொழிபெயர்க்காமல், யோர்தான் பிளவுப் பள்ளத்தாக்குப் பகுதியைக் குறிக்கும் புவியியல் பெயராக ஒலிபெயர்க்கப்பட்டது.
- source_word: יָם כִּנְרוֹת
  choice: கின்னரேத் கடல்
  rationale: எபிரெய இடப்பெயரைத் தக்கவைத்து, நீர்நிலைக்கான יָם என்பதைக் ‘கடல்’ என முறையாக மொழிபெயர்க்கிறது.
- source_word: מִזְרָחָה
  choice: கிழக்கே
  rationale: திசையைக் குறிக்கும் எபிரெய வடிவைச் சுருக்கமாகவும் இயல்பாகவும் பிரதிபலிக்கிறது.
- source_word: יָם הָעֲרָבָה יָם הַמֶּלַח
  choice: அரபா கடலாகிய உப்புக் கடல்
  rationale: இரண்டாவது பெயர் முதலாவது பெயரை விளக்கும் எபிரெய இணைப்பைத் தெளிவாகக் காட்டுகிறது; மூலத்தில் இல்லாத பிற்காலப் பெயரான ‘சவக்கடல்’ முதன்மை உரையில் தவிர்க்கப்பட்டது.
- source_word: דֶּרֶךְ בֵּית הַיְשִׁמוֹת
  choice: பெத்-யெஷிமோத்தை நோக்கிய பகுதி
  rationale: எல்லை அல்லது ஆட்சிப்பரப்பின் திசையை இங்கு குறிக்கும் דֶּרֶךְ என்பதன் பொருளைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וּמִתֵּימָן
  choice: தெற்கே
  rationale: நிலப்பரப்பு விவரிப்பில் தென்திசையைக் குறிக்கும் பொருளைத் தருகிறது; מִן முன்னொட்டின் காரணமாக உள்ள ‘தெற்கிலிருந்து’ என்ற மாற்று வாசிப்பு அடிக்குறிப்பில் பாதுகாக்கப்பட்டது.
- source_word: תַּחַת אַשְׁדּוֹת הַפִּסְגָּה
  choice: பிஸ்காவின் சரிவுகளுக்குக் கீழுள்ள பகுதி
  rationale: மலைச்சரிவுகளுக்குக் கீழே அமைந்த நிலப்பகுதியைக் குறிக்கும் புவியியல் மொழியைத் தெளிவாக எடுத்துரைக்கிறது.
