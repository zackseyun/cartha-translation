translation_notes:
  register: நவீனத் தரத் தமிழில், எல்லை மற்றும் நிலப்பரப்பு விவரிப்புக்கேற்ற சுருக்கமான, கண்ணியமான நடை பயன்படுத்தப்பட்டது. இந்த வசனம் முந்தைய வசனத்தின் வினையைத் தொடர்வதால், தமிழில் முழுமையான வாக்கியமாக அமைய ‘அவன் ஆண்டான்’ சேர்க்கப்பட்டது; பட்டியலின் ஒவ்வொரு நிலப்பகுதியும் ‘-ஐயும்’ வடிவில் இணைக்கப்பட்டது.
