  text: the king of Makkedah[a], one; the king of Bethel, one.
translation:
  language: ta
  text: மக்கேதாவின் அரசன்—ஒருவன்; பெத்தேலின் அரசன்—ஒருவன்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரெய மொழி சுருக்கமான பட்டியல் நடையைப் பேணுகிறது: “மக்கேதாவின் அரசன்—ஒருவன்; பெத்தேலின் அரசன்—ஒருவன்.” இங்கு “ஒருவன்” என்பது தோற்கடிக்கப்பட்ட ஒவ்வோர் அரசனையும் தனித்தனியாக எண்ணுகிறது.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מֶלֶךְ
  choice: அரசன்
  rationale: ஒவ்வொரு நகர-அரசின் ஆட்சியாளரையும் குறிக்கும் பெயர்ச்சொல்; தமிழில் உடைமை வேற்றுமையுடன் இயல்பாக அமைக்கப்பட்டுள்ளது.
- source_word: מַקֵּדָה
  choice: மக்கேதா
  rationale: இடப்பெயர் என்பதால் மொழிபெயர்க்காமல், எபிரெய ஒலிப்புக்கு அண்மையாக எழுத்துப்பெயர்க்கப்பட்டது.
- source_word: אֶחָד
  choice: ஒருவன்
  rationale: தோற்கடிக்கப்பட்ட அரசர்களின் எண்ணிக்கையைத் தனித்தனியாகக் கணக்கிடும் சொல். அரசனைக் குறிப்பதால், இயல்பான தமிழில் மனிதருக்குரிய ‘ஒருவன்’ பயன்படுத்தப்பட்டு, மூலத்தின் சுருக்கமான பட்டியல் நடை பாதுகாக்கப்பட்டது.
- source_word: בֵּית אֵל
  choice: பெத்தேல்
  rationale: ‘இறைவனின் வீடு’ என்ற சொற்பிறப்புப் பொருள் இருந்தாலும், இங்கு இது தெளிவாக ஓர் இடப்பெயர்; ஆகவே மொழிபெயர்க்காமல் எழுத்துப்பெயர்க்கப்பட்டது.
