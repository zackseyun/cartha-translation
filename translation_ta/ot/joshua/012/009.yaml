translation:
  language: ta
  text: எரிகோவின் அரசன்—ஒருவன்; பெத்தேலுக்குப் பக்கத்தில் இருந்த ஆயியின் அரசன்—ஒருவன்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מֶלֶךְ
  choice: அரசன்
  rationale: ஆட்சியாளரைக் குறிக்கும் எபிரெயச் சொல்லின் இயல்பான நவீனத் தமிழ் மொழிபெயர்ப்பு; பட்டியல் நடைக்கு ஏற்றவாறு ஒவ்வொரு இடப்பெயருடனும் உரிமை வேற்றுமையில் அமைக்கப்பட்டது.
- source_word: יְרִיחוֹ
  choice: எரிகோ
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் பரவலாக அறியப்படும் இடப்பெயர் வடிவம்.
- source_word: אֶחָד
  choice: ஒருவன்
  rationale: தோற்கடிக்கப்பட்ட அரசர்களைக் கணக்கிடும் இப்பட்டியலில் எண்ணிக்கை முடிவுரையாக வருகிறது; தமிழில் மனிதரைக் குறிக்கும் இயல்பான எண்ணிக்கை வடிவமான ‘ஒருவன்’ சுருக்கமான மூல நடையைப் பேணுகிறது.
- source_word: הָעַי
  choice: ஆயி
  rationale: இடப்பெயரின் வழக்கமான தமிழ் ஒலிபெயர்ப்பு; எபிரெய மொழியிலுள்ள சுட்டிடைச்சொல் தமிழில் தனியாக மொழிபெயர்க்கப்படவில்லை.
- source_word: אֲשֶׁר
  choice: இருந்த
  rationale: ஆயியை விவரிக்கும் தொடர்புத் தொடரை இயல்பான தமிழில் உருவாக்குகிறது.
- source_word: מִצַּד
  choice: பக்கத்தில்
  rationale: பெத்தேலுடன் ஒப்பிட்ட இடநெருக்கத்தைக் குறிக்கிறது; ‘அருகில்’ அல்லது ‘பக்கத்தே’ என்பதும் சாத்தியம், ஆனால் ‘பக்கத்தில்’ தெளிவும் இயல்பும் உடையது.
- source_word: בֵּית אֵל
  choice: பெத்தேல்
  rationale: இடப்பெயரின் வழக்கமான தமிழ் ஒலிபெயர்ப்பு.
