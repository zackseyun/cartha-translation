translation:
  language: ta
  text: தப்புவாவின் அரசன் ஒருவன்; ஏப்பேரின் அரசன் ஒருவன்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מֶלֶךְ
  choice: அரசன்
  rationale: ஒவ்வொரு நகரத்தை ஆண்ட அரசனையும் குறிக்கும் இணைப்புநிலைச் சொல். தமிழில் இடப்பெயருடன் உரிய வேற்றுமை உருபைச் சேர்த்து இயல்பாக வழங்கப்பட்டுள்ளது.
- source_word: תַּפּוּחַ
  choice: தப்புவா
  rationale: இது ஓர் இடப்பெயர்; பொருள் மொழிபெயர்ப்பு செய்யாமல் எபிரெய ஒலிப்புக்கு அண்மையாக ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: אֶחָד
  choice: ஒருவன்
  rationale: தோற்கடிக்கப்பட்ட அரசர்களைத் தனித்தனியாக எண்ணும் பட்டியல் சூத்திரம். அரசனைக் குறிப்பதால் தமிழில் ஆண்பால் மனித எண்ணுப்பெயரான ‘ஒருவன்’ இயல்பாக உள்ளது.
- source_word: חֵפֶר
  choice: ஏப்பேர்
  rationale: இது ஓர் இடப்பெயர்; எபிரெய மெய்யெழுத்தின் உராயொலியைத் தமிழில் துல்லியமாகக் குறிக்க இயலாததால், வாசிக்க இயல்பான அண்மித்த ஒலிபெயர்ப்பு பயன்படுத்தப்பட்டுள்ளது.
theological_decisions: []
translation_notes:
  register: எபிரெய மூலத்தின் சுருக்கமான, மீளுருவாக்கமுள்ள பட்டியல் நடையைப் பேணியபடியே, நவீனத் தரத் தமிழில் இயல்பாக அமைக்கப்பட்டுள்ளது. ‘ஒருவன்’ என்பதை விரிவாக்கி ‘ஓர் அரசன்’ என்று எழுதாமல், மூலத்தின் எண்ணிக்கைச் சூத்திரம் காக்கப்பட்டுள்ளது.
