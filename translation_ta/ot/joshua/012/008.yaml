base_translation:
  language: en
  yaml_path: translation/ot/joshua/012/008.yaml
  text: in the hill country[a], and in the lowland, and in the Arabah, and on the slopes, and in the wilderness, and in the Negev—the Hittites, the Amorites, and the Canaanites, the Perizzites, the Hivites[c][b], and the Jebusites.
translation:
  language: ta
  text: மலைநாட்டிலும், தாழ்நிலத்திலும்[a], அராபாவிலும்[b], மலைச்சரிவுகளிலும், வனாந்தரத்திலும், நெகேபிலும்[c]—ஏத்தியர், எமோரியர், கானானியர், பெரிசியர், ஏவியர், எபூசியர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஷெப்பேலாவிலும்”; இது மேற்குப் பகுதியிலுள்ள தாழ்நிலம் அல்லது மலையடிவாரப் பிரதேசத்தின் பெயர்.
    reason: lexical_alternative
  - marker: b
    text: “அராபா” என்பது பிளவுப் பள்ளத்தாக்கு அல்லது வறண்ட சமவெளிப் பிரதேசத்தின் பெயர்; அல்லது, “வறண்ட சமவெளியிலும்.”
    reason: lexical_alternative
  - marker: c
    text: அல்லது, “தென்பகுதியிலும்”; நெகேப் என்ற எபிரெயச் சொல் குறிப்பிட்ட தெற்குப் பிரதேசத்தையும் பொதுவாகத் “தெற்கு” என்பதையும் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּהָר
  choice: மலைநாட்டிலும்
  rationale: הַר இங்கு ஒரு தனி மலையை அல்ல, நிலப்பகுதியைச் சுட்டுவதால் இயல்பான புவியியல் சொல்லாக மொழிபெயர்க்கப்பட்டது.
- source_word: וּבַשְּׁפֵלָה
  choice: தாழ்நிலத்திலும்
  rationale: שְׁפֵלָה மேற்குப் புறத் தாழ்நிலம் அல்லது மலையடிவாரப் பகுதியைக் குறிக்கிறது; பொதுவாசகருக்குத் தெளிவாக ‘தாழ்நிலம்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: וּבָעֲרָבָה
  choice: அராபாவிலும்
  rationale: עֲרָבָה இங்கு அறியப்பட்ட புவியியல் பிரதேசப் பெயராகச் செயல்படுவதால் ஒலிபெயர்ப்பு தக்கவைக்கப்பட்டது.
- source_word: וּבָאֲשֵׁדוֹת
  choice: மலைச்சரிவுகளிலும்
  rationale: אֲשֵׁדוֹת இறங்கும் சரிவுகளை, குறிப்பாக மலைச்சரிவுகளைச் சுட்டுகிறது.
- source_word: וּבַמִּדְבָּר
  choice: வனாந்தரத்திலும்
  rationale: מִדְבָּר மணற்பாலை மட்டும் அல்லாமல் மக்கள் அரிதாக வாழும் வறண்ட மேய்ச்சல் வெளியையும் குறிக்கக்கூடும்; ‘வனாந்தரம்’ அந்த விரிவைத் தக்கவைக்கிறது.
- source_word: וּבַנֶּגֶב
  choice: நெகேபிலும்
  rationale: נֶגֶב ‘தெற்கு’ என்றும் குறிப்பிட்ட தென்பகுதியான நெகேப் என்றும் பொருள்படும்; இப்புவியியல் பட்டியலில் பிரதேசப் பெயர் பொருத்தமானது.
- source_word: הַחִתִּי
  choice: ஏத்தியர்
  rationale: எபிரெயத்தில் ஒருமை வடிவமாயினும், இனக்குழுவைக் கூட்டாகக் குறிக்கிறது; தமிழில் மரியாதை/மக்கள் பன்மை வடிவம் இயல்பானது.
- source_word: הָאֱמֹרִי
  choice: எமோரியர்
  rationale: கூட்டு இனப்பெயர் தமிழில் மக்கள் பன்மையாக வழங்கப்பட்டது.
- source_word: וְהַכְּנַעֲנִי
  choice: கானானியர்
  rationale: கூட்டு இனப்பெயர் தமிழில் மக்கள் பன்மையாக வழங்கப்பட்டது.
- source_word: הַפְּרִזִּי
  choice: பெரிசியர்
  rationale: கூட்டு இனப்பெயர் தமிழில் மக்கள் பன்மையாக வழங்கப்பட்டது.
- source_word: הַחִוִּי
  choice: ஏவியர்
  rationale: கூட்டு இனப்பெயர் தமிழில் மக்கள் பன்மையாக வழங்கப்பட்டது.
- source_word: וְהַיְבוּסִי
  choice: எபூசியர்
  rationale: கூட்டு இனப்பெயர் தமிழில் மக்கள் பன்மையாக வழங்கப்பட்டது.
theological_decisions:
- issue: வசனம் எபிரெயத்தில் முந்தைய வசனத்திலிருந்து தொடரும் துண்டுவாக்கியமாக உள்ளது
  choice: ‘வாழ்ந்த … ஆகியோரின் அரசர்கள்’ என்று முந்தைய பட்டியலுடன் தொடர்பை வெளிப்படுத்துதல்
  alternative: மூலத்தின் சொற்றொடர் வடிவத்தையே அப்படியே வைத்தல்
  rationale: மூலத்தில் நிலப்பகுதிகளும் இனங்களும் மட்டுமே இருந்தாலும், யோசுவா 12:7 தொடங்கிய ‘அரசர்கள்’ பட்டியல் இவ்வசனத்தில் தொடர்கிறது. தமிழில் தனி வசனமாக வாசிக்கத் தெளிவளிக்க இத்தொடர்பு வெளிப்படுத்தப்பட்டது; புதிய இறையியல் கருத்து சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீன செந்தமிழுக்கு நெருக்கமான, பொதுவாசகருக்குப் புரியும் கண்ணியமான நடை. புவியியல் பெயர்களில் அராபா, நெகேப் ஆகியவை பிரதேசப் பெயர்களாகத் தக்கவைக்கப்பட்டு மாற்றுப் பொருள்கள் அடிக்குறிப்பில் தரப்பட்டுள்ளன. இனப்பெயர்கள் தமிழ் வேதாகமப் பயன்பாட்டில் அறிமுகமான வடிவங்களில் வழங்கப்பட்டுள்ளன.
