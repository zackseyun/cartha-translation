lexical_decisions:
- source_word: מֶלֶךְ
  choice: அரசன்
  rationale: தோற்கடிக்கப்பட்ட நகர-அரசர்களின் பட்டியலில் ஒவ்வொரு ஆட்சியாளரையும் குறிக்கிறது; இயல்பான தமிழில் இடப்பெயருடன் உரிமை வேற்றுமையில் வழங்கப்பட்டது.
- source_word: קֶדֶשׁ
  choice: கேதேஸ்
  rationale: இது ஓர் இடப்பெயர்; பொருள் மொழிபெயர்க்கப்படாமல் தமிழில் ஒலிபெயர்க்கப்பட்டது.
- source_word: אֶחָד
  choice: ஒருவன்
  rationale: யோசுவா 12-இன் தொடர்ச்சியான எண்ணிக்கை நடையைப் பேணுகிறது; அரசனைக் குறிக்கும் மனித எண்ணுப்பெயராக இயல்பான தமிழில் வழங்கப்பட்டது.
- source_word: יָקְנֳעָם
  choice: யோக்னெயாம்
  rationale: இடப்பெயர் என்பதால் எபிரெய உச்சரிப்பை அணுகிய தமிழ் ஒலிபெயர்ப்பு பயன்படுத்தப்பட்டது.
- source_word: לַ/כַּרְמֶל
  choice: கர்மேலுக்கு அருகிலுள்ள
  rationale: முன்னொட்டு ל இடம் அல்லது பிராந்தியத் தொடர்பைக் குறிக்கக்கூடும். 'அருகிலுள்ள' என்பது கர்மேல் மலையா பிராந்தியமா என்பதைத் தேவையின்றி முடிவுசெய்யாமல் இயல்பாக இடத்தொடர்பைத் தெரிவிக்கிறது.
