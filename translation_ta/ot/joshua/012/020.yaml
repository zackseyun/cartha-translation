translation:
  language: ta
  text: சிம்ரோன்-மெரோனின்[a] அரசன்—ஒருவன்; அக்சாபின் அரசன்—ஒருவன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, இவை ‘சிம்ரோன்’, ‘மெரோன்’ என்ற இரு தனித்தனி இடப்பெயர்களாக இருக்கலாம். ஆனால் இவ்வசனத்தில் அரசர்களின் எண்ணிக்கை இரண்டாக இருப்பதற்கு ஏற்றபடி, எபிரேயச் சொற்றொடர் பொதுவாக ‘சிம்ரோன்-மெரோன்’ என்ற கூட்டிடப்பெயராகப் புரிந்துகொள்ளப்படுகிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: מֶלֶךְ
  choice: அரசன்
  rationale: கானானிய நகர-அரசை ஆண்ட ஒவ்வொரு ஆட்சியாளரையும் குறிக்கும் பட்டியல் வழக்காக இருப்பதால், இயல்பான நவீனத் தமிழில் ‘அரசன்’ என வழங்கப்பட்டது.
- source_word: שִׁמְרוֹן מְראוֹן
  choice: சிம்ரோன்-மெரோன்
  rationale: மசோரா உயிர்க்குறிகளும் வாக்கியத்தின் இரு அரசர் கணக்கும் இதை ஒரு கூட்டிடப்பெயராகப் புரிந்துகொள்வதை ஆதரிக்கின்றன; பெயர் மொழிபெயர்க்கப்படாமல் தமிழில் ஒலிபெயர்க்கப்பட்டது.
- source_word: אֶחָד
  choice: ஒருவன்
  rationale: இங்கு இச்சொல் ஒவ்வொரு அரசனின் எண்ணிக்கையையும் சுருக்கமாகக் குறிக்கிறது. மனிதரைக் கணக்கிடும் இயல்பான தமிழ் வடிவமான ‘ஒருவன்’ மூலத்தின் சுருக்கமான பட்டியல் ஓசையைப் பேணுகிறது.
- source_word: אַכְשָׁף
  choice: அக்சாப்
  rationale: எபிரேய இடப்பெயர் அதன் மெய்யொலி அமைப்பை அணுகும் வகையில் தமிழில் ஒலிபெயர்க்கப்பட்டது.
