  source_fidelity: 'மூல எபிரெயப் பட்டியல் அமைப்பு துல்லியமாகக் காக்கப்பட்டுள்ளது: தோருடன் தொடர்புடைய நாபாத்-தோர், கில்காலுடன் தொடர்புடைய கோயீம், மேலும் ஒவ்வொரு பதிவின் முடிவிலுமுள்ள எண்ணிக்கைச் சுட்டி אֶחָד ஆகியவை அனைத்தும் இடம்பெற்றுள்ளன. “பகுதியில் இருந்த” என்பது לְנָפַת דּוֹר-இன் புவியியல் தொடர்பை இயல்பாக வெளிப்படுத்துகிறது; அது ஆதாரத்திற்கும் ஏற்ற பாதுகாப்பான விளக்கமாகும்.'
