  yaml_path: translation/ot/joshua/012/023.yaml
  text: the king of Dor in Naphath-dor[a], one; the king of Goiim in Gilgal, one[b];
translation:
  language: ta
  text: நாபாத்-தோர் பகுதியில் இருந்த தோரின் அரசன்—ஒருவன்[a]; கில்காலில் இருந்த கோயீமின் அரசன்—ஒருவன்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “நாபாத்-தோர்” என்பதை “தோரின் மேட்டுப்பகுதி” அல்லது “தோர் வட்டாரம்” என்றும் புரிந்துகொள்ளலாம்.
    reason: lexical_alternative
  - marker: b
    text: “கோயீம்” என்பதற்கான எபிரெயச் சொல் பொதுவாக “நாடுகள்” அல்லது “மக்கள் இனங்கள்” என்று பொருள்படும்; ஆனால் இங்கு அது ஓர் இடப்பெயராகவோ பிரதேசப் பெயராகவோ இருக்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: מֶלֶךְ
  choice: அரசன்
  rationale: தோற்கடிக்கப்பட்ட அரசர்களின் பட்டியலில் வரும் எபிரெயக் கட்டமைப்பை இயல்பான தமிழில் இடப்பெயருடன் தொடர்புபடுத்தி வழங்குகிறது.
- source_word: דּוֹר
  choice: தோர்
  rationale: இது ஓர் இடப்பெயர் என்பதால் பொருளாக்காமல் தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: לְנָפַת דּוֹר
  choice: நாபாத்-தோர் பகுதியில் இருந்த
  rationale: נָפַת என்பது இங்கு தோருடன் தொடர்புடைய நிலப்பகுதி அல்லது வட்டாரத்தைக் குறிக்கலாம். இடப்பெயர்த் தன்மையையும் பொதுப்பொருளையும் அளவுக்கு மீறித் தீர்மானிக்காமல் இந்த வடிவம் காக்கிறது.
- source_word: אֶחָד
  choice: ஒருவன்
  rationale: ஒவ்வொரு அரசனையும் எண்ணிக் குறிப்பிடும் பட்டியல் நடையைத் தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: גּוֹיִם
  choice: கோயீம்
  rationale: இந்தச் சூழலில் இது இடப்பெயர் அல்லது பிரதேசப் பெயராக இருக்கக்கூடும்; ‘நாடுகள்’ என்று பொருளாக்கி ஐயத்தைத் தீர்த்துவிடாமல் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: לְגִלְגָּל
  choice: கில்காலில் இருந்த
  rationale: לְ என்ற முன்னொட்டு இங்கு ஓர் இடத்துடனான தொடர்பைக் குறிக்கிறது; இயல்பான தமிழில் அந்தப் புவியியல் தொடர்பை வெளிப்படுத்துகிறது.
