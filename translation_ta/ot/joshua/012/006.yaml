  register: நவீனத் தரத் தமிழில் கண்ணியமான வரலாற்று நடையைப் பயன்படுத்துகிறது. ‘ஊழியர்’, ‘வீழ்த்தினர்’, ‘உரிமைச் சொத்து’ ஆகியவை மூலத்தின் பொருளைத் தெளிவாக வைத்தபடி மிகப் பழமையான அல்லது சமயப் பிரிவுக்கே உரிய சொல்வழக்கைத் தவிர்க்கின்றன.
