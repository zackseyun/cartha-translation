base_translation:
  language: en
  yaml_path: translation/ot/joshua/012/006.yaml
  text: Moses the servant of Yahweh[a], and the sons of Israel, struck them down, and Moses the servant of Yahweh gave it as an inheritance to the Reubenites, the Gadites, and the half-tribe of Manasseh.
translation:
  language: ta
  text: யாவேயின் ஊழியரான மோசேயும் இஸ்ரவேலின் மகன்களும்[a] அவர்களை வீழ்த்தினர். யாவேயின் ஊழியரான மோசே அதை ரூபனியர்களுக்கும் காதியர்களுக்கும் மனாசே கோத்திரத்தின் பாதியினருக்கும் சுதந்தரமாக அளித்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இதை இயல்பான தமிழில், ‘இஸ்ரவேலர்’ என்றும் சொல்லலாம். எபிரெய மூலத்தில், ‘இஸ்ரவேலின் மகன்கள்’ என்று உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֶבֶד
  choice: ஊழியர்
  rationale: மோசேக்கு வழங்கப்படும் இந்தச் சிறப்புப் பட்டம், அடிமைத்தனத்தை வலியுறுத்தாமல் யாவேக்கு அர்ப்பணிப்புடன் பணிபுரியும் நியமிக்கப்பட்டவரைக் குறிக்கிறது. ‘ஊழியர்’ என்பது இச்சூழலில் இயல்பான, கண்ணியமான தமிழ் வழக்கு.
- source_word: יְהוָה
  choice: யாவே
  rationale: இது ஒரு பட்டமல்ல, எபிரெயத் தெய்வீகப் பெயரின் தமிழ் ஒலிபெயர்ப்பு. மூலத்தில் உள்ள தனிப்பெயரைப் பாதுகாக்கிறது.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் மகன்கள்
  rationale: எபிரெயச் சொற்றொடரின் வடிவத்தையும் அதன் ஆண்பால் கூட்டுப்பெயர் அமைப்பையும் வெளிப்படையாகப் பாதுகாக்கிறது; இயல்பான மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: הִכּוּם
  choice: அவர்களை வீழ்த்தினர்
  rationale: נכה என்ற வினை போர்ச் சூழலில் தாக்கி முறியடித்தல் அல்லது கொல்லுதலைக் குறிக்கலாம். ‘வீழ்த்தினர்’ அதன் வலிமையைப் பாதுகாக்கிறது; ஆனால் இங்கு தேவையின்றி ‘கொன்றனர்’ என்று பொருளைக் குறுக்கவில்லை.
- source_word: וַיִּתְּנָהּ
  choice: அதைக் கொடுத்தார்
  rationale: பெண்பால் ஒருமை பின்னொட்டு சூழலில் புரிந்துகொள்ளப்படும் நிலப்பகுதியைக் குறிக்கிறது. தமிழில் ‘அதை’ என்பது இயல்பான சுட்டுப்பெயர்.
- source_word: יְרֻשָּׁה
  choice: உரிமைச் சொத்தாக
  rationale: வழிவழியாக உடைமையாக்கப்படும் நிலத்தையும் நிலையான உரிமையையும் குறிக்கும் יְרֻשָּׁה என்பதன் பொருளைத் தெளிவான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: לָרֻאוּבֵנִי
  choice: ரூபனியர்களுக்கு
  rationale: ஒருமை இனப்பெயர் இங்கு ரூபன் கோத்திரத்தாரை ஒட்டுமொத்தமாகக் குறிக்கிறது.
- source_word: לַגָּדִי
  choice: காதியர்களுக்கு
  rationale: ஒருமை இனப்பெயர் இங்கு காத் கோத்திரத்தாரை ஒட்டுமொத்தமாகக் குறிக்கிறது.
- source_word: חֲצִי שֵׁבֶט הַמְנַשֶּׁה
  choice: மனாசே கோத்திரத்தின் பாதிப் பேருக்கு
  rationale: யோர்தானுக்குக் கிழக்கே நிலம் பெற்ற மனாசே கோத்திரத்தின் ஒரு பாதியினரை இயல்பான தமிழில் குறிக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூல உரை தெய்வீகத் தனிப்பெயரை நேரடியாகப் பயன்படுத்துவதால், அதை ஒரு பொதுப் பட்டமாக மாற்றாமல் தமிழ் ஒலிபெயர்ப்பில் தரப்பட்டுள்ளது.
- issue: בְנֵי יִשְׂרָאֵל என்ற பாலினம் குறிக்கப்பட்ட கூட்டுச் சொற்றொடர்
  choice: இஸ்ரவேலின் மகன்கள்
  alternative: இஸ்ரவேலர்; இஸ்ரவேல் மக்கள்
  rationale: மூலத்தின் வெளிப்படையான வடிவத்தை முதன்மை உரையில் பாதுகாத்து, அது மக்களைக் கூட்டாகக் குறிக்கும் இயல்பான வாசிப்பை அடிக்குறிப்பில் தெரிவிக்கிறது.
