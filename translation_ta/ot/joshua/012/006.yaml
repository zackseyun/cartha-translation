  source_fidelity: மூலத்தின் வாக்கிய அமைப்பு, மோசேயின் பட்டம், யாவே என்ற பெயர், ‘இஸ்ரவேலின் மகன்கள்,’ போர்ச் செயல், மற்றும் நிலத்தை அளித்தல் ஆகியவை வரைவு உரையில் நன்றாகப் பிரதிபலிக்கின்றன. ஆனால் חֲצִי שֵׁבֶט הַמְנַשֶּׁה என்பது மனாசே கோத்திரத்தில் ‘பாதிப் பேர்’ என்பதல்ல; கோத்திரத்தின் ஒரு பாதி/பாதியினர் என்பதே பொருள். יְרֻשָּׁה-வின் மரபுரிமைச் சாயலை ‘சுதந்தரமாக’ தெளிவாகத் தரலாம்.
