lexical_decisions:
- source_word: מֶלֶךְ
  choice: அரசன்
  rationale: அடுத்து வரும் இடப்பெயருடன் இணைந்த எபிரெயக் கட்டமைப்பு; தமிழில் இயல்பாக இடப்பெயருக்கு உரிய அரசனைச் சுட்டுகிறது.
- source_word: תִּרְצָה
  choice: திர்சா
  rationale: இது ஓர் இடப்பெயர்; பொருள் மொழிபெயர்ப்பு செய்யாமல் தமிழில் ஒலிபெயர்க்கப்பட்டது.
- source_word: אֶחָד
  choice: ஒருவன்
  rationale: பட்டியலில் அந்த நகரத்துக்குரிய அரசன் ஒருவன் என்பதைக் குறிக்கும் எண்ணிக்கை; மனிதரைச் சுட்டும் இயல்பான தமிழ் வடிவம் பயன்படுத்தப்பட்டது.
- source_word: כָּל מְלָכִים
  choice: அரசர்கள் அனைவரும்
  rationale: முன்பு பட்டியலிடப்பட்ட அரசர்களின் மொத்தத் தொகுப்பைச் சுட்டும் சுருக்கவுரை; כָּל என்பதன் முழுமையைக் காக்கிறது.
- source_word: שְׁלֹשִׁים וְאֶחָד
  choice: முப்பத்தொருவர்
  rationale: எபிரெய எண்ணான ‘முப்பதும் ஒன்றும்’ என்பதற்கான இயல்பான தமிழ் வடிவம்; மனிதர்களை எண்ணுவதற்குரிய மரியாதைப் பன்மை விகுதி பயன்படுத்தப்பட்டது.
