translation_notes:
  register: சுருக்கமான எபிரெய எண்ணிக்கைப் பட்டியலின் இணை அமைப்பும் ஓசையும் காக்கப்பட்டுள்ளன. நவீனத் தரத் தமிழில் இயல்பாக வாசிக்க, இடப்பெயர்கள் உடைமை வேற்றுமையில் அமைக்கப்பட்டு, אֶחָד மனிதரை எண்ணும் ‘ஒருவன்’ என மொழிபெயர்க்கப்பட்டுள்ளது.
