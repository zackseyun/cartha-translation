translation:
  language: ta
  text: லிப்னாவின் அரசன் ஒருவன்; அதுல்லாமின் அரசன் ஒருவன்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מֶלֶךְ
  choice: அரசன்
  rationale: ஒவ்வொரு நகர-அரசின் ஆட்சியாளரையும் குறிக்கும் பெயர்ச்சொல்; தமிழில் உடைமை வேற்றுமையுடன் இயல்பாக அமைக்கப்பட்டது.
- source_word: לִבְנָה
  choice: லிப்னா
  rationale: இடப்பெயர் என்பதால் மொழிபெயர்க்காமல், எபிரெய ஒலிப்புக்கு நெருக்கமாக எழுத்துப்பெயர்க்கப்பட்டது.
- source_word: אֶחָד
  choice: ஒருவன்
  rationale: வெற்றி கொள்ளப்பட்ட அரசர்களை எண்ணும் பட்டியல் சூத்திரம்; மனிதரைக் குறிக்கும் இயல்பான தமிழ் எண்ணுப்பெயராக வழங்கப்பட்டது.
- source_word: עֲדֻלָּם
  choice: அதுல்லாம்
  rationale: இடப்பெயர் என்பதால் மொழிபெயர்க்காமல், எபிரெய ஒலிப்புக்கு நெருக்கமாக எழுத்துப்பெயர்க்கப்பட்டது.
