  source_fidelity: மூல எபிரெயத்தின் இணைப்பட்டியல் அமைப்பும், ஒவ்வொரு நகரத்தின் அரசனுக்குப் பின் வரும் எண்ணிக்கைச் சூத்திரமான אֶחָד-உம் துல்லியமாகக் காக்கப்பட்டுள்ளன. “அரசன் ஒருவன்” என்பது இச்சூழலில் ‘ஒரு அரசன்’ என்ற எண்ணிக்கையைக் குறிக்கிறது; தேவையற்ற விளக்கத்தைச் சேர்ப்பதில்லை.
  naturalness: “லிப்னாவின் அரசன் ஒருவன்; அதுல்லாமின் அரசன் ஒருவன்” என்பது சுருக்கமான பட்டியல் நடையில் நவீனத் தரத் தமிழில் தெளிவாகவும் இயல்பாகவும் உள்ளது. மீளுரைப்பும் மூலத்தின் கணக்குப் பட்டியல் ஓசையைப் பாதுகாக்கிறது.
  terminology: “அரசன்” என்பது מֶלֶךְ என்பதற்கான பொருத்தமான நடுநிலைச் சொல். “லிப்னா,” “அதுல்லாம்” ஆகிய இடப்பெயர் எழுத்துப்பெயர்ப்புகள் ஏற்றவை. “ஒருவன்” இங்கே மனித ஆட்சியாளரின் எண்ணிக்கையைத் தகுந்தவாறு வெளிப்படுத்துகிறது.
