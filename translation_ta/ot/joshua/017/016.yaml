  text: וַ/יֹּֽאמְרוּ֙ בְּנֵ֣י יוֹסֵ֔ף לֹֽא יִמָּ֥צֵא לָ֖/נוּ הָ/הָ֑ר וְ/רֶ֣כֶב בַּרְזֶ֗ל בְּ/כָל הַֽ/כְּנַעֲנִי֙ הַ/יֹּשֵׁ֣ב בְּ/אֶֽרֶץ הָ/עֵ֔מֶק לַֽ/אֲשֶׁ֤ר בְּ/בֵית שְׁאָן֙ וּ/בְנוֹתֶ֔י/הָ וְ/לַֽ/אֲשֶׁ֖ר בְּ/עֵ֥מֶק יִזְרְעֶֽאל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/017/016.yaml
  text: And the sons of Joseph said[a], “The hill country is not enough for us, and all the Canaanites who live in the valley land have iron chariots[c][b], both those in Beth-shean and its daughter towns and those in the Valley of Jezreel.”
translation:
  language: ta
  text: யோசேப்பின் சந்ததியினர், “மலைநாடு எங்களுக்குப் போதாது[a]. பள்ளத்தாக்குப் பகுதியில் வசிக்கும் கானானியர் அனைவருக்கும் இரும்பு ரதங்கள்[b] உள்ளன; பெத்-செயானிலும் அதனைச் சார்ந்த ஊர்களிலும் வசிப்பவர்களுக்கும், யெஸ்ரயேல் பள்ளத்தாக்கில் வசிப்பவர்களுக்கும் அவை உள்ளன” என்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொற்பட, “மலைநாடு எங்களுக்குக் கிடைப்பதில்லை” அல்லது “எங்களுக்குக் காணப்படுவதில்லை.” இச்சூழலில் அது அவர்களுக்குப் போதுமானதாக இல்லை என்பதே பொருள்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “இரும்பினாலான ரதங்கள்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי יוֹסֵף
  choice: யோசேப்பின் சந்ததியினர்
  rationale: எபிரெயச் சொற்றொடர் சொற்பட ‘யோசேப்பின் மகன்கள்’ என்றாலும், இங்கு யோசேப்பிலிருந்து வந்த கோத்திர மக்களைச் சுட்டுகிறது; ‘சந்ததியினர்’ சூழலுக்கேற்ற இயல்பான தமிழ்.
- source_word: הָהָר
  choice: மலைநாடு
  rationale: நிலப்பங்கீட்டுச் சூழலில் இது ஒரு தனி மலையை அல்ல, மேட்டு அல்லது மலைப்பாங்கான நிலப்பகுதியைக் குறிக்கிறது.
- source_word: לֹא יִמָּצֵא לָנוּ
  choice: எங்களுக்குப் போதாது
  rationale: சொற்பட ‘எங்களுக்குக் கிடைக்காது/காணப்படாது’ எனினும், சூழலில் தங்களுக்கு ஒதுக்கப்பட்ட மலைநாடு போதுமானதல்ல என்பதே இயல்பான பொருள்; அடிக்குறிப்பில் சொற்பொருள் தெரிவிக்கப்படுகிறது.
- source_word: רֶכֶב בַּרְזֶל
  choice: இரும்பு ரதங்கள்
  rationale: இராணுவப் பயன்பாட்டிலிருந்த இரும்புப் பொருத்துகள் கொண்ட ரதங்களைக் குறிக்கும் வழக்குச் சொற்றொடரைச் சுருக்கமாகவும் மூலத்தின் வடிவுக்கு நெருக்கமாகவும் தருகிறது.
- source_word: הַכְּנַעֲנִי הַיֹּשֵׁב
  choice: வாழும் கானானியர்கள்
  rationale: மூலத்தில் ஒருமை வடிவம் கூட்டுப் பொருளில் வருகிறது; தமிழில் பன்மையாக வழங்குவது தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: אֶרֶץ הָעֵמֶק
  choice: பள்ளத்தாக்குப் பகுதி
  rationale: மலைநாட்டுக்கு எதிராகக் குறிப்பிடப்படும் தாழ்வான நிலப்பகுதியைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: בְּכָל
  choice: எல்லாரிடமும்
  rationale: அப்பகுதியில் வாழும் கானானியர் அனைவரையும் இந்த நிலை வகைப்படுத்துகிறது என்ற பகிர்வுப் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: בְּבֵית שְׁאָן
  choice: பெத்-செயான்
  rationale: எபிரெயப் பெயரின் ஒலிப்பை நவீன தமிழில் அடையாளம் காணத்தக்க வகையில் எழுத்துப்பெயர்க்கிறது.
- source_word: וּבְנוֹתֶיהָ
  choice: அதைச் சார்ந்த ஊர்கள்
  rationale: சொற்பட ‘அதன் மகள்கள்’; ஒரு முதன்மை நகரத்தைச் சார்ந்த சிறிய குடியிருப்புகள் அல்லது ஊர்களைக் குறிக்கும் எபிரெய மரபுத்தொடரின் பொருளைத் தெளிவுபடுத்துகிறது.
- source_word: עֵמֶק יִזְרְעֶאל
  choice: யெஸ்ரயேல் பள்ளத்தாக்கு
  rationale: புவியியல் பெயரை மூலக் கட்டமைப்புக்கும் தமிழ் வழக்குக்கும் ஏற்றவாறு தருகிறது.
