translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘மலைநாடு’–‘பள்ளத்தாக்குப் பகுதி’ என்ற புவியியல் எதிர்மறை பாதுகாக்கப்பட்டுள்ளது. மூலத்தின் இணை அமைப்பைத் தெளிவாக்க இறுதியில் ‘அவை இருக்கின்றன’ மீண்டும் சேர்க்கப்பட்டுள்ளது; எந்த சமயப்பிரிவு சார்ந்த விளக்கமும் புகுத்தப்படவில்லை.
