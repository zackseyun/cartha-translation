  text: Ten portions fell to Manasseh[a], besides the land of Gilead and Bashan, which is beyond the Jordan.
translation:
  language: ta
  text: யோர்தானுக்கு அப்பாலிருந்த கீலேயாத், பாசான் நிலங்களுக்கு மேலாக, மனாசேக்குப் பத்துப் பங்குகள் விழுந்தன.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மனாசேக்குப் பத்து நிலப்பகுதிகள் ஒதுக்கப்பட்டன”; அல்லது, “சீட்டினால் மனாசேக்குப் பத்துப் பங்குகள் கிடைத்தன.” நிலப்பங்கீட்டுச் சூழலில் எபிரேய மொழி “விழுந்தன” என்ற மரபுத்தொடரைப் பயன்படுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְּלוּ
  choice: விழுந்தன
  rationale: நிலத்தைச் சீட்டுப்போட்டுப் பங்கிடும் சூழலில் נפל என்பதன் ‘விழுதல்’ என்ற எபிரேய மரபுத்தொடரைத் தக்கவைக்கிறது; தமிழிலும் ‘பங்குகள் விழுந்தன’ என்பது சீட்டின் மூலம் கிடைத்ததைக் குறிப்பிட இயலும்.
- source_word: חַבְלֵי
  choice: பங்குகள்
  rationale: அளந்து ஒதுக்கப்பட்ட நிலப்பகுதிகளை இச்சூழலில் இயல்பாகவும் மிகையாகக் குறிப்பாக்காமலும் தெரிவிக்கிறது.
- source_word: מְנַשֶּׁה
  choice: மனாசே
  rationale: பெயரின் வழக்கமான தமிழ் ஒலிபெயர்ப்பு.
- source_word: עֲשָׂרָה
  choice: பத்து
  rationale: பங்குகளின் எண்ணிக்கையைக் குறிக்கும் நேரடியான எண்ணுப்பெயர்.
- source_word: לְבַד מֵאֶרֶץ
  choice: நிலங்களைத் தவிர
  rationale: யோர்தானுக்கு அப்பாலிருந்த பிரதேசங்கள் இப்பத்துப் பங்குகளின் கணக்கில் சேராதவை என்பதை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: הַגִּלְעָד וְהַבָּשָׁן
  choice: கீலேயாத், பாசான்
  rationale: இடப்பெயர்களின் வழக்கமான தமிழ் ஒலிபெயர்ப்புகள்.
- source_word: אֲשֶׁר מֵעֵבֶר לַיַּרְדֵּן
  choice: யோர்தானுக்கு அப்பால் இருந்த
  rationale: இரு பிரதேசங்களின் இருப்பிடத்தைச் சுட்டும் தொடர்புத் தொடரை இயல்பான தமிழில் முன்பெயரெச்சத் தொடராக வழங்குகிறது.
