  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: לִ/מְנַשֶּׁ֕ה הָיְתָ֖ה אֶ֣רֶץ תַּפּ֑וּחַ וְ/תַפּ֛וּחַ אֶל גְּב֥וּל מְנַשֶּׁ֖ה לִ/בְנֵ֥י אֶפְרָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/017/008.yaml
  text: The land of Tappuah belonged to Manasseh[a], but Tappuah on the border of Manasseh belonged to the sons of Ephraim.
translation:
  language: ta
  text: தப்புவாவின் நிலப்பகுதி மனாசேக்குச் சொந்தமாயிருந்தது[a]; ஆனால் மனாசேயின் எல்லையிலிருந்த தப்புவா எப்பிராயீமின் மகன்களுக்குச் சொந்தமாயிருந்தது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது, இன்னும் சொல்லுக்குச் சொல்லான வடிவில்: “மனாசேக்கு தப்புவாவின் நிலப்பகுதி இருந்தது; ஆனால் மனாசேயின் எல்லையிலிருந்த தப்புவா எப்பிராயீமின் மகன்களுக்குரியதாக இருந்தது.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: לִ/מְנַשֶּׁה הָיְתָה
  choice: மனாசேக்குச் சொந்தமாயிருந்தது
  rationale: לְ முன்னொட்டும் היה வினையும் சேர்ந்த இந்தப் பகுதி, நிலப் பங்கீட்டுச் சூழலில் உரிமை அல்லது ஒதுக்கீட்டைக் குறிக்கிறது. இயல்பான நவீன தமிழில் இதைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: אֶרֶץ
  choice: நிலப்பகுதி
  rationale: இங்கு முழு நாடு அல்ல, கோத்திரத்துக்கு ஒதுக்கப்பட்ட பிரதேச நிலம் குறிக்கப்படுகிறது; ‘நிலப்பகுதி’ அந்தச் சூழலைத் தெளிவாகக் காட்டுகிறது.
- source_word: תַּפּוּחַ
  choice: தப்புவா
  rationale: இது ஓர் இடப்பெயர் என்பதால் பொருள் மொழிபெயர்ப்பிற்கு மாறாகத் தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: וְ/תַפּוּחַ
  choice: ஆனால் ... தப்புவா
  rationale: וְ பொதுவாக ‘மற்றும்’ என்றாலும், இங்கு மனாசேக்குரிய நிலப்பகுதிக்கும் எப்பிராயீமின் மக்களுக்குரிய நகரத்துக்கும் இடையிலான முரண்பாட்டைக் காட்டுவதால் ‘ஆனால்’ இயல்பானது.
- source_word: אֶל גְּבוּל מְנַשֶּׁה
  choice: மனாசேயின் எல்லையிலிருந்த
  rationale: எல்லையுடன் தொடர்புடைய இடத்தைக் குறிக்கும் locative பொருளைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது; ‘எல்லையை நோக்கி’ என்ற சாத்தியமான சொற்சார்ந்த வடிவத்தைச் சூழல் இங்கு ஆதரிக்கவில்லை.
- source_word: לִ/בְנֵי אֶפְרָיִם
  choice: எப்பிராயீமின் மக்களுக்குச் சொந்தமாயிருந்தது
  rationale: לְ இங்கு உரிமை அல்லது ஒதுக்கீட்டைக் குறிக்கிறது. ‘மக்கள்’ என்பது בְּנֵי என்ற உறவுமுறைச் சொல்லைத் தக்கவைத்தபடி, கோத்திர அடையாளத்தையும் இயல்பான தமிழில் தெரிவிக்கிறது.
