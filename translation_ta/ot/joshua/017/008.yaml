translation_notes:
  register: நவீனத் தரமான, கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் தமிழ் பயன்படுத்தப்பட்டுள்ளது. நிலப்பகுதியையும் அதே பெயருள்ள நகரத்தையும் வேறுபடுத்த மூலத்தில் வெளிப்படையாக இல்லாத ‘நகரம்’ என்பதை முதன்மை உரையில் சேர்க்காமல், மூலத்தின் சுருக்கத்தையும் உண்மையான பொருள் நெருக்கத்தையும் காத்துள்ளது.
