  register: நவீன நிலையான தமிழ்; பொதுவாசகருக்குப் புரியும் கண்ணியமான நடை. ‘மலைநாடு’, ‘இரும்பு ரதங்கள்’ போன்ற பரிச்சயமான வேதாகமச் சொற்கள் தக்கவைக்கப்பட்டுள்ளன. வாக்கிய அமைப்பு எபிரெயக் கருத்தோட்டத்தைப் பேணினாலும், தமிழில் இயல்பாக வாசிக்கும்படி பிரிக்கப்பட்டுள்ளது.
