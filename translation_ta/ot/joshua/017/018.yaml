  rationale: Hiphil வடிவத்தின் உடைமை இழக்கச் செய்தல் மற்றும் வெளியேற்றுதல் ஆகிய இரு நுணுக்கங்களையும் சாதாரண வாசகருக்குத் தெளிவாகச் சொல்கிறது.
- source_word: הַכְּנַעֲנִי
  choice: கானானியர்கள்
