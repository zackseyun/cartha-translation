  rationale: நிலப்பங்கீட்டுச் சூழலில் இது ஒரு தனி மலையைவிட மேட்டு அல்லது மலைப்பாங்கான பகுதியைக் குறிக்கிறது.
- source_word: יִהְיֶה לָּךְ
  choice: உங்களுடையதாக இருக்கும்
  rationale: היה + ל என்ற எபிரெய உருபுத்தொடரின் உடைமை அல்லது ஒதுக்கீட்டுப் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
