  rationale: இது கோட்பாட்டுச் சர்ச்சை அல்ல; எபிரெய ஒருமை இனக்குழுவைத் தொகுப்பாகக் குறிக்கிறது. நவீன தமிழில் பன்மைதான் பொருளைத் தெளிவாக வெளிப்படுத்துகிறது.
- issue: மீண்டும் மீண்டும் வரும் כִּי என்பதன் உரையாடல் செயல்பாடு
  choice: முதல் பயன்பாட்டை முந்தைய சூழலோடு மாறுபடும் ‘ஆனால்’ என்றும், காடு குறித்ததை காரணம் காட்டும் ‘இருப்பதால்’ என்றும், கடைசி இரண்டை விட்டுக்கொடுக்கும் ‘இருந்தாலும்’ என்றும் வழங்குதல்
  alternative: ஒவ்வொரு כִּי-யையும் ‘ஏனெனில்’ என்று ஒரே மாதிரியாக மொழிபெயர்த்தல்
  rationale: எபிரெய இணைப்புச்சொல் சூழலுக்கு ஏற்ப மாறுபாடு, காரணம், வலியுறுத்தல் அல்லது விட்டுக்கொடுத்தல் ஆகிய செயல்களை ஏற்கலாம்; ஒரே தமிழ்ச்சொல்லை இயந்திரமாக மீளச் சொல்வது கருத்தோட்டத்தை மறைக்கும்.
