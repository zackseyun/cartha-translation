- source_word: רֶכֶב בַּרְזֶל
  choice: இரும்பு ரதங்கள்
  rationale: இரும்பால் வலுப்படுத்தப்பட்ட போர்ரதங்களைக் குறிக்கும் சுருக்கமான மரபான மொழிபெயர்ப்பு.
- source_word: חָזָק הוּא
  choice: அவர்கள் வலிமைமிக்கவர்களாக இருந்தாலும்
  rationale: ஒருமை வடிவிலுள்ள தொகுப்புப் பயன்பாட்டை கானானிய மக்கள் கூட்டத்துக்கு ஏற்ற தமிழ்ப் பன்மையாக வழங்குகிறது.
theological_decisions:
- issue: கானானிய மக்களைக் குறிக்கும் தொகுப்பு ஒருமை
  choice: ‘கானானியர்கள் ... அவர்கள்’ என்று பன்மையில் மொழிபெயர்த்தல்
