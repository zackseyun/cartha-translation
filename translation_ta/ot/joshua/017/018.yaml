base_translation:
  language: en
  yaml_path: translation/ot/joshua/017/018.yaml
  text: But the hill country will be yours[a]; for it is a forest, and you shall clear it, and its farthest borders shall be yours. For you shall dispossess the Canaanites[c][b], though they have iron chariots and though they are strong.
translation:
  language: ta
  text: ஆனால் மலைநாடு உங்களுடையதாக இருக்கும்[a]. அது காடாக இருப்பதால், அதை நீங்கள் வெட்டிச் சுத்தப்படுத்துவீர்கள்; அதன் தொலைவான எல்லைகள் வரை உங்களுடையதாகும்[b]. கானானியர்களுக்கு இரும்பு ரதங்கள் இருந்தாலும், அவர்கள் வலிமைமிக்கவர்களாக இருந்தாலும், அவர்களை நீங்கள் உரிமையிழக்கச் செய்வீர்கள்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மலை உங்களுடையதாக இருக்கும்.” எபிரெயச் சொல் ஒரு தனி மலையையோ மலைப்பாங்கான பகுதியையோ குறிக்கலாம்; இங்கு யோசேப்பின் சந்ததியாருக்கு ஒதுக்கப்பட்ட மலைநாடு குறிக்கப்படுவது பொருத்தமாகத் தெரிகிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அதன் கடைக்கோடிப் பகுதிகள்” அல்லது “அதன் வெளிப்புறப் பகுதிகள்.” எபிரெயச் சொல் இந்தக் காடுள்ள மலைநாட்டின் வெளி எல்லைகளைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: c
    text: எபிரெயில், “கானானியன் ... அவன் வலிமையானவன்” என்று ஒருமை வடிவங்கள் உள்ளன; அவை இங்கு அந்த மக்கள் கூட்டத்தைத் தொகுப்பாகக் குறிக்கின்றன.
    reason: lexical_alternative
