    rationale: எபிரெய உரை எலெயாசார், யோசுவா, தலைவர்கள் ஆகிய ஒவ்வொருவரின் முன்பும் அவர்கள் ஆஜரானதை வலியுறுத்துகிறது. தமிழில் மீட்டுரைப்பது இயல்பற்றதல்ல; எனவே அதைக் காக்கலாம்.
  - severity: low
