  source_fidelity: 'மூலத்தின் முக்கியப் பொருள் நன்கு காக்கப்பட்டுள்ளது: யாவே என்ற பெயர், மோசேக்கு அளிக்கப்பட்ட கட்டளை, பெண்கள் கோரும் பரம்பரைப் பங்கு, மற்றும் தந்தைவழி உறவுக் குறிப்பு அனைத்தும் துல்லியமாக உள்ளன. ஆனால் לִפְנֵי (''முன்பாக'') மூன்று முறை மீளவருவதை ஒரே முறையாகச் சுருக்குவது, அதிகாரிகளின் முன் நிகழும் முறையான ஆஜராதலின் வலியுறுத்தலைச் சிறிதளவு குறைக்கிறது.'
  naturalness: நடை பொதுவாக நவீன நிலையான தமிழில் இயல்பாக உள்ளது. ஆயினும் அதிகாரிகளின் பட்டியலில் ஒவ்வொருவருக்கும் 'முன்பாகவும்' என்பதை மீட்டுரைப்பது தமிழிலும் இயல்பாகவே இருந்து மூலத்தின் அமைப்பைத் தெளிவாகக் காட்டும். 'எனவே' என்பதற்குப் பதில் கதைநடைத் தொடர்ச்சியான 'அப்பொழுது' பொருத்தமானது.
  terminology: '''ஆசாரியன்,'' ''தலைவர்கள்,'' ''யாவே,'' மற்றும் ''சகோதரர்கள்'' ஆகியவை ஏற்றவை. נַחֲלָה என்பதன் நில-பரம்பரைப் பொருளை ''பரம்பரைப் பங்கு'' என்பதால் ''உரிமைப் பங்கு'' என்பதைவிடச் சற்றுத் துல்லியமாகக் காட்டலாம். ''தந்தையின் சகோதரர்கள்'' என்பது மூலத்தின் குறிப்பிட்ட உறவுமுறையைப் பாதுகாக்கிறது.'
  issues:
