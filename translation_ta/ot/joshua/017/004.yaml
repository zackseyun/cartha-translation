base_translation:
  language: en
  yaml_path: translation/ot/joshua/017/004.yaml
  text: So they came near before Eleazar the priest[a], and before Joshua son of Nun, and before the leaders, saying, “Yahweh commanded Moses to give us an inheritance among our brothers.” So he gave them, according to the command of Yahweh[c][b], an inheritance among their father's brothers.
translation:
  language: ta
  text: அவர்கள் ஆசாரியனாகிய எலெயாசாரின் முன்பாகவும், நூனின் மகன் யோசுவாவின் முன்பாகவும், தலைவர்களின் முன்பாகவும் வந்து, “எங்கள் சகோதரர்களின் நடுவே[a] எங்களுக்கு ஒரு பரம்பரைப் பங்கைக் கொடுக்கும்படி யாவே மோசேக்குக் கட்டளையிட்டார்” என்றார்கள். அப்பொழுது அவர், யாவேயின் கட்டளைப்படி[b], அவர்களுடைய தந்தையின் சகோதரர்களின் நடுவே[c] அவர்களுக்கு ஒரு பரம்பரைப் பங்கைக் கொடுத்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “எங்கள் சகோதரர்கள்” என்பது இங்கு ஆண் உடன்பிறந்தவர்களைக் குறிக்கிறது; அவர்களுக்கு ஒதுக்கப்பட்ட பங்கில் இந்த மகள்கள் தங்களுக்கான பங்கைக் கோருகிறார்கள்.
    reason: cultural_note
  - marker: b
    text: சொல்லுக்கு சொல், “யாவேயின் வாயின்படி”; அதாவது, யாவே கட்டளையிட்டபடி.
    reason: lexical_alternative
  - marker: c
    text: “அவர்களுடைய தந்தையின் சகோதரர்கள்” என்பது அவர்களுடைய தந்தைவழிக் குலத்தாரைக் குறிக்கிறது.
    reason: cultural_note
lexical_decisions:
- source_word: וַתִּקְרַבְנָה
  choice: அவர்கள் ... முன்பாக வந்து
  rationale: பெண்பால் பன்மை வினை முந்தைய சூழலில் குறிப்பிடப்பட்ட செலொப்பெகாதின் மகள்களைக் குறிக்கிறது. ‘வந்து’ என்பது அதிகாரிகளின் முன் முறையாக அணுகிய செயலை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: לִפְנֵי
  choice: முன்பாக
  rationale: மூன்று அதிகாரத் தரப்பினரின் முன்னிலையில் அவர்கள் ஆஜரான பொது மற்றும் சட்டச் சூழலைக் காக்கிறது; தமிழில் பட்டியலை இயல்பாக்க ஒருமுறை இறுதியில் இணைக்கப்பட்டுள்ளது.
- source_word: הַכֹּהֵן
  choice: ஆசாரியனாகிய
  rationale: כֹּהֵן என்பதற்கான வழக்கமான, தெளிவான தமிழ்ச் சமயப் பதவி.
- source_word: הַנְּשִׂיאִים
  choice: தலைவர்கள்
  rationale: கோத்திர அல்லது சமூகத் தலைவர்களைக் குறிக்கிறது; ‘அரசகுமாரர்கள்’ என்ற தவறான அரச மரபுப் பொருளைத் தவிர்க்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைப்பட்டத்தால் மாற்றாமல் எபிரெய தனிப்பெயரான יהוה-ஐ தமிழில் ஒலிபெயர்க்கிறது.
- source_word: צִוָּה אֶת־מֹשֶׁה
  choice: மோசேக்குக் கட்டளையிட்டார்
  rationale: צוה என்பதன் அதிகாரமிக்க கட்டளைப் பொருளை நேரடியாகக் காக்கிறது.
- source_word: לָתֶת לָנוּ נַחֲלָה
  choice: எங்களுக்கு ஓர் உரிமைப் பங்கைக் கொடுக்கும்படி
  rationale: נַחֲלָה இங்கு ஒதுக்கப்பட்ட பரம்பரை நிலப்பங்கைக் குறிக்கிறது. ‘உரிமைப் பங்கு’ நவீன தமிழில் தெளிவாகவும் யோசுவா நூலின் நிலப் பங்கீட்டுச் சூழலுக்கு ஏற்றதாகவும் உள்ளது.
- source_word: בְּתוֹךְ אַחֵינוּ
  choice: எங்கள் சகோதரர்களின் நடுவே
  rationale: மூலத்தின் ஆண்பால் உறவுமொழியையும், ஆண் குலத்தாருக்கு ஒதுக்கப்பட்ட பகுதியில் மகள்கள் பங்கு கோரிய சட்டச் சூழலையும் காக்கிறது.
- source_word: וַיִּתֵּן
  choice: அவர் ... கொடுத்தார்
  rationale: எபிரெய ஒருமை வினையைப் பின்பற்றுகிறது. அருகிலுள்ள ஆண் ஒருமைப் பாத்திரமான யோசுவா செயற்படுத்தியவராக இயல்பாகப் புரிந்துகொள்ளப்படுகிறார்; பெயரைச் சேர்த்து மூலத்தைவிட அதிகமாகத் தீர்மானிக்கவில்லை.
- source_word: אֶל־פִּי יְהוָה
  choice: யாவேயின் கட்டளைப்படி
  rationale: சொல்லுக்கு சொல் ‘யாவேயின் வாயின்படி’ என்ற மொழிமரபின் அதிகாரபூர்வமான பொருளை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: אֲחֵי אֲבִיהֶן
  choice: அவர்களுடைய தந்தையின் சகோதரர்கள்
  rationale: ‘தந்தையின் சகோதரர்கள்’ என்ற குறிப்பிட்ட தந்தைவழி உறவைப் பொதுவான ‘உறவினர்கள்’ எனத் தளர்த்தாமல் காக்கிறது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் தனிப்பெயர் நேரடியாக உள்ளது; ஆகவே அதை ஒரு பட்டத்தால் மாற்றாமல் ஒலிபெயர்ப்பது உரைச் சான்றைத் தெளிவாகக் காக்கிறது.
- issue: אַחֵינוּ என்பதிலுள்ள பாலினம் குறித்த உறவுமொழி
  choice: எங்கள் சகோதரர்கள்
  alternative: எங்கள் உறவினர்கள்
  rationale: இந்தச் சட்டச் சூழலில் பெண்கள் தங்களுடைய ஆண் குலத்தாரின் நில ஒதுக்கீட்டுக்குள் பங்கு கோருகிறார்கள்; மூலத்தின் சமூக மற்றும் சட்டத் தனித்தன்மையைப் பாதுகாக்க ஆண்பால் சொல் வைக்கப்பட்டுள்ளது.
- issue: וַיִּתֵּן என்ற ஒருமை வினையின் எழுவாய்
  choice: அவர்
  alternative: யோசுவா
  rationale: யோசுவாவே செயற்படுத்தியவர் என்பது சூழலில் மிக இயல்பான புரிதல். இருப்பினும் எபிரெயம் பெயரை மீண்டும் குறிப்பிடாததால், மொழிபெயர்ப்பு பெயரைச் சேர்த்து மறைமுகத்தன்மையை முற்றிலும் நீக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. அதிகாரிகளின் பட்டியல் தமிழின் இயல்பான தொடரமைப்பில் அமைக்கப்பட்டுள்ளது. ‘உரிமைப் பங்கு’ என்பது நில ஒதுக்கீடும் பரம்பரை உரிமையும் சேர்ந்த நுணுக்கத்தைச் சுருக்கமாகத் தருகிறது; தேவையான குல மற்றும் சட்டப் பின்னணி அடிக்குறிப்புகளில் விளக்கப்பட்டுள்ளது.
