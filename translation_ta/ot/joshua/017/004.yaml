    rationale: இது தவறல்ல; ஆனால் இச்சூழலில் ஒதுக்கப்படும் மரபுவழி நிலப்பங்கின் நுணுக்கத்தை 'பரம்பரைப் பங்கு' இன்னும் நேரடியாகத் தருகிறது.
  revised_text: அவர்கள் ஆசாரியனாகிய எலெயாசாரின் முன்பாகவும், நூனின் மகன் யோசுவாவின் முன்பாகவும், தலைவர்களின் முன்பாகவும் வந்து, “எங்கள் சகோதரர்களின் நடுவே[a] எங்களுக்கு ஒரு பரம்பரைப் பங்கைக் கொடுக்கும்படி யாவே மோசேக்குக் கட்டளையிட்டார்” என்றார்கள். அப்பொழுது அவர், யாவேயின் கட்டளைப்படி[b], அவர்களுடைய தந்தையின் சகோதரர்களின் நடுவே[c] அவர்களுக்கு ஒரு பரம்பரைப் பங்கைக் கொடுத்தார்.
  revised_footnotes:
