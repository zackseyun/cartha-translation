  revision_rationale: மூன்று அதிகாரத் தரப்பினருக்கும் 'முன்பாகவும்' என்பதை வெளிப்படையாக மீட்டுரைத்து மூலத்தின் முறையான ஆஜராதல் அமைப்பை மீட்டெடுத்தேன். நַחֲלָהவின் மரபுவழி நில உரிமை நுணுக்கத்தைத் தெளிவாக்க 'பரம்பரைப் பங்கு' பயன்படுத்தினேன். ஒருமை எழுவாயான 'அவர்' அப்படியே வைக்கப்பட்டதால், எபிரெய உரை பெயரிடாமல் விடும் குறிப்பைத் தேவையின்றி உறுதிப்படுத்தவில்லை. அடிக்குறிப்பு a-வில் மூலச் சூழலை மீறி 'குல ஆண்கள்' என விரிவுபடுத்திய சாத்தியத்தை நீக்கி, உடனடி உறவுக் குறிப்புக்கு ஏற்பச் செய்தேன்.
