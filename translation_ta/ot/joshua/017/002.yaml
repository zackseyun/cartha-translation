base_translation:
  language: en
  yaml_path: translation/ot/joshua/017/002.yaml
  text: 'And it was for the remaining sons of Manasseh according to their clans: for the sons of Abiezer[a], and for the sons of Helek, and for the sons of Asriel, and for the sons of Shechem, and for the sons of Hepher, and for the sons of Shemida. These were the male sons of Manasseh son of Joseph[c][b], according to their clans.'
translation:
  language: ta
  text: 'மனாசேயின் மீதமுள்ள மகன்களுக்கு அவரவர் குலங்களின்படி பங்கு ஒதுக்கப்பட்டது: அபியேசரின் மகன்களுக்கும், ஏலேக்கின் மகன்களுக்கும், அஸ்ரியேலின் மகன்களுக்கும், சீகேமின் மகன்களுக்கும், ஏப்பேரின் மகன்களுக்கும், செமிதாவின் மகன்களுக்கும். இவர்களே யோசேப்பின் மகனான மனாசேயின் ஆண் மகன்கள், அவரவர் குலங்களின்படி.


    [a] எபிரெய மொழியில் சொல்லுக்குச் சொல், “மனாசேயின் மீதமுள்ள மகன்கள்.” “மீதமுள்ள வழித்தோன்றல்கள்” என்றும் பொருள்படலாம்.


    [b] “குலங்கள்” என்பதற்கான எபிரெயச் சொல், ஒரு கோத்திரத்துக்குள் உள்ள உறவுமுறைப் பிரிவுகளைக் குறிக்கிறது; “குடும்பங்கள்” என்றும் மொழிபெயர்க்கலாம்.


    [c] “ஆண் மகன்கள்” என்று எபிரெயம் வலியுறுத்துகிறது. சுற்றியுள்ள பகுதியில் குறிப்பிடப்படும் செலொப்பெகாதின் மகள்களிலிருந்து இவர்களை இது வேறுபடுத்துகிறது.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மொழியில் சொல்லுக்குச் சொல், “மனாசேயின் மீதமுள்ள மகன்கள்.” “மீதமுள்ள வழித்தோன்றல்கள்” என்றும் பொருள்படலாம்.
    reason: lexical_alternative
  - marker: b
    text: “குலங்கள்” என்பதற்கான எபிரெயச் சொல், ஒரு கோத்திரத்துக்குள் உள்ள உறவுமுறைப் பிரிவுகளைக் குறிக்கிறது; “குடும்பங்கள்” என்றும் மொழிபெயர்க்கலாம்.
    reason: cultural_note
  - marker: c
    text: “ஆண் மகன்கள்” என்று எபிரெயம் வலியுறுத்துகிறது. சுற்றியுள்ள பகுதியில் குறிப்பிடப்படும் செலொப்பெகாதின் மகள்களிலிருந்து இவர்களை இது வேறுபடுத்துகிறது.
    reason: cross_reference
lexical_decisions:
- source_word: וַיְהִי לִבְנֵי מְנַשֶּׁה הַנּוֹתָרִים
  choice: மனாசேயின் எஞ்சிய மக்களுக்கு ... பங்கு கிடைத்தது
  rationale: וַיְהִי לְ என்ற ஒதுக்கீட்டுச் சூழலுக்குரிய தொடரைத் தமிழில் இயல்பாகவும் தெளிவாகவும் தர “பங்கு கிடைத்தது” பயன்படுத்தப்பட்டது. הַנּוֹתָרִים என்பதன் ‘எஞ்சிய’ பொருள் காக்கப்பட்டது.
- source_word: לְמִשְׁפְּחֹתָם
  choice: அவரவர் குலங்களின்படி
  rationale: மִשְׁפָּחָה இங்கு கோத்திரத்துக்குள் உள்ள உறவுமுறைப் பிரிவைக் குறிக்கிறது; நவீன தமிழில் ‘குடும்பம்’ என்பதைவிட ‘குலம்’ சூழலுக்குப் பொருத்தமானது.
- source_word: לִבְנֵי אֲבִיעֶזֶר ... וְלִבְנֵי שְׁמִידָע
  choice: அபியேசரின் வழித்தோன்றல்களுக்கும் ... செமிதாவின் வழித்தோன்றல்களுக்கும்
  rationale: בְּנֵי என்பதன் வம்சவழிப் பொருளைத் தெளிவாகக் காட்ட ‘வழித்தோன்றல்கள்’ தேர்ந்தெடுக்கப்பட்டது; மீண்டும் வரும் அமைப்பு சட்டபூர்வமான பங்கீட்டுப் பட்டியலின் நடையைப் பாதுகாக்கிறது.
- source_word: בְּנֵי מְנַשֶּׁה בֶּן יוֹסֵף
  choice: யோசேப்பின் மகனான மனாசேயின் ... வழித்தோன்றல்கள்
  rationale: மனாசே யோசேப்பின் மகன் என்ற வம்ச அடையாளம், தமிழின் இயல்பான உறவுத்தொடர் வரிசையில் காக்கப்பட்டது.
- source_word: הַזְּכָרִים
  choice: ஆண் வழித்தோன்றல்கள்
  rationale: சொல் ஆண்பாலினரைத் தெளிவாகக் குறிக்கிறது. தமிழில் தேவையற்ற ‘ஆண் மகன்கள்’ என்ற இரட்டிப்பைத் தவிர்த்தும், சூழலிலுள்ள பாலின வேறுபாட்டை மறைக்காமலும் இத்தேர்வு செய்கிறது.
theological_decisions:
- issue: ஆண் வம்சவரிசைக்கும் செலொப்பெகாதின் மகள்களுக்கும் இடையிலான சூழல் வேறுபாடு
  choice: ஆண் வழித்தோன்றல்கள்
  alternative: மனாசேயின் மகன்கள்
  rationale: הַזְּכָרִים என்ற வெளிப்படையான ஆண்பால் வலியுறுத்தலை விடாமல் காக்கிறது; அதேவேளை வாரிசுரிமை குறித்து வசனம் சொல்லாத ஒரு கோட்பாட்டைச் சேர்ப்பதில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், பங்கீட்டுப் பட்டியலுக்குரிய கண்ணியமான சட்டநடை காக்கப்பட்டுள்ளது. பெயர்ப் பட்டியலில் எபிரெயத்தின் மீளுருவாக்கம் ஓரளவு பாதுகாக்கப்பட்டாலும், ‘மகன்கள்’ நேரடி உயிரியல் மகன்கள் என்று தவறாகப் புரியாதபடி ‘வழித்தோன்றல்கள்’ பயன்படுத்தப்பட்டுள்ளது.
