  source_fidelity: வரைவில் பங்கீட்டுச் சூழல், மீதமுள்ள மனாசே வம்சத்தினர், குலங்களின்படியான பட்டியல், மற்றும் ஆண்பால் வலியுறுத்தல் ஆகியவை பெரும்பாலும் காக்கப்பட்டுள்ளன. ஆனால் மூலத்தில் ஒருமுறை மட்டும் மறைமுகமாக உள்ள பங்கீட்டைத் தமிழில் இருமுறை “பங்கு கிடைத்தது” எனக் கூறுவது தேவையற்ற மீளுரைப்பாகும்; இறுதி வாக்கியத்தில் மீண்டும் பங்கு கிடைத்ததாகச் சேர்ப்பது மூலத்தின் அடையாளப்படுத்தும் முடிவுரையை மாற்றுகிறது.
  naturalness: “பங்கு ஒதுக்கப்பட்டது” என்ற ஒரே முதன்மை வினைச்சொல்லுடன் பட்டியலை அமைப்பது நவீன தரத் தமிழிலும் பங்கீட்டுப் பதிவின் முறையான நடையிலும் இயல்பாகும். பெயர்ப் பட்டியலில் “மகன்கள்” என்ற மூலச் சொல்லைத் தக்கவைத்துக்கொண்டு, ஆண்பால் வலியுறுத்தலை “ஆண் மகன்கள்” எனத் தெளிவாகக் கொடுக்கலாம்.
  terminology: “குலங்கள்” என்பது מִשְׁפָּחוֹת என்பதற்குப் பொருத்தமானது. “ஆண் மகன்கள்” என்பது הַזְּכָרִים-இன் வலியுறுத்தலைத் தக்கவைக்கிறது; தமிழில் சற்றே மீளுரைப்பாகத் தோன்றினாலும் இச்சூழலில் நோக்கமுடையது. பெயர்கள் வரைவில் உள்ள ஒலிபெயர்ப்பிலேயே ஒருமையாக வைக்கப்பட்டுள்ளன.
