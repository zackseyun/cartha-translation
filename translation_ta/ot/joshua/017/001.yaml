base_translation:
  language: en
  yaml_path: translation/ot/joshua/017/001.yaml
  text: 'The lot fell to the tribe of Manasseh[a], for he was the firstborn of Joseph: to Machir the firstborn of Manasseh, the father of Gilead, because he was a man of war, there belonged Gilead and Bashan.'
translation:
  language: ta
  text: சீட்டால் நிர்ணயிக்கப்பட்ட பங்கு மனாசே கோத்திரத்துக்குக் கிடைத்தது; ஏனெனில் மனாசே யோசேப்பின் முதற்பேறானவன். மனாசேயின் முதற்பேறானவனும் கீலேயாத்தின் தந்தையுமான[a] மாகீர் ஒரு போர்வீரனாக இருந்ததால், கீலேயாத்தும் பாசானும் அவனுக்குக் கிடைத்தன.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘கீலேயாத்தின் மூதாதை’ அல்லது ‘கீலேயாத்தை நிறுவியவர்.’ ‘தந்தை’ என்பதற்கான எபிரெயச் சொல் உடனடியான உயிரியல் தந்தையை மட்டுமல்லாமல், ஒரு மூதாதையையோ நிறுவியவரையோ குறிக்கவும் முடியும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי הַגּוֹרָל
  choice: சீட்டால் நிர்ணயிக்கப்பட்ட பங்கு ... கிடைத்தது
  rationale: நிலப்பங்கீட்டுக்காகச் சீட்டுப் போடும் நடைமுறையையும் அதன் விளைவாகக் கிடைத்த பங்கையும் இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது; வெறும் ‘சீட்டு விழுந்தது’ என்ற சொல்லுக்குச் சொல் நடையைத் தவிர்க்கிறது.
- source_word: לְמַטֵּה מְנַשֶּׁה
  choice: மனாசே கோத்திரத்துக்கு
  rationale: இங்கு מַטֶּה என்பது கோல் அல்ல, இஸ்ரவேலின் கோத்திரப் பிரிவைக் குறிக்கிறது.
- source_word: כִּי הוּא בְּכוֹר יוֹסֵף
  choice: ஏனெனில் மனாசே யோசேப்பின் முதற்பேறானவன்
  rationale: כִּי-யின் காரணவிளக்கத் தன்மையைப் பேணுகிறது; தமிழில் குழப்பம் ஏற்படாதபடி மூலத்தின் பிரதிப்பெயர் குறிக்கும் மனாசேயின் பெயர் மீண்டும் கூறப்படுகிறது.
- source_word: לְמָכִיר בְּכוֹר מְנַשֶּׁה
  choice: மனாசேயின் முதற்பேறானவனான மாகீர்
  rationale: மாகீரின் வம்ச உறவையும் முதற்பேறு நிலையையும் தெளிவாகப் பேணி, அவனுக்குக் கிடைத்த நிலப்பங்குடன் இணைக்கிறது.
- source_word: אֲבִי הַגִּלְעָד
  choice: கீலேயாத்தின் தந்தை
  rationale: எபிரெயக் குடும்பவழி உருவகத்தை முதன்மை உரையில் அப்படியே பேணுகிறது; ‘மூதாதை’ அல்லது ‘நிறுவியவர்’ என்ற பரந்த பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: אִישׁ מִלְחָמָה
  choice: ஒரு போர்வீரன்
  rationale: போரில் தேர்ந்த மனிதனைக் குறிக்கும் எபிரெயச் சொற்றொடரின் பொருளை இயல்பான, கண்ணியமான நவீனத் தமிழில் வழங்குகிறது.
- source_word: וַיְהִי לוֹ הַגִּלְעָד וְהַבָּשָׁן
  choice: கீலேயாத்தும் பாசானும் அவனுக்குக் கிடைத்தன
  rationale: நிலவுரிமை அல்லது ஒதுக்கீட்டைக் குறிக்கும் உடைமைத் தொடரை இச்சூழலுக்கு ஏற்றவாறு தெரிவிக்கிறது.
