translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. நிலப்பங்கீட்டின் சீட்டு நடைமுறை வெளிப்படையாக வைக்கப்பட்டுள்ளது. ஆங்கில ஆலோசனை உரையில் தவறான இடத்தில் காணப்பட்ட அடிக்குறிப்புக் குறி, அதன் உண்மையான சொற்றொடரான ‘கீலேயாத்தின் தந்தை’ என்பதற்குப் பின் வைக்கப்பட்டுள்ளது.
