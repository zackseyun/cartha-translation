  text: וְ/לִ/צְלָפְחָד֩ בֶּן חֵ֨פֶר בֶּן גִּלְעָ֜ד בֶּן מָכִ֣יר בֶּן מְנַשֶּׁ֗ה לֹא הָ֥יוּ ל֛/וֹ בָּנִ֖ים כִּ֣י אִם בָּנ֑וֹת וְ/אֵ֨לֶּה֙ שְׁמ֣וֹת בְּנֹתָ֔י/ו מַחְלָ֣ה וְ/נֹעָ֔ה חָגְלָ֥ה מִלְכָּ֖ה וְ/תִרְצָֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/017/003.yaml
  text: 'Zelophehad son of Hepher[a], son of Gilead, son of Machir, son of Manasseh, had no sons, but only daughters; and these are the names of his daughters: Mahlah, Noah, Hoglah, Milcah[b], and Tirzah.'
translation:
  language: ta
  text: 'மனாசேயின் மகனான மாகீரின் மகனான கீலேயாத்தின் மகனான எப்பேரின் மகனாகிய செலொப்பெகாத்துக்கு[a] மகன்கள் இல்லை; மகள்கள் மட்டுமே இருந்தனர். அவருடைய மகள்களின் பெயர்கள்: மக்லா, நோவா[b], ஹொக்லா, மில்கா, திர்சா.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொற்சொல்லாக, “செலொப்பெகாத்துக்கோ” அல்லது “செலொப்பெகாத்துக்கு”; இங்கு அவரது நிலையை அறிமுகப்படுத்தும் மரபுத்தொடர்.
    reason: lexical_alternative
  - marker: b
    text: இங்குள்ள நோவா செலொப்பெகாத்தின் மகள்; ஆதியாகமத்தில் வரும் ஆண் நோவா அல்ல.
    reason: cultural_note
lexical_decisions:
- source_word: וְ/לִ/צְלָפְחָד
  choice: செலொப்பெகாத்துக்கு
  rationale: לְ இணைந்த பெயரை எபிரெய மொழியின் உடைமைச் சொல்லமைப்போடு இயல்பாக இணைத்து, ‘செலொப்பெகாத்துக்கு மகன்கள் இல்லை’ என வழங்குகிறது; וְ-ன் தொடர்ச்சிப் பணி தமிழில் தனியே கட்டாயமாக வெளிப்படுத்தப்படவில்லை.
- source_word: בֶּן ... בֶּן ... בֶּן ... בֶּן
  choice: மகனும் ... மகனும் ... மகனும் ... மகனுமான
  rationale: மரபுவழிப் பட்டியலில் மீண்டும் மீண்டும் வரும் ‘மகன்’ என்ற உறவைச் சுருக்காமல் காக்கிறது; தமிழ் வாக்கிய ஓட்டத்திற்காகப் பெயரெச்சத் தொடராக அமைக்கப்பட்டுள்ளது.
- source_word: לֹא הָיוּ לוֹ בָּנִים
  choice: மகன்கள் இல்லை
  rationale: எபிரெய உடைமைச் சொல்லமைப்பின் இயல்பான தமிழ் இணை; மகள்களுடனான பாலின வேறுபாட்டை காக்க ‘பிள்ளைகள்’ என்று பொதுமைப்படுத்தவில்லை.
- source_word: כִּי אִם בָּנוֹת
  choice: மகள்கள் மட்டுமே இருந்தார்கள்
  rationale: மறுப்புக்குப் பின் வரும் விதிவிலக்கு மற்றும் தனிப்பட்ட வரையறையை ‘மட்டுமே’ தெளிவாக வெளிப்படுத்துகிறது.
- source_word: וְאֵלֶּה שְׁמוֹת בְּנֹתָיו
  choice: அவருடைய மகள்களின் பெயர்கள்
  rationale: பெயர்ப்பட்டியலை அறிமுகப்படுத்தும் எபிரெய மரபுச் சூத்திரத்தை இயல்பான நவீன தமிழில் வழங்குகிறது.
- source_word: מַחְלָה וְנֹעָה חָגְלָה מִלְכָּה וְתִרְצָה
  choice: மக்லா, நோவா, ஒக்லா, மில்கா, திர்சா
  rationale: எபிரெய தனிப்பெயர்களைத் தமிழ் ஒலியமைப்புக்கு ஏற்றவாறு ஒலிபெயர்க்கிறது; נֹעָה இங்கே பெண்ணின் பெயர் என்பதை அடிக்குறிப்பு தெளிவுபடுத்துகிறது.
