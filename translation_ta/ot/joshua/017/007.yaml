translation_notes:
  register: நவீனத் தரத் தமிழில், நில எல்லை விவரிப்புக்கேற்ற கண்ணியமானதும் எளிதில் புரியக்கூடியதுமான நடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தில் உள்ள ‘வலப்புறம்’ என்ற திசைச்சொல் அதன் தெற்குத் திசைச் சாத்தியத்தை அடிக்குறிப்பில் குறிப்பிட்டு, முதன்மை உரையில் பாதுகாக்கப்பட்டுள்ளது.
