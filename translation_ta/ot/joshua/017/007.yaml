  text: And the border of Manasseh was from Asher to Michmethath[a], which is opposite Shechem; then the border went southward[c][b], toward the inhabitants of En-tappuah.
translation:
  language: ta
  text: மனாசேயின் எல்லை ஆசேரிலிருந்து, சீகேமுக்கு எதிரே இருந்த மிக்மெத்தாத்வரை சென்றது.[a] பின்பு அந்த எல்லை வலப்புறமாக[b], ஏன்-தப்புவாவில் குடியிருந்தவர்களிடமாகச் சென்றது.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “சீகேமுக்கு முன்பாக இருந்தது” அல்லது “சீகேமை நோக்கியிருந்தது” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: 'சொல்லுக்குச் சொல்: “வலப்புறமாக.” எல்லை விவரிப்புகளில் இது தெற்குத் திசையைக் குறிக்கக்கூடும்.'
    reason: lexical_alternative
  - marker: c
    text: “ஏன்-தப்புவா” என்பதற்கு “தப்புவாவின் ஊற்று” என்று பொருள்.
    reason: cultural_note
lexical_decisions:
- source_word: גְבוּל
  choice: எல்லை
  rationale: நிலப் பங்கீட்டுச் சூழலில் இது முழுப் பிரதேசத்தைக் காட்டிலும் பழங்குடி நிலத்தின் எல்லைக் கோட்டைக் குறிக்கிறது.
- source_word: מֵאָשֵׁר
  choice: ஆசேரிலிருந்து
  rationale: מִן என்ற முன்னொட்டு எல்லை விவரிப்பின் தொடக்கப் புள்ளியைக் குறிக்கிறது; ஆசேர் இங்கு பழங்குடி அல்லது புவியியல் குறிப்பு.
- source_word: הַמִּכְמְתָת
  choice: மிக்மெத்தாத்
  rationale: இது ஓர் இடப்பெயர் என்பதால் பொருள் மொழிபெயர்ப்பின்றி தமிழில் ஒலிபெயர்க்கப்படுகிறது.
- source_word: אֲשֶׁר עַל־פְּנֵי שְׁכֶם
  choice: சீகேமுக்கு எதிரே இருந்த
  rationale: עַל־פְּנֵי என்பது ஓர் இடத்திற்கு முன்பாக, முகமாக அல்லது எதிரே இருப்பதைக் குறிக்கலாம்; குறிப்பிட்ட திசையை ஊகிக்காமல் இடவுறவைப் பேணுகிறது.
- source_word: וְהָלַךְ הַגְּבוּל
  choice: பின்பு அந்த எல்லை ... சென்றது
  rationale: எல்லை விவரிப்புகளில் הלך என்பது எல்லைக் கோடு செல்லும் போக்கைக் குறிக்கும் மரபுத்தொடர்; தமிழில் இயல்பாக இவ்வாறு தரப்படுகிறது.
- source_word: אֶל־הַיָּמִין
  choice: வலப்புறமாக
  rationale: எபிரெய மூலத்தின் நேரடிப் பொருள் ‘வலப்புறம்’; அது தெற்குத் திசையைக் குறிக்கக்கூடும் என்றாலும், விவாதத்திற்குரிய திசை விளக்கத்தை முதன்மை உரையில் உறுதிப்படுத்தவில்லை.
- source_word: יֹשְׁבֵי
  choice: குடியிருந்தவர்களை
  rationale: இப்பெயரெச்ச வடிவம் ஓர் இடத்தில் வசிக்கும் மக்களைக் குறிக்கிறது; வாக்கியத்தில் இயல்பாக அமைய இவ்வாறு மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: עֵין תַּפּוּחַ
  choice: ஏன்-தப்புவா
  rationale: ‘தப்புவாவின் ஊற்று’ என்ற சொற்பொருளுடைய இடப்பெயர்; முதன்மை உரையில் ஒலிபெயர்க்கப்படுகிறது.
