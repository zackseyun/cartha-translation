translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையைப் பயன்படுத்துகிறது. ‘மனாசேயின் மகன்கள்’ என்ற சொற்சொல் வடிவத்துக்குப் பதிலாக கோத்திர மக்களைக் குறிக்கும் ‘மனாசேயின் மக்கள்’ என்றும், தமிழில் இயல்பற்ற ‘பட்டணங்களை வெளியேற்ற’ என்பதற்குப் பதிலாக அதன் சூழற்பொருளைத் தெளிவுபடுத்தும் ‘பட்டணங்களிலிருந்து கானானியர்களை வெளியேற்ற’ என்றும் வழங்கப்பட்டுள்ளது.
