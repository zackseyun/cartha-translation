  text: וְ/לֹ֤א יָכְלוּ֙ בְּנֵ֣י מְנַשֶּׁ֔ה לְ/הוֹרִ֖ישׁ אֶת הֶֽ/עָרִ֣ים הָ/אֵ֑לֶּה וַ/יּ֨וֹאֶל֙ הַֽ/כְּנַעֲנִ֔י לָ/שֶׁ֖בֶת בָּ/אָ֥רֶץ הַ/זֹּֽאת־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/017/012.yaml
  text: But the sons of Manasseh were not able to dispossess these cities[a], and the Canaanites persisted in dwelling in this land.
translation:
  language: ta
  text: ஆனால் மனாசேயின் மக்களால் இந்தப் பட்டணங்களிலிருந்து கானானியர்களை வெளியேற்ற முடியவில்லை; கானானியர்கள் இந்த நாட்டில் குடியிருக்க உறுதியாக இருந்தார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கானானியன் இந்த நாட்டில் குடியிருக்கத் தீர்மானித்தான்.” எபிரெயத்தில் இனக்குழுவைக் குறிக்கும் ஒருமை கூட்டுப்பெயரும், விருப்பம் அல்லது உறுதியைக் குறிக்கக்கூடிய ஒரு வினையும் பயன்படுத்தப்பட்டுள்ளன.
    reason: எபிரெய ஒருமை கூட்டுப்பெயரையும் וַיּוֹאֶל என்பதன் விருப்பம் அல்லது தீர்மானம் என்ற மாற்றுப் பொருளையும் காட்டுகிறது.
lexical_decisions:
- source_word: יָכְלוּ
  choice: முடியவில்லை
  rationale: இந்த வினை திறன் அல்லது ஆற்றலைக் குறிக்கிறது; வெறும் விருப்பமின்மையை அல்ல, இயலாமையைத் தெளிவாகக் காட்டுகிறது.
- source_word: בְּנֵי מְנַשֶּׁה
  choice: மனாசேயின் மக்கள்
  rationale: எபிரெய மொழியில் சொற்பொருளாக ‘மனாசேயின் மகன்கள்’ என்றாலும், இங்கு மனாசே கோத்திரத்தாரைக் கூட்டாகக் குறிக்கிறது; நவீன தமிழில் ‘மக்கள்’ இயல்பாகவும் உள்ளடக்கமாகவும் உள்ளது.
- source_word: לְהוֹרִישׁ אֶת הֶעָרִים הָאֵלֶּה
  choice: இந்தப் பட்டணங்களிலிருந்து கானானியர்களை வெளியேற்ற
  rationale: ירש என்பதன் Hiphil வடிவம் இச்சூழலில் முந்தைய குடியிருப்பாளர்களை அகற்றுவதைக் குறிக்கிறது. பட்டணங்களே நேரடிச் செயப்படுபொருளாக வரும் எபிரெய மரபை, தமிழில் பொருள் தெளிவாக இருக்கும்படி பட்டணங்களிலிருந்து குடியிருப்போரை வெளியேற்றுதல் என வழங்குகிறது.
- source_word: וַיּוֹאֶל
  choice: தொடர்ந்து குடியிருக்க உறுதியாக இருந்தார்கள்
  rationale: יאל விருப்பம், முனைப்பு அல்லது உறுதியைக் குறிக்கலாம். இங்கு கானானியரின் உறுதியான தொடர்ந்திருப்பை இயல்பான தமிழில் தெரிவிக்கிறது; வெறும் வசிப்பை மட்டும் கூறுவதில்லை.
- source_word: הַכְּנַעֲנִי
  choice: கானானியர்கள்
  rationale: எபிரெய வடிவம் ஒருமையாக இருந்தாலும், இங்கு இனக்குழுவைக் குறிக்கும் கூட்டுப்பெயராகச் செயல்படுகிறது; தமிழில் பன்மை இயல்பானது.
- source_word: בָּאָרֶץ הַזֹּאת
  choice: அந்த நாட்டிலேயே
  rationale: אֶרֶץ இங்கு பேசப்பட்டுவரும் குறிப்பிட்ட நிலப்பகுதியைக் குறிக்கிறது. முதல் வாக்கியத்தின் ‘இந்தப் பட்டணங்கள்’ என்பதைக் தொடர்ந்து தமிழில் ‘அந்த நாடு’ என்பது இயல்பாக அமைகிறது; ‘-ஏ’ அங்கேயே நிலைத்திருக்க முனைந்ததை வலியுறுத்துகிறது.
