revisions:
- from: ஆனால் மனாசேயின் மக்களால் இந்தப் பட்டணங்களிலிருந்து கானானியர்களை வெளியேற்ற முடியவில்லை. கானானியர்களோ அந்த நாட்டிலேயே தொடர்ந்து குடியிருக்க உறுதியாக இருந்தார்கள்.[a]
  to: ஆனால் மனாசேயின் மக்களால் இந்தப் பட்டணங்களிலிருந்து கானானியர்களை வெளியேற்ற முடியவில்லை; கானானியர்கள் இந்த நாட்டில் குடியிருக்க உறுதியாக இருந்தார்கள்.[a]
  rationale: The revision retains the draft's clear contextual expression of dispossession, while restoring the source demonstrative ‘this land’ and removing the added explicit idea of persistence. The footnote remains anchored at the collective noun/clause and preserves the lexical ambiguity without imposing an interpretation.
