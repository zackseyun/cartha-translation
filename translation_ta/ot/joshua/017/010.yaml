base_translation:
  language: en
  yaml_path: translation/ot/joshua/017/010.yaml
  text: Southward it belonged to Ephraim[a], and northward to Manasseh, and the sea was its border; on the north they reached Asher, and on the east Issachar.
translation:
  language: ta
  text: தெற்கே அது எப்பிராயீமுக்கும், வடக்கே மனாசேக்கும் உரியதாக இருந்தது. கடல் அதன் எல்லையாக இருந்தது; வடக்கில் அவர்கள் ஆசேரைச் சந்தித்தார்கள், கிழக்கில் இசக்காரைச் சந்தித்தார்கள்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘வடக்கில் அவர்கள் ஆசேரின் எல்லையை ஒட்டியிருந்தார்கள்; கிழக்கில் இசக்காரின் எல்லையை ஒட்டியிருந்தார்கள்.’ நிலப்பகுதி எல்லைகளை விவரிக்கும்போது, இங்குள்ள எபிரெய வினைச்சொல்லை ‘சந்தித்தார்கள்,’ ‘தொட்டார்கள்,’ அல்லது ‘எல்லையை ஒட்டியிருந்தார்கள்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶגְבָּה לְאֶפְרַיִם
  choice: தெற்கே அது எப்பிராயீமுக்கும் ... உரியதாக இருந்தது
  rationale: திசையைக் குறிக்கும் נֶגְבָּה என்பதையும், நிலப்பகுதி ஒதுக்கீடு அல்லது உரிமையைக் குறிக்கும் לְ என்பதையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது. எபிரெயத்தில் விடுபட்டுள்ள வினை தமிழில் தெளிவுக்காகச் சேர்க்கப்பட்டுள்ளது.
- source_word: וְצָפוֹנָה לִמְנַשֶּׁה
  choice: வடக்கே மனாசேக்கும் உரியதாக இருந்தது
  rationale: முந்தைய தெற்குத் திசைக் கூற்றுக்கு இணையான அமைப்பைப் பேணி, வடப்புற நில ஒதுக்கீட்டைத் தெளிவாகக் கூறுகிறது.
- source_word: וַיְהִי הַיָּם גְּבוּלוֹ
  choice: கடல் அதன் எல்லையாக இருந்தது
  rationale: மேற்குப் புற எல்லையைக் குறிக்கும் நேரடியான கூற்றைத் தமிழில் சுருக்கமாகவும் இயல்பாகவும் தருகிறது; ஆண்பால் ஒருமை பின்னொட்டு உயிரற்ற நிலப்பகுதியைக் குறிப்பதால் ‘அதன்’ என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: יִפְגְּעוּן
  choice: சென்றடைந்தார்கள்
  rationale: நில எல்லை விவரிப்பில் פגע என்பது ‘சந்தித்தல்’, ‘தொடுதல்’, ‘எல்லையாக அமைதல்’ ஆகிய நெருங்கிய பொருள்களை ஏற்கக்கூடும். ‘சென்றடைந்தார்கள்’ புவியியல் தொடர்பை இயல்பாகத் தருகிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: מִצָּפוֹן ... מִמִּזְרָח
  choice: வடக்கில் ... கிழக்கில்
  rationale: இங்கு מִן முன்னொட்டு திசையிலிருந்து நகர்வைக் காட்டுவதைக் காட்டிலும், எந்தப் பக்கத்தில் அடுத்த நிலப்பகுதி சேர்ந்திருந்தது என்பதைக் குறிக்கிறது.
