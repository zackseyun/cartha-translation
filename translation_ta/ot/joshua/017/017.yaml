base_translation:
  language: en
  yaml_path: translation/ot/joshua/017/017.yaml
  text: Joshua said to the house of Joseph—to Ephraim and Manasseh—saying[a], “You are a numerous people, and you have great strength[b]; you shall not have only one allotment.”
translation:
  language: ta
  text: 'யோசுவா யோசேப்பின் வீட்டாரிடம்—அதாவது எப்பிராயீமிடமும் மனாசேயிடமும்—இவ்வாறு சொன்னான்: “நீங்கள் பெருந்திரளான மக்கள்[a]; உங்களுக்கு மிகுந்த வலிமையும் இருக்கிறது. உங்களுக்கு ஒரே ஒரு பங்கு மட்டும் இருக்காது[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘பெரிய மக்கள்’ என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொற்றொடர் எண்ணிக்கை மிகுதியையோ மேன்மையையோ குறிக்கலாம்; இங்குள்ள நிலப்பங்கீட்டுச் சூழல் எண்ணிக்கை மிகுதியைச் சுட்டுகிறது.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில் ‘சீட்டு.’ யோசுவா நூலில் இது பெரும்பாலும் சீட்டுப்போட்டு ஒதுக்கப்பட்ட உரிமைப் பங்கைக் குறிக்கிறது; எனவே இங்கு ‘பங்கு’ என்று மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּית יוֹסֵף
  choice: யோசேப்பின் வீட்டார்
  rationale: குடும்பத்தையும் அதிலிருந்து வந்த கோத்திரங்களையும் குறிக்கும் எபிரெயக் குடும்ப-கோத்திர மரபுத்தொடரை இயல்பான தமிழில் காக்கிறது.
- source_word: לְאֶפְרַיִם וְלִמְנַשֶּׁה
  choice: அதாவது எப்பிராயீமிடமும் மனாசேயிடமும்
  rationale: எப்பிராயீமும் மனாசேயும் ‘யோசேப்பின் வீட்டார்’ யார் என்பதை விளக்குவதால், விளக்க இணைப்பாக மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: עַם רַב
  choice: பெருந்திரளான மக்கள்
  rationale: ரַב என்பது ‘மிகுந்த/பெரிய’ என்ற இரு நிழற்பொருள்களையும் கொள்ளலாம்; நிலப்பங்கீட்டைப் பற்றிய சூழலில் எண்ணிக்கை மிகுதியை இயல்பாகத் தெரிவிக்கிறது.
- source_word: וְכֹחַ גָּדוֹל לָךְ
  choice: உங்களுக்கு மிகுந்த வலிமையும் இருக்கிறது
  rationale: לָךְ என்பதன் உடைமைப் பொருளையும் כֹחַ என்பதன் வலிமை அல்லது ஆற்றல் என்ற பொருளையும் தெளிவான நவீன தமிழில் தருகிறது.
- source_word: לֹא יִהְיֶה לְךָ גּוֹרָל אֶחָד
  choice: உங்களுக்கு ஒரே ஒரு பங்கு மட்டும் இருக்காது
  rationale: யோசுவா நூலின் நிலப்பங்கீட்டுச் சூழலில் גּוֹרָל என்பது சீட்டினால் ஒதுக்கப்பட்ட உரிமைப் பங்கைக் குறிக்கிறது; ‘மட்டும்’ என்பது இங்கு ‘ஒன்று’ என்பதில் உட்கிடக்கும் கட்டுப்படுத்தும் பொருளை வெளிப்படுத்துகிறது.
- source_word: לֵאמֹר
  choice: இவ்வாறு சொன்னான்
  rationale: நேர்கூற்றை அறிமுகப்படுத்தும் எபிரெய உரையாடல் அமைப்பை, தமிழில் தேவையற்ற மறுபடிவம் இல்லாமல் இயல்பாகக் கொண்டுவருகிறது.
