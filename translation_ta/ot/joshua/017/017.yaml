translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான உரைநடை பயன்படுத்தப்பட்டுள்ளது. ‘யோசேப்பின் வீட்டார்’ என்ற கோத்திர மரபுத்தொடர் பாதுகாக்கப்பட்டு, அதன் குறிப்பு எப்பிராயீமும் மனாசேயும் என இயல்பாகத் தெளிவாக்கப்பட்டுள்ளது. எபிரெயத்தில் கூட்டு ஒருமை இருந்தாலும், இரு கோத்திரங்களையும் உள்ளடக்கும் குழுவை நேரடியாக அழைப்பதால் தமிழில் இயல்பான பன்மை ‘நீங்கள்/உங்களுக்கு’ பயன்படுத்தப்பட்டுள்ளது.
