base_translation:
  language: en
  yaml_path: translation/ot/joshua/017/015.yaml
  text: Joshua said to them[a], “If you are a numerous people, go up to the forest and clear land for yourselves there in the land of the Perizzites and the Rephaim[b], since the hill country of Ephraim is too narrow for you.”
translation:
  language: ta
  text: யோசுவா அவர்களிடம், “நீங்கள் மிகுந்த எண்ணிக்கையுள்ள மக்களாயிருந்தால், காட்டுப்பகுதிக்குச் சென்று, பெரிசியரின் மற்றும் ரெப்பாயீமியரின் நாட்டில் அங்கே உங்களுக்காகக் காட்டை வெட்டி நிலத்தைச் சீராக்கிக்கொள்ளுங்கள்[a]. ஏனெனில், எப்பிராயீமின் மலைநாடு[b] உங்களுக்கு இடம் போதாத அளவுக்குக் குறுகலாக உள்ளது” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய வினைச்சொல், மரங்கள் நிறைந்த நிலத்தை வெட்டிச் சீராக்குவதைக் குறிக்கிறது. இதை “அங்கே உங்களுக்காகக் காட்டைச் சீராக்கிக்கொள்ளுங்கள்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “எப்பிராயீமின் மலைநாடு” என்பதை “எப்பிராயீம் மலை” என்றும் மொழிபெயர்க்கலாம்; இங்கு அது எப்பிராயீமுக்குப் பங்கிடப்பட்ட மேட்டு நிலப்பகுதியைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַם רַב
  choice: எண்ணிக்கையில் மிகுந்த மக்கள்
  rationale: இந்தச் சொற்றொடர் மக்களின் எண்ணிக்கையைக் குறிக்கிறது. ‘எண்ணிக்கையில் மிகுந்த’ என்பது யோசேப்பின் சந்ததியார் முன்வைத்த எண்ணிக்கை சார்ந்த கூற்றைத் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: עֲלֵה לְךָ הַיַּעְרָה
  choice: காட்டுப்பகுதிக்குப் போய்
  rationale: עלה இங்கு மேடான அல்லது காடுள்ள பகுதிக்குச் செல்லும் இயக்கத்தைக் குறிக்கிறது. לְךָ என்பதிலுள்ள தன்நலப் பொருள் அடுத்துவரும் ‘உங்களுக்காக’ என்பதில் வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: וּבֵרֵאתָ לְךָ שָׁם
  choice: உங்களுக்காக அங்கே காட்டை வெட்டி இடம் ஏற்படுத்திக்கொள்ளுங்கள்
  rationale: Piel வடிவிலுள்ள ברא, காடுள்ள நிலத்தை வெட்டித் துப்புரவாக்குவதைக் குறிக்கிறது. தமிழில் அதன் மறைமுகச் செயப்படுபொருளையும் பயனையும் இயல்பாக வெளிப்படுத்த இந்தச் சொற்றொடர் பயன்படுத்தப்பட்டுள்ளது.
- source_word: בְּאֶרֶץ הַפְּרִזִּי וְהָרְפָאִים
  choice: பெரிசியர்களும் ரெப்பாயீமியர்களும் வாழும் நாட்டில்
  rationale: இரு மக்கள் குழுக்களின் பெயர்களும் விளக்கவுரையால் மாற்றப்படாமல் ஒலிபெயர்க்கப்பட்டுள்ளன. ‘வாழும்’ என்பது எபிரெய மொழியிலுள்ள உடைமை/தொடர்பு அமைப்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: כִּי אָץ לְךָ
  choice: ஏனெனில் ... உங்களுக்கு இடநெருக்கமாக இருக்கிறது
  rationale: אָץ இங்கு நெருக்கப்பட்ட அல்லது போதிய இடமில்லாத நிலையைக் குறிக்கிறது. ‘இடநெருக்கமாக’ என்பது நிலப்பகுதி அவர்களின் எண்ணிக்கைக்குப் போதவில்லை என்ற கருத்தை, அதற்கு மேல் விளக்காமல் வெளிப்படுத்துகிறது.
- source_word: הַר אֶפְרָיִם
  choice: எப்பிராயீமின் மலைநாடு
  rationale: யோசுவா நூலின் நிலப்பகுதி சார்ந்த சூழலில் הַר என்பது தனியொரு மலையைக் காட்டிலும் மேட்டு அல்லது மலைப்பாங்கான பிரதேசத்தைக் குறிக்கிறது.
