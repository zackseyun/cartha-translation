translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. எபிரெய உரையில் ‘அவர்களிடம்’ என்பது பன்மையாகவும், மக்களை ஒரே குழுவாக நோக்கும் ‘நீ’ வடிவம் ஒருமையாகவும் உள்ளது; இயல்பான தமிழின் மரியாதை/பன்மை வடிவமான ‘நீங்கள்’ இந்தக் கூட்டுப்பொருளைத் தக்கவைக்கிறது. இனக்குழுப் பெயர்கள் விளக்கவுரை இன்றி ஒலிபெயர்க்கப்பட்டுள்ளன.
