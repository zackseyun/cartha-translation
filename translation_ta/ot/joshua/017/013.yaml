base_translation:
  language: en
  yaml_path: translation/ot/joshua/017/013.yaml
  text: And it happened that when the sons of Israel became strong[a], they put the Canaanites to forced labor[c][b], but they did not completely drive them out.
translation:
  language: ta
  text: 'இஸ்ரவேலின் மகன்கள்[a] வலிமை பெற்றபோது இவ்வாறு நடந்தது: அவர்கள் கானானியர்களைக் கட்டாய உழைப்புக்கு[b] உட்படுத்தினார்கள்; ஆனால் அவர்களை முற்றிலுமாகத் துரத்திவிடவில்லை[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இஸ்ரவேலர்கள்.” எபிரெயில், “இஸ்ரவேலின் மகன்கள்.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “கானானியர்களைக் கட்டாயப் பணிக்கு உட்படுத்தினார்கள்”; “கானானியர்கள்மீது திறை விதித்தார்கள்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: “முற்றிலுமாகத் துரத்திவிடவில்லை” என்பதை எபிரெய் வினை அமைப்பு வலியுறுத்துகிறது.
    reason: source_form
lexical_decisions:
- source_word: וַיְהִי כִּי
  choice: …பெற்றபோது
  rationale: இந்த எபிரெயக் கட்டமைப்பு புதிய சூழ்நிலையை காலவாக்கியமாக அறிமுகப்படுத்துகிறது. தமிழில் தனியாக ‘அது நடந்தது’ என்று சேர்ப்பதைவிட, ‘…போது’ என்பது அதன் உரையாடல் செயல்பாட்டை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: חָזְקוּ
  choice: வலிமை பெற்றபோது
  rationale: இங்கு חזק என்பது வலிமையடைதல் அல்லது அதிகாரம் பெருகுதல் என்ற வளர்நிலைப் பொருளைக் குறிக்கிறது.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் மகன்கள்
  rationale: எபிரெயில் உள்ள குடும்ப உறவுச் சொல்லாக்கத்தை வெளிப்படையாகப் பேணுகிறது; இது இஸ்ரவேல் மக்களைக் குறிக்கும் மரபான தேசியப் பெயரும் ஆகும்.
- source_word: וַיִּתְּנוּ אֶת־הַכְּנַעֲנִי לָמַס
  choice: கானானியர்களைக் கட்டாய உழைப்புக்கு உட்படுத்தினார்கள்
  rationale: מַס என்பது இச்சூழலில் வெறும் வரியை விடக் கட்டாயப்படுத்தப்பட்ட வேலை அல்லது சேவையைக் குறிப்பதாகப் புரிகிறது. ஒருமை வடிவிலுள்ள கூட்டுப்பெயர் தமிழில் இயல்பாகப் பன்மையில் தரப்பட்டுள்ளது.
- source_word: וְהוֹרֵשׁ לֹא הוֹרִישׁוֹ
  choice: அவர்களை முற்றிலுமாகத் துரத்திவிடவில்லை
  rationale: வினையெச்சப் பெயருடன் அதே வேர் கொண்ட முற்றுவினை வருவது செயலை வலியுறுத்துகிறது. வெற்றிகொள்ளும் சூழலில் ‘முற்றிலுமாகத் துரத்திவிடவில்லை’ என்பது பொருளைத் தெளிவாகத் தருகிறது; ஆண்பால் ஒருமை பின்னொட்டு கூட்டாகக் கருதப்பட்ட கானானிய மக்களைக் குறிப்பதால் தமிழில் பன்மையாகத் தரப்பட்டுள்ளது.
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל என்பதன் மொழிபெயர்ப்பு
  choice: இஸ்ரவேலின் மகன்கள்
  alternative: இஸ்ரவேலர்கள் / இஸ்ரவேல் மக்கள்
  rationale: மூலத்தின் ஆண்பால் குடும்ப உறவுச் சொல்லாக்கத்தைப் பேணுகிறது; அதேவேளை இது ஒரு முழு இனக்குழுவுக்கான மரபான பெயர் என்பதை அடிக்குறிப்பு தெளிவுபடுத்துகிறது.
- issue: מַס என்பதன் பொருள்
  choice: கட்டாய உழைப்பு
  alternative: கட்டாயப் பணி / திறை
  rationale: மீதமிருந்த கானானியர்கள் வெறும் வரி செலுத்தியதைவிட அடிமைப்படுத்தப்பட்ட சேவைக்குள் கொண்டுவரப்பட்டதைச் சூழல் சுட்டுகிறது. ‘கட்டாய உழைப்பு’ அதன் வற்புறுத்தல் தன்மையை மறைக்காது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘கட்டாய உழைப்பு’ coercive social reality-ஐத் தெளிவாகக் காட்டுகிறது; மூலத்தின் கூட்டொருமை தமிழில் இயல்பான பன்மையாகத் தரப்பட்டுள்ளது.
