  register: நவீனத் தரத் தமிழில், வரலாற்று நிலப்பங்கீட்டின் கண்ணியமான நடை பேணப்பட்டது. நீண்ட எபிரெயப் பட்டியல் தமிழில் வாசிக்க எளிதாக அரைப்புள்ளியால் பிரிக்கப்பட்டது. இடப்பெயர்கள் மூல எபிரெய வடிவங்களுக்கு நெருக்கமாக எழுத்துப்பெயர்க்கப்பட்டன; “மகள் ஊர்கள்” என்ற செயற்கையான சொல்லர்த்த மொழிபெயர்ப்புக்கு மாறாக “சார்ந்த ஊர்கள்” பயன்படுத்தப்பட்டது.
