- source_word: עֵין דֹּר
  choice: ஏன்-தோர்
  rationale: கூட்டுப்பெயரின் வடிவத்தைப் பாதுகாத்து எபிரெயிலிருந்து எழுத்துப்பெயர்க்கப்பட்டது.
