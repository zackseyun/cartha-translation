base_translation:
  language: en
  yaml_path: translation/ot/joshua/017/011.yaml
  text: And Manasseh had in Issachar and in Asher Beth-shean and its daughter villages[a], and Ibleam and its daughter villages, and the inhabitants of Dor and its daughter villages, and the inhabitants of En-dor and its daughter villages, and the inhabitants of Taanach and its daughter villages[b], and the inhabitants of Megiddo and its daughter villages—the three regions.
translation:
  language: ta
  text: மனாசேக்குரியவையாக, இசக்காரிலும் ஆசேரிலும் பெத்-செயானும் அதைச் சார்ந்த சிற்றூர்களும்[a], இப்லெயாமும் அதைச் சார்ந்த சிற்றூர்களும், தோரில் வசித்தவர்களும் அதைச் சார்ந்த சிற்றூர்களும், ஏன்-தோரில் வசித்தவர்களும் அதைச் சார்ந்த சிற்றூர்களும், தானாக்கில் வசித்தவர்களும் அதைச் சார்ந்த சிற்றூர்களும், மெகிதோவில் வசித்தவர்களும் அதைச் சார்ந்த சிற்றூர்களும் இருந்தன—அந்த மூன்று மண்டலங்கள்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லர்த்தமாக, “அதன் மகள்கள்”; இது ஒரு முதன்மை நகரத்தைச் சார்ந்த சிற்றூர்கள் அல்லது குடியிருப்புகளைக் குறிக்கும் எபிரெய மரபுத்தொடர்.
    reason: cultural_note
  - marker: b
    text: “அந்த மூன்று மண்டலங்கள்” என்ற எபிரெய சொற்றொடரின் பொருள் தெளிவற்றது; “மூன்று பகுதிகள்” அல்லது “மூன்று மாவட்டங்கள்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
