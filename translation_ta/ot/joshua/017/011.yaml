- source_word: וַיְהִי לִמְנַשֶּׁה
  choice: மனாசேக்குக் கிடைத்த பங்கில் ... இருந்தன
  rationale: இந்த எபிரெய மொழிநடை மனாசேக்குரிய நிலப்பங்கையோ உடைமையையோ குறிக்கிறது. தமிழில் இயல்பாகவும் பங்கீட்டுச் சூழலைத் தெளிவாகவும் காட்ட இவ்வாறு மொழிபெயர்க்கப்பட்டது.
- source_word: בְּיִשָּׂשכָר וּבְאָשֵׁר
  choice: இசக்காரின் எல்லைக்குள் ... ஆசேரின் எல்லைக்குள்
  rationale: בְ இங்கு அந்தக் கோத்திரங்களின் நிலப்பரப்புக்குள் அமைந்திருந்ததைக் குறிக்கிறது. இடப்பொருளைத் தெளிவாக்க “எல்லைக்குள்” பயன்படுத்தப்பட்டது.
- source_word: בֵּית שְׁאָן
  choice: பெத்-செயான்
  rationale: இடப்பெயர் அதன் எபிரெய ஒலிவடிவத்திற்கு நெருக்கமாக எழுத்துப்பெயர்க்கப்பட்டது.
- source_word: בְנוֹתֶיהָ
  choice: அதைச் சார்ந்த ஊர்கள்
  rationale: சொல்லர்த்தமாக “அதன் மகள்கள்”; முதன்மை நகரத்தைச் சார்ந்த சிற்றூர்கள் அல்லது குடியிருப்புகளைக் குறிக்கும் எபிரெய மரபுத்தொடர். இயல்பான தமிழில் பொருள் தரப்பட்டது.
