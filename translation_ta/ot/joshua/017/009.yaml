base_translation:
  language: en
  yaml_path: translation/ot/joshua/017/009.yaml
  text: Then the border went down to the Brook of Kanah[a], south of the brook. These cities belonged to Ephraim among the cities of Manasseh, and the border of Manasseh was on the north side of the brook[c][b], and its end was at the sea.
translation:
  language: ta
  text: பின்பு எல்லை கானா ஓடைக்குத்[a] தாழ்ந்து சென்று, அந்த ஓடைக்குத் தெற்கே தொடர்ந்தது. மனாசேயின் பட்டணங்களுக்கு நடுவே இருந்த இந்தப் பட்டணங்கள் எப்பிராயீமுக்குச் சொந்தமானவை.[b] மனாசேயின் எல்லை அந்த ஓடையின் வடக்குப் பக்கத்தில் இருந்தது; அது கடலில்[c] முடிந்தது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “கானா பள்ளத்தாக்கு” என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் நַחַל என்பது ஓடையை மட்டுமல்ல, பருவகாலத்தில் நீர் ஓடும் படுகை அல்லது பள்ளத்தாக்கையும் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அதாவது, மனாசேக்கு ஒதுக்கப்பட்ட பிரதேசத்திற்குள் எப்பிராயீமுக்குச் சொந்தமான பட்டணங்கள் அமைந்திருந்தன.
    reason: cultural_note
  - marker: c
    text: இங்கு “கடல்” என்பது மத்தியதரைக் கடலைக் குறிக்கிறது.
    reason: cultural_note
lexical_decisions:
- source_word: וְיָרַד
  choice: பின்பு ... தாழ்ந்து சென்று
  rationale: எல்லை விவரிப்புகளில் ירד என்பது நில அமைப்பில் கீழ்நோக்கிச் செல்வதையோ ஒரு திசையில் இறங்கிச் செல்வதையோ குறிக்கலாம். ‘தாழ்ந்து சென்று’ என்பது அந்த இயக்கத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: הַגְּבוּל
  choice: எல்லை
  rationale: நிலப் பங்கீட்டுச் சூழலில் גבול என்பது பிரதேசத்தை வரையறுக்கும் எல்லைக்கோட்டைக் குறிக்கிறது.
- source_word: נַחַל קָנָה
  choice: கானா ஓடை
  rationale: נחל என்பது ஓடை, பருவகால நீரோடை அல்லது அதன் பள்ளத்தாக்கைக் குறிக்கலாம்.正文த்தில் வாசிக்க எளிதான ‘ஓடை’ பயன்படுத்தப்பட்டு, விரிவான பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: נֶגְבָּה לַנַּחַל
  choice: அந்த ஓடைக்குத் தெற்கே தொடர்ந்தது
  rationale: נֶגְבָּה இங்கு ஓடையுடன் ஒப்பிடுகையில் தெற்குப் பக்கத்தைக் குறிக்கிறது. எல்லை ஓடையை நோக்கிச் சென்றதாகத் தவறாகப் புரிந்துகொள்ளாதவாறு இருப்பிட உறவு தெளிவாக்கப்படுகிறது; ‘தொடர்ந்தது’ எல்லை விவரிப்பின் இயல்பான ஓட்டத்தைத் தருகிறது.
- source_word: עָרִים הָאֵלֶּה לְאֶפְרַיִם
  choice: இந்தப் பட்டணங்கள் எப்பிராயீமுக்குச் சொந்தமானவை
  rationale: வினைச்சொல் இல்லாத எபிரெயக் கூற்று உடைமை அல்லது பங்கீட்டைச் சுட்டுகிறது. ‘சொந்தமானவை’ அதனை இயல்பாகத் தெரிவிக்கிறது.
- source_word: בְּתוֹךְ עָרֵי מְנַשֶּׁה
  choice: மனாசேயின் பட்டணங்களுக்கு நடுவே இருந்த
  rationale: בְּתוֹךְ என்பது இங்கு மனாசேக்கு ஒதுக்கப்பட்ட பிரதேசத்திற்குள் எப்பிராயீமின் பட்டணங்கள் அமைந்திருந்ததைக் குறிக்கிறது.
- source_word: וּגְבוּל מְנַשֶּׁה מִצְּפוֹן לַנַּחַל
  choice: மனாசேயின் எல்லை அந்த ஓடையின் வடக்குப் பக்கத்தில் இருந்தது
  rationale: מִצְּפוֹן என்பது ஓடையின் வடக்குப் பக்கத்திலான எல்லையின் இருப்பிடத்தைக் குறிப்பிடுகிறது.
- source_word: וַיְהִי תֹצְאֹתָיו הַיָּמָּה
  choice: அது கடலில் முடிந்தது
  rationale: எல்லை விவரிப்புகளில் תֹצְאֹתָיו என்பது எல்லையின் இறுதிப் புள்ளியைக் குறிக்கும் வழக்குச் சொற்றொடர். ‘கடலில் முடிந்தது’ சுருக்கமாகவும் இயல்பாகவும் உள்ளது.
