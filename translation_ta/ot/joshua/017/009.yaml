  source_fidelity: 'மூல எபிரெய உரையின் எல்லை விவரிப்பு துல்லியமாகப் பிரதிபலிக்கப்படுகிறது: எல்லை கானா ஓடையை நோக்கி இறங்கிச் செல்கிறது; ஓடையின் தெற்குப் பகுதியில் எப்பிராயீமின் நகரங்கள் மனாசேயின் நகரங்களுக்குள் அமைந்துள்ளன; மனாசேயின் எல்லை ஓடையின் வடக்கில் இருந்து கடலில் முடிகிறது. “தொடர்ந்தது” என்பது எல்லைக்கோட்டின் இயக்கத்தை இயல்பாக வெளிப்படுத்தும் குறைந்தளவிலான விளக்கமாகும்; மூலத்தின் பொருளை மாற்றவில்லை.'
  naturalness: நவீன பொதுத்தமிழில் உரை தெளிவாகவும் இயல்பாகவும் உள்ளது. “தாழ்ந்து சென்று,” “வடக்குப் பக்கத்தில் இருந்தது,” “கடலில் முடிந்தது” ஆகியவை எல்லை வருணனைக்கேற்ற நடை. “பட்டணங்கள்” என்பதும் இப்பதிவின் கண்ணியமான புவியியல்-வரலாற்று நடைக்கு ஏற்றது.
