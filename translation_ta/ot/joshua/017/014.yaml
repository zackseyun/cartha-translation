base_translation:
  language: en
  yaml_path: translation/ot/joshua/017/014.yaml
  text: Then the sons of Joseph spoke to Joshua[a], saying, “Why have you given me one lot and one portion as an inheritance, though I am a numerous people, since Yahweh has blessed me until now?”
translation:
  language: ta
  text: யோசேப்பின் மகன்கள் யோசுவாவிடம், “ஒரே ஒரு சீட்டால் ஒதுக்கப்பட்ட பங்கையும் ஒரே ஒரு நிலப்பகுதியையும்[a] மட்டும் ஏன் எனக்குச் சுதந்தரமாகக் கொடுத்தாய்? நான் எண்ணிக்கையில் பெருகிய ஒரு மக்கள் கூட்டமாக இருந்தும், யாவே இன்றுவரை என்னை ஆசீர்வதித்திருப்பதால் இப்படியா?” என்று பேசினார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஒரே ஒரு அளந்து ஒதுக்கப்பட்ட நிலப்பரப்பு.” எபிரெயச் சொல் அளவிடப்பட்ட நிலப்பங்கு அல்லது பிரதேசத்தைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבְּרוּ בְּנֵי יוֹסֵף אֶת יְהוֹשֻׁעַ לֵאמֹר
  choice: யோசேப்பின் மகன்கள் யோசுவாவிடம் ... என்று கேட்டார்கள்
  rationale: பேச்சை அறிமுகப்படுத்தும் எபிரெயச் சொற்றொடரை இயல்பான நவீன தமிழில் தருகிறது; கேள்வியே உரையின் உள்ளடக்கமாக இருப்பதால் ‘கேட்டார்கள்’ பொருத்தமாக உள்ளது.
- source_word: נָתַתָּה לִּי נַחֲלָה
  choice: எனக்கு உரிமைச்சொத்தாகக் கொடுத்தாய்
  rationale: யோசுவா நூலில் נַחֲלָה என்பது ஒதுக்கப்பட்ட பரம்பரை நிலவுரிமையைக் குறிக்கிறது; ‘உரிமைச்சொத்து’ அந்தச் சூழலைச் சுருக்கமாக வெளிப்படுத்துகிறது.
- source_word: גּוֹרָל אֶחָד
  choice: ஒரே ஒரு குலுக்குச்சீட்டுப் பங்கு
  rationale: גּוֹרָל என்பது குலுக்குச்சீட்டின் மூலம் ஒதுக்கப்பட்ட பங்கைக் குறிக்கிறது. ‘குலுக்குச்சீட்டுப் பங்கு’ முறை மற்றும் கிடைத்த பங்கு ஆகிய இரண்டையும் தெளிவுபடுத்துகிறது.
- source_word: וְחֶבֶל אֶחָד
  choice: ஒரே ஒரு நிலப்பகுதி
  rationale: חֶבֶל இங்கு அளந்து ஒதுக்கப்பட்ட நிலப்பகுதி அல்லது பிரதேசத்தைக் குறிக்கலாம்; முதன்மை உரையில் இயல்பான ‘நிலப்பகுதி’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: וַאֲנִי עַם רָב
  choice: நான் எண்ணிக்கையில் மிகுந்த மக்களாக இருக்கிறபோதும்
  rationale: யோசேப்பின் கோத்திரங்கள் கூட்டாகத் தங்களை ஒருமையில் ‘நான்’ என்று குறிப்பிடும் எபிரெய வடிவத்தையும், רָב இங்கு மக்கள்தொகை பெருக்கத்தைக் குறிப்பதையும் காக்கிறது.
- source_word: עַד אֲשֶׁר עַד כֹּה בֵּרְכַנִי
  choice: இன்றுவரை என்னை ஆசீர்வதித்திருப்பதால்
  rationale: עַד כֹּה என்பதன் கால எல்லையான ‘இன்றுவரை’ என்பதையும், குறைசொல்லுக்கான காரணத் தொடர்பையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைத் திருப்பெயரான நான்கு எழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் வழக்கமான ஒலிபெயர்ப்பாக வழங்குகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூலத்தில் தனிப்பட்ட இறைப் பெயர் நேரடியாக இடம்பெறுவதால், அதை ஒரு பட்டமாக மாற்றாமல் ஒலிபெயர்த்துள்ளது.
- issue: கோத்திரக் குழு தன்னை ஒருமையில் குறிப்பிடுதல்
  choice: ‘நான் ... மக்களாக’ என்ற கூட்டொருமையைப் பேணுதல்
  alternative: ‘நாங்கள் ... மக்களாக’ என்று தமிழில் இயல்பாக்குதல்
  rationale: எபிரெய உரையில் உள்ள ‘எனக்கு/நான்/என்னை’ என்ற ஒருமை வடிவங்கள் யோசேப்பின் சந்ததியை ஒரே கூட்டமைப்பாகச் சித்தரிக்கின்றன; அந்தத் திட்டமிட்ட இலக்கணப் பதற்றம் மறைக்கப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. கூட்டைக் குறிக்கும் ஒருமை வடிவம் மூலத்தின் தன்மையைப் பேணுவதற்காகத் திட்டமிட்டு வைக்கப்பட்டுள்ளது; ‘மட்டும்’ குறைசொல்லின் உட்கருத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
