  text: For the daughters of Manasseh received an inheritance among his sons[c][b][a], and the land of Gilead belonged to the rest of the sons of Manasseh.
translation:
  language: ta
  text: ஏனெனில், மனாசேயின் மகள்கள் மனாசேயின் மகன்களுக்கிடையே மரபுரிமைப் பங்கைப் பெற்றார்கள்; கீலேயாத் நாடு மனாசேயின் மீதமுள்ள மகன்களுக்கு உரியதாக இருந்தது.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய பங்கீட்டு ஏற்பாட்டிற்கான விளக்கத்தை அறிமுகப்படுத்துகிறது; காரண/விளக்கத் தொடர்பைத் தமிழில் இயல்பாகக் காட்டுகிறது.
- source_word: בְּנוֹת מְנַשֶּׁה
  choice: மனாசேயின் மகள்கள்
  rationale: மகள்களுக்கும் மகன்களுக்கும் இடையிலான வெளிப்படையான வேறுபாட்டைப் பேணும் நேரடியான மொழிபெயர்ப்பு.
- source_word: נָחֲלוּ נַחֲלָה
  choice: சொத்துரிமைப் பங்கைப் பெற்றார்கள்
  rationale: வினை-பெயர் ஒரே வேரிலிருந்து வரும் எபிரெயக் கட்டமைப்பின் மரபுரிமை நிலப்பங்கு கருத்தை, தமிழில் தேவையற்ற சொல் மறுமொழியின்றித் தெளிவாகத் தருகிறது.
- source_word: בְּתוֹךְ בָּנָיו
  choice: அவனுடைய மகன்களுக்கிடையே
  rationale: ‘அவனுடைய’ என்பது மனாசேயைக் குறிக்கிறது; மகள்கள்–மகன்கள் என்ற சட்டப்பூர்வப் பங்கீட்டு வேறுபாட்டைப் பாதுகாக்க ‘மகன்கள்’ என்று குறிப்பாக மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: וְאֶרֶץ הַגִּלְעָד
  choice: கீலேயாத் நாடோ
  rationale: நிலப்பரப்பைக் குறிக்கும் இயல்பான தமிழ்; ‘-ஓ’ முன்னைய பங்குடன் இதை வேறுபடுத்திக் காட்டுகிறது.
- source_word: הָיְתָה לִבְנֵי מְנַשֶּׁה הַנּוֹתָרִים
  choice: மனாசேயின் எஞ்சிய மகன்களுக்கு உரியதாக இருந்தது
  rationale: உடைமை/பங்கீட்டின் விளைவை இயல்பாகத் தெரிவிக்கிறது; הַנּוֹתָרִים என்பதன் ‘எஞ்சிய’ என்ற பொருளையும் பேணுகிறது.
