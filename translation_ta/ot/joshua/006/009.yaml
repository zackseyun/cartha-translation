  text: And the armed men were going before the priests who were blowing the trumpets[a], and the rear guard was going behind the ark, while they kept blowing the trumpets.
translation:
  language: ta
  text: ஆயுதம் ஏந்தியவர்கள், கொம்புகளை[a] ஊதிக்கொண்டிருந்த ஆசாரியர்களுக்கு முன்னால் சென்று கொண்டிருந்தனர்; பின்காவல் படை பேழைக்குப் பின்னால் சென்று கொண்டிருந்தது; கொம்புகளைத் தொடர்ந்து ஊதிக்கொண்டே இருந்தனர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் ஷோஃபாரோத்; இவை ஊதி ஒலிக்கச் செய்யப்படும் கொம்புகள்; பொதுவாக ‘ஆட்டுக்கடாக் கொம்புகள்’ என்றும் மொழிபெயர்க்கப்படுகின்றன.
    reason: lexical_alternative
