source:
  edition: WLC
  text: וַ/יִּקְרָ֞א יְהוֹשֻׁ֤עַ בִּן נוּן֙ אֶל הַ/כֹּ֣הֲנִ֔ים וַ/יֹּ֣אמֶר אֲלֵ/הֶ֔ם שְׂא֖וּ אֶת אֲר֣וֹן הַ/בְּרִ֑ית וְ/שִׁבְעָ֣ה כֹֽהֲנִ֗ים יִשְׂאוּ֙ שִׁבְעָ֤ה שֽׁוֹפְרוֹת֙ יוֹבְלִ֔ים לִ/פְנֵ֖י אֲר֥וֹן יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/006.yaml
  text: So Joshua son of Nun called the priests and said to them[a], “Carry the ark of the covenant[b], and let seven priests carry seven ram’s-horn trumpets before the ark of Yahweh.”
translation:
  language: ta
  text: நூனின் மகனாகிய யோசுவா ஆசாரியர்களை அழைத்து அவர்களிடம், “உடன்படிக்கைப் பெட்டியைச் சுமந்து செல்லுங்கள். ஏழு ஆசாரியர்கள் யாவேயின் பெட்டிக்கு முன்னால் ஏழு ஆட்டுக்கடாக் கொம்பு எக்காளங்களைச் சுமந்து செல்லட்டும்” என்றார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: அழைத்து
  rationale: קרא என்பதன் Qal தொடர்வினை வடிவம் இங்கு ஆசாரியர்களை அழைத்து அவர்களிடம் பேசுவதை அறிமுகப்படுத்துகிறது; “அழைத்து” என்பது இயல்பான நவீனத் தமிழ்.
- source_word: יְהוֹשֻׁעַ בִּן נוּן
  choice: நூனின் மகனாகிய யோசுவா
  rationale: எபிரெய தனிப்பெயர்களையும் தந்தை–மகன் உறவையும் தெளிவாகவும் வழக்கமான தமிழ் நடையிலும் தருகிறது.
- source_word: הַכֹּהֲנִים
  choice: ஆசாரியர்கள்
  rationale: இஸ்ரவேலின் வழிபாட்டுப் பணியாளர்களைக் குறிக்கும் כֹּהֵן என்பதற்கான நிலையான, தெளிவான தமிழ் சொல்.
- source_word: שְׂאוּ
  choice: சுமந்துகொள்ளுங்கள்
  rationale: נשׂא என்பதன் கட்டளை வடிவம்; பெட்டியை எடுத்துச் செல்லும் சூழலில் “சுமந்துகொள்ளுங்கள்” செயலைத் தெளிவாகக் காட்டுகிறது.
- source_word: אֲרוֹן הַבְּרִית
  choice: உடன்படிக்கைப் பெட்டி
  rationale: சொற்றொடரின் உறவை நேரடியாகக் காக்கிறது; “பெட்டி” என்பது இன்றைய வாசகர்களுக்கு தெளிவானது.
- source_word: וְשִׁבְעָה כֹהֲנִים יִשְׂאוּ
  choice: ஏழு ஆசாரியர்கள் … சுமந்து செல்லட்டும்
  rationale: கட்டளைக்குப் பின்வரும் imperfect வடிவத்தின் அறிவுறுத்தல் வலிமையை எதிர்கால நிகழ்வாக மட்டும் மாற்றாமல் காக்கிறது.
- source_word: שִׁבְעָה שׁוֹפְרוֹת יוֹבְלִים
  choice: ஏழு செம்மறியாட்டுக் கொம்பு எக்காளங்கள்
  rationale: שׁוֹפָר என்பது கொம்பினால் செய்யப்பட்ட எக்காளத்தையும், יוֹבְלִים இச்சூழலில் செம்மறியாட்டுக் கொம்புகளையும் குறிக்கிறது. மூலத்தின் வடிவத்தையும் பயன்பாட்டையும் இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: לִפְנֵי
  choice: முன்னால்
  rationale: ஊர்வலத்தில் உள்ள இடநிலையை இயல்பான நவீனத் தமிழில் காட்டுகிறது.
- source_word: אֲרוֹן יְהוָה
  choice: யாவேயின் பெட்டி
  rationale: பெட்டிக்கும் יהוה என்ற வெளிப்படுத்தப்பட்ட இறைப்பெயருக்கும் உள்ள உடைமைத் தொடர்பை நேரடியாகக் காக்கிறது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் பொதுப்பட்டப் பெயர் அல்ல, நான்கெழுத்து இறைப்பெயரான יהוה நேரடியாக உள்ளது. “யாவே” அந்த உடன்படிக்கைப் பெயரைப் பெயராகவே வெளிப்படுத்துகிறது.
- issue: אֲרוֹן הַבְּרִית மற்றும் אֲרוֹן יְהוָה ஆகிய இரு குறிப்புகளின் வேறுபாடு
  choice: “உடன்படிக்கைப் பெட்டி” என்றும் பின்னர் “யாவேயின் பெட்டி” என்றும் தனித்தனியாக மொழிபெயர்த்தல்
  alternative: இரண்டையும் “உடன்படிக்கைப் பெட்டி” என்று ஒரேமாதிரி மொழிபெயர்த்தல்
  rationale: ஒரே பொருளைக் குறிப்பிட்டாலும் எபிரெய உரை பயன்படுத்தும் இரு வேறுபட்ட தொடர்புச் சொற்றொடர்களைத் தக்கவைக்கிறது; அவற்றை அமைதியாக ஒன்றாக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. கட்டளையும் அதனைத் தொடரும் அறிவுறுத்தலும் தனித்தனி வாக்கியங்களாக அமைக்கப்பட்டுள்ளன; மூலத்தில் காணப்படும் “உடன்படிக்கைப் பெட்டி” / “யாவேயின் பெட்டி” வேறுபாடு பாதுகாக்கப்பட்டுள்ளது.
