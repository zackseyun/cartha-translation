base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/019.yaml
  text: But all the silver and gold[a], and the vessels of bronze and iron, are holy to Yahweh[b]; they shall go into the treasury of Yahweh.
translation:
  language: ta
  text: ஆனால் வெள்ளியும் தங்கமும், வெண்கலப் பொருட்களும் இரும்புப் பொருட்களும் யாவேக்குப் பரிசுத்தமானவை[a]; அவை யாவேவின் கருவூலத்திற்குள் செல்ல வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் “பரிசுத்தமானது” என்றும் “செல்லும்” என்றும் ஒருமையில் உள்ளன; பட்டியலிடப்பட்ட உலோகங்களையும் பொருட்களையும் ஒரே கூட்டுத்தொகுதியாக அது கருதுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כֹל
  choice: ஆனால் ... அனைத்தும்
  rationale: וְ இங்கு முந்தைய வசனத்தின் தடைக்கு எதிர்மாறான விதிவிலக்கைத் தொடர்வதால், நவீன தமிழில் ‘ஆனால்’ இயல்பாக உள்ளது; כֹל என்பதன் முழுமை ‘அனைத்தும்’ எனப் பாதுகாக்கப்படுகிறது.
- source_word: כֶּסֶף וְ/זָהָב
  choice: வெள்ளி, தங்கம்
  rationale: இவை பணத்தைக் குறிக்காமல், தொடர்ந்து வரும் உலோகப் பட்டியலில் உலோகங்களையே குறிக்கின்றன.
- source_word: וּ/כְלֵי נְחֹשֶׁת וּ/בַרְזֶל
  choice: வெண்கலத்தாலும் இரும்பாலும் செய்யப்பட்ட பொருட்கள்
  rationale: כְּלִי என்பது பாத்திரங்கள் மட்டுமல்லாமல் பலவகைப் பொருட்களையும் குறிக்கலாம். உலோகப் பொருட்கள் என்ற பரந்த பொருளை இயல்பான தமிழில் இது தருகிறது; נְחֹשֶׁת இச்சூழலில் ‘வெண்கலம்’ என மொழிபெயர்க்கப்படுகிறது.
- source_word: קֹדֶשׁ הוּא לַ/יהוָה
  choice: யெகோவாவுக்குப் பரிசுத்தமானவை
  rationale: ‘பரிசுத்தம்’ என்ற அர்ப்பணிப்பு சார்ந்த சொல்லைத் தக்கவைக்கிறது. எபிரெய ஒருமை, பட்டியலிடப்பட்ட அனைத்தையும் ஒரு கூட்டுத்தொகுதியாகக் கருதுகிறது; தமிழில் இயல்பான பன்மை பயன்படுத்தப்பட்டுள்ளது.
- source_word: אוֹצַר יְהוָה
  choice: யெகோவாவின் கருவூலம்
  rationale: אוֹצָר என்பது மதிப்புள்ள உலோகங்கள் சேர்க்கப்படும் கருவூலம் அல்லது களஞ்சியத்தைக் குறிக்கிறது; இச்சூழலில் ‘கருவூலம்’ துல்லியமானது.
- source_word: יָבֽוֹא
  choice: செல்ல வேண்டும்
  rationale: எபிரெய வினை வடிவத்தின் கட்டளையுணர்வுள்ள எதிர்காலப் பொருளை இயல்பான தமிழில் தருகிறது; ‘கொண்டுவரப்பட வேண்டும்’ என்ற உரையில் இல்லாத செயப்பாட்டு விளக்கத்தைச் சேர்க்கவில்லை.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரின் மொழியாக்கம்
  choice: யெகோவா
  alternative: யாவே / கர்த்தர்
  rationale: மூலத்தில் உள்ள தனிப்பட்ட உடன்படிக்கைப் பெயரை பொதுப்பட்டமான ‘கர்த்தர்’ என்று மாற்றாமல் பெயராகவே வழங்குகிறது. ‘யெகோவா’ என்பது நவீன தமிழ் வேதாகம வாசகர்களிடையே புரிந்துகொள்ளத்தக்க நிலைபெற்ற வடிவம்; எபிரெய உச்சரிப்பை அணுகும் ‘யாவே’ என்பதும் மாற்றாகும்.
- issue: קֹדֶשׁ הוּא என்ற ஒருமைக் கூட்டுப்பொருள்
  choice: பரிசுத்தமானவை
  alternative: அது பரிசுத்தமானது
  rationale: மூலம் பட்டியலை ஒரே கூட்டுத்தொகுதியாகக் கொண்டு ஒருமையைப் பயன்படுத்துகிறது. தமிழில் பட்டியலின் கூறுகளுடன் பன்மை இயல்பாக இருப்பதால் முதன்மை உரையில் பன்மை வைக்கப்பட்டு, மூலத்தின் ஒருமை அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘பரிசுத்தம்’, ‘கருவூலம்’ ஆகியவை சூழலுக்கேற்ற வேதாகமத் தன்மையைப் பாதுகாக்கின்றன; பரந்த பொருளுடைய כְּלִי என்பதற்கு குறுகிய ‘பாத்திரங்கள்’ என்பதற்குப் பதில் ‘பொருட்கள்’ பயன்படுத்தப்பட்டுள்ளது.
