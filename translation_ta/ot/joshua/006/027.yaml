  text: And Yahweh was with Joshua[a], and his fame was in all the land.
translation:
  language: ta
  text: யாவே யோசுவாவோடு இருந்தார். யோசுவாவின் புகழ் நாடெங்கும் பரவியது.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைவனின் தனிப்பெயரான நான்கெழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் இயல்பான ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: וַיְהִי
  choice: இருந்தார்
  rationale: இங்கு היה என்பது கதைநடையில் எளிய இறந்தகால இணைப்புவினையாக உள்ளது; யாவேயின் உடனிருப்பைக் குறிக்க மரியாதைப் பன்மையுடன் மொழிபெயர்க்கப்பட்டது.
- source_word: אֶת יְהוֹשֻׁעַ
  choice: யோசுவாவோடு
  rationale: היה உடன் வரும் אֶת, ஒருவரோடு இருப்பதையும் துணைநிற்பதையும் குறிக்கிறது; பெயர் வழக்கமான தமிழ் வேதாகம வடிவில் தரப்பட்டது.
- source_word: שָׁמְעוֹ
  choice: அவரைப் பற்றிய புகழ்
  rationale: இந்தச் சொல் செய்தி, அறிக்கை, நற்பெயர் அல்லது புகழ் எனப் பொருள்படலாம். எரிகோ வெற்றிக்குப் பிந்தைய சூழலில் யோசுவாவின் பரவலான புகழ் முதன்மையாகத் தோன்றினாலும், 'அவரைப் பற்றிய' என்பது மூலத்தின் செய்தி/அறிக்கை என்ற நுணுக்கத்தையும் ஓரளவு காக்கிறது.
- source_word: בְּכָל הָאָרֶץ
  choice: நாடெங்கும்
  rationale: இங்கு הָאָרֶץ என்பது முழு உலகத்தையல்ல, கதை பேசும் நாட்டைக் குறிக்கிறது. 'நாடெங்கும்' என்பது இயல்பாகவும் சுருக்கமாகவும் முழுப் பரப்பையும் தெரிவிக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: யெகோவா; கர்த்தர்
  rationale: தனிப்பெயரை ஒரு பொதுப்பட்டத்தால் மாற்றாமல் பாதுகாக்கிறது; மூல எபிரெய வடிவுக்கு நெருக்கமான, நவீன தமிழ் ஒலிபெயர்ப்பைப் பயன்படுத்துகிறது.
- issue: யாவே யோசுவாவோடு இருந்தார் என்பதன் பொருள்
  choice: உடனிருப்பை நேரடியாகக் கூறுதல்
  alternative: யாவே யோசுவாவுக்கு உதவினார்
  rationale: மூலம் உதவியைக் குறிப்பதாக இருக்கலாம்; எனினும் அது நேரடியாக 'உடன் இருந்தார்' என்றே கூறுவதால், இறையியல் பரப்பைச் சுருக்காமல் அந்த வடிவம் காக்கப்பட்டது.
translation_notes:
  register: நவீன நிலையான தமிழில், கண்ணியமான எளிய கதைநடை பயன்படுத்தப்பட்டது. இரண்டாவது வாக்கியத்தில் எபிரெயத்தின் நிலைச்சொற்றொடர் தமிழில் இயல்பாக இருக்க ‘பரவியது’ என வெளிப்படுத்தப்பட்டது; பொருள் மாற்றப்படவில்லை.
