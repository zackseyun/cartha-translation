base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/010.yaml
  text: And Joshua commanded the people[a], saying, “Do not shout, and do not let your voice be heard, and do not let a word go out from your mouth until the day I say to you[b], ‘Shout!’ Then you shall shout.”
translation:
  language: ta
  text: 'யோசுவா மக்களுக்குக் கட்டளையிட்டுச் சொன்னார்: “நீங்கள் முழக்கமிடாதீர்கள்[a]; உங்கள் குரலைக் கேட்கச் செய்யாதீர்கள்; ‘முழக்கமிடுங்கள்!’ என்று நான் உங்களிடம் சொல்லும் நாள்வரை, உங்கள் வாயிலிருந்து ஒரு சொல்லும் வெளிவரக் கூடாது[b]. அப்போது நீங்கள் முழக்கமிட வேண்டும்.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இச்சொல் இச்சூழலில் குறிப்பாக, ‘போர்முழக்கம் எழுப்பாதீர்கள்’ என்றும் பொருள்படலாம்.
    reason: lexical_alternative
  - marker: b
    text: இதனை இயல்பாக, ‘ஒரு சொல்லும் பேசக் கூடாது’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: צִוָּה
  choice: கட்டளையிட்டார்
  rationale: இச்சொல் வெறும் அறிவுறுத்தலைவிட அதிகாரப்பூர்வமான கட்டளையைக் குறிக்கிறது.
- source_word: הָעָם
  choice: மக்கள்
  rationale: சூழல் படை நடவடிக்கையைப் பற்றியதாக இருந்தாலும், எபிரெயச் சொல் பொதுவாக ‘மக்கள்’ என்பதையே குறிக்கிறது; அதைக் குறிப்பாக ‘படைவீரர்கள்’ என்று மாற்றவில்லை.
- source_word: לֹא תָרִיעוּ / הָרִיעוּ / וַהֲרִיעֹתֶם
  choice: முழக்கமிடாதீர்கள் / முழக்கமிடுங்கள் / முழக்கமிட வேண்டும்
  rationale: רוע என்பதன் ஹிஃபில் வடிவம் உரத்த முழக்கத்தை, பல நேரங்களில் போர்முழக்கத்தை அல்லது வெற்றிமுழக்கத்தை, குறிக்கலாம். ஒரே தமிழ் வேர்ச்சொல்லைத் திரும்பப் பயன்படுத்துவது மூலத்தின் சொல் தொடர்பைப் பாதுகாக்கிறது.
- source_word: וְלֹא תַשְׁמִיעוּ אֶת קוֹלְכֶם
  choice: உங்கள் குரல் கேட்கவும் கூடாது
  rationale: ‘உங்கள் குரலைக் கேட்கச் செய்யாதீர்கள்’ என்ற காரணவினை அமைப்பின் பொருளை இயல்பான நவீன தமிழில் வழங்குகிறது.
- source_word: וְלֹא יֵצֵא מִפִּיכֶם דָּבָר
  choice: உங்கள் வாயிலிருந்து ஒரு சொல்லும் வெளிவரக் கூடாது
  rationale: ‘வாயிலிருந்து சொல் வெளிவருதல்’ என்ற எபிரெய உருவகத்தையும் ஒருமை வடிவத்தையும் வாசிக்கத்தக்க தமிழில் பாதுகாக்கிறது.
- source_word: עַד יוֹם אָמְרִי אֲלֵיכֶם
  choice: நான் உங்களிடம் சொல்லும் நாள்வரை
  rationale: எபிரெயத்தின் காலத்தைக் குறிக்கும் அமைப்பையும் ‘நாள்’ என்ற தெளிவான சொல்லையும் காக்கிறது.
- source_word: וַהֲרִיעֹתֶם
  choice: அப்போது நீங்கள் முழக்கமிட வேண்டும்
  rationale: மேற்கோள் கட்டளைக்குப் பின் வரும் விளைவையும் வரிசையையும் ‘அப்போது’ தெளிவாக்குகிறது; ‘வேண்டும்’ கட்டளையின் வலிமையைத் தக்கவைக்கிறது.
