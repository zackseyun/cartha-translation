translation_notes:
  register: நவீனத் தரத் தமிழில், அதிகாரமுள்ள ஆனால் எளிதில் புரியும் கட்டளை நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. மூலத்தின் மூன்று அடுக்குத் தடை—முழக்கமிடாமை, குரல் கேட்காமை, ஒரு சொல்லும் வாயிலிருந்து வெளிவராமை—தனித்தனியாகப் பாதுகாக்கப்பட்டுள்ளது. ‘அப்படியே இருங்கள்’ என்பது நீளமான தமிழ் வாக்கியத்தில் தடைகளின் காலவரம்பை இயல்பாக இணைக்க உதவுகிறது.
