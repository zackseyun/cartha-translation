  text: And seven priests shall carry seven ram’s-horn trumpets before the ark. On the seventh day you shall march around the city seven times[a], and the priests shall blow the trumpets.
translation:
  language: ta
  text: ஏழு ஆசாரியர்கள் பேழைக்கு முன்பாக ஏழு ஆட்டுக்கொம்பு ஊதுகருவிகளைச் சுமந்துசெல்ல வேண்டும். ஏழாம் நாளில் நீங்கள் நகரத்தை ஏழு முறை சுற்றிவர வேண்டும்; ஆசாரியர்கள் அந்த ஊதுகருவிகளை ஊத வேண்டும்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יִשְׂאוּ
  choice: சுமந்துசெல்ல வேண்டும்
  rationale: נשא என்பது இங்கு கருவிகளைத் தூக்கிச் செல்லும் செயலைக் குறிக்கிறது. ‘சுமந்துசெல்ல’ என்பது இயல்பான நவீனத் தமிழில் அந்தச் செயலைத் தெளிவாகத் தெரிவிக்கிறது.
- source_word: שׁוֹפְרוֹת הַיּוֹבְלִים
  choice: செம்மறியாட்டுக் கடாக்களின் கொம்புகளால் செய்யப்பட்ட எக்காளங்கள்
  rationale: שׁוֹפָר என்பது கொம்பினால் செய்யப்பட்ட ஊதுகருவி; இணைந்துள்ள יֹבֵל வடிவம் இங்கு கருவியின் வகையைச் சுட்டுகிறது. தமிழில் கருவியின் மூலப்பொருளையும் இசைக்கருவி என்ற செயலையும் சேர்த்துக் கூறுவது தெளிவாக உள்ளது; மூலச்சொற்றொடரின் lexical uncertainty அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: לִפְנֵי הָאָרוֹן
  choice: பேழைக்கு முன்பாக
  rationale: לִפְנֵי என்பது இடவியல் பொருளில் ‘முன்பாக’ என்பதாகும். மூலத்தில் ‘உடன்படிக்கை’ என்ற சொல் இல்லாததால் அதைச் சேர்க்காமல், அறியப்பட்ட பேழையை definite context-இல் குறிப்பிடுகிறது.
- source_word: תָּסֹבּוּ אֶת הָעִיר
  choice: நீங்கள் நகரத்தைச் சுற்றிவர வேண்டும்
  rationale: סבב என்பது சுற்றிச் செல்லுதல் அல்லது வலம் வருதல். இராணுவமும் சடங்கும் கலந்த இச்சூழலில் ‘சுற்றிவர’ என்பது மிகைப்படுத்தாமல் இயல்பாகக் கட்டளையைத் தெரிவிக்கிறது.
- source_word: שֶׁבַע פְּעָמִים
  choice: ஏழு முறை
  rationale: மீண்டும் செய்யப்படும் செயலுடன் פְּעָמִים என்பதற்கு இயல்பான தமிழ் இணை ‘முறை’ ஆகும்.
- source_word: יִתְקְעוּ בַּשּׁוֹפָרוֹת
  choice: எக்காளங்களை ஊத வேண்டும்
  rationale: תקע + שׁוֹפָר என்பது கொம்புக் கருவியை ஊதுவதற்கான வழக்கமான எபிரெயச் சொற்றொடர். முன்னரே கருவியின் வகை முழுமையாகக் குறிப்பிடப்பட்டதால் இங்கு சுருக்கமாக ‘எக்காளங்கள்’ என்று மீண்டும் கூறப்படுகிறது.
