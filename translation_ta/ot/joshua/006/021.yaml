source:
  edition: WLC
  text: וַֽ/יַּחֲרִ֨ימוּ֙ אֶת כָּל אֲשֶׁ֣ר בָּ/עִ֔יר מֵ/אִישׁ֙ וְ/עַד אִשָּׁ֔ה מִ/נַּ֖עַר וְ/עַד זָקֵ֑ן וְ/עַ֨ד שׁ֥וֹר וָ/שֶׂ֛ה וַ/חֲמ֖וֹר לְ/פִי חָֽרֶב־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/021.yaml
  text: And they devoted to destruction everything that was in the city[a], from man to woman, from young to old, and even ox and sheep and donkey, by the edge of the sword.
translation:
  language: ta
  text: அவர்கள் நகரத்தில் இருந்த அனைத்தையும்—ஆண் முதல் பெண் வரை, இளையவர் முதல் முதியவர் வரை, எருது, செம்மறியாடு, கழுதை வரை—அழிவுக்கென்று அர்ப்பணித்து, வாளால் கொன்றார்கள்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “முற்றிலும் அழித்தார்கள்,” அல்லது “தடைக்கு உட்படுத்தினார்கள்.” இங்குள்ள எபிரெய வினைச்சொல், ஒன்றை மீட்க முடியாதபடி அழிவுக்கென ஒதுக்குவதைக் குறிக்கிறது (ஹேரேம்).
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּחֲרִימוּ
  choice: அழிவுக்கென்று அர்ப்பணித்தார்கள்
  rationale: חרם என்பதன் ஹிப்இல் வடிவம், சாதாரணமாகக் கொல்வதை மட்டும் அல்லாமல், ஒன்றை மீட்க முடியாதபடி தடைக்குள் வைத்து அழிவுக்கு ஒதுக்குவதைக் குறிக்கிறது. இந்த மொழிபெயர்ப்பு அந்தத் தொழில்நுட்பப் பொருளையும் செயலின் கடுமையையும் தக்கவைக்கிறது.
- source_word: כָּל אֲשֶׁר בָּעִיר
  choice: நகரத்தில் இருந்த அனைத்தையும்
  rationale: பின்னர் விவரிக்கப்படும் மக்கள் மற்றும் விலங்குகள் அனைத்தையும் உள்ளடக்கும் முழுமையான சொற்றொடர்.
- source_word: מֵאִישׁ וְעַד אִשָּׁה
  choice: ஆண் முதல் பெண் வரை
  rationale: இருபாலரையும் உள்ளடக்கும் எபிரெய வரம்புச் சொற்றொடரை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: מִנַּעַר וְעַד זָקֵן
  choice: இளையவர் முதல் முதியவர் வரை
  rationale: எல்லா வயதினரையும் குறிக்கும் வயது-வரம்புச் சொற்றொடரின் உள்ளடக்கத் தன்மையைப் பாதுகாக்கிறது.
- source_word: וְעַד שׁוֹר וָשֶׂה וַחֲמוֹר
  choice: மாடுகள், செம்மறியாடுகள், கழுதைகள் உட்பட
  rationale: மனிதர்களிலிருந்து கால்நடைகள் வரையிலான உள்ளடக்க வரம்பை இயல்பான தமிழில் தெரிவிக்கிறது; எபிரெய ஒருமை பெயர்கள் இங்கு இனங்களைக் கூட்டாகக் குறிக்கின்றன.
- source_word: לְפִי חָרֶב
  choice: வாளின் முனையால் கொன்றார்கள்
  rationale: சொல்லுக்குச் சொல் 'வாளின் வாயால்' என்ற எபிரெய உருவகம் தமிழில் இயல்பற்றது. வாளைக் கொண்டு கொன்றனர் என்ற நிலையான பொருளையும் வாளின் கூர்முனை உருவகத்தையும் இந்த வாசகம் தெளிவாகத் தருகிறது.
theological_decisions:
- issue: போர்த் தீர்ப்புச் சூழலில் חרם என்ற தொழில்நுட்பச் சொல்லின் மொழிபெயர்ப்பு
  choice: அழிவுக்கென்று அர்ப்பணித்தார்கள்
  alternative: முற்றிலும் அழித்தார்கள்; தடைக்குள் வைத்தார்கள்
  rationale: இந்த வினை வெறும் அழித்தலைவிட, மீட்க முடியாதபடி அழிவுக்கு ஒதுக்கப்பட்டதைக் குறிக்கிறது. முதன்மை வாசகம் அதன் உடன்படிக்கை/தீர்ப்புச் சார்ந்த பதற்றத்தைக் குறைக்காமலும் கூடுதல் கோட்பாட்டு விளக்கத்தைச் சேர்க்காமலும் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. חרם என்பதன் தொழில்நுட்பப் பொருளைத் தக்கவைக்க முதன்மை வாக்கியத்தில் ‘அழிவுக்கென்று அர்ப்பணித்தார்கள்’ என்றும், நிகழ்ந்த செயலைத் தெளிவுபடுத்த அடுத்த வாக்கியத்தில் ‘வாளின் முனையால் கொன்றார்கள்’ என்றும் வழங்கப்பட்டுள்ளது.
