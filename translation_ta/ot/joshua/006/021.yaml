revisions:
- from: நகரத்தில் இருந்த அனைத்தையும் அவர்கள் அழிவுக்கென்று அர்ப்பணித்தார்கள்[a]. ஆண் முதல் பெண் வரை, இளையவர் முதல் முதியவர் வரை, மாடுகள், செம்மறியாடுகள், கழுதைகள் உட்பட அனைத்தையும் வாளின் முனையால் கொன்றார்கள்.
  to: அவர்கள் நகரத்தில் இருந்த அனைத்தையும்—ஆண் முதல் பெண் வரை, இளையவர் முதல் முதியவர் வரை, எருது, செம்மறியாடு, கழுதை வரை—அழிவுக்கென்று அர்ப்பணித்து, வாளால் கொன்றார்கள்[a].
  rationale: திருத்தம் חֵרֶם-இன் தொழில்நுட்பப் பொருளை முதன்மை வாசகத்திலும் அடிக்குறிப்பிலும் பாதுகாக்கிறது; அதேவேளையில், அழிவுக்கென அர்ப்பணித்தலும் வாளால் கொல்லுதலும் மூலத்தின் ஒரே செயல்விவரமாக அமையச் செய்கிறது. மனிதர், வயது, மற்றும் கால்நடை வரம்புகள் அனைத்தும் மூலத்தின் வரிசையிலும் உள்ளடக்கத்திலும் காக்கப்பட்டுள்ளன.
