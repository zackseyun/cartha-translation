  text: וְ/הָ/עִ֛יר שָׂרְפ֥וּ בָ/אֵ֖שׁ וְ/כָל אֲשֶׁר בָּ֑/הּ רַ֣ק הַ/כֶּ֣סֶף וְ/הַ/זָּהָ֗ב וּ/כְלֵ֤י הַ/נְּחֹ֨שֶׁת֙ וְ/הַ/בַּרְזֶ֔ל נָתְנ֖וּ אוֹצַ֥ר בֵּית יְהוָֽה־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/024.yaml
  text: And they burned the city with fire[a], and everything that was in it. Only the silver and the gold, and the articles of bronze and iron, they put into the treasury of the house of Yahweh.
translation:
  language: ta
  text: அவர்கள் நகரத்தையும் அதிலிருந்த எல்லாவற்றையும் நெருப்பால் எரித்தார்கள். வெள்ளியையும் பொன்னையும் வெண்கல மற்றும் இரும்புப் பொருட்களையும் மட்டும் யாவேயின் இல்லத்தின் கருவூலத்தில் வைத்தார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שָׂרְפוּ בָאֵשׁ
  choice: நெருப்பால் எரித்தார்கள்
  rationale: שָׂרְפוּ என்பது செய்பாட்டு பன்மை வினை; בָאֵשׁ இங்கு எரிப்பதற்கான சாதனத்தைச் சுட்டுகிறது. ஆகவே இயல்பான தமிழில் ‘நெருப்பால் எரித்தார்கள்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: וְכָל אֲשֶׁר בָּהּ
  choice: அதிலிருந்த எல்லாவற்றையும்
  rationale: நகருக்குள் இருந்தவற்றின் முழுமையையும் குறிக்கும் எபிரெயத் தொடரைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: רַק
  choice: மட்டும்
  rationale: முன்னர் கூறப்பட்ட முழுமையான அழிவிலிருந்து உலோகப் பொருட்களை விதிவிலக்காக்கும் சொல்லாக இங்கு வருகிறது; தமிழில் ‘மட்டும்’ அந்த விதிவிலக்கைத் தெளிவாகக் காட்டுகிறது.
- source_word: הַכֶּסֶף וְהַזָּהָב
  choice: வெள்ளி, பொன்
  rationale: பட்டியல் நடையில் இயல்பான நவீனத் தமிழை அளிக்கிறது; எபிரெயத்தில் உள்ள இரு உலோகங்களும் அப்படியே பாதுகாக்கப்படுகின்றன.
- source_word: וּכְלֵי הַנְּחֹשֶׁת וְהַבַּרְזֶל
  choice: வெண்கலம் மற்றும் இரும்பினாலான பொருட்கள்
  rationale: כְּלֵי என்பது பாத்திரங்கள், கருவிகள், பயன்பாட்டுப் பொருட்கள் எனப் பரந்த பொருளுடையது; ‘பொருட்கள்’ அந்தப் பரப்பைத் தேவையின்றி குறுக்காமல் காக்கிறது. נְחֹשֶׁת இச்சூழலில் பொதுவாக ‘வெண்கலம்’ என வழங்கப்படுகிறது.
- source_word: נָתְנוּ
  choice: வைத்தார்கள்
  rationale: கருவூலத்தில் மதிப்புள்ள பொருட்களைச் சேர்த்து வைப்பதைக் குறிக்கும் சூழலில் נתן என்பதற்கு ‘வைத்தார்கள்’ இயல்பானதும் துல்லியமானதும் ஆகும்.
- source_word: אוֹצַר בֵּית יְהוָה
  choice: யாவேயின் இல்லத்துக் கருவூலம்
  rationale: אוֹצַר என்பது மதிப்புள்ள பொருட்கள் வைக்கப்படும் கருவூலத்தைக் குறிக்கிறது. בֵּית என்பதற்கு ‘இல்லம்’ என்று மொழிபெயர்ப்பது பிற்கால ஆலயக் கட்டடத்தை முன்கூட்டியே உரையில் புகுத்தாமல் காக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரை வழங்குதல்
  choice: யாவே
  alternative: ஆண்டவர்; யெகோவா
  rationale: மூல உரையில் நான்கெழுத்துத் தெய்வீகப் பெயர் நேரடியாக உள்ளது. ‘யாவே’ என்பது அதை ஒரு பொதுப் பட்டமாக மாற்றாமல், உடன்படிக்கைப் பெயராகத் தமிழில் ஒலிபெயர்க்கிறது.
- issue: உலோகங்கள் சேர்க்கப்பட்ட வழிபாட்டுச் சார்ந்த இடம்
  choice: யாவேயின் இல்லத்துக் கருவூலத்தில்
  alternative: யாவேயின் இல்லத்துக்குச் சொந்தமான கருவூலத்தில்
  rationale: எபிரெயக் கட்டமைப்பு கருவூலத்தை யாவேயின் இல்லத்துடன் இணைக்கிறது. பிரதான மொழிபெயர்ப்பு அந்த உறவைப் பாதுகாக்கிறது; பொருட்கள் எவ்வாறு பின்னர் பயன்படுத்தப்பட்டன என்பதைக் கூடுதலாக விளக்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையான, கண்ணியமான உரைநடை பயன்படுத்தப்பட்டுள்ளது. ‘ஆலயம்’ என்ற காலச்சூழலைக் குறுக்கும் சொல்லுக்குப் பதிலாக ‘இல்லம்’ பயன்படுத்தப்பட்டுள்ளது; பட்டியலின் ஓட்டம் தமிழில் இயல்பாக இருக்க வாக்கிய அமைப்பு சீரமைக்கப்பட்டுள்ளது.
