  rationale: וְסַבֹּתֶם என்பது பன்மை; הַקֵּיף மற்றும் תַעֲשֶׂה ஆகியவை ஒருமை. போரிடும் ஆண்களிடமிருந்து பொறுப்பாளரான யோசுவாவுக்கு மாறும் மூலத்தின் பதற்றத்தைத் தீர்த்துவிடாமல் தமிழிலும் வெளிப்படுத்துகிறது.
- issue: הַקֵּיף என்பதின் causative கட்டளை வலிமை
  choice: சுற்றிவரச் செய்
  alternative: சுற்றிவா / சுற்றிக்கொண்டு
  rationale: யோசுவா தானே மட்டும் சுற்ற வேண்டும் என்று பொருள்படாமல், நகரத்தைச் சுற்றும் செயலை அவர் நடத்த வேண்டும் என்ற எபிரெய வடிவத்தின் வலிமையை காக்கிறது.
