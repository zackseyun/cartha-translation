  text: You shall march around the city[a], all the men of war, circling the city once. Thus you shall do for six days.
translation:
  language: ta
  text: போரிடும் ஆண்கள் அனைவரும்[a] நகரத்தைச் சுற்றிவர வேண்டும். நகரத்தை ஒருமுறை சுற்றிவரும்படி செய். ஆறு நாட்கள் இவ்வாறே செய்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயில் சொல்லர்த்தமாக, ‘போரின் ஆண்கள்’; ‘போர்வீரர்கள் அனைவரும்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְסַבֹּתֶם
  choice: சுற்றிவர வேண்டும்
  rationale: סבב என்பதன் அடிப்படைப் பொருளான நகரத்தைச் சுற்றிச் செல்லுதலை இயல்பான நவீனத் தமிழில் தருகிறது. இது இரண்டாம் நபர் ஆண்பால் பன்மை வடிவம் என்பதால், போரிடும் ஆண்களுக்கான அறிவுறுத்தலாகப் பன்மையில் வைக்கப்பட்டுள்ளது.
- source_word: הָעִיר
  choice: நகரத்தை
  rationale: எபிரெய மூலத்தில் எரிகோ என்ற பெயருக்குப் பதிலாக பொதுப்பெயரே இருப்பதால், அதையே தக்கவைக்கிறது.
- source_word: כֹּל אַנְשֵׁי הַמִּלְחָמָה
  choice: போரிடும் ஆண்கள் அனைவரும்
  rationale: சொல்லர்த்தமாக ‘போரின் ஆண்கள்’ என வரும் ஆண்பால் இராணுவக் குறிப்பைத் தெளிவாகவும் இயல்பாகவும் காக்கிறது.
- source_word: הַקֵּיף
  choice: சுற்றிவரச் செய்
  rationale: இது இரண்டாம் நபர் ஆண்பால் ஒருமை கட்டளை வடிவம்; யோசுவா ஆட்களை நகரத்தைச் சுற்றச் செய்ய வேண்டிய பொறுப்பை வெளிப்படுத்தும் causative வலிமையைப் பாதுகாக்கிறது.
- source_word: פַּעַם אֶחָת
  choice: ஒருமுறை
  rationale: ஒரே தடவை நிகழும் செயலைத் தமிழில் இயல்பாகத் தெரிவிக்கிறது.
- source_word: כֹּה תַעֲשֶׂה
  choice: இவ்வாறே செய்
  rationale: כֹּה குறிக்கும் நிர்ணயிக்கப்பட்ட முறையையும், תַעֲשֶׂה என்பதிலுள்ள யோசுவாவை நோக்கிய ஒருமை அறிவுறுத்தலையும் காக்கிறது.
- source_word: שֵׁשֶׁת יָמִים
  choice: ஆறு நாட்களும்
  rationale: ஒவ்வொரு நாளும் இதே செயல் மீளச் செய்யப்பட வேண்டும் என்ற காலநீட்சி மற்றும் தொடர்ச்சியைச் சுருக்கமாகத் தெரிவிக்கிறது.
