  revision_rationale: மக்கள் நகருக்குள் ஏறிச் சென்றனர் என்ற பன்மைச் செயலைவும், ஒவ்வொரு ஆணும் தன் முன்னே நேராகச் சென்றான் என்ற பகிர்ந்தளிக்கும் ஆண்பால் ஒருமைச் சொல்லாட்சியையும் தெளிவாகப் பிரித்தமை மூலத்தின் இலக்கண உறவைப் பாதுகாக்கிறது. மதில் விழுந்த விதம் குறித்த எபிரெயத்தின் அசாதாரணமும் விவாதத்திற்குரியதுமான சொல்லாட்சி முதன்மை உரையிலும் அடிக்குறிப்பிலும் தக்கவைக்கப்பட்டுள்ளது; எந்த ஒரு விளக்கமும் உறுதியானதாகத் திணிக்கப்படவில்லை.
