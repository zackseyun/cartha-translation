  naturalness: ‘மதில் தனக்குக் கீழேயே விழுந்தது’ என்ற திட்டமிட்ட அசாதாரணம் மூலத்தின் கடினமான சொல்லாட்சியைப் பிரதிபலிக்கிறது; எனினும் ‘கீழேயே’ மூலத்தில் இல்லாத வலியுறுத்தலைச் சேர்க்கிறது. ‘கீழே’ போதுமானது. மக்களின் பன்மைச் செயலும் ஒவ்வொரு ஆணின் பகிர்ந்தளிக்கும் ஒருமைச் செயலும் தனித்த வாக்கியங்களாக அமைந்தால் நவீன நிலையான தமிழில் தெளிவாகவும் இயல்பாகவும் இருக்கும்.
  terminology: ‘எக்காளம்’ வாசகர்களுக்குப் பரிச்சயமான வேதாகம வழக்கு; ஷோஃபார் கொம்புவகை ஊதுகருவி என்பதைக் குறிப்பு சரியாக விளக்க வேண்டும். ‘ஆட்டுக்கடாவின் கொம்பு’ என்பதற்குப் பதிலாக ‘செம்மறியாட்டுக் கொம்பு’ என்பது ‘ram’s horn’ என்பதற்கு மிகத் துல்லியமான தமிழ். ‘பேராரவாரம் செய்தார்கள்’ உரத்த பெரிய முழக்கத்திற்குப் பொருத்தமானது.
