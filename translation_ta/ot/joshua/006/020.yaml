source:
  edition: WLC
  text: וַ/יָּ֣רַע הָ/עָ֔ם וַֽ/יִּתְקְע֖וּ בַּ/שֹּֽׁפָר֑וֹת וַ/יְהִי֩ כִ/שְׁמֹ֨עַ הָ/עָ֜ם אֶת ק֣וֹל הַ/שּׁוֹפָ֗ר וַ/יָּרִ֤יעוּ הָ/עָם֙ תְּרוּעָ֣ה גְדוֹלָ֔ה וַ/תִּפֹּ֨ל הַֽ/חוֹמָ֜ה תַּחְתֶּ֗י/הָ וַ/יַּ֨עַל הָ/עָ֤ם הָ/עִ֨ירָ/ה֙ אִ֣ישׁ נֶגְדּ֔/וֹ וַֽ/יִּלְכְּד֖וּ אֶת הָ/עִֽיר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/020.yaml
  text: So the people shouted[a], and they blew the trumpets. And when the people heard the sound of the trumpet, the people shouted a great shout, and the wall fell down beneath it, and the people went up into the city, each man straight before him[b], and they captured the city.
translation:
  language: ta
  text: மக்கள் ஆர்ப்பரித்தார்கள்; அவர்கள் எக்காளங்களை[a] ஊதினார்கள். மக்கள் எக்காளத்தின் ஓசையைக் கேட்டதும், அவர்கள் பேராரவாரம் செய்தார்கள்; மதில் தனக்குக் கீழே விழுந்தது[b]. மக்கள் நகரத்துக்குள் ஏறிச் சென்றார்கள். ஒவ்வொரு ஆணும் நேராகத் தன் முன்னே சென்றான்; அவர்கள் நகரத்தைக் கைப்பற்றினார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘எக்காளம்’ என்று மொழிபெயர்க்கப்பட்ட எபிரெயச் சொல் ஷோஃபார்; இது சைகை கொடுக்க ஊதப்பட்ட கொம்புவகைக் கருவி. ‘செம்மறியாட்டுக் கொம்பு’ என்றும் மொழிபெயர்க்கலாம்.
    reason: cultural_note
  - marker: b
    text: இதனை, ‘மதில் இருந்த இடத்திலேயே நேராகச் சரிந்து விழுந்தது’ என்றும் மொழிபெயர்க்கலாம். எபிரெயத்தில் எழுத்துப்படி, ‘மதில் தனக்குக் கீழே விழுந்தது’ என்ற வழக்கத்திற்கு மாறான தொடர் உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּרַע / וַיָּרִיעוּ / תְּרוּעָה
  choice: ஆர்ப்பரித்தார்கள் / பேராரவாரம் செய்தார்கள்
  rationale: இந்த வேர் மற்றும் பெயர்ச்சொல் போர்ச் சூழலிலும் வழிபாட்டுச் சூழலிலும் எழுப்பப்படும் உரத்த முழக்கத்தைக் குறிக்கலாம். ‘ஆர்ப்பரித்தார்கள்’ அடிப்படைச் செயலை இயல்பாகத் தருகிறது; ‘பேராரவாரம் செய்தார்கள்’ இரண்டாவது வலியுறுத்தப்பட்ட சொல்லாட்சியைப் பாதுகாக்கிறது; ‘போர்முழக்கம்’ என்று சூழலை அளவுக்கு மீறிக் குறிப்பதில்லை.
- source_word: שׁוֹפָרוֹת / שׁוֹפָר
  choice: எக்காளங்கள் / எக்காளம்
  rationale: שׁוֹפָר என்பது அறிகுறி கொடுக்க ஊதப்பட்ட கொம்புவகைக் கருவி. ‘எக்காளம்’ தமிழில் புரிந்துகொள்ளக்கூடிய வழக்கமான வேதாகமச் சொல்; அது உலோகக் கருவி எனத் தவறாகப் புரிந்துகொள்ளப்படாதபடி மூலக் கருவின் தன்மை அடிக்குறிப்பில் விளக்கப்படுகிறது.
- source_word: קוֹל הַשּׁוֹפָר
  choice: எக்காளத்தின் ஓசை
  rationale: קוֹל என்பதன் அடிப்படைப் பொருள் ‘குரல்/ஓசை’. இசைக்கருவியுடன் ‘ஓசை’ என்பது இயல்பான தமிழ்; ‘முழக்கம்’ என்பதைக் காட்டிலும் குறைவாக விளக்கமளிக்கும் நேரடியான தேர்வு.
- source_word: וַתִּפֹּל הַחוֹמָה תַּחְתֶּיהָ
  choice: மதில் தனக்குக் கீழேயே விழுந்தது
  rationale: תַּחְתֶּיהָ என்ற கடினமான, வழக்கத்திற்கு மாறான எபிரெயச் சொல்லாட்சியைத் தீர்த்துவிடாமல் ‘தனக்குக் கீழேயே’ என்று பிரதிபலிக்கிறது. இருந்த இடத்திலேயே நேராகச் சரிந்தது என்ற சாத்தியமான பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: וַיַּעַל ... הָעִירָה
  choice: நகரத்துக்குள் ஏறிச் சென்றான்
  rationale: עלה என்பது ‘ஏறிச் செல்’ என்றும், עִירָה-விலுள்ள திசைச் சுட்டு நகரத்தை நோக்கிய இயக்கத்தையும் சூழலில் நகருக்குள் நுழைவதையும் குறிக்கிறது. ‘பாய்ந்து சென்றான்’ போன்ற கூடுதல் போர்ச் சித்திரம் தவிர்க்கப்படுகிறது.
- source_word: אִישׁ נֶגְדּוֹ
  choice: ஒவ்வொரு ஆணும் தனக்கு நேரே முன்னோக்கி
  rationale: אִישׁ இங்கு பகிர்ந்தளிக்கும் ஒருமை ஆண்பால் பெயர்ச்சொல்; அதனால் ‘ஒவ்வொரு ஆணும்’ என்று பாலினத் தகவல் பாதுகாக்கப்படுகிறது. נֶגְדּוֹ ஒவ்வொருவரும் தாம் இருந்த இடத்திலிருந்து நேராக முன்னேறியதைக் காட்டுகிறது.
- source_word: וַיִּלְכְּדוּ
  choice: கைப்பற்றினார்கள்
  rationale: לכד என்பது போர்ச் செய்தியில் ஒரு நகரத்தைக் கைப்பற்றுவதைக் குறிக்கும்; ‘கைப்பற்றினார்கள்’ தெளிவான, இயல்பான நவீனத் தமிழ்.
theological_decisions:
- issue: אִישׁ נֶגְדּוֹ என்ற ஆண்பால் பகிர்ந்தளிக்கும் தொடர்
  choice: ஒவ்வொரு ஆணும் தனக்கு நேரே முன்னோக்கி
  alternative: ஒவ்வொருவரும் நேராக முன்னோக்கி
  rationale: எபிரெயம் ஆண்பால் ஒருமையான אִישׁ என்பதைப் பகிர்ந்தளிக்கும் வகையில் பயன்படுத்துகிறது. அந்த இலக்கண மற்றும் கதைத் தகவலைப் பாலின நடுநிலையாக்காமல் முதன்மை உரையில் பாதுகாக்கிறது.
- issue: மதில் விழுந்த விதத்தை விவரிக்கும் தெளிவற்ற எபிரெயத் தொடர்
  choice: மதில் தனக்குக் கீழேயே விழுந்தது
  alternative: மதில் இருந்த இடத்திலேயே நேராகச் சரிந்து விழுந்தது
  rationale: எபிரெயத்தின் வழக்கத்திற்கு மாறான உருவகத்தை முதன்மை உரை பாதுகாக்கிறது; அதன் சாத்தியமான இயல்பான விளக்கம் அடிக்குறிப்பில் தரப்படுகிறது. இதனால் நிகழ்வின் விதம் தேவையின்றி உறுதிப்படுத்தப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. எபிரெயத்தின் தொடர்ச்சியான வாவ் அமைப்புகள் தமிழில் இயல்பான வாக்கியத் தொடர்புகளாக மாற்றப்பட்டாலும் நிகழ்வுகளின் வரிசை பாதுகாக்கப்பட்டுள்ளது. ‘மதில் தனக்குக் கீழேயே’ என்ற திட்டமிட்ட அசாதாரணம் மூலத்தின் உண்மையான தெளிவின்மையைத் தக்கவைக்கிறது.
