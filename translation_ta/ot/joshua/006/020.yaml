  revised_text: மக்கள் ஆர்ப்பரித்தார்கள்; அவர்கள் எக்காளங்களை[a] ஊதினார்கள். மக்கள் எக்காளத்தின் ஓசையைக் கேட்டதும், அவர்கள் பேராரவாரம் செய்தார்கள்; மதில் தனக்குக் கீழே விழுந்தது[b]. மக்கள் நகரத்துக்குள் ஏறிச் சென்றார்கள். ஒவ்வொரு ஆணும் நேராகத் தன் முன்னே சென்றான்; அவர்கள் நகரத்தைக் கைப்பற்றினார்கள்.
