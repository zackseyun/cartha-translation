  text: ו/יאמרו אֶל הָ/עָ֔ם עִבְר֖וּ וְ/סֹ֣בּוּ אֶת הָ/עִ֑יר וְ/הֶ֣/חָל֔וּץ יַעֲבֹ֕ר לִ/פְנֵ֖י אֲר֥וֹן יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/007.yaml
  text: And they said to the people[a], “Pass on and go around the city, and let the armed men pass before the ark of Yahweh.”
translation:
  language: ta
  text: அவர்கள் மக்களிடம், “முன்னே சென்று நகரத்தைச் சுற்றிவாருங்கள்; ஆயுதம் ஏந்தியவர்கள்[a] யாவேயின் பேழைக்கு முன்னால் செல்லட்டும்” என்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “முன்னணிப் படையினர்”; அதாவது, பேழைக்கு முன்னால் செல்லும் ஆயுதம் ஏந்தியவர்கள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: அவர்கள் … என்றார்கள்
  rationale: எபிரெய மூலத்தில் வினைச்சொல் பன்மையில் உள்ளது. தொடர் நிகழ்வைக் காட்டும் இணைப்பைத் தமிழின் இயல்பான உரைநடையில் தனியே மொழிபெயர்க்காமல், நிகழ்வுகளின் வரிசையால் வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: אֶל־הָעָם
  choice: மக்களிடம்
  rationale: עָם என்பதன் நேரடியான பொருள் ‘மக்கள்.’ இங்கு படைச் சூழல் இருந்தாலும், ‘படையினர்’ என்று பொருளைக் குறுக்காமல் மூலத்தின் பொதுவான சொல்லே பாதுகாக்கப்பட்டுள்ளது.
- source_word: עִבְרוּ
  choice: முன்னே சென்று
  rationale: இங்கு עבר என்பது ஆறு அல்லது எல்லையைக் கடப்பதை அல்ல, அணிவகுப்பில் முன்னோக்கிச் செல்வதைக் குறிக்கிறது.
- source_word: וְסֹבּוּ אֶת־הָעִיר
  choice: நகரத்தைச் சுற்றிவாருங்கள்
  rationale: סבב என்பதன் சுற்றிச் செல்லும் இடவியல் செயலை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது; மூலத்தில் இல்லாத தாக்குதல் சார்ந்த பொருள் சேர்க்கப்படவில்லை.
- source_word: וְהֶחָלוּץ
  choice: ஆயுதம் ஏந்தியவர்கள்
  rationale: חָלוּץ என்பது போருக்கு ஆயத்தமாக ஆயுதம் ஏந்திய குழுவைக் குறிக்கிறது. அதன் முன்னணி நிலை மாற்று வாசிப்பாக அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: יַעֲבֹר
  choice: செல்லட்டும்
  rationale: இங்கு குறை வினை கட்டளை அல்லது அறிவுறுத்தல் வலிமையுடன் பயன்படுத்தப்பட்டுள்ளது; தமிழில் ‘செல்லட்டும்’ அதனை இயல்பாகத் தருகிறது.
- source_word: לִפְנֵי אֲרוֹן יְהוָה
  choice: யாவேயின் பெட்டிக்கு முன்னால்
  rationale: לִפְנֵי என்பதன் முன்னிலைப் பொருளையும், אָרוֹן என்பதன் அடிப்படைப் பொருளான ‘பெட்டி’ என்பதையும் பாதுகாக்கிறது; இவ்வசனத்தில் இல்லாத ‘உடன்படிக்கை’ என்ற சொல்லைச் சேர்க்கவில்லை.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைத் திருப்பெயரான நான்கு எழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் வழக்கமான ஒலிபெயர்ப்பாக வழங்குகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைத் திருப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலத்தில் தனிப்பட்ட இறைத் திருப்பெயர் நேரடியாக உள்ளது. ஆகவே ஒரு பட்டத்தைப் பதிலீடு செய்யாமல் ‘யாவே’ என்று ஒலிபெயர்க்கப்பட்டுள்ளது.
- issue: אֲרוֹן என்பதற்கு ‘உடன்படிக்கை’ என்ற விளக்கத்தைச் சேர்ப்பது
  choice: பெட்டி
  alternative: உடன்படிக்கைப் பெட்டி
  rationale: இந்த வசனத்தின் எபிரெய உரையில் ‘உடன்படிக்கை’ என்ற சொல் இல்லை. பொருளை அடையாளம் காண உதவும் வழக்கமான விரிவாக்கமாக அது இருக்கலாம்; எனினும் இங்கு மூலத்தின் சுருக்கம் காக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன, தெளிவான, மரியாதைமிக்க உரைநடை பயன்படுத்தப்பட்டுள்ளது. இராணுவச் சூழலைத் தெளிவுபடுத்தினாலும், ‘மக்கள்’ போன்ற எபிரெயச் சொற்களின் பரந்த பொருள் தேவையின்றிக் குறுக்கப்படவில்லை. அடிக்குறிப்பு குறி அதற்குரிய ‘ஆயுதம் ஏந்தியவர்கள்’ என்ற தொடரிலேயே வைக்கப்பட்டுள்ளது.
