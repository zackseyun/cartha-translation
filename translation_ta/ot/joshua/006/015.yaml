base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/015.yaml
  text: And it happened on the seventh day that they rose early, at the going up of the dawn, and marched around the city in this manner seven times. Only on that day did they march around the city seven times.
translation:
  language: ta
  text: ஏழாம் நாளில், பொழுது விடியும் நேரத்தில் அவர்கள் அதிகாலையிலேயே எழுந்து, இந்த முறையின்படி நகரத்தை ஏழு முறை சுற்றி வந்தார்கள். அந்த நாளில் மட்டுமே அவர்கள் நகரத்தை ஏழு முறை சுற்றி வந்தார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כַעֲלוֹת הַשַּׁחַר
  choice: பொழுது விடியும் நேரத்தில்
  rationale: எபிரெயச் சொற்றொடரின் ‘விடியல் எழும்பும்போது’ என்ற உருவகப் பொருளை இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: כַּמִּשְׁפָּט הַזֶּה
  choice: வழக்கமான முறையில்
  rationale: இங்கு מִשְׁפָּט என்பது நீதித்தீர்ப்பை அல்ல, முன்பு நிர்ணயிக்கப்பட்ட நடைமுறை அல்லது ஒழுங்கைக் குறிக்கிறது.
- source_word: וַיָּסֹבּוּ / סָבְבוּ
  choice: சுற்றி அணிவகுத்துச் சென்றார்கள்
  rationale: வினைச்சொல்லின் அடிப்படைப் பொருளான ‘சுற்றுதல்’ என்பதையும், இந்த இராணுவ-சடங்கு சூழலில் ஒழுங்காக நகர்ந்து சென்றதையும் வெளிப்படுத்துகிறது; வெறும் தாக்குதல் அணிவகுப்பு என்ற கூடுதல் கருத்தைத் திணிக்கவில்லை.
- source_word: רַק בַּיּוֹם הַהוּא
  choice: அந்த நாளில் மட்டுமே
  rationale: רַק தரும் தனிப்படுத்தும் வலியுறுத்தலைத் தெளிவாகப் பாதுகாக்கிறது.
theological_decisions: []
translation_notes:
  register: நவீனத் தரத் தமிழில், எளிமையும் கண்ணியமும் கொண்ட வரலாற்று உரைநடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய மூலத்தின் மறுபதிப்பு வலியுறுத்தல் பாதுகாக்கப்பட்டுள்ளது.
