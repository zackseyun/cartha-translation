  text: וַ/יְהִ֗י כֶּ/אֱמֹ֣ר יְהוֹשֻׁעַ֮ אֶל הָ/עָם֒ וְ/שִׁבְעָ֣ה הַ/כֹּהֲנִ֡ים נֹשְׂאִים֩ שִׁבְעָ֨ה שׁוֹפְר֤וֹת הַ/יּֽוֹבְלִים֙ לִ/פְנֵ֣י יְהוָ֔ה עָבְר֕וּ וְ/תָקְע֖וּ בַּ/שּֽׁוֹפָר֑וֹת וַֽ/אֲרוֹן֙ בְּרִ֣ית יְהוָ֔ה הֹלֵ֖ךְ אַחֲרֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/008.yaml
  text: And it happened[a], when Joshua spoke to the people, that the seven priests carrying the seven ram's-horn trumpets before Yahweh passed on and blew the trumpets[b], and the ark of the covenant of Yahweh went behind them.
translation:
  language: ta
  text: யோசுவா மக்களிடம் பேசியபோது, ஏழு ஆட்டுக்கடாக் கொம்பினாலான எக்காளங்களை[a] ஏந்திய ஏழு ஆசாரியர்கள் யாவேக்கு முன்பாகச் சென்று, அந்த எக்காளங்களை ஊதினார்கள்; யாவேயின் உடன்படிக்கைப் பெட்டி அவர்களுக்குப் பின்னால் சென்றது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், ‘யோபேலின் ஏழு ஷோஃபார்கள்.’ இச்சூழலில் இது பெரும்பாலும் ஆட்டுக்கடாக் கொம்பு எக்காளங்களைக் குறிக்கிறது; ‘யூபிலி எக்காளங்கள்’ என்றும் மொழிபெயர்க்க வாய்ப்புண்டு, ஆனால் அது இங்கு குறைவான சாத்தியம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כֶּאֱמֹר
  choice: பேசியபோது
  rationale: எபிரெயக் கதைத் தொடரில் அடுத்த நிகழ்வை அறிமுகப்படுத்தும் வַיְהִי என்பதையும், காலப்பொருள் தரும் כֶּאֱמֹר என்பதையும் இயல்பான நவீனத் தமிழில் ஒருங்கிணைக்கிறது; தேவையற்ற தொன்மையான சொற்றொடரைத் தவிர்க்கிறது.
- source_word: הָעָם
  choice: மக்கள்
  rationale: இங்கு யோசுவா உரையாற்றிய இஸ்ரவேல் மக்களைக் குறிக்கிறது; படைவீரர்களை மட்டும் அல்ல.
- source_word: נֹשְׂאִים
  choice: ஏந்திய
  rationale: ஆசாரியர்கள் எக்காளங்களை எடுத்துச் சென்றதைத் தெளிவாகவும் மரியாதையான நடையிலும் தெரிவிக்கிறது.
- source_word: שִׁבְעָה שׁוֹפְרוֹת הַיּוֹבְלִים
  choice: ஏழு ஆட்டுக்கடாக் கொம்பு எக்காளங்கள்
  rationale: שׁוֹפָר என்பது கொம்பால் செய்யப்பட்ட ஊதுகருவி; இச்சூழலில் יוֹבֵל பெரும்பாலும் ஆட்டுக்கடாவையோ அதன் கொம்பையோ குறிக்கிறது. கருவியின் மூலப்பொருளையும் செயலையும் தமிழ் வாசகருக்குத் தெளிவாக்குகிறது.
- source_word: לִפְנֵי יְהוָה
  choice: யாவேக்கு முன்பாக
  rationale: ஊர்வலத்தில் யாவேயின் முன்னிலையில் அல்லது அவருக்கு முன்பாகச் செல்லும் இடநிலைப் படிமத்தைப் பாதுகாக்கிறது.
- source_word: עָבְרוּ
  choice: முன்னே சென்று
  rationale: இங்கு ஓர் எல்லையைக் கடப்பதைவிட ஊர்வலத்தில் தொடர்ந்து முன்னே நகர்வதைக் குறிக்கிறது.
- source_word: וְתָקְעוּ בַּשּׁוֹפָרוֹת
  choice: அந்த எக்காளங்களை ஊதினார்கள்
  rationale: תקע உடன் שׁוֹפָר வரும்போது கொம்பு எக்காளத்தை ஊதுதல் அல்லது முழங்கச் செய்தல் என்று பொருள்; இங்கு நேரடியான இயல்பான தமிழ் பயன்படுத்தப்படுகிறது.
- source_word: אֲרוֹן בְּרִית יְהוָה
  choice: யாவேயின் உடன்படிக்கைப் பெட்டி
  rationale: எபிரெயக் கூட்டுச்சொல் அமைப்பைத் தெளிவான தமிழில் வழங்கி, பெட்டி யாவேயின் உடன்படிக்கையுடன் தொடர்புடையது என்பதைப் பாதுகாக்கிறது.
- source_word: הֹלֵךְ אַחֲרֵיהֶם
  choice: அவர்களுக்குப் பின்னால் சென்றது
  rationale: ஆசாரியர்களுக்குப் பின்னால் பெட்டி நகர்ந்துகொண்டிருந்த ஊர்வல இடநிலையை நேரடியாகக் காட்டுகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் தனிப்பட்ட உடன்படிக்கைப் பெயரான நான்கெழுத்துப் பெயர் நேரடியாக உள்ளது. அதை ஒரு பட்டத்தால் மாற்றாமல், நவீனத் தமிழில் அறியப்பட்ட ஒலிபெயர்ப்பாக வழங்குகிறது.
- issue: לִפְנֵי יְהוָה என்பதன் உறவு
  choice: யாவேக்கு முன்பாக
  alternative: யாவேயின் முன்னிலையில்
  rationale: ஊர்வலத்தின் இடநிலையை முதன்மைப்படுத்துகிறது; அதே நேரத்தில் ‘அவருடைய முன்னிலையில்’ என்ற அர்த்த வாய்ப்பும் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழ்; பொதுவாசகர்களுக்குப் புரியும் dignified நடை. ஊர்வலத்தின் நகர்வைத் தெளிவாக வைத்திருக்க ‘முன்னே சென்று’ மற்றும் ‘பின்னால் சென்றது’ பயன்படுத்தப்பட்டுள்ளன. ‘ஆசாரியர்கள்,’ ‘உடன்படிக்கைப் பெட்டி’ போன்ற பரவலாக அறியப்பட்ட வேதாகமச் சொற்கள் தக்கவைக்கப்பட்டுள்ளன.
