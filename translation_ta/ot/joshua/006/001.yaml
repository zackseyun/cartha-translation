  text: וִֽ/ירִיחוֹ֙ סֹגֶ֣רֶת וּ/מְסֻגֶּ֔רֶת מִ/פְּנֵ֖י בְּנֵ֣י יִשְׂרָאֵ֑ל אֵ֥ין יוֹצֵ֖א וְ/אֵ֥ין בָּֽא׃ס
base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/001.yaml
  text: Jericho was tightly shut up because of the sons of Israel[a]; no one went out[b], and no one came in.
translation:
  language: ta
  text: எரிகோ, இஸ்ரவேல் மக்களின் காரணமாக முற்றிலும் அடைக்கப்பட்டிருந்தது[a]; யாரும் வெளியே செல்லவில்லை, யாரும் உள்ளே வரவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மொழியில், “இஸ்ரவேலின் மகன்கள்”; இது இஸ்ரவேல் மக்களைக் குறிக்கும் வழக்கமான கூட்டுப்பெயர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וִירִיחוֹ
  choice: எரிகோ
  rationale: வாவ் இணைப்பின் கதைத்தொடர் பணி தமிழில் சூழலால் இயல்பாக வெளிப்படுவதால், மூலத்தில் இல்லாத காலக் குறிப்பைச் சேர்க்காமல் இடப்பெயர் நேரடியாக வழங்கப்படுகிறது.
- source_word: סֹגֶרֶת וּמְסֻגֶּרֶת
  choice: முற்றிலும் அடைக்கப்பட்டிருந்தது
  rationale: சגר வேரின் செய்பாட்டு–செயப்பாட்டு வடிவ இணைப்பு நகரம் முழுமையாகப் பாதுகாப்பாக மூடப்பட்டிருந்ததை வலியுறுத்துகிறது; தமிழ் மொழியில் இந்த வலியுறுத்தலை இயல்பாகத் தருகிறது.
- source_word: מִפְּנֵי
  choice: காரணமாக
  rationale: இங்கு இஸ்ரவேல் மக்களின் இருப்பை முன்னிட்டு எரிகோ அடைக்கப்பட்டதற்கான காரணம் அல்லது சூழலைக் குறிக்கிறது; மூலத்தில் வெளிப்படையாக இல்லாத பய உணர்வைச் சேர்க்கவில்லை.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்கள்
  rationale: சொல்லெழுத்தாக ‘இஸ்ரவேலின் மகன்கள்’ என்றாலும், இது இஸ்ரவேல் சமூகத்தைக் குறிக்கும் வழக்கமான கூட்டுப்பெயர்; நவீன தமிழில் பாலின வரம்பின்றித் தெளிவாக ‘இஸ்ரவேல் மக்கள்’ என வழங்கப்படுகிறது.
- source_word: אֵין יוֹצֵא וְאֵין בָּא
  choice: யாரும் வெளியே செல்லவில்லை, யாரும் உள்ளே வரவில்லை
  rationale: நகரத்தின் முழுமையான முடக்கத்தைத் தெரிவிக்கும் இரட்டைச் சொற்றொடரை இயல்பான தமிழில் அதன் ஒத்த அமைப்புடன் காக்கிறது.
