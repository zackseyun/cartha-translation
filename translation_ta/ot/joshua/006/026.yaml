- from: அக்காலத்தில் யோசுவா அவர்களை ஆணையிடச் செய்து[a], “இந்த நகரமாகிய எரிகோவைத் திரும்பக் கட்டுவதற்கு எழும்புகிறவன் யாவேக்கு முன்பாகச் சபிக்கப்பட்டவன்[b]. அவன் தன் முதற்பேறானவனை இழந்து இதற்கு அடித்தளம் போடுவான்; தன் இளையவனை இழந்து இதன் வாயில்களை நிறுவுவான்[c]” என்றார்.
