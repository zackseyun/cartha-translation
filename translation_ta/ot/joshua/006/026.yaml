  rationale: The revision corrects the causative oath expression, improves idiomatic Tamil in the divine-presence and rebuilding clauses, and clarifies the explanatory footnotes. It preserves the Hebrew curse formula and the ambiguity concerning how the rebuilder loses his firstborn and youngest.
