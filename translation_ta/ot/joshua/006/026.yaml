source:
  edition: WLC
  text: וַ/יַּשְׁבַּ֣ע יְהוֹשֻׁ֔עַ בָּ/עֵ֥ת הַ/הִ֖יא לֵ/אמֹ֑ר אָר֨וּר הָ/אִ֜ישׁ לִ/פְנֵ֣י יְהוָ֗ה אֲשֶׁ֤ר יָקוּם֙ וּ/בָנָ֞ה אֶת הָ/עִ֤יר הַ/זֹּאת֙ אֶת יְרִיח֔וֹ בִּ/בְכֹר֣/וֹ יְיַסְּדֶ֔/נָּה וּ/בִ/צְעִיר֖/וֹ יַצִּ֥יב דְּלָתֶֽי/הָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/026.yaml
  text: At that time Joshua made them swear[a], saying, “Cursed before Yahweh is the man who rises up and rebuilds this city, Jericho. At the cost of his firstborn he will lay its foundation[c][b], and at the cost of his youngest he will set up its gates.”
translation:
  language: ta
  text: அக்காலத்தில் யோசுவா அவர்களை ஆணையிட்டு சத்தியம் செய்யச் செய்து, “இந்த நகரமாகிய எரிகோவை எழுந்து மீண்டும் கட்டுகிறவன் யாவேவின் முன்னிலையில் சபிக்கப்பட்டவன். அவன் தன் முதற்பேறானவனை இழந்து அதற்கு அடித்தளம் போடுவான்; தன் இளையவனை இழந்து அதன் வாயில்களை நிறுவுவான்” என்றார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּשְׁבַּע
  choice: அவர்களை ஆணையிடச் செய்து
  rationale: ஹிப்இல் வினைவடிவின் பிறவினைப் பொருளைத் தெளிவாகக் காட்டுகிறது; எபிரெயத்தில் வெளிப்படையாக இல்லாத செயப்படுபொருள் சூழலிலுள்ள மக்களைக் குறிக்கிறது.
- source_word: בָּעֵת הַהִיא
  choice: அக்காலத்தில்
  rationale: இயல்பான, சுருக்கமான காலக் குறிப்பு.
- source_word: אָרוּר הָאִישׁ לִפְנֵי יְהוָה
  choice: எழும்புகிறவன் யாவேக்கு முன்பாகச் சபிக்கப்பட்டவன்
  rationale: சாபச் சூத்திரத்தின் வலிமையையும் לִפְנֵי என்பதன் முன்னிலை/சந்நிதிப் பொருளையும் தக்கவைக்கிறது; ஆண்பால் ஒருமை இங்கு பொதுப்பொருளில் வருகிறது.
- source_word: יָקוּם וּבָנָה
  choice: திரும்பக் கட்டுவதற்கு எழும்புகிறவன்
  rationale: அழிக்கப்பட்ட நகரத்தை மீண்டும் கட்ட முனைவதைச் சூழலுக்கு ஏற்றவாறு வெளிப்படுத்துகிறது.
- source_word: הָעִיר הַזֹּאת אֶת יְרִיחוֹ
  choice: இந்த நகரமாகிய எரிகோவை
  rationale: எபிரெயத்தின் விளக்கப்பெயர் அமைப்பை இயல்பான தமிழில் தருகிறது.
- source_word: בִּבְכֹרוֹ יְיַסְּדֶנָּה
  choice: தன் முதற்பேறானவனை இழந்து இதற்கு அடித்தளம் போடுவான்
  rationale: בְּ என்பதன் விலை/இழப்பு சார்ந்த சாத்தியப் பொருளைத் தெளிவாகத் தருகிறது; மரணம் அல்லது பலியின் முறையைச் சேர்ப்பதில்லை.
- source_word: וּבִצְעִירוֹ יַצִּיב דְּלָתֶיהָ
  choice: தன் இளையவனை இழந்து இதன் வாயில்களை நிறுவுவான்
  rationale: முந்தைய இணை அமைப்பைப் பேணுகிறது; நகரச் சூழலில் דלתות என்பதை ‘வாயில்கள்’ என வழங்குகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரைப் பெயராகவே ஒலிபெயர்த்து, மூலத்தின் தனிப்பெயர் தன்மையைப் பேணுகிறது.
theological_decisions:
- issue: யோசுவாவின் அறிவிப்பின் தன்மை
  choice: யாவேக்கு முன்பாக உரைக்கப்படும் கடுமையான சாப அறிவிப்பு
  alternative: யோசுவாவின் தனிப்பட்ட விருப்பம் அல்லது வெறும் குடிமைத் தடை
  rationale: ‘யாவேக்கு முன்பாகச் சபிக்கப்பட்டவன்’ என்ற சொற்றொடர் தெய்வீக நியாயத்தீர்ப்பின் பாரத்தை வெளிப்படுத்துகிறது; அதற்கு அப்பாற்பட்ட விளக்கத்தை உரையில் சேர்க்கவில்லை.
- issue: முதற்பேறானவனும் இளையவனும் தொடர்பான சாபத்தின் பொருள்
  choice: நகரைக் கட்டும் கட்டங்களோடு தொடர்பாக அவர்களை இழக்கும் விலையைச் செலுத்துதல்
  alternative: குழந்தைப் பலி செலுத்துதல் அல்லது குறிப்பிடப்படாத பொதுவான துன்பம்
  rationale: בְּ வடிவம் இழப்பு/விலை என்ற பொருளை ஏற்கிறது; ஆனால் இழப்பின் துல்லியமான முறை வசனத்தில் கூறப்படாததால் அதை நிர்ணயிக்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. ‘முதற்பேறானவன்’, ‘அடித்தளம்’, ‘வாயில்கள்’ போன்ற சொற்கள் கட்டுமான இணைப்பையும் சாபத்தின் இலக்கியச் சமநிலையையும் பேணுகின்றன.
