source:
  edition: WLC
  text: וְ/רַק אַתֶּם֙ שִׁמְר֣וּ מִן הַ/חֵ֔רֶם פֶּֽן תַּחֲרִ֖ימוּ וּ/לְקַחְתֶּ֣ם מִן הַ/חֵ֑רֶם וְ/שַׂמְתֶּ֞ם אֶת מַחֲנֵ֤ה יִשְׂרָאֵל֙ לְ/חֵ֔רֶם וַ/עֲכַרְתֶּ֖ם אוֹתֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/018.yaml
  text: But as for you[a], keep yourselves from what is devoted to destruction, lest you yourselves become devoted to destruction and take some of what is devoted to destruction, and make the camp of Israel devoted to destruction[c][b], and bring trouble on it.
translation:
  language: ta
  text: ஆனால் நீங்கள்[a], அழிவுக்கென்று அர்ப்பணிக்கப்பட்டதிலிருந்து உங்களைக் காத்துக்கொள்ளுங்கள். இல்லையெனில், அழிவுக்கென்று அர்ப்பணிக்கப்பட்டதிலிருந்து எதையாவது எடுத்துக்கொள்வதன் மூலம் நீங்களும் அழிவுக்கென்று அர்ப்பணிக்கப்பட்டவர்களாகி[b], இஸ்ரவேலின் முகாமை அழிவுக்கென்று அர்ப்பணிக்கப்பட்டதாக ஆக்கி, அதன்மேல் துன்பத்தை வரவழைப்பீர்கள்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இங்கு வரும் எபிரெயச் சொல் חֵרֶם (ஹேரெம்), பாரம்பரியமாக ‘தடை’ அல்லது ‘சாபத்துக்குரியது’ என்று மொழிபெயர்க்கப்படுகிறது; இச்சூழலில், அழிக்கப்படுவதற்காகக் கடவுளுக்கென திரும்பப்பெற முடியாதபடி அர்ப்பணிக்கப்பட்ட மனிதர்களையோ பொருட்களையோ குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘உங்களையே அழிவுக்கென்று அர்ப்பணித்துவிடாதபடிக்கு.’
    reason: alternative_reading
  - marker: c
    text: ‘துன்பத்தை வரவழைப்பீர்கள்’ என்ற சொற்றொடர், ஆகானின் பாவமும் அது இஸ்ரவேலுக்கு ஏற்படுத்திய விளைவுகளும் பற்றிய பின்வரும் நிகழ்வை முன்னொலிக்கிறது (யோசுவா 7:1, 25).
    reason: cross_reference
lexical_decisions:
- source_word: וְרַק אַתֶּם
  choice: ஆனால் நீங்கள்
  rationale: וְרַק அறிமுகப்படுத்தும் வலுவான முரண்பாட்டையும், தனிப்பட்ட சுட்டுப்பெயரான אַתֶּם தரும் அழுத்தத்தையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: שִׁמְרוּ מִן־הַחֵרֶם
  choice: அழிவுக்கென்று அர்ப்பணிக்கப்பட்டதிலிருந்து உங்களைக் காத்துக்கொள்ளுங்கள்
  rationale: שמר מן என்பதன் ‘ஒன்றிலிருந்து தம்மைக் காத்துக்கொள்ளுதல்’ என்ற பொருளையும், חֵרֶם என்பதன் கூட்டுத் தன்மையுள்ள ஒருமையையும் காக்கிறது.
- source_word: פֶּן תַּחֲרִימוּ
  choice: இல்லையெனில் ... நீங்களும் அழிவுக்கென்று அர்ப்பணிக்கப்பட்டவர்களாகி
  rationale: פֶּן குறிக்கும் எச்சரிக்கை விளைவையும், தடைசெய்யப்பட்டதை எடுத்ததால் அதே தீர்ப்புக்குரிய நிலையைத் தாமும் அடைவார்கள் என்ற சூழல்சார் பொருளையும் தெரிவிக்கிறது.
- source_word: וּלְקַחְתֶּם מִן־הַחֵרֶם
  choice: அழிவுக்கென்று அர்ப்பணிக்கப்பட்டதிலிருந்து எதையாவது எடுத்துக்கொள்வதன் மூலம்
  rationale: எபிரெய வாக்கியத்தில் உள்ள செயலுக்கும் அதன் விளைவுக்கும் இடையிலான தொடர்பை தமிழில் தெளிவாக்குகிறது; ‘எதையாவது’ என்பது ஒரு கூட்டுமுழுவிலிருந்து எடுத்தலை இயல்பாகக் குறிக்கிறது.
- source_word: וְשַׂמְתֶּם אֶת־מַחֲנֵה יִשְׂרָאֵל לְחֵרֶם
  choice: இஸ்ரவேலின் முகாமை அழிவுக்கென்று அர்ப்பணிக்கப்பட்டதாக ஆக்கி
  rationale: שׂים + לְחֵרֶם என்பதன் விளைவுநிலையைச் சுட்டும் காரணவினைப் பொருளை நேரடியாகக் காக்கிறது.
- source_word: וַעֲכַרְתֶּם אֹתוֹ
  choice: அதன்மேல் துன்பத்தை வரவழைப்பீர்கள்
  rationale: עכר என்பதன் ‘துன்பம்/கேடு வரச் செய்தல்’ என்ற காரணவினைப் பொருளையும், אֹתוֹ இஸ்ரவேலின் முகாமைக் குறிப்பதையும் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: חֵרֶם என்ற சொல்லை நியாயத்தீர்ப்பு மற்றும் போர்ச் சூழலில் மொழிபெயர்த்தல்
  choice: அழிவுக்கென்று அர்ப்பணிக்கப்பட்டது
  alternative: தடை செய்யப்பட்ட பொருள்; சாபத்துக்குரியது; முற்றிலும் அர்ப்பணிக்கப்பட்டது
  rationale: இச்சூழலில் கடவுளுக்கென மாற்றமுடியாதபடி ஒதுக்கப்பட்டு அழிக்கப்பட வேண்டிய நிலையை இச்சொல் குறிக்கிறது. தேர்ந்த சொற்றொடர் அர்ப்பணிப்பு மற்றும் அழிவு ஆகிய இரு கூறுகளையும் காக்கிறது; குறிப்பிட்ட சமயமரபுச் சொல்லாட்சியைத் திணிக்கவில்லை.
- issue: תַּחֲרִימוּ என்பதிலுள்ள செயற்பாட்டு வடிவமும் சூழல்சார் விளைவுநிலையும்
  choice: நீங்களும் அழிவுக்கென்று அர்ப்பணிக்கப்பட்டவர்களாகி
  alternative: உங்களை அழிவுக்கென்று அர்ப்பணித்து; தடைக்குள் உங்களை வைத்துக்கொண்டு
  rationale: வடிவம் செயற்பாட்டுத் தன்மை கொண்டிருந்தாலும், சூழலில் தடைசெய்யப்பட்டதை எடுத்துக்கொள்வதால் இஸ்ரவேலர் அதே நியாயத்தீர்ப்பு நிலையைத் தமக்கே ஏற்படுத்திக்கொள்வது மையமாக உள்ளது. முதன்மை உரை அந்த விளைவைக் காட்டுகிறது; மாற்று வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியும் அதேவேளையில் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. חֵרֶם என்ற தொழில்நுட்பமான கருத்தை மறைக்காமல் ‘அழிவுக்கென்று அர்ப்பணிக்கப்பட்டது’ என்று தொடர்ந்து மொழிபெயர்த்து, எபிரெய ஒருமைக் கூட்டுப்பொருளையும் இறையியல் பதற்றத்தையும் பாதுகாக்கிறது.
