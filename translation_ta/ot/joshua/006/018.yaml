  revision_rationale: முதன்மை மொழிபெயர்ப்பில் பாதுகாக்கப்பட்டுள்ள பொருளை மாற்றாமல் வைத்துள்ளேன். חֵרֶם-இன் தவறான ஒலிபெயர்ப்பைச் சரிசெய்தும், மாற்று வாசக அடிக்குறிப்பின் இலக்கணத்தை முழுமைப்படுத்தியும் உள்ளேன். அடிக்குறிப்பு a-வில் ‘மாற்றமுடியாதபடி’ என்பதற்குப் பதிலாக ‘திரும்பப்பெற முடியாதபடி’ என்று அமைத்தது irrevocable dedication என்ற கருத்தை நவீன தமிழில் இன்னும் துல்லியமாகத் தருகிறது.
