    rationale: ‘உங்களையே அழிவுக்கென்று அர்ப்பணித்துவிடாதபடிக்கும்’ என்பதிலுள்ள இறுதி இணைப்பு இயல்பாக இல்லை. ‘...அர்ப்பணித்துவிடாதபடிக்கு’ என்று திருத்துவது முழுமையான எச்சரிக்கைத் தொடரைத் தரும்.
  revised_text: ஆனால் நீங்கள்[a], அழிவுக்கென்று அர்ப்பணிக்கப்பட்டதிலிருந்து உங்களைக் காத்துக்கொள்ளுங்கள். இல்லையெனில், அழிவுக்கென்று அர்ப்பணிக்கப்பட்டதிலிருந்து எதையாவது எடுத்துக்கொள்வதன் மூலம் நீங்களும் அழிவுக்கென்று அர்ப்பணிக்கப்பட்டவர்களாகி[b], இஸ்ரவேலின் முகாமை அழிவுக்கென்று அர்ப்பணிக்கப்பட்டதாக ஆக்கி, அதன்மேல் துன்பத்தை வரவழைப்பீர்கள்[c].
