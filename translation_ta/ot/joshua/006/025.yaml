    rationale: It communicates the intended group, but ‘அவளுடைய தந்தையின் வீட்டார்’ is more idiomatic Tamil for a father's household and more closely retains the household sense of the Hebrew construct phrase.
  - severity: low
    issue: Attributive wording before Rahab's name
    rationale: ‘விலைமகளாகிய ராகாப்’ is smoother standard Tamil while retaining exactly the same lexical meaning.
