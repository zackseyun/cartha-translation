base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/025.yaml
  text: But Joshua kept Rahab the prostitute alive[a], along with her father's household and all that belonged to her, and she has lived in the midst of Israel to this day[b], because she hid the messengers whom Joshua sent to spy out Jericho.
translation:
  language: ta
  text: ஆனால் விலைமகளாகிய[a] ராகாபையும், அவளுடைய தந்தையின் வீட்டாரையும், அவளுக்குச் சொந்தமான அனைத்தையும் யோசுவா உயிரோடு வைத்தான். யோசுவா எரிகோவை உளவுபார்க்க அனுப்பிய தூதர்களை[b] அவள் மறைத்து வைத்திருந்ததால், அவள் இந்நாள்வரை இஸ்ரவேலின் நடுவில் வாழ்ந்துவருகிறாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘வேசியான.’
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில் ‘தூதர்கள்’; இவர்கள் எரிகோவை உளவுபார்க்க யோசுவா அனுப்பிய மனிதர்கள்.
    reason: lexical_clarification
lexical_decisions:
- source_word: הַזּוֹנָה
  choice: விலைமகளான
  rationale: זוֹנָה என்பது பாலியல் சேவைக்குப் பணம் பெறும் பெண்ணைக் குறிக்கிறது. ‘விலைமகள்’ என்பது நவீன தமிழில் தெளிவானதும், ‘விபசாரி’ என்பதில் வரக்கூடிய திருமணத் துரோகப் பொருளைத் தவிர்ப்பதும் ஆகும்.
- source_word: בֵּית אָבִיהָ
  choice: அவளுடைய தந்தையின் குடும்பத்தார்
  rationale: சொல்லர்த்தமாக ‘அவளுடைய தந்தையின் வீடு’ என்றாலும், இங்கு கட்டிடத்தை அல்லாமல் தந்தையின் குடும்பம் அல்லது குடும்பக் குழுவைக் குறிக்கிறது.
- source_word: כָּל אֲשֶׁר לָהּ
  choice: அவளுக்குச் சொந்தமான அனைத்தும்
  rationale: உடைமைகளையும் அவளோடு தொடர்புடையவர்களையும் உள்ளடக்கக்கூடிய எபிரெயச் சொற்றொடரின் விரிவான பொருளை, ஓர் அம்சத்திற்கு மட்டும் சுருக்காமல் காக்கிறது.
- source_word: הֶחֱיָה
  choice: உயிரோடு வைத்தான்
  rationale: חיה என்பதன் ஹிஃபில் வடிவிலுள்ள ‘உயிருடன் இருக்கச் செய்தல்/விடுதல்’ என்ற காரணவினை நுணுக்கத்தை நேரடியாகக் காக்கிறது.
- source_word: וַתֵּשֶׁב
  choice: வாழ்ந்துவருகிறாள்
  rationale: ‘இந்நாள்வரை’ என்பதோடு இணைந்து, கடந்த காலத்தில் தொடங்கி கதைசொல்லியின் காலம்வரை தொடரும் வாழ்வைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: בְּקֶרֶב יִשְׂרָאֵל
  choice: இஸ்ரவேலின் நடுவில்
  rationale: எபிரெய மொழிநடையை நெருக்கமாகக் காத்து, இஸ்ரவேல் சமூகத்திற்குள் அவள் வாழ்ந்ததைச் சொல்கிறது; அதற்கு மேற்பட்ட பிற்கால இறையியல் முடிவுகளைச் சேர்ப்பதில்லை.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: இந்நாள்வரை
  rationale: கதைசொல்லியின் நிகழ்காலம்வரை நிலை தொடர்வதைக் குறிக்கும் இயல்பான தமிழ் காலச்சொற்றொடர்.
- source_word: הֶחְבִּיאָה
  choice: மறைத்து வைத்திருந்தாள்
  rationale: חבא என்பதன் ஹிஃபில் வடிவம் இச்சூழலில் மறைத்தல் அல்லது ஒளித்துவைத்தலைக் குறிக்கிறது.
- source_word: הַמַּלְאָכִים
  choice: தூதர்கள்
  rationale: מַלְאָכִים என்பதன் அடிப்படைப் பொருள் ‘தூதர்கள்’; அவர்களின் உளவுப் பணி அடுத்து வரும் சொற்றொடரில் தெளிவாக்கப்படுகிறது.
- source_word: לְרַגֵּל
  choice: உளவுபார்க்க
  rationale: רגל இங்கு மறைவாகத் தகவல் திரட்டும் உளவுப் பணியைக் குறிக்கிறது; ‘உளவுபார்க்க’ என்பது தெளிவான நவீன தமிழ்.
theological_decisions:
- issue: ராகாப் இஸ்ரவேலுக்குள் வாழ்ந்ததைக் குறிக்கும் கதைசார் கூற்று
  choice: அவள் இந்நாள்வரை இஸ்ரவேலின் நடுவில் வாழ்ந்துவருகிறாள்
  alternative: அவள் இந்நாள்வரை இஸ்ரவேலரிடையே குடியிருந்தாள்
  rationale: மூலத்தில் உள்ள தொடர்ச்சியான வசிப்பையும் சமூகத்தின் மத்தியிலான இருப்பையும் காக்கிறது; அவளுடைய உடன்படிக்கை நிலை அல்லது பிற்கால இறையியல் முக்கியத்துவம் குறித்து வசனம் கூறாத முடிவுகளைச் சேர்ப்பதில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், எளிதில் புரியக்கூடிய ஆனால் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. நீண்ட எபிரெய வாக்கியம் தமிழின் இயல்புக்காக இரண்டு வாக்கியங்களாகப் பிரிக்கப்பட்டுள்ளது. ‘விலைமகள்’ தெளிவான முதன்மைச் சொல்லாகவும், மரபுவழிச் சொல்லான ‘வேசி’ அடிக்குறிப்பு மாற்றாகவும் தரப்பட்டுள்ளது.
