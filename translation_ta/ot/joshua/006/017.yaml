  terminology: ‘யெகோவாவுக்கென்று அழிவுக்கு அர்ப்பணிக்கப்பட்டதாக’ என்பது חֵרֶம் சொல்லின் கடுமையான அழிவு விளைவையும் யெகோவாவுக்கான ஒப்புக்கொடுத்தலையும் காக்கிறது. ‘விலைமகள்’ மூலத்தின் வெளிப்படையான சமூக/தொழில் அடையாளத்தைப் பாதுகாக்கிறது. ‘தூதர்கள்’ என்பது מַלְאָכִים என்பதற்கான சொற்சார் மொழிபெயர்ப்பு; இச்சூழலில் மனித தூதர்கள் என்பதை அடிக்குறிப்பு விளக்குகிறது.
