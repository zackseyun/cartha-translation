  text: וְ/הָיְתָ֨ה הָ/עִ֥יר חֵ֛רֶם הִ֥יא וְ/כָל אֲשֶׁר בָּ֖/הּ לַֽ/יהוָ֑ה רַק֩ רָחָ֨ב הַ/זּוֹנָ֜ה תִּֽחְיֶ֗ה הִ֚יא וְ/כָל אֲשֶׁ֣ר אִתָּ֣/הּ בַּ/בַּ֔יִת כִּ֣י הֶחְבְּאַ֔תָה אֶת הַ/מַּלְאָכִ֖ים אֲשֶׁ֥ר שָׁלָֽחְנוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/017.yaml
  text: And the city and all that is in it shall be devoted to destruction for Yahweh[a]. Only Rahab the prostitute shall live, she and all who are with her in the house[b], because she hid the messengers whom we sent.
translation:
  language: ta
  text: அந்த நகரமும் அதிலுள்ள அனைத்தும் யெகோவாவுக்கென்று அழிவுக்கு அர்ப்பணிக்கப்பட்டதாக இருக்க வேண்டும்[a]. விலைமகளான ராகாப் மட்டும் உயிரோடிருப்பாள்; அவளும் அவளுடன் அந்த வீட்டில் இருப்பவர்கள் அனைவரும் உயிரோடிருப்பார்கள்[b]; ஏனெனில் நாம் அனுப்பிய தூதர்களை அவள் மறைத்து வைத்தாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யெகோவாவுக்கென்று தடைக்கு உட்படுத்தப்பட்டதாக இருக்க வேண்டும்.” எபிரெயச் சொல் யெகோவாவுக்கென்று மாற்ற முடியாதபடி அர்ப்பணிக்கப்பட்ட ஒன்றைக் குறிக்கிறது; இங்கு அது அழிவின் மூலம் நிறைவேற்றப்படுகிறது.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில், “தூதர்கள்.” சூழலில், இவர்கள் நாட்டை உளவறிய யோசுவா அனுப்பிய மனிதர்கள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֵרֶם
  choice: அழிவுக்கு அர்ப்பணிக்கப்பட வேண்டும்
  rationale: இச்சொல் வெறுமனே ‘சபிக்கப்பட்டது’ என்பதைக் குறிக்காமல், யெகோவாவுக்கென்று மாற்ற முடியாதபடி ஒதுக்கப்பட்டு, இச்சூழலில் அழிப்பதன் மூலம் நிறைவேற்றப்படுவதைக் குறிக்கிறது. இந்த மொழிபெயர்ப்பு அர்ப்பணிப்பு மற்றும் அழிவு ஆகிய இரு கூறுகளையும் காக்கிறது.
- source_word: לַיהוָה
  choice: யெகோவாவுக்கென்று
  rationale: לְ முன்னிடைச்சொல் இங்கு யெகோவாவுக்கான அர்ப்பணிப்பைக் குறிக்கிறது; ‘-க்கென்று’ என்பது தமிழில் இந்த நோக்கத்தையும் உரிமையையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: רַק
  choice: மட்டும்
  rationale: நகரத்திற்குரிய அழிவிலிருந்து ராகாபும் அவளுடன் இருப்பவர்களும் மட்டுமே விதிவிலக்கானவர்கள் என்பதைத் தெளிவாகக் காட்டுகிறது.
- source_word: הַזּוֹנָה
  choice: விலைமகளான
  rationale: நவீன பொதுத்தமிழில் தொழில் அல்லது சமூக அடையாளத்தைத் தெளிவாகக் கூறும் நேரடியான, பழமையற்ற சொல்.
- source_word: תִּחְיֶה
  choice: உயிரோடிருப்பார்கள்
  rationale: எபிரெய வினையின் ‘வாழ்தல்/உயிருடன் இருத்தல்’ என்ற அடிப்படைப் பொருளைக் காக்கிறது. கூட்டிணைக்கப்பட்ட எழுவாய்க்கேற்ப தமிழில் பன்மை பயன்படுத்தப்பட்டுள்ளது.
- source_word: אִתָּהּ בַּבַּיִת
  choice: அவளுடன் வீட்டில் இருப்பவர்கள்
  rationale: ராகாபுடன் அந்த வீட்டில் உடல்ரீதியாகக் கூடியிருந்தவர்களைக் குறிக்கும் மூலவாக்கியத்தை நேரடியாகவும் இயல்பாகவும் தருகிறது.
- source_word: הֶחְבְּאַתָה
  choice: மறைத்து வைத்தாள்
  rationale: ஹிப்இல் வடிவின் ‘மறைத்தல்’ என்ற பொருளை இயல்பான தமிழில் தருகிறது; ‘அடைக்கலம் கொடுத்தாள்’ போன்ற கூடுதல் பாதுகாப்பு நுணுக்கத்தைச் சேர்க்கவில்லை.
- source_word: הַמַּלְאָכִים
  choice: தூதர்களை
  rationale: מַלְאָךְ என்பதன் பொதுவான பொருள் ‘தூதர்/செய்தியாளர்.’ இங்கு யோசுவா அனுப்பிய மனிதர்களையே சூழல் குறிக்கிறது; ‘ஒற்றர்கள்’ என்பது சூழல்சார் விளக்கமாக இருந்தாலும் மூலச்சொல்லைவிட குறிப்பானது.
- source_word: שָׁלָחְנוּ
  choice: நாம் அனுப்பிய
  rationale: முன்னதாக நடந்த அனுப்புதலைத் தமிழின் தொடர்பெச்ச அமைப்பில் சுருக்கமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: וְהָיְתָה הָעִיר ... הִיא וְכָל אֲשֶׁר בָּהּ
  choice: அந்த நகரமும் அதிலுள்ள அனைத்தும் ... அழிவுக்கு அர்ப்பணிக்கப்பட வேண்டும்
  rationale: எபிரெயத்தின் முன்னிலைப்படுத்தப்பட்ட நகரத்தையும் அதிலுள்ள அனைத்தையும் ஒரே இயல்பான தமிழ்த் தொடரில் இணைத்து, வலியுறுத்தலின் சாரத்தைத் தக்கவைக்கிறது.
theological_decisions:
- issue: வெற்றிகொள்ளும் சூழலில் חֵרֶם என்பதன் மொழிபெயர்ப்பு
  choice: அழிவுக்கு அர்ப்பணிக்கப்பட வேண்டும்
  alternative: தடையாணைக்குட்பட்டதாக இருக்க வேண்டும்; முற்றிலும் அழிக்கப்பட வேண்டும்; சபிக்கப்பட்டதாக இருக்க வேண்டும்
  rationale: இது தீர்ப்பின் கடுமையை மென்மைப்படுத்தாமல், நகரம் வெறுமனே சபிக்கப்பட்டது என்ற தவறான எண்ணத்தையும் தவிர்க்கிறது. யெகோவாவுக்கென்று ஒப்படைக்கப்படுதல் மற்றும் அழிவின் மூலம் அது நிறைவேறுதல் ஆகிய இரண்டையும் காக்கிறது.
- issue: יהוה என்ற தெய்வீகப் பெயரின் மொழிபெயர்ப்பு
  choice: யெகோவா
  alternative: கர்த்தர்; ஆண்டவர்
  rationale: மூலத்தில் தனிப்பட்ட தெய்வீகப் பெயர் இருப்பதால், பட்டப்பெயராக மாற்றாமல் தமிழில் பரவலாக அறியப்பட்ட பெயர்வடிவம் பயன்படுத்தப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. חֵרֶם என்பதிலுள்ள அர்ப்பணிப்பு–அழிவு இணைப்பு விளக்கமின்றி மறைக்கப்படாமல் முதன்மை உரையிலும் அடிக்குறிப்பிலும் பாதுகாக்கப்பட்டுள்ளது. ‘தூதர்கள்’ என்பது மூலச்சொல்லின் பரப்பைத் தக்கவைக்கிறது; சூழலில் அவர்கள் மனித ஒற்றர்கள் என்பது தெளிவு.
