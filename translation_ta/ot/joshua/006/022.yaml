  text: וְ/לִ/שְׁנַ֨יִם הָ/אֲנָשִׁ֜ים הַֽ/מְרַגְּלִ֤ים אֶת הָ/אָ֨רֶץ֙ אָמַ֣ר יְהוֹשֻׁ֔עַ בֹּ֖אוּ בֵּית הָ/אִשָּׁ֣ה הַ/זּוֹנָ֑ה וְ/הוֹצִ֨יאוּ מִ/שָּׁ֤ם אֶת הָֽ/אִשָּׁה֙ וְ/אֶת כָּל אֲשֶׁר לָ֔/הּ כַּ/אֲשֶׁ֥ר נִשְׁבַּעְתֶּ֖ם לָֽ/הּ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/022.yaml
  text: And to the two men who had spied out the land[a], Joshua said, “Go into the house of the prostitute and bring out from there the woman and all that belongs to her, just as you swore to her.”
translation:
  language: ta
  text: நாட்டை உளவு பார்த்த அந்த இரண்டு ஆண்களிடம் யோசுவா, “விலைமகளின் வீட்டுக்குள் சென்று, நீங்கள் அவளுக்குச் சத்தியம் செய்தபடியே அந்தப் பெண்ணையும் அவளுக்குச் சொந்தமான அனைத்தையும் அங்கிருந்து வெளியே கொண்டுவாருங்கள்” என்றார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְלִשְׁנַיִם הָאֲנָשִׁים
  choice: அந்த இரண்டு ஆண்களிடம்
  rationale: லாமேத் குறிக்கும் மறைமுகச் செயப்படுபொருளை ‘ஆண்களிடம்’ என இயல்பாகக் காட்டுகிறது; வாவ் இங்கு உரைத் தொடர்ச்சியை இணைக்கிறது, ஆனால் தமிழில் தனியே ‘மேலும்’ என்பது தேவையில்லை.
- source_word: הַמְרַגְּלִים אֶת הָאָרֶץ
  choice: நாட்டை உளவுபார்த்த
  rationale: רגל என்ற வேரின் இச்சூழல் பொருள் இராணுவ நோக்கமுள்ள உளவாய்வு; முன்னர் முடிந்த செயலைத் தமிழ் இறந்தகாலப் பெயரெச்சம் தெளிவாகக் காட்டுகிறது.
- source_word: אָמַר יְהוֹשֻׁעַ
  choice: யோசுவா … என்றார்
  rationale: எபிரெயக் கதைநடையின் எளிய பேச்சு அறிமுகத்தை இயல்பான தமிழ்ச் சொல் வரிசையில் தருகிறது.
- source_word: בֹּאוּ בֵּית
  choice: வீட்டுக்குள் சென்று
  rationale: בוא என்பதன் அடிப்படைப் பொருள் ‘வருதல்/நுழைதல்’; கட்டளையிடுபவரின் பார்வையிலிருந்து தமிழில் ‘சென்று’ என்பது இயல்பானது, மேலும் வீட்டிற்குள் நுழைவதையும் தெளிவாக்குகிறது.
- source_word: הָאִשָּׁה הַזּוֹנָה
  choice: விலைமகளின்
  rationale: זוֹנָה என்பதன் நேரடியான பொருளை நவீன, கண்ணியமான தமிழில் தருகிறது; ‘பெண்’ என்ற பெயர்ச்சொல்லைத் தனியே சேர்ப்பது தமிழில் தேவையற்ற மறுமொழியாகும்.
- source_word: וְהוֹצִיאוּ מִשָּׁם
  choice: அங்கிருந்து வெளியே கொண்டுவாருங்கள்
  rationale: ஹிஃபில் வடிவம் ‘வெளியே வரச் செய்தல்/கொண்டுவருதல்’ என்பதைக் குறிக்கிறது; מִשָּׁם என்பதையும் ‘அங்கிருந்து’ என வெளிப்படையாகப் பேணுகிறது.
- source_word: אֶת הָאִשָּׁה
  choice: அந்தப் பெண்ணையும்
  rationale: எபிரெயம் சுட்டுப்பெயருக்குப் பதிலாக ‘பெண்’ என்பதை மீண்டும் கூறுவதால், அந்த மறுமொழி தமிழிலும் பேணப்படுகிறது.
- source_word: וְאֶת כָּל אֲשֶׁר לָהּ
  choice: அவளுக்குச் சொந்தமான அனைத்தையும்
  rationale: சொத்துகள் மட்டுமன்றி சூழலில் அவளோடு சேர்ந்திருப்பவர்களையும் உள்ளடக்கக்கூடிய மூலத்தின் பரந்த குறிப்பைத் தீர்மானிக்காமல் பேணுகிறது.
- source_word: כַּאֲשֶׁר נִשְׁבַּעְתֶּם לָהּ
  choice: நீங்கள் அவளுக்கு ஆணையிட்டபடியே
  rationale: שבע என்பதன் உறுதிமொழி/சத்தியம் செய்தல் என்ற பொருளை ‘ஆணையிடுதல்’ இயல்பாகத் தருகிறது; כַּאֲשֶׁר என்பதன் ஒப்புமையும் ‘படியே’ மூலம் பேணப்படுகிறது.
theological_decisions:
- issue: ராகாபைப் பற்றிய זוֹנָה என்பதன் மொழிபெயர்ப்பு
  choice: விலைமகள்
  alternative: வேசி
  rationale: மூலச்சொல் பாலியல் தொழிலில் ஈடுபடும் பெண்ணைக் குறிக்கிறது; பொருளை மென்மைப்படுத்தாமல், அதேவேளை நவீனக் கண்ணியமான தமிழில் ‘விலைமகள்’ என வழங்கப்படுகிறது.
- issue: כָּל אֲשֶׁר לָהּ என்பதன் வரம்பு
  choice: அவளுக்குச் சொந்தமான அனைத்தும்
  alternative: அவளிடம் உள்ள எல்லாரும் எல்லாமும்
  rationale: எபிரெயச் சொற்றொடர் பரந்தும் சற்றே தெளிவுறாததாகவும் உள்ளது. உடைமைகள் மட்டுமா, அவளோடு தொடர்புடைய ஆட்களும் உள்ளனரா என்பதை இவ்வசனம் தனியே தீர்மானிக்காததால் பரந்த வடிவம் பேணப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழ்; கதைநடைக்கு ஏற்ற இயல்பான சொல் வரிசை, மரியாதைப் பன்மை கட்டளை, மேலும் மூலத்தின் ‘பெண்’ என்ற மறுமொழி பேணப்பட்டுள்ளது. தேவையற்ற பழமொழிநடை மற்றும் சமயப் பிரிவுசார் சொற்கள் தவிர்க்கப்பட்டுள்ளன.
