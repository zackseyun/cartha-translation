  text: וַ/יָּבֹ֜אוּ הַ/נְּעָרִ֣ים הַֽ/מְרַגְּלִ֗ים וַ/יֹּצִ֡יאוּ אֶת רָ֠חָב וְ/אֶת אָבִ֨י/הָ וְ/אֶת אִמָּ֤/הּ וְ/אֶת אַחֶ֨י/הָ֙ וְ/אֶת כָּל אֲשֶׁר לָ֔/הּ וְ/אֵ֥ת כָּל מִשְׁפְּחוֹתֶ֖י/הָ הוֹצִ֑יאוּ וַ/יַּ֨נִּיח֔וּ/ם מִ/ח֖וּץ לְ/מַחֲנֵ֥ה יִשְׂרָאֵֽל־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/023.yaml
  text: So the young men[a], the spies, went in and brought out Rahab, her father, her mother, her brothers, and all who belonged to her[b]. They brought out all her families and placed them outside the camp of Israel.
translation:
  language: ta
  text: அப்போது ஒற்றர்களான அந்த இளைஞர்கள் உள்ளே சென்று, ராகாபையும் அவளுடைய தந்தையையும் தாயையும் சகோதரர்களையும், அவளுக்குரிய அனைத்தையும்[a] வெளியே கொண்டுவந்தார்கள். அவளுடைய உறவினர்கள் அனைவரையும்[b] வெளியே கொண்டுவந்து, அவர்களை இஸ்ரவேலின் முகாமுக்கு வெளியே வைத்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவளுக்குச் சொந்தமான எல்லாவற்றையும்.” எபிரெயச் சொற்றொடர் மனிதர்களை மட்டுமல்லாமல் உடைமைகளையும் குறிக்கக்கூடும்; எனினும் இச்சூழலில் அது முக்கியமாக அவளுடைய வீட்டாரைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அவளுடைய குடும்பங்கள் அனைத்தையும்” அல்லது “அவளுடைய குலக்குழுக்கள் அனைத்தையும்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנְּעָרִים
  choice: அந்த இளைஞர்கள்
  rationale: נַעַר என்பது இச்சூழலில் இளம் ஆண்களைக் குறிக்கிறது. முன்பே அறிமுகமான இரு நபர்களைக் குறிப்பதால் “அந்த” சேர்க்கப்பட்டது.
- source_word: הַמְרַגְּלִים
  choice: ஒற்றர்களான
  rationale: רגל வினையிலிருந்து வந்த இப்பெயரெச்சம் அந்த இளைஞர்களை ஒற்றர்கள் என்று அடையாளப்படுத்துகிறது. மூலத்தில் இவ்வசனத்தில் வெளிப்படையாக இல்லாத “நாட்டை” என்பதைக் கூட்டாமல் மொழிபெயர்க்கப்பட்டது.
- source_word: וַיֹּצִיאוּ / הוֹצִיאוּ
  choice: வெளியே கொண்டுவந்தார்கள்
  rationale: Hiphil வடிவிலுள்ள יצא, “வெளியே கொண்டுவருதல்” என்று பொருள்படும். எபிரெயத்தில் வரும் மறுபடியும் கூறுதலைத் தமிழிலும் காக்கிறது.
- source_word: כָּל אֲשֶׁר לָהּ
  choice: அவளுக்குரிய அனைத்தையும்
  rationale: இந்தச் சொற்றொடர் நபர்களை மட்டும் அல்லாமல் அவளுக்குச் சொந்தமானவற்றையும் பரந்த முறையில் குறிக்கக்கூடும். தமிழிலும் அந்தப் பரப்பைச் சுருக்காமல் வைத்திருக்கிறது.
- source_word: מִשְׁפְּחוֹתֶיהָ
  choice: அவளுடைய உறவினர்கள் அனைவரையும்
  rationale: מִשְׁפָּחָה என்பது குடும்பம், விரிந்த உறவினர் வட்டம், அல்லது குலக்குழு ஆகியவற்றைக் குறிக்கலாம். உடனடிக் குடும்பத்தார் ஏற்கெனவே பட்டியலிடப்பட்டுள்ளதால், வாசிக்க இயல்பான “உறவினர்கள்” தேர்ந்தெடுக்கப்பட்டது.
- source_word: וַיַּנִּיחוּם
  choice: தங்கவைத்தார்கள்
  rationale: Hiphil נוח இங்கு அவர்களை ஒரு குறிப்பிட்ட இடத்தில் இருக்கச் செய்தல் அல்லது அங்கே வைத்தல் என்ற பொருளைத் தருகிறது. காரணத்தைச் சேர்க்காமல் திட்டமிட்ட இடமாற்றத்தைக் காட்டுகிறது.
- source_word: מִחוּץ לְמַחֲנֵה יִשְׂרָאֵל
  choice: இஸ்ரவேலின் முகாமுக்கு வெளியே
  rationale: மூலத்தின் இடவியல் கூற்றை நேரடியாகவும் இயல்பான தமிழிலும் வழங்குகிறது.
theological_decisions:
- issue: ராகாபும் அவளைச் சேர்ந்தவர்களும் இஸ்ரவேலின் முகாமுக்கு வெளியே வைக்கப்பட்டதற்கான காரணம்
  choice: காரணம் எதையும் சேர்க்காமல் இடவியல் தகவலை மட்டும் மொழிபெயர்த்தல்
  alternative: சடங்குத் தூய்மைக்கான தற்காலிகப் பிரிப்பு, பாதுகாப்புக் காவல், அல்லது இஸ்ரவேலுடன் இணைக்கப்படும்வரை தனியே வைத்தல்
  rationale: எபிரெய உரை அவர்கள் முகாமுக்கு வெளியே வைக்கப்பட்டார்கள் என்று மட்டுமே கூறுகிறது; அதற்கான காரணத்தை விளக்கவில்லை. ஆகவே எந்த விளக்கத்தையும் முதன்மை உரைக்குள் புகுத்தவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. “ஒற்றர்,” “முகாம்” போன்ற பரவலாகப் புரியும் சொற்கள் பயன்படுத்தப்பட்டுள்ளன; காரண விளக்கங்கள் உரைக்குள் சேர்க்கப்படவில்லை.
