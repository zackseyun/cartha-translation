base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/011.yaml
  text: So the ark of Yahweh went around the city[a], circling it once. Then they came into the camp and spent the night in the camp.
translation:
  language: ta
  text: இவ்வாறு யாவேயின் பெட்டி நகரத்தை ஒருமுறை சுற்றிவந்தது[a]. பிறகு அவர்கள் முகாமுக்குள் வந்து, அந்த இரவு முகாமிலேயே தங்கினார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரேயத்தில், “யாவேயின் பெட்டி நகரத்தை ஒருமுறை சுற்றிவந்தது” என்று உள்ளது. ஆசாரியர்கள் அதைச் சுமந்துசென்றபோதிலும், இங்கு பெட்டியே செயலைச் செய்வதுபோல் எழுவாயாகக் கூறப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּסֵּב
  choice: சுற்றிவந்தது
  rationale: סבב என்பதன் காரணவினை வடிவம் நகரைச் சுற்றிய இயக்கத்தைக் குறிக்கிறது. பெட்டியே எழுவாயாக வரும் எபிரேய வாக்கிய அமைப்பைப் பேணும் வகையில் இயல்பான தமிழில் மொழிபெயர்க்கப்பட்டது.
- source_word: אֲרוֹן יְהוָה
  choice: யாவேயின் பெட்டி
  rationale: இது நேரடியான உடைமைத் தொகை. אֲרוֹן என்பதற்கு இச்சூழலில் இயல்பானதும் பொதுவாகப் புரிந்துகொள்ளக்கூடியதுமான ‘பெட்டி’ பயன்படுத்தப்பட்டது; மூலத்தில் இல்லாத ‘உடன்படிக்கை’ சேர்க்கப்படவில்லை.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைவனின் தனிப்பெயரான நான்கெழுத்துப் பெயரைப் பட்டப்பெயராக மாற்றாமல், நவீன தமிழில் அறியப்பட்ட ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: הָעִיר
  choice: நகரத்தை
  rationale: சூழலில் எரிகோவைக் குறித்தாலும், மூலத்தின் பொதுப்பெயரும் அதன் திட்டவட்டத் தன்மையும் பேணப்பட்டுள்ளன.
- source_word: הַקֵּף פַּעַם אֶחָת
  choice: ஒருமுறை சுற்றிவந்தது
  rationale: சுற்றும் செயலைத் தெளிவுபடுத்தும் வினையெச்ச வலியுறுத்தலையும் ‘ஒரு முறை’ என்ற எண்ணிக்கையையும் சுருக்கமான இயல்பான தமிழில் இணைக்கிறது.
- source_word: וַיָּבֹאוּ הַמַּחֲנֶה
  choice: அவர்கள் முகாமுக்குள் வந்து
  rationale: בוא என்பதன் அடிப்படைப் பொருளான வருதல் அல்லது நுழைதல் பேணப்படுகிறது; மூலத்தில் வெளிப்படையாக இல்லாத ‘திரும்பி’ சேர்க்கப்படவில்லை.
- source_word: וַיָּלִינוּ בַּמַּחֲנֶה
  choice: அந்த இரவு முகாமிலேயே தங்கினார்கள்
  rationale: לון என்பது இரவைக் கழித்தல் அல்லது இரவில் தங்குதல். ‘அந்த இரவு’ காலப் பொருளைத் தெளிவாக்குகிறது; எபிரேயத்தில் ‘முகாம்’ மீண்டும் வருவதையும் தமிழ் ‘முகாமிலேயே’ மூலம் பேணுகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூல உரையில் இறைவனின் தனிப்பெயர் நேரடியாக உள்ளது. அதை ஒரு பட்டப்பெயராக மாற்றாமல், தமிழில் பரவலாக அறியப்பட்ட ஒலிபெயர்ப்பில் வழங்குவது பெயரின் தனித்தன்மையைப் பேணுகிறது.
- issue: பெட்டியைச் செயலின் எழுவாயாகக் காட்டுதல்
  choice: யாவேயின் பெட்டி ... சுற்றிவந்தது
  alternative: ஆசாரியர்கள் யாவேயின் பெட்டியைச் சுமந்துகொண்டு ... சுற்றிவந்தார்கள்
  rationale: பெட்டி ஆசாரியர்களால் சுமக்கப்பட்டது என்பது சூழலில் தெளிவாக இருந்தாலும், இவ்வசனத்தின் எபிரேய இலக்கணத்தில் பெட்டியே எழுவாய். அந்தக் கதைநடைச் சுருக்கத்தையும் நபருருவாக்கத்தையும் பிரதான உரை பேணுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிமையும் கண்ணியமும் கொண்ட கதைநடை பயன்படுத்தப்பட்டது. எபிரேயத்தின் மீளுரையும் பெட்டியை எழுவாயாகக் காட்டும் அமைப்பும் இயன்றவரை பேணப்பட்டுள்ளன.
