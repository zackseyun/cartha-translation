  source_fidelity: 'தமிழ் உரை எபிரேய மூலத்தின் செயல்வரிசையையும் பொருளையும் துல்லியமாகக் காக்கிறது: இரண்டாம் நாள், நகரத்தை ஒருமுறை சுற்றுதல், முகாமுக்குத் திரும்புதல், இதே முறை ஆறு நாட்கள் தொடருதல் ஆகிய அனைத்தும் இடம்பெற்றுள்ளன. ‘சுற்றிவிட்டு’ என்பது וַיָּסֹבּוּ மற்றும் பின்னர் வரும் திரும்புதலை இயல்பாக இணைக்கிறது; கூடுதல் இராணுவ நுணுக்கம் எதையும் சேர்ப்பதில்லை.'
  naturalness: ‘இரண்டாம் நாளில் அவர்கள் நகரத்தை ஒருமுறை சுற்றிவிட்டு முகாமுக்குத் திரும்பினார்கள். இவ்வாறே ஆறு நாட்கள் செய்தார்கள்.’ என்பது நவீன நிலையான தமிழில் தெளிவான, இயல்பான, கண்ணியமான வரலாற்றுக் கதைநடையாக உள்ளது.
