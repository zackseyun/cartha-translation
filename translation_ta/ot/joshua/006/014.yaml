  text: On the second day they went around the city once and returned to the camp[b][a]. Thus they did for six days.
translation:
  language: ta
  text: இரண்டாம் நாளில் அவர்கள் நகரத்தை ஒருமுறை சுற்றிவிட்டு முகாமுக்குத் திரும்பினார்கள். இவ்வாறே ஆறு நாட்கள் செய்தார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּסֹבּוּ
  choice: அவர்கள் நகரத்தை ... சுற்றிவிட்டு
  rationale: סבב என்பது ‘சுற்றிவருதல்’ அல்லது ‘சுற்றுதல்’ என்று பொருள்படும். ‘சுற்றிவிட்டு’ என்பது நகரைச் சுற்றிச் சென்ற இயக்கத்தையும் அடுத்ததாக முகாமுக்குத் திரும்பியதையும் இயல்பாக இணைக்கிறது; மூலத்தில் இல்லாத இராணுவ அணிவகுப்பு நுட்பத்தைச் சேர்ப்பதில்லை.
- source_word: בַּיּוֹם הַשֵּׁנִי
  choice: இரண்டாம் நாளில்
  rationale: காலக் குறிப்பை மூலத்திற்கு நெருக்கமாகவும் நவீனத் தமிழில் இயல்பாகவும் தருகிறது.
- source_word: פַּעַם אַחַת
  choice: ஒருமுறை
  rationale: ‘ஒரு தடவை/ஒருமுறை’ என்ற எபிரேயப் பொருளுக்கான சுருக்கமான, இயல்பான தமிழ் இணை.
- source_word: וַיָּשֻׁבוּ הַמַּחֲנֶה
  choice: முகாமுக்குத் திரும்பினார்கள்
  rationale: שׁוב என்பதன் ‘திரும்புதல்’ என்ற அடிப்படைப் பொருளையும், הַמַּחֲנֶה குறிக்கும் இலக்கான முகாமையும் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: כֹּה עָשׂוּ
  choice: இவ்வாறே ... செய்தார்கள்
  rationale: כֹּה குறிக்கும் செய்முறையை ‘இவ்வாறே’ பாதுகாக்கிறது; עשה என்பதற்கு பொதுவான ‘செய்தார்கள்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: שֵׁשֶׁת יָמִים
  choice: ஆறு நாட்கள்
  rationale: எபிரேயத்தின் காலநீட்சி மொழிநடையைத் தமிழில் இயல்பாகத் தருகிறது; முந்தைய செய்முறை ஆறு நாட்களும் தொடர்ந்தது என்பது சூழலால் தெளிவாகிறது.
