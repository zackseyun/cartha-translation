base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/002.yaml
  text: And Yahweh said to Joshua[a], “See, I have given Jericho into your hand, along with its king and the mighty men of valor.”
translation:
  language: ta
  text: 'யெகோவா யோசுவாவிடம் சொன்னார்: “பார், எரிகோவையும், அதன் அரசனையும், வலிமைமிக்க வீரர்களையும்[a] உன் கையில் ஒப்புவித்துவிட்டேன்.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “வலிமைமிக்க வீரர்கள்” என்பதற்கு “போர்வல்ல வீரர்கள்” அல்லது “துணிவுமிக்க போர்வீரர்கள்” என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொற்றொடர் வலிமை, போர்த்திறன், வீரத்துணிவு ஆகிய கருத்துகளை இணைக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: யெகோவா
  rationale: தமிழில் பரவலாக அறியப்படும் மரபுவழித் திருப்பெயரைப் பயன்படுத்தி, எபிரெய மூலத்திலுள்ள உடன்படிக்கைப் பெயரைப் பொதுப்பட்டப் பெயராக மாற்றாமல் காக்கிறது.
- source_word: וַיֹּאמֶר
  choice: சொன்னார்
  rationale: எபிரெயக் கதைத் தொடரை இயல்பான நவீனத் தமிழில் முன்னெடுக்கிறது; தொடக்க வாவைத் தனியே ‘அப்போது’ என்று மிகைவிளக்கம் செய்யவில்லை.
- source_word: רְאֵה
  choice: பார்
  rationale: கவனத்தை ஈர்க்கும் ஒருமை ஏவல் வடிவத்தின் நேரடியான வலிமையை இயல்பான தமிழில் காக்கிறது.
- source_word: נָתַתִּי
  choice: ஒப்புவித்துவிட்டேன்
  rationale: போர் நடைபெறுமுன்பே நிறைவேறியதாக அறிவிக்கும் எபிரெய நிறைவுவடிவத்தின் உறுதியைக் காக்கிறது.
- source_word: בְיָדְךָ
  choice: உன் கையில்
  rationale: ஒருவரின் அதிகாரத்திற்குள் ஒப்புவித்தல் என்ற எபிரெய மரபுத்தொடரைத் தமிழிலும் புரியத்தக்க வகையில் காக்கிறது.
- source_word: יְרִיחוֹ
  choice: எரிகோ
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் நிலைபெற்ற இடப்பெயர் வடிவம்.
- source_word: מַלְכָּהּ
  choice: அதன் அரசன்
  rationale: பெண்பால் பின்னொட்டு எரிகோ நகரத்தைக் குறிக்கிறது; தமிழில் தேவையற்ற உருவகப்படுத்தலைத் தவிர்த்து உறவைத் தெளிவாக்குகிறது.
- source_word: גִּבּוֹרֵי הֶחָיִל
  choice: வலிமைமிக்க வீரர்கள்
  rationale: வலிமை, போர்த்திறன், துணிவு ஆகிய கருத்துகளை இயல்பான தமிழில் இணைத்துத் தருகிறது.
theological_decisions:
- issue: போருக்கு முன் வரும் נָתַתִּי என்ற நிறைவுவடிவத்தின் பொருள்
  choice: நிச்சயிக்கப்பட்ட வெற்றியை ஏற்கெனவே நிறைவேறியதுபோல் ‘ஒப்புவித்துவிட்டேன்’ என்று வழங்குதல்
  alternative: ‘ஒப்புவிக்கிறேன்’ அல்லது ‘ஒப்புவிப்பேன்’
  rationale: இறைச்செயலின் உறுதியை மூலத்தில் உள்ள நிறைவுவடிவம்போலவே காக்கிறது; அதை வெளிப்படையான எதிர்காலமாக மாற்றி மூலத்தின் காலநிலைத் திண்மையைத் தீர்த்துவிடவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான நடை. ‘பார்’ என்ற நேரடி ஏவலும் ‘உன் கையில்’ என்ற மூல உருவகமும் காக்கப்பட்டுள்ளன; தேவையற்ற பழமையான சொற்கள் தவிர்க்கப்பட்டுள்ளன.
