revisions:
- from: ஏழு குருமார்களும், ஏழு செம்மறியாட்டுக் கொம்பு எக்காளங்களை[a] ஏந்திக்கொண்டு யாவேவின் பேழைக்கு முன்பாகத் தொடர்ந்து நடந்து, எக்காளங்களை ஊதிக்கொண்டிருந்தார்கள். ஆயுதம் தாங்கிய வீரர்கள் அவர்களுக்கு முன்பாகச் சென்றார்கள்; பின்படையினர் யாவேவின் பேழைக்குப் பின்னால் சென்றார்கள்; அவர்கள் சென்றுகொண்டிருக்கும்போது எக்காளங்கள் தொடர்ந்து ஊதப்பட்டன.
