  choice: சென்றுகொண்டிருக்கும்போது எக்காளங்கள் தொடர்ந்து ஊதப்பட்டன
  rationale: செல்லுதலும் எக்காளம் ஊதப்படுதலும் நீடித்ததைப் பாதுகாக்கிறது; இறுதிக் கூறில் எக்காளத்தை ஊதியவரின் இலக்கணத் தொடர்பு சற்றுத் தெளிவற்றிருப்பதால், தமிழில் ஒரே குழுவைத் தீர்மானமாகச் சுட்டாமல் விடுகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் நேரடியாக இடம்பெறும் இறைவனின் தனிப்பெயரைப் பட்டப்பெயராக மாற்றாமல் ஒலிபெயர்த்து, அதன் தனிப்பெயர் தன்மையைப் பாதுகாக்கிறது.
- issue: இறுதியில் எக்காளம் ஊதியவர்களின் அடையாளம்
  choice: செயப்பாட்டு வடிவில் திறந்த நிலையில் வைத்தல்
  alternative: பின்படையினரே எக்காளங்களை ஊதினார்கள் என்று வெளிப்படையாகக் கூறுதல்
  rationale: மசோரா உரையின் இறுதித் தொடரில் ஒருமைத் தொகுப்புப்பெயரும் தொடர்ச்சியான செயல்வடிவங்களும் உள்ளதால், அது பின்படையை மட்டும் குறிக்கிறதா அல்லது நகர்ந்த ஊர்வலத்துடன் தொடர்ந்த எக்காள ஒலியைச் சுருக்குகிறதா என்பது தெளிவாக இல்லை. செயப்பாட்டு வடிவம் இந்த உண்மையான தெளிவின்மையைத் தீர்த்துவிடாமல் காக்கிறது.
