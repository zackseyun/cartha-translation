base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/013.yaml
  text: And the seven priests[a], carrying seven ram’s-horn trumpets before the ark of Yahweh, were walking on and blowing the trumpets, and the armed men were going before them, and the rear guard was going behind the ark of Yahweh, while they went on blowing the trumpets.
translation:
  language: ta
  text: ஏழு ஆசாரியர்கள், யாவேவின் பேழைக்கு முன்பாக ஏழு செம்மறியாட்டுக் கொம்பு எக்காளங்களை[a] ஏந்தி, தொடர்ந்து நடந்துகொண்டும் எக்காளங்களை ஊதிக்கொண்டும் இருந்தார்கள். ஆயுதம் தாங்கிய வீரர்கள் அவர்களுக்கு முன்பாகச் சென்றார்கள்; பின்படையினர் யாவேவின் பேழைக்குப் பின்னால், தொடர்ந்து சென்றுகொண்டும் எக்காளங்களை ஊதிக்கொண்டும் இருந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஏழு யூபிலி எக்காளங்கள்” அல்லது “ஏழு செம்மறியாட்டுக் கொம்புகள்.” எபிரெயத் தொடர், செம்மறியாட்டுக் கொம்புகளால் செய்யப்பட்ட அல்லது அவற்றுடன் தொடர்புடைய ஷோஃபார் எக்காளங்களைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: שׁוֹפְרוֹת הַיֹּבְלִים
  choice: செம்மறியாட்டுக் கொம்பு எக்காளங்கள்
  rationale: שׁוֹפָר என்பது ஊதப்படும் கொம்பு அல்லது எக்காளத்தைக் குறிக்கிறது; הַיֹּבְלִים இங்கு செம்மறியாட்டுக் கொம்புடன் உள்ள தொடர்பைக் காட்டுகிறது. கருவியின் மூலப்பொருளையும் அதன் இசைக்கருவிச் செயலையும் இத்தொடர் தெளிவாகக் காக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய தனிப்பெயரான יהוה-ஐ ஒரு பட்டப்பெயரால் மாற்றாமல், தமிழில் இயல்பான ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: הֹלְכִים הָלוֹךְ
  choice: தொடர்ந்து நடந்து
  rationale: வினைமுற்றுடன் வரும் வினையெச்சப் பெயரின் வலியுறுத்தல், ஊர்வலம் இடைவிடாமல் முன்னேறிய நீடித்த செயலைக் குறிக்கிறது.
- source_word: וְתָקְעוּ בַּשּׁוֹפָרוֹת
  choice: எக்காளங்களை ஊதிக்கொண்டிருந்தார்கள்
  rationale: תקע + שׁוֹפָר என்பதன் இயல்பான தமிழ் இணைவு ‘எக்காளத்தை ஊதுதல்’; தொடர்நிலை வடிவம் நடந்துகொண்டிருந்த செயலை வெளிப்படுத்துகிறது.
- source_word: הֶחָלוּץ
  choice: ஆயுதம் தாங்கிய வீரர்கள்
  rationale: போருக்குத் தயாராக ஆயுதம் பூண்டு ஊர்வலத்தின் முன் சென்ற குழுவைத் தெளிவாகக் குறிக்கிறது.
