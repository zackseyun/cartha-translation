translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகருக்குப் புரியும் வகையில் கண்ணியமான கட்டளைநடை பயன்படுத்தப்பட்டுள்ளது. ‘எக்காளம்’ என்ற பொதுப்பெயருக்குப் பதிலாக மூலத்தில் உள்ள கொம்புக் கருவியின் தன்மை காக்கப்பட்டுள்ளது. பிரதான உரை இயல்பாக இருக்க, மூலத்தின் அசாதாரணமான ‘தனக்குக் கீழே’ என்ற உருவகமும் עלה என்பதன் ‘மேலேறு’ நிழற்பொருளும் அடிக்குறிப்புகளில் பாதுகாக்கப்பட்டுள்ளன.
