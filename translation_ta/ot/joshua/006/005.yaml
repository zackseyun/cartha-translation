base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/005.yaml
  text: And when the ram's horn is drawn out[a], when you hear the sound of the trumpet, all the people shall raise a great shout, and the wall of the city will fall beneath itself, and the people shall go up[c][b], each man straight before him.
translation:
  language: ta
  text: ஆட்டுக்கடாவின் கொம்பு நீண்ட ஒலியுடன் ஊதப்படும்போது[a], நீங்கள் கொம்பின் ஒலியைக் கேட்கும்போது, மக்கள் அனைவரும் மிகப் பெரிய முழக்கமிட வேண்டும். அப்போது நகரத்தின் மதில் தன் இடத்திலேயே இடிந்து விழும்[b]; மக்கள் ஒவ்வொருவரும் தன் முன்னே நேராக மேலேறிச் செல்ல வேண்டும்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஆட்டுக்கடாவின் கொம்பின் ஒலி நீட்டிக்கப்படும்போது” அல்லது “ஆட்டுக்கடாவின் கொம்பு நீண்ட நேரம் ஊதப்படும்போது.”
    reason: lexical_alternative
  - marker: b
    text: 'நேர்ச்சொல்: “நகரத்தின் மதில் தனக்குக் கீழே விழும்”; இது மதில் தன் இடத்திலேயே நேராகக் கீழ்நோக்கி இடிந்து விழுவதைக் குறிக்கலாம்.'
    reason: lexical_alternative
  - marker: c
    text: “மேலேறிச் செல்ல” என்பதற்கு “முன்னேறிச் செல்ல” என்றும் மொழிபெயர்க்கலாம். கடைசிப் பகுதியை “ஒவ்வொருவரும் தன் முன்னே நேராகச் செல்ல வேண்டும்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּמְשֹׁךְ
  choice: நீண்ட தொனியுடன் ஊதப்படும்போது
  rationale: இந்த இசைக்கருவிச் சூழலில் משׁך என்பது கொம்பின் ஒலியை நீட்டிப்பதைக் குறிக்கும். எபிரெயச் சொல்லின் அடிப்படை உருவகத்தைச் செயற்கையாகத் தமிழில் பதிப்பதைவிட, அதன் இயல்பான சூழற்பொருளைத் தெளிவாக அளிக்கிறது.
- source_word: קֶרֶן הַיּוֹבֵל
  choice: ஆட்டுக்கடாவின் கொம்பு
  rationale: இங்கு יוֹבֵל என்பது பிற்காலத் தொழில்நுட்பப் பொருளான ‘விடுதலை ஆண்டு’ அல்ல; ஊதுகருவியாகப் பயன்படுத்தப்பட்ட ஆட்டுக்கடாவின் கொம்பைக் குறிக்கிறது.
- source_word: ק֣וֹל הַשּׁוֹפָר
  choice: கொம்பின் ஒலி
  rationale: שׁוֹפָר என்பது கொம்பினால் செய்யப்பட்ட ஊதுகருவி. முந்தைய சொற்றொடருடன் தொடர்பைத் தெளிவாக வைத்திருக்க ‘கொம்பு’ என மொழிபெயர்க்கப்பட்டது.
- source_word: יָרִיעוּ ... תְּרוּעָה גְדוֹלָה
  choice: மிக உரத்த முழக்கமிட வேண்டும்
  rationale: வினையும் அதன் ஒரே வேர்சார் பெயர்ச்சொல்லும் சேர்ந்து மக்கள் எழுப்பும் வலிமையான கூக்குரலைக் குறிக்கின்றன. ‘முழக்கமிடு’ என்பது இயல்பான நவீனத் தமிழ்.
- source_word: תַּחְתֶּיהָ
  choice: இருந்த இடத்திலேயே
  rationale: சொல்லுக்கு நேராக ‘அதன் கீழே’ அல்லது ‘தனக்குக் கீழே’ என்றாலும், இச்சொற்றொடர் மதில் செங்குத்தாகத் தன் இடத்திலேயே இடிந்து விழுவதைச் சுட்டலாம். பிரதான உரையில் இயல்பான தமிழும், அடிக்குறிப்பில் மூலத்தின் உருவகமும் பாதுகாக்கப்பட்டுள்ளன.
- source_word: וְעָלוּ
  choice: முன்னேறிச் செல்ல வேண்டும்
  rationale: עלה என்பதன் அடிப்படைப் பொருள் ‘மேலேறு/ஏறிச் செல்.’ முற்றுகைச் சூழலில் நகருக்குள் முன்னேறிச் செல்வது கருத்தாக இருப்பதால் இயல்பான தமிழ் பயன்படுத்தப்பட்டு, மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: אִישׁ נֶגְדּוֹ
  choice: ஒவ்வொருவரும் தமக்கு நேராக
  rationale: אִישׁ இங்கு பகிர்மானப் பொருளில் ‘ஒவ்வொருவரும்’ என வருகிறது; נֶגְדּוֹ ஒவ்வொருவரும் தமக்கு எதிரிலுள்ள திசையில் நேராகச் செல்வதைக் குறிக்கிறது.
