revisions:
- from: ஏழாவது முறை, ஆசாரியர்கள் கொம்புகளை ஊதியபோது, யோசுவா மக்களிடம், “ஆரவாரம் செய்யுங்கள்! ஏனெனில் யாவே இந்த நகரத்தை உங்களுக்குக் கொடுத்துவிட்டார்” என்றார்.
  to: ஏழாவது முறையில், ஆசாரியர்கள் கொம்புகளை ஊதியபோது, யோசுவா மக்களிடம், “ஆரவாரம் செய்யுங்கள்; ஏனெனில் யாவே உங்களுக்கு நகரத்தைக் கொடுத்துவிட்டார்” என்றார்.
  rationale: The revision removes the unsupported demonstrative, improves the temporal Tamil idiom, and retains the draft’s faithful handling of the proleptic/certain perfect “has given.” The footnote records the customary, more specific sense of shofarot while leaving the main text’s broader, natural rendering intact.
