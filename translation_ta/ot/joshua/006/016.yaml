    text: 'கொம்புகள்: எபிரெயத்தில் ஷோஃபரோத்; பாரம்பரியமாக ‘ஆட்டுக்கடாக் கொம்புகள்’ எனப் புரிந்துகொள்ளப்படுகிறது.'
