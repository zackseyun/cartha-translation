source:
  edition: WLC
  text: וַ/יְהִי֙ בַּ/פַּ֣עַם הַ/שְּׁבִיעִ֔ית תָּקְע֥וּ הַ/כֹּהֲנִ֖ים בַּ/שּׁוֹפָר֑וֹת וַ/יֹּ֨אמֶר יְהוֹשֻׁ֤עַ אֶל הָ/עָם֙ הָרִ֔יעוּ כִּֽי נָתַ֧ן יְהוָ֛ה לָ/כֶ֖ם אֶת הָ/עִֽיר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/016.yaml
  text: And it happened at the seventh time[a], when the priests blew the trumpets, that Joshua said to the people, “Shout, for Yahweh has given you the city.”
translation:
  language: ta
  text: ஏழாவது முறையில், ஆசாரியர்கள் கொம்புகளை ஊதியபோது, யோசுவா மக்களிடம், “ஆரவாரம் செய்யுங்கள்; ஏனெனில் யாவே உங்களுக்கு நகரத்தைக் கொடுத்துவிட்டார்” என்றார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: '[தனி சொற்றொடராக வெளிப்படுத்தப்படவில்லை]'
  rationale: எபிரெயக் கதைநடையில் அடுத்த நிகழ்வை அறிமுகப்படுத்தும் வழக்கமான தொடர் வடிவம். தமிழில் ‘அப்போது நிகழ்ந்ததாவது’ என்று சேர்ப்பது இயல்பற்றதாக இருப்பதால், நிகழ்வுகளின் தொடர்ச்சி வாக்கிய அமைப்பின் மூலம் தெரிவிக்கப்படுகிறது.
- source_word: בַּפַּעַם הַשְּׁבִיעִית
  choice: ஏழாவது முறை
  rationale: פעם என்பது ஓர் நிகழ்வு அல்லது முறை என்பதைக் குறிக்கிறது; சூழலில் திரும்பத் திரும்ப செய்யப்பட்ட செயலின் ஏழாவது முறையைக் குறிக்கிறது.
- source_word: תָּקְעוּ
  choice: ஊதியபோது
  rationale: שופר உடன் வரும் תקע, கொம்பை ஊதி ஒலிக்கச் செய்வதைக் குறிக்கிறது; காலத் தொடர்பும் தமிழில் இயல்பாக வெளிப்படுகிறது.
- source_word: שׁוֹפָרוֹת
  choice: கொம்புகளை
  rationale: שופר என்பது ஊதி ஒலிக்கச் செய்யப்படும் கொம்புவகைக் கருவி. ‘எக்காளங்கள்’ என்பதைவிட ‘கொம்புகள்’ மூலச்சொல்லின் கருவி வகையை நேரடியாகப் பாதுகாக்கிறது.
- source_word: וַיֹּאמֶר
  choice: என்றார்
  rationale: நேரடிப் பேச்சை அறிமுகப்படுத்தும் אמר என்பதற்கான இயல்பான தமிழ் வடிவம்.
- source_word: הָרִיעוּ
  choice: ஆரவாரம் செய்யுங்கள்
  rationale: இந்த கட்டளை உரத்த கூச்சல் அல்லது வெற்றிக் குரல் எழுப்புவதைக் குறிக்கிறது. ‘போர்க்குரல் எழுப்புங்கள்’ என்பது சூழலை மிகத் திட்டவட்டமாக விளக்கிவிடும்; ‘ஆரவாரம் செய்யுங்கள்’ பொருள்வீச்சைப் பாதுகாக்கிறது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: கட்டளைக்கான காரணத்தை அறிமுகப்படுத்துகிறது.
- source_word: נָתַן
  choice: கொடுத்துவிட்டார்
  rationale: எபிரெய நிறைவுற்ற வினை, நகரம் இன்னும் கைப்பற்றப்படாத நிலையிலும் இறைவன் அளித்தது உறுதி எனப் பேசுகிறது. தமிழில் ‘கொடுத்துவிட்டார்’ அந்த நிறைவு மற்றும் உறுதியைத் தக்கவைக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: திருநான்கெழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் பரவலாகப் புரியக்கூடிய ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: הָעִיר
  choice: இந்த நகரத்தை
  rationale: மூலத்தில் ‘நகரம்’ திட்டவட்டமாக உள்ளது; சூழலில் எரிகோவைச் சுட்டுவதால் தமிழில் ‘இந்த நகரம்’ இயல்பான சுட்டுமுறையாகும், பெயரை வெளிப்படையாகச் சேர்க்கவில்லை.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழியாக்கம்
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலத்தில் தனிப்பட்ட இறைப்பெயர் நேரடியாக உள்ளது. அதை பொதுப் பட்டமாக மாற்றாமல் ஒலிபெயர்ப்பது மூலத்தின் தன்மையைப் பாதுகாக்கிறது.
- issue: நகரம் கைப்பற்றப்படுவதற்கு முன் נָתַן நிறைவுற்ற வடிவில் வருதல்
  choice: கொடுத்துவிட்டார்
  alternative: கொடுப்பார் / ஒப்படைத்திருக்கிறார்
  rationale: எதிர்கால வெற்றியை வெறும் வாக்குறுதியாக மாற்றாமல், இறைச் செயல் ஏற்கெனவே நிறைவேறியதுபோல் கூறப்படும் மூலத்தின் இறையியல் பதற்றத்தையும் உறுதியையும் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழ்; எளிமையானதாயினும் கண்ணியமான கதைநடை. எபிரெயக் கதைத் தொடக்கச் சூத்திரத்தைச் சொற்சொல்லாகச் சேர்க்காமல் இயல்பான தமிழ் தொடராக்கம் பயன்படுத்தப்பட்டது. மூலத்தில் தனி குறிப்புரை தேவைப்படும் உரைமாற்றுச் சிக்கல் இல்லாததால் அடிக்குறிப்பு சேர்க்கப்படவில்லை.
