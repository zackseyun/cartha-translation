id: JOS.6.12
reference: Joshua 6:12
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יַּשְׁכֵּ֥ם יְהוֹשֻׁ֖עַ בַּ/בֹּ֑קֶר וַ/יִּשְׂא֥וּ הַ/כֹּהֲנִ֖ים אֶת אֲר֥וֹן יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/012.yaml
  text: Joshua rose early in the morning[a], and the priests carried the ark of Yahweh.
translation:
  language: ta
  text: யோசுவா அதிகாலையில் எழுந்தார்; ஆசாரியர்கள் யாவேவின் பெட்டியைச் சுமந்தார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּשְׁכֵּם
  choice: அதிகாலையில் எழுந்தார்
  rationale: שׁכם என்பதன் ஹிஃபில் வடிவம் சீக்கிரமாக எழுதல் அல்லது அதிகாலையில் செயல்படத் தொடங்குதல் என்று பொருள்படும். இயல்பான நவீனத் தமிழில் காலத்தின் வலியுறுத்தலை இது தெளிவாகத் தருகிறது.
- source_word: יְהוֹשֻׁעַ
  choice: யோசுவா
  rationale: எபிரெய தனிப்பெயரின் தமிழில் நிலைபெற்ற ஒலிபெயர்ப்பு.
- source_word: בַּבֹּקֶר
  choice: அதிகாலையில்
  rationale: சொல்லளவில் ‘காலையில்’ என்றாலும், וַיַּשְׁכֵּם உடன் சேர்ந்து அதிகாலையில் எழுந்த செயலைக் குறிக்கிறது; தமிழில் தேவையற்ற மீளுரையைத் தவிர்த்து இரண்டின் கருத்தையும் ஒருங்கிணைக்கிறது.
- source_word: וַיִּשְׂאוּ
  choice: சுமந்தார்கள்
  rationale: נשא என்பதற்கு தூக்குதல், சுமத்தல், எடுத்துச் செல்லுதல் ஆகிய பொருள்கள் உண்டு. பெட்டியை ஆசாரியர்கள் எடுத்துச் செல்லும் சூழலில் ‘சுமந்தார்கள்’ மிகப் பொருத்தமானது.
- source_word: הַכֹּהֲנִים
  choice: ஆசாரியர்கள்
  rationale: வரையறைச் சுட்டுடன் வரும் பன்மைப் பெயர்ச்சொல்லின் நேரான, மரியாதையான தமிழ் மொழிபெயர்ப்பு.
- source_word: אֲרוֹן יְהוָה
  choice: யாவேவின் உடன்படிக்கைப் பெட்டி
  rationale: אֲרוֹן என்பதைக் வெறும் பொதுப் ‘பெட்டி’ என்று விடாமல், இந்தப் பொருளுக்கான தமிழில் புரிந்துகொள்ளத்தக்க மரபுச் சொல்லான ‘உடன்படிக்கைப் பெட்டி’ என வழங்குகிறது; יְהוָה தனிப்பெயராக ‘யாவே’ என ஒலிபெயர்க்கப்படுகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூல உரை இறைவனின் தனிப்பெயரான நான்கெழுத்துப் பெயரை நேரடியாகப் பயன்படுத்துகிறது. அதை ஒரு பட்டத்தால் மாற்றாமல் தமிழில் தெளிவான ஒலிபெயர்ப்பாக ‘யாவே’ என வழங்குவது பெயரின் தன்மையைப் பாதுகாக்கிறது.
- issue: אֲרוֹן என்பதில் ‘உடன்படிக்கை’ என்பதை வெளிப்படையாகச் சேர்த்தல்
  choice: உடன்படிக்கைப் பெட்டி
  alternative: பெட்டி
  rationale: இச்சொல் தனித்து ‘பெட்டி’ என்றே இருந்தாலும், யாவேவின் பரிசுத்தப் பெட்டியைக் குறிக்கும் சூழல் தெளிவாக உள்ளது. ‘உடன்படிக்கைப் பெட்டி’ என்பது தமிழில் பொருளை உடனடியாக அடையாளப்படுத்தும் சூழல்சார் விரிவாக்கம்; புதிய கோட்பாட்டுக் கருத்தைச் சேர்ப்பதல்ல.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும் வகையில் இயல்பாகவும், வேதாகமக் கதையாடலுக்கேற்ற கண்ணியமான நடையிலும் அமைக்கப்பட்டது. எபிரெய வாக்கியத்தின் தொடர்ச்சியான இரு செயல்கள் அரைப்புள்ளியால் இணைக்கப்பட்டுள்ளன.
