base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/001.yaml
  text: And it happened[a], when all the kings who were beyond the Jordan—in the hill country, in the lowland, and along the whole coast of the Great Sea toward Lebanon—the Hittite, the Amorite, the Canaanite, the Perizzite, the Hivite, and the Jebusite—heard of it[c][b],
translation:
  language: ta
  text: 'இவ்வாறு நடந்தது: யோர்தானுக்கு அப்பால்[a] மலைப்பகுதியிலும், தாழ்நிலத்திலும்[b], லெபனோனை நோக்கிய பெருங்கடலின் கடற்கரை முழுவதிலும் இருந்த அனைத்து அரசர்களும்—ஏத்தியர், எமோரியர், கானானியர், பெரிசியர், ஏவியர், எபூசியர் ஆகியோர்—இதைக் கேள்விப்பட்டபோது[c],'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘யோர்தானுக்கு மறுபுறம்’ என்றும் மொழிபெயர்க்கலாம். எபிரேயச் சொற்றொடரின் நோக்குநிலையைப் பொறுத்து இருவிதமாகவும் பொருள் கொள்ளலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘ஷெபெலா பகுதியில்’ என்றும் மொழிபெயர்க்கலாம்; இது மேற்குப் பக்கத்திலுள்ள மேட்டடிவாரத் தாழ்நிலப் பகுதி.
    reason: cultural_note
  - marker: c
    text: எபிரேயத்தில் சொல்லுக்குச் சொல், ‘அரசர்கள் அனைவரும் ... கேள்விப்பட்டபோது.’ அவர்கள் எதைக் கேள்விப்பட்டார்கள் என்பது வெளிப்படையாகக் கூறப்படவில்லை; சூழலின் அடிப்படையில் தமிழில் ‘இதை’ சேர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: நடந்தது என்னவென்றால்—
  rationale: புதிய நிகழ்வை அறிமுகப்படுத்தும் எபிரேயக் கதைநடைச் சொல்லை நவீன தமிழில் இயல்பாகத் தருகிறது; அடுத்த வசனத்தில் நிறைவுறும் வாக்கியத் தொடரையும் பாதுகாக்கிறது.
- source_word: כִשְׁמֹעַ
  choice: இதைக் கேள்விப்பட்டபோது
  rationale: כ உடன் வரும் வினையெச்சப் பெயர்ச்சொல் காலச் சூழலைக் குறிக்கிறது. எபிரேயத்தில் கேள்விப்பட்டதன் பொருள் வெளிப்படையாகக் கூறப்படவில்லை; தமிழில் இயல்புக்காகச் சூழலிலிருந்து ‘இதை’ சேர்க்கப்பட்டுள்ளது.
- source_word: כָּל הַמְּלָכִים
  choice: அரசர்கள் அனைவரும்
  rationale: முழுமையைக் குறிக்கும் כָּל என்பதையும் பன்மையான ‘அரசர்கள்’ என்பதையும் தெளிவான தமிழ் வரிசையில் தருகிறது.
- source_word: אֲשֶׁר בְּעֵבֶר הַיַּרְדֵּן
  choice: யோர்தானுக்கு அப்பால் ... இருந்த
  rationale: בְּעֵבֶר என்பதன் இடஞ்சார்ந்த ‘அப்பால்/மறுபுறம்’ என்ற பொருளை, எந்தத் திசையென்று தீர்மானிக்காமல் பாதுகாக்கிறது.
- source_word: בָּהָר
  choice: மலைப்பகுதியில்
  rationale: இங்கு הַר தனிப்பட்ட மலையை அல்ல, மத்திய உயர்நிலப் புவிப்பகுதியைக் குறிக்கிறது.
- source_word: וּבַשְּׁפֵלָה
  choice: தாழ்நிலத்தில்
  rationale: שְׁפֵלָה குறிக்கும் தாழ்வான மேட்டடிவாரப் பகுதியை பொதுவாசகருக்குத் தெளிவாக மொழிபெயர்க்கிறது; இடப்பெயர் மாற்றுவடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: וּבְכֹל חוֹף הַיָּם הַגָּדוֹל
  choice: பெருங்கடலின் கடற்கரை முழுவதிலும்
  rationale: חוֹף என்பதன் ‘கடற்கரை’ பொருளையும் כֹל என்பதன் முழுமையையும் காக்கிறது; הַיָּם הַגָּדוֹל என்ற எபிரேயப் பெயரிடலை ‘பெருங்கடல்’ எனப் பாதுகாக்கிறது.
- source_word: אֶל מוּל הַלְּבָנוֹן
  choice: லெபனோனை நோக்கிய
  rationale: லெபனோனைச் சார்ந்த திசை அல்லது எதிர்நோக்கிய அமைவிடத்தைக் குறிக்கும் சொற்றொடரை இயல்பான தமிழில் தருகிறது.
- source_word: הַחִתִּי וְהָאֱמֹרִי הַכְּנַעֲנִי הַפְּרִזִּי הַחִוִּי וְהַיְבוּסִי
  choice: ஏத்தியர், எமோரியர், கானானியர், பெரிசியர், ஏவியர், எபூசியர் ஆகியோர்
  rationale: எபிரேயத்தில் ஒருமை வடிவில் வரும் இனப்பெயர்கள் கூட்டுப்பொருள் கொண்டதால், நவீன தமிழில் இயல்பான பன்மை இனப்பெயர்களாகத் தரப்பட்டுள்ளன.
