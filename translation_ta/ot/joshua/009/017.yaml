translation_notes:
  register: நவீன நிலையான தமிழில், கதையாடலுக்கேற்ற தெளிவான மற்றும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய இனக்குழுச் சொற்றொடர் முதன்மை உரையில் முறையாகப் பாதுகாக்கப்பட்டு, இயல்பான தமிழ் மாற்று அடிக்குறிப்பில் தரப்பட்டுள்ளது; இடப்பெயர்கள் மூல எபிரெய ஒலியமைப்பை அடிப்படையாகக் கொண்டு தமிழாக்கப்பட்டுள்ளன.
