base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/017.yaml
  text: So the sons of Israel set out and came to their cities on the third day[a]. Now their cities were Gibeon, Chephirah, Beeroth[b], and Kiriath-jearim.
translation:
  language: ta
  text: இஸ்ரவேலின் மகன்கள்[a] புறப்பட்டு, மூன்றாம் நாளில் அவர்களுடைய பட்டணங்களுக்கு வந்து சேர்ந்தார்கள். அவர்களுடைய பட்டணங்கள் கிபியோன், கெபிரா, பெயேரோத், கீரியத்-யெஆரீம் ஆகியவை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இஸ்ரவேலர்.” எபிரெய மூலத்தில், “இஸ்ரவேலின் மகன்கள்” என்று உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: புறப்பட்டு
  rationale: נסע என்ற வினை இங்கு பயணத்தைத் தொடங்கிப் புறப்படுவதைக் குறிக்கிறது; முகாம் தொடர்பான கருத்தைத் தேவையின்றி சேர்க்காமல் இயல்பாக மொழிபெயர்க்கிறது.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் மகன்கள்
  rationale: எபிரெயச் சொற்றொடரின் வடிவத்தை வெளிப்படையாகப் பாதுகாக்கிறது; இது வழக்கமான இனக்குழுப் பெயராகவும் பயன்படுவதால் ‘இஸ்ரவேலர்’ என்ற இயல்பான மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: וַיָּבֹאוּ אֶל עָרֵיהֶם
  choice: அவர்களுடைய பட்டணங்களுக்கு வந்து சேர்ந்தார்கள்
  rationale: בוא אֶל என்பதன் ‘அடைதல்/வந்து சேர்தல்’ பொருளை நவீனத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: בַּיּוֹם הַשְּׁלִישִׁי
  choice: மூன்றாம் நாளில்
  rationale: எபிரெயக் கதையாடலில் உள்ள நேரக் குறிப்பின் நேரடியான பொருளைப் பாதுகாக்கிறது.
- source_word: וְעָרֵיהֶם
  choice: அவர்களுடைய பட்டணங்கள் ... ஆகியவை
  rationale: இணைப்புச்சொல் இங்கு அடுத்துவரும் பட்டியலை அறிமுகப்படுத்தும் விளக்கக் கூற்றாக உள்ளது; தமிழில் தனி வாக்கியமாக அமைப்பது இயல்பானது.
- source_word: גִּבְעוֹן
  choice: கிபியோன்
  rationale: எபிரெய இடப்பெயரின் தமிழ்ச் சொற்பெயர்ப்பு.
- source_word: הַכְּפִירָה
  choice: கெபிரா
  rationale: எபிரெய மெய்யெழுத்து மற்றும் உயிரொலி அமைப்பைத் தமிழில் வாசிக்கத்தக்க வகையில் தரும் சொற்பெயர்ப்பு.
- source_word: בְּאֵרוֹת
  choice: பெயேரோத்
  rationale: எபிரெய இடப்பெயரின் உயிரொலிகளைத் தெளிவாகக் காட்டும் தமிழ்ச் சொற்பெயர்ப்பு.
- source_word: קִרְיַת יְעָרִים
  choice: கீரியத்-யெஆரீம்
  rationale: கூட்டுப் பெயரின் இரு கூறுகளையும் இணைப்புக்குறியுடன் பாதுகாக்கும் தமிழ்ச் சொற்பெயர்ப்பு.
