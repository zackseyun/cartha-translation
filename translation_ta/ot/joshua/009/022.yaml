- from: 'பின்பு யோசுவா அவர்களை அழைத்து, அவர்களிடம், “நாங்கள் உங்களிடமிருந்து வெகுதொலைவில் இருக்கிறோம் என்று சொல்லி எங்களை ஏன் ஏமாற்றினீர்கள்? நீங்களோ நம் நடுவில்[a] குடியிருக்கிறீர்களே!” என்றார்.


    [a] அல்லது, “நம்மிடையே.”'
  to: 'பின்பு யோசுவா அவர்களை அழைத்து, அவர்களிடம் கூறினார்: “நாங்கள் உங்களிடமிருந்து வெகுதொலைவில் இருக்கிறோம் என்று சொல்லி, நீங்கள் எங்கள் நடுவில் குடியிருக்கிறவர்களாயிருக்கும்போது, எங்களை ஏன் ஏமாற்றினீர்கள்?”


    [a] அல்லது, “எங்களிடையே.”'
  rationale: திருத்தம் மூல எபிரெயத்தின் ஒரே கேள்வி அமைப்பையும் வலுவான முரண்பாட்டையும் காக்கிறது; தேவையற்ற வியப்பு நிழலை நீக்குகிறது. ‘எங்கள்’ என்பது யோசுவா இஸ்ரவேலரைப் பிரதிநிதித்துவப்படுத்திப் பேசும் முதல் நபர் பன்மையுடன் ஒத்திசைகிறது. பொருளில் எந்த விளக்கவுரையோ உடன்படிக்கை சார்ந்த கூடுதல் கருத்தோ சேர்க்கப்படவில்லை.
