base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/022.yaml
  text: Then Joshua called for them and spoke to them[a], saying, “Why did you deceive us, saying, ‘We are very far from you,’ when you are living among us?”
translation:
  language: ta
  text: 'பின்பு யோசுவா அவர்களை அழைத்து, அவர்களிடம் கூறினார்: “நாங்கள் உங்களிடமிருந்து வெகுதொலைவில் இருக்கிறோம் என்று சொல்லி, நீங்கள் எங்கள் நடுவில் குடியிருக்கிறவர்களாயிருக்கும்போது, எங்களை ஏன் ஏமாற்றினீர்கள்?”


    [a] அல்லது, “எங்களிடையே.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எங்களிடையே.”
    reason: בְּקִרְבֵּנוּ என்பதற்கு ‘எங்கள் நடுவில்’ என்பதற்குச் சமமான இயல்பான இடவியல் மாற்று.
lexical_decisions:
- source_word: וַיִּקְרָא לָהֶם
  choice: அவர்களை அழைத்து
  rationale: இந்தச் சூழலில் קרא என்பது கிபியோனியரைத் தம்மிடம் அழைத்து அவர்களை எதிர்கொள்வதைக் குறிக்கிறது. தமிழில் ‘அவர்களை அழைத்து’ என்பது இயல்பாகவும் போதிய தெளிவுடனும் உள்ளது.
- source_word: וַיְדַבֵּר אֲלֵיהֶם לֵאמֹר
  choice: அவர்களிடம் ... என்றார்
  rationale: எபிரெய மொழியின் வழக்கமான உரை அறிமுகத்தைச் சொற்சுமை இல்லாத இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: לָמָּה
  choice: ஏன்
  rationale: காரணத்தை நேரடியாகக் கேட்கும் வினாச்சொல்லின் இயல்பான தமிழ் இணை.
- source_word: רִמִּיתֶם
  choice: ஏமாற்றினீர்கள்
  rationale: பீயேல் வடிவம் திட்டமிட்ட வஞ்சனையை உணர்த்துகிறது; ‘ஏமாற்றினீர்கள்’ என்பது தெளிவான, தற்போதைய நிலையான தமிழ்.
- source_word: רְחוֹקִים אֲנַחְנוּ מִכֶּם מְאֹד
  choice: நாங்கள் உங்களிடமிருந்து வெகுதொலைவில் இருக்கிறோம்
  rationale: מְאֹד தரும் வலியுறுத்தலை ‘வெகுதொலைவில்’ காக்கிறது; தொலைவின் தொடர்பை ‘உங்களிடமிருந்து’ துல்லியமாகத் தெரிவிக்கிறது.
- source_word: בְּקִרְבֵּנוּ
  choice: நம் நடுவில்
  rationale: ‘நமது மத்தியில்/நம்மிடையே’ என்ற இடவியல் பொருளை நேரடியாகக் காக்கும் இயல்பான தமிழ் சொற்றொடர்.
- source_word: יֹשְׁבִים
  choice: குடியிருக்கிறீர்கள்
  rationale: இங்கு ישב தற்காலிகமாக இருப்பதைவிட அப்பகுதியில் வசிப்பதைக் குறிக்கிறது; தொடர்நிலைப் பங்கேற்பு வடிவத்தின் நிகழ்கால வலிமையையும் இத்தேர்வு காக்கிறது.
theological_decisions:
- issue: உடன்படிக்கை சார்ந்த மறைமுகக் குற்றச்சாட்டை மொழிபெயர்ப்பில் விரிவாக்குதல்
  choice: புவியியல் தொலைவைப் பற்றிய பொய்யையும் அதனால் ஏற்பட்ட ஏமாற்றத்தையும் மட்டுமே நேரடியாக மொழிபெயர்த்தல்
  alternative: உடன்படிக்கையை மீறியதற்கான குற்றச்சாட்டை வசனத்திற்குள் வெளிப்படையாகச் சேர்த்தல்
  rationale: இந்த வசனம் அவர்கள் கூறிய பொய்யையும் உண்மையில் இஸ்ரவேலரின் நடுவில் குடியிருந்ததையும் மட்டுமே முன்வைக்கிறது. உடன்படிக்கை சார்ந்த விளைவுகள் சூழலில் இருந்தாலும், அவற்றை இவ்வசனத்தின் சொற்களுக்குள் சேர்ப்பது மிகைவிளக்கமாகும்.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையும் நேரடியான குற்றச்சாட்டின் வலிமையும் காக்கப்பட்டுள்ளன. இறுதியில் வரும் וְאַתֶּם என்பதன் எதிர்மறை மாறுபாட்டை ‘நீங்களோ’ என்றும், சொல்லப்படாத ஆனால் தெளிவாக உணரப்படும் முரண்பாட்டை ‘குடியிருக்கிறீர்களே!’ என்றும் இயல்பான தமிழில் வெளிப்படுத்தப்பட்டுள்ளது.
