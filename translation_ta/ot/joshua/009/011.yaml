base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/011.yaml
  text: So our elders and all the inhabitants of our land said to us[a], ‘Take provisions in your hand for the journey, and go to meet them. Say to them, “We are your servants”[b]; and now make a covenant with us.’
translation:
  language: ta
  text: எனவே எங்கள் மூப்பர்களும் எங்கள் நாட்டில் குடியிருக்கும் அனைவரும் எங்களிடம், ‘பயணத்திற்குத் தேவையான பொருள்களை எடுத்துக்கொண்டு, அவர்களைச் சந்திக்கச் செல்லுங்கள். அவர்களிடம், “நாங்கள் உங்கள் பணியாளர்கள்”[b] என்று சொல்லுங்கள். இப்போது எங்களுடன் ஓர் உடன்படிக்கை செய்யுங்கள்[a]’ என்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொற்சொல்லாக, ‘எங்களுக்காக ஓர் உடன்படிக்கையை வெட்டுங்கள்.’
    reason: lexical_alternative
  - marker: b
    text: ‘உங்கள் பணியாளர்கள்’ என்பது பணிவான அரசதந்திர மொழிநடையை வெளிப்படுத்துகிறது; இதற்கான எபிரெயச் சொல் வேறு சூழல்களில் ‘அடிமைகள்’ என்றும் பொருள்படும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: זְקֵינֵינוּ
  choice: எங்கள் மூப்பர்கள்
  rationale: இங்கு வயதான ஆண்களை மட்டும் அல்லாமல் சமூகத் தலைவர்களைக் குறிக்கும் என்பதால், இயல்பான சமூக-அரசியல் பொருளைத் தரும் ‘மூப்பர்கள்’ பயன்படுத்தப்பட்டது.
- source_word: יֹשְׁבֵי אַרְצֵנוּ
  choice: எங்கள் நாட்டில் குடியிருக்கும் அனைவரும்
  rationale: அந்நாட்டில் வாழும் மக்களின் ஒட்டுமொத்தக் குழுவை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: צֵידָה
  choice: பயணத்திற்குத் தேவையான உணவுப் பொருள்கள்
  rationale: இச்சொல் பயணத்துக்காக எடுத்துச் செல்லும் உணவு அல்லது provisions என்பதைக் குறிக்கிறது; சூழலில் உணவுப் பொருள்கள் என்பது தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: בְיֶדְכֶם
  choice: எடுத்துக்கொண்டு
  rationale: எபிரெய மொழியின் ‘உங்கள் கையில்’ என்ற concrete idiom தமிழில் சொற்சொல்லாகக் கடினமாக இருப்பதால், கையில் எடுத்துச் செல்வதைக் குறிக்கும் இயல்பான வினை வடிவில் தரப்பட்டது.
- source_word: לַדֶּרֶךְ
  choice: பயணத்திற்குத் தேவையான
  rationale: இங்கு דֶּרֶךְ என்பது சாலை என்பதைவிடப் பயணத்தைக் குறிக்கிறது; நோக்கத்தையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: לִקְרָאתָם
  choice: அவர்களைச் சந்திக்க
  rationale: ஒருவரை எதிர்கொண்டு சந்திக்கச் செல்வதைக் குறிக்கும் எளிய, நேரான தமிழ் இணைச்சொல்.
- source_word: עַבְדֵיכֶם
  choice: உங்கள் பணியாளர்கள்
  rationale: עבד என்பது வேறு சூழல்களில் அடிமைகளைக் குறிக்கலாம்; இங்கு உடன்படிக்கை கோரும் பணிவான அரசதந்திரப் பேச்சாக இருப்பதால் ‘பணியாளர்கள்’ தேர்ந்தெடுக்கப்பட்டது. சொல்லின் விரிவான பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: כִּרְתוּ לָנוּ בְרִית
  choice: எங்களுடன் ஓர் உடன்படிக்கை செய்யுங்கள்
  rationale: כרת ברית என்ற எபிரெய மரபுத்தொடர் சொற்சொல்லாக ‘உடன்படிக்கையை வெட்டுதல்’ என்றாலும், அதன் பொருளை இயல்பான தமிழில் ‘உடன்படிக்கை செய்தல்’ என்று தருகிறது; ‘உடன்படிக்கை’ என்ற வேதாகமக் கருத்தும் பாதுகாக்கப்படுகிறது.
- source_word: וְעַתָּה
  choice: இப்போது
  rationale: கோரிக்கைக்கான உரைமாற்றத்தைத் தெளிவாகக் காட்டுகிறது; தொடக்க இணைப்பின் ஓட்டம் முந்தைய வாக்கிய அமைப்பிலேயே இயல்பாக வெளிப்படுகிறது.
- source_word: וַיֹּאמְרוּ אֵלֵינוּ ... לֵאמֹר
  choice: எங்களிடம் ... என்றார்கள்
  rationale: எபிரெய மொழியின் உரையறிமுகச் சூத்திரத்தை இயல்பான தமிழ் நேர்கூற்றாக மாற்றுகிறது; கூறப்பட்ட உள்ளடக்கம் மேற்கோளில் முழுமையாக உள்ளது.
