  text: וַ/יַּ֥עַשׂ לָ/הֶ֖ם כֵּ֑ן וַ/יַּצֵּ֥ל אוֹתָ֛/ם מִ/יַּ֥ד בְּנֵֽי יִשְׂרָאֵ֖ל וְ/לֹ֥א הֲרָגֽוּ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/026.yaml
  text: So he did this for them[a], and he delivered them from the hand of the sons of Israel, and they did not kill them.
translation:
  language: ta
  text: அவர் அவர்களுக்கு அவ்வாறே செய்தார்; அவர் இஸ்ரவேலின் மகன்களின்[a] கையிலிருந்து அவர்களை விடுவித்தார்; அவர்கள் அவர்களைக் கொல்லவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘இஸ்ரவேலர்.’ எபிரெய உரையில் ‘இஸ்ரவேலின் மகன்கள்’ என்று உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ לָהֶם כֵּן
  choice: அவர் அவர்களுக்கு அவ்வாறே செய்தார்
  rationale: עשה ... כן என்பதன் ‘அவ்வாறு செய்’ என்ற பொருளையும், முந்தைய சூழலைத் திரும்பச் சுட்டும் தன்மையையும் இயல்பான தமிழில் காக்கிறது.
- source_word: וַיַּצֵּל
  choice: விடுவித்தார்
  rationale: Hiphil வடிவிலுள்ள נצל, ஆபத்து அல்லது பிறரின் அதிகாரத்திலிருந்து மீட்டல்/விடுவித்தல் என்பதைக் குறிக்கிறது; தொடரும் ‘கையிலிருந்து’ என்ற சொல்லாட்சியுடன் ‘விடுவித்தார்’ இயல்பாக அமைகிறது.
- source_word: מִיַּד
  choice: கையிலிருந்து
  rationale: அதிகாரம் அல்லது கட்டுப்பாட்டைக் குறிக்கும் எபிரெய உருவகத்தை விளக்கவுரையாக மாற்றாமல் பாதுகாக்கிறது.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் மகன்கள்
  rationale: எபிரெய உரையின் ஆண்பால் பன்மை அமைப்பை நேரடியாகக் காக்கிறது; ‘இஸ்ரவேலர்’ என்பது இயல்பான மாற்று.
- source_word: וְלֹא הֲרָגוּם
  choice: அவர்கள் அவர்களைக் கொல்லவில்லை
  rationale: הרג என்பதன் நேரடியான ‘கொல்’ என்ற பொருளையும், பன்மை எழுவாயையும் பன்மை செயப்படுபொருளையும் காக்கிறது.
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל என்ற பாலினக் குறியீடுள்ள தேசியப் பெயர்
  choice: இஸ்ரவேலின் மகன்கள்
  alternative: இஸ்ரவேலர்
  rationale: இது வழக்கமான தேசியக் குழுப்பெயராக இருந்தாலும், மூலத்தில் உள்ள ‘மகன்கள்’ என்ற வெளிப்பாட்டை முதன்மை உரை காக்கிறது; மேலும் இயல்பான தேசியப் பெயர் அடிக்குறிப்பில் வழங்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் கண்ணியமான, தெளிவான நடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய வாக்கியத் தொடர்களை அரைப்புள்ளிகளால் பிரித்து வாசிப்புத் தெளிவு அளிக்கப்பட்டுள்ளது; ‘கையிலிருந்து’ என்ற மூல உருவகம் பாதுகாக்கப்பட்டுள்ளது.
