revisions:
- from: ஆகவே, இப்போது நீங்கள் சபிக்கப்பட்டவர்கள். என் கடவுளின் இல்லத்திற்காக அடிமைகளாக இருந்து, விறகு வெட்டித் தண்ணீர் இறைப்பவர்கள் உங்களிடையே ஒருபோதும் இல்லாமல் போகமாட்டார்கள்.[a]
  to: இப்போதோ, நீங்கள் சபிக்கப்பட்டவர்கள்; என் கடவுளின் இல்லத்திற்காக அடிமைகளாக விறகு வெட்டுபவர்களாகவும் தண்ணீர் இறைப்பவர்களாகவும் இருப்போர் உங்களிடமிருந்து ஒருபோதும் ஒழிந்துபோகமாட்டார்கள்.[a]
  rationale: The revision keeps the source’s ambiguity about the precise institutional form of God’s ‘house’ and retains the severe bonded status denoted by עֶבֶד. It improves Tamil syntax by making the servants, woodcutters, and water drawers a single continuing class, corresponding to the Hebrew’s collective singular and its ‘not be cut off from among you’ formulation.
