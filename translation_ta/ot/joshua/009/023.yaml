base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/023.yaml
  text: So now you are cursed[a], and there shall never cease to be from among you servants, cutters of wood and drawers of water for the house of my God.
translation:
  language: ta
  text: இப்போதோ, நீங்கள் சபிக்கப்பட்டவர்கள்; என் கடவுளின் இல்லத்திற்காக அடிமைகளாக விறகு வெட்டுபவர்களாகவும் தண்ணீர் இறைப்பவர்களாகவும் இருப்போர் உங்களிடமிருந்து ஒருபோதும் ஒழிந்துபோகமாட்டார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'சொல்லுக்குச் சொல் முறையில்: “உங்களிடமிருந்து ஒரு அடிமை ஒழிந்துபோக மாட்டான்.” எபிரெயத்தில் ஒருமையாக உள்ள “அடிமை” இங்கே கூட்டாகப் பயன்படுத்தப்பட்டுள்ளது; அவர்களுடைய மக்களிலிருந்து இப்பணியைச் செய்வோர் தொடர்ந்து இருப்பார்கள் என்பதே கருத்து.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: ஆகவே, இப்போது
  rationale: முந்தைய தீர்ப்பிலிருந்து அதன் விளைவுக்கு நகர்த்தும் உரையாடல் தொடர்பையும் ‘இப்போது’ என்ற காலச் சுட்டையும் இயல்பான தமிழில் காக்கிறது.
- source_word: אֲרוּרִים
  choice: சபிக்கப்பட்டவர்கள்
  rationale: பன்மை எழுவாயைக் குறிக்கும் பயனிலைப் பெயரடையின் நேரடியான, இயல்பான தமிழ் வடிவம்.
- source_word: וְלֹא יִכָּרֵת מִכֶּם עֶבֶד
  choice: அடிமைகளாக இருந்து ... உங்களிடையே ஒருபோதும் இல்லாமல் போகமாட்டார்கள்
  rationale: כרת என்ற வினையின் நிபால் வடிவமும் מן முன்னொட்டும் ‘உங்களிடமிருந்து ஒழிந்துபோகாதிருத்தல்’ என்ற தொடரும் நிலையைத் தருகின்றன. எபிரெயத்தில் ஒருமையாக உள்ள עֶבֶד இங்கு குழுவைக் குறிக்கும் வகையில் வருவதால், அவர்களுடைய மக்களிடையே இந்த அடிமைப் பணி தொடர்ந்து இருக்கும் கருத்தைத் தெளிவாகத் தருகிறது.
- source_word: עֶבֶד
  choice: அடிமைகள்
  rationale: இது சுமத்தப்பட்ட கீழ்ப்படிதல் நிலையைக் குறிக்கிறது; ‘பணியாளர்கள்’ என்று மென்மைப்படுத்தாமல் அதன் கடுமையைப் பாதுகாக்கிறது.
- source_word: חֹטְבֵי עֵצִים
  choice: விறகு வெட்டுபவர்கள்
  rationale: ஒதுக்கப்பட்ட உடல் உழைப்பைச் சித்தரிக்கும் பங்கேற்பு வடிவத்தை நவீன, தெளிவான தமிழில் தருகிறது.
- source_word: שֹׁאֲבֵי מַיִם
  choice: தண்ணீர் இறைப்பவர்கள்
  rationale: கிணறு அல்லது நீர்நிலையிலிருந்து தண்ணீர் எடுக்கும் குறிப்பிட்ட பணியை இயல்பான தமிழில் குறிக்கிறது.
- source_word: לְבֵית אֱלֹהָי
  choice: என் கடவுளின் இல்லத்திற்காக
  rationale: בַּיִת என்பதன் ‘இல்லம்’ என்ற உருவகத்தைப் பாதுகாத்து, இச்சூழலில் வழிபாட்டிடத்தைக் குறிக்க அனுமதிக்கிறது; ‘ஆலயம்’ என்று மொழிபெயர்த்து பின்னாளைய கட்டிடக் கருத்தைத் தேவையின்றி முன்வைப்பதைத் தவிர்க்கிறது.
theological_decisions:
- issue: யோசுவாவின் சாபத்தில் சுமத்தப்பட்ட பணிநிலையை மொழிபெயர்த்தல்
  choice: அடிமைகள்
  alternative: பணியாளர்கள்
  rationale: இவ்வசனம் சுதந்திரமாகத் தேர்ந்தெடுத்த சேவையை அல்ல, தலைமுறையாகத் தொடரும் கட்டாயக் கீழ்நிலை உழைப்பை விவரிக்கிறது. ஆகவே ‘அடிமைகள்’ என்பது உரையின் கடுமையை மறைக்காமல் காட்டுகிறது.
- issue: ‘என் கடவுளின் வீடு’ என்பதன் குறிப்பு
  choice: என் கடவுளின் இல்லம்
  alternative: என் கடவுளின் ஆலயம்
  rationale: சூழல் வழிபாட்டிடத்தைக் குறித்தாலும், மூலத்தின் בַּיִת என்ற சொல்லுருவை வைத்திருப்பது கூடாரமா கட்டப்பட்ட ஆலயமா என்பதை மொழிபெயர்ப்பிலேயே மிகையாகத் தீர்மானிக்காமல் விடுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், எளிதில் புரியும் அதேவேளையில் தீர்ப்புரைக்கேற்ற கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. ‘அடிமை’ என்ற சொல் உரையின் கடுமையைப் பாதுகாக்கிறது; ‘விறகு வெட்டுதல்’, ‘தண்ணீர் இறைத்தல்’ ஆகியவை தெளிவான அன்றாடச் செயல்களாக வழங்கப்பட்டுள்ளன.
