base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/012.yaml
  text: This bread of ours was warm when we took it as our provisions from our houses on the day we set out to come to you[a], but now, look, it is dry and has become moldy.
translation:
  language: ta
  text: நாங்கள் உங்களிடம் வருவதற்காகப் புறப்பட்ட நாளில், எங்கள் வீடுகளிலிருந்து பயண உணவாக எடுத்துக்கொண்ட எங்களுடைய இந்த அப்பம் சூடாக இருந்தது. ஆனால் இப்போதோ பாருங்கள், இது காய்ந்து, புள்ளிகள் படிந்ததாகிவிட்டது.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘பூஞ்சை பிடித்ததாகிவிட்டது,’ ‘வெடிப்புகள் ஏற்பட்டதாகிவிட்டது,’ அல்லது ‘உதிரும் நிலையாயிற்று’ என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் புள்ளிகள் அல்லது தழும்புகள் படிந்த ஒன்றைக் குறிக்கிறது; பழைய அப்பத்தைப் பற்றிய இச்சூழலில் அது பூஞ்சைப் புள்ளிகளையா, வெடிப்புகளையா, அல்லது உதிரும் நிலையையா குறிக்கிறது என்பது உறுதியாகத் தெரியவில்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֶה לַחְמֵנוּ
  choice: இந்த அப்பம்
  rationale: சுட்டுப்பெயர் முன்வைக்கும் கண்முன் உள்ள சான்றை இயல்பான தமிழில் நேரடியாகக் காட்டுகிறது; முதலாம் பன்மை உடைமை பின்னுள்ள சூழலில் தெளிவாக இருப்பதால் தேவையற்ற சுமை தவிர்க்கப்படுகிறது.
- source_word: חָם
  choice: சூடாக இருந்தது
  rationale: எபிரெய உரையின் நேரடியான பொருளைத் தக்கவைக்கிறது; ‘புதிதாக இருந்தது’ என்பது உட்கருத்தை மட்டும் வெளிப்படுத்தும் விளக்க மொழிபெயர்ப்பாகிவிடும்.
- source_word: הִצְטַיַּדְנוּ אֹתוֹ
  choice: பயண உணவாக எடுத்துவந்த
  rationale: பயணத்திற்குத் தேவையான உணவை ஆயத்தமாக எடுத்துக்கொள்ளுதல் என்ற வினையின் பொருளை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: מִבָּתֵּינוּ
  choice: எங்கள் வீடுகளிலிருந்து
  rationale: மூலத்தின் பன்மை வடிவத்தையும் உடைமைப் பொருளையும் நேரடியாகப் பாதுகாக்கிறது.
- source_word: בְּיוֹם צֵאתֵנוּ לָלֶכֶת אֲלֵיכֶם
  choice: நாங்கள் உங்களிடம் வருவதற்காகப் புறப்பட்ட நாளில்
  rationale: புறப்பாட்டின் காலத்தையும் பயணத்தின் இலக்கையும் தெளிவான தமிழ் வாக்கிய அமைப்பில் தருகிறது.
- source_word: וְעַתָּה הִנֵּה
  choice: ஆனால் இப்போதோ பாருங்கள்
  rationale: முன்னைய நிலையுடன் உள்ள முரண்பாட்டையும், காட்டப்படும் தற்போதைய சான்றின் மீது கவனம் ஈர்க்கும் הִנֵּה என்பதன் வலியுறுத்தலையும் தக்கவைக்கிறது.
- source_word: יָבֵשׁ
  choice: காய்ந்து
  rationale: அப்பத்தின் தற்போதைய உலர்ந்த நிலையை இயல்பாகக் குறிக்கிறது.
- source_word: וְהָיָה נִקֻּדִים
  choice: புள்ளிகள் விழுந்ததாகிவிட்டது
  rationale: נִקֻּדִים என்பதன் அடிப்படையான ‘புள்ளிகள் அல்லது தழும்புகள் கொண்டது’ என்ற பொருளைப் பாதுகாத்து, அது பூஞ்சையா, வெடிப்பா, உதிரும் நிலையா என்பதைத் தீர்மானிக்காமல் விடுகிறது.
