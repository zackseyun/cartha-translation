base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/010.yaml
  text: and all that he did to the two kings of the Amorites who were beyond the Jordan—to Sihon king of Heshbon and to Og king of Bashan[b][a], who was at Ashtaroth—
translation:
  language: ta
  text: மேலும், யோர்தானுக்கு அப்பால்[a] இருந்த எமோரியரின் இரண்டு ராஜாக்களுக்கு அவர் செய்த அனைத்தையும்—எஸ்போன் ராஜாவான சீகோனுக்கும், அஸ்தரோத்தில்[b] இருந்த பாசான் ராஜாவான ஓகுக்கும்—நாங்கள் கேள்விப்பட்டோம்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘யோர்தானின் மறுபுறத்தில்.’
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘அஸ்தரோத்தில் இருந்தவர்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵת כָּל אֲשֶׁר עָשָׂה
  choice: மேலும் ... அவர் செய்த அனைத்தையும்
  rationale: וְ தொடரும் பட்டியலை இணைக்கிறது; אֵת தமிழில் தனியே மொழிபெயர்க்கப்படாமல் வேற்றுமை உருபால் வெளிப்படுகிறது. כָּל אֲשֶׁר עָשָׂה என்பது இயல்பாக ‘அவர் செய்த அனைத்தையும்’ என வழங்கப்படுகிறது; முந்தைய வசனத்திலிருந்து வரும் ‘கேள்விப்பட்டோம்’ என்ற வினை தமிழில் முழுமையான வாக்கியத்திற்காக வெளிப்படையாகச் சேர்க்கப்பட்டுள்ளது.
- source_word: לִשְׁנֵי מַלְכֵי הָאֱמֹרִי
  choice: எமோரியரின் இரண்டு ராஜாக்களுக்கு
  rationale: לְ என்பது இங்கு ஒருவருக்கு என்ன செய்யப்பட்டது என்பதைச் சுட்டுகிறது. ‘எதிராக’ என்று பொருள் விரிவாக்காமல், மூலத்தின் அமைப்பை நெருக்கமாகப் பாதுகாக்கிறது.
- source_word: אֲשֶׁר בְּעֵבֶר הַיַּרְדֵּן
  choice: யோர்தானுக்கு அப்பால் இருந்த
  rationale: בְּעֵבֶר என்பது பேச்சாளரின் நிலவியல் நோக்கிலிருந்து ‘அப்பால்/மறுபுறம்’ என்பதைக் குறிக்கிறது. ‘அப்பால்’ சுருக்கமாகவும் இயல்பாகவும் உள்ளது; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: לְסִיחוֹן מֶלֶךְ חֶשְׁבּוֹן
  choice: எஸ்போனின் ராஜா சீகோனுக்கும்
  rationale: அரசப் பட்டமும் இடப்பெயரும் தமிழின் இயல்பான உடைமை அமைப்பில் வழங்கப்பட்டுள்ளன; பெயர்கள் எபிரெய ஒலிவடிவத்தைப் பின்பற்றித் தமிழாக்கப்பட்டுள்ளன.
- source_word: וּלְעוֹג מֶלֶךְ הַבָּשָׁן
  choice: பாசானின் ராஜா ஓகுக்கும்
  rationale: முந்தைய அரசரைச் சொல்லும் தொடருக்கு இணையான தமிழமைப்பு பயன்படுத்தப்பட்டுள்ளது.
- source_word: אֲשֶׁר בְּעַשְׁתָּרוֹת
  choice: அஸ்தரோத்தில் இருந்த
  rationale: தொடர்புச் சொற்றொடர் இயல்பாக ஓகைச் சுட்டுகிறது. בְּ என்பது இங்கு ‘இல்/இடத்தில்’ என்ற இடப்பொருளில் வழங்கப்படுகிறது; அதன் சிறிய பொருள் வேறுபாடு அடிக்குறிப்பில் குறிப்பிடப்படுகிறது.
theological_decisions:
- issue: עָשָׂה என்ற வினையின் மறைந்த எழுவாய்
  choice: ‘அவர்’ என்று மட்டும் வைத்து, முந்தைய சூழல் அதன் சுட்டுப்பொருளைத் தீர்மானிக்க விடப்பட்டது.
  alternative: ‘யெகோவா செய்த’ என்று தெய்வீகப் பெயரை வெளிப்படையாகச் சேர்த்தல்.
  rationale: இந்த வசனத்தில் எபிரெய வினை மூன்றாம் நபர் ஆண்பால் ஒருமையில் இருந்தாலும் எழுவாய் வெளிப்படையாக இல்லை. முந்தைய சூழல் கர்த்தரைக் குறிக்கிறது; இருப்பினும் மூலத்தில் இல்லாத தெய்வீகப் பெயரைச் சேர்க்காமல் அதன் இலக்கண வடிவமும் சூழல் சார்பும் பாதுகாக்கப்படுகின்றன.
translation_notes:
  register: நவீனத் தரத் தமிழ்; சாதாரண வாசகர்களுக்கு தெளிவாகவும், வேதாகம உரைக்கு ஏற்ற கண்ணியத்துடனும் அமைக்கப்பட்டுள்ளது. வசனம் முந்தைய வசனத்திலிருந்து தொடரும் பட்டியல் என்பதால், தமிழில் தனித்து வாசிக்க இலக்கண முழுமை பெற ‘கேள்விப்பட்டோம்’ சூழலிலிருந்து மீளக் கூறப்பட்டுள்ளது. ‘ராஜா’ பொதுவாகப் புரியும் மரியாதைமிக்க சொலாகத் தேர்ந்தெடுக்கப்பட்டது.
