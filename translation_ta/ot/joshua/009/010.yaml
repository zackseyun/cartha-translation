revisions:
- from: மேலும், யோர்தானுக்கு அப்பால்[a] இருந்த எமோரியரின் இரண்டு ராஜாக்களான எஸ்போனின் ராஜா சீகோனுக்கும், அஸ்தரோத்தில்[b] இருந்த பாசானின் ராஜா ஓகுக்கும் அவர் செய்த அனைத்தையும் பற்றிக் கேள்விப்பட்டோம்.
  to: மேலும், யோர்தானுக்கு அப்பால்[a] இருந்த எமோரியரின் இரண்டு ராஜாக்களுக்கு அவர் செய்த அனைத்தையும்—எஸ்போன் ராஜாவான சீகோனுக்கும், அஸ்தரோத்தில்[b] இருந்த பாசான் ராஜாவான ஓகுக்கும்—நாங்கள் கேள்விப்பட்டோம்.
  rationale: The revision retains every source element and the contextually resumed ‘we heard,’ while making the relation of Sihon and Og to ‘the two kings of the Amorites’ immediately clear. Footnote a retains the legitimate geographical alternative. Footnote b keeps the locative alternative neutral, without implying that Og necessarily resided there.
