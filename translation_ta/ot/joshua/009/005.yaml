translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையில் கண்ணியமான நடையில் அமைக்கப்பட்டது. காலணி, உடை, அப்பம் ஆகிய மூலத்தின் காட்சிசார் விவரங்கள் பாதுகாக்கப்பட்டுள்ளன; அரிதான இறுதிச் சொல்லின் தெளிவின்மை அடிக்குறிப்பில் வெளிப்படையாகத் தரப்பட்டுள்ளது.
