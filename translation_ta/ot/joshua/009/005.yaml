base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/005.yaml
  text: They had worn-out and patched sandals on their feet[a], and worn-out clothes on themselves; and all the bread of their provision was dry and crumbly.
translation:
  language: ta
  text: அவர்களுடைய கால்களில் தேய்ந்துபோன, ஒட்டுப்போடப்பட்ட செருப்புகள் இருந்தன; அவர்கள் அணிந்திருந்த உடைகளும் தேய்ந்துபோயிருந்தன. அவர்களுடைய உணவுப்பொருளான அப்பம் அனைத்தும் உலர்ந்து நொறுங்கிப்போயிருந்தது.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பூஞ்சை பிடித்திருந்தது.” “நொறுங்கிப்போயிருந்தது” என்று மொழிபெயர்க்கப்பட்டுள்ள எபிரேயச் சொல் அரிதானது. அது உலர்ந்து துண்டுகளாக நொறுங்கிய அப்பத்தைக் குறிக்கலாம்; சிலர் அதை “பூஞ்சை பிடித்த” என்று புரிந்துகொள்கிறார்கள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: נְעָלוֹת
  choice: செருப்புகள்
  rationale: பண்டைய அண்மைக் கிழக்கின் காலணியை இயல்பாகவும் குறிப்பாகவும் குறிக்கிறது.
- source_word: בָּלוֹת
  choice: தேய்ந்துபோன
  rationale: வயதாலும் பயன்பாட்டாலும் பழுதடைந்த நிலையைக் காட்டுகிறது; வெறுமனே ‘பழைய’ என்பதைக் காட்டிலும் துல்லியமானது.
- source_word: מְטֻלָּאוֹת
  choice: ஒட்டுப்போடப்பட்ட
  rationale: துண்டுகளை ஒட்டி அல்லது தைத்து பழுதுபார்க்கப்பட்ட காலணிகள் என்ற செயல்பாட்டு பொருளைத் தெளிவாகத் தருகிறது.
- source_word: בְּרַגְלֵיהֶם
  choice: அவர்களுடைய கால்களில்
  rationale: எபிரேய இடப்பொருளையும் காட்சித் தெளிவையும் நேரடியாகப் பாதுகாக்கிறது.
- source_word: שְׂלָמוֹת
  choice: உடைகள்
  rationale: குறிப்பிட்ட ஓர் ஆடை வகையைத் தேவையின்றி நிர்ணயிக்காமல் பொதுவான ஆடைகளைக் குறிக்கிறது.
- source_word: עֲלֵיהֶם
  choice: அவர்கள்மேல்
  rationale: அவர்கள் அணிந்திருந்த உடைகளைக் குறிக்கும் மூலத்தின் உடல்சார் படிமத்தைப் பாதுகாக்கிறது.
- source_word: לֶחֶם צֵידָם
  choice: அவர்களுடைய பயண உணவுக்கான அப்பம்
  rationale: ‘அப்பம்’ என்ற மூலத்தின் தெளிவான பொருளையும், அது பயணத்திற்காக எடுத்துச் செல்லப்பட்ட உணவுப் பொருள் என்பதையும் இயல்பான தமிழில் தருகிறது.
- source_word: יָבֵשׁ הָיָה
  choice: காய்ந்து ... நிலையில் இருந்தது
  rationale: அப்பத்தின் உலர்ந்த நிலையைக் குறிக்கும் எபிரேய நிலைமைக் கட்டமைப்பைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: נִקֻּדִים
  choice: நொறுங்கும் நிலையில்
  rationale: அரிதான சொல்லை, உலர்ந்து துண்டுகளாகும் அப்பம் என்ற சாத்தியமான சூழல்சார் பொருளில் மொழிபெயர்க்கிறது; சொல்லின் நிச்சயமின்மை அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
