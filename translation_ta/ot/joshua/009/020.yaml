source:
  edition: WLC
  text: זֹ֛את נַעֲשֶׂ֥ה לָ/הֶ֖ם וְ/הַחֲיֵ֣ה אוֹתָ֑/ם וְ/לֹֽא יִֽהְיֶ֤ה עָלֵ֨י/נוּ֙ קֶ֔צֶף עַל הַ/שְּׁבוּעָ֖ה אֲשֶׁר נִשְׁבַּ֥עְנוּ לָ/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/020.yaml
  text: This is what we will do to them and let them live[b][a], so that wrath may not come upon us because of the oath that we swore to them.
translation:
  language: ta
  text: 'நாம் அவர்களுக்கு இதைச் செய்வோம்: அவர்களை உயிரோடு விடுவோம்[a]; நாம் அவர்களுக்கு அளித்த உறுதிமொழியின் காரணமாகக் கடுங்கோபம்[b] நம்மேல் வராதபடி.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்களை உயிருடன் காப்போம்” அல்லது “அவர்களைக் கொல்லாமல் விடுவோம்.”
    reason: lexical_alternative
  - marker: b
    text: சூழலின்படி இது இறைவனுடைய கடுங்கோபமாக இருக்க வாய்ப்புள்ளது; எனினும் எபிரெய உரை இங்கு “ஆண்டவரின் கடுங்கோபம்” என்று வெளிப்படையாகக் கூறவில்லை.
    reason: alternative_reading
lexical_decisions:
- source_word: זֹאת נַעֲשֶׂה לָהֶם
  choice: நாம் அவர்களுக்கு இதைச் செய்து
  rationale: זֹאת முன்மொழியப்படும் நடவடிக்கையைச் சுட்டுகிறது; נַעֲשֶׂה இச்சூழலில் நோக்கமுள்ள எதிர்காலச் செயலைக் குறிக்கிறது. அடுத்த கூறுடன் இயல்பாக இணைவதற்காகத் தமிழில் வினையெச்ச வடிவம் பயன்படுத்தப்பட்டது.
- source_word: וְהַחֲיֵה אֹתָם
  choice: அவர்களை உயிரோடு விடுவோம்
  rationale: חיה என்பதன் Hiphil வடிவம் ‘உயிரோடு இருக்க விடுதல்’ அல்லது ‘உயிரைக் காத்தல்’ என்று பொருள்படும். ‘உயிரோடு விடுவோம்’ என்பது இங்கு இயல்பாகவும், ‘தப்பவிடுவோம்’ போன்ற அதிக விளக்கத்தன்மையுள்ள சொல்லைவிட மூலத்திற்கு நெருக்கமாகவும் உள்ளது.
- source_word: וְלֹא יִהְיֶה עָלֵינוּ קֶצֶף
  choice: கடுங்கோபம் நம்மேல் வராதபடி
  rationale: קֶצֶף தீவிரமான கோபத்தைக் குறிக்கிறது; היה ... על அமைப்பு எச்சரிக்கைச் சூழலில் அது ஒருவர்மேல் வருவதை உணர்த்துகிறது. முந்தைய நடவடிக்கையின் நோக்கம் அல்லது எதிர்பார்க்கப்படும் விளைவைத் தமிழில் இயல்பாக வெளிப்படுத்த ‘வராதபடி’ பயன்படுத்தப்பட்டது.
- source_word: עַל הַשְּׁבוּעָה
  choice: ஆணையின் காரணமாக
  rationale: עַל இங்கு அஞ்சப்படும் கோபத்திற்கான காரணத்தைக் குறிக்கிறது. שְׁבוּעָה என்பது உறுதிமொழியாகச் செய்யப்பட்ட ஆணை; ‘ஆணை’ நவீனத் தமிழில் சுருக்கமாகவும் மரியாதைமிக்கதாகவும் உள்ளது.
- source_word: אֲשֶׁר נִשְׁבַּעְנוּ לָהֶם
  choice: நாம் அவர்களுக்குச் செய்த
  rationale: שׁבע என்பதன் Niphal வடிவமும் לָהֶם என்பதும் அவர்களுக்குச் செய்யப்பட்ட ஆணையைக் குறிக்கின்றன. பெயரெச்சத் தொடராக அமைத்தல் தமிழில் இயல்பானது.
theological_decisions:
- issue: ஆணையை மீறுவதால் ஏற்படக்கூடிய קֶצֶף யாருடைய கோபம் என்பது
  choice: முதன்மை உரையில் ‘கடுங்கோபம்’ என்று மட்டும் மொழிபெயர்க்கப்பட்டது.
  alternative: ‘ஆண்டவரின் கடுங்கோபம்’ என்று வெளிப்படையாகக் குறிப்பிடுதல்.
  rationale: சூழலில் இது இறைவனுடைய கோபமாக இருக்க வாய்ப்புள்ளது; ஆனால் இவ்வசனத்தின் எபிரெய உரை இறைவனை வெளிப்படையாகப் பெயரிடவில்லை. ஆகவே அந்த உட்குறிப்பை விளக்கக் குறிப்பில் தெரிவித்தும், முதன்மை உரையின் மெய்யான தெளிவின்மையைப் பேணியும் மொழிபெயர்க்கப்பட்டது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் மரியாதைமிக்க நடையில் அமைக்கப்பட்டது. எபிரெயத் தொடரின் இணைப்பைத் தக்கவைக்க முதல் இரண்டு செயல்கள் வினையெச்சம் மற்றும் முற்றுவினையால் இணைக்கப்பட்டுள்ளன; நோக்கம்/விளைவு உறவு ‘வராதபடி’ மூலம் இயல்பாக வெளிப்படுத்தப்பட்டுள்ளது.
