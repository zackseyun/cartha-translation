base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/015.yaml
  text: So Joshua made peace with them and made a covenant with them to let them live[c][b][a], and the leaders of the congregation swore to them.
translation:
  language: ta
  text: யோசுவா அவர்களோடு சமாதானம் செய்து, அவர்களை உயிரோடு விடுவதற்காக அவர்களோடு ஓர் உடன்படிக்கை செய்தார்; சமூகத்தின் தலைவர்களும் அவர்களுக்குச் சத்தியம் செய்தார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ לָהֶם ... שָׁלוֹם
  choice: அவர்களோடு சமாதானம் செய்தார்
  rationale: எபிரேய மரபுத்தொடர் அமைதியான உறவை ஏற்படுத்துவதைக் குறிக்கிறது. நவீன தமிழில் ‘சமாதானம் செய்தார்’ என்பது இயல்பாகவும் அரசியல்-உடன்படிக்கைச் சூழலுக்கு ஏற்றவாறும் உள்ளது.
- source_word: וַיִּכְרֹת לָהֶם בְּרִית
  choice: அவர்களோடு ஓர் உடன்படிக்கை செய்தார்
  rationale: சொல்லுக்குச் சொல் ‘உடன்படிக்கையை வெட்டினார்’ என்ற எபிரேய மரபுத்தொடரைத் தமிழில் அப்படியே வழங்குவது இயல்பற்றது; ‘உடன்படிக்கை செய்தார்’ அதன் சட்டப்பூர்வமான பொருளைத் தெளிவாகக் காக்கிறது.
- source_word: לְחַיּוֹתָם
  choice: அவர்களை உயிரோடு விடுவதற்காக
  rationale: இந்த நோக்கவினையெச்சம் உடன்படிக்கையின் நோக்கம் அவர்களைக் கொல்லாமல் உயிருடன் விடுவதே என்பதைக் குறிக்கிறது. தேர்வு மூலத்தின் நோக்கத்தையும் செயப்படுபொருளையும் வெளிப்படையாகக் காக்கிறது.
- source_word: וַיִּשָּׁבְעוּ לָהֶם
  choice: அவர்களுக்கு ஆணையிட்டுக் கொடுத்தார்கள்
  rationale: שבע என்பது இங்கு உறுதிமொழியாக ஆணையிடுவதைக் குறிக்கிறது. ‘ஆணையிட்டுக் கொடுத்தார்கள்’ என்பது அவர்கள் அந்த மக்களுக்கு அளித்த கட்டுப்படுத்தும் உறுதிமொழியை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: נְשִׂיאֵי הָעֵדָה
  choice: சபையின் தலைவர்கள்
  rationale: נְשִׂיאִים அங்கீகரிக்கப்பட்ட தலைவர்களையும் עֵדָה ஒன்றுகூடிய சமூகத்தையும் குறிக்கின்றன. ‘சபை’ இங்கு பிற்காலத் திருச்சபை என்ற சிறப்புப் பொருளை அல்ல, ஒன்றுகூடிய இஸ்ரவேல் சமூகத்தைக் குறிக்கிறது.
theological_decisions:
- issue: உடன்படிக்கை மரபுத்தொடரின் மொழிபெயர்ப்பு
  choice: உடன்படிக்கை செய்தார்
  alternative: உடன்படிக்கையை வெட்டினார்
  rationale: எபிரேயத்தின் உருவகத்தைச் சொல்லுக்குச் சொல் கொண்டு வராமல், அதன் சட்ட-இறையியல் தன்மையை இயல்பான தமிழில் காக்கிறது.
- issue: הָעֵדָה என்பதன் மொழிபெயர்ப்பு
  choice: சபை
  alternative: கூட்டம் / சமூகம்
  rationale: இது ஒன்றுகூடிய உடன்படிக்கைச் சமூகத்தைக் குறிக்கிறது. ‘சபை’ அந்தக் கூட்டு அடையாளத்தைச் சுருக்கமாகக் காக்கிறது; அதனை கிறிஸ்தவத் திருச்சபை என்ற பிற்கால அமைப்பாக வாசிக்கக் கூடாது.
- issue: தலைவர்கள் செய்த செயலின் தன்மை
  choice: ஆணையிட்டுக் கொடுத்தார்கள்
  alternative: அவர்களுக்கு ஆணையிட்டார்கள்
  rationale: மூலத்தில் சத்தியத்தின் உள்ளடக்கம் வெளிப்படையாகச் சொல்லப்படவில்லை. ‘கொடுத்தார்கள்’ என்பது உறுதிமொழியின் திசையை இயல்பாகக் காட்டுகிறது; ஆனால் கூடுதல் வாக்குறுதி உள்ளடக்கத்தைச் சேர்ப்பதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், கண்ணியமான வரலாற்று-சட்ட நடையுடன் மொழிபெயர்க்கப்பட்டுள்ளது. ‘சமாதானம்’, ‘உடன்படிக்கை’, ‘ஆணையிட்டுக் கொடுத்தார்கள்’ ஆகியவை மூலத்தின் அரசியல் மற்றும் உறுதிமொழிசார் தன்மையைப் பேணுகின்றன. எல்லா அடிக்குறிப்பு குறிகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
