  text: וַ/יַּעֲשׂ֤וּ גַם הֵ֨מָּה֙ בְּ/עָרְמָ֔ה וַ/יֵּלְכ֖וּ וַ/יִּצְטַיָּ֑רוּ וַ/יִּקְח֞וּ שַׂקִּ֤ים בָּלִים֙ לַ/חֲמ֣וֹרֵי/הֶ֔ם וְ/נֹאד֥וֹת יַ֨יִן֙ בָּלִ֔ים וּ/מְבֻקָּעִ֖ים וּ/מְצֹרָרִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/004.yaml
  text: They too acted with cunning[a], and went and made provisions, and took worn-out sacks for their donkeys, and worn-out wineskins[b], split open and patched.
translation:
  language: ta
  text: அவர்களும் தந்திரமாகச் செயல்பட்டார்கள்; புறப்பட்டுச் சென்று மாறுவேடமிட்டுக்கொண்டார்கள்[a]. தங்கள் கழுதைகளுக்காகத் தேய்ந்துபோன சாக்குகளையும், தேய்ந்துபோன, பிளந்து கட்டிச் சீர்செய்யப்பட்ட திராட்சரசத் தோற்பைகளையும்[b] எடுத்துக்கொண்டார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பயணத்திற்குத் தேவையான பொருள்களை ஆயத்தப்படுத்திக்கொண்டார்கள்.” இதற்கான எபிரெய வினைச்சொல் கடினமானது; அது ஒன்றுக்கு மேற்பட்ட விதங்களில் புரிந்துகொள்ளப்பட்டுள்ளது.
    reason: alternative_reading
  - marker: b
    text: அல்லது, “கட்டப்பட்டவை” அல்லது “கட்டிவைக்கப்பட்டவை.” பிளந்த தோற்பைகள் கட்டிப் பழுதுபார்க்கப்பட்டதை இது விவரிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּעָרְמָה
  choice: தந்திரமாக
  rationale: இச்சொல் சூழ்ச்சியான சாமர்த்தியத்தைக் குறிக்கிறது; இச்சூழலில் ஏமாற்றும் நோக்கம் இருந்தாலும், மூலத்தின் சொல்லாட்சியை மிகைப்படுத்தாமல் தக்கவைக்கிறது.
- source_word: וַיִּצְטַיָּרוּ
  choice: மாறுவேடமிட்டுக்கொண்டார்கள்
  rationale: இவ்வினைச்சொல் கடினமானதும் பலவாறு புரிந்துகொள்ளப்பட்டதுமாகும். தொலைநாட்டிலிருந்து வந்தவர்களைப்போல் தோற்றமளிக்க அவர்கள் மேற்கொண்ட செயலை உடனடிச் சூழல் ஆதரிப்பதால் இவ்வாறு மொழிபெயர்க்கப்பட்டது; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: שַׂקִּים בָּלִים
  choice: நைந்துபோன சாக்குகள்
  rationale: பயன்பாட்டாலும் காலத்தாலும் தேய்ந்து பழுதடைந்த கரடுமுரடான சுமைப்பைகளைக் குறிக்கும் இயல்பான தமிழ்ச் சொற்றொடர்.
- source_word: לַחֲמוֹרֵיהֶם
  choice: தங்கள் கழுதைகளுக்காக
  rationale: எபிரெய முன்னிடைச்சொல் கழுதைகளுடன் தொடர்புடைய பயன்பாட்டைக் காட்டுகிறது; சாக்குகள் அவற்றின் சுமைக்காக இருந்ததை இச்சொற்றொடர் தெரிவிக்கிறது.
- source_word: נֹאדוֹת יַיִן
  choice: திராட்சரசத் தோற்பைகள்
  rationale: திராட்சரசத்தை வைத்திருக்கப் பயன்படுத்திய விலங்குத் தோலால் செய்யப்பட்ட கொள்கலன்களைத் தெளிவாகக் குறிக்கிறது.
- source_word: בָּלִים וּמְבֻקָּעִים וּמְצֹרָרִים
  choice: கிழிந்து கட்டிச் சீர்செய்யப்பட்ட பழைய
  rationale: தோற்பைகள் பழையவையாகவும் பிளந்தவையாகவும், கட்டுவதன் மூலம் பழுதுபார்க்கப்பட்டவையாகவும் இருந்ததை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: וַיִּצְטַיָּרוּ என்ற கடினமான வினைச்சொல்லின் பொருள்
  choice: மாறுவேடமிட்டுக்கொண்டார்கள்
  alternative: பயணத்திற்குத் தேவையான பொருள்களை ஆயத்தப்படுத்திக்கொண்டார்கள்
  rationale: அவர்களின் பழைய பொருட்கள் தொலைநாட்டவர் போன்ற பொய்த்தோற்றத்தை உருவாக்குகின்றன என்பதால் முதன்மை வாசகம் சூழலோடு பொருந்துகிறது; எனினும் மூலச்சொல்லின் உண்மையான ஐயப்பாடு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. எபிரெயக் கதைநடையின் தொடர் செயல்கள் இயல்பான இரண்டு வாக்கியங்களாக வழங்கப்பட்டுள்ளன. கடினமான வினைச்சொல்லின் ஐயப்பாடும் தோற்பைகளின் பழுதுபார்ப்பு குறித்த சொற்பொருள் வேறுபாடும் அடிக்குறிப்புகளில் பாதுகாக்கப்பட்டுள்ளன.
