- from: அவர்களுடன் உடன்படிக்கை செய்துகொண்ட மூன்று நாட்களுக்குப் பிறகு, அவர்கள் தங்களுக்கு அருகில் உள்ளவர்கள் என்றும் தங்கள் நடுவிலேயே வாழ்கிறவர்கள் என்றும் இஸ்ரவேலர் கேள்விப்பட்டார்கள்.
