  text: וַ/יְהִ֗י מִ/קְצֵה֙ שְׁלֹ֣שֶׁת יָמִ֔ים אַחֲרֵ֕י אֲשֶׁר כָּרְת֥וּ לָ/הֶ֖ם בְּרִ֑ית וַֽ/יִּשְׁמְע֗וּ כִּי קְרֹבִ֥ים הֵם֙ אֵלָ֔י/ו וּ/בְ/קִרְבּ֖/וֹ הֵ֥ם יֹשְׁבִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/016.yaml
  text: And it happened at the end of three days, after they had made a covenant with them, that they heard that they were near to them and were living among them.
translation:
  language: ta
  text: அவர்களோடு உடன்படிக்கை செய்துகொண்ட மூன்று நாட்களின் முடிவில், அந்த மக்கள் தங்களுக்கு அருகில் இருக்கிறார்கள் என்றும், தங்கள் நடுவிலேயே குடியிருக்கிறார்கள் என்றும் இஸ்ரவேலர் கேள்விப்பட்டார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִקְצֵה שְׁלֹשֶׁת יָמִים
  choice: மூன்று நாட்களுக்குப் பிறகு
  rationale: எபிரெயச் சொற்றொடரின் ‘மூன்று நாட்களின் முடிவில்’ என்ற காலப் பொருளை இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: כָּרְתוּ לָהֶם בְּרִית
  choice: அவர்களுடன் உடன்படிக்கை செய்துகொண்ட
  rationale: ‘உடன்படிக்கையை வெட்டுதல்’ என்பது எபிரெய மரபுத்தொடர்; தமிழில் அதன் பொருளான உடன்படிக்கை செய்துகொள்ளுதல் என வழங்கப்பட்டது.
- source_word: קְרֹבִים הֵם אֵלָיו
  choice: அவர்கள் தங்களுக்கு அருகில் உள்ளவர்கள்
  rationale: אֵלָיו என்பதன் ஒருமை வடிவம் இங்கு கூட்டுத்தொகையான இஸ்ரவேலைக் குறிக்கிறது; தமிழில் இயல்பாகப் பன்மைத் தற்சுட்டுப் பெயரால் தரப்பட்டது.
- source_word: וּבְקִרְבּוֹ הֵם יֹשְׁבִים
  choice: தங்கள் நடுவிலேயே வாழ்கிறவர்கள்
  rationale: ‘அதன்/அவன் நடுவில் வசிப்பவர்கள்’ என்ற வலியுறுத்தலை ‘நடுவிலேயே’ என்பதன் மூலம் காக்கிறது; சூழலில் இது இஸ்ரவேலரின் பிராந்தியத்தின் நடுவைக் குறிக்கிறது.
