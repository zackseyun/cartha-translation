    text: சொல்லுக்கு சொல், “ஒரே வாயாக”; முழுமையான ஒற்றுமையுடனும் ஒரே நோக்கத்துடனும் செயல்படுவதை இந்த எபிரெயச் சொற்றொடர் குறிக்கிறது.
