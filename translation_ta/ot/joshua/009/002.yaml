lexical_decisions:
- source_word: וַיִּתְקַבְּצוּ יַחְדָּו
  choice: அவர்கள் ஒன்றுகூடி
  rationale: கூட்டமாக ஒரே இடத்திற்கோ நோக்கத்திற்கோ சேரும் செயலை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது; יַחְדָּו கூறும் கூட்டு நடவடிக்கையும் இதில் அடங்குகிறது.
- source_word: לְהִלָּחֵם
  choice: போரிட
  rationale: போரில் ஈடுபடுதல் என்ற நிபால் வினையின் பொருளைச் சுருக்கமாகவும் தெளிவாகவும் தருகிறது.
- source_word: עִם יְהוֹשֻׁעַ וְעִם יִשְׂרָאֵל
  choice: யோசுவாவையும் இஸ்ரவேலையும் எதிர்த்து
  rationale: போரிடுதல் என்ற வினைக்குப் பின் עִם எதிர்ப்பு உறவைக் குறிக்கிறது. எபிரெயத்தில் முன்சொல் இருமுறை வருவதன் தாக்கத்தைத் தமிழின் ‘-ஐயும் ... -ஐயும்’ இணை அமைப்பு இயல்பாகப் பிரதிபலிக்கிறது.
- source_word: פֶּה אֶחָד
  choice: ஒருமனப்பட்டார்கள்
  rationale: சொல்லுக்கு சொல் ‘ஒரே வாய்’ என்றாலும், இச்சொற்றொடர் முழு ஒற்றுமையுடனும் ஒரே நோக்கத்துடனும் செயல்படுவதைச் சுட்டுகிறது. ‘ஒருமனப்பட்டார்கள்’ தமிழில் அந்தப் பொருளை இயல்பாகக் கூறுகிறது.
- source_word: יְהוֹשֻׁעַ
  choice: யோசுவா
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் நிலைபெற்றுள்ள பெயர்வடிவம்.
- source_word: יִשְׂרָאֵל
  choice: இஸ்ரவேல்
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் நிலைபெற்றுள்ள பெயர்வடிவம்.
