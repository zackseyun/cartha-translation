  text: ו/יאמרו אִֽישׁ יִשְׂרָאֵ֖ל אֶל הַ/חִוִּ֑י אוּלַ֗י בְּ/קִרְבִּ/י֙ אַתָּ֣ה יוֹשֵׁ֔ב וְ/אֵ֖יךְ אכרות לְ/ךָ֥ בְרִֽית־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/007.yaml
  text: But the men of Israel said to the Hivite[a], “Perhaps you are living among us[b]; how then could I make a covenant with you?”
translation:
  language: ta
  text: ஆனால் இஸ்ரவேலின் ஆட்கள் ஏவியனிடம், “ஒருவேளை நீ எங்கள் நடுவிலேயே குடியிருப்பவனாக இருக்கிறாயோ; அப்படியானால் நான் உன்னோடு எப்படி உடன்படிக்கை செய்ய முடியும்?” என்றார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “எங்கள் நடுவில்” என்பது எபிரெயத்தில் சொல்லர்த்தமாக “என் நடுவில்” என்றும், “உடன்படிக்கை செய்ய” என்பது சொல்லர்த்தமாக “உடன்படிக்கையை வெட்ட” என்றும் உள்ளது. ஒருமை வடிவங்கள் இஸ்ரவேலின் சார்பில் பேசும் பிரதிநிதியைச் சுட்டுகின்றன.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ יִשְׂרָאֵל
  choice: இஸ்ரவேலின் ஆட்கள்
  rationale: வடிவில் ஒருமையாக இருந்தாலும், இங்கு இஸ்ரவேலின் பிரதிநிதிகளைக் குறிக்கும் கூட்டு ஒருமையாகச் செயல்படுகிறது. தமிழில் இயல்பாகப் பன்மையால் வழங்கப்படுகிறது.
- source_word: הַחִוִּי
  choice: ஏவியன்
  rationale: எபிரெய ஒருமை வடிவத்தையும், குழுவின் பிரதிநிதியாகப் பேசப்படுபவரையும் காக்க இனப்பெயர் ஒருமையில் வழங்கப்பட்டது.
- source_word: אוּלַי
  choice: ஒருவேளை
  rationale: பேசுபவர்களின் சந்தேகத்தையும் சாத்தியத்தையும் நவீனத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: בְּקִרְבִּי
  choice: எங்கள் நடுவிலேயே
  rationale: சொல்லர்த்தமாக ‘என் நடுவில்’ என்ற ஒருமை இருந்தாலும், இஸ்ரவேலின் சார்பில் பேசும் பிரதிநிதியின் கூட்டு நோக்கைத் தமிழில் தெளிவாக்குகிறது; ‘-ஏ’ ஐயத்தின் கூர்மையை இயல்பாகத் தருகிறது.
- source_word: יוֹשֵׁב
  choice: குடியிருக்கலாம்
  rationale: ישׁב இங்கு அமர்வதை அல்ல, ஒரு பகுதியில் வசிப்பதை அல்லது குடியிருப்பதைச் சுட்டுகிறது.
- source_word: וְאֵיךְ
  choice: அப்படியானால் ... எப்படி ... முடியும்?
  rationale: முன்வைக்கப்பட்ட சாத்தியத்திலிருந்து வரும் நடைமுறை விளைவையும் கேள்வியின் இயல்பையும் தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: אכרות ... בְרִית
  choice: உடன்படிக்கை செய்ய
  rationale: எபிரெய மரபுத்தொடர் சொல்லர்த்தமாக ‘உடன்படிக்கையை வெட்டுதல்’ என்பதாகும்; அதன் பொருளை நவீனத் தமிழில் இயல்பாகவும் துல்லியமாகவும் வழங்குகிறது.
- source_word: לְךָ
  choice: உன்னோடு
  rationale: உடன்படிக்கை செய்வதன் மறுதரப்பைக் குறிக்கும் உறவுநிலையைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: இஸ்ரவேலின் பேச்சிலுள்ள கூட்டு ஒருமை
  choice: בְּקִרְבִּי என்பதை ‘எங்கள் நடுவில்’ எனக் கூட்டுப்பொருளில் வழங்கி, אכרות என்ற முதலாம் நபர் ஒருமையை ‘நான் ... செய்ய’ எனக் காத்தல்
  alternative: ‘என் நடுவில் ... நான் உன்னோடு உடன்படிக்கை செய்ய’ என்று ஒருமையை முழுவதும் சொல்லர்த்தமாக வைத்தல்
  rationale: எபிரெய உரை பிரதிநிதித்துவ ஒருமையைப் பயன்படுத்துகிறது. ‘எங்கள் நடுவில்’ என்பது இஸ்ரவேல் சமூகத்தைக் குறிக்கும் புவியியல்-கூட்டுப்பொருளைத் தெளிவாக்குகிறது; ‘நான்’ என்பது மூலத்தின் முதலாம் நபர் ஒருமையையும் பிரதிநிதிப் பேச்சின் இழுப்பையும் காக்கிறது.
translation_notes:
  register: நவீன, கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் தமிழ். இனப்பெயர் ஒருமையும், பிரதிநிதித்துவ முதலாம் நபர் ஒருமையும் இயன்றவரை காக்கப்பட்டுள்ளன; எபிரெய மரபுத்தொடர் இயல்பான தமிழில் வழங்கப்பட்டுள்ளது.
