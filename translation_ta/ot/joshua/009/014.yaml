base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/014.yaml
  text: So the men took some of their provisions[a], but did not ask for the counsel of Yahweh.
translation:
  language: ta
  text: அந்த ஆட்கள் அவர்களுடைய பயணத்திற்கான உணவுப் பொருட்களில் சிலவற்றை எடுத்துக்கொண்டார்கள்; ஆனால் யாவேயின் ஆலோசனையைக் கேட்கவில்லை.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְחוּ
  choice: எடுத்துக்கொண்டார்கள்
  rationale: לקח என்பதன் அடிப்படைப் பொருளான ‘எடுத்தல்’ என்பதைக் காக்கிறது; உணவைச் சுவைத்தார்கள் அல்லது சான்றாக ஏற்றார்கள் என்று சூழலிலிருந்து கூடுதல் பொருளைச் சேர்க்கவில்லை.
- source_word: הָאֲנָשִׁים
  choice: அந்த ஆட்கள்
  rationale: எபிரெயச் சொல் பொதுவாக ‘ஆட்கள்/மனிதர்கள்’ என்று மட்டுமே கூறுகிறது. சூழலில் அவர்கள் இஸ்ரவேலரின் பிரதிநிதிகள் என்றாலும், ‘தலைவர்கள்’ அல்லது ‘இஸ்ரவேல் ஆட்கள்’ என்று மூலத்தில் இல்லாத அடையாளத்தைச் சேர்க்கவில்லை.
- source_word: מִצֵּידָם
  choice: அவர்களுடைய பயண உணவில் சிறிதை
  rationale: צֵיד பயணத்துக்கான உணவு அல்லது provisions என்பதைக் குறிக்கலாம்; מִן இங்கு பகுதியைக் குறிக்கும் இயல்பான பயன்பாடு என்பதால் ‘சிறிதை’ சேர்க்கப்பட்டுள்ளது.
- source_word: פִּי יְהוָה
  choice: யாவேயின் வழிகாட்டுதலை
  rationale: சொல்லுக்கு சொல் ‘யாவேயின் வாய்’ என்றாலும், இங்கு அது யாவேயின் தீர்மானம் அல்லது வழிநடத்துதலைக் கேட்டு அறிதலைக் குறிக்கும் மரபுத்தொடர். இயல்பான தமிழில் அதன் பொருளைத் தரும் வகையில் மொழிபெயர்க்கப்பட்டு, நேரடியான வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: திருநாமமான יהוה ஒரு பட்டப்பெயரால் மாற்றப்படாமல், நவீன தமிழில் பரவலாகப் புரியக்கூடிய ஒலிபெயர்ப்பாக ‘யாவே’ என்று தரப்படுகிறது.
- source_word: לֹא שָׁאָלוּ
  choice: நாடவில்லை
  rationale: שׁאל என்பதன் ‘கேட்டல்/விசாரித்தல்’ என்ற பொருள், தெய்வீக வழிகாட்டுதலைப் பெற முயலாததை இயல்பான தமிழில் ‘நாடவில்லை’ என்று தெரிவிக்கிறது.
theological_decisions:
- issue: יהוה என்ற திருநாமத்தை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூல உரை திருநாமத்தையே பயன்படுத்துவதால், அதை ஒரு பட்டப்பெயராக மாற்றாமல் ஒலிபெயர்த்துள்ளது.
- issue: פִּי יְהוָה என்ற மரபுத்தொடரைக் கையாளுதல்
  choice: யாவேயின் வழிகாட்டுதலை
  alternative: யாவேயின் வாயை; யாவேயின் ஆலோசனையை; யாவேயிடம் விசாரித்தல்
  rationale: ‘வாய்’ என்ற நேரடிப் படிமத்தை பிரதான உரையில் வைத்தால் நவீன தமிழில் பொருள் தெளிவிழக்கும். ‘வழிகாட்டுதல்’ என்பது தெய்வீக அறிவுரை அல்லது தீர்மானத்தை நாடுதல் என்ற சூழற்பொருளைத் தருகிறது; நேரடி வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் எளிமையும் கண்ணியமும் உள்ள நடை பயன்படுத்தப்பட்டுள்ளது. ‘பயண உணவு’ என்பது இச்சூழலில் provisions என்பதன் உணவுசார் பொருளை இயல்பாகத் தருகிறது; நிகழ்வின் தன்மையை ஊகித்து ‘சுவைத்தார்கள்’ என்று விரிவாக்கப்படவில்லை.
