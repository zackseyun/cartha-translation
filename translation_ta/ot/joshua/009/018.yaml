source:
  edition: WLC
  text: וְ/לֹ֤א הִכּוּ/ם֙ בְּנֵ֣י יִשְׂרָאֵ֔ל כִּֽי נִשְׁבְּע֤וּ לָ/הֶם֙ נְשִׂיאֵ֣י הָֽ/עֵדָ֔ה בַּֽ/יהוָ֖ה אֱלֹהֵ֣י יִשְׂרָאֵ֑ל וַ/יִּלֹּ֥נוּ כָל הָ/עֵדָ֖ה עַל הַ/נְּשִׂיאִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/018.yaml
  text: But the sons of Israel did not strike them[a], because the leaders of the congregation had sworn to them by Yahweh, the God of Israel[c][b]. And all the congregation grumbled against the leaders.
translation:
  language: ta
  text: ஆனால் இஸ்ரவேலர்கள் அவர்களைத் தாக்கவில்லை[a]; ஏனெனில் சபையின் தலைவர்கள் இஸ்ரவேலின் கடவுளாகிய யாவேவின் பெயரில் அவர்களுக்குச் சத்தியம் செய்திருந்தார்கள். சபை முழுவதும் தலைவர்களுக்கு எதிராக முறுமுறுத்தது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்களை அடித்துக் கொல்லவில்லை.” எபிரெய வினைச்சொல் ‘அடித்தல்’, ‘தாக்குதல்’ என்றும், இத்தகைய சூழலில் ‘கொல்லுதல்’ என்றும் பொருள்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִכּוּם
  choice: அவர்களைத் தாக்கவில்லை
  rationale: נכה என்பது அடித்தல் அல்லது தாக்குதல் என்று பொருள்படும்; போர் சூழலில் கொல்லுதலையும் குறிக்கலாம். இங்கு விளைவை ‘கொன்றுவிடவில்லை’ என்று மிகையாகத் தீர்மானிக்காமல், வன்முறை நடவடிக்கையை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலர்கள்
  rationale: எபிரெய மொழிமரபின் சொற்பொருள் ‘இஸ்ரவேலின் மகன்கள்’ என்றாலும், இங்கு அது இஸ்ரவேல் மக்களை மொத்தமாகக் குறிக்கிறது; ‘இஸ்ரவேலர்கள்’ என்பது துல்லியமும் இயல்பும் கொண்ட நவீனத் தமிழ்.
- source_word: נִשְׁבְּעוּ לָהֶם
  choice: ஆணையிட்டு அவர்களுக்கு வாக்குக் கொடுத்திருந்தார்கள்
  rationale: שׁבע என்பதன் நிபால் வடிவம் ஆணையிடுதல் அல்லது உறுதிமொழி செய்தல். לָהֶם அந்த உறுதிமொழி அவர்களுக்குக் கொடுக்கப்பட்டது என்பதைச் சுட்டுகிறது; முந்திய நிகழ்வை ‘கொடுத்திருந்தார்கள்’ தெரிவிக்கிறது.
- source_word: נְשִׂיאֵי הָעֵדָה
  choice: சபையின் தலைவர்கள்
  rationale: נְשִׂיאִים அதிகாரப்பூர்வத் தலைவர்களையும் עֵדָה கூடிய சமூகத்தையும் குறிக்கின்றன. ‘சபையின் தலைவர்கள்’ தெளிவான, கண்ணியமான தமிழ்.
- source_word: בַּיהוָה אֱלֹהֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் கடவுளாகிய யாவேமீது
  rationale: שׁבע உடன் בְּ ஆணை யார்மீது செய்யப்பட்டது என்பதைக் குறிக்கிறது. יהוה என்ற தனிப்பெயர் ‘யாவே’ என ஒலிபெயர்க்கப்பட்டு, אֱלֹהֵי יִשְׂרָאֵל அதன் அடையாள விளக்கமாக வைக்கப்பட்டுள்ளது.
- source_word: וַיִּלֹּנוּ
  choice: முறுமுறுத்தார்கள்
  rationale: לון இவ்வடிவில் அதிகாரிகளுக்கு எதிரான கூட்டுக் குறைகூறலைக் குறிக்கிறது; ‘முறுமுறுத்தார்கள்’ அதன் தொடர்ச்சியான அதிருப்தியையும் வேதாகமப் பயன்பாட்டு ஒலியையும் காக்கிறது.
- source_word: כָל הָעֵדָה עַל הַנְּשִׂיאִים
  choice: சபையார் அனைவரும் தலைவர்களுக்கு எதிராக
  rationale: כָל முழுச் சமூகத்தையும், עַל குறைகூறலின் எதிர்நிலையையும் குறிக்கின்றன. ‘சபையார் அனைவரும்’ தமிழில் நபர்களைக் குறிக்கும் இயல்பான கூட்டுச் சொல்.
theological_decisions:
- issue: יהוה என்ற இறைத் திருப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் உடன்படிக்கையின் தனிப்பெயர் நேரடியாக உள்ளது. அதை பொதுப் பட்டப்பெயராக மாற்றாமல் ‘யாவே’ என்று ஒலிபெயர்ப்பது மூலத்தின் வேறுபாட்டைக் காக்கிறது.
- issue: עֵדָה என்ற சமூகச் சொல்
  choice: சபை / சபையார்
  alternative: கூட்டம் / கூட்டத்தார்
  rationale: இது ஒழுங்குபெற்ற இஸ்ரவேல் சமூகத்தைச் சுட்டுகிறது. ‘சபை’ அந்தச் சமூகத் தன்மையைக் காக்கிறது; பின்னாளைய குறிப்பிட்ட திருச்சபை அமைப்பை வசனத்தில் சேர்ப்பதில்லை.
- issue: இஸ்ரவேலர் தாக்காததற்கும் ஆணைக்கும் உள்ள காரணத் தொடர்பு
  choice: ஏனெனில் ... ஆணையிட்டு ... வாக்குக் கொடுத்திருந்தார்கள்
  alternative: அவர்கள் ஆணையிட்டதால்
  rationale: כִּי வெளிப்படையாக காரணத்தை அறிமுகப்படுத்துகிறது. தலைவர்களின் முந்திய ஆணையே தாக்காமைக்குக் காரணம் என்ற உரையின் நெறி மற்றும் உடன்படிக்கைத் திணறலை மாற்றாமல் வைத்துள்ளது.
translation_notes:
  register: நவீன நிலையான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘இஸ்ரவேலின் மகன்கள்’ என்ற சொற்சொறான வடிவத்திற்குப் பதில் இயல்பான ‘இஸ்ரவேலர்கள்’ தேர்ந்தெடுக்கப்பட்டது. வாக்கிய ஒழுங்கு தமிழின் ஓட்டத்திற்கேற்ப அமைக்கப்பட்டாலும், காரணத் தொடர்பும் ஆணையின் தெய்வீகச் சாட்சியும் சமூகத்தின் முறுமுறுப்பும் தெளிவாகக் காக்கப்பட்டுள்ளன.
