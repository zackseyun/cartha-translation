base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/027.yaml
  text: So Joshua made them woodcutters and water carriers on that day for the congregation and for the altar of Yahweh[a], to this day, in the place that he would choose.
translation:
  language: ta
  text: அன்று யோசுவா அவர்களைச் சபைக்கும் யாவேயின் பலிபீடத்துக்கும் மரம் வெட்டுபவர்களாகவும் தண்ணீர் எடுப்பவர்களாகவும்[a] நியமித்தான்; யாவே தேர்ந்தெடுக்கும் இடத்தில் இன்றுவரை அவர்கள் அவ்வாறே இருக்கிறார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தண்ணீர் முகப்பவர்களாகவும்.”
    reason: שאב என்ற வினை நீரை முகந்து எடுப்பதை நேரடியாகக் குறிக்கிறது; இது சொற்பொருள் மாற்று.
lexical_decisions:
- source_word: וַיִּתְּנֵם
  choice: அவர்களை … நியமித்தான்
  rationale: נתן என்பதன் அடிப்படைப் பொருள் ‘கொடுத்தான்/வைத்தான்’ என்றாலும், இங்கு தொழிலைக் குறிக்கும் பங்கேற்புப் பெயர்களுடன் வருவதால் அவர்களுக்கு ஒரு பணியை ஒதுக்கி நியமித்தான் என்பதே இயல்பான பொருள்.
- source_word: חֹטְבֵי עֵצִים
  choice: மரம் வெட்டுகிறவர்கள்
  rationale: மரத்தை வெட்டும் பணியாளர்களைக் குறிக்கும் எளிய, தற்போதைய தமிழாக்கம்.
- source_word: שֹׁאֲבֵי מַיִם
  choice: நீர் இறைப்பவர்கள்
  rationale: שאב என்பது கிணறு அல்லது நீர்நிலையிலிருந்து நீரை முகந்து எடுப்பதைக் குறிக்கிறது; ‘நீர் இறைப்பவர்கள்’ அந்தச் செயலைத் துல்லியமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: לָעֵדָה
  choice: சபைக்காக
  rationale: עֵדָה இஸ்ரவேலின் ஒன்றுகூடிய உடன்படிக்கைச் சமூகத்தைக் குறிக்கிறது; ‘சபை’ அதன் கூட்டு மற்றும் வழிபாட்டுச் சார்பைத் தக்கவைக்கிறது.
- source_word: וּלְמִזְבַּח יְהוָה
  choice: யாவேயின் பலிபீடத்துக்காக
  rationale: பலியிடும் வழிபாட்டோடு தொடர்புடைய சேவையைத் தெளிவாகக் காட்டுகிறது; உடைமைத் தொடர்பும் பாதுகாக்கப்படுகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய தனிப்பெயரான יהוה என்பதை ஒரு பட்டப்பெயரால் மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: இன்றுவரை
  rationale: கதை நிகழ்ந்த காலத்திலிருந்து எழுத்தாளரின் காலம்வரை அந்த நிலை தொடர்ந்ததைக் குறிக்கும் இயல்பான தமிழ் மரபுத்தொடர்.
- source_word: אֶל הַמָּקוֹם אֲשֶׁר יִבְחָר
  choice: அவர் தேர்ந்தெடுக்கும் இடத்தில்
  rationale: தொடர்புடைய வழிபாட்டுப் பணி யாவே தேர்ந்தெடுக்கும் இடத்தில் நடைபெறுவதைத் தெரிவிக்கிறது. எபிரெய வினையின் எதிர்நோக்கும் தன்மையைத் தமிழ் நிகழ்கால வடிவம் இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரின் மொழியாக்கம்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் தனிப்பெயர் நேரடியாக வருவதால், அதை ஒரு பட்டப்பெயராக மாற்றாமல் ஒலிபெயர்த்துள்ளது.
- issue: ‘அவர் தேர்ந்தெடுக்கும் இடம்’ என்பதில் எழுவாய் யார்?
  choice: ‘அவர்’ என்பது யாவேயைக் குறிக்கும்
  alternative: ‘தேர்ந்தெடுக்கப்படும் இடம்’ என்ற செயப்பாட்டு வடிவம்
  rationale: உபாகமம்–யோசுவா நூல்களில் வரும் வழக்கமான சொற்றொடரின்படி வழிபாட்டு இடத்தைத் தேர்ந்தெடுப்பவர் யாவே. மூலத்தின் தனிப்பட்ட எழுவாயை நீக்காமல் ‘அவர்’ என்று வைத்துள்ளது.
- issue: ‘இன்றுவரை’ தொடரும் நிலையைத் தமிழில் வெளிப்படுத்துதல்
  choice: ‘அவர்கள் அப்பணியைச் செய்துவருகிறார்கள்’ என்று வெளிப்படையாக்கப்பட்டது
  alternative: ‘இன்றுவரை, அவர் தேர்ந்தெடுக்கும் இடத்தில்’ என்று மூல வரிசையை மட்டும் பின்பற்றுதல்
  rationale: எபிரெயத்தில் தொடரும் பணி இலக்கணரீதியாகச் சுருக்கமாக உள்ளது. தமிழில் பொருள் தெளிவாக இருக்க, புதிய இறையியல் கருத்தைச் சேர்க்காமல் அந்த மறைநிலையை வெளிப்படுத்துகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் தெளிவும் கண்ணியமும் காக்கப்பட்டுள்ளன. ‘சபை’, ‘பலிபீடம்’ போன்ற பரவலாக அறியப்பட்ட வேதாகமச் சொற்கள் தக்கவைக்கப்பட்டுள்ளன; பழமையான தொழிற்பெயர் வடிவங்கள் தவிர்க்கப்பட்டுள்ளன.
