- from: நாங்கள் புதிதாக இருந்தபோது திராட்சரசம் நிரப்பிய இந்தத் தோற்பைகளோ—பாருங்கள், இவை வெடித்துவிட்டன[a]. எங்கள் இந்த உடைகளும் செருப்புகளும் மிக நீண்ட பயணத்தால் தேய்ந்துபோயின[b].
  to: நாங்கள் அவை புதிதாக இருந்தபோது திராட்சரசம் நிரப்பிய இந்தத் திராட்சரசத் தோல் பைகளோ—பாருங்கள், இவை வெடித்துவிட்டன[a]. எங்களுடைய இந்த உடைகளும் செருப்புகளும் மிக நீண்ட பயணத்தால் தேய்ந்துபோயின[b].
