  register: நவீன பொதுத்தமிழில், நேரடி உரையின் காட்டும் தன்மையையும் எபிரெய மூலத்தின் காரணத் தொடர்பையும் காக்கும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. எல்லா அடிக்குறிப்பு குறிகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
