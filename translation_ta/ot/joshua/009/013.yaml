source:
  edition: WLC
  text: וְ/אֵ֨לֶּה נֹאד֤וֹת הַ/יַּ֨יִן֙ אֲשֶׁ֣ר מִלֵּ֣אנוּ חֲדָשִׁ֔ים וְ/הִנֵּ֖ה הִתְבַּקָּ֑עוּ וְ/אֵ֤לֶּה שַׂלְמוֹתֵ֨י/נוּ֙ וּ/נְעָלֵ֔י/נוּ בָּל֕וּ מֵ/רֹ֥ב הַ/דֶּ֖רֶךְ מְאֹֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/013.yaml
  text: And these wineskins[a], which we filled when they were new—look, they have burst[c][b]; and these our garments and our sandals have worn out from the journey being very long.
translation:
  language: ta
  text: நாங்கள் அவை புதிதாக இருந்தபோது திராட்சரசம் நிரப்பிய இந்தத் திராட்சரசத் தோல் பைகளோ—பாருங்கள், இவை வெடித்துவிட்டன[a]. எங்களுடைய இந்த உடைகளும் செருப்புகளும் மிக நீண்ட பயணத்தால் தேய்ந்துபோயின[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘பிளந்துவிட்டன.’
    reason: lexical_alternative
  - marker: b
    text: 'எபிரெயத்தில் சொல்லுக்குச் சொல்: ‘பயணத்தின் மிகுதியால், மிகவும்’; அதாவது, பயணம் மிக நீண்டதாக இருந்ததால்.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נֹאדוֹת הַיַּיִן
  choice: திராட்சரசத் தோற்பைகள்
  rationale: נֹאד என்பது திரவங்களை, குறிப்பாக திராட்சரசத்தை, வைக்கும் தோலால் செய்யப்பட்ட பையைக் குறிக்கிறது; ‘தோற்பைகள்’ பொருளையும் வரலாற்றுச் சூழலையும் தெளிவாகக் காக்கிறது.
- source_word: מִלֵּאנוּ חֲדָשִׁים
  choice: நாங்கள் புதிதாக இருந்தபோது திராட்சரசம் நிரப்பிய
  rationale: חֲדָשִׁים என்பது தோற்பைகளைக் குறிக்கிறது. தமிழில் அவை புதிதாக இருந்த சமயத்தில் நிரப்பப்பட்டன என்பதை இயல்பாகத் தெரிவிக்க இவ்வாறு அமைக்கப்பட்டுள்ளது.
- source_word: וְהִנֵּה
  choice: பாருங்கள்
  rationale: הִנֵּה கேட்பவரின் கவனத்தை நேரடியாக ஈர்க்கும் உரையாடல் இடைச்சொல்; ‘பாருங்கள்’ அதன் காட்டும் வலிமையை நவீன தமிழில் காக்கிறது.
- source_word: הִתְבַּקָּעוּ
  choice: வெடித்துவிட்டன
  rationale: இந்த வடிவம் தோற்பைகள் பிளந்து திறந்துபோன விளைவு நிலையைச் சுட்டுகிறது; ‘வெடித்துவிட்டன’ பாத்திரங்களுக்குப் பொருத்தமான இயல்பான தமிழ்.
- source_word: שַׂלְמוֹתֵינוּ
  choice: எங்கள் இந்த உடைகள்
  rationale: שַׂלְמוֹת என்பது பொதுவாக ஆடைகள் அல்லது உடைகளைக் குறிக்கிறது; ‘உடைகள்’ நவீன வாசகருக்குத் தெளிவானதும் அளவான கண்ணியமுடையதும் ஆகும்.
- source_word: נְעָלֵינוּ
  choice: செருப்புகள்
  rationale: נַעַל அக்காலத்தில் அணிந்த காலணியை, பொதுவாகச் செருப்பை, குறிக்கிறது; ‘செருப்புகள்’ வரலாற்றுச் சூழலுக்கு ஏற்றது.
- source_word: בָּלוּ
  choice: தேய்ந்துபோயின
  rationale: בָּלָה பயன்பாட்டால் பழுதடைதல் அல்லது தேய்ந்து போதலைக் குறிக்கிறது; பயணத்தால் ஏற்பட்ட விளைவை ‘தேய்ந்துபோயின’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: מֵרֹב הַדֶּרֶךְ מְאֹד
  choice: மிக நீண்ட பயணத்தால்
  rationale: மִן காரணத்தையும், רֹב/מְאֹד பயணத்தின் மிகுதியையும் வலியுறுத்துகின்றன. ‘மிக நீண்ட பயணத்தால்’ காரணத்தையும் தீவிரத்தையும் சுருக்கமாகக் காக்கிறது.
