- from: இப்போது[a], இதோ, நாங்கள் உன் கையில் இருக்கிறோம். எங்களுக்கு என்ன செய்வது உன் பார்வைக்கு நல்லதும் சரியானதுமாக இருக்கிறதோ, அதையே செய்.
  to: இப்போது[a], இதோ, நாங்கள் உன் கையில் இருக்கிறோம். எங்களுக்குச் செய்ய உன் பார்வையில் நல்லதும் சரியானதுமாக இருக்கிறதோ, அதையே செய்.
