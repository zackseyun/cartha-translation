source:
  edition: WLC
  text: וְ/עַתָּ֖ה הִנְ/נ֣וּ בְ/יָדֶ֑/ךָ כַּ/טּ֨וֹב וְ/כַ/יָּשָׁ֧ר בְּ/עֵינֶ֛י/ךָ לַ/עֲשׂ֥וֹת לָ֖/נוּ עֲשֵֽׂה׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/025.yaml
  text: And now[a], here we are in your hand. Do to us as it is good and right in your eyes to do.
translation:
  language: ta
  text: இப்போது[a], இதோ, நாங்கள் உன் கையில் இருக்கிறோம். எங்களுக்குச் செய்ய உன் பார்வையில் நல்லதும் சரியானதுமாக இருக்கிறதோ, அதையே செய்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இதை இன்னும் வழக்கமான தமிழில், “உனக்கு நல்லதும் சரியானதுமாகத் தோன்றுகிறபடி எங்களை நடத்து” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: இப்போது
  rationale: தற்போதைய பணிவான ஒப்புக்கொடுத்தலை அறிமுகப்படுத்தும் கால-உரையாடல் குறியீடு. தமிழில் வாக்கியத் தொடக்கத்தில் ‘இப்போது’ இயல்பாக இணைப்புப் பொருளையும் சுமக்கிறது.
- source_word: הִנְנוּ
  choice: இதோ, நாங்கள்
  rationale: முன்னிலைப்படுத்திக் காட்டும் எபிரெய வெளிப்பாட்டை, பழமையாக்காமல் இயல்பான நவீன தமிழில் தருகிறது.
- source_word: בְיָדֶךָ
  choice: உன் கையில்
  rationale: ஒருவரின் அதிகாரத்திற்கும் கட்டுப்பாட்டிற்கும் உட்பட்டிருப்பதைக் குறிக்கும் எபிரெய உருவகத்தைத் தக்கவைக்கிறது; தமிழிலும் இது புரிந்துகொள்ளத்தக்கது.
- source_word: כַּטּוֹב
  choice: நல்லது
  rationale: טוב என்பதன் அடிப்படைப் பொருளை நேரடியாகத் தருகிறது.
- source_word: וְכַיָּשָׁר
  choice: சரியானது
  rationale: ישר இங்கு நேர்மையானது அல்லது முறையானது என்ற மதிப்பீட்டுப் பொருளைக் கொண்டது; ‘சரியானது’ இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: בְּעֵינֶיךָ
  choice: உன் பார்வைக்கு
  rationale: ‘உன் கண்களில்’ என்ற எபிரெய மொழிமரபின் மதிப்பீட்டுப் பொருளைத் தெளிவான தமிழ் மரபுத்தொடரில் வழங்குகிறது.
- source_word: לַעֲשׂוֹת לָנוּ עֲשֵׂה
  choice: எங்களுக்கு என்ன செய்வது ... அதையே செய்
  rationale: עשה என்ற வினையின் பெயரெச்ச-கட்டளைக் கூறை தமிழில் இயல்பாக மீளுருவாக்கி, செயலை வலியுறுத்தும் மூலத்தின் தாக்கத்தைத் தக்கவைக்கிறது.
