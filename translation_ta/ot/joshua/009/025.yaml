  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘உன் கையில்’ என்ற மூல உருவகம் தக்கவைக்கப்பட்டு, ‘உன் பார்வைக்கு’ என்பது தமிழில் புரியும் மதிப்பீட்டு மொழிமரபாக வழங்கப்பட்டுள்ளது.
