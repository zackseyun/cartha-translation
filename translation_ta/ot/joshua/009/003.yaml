  text: But the inhabitants of Gibeon heard what Joshua had done to Jericho and to Ai[a].
translation:
  language: ta
  text: ஆனால் கிபியோனில் வாழ்ந்தவர்கள், யோசுவா எரிகோவுக்கும் ஆயிக்கும் என்ன செய்தார் என்று கேள்விப்பட்டார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மேலும் கிபியோனில் வாழ்ந்தவர்கள், யோசுவா எரிகோவுக்கும் ஆயிக்கும் என்ன செய்தார் என்று கேள்விப்பட்டார்கள்.”
    reason: வசனத் தொடக்கத்தில் உள்ள எபிரெய இணைப்புச்சொல் וְ-ஐ ‘ஆனால்’ என்பதற்குப் பதிலாக சாதாரண இணைப்பாகவும் வழங்கலாம்.
lexical_decisions:
- source_word: וְ/יֹשְׁבֵי
  choice: ஆனால் கிபியோனில் வாழ்ந்தவர்கள்
  rationale: יֹשְׁבֵי என்பது ‘குடியிருப்பவர்கள்/வாழ்ந்தவர்கள்’ எனப் பொருள்படும். முந்தைய வசனங்களில் வரும் அரசர்களின் நடவடிக்கையிலிருந்து கிபியோனியரின் வேறுபட்ட எதிர்வினைக்குக் கதை திரும்புவதால், தொடக்க וְ இங்கு இயல்பான தமிழில் ‘ஆனால்’ என வழங்கப்படுகிறது.
- source_word: גִבְעוֹן
  choice: கிபியோன்
  rationale: இடப்பெயர் நவீனத் தமிழில் வழக்கமான ஒலிபெயர்ப்பில் வழங்கப்படுகிறது.
- source_word: שָׁמְעוּ
  choice: கேள்விப்பட்டார்கள்
  rationale: שׁמע என்பதன் நேரடியான பொருள் ‘கேட்டார்கள்.’ இச்சூழலில் ஒரு நிகழ்வைப் பற்றிய செய்தியை அறிந்ததைக் குறிக்கத் தமிழில் ‘கேள்விப்பட்டார்கள்’ இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: אֵת אֲשֶׁר
  choice: செய்ததைப் பற்றி
  rationale: கேட்ட செய்தியின் உள்ளடக்கத்தை அறிமுகப்படுத்தும் இக்கட்டமைப்பு தமிழில் ‘செய்ததைப் பற்றி’ என இயல்பாக அமைகிறது.
- source_word: עָשָׂה
  choice: செய்ததை
  rationale: עשה என்பதன் பொதுவான பொருள் ‘செய்.’ கேள்விப்படுவதற்கு முன்பே நிறைவடைந்த செயல்களைத் தமிழ் வினையெச்சப் பெயராக்கம் இயல்பாகக் காட்டுகிறது.
- source_word: יְהוֹשֻׁעַ
  choice: யோசுவா
  rationale: தனிப்பெயர் தமிழில் நிலைபெற்ற வேதாகம ஒலிபெயர்ப்பின்படி வழங்கப்படுகிறது.
- source_word: לִֽ/ירִיחוֹ
  choice: எரிகோவுக்கு
  rationale: ל முன்னிடைச்சொல் யோசுவாவின் செயல் எரிகோவின் மீது நோக்கிச் செய்யப்பட்டதைச் சுட்டுகிறது. ‘எரிகோவுக்கு’ என்பது நேரடியான வடிவம்; ‘எதிராக’ என்பது சூழலை மேலும் விளக்கிவிடும்.
- source_word: וְ/לָ/עָי
  choice: ஆயிக்கும்
  rationale: எரிகோவுக்கான இணை அமைப்பைப் பாதுகாத்து, וְ ‘-உம்’ எனவும் ל ‘-க்கு’ எனவும் இயல்பான தமிழில் வழங்கப்படுகின்றன.
theological_decisions:
- issue: வசனத் தொடக்கத்தில் உள்ள וְ இணைப்புச் சொல்லின் மொழிபெயர்ப்பு
  choice: ஆனால்
  alternative: அப்போது / மேலும் / மற்றும்
  rationale: இது கோட்பாட்டுத் தீர்மானமல்ல; உரையாடல் ஓட்டம் சார்ந்தது. 9:1–2இல் அரசர்கள் ஒன்றுகூடிய எதிர்வினையிலிருந்து 9:3 தொடங்கி கிபியோனியரின் வேறுபட்ட எதிர்வினைக்குக் கதை மாறுவதால் ‘ஆனால்’ அந்த எதிர்மறைத் திருப்பத்தை வெளிப்படுத்துகிறது. இருப்பினும் எபிரெய וְ சாதாரண இணைப்பாகவும் புரிந்துகொள்ளப்படலாம்; அதனால் மாற்று வாசிப்பு அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகருக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘குடிமக்கள்’ என்பதைக் காட்டிலும் எபிரெயச் சொல்லின் குடியிருப்பு சார்ந்த அர்த்தத்தைப் பாதுகாக்க ‘வாழ்ந்தவர்கள்’ பயன்படுத்தப்பட்டது; தொடக்க இணைப்பின் உண்மையான தெளிவின்மை அடிக்குறிப்பில் தக்கவைக்கப்பட்டது.
