source:
  edition: WLC
  text: וַ/יֹּאמְר֣וּ אֵלָ֗י/ו מֵ/אֶ֨רֶץ רְחוֹקָ֤ה מְאֹד֙ בָּ֣אוּ עֲבָדֶ֔י/ךָ לְ/שֵׁ֖ם יְהוָ֣ה אֱלֹהֶ֑י/ךָ כִּֽי שָׁמַ֣עְנוּ שָׁמְע֔/וֹ וְ/אֵ֛ת כָּל אֲשֶׁ֥ר עָשָׂ֖ה בְּ/מִצְרָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/009.yaml
  text: And they said to him[a], “Your servants have come from a very distant land for the name of Yahweh your God, for we have heard of his fame and all that he did in Egypt.”
translation:
  language: ta
  text: அவர்கள் அவரிடம், “உங்கள் அடியார்களாகிய நாங்கள் மிகத் தொலைவிலுள்ள ஒரு நாட்டிலிருந்து உங்கள் கடவுளாகிய யாவேயின் பெயருக்காக வந்திருக்கிறோம். ஏனெனில், அவருடைய புகழையும்[a] அவர் எகிப்தில் செய்த அனைத்தையும் நாங்கள் கேள்விப்பட்டோம்” என்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவரைப் பற்றிய செய்தியையும்” அல்லது “அவருடைய பேர்புகழையும்.” எபிரேயத்தில் ஒரே வேரைச் சேர்ந்த சொற்கள் பயன்படுத்தப்பட்டுள்ளன; சொல்லுக்கு சொல், “அவருடைய செய்தியைக் கேட்டோம்” எனும் பொருள் உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ אֵלָיו
  choice: அவர்கள் அவரிடம் … என்றார்கள்
  rationale: எபிரேயக் கதைநடையின் தொடர்ச்சியையும் நேரடிப் பேச்சின் அறிமுகத்தையும் இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: מֵאֶרֶץ רְחוֹקָה מְאֹד
  choice: வெகுதொலைவிலுள்ள ஒரு நாட்டிலிருந்து
  rationale: רְחוֹקָה என்பதன் ‘தொலைவான’ பொருளையும் מְאֹד தரும் வலியுறுத்தலையும் தெளிவாகக் காக்கிறது.
- source_word: בָּאוּ
  choice: வந்திருக்கிறோம்
  rationale: முடிந்த செயல் தற்போதைய வருகைநிலையோடு தொடர்புடையதாகப் பேசப்படுவதைக் தமிழில் இயல்பாகக் காட்டுகிறது.
- source_word: עֲבָדֶיךָ
  choice: உங்கள் அடியார்களாகிய நாங்கள்
  rationale: இங்கு இது அடிமைத்தனத்தை முதன்மைப்படுத்தாமல், தூதரகப் பேச்சிலுள்ள பணிவான தற்சுட்டைக் குறிக்கிறது.
- source_word: לְשֵׁם יְהוָה אֱלֹהֶיךָ
  choice: உங்கள் கடவுளாகிய யாவேயின் பெயருக்காக
  rationale: לְשֵׁם என்பதைக் காரணம் அல்லது நோக்கம் என மிகையாகத் தீர்மானிக்காமல் ‘பெயருக்காக’ என்று நெருக்கமாக வழங்குகிறது; திருப்பெயர் யாவே என ஒலிபெயர்க்கப்படுகிறது.
- source_word: שָׁמַעְנוּ שָׁמְעוֹ
  choice: அவருடைய புகழை … நாங்கள் கேள்விப்பட்டோம்
  rationale: ஒரே வேரைச் சார்ந்த எபிரேயச் சொற்றொடர் கேட்டறிந்த செய்தி, புகழ் அல்லது பெயர்பரவலைக் குறிக்கலாம்; ‘புகழ்’ சூழலில் இயல்பாக உள்ளது, மாற்றுப் பொருள் அடிக்குறிப்பில் காக்கப்படுகிறது.
- source_word: וְאֵת כָּל אֲשֶׁר עָשָׂה בְּמִצְרָיִם
  choice: அவர் எகிப்தில் செய்த அனைத்தையும்
  rationale: எபிரேயச் சொற்றொடரின் முழுமையையும் நேரடியாகவும் இயல்பாகவும் வழங்குகிறது.
theological_decisions:
- issue: יְהוָה என்னும் இறைப்பெயரை வழங்குதல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் உள்ள தனிப்பட்ட உடன்படிக்கைப் பெயரை பொதுப்பட்டமாக மாற்றாமல் ஒலிபெயர்த்து வழங்குகிறது.
- issue: לְשֵׁם என்பதிலுள்ள காரணம்/நோக்க நுணுக்கம்
  choice: பெயருக்காக
  alternative: பெயரின் காரணமாக
  rationale: எபிரேய முன்னிடைச்சொல் நோக்கம், அக்கறை அல்லது காரணத்தைச் சுட்டக்கூடும்; ‘பெயருக்காக’ அந்தத் திறந்த நுணுக்கத்தை அதிகமாகக் காக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழ்; கண்ணியமான ஆனால் எளிதில் புரியும் கதைநடை. ‘அடியார்கள்’ என்பது இச்சூழலில் பணிவான தற்சுட்டாகப் பயன்படுத்தப்பட்டுள்ளது; ‘யாவே’ என்பது இறைப்பெயரின் ஒலிபெயர்ப்பு.
