source:
  edition: WLC
  text: וַ/יֵּלְכ֧וּ אֶל יְהוֹשֻׁ֛עַ אֶל הַֽ/מַּחֲנֶ֖ה הַ/גִּלְגָּ֑ל וַ/יֹּאמְר֨וּ אֵלָ֜י/ו וְ/אֶל אִ֣ישׁ יִשְׂרָאֵ֗ל מֵ/אֶ֤רֶץ רְחוֹקָה֙ בָּ֔אנוּ וְ/עַתָּ֖ה כִּרְתוּ לָ֥/נוּ בְרִֽית־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/006.yaml
  text: They went to Joshua at the camp at Gilgal and said to him and to the men of Israel[a], “We have come from a distant land; so now make a covenant with us.”
translation:
  language: ta
  text: அவர்கள் கில்காலிலுள்ள முகாமில் இருந்த யோசுவாவிடம் சென்று, அவரிடமும் இஸ்ரவேலின் ஆண்களிடமும், “நாங்கள் தொலைதூர நாட்டிலிருந்து வந்திருக்கிறோம். ஆகவே இப்போது எங்களோடு ஓர் உடன்படிக்கை செய்துகொள்ளுங்கள்[a]” என்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எங்களோடு ஓர் ஒப்பந்தம் செய்துகொள்ளுங்கள்.” எபிரேய மரபுத்தொடரின் சொல்லர்த்தம், “எங்களோடு ஓர் உடன்படிக்கையை வெட்டுங்கள்” என்பதாகும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלְכוּ
  choice: சென்று
  rationale: הלך என்பதன் இயல்பான பொருள் ‘செல்/நட’; தொடரும் இலக்கை நோக்கிய இயக்கத்தைக் காட்ட ‘சென்று’ என்பது தமிழ் கதைநடையில் இயல்பாக உள்ளது.
- source_word: אֶל יְהוֹשֻׁעַ אֶל הַמַּחֲנֶה הַגִּלְגָּל
  choice: கில்காலிலிருந்த முகாமில் யோசுவாவிடம்
  rationale: மீண்டும் வரும் אֶל யோசுவாவையும் முகாமையும் இலக்காகக் குறிக்கிறது; தமிழில் இடத்தையும் நபரையும் இயல்பாக இணைக்க இந்த அமைப்பு பயன்படுத்தப்பட்டது.
- source_word: הַמַּחֲנֶה
  choice: முகாம்
  rationale: מַחֲנֶה என்பதற்கான இயல்பான நவீனத் தமிழ் இணை; பயண மற்றும் இராணுவச் சூழலுக்கும் பொருந்துகிறது.
- source_word: אֵלָיו וְאֶל אִישׁ יִשְׂרָאֵל
  choice: அவரிடமும் இஸ்ரவேலின் ஆண்களிடமும்
  rationale: אִישׁ יִשְׂרָאֵל என்பது கூட்டுப் பொருளுடைய ஒருமை வடிவம். மூலத்தின் ஆண்பால் குறிப்பையும் பலரை நோக்கிய உரையையும் காக்க ‘இஸ்ரவேலின் ஆண்கள்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: מֵאֶרֶץ רְחוֹקָה
  choice: தொலைதூர நாட்டிலிருந்து
  rationale: אֶרֶץ இங்கு நாடு/நிலம் என்றும் רְחוֹקָה தொலைவானது என்றும் பொருள்படும்; கூறப்படும் புவியியல் தொலைவைத் தெளிவாகக் காட்டுகிறது.
- source_word: בָּאנוּ
  choice: வந்திருக்கிறோம்
  rationale: எபிரேய நிறைவுவினை, வந்து தற்போது அங்கே இருப்பதன் விளைவை உரையாடலில் வெளிப்படுத்துகிறது.
- source_word: וְעַתָּה
  choice: ஆகவே இப்போது
  rationale: וְעַתָּה வேண்டுகோளுக்கான முடிவுரைத்தொடராகச் செயல்படுவதால், காலத்தையும் தர்க்கத் தொடர்பையும் இந்த வடிவம் காக்கிறது.
- source_word: כִּרְתוּ לָנוּ בְרִית
  choice: எங்களோடு ஓர் உடன்படிக்கை செய்துகொள்ளுங்கள்
  rationale: כרת ברית என்பதன் சொல்லர்த்தம் ‘உடன்படிக்கையை வெட்டுதல்’; தமிழில் அது தெளிவற்றதால் வழக்கமான ‘உடன்படிக்கை செய்துகொள்ளுதல்’ பயன்படுத்தப்பட்டது. לָנוּ-இன் பரஸ்பர உறவுப் பொருளை ‘எங்களோடு’ இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: அரசியல் ஒப்பந்தச் சூழலில் בְרִית என்பதன் மொழிபெயர்ப்பு
  choice: உடன்படிக்கை
  alternative: சமாதான ஒப்பந்தம் / ஒப்பந்தம்
  rationale: இது தூதரகச் சூழல் என்றாலும், בְרִית என்பது வேதாகமத்தில் தொடர்ந்து வரும் முக்கியச் சொல். அதன் பரந்த உறவுப்பொருளையும் சொல் ஒற்றுமையையும் காக்க ‘உடன்படிக்கை’ முதன்மை உரையில் வைக்கப்பட்டது; அரசியல் நுண்பொருள் அடிக்குறிப்பில் தரப்பட்டது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, மரியாதைமிக்க கதைநடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் கூட்டுப் பாலினக் குறிப்பை மறைக்காமல் ‘இஸ்ரவேலின் ஆண்கள்’ எனவும், முக்கிய வேதாகமச் சொல்லான בְרִית-ஐ ‘உடன்படிக்கை’ எனவும் காக்கப்பட்டுள்ளது.
