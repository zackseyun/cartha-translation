source:
  edition: WLC
  text: וַ/יֹּאמְר֤וּ כָל הַ/נְּשִׂיאִים֙ אֶל כָּל הָ֣/עֵדָ֔ה אֲנַ֨חְנוּ֙ נִשְׁבַּ֣עְנוּ לָ/הֶ֔ם בַּֽ/יהוָ֖ה אֱלֹהֵ֣י יִשְׂרָאֵ֑ל וְ/עַתָּ֕ה לֹ֥א נוּכַ֖ל לִ/נְגֹּ֥עַ בָּ/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/019.yaml
  text: But all the leaders said to all the congregation[a], “We have sworn to them by Yahweh, the God of Israel, and now we cannot touch them.”
translation:
  language: ta
  text: ஆனால் தலைவர்கள் அனைவரும் சபையினர் அனைவரிடமும், “இஸ்ரவேலின் கடவுளாகிய யாவேமேல் நாங்கள் அவர்களுக்கு ஆணையிட்டிருக்கிறோம்; இப்போது அவர்களைத் தொட முடியாது[a]” என்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்களுக்குத் தீங்கு செய்ய முடியாது” அல்லது “அவர்களைத் தாக்க முடியாது”; சொல்லுக்குச் சொல், “அவர்களைத் தொட முடியாது.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: ஆனால் ... என்றார்கள்
  rationale: வாவ் தொடர்வினை அடிப்படையில் ‘அப்போது/மற்றும் ... சொன்னார்கள்’ எனப் பொருள்பட்டாலும், முந்தைய முறையீட்டுக்கு மாறான தலைவர்களின் பதிலை இங்கு ‘ஆனால்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: כָל הַנְּשִׂיאִים
  choice: தலைவர்கள் அனைவரும்
  rationale: נָשִׂיא என்பது இங்கு இஸ்ரவேலின் ஆளும் பிரதிநிதிகளைக் குறிக்கிறது; ‘தலைவர்கள்’ நவீனத் தமிழில் தெளிவானதும் இயல்பானதும் ஆகும்.
- source_word: כָל הָעֵדָה
  choice: சபையார் அனைவரிடமும்
  rationale: עֵדָה இஸ்ரவேலின் ஒன்றுகூடிய சமூகத்தைக் குறிக்கிறது. ‘சபையார்’ அதன் கூட்டுத் தன்மையையும் மக்களைக் குறிக்கும் பொருளையும் இயல்பாகத் தருகிறது.
- source_word: נִשְׁבַּעְנוּ לָהֶם
  choice: ஆணையிட்டு அவர்களுக்கு வாக்குக் கொடுத்திருக்கிறோம்
  rationale: שׁבע என்பதன் அடிப்படைப் பொருள் ஆணையிடுதல். தமிழில் ‘அவர்களுக்கு ஆணையிட்டோம்’ என்பது தெளிவில்லாததால், ஆணையின் அடிப்படையில் கொடுக்கப்பட்ட வாக்குறுதியையும் அதன் தொடரும் கட்டுப்பாட்டையும் இச்சொற்றொடர் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: בַּיהוָה
  choice: யாவேமேல்
  rationale: שׁבע உடன் வரும் בְּ ஆணை யார்மேல் இடப்பட்டது என்பதைக் குறிக்கிறது. יהוה என்ற உடன்படிக்கைப் பெயர் ‘யாவே’ என ஒலிபெயர்க்கப்படுகிறது.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் கடவுளாகிய
  rationale: இது யாவேவை இஸ்ரவேலின் கடவுளாக அடையாளப்படுத்தும் நேரடியான இணைப்புத் தொடர்.
- source_word: וְעַתָּה
  choice: ஆகவே இப்போது
  rationale: எபிரெயத்தில் ‘மற்றும் இப்போது’ என்றிருந்தாலும், இங்கு முந்தைய ஆணையால் ஏற்படும் தற்போதைய விளைவை ‘ஆகவே இப்போது’ இயல்பாகக் காட்டுகிறது.
- source_word: לֹא נוּכַל
  choice: நாம் ... முடியாது
  rationale: יכל இயலாமையைக் குறிக்கிறது; சூழலில் அது ஆணையால் உண்டான ஒழுக்கக் கட்டுப்பாட்டையும் உள்ளடக்குகிறது. ‘முடியாது’ இந்த இரு நிழல்களையும் தீர்மானிக்காமல் தக்கவைக்கிறது.
- source_word: לִנְגֹּעַ בָּהֶם
  choice: அவர்களைத் தொட முடியாது
  rationale: נגע என்பதன் நேரடிப் பொருள் ‘தொடுதல்’; இச்சூழலில் தீங்கு செய்வதையோ தாக்குவதையோ மரபுத்தொடராகக் குறிக்கலாம். நேரடிப் பொருள் முதன்மை உரையில் வைக்கப்பட்டு, சூழல் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூல உரை நான்கு எழுத்துகளைக் கொண்ட தனிப்பட்ட உடன்படிக்கைப் பெயரை நேரடியாகப் பயன்படுத்துகிறது. அதை ஒரு பட்டமாக மாற்றாமல் ‘யாவே’ என ஒலிபெயர்ப்பது பெயரின் தனித்தன்மையைப் பாதுகாக்கிறது.
- issue: ஆணையால் ஏற்பட்ட ‘இயலாமை’
  choice: முடியாது
  alternative: செய்யக் கூடாது
  rationale: לֹא נוּכַל இலக்கண ரீதியாக இயலாமையைக் கூறுகிறது; சூழல் அதற்கு ஒழுக்க மற்றும் உடன்படிக்கைக் கட்டுப்பாட்டை அளிக்கிறது. ‘முடியாது’ என்பதால் உரையில் உள்ள இந்தப் பதற்றம் தீர்க்கப்படாமல் காக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் மரியாதையும் கதைநடைத் தெளிவும் பேணப்பட்டுள்ளன. ‘சபையார்’ சமூகக் கூட்டைக் குறிக்கிறது; ‘யாவேமேல் ஆணையிட்டு ... வாக்குக் கொடுத்திருக்கிறோம்’ என்பது எபிரெய ஆணைமொழியின் தொடரும் கட்டுப்பாட்டை சாதாரண வாசகருக்குத் தெளிவாக்குகிறது.
