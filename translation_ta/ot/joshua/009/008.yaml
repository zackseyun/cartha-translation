translation_notes:
  register: நவீன, தெளிவான, மரியாதைமிக்க தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘உங்கள்’ என்பது யோசுவாவை நோக்கிய ஒருமை உரையில் மரியாதையையும், ‘நீங்கள்’ என்பது கிபியோனியர்களைக் குறிக்கும் பன்மையையும் இயல்பாக வெளிப்படுத்துகிறது. அடிக்குறிப்பு குறியீடு தொடர்புடைய சொல்லுக்குப் பின் நேரடியாக வைக்கப்பட்டுள்ளது.
