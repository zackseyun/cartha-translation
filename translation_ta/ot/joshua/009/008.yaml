  text: וַ/יֹּאמְר֥וּ אֶל יְהוֹשֻׁ֖עַ עֲבָדֶ֣י/ךָ אֲנָ֑חְנוּ וַ/יֹּ֨אמֶר אֲלֵ/הֶ֧ם יְהוֹשֻׁ֛עַ מִ֥י אַתֶּ֖ם וּ/מֵ/אַ֥יִן תָּבֹֽאוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/008.yaml
  text: They said to Joshua[a], “We are your servants.” Then Joshua said to them, “Who are you, and where do you come from?”
translation:
  language: ta
  text: அவர்கள் யோசுவாவிடம், “நாங்கள் உங்கள் சேவகர்கள்[a]” என்றார்கள். அப்போது யோசுவா அவர்களிடம், “நீங்கள் யார்? எங்கிருந்து வருகிறீர்கள்?” என்று கேட்டார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நாங்கள் உங்கள் அடிமைகள்.” எபிரெயச் சொல் சேவகர்களையோ அடிமைகளையோ குறிக்கலாம். இங்கு பேசுகிறவர்கள் தூதரக வேண்டுகோளில் தாழ்மையான மொழியைப் பயன்படுத்துவதால், முதன்மை உரையில் “சேவகர்கள்” என மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲבָדֶיךָ
  choice: உங்கள் பணியாளர்கள்
  rationale: עֶבֶד என்பது சூழலைப் பொறுத்து ‘பணியாளர்’ அல்லது ‘அடிமை’ எனப் பொருள்படலாம். இங்கு கிபியோனியர்கள் தாங்கள் ஏற்கெனவே சட்டரீதியான அடிமைகள் என்று கூறாமல், தூதரக வேண்டுகோளில் தாழ்மையையும் கீழ்ப்படிதலையும் வெளிப்படுத்துகிறார்கள். எனவே இயல்பான நவீன தமிழில் ‘உங்கள் பணியாளர்கள்’ என மொழிபெயர்க்கப்பட்டு, மற்ற சாத்தியம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: אֲנָחְנוּ
  choice: நாங்கள் ... [ஆக இருக்கிறோம்]
  rationale: எபிரெய பெயர்ச்சொல் வாக்கியத்தில் வெளிப்படையான இணைப்புவினை இல்லை. தமிழில் இயல்பான நேரடிக் கூற்றாக ‘நாங்கள் உங்கள் பணியாளர்கள்’ என்பதே போதுமானது; ‘இருக்கிறோம்’ என்பதைச் சேர்க்கத் தேவையில்லை.
- source_word: מִי אַתֶּם
  choice: நீங்கள் யார்?
  rationale: வினாப்பெயரும் பன்மைப் பதிலிடுபெயரும் நேரடியாக மொழிபெயர்க்கப்பட்டுள்ளன. மூலத்தில் இல்லாத ‘மனிதர்கள்’ போன்ற பெயர்ச்சொல் சேர்க்கப்படவில்லை.
- source_word: וּמֵאַיִן תָּבֹאוּ
  choice: எங்கிருந்து வருகிறீர்கள்?
  rationale: מֵאַיִן தோற்ற இடத்தைப் பற்றி ‘எங்கிருந்து?’ என்று கேட்கிறது. இங்குள்ள בוא வினையின் வடிவம் உடனடி நகர்வை மட்டும் அல்லாமல் அவர்கள் வந்த இடத்தையும் குறிக்க முடிவதால், இயல்பான தமிழில் ‘எங்கிருந்து வருகிறீர்கள்?’ என வழங்கப்பட்டுள்ளது.
- source_word: וַיֹּאמְרוּ / וַיֹּאמֶר
  choice: என்றார்கள் ... அதற்கு ... என்று கேட்டார்
  rationale: எபிரெயக் கதைத் தொடரின் வாவ் வடிவங்கள் தமிழின் இயல்பான இறந்தகால உரையாடல் நடையில் தரப்பட்டுள்ளன. இரண்டாவது கூற்று கேள்வியாக இருப்பதால் ‘கேட்டார்’ என்பது பேச்சுச் செயலின் தன்மையைத் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது; ‘அதற்கு’ பேச்சாளர் மாறுவதைக் குறிக்கிறது.
