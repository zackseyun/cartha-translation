- issue: יְהוָה என்ற திருப்பெயரின் மொழிபெயர்ப்பு
  choice: யெகோவா
  alternative: யாவே
  rationale: மூலத்தில் திருப்பெயர் நேரடியாக உள்ளது. அதை ‘கர்த்தர்’ போன்ற பட்டப்பெயராக மாற்றாமல், தமிழில் பரவலாக அறியப்படும் ஒலிபெயர்ப்பால் தனிப்பெயராகக் காக்கிறது.
- issue: கானான் குடிகளை அழிக்கும் கட்டளையின் வலிமை
  choice: அழித்தொழிக்கவும்
  alternative: அகற்றவும்
  rationale: השמיד என்பதன் கடுமையான பொருளைத் தணிக்காமல் மொழிபெயர்க்கிறது; வசனத்தில் பேசுபவர்கள் அந்தக் கட்டளையைத் தாங்கள் கேட்ட விதமாக எடுத்துரைக்கிறார்கள் என்பதையும் உரை அப்படியே விடுகிறது.
