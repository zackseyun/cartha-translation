base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/024.yaml
  text: 'They answered Joshua and said[a], “Because it was clearly told to your servants what Yahweh your God commanded his servant Moses: to give you all the land and to destroy all the inhabitants of the land before you. So we feared greatly for our lives because of you, and we did this thing.”'
translation:
  language: ta
  text: 'அவர்கள் யோசுவாவுக்குப் பதிலளித்துச் சொன்னார்கள்: “யாவே உங்கள் கடவுள் தம் ஊழியரான மோசேக்குக் கட்டளையிட்டது உங்கள் ஊழியர்களாகிய எங்களுக்குத் தெளிவாக அறிவிக்கப்பட்டது[a]: உங்களுக்கு நாடு முழுவதையும் கொடுக்கவும், நாட்டில் வாழும் அனைவரையும் உங்களுக்கு முன்னால் அழித்தொழிக்கவும். ஆகவே, உங்களால் எங்கள் உயிர்களுக்காக மிகவும் பயந்தோம்; இப்படிச் செய்தோம்.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உங்கள் ஊழியர்களாகிய எங்களுக்கு உறுதியாக அறிவிக்கப்பட்டது.” எபிரெயத்தில் வினையின் முடிவிலா வடிவமும் முடிவுற்ற வினையும் சேர்ந்து வலியுறுத்தலைத் தருகின்றன.
    reason: lexical_alternative
