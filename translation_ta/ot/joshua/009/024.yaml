  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான வரலாற்று உரைநடை. கிபியோனியரின் பணிவான பேச்சை ‘உங்கள் ஊழியர்களாகிய எங்களுக்கு’ என்பதால் காக்கிறது. மூலத்தின் வலியுறுத்தலும் அழிவுக் கட்டளையின் கடுமையும் மென்மைப்படுத்தப்படவில்லை.
