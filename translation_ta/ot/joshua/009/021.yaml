  text: The leaders said to them[a], “Let them live.” So they became woodcutters and water-drawers for all the congregation, just as the leaders had spoken to them.
translation:
  language: ta
  text: தலைவர்கள் அவர்களிடம், “அவர்கள் உயிரோடு இருக்கட்டும்” என்றார்கள். ஆகவே, முழு மக்கள் கூட்டத்திற்கும் விறகு வெட்டுபவர்களாகவும் தண்ணீர் எடுப்பவர்களாகவும் அவர்கள் ஆனார்கள்; தலைவர்கள் அவர்களிடம் கூறியபடியே.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַנְּשִׂיאִים
  choice: தலைவர்கள்
  rationale: இஸ்ரவேல் மக்கள் கூட்டத்தின் அங்கீகரிக்கப்பட்ட தலைவர்களைச் சுட்டுகிறது; நவீனத் தமிழில் தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: יִחְיוּ
  choice: அவர்கள் உயிரோடு இருக்கட்டும்
  rationale: இங்கு imperfect வடிவம் அனுமதி அல்லது தீர்மானத்தை வெளிப்படுத்தும் jussive பொருளில் வருகிறது.
- source_word: וַיִּהְיוּ
  choice: அவர்கள் ஆனார்கள்
  rationale: கிபியோனியருக்கு விதிக்கப்பட்ட புதிய பணிநிலைக்கான மாற்றத்தைத் தெரிவிக்கிறது.
- source_word: חֹטְבֵי עֵצִים
  choice: விறகு வெட்டுபவர்கள்
  rationale: தொடர்ந்து செய்ய வேண்டிய உழைப்புப் பணியை இயல்பான நவீனத் தமிழில் குறிக்கிறது.
- source_word: שֹׁאֲבֵי מַיִם
  choice: தண்ணீர் எடுப்பவர்கள்
  rationale: நீர்நிலையிலிருந்து தண்ணீர் எடுக்கும் பணியைத் துல்லியமாகவும் பொதுவாகப் புரியும் வகையிலும் தெரிவிக்கிறது.
- source_word: לְכָל הָעֵדָה
  choice: மக்கள் கூட்டம் முழுவதற்கும்
  rationale: עֵדָה என்பது இங்கு இஸ்ரவேலின் ஒன்றுகூடிய சமூகத்தைக் குறிக்கிறது; ‘சபை’ என்பதன் நவீன திருச்சபை சார்ந்த தவறான புரிதலைத் தவிர்க்கிறது.
- source_word: כַּאֲשֶׁר דִּבְּרוּ לָהֶם
  choice: தலைவர்கள் அவர்களிடம் கூறியபடியே இது நடந்தது
  rationale: அவர்களுக்கு முன்பு அறிவிக்கப்பட்ட தலைவர்களின் தீர்மானத்திற்கேற்ப இந்தப் பணிநிலை ஏற்பட்டது என்பதை இயல்பான தமிழில் தெளிவாக்குகிறது.
