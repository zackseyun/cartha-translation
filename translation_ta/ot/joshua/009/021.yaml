  source_fidelity: முதன்மை உரை பெரும்பாலும் எபிரெய மூலத்துடன் ஒத்துள்ளது. ஆனால் வ. 21-இன் இறுதிப் பகுதி, ‘தலைவர்கள் அவர்களிடம் கூறியபடியே’ என்ற நேரடியான தொடர்பை ‘இது நடந்தது’ எனச் சேர்த்து மறுவடிவமைக்கிறது; மூலத்தில் அந்தச் சேர்க்கை இல்லை. மேலும் חֹטְבֵי עֵצִים என்பது பொதுவாக ‘மரங்கள்/விறகு வெட்டுபவர்கள்’ என்று வரலாம்; இங்கு ‘விறகு வெட்டுபவர்கள்’ பொருத்தமானது. שֹׁאֲבֵי מַיִם என்பதற்கு ‘தண்ணீர் எடுப்பவர்கள்’ துல்லியமானது.
  naturalness: ‘தலைவர்கள் அவர்களிடம் கூறியபடியே இது நடந்தது’ இயல்பான தமிழாக இருந்தாலும், மூலத்தின் சுருக்கமான மீளுரைப்பை விட விளக்கவுரையாகிறது. ‘தலைவர்கள் அவர்களிடம் கூறியபடியே’ என்று முடிப்பது இயல்பாகவும் மூலத்திற்கு நெருக்கமாகவும் உள்ளது. ‘மக்கள் கூட்டம் முழுவதற்கும்’ புரியத்தக்கது; ‘முழு மக்கள் கூட்டத்திற்கும்’ சற்று நேரடியான ஓட்டம் தருகிறது.
  terminology: ‘தலைவர்கள்’, ‘உயிரோடு இருக்கட்டும்’, ‘விறகு வெட்டுபவர்கள்’, ‘தண்ணீர் எடுப்பவர்கள்’ ஆகியவை நவீனத் தரநிலைத் தமிழில் பொருத்தமானவை. அடிக்குறிப்பில் ‘முகக்கிறவர்கள்’ என்பது சில வட்டாரங்களில் அறியப்பட்டாலும், நவீனப் பொதுத் தமிழில் குறைவாகத் தெளிவானது; ‘தண்ணீர் எடுப்பவர்கள்’ என்பதே ஏற்கெனவே பிரதான உரையில் உள்ளது. ஆகவே முறையான மாற்றாக ‘மரங்களை வெட்டுபவர்களும் தண்ணீர் எடுப்பவர்களும்’ வழங்கலாம்.
