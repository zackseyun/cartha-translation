  yaml_path: translation/ot/joshua/024/024.yaml
  text: And the people said to Joshua[a], “We will serve Yahweh our God[b], and we will obey his voice.”
translation:
  language: ta
  text: மக்கள் யோசுவாவிடம், “நாங்கள் நம் கடவுளாகிய யாவேவுக்குச் சேவை செய்வோம்; அவருடைய குரலுக்குக் கீழ்ப்படிவோம்[a]” என்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'சொல்லுக்குச் சொல்: “அவருடைய குரலைக் கேட்போம்.” இது அவர் சொல்வதைக் கேட்டு அதன்படி நடப்பதைக் குறிக்கும் எபிரெய மரபுத்தொடர்.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ הָעָם אֶל יְהוֹשֻׁעַ
  choice: மக்கள் யோசுவாவிடம் ... என்றார்கள்
  rationale: எபிரெய உரையின் சாதாரண கதைநடை அறிமுகத்தையும் நேரடிக் கூற்றையும் இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: אֶת יְהוָה אֱלֹהֵינוּ
  choice: நம் கடவுளாகிய யாவேவுக்கு
  rationale: יְהוָה என்ற உடன்படிக்கைப் பெயரை ‘யாவே’ என ஒலிபெயர்த்து, אֱלֹהֵינוּ என்பதிலுள்ள முதலாம் நபர் பன்மை உறவை ‘நம் கடவுள்’ எனப் பாதுகாக்கிறது.
- source_word: נַעֲבֹד
  choice: சேவை செய்வோம்
  rationale: עבד இங்கு வழிபாட்டையும் உடன்படிக்கை சார்ந்த முழுமையான பணிவிடையையும் குறிக்கலாம்; ‘சேவை செய்வோம்’ என்பது ‘வழிபடுவோம்’ என்பதைவிட விரிந்த பொருளைப் பாதுகாக்கிறது.
- source_word: וּבְקוֹלוֹ נִשְׁמָע
  choice: அவருடைய குரலுக்குக் கீழ்ப்படிவோம்
  rationale: சொல்லாட்சியிலுள்ள ‘அவருடைய குரலைக் கேட்போம்’ என்ற எபிரெய மரபுத்தொடரின் கீழ்ப்படிதல் சார்ந்த பொருளைத் தெளிவாகத் தருவதோடு ‘குரல்’ என்ற உருவகத்தையும் வைத்திருக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலத்தில் வரும் தனிப்பட்ட உடன்படிக்கைப் பெயரை ஒரு பொதுப் பட்டமாக மாற்றாமல் ஒலிபெயர்க்கிறது.
- issue: உடன்படிக்கைச் சூழலில் עבד என்பதன் சமயப் பொருள்
  choice: சேவை செய்வோம்
  alternative: வழிபடுவோம்
  rationale: இது வழிபாட்டை உள்ளடக்கியிருந்தாலும், விசுவாசம், பணிவிடை, உடன்படிக்கைப் பற்றுறுதி ஆகிய விரிந்த பொருள்களை ‘சேவை’ பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் எளிமையான, கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘யாவே’ என்ற இறைப் பெயரும், ‘சேவை செய்வோம்’ என்ற விரிந்த உடன்படிக்கைச் சொல்லும் பாதுகாக்கப்பட்டுள்ளன; எபிரெய மரபுத்தொடரின் நேரடி வடிவம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
