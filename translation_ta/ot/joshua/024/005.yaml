revisions:
- from: பின்னர் நான் மோசேயையும் ஆரோனையும் அனுப்பி, எகிப்தைத் தாக்கினேன்[a]—அதன் நடுவில் நான் செய்தவற்றின்படியே[b] தாக்கினேன்; அதன்பின் உங்களை வெளியே கொண்டுவந்தேன்.
  to: நான் மோசேயையும் ஆரோனையும் அனுப்பினேன்; அதன் நடுவில் நான் செய்த செயல்களால் எகிப்தைத் தாக்கினேன்[a][b]; பின்னர் உங்களை வெளியே கொண்டுவந்தேன்.
