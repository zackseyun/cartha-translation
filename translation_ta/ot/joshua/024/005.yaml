base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/005.yaml
  text: Then I sent Moses and Aaron[a], and I struck Egypt as I did in its midst[b], and afterward I brought you out.
translation:
  language: ta
  text: நான் மோசேயையும் ஆரோனையும் அனுப்பினேன்; அதன் நடுவில் நான் செய்த செயல்களால் எகிப்தைத் தாக்கினேன்[a][b]; பின்னர் உங்களை வெளியே கொண்டுவந்தேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘எகிப்தை வாதைகளால் துன்புறுத்தினேன்.’ எபிரெய வினை ‘தாக்குதல்’ அல்லது ‘துன்புறுத்துதல்’ என்று பொருள்படலாம்; இங்கு அது எகிப்தின்மீது செய்யப்பட்ட அடிகளைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: 'சொல்லுக்குச் சொல்: ‘நான் அதன் நடுவில் செய்தபடி.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶשְׁלַח
  choice: நான் அனுப்பி
  rationale: שׁלח என்பதன் இயல்பான பொருள் ‘அனுப்பு’. மோசேயையும் ஆரோனையும் கடவுள் பணிக்காக அனுப்பியதை நவீனத் தமிழில் நேரடியாகத் தெரிவிக்கிறது.
- source_word: מֹשֶׁה וְאֶת־אַהֲרֹן
  choice: மோசேயையும் ஆரோனையும்
  rationale: தமிழ் வேதாகம மரபிலும் பொதுப் பயன்பாட்டிலும் நிலைபெற்ற பெயர் வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன; இரு பெயர்களையும் ஒரே வினையின் நேரடிச் செயப்படுபொருள்களாக ‘ஐயும்’ உருபு இணைக்கிறது.
- source_word: וָאֶגֹּף אֶת־מִצְרַיִם
  choice: எகிப்தைத் தாக்கினேன்
  rationale: נגף என்பது தாக்குதல் அல்லது துன்புறுத்துதலைக் குறிக்கலாம். சூழல் எகிப்தின்மீது வந்த வாதைகளைக் குறிப்பிட்டாலும், ‘தாக்கினேன்’ என்பது எபிரெய வினையின் நேரடித் தன்மையைப் பாதுகாக்கிறது.
- source_word: כַּאֲשֶׁר עָשִׂיתִי בְּקִרְבּוֹ
  choice: அதன் நடுவில் நான் செய்தவற்றின்படியே
  rationale: சுருக்கமான எபிரெயத் தொடரை விளக்கிப் பரவலாக்காமல், ‘அதன் நடுவில்’ என்ற ஒருமைச் சுட்டையும் ‘செய்தபடி/செய்தவற்றின்படி’ என்ற ஒப்புமைத் தொடர்பையும் பாதுகாக்கிறது. தமிழில் தெளிவுக்காக ‘தாக்கினேன்’ மீண்டும் கூறப்பட்டுள்ளது.
- source_word: וְאַחַר
  choice: அதன்பின்
  rationale: நிகழ்வுகளின் கால வரிசையை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: הוֹצֵאתִי אֶתְכֶם
  choice: உங்களை வெளியே கொண்டுவந்தேன்
  rationale: יצא என்பதன் ஹிஃபில் வடிவம் ‘வெளியே கொண்டுவருதல்’ என்று பொருள்படும். மூலத்தின் இரண்டாம் நபர் பன்மையை மாற்றாமல் வைத்திருக்கிறது.
theological_decisions:
- issue: ‘உங்களை’ என்ற இரண்டாம் நபர் பன்மையின் குறிப்பு
  choice: இஸ்ரவேலைக் கூட்டாக நோக்கி ‘உங்களை’ என்று மூலத்தில் உள்ளபடியே தக்கவைத்தல்
  alternative: ‘உங்கள் முன்னோர்களை’ என்று வெளியே கொண்டுவந்தேன் என விளக்கிப் பெயர்த்தல்
  rationale: யோசுவா 24-ல் உடன்படிக்கைச் சமூகத்திடம் அவர்களின் முன்னோர் அனுபவத்தையும் உள்ளடக்கி நேரடியாகப் பேசும் சொல்லாட்சி காணப்படுகிறது. மொழிபெயர்ப்பு அந்த இறையியல் அழுத்தத்தை விளக்கவுரையால் நீக்காமல் காக்கிறது.
- issue: எகிப்தின்மீது செய்யப்பட்ட செயல்களின் தன்மை
  choice: ‘தாக்கினேன்’ என்று பொதுவான வினையைத் தக்கவைத்து, வாதைகள் என்ற சூழல் சார்ந்த புரிதலை அடிக்குறிப்பில் குறிப்பிடுதல்
  alternative: ‘வாதைகளால் வதைத்தேன்’ என்று வெளிப்படையாக விளக்கிப் பெயர்த்தல்
  rationale: נגף என்பதன் பொருள் பரப்பைச் சுருக்காமல், எகிப்தின் வாதைகளைக் குறிக்கும் சூழலையும் வாசகருக்குத் தெரிவிக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. எபிரெயத்தின் சுருக்கமான தொடரை வாசிக்கத்தக்கதாக்க ‘தாக்கினேன்’ மீண்டும் கூறப்பட்டுள்ளது; ‘அதன் நடுவில்’ என்ற ஒருமையும் ‘உங்களை’ என்ற கூட்டுச் சொல்லாட்சியும் பாதுகாக்கப்பட்டுள்ளன.
