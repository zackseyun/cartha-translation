  yaml_path: translation/ot/joshua/024/033.yaml
  text: And Eleazar the son of Aaron died, and they buried him at Gibeath-phinehas, his son’s hill country, which had been given to him in the hill country of Ephraim.
translation:
  language: ta
  text: ஆரோனின் மகன் எலெயாசார் இறந்தார்; அவரை அவருடைய மகன் பினெகாசின் கிபியாவில் அடக்கம் செய்தார்கள்; அது எப்பிராயீம் மலைநாட்டில் அவருக்குக் கொடுக்கப்பட்டிருந்தது.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “பினெகாசின் கிபியா” என்பதை “அவருடைய மகன் பினெகாசின் குன்று” என்றும் மொழிபெயர்க்கலாம். “அவருக்கு” என்பது எலெயாசாரையோ பினெகாசையோ குறிக்கலாம்.
    reason: גִּבְעַת פִּינְחָס என்ற சொல்லின் இடப்பெயர்/பொதுப்பெயர் வாய்ப்பையும் לוֹ என்பதன் தெளிவற்ற சுட்டுக்குறிப்பையும் பாதுகாக்கிறது.
lexical_decisions:
- source_word: בְּגִבְעַת פִּינְחָס בְּנוֹ
  choice: அவருடைய மகன் பினெகாசுக்குக் கொடுக்கப்பட்டிருந்த கிபியாவில்
  rationale: גִּבְעָה என்பது பொதுப்பெயராக ‘குன்று’ என்றும் இடப்பெயராக ‘கிபியா’ என்றும் கொள்ளப்படலாம். தொடரிலுள்ள אֲשֶׁר נִתַּן לוֹ என்பதையும் இயல்பான தமிழையும் கருத்தில் கொண்டு, பினெகாசுக்குக் கொடுக்கப்பட்ட கிபியா என்ற இடப்பெயர் வாசிப்பு முதன்மை உரையில் தரப்படுகிறது; மாற்று வாசிப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: בְּהַר אֶפְרָיִם
  choice: எப்பிராயீம் மலைநாட்டில்
  rationale: הַר இங்கு தனியொரு மலையைவிட எப்பிராயீமின் மலைப்பாங்கான பிரதேசத்தைக் குறிக்கிறது.
- source_word: וַיִּקְבְּרוּ אֹתוֹ
  choice: அவரை ... அடக்கம் செய்தார்கள்
  rationale: எபிரெயச் செயப்பாட்டு வரிசையையும் அடக்கச் செயலைக் குறிக்கும் இயல்பான நவீனத் தமிழையும் பேணுகிறது.
theological_decisions:
- issue: לוֹ என்ற ஆண்பால் ஒருமைச் சுட்டுப்பெயரின் குறிப்பு
  choice: பினெகாசுக்குக் கொடுக்கப்பட்டிருந்தது
  alternative: எலெயாசாருக்குக் கொடுக்கப்பட்டிருந்தது
  rationale: அருகிலுள்ள בְּנוֹ (‘அவருடைய மகன்’) என்பதையும் இடம் பினெகாசுடன் தொடர்புபடுத்தப்படும் பாரம்பரியப் புரிதலையும் பின்பற்றுகிறது; எனினும் எபிரெயச் சுட்டுப்பெயர் இலக்கண ரீதியில் இருவரில் ஒருவரைக் குறிக்கக்கூடியதால் மாற்று அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
translation_notes:
  register: நவீன தரத் தமிழ்; எளிமையான, கண்ணியமான வேதாகம உரைநடை. பெயர்கள் தமிழில் வழக்கமான வடிவங்களில் ஒலிபெயர்க்கப்பட்டுள்ளன; மூலமொழியின் உண்மையான தெளிவின்மை அடிக்குறிப்பில் வெளிப்படையாக வைக்கப்பட்டுள்ளது.
