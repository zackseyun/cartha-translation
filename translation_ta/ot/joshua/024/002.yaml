  text: וַ/יֹּ֨אמֶר יְהוֹשֻׁ֜עַ אֶל כָּל הָ/עָ֗ם כֹּֽה אָמַ֣ר יְהוָה֮ אֱלֹהֵ֣י יִשְׂרָאֵל֒ בְּ/עֵ֣בֶר הַ/נָּהָ֗ר יָשְׁב֤וּ אֲבֽוֹתֵי/כֶם֙ מֵֽ/עוֹלָ֔ם תֶּ֛רַח אֲבִ֥י אַבְרָהָ֖ם וַ/אֲבִ֣י נָח֑וֹר וַ/יַּעַבְד֖וּ אֱלֹהִ֥ים אֲחֵרִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/002.yaml
  text: 'And Joshua said to all the people[a], “Thus says Yahweh, the God of Israel: Long ago your fathers lived beyond the River—Terah[b], the father of Abraham and the father of Nahor—and they served other gods.”'
translation:
  language: ta
  text: 'யோசுவா மக்கள் அனைவரிடமும், “இஸ்ரவேலின் கடவுளாகிய யாவே கூறுவது இதுவே: முற்காலத்தில் உங்கள் மூதாதையர்கள்[b] ஆற்றின் மறுபுறத்தில்[a] வாழ்ந்தார்கள்—அவர்களில் ஆபிரகாமுக்கும் நாகோருக்கும் தந்தையான தேராகுவும் ஒருவர். அவர்கள் வேறு தெய்வங்களை வழிபட்டார்கள்” என்றார்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ஆறு” என்பது பெரும்பாலும் யூபிரட்டீஸ் ஆற்றைக் குறிக்கிறது.
    reason: cultural_note
  - marker: b
    text: எபிரெயத்தில் “உங்கள் தந்தையர்”; இங்கு முன்னோர்கள் அல்லது மூதாதையர்கள் என்று பொருள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר יְהוֹשֻׁעַ אֶל כָּל הָעָם
  choice: யோசுவா மக்கள் அனைவரிடமும் ... என்றார்
  rationale: எபிரெயக் கதைநடையின் தொடர்ச்சியை இயல்பான நவீனத் தமிழில் தருகிறது; כָּל הָעָם என்பது உடன்படிக்கைச் சமூகமாகக் கூடியிருந்த மக்கள் அனைவரையும் குறிக்கிறது.
- source_word: כֹּה אָמַר
  choice: கூறுவது இதுவே
  rationale: தெய்வீகத் தூதுரையின் வழக்கமான அறிமுகச் சூத்திரத்தைத் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: நான்கு எழுத்துகளைக் கொண்ட இறைபெயரை பொதுப்பட்டமாக மாற்றாமல், தமிழில் பரவலாகப் புரியக்கூடிய ஒலிபெயர்ப்பில் தருகிறது.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் கடவுளாகிய
  rationale: இஸ்ரவேலோடு யாவேக்குள்ள அடையாள மற்றும் உடன்படிக்கை உறவை இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: בְּעֵבֶר הַנָּהָר
  choice: ஆற்றின் மறுபுறத்தில்
  rationale: குறிப்பிட்ட ஓர் அறியப்பட்ட ஆற்றின் அப்பக்கப் பகுதியைச் சுட்டும் எபிரெயச் சொல்லாட்சியைப் பாதுகாக்கிறது; பிரதான உரையில் அதை யூபிரட்டீஸ் என்று வெளிப்படையாக மாற்றவில்லை.
- source_word: יָשְׁבוּ
  choice: வாழ்ந்தார்கள்
  rationale: இங்கு குடியிருத்தல் அல்லது வசித்தல் என்ற பொருளை நவீனத் தமிழில் இயல்பாகத் தெரிவிக்கிறது.
- source_word: אֲבוֹתֵיכֶם
  choice: உங்கள் மூதாதையர்கள்
  rationale: இச்சூழலில் தலைமுறைகளுக்கு முந்திய முன்னோர்களைக் குறிக்கிறது. தமிழில் ‘மூதாதையர்கள்’ இயல்பான வரலாற்று-வம்சச் சொல்லாக இருப்பதால் பயன்படுத்தப்பட்டுள்ளது; மூலத்தின் சொற்சார்ந்த ‘தந்தையர்’ வடிவம் அடிக்குறிப்பில் குறிப்பிடப்படுகிறது.
- source_word: מֵעוֹלָם
  choice: முற்காலத்தில்
  rationale: இங்கு முடிவில்லாத நித்தியத்தை அல்ல, வெகுகாலத்துக்கு முந்திய காலத்தைச் சுட்டுகிறது.
- source_word: תֶּרַח אֲבִי אַבְרָהָם וַאֲבִי נָחוֹר
  choice: அவர்களில் ஆபிரகாமுக்கும் நாகோருக்கும் தந்தையான தேராகுவும் ஒருவர்
  rationale: தேராகு முன்னோர்களில் ஒருவர் என்பதைத் தமிழில் தெளிவுபடுத்தி, அவர் ஆபிரகாமுக்கும் நாகோருக்கும் தந்தை என்ற இரு உறவுகளையும் தக்கவைக்கிறது.
- source_word: וַיַּעַבְדוּ אֱלֹהִים אֲחֵרִים
  choice: அவர்கள் வேறு தெய்வங்களை வழிபட்டார்கள்
  rationale: தெய்வங்களைச் சார்ந்த עבד என்பதன் சமயப் பணிவிடை அல்லது வழிபாடு என்ற பொருளை சாதாரண வாசகருக்குத் தெளிவாகத் தருகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைபெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூலத்தில் பொதுப்பட்டம் அல்ல, தனிப்பட்ட உடன்படிக்கைப் பெயரே உள்ளது; ஆகவே பெயர் ஒலிபெயர்க்கப்படுகிறது.
- issue: אֲבוֹתֵיכֶם என்ற மூதாதையர் குறிப்பு
  choice: உங்கள் மூதாதையர்கள்
  alternative: உங்கள் தந்தையர்
  rationale: ‘தந்தையர்’ என்பது சொற்சார்ந்த வடிவம் என்றாலும், இங்கு தேராகு உள்ளிட்ட முந்திய தலைமுறையினரைச் சுட்டுவதால் ‘மூதாதையர்கள்’ நவீனத் தமிழில் துல்லியமான சூழற்பொருளைத் தருகிறது; மூல வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: வேறு தெய்வங்களுக்கான עבד வினை
  choice: வழிபட்டார்கள்
  alternative: பணிவிடை செய்தார்கள்
  rationale: சமயச் சூழலில் வினையின் வழிபாட்டு அர்த்தத்தைத் தெளிவுபடுத்துகிறது; வேறு தெய்வங்கள் குறித்த உரையின் வரலாற்று மற்றும் இறையியல் பதற்றத்தை மாற்றாமல் வைக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகருக்குப் புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. எபிரெயத்தின் தூதுரைச் சூத்திரமும் இறைபெயரும் பாதுகாக்கப்பட்டுள்ளன. அடிக்குறிப்பு குறிகள் அவை விளக்கும் சொற்றொடர்களுக்குப் பின்பே பொருத்தப்பட்டுள்ளன.
