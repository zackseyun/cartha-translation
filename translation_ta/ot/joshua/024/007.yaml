  to: அப்போது அவர்கள் யாவேயை நோக்கிக் கூக்குரலிட்டார்கள். அவர் உங்களுக்கும் எகிப்தியர்களுக்கும் இடையில் இருளை ஏற்படுத்தி, கடலை அவன்மீது வரச்செய்தார்; அது அவனை மூடியது.[a] எகிப்தில் நான் செய்ததை உங்கள் கண்களே கண்டன. பின்பு நீங்கள் பல நாட்கள் பாலைவனத்தில் வாழ்ந்தீர்கள்.
