base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/007.yaml
  text: Then they cried out to Yahweh[a], and he put darkness between you and the Egyptians, and brought the sea upon him and covered him, and your eyes saw what I did in Egypt. Then you lived in the wilderness many days.
translation:
  language: ta
  text: அப்போது அவர்கள் யாவேயை நோக்கிக் கூக்குரலிட்டார்கள். அவர் உங்களுக்கும் எகிப்தியர்களுக்கும் இடையில் இருளை ஏற்படுத்தி, கடலை அவன்மீது வரச்செய்தார்; அது அவனை மூடியது.[a] எகிப்தில் நான் செய்ததை உங்கள் கண்களே கண்டன. பின்பு நீங்கள் பல நாட்கள் பாலைவனத்தில் வாழ்ந்தீர்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரெய மூலத்தில் இவ்விரு சுட்டுப்பெயர்களும் ஆண்பால் ஒருமையில் உள்ளன: “அவன்மீது,” “அவனை.” இவை எகிப்தையோ எகிப்தியப் படையையோ கூட்டாகக் குறிக்கலாம்; பல மொழிபெயர்ப்புகள் இவற்றை “அவர்கள்மீது,” “அவர்களை” என்று வழங்குகின்றன.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּצְעֲקוּ אֶל־יְהוָה
  choice: அவர்கள் யாவேயை நோக்கிக் கூக்குரலிட்டார்கள்
  rationale: צעק என்பது துன்பத்தில் உதவிக்காக எழுப்பும் அவசரக் கூக்குரலைக் குறிக்கிறது; אֶל என்பது அந்தக் கூக்குரல் யாவேயை நோக்கியது என்பதைத் தெளிவாக்குகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: திருப்பெயரான יהוה-ஐ ஒரு பட்டப்பெயரால் மாற்றாமல், தமிழில் இயல்பான ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: מַאֲפֵל
  choice: இருள்
  rationale: இந்தப் பெயர்ச்சொல்லின் அடிப்படைப் பொருளைத் தெளிவான நவீனத் தமிழில் தருகிறது; தீவிரத்தைத் தேவையின்றி மிகைப்படுத்தவில்லை.
- source_word: בֵּינֵיכֶם וּבֵין הַמִּצְרִים
  choice: உங்களுக்கும் எகிப்தியர்களுக்கும் இடையில்
  rationale: இரண்டாம் நபர் பன்மையையும் எகிப்தியர்களுடனான பிரிவையும் நேரடியாகப் பாதுகாக்கிறது.
- source_word: וַיָּבֵא עָלָיו אֶת־הַיָּם
  choice: கடலை அவன்மீது வரச்செய்து
  rationale: עָלָיו-இல் உள்ள ஆண்பால் ஒருமைச் சுட்டை பன்மையாகச் சீராக்காமல் வெளிப்படையாகப் பாதுகாக்கிறது.
- source_word: וַיְכַסֵּהוּ
  choice: அவனை மூடினார்
  rationale: כסה என்பதன் ‘மூடு’ என்ற பொருளையும் ־הוּ என்ற ஆண்பால் ஒருமைச் சுட்டையும் தக்கவைக்கிறது.
- source_word: וַתִּרְאֶינָה עֵינֵיכֶם
  choice: உங்கள் கண்களே கண்டன
  rationale: ‘நீங்கள் கண்டீர்கள்’ என்று சுருக்காமல், எபிரெய உரையில் வலியுறுத்தப்படும் நேரடி கண்கூடான சாட்சியைப் பாதுகாக்கிறது.
- source_word: אֵת אֲשֶׁר עָשִׂיתִי בְּמִצְרָיִם
  choice: எகிப்தில் நான் செய்ததை
  rationale: בְּ என்ற முன்னிடைச்சொல்லை ‘எகிப்தில்’ என்று நேரடியாகத் தருகிறது; ‘எகிப்துக்கு எதிராக’ என்று பொருளைத் தீர்மானிக்கவில்லை.
- source_word: וַתֵּשְׁבוּ בַמִּדְבָּר
  choice: நீங்கள் பாலைவனத்தில் வாழ்ந்தீர்கள்
  rationale: ישב குறிக்கும் நீடித்த தங்கியிருத்தலை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: יָמִים רַבִּים
  choice: பல நாட்கள்
  rationale: ‘நீண்ட காலம்’ அல்லது ‘பல ஆண்டுகள்’ என்று விரித்துரைக்காமல் மூலத்தின் சொற்தொடரைப் பாதுகாக்கிறது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூல உரை ஒரு பொதுப் பட்டப்பெயரை அல்ல, இஸ்ரவேலுக்கு வெளிப்படுத்தப்பட்ட தனிப்பட்ட இறைப்பெயரையே பயன்படுத்துகிறது; ஆகவே பெயர் ஒலிபெயர்க்கப்பட்டது.
- issue: எகிப்தியப் படையைக் குறிக்கக்கூடிய ஒருமைச் சுட்டுப்பெயர்கள்
  choice: ‘அவன்மீது’, ‘அவனை’ என்று ஒருமையைத் தக்கவைத்தல்
  alternative: ‘அவர்கள்மீது’, ‘அவர்களை’ என்று கூட்டுப் பன்மையாக மொழிபெயர்த்தல்
  rationale: עָלָיו மற்றும் וַיְכַסֵּהוּ ஆகிய இரண்டிலும் எபிரெய உரை ஆண்பால் ஒருமைச் சுட்டையே கொண்டுள்ளது. அது எகிப்தையோ எகிப்தியப் படையையோ கூட்டாகக் குறிக்கலாம்; ஆனால் அந்தத் தெளிவின்மையை மூலவாக்கியத்திலேயே பாதுகாக்க வேண்டும்.
translation_notes:
  register: நவீன, கண்ணியமான பொதுத்தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘கூக்குரலிட்டார்கள்’ அவசரமான உதவிக்குரலை இயல்பாக வெளிப்படுத்துகிறது. மூலத்தில் திடீரென வரும் ‘நான் செய்ததை’ என்ற முதல் நபர் இறைவாக்கு விளக்கிச் சீராக்கப்படாமல் அப்படியே பாதுகாக்கப்பட்டுள்ளது.
