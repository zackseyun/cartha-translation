source:
  edition: WLC
  text: וַ/יָּ֨קָם בָּלָ֤ק בֶּן צִפּוֹר֙ מֶ֣לֶךְ מוֹאָ֔ב וַ/יִּלָּ֖חֶם בְּ/יִשְׂרָאֵ֑ל וַ/יִּשְׁלַ֗ח וַ/יִּקְרָ֛א לְ/בִלְעָ֥ם בֶּן בְּע֖וֹר לְ/קַלֵּ֥ל אֶתְ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/009.yaml
  text: Then Balak son of Zippor[a], king of Moab, arose and fought against Israel[b]. He sent and called Balaam son of Beor to curse you.
translation:
  language: ta
  text: பின்பு மோவாபின் அரசனான சிப்போரின் மகன் பாலாக் எழுந்து[a] இஸ்ரவேலுக்கு எதிராகப் போரிட்டான்[b]. அவன் ஆளனுப்பி, உங்களைச் சபிப்பதற்காக பெயோரின் மகன் பிலேயாமை அழைத்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘செயலில் இறங்கி’ என்றும் பொருள்படுத்தலாம். இங்குள்ள எபிரேய வினைச்சொல் உறுதியான நடவடிக்கையின் தொடக்கத்தைக் குறிக்கக்கூடும்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘இஸ்ரவேலின்மீது போர் தொடுத்தான்’ அல்லது ‘இஸ்ரவேலோடு போருக்குச் சென்றான்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: எழுந்து
  rationale: קום என்னும் வினை கதைநடையில் எழுதல் அல்லது உறுதியான நடவடிக்கையில் இறங்குதல் என்பதைக் குறிக்கலாம். ‘எழுந்து’ என்பது மூலத்தின் கதைநடை இயக்கத்தையும் அதன் பொருள் விரிவையும் காக்கிறது.
- source_word: וַיִּלָּחֶם בְּיִשְׂרָאֵל
  choice: இஸ்ரவேலுக்கு எதிராகப் போரிட்டான்
  rationale: לחם உடன் வரும் ב இங்கு பகைமை சார்ந்த மோதலைக் குறிக்கிறது. இந்தத் தமிழ் வடிவம் எதிர்மறை உறவைத் தெளிவாகக் காட்டுவதோடு, நேரடியான போரிடுதல் என்ற மூலப் பொருளையும் காக்கிறது.
- source_word: וַיִּשְׁלַח וַיִּקְרָא
  choice: அவன் ஆளனுப்பி ... அழைத்தான்
  rationale: மூலத்தில் தொடர்ச்சியாக வரும் ‘அனுப்பினான்’, ‘அழைத்தான்’ என்ற இரண்டு செயல்களையும் இயல்பான தமிழில் இவ்வடிவம் தக்கவைக்கிறது.
- source_word: לְבִלְעָם בֶּן בְּעוֹר
  choice: பெயோரின் மகன் பிலேயாம்
  rationale: தனிப்பெயர்கள் தமிழில் நிலைபெற்ற வேதாகமப் பெயரெழுத்து மரபுக்கு ஏற்றவாறு ஒலிபெயர்க்கப்பட்டுள்ளன.
- source_word: לְקַלֵּל אֶתְכֶם
  choice: உங்களைச் சபிப்பதற்காக
  rationale: קלל இச்சூழலில் ஒருவர்மீது சாபம் கூறுவதைக் குறிக்கிறது. இத்தேர்வு பகைமை நோக்கத்தை விரிவாக்கமின்றி நேரடியாகத் தெரிவிக்கிறது.
theological_decisions:
- issue: எண்ணாகமத்தில் பாலாக் பிலேயாம் மூலம் இஸ்ரவேலைச் சபிக்க முயன்றது வலியுறுத்தப்பட்டாலும், இங்கு அவன் ‘இஸ்ரவேலுக்கு எதிராகப் போரிட்டான்’ என்று கூறப்படுவது
  choice: யோசுவாவின் சுருக்க உரையில் உள்ளபடியே ‘இஸ்ரவேலுக்கு எதிராகப் போரிட்டான்’ என்று நேரடியாக மொழிபெயர்க்கப்பட்டது.
  alternative: ‘இஸ்ரவேலுக்கு விரோதமாகச் செயல்பட்டான்’ அல்லது ‘போரிடத் தயாரானான்’ என்று மென்மையாக்குதல்
  rationale: וַיִּלָּחֶם בְּיִשְׂרָאֵל என்பது நேரடியாகப் போரிடுதலைக் கூறுகிறது. வேறொரு பகுதியோடு ஒத்திசைப்பதற்காக இந்த வரலாற்றுச் சொல்லாக்கத்தை மாற்றாமல், உரையிலுள்ள இறையியல் மற்றும் வரலாற்றுப் பதற்றம் அப்படியே விடப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘ஆளனுப்பி ... அழைத்தான்’ என்பது எபிரேயத்தின் இரு தொடர்வினைகளையும் தமிழில் இயல்பாகப் பாதுகாக்கிறது.
