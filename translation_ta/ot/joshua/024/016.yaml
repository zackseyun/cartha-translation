base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/016.yaml
  text: Then the people answered and said[a], “Far be it from us to forsake Yahweh and serve other gods.”
translation:
  language: ta
  text: 'அதற்கு மக்கள் பதிலளித்துச் சொன்னார்கள்: “யாவேயைக் கைவிட்டு வேறு தெய்வங்களுக்குச் சேவை செய்வதை நாங்கள் ஒருபோதும் செய்ய மாட்டோம்!”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַן הָעָם וַיֹּאמֶר
  choice: மக்கள் மறுமொழியாக … என்றார்கள்
  rationale: எபிரெய மொழியின் ‘பதிலளித்துச் சொன்னார்கள்’ என்ற வழக்கமான உரையாடல் சூத்திரத்தை, இயல்பான நவீனத் தமிழில் சுருக்கமாகவும் அதன் பொருளை இழக்காமலும் தருகிறது.
- source_word: חָלִילָה לָּנוּ
  choice: எங்களுக்கு ஒருபோதும் நேராதிருக்கட்டும்
  rationale: கடவுளின் பெயரைச் சேர்க்காமல், மூலமொழியிலுள்ள வலுவான மறுப்பையும் தூர விலக்குதலையும் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: מֵעֲזֹב
  choice: கைவிட்டு
  rationale: உடன்படிக்கைச் சூழலில் உள்ள விசுவாசத்தையும் பற்றுறுதியையும் துறக்கும் கனமான பொருளை ‘கைவிடுதல்’ தெளிவாகக் காட்டுகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரான நான்கு எழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், ‘Yahweh’ என்பதற்கான நேரடியான தமிழ் ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: לַעֲבֹד
  choice: பணிசெய்வது
  rationale: தெய்வங்களுக்கான வழிபாடு, கீழ்ப்படிதல், பற்றுறுதி ஆகியவற்றை உள்ளடக்கக்கூடிய עבד என்ற சொல்லின் பரந்த பொருளைப் பாதுகாக்கிறது.
- source_word: אֱלֹהִים אֲחֵרִים
  choice: வேறு தெய்வங்கள்
  rationale: ‘அந்நிய’ என்ற கூடுதல் நுண்பொருளைச் சேர்க்காமல், எபிரெயச் சொற்றொடரின் நேரடிப் பொருளைத் தருகிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலவசனத்தில் தனிப்பட்ட தெய்வீகப் பெயரே உள்ளது; ஆகவே அதைப் பட்டமாக மாற்றாமல் ஒலிபெயர்ப்பது மூலத்துக்கு நெருக்கமானது.
- issue: חָלִילָה என்ற வலுவான மறுப்புச் சொற்றொடர்
  choice: எங்களுக்கு ஒருபோதும் நேராதிருக்கட்டும்
  alternative: கடவுள் தடுக்கட்டும்
  rationale: எபிரெய மொழித்தொடர் வலுவான மறுப்பைத் தெரிவிக்கிறது; ஆனால் கடவுளை வெளிப்படையாகக் குறிப்பிடவில்லை. தேர்ந்தெடுக்கப்பட்ட வாசகம் அந்தத் தீவிரத்தைப் பாதுகாத்து, மூலத்தில் இல்லாத குறிப்பைச் சேர்ப்பதைத் தவிர்க்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘யாவே’ என்ற பெயரும் ‘பணிசெய்வது’ என்ற சொல்லும் மூலத்தின் உடன்படிக்கை மற்றும் வழிபாட்டுச் சார்ந்த பொருள் அகலத்தைப் பாதுகாக்கின்றன.
