base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/019.yaml
  text: And Joshua said to the people[a], “You are not able to serve Yahweh, for he is a holy God; he is a jealous God[b]. He will not forgive your transgressions and your sins.”
translation:
  language: ta
  text: யோசுவா மக்களிடம், “உங்களால் யாவேக்குச் சேவை செய்ய முடியாது. ஏனெனில் அவர் பரிசுத்தமான கடவுள்[a]; அவர் தமக்கே உரிய பற்றுறுதியைக் கோரும் கடவுள். உங்கள் மீறுதல்களையும் பாவங்களையும் அவர் மன்னிக்கமாட்டார்[b]” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '‘கடவுள்’ மற்றும் ‘பரிசுத்தமான’ என்பவற்றுக்கான எபிரெயச் சொற்கள் இங்கு பன்மை வடிவில் உள்ளன; ஆனால் எபிரெயச் சுட்டுப்பெயர் ஒருமை வடிவில் உள்ளது. சொற்சொல்லான வடிவம்: ‘பரிசுத்தமான கடவுள்கள் அவர்.’ ஒருமைச் சுட்டுப்பெயர் இஸ்ரவேலின் ஒரே கடவுளையே குறிப்பதைத் தெளிவுபடுத்துகிறது.'
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘உங்கள் மீறுதல்களையும் பாவங்களையும் அவர் சுமக்கமாட்டார்/அகற்றமாட்டார்.’ இந்த எபிரெய வழக்குச் சொற்றொடர் பொதுவாக மன்னிப்பைக் குறிக்கிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: תֽוּכְלוּ
  choice: உங்களால் … முடியாது
  rationale: יכל என்பது ஆற்றல் அல்லது திறனைக் குறிக்கிறது. எதிர்மறை வடிவத்தின் வலிமையை இயல்பான தமிழில் நேரடியாகத் தருகிறது.
- source_word: לַעֲבֹד
  choice: சேவை செய்ய
  rationale: עבד என்பது வழிபாட்டையும் உட்படுத்தும் உடன்படிக்கை சார்ந்த முழுமையான சேவையைக் குறிக்க முடியும்; ‘வழிபட’ என்று மட்டும் மொழிபெயர்ப்பதைவிட இதன் பொருள் விரிவானது.
- source_word: יְהוָה
  choice: யாவே
  rationale: மூலத்தில் உள்ள இறைநாமத்தை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் ஒலிபெயர்த்துள்ளது.
- source_word: אֱלֹהִים קְדֹשִׁים הוּא
  choice: அவர் பரிசுத்தமான கடவுள்
  rationale: ‘கடவுள்’ மற்றும் ‘பரிசுத்தமான’ என்பவற்றுக்கான எபிரெயச் சொற்கள் பன்மை வடிவில் இருந்தாலும், உடன் வரும் சுட்டுப்பெயர் ஒருமையில் உள்ளது; ஆகவே ஒரே இஸ்ரவேலின் கடவுளைக் குறிக்கும் ஒருமைப் பொருள் இயல்பான தமிழில் தரப்பட்டுள்ளது.
- source_word: אֵל קַנּוֹא
  choice: தமக்கே உரிய பற்றுறுதியைக் கோருகிற கடவுள்
  rationale: קַנּוֹא என்பது உடன்படிக்கைச் சூழலில் போட்டியான பற்றுறுதியை ஏற்காத கடவுளின் தனியுரிமைக் கோரிக்கையைச் சுட்டுகிறது. ‘பொறாமையுள்ள’ என்பது நவீன தமிழில் தவறாக மனிதக் குற்றப்பண்பைக் குறிப்பதாகப் புரியக்கூடும்.
- source_word: לֹא יִשָּׂא
  choice: மன்னிக்கமாட்டார்
  rationale: பாவம் அல்லது மீறுதலுடன் வரும் נשא, அவற்றைத் தாங்குதல் அல்லது அகற்றுதல் என்ற உருவகத்தின் வழியாக மன்னிப்பைக் குறிக்கும் வழக்குச் சொற்றொடராகும்.
- source_word: פִשְׁעֲכֶם
  choice: உங்கள் மீறுதல்கள்
  rationale: פשע அதிகாரத்திற்கும் உடன்படிக்கைக்கும் எதிரான கலகம் அல்லது மீறுதலைக் குறிக்கிறது; ‘மீறுதல்கள்’ இதை ‘பாவங்கள்’ என்பதிலிருந்து வேறுபடுத்திக் காக்கிறது.
- source_word: חַטֹּאותֵיכֶם
  choice: உங்கள் பாவங்கள்
  rationale: חטאת என்பதற்கான நேரடியான, வழக்கமான தமிழ் இணைச்சொல் ‘பாவம்’ ஆகும்.
theological_decisions:
- issue: אֱלֹהִים קְדֹשִׁים என்ற பன்மை வடிவங்களுடன் ஒருமை הוּא வருவது
  choice: ‘அவர் பரிசுத்தமான கடவுள்’ என்று ஒருமையில் மொழிபெயர்த்தல்
  alternative: வடிவத்தைச் சொற்சொல்லாகப் பின்பற்றி பன்மையில் மொழிபெயர்த்தல்
  rationale: ஒருமைச் சுட்டுப்பெயரும் சூழலும் ஒரே கடவுளையே குறிக்கின்றன. பன்மை வடிவத் தகவல் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது; தமிழில் பன்மையாகத் தருவது பலதெய்வப் பொருளைத் தவறாக உருவாக்கும்.
- issue: கடவுள் பாவங்களை ‘சுமக்கமாட்டார்’ என்பதன் பொருள்
  choice: ‘மன்னிக்கமாட்டார்’ என்று வழக்குச் சொற்றொடரின் பொருளைத் தருதல்
  alternative: ‘உங்கள் மீறுதல்களையும் பாவங்களையும் அவர் சுமக்கமாட்டார்/அகற்றமாட்டார்’
  rationale: נשא என்ற வினை பாவச் சொற்களுடன் வரும்போது மன்னிப்பைக் குறிக்கும். எனினும் உருவகத்தின் சாத்தியமான நேரடிப் பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- issue: קַנּוֹא என்பதில் உள்ள இறை பொறாமை அல்லது தனியுரிமைக் கோரிக்கை
  choice: ‘தமக்கே உரிய பற்றுறுதியைக் கோருகிற கடவுள்’
  alternative: ‘பொறாமையுள்ள கடவுள்’
  rationale: உடன்படிக்கை சார்ந்த தனிப்பட்ட, பிரிக்க முடியாத பற்றுறுதியே இங்கு மையம். மனிதருக்குரிய குற்றப்பண்பாகத் தவறாகப் புரியாமல் அந்த இறையியல் பதற்றத்தை இயல்பான தமிழில் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘யாவே’ இறைநாமத்தின் ஒலிபெயர்ப்பாகவும், ‘சேவை செய்ய’ வழிபாட்டை உள்ளடக்கும் விரிவான உடன்படிக்கைச் சொல்லாகவும் அமைந்துள்ளன. அடிக்குறி [a] அதற்குரிய ‘பரிசுத்தமான கடவுள்’ என்பதற்குப் பின்னும், [b] ‘மன்னிக்கமாட்டார்’ என்பதற்குப் பின்னும் வைக்கப்பட்டுள்ளன.
