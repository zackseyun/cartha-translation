  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: כִּ֤י תַֽעַזְבוּ֙ אֶת יְהוָ֔ה וַ/עֲבַדְתֶּ֖ם אֱלֹהֵ֣י נֵכָ֑ר וְ/שָׁ֨ב וְ/הֵרַ֤ע לָ/כֶם֙ וְ/כִלָּ֣ה אֶתְ/כֶ֔ם אַחֲרֵ֖י אֲשֶׁר הֵיטִ֥יב לָ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/020.yaml
  text: If you forsake Yahweh and serve foreign gods[a], then he will turn and do you harm and consume you[b], after he has done good to you.
translation:
  language: ta
  text: நீங்கள் யாவேவை விட்டுவிட்டு வேற்று தெய்வங்களுக்குச் சேவை செய்தால், அவர் உங்களுக்கு நன்மை செய்தபின் திரும்பி, உங்களுக்குத் தீங்கு செய்து[a], உங்களை முற்றிலும் ஒழித்துவிடுவார்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உங்கள்மேல் பேரழிவைக் கொண்டுவந்து.” எபிரெய வினைச்சொல் ஒழுக்கத் தீமையை அல்ல, தீங்கு அல்லது பேரழிவை ஏற்படுத்துவதைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “உங்களை அழித்துவிடுவார்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: செய்தால்
  rationale: இங்கு כִּי ஒரு நிபந்தனை எச்சரிக்கையை அறிமுகப்படுத்துகிறது; தமிழில் நிபந்தனை வினைமுற்று இயல்பாக அந்த உறவை வெளிப்படுத்துகிறது.
- source_word: תַעַזְבוּ אֶת־יְהוָה
  choice: யாவேவை விட்டுவிட்டு
  rationale: עזב என்பது வெறுமனே இடத்தைவிட்டு நீங்குவதை அல்ல, உடன்படிக்கை உறவில் யாவேவைக் கைவிடுவதைக் குறிக்கிறது. ‘விட்டுவிட்டு’ என்பது நவீன தமிழில் இயல்பாகவும் வலிமையாகவும் உள்ளது; יְהוָה தனிப்பெயராக ‘யாவே’ என்று ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: וַעֲבַדְתֶּם
  choice: சேவை செய்தால்
  rationale: தெய்வங்களைச் சார்ந்து வரும் עבד சமய விசுவாசத்துடனான சேவையையும் வழிபாட்டையும் குறிக்கிறது. ‘சேவை செய்தால்’ மூல வினையின் அடிப்படை உருவகத்தைத் தக்கவைக்கிறது.
- source_word: אֱלֹהֵי נֵכָר
  choice: வேற்று தெய்வங்கள்
  rationale: இந்தச் சொற்றொடர் இஸ்ரவேலுக்கும் யாவே வழிபாட்டுக்கும் அந்நியமான தெய்வங்களைக் குறிக்கிறது; ‘வேற்று தெய்வங்கள்’ தெளிவான, இயல்பான தமிழ்.
- source_word: וְשָׁב
  choice: அவர் … திரும்பி
  rationale: שׁוב இங்கு யாவே தமது முந்தைய நன்மையான செயல்பாட்டிலிருந்து நீதித்தீர்ப்புக்கு மாறுவதைச் சுட்டுகிறது. ‘திரும்பி’ அந்த உருவகத்தையும் உரையின் சுருக்கத்தையும் காக்கிறது.
- source_word: וְהֵרַע לָכֶם
  choice: உங்களுக்குத் தீங்கு செய்து
  rationale: Hiphil வடிவிலுள்ள רעה இங்கு ஒழுக்கத் தீமை செய்வதை அல்ல, தீங்கு அல்லது பேரழிவை ஏற்படுத்துவதைச் சொல்கிறது. ‘தீங்கு செய்து’ தவறான ஒழுக்கப் பொருளைத் தவிர்க்கிறது.
- source_word: וְכִלָּה אֶתְכֶם
  choice: உங்களை முற்றிலும் ஒழித்துவிடுவார்
  rationale: כלה முடிவுக்குக் கொண்டுவருதல் அல்லது முற்றாக அழித்தல் என்ற கடுமையான பொருளைக் கொண்டுள்ளது. ‘முற்றிலும் ஒழித்துவிடுவார்’ அதன் நிறைவு மற்றும் அழிவு சார்ந்த வலிமையை வெளிப்படுத்துகிறது.
- source_word: אַחֲרֵי אֲשֶׁר הֵיטִיב לָכֶם
  choice: அவர் உங்களுக்கு நன்மை செய்தபின்
  rationale: היטיב என்பது நன்மை செய்தல் அல்லது பயனளித்தல். இந்த மொழிபெயர்ப்பு முன்பு கிடைத்த நன்மைக்கும் பின்னர் வரும் நீதித்தீர்ப்புக்கும் இடையிலான முரண்பாட்டைத் தெளிவாகக் காக்கிறது.
theological_decisions:
- issue: முன்பு நன்மை செய்த யாவே பின்னர் நேரடியாகத் தண்டனை கொண்டுவருவது
  choice: யாவே தமது செயல்பாட்டை மாற்றி, தீங்கையும் முழுமையான அழிவையும் நேரடியாகக் கொண்டுவருவார் என உரையின் எச்சரிக்கை கூறும் விதத்தில் மொழிபெயர்க்கப்பட்டது.
  alternative: விக்கிரக வழிபாட்டின் இயல்பான விளைவுகள் மட்டுமே மக்கள்மேல் வரும் என மென்மையாக்குதல்.
  rationale: எபிரெய வினைச்சொற்கள் நீதித்தீர்ப்பின் செயற்பாட்டை யாவேவுக்கே நேரடியாகக் கூறுகின்றன. எனவே தெய்வீகச் செயற்பாட்டையும், முன் செய்த நன்மைக்கும் பின் வரும் தீர்ப்புக்கும் இடையிலான இறையியல் பதற்றத்தையும் மொழிபெயர்ப்பு தக்கவைக்கிறது.
translation_notes:
  register: நவீன செந்தமிழுக்கு ஏற்ற, கண்ணியமான மற்றும் பொதுவாசகர்களுக்குப் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. எச்சரிக்கையின் தீவிரம் மென்மையாக்கப்படவில்லை; அதேவேளை தேவன் ‘தீமை செய்கிறார்’ என்ற தவறான ஒழுக்கப் பொருள் எழாதவாறு ‘தீங்கு’ எனத் தேர்ந்தெடுக்கப்பட்டுள்ளது.
