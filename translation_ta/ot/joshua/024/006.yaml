  to: பின்பு நான் உங்கள் தந்தையரை எகிப்திலிருந்து வெளியே கொண்டுவந்தேன்; நீங்கள் கடலுக்கு வந்தீர்கள். எகிப்தியர்கள் தேர்களோடும் குதிரைவீரர்களோடும் உங்கள் தந்தையரைச் செங்கடல்வரைப் பின்தொடர்ந்தார்கள்[a].
