base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/006.yaml
  text: Then I brought your fathers out from Egypt[a], and you came to the sea; and the Egyptians pursued your fathers with chariots and horsemen to the Red Sea.
translation:
  language: ta
  text: பின்பு நான் உங்கள் தந்தையரை எகிப்திலிருந்து வெளியே கொண்டுவந்தேன்; நீங்கள் கடலுக்கு வந்தீர்கள். எகிப்தியர்கள் தேர்களோடும் குதிரைவீரர்களோடும் உங்கள் தந்தையரைச் செங்கடல்வரைப் பின்தொடர்ந்தார்கள்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது, இன்னும் சொற்பொருளுக்கு நெருக்கமாக, “நாணற்கடல்.” எபிரெயம்: யாம் சூஃப்.'
    reason: யாம் சூஃப் என்பதன் சொற்பொருள் நெருங்கிய மாற்றைத் தருகிறது; முதன்மை உரையில் மரபுவழியாக அறியப்பட்ட ‘செங்கடல்’ தக்கவைக்கப்படுகிறது.
lexical_decisions:
- source_word: וָאוֹצִיא
  choice: பின்பு நான் ... வெளியே கொண்டுவந்தேன்
  rationale: יצא என்பதன் ஹிஃபில் வடிவம் ‘வெளியே கொண்டுவருதல்’ எனப் பொருள்படும். தொடர் நிகழ்வைக் குறிக்கும் waw-ஐ இயல்பான தமிழில் ‘பின்பு’ என வெளிப்படுத்துகிறது.
- source_word: אֲבוֹתֵיכֶם
  choice: உங்கள் தந்தையரை
  rationale: எபிரெயச் சொல்லின் நேரடிப் பொருள் ‘உங்கள் தந்தையர்.’ இது முற்பிதாக்களைக் குறிக்கும் ஆண்பால் குடும்பச் சொல்லாக இருப்பதால் பொதுவான ‘முன்னோர்கள்’ என்று மாற்றாமல் தக்கவைக்கப்பட்டது.
- source_word: מִמִּצְרַיִם
  choice: எகிப்திலிருந்து
  rationale: מן என்னும் மூலத்தைக் குறிக்கும் முன்னொட்டையும் இடப்பெயரையும் சுருக்கமாகவும் இயல்பாகவும் வழங்குகிறது.
- source_word: וַתָּבֹאוּ הַיָּמָּה
  choice: நீங்கள் கடலுக்கு வந்தீர்கள்
  rationale: בוא மற்றும் திசைச்சுட்டும் இறுதி இணைந்து கடலை நோக்கிய வருகையைக் குறிக்கின்றன. உடன்படிக்கை வரலாற்றில் கேட்போரை அவர்களுடைய தந்தையரோடு அடையாளப்படுத்தும் இரண்டாம் நபர் பன்மை தக்கவைக்கப்பட்டது.
- source_word: וַיִּרְדְּפוּ מִצְרַיִם
  choice: எகிப்தியர்கள் ... பின்தொடர்ந்து ... வந்தார்கள்
  rationale: மூலத்தில் ‘எகிப்து’ என்ற கூட்டுப்பெயர் இருந்தாலும் வினை பன்மையில் உள்ளது; இச்சூழலில் அது எகிப்தியப் படையினரைக் குறிக்கிறது. நவீன தமிழில் ‘எகிப்தியர்கள்’ என்பது தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: בְּרֶכֶב
  choice: தேர்களோடும்
  rationale: רכב இங்கு போர்த்தேர்களையோ தேர்ப்படையையோ குறிக்கிறது; ‘தேர்களோடும்’ என்பது தெளிவான இயல்பான தமிழ்.
- source_word: וּבְפָרָשִׁים
  choice: குதிரைவீரர்களோடும்
  rationale: פָּרָשִׁים என்பது குதிரையில் போரிடுவோரையோ குதிரைப்படையையோ குறிக்கிறது; ‘குதிரைவீரர்கள்’ நேரடியாகவும் புரிந்துகொள்ளத்தக்கதாகவும் உள்ளது.
- source_word: יַם סוּף
  choice: செங்கடல்
  rationale: பரவலாக அறியப்பட்ட பாரம்பரியப் பெயர் ‘செங்கடல்’ முதன்மை உரையில் பயன்படுத்தப்பட்டது; எபிரெயச் சொல்லின் சொற்பொருளுக்கு நெருங்கிய மாற்று அடிக்குறிப்பில் தரப்பட்டது.
theological_decisions:
- issue: யாத்திரைக் காலத் தலைமுறையைச் சுட்டினாலும் பிற்கால இஸ்ரவேலரிடம் ‘நீங்கள் வந்தீர்கள்’ என்று கூறும் பிரதிநிதித்துவ அழைப்பு
  choice: இரண்டாம் நபர் பன்மையைத் தக்கவைத்து ‘நீங்கள் கடலுக்கு வந்தீர்கள்’ என்று மொழிபெயர்த்தல்
  alternative: ‘அவர்கள் கடலுக்கு வந்தார்கள்’ என்று மூன்றாம் நபருக்கு மாற்றுதல்
  rationale: யோசுவாவின் உரை தற்போதைய கேட்போரை அவர்களுடைய தந்தையரின் உடன்படிக்கை வரலாற்றோடு திட்டமிட்டு இணைக்கிறது. இரண்டாம் நபரைத் தக்கவைப்பது அந்தச் சொல்லாட்சியின் வலிமையைப் பாதுகாக்கிறது.
- issue: יַם סוּף என்பதன் மொழிபெயர்ப்பு
  choice: முதன்மை உரையில் ‘செங்கடல்’
  alternative: ‘நாணற்கடல்’ அல்லது ‘கோரைப்புற்கள் நிறைந்த கடல்’
  rationale: ‘செங்கடல்’ தமிழ் வேதாகம மரபிலும் பொதுப் பயன்பாட்டிலும் எளிதில் அடையாளம் காணப்படும் பெயர். எபிரெயச் சொல்லின் நேரடிப் பொருளை மறைக்காமல் அடிக்குறிப்பில் தருவது வரலாற்று-சொற்பொருள் தெளிவை வழங்குகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான உரை. ‘தந்தையர்,’ ‘தேர்கள்,’ ‘குதிரைவீரர்கள்’ ஆகியவை மூலத்தின் உருவகத்தையும் வரலாற்றுச் சூழலையும் காக்கின்றன. அடிக்குறிப்பு குறியீடு அது விளக்கும் ‘செங்கடல்’ என்பதற்குப் பின்னர் வைக்கப்பட்டுள்ளது.
