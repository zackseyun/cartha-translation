  source_fidelity: மொத்தத்தில் மூலத்துக்கு நெருக்கமான மொழிபெயர்ப்பு. இரண்டாம் நபர் பன்மையான ‘நீங்கள்’ சரியாகத் தக்கவைக்கப்பட்டுள்ளது; ‘எகிப்தியர்கள்,’ ‘தேர்கள்,’ ‘குதிரைவீரர்கள்,’ ‘செங்கடல்’ ஆகியனவும் பொருத்தமானவை. ஆனால் ‘பின்தொடர்ந்து செங்கடல்வரை வந்தார்கள்’ என்பது முதன்மை வினையான ‘பின்தொடர்ந்தார்கள்’ என்பதைக் ‘வந்தார்கள்’ என மாற்றி, மூலத்தின் நேரடி செயலைச் சற்றே தளர்த்துகிறது.
  naturalness: நடை நவீனத் தரத் தமிழிலும் வேதாகம உரைக்கேற்ற கண்ணியமான நடையிலும் உள்ளது. ‘செங்கடல்வரைப் பின்தொடர்ந்தார்கள்’ என்பது பொருளை இன்னும் நேரடியாகவும் இயல்பாகவும் தரும். அடிக்குறிப்புக் குறியை அது விளக்கும் சொல்லுக்கு உடனடியாக வைப்பது சிறந்தது.
  terminology: ‘தந்தையர்’ என்பது אֲבוֹתֵיכֶם என்பதன் முறையான, நேரடியான இணை. ‘குதிரைவீரர்கள்’ பָרָשִׁים என்பதற்குப் பொருத்தமானது. ‘செங்கடல்’ என்ற மரபுவழிப் பெயரை வைத்துக்கொண்டு, ‘நாணற்கடல்’ என்ற சொற்பொருள் நெருங்கிய மாற்றை அடிக்குறிப்பில் தருவது சரியான நடை.
