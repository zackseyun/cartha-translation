base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/001.yaml
  text: Then Joshua gathered all the tribes of Israel to Shechem[a], and he called for the elders of Israel, its heads, its judges, and its officers[c][b], and they presented themselves before God.
translation:
  language: ta
  text: 'பின்பு யோசுவா இஸ்ரவேலின் எல்லாக் கோத்திரங்களையும் சீகேமுக்கு[a] ஒன்றுகூட்டினார். அவர் இஸ்ரவேலின் மூப்பர்களையும், அதன் தலைவர்களையும்[b], நீதிபதிகளையும், அதிகாரிகளையும் அழைத்தார். அவர்கள் கடவுளின் முன்னிலையில்[c] நின்றார்கள்.


    [a] அல்லது, “சீகேமில்.” எபிரெய வடிவம் திசையைக் குறிப்பதால், சொல்லர்த்தமாக “சீகேமை நோக்கி” என்று பொருள்.


    [b] “தலைவர்கள்” என்பதற்கான எபிரெயச் சொல் சொல்லர்த்தமாக “தலைகள்” என்று பொருள்படும்.


    [c] எபிரெய மூலத்தில் “கடவுளின் முன்னிலையில்” என்றே உள்ளது; இது ஒரு திருத்தலத்தில் அல்லது உடன்படிக்கையுடன் தொடர்புடைய புனித இடத்தில் ஆஜரானதைக் குறிக்கக்கூடும்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சீகேமில்.” எபிரெய வடிவம் திசையைக் குறிப்பதால், சொல்லர்த்தமாக “சீகேமை நோக்கி” என்று பொருள்.
    reason: lexical_alternative
  - marker: b
    text: “தலைவர்கள்” என்பதற்கான எபிரெயச் சொல் சொல்லர்த்தமாக “தலைகள்” என்று பொருள்படும்.
    reason: lexical_alternative
  - marker: c
    text: எபிரெய மூலத்தில் “கடவுளின் முன்னிலையில்” என்றே உள்ளது; இது ஒரு திருத்தலத்தில் அல்லது உடன்படிக்கையுடன் தொடர்புடைய புனித இடத்தில் ஆஜரானதைக் குறிக்கக்கூடும்.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֶּאֶסֹף
  choice: ஒன்றுகூட்டினார்
  rationale: இந்தக் கதைச் சூழலில் மக்களை ஓரிடத்தில் திரட்டுவதைக் குறிக்கிறது; நவீனத் தமிழில் இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: שִׁבְטֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் எல்லாக் கோத்திரங்களையும்
  rationale: இஸ்ரவேலின் சமூக-அரசியல் பிரிவுகளைக் குறிக்கும் வழக்கமான, துல்லியமான தமிழ் மொழிபெயர்ப்பு.
- source_word: שְׁכֶמָה
  choice: சீகேமுக்கு
  rationale: இடப்பெயருடன் இணைந்துள்ள directional he சீகேமை நோக்கிய நகர்வைக் காட்டுகிறது; கூட்டம் அங்கே நடந்தது என்பதால் “சீகேமில்” என்பதும் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: וַיִּקְרָא לְ
  choice: அழைத்தார்
  rationale: குறிப்பிட்ட தலைமைப் பொறுப்பாளர்களை வரவழைப்பதை இங்கு குறிக்கிறது; “அழைத்தார்” இயல்பான நவீனத் தமிழ்.
- source_word: זִקְנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் மூப்பர்கள்
  rationale: அங்கீகரிக்கப்பட்ட மூத்தோர் தலைமைக்குழுவைக் குறிக்கும் மரபானதும் துல்லியமானதுமான சொல்.
- source_word: רָאשָׁיו
  choice: அதன் தலைவர்கள்
  rationale: எபிரெயில் சொல்லர்த்தமாக “அதன் தலைகள்”; ஒருமைச் சுட்டுப்பெயர் இஸ்ரவேலை ஒரு கூட்டு அமைப்பாகக் குறிக்கிறது. தமிழில் “தலைவர்கள்” மூல உருவகத்தையும் பதவிப் பொருளையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: שֹׁפְטָיו
  choice: நீதிபதிகள்
  rationale: குடிமை மற்றும் நீதித்துறைப் பொறுப்பைக் குறிக்கும் நேரடியான பதவிப்பெயர்.
- source_word: שֹׁטְרָיו
  choice: அதிகாரிகள்
  rationale: நிர்வாகப் பொறுப்பாளர்கள் அல்லது அலுவலர்களைக் குறிக்கிறது; “அதிகாரிகள்” சூழலுக்கு ஏற்ற பொதுவான தமிழ்.
- source_word: וַיִּתְיַצְּבוּ
  choice: வந்து நின்றார்கள்
  rationale: முறையான கூடுகையில் தங்கள் இடத்தை ஏற்று ஆஜராவதை hitpael வடிவம் குறிக்கிறது; தமிழ் வாக்கியத்தில் நிகழ்வையும் சடங்குத்தன்மையையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: לִפְנֵי הָאֱלֹהִים
  choice: கடவுளின் முன்னிலையில்
  rationale: மூலத்தில் YHWH என்ற திருப்பெயர் அல்ல, הָאֱלֹהִים என்பதே உள்ளது. ஆகவே இடத்தை விளக்கிச் சேர்க்காமல் சொற்றொடர் நேரடியாக மொழிபெயர்க்கப்படுகிறது.
theological_decisions:
- issue: உடன்படிக்கைக் கூட்டத்தின் சூழலில் לִפְנֵי הָאֱלֹהִים என்பதன் பொருள்
  choice: கடவுளின் முன்னிலையில்
  alternative: ஆண்டவரின் முன்னிலையில்; கடவுளின் திருத்தலத்தின் முன்னிலையில்
  rationale: எபிரெய உரை YHWH என்று அல்லாமல் הָאֱלֹהִים என்று கூறுகிறது; எனவே “ஆண்டவர்” என்று மாற்றப்படவில்லை. இது ஒரு திருத்தலத்தில் ஆஜராவதைக் குறிக்கக்கூடும் என்ற இடவியல் விளக்கம் மூலவாக்கியத்துக்குள் சேர்க்கப்படாமல் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. “கோத்திரங்கள்,” “மூப்பர்கள்,” “நீதிபதிகள்” போன்ற நிலைபெற்ற வேதாகம மற்றும் சமூகச் சொற்கள் தக்கவைக்கப்பட்டுள்ளன; நிர்வாகப் பதவிக்கு இயல்பான “அதிகாரிகள்” தேர்ந்தெடுக்கப்பட்டுள்ளது.
