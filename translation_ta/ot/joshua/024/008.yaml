base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/008.yaml
  text: Then I brought you into the land of the Amorites[a], who lived beyond the Jordan, and they fought with you. And I gave them into your hand, and you took possession of their land, and I destroyed them from before you.
translation:
  language: ta
  text: பின்பு நான் உங்களை யோர்தானுக்கு அப்பால் குடியிருந்த எமோரியர்களின் நாட்டிற்குள் கொண்டுவந்தேன். அவர்கள் உங்களோடு போரிட்டார்கள்.[a] நான் அவர்களை உங்கள் கையில் தந்தேன்; நீங்கள் அவர்களுடைய நாட்டை உடைமையாக்கினீர்கள். நான் அவர்களை உங்கள் முன்னிருந்து அழித்தேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “உங்களுக்கு எதிராகப் போரிட்டார்கள்” என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொற்றொடர் சொல்லளவில் “உங்களோடு போரிட்டார்கள்” என்று உள்ளது; இச்சூழலில் அது பகைமையான போரைச் சுட்டுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֲבִיאָה אֶתְכֶם
  choice: பின்பு நான் உங்களைக் கொண்டுவந்தேன்
  rationale: בוא என்பதன் ஹிஃபில் வடிவம் ‘கொண்டுவருதல்’ என்ற காரணவினைப் பொருளைத் தருகிறது. தொடக்க வாவ் நிகழ்வுகளின் தொடர்ச்சியைச் சுட்டுவதால், இயல்பான தமிழ் நடையில் ‘பின்பு’ என வழங்கப்பட்டது.
- source_word: אֶל אֶרֶץ הָאֱמֹרִי
  choice: எமோரியர்களின் நாட்டிற்குள்
  rationale: אֶל இங்கு அந்த நாட்டுக்குள் நுழைவதைக் குறிக்கிறது. எபிரெயத்தில் ஒருமை வடிவிலுள்ள இனப்பெயர் கூட்டுப்பொருளில் வருவதால் தமிழில் இயல்பாகப் பன்மையில் வழங்கப்பட்டது.
- source_word: הַיּוֹשֵׁב בְּעֵבֶר הַיַּרְדֵּן
  choice: யோர்தானுக்கு அப்பால் குடியிருந்த
  rationale: ישב என்ற பங்கேற்பு வடிவம் எமோரியர்களை விவரிக்கிறது. בְּעֵבֶר என்பதற்கு கிழக்கு அல்லது மேற்கு என்று மொழிபெயர்ப்பாளர் தீர்மானிக்காமல், மூலத்தின் இடஞ்சார்ந்த பார்வையை ‘அப்பால்’ காக்கிறது.
- source_word: וַיִּלָּחֲמוּ אִתְּכֶם
  choice: அவர்கள் உங்களோடு போரிட்டார்கள்
  rationale: לחם உடன் வரும் אֵת/עִם பகைமையான மோதலைக் குறிக்கலாம்; ஆனால் சொல்லளவில் ‘உங்களோடு’ என்பதே நெருக்கமானது. தமிழிலும் இதனால் ஏற்படக்கூடிய தெளிவின்மையை அடிக்குறிப்பு விளக்குகிறது.
- source_word: וָאֶתֵּן אוֹתָם בְּיֶדְכֶם
  choice: நான் அவர்களை உங்கள் கையில் தந்தேன்
  rationale: נתן ביד என்பது ஒருவரை மற்றொருவரின் அதிகாரத்திற்குள் ஒப்படைக்கும் வழக்குச் சொற்றொடர். ‘உங்கள் கையில் தந்தேன்’ மூல உருவகத்தையும் அதன் பொருளையும் தமிழில் காக்கிறது.
- source_word: וַתִּירְשׁוּ אֶת אַרְצָם
  choice: நீங்கள் அவர்களுடைய நாட்டை உடைமையாக்கிக்கொண்டீர்கள்
  rationale: ירש என்பது சூழலின்படி உரிமைபெறுதல், கைப்பற்றுதல் அல்லது அகற்றிவிட்டு உடைமையாக்குதல் எனப் பொருள்படும். இங்கு வெற்றிக்குப் பின் நாட்டை உடைமையாக்கிய முடிவை இத்தேர்வு வெளிப்படுத்துகிறது.
- source_word: וָאַשְׁמִידֵם
  choice: நான் அவர்களை அழித்தேன்
  rationale: שׁמד வலுவான அழிவு அல்லது ஒழிப்பைக் குறிக்கிறது. ‘அழித்தேன்’ என்பது அதன் வலிமையை மென்மைப்படுத்தாமல், நவீனத் தமிழில் நேரடியாக வழங்குகிறது.
- source_word: מִפְּנֵיכֶם
  choice: உங்கள் முன்னிருந்து
  rationale: சொல்லளவில் ‘உங்கள் முகம்/முன்னிலையிலிருந்து’ என்று பொருள். ‘உங்கள் முன்னிருந்து’ என்பது அகற்றப்படுதல் என்ற கருத்தையும் எபிரெய உருவகத்தையும் சுருக்கமாகக் காக்கிறது.
theological_decisions:
- issue: நாட்டைக் கைப்பற்றிய போரையும் அழிவையும் குறிக்கும் மொழியின் வலிமை
  choice: ‘உங்கள் கையில் தந்தேன் ... உடைமையாக்கிக்கொண்டீர்கள் ... அழித்தேன்’ என்ற நேரடியான இறை உரையைத் தக்கவைத்தல்
  alternative: ‘தோற்கடித்தேன்’ அல்லது ‘அகற்றினேன்’ போன்ற மென்மையான சொற்களைப் பயன்படுத்துதல்
  rationale: வசனம் போர், நாட்டை உடைமையாக்குதல், அழித்தல் ஆகியவற்றை யாவே தமது செயல்களாக நேரடியாகக் கூறுவதாக அமைந்துள்ளது. மூலத்தின் வலிமையைப் பாதுகாக்க வேண்டும்; அதை மென்மைப்படுத்தவோ விளக்கமாக விரிவாக்கவோ கூடாது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையைக் கொண்டுள்ளது. ‘யோர்தான்,’ ‘எமோரியர்கள்’ ஆகியவை வழக்கமான வேதாகமப் பெயர்வடிவங்கள். தொடர் வாக்கியங்கள் தமிழின் வாசிப்போட்டத்திற்கேற்ப பிரிக்கப்பட்டுள்ளன; மூலத்தின் முதலாம் நபர் இறை உரையும் செயல்வரிசையும் காக்கப்பட்டுள்ளன.
