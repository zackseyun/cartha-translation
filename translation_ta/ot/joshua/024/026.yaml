base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/026.yaml
  text: And Joshua wrote these words in the Book of the Law of God[b][a], and he took a large stone and set it up there under the oak that was in the sanctuary of Yahweh.
translation:
  language: ta
  text: யோசுவா இந்த வார்த்தைகளை தேவனுடைய சட்ட நூலில் எழுதினார். பின்பு அவர் ஒரு பெரிய கல்லை எடுத்து, யாவேயின் பரிசுத்த இடத்தில்[b] இருந்த கருவாலி மரத்தின்[a] கீழ் அதை அங்கே நிறுத்தினார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “டெரிபிந்த் மரத்தின் கீழ்.” எபிரெயச் சொல் கருவாலி மரத்தையோ டெரிபிந்த் மரத்தையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “யாவேயின் பரிசுத்த இடத்தருகே.” எபிரெய முன்னிடைச்சொல்லை இச்சூழலில் சற்றுத் தளர்வான இடவியல் பொருளில் புரிந்துகொள்ளலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּכְתֹּב
  choice: எழுதினார்
  rationale: כתב என்பதன் நேரடியான பொருள் ‘எழுது’; நூலில் பதிவு செய்வதை இங்கு இயல்பாகக் குறிக்கிறது.
- source_word: הַדְּבָרִים הָאֵלֶּה
  choice: இந்த வார்த்தைகளை
  rationale: דברים என்பதற்கு ‘காரியங்கள்’ என்றும் பொருள் இருக்கலாம்; ஆனால் உடன்படிக்கை உரை நூலில் எழுதப்படுவதால் ‘வார்த்தைகள்’ என்ற உரைசார் பொருள் பொருத்தமானது.
- source_word: בְּסֵפֶר תּוֹרַת אֱלֹהִים
  choice: தேவனுடைய திருச்சட்ட நூலில்
  rationale: ספר என்பது நூல் அல்லது சுருள்; תורה என்பது போதனை அல்லது சட்டம். உடன்படிக்கைச் சூழலில் ‘திருச்சட்ட நூல்’ இயல்பாகவும் மரியாதைக்குரியதாகவும் உள்ளது.
- source_word: וַיִּקַּח אֶבֶן גְּדוֹלָה
  choice: ஒரு பெரிய கல்லை எடுத்து
  rationale: גדולה இங்கு கல்லின் உடல் அளவைக் குறிப்பதால் ‘பெரிய’ என்பது இயல்பான தேர்வு.
- source_word: וַיְקִימֶהָ
  choice: அதை அங்கே நிறுத்தினார்
  rationale: קום வினையின் காரணவினை வடிவம் கல்லை நிற்கச் செய்தல் அல்லது நினைவுக்கல்லாக நிறுவுதல் என்பதைக் குறிக்கிறது.
- source_word: תַּחַת הָאַלָּה
  choice: கருவாலி மரத்தின் கீழ்
  rationale: אַלָּה ஒரு பெரிய மரத்தைக் குறிக்கிறது; அது கருவாலியா டெரிபிந்தா என்பது உறுதியல்ல. வாசிக்க ஏற்ற பிரதான தேர்வுடன் மாற்றுப் பொருள் அடிக்குறிப்பில் வைக்கப்பட்டுள்ளது.
- source_word: בְּמִקְדַּשׁ יְהוָה
  choice: யாவேயின் பரிசுத்த இடத்தில்
  rationale: מקדש என்பது புனித இடம் அல்லது பரிசுத்த வளாகம்; ஆலயம் என்ற பிற்காலக் கட்டடப் பொருளைத் திணிக்காமல் ‘பரிசுத்த இடம்’ மூலத்தின் பரப்பை காக்கிறது. ב என்பதன் முதன்மைப் பொருளான ‘இல்’ பின்பற்றப்பட்டுள்ளது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய தனிப்பெயரான יהוה பட்டப்பெயரால் மாற்றப்படாமல் தமிழில் ஒலிபெயர்க்கப்படுகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலத்தில் தனிப்பட்ட உடன்படிக்கைப் பெயர் நேரடியாக இருப்பதால், அதன் பெயர்த்தன்மையைப் பாதுகாக்க ‘யாவே’ பயன்படுத்தப்பட்டுள்ளது.
- issue: மரத்துக்கும் பரிசுத்த இடத்துக்கும் உள்ள இடவியல் தொடர்பு
  choice: பரிசுத்த இடத்தில் இருந்த மரம்
  alternative: பரிசுத்த இடத்தருகே இருந்த மரம்
  rationale: ב என்ற முன்னிடைச்சொல்லின் வழக்கமான பொருள் ‘இல்’; ஆகவே பிரதான உரை அதை நேரடியாகப் பின்பற்றுகிறது. சூழலில் சற்றுத் தளர்வான ‘அருகே’ என்ற பொருளும் சாத்தியமாதலால் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
translation_notes:
  register: நவீனத் தரத் தமிழில், எளிதில் புரியும் அதேவேளையில் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘ஆலயம்’ என்பதற்குப் பதிலாக ‘பரிசுத்த இடம்’ பயன்படுத்தப்பட்டதால் பிற்காலக் கட்டடக் கருத்து தேவையின்றித் திணிக்கப்படவில்லை; மூலத்தின் மரவகை மற்றும் இடவியல் தெளிவின்மைகள் அடிக்குறிப்புகளில் பாதுகாக்கப்பட்டுள்ளன.
