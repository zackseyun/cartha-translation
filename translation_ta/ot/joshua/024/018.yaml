  text: וַ/יְגָ֨רֶשׁ יְהוָ֜ה אֶת כָּל הָ/עַמִּ֗ים וְ/אֶת הָ/אֱמֹרִ֛י יֹשֵׁ֥ב הָ/אָ֖רֶץ מִ/פָּנֵ֑י/נוּ גַּם אֲנַ֨חְנוּ֙ נַעֲבֹ֣ד אֶת יְהוָ֔ה כִּי ה֖וּא אֱלֹהֵֽי/נוּ־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/018.yaml
  text: And Yahweh drove out from before us all the peoples[a], including the Amorites who lived in the land. We also will serve Yahweh, for he is our God.
translation:
  language: ta
  text: யாவே எல்லா மக்களையும், நாட்டில் குடியிருந்த எமோரியர்களையும்[a] எங்கள் முன்னிலையிலிருந்து துரத்திவிட்டார். நாங்களும் யாவேவுக்குச் சேவை செய்வோம்; ஏனெனில் அவரே எங்கள் கடவுள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எல்லா மக்களையும்—நாட்டில் குடியிருந்த எமோரியர்கள் உட்பட—”.
    reason: எபிரெய இணைப்பை எமோரியர்கள் முன்சொன்ன மக்களில் அடங்கியவர்கள் எனவும் புரிந்துகொள்ளலாம்.
lexical_decisions:
- source_word: וַיְגָרֶשׁ
  choice: துரத்திவிட்டார்
  rationale: גרש என்பது ஒருவரை ஓட்டிவிடுதல் அல்லது வெளியேற்றுதல் என்ற வலுவான பொருளைக் கொண்டது; ‘துரத்திவிட்டார்’ என்பது நீக்கப்பட்ட செயலை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: நான்கெழுத்துத் தெய்வீகப் பெயரை ஒரு பட்டப்பெயராக மாற்றாமல், தமிழில் பரவலாக அறியப்பட்ட தனிப்பெயர் வடிவில் வழங்குகிறது.
- source_word: כָּל הָעַמִּים
  choice: எல்லா மக்களையும்
  rationale: עמים என்பதன் பன்மையையும் பல இன-மக்கள் குழுக்களைக் குறிக்கும் பரப்பையும் இயல்பான தமிழில் காக்கிறது.
- source_word: וְאֶת הָאֱמֹרִי
  choice: எமோரியர்களையும்
  rationale: எபிரெய இணைப்புச் சொல்லின் நேரடியான ‘மற்றும்/உம்’ உறவைப் பேணுகிறது; எமோரியர்கள் முன்சொன்ன மக்களுக்குள் அடங்கியவர்களா அல்லது கூடுதலாகக் குறிப்பிடப்பட்டவர்களா என்ற தெளிவின்மையைத் தீர்மானிக்கவில்லை.
- source_word: יֹשֵׁב הָאָרֶץ
  choice: நாட்டில் குடியிருந்த
  rationale: குறிப்பிட்ட நாட்டில் நிலையாக வாழ்ந்தவர்கள் என்ற பங்கேற்புவினைச் சொல்லின் குடியிருப்பு உணர்வைச் சுருக்கமாகக் காட்டுகிறது.
- source_word: מִפָּנֵינוּ
  choice: எங்கள் முன்னிலையிலிருந்து
  rationale: ‘எங்கள் முகத்திற்கு முன்பிருந்து’ என்ற எபிரெய உருவகத்தை புரியக்கூடிய நவீன தமிழில் நெருக்கமாகப் பேணுகிறது.
- source_word: גַּם אֲנַחְנוּ
  choice: நாங்களும்
  rationale: முந்தைய உறுதிமொழிக்குப் பதிலளிக்கும் ‘நாங்களும்/நாங்கள்கூட’ என்ற வலியுறுத்தலை இயல்பாகத் தருகிறது.
- source_word: נַעֲבֹד
  choice: சேவை செய்வோம்
  rationale: עבד இங்கு வழிபாடு, விசுவாசம், கீழ்ப்படிதல் ஆகியவற்றை உள்ளடக்கிய உடன்படிக்கைச் சேவையைக் குறிக்கிறது; ‘வழிபடுவோம்’ என்று மட்டும் குறுக்கவில்லை.
- source_word: כִּי הוּא אֱלֹהֵינוּ
  choice: ஏனெனில் அவரே எங்கள் கடவுள்
  rationale: כִּי தரும் காரண உறவை ‘ஏனெனில்’ தெளிவாக்குகிறது; הוּא என்பதிலுள்ள அடையாள வலியுறுத்தலை ‘அவரே’ வெளிப்படுத்துகிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரின் வடிவம்
  choice: யெகோவா
  alternative: யாவே
  rationale: மூலத்தில் பட்டப்பெயர் அல்ல, தனிப்பட்ட தெய்வீகப் பெயர் உள்ளது. ஆகவே ‘கர்த்தர்’ என மாற்றாமல் பெயராகவே வழங்கப்பட்டது; தமிழில் பரவலாக அறியப்பட்ட ‘யெகோவா’ வடிவம் தேர்ந்தெடுக்கப்பட்டது.
- issue: உடன்படிக்கைச் சூழலில் עבד என்பதன் பரப்பு
  choice: சேவை செய்வோம்
  alternative: வழிபடுவோம்
  rationale: இவ்வினை வழிபாட்டை உள்ளடக்கினாலும் அதைவிட விரிவாகக் கடவுளுக்கான விசுவாசமான கீழ்ப்படிதலையும் பணியையும் குறிக்கிறது; எனவே பரந்த பொருள் காக்கப்பட்டது.
- issue: எமோரியர்களுக்கும் ‘எல்லா மக்களுக்கும்’ இடையிலான உறவு
  choice: இணைப்பை நேரடியாக ‘எமோரியர்களையும்’ என வைத்தல்
  alternative: ‘எமோரியர்கள் உட்பட’ என்று துணைக்குழுவாகத் தெளிவாக்குதல்
  rationale: וְאֶת என்பது நேரடியாக ‘மற்றும்’ என்ற இணைப்பை அனுமதிக்கிறது. எமோரியர்கள் முன்சொன்ன மக்களுக்குள் அடங்குவதாக உரை வெளிப்படையாகத் தீர்மானிக்காததால் அந்தத் தெளிவின்மை பேணப்பட்டது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டது. மூலத்தின் இணைப்பு சார்ந்த தெளிவின்மை முதன்மை உரையில் பேணப்பட்டு மாற்று வாசிப்பு அடிக்குறிப்பில் தரப்பட்டது.
