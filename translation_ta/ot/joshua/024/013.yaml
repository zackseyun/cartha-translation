  to: அதில் நீங்கள் பாடுபடாத ஒரு நாட்டையும், நீங்கள் கட்டாத நகரங்களையும் நான் உங்களுக்குக் கொடுத்தேன்; அந்த நகரங்களில் நீங்கள் வாழ்கிறீர்கள். நீங்கள் நடாத திராட்சைத் தோட்டங்களிலிருந்தும் ஒலிவத் தோப்புகளிலிருந்தும் உண்டு வருகிறீர்கள்.[a]
