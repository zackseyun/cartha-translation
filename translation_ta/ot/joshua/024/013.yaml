base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/013.yaml
  text: And I gave you a land on which you had not labored[a], and cities that you had not built, and you live in them. You are eating from vineyards and olive groves that you did not plant.
translation:
  language: ta
  text: அதில் நீங்கள் பாடுபடாத ஒரு நாட்டையும், நீங்கள் கட்டாத நகரங்களையும் நான் உங்களுக்குக் கொடுத்தேன்; அந்த நகரங்களில் நீங்கள் வாழ்கிறீர்கள். நீங்கள் நடாத திராட்சைத் தோட்டங்களிலிருந்தும் ஒலிவத் தோப்புகளிலிருந்தும் உண்டு வருகிறீர்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'நேரடியாக: ‘ஒலிவப் பழங்கள்’ அல்லது ‘ஒலிவ மரங்கள்.’ திராட்சைத் தோட்டங்களுக்கு இணையாக நடப்பட்ட ஒலிவ மரங்களின் தொகுதியைக் குறிக்க இங்கு ‘ஒலிவத் தோப்புகள்’ என்று மொழிபெயர்க்கப்பட்டுள்ளது.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶתֵּן
  choice: நான் உங்களுக்குக் கொடுத்தேன்
  rationale: נתן என்பதன் Qal wayyiqtol முதலாம் நபர் ஒருமை வடிவம், கடவுள் கடந்தகாலத்தில் செய்த கொடையை வரிசையாக எடுத்துரைக்கிறது; தமிழில் இறந்தகாலம் இயல்பானது.
- source_word: אֶרֶץ
  choice: ஒரு நாடு
  rationale: இது வாக்குத்தத்த நாட்டைக் குறித்தாலும், எபிரெய வடிவத்தின் பொதுவான தன்மையைப் பாதுகாக்க ‘ஒரு நாடு’ என மொழிபெயர்க்கப்பட்டது.
- source_word: אֲשֶׁר לֹא יָגַעְתָּ בָּהּ
  choice: நீங்கள் பாடுபடாத
  rationale: יגע என்பது கடினமாக உழைத்தல் அல்லது பாடுபடுதல். இங்கு இஸ்ரவேல் மக்களை ஒருங்கிணைந்த மக்களாக நோக்கி உரையாடுவதால் இயல்பான தமிழ் பன்மை பயன்படுத்தப்பட்டது.
- source_word: וְעָרִים אֲשֶׁר לֹא בְנִיתֶם
  choice: நீங்கள் கட்டாத நகரங்கள்
  rationale: עיר என்பதற்கு ‘நகரம்’ என்பதும் בנה என்பதற்கு ‘கட்டு’ என்பதும் நேரான, இயல்பான பொருத்தங்கள்.
- source_word: וַתֵּשְׁבוּ בָּהֶם
  choice: அந்த நகரங்களில் நீங்கள் வாழ்கிறீர்கள்
  rationale: ישב என்பது இச்சூழலில் குடியிருத்தல் அல்லது வாழ்தல் என்று பொருள்படும். கடந்த கொடையின் தற்போதைய விளைவை தமிழ் நிகழ்காலம் தெளிவாக வெளிப்படுத்துகிறது; ‘அந்த நகரங்கள்’ என்பது சுட்டுப்பெயரின் குறிப்பைத் தெளிவாக்குகிறது.
- source_word: כְּרָמִים
  choice: திராட்சைத் தோட்டங்கள்
  rationale: כרמים என்பதற்கான வழக்கமான, தெளிவான தமிழ் இணைச்சொல்.
- source_word: וְזֵיתִים
  choice: ஒலிவத் தோப்புகள்
  rationale: சொல்லுக்கு ‘ஒலிவப் பழங்கள்’ அல்லது ‘ஒலிவ மரங்கள்’ என்ற நேரடி பொருள் இருக்கலாம்; நடப்பட்ட வேளாண் வளங்களாகத் திராட்சைத் தோட்டங்களுக்கு இணையாக வருவதால் ‘ஒலிவத் தோப்புகள்’ இயல்பாக உள்ளது. மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: אֲשֶׁר לֹא נְטַעְתֶּם
  choice: நீங்கள் நடாத
  rationale: נטע என்பதன் அடிப்படைப் பொருளான ‘நடு’ நேரடியாகப் பாதுகாக்கப்பட்டது.
- source_word: אַתֶּם אֹכְלִים
  choice: நீங்கள் உண்டு வருகிறீர்கள்
  rationale: வலியுறுத்தும் தனிப்பெயருடன் வரும் பங்கேற்புவினை தற்போதைய தொடர்நிலையை உணர்த்துகிறது; ‘உண்டு வருகிறீர்கள்’ அதனை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: இரண்டாம் நபர் ஒருமை மற்றும் பன்மை வடிவங்களின் மாற்றம்
  choice: இஸ்ரவேல் மக்களை ஒருங்கிணைந்த சமூகமாகக் குறிக்கும் வகையில் அனைத்தையும் மரியாதையற்ற தன்மை தவிர்ந்த இயல்பான தமிழ் பன்மையில் மொழிபெயர்த்தல்
  alternative: முதல் தொடர்புச் சொற்றொடரில் ‘நீ’ என்றும் பிற இடங்களில் ‘நீங்கள்’ என்றும் வடிவ வேறுபாட்டைக் காட்டுதல்
  rationale: எபிரெயத்தில் ‘பாடுபடாத’ என்பது இலக்கண ஒருமையிலும் பிற வினைகள் பன்மையிலும் உள்ளன. இங்கு உரை முழுவதும் உடன்படிக்கை மக்களாகிய இஸ்ரவேலை நோக்குகிறது; தமிழில் வடிவமாற்றத்தை அப்படியே காட்டுவது தனிநபருக்கு மாறியதுபோல் தவறாகப் புரியக்கூடும்.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான நடை. ‘வாழ்கிறீர்கள்’ மற்றும் ‘உண்டு வருகிறீர்கள்’ ஆகிய நிகழ்கால வடிவங்கள், கடவுள் கடந்தகாலத்தில் கொடுத்ததன் தற்போதைய பயனைப் பாதுகாக்கின்றன.
