source:
  edition: WLC
  text: וְ/לֹ֥א אָבִ֖יתִי לִ/שְׁמֹ֣עַ לְ/בִלְעָ֑ם וַ/יְבָ֤רֶךְ בָּרוֹךְ֙ אֶתְ/כֶ֔ם וָ/אַצִּ֥ל אֶתְ/כֶ֖ם מִ/יָּדֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/010.yaml
  text: But I was not willing to listen to Balaam[a], and he indeed blessed you; so I delivered you from his hand.
translation:
  language: ta
  text: ஆனால் பிலேயாமுக்குச் செவிகொடுக்க நான் விரும்பவில்லை. அவன் உங்களை நிச்சயமாகவே ஆசீர்வதித்தான்[a]; அவனுடைய கையிலிருந்து உங்களை விடுவித்தேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், ‘ஆசீர்வதித்தான்’ என்ற வினையுடன் அதே வேரிலான ஒரு வலியுறுத்தல் வடிவம் இணைந்துள்ளது; அது ஆசீர்வதித்த செயலை வலியுறுத்துகிறது. சொல் வடிவுக்கு நெருக்கமாக, ‘அவன் உங்களை ஆசீர்வதிக்கவே ஆசீர்வதித்தான்.’
    reason: எபிரெய cognate infinitive அமைப்பின் வலியுறுத்தலை விளக்கி, ‘நிச்சயமாகவே’ என்பதற்கான முறையான மாற்றை வழங்குகிறது.
lexical_decisions:
- source_word: אָבִיתִי
  choice: நான் விரும்பவில்லை
  rationale: אָבָה என்பது இயலாமையை அல்ல, விருப்பம் அல்லது சம்மதத்தைச் சுட்டுகிறது. ஆகவே இறைவனின் முதலாம் நபர் உரையில் உள்ள மனவுறுதியை இத்தேர்வு காக்கிறது.
- source_word: לִשְׁמֹעַ לְבִלְעָם
  choice: பிலேயாமுக்குச் செவிகொடுக்க
  rationale: שׁמע என்பதுடன் לְ வரும்போது ஒருவருக்குச் செவிகொடுத்தல் அல்லது அவருடைய வேண்டுகோளை ஏற்றல் என்ற பொருள் அமையலாம். தமிழில் இயல்பானதும் மூலத்தின் உருவகத்தைப் பேணுவதுமான சொற்றொடர் இது.
- source_word: וַיְבָרֶךְ בָּרוֹךְ
  choice: அவன் ... நிச்சயமாகவே ஆசீர்வதித்தான்
  rationale: வினைமுற்றுடன் அதே வேரிலான infinitive absolute இணைந்து செயலை வலியுறுத்துகிறது. ‘மீண்டும் மீண்டும்’ என்பது சூழலோடு பொருந்தினாலும், எபிரெயக் கட்டமைப்பு தனியாகத் தொடர்ச்சியான செயலைக் கட்டாயப்படுத்தாததால் ‘நிச்சயமாகவே’ என மொழிபெயர்க்கப்பட்டது.
- source_word: אֶתְכֶם
  choice: உங்களை
  rationale: இது இரண்டாம் நபர் ஆண்பால் பன்மை செயப்படுபொருள்; நவீன தமிழில் இயல்பாக ‘உங்களை’ என வருகிறது.
- source_word: וָאַצִּל
  choice: விடுவித்தேன்
  rationale: נצל என்பது ஒருவரின் பிடியிலிருந்து மீட்டல் அல்லது விடுவித்தல் என்று பொருள்படும். இங்கு ‘விடுவித்தேன்’ வரலாற்று மீட்புச் செயலைத் தெளிவாகக் காட்டுகிறது; தேவையற்ற விரிவான இறையியல் பொருளையும் சேர்ப்பதில்லை.
- source_word: מִיָּדוֹ
  choice: அவன் கையிலிருந்து
  rationale: அதிகாரம் அல்லது கட்டுப்பாட்டைக் குறிக்கும் எபிரெய உருவகம் தமிழிலும் புரிந்துகொள்ளத்தக்கது என்பதால் நேரடியாகப் பேணப்பட்டுள்ளது.
theological_decisions:
- issue: ஆசீர்வதித்த செயலின் எழுவாய்
  choice: ‘அவன்’ என்பது பிலேயாமைக் குறிக்கிறது.
  alternative: மறைமுக எழுவாய் கடவுள் என்றும், ‘நான் உங்களை ஆசீர்வதித்தேன்’ என்றும் வாசித்தல்.
  rationale: பிலேயாமைப் பற்றிய குறிப்புக்குப் பின் வரும் எபிரெய வினை மூன்றாம் நபர் ஆண்பால் ஒருமையில் உள்ளது; எனவே பிலேயாமே இயல்பான இலக்கண எழுவாய். விரிந்த சூழலில் கடவுள் அவனுடைய நோக்கத்தை முறியடித்தார் என்பது தெளிவானாலும், வசனத்தின் இலக்கண முகமையை மாற்றாமல் வைத்திருக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையுடன் மொழிபெயர்க்கப்பட்டது. ‘செவிகொடுக்க’, ‘அவன் கையிலிருந்து’ ஆகியவை மூலத்தின் உருவகங்களை இயல்பாகப் பேணுகின்றன. வலியுறுத்தலைத் தொடர்ச்சியான ஆசீர்வாதமாக அதிகமாக விளக்காமல் ‘நிச்சயமாகவே’ எனக் கொடுக்கப்பட்டுள்ளது.
