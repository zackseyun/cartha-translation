source:
  edition: WLC
  text: וַ/יַּעֲבֹ֤ד יִשְׂרָאֵל֙ אֶת יְהוָ֔ה כֹּ֖ל יְמֵ֣י יְהוֹשֻׁ֑עַ וְ/כֹ֣ל יְמֵ֣י הַ/זְּקֵנִ֗ים אֲשֶׁ֨ר הֶאֱרִ֤יכוּ יָמִים֙ אַחֲרֵ֣י יְהוֹשֻׁ֔עַ וַ/אֲשֶׁ֣ר יָדְע֗וּ אֵ֚ת כָּל מַעֲשֵׂ֣ה יְהוָ֔ה אֲשֶׁ֥ר עָשָׂ֖ה לְ/יִשְׂרָאֵֽל־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/031.yaml
  text: Israel served Yahweh all the days of Joshua[a], and all the days of the elders who outlived Joshua and who had known all the work of Yahweh that he had done for Israel.
translation:
  language: ta
  text: யோசுவாவின் வாழ்நாள் முழுவதும், யோசுவாவுக்குப் பிறகும் வாழ்ந்து, யாவே இஸ்ரவேலுக்காகச் செய்த எல்லாச் செயல்களையும் அறிந்திருந்த மூப்பர்களின் வாழ்நாள் முழுவதும், இஸ்ரவேல் யாவேக்குப் பணிசெய்தது.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲבֹד
  choice: பணிசெய்தது
  rationale: עבד என்பது யாவேக்கு உடன்படிக்கை சார்ந்த பற்றுறுதியுடன் சேவை செய்வதைக் குறிக்கிறது; வழிபாட்டையும் உள்ளடக்கலாம், ஆனால் அதைவிட விரிவான பொருள் கொண்டதால் ‘பணிசெய்தது’ என மொழிபெயர்க்கப்பட்டது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தலைப்புப் பெயரால் மாற்றாமல், எபிரெயத் திருமறையில் உள்ள இறைநாமம் தமிழில் ஒலிபெயர்க்கப்பட்டது.
- source_word: כֹּל יְמֵי
  choice: வாழ்ந்த நாட்களிலெல்லாம்
  rationale: குறிப்பிடப்பட்ட நபர் அல்லது குழுவின் வாழ்நாள் முழுவதையும் குறிக்கும் எபிரெயக் காலவழக்கை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: הַזְּקֵנִים
  choice: மூப்பர்கள்
  rationale: இஸ்ரவேல் சமூகத்தில் வயதிலும் அங்கீகரிக்கப்பட்ட பொறுப்பிலும் மூத்தவர்களைக் குறிக்கும் இயல்பான சொல்.
- source_word: הֶאֱרִיכוּ יָמִים אַחֲרֵי יְהוֹשֻׁעַ
  choice: யோசுவாவுக்குப் பிறகும் வாழ்ந்து
  rationale: ‘யோசுவாவுக்குப் பின் நாட்களை நீட்டித்தனர்’ என்ற எபிரெய மரபுத்தொடரின் பொருள், அவர்கள் யோசுவாவின் மரணத்திற்குப் பின்னரும் உயிர்வாழ்ந்தனர் என்பதாகும்.
- source_word: יָדְעוּ
  choice: அறிந்திருந்த
  rationale: யாவேயின் செயல்களை நேரடியாக அறிந்திருந்த கடந்தகால அனுபவத்தை இந்த வடிவம் இயல்பாகக் காட்டுகிறது; ‘அனுபவித்த’ என்று மட்டும் கூறி பொருளைச் சுருக்கவில்லை.
- source_word: כָּל מַעֲשֵׂה יְהוָה
  choice: யாவே ... செய்த அனைத்துச் செயல்களையும்
  rationale: מַעֲשֶׂה என்பது செயல், செய்கை, செயல்பாடு ஆகிய பொருள்களைக் கொள்ளலாம். இங்கு மீட்பு மற்றும் பாதுகாப்பைச் சார்ந்த யாவேயின் செயல்களை இயல்பாகக் குறிக்க ‘அனைத்துச் செயல்களையும்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: עָשָׂה לְיִשְׂרָאֵל
  choice: இஸ்ரவேலுக்காகச் செய்த
  rationale: לְ என்னும் முன்னொட்டு இச்சூழலில் இஸ்ரவேலின் நன்மைக்காகச் செய்யப்பட்டதைக் குறிக்கிறது.
theological_decisions:
- issue: יהוה என்னும் இறைநாமத்தை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலவசனம் தனிப்பட்ட இறைநாமத்தையே பயன்படுத்துவதால், அதை ஒரு பட்டப்பெயரால் மாற்றாமல் தமிழில் ஒலிபெயர்ப்பது மூலத்தின் வேறுபாட்டைப் பாதுகாக்கிறது.
- issue: עבד என்பதன் உடன்படிக்கைச் சார்ந்த பொருள்
  choice: யாவேக்குப் பணிசெய்தது
  alternative: யாவேவை வழிபட்டது
  rationale: இச்சொல் வழிபாட்டை உள்ளடக்கினாலும், யாவேக்கு விசுவாசமாக இருந்து அவருக்குச் சேவை செய்வது என்ற விரிவான பொருளைக் கொண்டுள்ளது; ‘வழிபட்டது’ என்று மட்டும் கூறுவது அந்தப் பொருளைச் சுருக்கும்.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகருக்குப் புரியும் மரியாதைமிக்க நடையைக் கொண்டுள்ளது. எபிரெய வாக்கியத்தின் இரு காலப்பகுதிகளும் ஒரே பிரதான வினையோடு தொடர்புடைய அமைப்பு பாதுகாக்கப்பட்டுள்ளது; நீண்ட அடைமொழித் தொடரை தெளிவாக்க இடைநிறுத்தக் குறிகள் பயன்படுத்தப்பட்டுள்ளன.
