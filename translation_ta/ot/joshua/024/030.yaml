  naturalness: திருத்தப்பட்ட வாக்கியம் நவீன நிலையான தமிழில் இயல்பாக உள்ளது. இடப்பெயரைக் குறிக்கும் தொடர்புத் தொடரும், அடக்க இடத்தின் புவியியல் விளக்கமும் தெளிவாக அமைந்துள்ளன.
