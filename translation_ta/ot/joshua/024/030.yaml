translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளும் வகையில் இயல்பும் கண்ணியமும் கொண்ட நடை பயன்படுத்தப்பட்டுள்ளது. புவியியல் பெயர்கள் எபிரெய வடிவங்களுக்குச் சார்ந்தவாறு எழுத்துப்பெயர்க்கப்பட்டுள்ளன; גְּבוּל என்பதிலுள்ள உண்மையான பொருள் இருமை அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
