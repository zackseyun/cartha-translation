base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/030.yaml
  text: And they buried him within the territory of his inheritance[a], at Timnath-serah, which is in the hill country of Ephraim, north of Mount Gaash.
translation:
  language: ta
  text: அவர்கள் அவரை அவருடைய உரிமைப் பங்கின் பகுதியில்[a], எப்பிராயீமின் மலைநாட்டில் காஷ் மலைக்கு வடக்கே இருக்கும் திம்நாத்-சேராகில் அடக்கம் செய்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவருடைய உரிமைப் பங்கின் எல்லையில்.” எபிரெயச் சொல் ஓர் எல்லையையோ, அந்த எல்லைக்குட்பட்ட பகுதியையோ குறிக்கலாம்; இங்கு யோசுவாவுக்கு ஒதுக்கப்பட்ட உரிமைப் பகுதியையே குறிப்பதாகத் தெரிகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְבְּרוּ אֹתוֹ
  choice: அவர்கள் அவரை ... அடக்கம் செய்தார்கள்
  rationale: தொடர்கதை வினைச்சொல்லையும் ஆண்பால் ஒருமை நேரடிச் செயப்படுபொருளையும் இயல்பான நவீனத் தமிழில் தருகிறது; முந்தைய சூழலில் இது யோசுவாவைக் குறிக்கிறது.
- source_word: בִּגְבוּל נַחֲלָתוֹ
  choice: அவருடைய உரிமைப் பங்கின் எல்லைக்குள்
  rationale: גְּבוּל என்பது ‘எல்லை’ அல்லது அந்த எல்லைக்குட்பட்ட ‘பகுதி’ என இருவகையில் பொருள்படலாம். ‘எல்லைக்குள்’ என்பது அடக்கம் செய்யப்பட்ட இடம் அவரது பங்குக்குள் இருந்ததை இயல்பாகத் தெரிவிப்பதோடு மூலத்தின் சொற்பொருள் நிழலையும் காக்கிறது.
- source_word: בְּתִמְנַת סֶרַח
  choice: திம்னாத்-சேராகில்
  rationale: இடப்பெயரை எபிரெய ஒலிப்புக்கு நெருக்கமாக எழுத்துப்பெயர்த்து, இருப்பிட வேற்றுமையைத் தமிழின் ‘-இல்’ விகுதியால் குறிக்கிறது.
- source_word: בְּהַר אֶפְרָיִם
  choice: எப்பிராயீமின் மலைநாட்டில்
  rationale: இந்த புவியியல் தொடரில் הַר என்பது தனி மலையைக் காட்டிலும் மலைப்பாங்கான பிரதேசத்தைக் குறிக்கிறது.
- source_word: מִצְּפוֹן לְהַר גָּעַשׁ
  choice: காயாஸ் மலைக்கு வடக்கே
  rationale: ஒப்பீட்டு இருப்பிடத்தைத் துல்லியமாகவும் இயல்பாகவும் தருகிறது; גָּעַשׁ என்ற இடப்பெயர் ‘காயாஸ்’ என எழுத்துப்பெயர்க்கப்படுகிறது.
