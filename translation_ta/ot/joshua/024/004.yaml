source:
  edition: WLC
  text: וָ/אֶתֵּ֣ן לְ/יִצְחָ֔ק אֶֽת יַעֲקֹ֖ב וְ/אֶת עֵשָׂ֑ו וָ/אֶתֵּ֨ן לְ/עֵשָׂ֜ו אֶת הַ֤ר שֵׂעִיר֙ לָ/רֶ֣שֶׁת אוֹת֔/וֹ וְ/יַעֲקֹ֥ב וּ/בָנָ֖י/ו יָרְד֥וּ מִצְרָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/004.yaml
  text: And I gave Isaac Jacob and Esau[a], and I gave Esau the hill country of Seir to possess[b]; but Jacob and his sons went down to Egypt.
translation:
  language: ta
  text: நான் ஈசாக்குக்கு யாக்கோபையும் ஏசாவையும் கொடுத்தேன். ஏசாவுக்குச் சேயீர் மலைநாட்டை உரிமையாகக் கொள்ளும்படி கொடுத்தேன்; ஆனால் யாக்கோபும் அவன் மகன்களும் எகிப்துக்குச் சென்றார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ஆனால்’ என்பதற்குப் பதிலாக, எபிரேய இணைப்புச்சொல்லை நேரடியாகப் பின்பற்றி, ‘யாக்கோபும் அவன் மகன்களும் எகிப்துக்குச் சென்றார்கள்’ என்றும் மொழிபெயர்க்கலாம். ‘சென்றார்கள்’ என்பதன் நேர்ப்பொருள் ‘கீழே சென்றார்கள்’. ‘சேயீர் மலைநாடு’ என்பதை ‘சேயீர் மலை’ அல்லது ‘சேயீரின் மலைகள்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: மூல எபிரேயத்தில் உள்ள இணைப்புச்சொல், இயக்க வினை, புவியியல் சொல்லின் உண்மையான மாற்று மொழிபெயர்ப்புகளைப் பாதுகாக்கிறது.
lexical_decisions:
- source_word: וָאֶתֵּן
  choice: கொடுத்தேன்
  rationale: נתן என்பது இங்கு சந்ததியையும் நிலப்பகுதியையும் கொடுப்பதைக் குறிக்கிறது. இருமுறையும் வரும் இறைச் செயலை ஒரே சொல்லால் இயல்பாகப் பாதுகாக்கிறது.
- source_word: לְיִצְחָק
  choice: ஈசாக்குக்கு
  rationale: எபிரேய ஆள்பெயரைத் தமிழில் வழக்கமான வடிவில் எழுத்துப்பெயர்த்து, לְ குறிக்கும் பெறுநரை நான்காம் வேற்றுமையால் காட்டுகிறது.
- source_word: אֶת יַעֲקֹב וְאֶת עֵשָׂו
  choice: யாக்கோபையும் ஏசாவையும்
  rationale: אֶת என்னும் நேரடிச் செயப்படுபொருள் குறியீடு தனியே மொழிபெயர்க்கப்படவில்லை; இணைக்கப்பட்ட இரு மகன்களையும் தமிழ் ஐ வேற்றுமையால் தெளிவாகக் காட்டுகிறது.
- source_word: הַר שֵׂעִיר
  choice: சேயீர் மலைநாடு
  rationale: הַר என்பது தனி மலையையோ மலைப்பகுதியையோ குறிக்கலாம். இங்கு ஏசாவுக்குக் கொடுக்கப்பட்ட நிலப்பகுதி என்பதால் ‘மலைநாடு’ சூழலுக்கு ஏற்றது; மாற்று சாத்தியம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: לָרֶשֶׁת אֹתוֹ
  choice: உரிமையாக்கிக்கொள்ள
  rationale: ירש என்பது நிலத்தைச் சுதந்தரித்தல், உடைமையாக்குதல் அல்லது கைப்பற்றிக் குடியிருத்தல் ஆகிய பொருள் நிழல்களைக் கொண்டது. ‘உரிமையாக்கிக்கொள்ள’ என்பது வழங்கப்பட்ட நிலத்தைத் தன் உடைமையாகப் பெறும் கருத்தைச் சுருக்கமாகத் தருகிறது.
- source_word: וְיַעֲקֹב וּבָנָיו
  choice: ஆனால் யாக்கோபும் அவன் மகன்களும்
  rationale: וְ என்பதன் அடிப்படைப் பொருள் ‘மற்றும்/அடுத்து’ என்றாலும், ஏசாவுக்குக் கிடைத்த நிலத்தையும் யாக்கோபின் குடும்பம் எகிப்துக்குச் சென்றதையும் இங்கு எதிரெதிராக வைப்பதால் ‘ஆனால்’ இயல்பான உரையோட்டத்தைத் தருகிறது; சொல்லியல் மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: יָרְדוּ מִצְרָיִם
  choice: எகிப்துக்குச் சென்றார்கள்
  rationale: ירד என்பதன் நேர்ப்பொருள் ‘கீழே சென்றார்கள்’. நவீனத் தமிழில் இலக்கை நோக்கிய பயணத்தை இயல்பாகச் சொல்ல ‘சென்றார்கள்’ பயன்படுத்தப்பட்டுள்ளது; திசைச்சார்ந்த நேரடி வடிவம் அடிக்குறிப்பில் குறிப்பிடப்படுகிறது.
theological_decisions:
- issue: இறுதி וְ இணைப்பின் உரைநடை உறவு
  choice: முதன்மை உரையில் ‘ஆனால்’
  alternative: ‘மேலும்/அடுத்து’ அல்லது ‘யாக்கோபும் அவன் மகன்களும்’ என்று எதிர்மறை இணைப்பின்றி மொழிபெயர்த்தல்
  rationale: எபிரேய இணைப்புச்சொல் தனியாக வலுவான எதிர்மறைப் பொருளை நிர்ணயிக்காது. எனினும் ஏசா சேயீரைப் பெற்றதற்கும் யாக்கோபின் குடும்பம் எகிப்துக்குச் சென்றதற்கும் இடையிலான உரைநடை வேறுபாட்டை ‘ஆனால்’ தெளிவாக்குகிறது; மூலத்தின் தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான உரைநடை. ஆள்பெயர்கள் தமிழ் வேதாகமப் பயன்பாட்டில் பரவலாக அறியப்பட்ட வடிவங்களில் தரப்பட்டுள்ளன. நீண்ட ஒரே வாக்கியத்தை இரண்டு வாக்கியங்களாகப் பிரித்து வாசிப்புத் தெளிவு மேம்படுத்தப்பட்டுள்ளது; இறுதி இணைப்பின் எதிர்மறை நுணுக்கமும் மூலத்தின் மாற்று சாத்தியங்களும் அடிக்குறிப்பில் வைக்கப்பட்டுள்ளன.
