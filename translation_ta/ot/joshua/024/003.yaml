base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/003.yaml
  text: Then I took your father Abraham from beyond the River[a], and I led him through all the land of Canaan[b], and I multiplied his offspring and gave him Isaac.
translation:
  language: ta
  text: பின்னர், உங்கள் தந்தையான ஆபிரகாமை ஆற்றுக்கு அப்பாலிருந்து[a] எடுத்துக்கொண்டு, கானான் நாடு முழுவதும் அவனை வழிநடத்தினேன். அவனுடைய சந்ததியைப்[b] பெருகச் செய்து, அவனுக்கு ஈசாக்கைக் கொடுத்தேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ஆறு’ என்பது யூபிராத்து ஆற்றைக் குறிக்க வாய்ப்புள்ளது.
    reason: cultural_note
  - marker: b
    text: அல்லது, ‘வழித்தோன்றல்களை’; எபிரெயச் சொல் ‘விதை/சந்ததி’ என்று கூட்டொருமையில் உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶקַּח
  choice: பின்னர் நான் ... அழைத்து
  rationale: לקח என்பதன் Qal தொடர்வினை வடிவம் தேவனின் கடந்தகாலச் செயலை வரிசையாக எடுத்துரைக்கிறது. தமிழில் ‘பின்னர்’ நிகழ்வின் தொடர்ச்சியையும், ‘அழைத்து’ ஆபிரகாமை ஓரிடத்திலிருந்து தேவன் கொண்டுசென்றதையும் இயல்பாக வெளிப்படுத்துகிறது; ‘அழைத்தார்’ என்ற அழைப்பு/தேர்ந்தெடுப்பு என்ற கூடுதல் கருத்தைத் திணிக்காமல், இயக்கச் சூழலில் வினையை வழங்குகிறது.
- source_word: אֲבִיכֶם אֶת־אַבְרָהָם
  choice: உங்கள் தந்தையான ஆபிரகாமை
  rationale: אֲבִיכֶם என்பது சொற்படியாக ‘உங்கள் தந்தை.’ ஆபிரகாம் தொலைமுன்னோர் என்றாலும், இஸ்ரவேலருக்குரிய குடும்ப-உடன்படிக்கை மொழிநடையை ‘தந்தை’ பாதுகாக்கிறது.
- source_word: מֵעֵבֶר הַנָּהָר
  choice: ஆற்றுக்கு அப்பாலிருந்து
  rationale: מִן + עֵבֶר என்பது இக்குறிப்பிடும் நிலைப்பாட்டிலிருந்து ஆற்றின் மறுபக்கத்தைக் குறிக்கிறது. எபிரெயத்தில் ஆற்றின் பெயர் தரப்படாததால், முதன்மை உரையிலும் பொதுப்பெயரே வைக்கப்படுகிறது.
- source_word: וָאוֹלֵךְ אוֹתוֹ
  choice: அவனை வழிநடத்தினேன்
  rationale: הלך என்பதன் Hiphil வடிவம் காரணவினைப் பொருளைக் கொண்டுள்ளது. ‘வழிநடத்தினேன்’ என்பது தேவன் அவனைச் செல்லச் செய்தார் என்ற பொருளை இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: בְּכָל אֶרֶץ כְּנָעַן
  choice: கானான் நாடு முழுவதும்
  rationale: முந்தைய இயக்க வினையுடன் வரும் בְּ இங்கு கானான் நிலப்பரப்பு முழுவதிலும் நடந்த வழிநடத்தலைக் குறிக்கிறது. ‘நாடு முழுவதும்’ இயல்பான தமிழில் பரப்பின் முழுமையைத் தெரிவிக்கிறது.
- source_word: וָאַרְבֶּה
  choice: பெருகச் செய்து
  rationale: רבה என்பதன் Hiphil வடிவம் ‘பலுகச் செய்தல்/அதிகரிக்கச் செய்தல்’ எனப் பொருள்படும். ‘பெருகச் செய்து’ தெய்வீகக் காரணச் செயலைச் சுருக்கமாகவும் தெளிவாகவும் தருகிறது.
- source_word: זַרְעוֹ
  choice: அவனுடைய சந்ததியை
  rationale: זֶרַע சொற்படியாக ‘விதை’ என்றும் கூட்டொருமையாக ‘சந்ததி’ என்றும் பொருள்படும். மனித வழித்தோன்றல்களைக் குறிக்கும் இச்சூழலில் ‘சந்ததி’ இயல்பாகவும், அதன் கூட்டொருமை நுட்பத்தைப் பாதுகாக்கும் வகையிலும் உள்ளது.
- source_word: וָאֶתֶּן לוֹ אֶת־יִצְחָק
  choice: அவனுக்கு ஈசாக்கைக் கொடுத்தேன்
  rationale: נתן உடன் மறைமுகப் பொருளும் நேர்முகப் பொருளும் வரும் அமைப்பைத் தமிழ் இயல்பான சொல்வரிசையில் தருகிறது; ஈசாக்கு ஆபிரகாமுக்கு தேவனால் கொடுக்கப்பட்டவர் என்ற கருத்தையும் பாதுகாக்கிறது.
theological_decisions:
- issue: ஆபிரகாமுக்கான மூதாதை அடையாளம்
  choice: உங்கள் தந்தையான ஆபிரகாம்
  alternative: உங்கள் மூதாதையான ஆபிரகாம்
  rationale: மூல எபிரெயம் ‘உங்கள் தந்தை’ என்றே கூறுகிறது. இதை பொதுவான ‘மூதாதை’ என மாற்றாமல் இருப்பது இஸ்ரவேலிடம் பேசப்படும் குடும்ப-உடன்படிக்கைச் சொல்லாட்சியைப் பாதுகாக்கிறது.
- issue: ‘ஆறு’ என்பதன் அடையாளம்
  choice: ஆறு
  alternative: யூபிராத்து ஆறு
  rationale: மூல உரை தனிப்பெயரைச் சொல்லாமல் definite common noun ஆக ‘அந்த ஆறு’ எனக் குறிப்பிடுகிறது. ஆகவே பிரதான உரையில் பெயரைச் சேர்க்காமல், சாத்தியமான அடையாளம் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான வேதாகம நடையில் அமைக்கப்பட்டது. எபிரெய வாக்கியத்தின் தொடர்ச்சியைத் தமிழில் இயல்பாகப் பிரித்து வழங்கினாலும், தேவனே எல்லா வினைகளுக்கும் எழுவாய் என்பதும் செயல்களின் வரிசையும் காக்கப்பட்டுள்ளன.
