  to: ஆகவே இப்போது, உங்கள் நடுவில் உள்ள அந்நிய தெய்வங்களை அகற்றுங்கள்; உங்கள் இதயத்தை இஸ்ரவேலின் கடவுளாகிய யாவேவை நோக்கித் திருப்புங்கள்.
