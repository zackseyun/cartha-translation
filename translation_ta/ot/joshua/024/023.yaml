id: JOS.24.23
reference: Joshua 24:23
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וְ/עַתָּ֕ה הָסִ֛ירוּ אֶת אֱלֹהֵ֥י הַ/נֵּכָ֖ר אֲשֶׁ֣ר בְּ/קִרְבְּ/כֶ֑ם וְ/הַטּוּ֙ אֶת לְבַבְ/כֶ֔ם אֶל יְהוָ֖ה אֱלֹהֵ֥י יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/023.yaml
  text: So now[a], remove the foreign gods that are among you, and turn your heart to Yahweh[b], the God of Israel.
translation:
  language: ta
  text: ஆகவே இப்போது, உங்கள் நடுவில் உள்ள அந்நிய தெய்வங்களை அகற்றுங்கள்; உங்கள் இதயத்தை இஸ்ரவேலின் கடவுளாகிய யாவேவை நோக்கித் திருப்புங்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעַתָּה
  choice: ஆகவே இப்போது
  rationale: וְ தொடர் உரையின் முடிவிலிருந்து வரும் நடைமுறைத் தீர்மானத்தையும், עַתָּה உடனடித் தன்மையையும் காட்டுகிறது.
- source_word: הָסִירוּ
  choice: அகற்றிவிட்டு
  rationale: ஹிஃபில் பன்மை ஏவல் வடிவம் ‘அகற்று/விலக்கு’ என்ற செயற்பொருளைத் தருகிறது; அடுத்த கட்டளையுடன் இயல்பாக இணைக்கப்படுகிறது.
- source_word: אֱלֹהֵי הַנֵּכָר
  choice: அந்நிய தெய்வங்களை
  rationale: இது வெறுமனே விசித்திரமான தெய்வங்கள் அல்ல, பிற இனங்களுக்குரிய அல்லது அந்நிய வழிபாட்டைச் சேர்ந்த தெய்வங்கள் என்பதைக் குறிக்கிறது.
- source_word: אֲשֶׁר בְּקִרְבְּכֶם
  choice: உங்கள் நடுவில் இருக்கிற
  rationale: בקרבכם மக்களிடையே அல்லது அவர்கள் மத்தியில் இருப்பதைச் சுட்டுகிறது; ‘உங்களுக்குள்’ என்றால் உளவியல் பொருள் ஏற்படக்கூடும்.
- source_word: וְהַטּוּ אֶת לְבַבְכֶם
  choice: உங்கள் இதயத்தை … நோக்கித் திருப்புங்கள்
  rationale: נטה என்பதன் ‘சாய்த்து/திருப்பு’ உருவகத்தையும், לְבַבְכֶם என்பதன் கூட்டு ஒருமையையும் இயல்பான தமிழில் காக்கிறது.
- source_word: אֶל יְהוָה
  choice: யெகோவாவை நோக்கி
  rationale: אֶל திசைநோக்கை உணர்த்துகிறது; יְהוָה உடன்படிக்கைப் பெயராக ஒலிபெயர்க்கப்படுகிறது.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் கடவுளாகிய
  rationale: இணைப்புத் தொடரைத் தெளிவான நவீன தமிழில் அடையாள விளக்கமாக வழங்குகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழியாக்கம்
  choice: யெகோவா
  alternative: யாவே; கர்த்தர்
  rationale: மூலத்தில் தனிப்பட்ட உடன்படிக்கைப் பெயர் நேரடியாக உள்ளது. பொதுப்பட்டமான ‘கர்த்தர்’ என்று மாற்றாமல் பெயரையே தமிழில் பரவலாக அறியப்பட்ட ‘யெகோவா’ வடிவில் தருகிறது; ‘யாவே’ என்பது மாற்று ஒலிபெயர்ப்பு.
- issue: לְבַבְכֶם என்பதன் கூட்டு ஒருமை
  choice: உங்கள் இதயத்தை
  alternative: உங்கள் இதயங்களை; உங்கள் மனதை
  rationale: எபிரெயத்தில் இரண்டாம் நபர் பன்மை உரிமை விகுதியுடன் ‘இதயம்’ ஒருமையில் உள்ளது; மக்களின் ஒன்றுபட்ட உள்ளார்ந்த பற்றைத் தீர்மானிக்காமல் அப்படியே காக்கிறது.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான, பொதுவாசகருக்குத் தெளிவான தமிழ். எபிரெய கட்டளைகளின் வலிமையும் ‘இதயம்’ என்ற உருவகமும் பாதுகாக்கப்பட்டுள்ளன. மேற்கோளின் பேச்சாளரைத் தெளிவுபடுத்த ‘என்றார்’ சேர்க்கப்பட்டுள்ளது.
