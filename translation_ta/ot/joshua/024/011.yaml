base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/011.yaml
  text: Then you crossed the Jordan and came to Jericho[a], and the men of Jericho fought against you—the Amorites, the Perizzites, the Canaanites, the Hittites, the Girgashites, the Hivites, and the Jebusites—and I gave them into your hand.
translation:
  language: ta
  text: பின்பு நீங்கள் யோர்தானைக் கடந்து எரிகோவுக்கு வந்தீர்கள். எரிகோவின் குடிமக்களும் எமோரியர், பெரிசியர், கானானியர், ஏத்தியர், கிர்காசியர், ஏவியர், எபூசியர் ஆகியோரும் உங்களுக்கு எதிராகப் போரிட்டார்கள்; நான் அவர்களை உங்கள் கையில் ஒப்புக்கொடுத்தேன்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘எரிகோவின் எஜமானர்கள்.’ எபிரெயச் சொற்றொடர் சொல்லுக்குச் சொல் ‘எரிகோவின் எஜமானர்கள்/உரிமையாளர்கள்’ என்று பொருள்படும்; இது நகரின் ஆட்சியாளர்களையோ முதன்மையானவர்களையோ, அல்லது அதன் குடிமக்களையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּעַבְרוּ אֶת הַיַּרְדֵּן
  choice: நீங்கள் யோர்தானைக் கடந்து
  rationale: עבר என்பதன் இயல்பான இயக்கப் பொருளையும் யோர்தான் என்ற நிலையான பெயரையும் நேரடியாகப் பாதுகாக்கிறது.
- source_word: וַתָּבֹאוּ אֶל יְרִיחוֹ
  choice: எரிகோவுக்கு வந்தீர்கள்
  rationale: בוא + אֶל என்பது நகரை அடைந்ததைக் குறிக்கிறது; நகருக்குள் நுழைந்ததாகத் தேவையின்றி மிகைப்படுத்தவில்லை.
- source_word: בַּעֲלֵי יְרִיחוֹ
  choice: எரிகோவின் தலைவர்கள்
  rationale: בעלים என்பதன் சொற்பொருள் ‘உரிமையாளர்கள்/எஜமானர்கள்’; இச்சூழலில் நகரின் ஆட்சியாளர்கள் அல்லது முதன்மையானவர்களைக் குறிக்கக்கூடும். மூலத்தின் தெளிவின்மையை அடிக்குறிப்பு காட்டுகிறது.
- source_word: וַיִּלָּחֲמוּ בָכֶם
  choice: உங்களோடு போரிட்டார்கள்
  rationale: לחם + ב பகைமையான போரிடுதலைக் குறிக்கிறது; தமிழில் ‘உங்களோடு போரிட்டார்கள்’ இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: הָאֱמֹרִי וְהַפְּרִזִּי וְהַכְּנַעֲנִי וְהַחִתִּי וְהַגִּרְגָּשִׁי הַחִוִּי וְהַיְבוּסִי
  choice: எமோரியர், பெரிசியர், கானானியர், ஏத்தியர், கிர்காசியர், ஏவியர், எபூசியர்
  rationale: எபிரெயில் ஒருமை வடிவில் உள்ள இனப்பெயர்கள் கூட்டுப் பொருளுடையவை; தமிழின் மரபான வேதாகம இனப்பெயர் வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன.
- source_word: וָאֶתֵּן אוֹתָם בְּיֶדְכֶם
  choice: நான் அவர்களை உங்கள் கையில் ஒப்புக்கொடுத்தேன்
  rationale: נתן + ביד என்ற வெற்றி/அதிகார ஒப்படைப்பு மரபுத்தொடரைத் தமிழில் புரியக்கூடிய விதத்தில் கையின் உருவகத்துடன் பாதுகாக்கிறது.
theological_decisions:
- issue: இஸ்ரவேலின் வெற்றியில் செயலாற்றுபவர்
  choice: நான் அவர்களை உங்கள் கையில் ஒப்புக்கொடுத்தேன்
  alternative: அவர்கள் உங்கள் வசமாகும்படி செய்தேன்
  rationale: மூலத்தின் முதலாம் நபர் இறைச்செயலையும் வெற்றியை நேரடியாகக் கடவுளுக்குச் சார்த்துவதையும் மெலிதாக்காமல் பாதுகாக்கிறது.
- issue: எரிகோவின் எதிரிகளின் அடையாளம்
  choice: எரிகோவின் தலைவர்கள்
  alternative: எரிகோவின் ஆண்கள் / எரிகோவின் குடிகள்
  rationale: בַּעֲלֵי என்பதன் ‘எஜமானர்கள்/உரிமையாளர்கள்’ என்ற கூறை மதிக்கிறது; அது அனைத்து குடிகளையா, ஆட்சியாளர்களையா குறிக்கிறது என்பது முழுமையாகத் தீர்மானிக்கப்படாததால் மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. நீண்ட எபிரெய வாக்கியம் வாசிப்புத் தெளிவுக்காக இரண்டு வாக்கியங்களாகப் பிரிக்கப்பட்டது; இனப்பட்டியல் எதிர்த்துப் போரிட்டவர்களை விளக்குவதாகத் தெளிவுபடுத்தப்பட்டது. ‘ஆனால்’ என்பது இறைச்செயலின் முடிவுத் திருப்பத்தை இயல்பாகக் காட்டுகிறது.
