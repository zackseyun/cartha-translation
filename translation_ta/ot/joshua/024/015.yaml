base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/015.yaml
  text: But if it is evil in your eyes to serve Yahweh[a], choose for yourselves today whom you will serve—whether the gods your fathers served beyond the River, or the gods of the Amorites in whose land you are dwelling. But as for me and my house[d][c][b], we will serve Yahweh.
translation:
  language: ta
  text: 'ஆனால் யாவேவுக்குச் சேவை செய்வது உங்கள் பார்வையில் தீமையாக இருந்தால்[a], நீங்கள் யாருக்குச் சேவை செய்வீர்கள் என்பதை இன்று நீங்களே தேர்ந்தெடுங்கள்: ஆற்றுக்கு அப்பால்[b] உங்கள் தந்தையர்[c] சேவை செய்த தெய்வங்களுக்கா, அல்லது நீங்கள் குடியிருக்கும் நாட்டிலுள்ள எமோரியரின் தெய்வங்களுக்கா? ஆனால் நானும் என் வீட்டாரும்[d] யாவேவுக்குச் சேவை செய்வோம்.


    [a] அல்லது, “உங்களுக்குத் தவறாகத் தோன்றினால்” அல்லது “உங்களுக்கு விருப்பமற்றதாக இருந்தால்”; சொல்லுக்குச் சொல், “உங்கள் கண்களில் தீமையாக இருந்தால்.”


    [b] இங்கு “ஆறு” என்பது ஐப்பிராத்து ஆற்றைக் குறிக்கிறது.


    [c] அல்லது, “உங்கள் மூதாதையர்.” எபிரெயத்தில், “உங்கள் தந்தையர்.”


    [d] அல்லது, “என் குடும்பத்தாரும்.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உங்களுக்குத் தவறாகத் தோன்றினால்” அல்லது “உங்களுக்கு விருப்பமற்றதாக இருந்தால்”; சொல்லுக்குச் சொல், “உங்கள் கண்களில் தீமையாக இருந்தால்.”
    reason: lexical_alternative
  - marker: b
    text: இங்கு “ஆறு” என்பது ஐப்பிராத்து ஆற்றைக் குறிக்கிறது.
    reason: cultural_note
  - marker: c
    text: அல்லது, “உங்கள் மூதாதையர்.” எபிரெயத்தில், “உங்கள் தந்தையர்.”
    reason: lexical_alternative
  - marker: d
    text: அல்லது, “என் குடும்பத்தாரும்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: ஆனால் ... இருந்தால்
  rationale: முந்தைய அழைப்புடன் உள்ள நிபந்தனை சார்ந்த முரண்பாட்டை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: רַע בְּעֵינֵיכֶם
  choice: உங்கள் பார்வையில் தீமையாக இருந்தால்
  rationale: கேட்போரின் மதிப்பீட்டைக் குறிக்கும் எபிரெய உருவகத்தையும் அதன் கூர்மையையும் இயன்றவரை தக்கவைக்கிறது; இயல்பான மாற்றுகள் அடிக்குறிப்பில் தரப்பட்டுள்ளன.
- source_word: לַעֲבֹד / תַעֲבֹדוּן / נַעֲבֹד
  choice: சேவை செய்வது / சேவை செய்வீர்கள் / சேவை செய்வோம்
  rationale: வழிபாடு மட்டுமல்லாமல் உடன்படிக்கை சார்ந்த பற்றுறுதியையும் உள்ளடக்கும் வினையின் விரிந்த பொருளையும், வசனத்தின் தொடர்ச்சியான சொல் மீளுருவாக்கத்தையும் காக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைப்பட்டத்தால் மாற்றாமல், எபிரெய நான்கெழுத்துத் திருப்பெயரை நவீன தமிழில் ஒலிபெயர்க்கிறது.
- source_word: בַּחֲרוּ לָכֶם הַיּוֹם
  choice: இன்று நீங்களே தேர்ந்தெடுங்கள்
  rationale: கட்டளையின் அவசரத்தையும் ‘உங்களுக்காக/நீங்களே’ என்ற வலியுறுத்தலையும் இயல்பான தமிழில் தருகிறது.
- source_word: אֱלֹהִים ... אֱלֹהֵי
  choice: தெய்வங்கள்
  rationale: இங்கு பிற இனத்தாரின் பல தெய்வங்கள் குறிக்கப்படுவதால் பன்மை தெளிவாக வைக்கப்பட்டுள்ளது.
- source_word: אֲשֶׁר עָבְדוּ אֲבוֹתֵיכֶם
  choice: உங்கள் தந்தையர் சேவை செய்த
  rationale: எபிரெயச் சொல்லின் ஆண்பால் வடிவை முதன்மை உரையில் தக்கவைக்கிறது; பரந்த மூதாதையர் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: בְּעֵבֶר הַנָּהָר
  choice: ஆற்றுக்கு அப்பால்
  rationale: ஐப்பிராத்துக்கு அப்பாலுள்ள பகுதியைக் குறிக்கும் வழக்கமான புவியியல் சொல்லாக்கத்தைச் சுருக்கமாகப் பிரதிபலிக்கிறது.
- source_word: אֲשֶׁר אַתֶּם יֹשְׁבִים בְּאַרְצָם
  choice: நீங்கள் குடியிருக்கும் நாட்டின்
  rationale: எமோரியரின் நாட்டில் இஸ்ரவேலர் அப்போது வாழ்ந்துகொண்டிருந்த நிலையை இயல்பான தமிழில் காட்டுகிறது.
- source_word: וְאָנֹכִי וּבֵיתִי
  choice: ஆனால் நானும் என் வீட்டாரும்
  rationale: யோசுவாவின் வலியுறுத்தப்பட்ட தனிப்பட்ட நிலைப்பாட்டையும் ‘வீடு’ என்பதன் குடும்பம்/வீட்டார் சார்ந்த பொருளையும் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைபெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலத்தில் தனிப்பட்ட இறைபெயர் நேரடியாக உள்ளது; அதை ஒரு பட்டமாக மாற்றாமல் ஒலிபெயர்ப்பது மூல வேறுபாட்டைக் காக்கிறது.
- issue: עבד என்பதிலுள்ள சமயப் பற்றுறுதி
  choice: சேவை செய்
  alternative: வழிபடு
  rationale: வழிபாட்டையும் கீழ்ப்படிதலையும் பற்றுறுதியையும் உள்ளடக்கும் விரிந்த பொருளைத் தக்கவைத்து, வசனமெங்கும் ஒரே வினை மீண்டும் வருவதையும் காக்கிறது.
- issue: אֲבוֹתֵיכֶם என்பதிலுள்ள பாலினம் சார்ந்த மூதாதையர் மொழி
  choice: உங்கள் தந்தையர்
  alternative: உங்கள் மூதாதையர்
  rationale: மூலத்தின் ஆண்பால் பன்மையை முதன்மை உரையில் காக்கிறது; சூழலில் சாத்தியமான பரந்த வம்சாவளிப் பொருளை அடிக்குறிப்பில் தெரிவிக்கிறது.
- issue: வீட்டுத் தலைவனின் கூட்டு உறுதிமொழி
  choice: நானும் என் வீட்டாரும் ... சேவை செய்வோம்
  alternative: நானும் என் குடும்பத்தாரும் ... சேவை செய்வோம்
  rationale: ביתי என்பதன் குடும்பம் மற்றும் வீட்டைச் சேர்ந்தோர் என்ற கூட்டுப் பொருளைத் தருகிறது; யோசுவாவின் கூற்று வீட்டாரின் மனச்சாட்சியைப் பற்றிய கூடுதல் கோட்பாடாக விரிவாக்கப்படவில்லை.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் அதே நேரத்தில் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. ‘சேவை செய்’ என்ற மீளுருவாக்கமும் தேர்வு குறித்த கேள்வியின் வலிமையும் காக்கப்பட்டுள்ளன; அரிதான பண்டைய சொற்கள் தவிர்க்கப்பட்டுள்ளன.
