    reason: lexical_alternative
  revision_rationale: The revision removes the added explicit action “they went” and attaches the destination directly to Joshua's sending away, as in the Hebrew. It also uses “மரபுரிமைப் பங்கு” for the inherited allotment and revises the footnote so that it does not introduce the same added action.
