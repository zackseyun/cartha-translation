revisions:
- from: பின்பு யோசுவா மக்களை அனுப்பிவிட்டார்; ஒவ்வொருவரும் தத்தம் உரிமைச் சொத்துக்குச் சென்றார்கள்.[a]
  to: பின்பு யோசுவா மக்களை, ஒவ்வொருவரையும் தத்தம் மரபுரிமைப் பங்குக்கு, அனுப்பிவிட்டார்.[a]
  rationale: The revision removes the added explicit action “they went” and attaches the destination directly to Joshua's sending away, as in the Hebrew. It also uses “மரபுரிமைப் பங்கு” for the inherited allotment and revises the footnote so that it does not introduce the same added action.
