translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் வடிவமைக்கப்பட்டுள்ளது. எபிரெய வாக்கியத்தில் ‘அனுப்பினார்’ என்பதற்குப் பின் வரும் இலக்கு-சொற்றொடர் தமிழில் முழுமையான விளைவாகப் புரிய ‘சென்றார்கள்’ சேர்க்கப்பட்டுள்ளது; புதிய தகவல் சேர்க்காமல் அவர்கள் தத்தம் பங்குகளுக்குத் திரும்பியதை வெளிப்படுத்துகிறது. அடிக்குறிப்பு குறி முதன்மை உரையில் இடம்பெற்றுள்ளது.
