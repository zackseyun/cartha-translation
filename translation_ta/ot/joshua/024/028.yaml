source:
  edition: WLC
  text: וַ/יְשַׁלַּ֤ח יְהוֹשֻׁ֨עַ֙ אֶת הָ/עָ֔ם אִ֖ישׁ לְ/נַחֲלָתֽ/וֹ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/028.yaml
  text: Then Joshua sent the people away[a], each man to his inheritance.
translation:
  language: ta
  text: பின்பு யோசுவா மக்களை, ஒவ்வொருவரையும் தத்தம் மரபுரிமைப் பங்குக்கு, அனுப்பிவிட்டார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஒவ்வொரு ஆணையும் அவனவன் மரபுரிமைப் பங்குக்கு.” எபிரெய மொழியில் אִישׁ என்ற ஆண்பால் ஒருமைச் சொல் இங்கு ஒவ்வொருவரையும் தனித்தனியாகக் குறிக்கும் வகையில் பயன்படுத்தப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְשַׁלַּח
  choice: அனுப்பிவிட்டார்
  rationale: பியேல் வடிவம் கூடியிருந்த மக்களைப் புறப்பட்டுச் செல்லும்படி அனுப்புவதைக் குறிக்கிறது; நவீன தமிழில் ‘அனுப்பிவிட்டார்’ இந்த விடைகொடுத்து அனுப்பும் பொருளை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: יְהוֹשֻׁעַ
  choice: யோசுவா
  rationale: தமிழ் வேதாகம மரபில் பரவலாக அறியப்பட்ட பெயர் வடிவம் பயன்படுத்தப்பட்டுள்ளது.
- source_word: הָעָם
  choice: மக்களை
  rationale: עָם இங்கு கூடியிருந்த இஸ்ரவேல் மக்களை ஒரு கூட்டாகக் குறிக்கிறது; ‘மக்கள்’ இயல்பானதும் அளவுக்கு மீறி விளக்காததுமான தேர்வு.
- source_word: אִישׁ
  choice: ஒவ்வொருவரும்
  rationale: ஆண்பால் ஒருமையான אִישׁ இங்கு பகிர்ந்தளிக்கும் பொருளில், ஒவ்வொரு குடும்பத் தலைவரையோ நபரையோ குறிக்கிறது. தமிழில் ‘ஒவ்வொருவரும்’ அந்தப் பகிர்ந்தளிக்கும் வலிமையை இயல்பாகத் தருகிறது; மூலத்தின் ஆண்பால் வடிவம் அடிக்குறிப்பில் குறிப்பிடப்படுகிறது.
- source_word: לְנַחֲלָתוֹ
  choice: தத்தம் உரிமைச் சொத்துக்கு
  rationale: נַחֲלָה யோசுவா நூலில் கோத்திரங்களுக்கும் குடும்பங்களுக்கும் பங்கிடப்பட்ட பரம்பரை நிலவுரிமையைச் சுட்டுகிறது. ‘உரிமைச் சொத்து’ பொதுவான உடைமையைவிட அந்த ஒதுக்கப்பட்ட வாரிசுரிமைப் பொருளைத் தெளிவாகக் காக்கிறது; ‘தத்தம்’ எபிரெயச் சொற்றொடரின் பகிர்ந்தளிக்கும் தன்மையை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
