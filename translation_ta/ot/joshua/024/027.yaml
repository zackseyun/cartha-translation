source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוֹשֻׁ֜עַ אֶל כָּל הָ/עָ֗ם הִנֵּ֨ה הָ/אֶ֤בֶן הַ/זֹּאת֙ תִּֽהְיֶה בָּ֣/נוּ לְ/עֵדָ֔ה כִּֽי הִ֣יא שָׁמְעָ֗ה אֵ֚ת כָּל אִמְרֵ֣י יְהוָ֔ה אֲשֶׁ֥ר דִּבֶּ֖ר עִמָּ֑/נוּ וְ/הָיְתָ֤ה בָ/כֶם֙ לְ/עֵדָ֔ה פֶּֽן תְּכַחֲשׁ֖וּ/ן בֵּ/אלֹהֵי/כֶֽם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/027.yaml
  text: And Joshua said to all the people[a], “Look, this stone will be a witness against us, for it has heard all the words of Yahweh that he spoke with us. And it will be a witness against you[c][b], lest you deny your God.”
translation:
  language: ta
  text: யோசுவா மக்கள் அனைவரிடமும், “இதோ, இந்தக் கல் நமக்கு எதிரான சாட்சியாக இருக்கும்[a]. ஏனெனில், யாவே நம்மோடு பேசிய வார்த்தைகள் அனைத்தையும் இது கேட்டிருக்கிறது[b]. நீங்கள் உங்கள் கடவுளை மறுதலிக்காதபடி[c], இது உங்களுக்கு எதிரான சாட்சியாக இருக்கும்” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நமக்குச் சாட்சியாக.” இங்குள்ள எபிரெய முன்னிடைச்சொல்லை நடுநிலையாகவும் புரிந்துகொள்ளலாம்; ஆனால் உடன்படிக்கைக்கு உண்மையற்றுப் போவதைப் பற்றிய எச்சரிக்கைச் சூழல், ‘நமக்கு எதிரான சாட்சி’ என்ற பொருளை ஆதரிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: சொல்லுக்கு சொல், “கேட்டது.” உடன்படிக்கையின் வார்த்தைகளைக் கேட்ட சாட்சியாகக் கல் உயிரூட்டிக் கூறப்படுகிறது.
    reason: cultural_note
  - marker: c
    text: அல்லது, “உங்கள் கடவுளிடம் உண்மையற்றவர்களாக நடந்துகொள்ளாதபடி” அல்லது “உங்கள் கடவுளுக்குத் துரோகம் செய்யாதபடி.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: இதோ
  rationale: கவனத்தை ஈர்க்கும் எபிரெய இடைச்சொல்லின் வலிமையை இயல்பான, மரியாதையான நவீன தமிழில் தருகிறது.
- source_word: הָאֶבֶן הַזֹּאת
  choice: இந்தக் கல்
  rationale: אֶבֶן என்பதன் வழக்கமான பொருள் ‘கல்’; உடன்படிக்கையின் நினைவுச் சின்னமாக நிறுத்தப்பட்ட பொருளுக்கும் இது துல்லியமாகப் பொருந்துகிறது.
- source_word: תִּהְיֶה ... לְעֵדָה
  choice: சாட்சியாக இருக்கும்
  rationale: עֵדָה என்பதிலுள்ள உடன்படிக்கை சார்ந்த சாட்சியப் பொருளையும், היה என்ற வினையின் எளிய எதிர்காலத் தன்மையையும் காக்கிறது.
- source_word: בָּנוּ / בָכֶם
  choice: நமக்கு எதிரான / உங்களுக்கு எதிரான
  rationale: இந்த உடன்படிக்கை எச்சரிக்கையின் சூழலில் ב என்பது உடன்படிக்கையை மீறுவோருக்கு எதிராகச் சாட்சி நிற்பதைக் குறிக்கிறது; இருப்பினும் அதன் நடுநிலையான மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: שָׁמְעָה
  choice: கேட்டிருக்கிறது
  rationale: நிறைவுற்ற செயல் தற்போதும் பொருத்தமுடையதாக இருப்பதை வெளிப்படுத்துவதோடு, கல் கேட்டதாகக் கூறும் மூலத்தின் உயிரூட்டப்பட்ட உருவகத்தையும் நேரடியாகக் காக்கிறது.
- source_word: כָּל אִמְרֵי יְהוָה
  choice: யாவே ... பேசிய வார்த்தைகள் அனைத்தையும்
  rationale: אִמְרֵי என்பதற்கு இயல்பான ‘வார்த்தைகள்’ என்பதைப் பயன்படுத்தி, יהוה என்ற தனிப்பெயரை ‘யாவே’ என்று ஒலிபெயர்க்கிறது.
- source_word: אֲשֶׁר דִּבֶּר עִמָּנוּ
  choice: நம்மோடு பேசிய
  rationale: עִם என்ற முன்னிடைச்சொல்லின் ‘உடன்/ஓடு’ என்ற வடிவத்தைப் பாதுகாத்து, உடன்படிக்கை உரையாடலின் உறவுத்தன்மையை வெளிப்படுத்துகிறது.
- source_word: פֶּן
  choice: மறுதலிக்காதபடி
  rationale: தமிழில் இயல்பான எதிர்மறை நோக்கத் தொடரால் פֶּן என்பதன் எச்சரிக்கை மற்றும் தடுப்பு வலிமையைத் தருகிறது.
- source_word: תְּכַחֲשׁוּן בֵּאלֹהֵיכֶם
  choice: உங்கள் கடவுளை மறுதலிக்காதபடி
  rationale: כחש இச்சூழலில் கடவுளையும் உடன்படிக்கை உறுதியையும் மறுப்பது அல்லது உண்மையற்றுப் போவது என்ற பொருளைக் கொண்டுள்ளது; ‘மறுதலித்தல்’ அதன் தீவிரத்தைத் தெளிவாகக் காட்டுகிறது.
theological_decisions:
- issue: கல் கேட்டதாகவும் சாட்சியாக இருப்பதாகவும் கூறப்படும் உயிரூட்டல்
  choice: மூலத்திலுள்ள உயிரூட்டப்பட்ட மொழியை நேரடியாகத் தக்கவைத்தல்
  alternative: வெளிப்படையான உயிரூட்டலை நீக்கி, கல்லை ஒரு நினைவுச் சின்னம் என்று மட்டும் விளக்குதல்
  rationale: எபிரெய உரை கல் ‘கேட்டது’ என்றும் ‘சாட்சியாக இருக்கும்’ என்றும் வெளிப்படையாகக் கூறுகிறது. அதை அப்படியே காப்பது உடன்படிக்கை நிகழ்வின் சொல்லாட்சியை மதிக்கிறது; விளக்கவுரையை மொழிபெயர்ப்புக்குள் புகுத்துவதைத் தவிர்க்கிறது.
- issue: சாட்சி ‘எதிராக’ உள்ளதா அல்லது ‘சார்பாக/முன்பாக’ உள்ளதா
  choice: உடன்படிக்கை மீறலுக்கான எச்சரிக்கைச் சூழலை முன்னிட்டு ‘எதிரான சாட்சி’
  alternative: ‘நமக்குச் சாட்சியாக / உங்களுக்குச் சாட்சியாக’ என்ற நடுநிலை வாசிப்பு
  rationale: ב என்ற முன்னிடைச்சொல் தனித்து எதிர்மறைப் பொருளை கட்டாயப்படுத்தாவிட்டாலும், கடவுளை மறுதலிக்க வேண்டாம் என்ற உடனடி எச்சரிக்கை குற்றஞ்சாட்டும் சாட்சிப் பொருளை ஆதரிக்கிறது. உண்மையான இலக்கணத் தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும், வேதாகம நிகழ்வுக்கேற்ற கண்ணியமான தொனியுடனும் வடிவமைக்கப்பட்டது. ‘இதோ,’ ‘சாட்சி,’ ‘மறுதலித்தல்’ ஆகிய சொற்கள் மூலத்தின் சட்டபூர்வமான உடன்படிக்கைத் தொனியை அளவுக்கு மீறிய பழமையாக்கமின்றிக் காக்கின்றன. יהוה என்பது ‘யாவே’ என்று ஒலிபெயர்க்கப்பட்டுள்ளது.
