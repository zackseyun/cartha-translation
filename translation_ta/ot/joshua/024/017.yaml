  text: כִּ֚י יְהוָ֣ה אֱלֹהֵ֔י/נוּ הוּא֩ הַ/מַּעֲלֶ֨ה אֹתָ֧/נוּ וְ/אֶת אֲבוֹתֵ֛י/נוּ מֵ/אֶ֥רֶץ מִצְרַ֖יִם מִ/בֵּ֣ית עֲבָדִ֑ים וַ/אֲשֶׁ֧ר עָשָׂ֣ה לְ/עֵינֵ֗י/נוּ אֶת הָ/אֹת֤וֹת הַ/גְּדֹלוֹת֙ הָ/אֵ֔לֶּה וַֽ/יִּשְׁמְרֵ֗/נוּ בְּ/כָל הַ/דֶּ֨רֶךְ֙ אֲשֶׁ֣ר הָלַ֣כְנוּ בָ֔/הּ וּ/בְ/כֹל֙ הָֽ/עַמִּ֔ים אֲשֶׁ֥ר עָבַ֖רְנוּ בְּ/קִרְבָּֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/017.yaml
  text: For Yahweh our God is the one who brought us and our fathers up from the land of Egypt[a], from the house of servants, and who did these great signs before our eyes, and kept us in all the way in which we walked[b], and among all the peoples through whose midst we passed.
translation:
  language: ta
  text: ஏனெனில், நம் கடவுளாகிய யாவேதான் நம்மையும் நம் முன்னோர்களையும் எகிப்து நாட்டிலிருந்து, அடிமைகளின் வீட்டிலிருந்து[a], வெளியே கொண்டுவந்தார். அவரே நம் கண்களுக்கு முன்பாக இந்தப் பெரிய அடையாளங்களைச் செய்தார்; நாம் சென்ற வழியெங்கும், நாம் கடந்து சென்ற எல்லா மக்களினங்களின் நடுவிலும் நம்மைக் காத்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அடிமைத்தனத்தின் வீட்டிலிருந்து.” எபிரேயத்தில் சொல்லுக்கு சொல் “அடிமைகளின் வீட்டிலிருந்து.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய வசனத்தில் மக்கள் தெரிவித்த அர்ப்பணிப்புக்கான காரணத்தை இச்சொல் அறிமுகப்படுத்துகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரேய மூலத்தில் வரும் உடன்படிக்கைப் பெயரைப் பட்டப்பெயராக மாற்றாமல் ஒலிபெயர்க்கிறது.
- source_word: אֱלֹהֵינוּ הוּא
  choice: நம் கடவுளாகிய யாவேதான்
  rationale: தனியாக வரும் הוּא தரும் வலியுறுத்தலைத் தமிழில் இயல்பாக ‘தான்’ மூலம் வெளிப்படுத்துகிறது.
- source_word: הַמַּעֲלֶה
  choice: வெளியே கொண்டுவந்தார்
  rationale: அடிப்படைப் பொருள் ‘மேலே கொண்டுவருதல்’ என்றாலும், எகிப்திலிருந்து விடுவித்துச் செலுத்தியதை நவீன தமிழில் தெளிவாகத் தெரிவிக்கிறது; திசை உருவகத்தை இயற்கையற்ற முறையில் திணிக்கவில்லை.
- source_word: אֲבוֹתֵינוּ
  choice: நம் முன்னோர்கள்
  rationale: இங்கு இஸ்ரவேலின் முந்தைய தலைமுறையினரை உள்ளடக்கமாகவும் இயல்பாகவும் குறிக்கிறது.
- source_word: מִבֵּית עֲבָדִים
  choice: அடிமைகளின் வீட்டிலிருந்து
  rationale: எபிரேயத்தின் ‘அடிமைகளின் வீடு’ என்ற திடமான சமூகநிலை உருவகத்தைப் பாதுகாக்கிறது; இயல்பான மாற்றுச் சொற்றொடர் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: הָאֹתוֹת הַגְּדֹלוֹת הָאֵלֶּה
  choice: இந்தப் பெரிய அடையாளங்கள்
  rationale: אוֹת என்பதன் அடிப்படை ‘அடையாளம்’ என்ற பொருளையும் நிகழ்வுகளின் அற்புதத் தன்மையைப் பற்றிய தேவையற்ற விளக்கச் சேர்க்கையையும் தவிர்க்கிறது.
- source_word: וַיִּשְׁמְרֵנוּ
  choice: நம்மைக் காத்தார்
  rationale: பயணத்தில் பாதுகாத்தல் என்ற שׁמר-இன் சூழல்சார் பொருளைத் தெளிவாகக் கொடுக்கிறது.
- source_word: בְּכָל הַדֶּרֶךְ אֲשֶׁר הָלַכְנוּ בָהּ
  choice: நாம் சென்ற வழியெங்கும்
  rationale: எபிரேயத் தொடரின் முழுமையைச் சுருக்காமல், நவீன தமிழில் இயல்பாகத் தெரிவிக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் நேரடியாக வரும் தனிப்பெயரைப் பாதுகாக்கிறது; அதை ஒரு பட்டப்பெயரால் மாற்றவில்லை.
- issue: בֵּית עֲבָדִים என்ற யாத்திராகமச் சொற்றொடர்
  choice: அடிமைகளின் வீடு
  alternative: அடிமைத்தனத்தின் வீடு
  rationale: עֲבָדִים என்பது பன்மை நபர்ப் பெயர் என்பதால், அடிமைப்படுத்தப்பட்ட மக்களின் திடமான நிலையைப் பாதுகாக்கிறது; தமிழ் இயல்புக்கான மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- issue: אוֹת என்பதன் இயல்பு
  choice: அடையாளங்கள்
  alternative: அற்புதங்கள்
  rationale: நிகழ்வுகள் அதிசயமானவை என்பதை மறுக்காமல், எபிரேயச் சொல்லின் ‘குறியீடு/அடையாளம்’ சார்ந்த பரப்பைத் திறந்தவாறே வைக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்கு விளங்கும், ஆனால் மரியாதையும் வரலாற்றுத் தன்மையும் கொண்ட நடை. நீண்ட எபிரேய வாக்கியம் தமிழின் இயல்புக்காக இரண்டு வாக்கியங்களாகப் பிரிக்கப்பட்டுள்ளது. ‘யாவேதான்’ என்பது הוּא தரும் வலியுறுத்தலைக் காக்கிறது.
