  source_fidelity: மூல எபிரேயத்தின் காரண இணைப்பு, யாவே என்ற தனிப்பெயர், வலியுறுத்தல், எகிப்திலிருந்து வெளியே கொண்டுவருதல், முன்னோர்கள், ‘அடிமைகளின் வீடு,’ பெரிய அடையாளங்கள், பயணமெங்கும் காத்தல், கடந்து சென்ற மக்களினங்களின் நடுவில் காத்தல் ஆகிய அனைத்தும் பொருளுக்கு உண்மையாக உள்ளன. הַמַּעֲלֶה-இன் ‘மேலே’ என்ற திசைநுணுக்கம் ‘வெளியே கொண்டுவந்தார்’ என்பதில் இயல்பாகச் சூழலுக்கேற்றவாறு வெளிப்படுகிறது.
  naturalness: நடை நவீன நிலையான தமிழில் தெளிவாகவும் மரியாதையான வேதாகமப் பதிவுக்கேற்றதாகவும் உள்ளது. நீண்ட எபிரேய வாக்கியத்தை இரண்டு தமிழ் வாக்கியங்களாகப் பிரித்திருப்பது பொருள் தொடர்பைச் சிதைக்கவில்லை. ‘அடிமைகளின் வீட்டிலிருந்து’ சற்றே நேரடி உருவகமாக இருந்தாலும், மூலத்தின் திட்டமிட்ட சொற்தேர்வைப் பாதுகாக்கிறது; மாற்று இயல்பான வாசகம் அடிக்குறிப்பில் உள்ளது.
