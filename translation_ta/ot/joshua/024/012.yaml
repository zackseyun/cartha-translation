  text: וָ/אֶשְׁלַ֤ח לִ/פְנֵי/כֶם֙ אֶת הַ/צִּרְעָ֔ה וַ/תְּגָ֤רֶשׁ אוֹתָ/ם֙ מִ/פְּנֵי/כֶ֔ם שְׁנֵ֖י מַלְכֵ֣י הָ/אֱמֹרִ֑י לֹ֥א בְ/חַרְבְּ/ךָ֖ וְ/לֹ֥א בְ/קַשְׁתֶּֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/012.yaml
  text: And I sent the hornet ahead of you[a], and it drove them out before you—the two kings of the Amorites—not by your sword and not by your bow.
translation:
  language: ta
  text: நான் உங்களுக்கு முன்னே குளவியை அனுப்பினேன்[a]. அது எமோரியரின் இரண்டு அரசர்களையும் உங்கள் முன்னிலையிலிருந்து துரத்தியது. அவர்களைத் துரத்தியது உங்கள் வாளினாலோ உங்கள் வில்லினாலோ அல்ல.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, இது உண்மையான குளவிகளைக் குறிக்காமல், இறைவனால் அனுப்பப்பட்ட பீதி அல்லது திகிலைக் குறிக்கும் உருவகச் சொல்லாக இருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶשְׁלַח
  choice: நான் அனுப்பினேன்
  rationale: שׁלח என்பதன் Qal wayyiqtol முதலாம் நபர் ஒருமை வடிவம்; இறைவன் கடந்தகாலத்தில் செய்த செயலை இயல்பான தமிழில் தெரிவிக்கிறது. தொடர்ச்சியை வாக்கிய ஒழுங்கு எடுத்துரைக்கிறது.
- source_word: לִפְנֵיכֶם
  choice: உங்களுக்கு முன்னே
  rationale: சொற்பொருளில் ‘உங்கள் முகத்திற்கு/உங்கள் முன்னிலையில்’; இங்கு இஸ்ரவேலருக்கு முன்பாக அனுப்பப்பட்டதை இயல்பாகக் குறிக்கிறது.
- source_word: הַצִּרְעָה
  choice: குளவியை
  rationale: இச்சொல்லின் நேரடிப் பொருள் குளவி. எபிரெய ஒருமை வடிவத்தைப் பேணி, உருவக விளக்கத்தை முதன்மை உரைக்குள் புகுத்தாமல் அடிக்குறிப்பில் தருகிறது.
- source_word: וַתְּגָרֶשׁ
  choice: அது ... துரத்தியது
  rationale: גרשׁ என்பதன் பொருள் ‘துரத்து/வெளியேற்று.’ பெண்பால் ஒருமை வினை வடிவம் ‘குளவி’யுடன் இலக்கண ஒத்திசைவு கொண்டிருப்பதால் ‘அது’ எனத் தெளிவுபடுத்தப்பட்டுள்ளது.
- source_word: מִפְּנֵיכֶם
  choice: உங்கள் முன்னிலையிலிருந்து
  rationale: גרשׁ உடன் வரும் இச்சொற்றொடர் இஸ்ரவேலரின் முன்னிலையிலிருந்து அகற்றப்படுவதைக் குறிக்கிறது; தமிழில் உறவைக் குறிப்பாகப் பேணுகிறது.
- source_word: שְׁנֵי מַלְכֵי הָאֱמֹרִי
  choice: எமோரியரின் இரண்டு அரசர்களையும்
  rationale: எபிரெய கட்டமைப்பைத் தெளிவாகவும் இயல்பாகவும் வழங்குகிறது; நேரடி செயப்படுபொருள் உறவை ‘ஐ’ உருபு காட்டுகிறது.
- source_word: לֹא בְחַרְבְּךָ וְלֹא בְקַשְׁתֶּךָ
  choice: உங்கள் வாளினாலோ உங்கள் வில்லினாலோ ... இல்லை
  rationale: ב என்பதன் கருவிப் பொருளை ‘-இனால்’ காட்டுகிறது. இரட்டை மறுப்பை தமிழின் இயல்பான ‘-ஆலோ ... -ஆலோ ... இல்லை’ அமைப்பில் பேணி, வெற்றி இஸ்ரவேலின் ஆயுத வலிமையால் கிடைக்கவில்லை என்பதை வலியுறுத்துகிறது.
theological_decisions:
- issue: הַצִּרְעָה என்பது நேரடியான குளவியைக் குறிக்கிறதா, அல்லது கடவுள் அனுப்பிய பீதி/திகிலுக்கான உருவகமா?
  choice: முதன்மை உரையில் ‘குளவி’ என்று நேரடியாக மொழிபெயர்த்தல்
  alternative: ‘பீதி’ அல்லது ‘திகில்’ என்று விளக்கவுரை சார்ந்து மொழிபெயர்த்தல்
  rationale: சொல்லின் அடிப்படைப் பொருள் ‘குளவி’; சூழல் அதை அவசியமாக உருவகமாக்கவில்லை. எதிரிகளைத் துரத்தியது இறைவனுடைய செயல் என்ற மையக் கருத்து நேரடி மொழிபெயர்ப்பிலும் நிலைக்கிறது. உருவக வாசிப்பின் சாத்தியம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன செந்தமிழ் நடையில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான மொழி பயன்படுத்தப்பட்டுள்ளது. ‘எமோரியர்’ என்ற வழக்கமான இனப்பெயரும், ஆயுதங்களால் அல்ல என்ற எபிரெய வலியுறுத்தலை இயல்பாக வெளிப்படுத்தும் தனி வாக்கியமும் தேர்ந்தெடுக்கப்பட்டுள்ளன.
