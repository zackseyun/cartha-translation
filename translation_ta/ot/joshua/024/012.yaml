- from: நான் உங்களுக்கு முன்னே குளவியை அனுப்பினேன்[a]. அது எமோரியரின் இரண்டு அரசர்களையும் உங்கள் முன்னிலையிலிருந்து துரத்தியது. இது உங்கள் வாளினாலோ உங்கள் வில்லினாலோ நிகழவில்லை.
  to: நான் உங்களுக்கு முன்னே குளவியை அனுப்பினேன்[a]. அது எமோரியரின் இரண்டு அரசர்களையும் உங்கள் முன்னிலையிலிருந்து துரத்தியது. அவர்களைத் துரத்தியது உங்கள் வாளினாலோ உங்கள் வில்லினாலோ அல்ல.
