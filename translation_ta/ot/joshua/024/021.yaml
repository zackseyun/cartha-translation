source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר הָ/עָ֖ם אֶל יְהוֹשֻׁ֑עַ לֹ֕א כִּ֥י אֶת יְהוָ֖ה נַעֲבֹֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/021.yaml
  text: But the people said to Joshua[a], “No, but we will serve Yahweh.”
translation:
  language: ta
  text: ஆனால் மக்கள் யோசுவாவிடம், “இல்லை; மாறாக, நாங்கள் யாவேவுக்கு[a] சேவை செய்வோம்” என்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரேயத்தில்: YHWH (יהוה); “யாவே” என்பது பொதுவாகப் பயன்படுத்தப்படும் ஒலிபெயர்ப்பு.'
    reason: தெய்வீகப் பெயரின் எபிரேய மூலவடிவத்தையும், தமிழில் பயன்படுத்தப்படும் ஒலிபெயர்ப்பையும் தெரிவிக்கிறது.
lexical_decisions:
- source_word: וַיֹּאמֶר הָעָם
  choice: மக்கள் … என்றார்கள்
  rationale: எபிரெய மொழியில் வினை ஒருமையில் இருந்தாலும், கூட்டுப் பெயரான הָעָם தமிழில் இயல்பாகப் பன்மை வினையுடன் வழங்கப்படுகிறது.
- source_word: אֶל יְהוֹשֻׁעַ
  choice: யோசுவாவிடம்
  rationale: பேச்சு யாரை நோக்கிச் சொல்லப்பட்டது என்பதை நவீனத் தமிழில் இயல்பாகக் குறிக்கிறது.
- source_word: לֹא כִּי
  choice: இல்லை; மாறாக
  rationale: யோசுவாவின் முந்தைய கூற்றை உறுதியாக மறுத்து, அதற்கு எதிரான முடிவை அறிவிக்கும் திருத்தும் எதிர்மறைத் தொடர்பை வெளிப்படுத்துகிறது.
- source_word: אֶת יְהוָה
  choice: யாவேவுக்கே
  rationale: உடன்படிக்கையின் தெய்வீகப் பெயரை ஒலிபெயர்த்து, தமிழில் பணிவிடையின் பெறுநரை இயல்பாகக் காட்டுகிறது; ‘-க்கே’ மக்கள் அறிவிக்கும் தனிப்பட்ட பற்றுறுதியின் வலியுறுத்தலை வெளிப்படுத்துகிறது.
- source_word: נַעֲבֹד
  choice: பணிவிடை செய்வோம்
  rationale: עבד என்பதன் அடிப்படை ‘சேவை செய்தல்’ என்ற பொருளையும், இச்சூழலில் உள்ள வழிபாடு மற்றும் உடன்படிக்கைப் பற்றுறுதியையும் மிகையாகச் சுருக்காமல் தக்கவைக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் பொதுப் பட்டப்பெயர் அல்லாமல் நான்கு எழுத்துகளைக் கொண்ட தனிப்பெயர் நேரடியாக உள்ளது. ஆகவே அந்தப் பெயரை ஒலிபெயர்ப்பது மூலத்தின் தனித்தன்மையைப் பாதுகாக்கிறது.
- issue: עבד என்பதன் வழிபாட்டு மற்றும் சேவை சார்ந்த பொருள்
  choice: பணிவிடை செய்வோம்
  alternative: வழிபடுவோம்
  rationale: இங்கு வழிபாடு உட்பட்டிருந்தாலும், வினை உடன்படிக்கைச் சேவை, கீழ்ப்படிதல், பற்றுறுதி ஆகிய விரிவான பொருள்களையும் கொண்டிருக்கலாம்; எனவே அதை வழிபாட்டுக்கு மட்டும் குறுக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியும் அதேவேளையில் கண்ணியமான நேரடி உரைநடை பயன்படுத்தப்பட்டுள்ளது. ‘மாறாக’ என்பது மறுப்புக்குப் பின் வரும் எதிர்மறைத் திருப்பத்தைத் தெளிவாக்குகிறது; ‘பணிவிடை செய்வோம்’ என்பது வழிபாடு மட்டுமல்லாத உடன்படிக்கைச் சேவையின் பரப்பையும் தக்கவைக்கிறது.
