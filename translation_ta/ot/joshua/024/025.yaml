base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/025.yaml
  text: So Joshua made a covenant with the people on that day[b][a], and there in Shechem he set for them a statute and an ordinance.
translation:
  language: ta
  text: அந்நாளில் யோசுவா மக்களுடன் ஓர் உடன்படிக்கை செய்தார்.[a] சீகேமில் அவர்களுக்கு ஒரு சட்டத்தையும் ஒரு நியமத்தையும் ஏற்படுத்தினார்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொற்சொல்லாக, ‘ஓர் உடன்படிக்கையை வெட்டினார்.’
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘அவர்களுக்கு ஒரு சட்டத்தையும் ஒரு தீர்ப்பையும் நிறுவினார்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּכְרֹת
  choice: செய்தார்
  rationale: כרת ברית என்பதன் சொற்சொல் பொருள் ‘உடன்படிக்கையை வெட்டுதல்’ என்றாலும், தமிழில் இயல்பான மரபுத்தொடர் ‘உடன்படிக்கை செய்தார்’ என்பதாகும்; எபிரெய மரபுத்தொடர் அடிக்குறிப்பில் சுட்டப்படுகிறது.
- source_word: בְּרִית
  choice: உடன்படிக்கை
  rationale: இச்சொல் உறவுசார் பிணைப்பையும் கட்டுப்படுத்தும் சட்டத் தன்மையையும் ஒருங்கே தக்கவைக்கிறது.
- source_word: לָעָם
  choice: மக்களுடன்
  rationale: ל என்ற முன்னிடைச்சொல் வடிவில் ‘மக்களுக்கு’ என இருந்தாலும், כרת ברית என்ற மரபுத்தொடரில் மக்கள் உடன்படிக்கையில் பங்கேற்கும் தரப்பினர் என்பதால் தமிழில் ‘மக்களுடன்’ என்பது இயல்பும் பொருத்தமும் உடையது.
- source_word: בַּיּוֹם הַהוּא
  choice: அந்நாளில்
  rationale: காலத்தைக் குறிக்கும் எபிரெய சொற்றொடரைச் சுருக்கமாகவும் இயல்பாகவும் பிரதிபலிக்கிறது.
- source_word: וַיָּשֶׂם
  choice: ஏற்படுத்தினார்
  rationale: שׂים என்பதற்கு ‘வைத்தல்/நிறுவுதல்’ என்ற பரந்த பொருள் உண்டு; சட்டம் மற்றும் நியமம் ஆகியவற்றுடன் ‘ஏற்படுத்தினார்’ என்பது இங்குள்ள சட்டரீதியான செயலைத் தெளிவாகத் தெரிவிக்கிறது.
- source_word: לוֹ
  choice: அவர்களுக்காக
  rationale: வடிவில் ஒருமையாக இருந்தாலும் עָם என்ற கூட்டொருமைச் சொல்லையே சுட்டுகிறது; தமிழில் பொருளுக்கேற்ற பன்மை இயல்பானது.
- source_word: חֹק
  choice: சட்டம்
  rationale: நிர்ணயிக்கப்பட்ட கட்டளை அல்லது நிலையான சட்டவிதி என்ற சட்டரீதியான பொருளை நவீனத் தமிழில் தெளிவாக அளிக்கிறது.
- source_word: וּמִשְׁפָּט
  choice: நியமம்
  rationale: இச்சூழலில் abstract ‘நீதி’ என்பதைவிட சட்டரீதியான தீர்மானம் அல்லது ஒழுங்குவிதி என்பதே பொருத்தம்; ‘சட்டம்’ என்பதுடன் இயல்பான இணையாக அமைகிறது.
- source_word: בִּשְׁכֶם
  choice: அங்கே சீகேமில்
  rationale: இடத்தைக் காத்து, கதையின் நிகழ்விடத்துடன் செயலை இயல்பாக இணைக்க ‘அங்கே’ சேர்க்கப்பட்டுள்ளது.
theological_decisions:
- issue: யோசுவாவின் உடன்படிக்கைச் செயலின் தன்மை
  choice: யோசுவா மக்களுடன் ஓர் உடன்படிக்கை செய்தார்
  alternative: யோசுவா மக்களுக்காக ஓர் உடன்படிக்கையை வெட்டினார் / மக்களின் சார்பாக உடன்படிக்கையைப் புதுப்பித்தார்
  rationale: இந்த வசனம் யோசுவாவையே செய்பவராகக் கூறுகிறது; ஆண்டவரை உடன்படிக்கையின் மற்றொரு தரப்பாக இங்கே வெளிப்படையாக மீண்டும் குறிப்பிடவில்லை. எனவே விரிவான சூழலிலிருந்து பெறக்கூடிய இறையியல் விளக்கத்தை முதன்மை உரையில் சேர்க்காமல், வசனத்தின் மேற்பரப்பு சொல்லாட்சியும் அதிலுள்ள இறையியல் பதற்றமும் காக்கப்படுகின்றன.
- issue: חֹק וּמִשְׁפָּט என்ற சட்டச் சொல் இணை
  choice: ஒரு சட்டத்தையும் ஒரு நியமத்தையும்
  alternative: ஒரு சட்டத்தையும் ஒரு தீர்ப்பையும்
  rationale: מִשְׁפָּט என்பதற்கு ‘தீர்ப்பு’ என்றும் பொருள் இருக்கலாம்; ஆனால் இச்சூழலில் மக்களுக்காக ஏற்படுத்தப்படும் சட்ட ஒழுங்கு என்ற பொருள் பொருத்தமாகத் தெரிகிறது. மாற்று சாத்தியம் அடிக்குறிப்பில் காக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையைப் பயன்படுத்துகிறது. ‘உடன்படிக்கை’ என்ற வேதாகம-சட்டச் சொல் தக்கவைக்கப்பட்டுள்ளது; தெளிவற்ற எபிரெய மரபுத்தொடரும் מִשְׁפָּט என்பதன் மாற்றுப் பொருளும் அடிக்குறிப்புகளில் பாதுகாக்கப்பட்டுள்ளன.
