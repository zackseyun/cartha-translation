base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/022.yaml
  text: Then Joshua said to the people[a], “You are witnesses against yourselves that you have chosen Yahweh for yourselves, to serve him.” And they said, “We are witnesses.”
translation:
  language: ta
  text: அப்போது யோசுவா மக்களிடம், “யாவேவை உங்களுக்காகத் தேர்ந்தெடுத்து, அவருக்குச் சேவை செய்வதற்கு நீங்கள் முடிவு செய்ததற்கு உங்களுக்கு எதிராக நீங்களே சாட்சிகளாய் இருக்கிறீர்கள்” என்றார். அவர்கள், “நாங்களே சாட்சிகள்” என்றார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: அப்போது ... என்றார்
  rationale: வாவ் தொடர்வினை கதையின் அடுத்த நிகழ்வை முன்னெடுப்பதால், இயல்பான தமிழ் கதைநடையில் ‘அப்போது’ என வழங்கப்பட்டது.
- source_word: הָעָם
  choice: மக்கள்
  rationale: இங்கு கூடியிருந்த இஸ்ரவேல் மக்களைக் குறிக்கும் இயல்பான பொதுப்பெயர்.
- source_word: עֵדִים אַתֶּם בָּכֶם
  choice: நீங்களே உங்களுக்கு எதிரான சாட்சிகள்
  rationale: בָּכֶם என்ற சொற்றொடரின் தம்மையே கட்டுப்படுத்தும் சட்ட/உடன்படிக்கைச் சாட்சி என்ற வலிமையைப் பாதுகாக்கிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: כִּי
  choice: என்பதற்கு
  rationale: அவர்கள் எதற்குச் சாட்சிகள் என்பதை அறிமுகப்படுத்தும் உள்ளடக்க இணைப்பாக மொழிபெயர்க்கப்பட்டது.
- source_word: בְּחַרְתֶּם לָכֶם
  choice: உங்களுக்காகத் தேர்ந்தெடுத்து ... முடிவுசெய்திருக்கிறீர்கள்
  rationale: לָכֶם உள்ள தங்களுக்கான தேர்வு என்ற அழுத்தத்தையும், முடிவுற்ற தேர்வின் தற்போதைய பொறுப்பையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைத் திருப்பெயரை ஒரு பட்டப்பெயரால் மாற்றாமல், எபிரேய தனிப்பெயரின் பரவலாக ஏற்றுக்கொள்ளப்பட்ட தமிழ் ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: לַעֲבֹד אֹתוֹ
  choice: அவருக்குச் சேவை செய்ய
  rationale: עבד என்பதன் வழிபாடு, கீழ்ப்படிதல், உடன்படிக்கைப் பற்று ஆகியவற்றை உள்ளடக்கும் பரந்த அடிப்படைப் பொருளை ‘சேவை செய்ய’ பாதுகாக்கிறது.
- source_word: וַיֹּאמְרוּ עֵדִים
  choice: அதற்கு அவர்கள், ‘நாங்கள் சாட்சிகள்’ என்றார்கள்
  rationale: எபிரேயப் பதில் சுருக்கமானது; தமிழில் முழுமையான, இயல்பான வாக்கியமாக இருக்க மறைந்துள்ள ‘நாங்கள்’ சேர்க்கப்பட்டது.
theological_decisions:
- issue: יְהוָה என்ற இறைத் திருப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலத்தில் வரும் உடன்படிக்கைத் தனிப்பெயரை பட்டப்பெயராக மாற்றாமல் பாதுகாக்கிறது; ‘யாவே’ என்பது YHWH-இன் சாத்தியமான உச்சரிப்பை பிரதிபலிக்கும் தமிழ் ஒலிபெயர்ப்பு.
- issue: בָּכֶם என்பதன் சாட்சியத் திசை
  choice: உங்களுக்கு எதிரான சாட்சிகள்
  alternative: உங்களுக்கே சாட்சிகள்
  rationale: உடன்படிக்கைச் சூழலில் அவர்களுடைய சொந்த அறிக்கை பின்னர் அவர்களையே பொறுப்புக்குள்ளாக்கும் சட்டவலிமையை முதன்மை உரை வெளிப்படுத்துகிறது; உண்மையான மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘சாட்சி’, ‘சேவை’ போன்ற உடன்படிக்கை மற்றும் சட்டத் தொனியுள்ள சொற்கள் எளிமைப்படுத்தப்பட்டு பொருள் இழக்காமல் வைக்கப்பட்டுள்ளன.
