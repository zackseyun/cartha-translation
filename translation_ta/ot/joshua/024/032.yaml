base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/032.yaml
  text: And the bones of Joseph[a], which the sons of Israel had brought up from Egypt, they buried at Shechem, in the portion of the field that Jacob had bought from the sons of Hamor, the father of Shechem, for a hundred qesitahs[c][b]; and it became an inheritance for the sons of Joseph.
translation:
  language: ta
  text: இஸ்ரவேலின் மகன்கள் எகிப்திலிருந்து கொண்டுவந்த யோசேப்பின் எலும்புகளைச் சீகேமில், யாக்கோபு சீகேமின் தந்தையான[b] ஹமோரின் மகன்களிடமிருந்து நூறு கெசித்தாக்களுக்கு[c] வாங்கிய வயலின் நிலப்பகுதியில்[a] அடக்கம் செய்தார்கள். அவை[d] யோசேப்பின் மகன்களுக்குச் சுதந்தரமாயின.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘வயலின் ஒரு பங்கு’ அல்லது ‘வயல் நிலத்துண்டு’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘தந்தை’ என்ற சொல் இங்கு விரிவான பொருளில் சீகேமின் முன்னோர் அல்லது நிறுவனர் என்பதையும் குறிக்கக்கூடும்.
    reason: lexical_alternative
  - marker: c
    text: ‘கெசித்தா’ என்பது பண்டைய மதிப்பு அல்லது பண அலகு; அதன் துல்லியமான நவீன மதிப்பு தெரியவில்லை.
    reason: cultural_note
  - marker: d
    text: எபிரெயத்தில் வினை பன்மையில் உள்ளது. ‘அவை’ எதைக் குறிக்கிறது என்பது இலக்கண ரீதியாகத் தெளிவாக இல்லை; ‘அது ... சுதந்தரச் சொத்தாயிற்று’ என்றும் மொழிபெயர்க்கலாம்.
    reason: textual_ambiguity
lexical_decisions:
- source_word: עַצְמוֹת
  choice: எலும்புகள்
  rationale: மூலச் சொல் நேரடியாக ‘எலும்புகள்’ என்று பொருள்படுகிறது; ‘உடல் எச்சங்கள்’ என்பதைவிட இது எபிரெயச் சொல்லின் தெளிவான உருவகத்தைப் பாதுகாக்கிறது.
- source_word: הֶעֱלוּ
  choice: கொண்டுவந்த
  rationale: ஹிபில் வடிவம் ‘மேலே கொண்டுவருதல்’ என்பதைக் குறிக்கிறது. தமிழில் பயணத் திசையைச் செயற்கையாக வலியுறுத்தாமல், முன்பே நிகழ்ந்த செயலை இயல்பாகக் காட்ட ‘கொண்டுவந்த’ என வழங்கப்பட்டுள்ளது.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் மகன்கள்
  rationale: குடும்ப/உடன்படிக்கை சார்ந்த மூல வடிவை வாசிக்கத்தக்க தமிழில் பாதுகாக்கிறது; ‘இஸ்ரவேலர்’ என்பதும் சாத்தியம்.
- source_word: קָבְרוּ
  choice: அடக்கம் செய்தார்கள்
  rationale: மனித எலும்புகளைப் புதைத்த சூழலில் ‘அடக்கம் செய்தார்கள்’ என்பது இயல்பான, கண்ணியமான நவீனத் தமிழ்.
- source_word: בִּשְׁכֶם
  choice: சீகேமில்
  rationale: இடப்பெயருடன் வரும் எபிரெய முன்னிடைச்சொல்லை இயல்பான தமிழ் இடவேற்றுமையால் வழங்குகிறது.
- source_word: בְּחֶלְקַת הַשָּׂדֶה
  choice: வயலின் நிலப்பகுதியில்
  rationale: חֶלְקָה என்பது பிரிக்கப்பட்ட நிலத் துண்டு அல்லது பங்கு; ‘நிலப்பகுதி’ அந்தப் பொருளை தெளிவாகத் தருகிறது.
- source_word: קָנָה
  choice: வாங்கிய
  rationale: விலைகொடுத்து பெற்ற சூழலில் ‘வாங்கிய’ என்பது ‘பெற்றுக்கொண்ட’ என்பதைவிடத் துல்லியமானது.
- source_word: בְּנֵי חֲמוֹר
  choice: ஹமோரின் மகன்கள்
  rationale: மூலத்தின் நேரடியான உறவுமுறையைப் பாதுகாக்கிறது; ‘வழித்தோன்றல்கள்’ என்பது தேவையற்ற விளக்க விரிவாக்கமாக இருக்கும்.
- source_word: אֲבִי שְׁכֶם
  choice: சீகேமின் தந்தையான
  rationale: אָב என்ற சொல்லின் முதன்மையான பொருளான ‘தந்தை’ பிரதான உரையில் வைக்கப்பட்டுள்ளது; விரிவான முன்னோர்/நிறுவனர் பொருள் அடிக்குறிப்பில் குறிப்பிடப்படுகிறது.
- source_word: בְּמֵאָה קְשִׂיטָה
  choice: நூறு கெசித்தாக்களுக்கு
  rationale: קְשִׂיטָה என்பதன் துல்லியமான நவீன மதிப்பு தெரியாததால் ஊகமான பணமாற்று மதிப்பைத் தவிர்த்து ஒலிபெயர்ப்பு பயன்படுத்தப்பட்டுள்ளது.
- source_word: לְנַחֲלָה
  choice: சுதந்தரச் சொத்து
  rationale: נַחֲלָה என்பது தலைமுறை வழியாக உரிமையாக்கப்படும் பங்கு அல்லது சொத்தைக் குறிக்கிறது; ‘சுதந்தரச் சொத்து’ இங்கு தெளிவான நவீனத் தமிழ்.
theological_decisions:
- issue: בְנֵי יִשְׂרָאֵל என்ற உடன்படிக்கைச் சார்ந்த உறவுமுறை
  choice: இஸ்ரவேலின் மகன்கள்
  alternative: இஸ்ரவேலர்
  rationale: இனப்பெயராக மட்டும் மாற்றாமல், மூலத்தில் உள்ள குடும்ப அடையாளத்தை வாசிக்கத்தக்க வகையில் பாதுகாக்கிறது.
- issue: וַיִּהְיוּ என்ற பன்மை வினையின் சுட்டுப்பொருள்
  choice: அது யோசேப்பின் மகன்களுக்குச் சுதந்தரச் சொத்தாயிற்று
  alternative: அவை யோசேப்பின் மகன்களுக்குச் சுதந்தரமாயின
  rationale: சூழலில் வாங்கப்பட்ட நிலப்பகுதியே சுதந்தரச் சொத்தானது என்பது இயல்பான புரிதல். இருப்பினும் எபிரெய வினை பன்மையில் இருப்பதால் அது ‘எலும்புகள்’ அல்லது முந்தைய பன்மைக் கருத்தைச் சுட்டலாம்; இந்த இலக்கணத் தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
- issue: கெசித்தா என்ற பண்டைய மதிப்பு அலகு
  choice: கெசித்தா என ஒலிபெயர்த்தல்
  alternative: ஒரு பணத்துண்டு எனப் பொதுமைப்படுத்தல்
  rationale: துல்லியமற்ற நவீன நாணய மதிப்பைத் திணிக்காமல் மூலத்தின் வரலாற்றுத் தன்மையையும் அறியாமையின் எல்லையையும் வெளிப்படையாக வைத்திருக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. நீண்ட எபிரெய வாக்கியம் இரண்டு தமிழ் வாக்கியங்களாகப் பிரிக்கப்பட்டு, அடக்கச் செயல் இரண்டாவது வாக்கியத்தில் மீண்டும் சொல்லப்பட்டுள்ளது. பெயர்கள் மூல எபிரெய ஒலிக்கு அண்மையாக ‘சீகேம்’, ‘ஹமோர்’, ‘கெசித்தா’ என வழங்கப்பட்டுள்ளன.
