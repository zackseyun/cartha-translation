base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/014.yaml
  text: Now fear Yahweh and serve him with integrity and faithfulness[a], and put away the gods that your fathers served beyond the River and in Egypt[b], and serve Yahweh.
translation:
  language: ta
  text: “இப்போது, யெகோவாவுக்குப் பயந்து, முழு மனதோடும் உண்மையோடும் அவருக்குச் சேவை செய்யுங்கள்.[a] ஆற்றுக்கு அப்பாலும்[b] எகிப்திலும் உங்கள் முன்னோர்கள் சேவித்த தெய்வங்களை அகற்றிவிட்டு, யெகோவாவுக்குச் சேவை செய்யுங்கள்.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “முழு மனதோடும் உண்மையோடும்” என்பதற்கான எபிரெயச் சொற்கள் முழுமை, நேர்மை, உண்மை, நம்பகத்தன்மை ஆகிய கருத்துகளைக் கொண்டுள்ளன.
    reason: lexical_alternative
  - marker: b
    text: “ஆறு” என்பது ஐப்பிராத்து ஆற்றைக் குறிக்கிறது.
    reason: cultural_note
lexical_decisions:
- source_word: וְעַתָּה
  choice: ஆகவே இப்போது
  rationale: முந்தைய வரலாற்றுரையிலிருந்து யோசுவாவின் அறிவுறுத்தலுக்குச் செல்லும் முடிவுறு உரையாடல் இணைப்பை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: יְרָאוּ
  choice: பயந்து
  rationale: தேவனைப் பற்றிய உடன்படிக்கை சார்ந்த பயபக்தியையும் அதன் வலிமையையும் மென்மையாக்காமல் காக்கிறது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: நான்கு எழுத்துகளாலான உடன்படிக்கைப் பெயரை பொதுவாக அறியப்படும் தமிழ்ப் பெயர்ப்பில் நேரடியாக வழங்குகிறது.
- source_word: וְעִבְדוּ אֹתוֹ
  choice: அவருக்குச் சேவை செய்யுங்கள்
  rationale: עבד என்பதிலுள்ள வழிபாடு, விசுவாசம், கீழ்ப்படிதல் ஆகியவற்றை உள்ளடக்கும் பரந்த சேவைப் பொருளைக் காக்கிறது.
- source_word: בְּתָמִים
  choice: முழு மனதோடு
  rationale: பாவமற்ற நிறைவைக் குறிக்காமல், பிளவுபடாத முழுமையான அர்ப்பணிப்பைக் காட்டும் இயல்பான தமிழ்.
- source_word: וּבֶאֱמֶת
  choice: உண்மையோடு
  rationale: אמת என்பதன் உண்மை, நேர்மை, நம்பகத்தன்மை ஆகிய பொருள் விரிவைத் திறந்தவாறு வைத்திருக்கிறது.
- source_word: וְהָסִירוּ
  choice: அகற்றிவிட்டு
  rationale: போட்டித் தெய்வங்களைத் தங்களிடமிருந்து நீக்கிவிட வேண்டும் என்ற கட்டளையைத் தெளிவாகச் சொல்கிறது.
- source_word: אֱלֹהִים
  choice: தெய்வங்கள்
  rationale: எபிரெயத்தில் இல்லாத ‘அந்நிய’ என்ற விளக்கப்பெயரைச் சேர்க்காமல் உள்ளது.
- source_word: אֲבוֹתֵיכֶם
  choice: உங்கள் முன்னோர்கள்
  rationale: இங்கு முந்தைய தலைமுறைகளை இயல்பான நவீன தமிழில் குறிக்கிறது; சொற்படி ‘தந்தைகள்’ என்பது தமிழில் உடனடி தந்தையரை மட்டும் குறிக்கும் தவறான எண்ணத்தை ஏற்படுத்தலாம்.
- source_word: בְּעֵבֶר הַנָּהָר
  choice: ஆற்றுக்கு அப்பால்
  rationale: புவியியல் மரபுத்தொடரை நேரடியாகக் காத்து, எந்த ஆறு என்பதை அடிக்குறிப்பில் விளக்குகிறது.
- source_word: וּבְמִצְרַיִם
  choice: எகிப்தில்
  rationale: இடப்பொருளை நேரடியாக வழங்குகிறது.
- source_word: וְעִבְדוּ אֶת יְהוָה
  choice: யெகோவாவுக்குச் சேவை செய்யுங்கள்
  rationale: தொடக்கக் கட்டளையை மீண்டும் கூறும் வலியுறுத்தலைக் காக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற உடன்படிக்கைப் பெயரை வழங்குதல்
  choice: யெகோவா
  alternative: கர்த்தர் / யாஹ்வே
  rationale: பொதுப்பட்டத்தை மாற்றாக இடாமல் தேவனுடைய தனிப்பெயரைப் பிரதிபலிக்கிறது; தமிழ் வாசகர்களிடையே பரவலாக அறியப்படும் வடிவம் தேர்ந்தெடுக்கப்பட்டது.
- issue: தேவனுக்குப் ‘பயப்படுதல்’ என்பதை மென்மையாக்கலாமா
  choice: யெகோவாவுக்குப் பயந்து
  alternative: யெகோவாவிடம் பயபக்தி கொண்டு
  rationale: மூல வினையின் நேரடி வலிமையையும், பயமும் மரியாதையும் இணைந்துள்ள வேதாகம இறையியல் இழுபறியையும் காக்கிறது.
- issue: בְּתָמִים וּבֶאֱמֶת என்ற இணைப்பின் பொருள்
  choice: முழு மனதோடும் உண்மையோடும்
  alternative: உத்தமத்தோடும் உண்மைத்தன்மையோடும்
  rationale: பிளவுபடாத அர்ப்பணிப்பையும் நேர்மை/நம்பகத்தன்மையையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது; ‘குற்றமற்றவர்களாக’ என்று பாவமின்மையைத் தவறாகக் குறிக்கவில்லை.
- issue: אֲבוֹתֵיכֶם என்பதன் பாலின வடிவம்
  choice: உங்கள் முன்னோர்கள்
  alternative: உங்கள் தந்தைகள்
  rationale: வரலாற்றுக்கு முந்தைய தலைமுறைகளே சூழலிலுள்ள குறிப்பு. தமிழில் ‘தந்தைகள்’ உடனடி ஆண் பெற்றோர்களைச் சுட்டும் வாய்ப்புள்ளதால், மூலத்தின் வரலாற்றுக் குறிப்பைத் துல்லியமாகத் தெரிவிக்க ‘முன்னோர்கள்’ இயல்பானது.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதைமிக்க பன்மைக் கட்டளை வடிவம் பயன்படுத்தப்பட்டுள்ளது. கவித்துவமான அல்லது பழமையான சொற்களைத் தவிர்த்து, உடன்படிக்கைச் சூழலின் கண்ணியமும் கட்டளையின் வலிமையும் காக்கப்பட்டுள்ளன. அடிக்குறிப்பு குறிகள் விளக்கும் சொற்றொடர்களுக்குப் பிறகு பொருத்தப்பட்டுள்ளன.
