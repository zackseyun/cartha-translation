  to: “இப்போது, யெகோவாவுக்குப் பயந்து, முழு மனதோடும் உண்மையோடும் அவருக்குச் சேவை செய்யுங்கள்.[a] ஆற்றுக்கு அப்பாலும்[b] எகிப்திலும் உங்கள் முன்னோர்கள் சேவித்த தெய்வங்களை அகற்றிவிட்டு, யெகோவாவுக்குச் சேவை செய்யுங்கள்.”
