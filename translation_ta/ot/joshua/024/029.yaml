language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יְהִ֗י אַֽחֲרֵי֙ הַ/דְּבָרִ֣ים הָ/אֵ֔לֶּה וַ/יָּ֛מָת יְהוֹשֻׁ֥עַ בִּן נ֖וּן עֶ֣בֶד יְהוָ֑ה בֶּן מֵאָ֥ה וָ/עֶ֖שֶׂר שָׁנִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/029.yaml
  text: And it happened after these things that Joshua son of Nun[a], the servant of Yahweh, died[b], being one hundred and ten years old.
translation:
  language: ta
  text: 'இவற்றுக்குப் பிறகு[a] நிகழ்ந்ததாவது: யாவேவின் ஊழியரான[b] நூனின் மகன் யோசுவா, நூற்றுப் பத்து வயதில் இறந்தார்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இந்த நிகழ்வுகளுக்குப் பிறகு.”
    reason: lexical_alternative
  - marker: b
    text: “ஊழியர்” என்பதற்கான எபிரேயச் சொல் “அடிமை” என்றும் பொருள்படலாம்; இங்கு அது மதிப்புக்குரிய சேவையைக் குறிக்கும் பட்டமாகப் பயன்படுத்தப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: நிகழ்ந்ததாவது
  rationale: தொடர்ந்து வரும் புதிய நிகழ்வை அறிமுகப்படுத்தும் எபிரேயக் கதைநடை வடிவத்தை, பழமையான சொல்லாட்சியின்றி இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: אַחֲרֵי הַדְּבָרִים הָאֵלֶּה
  choice: இவற்றுக்குப் பிறகு
  rationale: דְּבָרִים இங்கு முன்பு கூறப்பட்ட காரியங்கள் அல்லது நிகழ்வுகளைக் குறிக்கிறது; சுருக்கமான இத்தமிழாக்கம் காலத் தொடர்பை இயல்பாகக் காட்டுகிறது.
- source_word: יְהוֹשֻׁעַ בִּן נוּן
  choice: நூனின் மகன் யோசுவா
  rationale: தனிப்பெயர்களைத் தமிழில் வழக்கமான வடிவில் ஒலிபெயர்த்து, בִּן எனும் வம்சத் தொடர்பை இயல்பான தமிழ் உடைமைத் தொடரால் காட்டுகிறது.
- source_word: עֶבֶד יְהוָה
  choice: யாவேவின் ஊழியர்
  rationale: עֶבֶד என்பதற்கு ‘அடிமை’ என்ற பொருளும் இருக்கலாம்; ஆனால் இங்கு யோசுவாவின் மதிப்புக்குரிய உடன்படிக்கைப் பணியைச் சுட்டும் பட்டமாக இருப்பதால் ‘ஊழியர்’ பொருத்தமானது.
- source_word: וַיָּמָת
  choice: இறந்தார்
  rationale: מות என்பதன் நேரடியான பொருளை மென்மையாக்காமல் தெரிவிக்கிறது; யோசுவாவுக்குரிய மரியாதைப் பன்மை வினைமுற்றும் பயன்படுத்தப்பட்டுள்ளது.
- source_word: בֶּן מֵאָה וָעֶשֶׂר שָׁנִים
  choice: நூற்றுப் பத்து வயதில்
  rationale: சொல்லுக்குச் சொல் ‘நூற்றுப் பத்து ஆண்டுகளின் மகன்’ என்ற எபிரேய வயது மரபுத்தொடரின் பொருளை இயல்பான நவீன தமிழில் தருகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் பட்டப்பெயர் அல்ல, நான்கு எழுத்துகளைக் கொண்ட இறைவனின் தனிப்பெயர் நேரடியாக உள்ளது; ஆகவே அதைத் தமிழில் ‘யாவே’ என்று ஒலிபெயர்ப்பது மூல வேறுபாட்டைப் பாதுகாக்கிறது.
- issue: עֶבֶד என்பதன் சூழல்சார் பொருள்
  choice: ஊழியர்
  alternative: அடிமை
  rationale: சொல் இரு பொருள்களையும் ஏற்கக்கூடியதாயினும், இங்கு யோசுவாவின் யாவேவுக்கான மதிப்புக்குரிய சேவையைச் சுட்டும் பட்டமாக வருகிறது; சமூக அடிமை நிலையைக் குறிப்பாக வலியுறுத்தவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘நிகழ்ந்ததாவது’ என்பது וַיְהִי என்பதன் கதைநடைச் செயல்பாட்டைத் தக்கவைக்கிறது; பெயர்களும் இறைப் பெயரும் ஒலிபெயர்க்கப்பட்டுள்ளன.
