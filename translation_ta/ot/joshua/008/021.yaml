base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/021.yaml
  text: When Joshua and all Israel saw that the ambush had captured the city and that the smoke of the city had gone up[a], they turned back and struck down the men of Ai.
translation:
  language: ta
  text: யோசுவாவும் இஸ்ரயேலர் அனைவரும் பதுங்கிப் படையினர் நகரைக் கைப்பற்றியதையும் நகரத்தின் புகை மேலெழுந்ததையும் கண்டபோது, அவர்கள் திரும்பி ஆயி நகரத்து ஆண்களை வீழ்த்தினார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רָאוּ
  choice: கண்டபோது
  rationale: கண்ணால் கண்டதை முதன்மையாகக் குறிக்கும் பொதுவான வினை; இங்கு தொடர்ந்து வரும் இரு நிகழ்வுகளும் அவர்கள் கண்டவற்றின் உள்ளடக்கத்தை விளக்குகின்றன.
- source_word: כִּי ... וְכִי
  choice: …யதையும் …யதையும்
  rationale: யோசுவாவும் இஸ்ரயேலரும் கண்ட இரு நிகழ்வுகளைத் தமிழில் இயல்பாக இணைக்கிறது.
- source_word: לָכַד
  choice: கைப்பற்றிய
  rationale: நகரைக் கைப்பற்றுதல் அல்லது பிடித்தல் என்ற இராணுவச் சூழலுக்குரிய பொருளைத் தெளிவாகத் தருகிறது; கண்ட நேரத்துக்கு முன் நிகழ்ந்த செயலும் சூழலில் வெளிப்படுகிறது.
- source_word: הָאֹרֵב
  choice: பதுங்கியிருந்தவர்கள்
  rationale: பதுங்கித் தாக்குவதற்காகக் காத்திருந்த குழுவைக் குறிக்கும் எபிரெயப் பெயரெச்ச வடிவத்தை மனிதர்களைக் குறிக்கும் இயல்பான தமிழில் தருகிறது.
- source_word: עָלָה עֲשַׁן הָעִיר
  choice: நகரத்திலிருந்து புகை மேலெழுந்தது
  rationale: புகை மேலே சென்றது என்ற எபிரெய உருவகத்தையும், நகரமே புகையின் மூலமென்பதையும் இயல்பான தமிழில் காக்கிறது.
- source_word: וַיָּשֻׁבוּ
  choice: திரும்பி
  rationale: போரில் திசைமாறி மீண்டும் எதிரியைத் தாக்கச் சென்றதைக் குறுகிய, இயல்பான முறையில் தெரிவிக்கிறது.
- source_word: וַיַּכּוּ
  choice: வீழ்த்தினார்கள்
  rationale: נכה என்பதன் வலுவான போர்ச் சூழல் பொருளைக் காக்கிறது; உடனடி சொல்லாட்சியைத் தாண்டி ‘கொன்றார்கள்’ என்று மிகத் துல்லியப்படுத்துவதைத் தவிர்க்கிறது.
- source_word: אַנְשֵׁי הָעָי
  choice: ஆயி நகரத்து ஆண்கள்
  rationale: ‘ஆயியின் ஆண்கள்’ என்ற பாலினம் குறிக்கப்பட்ட எபிரெயச் சொல்லை நடப்பு தமிழில் இயல்பாகவும் துல்லியமாகவும் தருகிறது; ‘மக்கள்’ என்று பொதுமைப்படுத்தவில்லை.
