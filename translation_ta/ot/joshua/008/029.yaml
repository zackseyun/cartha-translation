base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/029.yaml
  text: And he hanged the king of Ai on a tree until evening[a]. And at sunset Joshua commanded, and they took his corpse down from the tree and threw it at the entrance of the city gate[b], and they raised over him a large heap of stones that remains to this day.
translation:
  language: ta
  text: யோசுவா ஆயியின் அரசனை அந்த மரத்தில் மாலை நேரம் வரை தொங்கவைத்தான்.[a] சூரியன் மறையும் வேளையில்[b] யோசுவா கட்டளையிட்டான்; அவர்கள் அவனுடைய பிணத்தை மரத்திலிருந்து இறக்கி, நகர வாசலின் நுழைவிடத்தில் எறிந்தார்கள். அவன்மேல் ஒரு பெரிய கற்குவியலை எழுப்பினார்கள்; அது இந்நாள்வரை நிலைத்திருக்கிறது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தொங்கவிட்டான்.” எபிரெயச் சொல் தொங்கவிடுதல் அல்லது தொங்கவைத்தல் என்று பொருள்படும்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “சூரியன் மறைந்தபோது.”
    reason: lexical_alternative
lexical_decisions:
- source_word: תָּלָה
  choice: தொங்கவைத்தான்
  rationale: எபிரெய வினைச்சொல் தொங்கவிடுதல் அல்லது தொங்கவைத்தல் என்பதைக் குறிக்கிறது; மரண முறை தூக்கிலிடுதலா அல்லது கொன்றபின் தொங்கவிடுதலா என்பதைத் தேவையின்றி முடிவுசெய்யாமல் இந்தத் தேர்வு மூலத்தின் பரப்பை காக்கிறது.
- source_word: הָעֵץ
  choice: ஒரு மரத்தில்
  rationale: עֵץ என்பதன் இயல்பான பொருள் ‘மரம்’; இங்கு குறிப்பிட்ட மரக் கட்டமைப்பை ஊகிக்காமல், தமிழில் இயல்பாக ‘ஒரு மரத்தில்’ என வழங்கப்பட்டுள்ளது.
- source_word: עַד עֵת הָעָרֶב
  choice: மாலை நேரம்வரை
  rationale: ‘மாலையின் நேரம்வரை’ என்ற மூல வடிவத்தை இயல்பான நவீன தமிழில் நெருக்கமாக வெளிப்படுத்துகிறது.
- source_word: וּכְבֹא הַשֶּׁמֶשׁ
  choice: சூரியன் மறையும் வேளையில்
  rationale: சூரியன் அஸ்தமிப்பதைக் குறிக்கும் எபிரெய மரபுத்தொடரைத் தெளிவான நவீன தமிழில் தருகிறது.
- source_word: נִבְלָתוֹ
  choice: அவனுடைய பிணத்தை
  rationale: இச்சொல் இறந்த உடலைக் குறிக்கிறது; ‘உடல்’ என்பதைவிட ‘பிணம்’ மூலத்தின் நேரடியான கடுமையைப் பாதுகாக்கிறது.
- source_word: וַיַּשְׁלִיכוּ אֹתָהּ
  choice: எறிந்தார்கள்
  rationale: வினையின் வலிமையை இயல்பான தமிழில் காக்கிறது; தமிழில் பிணத்தைச் சுட்டும் தனிப் பாலினப் பிரதிப்பெயர் தேவையில்லை.
- source_word: פֶּתַח שַׁעַר הָעִיר
  choice: நகர வாசலின் நுழைவிடத்தில்
  rationale: פֶּתַח என்பதன் ‘நுழைவிடம்/திறப்பு’ என்ற பொருளையும் שַׁעַר என்பதன் ‘வாசல்’ என்ற பொருளையும் தெளிவாகப் பாதுகாக்கிறது.
- source_word: גַּל אֲבָנִים גָּדוֹל
  choice: ஒரு பெரிய கற்குவியலை
  rationale: கற்களால் ஆன பெரிய குவியல் என்ற பொருளைச் சுருக்கமாகவும் பொதுவாசகர்களுக்கு எளிதாகவும் தருகிறது.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: இந்நாள்வரை
  rationale: கதைசொல்லியின் காலம்வரை நினைவுச்சின்னம் நிலைத்திருந்ததைச் சுட்டும் வழக்கமான எபிரெய தொடருக்கு இயல்பான தமிழ் இணை.
theological_decisions:
- issue: தொடக்க வாக்கியத்தின் மறைமுக எழுவாய்
  choice: யோசுவா என்று வெளிப்படையாக வழங்கப்பட்டது
  alternative: ‘அவன்’ என்று மறைமுக எழுவாயைத் தொடர்வது அல்லது ‘அவர்கள்’ என்று பன்மையில் வழங்குவது
  rationale: எபிரெயத்தில் வினை மூன்றாம் நபர் ஆண்பால் ஒருமையில் உள்ளது; உடனடி சூழலும் அடுத்த துணைவாக்கியத்தில் யோசுவா பெயரிடப்படுவதும் யோசுவாவையே இயல்பான எழுவாயாகக் காட்டுகின்றன. இது கதைநடை சார்ந்த முடிவு; கோட்பாட்டுச் சேர்க்கை அல்ல.
- issue: அரசன் கொல்லப்பட்ட விதம்
  choice: ‘தொங்கவைத்தான்’ என்று முறையைத் திறந்தவாறு வைத்தல்
  alternative: ‘தூக்கிலிட்டான்’ அல்லது ‘கழுவேற்றினான்’ என்று குறிப்பிட்ட மரண முறையைத் தீர்மானித்தல்
  rationale: תָּלָה என்பது தொங்கவைத்தலைக் குறிக்கிறது; கழுவேற்றுதல் என்பதைத் தெளிவாகச் சொல்லாது. ‘பிணம்’ என்ற பின்வரும் சொல் அவன் இறந்திருந்ததைத் தெரிவிக்கிறது, ஆனால் மரணம் நிகழ்ந்த துல்லிய முறையைத் தீர்மானிக்காது.
translation_notes:
  register: நவீன தரத் தமிழில், எளிதில் புரியும் அதேவேளையில் கண்ணியமான வரலாற்றுக் கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘பிணம்’, ‘எறிந்தார்கள்’ ஆகிய சொற்கள் மூலத்தின் கடுமையை மென்மைப்படுத்தாமல் காக்கின்றன; ‘கற்குவியல்’ பொதுவாசகர்களுக்கு தெளிவான சொலாகத் தேர்ந்தெடுக்கப்பட்டது.
