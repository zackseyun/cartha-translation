source:
  edition: WLC
  text: אָ֣ז יִבְנֶ֤ה יְהוֹשֻׁ֨עַ֙ מִזְבֵּ֔חַ לַֽ/יהוָ֖ה אֱלֹהֵ֣י יִשְׂרָאֵ֑ל בְּ/הַ֖ר עֵיבָֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/030.yaml
  text: Then Joshua built an altar to Yahweh[a], the God of Israel, on Mount Ebal.
translation:
  language: ta
  text: அப்போது யோசுவா ஏபால் மலையில் இஸ்ரவேலின் கடவுளாகிய யாவேக்கு ஒரு பலிபீடத்தைக் கட்டினார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אָז
  choice: அப்போது
  rationale: அடுத்த நிகழ்வைக் குறிக்கும் கால வினையடை; எபிரெயக் கதைநடையின் தொடர்ச்சியை இயல்பான நவீன தமிழில் காட்டுகிறது.
- source_word: יִבְנֶה
  choice: கட்டினார்
  rationale: வடிவத்தில் நிறைவுறா வினையாக இருந்தாலும், אָז என்பதற்குப் பின் கதைநடையில் கடந்தகாலத்தில் நிகழ்ந்த செயலைக் குறிக்கிறது; தமிழ் இறந்தகாலம் இதைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: יְהוֹשֻׁעַ
  choice: யோசுவா
  rationale: பெயரின் வழக்கமான தமிழ் ஒலிபெயர்ப்பு.
- source_word: מִזְבֵּחַ
  choice: ஒரு பலிபீடத்தை
  rationale: பலியிடுவதற்கான பீடத்தைக் குறிக்கிறது; இச்சூழலில் முதன்முறையாக அறிமுகப்படுத்தப்படுவதால் ‘ஒரு’ இயல்பாக உள்ளது.
- source_word: לַיהוָה
  choice: யாவேக்கு
  rationale: לְ முன்னொட்டு அர்ப்பணிப்பு அல்லது நோக்கத்தைக் குறிக்கிறது; கடவுளின் தனிப்பெயரான יהוה ஒலிப்புக்கு நெருக்கமாக ‘யாவே’ என வழங்கப்படுகிறது.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் கடவுளாகிய
  rationale: யாவே யார் என்பதை அடையாளப்படுத்தும் எபிரெயக் கட்டிணைப்பை இயல்பான தமிழ் அடைமொழித் தொடராகப் பாதுகாக்கிறது.
- source_word: בְּהַר עֵיבָל
  choice: ஏபால் மலையில்
  rationale: ஏபால் எனப்படும் மலையின் மேல் அல்லது அதன் மலைப்பகுதியில் நிகழ்ந்த இடத்தை இயல்பான தமிழில் குறிக்கிறது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூல உரை இறைவனின் தனிப்பெயரை நேரடியாகப் பயன்படுத்துகிறது. பொதுப்பட்டப் பெயரால் மாற்றாமல் அந்த உடன்படிக்கைப் பெயரைத் தமிழில் ஒலிபெயர்ப்பது மூலத்தின் வேறுபாட்டைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழ்; பொதுவாசகர்களுக்குப் புரியும் இயல்பான, கண்ணியமான நடை. எபிரெய மூலத்தின் நிகழ்வுவரிசையும் ‘இஸ்ரவேலின் கடவுள்’ என்ற அடையாளப்படுத்தலும் பாதுகாக்கப்பட்டுள்ளன.
