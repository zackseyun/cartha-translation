source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֤ה אֶל יְהוֹשֻׁ֨עַ֙ אַל תִּירָ֣א וְ/אַל תֵּחָ֔ת קַ֣ח עִמְּ/ךָ֗ אֵ֚ת כָּל עַ֣ם הַ/מִּלְחָמָ֔ה וְ/ק֖וּם עֲלֵ֣ה הָ/עָ֑י רְאֵ֣ה נָתַ֣תִּי בְ/יָדְ/ךָ֗ אֶת מֶ֤לֶךְ הָ/עַי֙ וְ/אֶת עַמּ֔/וֹ וְ/אֶת עִיר֖/וֹ וְ/אֶת אַרְצֽ/וֹ־־־־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/001.yaml
  text: Then Yahweh said to Joshua[a], “Do not fear and do not be dismayed. Take with you all the fighting men, and arise, go up to Ai. See, I have given into your hand the king of Ai, his people, his city, and his land.”
translation:
  language: ta
  text: அப்போது யாவே யோசுவாவிடம், “அஞ்சாதே; கலங்காதே. போர்வீரர்கள் அனைவரையும்[a] உன்னுடன் அழைத்துக்கொண்டு எழுந்து, ஆயிக்குப் போ. பார், ஆயியின் அரசனையும் அவனுடைய மக்களையும் அவனுடைய நகரத்தையும் அவனுடைய நாட்டையும் உன் கையில் ஒப்புக்கொடுத்துவிட்டேன்” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'சொல்லுக்குச் சொல்: “போரின் மக்கள் அனைவரும்”; இது போரிடும் படையினரைக் குறிக்கிறது. “படையினர் அனைவரையும்” என்றும் மொழிபெயர்க்கலாம்.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைப்பெயரான நான்கு எழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், அதன் பொதுவாக ஏற்றுக்கொள்ளப்பட்ட ஒலிபெயர்ப்பைத் தமிழில் தருகிறது.
- source_word: אַל תִּירָא וְאַל תֵּחָת
  choice: அஞ்சாதே; கலங்காதே
  rationale: இரண்டு தனித்தடை வினைகளையும் இயல்பான, கண்ணியமான நவீன தமிழில் தக்கவைக்கிறது; இரண்டாவது வினை மனம் உடைந்து திகைப்பதன் வலிமையைச் சுட்டுகிறது.
- source_word: כָּל עַם הַמִּלְחָמָה
  choice: போர்வீரர்கள் அனைவரையும்
  rationale: சொல்லுக்குச் சொல் ‘போரின் மக்கள் அனைவரும்’ என்ற எபிரேயத் தொடரை, இச்சூழலில் போரிடும் படையினரைச் சுட்டும் இயல்பான தமிழில் வழங்குகிறது.
- source_word: וְקוּם עֲלֵה
  choice: எழுந்து, ஆயிக்குப் போ
  rationale: ‘எழு’ மற்றும் ‘மேலே போ/புறப்பட்டுப் போ’ என்னும் இரு கட்டளைகளின் தொடரையும் தமிழில் தெளிவாகத் தக்கவைக்கிறது.
- source_word: רְאֵה
  choice: பார்
  rationale: வரவிருக்கும் உறுதியான வெற்றியின்மீது யோசுவாவின் கவனத்தைத் திருப்பும் நேரடிக் கட்டளையாக உள்ளது.
- source_word: נָתַתִּי בְיָדְךָ
  choice: உன் கையில் ஒப்புக்கொடுத்துவிட்டேன்
  rationale: எபிரேய நிறைவுவினை வெளிப்படுத்தும் தெய்வீக உறுதியையும், அதிகாரத்திற்குள் ஒப்படைத்தல் என்ற ‘கையில்’ என்னும் உருவகத்தையும் பாதுகாக்கிறது.
- source_word: הָעָי
  choice: ஆய்
  rationale: இடப்பெயரைத் தமிழில் ஒலிபெயர்க்கிறது; வேற்றுமை உருபுடன் ‘ஆயிக்கு’ என வருகிறது.
- source_word: אַרְצוֹ
  choice: அவனுடைய நாடு
  rationale: அரசனுக்குரிய நிலப்பரப்பு அல்லது ஆட்சிப்பகுதியைக் குறிக்கும் சொல்லை ‘நாடு’ எனச் சுருக்கமாக வழங்குகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் பட்டம் அல்ல, தனிப்பட்ட இறைப்பெயர் நேரடியாக உள்ளது; ஆகவே அதை ஒரு பட்டத்தால் மாற்றாமல் ஒலிபெயர்க்கிறது.
- issue: נָתַתִּי என்ற நிறைவுவினையின் காலமும் தெய்வீக உறுதியும்
  choice: ஒப்புக்கொடுத்துவிட்டேன்
  alternative: ஒப்புக்கொடுப்பேன்
  rationale: வெற்றி இன்னும் நிகழ்வில் நிறைவேறாதிருந்தாலும், இறைவனுடைய அறிவிப்பில் அது உறுதியாக முடிந்த செயலைப்போல் கூறப்படும் மூலமொழியின் பதற்றத்தைத் தக்கவைக்கிறது.
- issue: כָּל עַם הַמִּלְחָמָה என்ற படைத்துறைத் தொடரின் வரம்பு
  choice: போர்வீரர்கள் அனைவரும்
  alternative: படையினர் அனைவரும்
  rationale: இது எல்லா குடிமக்களையும் அல்ல, போரில் ஈடுபடும் அணியைக் குறிக்கிறது. எபிரேயத்தில் ஆண் பாலைக் குறிக்கும் தனிப்பட்ட பெயர்ச்சொல் இங்கு இல்லாததால் தமிழில் தேவையின்றி ‘ஆண்கள்’ என்று சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், நேரடியான தெய்வீக உரைக்கேற்ற கண்ணியமான நடையுடன் மொழிபெயர்க்கப்பட்டது. ‘அஞ்சாதே; கலங்காதே’ என்ற இணைப்பு மூலத்தின் இரட்டைத் தடையைப் பாதுகாக்கிறது. அடிக்குறி குறியீடு அது விளக்கும் படைத்துறைத் தொடருக்குப் பின்னர் வைக்கப்பட்டுள்ளது.
