base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/011.yaml
  text: And all the fighting people who were with him went up and approached[a], and they came before the city and camped north of Ai, with the valley between him and Ai.
translation:
  language: ta
  text: அவனுடன் இருந்த போர்வீரர்கள் அனைவரும் மேலே சென்று நெருங்கி, நகருக்கு எதிரே வந்து, ஆயிக்கு வடக்கே முகாமிட்டார்கள்; அவனுக்கும்[a] ஆயிக்கும் இடையில் பள்ளத்தாக்கு இருந்தது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய உரையில் இங்கு ஒருமைப் பிரதிப்பெயர் உள்ளது. அது பெரும்பாலும் யோசுவாவைக் குறிக்கிறது; எனினும், ‘அவர்களுக்கும் ஆயிக்கும் இடையில்’ என்ற கூட்டுப்பொருளில் இதைப் புரிந்துகொள்வோரும் உள்ளனர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָל הָעָם הַמִּלְחָמָה
  choice: போரிடும் மக்கள் அனைவரும்
  rationale: எபிரெயச் சொற்றொடர் சொற்படியாக ‘போருக்குரிய மக்கள் அனைவரும்’ எனப் பொருள்பட்டு, குடிமக்கள் முழுவதையும் அல்லாமல் போரில் ஈடுபடும் மக்களைக் கூட்டாகக் குறிக்கிறது. மூலத்தில் இல்லாத ஆண்பால் வரையறையைச் சேர்க்காமல் இந்தக் கூட்டுப்பொருளைத் தக்கவைக்கிறது.
- source_word: אֲשֶׁר אִתּוֹ
  choice: அவனுடன் இருந்த
  rationale: யோசுவாவுடன் சென்ற போரிடும் மக்களை அடையாளப்படுத்தும் தொடர்புச் சொற்றொடர்.
- source_word: עָלוּ
  choice: மேலே சென்று
  rationale: עלה என்பதன் அடிப்படைத் திசைப் பொருளான ‘மேலே செல்லுதல்’ என்பதைக் காக்கிறது; தேவையின்றி ‘அணிவகுத்துச் சென்றனர்’ போன்ற இராணுவ விளக்கத்தைச் சேர்க்கவில்லை.
- source_word: וַיִּגְּשׁוּ
  choice: நெருங்கினார்கள்
  rationale: נגשׁ குறிக்கும் அருகே வருதல் என்ற பொருளை இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: וַיָּבֹאוּ נֶגֶד הָעִיר
  choice: அவர்கள் நகருக்கு எதிரே வந்து
  rationale: נֶגֶד குறிக்கும் நகரின் முன்னே அல்லது அதற்கு எதிர்ப்புறமாக இருந்த நிலையை, நகருக்குள் நுழைந்ததாகப் பொருள்படாத வகையில் காக்கிறது.
- source_word: וַיַּחֲנוּ
  choice: முகாமிட்டார்கள்
  rationale: חנה என்பதன் வழக்கமான ‘முகாம் அமைத்தல்’ என்ற பொருளைத் தெளிவாக வழங்குகிறது.
- source_word: מִצְּפוֹן לָעַי
  choice: ஆயிக்கு வடக்கே
  rationale: ஆய் நகருடன் ஒப்பிட்ட இடத்தைக் குறிக்கும் இயல்பான தமிழ்ச் சொற்றொடர்.
- source_word: הַגַּי
  choice: பள்ளத்தாக்கு
  rationale: גַּי என்பது பள்ளத்தாக்கு அல்லது குறுகிய பள்ளத்தைக் குறிக்கலாம்; சூழல் கூடுதல் நிலவடிவத் துல்லியத்தை நிர்ணயிக்காததால் பொதுவாகப் புரியும் சொல்லைத் தேர்ந்தெடுக்கிறது.
- source_word: בֵּינוֹ וּבֵין הָעָי
  choice: அவனுக்கும் ஆயிக்கும் இடையில்
  rationale: எபிரெய மெய்யெழுத்து உரையிலுள்ள மூன்றாம் நபர் ஆண்பால் ஒருமைப் பின்னொட்டை அப்படியே காக்கிறது. இது இயல்பாக யோசுவாவைக் குறிக்கலாம்; கூட்டாகப் படையினரைக் குறிக்கும் புரிதலும் சாத்தியம்.
