revisions:
- from: இஸ்ரவேலர், தாங்கள் துரத்திச் சென்றவர்களான ஆயியின் குடியிருப்போர் அனைவரையும் வெட்டவெளியில், பாலைநிலத்தில் கொன்று முடித்தார்கள். அவர்கள் அனைவரும் ஒருவர் மீதமில்லாமல் வாளால் வெட்டுண்டு முற்றிலும் அழிந்தபின்[a], இஸ்ரவேலர் எல்லாரும் ஆயிக்குத் திரும்பி, அதை வாளால் வெட்டினர்.
  to: இஸ்ரவேலர், தாங்கள் அவர்களைத் துரத்திச் சென்ற வெட்டவெளியிலும் பாலைநிலத்திலும் ஆயியின் குடியிருப்போர் அனைவரையும் கொன்று முடித்தபோது, அவர்கள் அனைவரும் வாளால் வெட்டுண்டு விழுந்து முற்றிலும் அழிந்தபின், இஸ்ரவேலர் எல்லாரும் ஆயிக்குத் திரும்பி, அதை வாளால் வெட்டினர்.
  rationale: The revision restores the locative force of “where they pursued them,” explicitly renders “they all fell,” and retains the Hebrew sequence and severity without adding interpretation. The footnote continues to mark the lexical alternative for עַד תֻּמָּם.
