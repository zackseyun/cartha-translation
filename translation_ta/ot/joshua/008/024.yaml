  text: וַ/יְהִ֣י כְּ/כַלּ֣וֹת יִשְׂרָאֵ֡ל לַ/הֲרֹג֩ אֶת כָּל יֹשְׁבֵ֨י הָ/עַ֜י בַּ/שָּׂדֶ֗ה בַּ/מִּדְבָּר֙ אֲשֶׁ֣ר רְדָפ֣וּ/ם בּ֔/וֹ וַֽ/יִּפְּל֥וּ כֻלָּ֛/ם לְ/פִי חֶ֖רֶב עַד תֻּמָּ֑/ם וַ/יָּשֻׁ֤בוּ כָל יִשְׂרָאֵל֙ הָ/עַ֔י וַ/יַּכּ֥וּ אֹתָ֖/הּ לְ/פִי חָֽרֶב־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/024.yaml
  text: And it happened that when Israel had finished killing all the inhabitants of Ai in the field[a], in the wilderness where they had pursued them, and all of them had fallen by the edge of the sword until they were finished off, then all Israel returned to Ai and struck it with the edge of the sword.
translation:
  language: ta
  text: இஸ்ரவேலர், தாங்கள் அவர்களைத் துரத்திச் சென்ற வெட்டவெளியிலும் பாலைநிலத்திலும் ஆயியின் குடியிருப்போர் அனைவரையும் கொன்று முடித்தபோது, அவர்கள் அனைவரும் வாளால் வெட்டுண்டு விழுந்து முற்றிலும் அழிந்தபின், இஸ்ரவேலர் எல்லாரும் ஆயிக்குத் திரும்பி, அதை வாளால் வெட்டினர்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי כְּכַלּוֹת
  choice: கொன்று முடித்தார்கள் ... அழிந்தபின்
  rationale: காலத்தைக் குறிக்கும் כְּ + infinitive construct அமைப்பு, முதலில் நிகழ்ந்த கொலை முடிவுற்ற பின்னரே நகருக்குத் திரும்பிய நிகழ்வைச் சுட்டுகிறது. தமிழில் இயல்பான காலத் தொடராக வழங்கப்பட்டது.
- source_word: יִשְׂרָאֵל
  choice: இஸ்ரவேலர்
  rationale: இங்கு தேசத்தை ஒரு கூட்டுமக்களாகக் குறிக்கிறது; நவீனத் தமிழில் மனிதக் குழுவைக் குறிக்கும் மரியாதைப் பன்மை இயல்பானது.
- source_word: יֹשְׁבֵי הָעַי
  choice: ஆயியின் குடியிருப்போர்
  rationale: ישׁב என்பதன் பெயர்ச்சொல் பயன்பாடு ஆயியில் வசித்தவர்களைக் குறிக்கிறது. ‘குடியிருப்போர்’ என்பது துல்லியமும் இயல்பும் உடையது.
- source_word: בַּשָּׂדֶה בַּמִּדְבָּר
  choice: வெட்டவெளியில், பாலைநிலத்தில்
  rationale: שׂדה நகருக்கு வெளியேயுள்ள திறந்த வெளியையும், מדבר பயிரிடப்படாத வறண்ட நிலப்பகுதியையும் குறிக்கலாம். ‘பாலைவனம்’ என்று மணற்பாங்கான இடமாகக் குறுக்காமல் ‘பாலைநிலம்’ பயன்படுத்தப்பட்டது.
- source_word: אֲשֶׁר רְדָפוּם בּוֹ
  choice: தாங்கள் துரத்திச் சென்றவர்களான
  rationale: எபிரெயத்தில் இடத்தைக் குறிக்கும் בּוֹ உள்ளது; தமிழில் அடுத்துவரும் ‘வெட்டவெளியில், பாலைநிலத்தில்’ என்பதோடு இணைந்து, அவர்கள் துரத்திச் சென்ற இடத்திலேயே கொலை நிகழ்ந்ததை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וַיִּפְּלוּ כֻלָּם לְפִי חֶרֶב
  choice: அவர்கள் அனைவரும் ... வாளால் வெட்டுண்டு
  rationale: போர்ச் சூழலில் נפל இறந்து விழுவதைக் குறிக்கிறது; לְפִי חֶרֶב என்பது ‘வாளின் வாயால்’ என்ற எபிரெய மரபுத்தொடர். தமிழில் அதன் பொருளை இயல்பாக ‘வாளால் வெட்டுண்டு’ என வழங்குகிறது.
- source_word: עַד תֻּמָּם
  choice: ஒருவர் மீதமில்லாமல் ... முற்றிலும் அழிந்தபின்
  rationale: இந்தச் சொற்றொடர் முழுமையாக முடிவுறுதலை வலியுறுத்துகிறது. துரத்தப்பட்ட குழுவில் எவரும் மீதமில்லாத முழு அழிவைத் தெளிவாகவும் மிகைப்படுத்தாமலும் தெரிவிக்கிறது.
- source_word: וַיָּשֻׁבוּ כָל יִשְׂרָאֵל הָעַי
  choice: இஸ்ரவேலர் எல்லாரும் ஆயிக்குத் திரும்பி
  rationale: שׁוב இலக்குடன் வருவதால் ஆயி நகருக்குத் திரும்பியதைக் குறிக்கிறது; ‘எல்லாரும்’ כָל என்பதையும் காக்கிறது.
- source_word: וַיַּכּוּ אֹתָהּ לְפִי חָרֶב
  choice: அதை வாளால் வெட்டினர்
  rationale: பெண்பால் ஒருமைச் சுட்டுப்பெயர் ஆயி நகரத்தையே சுட்டுகிறது. நகரின் மக்களை என்று வெளிப்படையாகச் சேர்க்காமல், மூலத்தின் இலக்கணப் பொருளை ‘அதை’ எனக் காக்கிறது; נכה மற்றும் வாள் மரபுத்தொடரின் வன்மையையும் மென்மைப்படுத்தவில்லை.
theological_decisions:
- issue: போரிலும் முழு அழிவிலும் உள்ள வன்முறையை மொழிபெயர்த்தல்
  choice: ‘கொன்று’, ‘வாளால் வெட்டுண்டு’, ‘முற்றிலும் அழிந்த’ என்ற நேரடியான சொற்களால் உரையின் கடுமையைத் தக்கவைத்தல்
  alternative: ‘தோற்கடித்தனர்’ அல்லது ‘வென்றனர்’ என்று வன்முறையை மென்மைப்படுத்துதல்
  rationale: வசனம் கொலையையும் முழுமையான அழிவையும் வெளிப்படையாக விவரிக்கிறது. அதனை மென்மைப்படுத்தாமலும், இந்த வசனம் கூறாத தெய்வீகத் தீர்ப்பு போன்ற விளக்கத்தைச் சேர்க்காமலும் மொழிபெயர்க்கப்பட்டது.
- issue: וַיַּכּוּ אֹתָהּ என்பதன் பொருள்
  choice: நகரைக் குறிக்கும் ‘அதை’ என்ற சுட்டைத் தக்கவைத்தல்
  alternative: ‘அதன் மக்களைக் கொன்றனர்’ என்று மறைபொருளை வெளிப்படையாக விரித்தல்
  rationale: மூலத்தில் இலக்கணப் பொருள் ஆயி நகரமே. அதன் மக்களைக் குறிக்கும் பொருண்மை சூழலில் இருக்கலாம்; ஆனாலும் உரையில் இல்லாத நேரடி பொருளைச் சேர்க்காமல் உண்மையான சுருக்கத்தையும் சற்று கடினமான உருவகத்தையும் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டது. ‘வெட்டவெளி’ நகரத்துக்கு வெளியேயுள்ள திறந்த நிலத்தைத் தெளிவுபடுத்துகிறது; ‘பாலைநிலம்’ என்பது மணற்பாலைவனம் என்ற தேவையற்ற குறுக்கீட்டைத் தவிர்க்கிறது. போரின் வன்முறை மறைக்கப்படவில்லை; அதேவேளை மூலத்தில் இல்லாத இறையியல் விளக்கம் சேர்க்கப்படவில்லை.
