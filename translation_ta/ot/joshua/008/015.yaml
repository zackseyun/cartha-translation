base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/015.yaml
  text: And Joshua and all Israel let themselves be beaten before them and fled by the way of the wilderness[a][b].
translation:
  language: ta
  text: யோசுவாவும் இஸ்ரவேலர் அனைவரும் அவர்களுக்கு முன்பாகத் தாங்கள் தோற்கடிக்கப்பட்டதுபோல் காட்டி, வனாந்தரத்துக்குச் செல்லும் வழியில் தப்பியோடினார்கள்.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்களுக்கு முன்பாகத் தோற்கடிக்கப்பட்டார்கள்.” இச்சூழலில், ஆயி நகரின் ஆட்களை நகரத்திலிருந்து வெளியே இழுப்பதற்காகத் தோற்றதுபோல் நடித்த தந்திரத்தை இது குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “வனாந்தர வழியாக.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּנָּגְעוּ
  choice: தாங்கள் தோற்கடிக்கப்பட்டதுபோல் காட்டி
  rationale: இராணுவச் சூழலில் இச்சொல் தோற்கடிக்கப்படுதல் அல்லது முறியடிக்கப்படுதல் என்ற பொருளைத் தருகிறது. சுற்றியுள்ள நிகழ்வுகள் இது எதிரிகளை நகரத்திலிருந்து வெளியே இழுப்பதற்கான போலிப் பின்வாங்கல் என்பதைக் காட்டுவதால், தமிழ் உரை அந்தத் தந்திரத்தை இயல்பாக வெளிப்படுத்துகிறது; எளிய செயப்பாட்டு வாசிப்பை அடிக்குறிப்பு பாதுகாக்கிறது.
- source_word: לִפְנֵיהֶם
  choice: அவர்களுக்கு முன்பாக
  rationale: எதிரிகளின் முன்னிலையில் நிகழ்ந்தது என்ற இடம் மற்றும் இராணுவ நிலை சார்ந்த பொருளை நேரடியாகப் பாதுகாக்கிறது.
- source_word: וַיָּנֻסוּ
  choice: தப்பியோடினார்கள்
  rationale: נוּס என்பதன் வழக்கமான ‘தப்பியோடு’ என்ற பொருளைத் தருகிறது. ‘பின்வாங்கினார்கள்’ என்பது இங்கு சாத்தியமானாலும் தந்திரத்தை அதிகமாக விளக்கிவிடும்.
- source_word: דֶּרֶךְ הַמִּדְבָּר
  choice: வனாந்தரத்துக்குச் செல்லும் வழியில்
  rationale: דֶּרֶךְ என்பது வழி அல்லது சாலை எனப் பொருள்படும். வனாந்தரத்தை நோக்கிய பாதை என்ற இயல்பான தமிழ் வாசிப்பைத் தருகிறது; ‘வனாந்தர வழியாக’ என்ற மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: יְהוֹשֻׁעַ וְכָל יִשְׂרָאֵל
  choice: யோசுவாவும் இஸ்ரவேலர் அனைவரும்
  rationale: தனிநபராக யோசுவாவையும், இஸ்ரவேல் மக்களின் ஒட்டுமொத்தக் குழுவையும் தெளிவாகவும் இயல்பான நவீன தமிழிலும் குறிக்கிறது.
theological_decisions:
- issue: தோல்வி உண்மையானதா அல்லது நடித்துக் காட்டப்பட்டதா
  choice: தாங்கள் தோற்கடிக்கப்பட்டதுபோல் காட்டி
  alternative: அவர்களுக்கு முன்பாகத் தோற்கடிக்கப்பட்டு
  rationale: தொடர்ச்சியான கதைச்சூழல் இதை முன்திட்டமிட்ட பதுங்கித் தாக்குதலின் ஒரு பகுதியாகக் காட்டுகிறது. எனினும் எபிரெய வினை தனித்துப் பார்க்கையில் எளிய செயப்பாட்டுப் பொருளையும் அனுமதிப்பதால் அந்த மாற்று அடிக்குறிப்பில் வைக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘வனாந்தரம்’ வேதாகமக் கதைநடையில் பரவலாக அறியப்பட்ட சொல்லாக இருப்பதால் தக்கவைக்கப்பட்டது; வினைத்தொடர் திட்டமிட்ட போலித் தோல்வியை இயல்பாக வெளிப்படுத்துகிறது.
