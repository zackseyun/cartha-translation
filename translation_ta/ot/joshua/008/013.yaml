translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியும் மரியாதையான நிகழ்வுரை பயன்படுத்தப்பட்டது. படைச்சூழல் தெளிவாகத் தோன்றினாலும் הָעָם என்பதற்கு ‘படை’ என்று விளக்காமல் ‘மக்கள்’ என மூலத்தின் பொதுச் சொல்லே தக்கவைக்கப்பட்டது. எபிரெய வாக்கியத்தின் இரு இடக்குறிப்புகளும் இணையான தமிழமைப்பில் வழங்கப்பட்டுள்ளன.
