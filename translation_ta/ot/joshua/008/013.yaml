  text: וַ/יָּשִׂ֨ימוּ הָ/עָ֜ם אֶת כָּל הַֽ/מַּחֲנֶ֗ה אֲשֶׁר֙ מִ/צְּפ֣וֹן לָ/עִ֔יר וְ/אֶת עֲקֵב֖/וֹ מִ/יָּ֣ם לָ/עִ֑יר וַ/יֵּ֧לֶךְ יְהוֹשֻׁ֛עַ בַּ/לַּ֥יְלָה הַ/ה֖וּא בְּ/ת֥וֹךְ הָ/עֵֽמֶק־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/013.yaml
  text: So the people positioned the whole camp that was north of the city[a], with its rear west of the city[b], and Joshua went that night into the midst of the valley.
translation:
  language: ta
  text: அவ்வாறு மக்கள் முழு முகாமையும் நகரத்துக்கு வடக்கே, அதன் பின்பகுதியை[a] நகரத்துக்கு மேற்கேயும்[b] நிலைநிறுத்தினார்கள். யோசுவா அந்த இரவில் பள்ளத்தாக்கின் நடுப்பகுதிக்குச் சென்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அதன் பின்படையை.”
    reason: alternative_reading
  - marker: b
    text: எபிரெயத்தில் நேரடியாக “கடல்” என்ற சொல் உள்ளது; திசையைக் குறிக்கும் இவ்வழக்கில் அது “மேற்கு” என்று பொருள்படும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשִׂימוּ
  choice: நிலைநிறுத்தினார்கள்
  rationale: שׂים என்பதன் அடிப்படைப் பொருள் ‘வைத்தல்/அமைத்தல்.’ இங்கு திட்டமிட்ட படைநிலை அமைப்பை இயல்பான தமிழில் உணர்த்த ‘நிலைநிறுத்தினார்கள்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: הָעָם
  choice: மக்கள்
  rationale: போரில் ஈடுபட்ட படையினரைச் சுட்டினாலும், எபிரெய மூலத்தில் உள்ள பொதுவான ‘மக்கள்’ என்ற சொல்லைத் தக்கவைக்கிறது.
- source_word: כָּל הַמַּחֲנֶה
  choice: முகாம் முழுவதையும்
  rationale: כָּל என்பதன் முழுமையையும் מַחֲנֶה என்பதன் ‘முகாம்’ என்ற பொருளையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: אֲשֶׁר מִצְּפוֹן לָעִיר
  choice: நகரத்தின் வடக்கில்
  rationale: முகாமின் இடத்தைத் தெளிவாகக் குறிக்கும் நவீனத் தமிழ்ச் சொற்றொடர்.
- source_word: עֲקֵבוֹ
  choice: அதன் பின்பகுதி
  rationale: עָקֵב அடிப்படையில் ‘குதிகால்’ என்றும் நீட்சியாக ‘பின்பகுதி’ என்றும் பொருள்படும். ‘பின்படை’ என்பது சாத்தியமானாலும் மூலத்தைவிட விளக்கமளிப்பதாக இருப்பதால் முதன்மை உரையில் தவிர்க்கப்பட்டது.
- source_word: מִיָּם לָעִיר
  choice: நகரத்தின் மேற்கில்
  rationale: יָם என்பதற்கு ‘கடல்’ என்ற பொருள் இருந்தாலும், எபிரெயத் திசைவழக்கில் அது பொதுவாக ‘மேற்கு’ என்பதைக் குறிக்கிறது.
- source_word: וַיֵּלֶךְ
  choice: சென்றார்
  rationale: הלך என்பதன் சூழலுக்கேற்ற எளிய இயக்கப் பொருளைத் தருகிறது.
- source_word: בַּלַּיְלָה הַהוּא
  choice: அன்று இரவு
  rationale: ‘அந்த இரவில்’ என்ற மூலப் பொருளை இயல்பான நிகழ்வுரைத் தமிழில் தருகிறது.
- source_word: בְּתוֹךְ הָעֵמֶק
  choice: பள்ளத்தாக்கின் நடுப்பகுதிக்கு
  rationale: இயக்க வினையுடன் வரும் בְּתוֹךְ என்பதை ‘நடுப்பகுதிக்கு’ எனக் கொடுத்து, அந்த இடத்திற்குள் சென்ற இயக்கத்தைப் பாதுகாக்கிறது.
