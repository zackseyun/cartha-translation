base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/025.yaml
  text: And all who fell that day[a], from man to woman, were twelve thousand—all the people of Ai.
translation:
  language: ta
  text: அந்த நாளில் ஆண் முதல் பெண் வரை வீழ்ந்தவர்கள் மொத்தம் பன்னிரண்டாயிரம் பேர்—ஆயி நகரத்தார் அனைவரும்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரேயத்தில் சொல்லாட்சிப்படி, “ஆயியின் ஆண்கள் அனைவரும்.” இங்கு அது “ஆயி நகர மக்கள் அனைவரும்” அல்லது “ஆயியில் குடியிருந்த அனைவரும்” என்ற கூட்டுப் பொருளில் இருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: மொத்தம் ... பேர்
  rationale: היה என்பதன் தொடர்வடிவு இங்கு போரின் முடிவைச் சுருக்கிக் கூறுகிறது. தமிழில் தனியே ‘அது நடந்தது’ என்று மொழிபெயர்ப்பதைவிட, எண்ணிக்கையை மையப்படுத்தும் இயல்பான வாக்கிய அமைப்பில் அதன் பொருள் வெளிப்படுகிறது.
- source_word: כָל הַנֹּפְלִים
  choice: வீழ்ந்தவர்கள்
  rationale: נפל என்பதன் பெயரெச்ச வடிவம் சொல்லாட்சிப்படி ‘வீழ்ந்தவர்கள்’ எனப் பொருள்படும்; போர் சூழலில் கொல்லப்பட்டவர்களைக் குறிக்கிறது. மூலமொழியின் உருவகச் சொல்லாட்சியை இது இயல்பாகத் தக்கவைக்கிறது.
- source_word: בַּיּוֹם הַהוּא
  choice: அந்த நாளில்
  rationale: எபிரேய காலக் குறிப்பின் நேரடியான, இயல்பான தமிழ் வடிவம்.
- source_word: מֵאִישׁ וְעַד אִשָּׁה
  choice: ஆண்முதல் பெண்வரை
  rationale: ‘ஆணிலிருந்து பெண்வரை’ என்ற முழுமையைச் சுட்டும் எபிரேய இணைப்பைச் சுருக்கமான, இயல்பான தமிழில் துல்லியமாக வெளிப்படுத்துகிறது.
- source_word: שְׁנֵים עָשָׂר אָלֶף
  choice: பன்னிரண்டாயிரம் பேர்
  rationale: எண்ணிக்கையை நேரடியாகத் தருகிறது; மனிதர்களைக் கணக்கிடும் தமிழ் எண்ணுப்பெயராக ‘பேர்’ சேர்க்கப்பட்டுள்ளது.
- source_word: כֹּל אַנְשֵׁי הָעָי
  choice: ஆயி நகரத்தார் அனைவரும்
  rationale: אַנְשֵׁי என்பதன் சொற்பொருள் ‘ஆயியின் ஆண்கள்’ என்றாலும், அதற்கு முந்திய ‘ஆண்முதல் பெண்வரை’ என்பதால் இங்கு அது நகர மக்களை ஒட்டுமொத்தமாகக் குறிக்கும் கூட்டுச் சொல்லாட்சி. ‘நகரத்தார்’ நகரத்துடன் தொடர்புடைய மொத்த மக்களையும் குறிக்கிறது; சொற்பொருள் மாற்று அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
theological_decisions:
- issue: உயிரிழந்தோரின் சுருக்கத்தில் பாலினத்தைக் குறிக்கும் மொழி
  choice: ‘ஆண்முதல் பெண்வரை’ என்பதைத் தக்கவைத்து, இறுதி கூட்டுச் சொல்லாட்சியை ‘ஆயி நகரத்தார் அனைவரும்’ என மொழிபெயர்த்தல்
  alternative: ‘ஆயியின் ஆண்கள் அனைவரும்’
  rationale: முதல் சொற்றொடர் இரு பாலினரையும் வெளிப்படையாக உள்ளடக்குகிறது. ஆகவே இறுதியிலுள்ள אַנְשֵׁי הָעָי என்பதை ஆண்களுக்கு மட்டும் வரையறுப்பது உட்பொருளுடன் முரண்படும் வாய்ப்புள்ளது. அதேவேளை அதன் சொல்லாட்சிப்படியான வடிவம் அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், மரியாதையும் வாசிப்புத் தெளிவும் கொண்ட நடை. ‘வீழ்ந்தவர்கள்’ என்ற வேதாகமச் சூழலுக்கு ஏற்ற இயல்பான சொல்லாட்சி மூலத்தின் உருவகத்தைத் தக்கவைக்கிறது; ‘நகரத்தார்’ என்பது ஆண், பெண் இருவரையும் உள்ளடக்கும் கூட்டுப்பெயராகப் பயன்படுத்தப்பட்டுள்ளது.
