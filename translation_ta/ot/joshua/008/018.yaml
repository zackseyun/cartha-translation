  terminology: “யாவே,” “யோசுவா,” and “ஈட்டி” are appropriate choices. The footnote responsibly preserves the lexical uncertainty of כִּידוֹן without claiming a more precise weapon type than the evidence warrants. “நகரம்” properly reflects העיר rather than leveling it to the place name.
