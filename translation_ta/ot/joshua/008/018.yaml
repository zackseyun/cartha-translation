id: JOS.8.18
reference: Joshua 8:18
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל יְהוֹשֻׁ֗עַ נְ֠טֵה בַּ/כִּיד֤וֹן אֲשֶׁר בְּ/יָֽדְ/ךָ֙ אֶל הָ/עַ֔י כִּ֥י בְ/יָדְ/ךָ֖ אֶתְּנֶ֑/נָּה וַ/יֵּ֧ט יְהוֹשֻׁ֛עַ בַּ/כִּיד֥וֹן אֲשֶׁר בְּ/יָד֖/וֹ אֶל הָ/עִֽיר־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/018.yaml
  text: Then Yahweh said to Joshua[a], “Stretch out the javelin that is in your hand toward Ai, for I will give it into your hand.” So Joshua stretched out the javelin that was in his hand toward the city.
translation:
  language: ta
  text: அப்போது யாவே யோசுவாவிடம், “உன் கையிலுள்ள ஈட்டியை[a] ஆயை நோக்கி நீட்டு; ஏனெனில் அதை உன் கையில் கொடுப்பேன்” என்றார். எனவே யோசுவா தன் கையிலிருந்த ஈட்டியை நகரத்தை நோக்கி நீட்டினார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரேயச் சொல் எறியீட்டி, ஈட்டி அல்லது வேல் வகை ஆயுதத்தைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரேய மூலத்தில் உள்ள இறைபெயரைப் பொதுப்பட்டமாக மாற்றாமல், தமிழில் அதன் ஒலிப்பெயர்ப்பாக வழங்குகிறது.
- source_word: נְטֵה / וַיֵּט (נטה)
  choice: நீட்டு / நீட்டினார்
  rationale: ஆயுதத்தை ஒரு திசையை நோக்கி நீட்டும் உடல் செயலை நேரடியாகக் காட்டுகிறது; வெறுமனே ‘சுட்டிக்காட்டு’ என்று பொருளைச் சுருக்கவில்லை.
- source_word: כִּידוֹן
  choice: ஈட்டி
  rationale: இச்சொல் எறியீட்டி, ஈட்டி அல்லது வேல் போன்ற ஆயுதத்தைக் குறிக்கக்கூடும். ‘ஈட்டி’ இயல்பான தமிழ்ச் சொல்லாகவும், மூலத்தின் வகைத் தெளிவின்மையை அளவுக்கு மீறித் தீர்க்காத சொல்லாகவும் உள்ளது.
- source_word: אֲשֶׁר בְּיָדְךָ / אֲשֶׁר בְּיָדוֹ
  choice: உன் கையிலுள்ள / தன் கையிலிருந்த
  rationale: மூலத்தின் தொடர்புத் தொடரைத் தெளிவாகப் பேணுகிறது; நேர்க்கூற்றிலும் கதை விவரிப்பிலும் இயல்பான தமிழ் காலநிலையைப் பயன்படுத்துகிறது.
- source_word: אֶל הָעַי
  choice: ஆயை நோக்கி
  rationale: אֶל இங்கு திசையைக் குறிக்கிறது. நகருக்குள் செல்லுதல் அல்லது அதைத் தாக்குதல் என்று கூடுதலாகப் பொருள் சேர்க்காமல் திசை உணர்வைப் பேணுகிறது.
- source_word: כִּי בְיָדְךָ אֶתְּנֶנָּה
  choice: ஏனெனில் அதை உன் கையில் கொடுப்பேன்
  rationale: ஒருவரின் அதிகாரத்துக்குள் ஒப்படைப்பதைக் குறிக்கும் எபிரேய மரபுத்தொடரைத் தமிழிலும் புரியத்தக்க வகையில் நெருக்கமாகப் பேணுகிறது.
- source_word: אֶל הָעִיר
  choice: நகரத்தை நோக்கி
  rationale: முதல் பாதியிலுள்ள இடப்பெயரான ‘ஆய்’ என்பதிலிருந்து இரண்டாம் பாதியில் வரும் ‘நகரம்’ என்ற சொல்லுக்கு மூலத்தில் காணப்படும் மாற்றத்தைப் பேணுகிறது.
theological_decisions:
- issue: יהוה என்ற இறைபெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: யெகோவா அல்லது ஆண்டவர்
  rationale: வசனம் நான்கெழுத்து இறைபெயரை நேரடியாகப் பயன்படுத்துவதால், அதை ஒரு பட்டமாக மாற்றாமல் ‘யாவே’ என்று ஒலிப்பெயர்ப்பது மூலத்தின் உடன்படிக்கைப் பெயரைப் பேணுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியும் ஆனால் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. ‘ஆயை நோக்கி’ என்பதும் ‘நகரத்தை நோக்கி’ என்பதும் மூலத்தின் சொல் மாற்றத்தைப் பேணுகின்றன; ஈட்டியின் துல்லியமான வகை அடிக்குறிப்பில் திறந்துவைக்கப்பட்டுள்ளது.
