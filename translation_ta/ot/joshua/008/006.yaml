  source_fidelity: 'முதன்மைக் கருத்து சரியாக உள்ளது: ஆயியின் மக்கள் இஸ்ரவேலரைப் பின்தொடர்ந்து நகரத்தை விட்டு வெளியே வருவர்; இஸ்ரவேலர் அவர்களை நகரத்திலிருந்து இழுத்து அகற்றுவர்; அவர்கள் முந்தைய நிகழ்வைப் போல இஸ்ரவேலர் ஓடுவதாக நினைப்பர். ஆனால் ‘அப்படியே வருவார்கள்’ என்பது எதைக் குறிக்கிறது என்பது தெளிவற்றது; மூலத்தின் ‘until’ உறவைத் துல்லியமாக வெளிப்படுத்த வேண்டும். மேற்கோளுக்குள் சேர்க்கப்பட்ட ‘இப்போதும்’ மூலத்தில் வெளிப்படையாக இல்லை; அதை நீக்குவது பாதுகாப்பானது.'
