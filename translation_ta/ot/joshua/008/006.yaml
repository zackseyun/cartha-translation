base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/006.yaml
  text: And they will come out after us until we have drawn them away from the city[a], for they will say[b], ‘They are fleeing before us as at the first,’ and we will flee before them.
translation:
  language: ta
  text: அவர்கள் நம்மைப் பின்தொடர்ந்து வெளியே வருவார்கள்; நாம் அவர்களை நகரத்திலிருந்து இழுத்து அகற்றும்வரை[a] அவர்கள் பின்தொடர்வார்கள். ஏனெனில், ‘முதல் முறை நடந்ததுபோல இவர்கள் நமக்கு முன்பாகத் தப்பியோடுகிறார்கள்’[b] என்று அவர்கள் சொல்வார்கள். நாமும் அவர்களுக்கு முன்பாகத் தப்பியோடுவோம்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, கருத்தை இன்னும் விளக்கமாக, ‘நகரத்திலிருந்து அவர்களைத் தந்திரமாக விலகி வரவழைக்கும்வரை.’ எபிரெய வினைச்சொல் இழுத்து அகற்றுதல் அல்லது பிரித்தல் என்பதைக் குறிக்கிறது; ‘தந்திரமாக வரவழைத்தல்’ இங்குள்ள போர்த்தந்திரத்தை விளக்குகிறது.
    reason: lexical_alternative
  - marker: b
    text: ‘முதல் முறை நடந்ததுபோல’ என்பது ஆயிக்கு எதிராக இஸ்ரவேலர் முன்பு பின்வாங்கியதைக் குறிக்கிறது (யோசுவா 7:4–5 பார்க்கவும்).
    reason: cross_reference
lexical_decisions:
- source_word: וְיָצְאוּ אַחֲרֵינוּ
  choice: அவர்கள் நம்மைப் பின்தொடர்ந்து வெளியே வருவார்கள்
  rationale: திட்டமிடப்பட்ட எதிர்காலச் செயலைத் தெளிவாகக் காட்டுகிறது; אַחֲרֵינוּ என்பதன் படைச்சூழல் சார்ந்த பின்தொடர்தல் பொருளையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: עַד הַתִּיקֵנוּ אוֹתָם מִן הָעִיר
  choice: நகரத்திலிருந்து அவர்களை நாம் இழுத்துத் தொலைவுக்குக் கொண்டுவரும்வரை
  rationale: נתק என்பதன் Hiphil வடிவம் இழுத்துப் பிரித்தல் அல்லது அகற்றுதல் என்ற அடிப்படைப் பொருளைக் கொண்டது. சூழலில் நகரத்திலிருந்து தொலைவுக்கு வரச்செய்வதைக் குறிக்கிறது; ‘வலையில் சிக்கவைப்பது’ போன்ற கூடுதல் கருத்தை முதன்மை உரையில் சேர்க்கவில்லை.
- source_word: כִּי יֹאמְרוּ
  choice: ஏனெனில் ... என்று அவர்கள் சொல்வார்கள்
  rationale: முந்தைய தந்திரம் ஏன் வெற்றி பெறும் என்பதற்கான காரணத்தை அறிமுகப்படுத்துகிறது.
- source_word: נָסִים לְפָנֵינוּ
  choice: இவர்கள் நமக்கு முன்னால் தப்பியோடுகிறார்கள்
  rationale: நָסִים என்னும் பங்கேற்புவினை நடந்துகொண்டிருக்கும் ஓட்டத்தைச் சுட்டுகிறது; לְפָנֵינוּ உடன் சேர்ந்து எதிரியின் முன்னிலையில் பின்வாங்குவதைப் படைச்சூழலில் காட்டுகிறது.
- source_word: כַּאֲשֶׁר בָּרִאשֹׁנָה
  choice: முதலில் நடந்ததுபோல இப்போதும்
  rationale: ஆயிக்கு எதிராக முன்பு ஏற்பட்ட பின்வாங்குதலைச் சுட்டும் ஒப்பீட்டைத் தெளிவான நவீன தமிழில் தருகிறது. ‘இப்போதும்’ என்பது தமிழில் ஒப்பீட்டை இயல்பாக்கும் சூழல்சார் இணைப்பு.
- source_word: וְנַסְנוּ לִפְנֵיהֶם
  choice: நாமும் அவர்களுக்கு முன்னால் தப்பியோடுவோம்
  rationale: திட்டமிட்ட எதிர்காலச் செயலைக் காட்டுவதோடு, எதிரிகள் கூறப்போகும் ‘தப்பியோடுகிறார்கள்’ என்ற சொல்லுடன் எபிரெய உரையில் உள்ள சொல் எதிரொலியையும் காக்கிறது.
