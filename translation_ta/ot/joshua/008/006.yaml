translation_notes:
  register: நவீனத் தரமான, கண்ணியமான, பொதுவாசகர்களுக்கு எளிதில் புரியும் தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘தப்பியோடுதல்’ என்ற மறுமொழி இரு தரப்பின் செயலிலும் காக்கப்பட்டுள்ளது. நீண்ட எபிரெய வாக்கியம் வாசிப்புத் தெளிவுக்காக தமிழில் பல வாக்கியங்களாகப் பிரிக்கப்பட்டுள்ளது; பொருள் மற்றும் தர்க்கத் தொடர்பு மாற்றப்படவில்லை.
