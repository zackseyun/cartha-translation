revisions:
- from: எனவே யோசுவா ஆயி நகரத்தை எரித்து, அதை என்றென்றும் நிலைக்கும் ஒரு இடிபாட்டு மேடாக[a], இந்நாள்வரை பாழாய்க் கிடக்கும்படி செய்தார்.
  to: யோசுவா ஆயியை எரித்து, அதை நிலையான ஓர் இடிபாட்டு மேடாகவும், இந்நாள்வரை பாழ்நிலமாகவும் ஆக்கினார்.[a]
  rationale: 'The revision removes an unsupported inferential connector and renders the Hebrew’s two resultative nominal predicates directly: Ai became a lasting ruin-mound and remained a desolation to the narrator’s present. The footnote remains anchored to ‘நிலையான’ and preserves the semantic breadth of עוֹלָם.'
  reviewer_model: gpt-5.6-terra
