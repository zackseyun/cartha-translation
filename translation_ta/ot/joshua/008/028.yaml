translation_notes:
  register: நவீன தரத்தமிழில், கண்ணியமானதும் பொதுவாசகர்களுக்குப் புரியத்தக்கதுமான நடையில் அமைக்கப்பட்டுள்ளது. எபிரேய தொடர்வினை அமைப்பு இயல்பான தமிழ் வாக்கியமாக மாற்றப்பட்டுள்ளது; עוֹלָם என்பதிலுள்ள காலநீடிப்பு சார்ந்த உண்மையான நெகிழ்வு அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
