base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/028.yaml
  text: So Joshua burned Ai and made it a permanent mound[a], a desolation to this day.
translation:
  language: ta
  text: யோசுவா ஆயியை எரித்து, அதை நிலையான ஓர் இடிபாட்டு மேடாகவும், இந்நாள்வரை பாழ்நிலமாகவும் ஆக்கினார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘நெடுங்காலம் நிலைக்கும் ஓர் இடிபாட்டு மேடாக.’ எபிரேயச் சொல் עוֹלָם மிக நீண்ட அல்லது காலவரையறையற்ற நீடிப்பைக் குறிக்கலாம்; அது அடிக்கடி ‘என்றென்றும்’ அல்லது ‘நித்தியமாக’ என மொழிபெயர்க்கப்படுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׂרֹף
  choice: எரித்து
  rationale: שׂרף என்பது நெருப்பால் எரிப்பதைக் குறிக்கிறது; தொடர்வினை அமைப்பில் ‘எரித்து’ இயல்பாக உள்ளது.
- source_word: הָעָי
  choice: ஆயி நகரம்
  rationale: இது ஓர் இடப்பெயர்; தமிழ் உச்சரிப்புக்கு ஏற்றவாறு ஒலிபெயர்க்கப்பட்டு, தெளிவுக்காக ‘நகரம்’ சேர்க்கப்பட்டுள்ளது.
- source_word: וַיְשִׂימֶהָ
  choice: அதை ... செய்தார்
  rationale: שׂים என்பதன் விளைவுநிலையை உருவாக்கும் பொருளைத் தமிழில் இயல்பான ‘செய்தார்’ கட்டமைப்பு தெரிவிக்கிறது.
- source_word: תֵּל
  choice: இடிபாட்டு மேடு
  rationale: அழிக்கப்பட்ட நகரத்தின் இடிபாடுகளால் உருவான மேடு என்ற சூழல்சார் பொருளை இது தெளிவாகவும் சுருக்கமாகவும் தருகிறது.
- source_word: עוֹלָם
  choice: என்றென்றும் நிலைக்கும்
  rationale: עוֹלָם நீண்ட அல்லது வரையறுக்கப்படாத காலத்தைக் குறிக்கலாம்; அதன் வலிமையை முதன்மை உரையில் காத்து, பொருள் நுணுக்கம் அடிக்குறிப்பில் விளக்கப்படுகிறது.
- source_word: שְׁמָמָה
  choice: பாழாய்க் கிடக்கும்படி
  rationale: שְׁמָמָה குறிக்கும் பாழ்நிலையைத் தமிழில் இயல்பான விளைவுநிலையாக வெளிப்படுத்துகிறது.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: இந்நாள்வரை
  rationale: கதைசொல்லியின் காலம்வரை அந்த நிலை தொடர்ந்ததைச் சுட்டும் எபிரேய மரபுத்தொடருக்கு இயல்பான தமிழ் இணை.
