  text: וַ/יִּכְתָּב שָׁ֖ם עַל הָ/אֲבָנִ֑ים אֵ֗ת מִשְׁנֵה֙ תּוֹרַ֣ת מֹשֶׁ֔ה אֲשֶׁ֣ר כָּתַ֔ב לִ/פְנֵ֖י בְּנֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/032.yaml
  text: And there[a], on the stones, he wrote a copy of the law of Moses[b], which he had written before the sons of Israel.
translation:
  language: ta
  text: அங்கே, அவர் கற்களின் மேல், மோசே இஸ்ரவேல் மக்களின் முன்னிலையில்[b] எழுதியிருந்த திருச்சட்டத்தின் ஒரு பிரதியை[a] எழுதினார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘மோசேயின் திருச்சட்டத்தின் மறுபிரதியை’ அல்லது ‘மோசேயின் திருச்சட்டத்தின் மீளுரைப்பை.’ எபிரெயச் சொல் ஒரு பிரதியையோ மீண்டும் வழங்கப்பட்ட வடிவத்தையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘இஸ்ரவேல் மக்களுக்கு முன்பாக.’ எபிரெயச் சொல் ஒருவருக்கு முன்பாக அல்லது அவரது முன்னிலையில் என்பதைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּכְתָּב
  choice: எழுதினார்
  rationale: כתב என்பதன் சாதாரண பொருள் ‘எழுது.’ எழுதப்பட்ட பரப்பு கற்கள் என்றாலும், ‘பொறித்தார்’ என்று மூல வினைச்சொல்லைவிடக் குறிப்பாக்காமல் அதன் இயல்பான பொருள் காக்கப்படுகிறது.
- source_word: שָׁם
  choice: அங்கே
  rationale: இடத்தைக் குறிக்கும் எபிரெய வினையடையின் நேரான, இயல்பான தமிழ் வடிவம்.
- source_word: עַל הָאֲבָנִים
  choice: கற்களின்மேல்
  rationale: עַל இங்கு எழுதப்பட்ட பரப்பைக் குறிக்கிறது; வரையறுக்கப்பட்ட பன்மை ‘கற்கள்’ என்பதும் காக்கப்படுகிறது.
- source_word: אֵת מִשְׁנֵה תּוֹרַת מֹשֶׁה
  choice: மோசேயின் திருச்சட்டத்தின் ஒரு பிரதி
  rationale: מִשְׁנֵה என்பது பிரதி, நகல் அல்லது மீண்டும் வழங்கப்பட்ட வடிவம் எனப் பொருள்படலாம். கற்களின்மேல் எழுதும் இச்சூழலில் ‘ஒரு பிரதி’ இயல்பாகப் பொருந்துகிறது; எழுதப்பட்ட பகுதியின் அளவை இது தீர்மானிப்பதில்லை.
- source_word: תּוֹרָה
  choice: திருச்சட்டம்
  rationale: תּוֹרָה பொதுவாக ‘போதனை’ என்றும் பொருள்படலாம்; ஆனால் மோசேயோடும் உடன்படிக்கைச் சூழலோடும் இணைந்துள்ள இவ்விடத்தில் ‘திருச்சட்டம்’ தெளிவாகவும் மரியாதையான நவீன தமிழிலும் அமைகிறது.
- source_word: אֲשֶׁר כָּתַב
  choice: மோசே ... எழுதியிருந்த
  rationale: சார்பு வாக்கியத்தின் இயல்பான எழுவாய் மோசே. யோசுவாவின் தற்போதைய எழுதுதலுக்கு முந்திய மோசேயின் செயலை ‘எழுதியிருந்த’ தெளிவாகக் காட்டுகிறது.
- source_word: לִפְנֵי
  choice: முன்னிலையில்
  rationale: இங்கு இஸ்ரவேல் மக்கள் காணும் பொது நிகழ்வாக எழுதப்பட்டதைச் சுட்டுவதால் ‘முன்னிலையில்’ இயல்பானது; ‘முன்பாக’ என்பதும் சாத்தியம்.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்கள்
  rationale: எபிரெய மொழிமரபான ‘இஸ்ரவேலின் மகன்கள்’ இங்கு இஸ்ரவேல் சமூகத்தைக் கூட்டாகக் குறிக்கிறது. தமிழில் பாலினத்தைத் தேவையின்றிக் குறுக்காமல் அந்தக் கூட்டுப் பொருளை இயல்பாக வழங்க ‘இஸ்ரவேல் மக்கள்’ தேர்ந்தெடுக்கப்பட்டது.
theological_decisions:
- issue: מִשְׁנֵה תּוֹרַת מֹשֶׁה என்பதன் உள்ளடக்க அளவு
  choice: ‘மோசேயின் திருச்சட்டத்தின் ஒரு பிரதி’ என்று மொழிபெயர்த்து, முழுத் தோராவா அல்லது தேர்ந்தெடுக்கப்பட்ட சட்டப்பகுதியா என்பதைத் தீர்மானிக்காமல் விடுதல்.
  alternative: ‘மோசேயின் திருச்சட்டத்தின் மறுபதிப்பு’ அல்லது ‘இரண்டாம் பிரதி’
  rationale: எழுதப்பட்ட உள்ளடக்கத்தின் அளவை வசனம் வரையறுக்கவில்லை. ஆகவே எந்த ஓர் ஒத்திசைவு விளக்கத்தையும் உரைக்குள் சேர்க்காமல் மூலத்தின் திறந்த நிலையைக் காக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில் இயல்பான, மரியாதையான நடையைக் கடைப்பிடிக்கிறது. ‘திருச்சட்டம்’ உடன்படிக்கை மற்றும் சட்டச் சூழலைத் தெளிவாக்குகிறது. நீண்ட எபிரெய வாக்கிய அமைப்பின் உறவுகளைத் தமிழில் தெளிவுபடுத்த மோசே சார்பு வாக்கியத்தின் வெளிப்படையான எழுவாயாக வைக்கப்பட்டுள்ளார்.
