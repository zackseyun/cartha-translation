translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. எபிரெயக் கூட்டு எழுவாயின் பொருளுக்கு ஏற்ப முதல் வினை பன்மையில் அமைக்கப்பட்டுள்ளது. ‘ஆயிக்கு எதிராக’ என்பது இராணுவச் சூழலை வெளிப்படுத்தினாலும், ‘தாக்குவதற்காக’ என்று நோக்கத்தை அதிகமாக விளக்குவதைத் தவிர்க்கிறது.
