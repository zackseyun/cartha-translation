revisions:
- from: யோசுவாவும் போருக்குரிய மக்கள் அனைவரும் ஆயிக்கு எதிராகப் புறப்பட்டுச் செல்ல எழுந்தார்கள். யோசுவா வலிமைமிக்க வீரர்களில் முப்பதாயிரம் பேரைத் தேர்ந்தெடுத்து, இரவில் அவர்களை அனுப்பினார்.
  to: யோசுவாவும் போரிடும் மக்கள் அனைவரும் ஆயிக்கு எதிராகச் செல்ல எழுந்தனர். யோசுவா வலிமைமிக்க முப்பதாயிரம் வீரர்களைத் தேர்ந்தெடுத்து, இரவில் அவர்களை அனுப்பினார்.
  rationale: 'The revision removes the unsupported partitive sense, improves modern Tamil idiom for the military collective, and retains the source’s restrained wording: they rose to go against Ai rather than being said explicitly to attack it. No footnote is needed, since the translation does not introduce a disputed or obscured alternative requiring explanation.'
