  text: וַ/יָּ֧קָם יְהוֹשֻׁ֛עַ וְ/כָל עַ֥ם הַ/מִּלְחָמָ֖ה לַ/עֲל֣וֹת הָ/עָ֑י וַ/יִּבְחַ֣ר יְ֠הוֹשֻׁעַ שְׁלֹשִׁ֨ים אֶ֤לֶף אִישׁ֙ גִּבּוֹרֵ֣י הַ/חַ֔יִל וַ/יִּשְׁלָחֵ֖/ם לָֽיְלָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/003.yaml
  text: So Joshua and all the fighting people rose to go up against Ai[a], and Joshua chose thirty thousand men, mighty men of valor[c][b], and sent them out by night.
translation:
  language: ta
  text: யோசுவாவும் போரிடும் மக்கள் அனைவரும் ஆயிக்கு எதிராகச் செல்ல எழுந்தனர். யோசுவா வலிமைமிக்க முப்பதாயிரம் வீரர்களைத் தேர்ந்தெடுத்து, இரவில் அவர்களை அனுப்பினார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּקָם
  choice: எழுந்தார்கள்
  rationale: קום என்பதன் அடிப்படைச் செயற்பொருளையும், நடவடிக்கை தொடங்குவதைக் குறிக்கும் எபிரெயக் கதைநடையையும் காக்கிறது; யோசுவாவும் மக்களும் சேர்ந்த கூட்டு எழுவாய்க்கு ஏற்ப பன்மை பயன்படுத்தப்பட்டது.
- source_word: כָל עַם הַמִּלְחָמָה
  choice: போருக்குரிய மக்கள் அனைவரும்
  rationale: ‘போரின் மக்கள் அனைவரும்’ என்ற சொற்படியான அமைப்பின் கூட்டுப்பொருளைத் தக்கவைத்து, நவீனத் தமிழில் அவர்கள் போரில் ஈடுபடும் மக்கள் என்பதைத் தெளிவாகச் சொல்கிறது; ‘படை’ என்று நிறுவனமயமாக்கவில்லை.
- source_word: לַעֲלוֹת הָעָי
  choice: ஆயிக்கு எதிராகப் புறப்பட்டுச் செல்ல
  rationale: עלה என்பதிலுள்ள மேலே/நோக்கிச் செல்லும் இயக்கத்தையும், இராணுவச் சூழலில் உள்ள பகைநோக்கையும் இயல்பான தமிழில் இணைக்கிறது; நேரடியாக ‘தாக்க’ என்று மொழிபெயர்த்து நோக்கத்தை அளவுக்கு மீறித் தீர்மானிக்கவில்லை.
- source_word: הָעָי
  choice: ஆயி
  rationale: இடப்பெயரின் பரவலாக அறியப்பட்ட தமிழ் ஒலிபெயர்ப்பு.
- source_word: וַיִּבְחַר
  choice: தேர்ந்தெடுத்து
  rationale: בחר என்பதன் நேரடியான பொருளை இயல்பான தமிழ் கதைநடையில் தருகிறது.
- source_word: שְׁלֹשִׁים אֶלֶף אִישׁ
  choice: முப்பதாயிரம் பேரை
  rationale: எண்ணிக்கையைத் துல்லியமாகக் காக்கிறது; அடுத்துள்ள ‘வீரர்கள்’ என்பதுடன் தமிழில் இயல்பாக இணைகிறது.
- source_word: גִּבּוֹרֵי הַחַיִל
  choice: வலிமைமிக்க வீரர்களில்
  rationale: திறனும் வலிமையும் கொண்ட போர்வீரர்கள் என்ற மரபுத்தொடரின் பொருளைத் தெளிவான நவீனத் தமிழில் தருகிறது; பழமையான அல்லது சமயமரபுச் சொற்றொடரைத் திணிக்கவில்லை.
- source_word: וַיִּשְׁלָחֵם
  choice: அவர்களை அனுப்பினார்
  rationale: שלח மற்றும் அதன் பொருட்சுட்டுப் பின்னொட்டின் நேரடியான பொருளைக் காக்கிறது; இல்லாத இலக்கையோ பணியையோ சேர்க்கவில்லை.
- source_word: לָיְלָה
  choice: இரவில்
  rationale: காலத்தைக் குறிக்கும் வினையடைப் பயன்பாட்டைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
