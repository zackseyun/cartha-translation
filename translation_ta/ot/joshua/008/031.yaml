base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/031.yaml
  text: just as Moses the servant of Yahweh had commanded the sons of Israel[a], as it is written in the Book of the Law of Moses, an altar of whole stones, on which no iron tool had been wielded[b]; and they offered up burnt offerings on it to Yahweh and sacrificed peace offerings.
translation:
  language: ta
  text: யாவேவின் ஊழியரான மோசே இஸ்ரவேல் மக்களுக்குக் கட்டளையிட்டபடியே—மோசேயின் திருச்சட்டப் புத்தகத்தில் எழுதப்பட்டுள்ளபடி—இரும்புக் கருவி படாத முழுக் கற்களால்[a] அந்தப் பலிபீடத்தைக் கட்டினான். அதன்மேல் அவர்கள் யாவேவுக்குத் தகன பலிகளைச் செலுத்தி, சமாதான பலிகளையும்[b] பலியிட்டார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “செதுக்கப்படாத கற்களால்.” எபிரேயத்தில் “முழுக் கற்கள்” என்று உள்ளது; இரும்புக் கருவியால் வேலை செய்யப்படாமல் கற்கள் முழுமையாக விடப்பட்டதை இது வலியுறுத்துகிறது.
    reason: lexical_alternative
  - marker: b
    text: “சமாதான பலிகள்” என்பதற்கு “நல்லுறவுப் பலிகள்” அல்லது “நலவாழ்வுப் பலிகள்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּאֲשֶׁר צִוָּה
  choice: கட்டளையிட்டபடியே
  rationale: முந்தைய கட்டளைக்கு முற்றிலும் இணங்கச் செயல் நடந்தது என்ற ஒப்புமை மற்றும் ஏற்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: עֶבֶד יְהוָה
  choice: யாவேவின் ஊழியரான
  rationale: மோசேயின் மதிப்புமிக்க பணிநிலையைக் குறிக்கும் நிலையான பட்டத்தை இயல்பான, கண்ணியமான தமிழில் தருகிறது; இவ்விடத்தில் அடிமைநிலை முதன்மைப்படுத்தப்படவில்லை.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரேய மூலத்தில் நேரடியாக வரும் தேவனுடைய தனிப்பெயரை ஒலிபெயர்த்து வழங்குகிறது.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்கள்
  rationale: எபிரேயத்தின் குடும்பவழிக் கூட்டுப்பெயரை, தமிழில் பாலினத் தவறான வரம்பை ஏற்படுத்தாமல் இயல்பாகத் தெரிவிக்கிறது.
- source_word: בְּסֵפֶר תּוֹרַת מֹשֶׁה
  choice: மோசேயின் திருச்சட்டப் புத்தகத்தில்
  rationale: סֵפֶר என்பதன் ‘புத்தகம்/சுருள்’ கருத்தையும் תּוֹרָה என்பதன் அதிகாரமுள்ள சட்டப் போதனையையும் வாசகருக்குப் புரியும் நிலையான சொற்றொடரில் காக்கிறது.
- source_word: מִזְבַּח אֲבָנִים שְׁלֵמוֹת
  choice: முழுக் கற்களால் அந்தப் பலிபீடம்
  rationale: שְׁלֵמוֹת என்பதன் ‘முழுமையாக, சேதப்படாமல் உள்ள’ அடிப்படைப் படிமத்தைப் பாதுகாக்கிறது; ‘செதுக்கப்படாத’ என்பது பொருத்தமான விளக்க மாற்றாக அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: לֹא הֵנִיף עֲלֵיהֶן בַּרְזֶל
  choice: இரும்புக் கருவி படாத
  rationale: சொல்லுக்கு சொல் ‘அவற்றின்மேல் இரும்பை உயர்த்தாத’ என்ற எபிரேய மரபுத்தொடரின் கட்டுமானப் பொருளைச் சுருக்கமாகவும் தெளிவாகவும் தெரிவிக்கிறது.
- source_word: וַיַּעֲלוּ עָלָיו עֹלוֹת
  choice: அதன்மேல் தகன பலிகளைச் செலுத்தி
  rationale: முழுவதும் எரிக்கப்படும் பலிவகையைத் துல்லியமாகக் குறிக்கிறது; ‘மேலே ஏறச்செய்தல்’ என்ற வினையின் பலிசார் பயன்பாட்டை இயல்பான தமிழில் ‘செலுத்துதல்’ என வழங்குகிறது.
- source_word: וַיִּזְבְּחוּ שְׁלָמִים
  choice: சமாதான பலிகளையும் பலியிட்டார்கள்
  rationale: שְׁלָמִים என்பதற்கான அறியப்பட்ட பலிசார் சொல்லைத் தக்கவைக்கிறது; நல்லுறவு மற்றும் நலவாழ்வு சார்ந்த பரந்த பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
theological_decisions:
- issue: יְהוָה என்ற தேவனுடைய பெயர்
  choice: யாவே
  alternative: யெகோவா; ஆண்டவர்
  rationale: மூல உரை பொதுப்பட்டத்தை அல்ல, நான்கு எழுத்துகளாலான தனிப்பெயரைப் பயன்படுத்துவதால் அதைத் தமிழில் ஒலிபெயர்த்துக் காக்கிறது.
- issue: בְּנֵי יִשְׂרָאֵל என்ற கூட்டுச் சொற்றொடர்
  choice: இஸ்ரவேல் மக்கள்
  alternative: இஸ்ரவேலின் மகன்கள்
  rationale: இது இஸ்ரவேல் சமூகத்தைக் குறிக்கும் எபிரேய மரபுத்தொடர். சொல்லெழுத்தான ‘மகன்கள்’ தமிழில் ஆண்களை மட்டும் குறிக்கும் தவறான எண்ணத்தை உருவாக்கக்கூடும்.
- issue: שְׁלָמִים என்ற பலிவகையின் பொருள்
  choice: சமாதான பலிகள்
  alternative: நல்லுறவுப் பலிகள்; நலவாழ்வுப் பலிகள்
  rationale: ஒரே தமிழ்ச்சொல் இதன் சமாதானம், முழுநலம், நல்லுறவு ஆகிய முழுப் பொருள் வீச்சையும் பிடிக்காது. முதன்மை உரையில் அறியப்பட்ட பெயரை வைத்து, மாற்றுப் பொருள்களை அடிக்குறிப்பில் வெளிப்படையாகக் காக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான வேதாகம நடையைப் பயன்படுத்துகிறது. எபிரேய வசனம் முந்தைய வசனத்தின் ‘பலிபீடத்தைக் கட்டினான்’ என்ற வினையைத் தொடர்ந்து நிற்பதால், தனி வசனமாகத் தமிழில் தெளிவாக வாசிக்க அந்த வினை இங்கே வெளிப்படையாக மீள்கூறப்பட்டுள்ளது. அடிக்குறிப்பு குறிகள் அவை விளக்கும் சொற்களுக்குப் பின்னரே வைக்கப்பட்டுள்ளன.
