  text: But they captured the king of Ai alive and brought him to Joshua[a].
translation:
  language: ta
  text: ஆனால் ஆயியின் அரசனை உயிரோடு பிடித்து, யோசுவாவிடம் கொண்டுவந்தார்கள்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மேலும், ஆயியின் அரசனை உயிரோடு பிடித்து, யோசுவாவிடம் கொண்டுவந்தார்கள்.”
    reason: וְ என்ற இணைப்புச்சொல் எதிர்மறைத் திருப்பாக ‘ஆனால்’ என்றும், எளிய நிகழ்ச்சித் தொடராக ‘மேலும்’ என்றும் புரிந்துகொள்ளப்படலாம்.
lexical_decisions:
- source_word: וְ/אֶת
  choice: ஆனால்
  rationale: இணைப்புச்சொல் நிகழ்வுகளின் தொடர்ச்சியைச் சுட்டினாலும், சுற்றியுள்ள கொலைச் சூழலுக்கு மாறாக அரசன் உயிரோடு பிடிக்கப்பட்டதை இங்கு முன்னிறுத்துவதால் ‘ஆனால்’ இயல்பாக உள்ளது; ‘மேலும்/அவர்கள்’ எனத் தொடராக மொழிபெயர்ப்பதும் சாத்தியம்.
- source_word: מֶלֶךְ הָעַי
  choice: ஆயியின் அரசனை
  rationale: எபிரெய கட்டமைப்பு ‘ஆயியின் அரசன்’ என்று இடத்துக்கும் அரசனுக்கும் உள்ள உறவை நேரடியாகக் குறிக்கிறது.
- source_word: תָּפְשׂוּ
  choice: பிடித்து
  rationale: போர்ச் சூழலில் ஒருவரைக் கைப்பற்றுவதைக் குறிக்கும் வினை; நவீன தமிழில் ‘பிடித்து’ தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: חָי
  choice: உயிரோடு
  rationale: அரசன் கொல்லப்படாமல் உயிருடன் பிடிக்கப்பட்டான் என்பதைக் காட்டும் பயனிலைப் பெயரடை.
- source_word: וַיַּקְרִבוּ אֹתוֹ אֶל יְהוֹשֻׁעַ
  choice: யோசுவாவிடம் கொண்டுவந்தார்கள்
  rationale: קרב என்பதன் காரணவினை வடிவம் ‘அருகில் கொண்டுவருதல்’ என்ற அடிப்படை நுணுக்கம் கொண்டது; இலக்காகிய யோசுவாவிடம் கொண்டுவந்ததை இயல்பான தமிழில் இவ்வாறு தெரிவிக்கிறது.
