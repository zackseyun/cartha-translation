base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/019.yaml
  text: Then the ambush rose quickly from its place and ran as soon as he stretched out his hand; they entered the city[a], captured it, and quickly set the city on fire.
translation:
  language: ta
  text: 'பதுங்கியிருந்த படையினர் தங்கள் இடத்திலிருந்து விரைவாக எழுந்து, அவன் தன் கையை நீட்டியவுடனே[a] ஓடினார்கள். அவர்கள் நகரத்திற்குள் நுழைந்து அதைக் கைப்பற்றினார்கள்; பின்னர் விரைந்து நகரத்திற்குத் தீ வைத்தார்கள்.


    [a] அல்லது, “அவன் தன் கையை நீட்டியபோது.” எபிரெயச் சொற்றொடர் யோசுவாவின் சைகை கொடுக்கப்பட்ட நேரத்தைக் குறிக்கிறது; அது உடனடித் தொடர்ச்சியையோ பொதுவான காலத் தொடர்பையோ உணர்த்தலாம்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவன் தன் கையை நீட்டியபோது.” எபிரெயச் சொற்றொடர் யோசுவாவின் சைகை கொடுக்கப்பட்ட நேரத்தைக் குறிக்கிறது; அது உடனடித் தொடர்ச்சியையோ பொதுவான காலத் தொடர்பையோ உணர்த்தலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאוֹרֵב
  choice: பதுங்கியிருந்த படையினர்
  rationale: இது பதுங்கித் தாக்கக் காத்திருந்த படையை ஒரு குழுவாகக் குறிக்கிறது. தொடர்ந்து வரும் பன்மை வினைகளுக்கு இயல்பாகப் பொருந்துமாறு படையினரை வெளிப்படையாகக் குறிப்பிடுகிறது.
- source_word: קָם מְהֵרָה מִמְּקוֹמוֹ
  choice: தங்கள் இடத்திலிருந்து விரைவாக எழுந்து
  rationale: קום இங்கு மறைவிடத்திலிருந்து செயல்பட எழுவதையும், מְהֵרָה வேகத்தையும் குறிக்கிறது. எபிரெயத்தில் குழு ஒருமையாகக் கருதப்பட்டாலும், தமிழில் ‘படையினர்’ என்பதுடன் ‘தங்கள்’ இயல்பாக அமைகிறது.
- source_word: וַיָּרֻצוּ
  choice: ஓடினார்கள்
  rationale: ரוץ என்பதன் நேரடியான பொருளான ஓடுதலைப் பாதுகாக்கிறது; ‘பாய்ந்தார்கள்’ போன்ற கூடுதல் தீவிரத்தைச் சேர்க்கவில்லை.
- source_word: כִּנְטוֹת יָדוֹ
  choice: அவன் தன் கையை நீட்டியவுடனே
  rationale: כ + infinitive construct இங்கு காலத் தொடர்பைக் குறிக்கிறது; சூழலில் சைகைக்கு உடனான நடவடிக்கையை முதன்மை மொழிபெயர்ப்பு வெளிப்படுத்துகிறது. எளிய ‘நீட்டியபோது’ என்ற சாத்தியமும் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: וַיָּבֹאוּ הָעִיר
  choice: நகரத்திற்குள் நுழைந்து
  rationale: בוא உடன் வரும் நகரை இலக்காகக் குறிக்கும் அமைப்பை இயல்பான நவீனத் தமிழில் வழங்குகிறது.
- source_word: וַיִּלְכְּדוּהָ
  choice: அதைக் கைப்பற்றினார்கள்
  rationale: לכד ஒரு நகரை இராணுவ நடவடிக்கையால் பிடித்துக் கொள்வதைக் குறிக்கிறது; ‘கைப்பற்றுதல்’ அதற்கான துல்லியமான தமிழ் வழக்கு.
- source_word: וַיְמַהֲרוּ
  choice: விரைந்து
  rationale: அடுத்த செயல் தாமதமின்றி செய்யப்பட்டதை வினையடை வடிவில் இயல்பாகக் காட்டுகிறது.
- source_word: וַיַּצִּיתוּ אֶת הָעִיר בָּאֵשׁ
  choice: நகரத்திற்குத் தீ வைத்தார்கள்
  rationale: Hiphil வடிவின் எரியச் செய்தல் என்ற காரணவினைப் பொருளை நவீனத் தமிழின் இயல்பான சொற்றொடரால் தருகிறது.
