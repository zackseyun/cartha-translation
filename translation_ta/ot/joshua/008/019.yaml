translation_notes:
  register: நவீனத் தரத் தமிழில் தெளிவான, கண்ணியமான வரலாற்று உரைநடை பயன்படுத்தப்பட்டுள்ளது. இராணுவச் சூழல் வெளிப்படையாக இருந்தாலும், மூலத்தில் இல்லாத தீவிர விவரங்கள் சேர்க்கப்படவில்லை. ‘அவன்’ என்பது மூலத்தின் மூன்றாம் நபர் ஒருமைப் பெயர்ப்பதிலியைப் பாதுகாக்கிறது; அதன் குறிப்பு முந்தைய சூழலில் யோசுவா.
