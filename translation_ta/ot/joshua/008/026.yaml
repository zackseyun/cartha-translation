revisions:
- from: யோசுவா, தாம் ஈட்டியுடன் நீட்டியிருந்த தமது கையைப் பின்வாங்கவில்லை; ஆயி நகரில் வாழ்ந்த அனைவரையும் அழிவுக்கென ஒதுக்கும்வரை[a] அவர் அதை நீட்டியபடியே வைத்திருந்தார்.
  to: யோசுவா, ஈட்டியைப் பிடித்து நீட்டியிருந்த தன் கையை, ஆயியில் குடியிருந்த அனைவரையும் அழிவுக்கென அர்ப்பணித்து முற்றிலும் அழிக்கும்வரை, பின்வாங்கவில்லை.[a]
  rationale: திருத்தம் மூலத்தின் ஒரே முதன்மை வினை அமைப்பைத் தக்கவைத்து, தேவையற்ற மறுஉரையை நீக்குகிறது. ‘அழிவுக்கென அர்ப்பணித்து முற்றிலும் அழிக்கும்வரை’ என்பது חרם-ன் தொழில்நுட்ப ‘அழிவுக்காக அர்ப்பணித்தல்’ நுணுக்கத்தையும் இவ்வசனத்தில் தேவைப்படும் செயல் நிறைவு பொருளையும் காக்கிறது. அடிக்குறிப்பு மாற்று மொழிபெயர்ப்பைச் சுருக்கமாக வழங்கி, சிக்கலான சொல்லியல் பொருளைத் தெளிவுபடுத்துகிறது.
