  text: וִ/יהוֹשֻׁ֨עַ֙ לֹֽא הֵשִׁ֣יב יָד֔/וֹ אֲשֶׁ֥ר נָטָ֖ה בַּ/כִּיד֑וֹן עַ֚ד אֲשֶׁ֣ר הֶחֱרִ֔ים אֵ֖ת כָּל יֹשְׁבֵ֥י הָ/עָֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/026.yaml
  text: And Joshua did not draw back his hand[a], which he had stretched out with the javelin, until he had devoted all the inhabitants of Ai to destruction.
translation:
  language: ta
  text: யோசுவா, ஈட்டியைப் பிடித்து நீட்டியிருந்த தன் கையை, ஆயியில் குடியிருந்த அனைவரையும் அழிவுக்கென அர்ப்பணித்து முற்றிலும் அழிக்கும்வரை, பின்வாங்கவில்லை.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஆயியில் குடியிருந்த அனைவரையும் முற்றிலும் அழிக்கும்வரை.” எபிரெய வினைச்சொல், ஒருவரை அல்லது ஒன்றை அழிவுக்காக அர்ப்பணித்தல் என்ற சிறப்புப் பொருளையும் கொண்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵשִׁיב
  choice: பின்வாங்கவில்லை
  rationale: இங்கு שוב என்பதன் ஹிஃபில் வடிவம் ‘திரும்பச் செய்தல்’ அல்லது ‘பின்னே கொண்டுவருதல்’ எனப் பொருள்படும். போர்ச் சூழலில் கையைப் பற்றிக் கூறப்படுவதால், ‘பின்வாங்கவில்லை’ என்பது இயல்பாகவும் பொருள்துல்லியமாகவும் உள்ளது.
- source_word: יָדוֹ
  choice: தமது கையை
  rationale: இது நேரடியான உடலுறுப்புக் குறிப்பு. யோசுவாவைக் குறிக்கும் மரியாதை ஒருமைத் தொடர்ச்சிக்காக ‘தமது’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: נָטָה
  choice: நீட்டியிருந்த
  rationale: இந்த வினை ‘நீட்டு’ அல்லது ‘விரி’ எனப் பொருள்படும். ஏற்கெனவே நீட்டப்பட்டிருந்த கையைக் குறிக்கும் தொடர்புச் சொல்லாக்கத்திற்கு ‘நீட்டியிருந்த’ பொருந்துகிறது.
- source_word: בַּכִּידוֹן
  choice: ஈட்டியுடன்
  rationale: כידון என்பது எறியீட்டி அல்லது ஈட்டி வகையான ஆயுதத்தைக் குறிக்கிறது. நவீனத் தமிழில் தெளிவாகவும் இயல்பாகவும் இருப்பதால் ‘ஈட்டி’ தேர்ந்தெடுக்கப்பட்டது; உடனிகழ்வைக் காட்ட ‘-யுடன்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: הֶחֱרִים
  choice: அழிவுக்கென ஒதுக்கும்வரை
  rationale: חרם என்பதன் ஹிஃபில் வடிவம் தடையாணைக்குட்படுத்தி அழிவுக்கு அர்ப்பணித்தல் அல்லது முற்றாக அழித்தல் என்ற சிறப்புப் பொருளைக் கொண்டது. ‘அழிவுக்கென ஒதுக்கு’ என்பது வெறும் ‘அழித்தார்’ என்பதைவிட அந்தச் சட்ட-இறையியல் நுணுக்கத்தைப் பாதுகாக்கிறது.
- source_word: כָּל יֹשְׁבֵי הָעָי
  choice: ஆயி நகரில் வாழ்ந்த அனைவரையும்
  rationale: יֹשְׁבֵי என்பது அங்கு குடியிருப்போர் அல்லது வாழ்பவர்களைக் குறிக்கிறது. ‘ஆயி நகரில் வாழ்ந்த அனைவரும்’ என்பது சாதாரண நவீனத் தமிழில் தெளிவான வடிவம்.
- source_word: וִיהוֹשֻׁעַ
  choice: யோசுவா
  rationale: தனிப்பெயரின் வழக்கமான தமிழாக்கம். முந்தைய உரையுடன் இணைக்கும் ו இங்கு தமிழ் வாக்கிய ஓட்டத்தில் தனியாக ‘மேலும்’ என மொழிபெயர்க்கப்பட வேண்டிய அவசியமில்லை.
theological_decisions:
- issue: போர்த் தீர்ப்புச் சூழலில் חרם என்பதன் மொழிபெயர்ப்பு
  choice: அழிவுக்கென ஒதுக்குதல்
  alternative: முற்றிலும் அழித்தல்
  rationale: தேர்ந்த வடிவம் அழித்தல் என்ற நிகழ்வை மட்டுமல்லாமல், அழிவுக்காகத் தனியே ஒதுக்குதல் என்ற எபிரெயச் சொல்லின் சிறப்பு நுணுக்கத்தையும் பாதுகாக்கிறது. எந்தச் சமயப்பிரிவின் தனிப்பட்ட விளக்கத்தையும் உரைக்குள் சேர்க்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், மரியாதையும் வாசிப்புத் தெளிவும் கொண்ட நடை. எபிரெய மூலத்தின் போர்ச் சூழலையும் חרם என்பதன் திட்டமிட்ட இரட்டைப் பொருள் நுணுக்கத்தையும் காக்கும் வகையில் உரையும் அடிக்குறிப்பும் அமைக்கப்பட்டுள்ளன.
