base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/020.yaml
  text: Then the men of Ai turned behind them and looked[a], and behold, the smoke of the city was going up to the sky, and there was no power in them to flee this way or that[c][b]. And the people who had fled to the wilderness turned back against the pursuer.
translation:
  language: ta
  text: அப்போது ஆயி நகரின் ஆண்கள் பின்னால் திரும்பிப் பார்த்தார்கள். இதோ, நகரத்தின் புகை வானத்தை நோக்கி எழும்பிக்கொண்டிருந்தது[a]. இங்கோ அங்கோ தப்பியோட அவர்களுக்கு வலிமை இல்லாமல் போனது[b]. வனாந்தரத்தை நோக்கித் தப்பியோடியிருந்த மக்களோ, தங்களைத் துரத்திவந்த படையை எதிர்த்துத் திரும்பினார்கள்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், ‘வானத்தை நோக்கி’ அல்லது ‘வானம் நோக்கி.’
    reason: lexical_alternative
  - marker: b
    text: எபிரெய மரபுத்தொடர் சொல்லுக்கு சொல், ‘அவர்களிடம் கைகள் இல்லை.’ அதாவது, தப்பிச் செல்ல அவர்களுக்குச் சக்தியோ திறனோ இல்லை.
    reason: cultural_note
  - marker: c
    text: எபிரெய மூலத்தில் ‘துரத்துகிறவன்’ என்று ஒருமையில் உள்ளது; அது துரத்திவந்த படையினரை மொத்தமாகக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְנוּ אַנְשֵׁי הָעַי אַחֲרֵיהֶם וַיִּרְאוּ
  choice: ஆயி நகரின் ஆண்கள் தங்களுக்குப் பின்னால் திரும்பிப் பார்த்தார்கள்
  rationale: பנה மற்றும் ראה ஆகிய இரு தொடர்ச்சியான செயல்களையும் ‘திரும்பிப் பார்த்தார்கள்’ என்ற இயல்பான தமிழ்த் தொடரில் வெளிப்படுத்துகிறது; אַחֲרֵיהֶם என்பதன் பின்புறத் திசையும் தெளிவாக உள்ளது.
- source_word: וְהִנֵּה
  choice: இதோ
  rationale: திடீரென அவர்கள் உணர்ந்த காட்சிக்குக் கவனம் ஈர்க்கும் எபிரெய உரையாடல் குறியின் வலிமையை, உயர்வானதாயினும் இயல்பான தமிழில் காக்கிறது.
- source_word: עָלָה עֲשַׁן הָעִיר הַשָּׁמַיְמָה
  choice: நகரத்தின் புகை வானத்தை நோக்கி எழும்பிக்கொண்டிருந்தது
  rationale: עָלָה என்பதன் நடைபெற்று வந்த இயக்கத்தை ‘எழும்பிக்கொண்டிருந்தது’ என்றும், திசைச் சுட்டும் הַשָּׁמַיְמָה என்பதை இறையியல் மேலொலி இல்லாத ‘வானத்தை நோக்கி’ என்றும் தருகிறது.
- source_word: וְלֹא הָיָה בָהֶם יָדַיִם
  choice: அவர்களுக்கு வலிமை இல்லாமல் போனது
  rationale: சொல்லுக்கு சொல் ‘அவர்களிடம் கைகள் இல்லை’ எனும் எபிரெய மரபுத்தொடர் செயற்படவோ தப்பவோ இயலாமையைக் குறிக்கிறது. தமிழில் அதன் பொருளைத் தெளிவாகவும் சூழலுக்கேற்றவாறும் தருகிறது.
- source_word: לָנוּס הֵנָּה וָהֵנָּה
  choice: இங்கோ அங்கோ தப்பியோட
  rationale: இரு திசைகளையும் சுட்டும் இணை அடைமொழிகளை நெருக்கமாகக் காத்து, எந்தப் பக்கமும் தப்ப முடியாத நிலையை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: וְהָעָם הַנָּס הַמִּדְבָּר
  choice: வனாந்தரத்தை நோக்கித் தப்பியோடியிருந்த மக்கள்
  rationale: முன்னதாக வனாந்தரத் திசையில் பின்வாங்கியிருந்த குழுவைச் சுட்டும் பெயரெச்சத் தொடரை, நிகழ்வுகளின் காலவரிசையைத் தெளிவாக்கும் முறையில் மொழிபெயர்க்கிறது.
- source_word: נֶהְפַּךְ אֶל הָרֹדֵף
  choice: தங்களைத் துரத்திவந்த படையை எதிர்த்துத் திரும்பினார்கள்
  rationale: נֶהְפַּךְ என்பதன் திசைமாற்றத்தையும் போர்ச் சூழலில் אֶל கொண்டுள்ள எதிர்த்துச் செல்லும் பொருளையும் தருகிறது. ஒருமையான הָרֹדֵף கூட்டுப்பொருளில் வந்திருப்பதை ‘படை’ எனத் தெளிவாக்குகிறது.
