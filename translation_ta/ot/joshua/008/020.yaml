translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான வரலாற்று நடையைப் பயன்படுத்துகிறது. ‘வனாந்தரம்’ என்பது வேதாகமச் சூழலுக்கேற்ற பரவலாக அறியப்பட்ட சொல். போர்ச் சூழலைத் தெளிவாக்க ‘துரத்திவந்த படை’ பயன்படுத்தப்பட்டாலும், மூலத்தின் ஒருமை வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது. அனைத்து அடிக்குறிப்பு குறிகளும் தொடர்புடைய முதன்மை உரைப் பகுதிகளில் இடப்பட்டுள்ளன.
