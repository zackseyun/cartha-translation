  source_fidelity: 'முதன்மை உரை எபிரெய வாக்கியத்தின் நிகழ்வுவரிசையையும் பொருளையும் நன்றாகக் காக்கிறது: ஆயி மனிதர் பின்னால் திரும்பிப் பார்ப்பது, நகரப் புகை வானத்தை நோக்கி எழுவது, தப்பும் திறன் இல்லாமை, வனாந்தரத் திசையில் ஓடிய மக்கள் துரத்துபவருக்கு எதிராகத் திரும்புதல் ஆகியவை அனைத்தும் துல்லியமாக உள்ளன. இருப்பினும் அடிக்குறிப்பு a-வில் உள்ள ‘வானத்தை எட்டுமாறு’ என்பது הַשָּׁמַיְמָה என்பதன் நேரடியான மாற்றல்ல; அது ‘வானத்தை நோக்கி/வானத்தைச் சார்ந்து’ என்பதே.'
