  yaml_path: translation/ot/joshua/008/002.yaml
  text: And you shall do to Ai and its king as you did to Jericho and its king[a]. Only its spoil and its livestock you may plunder for yourselves[b]. Set an ambush for yourself behind the city.
translation:
  language: ta
  text: நீ எரிகோவுக்கும் அதன் அரசனுக்கும் செய்ததுபோலவே ஆயிக்கும் அதன் அரசனுக்கும் செய்ய வேண்டும். ஆனால் அதன் கொள்ளைப்பொருளையும் கால்நடைகளையும் உங்களுக்காகக் கொள்ளையிடலாம்.[a] நகருக்குப் பின்னால் பதுங்கித் தாக்கும் படையை நிறுத்தி வை.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உங்களுக்காகக் கொள்ளையிடுவீர்கள்.” எபிரெய வடிவத்தை நேரடியான எதிர்காலக் கூற்றாகவோ அதிகாரமளிக்கும் அறிவுறுத்தலாகவோ புரிந்துகொள்ளலாம். எரிகோவில் கொள்ளை தடைசெய்யப்பட்டதற்கு மாறாக இங்கு அனுமதி அளிக்கப்படுவதைக் காட்ட பிரதான உரையில் “கொள்ளையிடலாம்” என மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “ஒரு பதுங்கித் தாக்குதலை அமை.” எபிரெய ஒருமை வடிவம் பதுங்கித் தாக்குதலை ஒரு திட்டமாகவோ, பதுங்கித் தாக்கும் படையை ஒரு கூட்டாகவோ குறிக்கலாம்.
    reason: lexical_alternative
