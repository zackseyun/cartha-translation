  yaml_path: translation/ot/joshua/008/007.yaml
  text: Then you shall rise up from the ambush and take the city[a], for Yahweh your God will give it into your hand.
translation:
  language: ta
  text: நீங்களோ பதுங்கியிருக்கும் இடத்திலிருந்து எழுந்து, நகரத்தைக் கைப்பற்றுங்கள்[a]. ஏனெனில் உங்கள் கடவுளாகிய யாவே அதை உங்கள் கையில் தருவார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நகரத்தை உங்கள் உடைமையாக்கிக்கொள்ளுங்கள்.” எபிரெய வினைச்சொல் இராணுவ ரீதியில் கைப்பற்றுவதை மட்டுமல்லாமல், ஒன்றை உடைமையாகப் பெறுவதையும் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: תָּקֻמוּ
  choice: எழுந்து
  rationale: קום என்பதன் Qal imperfect 2mp வடிவம்; போர்த் திட்டத்தின் தொடரில் மறைவிடத்திலிருந்து செயல்படத் தொடங்கும் கட்டளையாக இருப்பதால் இயல்பான தமிழ் வினையெச்சமாக மொழிபெயர்க்கப்பட்டது.
- source_word: מֵהָאוֹרֵב
  choice: பதுங்கியிருக்கும் இடத்திலிருந்து
  rationale: אֹרֵב என்பது தாக்குவதற்காக மறைந்து காத்திருத்தலையோ அத்தகைய பதுங்கிடத்தையோ குறிக்கலாம். சூழலில் படையினர் மறைந்திருக்கும் இடம் நோக்கமாக இருப்பதால் இந்த இயல்பான தமிழ் சொற்றொடர் தேர்ந்தெடுக்கப்பட்டது.
- source_word: וְהוֹרַשְׁתֶּם אֶת־הָעִיר
  choice: நகரத்தைக் கைப்பற்றுங்கள்
  rationale: ירשׁ என்பதன் Hiphil வடிவம் உடைமையாக்குதல் அல்லது கைப்பற்றுதல் என்ற பொருளைக் கொண்டது. இங்கு இராணுவச் சூழலையும் உடைமை பெறும் கருத்தையும் ‘கைப்பற்றுங்கள்’ சுருக்கமாக வெளிப்படுத்துகிறது; பரந்த மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: וּנְתָנָהּ
  choice: அதை ... தருவார்
  rationale: கட்டளைத் தொடருக்குப் பின் வரும் conjunction உடனான perfect வடிவம் உறுதியான எதிர்கால விளைவைக் குறிக்கிறது; ஆகவே தமிழில் எதிர்கால வினையாகத் தரப்பட்டது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய தனிப்பெயரான יהוה-ஐ ஒரு பட்டப்பெயராக மாற்றாமல், நவீன தமிழில் தெளிவான ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: אֱלֹהֵיכֶם
  choice: உங்கள் கடவுளாகிய
  rationale: இரண்டாம் நபர் பன்மை உடைமைப் பின்னொட்டுடன் உள்ள construct வடிவத்தை நேரடியாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: בְּיֶדְכֶם
  choice: உங்கள் கையில்
  rationale: ஒருவரின் அதிகாரத்திற்குள் ஒப்படைப்பதைக் குறிக்கும் எபிரெய மொழிமரபை புரிந்துகொள்ளக்கூடிய தமிழில் அப்படியே பாதுகாக்கிறது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூலத்தில் பட்டப்பெயர் அல்ல, நான்கெழுத்து இறைத் தனிப்பெயரே இடம்பெறுகிறது. எனவே தனிப்பெயரை மறைக்காமல் தமிழில் ஒலிபெயர்க்கப்பட்டது.
- issue: நகரம் கைப்பற்றப்படுவதில் மனிதச் செயலும் இறைவனின் கொடையும்
  choice: கட்டளையையும் யாவே நகரத்தை அவர்கள் கையில் தருவார் என்ற வாக்குறுதியையும் இணையாகப் பாதுகாத்தல்
  alternative: இரண்டில் ஒன்றை மட்டும் வலியுறுத்தும் விரிவுரை
  rationale: மூலவசனம் படையினரின் செயலைக் கட்டளையிடுவதோடு அதன் வெற்றியை யாவேயின் கொடையாகவும் கூறுகிறது; அந்த இறையியல் அழுத்தம் விளக்கமின்றி பாதுகாக்கப்பட்டது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘பதுங்கியிருக்கும் இடம்’ இராணுவ மறைவிடத்தை இயல்பாகக் குறிக்கிறது; ‘உங்கள் கையில் தருவார்’ என்ற சொற்றொடர் எபிரெய மொழிமரபைத் தக்கவைத்தும் தமிழில் புரிந்துகொள்ளத்தக்கதாகவும் உள்ளது.
