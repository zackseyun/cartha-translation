revisions:
- from: இஸ்ரவேலர் அனைவரும்—அவர்களுடைய மூப்பர்களும் அதிகாரிகளும் நீதிபதிகளும், குடியேறிய அந்நியரும் நாட்டில் பிறந்தவரும் ஒரேபோல[a]—யாவேயின் உடன்படிக்கைப் பெட்டியைச் சுமந்த லேவிய ஆசாரியர்களுக்கு எதிரே, பெட்டியின் இருபுறங்களிலும் நின்றார்கள். அவர்களில் பாதிப்பேர் கெரிசீம் மலைக்கு எதிராகவும், மறுபாதிப்பேர் ஏபால் மலைக்கு எதிராகவும் நின்றார்கள். யாவேயின் ஊழியனாகிய மோசே முதலில்[b] கட்டளையிட்டபடியே, இஸ்ரவேல் மக்களை ஆசீர்வதிப்பதற்காக அவர்கள் இவ்வாறு நின்றார்கள்.
  to: இஸ்ரவேலர் அனைவரும், அவர்களுடைய மூப்பர்கள், அதிகாரிகள், நீதிபதிகள், குடியிருக்கும் அந்நியர், நாட்டில் பிறந்தவர் ஆகியோர் ஒரேபோல[a], யாவேயின் உடன்படிக்கைப் பெட்டியைச் சுமந்த லேவிய ஆசாரியர்களுக்கு எதிரே, பெட்டியின் இருபுறங்களிலும் நின்றார்கள். அவர்களில் பாதிப்பேர் கெரிசீம் மலைக்கு எதிரிலும், மறுபாதிப்பேர் ஏபால் மலைக்கு எதிரிலும் நின்றார்கள். இஸ்ரவேல் மக்களை ஆசீர்வதிக்கும்படி, யாவேயின் ஊழியனாகிய மோசே முதலில்[b] கட்டளையிட்டபடியே இது நடந்தது.
  rationale: மோசேயின் கட்டளைக்கும் ஆசீர்வதித்தலுக்கும் இடையிலான மூலத் தொடரிணைப்பை மீட்டமைத்துள்ளேன்; மக்கள் நிற்றல் குறித்த கூடுதல் நோக்குக் கருத்தை நீக்கியுள்ளேன். மலைகளுக்கு முன்பாக அமைந்திருந்த இடவியல் உறவை ‘எதிரில்’ எனத் தெளிவுபடுத்தியுள்ளேன். בָּרִאשֹׁנָה என்பதன் தீர்மானிக்கப்படாத நுணுக்கம் உரையிலும் அடிக்குறிப்பிலும் பாதுகாக்கப்பட்டுள்ளது.
