  source_fidelity: திருத்தம் தேவை. வரைவு, இறுதி நோக்குநிலையை ‘அவர்கள் இவ்வாறு நின்றார்கள்’ என்பதோடு இணைத்து, ஆசீர்வதித்தல் அவர்களுடைய நிற்றலின் நோக்கம் எனக் காட்டுகிறது. எபிரெயத்தில் ‘இஸ்ரவேல் மக்களை ஆசீர்வதிக்கும்படி’ என்பது மோசே கொடுத்த கட்டளையோடு இணைகிறது. மேலும் ‘எதிராக’ இங்கு மோதல் அல்லது எதிர்ப்பின் நிழற்பொருளைத் தரலாம்; இடவியல் பொருளான ‘எதிரில்’ பொருத்தமானது.
