base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/033.yaml
  text: And all Israel[a], with its elders, officers, and judges, was standing on this side and on that side of the ark, opposite the Levitical priests carrying the ark of the covenant of Yahweh, both the sojourner and the native-born alike. Half of them were in front of Mount Gerizim and half of them in front of Mount Ebal, just as Moses the servant of Yahweh had commanded at the first[b], to bless the people of Israel.
translation:
  language: ta
  text: இஸ்ரவேலர் அனைவரும், அவர்களுடைய மூப்பர்கள், அதிகாரிகள், நீதிபதிகள், குடியிருக்கும் அந்நியர், நாட்டில் பிறந்தவர் ஆகியோர் ஒரேபோல[a], யாவேயின் உடன்படிக்கைப் பெட்டியைச் சுமந்த லேவிய ஆசாரியர்களுக்கு எதிரே, பெட்டியின் இருபுறங்களிலும் நின்றார்கள். அவர்களில் பாதிப்பேர் கெரிசீம் மலைக்கு எதிரிலும், மறுபாதிப்பேர் ஏபால் மலைக்கு எதிரிலும் நின்றார்கள். இஸ்ரவேல் மக்களை ஆசீர்வதிக்கும்படி, யாவேயின் ஊழியனாகிய மோசே முதலில்[b] கட்டளையிட்டபடியே இது நடந்தது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'வேறு வகையில்: “குடியிருக்கும் அந்நியரும் பிறப்பால் நாட்டைச் சேர்ந்தவரும்.”'
    reason: גֵּר மற்றும் אֶזְרָח ஆகிய சொற்களின் சமூக நிலையை இன்னும் வெளிப்படையாகக் காட்டும் மாற்று மொழிபெயர்ப்பு.
  - marker: b
    text: எபிரெயத்தில் “முதலில்.” இது “முதல் செயலாக” என்று பொருள்படலாம்; அல்லது ஆசீர்வாதம் குறித்த மோசேயின் முந்தைய கட்டளையைச் சுட்டலாம்.
    reason: காலவினையடை எந்தச் செயலுடன் தொடர்புடையது என்பது மூலத்தில் தெளிவாகத் தீர்மானிக்கப்படவில்லை.
lexical_decisions:
- source_word: וְכָל יִשְׂרָאֵל
  choice: இஸ்ரவேலர் அனைவரும்
  rationale: முழு உடன்படிக்கைச் சமூகத்தையும் குறிக்கும் கூட்டு உணர்வைப் பேணும் இயல்பான நவீனத் தமிழ் வடிவம்.
- source_word: וּזְקֵנָיו וְשֹׁטְרִים וְשֹׁפְטָיו
  choice: அவர்களுடைய மூப்பர்களும் அதிகாரிகளும் நீதிபதிகளும்
  rationale: பின்னொட்டுகள் இஸ்ரவேலரை ஒரு சமூகமாகச் சுட்டுகின்றன; நிர்வாகச் சூழலில் שֹׁטְרִים என்பதற்கு ‘அதிகாரிகள்’ பொருத்தமானது.
- source_word: מִזֶּה וּמִזֶּה לָאָרוֹן
  choice: பெட்டியின் இருபுறங்களிலும்
  rationale: எபிரெயச் சொற்றொடரின் இடவியல் பொருளைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: הַכֹּהֲנִים הַלְוִיִּם
  choice: லேவிய ஆசாரியர்கள்
  rationale: ஆசாரியர்களை லேவியராக அடையாளப்படுத்தும் எபிரெயத் தொடரைச் சுருக்கமின்றி இயல்பாக வெளிப்படுத்துகிறது.
- source_word: נֹשְׂאֵי אֲרוֹן בְּרִית יְהוָה
  choice: யாவேயின் உடன்படிக்கைப் பெட்டியைச் சுமந்த
  rationale: நிகழ்வில் அவர்கள் செய்த செயலைக் குறிக்கும் எபிரெயப் பங்கேற்புச் சொல்லையும், யாவே என்ற தனிப்பெயரையும் நேரடியாகப் பேணுகிறது.
- source_word: כַּגֵּר כָּאֶזְרָח
  choice: குடியேறிய அந்நியரும் நாட்டில் பிறந்தவரும் ஒரேபோல
  rationale: இஸ்ரவேலில் வசிக்கும் அந்நியரும் பிறப்பால் நாட்டைச் சேர்ந்தவரும் சமமாகச் சேர்க்கப்பட்டதைத் தெளிவாக்குகிறது; பிற்காலத் தத்துவப் பிரிவுகளைச் சேர்க்கவில்லை.
- source_word: חֶצְיוֹ ... וְהַחֶצְיוֹ
  choice: அவர்களில் பாதிப்பேர் ... மறுபாதிப்பேர்
  rationale: மக்கள் இரண்டு பகுதிகளாகப் பிரிக்கப்பட்டனர் என்பதைத் தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: בָּרִאשֹׁנָה
  choice: முதலில்
  rationale: மூலத்தின் சுருக்கமான காலவினையடைச் சொல்லைத் தக்கவைத்து, அதன் பொருள் குறித்த இரு சாத்தியங்களையும் அடிக்குறிப்பில் அளிக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் வரும் உடன்படிக்கைத் தனிப்பெயரை ஒரு பொதுப் பட்டத்தால் மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
- issue: גֵּר மற்றும் אֶזְרָח ஆகிய சமூகப் பிரிவுகள்
  choice: குடியேறிய அந்நியரும் நாட்டில் பிறந்தவரும்
  alternative: அந்நியரும் சொந்த நாட்டவரும்
  rationale: வெளியிலிருந்து வந்து இஸ்ரவேலில் வசிப்பவருக்கும் பிறப்பால் நாட்டைச் சேர்ந்தவருக்கும் இடையிலான வேறுபாட்டையும், விழாவில் இருவரும் சமமாகச் சேர்க்கப்பட்டதையும் பேணுகிறது.
- issue: בָּרִאשֹׁנָה என்பதன் தொடர்பு
  choice: முதலில் என்ற சொல்லை உரையில் அப்படியே வைத்து விளக்கத்தை அடிக்குறிப்பில் தருதல்
  alternative: முதல் செயலாக / முன்பு
  rationale: இது ஆசீர்வதித்தலை முதல் செயலாகக் குறிக்கிறதா அல்லது மோசே முன்பு கொடுத்த கட்டளையைச் சுட்டுகிறதா என்பது தெளிவில்லாததால், ஒரு பொருளை மட்டும் உரையில் கட்டாயப்படுத்தவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான உரைநடை பயன்படுத்தப்பட்டுள்ளது. நீண்ட எபிரெய வாக்கியம் வாசிப்புத் தெளிவுக்காக மூன்று வாக்கியங்களாகப் பிரிக்கப்பட்டாலும், மக்கள், பெட்டி, ஆசாரியர்கள், இரு மலைகள், ஆசீர்வாதக் கட்டளை ஆகிய உறவுகள் பேணப்பட்டுள்ளன.
