base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/017.yaml
  text: And not a man was left in Ai or Bethel who did not go out after Israel[b][a], and they left the city open and pursued Israel.
translation:
  language: ta
  text: இஸ்ரவேலரைப் பின்தொடர்ந்து போகாத ஒருவர்கூட ஆயியிலோ பெத்தேலிலோ மீந்திருக்கவில்லை.[a] அவர்கள் நகரத்தைத் திறந்தபடியே விட்டுவிட்டு[b] இஸ்ரவேலரைத் துரத்திச் சென்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ஒருவர்கூட” என்பது எபிரெய மொழியிலுள்ள ஆண்பால் ஒருமைச் சொல்லான אִישׁ என்பதன் மொழிபெயர்ப்பு; இங்கு அது பொதுவாக எந்தவொரு நபரையும் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, பொருளை வெளிப்படையாகக் கூறினால், “நகரத்தைக் காவலின்றி விட்டுவிட்டு.” எபிரெய மூலத்தில் நேரடியாக “நகரத்தைத் திறந்தபடி” என்று உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: נִשְׁאַר אִישׁ
  choice: ஒருவர்கூட மீந்திருக்கவில்லை
  rationale: שׁאר என்பதன் ‘மீதியாயிரு/மீந்துவிடு’ என்ற பொருளையும், אִישׁ இங்கு பொதுப்படையாக ஒருவரைக் குறிக்கும் பயன்பாட்டையும் இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: בָּעַי וּבֵית אֵל
  choice: ஆயியிலோ பெத்தேலிலோ
  rationale: எதிர்மறை வாக்கியத்தில் -ஓ...-ஓ அமைப்பு, இரு இடங்களிலும் எவரும் மீந்திருக்கவில்லை என்பதைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: אֲשֶׁר לֹא יָצְאוּ אַחֲרֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலரைப் பின்தொடர்ந்து போகாத
  rationale: ‘பின்னால்/பின்தொடர்ந்து வெளியே போதல்’ என்ற எபிரெயச் சொற்றொடரின் இயக்கத்தையும் தொடர்புச் சொற்றொடர் அமைப்பையும் காக்கிறது.
- source_word: וַיַּעַזְבוּ
  choice: அவர்கள் ... விட்டுவிட்டு
  rationale: עזב என்பதன் அடிப்படைப் பொருளைச் சீரான தமிழ் கதைநடையில் தருகிறது; அடுத்த செயலுடன் இயல்பாக இணைகிறது.
- source_word: הָעִיר פְּתוּחָה
  choice: நகரத்தைத் திறந்தபடியே
  rationale: פְּתוּחָה என்பதன் நேரடியான ‘திறந்த’ உருவகத்தைப் பிரதான உரையில் காக்கிறது; சூழலில் ‘காவலின்றி’ என்ற உட்பொருள் அடிக்குறிப்பில் விளக்கப்படுகிறது.
- source_word: וַיִּרְדְּפוּ אַחֲרֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலரைத் துரத்திச் சென்றார்கள்
  rationale: רדף என்பதன் போர்ச் சூழலிலான துரத்துதல் பொருளை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
