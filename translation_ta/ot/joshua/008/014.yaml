translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான வரலாற்றுக் கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘அரபா’ என்ற நிலவியல் பெயர் முதன்மை உரையில் வைக்கப்பட்டு, பொதுப்பொருளான ‘சமவெளி’ அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது. மூலத்தின் பன்மை வினையும், மוֹעֵד என்பதன் இடம்/காலம் சார்ந்த நுணுக்கத்தில் சூழலுக்கு ஏற்ற இடப்பொருளும் கவனிக்கப்பட்டுள்ளன.
