  text: וַ/יְהִ֞י כִּ/רְא֣וֹת מֶֽלֶךְ הָ/עַ֗י וַֽ/יְמַהֲר֡וּ וַ/יַּשְׁכִּ֡ימוּ וַ/יֵּצְא֣וּ אַנְשֵֽׁי הָ/עִ֣יר לִ/קְרַֽאת יִ֠שְׂרָאֵל לַֽ/מִּלְחָמָ֞ה ה֧וּא וְ/כָל עַמּ֛/וֹ לַ/מּוֹעֵ֖ד לִ/פְנֵ֣י הָֽ/עֲרָבָ֑ה וְ/הוּא֙ לֹ֣א יָדַ֔ע כִּֽי אֹרֵ֥ב ל֖/וֹ מֵ/אַחֲרֵ֥י הָ/עִֽיר־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/014.yaml
  text: And it happened[a], when the king of Ai saw it, that they hurried and rose early, and the men of the city went out to meet Israel for battle, he and all his people, at the appointed place before the Arabah. But he did not know that an ambush was against him behind the city.
translation:
  language: ta
  text: ஆயியின் அரசன் அதைக் கண்டபோது, நகரத்தின் ஆண்கள் விரைந்து அதிகாலையில் எழுந்து, இஸ்ரவேலரைப் போரில் எதிர்கொள்ளப் புறப்பட்டார்கள்; அவனும் அவனுடைய மக்கள் அனைவரும் அரபாவுக்கு[a] முன்பாக உள்ள குறிக்கப்பட்ட இடத்திற்குச் சென்றார்கள். ஆனால், நகரத்துக்குப் பின்னால் தனக்கு எதிராக ஒரு பதுங்குப் படை இருப்பதை அவன் அறியவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சமவெளிக்கு முன்பாக.” இங்குள்ள எபிரெயச் சொல் அரபா பிரதேசத்தையோ, பொதுவாக ஒரு வறண்ட சமவெளி அல்லது புல்வெளியையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִּרְאוֹת
  choice: கண்டபோது
  rationale: வַיְהִי என்பது எபிரெயக் கதைநடையின் நிகழ்வுத் தொடரை அறிமுகப்படுத்துகிறது; தமிழில் தனியாக மொழிபெயர்த்தால் செயற்கையாக இருப்பதால், காலத்தைக் குறிக்கும் כִּרְאוֹת உடன் இயல்பான கதைநடையாக இணைக்கப்பட்டது.
- source_word: מֶלֶךְ הָעַי
  choice: ஆயியின் அரசன்
  rationale: இடப்பெயரும் அரசனுடனான உடைமைத் தொடர்பும் நவீனத் தமிழில் இயல்பாகத் தரப்பட்டுள்ளன.
- source_word: וַיְמַהֲרוּ וַיַּשְׁכִּימוּ
  choice: அவர்கள் விரைந்து அதிகாலையில் எழுந்தார்கள்
  rationale: இரண்டு வினைகளின் பன்மை வடிவமும், שׁכם என்பதன் ‘அதிகாலையில் எழுதல்’ என்ற பொருளும் பாதுகாக்கப்பட்டுள்ளன.
- source_word: וַיֵּצְאוּ אַנְשֵׁי הָעִיר
  choice: நகரத்திலிருந்து புறப்பட்டு
  rationale: அடுத்துள்ள ‘அரசனும் அவனுடைய மக்கள் அனைவரும்’ என்பதே புறப்பட்ட குழுவைத் தெளிவுபடுத்துவதால், தமிழில் தேவையற்ற மறுகூறலைத் தவிர்த்து நகரத்திலிருந்து புறப்படுதல் இயல்பாக அமைக்கப்பட்டது.
- source_word: לִקְרַאת יִשְׂרָאֵל לַמִּלְחָמָה
  choice: இஸ்ரவேலரைப் போரில் எதிர்கொள்ள
  rationale: לקראת என்பதன் ‘எதிர்கொள்ளச் செல்லுதல்’ என்ற இயக்கமும், לַמִּלְחָמָה என்பதன் போர்ச் சூழலும் ஒருங்கிணைக்கப்பட்டுள்ளன.
- source_word: הוּא וְכָל עַמּוֹ
  choice: அரசனும் அவனுடைய மக்கள் அனைவரும்
  rationale: עַם என்பதற்கு மூலத்தில் இல்லாத ‘படை’ என்ற குறுகிய பொருளைச் சேர்க்காமல் ‘மக்கள்’ என மொழிபெயர்க்கப்பட்டது; சுட்டுப்பெயரின் குழப்பத்தைத் தவிர்க்க ‘அரசன்’ மீண்டும் கூறப்பட்டது.
- source_word: לַמּוֹעֵד
  choice: குறிக்கப்பட்ட இடத்தில்
  rationale: מוֹעֵד காலத்தையோ இடத்தையோ குறிக்கலாம்; தொடர்ந்து வரும் நிலவியல் குறிப்பின் காரணமாக இங்கு இடப்பொருள் அதிக வாய்ப்புடையதாக எடுத்துக்கொள்ளப்பட்டது.
- source_word: לִפְנֵי הָעֲרָבָה
  choice: அரபாவுக்கு[a] முன்பாக
  rationale: לִפְנֵי என்பதன் இடவியல் பொருள் நேரடியாகத் தரப்பட்டு, הָעֲרָבָה ஒரு குறிப்பிட்ட நிலப்பகுதியைக் குறிக்கக்கூடும் என்பதால் ‘அரபா’ என்ற பெயர் பாதுகாக்கப்பட்டது.
- source_word: אֹרֵב לוֹ מֵאַחֲרֵי הָעִיר
  choice: நகரத்துக்குப் பின்னால் தனக்கு எதிராக ஒரு படை பதுங்கியிருப்பதை
  rationale: אֹרֵב என்பது பதுங்கித் தாக்கும் குழுவை ஒருமைத் தொகுப்பாகக் குறிக்கிறது; தமிழில் பொருள் தெளிவாக இருக்க ‘ஒரு படை பதுங்கியிருப்பதை’ எனத் தரப்பட்டது.
