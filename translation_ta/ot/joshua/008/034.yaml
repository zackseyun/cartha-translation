base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/034.yaml
  text: And afterward he read all the words of the law[a], the blessing and the curse[b], according to all that is written in the Book of the Law.
translation:
  language: ta
  text: அதன்பின் அவர் திருச்சட்டத்தின் வார்த்தைகள் அனைத்தையும்—ஆசியையும் சாபத்தையும்—திருச்சட்டப் புத்தகத்தில் எழுதப்பட்டுள்ளபடியே வாசித்தார்.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “வாசித்தார்” என்பதற்கு “உரக்க வாசித்தார்” அல்லது “அறிவித்தார்” என்றும் மொழிபெயர்க்கலாம்; இச்சூழலில் எபிரெய வினைச்சொல் பொதுமக்கள் முன்னிலையில் வாசிப்பதையோ அறிவிப்பதையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “திருச்சட்டம்” என்பது எபிரெய மொழியின் தோரா என்ற சொல்லை மொழிபெயர்க்கிறது; அதற்கு “போதனை” அல்லது “அறிவுரை” என்றும் பொருள் உண்டு. இங்கு உடன்படிக்கை ஆவணத்தின் சூழல் “திருச்சட்டம்” என்ற பொருளுக்கு ஆதரவளிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַֽחֲרֵי כֵן
  choice: அதன்பின்
  rationale: முந்தைய நிகழ்வுகளைத் தொடர்ந்து நடந்த காலவரிசையை இயல்பான நவீன தமிழில் காட்டுகிறது.
- source_word: קָרָא
  choice: வாசித்தார்
  rationale: திருச்சட்டத்தின் வார்த்தைகள் நேரடிப் பொருளாக வருவதால், இங்கு பொதுமக்கள் முன்னிலையில் வாசித்தல் அல்லது உரக்க அறிவித்தல் என்ற பொருள் பொருத்தமானது; முதன்மை உரையில் சுருக்கமாக ‘வாசித்தார்’ எனத் தரப்பட்டுள்ளது.
- source_word: אֶת כָּל דִּבְרֵי הַתּוֹרָה
  choice: திருச்சட்டத்தின் வார்த்தைகள் அனைத்தையும்
  rationale: דִּבְרֵי என்பதன் ‘வார்த்தைகள்’ என்ற நேரடியான தன்மையைப் பேணுகிறது; உடன்படிக்கை ஆவணச் சூழலில் תּוֹרָה என்பதற்கு ‘திருச்சட்டம்’ தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: הַבְּרָכָה וְהַקְּלָלָה
  choice: ஆசியையும் சாபத்தையும்
  rationale: ஒருமை வடிவிலுள்ள உடன்படிக்கை ஆசீர்வாதம் மற்றும் சாபம் ஆகிய இரு தொகுப்புகளையும் சுருக்கமாகவும் நேரடியாகவும் குறிக்கிறது.
- source_word: כְּ/כָל הַ/כָּת֖וּב
  choice: எழுதப்பட்டுள்ளபடியே
  rationale: வாசிக்கப்பட்டவை எழுதப்பட்ட ஆவணத்தோடு முழுமையாக ஒத்திருந்ததை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: בְּ/סֵ֥פֶר הַ/תּוֹרָֽה
  choice: திருச்சட்டப் புத்தகத்தில்
  rationale: סֵפֶר என்பதை எழுதப்பட்ட ஆவணமான ‘புத்தகம்’ என்றும், הַתּוֹרָה என்பதை இச்சூழலில் ‘திருச்சட்டம்’ என்றும் வழங்குகிறது.
theological_decisions:
- issue: תּוֹרָה என்பதன் பொருள்
  choice: திருச்சட்டம்
  alternative: போதனை / அறிவுரை
  rationale: இங்கு எழுதப்பட்ட உடன்படிக்கை ஆவணம், ஆசி, சாபம் மற்றும் ‘திருச்சட்டப் புத்தகம்’ ஆகிய சூழல்குறிகள் சட்டம் என்ற பொருளை முன்னிறுத்துகின்றன; இருப்பினும் எபிரெயச் சொல்லின் பரந்த பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசிப்புக்கு ஏற்ற கண்ணியமான நடை. எபிரெயச் சொல்வரிசையைத் தமிழில் வற்புறுத்தாமல், ஆசி மற்றும் சாபம் ஆகியவை வாசிக்கப்பட்ட திருச்சட்ட வார்த்தைகளின் உள்ளடக்கம் என்பதை இடைக்கோடுகள் தெளிவுபடுத்துகின்றன. அனைத்து அடிக்குறிப்பு குறிகளும் முதன்மை உரையில் சேர்க்கப்பட்டுள்ளன.
