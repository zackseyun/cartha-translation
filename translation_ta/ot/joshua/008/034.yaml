  source_fidelity: மூல எபிரெயத்தின் காலவரிசைக் குறிப்பு (வְאַחֲרֵי כֵן), ‘திருச்சட்டத்தின் வார்த்தைகள் அனைத்தும்,’ ‘ஆசி மற்றும் சாபம்,’ மற்றும் ‘திருச்சட்டப் புத்தகத்தில் எழுதப்பட்டுள்ள அனைத்திற்கும் ஏற்ப’ என்ற கூறுகள் அனைத்தும் துல்லியமாகப் பாதுகாக்கப்பட்டுள்ளன. இடைக்கோடுகளுக்குள் உள்ள ‘ஆசியையும் சாபத்தையும்’ என்பது முன்வரும் ‘வார்த்தைகள் அனைத்தையும்’ என்பதன் உள்ளடக்கத்தை இயல்பாக விளக்குகிறது; கூடுதல் பொருளைச் சேர்ப்பதில்லை.
  naturalness: நடை நவீனத் தரத் தமிழில் தெளிவாகவும் பொது வாசிப்புக்கேற்ற கண்ணியத்துடனும் உள்ளது. ‘எழுதப்பட்டுள்ளபடியே வாசித்தார்’ என்பது இச்சூழலில் இயல்பானது. ‘அவர்’ என்பது தமிழின் மரியாதையான கதைநடைக்கு ஏற்றது; மூலத்தில் உள்ள மூன்றாம் ஆண் ஒருமையுடன் பொருந்துகிறது.
  terminology: ‘திருச்சட்டம்’ இவ்வுடன்படிக்கை-ஆவணச் சூழலில் torah என்பதற்கான நிலையான, பொருத்தமான தமிழ் வழங்கல். ‘திருச்சட்டப் புத்தகம்,’ ‘ஆசி,’ ‘சாபம்’ ஆகியனவும் மூலத்தின் பதிவுக்கும் பொருளுக்கும் பொருந்துகின்றன. அடிக்குறிப்புகள் வாசித்தல்/அறிவித்தல் என்ற கָרָא வினைச்சொல்லின் சாத்தியத்தையும் தோரா என்ற சொல்லின் பரந்த பொருளையும் சரியாகக் காக்கின்றன.
