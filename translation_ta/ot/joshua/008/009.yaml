translation_notes:
  register: நவீன நிலையான தமிழில் எளிமையும் கண்ணியமும் கொண்ட வரலாற்று உரைநடை. எபிரெய இணைப்புச் சொல் தொடர்ச்சியைத் தமிழின் இயல்பான வாக்கியப் பிரிப்பால் வெளிப்படுத்தப்பட்டுள்ளது. கடைசி வாக்கியத்தில் ‘யோசுவாவோ’ என்பது படையினர் பதுங்கும் இடத்தில் இருந்ததற்கும் யோசுவா மக்களிடையே இருந்ததற்குமான காட்சிமாற்றத்தை இயல்பாகச் சுட்டுகிறது; எதிர்மறை முரண்பாட்டை வலியுறுத்தவில்லை.
