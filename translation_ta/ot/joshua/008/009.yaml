base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/009.yaml
  text: So Joshua sent them[a], and they went to the ambush and stayed between Bethel and Ai, west of Ai. And Joshua spent that night among the people.
translation:
  language: ta
  text: யோசுவா அவர்களை அனுப்பினார்; அவர்கள் பதுங்கியிருக்கும் இடத்திற்குச்[a] சென்று, பெத்தேலுக்கும் ஆயிக்கும் இடையில், ஆயிக்கு மேற்கே தங்கினார்கள். யோசுவா அந்த இரவு மக்களிடையே தங்கினார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘பதுங்கியிருப்போர்’ அல்லது ‘பதுங்கும் இடம்.’ எபிரெயச் சொல் பதுங்கித் தாக்குவதற்காக மறைந்திருக்கும் படையையோ அவர்கள் இருக்கும் இடத்தையோ குறிக்கலாம்; இச்சூழலில் அவர்கள் சென்றடைந்த இடம் என்ற பொருள் பொருத்தமாகத் தெரிகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלָחֵם
  choice: அவர்களை அனுப்பினார்
  rationale: שלח என்பதன் நேரடியான பொருள் ‘அனுப்பு’; கர்த்தா யோசுவா என்பதையும் ஆண்பால் பன்மை பின்னொட்டு ‘அவர்களை’ என்பதையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: הַמַּאְרָב
  choice: பதுங்கியிருக்கும் இடம்
  rationale: இந்தப் பெயர்ச்சொல் பதுங்கித் தாக்கும் படையையோ அவர்கள் பதுங்கும் இடத்தையோ குறிக்கலாம். ‘அதற்குச் சென்றார்கள்’ என்ற இயக்கச் சூழலில் இடப்பொருள் இயல்பாக உள்ளது; படை என்ற மாற்றுப் பொருளும் முற்றிலும் மறைக்கப்படாத வகையில் குறிப்பில் தரப்படுகிறது.
- source_word: וַיֵּשְׁבוּ
  choice: தங்கியிருந்தார்கள்
  rationale: ישב இங்கு உட்காருதல் என்பதைக் காட்டிலும் ஓர் இடத்தில் நிலைத்திருத்தலைக் குறிக்கிறது. இராணுவ நிலையை மிகையாக விளக்காமல் அடிப்படைப் பொருளைப் பாதுகாக்கிறது.
- source_word: בֵּין בֵּית אֵל וּבֵין הָעַי
  choice: பெத்தேலுக்கும் ஆயிக்கும் நடுவே
  rationale: இரு இடங்களுக்கும் இடையிலான புவியியல் நிலையைத் தெளிவாகவும் இயல்பான தமிழிலும் தருகிறது.
- source_word: מִיָּם לָעָי
  choice: ஆயிக்கு மேற்கே
  rationale: יָם என்பதன் அடிப்படைப் பொருள் ‘கடல்’; இங்குள்ள புவியியல் வழக்கில் அது மேற்குத் திசையைக் குறிக்கிறது.
- source_word: וַיָּלֶן
  choice: தங்கினார்
  rationale: לון என்பது இரவைக் கழித்தல் அல்லது இரவு தங்குதல். ‘அந்த இரவில்’ என்பதுடன் சேர்ந்து ‘தங்கினார்’ இயல்பாகவும் போதுமான துல்லியத்துடனும் உள்ளது.
- source_word: בְּתוֹךְ הָעָם
  choice: மக்களிடையே
  rationale: בְּתוֹךְ என்பது ஒரு குழுவின் நடுவில் அல்லது மத்தியில் இருப்பதைக் குறிக்கிறது; ‘மக்களிடையே’ நவீனத் தமிழில் தெளிவானது.
