  source_fidelity: 'மொத்தத்தில் மூல எபிரெயப் பொருள் சரியாகக் கொடுக்கப்பட்டுள்ளது: யோசுவா அவர்களை அனுப்புதல், அவர்கள் பெத்தேலுக்கும் ஆயிக்கும் இடையில் ஆயிக்கு மேற்கே பதுங்கும் இடத்தில் தங்குதல், யோசுவா அந்த இரவு மக்களிடையே தங்குதல் ஆகியவை பாதுகாக்கப்பட்டுள்ளன. ஆனால் ‘யோசுவாவோ’ மூலத்தில் இல்லாத மெல்லிய எதிர்மறை/மாறுபாட்டுச் சாயலைச் சேர்க்கிறது; וַ என்ற எளிய தொடரிணைப்புக்கு ‘யோசுவா’ எனத் தொடர்வதே துல்லியமானது. הַמַּאְרָב-இன் இடம்/பதுங்கிப் படையிருப்போர் என்ற சொல்லியல் தெளிவின்மைக்கான அடிக்குறிப்பும் உரையில் குறியீட்டுடன் இருக்க வேண்டும்.'
