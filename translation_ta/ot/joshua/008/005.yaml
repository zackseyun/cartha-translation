translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் இயல்பான ஆனால் கண்ணியமான நடை. எபிரெய இராணுவத் திட்டத்தின் எதிர்காலச் செயல்கள் தெளிவாக வைக்கப்பட்டுள்ளன; ‘மக்கள்’ என்பதை ‘படைவீரர்கள்’ என்று குறுக்கவில்லை.
