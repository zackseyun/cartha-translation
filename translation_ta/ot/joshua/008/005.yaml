revisions:
- from: நானும் என்னுடன் இருக்கும் மக்கள் அனைவரும் நகரத்தை நெருங்குவோம்[a]. முன்புபோல[b] அவர்கள் நம்மை எதிர்கொள்ள வெளியே வரும்போது, நாம் அவர்களுக்கு முன்பாக ஓடிப்போவோம்.
  to: நானும் என்னுடன் இருக்கும் மக்கள் அனைவரும் நகரத்தை நெருங்குவோம்[a]. முன்புபோல[b] அவர்கள் நம்மை எதிர்கொள்ள வெளியே வரும்போது, நாம் அவர்களைவிட்டு ஓடிப்போவோம்.
  rationale: The revision removes a meaningful Tamil ambiguity in the idiom for fleeing before/from the opponents and makes the literal alternative in footnote b more exact. It otherwise retains the draft’s faithful rendering of the Hebrew syntax and tactical sequence.
