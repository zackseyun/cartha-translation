source:
  edition: WLC
  text: וַ/אֲנִ֗י וְ/כָל הָ/עָם֙ אֲשֶׁ֣ר אִתִּ֔/י נִקְרַ֖ב אֶל הָ/עִ֑יר וְ/הָיָ֗ה כִּֽי יֵצְא֤וּ לִ/קְרָאתֵ֨/נוּ֙ כַּ/אֲשֶׁ֣ר בָּ/רִֽאשֹׁנָ֔ה וְ/נַ֖סְנוּ לִ/פְנֵי/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/005.yaml
  text: And I and all the people who are with me will approach the city[a]. And when they come out to meet us, as before[b], we will flee before them.
translation:
  language: ta
  text: நானும் என்னுடன் இருக்கும் மக்கள் அனைவரும் நகரத்தை நெருங்குவோம்[a]. முன்புபோல[b] அவர்கள் நம்மை எதிர்கொள்ள வெளியே வரும்போது, நாம் அவர்களைவிட்டு ஓடிப்போவோம்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘நகரத்தை அணுகுவோம்.’
    reason: lexical_alternative
  - marker: b
    text: சொற்படி, ‘முதல் முறைபோல.’
    reason: lexical_alternative
lexical_decisions:
- source_word: נִקְרַב
  choice: நகரத்தை நெருங்குவோம்
  rationale: קרב என்பதன் Qal முற்றுப்பெறா வடிவம் திட்டமிடப்பட்ட எதிர்காலச் செயலைக் குறிக்கிறது. ‘நெருங்குவோம்’ என்பது நகரத்தை நோக்கிய நகர்வை இயல்பாகவும் கூடுதல் நோக்கத்தைப் புகுத்தாமலும் தெரிவிக்கிறது.
- source_word: הָעָם
  choice: மக்கள்
  rationale: עם என்பதன் நேரடியான பொருளான ‘மக்கள்’ என்பதையே வைத்து, இங்கு குறிப்பாக படைவீரர்கள் அல்லது ஆண்கள் என்று எபிரெயத்தைவிடக் குறுக்கவில்லை.
- source_word: אֲשֶׁר אִתִּי
  choice: என்னுடன் இருக்கும்
  rationale: இந்த உறவுச் சொற்றொடர் யோசுவாவுடன் செல்லும் மக்களை அடையாளப்படுத்துகிறது; தமிழில் இது இயல்பான சுருக்கமான வடிவம்.
- source_word: וְהָיָה כִּי
  choice: வரும்போது
  rationale: இது அடுத்த நிகழ்வை அறிமுகப்படுத்தும் பொதுவான எபிரெய காலக் கட்டமைப்பு. தமிழில் ‘வரும்போது’ அதன் காலத் தொடர்பை இயல்பாகத் தருகிறது.
- source_word: יֵצְאוּ לִקְרָאתֵנוּ
  choice: அவர்கள் நம்மை எதிர்கொள்ள வெளியே வரும்போது
  rationale: יצא + לקראת என்பது ‘சந்திக்க/எதிர்கொள்ள வெளியே வருதல்’ எனப் பொருள்படும். போர்ச் சூழலுக்கு ‘எதிர்கொள்ள’ பொருத்தமானது; ஆனால் ‘தாக்க’ போன்ற கூடுதல் கருத்தைப் புகுத்தவில்லை.
- source_word: כַּאֲשֶׁר בָּרִאשֹׁנָה
  choice: முன்புபோல
  rationale: முந்தைய ஆயி சந்திப்பைச் சுட்டும் சொற்றொடரைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது; சொற்படி வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: וְנַסְנוּ
  choice: நாம் ஓடிப்போவோம்
  rationale: נוס என்பதன் வலுவான ‘தப்பி ஓடுதல்’ கருத்தை ‘ஓடிப்போவோம்’ காக்கிறது; ‘பின்வாங்குவோம்’ என்பது அதன் வலிமையைத் தணித்துவிடும்.
- source_word: לִפְנֵיהֶם
  choice: அவர்களுக்கு முன்பாக
  rationale: נוס உடன் வரும் לִפְנֵי என்ற எபிரெய மரபுத்தொடரை நெருக்கமாகக் காக்கிறது; அவர்களிடமிருந்து ஓடுதல் என்ற சூழல்சார் பொருள் தெளிவாக உள்ளது.
- source_word: וַאֲנִי וְכָל הָעָם
  choice: நானும் ... மக்கள் அனைவரும்
  rationale: தமிழின் இயல்பான இணைப்புக் கட்டமைப்பைப் பயன்படுத்தி, பேச்சாளரையும் அவருடன் உள்ள முழுக் குழுவையும் எபிரெயத்தைப் போல இணைக்கிறது.
