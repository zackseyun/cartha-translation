    text: அல்லது, ‘நகரத்தை அணுகுவோம்.’
    reason: lexical_alternative
  - marker: b
    text: சொற்படி, ‘முதல் முறைபோல.’
    reason: lexical_alternative
  revision_rationale: The revision removes a meaningful Tamil ambiguity in the idiom for fleeing before/from the opponents and makes the literal alternative in footnote b more exact. It otherwise retains the draft’s faithful rendering of the Hebrew syntax and tactical sequence.
