  text: לֹֽא הָיָ֣ה דָבָ֔ר מִ/כֹּ֖ל אֲשֶׁר צִוָּ֣ה מֹשֶׁ֑ה אֲשֶׁ֨ר לֹֽא קָרָ֜א יְהוֹשֻׁ֗עַ נֶ֣גֶד כָּל קְהַ֤ל יִשְׂרָאֵל֙ וְ/הַ/נָּשִׁ֣ים וְ/הַ/טַּ֔ף וְ/הַ/גֵּ֖ר הַ/הֹלֵ֥ךְ בְּ/קִרְבָּֽ/ם־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/035.yaml
  text: There was not a word of all that Moses commanded that Joshua did not read before all the assembly of Israel[a], and the women, the little children[e][d][c][b], and the sojourner who walked among them.
translation:
  language: ta
  text: மோசே கட்டளையிட்ட எல்லாவற்றிலும், இஸ்ரவேலின் சபையார் அனைவரும், பெண்கள், சிறு பிள்ளைகள், அவர்களிடையே வாழ்ந்த அந்நியக் குடியிருப்பாளர் ஆகியோர் முன்னிலையில் யோசுவா வாசிக்காமல் விட்ட ஒரு வார்த்தைகூட இல்லை[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “அவர்கள் நடுவில் நடந்த அந்நியக் குடியிருப்பாளர்”; இங்கு அவர்கள் மத்தியில் குடியிருந்து வாழ்ந்தவரைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: דָבָר
  choice: வார்த்தை
  rationale: வாசித்தல் என்ற தொடர்ச்சியான சூழலில் ‘வார்த்தை’ என்பது மூலத்தின் சொல்லாட்சியையும் கட்டளைகளின் உள்ளடக்கத்தையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: צִוָּה
  choice: கட்டளையிட்ட
  rationale: மோசேயின் அதிகாரபூர்வமான உடன்படிக்கைச் சட்ட அறிவுறுத்தல்களுக்கு ஏற்ற சொல்.
- source_word: קָרָא
  choice: வாசிக்க
  rationale: முந்தைய சூழலில் திருச்சட்டம் பொதுவாக வாசிக்கப்படுவதால், ‘வாசித்தல்’ என்பதே இங்கு துல்லியமான பொருள்.
- source_word: נֶגֶד
  choice: முன்பாக
  rationale: கூடியிருந்த மக்களின் முன்னிலையில் நடந்த பொது வாசிப்பைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: קְהַל
  choice: சபையார்
  rationale: இஸ்ரவேலின் முறையாகக் கூடியிருந்த மக்கள் தொகுதியைக் குறிக்கிறது; பிற்காலத் திருச்சபை சார்ந்த குறிப்பிட்ட பொருளை இங்கு திணிக்கவில்லை.
- source_word: הַנָּשִׁים
  choice: பெண்கள்
  rationale: பொது வாசிப்பைக் கேட்டவர்களில் பெண்கள் வெளிப்படையாகச் சேர்க்கப்பட்டதைத் தெளிவாக வைத்திருக்கிறது.
- source_word: הַטַּף
  choice: சிறு பிள்ளைகள்
  rationale: טַף என்பதன் சிறுவர்கள் அல்லது சார்ந்திருக்கும் இளையோர் என்ற நுணுக்கத்தைப் பொதுவான ‘பிள்ளைகள்’ என்பதைவிடத் தெளிவாகக் காட்டுகிறது.
- source_word: הַגֵּר
  choice: அந்நியக் குடியிருப்பாளர்
  rationale: இஸ்ரவேலர் அல்லாதவராக இருந்தும் அவர்களிடையே நிலையாக வாழும் சமூகப் பிரிவைக் குறிக்கிறது; வெறும் அறிமுகமற்ற நபர் என்ற தவறான எண்ணத்தைத் தவிர்க்கிறது.
- source_word: הַהֹלֵךְ בְּקִרְבָּם
  choice: அவர்கள் நடுவில் வாழ்ந்த
  rationale: ‘நடத்தல்’ என்ற எபிரெயப் பங்கேற்பு வடிவத்தைத் தமிழில் சொற்படியாக்காமல், இச்சூழலில் அவர்கள் சமூகத்தினுள் வாழ்ந்த நிலையை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: לֹא הָיָה ... אֲשֶׁר לֹא
  choice: வாசிக்காமல் விட்ட ஒரு வார்த்தைகூட இல்லை
  rationale: எபிரெய இரட்டை எதிர்மறையின் முழுமையான வலியுறுத்தலை இயல்பான நவீன தமிழில் பாதுகாக்கிறது.
theological_decisions:
- issue: உடன்படிக்கை அறிவுறுத்தலின் பொதுவான கேட்போர் வட்டம்
  choice: இஸ்ரவேலின் முழுச் சபையோடு பெண்கள், சிறு பிள்ளைகள், அந்நியக் குடியிருப்பாளர் ஆகியோரும் வெளிப்படையாகச் சேர்க்கப்படுகின்றனர்.
  alternative: இந்தக் குழுக்களை ‘இஸ்ரவேலின் சபையார் அனைவரும்’ என்பதற்குள் மறைமுகமாக மட்டும் உள்ளடக்குதல்.
  rationale: எபிரெய மூலமே இந்தக் குழுக்களைத் தனித்தனியாகக் குறிப்பிடுவதால், அவர்களின் வெளிப்படையான சேர்க்கையை மொழிபெயர்ப்பு பாதுகாக்கிறது.
- issue: ‘அவர்கள் நடுவில் நடப்பவர்’ என்ற சொல்லாட்சியின் பொருள்
  choice: அவர்கள் நடுவில் வாழ்ந்தவர்
  alternative: அவர்கள் நடுவில் நடந்தவர்
  rationale: சொற்படியான ‘நடந்தவர்’ தமிழ் வாசகருக்கு உடல் இயக்கத்தை மட்டும் உணர்த்தக்கூடும்; சூழல் குடியிருந்து சமூகத்தில் வாழும் அந்நியரைச் சுட்டுகிறது. அடிப்படை உருவகம் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் கண்ணியமான, பொதுமக்களுக்கு எளிதில் புரியும் நடை. எபிரெய இரட்டை எதிர்மறையின் வலியுறுத்தல் இயல்பான தமிழ் அமைப்பில் தரப்பட்டுள்ளது. பட்டியலில் குறிப்பிடப்பட்ட ஒவ்வொரு சமூகக் குழுவின் வெளிப்படையான சேர்க்கையும் பாதுகாக்கப்பட்டுள்ளது.
