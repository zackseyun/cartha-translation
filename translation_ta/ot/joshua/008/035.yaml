revisions:
- from: மோசே கட்டளையிட்ட அனைத்திலும் யோசுவா இஸ்ரவேலின் சபையார் அனைவருக்கும் முன்பாக வாசிக்காமல் விட்ட ஒரு வார்த்தைகூட இல்லை—பெண்களும் சிறு பிள்ளைகளும் அவர்கள் நடுவில் வாழ்ந்த அந்நியக் குடியிருப்பாளரும்[a] அங்கே இருந்தார்கள்.
