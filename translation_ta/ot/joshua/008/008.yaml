source:
  edition: WLC
  text: וְ/הָיָ֞ה כְּ/תָפְשְׂ/כֶ֣ם אֶת הָ/עִ֗יר תַּצִּ֤יתוּ אֶת הָ/עִיר֙ בָּ/אֵ֔שׁ כִּ/דְבַ֥ר יְהוָ֖ה תַּעֲשׂ֑וּ רְא֖וּ צִוִּ֥יתִי אֶתְ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/008.yaml
  text: And when you have taken the city[a], you shall set the city on fire. According to the word of Yahweh, you shall do. See, I have commanded you.
translation:
  language: ta
  text: நீங்கள் நகரத்தைக் கைப்பற்றியதும், அந்த நகரத்திற்குத் தீ மூட்டுங்கள். யாவேயின் வார்த்தையின்படி[a] செய்யுங்கள். பாருங்கள், நான் உங்களுக்குக் கட்டளையிட்டிருக்கிறேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யாவேயின் கட்டளைப்படி செய்யுங்கள்.” எபிரேயச் சொற்றொடரின் நேரடிப் பொருள், “யாவேயின் வார்த்தையின்படி செய்யுங்கள்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה כְּתָפְשְׂכֶם
  choice: நீங்கள் ... கைப்பற்றியதும்
  rationale: וְהָיָה உடன் வரும் כְּתָפְשְׂכֶם அடுத்த கட்டளைக்கான காலச் சூழலைக் குறிக்கிறது. தமிழில் ‘கைப்பற்றியதும்’ என்பது நகரைக் கைப்பற்றிய பின் செய்ய வேண்டிய செயலை இயல்பாகவும் தெளிவாகவும் காட்டுகிறது.
- source_word: הָעִיר
  choice: நகரம்
  rationale: இராணுவ நிகழ்வின் சூழலில் עִיר என்பதற்கான இயல்பான நவீனத் தமிழ் சொல் ‘நகரம்’.
- source_word: תַּצִּיתוּ ... בָּאֵשׁ
  choice: தீ வையுங்கள்
  rationale: Hiphil வடிவமான תַּצִּיתוּ தீ மூட்டுதல் அல்லது எரியச் செய்தல் என்ற causative பொருளைக் கொண்டது. ‘தீ வையுங்கள்’ என்பது அந்தப் பொருளையும் கட்டளைத் தொனியையும் இயல்பான தமிழில் தருகிறது.
- source_word: כִּדְבַר יְהוָה
  choice: யாவேயின் வார்த்தையின்படி
  rationale: דָּבָר என்பதன் அடிப்படைச் சொல்லாக்கமான ‘வார்த்தை’ என்பதைக் காத்து, ‘-இன்படி’ மூலம் כְּ முன்னொட்டின் ‘அதற்கேற்ப’ என்ற பொருளைத் தெளிவாக வழங்குகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரேய இறைப்பெயரான יהוה-ஐ ஒரு பட்டப்பெயரால் மாற்றாமல், தமிழில் பரவலாகப் புரிந்துகொள்ளக்கூடிய ஒலிபெயர்ப்பாக ‘யாவே’ என வழங்குகிறது.
- source_word: תַּעֲשׂוּ
  choice: செய்யுங்கள்
  rationale: இங்கு imperfect வடிவம் கட்டளையாகச் செயல்படுகிறது; மரியாதை/பன்மை கட்டளை வடிவமான ‘செய்யுங்கள்’ இயல்பாக அமைகிறது.
- source_word: רְאוּ
  choice: பாருங்கள்
  rationale: கவனத்தை ஈர்க்கும் நேரடியான பன்மைக் கட்டளையைச் சொற்பொருளுக்கு நெருக்கமாகக் காக்கிறது.
- source_word: צִוִּיתִי אֶתְכֶם
  choice: நான் உங்களுக்குக் கட்டளையிட்டிருக்கிறேன்
  rationale: Perfect வடிவம் ஏற்கெனவே கொடுக்கப்பட்ட கட்டளையைப் பின்னோக்கிச் சுட்டுகிறது; ‘கட்டளையிட்டிருக்கிறேன்’ அந்த நிறைவு மற்றும் தற்போதைய பொருத்தத்தைத் தருகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் தனிப்பட்ட இறைப்பெயர் நேரடியாக உள்ளது. அதை ஒரு பட்டப்பெயராக மாற்றாமல் ஒலிபெயர்ப்பது மூலத்தின் வேறுபாட்டைக் காக்கிறது.
- issue: כִּדְבַר יְהוָה என்பதில் דָּבָר-ஐ மொழிபெயர்த்தல்
  choice: யாவேயின் வார்த்தையின்படி
  alternative: யாவேயின் கட்டளைப்படி
  rationale: சூழலில் இது கட்டளையைக் குறிக்கலாம்; எனினும் எபிரேயத்தில் உள்ள ‘வார்த்தை/காரியம்’ என்ற சொல்லை முதன்மை உரை காக்கிறது. சூழல்சார் மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையில் நேரடியும் கண்ணியமுமான கட்டளை நடையைப் பயன்படுத்துகிறது. எபிரேய வாக்கியத்தின் சுருக்கமான இராணுவக் கட்டளைத் தொனி காக்கப்பட்டுள்ளது.
