base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/022.yaml
  text: And these came out from the city to meet them[a], so that they were in the midst of Israel, these on one side and those on the other[b]; and they struck them down until he left for him not a survivor or a fugitive.
translation:
  language: ta
  text: நகரத்திலிருந்து வந்த இஸ்ரவேலர் அவர்களை எதிர்கொள்ள வெளியே வந்தனர். அப்போது ஆயி நகரத்தார் இஸ்ரவேலரின் நடுவில் சிக்கிக்கொண்டனர்; இஸ்ரவேலரின் ஒரு பிரிவினர் ஒரு பக்கத்திலும் மற்றொரு பிரிவினர் மறுபக்கத்திலும் இருந்தனர்[a]. உயிருடன் மீந்தவனோ தப்பியோடியவனோ ஒருவரும் எஞ்சாதவரை இஸ்ரவேலர் அவர்களைத் தாக்கி வீழ்த்தினர்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரேயத்தில், “இவர்கள் இந்தப் பக்கத்திலும் இவர்கள் அந்தப் பக்கத்திலும்” என்று உள்ளது; அதாவது, ஆயி நகரத்தார் இஸ்ரவேலரால் இருபுறமும் சூழப்பட்டிருந்தனர்.
    reason: lexical_alternative
  - marker: b
    text: இறுதிக் கூற்றில் எபிரேயம் திடீரென ஒருமை வினை வடிவுக்கும் ஒருமை மறைமுகப் பின்னொட்டுக்கும் மாறுகிறது; சொல்லடியாக, “அவன் அவனுக்கு உயிருடன் மீந்தவனையோ தப்பியோடியவனையோ எஞ்சவிடாதவரை” என்கிறது. இந்த ஒருமை வடிவங்கள் யாரைக் குறிக்கின்றன என்பது வெளிப்படையாகச் சொல்லப்படவில்லை.
    reason: textual_ambiguity
lexical_decisions:
- source_word: וְאֵלֶּה יָצְאוּ מִן־הָעִיר
  choice: நகரத்திலிருந்தவர்களும் ... புறப்பட்டு வந்தனர்
  rationale: וְאֵלֶּה என்பதன் சுட்டுப்பொருள் முந்தைய சூழலில் நகரைக் கைப்பற்றிய இஸ்ரவேல் படையினரைச் சுட்டுகிறது. தமிழில் இயல்பாக இருக்கவும், எபிரேயத்தில் இல்லாத அளவுக்கு அடையாளத்தை மிகத் தெளிவுபடுத்தாமல் இருக்கவும் ‘நகரத்திலிருந்தவர்கள்’ என்று வழங்கப்பட்டது.
- source_word: לִקְרָאתָם
  choice: அவர்களை எதிர்கொள்ள
  rationale: לקראת என்பது ‘சந்திக்க/எதிர்கொள்ள’ என்று பொருள்படும்; போர்ச் சூழலில் உள்ள பகைமுகமான சந்திப்பை ‘எதிர்கொள்ள’ இயல்பாகத் தெரிவிக்கிறது.
- source_word: וַיִּהְיוּ לְיִשְׂרָאֵל בַּתָּוֶךְ
  choice: அவர்கள் இஸ்ரவேலரின் நடுவில் அகப்பட்டுக்கொண்டனர்
  rationale: சொல்லடிப்படையில் ‘இஸ்ரவேலருக்கு நடுவில் இருந்தனர்.’ போர்த் தந்திரத்தின் விளைவையும் சூழப்பட்ட நிலைமையையும் தமிழில் தெளிவாகக் காட்ட ‘அகப்பட்டுக்கொண்டனர்’ பயன்படுத்தப்பட்டது.
- source_word: אֵלֶּה מִזֶּה וְאֵלֶּה מִזֶּה
  choice: இஸ்ரவேலரில் ஒரு பகுதியினர் ஒரு பக்கத்திலும் மற்ற பகுதியினர் மறுபக்கத்திலும்
  rationale: எபிரேயச் சொற்றொடர் இருபுறமும் இருந்த படைப்பிரிவுகளைக் குறிக்கிறது. ‘இவர்கள் இந்தப் பக்கத்திலும் இவர்கள் அந்தப் பக்கத்திலும்’ என்ற சொல்லடி வடிவம் தமிழில் குழப்பமளிப்பதால் பொருளை இயல்பாக வழங்குகிறது.
- source_word: וַיַּכּוּ אוֹתָם
  choice: அவர்களை வெட்டி வீழ்த்தினர்
  rationale: נכה போர்ச் சூழலில் தாக்கி வீழ்த்துதல் அல்லது கொல்லுதல் என்னும் வலிமையைக் கொண்டது. ‘வெட்டி வீழ்த்தினர்’ அதன் போரியல் வலிமையைத் தக்கவைக்கிறது; ஒவ்வொரு தாக்குதலின் முறையையும் தேவையின்றி நிர்ணயிக்கவில்லை.
- source_word: שָׂרִיד וּפָלִיט
  choice: உயிர் பிழைத்தவனோ தப்பியோடியவனோ
  rationale: இரு எபிரேயப் பெயர்ச்சொற்களையும் தனித்தனியாகத் தக்கவைத்து, உயிருடன் மீந்தவர் மற்றும் தப்பிச் சென்றவர் என்ற தொடர்புடைய கருத்துகளை இயல்பான தமிழில் தெரிவிக்கிறது.
theological_decisions:
- issue: הִשְׁאִיר לוֹ என்ற ஒருமை வினையும் ஒருமை மறைமுகப் பெயர்ப்பின்னொட்டும்
  choice: எஞ்சாதபடி இஸ்ரவேலர் அவர்களை வெட்டி வீழ்த்தினர்
  alternative: அவன் அவனுக்காக உயிர் பிழைத்தவனையோ தப்பியோடியவனையோ எஞ்சவிடாதவரை
  rationale: எபிரேயத்தில் பன்மைச் செயற்பாட்டிலிருந்து திடீரென ஒருமை வடிவத்துக்கு மாறுகிறது; அது யோசுவாவையோ, இஸ்ரவேலைக் கூட்டாகவோ, அல்லது நிகழ்வைத் தொகுத்துச் சொல்லும் ஒருமையையோ குறிக்கலாம். பிரதான உரையில் இயல்பான தமிழ் பயன்படுத்தப்பட்டாலும், குறிப்பில் இந்த வடிவமும் அதன் தெளிவின்மையும் பாதுகாக்கப்படுகிறது; குறிப்பிட்ட இறையியல் விளக்கம் திணிக்கப்படவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழ்; கதைநடைக்கேற்ற கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் நடை. எபிரேயத்தின் இருபுறச் சூழ்தல் இயல்பான தமிழில் தெளிவாக்கப்பட்டுள்ளது; இறுதி ஒருமைச் சொற்றொடரின் உண்மையான இலக்கணத் தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
