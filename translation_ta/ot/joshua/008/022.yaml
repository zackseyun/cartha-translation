  to: நகரத்திலிருந்து வந்த இஸ்ரவேலர் அவர்களை எதிர்கொள்ள வெளியே வந்தனர். அப்போது ஆயி நகரத்தார் இஸ்ரவேலரின் நடுவில் சிக்கிக்கொண்டனர்; இஸ்ரவேலரின் ஒரு பிரிவினர் ஒரு பக்கத்திலும் மற்றொரு பிரிவினர் மறுபக்கத்திலும் இருந்தனர்[a]. உயிருடன் மீந்தவனோ தப்பியோடியவனோ ஒருவரும் எஞ்சாதவரை இஸ்ரவேலர் அவர்களைத் தாக்கி வீழ்த்தினர்[b].
