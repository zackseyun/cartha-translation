  text: וַ/יַּשְׁכֵּ֤ם יְהוֹשֻׁ֨עַ֙ בַּ/בֹּ֔קֶר וַ/יִּפְקֹ֖ד אֶת הָ/עָ֑ם וַ/יַּ֨עַל ה֜וּא וְ/זִקְנֵ֧י יִשְׂרָאֵ֛ל לִ/פְנֵ֥י הָ/עָ֖ם הָ/עָֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/010.yaml
  text: Joshua rose early in the morning and mustered the people[a], and he and the elders of Israel went up before the people to Ai.
translation:
  language: ta
  text: யோசுவா அதிகாலையில் எழுந்து மக்களைத் திரட்டினார்[a]; அவரும் இஸ்ரவேலின் மூப்பர்களும் மக்களுக்கு முன்பாக ஆயிக்கு ஏறிச் சென்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மக்களை எண்ணினார்” அல்லது “மக்களைப் பார்வையிட்டார்.” இங்கு வரும் எபிரெய வினைச்சொல் எண்ணுதல், பார்வையிடுதல், நியமித்தல், அல்லது படையாகத் திரட்டுதல் ஆகியவற்றைக் குறிக்கலாம்; படைச்சூழல் காரணமாக “மக்களைத் திரட்டினார்” என்று மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁכֵּם ... בַּבֹּקֶר
  choice: அதிகாலையில் எழுந்து
  rationale: שׁכם என்பதன் ஹிஃபில் வடிவம் அதிகாலையில் எழுவதைக் குறிக்கிறது; בַּבֹּקֶר தரும் காலைக் குறிப்பையும் இயல்பான தமிழில் இச்சொற்றொடர் உள்ளடக்குகிறது.
- source_word: וַיִּפְקֹד אֶת־הָעָם
  choice: மக்களைத் திரட்டி அணிவகுத்தார்
  rationale: פקד எண்ணுதல், பரிசோதித்தல், நியமித்தல், படைக்காகத் திரட்டுதல் ஆகிய பொருள்களைத் தரலாம். ஆயிக்கு எதிரான படை நடவடிக்கையின் சூழலில், மக்களைப் போருக்காகத் திரட்டி ஒழுங்குபடுத்திய கருத்தை இத்தேர்வு இயல்பாக வெளிப்படுத்துகிறது; மாற்றுப் பொருள்கள் அடிக்குறிப்பில் பாதுகாக்கப்படுகின்றன.
- source_word: הָעָם
  choice: மக்கள்
  rationale: எபிரெயச் சொல் பொதுவாக ‘மக்கள்’ என்று உள்ளது. படைச்சூழல் இருந்தாலும் ‘வீரர்கள்’ அல்லது ‘படை’ என்று தேவையின்றிக் குறுக்கப்படவில்லை.
- source_word: וַיַּעַל
  choice: ஏறிச் சென்றார்கள்
  rationale: עלה என்பதன் அடிப்படைப் பொருளான ‘மேலே செல்லுதல்’ என்பதையும், இடத்தை நோக்கிய நகர்வையும் பாதுகாக்கிறது.
- source_word: הוּא וְזִקְנֵי יִשְׂרָאֵל
  choice: அவரும் இஸ்ரவேலின் மூப்பர்களும்
  rationale: யோசுவாவையும் மூப்பர்களையும் இணை எழுவாயாக மூலமொழி வெளிப்படையாகக் குறிப்பிடுவதைக் காக்கிறது.
- source_word: לִפְנֵי הָעָם
  choice: மக்களுக்கு முன்னால்
  rationale: ‘மக்களுக்கு முன்பாக/முன்னால்’ என்ற இடநிலையை நேரடியாகக் காக்கிறது; ‘தலைமை தாங்கி’ என்ற விளக்கத்தை உரைக்குள் சேர்ப்பதில்லை.
- source_word: הָעָי
  choice: ஆயி
  rationale: எபிரெய இடப்பெயரின் வழக்கமான தமிழ் ஒலிபெயர்ப்பு.
