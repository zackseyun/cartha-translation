revisions:
- from: யோசுவா அதிகாலையில் எழுந்து மக்களைத் திரட்டி அணிவகுத்தார்[a]. பின்பு அவரும் இஸ்ரவேலின் மூப்பர்களும் மக்களுக்கு முன்னால் ஆயியை நோக்கி ஏறிச் சென்றார்கள்.
  to: யோசுவா அதிகாலையில் எழுந்து மக்களைத் திரட்டினார்[a]; அவரும் இஸ்ரவேலின் மூப்பர்களும் மக்களுக்கு முன்பாக ஆயிக்கு ஏறிச் சென்றார்கள்.
  rationale: The revision preserves the Hebrew temporal emphasis, the broad contextual sense of פקד, the joint subject ‘he and the elders of Israel,’ the spatial phrase ‘before the people,’ and the destination and upward movement toward Ai. It removes an unnecessary implication that the people were explicitly put into formation.
