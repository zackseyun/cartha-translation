  yaml_path: translation/ot/joshua/008/004.yaml
  text: And he commanded them, saying, “Look, you are to lie in ambush against the city, behind the city. Do not go very far from the city, and all of you must be ready.”
translation:
  language: ta
  text: 'அவர்களுக்குக் கட்டளையிட்டுச் சொன்னார்: “கவனியுங்கள்! நீங்கள் நகருக்குப் பின்னால், நகருக்கு எதிராகப் பதுங்கியிருங்கள். நகரத்திலிருந்து வெகுதூரம் சென்றுவிடாதீர்கள். நீங்கள் எல்லாரும் ஆயத்தமாக இருங்கள்.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רְאוּ
  choice: கவனியுங்கள்!
  rationale: கவனத்தை ஈர்க்கும் கட்டளைச் சொல்லாக இங்கு பயன்படுவதால், சொற்பொருளான ‘பாருங்கள்’ என்பதைவிட இயல்பான நவீனத் தமிழில் உரிய வலியுறுத்தலைத் தருகிறது.
- source_word: אֹרְבִים
  choice: பதுங்கியிருங்கள்
  rationale: தாக்குவதற்காக மறைந்து காத்திருக்கும் பதுங்குத் திட்டத்தைச் சுருக்கமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: מֵאַחֲרֵי הָעִיר
  choice: நகரத்தின் பின்புறத்தில்
  rationale: நகருக்குப் பின்னால் என்ற இடவியல் பொருளைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: נְכֹנִים
  choice: ஆயத்தமாக
  rationale: செயல்படத் தயாராக இருக்கும் நிலையைச் சுட்டும் எபிரெயச் சொல்லின் சூழல்சார் பொருளை வழங்குகிறது.
