revisions:
- from: 'அவர்களுக்கு அவர் கட்டளையிட்டுச் சொன்னது: “கவனியுங்கள்! நீங்கள் நகரத்தின் பின்புறத்தில், அந்த நகருக்கு எதிராகப் பதுங்கியிருங்கள். நகரத்திலிருந்து வெகுதூரம் சென்றுவிடாதீர்கள். நீங்கள் எல்லாரும் ஆயத்தமாக இருங்கள்.”'
  to: 'அவர்களுக்குக் கட்டளையிட்டுச் சொன்னார்: “கவனியுங்கள்! நீங்கள் நகருக்குப் பின்னால், நகருக்கு எதிராகப் பதுங்கியிருங்கள். நகரத்திலிருந்து வெகுதூரம் சென்றுவிடாதீர்கள். நீங்கள் எல்லாரும் ஆயத்தமாக இருங்கள்.”'
  rationale: The revision corrects the grammatical agreement error and smooths the location phrase. It retains the draft’s defensible modern rendering “கவனியுங்கள்” for the attention-call, while preserving the source’s distinct references to being behind the city and acting against it.
