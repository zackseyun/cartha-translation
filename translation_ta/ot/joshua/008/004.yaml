  register: நவீன நிலையான தமிழில், இராணுவக் கட்டளையின் நேரடித் தன்மையும் கண்ணியமான வேதாகம நடையும் பேணப்பட்டுள்ளன. மூலத்தின் ‘நகருக்கு எதிராக’ மற்றும் ‘நகரத்தின் பின்புறத்தில்’ என்ற இரு கூறுகளும் விடுபடாமல் மொழிபெயர்க்கப்பட்டுள்ளன.
