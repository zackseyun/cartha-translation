base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/027.yaml
  text: Only the livestock and the spoil of that city Israel took as plunder for themselves[b][a], according to the word of Yahweh that he had commanded Joshua.
translation:
  language: ta
  text: யாவே யோசுவாவுக்குக் கட்டளையிட்ட வார்த்தையின்படி, அந்த நகரத்தின் கால்நடைகளையும் கொள்ளைப் பொருள்களையும் மட்டும் இஸ்ரவேலர் தங்களுக்கென கைப்பற்றிக்கொண்டார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רַק
  choice: ஆனால் ... மட்டும்
  rationale: முந்தைய அழிவிலிருந்து இவை மட்டும் விலக்கப்பட்டன என்ற கட்டுப்பாட்டையும் எதிர்மறைத் தொடர்பையும் இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: הַבְּהֵמָה
  choice: கால்நடைகள்
  rationale: போரில் கைப்பற்றப்பட்ட வீட்டுவளர்ப்பு விலங்குகளைக் குறிக்கும் இயல்பான நவீனத் தமிழ்ச் சொல்.
- source_word: וּשְׁלַל הָעִיר הַהִיא
  choice: அந்த நகரத்தின் ... கொள்ளைப்பொருள்கள்
  rationale: שָׁלָל என்பது போரில் கைப்பற்றப்பட்ட பொருள்களைக் குறிக்கிறது; demonstrative-இன் குறிப்புத்தன்மையையும் ‘அந்த நகரம்’ பாதுகாக்கிறது.
- source_word: בָּזְזוּ לָהֶם
  choice: தங்களுக்காக எடுத்துக்கொண்டார்கள்
  rationale: பொருள்களைப் போர்க்கொள்ளையாகத் தமக்கென வைத்துக்கொண்ட பொருளைத் தெளிவாகச் சொல்கிறது; ‘கொள்ளைப்பொருள்களைக் கொள்ளையிட்டார்கள்’ என்ற இயல்பற்ற மீளுரையைத் தவிர்க்கிறது.
- source_word: יִשְׂרָאֵל
  choice: இஸ்ரவேலர்
  rationale: தேசத்தை ஒரு கூட்டு மக்களாகக் குறிக்கும் எபிரெயப் பயன்பாட்டை இயல்பான தமிழில் தருகிறது.
- source_word: כִּדְבַר יְהוָה
  choice: யாவே ... வார்த்தையின்படியே
  rationale: செயல் தெய்வீகக் கட்டளைக்கு முழுமையாக இணங்கியது என்ற பொருளையும் ‘வார்த்தை’ என்ற மூலப்படிமத்தையும் காக்கிறது.
- source_word: אֲשֶׁר צִוָּה אֶת יְהוֹשֻׁעַ
  choice: யோசுவாவுக்குக் கட்டளையிட்டிருந்த
  rationale: கதை நிகழ்வுக்கு முன்பே வழங்கப்பட்ட கட்டளையைத் தமிழில் இயல்பாகக் காட்டுகிறது.
