  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டது. எபிரெய வாக்கியத்தின் நீண்ட தொடரை இயல்பான வாசிப்புக்காக இரண்டு வாக்கியங்களாகப் பிரித்தாலும், இரண்டாவது வாக்கியத்தில் உள்ள ‘அவர்கள்’ இஸ்ரவேலரையே தெளிவாகச் சுட்டுகிறது.
