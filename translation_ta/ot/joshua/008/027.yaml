- issue: יְהוָה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூலத்தில் உள்ள தனிப்பட்ட இறைப் பெயரை ஒரு பட்டப்பெயரால் மாற்றாமல், தமிழில் ஏற்ற ஒலிபெயர்ப்பாக வழங்குகிறது.
