  source_fidelity: மூல எபிரேயத்தின் வாவ்-தொடர்ச்சி வினைகள், தோராய எண்ணைக் குறிக்கும் כ־, கூட்டுப் பொருளிலுள்ள אִישׁ, பதுங்கித் தாக்குவதற்கான அணி என்ற אֹרֵב, மற்றும் நகரத்துக்கு மேற்கான இடக்குறிப்பு ஆகியவை பொருளில் நன்றாகக் காக்கப்பட்டுள்ளன. “அழைத்துக்கொண்டு” படைச் சூழலில் וַיִּקַּח-க்கு இயல்பான, அளவான வெளிப்பாடு; அது தேவையற்ற விளக்கத்தைச் சேர்ப்பதில்லை.
  naturalness: “அவன் ஏறக்குறைய ஐயாயிரம் பேரை அழைத்துக்கொண்டு, அவர்களைப் பெத்தேலுக்கும் ஆயிக்கும் இடையில், நகரத்தின் மேற்கே பதுங்கியிருக்க வைத்தான்” என்பது நவீனத் தரத் தமிழில் தெளிவான, கண்ணியமான வரலாற்று-கதைநடை. “பதுங்கியிருக்க வைத்தான்” பதுங்கித் தாக்கக் காத்திருக்கும் அணியை இயல்பாக வெளிப்படுத்துகிறது.
  terminology: பெத்தேல், ஆயி ஆகிய இடப்பெயர்கள் நிலையான தமிழ் வேதாகமப் பயன்பாட்டுக்கு ஏற்றவை. “ஏறக்குறைய” எண்ணின் அண்மைத்தன்மையைப் பாதுகாக்கிறது; “மேற்கே” יָם-ன் புவியியல் திசைப் பயன்பாட்டைச் சரியாகக் காட்டுகிறது. அடிக்குறிப்புகள் உரிய கூற்றுகளோடு இணைக்கப்பட்டுள்ளன.
