base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/012.yaml
  text: And he took about five thousand men and set them in ambush between Bethel and Ai[b][a], west of the city.
translation:
  language: ta
  text: அவன் ஏறக்குறைய ஐயாயிரம் பேரை அழைத்துக்கொண்டு, அவர்களைப் பெத்தேலுக்கும் ஆயிக்கும் இடையில், நகரத்தின் மேற்கே பதுங்கியிருக்க வைத்தான்.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ஏறக்குறைய ஐயாயிரம் பேர்” என்பது எபிரேயச் சொல்லமைப்பைத் தொடர்ந்து வருகிறது; ‘ஐந்து’ என்பதற்கு முன் சேர்ந்துள்ள כ, இந்த எண்ணிக்கை தோராயமானது என்பதைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: எபிரேயத்தில் நேரடியாக “நகரத்தின் கடல் பக்கத்தில்” என்று உள்ளது; இங்கு “கடல்” என்பது வழக்கமாக மேற்குத் திசையைக் குறிக்கிறது.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּקַּח
  choice: அழைத்துக்கொண்டு
  rationale: לקח என்பதன் அடிப்படைப் பொருள் ‘எடுத்தான்’; படைச் சூழலில் ஒரு பெரிய படையிலிருந்து ஆட்களைத் தேர்ந்தெடுத்து அழைத்துக்கொண்டான் என்ற இயல்பான தமிழ்ப் பொருளை இது தருகிறது, ஆனால் ‘தேர்ந்தெடுத்தான்’ என வெளிப்படையாகக் கூறி மூலத்தை மீறுவதில்லை.
- source_word: כַּחֲמֵשֶׁת אֲלָפִים אִישׁ
  choice: ஏறக்குறைய ஐயாயிரம் பேரை
  rationale: எண்ணுக்கு முன் வரும் כ அண்மை மதிப்பைக் குறிக்கிறது; ஆகவே எண்ணைத் துல்லியமான மொத்தமாகக் காட்டாமல் ‘ஏறக்குறைய’ என்று மொழிபெயர்க்கப்பட்டது. אִישׁ கூட்டாக மனிதர்களைக் குறிக்கிறது.
- source_word: וַיָּשֶׂם אוֹתָם אֹרֵב
  choice: அவர்களைப் … பதுங்கியிருக்க வைத்தான்
  rationale: שׂים என்பது ‘வைத்தல்/நிறுத்துதல்’; אֹרֵב இங்கு தாக்குவதற்காக மறைந்து காத்திருக்கும் படையைக் குறிக்கிறது. தமிழில் ‘பதுங்கியிருக்க வைத்தான்’ என்பது செயற்பாட்டையும் இராணுவ நோக்கையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: בֵּין בֵּית אֵל וּבֵין הָעַי
  choice: பெத்தேலுக்கும் ஆயிக்கும் இடையில்
  rationale: இடத்தைக் குறிக்கும் எபிரேயத் தொடரை நேராகவும் இயல்பாகவும் வழங்குகிறது; பெயர்கள் தமிழ் வேதாகமப் பயன்பாட்டிற்கு ஏற்றவாறு ஒலிபெயர்க்கப்பட்டுள்ளன.
- source_word: מִיָּם לָעִיר
  choice: நகரத்தின் மேற்கே
  rationale: יָם என்பதன் நேரடிப் பொருள் ‘கடல்’; புவியியல் திசைப் பயன்பாட்டில் அது ‘மேற்கு’ என்பதைக் குறிக்கிறது. இத்தொடர் நகரத்தை ஒப்பிட்டு பதுங்குப் படையின் இருப்பிடத்தைக் குறிப்பிடுகிறது.
