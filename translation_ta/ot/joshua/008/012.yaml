translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் dignified narrative நடை பயன்படுத்தப்பட்டுள்ளது. ‘பதுங்கியிருக்க வைத்தான்’ என்பது ‘பதுங்கிப் படை அமைத்தான்’ என்பதைவிட மூலத்தின் வினை அமைப்பை நெருக்கமாகக் காக்கிறது. எல்லா அடிக்குறிப்பு குறியீடுகளும் உரையில் இடம்பெற்றுள்ளன.
