  text: And all the people who were in the city were called out to pursue them[b][a], and they pursued Joshua and were drawn away from the city.
translation:
  language: ta
  text: நகரத்தில் இருந்த மக்கள் அனைவரும் அவர்களைத் துரத்தும்படி அழைக்கப்பட்டனர்[a]. அவர்கள் யோசுவாவைத் துரத்திச் சென்றார்கள்; நகரத்திலிருந்து பிரிக்கப்பட்டனர்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கூக்குரலிட்டார்கள்.” இங்குள்ள எபிரெய வினைச்சொல் கூக்குரலிடுவதைக் குறிக்கலாம்; ஆனால் இச்சூழலில் துரத்துவதற்காக அழைக்கப்படுதல் அல்லது திரட்டப்படுதல் என்ற பொருள் அதிகம் பொருந்துகிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “நகரத்திலிருந்து இழுக்கப்பட்டார்கள்,” “நகரத்திலிருந்து பிடுங்கப்பட்டார்கள்.” அவர்கள் நகரத்திலிருந்து வெளியே இழுக்கப்பட்டு அதனிடமிருந்து பிரிக்கப்பட்டதை எபிரெயச் சொல் உணர்த்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּזָּעֲקוּ
  choice: அழைக்கப்பட்டார்கள்
  rationale: זעק என்பதன் நிஃபால் வடிவம் இச்சூழலில் வெறுமனே கூக்குரலிட்டதை அல்ல, துரத்திச் செல்வதற்காக மக்கள் அழைக்கப்பட்டதையோ திரட்டப்பட்டதையோ குறிக்கலாம். செயலற்ற வடிவத்தையும் படைநடவடிக்கைச் சூழலையும் இத்தேர்வு இயல்பாகக் காட்டுகிறது.
- source_word: כָּל הָעָם אֲשֶׁר בָּעִיר
  choice: நகரத்தில் இருந்த மக்கள் அனைவரும்
  rationale: עָם என்பது பொதுவாக ‘மக்கள்’ என்றும் சூழலின்படி ‘படையினர்’ என்றும் அமையலாம். எபிரெயத்தில் இல்லாத பாலினக் குறிப்பைச் சேர்க்காமல் பரந்த பொருளைத் தக்கவைக்கிறது.
- source_word: לִרְדֹּף אַחֲרֵיהֶם
  choice: அவர்களைத் துரத்திச் செல்ல
  rationale: רדף אחרי என்ற வழக்குச் சொற்றொடரின் பின்தொடர்ந்து விரட்டுதல் என்ற பொருளைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: וַיִּרְדְּפוּ אַחֲרֵי יְהוֹשֻׁעַ
  choice: அவர்கள் யோசுவாவைத் துரத்திச் சென்றார்கள்
  rationale: முந்தைய பன்மைச் சுட்டுப்பெயரிலிருந்து யோசுவா என்ற தனிநபர்மீது மூல உரை மாற்றும் கவனத்தைச் சீராக்காமல் அப்படியே பாதுகாக்கிறது.
- source_word: וַיִּנָּתְקוּ מִן הָעִיר
  choice: நகரத்திலிருந்து விலக்கப்பட்டார்கள்
  rationale: נתק என்பதன் நிஃபால் வடிவம் பிடுங்கப்படுதல், பிரிக்கப்படுதல் அல்லது ஓரிடத்திலிருந்து இழுத்துச் செல்லப்படுதல் ஆகிய பொருள்களைத் தரலாம். நகரத்தின் பாதுகாப்பிலிருந்து துரத்துவோர் பிரிக்கப்பட்ட தந்திர விளைவை ‘விலக்கப்பட்டார்கள்’ இயல்பாக வெளிப்படுத்துகிறது; உடல்ரீதியாக வெட்டப்பட்டார்கள் என்று மிகைப்படுத்துவதில்லை.
- source_word: יְהוֹשֻׁעַ
  choice: யோசுவா
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் நிலைபெற்றுள்ள பெயர் வடிவம் பயன்படுத்தப்படுகிறது.
