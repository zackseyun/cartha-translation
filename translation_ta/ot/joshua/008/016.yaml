translation_notes:
  register: நவீனத் தரத் தமிழில் எளிதில் புரியும், அதேவேளையில் கண்ணியமான வரலாற்றுக் கதைநடை பயன்படுத்தப்பட்டுள்ளது. மூல உரையிலுள்ள ‘அவர்களை’ என்பதிலிருந்து ‘யோசுவா’ என்பதற்கான கவனமாற்றமும், இறுதி வினைச்சொல்லின் பிரித்தல்/இழுத்துச் செல்லுதல் சார்ந்த பொருள் அகலமும் பாதுகாக்கப்பட்டுள்ளன.
