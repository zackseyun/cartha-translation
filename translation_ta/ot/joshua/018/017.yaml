base_translation:
  language: en
  yaml_path: translation/ot/joshua/018/017.yaml
  text: Then it curved northward and went out to En-shemesh[a], and went out to Geliloth, which is opposite the Ascent of Adummim[c][b], and it went down to the stone of Bohan son of Reuben.
translation:
  language: ta
  text: பின்பு எல்லை வடக்கு நோக்கி வளைந்து, ஏன்-ஷெமேஷ்[a] வரை சென்று, அதும்மீம் ஏற்றத்திற்கு[c] எதிரிலுள்ள கெலிலோத்[b] வரை சென்றது; பின்னர் அது ரூபேனின் மகன் போஹானின் கல்லுக்கு இறங்கிச் சென்றது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ஏன்-ஷெமேஷ்” என்பதற்கு “சூரியனின் ஊற்று” என்று பொருள்; முதன்மை உரையில் அது இடப்பெயராக ஒலிபெயர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
  - marker: b
    text: “கெலிலோத்” என்பதைச் சொற்பொருளில் “வட்டங்கள்” அல்லது “மாவட்டங்கள்” என்றும் புரிந்துகொள்ளலாம்; இங்கு அது இடப்பெயராகக் கொள்ளப்பட்டுள்ளது.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, “அதும்மீம் கணவாய்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְתָאַר מִצָּפוֹן
  choice: வடக்கு நோக்கி வளைந்து
  rationale: எல்லை விவரிப்பில் תאר எல்லைக்கோடு திசைமாறி வளைந்து செல்வதைக் குறிக்கிறது; מִצָּפוֹן இங்கு இயக்கத்தின் திசையாகப் புரிந்துகொள்ளப்படுகிறது.
- source_word: וְיָצָא
  choice: வரை சென்று
  rationale: பிரதேச எல்லைச் சூத்திரத்தில் அடுத்த இடத்தை அடையும் எல்லையின் தொடர்ச்சியான போக்கை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: עֵין שֶׁמֶשׁ
  choice: ஏன்-சேமேஷ்
  rationale: இது ஓர் இடப்பெயர் என்பதால் பொருளாக்காமல் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: גְּלִילוֹת
  choice: கெலிலோத்
  rationale: சொல்லுக்கு பொதுப்பொருள் இருக்கக்கூடும் என்றாலும், இங்கு இடப்பெயராகச் செயல்படுவதால் ஒலிபெயர்ப்பு ஏற்றது.
- source_word: נֹכַח
  choice: எதிரே
  rationale: இரு இடங்களின் நேரெதிர் நிலையைத் தெளிவாகக் குறிக்கும் இயல்பான இடவியல் சொல்.
- source_word: מַעֲלֵה אֲדֻמִּים
  choice: அதும்மீம் ஏற்றம்
  rationale: מַעֲלֵה மேல்நோக்கிச் செல்லும் ஏற்றத்தைக் குறிக்கிறது; அதும்மீம் இடப்பெயராக ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: וְיָרַד
  choice: சரிந்திறங்கியது
  rationale: நிலப்பரப்பில் கீழ்நோக்கிச் சென்ற எல்லையின் போக்கைச் சுருக்கமாகவும் தெளிவாகவும் காட்டுகிறது.
- source_word: אֶבֶן בֹּהַן בֶּן רְאוּבֵן
  choice: ரூபேனின் மகன் போகானின் கல்
  rationale: எபிரெயக் கட்டமைப்பை இயல்பான தமிழ் உடைமைத் தொடராக வழங்கி, போகானை ரூபேனின் மகன் அல்லது வழித்தோன்றல் என அடையாளப்படுத்துகிறது.
