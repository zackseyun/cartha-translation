translation_notes:
  register: நவீன, தெளிவான, கண்ணியமான தமிழ். எல்லைக்கோடு என்பதைக் குறிக்க ‘எல்லை’ எழுவாயாக வெளிப்படையாகச் சேர்க்கப்பட்டது. மூலத்தின் நிலவியல் ‘தோள்’ உருவகம் வாசிப்பில் இயல்புக்காக ‘மலைச்சரிவு’ என வழங்கப்பட்டு அடிக்குறிப்பில் விளக்கப்பட்டது. அனைத்து அடிக்குறிப்பு குறிகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
