  text: Then it passed on to the shoulder opposite the Arabah on the north[b][a], and went down to the Arabah.
translation:
  language: ta
  text: பின்பு எல்லை, வடக்கே அரபாவுக்கு எதிரே இருந்த சரிவை[a] நோக்கிச் சென்று, அரபாவை நோக்கிக் கீழிறங்கியது.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் ‘தோள்’; நிலவியல் உருவகமாக இது ஒரு பக்கம், மேடு அல்லது சரிவைக் குறிக்கலாம்.
    reason: cultural_note
  - marker: b
    text: ‘அரபா’ என்பதற்குப் பதிலாக ‘சமவெளி’ என்றும் மொழிபெயர்க்கலாம்; எபிரெயச் சொல் ஒரு பிராந்தியப் பெயராகவும் பொதுவான நிலவியல் சொல்லாகவும் பயன்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָבַר
  choice: பின்பு எல்லை ... கடந்து
  rationale: எல்லை விவரிப்புகளில் עבר என்பது எல்லைக்கோடு அடுத்த நிலக்குறியை நோக்கித் தொடர்வதைக் குறிக்கிறது. தமிழில் எழுவாயை வெளிப்படையாகச் சேர்த்து, இயக்க உணர்வை இயல்பாகத் தருகிறது.
- source_word: אֶל
  choice: '... மலைச்சரிவைக்'
  rationale: இலக்கை நோக்கிய இயக்கத்தைத் தரும் முன்னிடைச்சொல்; தமிழ் வேற்றுமை உருபுடன் இயல்பாக வெளிப்படுத்தப்பட்டது.
- source_word: כֶּתֶף
  choice: மலைச்சரிவு
  rationale: சொல்லர்த்தம் ‘தோள்’; நிலவியல் பயன்பாட்டில் ஒரு பக்கம், மேடு அல்லது சரிவைக் குறிக்கும். புரிந்துகொள்ள எளிதான இயற்கையான தமிழ்ச் சொல் தேர்ந்தெடுக்கப்பட்டது; உருவகம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: מוּל
  choice: எதிரிலிருந்த
  rationale: இரு நிலப்பகுதிகளுக்கிடையேயான இடவியல் எதிர்நிலையை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: הָעֲרָבָה
  choice: அரபா
  rationale: இங்கு பொதுவான நிலவியல் சொல்லாகவும் பிராந்தியப் பெயராகவும் கொள்ளக்கூடிய எபிரெயச் சொல். மிகையாகக் குறிப்பாக்காமல் ‘அரபா’ என்ற பெயர் வடிவம் பாதுகாக்கப்பட்டது.
- source_word: צָפֹנָה
  choice: வடக்கே
  rationale: வடதிசை சார்ந்த அமைவிடத்தைச் சுருக்கமாகக் காட்டுகிறது; இயக்கத்தை மட்டும் குறிக்கும் ‘வடக்கு நோக்கி’ என்பதைக் காட்டிலும் சூழலுக்கு ஏற்றது.
- source_word: וְיָרַד
  choice: இறங்கியது
  rationale: நிலப்பரப்பில் கீழ்நோக்கிச் செல்லும் எல்லைக்கோட்டை இயல்பான நவீன தமிழில் குறிக்கிறது.
- source_word: הָעֲרָבָתָה
  choice: அரபாவை நோக்கி
  rationale: திசைகாட்டும் ־ה பின்னொட்டு அரபாவை நோக்கிய இயக்கத்தைக் குறிக்கிறது. ‘நோக்கி’ என்பது இலக்கை அடைந்ததா என்ற கேள்வியைத் தேவையின்றி முடிவுசெய்யாமல் இயக்கத் திசையைப் பாதுகாக்கிறது.
