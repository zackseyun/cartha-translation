lexical_decisions:
- source_word: כְפַר העמני
  choice: கெபார்-அம்மோனி
  rationale: இது நிலையான இடப்பெயராக இருப்பதால் பொருள் மொழிபெயர்ப்பு செய்யாமல், எபிரெய ஒலிப்பை நவீனத் தமிழுக்கு ஏற்றவாறு எழுத்துப்பெயர்த்துள்ளது; தொடக்க வாவ், பட்டியலின் தொடர்ச்சியைத் தமிழில் இயல்பாக அமைக்கும் வாக்கிய வடிவில் தனியே மொழிபெயர்க்கப்படவில்லை.
- source_word: הָעָפְנִי
  choice: ஒப்னி
  rationale: பட்டணப் பட்டியலில் வரும் இடப்பெயர்; எபிரெய ஒலிப்புக்கு அண்மையாகத் தமிழில் எழுத்துப்பெயர்க்கப்பட்டுள்ளது. முன்னொட்டுக் குறிப்புச்சொல் பெயரின் பகுதியாகக் கருதப்பட்டுள்ளது.
- source_word: גָבַע
  choice: கேபா
  rationale: இங்கு பொதுப்பெயரான ‘மேடு’ அல்ல, பென்யமீன் பிரதேசத்திலுள்ள இடப்பெயர் என்பதால் எழுத்துப்பெயர்க்கப்பட்டுள்ளது.
- source_word: עָרִים
  choice: பட்டணங்கள்
  rationale: நிலப்பங்கீட்டுப் பட்டியலின் சூழலில் நகர்ப்புறக் குடியிருப்புகளைக் குறிக்கிறது; நவீனத் தமிழில் ‘பட்டணங்கள்’ என்பது இயல்பாகவும் பாரம்பரியப் பட்டியல் நடைக்கு ஏற்றதாகவும் உள்ளது.
- source_word: שְׁתֵּים עֶשְׂרֵה
  choice: பன்னிரண்டு
  rationale: பட்டணங்களின் எண்ணிக்கையைக் குறிக்கும் நேரடியான எண்ணுப்பெயர்.
- source_word: חַצְרֵיהֶן
  choice: அவற்றைச் சேர்ந்த கிராமங்கள்
  rationale: குறிப்பிடப்பட்ட பட்டணங்களைச் சார்ந்த சிறிய, பெரும்பாலும் மதிலற்ற குடியிருப்புகளைக் குறிக்கிறது; சொந்தத்தையும் சார்பையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
