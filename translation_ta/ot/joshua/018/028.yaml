base_translation:
  language: en
  yaml_path: translation/ot/joshua/018/028.yaml
  text: Zela[a], Haeleph, the Jebusite (that is, Jerusalem), Gibeath, Kiriath—fourteen cities with their villages[c][b]. This was the inheritance of the sons of Benjamin according to their clans.
translation:
  language: ta
  text: சேலா, ஹா-எலெப்[b], எபூசியர்[a] (அதுவே எருசலேம்), கிபெயாத்[b], கிரியாத்[c]—மொத்தம் பதினான்கு நகரங்களும் அவற்றின் கிராமங்களும். பென்யமீன் மகன்களுக்கு அவர்களுடைய குலங்களின்படி கிடைத்த சுதந்தரப் பங்கு இதுவே.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயில் நேரடியாக, “எபூசியர்; அதுவே எருசலேம்” என்று உள்ளது. ‘எபூசியர்’ என்ற இனப்பெயர் இங்கு எருசலேம் நகரைக் குறிக்கும் இடப்பெயராகப் பயன்படுத்தப்பட்டுள்ளது.
    reason: lexical_alternative
  - marker: b
    text: சில மொழிபெயர்ப்புகள் “ஹா-எலெப்” என்பதை “எலெப்” என்றும், “கிபெயாத்” என்பதை “கிபெயா” என்றும் வழங்குகின்றன.
    reason: alternative_reading
  - marker: c
    text: இவ்வசனத்தின் எபிரெய உரையில் “கிரியாத்” என்றே உள்ளது; “கிரியாத்-யெயாரீம்” என்று இல்லை.
    reason: textual_clarification
lexical_decisions:
- source_word: וְ/צֵלַע
  choice: சேலா
  rationale: இது ஓர் இடப்பெயர் என்பதால் பொருள் மொழிபெயர்ப்பு செய்யாமல், எபிரெய ஒலிவடிவத்துக்கு நெருக்கமாக எழுத்துப்பெயர்க்கப்பட்டது.
- source_word: הָאֶלֶף
  choice: ஹா-எலெப்
  rationale: எபிரெய மூலத்தில் உள்ள முன்னொட்டு உட்பட இடப்பெயரின் வடிவம் பாதுகாக்கப்பட்டது; ‘எலெப்’ என்ற எளிய வடிவம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: וְ/הַ/יְבוּסִי הִיא יְרוּשָׁלִַם
  choice: எபூசியர் (அதுவே எருசலேம்)
  rationale: மூலத்தின் நேரடி அமைப்பான ‘எபூசியர்; அதுவே எருசலேம்’ என்பதையும், இங்கு இனப்பெயர் நகரைக் குறிக்கும் அசாதாரண பயன்பாட்டையும் முடிந்தவரை பாதுகாக்கிறது.
- source_word: גִּבְעַת
  choice: கிபெயாத்
  rationale: இவ்வசனத்தின் மெய்யெழுத்து வடிவத்தை பிரதிபலிக்கும் இடப்பெயர் எழுத்துப்பெயர்ப்பு; பரிச்சயமான ‘கிபெயா’ மாற்று வடிவம் அடிக்குறிப்பில் குறிப்பிடப்பட்டுள்ளது.
- source_word: קִרְיַת
  choice: கிரியாத்
  rationale: மூல எபிரெய உரையில் இவ்வசனத்தில் இருப்பது ‘கிரியாத்’ மட்டுமே; இல்லாத ‘யெயாரீம்’ சேர்க்கப்படவில்லை.
- source_word: עָרִים אַרְבַּע עֶשְׂרֵה
  choice: பதினான்கு நகரங்கள்
  rationale: நிலப்பங்கீட்டுப் பட்டியலில் עָרִים என்பதற்கான இயல்பான நவீனத் தமிழ் சொற்றொடர்.
- source_word: וְ/חַצְרֵי/הֶן
  choice: இவற்றின் கிராமங்களோடு சேர்த்து
  rationale: חָצֵר இச்சூழலில் நகரங்களைச் சார்ந்த சிற்றூர்கள் அல்லது மதிலற்ற குடியிருப்புகளைக் குறிக்கிறது; ‘கிராமங்கள்’ இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: זֹאת נַחֲלַת
  choice: இதுவே ... கிடைத்த உரிமைச்சொத்து
  rationale: எபிரெயில் வினையில்லாத முடிவுச் சூத்திரத்தைத் தமிழில் இயல்பாக்க ‘கிடைத்த’ சேர்க்கப்பட்டது; நַחֲלָה குறிக்கும் பரம்பரை உரிமையுள்ள பங்கை ‘உரிமைச்சொத்து’ வெளிப்படுத்துகிறது.
- source_word: בְּנֵי בִנְיָמִן
  choice: பென்யமீனின் மக்கள்
  rationale: ‘பென்யமீனின் மகன்கள்’ என்ற நேரடி வடிவம் முழுக் கோத்திரத்தையும் குறிக்கும்; நவீனத் தமிழில் அதே கூட்டு அர்த்தத்தைத் தெளிவாக வழங்க ‘மக்கள்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: לְ/מִשְׁפְּחֹתָם
  choice: அவர்களுடைய குலங்களின்படி
  rationale: நிலப்பங்கீட்டுச் சூழலில் מִשְׁפָּחָה கோத்திரத்துக்குள் உள்ள குலப் பிரிவைக் குறிக்கிறது.
