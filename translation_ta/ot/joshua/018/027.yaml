  rationale: ஒவ்வொரு பெயருக்கும் முன் வரும் எபிரெய இணைப்பிடைச்சொல்லை மீண்டும் மீண்டும் ‘மற்றும்’ என்று வழங்காமல், இயல்பான தமிழ் பட்டியல் நடையில் காற்புள்ளிகளால் குறிக்கிறது.
