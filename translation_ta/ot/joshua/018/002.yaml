revisions:
- from: ஆனால் இஸ்ரவேல் மக்களில் தங்கள் உரிமைச்சொத்தை இன்னும் பங்கிட்டுக்கொள்ளாத ஏழு கோத்திரங்கள் மீதியிருந்தன.[a]
  to: ஆனால் இஸ்ரவேல் மக்களுள், தங்கள் மரபுரிமைப் பங்கை இன்னும் பங்கிடாத ஏழு கோத்திரங்கள் எஞ்சியிருந்தன.[a]
  rationale: The revision retains the Hebrew’s active surface wording (“had not apportioned/divided”) while the footnote preserves the contextually plausible passive/allotment sense. It also uses more idiomatic Tamil for those who remained and a more context-specific rendering for the inherited territorial portion.
  reviewer_model: gpt-5.6-terra
