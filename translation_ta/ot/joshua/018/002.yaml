source:
  edition: WLC
  text: וַ/יִּוָּֽתְרוּ֙ בִּ/בְנֵ֣י יִשְׂרָאֵ֔ל אֲשֶׁ֥ר לֹֽא חָלְק֖וּ אֶת נַֽחֲלָתָ֑/ם שִׁבְעָ֖ה שְׁבָטִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/018/002.yaml
  text: But among the sons of Israel there remained seven tribes that had not apportioned their inheritance[a][b].
translation:
  language: ta
  text: ஆனால் இஸ்ரவேல் மக்களுள், தங்கள் மரபுரிமைப் பங்கை இன்னும் பங்கிடாத ஏழு கோத்திரங்கள் எஞ்சியிருந்தன.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தங்கள் மரபுரிமைப் பங்கு இன்னும் பங்கிடப்படாத ஏழு கோத்திரங்கள்.” எபிரெய வினைச்சொல், கோத்திரங்கள் தங்கள் மரபுரிமைப் பங்கை இன்னும் பங்கிடாததையோ, அவர்களுக்கான மரபுரிமைப் பங்கு இன்னும் ஒதுக்கப்படாததையோ உணர்த்தலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּוָּתְרוּ
  choice: மீதியிருந்தன
  rationale: יתר என்பதன் நிஃபால் வடிவம் இன்னும் எஞ்சியிருந்தவர்களைக் குறிக்கிறது; தமிழ் வாக்கியத்தில் கோத்திரங்கள் எழுவாயாக இருப்பதால் ‘மீதியிருந்தன’ இயல்பாகவும் மூலத்தின் பொருளுக்கு நெருக்கமாகவும் உள்ளது.
- source_word: בִּבְנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்களில்
  rationale: எபிரெய மொழியில் நேரடியாக ‘இஸ்ரவேலின் மகன்களில்’ என்றாலும், இங்கு முழு இஸ்ரவேல் சமூகத்தைக் குறிப்பதால் பாலினத்தைத் தேவையின்றிக் குறுக்காத இயல்பான நவீனத் தமிழ் சொற்றொடர் தேர்ந்தெடுக்கப்பட்டது.
- source_word: אֲשֶׁר לֹא חָלְקוּ
  choice: இன்னும் பங்கிட்டுக்கொள்ளாத
  rationale: חלק என்பதற்கு ‘பிரி/பங்கிடு’ என்பது அடிப்படைப் பொருள். இந்தச் சூழலில் அந்த ஏழு கோத்திரங்களுக்கான நிலப்பங்கு இன்னும் ஒதுக்கப்படாத நிலையைக் குறிக்கிறது; செயப்பாட்டு மற்றும் பெறுபாட்டு நுணுக்கங்களுக்கிடையிலான மூலத்தின் அழுத்தத்தை முழுமையாகத் தீர்மானிக்காமல் ‘பங்கிட்டுக்கொள்ளாத’ என வழங்கப்பட்டுள்ளது.
- source_word: אֶת נַחֲלָתָם
  choice: தங்கள் உரிமைச்சொத்தை
  rationale: נחלה இங்கு குலத்துக்குரிய பரம்பரை நிலப்பங்கைக் குறிக்கிறது. ‘உரிமைச்சொத்து’ என்பது நவீனத் தமிழில் நிலையான உரிமையையும் பரம்பரைப் பங்கையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: שִׁבְעָה שְׁבָטִים
  choice: ஏழு கோத்திரங்கள்
  rationale: இஸ்ரவேலின் குல அமைப்பைக் குறிக்கும் שבט என்பதற்கான பரவலாக அறியப்பட்ட வேதாகமத் தமிழ் சொல் ‘கோத்திரம்’; பன்மையில் ‘கோத்திரங்கள்’ என வழங்கப்பட்டது.
theological_decisions:
- issue: நிலப்பங்கீட்டில் ஏழு கோத்திரங்களின் செயற்பாடு அல்லது அவர்களுக்கு ஒதுக்கீடு செய்யப்படாத நிலை
  choice: தங்கள் உரிமைச்சொத்தை இன்னும் பங்கிட்டுக்கொள்ளாத
  alternative: தங்கள் உரிமைச்சொத்து இன்னும் பங்கிடப்படாத
  rationale: எபிரெய வினையின் இலக்கண எழுவாய் கோத்திரங்களே; எனினும் சூழல் அவர்களுக்கு நிலம் இன்னும் ஒதுக்கப்படவில்லை என்பதையும் உணர்த்துகிறது. முதன்மை உரை செயற்பாட்டு வடிவத்தைப் பாதுகாக்கிறது; காலச்சூழலைத் தெளிவாக்க ‘இன்னும்’ சேர்க்கப்பட்டுள்ளது, மாற்று நுணுக்கம் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன, கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘இஸ்ரவேல் மக்களில்’ என்பது எபிரெய குடும்பவழக்கை இயல்பான உள்ளடக்கமிக்க தமிழில் தருகிறது. ‘கோத்திரங்கள்’ மற்றும் ‘உரிமைச்சொத்து’ ஆகியவை வேதாகமச் சூழலைக் காக்கும் போதும் வாக்கியம் மிகப் பழமையான நடையில் அமையாமல் பார்த்துக்கொள்ளப்பட்டுள்ளது.
