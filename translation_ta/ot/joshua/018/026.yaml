  text: ஹமிஸ்பே[a], ஹக்கெபிரா, ஹம்மோசா ஆகிய ஊர்களும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது, பெயர்களுக்கு முன்சேர்ந்துள்ள הַ என்பதை இடப்பெயரின் ஒரு பகுதியாக அல்லாமல் வழக்கமான திட்டவுருபாக எடுத்தால்: “மிஸ்பே, கெபிரா, மோசா ஆகிய ஊர்களும்.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ
  choice: -உம் / ஆகிய ஊர்களும்
  rationale: முந்தைய வசனத்திலிருந்து தொடரும் ஊர்ப்பட்டியலைத் தமிழில் இயல்பாக இணைக்கிறது. எபிரேய இணைப்புச் சொல் ஒவ்வொரு பெயருக்கும் முன் வந்தாலும், தமிழில் பெயர்களைத் தொகுத்து இறுதியில் ‘ஆகிய ஊர்களும்’ என வழங்குவது தெளிவான நடை.
- source_word: הַמִּצְפֶּה
  choice: ஹமிஸ்பே
  rationale: இது ஓர் இடப்பெயர்; ‘காவலிடம்’ என்று பொருள் மொழிபெயர்க்காமல் ஒலிபெயர்க்கப்பட்டது. முன்சேர்க்கப்பட்ட הַ கூறும் பெயரின் ஓர் அங்கமாக ‘ஹ’ வடிவில் தக்கவைக்கப்பட்டது.
- source_word: הַכְּפִירָה
  choice: ஹக்கெபிரா
  rationale: இடப்பெயராக ஒலிபெயர்க்கப்பட்டது. הַ என்னும் முன்சேர்க்கையும் כּ எழுத்தின் இரட்டிப்பு ஒலியும் ‘ஹக்கெ-’ எனப் பிரதிபலிக்கப்படுகின்றன.
- source_word: הַמֹּצָה
  choice: ஹம்மோசா
  rationale: இடப்பெயராக ஒலிபெயர்க்கப்பட்டது. முன்சேர்க்கப்பட்ட הַ கூறும் மெய்யெழுத்தின் இரட்டிப்பு ஒலியும் ‘ஹம்மோ-’ எனத் தக்கவைக்கப்பட்டன.
