source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר יְהוֹשֻׁ֖עַ אֶל בְּנֵ֣י יִשְׂרָאֵ֑ל עַד אָ֨נָה֙ אַתֶּ֣ם מִתְרַפִּ֔ים לָ/בוֹא֙ לָ/רֶ֣שֶׁת אֶת הָ/אָ֔רֶץ אֲשֶׁר֙ נָתַ֣ן לָ/כֶ֔ם יְהוָ֖ה אֱלֹהֵ֥י אֲבֽוֹתֵי/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/018/003.yaml
  text: And Joshua said to the sons of Israel[a], “How long will you be slack about going in to take possession of the land that Yahweh, the God of your fathers, has given you?”
translation:
  language: ta
  text: யோசுவா இஸ்ரவேலின் மக்களிடம்[a], “உங்கள் தந்தையரின் கடவுளாகிய யாவே உங்களுக்குக் கொடுத்துள்ள நாட்டிற்குள் சென்று அதை உடைமையாக்கிக்கொள்வதில் இன்னும் எவ்வளவு காலம் மெத்தனமாக இருப்பீர்கள்?” என்று கேட்டார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லுக்கு சொல், “இஸ்ரவேலின் மகன்களிடம்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: என்று கேட்டார்
  rationale: இது இலக்கணப்படி ‘சொன்னார்’ என்றாலும், தொடர்ந்து வரும் வினா தமிழில் இயல்பாக அமைய ‘என்று கேட்டார்’ என மொழிபெயர்க்கப்பட்டது; எபிரெயக் கதைநடையின் உரையாடல் முன்னேற்றம் காக்கப்படுகிறது.
- source_word: יְהוֹשֻׁעַ
  choice: யோசுவா
  rationale: எபிரெயத் தனிப்பெயரின் தமிழில் நிலைபெற்ற வடிவம்.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் மக்கள்
  rationale: சொல்லுக்கு சொல் ‘இஸ்ரவேலின் மகன்கள்’ என்றாலும், இங்கு இஸ்ரவேல் சமூகத்தைக் குறிக்கும் இயல்பான நவீனத் தமிழ் வடிவம் தேர்ந்தெடுக்கப்பட்டது; நேரடி வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: עַד־אָנָה
  choice: இன்னும் எவ்வளவு காலம்
  rationale: காலத்தைப் பற்றிய கண்டிப்பான வினாவை இயல்பான தமிழில் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: מִתְרַפִּים
  choice: மெத்தனமாக இருப்பீர்கள்
  rationale: רפה என்பதன் இவ்வடிவம் சுறுசுறுப்பின்மை, தளர்ச்சி, அல்லது செயலில் இறங்காத தன்மையைக் குறிக்கிறது. ‘மெத்தனமாக’ என்பது அளவுக்கு மீறிய ஒழுக்கத் தீர்ப்பைச் சேர்க்காமல் கண்டனத் தொனியைத் தக்கவைக்கிறது.
- source_word: לָבוֹא
  choice: நாட்டிற்குள் சென்று
  rationale: அவர்கள் நாட்டிற்குள் நுழைய வேண்டிய திசைநிலையைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: לָרֶשֶׁת
  choice: அதை உடைமையாக்கிக்கொள்வதில்
  rationale: ירשׁ என்பதற்கு உடைமையாக்குதல், சுதந்தரித்தல், குடியேற்று உரிமைபெறுதல் போன்ற பொருள்கள் இருக்கலாம். இச்சூழலில் ‘உடைமையாக்கிக்கொள்’ என்பது சட்ட வாரிசுரிமை அல்லது வெறும் இராணுவ வெற்றி என்ற ஒரே பொருளுக்குள் வசனத்தைச் சுருக்காமல், நாட்டைப் பெற்றுக்கொண்டு வாழும் கருத்தைத் தருகிறது.
- source_word: הָאָרֶץ
  choice: நாடு
  rationale: வாக்குறுதி அளிக்கப்பட்ட நிலப்பரப்பை இங்கு குறிக்கிறது; தமிழில் குறிப்பிட்ட புவிப்பரப்புக்கும் தேசத்துக்கும் ‘நாடு’ இயல்பாக உள்ளது.
- source_word: אֲשֶׁר נָתַן לָכֶם
  choice: உங்களுக்குக் கொடுத்துள்ள
  rationale: எபிரெய நிறைவுவினை, நாடு ஏற்கெனவே கடவுளால் கொடுக்கப்பட்டதாக முன்வைக்கிறது; அதன் நடைமுறை உடைமையாக்கம் இன்னும் நிறைவேறாத பதற்றத்தையும் ‘கொடுத்துள்ள’ காக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: திருநான்கெழுத்தான יהוה ஒரு பட்டத்தால் மாற்றப்படாமல், இறைத் தனிப்பெயராகத் தமிழில் ஒலிபெயர்க்கப்படுகிறது.
- source_word: אֱלֹהֵי אֲבוֹתֵיכֶם
  choice: உங்கள் தந்தையரின் கடவுள்
  rationale: மூலத்தின் ஆண்பால் பன்மையையும் தலைமுறைகளுக்கிடையிலான உடன்படிக்கைச் சூழலையும் காக்கும் நேரடியான வடிவம்.
theological_decisions:
- issue: יהוה என்ற இறைத் தனிப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலத்தில் இறைத் தனிப்பெயர் நேரடியாக உள்ளது. அதை ஒரு பட்டமாக மாற்றாமல் தமிழில் ஒலிபெயர்ப்பது மூலத்தின் தனிப்பெயர் இயல்பைக் காக்கிறது.
- issue: நாடு ஏற்கெனவே கொடுக்கப்பட்டதா அல்லது இன்னும் பெறப்பட வேண்டியதா என்ற பதற்றம்
  choice: ‘கொடுத்துள்ள’ என்பதுடன் ‘உடைமையாக்கிக்கொள்வதில்’
  alternative: ‘கொடுக்கவிருக்கும் நாட்டை’
  rationale: இறைவனுடைய கொடை நிறைவேறியதாகக் கூறப்பட்டாலும், மக்கள் அதற்குள் சென்று நடைமுறையில் உடைமையாக்க வேண்டும் என்ற மூலத்தின் இரு கூறுகளும் ஒன்றாகப் பாதுகாக்கப்படுகின்றன.
translation_notes:
  register: நவீன, மரியாதைமிக்க, பொதுவாசகர்களுக்கு விளங்கும் தமிழ் பயன்படுத்தப்பட்டுள்ளது. கேள்வியின் கண்டிப்புத் தொனி ‘இன்னும் எவ்வளவு காலம்’ மற்றும் ‘மெத்தனமாக’ என்பவற்றால் காக்கப்படுகிறது; தேவையற்ற சமயக்குழுச் சொற்கள் தவிர்க்கப்பட்டுள்ளன.
