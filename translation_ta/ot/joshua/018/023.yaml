  register: நவீனத் தரமான, எளிதில் புரியும் கண்ணியமான தமிழ். இது முந்தைய வசனங்களிலிருந்து தொடரும் ஊர்ப்பட்டியல் என்பதைக் காட்ட, இறுதியில் “ஆகிய ஊர்களும்” என அமைக்கப்பட்டுள்ளது.
