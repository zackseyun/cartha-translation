translation:
  language: ta
  text: அவ்வீம்[a], பாரா, ஒப்ரா ஆகிய ஊர்களும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயச் சொல்லை “அவ்வீமியர்” என்றும் புரிந்துகொள்ளலாம். ஆனால் இங்கு நிலப்பகுதியிலுள்ள ஊர்களின் பட்டியல் வருவதால், இது ஓர் ஊரின் பெயராகக் கொள்ளப்பட்டுள்ளது.
    reason: alternative_reading
lexical_decisions:
- source_word: הָעַוִּים
  choice: அவ்வீம்
  rationale: எல்லைப் பகுதிக்குரிய ஊர்களின் பட்டியலில் வருவதால் இதை ஓர் ஊரின் பெயராக எடுத்துக்கொண்டு, எபிரெய ஒலிக்கு நெருக்கமாக எழுத்துப்பெயர்த்துள்ளோம்.
- source_word: הַפָּרָה
  choice: பாரா
  rationale: பென்யமீனின் பங்கில் உள்ள ஊரின் பெயர். எபிரெய முன்னொட்டு சுட்டிடைச்சொல்லைத் தனியாக மொழிபெயர்க்காமல், பெயரை இயல்பான தமிழ் ஒலிவடிவில் கொடுத்துள்ளோம்.
- source_word: עָפְרָה
  choice: ஒப்ரா
  rationale: இங்கு பொதுப்பொருள் கொண்ட சொல்லாக அல்லாமல் ஊர்ப்பெயராக வருவதால், பெயரை ஒலிபெயர்த்துள்ளோம்.
- source_word: וְ
  choice: ஆகிய ஊர்களும்
  rationale: எபிரெயத்தில் ஒவ்வொரு பெயருக்கும் முன் வரும் இணைப்பை, தொடரும் ஊர்ப்பட்டியலுடன் இயல்பாக இணையும் தமிழ் பட்டியல் நடையில் வழங்கியுள்ளோம்.
