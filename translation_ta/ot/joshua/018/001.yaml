source:
  edition: WLC
  text: וַ/יִּקָּ֨הֲל֜וּ כָּל עֲדַ֤ת בְּנֵֽי יִשְׂרָאֵל֙ שִׁלֹ֔ה וַ/יַּשְׁכִּ֥ינוּ שָׁ֖ם אֶת אֹ֣הֶל מוֹעֵ֑ד וְ/הָ/אָ֥רֶץ נִכְבְּשָׁ֖ה לִ/פְנֵי/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/018/001.yaml
  text: Then the whole congregation of the sons of Israel assembled at Shiloh and set up the tent of meeting there[b][a], and the land was subdued before them.
translation:
  language: ta
  text: பின்பு இஸ்ரவேல் மகன்களின் சபை முழுவதும்[a] சீலோவில் ஒன்றுகூடி, சந்திப்புக் கூடாரத்தை அங்கே நிறுவினார்கள். நாடு அவர்களுக்கு முன்பாகக் கீழ்ப்படுத்தப்பட்டது[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘இஸ்ரவேலர்’; மரபுவழியாக, ‘இஸ்ரவேலின் பிள்ளைகள்.’ எபிரெய மொழியில் சொற்படி, ‘இஸ்ரவேலின் மகன்கள்.’
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘நாடு அவர்களுக்கு முன்பாக வெல்லப்பட்டது.’
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּקָּהֲלוּ
  choice: ஒன்றுகூடி
  rationale: קהל என்பதன் நிபால் வடிவம் ஒரு சபையாகக் கூடிவருவதைக் குறிக்கிறது; ‘ஒன்றுகூடி’ என்பது நவீனத் தமிழில் இயல்பாகவும் கூட்டுச் செயலின் பொருளைத் தெளிவாகவும் தருகிறது.
- source_word: כָּל עֲדַת
  choice: சபை முழுவதும்
  rationale: עֵדָה என்பது ஒருங்கிணைந்த சமூகச் சபையைக் குறிக்கிறது; כָּל என்பதன் முழுமைப் பொருளை ‘முழுவதும்’ வெளிப்படுத்துகிறது.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மகன்கள்
  rationale: எபிரெய மூலத்தின் சொல்லமைப்பையும் ஆண்பால் வடிவத்தையும் காக்கிறது; இயல்பான மாற்றுகளாக ‘இஸ்ரவேலர்’ அல்லது மரபுவழி ‘இஸ்ரவேலின் பிள்ளைகள்’ இருக்கலாம்.
- source_word: שִׁלֹה
  choice: சீலோ
  rationale: இடப்பெயர் தமிழில் வழக்கமான ஒலிபெயர்ப்பு முறையில் தரப்பட்டுள்ளது.
- source_word: וַיַּשְׁכִּינוּ
  choice: நிறுவினார்கள்
  rationale: שכן என்பதன் ஹிஃபில் வடிவம் சொற்படி ‘தங்கச்செய்தார்கள்’ என்றாலும், சந்திப்புக் கூடாரத்தை ஒரு இடத்தில் நிலைநிறுத்திய செயலைத் தமிழில் ‘நிறுவினார்கள்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: אֹהֶל מוֹעֵד
  choice: சந்திப்புக் கூடாரம்
  rationale: எபிரெயச் சொற்றொடரின் வெளிப்படையான பொருளைக் காக்கிறது; அதிக விளக்கமுள்ள சமயக் கலைச்சொல்லைச் சேர்ப்பதைத் தவிர்க்கிறது.
- source_word: נִכְבְּשָׁה
  choice: கீழ்ப்படுத்தப்பட்டிருந்தது
  rationale: כבשׁ என்பதன் செயப்பாட்டு வடிவம் நாடு அவர்களது கட்டுப்பாட்டுக்குள் கொண்டுவரப்பட்ட நிலையைச் சுட்டுகிறது; முழுமையான வெற்றி என்ற வலுவான முடிவைத் தேவையின்றி புகுத்தாது.
- source_word: לִפְנֵיהֶם
  choice: அவர்களுக்கு முன்பாக
  rationale: எபிரெய மொழிமரபை நெருக்கமாகக் காத்து, நாடு அவர்களுக்கு அடங்கியிருந்தது என்ற சூழல்சார் பொருளையும் தாங்குகிறது.
theological_decisions:
- issue: இஸ்ரவேலுக்கான கூட்டுப்பெயர்
  choice: இஸ்ரவேல் மகன்கள்
  alternative: இஸ்ரவேலர்; இஸ்ரவேலின் பிள்ளைகள்
  rationale: குறிப்பிட்ட கோட்பாட்டு முடிவை உருவாக்காமல், மூலத்தின் ஆண்பால் கூட்டுப்பெயரை முதன்மை உரையில் காக்கிறது; இயல்பான மற்றும் மரபுவழி மாற்றுகள் அடிக்குறிப்பில் தரப்படுகின்றன.
- issue: נִכְבְּשָׁה குறிக்கும் கீழ்ப்படுத்தலின் அளவு
  choice: நாடு ... கீழ்ப்படுத்தப்பட்டிருந்தது
  alternative: நாடு ... வெல்லப்பட்டிருந்தது
  rationale: செயப்பாட்டு வடிவம் கட்டுப்பாட்டுக்குள் வந்த நிலையைக் கூறுகிறது. யோசுவா நூலின் தொடர்ச்சியில் இன்னும் கைப்பற்றப்படாத பகுதிகள் இருப்பதால், மூலத்தைவிட வலுவான முழுமையான வெற்றியை இங்கு புகுத்தாமல் பதற்றத்தைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘சபை,’ ‘சந்திப்புக் கூடாரம்’ ஆகியவை மூலத்தின் சமூக மற்றும் வழிபாட்டு மொழியைத் தெளிவாகக் காக்கின்றன; ‘அவர்களுக்கு முன்பாக’ என்பது எபிரெய மொழிமரபை திட்டமிட்டு நிலைநிறுத்துகிறது.
