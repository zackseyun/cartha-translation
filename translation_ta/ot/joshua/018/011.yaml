base_translation:
  language: en
  yaml_path: translation/ot/joshua/018/011.yaml
  text: And the lot for the tribe of the sons of Benjamin[a], by their clans, came up[b], and the territory of their lot came out between the sons of Judah and the sons of Joseph.
translation:
  language: ta
  text: பென்யமீன் சந்ததியினரின் கோத்திரத்துக்கு, அவர்களுடைய குலங்களின்படி, சீட்டு விழுந்தது. சீட்டினால் அவர்களுக்குக் கிடைத்த நிலப்பகுதி[a] யூதாவின் சந்ததியினருக்கும் யோசேப்பின் சந்ததியினருக்கும்[b] இடையில் அமைந்தது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “சீட்டினால் அவர்களுக்குக் கிடைத்த நிலப்பகுதி” என்பதை “அவர்களுடைய பங்கின் எல்லை” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “யோசேப்பின் சந்ததியினர்” என்பது யோசேப்பிடமிருந்து தோன்றிய கோத்திரங்களை, குறிப்பாக எப்பிராயீம் மற்றும் மனாசே கோத்திரங்களை, கூட்டாகக் குறிக்கிறது.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעַל גּוֹרָל
  choice: சீட்டு விழுந்தது
  rationale: சீட்டுப்போட்டு பங்கு தீர்மானிக்கும் சூழலில், எபிரெய மொழியின் ‘சீட்டு மேலே வந்தது’ என்ற உருவகத்தைச் சொற்சொல்லாகப் பின்பற்றாமல், அதே நிகழ்வை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: מַטֵּה בְנֵי בִנְיָמִן
  choice: பென்யமீனின் சந்ததியினரான கோத்திரம்
  rationale: מַטֵּה இங்கு ‘கோத்திரம்’ என்பதைக் குறிக்கிறது; בְנֵי என்ற உறவுமுறைச் சொல்லை ‘சந்ததியினர்’ என்று வழங்குவது, இது பென்யமீனின் நேரடி மகன்களை மட்டும் குறிக்கவில்லை என்பதைத் தெளிவாக்குகிறது.
- source_word: לְמִשְׁפְּחֹתָם
  choice: குலங்களின்படி
  rationale: கோத்திரத்திற்குள் உள்ள குடும்பக் குழுக்களை மִשְׁפָּחוֹת குறிக்கிறது; ‘குலங்களின்படி’ சமூகப் பிரிவையும் பகிர்வின் ஒழுங்கையும் சுருக்கமாகப் பாதுகாக்கிறது.
- source_word: גְּבוּל גּוֹרָלָם
  choice: சீட்டினால் அவர்களுக்குக் கிடைத்த நிலப்பகுதி
  rationale: גְּבוּל என்பதன் அடிப்படைப் பொருள் ‘எல்லை’ என்றாலும், நிலப் பங்கீட்டுச் சூழலில் அது அந்த எல்லையால் வரையறுக்கப்பட்ட நிலப்பகுதியைக் குறிக்கலாம். தமிழில் ‘நிலப்பகுதி ... இடையில் அமைந்திருந்தது’ என்பது இயல்பாகவும் சூழலுக்கு ஏற்றவாறும் உள்ளது; நேரடியான மாற்று அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: בֵּין ... וּבֵין
  choice: '...க்கும் ...க்கும் இடையில்'
  rationale: பென்யமீனுக்குக் கிடைத்த பகுதி யூதா மற்றும் யோசேப்பின் கோத்திரப் பகுதிகளுக்கு நடுவில் இருந்த இடவுறவை நேரடியாக வெளிப்படுத்துகிறது.
- source_word: בְנֵי יְהוּדָה / בְנֵי יוֹסֵף
  choice: யூதாவின் சந்ததியினர் / யோசேப்பின் சந்ததியினர்
  rationale: எபிரெய உறவுமுறைச் சொல்லைத் தக்கவைத்தபடியே, இவை கோத்திர மக்களைக் கூட்டாகக் குறிக்கின்றன என்பதை நவீன தமிழில் இயல்பாகத் தெரிவிக்கிறது.
