- from: பென்யமீனின் சந்ததியினரான கோத்திரத்திற்குக் குலங்களின்படி சீட்டு விழுந்தது. சீட்டினால் அவர்களுக்குக் கிடைத்த நிலப்பகுதி[a], யூதாவின் சந்ததியினருக்கும் யோசேப்பின் சந்ததியினருக்கும்[b] இடையில் அமைந்திருந்தது.
