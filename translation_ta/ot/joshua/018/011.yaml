translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. ‘சீட்டு விழுந்தது’ என்ற வழக்கமான தமிழ் சொற்றொடர் பங்கீட்டுச் சூழலை இயல்பாகச் சொல்கிறது; ‘சந்ததியினர்’ என்பது ‘மகன்கள்’ என்ற சொற்சொல் மொழிபெயர்ப்பால் ஏற்படக்கூடிய தவறான குறுகிய புரிதலைத் தவிர்க்கிறது.
