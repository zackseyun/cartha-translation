base_translation:
  language: en
  yaml_path: translation/ot/joshua/018/009.yaml
  text: So the men went and passed through the land[a], and they wrote it down by cities in seven portions in a book[b], and they came to Joshua at the camp in Shiloh.
translation:
  language: ta
  text: அந்த ஆண்கள் சென்று தேசத்தைக் கடந்து, அதை நகரங்களின்படி[a] ஏழு பகுதிகளாக ஒரு சுருளில்[b] எழுதினார்கள். பின்னர் அவர்கள் சீலோவிலுள்ள முகாமில் இருந்த யோசுவாவிடம் வந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘நகரங்கள் வாரியாக’; நிலத்தைப் பற்றிய பதிவு நகரம் நகரமாக ஒழுங்குபடுத்தப்பட்டதை இந்தச் சொற்றொடர் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில், ‘ஒரு சுருள்/நூலின்மேல்’ என்று உள்ளது; அதாவது எழுதப்பட்ட ஆவணத்தில்.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֵּלְכוּ
  choice: புறப்பட்டு
  rationale: הלך என்பதன் தொடர்கதை வடிவம் செயல்களின் வரிசையைத் தொடங்குகிறது. தமிழில் ‘புறப்பட்டு’ என்பது அவர்கள் பணிக்காகச் சென்றதை இயல்பாகக் காட்டுகிறது; மூலத்தில் இல்லாத குறிப்பிட்ட திசையைச் சேர்ப்பதில்லை.
- source_word: הָאֲנָשִׁים
  choice: அந்த ஆண்கள்
  rationale: முந்தைய வசனத்தில் நியமிக்கப்பட்ட ஆண் பிரதிநிதிகளையே குறிக்கிறது. ‘அந்த’ என்பது எபிரெய மொழியின் திட்டவட்டச் சுட்டை இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: וַיַּעַבְרוּ בָאָרֶץ
  choice: தேசமெங்கும் பயணம் செய்து
  rationale: עבר + בָאָרֶץ இங்கு நில அளவீட்டிற்காகப் பிரதேசத்தின் வழியாகச் செல்வதைக் குறிக்கிறது. ‘தேசமெங்கும் பயணம் செய்து’ என்பது அந்தச் சுற்றிப்பார்த்தலைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: וַיִּכְתְּבוּהָ
  choice: அதை ... பதிவு செய்தார்கள்
  rationale: பெண்பால் ஒருமை பின்னொட்டு முன் வரும் ‘தேசத்தை’ச் சுட்டுகிறது. ‘பதிவு செய்தார்கள்’ என்பது ஆய்வுத் தகவலை எழுத்தில் குறித்த செயலை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: לֶעָרִים
  choice: நகரங்களின்படி
  rationale: לְ இங்கு பதிவை ஒழுங்குபடுத்திய அடிப்படையைச் சுட்டக்கூடும்; அதாவது நிலம் நகரம் நகரமாக விவரிக்கப்பட்டது. ‘நகரங்களின்படி’ இந்தப் பொருளைச் சுருக்கமாகத் தருகிறது.
- source_word: לְשִׁבְעָה חֲלָקִים
  choice: ஏழு பகுதிகளாக
  rationale: חֲלָקִים என்பது பிரிவுகள் அல்லது பங்குகள் எனப் பொருள்படும். ‘ஏழு பகுதிகளாக’ என்பது நிலப் பங்கீட்டுச் சூழலைத் தக்கவைத்தபடி தேவையற்ற விளக்கத்தைச் சேர்க்காமல் உள்ளது.
- source_word: עַל סֵפֶר
  choice: ஒரு சுருளில்
  rationale: סֵפֶר என்பது எழுதப்பட்ட ஆவணம் அல்லது சுருளைக் குறிக்கலாம். பண்டைய கால எழுத்து ஊடகத்தை இயல்பாகக் காட்ட ‘சுருளில்’ பயன்படுத்தப்பட்டுள்ளது; மாற்றுப் பொதுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: וַיָּבֹאוּ אֶל יְהוֹשֻׁעַ
  choice: யோசுவாவிடம் வந்தார்கள்
  rationale: בוא என்பது நேரடியாக ‘வந்தார்கள்’ எனக் கூறுகிறது. சூழலில் திரும்பிவந்தது உட்குறிப்பாக இருந்தாலும், மூலத்தில் இல்லாத ‘திரும்பி’ என்பதைச் சேர்க்கவில்லை.
- source_word: אֶל הַמַּחֲנֶה שִׁלֹה
  choice: சீலோவிலுள்ள முகாமில்
  rationale: இந்தத் தொடர் யோசுவா இருந்த இடத்தைச் சுட்டுகிறது. ‘சீலோவிலுள்ள முகாமில் யோசுவாவிடம்’ என்பது எபிரெயத் தொடரின் தகவலை இயல்பான தமிழ் இடவமைப்பில் தருகிறது.
