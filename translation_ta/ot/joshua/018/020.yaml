base_translation:
  language: en
  yaml_path: translation/ot/joshua/018/020.yaml
  text: And the Jordan formed its border on the east side[a]. This was the inheritance of the sons of Benjamin, according to its borders all around[b], by their clans.
translation:
  language: ta
  text: யோர்தான் ஆறு அதன் கிழக்குப் பக்கத்தில் அதற்கு எல்லையாக இருந்தது.[a] இது பென்யமீன் மக்களுக்கு அவர்களுடைய குலங்களின்படி கிடைத்த உரிமைப்பங்கு; அதன் எல்லைகள் சுற்றிலும் வரையறுக்கப்பட்டிருந்தன.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அதற்கு எல்லையாக அமைந்தது.” எபிரெய வினைச்சொல் யோர்தான் ஆறு அந்த நிலப்பகுதியின் எல்லையாகச் செயல்பட்டதைக் குறிக்கிறது.
    reason: lexical_alternative
