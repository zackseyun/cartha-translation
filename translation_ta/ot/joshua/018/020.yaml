  choice: யோர்தான் ஆறு
  rationale: ஆற்றின் இயற்பெயரைத் தெளிவாகக் காட்ட, தமிழில் இயல்பாக ‘ஆறு’ சேர்க்கப்பட்டுள்ளது.
- source_word: יִגְבֹּל אֹתוֹ
  choice: அதன் எல்லையாக இருந்தது
  rationale: இந்த நிலவியல் சூழலில் גבל என்பது ஒரு நிலப்பகுதியின் எல்லையாக அமைந்திருப்பதைக் குறிக்கிறது; பொருள் சுட்டுப்பெயர் பென்யமீனின் நிலப்பங்கைச் சுட்டுகிறது.
- source_word: לִפְאַת קֵדְמָה
  choice: அதன் கிழக்குப் பக்கத்தில்
  rationale: פאה என்பதன் பக்கம்/ஓரம் என்ற பொருளையும் קֵדְמָה என்பதன் கிழக்குத் திசையையும் இயல்பான தமிழில் தருகிறது.
- source_word: נַחֲלַת
  choice: உரிமைப்பங்கு
  rationale: யோசுவாவில் נחלה என்பது குலத்திற்குப் பங்கிட்டுக் கொடுக்கப்பட்ட மரபுரிமை நிலத்தைக் குறிக்கிறது; ‘உரிமைப்பங்கு’ நிலப்பங்கீட்டு நுணுக்கத்தைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: בְּנֵי בִנְיָמִן
  choice: பென்யமீனின் வழித்தோன்றல்கள்
  rationale: எபிரெயச் சொற்றொடர் சொற்படி ‘பென்யமீனின் மகன்கள்’; இங்கு அது கோத்திரத்தின் சந்ததியினர் அனைவரையும் குறிக்கும் என்பதால் இயல்பான, உள்ளடக்கமான தமிழாக்கம் தேர்ந்தெடுக்கப்பட்டது.
- source_word: לִגְבוּלֹתֶיהָ סָבִיב
  choice: அதன் எல்லைகள் அதைச் சுற்றிலும் அமைந்திருந்தன
  rationale: பெண்பால் ஒருமை பின்னொட்டு உரிமைப்பங்கைச் சுட்டுகிறது; סָבִיב அதன் முழுச் சுற்றெல்லையையும் குறிக்கிறது.
- source_word: לְמִשְׁפְּחֹתָם
  choice: அவர்களுடைய குலங்களின்படி
  rationale: מִשְׁפָּחוֹת என்பது கோத்திரத்திற்குள் உள்ள குலநிலை குடும்பக் குழுக்களைக் குறிக்கிறது.
