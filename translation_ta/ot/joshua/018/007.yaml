source:
  edition: WLC
  text: כִּ֠י אֵֽין חֵ֤לֶק לַ/לְוִיִּם֙ בְּ/קִרְבְּ/כֶ֔ם כִּֽי כְהֻנַּ֥ת יְהוָ֖ה נַחֲלָת֑/וֹ וְ/גָ֡ד וּ/רְאוּבֵ֡ן וַ/חֲצִי֩ שֵׁ֨בֶט הַֽ/מְנַשֶּׁ֜ה לָקְח֣וּ נַחֲלָתָ֗/ם מֵ/עֵ֤בֶר לַ/יַּרְדֵּן֙ מִזְרָ֔חָ/ה אֲשֶׁר֙ נָתַ֣ן לָ/הֶ֔ם מֹשֶׁ֖ה עֶ֥בֶד יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/018/007.yaml
  text: For there is no portion for the Levites among you[a], because the priesthood of Yahweh is their inheritance. And Gad, Reuben, and the half-tribe of Manasseh have received their inheritance beyond the Jordan eastward, which Moses the servant of Yahweh gave them.
translation:
  language: ta
  text: ஏனெனில், உங்கள் நடுவே லேவியர்களுக்குப் பங்கு இல்லை; யாவேயின் ஆசாரியத்துவமே அவர்களுடைய உரிமைச்சொத்து[a]. காத், ரூபன், மனாசேயின் பாதிக் கோத்திரம் ஆகியோர் யோர்தானுக்கு அப்பால் கிழக்கே தங்களுடைய உரிமைச்சொத்தைப் பெற்றுக்கொண்டனர்; அதை யாவேயின் சேவகரான மோசே அவர்களுக்குக் கொடுத்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் நேர்ச்சொல்லாக, “அவனுடைய உரிமைச்சொத்து.” இங்குள்ள ஒருமை வடிவம் லேவி அல்லது லேவியர்களை ஒரே குழுவாகக் குறிப்பதாகத் தெரிகிறது; ஆகவே முதன்மை உரையில் “அவர்களுடைய உரிமைச்சொத்து” என்று மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֵלֶק
  choice: பங்கு
  rationale: நிலப் பங்கீட்டுச் சூழலில் ஒருவருக்குக் கிடைக்கும் பங்கை இயல்பாகக் குறிக்கிறது; பின்னர் வரும் נַחֲלָה என்பதற்கான ‘உரிமைச்சொத்து’ என்பதிலிருந்தும் வேறுபாட்டைக் காக்கிறது.
- source_word: לַלְוִיִּם
  choice: லேவியர்கள்
  rationale: லேவி கோத்திரத்தாரைக் குழுவாகக் குறிக்கும் வழக்கமான தமிழ் வடிவம்.
- source_word: בְּקִרְבְּכֶם
  choice: உங்கள் நடுவே
  rationale: மூலத்தின் இடைப்பட்ட/குழுவுக்குள் என்ற பொருளைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: כְהֻנַּת יְהוָה
  choice: யாவேயின் ஆசாரியத்துவம்
  rationale: כְהֻנָּה என்பதன் ஆசாரியப் பதவி, பணி, நிறுவனம் ஆகிய பொருள் பரப்பைச் சுருக்காமல் காக்கிறது; யாவேயுடனான உருபுத் தொடர்பையும் தீர்மானித்து விளக்காமல் விடுகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தலைப்பால் மாற்றாமல், எபிரெயத் திருமறையில் இடம்பெறும் இறைப்பெயரைத் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: נַחֲלָתוֹ
  choice: அவர்களுடைய உரிமைச்சொத்து
  rationale: எபிரெய வடிவம் ஆண்பால் ஒருமையாக இருந்தாலும், சூழலில் லேவியர்களை ஒருங்கிணைந்த குழுவாகக் குறிக்கிறது. வாசிக்க இயல்பாகப் பன்மையில் மொழிபெயர்த்து, வடிவ வேறுபாடு அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: לָקְחוּ
  choice: பெற்றுக்கொண்டனர்
  rationale: நேரடியாக ‘எடுத்துக்கொண்டனர்’ எனலாம்; ஆனால் சட்டபூர்வமாக ஒதுக்கப்பட்ட நிலத்தைப் பெற்றதைக் குறிக்கும் இச்சூழலில் ‘பெற்றுக்கொண்டனர்’ தவறான கைப்பற்றல் உணர்வைத் தவிர்க்கிறது.
- source_word: נַחֲלָתָם
  choice: தங்களுடைய உரிமைச்சொத்து
  rationale: கோத்திரங்களுக்கு மரபுரிமையாக வழங்கப்பட்ட நிலப்பகுதியைத் தெளிவாகக் குறிக்கிறது.
- source_word: מֵעֵבֶר לַיַּרְדֵּן מִזְרָחָה
  choice: யோர்தானுக்கு அப்பால் கிழக்கே
  rationale: புவியியல் சொற்றொடரின் இரு கூறுகளையும் சுருக்கமாகவும் இயல்பாகவும் காக்கிறது.
- source_word: עֶבֶד יְהוָה
  choice: யாவேயின் பணியாளர்
  rationale: மோசேயின் மதிப்புக்குரிய உடன்படிக்கைச் சேவையைச் சுட்டுகிறது; இச்சூழலில் ‘அடிமை’ என மொழிபெயர்ப்பதால் உருவாகக்கூடிய தேவையற்ற எதிர்மறை உணர்வைத் தவிர்க்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலத்தில் தனிப்பட்ட இறைப்பெயர் நேரடியாக உள்ளது. அதை ஒரு பட்டப்பெயரால் மாற்றாமல் ஒலிபெயர்ப்பது மூலத்தின் வேறுபாட்டைக் காக்கிறது.
- issue: נַחֲלָתוֹ என்பதிலுள்ள கூட்டு ஒருமை
  choice: அவர்களுடைய உரிமைச்சொத்து
  alternative: அவனுடைய உரிமைச்சொத்து
  rationale: இலக்கண வடிவம் ஒருமை என்ற பதற்றத்தை அடிக்குறிப்பில் பாதுகாத்தபடியே, அதன் குழுக் குறிப்பு பொருளை இயல்பான தமிழில் பன்மையாக வெளிப்படுத்துகிறது.
- issue: כְהֻנַּת יְהוָה என்பதன் உருபுத் தொடர்பு
  choice: யாவேயின் ஆசாரியத்துவம்
  alternative: யாவேக்குச் செய்யும் ஆசாரியப் பணி
  rationale: ‘யாவேக்குச் செய்யும்’ என்று விரிவாக்குவது தொடர்பின் பொருளை முன்கூட்டியே தீர்மானிக்கும். உருபுத் தொடர்பை திறந்தவாறே வைக்கும் வடிவம் மூலத்தின் சுருக்கத்தையும் சாத்தியமான பொருள் பரப்பையும் காக்கிறது.
translation_notes:
  register: நவீன செந்தமிழ் நடையில், பொதுவாசகர்களுக்குப் புரியும் வகையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘ஆசாரியத்துவம்’ மூலச்சொல்லின் நிறுவனம்/பதவி/பணி சார்ந்த பரப்பைக் காக்கிறது; ‘உரிமைச்சொத்து’ நில மரபுரிமைச் சூழலைத் தெளிவாக்குகிறது. இறைப்பெயர் ‘யாவே’ என ஒரேமுறையாக வழங்கப்பட்டுள்ளது.
