base_translation:
  language: en
  yaml_path: translation/ot/joshua/018/005.yaml
  text: And they shall divide it into seven portions. Judah shall remain at its border on the south[a], and the house of Joseph shall remain at their border on the north.
translation:
  language: ta
  text: அவர்கள் அதை ஏழு பங்குகளாகப் பிரிக்க வேண்டும். யூதா தெற்கே தன் எல்லையில் நிலைத்திருக்க வேண்டும்[a]; யோசேப்பின் குடும்பத்தார் வடக்கே தங்கள் எல்லையில் நிலைத்திருக்க வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “நிலைத்திருக்க வேண்டும்” என்று மொழிபெயர்க்கப்பட்டுள்ள எபிரெய வினைச்சொல்லின் நேரடிப் பொருள் “நிற்க” என்பதாகும். இச்சூழலில், ஏற்கெனவே உள்ள நில எல்லைகள் மாறாமல் இருப்பதைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִתְחַלְּקוּ אֹתָהּ
  choice: அவர்கள் அதை ... பிரித்துக்கொள்ள வேண்டும்
  rationale: חלק என்பதன் Hitpael வடிவம், இச்சூழலில் நிலத்தைத் தங்களுக்குள் பிரித்துப் பங்கிடுவதைக் குறிக்கிறது; ‘பிரித்துக்கொள்ள’ என்பது அதன் பரஸ்பர/தன்னிலை நுணுக்கத்தை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: לְשִׁבְעָה חֲלָקִים
  choice: ஏழு பங்குகளாக
  rationale: חֲלָקִים என்பது நிலப் பங்கீட்டில் ஒதுக்கப்படும் பங்குகளைக் குறிக்கிறது; ‘பங்குகள்’ என்பது வெறும் இயந்திரப் பிரிவுகளைக் காட்டும் ‘பகுதிகள்’ என்பதைக் காட்டிலும் இச்சூழலுக்கு ஏற்றது.
- source_word: יְהוּדָה
  choice: யூதா
  rationale: கோத்திரப் பெயரின் தமிழில் நிலைபெற்ற ஒலிபெயர்ப்பு.
- source_word: יַעֲמֹד עַל גְּבוּלוֹ
  choice: தன் எல்லையில் தொடர்ந்து இருக்க வேண்டும்
  rationale: עמד என்பதன் நேரடிப் பொருள் ‘நில்’ என்றாலும், இந்நில எல்லைச் சூழலில் அது ஏற்கெனவே உள்ள இடம் அல்லது எல்லை மாறாமல் தொடர்வதைக் குறிக்கிறது.
- source_word: מִנֶּגֶב
  choice: தெற்கே
  rationale: இங்கு נֶגֶב ஒரு குறிப்பிட்ட நெகேவ் பிரதேசத்தைக் காட்டாமல் திசை சார்ந்த ‘தெற்கு’ என்ற பொருளில், வடக்குடன் இணையான அமைப்பில் வருகிறது.
- source_word: וּבֵית יוֹסֵף
  choice: யோசேப்பின் வம்சத்தார்
  rationale: בֵּית יוֹסֵף என்பது யோசேப்பிலிருந்து வந்த கோத்திரங்களை ஒருங்கிணைத்துக் குறிக்கும் பெயர்; ‘வம்சத்தார்’ அதன் கூட்டுக் குடும்பப் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: יַעַמְדוּ עַל גְּבוּלָם
  choice: தங்கள் எல்லையில் தொடர்ந்து இருக்க வேண்டும்
  rationale: பன்மை வினையும் பன்மை உடைமை விகுதியும் யோசேப்பின் வம்சத்தாரைக் கூட்டாகக் குறிக்கின்றன; முதல் கூறைப் போலவே עמד இங்கு நிலப்பரப்பு மாறாமல் தொடர்வதைக் குறிக்கிறது.
- source_word: מִצָּפוֹן
  choice: வடக்கே
  rationale: திசை சார்ந்த ‘வடக்கு’ என்ற பொருள்; ‘தெற்கே’ என்பதுடன் இணையான இயல்பான தமிழ் அமைப்பை வழங்குகிறது.
