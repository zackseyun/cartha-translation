translation_notes:
  register: நவீனத் தரத் தமிழில், நிலப் பங்கீட்டுச் சூழலைத் தெளிவாக வெளிப்படுத்தும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘பிரித்துக்கொள்ள’ என்பது பரஸ்பரப் பங்கீட்டை இயல்பாகக் காட்டுகிறது; ‘தொடர்ந்து இருக்க வேண்டும்’ என்பது עמד என்பதன் இச்சூழலுக்குரிய வழக்குப் பொருளைத் தருகிறது, அதே நேரத்தில் அதன் நேரடிப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
