translation_notes:
  register: நவீன நிலையான தமிழில், பட்டியல் வடிவுக்கு ஏற்ற சுருக்கமானதும் கண்ணியமானதுமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘கோத்திரம்’, ‘குலம்’ ஆகியவை பங்கீட்டுச் சூழலின் சமூக அமைப்பை வேறுபடுத்திக் காட்டுகின்றன; இடப்பெயர்கள் தமிழில் எளிதாக வாசிக்கக்கூடிய வகையில் எழுத்துப்பெயர்க்கப்பட்டுள்ளன.
