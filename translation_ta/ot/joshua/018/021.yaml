source:
  edition: WLC
  text: וְ/הָי֣וּ הֶֽ/עָרִ֗ים לְ/מַטֵּ֛ה בְּנֵ֥י בִנְיָמִ֖ן לְ/מִשְׁפְּחֽוֹתֵי/הֶ֑ם יְרִיח֥וֹ וּ/בֵית חָגְלָ֖ה וְ/עֵ֥מֶק קְצִֽיץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/018/021.yaml
  text: And the cities belonging to the tribe of the sons of Benjamin[a], according to their clans, were Jericho, Beth-hoglah, and Emek-keziz.
translation:
  language: ta
  text: 'பென்யமீனின் சந்ததியினரின் கோத்திரத்திற்குரிய நகரங்கள், அவர்களுடைய குலங்களின்படி: எரிகோ, பெத்-ஹோக்லா, எமேக்-கெசீஸ்[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கெசீஸ் பள்ளத்தாக்கு.” இப்பெயரை எழுத்துப்பெயர்க்கப்பட்ட தனிப்பெயராக அல்லாமல், பொருள் தரும் இடப்பெயராகப் புரிந்துகொண்டால் இவ்வாறு மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיוּ הֶעָרִים
  choice: 'உரிய பட்டணங்கள்:'
  rationale: எபிரெயச் சொற்றொடர் நகரங்களின் பட்டியலை அறிமுகப்படுத்துகிறது. தமிழில் இயல்பாகவும் சுருக்கமாகவும் பட்டியலைத் தொடங்க பெயர்ச்சொல் வாக்கியமும் முக்காற்புள்ளியும் பயன்படுத்தப்பட்டுள்ளன.
- source_word: לְמַטֵּה בְּנֵי בִנְיָמִן
  choice: பென்யமீன் மக்களின் கோத்திரத்துக்கு
  rationale: בְּנֵי என்ற உறவுமுறைச் சொல் இங்கு பென்யமீனின் வழிவந்த மக்களைக் குறிக்கிறது; நவீன தமிழில் ‘பென்யமீன் மக்கள்’ தெளிவாக உள்ளது. לְ என்ற முன்னொட்டு பங்கீட்டில் உரிமை அல்லது ஒதுக்கீட்டைக் காட்டுவதால் ‘கோத்திரத்துக்கு ... உரிய’ என்று மொழிபெயர்க்கப்பட்டது.
- source_word: לְמִשְׁפְּחֹתֵיהֶם
  choice: அவர்களுடைய குலங்களின்படி
  rationale: מִשְׁפָּחָה இங்கு கோத்திரத்தின் உட்பிரிவான குலத்தைக் குறிக்கிறது; ‘குடும்பங்கள்’ என்பதைவிட ‘குலங்கள்’ நிர்வாக மற்றும் வம்சக் கருத்தைத் துல்லியமாக வழங்குகிறது.
- source_word: יְרִיחוֹ
  choice: எரிகோ
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் பரவலாக அறியப்படும் இடப்பெயர் வடிவம்.
- source_word: בֵית חָגְלָה
  choice: பெத்-ஒக்லா
  rationale: இடப்பெயர் மொழிபெயர்க்கப்படாமல் எபிரெய ஒலிப்புக்கு நெருக்கமாக எழுத்துப்பெயர்க்கப்பட்டுள்ளது.
- source_word: עֵמֶק קְצִיץ
  choice: ஏமேக்-கெசீஸ்
  rationale: עֵמֶק பொதுவாக ‘பள்ளத்தாக்கு’ என்று பொருள்பட்டாலும், இச்சூழலில் முழுச் சொற்றொடரும் இடப்பெயராக இருக்கலாம்; ஆகவே முதன்மை உரையில் எழுத்துப்பெயர்ப்பு பயன்படுத்தப்பட்டு மாற்றுப் புரிதல் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
