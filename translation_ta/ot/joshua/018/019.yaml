base_translation:
  language: en
  yaml_path: translation/ot/joshua/018/019.yaml
  text: Then the border passed to the northern shoulder of Beth-hoglah[a], and the border ended at the northern tongue of the Salt Sea, at the southern end of the Jordan[b]. This is the southern border.
translation:
  language: ta
  text: பின்பு அந்த எல்லை வடக்கே உள்ள பெத்-ஹொக்லாவின் ஓரத்திற்குச் சென்று, உப்புக் கடலின்[a] வடக்குப் நாக்கில்[b], யோர்தானின் தெற்கு முனையில் முடிந்தது. இதுவே தெற்கு எல்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “சவக்கடல்” என்றும் அழைக்கப்படுகிறது; எபிரெய மூலத்தில் “உப்புக் கடல்” என்று உள்ளது.
    reason: alternative_reading
  - marker: b
    text: எபிரெயத்தில் நேரடியாக “நாக்கு” என்று உள்ளது; இது நாக்கு வடிவிலான குடா அல்லது கடல் உட்புகும் பகுதியைக் குறிக்கும் நிலவியல் வழக்கு.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָבַר הַגְּבוּל
  choice: பின்பு அந்த எல்லை ... கடந்து
  rationale: எல்லை விவரிப்புகளில் עָבַר என்பது எல்லைக்கோடு ஓர் இடத்தைக் கடந்து தொடர்ந்து செல்வதைக் குறிக்கிறது; தமிழில் “கடந்து” என்பது இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: כֶּתֶף
  choice: பக்கம்
  rationale: இச்சொல்லின் நேர்ப்பொருள் “தோள்”; நிலவியல் பயன்பாட்டில் ஓர் இடத்தின் பக்கம், சரிவு அல்லது ஓரம் எனப் பொருள்படும். “வடக்குப் பக்கம்” நவீன தமிழில் இயல்பாக உள்ளது.
- source_word: בֵּית חָגְלָה
  choice: பெத்-ஹொக்லா
  rationale: இடப்பெயர் தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: תצאותיו הַגְּבוּל
  choice: எல்லை ... முடிந்தது
  rationale: எல்லைச் சூத்திரங்களில் תּוֹצָאוֹת என்பது எல்லையின் முடிவிடம் அல்லது சென்றடையும் முனையைக் குறிக்கிறது.
- source_word: לְשׁוֹן
  choice: குடாப்பகுதி
  rationale: நேர்ப்பொருள் “நாக்கு”; இங்கு நீர்நிலையின் நாக்கு வடிவக் குடா அல்லது உட்புகும் நீர்ப்பகுதியைக் குறிக்கும் நிலவியல் சொல். தெளிவுக்காக “குடாப்பகுதி” பயன்படுத்தப்பட்டு, எபிரெய உருவகம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: יָם הַמֶּלַח
  choice: உப்புக் கடல்
  rationale: எபிரெயப் பெயரின் பொருளை நேரடியாகப் பேணுகிறது; வழக்கிலுள்ள “சவக்கடல்” என்ற மாற்றுப் பெயர் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: קְצֵה הַיַּרְדֵּן נֶגְבָּה
  choice: யோர்தானின் தெற்கு முனை
  rationale: קָצֶה என்பது “முனை/முடிவு”; נֶגְבָּה இங்கு தெற்குத் திசையைக் குறிக்கிறது.
- source_word: זֶה גְּבוּל נֶגֶב
  choice: இதுவே தெற்கு எல்லை
  rationale: இந்தச் சூழலில் נֶגֶב என்பது நெகேப் பிரதேசத்தின் பெயராக அல்லாமல் தெற்குத் திசையைக் குறிக்கிறது.
