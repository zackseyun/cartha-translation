base_translation:
  language: en
  yaml_path: translation/ot/joshua/018/010.yaml
  text: Then Joshua cast lots for them at Shiloh before Yahweh[a], and there Joshua divided the land to the sons of Israel according to their divisions.
translation:
  language: ta
  text: பின்பு யோசுவா சீலோவில் யாவேயின் முன்னிலையில் அவர்களுக்காகச் சீட்டுப் போட்டார். அங்கே அவர் இஸ்ரவேல் மக்களுக்கு[a] அவர்களுடைய பிரிவுகளின்படி நாட்டைப் பங்கிட்டுக் கொடுத்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “இஸ்ரவேலின் மகன்கள்.” இச்சொற்றொடர் இங்கு இஸ்ரவேல் மக்களை ஒட்டுமொத்தமாகக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁלֵךְ ... גּוֹרָל
  choice: சீட்டுப் போட்டார்
  rationale: நிலப் பங்கீட்டைத் தீர்மானிக்கச் சீட்டிடுவதைக் குறிக்கும் எபிரெய மரபுத்தொடருக்கு இயல்பான நவீனத் தமிழ்.
- source_word: בְּשִׁלֹה
  choice: சீலோவில்
  rationale: பொது நிகழ்வு நடந்த இடத்தைக் குறிக்கும் இயல்பான தமிழ் இடவேற்றுமை வடிவம்.
- source_word: לִפְנֵי יְהוָה
  choice: யாவேயின் முன்னிலையில்
  rationale: யாவேயின் சந்நிதியில் நிகழ்ந்த செயல் என்ற பொருளைத் தெளிவாகவும் மரியாதையுடனும் தருகிறது.
- source_word: וַיְחַלֶּק
  choice: பங்கிட்டுக் கொடுத்தார்
  rationale: நாட்டை வெறுமனே பிரித்ததல்ல, இஸ்ரவேல் மக்களுக்குரிய பங்குகளாக வழங்கிய சூழலை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: הָאָרֶץ
  choice: நாட்டை
  rationale: யோசுவா நூலின் சூழலில் இச்சொல் இஸ்ரவேலருக்குப் பங்கிடப்பட்ட தேசத்தைக் குறிக்கிறது.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்களுக்கு
  rationale: சொல்லுக்குச் சொல் ‘இஸ்ரவேலின் மகன்கள்’ என்றாலும், இங்கு உடன்படிக்கை மக்களை ஒட்டுமொத்தமாகக் குறிக்கும் மரபுத்தொடரை இயல்பான தமிழில் தருகிறது.
- source_word: כְּמַחְלְקֹתָם
  choice: அவர்களுடைய பிரிவுகளின்படி
  rationale: பங்கீட்டுக்குரிய பழங்குடி அல்லது நிர்வாகப் பிரிவுகளைப் பொதுவாகக் குறிக்கும் மூலச்சொல்லின் பரப்பைத் தக்கவைக்கிறது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் நேரடியாக உள்ள உடன்படிக்கைப் பெயரைப் பட்டப்பெயராக மாற்றாமல், தமிழில் உச்சரிப்புக்கு ஏற்ற வடிவில் தருகிறது.
translation_notes:
  register: நவீனத் தரநிலைத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையுடன் மொழிபெயர்க்கப்பட்டது. முதல் வாக்கியத்தின் ‘அவர்களுக்காக’ என்பது முந்தைய சூழலில் உள்ள கோத்திரங்களைக் குறிக்கிறது; மூலத்தின் தொடர்பை விளக்கிச் சேர்க்காமல் அப்படியே தக்கவைக்கிறது.
