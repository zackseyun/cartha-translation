  source_fidelity: 'மூல எபிரெயத்தின் செயல்வரிசையும் பொருளும் துல்லியமாகக் காக்கப்பட்டுள்ளன: யோசுவா சீட்டுப் போட்டார்; அது சீலோவில் யாவேயின் முன்னிலையில் நடந்தது; அங்கே அவர் நாட்டை இஸ்ரவேல் மக்களுக்குப் பிரிவுகளின்படி பங்கிட்டார். “அவர்களுக்காக” என்பது לָהֶם என்பதன் சூழல்சார்ந்த, திறந்த குறிப்பைத் தக்கவைக்கிறது.'
