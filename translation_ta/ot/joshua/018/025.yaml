- source_word: גִּבְעוֹן
  choice: கிபியோன்
  rationale: பென்யமீன் குலத்தின் நகரப் பட்டியலில் வரும் இடப்பெயர்; பொருள் மொழிபெயர்க்கப்படாமல், எபிரெய ஒலிப்புக்கு ஏற்ற வகையில் தமிழில் ஒலிபெயர்க்கப்பட்டது.
- source_word: הָרָמָה
  choice: ராமா
  rationale: இச்சொல்லில் சுட்டிடைச்சொல் இருந்தாலும், நகரப் பட்டியலில் நிலைபெற்ற இடப்பெயராகச் செயல்படுகிறது; எனவே ‘உயரமான இடம்’ என்று பொருள் மொழிபெயர்க்காமல் ‘ராமா’ என்று ஒலிபெயர்க்கப்பட்டது.
- source_word: בְאֵרוֹת
  choice: பெயரோத்
  rationale: ‘கிணறுகள்’ என்பதுடன் தொடர்புடைய சொல் என்றாலும், இங்கு இடப்பெயராக இருப்பதால் அதன் பொருளை மொழிபெயர்க்காமல் எபிரெய உச்சரிப்பை அணுகும் வகையில் ‘பெயரோத்’ என்று ஒலிபெயர்க்கப்பட்டது.
