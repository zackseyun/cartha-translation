lexical_decisions:
- source_word: בֵית הָעֲרָבָה
  choice: பெத்-அரபா
  rationale: இது ஊர்களின் பட்டியலில் வரும் இடப்பெயர். ஆகவே அதன் கூறுகளை மொழிபெயர்க்காமல், எபிரெய ஒலிப்பைத் தமிழில் இயல்பாகப் பெயர்த்தெழுதப்பட்டுள்ளது.
- source_word: צְמָרַיִם
  choice: செமராயிம்
  rationale: இது ஓர் இடப்பெயர். எபிரெய வடிவிலுள்ள -ַיִם முடிவையும் பிரதிபலிக்கும் வகையில் பெயர்த்தெழுதப்பட்டுள்ளது.
- source_word: בֵית אֵל
  choice: பெத்தேல்
  rationale: இது நன்கு அறியப்பட்ட இடப்பெயர் என்பதால், ‘தேவனுடைய வீடு’ என்று பொருள் மொழிபெயர்ப்பு செய்யாமல் வழக்கமான தமிழ் வடிவில் பெயர்த்தெழுதப்பட்டுள்ளது.
- source_word: וּ
  choice: -உம்
  rationale: ஒவ்வொரு இடப்பெயரையும் இணைக்கும் எபிரெய முன்னொட்டு, தமிழ்ப் பட்டியல் நடைக்கு இயல்பான இணைப்பிடைச் சொல்லான ‘-உம்’ மூலம் காட்டப்பட்டுள்ளது.
