revisions:
- from: ஒவ்வொரு கோத்திரத்திலிருந்தும் மூன்று ஆண்களை உங்களுக்காகத் தேர்ந்தெடுங்கள்[a]. நான் அவர்களை அனுப்புவேன். அவர்கள் புறப்பட்டு, தேசமெங்கும் சுற்றிச் சென்று, தங்களுடைய உரிமைப் பங்குகளுக்கு ஏற்ப அதைப் பதிவு செய்துவிட்டு[b], என்னிடம் வரவேண்டும்.
  to: ஒவ்வொரு கோத்திரத்திலிருந்தும் உங்களுக்காக மூன்று ஆண்களை நியமியுங்கள்[a]. நான் அவர்களை அனுப்புவேன். அவர்கள் எழுந்து, தேசத்தில் சுற்றித் திரிந்து, தங்கள் மரபுரிமைப் பங்குகளுக்கு ஏற்ப அதைப் பதிவு செய்து, என்னிடம் வருவார்கள்[b].
  rationale: The revision uses ‘நியமியுங்கள்’ for the imperative’s contextual force, retains the explicitly male representatives and distributive tribal reference, and follows the Hebrew action sequence with simple future forms. It also corrects the explanatory note so that it clarifies the allotment-based record without turning the clause into an explicit command to divide and assign the land.
