base_translation:
  language: en
  yaml_path: translation/ot/joshua/018/004.yaml
  text: Provide for yourselves three men from each tribe[a], and I will send them out; they shall arise and walk through the land and write it down according to their inheritance[b], and they shall come to me.
translation:
  language: ta
  text: ஒவ்வொரு கோத்திரத்திலிருந்தும் உங்களுக்காக மூன்று ஆண்களை நியமியுங்கள்[a]. நான் அவர்களை அனுப்புவேன். அவர்கள் எழுந்து, தேசத்தில் சுற்றித் திரிந்து, தங்கள் மரபுரிமைப் பங்குகளுக்கு ஏற்ப அதைப் பதிவு செய்து, என்னிடம் வருவார்கள்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஒவ்வொரு கோத்திரத்திலிருந்தும் மூன்று ஆண்களை உங்களுக்காக ஏற்பாடு செய்யுங்கள்.”
    reason: lexical_alternative
  - marker: b
    text: அதாவது, மரபுரிமைப் பங்குகளை அடிப்படையாகக் கொண்டு தேசத்தைப் பதிவு செய்ய வேண்டும்.
    reason: cultural_note
lexical_decisions:
- source_word: הָבוּ לָכֶם
  choice: உங்களுக்காகத் தேர்ந்தெடுங்கள்
  rationale: இச்சூழலில் ஆட்களை அளிக்கும்படி அல்லது நியமிக்கும்படி கூறும் பன்மை கட்டளை. தமிழில் ‘தேர்ந்தெடுங்கள்’ என்பது இயல்பாகவும் சூழலுக்குப் பொருத்தமாகவும் உள்ளது; ‘உங்களுக்காக’ என்பது לָכֶם என்பதன் பொருளையும் காக்கிறது.
- source_word: שְׁלֹשָׁה אֲנָשִׁים לַשָּׁבֶט
  choice: ஒவ்வொரு கோத்திரத்திலிருந்தும் மூன்று ஆண்களை
  rationale: ஆண்களைக் குறிக்கும் எபிரெயச் சொல்லையும், ஒருமை வடிவில் இருந்தாலும் பகிர்ந்தளிக்கும் பொருளுடைய ‘ஒவ்வொரு கோத்திரம்’ என்ற கருத்தையும் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: וְאֶשְׁלָחֵם
  choice: நான் அவர்களை அனுப்புவேன்
  rationale: שלח என்பதன் நேரடியான பொருளை இயல்பான தமிழில் தருகிறது; பணியின் நோக்கத்தை கூடுதலாகச் சேர்க்கவில்லை.
- source_word: וְיָקֻמוּ
  choice: அவர்கள் புறப்பட்டு
  rationale: מקום என்பதன் நேரடி பொருள் ‘எழுதல்’ என்றாலும், இங்கு அடுத்த செயலை மேற்கொள்ளத் தொடங்குவதைக் குறிக்கிறது. ‘புறப்பட்டு’ என்பது நவீன தமிழில் இயல்பான சூழற்பொருள்.
- source_word: וְיִתְהַלְּכוּ בָאָרֶץ
  choice: தேசமெங்கும் சுற்றிச் சென்று
  rationale: התהלך என்பது ஓரிடமிருந்து மற்றோரிடமாகச் சுற்றித் திரிந்து நிலத்தைப் பார்வையிடுவதைக் குறிக்கிறது. ‘தேசமெங்கும்’ என்பது அந்தப் பரப்பைக் கடந்து செல்வதை இயல்பாகத் தெரிவிக்கிறது.
- source_word: וְיִכְתְּבוּ אוֹתָהּ
  choice: அதைப் பதிவு செய்துவிட்டு
  rationale: சொற்படி ‘அதை எழுதுதல்.’ ‘அது’ தேசத்தைக் குறிக்கிறது; ‘பதிவு செய்தல்’ என்பது நிலத்தைப் பற்றிய தகவலை எழுத்தில் குறித்துக் கொள்வதைத் தெளிவுபடுத்துகிறது, ஆனால் ‘விவரணம்’ போன்ற சொல்லைச் சேர்த்து பொருளை அதிகமாக நிர்ணயிக்கவில்லை.
- source_word: לְפִי נַחֲלָתָם
  choice: தங்களுடைய உரிமைப் பங்குகளுக்கு ஏற்ப
  rationale: נחלה இங்கு கோத்திரங்களுக்கு ஒதுக்கப்படவிருந்த மரபுரிமை நிலப்பங்குகளைக் குறிக்கிறது. பன்மையான ‘பங்குகள்’ பகிர்ந்தளிக்கும் சூழலைத் தெளிவாக்குகிறது.
- source_word: וְיָבֹאוּ אֵלָי
  choice: என்னிடம் வரவேண்டும்
  rationale: எபிரெயம் நேரடியாக ‘என்னிடம் வருவார்கள்’ எனக் கூறுகிறது. கட்டளைத் தொடரின் தமிழாக்கத்தில் ‘வரவேண்டும்’ அதன் பணிப்புரைத் தன்மையை இயல்பாக வெளிப்படுத்துகிறது; ‘திரும்பி’ என்று மூலத்தில் இல்லாத சொல்லைச் சேர்க்கவில்லை.
