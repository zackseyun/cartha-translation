  source_fidelity: முதன்மை உரை பெரும்பாலும் எபிரெய மூலத்திற்கு உண்மையாக உள்ளது. ஆனால் ‘அங்கிருந்து’ என்பது மூலத்தில் வெளிப்படையாக இல்லாத இணைப்புச் சேர்க்கை. மேலும், רְפָאִים பள்ளத்தாக்குடனான வடக்கு இடவியல் உறவை ‘வடக்கில்’ என நேரடியாகத் தருவது துல்லியமானது.
  naturalness: நடை நவீனத் தமிழில் இயல்பாக உள்ளது. இருப்பினும், ஒரே வாக்கியத்தில் ‘அங்கிருந்து எல்லை’ என மீண்டும் கூறுவதைவிட மூலத்தின் தொடர்ச்சியை ‘பின்னர் அது’ எனக் கையாளலாம்; ‘வடபுறத்தில்’ என்பதற்குப் பதில் ‘வடக்கில்’ நிலவியல் உறவைத் தெளிவாக்குகிறது.
  terminology: இடப்பெயர்களான பென்-இன்னோம், இன்னோம், ரெப்பாயீம், ஏன்-ரோகேல் ஆகிய ஒலிபெயர்ப்புகள் சீராக உள்ளன. הַיְבוּסִי என்பதற்கான ‘எபூசியனின்’ என்பது தமிழில் வழக்கமற்ற தனிநபர் வடிவத்தைப் போலத் தோன்றுகிறது; இன/இடப்பெயர்ச் சுட்டலை இயல்பாகக் காக்க ‘எபூசியரின்’ பயன்படுத்தப்பட்டுள்ளது. மூலத்தில் இல்லாத ‘நகரம்’ சேர்க்கப்படவில்லை.
