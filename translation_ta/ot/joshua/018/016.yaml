- from: பின்பு எல்லை, பென்-இன்னோம் பள்ளத்தாக்கை[a] நோக்கியிருக்கும் மலையின் கடைசிப் பகுதிக்கு இறங்கியது; அந்த மலை ரெப்பாயீம் பள்ளத்தாக்கின் வடபுறத்தில் இருந்தது. அங்கிருந்து எல்லை இன்னோம் பள்ளத்தாக்கின் வழியாக எபூசியனின் தென்புறச் சரிவுக்கு[b] இறங்கி, ஏன்-ரோகேலுக்கு[c] இறங்கியது.
