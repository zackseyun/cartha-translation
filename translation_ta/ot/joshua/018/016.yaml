base_translation:
  language: en
  yaml_path: translation/ot/joshua/018/016.yaml
  text: Then the border went down to the end of the mountain that faces the Valley of Ben-hinnom[a], which is at the northern end of the Valley of Rephaim. Then it went down the Valley of Hinnom to the southern slope of the Jebusite[c][b], and went down to En-rogel.
translation:
  language: ta
  text: பின்பு எல்லை, பென்-இன்னோம் பள்ளத்தாக்கை[a] நோக்கியிருக்கும் மலையின் கடைசிப் பகுதிக்கு இறங்கியது; அது ரெப்பாயீம் பள்ளத்தாக்கின் வடக்கில் இருந்தது. பின்னர் அது இன்னோம் பள்ளத்தாக்கில் இறங்கி, எபூசியரின் தென்புறச் சரிவுக்கு[b] இறங்கி, ஏன்-ரோகேலுக்கு[c] இறங்கியது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், ‘இன்னோமின் மகனுடைய பள்ளத்தாக்கு’; இங்கு இடப்பெயராக ‘பென்-இன்னோம்’ என்று தரப்பட்டுள்ளது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘எபூசியரின் தென்புறத் தோள்பகுதிக்கு’ அல்லது ‘தென்புறப் பக்கத்திற்கு.’ ‘தோள்’ என்ற சொல் இங்கு நிலவியல் சார்ந்து சரிவு அல்லது பக்கத்தைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: ‘ஏன்-ரோகேல்’ என்பது ஓர் இடப்பெயர்; அதன் சொற்பொருள் ‘ரோகேலின் நீரூற்று.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָרַד הַגְּבוּל
  choice: பின்பு எல்லை ... இறங்கியது
  rationale: יָרַד என்பதன் நிலஅமைப்புச் சார்ந்த ‘இறங்குதல்’ என்ற பொருளையும், גְּבוּל என்பதன் எல்லைக்கோடு என்ற பொருளையும் இயல்பான தமிழில் காக்கிறது.
- source_word: קְצֵה הָהָר
  choice: மலையின் கடைசிப் பகுதி
  rationale: קָצֶה என்பது ஓரம் அல்லது கடைசி முனையைக் குறிக்கிறது; הָר என்பதற்கு ‘மலை’ நேரடியான இணை.
- source_word: אֲשֶׁר עַל־פְּנֵי גֵּי בֶן־הִנֹּם
  choice: பென்-இன்னோம் பள்ளத்தாக்கை நோக்கியிருக்கும்
  rationale: עַל־פְּנֵי இங்கு எதிரே அமைந்திருத்தல் அல்லது நோக்கியிருத்தல் என்ற இடவியல் உறவைக் குறிக்கிறது.
- source_word: גֵּי בֶן־הִנֹּם
  choice: பென்-இன்னோம் பள்ளத்தாக்கு
  rationale: இது இடப்பெயராகச் செயல்படுவதால் பெயரின் கூறு ஒலிபெயர்க்கப்பட்டது; சொற்பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: אֲשֶׁר בְּעֵמֶק רְפָאִים צָפוֹנָה
  choice: அந்த மலை ரெப்பாயீம் பள்ளத்தாக்கின் வடபுறத்தில் இருந்தது
  rationale: צָפוֹנָה என்பதன் வடக்கு நோக்கிய இடவியல் கருத்தைக் காக்கிறது. தொடர்புச் சொல்லின் முன்னிலை ‘மலை’ எனப் புரிந்துகொள்ளப்பட்டாலும், மூலத்தின் சுருக்கமான அமைப்பை அளவுக்கு மீறி விரிவாக்கவில்லை.
- source_word: גֵּי הִנֹּם
  choice: இன்னோம் பள்ளத்தாக்கு
  rationale: பெயரிடப்பட்ட பள்ளத்தாக்காக இருப்பதால் ‘இன்னோம்’ ஒலிபெயர்க்கப்பட்டது.
- source_word: אֶל־כֶּתֶף הַיְבוּסִי נֶגְבָּה
  choice: எபூசியனின் தென்புறச் சரிவுக்கு
  rationale: כֶּתֶף என்பதன் சொற்பொருள் ‘தோள்’; நிலவியல் சூழலில் அது மலைச்சரிவு அல்லது பக்கத்தைக் குறிக்கிறது. மூலத்தில் இல்லாத ‘நகரம்’ என்பதைச் சேர்க்காமல் הַיְבוּסִי என்ற ஒருமை வடிவம் காக்கப்பட்டது.
- source_word: עֵין רֹגֵל
  choice: ஏன்-ரோகேல்
  rationale: இடப்பெயர் ஒலிபெயர்க்கப்பட்டது; עֵין என்பதன் ‘நீரூற்று’ என்ற சொற்பொருள் அடிக்குறிப்பில் குறிப்பிடப்படுகிறது.
