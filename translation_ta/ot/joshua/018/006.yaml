  yaml_path: translation/ot/joshua/018/006.yaml
  text: And you shall write down the land in seven portions and bring it here to me, and I will cast the lot for you here before the LORD our God.
translation:
  language: ta
  text: நீங்கள் அந்த நாட்டை ஏழு பங்குகளாகப் பிரித்து விவரித்து எழுதுங்கள்; அந்த விவரத்தை இங்கே என்னிடம் கொண்டுவாருங்கள். நம் கடவுளாகிய ஆண்டவர் முன்னிலையில் நான் இங்கே உங்களுக்காகச் சீட்டு இடுவேன்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תִּכְתְּבוּ אֶת־הָאָרֶץ
  choice: அந்த நாட்டை ... விவரித்து எழுதி
  rationale: எபிரெயச் சொற்றொடர் சொற்படியாக ‘நாட்டை எழுதுங்கள்’ என்கிறது; சூழலில் நிலத்தைப் பங்குகளாகப் பதிவு செய்து விவரிப்பதே பொருள். இயல்பான தமிழில் அதைக் கூற ‘விவரித்து எழுதி’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: שִׁבְעָה חֲלָקִים
  choice: ஏழு பங்குகளாக
  rationale: חֲלָקִים என்பது பிரிக்கப்பட்ட நிலப்பகுதிகள் அல்லது பங்குகளைக் குறிக்கிறது; ‘பங்குகள்’ சுருக்கமாகவும் சூழலுக்கு ஏற்றதாகவும் உள்ளது.
- source_word: וְיָרִיתִי ... גּוֹרָל
  choice: சீட்டுப் போடுவேன்
  rationale: גּוֹרָל ஒருமையில் ‘சீட்டு/திருவுளச்சீட்டு’; וְיָרִיתִי என்பது இங்கு சீட்டை எறிதல் அல்லது போடுதலைக் குறிக்கிறது. வழக்கமான தமிழில் ‘சீட்டுப் போடுவேன்’ இயல்பாக உள்ளது.
- source_word: יְהוָה אֱלֹהֵינוּ
  choice: நம் கடவுளாகிய ஆண்டவர்
  rationale: தெய்வீகப் பெயரான יהוה-ஐ தமிழ் வேதாகம நடையில் ‘ஆண்டவர்’ என்றும், אֱלֹהֵינוּ-ஐ ‘நம் கடவுள்’ என்றும் வழங்கி, உறவுத்தொடரை இயல்பாக அமைக்கிறது.
theological_decisions:
- issue: சீட்டுப் போடுதல் யாருடைய முன்னிலையில் நடக்கிறது
  choice: நம் கடவுளாகிய ஆண்டவர் முன்னிலையில்
  alternative: நம் கடவுளாகிய யெகோவாவின் முன்னிலையில்
  rationale: மூலத்தில் יהוה என்ற தனிப்பெயர் உள்ளது. வெளியீட்டு நடை மற்றும் பொதுவாசிப்புத் தெளிவுக்காக ‘ஆண்டவர்’ பயன்படுத்தப்பட்டது; பெயரின் தெய்வீகச் சுட்டலை மறைக்கும் கூடுதல் விளக்கம் சேர்க்கப்படவில்லை.
- issue: גּוֹרָל என்பதன் எண்ணிக்கை
  choice: சீட்டுப் போடுவேன்
  alternative: சீட்டுகள் போடுவேன்
  rationale: மூல எபிரெயத்தில் பெயர்ச்சொல் ஒருமையில் உள்ளது. நிலப்பகுதிகளை ஒதுக்கும் முழுச் செயல்முறையைக் குறிக்கும் ஒருமை உணர்வு தமிழிலும் காக்கப்பட்டது.
translation_notes:
  register: நவீனத் தரமான, மரியாதைமிக்க, பொதுவாசகர்களுக்குப் புரியும் தமிழ். கட்டளையின் வலிமையை ‘வேண்டும்’ காக்கிறது; எபிரெய மொழியின் இயல்பற்ற ‘நாட்டை எழுதுங்கள்’ என்ற சொற்றொடர் பொருளை வெளிப்படுத்தும் வகையில் மட்டும் விரிக்கப்பட்டது.
