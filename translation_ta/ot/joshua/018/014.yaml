source:
  edition: WLC
  text: וְ/תָאַ֣ר הַ/גְּבוּל֩ וְ/נָסַ֨ב לִ/פְאַת יָ֜ם נֶ֗גְבָּ/ה מִן הָ/הָר֙ אֲשֶׁ֨ר עַל פְּנֵ֥י בֵית חֹרוֹן֮ נֶגְבָּ/ה֒ ו/היה תֹֽצְאֹתָ֗י/ו אֶל קִרְיַת בַּ֨עַל֙ הִ֚יא קִרְיַ֣ת יְעָרִ֔ים עִ֖יר בְּנֵ֣י יְהוּדָ֑ה זֹ֖את פְּאַת יָֽם־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/018/014.yaml
  text: Then the border curved and turned on the west side southward from the mountain that faces Beth-horon on the south[a], and its end was at Kiriath-baal (that is, Kiriath-jearim), a city of the sons of Judah. This was the western side.
translation:
  language: ta
  text: பின்பு, எல்லை பெத்-ஓரோனுக்கு எதிரே தெற்குப்புறமாக இருக்கும் மலையிலிருந்து தொடர்ந்து சென்று, மேற்குப் பக்கத்துக்கு வளைந்தது. அது யூதாவின் மக்களின்[a] நகரமான கிரியாத்-பாகாலில்—அதாவது கிரியாத்-யெயாரீமில்—முடிவடைந்தது. இதுவே மேற்குப் பக்கம்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘யூதாவின் மக்கள்’ என்பது யூதா கோத்திரத்தைச் சேர்ந்த மக்கள் அல்லது யூதாவின் சந்ததியரைக் குறிக்கும் பழங்குடி அடையாளப்பெயர்.
    reason: The Hebrew ‘sons of Judah’ is a tribal designation; the note preserves that lexical and historical sense.
lexical_decisions:
- source_word: וְתָאַר הַגְּבוּל וְנָסַב
  choice: எல்லை வளைந்து ... திரும்பியது
  rationale: எல்லையின் பாதை வரையப்பட்டு திசைமாறுவதைச் சொல்லும் இரு வினைகளையும், இயல்பான தமிழில் புவியியல் இயக்கமாக வெளிப்படுத்துகிறது.
- source_word: לִפְאַת יָם נֶגְבָּה
  choice: மேற்குப் பக்கமாகத் தெற்கு நோக்கி
  rationale: יָם என்பது இத்தகைய எல்லை விவரிப்பில் ‘மேற்கு’ என்றும், נֶגְבָּה திசையைக் குறிக்கும் ‘தெற்கு நோக்கி’ என்றும் பொருள்படுகின்றன.
- source_word: מִן הָהָר
  choice: மலையிலிருந்து
  rationale: குறிப்பிட்ட ஓர் உயர்நிலையைக் குறிக்கும் ஒருமைச் சொல்லை நேரடியாக மொழிபெயர்க்கிறது.
- source_word: אֲשֶׁר עַל פְּנֵי בֵית חֹרוֹן נֶגְבָּה
  choice: பெத்-ஓரோனுக்குத் தெற்கே எதிரில் இருந்த
  rationale: עַל־פְּנֵי என்பதன் இடவியல் பொருளான ‘எதிரில்’ என்பதையும், தெற்குத் திசை உறவையும் தெளிவாகப் பாதுகாக்கிறது.
- source_word: וְהָיָה תֹצְאֹתָיו אֶל
  choice: அது ... முடிவடைந்தது
  rationale: எல்லையின் இறுதி முனையைக் குறிக்கும் எபிரெயச் சொற்றொடரை இயல்பான தமிழில் தருகிறது.
- source_word: קִרְיַת בַּעַל ... קִרְיַת יְעָרִים
  choice: கிரியாத்-பாகால் ... கிரியாத்-யெயாரீம்
  rationale: இரு மாற்றுப் பெயர்களையும் ஒலிபெயர்த்து, הִיא காட்டும் அடையாளப்படுத்தலை ‘அதாவது’ என வெளிப்படுத்துகிறது.
- source_word: עִיר בְּנֵי יְהוּדָה
  choice: யூதாவின் மக்களுக்குரிய நகரம்
  rationale: בְּנֵי என்பதன் இனக்குழு/வம்சக் குறிப்பு இங்கு ஆண்களை மட்டும் குறிக்காததால், தமிழில் இயல்பாக ‘மக்கள்’ என வழங்கப்படுகிறது.
- source_word: זֹאת פְּאַת יָם
  choice: இதுவே மேற்குப் பக்கம்
  rationale: எல்லையின் மேற்குப் பகுதியைச் சுருக்கமாக அடையாளப்படுத்தும் மூலத்தின் நிறைவுச் சூத்திரத்தைப் பாதுகாக்கிறது.
