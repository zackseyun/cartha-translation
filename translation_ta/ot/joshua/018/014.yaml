translation_notes:
  register: நவீன நிலையான தமிழில், புவியியல் எல்லை விவரிப்புக்கேற்ற தெளிவான மற்றும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘யூதாவின் மக்கள்’ என்பது பழங்குடி/வம்ச அடையாளத்தைக் குறிக்கிறது; தேவையற்ற பாலினக் கட்டுப்பாட்டைத் தவிர்க்கிறது. மூலத்தில் விளக்கக் குறிப்பைத் தேவைப்படுத்தும் தீர்க்கப்படாத இறையியல் சிக்கல் இல்லை.
