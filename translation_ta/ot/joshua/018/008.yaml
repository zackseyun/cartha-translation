base_translation:
  language: en
  yaml_path: translation/ot/joshua/018/008.yaml
  text: So the men arose and went[a], and Joshua commanded those who were going to write down the land, saying, “Go and walk through the land, and write it down, and return to me; and here I will cast lots for you before Yahweh in Shiloh.”
translation:
  language: ta
  text: 'அந்த ஆண்கள் எழுந்து சென்றனர்; நாட்டை எழுத்தில் பதிவுசெய்யச் சென்றவர்களுக்கு யோசுவா கட்டளையிட்டார்: “நீங்கள் போய், நாடெங்கும் சுற்றி நடந்து, அதை எழுத்தில் பதிவுசெய்துவிட்டு என்னிடம் திரும்பி வாருங்கள். இங்கே சீலோவில், யாவே முன்னிலையில் உங்களுக்காக நான் சீட்டுப் போடுவேன்.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּקֻמוּ הָאֲנָשִׁים וַיֵּלֵכוּ
  choice: அந்த ஆண்கள் எழுந்து சென்றார்கள்
  rationale: קום மற்றும் הלך ஆகிய தொடர்ச்சியான செயல்களை இயல்பான தமிழ் நடையில் வேறுபடுத்திக் காட்டுகிறது; הָאֲנָשִׁים என்பதன் ஆண்பால் குறிப்பையும் காக்கிறது.
- source_word: וַיְצַו יְהוֹשֻׁעַ
  choice: யோசுவா கட்டளையிட்டுக் கூறியது
  rationale: צוה அதிகாரத்துடன் வழங்கப்படும் கட்டளையைக் குறிக்கிறது; தொடரும் நேரடிக் கூற்றைத் தமிழில் இயல்பாக அறிமுகப்படுத்துகிறது.
- source_word: לִכְתֹּב אֶת הָאָרֶץ
  choice: நாட்டை எழுத்தில் பதிவுசெய்ய
  rationale: כתב என்பதன் ‘எழுது’ என்ற அடிப்படைப் பொருளையும், பங்கீட்டுக்காக நாட்டைப் பற்றிய எழுத்துப்பூர்வ விவரத்தை உருவாக்கும் சூழல்சார் பொருளையும் இணைக்கிறது.
- source_word: וְהִתְהַלְּכוּ בָאָרֶץ
  choice: நாடெங்கும் சுற்றி நடந்து
  rationale: הלך என்பதன் ஹித்பயேல் வடிவம் நாட்டினுள் பல இடங்களிலும் சென்று ஆராய்வதைச் சுட்டுவதால், ‘சுற்றி நடந்து’ என்பது அந்த இயக்கத்தைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: וְשׁוּבוּ אֵלַי
  choice: என்னிடம் திரும்பி வாருங்கள்
  rationale: שוב என்பதன் திரும்புதல் என்ற பொருளை இயல்பான மரியாதைப் பன்மை கட்டளை நடையில் வழங்குகிறது.
- source_word: אַשְׁלִיךְ לָכֶם גּוֹרָל
  choice: உங்களுக்காக நான் சீட்டுப் போடுவேன்
  rationale: גורל போட்டுப் பங்கீடு செய்யும் பழக்கத்தைத் தமிழில் புரியக்கூடிய வழக்குச் சொற்றொடராகத் தருகிறது; எபிரெயில் பெயர்ச்சொல் ஒருமையில் இருந்தாலும் செய்முறையைத் தமிழ் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: בְּשִׁלֹה
  choice: சீலோவில்
  rationale: இடப்பெயரை நவீனத் தமிழில் தெளிவான ஒலிபெயர்ப்பாக வழங்குகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலத்தில் நேரடியாக வரும் நான்கெழுத்து இறைப்பெயரைப் பொதுப்பட்டமாக மாற்றாமல், பரவலாக ஏற்கப்பட்ட ஒலிப்புக்கு நெருக்கமான தமிழ் வடிவில் காக்கிறது.
- issue: הָאֲנָשִׁים என்பதிலுள்ள பாலினக் குறிப்பு
  choice: அந்த ஆண்கள்
  alternative: அந்த மனிதர்கள்; அவர்கள்
  rationale: இச்சூழலில் நிலத்தை ஆய்வுசெய்ய அனுப்பப்பட்ட குறிப்பிட்ட ஆண் பிரதிநிதிகளை எபிரெய ஆண்பால் பன்மை சுட்டுவதால், அதை மறைக்காமல் மொழிபெயர்க்கிறது.
- issue: ‘சீட்டுப் போடுதல்’ மற்றும் இறை முன்னிலை
  choice: யாவே முன்னிலையில் உங்களுக்காக நான் சீட்டுப் போடுவேன்
  alternative: யாவே முன்னிலையில் உங்கள் பங்குகளைத் தீர்மானிப்பேன்
  rationale: முடிவை மட்டும் விளக்காமல், மூலத்தில் உள்ள சீட்டுப் போடும் செயலைக் காத்து, அது யாவே முன்னிலையில் நடைபெறுவதாக உள்ள இறையியல் அழுத்தத்தையும் நிலைநிறுத்துகிறது.
translation_notes:
  register: நவீனச் செந்தமிழுக்கு நெருக்கமான, பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. நேரடிக் கட்டளையில் மரியாதைப் பன்மை வினைமுற்றுகள் இடம்பெறுகின்றன; தேவையற்ற தொழில்நுட்ப நிலஅளவைச் சொற்கள் தவிர்க்கப்பட்டுள்ளன.
