base_translation:
  language: en
  yaml_path: translation/ot/joshua/018/013.yaml
  text: From there the border passed to Luz[a], to the southern slope of Luz (that is, Bethel), and the border went down to Atroth-addar[c][b], on the mountain that is south of Lower Beth-horon.
translation:
  language: ta
  text: அங்கிருந்து எல்லை லூசுக்கு, அதாவது பெத்தேலான லூசின் தெற்குச் சரிவுக்கு, சென்றது. பின்னர் அந்த எல்லை கீழ்ப் பெத்-ஹோரோனுக்குத் தெற்கே உள்ள மலையின்மேல் அமைந்த அத்தரோத்-அத்தாருக்கு இறங்கியது.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעָבַר ... הַגְּבוּל
  choice: எல்லை ... சென்றது
  rationale: எல்லை விவரிப்பில் அதன் பாதையைச் சுட்டும் இயல்பான நவீனத் தமிழ்; மனிதர் கடந்து செல்வதைப் போன்ற தவறான எண்ணத்தைத் தவிர்க்கிறது.
- source_word: ל֗וּזָה
  choice: லூசுக்கு
  rationale: இடப்பெயரை எபிரெய ஒலிப்புக்கு நெருக்கமாக எழுத்துப்பெயர்த்து, திசைநோக்கிய ה முடிவைத் தமிழ் நான்காம் வேற்றுமை உருபால் காட்டுகிறது.
- source_word: אֶל כֶּתֶף לוּזָה נֶגְבָּה
  choice: பெத்தேலின் தெற்குச் சரிவுக்கு
  rationale: כֶּתֶף என்பதன் அடிப்படைப் பொருள் ‘தோள்’; நிலவியல் சூழலில் மலையின் பக்கம் அல்லது சரிவைக் குறிக்கிறது. ‘தெற்குச் சரிவு’ நவீனத் தமிழில் தெளிவாக உள்ளது.
- source_word: הִיא בֵּית אֵל
  choice: அதாவது பெத்தேல்
  rationale: லூசும் பெத்தேலும் இங்கு அடையாளப்படுத்தப்படுவதை விளக்க உரையாக இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וְיָרַד הַגְּבוּל
  choice: அந்த எல்லை ... இறங்கியது
  rationale: நிலப்பரப்பில் எல்லைக்கோடு கீழ்நோக்கிச் செல்வதை மூலத்தின் இடவியல் படிமத்தோடு காக்கிறது.
- source_word: עַטְרוֹת אַדָּר
  choice: அதரோத்-அதார்
  rationale: கூட்டு இடப்பெயரை எபிரெய மெய்யெழுத்துகளுக்கு நெருக்கமான தமிழாக்க ஒலிபெயர்ப்பில் வழங்குகிறது.
- source_word: עַל הָהָר
  choice: மலையின்மேல் அமைந்த
  rationale: குறிப்பிட்ட மலையைக் குறிக்கும் ஒருமைச் சொல்லையும், அதன்மேல் அந்த இடம் அல்லது எல்லைப்புள்ளி இருப்பதையும் இயல்பான தமிழில் தருகிறது.
- source_word: מִנֶּגֶב לְבֵית חֹרוֹן תַּחְתּוֹן
  choice: கீழ்ப் பெத்-ஓரோனுக்குத் தெற்கே உள்ள
  rationale: מִנֶּגֶב என்பதன் தெற்கிலுள்ள இடத்தொடர்பையும் תַּחְתּוֹן என்பதன் ‘கீழ்’ வேறுபாட்டையும் பாதுகாக்கிறது.
