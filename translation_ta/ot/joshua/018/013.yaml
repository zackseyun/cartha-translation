revisions:
- from: அங்கிருந்து எல்லை லூசுக்கு[a]—அதாவது பெத்தேலின் தெற்குச் சரிவுக்கு[b]—சென்றது. பின்பு அந்த எல்லை, கீழ்ப் பெத்-ஓரோனுக்குத் தெற்கே உள்ள மலையின்மேல் அமைந்த அதரோத்-அதாருக்கு[c] இறங்கியது.
  to: அங்கிருந்து எல்லை லூசுக்கு, அதாவது பெத்தேலான லூசின் தெற்குச் சரிவுக்கு, சென்றது. பின்னர் அந்த எல்லை கீழ்ப் பெத்-ஹோரோனுக்குத் தெற்கே உள்ள மலையின்மேல் அமைந்த அத்தரோத்-அத்தாருக்கு இறங்கியது.
  rationale: 'The revision preserves the Hebrew sequence: toward Luz, then to Luz’s southern slope, with Luz identified as Bethel. It also regularizes the transliteration of Atroth-addar and Beth-horon while retaining the source’s topographical relation: the mountain lies south of Lower Beth-horon.'
