  register: நவீன நிலையான தமிழில், எல்லை விவரிப்புக்கேற்ற சுருக்கமான மற்றும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. பழங்கால இடப்பெயர்கள் தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளன; மூலத்தின் நிலவியல் இயக்கமும் லூஸ்–பெத்தேல் அடையாளமும் வெளிப்படையாகக் காக்கப்பட்டுள்ளன.
