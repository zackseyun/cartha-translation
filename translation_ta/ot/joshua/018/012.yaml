  yaml_path: translation/ot/joshua/018/012.yaml
  text: Their border on the north side was from the Jordan[a], and the border went up to the northern slope of Jericho, then went up into the hill country westward[b], and its end was at the wilderness of Beth-aven.
translation:
  language: ta
  text: அவர்களுடைய வடக்கு எல்லை யோர்தானிலிருந்து தொடங்கியது. அந்த எல்லை எரிகோவின் வடக்குச் சரிவுக்கு[a] ஏறி, அங்கிருந்து மேற்கு நோக்கி மலைநாட்டுக்குள் ஏறிச் சென்றது. அதன் முடிவு[b] பெத்-ஆவேன் வனாந்தரத்தில் இருந்தது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் நேரடியாக ‘எரிகோவின் தோள்’; நிலவியல் வழக்கில் இது அதன் பக்கம் அல்லது சரிவைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: ‘அதன் கடைசிப் பகுதிகள்’ அல்லது ‘அதன் வெளியேறும் இடங்கள்’ என்றும் மொழிபெயர்க்கலாம்; எபிரெயம் எல்லையின் முடிவிடத்தைக் குறிக்கும் பன்மை நிலவியல் சொல்லைப் பயன்படுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִפְאַת צָפוֹנָה
  choice: வடக்கு எல்லை
  rationale: פאה என்பது பக்கம் அல்லது ஓரம் என்பதைக் குறிக்கிறது; எல்லை விவரிப்பில் இயல்பான தமிழில் ‘வடக்கு எல்லை’ திசையையும் எல்லைக் கோட்டையும் தெளிவாகக் காட்டுகிறது.
- source_word: מִן הַיַּרְדֵּן
  choice: யோர்தானிலிருந்து தொடங்கியது
  rationale: מן என்பது தொடக்க இடத்தைக் காட்டுகிறது. தமிழில் வாக்கியம் முழுமையாகவும் இயல்பாகவும் அமைய ‘தொடங்கியது’ வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: וְעָלָה
  choice: ஏறி / ஏறிச் சென்றது
  rationale: עלה எல்லைக் கோடு உயரமான நிலப்பகுதியை நோக்கிச் செல்வதைக் குறிக்கிறது; ‘ஏறிச் சென்றது’ அதன் நிலவியல் இயக்கத்தைப் பாதுகாக்கிறது.
- source_word: אֶל כֶּתֶף יְרִיחוֹ מִצָּפוֹן
  choice: எரிகோவின் வடக்குப் பக்கச் சரிவுக்கு
  rationale: כֶּתֶף என்பதன் அடிப்படைப் பொருள் ‘தோள்’; நிலவியல் பயன்பாட்டில் அது பக்கம் அல்லது சரிவைக் குறிக்கிறது. ‘பக்கச் சரிவு’ இரு நுணுக்கங்களையும் இயல்பாகத் தருகிறது.
- source_word: בָהָר יָמָּה
  choice: மேற்கு நோக்கி மலைநாட்டுக்குள்
  rationale: הָר இங்கு ஒரு தனி மலையைவிட மலைப்பாங்கான நிலப்பகுதியைக் குறிக்க வாய்ப்புள்ளது; יָמָּה என்பது ‘மேற்கு நோக்கி’ என்ற திசை வினையடை.
- source_word: תֹּצְאֹתָיו
  choice: அதன் முடிவு
  rationale: இது பன்மை வடிவிலுள்ள நிலவியல் சொல் என்றாலும், எல்லை வருணனையில் அதன் இறுதி இடம் அல்லது முடிவைக் குறிக்கிறது; ஒருமைத் தமிழ் இயல்பானது.
- source_word: מִדְבָּרָה בֵּית אָוֶן
  choice: பெத்-ஆவேன் வனாந்தரத்தில்
  rationale: திசைச் சுட்டும் வடிவம் எல்லை முடியும் இடத்தைச் சுட்டுகிறது. பெத்-ஆவேன் இடப்பெயராக ஒலிபெயர்க்கப்பட்டுள்ளது.
