translation_notes:
  register: நவீனத் தரத் தமிழில், வேதாகம நிலவியல் விவரிப்புக்கு ஏற்ற கண்ணியமான ஆனால் எளிதில் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. ‘யோர்தான்’, ‘எரிகோ’, ‘பெத்-ஆவேன்’ ஆகியவை வழக்கமான தமிழ் வேதாகம இடப்பெயர் வடிவங்களில் தரப்பட்டுள்ளன. மூலத்தின் தொடர்ச்சியான எல்லை இயக்கம் குறுகிய வாக்கியங்களாகப் பிரிக்கப்பட்டாலும் பாதுகாக்கப்பட்டுள்ளது.
