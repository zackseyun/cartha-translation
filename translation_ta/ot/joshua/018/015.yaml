  text: וּ/פְאַת נֶ֕גְבָּ/ה מִ/קְצֵ֖ה קִרְיַ֣ת יְעָרִ֑ים וְ/יָצָ֤א הַ/גְּבוּל֙ יָ֔מָּ/ה וְ/יָצָ֕א אֶל מַעְיַ֖ן מֵ֥י נֶפְתּֽוֹחַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/018/015.yaml
  text: And the southern side was from the edge of Kiriath-jearim[b][a], and the border went out westward and went out to the spring of the waters of Nephtoah.
translation:
  language: ta
  text: தெற்குப் பக்கம் கீரியாத்-யெயாரீமின் ஓரத்திலிருந்து இருந்தது; எல்லை மேற்கே[a] சென்று, நெப்தோவாவின் நீரூற்றை[b] நோக்கிச் சென்றது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொல்லளவில் ‘கடலை நோக்கி’; இப்புவியியல் சூழலில் அது ‘மேற்கே’ என்று பொருள்படும்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில் சொல்லளவில் ‘நெப்தோவாவின் நீர்களின் ஊற்று.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפְאַת נֶגְבָּה
  choice: தெற்குப் பக்கம்
  rationale: פֵאָה என்பது பக்கம் அல்லது ஓரம் என்பதைக் குறிக்கிறது; திசையைக் குறிக்கும் נֶגְבָּה உடன் சேர்ந்து இங்கு நிலப்பகுதியின் தெற்குப் பக்கத்தைக் குறிக்கிறது.
- source_word: מִקְצֵה
  choice: ஓரத்திலிருந்து
  rationale: קָצֶה என்பதன் இடவியல் பொருள் முடிவு, விளிம்பு, ஓரம் என்பதாகும். எல்லை விவரிப்பில் ‘ஓரம்’ இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: קִרְיַת יְעָרִים
  choice: கீரியாத்-யெயாரீம்
  rationale: இடப்பெயர் மொழிபெயர்க்கப்படாமல் எபிரெய ஒலிப்பை அணுகும் வகையில் எழுத்துப்பெயர்க்கப்பட்டது.
- source_word: וְיָצָא הַגְּבוּל
  choice: எல்லை ... சென்று
  rationale: יָצָא என்பதன் அடிப்படைப் பொருள் ‘புறப்பட்டுச் செல்’; எல்லை வருணனையில் எல்லைக்கோடு ஒரு திசையில் தொடர்வதை இது குறிக்கிறது. தமிழில் ‘சென்று’ அந்த இயக்க உருவகத்தை இயல்பாகத் தக்கவைக்கிறது.
- source_word: יָמָּה
  choice: மேற்கே
  rationale: சொல்லளவில் இது ‘கடலை நோக்கி’ எனினும், இஸ்ரவேல் நாட்டின் புவியியல் சூழலில் மேற்குத் திசையைக் குறிக்கிறது.
- source_word: אֶל
  choice: நோக்கி
  rationale: எல்லைக்கோட்டின் திசையைச் சுட்டும் אֶל என்பதிலுள்ள திசைநோக்கிய நுணுக்கத்தை ‘நோக்கி’ தக்கவைக்கிறது; எல்லை அந்த ஊற்றை அடைந்ததா என்பதைக் காட்டிலும் மூலவாக்கியத்தின் இயக்கத்தை இது நெருக்கமாகப் பிரதிபலிக்கிறது.
- source_word: מַעְיַן מֵי נֶפְתּוֹחַ
  choice: நெப்தோவாவின் நீரூற்று
  rationale: מַעְיָן என்பது இயற்கை நீரூற்று. எபிரெயத்தில் ‘நெப்தோவாவின் நீர்களின் ஊற்று’ என்ற அடுக்குத் தொடர்பு இருந்தாலும், ‘நெப்தோவாவின் நீரூற்று’ என்பது அதைப் புரியத்தக்க நவீன தமிழில் வழங்குகிறது; சொல்லமைப்பு அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
