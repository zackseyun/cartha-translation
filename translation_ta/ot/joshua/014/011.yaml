  text: עוֹדֶ֨/נִּי הַ/יּ֜וֹם חָזָ֗ק כַּֽ/אֲשֶׁר֙ בְּ/י֨וֹם שְׁלֹ֤חַ אוֹתִ/י֙ מֹשֶׁ֔ה כְּ/כֹ֥חִ/י אָ֖ז וּ/כְ/כֹ֣חִ/י עָ֑תָּה לַ/מִּלְחָמָ֖ה וְ/לָ/צֵ֥את וְ/לָ/בֽוֹא׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/014/011.yaml
  text: I am still as strong today as I was on the day Moses sent me; as my strength was then[a], so my strength is now, for battle and for going out and coming in.
translation:
  language: ta
  text: மோசே என்னை அனுப்பிய நாளில் இருந்ததைப் போலவே இன்றும் நான் வலிமையுள்ளவனாக இருக்கிறேன். அப்போது எனக்கு இருந்த அதே வலிமை இப்போதும் எனக்கு இருக்கிறது—போரிடுவதற்கும், வெளியே செல்வதற்கும் உள்ளே வருவதற்கும்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “வெளியே செல்வதும் உள்ளே வருவதும்” என்பது செயலிலும் தலைமைப் பொறுப்பிலும் முழுத் திறனோடு ஈடுபடுவதைக் குறிக்கும் எபிரெய மொழிமரபு.
    reason: cultural_note
lexical_decisions:
- source_word: עוֹדֶנִּי הַיּוֹם חָזָק
  choice: இன்றும் நான் வலிமையுள்ளவனாக இருக்கிறேன்
  rationale: עוֹדֶנִּי என்பதிலுள்ள தொடர்நிலையை ‘இன்றும்’ இயல்பாக வெளிப்படுத்துகிறது; חָזָק இச்சூழலில் உடல் வலிமையையும் செயல்திறனையும் குறிக்கிறது.
- source_word: כַּאֲשֶׁר בְּיוֹם שְׁלֹחַ אוֹתִי מֹשֶׁה
  choice: மோசே என்னை அனுப்பிய நாளில் இருந்ததைப் போலவே
  rationale: எபிரெய ஒப்பீட்டையும் குறிப்பிட்ட கடந்தகால நாளையும் தெளிவாகவும் இயல்பான தமிழிலும் காக்கிறது.
- source_word: כְּכֹחִי אָז וּכְכֹחִי עָתָּה
  choice: அப்போது எனக்கு இருந்த அதே வலிமை இப்போதும் எனக்கு இருக்கிறது
  rationale: வினைச்சொல் இல்லாத எபிரெய இணை அமைப்பைத் தமிழில் முழுமையான வாக்கியமாக்கி, அன்றைய வலிமைக்கும் இன்றைய வலிமைக்கும் இடையிலான சமத்துவத்தைப் பாதுகாக்கிறது.
- source_word: לַמִּלְחָמָה
  choice: போரிடுவதற்கும்
  rationale: இங்கு מִלְחָמָה என்பது காலேபின் தனிப்பட்ட போர்திறனைக் குறிப்பதால், ‘போரிடுவதற்கு’ என்பது ‘போருக்காக’ என்பதைக் காட்டிலும் இயல்பாக உள்ளது.
- source_word: וְלָצֵאת וְלָבוֹא
  choice: வெளியே செல்வதற்கும் உள்ளே வருவதற்கும்
  rationale: எபிரெய மொழிமரபின் உருவகத்தை விளக்கமாக மாற்றாமல் நேரடியாகக் காக்கிறது; அதன் விரிவான பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
