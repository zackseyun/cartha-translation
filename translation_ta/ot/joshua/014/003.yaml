base_translation:
  language: en
  yaml_path: translation/ot/joshua/014/003.yaml
  text: For Moses had given the inheritance of the two tribes and the half-tribe beyond the Jordan[a], but to the Levites he gave no inheritance among them.
translation:
  language: ta
  text: ஏனெனில், யோர்தானுக்கு அப்பால்[a] இரண்டு கோத்திரங்களுக்கும் அரைக் கோத்திரத்துக்கும் உரிய பங்கை மோசே ஏற்கெனவே கொடுத்திருந்தார்; ஆனால் லேவியர்களுக்கு அவர்கள் நடுவில் எந்தப் பங்கையும் அவர் கொடுக்கவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘யோர்தானின் மறுபக்கத்தில்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: சூழலில் முந்தைய கூற்றுக்கான விளக்கக் காரணத்தை அறிமுகப்படுத்துகிறது.
- source_word: נָתַן
  choice: ஏற்கெனவே கொடுத்திருந்தார்
  rationale: தற்போதைய கதைநிலைக்கு முன்னரே மோசே செய்திருந்த ஒதுக்கீட்டை இயல்பான தமிழில் இறந்தகால நிறைவாகக் காட்டுகிறது.
- source_word: נַחֲלַת
  choice: உரிய பங்கு
  rationale: இங்கு பரம்பரைச் சொத்தாகக் கிடைத்த நில ஒதுக்கீட்டைக் குறிக்கிறது; நவீன தமிழில் இயல்பாகவும் சூழலுக்குத் துல்லியமாகவும் உள்ளது.
- source_word: שְׁנֵי הַמַּטּוֹת
  choice: இரண்டு கோத்திரங்கள்
  rationale: מַטֶּה என்பதன் அடிப்படைப் பொருள் ‘கோல்’ என்றாலும், நிலப் பங்கீட்டுச் சூழலில் இது கோத்திரங்களையே குறிக்கிறது.
- source_word: וַחֲצִי הַמַּטֶּה
  choice: அரைக் கோத்திரம்
  rationale: மனாசேயின் அரைக் கோத்திரத்தைக் குறிக்கும் வழக்கமான, சுருக்கமான மொழிபெயர்ப்பு.
- source_word: מֵעֵבֶר לַיַּרְדֵּן
  choice: யோர்தானுக்கு அப்பால்
  rationale: எபிரெயப் புவியியல் சொல்லாடலைக் கண்ணோட்டத்தை மிகுதியாக நிர்ணயிக்காமல் பாதுகாக்கிறது.
- source_word: וְלַלְוִיִּם
  choice: ஆனால் லேவியர்களுக்கு
  rationale: இணைப்புச்சொல் சொற்படியாக ‘மற்றும்’ என்றாலும், முன் கூறப்பட்ட கோத்திரங்களுக்கும் லேவியர்களுக்கும் இடையிலான முரண்பாட்டை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: לֹא נָתַן נַחֲלָה
  choice: எந்தப் பங்கையும் அவர் கொடுக்கவில்லை
  rationale: நில ஒதுக்கீட்டை மறுக்கும் வாக்கியத்தை நேரடியாகத் தருவதோடு, முதல் கூறிலுள்ள ‘பங்கு’ என்ற சொற்பொருள் தொடர்ச்சியையும் காக்கிறது.
- source_word: בְּתוֹכָם
  choice: அவர்கள் நடுவில்
  rationale: மற்ற கோத்திரங்களின் மத்தியில் லேவியர்களுக்குத் தனிக் கோத்திர நிலப்பங்கு வழங்கப்படவில்லை என்பதைக் கூறும் எபிரெய வடிவத்தைப் பாதுகாக்கிறது.
theological_decisions:
- issue: லேவியர்களுக்குப் பங்கு கொடுக்கப்படாததன் தன்மை
  choice: மற்ற கோத்திரங்களின் நடுவில் லேவியர்களுக்குத் தனிக் கோத்திர நிலப்பங்கு வழங்கப்படவில்லை என்று உரை கூறுகிறது.
  alternative: லேவியர்களுக்கு எவ்வகையான பங்கும் ஏற்பாடும் இல்லை என்று முழுமையாகப் பொருள்படுத்துதல்.
  rationale: ‘அவர்கள் நடுவில்’ என்ற மூல உரையின் வரம்பைத் தக்கவைத்ததால், லேவியருக்கான எல்லா ஏற்பாடுகளையும் மறுப்பதாக வசனம் ஒலிக்காது; அதேவேளையில் கூடுதல் இறையியல் விளக்கம் முதன்மை உரையில் சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. ‘சுதந்தரம்’ என்பதற்குப் பதிலாக நில ஒதுக்கீட்டுச் சூழலில் இயல்பான ‘உரிய பங்கு/பங்கு’ பயன்படுத்தப்பட்டது; உண்மையான புவியியல் மாற்றுச் சொல்லாக்கம் அடிக்குறிப்பில் வைக்கப்பட்டது.
