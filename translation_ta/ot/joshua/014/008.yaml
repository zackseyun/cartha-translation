source:
  edition: WLC
  text: וְ/אַחַ/י֙ אֲשֶׁ֣ר עָל֣וּ עִמִּ֔/י הִמְסִ֖יו אֶת לֵ֣ב הָ/עָ֑ם וְ/אָנֹכִ֣י מִלֵּ֔אתִי אַחֲרֵ֖י יְהוָ֥ה אֱלֹהָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/014/008.yaml
  text: But my brothers who went up with me made the heart of the people melt, while I wholly followed the LORD my God.
translation:
  language: ta
  text: ஆனால், என்னுடன் ஏறிச் சென்ற என் சகோதரர்கள் மக்களின் மனம் உருகிப்போகச் செய்தார்கள்; நானோ என் தேவனாகிய ஆண்டவரை முழுமையாகப் பின்பற்றினேன்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַחַי
  choice: என் சகோதரர்கள்
  rationale: எபிரெயச் சொல்லின் நேரடிப் பொருளைத் தக்கவைக்கிறது; இங்கு காலேபுடன் சென்ற சக இஸ்ரவேலரைக் குறிக்கிறது.
- source_word: הִמְסִיו אֶת־לֵב הָעָם
  choice: மக்களின் உள்ளம் கரைந்துபோகச் செய்தார்கள்
  rationale: பயம் காரணமாக மக்களின் துணிவு குலைந்ததைச் சித்தரிக்கும் மூலமொழியின் ‘உள்ளத்தைக் கரையச் செய்தல்’ என்ற உருவகத்தை இயல்பான தமிழில் பாதுகாக்கிறது.
- source_word: מִלֵּאתִי אַחֲרֵי
  choice: முழுமையாகப் பின்பற்றினேன்
  rationale: ‘ஒருவருக்குப் பின்னால் முழுமையாகச் செல்லுதல்’ என்ற எபிரெய மரபுத்தொடரின் உணர்வைச் சுருக்கமாகவும் தெளிவாகவும் தருகிறது.
- source_word: יְהוָה
  choice: ஆண்டவர்
  rationale: இறைநாமமான YHWH-ஐத் தமிழில் வழக்கமாகப் பயன்படுத்தப்படும் மரியாதைமிக்க சிறப்புப் பெயரால் வழங்குகிறது.
theological_decisions:
- issue: காலேபின் விசுவாசத்தின் முழுமை
  choice: என் தேவனாகிய ஆண்டவரை முழுமையாகப் பின்பற்றினேன்
  alternative: என் தேவனாகிய ஆண்டவரை முழு மனதுடன் பின்பற்றினேன்
  rationale: ‘முழு மனதுடன்’ என்பது பொருத்தமான விளக்கமாக இருந்தாலும், மூலத்தில் ‘மனம்’ என்ற சொல் இக்கூற்றில் இல்லை; ஆகவே செயலை முழுமையாக நிறைவேற்றியதைக் குறிக்கும் திறந்த அமைப்பைப் பாதுகாக்கிறது.
- issue: இரு தரப்புகளுக்கிடையிலான எதிர்மறை ஒப்பீடு
  choice: ஆனால் …; நானோ …
  alternative: … செய்தார்கள்; அதேவேளையில் நான் …
  rationale: וְאָנֹכִי அமைப்பின் வலியுறுத்தப்பட்ட எதிர்மறையை இயல்பான தமிழில் தெளிவாக வெளிப்படுத்துகிறது; காலேபின் நிலைப்பாட்டை மற்ற உளவாளிகளின் செயலுடன் நேரடியாக மாறுபடுத்துகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. மூலத்தின் உருவகமும் எதிர்மறை வலியுறுத்தலும் பாதுகாக்கப்பட்டுள்ளன; தேவையற்ற விளக்கவுரைகள் சேர்க்கப்படவில்லை.
