- from: ஆனால் என்னுடன் சென்ற என் சகோதரர்கள் மக்களின் உள்ளம் கரைந்துபோகச் செய்தார்கள்; நானோ என் தேவனாகிய ஆண்டவரை முழுமையாகப் பின்பற்றினேன்.
  to: ஆனால், என்னுடன் ஏறிச் சென்ற என் சகோதரர்கள் மக்களின் மனம் உருகிப்போகச் செய்தார்கள்; நானோ என் தேவனாகிய ஆண்டவரை முழுமையாகப் பின்பற்றினேன்.
