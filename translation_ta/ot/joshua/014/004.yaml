base_translation:
  language: en
  yaml_path: translation/ot/joshua/014/004.yaml
  text: For the sons of Joseph were two tribes[a], Manasseh and Ephraim; and they gave no portion to the Levites in the land, except cities to dwell in[c][b], with their pasturelands for their livestock and for their possessions.
translation:
  language: ta
  text: ஏனெனில், யோசேப்பின் வழிவந்தவர்கள் மனாசே, எப்பிராயீம் என்னும் இரண்டு கோத்திரங்களாக இருந்தனர். லேவியர்களுக்கு நாட்டில் பங்கு கொடுக்கவில்லை; அவர்கள் குடியிருப்பதற்கான நகரங்களையும், அவர்களுடைய கால்நடைகளுக்கும் உடைமைகளுக்கும் உரிய அவற்றைச் சுற்றியுள்ள திறந்தவெளி நிலங்களையும்[a] மட்டுமே கொடுத்தனர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “திறந்தவெளி நிலங்கள்” என்பது லேவிய நகரங்களைச் சுற்றியிருந்த, கால்நடைகளுக்கும் உடைமைகளுக்கும் உரிய நிலப்பகுதிகளைக் குறிக்கிறது.
    reason: cultural_note
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய வசனத்தின் நிலப்பங்கீட்டைப் பற்றிய விளக்கத்தை அறிமுகப்படுத்தும் காரணத் தொடர்பை இயல்பான தமிழில் காட்டுகிறது.
- source_word: בְנֵי יוֹסֵף
  choice: யோசேப்பின் வழிவந்தவர்கள்
  rationale: சொல்லுக்குச் சொல் ‘யோசேப்பின் மகன்கள்’ என்றாலும், இங்கு மனாசே மற்றும் எப்பிராயீமின் கோத்திரச் சந்ததியினரைக் குறிப்பதால் சூழலுக்கேற்ற பொருள் தெளிவாக வழங்கப்பட்டது.
- source_word: שְׁנֵי מַטּוֹת
  choice: இரண்டு கோத்திரங்கள்
  rationale: מַטּוֹת என்பதன் இச்சூழலிலான பொருள் கைத்தடிகள் அல்ல, இஸ்ரவேலின் கோத்திரப் பிரிவுகள்.
- source_word: מְנַשֶּׁה וְאֶפְרָיִם
  choice: மனாசே, எப்பிராயீம்
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் பரவலாக அறியப்படும் பெயர் வடிவங்கள் பயன்படுத்தப்பட்டன.
- source_word: וְלֹא נָתְנוּ חֵלֶק
  choice: பங்கு கொடுக்கப்படவில்லை
  rationale: எபிரெயில் வினை செயப்பாட்டு வடிவில் இருந்தாலும், வெளிப்படையாகக் குறிப்பிடப்படாத கொடுப்பவர்களைத் தமிழில் ஊகித்து சேர்க்காமல், நிலப்பங்கீட்டின் விளைவை இயல்பாகச் சொல்கிறது.
- source_word: לַלְוִיִּם
  choice: லேவியர்களுக்கு
  rationale: பன்மைச் சொல் லேவி கோத்திரத்தாரை ஒரு குழுவாகக் குறிக்கிறது.
- source_word: בָּאָרֶץ
  choice: நாட்டில்
  rationale: பங்கிடப்பட்ட கானான் நாட்டைக் குறிக்கும் இயல்பான தமிழ்ச் சொல்.
- source_word: כִּי אִם
  choice: மட்டுமே
  rationale: நிலப்பங்கு அளிக்கப்படவில்லை என்ற மறுப்புக்குப் பின் வரும் விதிவிலக்கைத் தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: עָרִים לָשֶׁבֶת
  choice: அவர்கள் குடியிருப்பதற்கான நகரங்கள்
  rationale: நகரங்கள் வழங்கப்பட்ட நோக்கம் குடியிருப்பது என்பதைக் காக்கிறது.
- source_word: מִגְרְשֵׁיהֶם
  choice: அந்நகரங்களைச் சுற்றியுள்ள திறந்தவெளி நிலங்கள்
  rationale: லேவிய நகரங்களைச் சுற்றி கால்நடை மேய்த்தல் உள்ளிட்ட பயன்பாடுகளுக்கிருந்த நிலத்தை ‘மேய்ச்சல் நிலம்’ என்று மிகக் குறுகலாக வரையறுக்காமல் எடுத்துரைக்கிறது.
- source_word: לְמִקְנֵיהֶם
  choice: அவர்களுடைய கால்நடைகளுக்கு
  rationale: מִקְנֶה என்பது மாடுகளை மட்டும் அல்லாமல் வளர்ப்பு விலங்குகளைப் பொதுவாகக் குறிக்கக்கூடும்.
- source_word: וּלְקִנְיָנָם
  choice: அவர்களுடைய உடைமைகளுக்கு
  rationale: קִנְיָן என்பதன் பரந்த ‘சொத்து/உடைமை’ பொருளைக் காக்கும் இயல்பான தமிழ் வடிவம்.
theological_decisions:
- issue: லேவியர்களின் நிலப்பங்கு
  choice: ‘நாட்டில் பங்கு கொடுக்கப்படவில்லை’ என்று மொழிபெயர்த்து, அதன்பின் நகரங்களும் அவற்றைச் சுற்றிய நிலங்களும் வழங்கப்பட்ட விதிவிலக்கைத் தெளிவுபடுத்துதல்
  alternative: லேவியர்களுக்கு எந்தச் சொத்தும் வழங்கப்படவில்லை என்று பொதுமைப்படுத்துதல்
  rationale: மூலவசனம் மறுப்பையும் அதற்கான விதிவிலக்கையும் ஒன்றாக வைத்துள்ளது; லேவியர்கள் முற்றிலும் நிலமற்றவர்கள் என்ற மேலதிக இறையியல் முடிவை மொழிபெயர்ப்பில் புகுத்தக்கூடாது.
translation_notes:
  register: நவீன தரநிலைத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டது. ‘வழிவந்தவர்கள்’ என்பது கோத்திரச் சந்ததியைக் தெளிவுபடுத்துகிறது; ‘திறந்தவெளி நிலங்கள்’ என்பது מִגְרָשׁ என்ற சொல்லின் பயன்பாட்டு அகலத்தைப் பாதுகாக்கிறது.
