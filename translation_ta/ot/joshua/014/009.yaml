base_translation:
  language: en
  yaml_path: translation/ot/joshua/014/009.yaml
  text: And Moses swore on that day[a], saying, ‘Surely the land on which your foot has trodden shall be an inheritance for you and for your sons forever[b], because you have fully followed Yahweh my God.’
translation:
  language: ta
  text: 'அந்நாளில் மோசே சத்தியம் செய்து கூறினார்: “நிச்சயமாகவே[a], உன் கால் மிதித்த நிலம் உனக்கும் உன் மகன்களுக்கும் என்றென்றும் உரிமைச்சொத்தாக இருக்கும்[b]. ஏனெனில், நீ என் கடவுளாகிய யாவேவை முழுமையாகப் பின்பற்றினாய்.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரேய மொழியில் சொற்பட ‘இல்லையென்றால்’ என வரும் இச்சொற்றொடர், இங்கு சத்தியத்தை வலியுறுத்தும் மரபுத்தொடராக இருப்பதால் ‘நிச்சயமாகவே’ என்று மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
  - marker: b
    text: ‘உன் மகன்களுக்கும்’ என்பது எபிரேய மூலத்தின் நேரடி வாசகம்; சூழலில் இது ‘உன் சந்ததியினருக்கும்’ எனப் பொருள்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׁבַע
  choice: சத்தியம் செய்து
  rationale: שׁבע என்பதன் நிபால் வடிவம் ஆணையிடுதல் அல்லது சத்தியம் செய்தல் எனப் பொருள்படும். நவீன தமிழில் தவறாக ‘கட்டளையிட்டார்’ என்று புரிந்துகொள்ளப்படாமல், உறுதிமொழியின் தன்மையைத் தெளிவாகக் காட்டுகிறது.
- source_word: בַּיּוֹם הַהוּא
  choice: அந்நாளில்
  rationale: காலத்தைக் குறிக்கும் எபிரேயச் சொற்றொடரைச் சுருக்கமாகவும் இயல்பாகவும் பிரதிபலிக்கிறது.
- source_word: לֵאמֹר
  choice: கூறியது
  rationale: நேரடிக் கூற்றை அறிமுகப்படுத்தும் எபிரேய வடிவத்தின் இயல்பான தமிழாக்கம்.
- source_word: אִם לֹא
  choice: நிச்சயமாகவே
  rationale: இது இங்கு நேரடியான நிபந்தனை அல்ல; சத்தியத்தின் வலியுறுத்தும் மரபுத்தொடர். ‘நிச்சயமாகவே’ அதன் உறுதியைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: הָאָרֶץ אֲשֶׁר דָּרְכָה רַגְלְךָ בָּהּ
  choice: உன் கால் மிதித்த நிலம்
  rationale: ஒருமையில் உள்ள ‘கால்’ என்பதையும் நிலத்தில் கால் பதித்ததைக் குறிக்கும் தெளிவான உருவகத்தையும் காக்கிறது.
- source_word: תִהְיֶה לְךָ לְנַחֲלָה
  choice: உனக்கு ... உரிமைச்சொத்தாக இருக்கும்
  rationale: נַחֲלָה என்பது பங்காகக் கிடைத்து வழிவழியாக உரிமையாக்கப்படும் சொத்தைச் சுட்டுகிறது. ‘உரிமைச்சொத்து’ நவீன தமிழில் அந்த நிலவுடைமை நுணுக்கத்தை இயல்பாகத் தருகிறது.
- source_word: וּלְבָנֶיךָ
  choice: உன் மகன்களுக்கும்
  rationale: எபிரேய மூலத்தில் ஆண்பால் பன்மையான ‘மகன்கள்’ என்றே உள்ளது; அதை முதன்மை உரையில் பாதுகாக்கிறது.
- source_word: עַד עוֹלָם
  choice: என்றென்றும்
  rationale: நீடித்த காலத்தை வலியுறுத்தும் எபிரேயச் சொல்லுக்கு இயல்பான, கண்ணியமான தமிழாக்கம்.
- source_word: כִּי מִלֵּאתָ אַחֲרֵי
  choice: ஏனெனில், நீ ... முழுமையாகப் பின்பற்றினாய்
  rationale: מלא אחרי என்ற மரபுத்தொடரின் ‘முழுமையாகப் பின்பற்றுதல்’ என்ற வலிமையைப் பாதுகாக்கிறது; ‘முழு மனதுடன்’ என்பதைக் காட்டிலும் மூல உருவகத்துக்கு நெருக்கமானது.
- source_word: יְהוָה
  choice: யாவே
  rationale: திருநான்கெழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் நிலைபெற்றுள்ள ஒலிபெயர்ப்பு வடிவில் தனிப்பெயராக வழங்குகிறது.
- source_word: אֱלֹהָי
  choice: என் கடவுளாகிய
  rationale: முதல் நபர் ஒருமை உடைமைப் பின்னொட்டைத் தெளிவாகப் பாதுகாத்து, யாவேவுடன் இயல்பாக இணைக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூலத்தில் இறைவனின் தனிப்பெயர் நேரடியாக உள்ளது. பட்டப்பெயராக மாற்றாமல் ஒலிபெயர்ப்பது அந்த உடன்படிக்கைப் பெயரைப் பாதுகாக்கிறது.
- issue: וּלְבָנֶיךָ என்ற பாலினக் குறியீடுள்ள சந்ததிச் சொல்
  choice: உன் மகன்களுக்கும்
  alternative: உன் சந்ததியினருக்கும்
  rationale: எபிரேய உரை நேரடியாக ‘உன் மகன்கள்’ என்கிறது. அதன் வடிவத்தை முதன்மை உரையில் காத்து, சூழலில் இருக்கக்கூடிய விரிந்த பொருளை அடிக்குறிப்பில் தெரிவிக்கிறது.
- issue: עַד עוֹלָם குறிக்கும் காலநீளம்
  choice: என்றென்றும்
  alternative: நிரந்தரமாக
  rationale: வாக்குறுதியின் நீடித்த தன்மையை மூலத்தின் வலிமையுடன் வழங்குகிறது; அதன் வரலாற்று அல்லது உடன்படிக்கைச் செயல்பாட்டை மொழிபெயர்ப்பிலேயே குறுக்கி விளக்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையைக் கடைப்பிடிக்கிறது. ‘சத்தியம் செய்து’, ‘உரிமைச்சொத்து’ போன்ற சொற்கள் மூலத்தின் சட்டபூர்வமான மற்றும் உடன்படிக்கை சார்ந்த கனத்தைத் தக்கவைத்தபடியே இயல்பாக உள்ளன. மூலத்தின் ஒருமை உருவகமான ‘உன் கால்’ மற்றும் ‘முழுமையாகப் பின்பற்றினாய்’ என்பவை திட்டமிட்டு பாதுகாக்கப்பட்டுள்ளன.
