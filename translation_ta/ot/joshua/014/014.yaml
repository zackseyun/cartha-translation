base_translation:
  language: en
  yaml_path: translation/ot/joshua/014/014.yaml
  text: Therefore Hebron became the inheritance of Caleb son of Jephunneh the Kenizzite to this day[a], because he fully followed Yahweh, the God of Israel.
translation:
  language: ta
  text: ஆகையால், எபிரோன் கெனிசியனான எப்புன்னேயின் மகன் காலேபுக்குச் சுதந்தரமாக இந்நாள்வரை உள்ளது; ஏனெனில் அவர் இஸ்ரவேலின் கடவுளாகிய யாவேவை முழு மனத்துடன் பின்பற்றினார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரேய மரபுத்தொடரைச் சொல்லுக்குச் சொல் மொழிபெயர்த்தால், “யாவேவுக்குப் பின்னால் நிறைவு செய்தார்” என வரும்; இது யாவேவுக்கான முழுமையான பற்றுறுதியைக் குறிக்கிறது. “யாவேவை முழுமையாகப் பின்பற்றினார்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל כֵּן
  choice: ஆகையால்
  rationale: முந்தைய நிகழ்வின் விளைவாக எபிரோன் காலேபுக்குக் கிடைத்ததை இயல்பான தமிழில் காரண–விளைவு தொடர்புடன் காட்டுகிறது.
- source_word: הָיְתָה ... לְנַחֲלָה
  choice: உரிமைச்சொத்தானது
  rationale: எபிரோன் காலேபுக்குப் பங்கிடப்பட்டு, அவருக்குரிய நிலையான சொத்தாக மாறியதைக் குறிக்கிறது.
- source_word: חֶבְרוֹן
  choice: எபிரோன்
  rationale: இடப்பெயரின் தமிழில் பரவலாக அறியப்பட்ட வடிவம்.
- source_word: לְכָלֵב בֶּן יְפֻנֶּה הַקְּנִזִּי
  choice: கெனிசியனான எப்புன்னேயின் மகன் காலேபுக்கு
  rationale: உறவு, இன அடையாளம், பயனாளி ஆகியவற்றைத் தெளிவாகவும் இயல்பான தமிழ் சொல் வரிசையிலும் தருகிறது.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: இந்நாள்வரை அவருடையதாக இருந்து வருகிறது
  rationale: கதைசொல்லியின் காலம்வரை அந்த உரிமை தொடர்ந்ததைத் தெளிவுபடுத்துகிறது.
- source_word: יַעַן אֲשֶׁר
  choice: ஏனெனில்
  rationale: காலேபுக்கு அந்த உரிமை கிடைத்ததற்கான காரணத்தை நேரடியாக அறிமுகப்படுத்துகிறது.
- source_word: מִלֵּא אַחֲרֵי
  choice: முழு மனத்துடன் பின்பற்றினார்
  rationale: சொல்லுக்குச் சொல் மொழிபெயர்த்தால் இயல்பற்றதாகும் எபிரேய மரபுத்தொடரின் முழுமையான பற்றுறுதி என்ற பொருளைத் தெளிவாகத் தருகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரைப் பட்டப்பெயரால் மாற்றாமல், எபிரேய நான்கெழுத்துப் பெயரின் தமிழாக்கமாக வழங்குகிறது.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் கடவுள்
  rationale: எபிரேய இணைப்புத் தொடரைத் தெளிவாகவும் இயல்பாகவும் மொழிபெயர்க்கிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூலத்தில் பொதுவான பட்டப்பெயர் அல்ல, தனிப்பட்ட உடன்படிக்கைப் பெயரான יהוה நேரடியாக வருகிறது; ஆகவே அதன் பெயர்த்திரிபு பாதுகாக்கப்படுகிறது.
- issue: מִלֵּא אַחֲרֵי என்பதிலுள்ள காலேபின் பற்றுறுதியின் தன்மை
  choice: முழு மனத்துடன் பின்பற்றினார்
  alternative: முழுமையாகக் கீழ்ப்படிந்தார்
  rationale: மூலம் முதன்மையாக ‘பின்பற்றுதல்’ என்ற உருவகத்தையே கொண்டுள்ளது; ‘கீழ்ப்படிதல்’ என்று மட்டும் மாற்றாமல், முழுமையான பற்றுறுதியை வெளிப்படுத்துகிறது.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘உரிமைச்சொத்து’ என்பது நிலப் பங்கீட்டுச் சூழலிலுள்ள נַחֲלָה என்பதன் பொருளைத் தருகிறது; ‘முழு மனத்துடன்’ என்பது எபிரேய மரபுத்தொடரின் முழுமையான பற்றுறுதியை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
