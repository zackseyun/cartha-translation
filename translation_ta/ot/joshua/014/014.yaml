- from: ஆகையால், கெனிசியனான எப்புன்னேயின் மகன் காலேபுக்கு எபிரோன் உரிமைச்சொத்தானது; அது இந்நாள்வரை அவருடையதாக இருந்து வருகிறது. ஏனெனில், அவர் இஸ்ரவேலின் கடவுளாகிய யாவேவை முழு மனத்துடன் பின்பற்றினார்.[a]
