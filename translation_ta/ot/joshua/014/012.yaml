  to: இப்போது, அந்த நாளில் யாவே கூறிய இந்த மலைநாட்டை எனக்குத் தாரும்[a]. அங்கே ஏனாக்கியர் இருக்கிறார்கள் என்றும், அரண்களால் பாதுகாக்கப்பட்ட பெரிய நகரங்கள் இருக்கின்றன என்றும் அந்த நாளில் நீரே கேட்டீர். ஒருவேளை யாவே என்னோடு இருப்பார்[b]; யாவே சொன்னபடியே நான் அவர்களை வெளியேற்றுவேன்.
