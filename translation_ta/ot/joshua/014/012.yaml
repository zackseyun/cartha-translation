  text: וְ/עַתָּ֗ה תְּנָ/ה לִּ/י֙ אֶת הָ/הָ֣ר הַ/זֶּ֔ה אֲשֶׁר דִּבֶּ֥ר יְהוָ֖ה בַּ/יּ֣וֹם הַ/ה֑וּא כִּ֣י אַתָּֽה שָׁמַעְתָּ֩ בַ/יּ֨וֹם הַ/ה֜וּא כִּֽי עֲנָקִ֣ים שָׁ֗ם וְ/עָרִים֙ גְּדֹל֣וֹת בְּצֻר֔וֹת אוּלַ֨י יְהוָ֤ה אוֹתִ/י֙ וְ/ה֣וֹרַשְׁתִּ֔י/ם כַּ/אֲשֶׁ֖ר דִּבֶּ֥ר יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/014/012.yaml
  text: Now give me this hill country that Yahweh spoke about on that day[a], because you yourself heard on that day that the Anakim are there, with great fortified cities. Perhaps Yahweh will be with me, and I will drive them out[b], just as Yahweh said.
translation:
  language: ta
  text: இப்போது, அந்த நாளில் யாவே கூறிய இந்த மலைநாட்டை எனக்குத் தாரும்[a]. அங்கே ஏனாக்கியர் இருக்கிறார்கள் என்றும், அரண்களால் பாதுகாக்கப்பட்ட பெரிய நகரங்கள் இருக்கின்றன என்றும் அந்த நாளில் நீரே கேட்டீர். ஒருவேளை யாவே என்னோடு இருப்பார்[b]; யாவே சொன்னபடியே நான் அவர்களை வெளியேற்றுவேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இந்த மலையை.” எபிரேயச் சொல் ஒரு தனி மலையையோ மலைப்பாங்கான ஒரு பகுதியையோ குறிக்கலாம்; இங்கு பரந்த நிலப்பகுதியே பெரும்பாலும் குறிக்கப்படுகிறது.
    reason: lexical_alternative
  - marker: b
    text: எபிரேயத்தில், “ஒருவேளை யாவே என்னோடு”; வரவிருக்கும் போரில் எதிர்பார்க்கப்படும் இறை உடனிருப்பைக் குறிக்கும் வினையற்ற சொற்றொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: இப்போது
  rationale: காலேபின் தற்போதைய கோரிக்கையை அறிமுகப்படுத்தும் உரையாடல் குறியீடு; இணைப்புச் சொல்லைத் தனியே மொழிபெயர்க்காமலும் தமிழில் தொடர்ச்சி இயல்பாகத் தெரிகிறது.
- source_word: תְּנָה לִּי
  choice: எனக்குத் தாரும்
  rationale: נתן வினையின் கட்டளை வடிவத்தையும் யோசுவாவிடம் பேசும் மரியாதை நிலையையும் நேரடியாகவும் இயல்பாகவும் தருகிறது.
- source_word: אֶת־הָהָר הַזֶּה
  choice: இந்த மலைநாடு
  rationale: הַר என்பது தனி மலையையோ மலைப்பாங்கான பகுதியையோ குறிக்கலாம்; இங்கு நிலப்பகுதி ஒதுக்கீடே சூழல் என்பதால் ‘மலைநாடு’ பொருத்தமானது.
- source_word: אֲשֶׁר דִּבֶּר יְהוָה
  choice: யாவே குறிப்பிட்ட
  rationale: דבר என்பதன் அடிப்படைப் பொருளான ‘பேசுதல்’ காக்கப்படுகிறது; ‘வாக்குறுதி அளித்த’ என்று சூழலை விளக்கி மிகைப்படுத்துவது தவிர்க்கப்படுகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரேய இறைப்பெயரான நான்கெழுத்துப் பெயரை ஒரு பட்டமாக மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: כִּי אַתָּה שָׁמַעְתָּ
  choice: ஏனெனில் ... நீரே கேட்டீர்
  rationale: כִּי-யின் காரணப் பொருளையும் אַתָּה தரும் வலியுறுத்தலையும் ‘நீரே’ என்பதால் வெளிப்படுத்துகிறது.
- source_word: כִּי עֲנָקִים שָׁם
  choice: அங்கே ஏனாக்கியர் ... இருப்பதாக
  rationale: மக்களினப் பெயரை ஒலிபெயர்த்து, காலேப் விவரிக்கும் தற்போதைய நிலையை இயல்பான தமிழில் தருகிறது.
- source_word: וְעָרִים גְּדֹלוֹת בְּצֻרוֹת
  choice: பெரிய அரண்சூழ்ந்த நகரங்களும்
  rationale: நகரங்களின் பெருமையையும் பாதுகாப்பு அரண்களையும் சுருக்கமான நவீன தமிழில் காக்கிறது.
- source_word: אוּלַי
  choice: ஒருவேளை
  rationale: உறுதியின்மையையும் இறை உதவியை முன்கூட்டியே உரிமைகோராத பணிவான நம்பிக்கையையும் காக்கிறது.
- source_word: יְהוָה אוֹתִי
  choice: யாவே என்னோடு இருப்பார்
  rationale: வினைச்சொல் இல்லாத எபிரேய சொற்றொடரை வரவிருக்கும் போருக்கான இறை உடனிருப்பாக இயல்பாக நிறைவு செய்கிறது; ‘உதவுவார்’ என்று விளக்கிப் பொருளைச் சுருக்கவில்லை.
- source_word: וְהוֹרַשְׁתִּים
  choice: நான் அவர்களைத் துரத்திவிடுவேன்
  rationale: ירשׁ வினையின் ஹிஃபில் வடிவம் இங்கு குடியிருப்போரை நிலத்திலிருந்து அகற்றுவதைக் குறிக்கிறது; ‘துரத்திவிடுவேன்’ தெளிவான நவீன தமிழ்.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழியாக்கம்
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலத்தில் நேரடியாக வரும் தனிப்பட்ட இறைப்பெயரை ஒரு பட்டத்தால் பதிலிடாமல், தமிழில் பரவலாகப் புரியக்கூடிய வகையில் ஒலிபெயர்க்கிறது.
- issue: אוּלַי יְהוָה אוֹתִי என்பதன் வலிமை
  choice: ஒருவேளை யாவே என்னோடு இருப்பார்
  alternative: யாவே எனக்கு உதவுவார் / யாவே நிச்சயமாக என்னோடு இருப்பார்
  rationale: אוּלַי தரும் ‘ஒருவேளை’ என்ற நுட்பத்தையும், வினையற்ற ‘யாவே என்னோடு’ என்ற சொற்றொடரின் திறந்த இறையியல் பதற்றத்தையும் காக்கிறது; உதவியை உறுதிப்படுத்தியோ குறிப்பிட்ட செயலாகச் சுருக்கியோ விடவில்லை.
translation_notes:
  register: நவீன செந்தமிழ் சார்ந்த, ஆனால் பொதுவாசகர்களுக்கு எளிதில் புரியும் கண்ணியமான நடை. யோசுவாவை நோக்கிய ஒருமை மரியாதைக்கு ‘நீர்/கேட்டீர்/தாரும்’ பயன்படுத்தப்பட்டுள்ளது. இனப்பெயர் ‘ஏனாக்கியர்’ எனத் தமிழ் ஒலியமைப்புக்கு ஏற்றவாறு தரப்பட்டுள்ளது.
