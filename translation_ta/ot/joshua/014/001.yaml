  source_fidelity: முதற் கூறு நிலத்தை உரிமைப் பங்காகப் பெற்றதைக் துல்லியமாகக் காட்டுகிறது; இரண்டாம் கூறும் அதிகாரபூர்வமான பங்கீட்டைக் காட்டுகிறது. ஆனால் רָאשֵׁי אֲבוֹת הַמַּטּוֹת என்ற சொல்லமைப்பில் ‘தந்தைவழிக் குடும்பங்கள்’ என்று மொழிபெயர்ப்பது மூலத்தில் இல்லாத ‘குடும்பம்/வீடு’ என்ற கூறைச் சேர்க்கிறது. அதனை ‘கோத்திரப் பிதாக்களின் தலைவர்கள்’ எனத் திருத்துவது மூலச் சொல்லமைப்புக்கு நெருக்கமானது.
  naturalness: ‘ஆசாரியனான எலெயாசார்’ மற்றும் ‘கோத்திரப் பிதாக்களின் தலைவர்கள்’ ஆகிய வடிவங்கள் நவீனத் தரத் தமிழில் தெளிவாகவும் கண்ணியமாகவும் உள்ளன. ‘இஸ்ரவேலின் மகன்கள்’ என்ற முறையான குடும்பச் சொல்லாட்சி முதன்மை உரையில் தக்கவைக்கப்பட்டுள்ளது.
  terminology: ‘உரிமைப் பங்கு,’ ‘கானான் நாடு,’ ‘ஆசாரியன்,’ ‘கோத்திரம்,’ ‘பிதாக்கள்’ ஆகியவை நிலப்பங்கீடு மற்றும் பண்டைய சமூக அமைப்புக்கேற்ற சொற்களாக உள்ளன. பிதாக்கள் குறித்த அடிக்குறிப்பு, இது கோத்திரங்களுக்குள் உள்ள மூதாதையர்-வழிக் குழுக்களைக் குறிக்கும் என விளக்குகிறது; மூலத்தில் இல்லாத ‘குடும்பங்கள்’ என்பதை முதன்மை உரையில் ஏற்றுவதில்லை.
