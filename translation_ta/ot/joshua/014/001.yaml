base_translation:
  language: en
  yaml_path: translation/ot/joshua/014/001.yaml
  text: These are the inheritances that the sons of Israel received in the land of Canaan[a], which Eleazar the priest, Joshua son of Nun[c][b], and the heads of the fathers’ houses of the tribes of the sons of Israel apportioned to them.
translation:
  language: ta
  text: இஸ்ரவேலின் மகன்கள்[a] கானான் நாட்டில் உரிமைப் பங்காகப் பெற்றவை இவையே; ஆசாரியனான எலெயாசார், நூனின் மகன் யோசுவா, இஸ்ரவேலின் மகன்களுடைய கோத்திரப் பிதாக்களின் தலைவர்கள்[c] ஆகியோர் அவற்றை அவர்களுக்குப் பங்கிட்டுக் கொடுத்தார்கள்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘இஸ்ரவேலின் மகன்கள்’ என்பதற்குப் பதிலாக ‘இஸ்ரவேலர்’ என்றும் மொழிபெயர்க்கலாம். எபிரெய மொழியில் குடும்ப உறவைச் சுட்டும் சொற்றொடர் நேரடியாகப் பயன்படுத்தப்பட்டுள்ளது.
    reason: lexical_alternative
  - marker: b
    text: ‘அவற்றை அவர்களுக்கு உரிமைச் சொத்தாக அளித்தார்கள்’ என்றும் மொழிபெயர்க்கலாம். எபிரெய மூலத்தில் ‘உரிமையாகப் பெறுதல்/அளித்தல்’ சார்ந்த ஒரே சொல்வேர் இரண்டு பகுதிகளிலும் வருகிறது.
    reason: lexical_alternative
  - marker: c
    text: ‘கோத்திரப் பிதாக்கள்’ என்பது கோத்திரங்களுக்குள் மூதாதையர் வழியாக அமைந்த குழுக்களைக் குறிக்கிறது.
    reason: cultural_note
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: இவையே
  rationale: புதிய பகுதியை அறிமுகப்படுத்தும் சுட்டுப்பெயரின் வலிமையை இயல்பான தமிழில் காட்டுகிறது. וְ என்ற இணைப்பைத் தனியாக ‘மேலும்’ என்று மொழிபெயர்ப்பது இங்கு தேவையற்றதாக இருப்பதால், உரையோட்டத்திலேயே அதன் தொடர்பு வெளிப்படுகிறது.
- source_word: נָחֲלוּ
  choice: உரிமைப் பங்காகப் பெற்றவை
  rationale: இஸ்ரவேல் மக்கள் தங்களுக்கு ஒதுக்கப்பட்ட நிலத்தை உரிமையாகப் பெற்றதைக் குறிக்கிறது; மரணத்திற்குப் பின் கிடைக்கும் சொத்து என்ற குறுகிய எண்ணத்தைத் தவிர்த்து, நிலப் பங்கீட்டுச் சூழலைத் தெளிவாக்குகிறது.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் மகன்கள்
  rationale: எபிரெய மூலத்தின் குடும்ப உறவுசார் சொல்லாட்சியைத் தெளிவாகப் பேணுகிறது; இயல்பான இனப்பெயரான ‘இஸ்ரவேலர்’ அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: בְּאֶרֶץ כְּנָעַן
  choice: கானான் நாட்டில்
  rationale: மூலத்தில் உள்ள ‘நாடு/நிலம்’ என்ற நிலப்பரப்பு வலியுறுத்தலைப் பேணி, தமிழில் இயல்பாக ஒலிக்கிறது.
- source_word: אֲשֶׁר נִחֲלוּ אוֹתָם
  choice: அவற்றை அவர்களுக்குப் பங்கிட்டுக் கொடுத்தார்கள்
  rationale: நில உரிமைப் பங்குகளை அதிகாரபூர்வமாக ஒதுக்கிய செயலைத் தெளிவாகக் காட்டுகிறது. நחל என்ற வேரின் மீளுரைப்பைத் தமிழில் இயல்பாக அப்படியே மீட்டுரைக்க இயலாததால், மாற்று வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: אֶלְעָזָר הַכֹּהֵן
  choice: ஆசாரியர் எலெயாசார்
  rationale: பட்டத்தையும் பெயரையும் நவீன மரியாதைத் தமிழில் இயல்பாக வழங்குகிறது.
- source_word: יְהוֹשֻׁעַ בִּן נוּן
  choice: நூனின் மகன் யோசுவா
  rationale: தந்தைபெயர் உறவை மூலத்திற்கேற்ப தெளிவாகப் பேணுகிறது.
- source_word: רָאשֵׁי אֲבוֹת הַמַּטּוֹת
  choice: கோத்திரங்களின் தந்தைவழிக் குடும்பத் தலைவர்கள்
  rationale: רָאשֵׁי என்பதன் தலைமைப் பொருளையும், אֲבוֹת என்பதன் மூதாதையர்/தந்தைவழிக் குடும்ப அமைப்பையும், הַמַּטּוֹת என்பதன் கோத்திரத் தொடர்பையும் வாசிக்கத்தக்க தமிழில் ஒருங்கிணைக்கிறது.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் மகன்களுடைய
  rationale: இந்தச் சொற்றொடர் கோத்திரங்களைச் சார்ந்ததாக வாசிக்கப்படுவதால், தலைவர்கள் யாருக்காகச் செயல்பட்டார்கள் என்பதைக் காட்டுவதற்குப் பதிலாக அந்தக் கோத்திரங்கள் யாருடையவை என்பதைக் காட்டுகிறது.
theological_decisions:
- issue: בני ישראל என்ற பாலினக் குறியுள்ள உடன்படிக்கைசார் அழைப்புப் பெயர்
  choice: இஸ்ரவேலின் மகன்கள்
  alternative: இஸ்ரவேலர்
  rationale: மூலத்தின் ஆண்பால் பன்மை மற்றும் குடும்ப உறவுசார் வடிவத்தை முதன்மை உரையில் பேணுகிறது; இனக்குழுவைக் குறிக்கும் இயல்பான மாற்று அடிக்குறிப்பில் உள்ளது.
- issue: אבות என்பதில் உள்ள உறவுமுறைச் சமூக அமைப்பு
  choice: தந்தைவழிக் குடும்பங்கள்
  alternative: மூதாதையர் குடும்பங்கள் / குடும்பக் குலங்கள்
  rationale: மூல உலகின் தந்தை/மூதாதையர் அடிப்படையிலான குடும்பக் குழுவை பொதுவான ‘குடும்பம்’ அல்லது ‘தலைவர்கள்’ என்று சுருக்காமல் வெளிப்படுத்துகிறது.
- issue: נחל என்ற ஒரே வேரின் இருமுறைப் பயன்பாடு
  choice: உரிமைப் பங்காகப் பெற்றவை ... பங்கிட்டுக் கொடுத்தார்கள்
  alternative: உரிமைச் சொத்தாகப் பெற்றவை ... உரிமைச் சொத்தாக அளித்தார்கள்
  rationale: ஒரே கருத்துவேரைத் தமிழில் சொற்சொல்லாக மீண்டும் கூறுவதால் ஏற்படும் செயற்கைத்தன்மையைத் தவிர்த்து, பெறுதல் மற்றும் ஒதுக்குதல் ஆகிய இரு கோணங்களையும் தெளிவாக்குகிறது; மூலத்தின் மீளுரை அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் வேதாகம வரலாற்றுச் சூழலுக்கேற்ற கண்ணியமான நடையிலும் மொழிபெயர்க்கப்பட்டுள்ளது. ‘உரிமைப் பங்கு’, ‘கோத்திரம்’, ‘தந்தைவழிக் குடும்பம்’ ஆகிய சொற்கள் நிலப் பங்கீட்டையும் பண்டைய சமூக அமைப்பையும் தெளிவாகப் பேணுகின்றன.
