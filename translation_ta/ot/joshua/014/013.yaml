- source_word: וַיְבָרְכֵהוּ
  choice: அவனை ஆசீர்வதித்து
  rationale: ברך என்பதன் மூன்றாம் நபர் ஆண்பால் ஒருமைச் சுட்டுப்பெயர் பின்னொட்டை நேரடியாகப் பேணுகிறது; சூழலில் ‘அவன்’ என்பது காலேபைக் குறிக்கிறது.
- source_word: יְהוֹשֻׁעַ
  choice: யோசுவா
  rationale: எபிரெயத் தனிப்பெயரின் தமிழில் நிலைபெற்ற வேதாகம ஒலிபெயர்ப்பு.
- source_word: וַיִּתֵּן
  choice: கொடுத்தார்
  rationale: נתן என்பதன் பொதுவான பொருளான ‘கொடு’ என்பதை நேரடியாக வழங்குகிறது; நிலப் பங்கீட்டுச் சூழலுக்கு இயல்பாகப் பொருந்துகிறது.
- source_word: אֶת חֶבְרוֹן
  choice: எப்ரோனை
  rationale: אֶת தனியே மொழிபெயர்க்கப்படாது; חֶבְרוֹן என்ற இடப்பெயர் தமிழில் வழக்கமான ‘எப்ரோன்’ என ஒலிபெயர்க்கப்பட்டு, செயப்படுபொருள் உருபு சேர்க்கப்பட்டுள்ளது.
- source_word: לְכָלֵב בֶּן יְפֻנֶּה
  choice: எப்புன்னேயின் மகன் காலேபுக்கு
  rationale: לְ குறிக்கும் பெறுபவரையும், בֶּן יְפֻנֶּה என்ற வம்ச அடையாளத்தையும் இயல்பான நவீன தமிழ்ச் சொல்வரிசையில் தருகிறது.
- source_word: לְנַחֲלָה
  choice: சொத்துரிமையாக
  rationale: נַחֲלָה இங்கு இஸ்ரவேலின் நிலப் பங்கீட்டில் உரிமையாக அளிக்கப்பட்ட நிலத்தைக் குறிக்கிறது; ‘சொத்துரிமையாக’ என்பது வெறும் உடைமையைவிட மரபுரிமை/பங்குரிமை நுணுக்கத்தைத் தெளிவாகக் காட்டுகிறது.
