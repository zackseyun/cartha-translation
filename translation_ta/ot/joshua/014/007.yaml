- from: யெகோவாவின் ஊழியரான மோசே காதேஸ்-பர்னேயாவிலிருந்து இந்த நாட்டை வேவுபார்க்க என்னை அனுப்பியபோது எனக்கு நாற்பது வயது. என் உள்ளத்தில் இருந்தபடியே நான் அவரிடம் செய்தி கொண்டுவந்தேன்.[a]
  to: மோசே, யாவேயின் ஊழியர், காதேஸ்-பர்னேயாவிலிருந்து தேசத்தை வேவு பார்க்க என்னை அனுப்பியபோது எனக்கு நாற்பது வயது. என் உள்ளத்தில் இருந்தபடியே நான் அவருக்கு அறிக்கை அளித்தேன்.[a]
