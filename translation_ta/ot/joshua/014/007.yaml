base_translation:
  language: en
  yaml_path: translation/ot/joshua/014/007.yaml
  text: I was forty years old when Moses the servant of Yahweh sent me from Kadesh-barnea to spy out the land[a], and I brought him back word according to my heart.
translation:
  language: ta
  text: மோசே, யாவேயின் ஊழியர், காதேஸ்-பர்னேயாவிலிருந்து தேசத்தை வேவு பார்க்க என்னை அனுப்பியபோது எனக்கு நாற்பது வயது. என் உள்ளத்தில் இருந்தபடியே நான் அவருக்கு அறிக்கை அளித்தேன்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என் உள்ளத்தில் இருந்ததற்கு ஏற்ப நான் அவருக்கு அறிக்கை அளித்தேன்.”
    reason: எபிரெயச் சொற்றொடர் காலேபின் உள்ளத்தில் இருந்த மதிப்பீடு அல்லது உறுதியுடன் அவரது அறிக்கை ஒத்திருந்ததைக் குறிக்கிறது; இது நேர்மை அல்லது முழு மனதுடைமை என்ற விரிவான விளக்கத்தை உரையில் சேர்க்கவில்லை.
lexical_decisions:
- source_word: בֶּן אַרְבָּעִים שָׁנָה
  choice: எனக்கு நாற்பது வயது
  rationale: எபிரெய வயதுக் கூறுமுறையை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: בִּשְׁלֹחַ
  choice: அனுப்பியபோது
  rationale: ב முன்னொட்டுடன் வரும் infinitive construct காலச் சூழலைக் குறிக்கிறது.
- source_word: עֶבֶד יְהוָה
  choice: யெகோவாவின் ஊழியரான
  rationale: மோசேயின் மரியாதைக்குரிய அதிகாரப்பூர்வ பட்டத்தைத் தமிழில் இயல்பாகப் பாதுகாக்கிறது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: திருநாமத்தை ஒரு பட்டமாக மாற்றாமல் தமிழ் வேதாகம வழக்கில் அறியப்பட்ட ஒலிபெயர்ப்பால் தருகிறது.
- source_word: מִקָּדֵשׁ בַּרְנֵעַ
  choice: காதேஸ்-பர்னேயாவிலிருந்து
  rationale: கூட்டுப் புவிப்பெயரைத் தமிழ் ஒலிபெயர்ப்பில் தருகிறது.
- source_word: לְרַגֵּל
  choice: வேவுபார்க்க
  rationale: நிலத்தை இரகசியமாக ஆராயும் உளவு/கண்காணிப்பு நோக்கைச் சுருக்கமாக வெளிப்படுத்துகிறது.
- source_word: הָאָרֶץ
  choice: இந்த நாட்டை
  rationale: சூழலில் காலேப் பேசும் குறிப்பிட்ட நிலப்பகுதியை இயல்பான தமிழில் சுட்டுகிறது; 'நாடு' என்பது நிலமும் பிரதேசமும் ஆகிய பொருள்களை ஏற்கிறது.
- source_word: וָאָשֵׁב אֹתוֹ דָּבָר
  choice: நான் அவரிடம் செய்தி கொண்டுவந்தேன்
  rationale: சொல்லைத் திரும்பக் கொண்டுவருதல் என்ற எபிரெய மொழிமரபை, அறிக்கையுடன் திரும்பிய செயலைக் குறிக்கும் இயல்பான தமிழாகத் தருகிறது.
- source_word: כַּאֲשֶׁר עִם לְבָבִי
  choice: என் உள்ளத்தில் இருந்தபடியே
  rationale: உள்ளார்ந்த எண்ணம் அல்லது உறுதியுடன் செய்தி ஒத்திருந்தது என்ற பொருளை, நேர்மை என மிகையாக விளக்காமல் பாதுகாக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற திருநாமத்தின் மொழிபெயர்ப்பு
  choice: யெகோவா
  alternative: யாவே
  rationale: மூலத்தில் உள்ள தனிப்பட்ட திருநாமத்தை 'கர்த்தர்' போன்ற பட்டமாக மாற்றாமல் பாதுகாக்கிறது; தமிழ் வாசகர்களிடையே பரவலாக அறியப்பட்ட வடிவம் தேர்ந்தெடுக்கப்பட்டது.
- issue: כַּאֲשֶׁר עִם לְבָבִי என்பதன் பொருள்
  choice: என் உள்ளத்தில் இருந்தபடியே
  alternative: என் மனதிற்குத் தோன்றியபடியே
  rationale: காலேபின் உள்ளார்ந்த நம்பிக்கை அல்லது மதிப்பீட்டைத் தெரிவிக்கிறது; 'முழு நேர்மையோடு' போன்ற இறையியல்/ஒழுக்க விளக்கத்தை உரைக்குள் சேர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழ்; மரியாதையும் வாசிப்புத் தெளிவும் கொண்ட நடை. எபிரெய உருவகத்தைப் பாதுகாக்க ‘உள்ளம்’ பயன்படுத்தப்பட்டது; பழமையான வாக்கிய அமைப்பு தவிர்க்கப்பட்டது.
