  text: וַ/יִּגְּשׁ֨וּ בְנֵֽי יְהוּדָ֤ה אֶל יְהוֹשֻׁ֨עַ֙ בַּ/גִּלְגָּ֔ל וַ/יֹּ֣אמֶר אֵלָ֔י/ו כָּלֵ֥ב בֶּן יְפֻנֶּ֖ה הַ/קְּנִזִּ֑י אַתָּ֣ה יָדַ֡עְתָּ אֶֽת הַ/דָּבָר֩ אֲשֶׁר דִּבֶּ֨ר יְהוָ֜ה אֶל מֹשֶׁ֣ה אִישׁ הָ/אֱלֹהִ֗ים עַ֧ל אֹדוֹתַ֛/י וְ/עַ֥ל אֹדוֹתֶ֖י/ךָ בְּ/קָדֵ֥שׁ בַּרְנֵֽעַ־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/014/006.yaml
  text: Then the sons of Judah came near to Joshua at Gilgal[a], and Caleb son of Jephunneh the Kenizzite said to him, “You know the word that Yahweh spoke to Moses the man of God concerning me and concerning you at Kadesh-barnea.”
translation:
  language: ta
  text: அப்போது யூதாவின் மகன்கள் கில்காலில் யோசுவாவிடம் நெருங்கி வந்தார்கள். கெனிசியனான யெப்புன்னேயின் மகன் காலேப் அவரிடம், “காதேஸ்-பர்னேயாவில் என்னைக் குறித்தும் உம்மைக் குறித்தும் கடவுளின் மனிதரான மோசேயிடம் யாவே உரைத்த வார்த்தையை[a] நீர் அறிவீர்” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது “காரியத்தை” அல்லது “விஷயத்தை.”
    reason: எபிரெய הַדָּבָר என்பதற்கு இச்சூழலில் ‘வார்த்தை’ என்பதோடு ‘காரியம்’ அல்லது ‘விஷயம்’ என்றும் பொருள் கொள்ளலாம்.
lexical_decisions:
- source_word: וַיִּגְּשׁוּ
  choice: நெருங்கி வந்தார்கள்
  rationale: נגשׁ என்பதன் அணுகுதல் அல்லது அருகே வருதல் என்ற இயக்கத்தை இயல்பான தமிழ் நடையில் காக்கிறது.
- source_word: בְנֵי יְהוּדָה
  choice: யூதாவின் மகன்கள்
  rationale: சொல்லாட்சியில் உள்ள குடும்ப/கோத்திர அடையாளத்தையும் ஆண்பால் பன்மையையும் பொதுவான ‘மக்கள்’ என்று சமப்படுத்தாமல் தக்கவைக்கிறது.
- source_word: בַּגִּלְגָּל
  choice: கில்காலில்
  rationale: இடப்பெயருக்குரிய இயல்பான தமிழ் இடவேற்றுமை வடிவம்.
- source_word: כָּלֵב בֶּן יְפֻנֶּה הַקְּנִזִּי
  choice: கெனிசியனான எப்புன்னேயின் மகன் காலேப்
  rationale: பெயர்களையும் குல அடையாளத்தையும் தக்கவைத்து, தமிழில் தெளிவான உறவுமுறை வரிசையில் வழங்குகிறது.
- source_word: אַתָּה יָדַעְתָּ
  choice: நீர் அறிவீர்
  rationale: எபிரெய நிறைவுவினை இங்கு தற்போதைய அறிவுநிலையைக் குறிக்கிறது; காலேப் யோசுவாவிடம் பேசுவதற்கேற்ற மரியாதை ஒருமை பயன்படுத்தப்படுகிறது.
- source_word: הַדָּבָר
  choice: வார்த்தையை
  rationale: דבר என்பதற்கு ‘வார்த்தை’, ‘காரியம்’, ‘விஷயம்’ எனப் பல பொருள்கள் உண்டு; இங்கு குறிப்பிட்ட இறை உரையைச் சுட்டுவதால் ‘வார்த்தை’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: דִּבֶּר יְהוָה
  choice: யாவே உரைத்த
  rationale: דבר என்பதன் பேசுதல் என்ற பொருளையும், செய்பவராக இறைநாமத்தையும் நேரடியாகக் காக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: יהוה என்ற தனிப்பட்ட இறைநாமத்தை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் பரவலாக அறியப்படும் ஒலிபெயர்ப்பு வடிவில் தருகிறது.
- source_word: מֹשֶׁה אִישׁ הָאֱלֹהִים
  choice: கடவுளின் மனிதரான மோசே
  rationale: ‘கடவுளின் மனிதர்’ என்ற வேதாகமப் பட்டத்தை விளக்கவுரையாக்காமல் தக்கவைக்கிறது.
- source_word: עַל אֹדוֹתַי וְעַל אֹדוֹתֶיךָ
  choice: என்னைக் குறித்தும் உம்மைக் குறித்தும்
  rationale: இருமுறை வரும் எபிரெய தொடர்புச் சொற்றொடரின் இணை அமைப்பை தமிழிலும் காக்கிறது.
- source_word: בְּקָדֵשׁ בַּרְנֵעַ
  choice: காதேஸ்-பர்னேயாவில்
  rationale: இடப்பெயரை ஒலிபெயர்த்து, நிகழ்வு நடந்த இடத்தைக் குறிக்கும் இயல்பான தமிழ் வடிவில் தருகிறது.
theological_decisions:
- issue: יהוה என்ற இறைநாமத்தின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: ஆண்டவர்; யெகோவா
  rationale: மூலத்தில் தனிப்பட்ட உடன்படிக்கைப் பெயர் நேரடியாக இருப்பதால் அதை ஒரு பட்டமாக மாற்றாமல் ஒலிபெயர்க்கிறது; ‘யெகோவா’ என்பதற்குப் பதில் ‘Yahweh’ என்பதற்கு நெருக்கமான தமிழ் வடிவம் தேர்ந்தெடுக்கப்பட்டது.
- issue: בְנֵי יְהוּדָה என்ற பாலினம் குறிக்கப்பட்ட கோத்திரச் சொற்றொடர்
  choice: யூதாவின் மகன்கள்
  alternative: யூதா கோத்திரத்தார்; யூதாவின் மக்கள்
  rationale: எபிரெய உரையின் ஆண்பால் பன்மையையும் குடும்ப/கோத்திர உருவகத்தையும் தெளிவாகத் தக்கவைக்கிறது.
- issue: אִישׁ הָאֱלֹהִים என்ற பட்டம்
  choice: கடவுளின் மனிதர்
  alternative: இறைமனிதர்; கடவுளுக்குரிய மனிதர்
  rationale: மோசேக்கு வழங்கப்பட்ட முறையான வேதாகமப் பட்டத்தை அதன் சுருக்கமும் இறையியல் திறனும் குலையாமல் நேரடியாக வழங்குகிறது.
translation_notes:
  register: நவீன, மரியாதையான, பொதுவாசகர்களுக்குப் புரியும் தமிழ் பயன்படுத்தப்பட்டது. யோசுவாவை நோக்கிய ஒருமை உரையில் ‘நீர்/உம்மை’ என்ற மரியாதை வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன; இடப்பெயர்களும் ஆள்பெயர்களும் மூல ஒலியமைப்பை அணுகும் வகையில் ஒலிபெயர்க்கப்பட்டுள்ளன.
