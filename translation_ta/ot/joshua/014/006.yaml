  source_fidelity: 'மூல எபிரெய வாக்கியத்தின் அடிப்படை அர்த்தமும் வரிசையும் சரியாகக் காக்கப்பட்டுள்ளன: யூதாவின் மகன்கள் யோசுவாவை அணுகினர்; கெனிசியனான காலேப் பேசுகிறார்; யாவே மோசேயிடம் கூறிய குறிப்பிட்ட வார்த்தையை யோசுவா அறிவார். ஆனால் ஆள்பெயர் ஒலிபெயர்ப்பான “எப்புன்னே” என்பதற்குப் பதில், எபிரெய יְפֻנֶּה-க்கு நெருக்கமாகவும் தமிழில் நிலைபெற்றதாகவும் உள்ள “யெப்புன்னே” பயன்படுத்தப்பட வேண்டும். அடிக்குறிப்பும் ‘வார்த்தை’ என்ற சொல்லுக்கான மாற்றுகளையே நேரடியாகக் குறிக்குமாறு தெளிவாக்கப்படுகிறது.'
