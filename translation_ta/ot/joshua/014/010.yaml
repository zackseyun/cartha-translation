  text: וְ/עַתָּ֗ה הִנֵּה֩ הֶחֱיָ֨ה יְהוָ֣ה אוֹתִ/י֮ כַּ/אֲשֶׁ֣ר דִּבֵּר֒ זֶה֩ אַרְבָּעִ֨ים וְ/חָמֵ֜שׁ שָׁנָ֗ה מֵ֠/אָז דִּבֶּ֨ר יְהוָ֜ה אֶת הַ/דָּבָ֤ר הַ/זֶּה֙ אֶל מֹשֶׁ֔ה אֲשֶׁר הָלַ֥ךְ יִשְׂרָאֵ֖ל בַּ/מִּדְבָּ֑ר וְ/עַתָּה֙ הִנֵּ֣ה אָנֹכִ֣י הַ/יּ֔וֹם בֶּן חָמֵ֥שׁ וּ/שְׁמוֹנִ֖ים שָׁנָֽה׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/014/010.yaml
  text: And now[a], behold, Yahweh has kept me alive, just as he said, these forty-five years since Yahweh spoke this word to Moses while Israel walked in the wilderness. And now, behold[c][b], today I am eighty-five years old.
translation:
  language: ta
  text: இப்போது, இதோ, யாவே தாம் சொன்னபடியே, இஸ்ரவேல் வனாந்தரத்தில் நடந்துகொண்டிருந்தபோது[c] யாவே மோசேயிடம் இந்த வார்த்தையை[b] சொன்னதிலிருந்து, இந்த நாற்பத்தைந்து ஆண்டுகளாக என்னை உயிரோடு வைத்திருக்கிறார்[a]. இப்போது, இதோ, இன்று எனக்கு எண்பத்தைந்து வயது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘என் உயிரைக் காத்திருக்கிறார்.’
    reason: lexical_alternative
  - marker: b
    text: ‘இந்த வார்த்தை’ என்பதை ‘இந்தக் காரியம்’ என்றும், சற்று விளக்கமாக ‘இந்த வாக்குறுதி’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, ‘இஸ்ரவேல் வனாந்தரத்தில் பயணம் செய்துகொண்டிருந்தபோது.’
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶחֱיָה
  choice: உயிரோடு வைத்திருக்கிறார்
  rationale: חיה என்பதன் ஹிஃபில் வடிவம் இங்கு காலேபின் உயிரை ஆண்டுகளெங்கும் நிலைத்திருக்கச் செய்ததைக் குறிக்கிறது. ‘உயிரோடு வைத்திருக்கிறார்’ என்பது அந்தப் பாதுகாத்தல் சார்ந்த காரணவினைப் பொருளை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய மூலத்தில் வரும் இறைத் திருப்பெயரை ஒரு பட்டப்பெயராக மாற்றாமல், தமிழில் ஒலிபெயர்த்து வழங்குகிறது.
- source_word: כַּאֲשֶׁר דִּבֵּר
  choice: தாம் சொன்னபடியே
  rationale: முன்பு கூறப்பட்ட இறைவார்த்தை இப்போது நிறைவேறியிருப்பதைக் காட்டுகிறது; ‘வாக்குறுதி அளித்தபடியே’ என்று விளக்கமாக்காமல், דִּבֵּר என்பதன் ‘சொன்னார்’ என்ற அடிப்படைப் பொருளைப் பேணுகிறது.
- source_word: זֶה אַרְבָּעִים וְחָמֵשׁ שָׁנָה
  choice: நாற்பத்தைந்து ஆண்டுகள் ஆகிவிட்டன
  rationale: கடந்த காலத்தின் தொடக்கத்திலிருந்து நிகழ்காலம்வரை நீளும் காலப்பகுதியை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: הַדָּבָר הַזֶּה
  choice: இந்த வார்த்தையை
  rationale: דבר என்பதன் ‘வார்த்தை/காரியம்’ என்ற பொருள் விரிவைச் சுருக்காமல், இங்கு யாவே கூறிய குறிப்பிட்ட உரையைக் குறிக்க ‘இந்த வார்த்தை’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: אֲשֶׁר הָלַךְ יִשְׂרָאֵל בַּמִּדְבָּר
  choice: இஸ்ரவேல் வனாந்தரத்தில் நடந்துகொண்டிருந்தபோது
  rationale: הלך என்பதன் நடந்து செல்லுதல் என்ற படிமத்தையும், அந்தக் காலத்தில் நிகழ்ந்த செயலைக் குறிக்கும் சூழலையும் பேணுகிறது.
- source_word: הִנֵּה
  choice: இதோ
  rationale: கவனத்தை ஈர்த்து வலியுறுத்தும் எபிரெய இடைச்சொல்லுக்கு இயல்பான, கண்ணியமான தமிழ் இணை.
- source_word: בֶּן חָמֵשׁ וּשְׁמוֹנִים שָׁנָה
  choice: எனக்கு எண்பத்தைந்து வயது
  rationale: ‘எண்பத்தைந்து ஆண்டுகளின் மகன்’ என்ற எபிரெய வயதுக் கூறுமுறையை இயல்பான தமிழில் தருகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைத் திருப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூல உரையில் தனிப்பட்ட இறைத் திருப்பெயர் நேரடியாக இருப்பதால், அதை ஒரு பட்டப்பெயரால் மாற்றாமல் ஒலிபெயர்ப்பது மூலத்தின் வேறுபாட்டைப் பேணுகிறது.
- issue: הַדָּבָר הַזֶּה என்பதன் தன்மை
  choice: இந்த வார்த்தை
  alternative: இந்த வாக்குறுதி
  rationale: சூழலில் அது வாக்குறுதிசார் கூற்றாக இருந்தாலும், דבר தானாகவே ‘வாக்குறுதி’ என்று மட்டும் பொருள்படுவதில்லை. ஆகவே விளக்கத்தை முதன்மை உரையில் திணிக்காமல் நெகிழ்வைத் தக்கவைக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டுள்ளது. ‘இதோ’ என்ற மறுமொழி மூலத்தின் இருமுறை வலியுறுத்தலைப் பேணுகிறது. நீண்ட எபிரெய வாக்கியம் தமிழில் தெளிவுக்காக இரண்டு வாக்கியங்களாகப் பிரிக்கப்பட்டாலும், காலத் தொடர்பும் கருத்து வரிசையும் காக்கப்பட்டுள்ளன.
