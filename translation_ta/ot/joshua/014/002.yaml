  text: בְּ/גוֹרַ֖ל נַחֲלָתָ֑/ם כַּ/אֲשֶׁ֨ר צִוָּ֤ה יְהוָה֙ בְּ/יַד מֹשֶׁ֔ה לְ/תִשְׁעַ֥ת הַ/מַּטּ֖וֹת וַ/חֲצִ֥י הַ/מַּטֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/014/002.yaml
  text: Their inheritance was by lot[a], as Yahweh had commanded through Moses, for the nine tribes and the half-tribe.
translation:
  language: ta
  text: யாவே மோசேயின் மூலம் கட்டளையிட்டபடியே, ஒன்பது கோத்திரங்களுக்கும் அரைக் கோத்திரத்துக்கும் அவர்களுடைய சுதந்தரப் பங்கு சீட்டுப்போட்டு ஒதுக்கப்பட்டது.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּגוֹרָל
  choice: சீட்டுப்போட்டு
  rationale: בְּ குறிக்கும் வழிமுறைப் பொருளையும் גּוֹרָל குறிக்கும் சீட்டுக் குலுக்கல் மூலம் தீர்மானிக்கும் நடைமுறையையும் இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: נַחֲלָתָם
  choice: அவர்களுடைய உரிமைப்பங்கு
  rationale: நிலம் உடன்படிக்கையின்படி சுதந்தரமாகவும் பங்காகவும் வழங்கப்படுவதைத் தெளிவாகக் காட்டுகிறது; வெறும் ‘சொத்து’ என்ற பொதுப்பொருளைத் தவிர்க்கிறது.
- source_word: כַּאֲשֶׁר צִוָּה
  choice: கட்டளையிட்டபடியே
  rationale: முன்னர் கொடுக்கப்பட்ட கட்டளைக்கும் இப்போது செய்யப்பட்ட பங்கீட்டுக்கும் உள்ள நேரடியான ஒத்திசைவைச் சுருக்கமாகப் பாதுகாக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெயத் தெய்வீகப் பெயரான יהוה-வை ஒரு பட்டப்பெயரால் மாற்றாமல், தமிழில் அறியத்தக்க ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: בְּיַד מֹשֶׁה
  choice: மோசேயின் மூலம்
  rationale: சொல்லுக்குச் சொல் ‘மோசேயின் கையால்’ என்பதற்குப் பதிலாக, எபிரெய மரபுத்தொடர் குறிக்கும் இடைமுகம் அல்லது பிரதிநிதித்துவத்தை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: לְתִשְׁעַת הַמַּטּוֹת וַחֲצִי הַמַּטֶּה
  choice: ஒன்பது கோத்திரங்களுக்கும் அரைக் கோத்திரத்துக்கும்
  rationale: לְ குறிக்கும் பெறுநர்களையும், மַטֶּה என்பதன் இச்சூழலுக்குரிய ‘கோத்திரம்’ என்ற பொருளையும் தெளிவாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: יהוה என்ற தெய்வீகப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூலத்தில் நேரடியாக வரும் உடன்படிக்கைப் பெயரைப் பட்டப்பெயராக மாற்றாமல் ஒலிபெயர்த்து, உரையின் தனிப்பெயர் தன்மையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டது. எபிரெயச் சொற்றொடரின் சுருக்கத்தைப் பாதுகாத்தபடியே, தமிழில் முழுமையான வாக்கியமாக இயல்பாக வாசிக்க ‘ஒதுக்கப்பட்டது’ பயன்படுத்தப்பட்டது.
