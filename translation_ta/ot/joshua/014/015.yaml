  to: எப்ரோனின் முந்தைய பெயர் கீரியாத்-அர்பா[a]. அர்பா ஏனாக்கியரிடையே மிகச் சிறந்த மனிதனாக இருந்தான்[b]. நாடு போரிலிருந்து அமைதியாக இருந்தது[c].
  rationale: திருத்தம் இரண்டு இடங்களில் மட்டுமே செய்யப்படுகிறது. அர்பாவைப் பற்றிய எபிரெயச் சொற்றொடரின் மதிப்பீட்டு/முக்கியத்துவப் பொருளைத் தமிழில் உடல் அளவாகக் குறுகச் செய்யாமல் 'மிகச் சிறந்த மனிதன்' என வழங்கியுள்ளோம். நாட்டைப் பற்றிய வினைச்சொல்லின் அமைதி, இடையூறின்மை என்ற பொருளை 'அமைதியாக இருந்தது' எனத் தெளிவாக்கியுள்ளோம். அடிக்குறிப்புகள் பெயரின் சாத்தியமான பொருள், அர்பாவைப் பற்றிய மாற்று நுணுக்கம், மற்றும் இறுதி வினைச்சொல்லின் மாற்று மொழிபெயர்ப்பு ஆகியவற்றுக்கான சரியான குறியீடுகளுடன் காக்கப்பட்டுள்ளன.
