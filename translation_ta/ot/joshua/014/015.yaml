base_translation:
  language: en
  yaml_path: translation/ot/joshua/014/015.yaml
  text: The former name of Hebron was Kiriath-arba[a]; Arba was the greatest man among the Anakim[c][b]. And the land had rest from war.
translation:
  language: ta
  text: எப்ரோனின் முந்தைய பெயர் கீரியாத்-அர்பா[a]. அர்பா ஏனாக்கியரிடையே மிகச் சிறந்த மனிதனாக இருந்தான்[b]. நாடு போரிலிருந்து அமைதியாக இருந்தது[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “கீரியாத்-அர்பா” என்பதற்கு “அர்பாவின் நகரம்” என்று பொருள் இருக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “ஏனாக்கியரிடையே பெரிய மனிதன்.” எபிரெயச் சொற்றொடர் அர்பாவை ஏனாக்கியரோடு தொடர்புடைய மிக முக்கியமான நபராகக் குறிக்கலாம்.
    reason: alternative_reading
  - marker: c
    text: அல்லது, “நாடு போரிலிருந்து ஓய்வடைந்தது.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/שֵׁם חֶבְרוֹן לְ/פָנִים
  choice: எப்ரோனின் முந்தைய பெயர்
  rationale: שֵׁם என்பது ‘பெயர்’; לְפָנִים என்பது ‘முன்பு/முந்தைய’ என்று பொருள். தமிழில் இயல்பாகப் பெயர்ச்சொல் தொடராக வழங்கப்பட்டது. தொடக்க வாவுக்கு தனியாக ‘மேலும்’ சேர்ப்பது இங்கு தேவையில்லை.
- source_word: קִרְיַת אַרְבַּע
  choice: கீரியாத்-அர்பா
  rationale: இது இடப்பெயர் என்பதால் பொருளாக்காமல் ஒலிபெயர்க்கப்பட்டது; அதன் சாத்தியமான பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: הָ/אָדָם הַ/גָּד֛וֹל בָּ/עֲנָקִ֖ים ה֑וּא
  choice: அர்பா, ஏனாக்கியரிடையே மிகப் பெரிய மனிதனாக இருந்தான்
  rationale: הוּא சுட்டும் நபரைத் தமிழில் தெளிவுபடுத்த ‘அர்பா’ மீண்டும் சொல்லப்பட்டது. הַגָּדוֹל இங்கு ஒப்புயர்வையோ தலைசிறந்த நிலையையோ குறிக்கலாம்; முதன்மை உரையில் ‘மிகப் பெரிய’ என்றும் மாற்று நுணுக்கம் அடிக்குறிப்பிலும் வைக்கப்பட்டது.
- source_word: וְ/הָ/אָ֥רֶץ שָׁקְטָ֖ה מִ/מִּלְחָמָֽה
  choice: நாடு போரிலிருந்து ஓய்ந்திருந்தது
  rationale: שׁקט என்பது அமைதியாக அல்லது தொந்தரவின்றி இருத்தல்; מלחמה-விலிருந்து என்ற பிரிவுப் பொருளை ‘போரிலிருந்து’ காக்கிறது. நிகழ்வுக்கு முன்பே ஏற்பட்டிருந்த நிலையைத் தமிழில் ‘ஓய்ந்திருந்தது’ இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: அர்பாவின் மேன்மையை הַגָּדוֹל எவ்வாறு குறிக்கிறது
  choice: மிகப் பெரிய மனிதன்
  alternative: ஏனாக்கியரிடையே தலைசிறந்த மனிதன் / பெரிய மனிதன்
  rationale: எபிரெயச் சொற்றொடர் அர்பாவின் உயர்ந்த அல்லது முதன்மையான நிலையைக் குறிக்கிறது; அது உடல் அளவை மட்டுமே குறிக்கிறது என்று தீர்மானிக்காமல், பரந்த பொருளை முதன்மை உரையும் அடிக்குறிப்பும் காக்கின்றன.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் மொழிபெயர்க்கப்பட்டது. இடப்பெயர்களும் இனப்பெயரும் தமிழில் வாசிக்க ஏற்றவாறு ஒலிபெயர்க்கப்பட்டன; மூலத்தின் பொருள் நுணுக்கங்கள் அடிக்குறிப்புகளில் காக்கப்பட்டன.
