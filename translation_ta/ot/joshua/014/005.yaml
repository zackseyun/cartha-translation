source:
  edition: WLC
  text: כַּ/אֲשֶׁ֨ר צִוָּ֤ה יְהוָה֙ אֶת מֹשֶׁ֔ה כֵּ֥ן עָשׂ֖וּ בְּנֵ֣י יִשְׂרָאֵ֑ל וַֽ/יַּחְלְק֖וּ אֶת הָ/אָֽרֶץ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/014/005.yaml
  text: Just as Yahweh had commanded Moses[a], so the sons of Israel did, and they divided the land.
translation:
  language: ta
  text: யாவே மோசேக்குக் கட்டளையிட்டபடியே, இஸ்ரவேல் மக்கள்[a] செய்தார்கள்; அவர்கள் நாட்டைப் பங்கிட்டார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொற்சொல்லாக, ‘இஸ்ரவேலின் மகன்கள்’; இது இஸ்ரவேல் மக்களைக் கூட்டாகக் குறிக்கும் வழக்கமான மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּאֲשֶׁר ... כֵּן
  choice: '...கட்டளையிட்டபடியே'
  rationale: கட்டளைக்கும் இஸ்ரவேலரின் செயலுக்கும் உள்ள துல்லியமான ஒத்திசைவை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: צִוָּה
  choice: கட்டளையிட்ட
  rationale: ஒருவருக்கு அதிகாரபூர்வமாகக் கட்டளை கொடுப்பதைக் குறிக்கும் வினையின் நேரடியான பொருளைத் தருகிறது; கட்டளை முதலில் கொடுக்கப்பட்டது என்பதும் தொடரமைப்பில் தெளிவாகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைத் திருப்பெயரை ஒரு பட்டத்தால் மாற்றாமல், எபிரெய நான்கெழுத்துப் பெயரின் வழக்கமான தமிழ் ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: אֶת־מֹשֶׁה
  choice: மோசேக்கு
  rationale: צוה என்பதுடன் மோசே கட்டளையைப் பெற்றவர்; தமிழில் நான்காம் வேற்றுமை உருபு இயல்பாக அந்த உறவை வெளிப்படுத்துகிறது.
- source_word: עָשׂוּ
  choice: செய்தார்கள்
  rationale: மூலத்தின் எளிய, பொருள் வெளிப்படையாகச் சொல்லப்படாத ‘செய்’ என்ற வினையைப் பாதுகாக்கிறது.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்கள்
  rationale: இது இஸ்ரவேல் சமூகத்தைக் கூட்டாகக் குறிக்கும் நிலையான எபிரெய மரபுத்தொடர். ‘இஸ்ரவேலின் மகன்கள்’ என்ற சொற்சொல் மொழிபெயர்ப்பு நவீனத் தமிழில் ஆண்களை மட்டும் குறிப்பதாகத் தவறாகப் புரியக்கூடும்; மூலவடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: וַיַּחְלְקוּ
  choice: பங்கிட்டார்கள்
  rationale: நாட்டை உரிய பங்குகளாகப் பிரித்தளிக்கும் சூழலை ‘பங்கிடு’ துல்லியமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: הָאָרֶץ
  choice: நாடு
  rationale: இச்சூழலில் உலகம் அல்லது பொதுவான நிலப்பரப்பு அல்லாமல், இஸ்ரவேலருக்குப் பங்கிடப்பட்ட கானான் நாட்டைக் குறிக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைத் திருப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலத்தில் பட்டமல்ல, இறைத் திருப்பெயரே உள்ளது. ஆகவே பட்டத்தால் மாற்றாமல் தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளது.
- issue: בְּנֵי יִשְׂרָאֵל என்ற கூட்டுப்பெயரை மொழிபெயர்த்தல்
  choice: இஸ்ரவேல் மக்கள்
  alternative: இஸ்ரவேலின் மகன்கள்
  rationale: எபிரெய ஆண்பால் பன்மை வடிவம் இங்கு முழு இஸ்ரவேல் சமூகத்தையும் குறிக்கிறது. நவீனத் தமிழில் ‘மக்கள்’ அந்தக் கூட்டுப்பொருளைத் தெளிவாகத் தருகிறது; சொற்சொல் வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையும் கண்ணியமும் காக்கப்பட்டுள்ளன. ‘கட்டளையிட்டபடியே ... செய்தார்கள்’ என்பது மூலத்தின் ஒப்புமை அமைப்பைப் பாதுகாக்கிறது; ‘பங்கிட்டார்கள்’ என்பது யோசுவா நூலின் நிலப்பங்கீட்டுச் சூழலுக்கு இயல்பானது.
