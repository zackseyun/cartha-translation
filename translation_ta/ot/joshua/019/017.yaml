revisions:
- from: இசக்காருக்கு நான்காவது சீட்டு வந்தது; அது இசக்காரின் மகன்களுக்கு[a], அவர்களுடைய குலங்களின்படி ஒதுக்கப்பட்டது.
  to: இசக்காருக்கு நான்காவது சீட்டு வந்தது; இசக்காரின் மகன்களுக்கு, அவர்களுடைய குலங்களின்படி, அது வந்தது.
  rationale: The revision removes the unsupported explicit verb ‘was allotted’ and retains both Hebrew recipient phrases. Repeating “அது வந்தது” gives the final Tamil clause a complete and natural predicate without changing the source meaning. The footnote’s alternative is adjusted to the inclusive and idiomatic ‘வழித்தோன்றல்களுக்கு,’ while preserving the literal wording in its explanation.
