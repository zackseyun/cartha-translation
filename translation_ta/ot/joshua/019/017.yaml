base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/017.yaml
  text: For Issachar[a], the fourth lot came out[b], for the sons of Issachar according to their clans.
translation:
  language: ta
  text: இசக்காருக்கு நான்காவது சீட்டு வந்தது; இசக்காரின் மகன்களுக்கு, அவர்களுடைய குலங்களின்படி, அது வந்தது.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְיִשָּׂשכָר
  choice: இசக்காருக்கு
  rationale: முன்னொட்டு לְ, பங்கீட்டில் சீட்டு எந்தக் கோத்திரத்துக்குரியது என்பதைக் குறிக்கிறது; தமிழில் ‘இசக்காருக்கு’ இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: יָצָא הַגּוֹרָל הָרְבִיעִי
  choice: நான்காவது சீட்டு வந்தது
  rationale: יָצָא என்பதன் ‘வெளிவந்தது/வந்தது’ என்ற உருவகத்தைச் சீட்டெடுக்கும் சூழலில் பாதுகாக்கிறது; ‘விழுந்தது’ என்ற விளக்கமான வழக்கைத் தவிர்க்கிறது.
- source_word: לִבְנֵי יִשָּׂשכָר
  choice: இசக்காரின் மகன்களுக்கு
  rationale: בְּנֵי என்பதன் நேரடியான ‘மகன்கள்’ என்ற கோத்திர வம்ச மொழியைப் பாதுகாக்கிறது; இது இசக்காரின் வழிவந்த மக்களைக் குறிக்கிறது என்பதை அடிக்குறிப்பு தெளிவுபடுத்துகிறது.
- source_word: לְמִשְׁפְּחוֹתָם
  choice: அவர்களுடைய குலங்களின்படி
  rationale: கோத்திரப் பங்கீட்டுச் சூழலில் מִשְׁפָּחוֹת என்பது கோத்திரத்துக்குள் உள்ள குலப் பிரிவுகளைக் குறிக்கிறது; ‘குடும்பங்கள்’ என்பதைவிட ‘குலங்கள்’ இச்சமூக அமைப்பைத் துல்லியமாகக் காட்டுகிறது.
