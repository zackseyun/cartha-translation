base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/051.yaml
  text: These are the inheritances that Eleazar the priest[a], Joshua son of Nun, and the heads of the fathers’ houses of the tribes of the sons of Israel apportioned by lot at Shiloh before Yahweh, at the entrance of the tent of meeting. So they finished dividing the land.
translation:
  language: ta
  text: இவையே சீலோவில், யாவேக்கு முன்பாக, சந்திப்புக் கூடாரத்தின் நுழைவாயிலில், ஆசாரியனாகிய எலெயாசாரும் நூனின் மகன் யோசுவாவும் இஸ்ரவேல் மக்களின் கோத்திரங்களுக்குரிய தந்தைவழிக் குடும்பத் தலைவர்களும் சீட்டினால் பங்கிட்டுக் கொடுத்த சுதந்தரப் பங்குகள். இவ்வாறு அவர்கள் நிலத்தைப் பங்கிடுவதை முடித்தார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַנְּחָלֹת
  choice: உரிமைச் சொத்துகள்
  rationale: நַחֲלָה என்பது பரம்பரை உரிமையாகப் பெறப்படும் உடைமையையும் ஒதுக்கப்பட்ட நிலப்பங்கையும் குறிக்கிறது; இங்கு கோத்திரங்களுக்கு வழங்கப்பட்ட நிலப்பங்குகளின் உரிமைத் தன்மையை இச்சொல் காக்கிறது.
- source_word: נִחֲלוּ
  choice: பங்கிட்டுக் கொடுத்த
  rationale: இச்சூழலில் நில உரிமைப் பங்குகளை நிர்வாக ரீதியாக ஒதுக்கிக் கொடுத்த செயலை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: אֶלְעָזָר הַכֹּהֵן
  choice: ஆசாரியனாகிய எலெயாசார்
  rationale: பெயருடன் வரும் பதவிப் பெயரைத் தெளிவாகவும் வழக்கமான வேதாகமத் தமிழிலும் தருகிறது.
- source_word: וְרָאשֵׁי הָאָבוֹת לְמַטּוֹת בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்களின் கோத்திரங்களுக்குரிய தந்தைவழிக் குடும்பத் தலைவர்கள்
  rationale: אָבוֹת என்பது இங்கு மூதாதையர் வழிக் குடும்ப அமைப்புகளைக் குறிக்கிறது; சொற்சொல்லான, தெளிவில்லாத வடிவைத் தவிர்த்து சமூக அமைப்பை வெளிப்படுத்துகிறது. בְּנֵי יִשְׂרָאֵל என்ற மரபுச் சொற்றொடர் இயல்பான உள்ளடக்கப் பொருளில் ‘இஸ்ரவேல் மக்கள்’ என வழங்கப்படுகிறது.
- source_word: בְּגוֹרָל
  choice: திருவுளச்சீட்டுப் போட்டு
  rationale: சீட்டுப் போட்டு இறைத் தீர்மானத்தை அறிந்து பங்கிடும் நடைமுறையை நவீன வாசகருக்குத் தெளிவாக்குகிறது; வெறும் ‘சீட்டு’ என்பதால் ஏற்படும் சாதாரணக் குலுக்கல் அல்லது அதிர்ஷ்டச்சீட்டு என்ற தவறான எண்ணத்தைத் தவிர்க்கிறது.
- source_word: בְּשִׁלֹה
  choice: சீலோவில்
  rationale: பெயரிடப்பட்ட இடத்தில் நிகழ்ந்த செயலை இயல்பான தமிழ் இடவேற்றுமையால் தருகிறது.
- source_word: לִפְנֵי יְהוָה
  choice: யெகோவாவின் முன்னிலையில்
  rationale: לִפְנֵי என்பதன் சந்நிதி/முன்னிலைப் பொருளை காக்கிறது; יהוה என்ற தனிப்பெயரைத் தமிழில் நிலைபெற்ற ‘யெகோவா’ என ஒலிபெயர்க்கிறது.
- source_word: פֶּתַח אֹהֶל מוֹעֵד
  choice: சந்திப்புக் கூடாரத்தின் நுழைவாயிலருகே
  rationale: פֶּתַח என்பது நுழைவாயில் அல்லது திறப்பிடத்தைக் குறிக்கிறது; אֹהֶל מוֹעֵד என்பது இறைச் சந்திப்புக்குரிய கூடாரம் என்பதைக் காட்டுகிறது.
- source_word: וַיְכַלּוּ מֵחַלֵּק אֶת הָאָרֶץ
  choice: இவ்வாறு அவர்கள் நாட்டைப் பங்கிடுவதை முடித்தார்கள்
  rationale: தொடர்கதை முடிவையும் நிலப் பிரிவினை நிறைவு பெற்றதையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரின் மொழிபெயர்ப்பு
  choice: யெகோவா
  alternative: யாவே
  rationale: மூலத்தில் பொதுப்பட்டப் பெயர் அல்ல, நான்கெழுத்து இறைத் தனிப்பெயரே உள்ளது. அதை மறைக்காமல் தமிழில் பரவலாக அறியப்படும் ஒலிவடிவமான ‘யெகோவா’ என வழங்கப்பட்டுள்ளது; ‘யாவே’ என்பது மற்றொரு சாத்தியமான ஒலிப்புமுறை.
- issue: בְּנֵי יִשְׂרָאֵל என்ற பிரதிநிதித்துவ ஆண்பால் மரபுத்தொடர்
  choice: இஸ்ரவேல் மக்கள்
  alternative: இஸ்ரவேலின் மகன்கள்
  rationale: இச்சூழலில் முழு உடன்படிக்கைச் சமூகத்தின் கோத்திரங்களே குறிக்கப்படுகின்றன. தமிழில் ‘இஸ்ரவேலின் மகன்கள்’ என்று சொற்சொல்லாக வழங்குவது ஆண் சந்ததியினரை மட்டும் குறிக்கும் தவறான எண்ணத்தை உருவாக்கலாம்; ‘இஸ்ரவேல் மக்கள்’ உள்ளடக்கப் பொருளைத் துல்லியமாகத் தருகிறது.
- issue: בְּגוֹרָל என்பதில் இறை வழிநடத்தல் உள்ளதா
  choice: திருவுளச்சீட்டுப் போட்டு
  alternative: சீட்டுப் போட்டு
  rationale: செயல் யெகோவாவின் முன்னிலையில் நடைபெறுவதால் இது வெறும் தற்செயல் முறையல்ல என்பதைச் சூழல் உணர்த்துகிறது. எனினும் தனிப்பட்ட முடிவின் உள்ளடக்கத்தை வசனம் விளக்காததால் அதற்கு மேல் இறையியல் விவரம் சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீன தரமான தமிழ்; மதிப்பும் தெளிவும் கொண்ட உரைநடை. நீண்ட எபிரெயப் பெயர்ச்சொல் தொடரைத் தமிழின் இயல்பான வரிசைக்கு மாற்றியுள்ளோம். ‘உரிமைச் சொத்துகள்’, ‘தந்தைவழிக் குடும்பத் தலைவர்கள்’ போன்ற சொற்கள் சட்ட/சமூகப் பொருளைத் தக்கவைத்தும் சாதாரண வாசகருக்குப் புரியுமாறும் தேர்ந்தெடுக்கப்பட்டன.
