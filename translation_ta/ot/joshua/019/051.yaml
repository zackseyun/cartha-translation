revisions:
- from: இவையே சீலோவில், யெகோவாவின் முன்னிலையில், சந்திப்புக் கூடாரத்தின் நுழைவாயிலருகே, ஆசாரியனாகிய எலெயாசாரும் நூனின் மகன் யோசுவாவும் இஸ்ரவேல் மக்களின் கோத்திரங்களுக்குரிய தந்தைவழிக் குடும்பத் தலைவர்களும் திருவுளச்சீட்டுப் போட்டு பங்கிட்டுக் கொடுத்த உரிமைச் சொத்துகள். இவ்வாறு அவர்கள் நாட்டைப் பங்கிடுவதை முடித்தார்கள்.
  to: இவையே சீலோவில், யாவேக்கு முன்பாக, சந்திப்புக் கூடாரத்தின் நுழைவாயிலில், ஆசாரியனாகிய எலெயாசாரும் நூனின் மகன் யோசுவாவும் இஸ்ரவேல் மக்களின் கோத்திரங்களுக்குரிய தந்தைவழிக் குடும்பத் தலைவர்களும் சீட்டினால் பங்கிட்டுக் கொடுத்த சுதந்தரப் பங்குகள். இவ்வாறு அவர்கள் நிலத்தைப் பங்கிடுவதை முடித்தார்கள்.
  rationale: The revision removes interpretive expansion concerning the lots, restores the exact locative force of 'at the entrance,' and uses Tamil terms that more specifically fit inherited land allotments. The Hebrew's representative expression בְּנֵי יִשְׂרָאֵל is rendered naturally as «இஸ்ரவேல் மக்கள்», while the clan-based sense of «heads of the fathers' houses» is retained in «தந்தைவழிக் குடும்பத் தலைவர்கள்».
