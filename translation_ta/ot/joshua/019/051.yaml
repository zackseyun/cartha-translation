  revision_rationale: The revision removes interpretive expansion concerning the lots, restores the exact locative force of 'at the entrance,' and uses Tamil terms that more specifically fit inherited land allotments. The Hebrew's representative expression בְּנֵי יִשְׂרָאֵל is rendered naturally as «இஸ்ரவேல் மக்கள்», while the clan-based sense of «heads of the fathers' houses» is retained in «தந்தைவழிக் குடும்பத் தலைவர்கள்».
