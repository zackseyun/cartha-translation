translation:
  language: ta
  text: இதுவே செபுலோன் மக்களுக்கு அவர்களுடைய குலங்களின்படியான உரிமைப் பங்கு—இந்த நகரங்களும் அவற்றின் கிராமங்களும்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: זֹאת
  choice: இதுவே
  rationale: பெண்பால் ஒருமைச் சுட்டுப்பெயர் முன்பு பட்டியலிடப்பட்ட நிலப்பகுதியைச் சுட்டுகிறது. எபிரெயத்தில் வினைச்சொல் இல்லாததால், காலத்தைத் தெளிவுபடுத்தாமல் இயல்பான தமிழில் ‘இதுவே’ என்று தரப்படுகிறது.
- source_word: נַחֲלַת
  choice: உரிமைப் பங்கு
  rationale: நிலப் பங்கீட்டுச் சூழலில், பரம்பரை உரிமையாகக் கிடைத்த பங்கைக் குறிக்கிறது. ‘உரிமைப் பங்கு’ என்பது சட்ட மற்றும் உடன்படிக்கை சார்ந்த நுணுக்கத்தையும் இயல்பான தமிழையும் பேணுகிறது.
- source_word: בְּנֵי זְבוּלֻן
  choice: செபுலோனின் மக்கள்
  rationale: சொல்லுக்குச் சொல் ‘செபுலோனின் மகன்கள்’ என்றாலும், இங்கு முழுக் கோத்திரத்தையும் கூட்டாகக் குறிக்கிறது; தமிழில் ‘மக்கள்’ அந்தக் கூட்டுப்பொருளைத் தெளிவாக வழங்குகிறது.
- source_word: לְמִשְׁפְּחוֹתָם
  choice: அவர்களுடைய குலங்களின்படி
  rationale: לְ முன்னொட்டு இங்கு பகிர்வு அல்லது வகைப்பாட்டைக் குறிக்கிறது; מִשְׁפָּחוֹת கோத்திரத்துக்குள் உள்ள குலப் பிரிவுகளைக் குறிக்கிறது.
- source_word: הֶעָרִים הָאֵלֶּה
  choice: இந்த நகரங்கள்
  rationale: முன்பு பெயரிடப்பட்ட நகரங்களைத் தொகுத்துச் சுட்டும் திட்டவட்டமான சொற்றொடர்.
- source_word: וְחַצְרֵיהֶן
  choice: அவற்றின் கிராமங்களும்
  rationale: חָצֵר இத்தகைய நிலப் பட்டியல்களில் நகரங்களைச் சார்ந்த சிறிய ஊரகக் குடியிருப்புகளைக் குறிக்கிறது; ‘கிராமங்கள்’ தெளிவான நவீனத் தமிழ் இணைச்சொல்.
theological_decisions:
- issue: வினையற்ற சுருக்க வாக்கியத்தின் காலம்
  choice: ‘இதுவே’ என்று காலத்தைத் தீர்மானிக்காமல் மொழிபெயர்த்தல்
  alternative: ‘இதுதான் ... கிடைத்த உரிமைப் பங்காக இருந்தது’ அல்லது ‘இதுதான் ... உரிமைப் பங்கு’
  rationale: மூல எபிரெய வாக்கியத்தில் வெளிப்படையான வினைச்சொல் இல்லை. தமிழில் ‘இதுவே’ என்பது நிகழ்/இறந்த காலத்தின் உண்மையான தெளிவின்மையைப் பேணுகிறது; ‘கிடைத்த’ என்பது உரிமைப் பங்கின் சூழலை இயல்பாக்குகிறது, ஆனால் சுருக்க வாக்கியத்தின் பிரதான காலத்தை நிர்ணயிப்பதில்லை.
translation_notes:
  register: நவீன, மரியாதைமிக்க, பொதுவாசகர்களுக்குப் புரியும் நடை. பட்டியலைத் தொகுக்கும் இறுதி சொற்றொடரைத் தெளிவாக்க நீண்ட கோடு பயன்படுத்தப்பட்டுள்ளது. ‘செபுலோனின் மக்கள்’ என்பது கோத்திரக் கூட்டுப்பொருளை இயல்பாகத் தருகிறது.
