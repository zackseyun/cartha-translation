base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/022.yaml
  text: And the border touched Tabor[a], Shahazumah, and Beth-shemesh[b], and the end of their border was at the Jordan—sixteen cities with their villages.
translation:
  language: ta
  text: அந்த எல்லை தாபோர்[a], ஷஹசூமா, பெத்-ஷெமேஷ் ஆகிய இடங்களைத் தொட்டு, யோர்தானை அடைந்து முடிவடைந்தது[b]. அவற்றின் கிராமங்களோடு சேர்த்து பதினாறு நகரங்கள் இருந்தன.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அடைந்து” அல்லது “சந்தித்து” என்றும் மொழிபெயர்க்கலாம்; எபிரெய வினைச்சொல், ஓர் எல்லைக்கோடு ஓர் இடத்தை அடைவதையோ அதனுடன் இணைவதையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: சொற்படியாக, “அவர்களுடைய எல்லையின் முடிவுகள் யோர்தான்”; இது எல்லையின் இறுதி முனை அல்லது நீட்சியைக் குறிக்கும் எல்லை விவரிப்புச் சொற்றொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפָגַע
  choice: தொட்டு
  rationale: எல்லை விவரிப்புகளில் פגע என்பது ஓர் எல்லைக்கோடு ஓர் இடத்தை அடைந்து அதனுடன் தொடர்புகொள்வதைக் குறிக்கிறது; ‘தொட்டு’ என்பது இடஞ்சார் பொருளை இயல்பாகத் தக்கவைக்கிறது.
- source_word: הַגְּבוּל
  choice: அந்த எல்லை
  rationale: நிலப் பங்கீட்டு உரைகளில் גְּבוּל என்பது பிரதேசத்தின் எல்லைக்கோட்டைக் குறிக்கிறது.
- source_word: בְּתָבוֹר
  choice: தாபோர்
  rationale: இடப்பெயர் என்பதால் தமிழில் ஒலிபெயர்க்கப்பட்டது.
- source_word: וְשַׁחֲצוּמָה
  choice: சாகசூமா
  rationale: எபிரெய மெய்யெழுத்து வடிவத்தை அடிப்படையாகக் கொண்டு இடப்பெயர் ஒலிபெயர்க்கப்பட்டது.
- source_word: וּבֵית שֶׁמֶשׁ
  choice: பெத்-செமேசு
  rationale: பெயரின் சொற்பொருளை மொழிபெயர்க்காமல், இடப்பெயராக ஒலிபெயர்க்கப்பட்டது.
- source_word: וְהָיוּ תֹּצְאוֹת גְּבוּלָם הַיַּרְדֵּן
  choice: யோர்தானில் முடிவடைந்தது
  rationale: ‘அவர்களுடைய எல்லையின் புறப்பாடுகள் யோர்தான் ஆயின’ என்ற சொற்படியான எல்லைச் சூத்திரம், இங்கு எல்லையின் இறுதி முனை அல்லது நீட்சியைக் குறிக்கிறது; நவீன தமிழில் அதன் புவியியல் செயல்பாட்டைத் தெளிவாகக் கூறுகிறது.
- source_word: עָרִים שֵׁשׁ עֶשְׂרֵה
  choice: பதினாறு நகரங்கள்
  rationale: எண்ணும் பெயர்ச்சொல்லும் கொண்ட நேரடியான எபிரெயக் கட்டமைப்பு.
- source_word: וְחַצְרֵיהֶן
  choice: அவற்றின் கிராமங்களோடு சேர்த்து
  rationale: חָצֵר என்பது நகரங்களுடன் தொடர்புடைய சிறிய அல்லது மதிலற்ற குடியிருப்புகளைக் குறிக்கிறது; ‘கிராமங்கள்’ என்பது பொதுவாசகருக்குத் தெளிவான இயல்பான சொல்.
