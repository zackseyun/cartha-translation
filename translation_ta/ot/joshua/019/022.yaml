translation_notes:
  register: நவீன செந்தமிழ் நடையில், பொதுவாசகருக்கு எளிதில் புரியும் வகையில் இயல்பாக அமைக்கப்பட்டது. இடப்பெயர்கள் மொழிபெயர்க்கப்படாமல் ஒலிபெயர்க்கப்பட்டன; எல்லைச் சூத்திரத்தின் பொருள் முதன்மை உரையில் தெளிவாக்கப்பட்டு, அதன் சொற்படியான வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டது.
