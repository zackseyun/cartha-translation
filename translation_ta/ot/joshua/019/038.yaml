base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/038.yaml
  text: 'and Yiron[a], Migdal-el, Horem, Beth-anath, and Beth-shemesh: nineteen cities[b], with their villages.'
translation:
  language: ta
  text: மேலும் யிரோன், மிக்தால்-ஏல்[a], ஹோரேம், பெத்-ஆனாத்[b], பெத்-ஷெமேஷ்[b] ஆகிய பத்தொன்பது பட்டணங்களும் அவற்றின் கிராமங்களும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “மிக்தால்-ஏல்” என்பது ஓர் இடப்பெயர்; அதன் சொல்லடிக் கூறுகள் “தேவனின் கோபுரம்” அல்லது “ஏலின் கோபுரம்” என்று பொருள்படலாம்.
    reason: lexical_alternative
  - marker: b
    text: “பெத்-ஆனாத்,” “பெத்-ஷெமேஷ்” என்பவை இடப்பெயர்கள்; அவற்றின் சொல்லடிப் பொருள் முறையே “ஆனாத்தின் வீடு,” “சூரியனின் வீடு.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/יִרְאוֹן
  choice: யிரோன்
  rationale: இது ஓர் இடப்பெயர்; எபிரெய ஒலிப்புக்கு நெருக்கமாகத் தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளது. பட்டியலின் தொடர்ச்சியைத் தமிழ் வாக்கிய அமைப்பிலுள்ள ‘ஆகிய’ வெளிப்படுத்துகிறது.
- source_word: וּ/מִגְדַּל אֵל
  choice: மிக்தால்-ஏல்
  rationale: கூட்டுச் சொல் வடிவிலுள்ள இடப்பெயர் என்பதால் மொழிபெயர்க்காமல் ஒலிபெயர்த்து, அதன் இரு கூறுகளையும் இணைப்புக்கோடு காட்டுகிறது.
- source_word: חֳרֵם
  choice: ஓரேம்
  rationale: இடப்பெயர் என்பதால் எபிரெய உச்சரிப்பை அணுகும் வகையில் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: וּ/בֵית עֲנָת
  choice: பெத்-ஆனாத்
  rationale: இது கூட்டுச் சொல் வடிவிலுள்ள இடப்பெயர்; அதன் சொல்லடி பொருளை முதன்மை உரையில் மொழிபெயர்க்காமல் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: וּ/בֵית שָׁמֶשׁ
  choice: பெத்-சேமேஷ்
  rationale: இது கூட்டுச் சொல் வடிவிலுள்ள இடப்பெயர்; அதன் சொல்லடி பொருளை முதன்மை உரையில் மொழிபெயர்க்காமல் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: עָרִים
  choice: பட்டணங்கள்
  rationale: நிலப் பங்கீட்டுப் பட்டியலில் வரும் குடியிருப்பு மையங்களைக் குறிக்க இயல்பான, மரியாதைமிக்க தமிழ் சொல்.
- source_word: תְּשַׁע עֶשְׂרֵה
  choice: பத்தொன்பது
  rationale: எபிரெய எண்ணிக்கைத் தொடர் இயல்பான தமிழில் நேரடியாக வழங்கப்பட்டுள்ளது.
- source_word: וְ/חַצְרֵי/הֶן
  choice: அவற்றின் கிராமங்களும்
  rationale: חֲצֵרִים என்பது இச்சூழலில் பட்டணங்களைச் சார்ந்த சிற்றூர்கள் அல்லது மதிலற்ற குடியிருப்புகளைக் குறிக்கிறது; ‘கிராமங்கள்’ நவீன வாசகருக்குத் தெளிவான இயல்பான இணைச்சொல்.
