revisions:
- from: இது இசக்காரின் மகன்களுடைய கோத்திரத்துக்கு, அவர்களுடைய குலங்களின்படி கிடைத்த உரிமைச்சொத்து[a]—அந்தப் பட்டணங்களும் அவற்றின் கிராமங்களும்.
  to: இது இசக்காரின் மகன்களின் கோத்திரத்தின் உரிமைச்சொத்து[a]—அவர்களுடைய குலங்களின்படியான பட்டணங்களும் அவற்றின் கிராமங்களும்.
