  yaml_path: translation/ot/joshua/019/023.yaml
  text: This was the inheritance of the tribe of the sons of Issachar[a], according to their clans—the cities and their villages.
translation:
  language: ta
  text: இது இசக்காரின் மகன்களின் கோத்திரத்தின் உரிமைச்சொத்து[a]—அவர்களுடைய குலங்களின்படியான பட்டணங்களும் அவற்றின் கிராமங்களும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “இது ... உரிமைச்சொத்து” என்பதைச் சூழலுக்கு ஏற்ப “இது ... உரிமைச்சொத்தாக இருந்தது” என்றும் மொழிபெயர்க்கலாம். எபிரெயத்தில் இது வினைச்சொல் இல்லாத வாக்கியம்; ஆகவே நிகழ்காலமா இறந்தகாலமா என்பது வெளிப்படையாகக் குறிப்பிடப்படவில்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹאת
  choice: இது
  rationale: எபிரெய உரையில் வினைச்சொல் இல்லாததால், இயல்பான தமிழில் காலத்தைக் குறிப்பாகச் சேர்க்காமல் ‘இது’ என வழங்குவது மூலத்தின் தெளிவின்மையைப் பாதுகாக்கிறது.
- source_word: נַחֲלַת
  choice: உரிமைச்சொத்து
  rationale: யோசுவாவில் இச்சொல் பரம்பரை உரிமையாகப் பெற்ற நிலப்பகுதியைக் குறிக்கிறது; ‘உரிமைச்சொத்து’ என்பது நில ஒதுக்கீட்டையும் பரம்பரை உரிமை நயத்தையும் இணைத்துக் காட்டுகிறது.
- source_word: מַטֵּה
  choice: கோத்திரம்
  rationale: நிலப்பங்கீட்டுச் சூழலில் இது இஸ்ரவேலின் கோத்திரத்தைக் குறிக்கும் வழக்குச் சொல்.
- source_word: בְנֵי יִשָּׂשכָר
  choice: இசக்காரின் மகன்கள்
  rationale: கோத்திர அடையாளத்தின் வம்சவழி அமைப்பைக் காட்டும் எபிரெய உறவுமுறைச் சொல்லாட்சியை நெருக்கமாகப் பாதுகாக்கிறது.
- source_word: לְמִשְׁפְּחֹתָם
  choice: அவர்களுடைய குலங்களின்படி
  rationale: கோத்திரத்திற்குள் உள்ள குலப் பிரிவுகளுக்கேற்ப நிலம் பகுக்கப்பட்டதைக் காட்டும் பகிர்வுப் பொருளை வெளிப்படுத்துகிறது.
- source_word: הֶעָרִים
  choice: பட்டணங்கள்
  rationale: பண்டைய குடியிருப்பு மையங்களைக் குறிக்கும் இயல்பான தமிழ் வேதாகமச் சூழல் சொல்; நவீனப் பெருநகரம் என்ற தவறான எண்ணத்தைத் தவிர்க்கிறது.
- source_word: וְחַצְרֵיהֶן
  choice: அவற்றின் கிராமங்கள்
  rationale: பட்டணங்களைச் சார்ந்த சிறிய புறநிலக் குடியிருப்புகளைத் தெளிவாகக் குறிக்கிறது.
