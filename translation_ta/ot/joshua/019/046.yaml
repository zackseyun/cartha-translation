  text: and the waters of Jarkon and Rakkon[b][a], with the territory opposite Joppa.
translation:
  language: ta
  text: யர்கோனின் நீர்நிலைகளும்[a], ரக்கோனும், யாப்போவுக்கு எதிரே உள்ள எல்லைப்பகுதியும்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘யர்கோனின் நீர்நிலைகள்’ என்பதற்குப் பதிலாக, எபிரெயச் சொற்றொடரை ‘மே-யர்கோன்’ என்ற இடப்பெயராகவும் புரிந்துகொள்ளலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘எல்லைப்பகுதி’ என்பதற்குப் பதிலாக, ‘எல்லை’ அல்லது ‘எல்லைக்கோடு’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמֵי הַיַּרְקוֹן
  choice: யர்கோனின் நீர்நிலைகளும்
  rationale: மֵי என்பது மַיִם (‘நீர்’) என்பதன் இணைப்புநிலைப் பன்மை வடிவம். எல்லை விவரிப்பில் இயல்பான தமிழுக்காக ‘யர்கோனின் நீர்நிலைகள்’ என மொழிபெயர்க்கப்பட்டது; இதனை ஒரே இடப்பெயராகப் புரிந்துகொள்ளும் வாய்ப்பு அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: וְהָרַקּוֹן
  choice: ரக்கோனும்
  rationale: இது ஓர் இடப்பெயர்; எபிரெய ஒலிப்புக்கு நெருக்கமாகத் தமிழில் எழுத்துப்பெயர்க்கப்பட்டது.
- source_word: עִם הַגְּבוּל
  choice: எல்லைப்பகுதியும்
  rationale: גְּבוּל என்பதற்கு ‘எல்லை’, ‘எல்லைக்கோடு’, ‘எல்லைப்பகுதி’ ஆகிய பொருள்கள் உண்டு. இடங்களின் பட்டியலில் இங்கு நிலப்பரப்பைக் குறிக்கும் சாத்தியத்தையும் எல்லையைக் குறிக்கும் சாத்தியத்தையும் அளவுக்கு மீறித் தீர்மானிக்காமல் ‘எல்லைப்பகுதி’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: מוּל
  choice: எதிரே உள்ள
  rationale: இச்சொல் இடவியல் உறவில் ‘எதிரே’ அல்லது ‘எதிர்நோக்கி’ என்பதைக் குறிக்கிறது; தமிழ் எல்லை விவரிப்பில் ‘எதிரே உள்ள’ இயல்பாக உள்ளது.
- source_word: יָפוֹ
  choice: யாப்போ
  rationale: எபிரெய இடப்பெயரின் ஒலிப்பைத் தமிழில் தெளிவாகக் காட்டும் எழுத்துப்பெயர்ப்பு.
