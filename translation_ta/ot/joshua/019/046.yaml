translation_notes:
  register: நவீன நிலையான தமிழில், இடப்பெயர்களை எழுத்துப்பெயர்த்து, எல்லைப் பட்டியலுக்கேற்ற சுருக்கமான மற்றும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. மூலத்தின் சொற்பொருள் தெளிவும் அதன் உண்மையான இடப்பெயர்/பொதுப்பெயர் ஐயமும் பாதுகாக்கப்பட்டுள்ளன.
