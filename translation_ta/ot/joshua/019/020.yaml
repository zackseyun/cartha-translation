lexical_decisions:
- source_word: הָרַבִּית
  choice: ரப்பீத்
  rationale: இது ஓர் இடப்பெயர். எபிரேய மெய்யெழுத்துகளையும் பாரம்பரிய உயிர்க்குறிப்பையும் கருத்தில் கொண்டு, தமிழில் இயல்பாக வாசிக்கத்தக்க வகையில் ஒலிபெயர்க்கப்பட்டது; தொடக்க ה பெயரின் ஒரு பகுதியாக இன்னும் வெளிப்படையாகக் காட்டும் வடிவம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: קִשְׁיוֹן
  choice: கிஷ்யோன்
  rationale: இடப்பெயர் என்பதால் மொழிபெயர்க்காமல் ஒலிபெயர்க்கப்பட்டது. שׁ, יוֹ ஆகிய ஒலித்தொடர்களை முறையே ‘ஷ்’, ‘யோ’ எனக் காட்டுகிறது.
- source_word: אָבֶץ
  choice: ஆபேஸ்
  rationale: இடப்பெயர் என்பதால் ஒலிபெயர்க்கப்பட்டது. தொடக்க qamets உயிரை ‘ஆ’ என்றும், பெயரின் இறுதி ஒலியைத் தமிழில் வாசிக்கத்தக்க ‘ஸ்’ என்றும் வழங்குகிறது; வழக்கில் காணப்படும் வேறு வடிவம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: וְ / וָ
  choice: -உம்
  rationale: பட்டியலில் ஒவ்வொரு பெயரையும் இணைக்கும் எபிரேய இணைப்புச் சொல்லை, தமிழில் இயல்பான பட்டியல் இணைப்பான ‘-உம்’ மூலம் ஒவ்வொரு பெயருடனும் வெளிப்படுத்துகிறது.
