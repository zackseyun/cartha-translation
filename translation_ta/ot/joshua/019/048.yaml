- from: 'அவர்களுடைய குலங்களின்படி தாண் மக்களின் கோத்திரத்துக்குக் கிடைத்த உரிமைப்பங்கு[a] இதுவே: இந்த நகரங்களும் அவற்றைச் சேர்ந்த கிராமங்களும்.'
  to: 'தாண் மக்களின் கோத்திரத்தின் சுதந்தரப்பங்கு[a], அவர்களுடைய குலங்களின்படி, இதுவே: இந்த நகரங்களும் அவற்றைச் சேர்ந்த கிராமங்களும்.'
  rationale: The revision removes the added past-tense implication, retains the Hebrew summary-formula ambiguity through “இதுவே,” and uses “சுதந்தரப்பங்கு” for the territorial inheritance while preserving the viable “allotment” alternative in the footnote.
