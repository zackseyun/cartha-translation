source:
  edition: WLC
  text: זֹ֗את נַחֲלַ֛ת מַטֵּ֥ה בְנֵי דָ֖ן לְ/מִשְׁפְּחֹתָ֑/ם הֶֽ/עָרִ֥ים הָ/אֵ֖לֶּה וְ/חַצְרֵי/הֶֽן־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/048.yaml
  text: 'This was the inheritance of the tribe of the sons of Dan[b][a], according to their clans: these cities with their villages.'
translation:
  language: ta
  text: 'தாண் மக்களின் கோத்திரத்தின் சுதந்தரப்பங்கு[a], அவர்களுடைய குலங்களின்படி, இதுவே: இந்த நகரங்களும் அவற்றைச் சேர்ந்த கிராமங்களும்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘சுதந்தரப்பங்கு’ என்பதற்கு ‘ஒதுக்கப்பட்ட பங்கு’ என்றும் மொழிபெயர்க்கலாம்; எபிரெயச் சொல் ஒதுக்கீட்டையும் பரம்பரை உரிமையையும் குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹאת
  choice: இதுவே
  rationale: எபிரெய உரையில் வினைச்சொல் இல்லாத சுட்டுச் சுருக்கவாக்கியம். தமிழில் ‘இதுவே’ என்பது இயல்பாகவும், நிகழ்/இறந்தகாலத்தைத் தேவையின்றி நிர்ணயிக்காமலும் முன் பட்டியலிடப்பட்ட நிலப்பகுதியைச் சுட்டுகிறது.
- source_word: נַחֲלַת
  choice: உரிமைப்பங்கு
  rationale: நிலப் பகிர்வின் சூழலில் ஒதுக்கப்பட்ட பங்கையும் தலைமுறை உரிமையாகப் பெற்ற நிலத்தையும் குறிக்கும் இரு நுணுக்கங்களையும் ‘உரிமைப்பங்கு’ தக்கவைக்கிறது.
- source_word: מַטֵּה בְנֵי דָן
  choice: தாண் மக்களின் கோத்திரம்
  rationale: מַטֵּה இங்கு கோல் அல்ல, கோத்திரத்தைக் குறிக்கிறது; בְנֵי דָן என்பதன் உறவுக் கட்டமைப்பை இயல்பான தமிழில் ‘தாண் மக்கள்’ எனத் தருகிறது.
- source_word: לְמִשְׁפְּחֹתָם
  choice: அவர்களுடைய குலங்களின்படி
  rationale: இங்கு nuclear family அல்ல, கோத்திரத்துக்குள் உள்ள உறவுவழிப் பிரிவுகள் குறிக்கப்படுவதால் ‘குலங்கள்’ பொருத்தமானது.
- source_word: הֶעָרִים הָאֵלֶּה
  choice: இந்த நகரங்கள்
  rationale: முன்னர் பட்டியலிடப்பட்ட இடங்களைச் சுட்டும் நேரடியான, இயல்பான மொழிபெயர்ப்பு.
- source_word: וְחַצְרֵיהֶן
  choice: அவற்றைச் சேர்ந்த கிராமங்கள்
  rationale: חָצֵר இந்நிலப் பட்டியல்களில் நகரங்களைச் சார்ந்த சிற்றூர்கள் அல்லது புறக்குடியிருப்புகளைக் குறிக்கிறது; ‘அவற்றைச் சேர்ந்த கிராமங்கள்’ அந்தச் சார்பைத் தெளிவாக்குகிறது.
