revisions:
- from: பெத்-லெபாவோத், சாருகேன்—இவற்றின் கிராமங்களுடன் சேர்த்து பதின்மூன்று நகரங்கள்.[a]
  to: பெத்-லெபாவோத், சாருஹேன்—பதின்மூன்று நகரங்களும் அவற்றின் கிராமங்களும்.[a]
  rationale: The revision preserves the Masoretic Text’s two place names, numerical total, and village formula while correcting the Tamil-script representation of the Hebrew guttural in Sharuhen and in the footnoted variant Shilhim. It also adopts a more direct formal Tamil rendering of the catalogue summary.
  reviewer_model: gpt-5.6-terra
