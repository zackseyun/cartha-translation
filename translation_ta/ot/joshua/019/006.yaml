  register: நவீன நிலையான தமிழில், நிலப்பங்கீட்டுப் பட்டியலுக்கேற்ற சுருக்கமான கண்ணிய நடையில் அமைக்கப்பட்டுள்ளது. இடப்பெயர்கள் மொழிபெயர்க்கப்படாமல் ஒலிப்பெயர்க்கப்பட்டுள்ளன; எண்ணிக்கை முழுப் பட்டியலைக் குறிக்கும் வகையில் இயல்பான தமிழ்ச் சொற்றொடர் பயன்படுத்தப்பட்டுள்ளது.
