  yaml_path: translation/ot/joshua/019/006.yaml
  text: 'Beth-lebaoth and Sharuhen: thirteen cities[a], with their villages.'
translation:
  language: ta
  text: பெத்-லெபாவோத், சாருஹேன்—பதின்மூன்று நகரங்களும் அவற்றின் கிராமங்களும்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயப் பாடத்தில் இங்கு ‘சாருஹேன்’ என்று உள்ளது; இதற்கு இணையான பட்டியலாகிய யோசுவா 15:32-ல் ‘சில்ஹீம்’ என்ற வேறுபட்ட பெயர் காணப்படுகிறது.
    reason: textual_variant
lexical_decisions:
- source_word: בֵית לְבָאוֹת
  choice: பெத்-லெபாவோத்
  rationale: இது ஓர் இடப்பெயர் என்பதால், அதன் சொற்பொருளை மொழிபெயர்க்காமல் எபிரெய ஒலிப்புக்கு ஏற்ப எழுத்துப்பெயர்ப்பு செய்யப்பட்டுள்ளது.
- source_word: שָׁרוּחֶן
  choice: சாருகேன்
  rationale: மசோரா மூலப்பாடத்தில் உள்ள இடப்பெயர் தமிழில் ஒலிப்பெயர்க்கப்பட்டுள்ளது; இணைப் பட்டியலிலுள்ள வேறுபட்ட பெயர் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: עָרִים
  choice: நகரங்கள்
  rationale: நிலப்பங்கீட்டுப் பட்டியல்களில் עִיר என்பதற்குரிய வழக்கமான, கண்ணியமான தமிழ் இணைச்சொல்.
- source_word: שְׁלֹשׁ עֶשְׂרֵה
  choice: பதின்மூன்று
  rationale: எபிரெய எண்ணிக்கைக் குறிப்பை இயல்பான தமிழில் நேரடியாக வழங்குகிறது.
- source_word: חַצְרֵיהֶן
  choice: இவற்றின் கிராமங்கள்
  rationale: இங்கு பெயரிடப்பட்ட நகரங்களைச் சார்ந்த மதிலற்ற சிறிய குடியிருப்புகளைச் சுட்டுவதால் ‘கிராமங்கள்’ என்பது தெளிவான நவீனத் தமிழ் இணைச்சொல்.
