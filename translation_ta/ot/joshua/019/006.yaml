    text: எபிரெயப் பாடத்தில் இங்கு ‘சாருஹேன்’ என்று உள்ளது; இதற்கு இணையான பட்டியலாகிய யோசுவா 15:32-ல் ‘சில்ஹீம்’ என்ற வேறுபட்ட பெயர் காணப்படுகிறது.
    reason: textual_variant
  revision_rationale: The revision preserves the Masoretic Text’s two place names, numerical total, and village formula while correcting the Tamil-script representation of the Hebrew guttural in Sharuhen and in the footnoted variant Shilhim. It also adopts a more direct formal Tamil rendering of the catalogue summary.
