  source_fidelity: 'முதன்மை மொழிபெயர்ப்பு எபிரெய உரையின் எல்லை-விவரிப்பு நடையை நன்றாகப் பின்பற்றுகிறது: וְנָסַב என்பதற்கு ‘வளைந்து சென்றது,’ תֹּצְאֹתָיו என்பதற்குப் பன்மையான ‘முடிவிடங்கள்,’ மற்றும் גֵּי יִפְתַּח־אֵל என்பதற்கு இடப்பெயராக ‘யிப்தாக்-ஏல் பள்ளத்தாக்கு’ ஆகியவை பொருத்தமானவை. ஆனால் [a] அடிக்குறிப்பில் கூறப்படும் ‘வடக்கு நோக்கி ஹன்னாத்தோன் வரை’ என்பது מִצְּפוֹן חַנָּתֹן என்பதன் இயல்பான மாற்றுப் பொருளல்ல. מִן இங்கே ‘ஹன்னாத்தோனின் வடக்கிலிருந்து’ என்ற தொடக்க/திசைச்சுட்டுப் பொருளையும் தரலாம்.'
