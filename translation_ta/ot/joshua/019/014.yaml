  text: וְ/נָסַ֤ב אֹת/וֹ֙ הַ/גְּב֔וּל מִ/צְּפ֖וֹן חַנָּתֹ֑ן וְ/הָיוּ֙ תֹּֽצְאֹתָ֔י/ו גֵּ֖י יִפְתַּח אֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/014.yaml
  text: Then the border turned around it on the north to Hannathon[b][a], and its end was at the Valley of Iphtah-el.
translation:
  language: ta
  text: பின்பு அந்த எல்லை அதைச் சுற்றி, ஹன்னாத்தோனுக்கு வடக்கே வளைந்து சென்றது[a]; அதன் முடிவிடங்கள்[b] யிப்தாக்-ஏல் பள்ளத்தாக்கில் இருந்தன.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘ஹன்னாத்தோனின் வடக்கிலிருந்து.’ இந்த எபிரெயச் சொற்றொடரை ஹன்னாத்தோனின் வடப்பக்கத்தைக் குறிக்கும் இடநிலையாகவோ, அங்கிருந்து தொடங்கும் திசையைக் குறித்தோ புரிந்துகொள்ளலாம்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயில், ‘அது வெளியே செல்லும் இடங்கள்’; எல்லை விவரிப்பில் இது எல்லையின் இறுதி முனைகள் அல்லது முடிவிடங்களைக் குறிக்கும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָסַב
  choice: பின்பு ... வளைந்து சென்றது
  rationale: எல்லை விவரிப்புகளில் இந்த வினை எல்லைக்கோடு திரும்புவதையோ வளைந்து செல்வதையோ குறிக்கிறது. நவீன தமிழில் இயல்பாகவும் திசைமாற்றத்தைத் தெளிவாகவும் காட்டும் சொற்றொடர் இது.
- source_word: אֹתוֹ
  choice: அதைச் சுற்றி
  rationale: ஆண்பால் ஒருமைச் சுட்டுப்பெயர் முந்தைய நிலவரையறைக் குறிப்பைச் சுட்டுகிறது. அதன் தெளிவின்மையைத் தீர்த்துவிடாமல் தமிழிலும் பொதுவான சுட்டாக வைக்கப்பட்டுள்ளது.
- source_word: הַגְּבוּל
  choice: அந்த எல்லை
  rationale: நிலப்பங்கீட்டுச் சூழலில் இது நிலப்பரப்பின் எல்லைக்கோட்டைக் குறிக்கிறது; ‘எல்லை’ என்பது இயல்பான நவீனத் தமிழ்.
- source_word: מִצְּפוֹן חַנָּתֹן
  choice: ஹன்னாத்தோனுக்கு வடக்கே
  rationale: எல்லை ஹன்னாத்தோனின் வடப்பக்கமாகச் சென்றது என்ற இடநிலைப் பொருளை முதன்மைப்படுத்துகிறது; திசைநோக்குப் பொருளுக்கான வாய்ப்பு அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
- source_word: וְהָיוּ תֹּצְאֹתָיו
  choice: அதன் முடிவிடங்கள் ... இருந்தன
  rationale: நில எல்லை விவரிப்பில் תֹּצָאוֹת எல்லையின் இறுதி முனைகளையோ முடிவிடங்களையோ குறிக்கிறது. எபிரெயச் சொல்லின் பன்மையைப் பாதுகாத்து, புரியக்கூடிய ‘முடிவிடங்கள்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: גֵּי
  choice: பள்ளத்தாக்கு
  rationale: இச்சொல் பள்ளத்தாக்கு அல்லது கணவாயைக் குறிக்கும்; இங்கு இடப்பெயரின் பகுதியாக ‘பள்ளத்தாக்கு’ இயல்பாக உள்ளது.
- source_word: יִפְתַּח אֵל
  choice: யிப்தாக்-ஏல்
  rationale: இடப்பெயர் மொழிபெயர்க்கப்படாமல் எபிரெய ஒலிப்புக்கு நெருக்கமாகத் தமிழில் எழுத்துப்பெயர்க்கப்பட்டுள்ளது.
