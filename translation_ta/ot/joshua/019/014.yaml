translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையில் கண்ணியமான நிலவியல் நடையில் வடிவமைக்கப்பட்டுள்ளது. எபிரெய மூலத்தின் சுட்டுப்பெயர் தெளிவின்மையும், מִצְּפוֹן என்பதன் இடநிலை/திசைநோக்கு இருபொருள் வாய்ப்பும் பாதுகாக்கப்பட்டுள்ளன; תֹּצְאֹתָיו என்பதன் இலக்கணப் பன்மையும் தமிழில் வைக்கப்பட்டுள்ளது.
