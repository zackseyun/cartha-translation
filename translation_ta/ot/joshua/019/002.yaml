- from: அவர்களுடைய உரிமைப் பங்கில் பெயெர்-செபா[a], செபா, மோலாதா ஆகிய நகரங்கள் இருந்தன.
  to: அவர்களுடைய உரிமைப் பங்கில் பெயர்செபா[a], செபா, மோலாதா ஆகியவை இருந்தன.
