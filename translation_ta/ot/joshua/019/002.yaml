  text: And they had in their inheritance Beer-sheba[a], Sheba, and Moladah.
translation:
  language: ta
  text: அவர்களுடைய உரிமைப் பங்கில் பெயர்செபா[a], செபா, மோலாதா ஆகியவை இருந்தன.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரெயத்தில்: “பெயர்செபாவும் செபாவும்.” சிலர் இதை இரண்டு தனித்தனி இடப்பெயர்களாக அல்லாமல், பாடத்திலோ நடையிலோ ஏற்பட்ட ஓர் ஒழுங்கின்மையுடன் காணப்படும் ஒரே இடப்பெயராக (“பெயர்செபா”) புரிந்துகொள்கிறார்கள்.'
    reason: textual_variant
lexical_decisions:
- source_word: וַיְהִי לָהֶם
  choice: அவர்களுடைய ... இருந்தன
  rationale: ஒதுக்கப்பட்ட பங்கில் அவர்களுக்கு உரியவையாக இவை இருந்தன என்ற எபிரெயச் சொற்றொடரின் உடைமை/ஒதுக்கீட்டுப் பொருளை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: בְּנַחֲלָתָם
  choice: உரிமைப் பங்கில்
  rationale: נחלה என்பது குலத்திற்குக் கிடைத்த சுதந்தரச் சொத்தையோ நில ஒதுக்கீட்டையோ குறிக்கிறது; ‘உரிமைப் பங்கு’ இவ்விரு கருத்துகளையும் சுருக்கமாகத் தக்கவைக்கிறது.
- source_word: בְּאֵר שֶׁבַע
  choice: பெயெர்-செபா
  rationale: எபிரெய இடப்பெயரின் இரு கூறுகளையும் இணைப்புக்குறியுடன் ஒலிபெயர்க்கிறது.
- source_word: וְשֶׁבַע
  choice: செபா
  rationale: மசோரா மெய்யெழுத்துப் பாடம் இதை ‘செபா’ என்ற தனி இடப்பெயராகப் பட்டியலிடுகிறது; இதிலுள்ள பாட/நடைச் சிக்கல் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: וּמוֹלָדָה
  choice: மோலாதா
  rationale: இடப்பெயர் எபிரெய ஒலிப்புக்கு நெருக்கமாக ஒலிபெயர்க்கப்படுகிறது.
