translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. பட்டியல் சூழலைத் தெளிவாக்க ‘நகரங்கள்’ என்பது பொருளடிப்படையில் சேர்க்கப்பட்டுள்ளது; மூலத்தில் உள்ள இடப்பெயர் சார்ந்த உண்மையான ஐயம் அடிக்குறிப்பில் தக்கவைக்கப்பட்டுள்ளது.
