  text: וַ/יְהִ֣י גְבוּלָ֗/ם מֵ/חֵ֨לֶף מֵֽ/אֵל֜וֹן בְּ/צַעֲנַנִּ֗ים וַ/אֲדָמִ֥י הַנֶּ֛קֶב וְ/יַבְנְאֵ֖ל עַד לַקּ֑וּם וַ/יְהִ֥י תֹצְאֹתָ֖י/ו הַ/יַּרְדֵּֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/033.yaml
  text: And their border was from Heleph[a], from the oak in Zaannannim, and Adami-nekeb and Jabneel, as far as Lakkum[b]; and its end was at the Jordan.
translation:
  language: ta
  text: அவர்களுடைய எல்லை ஹேலேபிலிருந்து, சானன்னீமிலுள்ள கருவாலி மரத்திலிருந்து[a], அதாமி-நெகேப், யப்னியேல் வழியாக லக்கூம்வரை சென்றது; அதன் எல்லைமுனைகள் யோர்தானை அடைந்தன.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஏலோன்-பெசானன்னீமிலிருந்து”; எபிரெயத்தை ஓர் இடப்பெயராகவோ, “சானன்னீமிலுள்ள/சானன்னீமின் கருவாலி மரம்” என்றோ வாசிக்கலாம்.
    reason: alternative_reading
  - marker: b
    text: எபிரெயத்தில் சொல்லளவில், “அதன் வெளியேறும் இடங்கள் யோர்தானாக இருந்தன”; இது எல்லை யோர்தானை அடைந்து முடிந்ததைக் குறிக்கும் மரபுச் சொற்றொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: גְבוּלָם
  choice: அவர்களுடைய எல்லை
  rationale: גְּבוּל என்பது இங்கு நப்தலி கோத்திரத்தின் நில எல்லையைக் குறிக்கிறது; ‘எல்லை’ இயல்பான, தெளிவான தமிழ்.
- source_word: מֵחֵלֶף
  choice: ஏலேப்பிலிருந்து
  rationale: இது ஓர் இடப்பெயர்; எபிரெய ஒலிப்புக்கு ஏற்றவாறு தமிழில் ஒலிபெயர்க்கப்பட்டது.
- source_word: מֵאֵלוֹן בְּצַעֲנַנִּים
  choice: சானானீமிலுள்ள கருவாலி மரத்திலிருந்து
  rationale: אֵלוֹן என்பதை இங்கு பெரிய மரத்தைக் குறிக்கும் பொதுப்பெயராகவும், בְּצַעֲנַנִּים என்பதை அதன் இருப்பிடமாகவும் வாசிக்கலாம். இடப்பெயராக வாசிக்கும் மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: וַאֲדָמִי הַנֶּקֶב
  choice: அதாமி-நேகேபையும்
  rationale: எல்லைப் பட்டியலின் தொடரமைப்பில் இது கூட்டுச் சேர்ந்த இடப்பெயராகப் புரிந்துகொள்ளப்படுகிறது.
- source_word: וְיַבְנְאֵל
  choice: யப்னேயேலையும்
  rationale: இடப்பெயர் எபிரெய வடிவத்துக்கு நெருக்கமாக ஒலிபெயர்க்கப்பட்டது.
- source_word: עַד לַקּוּם
  choice: லக்கூம்வரை
  rationale: עַד எல்லையின் நீட்சி ஓர் இடம்வரை சென்றதைக் குறிக்கிறது.
- source_word: תֹצְאֹתָיו
  choice: அதன் முடிவு
  rationale: சொல்லளவில் ‘அதன் வெளியேறும் இடங்கள்/முனைகள்’ எனப் பொருள்படும் இந்த எல்லை வருணனை மரபுச் சொற்றொடர், எல்லை முடியும் இடத்தைக் குறிக்கிறது.
- source_word: הַיַּרְדֵּן
  choice: யோர்தான்
  rationale: நதியின் வழக்கமான வேதாகமப் பெயர்; சூழலில் ‘நதி’ என்பதைச் சேர்க்க வேண்டிய அவசியமில்லை.
