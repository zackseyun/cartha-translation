translation_notes:
  register: நவீனத் தரத் தமிழில், நில எல்லைப் பட்டியலுக்கேற்ற கண்ணியமான உரைநடை பயன்படுத்தப்பட்டுள்ளது. இடப்பெயர்கள் ஒலிபெயர்க்கப்பட்டுள்ளன; ‘சென்றது’ என்பது பட்டியலின் இயக்கத்தைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது. மூலத்தின் வாசிப்பு ஐயம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
