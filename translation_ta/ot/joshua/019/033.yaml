  source_fidelity: 'திருத்தம் தேவை. வரைவு மூலத்தின் எல்லைப் பட்டியல் அமைப்பையும் வாசிப்பு-ஐயத்தையும் பெரும்பாலும் காக்கிறது. ஆனால் சில இடப்பெயர் ஒலிபெயர்ப்புகள் எபிரெய வடிவத்திலிருந்து விலகுகின்றன: חֵלֶף-க்கு ‘ஹேலேப்,’ יַבְנְאֵל-க்கு ‘யப்னியேல்,’ மற்றும் נֶקֶב-க்கு ‘நெகேப்’ என்பவை நெருக்கமானவை. மேலும் תֹצְאֹתָיו பன்மை வடிவம்; ‘எல்லைமுனைகள் யோர்தானை அடைந்தன’ என்பது அந்த எல்லை-வருணனைச் சொற்றொடரைத் தமிழில் தெளிவாகவும் துல்லியமாகவும் தருகிறது.'
