  yaml_path: translation/ot/joshua/019/018.yaml
  text: And their border was Jezreel[a], Chesulloth[b], and Shunem.
translation:
  language: ta
  text: அவர்களுடைய எல்லை யெஸ்ரயேல்,[a] கெசுல்லோத், சூனேம் என்பவையாக இருந்தது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரேயத்தில் ‘யெஸ்ரயேல்’ என்ற பெயருடன் திசையைக் குறிக்கும் பின்னொட்டு உள்ளது; இதை ‘யெஸ்ரயேலை நோக்கி’ அல்லது ‘யெஸ்ரயேலுக்கு’ என்றும் புரிந்துகொள்ளலாம். எல்லை இடங்களின் பட்டியலாக எடுத்தால், ‘யெஸ்ரயேல், கெசுல்லோத், சூனேம்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: அமைந்திருந்தது
  rationale: எல்லையை விவரிக்கும் தொடரில் היה என்பதன் இயல்பான தமிழாக்கம்; எபிரேயக் கதைத்தொடரின் வாவைத் தனியாக ‘மேலும்’ என்று மொழிபெயர்க்காமல், முந்தைய வசனத்துடனான தொடர்ச்சியை வாக்கிய அமைப்பு வெளிப்படுத்துகிறது.
- source_word: גְּבוּלָם
  choice: அவர்களுடைய எல்லை
  rationale: גְּבוּל என்பது இங்கு கோத்திரப் பங்கின் எல்லையைக் குறிக்கிறது; 3ஆம் நபர் ஆண்பால் பன்மை பின்னொட்டு ‘அவர்களுடைய’ என வெளிப்படுத்தப்படுகிறது.
- source_word: יִזְרְעֶאלָה
  choice: யெஸ்ரயேலை நோக்கி
  rationale: இடப்பெயருடன் சேர்ந்துள்ள திசைகாட்டும் ־ה பின்னொட்டின் ‘யெஸ்ரயேலை நோக்கி/யெஸ்ரயேலுக்கு’ என்ற நுணுக்கத்தைத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: הַכְּסוּלֹת
  choice: கெசுல்லோத்
  rationale: இது ஓர் இடப்பெயர்; முன்னொட்டுக் குறிப்புச்சொல்லைத் தமிழில் தனியாகச் சேர்க்காமல் ஒலிபெயர்க்கப்படுகிறது.
- source_word: שׁוּנֵם
  choice: சூனேம்
  rationale: இடப்பெயர் நவீனத் தமிழில் வாசிக்க ஏற்றவாறு ஒலிபெயர்க்கப்படுகிறது.
