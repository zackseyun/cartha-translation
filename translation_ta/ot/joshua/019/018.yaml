translation_notes:
  register: நவீன நிலையான தமிழில், எல்லை நகரங்களைக் குறிப்பிடும் புவியியல் உரைக்கு ஏற்ற கண்ணியமான மற்றும் எளிதில் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. ‘வழியாக’ என்பது பட்டியலிடப்பட்ட இடங்களுடன் எல்லையின் தொடர்பை இயல்பான தமிழில் காட்டுகிறது; முதல் இடப்பெயரின் திசைகாட்டும் எபிரேய வடிவம் முதன்மை உரையிலும் அடிக்குறிப்பிலும் பாதுகாக்கப்பட்டுள்ளது.
