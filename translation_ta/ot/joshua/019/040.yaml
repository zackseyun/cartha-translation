  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு புரியும் வகையிலும் வேதாகம வரலாற்றுச் சூழலுக்கேற்ற கண்ணியமான நடையிலும் அமைக்கப்பட்டது. எபிரெய வாக்கியத்தின் முன்னிலைப்படுத்தப்பட்ட பெறுநர் அமைப்பும் குலப் பிரிவும் இயன்றவரை பேணப்பட்டுள்ளன.
