  yaml_path: translation/ot/joshua/019/040.yaml
  text: For the tribe of the sons of Dan, according to their clans, the seventh lot came out.
translation:
  language: ta
  text: தாணின் மகன்களின் கோத்திரத்திற்கு, அவர்களுடைய குலங்களின்படி, ஏழாவது சீட்டு வெளிவந்தது.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְמַטֵּה
  choice: கோத்திரத்துக்கு
  rationale: யோசுவாவின் நிலப் பங்கீட்டுச் சூழலில் מַטֶּה என்பது கைக்கோலை அல்ல, ‘கோத்திரம்’ என்பதைக் குறிக்கிறது; முன்னொட்டு לְ ஒதுக்கீட்டின் பெறுநரைச் சுட்டுவதால் ‘-க்கு’ என்று மொழிபெயர்க்கப்பட்டது.
- source_word: בְנֵי דָן
  choice: தாணின் மகன்களுடைய
  rationale: எபிரெயக் குலஉறவுச் சொல்லாக்கத்தை வெளிப்படையாகப் பேணுகிறது; ‘தாணியர்’ என்பதைக் காட்டிலும் மூலத்தின் வடிவத்துக்கு நெருக்கமானது.
- source_word: לְמִשְׁפְּחֹתָם
  choice: அவர்களுடைய குலங்களின்படி
  rationale: நிலப் பங்கீட்டுச் சூழலில் מִשְׁפָּחוֹת என்பது கோத்திரத்திற்குள் உள்ள குலப் பிரிவுகளைக் குறிக்கிறது; ‘குடும்பங்கள்’ என்ற நவீன, குறுகிய பொருளைத் தவிர்க்கிறது.
- source_word: יָצָא
  choice: வந்தது
  rationale: வினைச்சொல்லின் அடிப்படை ‘வெளியே வந்தது’ என்ற கருத்தை இயல்பான தமிழில் தருகிறது; சீட்டு ‘விழுந்தது’ என்று சூழலை விளக்கி மொழிபெயர்ப்பதைவிட மூல வடிவத்துக்கு நெருக்கமானது.
- source_word: הַגּוֹרָל
  choice: சீட்டு
  rationale: நிலத்தைப் பங்கிடுவதற்காகப் போடப்படும் גוֹרָל என்பதற்கான இயல்பான தமிழ் வேதாகமச் சொல்; இங்கு பங்கைக் காட்டிலும் பங்கீட்டு முறையைச் சுட்டுகிறது.
- source_word: הַשְּׁבִיעִי
  choice: ஏழாவது
  rationale: பங்கீட்டு வரிசையில் சீட்டின் இடத்தை நேரடியாகக் காட்டும் வரிசை எண்.
