revisions:
- from: தாணின் மகன்களுடைய கோத்திரத்துக்கு, அவர்களுடைய குலங்களின்படி, ஏழாவது சீட்டு வந்தது.
  to: தாணின் மகன்களின் கோத்திரத்திற்கு, அவர்களுடைய குலங்களின்படி, ஏழாவது சீட்டு வெளிவந்தது.
  rationale: The revision preserves every constituent of the Hebrew while making the construct phrase more natural and rendering יָצָא with an explicit ‘came out’ sense appropriate to casting lots. No footnote is needed because the wording is not textually disputed and the social terms are adequately represented in the translation.
