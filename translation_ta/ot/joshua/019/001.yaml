translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, மதிப்புமிக்க நடையைப் பயன்படுத்துகிறது. கோத்திரப் பங்கீட்டின் தொழில்நுட்பச் சொற்களான ‘கோத்திரம்’, ‘குலம்’, ‘உரிமைப்பங்கு’ தெளிவாக வேறுபடுத்தப்பட்டுள்ளன; எபிரெய வாக்கியத்தின் இணைப்புப் பொருளை இடைக்கோடுகள் காட்டுகின்றன.
