  text: וַ/יֵּצֵ֞א הַ/גּוֹרָ֤ל הַ/שֵּׁנִי֙ לְ/שִׁמְע֔וֹן לְ/מַטֵּ֥ה בְנֵֽי שִׁמְע֖וֹן לְ/מִשְׁפְּחוֹתָ֑/ם וַֽ/יְהִי֙ נַֽחֲלָתָ֔/ם בְּ/ת֖וֹךְ נַחֲלַ֥ת בְּנֵֽי יְהוּדָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/001.yaml
  text: The second lot came out for Simeon[a], for the tribe of the sons of Simeon according to their clans[b], and their inheritance was within the inheritance of the sons of Judah.
translation:
  language: ta
  text: இரண்டாவது சீட்டு சிமியோனுக்கு[a]—சிமியோனின் மகன்களுடைய கோத்திரத்துக்கு, அவர்களுடைய குலங்களின்படி—வந்தது. அவர்களுடைய உரிமைப்பங்கு யூதாவின் மகன்களுடைய உரிமைப்பங்கிற்குள் இருந்தது.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘இரண்டாவது சீட்டு சிமியோனுக்கு விழுந்தது.’ எபிரெய வினைச்சொல்லின் நேரடிப் பொருள் ‘வெளியே வந்தது’; இங்கு அது சீட்டுக் குலுக்கலின் முடிவைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: ‘சிமியோனின் மகன்கள்’, ‘யூதாவின் மகன்கள்’ என்பவை எபிரெயக் கோத்திரப் பெயரிடும் முறைகள்; அவை அந்தந்த கோத்திரத்தின் வழிவந்தவர்களையோ உறுப்பினர்களையோ குறிக்கின்றன.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: வந்தது
  rationale: יצא என்பதன் ‘வெளியே செல்/வா’ என்ற மூலப் படிமத்தைத் தக்கவைத்தபடி, சீட்டுக் குலுக்கலின் முடிவு ஒருவருக்கு வந்தது எனத் தமிழில் இயல்பாகக் கூறுகிறது. ‘விழுந்தது’ என்பதும் வழக்கமான மாற்று.
- source_word: הַגּוֹרָל הַשֵּׁנִי
  choice: இரண்டாவது சீட்டு
  rationale: நிலப்பங்கீட்டிற்காகக் குலுக்கப்பட்ட சீட்டையே குறிக்கிறது; கிடைத்த நிலப்பங்கை அல்ல. ordinal-ஐ நேரடியாகக் காக்கிறது.
- source_word: לְשִׁמְעוֹן
  choice: சிமியோனுக்கு
  rationale: לְ இங்கு சீட்டைப் பெறுபவரைக் குறிக்கிறது; தமிழில் நான்காம் வேற்றுமை இயல்பாக இதை வெளிப்படுத்துகிறது.
- source_word: לְמַטֵּה בְנֵי שִׁמְעוֹן
  choice: சிமியோனின் மகன்களுடைய கோத்திரத்துக்கு
  rationale: מַטֶּה என்பதைக் கோத்திரப் பங்கீட்டுச் சூழலில் ‘கோத்திரம்’ எனவும், בְנֵי என்ற குடும்பவழிச் சொல்லாட்சியை ‘மகன்கள்’ எனவும் காக்கிறது.
- source_word: לְמִשְׁפְּחוֹתָם
  choice: அவர்களுடைய குலங்களின்படி
  rationale: מִשְׁפָּחוֹת இங்கு இன்றைய தனிக்குடும்பங்களை விடப் பெரிய சமூக உட்பிரிவுகளைக் குறிப்பதால் ‘குலங்கள்’ பொருத்தமானது.
- source_word: נַחֲלָתָם
  choice: அவர்களுடைய உரிமைப்பங்கு
  rationale: நிலமாகக் கிடைத்த மரபுரிமை சார்ந்த பங்கைக் குறிக்கிறது. நவீனத் தமிழில் ‘சுதந்தரம்’ என்பதால் ஏற்படக்கூடிய ‘விடுதலை’ என்ற குழப்பத்தைத் தவிர்த்து, சட்ட மற்றும் பங்கீட்டு உணர்வைத் தருகிறது.
- source_word: בְּתוֹךְ
  choice: உரிமைப்பங்கிற்குள்
  rationale: சிமியோனின் நிலப்பங்கு யூதாவின் நிலப்பரப்புக்குள் அமைந்திருந்ததைத் தெளிவாகக் காட்டுகிறது.
- source_word: נַחֲלַת בְּנֵי יְהוּדָה
  choice: யூதாவின் மகன்களுடைய உரிமைப்பங்கு
  rationale: נַחֲלָה என்பதற்கு முன்போலவே ‘உரிமைப்பங்கு’ என ஒருமையாக மொழிபெயர்த்து, בְנֵי என்ற எபிரெயக் கோத்திரச் சொல்லாட்சியையும் காக்கிறது.
