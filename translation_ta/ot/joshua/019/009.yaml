  edition: WLC
  text: מֵ/חֶ֨בֶל֙ בְּנֵ֣י יְהוּדָ֔ה נַחֲלַ֖ת בְּנֵ֣י שִׁמְע֑וֹן כִּֽי הָיָ֞ה חֵ֤לֶק בְּנֵֽי יְהוּדָה֙ רַ֣ב מֵ/הֶ֔ם וַ/יִּנְחֲל֥וּ בְנֵֽי שִׁמְע֖וֹן בְּ/ת֥וֹךְ נַחֲלָתָֽ/ם־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/009.yaml
  text: From the portion of the sons of Judah came the inheritance of the sons of Simeon[a], because the share of the sons of Judah was too large for them[c][b]; so the sons of Simeon received their inheritance within Judah's inheritance.
translation:
  language: ta
  text: யூதாவின் வழிவந்தவர்களின் நிலப்பகுதியிலிருந்தே[a] சிமியோனின் வழிவந்தவர்களுக்கான உரிமை நிலம் கிடைத்தது[b]. ஏனெனில், யூதாவின் வழிவந்தவர்களுக்குக் கிடைத்த பங்கு அவர்களுக்கு மிகுதியாக இருந்தது. ஆகவே, சிமியோனின் வழிவந்தவர்கள் யூதாவின் உரிமை நிலத்துக்குள்ளேயே தங்கள் உரிமை நிலத்தைப் பெற்றார்கள்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘நிலப்பகுதி’ என்பதற்கு ‘அளந்து வரையறுக்கப்பட்ட நிலப்பரப்பு’ என்றும் பொருள் கொள்ளலாம்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில் நேரடியாக ‘யூதாவின் மகன்கள்’, ‘சிமியோனின் மகன்கள்’ என்று உள்ளது; இவை முறையே யூதா கோத்திரத்தாரையும் சிமியோன் கோத்திரத்தாரையும் குறிக்கும் வம்சப் பெயர்கள்.
    reason: lexical_alternative
  - marker: c
    text: அதாவது, சிமியோனுக்குப் பங்காகக் கிடைத்த நிலம் யூதாவுக்குப் பங்காகக் கிடைத்த நிலப்பரப்பின் எல்லைக்குள் இருந்தது.
    reason: cultural_note
lexical_decisions:
- source_word: מֵ/חֶבֶל
  choice: நிலப்பகுதியிலிருந்தே
  rationale: חֶבֶל என்பது அளந்து வரையறுக்கப்பட்ட நிலப்பகுதியைக் குறிக்கிறது. ‘நிலப்பகுதி’ என்பது இந்த நிலப் பங்கீட்டுச் சூழலில் இயல்பாகவும் தெளிவாகவும் உள்ளது; ‘-இலிருந்தே’ மூலத்தின் מִן உறவையும் வலியுறுத்துகிறது.
- source_word: נַחֲלַת / נַחֲלָתָם
  choice: உரிமை நிலம்
  rationale: נַחֲלָה இங்கு பரம்பரை உரிமையாகப் பெறப்பட்ட நில ஒதுக்கீட்டைக் குறிக்கிறது. ‘உரிமை நிலம்’ நவீன தமிழில் புரிந்துகொள்ள எளிதாக இருந்து, இது வெறும் பொதுவான சொத்து அல்ல, நிலம் என்பதை வெளிப்படுத்துகிறது.
- source_word: בְּנֵי יְהוּדָה / בְּנֵי שִׁמְעוֹן
  choice: யூதாவின் வழிவந்தவர்கள் / சிமியோனின் வழிவந்தவர்கள்
  rationale: בְּנֵי என்பதன் நேரடிப் பொருள் ‘மகன்கள்’ என்றாலும், இங்கு அது முழுக் கோத்திர மக்களையும் குறிக்கும் வம்ச அடையாளம். ‘வழிவந்தவர்கள்’ அந்த வம்சத் தொடர்பைத் தக்கவைத்து, ஆண்களை மட்டும் குறிப்பதாகத் தவறாகப் புரிந்துகொள்ளப்படுவதைத் தவிர்க்கிறது.
- source_word: חֵלֶק
  choice: பங்கு
  rationale: חֵלֶק என்பது ஒதுக்கப்பட்ட பகுதியைக் குறிக்கிறது. அருகிலுள்ள חֶבֶל மற்றும் נַחֲלָה ஆகிய சொற்களிலிருந்து தமிழிலும் வேறுபாட்டை ஓரளவு காக்க ‘பங்கு’ பயன்படுத்தப்பட்டது.
- source_word: רַב מֵ/הֶם
  choice: அவர்களுக்குத் தேவையானதைவிட மிகப் பெரிதாக இருந்தது
  rationale: இந்த ஒப்பீட்டுத் தொடர் யூதாவுக்குக் கிடைத்த பங்கு அவர்களுக்கு வேண்டிய அளவை மீறியதாக இருந்ததைச் சுட்டுகிறது. தமிழில் காரணத்தை இயல்பாக வெளிப்படுத்த இவ்வாறு மொழிபெயர்க்கப்பட்டது.
- source_word: וַ/יִּנְחֲלוּ
  choice: தங்கள் உரிமை நிலத்தைப் பெற்றார்கள்
  rationale: נחל வினை இங்கு ஒதுக்கப்பட்ட பரம்பரை நிலத்தை உடைமையாகப் பெறுவதைக் குறிக்கிறது. ‘பெற்றார்கள்’ தெளிவான நவீன தமிழ் நடை.
- source_word: בְּ/תוֹךְ
  choice: உள்ளேயே
  rationale: בְּתוֹךְ யூதாவின் நில எல்லைக்குள் சிமியோனின் உரிமை நிலம் இருந்த இடவுறவைக் குறிக்கிறது. ‘உள்ளேயே’ இதைச் சுருக்கமாகவும் தெளிவாகவும் தெரிவிக்கிறது.
