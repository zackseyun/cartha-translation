translation_notes:
  register: நவீனத் தரத் தமிழில், நிலப் பங்கீட்டுச் சூழலைத் தெளிவுபடுத்தும் கண்ணியமான நடை பயன்படுத்தப்பட்டது. ‘சுதந்தரம்’ போன்ற இன்றைய வாசகர்களுக்கு வேறு பொருள் தரக்கூடிய சொல்லுக்குப் பதிலாக ‘உரிமை நிலம்’ தேர்ந்தெடுக்கப்பட்டது. இறுதியிலுள்ள எபிரெயப் பன்மைச் சுட்டுப்பெயரின் சூழல்சார் முன்னிலையைத் தெளிவுபடுத்த ‘யூதாவின் உரிமை நிலம்’ என்று வெளிப்படையாகக் கூறப்பட்டது.
