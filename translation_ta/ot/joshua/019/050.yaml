  text: עַל פִּ֨י יְהוָ֜ה נָ֣תְנוּ ל֗/וֹ אֶת הָ/עִיר֙ אֲשֶׁ֣ר שָׁאָ֔ל אֶת תִּמְנַת סֶ֖רַח בְּ/הַ֣ר אֶפְרָ֑יִם וַ/יִּבְנֶ֥ה אֶת הָ/עִ֖יר וַ/יֵּ֥שֶׁב בָּֽ/הּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/050.yaml
  text: At the command of Yahweh they gave him the city that he asked for[a], Timnath-serah in the hill country of Ephraim. He built the city and lived in it.
translation:
  language: ta
  text: யாவேயின் கட்டளைப்படி, அவன் கேட்ட எப்பிராயீமின் மலைநாட்டிலுள்ள திம்னாத்-சேரா நகரத்தை அவர்கள் அவனுக்குக் கொடுத்தார்கள். அவன் அந்த நகரத்தைக் கட்டினான்[a]; அதில் குடியிருந்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது: ‘அந்த நகரத்தை மீண்டும் கட்டினான்’ அல்லது ‘சீரமைத்தான்.’ எபிரெய வினைச்சொல்லின் அடிப்படைப் பொருள் ‘கட்டினான்’; நகரம் ஏற்கெனவே இருந்ததாகத் தோன்றும் சூழலின் அடிப்படையில் மீள்கட்டுதல் அல்லது சீரமைத்தல் என்றும் புரிந்துகொள்ளலாம்.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל פִּי יְהוָה
  choice: யாவேயின் கட்டளைப்படி
  rationale: עַל־פִּי என்பது சொற்படியாக ‘வாயின்படி’ என்றாலும், இங்கு அதிகாரப்பூர்வமான கட்டளை அல்லது வழிநடத்துதலைக் குறிக்கும் எபிரெய மொழிமரபு. ‘கட்டளைப்படி’ என்பது இயல்பான நவீனத் தமிழ்; יְהוָה என்ற தனிப்பெயர் ‘யாவே’ என்று ஒலிபெயர்க்கப்பட்டது.
- source_word: נָתְנוּ לוֹ
  choice: அவர்கள் அவனுக்குக் கொடுத்தார்கள்
  rationale: נתן என்பதன் நேரான பொருள் ‘கொடு’. பன்மை எழுவாயும் ஒருமை மறைமுகச் செயப்படுபொருளும் தமிழில் தெளிவாகப் பாதுகாக்கப்பட்டுள்ளன.
- source_word: הָעִיר אֲשֶׁר שָׁאָל
  choice: அவன் கேட்ட நகரமாகிய
  rationale: שׁאל இங்கு ஒன்றைக் கேட்டுப் பெற விரும்புவதைக் குறிக்கிறது. ‘அவன் கேட்ட நகரம்’ என்பது எபிரெய உறவுத்தொடரின் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: תִּמְנַת סֶרַח
  choice: திம்னாத்-சேரா
  rationale: இடப்பெயர் மொழிபெயர்க்கப்படாமல் தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளது; இரு கூறுகளின் தொடர்பை இணைப்புக்குறி காட்டுகிறது.
- source_word: בְּהַר אֶפְרָיִם
  choice: எப்பிராயீமின் மலைநாட்டிலுள்ள
  rationale: הַר இங்கு தனி மலையைவிட மலைப்பாங்கான பிரதேசத்தைக் குறிக்கிறது. ஆகவே ‘மலைநாடு’ புவியியல் பொருளைத் தெளிவாகத் தருகிறது.
- source_word: וַיִּבְנֶה אֶת הָעִיר
  choice: அவன் அந்த நகரத்தைக் கட்டினான்
  rationale: בנה என்பதன் அடிப்படைப் பொருள் ‘கட்டு’. ஏற்கெனவே இருந்த நகரம் என்பதால் ‘புதுப்பித்துக் கட்டினான்’ என்பது சூழலில் சாத்தியமானாலும், மூலச்சொல்லின் திறந்த தன்மையை முதன்மை உரை பாதுகாக்கிறது.
- source_word: וַיֵּשֶׁב בָּהּ
  choice: அதில் குடியிருந்தான்
  rationale: ישׁב இங்கு ஒரு இடத்தில் வசித்தல் அல்லது குடியேறுதலைக் குறிக்கிறது. ‘குடியிருந்தான்’ என்பது கண்ணியமான, இயல்பான நவீனத் தமிழ்.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை வழங்குதல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூல உரையில் பொதுப்பட்டம் அல்லாமல் நான்கெழுத்து இறைத்தனிப்பெயர் நேரடியாக உள்ளது. அதனால் அதை ஒரு பட்டத்தால் மாற்றாமல் தமிழில் ‘யாவே’ என்று ஒலிபெயர்ப்பது மூலத்தின் தனிப்பெயர்த் தன்மையைப் பாதுகாக்கிறது.
- issue: நகரத்தைக் ‘கட்டினான்’ அல்லது ‘புதுப்பித்துக் கட்டினான்’
  choice: கட்டினான்
  alternative: புதுப்பித்துக் கட்டினான்
  rationale: בנה என்ற வினையின் நேரடிப் பொருள் ‘கட்டுதல்’. நகரம் ஏற்கெனவே பெயரிடப்பட்டு யோசுவாவுக்குக் கொடுக்கப்பட்டதால் மீள்கட்டுதல் அல்லது சீரமைத்தல் சூழலுக்கு ஏற்ற சாத்தியம்; இருப்பினும் அந்தச் சூழல் விளக்கத்தை முதன்மை உரைக்குள் கட்டாயமாக்காமல் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. எபிரெய வாக்கியத்தின் நிகழ்வுவரிசை காக்கப்பட்டு, நீண்ட இடப்பெயர்த் தொடர் தமிழில் இயல்பாக அமைக்கப்பட்டது. உண்மையான சொற்பொருள்–சூழற்பொருள் வேறுபாடு அடிக்குறிப்பில் வெளிப்படையாகப் பாதுகாக்கப்பட்டுள்ளது.
