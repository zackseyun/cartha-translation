lexical_decisions:
- source_word: אֲדָמָה
  choice: அதாமா
  rationale: நகரங்களின் பட்டியலில் வரும் இடப்பெயர். பொதுப்பெயரான ‘நிலம்/மண்’ என்று பொருளாக்காமல், எபிரெய ஒலிப்புக்கு ஏற்ப தமிழில் எழுத்துப்பெயர்க்கப்பட்டது.
- source_word: הָרָמָה
  choice: ராமா
  rationale: முன்னொட்டுக் குறிப்புச் சுட்டுடன் வரும் இடப்பெயர். தமிழில் இயல்பான இடப்பெயர் வடிவத்திற்காக அந்தச் சுட்டு தனியாக மொழிபெயர்க்கப்படவில்லை; பெயர் எழுத்துப்பெயர்க்கப்பட்டது.
- source_word: חָצוֹר
  choice: ஆசோர்
  rationale: நகரப் பட்டியலில் வரும் இடப்பெயர். எபிரெய ח ஒலியைத் தமிழில் இயல்பாக ‘ஆ’ தொடக்கத்தாலும், צ ஒலியை ‘ச’ என்பதாலும் பிரதிபலித்து எழுத்துப்பெயர்க்கப்பட்டது.
- source_word: וְ
  choice: மேலும் பட்டியலுக்குரிய காற்புள்ளி இணைப்பு
  rationale: எபிரெயில் ஒவ்வொரு பெயரையும் இணைக்கும் וְ, தமிழின் இயல்பான சுருக்கமான பெயர்ப்பட்டியலில் காற்புள்ளிகளால் வெளிப்படுத்தப்படுகிறது; இறுதியில் தனியாக ‘மற்றும்’ சேர்ப்பது அவசியமில்லை.
