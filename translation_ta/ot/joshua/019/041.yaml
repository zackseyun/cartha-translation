lexical_decisions:
- source_word: וַיְהִי
  choice: இருந்தது
  rationale: எபிரெயக் கதைநடையின் தொடர்ச்சியைத் தமிழில் இயல்பான இறந்தகால வினையால் வெளிப்படுத்துகிறது; தனியாக ‘அப்பொழுது’ அல்லது ‘ஆகியது’ என்று சேர்ப்பது தேவையில்லை.
- source_word: גְּבוּל
  choice: எல்லை
  rationale: நிலப் பங்கீட்டுச் சூழலில் இது குலத்துக்குரிய பகுதியின் எல்லையைக் குறிக்கிறது. தொடர்ந்து வரும் ஊர்ப்பெயர்கள் எல்லைக்குட்பட்ட இடங்களைச் சுட்டுவதால், தமிழில் இயல்புக்காக ‘உள்ளடக்கியிருந்தது’ என அமைக்கப்பட்டுள்ளது.
- source_word: נַחֲלָתָם
  choice: அவர்களுடைய உரிமைச் சொத்து
  rationale: נַחֲלָה என்பது குலத்துக்கு மரபுரிமையாகப் பங்கிடப்பட்ட நிலத்தைக் குறிக்கிறது. ‘உரிமைச் சொத்து’ அதன் நிலையான உரிமை நுணுக்கத்தை நவீன தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: צָרְעָה
  choice: சோரா
  rationale: எபிரெய இடப்பெயரின் தமிழ் ஒலிபெயர்ப்பு.
- source_word: אֶשְׁתָּאוֹל
  choice: எஷ்தாவோல்
  rationale: எபிரெய இடப்பெயரின் தமிழ் ஒலிபெயர்ப்பு.
- source_word: עִיר שָׁמֶשׁ
  choice: ஈர்-சேமேஷ்
  rationale: இடப்பெயர் மொழிபெயர்க்கப்படாமல் எபிரெய ஒலிப்புக்கு அருகாகத் தரப்படுகிறது; அதன் வெளிப்படையான பொருள் அடிக்குறிப்பில் வழங்கப்படுகிறது.
