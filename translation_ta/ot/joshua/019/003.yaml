  choice: அட்சார்-சூவால்
  rationale: இது חצר (‘குடியிருப்பு/அடைப்பு’) மற்றும் שועל (‘நரி/குள்ளநரி’) ஆகிய சொற்கள் சேர்ந்த இடப்பெயர். பொருளை மொழிபெயர்க்காமல், எபிரெய மசோரா உச்சரிப்பைத் தமிழில் ஒலிபெயர்த்து, கூட்டுப் பெயர் என்பதைக் காட்ட இடைக்கோடு வைக்கப்பட்டுள்ளது.
