- source_word: עָצֶם
  choice: ஏசெம்
  rationale: மசோரா உயிர்க்குறிப்பை அண்மையாகப் பிரதிபலிக்கும் தமிழ் ஒலிபெயர்ப்பு; தொடர்புடைய இடங்களில் காணப்படும் மாற்று வடிவத்தை இங்கு முதன்மைப்படுத்தவில்லை.
- source_word: וּ / וָ
  choice: ஆகிய ஊர்களும்
  rationale: இது தொடரும் பட்டியலின் ஒரு பகுதி என்பதால், எபிரெய இணைப்புச் சொற்களின் கூட்டும் தன்மையை இயல்பான தமிழில் காட்ட ‘ஆகிய ஊர்களும்’ என வழங்கப்பட்டுள்ளது.
