lexical_decisions:
- source_word: אֶלְתּוֹלַד
  choice: எல்தோலாத்
  rationale: நகரப் பட்டியலில் வரும் இடப்பெயர். எபிரெய ஒலிவடிவத்தை நவீனத் தமிழில் இயல்பாக எழுத்துப்பெயர்த்துள்ளது.
- source_word: בְתוּל
  choice: பெத்தூல்
  rationale: இடப்பெயர். நடுவிலுள்ள תּ-ஐ இரட்டித்த ‘த்’ மூலமும், நீண்ட וּ ஒலியை ‘ஊ’ மூலமும் பிரதிபலிக்கும் தமிழ் எழுத்துப்பெயர்ப்பு.
- source_word: חָרְמָה
  choice: ஓர்மா
  rationale: இடப்பெயர். எபிரெய ח ஒலிக்குத் தமிழில் துல்லியமான இணை இல்லாததால், அதன் மென்மையான தொண்டை உரசொலியை இங்கு உயிர்முதலாக ‘ஓ’ என இயல்பாக எழுத்துப்பெயர்த்துள்ளது; பெயரின் வேர்ப்பொருள் மொழிபெயர்க்கப்படவில்லை.
- source_word: וְ / וּ
  choice: ஆகிய
  rationale: ஒவ்வொரு பெயரையும் இணைக்கும் எபிரெய இணைப்புச் சொற்களை, தமிழ் நகரப் பட்டியலுக்கு இயல்பான முறையில் இறுதியில் ‘ஆகிய’ என்று தொகுத்து வழங்குகிறது.
