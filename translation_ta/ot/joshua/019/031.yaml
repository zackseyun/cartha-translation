base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/031.yaml
  text: This was the inheritance of the tribe of the sons of Asher according to their clans—these cities and their settlements[a][b].
translation:
  language: ta
  text: ஆசேரின் வழிவந்தோருடைய கோத்திரத்துக்கு, அவர்களுடைய குலங்களின்படி, பரம்பரை உரிமையாகக் கிடைத்த பங்கு இதுவே—இந்த நகரங்களும் அவற்றைச் சேர்ந்த குடியிருப்புகளும்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அவற்றின் கிராமங்களும்” என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல், பட்டியலிடப்பட்ட நகரங்களைச் சார்ந்திருந்த சிறிய ஊரகக் குடியிருப்புகளைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹאת
  choice: இதுவே
  rationale: எபிரெய மொழியின் சுட்டுப்பெயரைக் காலத்தைத் தனியாக நிர்ணயிக்காத இயல்பான தமிழ் பெயர்வாக்கியமாக அளிக்கிறது; இதனால் நிகழ்கால வடிவத்தின் நெருக்கமும் கதைச்சுருக்கச் சூழலும் பாதுகாக்கப்படுகின்றன.
- source_word: נַחֲלַת
  choice: பரம்பரை உரிமையாகக் கிடைத்த பங்கு
  rationale: நிலப் பகிர்வுச் சூழலில் இது வெறும் ஒதுக்கீட்டை மட்டுமல்லாமல், மரபுரிமையாகப் பெறப்பட்ட நிலப்பங்கையும் குறிக்கிறது.
- source_word: מַטֵּה
  choice: கோத்திரம்
  rationale: இங்கு இச்சொல் கைத்தடியைக் குறிக்காமல் இஸ்ரவேலின் கோத்திர அமைப்பைக் குறிக்கிறது; தமிழ் வேதாகம நடையில் புரிந்துகொள்ளத்தக்க வழக்குச் சொல்.
- source_word: בְנֵי אָשֵׁר
  choice: ஆசேரின் வழிவந்தோர்
  rationale: எபிரெய மொழியின் மகன்கள் என்ற குல அடையாளச் சொல்லை, ஆண்களை மட்டும் குறிக்கும் தவறான எண்ணத்தைத் தவிர்த்து, ஆசேரின் சந்ததியார் என்ற பொருளில் இயல்பான தமிழில் தருகிறது.
- source_word: לְמִשְׁפְּחֹתָם
  choice: அவர்களுடைய குலங்களின்படி
  rationale: கோத்திரத்துக்குள் உள்ள குலப் பிரிவுகளுக்கேற்ப நிலம் பகிரப்பட்ட விநியோகப் பொருளை வெளிப்படுத்துகிறது.
- source_word: הֶעָרִים הָאֵלֶּה
  choice: இந்த நகரங்கள்
  rationale: பட்டியலிடப்பட்ட குடியமைந்த இடங்களுக்கான எபிரெய பொதுச் சொல்லை நேரடியாகவும் மரியாதைமிக்க நவீன தமிழிலும் தருகிறது.
- source_word: וְחַצְרֵיהֶן
  choice: அவற்றைச் சேர்ந்த குடியிருப்புகள்
  rationale: முக்கிய நகரங்களைச் சார்ந்திருந்த, பெரும்பாலும் மதிலற்ற சிறிய ஊரக இடங்களைக் குறிக்கும் சொல்லின் பரந்த பொருளைப் பாதுகாக்கிறது.
