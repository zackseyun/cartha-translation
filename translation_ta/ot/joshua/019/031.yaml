  register: நவீன நிலையான தமிழ்; நிலப் பகிர்வின் சட்டபூர்வ மற்றும் மரபுரிமை நுணுக்கத்தைப் பாதுகாக்கும் கண்ணியமான, பொதுவாசகர்களுக்குப் புரியக்கூடிய நடை. எபிரெய பெயர்வாக்கியத்தின் காலத் தெளிவின்மையை “இதுவே” இயல்பாகப் பாதுகாக்கிறது.
