  source_fidelity: 'The translation represents every element of the Hebrew formula: the demonstrative summary, the inherited territorial portion, Asher''s tribal descendants, the clan qualification, and the listed cities with their dependent settlements. “இதுவே” appropriately retains the Hebrew nominal clause without forcing a tense.'
