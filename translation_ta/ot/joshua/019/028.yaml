lexical_decisions:
- source_word: עֶבְרֹן
  choice: எப்ரோன்
  rationale: மசோரா எபிரெய உரையின் மெய்யெழுத்து வடிவத்தை நேரடியாகப் பிரதிபலிக்கும் இடப்பெயர் ஒலிபெயர்ப்பு; மாற்று வாசகம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: רְחֹב
  choice: ரெகோப்
  rationale: எபிரெய இடப்பெயரின் ஒலியை நவீனத் தமிழில் இயல்பாகப் பிரதிபலிக்கிறது.
- source_word: חַמּוֹן
  choice: அம்மோன்
  rationale: தொடக்க எபிரெய ח ஒலியைத் தமிழில் இயல்பாக விடுத்து, பெயரின் முக்கிய ஒலியமைப்பைப் பேணும் மரபான ஒலிபெயர்ப்பு.
- source_word: קָנָה
  choice: கானா
  rationale: இடப்பெயரை வாசிக்க எளிதான நவீனத் தமிழ் ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: עַד
  choice: வரை
  rationale: நிலப்பகுதியின் எல்லை அல்லது சென்றடைந்த தொலைவைச் சுருக்கமாகவும் இயல்பாகவும் குறிக்கிறது.
- source_word: צִידוֹן רַבָּה
  choice: பெரிய சீதோன்
  rationale: רַבָּה என்ற பெயரடை சீதோனைச் சிறப்பிக்கும் அமைப்பைப் பேணி, முக்கிய நகரம் என்ற பொருளை இயல்பான தமிழில் தருகிறது.
