lexical_decisions:
- source_word: צִקְלַג
  choice: சிக்லாக்
  rationale: இது ஓர் ஊர்ப்பெயர்; எபிரெய ஒலிப்புக்கு நெருக்கமாகத் தமிழில் ஒலிபெயர்க்கப்பட்டது.
- source_word: בֵית הַמַּרְכָּבוֹת
  choice: பெத்-மர்காபோத்
  rationale: ‘வீடு’ மற்றும் ‘தேர்கள்’ என்ற கூறுகளைக் கொண்ட கூட்டு ஊர்ப்பெயர். இது ஊர்களின் பட்டியல் என்பதால், பொருளாக்காமல் ஒலிபெயர்க்கப்பட்டது; அதன் சாத்தியமான பொருள் அடிக்குறிப்பில் தரப்பட்டது.
- source_word: חֲצַר סוּסָה
  choice: அசார்-சூசா
  rationale: இது குடியிருப்பு அல்லது அடைப்பு, குதிரை ஆகிய கருத்துகளுடன் தொடர்புடைய கூட்டு ஊர்ப்பெயர். பட்டியலில் ஊர்ப்பெயராக இருப்பதால் ஒலிபெயர்க்கப்பட்டு, சொற்பொருள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டது.
- source_word: וְ / וּ / וַ
  choice: ஆகிய ஊர்களும்
  rationale: எபிரெய இணைப்பிடைச்சொற்கள் பட்டியலின் முந்தைய மற்றும் இவ்வசனத்திலுள்ள பெயர்களை இணைக்கின்றன. இயல்பான தமிழ்ப் பட்டியல் நடைக்காக இறுதியில் ‘ஆகிய ஊர்களும்’ எனத் தொகுத்து வழங்கப்பட்டது.
