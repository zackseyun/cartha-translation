lexical_decisions:
- source_word: אֵילוֹן
  choice: அயலோன்
  rationale: நகரத்தின் பெயரை மொழிபெயர்க்காமல், எபிரெய ஒலிப்புக்கு நெருக்கமாகவும் நவீனத் தமிழில் இயல்பாகவும் ஒலிபெயர்த்துள்ளது.
- source_word: תִמְנָתָה
  choice: திம்னா
  rationale: இது ஓர் இடப்பெயர். இறுதியில் திசை அல்லது இடநோக்கைக் குறிக்கக்கூடிய வடிவக் கூறு இருந்தாலும், நகரப் பட்டியலில் வழக்கமான பெயருருவான ‘திம்னா’ பயன்படுத்தப்பட்டுள்ளது; முழுமையான ஒலிபெயர்ப்பு அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: עֶקְרוֹן
  choice: எக்ரோன்
  rationale: எபிரெய இடப்பெயரின் நேரடியான, தமிழில் தெளிவான ஒலிபெயர்ப்பு.
- source_word: וְ
  choice: -உம்
  rationale: ஒவ்வொரு பெயருக்கும் முன் திரும்பத் திரும்ப வரும் எபிரெய இணைப்புச் சொல்லை, தமிழ்ப் பட்டியலில் இயல்பான இணைப்பும்மையான ‘-உம்’ கொண்டு ஒவ்வொரு பெயரிலும் பிரதிபலித்துள்ளது.
