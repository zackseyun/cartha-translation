  rationale: இவை பட்டியலிலுள்ள பெயர்களை இணைக்கும் முன்னொட்டுகள். தமிழில் குறுகிய நகரப் பட்டியலைக் காற்புள்ளிகளால் வழங்குவது இயல்பாக இருப்பதால் தனியாக ‘மற்றும்’ சேர்க்கப்படவில்லை.
