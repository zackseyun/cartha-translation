  text: וְ/עֻמָ֥ה וַ/אֲפֵ֖ק וּ/רְחֹ֑ב עָרִ֛ים עֶשְׂרִ֥ים וּ/שְׁתַּ֖יִם וְ/חַצְרֵי/הֶֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/030.yaml
  text: 'Ummah[a], Aphek, and Rehob: twenty-two cities, with their villages.'
translation:
  language: ta
  text: உம்மா, ஆப்பெக், ரெகோப் ஆகிய இருபத்திரண்டு பட்டணங்களும், அவற்றைச் சேர்ந்த கிராமங்களும்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவற்றைச் சேர்ந்த குடியிருப்புகள்” அல்லது “அவற்றைச் சேர்ந்த சிற்றூர்கள்”; எபிரெயச் சொல் பட்டியலிடப்பட்ட பட்டணங்களைச் சார்ந்த ஊரக இடங்களைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֻמָה
  choice: உம்மா
  rationale: பட்டணப் பெயர் என்பதால் மொழிபெயர்க்காமல், எபிரெய ஒலிப்புக்கு நெருக்கமாகத் தமிழில் ஒலிபெயர்க்கப்பட்டது.
- source_word: אֲפֵק
  choice: ஆப்பெக்
  rationale: இடப்பெயர் என்பதால் எபிரெய உச்சரிப்பைப் பிரதிபலிக்கும் வகையில் ஒலிபெயர்க்கப்பட்டது.
- source_word: רְחֹב
  choice: ரெகோப்
  rationale: இடப்பெயர் என்பதால் மொழிபெயர்க்காமல், எபிரெய ஒலிப்புக்கு ஏற்றவாறு தமிழில் வழங்கப்பட்டது.
- source_word: עָרִים
  choice: பட்டணங்கள்
  rationale: இங்கு பட்டியலிடப்படும் குடியிருப்பு மையங்களைக் குறிக்கிறது; அவற்றின் அளவு மாறுபட்டிருக்கலாம் என்பதால் இயல்பான தமிழ் வேதாகமப் பயன்பாடான ‘பட்டணங்கள்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: עֶשְׂרִים וּשְׁתַּיִם
  choice: இருபத்திரண்டு
  rationale: இந்தப் பிரிவிலுள்ள பட்டணங்களின் மொத்த எண்ணிக்கையை நேரடியாகக் குறிக்கிறது.
- source_word: חַצְרֵיהֶן
  choice: அவற்றைச் சேர்ந்த கிராமங்கள்
  rationale: முதன்மைப் பட்டணங்களைச் சார்ந்த ஊரகக் குடியிருப்புகள் அல்லது மதிலற்ற சிற்றூர்களைக் குறிக்கும் உறவைக் தெளிவாக வெளிப்படுத்துகிறது.
theological_decisions: []
translation_notes:
  register: நவீனத் தரத் தமிழில், சுருக்கமான பட்டியல் நடையைப் பேணியுள்ளோம். எபிரெய வசனத்தின் இறுதியில் வரும் ‘இருபத்திரண்டு பட்டணங்களும், அவற்றைச் சேர்ந்த கிராமங்களும்’ என்ற சுருக்க அமைப்பு தமிழில் இயல்பாக அமைய ‘ஆகிய’ பயன்படுத்தப்பட்டுள்ளது.
