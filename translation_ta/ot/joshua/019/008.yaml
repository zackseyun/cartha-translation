base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/008.yaml
  text: along with all the villages that were around these cities[a], as far as Baalath-beer, Ramath-negeb. This was the inheritance of the tribe of the sons of Simeon according to their clans.
translation:
  language: ta
  text: 'மேலும், இந்த நகரங்களைச் சுற்றியிருந்த எல்லாக் கிராமங்களும் பாலாத்-பேர், ராமாத்-நெகேப்[a] வரையிலும் இருந்தன. இதுவே சிமியோனின் சந்ததியினரின் கோத்திரத்துக்குக் குலங்களின்படி கிடைத்த சுதந்தரப் பங்கு.


    [a] இரண்டாவது பெயர் முதலாவது இடத்தின் மற்றொரு பெயர் எனக் கொண்டு, “பாலாத்-பேர், அதாவது ராமாத்-நெகேப்” என்றும் புரிந்துகொள்ளலாம்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இரண்டாவது பெயர் முதலாவது இடத்தின் மற்றொரு பெயர் எனக் கொண்டு, “பாலாத்-பேர், அதாவது ராமாத்-நெகேப்” என்றும் புரிந்துகொள்ளலாம்.
    reason: எபிரெய உரையில் இரண்டு இடப்பெயர்களுக்கிடையிலான இலக்கண உறவு வெளிப்படையாகக் குறிக்கப்படவில்லை; ராமாத்-நெகேப் என்பது பாலாத்-பேரின் மாற்றுப் பெயராக இருக்கக்கூடும்.
lexical_decisions:
- source_word: וְכָל הַחֲצֵרִים
  choice: எல்லாக் கிராமங்களும்
  rationale: חָצֵר என்பது இத்தகைய நிலப்பங்கீட்டுப் பட்டியல்களில் மதிலற்ற சிற்றூர்களையோ நகரங்களைச் சார்ந்த கிராமங்களையோ குறிக்கிறது. முந்தைய பட்டியலுடன் இணைக்கும் וְ என்பதன் தொடர்ச்சிப் பொருளை வாக்கிய அமைப்பு வெளிப்படுத்துகிறது.
- source_word: אֲשֶׁר סְבִיבוֹת הֶעָרִים הָאֵלֶּה
  choice: இந்த நகரங்களைச் சுற்றியிருந்த
  rationale: கிராமங்கள் முன்பு குறிப்பிடப்பட்ட நகரங்களைச் சுற்றி அமைந்திருந்ததை இயல்பான நவீன தமிழில் தெரிவிக்கிறது; הָאֵלֶּה என்பதன் அண்மைச் சுட்டும் காக்கப்படுகிறது.
- source_word: עַד
  choice: வரையிலும்
  rationale: இங்கு நிலப்பரப்பின் எல்லை அல்லது விரிவைக் குறிக்கும் பொருளைத் தெளிவாக வழங்குகிறது.
- source_word: בַּעֲלַת בְּאֵר
  choice: பாலாத்-பேர்
  rationale: இடப்பெயரைப் பொருள் மொழிபெயர்ப்பு செய்யாமல் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: רָאמַת נֶגֶב
  choice: ராமாத்-நெகேப்
  rationale: இது தனி இடப்பெயரா அல்லது பாலாத்-பேரை அடையாளப்படுத்தும் மாற்றுப் பெயரா என்பது தெளிவாக இல்லாததால், விளக்கமாக மொழிபெயர்க்காமல் ஒலிபெயர்க்கப்படுகிறது.
- source_word: נַחֲלַת
  choice: உரிமைப் பங்கு
  rationale: யோசுவாவில் இந்தச் சொல் கோத்திரத்துக்குக் கிடைத்த மரபுரிமையான நிலப்பங்கைக் குறிக்கிறது; நவீன வாசகர்களுக்கு இயல்பாகவும் சட்டப்பூர்வப் பங்கு என்ற நுணுக்கத்துடனும் உள்ளது.
- source_word: מַטֵּה בְנֵי שִׁמְעוֹן
  choice: சிமியோனின் வழிவந்தவர்களுடைய கோத்திரத்திற்கு
  rationale: מַטֶּה என்பதைக் கோத்திரம் எனவும், ‘சிமியோனின் மகன்கள்’ என்ற மரபுவழிச் சொல்லாட்சியை அதன் வம்சவழிப் பொருள் தெளிவாகத் தெரியுமாறு வழங்குகிறது.
- source_word: לְמִשְׁפְּחֹתָם
  choice: குலங்களின்படி
  rationale: கோத்திரத்திற்குள் உள்ள குடும்ப-குலப் பிரிவுகளின் அடிப்படையில் நிலம் பகிரப்பட்டதைக் குறிக்கிறது.
