translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. தொடக்க இணைப்பை இயல்பாக்க ‘இதில் அடங்கின’ என்பது சூழலிலிருந்து நிரப்பப்பட்டுள்ளது. இடப்பெயர்களுக்கிடையிலான உண்மையான தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
