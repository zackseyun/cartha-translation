translation_notes:
  register: நவீன தரத் தமிழில், எல்லைக்கோட்டின் நகர்வைத் தெளிவாகப் பின்தொடரக்கூடிய ஒரே வாக்கியமாக அமைக்கப்பட்டது. இடப்பெயர்கள் மொழிபெயர்க்கப்படாமல் எழுத்துப்பெயர்க்கப்பட்டன. ‘இடப்புறம்’ என்ற மூல உரையின் நோக்குநிலை சார்ந்த தெளிவின்மை அடிக்குறிப்புடன் பாதுகாக்கப்பட்டது.
