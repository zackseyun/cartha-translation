revisions:
- from: பின்பு அந்த எல்லை சூரியன் உதிக்கும் கிழக்குத் திசையில் பெத்-தாகோனை நோக்கித் திரும்பி, செபுலோனையும் வடக்கே இப்தா-ஏல் பள்ளத்தாக்கையும் அடைந்து, பெத்-ஏமேக்கையும் நெயியேலையும் கடந்து, காபூலின் இடப்புறமாகச் சென்றது[a].
  to: பின்பு எல்லை சூரிய உதயத் திசையான கிழக்கே பெத்-தாகோனை நோக்கித் திரும்பியது; அது செபுலோனையும் வடக்கே இப்தாக்-ஏல் பள்ளத்தாக்கையும் அடைந்து, பெத்-ஏமேக்கையும் நெயியேலையும் அடைந்து, இடப்புறத்திலிருந்து காபூல் வரை நீண்டது[a].
  rationale: The revision retains every geographical marker and the source’s directional ambiguity, while removing the unsupported sense that the boundary passed through Beth-emek and Neiel. It also renders מִשְּׂמֹאל with its explicit ‘from’ force rather than making Cabul the reference point for ‘left.’
