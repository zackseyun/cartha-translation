  text: וְ/שָׁ֨ב מִזְרַ֣ח הַ/שֶּׁמֶשׁ֮ בֵּ֣ית דָּגֹן֒ וּ/פָגַ֣ע בִּ֠/זְבֻלוּן וּ/בְ/גֵ֨י יִפְתַּח אֵ֥ל צָפ֛וֹנָ/ה בֵּ֥ית הָעֵ֖מֶק וּ/נְעִיאֵ֑ל וְ/יָצָ֥א אֶל כָּב֖וּל מִ/שְּׂמֹֽאל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/027.yaml
  text: Then it turned eastward[a], toward the sunrise, to Beth-dagon, and reached to Zebulun and to the Valley of Iphtah-el northward, to Beth-emek and Neiel; then it went out to Cabul on the left.
translation:
  language: ta
  text: பின்பு எல்லை சூரிய உதயத் திசையான கிழக்கே பெத்-தாகோனை நோக்கித் திரும்பியது; அது செபுலோனையும் வடக்கே இப்தாக்-ஏல் பள்ளத்தாக்கையும் அடைந்து, பெத்-ஏமேக்கையும் நெயியேலையும் அடைந்து, இடப்புறத்திலிருந்து காபூல் வரை நீண்டது[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரேயில் ‘இடப்புறத்திலிருந்து’ என்று உள்ளது. ஒருவர் கிழக்கு நோக்கி நிற்பதாகக் கருதும் புவியியல் வழக்கில் இது வடக்குப் புறத்தைக் குறிக்கலாம்; ஆனால் எந்த நோக்குநிலையிலிருந்து ‘இடப்புறம்’ என்று சொல்லப்படுகிறது என்பது இங்கு வெளிப்படையாகக் கூறப்படவில்லை.
    reason: cultural_note
lexical_decisions:
- source_word: וְשָׁב
  choice: பின்பு அந்த எல்லை ... திரும்பி
  rationale: எல்லை விவரிப்பில் שׁוב என்பது எல்லைக்கோடு திசைமாறுவதைச் சுட்டுகிறது. தமிழில் எழுவாய் தெளிவாக இருக்க ‘அந்த எல்லை’ சேர்க்கப்பட்டது.
- source_word: מִזְרַח הַשֶּׁמֶשׁ
  choice: சூரியன் உதிக்கும் கிழக்குத் திசையில்
  rationale: ‘சூரியன் உதிக்கும் திசை’ என்ற எபிரேய உருவகத்தையும், அதன் புவியியல் பொருளான கிழக்கையும் இயல்பான தமிழில் ஒருங்கிணைக்கிறது.
- source_word: בֵּית דָּגֹן
  choice: பெத்-தாகோன்
  rationale: இடப்பெயர் பொருளாக்கப்படாமல் எபிரேய ஒலிப்புக்கு நெருக்கமாக எழுத்துப்பெயர்க்கப்பட்டது.
- source_word: וּפָגַע
  choice: அடைந்து
  rationale: எல்லைக்கோடு ஒரு பகுதி அல்லது மற்றொரு எல்லையைத் தொடுதல் அல்லது சென்றடைதல் என்ற புவியியல் பயன்பாட்டை இயல்பாகக் காட்டுகிறது.
- source_word: בִּזְבֻלוּן
  choice: செபுலோனை
  rationale: செபுலோன் பகுதியோடு எல்லை தொடர்புகொள்வதைத் தொடரின் வேற்றுமை அமைப்பில் காட்டுகிறது.
- source_word: וּבְגֵי יִפְתַּח אֵל
  choice: இப்தா-ஏல் பள்ளத்தாக்கையும்
  rationale: גֵי என்பதற்கு ‘பள்ளத்தாக்கு’ என மொழிபெயர்த்து, இப்தா-ஏல் என்ற சிறப்புப்பெயரை எழுத்துப்பெயர்க்கிறது.
- source_word: צָפוֹנָה
  choice: வடக்கே
  rationale: திசையைக் குறிக்கும் எபிரேய வினையடையின் இயல்பான தமிழ் இணை.
- source_word: בֵּית הָעֵמֶק
  choice: பெத்-ஏமேக்
  rationale: இடப்பெயர் அதன் சொற்பொருளான ‘பள்ளத்தாக்கின் வீடு’ என்று மொழிபெயர்க்கப்படாமல் எழுத்துப்பெயர்க்கப்பட்டது.
- source_word: וּנְעִיאֵל
  choice: நெயியேலையும்
  rationale: எபிரேய இடப்பெயர் தமிழில் ஒலிப்புக்கு நெருக்கமாக எழுத்துப்பெயர்க்கப்பட்டது.
- source_word: וְיָצָא
  choice: கடந்து ... சென்றது
  rationale: எல்லைக்கோடு குறிப்பிட்ட இடங்களைத் தொடர்ந்து வெளியே நீண்டு செல்வதை இயல்பான தமிழ் எல்லை விளக்க நடையில் தெரிவிக்கிறது.
- source_word: אֶל כָּבוּל
  choice: காபூலின்
  rationale: כָּבוּל என்ற பழங்கால இடப்பெயர் எபிரேய ஒலிப்புக்கு நெருக்கமாக எழுத்துப்பெயர்க்கப்பட்டது; அடுத்துள்ள ‘இடப்புறம்’ என்பதோடு இயல்பாக இணைக்க உடைமை வடிவம் பயன்படுத்தப்பட்டது.
- source_word: מִשְּׂמֹאל
  choice: இடப்புறமாக
  rationale: எபிரேய உரையின் திடமான ‘இடப்புறம்’ என்ற சொல்லைத் தக்கவைக்கிறது; அதை நேரடியாக ‘வடக்கு’ என்று மாற்றி உரையின் நோக்குநிலை சார்ந்த தெளிவின்மையைத் தீர்த்துவிடவில்லை.
