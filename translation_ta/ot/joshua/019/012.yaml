base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/012.yaml
  text: Then it turned back from Sarid eastward[a], toward the sunrise, to the border of Kisloth-tabor, and went out to Daberath and up to Japhia.
translation:
  language: ta
  text: பின்பு எல்லை சாரீதிலிருந்து திரும்பி, கிழக்கே, சூரியன் உதிக்கும் திசையை நோக்கி[a], கிஸ்லோத்-தாபோரின் எல்லைவரை சென்று, தாபெராத்துக்குப் போய், யாப்பியாவுக்கு ஏறிச் சென்றது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘கிழக்கே, கிழக்குத் திசையை நோக்கி’; சொல்லர்த்தமாக, ‘கிழக்கே, சூரியன் உதிக்கும் திசை.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁב
  choice: பின்பு எல்லை ... திரும்பி
  rationale: எல்லை விவரிப்புகளில் שׁוב திசைமாற்றத்தைக் குறிக்கிறது. தமிழில் எழுவாய் தெளிவாக இருக்க ‘எல்லை’ சேர்க்கப்பட்டு, வினை ‘திரும்பி’ என வழங்கப்பட்டது.
- source_word: מִשָּׂרִיד
  choice: சாரீதிலிருந்து
  rationale: இடப்பெயர் எபிரெய உச்சரிப்புக்கு அண்மையாக ஒலிபெயர்க்கப்பட்டது; מִן தொடக்க இடத்தைக் குறிப்பதால் ‘இலிருந்து’ பயன்படுத்தப்பட்டது.
- source_word: קֵדְמָה מִזְרַח הַשֶּׁמֶשׁ
  choice: கிழக்கே, சூரியன் உதிக்கும் திசையை நோக்கி
  rationale: கிழக்குத் திசையைக் குறிக்கும் இரு கூறுகளையும் தட்டையாக்காமல், திசையையும் சூரிய உதய உருவகத்தையும் இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: עַל גְּבוּל
  choice: எல்லைவரை
  rationale: இந்த நிலஎல்லைச் சூழலில் குறித்த எல்லையை அடையும் இயக்கத்தைக் காட்டும் இயல்பான தமிழ் வடிவம்.
- source_word: כִּסְלֹת תָּבֹר
  choice: கிஸ்லோத்-தாபோர்
  rationale: கூட்டு இடப்பெயர் எபிரெய வடிவுக்கு அண்மையாக ஒலிபெயர்க்கப்பட்டு இணைப்புக்கோடு தக்கவைக்கப்பட்டது.
- source_word: וְיָצָא
  choice: அங்கிருந்து ... போய்
  rationale: நிலஎல்லை விவரிப்பில் יצא எல்லைக்கோடு அடுத்த இடத்தை நோக்கிச் செல்வதைக் குறிக்கிறது; தமிழில் இயல்பாக அமைய ‘அங்கிருந்து ... போய்’ என வழங்கப்பட்டது.
- source_word: אֶל הַדָּבְרַת
  choice: தாபெராத்துக்கு
  rationale: குறிப்பிட்ட இடத்தை நோக்கிய இயக்கம் ‘க்கு’ வேற்றுமையால் காட்டப்பட்டது; இடப்பெயர் ஒலிபெயர்க்கப்பட்டது.
- source_word: וְעָלָה
  choice: ஏறிச் சென்றது
  rationale: עלה நிலஅமைப்பில் மேல்நோக்கிய ஏற்றத்தைக் குறிக்கக்கூடும்; அந்த புவியியல் நுணுக்கத்தை வெளிப்படையாகத் தக்கவைக்கிறது.
- source_word: יָפִיעַ
  choice: யாப்பியா
  rationale: இடப்பெயர் எபிரெய உச்சரிப்புக்கு அண்மையாகத் தமிழில் ஒலிபெயர்க்கப்பட்டது.
