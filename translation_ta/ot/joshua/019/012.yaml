  register: நவீனத் தரத் தமிழில், நிலஎல்லை நகர்வைத் தெளிவுபடுத்த ‘எல்லை’ என்ற எழுவாய் வெளிப்படையாகச் சேர்க்கப்பட்டது. இடப்பெயர்கள் எபிரெய வடிவுக்கு அண்மையாக ஒலிபெயர்க்கப்பட்டன; மூலத்தின் திசைச்சொல் இரட்டிப்பும் சூரிய உதய உருவகமும் தக்கவைக்கப்பட்டன.
