lexical_decisions:
- source_word: וַיְהִי
  choice: இருந்தன
  rationale: எல்லைப் பட்டியலைத் தொடரும் היה வினை, இங்கு பட்டியலிடப்பட்ட ஊர்களுடன் இயல்பாகப் பொருந்துமாறு தமிழில் பன்மையாக வழங்கப்பட்டுள்ளது.
- source_word: גְּבוּלָם
  choice: அவர்களுடைய எல்லையில்
  rationale: גְּבוּל என்பது இங்கு அந்தக் கோத்திரத்தின் எல்லை அல்லது எல்லைப் பகுதியைக் குறிக்கிறது. தொடர்ந்து ஊர்கள் பட்டியலிடப்படுவதால், ‘எல்லையில்’ என்பது இயல்பான நவீனத் தமிழ் நடை.
- source_word: חֶלְקַת
  choice: எல்காத்
  rationale: இது ஓர் ஊர்ப்பெயர்; மொழிபெயர்க்காமல் எபிரெய வடிவத்தை அணுகிய தமிழ் ஒலிபெயர்ப்பு பயன்படுத்தப்பட்டுள்ளது.
- source_word: וַחֲלִי
  choice: ஹாலி
  rationale: இது ஓர் ஊர்ப்பெயர். தொடக்க ח ஒலியைத் தெளிவாகக் காட்ட ‘ஹ’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: וָבֶטֶן
  choice: பெத்தேன்
  rationale: ஊர்ப்பெயர் அதன் எபிரெய ஒலியமைப்பை அணுகும் வகையில் தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: וְאַכְשָׁף
  choice: அக்ஷாப்
  rationale: ஊர்ப்பெயரில் உள்ள כְשׁ மெய்த்தொடரை ‘க்ஷ’ எனக் காட்டும் நேரடியான, வாசிக்க எளிய தமிழ் ஒலிபெயர்ப்பு.
