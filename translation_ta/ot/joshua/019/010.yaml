base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/010.yaml
  text: The third lot came up for the sons of Zebulun[a], according to their clans, and the border of their inheritance was as far as Sarid.
translation:
  language: ta
  text: மூன்றாவது சீட்டு செபுலோனின் மக்களுக்கு[a], அவர்களுடைய குலங்களின்படி, விழுந்தது; அவர்களுடைய உரிமை நிலத்தின் எல்லை சாரீத் வரை இருந்தது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எடுக்கப்பட்டது.” எபிரெய மொழியில் சீட்டு ‘மேலே வந்தது’ என்று நேரடியாகச் சொல்லப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל הַגּוֹרָל
  choice: சீட்டு ... விழுந்தது
  rationale: עלה என்பதன் நேர்ப்பொருள் ‘மேலே போ/வா’ என்றாலும், சீட்டுப் போடும் சூழலில் தமிழில் இயல்பான ‘சீட்டு விழுந்தது’ என்ற மரபுத்தொடர் முடிவைக் குறிக்கிறது; எபிரெய உருவகத்திற்கான மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: הַשְּׁלִישִׁי
  choice: மூன்றாவது
  rationale: ‘சீட்டு’ என்பதைக் குறிக்கும் வரிசை எண்ணின் நேரான மொழிபெயர்ப்பு.
- source_word: לִבְנֵי זְבוּלֻן
  choice: செபுலோனின் மக்களுக்கு
  rationale: בני என்பதன் குலவழி உறவைப் பாதுகாத்தபடி, முழுக் கோத்திரத்தையும் உள்ளடக்கும் இயல்பான நவீனத் தமிழ் வடிவம்.
- source_word: לְמִשְׁפְּחֹתָם
  choice: அவர்களுடைய குலங்களின்படி
  rationale: முழுக் கோத்திரத்துக்குள் உள்ள குலப் பிரிவுகளின்படி பங்கீடு செய்யப்பட்டதை לְ-இன் பகிர்வுப் பொருளுடன் வெளிப்படுத்துகிறது.
- source_word: גְּבוּל נַחֲלָתָם
  choice: அவர்களுடைய உரிமை நிலத்தின் எல்லை
  rationale: נחלה என்பது பங்கிட்டு வழங்கப்பட்ட மரபுரிமை நிலத்தைக் குறிக்கிறது; ‘உரிமை நிலம்’ தமிழில் நிலச்சூழலைத் தெளிவாக்குகிறது, גבול எல்லைக்கோட்டைக் குறிக்கிறது.
- source_word: עַד שָׂרִיד
  choice: சாரீத் வரை
  rationale: עד புவியியல் எல்லையின் நீட்சியைக் குறிக்கிறது; שָׂרִיד என்பது மொழிபெயர்க்கப்படாத இடப்பெயராக ஒலிபெயர்க்கப்படுகிறது.
