translation:
  language: ta
  text: ரெமெத்[a], ஏன்-கன்னீம், ஏன்-ஹத்தா, மற்றும் பெத்-பத்சேஸ்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இந்த எபிரெய இடப்பெயர்களில், “ஏன்-கன்னீம்” என்பது “தோட்டங்களின் ஊற்று” என்று பொருள்படலாம்; “ஏன்-ஹத்தா” என்பதன் முதல் கூறு “ஊற்று” என்றும், “பெத்-பத்சேஸ்” என்பதன் முதல் கூறு “வீடு” என்றும் பொருள்படும். இவை இங்கு நகரப் பெயர்களாக வருவதால், முதன்மை உரையில் எழுத்துப்பெயர்க்கப்பட்டுள்ளன.
    reason: lexical_alternative
lexical_decisions:
- source_word: רֶמֶת
  choice: ரேமேத்
  rationale: நகரப் பட்டியலில் வரும் இடப்பெயர் என்பதால், பொருள் மொழிபெயர்க்காமல் எபிரெய ஒலிப்புக்கு நெருக்கமாக எழுத்துப்பெயர்க்கப்பட்டது.
- source_word: עֵין גַּנִּים
  choice: ஏன்-கன்னீம்
  rationale: עֵין (‘ஊற்று’) மற்றும் גַּנִּים (‘தோட்டங்கள்’) சேர்ந்த இடப்பெயர். இங்கு நகரின் பெயராகச் செயல்படுவதால் எழுத்துப்பெயர்ப்பு பயன்படுத்தப்பட்டது.
- source_word: עֵין חַדָּה
  choice: ஏன்-அத்தா
  rationale: עֵין (‘ஊற்று’) என்பதில் தொடங்கும் கூட்டுப் பெயர். இரண்டாம் கூறின் பொருள் இங்கு உறுதியற்றதால், முழுப் பெயரும் எபிரெய ஒலிப்புக்கு ஏற்ப எழுத்துப்பெயர்க்கப்பட்டது.
- source_word: בֵית פַּצֵּץ
  choice: பெத்-பத்சேஸ்
  rationale: בֵית (‘வீடு’) என்பதில் தொடங்கும் இடப்பெயர். நகரப் பட்டியலில் தனிப்பெயராக வருவதால் பொருள் மொழிபெயர்க்காமல் எழுத்துப்பெயர்க்கப்பட்டது.
- source_word: וְ
  choice: மற்றும் என்ற இணைப்பின் பொருளை பட்டியல் நிறுத்தக்குறிகள் மூலம் வெளிப்படுத்துதல்
  rationale: எபிரெயத்தில் ஒவ்வொரு பெயருக்கும் முன் மீண்டும் வரும் இணைப்பை, இயல்பான தமிழ் நகரப் பட்டியல் நடையில் காற்புள்ளிகளால் வெளிப்படுத்துவது பொருளைத் தெளிவாகக் காக்கிறது.
