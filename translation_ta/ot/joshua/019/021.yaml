  register: நவீனத் தரத் தமிழில் சுருக்கமான நகரப் பட்டியல் நடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய இடப்பெயர்களின் ஒலிப்பை முடிந்தவரை காத்து, கூட்டுப் பெயர்களை வாசிக்க எளிதாக இடைக்கோட்டுடன் வழங்கியுள்ளது.
