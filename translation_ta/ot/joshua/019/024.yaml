base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/024.yaml
  text: The fifth lot came out for the tribe of the sons of Asher[a], according to their clans.
translation:
  language: ta
  text: ஆசேர் மக்களின் கோத்திரத்திற்கு, அவர்களுடைய குலங்களின்படி, ஐந்தாவது சீட்டு விழுந்தது.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஆசேர் மக்களின் கோத்திரத்திற்காக, அவர்களுடைய குடும்பங்களின்படி, ஐந்தாவது சீட்டு எடுக்கப்பட்டது.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: விழுந்தது
  rationale: יצא என்பதன் அடிப்படைப் பொருள் ‘வெளியே சென்றது/வந்தது’ என்றாலும், சீட்டுப் போடும் சூழலில் தமிழில் ‘சீட்டு விழுந்தது’ என்பது இயல்பான வழக்காகவும் மூலத்தின் உருவகத்தைப் பேணுவதாகவும் உள்ளது.
- source_word: הַגּוֹרָל
  choice: சீட்டு
  rationale: גורל என்பது சீட்டுப் போடுதலில் பயன்படுத்தப்படும் சீட்டையோ அதனால் தீர்மானிக்கப்படும் முடிவையோ குறிக்கலாம்; இங்கு ‘சீட்டு’ உடனடியான பொருளைப் பேணுகிறது.
- source_word: הַחֲמִישִׁי
  choice: ஐந்தாவது
  rationale: ‘சீட்டு’ என்பதை விளக்கும் வரிசை எண்ணின் நேரடியான மொழிபெயர்ப்பு.
- source_word: לְמַטֵּה
  choice: கோத்திரத்துக்கு
  rationale: מַטֶּה என்பதற்கு ‘கோல்’ என்ற நேரடிப் பொருள் இருந்தாலும், இக்காணிப் பங்கீட்டுச் சூழலில் அது ஒரு கோத்திரத்தைக் குறிக்கும் மரபுத்தொடர்.
- source_word: בְנֵי אָשֵׁר
  choice: ஆசேரின் மகன்களுடைய
  rationale: ‘ஆசேரின் மகன்கள்’ என்ற முறையான வம்சவழிச் சொல்லாட்சியைப் பேணி, கோத்திரப் பெயருடன் இயல்பாக இணைக்கிறது.
- source_word: לְמִשְׁפְּחוֹתָם
  choice: அவர்களுடைய குலங்களின்படி
  rationale: מִשְׁפָּחוֹת என்பது கோத்திரத்திற்குள் உள்ள குல அடிப்படையிலான குடும்பக் குழுக்களைக் குறிக்கிறது; לְ முன்னொட்டின் பகிர்ந்தளிக்கும் கருத்தை ‘குலங்களின்படி’ தெளிவாக வெளிப்படுத்துகிறது.
