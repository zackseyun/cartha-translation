revisions:
- from: ஐந்தாவது சீட்டு ஆசேரின் மகன்களுடைய கோத்திரத்துக்கு, அவர்களுடைய குலங்களின்படி, விழுந்தது.[a]
  to: ஆசேர் மக்களின் கோத்திரத்திற்கு, அவர்களுடைய குலங்களின்படி, ஐந்தாவது சீட்டு விழுந்தது.[a]
  rationale: The revision preserves the Hebrew lot imagery through ‘சீட்டு விழுந்தது,’ retains ‘கோத்திரம்’ for מַטֶּה and ‘குலங்கள்’ for מִשְׁפָּחוֹת, and improves modern Tamil idiom by replacing the cumbersome possessive phrase. The footnote retains the legitimate contextual alternative ‘was drawn’ and the broader alternative ‘families.’
