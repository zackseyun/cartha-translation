translation_notes:
  register: நவீன நிலையான தமிழில், சுருக்கமான நிலப்பங்கீட்டு நிறைவு வாய்பாட்டின் கண்ணியமான தொனி காக்கப்பட்டுள்ளது. எபிரெய பெயர்வாக்கியத்தின் காலத் தெளிவின்மை ‘இதுவே’ என்பதன் மூலம் இயல்பாகப் பாதுகாக்கப்பட்டுள்ளது; தேவையற்ற அடிக்குறிப்புகள் சேர்க்கப்படவில்லை.
