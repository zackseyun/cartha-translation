  text: זֹ֗את נַחֲלַ֛ת מַטֵּ֥ה בְנֵֽי נַפְתָּלִ֖י לְ/מִשְׁפְּחֹתָ֑/ם הֶ/עָרִ֖ים וְ/חַצְרֵי/הֶֽן־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/039.yaml
  text: This was the inheritance of the tribe of the sons of Naphtali according to their clans—the cities and their villages[a][b].
translation:
  language: ta
  text: 'நப்தலி கோத்திரத்தாரின் குலங்களின்படியான சுதந்தரப் பங்கு இதுவே: நகரங்களும் அவற்றின் கிராமங்களும்.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: זֹאת
  choice: இதுவே
  rationale: முன்னர் விவரிக்கப்பட்ட நிலப்பகுதியைச் சுட்டும் பெண்பால் ஒருமைச் சுட்டுப்பெயர். எபிரெய பெயர்வாக்கியத்தில் நிகழ்/இறந்தகாலம் வெளிப்படையாகக் குறிக்கப்படாததால், தமிழில் காலத்தைத் தேவையின்றி நிர்ணயிக்காத ‘இதுவே’ இயல்பாகவும் மூலத்திற்கு நெருக்கமாகவும் உள்ளது.
- source_word: נַחֲלַת
  choice: உரிமைப் பகுதி
  rationale: நிலப் பங்கீட்டுச் சூழலில் மரபுரிமையாகப் பெறப்பட்ட நிலப்பங்கைக் குறிக்கிறது. ‘உரிமைப் பகுதி’ என்பது நிலத்தையும் அதன்மீதான உரிமையையும் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: מַטֵּה בְנֵי נַפְתָּלִי
  choice: நப்தலி கோத்திரத்தாருக்கு
  rationale: சொல்லுக்கு சொல் ‘நப்தலியின் மகன்களுடைய கோத்திரம்’ என்றாலும், இது நப்தலியின் வழிவந்த கோத்திர மக்களைக் குறிக்கும் வழக்கமான எபிரெய இனக்குழுப் பெயர். தமிழில் ‘நப்தலி கோத்திரத்தார்’ இயல்பாகவும் அனைவரையும் உள்ளடக்கும் வகையிலும் உள்ளது.
- source_word: לְמִשְׁפְּחֹתָם
  choice: அவர்களுடைய குலங்களின்படி
  rationale: நிலப்பங்கீடு கோத்திரத்திற்குள் உள்ள வம்சக் குழுக்களின் அடிப்படையில் அமைந்ததை לְ முன்னொட்டுடன் கூடிய சொற்றொடர் தெரிவிக்கிறது; இச்சூழலில் ‘குலம்’ என்பது தனிக் குடும்பத்தைவிடப் பொருத்தமானது.
- source_word: הֶעָרִים
  choice: அந்தப் பட்டணங்கள்
  rationale: עִיר என்பது அரணமைந்த நகரங்களையும் சிறிய பட்டணங்களையும் குறிக்கலாம். யோசுவாவின் குடியிருப்புப் பட்டியல் சூழலில் நவீன தமிழில் ‘பட்டணங்கள்’ தெளிவான சமநிலையான தெரிவாகும்.
- source_word: וְחַצְרֵיהֶן
  choice: அவற்றைச் சேர்ந்த கிராமங்களும்
  rationale: חָצֵר இங்கு பட்டணங்களைச் சார்ந்த புறநிலக் குடியிருப்புகளைக் குறிக்கிறது. ‘அவற்றைச் சேர்ந்த கிராமங்கள்’ அந்தச் சார்பு உறவைத் தெளிவாகக் காட்டுகிறது.
