  text: וְ/שָׁ֤ב הַ/גְּבוּל֙ הָֽ/רָמָ֔ה וְ/עַד עִ֖יר מִבְצַר צֹ֑ר וְ/שָׁ֤ב הַ/גְּבוּל֙ חֹסָ֔ה ו/יהיו תֹצְאֹתָ֛י/ו הַ/יָּ֖מָּ/ה מֵ/חֶ֥בֶל אַכְזִֽיבָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/029.yaml
  text: Then the border turned to Ramah[a], and to the fortified city of Tyre; then the border turned to Hosah, and its boundary points were at the sea[b], from the region of Achzib.
translation:
  language: ta
  text: பின்பு அந்த எல்லை ராமாவுக்குத் திரும்பி, அரணமைக்கப்பட்ட தீரு நகரம்வரை சென்றது. பின்னர் அந்த எல்லை ஹோசாவுக்குத் திரும்பியது; அதன் எல்லையின் முடிவுப் புள்ளிகள் அக்சீபின் நிலப்பகுதியிலிருந்து[a] கடலை நோக்கி[b] இருந்தன.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அக்சீபை நோக்கி உள்ள நிலப்பகுதியிலிருந்து.’ எபிரெயச் சொல்லமைப்பு இடம் அல்லது திசை குறித்த நுணுக்கத்தில் தெளிவற்றது.
    reason: lexical_and_syntactic_ambiguity
  - marker: b
    text: அல்லது, ‘மேற்கு நோக்கி’; எபிரெயில் சொல்லுக்கு சொல் ‘கடலை நோக்கி’ என்று உள்ளது. இது மேற்குத் திசையைக் குறிக்கும் பொதுவான புவியியல் வழக்கு.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁב
  choice: திரும்பி / திரும்பியது
  rationale: எல்லை விவரிப்புகளில் இந்த வினை எல்லைக்கோடு திசை மாறுவதைக் குறிக்கிறது; நவீன தமிழில் ‘திரும்பியது’ இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: הַגְּבוּל
  choice: அந்த எல்லை
  rationale: நிலப்பங்கீட்டுச் சூழலில் இது ஒரு பிரதேசத்தின் எல்லைக்கோட்டைக் குறிக்கிறது.
- source_word: הָרָמָה
  choice: ராமா
  rationale: இடப்பெயர் தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: עִיר מִבְצַר צֹר
  choice: அரண்சூழ்ந்த தீரு நகரம்
  rationale: מִבְצָר என்பதன் அரணமைப்புச் சிறப்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது; தீரு என்பது இடப்பெயர்.
- source_word: חֹסָה
  choice: ஓசா
  rationale: எபிரெய இடப்பெயரின் தொடக்க மெய்யான ח தமிழில் இயல்பாக ‘ஓ’ என ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: וַיהיו תֹצְאֹתָיו
  choice: அதன் இறுதிப்பகுதி
  rationale: எல்லைச் சூத்திரங்களில் תֹצָאוֹת எல்லையின் முனைகள் அல்லது முடிவிடங்களைக் குறிக்கிறது. தமிழில் செயற்கையான பன்மையைத் தவிர்த்து புவியியல் கருத்தை இயல்பாகத் தெரிவிக்க ‘இறுதிப்பகுதி’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: הַיָּמָּה
  choice: கடலை நோக்கி
  rationale: திசையைக் குறிக்கும் ה கொண்ட இச்சொல் நேரடியாக ‘கடலை நோக்கி’ என்றும், இஸ்ரவேல் புவியியலில் ‘மேற்கு நோக்கி’ என்றும் பொருள்படலாம். மூலத்தின் கடல் உருவகம் முதன்மை உரையில் காக்கப்பட்டுள்ளது.
- source_word: מֵחֶבֶל אַכְזִיבָה
  choice: அக்சீபின் நிலப்பகுதியிலிருந்து
  rationale: חֶבֶל இங்கு அளவிடப்பட்ட நிலப்பகுதி, வட்டாரம் அல்லது பிரதேசத்தைக் குறிக்கிறது. இறுதி ה காரணமாக ‘அக்சீபை நோக்கிய’ என்ற திசைநுணுக்கமும் சாத்தியம்; அது அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
