source:
  edition: WLC
  text: וְ/עָרֵ֖י מִבְצָ֑ר הַ/צִּדִּ֣ים צֵ֔ר וְ/חַמַּ֖ת רַקַּ֥ת וְ/כִנָּֽרֶת׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/035.yaml
  text: And the fortified cities were Ziddim[a], Zer, Hammath, Rakkath, and Kinnereth.
translation:
  language: ta
  text: 'அரண்களால் பாதுகாக்கப்பட்ட நகரங்கள்[a]: சித்தீம், சேர், ஹம்மாத், ரக்காத், கின்னெரேத்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கோட்டை நகரங்கள்.”
    reason: மִבְצָר என்பதற்கான சொற்பொருள் மாற்று; “அரண்களால் பாதுகாக்கப்பட்ட” என்பதற்குப் பதிலாக “கோட்டை” என்ற வடிவமும் சாத்தியம்.
lexical_decisions:
- source_word: וְ/עָרֵי מִבְצָר
  choice: அரண்சூழ்ந்த நகரங்கள்
  rationale: עָרֵי மִבְצָר என்பது அரண் அல்லது பாதுகாப்புக் கட்டமைப்புகளைக் கொண்ட நகரங்களைக் குறிக்கிறது. இயல்பான நவீனத் தமிழில் இராணுவப் பாதுகாப்பு சார்ந்த பொருளைத் தெளிவாகத் தருவதால் “அரண்சூழ்ந்த நகரங்கள்” தேர்ந்தெடுக்கப்பட்டது.
- source_word: הַ/צִּדִּים
  choice: சித்தீம்[a]
  rationale: இது நகரப் பெயராக ஒலிபெயர்க்கப்பட்டது. எபிரெய முன்னொட்டு உருபு தமிழில் தனியாகக் கொண்டுவரப்படவில்லை. மூலவடிவத்தின் வாசிப்பில் உள்ள சொற்பொருள் மாற்றுவாய்ப்பு அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
- source_word: צֵר
  choice: சேர்
  rationale: எபிரெய நகரப் பெயரின் ஒலிவடிவத்துக்கு நெருக்கமான, தமிழில் வாசிக்க இயல்பான ஒலிபெயர்ப்பு.
- source_word: וְ/חַמַּת
  choice: ஹம்மாத்
  rationale: இது இடப்பெயராக ஒலிபெயர்க்கப்பட்டது; நடு மெய்யின் இரட்டிப்பை “ம்ம” என்பதும் இறுதி ת ஒலியை “த்” என்பதும் பிரதிபலிக்கின்றன.
- source_word: רַקַּת
  choice: ரக்காத்
  rationale: இடப்பெயரின் இரட்டித்த ק மெய்யையும் இறுதி ת ஒலியையும் பிரதிபலிக்கும் தமிழ் ஒலிபெயர்ப்பு.
- source_word: וְ/כִנָּֽרֶת
  choice: கின்னெரேத்
  rationale: இடப்பெயரின் இரட்டித்த נ மெய்யையும் மூல உயிரொலி அமைப்பையும் இறுதி ת ஒலியையும் இயன்றவரை பாதுகாக்கும் தமிழ் ஒலிபெயர்ப்பு.
