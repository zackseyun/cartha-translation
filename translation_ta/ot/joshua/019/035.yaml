translation_notes:
  register: நவீன நிலையான தமிழில் சுருக்கமான பட்டியல் வடிவம் பயன்படுத்தப்பட்டுள்ளது. வசனம் முன் பட்டியலின் தொடர்ச்சியாக இருந்தாலும், தமிழில் தனித்து வாசிக்கும்போது தேவையற்றதாகத் தோன்றும் தொடக்க “மற்றும்” விடப்பட்டுள்ளது. இடப்பெயர்கள் மொழிபெயர்க்கப்படாமல், மூல எபிரெய ஒலிகளுக்கு நெருக்கமாக ஒலிபெயர்க்கப்பட்டுள்ளன.
