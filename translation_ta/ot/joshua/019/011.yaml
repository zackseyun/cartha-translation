translation:
  language: ta
  text: அவர்களுடைய எல்லை மேற்கே மராலாவுக்கு ஏறிச் சென்று, தப்பாசேத்தைத் தொட்டு, யொக்னெயாமுக்கு எதிரே உள்ள ஓடையைத் தொட்டது.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעָלָה ... לַיָּמָּה
  choice: மேற்கே ... ஏறிச் சென்று
  rationale: עָלָה என்பதன் நிலவியல் இயக்கத்தை ‘ஏறிச் சென்று’ எனவும், יָמָּה என்பதன் திசைப் பொருளை இயல்பான தமிழில் ‘மேற்கே’ எனவும் வழங்குகிறது.
- source_word: וּפָגַע
  choice: தொட்டு
  rationale: எல்லைக் கோடு ஓர் இடத்தை அடைந்து அல்லது அதனுடன் சந்திக்கும் பொருளை நேரடியாகக் காக்கிறது; மூலத்தில் இருமுறை வருவதால் தமிழிலும் இருமுறை தக்கவைக்கப்பட்டது.
- source_word: הַנַּחַל
  choice: ஓடை
  rationale: נַחַל என்பது பள்ளத்தாக்கையோ அதில் பாயும் நீரோடையையோ குறிக்கலாம்; இச்சூழலில் எல்லைத் தடமாகக் குறிப்பிடப்படுவதால் ‘ஓடை’ இயல்பான தேர்வு, ஆனால் சொல்லின் நிலவியல் பரப்பு முற்றிலும் தீர்மானிக்கப்படவில்லை.
- source_word: עַל־פְּנֵי יָקְנְעָם
  choice: யொக்னெயாமுக்கு எதிரே
  rationale: עַל־פְּנֵי என்பதன் இடவியல் பொருளான ‘எதிரே/முன்புறத்தில்’ என்பதைச் சுருக்கமாகவும் தெளிவாகவும் தருகிறது.
