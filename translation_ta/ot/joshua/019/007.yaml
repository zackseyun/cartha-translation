  text: 'Ain[a], Rimmon, Ether, and Ashan: four cities, with their villages.'
translation:
  language: ta
  text: 'அயின்[a], ரிம்மோன், எதெர், ஆஷான்: நான்கு நகரங்கள், அவற்றின் கிராமங்களோடு.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய உரை அயின், ரிம்மோன், எதெர், ஆஷான் என நான்கு இடப்பெயர்களைப் பட்டியலிடுகிறது. 1 நாளாகமம் 4:32-ஐ ஒப்பிட்டுப் பார்க்கும் சிலர், அங்கே “அயின்-ரிம்மோன்” என்பதை ஒரே இடப்பெயராகப் புரிந்துகொள்கிறார்கள்; அப்படிப் புரிந்துகொண்டால் நகரங்களின் எண்ணிக்கை வேறுபடும்.
    reason: குறுக்கு மேற்கோளினால் எழும் இடப்பெயர் பிரிப்பு மற்றும் நகர எண்ணிக்கை குறித்த உரைநுட்பத் தெளிவின்மையைப் பாதுகாக்கிறது.
lexical_decisions:
- source_word: עַיִן
  choice: அயின்
  rationale: இங்கு பொதுப்பெயரான ‘கண்’ அல்லது ‘நீரூற்று’ என்ற பொருளில் அல்லாமல் இடப்பெயராக வருகிறது; எனவே எபிரெய ஒலிப்புக்கு நெருக்கமாக ஒலிபெயர்க்கப்பட்டது.
- source_word: רִמּוֹן
  choice: ரிம்மோன்
  rationale: ‘மாதுளை’ என்ற சொற்பொருள் இருந்தாலும், இங்கு இது ஓர் இடப்பெயர்; ஆகவே மொழிபெயர்க்காமல் ஒலிபெயர்க்கப்பட்டது.
- source_word: וָעֶתֶר
  choice: எத்தேர்
  rationale: இணைப்புச் சொல்லுடன் வரும் இடப்பெயர். எபிரெய உயிரொலி மற்றும் மெய்யொலியை இயன்றவரை பிரதிபலிக்கும் வகையில் ஒலிபெயர்க்கப்பட்டது.
- source_word: וְעָשָׁן
  choice: ஆஷான்
  rationale: இடப்பெயராக இருப்பதால் ஒலிபெயர்க்கப்பட்டது; שׁ ஒலியைத் தெளிவாகக் காட்ட ‘ஷ’ பயன்படுத்தப்பட்டது.
- source_word: עָרִים אַרְבַּע
  choice: நான்கு நகரங்கள்
  rationale: எண்ணிக்கையையும் குடியிருப்புகளின் வகையையும் நேரடியாகவும் இயல்பான தமிழ் சொல்வரிசையிலும் தருகிறது.
- source_word: וְחַצְרֵיהֶן
  choice: அவற்றைச் சேர்ந்த கிராமங்களும்
  rationale: חָצֵר இத்தகைய நிலப்பங்கீட்டுப் பட்டியல்களில் முதன்மை நகரங்களைச் சார்ந்த ஊரகக் குடியிருப்புகளைக் குறிக்கிறது; அந்த நிர்வாக உறவை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
