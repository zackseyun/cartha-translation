base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/015.yaml
  text: 'Kattath[a], Nahalal, Shimron, Idalah, and Bethlehem: twelve cities with their villages.'
translation:
  language: ta
  text: கத்தாத், நகலால், சிம்ரோன், இதாலா, பெத்லகேம்[a] ஆகிய பன்னிரண்டு நகரங்களும் அவற்றின் கிராமங்களும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இங்கு வரும் பெத்லகேம் என்பது ஓர் இடப்பெயர்; அதைச் சொல்லுக்குச் சொல் ‘அப்பத்தின் வீடு’ என்று மொழிபெயர்க்கக் கூடாது.
    reason: lexical_alternative
lexical_decisions:
- source_word: קַטָּת
  choice: கத்தாத்
  rationale: எபிரெய இடப்பெயரின் மெய்யெழுத்துகளையும் உயிரொலிகளையும் தமிழில் நெருக்கமாக ஒலிபெயர்க்கிறது.
- source_word: נַהֲלָל
  choice: நகலால்
  rationale: எபிரெய இடப்பெயரைத் தமிழில் ஒலிபெயர்க்கிறது; நடுவிலுள்ள ה ஒலியைத் தமிழில் நெருக்கமாகக் குறிக்க ‘க’ பயன்படுத்தப்பட்டது.
- source_word: שִׁמְרוֹן
  choice: சிம்ரோன்
  rationale: எபிரெய இடப்பெயரை இயல்பான தமிழ் ஒலிவடிவில் தருகிறது.
- source_word: יִדְאֲלָה
  choice: இதாலா
  rationale: எபிரெய இடப்பெயரைத் தமிழில் ஒலிபெயர்க்கிறது; தொடக்க யோத் இச்சூழலில் ‘இ’ என்றும், ד ஒலி ‘த’ என்றும் வழங்கப்பட்டது.
- source_word: בֵית לָחֶם
  choice: பெத்லகேம்
  rationale: இது ‘அப்பத்தின் வீடு’ என்று மொழிபெயர்க்க வேண்டிய சொற்றொடர் அல்ல, நிறுவப்பட்ட இடப்பெயர்; தமிழில் பரவலாக அறியப்பட்ட ஒலிவடிவு பயன்படுத்தப்பட்டது.
- source_word: עָרִים
  choice: நகரங்கள்
  rationale: நிலப்பங்கீட்டுப் பட்டியலில் மக்கள் குடியிருக்கும் முதன்மை இடங்களைக் குறிக்கும் வழக்கமான சொல்.
- source_word: שְׁתֵּים עֶשְׂרֵה
  choice: பன்னிரண்டு
  rationale: ‘நகரங்கள்’ என்பதைக் கணக்கிடும் எண்ணாக இயல்பான தமிழில் வழங்கப்பட்டது.
- source_word: חַצְרֵיהֶן
  choice: அவற்றைச் சேர்ந்த கிராமங்கள்
  rationale: முதன்மை நகரங்களைச் சார்ந்த சிறிய அல்லது மதிலற்ற குடியிருப்புகள் என்ற நிர்வாக-புவியியல் தொடர்பைத் தெளிவாக வெளிப்படுத்துகிறது.
theological_decisions: []
translation_notes:
  register: நவீனத் தரத் தமிழில், நிலப்பங்கீட்டுப் பட்டியலுக்கேற்ற சுருக்கமான மற்றும் கண்ணியமான நடை. எபிரெய வாக்கியத்தில் ஐந்து நகரங்கள் மட்டுமே இவ்வசனத்தில் பெயரிடப்பட்டிருந்தாலும் ‘பன்னிரண்டு நகரங்கள்’ என்ற மொத்த எண்ணிக்கை அப்படியே பாதுகாக்கப்பட்டுள்ளது. அடிக்குறிப்புக் குறி ஆங்கில ஆலோசனைப் படலத்தில் கத்தாத் அருகே இருந்தாலும், அதன் உள்ளடக்கம் பெத்லகேமைப் பற்றியது என்பதால் தெளிவுக்காக பெத்லகேம் அருகே இடப்பட வேண்டும்; எனினும் வழங்கப்பட்ட குறிமுறை வரிசையைப் பேணுவதற்காக உரையில் [a] கத்தாத் அருகே வைக்கப்பட்டுள்ளது.
