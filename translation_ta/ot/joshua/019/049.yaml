base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/049.yaml
  text: When they finished apportioning the land by its territories[b][a], the sons of Israel gave an inheritance to Joshua son of Nun among them.
translation:
  language: ta
  text: அவர்கள் நாட்டை அதன் பகுதிகளின்படி[a] பங்கிட்டுக் கொடுத்து முடித்தபோது, இஸ்ரவேலின் மகன்கள்[b] நூனின் மகன் யோசுவாவுக்கு அவர்களிடையே ஓர் மரபுரிமைப் பங்கைக் கொடுத்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அதன் எல்லைகளின்படி.’ எபிரெயச் சொல் எல்லைக்கோடுகளையோ அவற்றால் வரையறுக்கப்பட்ட பகுதிகளையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அதாவது, ‘இஸ்ரவேலர்.’ எபிரெயத்தில் சொல்லுக்குச் சொல், ‘இஸ்ரவேலின் மகன்கள்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְכַלּוּ לִנְחֹל
  choice: பங்கிட்டுக் கொடுத்து முடித்தபோது
  rationale: כלה நிறைவுற்ற செயலைக் குறிக்கிறது; נחל இச்சூழலில் நாட்டைச் சுதந்தரப் பங்குகளாக ஒதுக்குவதைக் குறிக்கிறது. தமிழ் கதைநடையில் அடுத்த செயலோடு இயல்பாக இணைக்க இவ்வாறு மொழிபெயர்க்கப்பட்டது.
- source_word: הָאָרֶץ
  choice: நாட்டை
  rationale: இங்கு உலகம் அல்லது பொதுவான நிலப்பரப்பு அல்ல, கோத்திரங்களுக்கு ஒதுக்கப்பட்ட கானான் நாடே குறிக்கப்படுகிறது.
- source_word: לִגְבוּלֹתֶיהָ
  choice: அதன் பகுதிகளின்படி
  rationale: גְּבוּל என்பது எல்லைக்கோடுகளையும் அவற்றால் வரையறுக்கப்பட்ட பகுதிகளையும் குறிக்கலாம். நிலப் பங்கீட்டுச் சூழலில் ‘பகுதிகளின்படி’ இயல்பானது; உண்மையான சொற்பொருள் மாற்று அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் மகன்கள்
  rationale: எபிரெயச் சொற்றொடரின் முறையான வடிவத்தையும் தேசிய அடையாளப் பயன்பாட்டையும் பாதுகாக்கிறது; இயல்பான தமிழ் மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: נַחֲלָה
  choice: ஓர் உரிமைப் பங்கு
  rationale: נַחֲלָה என்பது வெறும் உடைமையல்ல; உரிமையாக ஒதுக்கப்பட்ட நிலப்பங்கைக் குறிக்கிறது. ‘உரிமைப் பங்கு’ அதன் சட்ட மற்றும் உடன்படிக்கை சார்ந்த நுணுக்கத்தைத் தெளிவாகக் காட்டுகிறது.
- source_word: לִיהוֹשֻׁעַ בִּן נוּן
  choice: நூனின் மகன் யோசுவாவுக்கு
  rationale: தனிப்பெயரையும் தந்தைவழி அடையாளத்தையும் நவீன தமிழில் இயல்பாக வழங்குகிறது.
- source_word: בְּתוֹכָם
  choice: தங்கள் நடுவில்
  rationale: யோசுவாவின் பங்கு இஸ்ரவேலருக்குள், அவர்களுடைய பங்குகளின் மத்தியிலேயே வழங்கப்பட்டது என்ற இட மற்றும் சமூக உறவைப் பாதுகாக்கிறது.
theological_decisions:
- issue: בְנֵי יִשְׂרָאֵל என்பதன் மொழிபெயர்ப்பு
  choice: இஸ்ரவேலின் மகன்கள்
  alternative: இஸ்ரவேலர்
  rationale: மூலத்தின் ஆண்பால் பன்மை வடிவத்தையும் வழக்கமான தேசியப் பெயரையும் முதன்மை உரையில் வெளிப்படையாக வைத்திருக்கிறது; இதன் பொதுவான தேசியப் பொருள் அடிக்குறிப்பில் தெளிவாக்கப்படுகிறது.
- issue: נַחֲלָה என்பதன் நிலப் பங்கீட்டு நுணுக்கம்
  choice: ஓர் உரிமைப் பங்கு
  alternative: ஒரு சுதந்தரம்
  rationale: தமிழில் ‘சுதந்தரம்’ மரபுச் சொல்லாக இருந்தாலும் இன்று எளிதில் தவறாகப் புரியலாம். ‘உரிமைப் பங்கு’ ஒதுக்கப்பட்ட உடன்படிக்கை நிலப்பங்கின் சட்ட-இறையியல் நுணுக்கத்தை இயல்பாகத் தெரிவிக்கிறது.
