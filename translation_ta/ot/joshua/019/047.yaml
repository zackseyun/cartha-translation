  text: וַ/יֵּצֵ֥א גְבוּל בְּנֵי דָ֖ן מֵ/הֶ֑ם וַ/יַּעֲל֣וּ בְנֵֽי דָ֠ן וַ/יִּלָּחֲמ֨וּ עִם לֶ֜שֶׁם וַ/יִּלְכְּד֥וּ אוֹתָ֣/הּ וַ/יַּכּ֧וּ אוֹתָ֣/הּ לְ/פִי חֶ֗רֶב וַ/יִּֽרְשׁ֤וּ אוֹתָ/הּ֙ וַ/יֵּ֣שְׁבוּ בָ֔/הּ וַ/יִּקְרְא֤וּ לְ/לֶ֨שֶׁם֙ דָּ֔ן כְּ/שֵׁ֖ם דָּ֥ן אֲבִי/הֶֽם־־־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/047.yaml
  text: But the territory of the sons of Dan went out beyond them[a], so the sons of Dan went up and fought against Leshem, and they captured it and struck it with the edge of the sword, and they took possession of it and lived in it, and they called Leshem Dan[b], after the name of Dan their father.
translation:
  language: ta
  text: ஆனால் தாணின் சந்ததியினரின் எல்லைப்பகுதி அவர்களிடமிருந்து வெளியே சென்றது[a]. எனவே தாணின் சந்ததியினர் மேலே சென்று லேசேமுக்கு எதிராகப் போரிட்டு, அதைக் கைப்பற்றி, வாளின் கூரால் அதைத் தாக்கினர். பின்பு அவர்கள் அதை உடைமையாக்கி, அதில் குடியிருந்து, தங்கள் தந்தை தாணின் பெயரின்படி லேசேமுக்குத் தாண் என்று பெயரிட்டனர்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தாணின் சந்ததியினரின் எல்லை அவர்களைத் தாண்டி விரிந்தது.” சில மொழிபெயர்ப்புகள் பரந்த சூழலை அடிப்படையாகக் கொண்டு, “தாணின் சந்ததியினருக்கான பகுதி போதவில்லை” என்று விளக்கமாக மொழிபெயர்க்கின்றன. ஆனால் எபிரெய வாசகம் சொற்பொருளில் இடம்சார்ந்ததாகவும் தெளிவற்றதாகவும் உள்ளது.
    reason: alternative_reading
  - marker: b
    text: நியாயாதிபதிகள் 18:7, 14, 27, 29 ஆகிய வசனங்களில் வரும் லாயீஷுடன் லேசேம் தொடர்புபடுத்தப்படுகிறது.
    reason: cross_reference
lexical_decisions:
- source_word: וַיֵּצֵא גְבוּל בְּנֵי דָן מֵהֶם
  choice: தாணின் மகன்களுடைய எல்லைப்பகுதி அவர்களிடமிருந்து வெளியே நீண்டது
  rationale: גְבוּל என்பது ‘எல்லை’ அல்லது ‘எல்லைப்பகுதி’ எனப் பொருள்படலாம். மֵהֶם உடைய கடினமான, அடிப்படையில் இடம்சார்ந்த ‘அவர்களிடமிருந்து’ என்ற பொருளைத் தக்கவைத்து, சூழலை அடிப்படையாகக் கொண்ட ‘அவர்களுக்கு இடம் போதவில்லை’ என்ற விளக்கத்தை முதன்மை உரையில் சேர்க்கவில்லை.
- source_word: בְּנֵי דָן
  choice: தாணின் மகன்கள்
  rationale: ‘தாணின் மக்கள்’ அல்லது ‘தாணியர்’ என்பவற்றைவிட, கோத்திரத்தின் குடும்பவழி எபிரெயச் சொல்லாட்சியை வெளிப்படையாகத் தக்கவைக்கிறது.
- source_word: וַיַּעֲלוּ
  choice: படையெடுத்துச் சென்று
  rationale: עלה என்பதன் அடிப்படைப் பொருள் ‘மேலே செல்’; இங்கு போர்சார்ந்த நகர்வைக் குறிக்கும் சூழலில் இயல்பான தமிழுக்காக ‘படையெடுத்துச் சென்று’ என மொழிபெயர்க்கப்பட்டது. மேல்நோக்கிய நகர்வின் தனிப்பொருள் சூழலில் தெளிவாக உறுதிப்படுத்தப்படாததால் ‘மேலே’ சேர்க்கப்படவில்லை.
- source_word: וַיִּלָּחֲמוּ עִם לֶשֶׁם
  choice: லேசேமுக்கு எதிராக ... அதனுடன் போரிட்டு
  rationale: לחם என்பது ‘போரிடு’ எனப் பொருள்படும். நகரத்தை எதிர்த்து மேற்கொண்ட போர் என்பதைத் தமிழில் தெளிவாக்குகிறது.
- source_word: לֶשֶׁם
  choice: லேசேம்
  rationale: மசோரெட்டிக் உரையின் לֶשֶׁם என்ற பெயர் ஒலிபெயர்க்கப்பட்டது; நியாயாதிபதிகள் 18-இல் வரும் லாயீசுடனான தொடர்பு அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: וַיִּלְכְּדוּ אוֹתָהּ
  choice: அதைக் கைப்பற்றி
  rationale: לכד என்பதன் போர் சூழலுக்குரிய ‘கைப்பற்று’ என்ற பொருளை இயல்பாகத் தருகிறது.
- source_word: וַיַּכּוּ אוֹתָהּ לְפִי חֶרֶב
  choice: வாளின் முனையால் அதை வெட்டினர்
  rationale: לְפִי חֶרֶב என்பது சொற்பட ‘வாளின் வாய்’ என்ற எபிரெய உருவகம். தமிழில் புரியக்கூடிய ‘வாளின் முனையால்’ என உருவகத்தை ஓரளவு தக்கவைத்து, הכה-க்கு ‘வெட்டினர்’ எனப் போர் சூழலுக்கேற்ற வினை பயன்படுத்தப்பட்டது; யாரெல்லாம் கொல்லப்பட்டனர் என்பதை உரையை மீறி விரிவுபடுத்தவில்லை.
- source_word: וַיִּרְשׁוּ אוֹתָהּ
  choice: அதைத் தங்கள் உடைமையாக்கி
  rationale: ירשׁ என்பதிலுள்ள கைப்பற்றிப் பெற்றுக்கொள்ளுதல் அல்லது உடைமையாக்குதல் என்ற விளைவைத் தெளிவாகக் காட்டுகிறது.
- source_word: וַיֵּשְׁבוּ בָהּ
  choice: அதில் குடியிருந்து
  rationale: ישׁב என்பதன் ‘வாழ்/குடியிரு’ என்ற பொருளை இந்நகரக் குடியேற்றச் சூழலில் இயல்பாக வழங்குகிறது.
- source_word: וַיִּקְרְאוּ לְלֶשֶׁם דָּן
  choice: லேசேமுக்குத் தாண் என்று பெயரிட்டனர்
  rationale: நகரத்துக்கு ‘தாண்’ என்ற புதிய பெயர் வழங்கப்பட்டதைத் தமிழில் தெளிவாகச் சொல்கிறது.
- source_word: כְּשֵׁם דָּן אֲבִיהֶם
  choice: தங்கள் தந்தையாகிய தாணின் பெயரின்படி
  rationale: אָב என்பது ‘தந்தை’ அல்லது ‘மூதாதை’ என வரலாம். கோத்திர வழக்கிலுள்ள ‘தந்தை’ என்ற உருவகத்தை முதன்மை உரையில் தக்கவைக்கிறது.
theological_decisions:
- issue: தாணின் எல்லைப்பகுதியைப் பற்றிய தொடக்கக் கூற்றின் பொருள்
  choice: இடம்சார்ந்த கடினமான வாசகமான ‘அவர்களிடமிருந்து வெளியே நீண்டது’ என்பதைக் காத்தல்
  alternative: ‘அவர்களுக்குக் கிடைத்த பகுதி போதவில்லை’ அல்லது ‘மிகச் சிறியதாக இருந்தது’
  rationale: எபிரெய உரை நேரடியாகப் பற்றாக்குறையைக் கூறவில்லை. பரந்த வரலாற்றுச் சூழலிலிருந்து பெறப்படும் விளக்கத்தை உரைக்குள் அமைதியாகச் சேர்க்காமல், உண்மையான தெளிவின்மையை அடிக்குறிப்புடன் தக்கவைக்கிறது.
translation_notes:
  register: நவீன செந்தமிழுக்கு நெருக்கமான, பொதுவாசகருக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டது. தொடர் எபிரெய வினைகளின் வேகத்தைத் தமிழில் இணைவினை அமைப்பால் காத்திருக்கிறது. ‘தாணின் மகன்கள்’, ‘தந்தை’ ஆகிய குடும்பவழிச் சொற்கள் கோத்திர அடையாளத்தை வெளிப்படையாக வைத்துள்ளன; கடினமான முதல் கூறு விளக்கமிட்டு தீர்க்கப்படாமல் அடிக்குறிப்புடன் பாதுகாக்கப்பட்டது.
