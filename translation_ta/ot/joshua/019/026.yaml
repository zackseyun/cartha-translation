  yaml_path: translation/ot/joshua/019/026.yaml
  text: and Allammelech[a], Amad, and Mishal; and it reached to Carmel westward, and to Shihor-libnath.
translation:
  language: ta
  text: அல்லம்மெலேக், அமாத், மிஷால்; எல்லை மேற்குநோக்கி[a] கர்மேலை அடைந்து, ஷிஹோர்-லிப்னாத் வரை சென்றது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொல்லளவில், “கடலை நோக்கி”; இங்குள்ள புவியியல் சூழலில் இது “மேற்குநோக்கி” என்று பொருள்படும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַלַמֶּלֶךְ
  choice: அல்லம்மெலேக்
  rationale: இது ஓர் இடப்பெயர்; எபிரெய வடிவுக்கு நெருக்கமாகத் தமிழில் ஒலிபெயர்க்கப்பட்டது.
- source_word: עַמְעָד
  choice: அமாத்
  rationale: இது ஓர் இடப்பெயர்; வாசிக்க இயல்பான தமிழ்ச் சொல்வடிவில் ஒலிபெயர்க்கப்பட்டது.
- source_word: מִשְׁאָל
  choice: மிஷால்
  rationale: இடப்பெயர் என்பதால் பொருள்பெயர்க்காமல் ஒலிபெயர்க்கப்பட்டது.
- source_word: וּפָגַע
  choice: எல்லை ... அடைந்து
  rationale: எல்லை விவரிப்புகளில் இந்த வினை ஒரு நிலக்குறியைச் சென்றடைவதைக் குறிக்கிறது; தமிழில் இயல்பாக இருக்க எழுவாய் வெளிப்படையாகச் சேர்க்கப்பட்டது.
- source_word: בְּכַרְמֶל
  choice: கர்மேலை
  rationale: எல்லை சென்றடைந்த இடமாகக் கர்மேல் குறிக்கப்படுவதால், தமிழில் செயப்படுபொருள் வேற்றுமையுடன் வழங்கப்பட்டது.
- source_word: הַיָּמָּה
  choice: மேற்கே
  rationale: சொல்லளவில் ‘கடலை நோக்கி’ என்றாலும், எபிரெய புவியியல் வழக்கில் இது மத்தியதரைக் கடல் இருக்கும் மேற்குத் திசையைக் குறிக்கிறது.
- source_word: וּבְשִׁיחוֹר לִבְנָת
  choice: சீகோர்-லிப்னாத்தையும்
  rationale: இது கூட்டு இடப்பெயராகக் கருதப்பட்டு இணைப்புக்குறியுடன் ஒலிபெயர்க்கப்பட்டது; முந்தைய ‘அடைந்து’ என்ற எல்லை வினையோடு இணைக்கப்பட்டது.
