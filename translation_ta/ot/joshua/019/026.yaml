translation_notes:
  register: நவீனத் தரத் தமிழில், நில எல்லை விவரிப்புக்கு ஏற்ற தெளிவான நடையும் கண்ணியமான சொற்களும் பயன்படுத்தப்பட்டுள்ளன. எபிரெய வசனம் முந்தைய பட்டியலின் தொடராக இருப்பதால் துண்டுத்தொடராகத் தோன்றுகிறது; தமிழில் தெளிவுக்காக ‘ஆகியவையும் அதில் இருந்தன’ மற்றும் ‘எல்லை’ என்பவை வெளிப்படையாகச் சேர்க்கப்பட்டுள்ளன.
