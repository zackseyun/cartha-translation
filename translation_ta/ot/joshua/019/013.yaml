  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான எல்லை-விவரிப்பு நடை பயன்படுத்தப்பட்டது. மூலத்தில் மறைமுகமாக உள்ள எல்லைக்கோட்டைத் தெளிவுபடுத்த ‘எல்லை’ சேர்க்கப்பட்டது. இடப்பெயர்கள் எபிரெய வடிவங்களை அணுகியவாறு ஒலிபெயர்க்கப்பட்டன; கடினமான இறுதிக் கூற்றின் ஐயம் அடிக்குறிப்பில் வெளிப்படையாகப் பாதுகாக்கப்பட்டது.
