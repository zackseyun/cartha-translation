base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/013.yaml
  text: From there it passed eastward[a], toward the sunrise, to Gath-hepher, to Eth-kazin, and went out to Rimmon[c][b], which extends to Neah.
translation:
  language: ta
  text: அங்கிருந்து எல்லை கிழக்கு நோக்கி, சூரியன் உதிக்கும் திசையில்[a], கத்-எப்பேர் வரைச் சென்று, எத்-காத்சீன் வரை நீண்டது.[b] பின்னர் அது ரிம்மோன் வரைச் சென்று, நேயாவரை நீண்டது.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அங்கிருந்து அது கிழக்கே சென்றது’ என்றும் மொழிபெயர்க்கலாம். எபிரெயத்தில் எழுத்துப்படி ‘கிழக்கு நோக்கி, சூரியன் உதிக்கும் திசையில்’ எனத் திசையைக் குறிக்கும் இரண்டு சொற்றொடர்கள் வருகின்றன; இது வலியுறுத்தலாக இருக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயம் ‘எத்-காத்சீன்’; இதைச் சிலர் ‘இத்தா-காத்சீன்’ எனப் புரிந்துகொள்கிறார்கள்.
    reason: alternative_reading
  - marker: c
    text: இக்கூற்றின் எபிரெயம் தெளிவற்றது; எழுத்துப்படி ‘நேயாவை நோக்கிய வரையறுக்கப்பட்ட ரிம்மோன்’ அல்லது அதைப் போன்ற பொருளைத் தரலாம். எல்லை ரிம்மோனிலிருந்து நேயாவரை நீண்டது என்பதே பலரின் புரிதல்.
    reason: alternative_reading
lexical_decisions:
- source_word: וּמִשָּׁם
  choice: அங்கிருந்து
  rationale: இணைப்புச்சொல், முன்னிடைச்சொல், இடவினையடை ஆகியவை சேர்ந்த இச்சொல் எழுத்துப்படி ‘அங்கிருந்து’ அல்லது ‘அங்கிருந்தும்’ எனப் பொருள்படும். எல்லை விவரிப்பின் தொடர்ச்சியை இயல்பாகக் காட்ட ‘அங்கிருந்து’ என மொழிபெயர்க்கப்பட்டது.
- source_word: עָבַר
  choice: எல்லை ... கடந்து சென்று
  rationale: நில எல்லைகளை விவரிக்கும் சூழலில், எல்லைக்கோடு ஓர் இடத்திலிருந்து மற்றோர் இடத்திற்குச் செல்வதை இவ்வினைச்சொல் குறிக்கிறது. தமிழில் எழுவாய் தெளிவாக இருக்க மூலத்தில் மறைமுகமாக உள்ள ‘எல்லை’ சேர்க்கப்பட்டது.
- source_word: קֵדְמָה מִזְרָחָה
  choice: கிழக்கு நோக்கி, சூரியன் உதிக்கும் திசையில்
  rationale: எபிரெயத்தில் கிழக்குத் திசையைக் குறிக்கும் இரண்டு சொற்றொடர்கள் அடுத்தடுத்து வந்து திசையை வலியுறுத்துகின்றன. அவற்றை ஒன்றாகச் சுருக்காமல் இரண்டின் படிமமும் தக்கவைக்கப்பட்டது.
- source_word: גִּתָּה חֵפֶר
  choice: காத்-எப்பேர்
  rationale: இது ஓர் இடப்பெயர்; எபிரெய உச்சரிப்பை நெருக்கமாகக் காட்டும் வகையில் ஒலிபெயர்க்கப்பட்டது.
- source_word: עִתָּה קָצִין
  choice: ஏத்-காத்சீன்
  rationale: மசோரா பிரிப்பின் அடிப்படையில் இது ஒரே இடப்பெயராக எடுத்துக்கொள்ளப்பட்டது. முதல் கூறை ‘இத்தா’ எனப் புரிந்துகொள்ளும் மாற்று வாய்ப்பு அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: וְיָצָא
  choice: அடைந்து
  rationale: எல்லை விவரிப்புகளில் இவ்வினைச்சொல் ஒரு கோடு வெளியே சென்று மற்றோர் இடத்தை எட்டுவதைக் குறிக்கலாம். இயல்பான தமிழ் எல்லை நடைக்காக ‘அடைந்து’ என வழங்கப்பட்டது.
- source_word: רִמּוֹן
  choice: ரிம்மோன்
  rationale: இடப்பெயர் எபிரெய ஒலிப்புக்கு ஏற்ப ஒலிபெயர்க்கப்பட்டது.
- source_word: הַמְּתֹאָר הַנֵּעָה
  choice: நேயாவரை நீண்டது
  rationale: இக்கூற்றின் எபிரெயம் கடினமானது. எல்லை ரிம்மோனிலிருந்து நேயாவை நோக்கி நீளுகிறது என்ற சூழலுக்கு ஏற்ற புரிதல் முதன்மை உரையில் தரப்பட்டு, சொல்லமைப்பின் தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்பட்டது.
