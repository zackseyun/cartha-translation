base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/032.yaml
  text: For the sons of Naphtali[a], the sixth lot came out, for the sons of Naphtali according to their clans.
translation:
  language: ta
  text: நப்தலியின் மகன்களுக்கு, அவர்களுடைய குலங்களின்படி, ஆறாவது சீட்டு வெளிவந்தது[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “விழுந்தது.” எபிரெய வினைச்சொல்லின் நேரடிப் பொருள் “வெளியே வந்தது” அல்லது “புறப்பட்டது”; இங்கே அது சீட்டுப்போட்டதில் கிடைத்த முடிவைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבְנֵי נַפְתָּלִי
  choice: நப்தலியின் மகன்களுக்கு
  rationale: לְ இங்கு நிலப்பங்கீட்டைப் பெறும் கோத்திரத்தைக் குறிக்கிறது. ‘மகன்கள்’ என்பது எபிரெய கோத்திர மரபுத்தொடரைத் தக்கவைக்கிறது; சூழலில் இது நப்தலியின் வழிவந்தோரைக் கூட்டாகக் குறிக்கிறது.
- source_word: יָצָא
  choice: வந்தது
  rationale: வினைச்சொல்லின் அடிப்படைப் பொருள் ‘வெளியே வந்தது/வந்தது.’ சீட்டுப்போட்ட முடிவைக் குறிக்கும் இச்சூழலில் ‘வந்தது’ இயல்பாகவும் மூலத்திற்கு நெருக்கமாகவும் உள்ளது.
- source_word: הַגּוֹרָל
  choice: சீட்டு
  rationale: நிலப்பங்கீட்டைத் தீர்மானிப்பதற்காகப் போடப்பட்ட சீட்டை இச்சொல் குறிக்கிறது; நவீன தமிழில் ‘சீட்டு’ தெளிவானதும் இயல்பானதும் ஆகும்.
- source_word: הַשִּׁשִּׁי
  choice: ஆறாவது
  rationale: ‘சீட்டு’ என்பதைக் குறிப்பிடும் வரிசை எண்ணை நேரடியாக மொழிபெயர்க்கிறது.
- source_word: לְמִשְׁפְּחֹתָם
  choice: அவர்களுடைய குலங்களின்படி
  rationale: מִשְׁפָּחוֹת என்பது கோத்திரத்துக்குள் உள்ள உறவுமுறைப் பிரிவுகளைக் குறிக்கிறது. ‘குலங்கள்’ என்பது நவீன ‘குடும்பங்கள்’ என்பதைக் காட்டிலும் இந்தப் பரந்த சமூக அமைப்பைத் துல்லியமாக வெளிப்படுத்துகிறது.
