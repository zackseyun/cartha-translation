base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/034.yaml
  text: Then the border turned westward to Aznoth-tabor[a], and from there it went out to Hukkok, and it reached Zebulun on the south, and it reached Asher on the west, and Judah at the Jordan toward the east, where the sun rises.
translation:
  language: ta
  text: பின்பு எல்லை மேற்கே திரும்பி அஸ்னோத்-தாபோருக்குச் சென்று, அங்கிருந்து உக்கோக்குக்குப் போனது. அது தெற்கே செபுலோனை அடைந்து, மேற்கே ஆசேரை அடைந்தது; யூதாவையும், கிழக்கே சூரியன் உதிக்கும் திசையில் உள்ள யோர்தானையும் அடைந்தது.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய உரையில், “யூதாவையும், கிழக்கே சூரியன் உதிக்கும் திசையில் யோர்தானையும்” என்று உள்ளது. பொதுவாகப் புரிந்துகொள்ளப்படும் கோத்திர எல்லைகளின்படி நப்தலி யூதாவின் நிலப்பகுதியை நேரடியாகத் தொடவில்லை என்பதால், இங்குள்ள புவியியல் பொருள் தெளிவாக இல்லை. சிலர் இதை வேறுவிதமாகப் புரிந்துகொள்கிறார்கள் அல்லது உரையில் சிக்கல் இருக்கலாம் எனக் கருதுகிறார்கள்; இங்கு எபிரெய உரை உள்ளபடியே மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: textual_variant
lexical_decisions:
- source_word: וְשָׁב הַגְּבוּל
  choice: பின்பு எல்லை ... திரும்பி
  rationale: எல்லை விவரிப்புகளில் שוב என்பது பொதுவாக எல்லைக்கோடு திசை மாறுவதைக் குறிக்கிறது; தொடர் நிகழ்வை וְ உணர்த்துவதால் ‘பின்பு’ சேர்க்கப்பட்டது.
- source_word: יָמָּה
  choice: மேற்கே
  rationale: சொல்லாட்சியாக ‘கடலை நோக்கி’ என்றாலும், இங்கு மத்தியதரைக் கடலை அடிப்படையாகக் கொண்ட மேற்குத் திசையே பொருள்.
- source_word: אַזְנוֹת תָּבוֹר
  choice: அஸ்னோத்-தாபோர்
  rationale: இடப்பெயர் பொருளாக்கப்படாமல், எபிரெய ஒலிக்கு அண்மையாக எழுத்துப்பெயர்க்கப்பட்டது.
- source_word: וְיָצָא מִשָּׁם חוּקֹקָה
  choice: அங்கிருந்து உக்கோக்குக்குப் போனது
  rationale: எல்லைச் சூத்திரங்களில் יצא என்பது எல்லைக்கோடு ஓர் இடத்திலிருந்து தொடர்ந்து செல்வதைக் குறிக்கிறது; இயல்பான நவீனத் தமிழில் வழங்கப்பட்டது.
- source_word: וּפָגַע
  choice: அடைந்தது
  rationale: நில எல்லை விவரிப்பில் פגע என்பது மற்றொரு பகுதி அல்லது அடையாளத்தை வந்து தொடுதல்/சந்தித்தலைக் குறிக்கிறது.
- source_word: בִּזְבֻלוּן מִנֶּגֶב
  choice: தெற்கே செபுலோனை
  rationale: செபுலோன் இந்த எல்லைத் தொடர்பின் தென்புறத்தில் இருந்ததைச் சுருக்கமாகத் தெரிவிக்கிறது.
- source_word: וּבְאָשֵׁר פָּגַע מִיָּם
  choice: மேற்கே ஆசேரை அடைந்தது
  rationale: מִיָּם சொல்லாட்சியாக ‘கடல்புறத்திலிருந்து’ என்றாலும், இத்திசைச் சூழலில் மேற்குப் பக்கத்தைக் குறிக்கிறது.
- source_word: וּבִיהוּדָה
  choice: யூதாவையும்
  rationale: புவியியல் சிக்கல் இருந்தபோதும், மசோரா எபிரெய உரையில் உள்ள யூதா என்ற பெயர் ஊகத் திருத்தமின்றித் தக்கவைக்கப்பட்டது.
- source_word: הַיַּרְדֵּן מִזְרַח הַשָּׁמֶשׁ
  choice: கிழக்கே சூரியன் உதிக்கும் திசையில் யோர்தானின் அருகே
  rationale: מִזְרַח הַשָּׁמֶשׁ என்பதன் திசை மற்றும் உருவகச் சொல்லாட்சி இரண்டையும் காக்கிறது; யோர்தான் என்பது ஆற்றின் வழக்கமான பெயராக வழங்கப்பட்டது.
theological_decisions:
- issue: ‘யோர்தானின் அருகே யூதா’ என்ற புவியியல் ரீதியாகக் கடினமான வாசகம்
  choice: மசோரா உரையின் வாசகத்தை முதன்மை உரையில் ஊகத் திருத்தமின்றித் தக்கவைத்தல்
  alternative: ‘யூதா’ என்பது எழுத்துப்பிழை எனக் கருதுதல், கிழக்கு யோர்தானிலிருந்த யூதா சார்ந்த குடியிருப்புகளைக் குறிக்கும் என விளக்குதல், அல்லது நேரடி எல்லைத் தொடர்பைத் தவிர்க்க உரையைச் சீராக்குதல்
  rationale: இது கோட்பாட்டுச் சிக்கல் அல்ல; முக்கியமான உரை மற்றும் புவியியல் விளக்கச் சிக்கல். உண்மையான தெளிவின்மையை மறைக்காமல் எபிரெய உரையை உள்ளபடியே மொழிபெயர்த்து, சிக்கலை அடிக்குறிப்பில் தெரிவிப்பது ஏற்றது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் மதிப்புமிக்க நடையிலும் எல்லை விவரிப்பு வழங்கப்பட்டுள்ளது. இடப்பெயர்கள் எபிரெய வடிவங்களுக்கு அண்மையாக எழுத்துப்பெயர்க்கப்பட்டுள்ளன. கடினமான புவியியல் வாசகம் முதன்மை உரையில் பாதுகாக்கப்பட்டு அடிக்குறிப்பால் விளக்கப்பட்டுள்ளது.
