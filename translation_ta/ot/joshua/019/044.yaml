lexical_decisions:
- source_word: אֶלְתְּקֵה
  choice: எல்தெக்கே
  rationale: எல்லைப் பட்டியலில் வரும் ஊர்ப்பெயர். பொருளாக்காமல், எபிரெய ஒலிவடிவத்தை நவீன தமிழில் இயல்பாக ஒலிபெயர்த்துள்ளது.
- source_word: גִבְּתוֹן
  choice: கிப்பெத்தோன்
  rationale: ஊர்ப்பெயர். எபிரெயச் சொல்லின் மெய்யொலி வலிமையையும் உயிரொலி அமைப்பையும் தமிழில் அண்மையாகக் காட்டும் ஒலிபெயர்ப்பு.
- source_word: בַעֲלָת
  choice: பாலாத்
  rationale: இது இங்கு பொதுப்பெயராக அல்ல, ஊர்ப்பெயராகச் செயல்படுகிறது; ஆகவே மொழிபெயர்க்காமல் ஒலிபெயர்க்கப்பட்டுள்ளது. இறுதி tav ஒலி ‘த்’ எனப் பாதுகாக்கப்பட்டுள்ளது.
- source_word: וְ
  choice: பட்டியல் காற்புள்ளிகள்
  rationale: எபிரெயத்தில் ஒவ்வொரு பெயருக்கும் முன் இணைப்பிடைச்சொல் வந்தாலும், மூன்று ஊர்ப்பெயர்களைக் கொண்ட தமிழ்ப் பட்டியலில் காற்புள்ளிகள் இயல்பான இணைப்பை வழங்குகின்றன; பொருள் மாறாது.
