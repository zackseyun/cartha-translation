- source_word: קֶדֶשׁ
  choice: கேதேஸ்
  rationale: இது ஒரு நகரத்தின் பெயர்; பொருளாக்காமல், எபிரெய ஒலிப்புக்கு நெருக்கமாகத் தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: אֶדְרֶעִי
  choice: எத்ரேயி
  rationale: இது இடப்பெயர் என்பதால் ஒலிபெயர்க்கப்பட்டுள்ளது; இறுதியிலுள்ள இரட்டை உயிரொலியைத் தமிழில் இயல்பாகக் காட்ட ‘ரேயி’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: עֵין חָצוֹר
  choice: ஏன்-ஆசோர்
  rationale: இது கூட்டுச் சொலாக அமைந்த இடப்பெயர். עֵין என்பதற்கு ‘ஊற்று’ என்று பொருள் இருந்தாலும், நகரங்களின் பட்டியலில் பெயர்ச் செயல்பாட்டைப் பேணுவதற்காக முழுப் பெயரும் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: וְ
  choice: ஆகிய
  rationale: எபிரெயத்தில் ஒவ்வொரு பெயருக்கும் முன் வரும் இணைப்புச் சொல், தமிழில் இயல்பான பட்டியல் நடைக்கேற்ப இறுதியில் ‘ஆகிய நகரங்கள்’ எனத் தொகுத்துக் காட்டப்பட்டுள்ளது.
