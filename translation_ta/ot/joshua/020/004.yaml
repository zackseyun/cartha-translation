  text: וְ/נָ֞ס אֶל אַחַ֣ת מֵ/הֶ/עָרִ֣ים הָ/אֵ֗לֶּה וְ/עָמַד֙ פֶּ֚תַח שַׁ֣עַר הָ/עִ֔יר וְ/דִבֶּ֛ר בְּ/אָזְנֵ֛י זִקְנֵ֥י הָ/עִֽיר הַ/הִ֖יא אֶת דְּבָרָ֑י/ו וְ/אָסְפ֨וּ אֹת֤/וֹ הָ/עִ֨ירָ/ה֙ אֲלֵי/הֶ֔ם וְ/נָתְנוּ ל֥/וֹ מָק֖וֹם וְ/יָשַׁ֥ב עִמָּֽ/ם־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/020/004.yaml
  text: He shall flee to one of these cities and stand at the entrance of the city gate[a], and he shall speak his case in the hearing of the elders of that city. Then they shall take him into the city to themselves, and they shall give him a place[b], and he shall live with them.
translation:
  language: ta
  text: அவன் இந்த நகரங்களில் ஒன்றிற்கு ஓடிப்போய், நகரவாசல் நுழைவில் நின்று, அந்த நகரத்தின் மூப்பர்கள் கேட்கும்படி தன் வழக்கை[a] எடுத்துச் சொல்ல வேண்டும். அப்போது அவர்கள் அவனை நகரத்துக்குள் அழைத்து, தங்களோடு சேர்த்துக்கொள்ள வேண்டும்[b]; அவனுக்கு ஓர் இடம் கொடுக்க வேண்டும்; அவன் அவர்களோடு குடியிருக்க வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது “தன் வார்த்தைகளை” அல்லது “தன் காரியத்தை.” எபிரெயச் சொல் அவன் பேசும் வார்த்தைகளையோ, அவன் முன்வைக்கும் வழக்கையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது “அவனை நகரத்துக்குள் அழைத்து வந்து, தங்களிடையே ஏற்றுக்கொள்ள வேண்டும்.” எபிரெய வினைச்சொல் “சேர்த்துக்கொள்ளுதல்,” “உள்ளே கொண்டுவருதல்,” அல்லது “ஏற்றுக்கொள்ளுதல்” என்று பொருள்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָס
  choice: ஓடிப்போய்
  rationale: சட்ட நடைமுறையை அறிவுறுத்தும் தொடரில் வரும் எபிரெய வினைச்சொல்லின் பொருளைத் தமிழில் இயல்பாகக் காட்ட, தொடர்ந்து வரும் ‘வேண்டும்’ என்பதோடு இணைக்கப்பட்டது.
- source_word: אַחַת מֵהֶעָרִים הָאֵלֶּה
  choice: இந்த நகரங்களில் ஒன்றிற்கு
  rationale: பகுதிப்பொருள் கட்டமைப்பைத் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: וְעָמַד פֶּתַח שַׁעַר הָעִיר
  choice: நகரவாசலின் நுழைவிடத்தில் நின்று
  rationale: פֶּתַח என்பதன் ‘நுழைவிடம்’ என்ற பொருளையும், שַׁעַר என்பதன் நகரவாசல் என்ற குடிமை மற்றும் நீதித்துறைச் சூழலையும் காக்கிறது.
- source_word: וְדִבֶּר בְּאָזְנֵי
  choice: கேட்கும்படி ... எடுத்துச் சொல்ல வேண்டும்
  rationale: ‘செவிகளில் பேசுதல்’ என்ற எபிரெய மரபுத்தொடரைச் சொற்சொல்லாக அல்லாமல், கேட்கும் முன்னிலையில் முறையாக எடுத்துரைப்பது என்ற இயல்பான தமிழில் தருகிறது.
- source_word: זִקְנֵי הָעִיר הַהִיא
  choice: அந்த நகரத்தின் மூப்பர்கள்
  rationale: הַהִיא தரும் குறிப்புத்தன்மையை ‘அந்த நகரம்’ என்று காக்கிறது; மூப்பர்கள் என்பது அதிகாரப்பூர்வ நகரத் தலைவர்களைக் குறிக்கிறது.
- source_word: אֶת דְּבָרָיו
  choice: தன் வழக்கை
  rationale: דָּבָר என்பது ‘வார்த்தை,’ ‘காரியம்,’ அல்லது ‘வழக்கு’ எனப் பொருள்படலாம். நீதித்துறைச் சூழலில் ‘வழக்கு’ பொருத்தமானது; மாற்றுப் பொருள்கள் அடிக்குறிப்பில் காக்கப்பட்டுள்ளன.
- source_word: וְאָסְפוּ אֹתוֹ הָעִירָה אֲלֵיהֶם
  choice: அவனை நகரத்துக்குள் தங்களிடம் சேர்த்துக்கொண்டு
  rationale: אָסַף என்பதன் சேர்த்தல் அல்லது ஏற்றுக்கொள்ளுதல் என்ற பொருளையும், நகரத்துக்குள் செல்லும் இயக்கத்தையும், אֲלֵיהֶם என்பதன் உறவுசார் கூறையும் ஒருங்கே காக்கிறது.
- source_word: וְנָתְנוּ לוֹ מָקוֹם
  choice: அவனுக்கு ஓர் இடம் கொடுக்க வேண்டும்
  rationale: מָקוֹם என்பதன் பரந்த ‘இடம்’ என்ற பொருளைக் காத்து, அது தங்குமிடமா வேறு ஒதுக்கப்பட்ட இடமா என்பதைத் தேவையின்றிக் குறுக்கவில்லை.
- source_word: וְיָשַׁב עִמָּם
  choice: அவன் அவர்களோடு குடியிருக்க வேண்டும்
  rationale: குடியேற்றம் மற்றும் வாழ்விடம் சார்ந்த சூழலில் יָשַׁב என்பதன் ‘வசித்தல்’ என்ற பொருளை இயல்பான, dignified தமிழில் வெளிப்படுத்துகிறது.
