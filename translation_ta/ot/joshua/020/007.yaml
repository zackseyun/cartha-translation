base_translation:
  language: en
  yaml_path: translation/ot/joshua/020/007.yaml
  text: So they set apart Kedesh in Galilee in the hill country of Naphtali[a], and Shechem in the hill country of Ephraim, and Kiriath-arba (that is, Hebron) in the hill country of Judah.
translation:
  language: ta
  text: அவர்கள் கேதேசையும், நப்தலியின் மலைநாட்டிலுள்ள கலிலேயாவிலும்; சீகேமையும், எப்பிராயீமின் மலைநாட்டிலும்; கீரியாத்-அர்பாவையும் (அதாவது, எபிரோனையும்), யூதாவின் மலைநாட்டிலும் ஒதுக்கிவைத்தார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּקְדִּשׁוּ
  choice: ஒதுக்கிவைத்தார்கள்
  rationale: அடைக்கல நகரங்களாக ஒரு சிறப்பான சட்டப்பூர்வப் பயன்பாட்டிற்கென இந்நகரங்களைத் தனியே நியமித்த செயலை இது குறிக்கிறது; வழிபாட்டுச் சடங்கு சார்ந்த பரிசுத்தப்படுத்தலை தேவையின்றி உணர்த்துவதில்லை.
- source_word: קֶדֶשׁ
  choice: கேதேசு
  rationale: இடப்பெயர் என்பதால் அதன் எபிரெய ஒலிப்புக்கு நெருக்கமாக ஒலிபெயர்க்கப்பட்டது.
- source_word: בַּגָּלִיל
  choice: கலிலேயாவில்
  rationale: கலிலேயா என்ற புவியியல் பிரதேசத்தைக் குறிக்கும் வழக்கமான நவீனத் தமிழ் வடிவம்.
- source_word: בְּהַר נַפְתָּלִי
  choice: நப்தலியின் மலைநாட்டில்
  rationale: הַר இங்கு ஒரு தனி மலையையல்ல, நப்தலி கோத்திரப் பகுதியிலுள்ள மேட்டு அல்லது மலைப்பாங்கான பிரதேசத்தைக் குறிக்கிறது.
- source_word: שְׁכֶם
  choice: சீகேம்
  rationale: நவீனத் தமிழில் அறியப்பட்ட வேதாகம இடப்பெயர் வடிவம்.
- source_word: בְּהַר אֶפְרָיִם
  choice: எப்பிராயீமின் மலைநாட்டில்
  rationale: ஒரு தனி சிகரத்தைவிட எப்பிராயீமுடன் தொடர்புடைய மலைப்பாங்கான பிரதேசமே இங்கு குறிக்கப்படுகிறது.
- source_word: קִרְיַת אַרְבַּע
  choice: கீரியாத்-அர்பா
  rationale: நிலையான இடப்பெயர் என்பதால் ‘அர்பாவின் நகரம்’ என்று பொருளாக்காமல் ஒலிபெயர்க்கப்பட்டது.
- source_word: הִיא חֶבְרוֹן
  choice: (அதாவது, எபிரோன்)
  rationale: கீரியாத்-அர்பா என்பதே எபிரோன் என்பதை விளக்கும் மூலமொழியின் அடையாளப்படுத்தும் கூற்றை இயல்பான அடைப்புக்குறி விளக்கமாகத் தருகிறது.
- source_word: בְּהַר יְהוּדָה
  choice: யூதாவின் மலைநாட்டில்
  rationale: யூதாவின் மலைப்பாங்கான பிரதேசத்தைக் குறிக்கிறது; ஒரு தனி மலையைக் குறிக்கவில்லை.
