translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டது. இடப்பெயர்கள் தமிழில் பரவலாக அறியப்பட்ட வடிவங்களிலும், தேவையான இடத்தில் எபிரெய ஒலிப்புக்கு நெருக்கமாகவும் தரப்பட்டுள்ளன. ஆங்கில ஆலோசனை உரையில் [a] குறி நப்தலி என்பதற்குப் பின் இருந்தாலும், அதன் அடிக்குறிப்பு கீரியாத்-அர்பா/எபிரோன் அடையாளத்தை விளக்குவதால் தமிழில் குறி அதற்குரிய இடத்தில் வைக்கப்பட்டது.
