source:
  edition: WLC
  text: דַּבֵּ֛ר אֶל בְּנֵ֥י יִשְׂרָאֵ֖ל לֵ/אמֹ֑ר תְּנ֤וּ לָ/כֶם֙ אֶת עָרֵ֣י הַ/מִּקְלָ֔ט אֲשֶׁר דִּבַּ֥רְתִּי אֲלֵי/כֶ֖ם בְּ/יַד מֹשֶֽׁה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/020/002.yaml
  text: Speak to the sons of Israel[a], saying, ‘Appoint for yourselves the cities of refuge, about which I spoke to you through Moses,’
translation:
  language: ta
  text: 'இஸ்ரவேல் மக்களிடம் இவ்வாறு சொல்: “நான் மோசேயின் மூலமாக[a] உங்களுக்குச் சொன்ன அடைக்கலப் பட்டணங்களை உங்களுக்கென நியமியுங்கள்.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “மோசேயின் கையால்”; இது “மோசேயின் மூலமாக” என்று பொருள்படும் வழக்குத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבֵּר ... לֵאמֹר
  choice: பேசிச் சொல்
  rationale: எபிரெய மொழியின் கட்டளையையும் அதைத் தொடர்ந்து வரும் மேற்கோள் அறிமுகத்தையும் இயல்பான நவீனத் தமிழில் ஒருங்கிணைக்கிறது.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்கள்
  rationale: சொல்லுக்குச் சொல் வடிவம் ‘இஸ்ரவேலின் மகன்கள்’ என்றாலும், இங்கு அது உடன்படிக்கை மக்களைக் குறிக்கும் வழக்கமான குழுப்பெயர்; ‘இஸ்ரவேல் மக்கள்’ என்பது பாலினத்தைத் தவறாகக் குறுக்காமல் இயல்பாக அந்தப் பொருளைத் தருகிறது.
- source_word: תְּנוּ לָכֶם
  choice: உங்களுக்காக நியமியுங்கள்
  rationale: נתן என்பதன் அடிப்படைப் பொருள் ‘கொடு’; இந்நிர்வாகச் சூழலில் குறிப்பிட்ட நோக்கத்திற்காக நகரங்களை ஒதுக்கி நியமிப்பதே கருத்து. ‘உங்களுக்காக’ என்பது לָכֶם-ஐப் பாதுகாக்கிறது.
- source_word: עָרֵי הַמִּקְלָט
  choice: அடைக்கலப் பட்டணங்கள்
  rationale: பாதுகாப்புக்காகச் சட்டப்படி ஒதுக்கப்பட்ட நகரங்களைக் குறிக்கும் சொல்லைத் தெளிவாகவும் வேதாகமச் சூழலுக்கு ஏற்றவாறும் வழங்குகிறது.
- source_word: אֲשֶׁר דִּבַּרְתִּי אֲלֵיכֶם
  choice: நான் உங்களுக்குச் சொன்ன
  rationale: தமிழில் இயல்பான தொடர்புப்பெயர் அமைப்பைப் பயன்படுத்தி, தேவன் முன்பு அறிவித்த அதே பட்டணங்கள் என்ற குறிப்பைத் தக்கவைக்கிறது.
- source_word: בְּיַד מֹשֶׁה
  choice: மோசேயின் மூலமாக
  rationale: ‘மோசேயின் கையால்’ என்ற எபிரெய வழக்குத்தொடர் இடைமுகச் செயற்பாட்டைக் குறிக்கிறது; தமிழில் ‘மூலமாக’ அதன் பொருளை இயல்பாகத் தெரிவிக்கிறது.
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל என்ற பாலின வடிவுடைய உடன்படிக்கைப் பெயர்
  choice: இஸ்ரவேல் மக்கள்
  alternative: இஸ்ரவேலின் மகன்கள்
  rationale: எபிரெயச் சொற்றொடர் இலக்கண ரீதியில் ஆண்பால் பன்மை என்றாலும், இச்சூழலில் முழு இஸ்ரவேல் சமூகத்தையும் குறிக்கிறது. தமிழில் ‘மகன்கள்’ என்பது ஆண்களை மட்டும் குறிக்கும் வாய்ப்புள்ளதால், ‘மக்கள்’ மூலத்தின் சமூகக் குறிப்பைத் துல்லியமாக வழங்குகிறது.
- issue: בְּיַד מֹשֶׁה என்பதில் மோசேயின் இடைமுகப் பங்கு
  choice: மோசேயின் மூலமாக
  alternative: மோசேயின் கையால்
  rationale: தேவனுடைய முந்தைய கட்டளை மோசே வழியாகத் தெரிவிக்கப்பட்டது என்ற இடைமுகப் பொருளை இயல்பான தமிழில் பாதுகாக்கிறது; சொல்லுக்குச் சொல் வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கட்டளைநடை பயன்படுத்தப்பட்டுள்ளது. ‘பட்டணம்’ சட்ட-வரலாற்றுச் சூழலுக்கேற்ற வகையில் தேர்ந்தெடுக்கப்பட்டுள்ளது; மேற்கோளுக்குள் பன்மைக் கட்டளை தெளிவாக வைக்கப்பட்டுள்ளது.
