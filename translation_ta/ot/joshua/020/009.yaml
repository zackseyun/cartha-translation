  text: אֵ֣לֶּה הָיוּ֩ עָרֵ֨י הַ/מּֽוּעָדָ֜ה לְ/כֹ֣ל בְּנֵ֣י יִשְׂרָאֵ֗ל וְ/לַ/גֵּר֙ הַ/גָּ֣ר בְּ/תוֹכָ֔/ם לָ/נ֣וּס שָׁ֔מָּ/ה כָּל מַכֵּה נֶ֖פֶשׁ בִּ/שְׁגָגָ֑ה וְ/לֹ֣א יָמ֗וּת בְּ/יַד֙ גֹּאֵ֣ל הַ/דָּ֔ם עַד עָמְד֖/וֹ לִ/פְנֵ֥י הָ/עֵדָֽה׀־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/020/009.yaml
  text: These were the appointed cities for all the sons of Israel and for the sojourner residing among them[c][b][a], so that anyone who struck down a person unintentionally might flee there and not die by the hand of the avenger of blood until he stood before the congregation.
translation:
  language: ta
  text: இவை இஸ்ரயேல் மக்கள் அனைவருக்காகவும்[a], அவர்களிடையே குடியிருக்கும் அந்நியருக்காகவும்[b] நியமிக்கப்பட்ட நகரங்கள்; தற்செயலாக ஒருவரைக் கொன்ற எவரும் அங்கே தப்பியோடி, சபையின்[c] முன்னிலையில் நிற்கும்வரை இரத்தப்பழி வாங்குபவனின் கையால் உயிரிழக்காதபடி இந்நகரங்கள் நியமிக்கப்பட்டன.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மொழியில் சொற்படியாக, ‘இஸ்ரயேலின் மகன்கள் அனைவருக்கும்’; இச்சொற்றொடர் இங்கு இஸ்ரயேல் மக்கள் அனைவரையும் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: ‘குடியிருக்கும் அந்நியர்’ என்பது இஸ்ரயேலரல்லாதவராக இருந்தாலும், அவர்களுடைய சமூக ஒழுங்கின் கீழ் அவர்களிடையே வாழ்ந்தவரைக் குறிக்கிறது.
    reason: cultural_note
  - marker: c
    text: அல்லது, ‘கூட்டத்தின்’.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָרֵי הַמּוּעָדָה
  choice: நியமிக்கப்பட்ட நகரங்கள்
  rationale: מוּעָדָה என்ற சொல் நியமிக்கப்பட்ட அல்லது குறித்துவைக்கப்பட்ட ஒன்றைக் குறிக்கிறது. இச்சொற்றொடரில் வெளிப்படையாக இல்லாத ‘அடைக்கல’ என்ற கருத்தை முதன்மை உரைக்குள் சேர்க்காமல், எபிரெயச் சொல்லின் முறையான பொருளைப் பேணுகிறது.
- source_word: לְכֹל בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரயேல் மக்கள் அனைவருக்காகவும்
  rationale: בְּנֵי יִשְׂרָאֵל என்பதன் சொற்பொருள் ‘இஸ்ரயேலின் மகன்கள்’ என்றாலும், இங்கு அது இஸ்ரயேல் மக்களை மொத்தமாகக் குறிக்கும் வழக்குச் சொற்றொடர். நவீனத் தமிழில் இயல்பாகவும் உள்ளடக்கப் பரப்பைத் தெளிவாகவும் தெரிவிக்க ‘இஸ்ரயேல் மக்கள்’ பயன்படுத்தப்பட்டுள்ளது; சொல்வடிவம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: וְלַגֵּר הַגָּר בְּתוֹכָם
  choice: அவர்களிடையே குடியிருக்கும் அந்நியருக்காகவும்
  rationale: גֵּר என்பது வழிப்போக்கரை மட்டும் அல்லாமல், இஸ்ரயேல் சமூகத்தின் நடுவில் வாழும் அந்நியக் குடியிருப்பாளரைக் குறிக்கும் சட்ட-சமூகச் சொல். ‘குடியிருக்கும் அந்நியர்’ என்பது இதை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: לָנוּס שָׁמָּה
  choice: அங்கே தப்பியோடி
  rationale: נוּס என்பது ஆபத்திலிருந்து ஓடித் தப்புவதைக் குறிக்கிறது. ‘தப்பியோடி’ என்பது இயக்கத்தையும் பாதுகாப்பை நாடும் சூழலையும் சுருக்கமாகத் தருகிறது.
- source_word: כָּל מַכֵּה נֶפֶשׁ בִּשְׁגָגָה
  choice: ஒருவரை அறியாமல் கொன்ற எவரும்
  rationale: מַכֵּה נֶפֶשׁ என்பது ஒருவரின் உயிரைப் பறிக்கும் விதமாக அடித்தவனைக் குறிக்கும் சட்ட வழக்கு; בִּשְׁגָגָה நோக்கமின்மையைச் சுட்டுகிறது. தமிழில் ‘அறியாமல் கொன்ற’ என்பது திட்டமிடாத கொலையைத் தெளிவாகக் கூறுகிறது.
- source_word: וְלֹא יָמוּת בְּיַד גֹּאֵל הַדָּם
  choice: இரத்தப்பழி வாங்குகிறவனின் கையால் சாகாமல்
  rationale: גֹּאֵל הַדָּם என்பது கொல்லப்பட்ட உறவினருக்காக இரத்தப்பழி வாங்கும் சட்டப்பூர்வ குடும்பப் பிரதிநிதி. ‘இரத்தப்பழி வாங்குகிறவன்’ இந்தப் பங்கைக் காட்டுகிறது; ‘கையால்’ மூலத்திலுள்ள செயற்பாட்டு உருவகத்தையும் பேணுகிறது.
- source_word: עַד עָמְדוֹ לִפְנֵי הָעֵדָה
  choice: சபையின் முன்னிலையில் நிற்கும்வரை
  rationale: עֵדָה இங்கு தீர்ப்புக்காகக் கூடும் சமூகக் குழுவைக் குறிக்கலாம். ‘சபை’ அதன் கூட்டு மற்றும் நீதிசார் தன்மையைத் தக்கவைக்கிறது; ‘நிற்கும்வரை’ பாதுகாப்பு நீடிக்கும் எல்லையைக் காட்டுகிறது.
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל என்ற பாலின வடிவமுள்ள தேசியச் சொற்றொடர்
  choice: இஸ்ரயேல் மக்கள் அனைவருக்கும்
  alternative: இஸ்ரயேலின் மகன்கள் அனைவருக்கும்
  rationale: இங்கு ஆண்பால் பன்மை வடிவம் தனிப்பட்ட ஆண்களை மட்டும் வரையறுக்காமல் தேசிய சமூகத்தைப் பிரதிநிதித்துவப்படுத்துகிறது. ஆகவே தமிழில் இயல்பான கூட்டுப்பெயர் முதன்மை உரையில் வைக்கப்பட்டு, சொற்படி வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: גֵּר என்பவரின் சட்ட-சமூக நிலை
  choice: குடியிருக்கும் அந்நியர்
  alternative: அந்நியக் குடியிருப்பாளர்
  rationale: வசனம் இஸ்ரயேலரல்லாத, ஆனால் அவர்களிடையே நிலையாக வாழும் ஒருவருக்கும் இச்சட்டப் பாதுகாப்பை விரிக்கிறது. நவீன அரசியல் அல்லது குடியேற்றப் பிரிவுகளை இறக்குமதி செய்யாமல் அந்த நிலையை இவ்வடிவம் தெரிவிக்கிறது.
- issue: הָעֵדָה என்பதன் சமூக-நீதிசார் பொருள்
  choice: சபை
  alternative: கூட்டம்
  rationale: இந்தச் சூழலில் அது வெறும் திரளைக் காட்டிலும் வழக்கைக் கேட்கும் சமூக அமைப்பைக் குறிக்கிறது. ‘சபை’ அந்த முறையான அம்சத்தைப் பேணுகிறது; மாற்று அடிக்குறிப்பில் குறிப்பிடப்படுகிறது.
translation_notes:
  register: நவீனத் தரமான, மரியாதைமிக்க, பொதுவாசகர்களுக்குப் புரியும் தமிழ்நடை பயன்படுத்தப்பட்டுள்ளது. சட்டச் சூழலுக்குரிய ‘நியமிக்கப்பட்ட’, ‘இரத்தப்பழி’, ‘முன்னிலையில்’ போன்ற சொற்கள் துல்லியத்திற்காகத் தக்கவைக்கப்பட்டுள்ளன; எபிரெயச் சொற்றொடர்களின் இயல்பற்ற சொற்படி அமைப்பு தமிழின் தெளிவுக்கேற்ப மாற்றப்பட்டுள்ளது.
