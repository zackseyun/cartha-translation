  naturalness: The legal register is generally natural modern Tamil. “சபையின் முன்” is more idiomatic and precise than “சபையார்முன்” for the corporate judicial body, and the final destination needs recasting for clarity.
  terminology: “தலைமைக் குரு” suitably renders the high priest in modern standard Tamil. “ஒருவரைக் கொன்றவன்” avoids implying a prior murder conviction while reading more naturally than the bare “கொன்றவன்.”
