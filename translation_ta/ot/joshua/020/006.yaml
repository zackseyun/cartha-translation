- issue: தலைமைக் குருவின் மரணத்திற்குப் பிந்தைய திரும்புதலின் வலிமை
  choice: சட்ட அனுமதியாக ‘திரும்பிச் செல்லலாம்’
  alternative: நிச்சய எதிர்காலமாக ‘திரும்பிச் செல்வான்’ அல்லது கட்டளையாக ‘திரும்ப வேண்டும்’
  rationale: சூழல் அடைக்கல நகரத்தில் தங்கியிருக்கும் கட்டுப்பாடு முடிந்து திரும்புவதற்கான உரிமை கிடைப்பதைக் குறிக்கிறது; அது கட்டாயமாக நிகழும் என்று சொல்லவில்லை.
