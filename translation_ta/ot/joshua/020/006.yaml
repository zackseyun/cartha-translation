    reason: lexical_alternative
  - marker: b
    text: 'வேறு மொழிபெயர்ப்பு: ‘கொன்றவன்’ அல்லது ‘உயிரைப் பறித்தவன்.’ இச்சொல் குற்றம் நிரூபிக்கப்பட்ட கொலைகாரன் என்பதைக் கட்டாயமாகக் குறிக்காது; அடைக்கல நகரச் சட்டத்தின் கீழ் விசாரிக்கப்படுகிறவனைக் குறிக்கிறது.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָשַׁב בָּעִיר הַהִיא
  choice: அந்த நகரத்தில் குடியிருக்க வேண்டும்
  rationale: ישׁב இங்கு அடைக்கல நகரத்தில் தொடர்ந்து வசிப்பதைக் குறிக்கிறது. ‘குடியிருக்க வேண்டும்’ என்பது சட்டக் கட்டாயத்தையும் தொடர்ந்திருப்பதையும் இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: עַד עָמְדוֹ לִפְנֵי הָעֵדָה לַמִּשְׁפָּט
  choice: நீதித்தீர்ப்புக்காகச் சபையார்முன் நிற்கும் வரையிலும்
  rationale: עמד לפני என்பது அதிகாரம் அல்லது நீதிச் சபையின் முன் ஆஜராவதைக் குறிக்கும் மரபுத்தொடர். עדה என்பது இங்கு சட்டத் தீர்ப்புக்காகக் கூடிய சமூகத்தாரைக் குறிக்கிறது.
- source_word: עַד מוֹת הַכֹּהֵן הַגָּדוֹל
  choice: தலைமைக் குரு இறக்கும் வரையிலும்
  rationale: எபிரெயக் கட்டமைப்பை இயல்பான நவீன தமிழில் வினைமுற்றுத் தொடராக அளிக்கிறது; הכהן הגדול என்பதற்கு தெளிவான பதவிப்பெயராக ‘தலைமைக் குரு’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: אֲשֶׁר יִהְיֶה בַּיָּמִים הָהֵם
  choice: அந்நாட்களில் பதவியில் இருக்கும்
  rationale: அந்தக் காலத்தில் அப்பொறுப்பை வகிக்கும் தலைமைக் குருவையே இத்தொடர் சுட்டுகிறது. ‘பதவியில் இருக்கும்’ என்பது உள்ளார்ந்த நிர்வாகப் பொருளைத் தெளிவாக்குகிறது.
- source_word: אָז יָשׁוּב ... וּבָא
  choice: அதன் பின்பு ... திரும்பிச் செல்லலாம்
  rationale: சட்ட நிபந்தனைகள் நிறைவேறியபின் அனுமதிக்கப்படும் திரும்புதலை ‘செல்லலாம்’ இயல்பாகத் தெரிவிக்கிறது; இரண்டு எபிரெய வினைகளின் இயக்கப் பொருள் தமிழில் ஒருங்கிணைக்கப்பட்டுள்ளது.
- source_word: הָרֹצֵחַ
  choice: கொன்றவன்
