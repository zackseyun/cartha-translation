  yaml_path: translation/ot/joshua/020/006.yaml
  text: And he shall live in that city until he stands before the congregation for judgment[a], until the death of the high priest who is in office in those days. Then the manslayer may return and come to his city and to his house[b], to the city from which he fled.
translation:
  language: ta
  text: அவன் அந்த நகரத்தில் குடியிருக்க வேண்டும்; நீதித்தீர்ப்புக்காகச் சபையின் முன் நிற்கும் வரையிலும்[a], அந்நாட்களில் பதவியில் இருக்கும் தலைமைக் குரு இறக்கும் வரையிலும் அவன் அங்கேயே இருக்க வேண்டும். அதன் பின்பு, ஒருவரைக் கொன்றவன்[b] தான் தப்பியோடிய நகரமாகிய தன் நகரத்திற்கும் தன் வீட்டிற்கும் திரும்பி வரலாம்.
  philosophy: optimal-equivalence
