  text: וְ/כִ֨י יִרְדֹּ֜ף גֹּאֵ֤ל הַ/דָּם֙ אַֽחֲרָ֔י/ו וְ/לֹֽא יַסְגִּ֥רוּ אֶת הָ/רֹצֵ֖חַ בְּ/יָד֑/וֹ כִּ֤י בִ/בְלִי דַ֨עַת֙ הִכָּ֣ה אֶת רֵעֵ֔/הוּ וְ/לֹֽא שֹׂנֵ֥א ה֛וּא ל֖/וֹ מִ/תְּמ֥וֹל שִׁלְשֽׁוֹם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/020/005.yaml
  text: And if the avenger of blood pursues him[a], they shall not hand the manslayer over into his hand, because he struck his neighbor without intent and had not hated him before, from yesterday or the day before.
translation:
  language: ta
  text: இரத்தப்பழி வாங்குகிறவன் அவனைத் துரத்தினால், அவர்கள் கொன்றவனை அவன் கையில் ஒப்படைக்கக் கூடாது. ஏனெனில், அவன் தன் அயலானை வேண்டுமென்றே அல்லாமல் அடித்தான்; அவனை முன்னும் பகைத்திருக்கவில்லை.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லர்த்தமாக, “நேற்றிலிருந்தும் முந்தின நாளிலிருந்தும் அல்ல”; இது “முன்பு” அல்லது “இதற்கு முன்னர்” என்று பொருள்படும் எபிரெய மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי יִרְדֹּף
  choice: துரத்தினால்
  rationale: சட்ட நடைமுறையில் நிகழக்கூடிய ஒரு சூழலை நிபந்தனையாக அறிமுகப்படுத்துகிறது; இயல்பான நவீனத் தமிழில் அந்த நிபந்தனைத் தெளிவாகக் காட்டுகிறது.
- source_word: גֹּאֵל הַדָּם
  choice: இரத்தப்பழி வாங்குகிறவன்
  rationale: கொல்லப்பட்டவரின் குடும்பத்தின் சார்பில் இரத்தப்பழி வாங்க முற்படும் நபரைக் குறிக்கும் சட்டச் சொல்லின் பொருளைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: וְלֹא יַסְגִּרוּ
  choice: அவர்கள் ... ஒப்படைக்கக் கூடாது
  rationale: ஒருவரை மற்றொருவரின் அதிகாரத்திற்குள் ஒப்புக்கொடுப்பதைக் குறிக்கும் வினையின் சட்ட வலிமையை இயல்பான தமிழில் தருகிறது; ‘அவர்கள்’ என்பது சூழலில் நகரின் பொறுப்பாளர்களைக் குறிக்கிறது.
- source_word: הָרֹצֵחַ
  choice: கொலை செய்தவனை
  rationale: இங்கு எண்ணமின்றிக் கொன்ற நபரே குறிப்பிடப்படுவதால், குற்றநோக்கமுள்ள ‘கொலைகாரன்’ என்ற சொல்லைத் தவிர்த்து நிகழ்ந்த செயலை மட்டும் குறிப்பிடுகிறது.
- source_word: בְּיָדוֹ
  choice: அவன் கையில்
  rationale: அந்த நபரை இரத்தப்பழி வாங்குகிறவனின் அதிகாரத்திற்கு உட்படுத்துவதைக் காட்டும் எபிரெய உருவகத்தைப் பாதுகாக்கிறது.
- source_word: בִּבְלִי דַעַת
  choice: வேண்டுமென்றே அல்லாமல்
  rationale: செயல் திட்டமிட்ட நோக்கத்துடன் செய்யப்படவில்லை என்ற சட்டப் பொருளைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: הִכָּה אֶת רֵעֵהוּ
  choice: தன் அயலானை ... அடித்தான்
  rationale: הכה என்பதன் நேரடிப் பொருளான ‘அடித்தான்’ என்பதையும் רֵעַ என்பதன் உறவுசார் பொருளான ‘அயலான்’ என்பதையும் காக்கிறது; மரணம் ஏற்பட்டது விரிவான சூழலிலிருந்து புரிகிறது.
- source_word: וְלֹא שֹׂנֵא הוּא לוֹ
  choice: அவனைப் பகைத்தவனும் அல்ல
  rationale: முன்பகை அல்லது முன்கூட்டிய தீய நோக்கம் இல்லை என்பதைத் தெரிவிக்கிறது.
- source_word: מִתְּמוֹל שִׁלְשׁוֹם
  choice: அதற்கு முன்பு
  rationale: முன்னிருந்த காலத்தைக் குறிக்கும் எபிரெய மரபுத்தொடரை இயல்பான தமிழில் தருகிறது; அதன் சொற்சொல் வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
theological_decisions:
- issue: அடைக்கல நகரச் சூழலில் הָרֹצֵחַ என்பவரின் சட்ட நிலை
  choice: ‘கொலை செய்தவன்’ என்று மொழிபெயர்த்தல்
  alternative: ‘கொலைகாரன்’
  rationale: இந்த வசனம் திட்டமிடாத கொலையையும் முன்பகையின்மையையும் வலியுறுத்துகிறது. ‘கொலைகாரன்’ என்பது நிரூபிக்கப்பட்ட குற்றநோக்கைக் குறிப்பதாகத் தோன்றலாம்; ஆகவே மூலவசனம் இந்நிலையில் சுமத்தாத குற்றத்தை மொழிபெயர்ப்பு சுமத்தாமல் இருக்கிறது.
- issue: בִּבְלִי דַעַת என்பதன் சட்டப் பொருள்
  choice: ‘வேண்டுமென்றே அல்லாமல்’
  alternative: ‘அறியாமல்’
  rationale: இங்கு வெறும் தகவலறியாமையைவிடச் செயலின் நோக்கமின்மையே முக்கியமானது. தேர்ந்த மொழியாக்கம் அந்த நீதித்துறை வேறுபாட்டைத் தெளிவாக்குகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளும் கண்ணியமான சட்டநடை பயன்படுத்தப்பட்டுள்ளது. ‘இரத்தப்பழி’, ‘ஒப்படைக்க’, ‘வேண்டுமென்றே அல்லாமல்’ ஆகியவை சட்டச் சூழலைத் தெளிவாக்குகின்றன; அதேவேளை மூலத்தின் உருவகமும் திட்டமின்மை குறித்த நுணுக்கமும் பாதுகாக்கப்பட்டுள்ளன.
