  text: לָ/נ֥וּס שָׁ֨מָּ/ה֙ רוֹצֵ֔חַ מַכֵּה נֶ֥פֶשׁ בִּ/שְׁגָגָ֖ה בִּ/בְלִי דָ֑עַת וְ/הָי֤וּ לָ/כֶם֙ לְ/מִקְלָ֔ט מִ/גֹּאֵ֖ל הַ/דָּֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/020/003.yaml
  text: so that a manslayer who strikes down a person unintentionally[a], without knowledge, may flee there[b], and they shall be for you a refuge from the avenger of blood.
translation:
  language: ta
  text: தற்செயலாகவும் அறியாமலும் ஒருவரைக் கொன்றவன்[a] அங்கே ஓடிச் செல்லும்படியாக, அவை உங்களுக்கு இரத்தப்பழி வாங்குகிறவனிடமிருந்து[b] அடைக்கலமாக இருக்கும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: வேறு விதமாக, ‘உயிரிழப்பை ஏற்படுத்தியவன்’ அல்லது ‘கொன்றவன்.’ இங்கு எபிரெயச் சொல் ‘தற்செயலாக’ என்றும் ‘அறியாமல்’ என்றும் வரையறுக்கப்படுவதால், வேண்டுமென்றே கொலை செய்தவனை இது குறிக்கவில்லை.
    reason: lexical_alternative
  - marker: b
    text: வேறு விதமாக, ‘இரத்தத்திற்குப் பழிவாங்குகிறவனிடமிருந்து.’ இஸ்ரவேலின் உறவுமுறை சார்ந்த சட்ட அமைப்பில், கொல்லப்பட்டவருக்காகப் பழிவாங்கும் பொறுப்புடைய நபரை எபிரெயச் சொற்றொடர் குறிக்கிறது.
    reason: cultural_note
lexical_decisions:
- source_word: לָנוּס שָׁמָּה
  choice: அங்கே தப்பி ஓடுவதற்காக
  rationale: לָנוּס என்பது முந்தைய கட்டளையின் நோக்கத்தைக் குறிக்கும்; שָׁמָּה அடைக்கல நகரங்களை நோக்கிய திசையைக் குறிக்கிறது. இயல்பான தமிழில் இரண்டையும் இணைத்து வழங்குகிறது.
- source_word: רוֹצֵחַ
  choice: கொன்றவன்
  rationale: இங்கு தொடரும் தகுதிச் சொற்கள் இது வேண்டுமென்றே செய்யப்பட்ட கொலை அல்ல என்பதைத் தெளிவுபடுத்துகின்றன. எனவே நோக்கமுள்ள கொலையாளி என்ற பொருளைத் தரக்கூடிய சொல்லைத் தவிர்க்கிறது.
- source_word: מַכֵּה נֶפֶשׁ
  choice: ஒருவரைக் கொன்றவன்
  rationale: சொல்லுக்கு சொல், ‘ஒரு நபரை அடிப்பவன்’; இச்சட்டச் சூழலில் உயிரிழப்பை ஏற்படுத்தியவனைக் குறிக்கிறது. ‘கொன்றவன்’ என்பது விளைவைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: בִּשְׁגָגָה בִּבְלִי דָעַת
  choice: தற்செயலாக, அறியாமல்
  rationale: முதல் சொல் தவறுதலான அல்லது நோக்கமற்ற செயலைக் குறிக்கிறது; அடுத்த சொற்றொடர் அறிவோ விழிப்புணர்வோ இன்றிச் செய்ததை வலியுறுத்துகிறது. இரு தனித்த நுணுக்கங்களும் தமிழில் பாதுகாக்கப்படுகின்றன.
- source_word: וְהָיוּ לָכֶם לְמִקְלָט
  choice: அவை உங்களுக்கு அடைக்கலமாக இருக்கும்
  rationale: பன்மை வினைச்சொல் முன்பு குறிப்பிடப்பட்ட நகரங்களைக் குறிக்கிறது. ‘அடைக்கலம்’ என்பது מִקְלָט என்பதன் இயல்பான, இச்சூழலுக்குரிய தமிழ் இணை.
- source_word: מִגֹּאֵל הַדָּם
  choice: இரத்தப்பழி வாங்குகிறவனிடமிருந்து
  rationale: இரத்தச்சிந்தலுக்காகப் பழிவாங்கும் உறவுசார் சட்டப் பொறுப்பாளரை இச்சொற்றொடர் குறிக்கிறது. முதன்மை உரை பணியைத் தெளிவாக்குகிறது; உறவுமுறைப் பின்னணி அடிக்குறிப்பில் விளக்கப்படுகிறது.
theological_decisions:
- issue: கொன்றவனின் சட்ட மற்றும் ஒழுக்க நிலை
  choice: வேண்டுமென்றே கொலை செய்தவன் அல்ல; தற்செயலாகவும் அறியாமலும் உயிரிழப்பை ஏற்படுத்தியவன்
  alternative: பொதுவாக ‘கொலையாளி’ என்று வழங்குதல்
  rationale: בִּשְׁגָגָה மற்றும் בִּבְלִי דָעַת ஆகிய இரண்டும் நோக்கமின்மையையும் அறியாமையையும் வெளிப்படையாக வரையறுக்கின்றன. ஆகவே முன்திட்டமிட்ட கொலையை உணர்த்தும் சொல்லை மொழிபெயர்ப்பு தவிர்க்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சட்ட நுணுக்கத்தைத் தெளிவாக வைத்துக்கொண்டு வாசிக்க எளிதான கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘தற்செயலாக’ மற்றும் ‘அறியாமல்’ என்ற இரட்டைக் கூறு மூலத்தின் நோக்கமின்மை மற்றும் அறிவின்மை ஆகிய தனித்த வலியுறுத்தல்களைப் பாதுகாக்கிறது.
