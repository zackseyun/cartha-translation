base_translation:
  language: en
  yaml_path: translation/ot/joshua/020/008.yaml
  text: And beyond the Jordan east of Jericho[a], they designated Bezer in the wilderness on the plateau from the tribe of Reuben, and Ramoth in Gilead from the tribe of Gad, and Golan in Bashan from the tribe of Manasseh.
translation:
  language: ta
  text: யோர்தானுக்கு அப்பால், எரிகோவுக்குக் கிழக்கே, ரூபன் கோத்திரத்தின் பங்கிலுள்ள வனாந்தர மேட்டுநிலத்தில் இருக்கும் பேசேரையும், காத் கோத்திரத்தின் பங்கிலுள்ள கீலேயாத்தில் இருக்கும் ராமோத்தையும்[a], மனாசே கோத்திரத்தின் பங்கிலுள்ள பாசானில் இருக்கும் கோலானையும் அவர்கள் ஒதுக்கினார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: மரபாக, ‘ராமோத்-கீலேயாத்’ எனப்படுகிறது. எபிரெயில் சொற்சொல்லாக, ‘கீலேயாத்திலுள்ள ராமோத்’ என்று உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמֵעֵבֶר לְיַרְדֵּן
  choice: யோர்தானுக்கு அப்பால்
  rationale: கானான் நாட்டின் கண்ணோட்டத்தில் யோர்தானின் மறுபக்கத்தைக் குறிக்கும் இடவியல் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: יְרִיחוֹ מִזְרָחָה
  choice: எரிகோவுக்குக் கிழக்கே
  rationale: திசையைக் குறிக்கும் எபிரெயக் கட்டமைப்பைத் தெளிவாகவும் சுருக்கமாகவும் வெளிப்படுத்துகிறது.
- source_word: נָתְנוּ
  choice: ஒதுக்கினார்கள்
  rationale: அடைக்கல நகரங்களை அதிகாரபூர்வமாகத் தேர்ந்தெடுத்து ஒதுக்கிய சூழலைக் காட்டுகிறது; வெறுமனே ‘கொடுத்தார்கள்’ என்பதைக் காட்டிலும் சூழலுக்குப் பொருத்தமானது.
- source_word: בֶּצֶר
  choice: பேசேர்
  rationale: எபிரெய இடப்பெயரின் ஒலிப்புக்கு நெருக்கமான தமிழ் எழுத்துப்பெயர்ப்பு.
- source_word: בַּמִּדְבָּר
  choice: வனாந்தரத்தில்
  rationale: பயிரிடப்படாத வறண்ட புல்நிலம் அல்லது காட்டுப்பகுதி என்ற பரந்த பொருளைத் தக்கவைக்கிறது.
- source_word: בַּמִּישֹׁר
  choice: மேட்டுநிலத்தில்
  rationale: யோர்தானுக்குக் கிழக்கிலுள்ள சமமான உயர்நிலப் பகுதியைக் குறிக்கும் நிலவியல் பொருளை நவீன வாசகருக்குத் தெளிவாக்குகிறது.
- source_word: מִמַּטֵּה רְאוּבֵן
  choice: ரூபன் கோத்திரத்திலிருந்து
  rationale: நகரம் எந்தக் கோத்திரப் பங்கில் இருந்தது என்பதை மூலத்தின் அமைப்பைப் பின்பற்றி தெரிவிக்கிறது.
- source_word: רָאמֹת בַּגִּלְעָד
  choice: கீலேயாத்திலிருந்த ராமோத்
  rationale: எபிரெயில் நகரப்பெயரும் பகுதியும் தனித்தனியாக வருவதைத் தக்கவைக்கிறது; மரபான கூட்டுப்பெயர் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: מִמַּטֵּה גָד
  choice: காத் கோத்திரத்திலிருந்து
  rationale: கோத்திரப் பங்கைச் சீரான தமிழ்க் கட்டமைப்பில் அடையாளப்படுத்துகிறது.
- source_word: גלון
  choice: கோலான்
  rationale: மெய்யெழுத்து வடிவம் அறியப்பட்ட கோலான் என்ற இடப்பெயரைக் குறிக்கிறது.
- source_word: בַּבָּשָׁן
  choice: பாசானிலிருந்த
  rationale: கோலான் அமைந்திருந்த பிராந்தியத்தை இயல்பான இடவியல் தொடராகத் தருகிறது.
- source_word: מִמַּטֵּה מְנַשֶּׁה
  choice: மனாசே கோத்திரத்திலிருந்து
  rationale: மனாசே கோத்திரத்தின் நிலப்பங்கைக் குறிக்கும் மூலச் சொல்லாக்கத்தைத் தக்கவைக்கிறது.
