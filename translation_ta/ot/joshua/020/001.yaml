  text: וַ/יְדַבֵּ֣ר יְהוָ֔ה אֶל יְהוֹשֻׁ֖עַ לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/020/001.yaml
  text: Then Yahweh spoke to Joshua[a], saying,
translation:
  language: ta
  text: 'பின்பு[a] யாவே யோசுவாவிடம் இவ்வாறு பேசினார்:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யாவே யோசுவாவிடம் இவ்வாறு பேசினார்.” எபிரெயக் கதைத் தொடர் வடிவத்தைச் சூழலுக்கேற்ப இணைப்புச் சொல்லுடனோ அது இல்லாமலோ தமிழில் வழங்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: பின்பு ... பேசினார்
  rationale: வாவ்-தொடர்நிலை வடிவம் கதையின் அடுத்த நிகழ்வை முன்னெடுக்கிறது. ‘பின்பு’ அதன் தொடர்ச்சியைக் காட்டுகிறது; דבר என்பதன் ‘பேசுதல்/உரையாற்றுதல்’ பொருளை ‘பேசினார்’ தக்கவைக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இது இறைவனின் தனிப்பெயரான நான்கு எழுத்துப் பெயர்; ஒரு பட்டத்தால் மாற்றாமல், நவீன தமிழில் வழக்கமான ஒலிபெயர்ப்பாக வழங்கப்பட்டுள்ளது.
- source_word: אֶל
  choice: யோசுவாவிடம்
  rationale: ‘ஒருவரிடம் பேசுதல்’ என்ற தமிழின் இயல்பான வேற்றுமை அமைப்பு எபிரெய முன்னிடைச்சொல்லின் உறவைக் காட்டுகிறது.
- source_word: יְהוֹשֻׁעַ
  choice: யோசுவா
  rationale: எபிரெய தனிப்பெயரின் தமிழில் நிலைபெற்ற வடிவம் பயன்படுத்தப்பட்டுள்ளது.
- source_word: לֵאמֹר
  choice: இவ்வாறு
  rationale: அடுத்து வரும் நேரடி உரையை அறிமுகப்படுத்தும் எபிரெய வாய்பாட்டை இயல்பான தமிழில் ‘இவ்வாறு’ குறிக்கிறது; ‘பேசினார்’ என்பதுடன் தேவையற்ற இரட்டிப்பையும் தவிர்க்கிறது.
theological_decisions:
- issue: இறைப்பெயரான יְהוָה-வை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூல உரை ஒரு பட்டத்தை அல்ல, இறைவனின் தனிப்பெயரை நேரடியாகப் பயன்படுத்துகிறது. ஆகவே அந்தப் பெயர் ஒலிபெயர்க்கப்பட்டுள்ளது.
translation_notes:
  register: நவீனத் தரத் தமிழில், எளிமையானதும் கண்ணியமானதும் வாசிக்க இயல்பானதுமான நடை பயன்படுத்தப்பட்டுள்ளது. அடுத்து வரும் இறைவாக்கை அறிமுகப்படுத்துவதற்காக இறுதியில் முக்காற்புள்ளி இடப்பட்டுள்ளது.
