language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַֽ/יְהִי֙ לִ/בְנֵ֣י אַהֲרֹ֔ן מִ/מִּשְׁפְּח֥וֹת הַ/קְּהָתִ֖י מִ/בְּנֵ֣י לֵוִ֑י כִּ֥י לָ/הֶ֛ם הָיָ֥ה הַ/גּוֹרָ֖ל רִיאשֹׁנָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/010.yaml
  text: It was for the sons of Aaron[a], from the families of the Kohathites, from the sons of Levi, because the first lot was for them.
translation:
  language: ta
  text: லேவியின் மக்களான கோகாத்தியரின் குடும்பங்களைச் சேர்ந்த ஆரோனின் மக்களுக்கு அது உரியதாயிற்று; ஏனெனில் முதல் சீட்டு அவர்களுடையதாக இருந்தது.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: அது உரியதாயிற்று
  rationale: விவரிப்பு தொடரில் வரும் היה என்பதன் இருப்பு/ஒதுக்கீட்டுப் பொருளை, முந்தைய சூழலிலுள்ள நகர ஒதுக்கீட்டைச் சுட்டும் வகையில் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: לִבְנֵי אַהֲרֹן
  choice: ஆரோனின் மக்களுக்கு
  rationale: ל இங்கு ஒதுக்கீடு அல்லது உரிமையைக் குறிக்கிறது; ‘மக்கள்’ என்ற மரபுவழிச் சொல் வம்சத் தொடர்பைத் தக்கவைக்கிறது.
- source_word: מִמִּשְׁפְּחוֹת
  choice: குடும்பங்களைச்
  rationale: מִשְׁפָּחוֹת என்பது விரிந்த குடும்பப் பிரிவுகளையோ குலங்களையோ குறிக்கலாம்; முதன்மை உரையில் எளிதில் புரியும் ‘குடும்பங்கள்’ பயன்படுத்தப்பட்டு, ‘குலங்கள்’ அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: הַקְּהָתִי
  choice: கோகாத்தியரின்
  rationale: லேவியருக்குள் உள்ள கோகாத் வழிவந்த பிரிவினரைச் சுட்டும் இன/வம்சப் பெயராக இயல்பான தமிழில் வழங்கப்படுகிறது.
- source_word: מִבְּנֵי לֵוִי
  choice: லேவியின் மக்களுள்
  rationale: கோகாத்திய குடும்பங்கள் லேவியின் சந்ததியினருக்குள் அடங்கியவை என்பதைத் தெளிவாகக் காட்டுவதோடு, மூலத்தின் வம்சவழிச் சொல்லாட்சியையும் காக்கிறது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: ஆரோனின் மக்களுக்கு ஒதுக்கீடு உரியதானதற்குக் காரணமாக முதல் சீட்டு அவர்களுக்குக் கிடைத்ததை வெளிப்படையாக இணைக்கிறது.
- source_word: לָהֶם
  choice: அவர்களுக்கே
  rationale: ஒதுக்கீட்டின் பெறுநர்களைச் சுட்டுகிறது; ‘-ஏ’ என்பது இங்கு முதல் சீட்டு அவர்களுக்குரியது என்ற வலியுறுத்தலை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: הַגּוֹרָל
  choice: சீட்டு
  rationale: பங்கீட்டைத் தீர்மானிக்கப் பயன்படுத்தப்பட்ட גוֹרָל என்பதற்கான தெளிவான, வழக்கமான தமிழ் இணைச்சொல்.
- source_word: רִאשֹׁנָה
  choice: முதல்
  rationale: பங்கீட்டுச் சீட்டுகளின் வரிசையில் முதலாவதைச் சுருக்கமாகவும் இயல்பாகவும் குறிக்கிறது.
