  register: நவீன பொதுத்தமிழில், வம்சவழி அமைப்பையும் பங்கீட்டுச் சூழலையும் காக்கும் கண்ணியமான உரைநடை. ‘குடும்பங்கள்/குலங்கள்’ என்ற மூலச்சொல்லின் பொருள் வீச்சு அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
