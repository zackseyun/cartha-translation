revisions:
- from: லேவியின் மக்களுள் கோகாத்தியரின் குடும்பங்களைச்[a] சேர்ந்த ஆரோனின் மக்களுக்கு அது உரியதாயிற்று; ஏனெனில் முதல் சீட்டு அவர்களுக்கே விழுந்தது.
  to: லேவியின் மக்களான கோகாத்தியரின் குடும்பங்களைச் சேர்ந்த ஆரோனின் மக்களுக்கு அது உரியதாயிற்று; ஏனெனில் முதல் சீட்டு அவர்களுடையதாக இருந்தது.
