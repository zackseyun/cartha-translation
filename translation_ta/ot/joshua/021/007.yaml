base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/007.yaml
  text: 'For the sons of Merari[a], according to their families, from the tribe of Reuben and from the tribe of Gad and from the tribe of Zebulun: twelve cities.'
translation:
  language: ta
  text: மெராரியின் மகன்களுக்கு[a], அவர்களுடைய குடும்பங்களின்படி, ரூபன் கோத்திரத்திலிருந்தும் காத் கோத்திரத்திலிருந்தும் செபுலோன் கோத்திரத்திலிருந்தும் பன்னிரண்டு நகரங்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மெராரியின் வழித்தோன்றல்களுக்கு.”
    reason: בְּנֵי என்பதன் நேரடிப் பொருள் ‘மகன்கள்’; இச்சூழலில் அது விரிவாக ‘வழித்தோன்றல்கள்’ என்பதையும் குறிக்கலாம்.
lexical_decisions:
- source_word: לִבְנֵי מְרָרִי
  choice: மெராரியின் மகன்களுக்கு
  rationale: לְ இங்கு பங்கீட்டைப் பெறுபவர்களைக் குறிக்கிறது; בְּנֵי என்ற குடும்ப உறவுமுறையை நேரடியாகப் பேணுகிறது. சூழலில் வழித்தோன்றல்களையும் உள்ளடக்கும் எபிரேய மரபுத்தொடர் இது.
- source_word: לְמִשְׁפְּחֹתָם
  choice: அவர்களுடைய குடும்பங்களின்படி
  rationale: மெராரியரின் குடும்ப அல்லது குலப் பிரிவுகளுக்கு ஏற்ப பங்கீடு செய்யப்பட்டதை வெளிப்படுத்துகிறது.
- source_word: מִמַּטֵּה
  choice: கோத்திரத்திலிருந்து
  rationale: நிலப்பங்கீட்டுச் சூழலில் מַטֶּה என்பது ‘கோத்திரம்’ என்று பொருள்படும்.
- source_word: רְאוּבֵן
  choice: ரூபன்
  rationale: எபிரேயப் பெயரின் தமிழில் நிலைபெற்ற வடிவம்.
- source_word: גָד
  choice: காத்
  rationale: எபிரேய மெய்யொலியை அணுகும் தமிழ் எழுத்துப்பெயர்ப்பு.
- source_word: זְבוּלֻן
  choice: செபுலோன்
  rationale: எபிரேயப் பெயரைத் தமிழில் இயல்பாகவும் வேறுபடுத்தக்கூடிய வகையிலும் எழுத்துப்பெயர்க்கிறது.
- source_word: עָרִים
  choice: நகரங்கள்
  rationale: நிலப்பங்கீட்டுப் பட்டியல்களில் இடம்பெறும் עִיר என்பதற்கான வழக்கமான, தெளிவான தமிழ் சொல்.
- source_word: שְׁתֵּים עֶשְׂרֵה
  choice: பன்னிரண்டு
  rationale: எண்ணிக்கையை இயல்பான தமிழ் சொல்வரிசையில் தருகிறது.
theological_decisions:
- issue: எபிரேய மூலத்தில் வினைச்சொல் இல்லாமை
  choice: கொடுக்கப்பட்டன என்பதைச் சேர்த்து மொழிபெயர்த்தல்
  alternative: ‘பன்னிரண்டு நகரங்கள்’ என்று பெயர்ச்சொல் வாக்கியமாக முடித்தல்
  rationale: இந்த வசனம் முந்தைய பங்கீட்டு வாக்கியங்களின் நீள்வாக்கிய அமைப்பைத் தொடர்கிறது. தமிழில் தனி வசனமாகத் தெளிவாக வாசிக்க, சூழலில் மறைந்துள்ள பங்கீட்டு வினை செயல்படுத்தப்பட்டது; புதிய இறையியல் கருத்து சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், நிலப்பங்கீட்டுப் பட்டியலுக்கேற்ற கண்ணியமான நடையும் மீளுருவாக்கமும் பேணப்பட்டுள்ளன. மூலத்தில் வினைச்சொல் இல்லாததால், சூழலால் உணரப்படும் ‘கொடுக்கப்பட்டன’ தெளிவுக்காகச் சேர்க்கப்பட்டுள்ளது.
