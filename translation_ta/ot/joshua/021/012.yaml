  text: וְ/אֶת שְׂדֵ֥ה הָ/עִ֖יר וְ/אֶת חֲצֵרֶ֑י/הָ נָֽתְנ֛וּ לְ/כָלֵ֥ב בֶּן יְפֻנֶּ֖ה בַּ/אֲחֻזָּתֽ/וֹ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/012.yaml
  text: But the fields of the city and its villages they gave to Caleb son of Jephunneh as his possession[a].
translation:
  language: ta
  text: ஆனால் நகரத்தின் வயல்வெளியையும் அதைச் சேர்ந்த சிற்றூர்களையும் எப்புன்னேயின் மகன் காலேபுக்கு அவனுடைய உடைமையாகக் கொடுத்தார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “சிற்றூர்கள்” என்பதற்கு “குடியிருப்புகள்” அல்லது “சுற்றுப்புறப் பகுதிகள்” என்றும் மொழிபெயர்க்கலாம். எபிரேயச் சொல் ஒரு நகரைச் சார்ந்த புறக்குடியிருப்புகளையோ அதை ஒட்டிய பகுதிகளையோ குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂדֵה הָעִיר
  choice: நகரத்தின் வயல்வெளி
  rationale: שְׂדֵה என்பது இலக்கணப்படி ஒருமைத் தொகைநிலைச் சொல். இங்கு நகரத்துக்குச் சொந்தமான வேளாண் நிலத்தைத் தொகுப்பாகக் குறிப்பதால், இயல்பான தமிழில் ‘வயல்வெளி’ என்று மொழிபெயர்க்கப்பட்டது.
- source_word: חֲצֵרֶיהָ
  choice: அதைச் சேர்ந்த சிற்றூர்கள்
  rationale: חָצֵר என்பது இச்சூழலில் முற்றங்களை மட்டும் அல்லாமல் ஒரு நகரைச் சார்ந்த புறக்குடியிருப்புகளையோ சிற்றூர்களையோ குறிக்கலாம். நகரத்திற்கும் அதைச் சார்ந்த குடியிருப்புகளுக்கும் உள்ள உறவைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்க இச்சொற்றொடர் தேர்ந்தெடுக்கப்பட்டது; அதன் பரந்த பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: נָתְנוּ
  choice: கொடுத்தார்கள்
  rationale: נתן என்பதன் நேரான பொருளான ‘கொடு’ என்பதைக் காக்கிறது; நிர்வாக ஒதுக்கீடு என்ற கூடுதல் விளக்கத்தை உரைக்குள் திணிக்கவில்லை.
- source_word: לְכָלֵב בֶּן יְפֻנֶּה
  choice: எப்புன்னேயின் மகன் காலேபுக்கு
  rationale: எபிரேய உறவுமுறையையும் மறைமுகச் செயப்படுபொருளையும் இயல்பான தமிழ் வரிசையில் வழங்குகிறது.
- source_word: בַּאֲחֻזָּתוֹ
  choice: அவனுடைய உடைமையாக
  rationale: אֲחֻזָּה என்பது நில உரிமையோடு தொடர்புடைய உடைமை அல்லது பங்கைக் குறிக்கிறது. இங்கு பெறப்பட்ட நிலவுடைமை வலியுறுத்தப்படுவதால் ‘உடைமையாக’ என்பது பொருத்தமானது.
- source_word: וְאֶת
  choice: ஆனால் … -யையும்
  rationale: தொடக்க וְ முந்தைய வசனத்துடன் இணைப்பதோடு, லேவியருக்குக் கொடுக்கப்பட்ட நகரத்திற்கும் காலேபுக்குக் கொடுக்கப்பட்ட நிலம் மற்றும் சிற்றூர்களுக்கும் இடையிலான மாறுபாட்டைக் காட்டுகிறது. ‘ஆனால்’ அந்த உரையாடல் உறவை இயல்பான தமிழில் வெளிப்படுத்துகிறது; אֵת குறிக்கும் இரு செயப்படுபொருட்களும் ‘-யையும்’ மூலம் குறிக்கப்பட்டுள்ளன.
