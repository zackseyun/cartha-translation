translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. எபிரேய வாக்கியத்தின் மாறுபாட்டு இணைப்பும், நிலவுடைமை சார்ந்த சட்டப்பொருளும், חֲצֵרֶיהָ என்பதிலுள்ள சொற்பொருள் நெகிழ்வும் பாதுகாக்கப்பட்டுள்ளன.
