  text: וּ/מִ/מַּטֵּה גָ֗ד אֶת עִיר֙ מִקְלַ֣ט הָ/רֹצֵ֔חַ אֶת רָמֹ֥ת בַּ/גִּלְעָ֖ד וְ/אֶת מִגְרָשֶׁ֑/הָ וְ/אֶֽת מַחֲנַ֖יִם וְ/אֶת מִגְרָשֶֽׁ/הָ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/038.yaml
  text: 'And from the tribe of Gad: Ramoth in Gilead[a], the city of refuge for the manslayer, with its pasturelands[c][b], and Mahanaim with its pasturelands.'
translation:
  language: ta
  text: 'காத் கோத்திரத்திலிருந்து: கொலை செய்தவருக்கான அடைக்கல நகரமாகிய கிலேயாத்திலுள்ள ராமோத்[a], அதைச் சுற்றியுள்ள மேய்ச்சல் நிலங்களுடன்[b], மகனாயீமும் அதைச் சுற்றியுள்ள மேய்ச்சல் நிலங்களுடன்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மொழியில், “கொலை செய்தவர்” என்பது ஒருவரைக் கொன்றவரைக் குறிக்கிறது; அடைக்கல நகரம் பற்றிய இந்தச் சட்டச் சூழலில், முன்கூட்டியே திட்டமிட்டுக் கொலை செய்தவர் என்று அவசியமாகப் பொருள்படாது.
    reason: lexical_alternative
  - marker: b
    text: “மேய்ச்சல் நிலங்கள்” என்பது அந்த நகரத்துடன் சேர்த்துப் பயன்பாட்டுக்காக ஒதுக்கப்பட்ட, அதைச் சுற்றியுள்ள நிலங்களைக் குறிக்கிறது.
    reason: cultural_note
lexical_decisions:
- source_word: וּ/מִ/מַּטֵּה גָד
  choice: காத் கோத்திரத்திலிருந்து
  rationale: கோத்திரப் பங்கீட்டுச் சூழலில் מַטֶּה என்பது ‘கோத்திரம்’ என்று பொருள்படும்; முன்னொட்டுகளைத் தமிழில் இயல்பாக ‘-இலிருந்து’ என வழங்கியது.
- source_word: עִיר מִקְלַט
  choice: அடைக்கல நகரம்
  rationale: நியமிக்கப்பட்ட புகலிட நகரத்தைக் குறிக்கும் எபிரெயச் சட்டச் சொற்றொடரைத் தெளிவாகவும் வழக்காகவும் வழங்குகிறது.
- source_word: הָרֹצֵחַ
  choice: கொலை செய்தவர்
  rationale: רֹצֵחַ ஒருவரைக் கொன்ற நபரைக் குறிக்கிறது. இங்கு அடைக்கல நகரச் சூழல் இருப்பதால் ‘கொலைகாரன்’ எனக் குற்றநோக்கை முன்கூட்டியே தீர்மானிக்காமல், மூலத்தின் சட்டரீதியான விரிவைத் தக்கவைக்கிறது.
- source_word: רָמֹת בַּגִּלְעָד
  choice: கிலேயாத்திலுள்ள ராமோத்
  rationale: בַּגִּלְעָד என்பதன் இடத்தைக் குறிக்கும் உறவை இயல்பான தமிழில் வெளிப்படுத்தி, இடப்பெயர்களை ஒலிபெயர்த்துள்ளது.
- source_word: מִגְרָשֶׁהָ
  choice: அதைச் சுற்றியிருந்த மேய்ச்சல் நிலங்கள்
  rationale: லேவியர் நகரப் பட்டியல்களில் מִגְרָשׁ நகரைச் சுற்றி கால்நடை மேய்ச்சல் உள்ளிட்ட பயன்பாடுகளுக்காக ஒதுக்கப்பட்ட நிலத்தைக் குறிக்கிறது.
- source_word: מַחֲנַיִם
  choice: மகனாயீம்
  rationale: இடப்பெயரை எபிரெய உச்சரிப்புக்கு அணுக்கமாக ஒலிபெயர்த்துள்ளது.
theological_decisions:
- issue: הָרֹצֵחַ என்பவரின் குற்றநோக்கம்
  choice: கொலை செய்தவர்
  alternative: கொலைகாரன்
  rationale: அடைக்கல நகரம் குறித்த சட்டச் சூழலில், அந்த நபர் முன்கூட்டியே திட்டமிட்டுக் கொன்றவர் என்று வசனம் தானாகத் தீர்மானிப்பதில்லை. ஆகவே நோக்கத்தைச் சேர்க்காத சொற்றொடர் தேர்ந்தெடுக்கப்பட்டது.
translation_notes:
  register: நவீனத் தரத் தமிழில், மரியாதையும் எளிய வாசிப்புத்தன்மையும் கொண்ட பட்டியல் நடை பயன்படுத்தப்பட்டது. இரு நகரங்களுக்கும் உரிய மேய்ச்சல் நிலங்கள் தனித்தனியாகத் தெளிவுபடுத்தப்பட்டன; மூலத்தில் இல்லாத விளக்கங்கள் முதன்மை உரையில் சேர்க்கப்படவில்லை.
