base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/018.yaml
  text: 'Anathoth with its pasturelands[a], and Almon with its pasturelands: four cities.'
translation:
  language: ta
  text: ஆனதோத்தையும் அதன் மேய்ச்சல் நிலங்களையும்[a], அல்மோனையும் அதன் மேய்ச்சல் நிலங்களையும்—ஆக நான்கு நகரங்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அதன் பொதுநிலங்களையும்’ / ‘அதன் சுற்றுப்புறத் திறந்த நிலங்களையும்.’ எபிரெயச் சொல் ஒரு நகரத்துக்குச் சொந்தமான திறந்த நிலத்தைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲנָתוֹת
  choice: ஆனதோத்
  rationale: இது ஓர் இடப்பெயர்; எபிரெய ஒலிப்புக்கு நெருக்கமாகவும் தமிழில் இயல்பாகவும் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: מִגְרָשֶׁהָ
  choice: அதன் மேய்ச்சல் நிலங்கள்
  rationale: מִגְרָשׁ என்பது நகரத்துக்குச் சொந்தமான சுற்றுப்புறத் திறந்த நிலத்தைக் குறிக்கிறது; அது கால்நடைகளை மேய்க்கப் பயன்படுத்தப்பட்டதால், ‘மேய்ச்சல் நிலங்கள்’ என்பது பொருளையும் இயல்பான தமிழ் நடையையும் காக்கிறது. பெண்பால் ஒருமை உடைமை விகுதி ஒவ்வொரு நகரத்தையும் சுட்டுவதால் ‘அதன்’ என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: עַלְמוֹן
  choice: அல்மோன்
  rationale: இது ஓர் இடப்பெயர்; எபிரெய வடிவத்துக்கு நெருக்கமாக ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: עָרִים אַרְבַּע
  choice: நான்கு நகரங்கள்
  rationale: பட்டியலிடப்பட்ட இடங்களின் எண்ணிக்கையைச் சுருக்கிக் கூறும் நேரடியான எண்-பெயர்ச்சொல் தொடர்.
- source_word: אֶת ... וְאֶת ... וְאֶת ... וְאֶת
  choice: -ஐ / -ஐயும் என்ற வேற்றுமை மற்றும் இணைப்பு அமைப்பு
  rationale: எபிரெயத்தின் திரும்பத் திரும்ப வரும் நேரடிச் செயப்படுபொருள் குறியீடு אֶת தமிழில் தனிச் சொல்லாக வராது; ‘ஆனதோத்தையும்… நிலங்களையும்… அல்மோனையும்… நிலங்களையும்’ என்ற வேற்றுமை-இணைப்பு அமைப்பால் அதன் இலக்கணப் பணி வெளிப்படுத்தப்பட்டுள்ளது.
