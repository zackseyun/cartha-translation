  source_fidelity: மூல எபிரெயப் பட்டியலின் இரு இடப்பெயர்களும், ஒவ்வொரு நகரத்திற்கும் உரிய מִגְרָשֶׁהָ (‘அதன் மேய்ச்சல் நிலங்கள்’) என்ற இணைப்பும், இறுதியிலுள்ள ‘நான்கு நகரங்கள்’ என்ற எண்ணிக்கைச் சுருக்கமும் துல்லியமாகத் தரப்பட்டுள்ளன. தமிழில் செயப்படுபொருள் குறியீடு இயல்பாக -ஐ/-ஐயும் உருபுகள் மூலம் வெளிப்படுகிறது.
  naturalness: ‘ஆனதோத்தையும் அதன் மேய்ச்சல் நிலங்களையும், அல்மோனையும் அதன் மேய்ச்சல் நிலங்களையும்—ஆக நான்கு நகரங்கள்’ என்பது நவீனத் தரத் தமிழில் தெளிவான, இயல்பான பட்டியல் நடை. நீள்கோடு இறுதி எண்ணிக்கைச் சுருக்கத்தை வாசிக்க எளிதாக்குகிறது.
  terminology: இடப்பெயர்களான ‘ஆனதோத்,’ ‘அல்மோன்’ சீராக ஒலிபெயர்க்கப்பட்டுள்ளன. מִגְרָשֶׁהָ என்பதற்கான ‘மேய்ச்சல் நிலங்கள்’ பொருத்தமானது; அடிக்குறிப்பு ‘பொதுநிலங்கள்’ மற்றும் ‘சுற்றுப்புறத் திறந்த நிலங்கள்’ என்ற மாற்றுகளையும் மூலச் சொல்லின் நகரத்துக்குரிய திறந்த நிலம் என்ற பொருளையும் போதுமான வகையில் விளக்குகிறது.
