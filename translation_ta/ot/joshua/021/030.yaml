source:
  edition: WLC
  text: וּ/מִ/מַּטֵּ֣ה אָשֵׁ֔ר אֶת מִשְׁאָ֖ל וְ/אֶת מִגְרָשֶׁ֑/הָ אֶת עַבְדּ֖וֹן וְ/אֶת מִגְרָשֶֽׁ/הָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/030.yaml
  text: 'and from the tribe of Asher: Mishal with its pasturelands[b][a], and Abdon with its pasturelands.'
translation:
  language: ta
  text: 'ஆசேர் கோத்திரத்திலிருந்து: மிஷாலும் அதன் மேய்ச்சல் நிலங்களும்[a], அப்தோனும் அதன் மேய்ச்சல் நிலங்களும்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘மேய்ச்சல் நிலங்கள்’ என்பது நகரத்துக்குரிய திறந்த வெளி நிலங்களைக் குறிக்கிறது; அவை பொதுவாகக் கால்நடைகளை மேய்ப்பதற்கும் பிற பொதுப் பயன்பாடுகளுக்கும் உரியவையாக இருந்தன.
    reason: cultural_note
lexical_decisions:
- source_word: וּ/מִ/מַּטֵּה
  choice: கோத்திரத்திலிருந்து
  rationale: மַטֶּה என்பது இங்குள்ள கோத்திரப் பங்கீட்டுச் சூழலில் ‘கோத்திரம்’ என்று பொருள்படும்; מִן முன்னொட்டு ‘இலிருந்து’ என மொழிபெயர்க்கப்படுகிறது. தொடக்க וְ முந்தைய வசனத்துடன் தொடர்ச்சியைச் சுட்டுகிறது; தமிழில் பட்டியல் தொடர்ச்சி மற்றும் நிறுத்தக்குறியால் அது இயல்பாக வெளிப்படுகிறது.
- source_word: אָשֵׁר
  choice: ஆசேர்
  rationale: எபிரேய கோத்திரப் பெயரின் தமிழில் வழக்கமான ஒலிபெயர்ப்பு.
- source_word: אֶת
  choice: —
  rationale: நேரடிச் செயப்படுபொருளைக் குறிக்கும் இலக்கண உருபு; தனியாக மொழிபெயர்க்கப்படவில்லை. தமிழில் ‘ஐ’ உருபால் அதன் பணி வெளிப்படுகிறது.
- source_word: מִשְׁאָל
  choice: மிஷால்
  rationale: WLC மெய்யெழுத்து மற்றும் உயிர்க்குறிப்பு வடிவத்தை நெருக்கமாகப் பிரதிபலிக்கும் இடப்பெயர் ஒலிபெயர்ப்பு.
- source_word: מִגְרָשֶׁהָ
  choice: அதன் மேய்ச்சல் நிலங்கள்
  rationale: מִגְרָשׁ என்பது நகரத்துக்குரிய சுற்றுப்புறத் திறந்த நிலத்தை, குறிப்பாக கால்நடை மேய்ச்சல் உள்ளிட்ட பொதுப் பயன்பாட்டை, குறிக்கிறது. ‘மேய்ச்சல் நிலங்கள்’ இச்சூழலில் இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: עַבְדּוֹן
  choice: அப்தோன்
  rationale: எபிரேய இடப்பெயரின் நெருக்கமான தமிழ் ஒலிபெயர்ப்பு.
- source_word: וְ/אֶת
  choice: …ஐயும்
  rationale: וְ இணைப்பைத் தமிழின் ‘உம்’ இணைப்புருபும், אֶת குறிக்கும் செயப்படுபொருளை ‘ஐ’ வேற்றுமை உருபும் இயல்பாக வெளிப்படுத்துகின்றன.
