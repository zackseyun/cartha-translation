- from: அப்போது லேவியர்களின் தந்தைவழிக் குடும்பத் தலைவர்கள்[a], ஆசாரியனாகிய எலெயாசாரிடமும், நூனின் மகன் யோசுவாவிடமும், இஸ்ரவேல் மக்களின் கோத்திரங்களிலுள்ள தந்தைவழிக் குடும்பத் தலைவர்களிடமும் வந்து அணுகினார்கள்.
