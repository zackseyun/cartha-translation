base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/001.yaml
  text: Then the heads of the fathers’ houses of the Levites came near to Eleazar the priest[a], to Joshua son of Nun[b], and to the heads of the fathers’ houses of the tribes of the sons of Israel.
translation:
  language: ta
  text: அப்போது லேவியரின் தந்தைவழிக் குடும்பங்களின் தலைவர்கள்[a], ஆசாரியனாகிய எலெயாசாரிடமும், நூனின் மகன் யோசுவாவிடமும், இஸ்ரவேல் மக்களின்[b] கோத்திரங்களின் தந்தைவழிக் குடும்பங்களின் தலைவர்களிடமும் அணுகினார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மூதாதையர் குடும்பங்களின் தலைவர்கள்.” எபிரெயச் சொற்றொடர் தந்தைவழி அமைந்த குடும்ப அல்லது குலப் பிரிவுகளின் தலைவர்களைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: சொல்லர்த்தமாக, “இஸ்ரவேலின் மகன்கள்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגְּשׁוּ
  choice: வந்து அணுகினார்கள்
  rationale: נגשׁ என்பதன் ‘அணுகுதல்/அருகில் வருதல்’ என்ற இயக்கத்தையும், அதிகாரபூர்வமாக முன்வரும் இச்சூழலையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: רָאשֵׁי אֲבוֹת
  choice: தந்தைவழிக் குடும்பத் தலைவர்கள்
  rationale: சொல்லுக்கு சொல் ‘தந்தையரின் தலைவர்கள்’ என்பது தமிழில் தெளிவற்றது. எபிரெயத் தந்தைவழி மூதாதைக் குடும்ப அமைப்பையும் தலைமைப் பொறுப்பையும் இச்சொற்றொடர் காக்கிறது.
- source_word: הַלְוִיִּם
  choice: லேவியர்கள்
  rationale: லேவி கோத்திரக் குழுவுக்கான வழக்கமான, தெளிவான தமிழ் பெயர்.
- source_word: אֶלְעָזָר הַכֹּהֵן
  choice: ஆசாரியனாகிய எலெயாசார்
  rationale: כֹּהֵן என்பதற்கு வேதாகமத் தமிழில் பரவலாக அறியப்படும் ‘ஆசாரியன்’ பயன்படுத்தப்பட்டுள்ளது; தேவையற்ற பதவி விரிவாக்கம் செய்யப்படவில்லை.
- source_word: יְהוֹשֻׁעַ בִּן נוּן
  choice: நூனின் மகன் யோசுவா
  rationale: எபிரெயத் தந்தைப்பெயர் அமைப்பை இயல்பான தமிழ் உடைமைத் தொடரில் துல்லியமாக வழங்குகிறது.
- source_word: רָאשֵׁי אֲבוֹת הַמַּטּוֹת
  choice: கோத்திரங்களிலுள்ள தந்தைவழிக் குடும்பத் தலைவர்கள்
  rationale: מַטּוֹת குறிக்கும் கோத்திர அலகுகளுக்குள் உள்ள தந்தைவழிக் குடும்பத் தலைவர்களைத் தெளிவுபடுத்தி, சமூக அமைப்பின் அடுக்கைத் தக்கவைக்கிறது.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்கள்
  rationale: சொல்லர்த்தமாக ‘இஸ்ரவேலின் மகன்கள்’; இங்கு முழு உடன்படிக்கைச் சமூகத்தைக் குறிக்கும் இயல்பான தமிழாக ‘இஸ்ரவேல் மக்கள்’ தேர்ந்தெடுக்கப்பட்டது. சொல்லர்த்த வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: இஸ்ரவேலின் கோத்திர அமைப்பிலுள்ள பாலினம் குறித்த உறவுமுறை மொழி
  choice: ‘தந்தைவழிக் குடும்பங்கள்’ என்பதை முதன்மை உரையில் தக்கவைத்து, ‘இஸ்ரவேலின் மகன்கள்’ என்பதை ‘இஸ்ரவேல் மக்கள்’ என வழங்குதல்
  alternative: ‘மூதாதையர் குடும்பங்கள்’; ‘இஸ்ரவேலின் மகன்கள்’
  rationale: אָבוֹת சுட்டும் தந்தைவழி சமூக அமைப்பு வரலாற்று முக்கியத்துவமுடையதால் வெளிப்படையாக வைக்கப்படுகிறது. ஆனால் בְנֵי יִשְׂרָאֵל இங்கு ஆண்களை மட்டும் அல்லாமல் மொத்த இஸ்ரவேல் சமூகத்தைக் குறிக்கும் நிலையான கூட்டுப்பெயர் என்பதால், தவறான பாலினச் சுருக்கத்தைத் தவிர்க்க ‘இஸ்ரவேல் மக்கள்’ என மொழிபெயர்க்கப்படுகிறது; அதன் சொல்லர்த்தம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன தரத் தமிழில், மரியாதைமிக்க வேதாகம நடையையும் சாதாரண வாசகருக்கான தெளிவையும் இணைக்கிறது. ‘தந்தைவழிக் குடும்பம்’ சமூக அமைப்பைத் தெளிவாகக் காட்டுகிறது; ‘வந்து அணுகினார்கள்’ சட்ட/நிர்வாகச் சூழலிலான முன்வருதலைப் பாதுகாக்கிறது. முதன்மை உரையில் உள்ள [a] குறி அடிக்குறிப்புடன் நேரடியாகப் பொருந்துகிறது.
