  text: וְ/לִ/בְנֵ֣י גֵרְשׁוֹן֮ מִ/מִּשְׁפְּחֹ֣ת הַ/לְוִיִּם֒ מֵ/חֲצִ֞י מַטֵּ֣ה מְנַשֶּׁ֗ה אֶת עִיר֙ מִקְלַ֣ט הָ/רֹצֵ֔חַ אֶת גלון בַּ/בָּשָׁן֙ וְ/אֶת מִגְרָשֶׁ֔/הָ וְ/אֶֽת בְּעֶשְׁתְּרָ֖ה וְ/אֶת מִגְרָשֶׁ֑/הָ עָרִ֖ים שְׁתָּֽיִם־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/027.yaml
  text: And to the sons of Gershon[a], from the clans of the Levites, from the half-tribe of Manasseh, they gave Golan in Bashan, the city of refuge for the manslayer, with its pasturelands, and Beeshterah with its pasturelands—two cities.
translation:
  language: ta
  text: லேவியர்களின் குலங்களைச் சேர்ந்த கேர்சோனின் மக்களுக்கு, மனாசேயின் பாதிக் கோத்திரத்திலிருந்து, ஒருவரைக் கொன்றவனுக்கான அடைக்கல நகரமாகிய பாசானிலுள்ள கோலானையும் அதன் மேய்ச்சல் நிலங்களையும், பெஎஷ்தெராவையும்[a] அதன் மேய்ச்சல் நிலங்களையும் கொடுத்தார்கள்—இரண்டு நகரங்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மூலத்தில் பெஎஷ்தெரா; 1 நாளாகமம் 6:71-இல் அஷ்தரோத் என்று உள்ளது.
    reason: alternative_reading
lexical_decisions:
- source_word: וְ/לִ/בְנֵי גֵרְשׁוֹן
  choice: கேர்சோனின் மக்களுக்கு
  rationale: בני என்பதன் நேரடிப் பொருளான ‘மக்கள்/மகன்கள்’ என்ற வம்சவழிக் கூறைத் தமிழில் இயல்பாகப் பாதுகாக்கிறது.
- source_word: מִ/מִּשְׁפְּחֹת הַ/לְוִיִּם
  choice: லேவியர்களின் குலங்களைச் சேர்ந்த
  rationale: מִשְׁפָּחוֹת இங்கு கோத்திரத்துக்குள் உள்ள உறவுவழிப் பிரிவுகளைக் குறிப்பதால் ‘குலங்கள்’ பொருத்தமானது.
- source_word: מֵ/חֲצִי מַטֵּה מְנַשֶּׁה
  choice: மனாசேயின் பாதிக் கோத்திரத்திலிருந்து
  rationale: யோசுவாவின் நிலப்பங்கீட்டுச் சூழலில் מַטֶּה என்பது ‘கோத்திரம்’; பாதிக் கோத்திரம் என்ற நடை மூல அமைப்பைத் தெளிவாகக் காட்டுகிறது.
- source_word: עִיר מִקְלַט הָרֹצֵחַ
  choice: கொலை செய்தவனுக்கான அடைக்கல நகரம்
  rationale: இது தோரா மற்றும் யோசுவாவில் காணப்படும் சட்டவழக்குச் சொற்றொடர். הָרֹצֵחַ என்பது இச்சூழலில் ஒருவரைக் கொன்றவனைச் சுட்டுகிறது; முன்திட்டமிட்ட கொலை என்று உரை இங்கே தனியே தீர்மானிக்கவில்லை.
- source_word: גלון בַּ/בָּשָׁן
  choice: பாசானிலுள்ள கோலான்
  rationale: இரண்டும் இடப்பெயர்கள்; தமிழ் ஒலிபெயர்ப்பில் வழங்கப்பட்டுள்ளன.
- source_word: מִגְרָשֶׁהָ
  choice: அதன் மேய்ச்சல் நிலங்கள்
  rationale: லேவிய நகரைச் சுற்றியிருந்து கால்நடை மேய்த்தல் போன்ற பயன்பாடுகளுக்குரிய திறந்த நிலத்தை מִגְרָשׁ குறிக்கிறது.
- source_word: בְּעֶשְׁתְּרָה
  choice: பெயெஷ்தெரா
  rationale: மசோரா மூலத்தில் உள்ள பெயரை ஒலிபெயர்த்து முதன்மை உரையில் பாதுகாக்கிறது; 1 நாளாகமம் 6:71-இன் மாறுபட்ட பெயர் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: עָרִים שְׁתָּיִם
  choice: மொத்தம் இரண்டு நகரங்கள்
  rationale: பட்டியலின் இறுதியில் வரும் எண்ணிக்கையைத் தமிழில் இயல்பாகச் சுருக்கிக் காட்டுகிறது.
- source_word: implicit verbal sense in allotment list
  choice: கொடுத்தார்கள்
  rationale: இந்த வசனத்தில் வெளிப்படையான வினைச்சொல் இல்லாவிட்டாலும், சுற்றியுள்ள நிலப்பங்கீட்டுப் பட்டியலின் வாக்கிய அமைப்பு ‘கொடுத்தார்கள்’ என்ற பொருளை வழங்குகிறது.
theological_decisions:
- issue: הָרֹצֵחַ என்பவரின் கொலையின் தன்மை
  choice: கொலை செய்தவன்
  alternative: தற்செயலாகக் கொலை செய்தவன்
  rationale: அடைக்கல நகரச் சட்டப் பின்னணி தற்செயலான கொலையை முதன்மையாகக் கருதினாலும், இந்தச் சொல் தனியாக ‘தற்செயலாக’ என்று சொல்லவில்லை. ஆகவே மூலத்தின் பரப்பைச் சுருக்காமல் பொதுவான சட்டவழக்குப் பொருள் வைக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன தரத் தமிழ்; சாதாரண வாசகர்களுக்குப் புரியும் வகையில் கண்ணியமான வேதாகம நடை. வம்சவழி மற்றும் நிலப்பங்கீட்டுச் சொற்களில் மூல வடிவத்துக்கும் இயல்பான தமிழுக்கும் சமநிலை பேணப்பட்டுள்ளது.
