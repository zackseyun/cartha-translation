- from: லேவியர்களின் குலங்களைச் சேர்ந்த கேர்சோனின் மக்களுக்கு, மனாசேயின் பாதிக் கோத்திரத்திலிருந்து, கொலை செய்தவனுக்கான அடைக்கல நகரமாகிய பாசானிலுள்ள கோலானையும் அதன் மேய்ச்சல் நிலங்களையும், பெயெஷ்தெராவையும்[a] அதன் மேய்ச்சல் நிலங்களையும் கொடுத்தார்கள்—மொத்தம் இரண்டு நகரங்கள்.
