base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/008.yaml
  text: So the sons of Israel gave to the Levites these cities with their pasturelands[a], as Yahweh had commanded by the hand of Moses, by lot.
translation:
  language: ta
  text: யாவே மோசே மூலம் கட்டளையிட்டபடியே, இஸ்ரவேல் மக்கள் இந்த நகரங்களையும் அவற்றின் மேய்ச்சல் நிலங்களையும் லேவியர்களுக்குச் சீட்டுப் போட்டு கொடுத்தார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּתְּנוּ
  choice: கொடுத்தார்கள்
  rationale: נתן என்பதன் இயல்பான நேரடிப் பொருளைத் தருகிறது; இச்சூழலில் நகரங்களை லேவியர்களுக்கு ஒதுக்கிக் கொடுத்த செயலைக் குறிக்கிறது.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்கள்
  rationale: சொல்லுக்கு சொல் வடிவம் ‘இஸ்ரவேலின் மகன்கள்’ என்றாலும், இங்கு அது இஸ்ரவேல் சமூகத்தாரைக் குறிக்கும் எபிரெய வழக்கு; ‘இஸ்ரவேல் மக்கள்’ என்பது இயல்பாகவும் உள்ளடக்கத்தைத் துல்லியமாகவும் தெரிவிக்கிறது.
- source_word: לַלְוִיִּם
  choice: லேவியர்களுக்கு
  rationale: கோத்திரக் குழுவான லேவியர்களையும் அவர்களுக்குக் கொடுக்கப்பட்டதையும் நேரடியாகக் காட்டுகிறது.
- source_word: הֶעָרִים הָאֵלֶּה
  choice: இந்த நகரங்களை
  rationale: முன்னர் குறிப்பிடப்பட்ட குறிப்பிட்ட நகரங்களைச் சுட்டும் demonstrative பொருளைப் பாதுகாக்கிறது.
- source_word: מִגְרְשֵׁיהֶן
  choice: அவற்றின் மேய்ச்சல் நிலங்களை
  rationale: நகரங்களைச் சுற்றி கால்நடை மேய்ச்சலுக்கும் பொதுப் பயன்பாட்டுக்கும் இருந்த திறந்த நிலங்களை இச்சூழலில் தெளிவாகக் குறிக்கிறது.
- source_word: כַּאֲשֶׁר צִוָּה
  choice: கட்டளையிட்டபடியே
  rationale: கொடுத்த செயல் முன்பு வழங்கப்பட்ட கட்டளைக்கு இணங்க நடந்தது என்ற தொடர்பைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரான நான்கு எழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் ஏற்ற ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: בְּיַד מֹשֶׁה
  choice: மோசே மூலம்
  rationale: சொல்லுக்கு சொல் ‘மோசேயின் கையால்’ எனும் எபிரெய மரபுத்தொடர், இங்கு மோசே வழியாகக் கட்டளை தெரிவிக்கப்பட்ட இடைமுகச் செயற்பாட்டைக் குறிக்கிறது; தமிழில் ‘மோசே மூலம்’ இயல்பானது.
- source_word: בַּגּוֹרָל
  choice: சீட்டுக் குலுக்கலின்படி
  rationale: சீட்டுக் குலுக்கி ஒதுக்கீடு செய்த முறையைத் தெளிவாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூலத்தில் தனிப்பட்ட உடன்படிக்கைப் பெயர் நேரடியாக இருப்பதால், அதை பொதுப் பட்டமான ‘ஆண்டவர்’ என்று மாற்றாமல் ஒலிபெயர்த்துள்ளது.
- issue: בְּיַד מֹשֶׁה என்பதில் வெளிப்படும் இடைமுகச் செயற்பாடு
  choice: மோசே மூலம்
  alternative: மோசேயின் கையால்
  rationale: இந்த எபிரெய மரபுத்தொடர் மோசே கட்டளையின் மூலாதாரம் என்று கூறாமல், யாவேயின் கட்டளை மோசே வழியாக வழங்கப்பட்டது என்பதைக் குறிக்கிறது.
translation_notes:
  register: நவீனத் தரமான தமிழில், பொதுவாசகர்களுக்கு விளங்கும் கண்ணியமான நடையில் அமைக்கப்பட்டது. எபிரெய சொற்றொடரின் இடைமுகப் பொருள் முதன்மை உரையில் இயல்பாகத் தரப்பட்டு, அதன் சொல்லுக்கு சொல் வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
