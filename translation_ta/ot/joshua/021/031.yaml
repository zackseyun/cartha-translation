translation:
  language: ta
  text: ஹெல்காத்தையும் அதன் மேய்ச்சல் நிலங்களையும், ரெகோபையும் அதன் மேய்ச்சல் நிலங்களையும்—நான்கு நகரங்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חֶלְקָת
  choice: கேல்காத்
  rationale: இது ஓர் ஊர்ப்பெயர்; மொழிபெயர்க்காமல், எபிரெய உச்சரிப்பை நவீனத் தமிழில் இயல்பாக ஒலிபெயர்த்துள்ளது.
- source_word: מִגְרָשֶׁהָ
  choice: அதன் மேய்ச்சல் நிலங்கள்
  rationale: நகரத்துடன் இணைந்திருந்த கால்நடை மேய்ச்சல் மற்றும் பொதுப் பயன்பாட்டுக்கான வெளிநிலங்களைக் குறிக்கிறது; பெண்பால் ஒருமை விகுதி அந்தந்த நகரத்தைக் குறிக்கிறது.
- source_word: רְחֹב
  choice: ரெகோப்
  rationale: இது ஓர் ஊர்ப்பெயர்; எபிரெய வடிவத்திற்கு நெருக்கமாகத் தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: עָרִים אַרְבַּע
  choice: மொத்தம் நான்கு நகரங்கள்
  rationale: இந்த வசனத்திலும் முந்தைய வசனத்திலும் பட்டியலிடப்பட்ட நகரங்களின் மொத்த எண்ணிக்கையைத் தெரிவிக்கும் தொகுப்புரை.
- source_word: אֶת ... וְאֶת ... וְאֶת ... וְאֶת
  choice: …ஐயும் அதன் …ஐயும்
  rationale: மீண்டும் வரும் நேர்செயப்படுபொருள் குறிகள் தமிழில் தனியே மொழிபெயர்க்கப்படவில்லை; பட்டியலின் ஒவ்வொரு நகரத்தையும் அதனுடன் சேர்ந்த நிலங்களையும் இணைத்து இயல்பாகக் காட்டுகிறது.
