translation_notes:
  register: நவீன தரத் தமிழில், பட்டியல் அமைப்பின் சுருக்கத்தையும் கண்ணியமான வேதாகம நடையையும் பேணுகிறது. எபிரெய உரையில் இவ்வசனம் முந்தைய வினைச்சொல்லைத் தொடர்ந்து வரும் பட்டியல் துண்டாக இருப்பதால், தமிழில் பொருள் முழுமைக்காக ‘கொடுத்தார்கள்’ சேர்க்கப்பட்டது.
