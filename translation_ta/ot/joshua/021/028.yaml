  text: 'And from the tribe of Issachar: Kishion with its pasturelands, and Dabrath with its pasturelands.'
translation:
  language: ta
  text: 'இசக்கார் கோத்திரத்திலிருந்து: கிஷ்யோனையும் அதன் மேய்ச்சல் நிலங்களையும், தாப்ராத்தையும் அதன் மேய்ச்சல் நிலங்களையும் கொடுத்தார்கள்.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מַטֵּה יִשָּׂשכָר
  choice: இசக்கார் கோத்திரம்
  rationale: מַטֶּה இங்கு இஸ்ரவேலின் பழங்குடிப் பிரிவைக் குறிக்கிறது; தமிழ் வேதாகம நடையில் இயல்பான ‘கோத்திரம்’ பயன்படுத்தப்பட்டது.
- source_word: קִשְׁיוֹן
  choice: கிஷியோன்
  rationale: எபிரெய இடப்பெயரின் ஒலிவடிவம் தமிழில் நெருக்கமாக எழுத்துப்பெயர்க்கப்பட்டது.
- source_word: דָּבְרַת
  choice: தாபிராத்
  rationale: எபிரெய இடப்பெயர் Dāḇeraṯ என்பதன் ஒலியைப் பேணும் வகையில் எழுத்துப்பெயர்க்கப்பட்டது.
- source_word: מִגְרָשֶׁהָ
  choice: அதன் மேய்ச்சல் நிலங்கள்
  rationale: நகரைச் சுற்றியிருந்த கால்நடை மேய்ச்சலுக்கான திறந்த நிலங்களைக் குறிக்கும் சொல்லின் சூழல்சார் பொருள் தெளிவாக வழங்கப்பட்டது.
