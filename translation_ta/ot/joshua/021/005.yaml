  text: And for the remaining sons of Kohath[a], from the clans of the tribe of Ephraim, from the tribe of Dan, and from the half-tribe of Manasseh, there were by lot ten cities.
translation:
  language: ta
  text: மீதியிருந்த கோகாத்தின் மக்களுக்கு[a], எப்பிராயீம் கோத்திரத்தின் குலங்களிலிருந்தும், தாண் கோத்திரத்திலிருந்தும், மனாசேயின் அரைக் கோத்திரத்திலிருந்தும், குலுக்கல் முறையில் பத்துப் பட்டணங்கள் கிடைத்தன.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மீதியிருந்த கோகாத்தியர்களுக்கு.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/לִ/בְנֵי קְהָת הַנּוֹתָרִים
  choice: மீதியிருந்த கோகாத்தின் மக்களுக்கு
  rationale: לִ prefixed expression allocation recipients என்பதைச் சுட்டுகிறது; בְנֵי קְהָת என்பதை அதன் மரபுவழி வடிவைத் தக்கவைத்து மொழிபெயர்க்கிறது. הַנּוֹתָרִים என்பது முந்தைய வசனத்தில் குறிப்பிடப்பட்டவர்களைத் தவிர்ந்த மீதிக் கோகாத்தியர்களைக் குறிக்கிறது.
- source_word: מִ/מִּשְׁפְּחֹת
  choice: குலங்களிலிருந்தும்
  rationale: கோத்திரத்திற்குள் உள்ள சமூக உட்பிரிவுகளை מִשְׁפָּחָה இங்கு குறிக்கிறது; ஆகவே பொதுவான ‘குடும்பங்கள்’ என்பதைக் காட்டிலும் ‘குலங்கள்’ பொருத்தமானது.
- source_word: מַטֵּה אֶפְרַיִם
  choice: எப்பிராயீம் கோத்திரத்தின்
  rationale: இந்தப் பங்கீட்டுச் சூழலில் מַטֶּה என்பது கோலை அல்ல, இஸ்ரவேலின் கோத்திர அலகைக் குறிக்கிறது.
- source_word: וּ/מִ/מַּטֵּה דָן
  choice: தாண் கோத்திரத்திலிருந்தும்
  rationale: எபிரெய இணை அமைப்பையும் மூலத்திலுள்ள ‘இலிருந்து’ என்ற உறவையும் தெளிவாகத் தக்கவைக்கிறது.
- source_word: וּ/מֵ/חֲצִי מַטֵּה מְנַשֶּׁה
  choice: மனாசேயின் அரைக் கோத்திரத்திலிருந்தும்
  rationale: மனாசே கோத்திரத்தின் பிரிக்கப்பட்ட பாதியைக் குறிக்கும் வழக்கமான, தெளிவான தமிழ் வடிவம்.
- source_word: בַּ/גּוֹרָל
  choice: குலுக்கல் முறையில்
  rationale: גּוֹרָל மூலம் பட்டணங்கள் ஒதுக்கப்பட்ட நடைமுறையை இயல்பான நவீன தமிழில் தெரிவிக்கிறது; வெறும் தற்செயல் என்ற எண்ணத்தைத் தவிர்த்து பங்கீட்டு முறையை உணர்த்துகிறது.
- source_word: עָרִים עָשֶׂר
  choice: பத்துப் பட்டணங்கள்
  rationale: עִיר என்பதற்கான இப்பட்டியல் சூழலின் நேரடியான, வாசகருக்கு எளிய தமிழ் இணை.
- source_word: implicit verbless clause
  choice: கிடைத்தன
  rationale: எபிரெயில் வினைச்சொல் வெளிப்படையாக இல்லை. தமிழில் முழுமையான வாக்கியத்திற்குத் தேவையான வினையை வழங்குகிறது; சூழலில் உள்ள பங்கீட்டு விளைவை இயல்பாகச் சொல்கிறது.
