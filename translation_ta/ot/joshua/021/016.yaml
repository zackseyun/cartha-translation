translation_notes:
  register: நவீனத் தரத் தமிழில், பட்டியல் நடையைப் பேணிய கண்ணியமான மொழிநடை. எபிரெய வாக்கியத்தில் இவ்வசனத்துக்குள் வெளிப்படையாக இல்லாத ‘கொடுத்தார்கள்’ என்பது முந்தைய வசனங்களில் தொடரும் வினையைத் தமிழில் நிறைவு செய்யச் சேர்க்கப்பட்டது; நகரப்பெயர்களுக்குப் பின் ‘நகரம்’ என்பதும் தெளிவுக்காக இணைக்கப்பட்டது.
