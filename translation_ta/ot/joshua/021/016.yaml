base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/016.yaml
  text: Ain with its pasturelands[a], Juttah with its pasturelands, Beth-shemesh with its pasturelands—nine cities from these two tribes.
translation:
  language: ta
  text: ஆயின் அதன் மேய்ச்சல் நிலங்களுடன்[a], யுத்தா அதன் மேய்ச்சல் நிலங்களுடன், பெத்-ஷெமேஷ் அதன் மேய்ச்சல் நிலங்களுடன்—இந்த இரண்டு கோத்திரங்களிலிருந்து ஒன்பது நகரங்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “பொதுப் பயன்பாட்டு நிலங்கள்” அல்லது ஒவ்வொரு நகரத்துக்கும் சொந்தமான “சுற்றுப்புற நிலங்கள்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַיִן
  choice: ஆயின்
  rationale: இது ஓர் இடப்பெயர் என்பதால் பொருளாக்காமல், எபிரெய ஒலிப்புக்கு நெருக்கமாகத் தமிழில் ஒலிபெயர்க்கப்பட்டது.
- source_word: מִגְרָשֶׁיהָ
  choice: அதன் மேய்ச்சல் நிலங்கள்
  rationale: நகரத்துடன் இணைந்த, குறிப்பாக கால்நடைகளை மேய்ப்பதற்குப் பயன்பட்ட திறந்த நிலங்களை இச்சொல் குறிக்கிறது; பழைய வழக்கிலுள்ள தெளிவற்ற சொற்களைவிட இது இயல்பாகவும் கருத்துக்குத் துல்லியமாகவும் உள்ளது.
- source_word: יֻטָּה
  choice: யுத்தா
  rationale: எபிரெய இடப்பெயர் தமிழ் ஒலிமுறைக்கு ஏற்றவாறு ஒலிபெயர்க்கப்பட்டது.
- source_word: בֵּית שֶׁמֶשׁ
  choice: பெத்-ஷேமேஷ்
  rationale: சொல்லின் கூறுகள் 'சூரியனின் வீடு' எனப் பொருள்பட்டாலும், இங்கு நிலைபெற்ற நகரப்பெயராக இருப்பதால் மொழிபெயர்க்காமல் ஒலிபெயர்க்கப்பட்டது.
- source_word: עָרִים תֵּשַׁע
  choice: மொத்தம் ஒன்பது நகரங்கள்
  rationale: பட்டியலின் மொத்த எண்ணிக்கையை இயல்பான தமிழில் தெளிவாகக் காட்டுகிறது; עָרִים என்பதற்கு இச்சூழலில் 'நகரங்கள்' பொருத்தமானது.
- source_word: מֵאֵת שְׁנֵי הַשְּׁבָטִים הָאֵלֶּה
  choice: இந்த இரண்டு கோத்திரங்களிலிருந்து
  rationale: முந்தைய சூழலில் குறிப்பிடப்பட்ட இரண்டு கோத்திரங்களிடமிருந்து இந்நகரங்கள் ஒதுக்கப்பட்டன என்ற மூல/பெறுமிட உறவைப் பாதுகாக்கிறது.
