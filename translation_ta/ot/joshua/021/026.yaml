  register: இயல்பான, கண்ணியமான நவீனத் தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘பட்டணங்கள்’ என்பது பட்டியலின் நிர்வாகச் சூழலுக்கு ஏற்றதாகவும், ‘மேய்ச்சல் நிலங்கள்’ என்பது இணைக்கப்பட்ட திறந்த நிலங்களின் முதன்மைப் பயன்பாட்டைத் தெளிவாகக் காட்டுவதாகவும் உள்ளது.
