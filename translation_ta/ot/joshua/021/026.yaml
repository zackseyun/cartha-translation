base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/026.yaml
  text: All the cities were ten[a], with their pasturelands[c][b], for the clans of the remaining sons of Kohath.
translation:
  language: ta
  text: கோகாத்தின் மீதமிருந்த மகன்களின் குலங்களுக்குரிய நகரங்கள் அனைத்தும், அவற்றின் மேய்ச்சல் நிலங்களுடன், பத்து.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மொழியில் இது முந்தைய பட்டியலை முடித்துத் தொகை கூறும் சொல்லமைப்பு; ‘மேய்ச்சல் நிலங்களுடன் பத்து நகரங்கள்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל עָרִים עֶשֶׂר
  choice: பட்டணங்கள்... மொத்தம் பத்து
  rationale: பட்டியலை முடித்துத் தொகை கூறும் எபிரெயச் சூத்திரத்தின் வலியுறுத்தலை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: וּמִגְרְשֵׁיהֶן
  choice: அவற்றின் மேய்ச்சல் நிலங்களுடன் சேர்த்து
  rationale: பட்டணங்களைச் சுற்றி அவற்றோடு இணைந்திருந்த, குறிப்பாக கால்நடை மேய்ச்சலுக்குப் பயன்பட்ட திறந்த நிலங்களைக் குறிக்கிறது.
- source_word: לְמִשְׁפְּחוֹת
  choice: குலங்களுக்கு
  rationale: מִשְׁפָּחוֹת என்பது ஒரு கோத்திரத்திற்குள் உள்ள உறவுமுறைப் பிரிவுகளைக் குறிக்கிறது; தமிழில் ‘குலங்கள்’ இதைச் சுருக்கமாகவும் தெளிவாகவும் தெரிவிக்கிறது.
- source_word: בְּנֵי קְהָת
  choice: கோகாத்தின் மகன்கள்
  rationale: மூலத்தின் வம்சவழிச் சொல்லாட்சியை நேரடியாகப் பாதுகாக்கிறது; சூழலில் இது கோகாத்தின் வழிவந்தவர்களைக் குறிக்கிறது.
- source_word: הַנּוֹתָרִים
  choice: மீதியிருந்த
  rationale: முன்னதாகப் பட்டணங்களைப் பெற்ற கோகாத்தியப் பிரிவிலிருந்து இவர்களை வேறுபடுத்தும் அடைமொழிப் பொருளைப் பாதுகாக்கிறது.
