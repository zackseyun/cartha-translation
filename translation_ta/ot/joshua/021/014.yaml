translation_notes:
  register: நவீனத் தரத் தமிழில், பட்டியல் வசனத்திற்கேற்ற நேரடியானவும் கண்ணியமானவும் உள்ள நடை. எபிரெய மூலத்தில் இவ்வசனம் முந்தைய வசனத்தின் வினைச்சொல்லைத் தொடர்ந்து வரும் பட்டியல் துண்டாக இருந்தாலும், தமிழில் தனிவசனமாக வாசிக்கத் தெளிவாக ‘கொடுத்தார்கள்’ சேர்க்கப்பட்டது. அடிக்குறிப்புக் குறி தொடர்புடைய முதல் சொல்லாக்கத்தின் பின்னர் இடப்பட்டுள்ளது.
