  text: Jattir with its pasturelands[a], and Eshtemoa with its pasturelands.
translation:
  language: ta
  text: யத்தீரையும் அதன் சுற்றுப்புற மேய்ச்சல் நிலங்களையும்[a], எஷ்தெமோவாவையும் அதன் சுற்றுப்புற மேய்ச்சல் நிலங்களையும் கொடுத்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘பொது நிலங்களையும்’; ஒவ்வொரு நகரத்தையும் சுற்றியுள்ள நிலம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַתִּר
  choice: யத்தீர்
  rationale: இடப்பெயர் மொழிபெயர்க்கப்படாமல், எபிரெய உச்சரிப்புக்கு நெருக்கமாகத் தமிழில் ஒலிபெயர்க்கப்பட்டது.
- source_word: מִגְרָשֶׁהָ
  choice: அதைச் சுற்றியிருந்த மேய்ச்சல் நிலங்கள்
  rationale: லேவியர் நகரங்களின் பட்டியலில் מִגְרָשׁ என்பது ஒவ்வொரு நகரத்தையும் சுற்றியிருந்த, பொதுப் பயன்பாட்டிற்கும் கால்நடை மேய்ச்சலுக்கும் உரிய திறந்த நிலங்களைக் குறிக்கிறது; பெண்பால் ஒருமை பின்னொட்டு ஒவ்வொரு நகரத்தையும் சுட்டுகிறது.
- source_word: אֶשְׁתְּמֹעַ
  choice: எஷ்தெமோவா
  rationale: இடப்பெயர் எபிரெய வடிவத்தின் மெய்யொலிகளையும் இறுதி உயிரொலியையும் தெளிவாகக் காட்டும் வகையில் தமிழில் ஒலிபெயர்க்கப்பட்டது.
- source_word: וְאֶת
  choice: …ஐயும்
  rationale: וְ என்பதன் இணைப்புப் பொருள் தமிழின் பட்டியல் அமைப்புக்கேற்ப ‘-உம்’ மூலம் வெளிப்படுத்தப்பட்டது; אֵת குறிக்கும் நேரடிச் செயப்படுபொருள் வேற்றுமை ‘-ஐ’ மூலம் இயல்பாகக் காட்டப்பட்டது.
