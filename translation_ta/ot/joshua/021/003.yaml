  text: וַ/יִּתְּנ֨וּ בְנֵי יִשְׂרָאֵ֧ל לַ/לְוִיִּ֛ם מִ/נַּחֲלָתָ֖/ם אֶל פִּ֣י יְהוָ֑ה אֶת הֶ/עָרִ֥ים הָ/אֵ֖לֶּה וְ/אֶת מִגְרְשֵׁי/הֶֽן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/003.yaml
  text: So the sons of Israel gave to the Levites[a], from their inheritance, at the command of Yahweh[c][b], these cities and their pasturelands.
translation:
  language: ta
  text: ஆகவே இஸ்ரவேலின் மகன்கள் தங்கள் உரிமைச்சொத்திலிருந்து, யாவேயின் கட்டளைப்படி[a], இந்தப் பட்டணங்களையும் அவற்றின் மேய்ச்சல் நிலங்களையும்[b] லேவியர்களுக்குக் கொடுத்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லளவில், “யாவேயின் வாயின்படி.” இது “யாவேயின் கட்டளைப்படி” என்று பொருள்படும் எபிரெய மரபுத்தொடர்.
    reason: lexical_alternative
  - marker: b
    text: அதாவது, பட்டணங்களுக்குச் சொந்தமான திறந்த நிலம் அல்லது கால்நடை மேய்ச்சல் பகுதி.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּתְּנוּ
  choice: கொடுத்தார்கள்
  rationale: נתן என்பதன் அடிப்படைப் பொருளான ‘கொடு’ என்பதை இயல்பான தமிழ் இறந்தகால நடையில் தருகிறது; நிலப் பங்கீட்டுச் சூழலில் ‘ஒதுக்கிக் கொடுத்தார்கள்’ என்பதும் சாத்தியம், ஆனால் இங்கு தேவையற்ற விளக்கத்தைச் சேர்க்கவில்லை.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் மகன்கள்
  rationale: எபிரெய மொழியின் குடும்ப உறவுச் சொல்லாட்சியை நெருக்கமாகப் பாதுகாக்கிறது. இயல்பான மாற்றாக ‘இஸ்ரவேலர்கள்’ இருக்கலாம்.
- source_word: לַלְוִיִּם
  choice: லேவியர்களுக்கு
  rationale: பெறுநரைக் குறிக்கும் முன்னொட்டுடன் வரும் לְוִיִּם என்பதற்கான நேரடியான, வழக்கமான தமிழ் வடிவம்.
- source_word: מִנַּחֲלָתָם
  choice: தங்கள் உரிமைச்சொத்திலிருந்து
  rationale: נחלה இங்கு கோத்திரங்களுக்கு உரிமையாகப் பங்கிடப்பட்ட நிலத்தைக் குறிக்கிறது. ‘உரிமைச்சொத்து’ மரபுரிமையையும் நில உரிமையையும் தமிழில் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: אֶל־פִּי יְהוָה
  choice: யாவேயின் கட்டளைப்படி
  rationale: சொல்லளவில் ‘யாவேயின் வாயின்படி’ என்றாலும், இந்த எபிரெய மரபுத்தொடர் ‘கட்டளைப்படி’ என்பதைக் குறிக்கிறது; தமிழில் பொருளை இயல்பாகத் தருகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: திருப்பெயரை ஒரு பட்டத்தால் மாற்றாமல், எபிரெய மெய்யெழுத்துப் பெயரின் பொதுவான ஒலிபெயர்ப்பைத் தமிழில் வழங்குகிறது.
- source_word: הֶעָרִים הָאֵלֶּה
  choice: இந்தப் பட்டணங்கள்
  rationale: சுட்டுப்பெயரையும் עָרִים என்பதன் நகரக் குடியிருப்பு பொருளையும் நேரடியாகக் காட்டுகிறது.
- source_word: מִגְרְשֵׁיהֶן
  choice: அவற்றின் மேய்ச்சல் நிலங்கள்
  rationale: பட்டணங்களைச் சுற்றி கால்நடைகளுக்காகப் பயன்படுத்தப்பட்ட திறந்த நிலப்பகுதிகளை நவீன வாசகருக்குத் தெளிவாகக் குறிக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற திருப்பெயரை எவ்வாறு மொழிபெயர்ப்பது
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் தனிப்பட்ட திருப்பெயர் நேரடியாக உள்ளது. அதனை ஒரு பட்டமாக மாற்றாமல் ஒலிபெயர்ப்பது மூலத்தின் தன்மையைப் பாதுகாக்கிறது.
- issue: בְנֵי יִשְׂרָאֵל என்ற குடும்பச் சொல்லாட்சியைப் பாதுகாப்பதா
  choice: இஸ்ரவேலின் மகன்கள்
  alternative: இஸ்ரவேலர்கள்
  rationale: மூலத்தின் ஆண்பால் பன்மை குடும்ப வெளிப்பாட்டைத் தக்கவைக்கிறது; அதே நேரத்தில் இது இஸ்ரவேல் மக்களைக் குறிக்கும் வழக்கமான இனக்குழுப் பெயராகவும் புரிந்துகொள்ளப்படலாம்.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகருக்குப் புரியும் வகையில் dignified narrative register பயன்படுத்தப்பட்டுள்ளது. ‘இஸ்ரவேலின் மகன்கள்’ மூலம் மூலத்தின் குடும்பச் சொல்லாட்சி பாதுகாக்கப்பட்டு, ‘உரிமைச்சொத்து’ நிலப் பங்கின் சட்டபூர்வ/மரபுரிமை நுணுக்கத்தை எடுத்துரைக்கிறது. எல்லா அடிக்குறிப்பு அடையாளங்களும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
