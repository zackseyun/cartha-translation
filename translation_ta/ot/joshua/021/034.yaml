- from: மெராரியின் மகன்களுடைய குடும்பங்களான மீதியிருந்த லேவியர்களுக்குச் செபுலோன் கோத்திரத்திலிருந்து, யொக்னெயாமையும் அதைச் சுற்றியுள்ள மேய்ச்சல் நிலங்களையும், கர்தாவையும் அதைச் சுற்றியுள்ள மேய்ச்சல் நிலங்களையும் கொடுத்தார்கள்.
  to: 'லேவியரில் மீதமிருந்த மெராரியின் மகன்களின் குடும்பங்களுக்கு, செபுலோன் கோத்திரத்திலிருந்து: யொக்னெயாம் அதன் மேய்ச்சல் நிலங்களோடு, கர்தா அதன் மேய்ச்சல் நிலங்களோடு.'
  rationale: The revision retains the Hebrew list syntax and removes the supplied finite verb. It also clarifies that the Merarite families are the Levites remaining in this stage of the allocation, while preserving the source’s concise appositional sense. No footnote is needed for the place-name spelling, since the English-only Kartah/Kartha variant does not create a corresponding ambiguity in the Tamil rendering.
