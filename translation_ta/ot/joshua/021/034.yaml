translation_notes:
  register: நவீனத் தரத் தமிழில், பட்டியல் வடிவத்தின் கண்ணியத்தையும் தொடர்ச்சியையும் காக்கும் நடை. மூல எபிரெயத்தில் ‘கொடுத்தார்கள்’ என்ற வினை இவ்வசனத்துக்குள் வெளிப்படையாக இல்லை; முந்தைய வசனங்களிலிருந்து தொடரும் ஒதுக்கீட்டுப் பட்டியலைத் தமிழில் முழுமையான வாக்கியமாக வாசிக்க இயலுமாறு அது சூழலிலிருந்து நிரப்பப்பட்டுள்ளது. பதிப்புக்குழு கடுமையான வடிவ ஒற்றுமையை விரும்பினால் இறுதி ‘கொடுத்தார்கள்’ என்பதை நீக்கி பட்டியல் துணுக்காக வைத்திருக்கலாம்.
