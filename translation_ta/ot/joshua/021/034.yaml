source:
  edition: WLC
  text: וּ/לְ/מִשְׁפְּח֣וֹת בְּנֵֽי מְרָרִי֮ הַ/לְוִיִּ֣ם הַ/נּוֹתָרִים֒ מֵ/אֵת֙ מַטֵּ֣ה זְבוּלֻ֔ן אֶֽת יָקְנְעָ֖ם וְ/אֶת מִגְרָשֶׁ֑/הָ אֶת קַרְתָּ֖ה וְ/אֶת מִגְרָשֶֽׁ/הָ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/034.yaml
  text: 'And to the families of the sons of Merari[a], the remaining Levites, from the tribe of Zebulun: Jokneam with its pasturelands, and Kartah with its pasturelands.'
translation:
  language: ta
  text: 'லேவியரில் மீதமிருந்த மெராரியின் மகன்களின் குடும்பங்களுக்கு, செபுலோன் கோத்திரத்திலிருந்து: யொக்னெயாம் அதன் மேய்ச்சல் நிலங்களோடு, கர்தா அதன் மேய்ச்சல் நிலங்களோடு.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּלְמִשְׁפְּחוֹת בְּנֵי מְרָרִי
  choice: மெராரியின் மகன்களுடைய குடும்பங்களான
  rationale: וּ தொடரும் ஒதுக்கீட்டுப் பட்டியலை இணைக்கிறது; לְ பெறுநர்களைக் குறிக்கிறது. בְּנֵי என்ற வம்சவழிச் சொல்லின் வடிவத்தை ‘மகன்கள்’ எனத் தக்கவைத்தும், מִשְׁפְּחוֹת என்பதை இயல்பான ‘குடும்பங்கள்’ எனவும் மொழிபெயர்க்கிறது.
- source_word: הַלְוִיִּם הַנּוֹתָרִים
  choice: மீதியிருந்த லேவியர்களுக்கு
  rationale: முந்தைய ஒதுக்கீடுகளுக்குப் பின் இன்னும் நகரங்கள் ஒதுக்கப்பட வேண்டியிருந்த லேவியக் குழுவைக் குறிக்கிறது. தமிழில் பெறுநர் வேற்றுமையை இங்கே வெளிப்படுத்துவது வாக்கியத்தை இயல்பாக்குகிறது.
- source_word: מֵאֵת מַטֵּה זְבוּלֻן
  choice: செபுலோன் கோத்திரத்திலிருந்து
  rationale: இந்த நில ஒதுக்கீட்டுச் சூழலில் מַטֶּה என்பது ‘கோத்திரம்’; מֵאֵת ஒதுக்கீடு எந்தக் கோத்திரத்திடமிருந்து வந்தது என்பதைக் காட்டுகிறது.
- source_word: יָקְנְעָם
  choice: யொக்னெயாம்
  rationale: எபிரெய இடப்பெயரின் ஒலியமைப்பைத் தமிழில் நெருக்கமாக எழுத்துப்பெயர்க்கிறது.
- source_word: מִגְרָשֶׁהָ
  choice: அதைச் சுற்றியுள்ள மேய்ச்சல் நிலங்கள்
  rationale: מִגְרָשׁ என்பது நகரத்தைச் சுற்றியிருந்து கால்நடை மேய்ச்சல் உள்ளிட்ட பொதுப் பயன்பாட்டுக்குரிய திறந்த நிலத்தைக் குறிக்கிறது; பெண்பால் ஒருமை உடைமைப் பின்னொட்டை ‘அதைச் சுற்றியுள்ள’ எனத் தெளிவாக்குகிறது.
- source_word: קַרְתָּה
  choice: கர்தா
  rationale: எபிரெய இடப்பெயரைத் தமிழில் எழுத்துப்பெயர்க்கிறது; ‘கர்த்தா’ என்ற வடிவம் தமிழில் வேறு சமயப் பொருளுடன் குழப்பம் ஏற்படுத்தக்கூடும் என்பதால் தவிர்க்கப்பட்டது.
