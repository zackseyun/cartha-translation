  register: நவீனத் தரத் தமிழில், பங்கீட்டுப் பட்டியலின் தொடர்ச்சியைத் தெளிவுபடுத்தும் வகையில் அமைக்கப்பட்டது. எபிரெய மூலத்தில் வெளிப்படையாக இல்லாத ‘கொடுத்தார்கள்’ என்பது முந்தைய வசனங்களிலிருந்து தொடரும் வினையைத் தமிழில் முழுமையான வாக்கியமாக்குவதற்காகச் சேர்க்கப்பட்டுள்ளது; பட்டியல் அமைப்பை உணர்த்த இருபுள்ளியும் பயன்படுத்தப்பட்டுள்ளது.
