    reason: textual_variant
lexical_decisions:
- source_word: וּ/מִ/מַּטֵּה
  choice: கோத்திரத்திலிருந்து
  rationale: நகரப் பங்கீட்டுச் சூழலில் מִן + מַטֶּה என்பது ஒரு கோத்திரத்திலிருந்து வழங்கப்பட்டதைச் சுட்டுகிறது; நவீன தமிழில் இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: רְאוּבֵן
  choice: ரூபேன்
  rationale: எபிரெயத் தனிப்பெயரின் தமிழில் பரவலாக அறியப்பட்ட வடிவம்.
- source_word: אֶת בֶּצֶר
  choice: பெசேரை
  rationale: אֶת என்பது நேரடிச் செயப்படுபொருள் குறியீடு; அதைத் தமிழின் ‘ஐ’ உருபால் வெளிப்படுத்தி, இடப்பெயரை எபிரெய ஒலிக்கு நெருக்கமாக எழுத்துப்பெயர்த்துள்ளது.
- source_word: מִגְרָשֶׁהָ
  choice: அதன் மேய்ச்சல் நிலத்தை
  rationale: லேவியர் நகரங்களின் சூழலில் מִגְרָשׁ என்பது நகரைச் சுற்றிய பொதுவான திறந்தவெளி அல்லது கால்நடை மேய்ச்சல் நிலத்தைக் குறிக்கிறது; ஒருமை கூட்டுப்பொருளைத் தமிழில் ‘மேய்ச்சல் நிலம்’ இயல்பாகத் தருகிறது.
- source_word: יַהְצָה
  choice: யாகாசை
  rationale: எபிரெய இடப்பெயரை அதன் மெய்யொலிகளை இயன்றவரை காத்து தமிழில் எழுத்துப்பெயர்த்துள்ளது; வேறு மரபுவழி வடிவங்கள் அடிக்குறிப்பில் தரப்பட்டுள்ளன.
