  text: 'And from the tribe of Reuben: Bezer with its pasturelands[b][a], and Jahaz with its pasturelands.'
translation:
  language: ta
  text: 'ரூபேன் கோத்திரத்திலிருந்து: பெசேரும் அதன் மேய்ச்சல் நிலமும், யக்சாவும்[a] அதன் மேய்ச்சல் நிலமும்.[b]


    [a] “யக்சா” என்ற இடப்பெயர் சில மொழிபெயர்ப்புகளில் “யகாசு” அல்லது “யகாசா” என்றும் எழுதப்படுகிறது.


    [b] சில எபிரெயக் கையெழுத்துப் பிரதிகளிலும் பழங்காலச் சான்றுகளிலும் யோசுவா 21:36–37 இல்லை. இங்கே பட்டியலிடப்பட்டுள்ள நகரங்கள் 1 நாளாகமம் 6:78–79-ல் உள்ள பட்டியலுக்கு இணையாக உள்ளன.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “யக்சா” என்ற இடப்பெயர் சில மொழிபெயர்ப்புகளில் “யகாசு” அல்லது “யகாசா” என்றும் எழுதப்படுகிறது.
    reason: lexical_alternative
  - marker: b
