  text: וַ/יִּתְּנ֨וּ לָ/הֶ֜ם אֶת קִרְיַת֩ אַרְבַּ֨ע אֲבִ֧י הָֽ/עֲנ֛וֹק הִ֥יא חֶבְר֖וֹן בְּ/הַ֣ר יְהוּדָ֑ה וְ/אֶת מִגְרָשֶׁ֖/הָ סְבִיבֹתֶֽי/הָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/011.yaml
  text: So they gave them Kiriath-arba (Arba was the father of Anak)[a], that is, Hebron, in the hill country of Judah, along with its pasturelands around it.
translation:
  language: ta
  text: அவர்கள் யூதாவின் மலைநாட்டிலுள்ள கீரியாத்-அர்பாவை—ஆனாக்கின் தந்தையான அர்பாவின் நகரத்தை[a]; அதுவே எப்ரோன்—அதன் சுற்றுப்புற மேய்ச்சல் நிலங்களோடு அவர்களுக்குக் கொடுத்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஆனாக்கின் மூதாதையான அர்பாவின் நகரம்.” எபிரெயச் சொற்றொடர் நேரடித் தந்தையையோ தொலைவான முன்னோரையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְּנוּ
  choice: ஆகவே, அவர்கள் ... கொடுத்தார்கள்
  rationale: வழக்கமான தொடர் நிகழ்வைக் குறிக்கும் wayyiqtol வடிவத்தை இயல்பான நவீன தமிழில் தொடர்ச்சியுடன் வெளிப்படுத்துகிறது.
- source_word: לָהֶם
  choice: அவர்களுக்கு
  rationale: எபிரெய மூன்றாம் நபர் ஆண்பால் பன்மைப் பதிற்பெயரை, சூழலிலுள்ள பெறுநர்களை விளக்கிச் சேர்க்காமல் அப்படியே வைத்திருக்கிறது.
- source_word: קִרְיַת אַרְבַּע
  choice: அர்பாவின் நகரம்
  rationale: இப்பெயரின் எபிரெயக் கட்டமைப்பான ‘அர்பாவின் நகரம்’ என்பதைத் தெளிவாகவும் இயல்பாகவும் தருகிறது; இது பின்னர் எப்ரோன் என அடையாளப்படுத்தப்படுகிறது.
- source_word: אֲבִי הָעֲנֹוק
  choice: அர்பா ஆனாக்கின் தந்தை
  rationale: அர்பாவை ஆனாக்குடன் தொடர்புபடுத்தும் இணைப்புரையைத் தெளிவான தமிழ் வாக்கியமாக்குகிறது; ‘தந்தை’ என்பது நேரடிப் பொருள், ஆனால் ‘மூதாதை’ என்ற சாத்தியமும் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: הִיא חֶבְרוֹן
  choice: அதுவே எப்ரோன்
  rationale: முன்னர் கூறப்பட்ட அர்பாவின் நகரமே எப்ரோன் என்று அடையாளப்படுத்தும் விளக்கப் பயன்பாட்டை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: בְּהַר יְהוּדָה
  choice: யூதாவின் மலைநாட்டில்
  rationale: הַר இங்கு தனி மலையை அல்ல, யூதாவின் மேட்டுநிலப் பிரதேசத்தைக் குறிக்கிறது.
- source_word: מִגְרָשֶׁיהָ
  choice: அதன் மேய்ச்சல் நிலங்கள்
  rationale: நகரைச் சுற்றிப் பயன்பாட்டுக்காக, குறிப்பாக கால்நடை மேய்ச்சலுக்காக ஒதுக்கப்பட்ட திறந்த நிலங்களைக் குறிக்கிறது.
- source_word: סְבִיבֹתֶיהָ
  choice: அதைச் சுற்றியிருந்த
  rationale: மேய்ச்சல் நிலங்கள் நகரைச் சூழ்ந்திருந்த இடவமைப்பைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
theological_decisions:
- issue: אֲבִי என்பதன் உறவுமுறை வரம்பு
  choice: முதன்மை உரையில் ‘தந்தை’
  alternative: ‘மூதாதை’
  rationale: எபிரெயச் சொல்லின் நேரடிப் பொருள் ‘தந்தை’; எனினும் அது தொலைவான முன்னோரையும் குறிக்கக்கூடும் என்பதால் அந்த உண்மையான தெளிவின்மை அடிக்குறிப்பில் வைக்கப்படுகிறது.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. எபிரெயச் சொல் வரிசையைத் தமிழில் இயல்பாக மறுவடிவமைத்தாலும், பெறுநர் பதிற்பெயர், இடப்பெயர் அடையாளம், நிலவியல் குறிப்பு, மேய்ச்சல் நிலங்கள் ஆகிய அனைத்தும் பாதுகாக்கப்பட்டுள்ளன.
