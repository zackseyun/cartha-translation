base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/043.yaml
  text: So Yahweh gave Israel all the land that he had sworn to give to their fathers[a], and they took possession of it and lived in it.
translation:
  language: ta
  text: ஆகவே, அவர்களுடைய தந்தையருக்குக் கொடுப்பதாக யாவே சத்தியம் செய்திருந்த நாடு முழுவதையும் அவர் இஸ்ரவேலுக்குக் கொடுத்தார். அவர்கள் அதை உடைமையாக்கினார்கள்[a]; அதில் குடியிருந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அதைச் சுதந்தரித்தார்கள்”; எபிரெய வினைச்சொல் உடைமையாக்குதல் என்ற பொருளுடன், உடன்படிக்கைச் சூழலில் சுதந்தரித்தல் என்ற பொருளையும் கொண்டிருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: யாவே
  rationale: தேவனுடைய தனிப்பெயரான YHWH-ஐ பொதுப்பட்டமான ‘கர்த்தர்’ என்று மாற்றாமல், தமிழில் இயல்பாக ஒலிபெயர்க்கிறது.
- source_word: וַיִּתֵּן
  choice: கொடுத்தார்
  rationale: נתן என்பதன் நேரடியான பொருளைத் தக்கவைத்து, தேவன் நாட்டை வழங்கிய செயலை எளிமையாகக் கூறுகிறது.
- source_word: כָּל הָאָרֶץ
  choice: நாடு முழுவதையும்
  rationale: אָרֶץ இங்கு உலகம் அல்லது பூமி முழுவதையும் அல்ல, இஸ்ரவேலுக்கு வாக்களிக்கப்பட்ட நாட்டைக் குறிக்கிறது; כָּל என்பதன் முழுமையையும் இந்தச் சொற்றொடர் காக்கிறது.
- source_word: אֲשֶׁר נִשְׁבַּע לָתֵת
  choice: கொடுப்பதாக ... சத்தியம் செய்திருந்த
  rationale: נִשְׁבַּע என்பது உறுதிமொழியுடன் சத்தியம் செய்வதைக் குறிக்கிறது; முந்தைய காலத்தில் செய்யப்பட்ட அந்தச் சத்தியத்தையும் தமிழில் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: לַאֲבוֹתָם
  choice: அவர்களுடைய தந்தையருக்கு
  rationale: எபிரெய உரையின் ஆண்பால் குடும்பச் சொல்லைத் தக்கவைக்கிறது; இங்கு இஸ்ரவேலின் முற்பிதாக்களே குறிப்பாகச் சுட்டப்படுகின்றனர்.
- source_word: וַיִּרָשׁוּהָ
  choice: அதைத் தங்கள் உடைமையாக்கிக்கொண்டு
  rationale: ירשׁ என்பதன் ‘உடைமையாக்குதல்/சுதந்தரித்தல்’ என்ற பொருள் வரம்பை மதித்து, நாட்டை நடைமுறையில் கைப்பற்றி உடைமையாக்கியதை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: וַיֵּשְׁבוּ בָהּ
  choice: அதில் குடியிருந்தார்கள்
  rationale: ישׁב + ב என்பதன் அந்நாட்டில் தங்கி வாழ்ந்த அல்லது குடியிருந்த பொருளை நேரடியாகவும் இயல்பாகவும் தருகிறது.
- source_word: וַ
  choice: ஆகவே
  rationale: தொடக்க வாவ் முந்தைய நிகழ்வுகளின் முடிவு அல்லது நிறைவேற்றச் சுருக்கத்தை அறிமுகப்படுத்துவதால், அதன் விளைவு சார்ந்த தொடர்பை வெளிப்படுத்துகிறது.
theological_decisions:
- issue: நாடு குறித்த வாக்குறுதி நிறைவேறியதன் பரப்பும் வலிமையும்
  choice: வாக்குறுதி செய்யப்பட்ட நாடு முழுவதையும் யாவே கொடுத்தார் என்றும், இஸ்ரவேல் அதை உடைமையாக்கிக் குடியிருந்தது என்றும் வசனம் கூறும் வலிமையை அப்படியே தக்கவைத்தல்.
  alternative: ‘முழுவதையும்’ என்பதைக் குறைத்து பகுதியளவு நிறைவேற்றம் என மொழிபெயர்த்தல், அல்லது பிற வெற்றிகொள்ளல் உரைகளை மீறுமாறு இவ்வசனத்தை முற்றிலும் விளக்கித் தருதல்.
  rationale: כָּל הָאָרֶץ என்ற சொற்றொடரும் அதைத் தொடரும் உடைமையாக்குதல், குடியிருத்தல் ஆகிய வினைகளும் வலுவான நிறைவேற்றச் சுருக்கத்தை அளிக்கின்றன. பரந்த வேதாகமத் தொடர்புகளில் உள்ள பதற்றத்தை மொழிபெயர்ப்பிலேயே தீர்க்காமல், இவ்வசனத்தின் சொந்த வலிமை பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் வேதாகம உரைக்கு ஏற்ற கண்ணியத்துடனும் மொழிபெயர்க்கப்பட்டது. ‘பிதாக்கள்’ என்பதற்குப் பதில் தற்போதைய இயல்பான ‘தந்தையர்’ பயன்படுத்தப்பட்டது; YHWH தனிப்பெயர் ‘யாவே’ எனத் தக்கவைக்கப்பட்டது. அடிக்குறிப்பு குறியீடு அது விளக்கும் வினைச்சொல்லுக்குப் பின்பே வைக்கப்பட்டது.
