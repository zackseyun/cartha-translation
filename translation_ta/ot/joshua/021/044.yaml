base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/044.yaml
  text: And Yahweh gave them rest on every side[a], according to all that he had sworn to their fathers. Not one man from all their enemies stood before them[b]; Yahweh gave all their enemies into their hand.
translation:
  language: ta
  text: யாவே அவர்களுக்குத் தம் பிதாக்களுக்குச் சத்தியம் செய்திருந்த அனைத்தின்படியும், எல்லாப் பக்கங்களிலும் ஓய்வளித்தார். அவர்களுடைய எதிரிகள் அனைவரிலும் ஒருவன்கூட அவர்களை எதிர்த்து நிற்கவில்லை[a]. அவர்களுடைய எதிரிகள் அனைவரையும் யாவே அவர்களுடைய கையில் ஒப்புக்கொடுத்தார்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “அவர்களுக்கு முன் நிற்கவில்லை”; இந்த மரபுத்தொடர், வெற்றிகரமாக எதிர்த்து நிற்க முடியவில்லை என்று பொருள்படும்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில், “அவர்களுடைய கையில் கொடுத்தார்”; இது ஒருவரை மற்றொருவரின் அதிகாரத்திற்குள் ஒப்புக்கொடுப்பதைக் குறிக்கும் பொதுவான மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּנַח
  choice: இளைப்பாறுதல் அளித்தார்
  rationale: נוח என்பதன் ஹிஃபில் வடிவம் இங்கு ‘இளைப்பாறச் செய்தல்/இளைப்பாறுதல் அளித்தல்’ என்று பொருள்படுகிறது; உடன்படிக்கையின் நிறைவேற்றத்தையும் போருக்குப் பிந்தைய பாதுகாப்பையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: தமிழில் பரவலாக அறியப்படும் தனிப்பெயர் வடிவம்; மூலத்தின் இறைப் பெயரை ஒரு பட்டத்தால் மாற்றாமல் தக்கவைக்கிறது.
- source_word: מִסָּבִיב
  choice: அவர்களைச் சுற்றிலும்
  rationale: சுற்றியுள்ள எல்லாத் திசைகளிலிருந்தும் கிடைத்த முழுமையான பாதுகாப்பைக் குறிக்கும் எபிரெயச் சொல்லின் இடவியல் பொருளைத் தக்கவைக்கிறது.
- source_word: כְּכֹל אֲשֶׁר נִשְׁבַּע
  choice: ஆணையிட்டிருந்த அனைத்தின்படியும்
  rationale: כְּ என்பதன் ‘படியே’ என்ற ஒப்புமை வலிமையையும் כֹּל என்பதன் முழுமையையும் வெளிப்படுத்துகிறது.
- source_word: לַאֲבוֹתָם
  choice: அவர்களுடைய தந்தையருக்கு
  rationale: மூலத்தில் உள்ள ஆண்பால் குடும்பச் சொல்லைத் தக்கவைத்து, இங்கு முற்பிதாக்களைக் குறிக்கும் இயல்பான தமிழ் வடிவத்தைப் பயன்படுத்துகிறது.
- source_word: וְלֹא עָמַד אִישׁ בִּפְנֵיהֶם
  choice: ஒருவன்கூட அவர்களை எதிர்த்து நிற்கவில்லை
  rationale: ‘அவர்களுக்கு முன் நிற்றல்’ என்ற எபிரெய மரபுத்தொடர் வெற்றிகரமாக எதிர்த்து நிற்பதைக் குறிக்கிறது; தமிழில் பொருள் தெளிவாக இருக்க ‘எதிர்த்து’ சேர்க்கப்பட்டுள்ளது.
- source_word: מִכָּל אֹיְבֵיהֶם
  choice: அவர்களுடைய எதிரிகள் அனைவரிலும்
  rationale: எதிரிகளின் முழுக் குழுவிலிருந்து ஒருவன்கூட இல்லை என்ற பகுதியுறவு பொருளைத் தக்கவைக்கிறது.
- source_word: נָתַן ... בְּיָדָם
  choice: அவர்களுடைய கையில் ஒப்புக்கொடுத்தார்
  rationale: எதிரிகளை அவர்களுடைய அதிகாரத்திற்குள் கொடுத்தார் என்ற வழக்கமான எபிரெய மரபுத்தொடரின் ‘கை’ உருவகத்தைத் தக்கவைக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரின் மொழிபெயர்ப்பு
  choice: யெகோவா
  alternative: யாவே
  rationale: இரண்டும் நான்கு எழுத்து இறைப் பெயரின் ஒலிபெயர்ப்பு மரபுகள்; தமிழில் பரவலாக அறியப்படும் ‘யெகோவா’வைப் பயன்படுத்தி, ‘கர்த்தர்’ போன்ற பட்டத்தால் பெயரை மாற்றவில்லை.
- issue: லַאֲבוֹתָם மற்றும் אִישׁ ஆகியவற்றிலுள்ள பாலினக் குறிப்புகள்
  choice: தந்தையர் / ஒருவன்
  alternative: மூதாதையர் / ஒருவர்
  rationale: மூலத்தின் ஆண்பால் வடிவங்களை மறைக்காமல் தமிழில் இயல்பாகத் தக்கவைக்கிறது; அத்துடன் אִישׁ இங்கு எதிரிகளுள் ஒருவனைப் பகுதியுறவாகக் குறிக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான நடையைப் பயன்படுத்துகிறது. ‘இளைப்பாறுதல்’, ‘ஆணையிட்டிருந்த’, ‘எதிர்த்து நிற்கவில்லை’ ஆகியவை சாதாரண வாசகருக்குப் புரியும் வகையில் மூலத்தின் உடன்படிக்கை, பாதுகாப்பு, வெற்றி ஆகிய கருத்துகளைத் தக்கவைக்கின்றன. எல்லா அடிக்குறிப்பு அடையாளங்களும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
