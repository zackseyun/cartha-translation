translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான நடையைப் பயன்படுத்துகிறது. மூலத்தில் வினைச்சொல் இல்லாமல் முந்தைய வசனத்தின் வாக்கிய அமைப்பு தொடர்கிறது; தமிழில் முழுமையான வாக்கியமாக அமைய ‘கொடுத்தார்கள்’ சூழலிலிருந்து நிரப்பப்பட்டுள்ளது. அடிக்குறிப்புக் குறிகள் ஆங்கில ஆலோசனை உரையில் காணப்படும் [b][a] வரிசையிலேயே முதன்மை உரையில் வைக்கப்பட்டுள்ளன.
