translation:
  language: ta
  text: திம்னாவையும் அதன் மேய்ச்சல் நிலங்களையும்[b][a], நஹலாலையும் அதன் மேய்ச்சல் நிலங்களையும்—நான்கு நகரங்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இந்தப் பகுதியில் சில நகரப் பெயர்கள் இடம்பெறுவதிலும் அவை வரிசைப்படுத்தப்பட்டிருப்பதிலும் எபிரெயக் கையெழுத்துப் பிரதிகளும் பழங்கால மொழிபெயர்ப்புகளும் வேறுபடுகின்றன; 1 நாளாகமம் 6:62-இல் உள்ள இணைப் பட்டியலை ஒப்பிடுக (சில மொழிபெயர்ப்புகளில் 6:77).
    reason: textual_variant
  - marker: b
    text: அல்லது, “பொதுப் பயன்பாட்டு நிலங்கள்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: דִּמְנָה
  choice: திம்னா
  rationale: இது ஓர் இடப்பெயர்; எபிரெய உச்சரிப்பைத் தொடர்ந்து தமிழில் ஒலிபெயர்க்கப்பட்டது.
- source_word: מִגְרָשֶׁהָ
  choice: அதைச் சுற்றியுள்ள மேய்ச்சல் நிலங்கள்
  rationale: מִגְרָשׁ என்பது நகரத்துடன் இணைந்திருந்த சுற்றுப்புறத் திறந்தவெளி அல்லது கால்நடை மேய்ச்சலுக்குரிய பொது நிலத்தைக் குறிக்கிறது. லேவிய நகரங்களின் சூழலில் இந்தத் தேர்வு இயல்பாகவும் தெளிவாகவும் உள்ளது; பெண்பால் ஒருமை உடைமை விகுதி ஒவ்வொரு நகரத்தையும் சுட்டுகிறது.
- source_word: נַהֲלָל
  choice: நகலால்
  rationale: இது ஓர் இடப்பெயர்; எபிரெய எழுத்தான ח-ஐத் தமிழில் அண்மையான ‘க’ ஒலியால் குறித்த ஒலிபெயர்ப்பு.
- source_word: עָרִים אַרְבַּע
  choice: மொத்தம் நான்கு நகரங்கள்
  rationale: பட்டியலின் முடிவில் வரும் எண்ணிக்கைச் சுருக்கத்தை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது; עָרִים என்பதற்கு ‘நகரங்கள்’ பயன்படுத்தப்பட்டது.
