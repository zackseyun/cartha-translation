  text: 'and from the tribe of Benjamin: Gibeon with its pasturelands[a], and Geba with its pasturelands;'
translation:
  language: ta
  text: 'பென்யமீன் கோத்திரத்திலிருந்தும்: கிபியோனையும் அதன் மேய்ச்சல் நிலங்களையும்[a], கேபாவையும் அதன் மேய்ச்சல் நிலங்களையும் கொடுத்தார்கள்;'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘பொதுநிலங்கள்’ அல்லது ‘திறந்த வெளி நிலங்கள்’; ஒவ்வொரு நகரத்தையும் சுற்றியிருந்த நிலப்பகுதி.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/מִ/מַּטֵּה בִנְיָמִן
  choice: பென்யமீன் கோத்திரத்திலிருந்து
  rationale: மַטֶּה என்பது நிலப் பங்கீட்டுச் சூழலில் ‘கோத்திரம்’ எனப் பொருள்படும். முன்னொட்டான מִן ‘இலிருந்து’ என வெளிப்படுத்தப்படுகிறது; וְ முந்தைய பட்டியலுடன் இணைக்கிறது, ஆனால் தமிழில் பட்டியல் தொடர்ச்சி மற்றும் நிறுத்தக்குறியால் அந்த இணைப்பு இயல்பாகத் தெரிவிக்கப்படுகிறது.
- source_word: גִּבְעוֹן
  choice: கிபியோன்
  rationale: எபிரெய இடப்பெயரின் ஒலிபெயர்ப்பு; தமிழில் பரவலாக அறியப்படும் வேதாகமப் பெயர்வடிவம் பயன்படுத்தப்படுகிறது.
- source_word: מִגְרָשֶׁהָ
  choice: அதைச் சுற்றியுள்ள மேய்ச்சல் நிலங்கள்
  rationale: மִגְרָשׁ என்பது லேவிய நகரத்தைச் சுற்றியிருந்த திறந்த அல்லது பொதுப் பயன்பாட்டு நிலத்தைக் குறிக்கிறது; கால்நடை மேய்ச்சல் பயன்பாட்டைத் தெளிவாகக் காட்டும் இயல்பான தமிழாக்கம் இது. பெண்பால் ஒருமை உடைமைப் பின்னொட்டு நகரத்தைக் குறிக்கும் வகையில் ‘அதைச் சுற்றியுள்ள’ என வழங்கப்படுகிறது.
- source_word: גֶּבַע
  choice: கேபா
  rationale: எபிரெய இடப்பெயரின் ஒலிபெயர்ப்பு; ‘கிபியோன்’ என்பதிலிருந்து வேறுபடும் பெயராக ஒலியமைப்பு காக்கப்படுகிறது.
- source_word: וְ/אֶת
  choice: …ஐயும்
  rationale: וְ பட்டியலிலுள்ள நகரங்களையும் அவற்றின் நிலங்களையும் இணைக்கிறது; אֶת குறிக்கும் நேர்செயப்படுபொருள் உறவு தமிழில் ‘ஐ’ உருபாலும், இணைப்பு ‘உம்’ பின்னொட்டாலும் இயல்பாக வெளிப்படுகிறது.
