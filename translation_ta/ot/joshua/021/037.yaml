  text: 'Kedemoth with its pasturelands[a], and Mephaath with its pasturelands: four cities.'
translation:
  language: ta
  text: கெதேமோத்தையும் அதனுடன் இணைந்த மேய்ச்சல் நிலங்களையும்[a], மேபாத்தையும் அதனுடன் இணைந்த மேய்ச்சல் நிலங்களையும் கொடுத்தார்கள்—மொத்தம் நான்கு நகரங்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘பொதுநிலம்’ அல்லது ‘சுற்றியுள்ள நிலப்பகுதி’ என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் מִגְרָשׁ ஒவ்வொரு நகரத்துடனும் இணைக்கப்பட்டிருந்த திறந்த நிலப்பகுதியைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: קְדֵמוֹת
  choice: கெதேமோத்
  rationale: இது ஓர் இடப்பெயர்; பொருள் மொழிபெயர்ப்பு செய்யாமல், எபிரெய ஒலிப்புக்கு ஏற்றவாறு தமிழில் எழுத்துப்பெயர்க்கப்பட்டது.
- source_word: מִגְרָשֶׁהָ
  choice: அதைச் சேர்ந்த மேய்ச்சல் நிலங்கள்
  rationale: מִגְרָשׁ என்பது நகரத்துடன் இணைக்கப்பட்டிருந்த திறந்த பொதுநிலம் அல்லது கால்நடை மேய்ச்சலுக்கான நிலப்பகுதியைக் குறிக்கிறது. நகரத்துடனான தொடர்பை பெண்பால் ஒருமை உடைமைப் பின்னொட்டு காட்டுவதால், தமிழில் இயல்பாக ‘அதைச் சேர்ந்த’ என வழங்கப்பட்டது.
- source_word: מֵיפָעַת
  choice: மேபாத்
  rationale: இது ஓர் இடப்பெயர்; எபிரெய உச்சரிப்பை அணுகும் வகையில் தமிழில் எழுத்துப்பெயர்க்கப்பட்டது.
- source_word: עָרִים אַרְבַּע
  choice: மொத்தம் நான்கு நகரங்கள்
  rationale: பட்டியலின் எண்ணிக்கைச் சுருக்கத்தைத் தெளிவாகக் காட்ட ‘மொத்தம்’ சேர்க்கப்பட்டது; עָרִים என்பதற்கு இச்சூழலில் ‘நகரங்கள்’ பொருத்தமானது.
- source_word: אֶת ... וְאֶת ... וְאֶת ... וְאֶת
  choice: …ஐயும் …ஐயும், …ஐயும் …ஐயும்
  rationale: திரும்பத் திரும்ப வரும் நேரடிச் செயப்படுபொருள் குறியீடுகள் பட்டியலின் அமைப்பை உருவாக்குகின்றன. தமிழில் இணைப்பும்மை உருபுகள் மூலம் அந்த அமைப்பு இயல்பாகப் பாதுகாக்கப்பட்டது; சூழலால் உணரப்படும் ‘கொடுத்தார்கள்’ என்ற வினை சேர்க்கப்பட்டது.
