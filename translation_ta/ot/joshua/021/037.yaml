    issue: Inconsistent rendering of מֵיפָעַת
    rationale: The translation text has “மேபாத்” in inflected form “மேபாத்தையும்,” while the lexical decision records “மேபாத்.” A single consistent Tamil form is required; “மேபாத்” is retained in the revised text and lexical footnote set.
