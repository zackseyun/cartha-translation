    issue: Footnote wording can more precisely identify the lexical range
    rationale: The footnote’s “சுற்றியுள்ள மேய்ச்சல் நிலங்கள்” is possible, but מִגְרָשׁ need not specifically mean pasture in every context. “சுற்றியுள்ள நிலப்பகுதி” preserves the broader alternative while the main text remains contextually clear.
