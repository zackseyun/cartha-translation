  register: நவீன நிலையான தமிழில், பட்டியல் நடையைத் தக்கவைத்தபடி இயல்பாகவும் மரியாதைமிக்கதாகவும் வழங்கப்பட்டுள்ளது. தனித்து வாசிக்கும்போது வாக்கியம் முழுமையாக இருக்க, சூழலில் முன்பே தரப்பட்டுள்ள ‘கொடுத்தார்கள்’ என்ற வினை வெளிப்படையாகச் சேர்க்கப்பட்டுள்ளது.
