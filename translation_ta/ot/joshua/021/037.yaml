- from: கெதேமோத்தையும் அதைச் சேர்ந்த மேய்ச்சல் நிலங்களையும்,[a] மேபாத்தையும் அதைச் சேர்ந்த மேய்ச்சல் நிலங்களையும் கொடுத்தார்கள்—மொத்தம் நான்கு நகரங்கள்.
  to: கெதேமோத்தையும் அதனுடன் இணைந்த மேய்ச்சல் நிலங்களையும்[a], மேபாத்தையும் அதனுடன் இணைந்த மேய்ச்சல் நிலங்களையும் கொடுத்தார்கள்—மொத்தம் நான்கு நகரங்கள்.
  rationale: மֵיפָעַת-க்கான தமிழ்ப் பெயர் வடிவம் உரை முழுவதும் “மேபாத்” என ஒருமைப்படுத்தப்பட்டுள்ளது; வேற்றுமை உருபு சேரும்போது அது “மேபாத்தையும்” ஆகிறது. மִגְרָשׁ-க்கான முதன்மைச் சொல் சூழலுக்கேற்றவாறு “மேய்ச்சல் நிலங்கள்” எனத் தக்கவைக்கப்பட்டு, அதன் பரந்த சொற்பொருள் அடிக்குறிப்பில் தெளிவுபடுத்தப்பட்டுள்ளது. பட்டியலின் சூழலால் உணரப்படும் “கொடுத்தார்கள்” பாதுகாக்கப்பட்டுள்ளது.
