base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/002.yaml
  text: And they spoke to them at Shiloh in the land of Canaan[a], saying, “Yahweh commanded through Moses to give us cities to dwell in[b], along with their pasturelands for our livestock.”
translation:
  language: ta
  text: 'அவர்கள் கானான் நாட்டிலுள்ள சீலோவில் அவர்களிடம் கூறினார்கள்: “யாவே மோசேயின் மூலம்[a], நாங்கள் குடியிருக்க நகரங்களையும் எங்கள் கால்நடைகளுக்காக அவற்றின் மேய்ச்சல் நிலங்களையும்[b] எங்களுக்குக் கொடுக்கும்படி கட்டளையிட்டார்.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரெயத்தில் சொல்லுக்குச் சொல்: ‘மோசேயின் கையால்’; இது ‘மோசேயின் மூலம்’ என்று பொருள்படும் மரபுத்தொடர்.'
    reason: lexical_alternative
  - marker: b
    text: ‘அவற்றின் திறந்த நிலங்கள்’ அல்லது ‘அவற்றின் பொது நிலங்கள்’ என்றும் மொழிபெயர்க்கலாம்; நகரங்களைச் சுற்றிக் கால்நடைகளை மேய்ப்பதற்குப் பயன்படுத்தப்பட்ட நிலத்தை எபிரெயச் சொல் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבְּרוּ אֲלֵיהֶם
  choice: அவர்களிடம் பேசி
  rationale: דבר என்பதன் ‘பேசு’ என்ற பொருளையும், אֶל என்பதன் ஒருவரை நோக்கிய திசையையும் இயல்பான தமிழில் காக்கிறது; தொடர்ந்து வரும் לֵאמֹר நேர்கூற்றை அறிமுகப்படுத்துகிறது.
- source_word: בְּשִׁלֹה בְּאֶרֶץ כְּנַעַן
  choice: கானான் நாட்டிலுள்ள சீலோவில்
  rationale: ‘கானான் நாடு’ என்ற வெளிப்படையான நிலப்பெயரையும், சீலோ அதற்குள் அமைந்த இடம் என்பதையும் தெளிவான இயல்பான தமிழில் தருகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய வேதப்பிரதியில் நேரடியாக வரும் இறைப்பெயரை ஒரு பொதுப் பட்டத்தால் மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: בְיַד מֹשֶׁה
  choice: மோசேயின் மூலம்
  rationale: சொல்லுக்குச் சொல் ‘மோசேயின் கையால்’ என்றாலும், இங்கு கட்டளை மோசேயின் வழியாக அறிவிக்கப்பட்டது என்ற கருவி/இடைமைப் பொருளை நவீன தமிழில் இயல்பாகத் தெரிவிக்கிறது.
- source_word: לָתֶת לָנוּ עָרִים לָשָׁבֶת
  choice: நாங்கள் குடியிருப்பதற்கு நகரங்களை எங்களுக்குக் கொடுக்கும்படி
  rationale: נתן என்பதன் ‘கொடு’ என்ற நேர்ப்பொருளையும், ישׁב என்பதன் குடியிருக்கும் நோக்கத்தையும் காக்கிறது; கட்டளையை நிறைவேற்ற வேண்டியவர் எபிரெயத்தில் குறிப்பிடப்படாதபடியே தமிழிலும் குறிப்பிடப்படவில்லை.
- source_word: וּמִגְרְשֵׁיהֶן לִבְהֶמְתֵּנוּ
  choice: எங்கள் கால்நடைகளுக்காக அவற்றைச் சுற்றியுள்ள மேய்ச்சல் நிலங்களையும்
  rationale: מִגְרָשׁ என்பது நகரங்களைச் சுற்றியிருந்து கால்நடைகளுக்குப் பயன்பட்ட திறந்த அல்லது பொது நிலத்தைக் குறிக்கிறது; சூழலில் ‘மேய்ச்சல் நிலங்கள்’ அதன் நடைமுறைப் பயனைத் தெளிவாகக் காட்டுகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: ஆண்டவர்; யெகோவா
  rationale: மூலத்தில் பொதுப் பட்டமல்ல, நான்கு எழுத்துகளைக் கொண்ட தனிப்பட்ட இறைப்பெயரே உள்ளது. ‘யாவே’ அதனைப் பட்டமாக மாற்றாமல், நவீன ஆய்வில் பரவலாக ஏற்கப்படும் உச்சரிப்புக்கு ஏற்ப ஒலிபெயர்க்கிறது.
- issue: கட்டளையை நிறைவேற்ற வேண்டியவர் யார் என்பது
  choice: எழுவாயைச் சேர்க்காமல் ‘கொடுக்கும்படி’ என்று மொழிபெயர்த்தல்
  alternative: ‘நீங்கள் எங்களுக்குக் கொடுக்கும்படி’ என்று வெளிப்படுத்தல்
  rationale: எபிரெய வசனம் நகரங்களைக் கொடுக்க வேண்டியவரை இந்தக் கூற்றில் வெளிப்படையாகக் குறிப்பிடவில்லை. சூழலிலிருந்து ஊகிக்கக்கூடிய எழுவாயை மொழிபெயர்ப்பில் சேர்க்காமல் மூலத்தின் இலக்கணத் திறந்தநிலையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘குடியிருப்பதற்கு’ என்பது புரிதலுக்கு எளிதாகவும், வேதாகமச் சூழலுக்கு ஏற்ற மிதமான முறைமை கொண்டதாகவும் உள்ளது. ஆங்கில ஆலோசனை உரையில் தவறான இடங்களில் இருந்த அடிக்குறிப்புக் குறிகள், அவை விளக்கும் ‘மோசேயின் மூலம்’ மற்றும் ‘மேய்ச்சல் நிலங்கள்’ ஆகிய சொற்றொடர்களுக்குப் பின் சரியாக வைக்கப்பட்டுள்ளன.
