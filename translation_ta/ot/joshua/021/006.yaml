  text: וְ/לִ/בְנֵ֣י גֵרְשׁ֗וֹן מִ/מִּשְׁפְּח֣וֹת מַטֵּֽה יִשָּׂשכָ֣ר וּ/מִ/מַּטֵּֽה אָ֠שֵׁר וּ/מִ/מַּטֵּ֨ה נַפְתָּלִ֜י וּ֠/מֵ/חֲצִי מַטֵּ֨ה מְנַשֶּׁ֤ה בַ/בָּשָׁן֙ בַּ/גּוֹרָ֔ל עָרִ֖ים שְׁלֹ֥שׁ עֶשְׂרֵֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/006.yaml
  text: And to the sons of Gershon[a], from the families of the tribe of Issachar, and from the tribe of Asher, and from the tribe of Naphtali, and from the half-tribe of Manasseh in Bashan, by lot, thirteen cities.
translation:
  language: ta
  text: கெர்சோனின் மக்களுக்கு, இசக்கார் கோத்திரத்தின் குடும்பங்களிலிருந்தும்[a], ஆசேர் கோத்திரத்திலிருந்தும், நப்தலி கோத்திரத்திலிருந்தும், பாசானிலிருந்த மனாசேயின் அரைக் கோத்திரத்திலிருந்தும், குலுக்கல் முறையில் பதின்மூன்று நகரங்கள் கிடைத்தன.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘இசக்கார் கோத்திரத்தின் குலங்களிலிருந்தும்’ என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் விரிந்த குடும்பக் குழுக்களையோ குலங்களையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/לִ/בְנֵי גֵרְשׁוֹן
  choice: கெர்சோனின் மக்களுக்கு
  rationale: லேவிய வம்சக் குழுவைக் குறிக்கும் எபிரெயச் சொற்றொடரின் வடிவை இயல்பான தமிழில் காக்கிறது; தொடர்ச்சியைக் காட்டும் וְ தமிழில் தனியே மொழிபெயர்க்கப்படாமல் வாக்கிய ஓட்டத்தில் உணர்த்தப்படுகிறது.
- source_word: מִ/מִּשְׁפְּחֹת
  choice: குடும்பங்களிலிருந்தும்
  rationale: מִשְׁפָּחוֹת என்பது விரிந்த குடும்பக் குழுக்களையோ குலங்களையோ குறிக்கலாம். முதன்மை உரையில் பொதுவாகப் புரியும் ‘குடும்பங்கள்’ வைக்கப்பட்டு, மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: מַטֵּה
  choice: கோத்திரம்
  rationale: நிலப் பங்கீட்டுச் சூழலில் tribal unit என்பதே தெளிவான பொருள்; தமிழில் நிலைபெற்ற வேதாகமச் சொல்லான ‘கோத்திரம்’ இதைத் துல்லியமாகக் குறிக்கிறது.
- source_word: יִשָּׂשכָר / אָשֵׁר / נַפְתָּלִי / מְנַשֶּׁה
  choice: இசக்கார் / ஆசேர் / நப்தலி / மனாசே
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் பரவலாக அறியப்படும் பெயர் வடிவங்கள் தேர்ந்தெடுக்கப்பட்டன.
- source_word: מֵ/חֲצִי מַטֵּה מְנַשֶּׁה
  choice: மனாசேயின் அரைக் கோத்திரத்திலிருந்தும்
  rationale: חֲצִי מַטֵּה என்ற நிர்வாக-பிராந்தியப் பிரிவைச் சுருக்கமாகவும் தெளிவாகவும் வெளிப்படுத்துகிறது.
- source_word: בַ/בָּשָׁן
  choice: பாசானிலிருந்த
  rationale: பாசான் என்பது பிராந்தியப் பெயர்; தமிழில் இடத்தைக் குறிக்கும் இயல்பான இணைப்பாக மொழிபெயர்க்கப்பட்டது.
- source_word: בַּ/גּוֹרָל
  choice: குலுக்கல் முறையில்
  rationale: பங்கீடு சீட்டுக் குலுக்கலால் தீர்மானிக்கப்பட்ட விதத்தை நவீன வாசகருக்குத் தெளிவாகக் காட்டுகிறது; வெறும் ‘குலுக்கலால்’ என்பதைக் காட்டிலும் நிர்வாகச் செயலை இயல்பாக உணர்த்துகிறது.
- source_word: עָרִים שְׁלֹשׁ עֶשְׂרֵה
  choice: பதின்மூன்று நகரங்கள்
  rationale: עָרִים என்பதற்கான வழக்கமான சூழல்சார் மொழிபெயர்ப்பு ‘நகரங்கள்’; எண்-பெயர்ச்சொல் அமைப்பு இயல்பான தமிழ்ச் சொல்லொழுங்கில் தரப்படுகிறது.
