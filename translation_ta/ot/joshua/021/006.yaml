  register: நவீன நிலையான தமிழில், பட்டியலின் மீளுரைப்பை முடிந்தவரை காத்து, வாசிக்க இயல்பான நிறைவு வினையுடன் அமைக்கப்பட்டது. எபிரெயில் வினை வெளிப்படையாக இல்லாவிட்டாலும் முந்தைய வசனத்திலிருந்து தொடரும் பங்கீட்டு கருத்தைத் தமிழில் நிறைவு செய்ய ‘கிடைத்தன’ சேர்க்கப்பட்டுள்ளது.
