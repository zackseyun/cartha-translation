  source_fidelity: மூல எபிரெயத்தின் பெறுநர் அமைப்பு, இசக்கார்/ஆசேர்/நப்தலி/பாசானிலுள்ள மனாசேயின் அரைக் கோத்திரம் என்ற பட்டியல், ‘சீட்டினால்/குலுக்கலால்’ என்ற பங்கீட்டு முறை, மற்றும் பதின்மூன்று நகரங்கள் என்ற எண்ணிக்கை அனைத்தும் துல்லியமாகக் காக்கப்பட்டுள்ளன. எபிரெயத்தில் வெளிப்படையாகச் சொல்லப்படாத, முந்தைய வசனத்தின் பங்கீட்டிலிருந்து தொடரும் வினைக் கருத்தை ‘கிடைத்தன’ என நிறைவு செய்திருப்பது பொருளை மாற்றவில்லை.
  naturalness: நவீன நிலையான தமிழில் வாசிக்க இயல்பாக உள்ளது. பட்டியலின் மீளுரைப்பும் தெளிவாக உள்ளது; ‘குலுக்கல் முறையில்’ என்பது בַּגּוֹרָל என்பதன் செயல்முறைப் பொருளைச் சரியாக வெளிப்படுத்துகிறது.
  terminology: ‘கோத்திரம்,’ ‘அரைக் கோத்திரம்,’ ‘நகரங்கள்’ ஆகியவை இச்சூழலுக்கேற்ற நிலையான சொற்கள். பெயர்வடிவங்கள் தமிழ் வேதாகமப் பயன்பாட்டுடன் ஒத்திருக்கின்றன. ‘குடும்பங்கள்’ என்பதற்கான ‘குலங்கள்’ மாற்றுப்பொருள் அடிக்குறிப்பில் உரிய முறையில் வழங்கப்பட்டுள்ளது.
