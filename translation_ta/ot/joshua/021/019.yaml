  text: All the cities of the sons of Aaron[a], the priests, were thirteen cities with their pasturelands.
translation:
  language: ta
  text: ஆசாரியர்களான ஆரோனின் மகன்களின் நகரங்கள் அனைத்தும் பதின்மூன்று நகரங்களும் அவற்றின் மேய்ச்சல் நிலங்களுமாக இருந்தன.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כָּל עָרֵי
  choice: நகரங்கள் அனைத்தும்
  rationale: நகரங்களின் முழு எண்ணிக்கையையும் சுருக்கமாகக் குறிப்பிடுகிறது; நவீன தமிழில் இயல்பான சொற்றொடர்.
- source_word: בְנֵי אַהֲרֹן
  choice: ஆரோனின் மகன்கள்
  rationale: எபிரேய குடும்பவழிச் சொல்லாட்சியைப் பேணுகிறது; இச்சூழலில் ஆசாரிய மரபைச் சுட்டுகிறது.
- source_word: הַכֹּהֲנִים
  choice: ஆசாரியர்களான
  rationale: ஆரோனின் மகன்களை விளக்கும் ஒட்டுநிலை அடையாளத்தை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: שְׁלֹשׁ עֶשְׂרֵה עָרִים
  choice: பதின்மூன்று நகரங்கள்
  rationale: எண்ணிக்கையையும் பெயர்ச்சொல்லையும் நேரடியாகவும் தெளிவாகவும் வழங்குகிறது.
- source_word: וּמִגְרְשֵׁיהֶן
  choice: அவற்றின் மேய்ச்சல் நிலங்களுடன் சேர்த்து
  rationale: லேவிய நகரங்களைச் சுற்றியிருந்த கால்நடை மேய்ச்சலுக்கான திறந்த நிலங்களைக் குறிக்கிறது; வாவ் இணைப்பைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
