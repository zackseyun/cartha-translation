base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/025.yaml
  text: 'And from the half-tribe of Manasseh: Taanach with its pasturelands[a], and Gath-rimmon with its pasturelands—two cities.'
translation:
  language: ta
  text: 'மனாசே கோத்திரத்தின் பாதியிலிருந்து: தானாக் நகரமும் அதன் மேய்ச்சல் நிலங்களும்[a], காத்-ரிம்மோன் நகரமும் அதன் மேய்ச்சல் நிலங்களும்—ஆக இரண்டு நகரங்கள்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சில எபிரெயக் கையெழுத்துப் பிரதிகளிலும் 1 நாளாகமம் 6:70-இல் உள்ள இணையான பட்டியலிலும், மனாசேயிடமிருந்து ஒதுக்கப்பட்ட நகரங்களின் பெயர்கள் வேறுபடுகின்றன.
    reason: textual_variant
lexical_decisions:
- source_word: וּ/מִֽ/מַּחֲצִית֙ מַטֵּ֣ה מְנַשֶּׁ֔ה
  choice: மனாசே கோத்திரத்தின் பாதிப் பகுதியிலிருந்து
  rationale: מִן உடன் வரும் מַחֲצִית, ஒதுக்கீடு எந்தப் பகுதியிலிருந்து வழங்கப்பட்டது என்பதைக் குறிக்கிறது; מַטֶּה இச்சூழலில் ‘கோத்திரம்’ எனப் பொருள்படும். இயல்பான நவீன தமிழுக்காக ‘கோத்திரத்தின் பாதிப் பகுதி’ என்று வழங்கப்பட்டது.
- source_word: תַּעְנַךְ
  choice: தானாக்
  rationale: எபிரெய இடப்பெயரின் தமிழாக்க ஒலிபெயர்ப்பு.
- source_word: מִגְרָשֶׁהָ
  choice: அதன் மேய்ச்சல் நிலங்கள்
  rationale: מִגְרָשׁ என்பது நகரைச் சேர்ந்த சுற்றுப்புறத் திறந்த நிலம் அல்லது கால்நடை மேய்ச்சலுக்குரிய நிலத்தைக் குறிக்கிறது; பெண்பால் ஒருமை பின்னொட்டு ஒவ்வொரு நகரத்தையும் சுட்டுகிறது.
- source_word: גַּת רִמּוֹן
  choice: காத்-ரிம்மோன்
  rationale: கூட்டு இடப்பெயரின் எபிரெய ஒலியமைப்பைத் தெளிவாகக் காட்டும் தமிழ் ஒலிபெயர்ப்பு.
- source_word: עָרִים שְׁתָּיִם
  choice: ஆக இரண்டு நகரங்கள்
  rationale: பட்டியலிடப்பட்ட குடியிருப்புகளின் மொத்த எண்ணிக்கையைச் சுருக்கிக் கூறுகிறது; עָרִים என்பதற்கு இவ்வகை நிலப்பங்கீட்டுப் பட்டியலில் ‘நகரங்கள்’ பொருத்தமானது.
