  register: நவீனத் தரத் தமிழில், நிலப்பங்கீட்டுப் பட்டியலுக்கேற்ற கண்ணியமான மற்றும் தெளிவான நடை பயன்படுத்தப்பட்டது. எபிரெய வசனத்தின் மீள்வடிவமும் இறுதி எண்ணிக்கைச் சுருக்கமும் இயன்றவரை பாதுகாக்கப்பட்டன.
