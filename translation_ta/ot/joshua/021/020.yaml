source:
  edition: WLC
  text: וּ/לְ/מִשְׁפְּח֤וֹת בְּנֵֽי קְהָת֙ הַ/לְוִיִּ֔ם הַ/נּוֹתָרִ֖ים מִ/בְּנֵ֣י קְהָ֑ת וַֽ/יְהִי֙ עָרֵ֣י גֽוֹרָלָ֔/ם מִ/מַּטֵּ֖ה אֶפְרָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/020.yaml
  text: And for the families of the sons of Kohath[a], the Levites who remained from the sons of Kohath, the cities of their lot were from the tribe of Ephraim.
translation:
  language: ta
  text: கோகாத்தின் மகன்களின் குடும்பங்களாகிய, கோகாத்தின் மக்களில் மீதியிருந்த லேவியர்களுக்கு, அவர்களுடைய சீட்டின் நகரங்கள்[a] எப்பிராயீம் கோத்திரத்திலிருந்து இருந்தன.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அதாவது, சீட்டுப்போட்டு அவர்களுக்கு ஒதுக்கப்பட்ட நகரங்கள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמִשְׁפְּחוֹת בְּנֵי קְהָת
  choice: கோகாத்தின் மகன்களுடைய குடும்பங்களைச் சேர்ந்த ... அவர்களுக்கு
  rationale: לְ இங்குப் பகிர்ந்தளிப்பைப் பெறும் குடும்பங்களைக் குறிக்கிறது. தமிழ் வாக்கியத்தில் அந்த உறவை இயல்பாகவும் தெளிவாகவும் காட்ட ‘குடும்பங்களைச் சேர்ந்த ... அவர்களுக்கு’ என வழங்கப்பட்டுள்ளது.
- source_word: הַלְוִיִּם הַנּוֹתָרִים מִבְּנֵי קְהָת
  choice: லேவியர்களுக்கு—அதாவது, கோகாத்தின் மக்களில் மீதியிருந்தவர்களுக்கு—
  rationale: הַנּוֹתָרִים என்பது முந்தைய பகிர்ந்தளிப்புகளுக்குப் பின் மீதியிருந்தவர்களைக் குறிக்கிறது; מִן பகுதியைக் குறிக்கும் பொருளில் ‘மக்களில்’ என மொழிபெயர்க்கப்பட்டுள்ளது. எபிரெய உரையின் விளக்க ஒட்டுறவை கோடுகளால் தெளிவாக்குகிறது.
- source_word: עָרֵי גוֹרָלָם
  choice: சீட்டின்படி ஒதுக்கப்பட்ட நகரங்கள்
  rationale: גּוֹרָלָם என்பதன் சொற்பொருள் ‘அவர்களுடைய சீட்டு/பங்கு’; இச்சூழலில் சீட்டுப்போட்டுப் பகிர்ந்தளிக்கப்பட்ட நகரங்கள் என்பதே பொருள். நவீன தமிழில் இயல்பாகவும் செயல்முறையைத் தெளிவாகவும் தெரிவிக்க இவ்வாறு வழங்கப்பட்டுள்ளது.
- source_word: מִמַּטֵּה אֶפְרָיִם
  choice: எப்பிராயீம் கோத்திரத்திலிருந்து
  rationale: மַטֶּה இத்தகைய பட்டியல்களில் ‘கோத்திரம்’ என்று பொருள்படும்; מִן ஆதாரக் கோத்திரத்தைக் குறிக்கிறது.
- source_word: וַיְהִי
  choice: கிடைத்தன
  rationale: இந்தப் பகிர்ந்தளிப்பு வாய்பாட்டில் היה ஒரு நிகழ்வு/உடைமைத் தொடர்பைக் காட்டுகிறது. ‘கிடைத்தன’ என்பது நகரங்கள் அவர்களுக்கு ஒதுக்கப்பட்டதையும் அவை எப்பிராயீம் கோத்திரத்திலிருந்து வந்ததையும் இயல்பான தமிழில் இணைக்கிறது.
