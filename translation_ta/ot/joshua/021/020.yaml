translation_notes:
  register: நவீன நிலையான தமிழில், வேதாகம வரலாற்றுப் பட்டியலுக்கேற்ற கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. மூலத்தின் ஓரளவு மறுபடிக் கூறும் அமைப்பு ‘அதாவது’ என்ற விளக்க இணைப்பால் பாதுகாக்கப்பட்டுள்ளது; எந்தச் சமயப் பிரிவுக்குரிய தனிப்பட்ட விளக்கமும் சேர்க்கப்படவில்லை.
