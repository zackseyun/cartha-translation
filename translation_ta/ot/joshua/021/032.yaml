  text: וּ/מִ/מַּטֵּ֨ה נַפְתָּלִ֜י אֶת עִ֣יר מִקְלַ֣ט הָֽ/רֹצֵ֗חַ אֶת קֶ֨דֶשׁ בַּ/גָּלִ֤יל וְ/אֶת מִגְרָשֶׁ֨/הָ֙ וְ/אֶת חַמֹּ֥ת דֹּאר֙ וְ/אֶת מִגְרָשֶׁ֔/הָ וְ/אֶת קַרְתָּ֖ן וְ/אֶת מִגְרָשֶׁ֑/הָ עָרִ֖ים שָׁלֹֽשׁ־׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/032.yaml
  text: 'And from the tribe of Naphtali: Kedesh in Galilee[a], the city of refuge for the manslayer, with its pasturelands; Hammoth-dor with its pasturelands[b]; and Kartan with its pasturelands—three cities.'
translation:
  language: ta
  text: 'நப்தலி கோத்திரத்திலிருந்து: ஒருவரைக் கொன்றவருக்கான அடைக்கலப் பட்டணமாகிய கலிலேயாவிலுள்ள கேதேஸ்[a], அதன் மேய்ச்சல் நிலங்களோடு; அம்மோத்-தோர், அதன் மேய்ச்சல் நிலங்களோடு[b]; கர்த்தான், அதன் மேய்ச்சல் நிலங்களோடு—மூன்று பட்டணங்கள்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயச் சொல் ஒருவரைக் கொன்றவரைக் குறிக்கிறது; அடைக்கலப் பட்டணச் சட்டச் சூழலில் அது முன்திட்டமிட்ட கொலை செய்தவரை மட்டுமே குறிக்க வேண்டியதில்லை.
    reason: lexical_alternative
  - marker: b
    text: எபிரெய உரையில் இடப்பெயர் ‘அம்மோத்-தோர்’ என்று உள்ளது; சில மரபுகள் இதை ‘அம்மாத்’ என்னும் இடத்துடன் அடையாளப்படுத்துகின்றன.
    reason: alternative_reading
lexical_decisions:
- source_word: וּמִמַּטֵּה נַפְתָּלִי
  choice: நப்தலி கோத்திரத்திலிருந்து
  rationale: கோத்திரப் பங்கீட்டுச் சூழலில் מַטֶּה என்பது நேரடியான ‘கோல்’ அல்ல, ‘கோத்திரம்’ என்பதைக் குறிக்கிறது.
- source_word: עִיר מִקְלַט הָרֹצֵחַ
  choice: கொலை செய்தவருக்கான அடைக்கலப் பட்டணம்
  rationale: עִיר מִקְלַט என்பது சட்டச் சூழலிலான ‘அடைக்கலப் பட்டணம்.’ הָרֹצֵחַ கொலை செய்த ஒருவரைக் குறிக்கிறது; அது இங்கு முன்திட்டமிட்ட கொலைகாரன் என்ற குற்றநிலையை அவசியமாகத் தீர்மானிப்பதில்லை.
- source_word: קֶדֶשׁ בַּגָּלִיל
  choice: கலிலேயாவிலுள்ள கேதேஸ்
  rationale: கֶדֶשׁ என்ற இடப்பெயர் ஒலிபெயர்க்கப்படுகிறது; בַּגָּלִיל அதன் பகுதியை அடையாளப்படுத்துகிறது.
- source_word: מִגְרָשֶׁיהָ
  choice: அதன் மேய்ச்சல் நிலங்கள்
  rationale: מִגְרָשׁ என்பது பட்டணத்தைச் சேர்ந்த திறந்த வெளிநிலங்களை, குறிப்பாக கால்நடை மேய்ச்சலுக்கான நிலங்களை, குறிக்கிறது.
- source_word: חַמֹּת דֹּאר
  choice: அம்மோத்-தோர்
  rationale: மசோரா எபிரெய உரையிலுள்ள கூட்டிடப்பெயரின் வடிவத்தைத் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: קַרְתָּן
  choice: கர்த்தான்
  rationale: எபிரெய உரையிலுள்ள இடப்பெயர் நேரடியாகத் தமிழ் ஒலியமைப்புக்கு ஏற்ப ஒலிபெயர்க்கப்படுகிறது.
- source_word: עָרִים שָׁלֹשׁ
  choice: மொத்தம் மூன்று பட்டணங்கள்
  rationale: எபிரெயத்தின் இறுதிச் சுருக்கத்தை இயல்பான நவீன தமிழில் தெளிவாக வழங்குகிறது.
theological_decisions:
- issue: הָרֹצֵחַ என்பவரின் குற்றநிலை
  choice: கொலை செய்தவர்
  alternative: கொலைகாரன்
  rationale: அடைக்கலப் பட்டணச் சட்டச் சூழலில் இந்தச் சொல் ஒருவரின் உயிரைப் பறித்தவரைக் குறிக்கிறது; முன்திட்டமிட்ட கொலை என்ற தீர்ப்பைச் சொல் மட்டும் கட்டாயப்படுத்தாததால், அதிக குற்றச்சுமையுள்ள ‘கொலைகாரன்’ தவிர்க்கப்படுகிறது.
translation_notes:
  register: நவீன தரத் தமிழில், பட்டணப் பட்டியலுக்குரிய சுருக்கமானதும் கண்ணியமானதுமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘அடைக்கலப் பட்டணம்’ சட்டரீதியான நிலையான கருத்தைத் தெளிவாகத் தருகிறது; இடப்பெயர்கள் எபிரெய வடிவங்களுக்கு நெருக்கமாக ஒலிபெயர்க்கப்பட்டுள்ளன.
