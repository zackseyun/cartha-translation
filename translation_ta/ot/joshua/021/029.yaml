  text: אֶת יַרְמוּת֙ וְ/אֶת מִגְרָשֶׁ֔/הָ אֶת עֵ֥ין גַּנִּ֖ים וְ/אֶת מִגְרָשֶׁ֑/הָ עָרִ֖ים אַרְבַּֽע־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/029.yaml
  text: Jarmuth with its pasturelands[a], and En-gannim with its pasturelands—four cities.
translation:
  language: ta
  text: யர்மூத்தையும் அதன் மேய்ச்சல் நிலங்களையும், ஏன்-கன்னீமையும்[a] அதன் மேய்ச்சல் நிலங்களையும்—மொத்தம் நான்கு நகரங்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இந்த இடப்பெயரை “ஐன்-கன்னீம்” என்றும் ஒலிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַרְמוּת
  choice: யர்மூத்
  rationale: எபிரெய இடப்பெயர் அதன் மூல உச்சரிப்புக்கு நெருக்கமாகத் தமிழ் எழுத்துகளில் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: מִגְרָשֶׁהָ
  choice: அதன் மேய்ச்சல் நிலங்கள்
  rationale: நகரத்தைச் சுற்றி கால்நடைகளை மேய்க்கவும் பொதுப் பயன்பாட்டிற்கும் ஒதுக்கப்பட்ட திறந்த நிலத்தை இச்சூழலில் குறிக்கிறது; பெண்பால் ஒருமை உடைமைப் பின்னொட்டு ஒவ்வொரு நகரத்தையும் சுட்டுவதால் ‘அதன்’ என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: עֵין גַּנִּים
  choice: ஏன்-கன்னீம்
  rationale: ‘தோட்டங்களின் ஊற்று’ எனப் பொருள்படும் கூறுகள் இருந்தாலும், இது ஓர் இடப்பெயர் என்பதால் மொழிபெயர்க்காமல் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: עָרִים אַרְבַּע
  choice: மொத்தம் நான்கு நகரங்கள்
  rationale: நகரப் பட்டியலின் முடிவில் வரும் எண்ணிக்கைச் சுருக்கத்தை இயல்பான நவீன தமிழில் தெளிவாகக் காட்டுகிறது.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழில், பட்டியல் நடையின் சுருக்கத்தையும் எபிரெய மூலத்திலுள்ள வினையற்ற தொடரையும் காத்து, இயல்பான வாசிப்பிற்காக ‘மொத்தம்’ சேர்க்கப்பட்டுள்ளது. אֵת குறிக்கும் செயப்படுபொருள் அமைப்பு ‘-ஐயும்’ மூலம் தொடரப்பட்டுள்ளது.
