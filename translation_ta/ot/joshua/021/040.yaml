translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகருக்கு எளிதாகவும் வேதாகமப் பங்கீட்டுப் பட்டியலுக்கேற்ற கண்ணியமான நடையிலும் வடிவமைக்கப்பட்டது. எபிரெயச் சொற்றொடரின் appositional அமைப்பு தமிழில் இயல்பாகத் தோன்ற ‘மெராரியின் மகன்களாகிய’ என்று இணைக்கப்பட்டது; குலுக்கலும் அதனால் கிடைத்த பங்கும் தனித்தனியாகத் தெளிவுபடுத்தப்பட்டன.
