base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/040.yaml
  text: All the cities for the sons of Merari[b][a], by their families—the remaining ones from the families of the Levites—were twelve cities by lot.
translation:
  language: ta
  text: லேவியரின் குடும்பங்களிலிருந்து எஞ்சியிருந்த மெராரியின் மகன்களுக்கு, அவர்களுடைய குடும்பங்களின்படி, குலுக்கல் மூலம் கிடைத்த நகரங்கள் அனைத்தும் பன்னிரண்டு.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כָּל הֶעָרִים
  choice: நகரங்கள் அனைத்தும்
  rationale: עִיר என்பது நகரம் அல்லது ஊர் எனப் பொருள்படலாம். இங்கு கோத்திரப் பங்கீட்டுப் பட்டியலில் பெயரிடப்பட்ட குடியிருப்புகளைக் குறிப்பதால், தொடர்ச்சிக்கும் தெளிவுக்கும் ‘நகரங்கள்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: לִבְנֵי מְרָרִי
  choice: மெராரியின் மகன்கள்
  rationale: בְּנֵי என்பதன் நேர்ப்பொருள் ‘மகன்கள்’; வம்சாவளிச் சூழலில் அது ‘சந்ததியினர்’ என்றும் பொருள்படும். மூலமொழியின் வடிவத்தைத் தக்கவைக்க ‘மகன்கள்’ பயன்படுத்தப்பட்டு, இயல்பான மாற்றுகள் அடிக்குறிப்பில் தரப்பட்டன.
- source_word: לְמִשְׁפְּחֹתָם
  choice: அவர்களுடைய குடும்பங்களின்படி
  rationale: מִשְׁפָּחָה என்பது குடும்பம் அல்லது குலம் எனப் பொருள்படும். குடும்பப் பிரிவுகளுக்கு ஏற்ப செய்யப்பட்ட பங்கீட்டைத் தெளிவாகக் காட்ட ‘குடும்பங்களின்படி’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: הַנּוֹתָרִים מִמִּשְׁפְּחוֹת הַלְוִיִּם
  choice: லேவியக் குடும்பங்களில் எஞ்சியிருந்தவர்கள்
  rationale: הַנּוֹתָרִים என்பது எஞ்சியிருந்தவர்களைக் குறிக்கும் பெயரெச்சப் பயன்பாடு. முந்தைய பங்கீடுகளுக்குப் பின் குறிப்பிடப்படும் மெராரியக் குடும்பங்களைக் குறிக்கும் வகையில், சொற்றொடரின் உறவைத் தெளிவாகவும் மூலத்துக்கு நெருக்கமாகவும் வழங்குகிறது.
- source_word: וַיְהִי גּוֹרָלָם
  choice: இதுவே குலுக்கல் மூலம் அவர்களுக்குக் கிடைத்த பங்கு
  rationale: גּוֹרָל என்பது குலுக்கல் அல்லது அதன்மூலம் கிடைக்கும் பங்கு ஆகிய இரண்டையும் குறிக்கலாம். தமிழ் வாசகருக்கு பங்கீட்டு முறையும் கிடைத்த பங்கும் தெளிவாகத் தெரிய இவ்வாறு வழங்கப்பட்டது.
- source_word: עָרִים שְׁתֵּים עֶשְׂרֵה
  choice: பன்னிரண்டு நகரங்கள்
  rationale: தமிழின் இயல்பான எண்ணுச் சொல் வரிசைப்படி வழங்கப்பட்டது; எண்ணிக்கையும் குடியிருப்பு வகையும் முழுமையாகப் பாதுகாக்கப்பட்டன.
