base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/004.yaml
  text: Then the lot came out for the families of the Kohathites[a], and for the sons of Aaron the priest, from among the Levites, there fell by lot thirteen cities from the tribe of Judah, from the tribe of Simeon, and from the tribe of Benjamin.
translation:
  language: ta
  text: கோகாத்தியரின் குடும்பங்களுக்குச் சீட்டு விழுந்தது. லேவியர்களில் ஆசாரியனாகிய ஆரோனின் மக்களுக்கு, யூதா கோத்திரத்திலிருந்தும் சிமியோன் கோத்திரத்திலிருந்தும் பென்யமீன் கோத்திரத்திலிருந்தும் சீட்டின்படி பதின்மூன்று பட்டணங்கள் கிடைத்தன.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּצֵא הַגּוֹרָל
  choice: சீட்டு விழுந்தது
  rationale: எபிரெயச் சொற்றொடர் சொல்லர்த்தமாக ‘சீட்டு வெளியே வந்தது’ என இருந்தாலும், ஒதுக்கீட்டுச் சூழலில் ‘சீட்டு விழுந்தது’ என்பது இயல்பான நவீனத் தமிழ் மரபுத்தொடர்.
- source_word: לְמִשְׁפְּחֹת הַקְּהָתִי
  choice: கோகாத்தியரின் குடும்பங்களுக்கு
  rationale: מִשְׁפְּחֹת என்பது குடும்ப அல்லது குலப் பிரிவுகளைக் குறிக்கிறது; இங்கு ‘குடும்பங்கள்’ தெளிவாகவும் பொதுவாகப் புரியக்கூடியதாகவும் உள்ளது. הַקְּהָתִי கோகாத்தின் வழிவந்த குழுவைக் குறிக்கிறது.
- source_word: וַיְהִי לִבְנֵי אַהֲרֹן הַכֹּהֵן
  choice: ஆசாரியனாகிய ஆரோனின் மக்களுக்கு ... கிடைத்தன
  rationale: எபிரெய வாக்கியம் சுருக்கமான ஒதுக்கீட்டு அமைப்பைக் கொண்டது. தமிழில் முழுமையான இயல்பான வாக்கியமாக்க ‘கிடைத்தன’ பயன்படுத்தப்பட்டது; ‘மக்கள்’ என்பதற்குப் பதில் உறவுமுறையைக் காக்க ‘மக்கள்/மகன்கள்’ என்ற சாத்தியங்களில் ‘மக்கள்’ அல்ல, ‘மக்களுக்கு’ (sons) எனப் பொருள் தெளிவாக வைக்கப்பட்டது.
- source_word: מִן הַלְוִיִּם
  choice: லேவியர்களில்
  rationale: ஆரோனின் மக்களை லேவியர்களுக்குள் அடங்கிய ஒரு பிரிவாகக் காட்டும் பகுதியுறவைச் சுருக்கமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: מִמַּטֵּה יְהוּדָה וּמִמַּטֵּה הַשִּׁמְעֹנִי וּמִמַּטֵּה בִנְיָמִן
  choice: யூதா கோத்திரத்திலிருந்தும் சிமியோன் கோத்திரத்திலிருந்தும் பென்யமீன் கோத்திரத்திலிருந்தும்
  rationale: מַטֶּה இங்கு கோத்திரத்தைக் குறிக்கிறது. மூலத்தின் மீளுரைப்பையும் ஒவ்வொரு கோத்திரத்திலிருந்தும் நகரங்கள் ஒதுக்கப்பட்டதையும் தமிழ் வடிவம் காக்கிறது.
- source_word: בַּגּוֹרָל
  choice: சீட்டின்படி
  rationale: ஒதுக்கீடு சீட்டுப் போடுவதன் முடிவின்படி நடைபெற்றது என்பதை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: עָרִים שְׁלֹשׁ עֶשְׂרֵה
  choice: பதின்மூன்று பட்டணங்கள்
  rationale: עָרִים குடியிருப்பு நகரங்கள் அல்லது பட்டணங்களைக் குறிக்கலாம்; பழங்கால நிலப்பங்கீட்டுச் சூழலில் ‘பட்டணங்கள்’ இயல்பாகவும் அளவை மிகைப்படுத்தாமலும் உள்ளது.
