  register: நவீன நிலையான தமிழில், வேதாகம வரலாற்றுரைக்கு ஏற்ற கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. எபிரெய வாக்கியத்தின் மீளுரைப்பும் ஒதுக்கீட்டு வரிசையும் காக்கப்பட்டுள்ளன; தமிழில் இயல்பற்ற ‘சீட்டு வெளியே வந்தது’ என்பதற்குப் பதில் வழக்கமான ‘சீட்டு விழுந்தது’ பயன்படுத்தப்பட்டுள்ளது.
