- from: யெகோவா இஸ்ரவேல் வீட்டாரிடம் சொன்ன நல்வார்த்தைகள் அனைத்திலும் ஒன்றுகூடத் தவறவில்லை[a]; எல்லாமே நிறைவேறின.
  to: யாவே இஸ்ரவேல் வீட்டாரிடம் சொன்ன எல்லா நல்ல வார்த்தைகளிலும் ஒரு வார்த்தைகூடத் தவறிப்போகவில்லை[a]; அனைத்தும் நிறைவேறின.
  rationale: The revision explicitly supplies the singular ‘word’ required by the Hebrew idiom, retains the totalizing force of ‘all,’ and preserves the contextual-but-interpretive ‘promise’ rendering in an anchored footnote. It also conforms the divine-name rendering to the POB audit trail.
