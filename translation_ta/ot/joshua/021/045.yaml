source:
  edition: WLC
  text: לֹֽא נָפַ֣ל דָּבָ֔ר מִ/כֹּל֙ הַ/דָּבָ֣ר הַ/טּ֔וֹב אֲשֶׁר דִּבֶּ֥ר יְהוָ֖ה אֶל בֵּ֣ית יִשְׂרָאֵ֑ל הַ/כֹּ֖ל בָּֽא־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/045.yaml
  text: Not one word failed from all the good word that Yahweh had spoken to the house of Israel[a]; all of it came to pass.
translation:
  language: ta
  text: யாவே இஸ்ரவேல் வீட்டாரிடம் சொன்ன எல்லா நல்ல வார்த்தைகளிலும் ஒரு வார்த்தைகூடத் தவறிப்போகவில்லை[a]; அனைத்தும் நிறைவேறின.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யாவே இஸ்ரவேல் வீட்டாரிடம் சொன்ன எல்லா நல்ல வாக்குறுதிகளிலும் ஒரு வாக்குறுதியும் பொய்க்கவில்லை.”
    reason: דָּבָר என்பதற்கு இச்சூழலில் ‘வாக்குறுதி’ என்றும், נָפַל என்பதற்கு ‘பொய்த்துப்போதல்’ என்றும் பொருள் கொள்ளலாம்; முதன்மைப் பாடம் דָּבָר / דִּבֶּר இடையிலான ‘வார்த்தை / சொன்னார்’ தொடர்பைக் காக்கிறது.
lexical_decisions:
- source_word: לֹא נָפַל דָּבָר
  choice: ஒன்றுகூடத் தவறவில்லை
  rationale: நָפַל என்பதன் நேரடிப் பொருள் ‘விழுந்தது’ என்றாலும், דָּבָר உடனான இச்சூழலில் சொல்லப்பட்டது பலிக்காமல் போகவில்லை என்பதே பொருள். இயல்பான தமிழில் ‘ஒன்றுகூடத் தவறவில்லை’ அதைத் தெளிவாகக் கூறுகிறது.
- source_word: מִכֹּל הַדָּבָר הַטּוֹב
  choice: நல்வார்த்தைகள் அனைத்திலும்
  rationale: எபிரெயச் சொற்றொடர் ஒருமைத் தொகுப்பாக இருந்தாலும், தமிழில் இறைவன் சொன்ன நன்மையான வார்த்தைகளின் முழுத்தொகுதியைக் குறிக்கப் பன்மை இயல்பாக உள்ளது. ‘வாக்குறுதிகள்’ என்பது பொருத்தமான விளக்கப் பொருள்; ஆனால் மூலத்தின் דָּבָר / דִּבֶּר சொல்–சொன்னார் தொடர்பைக் காக்க ‘வார்த்தைகள்’ முதன்மைப் பாடத்தில் வைக்கப்படுகிறது.
- source_word: אֲשֶׁר דִּבֶּר
  choice: சொன்ன
  rationale: முன்னர் உரைக்கப்பட்ட இறைச்சொல்லைக் குறிக்கும் இயல்பான, நேரடியான தமிழ் வடிவம்.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: திருநாமத்தை ஒரு பட்டப்பெயராக மாற்றாமல் தமிழில் பரவலாக அறியப்பட்ட பெயர்வடிவில் தருகிறது.
- source_word: אֶל בֵּית יִשְׂרָאֵל
  choice: இஸ்ரவேல் வீட்டாரிடம்
  rationale: ‘இஸ்ரவேலின் வீடு’ என்ற மூல உருவகத்தின் கூட்டுக் குடும்ப/மக்கள் பொருளை இயல்பான தமிழில் ‘இஸ்ரவேல் வீட்டார்’ எனக் காக்கிறது.
- source_word: הַכֹּל בָּא
  choice: எல்லாமே நிறைவேறின
  rationale: בָּא என்பதன் நேரடிப் பொருள் ‘வந்தது’; இங்கு சொன்னவை நிகழ்ந்தன அல்லது நிறைவேறின என்ற மரபுத்தொடர்ப் பொருள். ‘நிறைவேறின’ தெளிவான நவீனத் தமிழ்.
theological_decisions:
- issue: יְהוָה என்ற திருநாமத்தின் மொழிபெயர்ப்பு
  choice: யெகோவா
  alternative: யாவே
  rationale: மூலத்தில் உள்ள தனிப்பட்ட இறைநாமத்தை ‘ஆண்டவர்’ போன்ற பட்டப்பெயரால் மாற்றாமல் ஒலிபெயர்க்கிறது. தமிழில் நிலைபெற்ற ‘யெகோவா’ வடிவம் தேர்ந்தெடுக்கப்பட்டது; ‘யாவே’ என்பது மாற்று ஒலிபெயர்ப்பு.
- issue: דָּבָר என்பதை ‘வார்த்தை’ அல்லது ‘வாக்குறுதி’ என மொழிபெயர்த்தல்
  choice: வார்த்தை
  alternative: வாக்குறுதி
  rationale: דָּבָר மற்றும் דִּבֶּר இடையிலான ‘வார்த்தை/சொன்ன’ தொடர்பைக் காக்கிறது; இங்கு வாக்குறுதிகளே கருத்து என்பது சரியான சூழல்சார் விளக்கம் என்பதால் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. ‘இஸ்ரவேல் வீட்டார்’ மூலத்தின் கூட்டுச் சமூகச் சொல்லாட்சியை இயல்பாகக் காக்கிறது; ‘எல்லாமே’ இறுதி வலியுறுத்தலை வெளிப்படுத்துகிறது.
