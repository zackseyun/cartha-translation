translation_notes:
  register: நவீனத் தரத் தமிழில், பட்டியல் நடையைத் தெளிவாகவும் கண்ணியமாகவும் வைத்துள்ளது. ‘அதைச் சுற்றியுள்ள மேய்ச்சல் நிலங்கள்’ என்பது மூலச்சொல்லின் இடவியல் மற்றும் பயன்பாட்டு நுணுக்கங்களை இயல்பாக வெளிப்படுத்துகிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
