  text: 'And from the tribe of Dan: Eltekeh with its pasturelands[a], and Gibbethon with its pasturelands.'
translation:
  language: ta
  text: 'தாண் கோத்திரத்திலிருந்து: எல்தெக்கேயும் அதன் சுற்றுப்புற மேய்ச்சல் நிலங்களும்[a], கிபெத்தோனும் அதன் சுற்றுப்புற மேய்ச்சல் நிலங்களும்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அதன் சுற்றுப்புறத் திறந்த நிலங்களும்” / “அதன் பொதுநிலங்களும்.” எபிரெயச் சொல் நகரத்தைச் சுற்றியிருந்த திறந்த நிலத்தைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/מִ/מַּטֵּה דָן
  choice: தாண் கோத்திரத்திலிருந்து
  rationale: கோத்திரப் பங்கீட்டுச் சூழலில் מַטֶּה என்பது ‘கோத்திரம்’ என்பதைக் குறிக்கிறது; முன்னொட்டுகளின் இணைப்பு இயல்பாக ‘-இலிருந்து’ என மொழிபெயர்க்கப்படுகிறது.
- source_word: אֶת / וְ/אֶת
  choice: வேற்றுமை உருபாலும் ‘-உம்’ இணைப்பாலும் வெளிப்படுத்தப்பட்டது
  rationale: எபிரெய நேரடி செயப்படுபொருள் குறிக்கு தனியான தமிழ் சொல் தேவையில்லை; பட்டியலின் இணைப்பை ‘-உம்’ இயல்பாகக் காட்டுகிறது.
- source_word: אֶלְתְּקֵא
  choice: எல்தெக்கே
  rationale: எபிரெய இடப்பெயரின் ஒலிப்பைத் தமிழில் அண்மையாக எழுத்துப்பெயர்த்த வடிவம்.
- source_word: מִגְרָשֶׁהָ
  choice: அதைச் சுற்றியுள்ள மேய்ச்சல் நிலங்கள்
  rationale: מִגְרָשׁ என்பது நகரத்தைச் சுற்றி கால்நடை மேய்ச்சல் அல்லது பொதுப் பயன்பாட்டுக்காக இருந்த திறந்த நிலத்தைக் குறிக்கிறது; பெண்பால் ஒருமை பின்னொட்டு அந்த நகரத்தைக் குறிக்கும் ‘அதை’ என வழங்கப்பட்டது.
- source_word: גִּבְּתוֹן
  choice: கிபெத்தோன்
  rationale: எபிரெய இடப்பெயரின் ஒலிப்பைத் தமிழில் அண்மையாக எழுத்துப்பெயர்த்த வடிவம்.
