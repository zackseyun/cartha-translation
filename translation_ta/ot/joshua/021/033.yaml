  text: All the cities of the Gershonites by their families were thirteen cities[a], with their pasturelands.
translation:
  language: ta
  text: கெர்சோனியரின் குடும்பங்களுக்குரிய எல்லா நகரங்களும் அவற்றின் மேய்ச்சல் நிலங்களுமாகப் பதின்மூன்று நகரங்கள் இருந்தன.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כָּל עָרֵי
  choice: நகரங்கள்... மொத்தம்
  rationale: எபிரெய மொழியின் மொத்த எண்ணிக்கையைக் குறிக்கும் கூறை இயல்பான நவீன தமிழில் வாக்கிய முடிவிலுள்ள ‘மொத்தம்’ என்பதன் மூலம் வெளிப்படுத்துகிறது.
- source_word: הַגֵּרְשֻׁנִּי
  choice: கெர்சோனியர்களுக்கு
  rationale: ஒருமை வடிவிலுள்ள இனக்குழுப் பெயர் இங்கு கெர்சோனின் சந்ததியாரை கூட்டாகக் குறிக்கிறது; ஒதுக்கீட்டுச் சூழலுக்கேற்ப தமிழில் பன்மையும் நான்காம் வேற்றுமையும் பயன்படுத்தப்பட்டுள்ளன.
- source_word: לְמִשְׁפְּחֹתָם
  choice: அவர்களுடைய குடும்பங்களின்படி
  rationale: לְ இங்கு குடும்பப் பிரிவுகளின் அடிப்படையிலான வகைப்படுத்தல் அல்லது பகிர்வைக் குறிக்கிறது; ‘குடும்பங்களின்படி’ அந்தப் பொருளைத் தெளிவாகக் காக்கிறது.
- source_word: שְׁלֹשׁ עֶשְׂרֵה עִיר
  choice: பதின்மூன்று
  rationale: ‘நகரங்கள்’ ஏற்கெனவே வாக்கியத்தில் வந்திருப்பதால், தமிழில் இயல்பான எண்ணிக்கை அமைப்பாக ‘மொத்தம் பதின்மூன்று’ என வழங்கப்பட்டுள்ளது.
- source_word: וּמִגְרְשֵׁיהֶן
  choice: அவற்றின் மேய்ச்சல் நிலங்களுடன் சேர்த்து
  rationale: מִגְרָשׁ நகரங்களைச் சூழ்ந்த கால்நடை மேய்ச்சலுக்கான திறந்த நிலங்களைக் குறிக்கிறது. இணைப்பைத் தமிழில் இயல்பாகக் காட்ட ‘உடன் சேர்த்து’ பயன்படுத்தப்பட்டுள்ளது.
