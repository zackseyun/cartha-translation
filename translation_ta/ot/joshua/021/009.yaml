  text: 'From the tribe of the sons of Judah and from the tribe of the sons of Simeon they gave these cities[a], which are called by name:'
translation:
  language: ta
  text: யூதா மக்களின் கோத்திரத்திலிருந்தும் சிமியோன் மக்களின் கோத்திரத்திலிருந்தும், பெயரால் குறிப்பிடப்படும் இந்தப் பட்டணங்களைக் கொடுத்தார்கள்:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பெயரால் அழைக்கப்படும்” அல்லது “பெயர்கள் குறிப்பிடப்படும்.” அடுத்துவரும் பட்டியலில் ஒவ்வொரு பட்டணமும் தனித்தனியாகப் பெயரிடப்படுவதை எபிரேயத் தொடர் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְּנוּ
  choice: கொடுத்தார்கள்
  rationale: נתן என்பதன் நேரடிப் பொருளான ‘கொடு’ என்பதைக் காக்கிறது; இச்சூழலில் இது லேவியருக்குப் பட்டணங்களை ஒதுக்கிக் கொடுத்ததைக் குறிக்கிறது.
- source_word: מִמַּטֵּה
  choice: கோத்திரத்திலிருந்தும்
  rationale: מַטֶּה என்பதற்கு நேரடியாக ‘கோல்’ என்றும் பொருள் உண்டு; ஆனால் நிலப் பங்கீட்டுச் சூழலில் அது ‘கோத்திரம்’ என்பதைக் குறிக்கிறது.
- source_word: בְּנֵי יְהוּדָה
  choice: யூதாவின் சந்ததியார்
  rationale: בְּנֵי என்ற உறவுமுறைச் சொல்லை இயல்பான நவீன தமிழில் ‘சந்ததியார்’ என்று வழங்கி, கோத்திரத்தின் வழிவந்த மக்களைக் குறிக்கும் பொருளைக் காக்கிறது.
- source_word: וּמִמַּטֵּה בְּנֵי שִׁמְעוֹן
  choice: சிமியோனின் சந்ததியார் கோத்திரத்திலிருந்தும்
  rationale: முந்தைய தொடரின் இணை அமைப்பைக் காத்து, சிமியோனின் வழிவந்த கோத்திரத்தைக் தெளிவாகக் குறிக்கிறது.
- source_word: אֵת הֶעָרִים הָאֵלֶּה
  choice: இந்தப் பட்டணங்களை
  rationale: குறிப்பிட்டுப் பின்வரும் பட்டியலில் இடம்பெறும் குடியிருப்புகளைக் குறிக்கும் நேரடியான மொழிபெயர்ப்பு.
- source_word: אֲשֶׁר יִקְרָא אֶתְהֶן בְּשֵׁם
  choice: கீழே பெயரிட்டுச் சொல்லப்படும்
  rationale: எபிரேய மரபுத்தொடர் அடுத்துவரும் பட்டியலில் ஒவ்வொரு பட்டணமும் பெயரால் குறிப்பிடப்படுவதை உணர்த்துகிறது; தமிழில் இயல்பாகவும் பட்டியலுக்கான முன்னுரையாகவும் இதை வழங்குகிறது.
