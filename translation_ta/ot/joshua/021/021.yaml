  text: They gave them Shechem with its pasturelands in the hill country of Ephraim[a], the city of refuge for the manslayer[b], and Gezer with its pasturelands.
translation:
  language: ta
  text: அவர்கள் அவர்களுக்காக எப்பிராயீமின் மலைநாட்டில் உள்ள, கொலை செய்தவர் அடைக்கலம் புகும் நகரமான சீகேமையும் அதன் மேய்ச்சல் நிலங்களையும், கேசேரையும் அதன் மேய்ச்சல் நிலங்களையும் கொடுத்தார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: நேரடியாக, “கொலை செய்தவருக்கான அடைக்கல நகரம்.” இங்குள்ள எபிரெய சட்டச்சொல், ஒருவரின் மரணத்துக்குக் காரணமாகி, தீர்ப்பு வழங்கப்படும்வரை அடைக்கலம் நாடக்கூடிய நபரைக் குறிக்கிறது; திட்டமிட்ட கொலைக்காகக் குற்றவாளி எனத் தீர்க்கப்பட்ட ஒருவரை அவசியமாகக் குறிக்காது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְּנוּ לָהֶם
  choice: அவர்கள் ... அவர்களுக்குக் கொடுத்தார்கள்
  rationale: נתן என்பதன் தொடர்நிகழ்வு இறந்தகால வடிவம்; தமிழில் இயல்பான கதைநடை இறந்தகாலமாக மொழிபெயர்க்கப்பட்டது. לָהֶם சூழலில் லேவியர்களைக் குறிக்கும் மறைமுகச் செயப்படுபொருள்.
- source_word: עִיר מִקְלַט הָרֹצֵחַ
  choice: கொலை செய்தவன் அடைக்கலம் புகுவதற்கான நகரம்
  rationale: எபிரெய சட்டச் சூழலில் மரணத்தை ஏற்படுத்திய ஒருவர் தீர்ப்புக்கு முன் அடைக்கலம் நாடக்கூடிய நகரத்தை இது குறிக்கிறது; அவர் திட்டமிட்ட கொலைக்குக் குற்றவாளி என்று முன்கூட்டியே தீர்மானிக்காமல் இருக்க இவ்வாறு மொழிபெயர்க்கப்பட்டது.
- source_word: שְׁכֶם
  choice: சீகேம்
  rationale: எபிரெய இடப்பெயரின் தமிழில் வழக்கமான ஒலிபெயர்ப்பு.
- source_word: מִגְרָשֶׁיהָ
  choice: அதன் மேய்ச்சல் நிலங்கள்
  rationale: நகரைச் சுற்றி கால்நடை மேய்த்தல் உள்ளிட்ட பொதுப் பயன்பாட்டுக்கென ஒதுக்கப்பட்ட திறந்த நிலங்களைக் குறிக்கிறது.
- source_word: בְּהַר אֶפְרָיִם
  choice: எப்பிராயீமின் மலைநாட்டில்
  rationale: இங்கு הַר என்பது தனி மலையைக் காட்டிலும் எப்பிராயீம் கோத்திரப் பகுதியின் மலைப்பாங்கான நிலப்பரப்பைக் குறிக்கிறது.
- source_word: גֶּזֶר
  choice: கேசேர்
  rationale: எபிரெய இடப்பெயரின் தமிழ் ஒலிபெயர்ப்பு.
theological_decisions:
- issue: הָרֹצֵחַ என்பவரின் குற்றநிலை
  choice: கொலை செய்தவன்
  alternative: கொலைகாரன்
  rationale: இந்தச் சட்டப் பயன்பாடு ஒருவர் மரணத்தை ஏற்படுத்தியதைச் சொல்கிறது; திட்டமிட்ட கொலைக்கான குற்றத்தீர்ப்பை அவசியமாகக் குறிக்காது. ஆகவே குற்றவாளித்தன்மையை முன்கூட்டியே தீர்மானிக்கும் சொல்லைத் தவிர்க்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான பட்டியல் நடை பயன்படுத்தப்பட்டது. சீகேம் அடைக்கல நகரம் என்பதைத் தெளிவுபடுத்த இடைச்செருகல் கோடுகள் பயன்படுத்தப்பட்டன; மூலத்தின் சட்டரீதியான தெளிவின்மை பாதுகாக்கப்பட்டது.
