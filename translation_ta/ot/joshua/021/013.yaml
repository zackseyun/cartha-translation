base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/013.yaml
  text: And to the sons of Aaron the priest they gave Hebron[a], the city of refuge for the manslayer, with its pasturelands, and Libnah with its pasturelands.
translation:
  language: ta
  text: ஆசாரியனாகிய ஆரோனின் மகன்களுக்கு, ஒருவரைக் கொன்றவனுக்கான அடைக்கல நகரமான எப்ரோனையும்[a] அதன் மேய்ச்சல் நிலங்களையும், லிப்னாவையும் அதன் மேய்ச்சல் நிலங்களையும் கொடுத்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘கொலையாளிக்கான அடைக்கல நகரம்.’ இங்குள்ள எபிரெயச் சொல், ஒருவரின் மரணத்துக்குக் காரணமானவர் அடைக்கல நகரத்துக்குத் தப்பிச் செல்லக்கூடிய சட்டச் சூழலைக் குறிக்கிறது; அது முன்திட்டமிட்ட கொலையை அவசியம் குறிப்பதில்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלִבְנֵי אַהֲרֹן הַכֹּהֵן
  choice: ஆசாரியனாகிய ஆரோனின் மகன்களுக்கு
  rationale: לִבְנֵי என்பது பெறுபவர்களைக் குறிக்கும்; ‘மகன்கள்’ எபிரெய வடிவத்தையும் இங்கு உள்ள ஆசாரிய வம்சச் சூழலையும் இயல்பாகப் பாதுகாக்கிறது. אַהֲרֹן הַכֹּהֵן என்பது ஆரோனை அவரது பணிநிலையால் அடையாளப்படுத்தும் சொற்றொடர்.
- source_word: נָתְנוּ
  choice: கொடுத்தார்கள்
  rationale: נתן என்பதன் அடிப்படைப் பொருள் ‘கொடு.’ நகரங்களை ஒதுக்கிக் கொடுக்கும் இச்சூழலிலும் நேரடியான இந்த வினை இயல்பாக உள்ளது.
- source_word: עִיר מִקְלַט הָרֹצֵחַ
  choice: ஒருவரைக் கொன்றவன் அடைக்கலம் புகுவதற்கான நகரம்
  rationale: இது மரணத்தை ஏற்படுத்திய ஒருவர் தப்பிச் செல்லக்கூடிய அடைக்கல நகரத்தைக் குறிக்கும் சட்டச் சொற்றொடர். ‘கொலைகாரன்’ என்று மொழிபெயர்த்தால் முன்திட்டமிட்ட கொலை என்ற பொருள் தேவையின்றி வலுப்பெறும்; ‘ஒருவரைக் கொன்றவன்’ அந்தத் தீர்மானிக்கப்படாத சட்ட நுணுக்கத்தைப் பாதுகாக்கிறது.
- source_word: חֶבְרוֹן
  choice: எப்ரோன்
  rationale: இடப்பெயரின் தமிழ் வேதாகம மரபில் பரவலாக அறியப்படும் ஒலிபெயர்ப்பு.
- source_word: מִגְרָשֶׁיהָ
  choice: அதன் மேய்ச்சல் நிலங்கள்
  rationale: מִגְרָשׁ என்பது நகரத்துக்குரிய திறந்த நிலம் அல்லது கால்நடை மேய்ச்சல் பகுதியைக் குறிக்கிறது; ‘மேய்ச்சல் நிலங்கள்’ இச்சூழலில் தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: לִבְנָה
  choice: லிப்னா
  rationale: இடப்பெயரின் தெளிவான தமிழ் ஒலிபெயர்ப்பு.
