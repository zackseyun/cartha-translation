  yaml_path: translation/ot/joshua/021/041.yaml
  text: All the cities of the Levites within the possession of the sons of Israel were forty-eight cities[b][a], with their pasturelands.
translation:
  language: ta
  text: இஸ்ரவேல் மக்களின் உடைமைப் பகுதிக்குள் இருந்த லேவியர்களின் நகரங்கள் அனைத்தும், அவற்றின் மேய்ச்சல் நிலங்களுடன்[a], நாற்பத்தெட்டு நகரங்களாக இருந்தன.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவற்றின் திறந்த வெளி நிலங்களுடன்” அல்லது “அவற்றின் பொதுநிலங்களுடன்.” இவை நகரங்களைச் சுற்றியிருந்த நிலங்கள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּל
  choice: அனைத்தும்
  rationale: லேவியர்களுக்குரிய நகரங்களின் முழு எண்ணிக்கையையும் குறிக்கும் இயல்பான தமிழ் வடிவம்.
- source_word: עָרֵי הַלְוִיִּם
  choice: லேவியர்களின் நகரங்கள்
  rationale: ‘லேவியர்களுடைய நகரங்கள்’ என்ற எபிரேய இணைப்பைத் தெளிவாகவும் நேரடியாகவும் தக்கவைக்கிறது.
- source_word: בְּתוֹךְ אֲחֻזַּת
  choice: உடைமைப் பகுதிக்குள் இருந்த
  rationale: இஸ்ரவேல் மக்களின் நிலவுடைமையின் எல்லைக்குள் இந்நகரங்கள் அமைந்திருந்த இடவியல் பொருளை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் மக்கள்
  rationale: எபிரேய மொழியின் வழக்கமான தேசியப் பெயரை, முழு இஸ்ரவேல் மக்களையும் உள்ளடக்கும் இயல்பான நவீன தமிழில் தருகிறது; சொற்சொல்லாக ‘இஸ்ரவேலின் மகன்கள்’ என்பது தமிழில் தவறாக உயிரியல் மகன்களை மட்டும் சுட்டக்கூடும்.
- source_word: עָרִים אַרְבָּעִים וּשְׁמֹנֶה
  choice: நாற்பத்தெட்டு நகரங்கள்
  rationale: மூலத்தின் எண்ணிக்கைச் சுருக்கத்தைத் துல்லியமாகத் தருகிறது.
- source_word: וּמִגְרְשֵׁיהֶן
  choice: அவற்றின் மேய்ச்சல் நிலங்களுடன்
  rationale: நகரங்களைச் சுற்றியிருந்த, அவற்றோடு ஒதுக்கப்பட்ட திறந்த நிலங்களை இச்சூழலில் தெளிவாகக் குறிக்கிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל என்ற தேசியக் குழுப் பெயரின் பாலின வடிவம்
  choice: இஸ்ரவேலின் மக்கள்
  alternative: இஸ்ரவேலின் மகன்கள்
  rationale: மூலத்தில் இலக்கணரீதியாக ஆண்பால் பன்மை இருந்தாலும், இது தேசத்தார் அனைவரையும் குறிக்கும் நிலையான குழுப் பெயர். தமிழில் ‘மக்கள்’ அதன் கூட்டுப்பொருளைத் துல்லியமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது; எந்தத் தனிப்பட்ட இறையியல் பொருளையும் சேர்ப்பதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. எபிரேய வசனத்தின் வினையற்ற எண்ணிக்கைச் சுருக்கம் தமிழிலும் இயல்பாகத் தக்கவைக்கப்பட்டுள்ளது; ‘உடைமைப் பகுதி’ என்பது அந்நியாயமாக ‘சுதந்தரம்’ என்ற உடன்படிக்கை நுணுக்கத்தைச் சேர்க்காமல் நிலவுடைமைப் பொருளை வெளிப்படுத்துகிறது.
