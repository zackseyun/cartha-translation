  text: and Kibzaim with its pasturelands[a], and Beth-horon with its pasturelands—four cities.
translation:
  language: ta
  text: கிப்சாயிமையும் அதன் மேய்ச்சல் நிலங்களையும்[a], பெத்-ஹோரோனையும் அதன் மேய்ச்சல் நிலங்களையும்—நான்கு நகரங்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘மேய்ச்சல் நிலங்கள்’ என்பதற்கு ‘பொதுப் பயன்பாட்டு நிலங்கள்’ அல்லது ‘திறந்தவெளி நிலங்கள்’ என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் ஒரு நகரத்திற்குச் சொந்தமான திறந்த நிலத்தைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: קִבְצַיִם
  choice: கிப்சாயிம்
  rationale: இது ஓர் இடப்பெயர்; எபிரெய உச்சரிப்பைத் தொடர்ந்து தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: מִגְרָשֶׁהָ
  choice: அதைச் சுற்றியுள்ள மேய்ச்சல் நிலங்கள்
  rationale: நகரத்திற்குச் சொந்தமான அதைச் சுற்றிய திறந்தவெளி அல்லது கால்நடை மேயும் நிலத்தை இச்சொல் குறிக்கிறது; சூழலைத் தெளிவுபடுத்த இயல்பான தமிழில் இவ்வாறு வழங்கப்பட்டுள்ளது.
- source_word: בֵּית חוֹרֹן
  choice: பெத்-ஓரோன்
  rationale: நிலையான இடப்பெயராகக் கருதி, அதன் சொற்பொருளை மொழிபெயர்க்காமல் எபிரெய வடிவத்திலிருந்து ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: עָרִים אַרְבַּע
  choice: மொத்தம் நான்கு நகரங்கள்
  rationale: பட்டியலின் இறுதியில் வரும் எண்ணிக்கைச் சுருக்கம்; தமிழில் அதன் செயல்பாட்டைத் தெளிவாக்க ‘மொத்தம்’ சேர்க்கப்பட்டுள்ளது.
- source_word: וְאֶת ... וְאֶת
  choice: …ஐயும் …ஐயும்
  rationale: மீண்டும் வரும் இணைப்பையும் நேரடிப் பொருள் குறியீட்டையும் இயல்பான தமிழ் பட்டியல் அமைப்பில் ‘…ஐயும்’ எனக் காட்டுகிறது.
