  text: Holon with its pasturelands[a], and Debir with its pasturelands.
translation:
  language: ta
  text: ஓலோனையும்[a] அதன் மேய்ச்சல் நிலங்களையும், தெபீரையும் அதன் மேய்ச்சல் நிலங்களையும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 1 நாளாகமம் 6:58-இல் உள்ள இணைப் பட்டியலில் இந்த நகரத்தின் பெயர் ‘ஈலேன்’ என்று உள்ளது; ஆனால் இங்கே யோசுவா நூலின் எபிரெய உரையில் ‘ஓலோன்’ என்று உள்ளது.
    reason: cross_reference
lexical_decisions:
- source_word: חֹלֹן
  choice: ஓலோன்
  rationale: நகரத்தின் எபிரெயப் பெயர் தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளது. இவ்வசனத்தின் எபிரெய உரையில் חֹלֹן (ஓலோன்) என்றே உள்ளது.
- source_word: מִגְרָשֶׁהָ
  choice: அதன் மேய்ச்சல் நிலங்கள்
  rationale: מִגְרָשׁ என்பது நகரத்துக்குச் சொந்தமான சுற்றுப்புறத் திறந்தவெளி நிலத்தை, குறிப்பாக கால்நடைகளை மேய்க்கப் பயன்பட்ட நிலத்தை, குறிக்கிறது. பெண்பால் ஒருமை உடைமை விகுதி ஒவ்வொரு நகரத்தையும் சுட்டுவதால் ‘அதன்’ என்று மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: דְּבִר
  choice: தெபீர்
  rationale: இது ஒரு நகரப் பெயர்; அதன் எபிரெய ஒலிக்கு ஏற்ப தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: וְאֶת
  choice: …த்தையும்
  rationale: וְ என்பது இணைப்பையும், אֶת என்பது குறிப்பிட்ட நேரடிச் செயப்படுபொருளையும் குறிக்கிறது. தமிழ் பட்டியல் நடையில் இவை இயல்பாக ‘…த்தையும்’ என்ற வடிவில் வெளிப்படுத்தப்பட்டுள்ளன.
theological_decisions: []
translation_notes:
  register: நவீனத் தரத் தமிழில், நகரங்களின் பட்டியலுக்கேற்ற சுருக்கமான மற்றும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. சூழலில் முந்தைய வினை தொடர்வதால், தமிழில் முழுமையான வாக்கியமாக இயல்பாக அமைய ‘கொடுத்தார்கள்’ சேர்க்கப்பட்டுள்ளது; ஒவ்வொரு நகரமும் அதன் மேய்ச்சல் நிலங்களும் தனித்தனியாகக் குறிப்பிடப்படுகின்றன.
