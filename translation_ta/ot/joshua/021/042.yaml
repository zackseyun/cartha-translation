translation:
  language: ta
  text: இந்த நகரங்கள் ஒவ்வொன்றுக்கும் அதைச் சுற்றியுள்ள மேய்ச்சல் நிலங்கள் இருந்தன[a]; இந்த நகரங்கள் அனைத்துக்கும் அவ்வாறே இருந்தது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'சொல்லுக்குச் சொல்: “நகரம் நகரமாக, ஒவ்வொரு நகரத்தையும் சுற்றியுள்ள அதன் மேய்ச்சல் நிலங்களுடன்.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּהְיֶינָה
  choice: இருந்தன
  rationale: இங்கு இந்த வினைச்சொல் நகரங்களின் நிலையைச் சுருக்கமாக விவரிப்பதால், இறந்தகால நிலையை இயல்பாகக் காட்டும் ‘இருந்தன’ என மொழிபெயர்க்கப்பட்டது.
- source_word: הֶעָרִים הָאֵלֶּה
  choice: இந்த நகரங்கள்
  rationale: עִיר என்பது நகரம் அல்லது ஊர் எனப் பொருள்படலாம்; நிலப்பங்கீட்டுச் சூழலில் மரியாதையான பொதுவழக்காக ‘நகரங்கள்’ பொருந்துகிறது.
- source_word: עִיר עִיר
  choice: ஒவ்வொன்றுக்கும்
  rationale: ‘நகரம் நகரமாக’ என்ற மறுபதிப்பு பகிர்நிலைப் பொருளில் ஒவ்வொரு நகரத்தையும் தனித்தனியாகக் குறிக்கிறது; தமிழில் ‘ஒவ்வொன்றுக்கும்’ என்பது அந்த வலிமையை இயல்பாகத் தருகிறது.
- source_word: וּמִגְרָשֶׁיהָ
  choice: மேய்ச்சல் நிலங்கள்
  rationale: מִגְרָשׁ என்பது நகரத்துடன் இணைந்திருந்த திறந்தவெளி அல்லது கால்நடை மேய்ச்சலுக்கான நிலத்தைக் குறிக்கிறது; ‘மேய்ச்சல் நிலங்கள்’ சூழலுக்குத் தெளிவான மொழிபெயர்ப்பு.
- source_word: סְבִיבֹתֶיהָ
  choice: அதைச் சுற்றிலும்
  rationale: நிலங்கள் அந்தந்த நகரைச் சுற்றி அமைந்திருந்த இடவுறவைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: כֵּן לְכָל הֶעָרִים הָאֵלֶּה
  choice: இந்த நகரங்கள் அனைத்துக்கும் அவ்வாறே இருந்தது
  rationale: இந்த அமைப்பு முன் கூறப்பட்ட நிலை எல்லா நகரங்களுக்கும் பொருந்தியதாகச் சுருக்கிக் கூறுகிறது.
