  register: நவீன நிலையான தமிழில், பட்டியல் நடையைப் பாதுகாத்து எளிமையாகவும் கண்ணியமாகவும் மொழிபெயர்க்கப்பட்டுள்ளது. எபிரேய வசனம் வினைச்சொல்லில்லாத பட்டியல் துணுக்காக இருந்தாலும், முந்தைய வசனங்களிலிருந்து தொடரும் கருத்தைத் தமிழில் முழுமையாக்க ‘கொடுத்தார்கள்’ சேர்க்கப்பட்டுள்ளது; ‘மொத்தம்’ இறுதி எண்ணிக்கைச் சுருக்கத்தைத் தெளிவாக்குகிறது.
