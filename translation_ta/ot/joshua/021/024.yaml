  text: 'Aijalon with its pasturelands[a], and Gath-rimmon with its pasturelands: four cities.'
translation:
  language: ta
  text: அய்யாலோனையும் அதற்குரிய மேய்ச்சல் நிலத்தையும்[a], காத்-ரிம்மோனையும் அதற்குரிய மேய்ச்சல் நிலத்தையும்—நான்கு நகரங்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அதற்குரிய பொதுநிலம்” அல்லது “அதற்குரிய சுற்றுப்புற நிலம்”; இங்கு வரும் எபிரேயச் சொல் ஒரு நகரத்துக்குரிய, பெரும்பாலும் கால்நடைகளை மேய்க்கப் பயன்படுத்தப்பட்ட நிலப்பரப்பைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַיָּלוֹן
  choice: ஆயலோன்
  rationale: எபிரேய இடப்பெயரின் ஒலியை நவீனத் தமிழில் இயல்பாக எழுத்துப்பெயர்த்த வடிவம்.
- source_word: מִגְרָשֶׁהָ
  choice: அதன் மேய்ச்சல் நிலங்கள்
  rationale: நகரத்துக்குச் சொந்தமான சுற்றுப்புறப் பொதுநிலத்தை, குறிப்பாக மேய்ச்சலுக்குப் பயன்படுத்தப்பட்ட நிலத்தை, இச்சூழலில் தெளிவாகக் குறிக்கிறது.
- source_word: גַּת רִמּוֹן
  choice: காத்-ரிம்மோன்
  rationale: கூட்டு இடப்பெயர் ஒன்றே என்பதைத் தெளிவுபடுத்த இடைக்கோட்டுடன் எழுத்துப்பெயர்க்கப்பட்டுள்ளது.
- source_word: עָרִים אַרְבַּע
  choice: மொத்தம் நான்கு நகரங்கள்
  rationale: பட்டியலை முடிக்கும் எண்ணிக்கைச் சுருக்கத்தை இயல்பான தமிழில் தருகிறது.
- source_word: אֶת ... וְאֶת ... אֶת ... וְאֶת
  choice: -ஐயும் ... -ஐயும்
  rationale: எபிரேய நேரடி செயப்படுபொருள் அமைப்பும் இணைப்புகளும் தமிழில் வேற்றுமை உருபு மற்றும் ‘உம்’ மூலம் இயல்பாக வெளிப்படுத்தப்பட்டுள்ளன.
