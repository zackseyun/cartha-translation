source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֤ה אֶל יְהוֹשֻׁ֨עַ֙ אַל תִּירָ֣א מֵ/הֶ֔ם כִּ֥י בְ/יָדְ/ךָ֖ נְתַתִּ֑י/ם לֹֽא יַעֲמֹ֥ד אִ֛ישׁ מֵ/הֶ֖ם בְּ/פָנֶֽי/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/008.yaml
  text: And Yahweh said to Joshua, “Do not fear them, for I have given them into your hand. Not a man among them will stand before you.”
translation:
  language: ta
  text: யாவே யோசுவாவிடம், “அவர்களுக்குப் பயப்படாதே; ஏனெனில், அவர்களை உன் கையில் ஒப்புக்கொடுத்துவிட்டேன். அவர்களில் ஒருவனும் உனக்கு முன்பாக எதிர்த்து நிற்கமாட்டான்” என்றார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைத் திருப்பெயரான நான்கெழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், நவீனத் தமிழில் இயல்பான ஒலிபெயர்ப்பாகக் கொடுக்கிறது.
- source_word: וַיֹּאמֶר
  choice: என்றார்
  rationale: நேர்க் கூற்றை அறிமுகப்படுத்தும் எபிரேயக் கதைநடை வினையை இயல்பான தமிழ் மேற்கோள் அமைப்பில் தருகிறது.
- source_word: אַל תִּירָא מֵהֶם
  choice: அவர்களுக்குப் பயப்படாதே
  rationale: מן என்பது பயத்தின் பொருளைச் சுட்டுகிறது; ‘அவர்களுக்குப் பயப்படாதே’ என்பது சுருக்கமும் இயல்பும் கொண்ட தமிழ் வடிவம்.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: பயப்பட வேண்டாமென்ற கட்டளைக்கான காரணத்தை அறிமுகப்படுத்தும் தொடர்பைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: בְיָדְךָ
  choice: உன் கையில்
  rationale: ஒருவரின் அதிகாரத்திற்குள் ஒப்படைத்தல் என்னும் எபிரேய உருவகத்தைத் தமிழிலும் புரியத்தக்கவாறு பாதுகாக்கிறது.
- source_word: נְתַתִּים
  choice: அவர்களை ... ஒப்புக்கொடுத்துவிட்டேன்
  rationale: முடிவுற்ற தெய்வீகத் தீர்மானத்தையும் அதன் தற்போதைய உறுதியையும் எபிரேய நிறைவுவினைக்கேற்ப வெளிப்படுத்துகிறது.
- source_word: לֹא יַעֲמֹד אִישׁ מֵהֶם
  choice: அவர்களில் ஒருவனும் ... நிற்கமாட்டான்
  rationale: ஆண் போர்வீரர்களைக் குறிக்கும் אִישׁ என்பதன் பாலினத் துல்லியத்தையும், ஒருவர்கூட இல்லை என்ற முழுமையான மறுப்பையும் காக்கிறது.
- source_word: בְּפָנֶיךָ
  choice: உனக்கு முன்பாக எதிர்த்து
  rationale: சொல்லடியாகிய ‘உனக்கு முன்பாக’ என்பதையும், போர்ச் சூழலில் உள்ள எதிர்த்து நிலைநிற்றல் என்ற பொருளையும் இயல்பான தமிழில் இணைக்கிறது.
theological_decisions:
- issue: יְהוָה என்னும் இறைத் திருப்பெயரின் மொழியாக்கம்
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலத்தில் வரும் தனிப்பட்ட உடன்படிக்கைப் பெயரைப் பட்டத்தால் மாற்றாமல் ஒலிபெயர்க்கிறது; ‘யாவே’ என்பது மூல உச்சரிப்பிற்கான பொதுவாக ஏற்கப்படும் நெருக்கமான வடிவம்.
- issue: אִישׁ என்பதன் பாலினமுள்ள மொழியாக்கம்
  choice: ஒருவனும்
  alternative: ஒருவரும்
  rationale: இச்சூழல் எதிரி ஆண் போர்வீரர்களைப் பற்றியது; ஆகவே ஆண்பால் வடிவம் மூலத்தின் குறிப்பைத் துல்லியமாகக் காக்கிறது.
- issue: נְתַתִּים நிறைவுவினையின் காலநிலை
  choice: ஒப்புக்கொடுத்துவிட்டேன்
  alternative: ஒப்புக்கொடுக்கிறேன்
  rationale: போர் இன்னும் நிகழ்ந்துகொண்டிருந்தாலும், இறைவனின் தீர்மானத்தில் ஒப்படைப்பு உறுதியாக முடிந்தது எனக் கூறும் தீர்க்கதரிசன உறுதியை நிறைவு வடிவம் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; மரியாதையுடனும் கதைநடைக்கு ஏற்ற இயல்புடனும் உள்ளது. யோசுவாவிடம் இறைவன் ஒருமை நெருக்குச் சொல்லான ‘நீ’ வடிவில் பேசுவது மூலத்தின் இரண்டாம் நபர் ஒருமையைப் பாதுகாக்கிறது. தேவையற்ற சமயக்குழுச் சொற்கள் தவிர்க்கப்பட்டுள்ளன.
