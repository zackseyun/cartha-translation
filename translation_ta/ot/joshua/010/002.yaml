base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/002.yaml
  text: And they feared greatly[a], because Gibeon was a great city, like one of the royal cities, and because it was greater than Ai, and all its men were mighty.
translation:
  language: ta
  text: அவர்கள் மிகவும் பயந்தார்கள்; ஏனெனில் கிபியோன் ஒரு பெரிய நகரமாக இருந்தது; அது அரசாட்சிக்குரிய நகரங்களில் ஒன்றைப் போலவும், ஆயியை விடப் பெரியதாகவும் இருந்தது; அதிலிருந்த ஆண்கள் அனைவரும் வலிமைமிக்கவர்களாக இருந்தார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அதிலிருந்த ஆண்கள் அனைவரும் வலிமைமிக்க வீரர்களாக இருந்தார்கள்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּירְאוּ מְאֹד
  choice: அவர்கள் மிகவும் பயந்தார்கள்
  rationale: ירא என்பதன் பயம் என்ற நேரடி வினைப்பொருளையும், מְאֹד என்பதன் தீவிரத்தையும் இயல்பான நவீன தமிழில் காக்கிறது.
- source_word: עִיר גְּדוֹלָה
  choice: ஒரு பெரிய நகரம்
  rationale: גָּדוֹל அளவையும் முக்கியத்துவத்தையும் குறிக்கக்கூடும்; ‘பெரிய’ என்பது இரண்டையும் குறுக்காமல் வைத்திருக்கிறது.
- source_word: גִּבְעוֹן
  choice: கிபியோன்
  rationale: எபிரெய இடப்பெயரின் தமிழ் ஒலிபெயர்ப்பு.
- source_word: כְּאַחַת עָרֵי הַמַּמְלָכָה
  choice: அரச நகரங்களில் ஒன்றைப் போன்ற
  rationale: சொற்றொடரின் அரசாட்சிசார் அந்தஸ்தை இயல்பாகத் தெரிவிக்கிறது; மரத்தனமான ‘ராஜ்யத்தின் நகரங்களில் ஒன்று’ என்பதைத் தவிர்க்கிறது.
- source_word: הִיא גְדוֹלָה מִן הָעַי
  choice: ஆயியை விடப் பெரியதாக
  rationale: முன்னர் வரும் גָּדוֹל என்பதோடு சொல்லிணைப்பைத் தக்கவைத்து, அளவு அல்லது முக்கியத்துவம் என்ற இரு சாத்தியங்களையும் திறந்துவைக்கிறது.
- source_word: וְכָל אֲנָשֶׁיהָ
  choice: அதன் ஆண்கள் அனைவரும்
  rationale: இராணுவச் சூழலில் אֲנָשִׁים நகரத்தின் ஆண் போர்திறன் கொண்டவர்களைக் குறிக்கிறது; பொதுவான ‘மக்கள்’ என்று விரிவாக்கப்படவில்லை.
- source_word: גִּבֹּרִים
  choice: வலிமைமிக்கவர்கள்
  rationale: வலிமை மற்றும் போர்த்திறன் ஆகியவற்றைக் குறிக்கும் சொல்லின் பரப்பைத் தக்கவைக்கிறது; ‘வலிமைமிக்க வீரர்கள்’ என்ற தெளிவான இராணுவப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
