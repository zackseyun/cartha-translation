source:
  edition: WLC
  text: אָ֣ז יְדַבֵּ֤ר יְהוֹשֻׁעַ֙ לַֽ/יהוָ֔ה בְּ/י֗וֹם תֵּ֤ת יְהוָה֙ אֶת הָ֣/אֱמֹרִ֔י לִ/פְנֵ֖י בְּנֵ֣י יִשְׂרָאֵ֑ל וַ/יֹּ֣אמֶר לְ/עֵינֵ֣י יִשְׂרָאֵ֗ל שֶׁ֚מֶשׁ בְּ/גִבְע֣וֹן דּ֔וֹם וְ/יָרֵ֖חַ בְּ/עֵ֥מֶק אַיָּלֽוֹן־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/012.yaml
  text: Then Joshua spoke to Yahweh on the day when Yahweh gave the Amorites over before the sons of Israel[a], and he said in the sight of Israel, “Sun, stand still at Gibeon, and moon[c][b], in the Valley of Aijalon.”
translation:
  language: ta
  text: 'யாவே எமோரியரை இஸ்ரவேல் மகன்களுக்கு முன்பாக ஒப்புக்கொடுத்த நாளில், யோசுவா யாவேயிடம் பேசினார். இஸ்ரவேலின் கண்முன்னே அவர் கூறினார்: “சூரியனே, கிபியோனில் அசையாமல் நில்[a]; சந்திரனே, ஆயலோன் பள்ளத்தாக்கில் அசையாமல் நில்[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சூரியனே, அமைதியாயிரு” அல்லது “சூரியனே, நின்றுவிடு.” எபிரெய வினை அமைதியையோ இயக்கம் நிற்பதையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில், “சந்திரனே, ஆயலோன் பள்ளத்தாக்கில்” என்று மட்டுமே உள்ளது; முந்தைய கூறிலுள்ள “அசையாமல் நில்” என்ற வினை இங்கும் பொருந்துவதாகப் புரிந்துகொள்ளப்படுகிறது.
    reason: ellipsis_clarification
lexical_decisions:
- source_word: יְדַבֵּר
  choice: பேசினார்
  rationale: பின்வரும் וַיֹּאמֶר என்பதற்கு ‘சொன்னது’ என்று வேறுபடுத்தி, דבר என்ற வினையின் ‘பேசு’ என்ற பொருளைப் பாதுகாக்கிறது.
- source_word: לַיהוָה
  choice: யெகோவாவிடம்
  rationale: לְ முன்னிடைச்சொல் யோசுவா YHWH-ஐ நோக்கிப் பேசியதைச் சுட்டுகிறது; தமிழில் ‘-விடம்’ இயல்பான திசை/பெறுநர் வடிவம்.
- source_word: בְּיוֹם תֵּת יְהוָה
  choice: யெகோவா ... ஒப்புக்கொடுத்த நாளில்
  rationale: בְּיוֹם உடனான infinitive construct-இன் காலச்சார்ந்த பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: הָאֱמֹרִי
  choice: எமோரியரை
  rationale: எபிரெயத்தில் ஒருமை வடிவம் இருந்தாலும் இச்சூழலில் மக்களினத்தைக் கூட்டாகக் குறிக்கிறது.
- source_word: לִפְנֵי בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் மக்களுக்கு முன்பாக
  rationale: ‘இஸ்ரவேலின் மகன்கள்’ என்ற சொல்லமைப்பின் குடும்பத் தொடர்பை ‘மக்கள்’ இயல்பாகத் தெரிவிக்கிறது; לִפְנֵי என்பதையும் ‘முன்பாக’ என்று பாதுகாக்கிறது.
- source_word: וַיֹּאמֶר לְעֵינֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் கண்முன்னே அவர் சொன்னது
  rationale: לְעֵינֵי என்பதன் சொற்படிமத்தையும், பொதுவாக அனைவரும் காண/கேட்கும்படி கூறிய பொருளையும் காக்கிறது.
- source_word: שֶׁמֶשׁ ... דּוֹם
  choice: சூரியனே ... அசையாமல் நில்
  rationale: דום அமைதியாயிருத்தல் அல்லது செயல்நிறுத்தத்தைக் குறிக்கலாம்; இக்கோளியல் கட்டளைச் சூழலில் ‘அசையாமல் நில்’ தெளிவாகவும் இயல்பாகவும் உள்ளது, மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: בְּגִבְעוֹן
  choice: கிபியோனில்
  rationale: בְּ முன்னிடைச்சொல்லை நேரடியாகத் தருகிறது; துல்லியமான வானியல் இடத்தொடர்பைத் தேவையின்றி நிர்ணயிக்கவில்லை.
- source_word: וְיָרֵחַ בְּעֵמֶק אַיָּלוֹן
  choice: சந்திரனே, ஆயலோன் பள்ளத்தாக்கில் அசையாமல் நில்
  rationale: இரண்டாம் கூறில் எபிரெயத்தில் விடுபட்டுள்ள வினையைத் தமிழின் தெளிவுக்காக இணை அமைப்பிலிருந்து வெளிப்படையாக நிரப்புகிறது; இதை அடிக்குறிப்பு தெரிவிக்கிறது.
- source_word: אַיָּלוֹן
  choice: ஆயலோன்
  rationale: எபிரெய இடப்பெயரின் ஒலிப்பை நவீன தமிழில் நெருக்கமாக எழுத்துப்பெயர்க்கிறது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யெகோவா
  alternative: யாவே
  rationale: மூலத்தில் வரும் தனிப்பட்ட உடன்படிக்கைப் பெயரை பொதுப்பட்டமான ‘ஆண்டவர்’ என்று மாற்றாமல் ஒலிபெயர்க்கிறது. தமிழில் பரவலாக அறியப்படும் ‘யெகோவா’ வடிவம் தேர்ந்தெடுக்கப்பட்டது; ‘யாவே’ என்பது மூல உச்சரிப்பை மீளமைக்கும் மாற்று ஒலிபெயர்ப்பு.
- issue: דּוֹם என்பதின் கட்டளைப் பொருள்
  choice: அசையாமல் நில்
  alternative: அமைதியாயிரு / நின்றுவிடு
  rationale: பின்வரும் நிகழ்வில் சூரியன் நின்றதைக் கூறுவதால் இயக்கநிறுத்தப் பொருள் சூழலுக்கு ஏற்றது; இருப்பினும் சொல்லின் ‘அமைதியாயிரு’ என்ற உண்மையான பொருள் சாத்தியத்தை அடிக்குறிப்பு காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும் dignified நடையில், கவிதைநயமுள்ள நேரடி அழைப்பைத் தக்கவைத்துள்ளது. ‘இஸ்ரவேலின் கண்முன்னே’ என்ற சொற்றொடர் மூலப்படிமத்தைப் பாதுகாக்கிறது.
