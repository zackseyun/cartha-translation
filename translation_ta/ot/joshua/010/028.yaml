  text: וְ/אֶת מַקֵּדָה֩ לָכַ֨ד יְהוֹשֻׁ֜עַ בַּ/יּ֣וֹם הַ/ה֗וּא וַ/יַּכֶּ֣/הָ לְ/פִי חֶרֶב֮ וְ/אֶת מַלְכָּ/הּ֒ הֶחֱרִ֣ם אוֹתָ֗/ם וְ/אֶת כָּל הַ/נֶּ֨פֶשׁ֙ אֲשֶׁר בָּ֔/הּ לֹ֥א הִשְׁאִ֖יר שָׂרִ֑יד וַ/יַּ֨עַשׂ֙ לְ/מֶ֣לֶךְ מַקֵּדָ֔ה כַּ/אֲשֶׁ֥ר עָשָׂ֖ה לְ/מֶ֥לֶךְ יְרִיחֽוֹ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/028.yaml
  text: And Joshua captured Makkedah on that day and struck it with the edge of the sword[a], and he devoted to destruction its king and every person in it; he left no survivor. And he did to the king of Makkedah just as he had done to the king of Jericho.
translation:
  language: ta
  text: அன்றே யோசுவா மக்கேதாவைக் கைப்பற்றி, வாளின் முனையால் அதைத் தாக்கினார். அதன் அரசனையும் அதில் இருந்த ஒவ்வொருவரையும் அழிவுக்கென்று அர்ப்பணித்தார்[a]; உயிர்தப்பியவர் ஒருவரைக்கூட அவர் விட்டுவைக்கவில்லை. எரிகோவின் அரசனுக்குச் செய்ததுபோலவே மக்கேதாவின் அரசனுக்கும் செய்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “முற்றிலும் அழித்தார்.” இங்கு வரும் எபிரெய வினைச்சொல், தடைத் தீர்ப்பின்கீழ் ஒன்றை அழிவுக்கென ஒதுக்குவதைக் குறிக்கிறது.
    reason: חרם என்ற சொல்லின் முழு அழிவும் தடைத் தீர்ப்பும் சார்ந்த பொருள் நுணுக்கத்தை விளக்குகிறது.
lexical_decisions:
- source_word: לָכַד
  choice: கைப்பற்றி
  rationale: ஒரு நகரை இராணுவ நடவடிக்கையால் வசப்படுத்துவதைக் குறிக்கும் இயல்பான நவீனத் தமிழ் சொல்.
- source_word: וַיַּכֶּהָ לְפִי חֶרֶב וְאֶת מַלְכָּהּ
  choice: அதையும் அதன் அரசனையும் வாள்முனையால் வெட்டி வீழ்த்தினார்
  rationale: נכה என்பதன் தாக்குதல் சார்ந்த வலிமையையும், ‘வாளின் வாய்’ என்ற எபிரெய உருவகத்தின் கூர்முனை/வெட்டுவாய் கருத்தையும் இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: הֶחֱרִם
  choice: அழிவுக்கென்று அர்ப்பணித்தார்
  rationale: இது சாதாரணமாக அழித்தல் மட்டுமல்லாமல், தடைத் தீர்ப்பின்கீழ் அழிவுக்கென ஒதுக்கிவைப்பதையும் குறிக்கிறது; அந்தச் சடங்கு-இறையியல் நுணுக்கத்தை மொழிபெயர்ப்பு தக்கவைக்கிறது.
- source_word: כָּל הַנֶּפֶשׁ אֲשֶׁר בָּהּ
  choice: அதில் இருந்த ஒவ்வொருவரையும்
  rationale: נפש இங்கு உடலற்ற ‘ஆத்துமா’ என்பதல்ல, நகரிலிருந்த மனிதர்கள் ஒவ்வொருவரையும் குறிக்கிறது.
- source_word: לֹא הִשְׁאִיר שָׂרִיד
  choice: உயிர்தப்பியவர் ஒருவரைக்கூட அவர் விட்டுவைக்கவில்லை
  rationale: שָׂרִיד என்பதன் ‘உயிர்தப்பியவர்’ என்ற பொருளைத் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: וַיַּעַשׂ לְמֶלֶךְ מַקֵּדָה כַּאֲשֶׁר עָשָׂה לְמֶלֶךְ יְרִיחוֹ
  choice: எரிகோவின் அரசனுக்குச் செய்ததுபோலவே மக்கேதாவின் அரசனுக்கும் செய்தார்
  rationale: எபிரெய வாக்கியத்தின் சுருக்கத்தையும் இரு அரசர்களுக்கிடையிலான நேரடி ஒப்பீட்டையும் தக்கவைக்கிறது.
theological_decisions:
- issue: வெற்றிகொள்ளப்பட்டவர்களைப் பற்றிய חרם என்ற சொல்லின் பொருள்
  choice: அழிவுக்கென்று அர்ப்பணித்தார்
  alternative: முற்றிலும் அழித்தார்
  rationale: மூல வினைச்சொல் முழு அழிவைக் குறிப்பதோடு, தடைத் தீர்ப்பின்கீழ் அழிவுக்கென ஒதுக்கப்படும் கருத்தையும் கொண்டுள்ளது. ‘முற்றிலும் அழித்தார்’ என்பது விளைவைத் தெளிவாக்கினாலும் அந்த இறையியல் நுணுக்கத்தைச் சுருக்கிவிடும்.
translation_notes:
  register: நவீனத் தரத்தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டது. பழமையான ‘சங்கரித்தார்’ போன்ற சொற்கள் தவிர்க்கப்பட்டன; பெயர்கள் வழக்கமான தமிழ் வடிவங்களான யோசுவா, மக்கேதா, எரிகோ என வழங்கப்பட்டன.
