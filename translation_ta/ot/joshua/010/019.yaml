base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/019.yaml
  text: But as for you[a], do not stand still; pursue your enemies and strike their rear guard. Do not let them enter their cities, for Yahweh your God has given them into your hand.
translation:
  language: ta
  text: ஆனால் நீங்கள் நின்றுவிடாதீர்கள்; உங்கள் பகைவர்களைத் துரத்திச் சென்று, அவர்களுடைய பின்பகுதியைத் தாக்குங்கள்.[a] அவர்களைத் தங்கள் நகரங்களுக்குள் நுழைய விடாதீர்கள். ஏனெனில் உங்கள் கடவுளாகிய யாவே அவர்களை உங்கள் கையில் கொடுத்துவிட்டார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்களுடைய கடைசிப்பகுதியைத் தாக்குங்கள்” / “பின்தங்கியவர்களைத் தாக்குங்கள்.” எபிரெய வினை, தப்பியோடும் படையின் வால்போன்ற கடைசிப்பகுதியைத் தாக்குவதைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתֶּם
  choice: ஆனால் நீங்கள்
  rationale: இணைப்புச்சொல்லோடு வரும் தனிப்பட்ட பதிலிப்பெயர், முந்தைய கட்டளையிலிருந்து மற்றவர்களிடம் திரும்பும் வலியுறுத்தப்பட்ட வேறுபாட்டைக் காட்டுகிறது.
- source_word: אַל תַּעֲמֹדוּ
  choice: அங்கேயே நின்றுவிடாதீர்கள்
  rationale: வினைச்சொல் சொற்பொருளில் ‘நிற்குதல்’ என்றாலும், இப்போர்ச் சூழலில் துரத்தலை நிறுத்தாமல் தொடர வேண்டும் என்பதே பொருள்; ‘அங்கேயே’ இயல்பான தமிழில் அசையாமல் நிற்பதைத் தெளிவாக்குகிறது.
- source_word: רִדְפוּ אַחֲרֵי אֹיְבֵיכֶם
  choice: உங்கள் பகைவர்களைத் துரத்திச் சென்று
  rationale: எதிரிகளைப் பின்தொடர்ந்து விரட்டும் வழக்கமான இராணுவப் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: וְזִנַּבְתֶּם אוֹתָם
  choice: அவர்களுடைய பின்பகுதியைத் தாக்குங்கள்
  rationale: זנב என்பது ‘வால்/கடைசிப்பகுதி’ சார்ந்த உருவகத்திலிருந்து, ஓடும் படையின் பின்பகுதியைத் தாக்குவதைக் குறிக்கிறது. ‘பின்பகுதி’ என்பது கட்டாயமாக ஒழுங்கமைந்த ‘பின்காவல் படை’ இருந்ததாகச் சேர்க்காமல் மூலத்தின் பரப்பை காக்கிறது.
- source_word: אַל תִּתְּנוּם לָבוֹא אֶל עָרֵיהֶם
  choice: அவர்கள் தங்கள் நகரங்களுக்குள் நுழைய விடாதீர்கள்
  rationale: נתן + வினையெச்ச அமைப்பு இங்கு அனுமதித்தல் என்ற பொருளுடையது; ‘நுழைய விடாதீர்கள்’ அதற்கான இயல்பான தமிழ் வடிவம்.
- source_word: כִּי נְתָנָם
  choice: ஏனெனில் ... அவர்களை ... கொடுத்துவிட்டார்
  rationale: כִּי காரணத்தைக் குறிக்கிறது; நிறைவுற்ற எபிரெய வினை வெற்றி ஏற்கெனவே உறுதிசெய்யப்பட்டதாகக் காட்டுவதால் ‘கொடுத்துவிட்டார்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: יְהוָה
  choice: யாவே
  rationale: திருநான்கெழுத்துப் பெயரை ஒரு பொதுப் பட்டத்தால் மாற்றாமல், தமிழில் பரவலாகப் புரியக்கூடிய ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: אֱלֹהֵיכֶם
  choice: உங்கள் கடவுளாகிய
  rationale: இரண்டாம் நபர் பன்மை உரிமைத் தொடர்பைத் தெளிவாகவும் இயல்பாகவும் காட்டுகிறது.
- source_word: בְּיֶדְכֶם
  choice: உங்கள் கையில்
  rationale: ‘கை’ என்பது அதிகாரம் அல்லது கட்டுப்பாட்டைக் குறிக்கும் எபிரெய உருவகம்; தமிழிலும் இது இயல்பாகப் புரிகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலத்தில் தனிப்பட்ட இறைப்பெயரே நேரடியாக உள்ளது. அதைப் பட்டமாக மாற்றாமல் ஒலிபெயர்ப்பது மூலத்தின் வேறுபாட்டைக் காக்கிறது; ‘யாவே’ நவீனத் தமிழ் வாசிப்புக்கு ஏற்ற வடிவம்.
translation_notes:
  register: நவீன நிலையான தமிழில், கண்ணியமான ஆனால் பொதுவாசகர்களுக்குப் புரியும் போர்க்கட்டளை நடையில் வடிவமைக்கப்பட்டது. ‘பின்பகுதி’ என்ற சொல் மூலத்தின் உருவகத்தையும் அதன் சாத்தியமான இராணுவப் பொருள் பரப்பையும் காக்கிறது; மாற்று விளக்கங்கள் அடிக்குறிப்பில் தரப்பட்டுள்ளன.
