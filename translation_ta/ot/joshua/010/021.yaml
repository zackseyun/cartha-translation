  text: וַ/יָּשֻׁבוּ֩ כָל הָ/עָ֨ם אֶל הַ/מַּחֲנֶ֧ה אֶל יְהוֹשֻׁ֛עַ מַקֵּדָ֖ה בְּ/שָׁל֑וֹם לֹֽא חָרַ֞ץ לִ/בְנֵ֧י יִשְׂרָאֵ֛ל לְ/אִ֖ישׁ אֶת לְשֹׁנֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/021.yaml
  text: And all the people returned to the camp[a], to Joshua at Makkedah, in peace. No one moved his tongue against any of the sons of Israel.
translation:
  language: ta
  text: மக்கள் அனைவரும் நலமுடன் மக்கேதாவில் யோசுவா இருந்த முகாமுக்குத் திரும்பிவந்தார்கள். இஸ்ரவேல் மக்களில் எவருக்கும் எதிராக எவரும் ஒரு வார்த்தைகூடப் பேசவில்லை[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் நேரடியாக, “இஸ்ரவேல் மக்களில் எவருக்கும் எதிராக ஒருவன் தன் நாவைக் கூராக்கவில்லை” என்று உள்ளது. இது அவர்களுக்கு எதிராக எவரும் ஒரு வார்த்தைகூடப் பேசவில்லை என்னும் பொருளுடைய மரபுத்தொடர்.
    reason: மூலமொழியின் உருவகத்தையும் அதன் இயல்பான பொருளையும் தெரிவிக்கிறது.
lexical_decisions:
- source_word: וַיָּשֻׁבוּ
  choice: திரும்பிவந்தார்கள்
  rationale: துரத்திச் சென்றபின் மீண்டும் முகாமுக்கு வந்ததை שׁוּב குறிக்கிறது; தமிழில் இயல்பான இறந்தகாலத் தொடர்வினை பயன்படுத்தப்பட்டது.
- source_word: כָל הָעָם
  choice: மக்கள் அனைவரும்
  rationale: சூழல் படை நடவடிக்கையைப் பற்றியதாயினும், עָם என்பது தொழில்நுட்பமாக ‘படை’ என்று அல்லாமல் ‘மக்கள்’ என்று கூறுகிறது.
- source_word: הַמַּחֲנֶה
  choice: முகாம்
  rationale: இங்கு இராணுவத்தினர் தங்கியிருந்த இடத்தைக் குறிக்கும் இயல்பான நவீனத் தமிழ்ச் சொல்.
- source_word: אֶל יְהוֹשֻׁעַ מַקֵּדָה
  choice: மக்கேதாவிலிருந்த முகாமில் யோசுவாவிடம்
  rationale: எபிரெயச் சொற்றொடர் சுருக்கமானது. மக்கள் மக்கேதாவில் இருந்த முகாமுக்குத் திரும்பி யோசுவாவிடம் சேர்ந்தனர் என்ற இடவியல் தொடர்பைத் தமிழில் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: בְּשָׁלוֹם
  choice: நலமுடன்
  rationale: இந்தச் சூழலில் שָׁלוֹם அமைதியான மனநிலையைவிடப் பாதுகாப்பாகவும் சேதமின்றியும் திரும்பியதைக் குறிக்கிறது; ‘நலமுடன்’ அந்தப் பொருளை இயல்பாகத் தருகிறது.
- source_word: לֹא חָרַץ ... אֶת־לְשֹׁנוֹ
  choice: ஒரு வார்த்தைகூடப் பேசவில்லை
  rationale: ‘நாவைக் கூராக்குதல்’ என்ற எபிரெய மரபுத்தொடர் இங்கு எதிராகப் பேசுதல் அல்லது பகைமையான சொல் கூறுதல் என்ற பொருளுடையது. முதன்மை உரையில் பொருள் இயல்பாகத் தரப்பட்டு, சொல்லுருவம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டது.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்கள்
  rationale: בני ישראל என்பது இங்கு தேசியக் கூட்டுப்பெயர். ‘இஸ்ரவேலின் மகன்கள்’ என்பது நவீனத் தமிழில் இயல்பற்றதுடன் நேரடியான உயிரியல் உறவையும் உணர்த்தக்கூடும்; ‘இஸ்ரவேல் மக்கள்’ மூலத்தின் கூட்டுப்பொருளைத் துல்லியமாக வழங்குகிறது.
theological_decisions:
- issue: בני ישראל என்ற உடன்படிக்கை/தேசிய அடையாளத்தின் பாலின வடிவம்
  choice: இஸ்ரவேல் மக்கள்
  alternative: இஸ்ரவேலின் மகன்கள்
  rationale: எபிரெயத்தில் ஆண்பால் பன்மை வடிவம் இருந்தாலும், இச்சொற்றொடர் நிலையான தேசியக் கூட்டுப்பெயராகச் செயல்படுகிறது. தமிழில் பாலினத்தைத் தேவையின்றி முன்னிறுத்தாமல் அதன் தேசியப் பொருளை வழங்குவது துல்லியமும் இயல்பும் ஆகும்.
- issue: לֹא חָרַץ ... אֶת־לְשֹׁנוֹ என்ற உருவகத்தின் பொருள்
  choice: எதிராக ஒரு வார்த்தைகூடப் பேசவில்லை
  alternative: தன் நாவைக் கூராக்கவில்லை
  rationale: உருவகம் பகைமையான எதிர்ப்புச் சொல்லைக் குறிக்கிறது. எந்த குறிப்பிட்ட வகையான மிரட்டலையோ நிந்தனையையோ சேர்க்காமல், அதன் பரந்த பொருளை முதன்மை உரையில் வைத்திருக்கிறது; நேரடி உருவகம் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் dignified நடையில் மொழிபெயர்க்கப்பட்டது. ‘நலமுடன்’ என்பது בְּשָׁלוֹם என்பதன் பாதுகாப்பான திரும்புதலைக் காட்டுகிறது. முகாம்–யோசுவா–மக்கேதா தொடர்புடைய சுருக்கமான எபிரெயத் தொடரை மிகைப்படுத்தாமல் இயல்பான தமிழ்ச் சொற்றொடராக அமைத்துள்ளது.
