base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/032.yaml
  text: And Yahweh gave Lachish into the hand of Israel[a], and he captured it on the second day and struck it with the edge of the sword, along with every person who was in it, just as he had done to Libnah.
translation:
  language: ta
  text: யாவே லாகீசை இஸ்ரவேலின் கையில் ஒப்புக்கொடுத்தார். யோசுவா அதை இரண்டாம் நாளில் கைப்பற்றி, அதை வாளால் தாக்கி, அதிலிருந்த ஒவ்வொருவரையும்[a] கொன்றான்; லிப்னாவுக்குச் செய்தது போலவே அதற்கும் செய்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயில், “அதிலிருந்த ஒவ்வோர் உயிரையும்”; இங்கு இது நகரிலிருந்த ஒவ்வொரு மனிதரையும் குறிக்கும் மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைபெயரை ‘ஆண்டவர்’ போன்ற பட்டப்பெயராக மாற்றாமல், எபிரெய வடிவத்துக்கு நெருக்கமான நவீனத் தமிழ் ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: וַיִּתֵּן ... בְּיַד
  choice: கையில் ஒப்புக்கொடுத்தார்
  rationale: ஒருவரின் அதிகாரத்துக்குள் ஒப்படைத்தல் என்ற எபிரெய மரபுத்தொடரின் பொருளையும் ‘கை’ என்ற உருவகத்தையும் தக்கவைக்கிறது.
- source_word: לָכִישׁ
  choice: லாகீசு
  rationale: இடப்பெயரை எபிரெய உச்சரிப்புக்கு நெருக்கமாகத் தமிழில் ஒலிபெயர்க்கிறது; வேற்றுமை உருபுடன் ‘லாகீசை’ என வருகிறது.
- source_word: וַיִּלְכְּדָהּ
  choice: அதைக் கைப்பற்றி
  rationale: ஒரு நகரை இராணுவ நடவடிக்கையால் பிடித்ததைக் குறிக்கும் இயல்பான நவீனத் தமிழ் வினை.
- source_word: בַּיּוֹם הַשֵּׁנִי
  choice: இரண்டாம் நாளில்
  rationale: காலக்குறிப்பை நேரடியாகவும் இயல்பாகவும் வழங்குகிறது; ‘மறுநாள்’ என்று விளக்கி வரையறுப்பதைத் தவிர்க்கிறது.
- source_word: וַיַּכֶּהָ לְפִי חֶרֶב
  choice: அதையும் ... வாள்முனையால் வெட்டி வீழ்த்தினான்
  rationale: נכה என்பதன் தாக்குதல்/வீழ்த்துதல் பொருளையும், ‘வாளின் வாய்’ என்ற மரபுத்தொடரின் கூர்முனை உருவகத்தையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: כָּל הַנֶּפֶשׁ אֲשֶׁר בָּהּ
  choice: அதிலிருந்த ஒவ்வொருவரையும்
  rationale: נֶפֶשׁ இங்கு உடலிலிருந்து பிரிந்த ‘ஆத்துமா’ அல்ல, நகரிலிருந்த உயிருள்ள மனிதர்களைக் கூட்டாகக் குறிக்கிறது.
- source_word: כְּכֹל אֲשֶׁר עָשָׂה לְלִבְנָה
  choice: லிப்னாவுக்குச் செய்தது போலவே அதற்கும் செய்தான்
  rationale: மூலத்தின் ஒருமை வினையையும் முந்தைய நகரத்தோடு செய்யப்படும் முழுமையான ஒப்பீட்டையும் தக்கவைக்கிறது.
theological_decisions:
- issue: வெற்றிகொள்ளப்பட்ட நகரின் குடிகளை அழித்ததைக் குறிக்கும் சொற்றொடர்
  choice: அதிலிருந்த ஒவ்வொருவரையும்
  alternative: அதிலிருந்த ஒவ்வோர் ஆத்துமாவையும்
  rationale: எபிரெய נֶפֶשׁ இவ்விடத்தில் மனிதர்களைக் குறிக்கிறது. ‘ஒவ்வொருவரையும்’ என்பது நவீன வாசகர் தவறான உடல்–ஆத்துமா வேறுபாட்டைப் புரிந்துகொள்வதைத் தவிர்க்கிறது; அதேவேளையில் நிகழ்வின் கடுமையை மென்மைப்படுத்தவில்லை.
- issue: லாகீசைக் கைப்பற்றி தாக்கிய ஒருமை எழுவாய்
  choice: யோசுவா
  alternative: அவன் / இஸ்ரவேல்
  rationale: எபிரெய வினைகள் ஒருமையில் உள்ளன; முந்தைய சூழலில் யோசுவாவே இஸ்ரவேலின் பிரதிநிதித் தலைவராகச் செயல்படுகிறார். தமிழில் வெறும் ஒருமைப் பிரதிப்பெயர் உடனே ‘யாவே’யைக் குறிப்பதாகத் தவறாகப் புரியக்கூடும் என்பதால், சூழலில் உள்ள எழுவாய் வெளிப்படையாகக் கொடுக்கப்பட்டது; இறுதி ஒப்பீட்டின் ஒருமையும் காக்கப்பட்டது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான உரைநடை பயன்படுத்தப்பட்டது. எபிரெய இராணுவ மரபுத்தொடர்களின் உருவகம் இயன்றவரை காக்கப்பட்டாலும், ‘ஆத்துமா’ போன்ற இன்றைய வாசகரைத் தவறாக வழிநடத்தக்கூடிய சொல் தவிர்க்கப்பட்டது.
