  source_fidelity: 'வரைவில் முக்கிய சொற்களும் கருத்தும் சரியாக உள்ளன: யாவே, மனிதனின் குரலுக்குச் செவிகொடுத்தல், இஸ்ரவேலுக்காகப் போரிடுதல் ஆகியவை எபிரெய மூலத்துடன் ஒத்துப்போகின்றன. ஆனால் லִשְׁמֹעַ யாவே... என்ற infinitive clause, ஒப்பற்ற ‘அந்த நாள்’ என்பதன் வரையறை/தனிச்சிறப்பு ஆகும். தற்போதைய தமிழில் அது தனி வாக்கியமாகப் பிரிந்து, ‘ஏனெனில்’ இரு கூற்றுகளையும் ஒரேவிதமான காரணங்களாக இணைப்பதுபோல் வாசிக்கப்படுகிறது.'
  naturalness: ‘ஒரு மனிதனின் குரலுக்குச் செவிகொடுத்தார்’ என்பது நவீன நிலையான தமிழில் இயல்பானதும் கண்ணியமானதும் ஆகும். ஆனால் வாக்கிய அமைப்பை மாற்றினால் மூலத்தின் தொடர்பும் தமிழ் நடை ஓட்டமும் தெளிவாகும்.
  terminology: ‘யாவே’ என்பது மூலத்தின் தனிப்பட்ட தெய்வீகப் பெயரைச் சரியாகக் காக்கிறது. ‘இஸ்ரவேலுக்காகப் போரிட்டார்’ என்பது נִלְחָם לְיִשְׂרָאֵל என்பதற்கு ஏற்றது. ‘மனிதன்’ என்பது אִישׁ என்பதன் ஒருமை, மனிதப் பேச்சாளரைக் குறிப்பதையும் பாதுகாக்கிறது.
