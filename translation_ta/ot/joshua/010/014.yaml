  yaml_path: translation/ot/joshua/010/014.yaml
  text: And there was no day like that before it or after it[a], when Yahweh listened to the voice of a man, for Yahweh fought for Israel.
translation:
  language: ta
  text: யாவே ஒரு மனிதனின் குரலுக்குச் செவிகொடுத்ததுபோன்ற நாள் அதற்கு முன்பும் பின்பும் இருந்ததில்லை[a]; ஏனெனில், யாவே இஸ்ரவேலுக்காகப் போரிட்டார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஒரு மனிதனின் வேண்டுகோளை யாவே ஏற்றதுபோன்ற நாள் அதற்கு முன்பும் பின்பும் இருந்ததில்லை.” எபிரெய மூலத்தில் சொல்லுக்கு சொல், “ஒரு மனிதனின் குரலுக்குச் செவிகொடுக்க” என்று உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלֹא הָיָה
  choice: இருந்ததில்லை
  rationale: எதிர்மறை இருப்புக் கூற்றை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: כַּיּוֹם הַהוּא
  choice: அந்த நாளைப் போன்ற ஒரு நாள்
  rationale: כְּ ஒப்புமையின் வலிமையையும் குறிப்பிட்ட அந்த நாளின் தனித்தன்மையையும் காக்கிறது.
- source_word: לְפָנָיו וְאַחֲרָיו
  choice: அதற்கு முன்பும் பின்பும்
  rationale: பின்னொட்டுகள் உடனடி முன்னிலையான ‘நாள்’ என்பதையே குறிப்பதாக இயல்பாக எடுத்துக்கொள்கிறது.
- source_word: לִשְׁמֹעַ יְהוָה בְּקוֹל אִישׁ
  choice: ஒரு மனிதனின் குரலுக்கு யாவே செவிகொடுத்தார்
  rationale: ‘ஒரு மனிதனின் குரலைக் கேட்பது’ என்ற எபிரெய மரபுத்தொடரை நெருக்கமாகக் காத்து, இச்சூழலில் வேண்டுகோளை ஏற்றுச் செயல்பட்ட பொருளையும் இயல்பாக உணர்த்துகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரை பட்டப்பெயரால் மாற்றாமல் அதன் பெயர்வடிவில் வழங்குகிறது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: அந்த நாள் ஒப்பற்றதாக இருந்ததற்கான விளக்கக் காரணத்தைத் தெளிவாக இணைக்கிறது.
- source_word: נִלְחָם לְיִשְׂרָאֵל
  choice: இஸ்ரவேலுக்காகப் போரிட்டார்
  rationale: לְ இங்கே இஸ்ரவேலின் சார்பாக அல்லது நலனுக்காகப் போரிடுதலைக் குறிப்பதை இயல்பான தமிழில் தருகிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் உள்ள தனிப்பட்ட தெய்வீகப் பெயரைத் தெளிவாகவும் மதிப்புடனும் காக்கிறது.
- issue: לִשְׁמֹעַ ... בְּקוֹל אִישׁ என்பதன் பொருள்
  choice: ஒரு மனிதனின் குரலுக்கு யாவே செவிகொடுத்தார்
  alternative: ஒரு மனிதனின் வேண்டுகோளை யாவே ஏற்றார்
  rationale: கடவுள் மனிதனுக்குக் கீழ்ப்படிந்தார் என்று தேவையின்றி பொருள் தீர்மானிக்காமல், எபிரெயச் சொற்றொடரின் உண்மையான திறந்த தன்மையைக் காக்கிறது; சூழலில் அது வேண்டுகோளை ஏற்றதைக் குறிக்கலாம்.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான வேதாகம நடையில் வடிவமைக்கப்பட்டது. ‘செவிகொடுத்தார்’ என்பது மூல மரபுத்தொடரைப் பாதுகாத்தபடியே இயல்பான தமிழில் அதன் சூழற்பொருளை உணர்த்துகிறது.
