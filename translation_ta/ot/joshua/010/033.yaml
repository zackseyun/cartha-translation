translation_notes:
  register: நவீன நிலையான தமிழில், கண்ணியமான கதைநடை பயன்படுத்தப்பட்டது. ‘ராஜா’ மற்றும் வழக்கில் நிலைபெற்ற வேதாகமப் பெயரெழுத்துகள் வாசகர் புரிதலுக்காகத் தேர்ந்தெடுக்கப்பட்டன. அடிக்குறிப்பு குறியீடு அது விளக்கும் ‘தப்பிப் பிழைத்தவன்’ என்ற சொல்லுக்குப் பின் வைக்கப்பட்டது.
