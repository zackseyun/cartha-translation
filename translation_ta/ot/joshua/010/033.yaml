base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/033.yaml
  text: Then Horam king of Gezer went up to help Lachish[a], and Joshua struck him and his people until he left him no survivor.
translation:
  language: ta
  text: அப்போது கேசேரின் அரசனான ஓராம், லாகீசுக்கு உதவிசெய்ய மேலே சென்றான். யோசுவா அவனையும் அவனுடைய மக்களையும் தாக்கி, அவனுக்கு ஒரு தப்பிப் பிழைத்தவரையும் விட்டுவைக்கவில்லை.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எஞ்சியிருந்த ஒருவரையும்.” எபிரெயச் சொல் שָׂרִיד உயிர் தப்பியவரையோ எஞ்சியிருந்தவரையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  choice: அப்போது
  rationale: அடுத்த நிகழ்வை அறிமுகப்படுத்தும் கால/கதைத் தொடர்ச்சி வினையடை; இயல்பான நவீனத் தமிழில் தொடர்ச்சியைத் தெளிவாகக் காட்டுகிறது.
- source_word: עָלָה
  choice: புறப்பட்டு வந்தான்
  rationale: வினைச்சொல் அடிப்படையில் ‘ஏறிச் செல்/மேலே செல்’ என்றாலும், இங்கு போர்சார் முன்னேற்றத்தைக் குறிக்கிறது. தமிழில் இடப்பார்வை குழப்பமின்றி இயக்கத்தை இயல்பாகத் தெரிவிக்க இவ்வாறு மொழிபெயர்க்கப்பட்டது; ‘மேலே வந்தான்’ என்பதும் சாத்தியம்.
- source_word: הֹרָם
  choice: ஓராம்
  rationale: எபிரெயத் தனிப்பெயரின் ஒலியைத் தமிழில் நெருக்கமாக எழுத்துப்பெயர்த்தல்.
- source_word: מֶלֶךְ גֶּזֶר
  choice: கேசேரின் ராஜாவான
  rationale: அரசப் பதவியையும் நகரத்துடனான தொடர்பையும் இயல்பான தமிழ் உடைமைத் தொடரால் காட்டுகிறது.
- source_word: לַעְזֹר אֶת לָכִישׁ
  choice: லாகீசுக்கு உதவிசெய்ய
  rationale: עזר என்பதன் நேரடியான பொருள் உதவுதல்; இராணுவ உதவி என்பதைச் சூழல் உணர்த்தினாலும் உரையில் இல்லாத ‘படை’ போன்ற சொல்லைச் சேர்க்கவில்லை.
- source_word: וַיַּכֵּהוּ
  choice: அவனைத் தாக்கி
  rationale: נכה என்பதன் ‘அடி/தாக்கு/வீழ்த்து’ என்ற சொல்லுருவைத் தக்கவைக்கிறது; தோல்வியின் முழுமையை அடுத்த கூறு விளக்குகிறது.
- source_word: וְאֶת עַמּוֹ
  choice: அவனுடைய மக்களையும்
  rationale: עַם என்பது பொதுவாக ‘மக்கள்’; சூழலில் படையினரை உள்ளடக்கலாம் என்றாலும் ‘படை’ என்று பொருளைக் குறுக்கவில்லை.
- source_word: עַד בִּלְתִּי הִשְׁאִיר לוֹ
  choice: அவனுக்காக ... ஒருவனையும் விட்டுவைக்கவில்லை
  rationale: தாக்குதலின் விளைவு அல்லது எல்லையைத் தெரிவிக்கும் எபிரெயக் கட்டமைப்பை இயல்பான தமிழ் எதிர்மறை வாக்கியமாக வழங்குகிறது.
- source_word: שָׂרִיד
  choice: தப்பிப் பிழைத்தவன்
  rationale: உயிர் தப்பி எஞ்சிய ஒருவரைச் சுட்டும் சொல்லின் பொருளை நவீனத் தமிழில் தெளிவாகத் தெரிவிக்கிறது; ‘எஞ்சியவன்’ என்ற பரந்த மாற்றும் சாத்தியம்.
