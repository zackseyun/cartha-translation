- from: அப்போது கேசேரின் ராஜாவான ஓராம், லாகீசுக்கு உதவிசெய்யப் புறப்பட்டு வந்தான். யோசுவா அவனையும் அவனுடைய மக்களையும் தாக்கி, அவனுக்காகத் தப்பிப் பிழைத்தவன் ஒருவனையும் விட்டுவைக்கவில்லை.[a]
  to: அப்போது கேசேரின் அரசனான ஓராம், லாகீசுக்கு உதவிசெய்ய மேலே சென்றான். யோசுவா அவனையும் அவனுடைய மக்களையும் தாக்கி, அவனுக்கு ஒரு தப்பிப் பிழைத்தவரையும் விட்டுவைக்கவில்லை.[a]
  rationale: The revision restores the lexical force of עָלָה (“went up”) and clarifies the dative/possessive force of לוֹ (“for/to him”) while preserving the source’s concise narrative sequence and the lexical alternative for שָׂרִיד. The footnote marker remains immediately after the phrase it explains.
