  text: וַ/יֵּאָסְפ֨וּ וַֽ/יַּעֲל֜וּ חֲמֵ֣שֶׁת מַלְכֵ֣י הָ/אֱמֹרִ֗י מֶ֣לֶךְ יְרוּשָׁלִַ֜ם מֶֽלֶךְ חֶבְר֤וֹן מֶֽלֶךְ יַרְמוּת֙ מֶֽלֶךְ לָכִ֣ישׁ מֶֽלֶךְ עֶגְל֔וֹן הֵ֖ם וְ/כָל מַֽחֲנֵי/הֶ֑ם וַֽ/יַּחֲנוּ֙ עַל גִּבְע֔וֹן וַ/יִּֽלָּחֲמ֖וּ עָלֶֽי/הָ׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/005.yaml
  text: So the five kings of the Amorites—the king of Jerusalem[a], the king of Hebron, the king of Jarmuth, the king of Lachish, and the king of Eglon—gathered together and went up, they and all their armies; and they encamped against Gibeon and fought against it.
translation:
  language: ta
  text: அப்போது எருசலேமின் ராஜா, எப்ரோனின் ராஜா, யர்மூத்தின் ராஜா, லாகீசின் ராஜா, எக்லோனின் ராஜா ஆகிய எமோரியரின் ஐந்து ராஜாக்களும் அவர்களுடைய எல்லாப் படைகளும் ஒன்றுகூடி மேலே சென்றார்கள்; கிபியோனுக்கு எதிராக முகாமிட்டு, அதற்கு எதிராகப் போரிட்டார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּאָסְפוּ
  choice: ஒன்றுகூடி
  rationale: நிபால் வடிவத்தின் கூட்டாக ஒன்றுசேரும் பொருளை இயல்பான தமிழில் தருகிறது; முறையான கூட்டணி அமைத்தனர் என்று தேவைக்கு மேல் விளக்கவில்லை.
- source_word: וַיַּעֲלוּ
  choice: மேலே சென்றார்கள்
  rationale: עלה என்பதன் அடிப்படைத் திசைப் பொருளைப் பாதுகாக்கிறது; நிலவியல் ஏற்றமா அல்லது வழக்கமான திசைச் சொல்லாட்சியா என்ற தெளிவின்மையைத் தீர்த்துவிடவில்லை.
- source_word: חֲמֵשֶׁת מַלְכֵי הָאֱמֹרִי
  choice: எமோரியரின் ஐந்து ராஜாக்கள்
  rationale: எண்ணிக்கையையும் இன அடையாளத்தையும் எபிரெயக் கட்டமைப்பின் உறவையும் தெளிவாகப் பாதுகாக்கிறது.
- source_word: מֶלֶךְ יְרוּשָׁלִַם ... מֶלֶךְ עֶגְלוֹן
  choice: எருசலேமின் ராஜா ... எக்லோனின் ராஜா
  rationale: ஒவ்வொரு ஆட்சியாளரையும் தனித்தனியாகச் சுட்டும் எபிரெய மறுபதிப்பைத் தக்கவைக்கிறது.
- source_word: הֵם וְכָל מַחֲנֵיהֶם
  choice: அவர்களும் அவர்களுடைய எல்லாப் படைகளும்
  rationale: מַחֲנֶה என்பதன் நேரடி பொருள் ‘முகாம்’ என்றாலும், இப்போர்ச் சூழலில் அது முகாம்களாக ஒழுங்குபடுத்தப்பட்ட படைகளைச் சுட்டுகிறது; தமிழில் ‘படைகள்’ இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: וַיַּחֲנוּ עַל גִּבְעוֹן
  choice: கிபியோனுக்கு எதிராக முகாமிட்டு
  rationale: அடுத்து வரும் போரிடுதலின் சூழலில் עַל பகைமை சார்ந்த ‘எதிராக’ என்ற பொருளைக் கொண்டுள்ளது.
- source_word: וַיִּלָּחֲמוּ עָלֶיהָ
  choice: அதற்கு எதிராகப் போரிட்டார்கள்
  rationale: நகரைக் குறிக்கும் பெண்பால் பின்னொட்டை தமிழின் இயல்புப்படி அஃறிணை ‘அது’ எனத் தருகிறது; போர் சார்ந்த வழக்கமான வினைப்பொருளைத் தக்கவைக்கிறது.
