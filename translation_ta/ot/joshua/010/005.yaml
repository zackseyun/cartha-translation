translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான உரைநடை. இடப்பெயர்கள் தமிழ் வேதாகம மரபில் பரவலாக அறியப்படும் வடிவங்களுக்கு நெருக்கமாக ஒலிபெயர்க்கப்பட்டுள்ளன. ‘ராஜா’ என்பது பட்டியலின் மீளுரைப்பையும் பண்டைய அரசியல் சூழலையும் இயல்பாகத் தக்கவைக்கிறது.
