base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/023.yaml
  text: 'And they did so, and brought out to him from the cave these five kings: the king of Jerusalem, the king of Hebron, the king of Jarmuth, the king of Lachish, and the king of Eglon.'
translation:
  language: ta
  text: 'அவர்கள் அவ்வாறே செய்து, இந்த ஐந்து அரசர்களைக் குகையிலிருந்து அவரிடம் கொண்டுவந்தார்கள்: எருசலேமின் அரசன், எபிரோனின் அரசன், யர்மூத்தின் அரசன், லாகீசின் அரசன், எக்லோனின் அரசன்.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲשׂוּ כֵן
  choice: அவர்கள் அப்படியே செய்து
  rationale: முந்தைய கட்டளைக்குக் கீழ்ப்படிந்து அதன்படியே செயல்பட்டதைக் குறிக்கும் எபிரெயக் கதைநடைத் தொடரை இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: וַיֹּצִיאוּ
  choice: கொண்டுவந்தார்கள்
  rationale: ஹிஃபில் வடிவின் ‘வெளியே வரச்செய்தல்/வெளியே கொண்டுவருதல்’ என்ற பொருளை, குகையிலிருந்து ஒருவரிடம் அழைத்துவரும் சூழலில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: אֵלָיו
  choice: அவரிடம்
  rationale: எபிரெயில் நேரடியாக ‘அவரிடம்’ என்று உள்ளது; சூழலில் அது யோசுவாவைக் குறித்தாலும், பெயரை வசனத்தில் சேர்க்காமல் மூலத்தின் சுட்டுப்பெயரைப் பேணுகிறது.
- source_word: חֲמֵשֶׁת הַמְּלָכִים הָאֵלֶּה
  choice: அந்த ஐந்து அரசர்களையும்
  rationale: கதையில் ஏற்கெனவே அடையாளப்படுத்தப்பட்ட அரசர்களைக் குறிக்கும் சுட்டுச் சொல்லைத் தமிழில் இயல்பாக ‘அந்த’ என்று தருகிறது; מֶלֶךְ என்பதற்கு ‘அரசன்’ துல்லியமான இணை.
- source_word: מִן הַמְּעָרָה
  choice: குகையிலிருந்து
  rationale: உள்ளிருந்து வெளியே கொண்டுவரப்பட்ட இடத்தைச் சுருக்கமாகவும் துல்லியமாகவும் குறிக்கிறது.
- source_word: יְרוּשָׁלַם
  choice: எருசலேம்
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் பரவலாக அறியப்படும் இடப்பெயர் வடிவம்.
- source_word: חֶבְרוֹן
  choice: எப்ரோன்
  rationale: எபிரெய இடப்பெயருக்கான தமிழில் நிலைபெற்ற ஒலிபெயர்ப்பு.
- source_word: יַרְמוּת
  choice: யர்மூத்
  rationale: எபிரெய மெய்யொலி மற்றும் நீள்வொலியை நெருக்கமாகப் பேணும் தமிழ் ஒலிபெயர்ப்பு.
- source_word: לָכִישׁ
  choice: லாகீஸ்
  rationale: எபிரெய இடப்பெயரின் ஒலியை நெருக்கமாகத் தரும் தமிழ் வடிவம்.
- source_word: עֶגְלוֹן
  choice: எக்லோன்
  rationale: இங்கு நகரத்தைக் குறிக்கும் எபிரெயப் பெயரின் தெளிவான தமிழ் ஒலிபெயர்ப்பு.
