revisions:
- from: 'அவர்கள் அப்படியே செய்து, அந்த ஐந்து அரசர்களையும் குகையிலிருந்து அவரிடம் கொண்டுவந்தார்கள்: எருசலேமின் அரசன், எப்ரோனின் அரசன், யர்மூத்தின் அரசன், லாகீசின் அரசன், எக்லோனின் அரசன்.'
  to: 'அவர்கள் அவ்வாறே செய்து, இந்த ஐந்து அரசர்களைக் குகையிலிருந்து அவரிடம் கொண்டுவந்தார்கள்: எருசலேமின் அரசன், எபிரோனின் அரசன், யர்மூத்தின் அரசன், லாகீசின் அரசன், எக்லோனின் அரசன்.'
  rationale: The revision preserves the Hebrew narrative syntax and avoids adding Joshua’s name where the source uses only a pronoun. It corrects the demonstrative to “இந்த” for “these” and standardizes Hebron as “எபிரோன்,” while retaining the concise, dignified narrative register and the five-part appositional list.
