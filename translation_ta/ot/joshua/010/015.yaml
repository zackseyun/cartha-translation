base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/015.yaml
  text: Then Joshua returned[a], and all Israel with him, to the camp at Gilgal.
translation:
  language: ta
  text: பின்பு யோசுவாவும், அவரோடு இஸ்ரவேலர் அனைவரும் கில்காலிலுள்ள முகாமுக்குத் திரும்பினர்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: யோசுவா 10:43-இலும் கில்காலுக்குத் திரும்பியதைப் பற்றிய இதேபோன்ற குறிப்பு வருகிறது. எனவே, சிலர் இந்த வசனத்தை முன்கூட்டியே சொல்லப்பட்ட குறிப்பாகவோ உரையில் இடம்மாறிய குறிப்பாகவோ கருதுகின்றனர். இருப்பினும், இங்குள்ள எபிரெய உரை இருப்பதுபோலவே மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: textual_variant
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: பின்பு ... திரும்பினார்கள்
  rationale: שׁוב என்ற வினையின் தொடர்கதை வடிவம், முன்பு இருந்த இடத்திற்குத் திரும்பிச் சென்ற அடுத்த நிகழ்வைக் குறிக்கிறது. கூட்டு எழுவாய்க்கு இயல்பான தமிழ்ப் பன்மை வினை பயன்படுத்தப்பட்டது.
- source_word: יְהוֹשֻׁעַ
  choice: யோசுவா
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் நிலைபெற்றுள்ள பெயர் வடிவம்.
- source_word: וְכָל יִשְׂרָאֵל
  choice: இஸ்ரவேலர் அனைவரும்
  rationale: எபிரெயச் சொற்றொடரின் கூட்டுப்பொருளை இயல்பான நவீன தமிழில் தருகிறது; அது போர்வீரர்களைக் குறிக்கிறதா முழு மக்களையும் குறிக்கிறதா என்பதை மொழிபெயர்ப்பு தேவையின்றி தீர்மானிக்கவில்லை.
- source_word: עִמּוֹ
  choice: அவரோடு
  rationale: עם என்ற முன்னிடைச்சொல்லையும் மூன்றாம் நபர் ஆண்பால் ஒருமை பின்னொட்டையும் நேரடியாகவும் மரியாதையான தமிழிலும் தருகிறது.
- source_word: אֶל הַמַּחֲנֶה
  choice: முகாமுக்கு
  rationale: מַחֲנֶה இங்கு படையினர் தங்கியிருக்கும் முகாமைக் குறிக்கிறது; 'முகாம்' என்பது இயல்பான நவீனத் தமிழ்.
- source_word: הַגִּלְגָּלָה
  choice: கில்காலிலிருந்த
  rationale: இடப்பெயரின் திசைநோக்குப் பின்னொட்டு கில்காலை நோக்கிய இயக்கத்தைக் காட்டுகிறது. 'கில்காலிலிருந்த முகாமுக்கு' என்பது தமிழில் இயல்பாகவும் துல்லியமாகவும் அமைகிறது.
theological_decisions:
- issue: யோசுவா 10:43-இல் உள்ள ஒத்த திரும்புதல் குறிப்புடன் இதன் கதைநிலைத் தொடர்பு
  choice: மசோரா எபிரெய உரையில் இருப்பதுபோல வசனத்தை விடாமல், ஒத்திசைக்காமல் மொழிபெயர்த்தல்
  alternative: 10:43-இல் இதேபோன்ற குறிப்பு வருவதால், இதை முன்கூட்டிய குறிப்பாகவோ உரையில் இடம்மாறியதாகவோ கருதுதல்
  rationale: இது நேரடியான கோட்பாட்டுச் சிக்கல் அல்ல; இலக்கிய மற்றும் உரைவரலாற்றுச் சிக்கல். பெறப்பட்ட எபிரெய உரையை முதன்மை உரையில் அப்படியே பிரதிநிதித்துவப்படுத்தி, விவாதத்தை அடிக்குறிப்பில் குறிப்பிடுவது பொருத்தமானது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் கண்ணியமான நடை. எபிரெயத்தின் ஒருமை வினை மற்றும் கூட்டு எழுவாயை சொற்சொல்லாகப் பின்பற்றாமல், தமிழின் இயல்பான ஒத்திசைவுக்காகப் பன்மை வினை பயன்படுத்தப்பட்டுள்ளது; உரைநிலைச் சிக்கல் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
