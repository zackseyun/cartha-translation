revisions:
- from: இவ்வாறு யோசுவா மலைநாடு, நெகேவ், தாழ்நிலம், சரிவுப் பகுதிகள் ஆகிய நாடெங்கையும், அப்பகுதிகளின் அரசர்கள் அனைவரையும் தாக்கினார். அவர் உயிர்தப்பியவர் எவரையும் விட்டுவைக்கவில்லை; மூச்சுள்ள அனைத்தையும்[a] அழிவுக்கென அர்ப்பணித்தார்[b]. இஸ்ரவேலின் கடவுளாகிய யாவே கட்டளையிட்டபடியே அவர் செய்தார்.
  to: யோசுவா நாடு முழுவதையும்—மலைநாடு, நெகேவ், தாழ்நிலம், சரிவுப் பகுதிகள்—அவற்றின் அரசர்கள் அனைவரையும் தாக்கினார். அவர் உயிர்தப்பியவர் எவரையும் விட்டுவைக்கவில்லை; இஸ்ரவேலின் கடவுளாகிய யாவே கட்டளையிட்டபடியே, மூச்சுள்ள அனைத்தையும்[a] அழிவுக்கென அர்ப்பணித்தார்[b].
  rationale: The revision removes an unsupported introductory connective, clarifies the apposition between “all the land” and its named regions, and places the divine-command clause directly with the act of devoting to destruction. It retains the source’s severe and deliberately broad “every breathing thing” language without interpretively narrowing it.
