  text: וַ/יַּכֶּ֣ה יְהוֹשֻׁ֣עַ אֶת כָּל הָ/אָ֡רֶץ הָ/הָר֩ וְ/הַ/נֶּ֨גֶב וְ/הַ/שְּׁפֵלָ֜ה וְ/הָ/אֲשֵׁד֗וֹת וְ/אֵת֙ כָּל מַלְכֵי/הֶ֔ם לֹ֥א הִשְׁאִ֖יר שָׂרִ֑יד וְ/אֵ֤ת כָּל הַ/נְּשָׁמָה֙ הֶחֱרִ֔ים כַּ/אֲשֶׁ֣ר צִוָּ֔ה יְהוָ֖ה אֱלֹהֵ֥י יִשְׂרָאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/040.yaml
  text: So Joshua struck all the land—the hill country[a], the Negev, the lowland, and the slopes—and all their kings. He left no survivor, but devoted to destruction every breathing thing, just as Yahweh, the God of Israel[b], had commanded.
translation:
  language: ta
  text: யோசுவா நாடு முழுவதையும்—மலைநாடு, நெகேவ், தாழ்நிலம், சரிவுப் பகுதிகள்—அவற்றின் அரசர்கள் அனைவரையும் தாக்கினார். அவர் உயிர்தப்பியவர் எவரையும் விட்டுவைக்கவில்லை; இஸ்ரவேலின் கடவுளாகிய யாவே கட்டளையிட்டபடியே, மூச்சுள்ள அனைத்தையும்[a] அழிவுக்கென அர்ப்பணித்தார்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘மூச்சுவிட்ட அனைத்தையும்.’ எபிரெயச் சொற்றொடர் சொல்லடியாக ‘எல்லா மூச்சையும்’ அல்லது ‘மூச்சுள்ள அனைத்தையும்’ குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘முற்றிலும் அழித்தார்’ அல்லது ‘அழிவுத் தடைக்கு உட்படுத்தினார்.’ எபிரெய வினை, ஒன்றை மீட்க முடியாதபடி அழிவுக்கென ஒதுக்குவதைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּכֶּה
  choice: தாக்கினார்
  rationale: נכה என்ற வினை போரில் தாக்குதல் அல்லது அடித்து வீழ்த்துதலைக் குறிக்கிறது. ‘தாக்கினார்’ என்பது இராணுவச் சூழலின் வலிமையைத் தக்கவைத்தபடியே, வினை தனியாகச் சொல்லாத விளைவுகளைச் சேர்ப்பதைத் தவிர்க்கிறது.
- source_word: כָּל הָאָרֶץ
  choice: நாடெங்கையும்
  rationale: இங்கு אֶרֶץ என்பது முழு பூமியை அல்ல, விவரிக்கப்படும் பிராந்திய நிலப்பரப்பைக் குறிக்கிறது. தொடர்ந்து வரும் நிலவியல் பட்டியலுடன் ‘நாடெங்கையும்’ இயல்பாக இணைகிறது.
- source_word: הָהָר
  choice: மலைநாடு
  rationale: யோசுவா நூலில் இது பொதுவாக ஒரு நிலவியல் பிராந்தியப் பெயராக வருகிறது; ‘மலைநாடு’ அந்தப் பொருளைத் தெளிவாகத் தருகிறது.
- source_word: הַנֶּגֶב
  choice: நெகேவ்
  rationale: இச்சூழலில் நெகேவ் தெற்கிலுள்ள வறண்ட பிராந்தியத்தின் பெயர். எனவே பொதுவான ‘தென்பகுதி’ என்பதற்குப் பதிலாக இடப்பெயர் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: הַשְּׁפֵלָה
  choice: தாழ்நிலம்
  rationale: மலைநாட்டுக்கும் கடற்கரைக்கும் இடையிலுள்ள தாழ்வான பிராந்தியத்தைச் சுட்டும் சொல்லுக்கு எளிதில் புரியும் நவீனத் தமிழ் வடிவம்.
- source_word: הָאֲשֵׁדוֹת
  choice: சரிவுப் பகுதிகள்
  rationale: אֲשֵׁדוֹת என்பது சரிவுகள் அல்லது இறக்கமான நிலப்பகுதிகளைக் குறிக்கிறது. நிலவியல் பட்டியலில் ‘சரிவுப் பகுதிகள்’ தெளிவாக அமைகிறது.
- source_word: כָּל מַלְכֵיהֶם
  choice: அப்பகுதிகளின் அரசர்கள் அனைவரையும்
  rationale: எபிரெயச் சுட்டுப்பெயரின் முன்னிலையைத் தமிழில் தெளிவாக்கி, כָּל என்பதன் முழுமையையும் பாதுகாக்கிறது.
- source_word: לֹא הִשְׁאִיר שָׂרִיד
  choice: உயிர்தப்பியவர் எவரையும் விட்டுவைக்கவில்லை
  rationale: שָׂרִיד போர்ச் சூழலில் உயிர்தப்பியவர் அல்லது எஞ்சியவர் எனப் பொருள்படும். இந்த வடிவம் இயல்பான தமிழிலும் மூலத்தின் கடுமையைக் குறைக்காமலும் உள்ளது.
- source_word: כָּל הַנְּשָׁמָה
  choice: மூச்சுள்ள அனைத்தையும்
  rationale: சொல்லடியாக ‘மூச்சுள்ள அனைத்தும்’ எனும் எபிரெய மரபுத்தொடரை, ‘மனிதர்கள்’ என்று விளக்கவுரை செய்து குறுக்காமல் பாதுகாக்கிறது.
- source_word: הֶחֱרִים
  choice: அழிவுக்கென அர்ப்பணித்தார்
  rationale: חרם என்பதில் வெறும் கொலையைத் தாண்டி, மீட்க முடியாதபடி அழிவுக்கு ஒதுக்கும் சமய-போரியல் நுண்பொருள் உள்ளது. ‘அழிவுக்கென அர்ப்பணித்தார்’ அதைத் தக்கவைக்கிறது; அடிக்குறிப்பு அதன் செயல்விளைவைத் தெளிவாக்குகிறது.
- source_word: כַּאֲשֶׁר צִוָּה
  choice: கட்டளையிட்டபடியே
  rationale: முன்னர் கொடுக்கப்பட்ட தெய்வீகக் கட்டளைக்கு முழுமையாக இணங்கியதை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: நான்கெழுத்துத் தெய்வீகப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் வழக்கமான ஒலிபெயர்ப்பாக வழங்குகிறது.
theological_decisions:
- issue: חרם என்ற போரியல் சொல்லின் மொழிபெயர்ப்பு
  choice: அழிவுக்கென அர்ப்பணித்தார்
  alternative: முற்றிலும் அழித்தார்; அழிவுத் தடைக்கு உட்படுத்தினார்
  rationale: மூலத்தில் உள்ள சமயச் சார்புடைய போரியல் நுண்பொருளைத் தட்டையாக்காமலும், புரியாத தொழில்நுட்பச் சொல்லாக மட்டும் விடாமலும் இந்தத் தேர்வு பாதுகாக்கிறது.
- issue: כָּל הַנְּשָׁמָה என்பதன் வரம்பு
  choice: மூச்சுள்ள அனைத்தையும்
  alternative: ஒவ்வொரு மனிதரையும்; மூச்சுவிட்ட அனைத்தையும்
  rationale: யாரை அல்லது எதை உள்ளடக்குகிறது என்பதை விளக்கவுரை மூலம் குறுக்காமல், எபிரெய மொழியின் பரந்ததும் கடுமையானதுமான சொல்லாட்சியைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் வேதாகம வரலாற்றுரைக்கு ஏற்ற கண்ணியமான நடையிலும் மொழிபெயர்க்கப்பட்டுள்ளது. எபிரெய மூலத்தின் புவியியல் வரிசை, முழுமையைக் குறிக்கும் சொற்கள், חרם சொல்லின் சமய-போரியல் பதற்றம் ஆகியவை மென்மைப்படுத்தப்படவில்லை. வழங்கப்பட்ட ஆங்கில ஆலோசனை உரையில் அடிக்குறிப்புக் குறிகள் பொருந்தாத இடங்களில் இருந்ததால், [a] ‘மூச்சுள்ள அனைத்தையும்’ என்பதற்குப் பின்னும் [b] ‘அழிவுக்கென அர்ப்பணித்தார்’ என்பதற்குப் பின்னும் அவற்றின் உண்மையான பொருளுக்கு ஏற்ப அமைக்கப்பட்டுள்ளன.
