base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/035.yaml
  text: And they captured it that day and struck it with the edge of the sword[a], and every person who was in it he devoted to destruction that day[b], according to all that he had done to Lachish.
translation:
  language: ta
  text: அன்றே அவர்கள் அதைக் கைப்பற்றி, வாளால் அதைத் தாக்கினார்கள். அதில் இருந்த ஒவ்வொருவரையும்[a] அன்றே அவன் அழிவுக்கென்று அர்ப்பணித்தான்[b]. லாகீசுக்கு அவன் செய்ததையெல்லாம் இதற்கும் செய்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரேயத்தில், “அதிலிருந்த ஒவ்வோர் நெஃபெஷையும்.” இங்கு அந்தச் சொல் நகரத்தில் இருந்த மனிதர்களைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “முற்றிலும் அழித்தான்.” எபிரேய வினை, தடை ஆணையின்கீழ் ஒன்றை அழிவுக்கென்று அர்ப்பணிப்பதைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּלְכְּדוּהָ
  choice: அவர்கள் அதைப் பிடித்து
  rationale: לכד என்பது போர்ச் சூழலில் ஒரு நகரத்தைக் கைப்பற்றுவதைக் குறிக்கிறது. இயல்பான தமிழில் ‘பிடித்து’ அந்தப் பொருளைத் தெளிவாகத் தருகிறது.
- source_word: בַּיּוֹם הַהוּא
  choice: அன்றே
  rationale: அதே நாளில் நிகழ்ந்ததை வலியுறுத்தும் எபிரெய காலச் சொல்லுக்கு இயல்பான, சுருக்கமான தமிழ் வடிவம்.
- source_word: וַיַּכּוּהָ לְפִי חֶרֶב
  choice: வாளின் முனையால் அதை வெட்டினார்கள்
  rationale: ‘வாளின் வாய்/முனை’ என்ற எபிரெய உருவகத்தை ஓரளவு காத்து, போரில் வாளால் தாக்கிக் கொன்ற பொருளையும் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: כָּל הַנֶּפֶשׁ אֲשֶׁר בָּהּ
  choice: அதில் இருந்த ஒவ்வொருவரையும்
  rationale: נֶפֶשׁ இங்கு உடலிலிருந்து வேறான ‘ஆத்துமா’ என்ற கருத்தைக் காட்டாமல், நகரத்தில் இருந்த மனிதர்களைக் குறிக்கிறது.
- source_word: הֶחֱרִים
  choice: அழிவுக்கென்று அர்ப்பணித்தான்
  rationale: חרם என்பதன் ஹிபீல் வடிவம் சாதாரண அழித்தலை மட்டும் அல்லாமல், தடை ஆணையின்கீழ் அழிவுக்கென்று ஒதுக்குவதைச் சுட்டுகிறது. இந்தத் தொழில்நுட்பமான சமயப் போர்ப் பொருளை மொழிபெயர்ப்பு காக்கிறது.
- source_word: כְּכֹל אֲשֶׁר עָשָׂה לְלָכִישׁ
  choice: லாகீசுக்கு அவன் செய்தபடியெல்லாம் இதற்கும் செய்தான்
  rationale: லாகீசுக்கு முன்பு செய்த செயலுடன் முழுமையான ஒப்புமையை כְּכֹל காட்டுகிறது; இயல்பான தமிழ் வாக்கிய அமைப்பில் அந்த ஒப்புமை வெளிப்படுத்தப்பட்டுள்ளது.
theological_decisions:
- issue: வெற்றிகொள்ளும் போர்ச் சூழலில் חרם/החרים என்பதன் மொழிபெயர்ப்பு
  choice: அழிவுக்கென்று அர்ப்பணித்தான்
  alternative: முற்றிலும் அழித்தான்; தடை ஆணைக்குள் வைத்தான்
  rationale: எபிரெய வினை வெறுமனே கொல்வதைவிட, அழிவுக்காக ஒதுக்கும் புனிதப் போர் சார்ந்த தனிப்பொருளைக் கொண்டுள்ளது. தேர்ந்த வடிவம் கூடுதல் கோட்பாட்டு விளக்கத்தை மூலவசனத்தில் திணிக்காமல் அந்த அழுத்தத்தைக் காக்கிறது.
- issue: மக்களைக் குறிக்கும் נֶפֶשׁ என்பதன் மொழிபெயர்ப்பு
  choice: ஒவ்வொருவரையும்
  alternative: ஒவ்வோர் ஆத்துமாவையும்; ஒவ்வோர் உயிரையும்
  rationale: இச்சூழலில் சொல் நகரத்தில் இருந்த மனிதர்களைக் குறிக்கிறது. ‘ஆத்துமா’ என்பது மூலத்தில் இல்லாத மனித இயல்பு குறித்த கோட்பாட்டுப் பொருளை வாசகருக்குத் தரக்கூடும்.
- issue: הֶחֱרִים மற்றும் עָשָׂה ஆகிய ஒருமை வினைகளின் எழுவாய்
  choice: அவன்
  alternative: அவர்கள்
  rationale: வசனத்தின் தொடக்கத்தில் படையினரைக் குறிக்கும் பன்மை வினைகள் வந்தாலும், பின்னர் எபிரெய உரை மூன்றாம் நபர் ஆண்பால் ஒருமைக்கு மாறுகிறது. அந்த இலக்கண மாற்றம் யோசுவாவைச் சுட்டுவதாகக் காக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிதில் புரியும், ஆனால் வேதாகம வரலாற்றுரைக்கு ஏற்ற கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. பன்மையிலிருந்து ஒருமைக்கு மாறும் எபிரெய இலக்கணம் திட்டமிட்டு பாதுகாக்கப்பட்டுள்ளது; எல்லா அடிக்குறிப்பு குறிகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
