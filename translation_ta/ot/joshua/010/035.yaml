revisions:
- from: அன்றே அவர்கள் அதைப் பிடித்து, வாளின் முனையால் அதை வெட்டினார்கள். அதில் இருந்த ஒவ்வொருவரையும்[a] அன்றே அவன் அழிவுக்கென்று அர்ப்பணித்தான்[b]. லாகீசுக்கு அவன் செய்தபடியெல்லாம் இதற்கும் செய்தான்.
