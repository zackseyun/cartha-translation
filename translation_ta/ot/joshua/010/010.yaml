source:
  edition: WLC
  text: וַ/יְהֻמֵּ֤/ם יְהוָה֙ לִ/פְנֵ֣י יִשְׂרָאֵ֔ל וַ/יַּכֵּ֥/ם מַכָּֽה גְדוֹלָ֖ה בְּ/גִבְע֑וֹן וַֽ/יִּרְדְּפֵ֗/ם דֶּ֚רֶךְ מַעֲלֵ֣ה בֵית חוֹרֹ֔ן וַ/יַּכֵּ֥/ם עַד עֲזֵקָ֖ה וְ/עַד מַקֵּדָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/010.yaml
  text: And Yahweh threw them into confusion before Israel[a], and struck them down with a great slaughter at Gibeon, and pursued them by the way of the ascent of Beth-horon, and struck them down as far as Azekah and Makkedah.
translation:
  language: ta
  text: யாவே இஸ்ரவேலின் முன்னிலையில் அவர்களைக் குழப்பமடையச் செய்து, கிபியோனில் அவர்களை மாபெரும் படுகொலையால் வீழ்த்தினார்; பெத்-ஓரோனின் ஏற்றப்பாதை வழியாக அவர்களைத் துரத்தி, அசேக்காவரையிலும் மக்கேதாவரையிலும் அவர்களை வீழ்த்தினார்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அவர்களைப் பீதியடையச் செய்தார்’ அல்லது ‘அவர்களை நிலைகுலையச் செய்தார்’ என்றும் மொழிபெயர்க்கலாம். எபிரேய வினை போரில் குழப்பத்தையோ பீதியையோ உண்டாக்குவதைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהֻמֵּם
  choice: அவர்களைக் குழப்பமடையச் செய்தார்
  rationale: ה־מ־ם என்ற வினை போரில் குழப்பம் அல்லது பீதியை உண்டாக்குவதைக் குறிக்கிறது. இந்தத் தேர்வு யாவேயின் நேரடியான செயலையும், எதிரிகளுக்கு ஏற்பட்ட மனக்கலக்கத்தையும் வெளிப்படுத்துகிறது; அதன் விளைவாகிய தோல்வியை மட்டும் கூறிவிடவில்லை.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரான நான்கெழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் இயல்பாக ஒலிபெயர்த்துள்ளது.
- source_word: לִפְנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலுக்கு முன்பாக
  rationale: எபிரேயச் சொல்லாட்சியைத் தக்கவைக்கிறது. இது இஸ்ரவேலின் முன்னிலையில் அல்லது அவர்களுக்கு எதிரே நிகழ்ந்ததைச் சுட்டலாம்; சூழலில் அவர்களுக்குச் சாதகமாக நடந்தது என்ற பொருளையும் தரக்கூடும்.
- source_word: וַיַּכֵּם
  choice: அவர்களை வீழ்த்தினார்
  rationale: போர்ச் சூழலில் נכה என்பது தாக்கி முறியடித்தல் அல்லது கொல்லுதல் எனப் பொருள்படலாம். ‘வீழ்த்தினார்’ வன்மையான ராணுவத் தோல்வியை இயல்பான தமிழில் தெரிவிக்கிறது; இரு occurrences-இலும் மறுமொழியைப் பேணுகிறது.
- source_word: מַכָּה גְדוֹלָה
  choice: பெருமளவில்
  rationale: மாபெரும் தாக்குதல் அல்லது படுகொலை என்ற போர்சார் வலிமையை, ‘வீழ்த்தினார்’ என்பதோடு இணைந்து இயல்பாக வெளிப்படுத்துகிறது; தனியே ‘அடி’ என்று மொழிபெயர்த்து பொருளை மங்கச் செய்யவில்லை.
- source_word: וַיִּרְדְּפֵם
  choice: அவர்களைத் துரத்தி
  rationale: தப்பிச் செல்லும் எதிரிகளைப் பின்தொடர்வதைக் குறிக்கும் வழக்கமான, தெளிவான போர்சார் தமிழ்.
- source_word: דֶּרֶךְ מַעֲלֵה בֵית חוֹרֹן
  choice: பெத்-ஓரோன் ஏற்றப்பாதை வழியாக
  rationale: ‘வழி’ மற்றும் ‘ஏற்றம்’ என்ற இரு நிலவியல் கூறுகளையும் சுருக்கமான இயல்பான தமிழில் பாதுகாக்கிறது.
- source_word: עַד עֲזֵקָה וְעַד מַקֵּדָה
  choice: அசேக்காவரையிலும் மக்கேதாவரையிலும்
  rationale: மீண்டும் வரும் עַד என்பதையும் இரு இடப்பெயர்களையும் பாதுகாத்து, தாக்குதல் நீண்டடைந்த புவியியல் எல்லையைத் தெரிவிக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலத்தில் நேரடியாக உள்ள உடன்படிக்கைப் பெயரைப் பட்டமாக மாற்றாமல், Yahweh என்பதற்கான தமிழ் ஒலிபெயர்ப்பாக வழங்குகிறது.
- issue: துரத்திய செயலின் கர்த்தா
  choice: தொடர்ச்சியான வினைச்சொற்கள் யாவேயின் செயல்களாக அமைக்கப்பட்டுள்ளன
  alternative: இஸ்ரவேலர் அவர்களைத் துரத்தினர் என்று கர்த்தாவை மாற்றுதல்
  rationale: எபிரேய உரையில் புதிய எழுவாய் வெளிப்படையாகக் குறிப்பிடப்படவில்லை; தொடர்ச்சியான ஒருமை வினை வடிவங்கள் முன் குறிப்பிடப்பட்ட யாவேயையே இயல்பாகத் தொடர்கின்றன. இஸ்ரவேலரைக் கர்த்தாவாக வெளிப்படையாகச் சேர்ப்பது மூலத்தில் இல்லாத விளக்கமாகும்.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான கதைநடைத் தமிழ் பயன்படுத்தப்பட்டுள்ளது. இடப்பெயர்கள் தமிழ் ஒலியமைப்புக்கு ஏற்றவாறு ஒலிபெயர்க்கப்பட்டுள்ளன. எபிரேயத்தின் தொடர்ச்சியான தெய்வீகச் செயற்பாடு தெளிவாக வைக்கப்பட்டாலும், לִפְנֵי என்பதன் இடவியல்/சாதகப் பொருள் முழுவதுமாகத் தீர்மானிக்கப்படவில்லை.
