  text: וַ֠/יְהִי כְּֽ/הוֹצִיאָ֞/ם אֶת הַ/מְּלָכִ֣ים הָ/אֵלֶּה֮ אֶל יְהוֹשֻׁעַ֒ וַ/יִּקְרָ֨א יְהוֹשֻׁ֜עַ אֶל כָּל אִ֣ישׁ יִשְׂרָאֵ֗ל וַ֠/יֹּאמֶר אֶל קְצִינֵ֞י אַנְשֵׁ֤י הַ/מִּלְחָמָה֙ הֶ/הָלְכ֣וּא אִתּ֔/וֹ קִרְב֗וּ שִׂ֚ימוּ אֶת רַגְלֵי/כֶ֔ם עַֽל צַוְּארֵ֖י הַ/מְּלָכִ֣ים הָ/אֵ֑לֶּה וַֽ/יִּקְרְב֔וּ וַ/יָּשִׂ֥ימוּ אֶת רַגְלֵי/הֶ֖ם עַל צַוְּארֵי/הֶֽם־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/024.yaml
  text: And when they brought these kings out to Joshua[a], Joshua called all the men of Israel and said to the commanders of the men of war who had gone with him, “Come near[b]; put your feet on the necks of these kings.” So they came near and put their feet on their necks.
translation:
  language: ta
  text: அந்த அரசர்களை யோசுவாவிடம் வெளியே கொண்டுவந்தபோது, யோசுவா இஸ்ரவேலின் ஆண்கள் அனைவரையும்[a] அழைத்து, தன்னுடன் சென்றிருந்த போர்வீரர்களின் தளபதிகளிடம்[b], “அருகே வாருங்கள்; உங்கள் கால்களை இந்த அரசர்களின் கழுத்துகள்மேல் வையுங்கள்” என்றார். அவர்களும் அருகே வந்து, தங்கள் கால்களை அந்த அரசர்களின் கழுத்துகள்மேல் வைத்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லர்த்தமாக, ‘இஸ்ரவேலின் ஒவ்வொரு ஆணையும்’; இந்த இராணுவச் சூழலில் படையுடன் கூடியிருந்த ஆண்களைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘போர்வீரர்களின் தலைவர்களிடம்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כְּהוֹצִיאָם
  choice: வெளியே கொண்டுவந்தபோது
  rationale: וַיְהִי + כְּ + infinitive construct என்ற எபிரேயக் கதைநடை அமைப்பைத் தமிழில் இயல்பான காலவினைத் துணைவாக்கியமாக வழங்குகிறது; நிகழ்வுகளின் வரிசையும் காக்கப்படுகிறது.
- source_word: הַמְּלָכִים הָאֵלֶּה
  choice: அந்த அரசர்கள் / இந்த அரசர்கள்
  rationale: முதலில் முன்பே குறிப்பிடப்பட்ட அரசர்களைச் சுட்டுவதால் ‘அந்த அரசர்கள்’ என்றும், நேரடிக் கட்டளையில் அங்கு முன்னிலையில் இருப்பவர்களைச் சுட்டுவதால் ‘இந்த அரசர்கள்’ என்றும் சூழலுக்கேற்ப வழங்கப்பட்டுள்ளது.
- source_word: וַיִּקְרָא ... אֶל כָּל אִישׁ יִשְׂרָאֵל
  choice: யோசுவா இஸ்ரவேலின் ஆண்கள் அனைவரையும் அழைத்து
  rationale: כָּל אִישׁ יִשְׂרָאֵל என்பதன் ஆண்பால் வடிவத்தையும் இராணுவச் சூழலையும் காக்கிறது; ‘அனைத்து இஸ்ரவேலையும்’ எனப் பொதுமைப்படுத்தவில்லை.
- source_word: קְצִינֵי אַנְשֵׁי הַמִּלְחָמָה
  choice: போர்வீரர்களின் தளபதிகள்
  rationale: קְצִינֵי என்பதன் தலைமை அல்லது கட்டளைப் பொறுப்பையும், אַנְשֵׁי הַמִּלְחָמָה என்பதன் இராணுவப் பொருளையும் இயல்பான நவீன தமிழில் தருகிறது.
- source_word: הֶהָלְכוּא אִתּוֹ
  choice: தன்னுடன் சென்றிருந்த
  rationale: யோசுவாவுடன் படையெடுப்பில் சென்றிருந்த தளபதிகளை அடையாளப்படுத்தும் பண்பாட்டுத் தொடராக மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: קִרְבוּ
  choice: அருகே வாருங்கள்
  rationale: உடல்ரீதியாக நெருங்கிவரும்படி கொடுக்கப்பட்ட நேரடிக் கட்டளையை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: שִׂימוּ אֶת רַגְלֵיכֶם עַל צַוְּארֵי
  choice: உங்கள் கால்களை ... கழுத்துகள்மேல் வையுங்கள்
  rationale: அடக்கி வென்றதைக் காட்டும் வெளிப்படையான செயலின் கடுமையையும் konkreteness-ஐயும் தணிக்காமல் காக்கிறது.
- source_word: וַיִּקְרְבוּ וַיָּשִׂימוּ
  choice: அவர்களும் அருகே வந்து ... வைத்தார்கள்
  rationale: தொடர்ச்சியான இரண்டு wayyiqtol வினைகளையும் உடனடியான கீழ்ப்படிதலின் நிகழ்வுவரிசையையும் தெளிவாக வழங்குகிறது.
- source_word: עַל צַוְּארֵיהֶם
  choice: அந்த அரசர்களின் கழுத்துகள்மேல்
  rationale: எபிரேயப் பிரதிப்பெயரின் குறிப்பு அரசர்களையே சார்கிறது என்பதைத் தமிழில் குழப்பமின்றித் தெளிவுபடுத்துகிறது.
theological_decisions:
- issue: כָּל אִישׁ יִשְׂרָאֵל மற்றும் אַנְשֵׁי הַמִּלְחָמָה ஆகியவற்றிலுள்ள பாலினக் குறிப்பு
  choice: இஸ்ரவேலின் ஆண்கள் அனைவரும் / போர்வீரர்கள்
  alternative: இஸ்ரவேலர் அனைவரும் / படையினர்
  rationale: இது இராணுவச் சூழல்; மூலத்தின் ஆண்பால் குறிப்பை தேவையின்றி பாலினப் பொதுமையாக மாற்றாமல் காக்கிறது.
- issue: வெற்றிகொண்ட அரசர்களின் கழுத்துகள்மேல் கால்களை வைக்கும் செயல்
  choice: உங்கள் கால்களை இந்த அரசர்களின் கழுத்துகள்மேல் வையுங்கள்
  alternative: இவர்களை உங்கள் அதிகாரத்திற்குக் கீழ்ப்படுத்துங்கள்
  rationale: மூலத்தில் உள்ள உடல்ரீதியான, அடக்கத்தைச் சுட்டும் செயலை உருவகப் பொருளாக மட்டும் மாற்றாமலும் அதன் கடுமையை மென்மைப்படுத்தாமலும் நேரடியாக வழங்குகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘தளபதிகள்’, ‘போர்வீரர்கள்’ ஆகியவை இராணுவச் சூழலைத் தெளிவாகக் காக்கின்றன. நேரடிக் கட்டளையில் மரியாதைப் பன்மை வினைமுற்றுகள் பயன்படுத்தப்பட்டாலும், கட்டளையின் நேரடித்தன்மை தணிக்கப்படவில்லை.
