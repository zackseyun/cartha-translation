  source_fidelity: 'The principal clauses are accurately represented: the plural imperatives, the first-person plural cohortative (“தாக்குவோம்”), the causal clause, and the diplomatic sense of הִשְׁלִימָה are retained. However, “என்றான்” is not present in Joshua 10:4 itself. The preceding verse supplies the sending/speaking framework, so adding a singular speech verb here unnecessarily imports material into this verse.'
