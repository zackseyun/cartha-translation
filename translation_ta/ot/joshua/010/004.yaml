base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/004.yaml
  text: Come up to me and help me[a], and let us strike Gibeon[b], because it has made peace with Joshua and with the sons of Israel.
translation:
  language: ta
  text: “என்னிடம் ஏறிவந்து எனக்கு உதவுங்கள்; கிபியோனைத் தாக்குவோம்; ஏனெனில் அது யோசுவாவுடனும் இஸ்ரவேல் மக்களுடனும் சமாதானம் செய்துகொண்டது[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உடன்படிக்கை சார்ந்த சமாதான உறவை ஏற்படுத்திக்கொண்டது.” எபிரெய வினை சமாதான உறவுக்குள், குறிப்பாக உடன்படிக்கையால் அமைந்த சமாதானத்துக்குள், நுழைவதைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲלוּ אֵלַי
  choice: என்னிடம் ஏறிவந்து
  rationale: עלה என்ற பன்மை ஏவல் வினையின் மேல்நோக்கிய அல்லது உயர்நிலையை நோக்கிய நகர்வையும், אֵלַי என்பதன் பேச்சாளரை நோக்கிய திசையையும் இயல்பான தமிழில் காக்கிறது.
- source_word: וְעִזְרֻנִי
  choice: எனக்கு உதவுங்கள்
  rationale: עזר என்ற வேரிலிருந்து வந்த பன்மை ஏவல் வடிவத்தையும் முதலாம் நபர் ஒருமை பொருளையும் நேரடியாகவும் இயல்பாகவும் தருகிறது.
- source_word: וְנַכֶּה
  choice: தாக்குவோம்
  rationale: נכה என்ற வினையின் முதலாம் நபர் பன்மை விருப்ப/தூண்டல் வலிமையைத் தமிழின் உள்ளடக்க அழைப்பு வடிவமான ‘தாக்குவோம்’ வெளிப்படுத்துகிறது; சூழலில் இது இராணுவத் தாக்குதலைக் குறிக்கிறது.
- source_word: אֶת גִּבְעוֹן
  choice: கிபியோனை
  rationale: இடப்பெயரைத் தமிழ் ஒலிபெயர்ப்பில் தருவதுடன், நேரடி செயப்படுபொருளை ‘-ஐ’ வேற்றுமை உருபால் குறிக்கிறது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய வேண்டுகோளுக்கான காரணத்தைத் தெளிவாக அறிமுகப்படுத்துகிறது.
- source_word: הִשְׁלִימָה
  choice: சமாதானம் செய்துகொண்டது
  rationale: שלם என்பதன் ஹிஃபில் வடிவம் இங்கு பகைமையை முடித்து உடன்படிக்கை சார்ந்த அமைதியான உறவுக்குள் நுழைவதைக் குறிக்கிறது. ‘சமாதானம் செய்துகொண்டது’ அடிப்படைப் பொருளைக் காக்கிறது; ‘கூட்டணி அமைத்தது’ என்பது சற்றுக் குறுகிய விளக்கம்.
- source_word: אֶת יְהוֹשֻׁעַ וְאֶת בְּנֵי יִשְׂרָאֵל
  choice: யோசுவாவுடனும் இஸ்ரவேல் மக்களுடனும்
  rationale: השלימה உடன் வரும் את இங்கு சமாதான உறவின் மறுதரப்பினரைக் குறிக்கிறது. בני ישראל என்பதற்கு நவீனத் தமிழில் இயல்பாகவும் தேசியக் குழுவைக் கூட்டாகவும் குறிக்கும் ‘இஸ்ரவேல் மக்கள்’ தேர்ந்தெடுக்கப்பட்டது.
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל என்பதன் மொழிபெயர்ப்பு
  choice: இஸ்ரவேல் மக்கள்
  alternative: இஸ்ரவேலின் மகன்கள்
  rationale: எபிரெயச் சொற்றொடர் சொல்லுக்கு சொல் ‘இஸ்ரவேலின் மகன்கள்’ என்றாலும், இவ்வரலாற்று-தேசியச் சூழலில் அது இஸ்ரவேல் ஜனங்களை மொத்தமாகக் குறிக்கிறது. ‘இஸ்ரவேல் மக்கள்’ பொருளைத் துல்லியமாகவும் நவீனத் தமிழில் இயல்பாகவும் தருகிறது; தனிப்பட்ட ஆண் சந்ததியினர் என்ற தவறான எண்ணத்தையும் தவிர்க்கிறது.
- issue: הִשְׁלִימָה என்பதிலுள்ள அரசியல் உறவின் தன்மை
  choice: சமாதானம் செய்துகொண்டது
  alternative: கூட்டணி அமைத்தது
  rationale: மூல வினை சமாதான உறவு அல்லது உடன்படிக்கைச் சமாதானம் ஆகியவற்றைக் குறிக்க முடியும். உரையில் வெளிப்படையாக இல்லாத குறிப்பிட்ட அரசியல் ‘கூட்டணி’ எண்ணத்தை முதன்மை உரையில் திணிக்காமல், பரந்த பொருளை வைத்திருக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், நேரடியான இராணுவ அழைப்பின் அவசரத் தொனியைப் பாதுகாக்கும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. ‘ஏறிவந்து’ புவியியல்/திசை நுணுக்கத்தைக் காக்கிறது. மேற்கோளின் பேச்சாளரைச் சூழல் தெளிவுபடுத்துவதால் தமிழ் வாக்கிய நிறைவுக்காக ‘என்றான்’ சேர்க்கப்பட்டது.
