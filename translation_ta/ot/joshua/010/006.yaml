  rationale: שלח என்பதன் தொடர் நிகழ்வைக் குறிக்கும் வினையைத் தமிழில் செய்தி அனுப்புதலை இயல்பாக வெளிப்படுத்தும் வகையில் மொழிபெயர்க்கிறது.
- source_word: אַנְשֵׁי גִבְעוֹן
  choice: கிபியோன் நகரத்து ஆட்கள்
  rationale: ஆண்பால் பன்மையைத் தக்கவைத்தபடியே, இவர்கள் நகரத்தின் பிரதிநிதிகள் அல்லது ஆட்கள் என்பதை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: אֶל יְהוֹשֻׁעַ אֶל הַמַּחֲנֶה הַגִּלְגָּלָה
  choice: கில்காலிலிருந்த முகாமில் இருந்த யோசுவாவிடம்
  rationale: இருமுறை வரும் אֶל குறிக்கும் பெறுநரையும் சென்றடையும் இடத்தையும் தெளிவான தமிழ் வாக்கிய அமைப்பில் இணைக்கிறது; கில்காலை நோக்கிய திசை விகுதியை சூழலுக்கேற்ற இடப்பொருளில் தருகிறது.
- source_word: אַל תֶּרֶף יָדֶיךָ מֵעֲבָדֶיךָ
  choice: உமது அடியார்களாகிய எங்களைக் கைவிட்டுவிடாதீர்
  rationale: ‘கையைத் தளர்த்துதல்/விலக்குதல்’ என்ற எபிரெய மரபுத்தொடரின் சூழற்பொருள் ஆதரவை நிறுத்தாமல் இருப்பது அல்லது கைவிடாமல் இருப்பது. இயல்பான தமிழில் பொருளைத் தருகிறது; சொற்சொல் வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: עֲבָדֶיךָ
