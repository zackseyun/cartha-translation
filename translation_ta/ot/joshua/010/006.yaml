base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/006.yaml
  text: Then the men of Gibeon sent to Joshua[a], to the camp at Gilgal, saying, “Do not withdraw your hand from your servants. Come up to us quickly, and save us and help us, for all the kings of the Amorites who live in the hill country have gathered against us.”
translation:
  language: ta
  text: அப்போது கிபியோன் நகரத்து ஆட்கள், கில்காலிலுள்ள முகாமில் இருந்த யோசுவாவிடம் செய்தி அனுப்பி, “உமது அடியார்களாகிய எங்களைக் கைவிட்டுவிடாதீர்[a]. விரைவாக எங்களிடம் ஏறிவந்து, எங்களை மீட்டு, எங்களுக்கு உதவி செய்யும். ஏனெனில் மலைநாட்டில் குடியிருக்கிற எமோரியரின் அரசர்கள் அனைவரும் எங்களுக்கு எதிராக ஒன்றுகூடியிருக்கிறார்கள்” என்று கூறினார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “உமது அடியார்களிடமிருந்து உமது கையைத் தளர்த்தாதீர்.” இது “எங்களுக்கு ஆதரவளிப்பதை நிறுத்தாதீர்” அல்லது “எங்களைக் கைவிடாதீர்” என்று பொருள்படும் மரபுத்தொடர்.
    reason: lexical_alternative
