  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான உரைநடை பயன்படுத்தப்பட்டுள்ளது. யோசுவாவை நோக்கிய வேண்டுகோளில் மரியாதைப் பன்மை வடிவங்கள் இடம்பெறுகின்றன. ‘ஏறிவந்து’ என்பது கில்காலிலிருந்து மலைநாட்டை நோக்கிய நில அமைப்புச் சுட்டைத் தக்கவைக்கிறது.
