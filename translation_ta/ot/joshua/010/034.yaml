  verdict: revise
  source_fidelity: 'முதல் வாக்கியம் எபிரெய மூலத்துக்கு உண்மையாக உள்ளது: யோசுவாவும் அவருடன் இருந்த இஸ்ரவேலர் அனைவரும் லாகீசிலிருந்து எக்லோனுக்குச் சென்றனர். இரண்டாம் வாக்கியத்தில் וַיִּלָּחֲמוּ עָלֶיהָ என்பதில் உள்ள עַל, நகரத்துக்கு எதிரான போரைக் குறிக்கிறது. ‘அதனுடன் போரிட்டார்கள்’ என்பது தமிழில் இயல்பாக இருந்தாலும் ‘with it’ என்ற பொருள்நிழலை உருவாக்கக்கூடும்; ‘அதற்கு எதிராகப் போரிட்டார்கள்’ என்பது மூலத்தின் திசைநோக்கிய பகைநிலையைத் தெளிவாகக் காக்கிறது.'
  naturalness: ‘பின்பு’, ‘சென்றார்கள்’, ‘முகாமிட்டு’ ஆகியவை நவீன நிலையான தமிழில் இயல்பாகவும் வரலாற்று விவரண நடைக்கு ஏற்றவாறும் உள்ளன. மீண்டும் வரும் ‘அதற்கு எதிராக’ மூலத்தில் மீண்டும் வரும் עָלֶיהָ-வை வெளிப்படுத்துகிறது; சிறிது மீட்சி இருந்தாலும் தெளிவும் மூலநேர்மையும் முன்னுரிமை பெறுகின்றன.
  terminology: யோசுவா, இஸ்ரவேலர், லாகீசு, எக்லோன் ஆகிய பெயர்கள் ஏற்றவையாக உள்ளன. ‘முகாமிட்டு’ חנה-வுக்கும், ‘போரிட்டார்கள்’ לחם-க்கும் பொருத்தமானவை. போரின் இலக்கைக் குறிக்க இரு இடங்களிலும் ‘அதற்கு எதிராக’ பயன்படுத்தப்படுகிறது.
