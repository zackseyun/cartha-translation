translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியும் ஆனால் கண்ணியமான வரலாற்று-விவரண நடையில் மொழிபெயர்க்கப்பட்டது. எபிரெய வாக்கியத்தின் தொடர்ச்சியைத் தமிழில் இயல்பாக்க இரண்டு வாக்கியங்களாகப் பிரித்துள்ளோம்; புதிய கருத்து எதுவும் சேர்க்கப்படவில்லை.
