translation:
  language: ta
  text: பின்பு யோசுவாவும் அவருடன் இஸ்ரவேலர் அனைவரும் லாகீசிலிருந்து எக்லோனுக்குச் சென்றார்கள். அவர்கள் அதற்கு எதிராக முகாமிட்டு, அதற்கு எதிராகப் போரிட்டார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲבֹר
  choice: சென்றார்கள்
  rationale: עָבַר என்பது இங்கு ஓர் எல்லையையோ நீர்நிலையையோ கடந்ததைச் சுட்டாமல், படையெடுப்பில் ஓர் இடத்திலிருந்து அடுத்த இடத்துக்கு நகர்வதைக் குறிக்கிறது; எனவே இயல்பான தமிழில் ‘சென்றார்கள்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: וְכָל יִשְׂרָאֵל עִמּוֹ
  choice: அவருடன் இஸ்ரவேலர் அனைவரும்
  rationale: யோசுவாவுடன் சென்ற இஸ்ரவேல் மக்களை ஒரு கூட்டு அலகாகக் குறிக்கும் எபிரெயச் சொற்றொடரின் பொருளும் தலைமை-உடனிருப்பு உறவும் காக்கப்படுகின்றன.
- source_word: מִלָּכִישׁ עֶגְלֹנָה
  choice: லாகீசிலிருந்து எக்லோனுக்கு
  rationale: מִן புறப்பட்ட இடத்தையும், எக்லோன் என்ற பெயருடன் இணைந்த திசைகாட்டும் ה இலக்கை நோக்கிய நகர்வையும் குறிக்கின்றன.
- source_word: וַיַּחֲנוּ עָלֶיהָ
  choice: அதற்கு எதிராக முகாமிட்டு
  rationale: חנה என்பது முகாமிடுதலைக் குறிக்கிறது; முற்றுகைப் போர் சூழலில் עַל வெறும் அருகாமையை அல்ல, நகரத்துக்கு எதிரான பகைநிலை அணிவகுப்பைக் குறிக்கிறது.
- source_word: וַיִּלָּחֲמוּ עָלֶיהָ
  choice: அதனுடன் போரிட்டார்கள்
  rationale: לחם நிபால் வடிவம் போரில் ஈடுபடுதலைக் குறிக்கிறது; தொடர்ந்து வரும் עַל அந்நகரமே போரின் எதிர்தரப்பு என்பதைத் தெரிவிக்கிறது. இயல்பான தமிழில் ‘அதனுடன் போரிட்டார்கள்’ என வழங்கப்பட்டது.
