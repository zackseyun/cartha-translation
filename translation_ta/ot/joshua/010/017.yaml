  text: And it was reported to Joshua[a], saying, “The five kings have been found hidden in the cave at Makkedah.”
translation:
  language: ta
  text: அப்போது, “அந்த ஐந்து அரசர்கள் மக்கேதாவிலுள்ள குகையில் ஒளிந்துகொண்டிருக்கையில் கண்டுபிடிக்கப்பட்டனர்[a]” என்று யோசுவாவுக்குத் தெரிவிக்கப்பட்டது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அந்த ஐந்து அரசர்கள் மக்கேதாவிலுள்ள குகையில் மறைந்திருந்த நிலையில் கண்டுபிடிக்கப்பட்டனர்.” எபிரெயப் பெயரெச்ச வினை வடிவம் அவர்கள் ஒளிந்துகொண்டிருந்த செயலையோ, மறைந்திருந்த நிலையையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֻּגַּד
  choice: தெரிவிக்கப்பட்டது
  rationale: நגד என்பதன் செயல்பாட்டுவினை வடிவம் யோசுவாவுக்கு ஒரு செய்தி தெரிவிக்கப்பட்டதைக் குறிக்கிறது. எழுவாயைச் சேர்க்காமல் எபிரெயத்தின் செயப்பாட்டு அமைப்பைப் பேணுகிறது.
- source_word: לִיהוֹשֻׁעַ
  choice: யோசுவாவிடம்
  rationale: செய்தியைப் பெறுபவரை இயல்பான நவீனத் தமிழில் குறிக்கிறது; பெயர் வழக்கமான தமிழ் ஒலிபெயர்ப்பில் தரப்பட்டுள்ளது.
- source_word: לֵאמֹר
  choice: என்று
  rationale: எபிரெய மேற்கோள் அறிமுகச் சொல்லை இயல்பான தமிழ் நேர்க்கூற்று அமைப்பில் வெளிப்படுத்துகிறது.
- source_word: נִמְצְאוּ
  choice: கண்டுபிடிக்கப்பட்டார்கள்
  rationale: מצא என்பதன் பன்மைச் செயப்பாட்டு வடிவத்தைத் தெளிவாகப் பேணுகிறது.
- source_word: חֲמֵשֶׁת הַמְּלָכִים
  choice: அந்த ஐந்து அரசர்களும்
  rationale: முன்பு குறிப்பிடப்பட்ட குறிப்பிட்ட ஐந்து அரசர்களைச் சுட்டுவதால், எபிரெயத் திட்டவட்டத் தன்மையை ‘அந்த’ வெளிப்படுத்துகிறது.
- source_word: נֶחְבְּאִים
  choice: ஒளிந்திருக்கையில்
  rationale: חבא என்பதன் பங்கேற்புவினை வடிவத்தை அவர்கள் அப்போது செய்துகொண்டிருந்த செயலாக இயல்பான தமிழில் தருகிறது; நிலையாகப் புரிந்துகொள்ளும் வாய்ப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: בַּמְּעָרָה
  choice: குகையில்
  rationale: திட்டவட்டமான இடத்தைக் குறிக்கும் முன்னிடைச்சொல் தொடரின் நேரடியான பொருளை வழங்குகிறது.
- source_word: בְּמַקֵּדָה
  choice: மக்கேதாவிலுள்ள
  rationale: குகை மக்கேதா என்னும் இடத்தில் இருந்ததை இயல்பான தமிழ் பெயரடைத் தொடராகக் காட்டுகிறது.
