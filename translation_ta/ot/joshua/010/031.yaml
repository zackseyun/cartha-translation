source:
  edition: WLC
  text: וַ/יַּעֲבֹ֣ר יְ֠הוֹשֻׁעַ וְ/כָל יִשְׂרָאֵ֥ל עִמּ֛/וֹ מִ/לִּבְנָ֖ה לָכִ֑ישָׁ/ה וַ/יִּ֣חַן עָלֶ֔י/הָ וַ/יִּלָּ֖חֶם בָּֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/031.yaml
  text: Then Joshua[a], and all Israel with him, passed on from Libnah to Lachish[b], and camped against it and fought against it.
translation:
  language: ta
  text: பின்பு யோசுவாவும் அவருடன் இஸ்ரவேலர் அனைவரும் லிப்னாவிலிருந்து லாகீசுக்குச் சென்று, அதற்கு எதிராக முகாமிட்டு, அதற்கு எதிராகப் போரிட்டார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲבֹר
  choice: சென்று
  rationale: עבר என்பதன் அடிப்படைப் பொருள் ‘கடந்து செல்/செல்’ என்பதாகும். இங்கு ஓர் ஆற்றைக் கடப்பது அல்ல, ஒரு நகரத்திலிருந்து மற்றொரு நகரத்துக்குச் செல்லும் படைநகர்வு குறிக்கப்படுவதால், இயல்பான தமிழில் ‘சென்று’ என்று மொழிபெயர்க்கப்பட்டது.
- source_word: וְכָל יִשְׂרָאֵל עִמּוֹ
  choice: அவருடன் இஸ்ரவேலர் அனைவரும்
  rationale: யோசுவாவுடன் சென்ற இஸ்ரவேல் மக்களின் கூட்டத்தைக் குறிக்கும் எபிரெயக் கூட்டு மொழியைத் தெளிவாகவும் இயல்பாகவும் வழங்குகிறது.
- source_word: מִלִּבְנָה לָכִישָׁה
  choice: லிப்னாவிலிருந்து லாகீசுக்கு
  rationale: לָכִישָׁה-வில் உள்ள திசைச்சுட்டும் -ה, லாகீசை நோக்கிய நகர்வைக் காட்டுகிறது; தமிழில் இலக்கை இயல்பாகக் குறிக்க ‘லாகீசுக்கு’ பயன்படுத்தப்பட்டது.
- source_word: וַיִּחַן עָלֶיהָ
  choice: அதற்கு எதிராக முகாமிட்டு
  rationale: חנה என்பது ‘முகாமிடு’; முற்றுகைப் போர் சூழலில் עַל பகைமை நோக்கிய நிலைப்பாட்டைக் குறிப்பதால் ‘அதற்கு எதிராக’ என வழங்கப்பட்டது.
- source_word: וַיִּלָּחֶם בָּהּ
  choice: அதனுடன் போரிட்டார்கள்
  rationale: நிபால் வடிவிலுள்ள לחם என்பது ‘போரிடு’ என்று பொருள். நகரத்தை எதிரியாகக் கொண்டு போர் செய்ததை இயல்பான தமிழில் ‘அதனுடன் போரிட்டார்கள்’ எனக் காட்டுகிறது.
