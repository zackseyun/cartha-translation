translation_notes:
  register: நவீனத் தரத் தமிழ்; எளிமையானதாயினும் கண்ணியமான வரலாற்று நடை. ‘இஸ்ரவேலர் அனைவரும்’ என்பது இங்கு யோசுவாவுடன் சென்ற மக்களையோ படையையோ கூட்டாகக் குறிக்கிறது; மூலத்தில் இல்லாத விளக்கம் முதன்மை உரையில் சேர்க்கப்படவில்லை.
