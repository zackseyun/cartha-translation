  text: וַ/יֹּ֣אמֶר יְהוֹשֻׁ֔עַ גֹּ֛לּוּ אֲבָנִ֥ים גְּדֹל֖וֹת אֶל פִּ֣י הַ/מְּעָרָ֑ה וְ/הַפְקִ֧ידוּ עָלֶ֛י/הָ אֲנָשִׁ֖ים לְ/שָׁמְרָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/018.yaml
  text: And Joshua said[a], “Roll large stones to the mouth of the cave[b], and appoint men over it to guard it.”
translation:
  language: ta
  text: யோசுவா, “குகையின் நுழைவாயிலில்[a] பெரிய கற்களை உருட்டி வையுங்கள்; அவர்களைக்[b] காக்க குகையருகே ஆட்களை நியமியுங்கள்” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொல்லர்த்தமாக, ‘குகையின் வாய்க்கு.’
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில் ‘அவர்களைக் காக்க’ என்று பன்மையில் உள்ளது; இது குகைக்குள் அடைக்கப்பட்ட அரசர்களைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר יְהוֹשֻׁעַ
  choice: யோசுவா … என்றார்
  rationale: எபிரெயக் கதைநடையின் தொடர்ச்சியை இயல்பான நவீனத் தமிழில் தருகிறது; பெயர் வழக்கமான தமிழ் வடிவில் ஒலிபெயர்க்கப்படுகிறது.
- source_word: גֹּלּוּ
  choice: உருட்டி வையுங்கள்
  rationale: גלל என்பதன் பன்மை ஏவல் வடிவம் கற்களை உருட்டுவதைக் குறிக்கிறது. இலக்கை நோக்கி உருட்டி நிலைநிறுத்தும் செயலைத் தமிழில் தெளிவாகச் சொல்கிறது.
- source_word: אֲבָנִים גְּדֹלוֹת
  choice: பெரிய கற்கள்
  rationale: அடைமொழி கற்களின் அளவைக் குறிக்கிறது; இது நேரடியானதும் இயல்பானதும் ஆகும்.
- source_word: אֶל פִּי הַמְּעָרָה
  choice: குகையின் நுழைவாயிலுக்கு
  rationale: எபிரெயத்தில் சொல்லர்த்தமாக ‘குகையின் வாய்’ என்ற உருவகம் உள்ளது; அதன் பொருளைத் தெளிவான தற்போதைய தமிழில் ‘நுழைவாயில்’ எனத் தருகிறது, சொல்லர்த்த உருவகம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: וְהַפְקִידוּ עָלֶיהָ אֲנָשִׁים
  choice: அங்கே ஆட்களை நியமியுங்கள்
  rationale: הפקידו என்பது ஒரு பணிக்காக ஆட்களை அமர்த்துதல் அல்லது நியமித்தல்; עליה குகையருகே அல்லது அதற்குப் பொறுப்பாக அவர்களை நிறுத்துவதைக் குறிக்கிறது. ‘அங்கே’ என்பது தமிழில் இயல்பாக இடத்தொடர்பை வெளிப்படுத்துகிறது.
- source_word: לְשָׁמְרָם
  choice: அவர்களைக் காவல் காக்கும்படி
  rationale: வினையுடன் சேர்ந்துள்ள பின்னொட்டு ஆண்பால் பன்மை; சூழலில் குகைக்குள் அடைக்கப்பட்ட அரசர்களையே மிக இயல்பாகச் சுட்டுகிறது. ஆகவே ஒருமையான குகையைச் சுட்டும் ‘அதைக்’ என்பதற்குப் பதிலாக பன்மையான மனிதர்களைக் குறிக்கும் ‘அவர்களை’ பயன்படுத்தப்பட்டுள்ளது.
