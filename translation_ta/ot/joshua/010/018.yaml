translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்கு எளிதாகவும் மரியாதைமிக்க கதைநடைத் தொனியுடனும் மொழிபெயர்க்கப்பட்டுள்ளது. ஏவல் பன்மைக்கு ‘வையுங்கள்/நியமியுங்கள்’ பயன்படுத்தப்பட்டுள்ளது; எபிரெய இலக்கணத்தில் உள்ள ஒருமை–பன்மை வேறுபாடு மறைக்கப்படவில்லை.
