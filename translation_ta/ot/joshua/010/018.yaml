revisions:
- from: யோசுவா, “குகையின் நுழைவாயிலுக்குப்[a] பெரிய கற்களை உருட்டி வையுங்கள்; அவர்களைக்[b] காவல் காக்கும்படி அங்கே ஆட்களை நியமியுங்கள்” என்றார்.
  to: யோசுவா, “குகையின் நுழைவாயிலில்[a] பெரிய கற்களை உருட்டி வையுங்கள்; அவர்களைக்[b] காக்க குகையருகே ஆட்களை நியமியுங்கள்” என்றார்.
  rationale: The revision preserves the Hebrew imperative sequence and the deliberate plural object (‘them’). It improves Tamil idiom by removing redundant wording and represents the placement of the appointed men in relation to the cave more clearly. The footnotes retain both the literal ‘mouth’ idiom and the contextual, non-dogmatic explanation of the plural suffix.
