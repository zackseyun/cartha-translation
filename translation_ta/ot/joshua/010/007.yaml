translation:
  language: ta
  text: யோசுவாவும், அவரோடு இருந்த போர்ப் படையினர் அனைவரும், வலிமைமிக்க வீரர்கள் அனைவரும் கில்காலிலிருந்து மேலே சென்றனர்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַל
  choice: புறப்பட்டுச் சென்றார்
  rationale: עלה என்பதன் அடிப்படைப் பொருள் ‘மேலே செல்லுதல்’. இங்கு கில்காலிலிருந்து படையெடுத்துச் செல்லும் சூழலில், தமிழில் இயல்பாக அமையும் ‘புறப்பட்டுச் சென்றார்’ என்று மொழிபெயர்க்கப்பட்டது; நிலவியல் ஏற்றத்தைத் தேவையின்றி வலியுறுத்தவில்லை.
- source_word: מִן הַגִּלְגָּל
  choice: கில்காலிலிருந்து
  rationale: מן என்ற முன்னிடைச்சொல்லின் ‘இருந்து’ என்ற பொருளையும், கில்கால் என்ற இடப்பெயரையும் நேரடியாகக் காட்டுகிறது.
- source_word: הוּא
  choice: அவரும்
  rationale: எபிரெயத்தில் வெளிப்படையாக வரும் தனிப்பெயர்ச்சுட்டு யோசுவா தாமும் சென்றதை வலியுறுத்துகிறது; தமிழில் மரியாதையும் இயல்பும் காக்க ‘அவரும்’ என வழங்கப்பட்டது.
- source_word: כָל עַם הַמִּלְחָמָה
  choice: போருக்குச் செல்லும் மக்கள் அனைவரும்
  rationale: சொல்லுக்கு நெருக்கமாக ‘போரின் மக்கள் அனைவரும்’ என்ற கருத்தைத் தக்கவைத்தபடி, படைப்பிரிவைக் குறிக்கும் இயல்பான நவீனத் தமிழில் வழங்குகிறது.
- source_word: עִמּוֹ
  choice: அவரோடு
  rationale: עם மற்றும் மூன்றாம் நபர் ஒருமை ஆண்பால் பின்னொட்டின் நேரடியான பொருள்.
- source_word: כֹל גִּבּוֹרֵי הֶחָיִל
  choice: வலிமைமிக்க போர்வீரர்கள் அனைவரும்
  rationale: גִּבּוֹרֵי הֶחָיִל என்பது வலிமையும் போர்திறனும் கொண்ட தேர்ந்த வீரர்களைக் குறிக்கும் நிலையான சொற்றொடர். ‘வலிமைமிக்க போர்வீரர்கள்’ என்பது முந்தைய பொதுப் படையினரிலிருந்து இவர்களை வேறுபடுத்தி, நவீன வாசகருக்குத் தெளிவாகக் கூறுகிறது.
