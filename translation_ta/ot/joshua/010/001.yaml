base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/001.yaml
  text: It happened[a], when Adoni-zedek king of Jerusalem heard that Joshua had captured Ai and had devoted it to destruction, just as he had done to Jericho and its king, so he had done to Ai and its king, and that the inhabitants of Gibeon had made peace with Israel and were among them[b],
translation:
  language: ta
  text: எருசலேமின் அரசனான அதோனி-சேதேக்கு, யோசுவா ஆயியைக் கைப்பற்றி, அதை அழிவுக்கென ஒதுக்கிவிட்டதையும்[a], எரிகோவுக்கும் அதன் அரசனுக்கும் செய்ததுபோலவே ஆயிக்கும் அதன் அரசனுக்கும் செய்ததையும், கிபியோனில் குடியிருந்தவர்கள் இஸ்ரவேலரோடு சமாதானம் செய்து இஸ்ரவேலரிடையே இருந்ததையும் கேள்விப்பட்டபோது,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அதை முற்றிலும் அழித்ததையும்.” எபிரெயச் சொல் ஒன்றை அழிவுக்காக விசேஷமாக ஒதுக்கிவைப்பதைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִשְׁמֹעַ
  choice: கேள்விப்பட்டபோது
  rationale: היה என்ற நிகழ்வுரைத் தொடக்கத்தையும் כ + infinitive construct குறிக்கும் காலச் சூழலையும், அடுத்த வசனத்தில் நிறைவுபெறும் தமிழ் வாக்கியத்தில் இயல்பாக ஒருங்கிணைக்கிறது.
- source_word: אֲדֹנִי צֶדֶק
  choice: அதோனி-சேதேக்கு
  rationale: கூட்டுப் பெயரின் இரு கூறுகளையும் காட்டும் வகையில் ஒலிபெயர்த்து இடைக்கோடு பயன்படுத்தப்பட்டுள்ளது.
- source_word: מֶלֶךְ יְרוּשָׁלַם
  choice: எருசலேமின் அரசன்
  rationale: எபிரெயக் கட்டமைப்பை இயல்பான நவீனத் தமிழில் உரிமைத் தொடர்பாக வழங்குகிறது.
- source_word: לָכַד
  choice: கைப்பற்றி
  rationale: ஒரு நகரை இராணுவ முறையில் பிடித்ததைக் குறிக்கும் துல்லியமான, வழக்கமான தமிழ் வினை.
- source_word: וַיַּחֲרִימָהּ
  choice: அதை அழிவுக்கென்று அர்ப்பணித்ததையும்
  rationale: חרם என்பதிலுள்ள அழித்தல் மற்றும் விசேஷமாக ஒதுக்கிவைத்தல் ஆகிய இரு நுணுக்கங்களையும் முடிந்தவரை தக்கவைக்கிறது.
- source_word: כַּאֲשֶׁר ... כֵּן
  choice: செய்தபடியே ... செய்ததையும்
  rationale: எரிகோவுக்கும் ஆயிக்கும் நிகழ்ந்தவற்றை ஒப்பிடும் எபிரெய இணை அமைப்பையும் வினைமீளுரையையும் காக்கிறது.
- source_word: הִשְׁלִימוּ
  choice: சமாதானம் செய்து
  rationale: இங்கு hiphil வடிவம் பகைமை முடித்து சமாதான உறவு ஏற்படுத்துவதைச் சுட்டுகிறது.
- source_word: יֹשְׁבֵי גִבְעוֹן
  choice: கிபியோனின் குடியிருப்பாளர்கள்
  rationale: நகரில் வசிப்பவர்களைக் குறிக்கும் substantival participle-ஐ தெளிவாக மொழிபெயர்க்கிறது.
- source_word: וַיִּהְיוּ בְּקִרְבָּם
  choice: அவர்களிடையே வாழ்ந்ததையும்
  rationale: בקרבם என்பதன் ‘அவர்கள் நடுவில்/அவர்களிடையே’ என்ற பொருளை வெளிப்படுத்துகிறது; ‘வாழ்ந்தது’ குடியிருப்புச் சூழலை இயல்பாக உணர்த்துகிறது.
theological_decisions:
- issue: வெற்றிகொள்ளப்பட்ட நகரைக் குறித்த חרם சொற்பயன்பாடு
  choice: அழிவுக்கென்று அர்ப்பணித்தல்
  alternative: முற்றிலும் அழித்தல்
  rationale: இச்சொல் வெறும் இராணுவ அழிவை மட்டுமல்லாமல், அழிவுக்காக விசேஷமாக ஒதுக்கப்படுதல் என்ற சமயச் சார்ந்த நுணுக்கத்தையும் கொண்டுள்ளது; தேர்ந்த மொழியாக்கம் இரண்டையும் தக்கவைக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் கண்ணியமான வரலாற்று நிகழ்வுரை. எபிரெய வசனம் அடுத்த வசனத்தில் நிறைவடைவதால், தமிழிலும் இறுதியில் காற்புள்ளி வைக்கப்பட்டுள்ளது. வַיְהִי என்பதற்கென இயல்பற்ற தனி தொடக்கச் சொற்றொடர் சேர்க்காமல், ‘கேள்விப்பட்டபோது’ என்ற காலத் துணைவாக்கியத்தில் அதன் நிகழ்வுரைச் செயல்பாடு வெளிப்படுத்தப்பட்டுள்ளது.
