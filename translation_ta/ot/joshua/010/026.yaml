  text: וַ/יַּכֵּ֨/ם יְהוֹשֻׁ֤עַ אַֽחֲרֵי כֵן֙ וַ/יְמִיתֵ֔/ם וַ/יִּתְלֵ֕/ם עַ֖ל חֲמִשָּׁ֣ה עֵצִ֑ים וַ/יִּֽהְי֛וּ תְּלוּיִ֥ם עַל הָ/עֵצִ֖ים עַד הָ/עָֽרֶב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/026.yaml
  text: After this Joshua struck them down and put them to death[a], and he hanged them on five trees; and they remained hanging on the trees until the evening.
translation:
  language: ta
  text: அதன்பின் யோசுவா அவர்களைத் தாக்கிக் கொன்றார்; அவர்களை ஐந்து மரங்களில் தொங்கவிட்டார்.[a] அவர்கள் மாலைவரை அந்த மரங்களில் தொங்கிய நிலையில் இருந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்களைக் கழுவேற்றினார்.” எபிரெய வினைச்சொல் உடல்களை மரம் அல்லது மரப்பொருளில் தொங்கவைத்ததைக் குறிக்கிறது; “கழுவேற்றினார்” என்பதும் சாத்தியமான மொழிபெயர்ப்பு, ஆனால் அந்தக் குறிப்பிட்ட முறை இங்கு உறுதியல்ல.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּכֵּם
  choice: அவர்களை வெட்டி வீழ்த்தி
  rationale: נכה என்பதன் ஹிஃபில் வடிவம் தாக்கி வீழ்த்துதலைக் குறிக்கிறது. அடுத்துள்ள וַיְמִיתֵם தனியே மரணத்தைச் சொல்வதால், இரு வினைகளையும் ஒன்றாக்காமல் வேறுபடுத்துகிறது.
- source_word: אַחֲרֵי כֵן
  choice: அதன்பின்
  rationale: நிகழ்வுகளின் காலவரிசையைக் காட்டும் இயல்பான நவீனத் தமிழ் தொடர்.
- source_word: וַיְמִיתֵם
  choice: கொன்றார்
  rationale: מות என்பதன் ஹிஃபில் வடிவத்தின் காரணவினைப் பொருளை இயல்பான தமிழில் தெரிவிக்கிறது; முந்தைய தாக்குதலைத் தொடர்ந்து மரணம் நேர்ந்ததைத் தெளிவாக்குகிறது.
- source_word: וַיִּתְלֵם
  choice: தொங்கவிட்டார்
  rationale: תלה என்பது உடல்களை மரம் அல்லது மரப்பொருளில் தொங்கவைத்துக் காட்சிப்படுத்துவதைக் குறிக்கலாம். முறை என்ன என்பதைத் தேவையின்றி குறிப்பாக்காமல் வைக்கிறது.
- source_word: עַל חֲמִשָּׁה עֵצִים
  choice: ஐந்து மரங்களில்
  rationale: עֵץ என்பதன் நேரடியான பொருள் இங்கு ‘மரம்’; ‘கழுமரம்’ அல்லது ‘தூக்குமரம்’ எனக் கருவியைத் திட்டவட்டமாக்கவில்லை.
- source_word: וַיִּהְיוּ תְּלוּיִם
  choice: தொங்கிக்கொண்டிருந்தார்கள்
  rationale: היה மற்றும் செயப்பாட்டு வினையெச்சத்தின் சேர்க்கை தொடர்ந்த நிலையைக் காட்டுகிறது; தமிழ் தொடர்நிலை வடிவம் அதை இயல்பாகப் பாதுகாக்கிறது.
- source_word: עַד הָעָרֶב
  choice: மாலைவரை
  rationale: காட்சிப்படுத்தப்பட்ட காலத்தின் முடிவைத் துல்லியமாகவும் இயல்பாகவும் குறிக்கிறது; ‘சூரியன் மறையும் வரை’ என்று கூடுதல் விளக்கம் சேர்க்கவில்லை.
theological_decisions:
- issue: மரணதண்டனைக் காட்சிப்படுத்தல் சூழலில் עֵץ என்பதன் மொழிபெயர்ப்பு
  choice: மரங்கள்
  alternative: மரக் கம்பங்கள் / தூக்குமரங்கள்
  rationale: எபிரெயச் சொல் அடிப்படையில் மரம் அல்லது மரப்பொருளைக் குறித்தாலும், இவ்வசனம் குறிப்பிட்ட சாதனத்தை உறுதிப்படுத்தவில்லை. ‘மரங்கள்’ என்பது மூலத்தின் தெளிவின்மையைப் பாதுகாக்கிறது.
- issue: תלה குறிக்கும் தொங்கவைத்தல் முறை
  choice: தொங்கவிட்டார்
  alternative: கழுவேற்றினார்
  rationale: சடலங்களை மரத்தில் தொங்கவைத்துக் காட்சிப்படுத்துதல் தெளிவாக இருந்தாலும், குத்தி ஏற்றப்பட்ட முறை உறுதியல்ல. ஆகவே குறிப்பிட்ட தண்டனை முறையை உரையில் திணிக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழ்; இயல்பான, கண்ணியமான வரலாற்று விவரண நடை. וַיַּכֵּם மற்றும் וַיְמִיתֵם ஆகிய தனித்தனி செயல்கள் பாதுகாக்கப்பட்டுள்ளன; மரணதண்டனை முறையின் தெளிவின்மையும் அடிக்குறிப்பில் சுட்டப்பட்டுள்ளது.
