revisions:
- from: அதன்பின் யோசுவா அவர்களை வெட்டி வீழ்த்திக் கொன்றார்; அவர்களை ஐந்து மரங்களில் தொங்கவிட்டார்.[a] அவர்கள் மாலைவரை அந்த மரங்களில் தொங்கிக்கொண்டிருந்தார்கள்.
  to: அதன்பின் யோசுவா அவர்களைத் தாக்கிக் கொன்றார்; அவர்களை ஐந்து மரங்களில் தொங்கவிட்டார்.[a] அவர்கள் மாலைவரை அந்த மரங்களில் தொங்கிய நிலையில் இருந்தார்கள்.
