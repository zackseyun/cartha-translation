reference: Joshua 10:11
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יְהִ֞י בְּ/נֻסָ֣/ם מִ/פְּנֵ֣י יִשְׂרָאֵ֗ל הֵ֞ם בְּ/מוֹרַ֤ד בֵּית חוֹרֹן֙ וַֽ/יהוָ֡ה הִשְׁלִ֣יךְ עֲלֵי/הֶם֩ אֲבָנִ֨ים גְּדֹל֧וֹת מִן הַ/שָּׁמַ֛יִם עַד עֲזֵקָ֖ה וַ/יָּמֻ֑תוּ רַבִּ֗ים אֲשֶׁר מֵ֨תוּ֙ בְּ/אַבְנֵ֣י הַ/בָּרָ֔ד מֵ/אֲשֶׁ֥ר הָרְג֛וּ בְּנֵ֥י יִשְׂרָאֵ֖ל בֶּ/חָֽרֶב׀־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/011.yaml
  text: And as they fled before Israel[a], while they were on the descent of Beth-horon, Yahweh threw large stones from heaven on them as far as Azekah, and they died. More died from the hailstones than the sons of Israel killed with the sword.
translation:
  language: ta
  text: அவர்கள் இஸ்ரவேலரிடமிருந்து தப்பியோடுகையில், பெத்-ஓரோனின் இறக்கத்தில் இருந்தபோது, யாவே வானத்திலிருந்து பெரிய கற்களை அசெக்கா வரைக்கும் அவர்கள்மேல் எறிந்தார்; பலர் இறந்தார்கள். இஸ்ரவேல் மக்கள் வாளால் கொன்றவர்களைவிட ஆலங்கட்டிக் கற்களால் இறந்தவர்கள் அதிகம்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֻסָם מִפְּנֵי יִשְׂרָאֵל
  choice: அவர்கள் இஸ்ரவேலருக்கு முன்பாகத் தப்பியோடி
  rationale: ב prefixed infinitive construct conveys contemporaneous action, while מִפְּנֵי expresses flight before an opposing force. The Tamil wording remains close to the Hebrew and is intelligible in the battle context.
- source_word: בְּמוֹרַד בֵּית חוֹרֹן
  choice: பெத்-ஓரோனின் இறக்கத்தில்
  rationale: מוֹרָד denotes a descent or downhill slope; “இறக்கம்” preserves the narrative’s topographical detail.
- source_word: וַיהוָה
  choice: யெகோவா
  rationale: The personal divine name represented by the Tetragrammaton is transliterated rather than replaced by a title.
- source_word: הִשְׁלִיךְ
  choice: எறிந்தார்
  rationale: This directly represents the act of throwing or casting and reads naturally in modern Tamil.
- source_word: אֲבָנִים גְּדֹלוֹת
  choice: பெரிய கற்களை
  rationale: The first description is retained generically as “large stones,” allowing the later phrase to identify them as hailstones.
- source_word: מִן הַשָּׁמַיִם
  choice: வானத்திலிருந்து
  rationale: This naturally preserves both the spatial sense “from heaven/the sky” and the context of divine action.
- source_word: עַד עֲזֵקָה
  choice: அசெக்கா வரையிலும்
  rationale: עַד marks the spatial extent along the enemies’ route.
- source_word: בְּאַבְנֵי הַבָּרָד
  choice: ஆலங்கட்டிக் கற்களால்
  rationale: The compound retains the lexical link to the earlier “stones” while clearly identifying them as hailstones.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்கள்
  rationale: This is the natural modern Tamil ethnonymic expression for the collective people and avoids the misleadingly literal “sons” where the reference is national.
- source_word: בֶּחָרֶב
  choice: வாளால்
  rationale: The instrumental beth is expressed concisely by the Tamil instrumental suffix.
theological_decisions:
- issue: Rendering the divine name יְהוָה
  choice: யெகோவா
  alternative: கர்த்தர்
  rationale: The Hebrew directly uses the covenant name; transliteration preserves the distinction between the personal name and a title.
- issue: Nature of the heavenly projectiles
  choice: First “பெரிய கற்கள்,” then “ஆலங்கட்டிக் கற்கள்”
  alternative: Use “ஆலங்கட்டிக் கற்கள்” at both occurrences
  rationale: The Hebrew first calls them large stones and subsequently identifies them as hailstones. Preserving both stages avoids flattening the source’s progression.
- issue: Rendering בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்கள்
  alternative: இஸ்ரவேலின் மகன்கள்
  rationale: Here the masculine Hebrew kinship phrase functions as a collective ethnonym. Natural Tamil communicates the intended people-group without introducing a claim that only males are meant.
translation_notes:
  register: நவீனத் தரத் தமிழில், கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. இடப்பெயர்கள் எபிரெய ஒலிப்புக்கு அண்மையாக “பெத்-ஓரோன்,” “அசெக்கா” என்று தரப்பட்டுள்ளன. மூலத்தின் நிகழ்வுவரிசையும், “பெரிய கற்கள்” பின்னர் “ஆலங்கட்டிக் கற்கள்” என அடையாளப்படுத்தப்படும் முன்னேற்றமும் பாதுகாக்கப்பட்டுள்ளன.
