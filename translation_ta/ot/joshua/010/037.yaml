  text: וַ/יִּלְכְּד֣וּ/הָ וַ/יַּכּֽוּ/הָ לְ/פִי חֶ֠רֶב וְ/אֶת מַלְכָּ֨/הּ וְ/אֶת כָּל עָרֶ֜י/הָ וְ/אֶת כָּל הַ/נֶּ֤פֶשׁ אֲשֶׁר בָּ/הּ֙ לֹֽא הִשְׁאִ֣יר שָׂרִ֔יד כְּ/כֹ֥ל אֲשֶׁר עָשָׂ֖ה לְ/עֶגְל֑וֹן וַ/יַּחֲרֵ֣ם אוֹתָ֔/הּ וְ/אֶת כָּל הַ/נֶּ֖פֶשׁ אֲשֶׁר בָּֽ/הּ־־־־־־־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/037.yaml
  text: And they captured it and struck it with the edge of the sword[a], along with its king, all its cities, and every person who was in it. He left no survivor, just as he had done to Eglon. He devoted it to destruction, along with every person who was in it.
translation:
  language: ta
  text: அவர்கள் அதைக் கைப்பற்றி, வாளின் முனையால் அதைத் தாக்கினார்கள்; அதன் அரசனையும், அதன் எல்லா நகரங்களையும், அதில் இருந்த ஒவ்வொருவரையும் தாக்கினார்கள். எக்லோனுக்குச் செய்தது போலவே, அவன் யாரையும் தப்பிப் பிழைக்க விடவில்லை. அவன் அதையும், அதில் இருந்த ஒவ்வொருவரையும் அழிவுக்கென அர்ப்பணித்தான்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “முற்றிலும் அழித்தான்.” எபிரெயத்தில், இது ஹேரெம் (ḥerem) என்பதற்குட்படுத்துதல்; அதாவது, அழிவுக்கென ஒதுக்கி அர்ப்பணித்தல் என்பதைக் குறிக்கிறது.
    reason: חרם என்ற சொல்லின் தொழில்நுட்பப் பொருளையும் இயல்பான மாற்று மொழிபெயர்ப்பையும் விளக்குகிறது.
lexical_decisions:
- source_word: וַיִּלְכְּדוּהָ
  choice: அவர்கள் அதைக் கைப்பற்றி
  rationale: לכד என்பது ஒரு நகரத்தைக் கைப்பற்றுவதைக் குறிக்கிறது; ‘கைப்பற்றி’ என்பது இயல்பான நவீனத் தமிழில் அதன் இராணுவப் பொருளைத் தக்கவைக்கிறது.
- source_word: וַיַּכּוּהָ לְפִי חֶרֶב
  choice: வாளால் வெட்டிக் கொன்றார்கள்
  rationale: נכה மற்றும் ‘வாளின் வாயால்’ என்ற எபிரெய மரபுத்தொடர் இச்சூழலில் வாளால் கொல்வதைக் குறிக்கின்றன. சொல்லுக்குச் சொல் அமைப்பை விட, செயலும் அதன் உயிர்க்கொல்லும் விளைவும் தமிழில் தெளிவாக வெளிப்படுகின்றன.
- source_word: מַלְכָּהּ
  choice: அதன் அரசனை
  rationale: கைப்பற்றப்பட்ட நகரத்தின் அரசனைச் சுட்டும் நேரடியான உடைமைத் தொடர்.
- source_word: כָּל עָרֶיהָ
  choice: அதன் எல்லா நகரங்களையும்
  rationale: עיר என்பது நகரம் அல்லது பட்டணம் எனப் பொருள்படலாம். இங்கு அந்த அரச நகரத்துக்குச் சேர்ந்த குடியிருப்புகளைச் சுட்டினாலும், ‘நகரங்கள்’ மூலச்சொல்லின் பொதுவான பொருளை நெருக்கமாகத் தக்கவைக்கிறது.
- source_word: כָּל הַנֶּפֶשׁ אֲשֶׁר בָּהּ
  choice: அதில் இருந்த ஒவ்வொருவரையும்
  rationale: נפש இங்கு உடலற்ற ‘ஆத்துமா’வை அல்ல, மனிதர்களைக் குறிக்கிறது. ‘ஒவ்வொருவரையும்’ என்பது இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: לֹא הִשְׁאִיר שָׂרִיד
  choice: அவன் ஒருவரையும் உயிரோடு விட்டுவைக்கவில்லை
  rationale: שָׂרִיד என்பது தப்பிப் பிழைத்தவர் அல்லது எஞ்சியவர். ஒருமை வினையின் மறைமுக எழுவாயை ‘அவன்’ என்று வைத்ததால் எபிரெய உரையின் எழுவாய் மாற்றம் பாதுகாக்கப்படுகிறது.
- source_word: כְּכֹל אֲשֶׁר עָשָׂה לְעֶגְלוֹן
  choice: எக்லோனுக்குச் செய்தது போலவே
  rationale: முன்பு எக்லோனுக்குச் செய்யப்பட்டதோடு ஒப்பிடும் தொடரை இயல்பான தமிழில் தருகிறது.
- source_word: וַיַּחֲרֵם
  choice: அழிவுக்கென அர்ப்பணித்தான்
  rationale: חרם என்பது வெறுமனே அழிப்பதைவிட, அழிவுக்கென்று ஒதுக்கி அர்ப்பணிக்கும் தொழில்நுட்பப் பொருளைக் கொண்டுள்ளது. இந்தத் தேர்வு அந்த இரட்டைச் சுமையைச் சுருக்கமாகத் தக்கவைக்கிறது.
- source_word: וְאֶת כָּל הַנֶּפֶשׁ אֲשֶׁר בָּהּ
  choice: அதில் இருந்த ஒவ்வொருவரையும்
  rationale: மீண்டும் வரும் மூலத்தொடர் ஒரே விதமாக மொழிபெயர்க்கப்பட்டு, חרם நடவடிக்கையில் எல்லா குடிமக்களும் உள்ளடங்கியிருப்பது தெளிவாக்கப்படுகிறது.
theological_decisions:
- issue: போர்ச் சூழலில் חרם என்பதன் மொழிபெயர்ப்பு
  choice: அழிவுக்கென அர்ப்பணித்தான்
  alternative: முற்றிலும் அழித்தான்
  rationale: எபிரெயச் சொல் அழித்தல் என்ற விளைவோடு, அழிவுக்கென்று ஒதுக்குதல் அல்லது அர்ப்பணித்தல் என்ற சமயத் தொழில்நுட்ப நுண்பொருளையும் கொண்டுள்ளது. பிரதான உரை அந்த இறையியல் பதற்றத்தைத் தீர்த்துவிடாமல் பாதுகாக்கிறது; எளிய மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- issue: பன்மை எழுவாயிலிருந்து ஒருமை எழுவாய்க்கான மாற்றம்
  choice: ‘அவர்கள்’ என்பதிலிருந்து ‘அவன்’ என்பதற்கு மாற்றம் பாதுகாக்கப்பட்டது
  alternative: எங்கும் ‘அவர்கள்’ என்று ஒருமைப்படுத்துதல் அல்லது ‘யோசுவா’ என்று வெளிப்படையாகச் சேர்த்தல்
  rationale: எபிரெய உரையே וַיִּלְכְּדוּ/וַיַּכּוּ என்ற பன்மையிலிருந்து הִשְׁאִיר/וַיַּחֲרֵם என்ற ஒருமைக்கு மாறுகிறது. ‘அவன்’ என்பது யோசுவாவைக் குறிக்கக்கூடும்; பெயரைச் சேர்க்காமல் மூலத்தின் மறைமுகத் தன்மை காக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘சங்காரம்’, ‘பட்டயக்கருக்கு’, ‘ஆத்துமா’ போன்ற பழமையான அல்லது இச்சூழலில் தவறாகப் புரியக்கூடிய சொற்கள் தவிர்க்கப்பட்டுள்ளன. வன்முறை குறித்த மூல உரையின் நேரடித்தன்மை மென்மைப்படுத்தப்படவில்லை; அதேவேளை חרם என்பதன் சமயத் தொழில்நுட்ப நுண்பொருள் பிரதான உரையிலும் அடிக்குறிப்பிலும் பாதுகாக்கப்பட்டுள்ளது.
