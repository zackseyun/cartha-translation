revisions:
- from: யோசுவாவும் இஸ்ரவேல் மக்களும் அவர்களை முற்றிலும் அழிக்கும்வரை மிகப் பெரும் அழிவை உண்டாக்கி அவர்களைத் தாக்கி முடித்தபோது, அவர்களில் தப்பிப் பிழைத்தவர்கள் அரண்சூழ்ந்த நகரங்களுக்குள் சென்றடைந்தார்கள்.[a]
  to: யோசுவாவும் இஸ்ரவேல் மக்களும் அவர்களை மிகப் பெரும் படுகொலையால் தாக்கி, அவர்களை முற்றிலும் அழித்து முடித்தபோது, அவர்களில் எஞ்சியிருந்தோர் தப்பிப் பிழைத்து[a] கோட்டையிடப்பட்ட நகரங்களுக்குள் சென்றார்கள்.
  rationale: The revision more closely renders the Hebrew construction ‘strike them [with] a very great slaughter’ and uses an unambiguous modern Tamil expression for fortified cities. It retains the source’s juxtaposition of complete-destruction language with the statement that survivors escaped, without harmonizing that tension. The survivor footnote is moved to its relevant phrase and revised to describe the Hebrew repetition accurately.
