base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/020.yaml
  text: And it happened that when Joshua and the sons of Israel had finished striking them with a very great slaughter[a], until they were wiped out, and the survivors from them survived and entered the fortified cities[b],
translation:
  language: ta
  text: யோசுவாவும் இஸ்ரவேல் மக்களும் அவர்களை மிகப் பெரும் படுகொலையால் தாக்கி, அவர்களை முற்றிலும் அழித்து முடித்தபோது, அவர்களில் எஞ்சியிருந்தோர் தப்பிப் பிழைத்து[a] கோட்டையிடப்பட்ட நகரங்களுக்குள் சென்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மூலத்தில், ‘எஞ்சியோர் எஞ்சினர்’ எனப் பெயர்ச்சொல்–வினைச்சொல் மறுமொழி உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כְּכַלּוֹת
  choice: முடித்தபோது
  rationale: வַיְהִי என்ற எபிரெயக் கதைத் தொடர்ச்சிச் சொல்லைத் தமிழில் தனியே மொழிபெயர்ப்பது இயல்பற்றதாக இருக்கும்; כְּכַלּוֹת உடன் சேர்த்து அடுத்த நிகழ்வுக்கான காலப் பின்னணியாக இயல்பாக வழங்கப்பட்டுள்ளது.
- source_word: יְהוֹשֻׁעַ וּבְנֵי יִשְׂרָאֵל
  choice: யோசுவாவும் இஸ்ரவேல் மக்களும்
  rationale: בְנֵי יִשְׂרָאֵל என்பதன் சொற்பொருள் ‘இஸ்ரவேலின் மகன்கள்’ என்றாலும், இங்கு முழு இஸ்ரவேல் சமூகத்தைக் குறிக்கும் வழக்குச் சொல்; ‘இஸ்ரவேல் மக்கள்’ என்பது இயல்பான, உள்ளடக்கமான நவீனத் தமிழ்.
- source_word: לְהַכּוֹתָם מַכָּה גְדוֹלָה מְאֹד
  choice: மிகப் பெரும் அழிவை உண்டாக்கி அவர்களைத் தாக்கி
  rationale: נכה வேரின் ‘தாக்கு’ என்ற வினைப் பொருளையும், מַכָּה என்பதன் இப்போர்ச் சூழலுக்குரிய கொடிய அழிவு என்ற விளைவையும் இணைத்துப் பாதுகாக்கிறது.
- source_word: עַד תֻּמָּם
  choice: அவர்களை முற்றிலும் அழிக்கும்வரை
  rationale: எதிரிகள் முடிவுக்குக் கொண்டுவரப்பட்டதைக் குறிக்கும் இச்சொற்றொடரின் வலிமையைத் தெளிவாகக் காட்டுகிறது; தொடர்ந்து சிலர் தப்பியதாகக் கூறப்படும் உரையின் பதற்றத்தையும் நீக்கவில்லை.
- source_word: וְהַשְּׂרִידִים שָׂרְדוּ מֵהֶם
  choice: அவர்களில் தப்பிப் பிழைத்தவர்கள்
  rationale: பெயர்–வினை மறுமொழியைத் தமிழில் ‘தப்பிப் பிழைத்தவர்கள்’ என இயல்பாகச் சுருக்குகிறது; מֵהֶם என்பது தோற்கடிக்கப்பட்டவர்களிலிருந்து சிலர் பிழைத்தனர் என்பதை ‘அவர்களில்’ எனத் தெளிவாக்குகிறது.
- source_word: עָרֵי הַמִּבְצָר
  choice: அரண்சூழ்ந்த நகரங்கள்
  rationale: பாதுகாப்பு அரண்களால் வலுப்படுத்தப்பட்ட நகரங்களைக் குறிக்கும் இயல்பான, கண்ணியமான தமிழ் சொற்றொடர்.
theological_decisions:
- issue: முழுமையான அழிவும் பிழைத்தவர்களும் பற்றிய உரையின் பதற்றம்
  choice: ‘முற்றிலும் அழிக்கும்வரை’ என்பதையும் ‘அவர்களில் தப்பிப் பிழைத்தவர்கள்’ என்பதையும் ஒன்றாக வைத்தல்
  alternative: ‘கிட்டத்தட்ட அனைவரையும் அழிக்கும்வரை’ என்று முரண்பாட்டைச் சீராக்குதல்
  rationale: எபிரெய உரை முழுமைப்படுத்தும் வலிமையான மொழியையும் உண்மையில் தப்பியவர்களைப் பற்றிய கூற்றையும் அருகருகே வைக்கிறது; அந்த உண்மையான உரைநடைப் பதற்றத்தை மொழிபெயர்ப்பு மறைக்கக் கூடாது.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான வரலாற்றுக் கதைநடை. வசனம் அடுத்த வசனத்தில் தொடரும் அமைப்பைக் கொண்டிருந்தாலும், தமிழில் வாசிக்கத்தக்க முழு வாக்கியமாக வழங்கப்பட்டுள்ளது.
