base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/013.yaml
  text: So the sun stood still[a], and the moon stopped, until the nation took vengeance on its enemies[d][c][b]. Is this not written in the Book of Jashar? The sun stood still in the middle of the sky and did not hurry to set for about a full day.
translation:
  language: ta
  text: அப்போது சூரியன் அசைவற்று இருந்தது; சந்திரனும் நின்றது. அந்த நாடு தன் பகைவர்கள்மேல் பழிதீர்த்துக்கொள்ளும்வரை இவ்வாறு இருந்தது.[a] இது யாஷார் நூலில் எழுதப்பட்டிருக்கவில்லையா?[b] சூரியன் வானத்தின் நடுவில் நின்றது; ஏறக்குறைய ஒரு முழு நாள் அது மறைய அவசரப்படவில்லை.[c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அந்த நாடு தன் பகைவர்களுக்கு எதிராகத் தனக்கான நீதியை நிலைநாட்டும்வரை.” எபிரெயச் சொற்றொடர் பழிதீர்த்தல் அல்லது நீதியை நிலைநாட்டுதல் ஆகிய பொருள்களைத் தரக்கூடும்.
    reason: lexical_alternative
  - marker: b
    text: 'எபிரெயம்: “யாஷார் நூல்”; இதை “நேர்மையானவரின் நூல்” என்றும் பொருள் கொள்ளலாம்.'
    reason: alternative_reading
  - marker: c
    text: சொல்லடிப்படையில், “வருவதற்கு விரையவில்லை”; சூரியனைப் பற்றிய இச்சூழலில் அது மறைவதைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: d
    text: அல்லது, “ஒரு முழு நாளைப் போல” அல்லது “கிட்டத்தட்ட ஒரு முழு நாள்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּדֹּם הַשֶּׁמֶשׁ
  choice: சூரியன் அசைவற்று இருந்தது
  rationale: דמם என்பதற்கு ‘அமைதியாக இரு’ அல்லது ‘அசைவற்று இரு’ என்ற பொருள்கள் உண்டு. சந்திரன் ‘நின்றது’ என்ற இணைச் சொல்லும் வானியல் சூழலும் இங்கு இயக்கம் நின்றதைக் குறிக்கின்றன; அதே வேளையில் அடுத்த עמד என்பதிலிருந்து சொல்வேறுபாடு பாதுகாக்கப்படுகிறது.
- source_word: וְיָרֵחַ עָמָד
  choice: சந்திரனும் நின்றது
  rationale: עמד என்பதன் அடிப்படைப் பொருள் ‘நில்’. வான்பொருளைப் பற்றிய இச்சூழலில் இயல்பான தமிழில் அதன் இயக்கம் நின்றதை இது தெரிவிக்கிறது.
- source_word: עַד יִקֹּם גּוֹי אֹיְבָיו
  choice: அந்த நாடு தன் பகைவர்களைப் பழிவாங்கும்வரை
  rationale: קום இத்தொடரில் பகைவர்களுக்கு எதிராகப் பழிதீர்த்தல் அல்லது நீதியை நிலைநாட்டுதல் என்ற கருத்தைக் கொண்டுள்ளது. גוי என்பதன் கூட்டொருமைப் பொருளை ‘நாடு’ என்றும், ஒருமை உடைமைப் பின்னொட்டை ‘தன்’ என்றும் மொழிபெயர்க்கிறது.
- source_word: הֲלֹא הִיא כְתוּבָה
  choice: இது ... எழுதப்பட்டிருக்கவில்லையா?
  rationale: முந்திய நிகழ்வு அல்லது மேற்கோளைச் சுட்டும் பெண்பால் சுட்டுப்பெயரை இயல்பான தமிழில் ‘இது’ எனக் கொடுத்து, எபிரெய எதிர்மறை வினாவைத் தக்கவைக்கிறது.
- source_word: סֵפֶר הַיָּשָׁר
  choice: யாஷார் நூல்
  rationale: இது ஒரு மூலநூலின் தலைப்பாக இருப்பதால் יָשָׁר என்பதை மொழிபெயர்த்து முடிவுசெய்யாமல் ‘யாஷார்’ என ஒலிபெயர்க்கிறது; סֵפֶר என்பதற்கு இயல்பான ‘நூல்’ பயன்படுத்தப்படுகிறது.
- source_word: בַּחֲצִי הַשָּׁמַיִם
  choice: வானத்தின் நடுவில்
  rationale: சொல்லடிப்படையில் ‘வானங்களின் பாதி/நடுப்பகுதி’; நவீன தமிழில் இடப்பொருளைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கும் வடிவம்.
- source_word: וְלֹא אָץ לָבוֹא
  choice: அது மறைய அவசரப்படவில்லை
  rationale: אוץ என்பது ‘விரைதல்’; சூரியனைப் பற்றிய בוא அதன் மறைதலைக் குறிக்கும் வழக்காக இங்கு புரிந்துகொள்ளப்படுகிறது. மறைதல் என்ற உட்குறிப்பைத் தமிழில் வெளிப்படுத்துவது இயல்பானது.
- source_word: כְּיוֹם תָּמִים
  choice: ஏறக்குறைய ஒரு முழு நாள்
  rationale: תמים என்பது ‘முழுமையான’; ஒப்புமை முன்னொட்டு כְּ துல்லியமான காலஅளவை வற்புறுத்தாததால் ‘ஏறக்குறைய’ எனக் கொடுக்கப்பட்டுள்ளது.
theological_decisions:
- issue: வானியல் அற்புதத்தின் தன்மை
  choice: சூரியனும் சந்திரனும் நின்றதாக உரை கூறுவதை நேரடியாக மொழிபெயர்த்தல்
  alternative: மனிதப் பார்வைக்கு மட்டும் அவ்வாறு தோன்றியது என இயற்கை விளக்கம் கொடுத்தல், அல்லது இதை வெறும் கவிதை மொழியாகக் குறைத்தல்
  rationale: கதை இதை ஓர் அசாதாரண நிகழ்வாக முன்வைத்து, எழுதப்பட்ட ஒரு மூலநூலையும் சுட்டுகிறது. நவீன அறிவியல் ஒத்திசைவையோ உருவக விளக்கத்தையோ மொழிபெயர்ப்புக்குள் சேர்க்காமல் மூலத்தின் கூற்றையும் பதற்றத்தையும் பாதுகாக்க வேண்டும்.
- issue: נקם என்பதன் நெறியியல் நிழற்பொருள்
  choice: பழிவாங்கு
  alternative: தனக்கான நீதியை நிலைநாட்டு
  rationale: இந்த வேர்ச்சொல் பழிவாங்குதல் மற்றும் நீதிப்படுத்துதல் ஆகிய இரு நிழற்பொருள்களையும் கொள்ளக்கூடும். சூழலில் பகைவர்களுக்கு எதிரான போர்ச் செயலை நேரடியாகக் காட்ட ‘பழிவாங்கு’ முதன்மை உரையில் வைக்கப்பட்டு, மாற்று அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன தரநிலைத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘புஸ்தகம்’ போன்ற பழைய கடன்சொல்லுக்குப் பதில் ‘நூல்’ பயன்படுத்தப்பட்டது. சூரியன், சந்திரன் ஆகியவற்றுக்கு இயற்கைப் பாலைக் கட்டாயப்படுத்தாமல் தமிழுக்குரிய அஃறிணை வினைமுற்று பயன்படுத்தப்பட்டுள்ளது; மூலத்தில் உள்ள דמם/עמד சொல்வேறுபாடு ‘அசைவற்று இருந்தது’/‘நின்றது’ எனப் பாதுகாக்கப்பட்டுள்ளது.
