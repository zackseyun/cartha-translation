base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/003.yaml
  text: So Adoni-zedek king of Jerusalem sent to Hoham king of Hebron, to Piram king of Jarmuth, to Japhia king of Lachish, and to Debir king of Eglon, saying,
translation:
  language: ta
  text: அதனால் எருசலேமின் அரசன் அதோனி-சேதேக், எபிரோனின் அரசன் ஹோகாமுக்கும், யர்மூத்தின் அரசன் பிராமுக்கும், லாகீஷின் அரசன் யாப்பியாவுக்கும், எக்லோனின் அரசன் தெபீருக்கும் செய்தி அனுப்பி,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: அதனால் ... ஆள் அனுப்பி
  rationale: שׁלח என்பதன் எளிய பொருள் ‘அனுப்பு’. முந்தைய வசனத்திற்கான விளைவு அல்லது தொடர்ச்சியை וַ குறிக்கிறது; தமிழில் இயல்பாக ‘அதனால்’ என்று தரப்பட்டுள்ளது. செய்தி சொல்ல மனிதர்களை அனுப்பிய சூழலை ‘ஆள் அனுப்பி’ தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: אֲדֹנִי צֶדֶק
  choice: அதோனி-சேதேக்
  rationale: தனிப்பெயர் மொழிபெயர்க்கப்படாமல் எபிரெய ஒலிப்புக்கு நெருக்கமாக ஒலிபெயர்க்கப்பட்டுள்ளது; இணைப்பெயரின் அமைப்பைக் காட்ட இடைக்கோடு வைக்கப்பட்டுள்ளது.
- source_word: מֶלֶךְ יְרוּשָׁלִַם
  choice: எருசலேமின் அரசன்
  rationale: எபிரெய இணைநிலைத் தொடரை இயல்பான நவீனத் தமிழில் உடைமை வேற்றுமையுடன் வழங்குகிறது.
- source_word: אֶל
  choice: -இடமும்
  rationale: செய்தியைப் பெறும் நபர்களைக் குறிக்கும் முன்னிடைச்சொல். பல பெறுநர்களைப் பட்டியலிடும் தமிழ்ச் சொல்லமைப்பில் ‘இடமும்’ இயல்பாக உள்ளது.
- source_word: הוֹהָם
  choice: ஓகாம்
  rationale: எபிரெய தனிப்பெயரின் ஒலிக்கு நெருக்கமான தமிழ் ஒலிபெயர்ப்பு.
- source_word: חֶבְרוֹן
  choice: எப்ரோன்
  rationale: இடப்பெயர் எபிரெய ஒலிக்கு நெருக்கமாக ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: פִּרְאָם
  choice: பிராம்
  rationale: எபிரெய தனிப்பெயரின் ஒலிக்கு நெருக்கமான தமிழ் ஒலிபெயர்ப்பு.
- source_word: יַרְמוּת
  choice: யர்மூத்
  rationale: இடப்பெயர் எபிரெய ஒலுக்கு நெருக்கமாக ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: יָפִיעַ
  choice: யாப்பியா
  rationale: எபிரெய தனிப்பெயரின் மெய் மற்றும் உயிரொலிகளை இயன்றவரை பிரதிபலிக்கும் தமிழ் வடிவம்.
- source_word: לָכִישׁ
  choice: லாகீஸ்
  rationale: இடப்பெயர் எபிரெய உச்சரிப்புக்கு நெருக்கமாக ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: דְּבִיר
  choice: தெபீர்
  rationale: இங்கு பொதுப்பெயர் அல்ல, அரசனின் தனிப்பெயர்; ஆகவே ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: עֶגְלוֹן
  choice: எக்லோன்
  rationale: இடப்பெயர் எபிரெய ஒலிக்கு நெருக்கமாக ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: לֵאמֹר
  choice: ஆள் அனுப்பி,
  rationale: சொல்லப்போகும் நேரடி உரையை அறிமுகப்படுத்தும் எபிரெயச் சூத்திரம். வசனம் அடுத்த வசனத்தில் தொடர்வதால் தமிழில் முடிவுறாத வாக்கியமாக காற்புள்ளியுடன் வைக்கப்பட்டுள்ளது; ‘சொல்லி’ எனச் சேர்ப்பது ‘ஆள் அனுப்பி’ என்பதோடு செயற்கையாக ஒலிக்கும் என்பதால் நேரடி உரைக்கான முன்னோட்டம் நிறுத்தக்குறியால் வெளிப்படுகிறது.
