revisions:
- from: அதனால் எருசலேமின் அரசன் அதோனி-சேதேக், எப்ரோனின் அரசன் ஓகாமிடமும், யர்மூத்தின் அரசன் பிராமிடமும், லாகீசின் அரசன் யாப்பியாவிடமும், எக்லோனின் அரசன் தெபீரிடமும் ஆள் அனுப்பி,
  to: அதனால் எருசலேமின் அரசன் அதோனி-சேதேக், எபிரோனின் அரசன் ஹோகாமுக்கும், யர்மூத்தின் அரசன் பிராமுக்கும், லாகீஷின் அரசன் யாப்பியாவுக்கும், எக்லோனின் அரசன் தெபீருக்கும் செய்தி அனுப்பி,
  rationale: The revision removes the unwarranted specification ‘ஆள்’ while retaining the communicative sense required by the syntax and the following verse. It also makes limited source-oriented corrections to personal and place-name transliterations. The comma is retained because the Hebrew participial infinitive ‘saying’ introduces the content in Joshua 10:4.
