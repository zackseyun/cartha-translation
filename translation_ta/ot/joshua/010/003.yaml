translation_notes:
  register: நவீனத் தரத் தமிழில் மரியாதையான கதைநடை பயன்படுத்தப்பட்டுள்ளது. அரசர்களின் பெயர்களும் இடப்பெயர்களும் மூல எபிரெய ஒலியமைப்புக்கு நெருக்கமாகத் தமிழ் எழுத்தில் தரப்பட்டுள்ளன. ‘மன்னன்’ என்பதற்குப் பதில் சமகால வாசகருக்கும் தெளிவான ‘அரசன்’ பயன்படுத்தப்பட்டுள்ளது. வசனம் அடுத்த வசனத்தின் நேரடி உரையை நோக்கித் தொடர்வதால் காற்புள்ளியுடன் முடிகிறது.
