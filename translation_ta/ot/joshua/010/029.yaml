  yaml_path: translation/ot/joshua/010/029.yaml
  text: Then Joshua[a], and all Israel with him, passed on from Makkedah to Libnah and fought against Libnah.
translation:
  language: ta
  text: பின்பு யோசுவாவும் அவருடன் இருந்த இஸ்ரவேலர் அனைவரும் மக்கேதாவிலிருந்து லிப்னாவுக்குச் சென்று, லிப்னாவுக்கு எதிராகப் போரிட்டார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲבֹר
  choice: சென்று
  rationale: עבר என்பது ஓர் இடத்திலிருந்து அடுத்த இடத்துக்கு நகர்ந்து செல்வதை இங்கு குறிக்கிறது. ஆற்றைக் கடத்தல் போன்ற பொருளைத் தேவையின்றி சேர்க்காமல், படையெடுப்பின் தொடர்ச்சியை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: עִמּוֹ
  choice: அவருடன் இருந்த
  rationale: 3ஆம் நபர் ஆண்பால் ஒருமை பின்னொட்டுடன் வரும் עִם, யோசுவாவுடன் இஸ்ரவேலர் சென்ற துணைநிலையைத் தெளிவாகக் காட்டுகிறது.
- source_word: מִמַּקֵּדָה
  choice: மக்கேதாவிலிருந்து
  rationale: முன்னொட்டு מִן புறப்படும் இடத்தைக் குறிக்கிறது; இடப்பெயர் தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: לִבְנָה
  choice: லிப்னாவுக்கு
  rationale: இயக்கத்தின் இலக்கை לְ குறிக்கிறது; இடப்பெயர் பொருள் மொழிபெயர்க்கப்படாமல் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: וַיִּלָּחֶם
  choice: போரிட்டார்கள்
  rationale: Niphal வடிவிலுள்ள לחם இங்கு போரிடுதல் அல்லது போரில் ஈடுபடுதல் என்று பொருள்படும். கூட்டு எழுவாய்க்கு ஏற்ற இயல்பான தமிழ் பன்மை வினை பயன்படுத்தப்பட்டுள்ளது.
- source_word: עִם לִבְנָה
  choice: லிப்னாவுக்கு எதிராக
  rationale: עִם பொதுவாக ‘உடன்’ எனப் பொருள்பட்டாலும், לחם என்பதற்குப் பின் அது போரின் எதிர்த்தரப்பைக் குறிக்கும் மரபுத்தொடராக உள்ளது; ஆகவே தமிழில் ‘எதிராக’ என்பது தெளிவான இணைச்சொல்.
