translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் வடிக்கப்பட்டது. எபிரெயச் சொல்வரிசையைத் தமிழின் இயல்பான காலவரிசைக்கு மாற்றியிருந்தாலும், இரவு முழுவதும் கில்காலிலிருந்து மேலே வந்த பின்னர் திடீரென நெருங்கினார் என்ற உறவு பாதுகாக்கப்பட்டுள்ளது. ‘நெருங்கினார்’ என்பது மூலத்தின் இராணுவச் சூழலை உணர்த்துகிறது; ஆனால் தாக்குதல் நிகழ்ந்ததாக மிகைப்படுத்தவில்லை.
