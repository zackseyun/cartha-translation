  text: So Joshua came upon them suddenly[b][a], having marched up from Gilgal all night.
translation:
  language: ta
  text: யோசுவா இரவு முழுவதும் கில்காலிலிருந்து மேலே வந்து, திடீரென்று அவர்களை நெருங்கினார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘திடீரென்று அவர்களிடம் வந்தார்’ என்றும் மொழிபெயர்க்கலாம். எபிரெய வினை சொல்லளவில் ‘வந்தார்’ என்பதாகும்; போர்ச் சூழல் பகைவரைத் திடீரென நெருங்கியதைக் காட்டுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא אֲלֵיהֶם
  choice: அவர்களை நெருங்கினார்
  rationale: בוא என்பதன் அடிப்படைப் பொருள் ‘வருதல்’; אֶל என்பது ‘நோக்கி/அருகே’ என்பதைக் குறிக்கிறது. போர்ச் சூழலில் ‘அவர்களை நெருங்கினார்’ என்பது பகைவரை நோக்கிய அணுகுதலை இயல்பாகத் தெரிவிக்கிறது; தாக்கினார் என்று மூலத்தைவிட அதிகமாகக் கூறுவதையும் தவிர்க்கிறது.
- source_word: יְהוֹשֻׁעַ
  choice: யோசுவா
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் நிலைபெற்றுள்ள பெயர்வடிவம்.
- source_word: פִּתְאֹם
  choice: திடீரென்று
  rationale: திடீர் அல்லது எதிர்பாராத நிகழ்வைக் குறிக்கும் எபிரெய வினையடையின் நேரடியான, இயல்பான தமிழ் இணை.
- source_word: כָּל הַלַּיְלָה
  choice: இரவு முழுவதும்
  rationale: காலநீட்சியை முழுமையாகவும் இயல்பான நவீன தமிழிலும் தெரிவிக்கிறது.
- source_word: עָלָה
  choice: மேலே வந்து
  rationale: עלה என்பது சொல்லளவில் ‘மேலே செல்லுதல்/ஏறுதல்.’ கில்காலிலிருந்து நடந்த படைநகர்வின் நிலவியல் உயர்வை ‘மேலே வந்து’ பாதுகாக்கிறது; ‘அணிவகுத்துச் சென்றார்’ போன்ற கூடுதல் விவரத்தைச் சேர்க்கவில்லை.
- source_word: מִן הַגִּלְגָּל
  choice: கில்காலிலிருந்து
  rationale: புறப்பட்ட இடத்தைக் குறிக்கும் நேரடியான மொழிபெயர்ப்பு; இடப்பெயர் தமிழில் நிலைபெற்ற வடிவில் ஒலிபெயர்க்கப்படுகிறது.
