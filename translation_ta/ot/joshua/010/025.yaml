source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר אֲלֵי/הֶם֙ יְהוֹשֻׁ֔עַ אַל תִּֽירְא֖וּ וְ/אַל תֵּחָ֑תּוּ חִזְק֣וּ וְ/אִמְצ֔וּ כִּ֣י כָ֗כָה יַעֲשֶׂ֤ה יְהוָה֙ לְ/כָל אֹ֣יְבֵי/כֶ֔ם אֲשֶׁ֥ר אַתֶּ֖ם נִלְחָמִ֥ים אוֹתָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/025.yaml
  text: And Joshua said to them[a], “Do not fear and do not be dismayed. Be strong and courageous, for thus Yahweh will do to all your enemies against whom you are fighting.”
translation:
  language: ta
  text: யோசுவா அவர்களிடம், “பயப்படாதீர்கள்; மனம் தளராதீர்கள்.[a] பலமாகவும் துணிவாகவும் இருங்கள். ஏனெனில், நீங்கள் எதிர்த்துப் போரிடும் உங்கள் எதிரிகள் அனைவருக்கும் யாவே இப்படியே செய்வார்” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பயப்படாதீர்கள்; நிலைகுலையாதீர்கள்.”
    reason: חתת என்ற வினை உள்ளம் உடைதல், கலங்குதல் அல்லது நிலைகுலைதல் ஆகிய நெருங்கிய பொருள்களை ஏற்கக்கூடியதால் இந்த மாற்று தரப்படுகிறது.
lexical_decisions:
- source_word: וַיֹּאמֶר אֲלֵיהֶם יְהוֹשֻׁעַ
  choice: யோசுவா அவர்களிடம் … என்றார்
  rationale: எபிரெயக் கதைநடையின் தொடர்ச்சியை இயல்பான நவீனத் தமிழ் வாக்கிய அமைப்பில் தருகிறது.
- source_word: אַל תִּירְאוּ
  choice: பயப்படாதீர்கள்
  rationale: ירא என்பதன் எதிர்மறைக் கட்டளையைத் தெளிவாகவும் நேரடியாகவும் தருகிறது.
- source_word: וְאַל תֵּחָתּוּ
  choice: மனம் தளராதீர்கள்
  rationale: חתת என்பதிலுள்ள நிலைகுலைதல் அல்லது உள்ளம் உடைதல் என்ற கருத்தை இயல்பான தமிழில் வெளிப்படுத்தி, முந்தைய ‘பயப்படாதீர்கள்’ என்பதோடு ஒன்றாக்காமல் வேறுபாட்டைப் பேணுகிறது.
- source_word: חִזְקוּ וְאִמְצוּ
  choice: பலங்கொண்டு துணிவாயிருங்கள்
  rationale: உறுதியான வலிமை மற்றும் துணிவான மனநிலை ஆகிய இரு கூறுகளையும் பேணும் இயல்பான ஊக்கவுரை.
- source_word: כִּי כָכָה
  choice: ஏனெனில் … இப்படியே
  rationale: כִּי கூறும் காரணத்தையும் כָכָה சுட்டும் ‘இந்த விதமாகவே’ என்ற பொருளையும் தெளிவாகப் பேணுகிறது.
- source_word: יַעֲשֶׂה יְהוָה
  choice: யாவே … செய்வார்
  rationale: இச்சூழலில் yiqtol எதிர்காலச் செயலைக் குறிக்கிறது; יהוה என்ற இறைப் பெயர் ‘யாவே’ என்று ஒலிபெயர்க்கப்படுகிறது.
- source_word: לְכָל אֹיְבֵיכֶם
  choice: உங்கள் எதிரிகள் அனைவருக்கும்
  rationale: עשה உடன் வரும் לְ குறிக்கும், எதிரிகளுக்குச் செய்யப்படும் செயலை நேரடியாகத் தருகிறது.
- source_word: אֲשֶׁר אַתֶּם נִלְחָמִים אוֹתָם
  choice: நீங்கள் எதிர்த்துப் போரிடும்
  rationale: எபிரெய மொழியின் தொடர்புச் சொற்றொடரைத் தமிழில் இயல்பாக்கி, போரின் எதிர்நிலையை ‘எதிர்த்து’ என்பதால் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலத்தில் நேரடியாக உள்ள நான்கெழுத்து இறைப் பெயரைப் பொதுப்பட்டமாக மாற்றாமல், ‘Yahweh’ என்பதற்கேற்ற தமிழொலியில் தருகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியக்கூடிய அதே நேரத்தில் கண்ணியமான வேதாகமக் கதைநடை. பன்மை மரியாதைக் கட்டளை வடிவங்களும் இறைவனுக்குரிய உயர்திணை வினைமுற்றும் பயன்படுத்தப்பட்டுள்ளன.
