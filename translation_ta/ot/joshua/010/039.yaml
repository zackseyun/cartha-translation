base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/039.yaml
  text: And they captured it[a], along with its king and all its towns, and struck them with the edge of the sword, and they devoted to destruction every person who was in it; they left no survivor. Just as he had done to Hebron, so he did to Debir and its king, and just as he had done to Libnah and its king.
translation:
  language: ta
  text: அவர்கள் அதையும், அதன் அரசனையும், அதைச் சேர்ந்த எல்லாப் பட்டணங்களையும் கைப்பற்றி, அவர்களை வாளின் முனையால் வெட்டினார்கள். அதிலிருந்த ஒவ்வொருவரையும் அழிவுக்கு அர்ப்பணித்தார்கள்[a]; தப்பிப் பிழைத்த ஒருவரையும் அவன் விட்டுவைக்கவில்லை. எப்ரோனுக்கு அவன் செய்ததுபோலவே தெபீருக்கும் அதன் அரசனுக்கும் செய்தான்; லிப்னாவுக்கும் அதன் அரசனுக்கும் அவன் செய்ததுபோலவே செய்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது: ‘அவர்களை முற்றிலும் அழித்தார்கள்.’ எபிரெயத்தில், முழு அழிவுக்கென ஒன்றை அர்ப்பணிப்பதைக் குறிக்கும் חרם (ஹேரெம்) சொல்லாட்சி இங்கு பயன்படுத்தப்பட்டுள்ளது.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּלְכְּדָהּ
  choice: அவர்கள் அதைக் கைப்பற்றி
  rationale: לכד என்பது போர்ச் சூழலில் ‘கைப்பற்று’ என்று பொருள்படும். எபிரெய வினை ஒருமையில் இருந்தாலும், உடன்வரும் பன்மை வினைகளும் யோசுவாவின் தலைமையிலான இஸ்ரவேலரின் கூட்டு நடவடிக்கையும் கருத்தில் கொண்டு இயல்பான தமிழில் பன்மை பயன்படுத்தப்பட்டது.
- source_word: וְאֶת מַלְכָּהּ וְאֶת כָּל עָרֶיהָ
  choice: அதன் அரசனையும், அதைச் சேர்ந்த எல்லாப் பட்டணங்களையும்
  rationale: பெண்பால் பின்னொட்டுகள் தெபீர் நகரத்தைக் குறிக்கின்றன. עָרֶיהָ என்பது முதன்மை நகரைச் சார்ந்த குடியிருப்பு மையங்களைக் குறிப்பதால் ‘அதைச் சேர்ந்த எல்லாப் பட்டணங்கள்’ எனத் தரப்பட்டது.
- source_word: וַיַּכּוּם לְפִי חֶרֶב
  choice: அவர்களை வாளின் முனையால் வெட்டினார்கள்
  rationale: ‘வாளின் வாய்/முனை’ என்ற எபிரெயப் படிமத்தை ‘வாளின் முனை’ எனத் தக்கவைத்து, נכה என்பதன் கொல்லும் போர்ச் செயலை ‘வெட்டினார்கள்’ என இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וַיַּחֲרִימוּ
  choice: அழிவுக்கு அர்ப்பணித்தார்கள்
  rationale: חרם என்ற தொழில்நுட்பச் சொல்லில் சாதாரண அழிப்பை விட அர்ப்பணிக்கப்பட்ட முழு அழிவு என்ற சமய-போரியல் கருத்து உள்ளது; அதைச் சுருக்காமல் இச்சொற்றொடர் தக்கவைக்கிறது.
- source_word: אֶת כָּל נֶפֶשׁ אֲשֶׁר בָּהּ
  choice: அதிலிருந்த ஒவ்வொருவரையும்
  rationale: נפש இங்கு உடலற்ற ‘ஆத்துமா’வை அல்ல, நகரிலிருந்த நபர்களைக் குறிக்கிறது. ‘ஒவ்வொருவரையும்’ என்பது தெளிவான நவீனத் தமிழ்.
- source_word: לֹא הִשְׁאִיר שָׂרִיד
  choice: தப்பிப் பிழைத்த ஒருவரையும் அவன் விட்டுவைக்கவில்லை
  rationale: שָׂרִיד என்பதற்கு ‘தப்பிப் பிழைத்தவர்’ பொருத்தமானது. இங்கு எபிரெயம் ஒருமைக்கு மாறுவதால், யோசுவாவைக் குறிக்கும் ‘அவன்’ என்பதைத் தக்கவைத்து எண்ணிக்கை மாற்றம் பாதுகாக்கப்பட்டது.
- source_word: כַּאֲשֶׁר עָשָׂה לְחֶבְרוֹן כֵּן עָשָׂה לִדְבִרָהּ
  choice: எப்ரோனுக்கு அவன் செய்ததுபோலவே தெபீருக்கும் ... செய்தான்
  rationale: ஒப்பீட்டு அமைப்பையும் ஒருமைச் செய்பொருளையும் பாதுகாக்கும் இயல்பான தமிழ் வடிவம்.
- source_word: וְכַאֲשֶׁר עָשָׂה לְלִבְנָה וּלְמַלְכָּהּ
  choice: லிப்னாவுக்கும் அதன் அரசனுக்கும் அவன் செய்ததுபோலவே செய்தான்
  rationale: தெபீரின் முடிவை லிப்னாவுக்கும் அதன் அரசனுக்கும் ஏற்பட்ட முடிவோடு ஒப்பிடும் மூலத்தின் அமைப்பு தக்கவைக்கப்பட்டது.
theological_decisions:
- issue: חרם என்ற போரியல் சொல்லின் மொழிபெயர்ப்பு
  choice: அழிவுக்கு அர்ப்பணித்தார்கள்
  alternative: முற்றிலும் அழித்தார்கள் / அழிவுக்குரியதாக்கினார்கள்
  rationale: இச்சொல் வெறும் கொலையை மட்டும் அல்லாமல், அழிவுக்கென ஒதுக்கப்பட்ட அல்லது அர்ப்பணிக்கப்பட்ட நிலையைக் குறிக்கிறது. மூலத்தின் சமய-நீதித்துறை சார்ந்த நுணுக்கத்தை விளக்கவுரையால் பெருக்காமல் இத்தேர்வு பாதுகாக்கிறது.
- issue: பன்மை மற்றும் ஒருமை செய்பொருள்களுக்கு இடையிலான கதைமுறை மாற்றம்
  choice: கூட்டு நடவடிக்கைகளுக்கு ‘அவர்கள்’; ‘விட்டுவைக்கவில்லை’ மற்றும் ஒப்பீட்டு வாக்கியங்களுக்கு ‘அவன்’
  alternative: அனைத்தையும் பன்மையாக்குதல் / அனைத்தையும் ஒருமையாக்குதல்
  rationale: எபிரெய உரை இஸ்ரவேலரின் கூட்டு நடவடிக்கையையும் யோசுவாவின் பிரதிநிதித் தலைமையையும் பிரதிபலிக்கும் வகையில் எண்ணிக்கையை மாற்றுகிறது. அந்த உண்மையான பதற்றத்தைச் சீராக்காமல் தக்கவைக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும் வகையில் இயல்பானதாயும், வரலாற்றுக் கதைநடைக்கு ஏற்ற கண்ணியமான நடையிலும் அமைக்கப்பட்டது. ‘அழிவுக்கு அர்ப்பணித்தார்கள்’ என்ற சொற்றொடர் தொழில்நுட்ப நுணுக்கத்தைக் காக்கிறது; மூலத்தில் உள்ள பன்மை–ஒருமை மாற்றமும் திட்டமிட்டு தக்கவைக்கப்பட்டது.
