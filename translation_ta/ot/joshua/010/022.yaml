  text: וַ/יֹּ֣אמֶר יְהוֹשֻׁ֔עַ פִּתְח֖וּ אֶת פִּ֣י הַ/מְּעָרָ֑ה וְ/הוֹצִ֣יאוּ אֵלַ֗/י אֶת חֲמֵ֛שֶׁת הַ/מְּלָכִ֥ים הָ/אֵ֖לֶּה מִן הַ/מְּעָרָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/022.yaml
  text: Then Joshua said[a], “Open the mouth of the cave[b], and bring those five kings out of the cave to me.”
translation:
  language: ta
  text: அப்போது யோசுவா, “குகையின் வாயிலை[a]த் திறந்து, இந்த ஐந்து அரசர்களையும் குகையிலிருந்து வெளியே என்னிடம் கொண்டுவாருங்கள்” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மொழியில் சொற்படியாக, ‘குகையின் வாய்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: அப்போது ... என்றார்
  rationale: வாவ் தொடர்வினை கதையின் அடுத்த நிகழ்வை முன்னெடுக்கிறது; நவீன தமிழில் ‘அப்போது’ நிகழ்வுகளின் வரிசையை இயல்பாகக் காட்டுகிறது.
- source_word: יְהוֹשֻׁעַ
  choice: யோசுவா
  rationale: தமிழ் வேதாகம மரபில் நிலைபெற்றுள்ள பெயரெழுத்தாக்கம்.
- source_word: פִּתְחוּ
  choice: திறந்து
  rationale: பன்மை ஏவல் வடிவத்தின் நேரான, இயல்பான தமிழ் மொழிபெயர்ப்பு; தொடர்ந்து வரும் ஏவலுடன் இணைக்கப்பட்டுள்ளது.
- source_word: פִּי הַמְּעָרָה
  choice: குகையின் வாயிலை
  rationale: எபிரெயச் சொற்றொடர் சொற்படியாக ‘குகையின் வாய்’ எனினும், குகையின் திறப்பை நவீன தமிழில் தெளிவாகவும் இயல்பாகவும் ‘குகையின் வாயில்’ என்று கூறலாம்; மூலப்படிமம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: וְהוֹצִיאוּ
  choice: வெளியே ... கொண்டுவாருங்கள்
  rationale: יצא என்பதன் ஹிஃபில் ஏவல், உள்ளேயிருப்பவர்களை வெளியே வரச்செய்து யோசுவாவிடம் அழைத்து வருவதைக் குறிக்கிறது.
- source_word: אֵלַי
  choice: என்னிடம்
  rationale: முதலாம் நபர் ஒருமை பின்னொட்டுடன் கூடிய முன்னிடைச்சொல் யோசுவாவை நோக்கிய இயக்கத்தை நேரடியாகக் குறிக்கிறது.
- source_word: חֲמֵשֶׁת הַמְּלָכִים הָאֵלֶּה
  choice: இந்த ஐந்து அரசர்களையும்
  rationale: הָאֵלֶּה என்பது அருகுச்சுட்டான ‘இந்த’ என்பதற்கு நேரான இணை; குறிப்பிட்ட ஐந்து அரசர்களைச் சுட்டுகிறது. செயப்படுபொருள் குறியீடு தமிழில் இயல்பாகச் சேர்க்கப்பட்டுள்ளது.
- source_word: מִן הַמְּעָרָה
  choice: குகையிலிருந்து வெளியே
  rationale: பிரித்தெடுத்தல் அல்லது வெளியேற்றத்தைக் குறிக்கும் מִן என்பதையும், குகையின் உள்ளிருந்து வெளியே வரும் இயக்கத்தையும் தெளிவாக வெளிப்படுத்துகிறது.
