  register: நவீன நிலையான தமிழில் எளிமையும் கண்ணியமும் கொண்ட கதைநடை பயன்படுத்தப்பட்டுள்ளது. பன்மை ஏவல் மரியாதை/கட்டளை வடிவமான ‘கொண்டுவாருங்கள்’ மூலம் இயல்பாக வெளிப்படுத்தப்பட்டுள்ளது. மூலத்தின் ‘குகையின் வாய்’ என்ற உருவகம் பிரதான உரையில் புரிதலுக்கேற்ற ‘வாயில்’ என்றும், சொற்படியான வடிவம் அடிக்குறிப்பிலும் வைக்கப்பட்டுள்ளது.
