base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/042.yaml
  text: Joshua captured all these kings and their land at one time[a], because Yahweh, the God of Israel, fought for Israel.
translation:
  language: ta
  text: யோசுவா இந்த அரசர்கள் அனைவரையும் அவர்களுடைய நாட்டையும் ஒரே தடவையில்[a] கைப்பற்றினார்; ஏனெனில் இஸ்ரவேலின் கடவுளான யாவே இஸ்ரவேலுக்காகப் போரிட்டார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஒரே படையெடுப்பில்.” எபிரெய மொழியில் சொற்பொருளாக, “ஒரே முறை” அல்லது “ஒரே தடவையில்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכַד
  choice: கைப்பற்றினார்
  rationale: இராணுவச் சூழலில் பிடித்தல் அல்லது கைப்பற்றுதல் என்ற பொருளை இயல்பாகத் தருகிறது; ‘வென்றார்’ என்பதைவிட மூல வினையின் பொருளைத் துல்லியமாகக் காக்கிறது.
- source_word: וְאֵת כָּל הַמְּלָכִים הָאֵלֶּה
  choice: இந்த அரசர்கள் அனைவரையும்
  rationale: நேரடிச் செயப்படுபொருளையும் சுட்டுப்பெயரடையையும் நவீனத் தமிழில் தெளிவாகப் பிரதிபலிக்கிறது.
- source_word: וְאֶת אַרְצָם
  choice: அவர்களுடைய நாட்டையும்
  rationale: אֶרֶץ இங்கு அரசர்களின் ஆட்சிப்பரப்பைக் குறிக்கிறது; ‘நாடு’ பொதுவாசகருக்கு இயல்பாகவும் விரிவானதாகவும் உள்ளது.
- source_word: פַּעַם אֶחָת
  choice: ஒரே சமயத்தில்
  rationale: எபிரெயச் சொற்றொடரின் ‘ஒரே நேரம்/முறை’ என்ற வடிவத்தை நெருக்கமாகக் காக்கிறது; சூழலில் ‘ஒரே படையெடுப்பில்’ என்ற பொருள் இருக்கக்கூடும் என்பதால் அதை அடிக்குறிப்பில் தருகிறது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: யோசுவாவின் வெற்றிக்கான காரணத்தை அறிமுகப்படுத்தும் காரணவியல் இணைப்பைத் தெளிவாகக் காட்டுகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: நான்கு எழுத்துகளாலான இறைபெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் அதன் தனிப்பெயராக ஒலிபெயர்க்கிறது.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் கடவுளாகிய
  rationale: எபிரெயக் கட்டமைப்பை இயல்பான, கண்ணியமான தமிழில் வழங்குகிறது.
- source_word: נִלְחָם לְיִשְׂרָאֵל
  choice: இஸ்ரவேலுக்காகப் போரிட்டார்
  rationale: לְ உடன் வரும் வினை இஸ்ரவேலின் சார்பாக அல்லது நன்மைக்காகப் போரிட்டதைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைபெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: யெகோவா
  rationale: மூலத்தில் இறைவனின் தனிப்பெயர் நேரடியாக உள்ளது. அதை ‘ஆண்டவர்’ போன்ற பட்டமாக மாற்றாமல், பொதுவாக ஏற்கப்படும் ஒலிப்புக்கு ஏற்ப ‘யாவே’ என வழங்குவது மூலத்தின் தனித்தன்மையைப் பாதுகாக்கிறது.
