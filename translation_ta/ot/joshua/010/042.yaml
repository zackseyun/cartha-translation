  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான வரலாற்று நடையைக் கடைப்பிடிக்கிறது. ‘அரசர்கள்’, ‘நாடு’, ‘கைப்பற்றினார்’ ஆகியவை இயல்பான இராணுவ-வரலாற்றுச் சொற்களாகத் தேர்ந்தெடுக்கப்பட்டுள்ளன.
