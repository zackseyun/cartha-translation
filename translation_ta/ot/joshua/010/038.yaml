source:
  edition: WLC
  text: וַ/יָּ֧שָׁב יְהוֹשֻׁ֛עַ וְ/כָל יִשְׂרָאֵ֥ל עִמּ֖/וֹ דְּבִ֑רָ/ה וַ/יִּלָּ֖חֶם עָלֶֽי/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/038.yaml
  text: Then Joshua[a], and all Israel with him, returned to Debir and fought against it.
translation:
  language: ta
  text: பின்பு யோசுவாவும், அவருடன் இருந்த இஸ்ரவேலர் அனைவரும், தெபீருக்குத் திரும்பி அதற்கு எதிராகப் போரிட்டார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: திரும்பி
  rationale: שׁוב என்ற வினை இங்கு ஓர் இடத்திற்குத் திரும்பிச் செல்வதைக் குறிக்கிறது. தொடர் நிகழ்வை இயல்பான தமிழில் வெளிப்படுத்த வினையெச்ச வடிவம் பயன்படுத்தப்பட்டது.
- source_word: יְהוֹשֻׁעַ
  choice: யோசுவா
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் நிலைபெற்றுள்ள பெயர் வடிவம்.
- source_word: וְכָל יִשְׂרָאֵל עִמּוֹ
  choice: அவருடன் இஸ்ரவேலர் அனைவரும்
  rationale: עִמּוֹ என்பதிலுள்ள ‘அவருடன்’ என்ற பொருளை வெளிப்படையாகப் பாதுகாக்கிறது; כָל יִשְׂרָאֵל என்பதை இயல்பான தமிழில் கூட்டாகக் குறிப்பிடுகிறது.
- source_word: דְּבִרָה
  choice: தெபீருக்கு
  rationale: இடப்பெயருடன் இணைந்துள்ள திசைகாட்டும் ה, தெபீரை நோக்கிய இயக்கத்தைக் குறிக்கிறது; ‘தெபீருக்கு’ என்பது இதற்கான இயல்பான தமிழ் வடிவம்.
- source_word: וַיִּלָּחֶם
  choice: போரிட்டார்கள்
  rationale: לחם இங்கு போரில் ஈடுபடுவதைக் குறிக்கிறது. கூட்டு எழுவாய்க்கு ஏற்ற மரியாதைப் பன்மை வினைமுற்று நவீனத் தமிழில் இயல்பாக உள்ளது.
- source_word: עָלֶיהָ
  choice: அதற்கு எதிராக
  rationale: எபிரெயில் பெண்பால் ஒருமை சுட்டுப்பெயர் தெபீர் நகரத்தைக் குறிக்கிறது. தமிழில் உயிரற்ற நகரத்தைக் குறிப்பிட ‘அது’ இயல்பானது; עַל என்பதன் பகைமை சார்ந்த பொருள் ‘எதிராக’ எனப் பாதுகாக்கப்படுகிறது.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழில் எளிமையும் கண்ணியமும் பேணப்பட்டுள்ளன. எபிரெயத் தொடர் கதைநடையின் இரண்டு வினைகளும் தமிழில் ‘திரும்பி ... போரிட்டார்கள்’ என இயல்பாக இணைக்கப்பட்டுள்ளன. மூலத்தின் இலக்கணப் பெண்பால் தமிழில் பொருள் வேறுபாட்டை ஏற்படுத்தாததால் அடிக்குறிப்பு தேவையில்லை.
