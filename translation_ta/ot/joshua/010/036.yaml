reference: Joshua 10:36
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יַּ֣עַל יְ֠הוֹשֻׁעַ וְ/כָֽל יִשְׂרָאֵ֥ל עִמּ֛/וֹ מֵ/עֶגְל֖וֹנָ/ה חֶבְר֑וֹנָ/ה וַ/יִּֽלָּחֲמ֖וּ עָלֶֽי/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/036.yaml
  text: Then Joshua[a], and all Israel with him, went up from Eglon to Hebron, and they fought against it.
translation:
  language: ta
  text: பின்பு யோசுவாவும் அவருடன் இஸ்ரவேலர் அனைவரும் எக்லோனிலிருந்து எப்ரோனுக்கு மேலே சென்று, அதற்கு எதிராகப் போரிட்டார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַל
  choice: போய்
  rationale: עלה என்பது மேலே செல்லுதல் என்ற திசை உணர்வைக் கொண்டது. இங்கு இடங்களுக்கு இடையிலான பயணத்தை இயல்பான தமிழில் கூறுவதற்கு ‘போய்’ பொருத்தமானது; எப்ரோனை நோக்கிய நகர்வு அடுத்த சொற்றொடரால் தெளிவாகிறது.
- source_word: וְכָל יִשְׂרָאֵל
  choice: இஸ்ரவேலர் அனைவரும்
  rationale: ‘இஸ்ரவேல் முழுவதும்’ என்ற எபிரெயக் கூட்டுப்பெயரை, யோசுவாவுடன் சென்ற மக்களைக் குறிக்கும் இயல்பான நவீன தமிழாக வழங்குகிறது.
- source_word: עִמּוֹ
  choice: அவருடன்
  rationale: மூன்றாம் நபர் ஆண்பால் ஒருமை பின்னொட்டு யோசுவாவைக் குறிக்கிறது; மரியாதையும் இயல்பும் உள்ள தமிழில் ‘அவருடன்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: מֵעֶגְלֹנָה
  choice: எக்லோனிலிருந்து
  rationale: מִן முன்னொட்டு புறப்பட்ட இடத்தைக் குறிக்கிறது. இடப்பெயருடன் இணைந்துள்ள திசைச் சுட்டை தமிழில் தனியே காட்ட வேண்டியதில்லை.
- source_word: חֶבְרוֹנָה
  choice: எப்ரோனுக்குப்
  rationale: இடப்பெயரின் இறுதியில் உள்ள திசைச் சுட்டு எப்ரோனை நோக்கிய நகர்வைக் குறிக்கிறது; தமிழில் நான்காம் வேற்றுமை உருபு அதை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וַיִּלָּחֲמוּ
  choice: போரிட்டார்கள்
  rationale: לחם என்பதன் நிஃபால் வடிவம் இங்கு போரில் ஈடுபடுதலைக் குறிக்கிறது. ‘போரிட்டார்கள்’ என்பது தெளிவான, நவீனத் தமிழ்.
- source_word: עָלֶיהָ
  choice: அதற்கு எதிராக
  rationale: עַל இங்கு எதிர்த்துப் போரிடுதல் என்ற பொருளைக் கொண்டது. பெண்பால் ஒருமை பின்னொட்டு எப்ரோன் நகரைக் குறிக்கிறது; நகரைக் குறிக்கும் இயல்பான தமிழ் பதிலிப்பெயர் ‘அது’ என்பதால் ‘அதற்கு எதிராக’ என வழங்கப்பட்டது.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. எபிரெயக் கதையோட்டம் இயல்பான தமிழ் வாக்கிய அமைப்பில் பாதுகாக்கப்பட்டுள்ளது; நகரைக் குறிக்கும் பெண்பால் பின்னொட்டின் வடிவம் அடிக்குறிப்பில் சுட்டப்பட்டுள்ளது.
