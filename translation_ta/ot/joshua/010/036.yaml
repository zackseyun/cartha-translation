  terminology: The names யோசுவா, இஸ்ரவேலர், எக்லோன், and எப்ரோன் are used consistently. ‘போரிட்டார்கள்’ accurately communicates the military action. The footnote appropriately explains that the Hebrew feminine pronoun refers to the city.
