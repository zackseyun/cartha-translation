  text: And Joshua struck them from Kadesh-barnea as far as Gaza[a], and all the land of Goshen, as far as Gibeon.
translation:
  language: ta
  text: யோசுவா அவர்களைக் காதேஸ்-பர்னேயாவிலிருந்து காசா வரையிலும், கோசேன் நாடு முழுவதையும், கிபியோன் வரையிலும் தாக்கினார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “வீழ்த்தினார்” அல்லது “தோற்கடித்தார்” என்றும் மொழிபெயர்க்கலாம். எபிரெய வினை போரில் தாக்குவதையோ தோற்கடிப்பதையோ குறிக்கலாம்; அது எப்போதும் தாக்கப்பட்ட அனைவரும் கொல்லப்பட்டார்கள் என்று குறிப்பிடுவதில்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּכֵּם
  choice: தாக்கினார்
  rationale: נכה என்ற வினை இங்கு போர்ச் சூழலில் தாக்குதல் அல்லது தோற்கடித்தலைக் குறிக்கிறது; அனைவரும் கொல்லப்பட்டதாக மிகையாகத் தீர்மானிக்காமல், எபிரெயச் சொல்லின் நேரடியான படிமத்தைப் பாதுகாக்கிறது.
- source_word: מִקָּדֵשׁ בַּרְנֵעַ
  choice: காதேஸ்-பர்னேயாவிலிருந்து
  rationale: படையெடுப்பின் தெற்கு எல்லையைக் குறிக்கும் இடப்பெயர்; நவீன தமிழில் வாசிக்க ஏற்ற ஒலிபெயர்ப்பு பயன்படுத்தப்பட்டுள்ளது.
- source_word: וְעַד עַזָּה
  choice: காசா வரையிலும்
  rationale: עַד குறிக்கும் புவியியல் எல்லையை ‘வரையிலும்’ தெளிவாக வெளிப்படுத்துகிறது.
- source_word: וְאֵת כָּל אֶרֶץ גֹּשֶׁן
  choice: கோசேன் நாடு முழுவதையும்
  rationale: אֵת குறிக்கும் நேரடிச் செயப்படுபொருளையும் כָּל என்பதன் முழுமையையும் இயல்பான தமிழில் காட்டுகிறது.
- source_word: וְעַד גִּבְעוֹן
  choice: கிபியோன் வரையிலும்
  rationale: עַד குறிக்கும் பிரதேச எல்லையை முதல் எல்லைக் கூற்றுக்கு இணையான முறையில் வழங்குகிறது.
