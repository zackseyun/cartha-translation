lexical_decisions:
- source_word: וַיָּנֻסוּ
  choice: தப்பியோடி
  rationale: נוּס என்பது ஆபத்திலிருந்து ஓடித் தப்புவதைக் குறிக்கிறது; ‘தப்பியோடி’ என்பது அந்த நெருக்கடியான பின்வாங்கலை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: חֲמֵשֶׁת
  choice: ஐந்து
  rationale: ‘அரசர்கள்’ என்பதோடு இணைந்துள்ள எண்ணிக்கையை நேரடியாகக் குறிப்பிடுகிறது.
- source_word: הַמְּלָכִים הָאֵלֶּה
  choice: இந்த ஐந்து அரசர்களும்
  rationale: הָאֵלֶּה என்ற சுட்டுப்பெயரின் குறிப்புத்தன்மையை ‘இந்த’ என்பதால் காத்து, தமிழின் இயல்பான சொல் வரிசையில் அமைக்கப்பட்டுள்ளது; எழுவாயின் கூட்டுத்தன்மைக்கு ‘உம்’ இயல்பாகச் சேர்க்கப்பட்டுள்ளது.
- source_word: וַיֵּחָבְאוּ
  choice: ஒளிந்துகொண்டார்கள்
  rationale: חבא என்பதன் தன்னை மறைத்துக்கொள்ளும் பொருளை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: בַמְּעָרָה
  choice: குகையில்
  rationale: எபிரெயச் சொல்லிலுள்ள சுட்டுருபின் குறிப்புத்தன்மை, ‘மக்கேதாவிலுள்ள குகை’ என்ற ஒருங்கிணைந்த தமிழ்த் தொடரில் சூழலால் தெளிவாகிறது.
- source_word: בְּמַקֵּדָה
  choice: மக்கேதாவிலுள்ள
  rationale: இடப்பெயர் ஒலிபெயர்க்கப்பட்டு, அந்தக் குகை மக்கேதாவில் அமைந்திருந்ததை இயல்பான தமிழில் காட்டுகிறது.
- source_word: וַ
  choice: ஆனால்
  rationale: וַ கதையைத் தொடர்ந்தாலும், முந்தைய போர்க்காட்சியிலிருந்து அரசர்களின் தப்பியோட்டத்திற்கான திருப்பத்தை இங்கு ‘ஆனால்’ இயல்பாகக் குறிக்கிறது; இதை வெறும் தொடர்ச்சியாகவும் புரிந்துகொள்ளலாம் என்பதால் அடிக்குறிப்பு தரப்பட்டுள்ளது.
