base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/027.yaml
  text: And at the time of the sun’s going down[a], Joshua commanded, and they took them down from the trees and threw them into the cave where they had hidden there[b], and they placed large stones over the mouth of the cave to this very day.
translation:
  language: ta
  text: சூரியன் மறையும் நேரத்தில்[a], யோசுவா கட்டளையிட்டான். அவர்கள் அந்த அரசர்களை மரங்களிலிருந்து இறக்கி, அவர்கள் அங்கே ஒளிந்திருந்த குகைக்குள்[b] எறிந்தார்கள். குகையின் வாய்மீது பெரிய கற்களை வைத்தார்கள்; அவை இந்நாள்வரை அப்படியே உள்ளன.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, இன்னும் சுருக்கமாக, “சூரிய மறைவில்.”
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில், “அவர்கள் அங்கே ஒளிந்திருந்த குகை”; மூலத்தில் ‘அங்கே’ என்ற இடச்சுட்டு வெளிப்படையாக உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְעֵת בּוֹא הַשֶּׁמֶשׁ
  choice: சூரியன் மறையும் நேரத்தில்
  rationale: எபிரெயச் சொற்றொடரின் சூரியன் ‘உள்ளே செல்லும்’ உருவகத்தையும் காலக் குறிப்பையும் இயல்பான நவீனத் தமிழில் ‘சூரியன் மறையும் நேரத்தில்’ எனத் தருகிறது.
- source_word: צִוָּה יְהוֹשֻׁעַ
  choice: யோசுவா கட்டளையிட்டான்
  rationale: வினையின் நேரடியான பொருளையும், தொடர்ந்து பிறர் அந்தக் கட்டளையை நிறைவேற்றுவதையும் தெளிவாகக் காட்டுகிறது.
- source_word: וַיּוֹרִידוּם מֵעַל הָעֵצִים
  choice: அவர்கள் அந்த அரசர்களை மரங்களிலிருந்து இறக்கி
  rationale: முந்தைய சூழலில் குறிப்பிடப்பட்ட அரசர்களே சுட்டுப்பெயரின் குறிப்பு; தமிழில் தெளிவுக்காக அந்தப் பெயர்ச்சொல் மீட்டுரைக்கப்படுகிறது. செயப்பாட்டின் கீழிறக்கும் இயக்கம் நேரடியாகப் பாதுகாக்கப்படுகிறது.
- source_word: וַיַּשְׁלִכֻם אֶל הַמְּעָרָה
  choice: அந்தக் குகைக்குள் எறிந்தார்கள்
  rationale: שׁלך என்பதன் வலுவான ‘எறி’ பொருளையும், குகையின் உட்புறத்தை நோக்கிய இயக்கத்தையும் இயல்பாகத் தருகிறது.
- source_word: אֲשֶׁר נֶחְבְּאוּ שָׁם
  choice: அவர்கள் ஒளிந்திருந்த அந்தக் குகை
  rationale: மூலத்தில் உள்ள שָׁם (‘அங்கே’) என்ற இடச்சுட்டை தமிழில் ‘அந்தக் குகை’ என்பதிலுள்ள ‘அந்த’ மூலம் இயல்பாகப் பாதுகாக்கிறது; தேவையற்ற இரட்டிப்பு தவிர்க்கப்படுகிறது.
- source_word: וַיָּשִׂמוּ אֲבָנִים גְּדֹלוֹת עַל פִּי הַמְּעָרָה
  choice: குகையின் வாய்மீது பெரிய கற்களை வைத்தார்கள்
  rationale: ‘குகையின் வாய்’ என்ற எபிரெய உருவகத்தைப் பாதுகாத்து, கற்கள் திறப்பை மூடும் விதத்தில் வைக்கப்பட்டதை ‘வாய்மீது’ தெளிவுபடுத்துகிறது.
- source_word: עַד עֶצֶם הַיּוֹם הַזֶּה
  choice: அவை இந்நாள்வரை அங்கே இருக்கின்றன
  rationale: கற்கள் வைக்கப்பட்ட நிலை உரையாளர் காலம்வரை தொடர்வதைத் தமிழில் தெளிவாக்குகிறது; עֶצֶם தரும் வலியுறுத்தல் ‘இந்நாள்வரை’ என்ற வழக்கில் இயல்பாக வெளிப்படுகிறது.
