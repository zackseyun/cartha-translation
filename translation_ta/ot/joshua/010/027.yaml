  register: நவீனத் தரத் தமிழ்; கண்ணியமான, எளிதில் புரியும் வரலாற்றுக் கதைநடை. தொடர்ச்சியான எபிரெய வாவ் அமைப்பு தமிழின் இயல்பான குறுவாக்கியங்களாகப் பிரிக்கப்பட்டுள்ளது. இறுதியில் தொடரும் நிலை தமிழில் தெளிவாகச் சொல்லப்பட்டுள்ளது.
