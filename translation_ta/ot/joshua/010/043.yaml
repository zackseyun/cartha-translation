base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/043.yaml
  text: Then Joshua returned[a], and all Israel with him, to the camp at Gilgal.
translation:
  language: ta
  text: பின்பு யோசுவாவும் அவருடன் இஸ்ரவேலர் அனைவரும் கில்காலிலிருந்த முகாமுக்குத் திரும்பினார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இன்னும் சொல்லுக்குச் சொல்ல மொழிபெயர்த்தால், “முகாமுக்கு, கில்காலுக்கு.” எபிரெயத்தில் “கில்கால்” என்ற இடப்பெயருடன் திசையைச் சுட்டும் ஓர் இறுதி இணைக்கப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: திரும்பினார்கள்
  rationale: שׁוב என்பது இங்கு படையெடுப்புக்குப் பிந்தைய திரும்பிச் செல்லுதலைக் குறிக்கிறது. எபிரெயத்தில் வினை யோசுவாவை முன்னிட்டு ஒருமையில் இருந்தாலும், தமிழில் ‘யோசுவாவும் ... இஸ்ரவேலர் அனைவரும்’ என்ற கூட்டு எழுவாயுடன் பன்மை வினை இயல்பானது.
- source_word: יְהוֹשֻׁעַ
  choice: யோசுவா
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் நிலைபெற்றுள்ள பெயர் வடிவம்.
- source_word: וְכָל יִשְׂרָאֵל
  choice: இஸ்ரவேலர் அனைவரும்
  rationale: சொல்லுக்குச் சொல் ‘இஸ்ரவேல் முழுவதும்’ என்ற கூட்டுப்பொருளைக் கொண்டது; சாதாரண நவீன தமிழில் மக்களையோ அவர்களைப் பிரதிநிதித்துவப்படுத்தும் படையையோ இயல்பாகக் குறிக்க ‘இஸ்ரவேலர் அனைவரும்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: עִמּוֹ
  choice: அவருடன்
  rationale: உடன்செல்லுதலை நேரடியாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: אֶל הַמַּחֲנֶה
  choice: முகாமுக்கு
  rationale: אֶל இலக்கை நோக்கிய இயக்கத்தையும் מַחֲנֶה இச்சூழலில் படை முகாமையும் குறிக்கின்றன.
- source_word: הַגִּלְגָּלָה
  choice: கில்காலிலிருந்த
  rationale: இடப்பெயரிலுள்ள திசைசுட்டும் -ה முடிவு கில்காலை நோக்கிய இயக்கத்தைக் காட்டுகிறது. தமிழில் ‘கில்காலிலிருந்த முகாமுக்கு’ என்பது அந்த முகாமின் இருப்பிடத்தையும் செல்லும் இலக்கையும் இயல்பாக வெளிப்படுத்துகிறது; எபிரெயச் சொல்லமைப்பு அடிக்குறிப்பில் தரப்படுகிறது.
