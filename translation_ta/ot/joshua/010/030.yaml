base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/030.yaml
  text: And Yahweh also gave it and its king into the hand of Israel[a], and he struck it with the edge of the sword, and every person who was in it. He left no survivor in it, and he did to its king just as he had done to the king of Jericho.
translation:
  language: ta
  text: யெகோவா அந்த நகரத்தையும் அதன் அரசனையும் இஸ்ரவேலின் கையில் ஒப்புக்கொடுத்தார். யோசுவா அதை வாளின் முனையால் தாக்கி, அதிலிருந்த ஒவ்வொருவரையும் கொன்றார்.[a] அதில் உயிர்தப்பியவர் ஒருவரையும் அவர் விட்டுவைக்கவில்லை. எரிகோவின் அரசனுக்குச் செய்ததுபோலவே அதன் அரசனுக்கும் செய்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “அதிலிருந்த ஒவ்வொரு உயிரையும்.” இங்கு “உயிர்” என்பது நகரிலிருந்த ஒவ்வொருவரையும் குறிக்கும் மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: யெகோவா
  rationale: தெய்வீகப் பெயரை பொதுவான பட்டப்பெயராக மாற்றாமல், தமிழில் நிலைபெற்றுள்ள தனிப்பெயர் வடிவில் தருகிறது.
- source_word: וַיִּתֵּן ... בְּיַד יִשְׂרָאֵל
  choice: இஸ்ரவேலின் கையில் ஒப்புக்கொடுத்தார்
  rationale: ‘ஒருவரின் கையில் கொடுத்தல்’ என்ற எபிரெய உருவகத்தையும், ஒருவரின் அதிகாரத்துக்குள் ஒப்படைத்தல் என்ற பொருளையும் காக்கிறது.
- source_word: גַּם
  choice: அந்த நகரத்தையும்
  rationale: தமிழின் ‘-உம்’ இணைப்பால் முந்தைய வெற்றியோடு உள்ள தொடர்ச்சி இயல்பாக வெளிப்படுகிறது.
- source_word: אוֹתָהּ ... וְאֶת מַלְכָּהּ
  choice: அந்த நகரத்தையும் அதன் அரசனையும்
  rationale: பெண்பால் பதிலிப்பெயர் சூழலில் லிப்னா நகரத்தைக் குறிப்பதால், தமிழில் தெளிவுக்காக ‘அந்த நகரம்’ என வெளிப்படுத்தப்படுகிறது.
- source_word: וַיַּכֶּהָ לְפִי חֶרֶב
  choice: அதை வாளின் முனையால் தாக்கி
  rationale: נכה என்பதன் ‘தாக்கு/வெட்டு’ வினைவலிமையையும், ‘வாளின் வாய்’ என்ற எபிரெய மரபுத்தொடரின் பொருளான கூர்முனையையும் காக்கிறது.
- source_word: כָּל הַנֶּפֶשׁ אֲשֶׁר בָּהּ
  choice: அதிலிருந்த ஒவ்வொருவரையும்
  rationale: נפש இங்கு உடலிலிருந்து பிரிந்த ‘ஆத்துமா’ குறித்த கோட்பாட்டுச் சொல்லல்ல; நகரிலிருந்த மனிதர்களைக் குறிக்கிறது.
- source_word: לֹא הִשְׁאִיר ... שָׂרִיד
  choice: உயிர்தப்பியவர் ஒருவரையும் அவர் விட்டுவைக்கவில்லை
  rationale: שָׂרִיד என்பதன் போர்ச்சூழல் பொருளான ‘உயிர்தப்பியவர்’ என்பதை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: וַיַּעַשׂ לְמַלְכָּהּ כַּאֲשֶׁר עָשָׂה לְמֶלֶךְ יְרִיחוֹ
  choice: எரிகோவின் அரசனுக்குச் செய்ததுபோலவே அதன் அரசனுக்கும் செய்தார்
  rationale: עשה என்ற வினையின் மீளுரைப்பையும் ஒப்பீட்டையும் தேவையற்ற விளக்கமின்றிக் காக்கிறது.
theological_decisions:
- issue: போர்ச்சூழலில் נֶפֶשׁ என்பதன் மொழிபெயர்ப்பு
  choice: ஒவ்வொருவரும்
  alternative: ஒவ்வொரு ஆத்துமாவும்
  rationale: இச்சொல் இங்கு நகரில் இருந்த மனிதர்களைக் குறிக்கிறது; ‘ஆத்துமா’ என மொழிபெயர்ப்பது மூலத்தில் இல்லாத பிற்கால மனித இயல்பியல் கருத்தை வாசகத்திற்குள் கொண்டுவரக்கூடும்.
- issue: செயற்பாட்டாளரைத் தெளிவுபடுத்துதல்
  choice: யோசுவா அதைத் தாக்கினார்
  alternative: அவர் அதைத் தாக்கினார்
  rationale: எபிரெய வினைகளின் ஒருமை ஆண்பால் எழுவாய் சூழலிலிருந்து யோசுவாவைக் குறிக்கிறது. தமிழில் இறைவனே தாக்கியதாகத் தவறாகப் புரிவதைத் தவிர்க்க பெயர் வெளிப்படுத்தப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான வரலாற்று உரைநடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் கடுமையான போர்மொழி மென்மையாக்கப்படவில்லை; அதேவேளையில் ‘நெபெஷ்’ என்பதற்கு தேவையற்ற கோட்பாட்டுப் பொருள் ஏற்றப்படவில்லை.
