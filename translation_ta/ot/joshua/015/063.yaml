base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/063.yaml
  text: But the sons of Judah could not dispossess the Jebusites[a], the inhabitants of Jerusalem, so the Jebusites have lived with the sons of Judah in Jerusalem to this day.
translation:
  language: ta
  text: ஆனால் எருசலேமில் குடியிருந்த எபூசியர்களை[a] யூதாவின் சந்ததியினர் வெளியேற்ற முடியவில்லை. ஆகவே எபூசியர்கள் யூதாவின் சந்ததியினரோடு எருசலேமில் இந்நாள்வரை குடியிருந்து வந்தனர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் இனப்பெயர் ஒருமையில், சொல்லுக்குச் சொல் ‘எபூசியன்’ என்று உள்ளது; இங்கு அது எபூசிய மக்களை ஒட்டுமொத்தமாகக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶת
  choice: ஆனால்
  rationale: முந்தைய பங்கீட்டு விவரங்களுக்கு விதிவிலக்கான நிலையை அறிமுகப்படுத்தும் இணைப்பின் எதிர்மறை உரையாடல் வலிமையை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: הַיְבוּסִי
  choice: எபூசியர்கள்
  rationale: எபிரெயத்தில் ஒருமை வடிவிலுள்ள இனப்பெயர் இங்கு ஒரு மக்கள் குழுவைக் கூட்டாகக் குறிக்கிறது; தமிழில் பன்மை இயல்பானது.
- source_word: יוֹשְׁבֵי יְרוּשָׁלַם
  choice: எருசலேமில் குடியிருந்த
  rationale: பங்கேற்புவினைத் தொடர் எபூசியர்களை எருசலேமின் குடியிருப்பாளர்களாக அடையாளப்படுத்துகிறது; தமிழில் பெயரெச்சத் தொடர் இயல்பாக அமைகிறது.
- source_word: לֹא יוכלו
  choice: முடியவில்லை
  rationale: கடந்தகாலக் கதையோட்டத்தில் இயலாமையைச் சுருக்கமாகவும் தெளிவாகவும் வெளிப்படுத்துகிறது.
- source_word: בְנֵי יְהוּדָה
  choice: யூதாவின் சந்ததியினர்
  rationale: சொல்லுக்குச் சொல் 'யூதாவின் மகன்கள்' என்றாலும், இங்கு ஆண்களை மட்டும் அல்லாமல் யூதா கோத்திரத்தினரை ஒட்டுமொத்தமாகக் குறிக்கிறது; 'சந்ததியினர்' குடும்ப-கோத்திர உறவைப் பாதுகாக்கிறது.
- source_word: לְהוֹרִישָׁם
  choice: வெளியேற்ற
  rationale: கைப்பற்றுதல் சூழலில் உரிமையிலிருந்து அகற்றுதல் அல்லது நாட்டைவிட்டு விரட்டுதல் என்ற பொருள் உள்ளது; இயல்பான தமிழில் 'வெளியேற்ற' இந்தச் செயலைத் தெளிவாகத் தெரிவிக்கிறது.
- source_word: וַיֵּשֶׁב
  choice: குடியிருந்து வருகிறார்கள்
  rationale: '''இந்நாள்வரை'' என்பதோடு, கடந்தகாலத்தில் தொடங்கி உரையாசிரியரின் காலம்வரை தொடரும் குடியிருப்பை வெளிப்படுத்துகிறது.'
- source_word: אֶת בְּנֵי יְהוּדָה
  choice: யூதாவின் சந்ததியினரோடு
  rationale: அசாதாரணமான எபிரெயக் கட்டமைப்பு சூழலில் இணைந்து வாழ்வதைக் குறிக்கிறது; 'உடன்/நடுவில்' என்ற உண்மையான நுணுக்கத்தைத் தீர்மானமாகச் சுருக்காமல், '-ஓடு' இயல்பாகக் காட்டுகிறது.
- source_word: בִּירוּשָׁלַם
  choice: எருசலேமில்
  rationale: இடத்தைக் குறிக்கும் நேரடியான மொழிபெயர்ப்பு.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: இந்நாள்வரை
  rationale: உரையாசிரியரின் நிகழ்காலம்வரை நிலை தொடர்ந்ததைக் குறிக்கும் எபிரெயக் காலச் சொற்றொடருக்கு மரியாதையான, இயல்பான தமிழ்.
theological_decisions:
- issue: בְנֵי יְהוּדָה என்பதன் கூட்டுப்பொருள்
  choice: யூதாவின் சந்ததியினர்
  alternative: யூதாவின் மகன்கள் / யூதா கோத்திரத்தினர்
  rationale: இது ஆண் நபர்களை மட்டும் குறிக்காமல் யூதாவின் கோத்திரச் சமூகத்தை மொத்தமாகக் குறிக்கிறது. 'சந்ததியினர்' மூலத்தின் குடும்ப அடையாளத்தையும் கூட்டுப்பொருளையும் காக்கிறது.
- issue: וַיֵּשֶׁב ... אֶת בְּנֵי יְהוּדָה என்ற இறுதி தொடரின் உறவு
  choice: யூதாவின் சந்ததியினரோடு ... குடியிருந்து வருகிறார்கள்
  alternative: யூதாவின் சந்ததியினர் நடுவில் / அருகில் குடியிருந்தார்கள்
  rationale: எபிரெயக் கட்டமைப்பு இலக்கண ரீதியாக அசாதாரணமானது; சூழல் இணைந்த குடியிருப்பை ஆதரிக்கிறது. '-ஓடு' என்பது 'உடன்' மற்றும் 'மத்தியில்' ஆகிய சாத்திய நுணுக்கங்களை அளவுக்கு மீறித் தீர்மானிக்காமல் தெரிவிக்கிறது.
