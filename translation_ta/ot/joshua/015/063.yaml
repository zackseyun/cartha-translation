  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் dignified biblical register பயன்படுத்தப்பட்டுள்ளது. 'எபூசியர்கள்', 'யூதாவின் சந்ததியினர்', 'இந்நாள்வரை' ஆகியவை தெளிவையும் மூலத்தின் கோத்திர மற்றும் கால நுணுக்கங்களையும் சமநிலைப்படுத்துகின்றன.
