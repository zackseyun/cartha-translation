lexical_decisions:
- source_word: אֲרַב
  choice: அராப்
  rationale: யூதாவின் மலைநாட்டிலுள்ள ஊர்களின் பட்டியலில் வரும் இடப்பெயர் என்பதால் மொழிபெயர்க்காமல், எபிரெய ஒலிப்பை நெருக்கமாகப் பின்பற்றி எழுத்துப்பெயர்க்கப்பட்டது.
- source_word: וְ/רוּמָה
  choice: ரூமா
  rationale: முன்னொட்டான וְ பட்டியலில் ‘மற்றும்’ என்ற இணைப்பைக் குறிக்கிறது; தமிழில் பட்டியலின் இறுதி உறுப்புக்கு முன் மட்டும் ‘மற்றும்’ பயன்படுத்துவது இயல்பானதால் இங்கு தனியே வெளிப்படுத்தப்படவில்லை. רוּמָה என்பது ‘ரூமா’ என எழுத்துப்பெயர்க்கப்பட்டது.
- source_word: וְ/אֶשְׁעָן
  choice: மற்றும் எஷான்
  rationale: וְ என்பது ‘மற்றும்’ என மொழிபெயர்க்கப்பட்டது; אֶשְׁעָן என்ற இடப்பெயர் எபிரெய வடிவுக்கு நெருக்கமாக ‘எஷான்’ என எழுத்துப்பெயர்க்கப்பட்டது.
