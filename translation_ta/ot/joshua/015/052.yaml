  - marker: a
    text: 'எபிரெய உரையில் யூதாவின் மலைநாட்டைச் சேர்ந்த மூன்று இடப்பெயர்கள் உள்ளன: அரப், ரூமா, எஷான். கடைசிப் பெயர் சில மொழிபெயர்ப்புகளில் «எஷேயான்» என எழுத்துப்பெயர்க்கப்பட்டுள்ளது.'
