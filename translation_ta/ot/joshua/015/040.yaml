  register: நவீன பொதுத்தமிழில், மரியாதைமிக்கதும் எளிதில் வாசிக்கக்கூடியதுமான ஊர்ப்பெயர் பட்டியல். எபிரெயப் பெயர்கள் தமிழின் ஒலியமைப்புக்கு ஏற்றவாறு ஒலிபெயர்க்கப்பட்டுள்ளன; தேவையற்ற ஆங்கில எழுத்துப்பெயர்ப்பு மாற்றுகள் அடிக்குறிப்புகளாக இறக்குமதி செய்யப்படவில்லை.
