  source_fidelity: கப்போன் மற்றும் கித்லீஷ் ஆகிய ஒலிபெயர்ப்புகள் எபிரெய כַּבּוֹן (Kabbon), כִּתְלִישׁ (Kithlish) ஆகியவற்றை நன்றாகப் பின்பற்றுகின்றன. ஆனால் לַחְמָס-இல் உள்ள ח-ஐ வெறும் ‘க’ ஆக மாற்றிய ‘லக்மாஸ்’ வடிவம் மூல ஒலியிலிருந்து தேவையற்ற அளவு விலகுகிறது; தமிழில் ‘ஹ’ மூலம் அதைச் சுட்டலாம். மூலத்தில் ஒவ்வொரு பெயருக்கும் இணைப்புச் சொல் இருப்பதால், குறைந்தது இறுதிப் பெயருக்கு முன் ‘மற்றும்’ சேர்ப்பது பட்டியலின் ஒருங்கிணைப்பைத் தெளிவாகக் காட்டும்.
  naturalness: ‘கப்போன், லஹ்மாஸ், மற்றும் கித்லீஷ்’ என்பது நவீன பொதுத்தமிழில் இயல்பான, தெளிவான ஊர்ப்பெயர்ப் பட்டியல். மூன்று பெயர்கள் மட்டுமே உள்ளதால் இறுதியில் ‘மற்றும்’ இடுவது வாசிப்புக்கும் இலக்கணத் தெளிவுக்கும் உதவுகிறது.
