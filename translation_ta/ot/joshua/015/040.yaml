lexical_decisions:
- source_word: כַבּוֹן
  choice: கப்போன்
  rationale: இது ஓர் ஊர்ப்பெயர்; பொருள் மொழிபெயர்ப்பு செய்யாமல் எபிரெய ஒலிப்புக்கு நெருக்கமாகத் தமிழில் ஒலிபெயர்க்கப்பட்டது. நடுவிலுள்ள வலியுறுத்தப்பட்ட בּ ஒலியை இரட்டைப் ‘ப்ப’ மூலம் காட்டுகிறது.
- source_word: לַחְמָס
  choice: லக்மாஸ்
  rationale: இது ஓர் ஊர்ப்பெயர். எபிரெய ח ஒலிக்குத் தமிழில் துல்லியமான இணை இல்லாததால், இயல்பாக வாசிக்கக்கூடிய ‘க’ பயன்படுத்தப்பட்டு பெயர் ஒலிபெயர்க்கப்பட்டது.
- source_word: כִתְלִישׁ
  choice: கித்லீஷ்
  rationale: இது ஓர் ஊர்ப்பெயர்; எபிரெய மெய் மற்றும் உயிர் ஒலிகளை இயன்றவரை பின்பற்றி தமிழில் ஒலிபெயர்க்கப்பட்டது.
- source_word: וְ
  choice: பட்டியலில் காற்புள்ளிகளால் இணைத்தல்
  rationale: ஒவ்வொரு பெயருக்கும் முன் வரும் எபிரெய இணைப்புச் சொல் ஒருங்கிணைந்த பட்டியலை உருவாக்குகிறது. தனி வசனமாக நிற்கும் இப்பட்டியலில் தமிழின் இயல்பான நடைப்படி காற்புள்ளிகள் போதுமானவை; இறுதியில் ‘மற்றும்’ சேர்ப்பது தேவையில்லை.
