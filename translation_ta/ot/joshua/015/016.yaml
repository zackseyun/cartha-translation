  text: וַ/יֹּ֣אמֶר כָּלֵ֔ב אֲשֶׁר יַכֶּ֥ה אֶת קִרְיַת סֵ֖פֶר וּ/לְכָדָ֑/הּ וְ/נָתַ֥תִּי ל֛/וֹ אֶת עַכְסָ֥ה בִתִּ֖/י לְ/אִשָּֽׁה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/016.yaml
  text: And Caleb said[a], “Whoever strikes Kiriath-sepher and captures it, I will give him Achsah my daughter as a wife.”
translation:
  language: ta
  text: காலேப், “கிரியாத்-செபேரைத் தாக்கிக் கைப்பற்றுகிறவனுக்கு என் மகள் அக்சாவை மனைவியாகக் கொடுப்பேன்” என்றார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: என்றார்
  rationale: எபிரெயக் கதைநடையின் தொடர்ச்சியைத் தமிழில் இயல்பாகக் காட்டும் பேச்சு அறிமுக வடிவம்.
- source_word: כָּלֵב
  choice: காலேப்
  rationale: தனிப்பெயர் நவீனத் தமிழில் வழக்கமான ஒலிபெயர்ப்பு முறையில் தரப்பட்டது.
- source_word: אֲשֶׁר
  choice: கைப்பற்றுகிறவனுக்கு
  rationale: திறந்த சவாலை அறிமுகப்படுத்தும் வரையறையற்ற தொடர்புச் சொல்லின் பொருளை இயல்பான தமிழில் ஆண்பால் ஒருமைச் சூழலுடன் வெளிப்படுத்துகிறது.
- source_word: יַכֶּה
  choice: தாக்கி
  rationale: נכה என்பதன் இராணுவச் சூழலிலான தாக்குதல் பொருளைத் தக்கவைக்கிறது; ‘தோற்கடித்து’ என முடிவை முன்கூட்டியே விளக்கவில்லை.
- source_word: אֶת קִרְיַת סֵפֶר
  choice: கிரியாத்-செபேரை
  rationale: இடப்பெயர் அதன் கூறுகளை மொழிபெயர்க்காமல் ஒலிபெயர்க்கப்பட்டது.
- source_word: וּלְכָדָהּ
  choice: கைப்பற்றுகிறவனுக்கு
  rationale: לכד என்பதன் இராணுவப் பொருளையும், பெண்பால் ஒருமை பின்னொட்டு நகரத்தைக் குறிப்பதையும் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וְנָתַתִּי לוֹ
  choice: கொடுப்பேன்
  rationale: சூழலில் உள்ள வாக்குறுதியை எதிர்கால வடிவில் தருகிறது; பெறுபவர் ‘கைப்பற்றுகிறவனுக்கு’ என்பதில் வெளிப்படையாக உள்ளார்.
- source_word: עַכְסָה
  choice: அக்சாள்
  rationale: தனிப்பெயர் எபிரெய ஒலியை அணுகும் வகையில் தமிழில் ஒலிபெயர்க்கப்பட்டது; வேற்றுமை உருபுடன் ‘அக்சாளை’ என வருகிறது.
- source_word: בִתִּי
  choice: என் மகள்
  rationale: உறவையும் முதலாம் நபர் உடைமையையும் நேரடியாகப் பாதுகாக்கிறது.
- source_word: לְאִשָּׁה
  choice: மனைவியாக
  rationale: திருமணத்தில் கொடுப்பதைக் குறிக்கும் எபிரெய மரபுத்தொடரைத் தெளிவான நவீனத் தமிழில் தருகிறது; மூலத்தில் இல்லாத கூடுதல் உடைமைச் சொல்லைச் சேர்க்கவில்லை.
