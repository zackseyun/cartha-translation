    issue: The name ‘அக்சாள்’ has an unsupported final ள்.
    rationale: The Hebrew personal name עַכְסָה ends in -āh and contains no consonant corresponding to Tamil ள். ‘அக்சா’ preserves the source form more closely in modern Tamil.
