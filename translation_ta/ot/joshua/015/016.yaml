  register: நவீன நிலையான தமிழில், சுருக்கமானதும் கண்ணியமானதும் இயல்பானதுமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய வாக்கியத்தின் திறந்த சவாலும் இராணுவச் செயற்பாடுகளின் வரிசையும் பாதுகாக்கப்பட்டுள்ளன.
