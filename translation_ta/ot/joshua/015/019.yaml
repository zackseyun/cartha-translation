base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/019.yaml
  text: She said[a], “Please give me a blessing, since you have given me the land of the Negev[c][b]; give me also springs of water.” So he gave her the upper springs and the lower springs.
translation:
  language: ta
  text: அவள், “எனக்கு ஓர் ஆசீர்வாதத்தைத் தாருங்கள்[a]. நீங்கள் எனக்கு நெகேப் நிலத்தைக் கொடுத்திருக்கிறீர்கள்[b]; நீரூற்றுகளையும்[c] எனக்குத் தாருங்கள்” என்றாள். ஆகவே அவன் அவளுக்கு மேல்புற நீரூற்றுகளையும் கீழ்ப்புற நீரூற்றுகளையும் கொடுத்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஒரு கொடை.” எபிரெய மொழியில் “ஆசீர்வாதம்” என்றே உள்ளது; இங்கு அது பயனளிக்கும் ஒரு கொடையைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: “நெகேப்” என்பது “தென்னிலம்” அல்லது “தெற்குப் பகுதி” என்றும் பொருள்படலாம்.
    reason: lexical_alternative
  - marker: c
    text: இதற்கான எபிரெயச் சொல் நீரூற்றுகள், நீர்க்குளங்கள் அல்லது நீர்த்தேக்கப் பள்ளங்களைக் குறிக்கக்கூடும்; இச்சூழலில் “நீரூற்றுகள்” என்பது மிகவும் பொருத்தமானது.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְרָכָה
  choice: ஓர் ஆசீர்வாதம்
  rationale: இச்சொல்லின் வழக்கமான பொருளான ‘ஆசீர்வாதம்’ என்பதைக் காத்திருக்கிறது; இச்சூழலில் அது பயனளிக்கும் ஒரு கொடையைக் குறிக்கலாம் என்பதைக் குறிப்பில் தெரிவிக்கிறது.
- source_word: אֶרֶץ הַנֶּגֶב
  choice: நெகேப் நிலம்
  rationale: נֶגֶב இங்கு தெற்கிலுள்ள குறிப்பிட்ட புவியியல் பகுதியின் பெயராகச் செயல்படுவதால் ‘நெகேப்’ என ஒலிபெயர்க்கப்பட்டுள்ளது; ‘நிலம்’ என்பது אֶרֶץ என்பதைக் காட்டுகிறது.
- source_word: גֻּלֹּת מָיִם
  choice: நீரூற்றுகள்
  rationale: குறிப்பிடப்படும் நீராதாரங்களுக்கும், தொடர்ந்து வரும் மேல்புற–கீழ்ப்புற வேறுபாட்டுக்கும் ‘நீரூற்றுகள்’ இயல்பாகப் பொருந்துகிறது; மூலச்சொல்லின் துல்லியமான பொருள் உறுதியற்றது என்பதைக் குறிப்பில் காக்கிறது.
- source_word: תְּנָה
  choice: தாருங்கள்
  rationale: ஒருமை ஏவலைத் தமிழில் தந்தையிடம் முன்வைக்கப்படும் மரியாதையான வேண்டுகோளாக இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וְנָתַתָּה לִי
  choice: நீரூற்றுகளையும் எனக்குத் தாருங்கள்
  rationale: இணைப்புச் சொல்லின் கூடுதல் வேண்டுகோள் பொருளை ‘-உம்’ தெளிவாக வெளிப்படுத்துகிறது.
- source_word: גֻּלֹּת עִלִּיּוֹת
  choice: மேல்புற நீரூற்றுகள்
  rationale: உயரமான இடத்திலுள்ள நீராதாரங்களைக் குறிக்கும் பெயரடையையும், முந்தைய ‘நீரூற்றுகள்’ என்ற சொல்லோடு உள்ள தொடர்ச்சியையும் காக்கிறது.
- source_word: גֻּלֹּת תַּחְתִּיּוֹת
  choice: கீழ்ப்புற நீரூற்றுகள்
  rationale: மேல்புற நீரூற்றுகளுக்கு இணையான எதிர்நிலையை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: וַיִּתֶּן לָהּ
  choice: ஆகவே அவன் அவளுக்குக் கொடுத்தான்
  rationale: வேண்டுகோளைத் தொடர்ந்து கிடைத்த பதிலைத் தமிழ் கதைநடையில் தெளிவாக இணைக்கிறது.
