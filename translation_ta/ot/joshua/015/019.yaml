translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, மரியாதையும் கண்ணியமும் கொண்ட நடையைக் கடைப்பிடிக்கிறது. தந்தையிடம் பேசும் சூழலை முன்னிட்டு மரியாதைப் பன்மையான ‘நீங்கள்/தாருங்கள்’ பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் ‘ஆசீர்வாதம்’ என்ற உடன்படிக்கை சார்ந்த சொல்லாட்சியும், גֻּלֹּת என்பதிலுள்ள சொற்பொருள் ஐயமும் குறிப்புகள் வழியாகப் பாதுகாக்கப்பட்டுள்ளன.
