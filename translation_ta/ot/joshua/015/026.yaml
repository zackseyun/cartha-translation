  source_fidelity: 'The draft correctly treats all three items as place names, but it omits the Hebrew coordinating conjunctions. Its spellings also do not consistently reflect the Hebrew vocalization: מוֹלָדָה begins with long ō, and שְׁמַע has š rather than Tamil c.'
