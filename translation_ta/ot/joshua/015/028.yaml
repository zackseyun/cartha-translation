lexical_decisions:
- source_word: חֲצַר שׁוּעָל
  choice: அட்சார்-சூவால்
  rationale: ‘குடியிருப்பு/அடைப்பு’ மற்றும் ‘நரி/குள்ளநரி’ என்ற கூறுகளைக் கொண்ட இடப்பெயர். ஊர்ப்பட்டியலில் பொருளை மொழிபெயர்க்காமல் எபிரெய உச்சரிப்புக்கு நெருக்கமாக ஒலிபெயர்க்கப்பட்டது; தொடக்க ח தமிழ் வழக்குக்கு ஏற்றவாறு ‘அ’ எனக் குறிக்கப்பட்டது.
- source_word: בְּאֵר שֶׁבַע
  choice: பெயெர்-செபா
  rationale: நன்கு அறியப்பட்ட நிலையான இடப்பெயர் என்பதால் ஒலிபெயர்க்கப்பட்டது. שֶׁבַע என்பதில் ‘ஏழு’ என்ற பொருளும், சொல்விளையாட்டின் வழியாக ‘சத்தியம்’ என்ற தொடர்பும் இருப்பது அடிக்குறிப்பில் பாதுகாக்கப்பட்டது.
- source_word: בִּזְיוֹתְיָה
  choice: பிஸ்யோத்தியா
  rationale: சொற்பிறப்பு உறுதியாகத் தெரியாத இடப்பெயர் என்பதால் எபிரெய வடிவத்துக்கு நெருக்கமாக ஒலிபெயர்க்கப்பட்டது.
- source_word: וַ / וּ
  choice: ஆகிய
  rationale: இணைப்பிடைச்சொல் ஊர்ப்பட்டியலின் உறுப்புகளை இணைக்கிறது. இயல்பான தமிழில் பட்டியலின் முடிவில் ‘ஆகிய ஊர்கள்’ என வழங்கப்பட்டது.
theological_decisions: []
