  text: 'Goshen, Holon, and Giloh: eleven cities with their villages.'
translation:
  language: ta
  text: 'கோஷென், ஹோலோன், கிலோ: அவற்றின் கிராமங்களுடன் பதினொரு நகரங்கள்.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: גֹשֶׁן
  choice: கோசேன்
  rationale: இது ஓர் இடப்பெயர்; எபிரெய ஒலிப்புக்கு நெருக்கமாகத் தமிழில் ஒலிபெயர்க்கப்பட்டது.
- source_word: חֹלֹן
  choice: ஓலோன்
  rationale: இது ஓர் இடப்பெயர். தொடக்க எழுத்தான ח இங்கு மெய்யொலிக்குறியின்றி வருவதால், எபிரெய உச்சரிப்புக்கு நெருக்கமாக ‘ஓலோன்’ என்று ஒலிபெயர்க்கப்பட்டது.
- source_word: גִלֹה
  choice: கிலோ
  rationale: இது ஓர் இடப்பெயர்; எபிரெய வடிவின் இறுதி உயிரொலியைக் காட்டும் வகையில் ‘கிலோ’ என்று ஒலிபெயர்க்கப்பட்டது.
- source_word: עָרִים
  choice: நகரங்கள்
  rationale: நிலப்பகுதிப் பட்டியலின் சூழலில் நகர்ப்புறக் குடியிருப்புகளைக் குறிக்கும் பொதுச்சொல்.
- source_word: אַחַת עֶשְׂרֵה
  choice: பதினொரு
  rationale: ‘நகரங்கள்’ என்பதன் எண்ணிக்கையைக் குறிக்கும் எண்; இயல்பான நவீனத் தமிழில் ‘பதினொரு’ என வழங்கப்பட்டது.
- source_word: חַצְרֵיהֶן
  choice: இவற்றின் கிராமங்கள்
  rationale: மேற்கூறப்பட்ட நகரங்களைச் சார்ந்த சிறிய, பெரும்பாலும் மதிலற்ற குடியிருப்புகளைக் குறிக்கிறது; ‘கிராமங்கள்’ என்பது இயல்பான தமிழாக்கம்.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழில், பட்டியல் நடைக்கு ஏற்ற சுருக்கமானதும் கண்ணியமானதுமான மொழி பயன்படுத்தப்பட்டுள்ளது. எபிரெய வசனத்தின் இறுதியில் வரும் மொத்த எண்ணிக்கை மற்றும் சார்ந்த கிராமங்கள் என்ற அமைப்பு தெளிவாகப் பாதுகாக்கப்பட்டுள்ளது.
