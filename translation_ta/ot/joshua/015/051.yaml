revisions:
- from: கோசேன், ஓலோன், கிலோ—இவற்றின் கிராமங்களுடன் சேர்த்து பதினொரு நகரங்கள்.
  to: 'கோஷென், ஹோலோன், கிலோ: அவற்றின் கிராமங்களுடன் பதினொரு நகரங்கள்.'
  rationale: 'The revision preserves the Hebrew list structure, the unqualified total of eleven, and the associated villages, while making the first two place-name transliterations more faithful to their Hebrew consonants and vowels. No footnote is needed: the numerical tension is present in the source list and is best left untranslated and unresolved.'
