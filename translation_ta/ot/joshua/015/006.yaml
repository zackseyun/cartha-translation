language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וְ/עָלָ֤ה הַ/גְּבוּל֙ בֵּ֣ית חָגְלָ֔ה וְ/עָבַ֕ר מִ/צְּפ֖וֹן לְ/בֵ֣ית הָעֲרָבָ֑ה וְ/עָלָ֣ה הַ/גְּב֔וּל אֶ֥בֶן בֹּ֖הַן בֶּן רְאוּבֵֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/006.yaml
  text: Then the border went up to Beth-hoglah[a], and passed north of Beth-arabah; and the border went up to the stone of Bohan son of Reuben.
translation:
  language: ta
  text: பின்பு எல்லை பெத்-ஹோக்லாவுக்கு ஏறிச் சென்று, பெத்-அரபாவின் வடக்கே கடந்து சென்றது; எல்லை ரூபனின் மகன் போகானுடைய கல்லுக்கு[a] ஏறிச் சென்றது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “போகானின் கல்.”
    reason: The Hebrew construct phrase אֶבֶן בֹּהַן may also be rendered with the possessive order “Bohan’s stone”; this preserves the English POB audit-trail alternative in idiomatic Tamil.
lexical_decisions:
- source_word: וְעָלָה
  choice: ஏறிச் சென்றது
  rationale: எல்லை விவரிப்பில் இவ்வினை உயரமான இடத்தை நோக்கி எல்லைக்கோடு தொடர்வதைக் குறிக்கிறது; இயல்பான தமிழில் நிலவியல் நுணுக்கத்தையும் தக்கவைக்கிறது.
- source_word: הַגְּבוּל
  choice: எல்லை
  rationale: இங்கு முழுப் பகுதியை அல்ல, அதை வரையறுக்கும் எல்லைக்கோட்டைக் குறிக்கிறது; நவீனத் தமிழில் ‘எல்லை’ இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: בֵּית חָגְלָה
  choice: பெத்-ஓக்லா
  rationale: இடப்பெயர் மொழிபெயர்க்கப்படாமல் எபிரெய ஒலிப்புக்கு அண்மையாக எழுத்துப்பெயர்க்கப்பட்டுள்ளது.
- source_word: וְעָבַר
  choice: கடந்து சென்றது
  rationale: எல்லைக்கோடு குறிப்பிட்ட இடத்தின் ஒரு பக்கமாகத் தொடர்ந்து செல்வதை இச்சொல் குறிக்கிறது.
- source_word: מִצְּפוֹן לְבֵית הָעֲרָבָה
  choice: பெத்-அரபாவின் வடக்கே
  rationale: எபிரெய எல்லைச் சூத்திரம் பெத்-அரபாவுக்கு வடக்கிலுள்ள தொடர்புநிலையைச் சுட்டுகிறது; தமிழில் இவ்வடிவம் தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: אֶבֶן בֹּהַן
  choice: போகானுடைய கல்
  rationale: பெயர்ச்சொல் இணைப்பை இயல்பான தமிழ் உடைமை வடிவில் அளிக்கிறது.
- source_word: בֶּן רְאוּבֵן
  choice: ரூபனின் மகன்
  rationale: எபிரெய உரை நேரடியாக ‘ரூபனின் மகன்’ என்று கூறுவதால், ‘ரூபன் கோத்திரத்தான்’ என்ற விளக்கமான மாற்றைத் தவிர்த்து மூலத்தின் வடிவம் பாதுகாக்கப்படுகிறது.
