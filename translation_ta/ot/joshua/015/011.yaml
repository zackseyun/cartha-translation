translation_notes:
  register: நவீன நிலையான தமிழில், நில எல்லை விவரிப்புக்கேற்ற சுருக்கமான, கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. இடப்பெயர்கள் எபிரெய ஒலியை அடிப்படையாகக் கொண்டு தமிழாக்கப்பட்டுள்ளன; தேவையற்ற பழமையான சொற்கள் தவிர்க்கப்பட்டுள்ளன.
