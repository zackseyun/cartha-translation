base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/011.yaml
  text: Then the border went out to the shoulder of Ekron northward[a], and the border bent toward Shikkeron, and passed over Mount Baalah, and went out to Jabneel[c][b]; and the ends of the border were at the sea.
translation:
  language: ta
  text: பின்பு எல்லை எக்ரோனின் வடக்குப் பக்கத்தை நோக்கிச் சென்று[a], சிக்கெரோனை நோக்கித் திரும்பி, பாளா மலையைக் கடந்து, யப்னெயேலுக்குச் சென்றது. எல்லையின் முடிவுகள் கடலை நோக்கி இருந்தன[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தை “எக்ரோனின் தோள்பகுதியை நோக்கி, வடக்கே” என்றும் மொழிபெயர்க்கலாம்; இங்கு “தோள்” என்பது நிலவியலில் ஒரு பக்கம் அல்லது சரிவைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில், “எல்லையின் முடிவுகள் கடல்புறமாக இருந்தன”; இது மேற்கிலுள்ள மத்தியதரைக் கடலில் எல்லை முடிவடைந்ததைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָצָא
  choice: சென்றது
  rationale: எல்லை விவரிப்புகளில் அடுத்த நிலக்குறியை நோக்கி எல்லைக்கோடு நீள்வதைக் குறிக்கிறது; இயல்பான தமிழில் ‘சென்றது’ தெளிவாக உள்ளது.
- source_word: גְּבוּל
  choice: எல்லை
  rationale: நிலப்பகுதியைப் பிரிக்கும் கோட்டைக் குறிக்கும் இயல்பான நவீனத் தமிழ் சொல்.
- source_word: כֶּתֶף עֶקְרוֹן צָפוֹנָה
  choice: எக்ரோனின் வடக்குப் பக்கமாக
  rationale: כֶּתֶף என்பதன் உருவகமான ‘பக்கம்’ என்ற நிலவியல் பொருளையும், צָפוֹנָה என்பதன் வடதிசை நோக்கத்தையும் இயல்பாக இணைக்கிறது; எபிரெயச் சொல்லமைப்பின் சாத்தியமான வேறு புரிதல் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: תָּאַר
  choice: திரும்பி
  rationale: எல்லைக்கோடு திசைமாறிச் சிக்கெரோனை நோக்கிச் செல்வதைக் குறிக்கும்; ‘வளைந்து’ என்பதும் சாத்தியம்.
- source_word: שִׁכְּרוֹנָה
  choice: சிக்கெரோன்
  rationale: இடப்பெயர் தமிழில் ஒலிபெயர்க்கப்பட்டது; இறுதித் திசைச் சுட்டு பெயரின் பகுதியாக எடுத்துக்கொள்ளப்படவில்லை.
- source_word: עָבַר
  choice: கடந்து
  rationale: ஒரு நிலவியல் அம்சத்தைத் தாண்டிச் செல்லும் எல்லைக்கோட்டின் இயக்கத்தை இயல்பாகக் காட்டுகிறது.
- source_word: הַר הַבַּעֲלָה
  choice: பாளா மலை
  rationale: הַר என்பதற்கு ‘மலை’ என்றும், בַּעֲלָה என்ற இடப்பெயருக்கு ‘பாளா’ என்றும் வழங்கப்பட்டுள்ளது.
- source_word: יַבְנְאֵל
  choice: யப்னெயேல்
  rationale: எபிரெய இடப்பெயரின் ஒலியமைப்பைத் தமிழில் நெருக்கமாகப் பிரதிபலிக்கும் ஒலிபெயர்ப்பு.
- source_word: תֹּצְאוֹת הַגְּבוּל
  choice: எல்லையின் முடிவு
  rationale: இந்த எல்லைக்கோடு முடிவடையும் இடத்தைக் குறிக்கும் தெளிவான தமிழ்; எபிரெயத்தில் பன்மை வடிவம் இருந்தாலும் இங்கு தமிழில் ஒருமை இயல்பாக உள்ளது.
- source_word: יָמָּה
  choice: கடலில்
  rationale: சூழலில் எல்லை மேற்கிலுள்ள கடலை அடைந்து முடிவதைக் குறிக்கிறது; ‘கடல் நோக்கி/மேற்கே’ என்ற திசைப் பொருளும் வடிவில் அடங்கியுள்ளது.
