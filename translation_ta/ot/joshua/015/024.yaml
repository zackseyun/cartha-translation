  text: Ziph[a], Telem, and Bealoth.
translation:
  language: ta
  text: சீப், தெலேம், பெயாலோத்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பாலோத்.”
    reason: இந்த இடப்பெயரின் பரவலாகப் பயன்படுத்தப்படும் மாற்று ஒலிபெயர்ப்பு.
lexical_decisions:
- source_word: זִיף
  choice: சீப்
  rationale: யூதாவின் நகரப் பட்டியலில் வரும் இடப்பெயர் என்பதால் பொருள் மொழிபெயர்ப்பு செய்யாமல், எபிரெய உச்சரிப்பைத் தமிழில் இயன்றவரை ஒலிபெயர்த்துள்ளது.
- source_word: טֶלֶם
  choice: தெலேம்
  rationale: இது ஓர் இடப்பெயர்; எபிரெய மெய்யெழுத்துகளையும் உயிரொலிகளையும் பின்பற்றி தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: בְעָלוֹת
  choice: பெயாலோத்
  rationale: இடப்பெயராக இருப்பதால் ஒலிபெயர்க்கப்பட்டுள்ளது. முதல் உயிரொலி குறுகியதாகவும், ע எழுத்தின் தாக்கம் உயிரொலிகளின் சந்திப்பாகவும் தமிழில் நெருக்கமாகக் காட்டப்பட்டுள்ளது.
- source_word: וָ / וּ
  choice: பட்டியலில் காற்புள்ளிகளால் இணைத்தல்
  rationale: எபிரெய மொழியில் இரண்டாம், மூன்றாம் பெயர்களுக்கு முன் இணைப்புச் சொல் உள்ளது. இயல்பான தமிழ் நகரப் பட்டியலில் ஒவ்வொரு பெயருக்கும் ‘மற்றும்’ சேர்ப்பதைவிடக் காற்புள்ளிகளால் வரிசைப்படுத்துவது தெளிவாகவும் இயல்பாகவும் உள்ளது.
