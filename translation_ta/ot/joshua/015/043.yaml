translation_notes:
  register: நவீனத் தரமான, கண்ணியமான தமிழ். இது முந்தைய வசனங்களில் தொடங்கிய ஊர்ப்பட்டியலின் ஒரு பகுதி என்பதால், தமிழில் முழுமையான பட்டியல் கூறாக இயல்பாக அமைய ‘ஆகிய ஊர்கள்’ சேர்க்கப்பட்டுள்ளது. எல்லா அடிக்குறிப்புக் குறிகளும் மூலவசன உரையில் இடம்பெற்றுள்ளன.
