- source_word: יִפְתָּח
  choice: யிப்தாகு
  rationale: யூதாவின் ஊர்ப்பட்டியலில் வரும் இடப்பெயர். எபிரெய உச்சரிப்பை நெருக்கமாகக் காட்டும் வகையில் ஒலிபெயர்க்கப்பட்டது; நியாயாதிபதியின் தனிப்பெயருடன் ஒரே வடிவில் கட்டாயமாக ஒத்திசைக்கப்படவில்லை.
- source_word: אַשְׁנָה
  choice: அஸ்னா
  rationale: எபிரெய இடப்பெயரின் இயல்பான தமிழ் ஒலிபெயர்ப்பு.
- source_word: נְצִיב
  choice: நெசீபு
  rationale: எபிரெய இடப்பெயரில் உள்ள ṣ ஒலியை வாசிக்க எளிய தமிழில் ‘ச’ எனக் காட்டி, நீண்ட உயிரையும் பிரதிபலிக்கும் ஒலிபெயர்ப்பு.
- source_word: וְ
  choice: ஆகிய
  rationale: எபிரெயத்தில் ஒவ்வொரு பெயருக்கும் முன் வரும் இணைப்புச் சொல்லின் பட்டியல் செயல்பாட்டை இயல்பான நவீன தமிழில் ‘ஆகிய’ என ஒருங்கிணைத்துக் காட்டுகிறது.
