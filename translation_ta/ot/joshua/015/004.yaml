revisions:
- from: பின்பு எல்லை அஸ்மோனைக் கடந்து, எகிப்தின் ஓடைக்குச்[a] சென்று, கடலில் முடிந்தது. இதுவே உங்களுக்குத் தெற்கு எல்லையாக இருக்கும்.
  to: பின்பு எல்லை அஸ்மோனை நோக்கித் தொடர்ந்து சென்று, எகிப்தின் ஓடையை[a] அடைந்து, கடலில் முடிந்தது. இதுவே உங்களுக்குத் தெற்கு எல்லையாக இருக்கும்.
  rationale: The only substantive change replaces an over-specific ‘crossing Azmon’ expression with a natural Tamil expression for the border’s continued movement toward Azmon. The note is retained in meaning, with a more accurate Tamil transliteration of the Hebrew lexical term.
