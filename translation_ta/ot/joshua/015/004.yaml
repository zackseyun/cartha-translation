translation_notes:
  register: நவீன நிலையான தமிழில், எல்லை வருணனைக்குரிய சுருக்கமான, கண்ணியமான நடையைப் பயன்படுத்துகிறது. ‘எல்லை’ என்பதை முதல் வினையின் எழுவாயாக வெளிப்படையாகச் சேர்த்திருப்பது எபிரெய உரையில் மறைமுகமாகத் தொடரும் எழுவாயைத் தமிழில் தெளிவாக்குகிறது.
