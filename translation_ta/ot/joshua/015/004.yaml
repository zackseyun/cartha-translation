  text: וְ/עָבַ֣ר עַצְמ֗וֹנָ/ה וְ/יָצָא֙ נַ֣חַל מִצְרַ֔יִם ו/היה תֹּצְא֥וֹת הַ/גְּב֖וּל יָ֑מָּ/ה זֶה יִהְיֶ֥ה לָ/כֶ֖ם גְּב֥וּל נֶֽגֶב־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/004.yaml
  text: Then it passed on to Azmon[a], and went out to the Brook of Egypt; and the boundary ended at the sea. This shall be your southern boundary.
translation:
  language: ta
  text: பின்பு எல்லை அஸ்மோனை நோக்கித் தொடர்ந்து சென்று, எகிப்தின் ஓடையை[a] அடைந்து, கடலில் முடிந்தது. இதுவே உங்களுக்குத் தெற்கு எல்லையாக இருக்கும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எகிப்தின் பருவகால நீரோடை.” எபிரெய மொழியில் נחל (நஹல்) என்பது பெரும்பாலும் மழைக்காலத்தில் நீர் ஓடும் ஓடையையோ வாடியையோ குறிக்கும். “எகிப்தின் ஆறு” என்பது மற்றொரு மரபுவழி மொழிபெயர்ப்பு; ஆனால் இச்சூழலில் அது நைல் நதியைக் குறிக்கிறது என்ற தவறான எண்ணத்தை ஏற்படுத்தலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָבַר
  choice: பின்பு எல்லை ... கடந்து
  rationale: எல்லை விவரிப்புகளில் עבר என்பது எல்லைக்கோடு அடுத்த இடத்தை நோக்கித் தொடர்வதைக் குறிக்கிறது. தமிழில் ‘எல்லை ... கடந்து’ என்பது அந்த நகர்வை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: עַצְמֹנָה
  choice: அஸ்மோன்
  rationale: இது ஓர் இடப்பெயர்; எனவே மொழிபெயர்க்காமல், தமிழில் இயல்பாக ஒலிபெயர்க்கப்பட்டுள்ளது. எபிரெயச் சொல்லின் இறுதி -ָה இங்கு திசை/இலக்கைக் குறிக்கும் வடிவாகப் புரிந்துகொள்ளப்பட்டுள்ளது.
- source_word: וְיָצָא
  choice: சென்று
  rationale: יצא என்பதன் அடிப்படைப் பொருள் ‘வெளியே செல்’; எல்லை விவரிப்பில் அது எல்லைக்கோடு ஓர் இடத்தை அடைவதைக் குறிக்கிறது. ‘சென்று’ என்பது உருவகத்தை அளவுக்கு மீறி விளக்காமல் இயல்பான தமிழைத் தருகிறது.
- source_word: נַחַל מִצְרַיִם
  choice: எகிப்தின் ஓடை
  rationale: נחל பெரும்பாலும் பெரிய நிரந்தர ஆற்றை அல்லாமல், பருவகால நீரோடை அல்லது வாடியைக் குறிக்கிறது. ‘ஓடை’ என்பது பொதுவாசகர்களுக்குப் புரியும் இயல்பான சொல்; நைல் நதியைக் குறிக்கும் என்ற தவறான எண்ணத்தையும் தவிர்க்கிறது.
- source_word: וְהָיוּ תֹּצְאוֹת הַגְּבוּל יָמָּה
  choice: கடலில் முடிந்தது
  rationale: இச்சொற்றொடர் எல்லையின் முடிவிடம் கடலை நோக்கி இருந்ததைக் குறிக்கிறது. ‘கடலில் முடிந்தது’ என்பது எபிரெய மொழிவழக்கின் பொருளைத் தெளிவான நவீன தமிழில் தருகிறது.
- source_word: זֶה יִהְיֶה לָכֶם גְּבוּל נֶגֶב
  choice: இதுவே உங்களுக்குத் தெற்கு எல்லையாக இருக்கும்
  rationale: נֶגֶב இங்கு ‘நெகேவ்’ என்ற பிரதேசப் பெயராக அல்லாமல், தென்திசையைக் குறிக்கிறது. மொழிபெயர்ப்பு சுருக்க வாக்கியத்தின் எதிர்காலத் தொனியையும் இரண்டாம் நபர் பன்மையையும் காக்கிறது.
