base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/060.yaml
  text: 'Kiriath-baal (that is[a], Kiriath-jearim), and Rabbah: two cities with their settlements.'
translation:
  language: ta
  text: கீரியாத்-பாகால் (அதாவது, கீரியாத்-யெஆரீம்), ரப்பா ஆகிய இரண்டு நகரங்களும் அவற்றைச் சேர்ந்த குடியிருப்புகளும்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவற்றைச் சேர்ந்த சிற்றூர்களும்.” பெயரிடப்பட்ட நகரங்களைச் சார்ந்த குடியிருப்புகளை எபிரெயச் சொல் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: קִרְיַת בַּעַל
  choice: கீரியாத்-பாகால்
  rationale: இது ஓர் இடப்பெயர் என்பதால், ‘பாகாலின் நகரம்’ என்று பொருளாக்காமல் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: הִיא
  choice: அதாவது
  rationale: முதல் இடப்பெயரும் அடுத்த இடப்பெயரும் ஒரே நகரத்தைக் குறிப்பதை விளக்கும் இணைப்பாக இங்கு வருகிறது.
- source_word: קִרְיַת יְעָרִים
  choice: கீரியாத்-யெஆரீம்
  rationale: மாற்றுப் பெயராக வரும் இடப்பெயர் என்பதால், அதன் சொற்பிறப்புப் பொருளை மொழிபெயர்க்காமல் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: הָרַבָּה
  choice: ரப்பா
  rationale: எபிரெய வடிவிலுள்ள முன்னொட்டைத் தனியே மொழிபெயர்க்காமல், இடப்பெயராக இயல்பாக ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: עָרִים שְׁתַּיִם
  choice: இரண்டு நகரங்கள்
  rationale: பட்டியலிடப்பட்ட இடங்களின் எண்ணிக்கையைச் சுருக்கிக் கூறும் சொற்றொடரின் நேரான, இயல்பான மொழிபெயர்ப்பு.
- source_word: חַצְרֵיהֶן
  choice: அவற்றைச் சேர்ந்த குடியிருப்புகள்
  rationale: பெயரிடப்பட்ட நகரங்களைச் சார்ந்த புறக்குடியிருப்புகள் அல்லது சிற்றூர்களைக் குறிக்கும் சொல்லின் பரந்த பொருளைத் தெளிவாக வெளிப்படுத்துகிறது.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழில், நிலப்பகுதிப் பட்டியலுக்கேற்ற சுருக்கமான மற்றும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. இடப்பெயர்கள் மொழிபெயர்க்கப்படாமல் ஒலிபெயர்க்கப்பட்டுள்ளன; சார்புக் குடியிருப்புகளைக் குறிக்கும் சொல்லின் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
