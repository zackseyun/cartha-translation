lexical_decisions:
- source_word: וּ/גְדֵרוֹת
  choice: கெதேரோத்
  rationale: இது இடப்பெயர் என்பதால், எபிரெய ஒலிப்புக்கு நெருக்கமாகத் தமிழில் எழுத்துப்பெயர்க்கப்பட்டுள்ளது. முன் இணைப்பு, பட்டியலின் இயல்புக்கேற்ப தமிழில் தனியாகக் காட்டப்படவில்லை.
- source_word: בֵּית דָּגוֹן
  choice: பெத்-தாகோன்
  rationale: ‘தாகோனின் வீடு’ என்று பொருள்படும் கூட்டுப்பெயராயினும், இங்கு இடப்பெயராகச் செயல்படுவதால் மொழிபெயர்க்காமல் எழுத்துப்பெயர்க்கப்பட்டுள்ளது.
- source_word: וְ/נַעֲמָה
  choice: நாமா
  rationale: இடப்பெயர் எபிரெய உச்சரிப்புக்கு ஏற்றவாறு தமிழில் எழுத்துப்பெயர்க்கப்பட்டுள்ளது.
- source_word: וּ/מַקֵּדָה
  choice: மக்கேதா
  rationale: இடப்பெயர் எபிரெய உச்சரிப்புக்கு ஏற்றவாறு தமிழில் எழுத்துப்பெயர்க்கப்பட்டுள்ளது.
- source_word: עָרִים
  choice: நகரங்கள்
  rationale: நிலப்பங்கீட்டுப் பட்டியலில் குடியிருப்பு மையங்களைக் குறிக்கும் வழக்கமான சொல்லாக ‘நகரங்கள்’ இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: שֵׁשׁ עֶשְׂרֵה
  choice: பதினாறு
  rationale: நகரங்களின் மொத்த எண்ணிக்கையை நேரடியாகக் குறிக்கும் எண்ணுப்பெயர்.
- source_word: וְ/חַצְרֵיהֶן
  choice: அவற்றின் கிராமங்களும்
  rationale: חָצֵר இச்சூழலில் பட்டியலிடப்பட்ட நகரங்களைச் சார்ந்த சிறிய ஊரகக் குடியிருப்புகளைக் குறிக்கிறது; ‘கிராமங்கள்’ என்பது நவீன தமிழில் இயல்பான இணைச்சொல்.
