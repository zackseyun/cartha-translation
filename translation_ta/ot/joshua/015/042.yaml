  rationale: இங்கு עָשָׁן பொதுப்பெயரான ‘புகை’ அல்ல, இடப்பெயர்; ஆகவே அதன் பொருளை மொழிபெயர்க்காமல் எழுத்துப்பெயர்க்கப்பட்டது. இறுதி ו ‘மற்றும்’ என வெளிப்படுத்தப்பட்டது.
