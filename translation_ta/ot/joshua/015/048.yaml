base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/048.yaml
  text: 'In the hill country: Shamir[a], Jattir[c][b], and Socoh.'
translation:
  language: ta
  text: 'மலைநாட்டில்: சாமீர், யத்தீர், சோகோ.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/בָ/הָר
  choice: மலைநாட்டில்
  rationale: இது சொற்படியாக ‘மலைப்பகுதியிலும்’ எனப் பொருள்படும். யூதாவின் உயர்நிலப் பகுதியைக் குறிக்கும் புவியியல் சூழலில், தொடரும் பட்டியலின் தலைப்பாக இயல்பான தமிழில் ‘மலைநாட்டில்’ என வழங்கப்பட்டது; தொடக்க இணைப்புச்சொல் பட்டியலின் தொடர்ச்சியால் உணரப்படுகிறது.
- source_word: שָׁמִיר
  choice: சாமீர்
  rationale: எபிரெய இடப்பெயரின் ஒலியை நவீனத் தமிழில் தெளிவாகப் பெயர்த்தெழுதுகிறது.
- source_word: וְ/יַתִּיר
  choice: யத்தீர்
  rationale: எபிரெய எழுத்தான யோத்தின் ஒலியை ‘ய’ என நேரடியாகப் பெயர்த்தெழுதி, முன்சேர்க்கப்பட்ட இணைப்புச்சொல்லைத் தமிழ்ப் பட்டியல் அமைப்பில் பிரதிபலிக்கிறது.
- source_word: וְ/שׂוֹכֹה
  choice: சோகோ
  rationale: எபிரெய இடப்பெயரின் ஒலிக்கு நெருக்கமான தமிழ்ப் பெயர்த்தெழுத்து; முன்சேர்க்கப்பட்ட இணைப்புச்சொல் பட்டியல் அமைப்பில் இயல்பாக வெளிப்படுகிறது.
