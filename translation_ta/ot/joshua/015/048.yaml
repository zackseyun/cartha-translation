translation_notes:
  register: நவீன நிலையான தமிழில், நகரங்களின் தொடர்ச்சியான பட்டியலுக்கு ஏற்ற சுருக்கமான, கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தில் உள்ள தொடக்க ‘וּ’ முந்தைய வசனத்திலிருந்து தொடரும் பட்டியலை இணைக்கிறது; தனிவசனத் தமிழில் தேவையற்ற கடினத்தன்மையைத் தவிர்க்க அது வெளிப்படையாக மொழிபெயர்க்கப்படவில்லை.
