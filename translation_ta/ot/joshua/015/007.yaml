translation_notes:
  register: நவீன நிலையான தமிழில், எல்லை வருணனைக்குரிய நிலவியல் இயக்கம் தெளிவாகவும் கண்ணியமாகவும் வழங்கப்பட்டுள்ளது. இடப்பெயர்கள் மொழிபெயர்க்கப்படாமல் தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளன; ‘நீரோடை’ போன்ற பொதுமக்களுக்கு விளங்கும் சொற்கள் பயன்படுத்தப்பட்டு, தேவையான நிலவியல் நுணுக்கம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
