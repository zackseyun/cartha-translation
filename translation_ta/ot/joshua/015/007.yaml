  text: וְ/עָלָ֨ה הַ/גְּב֥וּל דְּבִרָ/ה֮ מֵ/עֵ֣מֶק עָכוֹר֒ וְ/צָפ֜וֹנָ/ה פֹּנֶ֣ה אֶל הַ/גִּלְגָּ֗ל אֲשֶׁר נֹ֨כַח֙ לְ/מַעֲלֵ֣ה אֲדֻמִּ֔ים אֲשֶׁ֥ר מִ/נֶּ֖גֶב לַ/נָּ֑חַל וְ/עָבַ֤ר הַ/גְּבוּל֙ אֶל מֵי עֵ֣ין שֶׁ֔מֶשׁ וְ/הָי֥וּ תֹצְאֹתָ֖י/ו אֶל עֵ֥ין רֹגֵֽל׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/007.yaml
  text: And the border went up to Debir from the Valley of Achor[a], and turned northward toward Gilgal, which is opposite the Ascent of Adummim, which is south of the wadi. Then the border passed on to the waters of En-shemesh[c][b], and its end was at En-rogel.
translation:
  language: ta
  text: ஆகோர் பள்ளத்தாக்கிலிருந்து எல்லை தெபீருக்கு ஏறிச் சென்று, வடக்கே திரும்பி, நீரோடைக்குத் தெற்கே உள்ள அதும்மீம் ஏற்றத்திற்கு எதிரே இருக்கும் கில்காலை நோக்கித் திரும்பியது[a][b]. பின்பு எல்லை ஏன்-ஷெமேஷின் நீர்நிலைகளுக்குத் தொடர்ந்து சென்றது; அதன் முடிவு ஏன்-ரோகேலில் இருந்தது[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘கில்காலை நோக்கி’ என்பதற்குப் பதிலாக ‘கில்காலுக்குச்’ என்றும் மொழிபெயர்க்கலாம்; எபிரெயச் சொல் அந்த இடத்தை நோக்கிய திசையையோ, அந்த இடத்திற்குச் சென்றதையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: இங்கு ‘நீரோடை’ என மொழிபெயர்க்கப்பட்ட எபிரெயச் சொல், மழைக்காலத்தில் மட்டும் நீர் ஓடும் ஓடைப்படுகை அல்லது பள்ளத்தையும் குறிக்கலாம்.
    reason: cultural_note
  - marker: c
    text: ‘அதன் முடிவு’ என்பதற்கான எபிரெயச் சொற்றொடர் இலக்கண வடிவில் பன்மையாக, சொல்லுக்குச் சொல் ‘அதன் வெளியேறும் இடங்கள்’ என்று உள்ளது; எல்லை வருணனையில் அது முடிவிடத்தைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָלָה הַגְּבוּל דְּבִרָה
  choice: எல்லை தெபீருக்கு ஏறிச் சென்று
  rationale: எல்லை வருணனைகளில் עלה உயரமான நிலப்பகுதியை நோக்கிச் செல்லுதலைக் குறிக்கலாம்; இடப்பெயருடன் உள்ள திசைச்சுட்டு வடிவம் தெபீரை நோக்கிய இயக்கத்தைக் காட்டுகிறது.
- source_word: מֵעֵמֶק עָכוֹר
  choice: ஆகோர் பள்ளத்தாக்கிலிருந்து
  rationale: עֵמֶק என்பதற்கு இயல்பான நவீனத் தமிழ் இணை ‘பள்ளத்தாக்கு’; ஆகோர் இடப்பெயராக ஒலிபெயர்க்கப்பட்டது.
- source_word: וְצָפוֹנָה פֹּנֶה אֶל הַגִּלְגָּל
  choice: வடக்கே திரும்பி கில்காலை நோக்கிச் சென்றது
  rationale: פנה திசையை நோக்கித் திரும்புவதைக் குறிக்கிறது. אֶל இலக்கை அடைதலையோ அதை நோக்கிய திசையையோ குறிக்கக்கூடும்; உரையில் இயல்பாக ‘நோக்கிச் சென்றது’ பயன்படுத்தப்பட்டு மாற்று அடிக்குறிப்பில் தரப்பட்டது.
- source_word: אֲשֶׁר נֹכַח לְמַעֲלֵה אֲדֻמִּים
  choice: அதும்மீம் ஏற்றத்திற்கு எதிரே இருந்தது
  rationale: נֹכַח என்பது ‘எதிரே/எதிர்நோக்கி’ என்ற நிலவியல் உறவையும், מַעֲלֵה ஏறிச் செல்லும் மேடு அல்லது ஏற்றத்தையும் குறிக்கிறது.
- source_word: אֲשֶׁר מִנֶּגֶב לַנָּחַל
  choice: நீரோடைக்குத் தெற்கே இருந்த
  rationale: נֶגֶב இங்கு நெகேப் பிரதேசத்தைக் குறிக்காமல் தெற்குத் திசையைக் குறிக்கிறது. נַחַל என்பது இத்தகைய நிலவியல் சூழலில் பெரும்பாலும் பருவகால நீரோடை அல்லது பள்ளத்தைக் குறிக்கும்.
- source_word: וְעָבַר הַגְּבוּל
  choice: பின்பு எல்லை … கடந்து சென்றது
  rationale: עבר எல்லைக்கோடு அடுத்த நிலக்குறியை நோக்கிச் சென்றதையோ அதைக் கடந்ததையோ குறிக்கும்; ‘கடந்து சென்றது’ இயக்கத்தைத் தெளிவாக வைத்திருக்கிறது.
- source_word: אֶל מֵי עֵין שֶׁמֶשׁ
  choice: ஏன்-சேமேசின் நீர்களை நோக்கி
  rationale: מֵי என்பதன் பன்மை வடிவமான ‘நீர்கள்’ பாதுகாக்கப்படுகிறது; ஏன்-சேமேஷ் மொழிபெயர்க்கப்படாமல் இடப்பெயராக ஒலிபெயர்க்கப்படுகிறது.
- source_word: וְהָיוּ תֹצְאֹתָיו אֶל עֵין רֹגֵל
  choice: அதன் முடிவு ஏன்-ரோகேலில் இருந்தது
  rationale: எல்லை வருணனையில் תֹצְאוֹתָיו எல்லையின் முடிவு அல்லது முடிவிடத்தைக் குறிக்கிறது. தமிழில் ஒருமை ‘முடிவு’ இயல்பானது; எபிரெய பன்மை அடிக்குறிப்பில் சுட்டப்படுகிறது.
