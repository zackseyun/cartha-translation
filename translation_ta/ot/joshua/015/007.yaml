  rationale: The revision removes the added sequential movement after the northward turn, clarifies that Gilgal is opposite the Ascent of Adummim and that the ascent is south of the wadi, corrects the transliteration of En-shemesh, and places each footnote marker beside its relevant expression. No theological or doctrinal issue is involved.
