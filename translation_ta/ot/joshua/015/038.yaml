lexical_decisions:
- source_word: דִלְעָן
  choice: திலெயான்
  rationale: யூதாவின் ஊர்ப்பட்டியலில் வரும் இடப்பெயர்; மசோரா உயிர்க்குறிப்பை அடிப்படையாகக் கொண்டு தமிழில் ஒலிபெயர்க்கப்பட்டது.
- source_word: הַמִּצְפֶּה
  choice: மிஸ்பே
  rationale: இந்தச் சொல் ‘காவற்கோபுரம்/கண்காணிப்பிடம்’ என்ற பொதுப்பெயரிலிருந்து வந்திருந்தாலும், இங்கு ஊர்ப்பட்டியலில் இடப்பெயராகச் செயல்படுகிறது. ஆகவே பொருளாக்காமல் ஒலிபெயர்க்கப்பட்டுள்ளது; எபிரெய definite article இடப்பெயரின் பகுதியாகப் புரிந்துகொள்ளப்படுகிறது.
- source_word: יָקְתְאֵל
  choice: யொக்தெயேல்
  rationale: இடப்பெயர் என்பதால் மசோரா வாசிப்பை நெருக்கமாகப் பின்பற்றி தமிழில் ஒலிபெயர்க்கப்பட்டது.
