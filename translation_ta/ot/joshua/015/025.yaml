  source_fidelity: மூல எபிரெயத்தின் வாவ் இணைப்பும் இடப்பெயர்-பட்டியல் அமைப்பும் துல்லியமாகப் பிரதிபலிக்கப்படுகின்றன. חָצוֹר חֲדַתָּה ‘ஆசோர்-அதத்தா’ என்ற கூட்டிடப்பெயராகவும், קְרִיּוֹת חֶצְרוֹן ‘கெரியோத்-எஸ்ரோன்’ என்ற பெயராகவும், הִיא חָצוֹר விளக்க அடையாளமாக ‘அதாவது, ஆசோர்’ என்றும் சரியாகக் கொடுக்கப்பட்டுள்ளது. மாற்றுவாசிப்பு குறித்த அடிக்குறிப்பு மூலத்தில் உள்ள பிரிப்புச் சாத்தியத்தைப் பாதுகாக்கிறது.
  naturalness: ‘ஆசோர்-அதத்தாவும், கெரியோத்-எஸ்ரோனும் (அதாவது, ஆசோர்)’ என்பது நவீன பொதுத்தமிழில் ஊர்ப்பட்டியலுக்கேற்ற சுருக்கமான, இயல்பான நடை. வசனத் தொடரின் பட்டியல்-நிறுத்தற்குறியும் பொருத்தமானது.
  terminology: இடப்பெயர்கள் முழுவதும் ஒரே முறையில் ஒலிபெயர்க்கப்பட்டுள்ளன. ‘அதாவது’ என்பது הִיא-வின் இவ்விடத்து அடையாளப்படுத்தும்/விளக்கும் பயன்பாட்டிற்கு இயல்பான தமிழ் இணைப்பாகும். ‘கெரியோத்’/‘கிரியோத்’ மாற்றொலிபெயர்ப்பு அடிக்குறிப்பு உதவிகரமாகவும் துல்லியமாகவும் உள்ளது.
