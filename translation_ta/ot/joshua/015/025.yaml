  yaml_path: translation/ot/joshua/015/025.yaml
  text: and Hazor-hadattah[a], and Kerioth-hezron (that is, Hazor)[b],
translation:
  language: ta
  text: ஆசோர்-அதத்தாவும்[a], கெரியோத்-எஸ்ரோனும் (அதாவது, ஆசோர்)[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: חֲדַתָּה என்பதை ‘ஆசோர்’ என்பதுடன் சேர்ந்த கூட்டுப் பெயராக அல்லாமல் தனி ஊர்ப்பெயராக எடுத்துக்கொண்டால், “ஆசோரும், அதத்தாவும், கெரியோத்-எஸ்ரோனும்; அதாவது, ஆசோர்” என்றும் இருக்கலாம்.
    reason: alternative_reading
  - marker: b
    text: “கெரியோத்” என்ற இடப்பெயரை “கிரியோத்” என்றும் ஒலிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/חָצוֹר חֲדַתָּה
  choice: ஆசோர்-அதத்தாவும்
  rationale: வாவ் இணைப்புச்சொல் தமிழில் பெயருடன் இணையும் ‘-உம்’ ஆகக் கொடுக்கப்பட்டது. மசோரா உச்சரிப்புக் குறிகளும் ஊர்ப்பட்டியல் சூழலும் חֲדַתָּה என்பதை חָצוֹר உடன் சேர்ந்த கூட்டுப் பெயராகப் புரிந்துகொள்ள ஆதரிக்கின்றன; ஆகவே பொருளாக்காமல் ஒலிபெயர்க்கப்பட்டது.
- source_word: וּ/קְרִיּוֹת חֶצְרוֹן
  choice: கெரியோத்-எஸ்ரோனும்
  rationale: ஊர்களின் பட்டியலில் קְרִיּוֹת பொதுப்பெயரான ‘நகரங்கள்’ என்பதற்குப் பதிலாக இடப்பெயராக எடுத்துக்கொள்ளப்பட்டது; חֶצְרוֹן அதனுடன் சேர்ந்த கூட்டுப் பெயரின் இரண்டாம் கூறாக ஒலிபெயர்க்கப்பட்டது.
- source_word: הִיא
  choice: அதாவது
  rationale: இங்கு பெண்பால் ஒருமைப் பிரதிப்பெயர் முன் கூறிய இடப்பெயரை மறுபெயரிட்டு அடையாளப்படுத்துகிறது. தமிழில் இயல்பான விளக்க இணைப்பாக ‘அதாவது’ பயன்படுத்தப்பட்டது.
- source_word: חָצוֹר
  choice: ஆசோர்
  rationale: இறுதியில் வரும் இடப்பெயர் முன் கூறிய ஊரை விளக்கமாக அடையாளப்படுத்துகிறது; பெயர் முழுவதும் ஒரே முறையில் ஒலிபெயர்க்கப்பட்டது.
theological_decisions: []
translation_notes:
  register: நவீன பொதுத்தமிழில், ஊர்ப்பட்டியலுக்கேற்ற சுருக்கமான மற்றும் கண்ணியமான நடை. எபிரெய இடப்பெயர்கள் தமிழ்ச் செவிக்கு இயல்பாக ஒலிபெயர்க்கப்பட்டன; உண்மையான உரைப்பிரிப்பு ஐயம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டது.
