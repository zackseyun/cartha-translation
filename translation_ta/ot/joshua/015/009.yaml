base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/009.yaml
  text: Then the border curved from the top of the mountain to the spring of the waters of Nephtoah[a], and went out to the cities of Mount Ephron; then the border curved to Baalah (that is, Kiriath-jearim).
translation:
  language: ta
  text: பின்பு அந்த எல்லை மலையின் உச்சியிலிருந்து நெப்தோவா நீர்களின் ஊற்றுக்கு வளைந்து[a], எப்ரோன் மலையின் பட்டணங்களுக்குச் சென்றது. அதன்பின் அந்த எல்லை பாலாவை நோக்கி வளைந்தது; அதுவே கீரியாத்-யெயாரீம்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அந்த எல்லை குறிக்கப்பட்டது” / “அந்த எல்லை திரும்பியது.” இந்த எல்லை விவரிப்பில் வரும் எபிரெய வினைச்சொல், எல்லைக்கோடு வரையப்படுவதையோ திசை மாறுவதையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְתָאַר
  choice: வளைந்து / வளைந்தது
  rationale: எல்லை விவரிப்புகளில் இந்த வினைச்சொல் எல்லைக்கோடு திசைமாறுவதையோ ஒரு நில அமைப்பைச் சுற்றி வரையப்படுவதையோ குறிக்கலாம். இச்சூழலில் இயல்பான தமிழாகவும் நிலவியல் இயக்கத்தைத் தெளிவாகவும் காட்டுவதால் ‘வளைந்து’ என மொழிபெயர்க்கப்பட்டது; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: הַגְּבוּל
  choice: அந்த எல்லை
  rationale: நிலப்பங்கீட்டின் புவியியல் சூழலில் ‘எல்லை’ என்பது தெளிவான, இயல்பான நவீனத் தமிழ் சொல்.
- source_word: מֵרֹאשׁ הָהָר
  choice: மலையின் உச்சியிலிருந்து
  rationale: רֹאשׁ என்பதன் நிலவியல் பொருளை ‘உச்சி’ துல்லியமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: מַעְיַן מֵי נֶפְתּוֹחַ
  choice: நெப்தோவாவின் நீரூற்று
  rationale: எபிரெயக் கட்டமைப்பின் மையமான ‘நீரூற்று’ என்ற பொருளையும் நெப்தோவா என்ற இடப்பெயரையும் தெளிவாகப் பாதுகாக்கிறது; சொல்லுக்குச் சொல் ‘நெப்தோவாவின் நீர்களின் ஊற்று’ என்பது தமிழில் தேவையற்ற கடினத்தன்மை தரும்.
- source_word: וְיָצָא
  choice: சென்றது
  rationale: எல்லைக்கோடு தொடர்ந்து முன்னேறுவதை இச்சூழலில் இயல்பான தமிழில் தெரிவிக்கிறது; ‘வெளியே சென்றது’ என்ற சொல்லுக்குச் சொல் வடிவம் தமிழில் தவறான இடவியல் உணர்வைத் தரக்கூடும்.
- source_word: עָרֵי הַר עֶפְרוֹן
  choice: எப்ரோன் மலையின் பட்டணங்கள்
  rationale: עָרֵי என்பதை ‘பட்டணங்கள்’ என்றும் הַר עֶפְרוֹן என்பதை ‘எப்ரோன் மலை’ என்றும் நேரடியாகப் பாதுகாக்கிறது; ‘மலைநாடு’ என்று விரிவுபடுத்தவில்லை.
- source_word: בַּעֲלָה
  choice: பாலா
  rationale: இடப்பெயர் தமிழில் ஒலிபெயர்க்கப்பட்டது.
- source_word: הִיא קִרְיַת יְעָרִים
  choice: அதுவே கீரியாத்-யெயாரீம்
  rationale: இரு இடப்பெயர்களும் ஒரே இடத்தைக் குறிப்பதை இயல்பான தமிழில் தெளிவுபடுத்துகிறது; எபிரெயத்தின் அடையாளப்படுத்தும் சுட்டுப்பெயர் வலிமையும் காக்கப்படுகிறது.
