source:
  edition: WLC
  text: וּ/לְ/כָלֵ֣ב בֶּן יְפֻנֶּ֗ה נָ֤תַן חֵ֨לֶק֙ בְּ/ת֣וֹךְ בְּנֵֽי יְהוּדָ֔ה אֶל פִּ֥י יְהוָ֖ה לִֽ/יהוֹשֻׁ֑עַ אֶת קִרְיַ֥ת אַרְבַּ֛ע אֲבִ֥י הָ/עֲנָ֖ק הִ֥יא חֶבְרֽוֹן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/013.yaml
  text: 'And to Caleb son of Jephunneh he gave a portion among the sons of Judah[a], according to the command of Yahweh to Joshua: Kiriath-arba (Arba was the father of Anak), that is[b], Hebron.'
translation:
  language: ta
  text: யெப்புன்னேயின் மகன் காலேபுக்கு, யூதா மக்களிடையே, யாவே யோசுவாவுக்குக் கட்டளையிட்டபடி[a], ஆனாக்கின் தந்தையான[b] அர்பாவின் நகரமாகிய கீரியாத்-அர்பாவை—அதாவது எப்ரோனை—அவர் ஒரு பங்காகக் கொடுத்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘யாவேயின் வார்த்தையின்படி’ என்றும் மொழிபெயர்க்கலாம். எபிரெய மரபுத்தொடரின் சொற்சொல் பொருள் ‘யாவேயின் வாயின்படி’ என்பதாகும்.
    reason: lexical_alternative
  - marker: b
    text: இங்கே ‘தந்தை’ என்பது ‘மூதாதை’ அல்லது ‘நிறுவியவர்’ என்றும் பொருள்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/לְ/כָלֵב בֶּן יְפֻנֶּה
  choice: யெப்புன்னேயின் மகன் காலேபுக்கு
  rationale: எபிரெய இணைப்பையும் உறவுமுறை அமைப்பையும் இயல்பான தமிழ் சொல் வரிசையில் தருகிறது; தனிப்பெயர்கள் ஒலிபெயர்க்கப்பட்டுள்ளன.
- source_word: נָתַן חֵלֶק
  choice: அவர் ... ஒரு பங்கைக் கொடுத்தார்
  rationale: ‘ஒரு பங்கைக் கொடுத்தார்’ என்பது கொடுக்கப்பட்ட நிலப்பங்கைக் குறிக்கும் மூல வினையமைப்பைப் பேணுகிறது. எழுவாய் மூலத்தில் சொல்லப்படாததால் ‘அவர்’ என்று மட்டுமே வைத்து அதன் அடையாளத்தைத் தீர்மானிக்கவில்லை.
- source_word: בְּתוֹךְ בְּנֵי יְהוּדָה
  choice: யூதாவின் சந்ததியினர் நடுவே
  rationale: ‘யூதாவின் மகன்கள்’ என்ற சொற்சொல் மொழிபெயர்ப்பைவிட பழங்குடிச் சமூகத்தைக் குறிக்கும் பொருளை நவீன தமிழில் தெளிவாகத் தருகிறது; ‘நடுவே’ என்பது בְּתוֹךְ என்பதன் இடைநிலைப் பொருளைப் பேணுகிறது.
- source_word: אֶל פִּי יְהוָה לִיהוֹשֻׁעַ
  choice: யாவே யோசுவாவுக்குக் கட்டளையிட்டபடி
  rationale: ‘யாவேயின் வாயின்படி’ என்ற எபிரெய மரபுத்தொடரின் சூழல்சார் பொருளை இயல்பான தமிழில் தருகிறது; கட்டளை யோசுவாவுக்கு வழங்கப்பட்டதாக லாமேத் உருபைக் காட்டுகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரான நான்கெழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: קִרְיַת אַרְבַּע
  choice: அர்பாவின் பட்டணமாகிய கீரியாத்-அர்பா
  rationale: இது இடப்பெயராக ஒலிபெயர்க்கப்படுகிறது; அதேவேளை அடுத்துள்ள ‘அர்பா’ குறித்த விளக்கம் தவறாக நகரத்தையே ஆனாக்கின் தந்தை எனச் சுட்டாதபடி இயல்பான தமிழ் அமைப்பு பயன்படுத்தப்படுகிறது.
- source_word: אֲבִי הָעֲנָק
  choice: ஆனாக்கின் தந்தையான
  rationale: אָב என்பதன் முதன்மையான உறவுமுறைப் பொருளைப் பேணுகிறது; ‘மூதாதை’ அல்லது ‘நிறுவியவர்’ என்ற விரிவான பொருள் அடிக்குறிப்பில் குறிப்பிடப்படுகிறது.
- source_word: הִיא חֶבְרוֹן
  choice: அதாவது எப்ரோன்
  rationale: கீரியாத்-அர்பாவும் எப்ரோனும் ஒரே நகரம் என்பதை இயல்பான அடையாளப்படுத்தும் தொடரால் தெரிவிக்கிறது.
theological_decisions:
- issue: נָתַן என்ற வினையின் சொல்லப்படாத எழுவாய்
  choice: ‘அவர் ... கொடுத்தார்’ என்று எழுவாயின் அடையாளத்தைத் திறந்த நிலையில் வைத்தல்
  alternative: ‘யோசுவா கொடுத்தார்’ அல்லது ‘யாவே கொடுத்தார்’ என்று வெளிப்படையாகக் குறிப்பிடுதல்
  rationale: எபிரெய உரையில் எழுவாய் இவ்வசனத்தில் வெளிப்படையாக இல்லை. யோசுவா அல்லது யாவே என்று குறிப்பிட்டால் மூல உரையின் உண்மையான தெளிவின்மையை மொழிபெயர்ப்பே தீர்த்துவிடும்.
- issue: אֲבִי הָעֲנָק என்பதில் אָב என்பதன் பரப்பு
  choice: முதன்மை உரையில் ‘தந்தை’
  alternative: ‘மூதாதை’ அல்லது ‘நிறுவியவர்’
  rationale: ‘தந்தை’ என்பது நேரடியான பொருளைத் தக்கவைக்கிறது; பரந்த வம்ச அல்லது நிறுவனர் பொருள் சாத்தியமாதலால் அதை அடிக்குறிப்பில் விடுவது பொருத்தமானது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. ‘சந்ததியினர்’, ‘பங்கு’, ‘கட்டளையிட்டபடி’ போன்ற சொற்கள் பழங்குடி நிலப்பங்கீட்டுச் சூழலைத் தெளிவாகத் தருகின்றன. சொல்லப்படாத எழுவாயும் אָב என்பதன் பொருள் பரப்பும் விளக்கத்தால் குறுக்கப்படவில்லை.
