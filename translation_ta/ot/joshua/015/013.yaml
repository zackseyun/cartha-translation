revisions:
- from: யெப்புன்னேயின் மகன் காலேபுக்கு அவர் யூதாவின் சந்ததியினர் நடுவே ஒரு பங்கைக் கொடுத்தார். யாவே யோசுவாவுக்குக் கட்டளையிட்டபடி[a], ஆனாக்கின் தந்தையான[b] அர்பாவின் பட்டணமாகிய கீரியாத்-அர்பாவை—அதாவது எப்ரோனை—அவருக்குக் கொடுத்தார்.
