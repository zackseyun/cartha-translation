  rationale: The revision restores the source’s single allotment statement by making Kiriath-arba/Hebron the object given ‘as a portion.’ It preserves the source’s unresolved subject, the command-of-Yahweh phrase, and the clarification that Arba is Anak’s father. Footnote anchors remain attached to their relevant expressions.
