lexical_decisions:
- source_word: יַרְמוּת
  choice: யர்மூத்
  rationale: யூதாவிலிருந்த ஊரின் பெயர் என்பதால் பொருள் மொழிபெயர்க்காமல், எபிரெய ஒலிப்புக்கு நெருக்கமாகத் தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: וַ/עֲדֻלָּם
  choice: அதுல்லாம்
  rationale: இணைப்பிடைச்சொல்லுடன் வரும் இடப்பெயர். இயல்பான தமிழ் பட்டியல் நடைக்காக இணைப்பிடைச்சொல் தனியே மொழிபெயர்க்கப்படாமல், இடப்பெயர் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: שׂוֹכֹה
  choice: சோக்கோ
  rationale: இடப்பெயரின் எபிரெய உச்சரிப்பைத் தமிழில் தெளிவாகக் காட்டும் ஒலிபெயர்ப்பு தேர்ந்தெடுக்கப்பட்டுள்ளது.
- source_word: וַ/עֲזֵקָה
  choice: அசேக்கா
  rationale: இணைப்பிடைச்சொல்லுடன் வரும் இடப்பெயர். இது ஊர்களின் எளிய பட்டியல் என்பதால், இயல்பான தமிழ் பட்டியல் நடையில் காற்புள்ளியால் இணைக்கப்பட்டு, பெயர் ஒலிபெயர்க்கப்பட்டுள்ளது.
