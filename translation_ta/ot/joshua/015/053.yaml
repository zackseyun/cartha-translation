  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ו/ינים
  choice: யானீமும்
  rationale: ו prefixed conjunction is naturally represented by Tamil additive -உம் in this place-name list. The proper name is transliterated from the Masoretic form as யானீம் rather than translated.
- source_word: וּ/בֵית תַּפּוּחַ
  choice: பேத்-தப்பூவாகும்
  rationale: The established compound place-name is transliterated as a unit. பேத் reflects בֵית, தப்பூவாக் reflects תַּפּוּחַ including its final guttural, and the conjunction is conveyed by -உம்.
- source_word: וַ/אֲפֵקָה
  choice: அஃபேக்காவும்
  rationale: The place-name is transliterated from אֲפֵקָה, retaining its final -ā sound rather than shortening it to Aphek; -உம் represents the prefixed conjunction.
