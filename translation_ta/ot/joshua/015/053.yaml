translation_notes:
  register: நவீனத் தரத் தமிழில், ஊர்ப்பெயர்களின் எபிரேய ஒலிவடிவத்தை இயன்றவரை காத்து, பட்டியலின் தொடர்ச்சியை இயல்பான -உம் இணைப்பால் வெளிப்படுத்தப்பட்டுள்ளது.
