  edition: WLC
  text: וַֽ/יִּלְכְּדָ֛/הּ עָתְנִיאֵ֥ל בֶּן קְנַ֖ז אֲחִ֣י כָלֵ֑ב וַ/יִּתֶּן ל֛/וֹ אֶת עַכְסָ֥ה בִתּ֖/וֹ לְ/אִשָּֽׁה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/017.yaml
  text: Othniel son of Kenaz[a], Caleb’s brother, captured it[b], and he gave him his daughter Achsah as a wife.
translation:
  language: ta
  text: கெனாசின் மகனும் காலேபின் சகோதரனுமான ஒத்னியேல் அதைக் கைப்பற்றினான்[b]. காலேப் தன் மகள் அக்சாளை அவனுக்கு மனைவியாகக் கொடுத்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: ‘அதை’ என்பது முந்தைய வசனத்தில் குறிப்பிடப்பட்ட கிரியாத்-செப்பேர், அதாவது தெபீர் நகரத்தைக் குறிக்கிறது.
    reason: cross_reference
lexical_decisions:
- source_word: וַיִּלְכְּדָהּ
  choice: அதைக் கைப்பற்றினான்
  rationale: לכד என்பதன் இராணுவச் சூழலுக்குரிய ‘கைப்பற்று’ என்ற பொருளைப் பாதுகாக்கிறது. பெண்பால் ஒருமை பின்னொட்டு முந்தைய வசனத்தில் குறிப்பிடப்பட்ட நகரத்தைக் குறிக்கிறது.
- source_word: עָתְנִיאֵל
  choice: ஒத்னியேல்
  rationale: எபிரேயப் பெயரின் ஒலியமைப்பை நவீனத் தமிழில் இயல்பாகக் காட்டும் எழுத்துப்பெயர்ப்பு.
- source_word: בֶּן קְנַז
  choice: கெனாசின் மகன்
  rationale: தந்தை–மகன் உறவைக் குறிக்கும் எளிய எபிரேய அமைப்பை நேரடியாகத் தருகிறது.
- source_word: אֲחִי כָלֵב
  choice: காலேபின் சகோதரன்
  rationale: אָח என்பதன் இங்குள்ள நேரடியான பொருள் ‘சகோதரன்.’ விரிந்த உறவைக் குறிக்கும் வாய்ப்பை அடிக்குறிப்பில் வைத்திருக்கிறது.
- source_word: וַיִּתֶּן לוֹ
  choice: காலேபு ... அவனுக்குக் கொடுத்தான்
  rationale: எபிரேயத்தில் எழுவாய் சுட்டுப்பெயராக இருந்தாலும், முந்தைய வசனத்திலிருந்து அது காலேபைக் குறிக்கிறது. தமிழில் தவறான அண்மைத் தொடர்பைத் தவிர்க்க பெயர் வெளிப்படையாகக் கூறப்படுகிறது; பெறுபவர் ஒத்னியேல் என்பதால் ‘அவனுக்கு’ தக்கவைக்கப்படுகிறது.
- source_word: אֶת עַכְסָה בִתּוֹ
  choice: தன் மகள் அக்சாளை
  rationale: பெயரையும் மகள் உறவையும் இயல்பான தமிழ் சொல் வரிசையில் தருகிறது; ‘தன்’ என்பது மகள் காலேபுடையவர் என்பதைத் தெளிவாக்குகிறது.
- source_word: לְאִשָּׁה
  choice: மனைவியாக
  rationale: திருமணத்தில் ஒருவரை மனைவியாகக் கொடுப்பதைக் குறிக்கும் எபிரேய மரபுத்தொடரின் சுருக்கமான, இயல்பான தமிழ் வடிவம்.
theological_decisions:
- issue: אֲחִי כָלֵב என்பதில் உறவின் துல்லியம்
  choice: காலேபின் சகோதரன்
  alternative: காலேபின் உறவினன்
  rationale: சொல்லின் இயல்பான, நேரடியான பொருள் ‘சகோதரன்’; சூழல் கட்டாயப்படுத்தாத விரிந்த பொருளை முதன்மை உரையில் தேர்ந்தெடுக்கவில்லை. உண்மையான சொற்பொருள் வாய்ப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையுடன் மொழிபெயர்க்கப்பட்டது. எபிரேயக் கதைநடையின் வரிசை பெரும்பாலும் காக்கப்பட்டாலும், சுட்டுப்பெயர் குழப்பத்தைத் தவிர்க்க இரண்டாம் வாக்கியத்தின் எழுவாயாக ‘காலேபு’ வெளிப்படையாகக் கூறப்பட்டுள்ளது. அடிக்குறிப்பு குறிகள் உரையில் தோன்றும் வரிசைப்படி அமைக்கப்பட்டுள்ளன.
