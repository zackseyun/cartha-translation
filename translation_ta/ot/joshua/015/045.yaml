translation:
  language: ta
  text: எக்ரோனும், அதற்குரிய துணைநகரங்களும் அதன் கிராமங்களும்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֶקְרוֹן
  choice: எக்ரோன்
  rationale: இது ஓர் இடப்பெயர்; எபிரெய உச்சரிப்புக்கு நெருக்கமாகத் தமிழில் ஒலிபெயர்க்கப்பட்டது.
- source_word: וּבְנֹתֶיהָ
  choice: அதற்குச் சேர்ந்த துணைநகரங்களும்
  rationale: நேரடியாக ‘அதன் மகள்கள்’ என்று பொருள்படும் இச்சொல், நிலப்பகுதிப் பட்டியல்களில் ஒரு முதன்மை நகரத்தைச் சார்ந்த குடியிருப்புகளைக் குறிக்கும் எபிரெய மரபுத்தொடர். ‘துணைநகரங்கள்’ அந்தச் சார்புறவைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: וַחֲצֵרֶיהָ
  choice: அதன் கிராமங்களும்
  rationale: இந்நிலப்பங்கீட்டுச் சூழலில் חֲצֵרִים சிறிய குடியிருப்புகள் அல்லது கிராமங்களைக் குறிக்கிறது; ‘கிராமங்கள்’ நவீனத் தமிழில் தெளிவான இணைச்சொல்.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழில், நிலப்பகுதிப் பட்டியலுக்கேற்ற சுருக்கமான, கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘துணைநகரங்கள்’ என்பது மூலத்தின் சார்புறவைக் காத்தபடி ‘மகள்கள்’ என்ற மரபுத்தொடரின் பொருளைத் தெளிவாக்குகிறது.
