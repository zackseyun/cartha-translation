base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/047.yaml
  text: Ashdod[a], its daughter towns and its villages; Gaza, its daughter towns and its villages; as far as the Brook of Egypt, and the Great Sea[c][b], which is its boundary.
translation:
  language: ta
  text: 'அஸ்தோத், அதைச் சார்ந்த துணைப் பட்டணங்களும்[a] அதன் கிராமங்களும்; காசா, அதைச் சார்ந்த துணைப் பட்டணங்களும் அதன் கிராமங்களும்; எகிப்தின் நீரோடை[b] வரையிலும், அதன் எல்லையாகிய பெருங்கடல்[c] வரையிலும்.


    [a] எபிரெய மொழியில் நேர்ச்சொல்லாக “அதன் மகள்கள்”; இது ஒரு முதன்மை நகரத்தைச் சார்ந்த துணைப் பட்டணங்களைக் குறிக்கும் மரபுத்தொடர்.

    [b] அல்லது, “எகிப்தின் வாடி.” எபிரெயச் சொல் பருவகாலத்தில் மட்டும் நீர் ஓடும் நீர்வழியையோ வறண்ட ஆற்றுப்படுகையையோ குறிக்கலாம்.

    [c] அதாவது, மத்தியதரைக் கடல்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மொழியில் நேர்ச்சொல்லாக “அதன் மகள்கள்”; இது ஒரு முதன்மை நகரத்தைச் சார்ந்த துணைப் பட்டணங்களைக் குறிக்கும் மரபுத்தொடர்.
