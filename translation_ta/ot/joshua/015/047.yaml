lexical_decisions:
- source_word: בְּנוֹתֶיהָ
  choice: அதைச் சார்ந்த துணைப் பட்டணங்கள்
  rationale: நகரப் பட்டியல்களில் நேர்ச்சொல்லான ‘அதன் மகள்கள்’ என்பது முதன்மை நகரத்தைச் சார்ந்த துணை அல்லது சுற்றுப்புறப் பட்டணங்களைக் குறிக்கும். தமிழ் வாசகருக்கு பொருள் உடனே விளங்குமாறு மரபுத்தொடரின் கருத்து முதன்மை உரையில் தரப்பட்டு, அதன் உருவகம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: חֲצֵרֶיהָ
  choice: அதன் கிராமங்கள்
  rationale: இப்புவியியல் சூழலில் சிறிய புறக்குடியிருப்புகளைக் குறிக்கிறது; ‘கிராமங்கள்’ என்பது நவீன தமிழில் இயல்பானதும் துணைப் பட்டணங்களிலிருந்து தெளிவாக வேறுபடுத்துவதுமாகும்.
- source_word: נַחַל מִצְרָיִם
  choice: எகிப்தின் நீரோடை
  rationale: இது தெற்கு எல்லையைக் குறிக்கும் பெயர்பெற்ற புவியியல் குறியீடு. נַחַל என்பது நிரந்தர ஓடையையும் பருவகால நீர்வழி அல்லது வாடியையும் குறிக்கக்கூடும்; ‘நீரோடை’ பொதுவாசகருக்கு எளிதாக இருப்பதால் தேர்ந்தெடுக்கப்பட்டு, ‘வாடி’ அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: הַיָּם
  choice: பெருங்கடல்
  rationale: இஸ்ரவேலின் எல்லை விவரிப்புகளில் இச்சொல் மத்தியதரைக் கடலைக் குறிக்கிறது. ஆலோசனை உரையின் ‘Great Sea’ மரபைத் தொடர்ந்து ‘பெருங்கடல்’ பயன்படுத்தப்பட்டு, குறிப்பிட்ட கடலின் பெயர் அடிக்குறிப்பில் விளக்கப்படுகிறது.
- source_word: הַגְּבוּל וּגְבוּל
  choice: அதன் எல்லையாகிய
  rationale: கொடுக்கப்பட்ட எபிரெய முடிவு சுருக்கமாகவும் இலக்கண ரீதியில் கடினமாகவும் உள்ளது. கடல் நிலப்பகுதியின் எல்லையாகச் செயல்படுகிறது என்ற சூழல்சார் கருத்தை இயல்பான தமிழில் தெரிவிக்கிறது; தெளிவின்மையைத் தேவையற்ற கூடுதல் புவியியல் விவரமாக மாற்றவில்லை.
- source_word: עַד
  choice: வரையிலும்
  rationale: நிலப்பரப்பின் எல்லை அல்லது எட்டும் அளவைக் குறிக்கும் இயல்பான நவீன தமிழ் வடிவம்.
- source_word: אַשְׁדּוֹד / עַזָּה
  choice: அஸ்தோத் / காசா
  rationale: தமிழ் வேதாகமப் பெயரிடும் மரபில் பரவலாக அறியப்படும் ஒலிபெயர்ப்பு வடிவங்கள்.
