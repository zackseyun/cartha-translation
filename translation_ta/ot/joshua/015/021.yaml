base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/021.yaml
  text: And the cities at the extremity of the tribe of the sons of Judah[a], toward the border of Edom in the Negev, were Kabzeel, Eder[b], and Jagur.
translation:
  language: ta
  text: யூதா சந்ததியினரின் கோத்திரத்தின் கடைக்கோடியில், ஏதோமின் எல்லையை நோக்கி நெகேபில்[a] இருந்த நகரங்கள் கப்செயேல், ஏதேர், யாகூர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “நெகேப்” என்பதை “தெற்கு” அல்லது “தென்பகுதி” என்றும் மொழிபெயர்க்கலாம்; இங்கு அது யூதாவின் குறிப்பிட்ட தென் வட்டாரத்தைக் குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּהְיוּ הֶעָרִים
  choice: இருந்த பட்டணங்கள்
  rationale: இச்சொற்றொடர் பட்டணங்களின் பட்டியலை அறிமுகப்படுத்துகிறது; தமிழில் இயல்பான பட்டியல் அமைப்புக்காக வினைச்சொல் பெயருக்கு முன் தொடர்பெயரெச்சமாக வழங்கப்பட்டுள்ளது.
- source_word: מִקְצֵה
  choice: எல்லைப்புறத்தில்
  rationale: இது நிலப்பரப்பின் கடைக்கோடி அல்லது வெளி விளிம்பைக் குறிக்கிறது; ‘எல்லைப்புறம்’ அந்த இடஞ்சார்ந்த பொருளை இயல்பாகத் தருகிறது.
- source_word: לְמַטֵּה בְנֵי יְהוּדָה
  choice: யூதாவின் சந்ததியாருடைய கோத்திரத்தின்
  rationale: מַטֶּה என்பது கோத்திரப் பிரிவையும், בְנֵי יְהוּדָה என்பது வழக்கமான கோத்திர அடையாளமாக ‘யூதாவின் சந்ததியார்’ என்பதையும் குறிக்கிறது.
- source_word: אֶל גְּבוּל אֱדוֹם
  choice: ஏதோமின் எல்லையை நோக்கி
  rationale: אֶל என்பதிலுள்ள திசைநோக்கிய நுட்பத்தைத் தக்கவைக்கிறது; பட்டணங்கள் எல்லையிலேயே இருந்தன என்று தேவையின்றி உறுதிப்படுத்தவில்லை.
- source_word: בַּנֶּגְבָּה
  choice: நெகேபில்
  rationale: இச்சூழலில் இது வெறும் ‘தெற்கு’ என்பதைவிட யூதாவின் குறிப்பிட்ட தென் வட்டாரத்தைக் குறிக்கும் நிலப்பெயராகப் புரிந்துகொள்ளப்படுகிறது.
- source_word: קַבְצְאֵל וְעֵדֶר וְיָגוּר
  choice: கப்செயேல், ஏதேர், யாகூர்
  rationale: எபிரெய இடப்பெயர்களின் ஒலியைத் தமிழில் நெருக்கமாக எழுத்துப்பெயர்த்துள்ளது.
