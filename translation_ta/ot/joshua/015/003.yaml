translation_notes:
  register: நவீனத் தரத் தமிழில், எல்லைப் பயணப் பட்டியலின் தொடர்ச்சியான இயக்கத்தைத் தெளிவாகக் காட்டும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. இடப்பெயர்கள் மொழிபெயர்க்கப்படாமல் தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளன; ‘எல்லை’ என்பது சூழலால் தெளிவாக இருந்தாலும் தமிழில் இயல்புக்காக வெளிப்படையாகச் சேர்க்கப்பட்டுள்ளது. எல்லா அடிக்குறிப்பு குறிகளும் தொடர்புடைய சொல்லோ சொற்றொடரோ முடியும் இடத்தில் முதன்மை உரையில் தரப்பட்டுள்ளன.
