  text: וְ֠/יָצָא אֶל מִ/נֶּ֜גֶב לְ/מַעֲלֵ֤ה עַקְרַבִּים֙ וְ/עָ֣בַר צִ֔נָ/ה וְ/עָלָ֥ה מִ/נֶּ֖גֶב לְ/קָדֵ֣שׁ בַּרְנֵ֑עַ וְ/עָבַ֤ר חֶצְרוֹן֙ וְ/עָלָ֣ה אַדָּ֔רָ/ה וְ/נָסַ֖ב הַ/קַּרְקָֽעָ/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/003.yaml
  text: Then it went out southward to the ascent of Akrabbim[a], crossed over to Zin, went up from the south to Kadesh-barnea, crossed over Hezron, went up to Addar[b], and turned toward Karka.
translation:
  language: ta
  text: பின்பு அந்த எல்லை தெற்கு நோக்கி அக்ரப்பீம் ஏற்றத்திற்குச்[a] சென்று, சீனை நோக்கிக் கடந்து, தெற்கிலிருந்து காதேஸ்-பர்னேயாவுக்கு ஏறிச் சென்றது.[b] அங்கிருந்து எஸ்ரோனைக் கடந்து, அத்தாருக்கு ஏறிச் சென்று, கர்காவை[c] நோக்கித் திரும்பியது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அக்ரப்பீம்’ என்பதற்கு ‘தேள்கள்’ என்று பொருள் இருக்கலாம்; இங்கு அது இடப்பெயராக வருவதால் ஒலிபெயர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயச் சொற்றொடரை, ‘காதேஸ்-பர்னேயாவின் தெற்குப் பக்கமாக ஏறிச் சென்றது’ என்றும் புரிந்துகொள்ளலாம்.
    reason: alternative_reading
  - marker: c
    text: இந்த இடப்பெயரின் ஒலிப்பு உறுதியற்றது; ‘கர்க்கா’ என்றும் ஒலிபெயர்க்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: וְיָצָא
  choice: பின்பு அந்த எல்லை … சென்றது
  rationale: எல்லை வருணனையில் இந்த வினை முந்தைய இடத்திலிருந்து எல்லைக்கோடு தொடர்வதைக் குறிக்கிறது. தமிழில் வெளிப்படையாகத் தேவையான ‘அந்த எல்லை’ என்பதைக் கூட்டி, இயக்க உருவகத்தை இயல்பாகக் காத்துள்ளோம்.
- source_word: אֶל מִנֶּגֶב
  choice: தெற்கு நோக்கி
  rationale: இது எல்லையின் தென்திசை இயக்கத்தைக் குறிக்கிறது; ‘தெற்கு நோக்கி’ என்பது இயல்பான தமிழிலும் திசைச்சார்ந்த பொருளையும் தருகிறது.
- source_word: לְמַעֲלֵה עַקְרַבִּים
  choice: அக்ரப்பீம் ஏற்றத்திற்கு
  rationale: מַעֲלֵה என்பது ஏறுமிடம் அல்லது கணவாயைக் குறிக்கலாம். நில அமைப்பின் மேல்நோக்கிய இயக்கத்தை நேரடியாகக் காட்ட ‘ஏற்றம்’ தேர்ந்தெடுக்கப்பட்டது; இடப்பெயர் ஒலிபெயர்க்கப்பட்டது.
- source_word: וְעָבַר צִנָה
  choice: சீனை நோக்கிக் கடந்து
  rationale: עבר எல்லைச் சூத்திரங்களில் ஓர் இடத்தை நோக்கி அல்லது அதன் வழியாகக் கடப்பதைக் குறிக்கிறது. இலக்கு நோக்கிய ה ஒட்டின் வலிமையைக் காட்ட ‘நோக்கி’ பயன்படுத்தப்பட்டது.
- source_word: וְעָלָה מִנֶּגֶב לְקָדֵשׁ בַּרְנֵעַ
  choice: தெற்கிலிருந்து காதேஸ்-பர்னேயாவுக்கு ஏறிச் சென்றது
  rationale: மசோரா உரையின் מִן முன்னொட்டு இயல்பாக ‘தெற்கிலிருந்து’ என இயக்கத்தின் தொடக்கத்தைச் சுட்டுகிறது; לְ இலக்கைச் சுட்டுவதால் ‘காதேஸ்-பர்னேயாவுக்கு’ என மொழிபெயர்க்கப்பட்டது. புவியியல் வருணனையில் வேறு புரிதல் சாத்தியமாதலால் அடிக்குறிப்பு தரப்பட்டது.
- source_word: חֶצְרוֹן
  choice: எஸ்ரோன்
  rationale: எபிரெய இடப்பெயர் தமிழில் ஒலிபெயர்க்கப்பட்டது.
- source_word: וְעָלָה אַדָּרָה
  choice: அத்தாருக்கு ஏறிச் சென்று
  rationale: עלה உயர்நோக்கிய இயக்கத்தையும், திசைச் சுட்டும் ה அந்த இடத்தை நோக்கிய இயக்கத்தையும் குறிக்கின்றன.
- source_word: וְנָסַב הַקַּרְקָעָה
  choice: கர்காவை நோக்கித் திரும்பியது
  rationale: נסב எல்லைக்கோடு வளைந்து திசை மாறுவதைச் சுட்டுகிறது. திசைச் சுட்டும் ה காரணமாக, அந்த இடத்தை அடைந்ததாக மிகைப்படுத்தாமல் ‘நோக்கி’ என மொழிபெயர்க்கப்பட்டது.
