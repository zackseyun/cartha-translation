lexical_decisions:
- source_word: וַיַּעַל
  choice: படையெடுத்துச் சென்றார்
  rationale: עלה என்பதன் அடிப்படைப் பொருள் ‘மேலே செல்லுதல்.’ இங்குள்ள போர் சார்ந்த சூழலிலும் אֶל יֹשְׁבֵי என்ற தொடருடனும் அது ஒரு மக்களுக்கு எதிராக முன்னேறிச் செல்வதைக் குறிக்கிறது. இயல்பான தமிழில் ‘படையெடுத்துச் சென்றார்’ அந்தப் பகைமைச் சூழலைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: מִשָּׁם
  choice: அங்கிருந்து
  rationale: முன்னர் குறிப்பிடப்பட்ட இடத்திலிருந்து நிகழும் நகர்வைக் குறிக்கும் இயல்பான நவீனத் தமிழ் வடிவம்.
- source_word: אֶל יֹשְׁבֵי דְּבִר
  choice: தெபீரில் குடியிருந்தவர்களுக்கு எதிராக
  rationale: יֹשְׁבֵי என்பது ‘குடியிருப்பவர்கள்’ என்பதைக் குறிக்கிறது. போர் சார்ந்த சூழலில் אֶל என்பதன் திசைநோக்குப் பொருள் எதிரான முன்னேற்றமாக வெளிப்படுவதால் ‘எதிராக’ சேர்க்கப்பட்டுள்ளது.
- source_word: דְּבִר
  choice: தெபீர்
  rationale: இடப்பெயர் என்பதால் மொழிபெயர்க்காமல் நவீனத் தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: וְשֵׁם דְּבִר לְפָנִים
  choice: தெபீரின் முந்தைய பெயர்
  rationale: לְפָנִים இங்கு காலப்பொருளில் ‘முன்பு’ அல்லது ‘முன்னர்’ என வருகிறது. தமிழில் இயல்பாகவும் சுருக்கமாகவும் ‘முந்தைய பெயர்’ என்று வழங்கப்பட்டுள்ளது.
- source_word: קִרְיַת סֵפֶר
  choice: கீரியாத்-செப்பேர்
  rationale: இது இடப்பெயர் என்பதால் பிரதான உரையில் ஒலிபெயர்க்கப்பட்டுள்ளது. அதன் கூறுகளால் சாத்தியமாகும் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
