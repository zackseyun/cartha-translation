lexical_decisions:
- source_word: בַּשְּׁפֵלָה
  choice: மலைச்சரிவுப் பகுதியில்
  rationale: இச்சொல் யூதாவின் மலைநாட்டுக்கும் கடலோரச் சமவெளிக்கும் இடையிலுள்ள தாழ்ந்த குன்றுப்பகுதியைக் குறிக்கும் புவியியல் வட்டாரப் பெயராக இங்கு வருகிறது. நவீன தமிழில் பொருள் புரியுமாறு ‘மலைச்சரிவுப் பகுதி’ என வழங்கப்பட்டுள்ளது; ‘ஷெஃபெலா’ என்ற ஒலிபெயர்ப்பும் சாத்தியம் என்பதால் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: אֶשְׁתָּאוֹל
  choice: எஸ்தாவோல்
  rationale: ஊர்ப்பெயர் என்பதால் தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: וְצָרְעָה
  choice: சோரா
  rationale: ஊர்ப்பெயர் தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளது. எபிரெயப் பட்டியலில் உள்ள இணைப்பிடைச்சொல் தமிழில் இயல்பான பட்டியல் நடைக்கேற்ப இறுதி உறுப்புக்கு முன் மட்டும் வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: וְאַשְׁנָה
  choice: அஷ்னா
  rationale: ஊர்ப்பெயர் தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளது; இதற்கு முன் வரும் וְ தமிழ்ப் பட்டியலின் நிறைவில் காற்புள்ளியால் இயல்பாகக் குறிக்கப்படுகிறது.
