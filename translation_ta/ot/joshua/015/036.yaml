  naturalness: '‘ஆகியவையும்—அவற்றின் கிராமங்களுடன் மொத்தம் பதினான்கு நகரங்கள்’ என்பது புரியத்தக்கதாக உள்ளது. ஆயினும் பட்டியல்-நடைக்கு ‘...: அவற்றின் கிராமங்களோடு பதினான்கு நகரங்கள்’ என்பது எபிரெய நிறைவு அமைப்பையும் தமிழின் இயல்பையும் சற்றே நேரடியாகக் காக்கிறது.'
  terminology: ‘நகரங்கள்’ மற்றும் ‘கிராமங்கள்’ நிலப்பங்கீட்டுப் பட்டியலுக்குப் பொருத்தமானவை. இடப்பெயர்களை ஒலிபெயர்ப்பாகவே வைத்தல் சரியானது. உரை-எண்ணிக்கைச் சிக்கலைத் தீர்மானமின்றி பதிவு செய்யும் அடிக்குறிப்பு பொருத்தமானது.
