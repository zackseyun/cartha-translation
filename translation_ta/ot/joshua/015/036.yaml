  text: 'and Shaaraim[a], and Adithaim, and Gederah, and Gederothaim: fourteen cities with their villages.'
translation:
  language: ta
  text: 'ஷஅராயிம்[a], அதித்தாயிம், கெதேரா, கெதேரோத்தாயிம்: அவற்றின் கிராமங்களோடு பதினான்கு நகரங்கள்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இந்த வசனத்தில் காணப்படும் நான்கு இடப்பெயர்களும் குறிப்பிடப்பட்டுள்ள ‘பதினான்கு நகரங்கள்’ என்ற மொத்த எண்ணிக்கையும் வெளிப்படையாகப் பொருந்தவில்லை என்று சில ஆய்வாளர்கள் சுட்டிக்காட்டுகின்றனர். இந்த வேறுபாடு இப்பெரும் பகுதியின் பிரதிவரலாற்றால் ஏற்பட்டிருக்கலாம்; எனினும், இங்குள்ள எபிரெய உரை உள்ளபடியே மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: textual_variant
lexical_decisions:
- source_word: שַׁעֲרַיִם
  choice: சாராயிம்
  rationale: இது ஓர் இடப்பெயர் என்பதால் பொருள் மொழிபெயர்ப்பு செய்யாமல், எபிரெய உச்சரிப்பைத் தமிழில் இயன்றவரை இயல்பாக ஒலிபெயர்த்துள்ளது.
- source_word: עֲדִיתַיִם
  choice: அதிதாயிம்
  rationale: இடப்பெயரை எபிரெய வடிவத்துக்கு நெருக்கமாகத் தமிழில் ஒலிபெயர்த்துள்ளது.
- source_word: הַגְּדֵרָה
  choice: கெதேரா
  rationale: எபிரெயில் சுட்டுருபு இருந்தாலும், தமிழில் இடப்பெயருக்கு முன் அதைத் தனியே காட்டுவது இயல்பல்ல; எனவே பெயர் மட்டும் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: גְדֵרֹתָיִם
  choice: கெதேரோத்தாயிம்
  rationale: இடப்பெயரை எபிரெய வடிவத்துக்கு நெருக்கமாகத் தமிழில் ஒலிபெயர்த்துள்ளது.
- source_word: עָרִים
  choice: நகரங்கள்
  rationale: நிலப்பங்கீட்டுப் பட்டியல்களில் நிர்வாக அலகுகளாகக் குறிப்பிடப்படும் குடியிருப்புகளுக்கு வழக்கமான தமிழ் இணைச்சொல்.
- source_word: אַרְבַּע עֶשְׂרֵה
  choice: பதினான்கு
  rationale: எபிரெய எண்ணிக்கையை இயல்பான தமிழில் நேரடியாக வழங்குகிறது.
- source_word: חַצְרֵיהֶן
  choice: அவற்றின் கிராமங்களுடன்
  rationale: இங்கு חָצֵר என்பது பட்டியலிடப்பட்ட நகரங்களைச் சார்ந்த சிற்றூர்கள் அல்லது மதிலற்ற துணைக் குடியிருப்புகளைக் குறிக்கிறது; ‘கிராமங்கள்’ என்பது சாதாரண வாசகருக்குத் தெளிவான இணைச்சொல்.
