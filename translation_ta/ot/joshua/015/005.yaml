  text: And the eastern border was the Salt Sea, as far as the mouth of the Jordan. And the border on the north side was from the tongue of the sea, from the mouth of the Jordan.
translation:
  language: ta
  text: கிழக்கு எல்லை உப்புக் கடலாக, யோர்தான் ஆறு கடலில் கலக்கும் இடம்வரை இருந்தது. வடக்குப் பக்கத்தின் எல்லை, யோர்தான் ஆறு கடலில் கலக்கும் இடத்திலுள்ள கடலின் நாக்கு போன்ற நீளமான பகுதியிலிருந்து தொடங்கியது.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் நேரடியாக “கடலின் நாக்கு” என்று உள்ளது. இது கடலின் நாக்குபோன்ற நீட்சியைக் குறிக்கும் நிலவடிவச் சொல்லாட்சி.
    reason: மூல உருவகத்தை விளக்குகிறது; இதை நிலமுனை அல்லது நிலப்பகுதி என்று தவறாகப் புரிந்துகொள்வதைத் தவிர்க்கிறது.
lexical_decisions:
- source_word: יָם הַמֶּלַח
  choice: உப்புக் கடல்
  rationale: எபிரெயப் பெயரின் நேரடியான, இயல்பான தமிழ் வடிவம்.
- source_word: קְצֵה הַיַּרְדֵּן
  choice: யோர்தானின் கடைமுனை
  rationale: קצה என்பதன் ‘முடிவு/கடைமுனை’ என்ற இடவியல் பொருளைப் பாதுகாக்கிறது; ‘ஆற்றுமுகம்’ என்று விளக்கமாக மட்டும் மாற்றாமல் மூலத்தின் சொல்லாட்சியைத் தக்கவைக்கிறது.
- source_word: לְשׁוֹן הַיָּם
  choice: கடலின் நாக்குப் போன்ற முனை
  rationale: ‘கடலின் நாக்கு’ என்ற எபிரெய நிலவடிவ உருவகத்தைப் பாதுகாத்து, நவீன தமிழ் வாசகருக்குப் பொருள் புரிய ‘போன்ற முனை’ என இயல்பாக்குகிறது.
- source_word: לִפְאַת צָפוֹנָה
  choice: வடக்குப் பக்கத்து
  rationale: எல்லையின் வடப்பக்கத்தைக் குறிக்கும் இயல்பான நவீன தமிழ் வெளிப்பாடு.
