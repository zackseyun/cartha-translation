  text: וְ/חֻמְטָ֗ה וְ/קִרְיַ֥ת אַרְבַּ֛ע הִ֥יא חֶבְר֖וֹן וְ/צִיעֹ֑ר עָרִ֥ים תֵּ֖שַׁע וְ/חַצְרֵי/הֶֽן׃ס
base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/054.yaml
  text: 'Humtah[a], Kiriath-arba (that is, Hebron)[b], and Zior: nine cities with their settlements.'
translation:
  language: ta
  text: ஹும்தா, கீரியாத்-அர்பா (அதாவது, எபிரோன்)[a], சீயோர் ஆகியவை; அவற்றின் குடியிருப்புகளுடன் சேர்த்து ஒன்பது நகரங்கள்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “கீரியாத்-அர்பா, அதுவே எபிரோன்” என்று இவ்விரு பெயர்களும் ஒரே நகரத்தைக் குறிக்கின்றன என்று அடையாளப்படுத்தப்படுகிறது.
    reason: cross_reference
  - marker: b
    text: “அவற்றின் கிராமங்களும்” என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் பட்டியலிடப்பட்ட நகரங்களைச் சார்ந்த சிறிய குடியிருப்புகளைக் குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֻמְטָה
  choice: உம்தா
  rationale: இது ஓர் இடப்பெயர். எபிரெய ஒலிப்புக்கு ஏற்ற வகையில் தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: קִרְיַת אַרְבַּע
  choice: கீரியாத்-அர்பா
  rationale: இது கூட்டமைப்புடைய நிலையான இடப்பெயராக இருப்பதால், பொருளாக்காமல் தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: הִיא חֶבְרוֹן
  choice: அதாவது, எப்ரோன்
  rationale: எபிரெயப் பிரதியில் கீரியாத்-அர்பாவே எப்ரோன் என்று அடையாளப்படுத்தும் விளக்கத் தொடர்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: צִיעֹר
  choice: சீயோர்
  rationale: இது ஓர் இடப்பெயர்; எபிரெய வடிவத்தை அடிப்படையாகக் கொண்டு தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: עָרִים תֵּשַׁע
  choice: ஒன்பது நகரங்கள்
  rationale: עָרִים என்பது நகரங்கள் அல்லது ஊர்களைக் குறிக்கலாம்; நிலப்பங்கீட்டுப் பட்டியலின் சூழலில் ‘நகரங்கள்’ என்பது தெளிவான மரபான தெரிவாகும்.
- source_word: חַצְרֵיהֶן
  choice: அவற்றைச் சார்ந்த குடியிருப்புகள்
  rationale: முதன்மை நகரங்களோடு தொடர்புடைய சிறிய அல்லது புறக் குடியிருப்புகளை இச்சொல் குறிக்கலாம். அவற்றின் சார்புநிலையை ‘சார்ந்த’ என்பது தெளிவாக்குகிறது; குடியிருப்புகளின் துல்லிய வகையை நிர்ணயிக்கவில்லை.
