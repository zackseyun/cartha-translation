translation_notes:
  register: நவீனத் தரத் தமிழில், நிலப்பங்கீட்டுப் பட்டியலுக்கேற்ற சுருக்கமான மற்றும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. இடப்பெயர்கள் மூல எபிரெய வடிவங்களிலிருந்து ஒலிபெயர்க்கப்பட்டுள்ளன; வசனத்தின் பட்டியல் அமைப்பு இயல்பான தமிழில் பேணப்பட்டுள்ளது.
