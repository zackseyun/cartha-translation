revisions:
- from: உம்தா, கீரியாத்-அர்பா (அதாவது, எப்ரோன்)[a], சீயோர் ஆகிய ஒன்பது நகரங்களும் அவற்றைச் சார்ந்த குடியிருப்புகளும்.[b]
  to: ஹும்தா, கீரியாத்-அர்பா (அதாவது, எபிரோன்)[a], சீயோர் ஆகியவை; அவற்றின் குடியிருப்புகளுடன் சேர்த்து ஒன்பது நகரங்கள்[b].
  rationale: The revision removes an unsupported chronological inference from footnote a, improves transliteration of Humtah and the familiar Tamil form of Hebron, and makes the Hebrew list-and-total construction more natural in modern standard Tamil. The sense of dependent settlements and the stated total remain unchanged.
