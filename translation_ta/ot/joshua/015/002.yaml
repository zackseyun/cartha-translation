  yaml_path: translation/ot/joshua/015/002.yaml
  text: Their southern border was from the end of the Salt Sea[b][a], from the tongue that faces southward.
translation:
  language: ta
  text: அவர்களுடைய தெற்கு எல்லை உப்புக் கடலின்[a] கடைமுனையில் உள்ள, தெற்குநோக்கிய நாவிலிருந்து[b] இருந்தது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அதாவது, சவக்கடல்.
    reason: cross_reference
  - marker: b
    text: எபிரெயத்தில் சொல்லுக்கு சொல், “நாவிலிருந்து”; இது நாவைப் போன்ற வடிவமுள்ள வளைகுடா அல்லது நீர்நுழைவைக் குறிக்கும் நிலவியல் சொல்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי לָהֶם
  choice: அவர்களுடைய ... தொடங்கியது
  rationale: எல்லையை அறிமுகப்படுத்தும் எபிரெய உரிமைத் தொடரை இயல்பான தமிழில் உரிமை அமைப்பாகத் தருகிறது; தொடர்ந்து வரும் מִן தொடக்கப் புள்ளியைக் குறிப்பதால் ‘தொடங்கியது’ என்பது சூழலுக்குப் பொருந்துகிறது.
- source_word: גְּבוּל נֶגֶב
  choice: தெற்கு எல்லை
  rationale: נֶגֶב இங்கு நெகேப் என்ற இடப்பெயராக அல்லாமல் திசையைக் குறிக்கிறது; ‘தெற்கு எல்லை’ இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: מִקְצֵה
  choice: கடைமுனையிலிருந்து
  rationale: எல்லை தொடங்கும் புவியியல் முனைப்புள்ளியைச் சுட்டும் ‘முடிவு/கோடி’ என்ற பொருளைத் தெளிவாகக் கடத்துகிறது.
- source_word: יָם הַמֶּלַח
  choice: உப்புக் கடல்
  rationale: மூல எபிரெயப் பெயரின் நேரடியான பொருளைப் பாதுகாக்கிறது; வழக்கமான ‘சவக்கடல்’ பெயர் குறிப்பில் தரப்படுகிறது.
- source_word: מִן הַלָּשׁוֹן
  choice: நாவிலிருந்து
  rationale: לָשׁוֹן என்பதன் உருவகமான நிலவியல் சொல்லாட்சியைத் தமிழிலும் பாதுகாக்கிறது; அதன் புவியியல் பொருள் குறிப்பில் விளக்கப்படுகிறது.
- source_word: הַפֹּנֶה נֶגְבָּה
  choice: தென்நோக்கிய
  rationale: அந்த நிலவியல் அமைப்பின் தெற்கு நோக்கிய திசையமைவைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
