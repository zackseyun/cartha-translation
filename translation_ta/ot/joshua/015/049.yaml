base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/049.yaml
  text: and Dannah[a], and Kiriath-sannah (that is, Debir),
translation:
  language: ta
  text: தன்னா, கிரியாத்-சன்னா (அதாவது, தேபீர்),
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: דַנָּה
  choice: தன்னா
  rationale: ஓர் இடப்பெயர் என்பதால் மொழிபெயர்க்காமல், எபிரெய உச்சரிப்புக்கு அண்மையாக ஒலிபெயர்க்கப்பட்டது.
- source_word: קִרְיַת סַנָּה
  choice: கிரியாத்-சன்னா
  rationale: கூட்டு இடப்பெயரின் வடிவத்தைப் பாதுகாக்க இரு கூறுகளும் ஒலிபெயர்க்கப்பட்டு இடைக்கோட்டுடன் இணைக்கப்பட்டன; முதல் கூறை ‘சன்னாவின் நகரம்’ என்று பொருளாக்குவது இடப்பெயரின் வடிவத்தை மறைத்துவிடும்.
- source_word: הִיא
  choice: அதாவது
  rationale: ஒரே இடத்திற்குரிய இரு பெயர்களை அடையாளப்படுத்தும் இச்சூழலில், இயல்பான தமிழில் சமன்பாட்டைத் தெளிவாகக் காட்டுகிறது.
- source_word: דְבִר
  choice: தெபீர்
  rationale: கிரியாத்-சன்னா என்ற இடத்தின் மற்றொரு பெயராக வரும் இடப்பெயர்; எபிரெய வடிவுக்கு அண்மையாக ஒலிபெயர்க்கப்பட்டது.
- source_word: וְ
  choice: பட்டியலின் தொடர்ச்சியாக காற்புள்ளி
  rationale: எபிரெய வாவ் நகரப் பட்டியலின் இணைப்பைக் குறிக்கிறது. தனி வசனமாக வாசிக்கும்போதும் இயல்பான தமிழ் பட்டியல் நடையைப் பேண, ஒவ்வொரு ‘மற்றும்’ என்பதற்குப் பதிலாக நிறுத்தக்குறியால் தொடர்ச்சி காட்டப்பட்டது.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழில், வேதாகம இடப்பெயர்களுக்கேற்ற கண்ணியமான ஒலிபெயர்ப்பு நடை பயன்படுத்தப்பட்டது. இது நகரங்களின் பட்டியலில் ஒரு தொடர்ச்சிப் பகுதி என்பதால் வசனம் காற்புள்ளியுடன் முடிகிறது.
