base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/044.yaml
  text: 'Keilah[a], Achzib, and Mareshah: nine cities with their villages.'
translation:
  language: ta
  text: கெயிலா, அக்சீப், மரேஷா—அவற்றைச் சேர்ந்த கிராமங்களுடன்[a] மொத்தம் ஒன்பது நகரங்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அவற்றைச் சேர்ந்த குடியிருப்புகளுடன்.’ எபிரெயச் சொல் ஒரு நகரத்தைச் சார்ந்த கிராமப்புறக் குடியிருப்புகளைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: קְעִילָה
  choice: கேயிலா
  rationale: இது ஓர் இடப்பெயர்; எபிரெய உச்சரிப்பைத் தமிழில் இயல்பாக ஒலிபெயர்த்துள்ளது.
- source_word: אַכְזִיב
  choice: அக்சீப்
  rationale: இது ஓர் இடப்பெயர்; தமிழில் வாசிக்க ஏற்ற வகையில் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: מָרֵאשָׁה
  choice: மரேஷா
  rationale: இது ஓர் இடப்பெயர்; மூலமொழியின் ஒலிக்கு நெருக்கமாகத் தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: עָרִים
  choice: நகரங்கள்
  rationale: நிலப்பகுதிப் பட்டியலில் நிர்வாக மையங்களாகக் குறிப்பிடப்படும் குடியிருப்புகளைக் குறிக்கும் வழக்கமான சொல்.
- source_word: תֵּשַׁע
  choice: ஒன்பது
  rationale: நகரங்களின் மொத்த எண்ணிக்கையைக் குறிக்கும் எண்ணுப்பெயர் நேரடியாகத் தரப்பட்டுள்ளது.
- source_word: חַצְרֵיהֶן
  choice: அவற்றைச் சேர்ந்த கிராமங்கள்
  rationale: நகரங்களைச் சார்ந்த புறநிலக் குடியிருப்புகள் அல்லது மதிலற்ற சிற்றூர்களைக் குறிக்கிறது; இந்த உறவைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்க இவ்வாறு மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: וְ
  choice: பட்டியல் இணைப்பு மற்றும் ‘உடன்’
  rationale: எபிரெயத்தில் மீண்டும் வரும் இணைப்புகள், இயல்பான தமிழ் பட்டியல் அமைப்பிலும் ‘கிராமங்களுடன்’ என்ற வடிவிலும் வெளிப்படுத்தப்பட்டுள்ளன.
