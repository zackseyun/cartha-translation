translation_notes:
  register: நவீன தரமான தமிழில், நிலப்பகுதிப் பட்டியலுக்குரிய சுருக்கத்தையும் கண்ணியத்தையும் காக்கும் நடை. எபிரெயச் சொற்றொடரின் எண்ணிக்கைச் சுருக்கத்தை இயல்பாக்க ‘மொத்தம்’ சேர்க்கப்பட்டுள்ளது; புதிய தகவல் எதுவும் சேர்க்கப்படவில்லை.
