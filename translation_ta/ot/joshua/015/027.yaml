lexical_decisions:
- source_word: חֲצַר גַּדָּה
  choice: அசார்-கத்தா
  rationale: யூதாவின் நிலப்பகுதிப் பட்டியலில் வரும் இடப்பெயர் என்பதால் பொருள் மொழிபெயர்ப்பு செய்யாமல், எபிரெய ஒலிப்புக்கு நெருக்கமாகத் தமிழில் எழுத்துப்பெயர்க்கப்பட்டது. கூட்டுப் பெயர் என்பதைத் தெளிவாக்க இடைக்கோடு பயன்படுத்தப்பட்டது.
- source_word: חֶשְׁמוֹן
  choice: எஸ்மோன்
  rationale: இடப்பெயர் என்பதால் எபிரெய ஒலிப்பை அடிப்படையாகக் கொண்டு தமிழில் எழுத்துப்பெயர்க்கப்பட்டது.
- source_word: בֵית פָּלֶט
  choice: பெத்-பாலேத்
  rationale: ‘பாலேத்தின் வீடு’ என்று பொருள் மொழிபெயர்க்காமல், இடப்பெயராக எழுத்துப்பெயர்க்கப்பட்டது; கூட்டுப் பெயர் என்பதைச் சுட்ட இடைக்கோடு இடப்பட்டது.
- source_word: וְ / וּ
  choice: பட்டியலின் இறுதியில் இயல்பான தமிழ் நிறுத்தக்குறி அமைப்பு
  rationale: எபிரெய இணைப்பிடைச்சொற்கள் பெயர்களை ஒருங்கிணைக்கின்றன. நவீன தமிழில் மூன்று பெயர்களைக் கொண்ட பட்டியல் இயல்பாக அமைய காற்புள்ளிகளும் இறுதியில் முற்றுப்புள்ளியும் பயன்படுத்தப்பட்டன; தனியான ‘மற்றும்’ சேர்க்கப்படவில்லை.
theological_decisions: []
