- source_word: סַנְסַנָּה
  choice: சன்சன்னா
  rationale: இது ஓர் இடப்பெயர்; எபிரெய வடிவின் ஒலியை நவீனத் தமிழில் இயல்பாகப் பிரதிபலிக்கும் வகையில் ஒலிபெயர்த்துள்ளது.
- source_word: וְ
  choice: ஆகிய
  rationale: இடப்பெயர்ப் பட்டியலின் இறுதி உறுப்பை இணைக்கும் எபிரெய இணைப்புச்சொல்; தனித்த வசனமாக வாசிக்கும்போது இது ஊர்களின் பட்டியல் என்பதைத் தமிழில் இயல்பாகத் தெரிவிக்க ‘ஆகிய ஊர்கள்’ என வழங்கப்பட்டுள்ளது.
