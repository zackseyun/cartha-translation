  rationale: இது ஓர் இடப்பெயர்; எபிரெய ஒலிப்பை இயன்றவரை இயல்பான தமிழ் எழுத்துகளில் ஒலிபெயர்த்துள்ளது.
- source_word: מַדְמַנָּה
