lexical_decisions:
- source_word: מָעוֹן
  choice: மாவோன்
  rationale: குடியிருப்புப் பட்டியலின் சூழலில் இது பொதுப்பெயர் அல்ல, ஓர் இடப்பெயர்; எனவே பொருளாக்காமல் தமிழில் ஒலிபெயர்க்கப்பட்டது.
- source_word: כַּרְמֶל
