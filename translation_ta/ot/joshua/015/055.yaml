- source_word: וָזִיף
  choice: சீப்
  rationale: வாவ் இணைப்புடன் வரும் זִיף என்ற இடப்பெயர்; பட்டியலின் தமிழ்நடையில் இணைப்பு இறுதிப் பெயருக்கு முன் இயல்பாக வெளிப்படுத்தப்பட்டதால் பெயர் மட்டும் இங்கு ஒலிபெயர்க்கப்பட்டது.
- source_word: וְיוּטָּה
  choice: யூத்தா
  rationale: வாவ் இணைப்புடன் வரும் יוּטָּה என்ற இடப்பெயர்; மசோரா உரையின் மெய்யெழுத்து இரட்டிப்பை பிரதிபலிக்கும் வகையில் ‘யூத்தா’ என ஒலிபெயர்க்கப்பட்டது.
