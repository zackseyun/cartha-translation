translation:
  language: ta
  text: 'நிப்சான், உப்பு நகரம், என்கேதி: ஆறு நகரங்களும் அவற்றைச் சேர்ந்த குடியிருப்புகளும்.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “குடியிருப்புகள்” என்பதற்குப் பதிலாக “கிராமங்கள்” என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல், பட்டியலிடப்பட்ட நகரங்களைச் சார்ந்த சிறிய இடங்களைக் குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנִּבְשָׁן
  choice: நிப்சான்
  rationale: இது ஓர் இடப்பெயர்; எபிரெய வடிவிலுள்ள முன்னொட்டுக் குறிப்பைத் தனியே மொழிபெயர்க்காமல், தமிழில் இயல்பான ஒலிபெயர்ப்பாக வழங்கப்பட்டுள்ளது.
- source_word: עִיר הַמֶּלַח
  choice: உப்பு நகரம்
  rationale: ‘உப்பின் நகரம்’ என்ற பொருளுடைய வெளிப்படையான எபிரெய இடப்பெயரை, தமிழில் இயல்பாகவும் அதன் பொருளைக் காக்குமாறும் மொழிபெயர்க்கிறது.
- source_word: עֵין גֶּדִי
  choice: என்கேதி
  rationale: நிலையான இடப்பெயராக இருப்பதால் அதன் சொற்பொருளான ‘வெள்ளாட்டுக்குட்டியின் ஊற்று’ என்று மொழிபெயர்க்காமல் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: עָרִים שֵׁשׁ
  choice: ஆறு நகரங்கள்
  rationale: பட்டியலிடப்பட்ட இடங்களின் எண்ணிக்கையைச் சுருக்கிக் கூறும் நேரடியான சொற்றொடர்; עָרִים என்பதற்கு இத்தகைய நிலப்பகுதிப் பட்டியலில் ‘நகரங்கள்’ பொருத்தமானது.
- source_word: חַצְרֵיהֶן
  choice: அவற்றைச் சேர்ந்த குடியிருப்புகள்
  rationale: முதன்மை நகரங்களுடன் தொடர்புடைய சிறிய, சார்ந்த இடங்களைக் குறிக்கிறது; ‘குடியிருப்புகள்’ என்பது அவற்றின் துல்லியமான அளவையோ நிர்வாக நிலையையோ தேவையின்றி வரையறுக்காத பரந்த நவீனச் சொல்.
- source_word: וְ
  choice: -உம் / மற்றும்
  rationale: மீண்டும் வரும் இணைப்புச் சொல் பட்டியலின் கூறுகளை இணைக்கிறது; தமிழின் இயல்பான எண்ணும்மை அமைப்பில் ‘-உம்’ வழியாக வெளிப்படுத்தப்பட்டுள்ளது.
