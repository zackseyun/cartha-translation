translation_notes:
  register: நவீனத் தரத் தமிழில், நில எல்லை வருணனை தெளிவாகப் பின்தொடரக் கூடிய வகையில் எழுதப்பட்டுள்ளது. இடப்பெயர்கள் மொழிபெயர்க்கப்படாமல் ஒலிபெயர்க்கப்பட்டுள்ளன; வாக்கிய ஓட்டத்திற்காக நீண்ட எபிரெயத் தொடர்ச்சி இரண்டு வாக்கியங்களாகப் பிரிக்கப்பட்டுள்ளது. அடிக்குறி குறியீடு அது விளக்கும் ‘மேற்கு நோக்கி’ என்ற சொற்றொடருக்குப் பின்பே வைக்கப்பட்டுள்ளது.
