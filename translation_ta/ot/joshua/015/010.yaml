  text: וְ/נָסַב֩ הַ/גְּב֨וּל מִ/בַּעֲלָ֥ה יָ֨מָּ/ה֙ אֶל הַ֣ר שֵׂעִ֔יר וְ/עָבַ֕ר אֶל כֶּ֧תֶף הַר יְעָרִ֛ים מִ/צָּפ֖וֹנָ/ה הִ֣יא כְסָל֑וֹן וְ/יָרַ֥ד בֵּֽית שֶׁ֖מֶשׁ וְ/עָבַ֥ר תִּמְנָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/010.yaml
  text: Then the border turned from Baalah westward to Mount Seir[a], passed along to the northern slope of Mount Jearim (that is, Chesalon), went down to Beth-shemesh, and passed on to Timnah.
translation:
  language: ta
  text: 'பின்பு, எல்லை பாலாவிலிருந்து மேற்கு நோக்கி[a] சேயீர் மலையை நோக்கித் திரும்பி, யெயாரீம் மலையின் வடக்குச் சரிவைக் கடந்து சென்றது (அதாவது, கெசலோன்). அது பெத்-ஷெமேஷுக்கு இறங்கி, திம்னாவையும் கடந்து சென்றது.


    [a] எபிரெயத்தில், “கடலை நோக்கி”; இஸ்ரயேல் நாட்டின் புவியியல் சூழலில் இது “மேற்கு நோக்கி” என்பதைக் குறிக்கும்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “கடலை நோக்கி”; இஸ்ரயேல் நாட்டின் புவியியல் சூழலில் இது “மேற்கு நோக்கி” என்பதைக் குறிக்கும்.
    reason: ‘கடலை நோக்கி’ என்ற மூலமொழிப் படிமத்தையும் அதன் திசைப் பொருளையும் ஒருங்கே தெரிவிக்கிறது.
lexical_decisions:
- source_word: וְנָסַב
  choice: திரும்பி
  rationale: எல்லை வருணனையில் எல்லைக்கோடு திசை மாறுவதைக் குறிக்கிறது; இயல்பான தமிழில் ‘திரும்பி’ அந்தப் புவியியல் பொருளைப் பாதுகாக்கிறது.
- source_word: הַגְּבוּל
  choice: எல்லை
  rationale: நிலப்பகுதியின் வரம்பைக் குறிக்கும் வழக்கமான, தெளிவான தமிழ்ச் சொல்.
- source_word: מִבַּעֲלָה
  choice: பாலாவிலிருந்து
  rationale: இடப்பெயர் ஒலிபெயர்க்கப்பட்டு, מן முன்னொட்டின் புறப்படும் இடப் பொருள் ‘-இலிருந்து’ என வழங்கப்பட்டுள்ளது.
- source_word: יָמָּה
  choice: மேற்கு நோக்கி
  rationale: சொல்லெழுத்தாக ‘கடலை நோக்கி’ என்றாலும், இஸ்ரயேல் நாட்டின் புவியியல் சூழலில் இது மேற்குத் திசையைக் குறிக்கும் வழக்குச் சொல்; நேரடிப் படிமம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
- source_word: אֶל הַר שֵׂעִיר
  choice: சேயீர் மலைக்கு
  rationale: הַר இங்கு எல்லைக் குறியிடமான மலையைக் குறிக்கிறது; சேயீர் என்பது இடப்பெயராக ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: וְעָבַר
  choice: கடந்து சென்றது
  rationale: எல்லைக்கோடு ஒரு நில அமைப்பின் வழியாக அல்லது அதை ஒட்டிச் செல்வதைச் சூழலுக்கு ஏற்றவாறு தெரிவிக்கிறது.
- source_word: אֶל כֶּתֶף
  choice: சரிவை
  rationale: כֶּתֶף என்பதன் அடிப்படைப் படிமம் ‘தோள்/பக்கம்’; மலையமைப்பைக் குறிக்கும் இச்சூழலில் இயல்பான புவியியல் தமிழ் ‘சரிவு’ ஆகும்.
- source_word: הַר יְעָרִים
  choice: யெயாரீம் மலை
  rationale: பெயரின் பொருளை மொழிபெயர்க்காமல், இடப்பெயராக ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: מִצָּפוֹנָה
  choice: வடக்குச் சரிவு
  rationale: כֶּתֶף உடன் இணைந்து மலையின் வடக்குப் பக்கம் அல்லது சரிவைக் குறிக்கிறது.
- source_word: הִיא כְסָלוֹן
  choice: (அதாவது, கெசலோன்)
  rationale: முந்தைய நிலக்குறியை விளக்கமாக அடையாளப்படுத்தும் சொற்றொடர் என்பதால் அடைப்புக்குறிக்குள் இயல்பாக வழங்கப்பட்டுள்ளது; எபிரெயத்தின் சுருக்கமான அடையாளப்படுத்தல் பாதுகாக்கப்படுகிறது.
- source_word: וְיָרַד
  choice: இறங்கி
  rationale: எல்லை உயரமான பகுதியிலிருந்து கீழ்நோக்கிச் செல்வதைத் தெரிவிக்கும் நிலவியல் வினை.
- source_word: בֵּית שֶׁמֶשׁ
  choice: பெத்-ஷெமேஷ்
  rationale: இடப்பெயர் அதன் எபிரெய ஒலியமைப்புக்கு நெருக்கமாக ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: תִּמְנָה
  choice: திம்னாவுக்கு
  rationale: இறுதியில் உள்ள திசைச் சுட்டும் -ה வடிவம் செல்லும் இலக்கை உணர்த்துவதால் ‘-வுக்கு’ என வழங்கப்பட்டுள்ளது.
