lexical_decisions:
- source_word: צְנָן
  choice: செனான்
  rationale: யூதாவின் நகரப் பட்டியலில் வரும் இடப்பெயர் என்பதால், பொருள் மொழிபெயர்ப்பு செய்யாமல் எபிரெய ஒலிப்புக்கு நெருக்கமாகத் தமிழில் எழுத்துப்பெயர்க்கப்பட்டது.
- source_word: חֲדָשָׁה
  choice: அதாசா
  rationale: இந்தச் சொல் ‘புதியது’ என்ற பொருளுடைய பெயரடையுடன் தொடர்புடையதாயினும், இங்கு நகரப் பெயராகச் செயல்படுவதால் இடப்பெயராகவே எழுத்துப்பெயர்க்கப்பட்டது.
- source_word: מִגְדַּל גָּד
  choice: மிக்தல்-காத்
  rationale: இது கூட்டு இடப்பெயர். מִגְדָּל என்பதற்கு ‘கோபுரம்’ என்று பொருள் இருந்தாலும், நகரப் பட்டியலில் நிலையான இடப்பெயராக வருவதால் எழுத்துப்பெயர்க்கப்பட்டு, கூறுகளின் இணைவு இடைக்கோட்டால் காட்டப்பட்டது.
- source_word: וַ / וּ
  choice: பட்டியல் நிறுத்தக்குறிகள்
  rationale: எபிரெயத்தில் பெயர்களை இணைக்கும் வாவ் இணைப்புச் சொற்கள் உள்ளன. இயல்பான நவீனத் தமிழ் நகரப் பட்டியலில் அவற்றைத் தனித்தனியாக ‘மற்றும்’ என்று மீண்டும் கூறாமல் காற்புள்ளிகளால் இணைப்பது தெளிவாகவும் இயல்பாகவும் உள்ளது.
