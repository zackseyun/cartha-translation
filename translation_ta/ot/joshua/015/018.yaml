translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘தூண்டினாள்’ என்ற சொல் மூலத்தின் பலபொருள் தன்மையை வைத்திருக்கிறது; எதிர்மறை நிழல் கட்டாயப்படுத்தப்படவில்லை. ‘சட்டென்று’ என்பது צנח-இன் சாத்தியமான திடீர் இறக்க நிழலை முதன்மை உரையில் காட்டுகிறது; மிதமான மாற்று அடிக்குறிப்பில் தரப்பட்டுள்ளது.
