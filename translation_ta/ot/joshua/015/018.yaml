base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/018.yaml
  text: And when she came[a], she urged him to ask her father for a field. Then she got down from the donkey, and Caleb said to her[c][b], “What do you want?”
translation:
  language: ta
  text: அவள் வந்தபோது, தன் தந்தையிடம் ஒரு வயலைக் கேட்கும்படி அவனைத் தூண்டினாள்.[a] பின்பு அவள் கழுதையிலிருந்து இறங்கினாள்.[b] காலேப் அவளிடம், “உனக்கு என்ன வேண்டும்?” என்று கேட்டான்.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அவனை இணங்கச் செய்தாள்” அல்லது, இன்னும் எதிர்மறையான பொருளில், “அவனைத் தூண்டிவிட்டாள்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “அவள் கழுதையிலிருந்து இறங்கினாள்” என்றும் மொழிபெயர்க்கலாம்; எபிரெய வினைச்சொல் திடீரென இறங்கியதைக் குறிக்கக்கூடும்.
    reason: lexical_alternative
  - marker: c
    text: எபிரெய மரபுத்தொடரைச் சொல்லுக்கு சொல் மொழிபெயர்த்தால், “உனக்கு என்ன?” என்பதாகும்; இதற்கு “உனக்கு என்ன வேண்டும்?” அல்லது “உனக்கு என்ன கவலை?” என்று பொருள் கொள்ளலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּבוֹאָהּ
  choice: அவள் வந்தபோது
  rationale: ב prefixed infinitive construct with 3fs suffix forms a temporal clause. இலக்கைக் குறிப்பிடாமல் எபிரெய உரையின் காலப் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: וַתְּסִיתֵהוּ
  choice: அவனைத் தூண்டினாள்
  rationale: סות என்பதற்கு தூண்டுதல், வற்புறுத்துதல், இணங்கச் செய்தல் ஆகிய பொருள் நிழல்கள் உள்ளன. இங்கு எதிர்மறை நோக்கத்தைச் சேர்க்காமல், அவள் அவனைச் செயல்படத் தூண்டியதை இது காட்டுகிறது.
- source_word: לִשְׁאוֹל מֵאֵת אָבִיהָ שָׂדֶה
  choice: தன் தந்தையிடம் ஒரு வயலைக் கேட்கும்படி
  rationale: שאל-இன் வேண்டுதல் பொருளையும், מאת குறிக்கும் அணுகப்படும் நபரையும், שדה-யின் பொதுவான ‘வயல்’ பொருளையும் இயல்பான தமிழ் வாக்கிய அமைப்பில் பாதுகாக்கிறது.
- source_word: וַתִּצְנַח מֵעַל הַחֲמוֹר
  choice: அவள் கழுதையிலிருந்து சட்டென்று இறங்கினாள்
  rationale: צנח சாதாரணமாக இறங்குவதை மட்டுமல்லாமல் திடீர் அல்லது விரைவான இறக்கத்தையும் உணர்த்தக்கூடும். ‘சட்டென்று’ அந்தச் சாத்தியமான உயிரோட்டத்தை அளவுக்கு மீறாமல் வெளிப்படுத்துகிறது.
- source_word: מַה לָּךְ
  choice: உனக்கு என்ன வேண்டும்?
  rationale: சொல்லுக்கு சொல் ‘உனக்கு என்ன?’ என்ற இந்த எபிரெய மரபுத்தொடர், சூழலில் அவளுடைய வேண்டுகோள் என்ன என்பதை வினவுகிறது. எனவே நவீன தமிழில் இயல்பாக இவ்வாறு தரப்படுகிறது.
