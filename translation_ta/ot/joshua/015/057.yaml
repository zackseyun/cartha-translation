  text: 'Hak-kain[a], Gibeah, and Timnah: ten cities with their settlements.'
translation:
  language: ta
  text: ஹக்காயின், கிபெயா, திம்னா ஆகிய பத்துப் பட்டணங்களும் அவற்றைச் சேர்ந்த குடியிருப்புகளும்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவற்றைச் சேர்ந்த கிராமங்களும்.” இங்குள்ள எபிரெயச் சொல், பெயரிடப்பட்ட பட்டணங்களைச் சார்ந்த சிறிய குடியிருப்புகளைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַקַּיִן
  choice: ஹக்காயீன்
  rationale: பட்டணப் பெயர் என்பதால் ஒலிபெயர்க்கப்பட்டது; எபிரெய வடிவில் இணைந்துள்ள முன்னொட்டு பெயரின் ஒரு பகுதியாகத் தக்கவைக்கப்பட்டது.
- source_word: גִּבְעָה
  choice: கிபெயா
  rationale: பட்டணப் பட்டியலில் வரும் இடப்பெயர்; ‘மேடு’ என்று பொருளாக்காமல் ஒலிபெயர்ப்பது ஏற்றது.
- source_word: תִמְנָה
  choice: திம்னா
  rationale: யூதாவின் பங்குப் பட்டியலில் வரும் இடப்பெயர் என்பதால் ஒலிபெயர்க்கப்பட்டது.
- source_word: עָרִים עֶשֶׂר
  choice: பத்துப் பட்டணங்கள்
  rationale: பட்டியலின் நகர்ப்புற இடங்களை எண்ணிக் கூறும் எபிரெய சுருக்கச் சொற்றொடரை இயல்பான தமிழில் தருகிறது.
- source_word: חַצְרֵיהֶן
  choice: அவற்றைச் சேர்ந்த குடியிருப்புகள்
  rationale: பெயரிடப்பட்ட பட்டணங்களைச் சார்ந்த சிறிய அல்லது துணைக் குடியிருப்புகளைக் குறிக்கும்; அவை கட்டாயமாகக் கிராமங்கள் என்று வரையறுக்கப்படாததால் பரந்த பொருளுள்ள சொல் தேர்ந்தெடுக்கப்பட்டது.
