source:
  edition: WLC
  text: וַ/יֹּ֤רֶשׁ מִ/שָּׁם֙ כָּלֵ֔ב אֶת שְׁלוֹשָׁ֖ה בְּנֵ֣י הָ/עֲנָ֑ק אֶת שֵׁשַׁ֤י וְ/אֶת אֲחִימַן֙ וְ/אֶת תַּלְמַ֔י יְלִידֵ֖י הָ/עֲנָֽק־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/014.yaml
  text: 'And Caleb drove out from there the three sons of Anak: Sheshai[a], Ahiman, and Talmai[b], the children of Anak.'
translation:
  language: ta
  text: காலேப் அங்கிருந்து ஆனாக்கின் மூன்று மகன்களாகிய சேசாய், அகீமான், தல்மாய் ஆகியோரைத் துரத்தினார்; அவர்கள் ஆனாக்கின் வழித்தோன்றல்களானவர்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּרֶשׁ
  choice: துரத்திவிட்டார்
  rationale: ஹிஃபில் வடிவிலுள்ள ירשׁ, முந்தைய குடியிருப்பாளர்களை வெளியேற்றி அவர்களுடைய உடைமையைப் பறிப்பதைக் குறிக்கலாம். இங்கு மனிதர்கள் நேரடிப் பொருளாக வருவதால், இயல்பான தமிழில் ‘துரத்திவிட்டார்’ பொருத்தமானது.
- source_word: מִשָּׁם
  choice: அங்கிருந்து
  rationale: இடத்தைக் குறிக்கும் எபிரெயச் சொற்றொடரின் நேரடியான, இயல்பான தமிழ் வடிவம்.
- source_word: שְׁלוֹשָׁה בְּנֵי הָעֲנָק
  choice: ஆனாக்கின் மூன்று மகன்களாகிய
  rationale: בְּנֵי என்பதன் குடும்ப உறவைக் காட்டும் ‘மகன்கள்’ என்ற பொருளைப் பாதுகாக்கிறது; தொடர்ந்து மூன்று நபர்களின் பெயர்கள் வருவதற்கும் ஏற்றது.
- source_word: שֵׁשַׁי
  choice: சேசாய்
  rationale: எபிரெயத் தனிப்பெயரின் தமிழ் ஒலிபெயர்ப்பு.
- source_word: אֲחִימַן
  choice: அகீமான்
  rationale: எபிரெயத் தனிப்பெயரின் தமிழ் ஒலிபெயர்ப்பு.
- source_word: תַּלְמַי
  choice: தல்மாய்
  rationale: எபிரெயத் தனிப்பெயரின் தமிழ் ஒலிபெயர்ப்பு.
- source_word: יְלִידֵי הָעֲנָק
  choice: இவர்கள் ஆனாக்கின் வழித்தோன்றல்கள்
  rationale: ‘ஆனாக்கிடம் பிறந்தவர்கள்’ என்ற வம்சத் தொடர்பை இயல்பான தமிழில் தெரிவிக்கிறது; முன் வந்த ‘மகன்கள்’ என்பதுடன் தேவையற்ற சொல்லுரு மறுபடியும் வருவதைத் தவிர்க்கிறது.
