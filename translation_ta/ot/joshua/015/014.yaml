translation_notes:
  register: நவீன தரத் தமிழில், கண்ணியமானதும் பொதுவாசகர்களுக்கு எளிதில் புரியத்தக்கதுமான நடை. மூலத்தின் இரண்டு தொடர்புடைய வம்சக் குறிப்புகளும் தனித்தனியாகப் பாதுகாக்கப்பட்டுள்ளன.
