lexical_decisions:
- source_word: חַלְחוּל
  choice: அல்கூல்
  rationale: யூதாவின் மலைநாட்டுப் பட்டியலில் வரும் இடப்பெயர்; எபிரேய ஒலிப்புக்கு நெருக்கமாகத் தமிழில் ஒலிபெயர்க்கப்பட்டது.
- source_word: בֵּית צוּר
  choice: பெத்-சூர்
  rationale: கூட்டுப்பெயரான இடப்பெயர் என்பதால் பொருளாக்காமல், அதன் கூறுகளைக் காட்டும் இணைப்புக்குறியுடன் ஒலிபெயர்க்கப்பட்டது.
- source_word: וּ/גְדוֹר
  choice: கெதோர்
  rationale: וּ பட்டியலின் இறுதி இணைப்பைக் குறிக்கிறது; தமிழில் இயல்பான பட்டியல் அமைப்புக்காக ‘ஆகிய’ பயன்படுத்தப்பட்டது. גְדוֹר இடப்பெயராக ஒலிபெயர்க்கப்பட்டது.
