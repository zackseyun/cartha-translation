  text: וַ/יְהִ֣י הַ/גּוֹרָ֗ל לְ/מַטֵּ֛ה בְּנֵ֥י יְהוּדָ֖ה לְ/מִשְׁפְּחֹתָ֑/ם אֶל גְּב֨וּל אֱד֧וֹם מִדְבַּר צִ֛ן נֶ֖גְבָּ/ה מִ/קְצֵ֥ה תֵימָֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/001.yaml
  text: And the lot for the tribe of the sons of Judah[a], according to their clans, was to the border of Edom, to the wilderness of Zin, southward[c][b], at the farthest south.
translation:
  language: ta
  text: யூதாவின் சந்ததியினரான கோத்திரத்திற்கு[b], அவர்களுடைய குலங்களின்படி, சீட்டுப்பங்கு[a] ஏதோமின் எல்லைவரை, தெற்கே உள்ள சீன் வனாந்தரம்வரை, தெற்கின் கடைக்கோடியிலிருந்து[c] வந்தது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யூதாவின் சந்ததியினரான கோத்திரத்திற்கு, அவர்களுடைய குலங்களின்படி, சீட்டுப்பங்கு அமைந்தது …”
    reason: וַיְהִי הַגּוֹרָל என்பதன் இன்னும் நேரடியான மாற்று மொழிபெயர்ப்பு.
  - marker: b
    text: எபிரெயத்தில் “யூதாவின் மகன்கள்.” இங்கே இது யூதாவின் கோத்திர வழித்தோன்றல்களைக் குறிக்கிறது.
    reason: பண்டைய எபிரெய உறவுமுறைச் சொல்லாட்சியின் கூட்டு அர்த்தத்தை விளக்குகிறது.
  - marker: c
    text: எபிரெயத்தில் “தேமான்/தெற்கின் கடைக்கோடியிலிருந்து.” תֵימָן என்பது ‘தெற்கு’ என்றும், ‘தேமான்’ என்ற இடப்பெயர் என்றும் புரிந்துகொள்ளப்படலாம்.
    reason: מִקְצֵה תֵימָן என்பதில் உள்ள திசைப்பொருள் மற்றும் இடப்பெயர்ப் பொருள் தெளிவின்மையைப் பாதுகாக்கிறது.
lexical_decisions:
- source_word: וַיְהִי הַגּוֹרָל
  choice: கிடைத்த சீட்டுப்பங்கு ... சென்றது
  rationale: நிலம் சீட்டுப்போட்டு ஒதுக்கப்பட்டதையும், அந்தப் பங்கு குறிப்பிடப்பட்ட எல்லைவரை விரிந்ததையும் இயல்பான தமிழில் தெரிவிக்கிறது. וַיְהִי என்பதன் கதைத்தொடரையும் எல்லை விவரிப்பின் செயல்பாட்டையும் பாதுகாக்கிறது.
- source_word: לְמַטֵּה בְּנֵי יְהוּדָה
  choice: யூதாவின் சந்ததியாரான கோத்திரத்துக்கு
  rationale: מַטֶּה என்பதைக் கோத்திரம் என்றும், בְּנֵי יְהוּדָה என்பதைக் உயிரியல் மகன்கள் என்று தவறாகப் புரியாதவாறு கோத்திர வழித்தோன்றல்களைக் குறிக்கும் ‘சந்ததியார்’ என்றும் வழங்குகிறது.
- source_word: לְמִשְׁפְּחֹתָם
  choice: அவர்களுடைய குலங்களின்படி
  rationale: நிலப்பங்கீட்டுச் சூழலில் מִשְׁפָּחָה என்பது தனிக் குடும்பத்தைவிட கோத்திரத்தின் உட்பிரிவான குலத்தைக் குறிக்கிறது.
- source_word: אֶל גְּבוּל אֱדוֹם
  choice: ஏதோமின் எல்லைவரை
  rationale: גְּבוּל என்பதன் எல்லை என்ற புவியியல் பொருளையும் אֶל என்பதன் நோக்கு/எல்லை அடையும் பொருளையும் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: מִדְבַּר צִן
  choice: சீன் வனாந்தரம்
  rationale: מִדְבָּר என்பதற்கான மரியாதைமிக்க, பரவலாக அறியப்படும் வேதாகமத் தமிழ்ச் சொல்லாக ‘வனாந்தரம்’ பயன்படுத்தப்படுகிறது; צִן ‘சீன்’ என ஒலிபெயர்க்கப்படுகிறது.
- source_word: נֶגְבָּה
  choice: தெற்கே
  rationale: இங்கு வரும் திசைசார்ந்த வினையடைப் பொருளைப் பாதுகாக்கிறது; இதனை ‘நெகேப்’ என்ற இடப்பெயராகத் தீர்மானிக்கவில்லை.
- source_word: מִקְצֵה תֵימָן
  choice: தென்கோடியிலுள்ள
  rationale: இச்சூழலில் மிகத் தெற்கிலுள்ள எல்லைப்பகுதியைக் குறிக்கும் இயல்பான தமிழாக்கம். ‘தெற்கின் கடைக்கோடியிலிருந்து’ அல்லது ‘தேமானின் கடைக்கோடியிலிருந்து’ என்ற அதிகச் சொல்லியல்பான புரிதல்கள் அடிக்குறிப்பில் பாதுகாக்கப்படுகின்றன.
