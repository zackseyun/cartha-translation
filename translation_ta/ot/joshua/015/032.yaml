  text: and Lebaoth[a], Shilhim, Ain, and Rimmon—twenty-nine cities in all, with their villages.
translation:
  language: ta
  text: லெபாவோத், ஷில்ஹீம், ஆயின், ரிம்மோன் ஆகியவை—மொத்தம் இருபத்தொன்பது பட்டணங்களும் அவற்றின் கிராமங்களும்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “கிராமங்கள்” என்பதை “குடியிருப்புகள்” அல்லது “சிற்றூர்கள்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְבָאוֹת
  choice: லெபாவோத்
  rationale: பட்டணங்களின் பட்டியலில் வரும் இடப்பெயர் என்பதால், பொருள் மொழிபெயர்க்காமல் தமிழில் ஒலிபெயர்க்கப்பட்டது; தொடக்க וּ இயல்பான தமிழ் பட்டியல் அமைப்பில் தனியே மொழிபெயர்க்கப்படவில்லை.
- source_word: וְשִׁלְחִים
  choice: சில்கீம்
  rationale: இடப்பெயராகக் கருதி எபிரெய ஒலிக்கு அண்மையாகத் தமிழில் ஒலிபெயர்க்கப்பட்டது.
- source_word: וְעַיִן
  choice: ஆயின்
  rationale: இங்கு ‘கண்’ அல்லது ‘நீரூற்று’ என்ற பொதுப்பெயர் அல்ல, இடப்பெயர்; ஆகவே ஒலிபெயர்க்கப்பட்டது.
- source_word: וְרִמּוֹן
  choice: ரிம்மோன்
  rationale: இங்கு ‘மாதுளை’ என்ற பொதுப்பொருளை விட இடப்பெயரே சூழலுக்குப் பொருந்துவதால் ஒலிபெயர்க்கப்பட்டது.
- source_word: כָּל עָרִים עֶשְׂרִים וָתֵשַׁע
  choice: மொத்தம் இருபத்தொன்பது பட்டணங்கள்
  rationale: பட்டியலிலுள்ள இடங்களின் மொத்த எண்ணிக்கையைச் சுருக்கிக் கூறும் எபிரெய சொற்றொடரை இயல்பான நவீன தமிழில் வழங்குகிறது.
- source_word: וְחַצְרֵיהֶן
  choice: அவற்றின் கிராமங்களோடு சேர்த்து
  rationale: חָצֵר என்பது இத்தகைய நிலப்பகுதிப் பட்டியல்களில் பட்டணங்களைச் சார்ந்த கிராமங்கள், சிற்றூர்கள் அல்லது குடியிருப்புகளைக் குறிக்கலாம்; ‘கிராமங்கள்’ பொதுவாக எளிதில் புரியும் தேர்வு.
