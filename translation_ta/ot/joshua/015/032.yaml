translation_notes:
  register: நவீன நிலையான தமிழில், பட்டியல் வசனத்திற்கேற்ற சுருக்கமானவும் கண்ணியமானவும் உள்ள நடை. இடப்பெயர்கள் எபிரெய வடிவங்களிலிருந்து நேரடியாக ஒலிபெயர்க்கப்பட்டுள்ளன; சார்ந்த குடியிருப்புகளைக் குறிக்கும் சொல்லின் நெகிழ்வை அடிக்குறிப்பு பாதுகாக்கிறது.
