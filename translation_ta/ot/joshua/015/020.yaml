lexical_decisions:
- source_word: זֹאת
  choice: இதுதான்
  rationale: பெண்பால் ஒருமைச் சுட்டுப்பெயர் முன்பு விவரிக்கப்பட்ட நிலப்பகுதியைத் திரும்பச் சுட்டுகிறது. எபிரெய வாக்கியத்தில் காலத்தைக் காட்டும் வினைச்சொல் இல்லாததால், தமிழில் காலத்தைத் தீர்மானிக்காத இயல்பான பெயர்வாக்கிய வடிவம் பயன்படுத்தப்பட்டது.
- source_word: נַחֲלַת
  choice: உரிமைப்பங்கு
  rationale: நிலப் பகிர்வுச் சூழலில் இச்சொல் மரபுரிமையாகவோ ஒதுக்கீடாகவோ பெறப்படும் உடைமைப் பங்கைக் குறிக்கிறது. “உரிமைப்பங்கு” என்பது மரபுரிமை மற்றும் ஒதுக்கீடு ஆகிய இரு நுணுக்கங்களையும் இயல்பான நவீன தமிழில் தக்கவைக்கிறது.
- source_word: מַטֵּה
  choice: கோத்திரம்
  rationale: இங்கு இச்சொல் ‘தடி’ என்ற நேரடிப் பொருளில் அல்லாமல் இஸ்ரவேலின் கோத்திரப் பிரிவைக் குறிக்கிறது.
- source_word: בְנֵי יְהוּדָה
  choice: யூதாவின் மக்கள்
  rationale: எபிரெய மொழியில் நேரடியாக ‘யூதாவின் மகன்கள்’ என்று இருந்தாலும், இது கோத்திரச் சந்ததியாரைக் குறிக்கும் மரபுத்தொடர். “யூதாவின் மக்கள்” என்பது அந்தக் கூட்டுச் சந்ததி உணர்வை நவீன தமிழில் இயல்பாக வழங்குகிறது.
- source_word: לְמִשְׁפְּחֹתָם
  choice: அவர்களுடைய குலங்களின்படி
  rationale: நில ஒதுக்கீட்டுச் சூழலில் מִשְׁפָּחָה என்பது கோத்திரத்துக்குள் உள்ள குலப்பிரிவுகளைக் குறிக்கிறது; முன்னொட்டு לְ பகிர்ந்தளிக்கும் அடிப்படையை, ‘...இன்படி’ என்று காட்டுகிறது.
