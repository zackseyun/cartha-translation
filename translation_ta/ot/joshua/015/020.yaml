  text: This was the inheritance of the tribe of the sons of Judah according to their clans[a].
translation:
  language: ta
  text: யூதாவின் சந்ததியினரின் கோத்திரத்தின் உரிமைப்பங்கு, அவர்களுடைய குலங்களின்படி, இதுதான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மூலத்தில் காலத்தைக் காட்டும் வினைச்சொல் இல்லை. எனவே, “இது யூதாவின் சந்ததியினரின் கோத்திரத்தின் உரிமைப்பங்கு, அவர்களுடைய குலங்களின்படி, ஆக இருந்தது” என்றும் மொழிபெயர்க்கலாம்.
