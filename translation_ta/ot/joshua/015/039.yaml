  choice: லாகீசு
  rationale: யூதா நாட்டின் நகரப் பெயர்; எபிரெய ஒலிப்புக்கு நெருக்கமாகத் தமிழில் ஒலிபெயர்க்கப்பட்டது.
- source_word: בָצְקַת
  choice: போஸ்கத்து
  rationale: நகரப் பெயர்; எபிரெய மெய்யெழுத்தான צ இங்கு ‘ஸ்க’ என்ற வழக்கமான ஒலிபெயர்ப்பால் தரப்படுகிறது. ஆங்கில எழுத்துக்கூட்டின் மாற்றுவடிவம் தமிழில் தனிக் குறிப்பைத் தேவைப்படுத்தாது.
- source_word: עֶגְלוֹן
  choice: எக்லோன்
  rationale: இச்சூழலில் மோவாபிய அரசனை அல்ல, நகரத்தைக் குறிக்கும் இடப்பெயர்; ஒலிபெயர்க்கப்பட்டது.
- source_word: וּ / וְ
  choice: பட்டியலில் காற்புள்ளிகள்
  rationale: இணைப்பிடைச்சொற்கள் நகரங்களை எளிய பட்டியலாக இணைக்கின்றன; இயல்பான நவீன தமிழில் காற்புள்ளிகளால் பட்டியல் அமைக்கப்பட்டது.
