revisions:
- from: மேற்கு எல்லையாகப் பெரிய கடலும் அதன் கரையோரமும் இருந்தன.[a] இதுவே யூதாவின் சந்ததியாருக்குக் குலங்களின்படி[b] சுற்றிலும் அமைந்த எல்லை.
  to: மேற்குப் பக்கத்தின் எல்லை பெரிய கடலும் அதன் எல்லைக் கோடும் ஆகும்.[a] குலங்களின்படி யூதாவின் சந்ததியாருக்கு எல்லாப் பக்கங்களிலும் அமைந்த எல்லை இதுவே.[b]
  rationale: The revision retains the directional sense of the western/seaward border, the conventional geographic designation ‘Great Sea,’ Judah’s corporate descendants, the encircling-boundary summary, and the clan qualification. It replaces the interpretively narrow ‘shoreline’ with ‘boundary line,’ which better reflects the repeated Hebrew term while remaining natural in Tamil.
