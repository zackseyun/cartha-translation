source:
  edition: WLC
  text: וּ/גְב֣וּל יָ֔ם הַ/יָּ֥מָּ/ה הַ/גָּד֖וֹל וּ/גְב֑וּל זֶ֠ה גְּב֧וּל בְּנֵֽי יְהוּדָ֛ה סָבִ֖יב לְ/מִשְׁפְּחֹתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/012.yaml
  text: And the western border was the Great Sea as a border[a]. This was the border of the sons of Judah all around[b], by their clans.
translation:
  language: ta
  text: மேற்குப் பக்கத்தின் எல்லை பெரிய கடலும் அதன் எல்லைக் கோடும் ஆகும்.[a] குலங்களின்படி யூதாவின் சந்ததியாருக்கு எல்லாப் பக்கங்களிலும் அமைந்த எல்லை இதுவே.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘பெரிய கடல்’ என்பது மத்தியதரைக் கடல். எபிரெய உரை சுருக்கமாக ‘கடல், பெரிய கடல், மற்றும் எல்லை’ என்று கூறுகிறது; பெரிய கடலே யூதாவின் மேற்குப் பக்க எல்லையாக இருந்தது.
    reason: cultural_note
  - marker: b
    text: அல்லது, ‘அவர்களுடைய குடும்பப் பிரிவுகளின்படி.’ இங்குள்ள எபிரெயச் சொல் கோத்திரத்திற்குள் இருந்த வம்சவழிக் குலக் குழுக்களைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּגְבוּל יָם הַיָּמָּה
  choice: மேற்கு எல்லையாக
  rationale: எல்லை விவரிப்புகளில் יָם (‘கடல்’) இஸ்ரவேலுக்கு மேற்கே இருந்த மத்தியதரைக் கடலை நோக்கிய திசையை, அதாவது மேற்கை, குறிக்கும். தமிழில் திசைப்பொருளை இயல்பாகத் தெரிவிக்க ‘மேற்கு எல்லையாக’ என மொழிபெயர்க்கப்பட்டது.
- source_word: הַיָּם הַגָּדוֹל
  choice: பெரிய கடல்
  rationale: இது மத்தியதரைக் கடலுக்கான எபிரெயப் புவியியல் பெயர். மூலத்தின் வழக்கமான பெயரிடலைத் தக்கவைக்க ‘பெரிய கடல்’ என வழங்கப்பட்டது.
- source_word: וּגְבוּל
  choice: அதன் கரையோரமும்
  rationale: ‘பெரிய கடல்’ என்பதற்குப் பின் மீண்டும் வரும் גְּבוּל சுருக்கமான இணைப்பாக இருந்து, கடலோரமே எல்லைக் கோடாக இருந்ததைச் சுட்டுகிறது. தமிழில் அந்த நிலவியல் பொருளைத் தெளிவாகக் கூற ‘அதன் கரையோரமும்’ என வழங்கப்பட்டது.
- source_word: בְּנֵי יְהוּדָה
  choice: யூதாவின் சந்ததியார்
  rationale: בְּנֵי என்றால் சொற்பட ‘மகன்கள்’; இங்கு அது யூதா கோத்திரத்தைச் சேர்ந்த வழிவந்தோரை ஒட்டுமொத்தமாகக் குறிக்கிறது. ‘சந்ததியார்’ என்பது உடனடி மகன்கள் என்ற தவறான எண்ணத்தைத் தவிர்த்து, தமிழில் வம்சக் குழுவை இயல்பாகக் குறிக்கிறது.
- source_word: סָבִיב
  choice: சுற்றிலும் அமைந்த
  rationale: இந்தச் சொல் யூதாவின் நிலப்பகுதியை எல்லாப் பக்கங்களிலும் சூழ்ந்த எல்லையைச் சுருக்கமாகக் குறிப்பிடுகிறது.
- source_word: לְמִשְׁפְּחֹתָם
  choice: குலங்களின்படி
  rationale: நிலப் பங்கீட்டுச் சூழலில் מִשְׁפָּחָה என்பது கோத்திரத்திற்குள் உள்ள வம்சவழிக் குலப் பிரிவைக் குறிக்கிறது. எனவே ‘குடும்பங்களின்படி’ என்பதைக் காட்டிலும் ‘குலங்களின்படி’ பொருத்தமானது.
theological_decisions:
- issue: בְּנֵי יְהוּדָה என்ற ஆண்பால் வம்சப் பெயரின் மொழிபெயர்ப்பு
  choice: யூதாவின் சந்ததியார்
  alternative: யூதாவின் மகன்கள்
  rationale: இங்கு சொற்றொடர் யூதாவின் உடனடி ஆண் பிள்ளைகளை மட்டும் அல்லாமல், முழுக் கோத்திரத்தையும் குறிக்கிறது. தமிழில் ‘சந்ததியார்’ என்பது அந்தக் கூட்டு வம்சப் பொருளைத் துல்லியமாகத் தருகிறது; எந்தப் பிரிவுசார் கோட்பாட்டையும் சேர்ப்பதில்லை.
translation_notes:
  register: நவீன பொதுத்தமிழில், நில எல்லை விவரிப்புக்கேற்ற தெளிவான மற்றும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘கரையோரம்,’ ‘சந்ததியார்,’ ‘குலங்களின்படி’ ஆகியவை சாதாரண வாசகருக்குப் புரியும்படியும் மூலத்தின் நிலவியல் மற்றும் சமூக அமைப்பைத் தக்கவைக்கும்படியும் தேர்ந்தெடுக்கப்பட்டன.
