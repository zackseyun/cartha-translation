  language: en
  yaml_path: translation/ot/joshua/015/061.yaml
  text: 'In the wilderness: Beth-arabah[a], Middin[b], and Secacah.'
translation:
  language: ta
  text: 'பாலைநிலத்தில்: பெத்-அரபா, மித்தீன், செக்காக்கா.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בַּמִּדְבָּר
  choice: பாலைநிலத்தில்
  rationale: ב prefixed to the definite noun marks the geographic subregion in which the towns lay. In this Judean context, “பாலைநிலம்” naturally denotes an arid, sparsely inhabited wilderness without implying only a sand desert.
- source_word: בֵּית הָעֲרָבָה
  choice: பெத்-அரபா
  rationale: This is a place name and is transliterated rather than translated; the hyphen makes the compound name clear in Tamil.
- source_word: מִדִּין
  choice: மித்தீன்
  rationale: The proper place name is transliterated from Hebrew; “த்த” represents the doubled d sound indicated by the dagesh, while the long final vowel is retained.
- source_word: וּסְכָכָה
  choice: செக்காக்கா
  rationale: The conjunction is represented by list punctuation and the Hebrew place name is transliterated in a form natural to Tamil pronunciation.
theological_decisions: []
translation_notes:
  register: நவீனத் தரமான தமிழில், நகரப் பட்டியலுக்குரிய சுருக்கமான புவியியல் நடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய உரையின் தலைப்புப் போன்ற இடவியல் சொற்றொடரும் அதைத் தொடரும் மூன்று ஊர்ப்பெயர்களும் தெளிவாகப் பாதுகாக்கப்பட்டுள்ளன.
