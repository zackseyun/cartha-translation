source:
  edition: WLC
  text: וְ/עָלָ֨ה הַ/גְּב֜וּל גֵּ֣י בֶן הִנֹּ֗ם אֶל כֶּ֤תֶף הַ/יְבוּסִי֙ מִ/נֶּ֔גֶב הִ֖יא יְרֽוּשָׁלִָ֑ם וְ/עָלָ֨ה הַ/גְּב֜וּל אֶל רֹ֣אשׁ הָ/הָ֗ר אֲ֠שֶׁר עַל פְּנֵ֤י גֵֽי הִנֹּם֙ יָ֔מָּ/ה אֲשֶׁ֛ר בִּ/קְצֵ֥ה עֵֽמֶק רְפָאִ֖ים צָפֹֽנָ/ה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/008.yaml
  text: Then the border went up by the Valley of Ben-hinnom to the slope of the Jebusite on the south (that is[a], Jerusalem), and the border went up to the top of the mountain that lies west of the Valley of Hinnom[c][b], at the northern end of the Valley of Rephaim.
translation:
  language: ta
  text: பின்பு எல்லை பென்-இன்னோம் பள்ளத்தாக்கின் வழியாக எபூசியரின் சரிவின் தென்புறம் வரை ஏறிச் சென்றது—அதுவே எருசலேம்.[a] பின்னர் எல்லை, இன்னோம் பள்ளத்தாக்கிற்கு மேற்கே உள்ள மலையின் உச்சிக்கு ஏறிச் சென்றது; அது ரெப்பாயீம் பள்ளத்தாக்கின் வடக்கு முனையில் இருந்தது.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “அது எருசலேம்” என்றும் மொழிபெயர்க்கலாம். எபூசியரின் இடம் எருசலேமென உரை வெளிப்படையாக அடையாளப்படுத்துகிறது.
    reason: alternative_reading
  - marker: b
    text: எபிரெயத்தில், “கடலை நோக்கி”; இது பொதுவாக மேற்குத் திசையைக் குறிக்கும் மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָלָה
  choice: பின்பு ... ஏறிச் சென்றது / அங்கிருந்து ... ஏறிச் சென்றது
  rationale: எல்லை விவரிப்புகளில் அடுத்தடுத்த நகர்வைக் குறிக்கும் Qal வினை; உயர்நோக்கிய திசையையும் இயல்பான தமிழ் தொடர் நடையையும் காக்கிறது.
- source_word: הַגְּבוּל
  choice: எல்லை
  rationale: நிலப்பங்கீட்டுச் சூழலில் பிரதேசத்தின் எல்லைக்கோட்டைக் குறிக்கும் இயல்பான நவீனத் தமிழ் சொல்.
- source_word: גֵּי בֶן הִנֹּם
  choice: பென்-இன்னோம் பள்ளத்தாக்கு
  rationale: இடப்பெயரின் தன்மையைப் பேணுவதற்காக ‘பென்-இன்னோம்’ ஒலிபெயர்க்கப்பட்டு, גֵּי என்பது ‘பள்ளத்தாக்கு’ என மொழிபெயர்க்கப்பட்டது.
- source_word: כֶּתֶף
  choice: மேட்டுச் சரிவு
  rationale: சொல்லுக்கு நேரடியாக ‘தோள்’ என்ற பொருள் இருந்தாலும், இங்கு நிலவியல் பயன்பாட்டில் மேட்டின் பக்கம் அல்லது சரிவைக் குறிக்கிறது.
- source_word: הַיְבוּסִי
  choice: எபூசியரின் மேடு
  rationale: எபூசியருடன் தொடர்புடைய இடம் அல்லது மேட்டுப்பகுதி என்பதைக் தமிழில் இயல்பாக வெளிப்படுத்துகிறது; மூலத்தின் சுருக்கமான பெயரெச்சப் பயன்பாடு சிறிதளவு விளக்கப்பட்டுள்ளது.
- source_word: מִנֶּגֶב
  choice: தென்புறமாக
  rationale: எபூசிய மேட்டுச் சரிவின் தெற்குப் பக்கத்தில் எல்லை சென்ற நிலவியல் தொடர்பைத் தெரிவிக்கிறது.
- source_word: הִיא יְרוּשָׁלִָם
  choice: அதுதான் எருசலேம்
  rationale: எபிரெய உரையின் வெளிப்படையான அடையாளப்படுத்தலைப் பேணுகிறது; ‘அது எருசலேம்’ என்ற மாற்று இலக்கண வாய்ப்பும் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: רֹאשׁ הָהָר
  choice: மலையின் உச்சி
  rationale: உயர்ந்த புள்ளியைக் குறிக்கும் எபிரெய மரபுத்தொடருக்கான தெளிவான தமிழ் இணை.
- source_word: אֲשֶׁר עַל פְּנֵי גֵי הִנֹּם יָמָּה
  choice: இன்னோம் பள்ளத்தாக்கிற்கு மேற்கே உள்ள
  rationale: ‘முகத்திற்கு முன்’ என்ற நிலவியல் தொடர்பையும் ‘கடல் நோக்கி’ என்ற மேற்குத் திசை மரபுத்தொடரையும் இயல்பான தமிழில் ஒருங்கிணைக்கிறது.
- source_word: בִּקְצֵה עֵמֶק רְפָאִים צָפֹנָה
  choice: ரெப்பாயீம் பள்ளத்தாக்கின் வடக்கு முனையில்
  rationale: קצה குறிக்கும் விளிம்பு/முனை மற்றும் צָפֹנָה குறிக்கும் வடக்குத் திசையைச் சுருக்கமாகவும் தெளிவாகவும் தருகிறது.
- source_word: עֵמֶק רְפָאִים
  choice: ரெப்பாயீம் பள்ளத்தாக்கு
  rationale: இங்கு இடப்பெயராக இருப்பதால் ரְפָאִים என்பதற்கு விளக்கப் பொருள் திணிக்காமல் ஒலிபெயர்க்கப்பட்டது.
theological_decisions:
- issue: הִיא יְרוּשָׁלִָם என்பதன் அடையாளப்படுத்தும் தொடர்பு
  choice: ‘அதுதான் எருசலேம்’ என்று எபூசியரின் மேடு/இடத்தை எருசலேமுடன் அடையாளப்படுத்துதல்
  alternative: ‘அது எருசலேம்’
  rationale: மூல உரை அடையாளத்தை வெளிப்படையாகச் சொல்கிறது; தமிழ் முதன்மை உரையில் இயல்பான அடையாள வாக்கியம் பயன்படுத்தப்பட்டு, அதிகச் சொற்சார்ந்த மாற்று அடிக்குறிப்பில் காக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான நிலவியல் நடை பயன்படுத்தப்பட்டுள்ளது. இடப்பெயர்கள் தமிழ் வேதாகமப் பயன்பாட்டுக்கு ஏற்ற ஒலிவடிவங்களில் தரப்பட்டுள்ளன; தேவையற்ற கொள்கை விளக்கம் சேர்க்கப்படவில்லை.
