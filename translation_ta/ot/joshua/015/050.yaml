lexical_decisions:
- source_word: עֲנָב
  choice: அனாப்
  rationale: யூதாவின் ஊர்களைப் பட்டியலிடும் சூழலில் இது ஓர் இடப்பெயர்; பொருள் மொழிபெயர்ப்பு செய்யாமல், எபிரெய ஒலிக்கு இயன்றவரை நெருக்கமாகத் தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: אֶשְׁתְּמֹה
  choice: எஷ்தெமோ
  rationale: இது ஓர் இடப்பெயர். மசோரா உரையில் காணப்படும் வடிவத்தின் ஒலியைப் பின்பற்றி எஷ்தெமோ என்று ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: עָנִים
  choice: ஆனீம்
  rationale: இது பன்மை வடிவம்போல் தோன்றினாலும் இங்கு இடப்பெயராகச் செயல்படுகிறது; ஆகவே பொருள் மொழிபெயர்க்காமல் ஆனீம் என ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: וְ
  choice: ஆகிய
  rationale: எபிரெய இணைப்புச் சொல் ஊர்ப்பெயர்களை ஒரு பட்டியலாக இணைக்கிறது. இயல்பான நவீன தமிழில் பட்டியலை நிறைவு செய்ய ‘ஆகிய’ பயன்படுத்தப்பட்டுள்ளது.
