  register: நவீனத் தரத் தமிழில், வேதாகம ஊர்ப்பட்டியலுக்கேற்ற சுருக்கமான, கண்ணியமான நடை. முந்தைய வசனங்களிலிருந்து தொடரும் பெயர்ப் பட்டியல் தனியாக வாசிக்கப்படும்போதும் தெளிவாக இருக்க ‘ஊர்கள்’ சேர்க்கப்பட்டுள்ளது; இது சூழலால் உள்ளடங்கிய தகவல்.
