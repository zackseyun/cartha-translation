revisions:
- from: மாராத், பெத்-ஆனோத், எல்தெக்கோன் ஆகிய ஆறு நகரங்களும் அவற்றைச் சேர்ந்த கிராமங்களும்.[a]
  to: 'மாராத், பெத்-அனோத், எல்தெகோன்: ஆறு நகரங்களும் அவற்றின் கிராமங்களும்.[a]'
  rationale: The revision follows the Hebrew list-summary form, retains the source conjunction before “their villages,” and corrects the two place-name transliterations. The count is preserved without implying that only the three names displayed in this excerpt constitute all six cities.
