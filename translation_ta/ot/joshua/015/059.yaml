source:
  edition: WLC
  text: וּ/מַעֲרָ֥ת וּ/בֵית עֲנ֖וֹת וְ/אֶלְתְּקֹ֑ן עָרִ֥ים שֵׁ֖שׁ וְ/חַצְרֵי/הֶֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/059.yaml
  text: 'and Maarath[a], and Beth-anoth, and Eltekon: six cities with their villages.'
translation:
  language: ta
  text: 'மாராத், பெத்-அனோத், எல்தெகோன்: ஆறு நகரங்களும் அவற்றின் கிராமங்களும்.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அவற்றின் குடியிருப்புகளும்’ அல்லது ‘சிற்றூர்களும்’ என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல், பட்டியலிடப்பட்ட நகரங்களைச் சார்ந்த நாட்டுப்புறக் குடியிருப்புகளைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמַעֲרָת
  choice: மாராத்
  rationale: இது ஓர் இடப்பெயர்; பொருளாக்காமல், எபிரெய ஒலிப்பை நவீனத் தமிழுக்கு இயல்பாக எழுத்துப்பெயர்த்துள்ளது.
- source_word: וּבֵית עֲנוֹת
  choice: பெத்-ஆனோத்
  rationale: בֵית என்பது கூட்டுப் பெயரின் ஓர் அங்கம் என்பதால் ‘ஆனோத்தின் வீடு’ என்று மொழிபெயர்க்காமல் முழுப் பெயரும் எழுத்துப்பெயர்க்கப்பட்டுள்ளது; இணைப்புக்கோடு கூட்டுப் பெயரைத் தெளிவாக்குகிறது.
- source_word: וְאֶלְתְּקֹן
  choice: எல்தெக்கோன்
  rationale: இடப்பெயர் என்பதால் எபிரெய மூலத்தைப் பின்பற்றி எழுத்துப்பெயர்க்கப்பட்டுள்ளது.
- source_word: עָרִים שֵׁשׁ
  choice: ஆறு நகரங்கள்
  rationale: עִיר என்பதற்கு இந்நிலப்பங்கீட்டுப் பட்டியலின் சூழலில் மரபான ‘நகரம்’ என்பதும், שֵׁשׁ என்பதற்கு ‘ஆறு’ என்பதும் பொருத்தமானவை. இயல்பான தமிழ் சொல்வரிசைக்காக எண் பெயர்ச்சொல்லுக்கு முன் வைக்கப்பட்டுள்ளது.
- source_word: וְחַצְרֵיהֶן
  choice: அவற்றைச் சேர்ந்த கிராமங்களும்
  rationale: חָצֵר இத்தகைய நிலப்பங்கீட்டுப் பட்டியல்களில் பட்டியலிடப்பட்ட நகரங்களைச் சார்ந்த புறநிலக் குடியிருப்புகளைக் குறிக்கிறது. ‘கிராமங்கள்’ என்பது நவீனத் தமிழில் தெளிவான சொல்; ‘அவற்றைச் சேர்ந்த’ என்பது சார்புநிலையை வெளிப்படுத்துகிறது.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழில், பட்டியல் நடையைச் சுருக்கமாகவும் கண்ணியமாகவும் வைத்துள்ளது. எபிரெயத்தில் ஒவ்வொரு இடப்பெயருக்கும் முன் வரும் இணைப்புச்சொற்களைத் தமிழில் இயல்பாக ‘ஆகிய’ என்ற தொகுப்பமைப்பால் வெளிப்படுத்தியுள்ளது. அடிக்குறிப்பு குறியீடு தொடர்புடைய ‘கிராமங்களும்’ என்பதற்குப் பின் வைக்கப்பட்டுள்ளது.
