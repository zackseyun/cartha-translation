  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான வரலாற்றுக் கதைநடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய மொழியின் தொடர்ச்சியான வினைகள் தமிழின் வினையெச்சத் தொடரால் சுருக்கமாகவும் தெளிவாகவும் தரப்பட்டுள்ளன; சூழல் தரும் ‘திரும்ப’ என்ற கருத்து மூல வினையில் வெளிப்படையாக இல்லாததால் முதன்மை உரையில் சேர்க்கப்படாமல் அடிக்குறிப்பில் வைக்கப்பட்டுள்ளது.
