  text: So Joab arose and went to Geshur[a], and brought Absalom to Jerusalem.
translation:
  language: ta
  text: யோவாப் எழுந்து கெசூருக்குப் போய், அப்சலோமை எருசலேமுக்குக் கொண்டுவந்தான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அப்சலோமை எருசலேமுக்குத் திரும்பக் கொண்டுவந்தான்” என்றும் மொழிபெயர்க்கலாம். அவன் நாடுகடத்தப்பட்டிருந்த இடத்திலிருந்து திரும்பியதைச் சூழல் உணர்த்துகிறது; ஆனால் “திரும்ப” என்பது எபிரெய வினையில் வெளிப்படையாக இல்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: எழுந்து
  rationale: קום என்பதன் தொடர்கதை வடிவம் செயல்படுவதற்காக எழுவதைச் சுட்டுகிறது; இயல்பான தமிழ் தொடரில் ‘எழுந்து’ என்பது அதன் நிகழ்வுத் தொடரையும் முறையான நடையையும் காக்கிறது.
- source_word: וַיֵּלֶךְ
  choice: போய்
  rationale: הלך என்பதன் சாதாரண தொடர்கதைப் பொருள் ‘போ’ என்பதாகும்; ‘பயணம் செய்து’ போன்ற கூடுதல் நுணுக்கத்தைச் சேர்க்காமல் இயல்பாக மொழிபெயர்க்கிறது.
- source_word: גְּשׁוּרָה
  choice: கெசூருக்கு
  rationale: இறுதியில் உள்ள திசைகாட்டும் ה, கெசூரை நோக்கிய இயக்கத்தைத் தெரிவிக்கிறது; தமிழில் நான்காம் வேற்றுமை உருபு இதை இயல்பாகக் காட்டுகிறது.
- source_word: וַיָּבֵא
  choice: கொண்டுவந்தான்
  rationale: ביא என்பதன் ஹிஃபில் வடிவம் ‘வரச் செய், கொண்டுவா’ என்று பொருள்படும். சூழலில் பேச்சாளரின் மையமான எருசலேமை நோக்கிய இயக்கம் இருப்பதால் ‘கொண்டுவந்தான்’ இயல்பானது; நாடுகடத்தலிலிருந்து ‘திரும்ப’ வந்தது சூழலில் புரிந்தாலும், அந்தக் கருத்து வினையில் வெளிப்படையாக இல்லை.
- source_word: אֶת אַבְשָׁלוֹם
  choice: அப்சலோமை
  rationale: நேரடிச் செயப்படுபொருள் குறியுடன் வரும் பெயர்; தமிழ் வேதாகமப் பெயர்மரபிற்கு ஏற்ற வடிவமும் செயப்படுபொருள் உருபும் பயன்படுத்தப்பட்டுள்ளன.
- source_word: יְרוּשָׁלִַם
  choice: எருசலேமுக்கு
  rationale: தனி முன்னிடைச்சொல் இல்லாவிட்டாலும், வாக்கிய அமைப்பு இதை கொண்டுவரப்பட்ட இடமாகக் காட்டுகிறது; தமிழில் நான்காம் வேற்றுமை உருபு இலக்கைத் தெளிவாக்குகிறது.
- source_word: וַ
  choice: —
  rationale: எபிரெயத் தொடர்கதை வாவ் வினைகளை வரிசையாக இணைக்கிறது. தமிழில் ‘எழுந்து… போய்… கொண்டுவந்தான்’ என்ற வினையெச்சத் தொடர் அதே நிகழ்வுவரிசையை இயல்பாக வெளிப்படுத்துவதால் தனி இணைப்புச்சொல் தேவையில்லை.
