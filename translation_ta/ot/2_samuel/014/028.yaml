translation_notes:
  register: நவீன நிலையான தமிழில், இயல்பானதும் கண்ணியமானதுமான உரைநடை பயன்படுத்தப்பட்டுள்ளது. ‘அரசனின் முகம்’ என்ற எபிரெய உருவகம் முதன்மை உரையில் தக்கவைக்கப்பட்டு, அதன் சூழற்பொருள் அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது. அடிக்குறி அது விளக்கும் சொற்றொடருக்குப் பின் வைக்கப்பட்டுள்ளது.
