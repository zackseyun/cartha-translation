base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/028.yaml
  text: So Absalom lived in Jerusalem for two years[a], and he did not see the king's face.
translation:
  language: ta
  text: அப்சலோம் எருசலேமில் இரண்டு முழு ஆண்டுகள் தங்கியிருந்தான்; அரசனின் முகத்தை அவன் காணவில்லை.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லுக்கு சொல், “அரசனின் முகத்தை அவன் காணவில்லை.” இந்த எபிரெய மரபுத்தொடர், அப்சலோமுக்கு அரசனை நேரில் சந்திக்கவோ அவரிடம் செல்லவோ அனுமதி கிடைக்கவில்லை என்பதைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּשֶׁב
  choice: தங்கியிருந்தான்
  rationale: ישׁב என்பது ‘அமர்தல், குடியிருத்தல், தங்கியிருத்தல்’ எனப் பொருள்படும். அப்சலோம் எருசலேமில் தொடர்ந்து இருந்ததைக் கூறும் இச்சூழலில் ‘தங்கியிருந்தான்’ இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: אַבְשָׁלוֹם
  choice: அப்சலோம்
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் நிலைபெற்ற பெயரெழுத்தாக்கம்.
- source_word: בִּירוּשָׁלִַם
  choice: எருசலேமில்
  rationale: இடத்தைக் குறிக்கும் בְּ முன்னொட்டுடன் வந்த பெயருக்கு நேரான தமிழ் வடிவம்.
- source_word: שְׁנָתַיִם יָמִים
  choice: இரண்டு முழு ஆண்டுகள்
  rationale: சொல்லுக்கு சொல் ‘இரண்டு ஆண்டுகள், நாட்கள்’ என உள்ள எபிரெய காலக்குறிப்பு, முழுமையான இரண்டு ஆண்டுகளைக் குறிக்கும் மரபுத்தொடர்; ‘முழு’ அதன் இயல்பான வலியுறுத்தலை வெளிப்படுத்துகிறது.
- source_word: וּפְנֵי הַמֶּלֶךְ
  choice: அரசனின் முகத்தையோ
  rationale: மூலத்தின் உறுதியான ‘அரசனின் முகம்’ என்ற உருவகச் சொல்லாட்சியைத் தக்கவைக்கிறது. இங்கு அது அரசனை நேரில் சந்திக்கும் அனுமதியைக் குறிக்கிறது.
- source_word: לֹא רָאָה
  choice: அவன் காணவில்லை
  rationale: மூலத்தின் தனி எதிர்மறை வினைமுற்றை நேரடியாகப் பிரதிபலிக்கிறது; ‘காணவில்லை’ என்பது dignified modern Tamil ஆகும்.
