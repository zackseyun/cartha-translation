base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/006.yaml
  text: And your servant had two sons[a], and the two of them fought in the field, and there was no one to separate them[b]; then the one struck the other and killed him.
translation:
  language: ta
  text: “உங்கள் அடியாளுக்கு இரண்டு மகன்கள் இருந்தார்கள்[a]. அவர்கள் இருவரும் வயல்வெளியில் சண்டையிட்டார்கள். அவர்களுக்கிடையில் அவர்களைப் பிரிக்க யாரும் இல்லை[b]. அப்போது ஒருவன் மற்றவனை அடித்துக் கொன்றுவிட்டான்.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘உங்கள் பெண் அடிமைக்கு’ என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல், அரசனிடம் பேசும் ஒரு பெண் தன்னைத் தாழ்மையுடன் குறிப்பிடும் சொல்லாக இங்கு பயன்படுகிறது.
    reason: lexical_alternative
  - marker: b
    text: 'சொல்லுக்குச் சொல்: ‘அவர்களுக்கிடையில் காப்பாற்றுபவர் யாரும் இல்லை’; அதாவது, தலையிட்டு அவர்களைப் பிரிக்க யாரும் இல்லை.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְשִׁפְחָתְךָ
  choice: உங்கள் அடியாளுக்கு
  rationale: שִׁפְחָה என்பது பெண் பணியாளையோ அடிமைப் பெண்ணையோ குறிக்கும்; இங்கு அரசனிடம் பேசும் பெண் தன்னைத் தாழ்மையுடன் குறிப்பிடும் அரசவை வழக்கு. நவீனத் தமிழில் ‘உங்கள் அடியாள்’ பெண்பால் சூழலையும் பணிவையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: שְׁנֵי בָנִים
  choice: இரண்டு மகன்கள்
  rationale: בָּנִים இங்கு பொதுவாகப் பிள்ளைகளை அல்ல, ஆண் பிள்ளைகளையே குறிக்கிறது.
- source_word: וַיִּנָּצוּ
  choice: சண்டையிட்டுக்கொண்டார்கள்
  rationale: נצה இச்சூழலில் உடல் மோதலைக் குறிக்கிறது; தொடர்ந்து மரணம் நிகழ்வதால் ‘வாக்குவாதம் செய்தார்கள்’ என்பதைக் காட்டிலும் ‘சண்டையிட்டுக்கொண்டார்கள்’ பொருத்தமானது.
- source_word: בַּשָּׂדֶה
  choice: வயல்வெளியில்
  rationale: שָׂדֶה என்பதன் இடப்பொருளை நவீனத் தமிழில் இயல்பாகத் தருகிறது.
- source_word: וְאֵין מַצִּיל בֵּינֵיהֶם
  choice: அவர்களை விலக்கிவிட யாரும் அங்கே இல்லை
  rationale: מַצִּיל என்பதன் அடிப்படைப் பொருள் ‘விடுவிப்பவர்/காப்பாற்றுபவர்’; சண்டைச் சூழலில் இடையில் தலையிட்டு இருவரையும் பிரிப்பவர் இல்லையென்பதே கருத்து.
- source_word: וַיַּכּוֹ הָאֶחָד אֶת הָאֶחָד
  choice: ஒருவன் மற்றவனை அடித்து
  rationale: נכה என்பது ‘அடி/தாக்கு’ எனப் பொருள்படும். மரணத்தை அடுத்த வினைச்சொல் தெளிவுபடுத்துவதால், தாக்குதலின் முறையை இதற்கு மேல் குறிப்பாக்கவில்லை.
- source_word: וַיָּמֶת אֹתוֹ
  choice: கொன்றுவிட்டான்
  rationale: מות வடிவம் இங்கு நேரடிச் செயப்படுபொருள் பின்னொட்டுடன் காரணவினைப் பொருளில் வந்து, மற்றவனை இறக்கச் செய்தான் என்பதைக் குறிக்கிறது; தமிழில் இயல்பாக ‘கொன்றுவிட்டான்’.
