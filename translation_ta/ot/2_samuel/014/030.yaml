base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/030.yaml
  text: Then he said to his servants[a], “Look, Joab’s field is next to mine, and he has barley there. Go and set it on fire.” So Absalom’s servants set the field on fire.
translation:
  language: ta
  text: பின்பு அவன் தன் பணியாளர்களிடம், “பாருங்கள்! யோவாபின் வயல் என் நிலத்துக்கு அடுத்திருக்கிறது[a]; அங்கே அவனுடைய வாற்கோதுமை இருக்கிறது. போய் அந்த வயலுக்குத் தீ வையுங்கள்” என்றான். எனவே, அப்சலோமின் பணியாளர்கள் அந்த வயலுக்குத் தீ வைத்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மொழியில் சொல்லுக்குச் சொல், “யோவாபின் வயல் என் கையருகே இருக்கிறது.” இது அப்சலோமின் நிலத்துக்குப் பக்கத்தில் அல்லது அதை ஒட்டி அந்த வயல் இருந்ததைக் குறிக்கும் மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֶלְקַת
  choice: வயல்
  rationale: இச்சூழலில் இது யோவாபுக்குச் சொந்தமான, வாற்கோதுமை பயிரிடப்பட்ட நிலப்பகுதியைக் குறிக்கிறது. ‘வயல்’ என்பது இயல்பான நவீனத் தமிழ் இணைச்சொல்.
- source_word: אֶל יָדִי
  choice: என் நிலத்துக்கு அடுத்திருக்கிறது
  rationale: சொல்லுக்குச் சொல் ‘என் கையருகே’ என்றாலும், நிலத்தை விவரிக்கும் இச்சூழலில் அருகாமை அல்லது எல்லையொட்டிய அமைப்பைக் குறிக்கும் எபிரெய மரபுத்தொடரின் பொருளை இயல்பாகத் தெரிவிக்கிறது.
- source_word: שְׂעֹרִים
  choice: வாற்கோதுமை
  rationale: வயலில் உள்ள barley பயிரைக் குறிக்கிறது; தமிழில் பயிரின் பெயராக ‘வாற்கோதுமை’ பொருத்தமானது.
- source_word: וְהוּצִיתִהָ / וַיַּצִּתוּ
  choice: தீ வையுங்கள் / தீ வைத்தார்கள்
  rationale: יצת என்பதன் causative பொருளான தீ மூட்டுதல் அல்லது எரியச் செய்தலை இயல்பான தமிழில் வெளிப்படுத்துகிறது; கட்டளையிலும் அதன் நிறைவேற்றத்திலும் ஒரே வினைக்கருத்து பேணப்பட்டுள்ளது.
- source_word: עֲבָדָיו / עַבְדֵי אַבְשָׁלוֹם
  choice: பணியாளர்கள் / அப்சலோமின் பணியாளர்கள்
  rationale: עבד என்பது அடிமைகளையோ பணியாளர்களையோ குறிக்கலாம். இவ்வரசவைக் கதைச்சூழல் அவர்களுடைய சட்ட அல்லது சமூக அடிமைநிலையைத் தெளிவாக முன்னிறுத்தாததால், மிகையாகத் தீர்மானிக்காத ‘பணியாளர்கள்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: רְאוּ
  choice: பாருங்கள்!
  rationale: அருகிலுள்ள வயலின் மீது பணியாளர்களின் கவனத்தைத் திருப்பும் பன்மை ஏவலை நேரடியான, இயல்பான பேச்சுத் தமிழில் தருகிறது.
- source_word: לְכוּ
  choice: போய்
  rationale: தீ வைக்கும் கட்டளைக்கு முன் வரும் இயக்க ஏவலைச் சுருக்கமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
