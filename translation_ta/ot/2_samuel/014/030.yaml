translation_notes:
  register: நவீன நிலையான தமிழில், கண்ணியமான ஆனால் எளிதில் புரியும் கதைநடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய மூலத்தின் நேரடிப் பேச்சும் கட்டளை–நிறைவேற்ற அமைப்பும் பேணப்பட்டுள்ளன. ஆங்கில ஆலோசனை உரையில் தவறாக ‘servants’ என்பதற்குப் பின்னர் காணப்பட்ட அடிக்குறிப்புக் குறி, அது விளக்கும் அருகாமை மரபுத்தொடருக்குப் பின்னர் சரியாக வைக்கப்பட்டுள்ளது.
