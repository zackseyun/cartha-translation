base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/018.yaml
  text: Then the king answered and said to the woman[a], “Please do not hide from me anything that I ask you.” And the woman said, “Please speak[b], my lord the king.”
translation:
  language: ta
  text: 'அப்போது அரசன் அந்தப் பெண்ணிடம் பதிலளித்துக் கூறினான்: “நான் உன்னிடம் கேட்கும் எதையும் தயவுசெய்து என்னிடமிருந்து மறைக்காதே.” அதற்கு அந்தப் பெண், “என் ஆண்டவராகிய அரசர் பேசுவாராக[a]” என்றாள்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது, நேரடி அழைப்பாக: “என் ஆண்டவராகிய அரசரே, தயவுசெய்து பேசுங்கள்.”'
    reason: மூலத்தில் மூன்றாம் நபர் விருப்பவினை (யெதப்பேர் நா) உள்ளது; தமிழில் நேரடி மரியாதை அழைப்பாகவும் மொழிபெயர்க்கலாம்.
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמֶר
  choice: என்றான்
  rationale: எபிரெய மொழியின் இரட்டை உரையறிமுகத்தைத் தமிழில் இயல்பான ஒரே உரைவினையாக வழங்குகிறது; பதிலுரைக்கும் சூழல் அடுத்த வாக்கியத்தில் தெளிவாக உள்ளது.
- source_word: הַמֶּלֶךְ
  choice: அரசன் / அரசர்
  rationale: விவரிப்பில் இயல்பான ‘அரசன்’ என்றும், மரியாதைமிக்க நேரடி அழைப்பில் ‘அரசர்’ என்றும் சூழலுக்கேற்ற வடிவங்கள் பயன்படுத்தப்பட்டன.
- source_word: הָאִשָּׁה
  choice: அந்தப் பெண்
  rationale: இங்கு தெக்கோவாவைச் சேர்ந்த குறிப்பிட்ட பெண்ணையே குறிக்கிறது; மனைவி என்ற உறவுப்பொருள் இல்லை.
- source_word: אַל נָא תְכַחֲדִי מִמֶּנִּי
  choice: தயவுசெய்து என்னிடமிருந்து மறைக்காதே
  rationale: தடையையும் வேண்டுகோளின் மரியாதைத் தொனியையும் காக்கிறது.
- source_word: דָּבָר אֲשֶׁר אָנֹכִי שֹׁאֵל אֹתָךְ
  choice: நான் உன்னிடம் கேட்கப்போகும் எதையும்
  rationale: דָּבָר என்பதன் சூழல்சார் பொருளை ‘எதையும்’ எனவும், உடனே கேட்கவிருக்கும் விசாரணையை இயல்பான தமிழில் எதிர்நோக்கு வடிவிலும் தருகிறது.
- source_word: יְדַבֶּר נָא
  choice: தயவுசெய்து பேசட்டும்
  rationale: மூன்றாம் நபர் விருப்பவினை வடிவத்தையும் அரசவைக்குரிய பணிவான சொல்லாட்சியையும் காக்கிறது.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: என் ஆண்டவராகிய அரசர்
  rationale: உடைமை சார்ந்த மரியாதையையும் அரச பட்டத்தையும் இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
