  register: நவீன தரத் தமிழில், அரசவைக்குரிய மரியாதைத் தொனியுடன் வடிவமைக்கப்பட்டது. உரையாடலில் அரசன் பெண்ணை ஒருமை நெருக்க வடிவில் அழைப்பதும், பெண் அரசனை மரியாதைப் பன்மை மற்றும் மூன்றாம் நபர் விருப்பவினையால் அழைப்பதும் பாதுகாக்கப்பட்டுள்ளன.
