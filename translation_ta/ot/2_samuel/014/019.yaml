translation_notes:
  register: நவீன நிலையான தமிழில், அரசவைக்குரிய மரியாதைத் தொனியுடன் மொழிபெயர்க்கப்பட்டது. அரசரைக் குறிக்கும் இடங்களில் ‘உமது’, ‘என் ஆண்டவராகிய அரசே’ ஆகிய உயர்மரியாதை வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன. மூலத்தின் ‘கை’, ‘வலப்புறம்/இடப்புறம்’, ‘வாயில் வைத்தான்’ ஆகிய உருவகங்கள் புரிந்துகொள்ளத்தக்க தமிழில் பாதுகாக்கப்பட்டுள்ளன.
