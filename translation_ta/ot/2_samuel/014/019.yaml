  text: וַ/יֹּ֣אמֶר הַ/מֶּ֔לֶךְ הֲ/יַ֥ד יוֹאָ֛ב אִתָּ֖/ךְ בְּ/כָל זֹ֑את וַ/תַּ֣עַן הָ/אִשָּׁ֣ה וַ/תֹּ֡אמֶר חֵֽי נַפְשְׁ/ךָ֩ אֲדֹנִ֨/י הַ/מֶּ֜לֶךְ אִם אִ֣שׁ לְ/הֵמִ֣ין וּ/לְ/הַשְׂמִ֗יל מִ/כֹּ֤ל אֲשֶׁר דִּבֶּר֙ אֲדֹנִ֣/י הַ/מֶּ֔לֶךְ כִּֽי עַבְדְּ/ךָ֤ יוֹאָב֙ ה֣וּא צִוָּ֔/נִי וְ/ה֗וּא שָׂ֚ם בְּ/פִ֣י שִׁפְחָֽתְ/ךָ֔ אֵ֥ת כָּל הַ/דְּבָרִ֖ים הָ/אֵֽלֶּה־־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/019.yaml
  text: Then the king said[a], “Is the hand of Joab with you in all this?” And the woman answered and said, “As your soul lives, my lord the king, no one can turn to the right or to the left from anything that my lord the king has spoken, for your servant Joab himself commanded me[b], and he himself put all these words into the mouth of your female servant.”
translation:
  language: ta
  text: அப்போது அரசர், “இந்த எல்லாவற்றிலும் யோவாபின் கை உன்னோடு இருக்கிறதா?” என்று கேட்டார். அதற்கு அந்தப் பெண், “என் ஆண்டவராகிய அரசே, உமது உயிர்மேல் ஆணை![a] என் ஆண்டவராகிய அரசர் சொன்ன எதிலிருந்தும் வலப்புறமோ இடப்புறமோ விலகிச் செல்ல யாராலும் முடியாது.[b] உமது ஊழியனாகிய யோவாப்தான் எனக்குக் கட்டளையிட்டான்; அவனே இந்த வார்த்தைகள் அனைத்தையும் உமது பணிப்பெண்ணின் வாயில் வைத்தான்” என்றாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொற்சொல்லாக, “உமது உயிர் வாழ்வதுபோல.” இது உறுதிமொழியாகப் பயன்படுத்தப்பட்ட எபிரேய ஆணைமுறை.
    reason: lexical_alternative
  - marker: b
    text: “வலப்புறமோ இடப்புறமோ விலகிச் செல்லுதல்” என்பது அரசர் கூறியதைவிட்டு விலகவோ, அதை மறுக்கவோ, அதிலிருந்து தப்பிக்கவோ முடியாது என்பதைக் குறிக்கும் எபிரேய மரபுத்தொடர்.
    reason: cultural_note
lexical_decisions:
- source_word: הֲיַד יוֹאָב אִתָּךְ
  choice: யோவாபின் கை உன்னோடு இருக்கிறதா?
  rationale: ‘கை’ என்பது ஒருவரின் செயல்பாடு, பங்கு அல்லது பின்னணித் தூண்டுதலைக் குறிக்கும் எபிரேய உருவகம். அதன் காட்சித்தன்மையையும் கேள்வியின் மறைமுகத் தொனியையும் காக்க நேரடியாக மொழிபெயர்க்கப்பட்டது.
- source_word: בְּכָל זֹאת
  choice: இந்த எல்லாவற்றிலும்
  rationale: அந்தப் பெண் முன்வைத்த முழுத் திட்டத்தையும் நிகழ்ந்த உரையாடலையும் சுட்டுகிறது.
- source_word: חֵי נַפְשְׁךָ
  choice: உமது உயிர்மேல் ஆணை!
  rationale: அரசரின் உயிரைச் சாட்சியாக வைத்து உறுதிப்படுத்தும் எபிரேய ஆணைமொழியை இயல்பான நவீன தமிழில் தருகிறது; சொற்சொல்லான வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: אִם אִישׁ לְהֵמִין וּלְהַשְׂמִיל
  choice: வலப்புறமோ இடப்புறமோ விலகிச் செல்ல யாராலும் முடியாது
  rationale: அரசர் கூறியதை மறுக்கவோ அதிலிருந்து தப்பிக்கவோ முடியாது என்பதைக் குறிக்கும் திசைசார் உருவகத்தைத் தக்கவைக்கிறது.
- source_word: עַבְדְּךָ יוֹאָב
  choice: உமது ஊழியனாகிய யோவாப்
  rationale: அரண்மனைச் சூழலில் அரசருக்குக் கீழ்ப்பட்ட சேவகரைக் குறிக்கும் மரியாதைமிக்க இயல்பான தமிழ்.
- source_word: צִוָּנִי
  choice: எனக்குக் கட்டளையிட்டான்
  rationale: யோவாப் அதிகாரத்துடன் கொடுத்த உத்தரவைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: שָׂם בְּפִי שִׁפְחָתְךָ
  choice: உமது பணிப்பெண்ணின் வாயில் வைத்தான்
  rationale: யோவாப் அவள் சொல்ல வேண்டிய சொற்களை வழங்கினான் என்ற எபிரேய உருவகத்தைத் தக்கவைக்கிறது; שִׁפְחָה என்பதன் பெண்பால் குறிப்பும் ‘பணிப்பெண்’ என்பதில் பாதுகாக்கப்படுகிறது.
- source_word: אֵת כָּל הַדְּבָרִים הָאֵלֶּה
  choice: இந்த வார்த்தைகள் அனைத்தையும்
  rationale: யோவாப் அவளுக்குக் கொடுத்த குறிப்பிட்ட உரையைக் குறிக்கும் காரணத்தால் ‘காரியங்கள்’ என்பதைக் காட்டிலும் ‘வார்த்தைகள்’ பொருத்தமானது.
