base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/007.yaml
  text: And look[a], the whole family has risen up against your servant and said, ‘Give up the one who struck his brother, so that we may put him to death for the life of his brother whom he killed; and we will destroy the heir also.’ Thus they would quench my remaining ember[b], leaving my husband neither name nor remnant on the face of the earth.
translation:
  language: ta
  text: இதோ, குடும்பத்தார் அனைவரும் உமது அடியாளுக்கு எதிராக எழும்பி, ‘தன் சகோதரனை அடித்தவனை எங்களிடம் ஒப்படை. அவன் கொன்ற தன் சகோதரனின் உயிருக்குப் பதிலாக அவனை நாங்கள் கொன்றுவிடுவோம்; வாரிசையும் அழித்துவிடுவோம்’ என்கிறார்கள். இவ்வாறு, எனக்கு எஞ்சியிருக்கும் தணலை[a] அவர்கள் அணைத்து, பூமியில் என் கணவனுக்குப் பெயரோ வழித்தோன்றலோ[b] இல்லாமல் செய்துவிடுவார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: நேர்ச்சொல்லாக, ‘எனக்கு எஞ்சியிருக்கும் நெருப்புத் தணல்.’ குடும்ப வழியின் கடைசி உயிருடன் இருக்கும் நம்பிக்கையை எபிரெய மொழி இந்த உருவகத்தால் குறிப்பிடுகிறது.
    reason: lexical_alternative
  - marker: b
    text: ‘பெயரும் வழித்தோன்றலும்’ என்பது ஒருவரின் புகழை மட்டும் அல்ல, அவரது நினைவும் உயிர்வாழும் குடும்ப வழியும் தொடர்வதைக் குறிக்கிறது.
    reason: cultural_note
lexical_decisions:
- source_word: וְהִנֵּה
  choice: இதோ
  rationale: கவனத்தை ஈர்க்கும் எபிரெய இடைச்சொல்லை, நவீனத் தமிழிலும் கண்ணியமாகவும் இயல்பாகவும் ஒலிக்கும் ‘இதோ’ என்பதால் வழங்குகிறது.
- source_word: כָל הַמִּשְׁפָּחָה
  choice: குடும்பத்தார் அனைவரும்
  rationale: இங்கு குறிக்கப்படுவது விரிவான உறவினர் குழுவாக இருக்கலாம்; ‘குடும்பத்தார் அனைவரும்’ என்பது அதன் கூட்டுத் தன்மையை எளிய தமிழில் வெளிப்படுத்துகிறது.
- source_word: שִׁפְחָתֶךָ
  choice: உமது அடியாள்
  rationale: பெண் பேசுபவரின் தாழ்மையான அரசவைத் தன்னிலைக் குறிப்பை ‘அடியாள்’ இயல்பாகவும் பாலினத்தைப் பாதுகாத்தும் தருகிறது.
- source_word: קָמָה ... עַל
  choice: எதிராக எழும்பி
  rationale: வெறுமனே எழுந்து நிற்பதை அல்ல, பகைமையுடன் எதிர்ப்பதைச் சொல்லும் எபிரெய மரபுத்தொடரின் வலிமையைப் பாதுகாக்கிறது.
- source_word: תְּנִי
  choice: எங்களிடம் ஒப்படை
  rationale: நீதிசார் பழிவாங்கலுக்காக மகனைத் தங்களிடம் ஒப்படைக்க வேண்டும் என்ற கட்டாயக் கோரிக்கையைத் தெளிவாக்குகிறது.
- source_word: מַכֵּה אָחִיו
  choice: தன் சகோதரனை அடித்தவனை
  rationale: נכה என்ற சொல்லை முன்கூட்டியே ‘கொலைகாரன்’ என்று குறுக்காமல், அடுத்துள்ள ‘கொன்ற’ என்ற வெளிப்படையான கூற்றிற்கு முன் மூலத்தின் படிநிலையைப் பாதுகாக்கிறது.
- source_word: וּנְמִתֵהוּ בְּנֶפֶשׁ אָחִיו
  choice: அவன் கொன்ற தன் சகோதரனின் உயிருக்கு ஈடாக அவனை நாங்கள் கொன்றுபோடுவோம்
  rationale: உயிருக்குப் பதில் உயிர் என்ற நீதிசார் ஈடுசெய்தல் கருத்தையும், குடும்பத்தாரின் நோக்கத்தையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: הַיּוֹרֵשׁ
  choice: வாரிசு
  rationale: சொத்தைப் பெறவும் குடும்ப வழியைத் தொடரவும் இருக்கும் மகனைச் சுருக்கமாகவும் துல்லியமாகவும் குறிக்கிறது.
- source_word: וְכִבּוּ אֶת גַּחַלְתִּי אֲשֶׁר נִשְׁאָרָה
  choice: எனக்கு எஞ்சியிருக்கும் தணலை அவர்கள் அணைத்து
  rationale: குடும்பத்தின் கடைசி உயிர்வாழும் வழித்தோன்றலைக் குறிக்கும் நெருப்புத் தணல் உருவகத்தை உரையிலேயே பாதுகாக்கிறது.
- source_word: שֵׁם וּשְׁאֵרִית
  choice: பெயரோ வழித்தோன்றலோ
  rationale: ‘பெயர்’ என்ற மூலச் சொல்லைத் தக்கவைத்தும், שְׁאֵרִית இங்கு வெறும் மீதியல்ல உயிர்வாழும் சந்ததி என்பதை ‘வழித்தோன்றல்’ மூலம் தெளிவாக்கியும் வழங்குகிறது.
- source_word: עַל פְּנֵי הָאֲדָמָה
  choice: பூமியில்
  rationale: மூலத்தின் ‘நிலத்தின் மேற்பரப்பில்’ என்ற சொற்றொடரின் பொருளை இயல்பான, கண்ணியமான தமிழில் தருகிறது.
theological_decisions:
- issue: குடும்பத்தின் கடைசி வாரிசைக் குறிக்கும் உருவகம்
  choice: ‘எஞ்சியிருக்கும் தணல்’ என்ற உருவகத்தை முதன்மை உரையில் தக்கவைத்தல்
  alternative: ‘என் ஒரே மீதியான மகன்’ என்று உருவகத்தை விளக்கிப் பெயர்த்தல்
  rationale: மூல எபிரெய மொழியின் உயிருள்ள உருவகமும், குடும்ப வழி முற்றிலும் அணைந்துபோகும் துயரமும் நேரடியாகப் பாதுகாக்கப்படுகின்றன.
- issue: ‘பெயரும் மீதியும்’ என்பதன் குடும்பவழிப் பொருள்
  choice: ‘பெயரோ வழித்தோன்றலோ’
  alternative: ‘பெயரோ மீதியோ’
  rationale: ‘வழித்தோன்றல்’ என்பது சூழலில் உள்ள உயிர்வாழும் குடும்ப வரிசையைத் தெளிவுபடுத்துகிறது; ‘பெயர்’ என்பதைக் காத்திருப்பதால் நினைவும் குடும்ப அடையாளமும் சேர்ந்த மூலத் தளர்வு முற்றிலும் ஒழிக்கப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், அரசரிடம் ஒரு பெண் தாழ்மையுடன் முறையிடும் கண்ணியமான தொனி பேணப்பட்டுள்ளது. ‘உமது அடியாள்’ பெண் பேச்சாளரின் தாழ்மையான தன்னிலைக் குறிப்பைத் தக்கவைக்கிறது. மேற்கோள் பேச்சு நேரடியாகவும் தீவிரமாகவும் உள்ளது; தணல் உருவகம் விளக்கமாகச் சமப்படுத்தப்படாமல் முதன்மை உரையில் பாதுகாக்கப்பட்டுள்ளது.
