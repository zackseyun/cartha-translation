translation_notes:
  register: நவீன தரத்தமிழில் இயல்பான, கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. அரசனின் உரையில் உள்ள எபிரெயச் சொல்லாட்சியின் பரந்த தன்மையை முதன்மை உரை காக்கிறது; சூழலால் விளங்கும் ‘வேண்டுகோளை ஏற்றல்’ என்ற பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
