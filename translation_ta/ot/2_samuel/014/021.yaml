reference: 2 Samuel 14:21
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר הַ/מֶּ֨לֶךְ֙ אֶל יוֹאָ֔ב הִנֵּה נָ֥א עָשִׂ֖יתִי אֶת הַ/דָּבָ֣ר הַ/זֶּ֑ה וְ/לֵ֛ךְ הָשֵׁ֥ב אֶת הַ/נַּ֖עַר אֶת אַבְשָׁלֽוֹם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/021.yaml
  text: Then the king said to Joab[a], “Behold now, I have done this thing. Go, bring back the young man Absalom.”
translation:
  language: ta
  text: அப்போது அரசன் யோவாபிடம், “இதோ, நான் இந்தக் காரியத்தைச் செய்துவிட்டேன்.[a] நீ போய், இளைஞனாகிய அப்சலோமைத் திரும்ப அழைத்து வா” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இதோ, இந்த வேண்டுகோளை நான் ஏற்றுக்கொண்டேன்; நீ போய், இளைஞனாகிய அப்சலோமைத் திரும்ப அழைத்து வா.” எபிரெய மொழியில் இன்னும் சொல்லுக்குச் சொல்லாக, “நான் இந்தக் காரியத்தைச் செய்தேன்” என்று உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: அப்போது ... என்றான்
  rationale: வாவ் தொடர்வினை கதையின் அடுத்த நிகழ்வை முன்னெடுக்கிறது; ‘அப்போது’ இயல்பான தமிழ் கதைநடையில் அந்த வரிசையை வெளிப்படுத்துகிறது.
- source_word: הַמֶּלֶךְ
  choice: அரசன்
  rationale: எபிரெய உரையில் தனிப்பட்ட பெயருக்குப் பதிலாகத் திட்டவட்டமான பட்டமே பயன்படுத்தப்பட்டுள்ளது; அதையே தக்கவைக்கிறது.
- source_word: הִנֵּה נָא
  choice: இதோ
  rationale: הִנֵּה கவனத்தை ஈர்க்கிறது; נָא இங்கு உரையை மென்மைப்படுத்தவோ உடனடித்தன்மை அளிக்கவோ கூடும். நவீன தமிழில் ‘இதோ’ இரண்டின் கூட்டு உரையாடல் வலிமையையும் சுருக்கமாகத் தருகிறது.
- source_word: עָשִׂיתִי אֶת־הַדָּבָר הַזֶּה
  choice: நான் இந்தக் காரியத்தைச் செய்துவிட்டேன்
  rationale: ‘நான் இந்தக் காரியத்தைச் செய்தேன்’ என்ற மூலத்தின் பரந்த, நேரடி சொல்லாட்சியைப் பாதுகாக்கிறது; சூழலில் வேண்டுகோளை ஏற்றதாகப் பொருள் இருந்தாலும் அதை உரையிலேயே விளக்கிப் பதிக்கவில்லை.
- source_word: וְלֵךְ
  choice: நீ போய்
  rationale: இணைப்புச் சொல் தொடர்ந்து வரும் கட்டளையோடு செயலை இணைக்கிறது. தமிழில் ‘நீ போய் ... வா’ இயல்பான தொடர் கட்டளை அமைப்பு.
- source_word: הָשֵׁב
  choice: திரும்ப அழைத்து வா
  rationale: 'שוב என்பதன் ஹிஃபில் வடிவம் காரணவினைப் பொருளுடையது: யோவாப் அப்சலோமைத் திரும்பிவரச் செய்ய வேண்டும். ‘திரும்ப அழைத்து வா’ இதைத் தெளிவாகவும் இயல்பாகவும் காட்டுகிறது.'
- source_word: הַנַּעַר
  choice: இளைஞனாகிய
  rationale: נַעַר என்பது சூழலுக்கேற்ப சிறுவன், இளைஞன், பணியாள் எனப் பொருள்படலாம். அப்சலோம் வயதுவந்த மகன் என்பதால் ‘இளைஞன்’ வயதுசார்ந்த நுணுக்கத்தையும் கண்ணியத்தையும் காக்கிறது.
- source_word: אֶת אַבְשָׁלוֹם
  choice: அப்சலோமை
  rationale: தனிப்பெயர் தமிழில் ஒலிபெயர்க்கப்படுகிறது; ‘இளைஞனாகிய அப்சலோம்’ என்று பெயருக்கு முன் வரும் விளக்கத்தையும் தக்கவைக்கிறது.
