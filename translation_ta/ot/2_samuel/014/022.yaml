revisions:
- from: அப்போது யோவாப் தரையில் முகங்குப்புற விழுந்து, பணிந்து வணங்கி, ராஜாவை வாழ்த்தினார். பின்பு யோவாப், “என் தலைவராகிய ராஜாவே, ராஜா தமது அடியானின் சொல்லின்படி செய்ததால்[a], உமது பார்வையில் எனக்குத் தயவு கிடைத்திருக்கிறது என்பதை உமது அடியான் இன்று அறிந்துகொண்டேன்” என்றார்.
  to: அப்போது யோவாப் தரையில் முகங்குப்புற விழுந்து, பணிந்து வணங்கி, ராஜாவை ஆசீர்வதித்தார். யோவாப், “இன்று உமது பார்வையில் எனக்குத் தயவு கிடைத்திருக்கிறது என்பதை உமது அடியான் அறிந்துகொண்டேன், என் தலைவராகிய ராஜாவே; ஏனெனில், ராஜா தமது அடியானின் சொல்லை நிறைவேற்றியிருக்கிறார்[a]” என்றார்.
  rationale: The revision retains the Hebrew sequence and courtly register while rendering ברך more directly as “ஆசீர்வதித்தார்.” The final clause now preserves the Hebrew’s object expression through “அடியானின் சொல்லை நிறைவேற்றியிருக்கிறார்”; the footnote supplies the literal wording and notes the contextual sense without making that interpretation the only possible translation.
