base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/022.yaml
  text: Then Joab fell with his face to the ground[a], bowed down, and blessed the king. Joab said, “Today your servant knows that I have found favor in your eyes, my lord the king, because the king has done the word of his servant.”
translation:
  language: ta
  text: அப்போது யோவாப் தரையில் முகங்குப்புற விழுந்து, பணிந்து வணங்கி, ராஜாவை ஆசீர்வதித்தார். யோவாப், “இன்று உமது பார்வையில் எனக்குத் தயவு கிடைத்திருக்கிறது என்பதை உமது அடியான் அறிந்துகொண்டேன், என் தலைவராகிய ராஜாவே; ஏனெனில், ராஜா தமது அடியானின் சொல்லை நிறைவேற்றியிருக்கிறார்[a]” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'நேரடி மொழிபெயர்ப்பு: “ராஜா தமது அடியானின் சொல்லைச் செய்தார்.” இங்கு, ராஜா தமது அடியானின் வேண்டுகோளை ஏற்றுக்கொண்டார் என்பதே சூழலுக்கேற்ற பொருள்.'
    reason: மூலத்தின் “சொல்லைச் செய்தார்” என்ற வெளிப்பாட்டைத் தெளிவுபடுத்தி, அதன் சூழற்பொருளை விளக்குகிறது.
lexical_decisions:
- source_word: וַיִּפֹּל ... אֶל־פָּנָיו אַרְצָה
  choice: தரையில் முகங்குப்புற விழுந்து
  rationale: தரையை நோக்கி முகத்துடன் விழும் உடல் நிலையை இயல்பான நவீனத் தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: וַיִּשְׁתַּחוּ
  choice: பணிந்து வணங்கி
  rationale: மனித ராஜாவுக்கு முன் செலுத்தப்படும் அரசவை மரியாதையையும் தாழ்மையான உடல் செய்கையையும் காட்டுகிறது; தெய்வ வழிபாடு என்ற பொருளைத் திணிக்கவில்லை.
- source_word: וַיְבָרֶךְ אֶת־הַמֶּלֶךְ
  choice: ராஜாவை வாழ்த்தினார்
  rationale: ברך என்பதன் ஆசீர்வதித்தல் அல்லது நல்வாழ்த்து கூறுதல் சார்ந்த பொருளை இச்சூழலில் இயல்பாக வெளிப்படுத்துகிறது; வெறுமனே ‘நன்றி கூறினார்’ என்று குறுக்கவில்லை.
- source_word: הַיּוֹם ... יָדַע
  choice: இன்று அறிந்துகொண்டேன்
  rationale: நிகழ்ந்த செயலின் அடிப்படையில் இப்போது ஏற்பட்டுள்ள உணர்தலை எபிரெய நிறைவுற்ற வினை உணர்த்துவதால், தமிழில் முடிவுற்ற அறிதலாக வழங்கப்பட்டுள்ளது.
- source_word: עַבְדְּךָ
  choice: உமது அடியான்
  rationale: ராஜாவிடம் தன்னைத் தாழ்த்திக் குறிப்பிடும் அரசவைச் சொல்லாட்சிக்கு ‘அடியான்’ பொருத்தமானது; கட்டாய அடிமை நிலையைத் தேவையின்றி முன்னிறுத்தவில்லை.
- source_word: מָצָאתִי חֵן בְּעֵינֶיךָ
  choice: உமது பார்வையில் எனக்குத் தயவு கிடைத்திருக்கிறது
  rationale: ‘உமது கண்களில் தயவு கண்டேன்’ என்ற எபிரெய உருவகத்தை புரியத்தக்க தமிழில் காக்கிறது; தற்போதும் நிலைக்கும் சாதகநிலையையும் உணர்த்துகிறது.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: என் தலைவராகிய ராஜாவே
  rationale: மரியாதைக்குரிய நேரடி அழைப்பையும் அரச பட்டத்தையும் இயல்பான தமிழில் இணைக்கிறது.
- source_word: אֲשֶׁר
  choice: செய்ததால்
  rationale: இங்கு யோவாபின் அறிதலுக்கான காரணத்தைத் தொடர்ந்து வரும் வாசகம் விளக்குவதால் காரணத் தொடர்பு வெளிப்படையாகக் கொடுக்கப்பட்டுள்ளது.
- source_word: עָשָׂה ... אֶת־דְּבַר עַבְדּוֹ
  choice: தமது அடியானின் சொல்லின்படி செய்ததால்
  rationale: ‘தமது அடியானின் சொல்லைச் செய்தார்’ என்ற மூலமொழி வடிவத்திற்கு அருகில் இருந்து, தமிழில் இயல்பாகப் பொருள் தருகிறது. இது வேண்டுகோளை ஏற்றுக்கொண்டதைக் குறிக்கும் சூழற்பொருளையும் அனுமதிக்கிறது.
theological_decisions:
- issue: மனித ராஜாவுக்கு யோவாப் செலுத்திய வணக்கத்தின் தன்மை
  choice: அரசவை மரியாதையாக ‘பணிந்து வணங்கி’
  alternative: ‘ராஜாவை வழிபட்டு’
  rationale: இங்கு செயல் மனித அரசனுக்கு முன் செலுத்தப்படும் தாழ்மையான மரியாதை; தெய்வ வழிபாடு என்று மொழிபெயர்ப்பது மூலத்தில் இல்லாத இறையியல் கருத்தைச் சேர்க்கும்.
- issue: ‘அடியான்’ என்ற தாழ்மையான தன்குறிப்பு
  choice: அரசவைப் பணிவு மொழியாகக் காத்தல்
  alternative: சட்ட அல்லது சமூக அடிமைத்தனத்தை வலியுறுத்தும் ‘அடிமை’
  rationale: இந்த உரையாடலில் עבד என்பது ராஜாவிடம் பேசும் மரியாதைமிக்க தன்குறிப்பாகச் செயல்படுகிறது; யோவாபின் சட்டநிலையைப் பற்றிய தனிக் கூற்றாக அல்ல.
translation_notes:
  register: நவீன நிலையான தமிழில், அரசவைக்குரிய மரியாதையையும் கதைநடையின் கண்ணியத்தையும் காக்கும் நடை பயன்படுத்தப்பட்டுள்ளது. ‘ராஜா’, ‘உமது அடியான்’, ‘என் தலைவராகிய ராஜாவே’ ஆகியவை உரையாடலின் தாழ்மையான அரசவைத் தொனியைத் தக்கவைக்கின்றன.
