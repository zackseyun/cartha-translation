base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/002.yaml
  text: So Joab sent to Tekoa and took from there a wise woman[a], and he said to her, “Please pretend to be mourning, and please put on mourning clothes, and do not anoint yourself with oil[d][c][b], but be like a woman who has been mourning for the dead many days.”
translation:
  language: ta
  text: அதனால் யோவாப் தெக்கோவாவுக்கு ஆளனுப்பி, அங்கிருந்து ஞானமுள்ள ஒரு பெண்ணை வரவழைத்தார். அவர் அவளிடம், “தயவுசெய்து துக்கம் அனுசரிப்பவள்போல் நடித்து[a], துக்க உடைகளை அணிந்துகொள்[b]. எண்ணெய் பூசிக்கொள்ளாதே[c]. இறந்த ஒருவருக்காகப் பல நாட்களாகத் துக்கம் அனுசரித்துவரும் பெண்ணைப்போல் இரு[d]” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “துக்கம் அனுசரி” / “துக்கம் அனுசரிப்பவளாக நடந்துகொள்.” எபிரெய வினைச்சொல் “துக்கம் அனுசரி” என்று பொருள்படும்; ஆனால் திட்டமிட்ட தோற்றத்தின் ஒரு பகுதியாக அவள் துக்கம் அனுசரிப்பவளின் பங்கை ஏற்க வேண்டும் என்று யோவாப் சொல்வதைச் சூழல் காட்டுகிறது.
    reason: lexical_alternative
  - marker: b
    text: சொல்லுக்குச் சொல், “துக்கத்தின் உடைகளை.”
    reason: lexical_alternative
  - marker: c
    text: எண்ணெய் பூசிக்கொள்ளாமல் இருப்பது வழக்கமான உடல் பராமரிப்பையும் மகிழ்ச்சியான அலங்காரத்தையும் தவிர்த்த துக்கத்தின் ஓர் அடையாளமாக இருந்தது.
    reason: cultural_note
  - marker: d
    text: சொல்லுக்குச் சொல், “இறந்த ஒருவருக்காகப் பல நாட்களாகத் துக்கம் அனுசரிக்கும் பெண்ணைப்போல்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּקוֹעָה
  choice: தெக்கோவா
  rationale: இடப்பெயரை மொழிபெயர்க்காமல், தமிழில் தெளிவாக உச்சரிக்கக்கூடிய வகையில் ஒலிபெயர்க்கிறது.
- source_word: אִשָּׁה חֲכָמָה
  choice: ஞானமுள்ள ஒரு பெண்
  rationale: חֲכָמָה என்பதன் அடிப்படைப் பொருளான ஞானத்தைப் பாதுகாக்கிறது; சூழலில் உள்ள திறமையும் சாதுரியமும் வாசகரால் உணரப்பட இடமளிக்கிறது.
- source_word: הִתְאַבְּלִי נָא
  choice: தயவுசெய்து துக்கம் அனுசரிப்பவள்போல் நடித்து
  rationale: வினைச்சொல் நேரடியாகத் துக்கம் அனுசரிப்பதைக் குறித்தாலும், யோவாப் திட்டமிட்ட தோற்றத்தை ஏற்கச் சொல்கிறார் என்பதைச் சூழலுக்கேற்ப வெளிப்படுத்துகிறது; நேரடிப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: בִגְדֵי אֵבֶל
  choice: துக்க உடைகள்
  rationale: துக்கத்தின்போது அணியும் ஆடைகளைக் குறிக்கும் எபிரெய மரபுத்தொடருக்கு இயல்பான நவீனத் தமிழ் இணை.
- source_word: וְאַל תָּסוּכִי שֶׁמֶן
  choice: எண்ணெய் பூசிக்கொள்ளாதே
  rationale: סוך என்பது உடலில் எண்ணெய் பூசுவதைச் சுட்டுகிறது; ‘அபிஷேகம்’ என்ற வழிபாட்டுச் சொல்லைத் தவிர்த்து அன்றாட அலங்காரப் பழக்கத்தைத் தெளிவாக்குகிறது.
- source_word: זֶה יָמִים רַבִּים מִתְאַבֶּלֶת עַל מֵת
  choice: இறந்த ஒருவருக்காகப் பல நாட்களாகத் துக்கம் அனுசரித்துவரும்
  rationale: நீண்டகாலத் தொடர்ச்சியைக் காட்டும் பங்கேற்பு வடிவத்தையும், மֵת என்ற நிர்ணயமற்ற ஒருமையையும் இயல்பான தமிழில் காக்கிறது.
