translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான நடையைப் பயன்படுத்துகிறது. “ஆளனுப்பி… வரவழைத்தார்” என்பது அனுப்பி அங்கிருந்து பெண்ணைக் கொண்டுவந்தார் என்ற எபிரெய நிகழ்வோட்டத்தைத் தமிழில் தெளிவாக்குகிறது. மரியாதை ஒருமை வினைகள் கதைநடையின் கண்ணியத்தைப் பேணுகின்றன; மேற்கோளில் உள்ள கட்டளைகள் அசல் மொழியின் ஒருமை வடிவத்தைப் பின்பற்றுகின்றன.
