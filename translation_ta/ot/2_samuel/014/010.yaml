  yaml_path: translation/ot/2_samuel/014/010.yaml
  text: And the king said[a], “Whoever speaks to you, bring him to me, and he will never touch you again.”
translation:
  language: ta
  text: அரசன், “உன்னிடம் பேசுகிற யாராக இருந்தாலும், அவனை என்னிடம் அழைத்து வா; அவன் இனி உன்னை மீண்டும் தொடமாட்டான்[a]” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவன் இனி உன்னைத் தொடமாட்டான்.” இங்குள்ள எபிரெயச் சொற்றொடர் வெறும் உடல்ரீதியான தொடுதலை மட்டுமல்லாமல், பகைமையுடன் அணுகுவதையோ தீங்கு செய்வதையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמֶּלֶךְ
  choice: அரசன்
  rationale: ம definite article உடைய מֶלֶךְ என்பதற்கான இயல்பான தமிழாக்கம்; சூழலில் குறிப்பிட்ட அரசனைக் குறிக்கிறது.
- source_word: הַמְדַבֵּר אֵלַיִךְ
  choice: உன்னிடம் பேசுகிறவன் எவனாயிருந்தாலும்
  rationale: குறிப்பிட்ட பெயர்ச்சொல்லாகச் செயல்படும் எபிரெயப் பெயரெச்சத்தின் திறந்த நிபந்தனைப் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: וַהֲבֵאתוֹ אֵלַי
  choice: அவனை என்னிடம் அழைத்து வா
  rationale: בוא என்பதன் ஹிஃபில் வடிவம் ‘வரச் செய்’ என்று பொருள்பட்டு, இங்கு இயல்பாக ‘அழைத்து வா’ என வருகிறது.
- source_word: וְלֹא יֹסִיף עוֹד
  choice: அதன்பின் ... மீண்டும் ... மாட்டான்
  rationale: மேலும் தொடராமையையோ மறுபடியும் நிகழாமையையோ குறிக்கும் எபிரெயச் சொற்றொடரின் பொருளை தெளிவான நவீன தமிழில் தருகிறது.
- source_word: לָגַעַת בָּךְ
  choice: உன்னை ... தொடமாட்டான்
  rationale: נגע என்பதன் அடிப்படைப் பொருளான ‘தொடு’ என்பதை முதன்மை உரையில் காக்கிறது; இச்சூழலில் தீங்கிழைக்கும் தொடர்பைக் குறிக்கக்கூடிய நுட்பம் அடிக்குறிப்பில் தரப்படுகிறது.
