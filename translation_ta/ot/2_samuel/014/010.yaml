translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான அரசவைக் கூற்றாக வடிவமைக்கப்பட்டது. ‘தொடு’ என்ற மூலச் சொல்லின் வெளிப்படையான பொருள் காக்கப்பட்டு, சூழல்சார் தீங்கு என்ற சாத்தியம் அடிக்குறிப்பில் வைக்கப்பட்டது.
