  register: நவீன நிலையான தமிழ்; வேதாகம வரலாற்றுரைக்கு ஏற்ற கண்ணியமான நடை. அப்சலோம் யோவாபிடம் பேசுவதால் மரியாதைப் பன்மை பயன்படுத்தப்பட்டுள்ளது. மூல எபிரெயத்தின் நேரடி மேற்கோளுக்குள் உள்ள மேற்கோள் அமைப்பும், ‘அரசரின் முகம்’ என்ற உருவகமும் காக்கப்பட்டுள்ளன.
