base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/032.yaml
  text: Absalom said to Joab[a], “Look, I sent word to you, saying, ‘Come here, so that I may send you to the king, to say, “Why have I come from Geshur? It would be better for me still to be there.”’ Now then, let me see the king’s face; and if there is guilt in me[b], let him put me to death.”
translation:
  language: ta
  text: அப்சலோம் யோவாபிடம், “இதோ, ‘இங்கே வாரும்; அரசரிடம் சென்று, “நான் ஏன் கேசூரிலிருந்து வந்தேன்? நான் இன்னும் அங்கேயே இருந்திருந்தால் எனக்கு நல்லதாக இருந்திருக்கும்” என்று சொல்லும்படி உம்மை அனுப்புவதற்காக உமக்குச் செய்தி அனுப்பினேன்.’ இப்போது நான் அரசரின் முகத்தைப் பார்க்கட்டும்[a]. என்னிடம் குற்றம் இருந்தால், அவர் என்னைக் கொன்றுபோடட்டும்” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அரசரின் முகத்தைப் பார்க்க” என்பது அரசரின் முன்னிலையில் ஆஜராவதைக் குறிக்கும் எபிரெய மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: இதோ
  rationale: கவனத்தை ஈர்க்கும் எபிரெய உரையாடல் குறிப்பை, நவீனத் தமிழிலும் இயல்பாகவும் கண்ணியமாகவும் தருகிறது.
- source_word: שָׁלַחְתִּי אֵלֶיךָ
  choice: உமக்குச் செய்தி அனுப்பினேன்
  rationale: இச்சூழலில் நேரடியாக ஏதோ பொருளை அனுப்புவதை அல்ல, அழைப்புச் செய்தி அனுப்பியதைக் குறிக்கிறது.
- source_word: בֹּא הֵנָּה
  choice: இங்கே வாரும்
  rationale: கட்டளையையும் இடச்சுட்டையும் நேரடியாகவும் இயல்பாகவும் மொழிபெயர்க்கிறது.
- source_word: וְאֶשְׁלְחָה אֹתְךָ אֶל הַמֶּלֶךְ
  choice: நான் உம்மை அரசரிடம் அனுப்பி ... கேட்கச் செய்ய வேண்டும்
  rationale: அழைத்ததன் நோக்கம் யோவாபை அரசரிடம் தூதனாக அனுப்புவதே என்பதைத் தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: לָמָּה בָּאתִי מִגְּשׁוּר
  choice: நான் ஏன் கேசூரிலிருந்து வந்தேன்?
  rationale: மூலத்தின் முதலாம் நபர் செயப்பாட்டு வடிவத்தை அப்படியே காக்கிறது; காரணமின்றித் திரும்பிவந்ததாக அப்சலோம் முறையிடும் தொனியும் நிலைக்கிறது.
- source_word: טוֹב לִי עוֹד אֲנִי שָׁם
  choice: நான் இன்னும் அங்கேயே இருந்திருந்தால் எனக்கு நன்றாயிருந்திருக்கும்
  rationale: எபிரெய மொழியில் சுருக்கமாக விடப்பட்டுள்ள ஒப்பீட்டை இயல்பான தமிழில் வெளிப்படுத்துகிறது; கேசூரிலேயே தொடர்ந்திருப்பது மேலானது என்ற பொருளைக் காக்கிறது.
- source_word: וְעַתָּה
  choice: இப்போதாவது
  rationale: காரணவிளைவாக மாற்றாமல், முறையீட்டிலிருந்து வலியுறுத்திய கோரிக்கைக்குச் செல்லும் காலவழி மாற்றத்தைக் காட்டுகிறது.
- source_word: אֶרְאֶה פְּנֵי הַמֶּלֶךְ
  choice: நான் அரசரின் முகத்தைப் பார்க்கட்டும்
  rationale: அரசரின் முன்னிலையில் ஆஜராவதைக் குறிக்கும் எபிரெய உருவகத்தைத் தமிழில் புரியத்தக்க வகையில் பாதுகாக்கிறது.
- source_word: עָוֺן
  choice: குற்றம்
  rationale: தவறையும் அதனால் உண்டாகும் குற்றப்பொறுப்பையும் உள்ளடக்கும் நீதிசார் சூழலுக்கு ஏற்ற சொல்.
- source_word: וֶהֱמִתָנִי
  choice: அவர் என்னைக் கொன்றுபோடட்டும்
  rationale: ‘என்னைச் சாகச்செய்யட்டும்’ என்ற காரணவினைப் பொருளை இயல்பான, ஆனால் தீவிரத்தைக் குறைக்காத தமிழில் தருகிறது; முறையான மரணதண்டனை என்று தேவையின்றி குறிப்பாக்கவில்லை.
