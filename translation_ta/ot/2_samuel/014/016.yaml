  yaml_path: translation/ot/2_samuel/014/016.yaml
  text: For the king will hear[b][a], to deliver his servant from the hand of the man who would destroy me and my son together from the inheritance of God.
translation:
  language: ta
  text: ஏனெனில், என்னையும் என் மகனையும் கடவுளின் சுதந்தரத்திலிருந்து[a] ஒருசேர அழித்தொழிக்க நினைக்கும் அந்த மனிதனின் கையிலிருந்து தமது பணிப்பெண்ணை[b] விடுவிக்க அரசர் செவிகொடுப்பார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “கடவுள் தந்த சுதந்தரம்” என்றும் பொருள் கொள்ளலாம். இது கடவுள் இஸ்ரவேலுக்குள் ஒதுக்கிய மரபுரிமைப் பங்கைக் குறிக்கலாம்; அல்லது கடவுளுக்குச் சொந்தமான சுதந்தரம் அல்லது மக்களைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயச் சொல் குறிப்பாகப் பெண்பால் பணியாளைக் குறிக்கிறது; அந்தப் பெண் அரசரிடம் தன்னைத் தாழ்த்திக் கூறுகிறாள்.
    reason: lexical_clarification
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய கூற்றுக்கான காரணத்தையோ நம்பிக்கையின் அடிப்படையையோ அறிமுகப்படுத்தும் விளக்கத் தொடர்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: יִשְׁמַע
  choice: செவிகொடுப்பார்
  rationale: שׁמע இங்கு வெறுமனே ஒலி கேட்பதைவிட வேண்டுகோளைக் கேட்டு ஏற்றுச் செயல்படுவதைக் குறிக்கிறது; தொடர்ந்து வரும் விடுவிக்கும் செயலை இயல்பாக இணைக்கிறது.
- source_word: לְהַצִּיל
  choice: விடுவிக்க
  rationale: נצל என்பதன் ஹிஃபில் வடிவிலுள்ள ஆபத்திலிருந்து மீட்டு விடுவித்தல் என்ற பொருளைப் பாதுகாக்கிறது.
- source_word: אֲמָתוֹ
  choice: தமது பணிப்பெண்ணை
  rationale: எபிரெயச் சொல் குறிப்பாகப் பெண்பால் பணியாளைக் குறிக்கிறது; அரசரிடம் தன்னைத் தாழ்த்திப் பேசும் மன்ற மொழியையும் தமிழில் காக்கிறது.
- source_word: מִכַּף הָאִישׁ
  choice: அந்த மனிதனின் கையிலிருந்து
  rationale: கை என்பது அதிகாரம் அல்லது பிடியைக் குறிக்கும் எபிரெய மரபுத்தொடர்; மூலத்தின் உருவகத்தைத் தக்கவைக்கிறது.
- source_word: לְהַשְׁמִיד
  choice: அழித்து ... அகற்ற நினைக்கும்
  rationale: அந்த மனிதனின் அழிவுக்குரிய நோக்கத்தைத் தமிழில் தெளிவாக வெளிப்படுத்துகிறது; மரபுரிமையிலிருந்து நீக்கப்படுதல் என்பது அழிவின் விளைவாகக் காட்டப்படுகிறது.
- source_word: יַחַד
  choice: ஒன்றாக
  rationale: தாயும் மகனும் ஒருசேர இலக்காக்கப்படுவதைச் சுருக்கமாக வலியுறுத்துகிறது.
- source_word: מִנַּחֲלַת אֱלֹהִים
  choice: கடவுள் தந்த உரிமைச் சொத்திலிருந்து
  rationale: נחלה என்பதிலுள்ள ஒதுக்கப்பட்ட மரபுரிமை/பங்கின் கருத்தை இயல்பான தமிழில் தருகிறது; எபிரெய மரபுத்தொடரின் மாற்றுப் புரிதலை அடிக்குறிப்பில் காக்கிறது.
theological_decisions:
- issue: “கடவுளின் உரிமைச் சொத்து” என்ற தொடரின் பொருள்
  choice: கடவுள் இஸ்ரவேலுக்குள் ஒதுக்கித் தந்த மரபுரிமைப் பங்கு; குடும்ப வரிசை அழிந்தால் அதிலிருந்து தாயும் மகனும் அகற்றப்படுவர்.
  alternative: கடவுளுக்கே சொந்தமான மக்கள் அல்லது உடைமை.
  rationale: உடனடிச் சூழல் குடும்ப வரிசையின் அழிவையும் இஸ்ரவேலுக்குள் உள்ள மரபுரிமைப் பங்கை இழப்பதையும் பற்றியது. எனினும் எபிரெயத் தொடர் யாருடைய உடைமை என்பதை இலக்கண ரீதியாக முற்றிலும் தீர்மானிக்காததால் மாற்றுப் புரிதல் அடிக்குறிப்பில் வைக்கப்படுகிறது.
translation_notes:
  register: நவீன செந்தமிழுக்கு ஏற்ற, எளிதில் புரியும் மரியாதைமிக்க மன்றநடை பயன்படுத்தப்பட்டுள்ளது. “தமது” என்பது அரசரைக் குறிக்கும் மரியாதைப் பன்மை. மூலத்தின் “கை” உருவகம் காக்கப்பட்டு, שׁמע என்பதன் சூழல்சார் பொருள் “செவிகொடுப்பார்” என வழங்கப்பட்டுள்ளது.
