- from: ஏனெனில், என்னையும் என் மகனையும் ஒன்றாக அழித்து, கடவுள் தந்த உரிமைச் சொத்திலிருந்து[a] அகற்ற நினைக்கும் அந்த மனிதனின் கையிலிருந்து தமது பணிப்பெண்ணை[b] விடுவிக்க அரசர் செவிகொடுப்பார்.
  to: ஏனெனில், என்னையும் என் மகனையும் கடவுளின் சுதந்தரத்திலிருந்து[a] ஒருசேர அழித்தொழிக்க நினைக்கும் அந்த மனிதனின் கையிலிருந்து தமது பணிப்பெண்ணை[b] விடுவிக்க அரசர் செவிகொடுப்பார்.
  rationale: The revision retains the feminine court-language self-designation and the ‘hand’ idiom, while replacing the interpretively narrowed “கடவுள் தந்த உரிமைச் சொத்து” with “கடவுளின் சுதந்தரம்” to preserve the Hebrew construct ambiguity. It also expresses the man’s hostile aim as one act of destruction/cutting off, rather than two separate acts.
