revisions:
- from: இப்போது, மக்கள் என்னைப் பயமுறுத்தியதால், இந்தக் காரியத்தை என் ஆண்டவராகிய அரசரிடம் பேச வந்தேன். அப்போது உமது பணிப்பெண், ‘அரசரிடம் பேசுவேனாக; ஒருவேளை அரசர் தமது பணிப்பெண்ணின் வேண்டுகோளை நிறைவேற்றுவார்’ என்று நினைத்தாள்.[a]
