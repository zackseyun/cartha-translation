translation_notes:
  register: நவீனத் தரத் தமிழில், அரசவைக்குரிய மரியாதையும் பெண் பேசுபவரின் பணிவான சுயகுறிப்பும் காக்கப்பட்டுள்ளன. ‘பணிப்பெண்’ என்பது שִׁפְחָה மற்றும் אָמָה ஆகிய பெண்பால் பணியாளர் சொற்களை இயல்பாக பிரதிபலிக்கிறது.
