base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/015.yaml
  text: And now I have come to speak this matter to my lord the king[a], because the people have frightened me. And your servant said, ‘Please let me speak to the king[b]; perhaps the king will do the word of his servant.’
translation:
  language: ta
  text: இப்பொழுதோ, மக்கள் என்னைப் பயமுறுத்தியதால், இந்தக் காரியத்தை என் ஆண்டவராகிய அரசரிடம் பேச வந்தேன். உமது பணிப்பெண், ‘தயவுசெய்து, நான் அரசரிடம் பேசுவேனாக; ஒருவேளை அரசர் தமது பணிப்பெண்ணின் வேண்டுகோளை நிறைவேற்றுவார்’ என்று சொன்னாள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரெயத்தில் சொல்லுக்கு சொல்: “அரசர் தமது பணிப்பெண்ணின் வார்த்தையைச் செய்வார்”; இங்கே “வார்த்தை” என்பது அவளுடைய வேண்டுகோளை அல்லது முறையீட்டைக் குறிக்கிறது.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: இப்போது
  rationale: பேச்சின் தற்போதைய விளக்கத்தை அறிமுகப்படுத்தும் இணைப்புச் சொல்; தமிழில் இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: אֲשֶׁר בָּאתִי לְדַבֵּר
  choice: பேச வந்தேன்
  rationale: வருதல் மற்றும் பேசுதல் ஆகிய இரு கூறுகளையும் இயல்பான தமிழில் காக்கிறது.
- source_word: אֶל הַמֶּלֶךְ אֲדֹנִי
  choice: என் ஆண்டவராகிய அரசரிடம்
  rationale: அரசருக்குரிய பட்டத்தையும் மரியாதையான அழைப்பையும் தக்கவைக்கிறது.
- source_word: אֶת הַדָּבָר הַזֶּה
  choice: இந்தக் காரியத்தை
  rationale: דבר என்பது இங்கே தனிப்பட்ட சொல்லை அல்ல, அவள் முன்வைக்கும் வழக்கு அல்லது கோரிக்கை சார்ந்த காரியத்தைக் குறிக்கிறது.
- source_word: כִּי יֵרְאֻנִי הָעָם
  choice: மக்கள் என்னைப் பயமுறுத்தியதால்
  rationale: வினைச்சொல்லின் causative பொருளான ‘பயப்படச் செய்தனர்’ என்பதைக் காக்கிறது; ‘மக்கள் எனக்குப் பயப்படுகிறார்கள்’ என்ற வாசிப்பைத் தவிர்க்கிறது.
- source_word: וַתֹּאמֶר שִׁפְחָתְךָ
  choice: அப்போது உமது பணிப்பெண் ... என்று நினைத்தாள்
  rationale: பெண் பேசுபவரின் தாழ்மையான அரண்மனைச் சுயகுறிப்பைத் தக்கவைக்கிறது; இச்சூழலில் אמר என்பது உள்ளார்ந்த தீர்மானத்தை அறிமுகப்படுத்துவதால் ‘நினைத்தாள்’ என இயல்பாக வழங்கப்பட்டுள்ளது.
- source_word: אֲדַבְּרָה נָּא אֶל הַמֶּלֶךְ
  choice: அரசரிடம் பேசுவேனாக
  rationale: cohortative வடிவத்தின் பணிவான தீர்மானம் அல்லது விருப்பத்தைத் தமிழில் காக்கிறது.
- source_word: אוּלַי
  choice: ஒருவேளை
  rationale: உறுதியின்மையை மரியாதையான நடையில் வெளிப்படுத்துகிறது.
- source_word: יַעֲשֶׂה הַמֶּלֶךְ אֶת דְּבַר אֲמָתוֹ
  choice: அரசர் தமது பணிப்பெண்ணின் வேண்டுகோளை நிறைவேற்றுவார்
  rationale: சொல்லுக்கு சொல் ‘பணிப்பெண்ணின் வார்த்தையைச் செய்வார்’; இச்சூழலில் அது அவளுடைய வேண்டுகோளை ஏற்று நிறைவேற்றுவதைக் குறிக்கிறது. பெண்பால் பணியாளர் குறிப்பு வெளிப்படையாகக் காக்கப்பட்டுள்ளது.
