  text: וַ/יָּבֹ֨א יוֹאָ֣ב אֶל הַ/מֶּלֶךְ֮ וַ/יַּגֶּד ל/וֹ֒ וַ/יִּקְרָ֤א אֶל אַבְשָׁלוֹם֙ וַ/יָּבֹ֣א אֶל הַ/מֶּ֔לֶךְ וַ/יִּשְׁתַּ֨חוּ ל֧/וֹ עַל אַפָּ֛י/ו אַ֖רְצָ/ה לִ/פְנֵ֣י הַ/מֶּ֑לֶךְ וַ/יִּשַּׁ֥ק הַ/מֶּ֖לֶךְ לְ/אַבְשָׁלֽוֹם־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/033.yaml
  text: Then Joab came to the king and told him[a], and he called for Absalom. So he came to the king and bowed himself with his face to the ground before the king[b], and the king kissed Absalom.
translation:
  language: ta
  text: அப்போது யோவாப் அரசனிடம் வந்து அவருக்குத் தெரிவித்தான். அரசன் அப்சலோமை வரவழைத்தான்[a]. அப்சலோம் அரசனிடம் வந்து, அரசனுக்கு முன்பாகத் தரையில் முகங்குப்புற விழுந்து வணங்கினான். பின்னர் அரசன் அப்சலோமுக்கு முத்தமிட்டான்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அப்சலோமை அழைத்தான்.”
    reason: lexical_alternative
  - marker: b
    text: அரசனின் இந்த முத்தம் ஒப்புரவு ஏற்பட்டதையோ மீண்டும் ஆதரவு அளிக்கப்பட்டதையோ குறிக்கலாம்; ஆனால் உரை அவர் முத்தமிட்டார் என்று மட்டுமே கூறுகிறது.
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּבֹא יוֹאָב אֶל־הַמֶּלֶךְ
  choice: யோவாப் அரசனிடம் வந்து
  rationale: בוא என்பது அரசனை நோக்கிய வருகையைக் குறிக்கிறது. ‘அரசனிடம் வந்து’ என்பது இயக்கத்தையும் அரசவைக் காட்சியையும் இயல்பான தமிழில் தருகிறது.
- source_word: וַיַּגֶּד לוֹ
  choice: அவருக்குத் தெரிவித்தான்
  rationale: נגד என்பதன் Hiphil வடிவம் ‘தெரிவித்தல்/அறிவித்தல்’ என்று பொருள்படும். எதைத் தெரிவித்தான் என்பதை எபிரெய உரை வெளிப்படையாகக் கூறாததால், தமிழிலும் பொருளைச் சேர்க்காமல் விடப்பட்டுள்ளது.
- source_word: וַיִּקְרָא אֶל־אַבְשָׁלוֹם
  choice: அரசன் அப்சலோமை வரவழைத்தான்
  rationale: அரசவைக் சூழலில் קרא אל என்பது ஒருவரைத் தன் முன்னிலைக்கு அழைப்பதைக் குறிக்கிறது. அடுத்ததாக அப்சலோம் அரசனிடம் வருவதால், ‘வரவழைத்தான்’ சூழலுக்கேற்ற இயல்பான தமிழாகும். எபிரெயில் எழுவாய் வெளிப்படையாகப் பெயரிடப்படாவிட்டாலும், சூழல் அரசனையே சுட்டுகிறது.
- source_word: וַיִּשְׁתַּחוּ לוֹ
  choice: விழுந்து வணங்கினான்
  rationale: שׁחה இங்கு ஆழ்ந்த பணிவுடன் குனிந்து வணங்குவதைக் குறிக்கிறது. தொடர்ந்து வரும் ‘தரையில் முகங்குப்புற’ என்ற சொற்றொடருடன் சேர்ந்து முழுமையான பணிவீழ்ச்சியைத் தெளிவாக்குகிறது.
- source_word: עַל־אַפָּיו אַרְצָה
  choice: தரையில் முகங்குப்புற
  rationale: சொல்லுக்கு நெருக்கமாக ‘தரையை நோக்கித் தன் முகத்தின்மேல்’ என்ற உடல்நிலையை குறிக்கிறது. ‘தரையில் முகங்குப்புற’ என்பது சுருக்கமான, இயல்பான நவீனத் தமிழ்.
- source_word: לִפְנֵי הַמֶּלֶךְ
  choice: அரசனுக்கு முன்பாக
  rationale: לפני என்பதன் அரசவைக் காட்சிக்குரிய நேரடி பொருளை இயல்பாகப் பாதுகாக்கிறது.
- source_word: וַיִּשַּׁק הַמֶּלֶךְ לְאַבְשָׁלוֹם
  choice: அரசன் அப்சலோமுக்கு முத்தமிட்டான்
  rationale: נשׁק இங்கு நேரடியான முத்தமிடும் செயலைக் குறிக்கிறது. அதன் அடையாளப் பொருளை முதன்மை உரையில் விளக்கிச் சேர்க்காமல், எபிரெயின் செயலை மட்டும் தருகிறது.
theological_decisions:
- issue: அரசன் கொடுத்த முத்தத்தின் பொருள்
  choice: அரசன் அப்சலோமுக்கு முத்தமிட்டதாக மட்டும் நேரடியாக மொழிபெயர்க்கப்பட்டது.
  alternative: இது ஒப்புரவு ஏற்பட்டதையோ அரசனுடைய ஆதரவு மீண்டும் கிடைத்ததையோ வெளிப்படையாகக் குறிப்பிடுகிறது என்று மொழிபெயர்த்தல்.
  rationale: கதையின் சூழலில் அந்த முத்தம் ஒப்புரவு அல்லது மீட்டளிக்கப்பட்ட ஆதரவைக் குறிக்கக்கூடும். ஆனாலும் எபிரெய உரை முத்தமிட்ட செயலை மட்டுமே கூறுவதால், அதன் முழுப் பொருள் முதன்மை உரையில் தீர்மானிக்கப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், அரசவைக் காட்சிக்கேற்ற கண்ணியமான ஆனால் பொதுவாசகர்களுக்கு எளிதில் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. தேவையற்ற பழந்தமிழ் வடிவங்களும் விளக்கச் சேர்க்கைகளும் தவிர்க்கப்பட்டுள்ளன. ‘அரசன்’ என்பதற்கு மரியாதை ஒருமை சுட்டுப்பெயர் பயன்படுத்தப்பட்டாலும், வினைமுற்றுகள் வேதாகமக் கதைநடைக்கேற்ற இயல்பான ஒருமையில் உள்ளன.
