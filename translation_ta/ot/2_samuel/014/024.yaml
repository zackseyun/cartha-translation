base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/024.yaml
  text: But the king said[a], “Let him turn aside to his own house, and let him not see my face.” So Absalom turned aside to his own house and did not see the king’s face.
translation:
  language: ta
  text: ஆனால் அரசன், “அவன் தன் வீட்டுக்குத் திரும்பிச் செல்லட்டும்; என் முகத்தைப் பார்க்கக் கூடாது[a]” என்றான். எனவே அப்சலோம் தன் வீட்டுக்குத் திரும்பிச் சென்றான்; அரசனின் முகத்தை அவன் பார்க்கவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மொழியில், “என் முகத்தைப் பார்க்க” / “அரசனின் முகத்தைப் பார்க்க.” இது ஒருவரின் முன்னிலைக்கு வருவதையோ அவரைச் சந்திக்க அனுமதி பெறுவதையோ குறிக்கும் மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִסֹּב / וַיִּסֹּב (סבב)
  choice: திரும்பிச் செல்லட்டும் / திரும்பிச் சென்றான்
  rationale: இவ்விடத்தில் வினைச்சொல் அரசனிடம் வராமல் தன் வீட்டை நோக்கித் திருப்பி அனுப்பப்படுவதைக் குறிக்கிறது. இரு இடங்களிலும் ஒரே சொற்றொடரைப் பயன்படுத்துவது எபிரெய மூலத்தின் மீளுரைப்பைப் பாதுகாக்கிறது.
- source_word: בֵּיתוֹ
  choice: தன் வீடு
  rationale: בַּיִת என்பதன் அடிப்படைப் பொருளான ‘வீடு’ என்பதையும் உடைமைப் பின்னொட்டையும் இயல்பான தமிழில் தருகிறது.
- source_word: וּפָנַי ... לֹא יִרְאֶה
  choice: என் முகத்தைப் பார்க்கக் கூடாது
  rationale: அரசனின் முன்னிலைக்கு வருவதைக் குறிக்கும் எபிரெய மரபுத்தொடரைச் சொல்லாட்சியோடு பாதுகாக்கிறது; அரச கட்டளையின் மறுப்பையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: וּפְנֵי הַמֶּלֶךְ לֹא רָאָה
  choice: அரசனின் முகத்தை அவன் பார்க்கவில்லை
  rationale: முந்தைய கட்டளையிலுள்ள ‘முகத்தைப் பார்’ என்ற மரபுத்தொடரின் திட்டமிட்ட மீளுரைப்பைப் பாதுகாக்கிறது.
- source_word: הַמֶּלֶךְ
  choice: அரசன்
  rationale: מֶלֶךְ என்பதற்கான இயல்பான நவீனத் தமிழ்ச் சொல்.
- source_word: אַבְשָׁלוֹם
  choice: அப்சலோம்
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் பரவலாக அறியப்படும் பெயர்வடிவம்.
- source_word: וַיֹּאמֶר
  choice: ஆனால் அரசன் ... என்றான்
  rationale: தொடர்ச்சியைக் குறிக்கும் waw இங்கு முந்தைய நிகழ்வுக்கு எதிரான திருப்பத்தையும் உணர்த்துவதால் ‘ஆனால்’ பொருத்தமானது.
theological_decisions:
- issue: ‘என் முகத்தைப் பார்க்க / அரசனின் முகத்தைப் பார்க்க’ என்ற மரபுத்தொடரை நேரடியாக வைப்பதா, அரசனின் முன்னிலைக்கு வருதல் என்று விளக்குவதா
  choice: மரபுத்தொடரை முதன்மை உரையில் நேரடியாகப் பாதுகாத்தல்
  alternative: ‘என் முன்னிலைக்கு வரக் கூடாது’ / ‘அரசனைச் சந்திக்க அனுமதிக்கப்படவில்லை’
  rationale: மூலத்தில் இருமுறை வரும் ‘முகம்’ என்ற உருவகத்தை இது பாதுகாக்கிறது; அரசனைச் சந்திக்கும் அனுமதி குறித்த உட்பொருளை அடிக்குறிப்பு தெளிவுபடுத்துகிறது, ஆனால் முதன்மை உரை தேவைக்கு மீறி விளக்கப்படவில்லை.
translation_notes:
  register: நவீன, மரியாதைமிக்க, பொதுவாசகர்களுக்குப் புரியும் தமிழ். அரசனின் கட்டளைக்கும் அதன் நிறைவேற்றத்திற்கும் இடையிலான எபிரெய மீளுரைப்பைப் பாதுகாக்க ‘தன் வீட்டுக்குத் திரும்பிச் செல்ல’ மற்றும் ‘முகத்தைப் பார்க்க’ என்பவை இருமுறையும் ஒத்த வடிவில் தரப்பட்டுள்ளன.
