base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/011.yaml
  text: Then she said[a], “Please let the king remember Yahweh your God, so that the avenger of blood may not continue to destroy, and they may not destroy my son.” And he said, “As Yahweh lives[b], not one hair of your son shall fall to the ground.”
translation:
  language: ta
  text: அப்போது அவள், “இரத்தப்பழி தீர்ப்பவன்[a] மேலும் அழிக்காதபடியும், அவர்கள் என் மகனை அழித்துவிடாதபடியும், அரசர் தம் கடவுளாகிய யாவேவை நினைவுகூரும்படி வேண்டுகிறேன்” என்றாள். அதற்கு அவர், “யாவே உயிரோடிருக்கிறவர்மேல் ஆணையாக, உன் மகனின் ஒரு முடிகூடத் தரையில் விழாது[b]” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அதாவது, கொல்லப்பட்ட ஒருவருக்காக இரத்தப்பழி தீர்க்கும் பொறுப்புள்ள நெருங்கிய உறவினர்.
    reason: lexical_alternative
  - marker: b
    text: இது முழுமையான பாதுகாப்பை உறுதியளிக்கும் எபிரெய மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִזְכָּר נָא
  choice: அரசர் ... நினைவுகூர வேண்டுகிறேன்
  rationale: வேண்டுகோளை மென்மையாக்கும் நָא உடன் வரும் வினை வடிவை, அரசரிடம் மரியாதையுடன் வைக்கப்படும் பணிவான விண்ணப்பமாக இயல்பான தமிழில் வழங்குகிறது.
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: தமது கடவுளாகிய யாவேவை
  rationale: தமிழின் மரியாதை வழக்கிற்கு ஏற்ப இரண்டாம் நபர் உரிமைப்பெயர் ‘தமது’ என்று வழங்கப்பட்டது; יהוה என்ற தனிப்பெயர் ‘யாவே’ என்று நேரடியாகப் பெயர்க்கப்பட்டது.
- source_word: מֵהַרְבּוֹת גֹּאֵל הַדָּם לְשַׁחֵת
  choice: இரத்தப்பழி வாங்குகிறவன் அழிவை மேலும் பெருக்காதபடியும்
  rationale: רבה என்பதன் causative வடிவிலுள்ள ‘மேலும் செய்தல்/பெருக்குதல்’ என்ற தொடர்ச்சிசார் வலிமையையும், שׁחת என்பதன் அழிவுச் சார்ந்த பொருளையும் காக்கிறது; பழிவாங்குபவர்களின் எண்ணிக்கை பெருகுகிறது என்று தேவையின்றி முடிவுசெய்யவில்லை.
- source_word: גֹּאֵל הַדָּם
  choice: இரத்தப்பழி வாங்குகிறவன்
  rationale: கொல்லப்பட்ட உறவினருக்காக இரத்தப்பழி தீர்க்கும் உறவினரைக் குறிக்கும் சட்ட-பண்பாட்டுச் சொல்லை, பொதுவாசகருக்கு புரியும் வகையில் வழங்குகிறது.
- source_word: וְלֹא יַשְׁמִידוּ אֶת־בְּנִי
  choice: அவர்கள் என் மகனை அழித்துவிடாதபடியும்
  rationale: எபிரெயத்தில் திடீரென வரும் பன்மை வினையை ‘அவர்கள்’ என்று காத்து, பழிவாங்கும் தரப்பினரை அளவுக்கு மீறி குறிப்பாக்காமல் விடுகிறது.
- source_word: חַי יְהוָה
  choice: யாவே உயிருள்ளவர் என்பது உறுதி!
  rationale: இது ஓர் ஆணைச் சூத்திரம் என்பதை இயல்பான, கண்ணியமான தமிழில் உணர்த்தி, தெய்வீகப் பெயரையும் உயிருள்ளவர் என்ற வலியுறுத்தலையும் காக்கிறது.
- source_word: אִם יִפֹּל מִשַּׂעֲרַת בְּנֵךְ אָרְצָה
  choice: உன் மகனின் ஒரு முடிகூடத் தரையில் விழாது
  rationale: ஆணைக்குப் பின் வரும் אִם வலுவான மறுப்பாகச் செயல்படுவதைக் காட்டுகிறது; முழுமையான பாதுகாப்பைக் குறிக்கும் எபிரெய மரபுத்தொடரையும் தக்கவைக்கிறது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூலத்தில் வரும் உடன்படிக்கைத் தனிப்பெயரை பொதுப்பட்டத்தால் மாற்றாமல் ஒலிபெயர்த்து வழங்குகிறது.
- issue: மீட்பர்/பழிவாங்குபவர் பற்றிய சொல்லின் சட்டப் பொருள்
  choice: இரத்தப்பழி வாங்குகிறவன்
  alternative: இரத்த மீட்பன்
  rationale: גאל என்பதன் உறவினர் சார்ந்த கடமையை ஒப்புக்கொண்டபடியே, இச்சூழலில் அவர் மேற்கொள்ளும் இரத்தப்பழி நடவடிக்கையைத் தெளிவாகக் காட்டுகிறது; ‘மீட்பன்’ என மட்டும் கூறுவது இங்கு தவறாகப் புரியலாம்.
- issue: ஒருமையிலிருந்து பன்மைக்கு மாறும் செய்பவர்
  choice: ‘இரத்தப்பழி வாங்குகிறவன்’ என்பதற்குப் பின் ‘அவர்கள்’ என்று பன்மையைப் பாதுகாத்தல்
  alternative: இரண்டையும் ஒருமையாக ஒற்றுமைப்படுத்துதல்
  rationale: மூல உரையின் இலக்கண மாற்றத்தைச் சீராக்காமல் காக்கிறது; அது ஒரே சட்டப் பிரதிநிதியையும் அவருடன் செயல்படும் உறவினரையும் குறிக்கக்கூடும்.
translation_notes:
  register: நவீன நிலையான தமிழில் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. அரசரை நேரடியாகச் சுட்டும் இடத்தில் தமிழின் மரியாதை வழக்கின்படி ‘அரசர் தமது’ என வழங்கப்பட்டுள்ளது. மூலத்தின் ஒருமை–பன்மை மாறுபாடும் ஆணை மொழியின் வலிமையும் காக்கப்பட்டுள்ளன.
