translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. அரசன் பெண்ணை ஒருமையில் அழைக்கும் எபிரேய வடிவத்தை ‘உனக்கு’ என்று இயல்பாகத் தக்கவைத்துள்ளோம். அசல் மொழியில் உள்ள வலியுறுத்தல்/புலம்பல் சாத்தியத்தை அடிக்குறிப்பு பாதுகாக்கிறது.
