  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יֹּֽאמֶר לָ֥/הּ הַ/מֶּ֖לֶךְ מַה לָּ֑/ךְ וַ/תֹּ֗אמֶר אֲבָ֛ל אִשָּֽׁה אַלְמָנָ֥ה אָ֖נִי וַ/יָּ֥מָת אִישִֽׁ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/005.yaml
  text: The king said to her[a], “What is the matter?” She said, “Indeed, I am a widow[b], and my husband has died.”
translation:
  language: ta
  text: அரசன் அவளிடம், “உனக்கு என்ன ஆயிற்று?[a]” என்று கேட்டான். அதற்கு அவள், “உண்மையாகவே, நான் ஒரு விதவை[b]; என் கணவர் இறந்துவிட்டார்” என்றாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உனக்கு என்ன பிரச்சினை?”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “ஐயோ, நான் ஒரு விதவை.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מַה לָּךְ
  choice: உனக்கு என்ன நேர்ந்தது?
  rationale: ‘உனக்கு என்ன?’ என்ற எபிரேய மரபுத்தொடர், ஒருவருக்கு என்ன பிரச்சினை அல்லது துயரம் ஏற்பட்டுள்ளது என்று விசாரிக்கிறது. ‘உனக்கு என்ன நேர்ந்தது?’ என்பது அதன் நேரடியாக ஒருவரை நோக்கிய விசாரணைத் தன்மையை இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: אֲבָל
  choice: உண்மையாகவே
  rationale: இங்கு இச்சொல் எதிர்மறை இணைப்புச்சொல்லான ‘ஆனால்’ என்பதைக் காட்டிலும், அவள் கூறப்போகும் கூற்றை வலியுறுத்தும் இடைச்சொல்லாகச் செயல்படுகிறது. சூழலில் புலம்பலைக் குறிக்கும் ‘ஐயோ’ என்பதும் சாத்தியம் என்பதால் அது அடிக்குறிப்பில் வைக்கப்பட்டுள்ளது.
- source_word: אִשָּׁה אַלְמָנָה
  choice: நான் ஒரு விதவை
  rationale: எபிரேயத்தில் ‘விதவையான பெண்’ என்று அமைந்துள்ள சொற்றொடரை, பொருள் இழப்பின்றி இயல்பான தமிழில் ‘ஒரு விதவை’ என்று வழங்குகிறது.
- source_word: וַיָּמָת אִישִׁי
  choice: என் கணவர் இறந்துவிட்டார்
  rationale: இச்சூழலில் אִישִׁי என்பது ‘என் கணவர்’ என்று பொருள்படும். வினைச்சொல் அவர் இறந்த நிகழ்வைக் குறிக்கிறது; ‘இறந்துவிட்டார்’ என்பது அந்த நிகழ்வும் அதன் தற்போதைய விளைவும் தமிழில் இயல்பாக வெளிப்படச் செய்கிறது.
- source_word: הַמֶּלֶךְ
  choice: அரசன்
  rationale: குறிப்பிட்ட அரசனைக் குறிக்கும் எபிரேயச் சொல்லின் நேரான, சூழலுக்கேற்ற தமிழ் வடிவம்.
- source_word: וַיֹּאמֶר לָהּ
  choice: அவளிடம் … என்று கேட்டான்
  rationale: சொல்லாட்சியில் ‘அவளிடம் சொன்னான்’ என்றாலும், தொடர்ந்து வரும் கேள்வியின் பேச்சுச் செயலை இயல்பான தமிழில் ‘கேட்டான்’ என்று வெளிப்படுத்துகிறது.
- source_word: וַתֹּאמֶר
  choice: அதற்கு அவள் … என்றாள்
  rationale: எபிரேயக் கதைநடையின் தொடர்ச்சியை, தமிழில் இயல்பான பதில் அமைப்பான ‘அதற்கு அவள் … என்றாள்’ என்று வழங்குகிறது.
