  register: நவீன நிலையான தமிழில், இயல்பும் அரசவைக்குரிய கண்ணியமும் கொண்ட நடை. ‘உன்னைக் குறித்து’ என்பது சற்றே முறைசார்ந்ததாக இருந்தாலும், மூலத்தின் பொருள் நெகிழ்வைத் துல்லியமாகக் காக்கிறது.
