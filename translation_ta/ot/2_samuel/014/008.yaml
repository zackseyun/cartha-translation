base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/008.yaml
  text: Then the king said to the woman[a], “Go to your house, and I will give orders concerning you.”
translation:
  language: ta
  text: அப்போது அரசன் அந்தப் பெண்ணிடம், “நீ உன் வீட்டுக்குப் போ; உன்னைக் குறித்து நான் கட்டளையிடுவேன்[a]” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உனக்காக நான் கட்டளையிடுவேன்” / “உன் சார்பாக நான் ஆணை பிறப்பிப்பேன்.” எபிரெய முன்னிடைச்சொல்லை ஒன்றுக்கு மேற்பட்ட விதங்களில் புரிந்துகொள்ளலாம்; அரசன் அவளுடைய விவகாரம் தொடர்பாக உத்தரவிடுவான் என்பதே கருத்து.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: அப்போது ... என்றான்
  rationale: வாவ் தொடர்நிலை கதையை அடுத்த நிகழ்வுக்கு நகர்த்துகிறது; நவீன தமிழில் இயல்பான கதைத் தொடரை ‘அப்போது’ வெளிப்படுத்துகிறது.
- source_word: הַמֶּלֶךְ
  choice: அரசன்
  rationale: குறிப்பிட்ட அரசனைக் குறிக்கும் எபிரெய definite பெயர்ச்சொல்லின் நேரான, இயல்பான தமிழ் வடிவம்.
- source_word: הָאִשָּׁה
  choice: அந்தப் பெண்
  rationale: சூழலில் தாவீதிடம் பேசும் தெக்கோவாவைச் சேர்ந்த பெண்ணைக் குறிக்கிறது; இங்கு ‘மனைவி’ பொருந்தாது.
- source_word: לְכִי
  choice: நீ ... போ
  rationale: பெண்பால் ஒருமை ஏவல் வடிவம்; தமிழில் உரையாடலுக்கேற்ற தெளிவான கட்டளை.
- source_word: לְבֵיתֵךְ
  choice: உன் வீட்டுக்கு
  rationale: בַּיִת என்பதன் அடிப்படைப் பொருளான ‘வீடு’ என்பதைக் காத்து, இயல்பான தமிழில் தருகிறது.
- source_word: וַאֲנִי
  choice: நான்
  rationale: மூலத்தில் வெளிப்படையாக உள்ள முதலாம் நபர் சுட்டுப்பெயரைத் தக்கவைக்கிறது; தமிழ் வாக்கியத்தில் எழுவாயைச் சொல்லுவது அதன் வலியுறுத்தலையும் காக்கிறது.
- source_word: אֲצַוֶּה
  choice: கட்டளையிடுவேன்
  rationale: צוה என்பதன் பியேல் வடிவம் ‘கட்டளையிடுதல்/ஆணை பிறப்பித்தல்’ எனப் பொருள்படும்; அரசனின் அதிகாரபூர்வமான பேச்சுக்கு இது பொருத்தமானது.
- source_word: עָלָיִךְ
  choice: உன்னைக் குறித்து
  rationale: צוה உடன் வரும் עַל, ஒருவரையோ அவரது விவகாரத்தையோ குறித்துக் கட்டளையிடுவதைச் சுட்டலாம்; ‘உனக்காக’ என்று நன்மைசார் பொருளை மட்டும் நிர்ணயிக்காமல் மூலத்தின் நெகிழ்வை இது காக்கிறது.
