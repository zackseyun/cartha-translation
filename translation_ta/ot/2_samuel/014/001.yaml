base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/001.yaml
  text: Joab son of Zeruiah knew that the king’s heart was toward Absalom[a].
translation:
  language: ta
  text: செருயாவின் மகன் யோவாப், அரசனின் உள்ளம் அப்சலோமை நோக்கியிருந்ததை அறிந்தான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அரசன் அப்சலோமுக்காக ஏங்கினான்.” எபிரெயச் சொற்றொடர் சுருக்கமானது; பொதுவாக, “அரசனின் உள்ளம் அப்சலோமின்மேல் நிலைத்திருந்தது” என்றும் புரிந்துகொள்ளலாம். சிலர், “அப்சலோமுக்கு எதிராக இருந்தது” என்று எதிர்மறையாகப் புரிந்துகொள்கிறார்கள்; ஆனால் தொடர்ந்து வரும் சூழல் சாதகமான நாட்டத்தையே அதிகம் ஆதரிக்கிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֵּדַע
  choice: அறிந்தான்
  rationale: ידע என்பதன் இவ்வடிவம் கதையை முன்னெடுக்கிறது; இங்கு அதன் நேரடியான பொருள் ‘அறிந்தான்’. எபிரெயத்தில் வெளிப்படையான ‘இப்போது’ இல்லாததால் அதைச் சேர்க்கவில்லை.
- source_word: יוֹאָב בֶּן צְרֻיָה
  choice: செருயாவின் மகன் யோவாப்
  rationale: ஆள்பெயர்கள் தமிழில் வழக்கமான ஒலிபெயர்ப்பில் தரப்பட்டு, உறவுமுறை இயல்பான தமிழில் வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: כִּי
  choice: …தை
  rationale: யோவாப் அறிந்த செய்தியின் உள்ளடக்கத்தை அறிமுகப்படுத்துவதால், தமிழில் பெயரெச்ச-வேற்றுமை அமைப்பாக இயல்பாக மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: לֵב הַמֶּלֶךְ
  choice: அரசனின் உள்ளம்
  rationale: לֵב என்பது இங்கு அகநிலை, விருப்பம் அல்லது பாசப்போக்கைக் குறிக்கிறது. ‘உள்ளம்’ என்பதால் எபிரெய உருவகம் இயல்பான தமிழில் பாதுகாக்கப்படுகிறது.
- source_word: עַל
  choice: நோக்கியிருந்தது
  rationale: ‘உள்ளம்’ என்பதோடு வரும் עַל சுருக்கமானதும் சூழலில் ஓரளவு தெளிவற்றதுமாக உள்ளது. ‘நோக்கியிருந்தது’ திசைசார்ந்த பொருளைப் பாதுகாத்து, ஏக்கம், சாதகமான நாட்டம் அல்லது எதிர்ப்பு என்பதில் ஒன்றைத் தீர்மானமாகத் திணிக்காது.
- source_word: אַבְשָׁלוֹם
  choice: அப்சலோம்
  rationale: ஆள்பெயர் தமிழில் பரவலாக அறியப்பட்ட வடிவில் ஒலிபெயர்க்கப்பட்டுள்ளது.
theological_decisions:
- issue: அப்சலோமைப் பற்றிய அரசனின் மனப்போக்கின் தெளிவின்மை
  choice: அரசனின் உள்ளம் அப்சலோமை நோக்கியிருந்தது
  alternative: அரசன் அப்சலோமுக்காக ஏங்கினான்; அரசனின் உள்ளம் அப்சலோமுக்கு எதிராக இருந்தது
  rationale: எபிரெய சொற்றொடர் சுருக்கமானது; தாவீதின் மனப்போக்கு சாதகமானதா எதிர்மறையானதா என்பதை வெளிப்படையாகக் கூறவில்லை. தொடர்ந்து வரும் சூழல் சாதகமான நாட்டத்தை ஆதரித்தாலும், முதன்மை உரை மூலத்தின் தெளிவின்மையை இயன்றவரை பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் எளிமையும் கண்ணியமும் கொண்ட நடையில் மொழிபெயர்க்கப்பட்டது. ‘உள்ளம்’ என்ற இயல்பான தமிழ் சொல் மூலத்தின் இதய உருவகத்தையும் அகநிலைப் பொருளையும் காக்கிறது; ‘நோக்கியிருந்தது’ மூலத்தில் உள்ள நோக்குநிலையையும் தெளிவின்மையையும் பாதுகாக்கிறது.
