translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்கு எளிதாகப் புரியும் அதேவேளையில் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. ‘அழகான ஆண்’ என்பது ஆண் நபரின் தோற்றத்தை இயல்பாகக் குறிக்கிறது; ‘உள்ளங்கால் முதல் உச்சந்தலை வரை’ என்ற உடல் முழுமைச் சொல்லமைப்பு மூலத்தின் உருவகக் கட்டமைப்பைக் காக்கிறது.
