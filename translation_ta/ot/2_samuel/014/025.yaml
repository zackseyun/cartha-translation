  text: וּ/כְ/אַבְשָׁל֗וֹם לֹא הָיָ֧ה אִישׁ יָפֶ֛ה בְּ/כָל יִשְׂרָאֵ֖ל לְ/הַלֵּ֣ל מְאֹ֑ד מִ/כַּ֤ף רַגְל/וֹ֙ וְ/עַ֣ד קָדְקֳד֔/וֹ לֹא הָ֥יָה ב֖/וֹ מֽוּם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/025.yaml
  text: In all Israel there was not a man as handsome as Absalom[a], so highly praised; from the sole of his foot to the crown of his head there was no blemish in him.
translation:
  language: ta
  text: இஸ்ரவேல் முழுவதிலும் அப்சலோமைப்போல் அழகான ஆண் ஒருவனும் இல்லை; அவனுடைய அழகு மிகுந்த புகழைப் பெற்றது.[a] அவனுடைய பாதத்தின் அடிப்பகுதி முதல் தலை உச்சி வரை, அவன் உடலில் எந்தக் குறையும் இல்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மிகவும் புகழப்பட்டவன்,” அல்லது “மிகவும் புகழத்தக்கவன்.” எபிரெயச் சொற்றொடர் அப்சலோமின் தோற்றத்திற்குக் கிடைத்த அசாதாரணமான புகழின் அளவை வலியுறுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּכְאַבְשָׁלוֹם
  choice: அப்சலோமைப்போல்
  rationale: כְּ என்பதன் ஒப்பீட்டுப் பொருளை நேரடியாகக் காத்து, அப்சலோமுக்கு இணையான அழகுடையவர் யாரும் இல்லை என்ற வாக்கியத்தின் உயர்நிலை ஒப்பீட்டை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: לֹא הָיָה אִישׁ יָפֶה בְּכָל יִשְׂרָאֵל
  choice: இஸ்ரவேல் முழுவதிலும் ... அழகான ஆண் ஒருவனும் இல்லை
  rationale: எல்லா இஸ்ரவேலிலும் அப்சலோமுக்கு அழகில் இணையான ஆண் இல்லை என்ற எபிரெய உயர்நிலை ஒப்பீட்டின் பொருளைத் தெளிவாக அளிக்கிறது.
- source_word: לְהַלֵּל מְאֹד
  choice: அவன் மிகுந்த புகழைப் பெற்றான்
  rationale: அப்சலோமின் தோற்றம் மிக உயர்வாகப் புகழப்பட்டது என்ற தீவிரத்தை இயல்பான தமிழில் தெரிவிக்கிறது; எபிரெய சொற்றொடரின் மாற்று நேரடி வடிவங்கள் அடிக்குறிப்பில் தரப்பட்டுள்ளன.
- source_word: מִכַּף רַגְלוֹ
  choice: அவனுடைய உள்ளங்கால் முதல்
  rationale: கால் தொடர்பாக כַּף என்பது பாதத்தின் அடிப்பகுதியான உள்ளங்காலைக் குறிக்கிறது.
- source_word: וְעַד קָדְקֳדוֹ
  choice: உச்சந்தலை வரை
  rationale: קָדְקֹד என்பது தலையின் உச்சிப் பகுதியைக் குறிக்கிறது; உடல் முழுவதையும் சுட்டும் இருமுனைச் சொல்லமைப்பை இது காக்கிறது.
- source_word: לֹא הָיָה בוֹ מוּם
  choice: உடலில் ஒரு குறையும் இல்லை
  rationale: מוּם இச்சூழலில் உடலமைப்பிலுள்ள குறை அல்லது களங்கத்தைக் குறிக்கிறது; தமிழில் இயல்பாகவும் உடல் சார்ந்த பொருள் தெளிவாகவும் இவ்வாறு வழங்கப்பட்டுள்ளது.
