- from: இஸ்ரவேல் முழுவதிலும் அப்சலோமைப்போல் அழகான ஆண் ஒருவனும் இல்லை; அவன் மிகுந்த புகழைப் பெற்றான்.[a] அவனுடைய உள்ளங்கால் முதல் உச்சந்தலை வரை உடலில் ஒரு குறையும் இல்லை.
