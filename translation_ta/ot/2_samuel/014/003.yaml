  naturalness: ‘பின்பு அரசனிடம் சென்று, அவனிடம் இவ்விதமாகப் பேசு’ நவீன தரத் தமிழில் இயல்பாகவும் கண்ணியமான கதைநடையிலும் உள்ளது. ‘அவள் வாயில் அந்த வார்த்தைகளை வைத்தான்’ என்பது மூல உருவகத்தைத் தக்கவைத்தாலும் தமிழில் புரியக்கூடியதாக உள்ளது.
  terminology: ‘அரசன்’, ‘வார்த்தைகள்’, ‘வாயில் வைத்தான்’ ஆகியவை சூழலுக்கும் மூலத்தின் சொல்லாட்சிக்கும் பொருத்தமானவை. அடிக்குறிப்பு உருவகத்தின் நோக்கத்தை விளக்குகிறது; உரையின் பொருளைத் தேவையின்றி விரிவுபடுத்தவில்லை.
