translation_notes:
  register: நவீன தரத் தமிழில், கண்ணியமான ஆனால் எளிதில் புரியும் நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. பெண்ணை நோக்கிய எபிரெய கட்டளை வடிவத்துக்குத் தமிழில் தனிப் பாலின வடிவம் இல்லாததால், இயல்பான ஒருமை கட்டளையான ‘பேசு’ பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் ‘வாயில் வார்த்தைகளை வைத்தான்’ என்ற உயிரோட்டமான மரபுத்தொடர் உரையில் காக்கப்பட்டு, அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது.
