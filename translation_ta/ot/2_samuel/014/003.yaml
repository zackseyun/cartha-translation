  text: וּ/בָאת֙ אֶל הַ/מֶּ֔לֶךְ וְ/דִבַּ֥רְתְּ אֵלָ֖י/ו כַּ/דָּבָ֣ר הַ/זֶּ֑ה וַ/יָּ֧שֶׂם יוֹאָ֛ב אֶת הַ/דְּבָרִ֖ים בְּ/פִֽי/הָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/003.yaml
  text: Then go to the king and speak to him in this way[a]. And Joab put the words in her mouth.
translation:
  language: ta
  text: பின்பு அரசனிடம் சென்று, அவனிடம் இவ்விதமாகப் பேசு.[a] யோவாப் அவள் வாயில் அந்த வார்த்தைகளை வைத்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அவள் வாயில் வார்த்தைகளை வைத்தான்” என்பது, அவள் சொல்ல வேண்டிய பேச்சை யோவாப் அவளுக்குக் கற்றுக்கொடுத்தான் என்று பொருள்படும் எபிரெய மரபுத்தொடர்.
    reason: cultural_note
lexical_decisions:
- source_word: וּבָאת
  choice: பின்பு ... சென்று
  rationale: அறிவுறுத்தல் தொடரில் வரும் 2ஆம் நபர் பெண்பால் வினைவடிவம் அடுத்த செயலைக் கட்டளையாகக் காட்டுகிறது; நவீன தமிழில் இயல்பான தொடர்முறையை இது தருகிறது.
- source_word: אֶל־הַמֶּלֶךְ
  choice: அரசனிடம்
  rationale: אֶל குறிக்கும் ஒருவரை நோக்கிய இயக்கத்தை இயல்பான தமிழில் நேரடியாக வெளிப்படுத்துகிறது.
- source_word: וְדִבַּרְתְּ אֵלָיו
  choice: அவனிடம் ... பேசு
  rationale: דבר உடன் אֶל என்பது ‘ஒருவரிடம் பேசுதல்’ என்பதைக் குறிக்கிறது; சொல்லின் நேரடியான பொருளும் கட்டளைத் தன்மையும் காக்கப்படுகின்றன.
- source_word: כַּדָּבָר הַזֶּה
  choice: இவ்விதமாக
  rationale: யோவாப் கற்றுக்கொடுத்த பேச்சின் முறை அல்லது உள்ளடக்கத்தைச் சுட்டுகிறது; ‘இந்த வார்த்தையின்படி’ என்ற செயற்கையான மொழிபெயர்ப்பைவிட இயல்பானது.
- source_word: וַיָּשֶׂם
  choice: வைத்தான்
  rationale: שׂים என்பதன் அடிப்படைப் பொருளான ‘வை’ என்பதைக் காத்து, அடுத்துள்ள உருவகச் சொல்லாட்சியையும் பாதுகாக்கிறது.
- source_word: אֶת־הַדְּבָרִים
  choice: அந்த வார்த்தைகளை
  rationale: இங்கு பன்மை வடிவம் யோவாப் அவளுக்குக் கொடுத்த குறிப்பிட்ட பேச்சுச் சொற்களைக் குறிக்கிறது.
- source_word: בְּפִיהָ
  choice: அவள் வாயில்
  rationale: என்ன பேசவேண்டும் என்பதை ஒருவருக்குக் கற்றுக்கொடுப்பதைக் குறிக்கும் எபிரெய உருவகத்தை நேரடியாகத் தக்கவைக்கிறது.
