translation_notes:
  register: நவீன பொதுத்தரத் தமிழில், வரலாற்று அரசவைக்கேற்ற கண்ணியமான நடையும் சாதாரண வாசகர்களுக்குப் புரியும் இயல்பான சொற்றொடர்களும் பயன்படுத்தப்பட்டுள்ளன. “அரசர்” மரியாதைக் குறிப்பாகவும் “அரசே” நேரடி அழைப்பாகவும் அமைந்துள்ளது.
