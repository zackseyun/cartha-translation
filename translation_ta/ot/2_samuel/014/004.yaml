  text: וַ֠/תֹּאמֶר הָ/אִשָּׁ֤ה הַ/תְּקֹעִית֙ אֶל הַ/מֶּ֔לֶךְ וַ/תִּפֹּ֧ל עַל אַפֶּ֛י/הָ אַ֖רְצָ/ה וַ/תִּשְׁתָּ֑חוּ וַ/תֹּ֖אמֶר הוֹשִׁ֥עָ/ה הַ/מֶּֽלֶךְ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/004.yaml
  text: Then the woman from Tekoa spoke to the king[a]. She fell with her face to the ground and bowed down, and she said, “Save me[b], O king!”
translation:
  language: ta
  text: அப்போது தெக்கோவாவைச் சேர்ந்த அந்தப் பெண் அரசரிடம் பேசினாள்.[a] அவள் முகங்குப்புறத் தரையில் விழுந்து பணிந்து, “அரசே, என்னைக் காப்பாற்றுங்கள்![b]” என்றாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இன்னும் சொல்லுக்குச் சொல் வடிவில், “தெக்கோவியப் பெண்.”
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில், “அரசே, காப்பாற்றுங்கள்!” செயப்படுபொருளான “என்னை” என்பது சூழலில் உட்பொருளாக உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאִשָּׁה הַתְּקֹעִית
  choice: தெக்கோவாவைச் சேர்ந்த அந்தப் பெண்
  rationale: பெண்பால் குடியிடப் பெயரடை அவள் தெக்கோவாவைச் சேர்ந்தவள் என்பதைக் குறிக்கிறது; இந்த வடிவம் நவீன தமிழில் இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: וַתֹּאמֶר ... אֶל הַמֶּלֶךְ
  choice: அரசரிடம் பேசினாள்
  rationale: முதல் וַתֹּאמֶר அரசரை அணுகிப் பேசுவதைக் குறிக்கிறது; வசனத்தின் பிந்தைய நேரடிக் கூற்றை அறிமுகப்படுத்தும் வினையிலிருந்து இதை இயல்பாக வேறுபடுத்துகிறது.
- source_word: וַתִּפֹּל עַל אַפֶּיהָ אַרְצָה
  choice: முகங்குப்புறத் தரையில் விழுந்து
  rationale: முகத்தைத் தரை நோக்கி வைத்து விழும் ஆழ்ந்த விண்ணப்ப நிலையைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: וַתִּשְׁתָּחוּ
  choice: பணிந்து
  rationale: மரியாதை அல்லது விண்ணப்பத்தின் அடையாளமாகத் தாழ்ந்து வணங்குவதைச் சொல்கிறது; வழிபாடு என்ற சிறப்புப் பொருளைத் தேவையின்றி புகுத்தவில்லை.
- source_word: הוֹשִׁיעָה
  choice: என்னைக் காப்பாற்றுங்கள்
  rationale: יָשַׁע வேரிலுள்ள கட்டளை வடிவம் மீட்பு வேண்டுதலைக் குறிக்கிறது. எபிரெயத்தில் வெளிப்படாத செயப்படுபொருள் சூழலால் அந்தப் பெண்ணையே குறிக்கிறது; தமிழில் அதை வெளிப்படுத்துவது இயல்பானது.
- source_word: הַמֶּלֶךְ
  choice: அரசே
  rationale: நேரடி அழைப்பில் உள்ள மரியாதையையும் அவசரமான விண்ணப்பத் தொனியையும் இயல்பான தமிழ் விளிவடிவம் காக்கிறது.
