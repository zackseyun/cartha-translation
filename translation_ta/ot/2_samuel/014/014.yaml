base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/014.yaml
  text: For we must surely die and are like water poured out on the ground[a], which cannot be gathered up again. Yet God does not take away life[b], but devises plans so that the banished one will not remain banished from him.
translation:
  language: ta
  text: ஏனெனில் நாம் நிச்சயமாகச் சாவோம்; மீண்டும் சேகரிக்க முடியாதபடி தரையில் சிந்தப்பட்ட தண்ணீரைப் போன்றவர்கள் நாம். ஆனாலும் கடவுள் உயிரை எடுத்துக்கொள்வதில்லை[a]; தம்மிடமிருந்து துரத்தப்பட்டவர் தொடர்ந்து துரத்தப்பட்டவராகவே இருக்காதபடி அவர் திட்டங்களை வகுக்கிறார்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கடவுள் ஒருவருக்குப் பாரபட்சம் காட்டுவதில்லை.” எபிரெயச் சொற்றொடர் கடினமானது; சிலர் இதை வேறுவிதமாகப் புரிந்துகொள்கிறார்கள்.
    reason: alternative_reading
  - marker: b
    text: அல்லது, “தம்மிடமிருந்து துரத்தப்பட்ட ஒருவர் அவரிடமிருந்து தொடர்ந்து துரத்தப்படாதபடி.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: நாம் சாவது உறுதி
  rationale: முந்தைய கருத்துக்கான காரணத்தை அறிமுகப்படுத்துகிறது; தமிழில் இயல்பான வாதத் தொடரை உருவாக்க வாக்கியத்தின் தொடக்கத்தோடு இணைக்கப்பட்டது.
- source_word: מוֹת נָמוּת
  choice: நாம் சாவது உறுதி
  rationale: முற்றுப்பெயர்–வினை வடிவத்தின் வலியுறுத்தல், மரணத்தின் தவிர்க்க முடியாத உறுதியை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: וְכַמַּיִם הַנִּגָּרִים אַרְצָה
  choice: தரையில் சிந்தப்பட்ட தண்ணீரைப் போன்றவர்கள் நாம்
  rationale: தரையில் ஊற்றப்பட்ட நீரை மீட்டெடுக்க இயலாத உருவகத்தைத் தெளிவாகவும் இயல்பாகவும் காக்கிறது.
- source_word: אֲשֶׁר לֹא יֵאָסֵפוּ
  choice: மீண்டும் சேர்த்தெடுக்க முடியாதபடி
  rationale: நீரை மறுபடியும் சேகரிக்க இயலாத நிலையைக் காட்டும் எபிரெயச் செயலற்ற வடிவத்தின் பொருளைத் தமிழில் தெளிவுபடுத்துகிறது.
- source_word: וְלֹא יִשָּׂא אֱלֹהִים נֶפֶשׁ
  choice: ஆனாலும் கடவுள் உயிரைப் பறித்துவிடுவதில்லை
  rationale: கடினமான இச்சொற்றொடரை உடனடிச் சூழலில் மரணத்திற்கும் மீட்டுக்கொள்ளுதலுக்கும் இடையிலான எதிர்மறையாகப் புரிந்துகொள்கிறது; נֶפֶשׁ என்பதை இங்கு உயிருள்ள நபரின் ‘உயிர்’ என வழங்குகிறது.
- source_word: וְחָשַׁב מַחֲשָׁבוֹת
  choice: அவர் திட்டங்களை வகுக்கிறார்
  rationale: ஒரே வேர் கொண்ட எபிரெயச் சொற்களின் இணைப்பு நோக்கமுள்ள திட்டமிடுதலைக் குறிக்கிறது; தமிழில் ‘திட்டங்களை வகுக்கிறார்’ இயல்பாக உள்ளது.
- source_word: לְבִלְתִּי יִדַּח
  choice: தொடர்ந்து அந்நிலையிலேயே இருந்துவிடாதபடி
  rationale: துரத்தப்பட்ட நிலை தொடராமல் அதை மாற்றுவதற்கான நோக்கத்தை வெளிப்படுத்துகிறது; வெறும் நிகழ்வை விட நிலையின் நீடிப்பைச் சூழலுக்கேற்ப எடுத்துரைக்கிறது.
- source_word: מִמֶּנּוּ נִדָּח
  choice: தம்மிடமிருந்து துரத்தப்பட்டவர்
  rationale: சுருக்கமான எபிரெய அமைப்பிலுள்ள உறவையும் பிரிவையும் தெளிவாகக் காக்கிறது; ‘தம்மிடமிருந்து’ என்பது கடவுளைக் குறிக்கும் மரியாதைமிக்க தற்சுட்டு வடிவம்.
theological_decisions:
- issue: וְלֹא יִשָּׂא אֱלֹהִים נֶפֶשׁ என்பதன் பொருள்
  choice: கடவுள் உயிரைப் பறித்துவிடுவதில்லை
  alternative: கடவுள் ஒருவருக்குப் பாரபட்சம் காட்டுவதில்லை
  rationale: இறப்பு, பிரிவு, மீட்பு ஆகியவற்றை இணைக்கும் உடனடிச் சூழலில் ‘உயிரைப் பறித்தல்’ என்ற வாசிப்பு பொருத்தமாக உள்ளது. ஆயினும் எபிரெயச் சொற்றொடர் அரிதும் கடினமும் என்பதால் பாரபட்சம் குறித்த மாற்று வாசிப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: לְבִלְתִּי יִדַּח ... נִדָּח என்பதிலுள்ள துரத்தப்படுதலின் நிலை அல்லது செயல்
  choice: துரத்தப்பட்டவர் தொடர்ந்து அந்நிலையிலேயே இருந்துவிடாதபடி
  alternative: துரத்தப்பட்ட ஒருவர் தம்மிடமிருந்து மேலும் துரத்தப்படாதபடி
  rationale: முதன்மை உரை மீளிணைப்பை நோக்கிய நிலைமாற்றத்தை வெளிப்படுத்துகிறது; எபிரெயச் செயலற்ற வினையின் நேரடியான வாசிப்பு மாற்றாக அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும், வேதாகம வாசிப்புக்கு ஏற்ற கண்ணியமான நடையிலும் மொழிபெயர்க்கப்பட்டது. ‘சாவது உறுதி’ மரணத்தின் தவிர்க்க முடியாத தன்மையை எளிதில் புரியச் செய்கிறது; ‘தம்மிடமிருந்து’ மரியாதையையும் உறவுசார் பிரிவையும் காக்கிறது. மூலத்தின் கடினமான இறையியல் சொற்றொடர் அடிக்குறிப்புடன் திறந்தவாறே வைக்கப்பட்டுள்ளது.
