  source_fidelity: மூல எபிரெயத்தின் கதைத் தொடரான “யோவாப் எழுந்து ... வீட்டுக்குச் சென்று” என்பதும், அப்சலோமிடம் முன்வைக்கப்படும் காரண வினாவும் துல்லியமாகப் பிரதிபலிக்கப்பட்டுள்ளன. பன்மை வினைச்சொல்லுக்கு ஏற்ப עֲבָדֶךָ “உன் பணியாளர்கள்” எனப் பொருத்தமாக உள்ளது. “என் வயலுக்கு தீ வைத்தார்கள்” என்பது הַחֶלְקָה אֲשֶׁר לִי בָּאֵשׁ என்பதன் இயல்பான, பொருள்நிறைந்த தமிழ் வடிவமாகும்.
  naturalness: நடை நவீன நிலையான தமிழில் தெளிவாகவும் இயல்பாகவும் உள்ளது. “என்று கேட்டான்” நேரடி வினாவைத் தமிழில் சீராக இணைக்கிறது; மூலத்தின் “said” என்பதைக் கருத்தில் எந்த மாற்றமும் ஏற்படுத்தவில்லை.
  terminology: யோவாப், அப்சலோம் ஆகிய பெயர்கள் வழக்கமான தமிழ் வேதாகமப் பயன்பாட்டுக்கு ஏற்றவை. “பணியாளர்கள்,” “வயல்,” “தீ வைத்தார்கள்” ஆகியவை சூழலுக்கும் பதிவுக்கும் பொருந்துகின்றன.
