base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/031.yaml
  text: Then Joab arose and went to Absalom’s house and said to him[a], “Why have your servants set my field on fire?”
translation:
  language: ta
  text: அப்போது யோவாப் எழுந்து அப்சலோமின் வீட்டுக்குச் சென்று அவனிடம், “உன் பணியாளர்கள் என் வயலுக்கு ஏன் தீ வைத்தார்கள்?” என்று கேட்டான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּקָם
  choice: அப்போது யோவாப் எழுந்து
  rationale: வழக்கமான எபிரெயக் கதைத் தொடரை முன்னெடுக்கும் wayyiqtol வடிவத்தை ‘அப்போது’ இயல்பாகக் காட்டுகிறது; ‘எழுந்து’ செயலை நேரடியாகப் பாதுகாக்கிறது.
- source_word: וַיָּבֹא אֶל אַבְשָׁלוֹם הַבָּיְתָה
  choice: அப்சலோமின் வீட்டுக்குச் சென்று
  rationale: திசையைக் குறிக்கும் הַבָּיְתָה இங்கு வீட்டை நோக்கிய இயக்கத்தைக் காட்டுகிறது; சூழலில் அது அப்சலோமின் வீடு என்பதால் இந்தத் தமிழ் வடிவம் இயல்பாக உள்ளது.
- source_word: לָמָּה
  choice: ஏன்
  rationale: நேரடியான காரண வினாவை நவீனத் தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: הִצִּיתוּ
  choice: தீ வைத்தார்கள்
  rationale: יצת என்பதன் Hiphil வடிவம் தீ மூட்டுதல் அல்லது எரியவைத்தலைக் குறிக்கிறது; ‘தீ வைத்தார்கள்’ காரணவினை உணர்வை இயல்பான தமிழில் தருகிறது.
- source_word: עֲבָדֶךָ
  choice: உன் பணியாளர்கள்
  rationale: பெயர்ச்சொல் வடிவத்தில் ஒருமைத் தோற்றம் இருந்தாலும் பன்மை வினைச்சொல் பலரைச் சுட்டுகிறது. இச்சூழலில் ‘பணியாளர்கள்’ சமூக உறவைத் தெளிவாகக் காட்டுகிறது; ‘அடிமைகள்’ என்ற வலுவான பொருளைத் தேவையின்றி முன்வைப்பதில்லை.
- source_word: הַחֶלְקָה אֲשֶׁר לִי
  choice: என் வயல்
  rationale: ‘எனக்குச் சொந்தமான நிலப்பகுதி’ என்ற முழுப் பொருளை, வேளாண் சூழலுக்கு ஏற்ற இயல்பான தமிழில் ‘என் வயல்’ என்று சுருக்கமாகத் தருகிறது.
- source_word: בָּאֵשׁ
  choice: தீ வைத்தார்கள்
  rationale: எபிரெயச் சொல்லில் தீ கருவி அல்லது வழிமுறையாகக் குறிக்கப்படுகிறது; தமிழில் ‘வயலுக்கு தீ வைத்தார்கள்’ என்பது அதற்கான இயல்பான சொற்றொடர்.
